      - number: '2.4'
        title: Growth drivers, constraints, and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The market’s strongest structural drivers are regulatory digitization, cloud migration, AI-enabled
              workflow automation, and real-time payment infrastructure. ViDA gives a concrete policy tailwind by
              enabling national e-invoicing mandates earlier and setting digital reporting milestones for cross-border
              B2B transactions from 2030. AP and expense market reports repeatedly cite e-invoicing, compliance, fraud
              detection, and embedded payments as reasons buyers are moving from paper-heavy processes toward integrated
              workflow platforms. Real-time rails matter too: the Federal Reserve describes FedNow as a seconds-based,
              always-on infrastructure, and the ECB frames instant payments as a ten-second experience that supports
              European harmonization and innovation. The main constraints are just as important. Market reports
              repeatedly flag switching and integration costs with legacy ERPs, security and data-residency concerns,
              AML/KYC friction in cross-border payments, and the fact that large enterprises still dominate spending
              today. That implies a very specific underwriting view for Tipalti. The market is not constrained by lack
              of use case; it is constrained by change management, systems integration, compliance complexity, and
              proving ROI quickly enough for finance leaders to replace entrenched habits. The core diligence gap is
              therefore not whether the market is big, but which portion of the mid-market will actually standardize on
              an integrated invoice-to-pay stack instead of sticking with ERP modules, bank portals, or point solutions.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
