  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR bridge disappoints
        - Audited ARR and revenue quality land only marginally above the public >$200M floor
        - The old $8.3B anchor becomes indefensible and even the base case moves lower.
        - Reprice closer to the bear range or walk away.
      - - Retention or cohort quality weakens
        - NRR or cohort renewals fail to support a software-style premium
        - Tipalti stops looking like a compounding automation platform and starts looking more like a volume business.
        - Compress the multiple toward payments medians.
      - - Preference stack is heavier than expected
        - Liquidation terms or side letters absorb much of any sub-$4B exit
        - Headline valuation overstates common-equity outcomes.
        - Demand structure, lower entry price, or both.
      - - Debt terms constrain flexibility
        - Covenants, amortization, or liquidity restrictions narrow strategic options
        - The 2025 facility stops being bridge capital and becomes downside leverage.
        - Lower valuation, tighten diligence, or avoid.
      - - AI does not improve economics
        - AI remains a story layer without implementation, margin, or retention lift
        - The premium case for software-like valuation collapses.
        - Move to the low end of the range.
      - - IPO readiness is weaker than advertised
        - No audited public-company package, weak governance readiness, or poor guidance discipline
        - Liquidity path gets pushed out and late-stage private premium should compress.
        - Treat the company as a longer-duration private hold with a lower current value.
    notes: >-
      These are valuation-moving triggers: each one changes price support, not merely the narrative tone around the
      company.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV040
      - CV048
      - CV052
      - CV054
      - CV056
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - ARR and revenue bridge
        - Audited ARR, revenue, and gross-margin bridge by product and segment
        - Separates a software premium case from a payment-volume case.
        - CFO pack plus auditor-reviewed bridge.
      - - Retention quality
        - NRR, GRR, logo retention, and cohort expansion by customer band
        - Determines whether Tipalti deserves compounding-software valuation rather than payments multiples.
        - Revenue-operations dashboard and board metrics.
      - - Current fair value
        - 2026 409A, tender or secondary marks, and board valuation memos
        - Converts the stale 2021 mark into an actual current price signal.
        - Finance team, board materials, and transfer-agent data.
      - - Debt economics
        - Hercules covenants, amortization schedule, and liquidity restrictions
        - Clarifies whether the debt is cheap bridge capital or a hidden downside amplifier.
        - Treasury team, credit agreement, and lender compliance reports.
      - - Cap table and preferences
        - Latest capitalization table, liquidation preferences, warrants, and side letters
        - Tests whether common-equity returns diverge sharply from headline valuation.
        - Legal counsel and cap-table administrator.
      - - IPO readiness package
        - SOX readiness, audit cadence, board committees, guidance process, and IR buildout
        - Selective 2026 IPO markets reward readiness, not just private-company scale.
        - CFO, GC, external advisors, and IPO project plan.
    notes: >-
      These are the minimum files needed to turn Tipalti from a compelling late-stage story into an underwritable
      valuation decision.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV052
      - CV054
