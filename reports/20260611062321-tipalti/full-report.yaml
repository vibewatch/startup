        title: Platform scope and customer workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a genuinely broad finance-operations footprint rather than a single-point AP
              tool. Tipalti consistently describes the platform as covering accounts payable, global payments,
              procurement, expenses, cards, supplier management, tax compliance, and now treasury, and those claims are
              backed by separate product pages rather than one vague homepage paragraph. The strongest proof is around
              core AP workflows: supplier onboarding, invoice capture, PO matching, approval routing, payment execution,
              and reconciliation are all described as one connected motion, while procurement and expenses are presented
              as adjacent workflows that share data, approvals, and reimbursement or payment rails. Cards are no longer
              just a generic spend-control mention either; the help center documents distinct virtual and physical card
              products, and the Q1 2026 release notes tie invoice cards into existing controls, ERP sync, and even
              cashback economics. The result is a platform that appears well aligned with controller and AP-team jobs,
              but with a product map that is expanding outward into card monetization and treasury faster than public
