chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Tipalti presents itself as an AI-powered finance automation platform rather than a single-purpose AP tool.
              Across its company, homepage, accounts-payable, global-payouts, and mass-payments materials, the company
              consistently describes a connected suite spanning accounts payable, procurement, employee expenses, cards,
              supplier management, tax compliance, treasury, and global payments. The positioning matters because it
              frames Tipalti as workflow infrastructure for the office of the CFO, not just invoice automation. Public
              materials also show a clear focus on mid-market and high-velocity businesses that are complex enough to
              need multi-entity controls and global payment reach but still want a unified SaaS control plane instead of
              stitching together separate tools. The geographic footprint is also meaningful. Tipalti’s company page and
              2022-2023 announcements show headquarters in Foster City, California, with an operating footprint spanning
              London, Tel Aviv, Toronto, Vancouver, Tbilisi, and the Netherlands. Official privacy-language confirms a
              multi-entity legal structure that includes Tipalti, Inc., Tipalti Solutions LTD, Tipalti Payments, Inc.,
              Tipalti Europe LTD, Tipalti Canada, Inc., and Tipalti B.V. That legal and office spread is consistent with
              Tipalti’s product promise: supporting global supplier and payee workflows in 120 currencies across more
              than 200 countries and territories through bank and card partners such as Citi, Wells Fargo, J.P. Morgan,
              and Visa.
