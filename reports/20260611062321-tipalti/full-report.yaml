        title: Exhibits
        blocks:
          - type: callout
            title: Tipalti has grown from AP tooling into a broader CFO platform story
            body: >-
              The product set visible in current official materials is substantially broader than classic bill pay.
              Tipalti now packages AP, global payouts, procurement, employee expenses, cards, tax, supplier management,
              and treasury under one operating umbrella, which strengthens the company’s position with mid-market
              finance leaders who want fewer system handoffs.
