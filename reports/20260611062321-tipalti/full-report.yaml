  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Tipalti should not be sized against a single undifferentiated market bucket. The operating problem it
              solves sits at the intersection of accounts payable automation, B2B payment orchestration, procurement
              workflow, and expense or spend controls. The narrowest lens is AP automation: invoice capture, coding,
              approval routing, matching, supplier validation, payment scheduling, and reconciliation. Tipalti’s own
              educational material reinforces that definition, explicitly linking AP automation to supplier onboarding,
              OCR and AI data capture, approval workflows, payment execution, and reconciliation. That is broader than
              simple invoice imaging but narrower than an enterprise-wide ERP replacement. The relevant adjacencies
              matter because they determine who buys, how budgets are framed, and why vendors converge. Procurement
              software governs purchase requests, supplier workflows, policy controls, and procure-to-pay orchestration.
              Expense management governs employee-initiated spend and reimbursement. B2B payments infrastructure governs
              how approved obligations actually move across ACH, wire, card, or cross-border rails. In practice, finance
              teams often start with manual substitutes—email approvals, spreadsheet tracking, shared inboxes, ERP
              workarounds, check runs, and bank-portal wires—before expanding into integrated software. Vendor pages
              from BILL, Ramp, and Stampli show the same market pattern: AP is now sold as AI-assisted workflow plus
              payment execution, not just invoice digitization.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
