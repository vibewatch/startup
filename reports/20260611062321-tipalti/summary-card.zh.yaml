summary:
  headline: Tipalti 已经是有真实规模的 fintech 平台，产品深、客户采用也扎实；但受监管支付敞口、债务融资扩张、裁员和 2021 年估值锚点过旧叠加，管理层证明当前经济性和公允价值之前，只能列为继续研究标的。
