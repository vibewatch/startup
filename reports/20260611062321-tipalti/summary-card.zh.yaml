  shortDescription: >-
    Tipalti is a private finance-automation platform for mid-market and global businesses that combines accounts
    payable, supplier onboarding, cross-border payouts, procurement, expenses, cards, tax compliance, and treasury
    workflows. Public evidence shows real scale—more than $200 million ARR, 5,000+ customers, and roughly $75 billion in
    annualized payment volume—but current underwriting is constrained by stale equity price discovery, debt-funded
    expansion, and limited disclosure on margins, covenants, and retention.
