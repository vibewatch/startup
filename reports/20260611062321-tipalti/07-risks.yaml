  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: license-inventory
    missingEvidence: A full jurisdiction-by-jurisdiction license roster, NMLS identifiers, renewal calendar, and any examination findings.
    whyItMatters: This is the core thesis-break risk because payout continuity depends on maintaining permissions to move money and satisfying supervisors and partner banks.
    diligencePath: Ask management for a board-level licensing schedule, renewal tracker, and any open remediation items from regulators or partner banks.
    relatedQuestionRefs:
    - QR027
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration, NRR / GRR, churn by segment, and support burden by customer tier.
    whyItMatters: Mid-market refocus can improve quality or hide concentration; without concentration and retention data, customer-risk severity cannot be fully calibrated.
    diligencePath: Request customer cohort tables, top-10 revenue share, renewal history, and segment-level support / implementation metrics.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Debt covenants, permitted leverage, interest burden, amortization profile, and minimum-liquidity requirements for the Hercules facility.
    whyItMatters: Debt can be a helpful non-dilutive tool or a hidden constraint on product and go-to-market investment; public press does not answer that.
    diligencePath: Request financing documents or lender summary, then model covenant headroom under slower growth and margin compression scenarios.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: minor
    topic: incident-history
    missingEvidence: A management-provided incident log with RCA severity, customer impact, and remediation detail beyond public uptime snapshots.
    whyItMatters: External status pages show only current state and broad health signals, not the severity distribution of past operational failures.
    diligencePath: Request the last 12–24 months of Sev-1 / Sev-2 incidents, RCA summaries, support backlog metrics, and any customer service-credit history.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR002
  - type: stale
    severity: minor
    topic: competitive-win-rate
    missingEvidence: Current win-loss and module attach-rate data showing whether Tipalti’s AI and workflow breadth are holding share against Ramp, Coupa, SAP Concur, BILL, and Brex.
    whyItMatters: Competitor marketing is current and aggressive, but public materials do not show whether Tipalti’s AI investments are converting into measurable commercial advantage.
    diligencePath: Request recent enterprise win-loss analyses, pricing pressure trends, attach rates by module, and churn reasons by segment.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR004
    - TR005
