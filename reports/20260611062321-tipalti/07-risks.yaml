- id: compliance-platform-risk
  title: Compliance, legal, and platform risk
  body: 'Public evidence shows Tipalti has invested materially in compliance documentation and control messaging. The company publishes a legal hub, privacy policy, and EU DPA, and it markets SOC control coverage, encryption, MFA, audit logs, OFAC / Do Not Pay screening, fraud detection, tax validation, and recovery procedures (CR004, CR005, CR006, CR002, CR012, CR013, CR014). Those mitigants matter, but they do not fully close the downside because the public file still lacks a complete jurisdiction-by-jurisdiction license inventory, a clear partner-bank roster with contingency detail, and incident-history disclosure beyond external uptime monitors (CR037, CR038, CR039, CR046). In practice, that means investors should underwrite residual exposure to money-transmission examinations, sanctions slips, payout holds, or data/privacy failures until management provides primary diligence materials. Review-site evidence reinforces the operational side of this risk stack: customers can value automation
    while still reporting complicated setup, pricing friction, and manual workarounds, which is exactly the sort of hidden delivery drag that can surface when a compliance-heavy product is rolled out across many geographies and systems (CR020, CR021, CR040).'
