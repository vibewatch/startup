- id: mitigations-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: 'The mitigants in the public record are real: Tipalti publishes legal and privacy documents, markets security and screening controls, and continues to ship AI, card, treasury, and workflow updates (CR002, CR004, CR005, CR012, CR018, CR032, CR038). But the correct underwriting posture is conditional, not unconditional. Investors should require management to prove three things before getting comfortable with aggressive underwriting: first, that license coverage, partner-bank oversight, and AML governance are complete enough to survive adverse regulatory review; second, that support, implementation, and uptime quality stay stable while the platform expands; and third, that debt-funded AI expansion is converting into durable enterprise growth despite more intense competition and workforce resets (CR037, CR039, CR040, CR041, CR042, CR043, CR044). Kill criteria therefore need to be objective. A failed or delayed license renewal, a material sanctions or screening issue, a sustained payout
    availability incident, a measurable deterioration in implementation/support performance, or evidence that debt service is constraining product or go-to-market investment should all force a reset in conviction. Until the undisclosed concentration, covenant, and licensing details are produced, this chapter should be treated as a monitored risk case rather than a cleared risk case (CR045, CR046).'
