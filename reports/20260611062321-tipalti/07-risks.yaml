- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Licensing / AML / sanctions
    - License renewal status, exam outcomes, partner-bank notices
    - Any failed renewal, material exam finding, or sanctions-control issue
    - Pause underwriting until management provides remediation and regulator / partner comfort
  - - Payout continuity
    - Payments uptime, incident count, RCA severity
    - Repeated or prolonged payout incidents, especially across quarter close or payroll-like cycles
    - Reduce conviction; treat operations as a gating risk rather than a scaling strength
  - - Implementation / support drag
    - Average implementation time, ticket backlog, support SLA attainment
    - Meaningful deterioration in deployment time or support responsiveness
    - Assume slower expansion and higher churn risk in enterprise cohorts
  - - AI feature race
    - Attach rates, win-loss data, roadmap slippage against peers
    - AI features ship without measurable upsell, retention, or win-rate improvement
    - Re-rate product narrative; do not pay premium for AI positioning alone
  - - Mid-market refocus
    - New-logo mix, customer segment mix, sales productivity
    - Mid-market mix rises but net retention or productivity does not improve
    - Treat reorg as a sign of weaker demand quality rather than strategic sharpening
  - - Debt burden
    - Covenant headroom, interest expense, cash burn, runway
    - Debt service begins constraining R&D, GTM, or support investment
    - Expect valuation reset and possible financing overhang
  - - Partner dependency
    - Bank / ERP / platform partner notices or outages
    - Loss of major partner support, certification, or banking capacity
    - Re-evaluate delivery resiliency and customer expansion assumptions
  - - Concentration visibility gap
    - Management willingness to disclose customer, partner-bank, and license concentration
    - No diligence disclosure on concentration or license roster after investor request
    - Treat as unresolved thesis blocker, not a mere follow-up item
  notes: Kill criteria are framed as monitorable events so the chapter can inform an investment committee, not just a narrative memo.
