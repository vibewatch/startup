- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - AI decision defensibility
    - Material complaint, regulator query, or bad-faith discovery tied to automated workflow
    - One substantiated high-severity event
    - Pause valuation optimism and demand legal/governance deep dive
  - - Security/privacy
    - Breach, ransomware event, or critical vendor disclosure
    - Any material claimant-data incident
    - Escalate to security diligence and re-underwrite downside
  - - Customer concentration
    - Revenue overly reliant on one or two carriers
    - Top customer >20% or top-3 >50% of ARR
    - Increase required return and concentration discount
  - - Retention weakness
    - Low renewals or stalled module expansion
    - NRR below 110% or material logo churn
    - Reframe from platform to point-solution multiple
  - - Capital adequacy
    - Hidden burn or short runway
    - Runway below 12 months without strong financing path
    - Assume down-round or structured financing risk
  - - Operational reliability
    - Frequent outages or surge failures
    - Repeated SLA misses or failed CAT event handling
    - Treat product risk as gating issue rather than valuation nuance
  notes: These are the thesis-break monitors that matter most for an investor underwriting Assured at a premium valuation.
