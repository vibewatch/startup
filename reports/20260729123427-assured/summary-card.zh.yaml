  topStrengths:
    - Assured 切入的是规模大、成本高的保险公司工作流，自动化、缩短周期和控制赔漏都是真实预算优先项。
    - 作为独角兽，公司资本效率叙事异常强：在已披露融资相对有限的情况下，做到 2025 年 3 月估值。
    - 官方材料显示产品面很宽，覆盖理赔受理、沟通、编排、反欺诈相关工具和 CAT 工作流。
    - 商业模式更像软件和工作流，而不是承保业务；从估值耐久性看，这一战略位置更好。
  topRisks:
    - 公开收入证据仍主要来自跟踪器且彼此冲突，因此独角兽估值隐含倍数可能比表面看起来高得多。
    - 客户集中度、留存、模块扩张、毛利率和烧钱速度仍未公开，当前价格很难承保。
    - 既有理赔平台和相邻 AI 供应商仍在争夺同一批保险公司预算；没有更强证据，估值溢价很难继续抬高。
    - 股权结构表和优先权条款未披露，实际入场价格可能明显差于表面估值。
  unresolvedGaps:
    - 当前 ARR / 收入、增长率，以及已预订收入与已确认收入之间的桥接
    - GRR、NRR、模块挂载和队列扩张数据
    - 头部客户集中度，以及具名生产部署的宽度
    - 毛利率、烧钱速度、现金跑道和招聘计划
