    - Top-customer concentration and breadth of named production deployments
    - Gross margin, burn, runway, and hiring plan
    - Fully diluted cap table, liquidation preferences, and any debt or SAFE overhang
    - Referenceable customer ROI evidence beyond company-presented outcomes
