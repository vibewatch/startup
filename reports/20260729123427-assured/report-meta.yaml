      background: Stanford computer-science alumnus and former Eventive founder.
      claimRefs: [CO010, CO012]
  foundingLocation: Palo Alto, California, USA
  headquarters: Palo Alto, California
  productSummary: Assured markets an end-to-end claims-intelligence platform for carriers, with public modules spanning FNOL, Sidekick, First Contact, Messaging, Emma, Fraud, CAT, Service Assignment, Voice AI, and plugins.
  customerFocus: P&C insurance carriers and claims organizations seeking faster cycle times, lower loss-adjustment expense, and more automated claimant and adjuster workflows.
  businessModel: Enterprise software sold into insurer operations, likely combining SaaS/platform pricing with transaction- or workflow-linked value capture rather than balance-sheet insurance risk.
  stage: private, growth-stage
  fundingStatus: Last clearly corroborated financing anchor is the March 2025 Series B at roughly $1B valuation. Public sources describe the company as unusually capital efficient, but precise lifetime funding and current financing terms remain noisy.
