  topStrengths:
    - Assured targets a large and costly carrier workflow where automation, cycle-time reduction, and leakage control are real budget priorities.
    - The company has unusually strong capital-efficiency narrative for a unicorn, reaching the March 2025 valuation on relatively little disclosed capital.
    - Official materials show broad product surface area across claims intake, communications, orchestration, fraud-related tooling, and CAT workflows.
    - The business model appears software-like and workflow-based rather than underwriting-based, which is strategically preferable for valuation durability.
  topRisks:
    - Public revenue evidence is still tracker-based and conflicting, so the implied multiple at the unicorn mark may be much richer than it first appears.
    - Customer concentration, retention, module expansion, gross margin, and burn remain private, making the current price hard to underwrite.
    - Incumbent claims platforms and adjacent AI vendors still compete for the same carrier budgets, limiting how much premium can be justified without stronger proof.
    - Cap-table and preference terms are undisclosed, so the effective entry price may be meaningfully worse than the headline valuation.
  unresolvedGaps:
    - Current ARR / revenue, growth rate, and booked-versus-recognized revenue bridge
