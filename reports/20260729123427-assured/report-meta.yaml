companyProfile:
  summary: Assured is a private Palo Alto insurtech company founded in 2019 that positions itself as AI-native claims infrastructure for P&C insurers. Public materials and partner descriptions show a modular workflow stack spanning FNOL, claimant communications, fraud-related tooling, CAT workflows, and broader claims orchestration. The company appears strategically attractive because it sells software into a painful insurer operating function without taking underwriting risk itself.
