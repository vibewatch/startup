      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Assured has strong public policy signals but limited public runtime evidence. The security
              page lists SOC 2 Type II, HIPAA, and ISO 27001; the disclosure page publishes a vulnerability-reporting
              process; and Voice AI and Emma claim safeguards such as caller verification, protected-topic handling,
              red-teaming, and escalation when empathy or human judgment is needed. These are meaningful mitigants. But
              the company does not publish a status page, incident history, retention matrix, or public model-evaluation
              metrics, so the depth of those controls cannot be independently tested from public information alone.


              The product surface itself creates non-trivial failure modes. Voice AI and Emma interact directly with
              stressed claimants, so transcription mistakes, context errors, prompt-injection-like behavior, wrong
              escalation paths, or missed legal demands could create downstream claims exposure. Sidekick and FNOL
              depend on structured capture across multiple channels and more than 50 external data sources; if data
              quality or integration quality breaks, the whole automation promise degrades. Wider cyber and privacy
              trends heighten the stakes: privacy litigation is rising, cyber claims are growing more severe, and
              industry incidents such as the 2026 NAIC breach show how centralized insurance data infrastructure can
              create systemic operational disruption. Assured does not need its own breach to feel those risks; its
              customers will expect vendor-grade resilience regardless.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
          - type: table
            tableRef: TR002
            claimRefs:
