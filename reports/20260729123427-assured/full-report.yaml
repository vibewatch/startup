  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, substitutes, and likely buyer short list
        blocks:
          - type: paragraph
            body: >-
              Assured does not sell into an empty category. A carrier trying to automate claims can buy a broad core
              claims system from incumbents such as Guidewire or Duck Creek, a claims-network and workflow platform from
              CCC, specialized automation from Tractable or Hi Marley, a full cloud-native claims stack from Snapsheet,
              or continue to stitch together internal workflows around existing core systems. Worldmetrics’ 2026 review
              and the competitor surfaces themselves show the market is not organized around one universal winner.
              Buyers solve the job through combinations of system-of-record software, workflow automation, digital
              communications, fraud tooling, appraisal tools, and internal integration work.


              That means Assured's real competitor set is layered: incumbents with distribution and installed base;
              specialists with deeper point-solution strength; status-quo internal build around existing cores; and
              AI-native insurers like Lemonade or Root that demonstrate what more automated claims experiences can look
              like. Assured's modular platform claims breadth from FNOL through service assignment and messaging, but it
              still has to persuade carriers that adding its orchestration layer is easier than extending tools they
              already trust. The key competitive question is therefore not who has the most AI language on the homepage.
              It is who can most credibly reduce claim friction without forcing the carrier into costly workflow
              disruption.
            claimRefs:
