  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Assured looks like a credible company in an attractive workflow niche, but the public record is still much
              better at proving strategic relevance than at proving investability at the last reported price. The
              company clearly sits in a real pain point: P&C carriers want faster claims handling, lower loss-adjustment
              expense, better claimant experience, and more automation inside legacy-heavy operations. Assured's
              official materials, investor descriptions, and third-party coverage all support that high-level story. The
              difficulty is valuation translation. Public evidence confirms a March 2025 unicorn round and an unusually
              efficient funding history, yet it still does not provide the revenue-quality, retention, margin, or
              cap-table detail that would justify underwriting the company as if the price were already self-evidently
              cheap. The correct stance is therefore price-sensitive and evidence-sensitive: track or research more, not
              a blind yes or a blind no. At the current public anchor, the company may be good enough to merit deeper
              diligence, but not good enough to bypass it.
            claimRefs:
              - CV001
