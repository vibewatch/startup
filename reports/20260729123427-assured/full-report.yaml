      - number: '4.3'
        title: Cost structure, gross-margin drivers, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Assured looks like a software-first business with lower capital intensity than a balance-sheet insurer or
              field-services-heavy claims outsourcer, but that does not mean it is asset-light in practice. The platform
              combines workflow software, integrations, communications infrastructure, AI inference, security/compliance
              controls, and likely implementation support. Gross-margin upside comes from reusable software modules and
              transaction-linked pricing; gross-margin drag comes from onboarding, insurer-specific workflow
              configuration, cloud inference cost, messaging and voice infrastructure, and any human-in-the-loop review
              required for higher-stakes claims. Public materials are not detailed enough to quantify any of these
              elements, so margin must be framed as a driver map rather than a number.


              Capital adequacy is easier to discuss than to prove. The March 2025 Series B around $23M at a ~$1B
              valuation is well corroborated, but lifetime capital raised is not: CB Insights says $23.04M, GetLatka
              says $32.5M, and Forge says $42.09M with some obvious record contamination. If the low end is right,
              Assured is exceptionally capital-efficient; if the high end is closer, it is still lean for a unicorn.
              Either way, no public source discloses current cash, monthly burn, or debt facilities. The absence of any
              known post-Series-B financing by the run date is mildly positive, but not enough to conclude the business
              is self-funding. Runway therefore remains an open diligence item, not a solved fact.
