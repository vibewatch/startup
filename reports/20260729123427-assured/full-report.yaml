      - number: '8.3'
        title: Scenario ranges, sensitivity, and return logic
        blocks:
          - type: paragraph
            body: >-
              Because hard valuation inputs remain private or estimated, the scenario work should stay explicit and
              humble. The bull case assumes that Assured's modular platform expands across carrier workflows, that the
              2025 ARR estimate understates true run-rate progress, and that buyers continue rewarding specialist AI
              vendors that can reduce cycle time and leakage without taking underwriting risk. In that case, the unicorn
              mark can hold or expand modestly. The base case assumes the company is real and valuable but still not
              proven enough for a frontier-AI premium; on that view, today's price is only workable if deeper diligence
              confirms unusually strong growth, retention, and margins. The bear case assumes slower growth, thinner
              deployment proof, concentration around a few insurer programs, or multiple compression toward public
              workflow-software bands. Under that downside, the current mark leaves limited room for error. That is why
              the chapter emphasizes valuation ranges and trigger-based decision rules rather than false precision.
