  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Assured operates in a workflow where legal defensibility matters at every step. The company is not itself
              an insurer or broker, but its software sits directly inside claims intake, communications, routing, fraud
              signaling, and AI-assisted follow-up. That makes explainability, auditability, bias control, and privacy
              compliance central risks. Assured’s own materials emphasize that P&C claims are high-stakes and heavily
              regulated, while the privacy policy confirms collection of claimant PII, location data, photos, and
              sometimes PHI-sensitive workflows. The terms place the insurance carrier in the controller role for claim
              processing, but that does not eliminate Assured’s exposure to vendor-management obligations, contractual
              liability, or litigation discovery around how automated decisions and claimant interactions were
              generated.


              External regulatory materials raise the bar further. The EU AI Act materials, EIOPA factsheet, NIST AI
              RMF, and industry legal commentary all point toward more scrutiny of AI transparency, data governance,
              bias, incident response, and deployer oversight in insurance contexts. Claims Journal’s 2026 article
              explicitly notes that claims professionals and lawyers will face heightened methodology, bias, privilege,
              and transparency questions as insurers rely more on AI. For Assured, the practical risk is not simply
              whether the software works. It is whether a carrier can defend, audit, and govern the workflow when a
              bad-faith allegation, privacy complaint, or regulator challenge arrives.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
