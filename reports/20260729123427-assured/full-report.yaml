  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              For diligence purposes, Assured’s relevant market is not “insurance” or even the entire AI-in-insurance
              software stack. It is the workflow layer that helps carriers move a claim from FNOL through triage,
              documentation, communication, fraud review, and settlement with less manual handling. The Business
              Research Company’s 2026 market definition is directionally useful here because it explicitly frames AI in
              claims processing around evaluation, validation, settlement, fraud detection, damage assessment, and
              customer-support automation. Assured’s own public materials map to that same boundary: structured-data
              capture at intake, intelligent routing, straight-through processing, document collection, messaging, and
              agentic assistance.


              That boundary excludes several adjacent but distinct spend pools. It does not include the full global P&C
              premium base, general core-administration software, reinsurer analytics, broad customer-service tooling
              outside claims, or the entire AI-in-insurance category spanning underwriting and distribution. Those
              broader categories matter because they define upside adjacency, but they overstate Assured’s near-term
              addressable market if used uncritically as TAM. The status quo substitute is also important: many carriers
              still rely on legacy claim systems plus human adjusters, outsourced field networks, email/SMS patchworks,
              and incremental bolt-on tools rather than a unified AI-native workflow layer. In other words, Assured is
              not replacing premiums; it is competing for claims-operating budget and loss-adjustment-efficiency spend
              that today sits inside labor, vendor, and legacy-software workflows.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
