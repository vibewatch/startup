  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and segment map
        blocks:
          - type: paragraph
            body: >-
              Assured is fundamentally a carrier-sold platform. The likely economic buyer is a claims executive, COO,
              chief claims officer, or transformation leader inside a P&C insurer; the payer is the carrier; and the
              daily users span adjusters, call-center representatives, SIU or CAT teams, policyholders, and
              service-provider partners such as tow, rental, inspection, and repair networks. The terms page reinforces
              that the end claimant typically accesses Assured only because their insurance carrier partners with
              Assured, which is important because it clarifies the company’s B2B2C model and why downstream satisfaction
              matters even though the direct paying customer is the carrier.


              Segment breadth appears unusually wide for a claims-automation vendor. Assured presents modules across
              personal auto, commercial auto, homeowners, commercial property, workers’ compensation, and other P&C
              lines, while the home, AI, and blog pages all emphasize support for leading or top insurers rather than
              SMB agencies or self-insured employers. That suggests the installed base is skewed toward complex
              enterprise carriers with enough claim volume to justify automation, but the public record still does not
              reveal segment revenue mix by line, average contract size, or whether Assured sells directly, through
              system integrators, or via core-system partners.
