      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Assured’s buyer map looks like classic enterprise P&C operations software. The economic buyer is typically
              the claims executive or COO-style operations leader trying to reduce loss-adjustment expense, improve
              customer satisfaction, and keep files moving during volume spikes. Day-to-day users include adjusters,
              supervisors, call-center staff, SIU teams, and vendor-coordination functions. IT and
              enterprise-architecture teams often act as gatekeepers because claims platforms have to integrate into
              Guidewire- or Duck-Creek-centered environments, while compliance, legal, and model-risk stakeholders
              evaluate auditability, fairness, privacy, and escalation logic. The payer is therefore the carrier
              operating budget, not the end-policyholder.


              The adoption path usually starts with narrow workflow wins rather than a platform-wide rip-and-replace.
              Assured’s public pilot messaging—deploy in under six months, ROI in under 12 months, transaction-linked
              pricing—fits how conservative insurers buy operational automation. McKinsey’s Aviva case, Deloitte’s
              customer-loyalty framing, and JD Power’s digital-claims findings all reinforce why claims is a
              board-visible use case: better cycle times, better communication, and more predictable settlement handling
              directly influence retention and economics. But the path is still gated by trust. BCG notes only 38% of
              P&C insurers are generating value at scale from AI in core workflows, and NTT DATA stresses that
              centralized governance, executive alignment, and AI-native core architecture separate leaders from
              laggards.
            claimRefs:
