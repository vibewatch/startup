        title: Specialists and AI-native substitutes
        blocks:
          - type: paragraph
            body: >-
              The specialist field matters because many insurers do not buy claims transformation as one monolithic
              project. Tractable focuses on AI imaging, photo-based damage assessment, and high-throughput estimation
              for vehicles and property. Hi Marley sells conversational claims tooling and emphasizes its integration
              into Guidewire ClaimCenter, promising lower call volumes and shorter cycle times. Snapsheet markets a more
              complete cloud-native claims platform with no-code automation, integrated payments, smart assignment, and
              customer proof from IAT Insurance Group, SageSure, and Branch. These companies can win budgets that might
              otherwise support Assured, even when none duplicates Assured's exact product map.


              Lemonade and Root are a different kind of competitor: they are not software vendors to carriers, but
              public proof that AI-native or digitally native claims experiences can be built internally by an insurer.
              That matters strategically because a carrier can decide that it needs better claims automation without
              deciding it needs Assured specifically. For Assured, the most dangerous specialist is not necessarily the
              one with the most feature overlap; it is the one that lets a carrier solve the highest-priority pain
              point—communications, appraisal, or cloud claims operations—without changing the rest of the claims stack.
            claimRefs:
