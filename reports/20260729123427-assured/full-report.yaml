      - number: '8.4'
        title: Exit readiness, diligence asks, and kill triggers
        blocks:
          - type: paragraph
            body: >-
              From public evidence alone, Assured does not look ready for investors to skip diligence on terms or
              economics. There is no audited package, no public cap-table detail, no disclosed burn or runway model, and
              no clean public breakdown of customer concentration or multi-module expansion. None of that means the
              company is weak; it means the company is still being priced partly on private proof and investor belief.
              The right diligence focus is therefore straightforward: confirm present ARR, revenue retention,
              top-customer exposure, gross margin, burn, runway, contractual terms, and whether the strongest
              deployments are full production rollouts rather than narrow pilots. If those answers are strong, the
              recommendation can improve quickly because the market and product narratives are already credible. If they
              are weak, the valuation can compress quickly because so much of the present mark depends on assumptions
              rather than disclosed financial evidence.
