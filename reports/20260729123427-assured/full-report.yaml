      - number: '3.2'
        title: Incumbent and adjacent platforms
        blocks:
          - type: paragraph
            body: >-
              Guidewire, Duck Creek, and CCC all attack Assured from positions of institutional leverage. Guidewire's
              ClaimCenter markets end-to-end claims management, dynamic intake, built-in AI, and deep ecosystem
              extension; its investor page says more than 450 insurers run on Guidewire. Duck Creek frames claims as one
              module inside an Intelligent Core spanning policy, billing, rating, and agentic applications, while
              publicly advertising 30 million-plus claims processed and scale to 60,000-plus claims per day during CAT
              events. CCC approaches the problem from a network and workflow angle, describing itself as the SaaS
              platform powering the multi-trillion-dollar P&C insurance economy and connecting more than 35,000
              businesses.


              These vendors are not identical. Guidewire and Duck Creek are stronger as system-of-record or broad-core
              incumbents. CCC is strongest where workflow, ecosystem connectivity, estimating, and repair commerce
              matter, especially in auto. But they share a crucial advantage over Assured: procurement comfort. Each can
              argue that insurers already trust their data models, workflows, or partner ecosystems, which lowers
              perceived adoption risk. That makes Assured's claim to be a modular overlay both its opportunity and its
              challenge: the company can integrate into legacy environments, but must still beat vendors already
              embedded in those environments.
