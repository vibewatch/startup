  - id: capitalization-scale-and-milestones
    title: Capitalization, scale signals, and milestone chronology
    body: >-
      The cleanest capital fact in the record is a March 2025 round at roughly a $1B valuation. CB Insights lists a $23M Series
      B dated March 5, 2025; Forge lists a $23.35M Series B dated March 4, 2025; Crunchbase News and a Techmeme summary of
      Bloomberg reporting both place Assured among March 2025’s newly minted unicorns backed by ICONIQ Capital and Kleiner
      Perkins. Costanoa’s portfolio page separately says its initial investment was Series A and the company’s latest round is
      Series B, which aligns directionally with later-stage progression even though exact prior-round terms are not publicly clean.
      What is not clean is total lifetime funding: CB Insights says $23.04M, GetLatka says $32.5M across three rounds, and Forge
      says $42.09M while also showing mixed fields that appear to blend data from another “Assured” entity. The prudent read is
      that the March 2025 unicorn round is well corroborated, while pre-2025 capitalization detail remains noisy.

      Product and scale milestones are easier to support than exact financials. The 2026 website shows a broadened platform that
      now includes Emma, Voice AI, Fraud, CAT, and structured-data whitepapers on top of classic FNOL and messaging modules.
      Official pages claim top-carrier usage, broad line-of-business support, and security certifications including SOC 2 Type II,
      HIPAA, and ISO 27001. The AI microsite reports 84% flow completion, 4–6 day cycle-time reduction, and 3–5 calls eliminated
      for top P&C carriers. These are still company-presented results, but taken together they support the central investment case:
      Assured has reached meaningful market relevance with unusually little clearly disclosed capital for a unicorn-scale valuation.
    claimRefs:
