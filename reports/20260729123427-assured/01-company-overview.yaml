  - id: founders-leadership-footprint
    title: Founders, leadership, workforce footprint, and governance visibility
    body: >-
      Public sources consistently identify Assured’s founders as Justin Lewis-Weber and Theo Patt. The company’s about page says
      Lewis-Weber is CEO, describes Assured as his third company, and notes a Stanford aeronautics and astronautics background.
      The same page identifies Patt as co-founder and CTO, says he studied computer science at Stanford, and links him to prior
      startup Eventive. Leadership depth beyond the founders is visible but still narrow in public materials: the about page names
      Richard Palmer as Head of Sales and Jesse Cravens as Head of Engineering, while Costanoa’s portfolio page repeats Justin,
      Theo, and Palmer as key leadership. Palmer’s prior roles at Duck Creek, Mitchell, Solera/Audatex, and other insurance-tech
      vendors are a useful founder-market-fit substitute on the commercial side, and Cravens’ DISCO and USAA background adds
      scaled-software credibility on engineering.

      Even so, governance transparency is thin. No board composition is disclosed on the company website, and the main public
      institutional references are investor logos rather than director bios. Workforce visibility is also uneven. The careers page
      says Assured runs a fully remote team and currently advertises roles spanning AI, product, operations, engineering, and
      claims-domain SMEs. Yet third-party headcount sources diverge widely: Glassdoor still shows a 1–50 employee band, GetLatka
      says 92 employees, Tracxn says 199 as of June 2026, and IncFact only offers a broad 10–100 statistical range. That spread
      does not negate growth, but it does mean headcount should be treated as an explicit diligence gap rather than a settled fact.
    claimRefs:
