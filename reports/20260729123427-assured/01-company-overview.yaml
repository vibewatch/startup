callouts:
  - calloutType: strength
    title: Capital-efficient unicorn narrative is plausible
    body: >-
      Assured appears to have reached a $1B private valuation with materially less publicly visible capital than most insurtech
      unicorns, which is a powerful signal if the company’s deployment and ROI claims hold up under customer diligence.
    claimRefs:
      - CO029
      - CO031
      - CO033
  - calloutType: risk
    title: Basic firmographic data is still messy
    body: >-
      Public sources do not agree on total funding, employee count, or even the canonical headquarters address, which means a
      buyer or investor should insist on primary-source confirmation before underwriting scale assumptions.
    claimRefs:
      - CO008
      - CO009
      - CO033
      - CO035
      - CO038
  - calloutType: insight
    title: Structured data is the core thesis, not just a product feature
    body: >-
      Across FNOL, Sidekick, Voice AI, and Emma, Assured’s repeated design pattern is to convert messy claim intake into structured,
      machine-readable data that downstream agents and workflows can act on safely.
    claimRefs:
      - CO023
      - CO024
      - CO025
      - CO026
