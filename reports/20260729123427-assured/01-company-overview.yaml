  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: total-raised
      missingEvidence: A company-confirmed capitalization history showing every priced and unpriced round, including any loans or seed tranches.
      whyItMatters: Total capital raised is central to the capital-efficiency thesis and currently varies by nearly $19M across public datasets.
      diligencePath: Request board-approved financing history, cap table summary, and the certificates of incorporation or financing closing memos underlying the March 2025 round.
      relatedQuestionRefs:
        - QO011
      relatedTableRefs:
        - TO001
        - TO004
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: A current employee headcount broken down by function and geography.
      whyItMatters: Headcount is a key scale signal and the public range spans sub-100 to nearly 200 employees, which changes productivity and burn assumptions materially.
      diligencePath: Request an HRIS screenshot or finance-certified org chart snapshot as of the run date.
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO001
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Public or private documentation of board composition, observer rights, and investor control provisions.
      whyItMatters: Governance opacity makes it difficult to assess who controls strategy, financing cadence, and founder succession decisions.
      diligencePath: Request board roster, major investor rights summary, and most recent board deck or consent package.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: material
      topic: customer-scale
      missingEvidence: Named carrier customers, contracted volumes, retention, and referenceability for the top-insurer deployments Assured claims publicly.
      whyItMatters: The value of the unicorn valuation depends heavily on whether top-carrier usage translates into durable contracted revenue and defensible deployment depth.
      diligencePath: Ask management for three reference customers, deployment timelines, annual claim volumes, and proof of realized ROI by module.
      relatedQuestionRefs:
        - QO024
    - type: conflicting-data
      severity: minor
      topic: headquarters-discrepancy
      missingEvidence: A primary company statement distinguishing legal entity address, headquarters, and any satellite or mailing locations.
      whyItMatters: The address mismatch is not thesis-breaking, but it is symptomatic of the broader firmographic inconsistencies across data vendors.
      diligencePath: Confirm corporate headquarters, registered office, and material operating hubs with management and compare against state filings.
      relatedQuestionRefs:
        - QO003
        - QO025
      relatedTableRefs:
        - TO001
