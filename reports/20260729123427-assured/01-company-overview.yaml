company:
  name: Assured
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Assured is a Palo Alto-based private insurtech company founded in 2019 that sells AI-powered claims automation software to
    P&C insurers. Public evidence strongly supports a March 2025 funding round at about a $1B valuation led by ICONIQ Capital
    and Kleiner Perkins, but basic company metrics remain noisy: public databases disagree on total funding, headcount, and the
    canonical headquarters address. The strongest upside signals are broad product breadth, security certifications, and official
    claims of deployment across tens of millions of claims; the strongest diligence gaps are governance opacity, conflicting
    firmographic data, and a middling employee-review snapshot.
sections:
  - id: identity-product-model
    title: Identity, product scope, and operating model
    body: >-
      Assured positions itself as an AI-native claims automation company for property and casualty insurers. Across its homepage,
      AI microsite, and product pages, the company describes an end-to-end platform spanning ingestion, orchestration, and
      adjudication rather than a single point tool. The public product set includes digital FNOL, telephonic FNOL via Sidekick,
      First Contact follow-up, omnichannel Messaging, Emma agentic AI, Fraud, CAT, Service Assignment, Voice AI, Plugins, and
      line-of-business templates. The company repeatedly frames itself as “the most widely deployed AI in P&C,” says it works
      across tens of millions of claims annually, and says it serves the largest insurers in the world. Those are company claims,
      not independently audited operating statistics, but they are corroborated by product breadth and by multiple third-party
      market-data profiles that describe Assured as a P&C claims-processing SaaS vendor headquartered in Palo Alto.

      The commercial model appears to be enterprise software sold to insurers rather than direct underwriting or consumer-facing
      insurance. Product pages emphasize structured data capture, API integration into carrier core systems, and modular adoption.
      The careers page and whitepaper content suggest a prove-first sales motion built around pilots, existing-system integration,
      and per-claim or transaction-linked ROI rather than a greenfield rip-and-replace stack. Assured’s strongest overview
      takeaway is therefore not simply “AI for claims,” but a relatively full-stack claims-intelligence platform trying to become
      the orchestration layer for insurer workflows.
