  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、替代方案和可能的买方短名单
        blocks:
          - type: paragraph
            body: >-
              Assured 并不是卖进一个空白类别。想自动化理赔的保险公司，可以向 Guidewire 或 Duck Creek 等在位厂商购买广义核心理赔系统，向 CCC 购买理赔网络和工作流平台，向 Tractable
              或 Hi Marley 购买专门自动化工具，向 Snapsheet 购买完整云原生理赔栈，或者继续围绕现有核心系统拼接内部工作流。Worldmetrics 的 2026
              年回顾和竞争对手自身页面都显示，这个市场并不是围绕一个通用赢家组织起来的。买方会把主记录系统软件、工作流自动化、数字沟通、欺诈工具、定损工具和内部集成工作组合起来解决问题。


              因此，Assured 的真实竞争集是分层的：有分销和装机基础的在位厂商；在单点方案上更深的专业公司；围绕既有核心系统的现状内部构建；以及 Lemonade 或 Root 这类 AI
              原生保险公司，它们展示了更自动化的理赔体验可以长成什么样。Assured 的模块化平台宣称从 FNOL
              到服务分配和消息沟通都有覆盖面，但它仍必须说服保险公司：添加它的编排层，比扩展已经信任的工具更容易。关键竞争问题因此不是谁在首页上写了最多 AI
              语言，而是谁能最可信地降低理赔摩擦，同时不迫使保险公司承受昂贵的工作流扰动。
