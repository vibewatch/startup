  - id: TV005
    slug: thesis-break-and-kill-triggers-table
    title: 论点破坏和否决触发信号表
    description: Signals that would materially weaken the current investment view.
    columns:
      - 触发信号
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入质量不达预期
        - 私有 ARR 或收入显著低于基于第三方估算的预期。
        - 打破“当前估值只是反映隐藏规模”的论点。
        - 除非价格大幅重置，否则下调至回避。
      - - 集中度冲击
        - 一两家客户贡献过高收入或部署证据。
        - 提高续约和预算风险暴露。
        - 提高悲观情景权重，并要求更强条款。
      - - 扩张数据疲弱
        - NRR、模块扩张或生产落地广度平平。
        - 削弱溢价倍数理由。
        - 将当前估值视为过度拉伸。
      - - 优先权厚重的融资
        - 股权结构表显示清算优先权或反稀释条款抬高有效进入价格。
        - 名义估值可比性下降，下行更差。
        - 除非结构改善，否则暂停。
      - - 竞争压缩
        - 既有厂商或相邻 AI 供应商在生产环境抹平差异化叙事。
        - 降低战略溢价和退出可选性。
        - 转向基准 / 悲观情景，并收紧价格纪律。
    notes: 这些是会否决估值论点的触发信号，并不等于业务运营正在失败。
    claimRefs:
