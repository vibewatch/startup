  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价动作和真正公开的信息
        blocks:
          - type: paragraph
            body: >-
              Assured 的公开材料一贯描述的是一家卖给保险公司的企业软件公司，而不是承担承保风险的保险公司。平台是模块化、工作流导向的，覆盖 FNOL、电话接入、First
              Contact、Messaging、Emma、Fraud、CAT、Service Assignment、Voice AI 和 Plugins。最强的变现线索来自 Assured
              的理赔周期基准文章，其中称按交易定价意味着保险公司从一开始就能在单个赔案层面看到价值。结合其反复强调的试点和集成话术，这暗示定价结构很可能把企业级承诺与按理赔量挂钩的经济性结合起来，而不是纯按席位收费的
              SaaS。


              商业动作对「降低采用风险」讲得异常明确。「先测试再投入」白皮书主张真实世界试点、一次一个赔案推进，以及先证明、后规模化的购买行为。Assured 的运营证据点——六个月内部署、12 个月内实现正
              ROI、快速接入现有系统——支撑一个先楔入再扩张的 GTM 模型。这些都没有披露已实现的 ASP、模块附加率或收入确认政策，但支撑了一条自洽的收入故事：用可衡量的工作流 ROI
              落地，再随时间扩大模块覆盖和自动化理赔量。
