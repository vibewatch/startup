    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围和运营模式
        blocks:
          - type: paragraph
            body: >-
              Assured 将自己定位为面向财产险和意外险保险公司的 AI 原生理赔自动化公司。在官网、AI 微站和产品页上，公司描述的是一个覆盖接入、编排和裁定的端到端平台，而不是单点工具。公开产品集包括数字化
              FNOL、通过 Sidekick 完成的电话 FNOL、First Contact 跟进、全渠道 Messaging、Emma 智能体式 AI、Fraud、CAT、Service Assignment、Voice
              AI、Plugins 和险种模板。公司反复称自己是「P&C 中部署最广的
              AI」，称每年处理数千万起理赔，并称服务全球最大的保险公司。这些是公司口径，不是独立审计的运营指标，但产品广度以及多个第三方市场数据档案提供了佐证：Assured 是一家总部位于 Palo Alto 的 P&C
              理赔处理 SaaS 供应商。

              商业模式看起来是卖给保险公司的企业软件，而不是直接承保或面向消费者卖保险。产品页强调结构化数据采集、通过 API
              接入保险公司核心系统，以及模块化采用。招聘页和白皮书显示，销售动作更像先验证再扩展：围绕试点、现有系统集成，以及按赔案或交易挂钩的 ROI，而不是全新替换式系统。因此，Assured 最重要的概览结论不只是「理赔
              AI」，而是一套相对全栈的理赔智能平台，试图成为保险公司工作流的编排层。
