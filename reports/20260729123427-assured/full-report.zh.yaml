      - number: '4.3'
        title: 成本结构、毛利驱动和资本充足性
        blocks:
          - type: paragraph
            body: >-
              Assured 看起来是一家软件优先业务，资本强度低于资产负债表型保险公司或重现场服务的理赔外包商，但这不意味着它在实践中轻资产。平台结合了工作流软件、集成、通信基础设施、AI 推理、安全 /
              合规控制，以及很可能存在的实施支持。毛利率上行来自可复用软件模块和按交易挂钩定价；毛利率拖累来自上线导入、保险公司专属工作流配置、云推理成本、消息和语音基础设施，以及高风险赔案所需的任何人机协同审核。公开材料没有细到足以量化这些要素，因此毛利率只能被框成驱动图，而不是一个数字。


              资本充足性比证明起来更容易讨论。2025 年 3 月约 $23M、估值约 $1B 的 Series B 佐证充分，但累计融资额并不确定：CB Insights 称 $23.04M，GetLatka 称
              $32.5M，Forge 称 $42.09M 且有一些明显记录污染。如果低端数字正确，Assured
              的资本效率极高；如果高端更接近事实，它对一家独角兽来说仍然精简。不管哪种情况，没有公开来源披露当前现金、月度烧钱或债务工具。截至本报告运行日没有已知 Series B
              后融资，这一点略微正面，但不足以断定业务已经自我供血。因此，现金续航仍是开放尽调项，而不是已解决事实。
            claimRefs:
              - CI019
              - CI020
