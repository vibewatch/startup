  - id: FU001
    title: Assured 客户旅程图
    type: journey-map
    layout: standard
    summary: 保险公司买方从理赔痛点出发，如何走向 Assured 的多角色采用。
    data:
      items:
        - label: 1. 高管识别痛点
          stage: 发现
          actor: 首席理赔官 / COO
          action: Recognizes cycle-time, LAE, and staffing pressure
          pain: Legacy workflows and poor intake quality
          outcome: Looks for low-lift automation instead of rip-and-replace
        - label: 2. 试点切入点
          stage: 评估
          actor: 理赔运营 + IT
          action: Starts with FNOL, Sidekick, or First Contact
          pain: Procurement and integration friction
          outcome: Tests one workflow and measures ROI
        - label: 3. 操作者采用
          stage: 试点
          actor: 理赔员和呼叫中心客服
          action: Use structured intake, reports, and messaging
          pain: Training and workflow change
          outcome: Lower manual follow-up and better readiness
        - label: 4. 索赔人互动
          stage: 生产
          actor: 保单持有人 / 索赔人
          action: Files digitally or via assisted intake; receives updates
          pain: Stress, repetition, and status uncertainty
          outcome: Faster, clearer claims experience
        - label: 5. 工作流扩展
          stage: 扩展
          actor: 保险公司转型团队
          action: Adds Emma, Voice AI, Fraud, CAT, or Service Assignment
          pain: Budget prioritization and internal champions
          outcome: Broader automation and higher switching cost
        - label: 6. 续约 / 平台决策
          stage: 续约
          actor: 财务 + 理赔管理层
          action: Evaluates contract renewal and module expansion
          pain: Need evidence of durable ROI and claimant outcomes
          outcome: Either deep platform adoption or stalled narrow deployment
    claimRefs:
      - CU001
      - CU010
      - CU028
      - CU030
