      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Assured 的买方图谱像典型的企业级 P&C 运营软件。经济买方通常是理赔高管或 COO
              型运营负责人，他们想降低理赔费用、提升客户满意度，并在量峰时保持案件流转。日常用户包括理赔员、主管、呼叫中心员工、SIU 团队和供应商协调职能。IT 和企业架构团队往往充当守门人，因为理赔平台必须接入以
              Guidewire 或 Duck Creek 为中心的环境；合规、法务和模型风险相关方则评估可审计性、公平性、隐私和升级逻辑。因此，付款方是保险公司的运营预算，而不是最终保单持有人。


              采用路径通常从狭窄工作流胜利开始，而不是全平台替换。Assured 的公开试点话术——六个月内部署、12 个月内实现 ROI、按交易挂钩定价——符合保守型保险公司购买运营自动化的方式。McKinsey 的
              Aviva 案例、Deloitte 的客户忠诚度框架和 JD Power
              的数字理赔发现，都强化了为什么理赔是董事会可见的用例：更短周期、更好沟通和更可预测的结算处理，会直接影响留存和经济性。但采用路径仍卡在信任。BCG 指出，只有 38% 的 P&C 保险公司在核心工作流中规模化产生
              AI 价值；NTT DATA 强调，集中治理、高管对齐和 AI 原生核心架构，把领先者与落后者分开。
