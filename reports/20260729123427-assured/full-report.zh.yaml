      - number: '5.2'
        title: 工作流架构，以及赔案如何穿过系统
        blocks:
          - type: paragraph
            body: >-
              最清晰的架构主线，是 Assured 强调在赔案开始时生成结构化、机器可读数据。FNOL 会根据此前答案和超过 50 个外部数据源调整问题流，采集签名，支持多语言沟通，并把输出路由到 ClaimView、Flow
              Builder、Customer360、Rollout Manager 和低改造量核心系统 API。First Contact 随后通过 SMS
              或邮件数字化触达所有理赔参与方，并向理赔员返回数据丰富的报告。Messaging 集中管理全渠道线程，Emma 和 Voice AI
              则在赔案中自动化跟进、数据采集和状态工作。因此，工作流看起来是：早期采集结构化数据，丰富并验证数据，通过自动化路由，只有需要判断的地方才升级。


              这与 Assured
              的理赔自动化博客一致：公司把自己定位为包裹遗留核心系统的一层，而不是替代它们。博客反复把可靠自动化与结构化数据、低摩擦集成、审计轨迹和规则驱动路由联系起来。公开材料也强调模型无关性和下一步最佳动作编排，暗示一个服务层可以为不同任务调用不同
              AI 模型，而不是把保险公司绑定到单一供应商。仍然缺失的是一份点名实际云供应商、消息总线、可观测性栈或模型评估工具的参考架构。公开图景足以理解工作流意图，但不足以仅从外部充分评估深层技术实施风险。
