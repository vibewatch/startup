  - id: FE001
    title: Assured Claims Intelligence Platform——产品架构图
    type: stack
    layout: standard
    summary: 理赔智能模块叠在结构化数据采集、编排和控制之上。
    data:
      layers:
        - label: 体验与受理渠道
          modules:
            - 数字 FNOL 网页 / App 受理
            - Sidekick 电话受理
            - 语音 AI 电话受理
            - SMS / 邮件 / 聊天触点
        - label: 工作流应用
          modules:
            - 首次联系
            - 消息
            - Emma
            - 欺诈
            - CAT
            - 服务分派
        - label: 业务线与专用资产
          modules:
            - 车险：Collision IQ / Damage IQ
            - 财产险：Room Assessment / Protect IQ
            - 工伤险：Inquiry IQ / Coverage IQ / 三点联系
            - 其他业务线扩展和高端定制实施
        - label: 数据与决策基础
          modules:
            - 结构化、机器可读理赔数据
            - 50+ 个外部数据源
            - 规则 / 路由 / 下一最佳行动逻辑
            - ClaimView / Customer360 / Rollout Manager
        - label: 集成与控制平面
          modules:
            - 核心系统 API
            - 预置核心系统 / 呼叫中心集成
            - 安全 / 隐私 / 披露控制
