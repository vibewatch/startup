      - 可监控触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - AI 决策可辩护性
        - 与自动化工作流相关的重大投诉、监管问询或恶意拒赔取证
        - 一起经证实的高严重性事件
        - 暂停估值乐观假设，并要求法律 / 治理深挖
      - - 安全 / 隐私
        - 数据泄露、勒索软件事件或关键供应商披露
        - 任何重大的索赔人数据事件
        - 升级安全尽调，并重新测算下行
      - - 客户集中度
        - 收入过度依赖一两家保险公司
        - 最大客户 >20%，或前三大客户 >50% ARR
