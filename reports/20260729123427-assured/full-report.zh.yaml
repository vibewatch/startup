      - number: '8.3'
        title: 情景区间、敏感性和回报逻辑
        blocks:
          - type: paragraph
            body: >-
              硬估值输入仍是私有或估算值，因此情景分析应保持明确且克制。牛市情景假设 Assured 的模块化平台能在保险公司工作流中扩张，2025 年 ARR
              估算低估了真实年化进展，并且买方继续奖励那些能在不承担承保风险的前提下降低周期时间和漏损的专业 AI 供应商。在这种情况下，独角兽估值可以守住或小幅扩张。基准情景假设公司真实且有价值，但还不足以证明应享有前沿
              AI
              溢价；在这一视角下，只有更深尽调确认增长、留存和利润率异常强劲，今天的价格才可行。熊市情景假设增长更慢、部署证据更薄、收入集中在少数保险公司项目上，或倍数向公开工作流软件区间压缩。在这一下行情景下，当前估值留给错误的空间有限。这也是本章强调估值区间和基于触发条件的决策规则，而不是制造虚假精确的原因。
