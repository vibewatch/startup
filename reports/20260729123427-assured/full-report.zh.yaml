  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Assured 所处的工作流，每一步都需要经得起法律审视。公司本身不是保险公司或经纪商，但其软件直接嵌入理赔受理、沟通、路由、欺诈信号和 AI
              辅助跟进。因此，可解释性、可审计性、偏见控制和隐私合规是核心风险。Assured 自身材料强调 P&C 理赔高风险且监管很重；隐私政策也确认公司会收集索赔人 PII、位置数据、照片，有时还会涉及 PHI
              敏感工作流。条款把保险公司置于理赔处理的控制者角色，但这并不会消除 Assured 在供应商管理义务、合同责任，或围绕自动化决策和索赔人互动生成过程的诉讼披露中的暴露。


              外部监管材料进一步抬高了门槛。EU AI Act 材料、EIOPA 情况说明、NIST AI RMF 和行业法律评论都指向同一趋势：保险场景下，AI
              透明度、数据治理、偏见、事件响应和部署方监督会受到更严审查。Claims Journal 2026 年文章明确指出，随着保险公司更多依赖
              AI，理赔专业人士和律师将面对更高强度的方法论、偏见、保密特权和透明度问题。对 Assured
              来说，实际风险不只是软件能不能跑，而是当恶意理赔处理指控、隐私投诉或监管挑战到来时，保险公司能否为这套工作流辩护、审计并治理。
