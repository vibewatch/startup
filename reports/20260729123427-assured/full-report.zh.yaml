      - number: '8.2'
        title: 估值背景和可比公司护栏
        blocks:
          - type: paragraph
            body: >-
              关键估值问题在于，Assured 的头部估值标记和可能的当前运营规模似乎活在两个世界。如果常被引用的 $22 million ARR 估算哪怕方向正确，$1 billion 估值也意味着约 45x
              收入倍数。公开理赔科技和保险科技可比公司并不直接支撑这个倍数。Guidewire 的交易倍数更接近高个位数收入倍数，CCC 更接近低个位数倍数，Lemonade、Root
              等保险公司式保险科技名称还要更低。这些可比并不完美：Assured 更早期、更小，如果自动化切口是真的，或许应享有更快增长溢价。但不完美是双向的。因为 Assured
              是私营公司，投资人也看不到审计报表、精确客户集中度和干净的条款数据。公开行业指南同样显示，理赔软件市场很拥挤，既有既有厂商，也有更新的 AI
              专家，都在争夺同一批保险公司预算。结论很简单：公开证据支持关注这家公司，但不支持对价格掉以轻心。
