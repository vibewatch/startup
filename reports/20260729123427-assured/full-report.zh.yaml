        title: 部署模式、集成和成熟度信号
        blocks:
          - type: paragraph
            body: >-
              Assured 的部署故事刻意增量化。公开页面一贯称平台增强保险公司核心系统，而不是替换它们；支持基于 API
              的提交和归档；提供与主要核心系统供应商及联络中心系统的预建集成；并可在更大范围推广前先做试点。Sidekick 和 Voice AI 也展示了 Assured
              如何适应既有呼叫中心现实，而不是假设保险公司能立刻把所有索赔人推向数字自助服务。这种部署姿态是产品优势，因为它降低了变革管理摩擦，并在理赔工作流中创造了多个入口点。


              公开成熟度信号方向上正面，但仍不完整。Emma 被描述为 P&C 中部署最广的 AI，并经过数百万次交互的实战检验；AI 页面称领先保险公司信任 Assured，并引用 84% 流程完成率、周期缩短 4-6
              天、减少 3-5 通电话、4.8 索赔人满意度和 79 理赔员 NPS。Wellfound
              和招聘页显示公司在工程、AI、数据库可靠性和产品职能上积极招聘，这支持了平台仍在快速扩张的观点。但没有公开变更日志、没有公开状态页、没有外部开发者文档，也没有透明事故历史。这意味着成熟度可以从广度和部署主张中推断，却不能像基础设施软件买方希望的那样充分验证。
