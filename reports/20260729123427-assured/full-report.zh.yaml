      - number: '1.2'
        title: 创始人、领导层、员工足迹和治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开来源一致将 Assured 的创始人列为 Justin Lewis-Weber 和 Theo Patt。公司关于页面称 Lewis-Weber 担任 CEO，描述 Assured 是他的第三家公司，并提到他的
              Stanford 航空航天背景。同一页面将 Patt 列为联合创始人兼 CTO，称他在 Stanford 学习计算机科学，并关联到此前创业公司
              Eventive。创始人之外的领导层纵深在公开材料里可见，但仍偏窄：关于页面列出销售负责人 Richard Palmer 和工程负责人 Jesse Cravens，Costanoa 的组合页也重复列出
              Justin、Theo 和 Palmer 作为关键领导。Palmer 曾任职于 Duck Creek、Mitchell、Solera / Audatex
              和其他保险科技供应商，这在商业侧补上了创始人-市场匹配的证据；Cravens 的 DISCO 和 USAA 背景则给工程侧增加了规模化软件可信度。

              即便如此，治理透明度仍然很薄。公司网站没有披露董事会构成，主要公开机构引用也只是投资者标识，而不是董事简历。员工规模可见度同样不均衡。招聘页称 Assured 采用全远程团队，当前招聘岗位覆盖
              AI、产品、运营、工程和理赔领域专家。但第三方员工数来源分歧很大：Glassdoor 仍显示 1–50 人区间，GetLatka 称 92 人，Tracxn 称截至 2026 年 6 月为 199
              人，IncFact 只给出宽泛的 10–100 人统计区间。这个跨度并不否定增长，但意味着员工数应被视为明确尽调缺口，而不是已确定事实。
