      - number: '6.2'
        title: 采用轨迹和部署信号
        blocks:
          - type: paragraph
            body: >-
              Assured 最强的采用信号，是大规模理赔和交互数量，以及工作流结果。首页称平台每年服务数千万起理赔，并且是 P&C 中部署最广的 AI。AI 页面把平台描述为受领先 P&C
              保险公司信任，并给出具体收益主张：84% 流程完成率、周期缩短 4-6 天、减少 3-5 通电话、4.8 索赔人满意度和 79 理赔员 NPS。Emma 页面补充称，该智能体可自主处理近 70%
              的交互，并经受了数百万次交互的实战检验。FNOL 和理赔管理博客文章重复了部分运营逻辑，把 Assured 呈现为一种低改造、模块化的现代化方式：一次推进一个赔案，而不是替换整套系统。


              这些是有意义的信号，但不等于透明的队列数据。公开层面没有付费保险公司数量，没有按客户披露模块渗透率，没有按客户批次拆分的留存曲线，也没有把试点、部分部署和完整生产足迹明确拆分。即便最强的
              标识，也只是被笼统描述为头部保险公司或前十保险公司，而不是具名展示。因此，采用结论是正面的，但有边界：Assured 几乎肯定有真实的企业牵引力，但公开证据不足以支撑对留存耐久性或客户集中度风险的高置信度判断。
