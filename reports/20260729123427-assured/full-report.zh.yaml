      - number: '2.2'
        title: 规模测算口径、经济池，以及通用 TAM 为什么误导
        blocks:
          - type: paragraph
            body: >-
              这个市场至少可以用三种有用口径来测算。最窄口径是专门的 AI 理赔处理软件和服务。The Business Research Company 将该市场测算为 2025 年 $0.46B、2026 年
              $0.53B，并预测到 2030 年达到 $0.97B，意味着中双位数增长。ResearchAndMarkets 把同一类别描述为一个独立的全球市场，包含软件、服务、ML、NLP
              和计算机视觉细分，进一步说明它已经是被认可的预算线，而不只是概念主题。更宽口径是整个保险 AI 类别。AllAboutAI 的 2026 年综述将其列为 2025 年
              $10.24B，说明一旦纳入承保、定价、分销和服务功能，相邻软件机会会大得多。


              Assured 在经济上相关的楔子位于这两个边界之间。理赔是 P&C 保险公司最大的成本中心之一，因此即使软件拿到的费率不高，也能形成有吸引力的供应商机会。BCG 认为，AI
              优先的再设计可将每美元保费对应的运营成本降低 15% 到 25%，仅在美国就相当于减少 $35B 到 $60B 运营费用，同时带来 $8B 到 $20B 增量保费捕获。Assured 自己的材料和 Decerto
              的 2026 年指南都从工作流角度推进同一逻辑：价值池的关键不在于宣称一个巨大的抽象 TAM，而在于把高度依赖人工的理赔工作转成软件中介的吞吐量。因此，尽调答案应是受证据约束的 SAM 叙事，而不是单一膨胀的
              TAM 数字。
