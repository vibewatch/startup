      - number: '6.4'
        title: 留存、扩张和集中度风险
        blocks:
          - type: paragraph
            body: >-
              Assured 的扩张叙事在概念上很强。平台是模块化的，覆盖数字和电话报案、首次联系、消息、AI 跟进、服务分派、欺诈和 CAT，并能跨多条业务线使用。只要初始部署能证明
              ROI，这样的产品足迹就应支撑先落地、再扩张的销售动作。首页明确表示，客户可以从所需位置开始，再扩展到完整平台；多个产品页也展示了一个模块如何接上另一个模块。如果实际情况如此，随着保险公司把更多工作流、服务供应商和沟通渠道接入
              Assured，切换成本应会上升。


              但留存和集中度仍是巨大的尽调缺口。公开资料没有披露
              GRR、NRR、续约率、平均合同期，也没有披露按客户划分的收入集中度。面向保险公司销售的模式，可能意味着少数大客户贡献不成比例地重要；条款页也确认，终端用户位于保险公司合作关系的下游，而不是直接订阅者。JD
              Power 关于理赔体验的研究同样说明执行为何关键：数字工具如果顺滑，可以提升满意度和留存；但跟进做差或周期拉长，很快会反噬这些收益。因此，最诚实的客户结论是：Assured
              看起来适合扩张，但公开资料对留存质量和集中度暴露仍大多看不清。
