      - CV027
      - CV028
      - CV040
      - CV041
  - id: TV006
    slug: final-diligence-asks-table
    title: 最终尽调问题表
    description: Highest-priority private questions required before underwriting Assured near the current public anchor.
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / 收入
        - 当前月度或季度经常性收入、增长率，以及签约与确认收入的桥接。
        - 直接决定隐含倍数是 20x、30x、45x 还是更高。
        - 管理层数据室 / CFO 材料包。
      - - 留存和扩张
        - GRR、NRR、客户留存、模块挂载和队列表现。
        - 溢价估值需要复利式增长证据，而不只是初始试点。
        - 董事会指标 / 客户队列导出。
      - - 客户集中度
        - 前五大收入占比，以及对任何旗舰保险公司的依赖。
        - 集中度会把溢价倍数变成脆弱倍数。
        - 收入集中度明细表。
      - - 利润率和烧钱
        - 毛利率、烧钱、现金续航和招聘计划。
        - 如果利润率像软件、烧钱受控，资本效率更可信。
        - 财务模型和预算审查。
      - - 股权结构表和条款
        - 清算优先权、反稀释、债务、SAFEs 和员工期权悬垂。
        - 有效进入价格和下行保护取决于结构，而不只是名义估值。
        - 律师 / 投资人文件。
      - - 部署证明
        - 具名或可归因的生产客户、落地范围和可衡量 ROI。
        - 验证产品是否真正嵌入并正在扩张。
        - 客户背调电话和实施材料。
    notes: 如果这些尽调问题反馈强劲，Assured 可以很快从有意思的公司变成可支持的投资案例；如果反馈疲弱，估值风险很可能占主导。
    claimRefs:
      - CV008
      - CV040
      - CV042
      - CV043
