            body: >-
              Assured 最强的信任信号很明确。安全页面列明 SOC 2 Type II、HIPAA 和 ISO 27001
              资质；披露页面记录了负责任披露流程；隐私政策列出平台收集的理赔、设备、位置和通信数据类别；条款也明确公司提供保险相关软件解决方案，而不是充当经纪商。对于一个触及
              PII、PHI、照片、转录文本和潜在敏感事故叙述的理赔平台，这些是重要的基础控制。Voice AI 和 Emma 页面也宣称有智能防护、升级边界、受保护主题处理，以及针对越狱和红队测试的保护。


              风险在于，公开控制仍是政策层面的，而不是实施层面的证明。Assured 没有公开按数据类别列出留存期限、数据驻留选项、红队方法、模型评估指标、故障处理，或高风险决策是否始终可由人工复核。欧盟和美国的 AI
              风险来源说明了这些细节为什么重要：保险 AI 越来越被要求透明、可治理、可审计、具备偏差意识。Assured
              的公开记录显示公司理解这些义务，但外部尽调仍需要架构审查、渗透测试摘要、认证报告和模型治理证据，才能从安全与合规角度把平台视为已充分验证。
