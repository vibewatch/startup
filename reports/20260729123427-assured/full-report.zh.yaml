      - number: '7.2'
        title: 运营、质量和安全风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，Assured 有强烈的公开政策信号，但公开运行证据有限。安全页面列出 SOC 2 Type II、HIPAA 和 ISO 27001；披露页面公布漏洞报告流程；Voice AI 和 Emma
              声称有来电者验证、受保护主题处理、红队测试，以及在需要同理心或人工判断时升级等护栏。这些都是有意义的缓释。但公司没有公布状态页、事故历史、留存矩阵或公开模型评估指标，因此仅凭公开信息无法独立测试这些控制的深度。


              产品表面本身会制造不小的失效模式。Voice AI 和 Emma 直接与压力很大的索赔人互动，转写错误、上下文错误、类似提示注入的行为、错误升级路径，或遗漏法律要求，都可能向下游制造理赔暴露。Sidekick 和
              FNOL 依赖跨多个渠道以及 50 多个外部数据源的结构化采集；数据质量或集成质量一旦断裂，整个自动化承诺就会缩水。更广泛的网络安全和隐私趋势抬高了风险：隐私诉讼在增加，网络理赔严重程度在上升，2026 年
              NAIC 泄露等行业事件也说明，集中化保险数据基础设施可能造成系统性运营中断。Assured 不必自己发生泄露才会感受到这些风险；无论如何，客户都会要求供应商级韧性。
