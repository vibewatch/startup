        title: 产品版图和模块图谱
        blocks:
          - type: paragraph
            body: >-
              Assured 公开呈现的是围绕 P&C 理赔工作流构建的宽而自洽的产品版图。当前旗舰界面集中在 AI 页面和险种页面，FNOL、First
              Contact、Sidekick、Messaging、Emma、Fraud、CAT、Service Assignment 和 Voice AI
              被展示为单一理赔智能平台上的互操作模块。更早的插件式资产也仍然公开可见，包括 Collision IQ、Injury IQ、Protect IQ、E-Signature、聊天机器人 / 文本，以及正在申请专利的
              3D 损伤引擎。这种组合说明产品在演进，也说明一个重要设计选择：Assured 似乎把能力打包成模块化工作流，可以渐进引入保险公司环境，而不是通过一次性单体系统替换。


              平台也明确跨险种。Assured
              称其覆盖个人车险、商业车险、房主险、商业财产险、工伤赔偿险和其他险种；五大主要险种可即用式部署，其余险种提供高服务强度实施。险种覆盖很重要，因为它把公司与更窄的汽车估价或仅消息沟通竞争者区分开来。不过，公开记录没有映射各险种中哪些模块已经成熟、较早的插件式资产是否仍在销售，或者所有产品是否共享一套代码库和一个控制平面。这些仍是尽调项，而非已验证事实。
