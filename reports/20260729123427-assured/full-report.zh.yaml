  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              尽调 Assured 时，相关市场不是「保险」，甚至也不是整套保险 AI 软件栈。它是一个工作流层，帮助保险公司用更少人工处理，把赔案从 FNOL 推进到分流、文档、沟通、欺诈审核和结案。The Business
              Research Company 的 2026 年市场定义在方向上有用，因为它明确把理赔处理中的 AI 围绕评估、验证、结算、欺诈检测、损害评估和客户支持自动化来界定。Assured
              自己的公开材料也落在同一边界：接入时采集结构化数据、智能路由、直通式处理、文档收集、消息沟通和智能体辅助。


              这个边界排除了几个相邻但不同的支出池。它不包括全球全部 P&C 保费基数、通用核心管理软件、再保险分析、理赔之外的广义客服工具，也不包括覆盖承保和分销的整个保险 AI
              类别。更大的类别很重要，因为它定义了相邻上行空间；但如果不加批判地把它们当作 TAM，会夸大 Assured 的近期可服务市场。现状替代方案也很重要：许多保险公司仍依赖传统理赔系统加人工理赔员、外包现场网络、邮件
              / SMS 拼接，以及渐进式外挂工具，而不是统一的 AI 原生工作流层。换句话说，Assured 不是在替代保费；它竞争的是理赔运营预算和理赔费用效率支出，这些支出今天嵌在人工、供应商和传统软件工作流里。
