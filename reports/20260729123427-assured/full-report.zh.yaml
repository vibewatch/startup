      - number: '4.4'
        title: 财务结论、估值背景和尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Assured 最强的财务论点是叙事自洽。公司把企业级理赔自动化产品卖进一个成本高昂的工作流，呈现可衡量的 ROI
              语言，似乎已经拿下顶级投资人，并可能用异常少的资本达到独角兽地位。如果客户扩张、续约和自动化率真实，这个组合可以支撑有吸引力的软件经济性。最弱点是验证。没有公开经审计收入，没有公开烧钱，没有披露净留存，没有毛利率，也没有关于累计融资额或员工数的干净共识。


              对照公开可比公司，如果 GetLatka 约 $22M ARR 的估算哪怕大致正确，2025 年 3 月约 $1B 的标记就意味着很高的倍数要求。Guidewire、CCC、Lemonade 和 Root
              等公开理赔科技与保险科技可比公司，呈现出很宽的收入倍数和商业模式区间，但没有一家能让投资人在缺少更强增长和效率证明的情况下，更容易接受 40x 以上 ARR 倍数。因此，正确的财务结论是有条件的：Assured
              或许因资本效率和 AI 工作流杠杆而配得上溢价，但任何接近最后已知估值的投资决策，都需要直接披露 ARR、毛利率、烧钱、续约和现金续航。
