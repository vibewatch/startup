      - number: '7.3'
        title: 依赖、人才和商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Assured 的产品和销售落地设计带来多重依赖和执行风险。平台依赖保险公司核心系统、电话和消息基础设施、外部数据提供商、服务分派伙伴网络，以及在模型无关编排层背后使用的前沿 AI
              提供商。公司似乎也卖给相对少数的大型保险公司；如果采购、安全审查、法律条款或内部支持者发生变化，部署就可能停滞。即便不考虑直接客户留存的不确定性，这些也是典型的企业集中度和依赖风险。


              人才和资本风险仍只露出一部分。招聘页和 Wellfound 显示，公司在工程、AI、数据库可靠性和产品岗位上持续招聘，这对执行是积极信号，但也说明公司仍需要专门人才。财务上，Assured
              的资本效率叙事有吸引力，但公开证据仍未披露现金消耗、现金跑道、续约质量或客户集中度。如果少数大客户主导收入，如果留存弱于模块化叙事暗示的水平，或者产品宽度跑得比控制成熟度更快，即便产品市场叙事很强，公司也可能面临估值压力和后续融资延迟。剩余结论是：Assured
              最大的业务风险，不在于理赔自动化有没有价值，而在于公司能否像落地 AI 一样快地落地治理和企业级执行。
