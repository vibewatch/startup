        title: 资本结构、规模信号和里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              记录里最干净的资本事实，是 2025 年 3 月一轮估值约 $1B 的融资。CB Insights 列出 2025 年 3 月 5 日 $23M Series B；Forge 列出 2025 年 3 月 4 日
              $23.35M Series B；Crunchbase News 和 Techmeme 对 Bloomberg 报道的摘要都把 Assured 列为 2025 年 3 月新晋独角兽，投资方包括 ICONIQ
              Capital 和 Kleiner Perkins。Costanoa 的组合页另称其初始投资为 Series A、公司最新轮次为 Series
              B；即使此前轮次条款在公开层面并不干净，这也与阶段推进方向一致。不干净的是累计融资额：CB Insights 称 $23.04M，GetLatka 称三轮共 $32.5M，Forge 称
              $42.09M，同时还展示了疑似混入另一家「Assured」实体数据的字段。审慎读法是，2025 年 3 月的独角兽融资佐证充分，但 2025 年前的资本结构细节仍有噪音。

              产品和规模里程碑比精确财务数据更容易支撑。2026 年网站显示平台已经拓宽，在经典 FNOL 和消息模块之上加入 Emma、Voice AI、Fraud、CAT
              和结构化数据白皮书。官方页面宣称头部保险公司使用、支持广泛险种，并具备 SOC 2 Type II、HIPAA 和 ISO 27001 等安全认证。AI 微站报告头部 P&C 保险公司实现 84%
              流程完成率、理赔周期缩短 4–6 天、减少 3–5 通电话。这些仍是公司呈现的结果，但合在一起支持核心投资案例：Assured 已经达到有意义的市场相关性，而且相对于独角兽级估值，清晰披露的资本极少。
