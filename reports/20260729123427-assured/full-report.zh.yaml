  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方、用户、付款方和细分图谱
        blocks:
          - type: paragraph
            body: >-
              Assured 本质上是卖给保险公司的平台。可能的经济买方是 P&C 保险公司内部的理赔高管、COO、首席理赔官或转型负责人；付款方是保险公司；日常用户覆盖理赔员、呼叫中心代表、SIU 或 CAT
              团队、保单持有人，以及拖车、租车、查勘和维修网络等服务供应商伙伴。条款页进一步说明，最终索赔人通常只是因为其保险公司与 Assured 合作，才会接触 Assured；这一点很重要，因为它厘清了公司的 B2B2C
              模式，也解释了为什么下游满意度重要，即便直接付费客户是保险公司。


              对一家理赔自动化供应商来说，细分覆盖看起来异常宽。Assured 展示的模块覆盖个人车险、商业车险、房主险、商业财产险、工伤赔偿险和其他 P&C 险种；首页、AI
              页面和博客都强调服务领先或头部保险公司，而不是中小型代理机构或自保雇主。这说明装机基础可能偏向复杂的企业级保险公司，它们有足够理赔量来证明自动化合理。但公开记录仍没有披露按险种拆分的细分收入组合、平均合同规模，或
              Assured 是直接销售、通过系统集成商销售，还是经由核心系统伙伴销售。
