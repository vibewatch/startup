      - number: '2.4'
        title: 增长驱动、采用约束和保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              Assured 所在类别的需求驱动异常具体。JD Power 的 2026 年财产理赔研究显示，更快维修和支付周期会提升满意度；Assured
              则引用了保单持有人预期与传统时间线之间更刺眼的差距。气候相关损失严重度、劳动力短缺、维修网络瓶颈和更高损失成本，都提升了自动化的吸引力：它可以改善路由、收集文档并减少人工接触。咨询公司和供应商文献都把直通式处理、结构化数据、欺诈检测和数字沟通视为核心杠杆。这符合一个市场现实：买方不需要被说服「理赔很重要」，他们需要被说服的是，AI
              平台可以安全地改变运营模式。


              约束同样真实。NIST 的 AI RMF 和 GenAI Profile、EU AI Act，以及 EIOPA 的保险业指导都释放出同一个信号：理赔 AI
              不能只靠速度扩张；保险公司在高影响决策上需要治理、验证、隐私保护、透明度和人工监督。BCG 的试点到规模化缺口、NTT DATA 的治理发现，以及 Assured
              自己反复强调的结构化数据，都指向这个类别的核心矛盾：ROI 逻辑很强，但许多保险公司仍缺少兑现它所需的数据质量和组织对齐。因此，市场估算会随来源衡量的是狭窄理赔软件楔子还是完整保险 AI
              软件栈而大幅变化。审慎观点是，Assured 面向的是一个小但在增长的直接类别，它嵌在一个更大的转型预算里。
