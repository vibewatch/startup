      - number: '1.4'
        title: 不利信号、冲突数据和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Assured 的公开故事很强，但概览章暴露出几处真实尽调摩擦。第一，多家数据供应商在本应简单的公司基础事实上相互矛盾：CB Insights 显示总部在 650 Page Mill Road，而加州记录摘录和
              Tracxn 显示在 3 Peter Coutts Circle；累计融资额随来源不同从约 $23M 到 $42M；员工数从不到 100 人到接近 200
              人。第二，治理披露偏弱：除了管理层简介和投资者标识，公开层面几乎没有董事会或控制权信息。第三，公司平台营销覆盖面很广，部分主张仅靠公开材料无法独立审计，尤其是具名客户数量、收入运行率，以及每个模块对保险公司
              ROI 的确切贡献。

              也有一些更软的执行信号。Glassdoor 快照并非灾难级，但 17 条评价下 3.4/5 分、59%
              愿意推荐给朋友，以及一条评价标题提到「混乱的工程文化」，并不是投资人希望在一家向受监管企业销售关键工作流软件的平台公司里看到的状态。本次审阅期间，公开 /platform
              页面还返回了客户端异常；这只是小问题，但对一个强调运营严谨的理赔智能品牌来说，是可见的质量控制瑕疵。单独看，这些问题都不足以击穿论点；放在一起，它们强化了一个结论：投资人在把独角兽估值视为已充分去风险之前，Assured
              仍需要围绕治理、经审计商业指标和客户访谈做一手尽调。
