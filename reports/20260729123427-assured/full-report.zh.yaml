      - number: '8.4'
        title: 退出准备度、尽调问题和叫停触发器
        blocks:
          - type: paragraph
            body: >-
              仅看公开证据，Assured
              还不像一家能让投资人跳过条款或经济性尽调的公司。没有审计包，没有公开股权结构细节，没有披露现金消耗或现金跑道模型，也没有清晰公开拆分客户集中度或多模块扩张。这些都不意味着公司弱；它意味着公司仍部分依赖私有证据和投资人信念来定价。因此，正确的尽调重点很直接：确认当前
              ARR、收入留存、头部客户暴露、毛利率、现金消耗、现金跑道、合同条款，以及最强部署到底是完整生产上线，还是狭窄试点。如果答案强，建议可以很快改善，因为市场和产品叙事已经可信；如果答案弱，估值也可能快速压缩，因为当前估值很大一部分依赖假设，而不是已披露的财务证据。
