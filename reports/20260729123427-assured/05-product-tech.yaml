evidenceGaps:
- type: private-evidence-only
  severity: material
  topic: reference-architecture
  missingEvidence: A current reference architecture naming core services, model providers by task, audit/logging systems, and deployment topology.
  whyItMatters: Outside-in diligence can understand workflow intent but cannot fully price integration, scaling, or failure-mode risk without architecture detail.
  diligencePath: Request solution architecture diagrams, integration runbooks, and a redacted implementation pack from at least one production carrier.
  relatedQuestionRefs:
  - QE013
  - QE015
  - QE025
  relatedTableRefs:
  - TE003
- type: private-evidence-only
  severity: material
  topic: ai-governance-proof
  missingEvidence: Model-evaluation metrics, hallucination/containment rates, escalation thresholds, red-team summaries, and exception rates by claim type.
  whyItMatters: Agentic claims automation needs measurable safety and review boundaries to be underwritten for regulated insurance workflows.
  diligencePath: Request model-governance policies, eval dashboards, prompt-change controls, and human-review SOPs.
  relatedQuestionRefs:
  - QE022
  - QE023
  - QE026
  relatedTableRefs:
  - TE004
- type: private-evidence-only
  severity: medium
  topic: reliability-history
  missingEvidence: Status page history, uptime reporting, support SLAs, and incident postmortems.
  whyItMatters: Claims operations are time-sensitive; hidden reliability issues can erase workflow ROI quickly during CAT spikes or high-volume periods.
  diligencePath: Request SLA language, incident log for the last 12 months, and customer support escalation metrics.
  relatedQuestionRefs:
  - QE016
  - QE025
  relatedTableRefs:
  - TE003
  - TE005
