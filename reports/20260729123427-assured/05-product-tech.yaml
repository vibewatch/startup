- id: trust-safety-security-and-compliance
  title: Trust, security, privacy, and control plane risks
  body: 'Assured’s strongest trust signals are explicit. The security page states SOC 2 Type II, HIPAA, and ISO 27001 credentials; the disclosure page documents a responsible disclosure process; the privacy policy lays out the categories of claim, device, location, and communications data the platform collects; and the terms make clear that the company provides insurance-related software solutions rather than acting as a broker. For a claims platform that touches PII, PHI, photos, transcripts, and potentially sensitive accident narratives, those are important foundation controls. Voice AI and Emma pages also claim smart safeguards, escalation boundaries, protected-topic handling, and protection against jailbreaking and red-teaming.


    The risk is that public controls remain policy-level rather than implementation-level proof. Assured does not publicly document retention periods by data class, data residency options, red-team methodology, model-evaluation metrics, outage handling, or whether high-risk decisions are always reviewable by a human. EU and U.S. AI-risk sources underscore why those details matter: insurance AI is increasingly expected to be transparent, governable, auditable, and bias-aware. Assured’s public record suggests the company understands those obligations, but external diligence would still need architecture review, penetration-test summaries, certification reports, and model-governance evidence before treating the platform as fully underwritten from a security and compliance perspective.'
