- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer/process/component
  - role
  - dependency
  - risk
  rows:
  - - Structured intake layer
    - Captures claim facts, signatures, photos, and guided answers
    - Web/mobile UX, SMS, email, voice channels
    - Poor capture quality undermines downstream automation
  - - Data enrichment layer
    - Uses 50+ external sources and contextual validation
    - Third-party data providers and matching quality
    - Vendor outages or mismatches can degrade adjudication quality
  - - Workflow orchestration layer
    - Routes tasks, prompts follow-up, and triggers next steps
    - Rules engine, claim context, integration layer
    - Opaque routing logic can create explainability issues
  - - Agentic interaction layer
    - Emma and Voice AI automate conversations and collection
    - Foundation models, guardrails, escalation logic
    - Prompt injection, overreach, or bad handoffs can create liability
  - - Core-system integration layer
    - Files claims and syncs outputs into carrier systems
    - APIs into policy/claims/contact-center platforms
    - Integration fragility can slow deployments or create data drift
  - - Trust and audit layer
    - Session transcripts, reports, certifications, privacy, disclosure
    - Security/compliance operations and retention controls
    - Public detail is incomplete on logging depth and monitoring
  notes: This table is a synthesis from public product pages, not a company-published reference architecture.
