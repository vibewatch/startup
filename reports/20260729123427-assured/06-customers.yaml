evidenceGaps:
- type: private-evidence-only
  severity: material
  topic: retention-and-renewals
  missingEvidence: GRR, NRR, renewal history, average contract length, and expansion by module and customer vintage.
  whyItMatters: Assured can look like a sticky platform or a promising pilot portfolio depending on retention data.
  diligencePath: Request cohort tables, renewal calendar, top-20 account module adoption, and churn analysis.
  relatedQuestionRefs:
  - QU017
  - QU018
  - QU025
  relatedTableRefs:
  - TU004
- type: private-evidence-only
  severity: material
  topic: customer-concentration
  missingEvidence: Top-customer revenue share, customer count, ARR per account cohort, and pipeline concentration.
  whyItMatters: A carrier-focused model can create substantial concentration risk even with strong product-market fit.
  diligencePath: Request customer concentration schedule and segmented ARR by tier, line, and geography.
  relatedQuestionRefs:
  - QU022
  - QU025
  relatedTableRefs:
  - TU005
- type: private-evidence-only
  severity: medium
  topic: named-customer-proof-table-gap
  missingEvidence: Named production references with deployment scope, go-live date, owner contact, measured outcomes, and renewal status.
  whyItMatters: Anonymous testimonials do not substitute for diligence-grade customer calls.
  diligencePath: Request at least three reference calls spanning executive sponsor, claims operations user, and core-systems integration owner.
  relatedQuestionRefs:
  - QU011
  - QU014
  - QU026
  relatedTableRefs:
  - TU003
