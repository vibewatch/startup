company:
  name: Assured
chapter:
  number: 6
  title: Customers
  summary: 'Assured’s customer story is strongest at the segment and outcomes level, not at the named-logo level. The company clearly sells to P&C carriers and then serves downstream users such as policyholders, claims adjusters, call-center representatives, and service providers inside those carriers’ workflows. Public materials repeatedly claim enterprise-scale usage—tens of millions of claims annually, top-insurer deployments, and significant workflow outcomes such as 84% flow completion, 4-6 day cycle-time reduction, 3-5 fewer calls per claim, 4.8 claimant satisfaction, 79 adjuster NPS, and roughly 70% autonomous handling by Emma in some interactions. The weak point is proof quality: most public customer evidence is anonymous or role-based rather than named carriers with detailed case studies, so durability, concentration, renewal, and production-vs-pilot depth remain under-documented.'
sections:
- id: buyer-user-payer-map
  title: Buyer, user, payer, and segment map
  body: 'Assured is fundamentally a carrier-sold platform. The likely economic buyer is a claims executive, COO, chief claims officer, or transformation leader inside a P&C insurer; the payer is the carrier; and the daily users span adjusters, call-center representatives, SIU or CAT teams, policyholders, and service-provider partners such as tow, rental, inspection, and repair networks. The terms page reinforces that the end claimant typically accesses Assured only because their insurance carrier partners with Assured, which is important because it clarifies the company’s B2B2C model and why downstream satisfaction matters even though the direct paying customer is the carrier.


    Segment breadth appears unusually wide for a claims-automation vendor. Assured presents modules across personal auto, commercial auto, homeowners, commercial property, workers’ compensation, and other P&C lines, while the home, AI, and blog pages all emphasize support for leading or top insurers rather than SMB agencies or self-insured employers. That suggests the installed base is skewed toward complex enterprise carriers with enough claim volume to justify automation, but the public record still does not reveal segment revenue mix by line, average contract size, or whether Assured sells directly, through system integrators, or via core-system partners.'
