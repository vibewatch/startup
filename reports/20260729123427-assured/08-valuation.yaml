company:
  name: Assured
chapter:
  number: 8
  title: Valuation
  summary: 'Assured has enough market and product credibility to merit investor attention, but not enough public financial proof to justify underwriting the last reported unicorn mark with confidence. The clean outside-in anchor is the March 2025 $23M Series B at roughly $1B valuation; the clean outside-in problem is that public revenue evidence is still mostly tracker-based, with GetLatka citing about $22M ARR and other sources offering rougher, conflicting signals. That combination implies an approximate 45x ARR multiple—well above the public band for claims-tech and insurtech comparables such as Guidewire, CCC, Lemonade, and Root. The right call is therefore track / research-more with medium confidence and high risk: positive on company quality, cautious on price. A reasonable public-evidence range is roughly $250M-$550M bear, $600M-$950M base, and $1.0B-$1.3B bull, with upgrade potential only if private diligence confirms materially stronger ARR, retention, margins, and customer breadth
    than the current public record can prove.'
sections:
- id: recommendation-framework
  title: Recommendation and price discipline
  body: 'Assured looks like a credible company in an attractive workflow niche, but the public record is still much better at proving strategic relevance than at proving investability at the last reported price. The company clearly sits in a real pain point: P&C carriers want faster claims handling, lower loss-adjustment expense, better claimant experience, and more automation inside legacy-heavy operations. Assured''s official materials, investor descriptions, and third-party coverage all support that high-level story. The difficulty is valuation translation. Public evidence confirms a March 2025 unicorn round and an unusually efficient funding history, yet it still does not provide the revenue-quality, retention, margin, or cap-table detail that would justify underwriting the company as if the price were already self-evidently cheap. The correct stance is therefore price-sensitive and evidence-sensitive: track or research more, not a blind yes or a blind no. At the current public anchor,
    the company may be good enough to merit deeper diligence, but not good enough to bypass it.'
