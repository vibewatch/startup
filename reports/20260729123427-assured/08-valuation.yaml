- id: TV003
  slug: bull-base-bear-scenario-table
  title: Bull / base / bear scenario table
  description: Reference valuation ranges and scenario assumptions under current public-evidence constraints.
  columns:
  - Scenario
  - Key assumptions
  - Valuation range ($M)
  - Probability signal
  - What would confirm / break it
  rows:
  - - Bull
    - ARR and deployment breadth are materially stronger than public trackers show; multi-module expansion is real; enterprise AI claims budgets stay urgent.
    - $1,000-$1,300
    - 20-25%
    - Confirm with strong ARR, NRR, concentration, and margin proof; break with pilot-heavy or concentrated deployments.
  - - Base
    - Company quality is real but public proof remains incomplete; private diligence confirms good but not extraordinary economics; premium multiple compresses somewhat.
    - $600-$950
    - 45-50%
    - Confirm with clean but not elite growth and retention; break with weak expansion or preference-heavy terms.
  - - Bear
    - ARR is lower than tracker estimates, growth slows, concentration is high, or market multiples compress toward public workflow-software bands.
    - $250-$550
    - 25-35%
    - Confirm with weak cohort quality, thin production proof, or difficult terms; break only if private data disproves those concerns.
  notes: Probabilities are judgment signals, not statistical forecasts. Ranges are meant to bound public-evidence outcomes, not to imply market precision.
