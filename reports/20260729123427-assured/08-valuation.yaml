- id: TV005
  slug: thesis-break-and-kill-triggers-table
  title: Thesis-break and kill triggers table
  description: Signals that would materially weaken the current investment view.
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue quality miss
    - Private ARR or revenue is materially below tracker-based expectations.
    - Breaks the case that current valuation simply reflects hidden scale.
    - Downgrade toward avoid unless price resets sharply.
  - - Concentration shock
    - One or two customers represent an outsized share of revenue or deployment proof.
    - Raises renewal and budget-risk exposure.
    - Increase bear-case weighting and demand stronger terms.
  - - Weak expansion data
    - NRR, module expansion, or production rollout breadth is mediocre.
    - Undermines premium-multiple justification.
    - Treat the current mark as overextended.
  - - Preference-heavy financing
    - Cap table reveals liquidation or anti-dilution terms that raise effective entry price.
    - Makes headline valuation less comparable and worsens downside.
    - Pause unless structure improves.
  - - Competitive compression
    - Incumbents or adjacent AI vendors erase the differentiation story in production.
    - Reduces strategic premium and exit optionality.
    - Move toward base/bear case and tighten price discipline.
  notes: These are kill triggers for the valuation thesis, not statements that the business is failing operationally.
  claimRefs:
  - CV022
  - CV027
  - CV028
  - CV040
  - CV041
- id: TV006
  slug: final-diligence-asks-table
  title: Final diligence asks table
  description: Highest-priority private questions required before underwriting Assured near the current public anchor.
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current ARR / revenue
    - Current monthly or quarterly recurring revenue, growth rate, and booked-vs-recognized bridge.
    - Directly determines whether the implied multiple is 20x, 30x, 45x, or higher.
    - Management data room / CFO pack.
  - - Retention and expansion
    - GRR, NRR, logo retention, module attach, and cohort behavior.
    - Premium valuation requires evidence of compounding, not just initial pilots.
    - Board metrics / customer cohort export.
  - - Customer concentration
    - Top-5 revenue share and dependency on any flagship carrier.
    - Concentration can turn a premium multiple into a fragile one.
    - Revenue concentration schedule.
  - - Margins and burn
    - Gross margin, burn, runway, and hiring plan.
    - Capital efficiency is more credible if margins are software-like and burn is controlled.
    - Finance model and budget review.
  - - Cap table and terms
    - Liquidation preferences, anti-dilution, debt, SAFEs, and employee-option overhang.
    - Effective entry price and downside protection depend on structure, not just headline mark.
    - Counsel / investor docs.
  - - Deployment proof
    - Named or attributable production customers, rollout scope, and measurable ROI.
    - Validates whether the product is truly embedded and scaling.
    - Customer reference calls and implementation artifacts.
  notes: If these diligence asks come back strong, Assured can move from interesting company to supportable investment case quickly; if they come back weak, valuation risk likely dominates.
