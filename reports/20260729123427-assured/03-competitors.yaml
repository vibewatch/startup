  rows:
  - - Assured
    - AI claims automation overlay
    - Private; March 2025 unicorn round near $1B
    - P&C carriers wanting FNOL-to-settlement workflow automation
    - Modular, AI-first automation across intake, communication, triage, fraud, CAT, and settlement support
    - Public customer, pricing, and traction detail remain thin
  - - Guidewire ClaimCenter
    - Incumbent core claims platform
    - 270+ ClaimCenter customers in 30+ countries; 450+ insurers on Guidewire platform
    - Large and mid-market P&C insurers already in Guidewire ecosystem
    - Deep claims-system-of-record footprint with embedded AI and marketplace ecosystem
    - Heavier core-platform adoption motion than overlay specialists
  - - Duck Creek
    - Broad P&C core platform
    - 370+ companies; 30M+ claims processed via OnDemand
    - Carriers seeking intelligent core across policy, billing, rating, and claims
    - Claims module bundled into broader low-code intelligent core with agentic applications
    - Claims is part of a larger core transformation ask
  - - CCC Intelligent Solutions
    - Claims workflow network / auto-heavy ecosystem
    - 35,000+ businesses connected; $1.06B 2025 revenue public comp
    - Insurers, collision, repair, automotive ecosystem
    - Dense ecosystem connectivity and AI-enabled workflows across P&C economy
    - More auto-and-commerce weighted than Assured’s full cross-claim orchestration pitch
  - - Tractable
    - AI imaging / damage estimation specialist
    - Private; high-throughput image AI processing for vehicles and property
    - Auto and property insurers focused on appraisal and estimating
    - Deep computer-vision expertise and API-driven assessments
    - Narrower workflow ownership than Assured
  - - Hi Marley
    - Conversational claims specialist
    - Private; communication-focused claims vendor
    - Carriers prioritizing claims communication and CX
    - Integrated claims messaging with ROI claims around lower call volumes and shorter cycles
    - Point solution centered on communication rather than end-to-end orchestration
  - - Snapsheet
    - Cloud-native claims platform
    - 170+ customers and investors, including 16 of top 20 P&C carriers
    - Carriers, MGAs, TPAs, fleet and logistics
    - Modern full claims system with no-code automation, integrated payments, and named customer proof
    - Requires carriers to evaluate a broader platform alternative, not just an automation overlay
  - - Lemonade / Root
    - AI-native insurer substitute
    - Public digital carriers with automated claims experiences
    - Carriers benchmarking internal-build ambition
    - Proof that more automated claims journeys can be built in-house by insurers themselves
    - Not vendor platforms sold to carriers; poor direct comparability
  notes: 'Coverage is intentionally partial and buyer-centric: it focuses on the most relevant broad incumbents, specialist wedges, and substitute models for Assured’s P&C claims-automation job.'
