evidenceGaps:
- type: private-evidence-only
  severity: material
  topic: win-loss-data
  missingEvidence: Direct win/loss records showing where Assured beat or lost to Guidewire, Duck Creek, CCC, Snapsheet, Tractable, or Hi Marley.
  whyItMatters: Competitive strength is most credible when grounded in actual buyer decisions, not only product-page comparisons.
  diligencePath: Request deal-level competitive notes, references from displaced accounts, and reasons for loss by competitor.
  relatedQuestionRefs:
  - QP024
  - QP025
  relatedTableRefs:
  - TP001
  - TP004
- type: private-evidence-only
  severity: material
  topic: named-customer-proof
  missingEvidence: Named Assured customers, production claim volumes, renewal history, and module adoption depth.
  whyItMatters: Incumbents and some rivals have stronger visible proof, which makes Assured’s public moat harder to underwrite.
  diligencePath: Ask for three named customer references, expansion histories, and proof of realized ROI by module.
  relatedQuestionRefs:
  - QP022
  - QP025
  relatedTableRefs:
  - TP001
- type: missing-source
  severity: minor
