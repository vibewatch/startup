- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Verified ARR / GAAP revenue
    - Without this, every valuation multiple is speculative
    - Request board deck, investor update, and trailing 24-month monthly revenue bridge
  - - Gross margin by product and services mix
    - Determines whether Assured behaves like high-margin software or heavier claims enablement
    - Request P&L split by software, services, communications, and AI-inference cost
  - - Burn and cash balance
    - Prevents any meaningful runway view
    - Request monthly cash burn, balance-sheet snapshot, and scenario plan
  - - Retention and expansion data
    - Critical to the modular land-and-expand thesis
    - Request GRR, NRR, cohort expansion, and renewal rates by customer segment
  - - Sales efficiency metrics
    - Needed to assess GTM leverage and payback
    - Request CAC, median sales cycle, pilot conversion, and sales productivity
  - - Customer concentration
    - High concentration would change revenue durability and financing risk
    - Request top-10 customer revenue share and largest-logo contract terms
  notes: The gating issue is not absence of a business model; it is absence of enough verified data to underwrite the model.
