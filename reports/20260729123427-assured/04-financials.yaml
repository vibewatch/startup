evidenceGaps:
- type: private-evidence-only
  severity: material
  topic: verified-arr
  missingEvidence: Board- or finance-certified ARR / revenue history by month or quarter.
  whyItMatters: A reliable revenue denominator is required for any valuation, burn, or productivity analysis.
  diligencePath: Request the last 24 months of monthly recurring or contracted revenue, plus deferred revenue and churn bridge.
  relatedQuestionRefs:
  - QI006
  - QI019
  - QI025
  relatedTableRefs:
  - TI003
  - TI005
- type: private-evidence-only
  severity: material
  topic: gross-margin-and-burn
  missingEvidence: Gross margin, hosting/comms/inference cost, services mix, monthly burn, and current cash balance.
  whyItMatters: Without these, there is no credible runway or unit-economics underwriting.
  diligencePath: Request current board package, latest P&L, and cash waterfall with scenario plan.
  relatedQuestionRefs:
  - QI011
  - QI012
  - QI020
  - QI022
  relatedTableRefs:
  - TI003
  - TI004
- type: private-evidence-only
  severity: material
  topic: retention-and-expansion
  missingEvidence: GRR, NRR, renewal rates, attach rates, and top-customer concentration.
  whyItMatters: Assured’s modular-platform thesis depends on durable land-and-expand behavior.
  diligencePath: Request cohort retention tables, top-10 customer revenue share, and module adoption by customer vintage.
  relatedQuestionRefs:
  - QI018
  - QI019
  - QI021
  - QI025
  relatedTableRefs:
  - TI001
  - TI005
- type: conflicting-data
  severity: material
  topic: historical-funding-total
  missingEvidence: A company-confirmed financing chronology reconciling priced rounds, loans, SAFEs, and secondary transactions.
  whyItMatters: The capital-efficiency thesis changes materially depending on whether total external capital is about $23M or above $40M.
  diligencePath: Request cap table summary, closing memos, and all financing instruments since founding.
