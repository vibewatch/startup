  title: "Financials"
  summary: "Alan achieved more than €800M in ARR in Q1 2026 with 53% YoY growth, driven by full-stack group health policies across 37,000 businesses and 1.1M members, reaching operational profitability in its core French market. Recent financing pushed total raised capital to over $1.4B and valuation to $6.4B (€5.5B), while underlying health claims loss ratios, reinsurance structure, and international unit economics remain undisclosed private data."
sections:
  - id: "revenue-model-and-streams"
    title: "Revenue Model, Pricing Mechanics, and Income Streams"
    body: "Alan operates a subscription-based health insurance model combining core corporate supplementary health coverage with digital clinic access and prevention services. The primary revenue driver is employer-paid monthly premium subscriptions per employee across 37,000 corporate clients, representing the bulk of its €800M+ ARR base. Complementary tiers and employee-level add-ons expand monetization, while the Alan Clinic integrates preventative telehealth into standard plans. Realized contract pricing reflects corporate payroll scale and sector risk classifications under ACPR regulation, differing from entry-tier list estimates. Corporate contracts are structured as renewable group master agreements, providing high recurring baseline predictability, though tender-driven large contracts such as the 135,000 civil servants award introduce procurement pricing dynamics."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics, Claims Handling, and Cost Structure"
    body: "Alan's operating model relies on automated claims adjudication and an AI-native operational architecture to lower administrative expense ratios compared to legacy mutuelles. Automated workflows process 50% of claims in under 5 minutes and 90% within a day, allowing high customer density per operational headcount. The company combines digital health clinic consultations, delivering over 260,000 medical chats, to proactively manage subscriber care navigation and claims severity. While operational profitability has been achieved in France, comprehensive statutory loss ratios, net combined ratios, and reinsurance ceding commissions remain undisclosed private metrics, representing material underwriting diligence gaps."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-growth-runway"
    title: "Capital Adequacy, Solvency Requirements, and Forward Runway"
    body: "Following €580M in total capital secured across 2026 funding rounds—including a €100M Series F extension in March and a €480M Series G led by Prosus in June—Alan holds substantial liquidity. These funds support European expansion across Belgium, Spain, and Canada, as well as AI infrastructure investments and statutory regulatory capital required by the ACPR. Net annual losses contracted from $61M in 2023 to $56M in 2024 as the core French market achieved operating profitability, providing extended operating runway toward overall break-even. With an ARR target of $1.16B for full-year 2026, the company balances international market entry against capital conservation."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
