callouts:
  - calloutType: "insight"
    title: "Traction Is Observable; Market Size Is Not"
    body: "The source set supports a substantial operating footprint through ARR, members, businesses, public-contract capacity, and product engagement. None of those metrics supplies a market-spend denominator, and ARR must not be treated as accounting revenue or TAM [CM007, CM008, CM010, CM011, CM012]."
    claimRefs:
      - "CM007"
      - "CM008"
      - "CM010"
      - "CM011"
      - "CM012"
  - calloutType: "risk"
    title: "Weak Secondary Pages Cannot Close the Sizing Gap"
    body: "One allocated report described an unrelated generic technology company and generic executives, so it is retained only as evidence of source-quality risk and is excluded from quantitative sizing [CM015]."
    claimRefs:
      - "CM015"
