  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >-
              Alan segments its customer base across three core purchaser groups: enterprise and corporate employers,
              public-sector government bodies, and self-employed individuals and retirees. Historically rooted in
              venture-backed tech startups and small-to-medium businesses (SMBs) across France, Alan's commercial base
              has expanded to encompass large multinational corporate accounts including HP and Volkswagen in Spain and
              Belgium, alongside over 37,000 corporate clients overall. Corporate plan sponsors represent the primary
              economic buyer, funding group health cover and preventative care packages for employees, while end users
              interact via Alan's native mobile portal for claims submission, optical vouchers, and clinical
              telemedicine consultations. The economic value proposition for SMB employers centers on extreme
              administrative simplification, with 98% of SMB client administrators spending fewer than two hours
              annually managing their health coverage programs. In the public sector, Alan won a milestone mandate
              covering up to 135,000 French civil servants and their dependents, transforming the state into a core
              revenue counterparty. However, detailed economic breakdowns—such as average revenue per account (ARPA),
              gross revenue distribution across enterprise tiers, and regional member splits between France, Belgium,
              Spain, and Canada—remain closely held private operational metrics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
