      - number: '7.3'
        title: Counterparty Concentration and Underwriting Economics
        blocks:
          - type: paragraph
            body: >-
              Alan's commercial expansion is heavily concentrated in sovereign and large-enterprise counterparties,
              including a major contract insuring up to 135,000 French civil servants and their dependents [CR002]. This
              public-sector concentration exposes the business to statutory procurement rebidding cycles, political
              budgetary pressures, and statutory reimbursement tariff resets [CR002]. Furthermore, while Alan achieved
              operational profitability in France on €800M+ ARR, loss ratios, combined operating ratios, and reinsurance
              cessions are not publicly disclosed, obscuring true underwriting resilience against healthcare inflation
              and severe medical claims volatility [CR002, CR003, CR004]. Macroeconomic reliance on external lead
              sponsors such as Prosus and Index Ventures underlines capital structure dependence until international
              units in Belgium, Spain, and Canada reach self-sustaining operational break-even [CR002, CR004].
            claimRefs:
              - CR002
              - CR003
              - CR004
      - number: '7.4'
        title: Risk Registers and Exhibits
        blocks:
          - type: paragraph
            body: >-
              The comprehensive evaluation of Alan's risk profile synthesizes regulatory hurdles, cybersecurity failure
              modes, and structural counterparty dependencies across European and North American operations. The
              exhibits below itemize the regulatory risk register, operational resilience criteria, and partner
              counterparty dependencies that govern Alan's long-term enterprise solvency [CR002, CR004, CR005]. Every
              item evaluates potential failure scenarios, mitigation maturity, and residual exposures to inform
              investment diligence and continuous portfolio monitoring. Furthermore, cross-border expansion into
              Belgium, Spain, and Canada introduces localized supervisory variance that requires ongoing legal scrutiny
