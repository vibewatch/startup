            title: Domestic Unit Economic Proof and Public-Sector Validation
            body: >-
              Alan's achievement of operational EBITDA profitability in France alongside a 96% employee affiliation rate
              across the 130,000+ civil servant Ministry of Finance contract validates that direct digital health
              underwriting can generate positive unit economics at enterprise scale [CO003, CO004].
            calloutType: strength
            claimRefs:
              - CO003
              - CO004
          - type: callout
            title: Underwriting Opacity and Statutory Loss Profile
            body: >-
              Historical consolidated net losses totaling $117 million across 2023-2024 combined with the complete
              non-disclosure of health loss ratios and reinsurance terms leave underlying insurance risk exposure
              unverified by independent auditors [CO003, CO008].
            calloutType: risk
            claimRefs:
              - CO003
              - CO008
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Alan defines its product category more broadly than complementary insurance alone: its official
              description combines insurance, immediate care access, and prevention, with insurance, clinician access,
              mental-health journeys, optical benefits, and health guidance presented through one platform [CM001,
              CM013]. The observable commercial perimeter includes companies of all sizes, governments, self-employed
              people, and retirees [CM002]. This makes employer or public health-benefit budgets the principal
              organizational entry point, while individual coverage is a separate route. The retained evidence does not
              establish that Alan captures statutory public-health budgets, hospital expenditure, pharmaceutical spend,
              or the whole digital-health market; those categories are therefore excluded from the sizing boundary
              rather than folded into a broad TAM. Status-quo substitutes include fragmented insurance, reimbursement
              administration, clinician access, and prevention services, but the source set does not quantify spending
              by substitute or the share available to an integrated vendor.
            claimRefs:
              - CM001
              - CM002
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
      - number: '2.2'
        title: Evidence-Constrained Sizing and Current Reach
        blocks:
          - type: paragraph
            body: >-
              The allocated sources do not provide a methodology-backed total, serviceable, or obtainable market
              estimate for Alan's defined boundary. They instead provide company-scale indicators with different periods
              and denominators. TechCrunch reported €785 million of annual recurring revenue for 2025, up 53% from the
              end of 2024, while later June sources reported more than €800 million of ARR in Q1 2026 and more than 1.1
              million people served [CM008, CM010, CM011]. These are not interchangeable with accounting revenue,
              premium volume, addressable spend, or cash available. A French public-sector contract covering up to
              135,000 civil servants and relatives shows institutional reach, but “up to” is a contract ceiling rather
              than realized enrollment [CM007]. The resulting sizing view is deliberately bottom-up: it documents
              realized operating scale and leaves external market denominators as a material diligence gap instead of
              extrapolating a precise TAM, SAM, or SOM.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
