chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Pedigree, and Governance
        blocks:
          - type: paragraph
            body: >-
              Alan was founded in 2016 in Paris, France, by co-founder and Chief Executive Officer Jean-Charles
              Samuelian-Werve to eliminate structural fragmentation between health insurance, care access, and clinical
              prevention [CO001, CO002]. Operating as a licensed, full-stack digital health insurer—the first
              independent carrier granted a regulatory underwriting license in France since the 1980s—the enterprise
              provides comprehensive health coverage, rapid automated claims reimbursement, and integrated telemedicine
              to corporate employers, public-sector institutions, self-employed professionals, and retirees [CO001,
              CO003, CO007]. Samuelian-Werve, an actuary with engineering degrees from École des Ponts ParisTech and an
              MBA from Collège des Ingénieurs, previously co-founded aviation seating manufacturer Expliseat and serves
              as a non-operating co-founder and board member of frontier artificial intelligence lab Mistral AI [CO002,
              CO003]. Governance balances strong founder control with institutional board oversight from European and
              global venture capital firms, though operational execution remains heavily dependent on Samuelian-Werve's
              dual leadership across product innovation and corporate strategy [CO002, CO004]. Operational scale
              encompasses approximately 740 to 790 employees operating across four core jurisdictions: France, Belgium,
              Spain, and Canada [CO003, CO004, CO008].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.2'
        title: Capitalization History, Valuation Trajectory, and Balance Sheet
        blocks:
          - type: paragraph
            body: >-
              Alan's capitalization demonstrates sustained institutional investor sponsorship throughout macroeconomic
              repricing cycles in European technology [CO003, CO005]. In March 2026, the company closed a €100 million
              round led by existing backer Index Ventures with participation from Greenoaks, Kaaf, SH, Belgian banking
              group Belfius, and strategic business angels, establishing an interim post-money valuation of €5.0 billion
              ($5.83 billion) [CO003, CO008]. On June 25, 2026, Dutch global consumer internet and technology investment
              group Prosus led a landmark €480 million Series G financing round alongside Index Ventures, Teachers'
              Venture Growth, and Dara Holdings, repricing the company at a €5.5 billion valuation [CO005, CO006].
              Cumulative equity funding reached €1.295 billion ($1.4 billion), giving Alan substantial balance-sheet
              liquidity to absorb underwriting volatility, expand Solvency II capital buffers, and fund aggressive
              product R&D [CO005, CO006]. However, the company maintains private debt and reinsurance structures under
              nondisclosure, leaving exact net cash balances, secondaries, and statutory solvency ratios unconfirmed
              [CO005, CO008].
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO005
              - CO006
      - number: '1.3'
        title: Commercial Scale, Financial Performance, and Market Position
        blocks:
          - type: paragraph
            body: >-
              Commercial momentum accelerated throughout 2025 and 2026, driven by corporate employer adoption, automated
              claims processing, and large public-sector tender wins [CO003, CO004]. Alan finished 2025 with €785
              million ($915 million) in annual recurring revenue, reflecting 53% year-over-year expansion while
              achieving operational profitability in its core French insurance perimeter [CO003, CO008]. Trailing
              expansion continued into 2026, reaching €804 million in signed ARR across 1.1 million members in Q1 2026,
              and scaling to approximately €840 million in signed ARR and 1.14 million members by the close of Q2 2026
              [CO004, CO005, CO006]. Enterprise and public customer density expanded markedly following the
              implementation of health insurance coverage for 130,000 to 135,000 civil servants and dependents under
              France's Ministry of Finance contract, which achieved a 96% internal affiliation rate [CO003, CO004].
              Internationally, Alan maintains commercial multi-country underwriting in Belgium, Spain—serving enterprise
              accounts including HP and Volkswagen—and Canada, where it secured regulatory insurance licensing across
              all provinces [CO003, CO005].
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
      - number: '1.4'
        title: Underwriting Economics, Historical Losses, and Growth Headwinds
        blocks:
          - type: paragraph
            body: >-
              Despite domestic operational profitability, Alan's consolidated financial trajectory reflects material
              underwriting and market-expansion trade-offs [CO003, CO008]. The company incurred consolidated statutory
              net losses of $61 million in 2023 and $56 million in 2024 before approaching overall operational
              break-even in 2025 [CO003, CO008]. Management deliberately prioritizes revenue scale over near-term group
              net margins, targeting $1.16 billion in ARR during 2026 through heightened investment in proprietary
              artificial intelligence systems, clinical workflow automation, and foreign market launches [CO003, CO008].
              Crucially, while gross margins benefit from direct digital distribution without third-party broker
              commissions, actual medical loss ratios, prévoyance disability loss experience, combined operating ratios,
              and third-party reinsurance retrocession costs remain strictly undisclosed [CO004, CO008]. Furthermore,
              rapid internationalization exposes Alan to differentiated healthcare reimbursement regimes across Spain,
              Belgium, and Canada, where local underwriting unit economics have yet to independently prove their
              structural profitability [CO003, CO005].
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO008
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
