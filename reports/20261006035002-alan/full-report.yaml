      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Alan's disclosed customer perimeter spans companies, governments, self-employed people, and retirees,
              while a third-party profile further identifies SMEs, large enterprises, individual consumers, and public
              entities as target segments [CM002, CM013]. Employees, civil servants, relatives, and individual
              policyholders are the users or covered lives; the purchasing entity differs by segment. For employer and
