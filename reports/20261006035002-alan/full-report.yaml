      - number: '4.2'
        title: Unit Economics, Claims Handling, and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Alan's operating model relies on automated claims adjudication and an AI-native operational architecture
              to lower administrative expense ratios compared to legacy mutuelles. Automated workflows process 50% of
              claims in under 5 minutes and 90% within a day, allowing high customer density per operational headcount.
              The company combines digital health clinic consultations, delivering over 260,000 medical chats, to
              proactively manage subscriber care navigation and claims severity. While operational profitability has
              been achieved in France, comprehensive statutory loss ratios, net combined ratios, and reinsurance ceding
              commissions remain undisclosed private metrics, representing material underwriting diligence gaps.
            claimRefs:
