      - number: '2.4'
        title: Adoption Drivers, Constraints, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              Alan's integrated model creates a plausible adoption mechanism: one relationship can combine coverage,
              claims handling, clinician access, and preventive engagement, while the official page reports 260,000
              medical chats, more than 30% weekly activity in challenges, and rapid reimbursement processing [CM003,
              CM004, CM005]. Those operational measures show product use but do not prove lower claims costs, better
              health outcomes, or superior employer ROI. Expansion across Belgium, Spain, and Canada and reporting of
              operations across four countries broaden the serviceable footprint, yet country-specific premium pools and
              economics are not disclosed [CM009, CM012]. Independent SWOT commentary identifies country-specific
              regulation, incumbent responses, and pressure on SME benefit budgets as constraints; these are analytical
              risk signals, not measured incidence rates [CM014]. The search pool also contained a purported company
              report that described an unrelated generic technology business, illustrating why weak secondary pages
              cannot close the market-sizing gap [CM015]. Valuation should therefore rely on verified operating scale
              and scenario ranges, not a fabricated top-down market multiple.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM012
              - CM014
              - CM015
