      - number: '6.3'
        title: Retention Durability, Procurement Friction, and Concentration Exposure
        blocks:
          - type: paragraph
            body: >-
              Evaluating customer retention and revenue durability at Alan requires separating verified operational
              velocity from private underwriting disclosures. In enterprise B2B health benefits, maintaining durability
              requires disciplined ideal customer profile governance, seamless onboarding, and high retention and net
              revenue retention (NRR). While Alan achieved operating break-even and operational profitability in its
              core French domestic market, management has not published formal net revenue retention, gross revenue
              retention, or multi-year account cohort churn metrics. This disclosure omission creates analytical opacity
              regarding whether ARR expansion is driven by underlying headcount growth within existing corporate
              accounts or entirely by net-new logo acquisition. Furthermore, customer concentration has intensified with
              major public-sector tender awards. The French civil servant contract, comprising up to 135,000 covered
              lives, concentrates an estimated 10% to 15% of Alan's total member base within a single administrative
              counterparty subject to public procurement cycles, legislative changes, and renegotiation pressure. In
              international territories, cross-border regulatory compliance and local healthcare coordination create
              distinct procurement friction relative to the established French mutuelle ecosystem. Finally, general
              corporate data breach risks highlight the acute vulnerability of customer and member trust across digital
              administrative and legal health systems, reinforcing the diligence requirement for audited third-party
              customer retention and data security disclosures.
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Preventative Workflow Engagement Drives Employer Stickiness
            body: >-
              Alan transforms traditional reactive health insurance into daily employee engagement, capturing over 30%
              weekly active user participation in wellness challenges and resolving 50% of claims within 5 minutes. This
              consumer-grade service level creates bottom-up employee advocacy, prompting 98% of SMB clients to spend
              under two hours annually on benefits administration.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: Public Sector Tender Concentration and Underwriting Opacity
            body: >-
              Winning coverage for 135,000 French civil servants and their families provides immense top-line scale but
              introduces severe single-counterparty exposure. Coupled with the complete absence of public NRR, GRR, and
              cohort churn figures, investors cannot independently audit whether core private-sector accounts renew and
              expand profitably.
            calloutType: risk
            claimRefs:
              - CU002
              - CU007
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Prudential Governance Risks
        blocks:
          - type: paragraph
            body: >-
              Alan holds a full independent insurance license in France granted under the supervision of the French
              Prudential Supervision and Resolution Authority (Autorité de Contrôle Prudentiel et de Résolution, ACPR),
              making it the first independent carrier licensed in France since the 1980s [CR002]. Operating as a
              full-stack risk-bearing carrier subjects Alan to stringent Solvency II capital adequacy mandates, reserve
              requirements, and underwriting compliance checks [CR002]. While the company recently secured a €480
              million Series G investment at a €5.5 billion valuation led by Prosus, the closing remains explicitly
              contingent upon regulatory approval and formal sign-off from French financial authorities [CR004].
              Multi-jurisdictional expansion into Belgium, Spain, and Canadian provincial jurisdictions multiplies
              compliance overhead and exposes the group to divergent local insurance rules and statutory solvency
              standards [CR002, CR004]. The primary diligence imperative centers on monitoring ACPR regulatory sign-off
              timelines, anti-concentration capital buffers, and potential capital call triggers across international
              operating subsidiaries.
            claimRefs:
              - CR002
              - CR004
          - type: table
