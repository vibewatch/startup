    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions
      - Implied ARR & Valuation Range
      - Probability Signal
      - Downside Triggers & Diligence Asks
    rows:
      - - Bull Case
        - 50%+ ARR growth sustained; international markets reach break-even; AI reduces claims overhead
        - €1.3B+ ARR by 2027; €7.5B to €9.0B valuation at 6.0x-7.0x forward multiple
        - 25% probability; contingent on international margin parity
        - Break in growth below 40% or escalation in customer acquisition cost
      - - Base Case
        - Growth moderates to 30-35%; France remains profitable; international units show slow margin ramp
        - €1.05B to €1.15B ARR; €5.0B to €5.8B valuation at 4.5x-5.5x ARR multiple
        - 55% probability; reflects current market consensus and Series G pricing
        - Margin stagnation in Spain/Belgium or regulatory friction in Canada
      - - Bear Case
        - Medical claims inflation spikes; combined ratio deteriorates; international expansion stalls
        - €850M to €900M ARR; €3.0B to €3.8B valuation at 3.5x-4.0x multiple (down-round)
        - 20% probability; heightened by historical $117M losses and underwriting opacity
        - ACPR regulatory intervention, reinsurance rate hike, or cash burn acceleration
    notes: >-
      Scenario models apply forward ARR multiples consistent with European high-growth fintech/insurtech benchmarks;
      valuation ranges represent implied post-money equity value.
