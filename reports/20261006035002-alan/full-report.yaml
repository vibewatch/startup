      - number: '5.2'
        title: Modular Product Line Map and Clinical AI Architecture
        blocks:
          - type: paragraph
            body: >-
              Alan structures its technical architecture across three vertically integrated modules: the Core Insurance
              & Adjudication Engine, the Clinical & Telehealth Delivery Layer, and the Enterprise Benefits
              Administration Portal [CE001, CE004, CE008]. The Core Insurance Engine handles automated policy
              underwriting, French Sécurité Sociale statutory coordination (NOEMIE data exchange), teletransmission
              feeds, and automated optical character recognition (OCR) of pharmacy and physician receipts [CE001,
              CE006]. Sitting directly atop the financial core is the clinical services layer, powered by Alan Clinic
              and specialized health verticals including Alan Mind (mental healthcare), Alan Clear (integrated
              prescription optics and curated eyewear), and bespoke chronic condition journeys for back pain, sleep, and
              metabolic wellness [CE001, CE005]. Technical delivery in Alan Clinic is augmented by proprietary clinical
              artificial intelligence assistants, designed to triage member queries and provide instant medical guidance
              under continuous human physician supervision [CE001, CE008]. Approximately 95% of AI-powered medical chats
              receive good or excellent ratings from members and undergo daily review by Alan's medical directorate,
              maintaining stringent clinical safety guardrails while scaling care access to over 1.1 million covered
              individuals [CE001, CE005, CE008]. This AI-native operational approach allows Alan to expand its covered
              member population and revenue base without linear expansion in operational care management headcount
