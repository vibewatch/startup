companyProfile:
  summary: >-
    Alan is a Paris-based full-stack digital health insurer founded in 2016 that combines supplementary health coverage,
    telemedicine, claims automation, and prevention services in one app. It sells primarily to corporate employers and
    public-sector institutions, with operations in France and expanding licensed activity in Belgium, Spain, and Canada.
    The business relies on recurring insurance premiums and integrated care services, and its public disclosures
    emphasize domestic profitability even as underwriting economics and international margins remain opaque.
