      - number: '7.2'
        title: Operational Security and Platform Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Alan delivers digital health coverage and AI-powered care navigation, processing 50% of reimbursements
              within 5 minutes and handling 260,000 asynchronous clinical chats through its proprietary Clinic [CR001].
              This digital-native operating model exposes members' protected health information (PHI) and banking
              credentials to severe external attack surfaces [CR001, CR005]. Legal advisory and corporate operations
              within the extended enterprise demonstrate substantial exposure to external intrusions and data breaches,
              as evidenced by multi-month undetected network intrusions affecting external counsel AMC holding
              subscriber personal and financial data [CR005, CR007]. While Alan reports that 95% of its AI-driven
              medical chats receive positive medical reviews, algorithmic liability, clinical triage failures, and
              unauthorized data leakage represent severe tail risks [CR001]. Maintaining continuous SecNumCloud
              compliance and multi-factor identity safeguards across third-party processors remains a critical
              mitigation requirement [CR005, CR008].
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
