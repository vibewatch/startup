              - CU007
      - number: '6.2'
        title: Adoption Trajectory and Production Enterprise Proof
        blocks:
          - type: paragraph
            body: >-
              Alan's adoption trajectory exhibits rapid scaling, expanding from an initial domestic customer footprint
              to over one million members by late 2025 and exceeding 1.1 million members by mid-2026. This member
              expansion has underpinned a 53% year-over-year expansion in annual recurring revenue (ARR), advancing from
              €785 million at year-end 2025 to over €800 million in the first quarter of 2026. Product engagement
              metrics demonstrate deep operational integration into member daily routines rather than passive annual
              claims handling. Over 30% of covered members participate as weekly active users in health challenges and
              preventative routines, while Alan's virtual Clinic delivered more than 260,000 clinical medical chats,
              with each interaction functioning as a primary care doctor visit proxy. Automated and AI-assisted claims
              processing resolves 50% of reimbursement requests within five minutes and 90% in under twenty-four hours,
              supporting a 4.9 out of 5 mobile App Store rating. Named client production deployments validate enterprise
              adoption in international markets, including HP and Volkswagen in Spain and Belgium. However,
              comprehensive case studies detailing underwriting loss ratios, employee net promoter scores across
              separate employer accounts, and verified enterprise pilot-to-production conversion rates have not been
              made available publicly.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU008
              - CU011
