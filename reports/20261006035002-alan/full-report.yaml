  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Service Delivery, and Member Workflows
        blocks:
          - type: paragraph
            body: >-
              Alan defines its core product offering as an integrated digital healthcare and insurance platform that
              unifies supplementary coverage (mutuelle d'entreprise), daily medical access, and preventative health
              management within a single member application [CE001, CE004]. Traditional health insurance in Europe
              operates as an administrative payer disconnected from clinical delivery, forcing members to submit manual
              paper claims, endure weeks of reimbursement latency, and independently navigate complex primary care
              systems [CE001, CE006]. In contrast, Alan replaces fragmented point solutions by pairing a licensed
              full-stack insurance balance sheet with a consumer-grade mobile and desktop software suite [CE001, CE004].
              For members, the platform delivers zero-friction claims processing where users photograph medical invoices
              and receive automated reimbursement adjudications: 50% of reimbursements are completed in under 5 minutes,
              and over 90% are settled within a single business day [CE001, CE006]. Beyond reactive financial
              reimbursement, Alan integrates proactive care delivery through the Alan Clinic, providing 24/7
              asynchronous and video teleconsultations with licensed clinicians and answering over 260,000 medical chats
              to date [CE001, CE005]. For corporate human resources administrators, the employer portal automates member
              onboarding, offboarding, and payroll-deduction synchronization, reducing annual coverage management time
              to under two hours for 98% of small and medium business clients [CE001, CE007].
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
