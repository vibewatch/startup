  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Executive Recommendation and Decision Framework
        blocks:
          - type: paragraph
            body: >-
              Alan represents one of the most commercially scaled digital health technology platforms in Europe, having
              demonstrated remarkable top-line momentum by surpassing €800 million in Annual Recurring Revenue in Q1
              2026 alongside 53% year-over-year expansion. The company's recent Series G agreement to secure €480
              million in primary equity capital led by Netherlands-based technology giant Prosus establishes a
              post-money enterprise valuation of €5.5 billion. This transaction reaffirms top-tier investor confidence
              in Alan's category-defining prevention insurance model and validates its domestic operational
              profitability in France. However, despite these exceptional scale markers, we issue a formal
              recommendation of Track with a Fair-to-Full valuation stance. Our cautious posture reflects the reality
              that an enterprise multiple of approximately 6.8x ARR already prices in frictionless international
              execution across Belgium, Spain, and Canada, while key technical underwriting metrics such as statutory
              loss ratios, combined ratios, and reinsurance economics remain entirely confidential. Until management
              demonstrates multi-country GAAP margin sustainability, institutional investors should avoid paying peak
              venture multiples.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV014
      - number: '8.2'
        title: 'Investment Thesis vs. Anti-Thesis: Scale vs. Underwriting Opacity'
        blocks:
          - type: paragraph
            body: >-
              The affirmative investment thesis for Alan rests on its structural convergence of supplementary health
              insurance, virtual clinic care navigation, and AI-native automation into a single member application
              serving more than 1.1 million individuals and 37,000 corporate clients. By transforming health benefits
              from an administrative cost center into an engaging prevention ecosystem, Alan has built significant brand
              equity and achieved domestic operational profitability in France, where it was the first independent
              insurer licensed by the ACPR since the 1980s. Conversely, the anti-thesis highlights substantial
              structural vulnerabilities. Alan recorded significant cumulative accounting losses of $61 million in 2023
              and $56 million in 2024 before approaching overall operating break-even. More critically, the company does
              not disclose its underlying medical loss ratios or technical combined ratios, making it impossible for
              outside analysts to ascertain whether insurance underwriting is fundamentally self-sustaining or masked by
              top-line premium growth. Furthermore, health insurance is deeply local; regulatory structures and
              reimbursement frameworks in Spain, Belgium, and Canada differ substantially from the French mutuelle
              system, exposing Alan to potential margin erosion as it deploys capital abroad.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Financing History, Dilution, and Valuation Multiple Discipline
        blocks:
          - type: paragraph
            body: >-
              Alan's capitalization trajectory highlights steady capital access through volatile market environments.
              According to private market tracking data from Indexed.vc, the company has raised approximately $1.4
              billion in cumulative equity funding across nine financing rounds since its founding in 2016. In March
              2026, Alan completed a €100 million round led by Index Ventures that established an interim valuation mark
              of €5.0 billion, following an earlier $4.5 billion valuation achieved in 2024. The subsequent €480 million
              Series G round agreed in June 2026 at a €5.5 billion valuation represents a 10% step-up over March 2026
              and an enterprise multiple of approximately 6.8x on its >€800 million ARR run-rate. When compared against
              European and US insurtech and digital health peers—many of which have suffered severe multiple
              compressions toward 1.5x to 3.5x revenue in public markets—Alan's premium valuation is supported by its
              superior 53% growth velocity, French operational profitability, and heavy AI differentiation. However,
              this multiple assumes software-like operating leverage that has yet to be proven across consolidated
              insurance operations burdened by regulatory solvency capital requirements.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV010
              - CV013
      - number: '8.4'
        title: Scenario Analysis, Downside Triggers, and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Our scenario modeling examines Alan's return profile across three distinct operating trajectories over a
              two-year investment horizon. In the Bull Case (25% probability), Alan maintains top-line growth above 45%,
              achieves profitable unit economics across Belgium and Spain, and expands its ARR past €1.3 billion,
              supporting a €7.5 billion to €9.0 billion exit valuation in a European or dual-listed IPO. In the Base
              Case (55% probability), growth naturally decelerates into the 30% to 35% range, yielding €1.05 billion to
              €1.15 billion in ARR; at a normalized 4.5x to 5.5x multiple, enterprise value remains stable around €5.0
              billion to €5.8 billion, generating modest annualized returns for Series G entrants. In the Bear Case (20%
              probability), medical claims inflation, ACPR solvency capital demands, or competitive pushback in
              international markets trigger combined ratios above 102%, causing valuation contraction toward €3.0
              billion to €3.8 billion (a 30% to 45% down-round). Downside triggers that would mandate an immediate
              thesis break include statutory loss ratios exceeding 90%, failure to secure French financial authority
              approval for the Series G closing, or quarterly ARR growth slowing below 25%.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Discipline Over Momentum at €5.5B'
            body: >-
              While Alan's achievement of exceeding €800 million in ARR with 53% growth and securing €480 million in
              Series G capital led by Prosus is an impressive execution milestone, the current €5.5 billion valuation
              leaves minimal margin of safety for growth deceleration or underwriting volatility. We advise
              institutional allocators to maintain a Track stance, deferring primary equity commitments until statutory
              loss ratios and international profitability can be independently verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV013
              - CV014
          - type: callout
            title: Underwriting Opacity and Regulatory Capital Constraints
            body: >-
              The core analytical vulnerability in Alan's valuation profile is the opacity surrounding its health and
              prévoyance loss ratios. Health insurance businesses that appear operationally profitable during rapid
              expansion can experience severe technical margin deterioration if claims inflation accelerates. Because
              Alan operates under ACPR prudential supervision, any underwriting deficit in newer markets like Belgium or
              Spain would mandate immediate regulatory capital injections from its cash reserves.
            calloutType: risk
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV012
