            title: ACPR Transaction Approval and Solvency Capital Sensitivity
            body: >-
              Alan's €480M Series G transaction led by Prosus is subject to formal ACPR sign-off. Solvency II capital
              requirements and statutory reserve mandates create ongoing capital lock-in, meaning corporate capital
              cannot be freely reallocated across international subsidiaries without strict regulatory compliance.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
          - type: callout
            title: Extended Enterprise Cybersecurity and Data Breach Liability
            body: >-
              Health insurers represent prime targets for sophisticated threat actors seeking protected health
              information and banking data. Unmitigated third-party network intrusions among professional legal and
              administrative partners illustrate that vendor security represents an ongoing systemic threat to client
              data integrity.
            calloutType: risk
