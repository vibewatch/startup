      - number: '4.3'
        title: Capital Adequacy, Solvency Requirements, and Forward Runway
        blocks:
          - type: paragraph
            body: >-
              Following €580M in total capital secured across 2026 funding rounds—including a €100M Series F extension
              in March and a €480M Series G led by Prosus in June—Alan holds substantial liquidity. These funds support
              European expansion across Belgium, Spain, and Canada, as well as AI infrastructure investments and
              statutory regulatory capital required by the ACPR. Net annual losses contracted from $61M in 2023 to $56M
              in 2024 as the core French market achieved operating profitability, providing extended operating runway
              toward overall break-even. With an ARR target of $1.16B for full-year 2026, the company balances
              international market entry against capital conservation.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
