      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: ACPR 交易审批与偿付能力资本敏感性
            body: Prosus 领投的 Alan €480M G 轮交易须获得 ACPR 正式签字。Solvency II 资本要求和法定准备金要求会持续锁定资本，意味着公司资本未经严格监管合规，不能在国际子公司之间自由调配。
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
          - type: callout
            title: 扩展企业网络安全与数据泄露责任
            body: 健康保险商是寻求受保护健康信息和银行数据的复杂威胁行为者的主要目标。专业法律和行政合作伙伴发生的未缓解第三方网络入侵表明，供应商安全持续对客户数据完整性构成系统性威胁。
            calloutType: risk
