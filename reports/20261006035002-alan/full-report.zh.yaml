companyProfile:
  summary: >-
    Alan 是一家总部位于巴黎的全栈数字健康保险商，2016
    年成立，将补充医疗保险、远程医疗、理赔自动化和预防服务整合在一款应用中。公司主要面向企业雇主和公共部门机构，在法国运营，并在比利时、西班牙和加拿大拓展持牌业务。公司依靠经常性保险保费和一体化医疗服务，公开披露强调其国内盈利能力，但承保经济性和国际业务利润率仍不透明。
