        - label: 倡导与企业扩张
          stage: 倡导与企业扩张
          actor: 企业领导层与会员倡导者
          touchpoints:
            - 扩展到更多国际子公司和事业部
            - 收集员工满意度反馈并计算净推荐值
            - 增加高管心理健康服务与专科临床增值服务
