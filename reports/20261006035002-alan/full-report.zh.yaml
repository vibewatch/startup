    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含 ARR 与估值区间
      - 概率信号
      - 下行触发器与尽调要求
    rows:
      - - 乐观情景
        - ARR 增长维持在 50% 以上；国际市场实现盈亏平衡；AI 降低理赔管理成本
        - 2027 年 ARR 达到 €1.3B 以上；按 6.0x-7.0x 远期倍数估值 €7.5B 至 €9.0B
        - 概率 25%；取决于国际业务利润率达到同等水平
        - 增长跌破 40%，或客户获取成本上升
      - - 基准情景
        - 增长放缓至 30-35%；法国保持盈利；国际业务利润率缓慢爬坡
        - ARR €1.05B 至 €1.15B；按 4.5x-5.5x ARR 倍数估值 €5.0B 至 €5.8B
        - 概率 55%；反映当前市场共识和 Series G 定价
        - 西班牙 / 比利时利润率停滞，或加拿大出现监管摩擦
      - - 悲观情景
        - 医疗理赔通胀飙升；综合赔付率恶化；国际扩张停滞
        - ARR €850M 至 €900M；按 3.5x-4.0x 倍数估值 €3.0B 至 €3.8B（降价轮）
        - 概率 20%；历史 $117M 亏损和承保不透明令该情景概率上升
        - ACPR 监管介入、再保险费率上调，或现金消耗加速
    notes: 情景模型采用符合欧洲高增长金融科技 / 保险科技基准的远期 ARR 倍数； 估值区间代表隐含的投后股权价值。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV009
      - CV012
      - CV013
figures:
  - id: FO001
    title: Alan 企业里程碑与规模化演进
    type: timeline
    summary: 从首次取得法国监管保险牌照到 Series G 估值 €5.5B 的时间线。
    data:
      items:
        - label: 2016：公司成立与 ACPR 牌照
          date: 2016-02
          detail: 在巴黎成立；成为法国监管机构自 1986 年以来批准的首家新独立健康保险公司。
          tone: positive
        - label: 2020：国际扩张至比利时与西班牙
          date: 2020-09
          detail: 将数字医疗保险模式拓展至法国以外，建立跨境欧洲业务。
          tone: neutral
        - label: 2023：规模化承保亏损
          date: 2023-12
          detail: 在投入激进工程建设和会员获客的同时，录得 $61 million 法定净亏损。
          tone: adverse
        - label: 2024：亏损收窄与加拿大牌照
          date: 2024-12
          detail: 净亏损收窄至 $56 million；取得加拿大所有省份的监管保险牌照。
          tone: neutral
        - label: 2025：本土运营盈利
          date: 2025-12
          detail: ARR 达到 €785M（$915M），同比增长 53%；在法国实现运营 EBITDA 盈亏平衡。
          tone: positive
        - label: 2026 Q1：Series F 延长轮与法国公务员业务中标
          date: 2026-03
          detail: 以 €5.0B（$5.83B）估值融资 €100M；签署覆盖 130,000+ 名会员的财政部合同。
          tone: positive
        - label: 2026 Q1：成立 10 周年与 AI 医疗上线
          date: 2026-05
          detail: 签约 ARR 达到 €804M，覆盖 1.1M 名会员；向 500k+ 名会员推出 Mo 对话式 AI 助手。
          tone: positive
        - label: 2026 Q2：€5.5B 估值的 Series G 融资
          date: 2026-06
          detail: Prosus 领投 €480M 轮融资，Alan 估值 €5.5B；签约 ARR 增至约 €840M，覆盖 1.14M 名客户。
          tone: positive
    approximationNotes: 所有里程碑日期均来自公司股东信、监管申报和融资公告。
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO006
      - CO008
