            body: >-
              Alan 持有法国完整的独立保险牌照，受法国审慎监督与处置管理局（Autorité de Contrôle Prudentiel et de Résolution，ACPR）监督，是自 1980
              年代以来首家在法国获牌的独立保险商 [CR002]。作为承担风险的全栈保险商运营，Alan 必须遵守严格的 Solvency II 资本充足性要求、准备金要求和承保合规检查 [CR002]。虽然公司近期获得
              Prosus 领投、估值 €5.5 billion 的 €480 million G 轮投资，但交割明确以监管批准和法国金融主管部门正式签字为前提
              [CR004]。向比利时、西班牙和加拿大各省辖区扩张，使合规负担成倍增加，并使集团暴露于不同的当地保险规则和法定偿付能力标准 [CR002, CR004]。首要尽调任务是跟踪 ACPR
              监管签字时间表、反集中资本缓冲，以及国际运营子公司潜在的追加资本触发条件。
            claimRefs:
              - CR002
              - CR004
