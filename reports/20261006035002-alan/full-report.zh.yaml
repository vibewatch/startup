chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创始背景与治理
        blocks:
          - type: paragraph
            body: >-
              Alan 于 2016 年在法国巴黎由联合创始人兼首席执行官 Jean-Charles Samuelian-Werve 创立，目标是消除健康保险、医疗服务获取和临床预防之间的结构性割裂 [CO001,
              CO002]。公司以持牌全栈数字健康保险商运营——自 1980 年代以来首家在法国获得监管承保牌照的独立保险商——为企业雇主、公共部门机构、个体经营者和退休人员提供综合医疗保障、快速自动理赔报销以及一体化远程医疗
              [CO001, CO003, CO007]。Samuelian-Werve 是精算师，拥有 École des Ponts ParisTech 工程学位和 Collège des Ingénieurs
              MBA；他曾共同创办航空座椅制造商 Expliseat，目前担任前沿人工智能实验室 Mistral AI 的非经营性联合创始人和董事会成员 [CO002,
              CO003]。治理结构兼具创始人强控制和欧洲及全球风险投资机构的董事会监督，但产品创新与公司战略均由 Samuelian-Werve 双线领导，运营执行仍高度依赖他 [CO002, CO004]。公司运营规模约
              740 至 790 名员工，覆盖四个核心司法辖区：法国、比利时、西班牙和加拿大 [CO003, CO004, CO008]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.2'
        title: 资本化历史、估值轨迹与资产负债表
        blocks:
          - type: paragraph
            body: >-
              Alan 的资本化历程显示，在欧洲科技行业经历宏观重估周期期间，公司持续获得机构投资者支持 [CO003, CO005]。2026 年 3 月，公司完成 €100 million 融资，由现有投资方 Index
              Ventures 领投，Greenoaks、Kaaf、SH、比利时银行集团 Belfius 及战略商业天使投资人参与，形成 €5.0 billion 的阶段性投后估值（$5.83 billion）[CO003,
              CO008]。2026 年 6 月 25 日，荷兰全球消费互联网与科技投资集团 Prosus 领投一笔具有里程碑意义的 €480 million G 轮融资，Index Ventures、Teachers'
              Venture Growth 和 Dara Holdings 跟投，将公司估值重定为 €5.5 billion [CO005, CO006]。累计股权融资达到 €1.295 billion（$1.4
              billion），为 Alan 吸收承保波动、扩大 Solvency II 资本缓冲并投入激进的产品研发提供了充足资产负债表流动性 [CO005,
              CO006]。不过，公司将私人债务和再保险结构置于保密安排下，确切净现金余额、老股转让及法定偿付能力比率仍未获确认 [CO005, CO008]。
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO005
              - CO006
      - number: '1.3'
        title: 商业规模、财务表现与市场地位
        blocks:
          - type: paragraph
            body: >-
              企业雇主采用、理赔自动化和大型公共部门招标中标推动商业势头在 2025 年和 2026 年持续加速 [CO003, CO004]。Alan 在 2025 年末实现 €785 million（$915
              million）年度经常性收入，同比增长 53%，并在法国核心保险业务范围内实现经营盈利 [CO003, CO008]。增长延续至 2026 年：2026 年第一季度签约 ARR 达到 €804
              million，覆盖 1.1 million 名会员；截至 2026 年第二季度末，签约 ARR 增至约 €840 million，覆盖 1.14 million 名会员 [CO004, CO005,
              CO006]。法国财政部合同落地后，企业和公共部门客户密度明显提升，该合同为 130,000 至 135,000 名公务员及其家属提供健康保险，并实现 96% 的内部参保率 [CO003,
              CO004]。在国际市场，Alan 已在比利时、西班牙和加拿大开展多国商业承保；在西班牙服务包括 HP 和 Volkswagen 在内的企业客户，并在加拿大取得覆盖全部省份的监管保险牌照 [CO003,
              CO005]。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
      - number: '1.4'
        title: 承保经济性、历史亏损与增长阻力
        blocks:
          - type: paragraph
            body: >-
              尽管国内实现经营盈利，Alan 的合并财务轨迹仍体现出明显的承保与市场扩张取舍 [CO003, CO008]。公司 2023 年和 2024 年分别产生 $61 million 和 $56 million
              的合并法定净亏损，随后于 2025 年接近整体经营盈亏平衡 [CO003, CO008]。管理层有意优先扩大收入规模，而非追求短期集团净利润率，目标是在 2026 年实现 $1.16 billion
              ARR，并加大对自研人工智能系统、临床工作流自动化及海外市场推出的投入 [CO003, CO008]。关键在于，虽然直接数字化分销无需支付第三方经纪佣金，有利于毛利率，但实际医疗赔付率、pré­voyance
              残疾险赔付经验、综合经营比率及第三方再保险转分保成本仍完全未披露 [CO004, CO008]。此外，快速国际化使 Alan
              暴露于西班牙、比利时和加拿大差异化的医疗报销制度，当地承保单元经济性尚未由独立证据证明具备结构性盈利能力 [CO003, CO005]。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO008
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 国内单元经济性证明与公共部门验证
            body: >-
              Alan 在法国实现经营 EBITDA 盈利，同时在覆盖 130,000+ 名公务员的财政部合同中达到 96% 的员工参保率，证明直接数字化健康承保可以在企业规模上产生正向单元经济性 [CO003,
              CO004]。
            calloutType: strength
            claimRefs:
              - CO003
              - CO004
          - type: callout
            title: 承保透明度与法定亏损概况
            body: 2023—2024 年合计 $117 million 的历史合并净亏损，加上医疗赔付率和再保险条款完全未披露，使底层保险风险敞口仍未得到独立审计机构验证 [CO003, CO008]。
            calloutType: risk
            claimRefs:
              - CO003
              - CO008
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Alan 对产品类别的定义比单纯的补充保险更宽：官方描述将保险、即时医疗服务获取和预防结合起来，并通过一个平台提供保险、临床服务获取、心理健康疗程、视力福利和健康指导 [CM001,
              CM013]。可观察到的商业边界涵盖各类企业、政府、个体经营者和退休人员 [CM002]。因此，雇主或公共健康福利预算是主要组织入口，个人保险则是另一条路径。现有证据不足以证明 Alan
              能获得法定公共卫生预算、医院支出、药品支出或整个数字健康市场；这些类别应排除在规模边界之外，而不是并入宽泛
              TAM。现状替代方案包括割裂的保险、报销管理、临床服务获取和预防服务，但现有来源未量化各替代方案的支出或一体化供应商可获得的份额。
            claimRefs:
              - CM001
              - CM002
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模与当前触达
        blocks:
          - type: paragraph
            body: >-
              已分配来源没有为 Alan 所定义边界提供有方法论支撑的总体市场、可服务市场或可获取市场估算。来源提供的只是处于不同期间、分母不同的公司规模指标。TechCrunch 报道 Alan 2025 年年度经常性收入为
              €785 million，较 2024 年末增长 53%；随后 6 月的来源报道称，2026 年第一季度 ARR 已超过 €800 million，服务人数超过 1.1 million [CM008,
              CM010, CM011]。这些指标不能与会计收入、保费规模、可触达支出或可用现金互换。覆盖最多 135,000 名公务员及亲属的法国公共部门合同显示了机构触达，但“最多”只是合同上限，不等于实际参保人数
              [CM007]。因此，市场规模判断刻意采用自下而上的方法：记录已实现的运营规模，将外部市场分母保留为重大尽调缺口，而不是外推精确的 TAM、SAM 或 SOM。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
