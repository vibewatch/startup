  - id: FU001
    title: 客户旅程与生命周期采用触点
    type: journey-map
    summary: 展示会员和雇主从首次采购、接入，到日常医疗参与和保单续约的进程。
    data:
      items:
        - label: 雇主采购
          stage: 雇主采购
          actor: 企业 HR / 公共采购方
          touchpoints:
            - 福利经纪人评审或提交公共招标
            - 为眼科、牙科和预防护理定制方案
            - 企业无纸化接入并整合薪资系统
        - label: 会员激活
          stage: 会员激活
          actor: 员工 / 受保个人
          touchpoints:
            - 激活移动应用并签发数字互助保险卡
            - 设置银行直连信息，以便即时报销
            - 填写个性化健康接入问卷
        - label: 日常医疗与预防
          stage: 日常医疗与预防
          actor: 活跃会员
          touchpoints:
            - Alan Clinic 每周 7 天提供聊天和视频问诊
            - 每周健康挑战，活跃参与率 30%+
            - 仅限会员享受的健康服务与眼科门店折扣
        - label: 理赔与支持
          stage: 理赔与支持
          actor: 活跃会员
