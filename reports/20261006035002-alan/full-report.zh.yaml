      - number: '7.2'
        title: 运营安全与平台漏洞
        blocks:
          - type: paragraph
            body: >-
              Alan 提供数字健康保障和 AI 驱动的医疗导航，在 5 分钟内处理 50% 的报销，并通过自有 Clinic 处理 260,000 次异步临床聊天
              [CR001]。这种数字原生运营模式使会员的受保护健康信息（PHI）和银行凭据暴露在严重的外部攻击面上 [CR001,
              CR005]。扩展企业内部的法律顾问和公司运营显示出较大的外部入侵与数据泄露敞口：持有会员个人和财务数据的外部法律顾问 AMC 曾遭遇持续数月未被发现的网络入侵 [CR005, CR007]。虽然 Alan
              报告称其 AI 医疗聊天中有 95% 获得正面医疗评价，但算法责任、临床分诊失败和未经授权的数据泄露构成严重尾部风险 [CR001]。持续满足 SecNumCloud
              合规要求，并在第三方处理商之间维持多因素身份安全，是关键的风险缓释要求 [CR005, CR008]。
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
      - number: '7.3'
        title: 交易对手集中度与承保经济性
        blocks:
          - type: paragraph
            body: >-
              Alan 的商业扩张高度集中于主权和大型企业交易对手，包括一份为最多 135,000 名法国公务员及其家属提供保险的重大合同
              [CR002]。公共部门集中度使业务暴露于法定采购重新竞标周期、政治预算压力和法定报销费率重置 [CR002]。此外，尽管 Alan 在法国以 €800M+ ARR
              实现经营盈利，赔付率、综合经营比率和再保险分出均未公开披露，导致外界无法看清其面对医疗通胀和严重理赔波动时的真实承保韧性 [CR002, CR003,
              CR004]。在比利时、西班牙和加拿大的国际业务单元达到自我维持的经营盈亏平衡前，公司对 Prosus、Index Ventures 等外部领投方的宏观经济依赖，凸显出资本结构依赖 [CR002, CR004]。
            claimRefs:
              - CR002
              - CR003
              - CR004
      - number: '7.4'
        title: 风险清单与展示项
        blocks:
          - type: paragraph
            body: >-
              Alan 风险画像的综合评估涵盖欧洲和北美业务的监管障碍、网络安全失效模式及结构性交易对手依赖。下方展示项逐项列出监管风险清单、运营韧性标准和影响 Alan 长期企业偿付能力的合作伙伴交易对手依赖 [CR002,
              CR004,
              CR005]。每个项目都评估潜在失败情景、缓释措施成熟度和剩余敞口，为投资尽调和持续投资组合监控提供依据。此外，向比利时、西班牙和加拿大跨境扩张引入了各地监管差异，需要持续开展法律审查并保持资本配置纪律。
            claimRefs:
              - CR002
              - CR004
              - CR005
