            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM011
              - CM012
      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Alan 披露的客户边界包括企业、政府、个体经营者和退休人员；第三方画像进一步将中小企业、大型企业、个人消费者和公共机构列为目标细分市场 [CM002,
              CM013]。员工、公务员、家属和个人投保人是用户或被覆盖人群，但购买实体因细分市场而异。对于企业和政府业务，证据确认组织是客户，却没有说明统一的预算负责人、采购委员会、保费分摊或销售周期。这些字段应保持未知，不能在缺乏支持的情况下擅自归给人力资源、财务或采购部门。来源显示的采用触发因素包括快速报销、临床服务获取、预防功能和集中管理
              [CM003, CM004, CM005]。公共部门中标和据报道超过 37,000 家企业的客户基础表明存在多条规模化路径，但两项指标都无法说明留存率、合同价值或采购集中度 [CM007, CM012]。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM013
      - number: '2.4'
        title: 采用驱动因素、约束与规模缺口
        blocks:
          - type: paragraph
            body: >-
              Alan 的一体化模式提供了合理的采用机制：一段客户关系可以同时覆盖保障、理赔处理、临床服务获取和预防互动；官方页面称平台已完成 260,000 次医疗聊天、挑战活动每周参与率超过 30%，并能快速处理报销
              [CM003, CM004, CM005]。这些运营指标说明产品有人使用，却不能证明理赔成本更低、健康结果更好或雇主 ROI
              更高。向比利时、西班牙和加拿大扩张，以及在四个国家运营，扩大了可服务地域，但各国保费池和经济性仍未披露 [CM009, CM012]。独立 SWOT
              分析将各国监管、传统保险商的应对及中小企业福利预算压力视为约束；这些是分析性风险信号，不是经过测量的发生率
              [CM014]。检索范围内还出现了一份据称属于公司的报告，但其内容描述的是无关的通用科技企业，说明质量较弱的二手页面无法填补市场规模缺口
              [CM015]。因此，估值应依赖经核实的运营规模和情景区间，而不是凭空捏造的自上而下市场倍数。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 业务势能可观察，市场规模不可得
            body: >-
              来源通过 ARR、会员数、企业数、公共合同容量和产品互动支持了相当可观的运营覆盖。上述指标都没有提供市场支出分母，ARR 也不能视为会计收入或 TAM [CM007, CM008, CM010, CM011,
              CM012]。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
          - type: callout
            title: 薄弱的二手页面无法填补规模缺口
            body: 一份已分配报告描述的是无关的通用科技公司及其高管，因此仅作为来源质量风险的证据保留，并排除在量化规模估算之外 [CM015]。
            calloutType: risk
            claimRefs:
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与结构性反向定位
        blocks:
          - type: paragraph
            body: >-
              Alan 在欧洲健康福利和私人补充保险生态中竞争；这一行业长期由传统互助保险商、传统银保集团和区域社会福利机构主导。传统保险商依赖高摩擦理赔管理、纸质表单和被动报销周期，而 Alan 于 2016
              年成立，是三十多年来首家在法国获牌的独立保险承运人。Alan
              的战略框架明确建立在反向定位之上：以融合全栈承保、自动理赔处理和主动会员护理的一体化模式，摧毁传统价值主张；传统保险商若要复制这一模式，就必须蚕食现有经纪分销经济性。此外，Alan
              将保险、临床导航和主动健康维护整合在统一的自有界面中，针对割裂的软件点解决方案和将医疗福利视为未打包行政成本中心的传统保险商，建立了不对称壁垒。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP012
      - number: '3.2'
        title: 竞争者运营画像与架构取舍
        blocks:
          - type: paragraph
            body: >-
              竞争格局分为四类：Malakoff Humanis、Harmonie Mutuelle 和 AXA France
              等传统互助保险商与全国性保险商；泛欧洲数字聚合平台和私人健康软件供应商；区域企业平台；以及相邻垂直领域的点解决方案。传统 incumbents
              拥有根深蒂固的分销网络、数十年的集体谈判企业关系和庞大的承保资产负债表，但后台基础设施割裂、数字互动率低。相比之下，Alan 的一体化平台提供自动报销、通过 Alan Clinic
              持续获取临床服务，以及一体化视力与健康服务。自动化软件聚合商和法律／企业工具供应商往往只提供模块化点工具——例如无状态文档处理器或基础工作流机器人——却完全没有法定保险资产负债表、监管保险牌照和临床网络。Alan
              的垂直整合带来运营效率和定价韧性，能够快速导入企业客户，并取得传统健康经纪商难以提供的更高会员满意度。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
