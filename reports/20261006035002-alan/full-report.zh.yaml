      - CU006
  - id: FR001
    title: 企业风险评估矩阵
    type: matrix
    summary: 按发生可能性和影响程度，直观呈现 Alan 的核心运营、监管、合作伙伴及财务风险。
    data:
      columns:
        - 可忽略影响
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
        - 关键影响
      rows:
        - label: 几乎确定会发生
          values:
            - label: 轻微理赔摩擦
              tone: neutral
            - label: 常规账单咨询
              tone: neutral
            - label: 行政开销
              tone: neutral
            - label: 供应商涨价
              tone: warning
            - label: 公共部门重新招标摩擦
              tone: risk
            - label: 承保波动 / 损失率飙升
              tone: critical
        - label: 高可能性
          values:
            - label: 文档不准确
              tone: neutral
            - label: 常规应用故障
              tone: neutral
            - label: 支持队列延迟
              tone: warning
            - label: 顾问供应商重新签约
              tone: warning
            - label: 合同利润率被压缩
              tone: risk
            - label: 再保险起赔点重置
              tone: critical
        - label: 中等可能性
          values:
            - label: 子门户故障
              tone: neutral
            - label: 本地支付网关故障
              tone: neutral
            - label: 区域医疗服务商断联
              tone: warning
            - label: 加拿大各省规则变化
              tone: warning
            - label: 供应商安全事件 / 数据暴露
              tone: risk
            - label: ACPR 对 Series G 的监管条件
              tone: critical
        - label: 低可能性
          values:
            - label: 内部沟通滞后
              tone: neutral
            - label: 一般 IT 延迟
              tone: neutral
            - label: Belfius 分销调整
              tone: neutral
            - label: 临时 API 限流
              tone: warning
            - label: 核心云服务中断
              tone: warning
            - label: AI 临床分诊医疗事故
              tone: risk
        - label: 极低可能性
          values:
            - label: 办公设备故障
              tone: neutral
            - label: 轻微硬件缺陷
              tone: neutral
            - label: 局部电压骤降
              tone: neutral
            - label: 局部远程医疗中断
              tone: neutral
            - label: 次级数据中心故障
              tone: warning
            - label: 保险承运方牌照被完全吊销
              tone: critical
        - label: 极少发生
          values:
            - label: 域名注册续期延迟
              tone: neutral
            - label: 归档系统读取错误
              tone: neutral
            - label: 短暂网络分区
              tone: neutral
            - label: 临时 Web 网关不同步
              tone: neutral
            - label: 灾难性偿付能力破产
              tone: critical
            - label: 欧洲主权国家将医疗体系国有化
              tone: critical
    approximationNotes: 可能性和严重程度均为定性估计，依据是监管状态及运营模式的脆弱点。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR008
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这条结构化决策链将商业规模、法国运营利润、承保不透明度串联起来，最终导向“持续跟踪”的建议。
    data:
      nodes:
        - id: n1
          label: 商业规模（ARR >€800M，同比增长 53%）
          description: 法国市场的规模证明消费者确实需要整合式预防保险。
        - id: n2
          label: 国内运营盈利
          description: 在法国实现运营利润，说明本土规模下的单位经济模型已经跑通。
        - id: n3
          label: 资本缓冲（€480M Series G，估值 €5.5B）
          description: Prosus 牵头的股权注资为国际扩张和 AI 研发提供了资金续航。
        - id: n4
          label: 承保与损失率不透明
          description: 公司未披露综合比率和损失历史，导致估值存在不确定性。
        - id: n5
          label: 国际执行风险
          description: 法国互助保险的运营逻辑能否复制到比利时、西班牙和加拿大，尚未得到验证。
        - id: n6
          label: 最终立场：持续跟踪 / 观察名单
          description: 在利润率得到验证前，建议维持“持续跟踪”，估值判断为合理至偏高。
      edges:
        - from: n1
          to: n2
          label: 产生
        - from: n2
          to: n3
          label: 吸引
        - from: n3
          to: n4
          label: 遇到
        - from: n4
          to: n5
          label: 叠加
        - from: n5
          to: n6
          label: 决定
    approximationNotes: 流程拓扑图展示定性尽调结论和投资决策门槛；节点顺序反映分析上的依赖关系。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV012
      - CV014
