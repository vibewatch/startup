  title: "Customers"
  summary: "Alan serves over 1.1 million members across more than 37,000 corporate clients, public-sector ministries, and self-employed professionals in France, Belgium, Spain, and Canada. While customer engagement is exceptionally high with 30%+ weekly active challenge usage, expansion faces structural concentration risks in French public administration and an absence of audited net revenue retention and cohort disclosures."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Customer Base Segmentation and Buyer Economics"
    body: "Alan segments its customer base across three core purchaser groups: enterprise and corporate employers, public-sector government bodies, and self-employed individuals and retirees. Historically rooted in venture-backed tech startups and small-to-medium businesses (SMBs) across France, Alan's commercial base has expanded to encompass large multinational corporate accounts including HP and Volkswagen in Spain and Belgium, alongside over 37,000 corporate clients overall. Corporate plan sponsors represent the primary economic buyer, funding group health cover and preventative care packages for employees, while end users interact via Alan's native mobile portal for claims submission, optical vouchers, and clinical telemedicine consultations. The economic value proposition for SMB employers centers on extreme administrative simplification, with 98% of SMB client administrators spending fewer than two hours annually managing their health coverage programs. In the public sector, Alan won a milestone mandate covering up to 135,000 French civil servants and their dependents, transforming the state into a core revenue counterparty. However, detailed economic breakdowns—such as average revenue per account (ARPA), gross revenue distribution across enterprise tiers, and regional member splits between France, Belgium, Spain, and Canada—remain closely held private operational metrics."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-named-proof"
    title: "Adoption Trajectory and Production Enterprise Proof"
    body: "Alan's adoption trajectory exhibits rapid scaling, expanding from an initial domestic customer footprint to over one million members by late 2025 and exceeding 1.1 million members by mid-2026. This member expansion has underpinned a 53% year-over-year expansion in annual recurring revenue (ARR), advancing from €785 million at year-end 2025 to over €800 million in the first quarter of 2026. Product engagement metrics demonstrate deep operational integration into member daily routines rather than passive annual claims handling. Over 30% of covered members participate as weekly active users in health challenges and preventative routines, while Alan's virtual Clinic delivered more than 260,000 clinical medical chats, with each interaction functioning as a primary care doctor visit proxy. Automated and AI-assisted claims processing resolves 50% of reimbursement requests within five minutes and 90% in under twenty-four hours, supporting a 4.9 out of 5 mobile App Store rating. Named client production deployments validate enterprise adoption in international markets, including HP and Volkswagen in Spain and Belgium. However, comprehensive case studies detailing underwriting loss ratios, employee net promoter scores across separate employer accounts, and verified enterprise pilot-to-production conversion rates have not been made available publicly."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "retention-durability-and-concentration-risks"
    title: "Retention Durability, Procurement Friction, and Concentration Exposure"
    body: "Evaluating customer retention and revenue durability at Alan requires separating verified operational velocity from private underwriting disclosures. In enterprise B2B health benefits, maintaining durability requires disciplined ideal customer profile governance, seamless onboarding, and high retention and net revenue retention (NRR). While Alan achieved operating break-even and operational profitability in its core French domestic market, management has not published formal net revenue retention, gross revenue retention, or multi-year account cohort churn metrics. This disclosure omission creates analytical opacity regarding whether ARR expansion is driven by underlying headcount growth within existing corporate accounts or entirely by net-new logo acquisition. Furthermore, customer concentration has intensified with major public-sector tender awards. The French civil servant contract, comprising up to 135,000 covered lives, concentrates an estimated 10% to 15% of Alan's total member base within a single administrative counterparty subject to public procurement cycles, legislative changes, and renegotiation pressure. In international territories, cross-border regulatory compliance and local healthcare coordination create distinct procurement friction relative to the established French mutuelle ecosystem. Finally, general corporate data breach risks highlight the acute vulnerability of customer and member trust across digital administrative and legal health systems, reinforcing the diligence requirement for audited third-party customer retention and data security disclosures."
    claimRefs:
      - "CU002"
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU013"
      - "CU014"
callouts:
  - calloutType: "insight"
    title: "Preventative Workflow Engagement Drives Employer Stickiness"
    body: "Alan transforms traditional reactive health insurance into daily employee engagement, capturing over 30% weekly active user participation in wellness challenges and resolving 50% of claims within 5 minutes. This consumer-grade service level creates bottom-up employee advocacy, prompting 98% of SMB clients to spend under two hours annually on benefits administration."
    claimRefs:
      - "CU005"
      - "CU006"
  - calloutType: "risk"
    title: "Public Sector Tender Concentration and Underwriting Opacity"
    body: "Winning coverage for 135,000 French civil servants and their families provides immense top-line scale but introduces severe single-counterparty exposure. Coupled with the complete absence of public NRR, GRR, and cohort churn figures, investors cannot independently audit whether core private-sector accounts renew and expand profitably."
    claimRefs:
      - "CU002"
      - "CU007"
      - "CU010"
