evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: underwriting-economics
    missingEvidence: >-
      Audited statutory underwriting disclosures detailing health claims loss ratios (sinistres à primes), prévoyance
      loss ratios, combined operating ratios, and reinsurance treaty retrocession terms.
    whyItMatters: >-
      Without public loss ratios, independent evaluators cannot determine whether top-line ARR expansion represents
      profitable technical underwriting or high-risk exposure subsidized by investment returns.
    diligencePath: >-
      Review French regulatory ACPR annual solvency filings (SFCR - Solvency and Financial Condition Report) for Alan SA
      and Alan Assurance.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent market-spend denominators for complementary insurance, care access, and prevention in each active
      country, with methodology sufficient to separate TAM, SAM, and obtainable near-term spend.
    whyItMatters: >-
      Company ARR, members, businesses, engagement, and contract ceilings show traction but cannot establish market
      penetration or a defensible valuation multiple against addressable spend.
    diligencePath: >-
      Obtain regulator or industry-association premium-volume data by country and product line, then reconcile those
      totals to Alan's licensed products and geographic eligibility.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segment-level contract values, buyer roles, premium contribution splits, sales-cycle duration, retention, loss
      ratios, and country-level economics.
    whyItMatters: >-
      Without buyer and unit-economics evidence, adoption timing and the portion of nominal spend Alan can profitably
      serve remain uncertain.
    diligencePath: >-
      Request a customer-cohort pack segmented by SMEs, enterprises, governments, and individuals, including procurement
      ownership, annual contract value, retention, and underwriting performance.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: underwriting-economics
    missingEvidence: >-
      Audited technical loss ratios, expense ratios, net combined ratios, and reinsurance ceding treaties across French
      and international insurance books.
    whyItMatters: >-
      Without statutory loss ratios and reinsurance structures, prospective investors cannot determine whether insurance
      underwriting is fundamentally profitable or subsidized by venture capital.
    diligencePath: >-
      Request regulatory ACPR statutory Solvency II annual returns and technical account disclosures from Alan's finance
      team.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: international-margins
    missingEvidence: >-
      Country-level revenue, gross margins, loss ratios, and cash burn decomposition for operations in Belgium, Spain,
      and Canada.
    whyItMatters: >-
      Assessing whether international expansion is diluting core French margins or tracking toward regional break-even
      is impossible without geographic unit economics.
    diligencePath: Obtain management accounts segmented by country and operating entity.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: architecture
    missingEvidence: >-
      Technical documentation detailing Alan's machine learning model architectures, training corpora, validation error
      distributions, and AI safety audit reports.
    whyItMatters: >-
      Independent clinical validation of Alan's AI medical assistant is required to evaluate diagnostic reliability,
      malpractice liability exposure, and EU AI Act regulatory compliance.
    diligencePath: >-
      Request Alan's clinical AI governance dossier, physician supervisory protocols, and external algorithmic audit
      filings under the European AI Act.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and logo retention by customer segment (SMB vs
      enterprise vs public sector).
