companyProfile:
  summary: "Instabase is a San Francisco-based enterprise software company that provides an AI-powered platform for automating document-heavy and unstructured-data workflows. Founded in 2015 by MIT PhD-dropout Anant Bhardwaj, it serves large financial-services firms, insurers, and government agencies with intelligent document processing, workflow automation, and generative-AI content understanding. After scaling from a 2019 unicorn to a reported $2B valuation in 2023, its January 2025 $100M Series D reset the valuation to roughly $1.24B."
  foundedDate: "2015-01-01"
  founders:
    - name: "Anant Bhardwaj"
      role: "Founder & CEO"
      background: "MIT PhD dropout (2015); prior MS in CS at Stanford and engineering degree from Pune University; interned at Google and worked at BMC Software."
      claimRefs: [CO014]
  foundingLocation: "San Francisco, CA, USA"
  headquarters: "San Francisco, CA, USA"
  productSummary: "An agentic AI automation platform (AI Hub, HUB, Marketplace) that ingests unstructured document packets — PDFs, forms, emails, images, scans — and produces structured, auditable data using transformer/LLM-based deep document understanding, packet-aware AI agents, and multi-model optimization."
  customerFocus: "Large enterprises in financial services (banks, mortgage, insurance), plus government agencies, automating invoice processing, lending, KYC, and client onboarding."
  businessModel: "Enterprise B2B SaaS / platform licensing, sold to large regulated enterprises; usage- and subscription-based revenue for document automation workflows and AI Hub apps."
  stage: "Series D"
  fundingStatus: "Raised a $100M Series D in January 2025 led by the Qatar Investment Authority at an approximate $1.24B post-money valuation — a down round from the reported $2B 2023 Series C. Lifetime capital raised is reported between roughly $248M and $281M (sources conflict)."
  disclosureProfile: private-undisclosed
