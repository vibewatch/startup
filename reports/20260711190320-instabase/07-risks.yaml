- id: TR007
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Valuation / financing
    - Next financing or secondary mark
    - Below 2025 Series D mark or highly structured bridge
    - Pause or reprice; require downside-preference analysis
  - - ARR quality
    - ARR growth, NRR and gross retention
    - ARR growth inconsistent with >20x ARR valuation or NRR below enterprise software norms
    - Move from track to avoid unless price resets
  - - Burn / runway
    - Monthly burn and cash runway
    - Runway below 18 months without credible efficiency plan
    - Require insider support or avoid
  - - Hyperscaler competition
    - Win/loss against Google/AWS/Microsoft
    - Losses on price or procurement despite comparable accuracy
    - Reduce terminal multiple and moat score
  - - Accuracy / hallucination
    - Regulated workflow incident or failed acceptance test
    - Material misread, hallucinated extraction or audit failure
    - Treat as thesis-breaking until remediated
  - - OpenAI / model dependency
    - Terms, pricing, outage or data-control change
    - Material cost increase or customer compliance blocker
    - Require multi-model proof and contractual protections
  - - Security / privacy
    - Breach, adverse SOC report or customer audit failure
    - Sensitive-document incident or failed audit
    - Stop unless scope is immaterial and remediated
  - - People / execution
    - Founder departure or sales-leadership churn
    - CEO exit or repeated senior GTM turnover during growth push
    - Re-underwrite management and pipeline
  notes: Kill criteria are intentionally monitorable; thresholds should be calibrated with private operating data in diligence.
