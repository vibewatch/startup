- id: mitigations-kill-criteria
  title: Mitigations, monitoring and thesis-break triggers
  body: The mitigation plan should be framed as monitored conditions rather than static comfort. Fresh capital, trust materials, privacy disclosures, financial-services and public-sector positioning, and named customer proof keep the risk rating below critical. However, a diligence process should move the rating only after private evidence confirms ARR quality, NRR, gross margin, burn, concentration, security posture and model-provider resilience. The clearest thesis-break triggers are a new down round or structured financing below the 2025 mark, ARR growth that does not support the implied multiple, a material data or accuracy incident in a regulated workflow, loss of critical LLM access or unfavorable terms, or evidence that hyperscalers are winning the same document packets at lower price through bundled procurement.
