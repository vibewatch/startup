  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: Audited or board-approved ARR, bookings, gross margin, burn, runway, NRR, GRR, pipeline and preference-stack data.
    whyItMatters: These inputs determine whether the down round is a fair reset or a continuing financing-risk signal.
    diligencePath: Request board deck, data room financial model, cash schedule, sales cohort exports and financing documents.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR030
    relatedTableRefs:
    - TR003
    - TR007
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue share, renewal rates, deployment maturity, usage logs and expansion/churn history.
    whyItMatters: Named customer proof does not reveal whether one or two accounts drive ARR or whether deployments are durable.
    diligencePath: Obtain anonymized customer concentration schedule, cohort retention, reference calls and contract renewal history.
    relatedQuestionRefs:
    - QR016
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: model-risk-controls
    missingEvidence: Customer-facing eval results, audit trail samples, human-review thresholds, incident logs and model-provider fallback test evidence.
    whyItMatters: Regulated document automation can fail through inaccurate extraction, hallucination or unexplained decisions even when security controls exist.
    diligencePath: Review model governance artifacts, SOC reports, acceptance-test packs and post-deployment incident reports.
    relatedQuestionRefs:
    - QR008
    - QR010
    - QR022
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: Privileged litigation searches, customer contract exceptions, DPIAs, DPAs, subpoenas, complaints and jurisdiction-specific legal opinions.
    whyItMatters: The public regulatory register cannot prove the absence of disputes or customer-specific obligations.
    diligencePath: Have counsel run litigation/regulatory searches and review material contracts and privacy/security schedules.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR002
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Current employee count by function and geography, attrition, open roles and post-Series-D hiring plan.
    whyItMatters: Third-party headcount sources conflict, yet sales and support capacity are central to execution risk.
    diligencePath: Request HRIS export, payroll by function, attrition bridge and recruiting plan.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR006
