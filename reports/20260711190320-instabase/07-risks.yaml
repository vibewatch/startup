- id: TR003
  title: Down-round / financial risk table
  columns:
  - Metric / event
  - Public evidence
  - Risk interpretation
  - Mitigation / diligence ask
  rows:
  - - 2023 valuation
    - Company/public reporting around Series C described roughly $2B valuation
    - High anchor creates reset optics
    - Confirm security type, preference stack and secondary marks
