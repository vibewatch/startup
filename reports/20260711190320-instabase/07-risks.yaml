- id: market-technology-risk
  title: Market, competitive and technology risk
  body: Instabase is positioned in a market where the basic document-extraction layer is being absorbed by platforms. Google Document AI, Amazon Textract and Azure AI Document Intelligence all advertise direct extraction of text, tables, key-value pairs or document structure; UiPath and Hyperscience add automation-suite and IDP alternatives. Instabase's answer is harder workflows, packet awareness, visual reasoning, agent mode and enterprise security, but those differentiators must be proven with accuracy, audit trails, and measurable deployment outcomes. The technology risk is not simply hallucination in the abstract. It is the operational question of whether regulated buyers can trust automated packet decisions, trace outputs back to evidence, and allocate liability when a model or third-party provider changes behavior.
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR015
  - CR033
  - CR036
  - CR040
