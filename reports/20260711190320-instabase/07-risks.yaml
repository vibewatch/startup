- id: regulatory-legal-security
  title: Regulatory, legal, privacy and security risk
  body: 'The regulatory register is broad because Instabase sells into financial-services, public-sector and other sensitive workflows rather than consumer productivity alone. The EU AI Act''s risk-based framework, NIST''s AI risk-management guidance and the SEC''s AI-washing enforcement all point to practical obligations: do not overstate AI capabilities, maintain governance evidence, test accuracy and robustness, and ensure customer-facing claims match deployed controls. Instabase''s trust and privacy pages are meaningful mitigations and are necessary for enterprise procurement. They do not eliminate exposure because the highest-impact failure modes are private: a breach involving sensitive documents, an audit failure, a contract dispute over model output, or a customer incident in a regulated process.'
