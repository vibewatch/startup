    - $100M led by QIA at about $1.2B-$1.24B post-money
    - Fresh capital but down round versus 2023
    - Request runway, burn and use-of-proceeds plan
  - - Approximate valuation decline
    - ~38% reduction from $2.0B to ~$1.24B
    - Signals multiple compression or growth-risk repricing
    - Assess whether reset already clears downside
  - - ARR estimate
    - GetLatka estimates ~$50M ARR in 2025
    - ~24x ARR remains demanding if estimate is right
    - Replace with audited ARR, NRR and cohort expansion
  - - Growth estimate
    - GetLatka implies growth from ~$40.8M in 2024 to ~$50M in 2025
    - ~22% estimated growth is not enough for a premium late-stage AI multiple if accurate
    - Reconcile bookings, ARR bridge and pipeline quality
  - - Total capital raised
    - Public round data implies roughly $277M-$280M raised
    - Exit and dilution threshold remain high
    - Review preferences, option pool and latest cap table
  - - Burn / runway
    - Not publicly disclosed
    - Core model risk remains private
    - Obtain monthly burn, gross margin and cash balance
  notes: Uses public and low-confidence third-party financial estimates; the table is a diligence agenda, not a final model.
