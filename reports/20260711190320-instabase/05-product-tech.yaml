chapter:
  number: 5
  title: Product & Technology
  summary: Instabase shows a credible enterprise document-automation stack around AI Hub, packet-aware agents, runtime governance,
    validation, references, and human review. The product is differentiated versus generic LLMs by workflow depth and auditability,
    but diligence must verify accuracy benchmarks, third-party LLM dependency, OpenAI/CPTO specifics, and customer implementation
    evidence.
sections:
- id: product-suite
  title: Product suite and workflow fit
  body: 'Instabase’s product narrative has shifted from document extraction toward agentic automation for document-heavy operations.
    AI Hub Automate is the customer-facing anchor: it is marketed for loan applications, insurance claims, trade-finance deals,
    and other document packets where teams must understand context, validate across documents, apply business logic, and preserve
    auditability. The suite includes AI Hub, the broader HUB/agentic automation platform, Marketplace apps, packet-aware automations,
    Deep Document Understanding content, AI Runtime, and custom functions/API surfaces. The strongest evidence is official
    product and documentation language, plus TechCrunch’s external description of apps for income verification, identity verification,
    invoice processing, and receipt verification. The maturity question is not whether the modules exist publicly; it is whether
    performance is production-proven across customer-specific, regulated edge cases without excessive human review.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE020
  - CE021
  - CE024
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
  - FE002
- id: architecture-and-stack
  title: Architecture, models, and operating stack
  body: 'The technical architecture is a layered enterprise document pipeline rather than a single generic LLM prompt. Public
    docs describe ingestion from upstream systems, packet construction, class and cross-class fields, model choices, prompts,
    custom functions, deployments, downstream integrations, and monitoring. The LLM layer is abstracted behind AI Runtime:
    versions include the LLM, prompt templates, and processing pipelines, with enterprise controls for update timing. This
    is useful because model upgrades can change outputs, but it also creates a diligence dependency: investors need to inspect
    which tenant-level model providers are used, what fallbacks exist, and whether customer contracts insulate regulated workflows
    from third-party model policy, price, outage, or accuracy changes. Public GitHub repositories show an OpenAPI spec and
    deployment tooling, enough to confirm a developer surface but not enough to infer broad open-source adoption.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
