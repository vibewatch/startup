  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: benchmarks
    missingEvidence: Field-level precision, recall, false-positive, false-negative, and straight-through-processing benchmarks
      by document class and packet type.
    whyItMatters: Public evidence shows controls but not whether the controls produce underwriting-grade accuracy in regulated
      customer workflows.
    diligencePath: Request benchmark packs, representative test sets, red-team runs, and before/after automation metrics from
      at least three production customers.
    relatedQuestionRefs:
    - QE009
    - QE015
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: llm-provider-dependency
    missingEvidence: Tenant-level model-provider list, fallback policy, uptime history, data-use commitments, and contractual
      recourse for third-party LLM outages or policy changes.
    whyItMatters: AI Runtime abstracts models, but investors need to know whether OpenAI or other foundation-model providers
      create concentration, cost, or compliance exposure.
    diligencePath: Review architecture diagrams, model-provider contracts, security questionnaires, and incident/change-management
      logs.
    relatedQuestionRefs:
    - QE016
    - QE026
    relatedTableRefs:
    - TE003
  - type: access-blocked
    severity: minor
    topic: reviews
    missingEvidence: Accessible third-party review content from G2 or comparable review sites with product-quality complaints
      and deployment failure modes.
    whyItMatters: Customer-reported review data would triangulate whether public trust and workflow claims survive real implementations.
    diligencePath: Obtain paid analyst review exports, customer references, Gartner Peer Insights, G2 access, and support-ticket
      summaries.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: minor
    topic: leadership-roadmap
    missingEvidence: Primary source confirming Omkar Pendse as CPTO in January 2026 and linking his remit to product/technology
      roadmap decisions.
    whyItMatters: The brief flags a new CPTO, but product execution accountability should not be underwritten from an unfetched
      aggregator fact.
    diligencePath: Request the appointment announcement, board materials, org chart, and 2026 roadmap review owned by the
      CPTO.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE006
  - type: enumeration-incomplete
    severity: minor
    topic: product-module-enumeration
    missingEvidence: Private SKU list, packaging, feature flags, tenant availability, and retired/legacy module map for the
      full product catalog.
    whyItMatters: The product module table is based on public surfaces and may omit contract-only or legacy modules that affect
      migration risk.
    diligencePath: Ask management for SKU catalog, entitlement matrix, roadmap, deprecation plan, and top-customer module
      usage export.
    relatedQuestionRefs:
    - QE002
    relatedTableRefs:
    - TE001
