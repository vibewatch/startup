- id: TE004
  title: Differentiation vs. generic LLM table
  columns:
  - Dimension
  - Generic LLM / prompt-only approach
  - Instabase public positioning
  - Diligence test
  rows:
  - - Document structure
    - Relies on prompt context and model attention limits
    - Digitization, parsing, layout/visual reasoning, and content representation
    - Run a blind benchmark on messy scans, tables, handwriting, and long packets
  - - Grounding
    - May answer from latent knowledge or insufficient context
    - RAG, optimized chunking, document/chunk references, and word/phrase references
    - Inspect citations and source spans for every high-risk field
  - - Workflow automation
    - Produces text output but not governed operations
    - Deployments, validation rules, review queues, integrations, and monitoring
    - Measure straight-through processing and exception handling in production
  - - Change control
    - Model upgrades can alter behavior unexpectedly
    - AI Runtime and app versions separate platform/model changes from app configuration
    - Review release, regression, rollback, and customer notification records
  - - Regulated auditability
    - Requires custom logging and policy wrapper
    - Audit trails, source-linked references, confidence scores, and human review
    - Export audit logs and test examiner-ready traceability
  notes: Comparison is product-positioning analysis based on public docs and risk sources, not a head-to-head benchmark.
