  - FE004
- id: trust-quality-and-risk
  title: Trust, quality, compliance, and technical risks
  body: 'The public control set is appropriate for regulated customers: Instabase markets SSO, role-based access, dedicated
    workspaces, VPC deployment, encryption, SOC 2 Type II, GDPR, HIPAA, and CCPA, while docs show accuracy tests, ground-truth
    comparisons, validation results, automation metrics, and human review. The adverse side is equally important. NIST treats
    generative-AI confabulation as a risk because confident false outputs can mislead users, and OpenAI’s own terms caution
    that output may not always be accurate and should not be a sole source of truth. Instabase’s mitigation story—grounding,
    references, confidence scoring, validation, and review—is directionally sound, but diligence should demand field-level
    benchmark packs, false-positive/false-negative thresholds, audit-log exports, and incident history for actual customer
    deployments.'
  claimRefs:
  - CE016
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE036
  - CE037
  - CE040
  - CE042
  - CE043
