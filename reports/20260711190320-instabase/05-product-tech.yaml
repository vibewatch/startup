- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Instabase solution
  - Measurable benefit claimed
  - Limitation
  rows:
  - - Loan or credit packet review
    - Manual checks across forms, statements, IDs, and tax documents
    - Packet-level cross-class fields and validation
    - Faster decision-ready data from related documents
    - No public false-negative benchmark by packet class
  - - Insurance claims or submissions
    - Broker and claims documents arrive in varied layouts
    - LLM/GPT-enabled document understanding with human review
    - Less manual extraction and faster risk review
    - Accuracy remains model- and document-quality-dependent
  - - Invoice or receipt processing
    - Rules-based extraction breaks on layout variance
    - Prebuilt apps, extraction, cleaning, and downstream integration
    - Lower manual entry and downstream routing effort
    - Realized savings depend on ERP integration and exceptions
  - - Policy or contract analysis
    - Users search long documents and corpora manually
    - RAG, references, and multi-step reasoning
    - Faster grounded answers with source traceability
    - RAG quality depends on chunking, retrieval, and scope
  - - Enterprise app rollout
    - Business teams wait on data science or engineering queues
    - No-code app creation, Marketplace templates, versioned deployment
    - Shorter launch cycle and governed production promotion
    - Private SDLC evidence and rollback history not public
  notes: Workflow benefits are company-claimed or third-party described; no public customer-level benchmark pack was found.
