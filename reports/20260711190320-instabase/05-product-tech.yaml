- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer or component
  - Role in stack
  - Key dependency
  - Primary risk
  rows:
  - - Ingestion and connected drives
    - Pull files, folders, emails, or cloud-storage inputs into deployments
    - Customer storage and mailbox integrations
    - Duplicate runs, unsupported connectors, and data-retention configuration errors
  - - Packet schema and cross-class fields
    - Organize related documents and consolidate fields across classes
    - Correct upload grouping and representative packet design
    - Mis-grouped packets or brittle cross-document logic
  - - Model tier / AI Runtime
    - Run prompts, LLMs, and processing pipelines under versioned runtime
    - Tenant model provider, runtime version, prompt templates
    - Regression, cost, latency, or provider-policy changes
  - - Custom functions and LLM client
    - Extend extraction, validation, enrichment, and structured output
    - Python functions, secrets, tenant LLM client
    - Code governance and hidden dependency on provider availability
  - - Validation, accuracy tests, review queues
    - Measure against ground truth and route exceptions to humans
    - Representative datasets and reviewer process
    - Over-optimistic automation rate if validations are sparse
  - - Downstream integration and monitoring
    - Send JSON/CSV/XLSX results and track consumption/automation metrics
    - Business-system endpoints and monitoring thresholds
    - Audit gaps if exports and dashboards are not reconciled
  notes: Architecture is inferred from public docs; private infrastructure, model routing, and tenancy details require data-room
    validation.
