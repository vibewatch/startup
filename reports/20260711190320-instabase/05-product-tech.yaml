- id: differentiation
  title: Differentiation versus generic LLMs and cloud document AI
  body: 'Instabase’s differentiated claim is that enterprise document automation needs full-stack document understanding:
    digitization, layout/visual reasoning, RAG and chunking, source references, confidence scores, validation, human review,
    versioned runtime, and governed deployment. That is more specific than a generic LLM chatbot and more workflow-oriented
    than OCR-only tooling. The differentiation is credible at the product-design level because the controls are visible in
    docs, but it is not conclusively benchmarked in public evidence. Hyperscalers already sell document AI services, and TechCrunch
    explicitly named Google Cloud, AWS, and Azure as competitors. The investable edge therefore depends on packet-aware workflow
    depth, time-to-value, regulated-enterprise governance, and proprietary tuning around document representations—not merely
    access to frontier LLMs or standard RAG patterns that competitors can copy.'
  claimRefs:
  - CE022
  - CE023
  - CE025
  - CE026
  - CE027
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
  - CE037
  tableRefs:
  - TE004
