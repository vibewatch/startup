    {
      "id": "sizing-lenses",
      "title": "Sizing lenses: useful market, noisy measurements",
      "body": "The public sizing record is favorable but not clean. Most IDP-specific estimates cluster around a low-single-digit-billion-dollar market in 2024 or 2025 and forecast rapid growth, yet the endpoint and CAGR vary sharply by publisher. Grand View, Global Market Insights, Verified Market Research, The Business Research Company, Mordor, and Precedence all describe a fast-growing IDP market, but their 2030-to-2034 forecasts range from roughly USD 7.18 billion in 2031 to USD 91.02 billion in 2034. Fortune's 2026 page is especially aggressive, reporting a 2025 baseline that is several times Mordor's 2025 estimate. The best diligence stance is to preserve the contradiction rather than average it away. The narrow TAM is global IDP; the broader TAM adjacency is Document AI; the practical SAM is enterprise document-heavy workflows in regulated sectors; SOM is not public because Instabase does not disclose segment revenue or share. This distinction matters for valuation because a broad AI TAM can make growth look inevitable, while a workflow-level SAM forces diligence on document volume, accuracy thresholds, compliance approval, and implementation margin before revenue can be underwritten.",
