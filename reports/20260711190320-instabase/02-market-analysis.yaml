  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Instabase addresses a real but noisy IDP/document-AI market: most narrow IDP estimates put 2024-2025 spend near USD 2.3B-3.2B, while Fortune's current page is a high outlier at USD 10.57B for 2025 and MarketsandMarkets' broader Document AI adjacency is USD 14.66B. The serviceable opportunity is best framed as enterprise financial-services, insurance, and public-sector document workflows, with adoption gated by regulatory trust, workflow integration, hyperscaler substitutes, and proof of ROI."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary: IDP is not the whole automation stack",
      "body": "Instabase should be underwritten against a disciplined document-automation market, not the entire enterprise AI or hyperautomation budget. The included spend is intelligent document processing and document-AI software that classifies documents, extracts fields, validates exceptions, and pushes structured data into downstream workflows. That boundary includes workflow integration and human-in-the-loop validation when they are required to make unstructured or semi-structured documents usable. It excludes generic content storage, broad RPA seats, low-code app development, and cloud AI consumption that does not solve a document-processing job. The adjacent market is Document AI, where MarketsandMarkets includes IDP plus document workflow automation, generative-AI document generation, ECM, and governance tools. Status quo matters as much as named competitors: manual data entry, rule-based OCR templates, and internal workflow teams can delay vendor replacement until accuracy, compliance, and ROI are clear.",
