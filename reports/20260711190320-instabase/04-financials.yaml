- id: unit-economics-and-cost-structure
  title: Unit economics, GTM proxies, and cost structure
  body: The available evidence supports enterprise ACV potential but not a complete SaaS unit-economic model. Sacra's public
    preview estimates roughly 45 enterprise customers and $1.02M ACV in 2023, while BusinessWire says the customer base more
    than doubled after the prior round and cites traction in financial services, healthcare, tech, and government. Rocket's
    1.5M monthly document workload and reported 25% turn-time improvement show why large customers may pay for document automation,
    and AXA's RFP/proof-of-concept path shows a classic enterprise-sales motion. The cost side remains weaker. Official product
    materials emphasize secure VPC deployment, auditability, human review, task queues, monitoring, APIs, SDKs, and connector
    breadth, which are valuable but can increase implementation, support, cloud, and model-inference costs. Public hyperscaler
    document-AI pricing is a buyer benchmark and competitive pressure point; without Instabase gross margin by delivery mode,
    it is not possible to know whether AI Hub scales like software, services, or a hybrid.
  claimRefs:
  - CI005
  - CI025
  - CI026
  - CI028
