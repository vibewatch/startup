  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited financials
    missingEvidence: Audited or board-approved financial statements, ARR bridge, recognized revenue, deferred revenue, and
      bookings for 2023-2026.
    whyItMatters: Public revenue figures are third-party estimates and cannot support valuation, growth, or margin conclusions
      alone.
    diligencePath: Request management data room financial package and reconcile it to bank statements, board decks, and customer
      contracts.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI019
    - QI021
    relatedTableRefs:
    - TI001
    - TI008
  - type: conflicting-data
    severity: material
    topic: revenue and funding estimates
    missingEvidence: Management-confirmed revenue, ARR, total primary capital raised, secondary share activity, and capitalization
      table.
    whyItMatters: GetLatka, Growjo, Sacra, Tracxn, Silicon Valley Journals, Dexter, Premier Alts, and Incfact disagree materially.
    diligencePath: Build a reconciliation schedule from management ledger, financing documents, and board-approved KPI definitions.
    relatedQuestionRefs:
    - QI002
    - QI008
    relatedTableRefs:
    - TI001
    - TI003
    - TI004
    - TI008
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Gross margin, services margin, cloud and LLM cost, implementation hours, support cost, NRR, GRR, CAC
      payback, churn, sales cycle, and customer concentration.
    whyItMatters: The business could be high-margin software or a services-heavy automation platform; public sources do not
      decide that question.
    diligencePath: Request cohort model, revenue by product and services, customer-level ARR waterfall, and infrastructure
      cost detail.
    relatedQuestionRefs:
    - QI013
    - QI014
    - QI024
    relatedTableRefs:
    - TI005
    - TI008
  - type: private-evidence-only
    severity: material
    topic: cash and runway
    missingEvidence: Current cash balance, debt, working-capital obligations, monthly burn, hiring plan, cloud commitments,
      and next-round trigger.
    whyItMatters: The $100M Series D is meaningful, but runway cannot be estimated without burn and cash data.
    diligencePath: Request latest cash report, bank statements, debt schedule, board budget, and rolling 24-month cash forecast.
    relatedQuestionRefs:
    - QI016
    - QI025
    relatedTableRefs:
    - TI007
    - TI008
  - type: access-blocked
    severity: minor
    topic: paywalled down-round coverage
    missingEvidence: Full Bloomberg article text and any underlying company interview or PitchBook detail not visible in public
      preview.
    whyItMatters: The public preview corroborates the down-round headline, but full terms may include preferences or structure
      that affect economic interpretation.
    diligencePath: Obtain licensed Bloomberg/PitchBook access or request financing documents directly from management.
    relatedQuestionRefs:
    - QI009
    - QI020
    relatedTableRefs:
    - TI004
