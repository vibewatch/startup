company:
  name: Instabase
chapter:
  number: 4
  title: Financials
  summary: Instabase shows real enterprise traction and a fresh $100M Series D, but the financial record is dominated by third-party
    estimates. The adverse view is that a $1.24B down-round valuation still implies roughly 24.8x estimated 2025 revenue,
    while cash, burn, gross margin, retention, and audited financials remain private-evidence-only gaps.
sections:
- id: revenue-quality-and-estimates
  title: Revenue quality, ARR estimates, and model
  body: 'Instabase is private, so the financial chapter starts with a caveat: none of the reviewed public sources provides
    audited financial statements, a management ARR bridge, recognized revenue, net revenue retention, gross margin, cash balance,
    or burn. The usable revenue picture is therefore a triangulation exercise. GetLatka estimates $50M of 2025 revenue after
    $40.8M in 2024, Sacra estimates $46M ARR in 2023, Growjo estimates $38.3M annual revenue, Silicon Valley Journals says
    $60M, and Incfact uses a very wide $100M-$500M statistical range. Those figures are directionally compatible with a mid-eight-figure
    enterprise software business but not precise enough for valuation underwriting. The revenue mechanism is clearer than
    the revenue number: Instabase sells enterprise automation around document packets, extraction, validation, human review,
    monitoring, APIs, connectors, and secure deployments for regulated buyers. Customer proof from Rocket, AXA, USPTO, banks,
    and public-sector references supports real workflow value, but it does not reveal realized pricing or margin.'
