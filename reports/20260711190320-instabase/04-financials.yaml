- id: funding-valuation-and-capital-efficiency
  title: Funding, valuation reset, and capital efficiency
  body: 'The January 2025 Series D is the central financing fact for financial diligence. Instabase announced $100M led by
    QIA, with Greylock, NEA, Andreessen Horowitz, and Index Ventures participating, and said the proceeds would fund automation,
    analysis, and search capabilities in AI Hub. The adverse interpretation is that this was not simply a growth round: Bloomberg
    Law, TechCrunch, Maginative, and SiliconANGLE all point to a $1.24B valuation below the 2023 $2B mark. Using GetLatka''s
    $50M 2025 revenue estimate, the reset still implies roughly 24.8x revenue; using $277M of total funding, capital raised
    is about 5.5x estimated revenue, and the ratio is higher if Tracxn''s $322M total is used. That is not disqualifying for
    a high-retention enterprise software company, but it is a demanding burden of proof when gross margin, NRR, CAC payback,
    cash burn, and cash balance are undisclosed.'
