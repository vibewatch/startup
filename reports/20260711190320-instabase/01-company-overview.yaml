- id: leadership-and-governance
  title: Leadership, governance signals, and key-person dependence
  body: 'The official leadership page names Anant Bhardwaj as founder and CEO, Jarett Nixon as general counsel and head of legal, Ashish Dahiya as chief operating officer, and Omkar Pendse as chief product technology officer. That slate gives Instabase visible coverage across founder vision, legal/compliance, operations, and product-technology execution. Leadership-change evidence is material because the company is moving from classic intelligent document processing into generative-AI and agentic automation: BusinessWire and Instabase sources show Junie Dinda joined as CMO in November 2024, while advisory-board appointments added federal-market and India-expansion expertise through Howard Levenson and Deepak Sharma. The diligence caveat is governance opacity. Reviewed public sources disclose investors, advisors, and executives, but not a formal board roster, investor control rights, independent directors, debt covenants, or succession plan. Because Bhardwaj is repeatedly quoted in funding, product, and recognition sources, key-person dependence remains a real overview-level risk.'
