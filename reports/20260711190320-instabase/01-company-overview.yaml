- id: cover-metrics-and-scale
  title: Cover metrics, scale proof, and unsupported numbers
  body: The public cover metrics are uneven. Valuation, latest round, stage, headquarters, locations, and named customers are supportable; revenue, ARR, customer count, gross margin, retention, and current headcount are not company-disclosed. Maginative says revenue exceeded $50M in 2024, but that is a third-party datapoint and should not be treated like audited ARR. The Org places Instabase in a 201-500 employee band, while the company page says only that it has hubs in four cities; exact headcount requires payroll, LinkedIn Recruiter, or management confirmation. Customer proof is stronger than financial disclosure. Official pages and cases cite NatWest, Rocket Mortgage, AXA, Paychex, İşbank, USPTO, Uber, and four of the five largest U.S. banks; Rocket Mortgage's case cites 1.5M mortgage documents per month. BusinessWire says the customer base more than doubled since the prior funding round, but the absolute count is still missing.
