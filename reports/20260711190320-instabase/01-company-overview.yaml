company:
  name: Instabase
chapter:
  number: 1
  title: Company Overview
  summary: Instabase is a San Francisco-based private applied-AI company founded in 2015 by Anant Bhardwaj, now positioned around AI Hub and agentic automation for complex document-heavy enterprise workflows. Public evidence supports a $100M Series D in January 2025 led by QIA at roughly a $1.24B post-money valuation, a down round from the 2023 $2B Series C, while revenue, exact customer count, board rights, and current headcount remain incompletely disclosed.
sections:
- id: identity-and-model
  title: Identity, headquarters, and business model
  body: 'Instabase is best read as a private applied-AI infrastructure company for document-heavy enterprise operations, not as a horizontal chatbot vendor. The company site says Instabase transforms unstructured document packets into reliable, auditable data through AI Hub, packet-aware AI agents, multi-model optimization, and deep document understanding. Its company page and Wikipedia profile identify San Francisco as headquarters and list a global operating footprint across San Francisco, New York, London, and Bangalore. The founding record is consistent that Anant Bhardwaj founded the company in 2015 after leaving MIT doctoral work; official company materials still put him at the center as founder and CEO. The commercial model is enterprise workflow automation for regulated or document-intensive buyers: financial services, insurance, public sector, healthcare, technology, and large enterprises using customer- or partner-led implementations rather than a disclosed self-serve SaaS revenue schedule.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
