- id: milestones-and-diligence-stance
  title: Milestone chronology and overview diligence stance
  body: 'The milestone record indicates a company that repeatedly repositions around the same core substrate: unstructured enterprise content. Early milestones center on founding, venture financing, and the Cloudstitch acquisition; the 2019 Series B moved Instabase into unicorn status around enterprise automation; the 2023 AI Hub launch recast the platform around generative AI; and 2024-2025 releases and partnerships pushed chatbot, visual-reasoning, and agentic automation use cases. The strongest bullish signal is enterprise proof in regulated markets, including financial services, insurance, public sector, healthcare, and large banks. The strongest caution is that the 2025 capital raise came at a lower valuation than the 2023 round, while public revenue and headcount evidence remains third-party or range-bound. Later chapters should therefore reuse this overview as an identity and chronology anchor, but should independently re-underwrite revenue quality, customer concentration, AI-model dependence, and valuation support.'
