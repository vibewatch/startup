  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited revenue, ARR, gross margin, net retention, burn, and customer concentration by cohort.
    whyItMatters: The valuation reset and a third-party revenue datapoint are insufficient to judge quality of growth or revenue multiple.
    diligencePath: Request management financial package, ARR bridge, customer cohort export, and auditor-reviewed revenue-recognition policy.
    relatedQuestionRefs:
    - QO013
    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Formal board roster, observer rights, preferred-share terms, liquidation preference, debt, warrants, and investor protective provisions.
    whyItMatters: The down round could include structured terms that alter common-equity economics and governance control.
    diligencePath: Review charter, investor rights agreement, board consents, financing documents, and pro forma cap table.
    relatedQuestionRefs:
    - QO008
    - QO012
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: total-raised
    missingEvidence: Single company-confirmed total capital raised that reconciles disclosed rounds, secondaries, debt, and database figures.
    whyItMatters: Public totals range from disclosed-round arithmetic to CB Insights estimates, affecting cover metrics and dilution analysis.
    diligencePath: Ask company counsel or finance team for cap-table export and round-by-round primary/secondary proceeds schedule.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO001
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: Contract-signing dates for named customers, complete product-release history, and any undisclosed adverse legal or regulatory events.
    whyItMatters: The overview timeline is public-announcement based and may miss material private milestones or issues.
    diligencePath: Cross-check board decks, customer contracts, product changelog, litigation search, and regulatory correspondence.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: Current full-time equivalent headcount by function and geography, plus attrition and hiring plan.
    whyItMatters: The Org’s employee band is too coarse to support operating leverage or restructuring conclusions.
    diligencePath: Request HRIS export and compare with LinkedIn Recruiter trend data and payroll registers.
    relatedQuestionRefs:
    - QO015
    - QO024
    relatedTableRefs:
    - TO001
    - TO002
