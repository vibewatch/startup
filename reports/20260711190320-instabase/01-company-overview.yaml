- id: funding-and-valuation
  title: Funding history, valuation reset, and investor map
  body: 'Instabase''s financing history shows genuine institutional validation but also a valuation reset. Wikipedia''s retained source trail and TechCrunch reporting outline a seed round in 2015, a Series A in 2017, a $105M Series B in 2019 that made Instabase a unicorn, and a $45M Series C in June 2023 led by Tribe Capital at a $2B valuation. The January 2025 Series D is better corroborated by TechCrunch, BusinessWire, and Maginative: Instabase raised $100M led by Qatar Investment Authority with participation from Andreessen Horowitz, Greylock, Index Ventures, and NEA. The adverse angle is not subtle. TechCrunch cited Bloomberg for a $1.24B valuation and Maginative framed the round as a valuation reset from the prior $2B mark. Total raised should be presented as a range, not a single audited number: disclosed round arithmetic is about $277M, TechCrunch says roughly $175M had been raised before Series D, and CB Insights lists $280.94M.'
