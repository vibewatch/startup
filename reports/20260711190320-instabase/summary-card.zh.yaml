  topStrengths:
    - 创始人兼 CEO 任期长、技术底子深；公司很早押注基于 transformer / LLM 的文档理解，并做成企业级、可审计的平台。
    - 客户和投资人质量高（QIA、a16z、Greylock、Index、NEA）；公司称上一轮以来客户数增长超过一倍。
    - 生成式 AI 普及正在推高智能文档处理 / 非结构化数据自动化需求，市场大且增长快。
  topRisks:
    - 2025 年 1 月 Series D 约降 38%（从约 ~$2B 到约 ~$1.24B），反映估值重置，也暗示增长低于预期。
    - 即便按重置后的估值测算，约相当于估计 ~$50M ARR 的 ~24x；考虑到私营财务不透明、未经审计且员工数收缩，倍数仍偏高。
    - Google Document AI、AWS Textract、Azure 等超大规模云厂商和资金充足的对手正在压低差异化，公司还依赖 OpenAI 等第三方 LLM。
  unresolvedGaps:
