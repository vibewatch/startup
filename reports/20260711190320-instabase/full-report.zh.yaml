companyProfile:
  summary: >-
    Instabase 是一家总部位于 San Francisco 的企业软件公司，提供 AI 驱动的平台，自动化处理文档密集型和非结构化数据工作流。公司由 MIT 博士项目辍学者 Anant Bhardwaj 于 2015
    年创立，服务大型金融服务机构、保险公司和政府机构，能力覆盖智能文档处理、工作流自动化和生成式 AI 内容理解。公司 2019 年跻身独角兽，2023 年据报估值 $2B；2025 年 1 月 $100M Series D
    把估值重置到约 $1.24B。
  foundedDate: '2015-01-01'
  founders:
    - name: Anant Bhardwaj
      role: 创始人兼 CEO
      background: MIT 博士项目辍学（2015 年）；此前在 Stanford 取得计算机科学硕士学位，在 Pune University 取得工程学位；曾在 Google 实习，并任职于 BMC Software。
      claimRefs:
        - CO014
  foundingLocation: San Francisco, CA, USA
  headquarters: San Francisco, CA, USA
  productSummary: >-
    一个智能体式 AI 自动化平台（AI Hub、HUB、Marketplace），可摄取非结构化文档包——PDF、表单、邮件、图像、扫描件——并借助基于 transformer / LLM 的深度文档理解、文档包感知 AI
    智能体和多模型优化，产出结构化、可审计的数据。
  customerFocus: 面向金融服务领域大型企业（银行、按揭、保险）以及政府机构，自动化处理发票、贷款、KYC 和客户入职流程。
  businessModel: 企业级 B2B SaaS / 平台授权，销售给大型受监管企业；文档自动化工作流和 AI Hub 应用按用量和订阅收费。
  stage: Series D
  fundingStatus: >-
    2025 年 1 月完成 $100M Series D，由 Qatar Investment Authority 领投，投后估值约 $1.24B——低于 2023 年 Series C 据报 $2B 的估值。累计融资据报约在
    $248M 至 $281M 之间（来源不一致）。
