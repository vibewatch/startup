      - number: '3.2'
        title: 能力和定价对比
        blocks:
          - type: paragraph
            body: >-
              能力差异最清楚地体现在文档理解深度和分发能力之间。Instabase 公开差异化点是文档包感知推理、跨文档校验和多模型优化。Hyperscience 以企业后台定位、分析师认可和合规导向基础设施回应。Rossum
              更偏交易和运营，围绕发票和直通式处理披露客户证据。自动化套件靠编排竞争：文档流入审批、ERP 写入、RPA 队列和业务决策。超大规模云厂商靠可得性和价格透明竞争。Google、AWS 和 Azure
              都在官方云页面提供文档服务，Google 和 AWS
              还给出具体的按页定价示例。即便价格透明不能解决最复杂、受监管的文档包，它仍会压迫独立供应商。评论网站部分受阻，因此评论深度评分应视为证据缺口，而不是隐藏的支持点。
