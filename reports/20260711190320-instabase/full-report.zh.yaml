  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：IDP 不是整个自动化栈
        blocks:
          - type: paragraph
            body: >-
              Instabase 应按边界清晰的文档自动化市场承销，而不是拿整个企业 AI 或超自动化预算背书。纳入的支出是智能文档处理和 Document AI
              软件：分类文档、抽取字段、校验异常，并把结构化数据推入下游工作流。当工作流集成和人在环校验是让非结构化或半结构化文档可用的必要条件时，也应纳入边界。边界之外则是通用内容存储、宽泛 RPA
              席位、低代码应用开发，以及不解决文档处理任务的云 AI 消耗。相邻市场是 Document AI，MarketsandMarkets 将 IDP 与文档工作流自动化、生成式 AI 文档生成、ECM
              和治理工具一并纳入。现状替代方案与具名竞争者一样重要：人工录入、基于规则的 OCR 模板和内部工作流团队，都可能在准确率、合规和 ROI 明确之前推迟替换供应商。
