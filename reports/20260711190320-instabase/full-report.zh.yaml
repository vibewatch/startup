        - 溢价倍数和退出稀缺性被削弱。
        - 下调牛市倍数，或放弃。
    notes: 触发阈值是基于公开估值证据和缺失的未上市运营数据推导出的投资政策阈值。
    claimRefs:
      - CV033
      - CV039
      - CV040
      - CV041
      - CV042
  - id: TV007
    title: 最终尽调追问表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR 桥接
        - 2023 至 2026 年季度 ARR，并拆分新增、扩张和流失
        - 判断 24x-25x 是被高估还是有支撑。
        - 获取管理层数据室资料，并与账单核对。
      - - 留存与集中度
        - NRR、总留存、前 10 大客户 ARR、续约分群
        - 区分粘性工作流软件与服务占比高的部署。
        - 要求提供分群文件和客户访谈。
      - - 毛利率与实施组合
        - 软件毛利率、服务毛利率、部署工作量
        - 毛利率低会让上市 SaaS 倍数显得过于宽松。
        - 审阅审计财务或董事会财务材料。
      - - 股权结构与优先权
        - 清算优先权、棘轮条款、期权池、债务、二级交易条款
        - 普通股经济权益可能不同于名义投后估值。
        - 审阅融资法律文件。
      - - 二级市场标记
        - Series D 后的 Forge、Caplight、经纪报价或投资者标记
        - 检验市场是否接受该估值标记。
        - 向投资者和经纪商索取可执行报价意向。
      - - 退出买方证据
        - 自动化、云或企业内容买方的战略兴趣
        - 在具备 IPO 条件前，验证溢价退出路径。
        - 开展买方访谈，并复盘先例 M&A。
    notes: 尽调追问聚焦会改变估值立场的事实，而不是泛泛的产品尽调。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV042
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Instabase 从 2015 年创立起，经历独角兽融资、生成式 AI 重新定位，并在 2025 年完成估值重置。
    data:
      items:
        - date: '2015-08-31'
          label: 种子 / 创立期
          detail: Anant Bhardwaj 创立公司后，Instabase 累计储备约 $3.7M-$3.75M。
        - date: '2017-06-14'
          label: Series A 轮
          detail: Andreessen Horowitz 领投的 Series A 轮让 Instabase 脱离隐身状态。
        - date: '2018-02-14'
          label: 收购 Cloudstitch
          detail: Instabase 收购 Cloudstitch，补上由电子表格驱动的 Web 开发产品脉络。
        - date: '2019-10-21'
          label: Series B 独角兽轮
          detail: Index 领投的 $105M Series B 轮将 Instabase 估值推至 $1B 以上。
        - date: '2022-10-27'
          label: USPTO 试点
          detail: USPTO/Satsyil/Instabase 试点验证了专利文件签名提取。
        - date: '2023-06-06'
          label: AI Hub / Series C 轮
          detail: Instabase 发布 AI Hub，并以据报 $2B 估值融资 $45M。
        - date: '2024-06-06'
          label: AI Hub Chatbots
          detail: Instabase 发布面向非结构化知识的企业聊天机器人能力。
        - date: '2024-06-25'
          label: Rocket 证明点
          detail: Rocket Mortgage 合作提到每月 1.5M 份文档。
        - date: '2024-11-21'
          label: 任命 CMO
          detail: Junie Dinda 加入，负责扩大营销和 GTM。
        - date: '2025-01-17'
          label: Series D 下调轮
          detail: QIA 领投 $100M Series D 轮，将据报估值重置到约 $1.24B。
        - date: '2025-12-08'
          label: Agent Mode
          detail: Agent Mode 将 Instabase 进一步推向自主文档工作流执行。
    approximationNotes: 时间线省略未注明日期的新增客户，采用公开公告日期，而非合同签署日期。
