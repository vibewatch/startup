      - number: '2.2'
        title: 规模测算视角：有用市场，嘈杂口径
        blocks:
          - type: paragraph
            body: >-
              公开市场规模记录偏乐观，但并不干净。大多数 IDP 专项估算把 2024 或 2025 年市场放在低个位数十亿美元区间，并预测快速增长；但终点年份和 CAGR 在不同发布方之间差异很大。Grand
              View、Global Market Insights、Verified Market Research、The Business Research Company、Mordor 和 Precedence
              都描述了一个高速增长的 IDP 市场，但它们对 2030 至 2034 年的预测从 2031 年约 USD 7.18 billion 到 2034 年 USD 91.02 billion 不等。Fortune 的
              2026 页面尤其激进，其 2025 年基线是 Mordor 2025 年估算的数倍。最佳尽调立场是保留矛盾，而不是把它平均掉。窄口径 TAM 是全球 IDP；更宽的 TAM 邻接是 Document AI；实际
              SAM 是受监管行业里的企业文档密集型工作流；SOM 不公开，因为 Instabase 不披露分部收入或份额。这一区分会影响估值：宽泛 AI TAM 会让增长看起来不可避免，而工作流层面的 SAM
              会迫使尽调先验证文档量、准确率门槛、合规审批和实施毛利，再承销收入。
