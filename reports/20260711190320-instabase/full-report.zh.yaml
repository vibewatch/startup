    rows:
      - - 核心 IDP
        - 文档分类、抽取、验证、人工复核、工作流集成
        - 通用存储、广义 RPA 席位、无关 AI 模型消耗
        - 运营、CIO、转型、风险 / 合规
        - AI Hub 和文档密集型工作流的主要市场边界
      - - 文档 AI 邻近市场
        - IDP 加文档工作流自动化、生成、ECM、治理工具
        - 非文档分析和通用 AI 基础设施
        - CIO / 企业应用 / 数据负责人
        - 可作为 TAM 上限，但有重复计算 Instabase 真实 SAM 的风险
      - - 超自动化 / 低代码邻近市场
        - 嵌入文档抽取的自动化编排
        - 不含文档理解组件的工作流自动化
        - CIO、流程卓越、共享服务
        - 扩大平台叙事，但不应按纯 IDP 计入
      - - 超大云厂商文档服务
        - 按量计费 OCR、抽取、分类器、预置处理器、API
        - 不处理文档的定制服务
        - 开发者、云平台团队、应用负责人
        - 替代品兼互补品；可能把抽取层商品化
      - - 受监管企业工作流
        - KYC、贷款处理、理赔、承保、案件文件、合规报告
        - 消费者文档应用和简单个人生产力工具
        - 运营高管，需风险 / 合规共同批准
        - 相关性最高，因为 Instabase 瞄准企业金融、保险和公共部门买家
      - - 现状替代方案
        - 人工录入、模板 OCR、邮件 / 电子表格工作流、内部自建
        - 除非买方替换流程，否则没有新增供应商支出
        - 一线运营和内部 IT
        - ROI 和准确率跑通前，是实质采用障碍
    notes: 边界基于来源支撑的功能定义；只有在文档理解是采购任务时，才纳入相邻类别。
