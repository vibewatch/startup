      - number: '5.3'
        title: 相对通用 LLM 和云 Document AI 的差异化
        blocks:
          - type: paragraph
            body: >-
              Instabase 的差异化主张是，企业文档自动化需要全栈文档理解：数字化、版面 / 视觉推理、RAG 和切分、来源引用、置信分数、校验、人工审核、版本化运行时和受治理部署。这比通用 LLM
              聊天机器人更具体，也比只做 OCR 的工具更偏工作流。产品设计层面的差异化可信，因为控制项在文档中可见；但公开证据没有给出决定性基准测试。超大规模云厂商已经销售 Document AI 服务，TechCrunch
              也明确点名 Google Cloud、AWS 和 Azure 是竞争者。因此可投资优势取决于文档包感知的工作流深度、价值实现速度、受监管企业治理，以及围绕文档表征的专有调优，而不只是拿到前沿 LLM
              或竞争者可复制的标准 RAG 模式。
