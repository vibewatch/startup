      - number: '3.4'
        title: 竞争尽调结论
        blocks:
          - type: paragraph
            body: >-
              只有当目标客户足够重视深度文档包、可审计性和工作流结果，并愿意避开最低成本 API 选择时，Instabase 的竞争姿态才具备投资性。最强直接威胁是 Hyperscience 和
              Rossum，因为它们把当前产品叙事与分析师或客户证据配在一起。最强分发威胁是 UiPath、Appian、Automation Anywhere、Google、AWS、Microsoft 和
              Box，因为它们都能通过既有企业平台关系切入。最高优先级的尽调问题是：对 Hyperscience 和 UiPath 的具体赢单 / 输单数据；相对 Google 和 AWS
              替代方案的实际定价；按用例拆分的部署粘性；以及证明 Instabase
              在抽取之后仍是控制层，而不是被工作流或云平台替代。在这些证据完成私有尽调前，竞争护城河应评为中等，而不是强。本结论刻意保守，因为公开证据高估供应商话术，低估续约行为。若要上调为强护城河，需要账户级证据证明，采购团队比较超大规模云定价、自动化套件打包和同一文档族的专业工具后，客户仍把
              Instabase 保留为行动系统。还应测试采购团队把 Instabase 视为战略自动化平台，还是可替换的抽取层。
