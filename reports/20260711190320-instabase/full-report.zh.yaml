      - number: '7.6'
        title: 风险缓释、监控与打破投资假设的触发器
        blocks:
          - type: paragraph
            body: >-
              风险缓释要按可监控条件来设，而不是给静态安慰。新资金、信任材料、隐私披露、金融服务和公共部门定位、具名客户证明，让风险评级不至于升到危急。但尽调只有在私下证据确认 ARR
              质量、NRR、毛利率、烧钱速度、集中度、安全姿态和模型供应商韧性之后，才应调整评级。最清楚的打破投资假设触发器包括：低于 2025 年标记的新一轮降估值融资或结构化融资；ARR
              增长撑不起隐含倍数；受监管工作流发生重大数据或准确性事故；关键 LLM 访问丢失或条款恶化；或有证据显示超大云厂商借捆绑采购以更低价格拿下同一批文档包业务。
