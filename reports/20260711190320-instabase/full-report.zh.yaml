        title: 组织、伙伴和客户依赖风险
        blocks:
          - type: paragraph
            body: >-
              组织风险集中在权力集中和交接上。创始人兼 CEO Anant Bhardwaj 仍是公司战略叙事的门面；公开领导层信息显示，公司还在补商业化高管能力。员工规模和人数都是第三方估算，但仍要核实从 2024 年末到
              2025 年后期或 2026 年估算值的收缩方向，因为公司在估值重置后还要销售复杂企业 AI，执行风险会上升。客户集中度同样没解开。Rocket Mortgage 和 USPTO
              的案例证明有价值，但客户标识不会披露头部客户收入占比、续约韧性、模型供应商依赖，也看不出部署价值有多少来自 Instabase、多少来自客户内部流程再造。
