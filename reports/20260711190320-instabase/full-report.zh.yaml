            body: >-
              2025 年 1 月 Series D 是财务尽调的核心融资事实。Instabase 宣布融资 $100M，由 QIA 领投，Greylock、NEA、Andreessen Horowitz 和 Index
              Ventures 参投，并称资金将用于 AI Hub 的自动化、分析和搜索能力。反向解读是，这并不只是增长轮：Bloomberg Law、TechCrunch、Maginative 和 SiliconANGLE
              都指向 $1.24B 估值，低于 2023 年 $2B 标记。若使用 GetLatka 对 2025 年收入 $50M 的估算，重置后仍隐含约 24.8x 收入倍数；若按累计融资 $277M
              计算，融资额约为估算收入的 5.5x；若使用 Tracxn 的 $322M 总额，比率更高。对高留存企业软件公司而言，这并非直接否决项，但在毛利率、NRR、CAC
