  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 采购标准
      - Instabase
      - 直接 IDP 同业
      - 工作流套件
      - 云巨头
      - 专家型厂商 / 相邻市场
      - 未支撑单元格
    rows:
      - - 复杂资料包推理
        - 明确具备资料包感知智能体和跨文档验证
        - Hyperscience 强调后台 AI；Rossum 更偏交易类
        - 来源页面通常呈现下游编排，而非资料包原生
        - 云 API 能解析 / 抽取，但单独撑不起完整资料包工作流
        - Docugami 长文档；Box 内容工作流
        - 因限流，未评估 ABBYY 资料包深度
      - - AI 智能体叙事
        - 明确的智能体式自动化
        - Rossum 和 Hyperscience 描述 AI / 智能体式自动化
        - Appian、UiPath 和 Automation Anywhere 都使用智能体或自动化表述
        - Google / Azure 提供生成式 / 智能体式云工具
        - Docugami Business Document Foundation Model 模型
        - 评测站点说法无法访问
      - - 工作流编排
        - 业务规则和多步骤工作流
        - Rossum 写入 ERP 并处理审批
        - 套件最强优势：RPA、低代码、智能体、HITL
        - 需要客户围绕云服务搭架构
        - Box 内容工作流；Ocrolus 贷款工作流
        - 真实部署深度需要客户背书
      - - 定价透明度
        - 留存页面未公开
        - 留存页面多为演示 / 定制销售姿态
        - 留存页面多为企业 / 定制销售姿态
        - Google / AWS / Azure 发布定价页或示例
        - 此处 Box / Appian 企业定价未公开
        - 实际折扣不可得
      - - 受监管信任姿态
        - 声称智能可验证、可审计
        - Hyperscience 强调合规和分析师认可
        - Appian 强调可审计性 / 控制；UiPath 治理来自 Forrester 报告框架
        - 云巨头继承云合规姿态
        - Ocrolus 聚焦受监管贷款数据采集
        - 安全认证需按章节跟进
      - - 垂直深度
        - 规范上下文显示聚焦金融服务、保险、政府
        - Rossum 发票；Hyperscience 后台
        - 工作流套件横向覆盖广
        - 云 API 是横向基础件
        - Ocrolus 贷款；Docugami 合同 / 表单；Box 内容
        - 客户数和按垂直行业划分的赢 / 输不可得
      - - 分发能力
        - 需要直接企业销售 / 平台采用
        - 纯 IDP 厂商依赖 RFP 拉动
        - UiPath / Appian / Automation Anywhere 有自动化资产杠杆
        - Google / AWS / Microsoft 有云采购杠杆
        - Box 有内容管理足迹
        - 量化渠道贡献不可得
