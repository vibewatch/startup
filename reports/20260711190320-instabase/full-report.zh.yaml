      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              最相关的买方不是泛泛的 AI
              爱好者，而是企业内高量文档运营的负责人。在金融服务中，这意味着客户入职、贷款、KYC、合规、反欺诈和后台运营团队，技术、风险和合规则作为共同审批方。在保险中，承保、理赔、保单管理、精算或风险团队承接运营痛点，AI
              治理和法务团队则防范不公平结果。在政府中，任务、案件管理、采购和 IT 安全团队居中，因为工作流涉及案卷、情报报告、合同和公民记录。付款方通常是运营、转型或 CIO
              预算，而不是单个终端用户。采用过程应建模为漏斗：痛点发现、安全审查、概念验证准确率测试、集成、异常处理和规模化治理。AWS、Google 和 Microsoft
              的云服务降低了试验门槛，也让按用量计费的替代品变得常态化。
