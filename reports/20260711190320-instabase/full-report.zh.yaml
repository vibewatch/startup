              复利资产。收入和员工数都是第三方估算；累计融资因来源不同约在 $277M 至 $322M
              之间；最新轮次是估值重置；隐含收入倍数仍然偏高。因此主要尽调要求不是再找一条新闻引用，而是私有数据室：审计或董事会批准财务、按队列拆分的 ARR、确认收入与 ARR、客户集中度、NRR、logo
