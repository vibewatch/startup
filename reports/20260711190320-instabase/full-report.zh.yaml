            body: >-
              公开记录确认的是资本流入，而不是资本充足。Form D 文件验证了早期融资金额，Series D 新闻稿确认新增资本
              $100M，数据库虽对总额有分歧，但都指向庞大的累计资本基础。缺失的是前瞻承销真正需要的部分：交割时现金、当前现金、债务、月度烧钱、营运资本波动、客户预付款条款、云承诺和 2026
              年经营计划。一个简单敏感性说明了缺口为何重要。如果 Series D 全部 $100M 在交割时可用，在每月烧钱 $5M 时毛跑道约 20 个月，$8M 时 12.5 个月，$10M 时 10
              个月，且未计入收入回款和营运资本影响。该区间仅作示意，不应视为预测。2025-2026 年数据来源给出的员工数估算从 165 到 274 不等，也说明烧钱代理指标噪声太大，无法单独下结论。
