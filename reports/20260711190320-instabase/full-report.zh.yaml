    approximationNotes: 显示依赖类别，不代表合同对手方集中度。
    claimRefs:
      - CR012
      - CR014
      - CR018
      - CR020
      - CR024
      - CR032
      - CR035
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 证据从轮次背书转向估值拉伸，结论落在跟踪 / 继续研究。
    data:
      nodes:
        - id: capital
          label: $100M Series D 轮
          detail: 资方质量和现金跑道改善。
        - id: reset
          label: 38% 降估融资
          detail: 入场价格纪律信号转为反向。
        - id: multiple
          label: ~24.8x 估算 ARR
          detail: 溢价必须由私有基本面撑住。
        - id: comps
          label: 上市可比公司 ~2.4x-3.6x P/S
          detail: 机会成本基准低得多。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 只有数据室证据到位或价格更低，才买入。
    approximationNotes: 定性决策流；节点顺序按证据权重排列，不代表概率。
    claimRefs:
      - CV001
      - CV010
      - CV023
      - CV037
      - CV038
  - id: FV002
    title: 按收入倍数测算的估值敏感性
    type: bar
    layout: standard
    summary: 股权价值对投资者采用上市可比、基准情形还是 AI 溢价倍数高度敏感。
    data:
      items:
        - label: ARR $50M，6x
          value: 300
        - label: ARR $50M，12x
          value: 600
        - label: ARR $50M，20x
          value: 1000
        - label: ARR $50M，24.8x
          value: 1240
        - label: ARR $80M，20x
          value: 1600
    approximationNotes: 数值为百万美元；ARR 和倍数为四舍五入的敏感性情形。
    claimRefs:
      - CV007
      - CV023
      - CV028
      - CV030
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景估值区间统一使用百万美元，并与 TV004 表对齐。
    data:
      items:
        - label: 情景隐含股权价值（USDm）
          low: 240
          base: 720
          high: 1600
    approximationNotes: 低 / 基准 / 高分别为 TV004 中以百万美元计的熊市、基准、牛市价值。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 评分偏向市场和资方质量，但扣分项在估值和证据质量。
    data:
      items:
        - label: 市场拉力
          value: 8
        - label: 资方质量
          value: 8
        - label: 财务透明度
          value: 3
        - label: 估值吸引力
          value: 2
        - label: 退出准备度
          value: 4
        - label: 综合评分
          value: 5
    approximationNotes: 分数为分析师 1-10 分评估，对应已引用的估值证据和缺口。
    claimRefs:
      - CV012
      - CV032
      - CV033
      - CV034
      - CV035
      - CV037
  - id: FV005
    title: 估值历史柱状图
    type: bar
    layout: standard
    summary: 估值重置视图强调不利融资信号，而不是重复每一条融资历史。
    data:
      items:
        - label: 2019 年 Series B 轮 >$1B
          value: 1000
        - label: 2023 年 Series C 轮 ~$2B
          value: 2000
        - label: 2025 年 Series D 轮 ~$1.24B
          value: 1240
    approximationNotes: 单位为百万美元；Series B 按独角兽最低门槛展示，因为公开证据只说明高于 $1B。
    claimRefs:
      - CV003
      - CV010
      - CV011
  - id: FV006
    title: 情景瀑布图
    type: waterfall
    layout: wide
    summary: 瀑布图显示，当前价格需要牛市情形的桥接项，才能高于基准情形的可比公司估值视角。
    data:
      items:
        - label: 当前 Series D 估值标记
          value: 1240
        - label: 上市可比 / 基准倍数折价
          value: -640
        - label: 增长和 AI 工作流溢价
          value: 120
        - label: 基准情形价值
          value: 720
        - label: 额外牛市 ARR 与 20x 溢价
          value: 880
        - label: 牛市情形价值
          value: 1600
    approximationNotes: 数值为百万美元；瀑布图仅作示意，并与当前估值标记、基准情形和牛市情形对齐。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV040
