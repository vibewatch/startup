    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >-
              Instabase 更应被看作一家服务文档密集型企业运营的私营应用 AI 基础设施公司，而不是横向聊天机器人厂商。公司官网称，Instabase 通过 AI Hub、文档包感知 AI
              智能体、多模型优化和深度文档理解，把非结构化文档包转化为可靠、可审计的数据。公司页面和 Wikipedia 资料均指向 San Francisco 总部，并列出覆盖 San Francisco、New
              York、London 和 Bangalore 的全球运营足迹。创始记录一致显示，Anant Bhardwaj 2015 年离开 MIT 博士项目后创立公司；官方公司材料仍把他放在创始人兼 CEO
              的核心位置。商业模式是面向受监管或文档密集型买家的企业工作流自动化：金融服务、保险、公共部门、医疗、科技和大型企业通过客户或伙伴主导的实施落地，而不是公开披露的自助式 SaaS 收费表。
