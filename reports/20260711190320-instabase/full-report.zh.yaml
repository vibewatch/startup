        title: 退出路径、尽调要求与否决触发器
        blocks:
          - type: paragraph
            body: >-
              退出准备度是把建议维持在跟踪的理由。如果 Instabase 证明理解文档包的 AI 智能体、文档理解工作流和企业部署能形成持久护城河，自动化、云或企业内容平台的战略并购可以吸收一部分溢价。IPO
              更难从公开证据承销：公司需要经审计收入规模、毛利率、留存、客户集中度、安全姿态和优先权结构透明度。所以下一步关键是事实，不是故事。投资人需要 2023–2026 年 ARR 桥、NRR
              和毛利率、头部客户敞口、折扣与实施经济性、清算优先权，以及任何可信的二级市场标记。若这些项目失败——尤其是 ARR 低于 $50M、增长低于 20%，或上市可比公司低于 5x 而 Instabase 要价 20x
