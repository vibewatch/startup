            body: >-
              Instabase 是私营公司，因此财务章节先给出保留：已审阅公开来源没有提供审计财务报表、管理层 ARR 桥接表、确认收入、净收入留存、毛利率、现金余额或烧钱速度。可用的收入图景只能靠三角测算。GetLatka
              估算 2025 年收入 $50M、2024 年 $40.8M；Sacra 估算 2023 年 ARR 为 $46M；Growjo 估算年收入 $38.3M；Silicon Valley Journals 称
              $60M；Incfact 使用 $100M-$500M 的很宽统计区间。这些数字与一个中八位数收入的企业软件业务方向一致，但不足以精确承销估值。收入机制比收入数字更清楚：Instabase
              围绕文档包、抽取、校验、人工审核、监控、API、连接器和面向受监管买家的安全部署销售企业自动化。Rocket、AXA、USPTO、银行和公共部门引用提供了真实工作流价值证据，但没有披露实际定价或毛利。
