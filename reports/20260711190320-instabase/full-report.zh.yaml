      - number: '8.4'
        title: 情景区间与敏感性
        blocks:
          - type: paragraph
            body: >-
              情景测算刻意把公司质量和入场价格拆开。熊市情景假设 ARR 为 $40M、倍数 6.0x，得出约 $240M 股权价值，覆盖的世界是 ARR 被高估、增长放缓、上市倍数继续压缩，或客户把文档 AI
              当成商品化工具。基准情景用 $60M ARR 和 12.0x 倍数，约 $720M，给 Instabase 的 AI 工作流深度一定信用，但仍不足以覆盖当前 $1.24B 标记。牛市情景为 $80M
              ARR、20.0x，约 $1.6B，也是唯一能让 Series D 价格看起来可接受的视角。这个牛市情景需要证明增长在加速、留存高、毛利率质量好、产品差异化守得住，而不只是泛泛的 AI 采用。
