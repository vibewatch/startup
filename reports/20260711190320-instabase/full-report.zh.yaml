      - number: '8.3'
        title: 可比公司与收入倍数三角校验
        blocks:
          - type: paragraph
            body: >-
              可比公司组合提示谨慎。上市软件同业并不完全匹配 Instabase：UiPath 有自动化敞口，Appian 有低代码工作流敞口，Box 有内容管理敞口，而 Instabase 是私有且 AI
              原生。即便有这个限定，它们当前低个位数左右的市销率，仍构成真实的机会成本基准。Instabase 按估算 ARR 约 24.8x 定价，要求相对上市自动化和内容同业再多出数倍的私有 AI 溢价。Bessemer
              的 Cloud 100 研究给了多头叙事——AI 龙头能拿到异常高的估值——但 Hyperscience、ABBYY 等私有 IDP
              同业没有披露足够收入或估值数据，无法验证直接倍数。因此，可比表是带有明确限制的样本，不是完整的按市值重估。
