  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：不只是点状 IDP 方案
        blocks:
          - type: paragraph
            body: >-
              Instabase 竞争的是拥挤的文档自动化赛道，而不是狭窄 OCR 市场。直接同业包括 Hyperscience、Rossum、ABBYY、Ocrolus 和
              Docugami；更宽的买方选择还包括超大规模云厂商
              API、工作流自动化套件、内容云系统、维持人工运营现状，以及使用云基础模块自建的内部团队。最重要的尽调点是，不同替代方案会赢下不同任务。买方需要有当前分析师信号的公认企业 IDP 厂商时，Hyperscience
              和 Rossum 看起来最强；任务是云规模的商品化抽取时，Google、AWS 和 Microsoft 很危险；文档步骤只是更大流程自动化资产中的一个节点时，UiPath、Appian 和 Automation
              Anywhere 很危险。ABBYY 被纳入是因为它是必要既有厂商，但本轮抓取中其官方页面受到限流，因此表格刻意标注无支持的单元格，而不是凭记忆补齐。
