        - 索取每页 / 每工作流价格和人工审核经济性
      - - Rossum
        - 企业云平台
        - 公开页面强调演示和交易类平台；未留存标价
        - 可能在 AP / 发票工作流上低价切入或专业化
        - 索取发票页定价和 STP 承诺
      - - UiPath/Appian/Automation Anywhere
        - 打包的自动化套件模块
        - 官网强调平台能力；未留存标价
        - 可把 IDP 与既有自动化预算打包
        - 索取附加率、打包折扣和续约经济性
      - - Google Document AI
        - 云 API 按页计价
        - 抓取页面显示 Enterprise Document OCR 为每 1,000 页 $1.50
        - 为基础 OCR / 抽取设定低可见锚点
        - 比较 Instabase 每个已完成资料包的价值，而不是每页价值
      - - AWS Textract
        - 云 API 按页计价
        - Detect Document Text 示例：前 100 万页每页 $0.0015
        - 为 AWS 账户内的商品化抽取设定基准
        - 建模总工作流成本，纳入集成和异常处理
      - - Azure Document Intelligence
        - Cloud API / Foundry Tools 定价页
        - 有定价页；具体单位组合取决于模型层级和用量
        - Microsoft 体系内客户可先标准化到 Azure，再选专业方案
        - 向目标账户索取 Azure 替代方案报价
      - - Box Content Cloud
        - 内容云打包
        - 公开内容云页面和 IR 文件线索可用；未审阅到文档 AI 标价
        - 可把轻量文档 AI 吸收到既有内容平台里
        - 询问 Box AI 是替代还是向 Instabase 工作流供料
    notes: 定价比较并不完整：超大云厂商公开标价，但多数企业平台需要询价，实际折扣不公开。
