      - number: '8.2'
        title: 融资历史与降估值信号
        blocks:
          - type: paragraph
            body: >-
              估值轨迹是核心事实。Instabase 在 2019 年 Series B 跻身独角兽；据报道，2023 年 Series C 又把估值推到约 $2.0B。2025 年 1 月 Series D
              扭转了这条曲线：TechCrunch、Maginative 和 SiliconANGLE 的报道都指向 $1.24B 估值，较上一轮约低
              38%。公司仍拿到可观一级资本，但这一轮传递的信息是，投资者保护、市场纪律或增长证据，比保住表面估值更重要。对新投资人，这是负面信号：优先权结构、清算条款和二级市场标记，可能让普通股表面估值不如投后数字有信息量。也意味着任何承销模型都必须解释：一家从
              $2.0B 下调估值的公司，为什么仍应相对上市可比公司享有显著 AI 溢价。
