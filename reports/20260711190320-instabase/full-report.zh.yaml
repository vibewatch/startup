      - number: '2.4'
        title: 驱动因素、约束和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              增长逻辑建立在文档量上升、企业数字化转型、生成式 AI 降低模型训练摩擦，以及受监管工作流中速度和可审计性具有真实经济价值之上。约束同样重要。Gartner 明确警告，纯 LLM 的 IDP
              可能因可靠性、信任和成本问题难以规模化，功能扩张也会让买方看不清价值。金融机构和保险公司不能把 AI 文档系统当作不受监管的生产力工具；FINRA、CFPB、NAIC
              和保险模型公告来源都指向治理、报告、可解释性和消费者结果控制。切换成本也重要，因为文档处理器必须按文档类型调校、由人工验证、接入下游系统，并在 API 和模型版本变化时迁移。主要未解的尽调问题不是 IDP
              是否是真市场，而是在超大规模云厂商价格压力和实施工作之后，Instabase 能以有吸引力的毛利服务多少市场。只有拿到底层证据，才能把公开市场增长视为可捕获收入。
