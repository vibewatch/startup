              现有证据支持企业 ACV 潜力，但无法拼出完整 SaaS 单位经济模型。Sacra 公开预览估算 2023 年约有 45 家企业客户、ACV 约 $1.02M；BusinessWire
              称客户基数在上一轮后增长超过一倍，并提到金融服务、医疗、科技和政府牵引力。Rocket 每月 1.5M 份文档工作量和据报 25% 周转时间改善，解释了大客户为何可能为文档自动化付费；AXA 的 RFP /
              概念验证路径则显示典型企业销售动作。成本端证据更弱。官方产品材料强调安全 VPC 部署、可审计性、人工审核、任务队列、监控、API、SDK
              和连接器广度，这些能力有价值，但可能推高实施、支持、云和模型推理成本。公开超大规模云厂商 Document AI 定价是买方基准，也是竞争压力点；没有 Instabase 按交付模式拆分的毛利率，就无法判断 AI
