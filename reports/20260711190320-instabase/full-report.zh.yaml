  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              Series D 价格支持跟踪或继续研究的建议，而不是按披露标记直接买入。Instabase 仍是可信的企业 AI 文档自动化资产：它从 QIA 和现有顶级投资人处融到
              $100M，所在工作流类别确有企业痛点，AI 基础设施热潮也给私有龙头高于普通 SaaS 倍数交易的空间。估值问题在于，公开证据尚未证明支撑这份溢价所需的基本面。独立报道给出的投后估值约 $1.24B，第三方
              ARR 估算集中在 $46M–$50M 左右，且并非公司披露。这意味着约 24x–25x 的收入入场倍数，远高于上市自动化和内容管理同业。因此正确立场必须对价格敏感：如果入场价重置到基准情景区间，或管理层证明
              ARR、留存、毛利率和客户集中度质量明显更高，再继续尽调。
