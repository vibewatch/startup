        - 长文档 AI 专家
        - 官网称专利 Business Document Foundation Model 可在约 30 分钟内学会模式
        - 合同、MSA、SOW、BOL、保险表单和业务文档
        - 面向一线用户的文档智能体和长篇业务文档理解
        - 公开证明面较小；需验证企业级规模和受监管控制
      - - Box AI / Content Cloud
        - 内容云相邻市场
        - Box 公开 IR / 申报材料确认其上市公司基础设施；内容云页面强调 AI 内容工作流
        - 已在 Box 内治理内容的企业
        - 借内容管理、治理和协作分发
        - 文档留在内容云内时，威胁最集中
      - - Appian DocCenter
        - 低代码流程自动化套件
        - DocCenter 官网将 IDP 定位为业务流程原生能力
        - 受监管流程自动化客户
        - 端到端流程编排、生成式 AI、审计 / 控制姿态
        - 买方在选择 IDP 前已有 Appian 流程资产时，Appian 可能胜出
      - - UiPath IXP / Document Understanding
        - RPA 和业务自动化套件
        - 平台官网称 UiPath 是 Forrester 2026 年 Q2 Leader
        - RPA 使用重的企业和共享服务自动化
        - 编排、HITL 工作流、RPA 分发、流程挖掘相邻能力
        - 可把 IDP 打包进更宽的自动化平台预算
      - - Automation Anywhere Document Automation
        - 智能体式流程自动化套件
        - 官网将 IDP 定位为给 AI 智能体供数，用于推理和执行
        - 自动化 CoE 和流程自动化买方
        - NLP、计算机视觉、生成式 AI 和 ML 绑定智能体式流程
        - 靠自动化平台竞争，而不是靠同类最佳 IDP 深度
      - - Google Document AI
        - 云巨头文档 API
        - 官网和定价页发布处理器和按页计价类别
        - GCP 开发者和云优先的内部自建团队
        - 自定义抽取器 / 分类器 / 拆分器、生成式 AI、BigQuery 集成、透明定价
        - 可把基础抽取商品化；单独看，对完整受监管工作流的适配较弱
      - - AWS Textract
        - 云巨头文档 API
        - 官方定价页提供按页示例；产品页描述 ML 抽取
        - AWS 开发者、高量文档摄取、内部自动化团队
        - 原生 AWS 集成，抽取文本 / 手写 / 版式 / 表格 / 表单
        - 在 AWS 资产内把 OCR 和抽取商品化
      - - Azure Document Intelligence
        - 云巨头文档 API
        - 官网将服务放在 Foundry Tools 内；有定价页
        - Microsoft / Azure 企业和智能体式应用构建者
        - 抽取文本、表格、键值对和版式；借 Azure 生态分发
        - 可通过 Microsoft 采购和平台标准化切入
    notes: 根据章节简报和留存来源，部分列举重要具名替代方案；在访问受阻处，ABBYY / 评测单元格刻意保持有限。
