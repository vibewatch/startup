            body: >-
              反向情形不是 Instabase 没有产品，而是生成式 AI 和云分发正在削弱文档抽取的稀缺性。Forrester 将文档挖掘和分析市场描述为宽泛、碎片化且快速演变，Everest
              则称供应商正在把生成式和智能体式 AI 嵌入文档理解与编排。这意味着许多竞争者如今都能讲智能体文档故事。如果客户看重可审计的文档包级结果、受监管工作流设计和复杂跨文档业务规则，而不是低成本抽取，Instabase
              仍能守住位置。买方可以多归属时，护城河更弱：云 API 做
