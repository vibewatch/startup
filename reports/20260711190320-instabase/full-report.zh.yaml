      - number: '7.4'
        title: 监管、法律、隐私和安全风险
        blocks:
          - type: paragraph
            body: >-
              监管风险面很宽，因为 Instabase 销售给金融服务、公共部门和其他敏感工作流，而不只是消费者生产力场景。EU AI Act 的基于风险框架、NIST 的 AI 风险管理指南和 SEC 对 AI
              夸大宣传的执法，都指向实际义务：不要夸大 AI 能力，保留治理证据，测试准确率和稳健性，并确保面向客户的主张与已部署控制相符。Instabase
              的信任和隐私页面是有意义的缓解项，也是企业采购所必需的。它们不能消除风险，因为最高影响的失效模式都在私域：涉及敏感文档的数据泄露、审计失败、围绕模型输出的合同争议，或受监管流程中的客户事故。
