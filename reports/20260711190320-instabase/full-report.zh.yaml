              技术架构是分层企业文档流水线，而不是单一通用 LLM 提示词。公开文档描述了来自上游系统的摄取、文档包构建、类别和跨类别字段、模型选择、提示词、自定义函数、部署、下游集成和监控。LLM 层被 AI Runtime
              抽象：版本包含
              LLM、提示词模板和处理流水线，并提供企业控制来管理更新时间。这很有用，因为模型升级可能改变输出；但也带来尽调依赖：投资人需要检查租户层面使用哪些模型提供商、有哪些回退机制，以及客户合同是否能让受监管工作流免受第三方模型政策、价格、故障或准确率变化影响。公开
              GitHub 仓库显示有 OpenAPI 规范和部署工具，足以确认开发者接口，但不足以推断广泛开源采用。
