      - number: '7.2'
        title: Financial and valuation risk
        blocks:
          - type: paragraph
            body: >-
              Financial risk is the clearest adverse signal because the public narrative contains a reset without enough
              operating disclosure to calibrate whether the new mark is attractive. A roughly 38% cut from a $2 billion
              headline valuation to about $1.2 billion could be rational if ARR is compounding quickly, but the only
              current ARR figure located is a low-reputation third-party estimate near $50 million, which implies about
              24 times ARR. That is still a high software multiple for a private company facing incumbent cloud vendors
              and enterprise procurement friction. The missing evidence is more important than the point estimate: burn,
              runway after the Series D, gross margin, net revenue retention, annual contract value, and top-customer
              share would determine whether the round is a reset to fundamentals or simply bridge capital.
