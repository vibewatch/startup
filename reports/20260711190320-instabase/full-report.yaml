      - number: '3.3'
        title: Moat durability and adverse threat analysis
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that Instabase lacks a product; it is that generative AI and cloud distribution
              are eroding the scarcity of document extraction. Forrester describes the document-mining and analytics
              market as broad, fragmented, and rapidly evolving, and Everest says providers are embedding generative and
              agentic AI into document understanding and orchestration. That means many competitors can now tell an
              agentic-document story. Instabase can still defend a position if customers value auditable packet-level
              outcomes, regulated workflow design, and complex cross-document business rules more than low-cost
              extraction. The moat is weaker where buyers can multi-home: cloud APIs for OCR, a workflow suite for
              routing, and a narrow specialist for a vertical document type. Diligence should therefore test switching
              costs, implementation depth, security approvals, model governance, and whether deployments become systems
              of record or only extraction utilities.
