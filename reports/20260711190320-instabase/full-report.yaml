  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: IDP is not the whole automation stack'
        blocks:
          - type: paragraph
            body: >-
              Instabase should be underwritten against a disciplined document-automation market, not the entire
              enterprise AI or hyperautomation budget. The included spend is intelligent document processing and
              document-AI software that classifies documents, extracts fields, validates exceptions, and pushes
              structured data into downstream workflows. That boundary includes workflow integration and
              human-in-the-loop validation when they are required to make unstructured or semi-structured documents
              usable. It excludes generic content storage, broad RPA seats, low-code app development, and cloud AI
              consumption that does not solve a document-processing job. The adjacent market is Document AI, where
              MarketsandMarkets includes IDP plus document workflow automation, generative-AI document generation, ECM,
              and governance tools. Status quo matters as much as named competitors: manual data entry, rule-based OCR
              templates, and internal workflow teams can delay vendor replacement until accuracy, compliance, and ROI
              are clear.
