  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Instabase's risk stack is high but not existential on public evidence. The most severe items are not a
              single lawsuit or outage; they are the interaction of a down-round valuation reset, opaque private
              financials, hyperscaler commoditization, third-party model dependency, and use in regulated document-heavy
              workflows where accuracy and auditability matter. The 2025 Series D supplied $100 million of fresh
              capital, but at roughly a $1.2 billion to $1.24 billion post-money valuation after a 2023 mark around $2
              billion, so the financing solved runway while confirming pricing pressure. Public sources do not disclose
              burn, gross margin, NRR or customer concentration. The residual investment implication is therefore
              discipline, not avoidance: require private financial proof and regulated-workflow controls before
              underwriting a premium multiple.
            claimRefs:
