            body: >-
              The public record confirms capital inflow, not capital adequacy. Form D filings verify early financing
              amounts, the Series D press release confirms $100M of new capital, and databases converge on a large
              lifetime capital base even though their totals conflict. What is absent is the part needed for forward
              underwriting: cash at close, current cash, debt, monthly burn, working-capital swings, customer prepayment
              terms, cloud commitments, and the 2026 operating plan. A simple sensitivity illustrates why the gap
              matters. If the full $100M Series D were available at close, gross runway would be about 20 months at $5M
              monthly burn, 12.5 months at $8M, and 10 months at $10M before revenue receipts and working-capital
              effects. That range is illustrative only; it should not be treated as a forecast. Headcount estimates
              range from 165 to 274 in 2025-2026 data sources, another sign that burn proxies are too noisy for a
              stand-alone conclusion.
