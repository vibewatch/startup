            body: >-
              The technical architecture is a layered enterprise document pipeline rather than a single generic LLM
              prompt. Public docs describe ingestion from upstream systems, packet construction, class and cross-class
              fields, model choices, prompts, custom functions, deployments, downstream integrations, and monitoring.
              The LLM layer is abstracted behind AI Runtime: versions include the LLM, prompt templates, and processing
              pipelines, with enterprise controls for update timing. This is useful because model upgrades can change
              outputs, but it also creates a diligence dependency: investors need to inspect which tenant-level model
              providers are used, what fallbacks exist, and whether customer contracts insulate regulated workflows from
              third-party model policy, price, outage, or accuracy changes. Public GitHub repositories show an OpenAPI
              spec and deployment tooling, enough to confirm a developer surface but not enough to infer broad
