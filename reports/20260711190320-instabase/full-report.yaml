            body: >-
              Organizational risk centers on concentration and transition. Founder-CEO Anant Bhardwaj remains the
              strategic face of the business, while public leadership data shows an organization still building senior
              go-to-market capacity. Headcount and employee counts are third-party estimates, but the direction of
              contraction from late-2024 levels to later 2025 or 2026 estimates should be verified because execution
              risk rises when a company must sell complex enterprise AI after a valuation reset. Customer concentration
              is likewise unresolved. Rocket Mortgage and USPTO proof is valuable, but logos do not reveal top-account
              revenue share, renewal durability, model-provider dependence, or how much deployment value is attributable
