  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: more than point-solution IDP'
        blocks:
          - type: paragraph
            body: >-
              Instabase competes in a crowded document-automation arena rather than in a narrow OCR market. The direct
              peer set includes Hyperscience, Rossum, ABBYY, Ocrolus, and Docugami; the broader buyer-choice set also
              includes hyperscaler APIs, workflow automation suites, content-cloud systems, status quo manual
              operations, and internal build teams using cloud primitives. The most important diligence point is that
              different alternatives win for different jobs. Hyperscience and Rossum look strongest when a buyer wants
              recognized enterprise IDP vendors with current analyst signals; Google, AWS, and Microsoft are dangerous
              where the job is commodity extraction at cloud scale; UiPath, Appian, and Automation Anywhere are
              dangerous when the document step is only one node in a broader process-automation estate. ABBYY is
              included as a required incumbent, but its official pages were rate-limited in this run, so the table
              deliberately marks unsupported cells rather than filling them from memory.
