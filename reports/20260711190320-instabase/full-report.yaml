      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              Instabase is best read as a private applied-AI infrastructure company for document-heavy enterprise
              operations, not as a horizontal chatbot vendor. The company site says Instabase transforms unstructured
              document packets into reliable, auditable data through AI Hub, packet-aware AI agents, multi-model
              optimization, and deep document understanding. Its company page and Wikipedia profile identify San
              Francisco as headquarters and list a global operating footprint across San Francisco, New York, London,
              and Bangalore. The founding record is consistent that Anant Bhardwaj founded the company in 2015 after
              leaving MIT doctoral work; official company materials still put him at the center as founder and CEO. The
              commercial model is enterprise workflow automation for regulated or document-intensive buyers: financial
              services, insurance, public sector, healthcare, technology, and large enterprises using customer- or
              partner-led implementations rather than a disclosed self-serve SaaS revenue schedule.
