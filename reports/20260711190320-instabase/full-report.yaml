      - number: '2.4'
        title: Drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The growth case rests on rising document volumes, enterprise digital transformation, the use of generative
              AI to reduce model-training friction, and regulated workflows where speed and auditability have real
              economic value. The constraints are equally material. Gartner explicitly warns that LLM-only IDP can fail
              to scale because of reliability, trust, and cost, and that feature expansion can confuse buyers about
              value. Financial institutions and insurers cannot treat AI document systems as unregulated productivity
              tools; FINRA, CFPB, NAIC, and insurance-model-bulletin sources all point to governance, reporting,
              explainability, and consumer-outcome controls. Switching costs also matter because document processors
              must be tuned to document types, validated by humans, integrated into downstream systems, and migrated as
              APIs and model versions change. The main unsolved diligence issue is not whether IDP is a real market; it
              is how much of the market is serviceable by Instabase at attractive margins after hyperscaler price
              pressure and implementation work. That bottom-up evidence is required before treating the published market
              growth as capturable revenue.
