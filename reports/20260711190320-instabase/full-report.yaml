        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is mixed. Instabase appears to have credible enterprise demand, blue-chip customer
              references, and enough venture backing to keep investing in AI Hub. However, the chapter cannot underwrite
              the business as a clean, efficient SaaS compounder from public evidence alone. Revenue and headcount are
              third-party estimates; total funding ranges from about $277M to $322M depending on source; the latest
              round was a valuation reset; and the implied revenue multiple remains high. The main diligence ask is
              therefore not another press citation but a private data room: audited or board-approved financials, ARR by
              cohort, recognized revenue versus ARR, customer concentration, NRR, logo retention, gross margin by
              deployment mode, professional-services mix, LLM/cloud cost, CAC payback, sales-cycle distribution, cash
              balance, debt, burn, and runway. Until those are provided, the appropriate stance is track/research-more
