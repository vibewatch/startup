            body: >-
              The milestone record indicates a company that repeatedly repositions around the same core substrate:
              unstructured enterprise content. Early milestones center on founding, venture financing, and the
              Cloudstitch acquisition; the 2019 Series B moved Instabase into unicorn status around enterprise
              automation; the 2023 AI Hub launch recast the platform around generative AI; and 2024-2025 releases and
