  - CV042
- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - ARR bridge
    - Quarterly ARR from 2023 through 2026 with new/expansion/churn split
    - Determines whether 24x-25x is inflated or justified.
    - Obtain management data room and reconcile to billings.
  - - Retention and concentration
    - NRR, gross retention, top-10 customer ARR, renewal cohorts
    - Separates sticky workflow software from services-heavy deployments.
    - Request cohort files and customer references.
  - - Gross margin and implementation mix
    - Software gross margin, services margin, deployment effort
    - Low margin would make public SaaS multiples too generous.
    - Review audited or board financials.
  - - Cap table and preferences
    - Liquidation preference, ratchets, option pool, debt, secondary terms
    - Common-equity economics may differ from headline post-money.
    - Review legal financing docs.
  - - Secondary marks
    - Forge, Caplight, broker quotes, or investor marks after Series D
    - Tests whether the market accepts the mark.
    - Ask investors and brokers for executable indications.
  - - Exit buyer evidence
    - Strategic interest from automation, cloud, or enterprise-content buyers
    - Validates path to premium exit before IPO readiness.
    - Run buyer-reference calls and precedent M&A review.
  notes: Diligence asks focus on facts that would move valuation stance rather than general product diligence.
