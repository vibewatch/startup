- id: multiple-comps-and-private-peer-context
  title: Comps and revenue-multiple triangulation
  body: 'The comp set argues for caution. Public software peers do not perfectly match Instabase: UiPath has automation exposure, Appian has low-code workflow exposure, and Box has content-management exposure, while Instabase is private and AI-native. Even with that caveat, their current price-to-sales ratios around the low-single digits form a real opportunity-cost benchmark. Instabase at about 24.8x estimated ARR requires a private AI premium of several turns beyond public automation and content peers. Bessemer''s Cloud 100 work gives the bull case—AI leaders can attract unusually high valuations—but private IDP peers such as Hyperscience and ABBYY do not provide enough disclosed revenue or valuation data to validate a direct multiple. The comparable table is therefore a sample with explicit limitations, not an exhaustive mark-to-market.'
