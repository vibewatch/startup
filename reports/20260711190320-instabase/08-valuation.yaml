- id: round-history-and-down-round
  title: Round history and down-round signal
  body: 'The valuation history is the central fact pattern. Instabase reached unicorn status in the 2019 Series B, then reportedly doubled its mark to about $2.0 billion with the 2023 Series C. The January 2025 Series D reversed that trajectory: coverage from TechCrunch, Maginative, and SiliconANGLE all points to a $1.24 billion valuation, approximately 38% below the prior mark. The company still secured substantial primary capital, but the round communicates that investor protections, market discipline, or growth evidence mattered more than preserving headline valuation. That is an adverse signal for a new investor because preference stack, liquidation terms, and secondary marks can make the common-equity headline less informative than the post-money number. It also means any underwriting case must explain why a company marked down from $2.0 billion should still command a large AI premium over public comps.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV009
  - CV010
  - CV011
  - CV043
  tableRefs:
  - TV002
