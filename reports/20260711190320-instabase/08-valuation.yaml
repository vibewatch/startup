  - type: private-evidence-only
    severity: material
    topic: arr-retention
    missingEvidence: Audited ARR bridge, NRR, gross retention, and cohort churn from 2023 through 2026.
    whyItMatters: The implied revenue multiple changes materially if the $50M ARR estimate is stale or incomplete.
    diligencePath: Request management data room, board package, and customer cohort schedules.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV031
    - QV032
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Series D liquidation preference, participation, ratchets, option-pool expansion, debt, and secondary terms.
    whyItMatters: Headline post-money valuation can overstate common-equity value when preferences are heavy.
    diligencePath: Review financing documents and investor side letters.
    relatedQuestionRefs:
    - QV012
    - QV025
    - QV040
    relatedTableRefs:
    - TV006
    - TV007
