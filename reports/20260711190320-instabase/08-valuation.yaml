- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR underperformance
    - Verified ARR below $50M or growth below 20%
    - Implied multiple becomes even higher than public evidence suggests.
    - Pass unless price resets sharply.
  - - Public comp compression
    - Relevant public comps stay below 5x revenue
    - Base-case exit multiple cannot support Series D entry.
    - Reprice to base-case range or wait.
  - - Preference overhang
    - Series D includes heavy liquidation preferences or ratchets
    - Headline post-money overstates common-equity value.
    - Require terms adjustment or walk away.
  - - Weak secondary marks
    - Credible secondary data materially below Series D price
    - Private market rejects the headline mark.
    - Use secondary mark as ceiling.
  - - Customer concentration
    - Top-three accounts drive outsized ARR
    - Revenue quality and retention risk rise.
    - Demand concentration discount.
  - - Commodity AI pressure
    - Hyperscalers or RPA suites match core workflows
    - Premium multiple and exit scarcity erode.
    - Reduce bull multiple or pass.
  notes: Trigger thresholds are investment-policy thresholds derived from public valuation evidence and missing private operating data.
