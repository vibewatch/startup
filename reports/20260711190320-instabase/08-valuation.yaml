- id: TV003
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence supporting it
  - What would change the view
  rows:
  - - AI document automation can deserve a premium
    - Bessemer says AI Cloud 100 leaders are commanding higher valuations.
    - Proof of durable ARR growth, NRR, and workflow moat would move stance toward fair.
  - - Series D validates sponsor quality
    - QIA led and existing blue-chip venture investors participated.
    - Unfavorable liquidation preferences or weak insider participation would dilute this signal.
  - - Headline price is stretched
    - Reported 24x-25x estimated revenue multiple exceeds public peers by a wide margin.
    - Audited ARR materially above $60M or growth above 40% would reduce the stretch.
  - - Down round is an adverse signal
    - $1.24B is about 38% below the reported $2.0B Series C mark.
    - Clean terms and strong growth acceleration would make the reset less concerning.
  - - Public comps argue for discipline
    - UiPath, Appian, and Box trade near low-single-digit P/S ratios.
    - A sustained public AI software multiple expansion could raise the base-case multiple.
  - - Private peer opacity limits precision
    - Hyperscience and ABBYY do not disclose current revenue multiples in fetched sources.
    - Verified private secondary marks or recent IDP M&A multiples would improve confidence.
  notes: Arguments are paired with explicit view-changing evidence so the recommendation remains falsifiable.
