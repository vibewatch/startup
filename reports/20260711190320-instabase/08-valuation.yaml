company:
  name: Instabase
chapter:
  number: 8
  title: Valuation
  summary: Instabase's January 2025 Series D validates sponsor demand but reset the valuation to about $1.24B, roughly 38% below the 2023 mark. On a low-confidence ~$50M ARR estimate, the round implies about 24x-25x revenue, so the valuation stance is stretched unless private diligence proves bull-case growth, retention, margins, and clean terms.
sections:
- id: recommendation-and-stance
  title: Recommendation and valuation stance
  body: 'The Series D price supports a track or research-more recommendation, not a clean buy at the reported mark. Instabase remains a credible enterprise AI document-automation asset: it raised $100 million from QIA and existing top-tier investors, it sits in a workflow category with real enterprise pain, and AI infrastructure enthusiasm gives private leaders room to trade above ordinary SaaS multiples. The valuation problem is that public evidence does not yet prove the fundamentals needed for that premium. Independent coverage reported a roughly $1.24 billion post-money valuation, while third-party ARR estimates cluster around $46 million to $50 million and are not company disclosed. That creates a roughly 24x to 25x revenue entry multiple, far above public automation and content-management peers. The correct stance is therefore price-sensitive: continue diligence if the entry price resets toward the base-case range or if management proves materially higher ARR, retention, margin, and
    customer concentration quality.'
  claimRefs:
