- id: exit-paths-diligence-and-kill-triggers
  title: Exit paths, diligence asks, and kill triggers
  body: 'Exit readiness is the reason to keep the call at track. A strategic M&A exit to an automation, cloud, or enterprise-content platform could absorb a premium if Instabase proves that its packet-aware AI agents, document-understanding workflows, and enterprise deployments create a durable moat. An IPO is harder to underwrite from public evidence: the company would need audited revenue scale, gross margin, retention, customer concentration, security posture, and preference-stack transparency. The key next steps are therefore factual rather than narrative. Investors need an ARR bridge from 2023 through 2026, NRR and gross margin, top-customer exposure, discounting and implementation economics, liquidation preferences, and any credible secondary marks. Failure on those items—especially sub-$50 million ARR, growth below 20%, or public comps below 5x while Instabase asks 20x-plus—should trigger a pass or major price reset.'
