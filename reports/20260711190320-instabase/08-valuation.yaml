    topic: comparable-valuation-table
    missingEvidence: Current revenue multiples or transaction marks for private IDP peers including Hyperscience, ABBYY, Rossum, Ocrolus, and Docugami.
    whyItMatters: Public comps are imperfect and private IDP peers would be better valuation anchors if disclosed.
    diligencePath: Use PitchBook/Caplight/Forge/Nasdaq Private Market data room access and banker calls to add current private marks.
