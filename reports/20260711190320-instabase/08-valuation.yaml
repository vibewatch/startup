- id: scenario-range-and-sensitivity
  title: Scenario range and sensitivity
  body: The scenario work deliberately separates company quality from entry price. A bear case of $40 million ARR at a 6.0x multiple produces about $240 million of equity value, capturing a world in which ARR is overstated, growth slows, public multiples remain compressed, or customers treat document AI as a commodity. The base case uses $60 million ARR and a 12.0x multiple for roughly $720 million, giving Instabase credit for AI workflow depth but not enough to clear the current $1.24 billion mark. The bull case, $80 million ARR at 20.0x, reaches roughly $1.6 billion and is the only lens that makes the Series D price look acceptable. That bull case requires proof of accelerating growth, high retention, margin quality, and defensible product differentiation, not just generic AI adoption.
  claimRefs:
  - CV028
  - CV029
