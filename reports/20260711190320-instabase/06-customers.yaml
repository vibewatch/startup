  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention gap
    missingEvidence: Customer-level NRR, GRR, churn, renewal term, active customer count and expansion ARR by cohort.
    whyItMatters: Retention determines whether impressive workflow wins compound into durable recurring revenue.
    diligencePath: Request cohort retention exports and reconcile to invoices for the top 20 customers.
    relatedQuestionRefs:
    - QU008
    - QU021
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: Complete customer roster with production status, ARR contribution, region, use case and referenceability.
    whyItMatters: The public named-customer table is a sample and may overstate concentration or understate breadth.
    diligencePath: Ask management for a full customer census and run reference calls across named and randomly selected accounts.
    relatedQuestionRefs:
    - QU002
    - QU009
    - QU017
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: public-sector procurement
    missingEvidence: Direct contract award, task order, production procurement or renewal records for USPTO and other agencies.
    whyItMatters: The USPTO pilot is credible but does not prove recurring public-sector revenue.
    diligencePath: Search SAM.gov/USASpending with company legal names and request agency contract identifiers from management.
    relatedQuestionRefs:
    - QU020
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: review evidence
    missingEvidence: Large-sample verified user reviews from G2, Gartner Peer Insights, TrustRadius or Capterra with reviewer roles and dates.
    whyItMatters: Sparse reviews limit triangulation of satisfaction, usability and buyer criticism.
    diligencePath: Use management-provided customer references and private review exports to supplement public review sites.
    relatedQuestionRefs:
    - QU015
    - QU022
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration risk
    missingEvidence: Top-customer ARR share, renewal schedule, industry concentration and partner-sourced revenue share.
    whyItMatters: A few large banks or insurers could dominate revenue even if the logo set appears diverse.
    diligencePath: Request anonymized ARR concentration tables and test against contracts and invoices.
    relatedQuestionRefs:
    - QU017
    - QU021
    relatedTableRefs:
    - TU006
