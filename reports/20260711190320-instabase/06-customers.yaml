schemaVersion: report-v2
artifact: customers
slug: instabase
runDate: '2026-07-11'
company:
  name: Instabase
chapter:
  number: 6
  title: Customers
  summary: Instabase has credible enterprise customer proof in banks, insurance, public sector and document-heavy operations, but the public record is a selective sample. Named cases show workflow outcomes, while retention, customer count and concentration remain undisclosed diligence gaps.
sections:
- id: segment-map
  title: 'Customer base: enterprise document-heavy buyers, with financial services still the center of gravity'
  body: 'Instabase’s public customer proof points to an enterprise GTM rather than a broad SMB motion. The company names financial services, insurance, public sector, healthcare and other document-heavy operations as target segments, and the visible logos cluster around banks, insurers, mortgage, government, automotive finance operations and large enterprise back offices. The strongest buyer narrative is operational: underwriters, loan officers, analytics teams and operations leaders need to ingest complex, unstructured document packets and move structured data into downstream decisioning workflows. That supports a credible wedge into mission-critical processes, but the public base is not transparent enough to measure customer count, revenue mix or segment-level retention. The chapter therefore treats the customer roster as a reference sample, not a complete census, and separates high-quality named cases from anonymous or logo-only evidence.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU021
  - CU022
  - CU037
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof
  title: Named customers show real workflow adoption, but public proof quality varies by case
  body: The best references are customer stories with named organizations, workflow details and measurable operational outcomes. Rocket Mortgage, İşbank, USPTO, AXA UK, Sonic Automotive and NatWest each anchor a different use case, ranging from mortgage application packets and money orders to patent documents, broker submissions, invoices and financial-health research. However, deployment maturity is uneven. Rocket Mortgage and İşbank provide the clearest numeric outcomes; AXA describes a phased rollout after RFP and proof of concept; USPTO is explicitly a completed pilot; Sonic describes selection and expected benefits; NatWest is a research collaboration with transaction-data extraction, not disclosed production retention. That mix is sufficient to prove market pull in enterprise workflows, but insufficient to underwrite recurring expansion without customer references, contracts and renewal data.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU010
  - CU011
  - CU012
  - CU014
  - CU016
  - CU017
  - CU018
  - CU019
  - CU035
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
- id: use-cases
  title: Use cases cluster around data extraction, validation and decision acceleration
  body: 'The repeatable pattern across evidence is not generic AI adoption; it is the automation of messy inbound document packets. Financial-services cases emphasize mortgage, KYC, commercial lending, client onboarding and money-order processing. Insurance cases emphasize broker submissions, underwriting, claims and policy administration. Public-sector and enterprise cases emphasize patent documents, invoices and research datasets. These are attractive because the workflows are high volume, high error-cost and costly to staff manually. They also create implementation friction: enterprise customers must map documents, train or configure workflows, integrate into core systems and validate accuracy before moving beyond proof of concept. Instabase’s customer journey therefore looks like a narrow operational wedge first, followed by adjacent document types only after accuracy and business-case proof are established.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU008
  - CU018
  - CU020
  - CU034
  - CU035
  - CU036
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: retention-and-reviews
  title: Retention and satisfaction remain the main evidence gaps
  body: 'No reviewed public source discloses Instabase NRR, GRR, churn, renewal term, cohort retention or top-customer concentration. Review-site evidence is also too thin to substitute for customer references: Software Finder showed only two verified reviews; TrustRadius and PeerSpot fetched as directory-style summaries; G2, Gartner and Capterra were blocked or sparse in the fetch trail. The few visible review comments are broadly positive but still include buyer-relevant cautions about price, navigation difficulty, integration effort and vendor dependency. This creates a diligence asymmetry: the use-case proof is tangible, but the durability of the revenue base remains private. Before investment, the reference program should ask whether named logos expanded across document types, whether users renewed after implementation, and whether any major accounts dominate revenue.'
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU038
  - CU040
  - CU041
  - CU042
  tableRefs:
  - TU005
  figureRefs:
  - FU004
- id: gtm-and-expansion
  title: GTM is enterprise-led and increasingly channel-assisted under a new CRO
  body: Instabase’s GTM evidence points to direct enterprise selling supported by alliances, systems integrators and implementation partners. The official partner page describes joint motions for co-selling, service delivery, reselling and referrals, while DefineX and Skan show geographic and workflow-expansion partnerships. Sumita Sharma’s June 2025 CRO appointment is directly relevant to this chapter because the public release says she will lead sales, channel partnerships and revenue operations after experience at Palo Alto Networks. That could professionalize account expansion and reference creation, but the effect is not yet observable in public metrics. The diligence ask is to test whether the partner channel accelerates qualified pipeline and implementation capacity, or merely broadens marketing reach without improving retention visibility.
  claimRefs:
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
