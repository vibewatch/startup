    - Request realized ACV, page volume, and services mix
  - - Hyperscience
    - Enterprise platform / sales-led
    - Forrester report landing page, no retained list price
    - Competes on analyst-recognized enterprise value, not commodity list price
    - Request price per page/workflow and human review economics
  - - Rossum
    - Enterprise cloud platform
    - Public pages emphasize demo and transactional platform, no list price retained
    - May undercut or specialize on AP/invoice workflows
    - Request invoice-page pricing and STP commitments
  - - UiPath/Appian/Automation Anywhere
    - Bundled automation-suite modules
    - Official pages emphasize platform capabilities; no list prices retained
    - Can bundle IDP with existing automation budgets
    - Request attach-rate, bundle discounts, and renewal economics
  - - Google Document AI
    - Cloud API page-based pricing
    - Enterprise Document OCR shown at $1.50 per 1,000 pages on fetched page
    - Sets low visible anchor for basic OCR/extraction
    - Compare Instabase value per completed packet, not page
  - - AWS Textract
    - Cloud API page-based pricing
    - Detect Document Text example at $0.0015 per page for first one million pages
    - Sets commodity extraction benchmark inside AWS accounts
    - Model total workflow cost including integration and exceptions
  - - Azure Document Intelligence
    - Cloud API / Foundry Tools pricing page
    - Pricing page available; exact unit mix depends on model tier and usage
    - Microsoft estate can standardize on Azure before specialist selection
    - Request Azure alternative quote in target accounts
  - - Box Content Cloud
    - Content-cloud packaging
    - Public content-cloud page; IR filing surface available, no document-AI list price reviewed
    - Can absorb lightweight document AI inside existing content platform
    - Ask whether Box AI replaces or feeds Instabase workflows
