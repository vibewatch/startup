- id: capability-and-pricing
  title: Capability and pricing comparison
  body: 'The capability split is clearest between document-understanding depth and distribution power. Instabase''s public differentiation is packet-aware reasoning, cross-document validation, and multi-model optimization. Hyperscience counters with enterprise back-office positioning, analyst recognition, and compliance-oriented infrastructure. Rossum is more transactional and operational, reporting customer proof around invoices and straight-through processing. The automation suites compete through orchestration: documents flow into approvals, ERP writes, RPA queues, and business decisions. Hyperscalers compete through availability and price transparency. Google, AWS, and Azure all expose document services through official cloud pages, and Google and AWS provide concrete per-page pricing examples. That price transparency pressures standalone vendors even if it does not solve the most complex, regulated document packets. Review sites were partially blocked, so review-depth scoring should
    be treated as an evidence gap rather than a hidden support point.'
  claimRefs:
  - CP020
  - CP022
  - CP024
  - CP025
  - CP030
  - CP031
  - CP040
  - CP041
  - CP042
