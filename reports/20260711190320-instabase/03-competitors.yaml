- id: diligence-verdict
  title: Competitive diligence verdict
  body: Instabase's competitive posture is investable only if the target account values deep document packets, auditability, and workflow outcomes enough to avoid a lowest-cost API choice. The best direct threats are Hyperscience and Rossum because they pair current product stories with analyst or customer proof. The best distribution threats are UiPath, Appian, Automation Anywhere, Google, AWS, Microsoft, and Box, because each can enter through an existing enterprise platform relationship. The highest-priority diligence asks are concrete win/loss data versus Hyperscience and UiPath, realized pricing versus Google and AWS alternatives, deployment stickiness by use case, and proof that Instabase remains the control layer after extraction rather than being replaced by a workflow or cloud platform. Until those proofs are private-diligenced, the competitive moat should be rated moderate, not strong. This conclusion is deliberately conservative because public evidence over-represents vendor messaging
    and under-represents renewal behavior. A strong-moat upgrade would require account-level proof that customers keep Instabase as the system of action after procurement teams compare hyperscaler pricing, automation-suite bundles, and specialist tools for the same document families. It should also test whether procurement teams view Instabase as a strategic automation platform or as a replaceable extraction layer.
