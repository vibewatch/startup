- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale/funding or public position
  - Target segment
  - Differentiation / strengths
  - Limitations / diligence flags
  rows:
  - - Instabase
    - Agentic document automation platform
    - Private, venture-backed; public page emphasizes verifiable intelligence rather than scale metrics
    - Large enterprises with complex packets in FSI, insurance, government, and regulated workflows
    - Packet-aware AI agents, multi-model optimization, deep document understanding
    - Must prove premium value versus cloud extraction and automation-suite distribution
  - - Hyperscience
    - Direct IDP / back-office AI peer
    - Official pages cite six tier-one analyst recognitions and Forrester Leader / Customer Favorite status
    - Regulated back-office operations, lending, insurance, public sector
    - Enterprise AI infrastructure, compliance posture, back-office workflow depth
    - Strongest direct RFP threat; funding/ARR not fully supportable from retained pages
  - - Rossum
    - Direct IDP / transactional paperwork specialist
    - Official page cites Everest Group 2026 Leader recognition; customer page cites invoice throughput examples
    - AP, shared services, transactional documents, ERP-connected workflows
    - AI agents for read/capture/validate/approve/write-to-ERP flow; customer proof snippets
    - May be narrower than Instabase for heterogeneous packets, but strong in invoices
  - - ABBYY
    - Incumbent OCR/IDP vendor
    - Official ABBYY pages were rate-limited during fetch
    - General enterprise OCR and IDP incumbent per required competitor set
    - Known incumbent requiring follow-up
    - Cells intentionally unsupported pending direct source access
  - - Ocrolus
    - Vertical specialist
    - Official page positions platform for lenders and underwriting
    - Business lending, mortgage, fintech credit workflows
    - Cash-flow and income analytics, bank statements, pay stubs and tax forms
    - Narrower vertical scope; less evidence here for broad enterprise packets
  - - Docugami
    - Long-form document AI specialist
    - Official page claims patented Business Document Foundation Model learns patterns in about 30 minutes
    - Contracts, MSAs, SOWs, BOLs, insurance forms and business documents
    - Frontline-user document agents and long-form business-document understanding
    - Smaller public proof surface; verify enterprise scale and regulated controls
  - - Box AI / Content Cloud
    - Content-cloud adjacency
    - Public Box IR/filing surface confirms public-company infrastructure; content-cloud page emphasizes AI content workflow
    - Enterprises already governing content in Box
    - Distribution through content management, governance, and collaboration
    - Threat concentrated where documents stay inside content cloud
  - - Appian DocCenter
    - Low-code process automation suite
    - Official DocCenter page positions IDP as native to business process
    - Regulated process automation customers
    - End-to-end process orchestration, generative AI, audit/control posture
    - May win when buyer has Appian process estate before IDP selection
  - - UiPath IXP / Document Understanding
    - RPA and business automation suite
    - Official platform page says UiPath was a Forrester Q2 2026 Leader
    - RPA-heavy enterprises and shared services automation
    - Orchestration, HITL workflows, RPA distribution, process mining adjacency
    - Can bundle IDP into broader automation platform budgets
  - - Automation Anywhere Document Automation
    - Agentic process automation suite
    - Official page positions IDP feeding AI agents for reasoning and action
    - Automation CoE and process automation buyers
    - NLP, computer vision, generative AI and ML tied to agentic processes
    - Competes through automation platform rather than best-of-breed IDP depth
  - - Google Document AI
    - Hyperscaler document API
    - Official page and pricing page publish processors and per-page pricing categories
    - GCP developers and cloud-first internal build teams
    - Custom extractor/classifier/splitter, generative AI, BigQuery integration, transparent pricing
    - Can commoditize basic extraction; less tailored to full regulated workflow by itself
  - - AWS Textract
    - Hyperscaler document API
    - Official pricing page provides per-page examples; product page describes ML extraction
    - AWS developers, high-volume document ingestion, internal automation teams
    - Native AWS integration, text/handwriting/layout/table/form extraction
    - Commoditizes OCR and extraction inside AWS estates
  - - Azure Document Intelligence
    - Hyperscaler document API
    - Official page places service inside Foundry Tools; pricing page available
    - Microsoft/Azure enterprises and agentic app builders
    - Extracts text, tables, key-value pairs and layout; Azure ecosystem distribution
    - Can enter through Microsoft procurement and platform standardization
