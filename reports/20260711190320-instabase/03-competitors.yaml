- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Packet-aware, auditable workflow depth
    - Hyperscalers make extraction cheap and available
    - High
    - Basic OCR and entity extraction no longer differentiate
    - Measure win rates where customer already has GCP/AWS/Azure document services
  - - Agentic automation positioning
    - GenAI makes agent language ubiquitous across Rossum, Docugami, Appian, Azure, Google and Automation Anywhere
    - High
    - Messaging differentiation compresses quickly
    - Require customer proof of materially better accuracy, review time, and audit results
  - - Regulated enterprise trust
    - Hyperscience and Appian also emphasize compliance, governance, or auditability
    - Medium-high
    - Regulated buyers may prefer recognized incumbents or existing workflow platforms
    - Review security approvals, FedRAMP/industry certifications, and procurement blockers
  - - Workflow stickiness
    - UiPath/Appian/Automation Anywhere own downstream process layers
    - Medium-high
    - Instabase may be reduced to an extraction component
    - Test whether Instabase controls decisions or only exports fields
  - - Vertical workflow depth
    - Ocrolus and Docugami specialize in lending and long-form business documents
    - Medium
    - Specialists may win focused workflows with faster setup
    - Segment win/loss by document type and vertical
  - - Review reputation
    - G2 and Gartner pages were blocked in this run
    - Medium
    - Cannot verify user sentiment advantage publicly
    - Use customer calls and subscribed review access
  - - Pricing power
    - Cloud price anchors and enterprise bundle discounts pressure standalone ACV
    - High
    - Gross retention can hide price compression until renewal
    - Request cohort-level net retention, discounting, and competitive displacement data
  notes: Severity is an evidence-backed diligence judgment, not a quantified probability; private win/loss data is required to calibrate.
