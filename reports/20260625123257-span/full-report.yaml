      - number: '6.2'
        title: The go-to-market motion is installer-led today, with 2026 partner launches widening distribution
        blocks:
          - type: paragraph
            body: >-
              SPAN's sales motion remains decisively channel-led. Homeowners are pushed through Get Started, Home
              Advisor, and Installer Match flows; installers must be authorized; and the company openly markets free
              leads, rebates, training, sales support, and product-launch access as reasons to join the channel. That
              structure makes sense for a product that is still an electrical-panel replacement rather than a
              plug-and-play gadget. It also means customer traction has to be judged through partner behavior and
              project economics, not through app-download charts or direct checkout conversion. The best public
              installer proof is still anecdotal: SPAN quotes one California solar installer saying 17 free leads
              generated $259,000 of revenue, and its HVAC page argues that service-upgrade friction can cut close rates
              by 43%, making SPAN a save-the-deal tool.


              What changed in 2026 is breadth. PG&E's PanelBoost program moves SPAN Edge into a utility-sponsored
              acquisition path targeted at thousands of households that want EVs or electric appliances without
              months-long upgrade queues. Landis+Gyr is taking SPAN Edge to its utility customer base as a fast
              technician-installed intelligent service point. Eaton goes a step further by embedding SPAN technology
              into Eaton's distribution, installer, and homebuilder networks. Those moves are strategically important
              because they suggest SPAN is trying to escape boutique premium-panel positioning and instead ride broader
              professional channels. The trade-off is that outside investors still cannot see partner revenue mix,
              partner conversion, or whether utility and builder channels are producing repeatable economics rather than
              highly managed flagship programs.
