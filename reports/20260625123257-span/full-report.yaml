      opacity transmit into slower adoption, weaker margins, and a lower-quality valuation case.
    data:
      nodes:
        - id: n1
          label: Permit / AHJ friction
          description: Local approval and plan-review requirements slow or complicate projects.
        - id: n2
          label: Premium hardware economics
          description: High upfront cost requires avoided-upgrade or battery-driven justification.
        - id: n3
          label: Cloud + installer dependency
          description: Commissioning, warranty validity, and standard app experience depend on installers and connectivity.
        - id: n4
          label: Partner-led distribution
          description: Eaton, PG&E, and Landis+Gyr sit on the path to scaled adoption.
        - id: n5
          label: Private operating metrics
          description: Revenue, margin, customer count, and claim rates remain undisclosed publicly.
        - id: n6
          label: Longer sales cycle / lower conversion
          description: Customer friction or permitting slows close rates.
        - id: n7
          label: Margin compression / support burden
          description: Higher labor, enablement, or service costs reduce unit economics.
        - id: n8
          label: Lower conviction valuation
          description: Investors cannot separate category promise from execution quality.
      edges:
        - from: n1
          to: n6
          label: adds approval and scheduling friction
        - from: n2
          to: n6
          label: raises ROI hurdle
        - from: n3
          to: n7
          label: creates service and commissioning cost
        - from: n4
          to: n6
          label: delays channel volume if partners slip
        - from: n4
          to: n7
          label: can shift economics toward partner demands
        - from: n5
          to: n8
          label: limits underwriting confidence
        - from: n6
          to: n7
          label: lower conversion weakens utilization
        - from: n7
          to: n8
          label: margin uncertainty lowers quality of earnings
    approximationNotes: >-
      This is a causal synthesis of retained evidence, not a claimed internal operating model from SPAN. It is intended
      to show risk transmission rather than exact forecasting math.
