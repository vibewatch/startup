        - from: d5
          to: d1
          label: opens utility route to market
        - from: d6
          to: d1
          label: approves local deployment path
        - from: d7
          to: d1
          label: enables control / updates / outage UX
        - from: d8
          to: d1
          label: determines close-rate and ROI
    approximationNotes: >-
      Dependencies are drawn from retained product, partner, warranty, and review sources; edge labels describe why each
      node matters to scaling rather than legal ownership.
