  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              SPAN has enough public proof to clear the first underwriting hurdle: this is not a science project. The
              company closed a very large January 2026 financing, added Eaton as both investor and commercial partner in
              March 2026, and continues to widen its product story from premium residential panels into utility
              load-management and grid-edge infrastructure. Those facts support a real strategic premium over a simple
              smart-home gadget. But they do not yet support a high-conviction late-stage entry price. The strongest
              public 2026 valuation marker is Forge's $1.0 billion Series C estimate, while the last explicit operating
              valuation disclosed in conventional reporting remains the $600 million 2023 B2 round. Between those points
              sits a very wide zone of uncertainty: no public revenue, no public ARR, no public gross margin, no
              disclosed burn, and only partial visibility into private security terms. The right conclusion is therefore
              not that SPAN is low quality; it is that the price signal is stronger than the operating disclosure. For
              an investor without inside access to revenue conversion, margin path, and cap-table detail, the
              disciplined call is research-more rather than buy, and the valuation stance tilts stretched rather than
              attractive.
            claimRefs:
              - CV001
              - CV002
