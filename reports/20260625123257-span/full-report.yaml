      - number: '3.4'
        title: Moats, gaps, and the contradictions Span must navigate
        blocks:
          - type: paragraph
            body: >-
              Span’s moat is not just that it is smart; it is that it tries to own the entire residential control loop
              at the circuit level while remaining compatible with broader electrification upgrades and now EV charging.
              That creates a stronger strategic story than Lumin’s subset control, Enphase’s controller-level load
              shedding, Tesla’s Powerwall-centric gateway, or GM’s EV-gated V2H stack. The flip side is cost and
              invasiveness. When a homeowner does not need a panel swap, retrofit options from Lumin or Eaton can look
              like the more rational purchase. Span also faces the usual ecosystem response risk: Tesla and GM can
              bundle backup and EV value into broader systems, while Schneider and Eaton can lean on incumbent
              electrical distribution and contractor channels. The chapter’s main contradiction is that several rivals
              market “whole-home” outcomes, but the control surface differs sharply. Span’s differentiation therefore
              remains real, yet it is most durable in projects where full-panel replacement and multi-load orchestration
              are already part of the buyer’s plan.
