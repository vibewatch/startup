  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Permitting, and Contractual Surface
        blocks:
          - type: paragraph
            body: >-
              SPAN's first-order non-technical risk is that its value proposition sits inside a regulated, inspected,
              and contract-heavy part of the home. The company has done real de-risking work: its newest panels earned
              UL 3141 certification and the certification is framed by both SPAN and Solar Power World as relevant to
              2026 National Electrical Code power-control-system compliance. But certification does not remove local
              permitting friction. SPAN's own terms push permit responsibility to the user, while Los Angeles
              building-permit guidance shows that many electrical projects still move through plan review and permit
              issuance before work can begin. That means sales velocity can still be throttled by AHJ interpretation,
              utility rules, and installer paperwork even when the core hardware is certified. The legal overlay also
              matters. SPAN's terms impose arbitration and class-action waiver, and they state that disconnecting the
              product from the account and ceasing platform use means the product will no longer be functional. Combined
              with warranty language that ties coverage to authorized installation, commissioning, code compliance, and
              internet-dependent update pathways, the regulatory/legal surface is not a single lawsuit headline risk; it
              is a cumulative go-to-market drag and customer-friction risk that can suppress conversion, create claims
              disputes, and narrow the set of acceptable deployment contexts.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
