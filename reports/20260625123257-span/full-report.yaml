  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Span is narrower than broad HEMS, but broader than a simple panel-replacement SKU'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Span's market is as residential electrical-orchestration infrastructure rather
              than as a generic smart-home device. Analyst HEMS categories include hardware, software, and services that
              monitor and optimize residential consumption, generation, storage, and tariff response across thermostats,
              lighting controls, advanced controllers, and connected appliances. Span clearly overlaps that category
              because its panel, app, and PowerUp load-management layer provide circuit-level visibility, dynamic
              control, and coordination across EV charging, HVAC, solar, storage, and backup use cases. But broad HEMS
              categories also include many products Span does not sell directly, while excluding utility-side grid
              management platforms and standalone generation hardware. That means top-down HEMS estimates are relevant
              context, not a direct synonym for Span's current addressable revenue pool.


              Public company materials also show that Span participates in more than one commercialization layer. On the
              homeowner side, Span markets whole-home visibility, circuit-level control, and appliance-level
              flexibility. On the builder side, it sells load management as a way to avoid 400A upsizing and make new
              homes all-electric ready. On the utility side, it sells grid-edge load shaping and service-upgrade
              avoidance through Span Edge and PowerUp. Eaton and Landis+Gyr extend that same logic into broader
              contractor, homebuilder, and utility channels. The right boundary for valuation is therefore the overlap
              of smart panels, embedded energy-management software, and grid-edge flexibility—not the entire universe of
              residential energy tech, and not only the narrow replacement-panel line item either.
            claimRefs:
