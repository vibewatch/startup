      - number: '8.2'
        title: Public comp set and multiple sensitivity
        blocks:
          - type: paragraph
            body: >-
              Because SPAN does not disclose revenue, the best public valuation discipline comes from bounding the story
              with comparable public businesses rather than pretending to precision-model a DCF. The relevant set mixes
              mature electrical incumbents, residential energy ecosystem vendors, and utility-adjacent control
              businesses: Eaton, Schneider Electric, Generac, Enphase, and Landis+Gyr. That group spans very different
              business models, but it still teaches something useful. Mature electrical leaders Eaton and Schneider sit
              in the mid-single-digit revenue-multiple zone. Generac, which combines hardware, backup power, and
              home-energy controls, also lands around four times trailing sales on a market-cap proxy basis. Enphase
              sits in a similar neighborhood on the energy-tech screens retained here. Landis+Gyr, which is more
              utility-meter and grid-infrastructure oriented, clears a much lower multiple. That spread matters because
              SPAN is currently asking the market to value a private, hardware-led company with undisclosed economics
              somewhere between premium energy-tech optionality and infrastructure realism. Without disclosed revenue,
              the comp set cannot produce a fair value; it can only show that the public clearing range for adjacent
              models is wide, cyclical, and far less forgiving than venture narratives when growth or margin proof is
              thin.
