      - number: '2.3'
        title: >-
          Buyer, payer, and user map: the economic buyer changes by channel, but the user problem is consistently load
          orchestration
        blocks:
          - type: paragraph
            body: >-
              Span is not selling one product motion to one buyer. In retrofit jobs, the end user is the homeowner and
              the immediate channel is often an electrician, solar-plus-storage installer, or EV charger installer;
              EnergySage's 2026 market evidence shows homeowners increasingly think in terms of an integrated home
              energy system rather than isolated products. In that motion, the economic value is avoiding or delaying
              electrical upgrades while adding EV charging, heat pumps, batteries, or backup capability. In new
              construction, the buyer is more often the builder or developer, who cares about electrical
              bill-of-materials savings, reduced engineering and utility lead times, and electrification compliance.
              Span explicitly argues that builders can avoid 400A service upsizing and save thousands per site, and
              Pulte's public endorsement suggests that builder adoption is at least a meaningful commercial path.


              Utilities are a third, distinct buyer class. Span's utility materials, PG&E's PanelBoost launch, and the
              Landis+Gyr partnership all frame the product as a way to defer distribution upgrades, manage service
              setpoints, and enroll homes into demand-flexibility or VPP programs. That buyer is not paying for
              homeowner delight first; it is paying for avoided capex, load visibility, and grid resilience. The common
              thread across all three segments is the same end-user workflow—adding and coordinating high-load
              electrified equipment inside the home—but the budget owner, procurement path, and proof-of-value metric
              change materially by segment. That segmentation matters because public evidence today supports credible
              reach across all three channels, but not equivalent maturity or penetration in each one.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
