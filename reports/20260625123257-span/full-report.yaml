  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Signals
        blocks:
          - type: paragraph
            body: >-
              SPAN's monetization is visible at the product and channel layer even though realized financial output is
              not. The company sells smart electrical panels in multiple form factors, the SPAN Drive EV charging
              accessory, and the Remote Meter Kit through an authorized-installer channel rather than a self-serve
              direct e-commerce model. Official MSRP now spans $2,550 for the MLO 24 through $4,100 for the MAIN 40,
              with SPAN Drive listed at $750 and the Remote Meter Kit at $795. Business Wire and the company product
              pages show that SPAN broadened the product family in 2025 with MAIN 16 and MLO 24 so it could address
              smaller homes, ADUs, subpanels, and multifamily use cases rather than only premium single-family
              retrofits.


              What is not public is just as important. SPAN does not disclose realized ASPs, discounts, attachment rates
              for Drive or the Remote Meter Kit, or the split between residential panel revenue and the newer
              utility-facing SPAN Edge line. The API and on-premise releases in February 2026 expand product capability,
              but they do not create a clearly disclosed standalone software subscription line; OTA updates remain free
              and the local API is community-supported. That leaves the chapter's revenue conclusion straightforward:
              SPAN has a real hardware price list and multiple monetizable SKUs, but public evidence still supports a
              hardware-plus-installation-led business with software serving as product differentiation rather than a
              separately disclosed revenue bucket.
