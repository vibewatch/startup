      - number: '1.3'
        title: Partnerships, Channels, and Expansion
        blocks:
          - type: paragraph
            body: >-
              The most important public signal about SPAN's current stage is the breadth of verified channel partners
              around its control stack. Landis+Gyr and PG&E validate the utility pathway: SPAN Edge is being sold as an
              at-the-meter product that can help utilities defer transformer and service-upgrade costs, and PG&E plans
              an initial rollout to thousands of customers through PanelBoost. Eaton adds a different form of
              validation: its 2026 strategic partnership included a $75 million investment, broad distribution through
              Eaton's installer and builder network, and co-developed joint solutions slated for Q2 2026. Jabil supports
              manufacturing scale, while PulteGroup provides evidence that builders view SPAN's newer panel
              configurations as a way to avoid more expensive 400-amp upgrades. SPAN is also broadening the software
              layer with a public local API and on-premise control experience, then stretching the same power-control
              thesis into XFRA, a distributed compute offering announced with NVIDIA. Notably, retained sources verify
              Eaton, Landis+Gyr, PG&E, Jabil, and PulteGroup relationships, but they do not verify the prompt's
              suggested GM or Ford partnership cue.
