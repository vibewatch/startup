  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: three ways buyers solve the job'
        blocks:
          - type: paragraph
            body: >-
              The relevant competitor set is broader than “smart panel startup versus smart panel startup.” Public
              comparison coverage and vendor materials split the market into three buyer paths: full panel replacement,
              retrofit load management beside an existing panel, and conventional panels paired with monitoring-only
              substitutes. Span and Schneider sit on the replacement side, where the promise is a cleaner architecture
              for solar, storage, EV charging, and outage control. Lumin and Eaton attack the same buyer problem from
              the retrofit side, promising meaningful control without a full panel swap. Enphase, Tesla, and GM compete
              more through ecosystems that already own the inverter, battery, EV, or app relationship, which can be
              enough for buyers whose real purchase driver is backup orchestration rather than universal circuit
              control. That framing matters because Span’s strongest wins come when a buyer already expects panel work;
              it is less advantaged when the panel can stay in place.
