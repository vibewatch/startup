      - number: '6.3'
        title: >-
          Named proof and reviews show real fit, but the strongest evidence is still problem-specific rather than broad
          cohort proof
        blocks:
          - type: paragraph
            body: >-
              SPAN does clear the basic customer-proof bar. Public sources show a real utility-backed rebate cohort in
              Silicon Valley Power territory, a real PG&E launch aimed at thousands of electrifying households, and
              official testimonials from a homeowner, a solar installer, and builder/HVAC channels. Independent reviews
              are directionally consistent with those official claims: EnergySage treats SPAN as the most comprehensive
              smart-panel solution, SmartHomeExplorer calls it the best overall fit for solar-and-battery homes despite
              high upfront cost, and ShelterVolt says the product makes the most sense when it eliminates a larger
              downstream expense such as a service upgrade, critical-load subpanel, or oversized battery. In other
              words, public proof is not just a logo wall; it repeatedly ties adoption to avoided-upgrade economics,
              backup control, and electrification flexibility.


              The same evidence also defines the boundary of product-market fit. ShelterVolt's critique is useful
              because it is not anti-SPAN in general; it is anti-SPAN for the wrong project. The review says the product
              is an expensive flex when the house only needs a normal panel replacement, and the generator FAQ confirms
              that generator-first homes lose much of the polished outage experience. Large homes can also move outside
              the sweet spot because multi-panel deployments add cost, networking requirements, and battery-topology
              constraints. So the public verdict is nuanced but coherent: SPAN appears to solve a real customer pain
              point, yet it is still best understood as a premium electrification-enablement product whose value is
              highly dependent on project context.
