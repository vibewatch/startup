companyProfile:
  summary: >-
    SPAN is a San Francisco-based electrification hardware and software company founded in 2018 around the idea that the
    home's electrical panel should become an intelligent control layer rather than a passive breaker box. Its core
    products are SPAN Panel, SPAN Drive, and the SPAN Home control stack, with newer expansion into builder and
    utility/grid-edge offers such as SPAN Edge. Public evidence supports strong strategic interest from Eaton, PG&E, and
    Landis+Gyr, but the company still discloses little about current revenue, margins, customer count, or financing
    terms.
