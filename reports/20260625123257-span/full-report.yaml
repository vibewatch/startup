  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Compact data points that explain why the chapter lands on a cautious valuation stance.
    data:
      items:
        - label: Jan 2026 amount sold
          value: $163.3M
          note: SEC Form D sold amount
        - label: Forge 2026 valuation marker
          value: $1.0B
          note: Series C estimate, not public-market clearing price
        - label: Public comp multiple band
          value: ~1.4x-6.0x
          note: Revenue-multiple range across retained comps
        - label: Official panel MSRP band
          value: $2,550-$4,100
          note: Hardware only; excludes installation
        - label: Typical installed-cost band
          value: $6.5k-$10k
          note: Review-source band, project-specific
        - label: Public SPAN revenue disclosure
          value: None retained
          note: Core blocker to precise valuation work
    approximationNotes: >-
      The KPI panel intentionally mixes numeric and categorical evidence because the chapter's main problem is missing
      operating disclosure, not lack of price markers.
