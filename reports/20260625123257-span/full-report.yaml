        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse company quality with entry quality
            body: >-
              SPAN may deserve a premium story, but the public record does not yet justify treating the 2026 private
              valuation marker as self-proving fair value.
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV039
              - CV040
              - CV042
              - CV048
          - type: callout
            title: Preference overhang can matter more than headline post-money
            body: >-
              Forge exposes enough private-security detail to show that liquidation preference and dividends are not
              academic; they affect what new money is really buying.
            calloutType: risk
            claimRefs:
