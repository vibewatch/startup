      - number: '7.4'
        title: Mitigation Framework and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The right risk posture for SPAN is neither fear of imminent collapse nor blind confidence in category
              leadership. The company has enough capital and partner validation that the key diligence question is now
              transmission: which observable failures would turn a plausible electrification platform into an
              over-engineered premium panel business? The highest-signal monitors are straightforward. If AHJs or
              utility programs do not accept UL 3141-enabled service-upgrade avoidance in practice, SPAN loses one of
              its strongest economic wedges. If Eaton, PG&E, or Landis+Gyr timelines slip, then utility and builder
              scale assumptions must be cut. If local-control support stays SKU-limited while outages or connectivity
              complaints rise, the reliability narrative weakens. If public or diligence-only evidence shows that
              projects routinely require service upgrades anyway, the value proposition compresses toward expensive
              hardware. And if management cannot show installer conversion, gross margin, warranty-claim incidence, and
              post-install economics, the recent capital raised only proves financing access rather than business
              quality. The practical mitigation is therefore to force diligence around permits, claim rates, installer
              economics, and partner contracts before treating SPAN as a de-risked grid-edge platform. The kill criteria
              are measurable and should be used aggressively.
