      - number: '7.3'
        title: Partner, Channel, and Utility Dependencies
        blocks:
          - type: paragraph
            body: >-
              SPAN's scaling path now runs through counterparties rather than just direct product pull. Eaton is a major
              positive because it contributes $75 million, circuit/surge hardware, and access to broad installer and
              builder channels; it is also a dependency because SPAN is explicitly leaning on Eaton's distribution and
              codeveloped offer to lower cost and accelerate adoption. The same pattern appears in utilities. PG&E's
              PanelBoost and the Landis+Gyr partnership are strong validation that SPAN Edge can matter at the grid
              edge, but both also show that utility-channel scale depends on partner-installed programs, utility
              budgets, and multi-year deployment follow-through. PG&E's public materials describe initial scaling to
              thousands of customers starting later in summer 2026, not a mature broad-based rollout, and Landis+Gyr's
              own narrative emphasizes its AMI footprint as the route to market. Channel concentration also remains
              visible in the residential product line because warranty validity and commissioning depend on authorized
              installers. Leadership concentration sharpens the execution risk: Arch Rao is the quoted founder/CEO
              across nearly every retained partner and utility announcement. None of this means the model is broken. It
              means SPAN's next phase is less about proving the panel exists and more about proving partner-led
              distribution, utility sales cycles, installer enablement, and founder-led execution can scale without
              margin leakage or timeline drift.
