      - CR018
      - CR019
      - CR021
      - CR026
      - CR028
      - CR030
      - CR033
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    summary: >-
      Dependency graph showing the counterparties and systems that SPAN needs to convert product promise into scaled
      deployments.
    data:
      nodes:
        - id: d1
          label: SPAN core panel business
          description: Residential hardware plus software control platform.
        - id: d2
          label: Authorized installers
          description: Required for commissioning, delivery, and warranty-valid installs.
        - id: d3
          label: Eaton
          description: Distribution, builder reach, codevelopment, and strategic capital.
        - id: d4
          label: PG&E
          description: Early scaled utility program and cost-avoidance proof point.
        - id: d5
          label: Landis+Gyr
          description: AMI utility channel and grid-edge commercialization route.
        - id: d6
          label: AHJs / permit authorities
          description: Local code and permit approval gatekeepers.
        - id: d7
          label: Cloud + local software stack
          description: Standard app path, firmware updates, and limited on-prem fallback.
        - id: d8
          label: End-customer economics
          description: Homeowner willingness to pay depends on avoided upgrades and resilience value.
      edges:
        - from: d2
          to: d1
          label: commissions and installs
        - from: d3
