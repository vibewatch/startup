          - type: callout
            title: Scenario ranges are built to avoid invented revenue
            body: >-
              The bands in this chapter are entry-discipline ranges derived from public round markers, comparable
              valuations, and explicit evidence gaps—not from guessed SPAN revenue.
            calloutType: assumption
            claimRefs:
