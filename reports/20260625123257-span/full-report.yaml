      - number: '5.2'
        title: Architecture, interoperability, and operating model
        blocks:
          - type: paragraph
            body: >-
              The public architecture is specific enough to reconstruct the major operating layers. At the hardware
              boundary, SPAN Panel and Edge both combine metering, branch or service-level control, and power-management
              logic sized around 100-200A residential service. The panel line is explicitly tied to PowerUp, which is
              the software layer SPAN uses to throttle or sequence loads so an electrifying home can stay within service
              constraints. Drive then connects back to the panel over RS485, making EV charging another controllable
              load rather than an isolated charger. Battery and solar integration is more nuanced: MAIN 32 has the
              deepest native battery matrix, while the newer MAIN 16, MLO 24, MAIN 40, and MLO 48 are publicly shown
              with a narrower supported-storage matrix today. Solar monitoring can come from branch measurements,
              storage integrations, or Enphase CTs, and the support docs make clear that installer-side configuration is
              part of the product. The result is an architecture with real interoperability, but one that still depends
              heavily on compatible storage vendors, installer setup, and model-specific support boundaries rather than
              on universal plug-and-play behavior.
