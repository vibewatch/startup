    title: Valuation / return range
    type: range
    layout: standard
    summary: Public evidence supports broad scenario bands, not a point estimate.
    data:
      items:
        - label: Bear valuation band ($M)
          low: 350
          high: 550
        - label: Base valuation band ($M)
          low: 600
          high: 850
        - label: Bull valuation band ($M)
          low: 1000
          high: 1300
        - label: Visible 2026 private marker ($M)
          low: 1000
          high: 1000
    approximationNotes: >-
      Bands are scenario outputs anchored to public round markers, comp ranges, and disclosed strategic developments.
      They do not impute undisclosed SPAN revenue.
    claimRefs:
      - CV005
