      - number: '3.2'
        title: Product scope and interoperability decide who makes the shortlist
        blocks:
          - type: paragraph
            body: >-
              Span’s clearest product advantage is scope. The company publicly markets 16 to 48 controllable circuits,
              remote control over every circuit, and a growing native stack that now reaches into EV charging with SPAN
              Drive. Lumin is the strongest direct counterpoint: it avoids panel replacement and claims universal
              compatibility with existing panels, batteries, and solar, but independent review coverage still describes
              direct smart control as limited to selected circuits. Schneider and Eaton each use incumbent
              electrical-hardware strengths to compete, but both bring platform constraints: Schneider is tied to Square
              D QO breakers, while Eaton’s current AbleEdge release is tied mostly to Eaton BR panels and 2-pole
              high-draw loads. Enphase, Tesla, and GM all offer meaningful home-energy control, but their public product
              surfaces are narrower and more ecosystem-gated. In practice, Span wins the “single nervous system for the
              whole home” argument more easily than it wins the “least disruptive upgrade” argument.
