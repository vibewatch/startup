      - number: '4.2'
        title: GTM Motion, Channel Structure, and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              SPAN's go-to-market motion is high-touch and channel-mediated. The company requires installation by
              SPAN-authorized licensed electricians, routes homeowners and distributors through a lead form, and pitches
              installers on rebates, training, faster installs, and free lead flow. That means sales efficiency depends
              less on consumer checkout conversion and more on partner enablement, installer education, and attachment
              into broader electrification projects such as solar-plus-storage, EV charging, HVAC, and renovation work.
              The installer page's testimonial about 17 free leads producing $259,000 in revenue is not enough to
              underwrite CAC or payback, but it does show that SPAN is actively subsidizing channel demand generation
              instead of relying on purely organic pull.


              Distribution breadth improved materially in 2026. The Eaton partnership gives SPAN access to a much larger
              installer, distributor, and homebuilder footprint, while PG&E's PanelBoost program and the earlier utility
              pilot described by Latitude show that the company is also trying to win utility-sponsored demand. Those
              are meaningful revenue-quality positives because they can shorten customer-acquisition friction and lower
              the fully loaded cost of each installation. Even so, public sources do not disclose conversion rates,
              sales-cycle length, installer churn, rebate burden, or channel gross-to-net adjustments. The underwriting
              takeaway is that SPAN appears to be moving from boutique direct demand creation toward partner-distributed
              scale, but the public record still lacks the unit data needed to judge whether that scaling motion is
              efficient.
