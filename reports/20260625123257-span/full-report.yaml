  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a simple chain: strategic proof is real, but price support still outruns public
      operating disclosure.
    data:
      nodes:
        - id: funding
          label: Funding proof
          detail: Large 2026 financing plus a strategic Eaton check confirm investor appetite
        - id: optionality
          label: Utility / platform optionality
          detail: PG&E, Landis+Gyr, and XFRA widen the story beyond premium panels
        - id: cost
          label: Hardware cost reality
          detail: Installed cost still sits well above conventional panel replacement
        - id: opacity
          label: Metric opacity
          detail: Revenue, gross margin, burn, and runway remain undisclosed publicly
        - id: price
          label: Headline price marker
          detail: Forge shows a $1.0B 2026 marker but not a public-market clearing test
        - id: call
          label: Recommendation
          detail: Track / research-more unless diligence or price closes the gap
      edges:
        - from: funding
          to: optionality
        - from: optionality
          to: price
        - from: cost
          to: opacity
        - from: opacity
          to: price
        - from: price
          to: call
        - from: cost
          to: call
    approximationNotes: >-
      This is a causal decision map, not a weighted scoring model. It shows how public evidence changes recommendation
      direction.
    claimRefs:
      - CV007
      - CV009
      - CV018
      - CV021
      - CV022
      - CV023
      - CV039
      - CV040
      - CV042
      - CV048
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The variables that matter most are not cosmetic; they are the missing inputs that would re-anchor SPAN against
      public comp bands.
    data:
      items:
        - label: Disclosed current revenue / ARR
          value: 10
          note: Largest single unlock for any multiple-based view
        - label: Gross-margin proof by product line
          value: 9
          note: Tests whether SPAN deserves premium hardware or software-adjacent treatment
        - label: Utility revenue conversion
          value: 9
          note: Determines whether grid-edge optionality is real or promotional
        - label: Preference-adjusted cap table clarity
          value: 7
          note: Changes what headline post-money means for common-equity economics
        - label: Installed-cost compression via Eaton / channel scale
          value: 6
          note: Improves mass-market affordability and volume assumptions
    approximationNotes: >-
      Values are ordinal impact scores from 1 to 10 derived from the chapter's scenario logic, not measured
      elasticities.
    claimRefs:
      - CV007
      - CV011
      - CV016
      - CV017
      - CV021
      - CV039
      - CV041
      - CV044
      - CV045
