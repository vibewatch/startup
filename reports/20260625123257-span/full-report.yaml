      - number: '1.4'
        title: Milestones and Public Risks
        blocks:
          - type: paragraph
            body: >-
              Public milestones show a company that has moved quickly from a residential panel replacement story into a
              broader infrastructure platform. Official sources tie SPAN's operating history to 2018, commercial panel
              sales to 2020, SPAN Drive to 2022, the $96 million B2 round to April 2023, Landis+Gyr utility partnering
              to 2024, and a wave of builder, utility, and local-control launches across 2025-2026. The 2025 and 2026
              SEC filings show SPAN continuing to raise meaningful private capital as that expansion accelerated. The
              main public risk is not legal or regulatory distress but adoption economics. Independent review and news
              sources repeatedly describe SPAN as feature-rich but premium-priced, with the core smart-panel market
              still relatively small and exposed to slower rooftop-solar and EV adoption. Canary also surfaces an
              important strategic challenge: lower-cost smart meters and device-level controls may cover part of the
              same use case without requiring a dedicated smart panel. That means SPAN's upside depends on proving that
              its hardware-plus-software control layer creates enough savings, resilience, and utility value to overcome
              higher upfront cost and competitive substitutes.
