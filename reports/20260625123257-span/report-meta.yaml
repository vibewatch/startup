companyProfile:
  summary: >-
    SPAN is a San Francisco-based electrification hardware and software company founded in 2018 around the idea that the home's electrical panel should become an intelligent control layer rather than a passive breaker box. Its core products are SPAN Panel, SPAN Drive, and the SPAN Home control stack, with newer expansion into builder and utility/grid-edge offers such as SPAN Edge. Public evidence supports strong strategic interest from Eaton, PG&E, and Landis+Gyr, but the company still discloses little about current revenue, margins, customer count, or financing terms.
  foundedDate: '2018-01-01'
  founders:
    - name: Arch Rao
      role: Founder & CEO
      background: Former Tesla Energy product leader and the company's primary fundraising and strategy voice in retained public sources.
      claimRefs: [CO007]
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Smart electrical panels, an integrated Level 2 EV charger, app and local-control software, and utility-facing grid-edge control hardware for residential electrification and load management.
  customerFocus: >-
    Homeowners adding batteries, EVs, or large electric loads; builders and contractors trying to avoid expensive service upgrades; and utilities piloting lower-cost electrification pathways.
  businessModel: >-
    Hardware-led sales through authorized installers and partners, with software bundled into the platform and strategic upside from builder, utility, and grid-edge channel expansion.
  stage: Late-stage private company
  fundingStatus: >-
