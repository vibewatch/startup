  evidenceGaps:
  - type: missing-source
    severity: material
    topic: litigation-and-recalls
    missingEvidence: Authoritative court-docket, consumer-protection, and recall checks tied directly to Span.IO / SPAN product entities across federal and major state venues.
    whyItMatters: Public web sources reviewed here did not surface a clear active lawsuit or recall, but absence in media or company pages is not enough to underwrite legal cleanliness.
    diligencePath: Run PACER/state-court/CPSC/entity-name checks, then reconcile results to installer claims history and insurance disclosures.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: field-reliability
    missingEvidence: Warranty-claim rates, RMA data, outage-frequency telemetry, firmware rollback history, and claim-denial reasons by panel generation.
    whyItMatters: Safety certifications and reviews do not tell an investor whether the field fleet is reliable enough to support premium pricing and low support burden.
    diligencePath: Request cohort reliability dashboard, warranty reserve history, and top ten failure modes with corrective actions.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-disclosure
    missingEvidence: Revenue, gross margin, customer count, installer conversion, utility-contract economics, and cash-efficiency KPIs for 2026.
    whyItMatters: Without these data, the company can be described as well financed and strategically validated, but not fully underwritten for durable economics or valuation.
    diligencePath: Request board KPI pack, partner pipeline conversion, warranty reserve trend, and product-line gross margin bridge.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR028
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: ahj-adoption
    missingEvidence: Market-by-market evidence showing where AHJs and utilities have actually approved service-upgrade avoidance using SPAN or equivalent UL 3141 load-management logic.
    whyItMatters: Certification alone does not guarantee fast permitting or approval, and inconsistent AHJ posture can break the economics in key markets.
    diligencePath: Collect permit files, inspector sign-offs, and utility interconnection notes from the top ten target jurisdictions.
