- id: TR005
  title: Mitigation and kill criteria table
  layout: wide
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Permit / AHJ friction
    - Jurisdictional approval evidence for service-upgrade avoidance
    - Fewer than 3 top target markets with documented recurring approvals
    - Cut adoption assumptions and treat code advantage as marketing rather than throughput
  - - Partner-channel concentration
    - Eaton / PG&E / Landis+Gyr rollout cadence
    - Material slip beyond publicly stated 2026 timing or no volume expansion updates
    - Reduce channel-derived growth expectations and demand direct sales-efficiency proof
  - - Product economics
    - Installed project cost vs avoided upgrade cost
    - Projects frequently still require service upgrades or exceed replacement alternatives without offsetting savings
    - Treat SPAN as niche premium hardware, not a mass-market electrification platform
  - - Reliability / cloud dependence
    - Outage-handling and local-control evidence across installed base
    - No hard reliability metrics plus persistent MAIN 32-only local fallback after 2026 milestones
    - Increase reliability discount and require incident / claim-rate disclosure before underwriting
  - - Private-metric opacity
    - Disclosure of revenue, margin, customer count, and warranty claims
    - Management cannot provide KPI pack, warranty reserve trend, and channel conversion data in diligence
    - Pause valuation work; public evidence is insufficient to price execution risk
  - - Leadership concentration
    - Delegation of partner and product ownership beyond founder
    - No clear operating owners or succession plan for utility/channel programs
    - Raise key-person discount and demand governance / org evidence before conviction
  notes: These kill criteria are intentionally observable and should be checked against monthly operating reviews rather than narrative updates.
