- id: product-reliability-cyber-and-economics
  title: Product Reliability, Cyber, and Economics Risk
  body: 'The core product risk is that SPAN still asks customers to pay a meaningful premium for a connected electrical panel whose best benefits show up only in specific use cases. Official MSRP starts at $2,550 and the common MAIN 32 starts at $3,500 before installation, while EnergySage puts a standard 200-amp panel replacement at roughly $1,000 to $3,000. Independent reviews push full installed SPAN projects into roughly $6,500 to $10,000 and sometimes materially higher when service upgrades or bundled hardware are required. That cost gap is why adverse reviewers repeatedly say SPAN makes the most sense when it replaces another cost, such as a service upgrade, a critical-load subpanel, or extra battery capacity; absent those offsets, the panel can look discretionary. Reliability and cyber posture are mixed rather than broken. Eaton says the joint offer meets rigorous cybersecurity and safety design standards, and SPAN''s local API/on-premise release gives a real fallback path during
    cloud loss. But the local fallback is still beta and initially MAIN 32-only, the API is explicitly community-supported and outside warranty/support, and the warranty excludes uninterrupted/error-free operation plus failures tied to internet or cellular loss. That leaves a clear underwriting message: the product can be strategically valuable, but the combination of premium price, cloud dependency, limited public field-failure data, and uneven local-control rollout creates real adoption and support risk.'
