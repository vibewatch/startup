- id: FR001
  title: Risk heatmap
  type: matrix
  summary: Heatmap ranking SPAN risks by likelihood and impact. Premium economics, installer/channel dependence, and local permitting friction cluster in the high-likelihood / high-impact zone; founder concentration and cloud-reliability issues sit one step lower but still matter because they can amplify adoption drag.
  data:
    columns:
    - Low Impact
    - Medium Impact
    - High Impact
    - Critical Impact
    rows:
    - label: High Likelihood
      values:
      - Routine competitor discounting
      - Beta-support burden
      - Authorized-installer bottleneck
      - Premium economics fail outside high-value use cases
    - label: Medium Likelihood
      values:
      - Minor data-sharing complaint
      - 32-circuit scaling pain
      - Cloud/outage reliability complaints
      - AHJ/permit friction slows sales velocity
    - label: Low Likelihood
      values:
      - Single legal dispute
      - Cellular feature sunset shock
      - Utility program cancellation by one partner
      - Partner-led scale thesis breaks across multiple channels
  approximationNotes: Placements are analyst judgments grounded in retained evidence. Likelihood is tied to how often the risk is structurally implied by current product/channel design; impact is tied to potential effect on adoption, margin, and valuation rather than physical safety alone.
