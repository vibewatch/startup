  topStrengths:
    - SPAN 的智能配电盘架构把回路级控制、负载管理、备电编排和 EV 集成放进同一平台，直击真实电气化瓶颈。
    - 2026 年 Eaton 投资，加上 PG&E 和 Landis+Gyr 项目，说明第三方验证已把 SPAN 推出小众家庭改造场景。
    - 公开用例反复把 SPAN 与节省电力服务升级成本绑定，这个采用抓手强于泛化智能家居便利性。
    - 产品宽度已从单一高端配电盘扩到多种形态、SPAN Drive、本地 API 工具和 SPAN Edge。
  topRisks:
    - 公开来源仍未披露当前收入、毛利率、烧钱速度、runway 或客户数，承销信心受限。
    - SPAN 仍是高端硬件；离开痛点强的项目，安装后经济性相对传统配电盘更换会显得昂贵。
    - 渠道扩张越来越依赖 Eaton、PG&E、Landis+Gyr 等伙伴和项目，带来转化与集中度风险。
    - 许可、规范采用和安装商质量波动会削弱客户 ROI，即便产品价值主张本身成立。
    - 可见的 2026 年十亿美元估值标记建立在稀疏经营披露上；若优先权条款较重，普通股价值可能被高估。
  unresolvedGaps:
    - 当前确认收入、毛利率，以及配电盘、配件、公用事业项目和任何软件 / 服务的分部结构。
    - 装机基数、活跃家庭指标、伙伴来源与直销 wins，以及留存或质保索赔 cohort。
    - 完整股权结构条款、清算优先权、反稀释机制和 Series C 后普通股经济性。
    - 当前现金 runway、营运资本需求，以及 Eaton 带来的制造规模是否正在降低安装成本摩擦。
