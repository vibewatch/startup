      - number: '5.4'
        title: 技术瓶颈和替代风险
        blocks:
          - type: paragraph
            body: >-
              最大技术瓶颈不是产品是否存在，而是支持边界和生态依赖。第一，电池和太阳能互操作性是选择性的。MAIN 32
              原生储能支持最广，而更新面板变体仍显示更有限的矩阵，所以客户不能假设任何电池、逆变器或网关都能顺畅集成。第二，本地控制故事不均衡。SPAN 现在已经推出带 MQTT 和 REST 元素的官方 MAIN 32 本地
              API，但它仍仅限个人使用，由社区支持，并在保修 / 支持范围之外。围绕 Gen3 面板的社区证据说明了为什么这重要：非官方 gRPC 访问曾短暂出现，随后在固件 7.2.0 中消失，而官方 Gen3 本地
              API 支持仍推迟到 2026 年 H2。第三，Edge
              在战略上有趣，但仍年轻。公用事业伙伴验证了问题和部分经济性，但公开数据没有显示稳态延迟、事件频率、变压器缓解结果或规模部署可靠性。这留下了有意义的替代风险。商品化面板、标准 EVSE
              或公用事业自有电表插座方案可以复制价值栈的一部分。SPAN 的护城河是跨面板、充电器、应用、电池和公用事业项目的一体化编排层；但只有互操作性和固件治理持续领先于社区挫败感和渠道复杂度，这条护城河才耐久。
