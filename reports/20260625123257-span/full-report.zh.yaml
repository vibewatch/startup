      - number: '3.4'
        title: Span 必须处理的护城河、缺口和矛盾
        blocks:
          - type: paragraph
            body: >-
              Span 的护城河不只是“智能”，而是它试图在回路级掌握整个住宅控制闭环，同时保持与更广电气化升级和现在的 EV 充电兼容。这比 Lumin 的子集控制、Enphase 的控制器级甩负荷、Tesla 以
              Powerwall 为中心的网关，或 GM 由 EV 门槛限定的 V2H 栈，构成更强的战略故事。反面是成本和侵入性。房主不需要换面板时，Lumin 或 Eaton 的改造选项可能显得更理性。Span
              也面临常见的生态回应风险：Tesla 和 GM 可以把备电和 EV 价值捆进更广系统，Schneider 和 Eaton
              可以依靠既有电气分销和承包商渠道。本章的主要矛盾是，多家竞争者都营销“全屋”结果，但控制表面差异很大。因此，Span 的差异化仍真实存在，但在完整面板替换和多负载编排已经进入买方计划的项目中最持久。
