  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和价格纪律
        blocks:
          - type: paragraph
            body: >-
              SPAN 已有足够公开证据跨过第一道承保门槛：它不是科研项目。公司在 2026 年 1 月完成一轮很大的融资，2026 年 3 月又引入 Eaton
              作为投资人和商业伙伴，并继续把产品叙事从高端住宅面板拓到公用事业负荷管理和电网边缘基础设施。这些事实足以支撑它相对普通智能家居小工具的真实战略溢价。但它们还不足以支撑高确信度的后期入场价。2026
              年最强的公开估值锚点是 Forge 对 Series C 约 $1.0 billion 的估计；而传统报道中最后一个明确披露的运营估值，仍是 2023 年 B2 轮的 $600
              million。两点之间有很宽的不确定区间：没有公开收入、没有公开 ARR、没有公开毛利、没有披露烧钱速度，私募证券条款也只看到一部分。因此，正确结论不是 SPAN
              质量低，而是价格信号强过运营披露。若投资人拿不到收入转化、利润率路径和 cap table 细节的内部资料，有纪律的判断应是 research-more 而不是 buy；估值立场也更偏紧绷，而非有吸引力。
