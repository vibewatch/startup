      - number: '6.2'
        title: 当前 go-to-market 动作由安装商主导，2026 年合作伙伴发布正在扩大分销
        blocks:
          - type: paragraph
            body: >-
              SPAN 的销售动作仍明显由渠道主导。房主被导入 Get Started、Home Advisor 和 Installer Match
              流程；安装商必须获得授权；公司公开把免费线索、返利、培训、销售支持和产品发布访问权作为加入渠道的理由来营销。这种结构适合一款仍是电气面板替换、而非即插即用小工具的产品。它也意味着客户牵引必须通过合作伙伴行为和项目经济性判断，而不是通过应用下载榜或直接结账转化。最佳公开安装商证明仍是轶事：SPAN
              引用一家加州太阳能安装商称 17 条免费线索带来 $259,000 收入；其 HVAC 页面则主张服务升级摩擦会让成交率下降 43%，使 SPAN 成为保住订单的工具。


              2026 年改变的是广度。PG&E 的 PanelBoost 项目把 SPAN Edge 推入公用事业赞助的获客路径，目标是数千户想要 EV 或电器化设备、但不想排队数月升级的家庭。Landis+Gyr 正把
              SPAN Edge 带给其公用事业客户群，作为可由技术员快速安装的智能服务点。Eaton 更进一步，把 SPAN 技术嵌入 Eaton 的分销、安装商和住宅开发商网络。这些动作在战略上重要，因为它们说明 SPAN
              正试图摆脱精品高端面板定位，转而搭乘更广专业渠道。取舍是，外部投资者仍看不到合作伙伴收入组合、合作伙伴转化，或公用事业和开发商渠道产生的是可复制经济性，还是高度管理的旗舰项目。
