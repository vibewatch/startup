      - number: '6.3'
        title: 具名证明和评测显示真实契合，但最强证据仍是问题特定，而不是广泛 cohort 证明
        blocks:
          - type: paragraph
            body: >-
              SPAN 通过了基本客户证明门槛。公开来源显示，Silicon Valley Power 辖区内有真实的公用事业支持返利 cohort，PG&E
              有面向数千户电气化家庭的真实发布，官方还有来自房主、太阳能安装商以及开发商 / HVAC 渠道的证言。独立评测与这些官方主张方向一致：EnergySage 把 SPAN
              视为最全面的智能面板解决方案；SmartHomeExplorer 称，尽管前期成本高，它仍是太阳能加电池住宅的最佳整体选择；ShelterVolt
              表示，当产品消除了服务升级、关键负载子面板或过大电池等更大下游支出时，最有意义。换句话说，公开证明不只是客户名单墙；它反复把采用与规避升级经济性、备电控制和电气化灵活性相连。


              同一证据也划定了产品市场契合的边界。ShelterVolt 的批评很有用，因为它不是总体反 SPAN，而是反对把 SPAN 用在错误项目上。评测称，当房子只需要普通面板替换时，这款产品就是昂贵炫技；发电机 FAQ
              也确认，以发电机为先的住宅会失去许多精致停电体验。大型住宅也可能跑出甜蜜点，因为多面板部署会增加成本、网络要求和电池拓扑约束。因此，公开结论是细致但连贯的：SPAN
              似乎解决了真实客户痛点，但最好仍被理解为一种高端电气化赋能产品，其价值高度取决于项目背景。
