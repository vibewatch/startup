companyProfile:
  summary: >-
    SPAN 是一家位于旧金山的电气化硬件和软件公司，2018 年创立，核心想法是让家庭配电面板从被动断路器箱变成智能控制层。核心产品包括 SPAN Panel、SPAN Drive 和 SPAN Home
    控制栈，并正扩展到开发商、公用事业和电网边缘产品，例如 SPAN Edge。公开证据显示 Eaton、PG&E 和 Landis+Gyr 对其有强烈战略兴趣，但公司仍很少披露当前收入、利润率、客户数或融资条款。
