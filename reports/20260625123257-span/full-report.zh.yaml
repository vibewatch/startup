  - id: TR005
    title: 缓释和否决标准表
    layout: wide
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 许可 / AHJ 摩擦
        - 规避服务升级的辖区批准证据
        - 有文件证明反复批准的头部目标市场少于 3 个
        - 下调采纳假设，把规范优势视为营销点而非吞吐量
      - - 合作伙伴渠道集中
        - Eaton / PG&E / Landis+Gyr 推进节奏
        - 明显滑出公开声明的 2026 年时间表，或没有量级扩张更新
        - 下调来自渠道的增长预期，并要求直接销售效率证据
      - - 产品经济性
        - 已安装项目成本 vs 避免的升级成本
        - 项目仍经常需要服务升级，或在没有抵消性节省时成本高于替代方案
        - 把 SPAN 当作小众高端硬件，而不是大众市场电气化平台
      - - 可靠性 / 云依赖
        - 装机基础中的停电处理和本地控制证据
        - 没有硬可靠性指标，且 2026 年里程碑后本地回退仍只覆盖 MAIN 32
        - 提高可靠性折价，承保前要求披露事件 / 索赔率
      - - 私有指标不透明
        - 收入、毛利率、客户数和保修索赔披露
        - 管理层无法在尽调中提供 KPI 包、保修准备金趋势和渠道转化数据
        - 暂停估值工作；公开证据不足以给执行风险定价
      - - 领导层集中
        - 创始人之外的合作伙伴和产品归属授权
        - 公用事业 / 渠道项目没有清晰运营负责人或接班计划
        - 提高关键人折价，形成信念前要求治理 / 组织证据
    notes: 这些否决标准刻意设计成可观察项，应该对照月度经营复盘核查，而不是看叙事更新。
