  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行 / 上行触发项
    rows:
      - - 乐观
        - 公用事业项目转成已披露收入，Eaton 推动降本和分销，相邻业务开始变现
        - 情景估值区间 $1.0B-$1.3B；假设 SPAN 证明自己有资格相对中个位数公开可比倍数获得溢价
        - 需要收入转化、毛利率改善和合作伙伴带动规模的硬证据
        - 连续两次融资或运营更新披露增长，并有毛利率支撑
      - - 基准
        - SPAN 仍有差异化，但还是硬件主导，公用事业牵引逐步出现，公开披露不完整
        - 情景估值区间 $0.6B-$0.85B；锚在 2023 年 $600M 标记与更高公开可比倍数之间，并给战略溢价
        - 最符合当前公开证据
        - 没有重大新披露，但需求或融资也没有明显断裂
      - - 悲观
        - 住宅需求仍偏小众，公用事业周期继续很长，私募条款开始压过头部定价
        - 情景估值区间 $0.35B-$0.55B；假设平轮或下轮动态、稀释比叙事更重要
        - 如果试点停留在宣传层面、毛利率数据令人失望，该情景概率上升
        - 又一轮融资在接近或低于旧估值标记处出清
      - - 当前公开标记
        - Forge 显示 2026 年 3 月 Series C 估算为 $1.0B，而公开报道仍把 2023 年 $600M 作为最后一个明确估值标记
        - 把该标记当作尽调入口，而不是公允价值证明
        - 当前证据支持有边界的怀疑，而非自动接受
        - 任何新披露收入或股权结构数据，都可能大幅移动区间
    notes: 这些是情景区间，不是点估计。它们刻意不虚构 SPAN 收入，而是把公开证据转成决策区间。
