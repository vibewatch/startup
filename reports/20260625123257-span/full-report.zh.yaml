      - number: '6.4'
        title: 耐久性、集中度和客户牵引披露仍是主要开放尽调项
        blocks:
          - type: paragraph
            body: >-
              SPAN 的公开证据更擅长证明为什么有人会买，而不是证明有多少人已经购买、续约或扩张。保修条款、PowerUp
              行为和安装后应用功能显示公司在为长期客户关系建设，但这些是产品支持事实，不是牵引指标。公开材料没有披露活跃家庭数、已安装基础数量、应用参与度（轶事之外）、NRR、GRR、流失、合同期限中位数、头部客户集中度、安装商渠道转化，或合作伙伴带来的收入占比。即便最强渠道统计也只是选择性片段，而不是
              cohort 表。因此，公开记录支持“需求表面可信、渠道动作可信”的结论，但不支持关于组合耐久性的结论。


              这个缺口在客户章节比在市场或产品章节更重要，因为未解决的问题是承销问题，不是认知问题。如果 PG&E、Eaton 和 Landis+Gyr
              成为大型分销杠杆，它们可以显著加速采用；如果少数合作伙伴驱动了大部分可见牵引，它们也可能掩盖集中度或经济性问题。同样，客户证言和评测共识有助于建立契合，但不能回答 SPAN
              是否拥有广泛、可复制的漏斗，还是只是对高痛点电气化项目有说服力的故事。因此，下一步尽调应转向量化：索要已安装基础数量、合作伙伴来源与直接赢单的对比、安装商成交率、续约和保修索赔
              cohort，以及任何显示用户是否会从一个产品逐步扩展到电池、Drive 或公用事业项目的数据。
