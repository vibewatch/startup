      - CR044
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 原因
      - 投资含义
    rows:
      - - 建议
        - 继续研究
        - 公开融资支持强，但公开运营披露弱
        - 不要只按头部轮次规模承保
      - - 信心
        - 中
        - 估值方向清楚，但关键财务输入仍是私有数据
        - 定价前推动一手尽调
      - - 风险评级
        - 高
        - 硬件成本、公用事业周期节奏、稀释 / 优先权积压都可能大幅影响价值
        - 要求下行保护或更低进入价格
      - - 估值立场
        - 偏高
        - 唯一可见的 2026 年私募标记相对稀少公开指标显得激进
        - 相比头部后期轮估值标记，倾向打折进入
      - - 决策含义
        - 继续跟踪，除非尽调补齐缺口
        - 公司也许值得溢价，但公开记录今天还没证明这一点
        - 有选择、重价格纪律地接触
    notes: 这些判断只基于公开证据，并刻意把公司质量和进入价格质量分开。
