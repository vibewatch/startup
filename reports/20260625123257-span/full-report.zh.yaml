  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：买家有三种方式解决这件事
        blocks:
          - type: paragraph
            body: >-
              竞争集比“智能面板创业公司对智能面板创业公司”更宽。公开对比报道和供应商材料把市场拆成三条买家路径：完整面板替换、在现有面板旁加装负荷管理，以及传统面板配监控型替代品。Span 和 Schneider
              站在替换一侧，承诺为太阳能、储能、EV 充电和停电控制提供更干净的架构。Lumin 和 Eaton 从改造一侧攻击同一个买家问题，承诺无需完整换板也能获得有意义的控制。Enphase、Tesla 和 GM
              更多通过生态竞争，它们已经掌握逆变器、电池、EV 或应用关系；对真正购买动因是备电编排而非全回路控制的买家来说，这可能已经足够。这个框架很重要，因为 Span
              最强的胜利发生在买家本来就预期要动面板时；如果面板可以原地保留，它的优势就弱一些。
