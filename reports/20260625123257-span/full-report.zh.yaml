      - number: '3.3'
        title: 定价透明度和安装商渠道与功能同样重要
        blocks:
          - type: paragraph
            body: >-
              Span 和 GM 在公开定价上最透明，但 Span 的公开叙事里也有一个有用矛盾。官方 Span 面板页面宣传硬件起价 $2,550，而一家分销商博客引用硬件约 $4,500、安装后超过
              $8,000。这个差距不一定意味着任一数字为假；它意味着买家仍需要渠道背景，才能知道自己实际比较的配置是什么。Lumin 的公开定价故事更清楚，评测报道把它在硬件和安装总成本上都放在 Span
              之下，前提是房主可以保留主面板。GM 作为生态竞争者异常透明，直接在自家网站列出套装价格。Schneider、Eaton 和 Tesla
              仍更依赖报价或套装驱动。它们的硬件可能有吸引力，但公开来源仍让真实全包成本难以比较，尤其当回路级优先级部件、安装人工或电池系统依赖进入物料清单之后。
