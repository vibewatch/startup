  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面和客户工作流
        blocks:
          - type: paragraph
            body: >-
              SPAN 不再只是一个高端断路器箱。公开栈现在包括五种型号的智能面板家族、SPAN Drive EV 充电器、SPAN Home 应用，以及面向公用事业的 SPAN Edge
              服务点设备。从客户工作流看，面板仍是系统锚点：它测量每个已连接回路，让房主在软件里调整优先级，并作为电池、太阳能和 EV 充电的集成点。Drive 把同一控制平面延伸到充电器，Home
              应用向房主展示实时回路、电池、太阳能和充电状态。Edge 则把同一套规避服务升级的逻辑移到电表插座，用于 PG&E PanelBoost
              等公用事业项目。这很重要，因为产品命题不只是“智能面板这个硬件”，而是跨房主应用、安装商工具、原生电池连接、EV
              充电和公用事业电网边缘项目的“电力编排层”。因此，最强产品证据是一个连接起来的工作流：从安装商定容和调试，到房主控制、停电优先级，再到公用事业或 DER 负荷塑形。
