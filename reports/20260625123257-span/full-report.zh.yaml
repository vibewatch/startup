      - number: '1.2'
        title: 领导层、治理和资本
        blocks:
          - type: paragraph
            body: >-
              在保留下来的第一手和公司发布来源中，Arch Rao 是唯一持续被点名的创始高管；2026 年初的 SEC 文件仍显示 Archan Rao 以首席执行官身份签署。Cathy Zoi
              是保留下来的官方材料中最清晰公开点名的董事，被呈现为清洁能源政策和规模化顾问。不过，除 Rao 和 Zoi 外，SPAN
              在保留下来的官方材料中没有提供完整公开董事会名单，后续章节不应假设未经独立记录支持的更广治理细节。资本形成比治理更清楚。SPAN 2023 年 4 月 Series B2 后累计融资达到 $231
              million；2025 年 9 月 Form D 显示又售出 $25 million；2026 年 1 月 Form D 显示在 $175.8 million 发行额中已售出 $163.3
              million。最佳公开估值信号也只是部分信号：官方文件省略估值，而 Forge 列出 2026 年 3 月 Series C 估值约 $1 billion。因此，SPAN
              是一家融资渠道强的后期风投公司，但在估值、收入和董事会构成上的公开披露仍不完整。
