      - number: '4.4'
        title: 资本充足性和融资依赖
        blocks:
          - type: paragraph
            body: >-
              SPAN 的资本形成可见；现金充足性不可见。SEC Form D 文件显示，2022 年 1 月有约 $90.0 million 发行，2023 年 3 月约 $100.0 million，2025 年 9 月约
              $70.1 million，2026 年 1 月提交的发行额为 $175.8 million，其中 $163.3 million 已售出。TechCrunch 把 2023 年 B2 融资与 $600
              million 估值相连；Latitude 报道称，SPAN 在 2026 年 Series C 前已融资超过 $200 million，并将最新轮资金用于加深向公用事业基础设施的转向。Eaton 2026 年
              3 月另投 $75 million，给财务轮之上又加了一层战略资本，并明确把资金与更广分销、联合开发和低成本部署相连。


              这段融资历史降低了近期生存性融资风险，但不能解决跑道问题。没有公开来源披露账上现金、月度烧钱、债务能力、库存融资、项目特定义务或下一次资本触发点。产品路线图也有两面性：SPAN Edge、本地 API /
              本地部署能力和 XFRA 都扩大可寻址市场，但每一项很可能都需要工程、营运资本、渠道赋能和项目管理支出，收入贡献之后才会显现。正确结论是，SPAN
              看起来可融资，也有战略支持，但仅凭公开证据仍无法承销自我融资、稀释风险或达到盈亏平衡的时间。
