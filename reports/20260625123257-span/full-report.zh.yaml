  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、许可和合同表面
        blocks:
          - type: paragraph
            body: >-
              SPAN 最核心的非技术风险在于，它的价值主张落在家庭里受监管、受检查、合同约束很重的一环。公司确实做了降风险工作：最新面板拿到 UL 3141 认证，SPAN 和 Solar Power World
              都把该认证放在 2026 National Electrical Code 电力控制系统合规语境下解读。但认证不能消除地方许可摩擦。SPAN 自身条款把许可责任推给用户，而 Los Angeles
              建筑许可指南显示，许多电气项目开工前仍要经过图纸审查和许可签发。也就是说，即便核心硬件已获认证，销售速度仍可能被 AHJ 解读、公用事业规则和安装商文书拖慢。法律层也不能忽视。SPAN
              条款要求仲裁和放弃集体诉讼，并写明产品与账户断开、停止使用平台后，产品将不再可用。再叠加保修条款——覆盖范围绑定授权安装、调试、代码合规和依赖互联网的更新路径——监管 / 法律表面风险不是单一诉讼标题，而是累积的
              go-to-market 阻力和客户摩擦风险，可能压低转化、制造索赔争议，并收窄可接受的部署场景。
            claimRefs:
