  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 观察到的 2025 年收入 / 销售额
      - 观察到的 2026 年 6 月市值或 EV 标记
      - 收入倍数信号
      - 相关性
      - 局限
    rows:
      - - Eaton
        - $27.4B 销售额
        - $157.1B 市值；Multiples 显示 6.0x EV/Revenue
        - ~5.7x 市值 / 销售额代理；6.0x EV/Revenue
        - 最接近的成熟电气设备龙头，具备制造和渠道规模
        - 规模远大于 SPAN，业务更多元，盈利能力也强得多
      - - Schneider Electric
        - €40.152B 收入
        - $181.24B 市值；机械行业筛查显示约 4.0x 收入
        - ~4.5x 市值 / 收入代理
        - 展示全球电气化龙头如何靠规模和软件组合实现价值出清
        - 全球自动化范围远宽于 SPAN 的住宅根基
      - - Generac
        - $4.2B 净销售额
        - $16.72B 市值
        - ~4.0x 市值 / 销售额代理
        - 有用的硬件加能源控制类比，覆盖住宅和备用电源敞口
        - 以发电机为主的组合并非智能配电盘的直接类比
      - - Enphase Energy
        - 本章未从官方申报中留存；能源科技筛查显示 4.4x 收入、15.2x EBITDA
        - $6.30B 市值；能源科技筛查显示约 4.4x 收入
        - ~4.4x EV/Revenue 倍数
        - 有用的能源控制和住宅电气化参照点
        - 此处收入基础来自分析师市场数据筛查，而非留存公司申报
      - - Landis+Gyr
        - $1.166B 净收入
        - $1.62B 市值
        - ~1.4x 市值 / 收入代理
        - 留存样本中最好的公用事业相邻电网边缘参照
        - 重计量模式可能低估差异化家庭控制可获得的价值
    notes: 该表混合使用市值代理和筛查报告中的 EV/revenue（如可得）。它是估值边界工具，不是主张 SPAN 应该完全按某个单一可比公司交易。
    enumerationScope:
      coverage: sample
      basis: >-
        Rows cover the public comparables most relevant to SPAN's electrical-hardware, residential energy-control, and
        utility-edge valuation debate, not the full smart-home universe.
