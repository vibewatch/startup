      - number: '1.4'
        title: 里程碑和公开风险
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，公司已迅速从住宅面板替换故事转向更宽的基础设施平台。官方来源把 SPAN 的运营历史追溯到 2018 年，把商业面板销售追溯到 2020 年，把 SPAN Drive 追溯到 2022 年，把
              $96 million B2 轮追溯到 2023 年 4 月，把 Landis+Gyr 公用事业合作追溯到 2024 年，并显示 2025–2026 年间开发商、公用事业和本地控制发布密集出现。2025 和
              2026 年 SEC 文件显示，随着扩张加速，SPAN 继续筹集有意义的私募资本。主要公开风险不是法律或监管困境，而是采用经济性。独立评测和新闻来源反复把 SPAN
              描述成功能丰富但价格高端，核心智能面板市场仍相对较小，并暴露在屋顶太阳能和 EV 采用放缓之下。Canary
              还指出一个重要战略挑战：更低成本的智能电表和设备级控制可能覆盖同一用例的一部分，而无需专用智能面板。这意味着 SPAN
              的上行取决于能否证明，其硬件加软件控制层创造的节省、韧性和公用事业价值，足以抵消更高前期成本和竞争替代品。
