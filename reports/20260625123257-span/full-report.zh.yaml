        - id: n6
          label: 销售周期更长 / 转化更低
          description: 客户摩擦或许可流程拖慢成交率。
        - id: n7
          label: 利润率压缩 / 支持负担
          description: 劳动力、赋能或服务成本升高，吃掉单位经济性。
        - id: n8
