      - number: '4.2'
        title: GTM 动作、渠道结构和销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              SPAN 的 go-to-market 动作高接触、由渠道中介。公司要求由 SPAN
              授权的持证电工安装，让房主和分销商通过线索表单进入，并用返利、培训、更快安装和免费线索流向安装商推介。这意味着销售效率较少取决于消费者结账转化，更多取决于合作伙伴赋能、安装商教育，以及被嵌入太阳能加储能、EV
              充电、HVAC 和翻修等更广电气化项目。安装商页面中“17 条免费线索产生 $259,000 收入”的证言不足以承销 CAC 或回收期，但它确实显示 SPAN 在主动补贴渠道需求生成，而不是只依赖自然拉动。


              2026 年，分销广度显著改善。Eaton 合作让 SPAN 触达更大的安装商、分销商和住宅开发商版图；PG&E 的 PanelBoost 项目和 Latitude
              描述的更早公用事业试点，则显示公司也在争取公用事业赞助需求。这些都是有意义的收入质量正面因素，因为它们可以缩短客户获取摩擦，降低每次安装的全负荷成本。即便如此，公开来源没有披露转化率、销售周期长度、安装商流失、返利负担或渠道总额到净额调整。承销结论是，SPAN
              似乎正从精品式直接需求创造走向合作伙伴分销规模化，但公开记录仍缺少判断这种扩张动作是否高效所需的单位数据。
