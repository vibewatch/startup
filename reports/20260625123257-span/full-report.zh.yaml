      - number: '8.2'
        title: 公开可比公司和倍数敏感性
        blocks:
          - type: paragraph
            body: >-
              SPAN 不披露收入，公开估值纪律最好靠可比上市公司给叙事划边界，而不是假装能精确建一个 DCF。相关组合混合了成熟电气龙头、住宅能源生态供应商和公用事业相邻控制业务：Eaton、Schneider
              Electric、Generac、Enphase 和 Landis+Gyr。它们商业模式差异很大，但仍能给出有用信号。成熟电气龙头 Eaton 和 Schneider 处在中个位数收入倍数区间。Generac
              把硬件、备用电源和家庭能源控制放在一起，按市值代理口径也大约是四倍 trailing sales。Enphase 在本报告保留的能源科技筛选口径下也落在相近区域。Landis+Gyr
              更偏公用事业计量和电网基础设施，倍数明显更低。这个分布很重要，因为 SPAN
              现在是在要求市场给一家未披露经济性的私营硬件主导公司估值，位置介于高端能源科技可选性和基础设施现实之间。没有披露收入，可比公司组不能给出公允价值；它只能说明，相邻模式的公开出清区间很宽、带周期性，而且在增长或利润率证明薄弱时，远比创投叙事更不宽容。
