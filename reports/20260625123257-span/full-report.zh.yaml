  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Span 比广义 HEMS 窄，但比简单面板替换 SKU 宽
        blocks:
          - type: paragraph
            body: >-
              定义 Span 市场，最干净的方式是把它看作住宅电力编排基础设施，而不是泛智能家居设备。分析师的 HEMS
              类别包括硬件、软件和服务，用于监控并优化住宅的用电、发电、储能和电价响应，覆盖恒温器、照明控制、高级控制器和联网电器。Span 明显与这个类别重叠，因为其面板、应用和 PowerUp
              负荷管理层提供回路级可视化、动态控制，并协调 EV 充电、HVAC、太阳能、储能和备电用例。但广义 HEMS 类别也包括很多 Span
              并不直接销售的产品，同时排除了公用事业侧电网管理平台和独立发电硬件。因此，自上而下的 HEMS 估算是有用背景，不是 Span 当前可寻址收入池的直接同义词。


              公司公开材料还显示，Span 参与了不止一个商业化层级。在房主侧，Span 营销全屋可视化、回路级控制和电器级灵活性。在开发商侧，它把负荷管理卖成一种避免 400A
              扩容、让新房具备全电准备的方法。在公用事业侧，它通过 Span Edge 和 PowerUp 销售电网边缘负荷塑形和服务升级规避。Eaton 和 Landis+Gyr
              把同一逻辑延伸到更广的承包商、住宅开发商和公用事业渠道。因此，用于估值的正确边界，是智能面板、内嵌能源管理软件和电网边缘灵活性的交集——既不是整个住宅能源技术宇宙，也不只是狭窄的替换面板单项。
