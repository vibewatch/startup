  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 描绘典型房主或承包商主导路径：从电气化痛点出发，走到安装，再进入后续互动。
    data:
      items:
        - id: stage-trigger
          label: 痛点触发
          actor: 房主、承包商、建筑商或公用事业项目团队
          description: 电池、EV 充电器、热泵、翻新或全电化设计带来服务容量、备电或成本问题，标准配电盘很难干净解决。
          channels:
            - 电池备电
            - EV / 热泵加装
            - 建筑商设计
            - 公用事业电气化项目
        - id: stage-intake
          label: 线索接入与匹配
          actor: SPAN Home Advisor + 授权安装商网络
          description: 潜在客户从 Get Started、转介绍或合作伙伴动作进入，随后被分流到授权安装商或专业渠道，而不是直接电商购买。
          channels:
            - Get Started
            - 转介绍 / VIP 接入
            - Installer Match
            - 合作伙伴销售渠道
        - id: stage-scope
          label: 项目界定
          actor: 授权安装商、建筑商、HVAC 或太阳能合作伙伴
          description: 安装商选择配电盘规格，判断 Drive、电池或 SPAN Edge 是否适配项目，并用避免升级或提升备电控制来解释经济性。
          channels:
            - 授权电工
            - 太阳能 + 储能安装商
            - HVAC 承包商
            - 建筑商 / 开发商
        - id: stage-install
          label: 安装与调试
          actor: 授权安装商 + 房主
          description: 安装商通过 installer app 安装并调试 SPAN；完成后，房主用 app 监控、控制并管理能源。
          channels:
            - 许多住宅可在 3-8 小时内更换配电盘
            - installer app 调试
            - app 上手引导
        - id: stage-expand
          label: 扩展与互动
          actor: 房主、安装商，有时还有公用事业合作伙伴
          description: 安装后的价值来自电池优先级、光伏充电、成本洞察、转介绍，或后续加入建筑商、公用事业及合作伙伴主导的扩展项目。
          channels:
            - 电池管理
            - 光伏充电
            - 成本洞察测试版
            - 转介绍 / 公用事业项目
    approximationNotes: 这是基于公开信息合成的旅程，不是 SPAN 内部漏斗图；实际顺序会因渠道而异。
