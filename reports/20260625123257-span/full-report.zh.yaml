      - number: '8.3'
        title: 私募指标稀疏下的情景区间
        blocks:
          - type: paragraph
            body: >-
              情景分析必须明说哪些是已知，哪些是假设。上行情景不是「SPAN 很酷」，而是一条具体链路：Eaton 的制造和分销压低安装成本摩擦；PG&E、Landis+Gyr
              这类公用事业项目转化为已签约的经常性收入或可重复部署收入；电网边缘基础设施、XFRA 等新相邻业务不只是宣布，而是真正变现。在这种世界里，十亿美元级头部估值可以被解释为对更大能源控制平台的期权。基准情景更保守：把
              SPAN
              视作一家硬件加控制公司，确有差异化，但单位经济性和公用事业收入转化的公开证明仍有限，因此估值区间更接近成熟公开可比公司，再加一层战略溢价。下行情景很直接：住宅需求仍是小众，公用事业周期继续缓慢；一旦私募条款和稀释比叙事更重要，下一轮融资可能持平或下调。公开记录缺少收入、利润率和现金数据，因此这些区间是入场纪律的决策带，不是公允价值估计。这正是本章里反论点与论点同样重要的原因。
