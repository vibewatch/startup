        - 授权安装商网络
        - 项目交付、调试和保修资格
        - 高
        - 安装商稀缺、培训质量弱，或报价不一致拖慢转化
        - 高
        - SPAN 安装商项目和合作伙伴扩张
        - 高——安装商网络质量直接决定吞吐量和保修有效性
    notes: 如今每条主要增长路径都要经过外部交易对手，因此合作伙伴质量既是优势，也是集中风险。
