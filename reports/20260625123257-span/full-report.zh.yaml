      - number: '2.4'
        title: 增长驱动和瓶颈：电气化、灵活性和成本规避有帮助，但采用仍取决于可负担性、法规和证明
        blocks:
          - type: paragraph
            body: >-
              需求逻辑很直接。EIA 称美国用电量已恢复增长；IEA 称随着用电上升，电力系统需要显著更多灵活性；多个独立来源显示，家庭正把 EV
              充电、热泵、太阳能、储能和自动化捆成一个系统级决策。这种环境利好能实时协调负荷的技术。分析师报告也把 AMI 饱和、动态定价、太阳能加储能采用、返利叠加和公用事业需求响应参与，列为 HEMS
              和电网互动型家庭基础设施的顺风。对 Span 而言，与 Eaton、PG&E 和 Landis+Gyr 的合作强化了渠道命题：负荷编排既能作为客户产品销售，也能作为赋能公用事业的平台销售。


              瓶颈同样重要。传统面板和服务升级仍昂贵、缓慢，且行政流程混乱；这种摩擦为 Span
              创造需求，也会拖慢项目转化，因为买家仍要面对复杂电气工程。一体化系统在额外电气工作之前就已经昂贵，网络安全和互操作性担忧仍会劝退家庭，2025
              年政策扰动之后州级激励设计也不均衡。对投资者最重要的是，公开证明仍落后于产品逻辑：这里没有来源支持的公开视图，说明 Span
              的已安装基础转化率、按渠道留存、公用事业项目单位经济或收入组合。因此，本章支持一个真实且增长中的市场，也支持强瓶颈驱动的切入点，但保留了类别吸引力与 Span 具体市场捕获之间的重大证据缺口。
            claimRefs:
              - CM026
