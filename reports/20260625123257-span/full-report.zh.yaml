      - number: '7.3'
        title: 合作伙伴、渠道和公用事业依赖
        blocks:
          - type: paragraph
            body: >-
              SPAN 现在的扩张路径不只靠产品自然拉动，而是穿过交易对手。Eaton 是重大利好：它投入 $75 million，带来电路 / 浪涌硬件，也打开广泛的安装商和建筑商渠道；同时它也是依赖项，因为 SPAN
              明确借助 Eaton 的分销和联合开发方案来降成本、提采用。公用事业侧也是同一模式。PG&E 的 PanelBoost 和 Landis+Gyr 合作强力验证了 SPAN Edge
              在电网边缘有价值，但也说明公用事业渠道规模取决于伙伴安装项目、公用事业预算和多年部署兑现。PG&E 公开材料说的是 2026 年夏末开始先扩到数千客户，并非成熟的大范围铺开；Landis+Gyr 自身叙事也强调其
              AMI 覆盖是 go-to-market 路径。住宅产品线仍看得到渠道集中，因为保修有效性和调试依赖授权安装商。领导力集中进一步放大执行风险：几乎每一份保留的伙伴和公用事业公告里，被引用的创始人 / CEO 都是
              Arch Rao。这并不说明模式坏了，而是说明 SPAN 下一阶段的核心不再是证明面板存在，而是证明伙伴主导分销、公用事业销售周期、安装商赋能和创始人牵头执行，能在不漏掉毛利、不拖延时间线的情况下规模化。
