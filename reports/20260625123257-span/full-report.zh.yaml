      - number: '2.3'
        title: 买方、付款方和用户地图：经济买家随渠道变化，但用户问题始终是负荷编排
        blocks:
          - type: paragraph
            body: >-
              Span 不是用一个产品动作卖给一个买家。在改造项目中，终端用户是房主，直接渠道通常是电工、太阳能加储能安装商或 EV 充电器安装商；EnergySage 的 2026
              年市场证据显示，房主越来越把家庭能源看成一个一体化系统，而不是孤立产品。在这个动作里，经济价值是增加 EV
              充电、热泵、电池或备电能力时，避免或推迟电气升级。在新建住宅中，买家更常是开发商或开发项目方，他们关心电力物料清单节省、工程和公用事业等待时间缩短，以及电气化合规。Span 明确主张，开发商可以避免 400A
              服务扩容、每个项目节省数千美元；Pulte 的公开背书说明开发商采用至少是一条有意义的商业路径。


              公用事业是第三类不同买家。Span 的公用事业材料、PG&E 的 PanelBoost 发布和 Landis+Gyr 合作都把产品描述为一种推迟配电升级、管理服务设定点，并把住宅纳入需求灵活性或 VPP
              项目的方法。这个买家不是优先为房主愉悦感付费，而是为避免资本开支、负荷可视性和电网韧性付费。三个细分市场的共同主线，是同一个终端用户工作流——在住宅内部添加并协调高负载电气化设备；但预算所有者、采购路径和价值证明指标会随细分市场显著变化。这个分层很重要，因为今天的公开证据支持三条渠道都有可信触达，但不支持它们在成熟度或渗透率上相同。
