  - id: TV005
    title: 论点破裂和否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 平轮或下轮融资
        - 下一轮定价在旧估值标记处或以下出清
        - 表明叙事增长尚未转成出清价格支撑
        - 暂停，或要求明显更强条款
      - - 公用事业收入未转化
        - 合作伙伴公告继续出现，但没有披露已签约收入或推广节奏
        - 选择权价值停留在理论层面，支撑不了溢价倍数
        - 权重只转向住宅硬件经济性
      - - 毛利率令人失望
        - 扣除运费和保修后，毛利率明显低于健康电气设备基准
        - 削弱软件或控制能力可抵消硬件强度的论点
        - 重估至可比区间低端
      - - 安装成本压缩停滞
        - Eaton 规模和渠道杠杆没有缩小 MSRP 与安装价格之间的差距
        - 削弱家庭 ROI 和销量扩张假设
        - 降低对乐观情景的信心
      - - 优先权积压加深
        - 新钱附带的股息、清算优先权或优先级重于公开线索暗示
        - 头部估值高估新老持有人普通股价值
        - 只按完全摊薄并经优先权调整后的条款承保
    notes: 这些是决策触发项，不是抽象风险：每一项都会直接改变价格纪律。
    claimRefs:
