  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和定价信号
        blocks:
          - type: paragraph
            body: >-
              尽管已实现财务产出不可见，SPAN 的变现方式在产品和渠道层面可见。公司通过授权安装商渠道，而不是自助式直接电商模式，销售多种形态的智能配电面板、SPAN Drive EV 充电配件和 Remote Meter
              Kit。官方 MSRP 现在从 MLO 24 的 $2,550 到 MAIN 40 的 $4,100 不等，SPAN Drive 标价 $750，Remote Meter Kit 标价 $795。Business
              Wire 和公司产品页面显示，SPAN 在 2025 年用 MAIN 16 和 MLO 24 扩大产品族，因此不仅覆盖高端独栋住宅改造，也能触达小型住宅、ADU、子面板和多户住宅用例。


              同样重要的是未公开部分。SPAN 没有披露已实现 ASP、折扣、Drive 或 Remote Meter Kit 附加率，也没有披露住宅面板收入与更新的面向公用事业 SPAN Edge 产品线之间的拆分。2026
              年 2 月的 API 和本地部署发布扩大了产品能力，但没有形成清晰披露的独立软件订阅线；OTA 更新仍免费，本地 API 由社区支持。因此，本章收入结论很直接：SPAN 有真实硬件价目表和多个可变现
              SKU，但公开证据仍支持一个硬件加安装主导的业务，软件更多是产品差异化，而不是单独披露的收入桶。
