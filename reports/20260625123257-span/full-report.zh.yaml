    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份和商业模式
        blocks:
          - type: paragraph
            body: >-
              SPAN 把自己定位为一家要拆掉家庭电气化中配电面板瓶颈的公司。保留下来的官方页面把核心产品描述为一个软件定义的电力平台：SPAN Panel 提供回路级可视化和控制，SPAN Drive 把控制延伸到 EV
              充电，SPAN Home 或本地工具提供操作层，把电力基础设施变成能源管理产品。SEC 披露的当前法律实体是 Span.IO, Inc.，一家特拉华公司，主要营业地点位于旧金山 Bryant Street 679
              号。公司公开材料反复把 SPAN 的建设周期起点放在 2018 年；如今公司不仅向房主销售替换面板，也面向开发商、开发项目和公用事业销售产品，目标是降低服务升级成本。简言之，SPAN
              卖的是高端电力硬件加内嵌软件，并越来越多地把同一套控制栈变现到住宅、公用事业和电网边缘场景。
