      - number: '7.2'
        title: 产品可靠性、网络安全和经济性风险
        blocks:
          - type: paragraph
            body: >-
              核心产品风险是，SPAN 仍要求客户为联网电气面板支付明显溢价，而它最强的收益只在特定用例里显现。官方 MSRP 从 $2,550 起，常见的 MAIN 32 安装前起价 $3,500；EnergySage
              则把标准 200A 面板更换成本放在约 $1,000 到 $3,000。独立评测显示，SPAN 完整安装项目约 $6,500 到
              $10,000；若需要服务升级或捆绑硬件，成本有时会显著更高。正因为有这道成本差，负面评测反复指出，SPAN
              最说得通的场景是替代另一项成本，比如服务升级、关键负载子面板或额外电池容量；没有这些抵消项，面板就容易显得可有可无。可靠性和网络安全态势不是坏掉，而是好坏参半。Eaton
              称联合方案符合严格的网络安全和安全设计标准；SPAN 的本地 API / on-premise 版本也在云端失效时给出真实兜底路径。但本地兜底仍处于 beta，初期只支持 MAIN 32；API
              明确由社区支持，不在保修 / 支持范围内；保修也排除不中断 /
              无错误运行，以及与互联网或蜂窝连接丢失相关的故障。承保结论很清楚：产品具备战略价值，但高价、云依赖、有限的公开现场故障数据，以及本地控制推出不均，都会带来真实的采用和支持风险。
