  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 已确认收入
        - 当前收入在配电盘、配件、公用事业项目以及任何软件 / 服务之间的拆分
        - 没有收入，私募轮次就无法和上市可比公司干净对标
        - 管理层数据室或投资人演示稿
      - - 毛利率
        - 扣除货运、质保以及安装商 / 渠道成本后，各产品线毛利率
        - 决定 SPAN 应按硬件倍数定价，还是接近软件倍数
        - 财务工作流，附产品线桥接表
      - - 公用事业转化
        - PG&E、Landis+Gyr 及类似项目的已签 backlog、部署数量和收入确认节奏
        - 这是从高端住宅叙事走向基础设施式规模的主桥
        - 商业尽调，结合客户与合作伙伴访谈
      - - 股权结构与优先权
        - 各轮清算优先权、股息、转换比例和参与分配条款
        - 标题式投后估值可能扭曲真实入场经济性
        - 法务 / 融资尽调，核对章程文件
      - - 现金续航
        - 在当前招聘和部署假设下的现金余额、月度 burn，以及 12 至 24 个月融资计划
        - 决定稀释风险和下一轮融资紧迫度
        - 财务尽调与董事会材料
      - - 安装成本 cohort
        - 按房主类型和项目复杂度拆分的安装成本与 ROI 数据
        - 检验降本和规避服务升级是否真的能拓宽市场
        - 安装商渠道 cohort 分析
    notes: 每个问题都对应一个已知估值盲点，而不是泛泛的尽调愿望清单。
    claimRefs:
