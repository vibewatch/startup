      - number: '3.2'
        title: 产品范围和互操作性决定谁进入候选名单
        blocks:
          - type: paragraph
            body: >-
              Span 最清晰的产品优势是范围。公司公开营销 16 到 48 个可控回路、每个回路远程控制，以及一个不断扩大的原生栈，现在已通过 SPAN Drive 延伸到 EV 充电。Lumin
              是最强的直接反方：它避免换面板，并声称与现有面板、电池和太阳能普遍兼容，但独立评测报道仍把直接智能控制描述为仅限所选回路。Schneider 和 Eaton
              各自用既有电气硬件优势竞争，但也带来平台约束：Schneider 绑定 Square D QO 断路器，Eaton 当前 AbleEdge 版本则主要绑定 Eaton BR 面板和 2-pole
              高耗电负载。Enphase、Tesla 和 GM 都提供有意义的家庭能源控制，但公开产品表面更窄，也更受生态门槛限制。实践中，Span 更容易赢下“全屋单一神经系统”的论点，而不是“最少扰动升级”的论点。
