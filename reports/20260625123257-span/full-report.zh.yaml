  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层围绕电气化受约束项目，而不是大众市场面板替换
        blocks:
          - type: paragraph
            body: >-
              即便准确客户数不可见，SPAN 的公开分层很清楚。公司没有把自己营销成商品断路器箱；它反复瞄准正在增加电池、EV
              充电、热泵、电磁炉或重大翻修，且可能触发昂贵服务升级的房主。同一表面也扩展到专业买家和影响者：试图让新建全电住宅保持在 400A 服务以下的开发商、试图挽救原本会卡在电气范围上的项目的 HVAC
              承包商、寻求差异化备电体验的太阳能加储能安装商，以及试图避免昂贵二级系统升级的公用事业。这种模式很重要，因为它说明底层客户决策通常是经济和物流问题，而不是审美问题。当买家看到可避开的升级成本、更简化的备电设计、更快项目节奏或未来扩展灵活性时，SPAN
              才会赢。


              因此，买家、用户和付款方并不总是同一个人。在房主改造中，房主付款，安装商指定方案，应用用户是想更好控制电池、EV 或电器负载的住户。在开发商和 HVAC 渠道中，承包商或开发商可能成为经济冠军，因为 SPAN
              帮助在最终住户成为日常用户之前守住成交率或设计利润。在 PG&E PanelBoost 等公用事业项目中，公用事业帮助塑造报价，但房主仍承担电工和电器布线工作。公开定价支持这个框架：SPAN 发布
              MSRP，但最终经济性仍按项目而定、由安装商中介；这符合一种卖进受约束、范围繁重项目的解决方案，而不是自助消费设备。
