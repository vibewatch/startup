      - 对承销的影响
      - 眼下为何重要
      - 精确尽调路径
    rows:
      - - 收入和收入结构
        - 无法判断规模、attach rate，或硬件与公用事业产品之间的结构迁移
        - 没有已确认收入，定价和需求信号仍停留在定性层面
        - 索取过去 12 个季度按面板、配件、公用事业和其他类别拆分的收入
      - - ARR / 经常性软件或服务
        - 无法判断 SPAN 应该套用硬件估值逻辑，还是混合硬件-软件估值逻辑
        - 软件在战略上看起来重要，但公开资料没有披露经常性收入科目
        - 索取经常性软件、监控和服务收入，以及续费和流失数据
      - - 毛利率和保修准备金
        - 无法判断高端定价是否转化为可持续产品经济性
        - 硬件业务价格看起来可能诱人，却把保修或运费拖累藏起来
        - 索取产品级毛利率桥表，纳入运费、保修和支持负担
      - - 现金、烧钱和跑道
        - 无法判断融资依赖或稀释时点
        - 路线图扩张速度快于公开现金披露
        - 索取月度烧钱、期末现金，以及按情景拆分的 18 个月跑道预测
      - - 客户数 / 安装基数
        - 无法评估市场渗透率、cohort 质量或更换 / 附加机会
        - 公用事业试点和安装商证言不能替代安装基数数据
        - 索取累计安装量、活跃 App 家庭数，以及按渠道拆分的 cohort 增长
      - - 公用事业合同经济性
        - 无法判断 SPAN Edge 是试点偏多，还是可商业化复制
        - 公用事业扩张是最新融资叙事的核心
        - 索取已签公用事业合同、收入确认政策，以及按部署类型拆分的毛利率
    notes: 这些缺口对私营公司而言是结构性且重大的；仅靠公开标价或新闻稿无法解决任何一项。
