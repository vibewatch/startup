      - number: '5.2'
        title: 架构、互操作性和运营模式
        blocks:
          - type: paragraph
            body: >-
              公开架构足够具体，可以重建主要运营层。在硬件边界，SPAN Panel 和 Edge 都把计量、分支或服务级控制，以及围绕 100–200A 住宅服务定容的电力管理逻辑结合起来。面板线明确绑定
              PowerUp，这是 SPAN 用来节流或排序负载的软件层，让电气化住宅能留在服务约束之内。Drive 随后通过 RS485 连接回面板，使 EV
              充电成为另一个可控负载，而不是孤立充电器。电池和太阳能集成更微妙：MAIN 32 拥有最深的原生电池矩阵，而更新的 MAIN 16、MLO 24、MAIN 40 和 MLO 48
              目前公开显示的受支持储能矩阵更窄。太阳能监测可以来自分支测量、储能集成或 Enphase
              CT，支持文档也明确表明安装商侧配置是产品的一部分。结果是一个具备真实互操作性的架构，但它仍高度依赖兼容储能供应商、安装商设置和按型号划定的支持边界，而不是普遍即插即用。
