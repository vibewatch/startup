      - number: '1.3'
        title: 合作伙伴、渠道和扩张
        blocks:
          - type: paragraph
            body: >-
              判断 SPAN 当前阶段，最重要的公开信号是围绕其控制栈的已验证渠道伙伴足够广。Landis+Gyr 和 PG&E 验证了公用事业路径：SPAN Edge
              被作为表端产品销售，可帮助公用事业推迟变压器和服务升级成本；PG&E 计划通过 PanelBoost 先向数千名客户推出。Eaton 提供另一种验证：其 2026 年战略合作包括 $75 million
              投资、通过 Eaton 安装商和开发商网络进行广泛分销，以及计划在 2026 年 Q2 推出的联合开发解决方案。Jabil 支撑制造规模，PulteGroup 则证明开发商把 SPAN 的新面板配置视为避开更昂贵
              400A 升级的方法。SPAN 也在用公开本地 API 和本地部署控制体验拓宽软件层，并把同一套电力控制命题延伸到与 NVIDIA 宣布的分布式计算产品 XFRA。值得注意的是，保留下来的来源验证了
              Eaton、Landis+Gyr、PG&E、Jabil 和 PulteGroup 关系，但没有验证提示中提到的 GM 或 Ford 合作线索。
