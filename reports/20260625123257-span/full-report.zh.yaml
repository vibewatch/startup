      - number: '7.4'
        title: 缓释框架和否决标准
        blocks:
          - type: paragraph
            body: >-
              看待 SPAN
              风险，既不应预设它马上崩盘，也不应盲信其品类领导地位。公司已有足够资本和伙伴验证，尽调的关键问题转为传导：哪些可观察失败，会把一个看似成立的电气化平台，打回过度工程化的高端面板生意？最高信号的监测项很直接。如果
              AHJ 或公用事业项目在实践中不接受基于 UL 3141 的服务升级规避，SPAN 就会失去最强经济楔子之一。如果 Eaton、PG&E 或 Landis+Gyr
              时间线滑坡，就必须下调公用事业和建筑商规模假设。如果本地控制支持仍局限在少数
              SKU，同时停机或连接投诉上升，可靠性叙事会变弱。如果公开证据或尽调专属证据显示，项目最终仍经常需要服务升级，价值主张就会被压缩成昂贵硬件。如果管理层拿不出安装商转化、毛利、保修索赔发生率和安装后经济性，近期融资只能证明融资通道仍开着，不能证明业务质量。实际缓释动作因此是：在把
              SPAN 当成已降风险的电网边缘平台之前，必须围绕许可、索赔率、安装商经济性和伙伴合同做硬尽调。否决标准可量化，也应强硬使用。
