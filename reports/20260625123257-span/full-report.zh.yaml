      - number: '4.3'
        title: 成本结构、利润率驱动和营运资本影响
        blocks:
          - type: paragraph
            body: >-
              SPAN 应被当作硬件加控制业务来分析，而不是纯软件。面板经济性必然吸收箱体和断路器硬件、电力电子、传感和通信组件、认证和保修成本、安装商调试，以及云连接应用环境的支持。Eaton 和 Canary
              的披露把利润率故事说得很清楚：它们强调制造规模、供应链实力和降本是合作的核心理由。换句话说，即便管理层最看好的战略合作，也围绕降低产品成本和扩大分销来叙述；这正是硬件规模比软件毛利率观感更重要时公司会说的话。


              公开可比公司强化了这个判断。Generac 2025 年报告显示，其住宅能源硬件组合毛利率为 39.5%，但也把现金流波动与营运资本积累、库存补货、关税、供应链动作和分销商依赖相连。对 SPAN
              来说，这些是有用的方向性类比，因为它们说明硬件业务在毛利率上可以看起来有吸引力，同时仍会通过渠道库存、组件采购和预测误差消耗现金。SPAN
              没有提供公开毛利率、保修准备金或库存数据，因此公司外部无人能判断其经济性是否已经越过健康硬件基准，还是仍依赖高端定价和新资本来覆盖规模化摩擦。
