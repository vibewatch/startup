  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 驱动因素
      - 正方论点
      - 反方论点
      - 哪些证据会改变看法
    rows:
      - - 战略资本
        - Eaton 带来资本，也带来制造和分销杠杆
        - 战略投资者仍可能高价买入，或优先买选择权而非近期 IRR
        - 看到安装成本下降和真实渠道吞吐量证据
      - - 公用事业选择权价值
        - PG&E 和 Landis+Gyr 暗示 SPAN 可从高端住宅扩到更大市场
        - 试点或合作伙伴头条未必很快转成确认收入
        - 按项目拿到已签约公用事业收入和部署节奏
      - - 产品平台
        - Panels、Edge、Drive 和 XFRA 拓宽可讲述的可寻址市场
        - 更多产品也会在变现前扩大烧钱和营运资本需求
        - 看到按产品族拆分的贡献毛利率和资本强度
      - - 私募估值支撑
        - Forge 和 Caplight 显示 2026 年私募市场仍有实时关注
        - 替代数据筛查不足以验证公开市场出清价格
        - 直接核验普通股价格、股权结构和新钱条款
      - - 住宅经济性
        - 当 SPAN 能避免服务升级或电池过度配置时，经济性说得通
        - 如果住宅只需要基础配电盘更换，SPAN 可能只是昂贵奢侈品
        - 查看队列层面 ROI，以及各项目类型的安装成本压缩
    notes: 反方论点刻意与正方论点对称，让建议保持价格敏感，而不是被叙事牵着走。
