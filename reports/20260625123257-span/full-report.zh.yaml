      - number: '2.2'
        title: 规模视角：公开美元 TAM 存在，但物理瓶颈可能比泛市场标题更适合作为镜头
        blocks:
          - type: paragraph
            body: >-
              公开的自上而下分析师市场是真实的，但口径并不一致。Future Market Insights 估算 2026 年全球 HEMS 为 USD 4.71 billion，Mordor 则估算 2026
              年更广的家庭能源管理市场为 USD 4.43 billion、北美 HEMS 为 USD 1.72 billion。如果 Mordor 2025 年美国在北美收入中的份额延续，隐含的 2026 年美国收入视角约为
              USD 1.41 billion。这些数字方向上有用，尤其因为它们已经假设了经常性软件和偏 VPP 的价值，而不只是硬件销售。但它们并非同一类别，也没有隔离智能面板单一切片，或 Span
              按房主改造、开发商导入和公用事业项目渠道划分的可服务市场。


              更站得住脚、也有证据支撑的规模视角，是 Span 正在对准销售的痛点：面板和服务容量约束。NREL 称，在照常电气化情景下，62% 的住宅面临面板约束；Lawrence Berkeley Lab
              称，各州独栋住宅的容量和空间组合约束在 29% 到 91% 之间；一篇引用 Pecan Street 的 IJSAT 论文把全面电气化前潜在升级人群放在 48 million 户美国独栋住宅。仅 PG&E
              就估算，其辖区内未来十年超过 600,000 户住宅可能需要某种电力服务升级。这些数字不是干净的 SAM，但说明为什么 Span 的切入点按物理住宅数量看可能大于近期软件市场收入；同时，Span 的真实 SOM
              仍未解决，因为公开来源没有披露已安装端点、付费家庭或签约公用事业量。
