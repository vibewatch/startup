      - number: '4.5'
        title: 财务结论和尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              牛市逻辑清楚。SPAN 有真实硬件定价、正在扩大的 SKU 集，有证据显示产品可帮助客户避开昂贵电力服务升级，安装商渠道在增长，并从 Eaton
              和公用事业获得新的战略杠杆。这些要素支撑一条可信路径：销量更高、分销更广、制造经济性好于公司只销售单一高端面板配置时。公司也显然在试图把电网边缘智能变成不止房主加购，正把 SPAN Edge 和 XFRA
              推向公用事业及基础设施邻近市场。


              熊市逻辑是，几乎所有承销级指标仍是私有信息。公开来源没有揭示收入、ARR、已确认公用事业收入、毛利率、保修索赔、烧钱、跑道、客户集中度、已安装基础，或任何类软件层的续约行为。即便评测认可产品质量，也指出核心问题：当
              SPAN
              避免了更大电气支出时，它可以是一笔聪明购买；但当住宅不需要这种复杂度时，它就是昂贵炫技。这意味着公司可能在受约束电气化项目中拥有强产品市场契合，同时仍暴露于硬件利润率压力、安装商渠道摩擦和营运资本需求，而公开记录无法量化这些因素。因此，尽调应少问
              SPAN 是否创新，多问每个已安装项目是否产生足够毛利和现金转换，来支撑更广的电网边缘扩张计划。
