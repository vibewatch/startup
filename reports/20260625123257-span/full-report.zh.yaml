      - number: '8.4'
        title: 尽调要求和论点失效条件
        blocks:
          - type: paragraph
            body: >-
              最终判断的质量，取决于能推动判断变化的尽调路径。这里的要求不是装饰。投资方应要求公司提供：当前确认收入按住宅硬件、配件、公用事业项目，以及任何软件或服务层拆分；扣除运费、保修和渠道成本后的各产品族毛利；已签约
              backlog 以及试点或伙伴公告转为确认收入的真实转化率；还有 cap table 明细，列出每一轮的清算优先权、股息和转换条款。这些要求重要，因为 SPAN
              最大的公开利好，也是最容易讲成故事的风险。Eaton、PG&E、Landis+Gyr 和 XFRA
              都带来叙事上行，但它们支撑溢价估值的时间，可能远早于支撑公开市场级承保的时间。若公用事业部署主要停留在宣传层面，若安装成本压缩停滞，若下一轮定价低于当前头部锚点，或若毛利看起来更像家电公司而非软件增强平台，论点就会失效。在这些问题关闭前，正确的投资含义是带严格入场纪律的选择性接触，而不是无条件点头。
