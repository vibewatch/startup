      - number: '5.3'
        title: 安装商工作流、合规栈和控制平面成熟度
        blocks:
          - type: paragraph
            body: >-
              SPAN 的合规和运营成熟度故事好过泛泛的家庭能源营销，但仍以安装商为中心。面板家族公开 UL 67、UL 916、UL 869A、NEMA 3R 和 UL 3141 PCS 对齐；Drive 增加 UL
              2594、UL 2231、ENERGY STAR 和集成接地故障保护；Edge 发布初步认证组合，包括 UL 414 和
              UL1277。保修和支持表面显示这个控制平面在实践中如何被治理。保修覆盖取决于授权转售、授权安装，以及通过 SPAN Installer App
              调试。这个应用不是装饰：公开列表称它处理设置、断路器标签、服务电话、PowerUp 设定点，以及电池和 Drive 通信确认。连接性也是架构的一部分。SPAN
              需要互联网来支持应用控制和数据，可用时回落到蜂窝网络，并通过这条路径推送 OTA
              更新。上行是一个对住宅电气产品而言异常一体化的现场栈。下行是质量、保修和功能访问都绑定安装商授权、连接性和固件政策，而不是纯离线电器模式。
