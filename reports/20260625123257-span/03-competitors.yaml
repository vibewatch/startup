chapter:
  number: 3
  title: Competitors
  summary: The competitive field splits between full-panel replacements, retrofit load managers, and ecosystem-bound backup
    controllers. Span stands out for full-panel, full-circuit breadth and EV expansion, but Lumin and Eaton attack retrofit
    simplicity while Tesla, Enphase, and GM compete where buyers prioritize existing batteries, EVs, or vertically integrated
    bundles over universal circuit control.
sections:
- id: landscape-and-segmentation
  title: 'Landscape: three ways buyers solve the job'
  body: 'The relevant competitor set is broader than “smart panel startup versus smart panel startup.” Public comparison coverage
    and vendor materials split the market into three buyer paths: full panel replacement, retrofit load management beside
    an existing panel, and conventional panels paired with monitoring-only substitutes. Span and Schneider sit on the replacement
    side, where the promise is a cleaner architecture for solar, storage, EV charging, and outage control. Lumin and Eaton
    attack the same buyer problem from the retrofit side, promising meaningful control without a full panel swap. Enphase,
    Tesla, and GM compete more through ecosystems that already own the inverter, battery, EV, or app relationship, which can
    be enough for buyers whose real purchase driver is backup orchestration rather than universal circuit control. That framing
    matters because Span’s strongest wins come when a buyer already expects panel work; it is less advantaged when the panel
    can stay in place.'
