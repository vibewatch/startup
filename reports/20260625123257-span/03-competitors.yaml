  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: span-pricing
    missingEvidence: A dated official channel sheet mapping SPAN panel SKUs and accessories to the $2,550 starting price and
      to typical installed configurations.
    whyItMatters: Span’s affordability relative to Lumin changes materially depending on whether buyers anchor on hardware-only
      marketing price or installer-delivered project price.
    diligencePath: Collect two dated quotes from SPAN Authorized Installers and the current SKU sheet used for homeowner proposals.
    relatedQuestionRefs:
    - QP005
    - QP007
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: schneider-control-hardware-cost
    missingEvidence: Official Schneider documentation that states whether per-circuit outage prioritization requires extra
      Wi-Fi breakers, relays, or other add-ons and what those parts cost.
    whyItMatters: Schneider’s all-in-one positioning is hard to compare with Span unless the incremental cost of granular
      control is visible.
    diligencePath: Ask Schneider or a distributor for the current bill of materials for a solar-plus-battery Energy Center
      with per-circuit prioritization.
    relatedQuestionRefs:
    - QP014
    - QP026
    relatedTableRefs:
    - TP002
    - TP003
  - type: missing-source
    severity: material
    topic: eaton-retail-pricing
    missingEvidence: A current homeowner-visible starter-system quote or distributor sheet for AbleEdge smart breakers plus
      commissioning labor.
    whyItMatters: Eaton’s retrofit value proposition is compelling, but lack of public installed pricing makes it difficult
      to judge whether it undercuts Lumin or simply shifts cost into contractor scope.
    diligencePath: Request a sample homeowner quote from an Eaton Certified Contractor and a distributor stocking AbleEdge
      smart breakers.
    relatedQuestionRefs:
    - QP016
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: minor
    topic: tesla-gateway-official-pricing
    missingEvidence: A readable official Tesla page that publicly states Gateway standalone pricing, supported installation
      scope, and installer-discovery workflow.
    whyItMatters: Current pricing evidence relies on installer guides rather than Tesla-readable documentation, reducing confidence
      in exact gateway economics.
    diligencePath: Obtain a fresh Tesla Powerwall quote or an installer BOM showing the line item for Gateway hardware and
      labor.
