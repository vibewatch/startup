- id: pricing-and-channel-economics
  title: Pricing transparency and installer channel matter as much as features
  body: Span and GM are the most transparent on public pricing, but even Span’s public narrative contains a useful contradiction.
    The official Span panel page advertises a hardware starting price of $2,550, while a distributor blog cites about $4,500
    for hardware and more than $8,000 installed. That gap does not necessarily mean either figure is false; it does mean buyers
    still need channel context to know what configuration they are actually comparing. Lumin’s public pricing story is cleaner,
    with review coverage placing it below Span on both hardware and installed cost when homeowners can preserve the main panel.
    GM is unusually transparent for an ecosystem competitor, listing bundle prices directly on its own site. Schneider, Eaton,
    and Tesla remain more quote-driven or bundle-driven. Their hardware may be attractive, but public sources still make it
    hard to compare true all-in cost, especially once circuit-level prioritization parts, installer labor, or battery-system
    dependencies enter the bill of materials.
