tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - panel approach
  - installer / sales channel
  - interoperability posture
  - public pricing signal
  - main gap vs Span
  rows:
  - - Span
    - Direct
    - Full panel replacement with native circuit control and EV expansion
    - Authorized installers and partner network
    - Claims broad storage and hardware compatibility; native app control
    - Starts at $2,550 hardware official; distributor cites ~$8.25k-$9.25k installed
    - Full swap cost and project complexity can be overkill for retrofit buyers
  - - Lumin
    - Direct
    - Add-on smart load manager beside existing panel
    - Certified installer program and partner installers
    - Works with any panel; deeper state-of-charge logic on selected battery brands
    - ~$2.1k-$2.9k hardware; ~$3k-$5k installed from review coverage
    - Direct smart control limited to selected circuits rather than every circuit
  - - Schneider Energy Center
    - Incumbent
    - All-in-one replacement panel for solar, battery, generator, EV
    - Electrical distribution and retail / distributor channels
    - Locked to Square D QO breakers and Schneider accessory path
    - Public product listing exists; all-in installed economics remain quote-heavy
    - Granular per-circuit control economics and add-ons are less transparent
  - - Eaton AbleEdge
    - Incumbent retrofit
    - Modular smart breakers upgrade existing Eaton BR loadcenters
    - Certified contractor network plus installer app and training
    - Third-party ESS integrations, but hardware base tied mostly to Eaton BR panels
    - No clear homeowner retail installed price in fetched public sources
    - Current release focused on Eaton BR footprint and high-draw 2-pole loads
  - - Enphase IQ Load Controller
    - Adjacent ecosystem
    - Controller-level load shedding and appliance orchestration
    - Solar-storage installer channel and Enphase app stack
    - Best fit inside Enphase IQ ecosystem; not a universal smart-panel swap
    - Public store exists but no simple all-in smart-panel price
    - Narrower product scope than full-panel competitors
  - - Tesla Gateway / Powerwall
    - Adjacent ecosystem
    - Backup gateway inside Powerwall architecture
    - Certified installer channel around Powerwall projects
    - Tightly coupled to Tesla energy ecosystem
    - Gateway hardware guide cites ~$1.2k, but buyer usually sees bundled Powerwall quote
    - Bundle lock-in and weak public standalone pricing visibility
  - - GM Energy
    - Adjacent ecosystem
    - V2H and storage bundles anchored on GM EV and app
    - GM-preferred installation providers
    - Requires V2H-capable GM EV for V2H use; integrated GM app loop
    - Website lists charger, V2H, storage, and home-system bundle prices directly
    - Eligibility tied to GM EV ownership and properly equipped home
  - - Traditional panel + monitor
    - Status quo substitute
    - Keep panel; add monitor-only visibility
    - DIY or electrician depending on monitor
    - Little lock-in but no load-control automation
    - Much cheaper monitor-only option in review coverage
    - No remote switching, scheduling, or outage load prioritization
  notes: Pricing mixes official hardware prices, distributor pricing, and third-party installed estimates. Unknown or quote-heavy
    cells are left descriptive instead of forcing unsupported numbers.
