- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - company / threat
  - moat claim
  - threat or contradiction
  - severity
  - why it matters
  - diligence ask
  rows:
  - - Span vs retrofits
    - Whole-home breadth and every-circuit control
    - Homeowners without panel-upgrade needs may choose cheaper retrofits instead
    - High
    - Span’s strongest product story still loses if the full swap is unnecessary
    - Obtain win/loss data by homeowner panel condition and service-upgrade need
  - - Span pricing narrative
    - Official starting price lowers apparent entry point
    - Distributor-installed price suggests much higher real project outlay
    - High
    - Pricing ambiguity affects conversion against Lumin and status-quo substitutes
    - Collect current authorized-installer quotes for three common project archetypes
  - - Lumin
    - Universal retrofit compatibility and battery optimization
    - Direct control is limited to selected circuits despite broader whole-home marketing
    - Medium
    - Lumin is credible when a few loads matter most, but not equivalent to Span on breadth
    - Verify typical installer-configured circuit counts in live projects
  - - Schneider
    - Incumbent electrical distribution and all-in-one panel bundle
    - Breaker lock-in and unclear add-on economics weaken apples-to-apples comparison
    - Medium
    - Incumbent reach can compress Span’s replacement-panel win rate
    - Request a full BOM for a battery-backed Schneider install with granular control
  - - Eaton
    - Large Eaton BR installed base and contractor network
    - Current footprint is narrower and still centered on high-draw 2-pole loads
    - Medium
    - Eaton can be a strong retrofit answer, but breadth is not yet Span-like
    - Test homeowner quote plus supported-load list from an Eaton contractor
  - - Tesla / Powerwall
    - Strong backup brand and installed-base lock-in
    - Gateway is bundled into Tesla projects, making circuit-control comparison secondary
    - Medium
    - Tesla can win households that start from Powerwall rather than from panel upgrade needs
    - Compare Powerwall-plus-Gateway proposals with Span plus third-party battery quotes
  - - GM Energy
    - Transparent V2H and storage bundles for GM EV owners
    - Eligibility tied to GM vehicles narrows the market despite compelling bundle logic
    - Medium
    - GM is a real competitor for EV-first buyers but not a universal home-energy platform
    - Map how often Span prospects already own compatible GM EVs
  notes: Severity is an analytical judgment based on public evidence. Contradictions are preserved where vendor marketing
    broadens beyond the direct control surface or where public pricing sends mixed signals.
