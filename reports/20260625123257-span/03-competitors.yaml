- id: TP003
  title: Pricing / packaging comparison
  columns:
  - company
  - public price signal
  - what the number covers
  - what stays unknown
  - implication for Span
  rows:
  - - Span
    - Official panel starts at $2,550; distributor cites ~$4,500 hardware and ~$8.25k-$9.25k installed
    - Official page appears hardware-only; distributor adds installation context
    - How often buyers can achieve the official starting configuration in real projects
    - Span can market a lower entry point, but buyer comparison still depends on installer quote context
  - - Lumin
    - ~$2.1k-$2.9k hardware; ~$3k-$5k installed from SolarReviews
    - Add-on hardware beside existing panel plus estimated install labor
    - Exact current retail and installer discounting by market
    - Often cheaper than Span when homeowners can preserve their existing panel
  - - Schneider
    - No supportable installed price extracted from fetched public sources
    - Retail product listing and spec language exist
    - Incremental cost of granular control breakers, relays, and local installation
    - Schneider may be price-competitive through channels, but public comparison remains opaque
  - - Eaton
    - No supportable homeowner-installed price extracted from fetched public sources
    - Public product and FAQ pages explain scope but not finished project economics
    - Starter BOM, contractor markup, and commissioning labor
    - Retrofit story is strong conceptually, but price opacity limits buyer self-qualification
  - - Enphase
    - No simple all-in public smart-panel price in fetched sources
    - Controller hardware exists inside IQ System architecture
    - Total cost once IQ System Controller, storage, and installer labor are included
    - Competes as part of an ecosystem sale, not as a clean like-for-like panel quote
  - - Tesla
    - Installer guides cite Gateway hardware around $1,165, but buyer usually receives a full Powerwall quote
    - Guide-level hardware reference for gateway; system-level quote for buyer
    - Official readable standalone Gateway pricing and true installed delta
    - Tesla competes as bundled backup architecture rather than transparent panel hardware
  - - GM Energy
    - $1,999 charger; now-$6,299 V2H Enablement Kit; now-$8,098 V2H Bundle; now-$13,498 storage bundle; now-$15,297 home system
    - Company-published hardware and bundle pricing on GM Energy site
    - Local installation labor and nonstandard home-prep costs
    - GM is unusually transparent and lets buyers benchmark ecosystem bundles quickly
  notes: All values are as fetched on 2026-06-25 and may be promotional or hardware-only. Missing public numbers are intentionally
    shown as unknown instead of estimated from memory.
