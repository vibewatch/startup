  topStrengths:
    - >-
      SPAN's smart-panel architecture addresses a real electrification bottleneck by combining circuit-level control,
      load management, backup orchestration, and EV integration in one platform.
    - >-
      The 2026 Eaton investment plus PG&E and Landis+Gyr programs show third-party validation that extends SPAN beyond
      niche homeowner retrofits.
    - >-
      Public use cases repeatedly tie SPAN to avoided service-upgrade costs, which is a stronger adoption wedge than
      generic smart-home convenience.
    - >-
      Product breadth has expanded from a single premium panel into multiple form factors, SPAN Drive, local API
      tooling, and SPAN Edge.
  topRisks:
    - >-
      Public sources still do not disclose current revenue, gross margin, burn, runway, or customer count, limiting
      underwriting confidence.
    - >-
      SPAN remains a premium hardware product with installed economics that can look expensive versus conventional panel
      replacement outside high-pain projects.
    - >-
      Channel expansion increasingly depends on partners and programs such as Eaton, PG&E, and Landis+Gyr, creating
      conversion and concentration risk.
    - >-
      Permitting, code-adoption, and installer-quality variability can weaken customer ROI even when the product value
      proposition is sound.
    - >-
      The visible 2026 billion-dollar valuation marker rests on sparse operating disclosure and may overstate
      common-equity value if preference terms are heavy.
  unresolvedGaps:
    - >-
      Current recognized revenue, gross margin, and segment mix across panels, accessories, utility programs, and any
      software/services.
    - >-
      Installed-base count, active-household metrics, partner-sourced versus direct wins, and retention or
      warranty-claim cohorts.
    - Full cap-table terms, liquidation preferences, anti-dilution mechanics, and post-Series-C common-equity economics.
    - >-
      Current cash runway, working-capital needs, and whether Eaton-enabled manufacturing scale is reducing
      installed-cost friction.
