    {
      "id": "5.3",
      "title": "Installer workflow, compliance stack, and control-plane maturity",
      "body": "SPAN's compliance and operational maturity story is better than generic home-energy marketing, but it is still installer-centric. The panel family publicizes UL 67, UL 916, UL 869A, NEMA 3R, and UL 3141 PCS alignment; Drive adds UL 2594, UL 2231, ENERGY STAR, and integrated ground-fault protection; and Edge publishes a preliminary certification set that includes UL 414 and UL1277. The warranty and support surfaces show how this control plane is governed in practice. Warranty coverage depends on authorized resale, authorized installation, and commissioning through the SPAN Installer App. The app itself is not decorative: the public listings say it handles setup, breaker labeling, service calls, PowerUp setpoints, and confirmation of battery and Drive communications. Connectivity is also part of the architecture. SPAN requires internet for app control and data, falls back to cellular when available, and pushes OTA updates through that path. The upside is an unusually integrated field stack for a residential electrical product. The downside is that quality, warranty, and feature access are all coupled to installer authorization, connectivity, and firmware policy rather than to a purely offline appliance model.",
