    {
      "id": "5.4",
      "title": "Technical bottlenecks and substitution risk",
      "body": "The biggest technical bottlenecks are not basic product existence but support boundaries and ecosystem dependence. First, battery and solar interoperability is selective. MAIN 32 has the broadest native storage support, while newer panel variants still show a more limited matrix, so customers cannot assume that any battery, inverter, or gateway will integrate cleanly. Second, the local-control story is uneven. SPAN has now launched an official MAIN 32 local API with MQTT and REST elements, but it remains personal-use only, community-supported, and outside the warranty/support envelope. Community evidence around Gen3 panels shows why that matters: unofficial gRPC access appeared briefly and then disappeared with firmware 7.2.0, while official Gen3 local API support was still deferred to H2 2026. Third, Edge is strategically interesting but still young. Utility partners validate the problem and some economics, yet public data does not show steady-state latency, event frequency, transformer-relief outcomes, or fleet reliability. That leaves meaningful substitution risk. Commodity panels, standard EVSEs, or utility-owned meter-socket solutions can replicate slices of the value stack. SPAN's moat is the integrated orchestration layer across panel, charger, app, batteries, and utility programs, but that moat is only durable if interoperability and firmware governance stay ahead of community frustration and channel complexity.",
