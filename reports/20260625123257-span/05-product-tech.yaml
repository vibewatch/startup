  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "SPAN now sells an orchestrated home-energy stack rather than a single premium panel: a five-model panel family, the SPAN Drive charger, the Home app, an installer workflow, a MAIN 32 local API beta, and the utility-facing SPAN Edge. Public support and spec pages show unusually concrete interoperability and compliance detail for residential electrification hardware, especially around battery matrices, installer prerequisites, UL/NEC alignment, and meter-socket utility use cases. The main technical weaknesses are selective battery compatibility by panel generation, dependence on authorized installers and connectivity, thin public security attestations, and a still-uneven local-integration story for newer Gen3 hardware."
  },
  "sections": [
    {
      "id": "5.1",
      "title": "Product surfaces and customer workflow",
      "body": "SPAN is no longer just a single premium breaker box. The public stack now includes a five-model smart panel family, the SPAN Drive EV charger, the SPAN Home app, and the utility-facing SPAN Edge service-point device. In customer workflow terms, the panel remains the system anchor: it measures every connected circuit, lets homeowners change priorities in software, and acts as the integration point for batteries, solar, and EV charging. Drive extends that same control plane into the charger, while the Home app exposes live circuit, battery, solar, and charging state to the homeowner. Edge shifts the same service-upgrade-avoidance logic to the meter socket for utility programs such as PG&E PanelBoost. This matters because the product thesis is not only \u201csmart panel as hardware,\u201d but \u201cpower orchestration layer\u201d spanning the homeowner app, installer tooling, native battery links, EV charging, and utility grid-edge programs. The strongest product evidence is therefore the connected workflow from installer sizing and commissioning through homeowner control, outage prioritization, and utility or DER load shaping.",
