- id: capital-adequacy-financing
  title: Capital Adequacy and Financing Dependency
  body: 'SPAN''s capital formation is visible; its cash adequacy is not. SEC Form D filings show a roughly $90.0 million offering in January 2022, about $100.0 million in March 2023, about $70.1 million in September 2025, and a $175.8 million offering filed in January 2026 with $163.3 million already sold. TechCrunch tied the 2023 B2 financing to a $600 million valuation, while Latitude reported that SPAN had raised more than $200 million before the 2026 Series C and was using the latest round to deepen its move into utility infrastructure. Eaton''s separate $75 million March 2026 investment then added a strategic-capital layer on top of the financial round and explicitly linked that money to broader distribution, co-development, and lower-cost deployment.


    That funding history reduces immediate existential financing risk, but it does not resolve runway. No public source discloses cash on hand, monthly burn, debt capacity, inventory financing, project-specific obligations, or the next capital trigger. The product roadmap also cuts both ways: SPAN Edge, local API/on-premise capability, and XFRA all expand addressable market, yet each likely requires engineering, working capital, channel enablement, and program-management spend before revenue contribution becomes visible. The correct conclusion is that SPAN looks financeable and strategically supported, but still cannot be underwritten for self-funding, dilution risk, or time-to-breakeven from public evidence alone.'
