- id: cost-structure-margins-working-capital
  title: Cost Structure, Margin Drivers, and Working-Capital Implications
  body: 'SPAN should be analyzed as a hardware-plus-controls business, not as pure software. The panel economics necessarily absorb enclosure and breaker hardware, power electronics, sensing and communications components, certification and warranty costs, installer commissioning, and support for a cloud-linked app environment. The Eaton and Canary disclosures make the margin story explicit by emphasizing manufacturing scale, supply chain strength, and cost reduction as central reasons for the partnership. In other words, even management''s most bullish strategic partnership is framed around lowering product cost and broadening distribution, which is exactly what a company says when hardware scale matters more than software gross margin optics.


    Public comps reinforce that interpretation. Generac''s 2025 reporting showed 39.5% gross margin in a residential energy-hardware portfolio, but also tied cash-flow volatility to working-capital buildup, inventory replenishment, tariffs, supply-chain actions, and distributor dependence. Those are useful directional analogs for SPAN because they highlight how hardware businesses can look attractive on gross margin while still consuming cash through channel inventory, component sourcing, and forecast error. SPAN gives no public gross-margin, warranty-reserve, or inventory data, so no one outside the company can determine whether its economics already clear a healthy hardware benchmark or still depend on premium pricing and fresh capital to cover scale-up friction.'
