company:
  name: SPAN
chapter:
  number: 4
  title: Financials
  summary: SPAN's public financial record is strongest on list pricing, channel structure, and recent capital raises, and weakest on the core private-company metrics that matter for underwriting. Public sources show a hardware-led revenue model sold through authorized installers, expanding utility-facing products, and a January 2026 Series C offering that paired with Eaton's March 2026 $75 million investment to support product, distribution, and grid-edge expansion. But SPAN does not publicly disclose revenue, ARR, realized gross margin, burn, runway, or customer count, so the central financial debate is not whether demand exists but whether hardware, channel, and working-capital intensity can scale faster than capital consumption.
sections:
- id: revenue-model-pricing
  title: Revenue Model and Pricing Signals
  body: 'SPAN''s monetization is visible at the product and channel layer even though realized financial output is not. The company sells smart electrical panels in multiple form factors, the SPAN Drive EV charging accessory, and the Remote Meter Kit through an authorized-installer channel rather than a self-serve direct e-commerce model. Official MSRP now spans $2,550 for the MLO 24 through $4,100 for the MAIN 40, with SPAN Drive listed at $750 and the Remote Meter Kit at $795. Business Wire and the company product pages show that SPAN broadened the product family in 2025 with MAIN 16 and MLO 24 so it could address smaller homes, ADUs, subpanels, and multifamily use cases rather than only premium single-family retrofits.


    What is not public is just as important. SPAN does not disclose realized ASPs, discounts, attachment rates for Drive or the Remote Meter Kit, or the split between residential panel revenue and the newer utility-facing SPAN Edge line. The API and on-premise releases in February 2026 expand product capability, but they do not create a clearly disclosed standalone software subscription line; OTA updates remain free and the local API is community-supported. That leaves the chapter''s revenue conclusion straightforward: SPAN has a real hardware price list and multiple monetizable SKUs, but public evidence still supports a hardware-plus-installation-led business with software serving as product differentiation rather than a separately disclosed revenue bucket.'
