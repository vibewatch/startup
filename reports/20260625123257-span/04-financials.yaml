- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Impact on underwriting
  - Why it matters now
  - Exact diligence path
  rows:
  - - Revenue and revenue mix
    - Cannot size scale, attach rates, or mix shift between hardware and utility products
    - Without recognized revenue, pricing and demand signals stay qualitative
    - Request trailing 12-quarter revenue by panel, accessory, utility, and other categories
  - - ARR / recurring software or services
    - Cannot judge whether SPAN deserves hardware or hybrid hardware-software valuation logic
    - Software appears strategically important but no public recurring revenue line is disclosed
    - Request recurring software, monitoring, and service revenue with renewal and churn data
  - - Gross margin and warranty reserve
    - Cannot tell whether premium pricing translates into durable product economics
    - Hardware businesses can look attractive on price while hiding warranty or freight drag
    - Request product-level gross margin bridge including freight, warranty, and support burden
  - - Cash, burn, and runway
    - Cannot determine financing dependency or dilution timing
    - The roadmap has expanded faster than public cash disclosure
    - Request monthly burn, ending cash, and 18-month runway forecast by scenario
  - - Customer count / installed base
    - Cannot assess market penetration, cohort quality, or replacement/attachment opportunity
    - Utility pilots and installer testimonials are not substitutes for installed-base data
    - Request cumulative installations, active app households, and cohort growth by channel
  - - Utility contract economics
    - Cannot judge whether SPAN Edge is pilot-heavy or commercially repeatable
    - Utility expansion is central to the latest capital raise thesis
    - Request signed utility contracts, revenue recognition policy, and gross margin by deployment type
  notes: Gaps are structural and material for a private company; none can be solved from public list pricing or press releases alone.
