  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "SPAN is a San Francisco-based smart electrical panel company that has expanded from residential electrification hardware into utility and grid-edge infrastructure. Retained official, partner, and SEC sources confirm a large early-2026 Series C financing and strategic partnerships with Eaton, Landis+Gyr, PG&E, Jabil, and PulteGroup, while exact valuation, current revenue, and current headcount remain only partially disclosed."
  },
  "sections": [
    {
      "id": "identity-and-business-model",
      "title": "Identity and Business Model",
      "body": "SPAN positions itself as a company trying to remove the electrical-panel bottleneck that slows home electrification. Retained official pages describe the core offer as a software-defined electrical platform: SPAN Panel provides circuit-level visibility and control, SPAN Drive extends that control into EV charging, and SPAN Home or local tools provide the operating layer that turns electrical infrastructure into an energy management product. The current legal entity disclosed in the SEC is Span.IO, Inc., a Delaware corporation with its principal place of business at 679 Bryant Street in San Francisco. Public company materials repeatedly frame SPAN's build cycle as starting in 2018, and the company now markets not only replacement panels for homeowners but also builder, developer, and utility products intended to reduce service-upgrade costs. In short, SPAN sells premium electrical hardware plus embedded software, then increasingly monetizes the same control stack across residential, utility, and grid-edge use cases.",
