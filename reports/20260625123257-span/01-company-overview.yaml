    {
      "id": "leadership-governance-and-capital",
      "title": "Leadership, Governance, and Capital",
      "body": "Arch Rao is the only consistently named founder-executive across retained primary and company-issued sources, and the early-2026 SEC filing still shows Archan Rao signing as chief executive officer. Cathy Zoi is the clearest publicly named board member in retained official material and is presented as a clean-energy policy and scaling advisor. Beyond Rao and Zoi, however, SPAN does not provide a comprehensive public board roster in retained official materials, so later chapters should not assume broader governance details that are not independently documented. Capital formation is clearer than governance. SPAN's April 2023 Series B2 brought cumulative funding to $231 million, a September 2025 Form D showed another $25 million sold, and the January 2026 Form D showed $163.3 million sold against a $175.8 million offering. The best public valuation signal is only partial: official filings omit valuation, while Forge lists a roughly $1 billion Series C valuation in March 2026. That makes SPAN a late-stage venture with strong financing access but still incomplete public disclosure on valuation, revenue, and board composition.",
