- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Utility-sponsored electrification programs
    - A few programs such as PG&E could dominate visible traction before broad household adoption is proven
    - Channel scale could accelerate quickly but hide partner concentration and economics risk
    - Request pipeline by utility, deployed homes by program, and realized CAC/payback versus direct installer sales
  - - Builder and contractor design-ins
    - A small number of large builders or contractor groups may account for disproportionate volume
    - Community wins can create repeat orders, but lost design-ins can quickly shrink backlog
    - Request top-10 builder / contractor revenue share and attach rate per development
  - - Installer-network growth
    - Lead quality and installer follow-through may vary widely by region
    - Channel width does not guarantee conversion or post-sale customer satisfaction
    - Request active-installer count, lead acceptance rate, quote rate, and installer churn by geography
  - - Battery/EV household upsell motion
    - Expansion from panel to Drive, battery, or utility programs may be lower than marketing implies
    - If accessory or program attachment is weak, customer LTV may stay close to one-time hardware revenue
    - Request attach rates for Drive, battery integrations, and post-install program enrollment
  - - Partner-embedded products via Eaton or utilities
    - Embedded-channel success can make SPAN dependent on counterparties for roadmap, pricing, or margin
    - Strategic partnerships may expand reach while compressing economics or bargaining power
    - Request revenue split, exclusivity terms, and margin profile by partner-led versus direct sales
  notes: Expansion logic is visible, but concentration visibility remains weak because public disclosures stop before revenue-mix detail.
  claimRefs:
