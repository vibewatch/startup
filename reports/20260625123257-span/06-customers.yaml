company:
  name: SPAN
chapter:
  number: 6
  title: Customers
  summary: 'SPAN''s public customer story is strongest where a concrete electrification bottleneck already exists: battery-backed homeowners, EV and heat-pump projects that would otherwise force service upgrades, builders trying to avoid 400A designs, and utilities piloting lower-cost alternatives to panel upgrades. The company has real channel proof through its authorized-installer program and 2026 partner launches with PG&E, Landis+Gyr, and Eaton, but the traction evidence is still mostly case-study level rather than portfolio level. Public sources do not disclose installed-base count, conversion rates, NRR/GRR, churn, or customer concentration, so the visible proof is good enough to establish fit and channel motion, but not enough to underwrite durability.'
sections:
- id: '6.1'
  title: Customer segmentation centers on electrification-constrained projects, not mass-market panel swaps
  body: >-
    SPAN's public segmentation is clear even if exact customer counts are not. The company does not market itself as a commodity breaker box; it repeatedly targets homeowners who are adding batteries, EV charging, heat pumps, induction appliances, or major renovations and who risk triggering an expensive service upgrade. The same surface also expands to professional buyers and influencers: builders trying to keep new all-electric homes below 400A service, HVAC contractors trying to save projects that would otherwise stall on electrical scope, solar-plus-storage installers looking for a differentiated backup experience, and utilities trying to avoid costly secondary-system upgrades. That pattern matters because it says the underlying customer decision is usually economic and logistical, not aesthetic. SPAN wins when the buyer sees avoided upgrade cost, simplified backup design, faster project timing, or future expansion flexibility.


    The buyer, user, and payer are therefore not always the same person. In a homeowner retrofit, the homeowner pays, the installer specifies, and the app user is the resident who wants more control over battery, EV, or appliance loads. In builder and HVAC channels, the contractor or developer can be the economic champion because SPAN helps preserve close rates or design margin before the eventual resident becomes the daily user. In utility programs such as PG&E PanelBoost, the utility helps shape the offer while the homeowner still bears the electrician and appliance-wiring work. Public pricing supports that framing: SPAN publishes MSRP, but final economics remain project-specific and installer-mediated, which is consistent with a solution sold into constrained, scope-heavy projects rather than a self-serve consumer device.
