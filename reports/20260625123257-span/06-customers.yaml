- id: '6.4'
  title: Durability, concentration, and customer-traction disclosure remain the main open diligence items
  body: >-
    SPAN's public evidence is much better at proving why someone would buy than at proving how many people have bought, renewed, or expanded. Warranty terms, PowerUp behavior, and post-install app features show that the company is building for a long-lived customer relationship, but those are product-support facts rather than traction metrics. Public materials do not disclose active households, installed-base count, app engagement beyond anecdotes, NRR, GRR, churn, median contract terms, top-customer concentration, installer-channel conversion, or partner-led revenue share. Even the strongest channel statistics are selective snippets rather than cohort tables. That means the public record supports a conclusion of credible demand surfaces and credible channel motion, but not a conclusion about portfolio durability.


    This gap matters more in customers than it did in market or product chapters because the unresolved questions are underwriting questions, not awareness questions. If PG&E, Eaton, and Landis+Gyr become large distribution levers, they can accelerate adoption materially; they can also hide concentration or economics issues if a small number of partners drive most of the visible traction. Likewise, customer testimonials and review consensus help establish fit, but they do not answer whether SPAN has a broad repeatable funnel or simply a persuasive story for high-pain electrification projects. The next diligence step is therefore quantitative: request installed-base counts, partner-sourced versus direct wins, installer close rates, renewal and warranty-claim cohorts, and any data showing whether users expand from one product into batteries, Drive, or utility programs over time.
