figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Maps the typical homeowner or contractor-led path from electrification pain to installation and follow-on engagement.
  data:
    items:
    - id: stage-trigger
      label: Pain trigger
      actor: Homeowner, contractor, builder, or utility program team
      description: A battery, EV charger, heat pump, renovation, or all-electric design creates a service-size, backup, or cost problem that a standard panel does not solve cleanly.
      channels:
      - Battery backup
      - EV / heat pump addition
      - Builder design
      - Utility electrification program
    - id: stage-intake
      label: Lead intake and matching
      actor: SPAN Home Advisor + authorized installer network
      description: The prospect enters through Get Started, referral, or partner motion and is routed into an authorized installer or professional channel instead of direct ecommerce.
      channels:
      - Get Started
      - Referral / VIP intake
      - Installer Match
      - Partner sales channel
    - id: stage-scope
      label: Project scoping
      actor: Authorized installer, builder, HVAC or solar partner
      description: The installer picks panel size, determines whether Drive, battery, or SPAN Edge fit the job, and frames economics around avoided upgrades or better backup control.
      channels:
      - Authorized electrician
      - Solar + storage installer
      - HVAC contractor
      - Builder / developer
    - id: stage-install
      label: Installation and commissioning
      actor: Authorized installer + homeowner
      description: SPAN is installed and commissioned through the installer app, after which the homeowner gets app-based monitoring, control, and energy-management features.
      channels:
      - 3-8 hour panel swap for many homes
      - Installer app commissioning
      - App onboarding
    - id: stage-expand
      label: Expansion and engagement
      actor: Homeowner, installer, and sometimes utility partner
      description: Post-install value comes from battery priorities, charge-with-solar, cost insights, referrals, or later enrollment in builder, utility, or partner-led expansion programs.
      channels:
      - Battery management
      - Charge with solar
      - Cost insights beta
      - Referral / utility program
  approximationNotes: This is a synthesized public journey rather than an internal SPAN funnel diagram; actual sequences vary by channel.
