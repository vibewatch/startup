tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Battery-backup homeowners
    - Homeowner / homeowner / homeowner
    - Whole-home backup control and longer battery runtime without a separate critical-load panel
    - Nationwide homeowner segment; exact installed-base count undisclosed
    - High-value residential retrofits with software-led differentiation
    - No public cohort count attachment rate or backup-usage frequency
  - - EV / heat-pump / appliance-addition households
    - Homeowner / homeowner / homeowner
    - Avoid service upgrades while adding major electric loads
    - Large theoretical pool; PG&E alone cites 600,000+ homes likely to need upgrades over the next decade
    - Clear wedge where avoided upgrade cost can justify premium panel pricing
    - No public win rate or project-payback distribution by appliance type
  - - Builders / new construction developers
    - Builder or developer / eventual resident / builder or homebuyer
    - Keep all-electric homes below 400A-800A designs and simplify storage-ready homes
    - Visible but not quantified; company claims builder savings per site
    - Could convert SPAN from one-off retrofit SKU into repeat community spec
    - No disclosed number of communities homes or builder revenue concentration
  - - HVAC and electrification contractors
    - Contractor / homeowner / homeowner or contractor-sponsored project
    - Save projects that would otherwise stall on electrical scope and utility upgrades
    - National channel push with dedicated HVAC page and case study
    - Useful demand-capture channel because it rescues close rates on high-ticket jobs
    - No public contractor conversion rate or attach rate versus alternative fixes
  - - Solar + storage installers
    - Installer / homeowner / homeowner
    - Differentiate battery and EV projects with circuit-level control and integrated backup priorities
    - Authorized-installer channel is active but undisclosed in size
    - Important referral and bundling channel for higher-value electrification projects
    - No public installer count churn or regional productivity distribution
  - - Utilities and utility-sponsored programs
    - Utility / homeowner and utility / utility plus homeowner install spend
    - Lower-cost electrification pathway and grid-edge load management via SPAN Edge
    - PG&E says initial scale will reach thousands; Landis+Gyr expands utility reach
    - Potentially the largest distribution lever if programs standardize
    - Public sources still lack contract values realized adoption curves and renewal terms
  notes: Segments are defined by the public buyer/job-to-be-done pattern rather than by disclosed revenue mix or customer counts.
