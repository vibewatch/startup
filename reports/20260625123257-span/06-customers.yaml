- id: TU006
  title: Reviews and adoption-friction table
  columns:
  - Friction
  - Public evidence
  - Affected segment
  - Implication
  - Diligence ask
  rows:
  - - Quote opacity and installed-cost variability
    - Independent reviews place installs around $6,500-$10,000, while Bardi says complex jobs can exceed $20,000
    - Mainstream homeowners and retrofits
    - Sticker shock can kill deals even when MSRP looks manageable
    - Request actual quoted and realized installed-cost distribution by use case and geography
  - - Weak fit for simple panel swaps
    - ShelterVolt calls SPAN an expensive flex when no service-upgrade or battery-management problem exists
    - Commodity replacement buyers
    - Limits true mass-market conversion if electrification pain is absent
    - Request win/loss reasons versus standard panel replacement and retrofit competitors
  - - Generator limitations
    - Support FAQ says generator setups lose automated outage features and have wiring constraints
    - Generator-first households
    - Narrows product-market fit for backup buyers who do not want batteries
    - Request share of deals lost due to generator incompatibility and roadmap for generator support
  - - Large-home multi-panel complexity
    - Support FAQ says multi-panel projects can change app behavior, require one battery per panel, and need separate networking
    - Large or 400A+ homes
    - Higher complexity can raise cost and reduce the elegance of the sales story
    - Request multi-panel attach rates, NPS, and failure/support burden versus single-panel homes
  - - Cloud and local-control dependency
    - SmartHomeExplorer still flags cloud dependence as a drawback even after local API beta progress
    - Tech-forward homeowners and outage-sensitive users
    - Connectivity concerns can slow conversion among buyers who want purely local resiliency
    - Request local-control adoption, outage incident history, and roadmap to broader on-prem support
  - - Authorized-installer dependency
    - Warranty, support, and commissioning all rely on authorized installers
    - All segments
    - Sales scale and support quality depend on channel health more than direct brand demand
    - Request authorized-installer density, SLA performance, and warranty-claim resolution times
  notes: This table separates product appeal from practical blockers that can slow conversion or reduce fit in specific customer cohorts.
