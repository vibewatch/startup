  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-disclosure
    missingEvidence: Installed-base count, active households, and any monthly active app-user data segmented by product and channel.
    whyItMatters: Without installed-base and activity counts, investors cannot tell whether SPAN has a broad customer franchise or a concentrated set of showcase projects.
    diligencePath: Request a board-ready installed-base bridge by year plus active app users, product attachment, and partner-sourced households.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU002
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: NRR, GRR, churn, contract length, renewal rate, and warranty-claim cohorts by customer segment.
    whyItMatters: The customer story cannot be underwritten for durability until public proof is replaced with real cohort data.
    diligencePath: Request cohort tables for homeowners, installers, builders, and utility programs showing retention, expansion, support burden, and renewal outcomes.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: funnel-conversion
    missingEvidence: Inquiry-to-match, quote-to-close, and installer lead-conversion metrics by geography and project type.
    whyItMatters: Anecdotes about leads and close-rate pain do not prove SPAN can scale customer acquisition efficiently.
    diligencePath: Request CRM funnel exports showing lead source, time to quote, close rate, and realized installed value by channel.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: partner-led-concentration
    missingEvidence: Revenue mix, margin profile, and exclusivity terms for PG&E, Eaton, Landis+Gyr, and builder/installer-led channels.
    whyItMatters: Partner-led scale can improve reach while simultaneously increasing concentration and bargaining-power risk.
    diligencePath: Request partner revenue concentration, contract summaries, and partner-led versus direct gross margin by quarter.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-coverage
    missingEvidence: A broader public roster of named production customers with deployment counts and freshness markers, not just curated examples.
    whyItMatters: The chapter can prove fit with public examples, but it cannot prove breadth without more named and measurable deployments.
    diligencePath: Request a referenceable customer list with deployment status, channel, use case, and permission to speak with at least three live customers.
    relatedQuestionRefs:
    - QU010
    - QU024
    relatedTableRefs:
    - TU003
