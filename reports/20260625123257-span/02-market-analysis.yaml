- id: drivers-and-constraints
  title: 'Growth drivers and bottlenecks: electrification, flexibility, and cost avoidance help, but adoption still depends on affordability, codes, and proof'
  body: |-
    The demand case is straightforward. EIA says U.S. electricity consumption has resumed growth, IEA says power systems need materially more flexibility as electricity use rises, and multiple independent sources show that households are bundling EV charging, heat pumps, solar, storage, and automation into one system-level decision. That environment favors technologies that can coordinate loads in real time. Analyst reports also point to AMI saturation, dynamic pricing, solar-plus-storage adoption, rebate stacking, and utility demand-response participation as tailwinds for HEMS and grid-interactive home infrastructure. For Span specifically, partnerships with Eaton, PG&E, and Landis+Gyr strengthen the channel thesis that load orchestration can be sold as both a customer product and a utility-enabling platform.

    The bottlenecks are just as important. Traditional panel and service upgrades remain expensive, slow, and administratively messy; that friction creates demand for Span, but it also slows project conversion because the buyer still faces a complex electrical job. Integrated systems are expensive even before extra electrical work, cybersecurity and interoperability concerns still deter households, and state incentive design remains uneven after 2025 policy disruption. Most importantly for investors, public proof still lags product logic: there is no sourced public view here of Span's installed-base conversion rate, retention by channel, utility-program unit economics, or revenue mix. The chapter therefore supports a real and growing market with a strong bottleneck-driven wedge, but it preserves a material evidence gap between category attractiveness and Span-specific market capture.
