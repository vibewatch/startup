  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: span-penetration
    missingEvidence: Public disclosure of installed homes, active endpoints, paying households, or builder/utility deployment counts by channel.
    whyItMatters: Without a penetration denominator or endpoint count, the chapter cannot turn broad market logic into a credible Span-specific SOM case.
    diligencePath: Request a channel split for installed panels, Span Edge deployments, active software subscriptions, and contracted utility-program homes.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: span-revenue-mix
    missingEvidence: Public revenue or gross-margin split across hardware, software, utility programs, and builder channels.
    whyItMatters: Span may monetize the market through several layers, but valuation depends on which layer actually captures recurring economics.
    diligencePath: Request booked revenue, gross margin, and renewal metrics by homeowner, builder, and utility channel for the last 12 months.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: material
    topic: smart-panel-sam
    missingEvidence: A clean public smart-panel or service-upgrade-avoidance market definition that isolates Span's real U.S. SAM instead of broader HEMS or panel-constraint proxies.
    whyItMatters: Top-down software TAMs and bottom-up constrained-home counts point in the same strategic direction but do not translate directly into the same monetizable market.
    diligencePath: Build a bottom-up SAM from target home archetypes, service sizes, attachment to EV/heat-pump/solar projects, and utility-program eligibility by geography.
    relatedQuestionRefs:
    - QM011
    - QM025
    relatedTableRefs:
    - TM002
