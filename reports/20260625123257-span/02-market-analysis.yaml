- id: sizing-lenses
  title: 'Sizing lenses: public dollar TAMs exist, but the physical bottleneck may be the better lens than a generic market headline'
  body: |-
    The public top-down analyst market is real but inconsistent. Future Market Insights sizes global HEMS at USD 4.71 billion in 2026, while Mordor sizes the broader home energy management market at USD 4.43 billion in 2026 and North American HEMS at USD 1.72 billion. If Mordor's 2025 U.S. share of North American revenue persisted, the implied 2026 U.S. revenue lens would be roughly USD 1.41 billion. Those numbers are directionally useful, especially because they already assume recurring software and VPP-oriented value rather than just hardware sales. But they are not identical categories, and none isolate a smart-panel-only slice or Span's serviceable market by homeowner retrofit, builder spec-in, and utility program channels.

    The more defensible evidence-backed sizing lens is the pain point Span is selling against: panel and service constraints. NREL says 62% of homes face panel constraints under business-as-usual electrification, Lawrence Berkeley Lab says combined capacity and space constraints range from 29% to 91% of single-family homes across states, and an IJSAT paper citing Pecan Street puts the potential upgrade population at 48 million U.S. single-family homes before full electrification. PG&E alone estimates that more than 600,000 homes in its territory may need some kind of electric service upgrade over the next decade. Those figures are not a clean SAM, but they show why Span's wedge may be larger in physical-home count than in near-term software-market revenue, while still leaving Span's true SOM unresolved because public sources do not disclose installed endpoints, paid homes, or contracted utility volumes.
