    - Positive
    - Current through 2030
    - More electrified load makes in-home orchestration and demand shaping more valuable
    - Which utilities are prioritizing service-upgrade avoidance versus bulk grid upgrades?
  - - Whole-home bundling of EVs, heat pumps, solar, and storage
    - Positive
    - Current through 2026
    - Span benefits when households buy an integrated energy stack rather than isolated products
    - What share of Span demand originates from bundled solar-storage or EV jobs?
  - - Dynamic pricing, demand response, and VPP policy momentum
    - Positive
    - Current through 2027
    - Automation and load flexibility can create software and utility-program value beyond panel hardware
    - How much of Span's roadmap depends on VPP enrollment economics?
  - - Builder savings from avoiding 400A service
    - Positive
    - Current
    - Spec-in economics can make new-build adoption faster than retrofit homeowner conversion
    - Which builders are active pilots versus scaled recurring accounts?
  - - Utility capex avoidance and faster install pathways
    - Positive
    - Current through 2026
    - Utilities may sponsor adoption where load control is cheaper than infrastructure spend
    - What are the measured grid-benefit KPIs in PG&E and other pilots?
  - - High upfront integrated-system and installation cost
    - Negative
    - Current
    - Even with savings logic, integrated HEMS and smart-panel stacks can still be expensive for middle-income households
    - What is the all-in installed price by channel after rebates?
  - - Cybersecurity, interoperability, and commissioning complexity
    - Negative
    - Current
    - Multi-vendor home energy stacks can slow trust and conversion even when technical value is clear
    - How much installation friction is eliminated by channel partnerships?
  - - Code friction, queue delays, and policy volatility
    - Mixed
    - Current through 2026
    - The same panel bottleneck that creates demand can also stall projects, while rebate and tax policy changes alter ROI
    - How sensitive is demand to state-specific code interpretations and post-2025 incentive changes?
