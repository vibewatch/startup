- id: scenario-ranges-under-sparse-metrics
  title: Scenario ranges under sparse private metrics
  body: 'The scenario work therefore has to be explicit about what is known versus assumed. The upside case is not ''SPAN is cool''; it is a specific chain: Eaton manufacturing and distribution compress installed-cost friction, PG&E and Landis+Gyr style utility programs turn into booked recurring or repeatable deployment revenue, and newer adjacencies such as grid-edge infrastructure or XFRA become monetized rather than merely announced. In that world, a billion-dollar headline valuation can be defended as an option on a broader energy-control platform. The base case is more conservative. It treats SPAN as a hardware-plus-controls company with genuine differentiation but still limited public proof on unit economics and utility revenue conversion, which points to a valuation band closer to mature public comp territory plus a strategic premium. The downside case is straightforward: residential demand remains niche, utility cycles stay slow, and the next financing round clears flat or down
    once private terms and dilution matter more than narrative. Since the public record lacks revenue, margin, and cash data, these ranges are decision bands for entry discipline, not fair-value estimates. That is exactly why the anti-thesis matters as much as the thesis in this chapter.'
