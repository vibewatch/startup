  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-2026
    missingEvidence: A direct cap-table-backed common-equity valuation reconciliation for the March 2026 round.
    whyItMatters: Alternative-data pages show headline valuation markers, but they do not fully prove what price a new investor is actually underwriting.
    diligencePath: Request charter documents, financing docs, and a fully diluted cap table from management.
    relatedQuestionRefs:
    - QV007
  - type: private-evidence-only
    severity: material
    topic: preference-overhang
    missingEvidence: Series-by-series liquidation preference, dividend, participation, and conversion terms for all outstanding preferred stock.
    whyItMatters: Headline post-money valuation can overstate common-equity value and distort return expectations.
    diligencePath: Review certificates of incorporation and investor-rights documents with counsel.
    relatedQuestionRefs:
    - QV008
  - type: missing-source
    severity: material
    topic: utility-proof
    missingEvidence: Recognized revenue, booked backlog, and deployment cadence for utility programs such as PG&E and Landis+Gyr-linked efforts.
    whyItMatters: Utility optionality is one of the main arguments for a premium valuation above residential-hardware peers.
    diligencePath: Obtain customer-backed revenue schedules, contract summaries, and reference calls with utility partners.
    relatedQuestionRefs:
    - QV016
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Management view on IPO readiness, timeline, audit posture, and the evidence required for a public-market story.
    whyItMatters: A late-stage valuation should be tested against realistic exit paths, not only private-market enthusiasm.
    diligencePath: Review board materials, banker presentations, and audit-readiness plans.
    relatedQuestionRefs:
    - QV030
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by product family after freight, warranty, installer enablement, and any channel concessions.
    whyItMatters: Gross margin is the key bridge between premium product narrative and sustainable valuation support.
    diligencePath: Request finance workpapers and cohort economics by product line.
    relatedQuestionRefs:
    - QV009
    - QV025
    relatedTableRefs:
    - TV006
    - TV004
  - type: missing-source
    severity: minor
    topic: installed-cost-cohorts
    missingEvidence: Installed-cost and ROI cohorts by homeowner archetype, service-upgrade need, and project complexity.
    whyItMatters: Review-source pricing bands show dispersion but not the true shape of demand elasticity or payback.
    diligencePath: Collect installer quotes, closed-won cohorts, and post-install savings cases by segment.
    relatedQuestionRefs:
    - QV011
    - QV012
    relatedTableRefs:
    - TV002
