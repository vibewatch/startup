- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Driver
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Strategic capital
    - Eaton adds capital plus manufacturing and distribution leverage
    - Strategic investors can still overpay or optimize for optionality rather than near-term IRR
    - See evidence of lower installed costs and real channel throughput
  - - Utility option value
    - PG&E and Landis+Gyr suggest SPAN can expand beyond premium homes
    - Pilot or partner headlines may not become recognized revenue quickly
    - Get booked utility revenue and deployment cadence by program
  - - Product platform
    - Panels, Edge, Drive, and XFRA widen the addressable story
    - More products can also widen burn and working-capital needs before monetization
    - See contribution margin and capital intensity by product family
  - - Private valuation support
    - Forge and Caplight show live private-market attention in 2026
    - Alternative-data screens are not enough to validate a public-market clearing price
    - Corroborate common-share price, cap table, and new-money terms directly
  - - Residential economics
    - SPAN can make sense when it avoids service upgrades or battery oversizing
    - If the home only needs a basic panel swap, SPAN can be a costly luxury
    - See cohort-level ROI and installed cost compression across project types
  notes: The anti-thesis is intentionally symmetrical with the thesis so the recommendation remains price-sensitive rather than narrative-driven.
