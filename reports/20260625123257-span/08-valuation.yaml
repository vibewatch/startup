- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Recognized revenue
    - Current revenue split across panels, accessories, utility programs, and any software/services
    - Without revenue, no private round can be benchmarked cleanly against public comps
    - Management data room or investor deck
  - - Gross margin
    - Gross margin by product line after freight, warranty, and installer/channel costs
    - Determines whether SPAN deserves hardware or software-adjacent multiple treatment
    - Finance workstream with product-line bridge
  - - Utility conversion
    - Booked backlog, deployment count, and revenue timing for PG&E, Landis+Gyr, and similar programs
    - This is the main bridge from premium-home story to infrastructure-style scale
    - Commercial diligence with customer and partner references
  - - Cap table and preferences
    - Series-by-series liquidation preferences, dividends, conversion ratios, and participation terms
    - Headline post-money can misstate actual entry economics
    - Legal / financing diligence with charter documents
  - - Cash runway
    - Cash balance, monthly burn, and 12- to 24-month financing plan under current hiring and deployment assumptions
    - Determines dilution risk and urgency of next raise
    - Finance diligence and board materials
  - - Installed-cost cohorts
    - Installed-cost and ROI data by homeowner archetype and project complexity
    - Tests whether cost-down and service-upgrade avoidance really broaden the market
    - Installer-channel cohort analysis
  notes: Every ask is tied to a known valuation blind spot rather than a generic diligence wish list.
