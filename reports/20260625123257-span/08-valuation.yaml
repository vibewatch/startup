- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Flat or down financing
    - Next priced round clears at or below older valuation markers
    - Signals that narrative growth has not converted into clearing-price support
    - Pause or demand materially stronger terms
  - - Utility revenue non-conversion
    - Partner announcements continue without disclosed booked revenue or rollout cadence
    - Option value stays theoretical and cannot support premium multiples
    - Shift weighting toward residential hardware economics only
  - - Gross-margin disappointment
    - Margin proves materially below healthy electrical-equipment benchmarks after freight and warranty
    - Undercuts the case that software or controls can offset hardware intensity
    - Re-rate toward lower-end comp bands
  - - Installed-cost compression stalls
    - Eaton scale and channel leverage do not narrow the gap between MSRP and installed price
    - Weakens household ROI and volume expansion assumptions
    - Reduce confidence in bull case
  - - Preference overhang deepens
    - New money comes with heavier dividends, liquidation preferences, or seniority than public clues suggest
    - Headline valuation overstates common-equity value for new or existing holders
    - Underwrite on fully diluted and preference-adjusted terms only
  notes: 'These are decision triggers, not abstract risks: each one directly changes what price discipline should look like.'
