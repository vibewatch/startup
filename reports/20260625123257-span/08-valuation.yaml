- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside / upside trigger
  rows:
  - - Bull
    - Utility programs convert into disclosed revenue, Eaton drives cost-down and distribution, and adjacencies monetize
    - Scenario valuation band $1.0B-$1.3B; assumes SPAN proves it deserves a premium over mid-single-digit public comp bands
    - Requires hard evidence of revenue conversion, margin improvement, and partner-led scale
    - Two consecutive financing or operating updates with disclosed growth and margin support
  - - Base
    - SPAN remains differentiated but still hardware-led, with gradual utility traction and incomplete public disclosure
    - Scenario valuation band $0.6B-$0.85B; anchored between the 2023 $600M mark and richer public comp bands with a strategic premium
    - Most consistent with current public evidence
    - No material new disclosure, but no obvious demand or financing break either
  - - Bear
    - Residential demand remains niche, utility cycles stay long, and private terms start to dominate headline pricing
    - Scenario valuation band $0.35B-$0.55B; assumes flat or down round dynamics and dilution matter more than narrative
    - Becomes likely if pilots stay promotional and margin data disappoints
    - Another financing that clears near or below older valuation markers
  - - Current public marker
    - Forge shows a $1.0B Series C estimate in March 2026, while public reporting still points back to $600M in 2023 as the last plainly stated valuation mark
    - Treat the marker as an entry point for diligence, not as proof of fair value
    - Current evidence supports bounded skepticism rather than automatic acceptance
    - Any new disclosed revenue or cap-table data could move the range materially
  notes: These are scenario bands, not point estimates. They intentionally avoid invented SPAN revenue and instead translate public evidence into decision ranges.
