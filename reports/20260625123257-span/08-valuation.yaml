- id: diligence-asks-and-thesis-breaks
  title: Diligence asks and thesis-breaks
  body: The final judgment is only as good as the diligence path that could move it. Here the asks are not cosmetic. A sponsor should demand current recognized revenue split across residential hardware, accessories, utility programs, and any software or service layer; gross margin by product family after freight, warranty, and channel costs; booked backlog and the actual conversion rate from pilots or partner announcements into recognized revenue; and a cap-table schedule that shows each series' liquidation preference, dividends, and conversion terms. Those asks matter because SPAN's biggest public positives are also its easiest story risks. Eaton, PG&E, Landis+Gyr, and XFRA all create narrative upside, but each can support a premium valuation long before it supports public-market-grade underwriting. The thesis breaks if utility deployments stay mostly promotional, if installed-cost compression stalls, if the next round reprices below the current headline marker, or if gross margin turns
    out to look more like an appliance company than a software-augmented platform. Until those questions are closed, the right investment implication is selective engagement with strict entry discipline rather than an unconditional yes.
