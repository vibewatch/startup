  name: Zyphra
chapter:
  number: 7
  title: Risks
  summary: Zyphra's largest risks are exposure to a concentrated AMD/IBM infrastructure stack, unresolved enterprise controls around model reliability and data rights, and limited public evidence on financial resilience. The available evidence shows meaningful operating capability, but most reliability and commercial claims remain partner- or company-issued rather than independently audited.
sections:
  - id: risk-ranking
    title: Ranked risk view
    body: The evidence supports a high residual-risk posture, but not a claim that Zyphra has suffered a public outage, regulatory action, or copyright judgment. The strongest operational proof is an AMD case study describing 1,536 MI300X GPUs, about 20 trillion trained tokens, and uninterrupted 48- to 72-hour runs. That same account says a node experienced intermittent data corruption and that driver settings, timeouts, network-card behavior, and rare hardware faults required active tuning. This makes infrastructure execution a demonstrated capability and a continuing failure surface, not a closed risk. The risk register therefore ranks correlated infrastructure failure and enterprise-control gaps above hypothetical litigation. The proposed mitigations are diligence requirements unless a source explicitly documents them.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: legal-regulatory
    title: Legal, regulatory, and model-governance exposure
    body: Zyphra operates in a regulatory environment where training-data provenance, output accuracy, and documented risk management can affect enterprise adoption even without a Zyphra-specific enforcement action. The U.S. Copyright Office says its AI work covers both copyright in AI-generated works and copyrighted materials used in AI training, and its generative-AI-training report remains a live policy area. NIST's AI RMF is voluntary, but its generative-AI profile is intended to identify unique risks and propose management actions. The FTC has separately described possible unfair or deceptive conduct when AI systems are represented as accurate or effective while outputs are altered for undisclosed objectives. These sources establish external obligations and buyer scrutiny, not a finding against Zyphra. The diligence gap is whether Zyphra can evidence dataset provenance, evaluation, disclosures, privacy controls, and customer allocation of liability.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-triggers
    title: Dependencies, financial resilience, and thesis breaks
    body: Public reporting describes a multi-year IBM Cloud arrangement for a large AMD MI300X cluster, with an initial deployment in 2025 and planned expansion in 2026. The newer cloud-launch report says Zyphra Cloud runs on AMD MI355X infrastructure supplied through TensorWave and that additional distributed post-training, sandboxed agents, and dedicated clusters had no published timeline. This creates partner, capacity, migration, and roadmap dependencies across hardware, cloud, and service delivery. Public profile data is inconsistent; Inven labels revenue as a modeled estimate and reports 74 employees, while Dealroom reports 71 employees and a 2026 $500M AMD financing event; these are not sufficient to establish cash, burn, runway, or terms. The investment thesis should break if customer-grade reliability evidence, independent financial disclosure, or a credible multi-provider continuity plan fails diligence.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Correlated failure across AMD GPU, ROCm, networking, and cluster synchronization", "medium", "critical", "demonstrated but partner-reported", "critical", "Independent uptime and incident history are not disclosed"]
      - ["Node-level data corruption or hardware fault interrupts long synchronous training", "medium", "high", "active troubleshooting documented", "high", "Need error budgets, recovery-time targets, and customer impact records"]
      - ["Cloud capacity or platform launch dependencies delay promised services", "medium", "high", "roadmap stated but undated", "high", "Need reserved-capacity and failover commitments"]
      - ["Model accuracy, safety, or privacy controls are insufficient for enterprise use", "medium", "high", "not publicly evidenced", "high", "Need evaluation reports, DPA, security attestations, and abuse response"]
    notes: Risks synthesize source-described operating events and explicit evidence gaps; likelihood and residual exposure are analytical judgments requiring diligence, not observed incident frequencies.
    claimRefs: [CR001, CR002, CR003, CR004, CR010, CR011]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule / issue, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Copyrightability and training-data rights", "United States", "active policy and litigation environment", "medium", "high", "establish provenance and licenses", "high", "Obtain dataset lineage and counsel memo"]
      - ["Accuracy or efficacy representations for AI systems", "United States", "FTC policy proposal and existing enforcement precedent", "medium", "high", "substantiation and disclosures", "high", "Review marketing claims and evaluation evidence"]
      - ["Generative-AI risk management expectations", "United States", "NIST voluntary framework and 2026 critical-infrastructure profile work", "medium", "medium", "map controls to AI RMF", "medium", "Request control matrix and customer contract allocation"]
      - ["Privacy, security, and enterprise data handling", "multi-jurisdiction", "status not publicly verified for Zyphra", "medium", "high", "no public certification evidence retained", "high", "Obtain DPA, SOC 2 or equivalent, and breach-response plan"]
    notes: External sources describe the applicable policy and enforcement environment; they do not establish that Zyphra violated a law or has a pending case.
    enumerationScope:
      coverage: partial
      basis: Public U.S. policy sources and retained company materials; no private legal or compliance file was available.
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Accelerator and software stack", "AMD", "GPUs, ROCm, networking", "high", "supply or software regression constrains training and serving", "high", "Open software and tested full-stack deployment", "high"]
      - ["Cloud bare metal and storage", "IBM Cloud", "training cluster and development nodes", "high for reported cluster", "capacity outage or contract change interrupts workloads", "high", "Multi-year agreement and spare nodes described", "medium-high"]
      - ["Cloud service capacity", "TensorWave", "underlying infrastructure for Zyphra Cloud", "unknown", "capacity or service-level failure delays inference launch", "high", "Product launched and future dedicated clusters stated", "high"]
      - ["Capital and financing visibility", "AMD and undisclosed investors", "reported financing and strategic support", "unknown", "funding terms or cash runway cannot be verified", "high", "None publicly sufficient", "high"]
    notes: Counterparty roles are source-described; concentration is qualitative because contract shares, substitution costs, and service-level terms are private.
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Residual exposure is highest where infrastructure concentration and enterprise-control evidence intersect.
    data:
      columns: [Likelihood, Impact, Residual severity]
      rows:
        - label: Correlated AMD/IBM infrastructure failure
          values: [Medium, Critical, Critical]
        - label: Enterprise accuracy, privacy, or security control gap
          values: [Medium, High, High]
        - label: Copyright or training-data challenge
          values: [Medium, High, High]
        - label: Partner capacity or financing visibility
          values: [Medium, High, High]
        - label: Data integrity failure during synchronous training
          values: [Medium, High, High]
        - label: Financing and runway opacity
          values: [Medium, High, High]
    approximationNotes: Likelihood and residual severity are qualitative assessments from the retained evidence and unresolved diligence gaps; they are not probabilities.
    claimRefs: [CR003, CR005, CR009, CR013]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: Treat the thesis as broken if Zyphra cannot demonstrate independent production reliability, recoverability after a cluster or data-integrity failure, and a credible path to serve customers through more than one infrastructure dependency.
    claimRefs: [CR002, CR003, CR010, CR011]
  - calloutType: assumption
    title: No incident-free inference
    body: The retained sources document capability and policy exposure but do not establish the absence of outages, breaches, litigation, or customer failures.
    claimRefs: [CR004, CR005, CR008]
