    claimRefs: [CO002, CO003, CO007, CO008, CO009, CO010, CO013, CO014, CO015]
callouts:
  - calloutType: strength
    title: Technical execution is the clearest public proof point
    body: >-
      AMD's case study documents a 1,536-GPU training environment, while the 2025
      releases show sustained IBM and AMD collaboration. This is stronger evidence
      of execution than the available commercial metrics.
    claimRefs: [CO013, CO014, CO015]
  - calloutType: risk
    title: Financing and corporate data need primary-document reconciliation
    body: >-
      The assigned sources disagree on founding year, headquarters, financing
      amount, and 2026 valuation. None of the later financing values should anchor
      ownership or price analysis without signed closing documents and a cap table.
    claimRefs: [CO002, CO003, CO004, CO008, CO009, CO010]
