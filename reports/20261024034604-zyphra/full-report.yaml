chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and stage
        blocks:
          - type: paragraph
            body: >-
              Zyphra is described by AMD and independent analyst coverage as a San Francisco-based AI research and
              product company focused on multimodal models, infrastructure, and long-horizon agents. Its disclosed
              product surface spans Zyphra Inference Cloud and Maia, while the research program includes ZAYA1. The
              corporate record is not fully consistent: Tracxn and Dealroom report a 2020 founding, while Nextomoro
              reports 2021, and location sources alternate between San Francisco and Palo Alto. The most defensible
              stage description is therefore private, venture-backed, and at least Series A, with a later Series B
              reported by only some data aggregators. These discrepancies matter because later diligence should not
              treat profile fields from a single database as settled ground truth.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO016
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Two public profiles consistently identify Krithik Puthalath, Beren Millidge, Tomás Figliolia, and Danny
              Martinelli as co-founders. Nextomoro assigns the clearest operating roles: Puthalath as chief executive,
              Millidge as chief scientist, and Figliolia as head of AI model architecture. That distribution indicates
              concentrated founder responsibility across corporate direction, research, and model architecture, while
              the retained evidence does not establish a board roster, independent directors, voting rights, succession
              arrangements, or the current remit of every founder. The absence of those records in the assigned evidence
              is a diligence gap, not evidence that formal governance is absent. Key-person exposure appears highest
              around the chief executive and chief scientist because public technical and strategic narratives
              repeatedly center on their decisions and statements.
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: Financing, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a 2025 unicorn-stage financing but not a single clean funding history. Tracxn
              records an October 1, 2025 Series A at a $1 billion post-money valuation while leaving the amount
              undisclosed; Futurum and Engineering.com also report the $1 billion valuation. CrackTheDeck separately
              characterizes total funding as undisclosed. By contrast, Inven and Dealroom report a $500 million
              financing in May 2026, and Dealroom attaches a $5 billion valuation. Those later values require primary
              closing documents before use in underwriting. Inven's $10.1 million revenue figure is explicitly modeled
              and must not be presented as ARR, while its 74-person estimate and Tracxn's 75-person count indicate
              approximate scale rather than an audited workforce total. No retained source provides customer count, cash
              balance, burn, runway, ownership percentages, or debt terms.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO009
              - CO010
              - CO013
              - CO015
      - number: '1.4'
        title: Milestones and strategic dependencies
        blocks:
          - type: paragraph
            body: >-
              Zyphra's clearest operating milestones are infrastructure and model releases. Partner and analyst sources
              describe a multi-year IBM Cloud and AMD collaboration whose initial deployment became available in
              September 2025, followed by the November 2025 ZAYA1 announcement. AMD's August 2026 case study reports a
              192-node cluster with eight MI300X GPUs per node, or 1,536 GPUs, demonstrating substantial technical scale
              but also a concentrated dependency on AMD hardware and IBM-hosted infrastructure. The same evidence does
              not establish commercial conversion: Maia and Inference Cloud are described, but named production
              customers, contract values, renewal evidence, and customer outcomes are not disclosed. The retained pool
              also lacks regulator, court, or incident records sufficient for a complete adverse-event chronology, so
              the timeline should be read as evidence-constrained rather than exhaustive.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
