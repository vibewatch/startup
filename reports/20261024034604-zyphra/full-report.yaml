  - id: FI001
    title: Revenue-to-gross-profit bridge (qualitative)
    type: flow
    summary: >-
      Public evidence supports a qualitative path from open research and compute to paid cloud workloads, but not the
      prices or margins at each step.
    data:
      nodes:
        - id: research
          label: Open research and models
          detail: Zyphra Research develops open intelligence and multimodal models.
        - id: compute
          label: Training infrastructure
          detail: IBM Cloud and AMD infrastructure support large-scale training.
        - id: platform
          label: Zyphra Cloud
          detail: AMD describes a full-stack platform for training, inference, and agents.
        - id: workload
          label: Customer workloads
          detail: Target users include developers, enterprises, and frontier hyperscalers.
        - id: revenue
          label: Paid cloud revenue
          detail: Pricing, bookings, and recognized revenue are not publicly disclosed.
        - id: gross-profit
          label: Gross profit
          detail: GPU, storage, networking, and support costs are not disclosed.
      edges:
        - from: research
          to: compute
        - from: compute
          to: platform
        - from: platform
          to: workload
        - from: workload
          to: revenue
        - from: revenue
          to: gross-profit
    approximationNotes: >-
      This is an evidence-backed operating bridge, not a quantified revenue or margin forecast; unavailable commercial
      inputs remain explicitly unquantified.
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI007
      - CI013
  - id: FE001
    title: Zyphra product and technology architecture
    type: stack
    summary: >-
      Zyphra's disclosed stack runs from open data and model research through partner-backed training to cloud inference
      and agent delivery.
    data:
      layers:
        - id: research-data
          label: Open data and research
          detail: Public datasets and technical reports form the research substrate.
          items:
            - Zyda / Zyda-2 datasets
            - Open technical reports and weights
        - id: model-layer
          label: Model layer
          detail: Open-weight and multimodal model families expose the research output.
          items:
            - Zamba2 hybrid models
            - ZAYA1-8B MoE++
            - Zonos-v0.1 speech
        - id: training-layer
          label: Training platform
          detail: AMD compute, ROCm, and networking support large distributed runs.
          items:
            - AMD MI300X GPUs
            - ROCm and Pensando networking
        - id: cloud-layer
          label: Cloud delivery
          detail: IBM Cloud supports training while TensorWave is named for inference.
          items:
            - IBM Cloud training environment
            - TensorWave MI355X inference
        - id: agent-layer
          label: Agent product
          detail: Maia and Zyphra Cloud are the intended enterprise-facing layer.
          items:
            - Zyphra Cloud Inference
            - Maia multimodal agent
        - id: support-layer
          label: Control and support gap
          detail: Security, privacy, SLA, and customer proof are not disclosed in the assigned sources.
          items:
            - Enterprise controls to verify
    approximationNotes: >-
      The stack reflects source-described components and intended relationships; it does not imply that every layer is
      generally available or commercially integrated.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Customer journey from developer trial to infrastructure expansion
    type: journey-map
    summary: >-
      Public evidence supports a product and partner expansion path, while commercial conversion and retention remain
      unverified.
    data:
      nodes:
        - id: developer
          label: Developer discovery
          title: Developer discovery
          detail: Open-weight models and public repositories create an observable entry surface.
          stage: 1
          touchpoints:
            - Hugging Face models and datasets
            - Hugging Face activity feed
        - id: inference
          label: Serverless inference
          title: Serverless inference
          detail: Zyphra Cloud launches with model access without underlying-server management.
          stage: 2
          touchpoints:
            - Zyphra Inference
            - DeepSeek V3.2, Kimi K2.6, and GLM 5.1
        - id: workflow
          label: Production workflow
          title: Production workflow
          detail: Target use cases include agentic coding, deep research, and workflow automation.
          stage: 3
          touchpoints:
            - Long-horizon use cases
            - Developer and enterprise buyers
        - id: post-training
          label: Post-training expansion
          title: Post-training expansion
          detail: Distributed reinforcement learning and fine-tuning are described as upcoming capabilities.
          stage: 4
          touchpoints:
            - Reinforcement learning
            - Fine-tuning
        - id: agents
          label: Agent environments
          title: Agent environments
          detail: Sandboxed agent and development environments are described as upcoming capabilities.
          stage: 5
          touchpoints:
            - Sandboxed environments
            - AMD EPYC CPUs
        - id: infrastructure
          label: Dedicated infrastructure
          title: Dedicated infrastructure
          detail: Dedicated GPU clusters and bare-metal infrastructure are the highest-value expansion surface described.
          stage: 6
          touchpoints:
            - Dedicated GPU clusters
            - Bare-metal infrastructure
    claimRefs:
      - CU002
      - CU003
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Residual exposure is highest where infrastructure concentration and enterprise-control evidence intersect.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual severity
      rows:
        - label: Correlated AMD/IBM infrastructure failure
          values:
            - Medium
            - Critical
            - Critical
        - label: Enterprise accuracy, privacy, or security control gap
          values:
            - Medium
            - High
            - High
        - label: Copyright or training-data challenge
          values:
            - Medium
            - High
            - High
        - label: Partner capacity or financing visibility
          values:
            - Medium
            - High
            - High
        - label: Data integrity failure during synchronous training
          values:
            - Medium
            - High
            - High
        - label: Financing and runway opacity
          values:
            - Medium
            - High
            - High
    approximationNotes: >-
      Likelihood and residual severity are qualitative assessments from the retained evidence and unresolved diligence
      gaps; they are not probabilities.
    claimRefs:
      - CR003
      - CR005
      - CR009
      - CR013
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Evidence quality and commercialization uncertainty lead to a research-more recommendation.
    data:
      nodes:
        - id: scale
          label: Scale signal
          detail: Reported financing step-up and substantial AMD/IBM infrastructure
        - id: proof
          label: Technical proof
          detail: ZAYA1 and multimodal training evidence
        - id: economics
          label: Economics gap
          detail: Revenue, margin, burn, and retention are not verified
        - id: terms
          label: Terms gap
          detail: Primary financing documents and preference stack are unavailable
        - id: risk
          label: Risk-adjusted view
          detail: High risk and stretched/unverified valuation stance
        - id: decision
          label: Recommendation
          detail: Research-more pending primary diligence
      edges:
        - - scale
          - proof
        - - proof
          - economics
        - - economics
          - terms
        - - terms
          - risk
        - - risk
          - decision
    claimRefs:
      - CV016
