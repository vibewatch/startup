  - id: FM001
    title: Market-sizing hierarchy and missing company layers
    type: pyramid
    summary: >-
      Published category estimates establish broad ceilings; Zyphra-specific serviceable and obtainable layers remain
      undisclosed.
    data:
      items:
        - label: 'Broad enterprise AI: Mordor 2026'
          value: USD 114.87B
          detail: Global enterprise AI under Mordor Intelligence's broader component boundary.
          tone: neutral
        - label: 'Broad enterprise AI: Grand View 2026'
          value: USD 42.0B
          detail: A separate enterprise AI estimate with a narrower base and different segmentation.
          tone: neutral
        - label: 'Sovereign AI adjacency: 2025'
          value: Approximately USD 40.0B
          detail: MarketsandMarkets estimate; an adjacency rather than an additive pool.
          tone: neutral
        - label: Zyphra serviceable market
          value: Not disclosed
          detail: Requires products, geographies, eligible buyers, deployment constraints, and pricing.
          tone: warning
        - label: Buyer-level annual spend
          value: Not disclosed
          detail: Requires ACV, usage, capacity, and services-attach evidence by segment.
          tone: warning
        - label: Zyphra obtainable market
          value: Not disclosed
          detail: Requires pipeline, conversion, competition, implementation capacity, and retention evidence.
          tone: warning
    approximationNotes: >-
      The three published values preserve different scopes and periods and are not nested shares. The final three layers
      are explicit evidence gaps, not zero values or estimates.
