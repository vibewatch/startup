  - id: FP001
    title: Competitive positioning by buyer control and enterprise distribution proof
    type: quadrant
    summary: >-
      Analyst ordinal placement highlights Zyphra's control-oriented proposition and Cohere's stronger disclosed
      enterprise distribution, while preserving evidence gaps.
    data:
      xAxis:
        label: Buyer control and openness (analyst ordinal)
        min: 1
        max: 5
      yAxis:
        label: Disclosed enterprise distribution proof (analyst ordinal)
        min: 1
        max: 5
      points:
        - label: Zyphra
          x: 5
          'y': 2
          note: High openness is company-stated; enterprise targets are stated but named production customers are absent.
        - label: Cohere
          x: 2
          'y': 5
          note: >-
            TechCrunch reports security-first positioning and multiple named enterprise relationships; openness was not
            established.
        - label: OpenAI / Anthropic / Meta
          x: 1
          'y': 4
          note: >-
