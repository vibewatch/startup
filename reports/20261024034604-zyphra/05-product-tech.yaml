figures:
  - id: FE001
    title: Zyphra product and technology architecture
    type: stack
    summary: Zyphra's disclosed stack runs from open data and model research through partner-backed training to cloud inference and agent delivery.
    data:
      layers:
        - id: research-data
          label: Open data and research
          detail: "Public datasets and technical reports form the research substrate."
          items:
            - Zyda / Zyda-2 datasets
            - Open technical reports and weights
        - id: model-layer
          label: Model layer
          detail: "Open-weight and multimodal model families expose the research output."
          items:
            - Zamba2 hybrid models
            - ZAYA1-8B MoE++
            - Zonos-v0.1 speech
        - id: training-layer
          label: Training platform
          detail: "AMD compute, ROCm, and networking support large distributed runs."
          items:
            - AMD MI300X GPUs
            - ROCm and Pensando networking
        - id: cloud-layer
          label: Cloud delivery
          detail: "IBM Cloud supports training while TensorWave is named for inference."
          items:
            - IBM Cloud training environment
            - TensorWave MI355X inference
        - id: agent-layer
          label: Agent product
          detail: "Maia and Zyphra Cloud are the intended enterprise-facing layer."
          items:
            - Zyphra Cloud Inference
            - Maia multimodal agent
        - id: support-layer
          label: Control and support gap
          detail: "Security, privacy, SLA, and customer proof are not disclosed in the assigned sources."
          items:
            - Enterprise controls to verify
    approximationNotes: "The stack reflects source-described components and intended relationships; it does not imply that every layer is generally available or commercially integrated."
    claimRefs: [CE005, CE006, CE007, CE008]
callouts:
  - calloutType: strength
    title: Technical execution is unusually concrete
    body: AMD's case study reports 1,536-GPU training, 20 trillion tokens, long uninterrupted runs, and a named model architecture; this is stronger than generic frontier-AI marketing.
    claimRefs: [CE009, CE010, CE011]
  - calloutType: risk
    title: Commercial and control maturity remain under-documented
    body: The assigned evidence does not establish paid customer workflows, enterprise security certification, privacy governance, service-level commitments, or the economics of converting open-source adoption into cloud revenue.
    claimRefs: [CE015, CE016]
