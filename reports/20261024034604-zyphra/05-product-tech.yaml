company:
  name: Zyphra
chapter:
  number: 5
  title: Product & Technology
  summary: "Zyphra's public technical evidence is strongest around open-weight models, training data, and a large AMD/IBM training platform. The product surface is broader than the independently verifiable commercial surface: model and infrastructure execution are documented, while enterprise deployment controls, customer workflows, and production reliability evidence remain incomplete."
sections:
  - id: product-surface
    title: Product surface and maturity
    body: >-
      Zyphra presents a layered product strategy rather than a single application. Public
      materials identify open-weight model families, a training dataset, speech generation,
      and Zyphra Cloud/Inference, while the planned Maia agent is described as a general
      enterprise productivity system rather than a released product with disclosed adoption.
      The strongest independently inspectable developer surface is Zonos: its repository
      describes zero-shot text-to-speech, short-reference voice cloning, multilingual output,
      emotion controls, Docker deployment, and a runnable example. The Zamba2 technical
      report likewise describes 1.2B, 2.7B, and 7.4B hybrid Mamba2-transformer models,
      open weights, and the Zyda-2 pretraining dataset. These are concrete artifacts, but
      their open availability does not establish paid usage, support obligations, or an
      enterprise SLA. Product maturity is therefore high for research artifacts and
      infrastructure validation, but only partial for commercial workflow proof.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: operating-architecture
    title: Training and inference architecture
    body: >-
      The disclosed operating model is vertically integrated across data, model architecture,
      accelerators, networking, and cloud delivery. Zyda was assembled from seven open-source
      datasets with filtering, harmful-content removal, and deduplication; the 2024 report
      states that Zyda-2 was used for the Zamba2 series. For large-scale training, AMD's case
      study says Zyphra used 1,536 MI300X GPUs across 192 nodes, ROCm software, and Pensando
      Pollara networking, with IBM providing the bare-metal environment and spare nodes.
      ZAYA1-8B is described as an MoE model with 8B total and 0.7B active parameters, using
      Zyphra's MoE++ design. The later inference path uses MI355X GPUs on TensorWave
      infrastructure. This architecture can reduce dependence on a single model size or
      deployment target, but it also creates operational dependencies on AMD software,
      IBM Cloud/bare metal, TensorWave capacity, and Zyphra's own kernel and orchestration
      work.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: performance-reliability
    title: Performance, deployment, and reliability evidence
    body: >-
      The available performance evidence is technically specific but issuer-linked. AMD
      reports 20 trillion tokens trained on the MI300X cluster, many uninterrupted 48-hour
      runs, a roughly 72-hour weekend run, 16K context without context parallelism, and
      91.9% on AIME'25 for ZAYA1-8B after Zyphra's Markovian RSA test-time method. AMD also
      reports that a data-corruption fault was isolated and resolved with its help, and that
      ROCm-to-PyTorch conversion was straightforward while kernel optimization required
      additional work. These details support credible training execution, not generalized
      production reliability. IBM/AMD announcements establish a multi-year cluster
      agreement and planned expansion, but do not disclose uptime targets, incident history,
      security attestations, privacy controls, model evaluation governance, or customer-level
      deployment outcomes. Those omissions matter for an enterprise agent handling long
      context, audio, and potentially sensitive knowledge-work data.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: differentiation-and-gaps
    title: Differentiation and diligence blockers
    body: >-
      Zyphra's defensible-looking elements are the combination of compact or hybrid model
      architectures, open data/model releases, and co-design with AMD hardware and ROCm.
      The Zamba2 report claims state-of-the-art performance for its model class with gains
      in inference latency, throughput, and memory efficiency, while the Zonos repository
      demonstrates a relatively accessible deployment path. However, most comparative
      performance statements are company-authored or partner-distributed, and the public
      record does not provide a reproducible independent benchmark pack, patent portfolio,
      security certification, service-level commitments, or a clear conversion funnel from
      open-source use to paid cloud or Maia contracts. The technical risk is not merely
      whether models can be trained; it is whether Zyphra can sustain multi-vendor
      infrastructure, safe data governance, and supportable production behavior while
      monetizing an open ecosystem. Underwriting should therefore separate validated
      research and infrastructure capability from unverified commercial readiness.
    claimRefs: [CE013, CE014, CE015, CE016]
