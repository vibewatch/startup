schemaVersion: "report-v2"
artifact: financials
slug: zyphra
runDate: 2026-10-24
company:
  name: Zyphra
chapter:
  number: 4
  title: Financials
  summary: Zyphra has public evidence of a large, partner-supported AI infrastructure program and a reported $1B Series A valuation, but public disclosure does not establish realized revenue quality, gross margin, burn, runway, or customer-level economics. The underwriting case is therefore infrastructure-capable but financially opaque.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Zyphra presents a two-sided commercial model: research produces open or
      open-weight models, while Zyphra Cloud packages training, inference, and
      agent capabilities for developers, enterprises, and frontier
      hyperscalers. AMD's 2026 case study describes Zyphra Cloud as a
      full-stack AI platform, but neither that source nor the partner
      announcements supplies a price list, contract structure, recognized
      revenue, or customer-level conversion data. GetLatka explicitly says
      Zyphra has not published revenue and labels its $8.8M annual figure for
      December 2024 an estimate. That distinction makes the figure a scenario
      input rather than ARR or audited revenue. Dealroom labels the business
      model SaaS, but its profile is a data-platform summary and does not
      disclose realized pricing or revenue recognition. Underwriting should
      separate open-source adoption from paid cloud consumption until contracts,
      payer identity, retention, and revenue by stream are provided.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: sales-efficiency-and-costs
    title: Sales efficiency, compute costs, and margin drivers
    body: >-
      The public record describes a compute-intensive operating model rather
      than a low-cost software distribution model. IBM and AMD announced a
      multi-year arrangement for a large MI300X cluster, and AMD's case study
      describes 1,536 GPUs, 192 nodes, and long-duration training runs. Those
      facts establish technical scale and a material infrastructure dependency,
      not Zyphra's cloud bill, gross margin, utilization, or customer
      payback. The same case study says IBM provided the bare-metal
      environment and spare nodes, while Zyphra optimized models and kernels
      for the AMD stack. This may improve performance per dollar, but the
      source does not quantify prices, discounts, committed capacity,
      pass-through costs, or service-delivery labor. A financial model should
      therefore treat GPU access, networking, storage, inference capacity, and
      engineering support as separate cost drivers and leave CAC, payback,
      gross margin, and contribution margin unresolved.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: traction-and-capital-adequacy
    title: Traction and capital adequacy
    body: >-
      The strongest public financing signal is the IBM/AMD announcement that
      Zyphra recently closed a Series A at a $1B valuation. GetLatka reports
      $111.4M raised across two rounds, including a $100M Series A and an
      $11.4M pre-seed, while Dealroom records a different May 2026 $500M
      financing and $5B valuation. These figures conflict and are not
      independently reconciled; the later platform entries should not be
      treated as closed financing without primary documentation. CrackTheDeck
      emphasizes that Zyphra's funding total was not publicly disclosed in its
      2025 unicorn coverage, reinforcing the need for caution. Public sources
      do not report cash on hand, monthly burn, runway, debt, covenants,
      committed customer receipts, or the use of financing proceeds. The
      multi-year compute commitment and planned infrastructure expansion imply
      financing dependency, but they do not prove a cash shortfall or establish
      a next-round trigger.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI004]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Zyphra's financial profile is best characterized as technically
      well-capitalized-looking but disclosure-poor. Partner sources support
      access to substantial compute and a credible path to model production,
      while the only public revenue number retained here is a third-party
      estimate dated December 2024. No retained source establishes realized
      list-versus-net pricing, revenue mix, gross margin, net retention,
      customer concentration, cash balance, burn, runway, or debt obligations.
      The AMD case study also warns that performance and cost claims are
      provided by the featured third party and have not been independently
      verified by AMD, so benchmark gains should not be converted into
      financial savings. The investment conclusion is to research more: test
      whether open-source usage converts into recurring paid workloads,
      reconcile the financing chronology, and obtain monthly management
      accounts before underwriting a valuation multiple or runway.
    claimRefs: [CI003, CI007, CI010, CI012, CI013, CI014]

tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Zyphra Cloud training, "Hosted compute/model training", "Usage or contract", "Not disclosed", "Commercial mechanism described by AMD; no realized revenue", "Obtain bookings, billings, utilization, and payer-level contracts"]
      - [Zyphra Cloud inference, "Inference for long-horizon agents", "Usage or contract", "Not disclosed", "Product positioning only", "Obtain price per token/request, GPU cost, and gross margin"]
      - [Enterprise agents, "Maia/workflow software", "Subscription or enterprise contract", "Not disclosed", "Target use case described; no customer economics", "Obtain ACV, implementation fees, renewal and expansion data"]
      - [Open-source models and research, "Adoption funnel into paid services", "Downloads/users to paid conversion", "Adoption and conversion not disclosed", "Open-source activity is not revenue", "Provide cohort conversion, paid attach, and retention by model"]
      - [Zyphra Cloud pricing, "Cloud/platform service", "Not disclosed", "List price, realized price, and discounts unavailable", "Pricing is not disclosed", "Obtain official price list and realized contract terms"]
      - [Maia enterprise workflow, "Enterprise software or agent deployment", "Not disclosed", "ACV, implementation, and renewal terms unavailable", "Potential recurring stream remains unverified", "Obtain ACV, implementation fees, and renewal schedule"]
    notes: "Public sources describe products and target users but do not disclose recognized revenue, contract terms, or realized pricing; null-like statuses mean unavailable rather than zero."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI003
    title: Unit economics and cost drivers
    columns: [Metric, Value/null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "$8.8M annual estimate for Dec 2024", "Medium-low", "Provides a dated scale marker but is not company-reported", "Reconcile to audited or management revenue by stream"]
      - [Gross margin, null, "Unavailable", "GPU, storage, networking, and support intensity may materially affect contribution", "Provide gross margin bridge and cloud COGS allocation"]
      - [CAC/payback, null, "Unavailable", "Enterprise AI sales and deployment costs can consume early gross profit", "Provide funnel, sales cycle, CAC, payback, and implementation labor"]
      - [GPU utilization, null, "Unavailable", "Idle or reserved capacity changes unit economics", "Provide training/inference utilization and committed-capacity schedule"]
      - [Net retention, null, "Unavailable", "Expansion and renewal determine whether infrastructure spend compounds", "Provide cohort retention, expansion, churn, and concentration"]
    notes: "The only numeric revenue input is a third-party estimate. All other nulls are explicit diligence gaps; no zero values are inferred."
    claimRefs: [CI003, CI006, CI007, CI013]
  - id: TI004
    title: Capital adequacy and financing dependency
    columns: [Input, Public evidence, Underwriting interpretation, Status, Diligence ask]
    rows:
      - [Latest valuation, "$1B Series A valuation reported by IBM/AMD for 2025", "Useful reference point but not a current mark", "Reported; date-bounded", "Obtain signed term sheet or cap-table confirmation"]
      - [Total raised, "$111.4M across two rounds reported by GetLatka", "Conflicts with later Dealroom profile; do not reconcile by averaging", "Conflicting", "Verify round dates, investors, proceeds, and security type"]
      - [Cash on hand, null, "Cannot infer from capital raised or valuation", "Unavailable", "Obtain latest balance sheet and restricted-cash detail"]
      - [Burn and runway, null, "Compute and staffing commitments could be material, but no burn is disclosed", "Unavailable", "Obtain monthly burn, runway, and board-approved plan"]
      - [Debt/project finance, null, "No retained source establishes debt or covenants", "Unavailable", "Obtain debt schedule, cloud commitments, and termination obligations"]
    notes: "Funding raised is not cash available, valuation is not liquidity, and partner infrastructure announcements do not establish Zyphra's cash balance or runway."
    claimRefs: [CI009, CI010, CI011, CI012]

figures:
  - id: FI001
    title: Revenue-to-gross-profit bridge (qualitative)
    type: flow
    summary: Public evidence supports a qualitative path from open research and compute to paid cloud workloads, but not the prices or margins at each step.
    data:
      nodes:
        - id: research
          label: Open research and models
          detail: "Zyphra Research develops open intelligence and multimodal models."
        - id: compute
          label: Training infrastructure
          detail: "IBM Cloud and AMD infrastructure support large-scale training."
        - id: platform
          label: Zyphra Cloud
          detail: "AMD describes a full-stack platform for training, inference, and agents."
        - id: workload
          label: Customer workloads
          detail: "Target users include developers, enterprises, and frontier hyperscalers."
        - id: revenue
          label: Paid cloud revenue
          detail: "Pricing, bookings, and recognized revenue are not publicly disclosed."
        - id: gross-profit
          label: Gross profit
          detail: "GPU, storage, networking, and support costs are not disclosed."
      edges:
        - from: research
          to: compute
        - from: compute
          to: platform
        - from: platform
          to: workload
        - from: workload
          to: revenue
        - from: revenue
          to: gross-profit
    approximationNotes: "This is an evidence-backed operating bridge, not a quantified revenue or margin forecast; unavailable commercial inputs remain explicitly unquantified."
    claimRefs: [CI001, CI005, CI006, CI007, CI013]

callouts:
  - calloutType: strength
    title: Infrastructure capability is evidenced
    body: AMD and IBM sources describe a large-scale training environment, while AMD's case study reports 1,536 MI300X GPUs and stable long-duration training. This supports technical capacity, not economic efficiency.
    claimRefs: [CI005, CI006, CI007]
  - calloutType: risk
    title: Financial disclosure is the underwriting bottleneck
    body: Revenue is not company-published, funding figures conflict across secondary sources, and cash, burn, runway, margin, and customer economics are unavailable. Capital raised and infrastructure access should not be treated as liquidity.
    claimRefs: [CI003, CI010, CI011, CI012, CI014]
  - calloutType: recommendation
    title: Reconcile economics before valuation underwriting
    body: Request management accounts, signed financing documents, cloud commitments, realized pricing, customer cohorts, and a gross-margin bridge before relying on a valuation multiple or runway scenario.
    claimRefs: [CI010, CI012, CI013, CI014]

