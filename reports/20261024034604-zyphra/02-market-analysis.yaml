    claimRefs: [CM002, CM010, CM011, CM012, CM013]
callouts:
  - calloutType: "insight"
    title: "Category growth is not company TAM"
    body: "The reviewed enterprise-AI estimates differ by more than 2.7x for 2026, making boundary selection more important than choosing the largest published number."
    claimRefs: [CM010, CM011, CM013]
  - calloutType: "risk"
    title: "Commercial evidence is the gating layer"
    body: "Technical scale and broad adoption growth do not resolve Zyphra's missing pricing, buyer authority, ROI, pipeline, or attainable-share evidence."
    claimRefs: [CM004, CM006, CM008, CM009]
