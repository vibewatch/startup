      severity: "material"
      topic: "buyer-economics"
      missingEvidence: "Named production buyers, contracting authority, budget line, sales cycle, realized ROI, expansion behavior, and renewal evidence for each target segment."
      whyItMatters: "The public segment map identifies plausible users but cannot establish willingness to pay, procurement velocity, or durable demand."
