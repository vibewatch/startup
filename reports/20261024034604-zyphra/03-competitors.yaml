      - ["Independent performance validation", "Absent; AMD disclaims independent verification", "Not assessed", "Not assessed", "Not assessed", "Buyer testing required"]
      - ["Security and compliance evidence", "Not present in retained Zyphra material", "Security-first positioning reported", "Not reviewed in assigned pool", "Model and host dependent", "Buyer-controlled but buyer must validate"]
