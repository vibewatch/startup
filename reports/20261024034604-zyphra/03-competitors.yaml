  - id: TP003
    title: Pricing, packaging, and switching evidence
    columns:
      - Option
      - Public price or unit
      - Contract or packaging evidence
      - Included capability evidence
      - Switching implication
    rows:
      - [Zyphra Cloud, "Not disclosed", "No public package or minimum commitment in retained official page", "AMD-native platform for advanced AI systems and long-horizon agents", "Open positioning may reduce model lock-in; specialized AMD stack may raise implementation switching cost"]
      - [Cohere, "Not disclosed in retained source", "Enterprise relationships imply a direct or partner-led motion; terms unknown", "Security-focused enterprise LLMs", "Named partners can strengthen distribution and integration lock-in"]
      - ["Frontier-lab incumbents", "Not reviewed in assigned pool", "Unknown", "Frontier model alternatives", "Established model ecosystems may raise replacement friction"]
      - ["Open-weight alternatives", "Model weights are not a complete deployed-cost comparison", "Cloud, license, support, and integration terms vary", "Qwen, Gemma, Llama, and OLMoE appear in the retained benchmark comparison", "Supports multi-homing, but the buyer retains integration and operations burden"]
      - ["Internal build", "No standardized price", "Buyer procures compute, software, people, and support separately", "Maximum customization and control", "High sunk integration cost can create internal lock-in"]
    notes: >-
      No retained source provides comparable realized prices, discounts, usage units,
      support tiers, or total deployment cost; this is a gap table rather than a
      quantitative price comparison.
    claimRefs: [CP002, CP005, CP009, CP012, CP016]
