        - label: Llama
          x: 4
          y: 3
          note: "Open-model substitute cited in Zyphra-provided benchmark evidence; exact enterprise distribution was not assessed."
    approximationNotes: >-
      Coordinates are evidence-backed analyst ordinal scores, not measured market
      shares or benchmark results. The assigned pool does not support quantitative axes.
    claimRefs: [CP001, CP005, CP006, CP009]
callouts:
  - calloutType: risk
    title: Technical proof is concentrated in commercially aligned sources
    body: >-
      AMD and IBM partner materials substantiate scale and execution, but AMD explicitly
      says the featured organization's performance and cost claims were not independently
      verified. Treat benchmark leadership and economic advantage as unconfirmed.
    claimRefs: [CP003, CP004, CP005, CP006, CP011]
  - calloutType: recommendation
    title: Require a buyer-level bake-off before assigning moat value
    body: >-
      Compare quality, latency, deployed cost, reliability, security controls, contract
      terms, and switching effort against Cohere, a frontier API, an open-weight stack,
      and the buyer's internal baseline using the same production workload.
    claimRefs: [CP009, CP012, CP016]
