  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: enterprise-proof
      missingEvidence: Named production customers with buyer, user, payer, deployed workload, measured outcome, renewal status, and referenceability.
      whyItMatters: Without buyer-level proof, enterprise distribution and retention cannot be compared with Cohere or incumbent platforms.
      diligencePath: Request three production references and validate each through direct customer calls using a common outcome and renewal template.
      relatedQuestionRefs: [QP008]
    - type: missing-source
      severity: material
      topic: security-compliance
      missingEvidence: Current security architecture, independent audit reports, compliance certifications, incident history, data-governance controls, and service-level commitments.
      whyItMatters: Security and reliability are explicit enterprise buying criteria and a disclosed Cohere positioning advantage.
      diligencePath: Obtain the security package, latest penetration test and audit reports, subprocessor list, incident log, and standard SLA for technical review.
      relatedQuestionRefs: [QP008]
    - type: missing-source
      severity: material
      topic: pricing-gap
      missingEvidence: Comparable list and realized pricing, usage units, minimum commitments, support tiers, discounts, gross-margin inputs, and switching costs.
      whyItMatters: The absence of comparable economics prevents assessment of price advantage, lock-in, and total cost against APIs, open-weight deployments, or internal build.
      diligencePath: Request current rate cards and three redacted contracts, then run a same-workload total-cost bake-off across the principal alternatives.
      relatedQuestionRefs: [QP004, QP005]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: benchmark-independence
      missingEvidence: Reproducible independent benchmarks using identical models, quality thresholds, hardware configurations, latency targets, and deployed-cost denominators.
      whyItMatters: Partner-published results support technical execution but do not establish durable quality, performance, or cost leadership.
      diligencePath: Commission an independent evaluator to reproduce training and inference comparisons against CUDA and alternative open-model stacks.
      relatedQuestionRefs: [QP003, QP006]
