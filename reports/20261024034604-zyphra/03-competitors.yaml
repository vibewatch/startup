      - ["Full-stack AMD optimization", "Demonstrated at 1,536-GPU training scale in partner evidence", "Not established", "Not established", "Requires buyer or provider integration", "Requires buyer integration"]
      - ["Long-context systems evidence", "16K training context without context parallelism reported by AMD case study", "Not established", "Not established", "Model-specific and not compared", "Implementation-specific"]
      - ["Enterprise distribution proof", "Enterprise target stated; named customers absent", "Multiple named technology and enterprise relationships", "Market dominance reported, detail absent", "Community and provider dependent", "Existing internal procurement path"]
