          detail: "Reported financing step-up and substantial AMD/IBM infrastructure"
        - id: proof
          label: "Technical proof"
          detail: "ZAYA1 and multimodal training evidence"
        - id: economics
          label: "Economics gap"
          detail: "Revenue, margin, burn, and retention are not verified"
        - id: terms
          label: "Terms gap"
          detail: "Primary financing documents and preference stack are unavailable"
        - id: risk
          label: "Risk-adjusted view"
          detail: "High risk and stretched/unverified valuation stance"
        - id: decision
          label: "Recommendation"
          detail: "Research-more pending primary diligence"
      edges:
        - [scale, proof]
        - [proof, economics]
        - [economics, terms]
        - [terms, risk]
        - [risk, decision]
    claimRefs: [CV016]
callouts:
  - calloutType: recommendation
    title: Decision
    body: "Research-more: technical and strategic evidence is strong enough to justify continued diligence, but public evidence does not support underwriting the reported $5 billion mark without primary terms and operating economics."
    claimRefs: [CV002, CV007, CV010, CV016]
  - calloutType: risk
    title: Thesis-break triggers
    body: "Reassess downward if the reported financing is unclosed or materially repriced, if customer renewals and paid conversion remain undisclosed, or if cloud commitments and model-training costs outpace contracted demand."
    claimRefs: [CV008, CV011, CV012]
