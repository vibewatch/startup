company:
  name: Zyphra
chapter:
  number: 6
  title: Customers
  summary: Zyphra has public evidence of a productized inference platform and large-scale infrastructure relationships, but the assigned evidence does not identify paying customers, contract economics, renewals, or retention. The customer thesis therefore rests on credible developer and enterprise targeting signals rather than verified commercial durability.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segmentation
    body: >-
      Zyphra describes Zyphra Cloud as a platform for developers and enterprises, while AMD's
      case study also names frontier hyperscalers as a target. The product surface is therefore
      best segmented by workflow rather than by a disclosed customer list: developers consume
      serverless inference and model access; enterprise teams use agentic coding, deep research,
      and workflow automation; and infrastructure-scale buyers may use dedicated clusters or
      bare-metal capacity. IBM's announcement identifies Zyphra itself as the infrastructure
      customer for a multi-year training arrangement, but it does not identify Zyphra's
      downstream buyers. No source in the assigned pool supplies customer revenue bands, average
      contract value, procurement cycle, geography, or payer identity. That missing denominator
      prevents treating the platform's availability or partner relationships as evidence of
      broad paid adoption.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption and usage signals
    body: >-
      Public usage signals are strongest at the developer and infrastructure layers. The
      Hugging Face organization page records 35 models, five datasets, and visible model and
      dataset activity, while Dealroom reports 34K monthly website visits, up 88.9% over the
      preceding three months. These are observable distribution signals, not active customer
      counts, paid accounts, or retention. Zyphra Cloud was announced as available, with
      serverless inference first and post-training, sandboxed agent environments, dedicated
      GPUs, and bare-metal infrastructure described as upcoming. AMD reports that Zyphra
      trained about 20 trillion tokens and achieved repeated 48-hour runs, which demonstrates
      operating capacity for model development, not downstream customer utilization. An
      independent company profile also characterizes Zyphra's public-product visibility as
      comparatively narrow relative to peers at the same valuation tier. A dated cohort,
      request-volume, conversion, or renewal series remains unavailable.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof
    title: Named customer proof table
    body: >-
      The evidence supports three named commercial or strategic relationships, but their roles
      differ. TensorWave supplies compute infrastructure for Zyphra Inference, IBM supplies a
      large AMD training cluster on IBM Cloud, and AMD documents the resulting full-stack
      training case study. These relationships verify partner-enabled deployment and production
      infrastructure activity; they do not establish that TensorWave, IBM, or AMD is a paying
      end customer of Zyphra Cloud. The public material names no independent enterprise buyer,
      production workload outcome, pilot-to-production conversion, renewal, or customer quote
      from a Zyphra user. Consequently, the proof quality is high for infrastructure execution
      and low for customer monetization. A customer reference program should separate platform
      partners, model users, and contracting payers.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: durability-expansion
    title: Retention, expansion, and concentration
    body: >-
      Zyphra's proposed expansion path is explicit at the product level: inference is the
      launch surface, followed by distributed post-training, sandboxed agent and development
      environments, dedicated GPU clusters, and bare-metal infrastructure. That roadmap creates
      a plausible land-and-expand motion from developer inference to broader AI-system
      infrastructure, but the assigned sources provide no conversion rate, attach rate,
      contract length, gross retention, net retention, churn, renewal cohort, or account
      concentration. Partner dependence is visible because the launch relies on TensorWave
      compute and the training story relies on IBM Cloud and AMD hardware/software. There is
      also no adverse customer review, failed pilot, complaint, or procurement record in the
      assigned pool. The correct underwriting posture is to treat expansion as an unverified
      hypothesis and request customer-level evidence before crediting durability or pricing power.
    claimRefs: [CU014, CU015, CU016]
    tableRefs: []
