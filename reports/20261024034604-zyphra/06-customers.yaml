      coverage: partial
      basis: "Named relationships and customer-facing use cases visible in the assigned public sources fetched for this 2026-10-24 refresh"
    notes: "The table enumerates named parties and explicitly described target users, but the source set does not establish a complete customer population or commercial status for every relationship."
    claimRefs: [CU010, CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey from developer trial to infrastructure expansion
    type: journey-map
    summary: Public evidence supports a product and partner expansion path, while commercial conversion and retention remain unverified.
    data:
      nodes:
        - id: developer
          label: Developer discovery
          title: Developer discovery
          detail: Open-weight models and public repositories create an observable entry surface.
          stage: 1
          touchpoints: ["Hugging Face models and datasets", "Hugging Face activity feed"]
        - id: inference
          label: Serverless inference
          title: Serverless inference
          detail: Zyphra Cloud launches with model access without underlying-server management.
          stage: 2
          touchpoints: ["Zyphra Inference", "DeepSeek V3.2, Kimi K2.6, and GLM 5.1"]
        - id: workflow
          label: Production workflow
          title: Production workflow
          detail: Target use cases include agentic coding, deep research, and workflow automation.
          stage: 3
          touchpoints: ["Long-horizon use cases", "Developer and enterprise buyers"]
        - id: post-training
          label: Post-training expansion
          title: Post-training expansion
          detail: Distributed reinforcement learning and fine-tuning are described as upcoming capabilities.
          stage: 4
          touchpoints: ["Reinforcement learning", "Fine-tuning"]
        - id: agents
          label: Agent environments
          title: Agent environments
          detail: Sandboxed agent and development environments are described as upcoming capabilities.
          stage: 5
          touchpoints: ["Sandboxed environments", "AMD EPYC CPUs"]
        - id: infrastructure
          label: Dedicated infrastructure
          title: Dedicated infrastructure
          detail: Dedicated GPU clusters and bare-metal infrastructure are the highest-value expansion surface described.
          stage: 6
          touchpoints: ["Dedicated GPU clusters", "Bare-metal infrastructure"]
    claimRefs: [CU002, CU003, CU014]
callouts:
  - calloutType: strength
    title: Infrastructure proof is stronger than customer proof
    body: AMD and IBM evidence shows Zyphra can operate large-scale training infrastructure, while the launch material shows a concrete inference product. Neither establishes paid customer count or retention.
    claimRefs: [CU008, CU010, CU011]
  - calloutType: risk
    title: Commercial durability is unverified
    body: No assigned source discloses customer-level revenue, contract duration, churn, renewal, NRR, GRR, or concentration; expansion should not be valued as realized recurring demand.
    claimRefs: [CU015, CU016]
