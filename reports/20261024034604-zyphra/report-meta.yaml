  topStrengths:
    - Large-scale AMD and IBM infrastructure collaboration is publicly documented.
    - Technical execution evidence includes ZAYA1 and a reported 1,536-GPU training cluster.
    - Zyphra Cloud and Maia provide a concrete product path beyond research output.
  topRisks:
    - Named paying customers, contract economics, renewals, and retention are not disclosed.
    - Revenue, margin, burn, runway, and financing terms are not independently reconciled.
    - Compute and strategic-partner concentration may constrain economics and operating flexibility.
  unresolvedGaps:
    - Named production customers with buyer, user, payer, outcome, and renewal context.
    - Revenue by stream, ACV, gross margin, burn, runway, and retention metrics.
    - Closed terms and status of any 2026 financing beyond the last supported unicorn-stage round.
    - Runtime reliability, security, and compliance materials for enterprise deployments.
    - Conversion path from open-source or developer adoption into paid Zyphra cloud, compute, or Maia contracts.
