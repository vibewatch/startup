  title: Mitigation and kill criteria table
  columns:
  - Trigger
  - Why it matters
  - Kill criteria / monitor
  rows:
  - - Major regulatory enforcement
    - Could impair listings or sales categories
    - Escalate if a material fine or injunction appears
  - - Trust breach / counterfeit spike
    - Could damage consumer confidence
    - Escalate if fraud/counterfeit metrics reverse sharply
  - - Profitability reversal
    - Would weaken public-market thesis
    - Escalate if losses widen for multiple quarters
  - - Vendor or logistics concentration shock
    - Could reduce service levels
    - Escalate if a key partner outage persists
  notes: Kill criteria are intentionally simple and tied to observable public signals.
