callouts:
- calloutType: risk
  title: Trust is the recurring risk multiplier
  body: Most Meesho risks compound through trust. A marketplace can absorb many small failures, but a large trust failure
    can turn regulatory, operational, and growth risks into one event.
  claimRefs:
  - CR001
  - CR002
  - CR005
  - CR010
- calloutType: recommendation
  title: Watch the profitability trend, not just revenue
  body: The company is moving in the right direction on profit, but the thesis becomes fragile if revenue grows while losses
    or compliance costs re-accelerate. That is the cleanest monitoring rule for the next refresh.
  claimRefs:
  - CR009
  - CR011
  - CR012
