company:
  name: Meesho
chapter:
  number: 6
  title: Customers
  summary: 'Meesho''s customer base is unusually broad for a consumer marketplace: buyers, sellers, resellers, creators, and
    logistics partners all matter. The broadness is a strength, but it also means retention and concentration have to be judged
    through multiple lenses rather than a single enterprise-style contract metric.'
sections:
- id: segmentation
  title: Customer segmentation
  body: "Meesho serves a multi-sided customer set rather than a single account base. On the demand side are consumers, many\
    \ in Tier 2+ India; on the supply side are small sellers, artisans, manufacturers, and resellers; and around the edges\
    \ are creators and logistics partners who make the flywheel work. The annual report's examples of sellers and customer\
    \ stories show that the platform especially resonates where entrepreneurs want incremental income, low setup cost, and\
    \ low operational complexity. That means the customer story is really a set of linked usage stories: shopping demand,\
    \ seller acquisition, creator traffic, and partner execution all have to move together. The seller side also benefits\
    \ from an onboarding story that is low-cost enough for first-time entrepreneurs, which makes the platform more sticky\
    \ than a simple shopping app.\n That broader loop matters because a seller-led flywheel can offset weak one-time purchase\
    \ behavior on the buyer side."
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: Adoption trajectory and proof points
  body: The adoption curve is large and still moving. Meesho reported 120 million monthly users in 2022, 134 million downloads
    in 2023, and around 187 million annual transacting users by December 2024. Public case studies from Google Cloud, Databricks,
    Confluent, Microsoft, and Dragonfly all confirm that the company now operates at a scale where partner-grade technical
    proof matters. That matters because the customer base is no longer just shoppers; it is also the operational ecosystem
    that keeps the marketplace fast and reliable. Growth therefore depends on both repeat buying and the continuing ability
    to onboard sellers without making the experience harder. These adoption signals matter because they imply the platform
    has crossed from trial into habitual use. The next diligence question is less about whether people know the brand and
    more about how sticky the weekly or monthly shopping habit is. The evidence points to scale and habit, but not to a published
    cohort-retention curve, so the diligence read has to stay proxy-based.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
- id: retention-and-concentration
  title: Retention, concentration, and expansion
  body: 'Public evidence on exact retention, NRR, or churn is limited, so diligence has to use proxies: repeat-shoppers, order
    frequency, seller testimonial persistence, and platform usage intensity. The business appears to expand through both more
    orders per user and more seller-side monetization, while the main concentration risk is not a single customer account
    but ecosystem dependence on a few large infrastructure partners and a broad base of low-margin users. That makes the customer
    chapter more about usage health than contract renewals. Because the model is multi-sided, the biggest watch item is not
    a single contract renewal but ecosystem balance. If seller growth or partner quality slips, the customer story can weaken
    even if buyer traffic stays high. The key question is whether that balance can hold without a single point of dependency
    overwhelming the rest of the ecosystem.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU003
