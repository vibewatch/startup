callouts:
- calloutType: strength
  title: The user base is not the whole story
  body: Meesho's customer base is broader than buyer count alone. Sellers, creators, and logistics partners all reinforce
    the platform, which is why growth can compound across multiple layers at once.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
- calloutType: risk
  title: Retention is inferred, not fully measured
  body: The main weakness in the customer story is the absence of public NRR/GRR or churn data. That is normal for this business,
    but it means proxies have to stand in for direct retention metrics.
  claimRefs:
  - CU009
  - CU010
  - CU011
