callouts:
- calloutType: strength
  title: The stack is built for India-specific problems
  body: 'The strongest technical signal is not any single cloud vendor, but the fact that Meesho keeps solving India-specific
    friction points: vernacular search, address parsing, fraud, and low-latency commerce at huge scale.'
  claimRefs:
  - CE001
  - CE010
  - CE011
- calloutType: risk
  title: Vendor and architecture complexity can accumulate
  body: A highly modular stack is powerful, but it also increases integration and dependency risk. The more Meesho relies
    on best-of-breed systems, the more disciplined it has to be about observability, testing, and migration management.
  claimRefs:
  - CE005
  - CE006
  - CE007
