company:
  name: Meesho
chapter:
  number: 5
  title: Product & Technology
  summary: 'Meesho''s product is a multi-sided commerce platform, but its tech story is what makes the scale possible: cloud
    migration, recommendation systems, logistics intelligence, AI-assisted development, and aggressive trust-and-safety tooling.
    The product moat is increasingly operational rather than purely UI-based.'
sections:
- id: product-definition
  title: Product definition in workflow terms
  body: 'Meesho is best understood as an end-to-end commerce operating system for value sellers and price-sensitive buyers.
    The user workflow is simple: discover products, share or browse in vernacular contexts, place an order, fulfill through
    logistics partners, and then expand through repeat buying and seller promotion. Meesho''s 2024 annual report shows that
    the platform connects consumers, sellers, logistics partners, and creators, while the 2026 coverage shows the company
    using AI to make discovery and search more conversational and less English-first. That end-to-end framing is important:
    the platform is not just a storefront, but also a discovery engine, logistics orchestrator, and conversion layer for first-time
    online sellers and buyers.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture-and-reliability
  title: Architecture, deployment, and reliability
  body: 'The technical stack is modern and multi-cloud. Meesho moved static content and images to Google Cloud CDN, migrated
    analytical workloads to Databricks, used Confluent Cloud to handle bursty Kafka traffic, and has more recently highlighted
    a proprietary AI stack with major cost reductions. The recurring pattern is clear: shift commodity infrastructure to specialized
    platforms, then use the savings to support more throughput, lower latency, and better user-facing reliability. That makes
    the stack more modular and more resilient, but it also makes vendor management and architecture discipline a first-class
    job. The repeated use of managed infrastructure suggests that Meesho cares about speed, uptime, and cost at the same time.
    It also implies the product team can focus on marketplace logic rather than maintaining every commodity system in-house.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE002
- id: differentiation-and-controls
  title: Differentiation and trust controls
  body: 'Meesho differentiates through operations as much as through product features. The platform has public evidence of
    a strong trust-and-safety program: fraud prevention, counterfeit removal, bot-order blocking, and seller guardrails. In
    2026, the company said more than 70% of code is AI-generated, while products such as Vaani, GeoIndia, PRISM, TrustMesh,
    and Chorus show that the roadmap is focused on automation and localized commerce rather than generic retail features.
    The main unresolved product question is whether those tech gains remain proprietary enough to defend a durable edge. In
    practice, those controls reduce abuse and improve conversion, which means trust and safety is not a back-office function
    but part of the customer experience. That makes the roadmap increasingly intertwined with compliance and platform integrity.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE003
