company:
  name: Meesho
chapter:
  number: 8
  title: Valuation
  summary: 'Meesho looks like a company that has moved from venture narrative into public-market discipline: revenue is large,
    losses are narrowing, and the current valuation is now set by listed-market pricing rather than a private round. The core
    valuation debate is whether the current scale and profitability path justify a fair or attractive multiple once competition
    and trust risk are fully priced in.'
sections:
- id: thesis-and-antithesis
  title: Investment thesis and anti-thesis
  body: 'The bull case is straightforward: Meesho owns a distinct value-commerce niche, has very large live adoption, and
    has shown meaningful margin and cash-flow improvement. The bear case is equally straightforward: the model remains competitive,
    low-margin, and exposed to trust and regulatory noise, and the public-market valuation already reflects a lot of the growth
    story. A disciplined valuation view therefore has to keep both stories alive at once rather than treating the company
    as either a pure growth winner or a structural loser. The case is therefore best judged against what has already been
    proven: large-scale usage, positive cash generation, and a public-market price that still leaves room for both upside
    and disappointment.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: current-valuation-context
  title: Current financing and valuation context
  body: The latest public market coverage says Meesho became a public company in December 2025 and trades around a valuation
    in the high-$5B range. Earlier private rounds mattered, but they are now mostly context rather than the live price-setting
    mechanism. What matters today is whether the current revenue base, profitability path, and market share justify the listed-market
    value. On the evidence available here, the answer is not obviously cheap, but it is also not obviously stretched. Private-round
    history still matters because it shows how the market re-rated the company over time, but the listing makes the public
    price the real anchor. That means diligence should now emphasize consistency of execution and not just growth narrative.
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV002
- id: scenarios-and-discipline
  title: Bull, base, bear, and diligence discipline
  body: 'The right way to frame the stock is through scenario discipline. In the bull case, Meesho compounds profitable growth
    and strengthens monetization without losing its low-friction edge. In the base case, the company keeps growing but remains
    a fair-multiple platform business. In the bear case, competition, regulation, or margin pressure caps the upside. The
    thesis-break rule is simple: if growth, profitability, or trust deteriorate together, the story should move from track
    to avoid quickly. The practical rule is simple: if Meesho keeps improving revenue quality while preserving trust and logistics
    discipline, the valuation can work; if not, the public-market multiple will compress quickly.'
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  tableRefs:
  - TV003
