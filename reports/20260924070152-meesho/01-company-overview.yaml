company:
  name: Meesho
chapter:
  number: 1
  title: Company Overview
  summary: Meesho is a Bengaluru-founded, now-public value-commerce marketplace that has scaled to roughly 187 million annual
    transacting users while improving profitability and keeping a zero-commission seller model. The business remains execution-heavy,
    but the combination of scale, profitability improvement, and AI-enabled operations gives it a credible competitive position
    in mass-market Indian e-commerce.
sections:
- id: identity-and-scale
  title: Identity, scale, and product model
  body: Meesho has evolved from a social reselling startup into a large Indian e-commerce marketplace that now serves consumers,
    sellers, logistics partners, and creators. The company's own annual report says it became the first horizontal Indian
    e-commerce company to achieve profitability in FY24, while later public-market reporting shows it entered the public markets
    in December 2025. The model remains centered on a zero-commission marketplace, ad monetization, logistics enablement,
    and discovery-led commerce for mass-market shoppers, especially in Tier 2+ India.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO006
  figureRefs:
  - FO001
- id: leadership-and-funding
  title: Leadership, governance, and capital history
  body: 'The founders remain central to the operating narrative: Vidit Aatrey is the public face and CEO, and Sanjeev Barnwal
    is the CTO and co-founder. Meesho''s capital stack has been built through multiple venture rounds, with major investors
    including SoftBank, Prosus, Peak XV, Facebook/Meta, Fidelity, B Capital, and WestBridge. The company''s public disclosures
    and market coverage point to a capital-efficient scale-up path that culminated in an IPO-era public valuation and a larger,
    more diversified investor base than the early social-commerce phase. That investor mix matters because it affects board
    dynamics, follow-on expectations, and how quickly the market will reward or punish execution changes in a newly public
    company.'
  claimRefs:
  - CO004
  - CO005
  - CO007
  - CO008
  tableRefs:
  - TO002
  - TO004
- id: milestones-and-gaps
  title: Milestones, operating milestones, and gaps
  body: 'Meesho''s operating milestones show a repeatable pattern: scale the buyer base, deepen seller density, improve logistics
    and trust controls, and then improve monetization and cash flow. The latest annual-report and current-coverage sources
    show a 2026 push toward AI-assisted product development and voice commerce, alongside fraud controls and counterfeits
    enforcement. The public-company transition also changes the diligence lens: the key questions are no longer only whether
    the company can scale, but whether scale can be defended against logistics pressure, counterfeit leakage, and competitive
    discounting in practice today overall. The main unresolved diligence gaps are exact current headcount, exact current market
    cap from public-market sources, and external market sizing that is broader than Meesho''s own adoption metrics.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO003
  figureRefs: []
