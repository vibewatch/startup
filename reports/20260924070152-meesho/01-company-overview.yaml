callouts:
- calloutType: strength
  title: Scale is the core asset
  body: The strongest signal in the overview is not just the revenue line but the combination of a very large annual transacting
    user base, seller density, and logistics coverage. That scale gives Meesho leverage in discovery, advertising, and fulfillment
    economics.
  claimRefs:
  - CO003
  - CO009
  - CO010
- calloutType: risk
  title: Public-market diligence is now mandatory
  body: The company has crossed from private growth story into public-company execution, which means valuation, compliance,
    and trust controls now matter more than narrative alone. That shift increases transparency but also compresses tolerance
    for operational slips.
  claimRefs:
  - CO006
  - CO012
