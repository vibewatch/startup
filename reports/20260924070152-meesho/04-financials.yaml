callouts:
- calloutType: strength
  title: The financial inflection is real
  body: The most important financial signal is that Meesho has already crossed the line from growth-at-any-cost into cash-positive
    operation on at least one key measure. That does not make the business low risk, but it does make the path to sustainable
    scale much more credible.
  claimRefs:
  - CI005
  - CI006
  - CI008
- calloutType: risk
  title: Disclosure gaps still matter
  body: Without exact gross margin, NRR, and cash, investors have to infer too much from growth and loss trends. That is tolerable
    for a refresh, but it should not be mistaken for a fully transparent public-company financial model.
  claimRefs:
  - CI010
  - CI011
  - CI012
