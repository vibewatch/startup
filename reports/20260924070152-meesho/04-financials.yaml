company:
  name: Meesho
chapter:
  number: 4
  title: Financials
  summary: 'Meesho''s financial story is improving quickly: revenue is growing, losses are narrowing, and the business moved
    into profitability on an operating-cash basis before listing. The key question is not whether the model can scale, but
    whether Meesho can keep monetization and logistics efficiency improving faster than competition and public-market expectations.'
sections:
- id: revenue-and-mix
  title: Revenue streams and monetization mix
  body: Meesho remains a low-take-rate marketplace. The company and third-party coverage consistently describe a zero-commission
    seller model, with monetization coming from advertising, logistics, and adjacent services rather than a broad seller fee.
    That means revenue quality is tied to traffic, order density, and conversion rather than to a single high-margin contract.
    The upside is that scale can compound quickly; the downside is that the company must keep pulling efficiency out of logistics
    and discovery just to preserve margin expansion. The practical result is that Meesho should be judged as a transaction
    platform with mix-shift potential, not as a classic SaaS business. That distinction matters because monetization improves
    primarily through deeper usage, not through per-seat pricing.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: unit-economics
  title: Growth, margins, and cash generation
  body: The recent numbers are materially better than the earlier social-commerce years. FY24 revenue reached INR 7,615 crores
    and the company reported INR 197 crores of positive free cash flow. UpMarket and other market coverage show FY25 revenue
    around INR 93,858.74 million and H1 FY26 revenue at INR 5,578 crores, with the half-year net loss narrowing to INR 701
    crores. The financial pattern is therefore one of expansion plus leverage, not expansion at any cost. The trend line matters
    more than the absolute margin today because the company is still in a transition from hypergrowth to public-market discipline.
    What investors want to see next is whether revenue growth stays ahead of logistics and support expense inflation.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI002
- id: capital-and-verdict
  title: Capital adequacy and financial verdict
  body: 'Capital adequacy is not a near-term stress point, but it is still relevant because the marketplace model is capital-intensive
    at the logistics and customer-acquisition layer. Meesho raised substantial equity before listing, entered the public markets
    in December 2025, and is now valued in the public-market range rather than a private round. The main financial diligence
    gap is that several high-value metrics remain undisclosed or only partially triangulated: exact gross margin, net revenue
    retention, and exact current cash position all remain incomplete from public sources. If the company can keep combining
    scale with discipline, it should remain self-funding for the operating profile visible here. If not, the next refresh
    should focus on whether public-market growth is masking a renewed cash burn cycle.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  tableRefs:
  - TI003
