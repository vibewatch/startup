  - Observed signal
  - Implication
  - Gap
  rows:
  - - User adoption
    - ~187M annual transacting users
    - Very large live base already exists
    - Need independent market-share data
  - - Mobile demand
    - 120M MAU in 2022 and 134M downloads in 2023
    - Habit formation is strong
    - Need current MAU/retention trend
  - - Seller supply
    - Over 50% women entrepreneurs in 2021 coverage
    - Supply expansion is still underpenetrated
    - Need current seller mix
  notes: This is an evidence-constrained sizing table, not a top-down TAM model.
  claimRefs:
  - CM005
  - CM006
  - CM007
- id: TM003
  title: Segment and adoption table
  columns:
  - Segment
  - Role
  - Adoption trigger
  - Constraint
  rows:
  - - Consumers
    - Buy goods on the app
    - Low prices and relevant discovery
    - Trust and logistics reliability
  - - Sellers
    - List goods and manage orders
    - Zero-commission and easy onboarding
    - Need sustained demand and promotion
  - - Creators / resellers
    - Drive social commerce
    - Video and vernacular engagement
    - Monetization depends on continued engagement
  - - Logistics partners
    - Fulfilment layer
    - Cost and reliability
    - Service quality can widen or narrow conversion
  notes: Segments reflect the platform's multi-sided marketplace rather than a single buyer category.
  claimRefs:
  - CM008
  - CM009
  - CM010
