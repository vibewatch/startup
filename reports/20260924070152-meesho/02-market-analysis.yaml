callouts:
- calloutType: strength
  title: Meesho owns the low-friction lane
  body: The company's strongest market position is not just distribution, but the fit between low-commission supply, social
    sharing, and price-sensitive demand. That combination is hard to copy without changing the economics of the marketplace.
  claimRefs:
  - CM001
  - CM003
  - CM009
- calloutType: risk
  title: Sizing is still partly inference-based
  body: The addressable market is clearly large, but the company still lacks a single independent, fresh TAM/SAM/SOM source
    that resolves the whole debate. That uncertainty is acceptable for diligence, but it should stay visible in the next refresh.
  claimRefs:
  - CM011
  - CM012
