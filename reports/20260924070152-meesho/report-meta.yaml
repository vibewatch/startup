companyProfile:
  summary: >-
    Meesho is a Bengaluru-based Indian e-commerce marketplace founded in 2015 by Vidit Aatrey and Sanjeev Barnwal. It
    connects consumers, sellers, logistics partners, and creators through a zero-commission, discovery-led model that is
    strongest in Tier 2+ India. The company has scaled to roughly 187 million annual transacting users, reached
    profitability on a free-cash-flow basis in FY24, and now operates as a public company with a current market
    valuation in the high-$5B range.
