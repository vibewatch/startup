- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: wide
  summary: Ordinal map of the main alternatives by price posture and distribution fit.
  data:
    xAxis:
      label: Price posture / take-rate pressure (0-10 ordinal)
    yAxis:
      label: Distribution fit for value commerce (0-10 ordinal)
    points:
    - label: Meesho
      x: 9
      y: 8
      detail: Zero commission and strong Tier 2+ fit.
      tone: positive
    - label: Amazon
      x: 5
      y: 9
      detail: Broader monetization and general e-commerce breadth.
      tone: neutral
    - label: Flipkart
      x: 6
      y: 8
      detail: Strong Indian commerce brand with broad categories.
      tone: neutral
    - label: JioMart
      x: 7
      y: 7
      detail: Mass-market distribution tied to ecosystem reach.
      tone: neutral
    - label: WhatsApp / offline commerce
      x: 10
      y: 4
      detail: Lowest friction but limited platform monetization.
      tone: negative
    - label: Shopsy
      x: 8
      y: 7
      detail: Value-commerce adjacency from Flipkart.
      tone: neutral
  approximationNotes: Axes are evidence-backed ordinal judgments from public product and corporate positioning, not a published
    benchmark dataset.
