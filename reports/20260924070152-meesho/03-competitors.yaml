  - CC001
  - CC005
  - CC009
callouts:
- calloutType: strength
  title: The pricing wedge is real
  body: A zero-commission seller pitch is a tangible wedge, especially for small sellers who are sensitive to every percentage
    point of take-rate. That does not guarantee long-term victory, but it does create a clear adoption story.
  claimRefs:
  - CC005
  - CC006
- calloutType: risk
  title: Competitor response can compress the edge
  body: The most important competitive risk is not a direct feature copy; it is a rival using scale and subsidies to neutralize
    Meesho's price advantage while keeping better breadth or stronger trust.
  claimRefs:
  - CC007
  - CC008
  - CC010
