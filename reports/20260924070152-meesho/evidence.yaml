evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An exact current full-time headcount from a public filing or company disclosure.
    whyItMatters: The public range is enough for scale, but not enough for precise workforce trend analysis.
    diligencePath: Check the next annual report or a current filing for exact employee count.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: minor
    topic: valuation
    missingEvidence: A live public-market share count and market capitalization snapshot.
    whyItMatters: The public valuation estimate is directional rather than an exchange-verified close.
    diligencePath: Pull the latest exchange close and share count at the next refresh.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: minor
    topic: TO004-stakeholder-map
    missingEvidence: A complete ownership and investor cap table.
    whyItMatters: The stakeholder map is useful for governance context, but not a substitute for exact ownership percentages.
    diligencePath: Pull the latest cap table or shareholding pattern disclosure.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A fresh independent TAM/SAM/SOM estimate for India value-commerce that explicitly includes Meesho's reachable
      segment.
    whyItMatters: >-
      The market opportunity is clearly large, but a single agreed market-size source would tighten valuation and growth
      expectations.
    diligencePath: >-
