      - number: '1.2'
        title: 管理团队、治理架构与融资历程
        blocks:
          - type: paragraph
            body: >-
              创始人仍是公司运营叙事的核心：Vidit Aatrey 担任 CEO，是公司的主要对外代表；联合创始人 Sanjeev Barnwal 担任 CTO。Meesho 多轮融资的主要投资者包括
              SoftBank、Prosus、Peak XV、Facebook/Meta、Fidelity、B Capital 和 WestBridge。公司披露与市场报道显示，其扩张路径较为资本高效，最终以 IPO
              阶段的公开市场估值收官，投资者也比早期社交电商阶段更加多元。股东结构会影响董事会关系和后续融资预期；上市后，市场也会更快奖惩公司的执行变化。
