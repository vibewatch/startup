      - number: '1.3'
        title: 关键里程碑、运营节点与研究缺口
        blocks:
          - type: paragraph
            body: >-
              Meesho 的运营路径清晰且可重复：扩大买家群、提高卖家密度、改善物流和信任管控，再提升变现和现金流。最新年报及近期报道显示，公司 2026 年正推动 AI
              辅助产品开发和语音电商，同时加强反欺诈与假货治理。上市后，尽调重点也变了：不再只是看能否做大，还要看公司能否在现实运营中顶住物流压力、假货问题和竞争对手的折扣。仍待补足的信息包括准确员工人数、来自公开市场来源的准确市值，以及超出
              Meesho 自身用户采用指标的外部市场规模测算。
            claimRefs:
