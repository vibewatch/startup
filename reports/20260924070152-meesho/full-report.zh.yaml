  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Meesho 虽身处广义电商市场，实际聚焦的却是印度中小城市和城镇大众市场中以商品发现为主的平价购物。公司披露和第三方报道都强调零佣金卖家模式、本地语言购物，以及不同于大城市高端电商的客群。因此，竞争替代品不只有
              Amazon 和 Flipkart，还包括 WhatsApp 社交交易、街区零售和非正式转售网络；小卖家和价格敏感型消费者通过这些渠道交易，成本同样很低。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: 用户渗透路径与买家画像
        blocks:
          - type: paragraph
            body: >-
              市场数据仍显示，用户渗透有较大空间。Meesho 披露，2022 年月活用户为 1.2 亿，2023 年 App 下载量为 1.34 亿次；截至 2024 年 12 月，年交易用户约 1.87 亿。使用
              Meesho 的创业者中，女性占比超过一半。产品也持续适配本地语言和社交分享，贴近小卖家的交易习惯。由此看来，Meesho 不只是单一品类电商，而是连接家庭创业者、小零售商和价格敏感型消费者的平台。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 市场空间测算视角与扩张瓶颈
        blocks:
          - type: paragraph
            body: >-
              没有一份外部市场规模报告能单独界定 Meesho 的可触达市场，尽调应结合现有业务规模、Tier 2+
              买家渗透率和零佣金模式带来的变现缺口来判断。吸引力与约束来自同一处：消费者价格敏感、物流复杂、交易信任要求高，供给端还需要持续获客。交易规模可以很大，但若广告、物流和周边服务没有继续发展，单笔订单的变现仍会有限。因此，投资逻辑更看重复购频率和客单价提升，而非一个漂亮的
              TAM 数字；投资人和贷款人都应同时关注增长质量和覆盖面。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 图表分析
        blocks:
          - type: callout
            title: Meesho 占据低摩擦赛道
            body: Meesho 的优势不只在分销覆盖，更在于把低佣金供给、社交分享和价格敏感需求结合起来。对手若不调整平台经济模型，就很难完整复制这套组合。
            calloutType: strength
            claimRefs:
