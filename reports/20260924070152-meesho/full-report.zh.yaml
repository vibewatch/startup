    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、业务体量与产品模式
        blocks:
          - type: paragraph
            body: >-
              Meesho 从社交转售业务发展为大型印度电商平台，服务消费者、卖家、物流伙伴和创作者。公司年报称，它是首家在 FY24 实现盈利的印度综合电商公司；公开市场报道显示，Meesho 于 2025 年 12
              月上市。其模式仍以零佣金为核心，通过广告、物流服务和推荐导购变现，重点面向印度 Tier 2+ 城镇的大众消费者。
