callouts:
  - calloutType: insight
    title: Outschool wins when the purchase is part learning and part social discovery
    body: |-
      The strongest reason to choose Outschool is not low price or curriculum depth. It is the combination of live small-group interaction, unusually broad teacher-led subject variety, and kid-friendly browsing that makes learning feel elective rather than remedial.
    claimRefs:
      - CP003
      - CP042
      - CP049
  - calloutType: risk
    title: The moat is thinner on core academics than the marketplace scale suggests
    body: |-
      Free nonprofits, tutoring marketplaces, and rigorous curriculum providers can each peel away a different Outschool use case. That makes affordability, teacher retention, and trust execution more important than raw catalog size.
    claimRefs:
      - CP015
      - CP044
      - CP046
      - CP050
