  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: outschool-plan-pricing
      missingEvidence: A live official plan page or support article that exposes current consumer tiers, credits, and effective class-price math.
      whyItMatters: Affordability is central to whether Outschool loses families to tutoring marketplaces or free substitutes.
      diligencePath: Capture the current consumer checkout or plan selection flow and request management's current plan SKU sheet with worked examples.
      relatedQuestionRefs:
        - QP023
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: marketplace-retention
      missingEvidence: Cohort retention, repeat purchase, and family frequency data for Outschool and the closest rival cohorts.
      whyItMatters: Moat durability depends on whether families come back when the initial novelty or urgent tutoring need fades.
      diligencePath: Request 12-month family cohort tables by category, repeat purchase by learner age, and paid retention before and after the credits model.
      relatedQuestionRefs:
        - QP024
      relatedTableRefs:
        - TP004
    - type: missing-source
      severity: minor
      topic: competitor-price-transparency
      missingEvidence: Comparable public list prices for Varsity memberships, Wyzant typical hourly spend, Preply tutor price distribution, and curriculum-plan prices.
      whyItMatters: The chapter can compare pricing models, but not apples-to-apples family cost without current list cards.
      diligencePath: Capture live checkout pages for a fixed set of example learners and subjects across the direct rival set.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: teacher-multi-homing
      missingEvidence: Current teacher and family multi-homing rates, teacher churn, and class-fill distributions by category.
      whyItMatters: Supply-side switching cost is a core determinant of whether Outschool's marketplace remains differentiated.
      diligencePath: Ask management for teacher retention cohorts, survey data on cross-posting, and GMV concentration across repeat teachers.
      relatedQuestionRefs:
        - QP027
      relatedTableRefs:
        - TP004
