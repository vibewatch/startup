chapter:
  number: 3
  title: Competitors
  summary: |-
    Outschool's clearest differentiation is the bundle of live small-group instruction, an open teacher marketplace, and child-specific trust controls in a category where many alternatives only solve part of the job. Varsity Tutors is the closest paid live-learning rival, but Wyzant and Preply are more tutoring-centric, while Khan Academy, Schoolhouse.world, IXL, AoPS, Udemy, and Coursera all strip away some combination of social learning, teacher discovery, or kid-safe curation in exchange for lower cost, tighter sequencing, or broader async scale. That leaves Outschool best positioned in live, interest-led enrichment and weaker anywhere the buyer primarily wants remediation, mastery practice, or free content.
sections:
  - id: landscape-and-classes
    title: Landscape and competitor classes
    body: |-
      Outschool competes across four different alternative sets, not one. The closest paid analogs are live tutoring and class businesses such as Varsity Tutors, which bundles memberships, one-to-one tutoring, and hundreds of live group classes, and Wyzant, which is much larger as a tutor marketplace but is mostly designed around choosing a tutor rather than browsing classes. Preply extends that tutoring logic into recurring weekly subscriptions. A second group is structured curriculum and homeschool enrichment: IXL, AoPS, and Beast Academy win when a family wants sequencing, rigor, or advanced math depth rather than a discovery-led marketplace. A third group is free nonprofit learning through Khan Academy and Schoolhouse.world. The fourth group is broad asynchronous course supply from Udemy and Coursera.

      The common mistake would be to treat Outschool as just another tutoring site. Its differentiated job to be done is live, social, interest-led K-12 learning with unusually broad teacher-driven subject variety. That creates real distance from pure one-to-one tutoring, fixed curriculum, and adult-skills platforms. It also means Outschool is more discretionary than the status-quo substitutes in many cases: if the family only needs core-subject practice, SAT help, or low-cost skills content, there are strong free, tutoring, and async alternatives.
