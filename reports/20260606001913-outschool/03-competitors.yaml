  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform
      - Public pricing or packaging signal
      - Billing unit
      - What is included
      - Public unknowns
      - Competitive implication
    rows:
      - - Outschool
        - Teacher-set one-time or recurring class prices plus plan credits that can roll over; teacher economics include a 30 percent service fee
        - Per class, per week, and platform plans
        - Live small-group or self-paced classes from independent teachers
        - Exact current 2026 consumer plan tiers and credit conversion were not directly readable from reviewed public pages
        - Flexible for exploration, but affordability can feel less predictable than simple tutoring workflows
      - - Varsity Tutors
        - All-inclusive membership plus tutor matching and live classes; review coverage calls pricing premium and opaque
        - Membership
        - One-to-one tutoring support and hundreds of live group classes
        - Public list-card pricing remained hard to verify in retained sources
        - Closest direct live-class rival, but shopping transparency appears weaker than Outschool's marketplace browse flow
      - - Wyzant
        - Tutor-set hourly pricing, first lesson free if fit is wrong, pay after lesson
        - Hourly lesson
        - One-to-one tutoring, messaging, scheduling, and payment processing
        - No standardized family price card because tutors set their own rates
        - Easier for remediation or test help, but less suited to discovery-led group learning
      - - Preply
        - Trial lesson followed by recurring subscriptions from 1 to 5 hours per week
        - Weekly subscription hours
        - Ongoing tutor relationship and recurring lesson slots
        - Subject-level price distribution is tutor-specific and not comparable across all families
        - Strong for consistent tutoring cadence, weaker for hobby or social classes
      - - Schoolhouse.world
        - Free
        - Free session
        - Live Zoom tutoring, SAT bootcamps, and homework help
        - Volunteer supply and subject scope are narrower than paid marketplaces
        - Sets a zero-price anchor for academic-help spending
      - - Khan Academy
        - Free
        - Free access
        - Self-paced exercises, videos, and parent or teacher tools
        - No live cohort or marketplace layer in reviewed pages
        - Strongest pressure on standards-based academic use cases
      - - Coursera Plus
        - $59 per month, cancel anytime
        - Monthly subscription
        - 10,000+ courses and certificates from universities and companies
        - Adult or career orientation limits strict K-12 comparability
        - Useful teen or parent substitute, but not a child-safe live marketplace
      - - Udemy
        - Large async catalog with course-by-course and plan-style packaging
        - One-off purchase or plan
        - On-demand skills and hobby content
        - Child-specific safety and cohort structure are limited
        - Low-friction substitute for older learners, but socially thinner than Outschool
    notes: Public packaging information is uneven across the peer set. The chapter can compare pricing models, but exact apples-to-apples family cost remains incomplete without current checkout captures for representative subjects.
