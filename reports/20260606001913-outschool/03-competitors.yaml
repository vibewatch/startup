  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Live small-group marketplace breadth
        - Varsity's live classes plus tutoring can match much of the paid live-learning job for academically oriented families
        - High
        - Test win rates specifically in enrichment, hobby, and social learning categories rather than core remediation only
      - - Child-specific trust and safety surface
        - Adverse parent feedback on affordability or moderation can erode the homeschool and parent-trust narrative
        - Medium-high
        - Request complaint cohorts, refund rates, moderation incident rates, and policy-enforcement metrics by category
      - - Teacher entrepreneurship and long-tail supply
        - Teacher-owned curriculum and pricing likely make multi-homing easier than fixed-curriculum substitutes
        - High
        - Ask for teacher retention, cross-posting survey data, and share of GMV from repeat teachers
      - - Flexible family packaging
        - Credit-plan complexity can feel less predictable than pay-after-lesson tutoring or free substitutes
        - High
        - Request current plan SKUs, effective class-price examples, and pre/post change churn analysis
      - - Academic utility beyond enrichment
        - Khan Academy, Schoolhouse, IXL, and AoPS can win where the buyer only wants free help, mastery practice, or rigor
        - High
        - Show category-level repeat purchase and net retention for enrichment-heavy cohorts versus core-academic cohorts
      - - Review and social proof layer
        - Wyzant markets larger review volume, while Varsity benefits from public-company signaling and broader tutoring expectations
        - Medium
        - Benchmark review conversion, class fill rates, and parent repeat behavior versus the most comparable alternatives
    notes: Severity reflects underwriting risk to Outschool's differentiation, not a prediction that any one rival will dominate every segment.
