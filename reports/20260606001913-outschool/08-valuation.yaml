- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Verified current revenue misses the premium threshold
    - Diligence shows revenue materially below about $300M with no exceptional margins
    - The only public route to supporting $3B stops working even before terms are considered.
    - Do not underwrite the current mark.
  - - Public-funded and partner mix is lower quality than it looks
    - ESA / scholarship / partner cohorts show weak repetition, heavy subsidy, or poor contribution margin
    - Channel diversification stops justifying a premium marketplace multiple.
    - Re-cut the case on lower multiples and slower repeat demand.
  - - Retention and reenrollment are not premium
    - Membership churn, reenrollment, or cohort behavior lag what premium-multiple bulls need
    - The marketplace may be broad but not sufficiently sticky to outrun public comps.
    - Lower the bull-case probability and widen downside.
  - - No fresh price support exists below the 2021 headline
    - Board materials show no credible internal or external mark near $3B after 2021
    - The stale-mark problem becomes a real entry-price problem rather than a paperwork gap.
    - Demand a materially lower entry or wait.
  - - Preference stack is investor-unfriendly
    - Participation, liquidation preference, or secondary discounts materially reduce common-equity value
    - Headline valuation stops representing investable economics.
    - Pause until terms are rebased or clarified.
  notes: 'These are valuation kill triggers, not generic operating risks: each one explains how the current headline mark
    can fail economically.'
