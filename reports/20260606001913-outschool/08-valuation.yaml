- id: recommendation-exit-readiness-and-diligence
  title: Recommendation, exit readiness, and final diligence asks
  body: The right public-data call at the $3 billion mark is research-more with medium confidence, high risk, and a stretched
    valuation stance. That is not a verdict that Outschool lacks a business; the official and partner evidence points the
    other way. It is a verdict that the current price is under-documented. Public sources do not show audited 2024-2026 revenue,
    recurring retention, gross margin, refund leakage, or the cap-table terms that determine whether the headline valuation
    is economically clean for new money. Exit readiness is therefore better framed around strategic or sponsor interest than
    around a near-term IPO. Public education-platform multiples remain modest, and Outschool discloses much less than public
    peers. The call could improve if diligence shows that revenue is already north of roughly $300 million, that memberships
    and public-funded channels repeat well, and that preferences or secondary discounts do not hollow out the headline mark.
    The call should worsen quickly if revenue falls materially short of that threshold or if channel quality and terms prove
    weaker than the public narrative suggests.
