- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - current read
  - what would change the view
  rows:
  - - 'THESIS: the marketplace is real and scaled'
    - 140k+ classes, 1M+ learners, current memberships, and visible scholarship / ESA channels show real distribution rather
      than a paper market.
    - Private data showing weak repeat demand or low monetization per learner would weaken the scale thesis.
  - - 'THESIS: channel diversification may be improving'
    - Memberships, public-funded programs, and partner credits suggest Outschool is no longer only a discretionary enrichment
      checkout.
    - Channel-level cohort and margin data proving the public-funded mix is episodic or low quality would reduce the premium
      case.
  - - 'ANTI-THESIS: the $3B mark is stale'
    - Retained sources document the 2021 Series D clearly but do not show a later round or price-setting event.
    - A later tender, secondary, or financing near the same level would materially strengthen price support.
  - - 'ANTI-THESIS: public comps are much cheaper'
    - Duolingo, Coursera, Udemy, and Nerdy all trade far below the roughly 15x implied screen from the low-confidence Outschool
      revenue clue.
    - Verified current revenue well above the low-confidence public clue could shrink that gap quickly.
  - - 'ANTI-THESIS: the public denominator is low confidence'
    - Latka gives a useful clue but also falsely calls Outschool bootstrapped with zero outside funding.
    - Audited or board-approved revenue and gross margin data would replace the contradictory proxy.
  notes: The anti-thesis is mostly about denominator and term risk rather than about whether Outschool has achieved real marketplace
    scale.
