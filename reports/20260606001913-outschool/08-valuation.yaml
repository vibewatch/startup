- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Outschool (subject)
    - 2021 $3B valuation vs low-confidence 2024 revenue clue
    - ~15.0x on $3B and Latka’s $200M 2024 revenue estimate
    - Frames what the current headline mark implies if the only retained current denominator clue is directionally right.
    - The revenue clue is self-contradictory and cannot be treated as a high-confidence audited number.
  - - Duolingo
    - June 2026 market cap vs FY2025 revenue
    - ~4.9x on $5.08B market cap and $1.0376B revenue
    - Best premium consumer-learning public comp with real scale and strong growth.
    - Much stronger disclosure, global scale, and subscription quality than Outschool currently proves publicly.
  - - Coursera
    - June 2026 market cap vs FY2025 revenue
    - ~2.1x on $1.56B market cap and $757M revenue
    - Useful benchmark for a scaled public education platform with a mix of consumer and institutional demand.
    - More enterprise and catalog driven than Outschool’s live K-12 marketplace.
  - - Udemy
    - June 2026 market cap vs FY2025 revenue
    - ~0.8x on $0.67B market cap and $789.8M revenue
    - Shows how harsh public valuation can be when consumer and enterprise learning growth slows or gets repriced.
    - Different supply model and merger-specific context with Coursera.
  - - Nerdy
    - June 2026 market cap vs FY2025 revenue
    - ~0.8x on $0.15B market cap and $178.988M revenue
    - Closest public tutoring-style signal for what the market may pay for a live-learning platform with weaker proof.
    - Smaller, lower-scale, and operationally different from Outschool’s broader marketplace.
  notes: 'The set is intentionally partial and public: it is designed to bound Outschool’s price with reviewable market-cap
    and revenue evidence, not to claim a perfect like-for-like peer set.'
