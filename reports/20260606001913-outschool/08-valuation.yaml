company:
  name: Outschool
chapter:
  number: 8
  title: Valuation
  summary: Outschool’s $3 billion mark is well documented as a 2021 Series D fact, but the retained 2026 public record does
    not re-underwrite it as a current clearing price. Even the best retained current denominator clue—a contradictory third-party
    $200 million 2024 revenue estimate—implies about 15x revenue, above public EdTech comps and above a more disciplined post-2021
    sector backdrop. The public-data call is therefore research-more with medium confidence, high risk, and a stretched valuation
    stance until diligence proves materially higher revenue, durable repeat demand, and clean terms.
sections:
- id: financing-history-and-stale-mark
  title: Financing history and the stale $3B mark
  body: 'Outschool’s $3 billion valuation is well supported as a 2021 historical fact, but not as a freshly validated 2026
    price. PRNewswire, TechCrunch, EdTechReview, IBL News, and Tracxn all corroborate the October 2021 $110 million Series
    D and the rapid step-up from the April 2021 Series C. Tracxn still shows the latest valuation as $3 billion as of October
    2021, and none of the retained public sources shows a later round, secondary, or price-setting event that refreshes that
    mark. At the same time, current official pages still show a real, scaled marketplace: more than 140,000 classes, more
    than 1,000,000 learners, global reach, current 70/30 teacher economics, memberships, and meaningful public-funded channels.
    The adverse problem is therefore not business existence but price freshness. TechCrunch’s 2022 reporting that growth slowed
    more sharply than expected and that Outschool cut staff after schools reopened is a reminder that the 2021 mark was set
    in a more favorable period for education-technology sentiment than the one investors face in mid-2026.'
  claimRefs:
