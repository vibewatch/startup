- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - value
  - rationale
  rows:
  - - Recommendation
    - research-more
    - The company looks real and scaled, but public evidence does not refresh the 2021 price anchor enough for a buy call
      at $3B.
  - - Confidence
    - medium
    - Valuation history and comp data are solid; the current revenue and term bridge are not.
  - - Risk rating
    - high
    - A stale mark, opaque economics, and a colder EdTech valuation market can all compress value quickly.
  - - Valuation stance
    - stretched
    - The only retained current revenue clue implies roughly 15x revenue and sits well above public EdTech comparables.
  - - Decision implication
    - Do not underwrite the 2021 headline price without verified 2024-2026 revenue, retention, margin, and cap-table data.
    - The gap is price support, not product existence.
  notes: 'This chapter’s recommendation is explicitly price-sensitive: stronger private evidence could improve the call, but
    the current public file is not enough to do it for free.'
