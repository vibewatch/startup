- id: comparable-bridge-and-multiple-discipline
  title: Comparable framing and multiple discipline
  body: Simple public-comp work is directionally unfavorable to taking the 2021 headline valuation at face value. Finro’s
    2025 EdTech work says median EV-to-revenue is about 7.8x and that consumer-facing K-12 content models often trade below
    5x, while Exbo and HolonIQ describe a post-boom market that now pays more for retention, recurring contracts, and capital
    efficiency than for raw narrative. Public comps reinforce that message. Duolingo traded around 4.9x June 2026 market cap
    to FY2025 revenue, Coursera about 2.1x, Udemy about 0.8x, and Nerdy about 0.8x; even Chegg’s tiny market cap shows how
    far public consumer-edtech sentiment can re-rate downward. Outschool is not identical to any of these names. It has a
    marketplace supply side, memberships, and public-funded channels that can justify some premium if quality is real. But
    the only retained current revenue clue is Latka’s $200 million 2024 figure, and the same page incorrectly says Outschool
    is bootstrapped with no outside funding. That contradiction makes the denominator low confidence. Even so, $3 billion
    on $200 million implies about 15x revenue, which already looks stretched relative to the public screen.
