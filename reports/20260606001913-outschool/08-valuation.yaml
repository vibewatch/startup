  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: outschool-revenue-estimate
    missingEvidence: Audited or management-certified 2024-2026 revenue, GMV, and a gross-to-net bridge that can replace the
      contradictory Latka estimate.
    whyItMatters: Valuation direction is dominated by the denominator; using a contradictory third-party estimate without
      management support can over- or under-state the case by billions of dollars.
    diligencePath: Request monthly bookings, GMV, net revenue, membership revenue, and class-format mix for at least the last
      eight quarters.
    relatedQuestionRefs:
    - QV005
    - QV006
    - QV026
  - type: stale
    severity: material
    topic: stale-price-support
    missingEvidence: A post-2021 financing, secondary, tender, or other price-setting event that refreshes the valuation anchor
      for 2026.
    whyItMatters: The current headline mark is historical; without a fresher market-clearing event, investors are relying
      on a pandemic-era round in a very different valuation environment.
    diligencePath: Request board materials, cap-table history, secondary trade data, and any 409A or fairness materials prepared
      after October 2021.
    relatedQuestionRefs:
    - QV002
    - QV026
    - QV029
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Current preference stack, participation rights, liquidation waterfall, secondaries, and any investor
      protections attached to the 2021 round or later internal marks.
    whyItMatters: Headline valuation can diverge sharply from the economics available to a new investor if preferences, participation,
      or secondary discounts sit beneath the public narrative.
    diligencePath: Obtain the current cap table, financing documents, side letters, option-overhang schedule, and any secondary
      transaction summary since 2021.
    relatedQuestionRefs:
    - QV029
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-retention
    missingEvidence: Membership retention, re-enrollment rates, refunds, gross margin by format, and the contribution profile
      of public-funded and partner channels.
    whyItMatters: A premium multiple is only defensible if repeat demand and margin quality are better than what public consumer-edtech
      comps imply.
    diligencePath: Request cohort tables, margin waterfalls, refund data, reenrollment curves, and channel-specific contribution
      margin for family-pay, membership, ESA, and partner cohorts.
    relatedQuestionRefs:
    - QV027
    - QV028
    - QV030
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table-coverage
    missingEvidence: A broader set of direct private K-12 marketplace rounds, tenders, or secondaries that are closer to Outschool’s
      model than the available public consumer-edtech comps.
    whyItMatters: The comparable set is decision-useful but necessarily incomplete because directly comparable private live-learning
      marketplace marks are not publicly disclosed cleanly.
    diligencePath: Pull private-market comps from the data room, broker sheets, and investor materials, then compare them
      to the public screen used here.
    relatedTableRefs:
    - TV004
