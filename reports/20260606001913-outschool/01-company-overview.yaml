    {
      "id": "founders-leadership-and-governance-visibility",
      "title": "Founders, leadership bench, and governance visibility",
      "body": "The public record remains founder-centric. Multiple retained sources converge on Amir Nathoo, Mikhail Seregine, and Nick Grandy as the founding trio, with Nathoo clearly still functioning as CEO and primary public spokesperson across financing, product, and partnership announcements. TechCrunch also provides the cleanest founder-market-fit detail: Seregine previously helped build Amazon Mechanical Turk and Google Consumer Surveys, while Grandy came from Clever as a product manager. Public non-founder leadership visibility exists, but mostly through point-in-time announcements rather than a durable executive page: the 2023 tutoring release names Jim Blomo as Head of Product and Engineering, and the 2024 Courses release names Cara Delzer as Head of Supply and Partnerships. Governance is thinner than funding coverage. EdSurge reported that Reach Capital’s Jennifer Carolan joined the board after Series A, and Lightspeed’s portfolio page ties Alex Taussig to the account as board partner, but retained official pages do not expose a current full board roster, observer list, or ownership map. The diligence implication is straightforward: the company is not leaderless, but public bench depth and governance transparency lag behind capital visibility.",
