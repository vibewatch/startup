    {
      "id": "capital-base-valuation-and-public-metric-coverage",
      "title": "Capital base, valuation, and public metric coverage",
      "body": "Outschool’s financing history is well documented through 2021 even though current economics are not. Retained sources support a $1.4 million 2017 seed after Y Combinator participation, an $8.5 million 2019 Series A led by Reach Capital and Union Square Ventures, a $45 million 2020 Series B led by Lightspeed, a $75 million April 2021 Series C at a $1.3 billion valuation, and a $110 million October 2021 Series D at a $3 billion valuation led by Tiger Global with BOND joining. Summed disclosed rounds land at roughly $239.9 million, which is consistent with Outschool’s 2021 late-stage financing profile. What is weaker is the current operating picture. TechCrunch’s 2020 reporting showed about $54 million in sales, more than $100 million in annual run rate, and first profitability during the pandemic surge; by 2022 the company said platform bookings had topped $100 million. But retained 2024-2026 official pages do not provide current revenue, ARR, margin, or customer-concentration disclosure. Headcount is similarly messy: TechCrunch documented growth from 25 employees to 164 before the 2022 layoff, while Y Combinator’s profile now lists 107 employees. Those are useful boundary markers, not a reliable 2026 employee count.",
