    "number": 1,
    "title": "Company Overview",
    "summary": "Outschool is a 2015-founded San Francisco education marketplace that now presents itself as a private platform for live, self-paced, tutoring, and structured course experiences for learners ages 3–18. Public round history supports about $240 million of disclosed capital raised through the October 2021 Series D at a $3 billion valuation, but current revenue, precise headcount, and full governance visibility remain materially opaque."
  },
  "sections": [
    {
      "id": "identity-product-and-current-stage",
      "title": "Identity, product model, and current stage",
      "body": "Retained primary sources establish a stable company identity. Outschool says it was founded in 2015, initially serving homeschool families before broadening to learners in conventional schools, and it still operates as a private, San Francisco-based marketplace for children’s online learning. The current product surface is wider than the original after-school marketplace framing: the homepage now markets live and self-paced classes with real teachers, while official 2023-2025 releases add one-on-one tutoring, structured Courses for homeschool and alternative education families, and partner-led summer programming. Current scale is directionally strong but not perfectly tidy. The About page says Outschool offers more than 140,000 live online classes to more than 1,000,000 learners in 183 countries, while the careers page claims 1.5M+ learners, 26.5M+ courses, $488M+ teacher earnings, and reach across 195 countries. The company is therefore best described as a late-stage private marketplace with meaningful global reach and product breadth, but with official KPI drift that later chapters should treat cautiously rather than flatten into one number.",
