evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-bench
    missingEvidence: >-
      A current official executive roster with named leaders, reporting lines, and succession coverage beyond the
      founder core.
    whyItMatters: >-
      Public evidence confirms a few leaders but does not show whether the company has bench depth proportionate to its
      funding history and product breadth.
    diligencePath: Request the current org chart, executive bios, and a management-prepared leadership responsibilities matrix.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, observer list, ownership summary, and financing-rights overview through the latest round.
    whyItMatters: >-
      The public record is good on round sizes and investor names but weak on control dynamics, board composition, and
      liquidation rights.
    diligencePath: Request the board list, cap table, investor-rights summary, and the Series D closing memo or board materials.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A precise 2026 employee count with geography, function, and hiring-plan detail.
    whyItMatters: >-
      Stale or inconsistent public snapshots make it impossible to underwrite operating leverage, hiring discipline, or
      post-layoff organizational shape.
    diligencePath: >-
      Request current employee count, departmental headcount, geographic mix, attrition history, and hiring plan from HR
      or finance systems.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, burn, and cash-runway figures with management or audited support.
    whyItMatters: >-
      Funding history and historical growth snapshots are not enough to judge present-day efficiency, durability, or
      valuation support.
    diligencePath: >-
      Request monthly revenue, margin, burn, runway, and cohort-retention materials from management or the board
      package.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: teacher-count
    missingEvidence: A precise current count of active teachers or tutors, ideally split by modality and geography.
    whyItMatters: >-
      Teacher supply is a core marketplace input, and earnings or course-volume figures do not reveal concentration,
      utilization, or supply resilience.
    diligencePath: >-
      Request active teacher count, tutor count, concentration metrics, and supply quality KPIs from marketplace
      operations.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 public milestone coverage
    missingEvidence: >-
      A fuller internal chronology of launches, partnerships, policy engagements, service incidents, and governance
      changes after the public press trail.
    whyItMatters: >-
      The public chronology captures the highest-signal events, but management may have omitted internal milestones that
      materially change execution-risk interpretation.
    diligencePath: >-
      Request a management timeline covering launches, partnerships, key incidents, policy milestones, and board changes
      from 2015 onward.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: outschool-som
    missingEvidence: >-
      A company-quality dollar estimate for the live small-group marketplace slice of demand, including class-type mix,
      geography, and parent-pay versus subsidy mix.
    whyItMatters: Without it, TAM-to-SAM-to-SOM conversion remains illustrative rather than valuation-grade.
    diligencePath: >-
      Request 24 months of gross bookings or revenue split by tutoring, enrichment, homeschool, geography, and payment
      method.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: esa-usage
    missingEvidence: >-
      Verified data on how much Outschool volume is actually funded by ESAs, micro-grants, or scholarships by state and
      class type.
    whyItMatters: >-
      ESA eligibility is strategically important only if families can and do use those funds on the platform at
      meaningful scale.
    diligencePath: Request payment-method mix, approved-program status by state, and repeat usage rates for subsidy-funded learners.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: seasonality
    missingEvidence: Monthly active learners, bookings, and teacher supply across school-year, summer, and back-to-school periods.
    whyItMatters: Seasonality affects growth quality, marketing efficiency, and teacher liquidity in a marketplace model.
    diligencePath: Request a 24-month monthly cohort view of new learners, repeat learners, bookings, and teacher activity.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: international-regulation
    missingEvidence: >-
      A market-by-market regulatory map covering child safety, tutoring rules, payments, and tax obligations outside the
      United States.
    whyItMatters: >-
      International expansion looks attractive in abstract geography data, but execution risk is governed by local
      compliance and trust requirements.
    diligencePath: Request legal and payments memos for target non-U.S. markets plus current learner and teacher mix by geography.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A single internally consistent definition that bridges global tutoring, online tutoring, U.S. online tutoring, and
      K–12 supplemental spend into one comparable market stack.
    whyItMatters: >-
      Public market estimates are too scope-sensitive to use as one headline TAM without overstating or understating the
      reachable market.
    diligencePath: >-
      Triangulate parent-pay class demand, homeschool households, ESA-funded spend, and live-group conversion using
      company data rather than publisher averages.
    relatedQuestionRefs:
      - QM009
      - QM026
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: outschool-plan-pricing
    missingEvidence: >-
      A live official plan page or support article that exposes current consumer tiers, credits, and effective
      class-price math.
    whyItMatters: Affordability is central to whether Outschool loses families to tutoring marketplaces or free substitutes.
    diligencePath: >-
      Capture the current consumer checkout or plan selection flow and request management's current plan SKU sheet with
      worked examples.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: marketplace-retention
    missingEvidence: Cohort retention, repeat purchase, and family frequency data for Outschool and the closest rival cohorts.
    whyItMatters: Moat durability depends on whether families come back when the initial novelty or urgent tutoring need fades.
    diligencePath: >-
      Request 12-month family cohort tables by category, repeat purchase by learner age, and paid retention before and
      after the credits model.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: competitor-price-transparency
    missingEvidence: >-
      Comparable public list prices for Varsity memberships, Wyzant typical hourly spend, Preply tutor price
      distribution, and curriculum-plan prices.
    whyItMatters: The chapter can compare pricing models, but not apples-to-apples family cost without current list cards.
    diligencePath: Capture live checkout pages for a fixed set of example learners and subjects across the direct rival set.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: teacher-multi-homing
    missingEvidence: Current teacher and family multi-homing rates, teacher churn, and class-fill distributions by category.
