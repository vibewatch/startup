callouts:
- calloutType: strength
  title: The most useful market frame is “supplemental learning with flexible funding,” not “all tutoring.”
  body: Homeschool growth, ESA eligibility, and unmet afterschool demand widen the practical opportunity beyond pure tutoring while still keeping the market narrower than broad edtech or schooling TAM claims.
  claimRefs:
  - CM008
  - CM023
  - CM026
  - CM031
  - CM051
- calloutType: risk
  title: Commodity academic help faces real substitute pressure.
  body: Free tutoring, tuition-free virtual school, school-funded tutoring, and AI homework helpers all compete directly wherever the learner job is generic practice or homework support rather than live, social, differentiated class experiences.
  claimRefs:
  - CM041
  - CM043
  - CM044
  - CM045
  - CM050
  - CM054
- calloutType: assumption
  title: Underwrite a narrow online-U.S. and homeschool/enrichment SAM.
  body: The broadest public tutoring TAMs are directionally useful but not valuation-grade for Outschool. The more conservative underwriting lens is the digital, family-pay, subsidy-enabled supplemental slice where live group interaction matters.
  claimRefs:
  - CM014
  - CM015
  - CM016
