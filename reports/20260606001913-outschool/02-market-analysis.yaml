- id: TM004
  title: Growth drivers, seasonality, and normalization table
  columns:
  - driver or constraint
  - direction
  - timing
  - evidence
  - implication for Outschool
  - diligence ask
  rows:
  - - Persistent unfinished learning and recovery gaps
    - positive
    - Ongoing
    - Education Scorecard, CEPR, RAND
    - Supports continued demand for academic help and supplemental classes
    - Request class bookings and retention split between remediation and enrichment.
  - - Large unmet afterschool demand
    - positive
    - School year and summer
    - NCES, Afterschool Alliance, Wallace
    - Flexible online supply can fill capacity gaps that schools and local programs do not meet
    - Request geographic conversion data from markets with limited local program capacity.
  - - Homeschool growth above pre-pandemic baseline
    - positive
    - Year-round
    - JHU, EdChoice, NCES NHES
    - Expands flexible daytime demand and elective purchasing
    - Request homeschool learner share, repeat rate, and subject mix.
  - - ESA expansion and broader eligible uses
    - positive
    - State rollout cycles
    - NCSL, EdChoice, Outschool
    - Subsidy can reduce out-of-pocket friction and support repeat usage
    - Request approved-program status and payment success by state.
  - - ESSER expiration and district budget pressure
    - negative
    - 2025-26 onward
    - RAND, Education Scorecard
    - School-funded tutoring can soften as federal relief expires
    - Track whether company demand is parent-pay resilient when district budgets tighten.
  - - Post-pandemic normalization from 2020-24 highs
    - negative / normalization
    - 2025-27
    - Freedonia, CEPR
    - Growth should be underwritten more conservatively than in pandemic-era edtech surges
    - Benchmark current growth against 2024-27, not 2020-24, comparables.
  - - Continued role for online learning and virtual tutoring
    - positive
    - Ongoing
    - Frontiers, CRPE, The Business Research Company
    - Validates online delivery as a durable modality rather than emergency-only behavior
    - Request completion, satisfaction, and repeat usage by format.
  - - Seasonal peaks around spring, summer, and back-to-school
    - mixed
    - Q2-Q3 and schedule resets
    - NCES, Afterschool Alliance, Connections Academy, Edmentum
    - Marketing, teacher supply, and family acquisition likely move seasonally
    - Request 24 months of monthly bookings, active learners, and teacher supply.
  notes: This table mixes demand tailwinds with constraints because the market is simultaneously need-rich and substitute-heavy; seasonality matters as much as annual growth rates.
