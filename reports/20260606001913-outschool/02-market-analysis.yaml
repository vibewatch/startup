tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - status-quo substitute
  - relevance to Outschool
  rows:
  - - Live online small-group classes
    - Parent-paid or ESA-supported live classes, clubs, camps, and tutoring delivered online
    - Full-time schooling, asynchronous-only content libraries, and offline-only services
    - Parent and learner / parent, ESA, or micro-grant payer
    - Free tutoring, public virtual school, local co-ops
    - Core direct niche and clearest product fit.
  - - Online private tutoring
    - 1:1 or small-group online academic help, homework support, and test prep
    - In-person tutoring and general classroom instruction
    - Student user / parent, school, or sponsor payer
    - District tutoring, AI homework helpers, independent tutors
    - Important adjacency, especially for core academic use cases.
  - - Homeschool enrichment and flex education
    - Electives, clubs, daytime classes, and curriculum-adjacent support for homeschoolers
    - Full homeschool curriculum bundles and accredited full-time schools
    - Learner user / parent or ESA payer
    - Co-ops, pods, district part-time options
    - High-fit segment because flexibility and breadth matter.
  - - Afterschool and summer enrichment
    - After-school classes, camps, summer learning, and enrichment blocks
    - Childcare-only or non-learning activities
    - Learner user / parent or community payer
    - Local afterschool providers and camps
    - Seasonally important demand pool.
  - - ESA-funded supplemental learning
    - Tutoring, instructional materials, tech, out-of-school-time activities, and homeschool expenses funded through ESA-like accounts
    - State-ineligible purchases or non-approved vendors
    - Parent user / state-funded account payer
    - Approved district providers and direct curriculum vendors
    - Critical budget-enablement channel in some states.
  - - Full-time online public school and free learning resources
    - Zero-tuition public virtual schooling and nonprofit/free tutoring or content
    - Paid marketplace classes and camps
    - Family user / state, district, nonprofit, or free digital payer
    - Connections Academy, Schoolhouse, district tutoring, AI tools
    - Structural substitute set rather than the same revenue pool.
  notes: 'Boundary logic is buyer- and workflow-based: included spend sits in supplemental learning outside the standard school day, while full-time schooling and free/public options are modeled as substitutes or exclusions.'
