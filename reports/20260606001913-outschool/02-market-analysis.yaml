- id: substitutes-and-structural-constraints
  title: Free alternatives, structural substitutes, and regulatory constraints
  body: 'Outschool’s market is attractive only in the parts where live interaction and breadth matter more than low-cost content delivery. Free and low-cost substitutes are abundant. Schoolhouse.world offers free online tutoring and SAT bootcamps on Zoom; public schools and districts continue to fund tutoring and afterschool programs; and Connections Academy offers tuition-free full-time online schooling funded by state tax dollars. AI pressure is rising quickly: College Board found that 84% of high school students reported using generative AI for schoolwork by May 2025, and Microsoft says education has the highest industry-wide generative-AI adoption rate, with U.S. student use jumping 26 percentage points year over year. Brookings argues that AI can supply on-demand tutoring-like support, while Stanford’s SCALE notes that evidence of efficacy remains much thinner than adoption. Internationally, regulatory and equity issues also matter. Frontiers highlights cross-border online tutoring
    plus participation ranging from sub-10% to above 70% by region, and UNESCO frames private-tutoring regulation as a public-good issue because unregulated growth can deepen inequality. The practical read-through is that Outschool is strongest in live, social, interest-led, and homeschool-adjacent use cases, and weakest anywhere the job-to-be-done collapses into commoditized homework help or full-time virtual schooling.'
