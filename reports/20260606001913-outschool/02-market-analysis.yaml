  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: outschool-som
    missingEvidence: A company-quality dollar estimate for the live small-group marketplace slice of demand, including class-type mix, geography, and parent-pay versus subsidy mix.
    whyItMatters: Without it, TAM-to-SAM-to-SOM conversion remains illustrative rather than valuation-grade.
    diligencePath: Request 24 months of gross bookings or revenue split by tutoring, enrichment, homeschool, geography, and payment method.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: esa-usage
    missingEvidence: Verified data on how much Outschool volume is actually funded by ESAs, micro-grants, or scholarships by state and class type.
    whyItMatters: ESA eligibility is strategically important only if families can and do use those funds on the platform at meaningful scale.
    diligencePath: Request payment-method mix, approved-program status by state, and repeat usage rates for subsidy-funded learners.
    relatedQuestionRefs:
    - QM021
  - type: missing-source
    severity: material
    topic: seasonality
    missingEvidence: Monthly active learners, bookings, and teacher supply across school-year, summer, and back-to-school periods.
    whyItMatters: Seasonality affects growth quality, marketing efficiency, and teacher liquidity in a marketplace model.
    diligencePath: Request a 24-month monthly cohort view of new learners, repeat learners, bookings, and teacher activity.
    relatedQuestionRefs:
    - QM019
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: material
    topic: international-regulation
    missingEvidence: A market-by-market regulatory map covering child safety, tutoring rules, payments, and tax obligations outside the United States.
    whyItMatters: International expansion looks attractive in abstract geography data, but execution risk is governed by local compliance and trust requirements.
    diligencePath: Request legal and payments memos for target non-U.S. markets plus current learner and teacher mix by geography.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A single internally consistent definition that bridges global tutoring, online tutoring, U.S. online tutoring, and K–12 supplemental spend into one comparable market stack.
    whyItMatters: Public market estimates are too scope-sensitive to use as one headline TAM without overstating or understating the reachable market.
    diligencePath: Triangulate parent-pay class demand, homeschool households, ESA-funded spend, and live-group conversion using company data rather than publisher averages.
    relatedQuestionRefs:
    - QM009
    - QM026
    relatedTableRefs:
    - TM002
