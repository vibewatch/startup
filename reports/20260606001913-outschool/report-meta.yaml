coverageNotes: |
  This report was produced on 2026-06-06 using publicly available sources only. Outschool is a
  private company, and retained public evidence does not disclose current ARR, net revenue, gross
  margin, burn, runway, NRR, or a clean 2026 headcount. Official scale disclosures also drift
  across current pages (for example 1.0M+ versus 1.5M+ learners and 183 versus 195 countries), so
  scale metrics should be treated as directional rather than perfectly harmonized. The $3 billion
  valuation referenced here is the last publicly disclosed October 2021 Series D mark, not a
  validated 2026 clearing price, and the only retained current revenue clue was kept as low
  confidence because it conflicts with well-supported funding history.

