    "number": 7,
    "title": "Risks",
    "summary": "Outschool's main risks are structural rather than one-off: it must keep a live, recorded marketplace for minors safe and compliant while relying on independent teachers, Zoom, and increasingly policy-sensitive funding channels. The company shows serious mitigation intent, but post-pandemic demand normalization, teacher-economics pressure, and incomplete public outcome data leave material residual exposure."
  },
  "sections": [
    {
      "id": "demand-normalization-and-monetization",
      "title": "Post-pandemic demand normalization and monetization risk",
      "body": "Outschool's biggest economic risk is not that online enrichment disappears, but that pandemic-era pull-forward leaves the platform fighting for steady fill rates, family affordability, and teacher retention. Two TechCrunch reports show the reset clearly: the company cut 18% of staff in mid-2022, then another quarter of staff later that year, with CEO Amir Nathoo saying growth had 'come back down to earth' and slowed more than expected once learners returned to school full time. Current public evidence is thinner but directionally consistent. Outschool's educator-facing 2024/2025 materials emphasize waitlists, badges, and bi-weekly enrollment patterns rather than GMV or teacher-retention disclosure, suggesting marketplace optimization matters more than breakout top-line growth in the public narrative. Teacher and parent review surfaces reinforce the same risk: teachers describe oversupply, unstable earnings, and a 30% platform fee, while parents complain about affordability under the newer membership model. That combination makes demand normalization a quality risk as much as a revenue risk, because weak fill rates can thin the best teacher supply and raise substitution pressure from cheaper or lower-friction alternatives.",
