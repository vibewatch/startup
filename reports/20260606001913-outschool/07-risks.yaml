    {
      "id": "teacher-quality-moderation-and-reputation",
      "title": "Teacher quality, contractor dependence, and reputational moderation risk",
      "body": "Outschool's marketplace model deliberately pushes content creation and class delivery to independent teachers, which expands catalog breadth but also makes quality and moderation harder to standardize. The teacher addendum gives teachers pricing and class-design freedom, yet Outschool still controls listing approval, onboarding, background checks, payout mechanics, safety rules, and the ability to suspend or remove teachers. That is an awkward middle ground: enough platform control to make quality expectations and contractor dependence meaningful, but not enough direct employment control to guarantee consistent delivery. The public complaint surface shows why this matters. Parent reviews raise both affordability and curricular-fit complaints, while teacher review surfaces describe oversaturation, weak fill rates, and frustration that a 30% commission does not guarantee demand. Community Standards and content policies reduce some risk by requiring objective, secular, age-appropriate classes and banning harassment or discriminatory conduct, but those same policies can turn individual class disputes into platform-level moderation or reputational events. The key risk is not one bad class; it is whether thin economics or fast marketplace growth degrade the average teacher experience faster than Trust & Safety can police it.",
