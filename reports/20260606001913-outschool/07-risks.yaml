      "id": "child-safety-privacy-and-legal",
      "title": "Child safety, COPPA/privacy, and legal exposure",
      "body": "Child safety and privacy are the chapter's highest-severity structural risks because Outschool serves minors, routes live classes through Zoom, records every live class, and permits teachers to use disclosed third-party tools. Outschool's own policies show meaningful mitigation: teacher screening and SSN-based background checks, mandatory identity checks at class start, mandatory reporter obligations, COPPA-compliant tool rules for under-13 learners, and 90-day encrypted recording retention on Outschool servers rather than Zoom. The problem is not absence of controls; it is the width of the compliance surface. The privacy policy says Outschool complies with COPPA, GDPR, U.S. consumer privacy rules, and supports FERPA obligations, while the FTC's 2025 COPPA update and external legal analysis show 2026 compliance pressure rising around biometrics, parental notices, and state-law patchworks. Because Outschool is an open marketplace with many independent teachers, every control has to work operationally at scale across live classes, recordings, messaging, and external tools. A safety failure, data-handling error, or regulator complaint could move quickly from incident management into reputational and legal damage.",
