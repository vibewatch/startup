    {
      "id": "funding-platform-and-operational-dependencies",
      "title": "Policy, funding, platform, and operational dependency risk",
      "body": "Outschool is also exposed to infrastructure and policy channels it does not fully control. Core class delivery runs through Outschool's platform and Zoom, the public status page breaks out Zoom access, messaging, enrollment, and website components separately, and the teacher payment policy routes payouts through PayPal. The current status surface is reassuring but incomplete: the page showed 100% Zoom-class uptime over the visible 90-day window, yet it does not provide enough long-run incident depth to underwrite multi-year reliability or root-cause patterns. On the demand side, Outschool is clearly leaning into public-funding-adjacent channels. Its ESA guide tells families to follow state-specific rules and buy through state marketplaces, while Outschool.org markets itself as a partner for ESA and scholarship programs. NCSL and state program pages show why that matters: allowable expenses, approval processes, oversight, and timelines differ materially by state. Public-funding channels can expand access and lower price sensitivity, but they also make demand more exposed to audit friction, reimbursement delays, vendor-approval changes, and political reversals.",
