  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Discovery and catalog layer
        - Exposes classes, reviews, recommendations, teacher profiles, and membership offers to families
        - Outschool web marketplace and learner-facing pages
        - Ranking logic, search relevance tuning, and fraud controls are not publicly disclosed
      - - Class / section management layer
        - Separates reusable class metadata from scheduled inventory and marketplace visibility
        - Teacher listing workflow and section scheduler
        - Teacher productivity and listing-review throughput are not public
      - - Classroom content layer
        - Handles announcements, lessons, assignments, welcome videos, attachments, and parent/learner messaging
        - Outschool Classroom and syllabus system
        - Public docs do not reveal storage architecture, permissions model, or analytics depth
      - - Live delivery layer
        - Powers scheduled synchronous sessions with moderation and accessibility controls
        - Zoom integration for every live class
        - Vendor concentration on Zoom creates dependency risk for uptime and product pacing
      - - Recording governance layer
        - Moves live-session recordings off Zoom, stores them privately, and governs viewer access
        - Outschool private servers plus Trust & Safety policy enforcement
        - Public sources do not reveal storage vendor, region, or disaster-recovery design
      - - Mobile family layer
        - Extends schedules, search, messaging, and joins onto phones, tablets, and Chromebooks
        - Apple App Store and Google Play distribution
        - Educators still need the browser for full account access; app adoption and crash metrics are undisclosed
      - - Engineering and AI expansion layer
        - Recruiting shows the application stack and new product bets around public-funding workflows and AI-native development
        - TypeScript, React, Node.js, GraphQL, PostgreSQL, and new AI initiative hiring
        - Job posts are a clue, not a substitute for architecture diagrams or production-service inventories
    notes: >-
      This table uses only layers made explicit in retained public sources. It does not infer hidden
      cloud vendors, databases beyond recruiting references, or internal microservice boundaries.
