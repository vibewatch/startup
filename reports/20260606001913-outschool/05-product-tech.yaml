      - - Breakout-room monitoring and mandatory-reporter duties
        - Publicly documented in teacher policy
        - Applies to live-session moderation and suspected abuse/neglect escalation
        - No public reporting on incidents, strikes, or enforcement throughput
      - - Recording retention and access controls
        - Publicly documented and specific
        - All live classes recorded, encrypted, non-downloadable, and deleted after 90 days absent exceptions
        - No public detail on storage vendor, region, or audit logging
      - - COPPA extension and children’s privacy notice
        - Publicly documented
        - Outschool says it extends COPPA protections to all children and explains under-13 handling in its Children’s Privacy Notice
        - No public mapping of controls to 2026 amended COPPA obligations beyond policy text
      - - Third-party tool and AI disclosure rules
        - Publicly documented
        - Teachers must use COPPA-compliant tools for under-13 learners and disclose AI use in listings
