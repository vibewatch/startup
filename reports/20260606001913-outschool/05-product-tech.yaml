company:
  name: Outschool
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Outschool’s public product record supports a real, multi-format live-learning marketplace: the
    company exposes class discovery, section scheduling, classroom tooling, Zoom-based delivery,
    recording governance, family mobile apps, and active 2026 engineering hiring around AI and
    public-funding workflows. The remaining underwriting gap is not whether a product exists, but
    how much of the deeper service topology, moderation throughput, educator-mobile parity, and
    vendor dependence can be verified without direct management access.
sections:
  - id: marketplace-surface-and-discovery
    title: Marketplace surface and discovery UX
    body: >-
      Outschool’s public surface is broader than a single tutoring or Zoom-class product. The
      homepage and learner marketplace both frame the product as a large catalog of live and
      self-paced classes for ages 3–18, with discovery driven by reviews, teacher profiles, and
      personalized recommendations rather than a fixed curriculum path. The support center then
      fills in the format map: one-time classes, short courses, camps, semester courses, recurring
      weekly classes, and asynchronous groups all sit under the same marketplace umbrella. That is
      strategically important because it lets Outschool reuse one discovery layer across multiple
      learning cadences, while memberships add a second monetization-and-retention layer on top.
      Memberships change checkout mechanics by turning spend into credits, removing marketplace fees
      for members, and bundling a 100+ self-paced library plus rollover credits. The main product
      message is therefore flexibility: families browse a very large catalog, compare teacher-driven
      formats, and choose either pay-as-they-go or credit-backed usage. The weak point is that the
      same openness that creates breadth also makes quality heavily dependent on individual teacher
      execution, which outside reviews still flag as variable.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
