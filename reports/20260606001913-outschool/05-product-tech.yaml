  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: trust-ops-metrics
      missingEvidence: >-
        Public Trust & Safety operating metrics such as reports per 1,000 sessions, strike volumes,
        response SLAs, appeal rates, and recording-review throughput.
      whyItMatters: >-
        Policy text alone cannot show whether Outschool’s moderation system scales effectively across
        a large live-class marketplace with many independent teachers.
      diligencePath: >-
        Request a Trust & Safety KPI pack covering incident taxonomy, strike issuance, appeals,
        enforcement latency, and staffing coverage for the last 12 months.
      relatedQuestionRefs:
        - QE014
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: learner-facing-ai
      missingEvidence: >-
        Explicit product documentation for any learner-facing AI assistant, model-governance process,
        approved AI vendors, evaluation criteria, or a clear statement that AI remains limited to
        lifecycle/personalization and teacher-disclosed classroom use.
      whyItMatters: >-
        AI is visible in recruiting and partner case studies, but investors still cannot tell whether
        learner-facing AI is strategically central, experimentally limited, or intentionally absent.
      diligencePath: >-
        Ask product and legal leadership for the AI product roadmap, model inventory, safety review
        process, and any learner-facing deployment metrics or abstention policy.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE005
    - type: private-evidence-only
      severity: material
      topic: architecture-gap
      missingEvidence: >-
        Architecture review showing service boundaries, hosting providers, data residency, backup and
        recovery, identity model, observability stack, and any internal or external API surface for
        the core marketplace.
      whyItMatters: >-
        The deepest technical underwrite depends on knowing where the platform is tightly coupled to
        vendors, where scaling bottlenecks live, and how privacy obligations map to actual systems.
      diligencePath: >-
        Request a CTO architecture briefing, security questionnaire, and system inventory that ties
        product surfaces to storage regions, auth controls, and external vendors.
      relatedQuestionRefs:
        - QE026
      relatedTableRefs:
        - TE003
    - type: missing-source
      severity: minor
      topic: mobile-parity
      missingEvidence: >-
        Mobile MAU, enrollment conversion share, crash and retention data, and the roadmap for
        educator-facing mobile parity beyond current family-first capabilities.
      whyItMatters: >-
        Public app listings prove distribution, but they do not show whether mobile is strategically
        meaningful or just a convenience layer for existing desktop families.
      diligencePath: >-
        Ask for iOS and Android MAU, enrollment share, notification opt-in, crash rate, and planned
        educator/mobile admin features by quarter.
      relatedQuestionRefs:
        - QE017
        - QE018
      relatedTableRefs:
        - TE001
        - TE005
