      - FE002
  - id: trust-safety-privacy-and-moderation
    title: Trust, safety, privacy, and moderation
    body: >-
      Trust and privacy controls are some of the strongest parts of Outschool’s public product
      record. The trust center and teacher-facing policies spell out concrete safeguards: SSN-based
      background checks before a teacher’s first class, identity verification, mandatory use of
      Outschool-provided Zoom links, learner identity checks at session start, mandatory-reporter
      obligations, restrictions on under-13 third-party tools, and explicit disclosure requirements
      if AI is used inside a class. Recording policy is unusually specific for a private edtech
      marketplace. Outschool says all live classes are recorded, moved from Zoom onto private
      Outschool servers, encrypted, deleted after 90 days, and never offered as downloadable files;
      families must agree not to redistribute them, and access is gated to actual attendance or a
      child-verification alternative. The company also says it extends COPPA protections to all
      children on the platform, not just the federal under-13 minimum. That is a meaningful public
      posture. The missing layer is operating transparency: the retained sources show rules and
      controls, but they do not show public strike volumes, abuse-report rates, review SLAs, appeal
      rates, or other metrics that would let an investor stress-test how well the moderation system
      performs under load.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
      - CE032
      - CE047
