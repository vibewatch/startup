figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Public stack view of Outschool’s product surface: discovery, monetization, classroom,
      live-video delivery, trust controls, and family distribution layers all sit above a largely
      undisclosed infrastructure core.
    data:
      layers:
        - label: Discovery and reputation layer
          detail: Learner marketplace, class categories, public reviews, teacher profiles, and personalized recommendations drive top-of-funnel discovery.
        - label: Monetization and inventory layer
          detail: Membership credits, marketplace fees, class pricing, and class-to-section scheduling convert browsing into enrollable inventory.
        - label: Classroom workflow layer
          detail: Announcements, lessons, welcome posts, assignments, attachments, and messages organize teaching before and after live sessions.
        - label: Live delivery layer
          detail: Every live class runs through a section-specific Zoom meeting with teacher-controlled moderation and accessibility features.
        - label: Trust and recording layer
          detail: Background checks, verified learners, COPPA-oriented rules, recording retention, and Trust & Safety review create the platform safety envelope.
        - label: Distribution and expansion layer
          detail: Family mobile apps, public status visibility, and 2026 AI/public-funding initiatives extend access beyond the core website.
    approximationNotes: >-
      This figure reflects public product layers only. It does not imply internal microservice
      boundaries or vendor-level infrastructure detail beyond explicitly disclosed dependencies.
