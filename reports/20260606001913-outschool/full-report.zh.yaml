      - number: '1.3'
        title: 资本基础、估值和公开指标覆盖
        blocks:
          - type: paragraph
            body: >-
              尽管当前经济性不透明，Outschool 到 2021 年为止的融资历史记录充分。已留存来源支持：2017 年参加 Y Combinator 后获得 $1.4 million 种子轮；2019 年由 Reach
              Capital 和 Union Square Ventures 领投 $8.5 million Series A；2020 年由 Lightspeed 领投 $45 million Series B；2021 年
              4 月以 $1.3 billion 估值完成 $75 million Series C；2021 年 10 月由 Tiger Global 领投、BOND 加入，以 $3 billion 估值完成 $110
              million Series D。披露轮次合计约 $239.9 million，与 Outschool 2021 年后期融资画像一致。较弱的是当前经营图景。TechCrunch 2020 年报道显示，公司销售额约
              $54 million，年化运行率超过 $100 million，并在疫情需求高峰期首次盈利；到 2022 年，公司称平台预订额已超过 $100 million。但已留存的 2024–2026
              年官方页面没有提供当前收入、ARR、利润率或客户集中度披露。员工数也同样混乱：TechCrunch 记录其在 2022 年裁员前从 25 名员工增长到 164 名，而 Y Combinator 资料现在列示
              107 名员工。这些是有用的边界标记，不是可靠的 2026 年员工数。
