companyProfile:
  summary: >
    Outschool 是一家总部位于旧金山的私营教育市场，2015 年由 Amir Nathoo、Mikhail Seregine 和 Nick Grandy 创立。公司把 3–18
    岁学员家庭与独立教师连接起来，供给覆盖小班直播课、自学进度课程、辅导和结构化 Courses，并已从在家教育起点扩展到课后拓展、营地和替代型教育场景。公开来源支持其已具备有意义的市场规模，并在 2021 年 10 月 Series
    D 之前累计披露融资约 $239.9 million；但当前收入、精确员工数、治理和留存披露仍然有限。
