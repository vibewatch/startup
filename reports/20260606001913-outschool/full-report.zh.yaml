      - number: '6.3'
        title: 留存代理、满意度和投诉信号
        blocks:
          - type: paragraph
            body: >-
              公开满意度证据方向上正面，但比 Outschool 自己的陈列暗示噪音大得多。官方品类页面不断重复来自 1.5 million 条课程评价的 4.9 分，年度报告称 87% 的 Outschool.org
              学员想要更多课程。Trustpilot 存档的 2025 年快照仍然稳健，3,295 名客户给出 4.4 / 5
              分，且多条评价描述了重复或长期使用。不过，会员积分转型后，投诉组合发生了有意义的变化。Trustpilot 与 SmartCustomer 或 Sitejabber
              都包含详细投诉，涉及被推入月度积分套餐、取消后失去累积积分、降级困难，以及客服缓慢或像 AI。Outschool 自身支持政策部分解释了这些摩擦：续费收费不可退款，课程取消受狭窄 24
              小时窗口约束，过多退款请求可能降低未来资格。Today's Parent 也认可课程质量，但称成本会迅速累加，Outschool
              更像辅导或课外支出，而不是全日营地替代品。投资判断是，课程层满意度似乎好于平台层计费满意度，公开留存证据仍是代理指标，而不是 KPI 级别。
