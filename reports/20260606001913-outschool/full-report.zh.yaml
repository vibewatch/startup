  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Outschool（标的）
        - 2021 年 $3B 估值对比低信心 2024 年收入线索
        - 基于 $3B 和 Latka 对 2024 年收入 $200M 的估计，约 15.0x
        - 如果唯一留存的当前分母线索方向正确，这一项界定当前头条估值标记意味着什么。
        - 收入线索自相矛盾，不能当作高信心的审计数字。
      - - Duolingo
        - 2026 年 6 月市值对比 FY2025 收入
        - 基于 $5.08B 市值和 $1.0376B 收入，约 4.9x
        - 最好的高溢价消费者学习上市可比公司，规模真实、增长强劲。
        - 披露、全球规模和订阅质量都明显强于 Outschool 目前能公开证明的水平。
      - - Coursera
        - 2026 年 6 月市值对比 FY2025 收入
        - 基于 $1.56B 市值和 $757M 收入，约 2.1x
        - 可作为规模化上市教育平台的有用基准，需求同时来自消费者和机构。
        - 相比 Outschool 的 K-12 直播市场，Coursera 更偏企业和目录驱动。
      - - Udemy
        - 2026 年 6 月市值对比 FY2025 收入
        - 基于 $0.67B 市值和 $789.8M 收入，约 0.8x
        - 显示消费者和企业学习增长放缓或被重定价时，公开市场估值可以多严苛。
        - 供给模式不同，也有与 Coursera 合并的特定背景。
      - - Nerdy
        - 2026 年 6 月市值对比 FY2025 收入
        - 基于 $0.15B 市值和 $178.988M 收入，约 0.8x
        - 最接近的上市辅导类信号，用来观察市场可能为证据更弱的直播学习平台支付多少。
        - 规模更小、量级更低，运营上也不同于 Outschool 更宽的市场平台。
    notes: 这组可比公司有意保持不完整且仅限公开市场：它用可复核的市值和收入证据为 Outschool 定价划边界，不声称找到完全一一对应的同业集合。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the public comparables most useful for bounding a private K-12 learning marketplace mark. It
        is not exhaustive because direct private live-learning marketplace rounds and secondaries are not cleanly
        public.
