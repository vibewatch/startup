        - 定价 / 套餐变化和市场平台质量一致性，仍可能带来适配度和可负担性问题
      - - Varsity Tutors
        - 直接付费直播学习对手
        - 上市公司支持的直播学习平台；数百门直播课加辅导
        - 想用一个会员覆盖辅导、备考和直播课的家庭
        - 直播课重叠度最高，同时也提供一对一匹配
        - 比 Outschool 的长尾课程市场更偏辅导驱动，可浏览性更弱
      - - Wyzant
        - 辅导市场在位者
        - 声称拥有 65,000 名导师、300+ 个科目和 4 million 条 5 星评价
        - 优先考虑一对一辅导和导师选择的家庭
        - 大型导师网络、首课免费保证、课后付费流程
        - 主要为一对一辅导而建，不是社交型小班课
      - - Preply
        - 订阅制辅导市场
        - 试听课漏斗加每周重复订阅
        - 想要持续导师关系的家庭，尤其是语言和核心学科帮助
        - 导师匹配清晰，重复学习节奏明确
        - 并非 K-12 优先，面向儿童的群组 / 社群学习较弱
      - - Schoolhouse.world
        - 免费直播替代品
        - 非营利志愿者导师网络，提供免费 SAT 训练营和作业帮助
        - 需要零价格学业支持的学生
        - 无需家庭付费的 Zoom 直播辅导
        - 素质拓展广度窄于 Outschool，供给专业化程度也较低
      - - Khan Academy
        - 免费自定进度替代品
        - 全球非营利使命、免费全年龄资源，以及家长和教师工具
        - 想要掌握练习和自定进度学业内容的家庭
        - 免费、贴近标准、自定进度学习模式
        - 几乎没有直播社交学习或教师市场发现
      - - IXL
        - 标准化课程提供商
        - 五大主要学科群覆盖 Pre-K-12 技能
        - 在家教育和重视掌握度的家庭
        - 顺序编排强，标准对齐练习深度足
        - 儿童自主选择广度和真人直播互动都弱于 Outschool
      - - AoPS / Beast Academy
        - 高阶素质拓展和在家教育替代品
        - 高阶 5-12 年级目录，加直播虚拟校园和面向 6-13 岁的 Beast Academy
        - 高阶数学、严谨素质拓展和在家教育占比较高的家庭
        - 严谨性强，直播小班课和专业深度突出
        - 学科广度窄于 Outschool 的泛兴趣市场
      - - Udemy / Coursera
        - 广泛异步替代品
        - 面向技能和证书的大型按需及订阅内容库
        - 年龄更大的自主学习者，以及偏低接触、预算敏感的家庭
        - 内容广度巨大，异步访问价格低
        - 成人或职业导向，面向儿童的信任机制和直播形态较弱
    notes: 这张表把直接对手、相邻辅导市场、课程替代品，以及免费或异步替代方案放在一起，因为买家可以用不同产品形态完成同一学习任务。
