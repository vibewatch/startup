      - number: '4.4'
        title: 资本充足性、资金支持和互相矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开资本故事比公开经营故事更新。Outschool 自己 2021 年 10 月发布稿宣布，公司以 $3 billion 估值完成 $110 million Series D，并称此前在 2021 年 4 月完成
              $75 million Series C。Tracxn 的 2026 年公司页面把时间线延展为六轮累计融资 $240 million，并给出截至 2026 年 5 月员工数
              1,526。投资者仍看不到的是当前流动性位置。已留存公开来源没有披露当前现金、月度烧钱、现金跑道、债务工具或契约压力，也没有在已留存来源集中看到 2021 年后的新公开融资。这让 2022
              年裁员具有财务相关性：它是少数外部线索之一，显示疫情期成本基础超出了常态化需求。数据质量风险的最佳例子是 GetLatka。其页面称 Outschool 在 2024 年达到 $200 million
              收入，但同一页面又称公司零外部融资、完全自筹资金，直接违背官方和其他数据库证据。这个矛盾足够严重，模型化收入估计只能作为低置信度输入，而不能作为投资锚点。
