  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与陈旧的 $3B 估值
        blocks:
          - type: paragraph
            body: >-
              Outschool 的 $3B 估值作为 2021 年历史事实有充分支撑，但不能当作刚验证过的 2026 年价格。PRNewswire、TechCrunch、EdTechReview、IBL News 和
              Tracxn 都交叉佐证 2021 年 10 月 $110M Series D，以及从 2021 年 4 月 Series C 的快速上调。Tracxn 仍显示最新估值为 2021 年 10 月的
              $3B；保留的公开来源没有显示后续轮次、二级交易或重新定价事件能刷新这一标记。同时，当前官方页面仍显示一个真实且具规模的市场平台：超过 140,000 门课、超过 1,000,000 名学习者、全球覆盖、当前
              70/30 教师经济、会员制，以及有意义的公共资金渠道。因此反向问题不是业务是否存在，而是价格是否新鲜。TechCrunch 2022 年报道显示，学校复课后增长放缓幅度超过预期，Outschool
              也裁员；这提醒投资者，2021 年估值是在教育科技情绪更有利的时期打出来的，不是 2026 年中投资者面对的环境。
