  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 市场界面和发现体验
        blocks:
          - type: paragraph
            body: >-
              Outschool 的公开界面比单一辅导或 Zoom 课程产品更宽。首页和学员市场都把产品描述为面向 3–18
              岁的大型直播与自学进度课程目录，发现机制由评价、教师资料和个性化推荐驱动，而不是固定课程路径。支持中心随后补齐形态地图：一次性课程、短课、营地、学期课程、每周循环课和异步小组，都在同一个市场伞下。这个设计在战略上重要，因为它让
              Outschool 可以在多个学习节奏上复用同一发现层，同时会员又在其上增加第二层变现和留存。会员通过把支出转成积分、为会员移除市场费用、打包 100+
              自学进度课程库和结转积分，改变了结账机制。因此，主要产品信息是灵活性：家庭浏览一个很大的课程目录，比较教师驱动的不同形态，并选择随用随付或积分支持的使用方式。弱点是，同样的开放性创造了宽度，也让质量高度依赖单个教师执行；外部评价仍指出这一点存在波动。
