      - number: '5.3'
        title: 信任、安全、隐私和审核
        blocks:
          - type: paragraph
            body: >-
              信任和隐私控制是 Outschool 公开产品记录中最强的部分之一。信任中心和面向教师的政策列出了具体保护措施：教师第一次上课前基于 SSN 的背景审查、身份验证、强制使用 Outschool 提供的 Zoom
              链接、课程开始时进行学员身份检查、强制报告义务、限制 13 岁以下儿童使用第三方工具，以及如果课堂内使用 AI 必须明确披露。对一家私营教育科技市场来说，录制政策异常具体。Outschool
              称所有直播课都会录制，从 Zoom 转移到 Outschool 私有服务器，加密保存，90 天后删除，且从不提供可下载文件；家庭必须同意不再分发，访问权限仅向实际出勤者或通过儿童验证的替代路径开放。公司还称会把
              COPPA 保护延伸到平台上的所有儿童，而不只是联邦 13 岁以下最低要求。这是有意义的公开姿态。缺失的层是运营透明度：已留存来源显示了规则和控制，但没有公开 STRIKE 处置数量、滥用报告率、审核
              SLA、申诉率，或其他能让投资者压力测试审核系统在高负载下表现的指标。
