  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分和 Outschool 的位置
        blocks:
          - type: paragraph
            body: >-
              给 Outschool 定市场框架，首先要守住边界。Outschool 自己的产品页面描述的是一个面向 3–18 岁学员的市场，通过直播和自学进度在线课程服务用户，强调小组互动、平均 5:1
              师生比，内容覆盖核心学科到拓展兴趣。因此，公司不只是辅导供应商，但也不是整个 K–12
              教育科技或学校教育市场。最干净的纳入支出，是标准上课日之外的付费补充学习：在线辅导、在家教育选修课、社团、营地、学业辅助、学业拓展，以及其他由家长付费或补贴支持的课程。NCSL 的 ESA
              概览很重要，因为它显示辅导、教学材料、教育技术、课外时间活动和在家教育支出，都可能进入同一个钱包；Outschool 也明确表示部分家庭会在平台上使用 ESA
              或类似资金。应排除的支出包括全日制学校教育、学区核心课程，以及非营利辅导或免费虚拟公立学校等零价格替代品。实践中，Outschool
              最适合家庭想要灵活、直播、社交、兴趣驱动或贴合在家教育的学习，而不只是商品化作业辅导的场景。
