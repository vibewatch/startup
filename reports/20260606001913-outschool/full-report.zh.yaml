  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 一个真实且有规模的市场，遇上过时的 2021 年价格锚点、偏弱的上市可比公司和缺失的尽调文件，结论是继续研究。
    data:
      nodes:
        - id: scale
          label: 真实市场规模
          detail: 140k+ 门课程、1M+ 名学员、会员体系和公共资助渠道都有公开可见证据。
          tone: positive
        - id: history
          label: 2021 年 $3B 估值真实存在
          detail: Series D 轮估值有充分记录，但时间停在 2021 年 10 月。
          tone: neutral
        - id: stale
          label: 缺少新价格支撑
          detail: 留存的公开来源没有显示后续轮次、老股交易或新的市场出清事件。
          tone: warning
        - id: comps
          label: 上市可比公司缺口
          detail: 上市 EdTech 可比公司大多远低于低置信收入线索所隐含的约 15x 筛选水平。
          tone: warning
        - id: diligence
          label: 关键私有文件缺失
          detail: 收入、留存、利润率和股权结构表条款仍未公开披露。
          tone: warning
        - id: decision
          label: $3B 时继续研究
          detail: 只有尽调补上分母和条款缺口，才值得继续跟进。
          tone: negative
      edges:
