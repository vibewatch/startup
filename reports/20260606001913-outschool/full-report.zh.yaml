      - number: '7.2'
        title: 儿童安全、COPPA / 隐私与法律风险
        blocks:
          - type: paragraph
            body: >-
              儿童安全和隐私是本章最严重的结构性风险，因为 Outschool 服务未成年人，借 Zoom 承载直播课，录制每一节直播课，并允许教师使用已披露的第三方工具。Outschool
              自身政策显示，缓释措施并不空：教师筛选和基于 SSN 的背景调查、开课身份核验、强制报告义务、13 岁以下学习者适用的 COPPA 合规工具规则，以及录制内容在 Outschool 服务器加密留存 90
              天而不是放在 Zoom。问题不是没有控制，而是合规面太宽。隐私政策称 Outschool 遵守 COPPA、GDPR、美国消费者隐私规则，并支持 FERPA 义务；FTC 2025 年 COPPA
              更新和外部法律分析也显示，2026 年围绕生物识别、家长通知和州法拼图的合规压力在上升。Outschool
              是开放市场平台，教师大量独立，每项控制都必须在直播课、录制、消息和外部工具中规模化跑稳。一起安全失误、数据处理错误或监管投诉，都可能很快从事件处置升级为声誉和法律损害。
