      - number: '5.2'
        title: 教师工作流和直播交付
        blocks:
          - type: paragraph
            body: >-
              公开文档也让教师运营模型相当清晰。Outschool
              将课程创建与班次排期分开，教育者先定义学习体验，再发布一个或多个可供学员实际报名的排定班次。这让市场在可复用课程元数据和特定时间库存之间形成清晰分离。平台默认新班次为私密，并允许教师切换为公开以进入市场发现，同时还设置了
              24 小时内 100 个排定班次的运营上限。班次一旦存在，Outschool 就给它一个专用课堂空间，包含公告、讨论、欢迎帖、课节、帖子、作业和文件 /
              视频附件。固定时长课程与自学进度课程在这里分化：由教学大纲驱动的形态获得更丰富的发帖和作业工具，自学进度课程则依赖课节块和预录视频。直播交付本身标准化在 Zoom
              上，并通过课堂空间集成，学员无需处理原始会议凭证即可加入正确班次。Outschool
              没有暴露自研实时课堂栈；它是在第三方视频提供商周围编排教师工作流、报名系统和内容层。这个设计可能加快功能交付，但也让直播课质量和可靠性部分依赖 Zoom，以及教师是否有纪律地用好工具。
