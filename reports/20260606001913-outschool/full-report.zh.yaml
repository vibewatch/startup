  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: 家庭需求、独立教育者供给、资本和信任控制如何共同塑造 Outschool 当前公司形态。
    data:
      nodes:
        - id: n1
          label: 在家教育 + 替代学习需求
          description: 公司从在家教育用户起步，如今仍争取寻求灵活、个性化教育的家庭。
        - id: n2
          label: 独立教育者供给
          description: 教师和辅导老师提供市场供给端，而不是一支完全雇佣的教师队伍。
        - id: n3
          label: 双边市场核心
          description: 家庭为 3–18 岁学习者浏览并预订线上直播体验。
        - id: n4
          label: 更宽的产品栈
          description: 自定进度课程、辅导和 Courses 把模式从一次性素质教育延伸出去。
