      - number: '2.3'
        title: 需求驱动、季节性和后 COVID 常态化
        blocks:
          - type: paragraph
            body: >-
              需求仍然真实，但已经不是疫情时期无差别的教育科技激增。2024–25 年在家教育继续增长，EdChoice 的 2026 年行业视角仍显示 4.8% 学生接受在家教育，2.8% 使用教育选择项目。学校端，NCES
              称 85% 的公立 K–12 学校提供课后项目，但预计只有 13% 学生参加学业导向项目，且只有 42% 学校能满足全部需求。Afterschool Alliance 和 Wallace 补上了家庭视角：近 30
              million 名儿童的家长希望有课后项目，但其中超过四分之三的需求因可负担性、可达性和供给可用性受限而无法满足。学习恢复需求也没有消失。RAND 发现学区仍在使用辅导、人员配置和额外教学时间；2026
              Education Scorecard 显示，学生成绩仍低于疫情前基线，高贫困学区对联邦救助依赖更强。与此同时，Freedonia 2024–27 年增速低于 2020–24
              年，说明紧急资金和快速数字化采用正在常态化。对 Outschool 来说，含义是市场有真实需求，但增长带有季节性，也更围绕春季学业压力、暑期恢复 / 拓展和返校排期重置展开，节奏更有节制。
