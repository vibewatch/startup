      - CV049
      - CV051
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入桥接
        - 按家庭自付、会员、ESA 和合作伙伴渠道拆分的 2024-2026 年季度收入、GMV、总额到净额桥接
        - 估值争议主要是分母风险。
        - 财务包、董事会材料和管理账。
      - - 留存与重复需求
        - 会员留存、续报率、重复队列、退款率和班级级队列行为
        - 高溢价倍数需要比上市消费者 EdTech 可比公司所暗示的更强需求粘性。
        - 用队列表和仪表盘导出做增长分析审查。
      - - 毛利率和分成经济性
        - 教师结算瀑布、退款、抵用金、拒付和按课程形式拆分的毛利率
        - 可见的 70/30 机制无法告诉投资人真实净贡献利润率。
        - FP&A、支付和市场运营审查。
      - - 公共资金与合作伙伴质量
        - 按渠道拆分的贡献利润率、集中度、续约率和政策依赖
        - 多元化能帮助投资逻辑，但前提是经济性耐久。
        - 州项目和合作渠道尽调。
      - - 股权结构表和价格支撑
        - 优先股堆叠、期权摊薄、老股交易、409A 历史，以及 2021 年后任何公平性或要约材料
        - 如果经济性已经在水面下重置，头条估值可能误导。
        - 律师审查加股权结构表审计。
      - - 退出路径和买方地图
        - 战略买家兴趣、财务赞助方胃口、合并替代方案和现实 IPO 前提
        - 如果更可能的退出是战略出售或财务赞助方主导，而不是上市，回报测算会实质性变化。
        - CEO / 董事会材料和投行参考。
    notes: 如果这些问题无法清楚回答，正确姿态是耐心等待，而不是按价接盘。
    claimRefs:
      - CV021
      - CV041
      - CV046
      - CV047
      - CV049
      - CV050
