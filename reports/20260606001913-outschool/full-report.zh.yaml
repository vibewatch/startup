      - number: '1.4'
        title: 里程碑、平台拓宽和反向信号
        blocks:
          - type: paragraph
            body: >-
              时间线显示，公司已经远远超出最初细分市场。完成种子轮、Series A、Series B、Series C 和 Series D 融资之后，Outschool
              借疫情时期需求激增，从贴近在家教育的市场走向更广泛的教育平台。后续最强的里程碑来自产品和渠道变化：2023 年推出带 AI Teaching Assistant 的辅导产品；2024
              年面向在家教育和替代型教育家庭推出 Courses；2025 年与 Sora Schools 合作提供项目制暑期营地。同时，并非每个里程碑都是正向。TechCrunch 报道称 Outschool 在 2022
              年裁员 31 人，占员工总数 18%，此前公司经历了快速融资和招聘；ComplaintsBoard 和 BBB
              等投诉平台仍保留着围绕客服和课程访问的持续摩擦。公司的信任与安全材料也说明，服务儿童的市场需要多强的运营纪律：Outschool 维护正式安全指引、教师 STRIKE
              框架、约束性仲裁条款，以及围绕替代型教育的公共政策信息。结果是一家公司拥有明确品牌和产品动能，但执行、客服和治理问题也可见，后续章节不应把它们当成边缘噪音而忽略。
