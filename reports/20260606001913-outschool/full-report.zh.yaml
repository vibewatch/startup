      - number: '2.2'
        title: TAM、SAM 和地理测算视角
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只有在分层看证据时才有用，不能当成单一数字。最外层是全球私人辅导：Fortune Business Insights 将 2026 年市场规模定为 US$72.61
              billion。更窄的交付模式视角来自 The Business Research Company，它在 2025 年 US$14.06 billion 之后，把 2026 年全球在线辅导规模测算为
              US$16.86 billion。更窄的美国数字化视角来自 Grand View Research，其给出 2024 年美国在线私人辅导 US$4.33 billion；Freedonia/Simba 将
              2024 年美国 K–12 补充材料市场定为 US$4.73 billion；StrategyMRC 则把 2026 年全球 K–12 补充教育定为 US$2.5
              billion。这些数字不能相加，也不是四舍五入造成的分歧；它们不同，是因为测量的是支出范围、地理范围和买方场景的不同组合。地理同样不均衡。Fortune 称 Asia Pacific 在 2025
              年占全球私人辅导 60.85%，而一篇 Frontiers 综述报告显示，各地区辅导参与率从 Scandinavia 低于 10% 到 Cambodia、Myanmar、Singapore 等国超过 70%
              不等。对 Outschool 来说，宽泛 TAM 叙事应打折，转而偏向更窄的在线、家长付费、在家教育和拓展相邻 SAM；在这个 SAM 里，市场式直播课程才真正相关。
