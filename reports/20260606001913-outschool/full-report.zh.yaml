      - number: '8.2'
        title: 可比公司框架与倍数纪律
        blocks:
          - type: paragraph
            body: >-
              简单做公开可比公司，不支持把 2021 年名义估值直接按面值接收。Finro 2025 年教育科技研究称，EV/收入中位数约 7.8x，面向消费者的 K-12 内容模式往往低于 5x；Exbo 和 HolonIQ
              则描述了一个后繁荣市场：现在资本更愿意为留存、经常性合同和资本效率付费，而不是为故事本身付费。公开可比公司也强化同一信息。Duolingo 2026 年 6 月市值约为 FY2025 收入的
              4.9x，Coursera 约 2.1x，Udemy 约 0.8x，Nerdy 约 0.8x；就连 Chegg 的微型市值也说明，公开市场对消费级教育科技的情绪可以向下重估多远。Outschool
              与这些公司都不完全相同。它有市场平台供给侧、会员制和公共资金渠道；如果质量真实，这些可以支撑一定溢价。但唯一保留的当前收入线索是 Latka 2024 年 $200M 数字，而同一页面错误地称 Outschool
              靠自有资金发展、没有外部融资。这一矛盾让分母可信度偏低。即便如此，以 $200M 收入支撑 $3B 估值，也意味着约 15x 收入；相对公开筛选结果已经显得拉伸。
