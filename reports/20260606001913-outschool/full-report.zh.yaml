    title: 风险
    sections:
      - number: '7.1'
        title: 后疫情需求常态化和变现风险
        blocks:
          - type: paragraph
            body: >-
              Outschool 最大的经济风险不是在线拓展学习会消失，而是疫情期提前透支需求后，平台要为稳定满班率、家庭可负担性和教师留存而战。两篇 TechCrunch 报道清楚展示了重置：公司在 2022 年中裁掉
              18% 员工，当年晚些时候又裁掉四分之一员工；CEO Amir Nathoo 称，学员全日制返校后，增长已经“回到现实”，放缓幅度超过预期。当前公开证据更薄，但方向一致。Outschool 面向教育者的
              2024/2025 年材料强调候补名单、徽章和双周报名模式，而不是 GMV 或教师留存披露，说明公开叙事中市场优化比突破性收入增长更重要。教师和家长评价平台强化了同一风险：教师描述供给过剩、收入不稳和 30%
              平台费，家长则抱怨新会员模式下的可负担性。这个组合让需求常态化既是收入风险，也是质量风险，因为较弱的满班率会稀释最好的教师供给，并提高来自更便宜或更低摩擦替代品的替代压力。
