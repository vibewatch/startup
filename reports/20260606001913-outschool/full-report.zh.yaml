    type: flow
    layout: wide
    summary: 保留的公开记录显示增长资本原本要投向哪里，但没有显示需求常态化和重组之后还剩多少现金。
    approximationNotes: 这张图是定性的。它把已披露的融资支持和资金战略用途，连接到公开来源可见的主要现金需求；由于现金、烧钱速度和现金跑道均未披露，它不为当前支出赋美元金额。
    data:
      nodes:
