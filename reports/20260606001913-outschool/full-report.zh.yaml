  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分和采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Outschool 的客户证据指向广泛的家庭市场细分，而不是单一狭窄用例。公司仍明显服务在家教育家庭：其在家教育中心把 Outschool 定位为构建完整家庭课程体系的方式，引用 ESA
              和税收抵免奖学金等资金工具，并把 co-op、导师和直播在线课程框定为核心支持。但当前市场也明确陈列课后社团、一对一课程和暑期营地，并全部使用来自 1.5 million 条课程评价的 4.9
              分徽章。独立来源与这个更宽组合一致。Forbes 和 Today's Parent 都描述 Outschool
              正从在家教育根基走向为传统学校学生提供的补充辅导、拓展和社交学习。项目化一侧，Outschool.org 通过 ESA 导航、直接面向家庭的奖学金，以及与学区、公立学校、co-op
              和非营利组织合作，增加了一个独立的公共资金和社区项目细分。结果是按用例划分的需求面更加多元，但按细分披露的收入组合尚未出现。
