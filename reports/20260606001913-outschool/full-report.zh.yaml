            body: >-
              在付费替代里，Varsity Tutors 是最接近的直接产品挑战者，因为它把辅导与数百门直播小组课组合起来，并通过 Nerdy
              获得上市公司披露窗口。但它的重心仍像是中央打包的辅导会员，而不是可浏览的长尾教师市场。Wyzant
              则相反：它的市场模式很纯正，拥有导师资料、评价、排期、背景审查可见度、导师自定小时费率和课后付款，但结构上是为一对一辅导而建，不是为班课而建。Preply 通过试听课和周订阅承诺，进一步推向经常性导师关系。


              与这些对手相比，Outschool
              要求家长先逛课程，再雇佣教师。这比辅导市场更能支持拓展学习、兴趣学习和社交探索。它也让可预测性边界更软：家庭体验更依赖课程陈列、评价和积分经济，而不是标准辅导流程。如果家长想要经常性的补差关系，Wyzant 和
              Preply 更简单。如果家长想在同一把伞下获得辅导和部分直播小组课，Varsity 的直接重叠最强。
