  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开信息下的 Outschool 产品栈：发现、变现、教室、直播视频交付、信任控制和家庭分发层，都压在基本未披露的基础设施核心之上。
    data:
      layers:
        - label: 发现与声誉层
          detail: 学习者市场、课程分类、公开评价、教师档案和个性化推荐推动获客漏斗顶端的发现。
        - label: 变现与库存层
          detail: 会员点数、市场服务费、课程定价，以及课程到班次的排期，把浏览转成可报名库存。
        - label: 教室工作流层
          detail: 公告、课时、欢迎帖、作业、附件和消息，把直播课前后的教学组织起来。
        - label: 直播交付层
          detail: 每节直播课都通过特定班次的 Zoom 会议运行，并带有教师控制的管理和无障碍功能。
        - label: 信任与录制层
          detail: 背景调查、已验证学习者、面向 COPPA 的规则、录制保留和信任与安全审核，共同构成平台安全边界。
        - label: 分发与扩展层
          detail: 家庭移动应用、公开状态可见性，以及 2026 年 AI / 公共资助计划，把访问范围延伸到核心网站之外。
