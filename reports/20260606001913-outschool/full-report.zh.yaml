  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Outschool 方案
      - 可衡量收益
      - 局限
    rows:
      - - 找到匹配学习者兴趣和日程的课程
        - 否则家庭要在多个网站分散浏览辅导、素质拓展和家庭教育选项
        - Outschool 把直播课和自定进度课程聚合到一个市场，配上个性化推荐和可见评价
        - 学习者市场称 150 万条课程评价给出 4.9 分；首页宣传 140,000+ 门课程和个性化推荐
        - 搜索 / 筛选深度可见，但排序逻辑和质量控制经济性不可见
      - - 先试老师，再决定是否购买更长项目
        - 没看过匹配度，家庭可能不愿直接买完整学期课程
        - 一次性、短课、营地、学期和周期性选项让用户逐级加深承诺
        - 官方课程格式文档明确区分短课、一次性课、营地、学期和周期性结构
        - 没有公开数据说明哪种形式转化或留存最好
      - - 降低高频用户的结账摩擦
        - 按次购买会反复交易并产生市场费用
        - 会员把支出转换为积分，免除会员的市场费用，并结转未用积分
        - 公开方案从 80 积分 / $40 到 1,285 积分 / $600；每个积分价值 $0.50
        - 公开证据未披露有多少买家采用会员，或费用减免如何影响抽佣率
      - - 作为教师发布并排课
        - 教师需要可复用课程页、具体时段库存和可发现性控制
        - Outschool 将课程与班次拆开，班次默认私有，教师可切换为公开
        - 教师可在 24 小时内排最多 100 个班次，之后系统限制会停止继续排课
        - 没有关于班次填充率、教师效率或课程页审核 SLA 的公开证据
      - - 安全运行一场直播互动课
        - 独立视频工具不带市场报名上下文，也没有儿童安全规则
        - Outschool 从课堂启动班次专属 Zoom 会议，再叠加身份核验和审核规则
        - 教师进入前学习者无法进入；学习者之间的私聊禁用
        - 直播交付仍依赖 Zoom 性能和教师运营纪律
      - - 在会议间或课后保持参与
        - 家庭需要轻量入口来访问材料、帖子和录制回看
        - Outschool Classroom 支持公告、课程、作业、附件、录制和消息
        - 系统自动创建欢迎帖，固定长度课程可使用基于教学大纲的帖子和作业
        - 公开来源没有展示完课、回复率或内容消费分析
      - - 离开桌面端时管理课程
        - 家长和学习者需要移动端访问提醒、搜索和快速加入直播
        - 家庭端应用支持日程、通知、消息、搜索和加入直播会议
        - 官方移动支持和应用商店页面确认家庭端支持 iOS 和 Android
        - 群聊和部分完整账户流程仍需要网页浏览器；教师端功能尚未补齐
    notes: “可衡量收益”只使用公开定量或结构化信号，不代表受控效果研究或保证学业影响。
