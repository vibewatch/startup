  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经验证的当前收入低于溢价门槛
        - 尽调显示收入明显低于约 $300M，且没有异常突出的利润率
        - 即使不考虑条款，支撑 $3B 的唯一公开路径也失效。
        - 不要为当前估值标记背书。
      - - 公共资金和合作伙伴组合质量低于表象
        - ESA / 奖学金 / 合作伙伴队列表现为重复需求弱、补贴重或贡献利润率差
        - 渠道多元化不再能支撑高溢价市场平台倍数。
        - 用更低倍数和更慢重复需求重算案例。
      - - 留存和续报不具备溢价质量
        - 会员流失、续报或队列行为落后于高溢价倍数乐观派所需水平
        - 市场可能足够宽，但粘性不足以跑赢上市可比公司。
        - 下调乐观情景概率，扩大下行空间。
      - - 2021 年头条估值以下没有新价格支撑
        - 董事会材料显示，2021 年后没有接近 $3B 的可信内部或外部标记
        - 估值标记陈旧从纸面缺口变成真实入场价格问题。
        - 要求明显更低的入场价格，否则等待。
      - - 优先股堆叠对投资人不友好
        - 参与权、清算优先权或老股折价实质性压低普通股价值
        - 头条估值不再代表可投资的经济性。
        - 暂停，直到条款重新定价或澄清。
    notes: 这些是估值否决触发因素，不是泛泛的运营风险：每一项都解释当前头条估值标记如何在经济上失效。
    claimRefs:
      - CV039
