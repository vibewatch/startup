chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式和当前阶段
        blocks:
          - type: paragraph
            body: >-
              已留存的一手来源给出了稳定的公司身份。Outschool 称公司创立于 2015
              年，最初服务在家教育家庭，之后拓展到传统学校体系内的学员；今天它仍是一家总部位于旧金山、面向儿童在线学习的私营市场。当前产品面比最初“课后市场”的叙事更宽：首页主推由真人教师提供的直播和自学进度课程，官方
              2023–2025 年发布又加入一对一辅导、面向在家教育和替代型教育家庭的结构化 Courses，以及合作伙伴牵头的暑期项目。当前规模方向上很强，但数据并不完全齐整。About 页面称 Outschool 为
              183 个国家的 1,000,000+ 学员提供超过 140,000 门直播在线课程；招聘页面则称有 1.5M+ 学员、26.5M+ 课程、$488M+ 教师收入，并覆盖 195
              个国家。因此，公司最适合被描述为一家后期私营市场公司，拥有有意义的全球触达和产品宽度，但官方 KPI 口径漂移，后续章节应谨慎处理，而不是压平成一个数字。
