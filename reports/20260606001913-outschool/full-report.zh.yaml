coverageNotes: >
  本报告于 2026-06-06 仅基于公开可得来源制作。Outschool 是一家私营公司，已留存公开证据未披露当前年经常性收入（ARR）、净收入、毛利率、烧钱速度、现金跑道、净留存率（NRR），或清晰口径的 2026
  年员工数。官方规模披露也在当前页面之间漂移（例如 1.0M+ 与 1.5M+ 学员、183 与 195 个国家），因此规模指标应视为方向性信号，而不是完全口径统一的数据。本文引用的 $3 billion 估值，是 2021 年 10
