  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图和竞争者类别
        blocks:
          - type: paragraph
            body: >-
              Outschool 面对四组不同替代集合，而不是一个市场。最接近的付费类比，是 Varsity Tutors 这类直播辅导和课程业务；它把会员、一对一辅导和数百门直播小组课打包在一起。Wyzant
              作为辅导教师市场规模大得多，但设计重心更多是选择导师，而不是浏览课程。Preply 则把这种辅导逻辑推进到经常性周订阅。第二组是结构化课程和在家教育拓展：IXL、AoPS 和 Beast Academy
              在家庭想要顺序体系、严格训练或高阶数学深度，而不是发现式市场时胜出。第三组是 Khan Academy 和 Schoolhouse.world 提供的免费非营利学习。第四组是 Udemy 和 Coursera
              这类宽泛异步课程供给。


              常见错误是把 Outschool 只当成又一个辅导网站。它的差异化使用任务，是直播、社交、兴趣驱动的 K-12
              学习，并且拥有异常宽的教师驱动选题。它与纯一对一辅导、固定课程体系和成人技能平台拉开了真实距离。与此同时，很多场景下 Outschool 比现状替代品更偏可选消费：如果家庭只需要核心科目练习、SAT
              帮助或低成本技能内容，免费、辅导和异步替代都很强。
