              公开单位经济证据在可见教师分成上最强，在实际净经济性上最弱。Outschool 的定价指南仍把教育者导向按类别划分的定价区间，公司也称不会重新讨论 70/30
              分成。会员页面显示现金预付模式，包括结转积分、一次性充值，以及部分多周报名需一次性扣除全部前置积分，而教师只在课程开始后获付。这些机制意味着平台可能拥有有利的营运资本时点，但并不揭示扣除市场费用、促销积分、退款、拒付或支持成本后最终留下多少价值。公开记录也显示多个可变现形态——直播小组课、持续社团、一对一辅导、为期一周的营地和自学进度内容——但没有披露各形态组合。这很重要，因为收入质量可能因形态不同而不同：会员和辅导可能带来更好的复购行为，营地季节性更强，自学进度内容可能更像留存支持，而不是独立利润中心。因此，收入质量方向上有吸引力，但还不足以支撑投资测算。
