            body: >-
              Outschool 披露的需求信号显示，业务比最初的疫情期在家教育叙事更分散，但公司没有量化每个渠道贡献多少收入。教育者手册称，营地上架通常在 5 月到 8 月以及 12
              月最受欢迎；同一页面又称，学习者夏季仍会寻找辅导、社团、课程和一次性课程。2026 年暑期指南同样把营地、拓展课程、学业暑期项目和一对一辅导列为活跃使用场景。在直接家庭付费渠道之外，Outschool
              的公共资金网络研讨会称受资助报名和支出增长很快；Outschool.org 称已通过直接面向家庭的奖学金部署 $100 million，服务 125,000 名学员；OpenEd Academy
              合作让学生获得最高 $100 的 Outschool 积分。这些事实对财务很重要，因为它们暗示公司正在部分分散对纯可选拓展支出的依赖。反向权重来自 2022 年常态化冲击：TechCrunch
              报道了两轮裁员，并援引管理层说法称，学生返校后增长已经“回到现实”，Outschool 更用力转向辅导。
