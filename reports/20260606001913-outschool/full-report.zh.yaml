      - number: '4.5'
        title: 财务结论和尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论是：对变现存在性建设性，对一切把市场活动转成可投资收入质量的环节保持谨慎。公开来源清楚支持一个基于费用的市场，拥有可见的 30%
              教育者分成、通过会员进行客户现金预收，以及增长中的公共资助或合作伙伴赞助渠道。这明显好过收入机制仍停留在假设阶段的公司。但投资判断止步于可见度止步的地方：没有公开 GMV 到净收入的转换关系，没有披露
              ARR，没有按形态拆分的毛利率，没有获客成本（CAC）或回本周期，没有退款或积分失效率，也没有当前烧钱或债务计划。已留存集中最诱人的收入数据点——GetLatka 的 2024 年 $200
              million——也未能通过一致性检查。实际结论是，Outschool
              可能是有意义、已规模化的市场，但利润率路径、资本强度和下一轮依赖仍取决于私有材料。最低尽调包应包括：按支付类型拆分的月度收入、按形态拆分的队列留存、市场费用表、退款和核销数据、按课程类型拆分的毛利率，以及当前资产负债表和债务计划。
