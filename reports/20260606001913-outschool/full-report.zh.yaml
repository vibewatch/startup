      - number: '5.4'
        title: 分发、AI 和技术依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Outschool
              的产品最强在应用层，最弱在基础设施层。分发上，家庭移动应用是真实且有用的：它们支持日程、消息、通知、加入直播会议和课程搜索；但官方支持文档和应用商店列表都清楚表明，教育者和部分高级账户功能仍要回到浏览器。对一家私营市场来说，可靠性透明度高于平均水平，因为
              Outschool 运行公开状态页，并把 Zoom 访问、网站、课堂消息和购买分成独立组件。招聘给出最清晰的技术栈线索：2026 年工程岗位提到 TypeScript、React、Node.js、GraphQL
              和 PostgreSQL，并称公司正在建设一个 AI 驱动的公共资金报销平台，同时扩展现有市场。另一份合作伙伴案例研究显示，公司确有 AI / 个性化活动，但发生在生命周期和推荐层，而不是已明确记录的面向学员
              AI 导师。外部评价也显示投资者应记住的产品取舍：会员可能给部分家庭带来定价摩擦，市场模式仍继承教师质量方差。最大的技术尽调缺口因此在不可见层：已留存公开来源没有披露服务拓扑、数据驻留，或公开的核心市场 API
