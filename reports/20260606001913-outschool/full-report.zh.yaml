      - number: '7.5'
        title: 缓释措施、监测指标和打破投资论点的触发器
        blocks:
          - type: paragraph
            body: >-
              Outschool 确实有可见缓释：密集政策覆盖、背景调查、强制报告规则、课程审核、仅限平台的 Zoom
              链接、录制留存控制、状态透明度和州资金指引。这些措施有意义，因为它们说明管理层知道风险在哪里。但公开缓释仍主要是流程证据，不是结果证据。投资者仍缺少当前公开数据：事故率、教师流失、开班率、按资助渠道划分的收入结构，以及长期故障频率。因此投资问题与其问「Outschool
              有没有政策？」，不如问「这些政策在后疫情经济性下能不能顶住？」最干净的否决标准都可运营、可监测：任何儿童安全或隐私执法事件；开班率重新恶化或家庭可负担性反噬的明确证据；教师投诉显示优质讲师流失上升；州规则变化削弱
              ESA/供应商资格；或大规模中断上课的重大 Zoom/平台故障。如果两个或更多信号同步移动，风险就会很快从信任传导到预订再到留存。
