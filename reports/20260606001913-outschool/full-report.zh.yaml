      - number: '2.4'
        title: 免费替代、结构性替代品和监管约束
        blocks:
          - type: paragraph
            body: >-
              Outschool 的市场只在直播互动和内容宽度比低成本内容交付更重要的部分有吸引力。免费和低成本替代品很多。Schoolhouse.world 在 Zoom 上提供免费在线辅导和 SAT
              集训营；公立学校和学区继续资助辅导与课后项目；Connections Academy 提供由州税资金支持、免学费的全日制在线学校。AI 压力正在快速上升：College Board 发现，到 2025 年 5
              月，84% 高中生报告会把生成式 AI 用于课业；Microsoft 称教育行业拥有最高的行业级生成式 AI 采用率，美国学生使用率同比跳升 26 个百分点。Brookings 认为 AI
              可以提供按需、类似辅导的支持，而 Stanford SCALE 指出，效果证据远比采用率薄。国际上，监管和公平问题也重要。Frontiers 强调跨境在线辅导以及各地区参与率从低于 10% 到超过 70%
              的差异，UNESCO 则把私人辅导监管框定为公共利益问题，因为无监管增长可能加深不平等。实际结论是：Outschool
              在直播、社交、兴趣驱动和在家教育相邻场景最强；凡是任务退化为商品化作业帮助或全日制虚拟学校，它就最弱。
