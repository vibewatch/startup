  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 值
      - 理由
    rows:
      - - 建议
        - 继续研究
        - 公司看起来真实且有规模，但公开证据不足以刷新 2021 年价格锚，无法在 $3B 估值上给出买入判断。
      - - 信心
        - 中
        - 估值历史和可比公司数据扎实；当前收入和条款桥接还没有补齐。
      - - 风险评级
        - 高
        - 估值标记陈旧、经济性不透明，加上 EdTech 估值市场转冷，都可能迅速压缩价值。
      - - 估值立场
        - 偏高
        - 唯一留存的当前收入线索意味着约 15x 收入倍数，而且明显高于上市 EdTech 可比公司。
      - - 决策含义
        - 没有经验证的 2024-2026 年收入、留存、利润率和股权结构数据，就不要为 2021 年头条价格背书。
        - 缺口在价格支撑，不在产品是否存在。
    notes: 本章建议明确受价格影响：更强的私有证据可能改善判断，但当前公开档案不足以直接给出更积极结论。
