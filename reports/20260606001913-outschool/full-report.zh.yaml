        - 高
        - 不要只测核心补弱，应单独测试拓展、兴趣爱好和社交学习品类的胜率
      - - 儿童场景信任与安全触点
        - 关于可负担性或审核治理的家长负面反馈，会削弱在家教育和家长信任叙事
        - 中高
