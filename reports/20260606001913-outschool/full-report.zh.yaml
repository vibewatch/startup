      - number: '7.4'
        title: 政策、资金、平台和运营依赖风险
        blocks:
          - type: paragraph
            body: >-
              Outschool 还暴露在自己无法完全控制的基础设施和政策通道上。核心课程交付依赖 Outschool 平台和 Zoom；公开状态页把 Zoom 访问、消息、报名和网站组件分开列示；教师付款政策通过
              PayPal 发放款项。当前状态面看起来令人放心但不完整：页面显示可见 90 天窗口内 Zoom 课堂可用率为 100%，但长期事故深度不足，无法支撑多年可靠性或根因模式判断。需求侧，Outschool
              明显在加码贴近公共资金的渠道。ESA 指南要求家庭遵循各州规则，并通过州市场平台购买；Outschool.org 则把自己定位为 ESA 和奖学金项目合作伙伴。NCSL
              和州项目页面说明了为什么这重要：可报销支出、审批流程、监督和时间表在各州差异很大。公共资金渠道可以扩大可及性、降低价格敏感度，但也让需求更容易受审计摩擦、报销延迟、供应商审批变化和政治反转影响。
