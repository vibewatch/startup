  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前判断
      - 哪些证据会改变看法
    rows:
      - - 投资逻辑：市场平台真实且已有规模
        - 140k+ 门课程、1M+ 学习者、当前会员体系，以及可见的奖学金 / ESA 渠道，说明这是真实分发，不是纸面市场。
        - 如果私有数据证明重复需求弱，或单个学习者变现低，规模逻辑会被削弱。
      - - 投资逻辑：渠道多元化可能在改善
        - 会员、公共资金项目和合作伙伴抵用金表明，Outschool 不再只是一个可选素质教育结账入口。
        - 如果渠道级队列和利润率数据证明公共资金组合是一次性或低质量的，溢价情景就会被压低。
      - - 反向逻辑：$3B 标记已经陈旧
        - 留存来源清楚记录了 2021 年 Series D 轮，但没有显示之后融资轮或定价事件。
        - 如果后来有接近同一水平的要约、老股交易或融资，价格支撑会明显增强。
      - - 反向逻辑：上市可比公司便宜得多
        - Duolingo、Coursera、Udemy 和 Nerdy 的交易倍数都远低于 Outschool 低信心收入线索所隐含的约 15x 账面测算。
        - 如果经验证的当前收入远高于低信心公开线索，这个差距可能迅速缩小。
      - - 反向逻辑：公开分母信心低
        - Latka 给了有用线索，但也错误地称 Outschool 没有外部融资、完全自举。
        - 经审计或董事会批准的收入和毛利率数据，会替代这个自相矛盾的代理值。
    notes: 反向逻辑主要围绕分母和条款风险，而不是 Outschool 是否已经达到真实市场规模。
