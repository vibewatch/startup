        - 与 Nathoo 相比，他在 2026 年公开材料中的当前日常运营角色不那么可见。
      - - Nick Grandy
        - 联合创始人
        - TechCrunch 称他曾是 Clever 产品经理；投资者页面仍将他列为创始人。
