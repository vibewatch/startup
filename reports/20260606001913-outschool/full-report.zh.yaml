        - 公共资金组合质量低于表象，利润率或留存弱于支持高溢价倍数的乐观派假设。
      - - 基准
        - ~50%
        - $180M-$220M
        - 5x-7x 收入，高于困境中的上市消费者 EdTech，但低于高溢价软件
        - $0.90B-$1.54B
        - 市场规模真实，但经济性更像扎实的教育平台，而不是稀缺级软件资产。
      - - 乐观
