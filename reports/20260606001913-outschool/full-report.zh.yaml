      - number: '8.4'
        title: 建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              在 $3B 估值下，基于公开数据的正确判断是继续研究：中等信心、高风险、估值偏拉伸。这不是说 Outschool 没有业务；官方和伙伴证据指向相反结论。结论是当前价格缺少足够文件支撑。公开来源没有显示经审计的
              2024–2026 年收入、持续留存、毛利率、退款漏损，或能决定名义估值对新资金是否经济干净的股权结构条款。因此，退出准备度更适合围绕战略买家或财务买方兴趣来框定，而不是押注近期
              IPO。公开教育平台倍数仍然温和，Outschool 披露远少于上市同业。如果尽调显示收入已经高于约
              $300M，会员制和公共资金渠道复购良好，且优先权或二级折扣没有掏空名义估值，判断可以上调。如果收入显著低于该门槛，或渠道质量和条款弱于公开叙事，判断应迅速下调。
