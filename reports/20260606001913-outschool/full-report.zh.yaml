      - number: '8.3'
        title: 情景区间与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              情景分析必须明确区分证据和假设。证据相对清楚：2021 年价格是 $3B，行业中位数远低于疫情时期热情，唯一保留的当前收入线索，是一个相互矛盾的第三方估算——2024 年收入
              $200M。下面的数学不是精确主张，而是进入价格纪律工具。基准情景假设收入约 $180M–$220M、估值倍数 5x–7x，价值只有约 $0.9B–$1.5B。熊市情景采用 $120M–$160M 和
              3x–4.5x，得到约
              $0.36B–$0.72B。只有牛市情景能碰到当前估值，而且需要收入已经显著高于低可信度公开线索，还要有比公开来源目前能证明的更强留存、利润率质量和渠道耐久性。敏感性桥从反方向给出同一结论：即使用 7.8x
              行业中位数，$3B 也需要约 $385M 收入；即使用 10x 溢价倍数，也需要约 $300M。
