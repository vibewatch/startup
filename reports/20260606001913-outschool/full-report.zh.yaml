  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 儿童安全 / 隐私失守
        - 监管问询、已证实的保护事件，或录制 / 工具误用事件
        - 任何正式执法、反复出现的高严重性事件，或披露的儿童数据控制失效
        - 暂停投资判断，在为进一步增长背书前升级法律 / 产品尽调
      - - 需求正常化继续恶化
        - 班级填充率走弱、重复报名下滑，或再次裁员的证据
        - 再次出现重大成本重置，或私有 KPI 显示返校后需求持续恶化
        - 重算增长、利润率和留存假设；把它视为投资逻辑压力，而不是噪音
      - - 教师质量 / 承包方脆弱性
        - 教师对需求弱、结算摩擦或高佣金缺乏支持的投诉增加
        - 优质教师明显流失，或学习结果 / 评价质量下降
        - 假设课程目录质量被侵蚀，审核负担上升
      - - 政策渠道逆转
        - 关键 ESA 州的州级市场规则变化、供应商审批丧失，或报销摩擦
        - 任何实质性延迟或阻断主要州资金支持购买的变化
        - 下调对公共资金增长渠道的信心，重新评估渠道集中度
      - - 平台依赖具象化
        - Zoom / 平台重大宕机，或核心组件反复性能下降
        - 直播课堂中断数小时、事件集群反复出现，或根因透明度不足
        - 在拿到可靠性数据和补救方案前，视为运营投资逻辑破裂
    notes: 否决标准是围绕可观察公开信号和仍未补齐的具体私有数据缺口设计的投资人启发式规则。
