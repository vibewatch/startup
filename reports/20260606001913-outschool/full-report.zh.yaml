  - id: TU005
    title: 投诉、退款与支持摩擦表
    columns:
      - 问题
      - 证据
      - 当前政策或触点
      - 对客户耐久性的影响
      - 尽调路径
    rows:
      - - 会员积分困惑
        - Trustpilot 和 SmartCustomer 投诉提到强制或令人困惑的积分计划， 以及难以下调等级的会员制
        - 会员积分可滚存，但续费不可退款
        - 即使课程质量仍高，也会削弱信任并拖慢复购支出
        - 索取上线后的流失、取消、降级和投诉联系率
      - - 退款窗口很窄
        - 支持文档只允许大多数退款在 24 小时内或课程访问开始前办理
        - 直接支付和会员规则都以 24 小时窗口为核心
        - 日程变化或课程不匹配的家庭可能很快损失资金
        - 按课程形式索取例外率数据和拒绝退款原因
      - - 积分或退款资格丧失
        - 政策称，过多退款或积分退回请求可能导致未来退回资格被取消
        - 标准窗口外依赖人工支持流程
        - 可能压低频繁试课的高使用家庭信任
        - 索取该条款的执行频率及涉及哪些用户队列
      - - 支持响应速度
        - Trustpilot 用户称支持像 AI 或力度不足；官方支持页主要指向聊天和邮件
        - 可见渠道是在线聊天和邮件
        - 解决慢会放大计费和课程匹配争议
        - 索取首次响应和完全解决 SLA，以及升级路径
      - - 移动应用限制
        - App Store 和 Google Play 描述了家庭访问、提醒和加入课堂， 但完整账户管理仍以网页端为中心
        - 完整账户访问仍需要网站
        - 移动端摩擦会削弱移动场景留存和支持满意度
        - 索取应用留存、支持工单结构和移动转化数据
      - - 排课与夏令时摩擦
        - 支持文档提醒家庭，跨地区夏令时变化可能使本地上课时间偏移 1 小时
        - 时间会自动本地化，但跨地区偏移仍会发生
        - 国际和非美国用户可能面临更高协调摩擦
        - 按时区和非美国地区索取使用与流失数据
    notes: 本表把官方政策表述与投诉触点放在一起，显示课程质量与计费或 支持体验可能脱节的环节。
