          label: 2020-2021 融资潮
          detail: Tracxn 列出 $45M Series B、$75M Series C 和 $110M Series D，最后一轮官方融资估值为 $3B。
          tone: positive
        - id: growth-uses
          label: 全球扩张和新产品
          detail: Series D 资金用途指向全球扩张，以及面向学校和家长的新产品。
          tone: neutral
        - id: channel-build
          label: 辅导与资助渠道建设
          detail: 公开来源显示，公司转向辅导，ESA 和奖学金增长，合作伙伴赞助点数也在增加。
