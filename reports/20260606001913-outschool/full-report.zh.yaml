        - 说明公司在创始人之外有具名产品 / 工程梯队，尤其覆盖 AI 工具。
        - 当前 2026 年职责范围是从 2023 年发布推断，不是来自实时高管名单。
      - - Cara Delzer
        - 供给与合作负责人
        - 在 2024 年 Courses 发布中被点名，该发布关联在家教育、教育者供给和公共资金路径。
        - 重要，因为供给质量和合作 / 渠道策略是市场平台核心杠杆。
