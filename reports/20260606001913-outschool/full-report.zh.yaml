      - number: '3.4'
        title: 信任、切换成本和护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Outschool 的护城河真实存在，但比课程目录规模暗示的更薄。最强的部分很清楚：披露的平均 5:1
              班级比例、教师筛选与背景审查、课程审核、学员行为规则、公开评价，以及比固定课程企业宽得多的长尾课程目录。相较通用导师匹配产品，这些都是有意义的优势。但这些优势依赖政策执行和市场健康，而不只是软件。


              护城河较弱的一面，是需求和供给看起来都适合多平台并行。教师控制自己的课程和定价，这有利于丰富度，但可能降低锁定效应。家庭在任务变化时，可以转向一对一辅导、掌握型软件或免费平台。独立反馈已经显示，部分用户对
              Outschool 积分模式的可负担性不满；竞争对手评价也显示它们有自己的信任问题，但同时凸显买家很容易把多种替代放在组合里。因此，Outschool 最强的位置是直播、兴趣驱动学习的细分领导者，而不是赢家通吃的
