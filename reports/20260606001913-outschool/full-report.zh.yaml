  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和变现架构
        blocks:
          - type: paragraph
            body: >-
              尽管 Outschool 没有公开财务报表，它的变现模式仍然清晰。面向教师的条款和教学页面称，平台免费上架，教师自行定价，Outschool 收取 30% 服务费，教育者获得课程价格的
              70%。家庭现在可以按次购买，也可以通过会员购买。在按课付费流程中，家长支付标示课程价格和市场费用；在会员流程中，家庭预付月度积分，免付市场费用，同时教师收入不变。积分价值为每个 $0.50，公开套餐阶梯从每月
              $40 购买 80 积分到每月 $600 购买 1,285 积分。这意味着公司现在至少有两条客户现金收款路径，叠加在同一套教师分成公式之上。缺失的是客户总支出如何转成 Outschool
              确认收入的转换关系：公开页面没有披露市场费水平、奖励积分后的实际折扣、退款发生率，或会员能否把留存改善到足以抵消更低的每积分价格。
