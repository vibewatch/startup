        blocks:
          - type: paragraph
            body: >-
              公开记录仍然以创始人为中心。多份已留存来源都指向 Amir Nathoo、Mikhail Seregine 和 Nick Grandy 这组三位创始人；Nathoo 仍明确担任
              CEO，并在融资、产品和合作公告中承担主要公开发言角色。TechCrunch 也提供了最清晰的创始人—市场匹配细节：Seregine 此前参与打造 Amazon Mechanical Turk 和 Google
              Consumer Surveys，Grandy 则曾在 Clever 担任产品经理。非创始人领导层在公开材料中也有可见度，但主要来自某一时间点的公告，而不是稳定的高管页面：2023 年辅导发布稿提到 Jim
              Blomo 担任产品与工程负责人，2024 年 Courses 发布稿提到 Cara Delzer 担任供给与合作负责人。治理披露比融资覆盖更薄。EdSurge 报道称 Reach Capital 的
              Jennifer Carolan 在 Series A 后加入董事会，Lightspeed 的投资组合页面把 Alex Taussig
              与该账户绑定为董事会合伙人，但已留存官方页面没有公开当前完整董事名单、观察员名单或股权结构图。尽调含义很直接：公司并非缺少领导层，但公开领导梯队深度和治理透明度落后于资本可见度。
