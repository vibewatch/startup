      - number: '6.4'
        title: 扩张逻辑和集中度风险
        blocks:
          - type: paragraph
            body: >-
              市场两侧都有扩张逻辑。家庭可以从一次性尝试转向经常性社团、营地、辅导或更广泛的在家教育补充；教师则可以根据双周需求数据和市场定价指引，增加更多班次、时间段和课程形态。但集中度风险很难用公开数据做投资测算。Outschool
              没有按付费家庭、重复家庭或头部买家披露客户数；也没有发布 NRR、GRR、队列留存、合同期限或州项目收入集中度。几类风险仍然可见。第一，ESA
              和奖学金需求取决于州批准、政策连续性和家庭导航支持。第二，项目化案例研究过度集中在少数州和合作伙伴，未必代表核心直接面向家庭市场。第三，教师供给和家庭需求都受学校日历、时区和有限教师资格覆盖影响，因此地理宽度不能消除季节性和排期摩擦。最后，2025
              年会员与客服投诉显示，即便教师层课程质量仍强，变现变化也可能损害情绪。
