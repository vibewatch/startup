      - number: '7.3'
        title: 教师质量、承包依赖和声誉审核风险
        blocks:
          - type: paragraph
            body: >-
              Outschool 的市场平台模式有意把内容创作和课程交付交给独立教师，目录因此更宽，但质量和审核也更难标准化。教师附录给教师定价和课程设计自由，但 Outschool
              仍控制上架审批、入驻、背景调查、付款机制、安全规则，以及暂停或移除教师的权力。这是尴尬的中间地带：平台控制足以让质量预期和承包依赖成为实质问题，却不足以像直接雇佣那样保证交付一致。公开投诉面说明了风险。家长评论同时抱怨价格可负担性和课程匹配，教师评论则提到供给过剩、开班率弱，以及
              30%
              佣金并不保证需求带来的挫败。《社区标准》和内容政策要求课程客观、世俗、适龄，并禁止骚扰或歧视行为，能压低一部分风险；但同一套政策也会把单节课纠纷升级成平台层面的审核或声誉事件。关键风险不是某一节坏课，而是薄弱经济性或市场平台快速增长，会不会让教师平均体验恶化得比
              Trust & Safety 的治理速度更快。
