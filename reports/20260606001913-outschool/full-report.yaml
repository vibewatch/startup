      - number: '6.4'
        title: Expansion logic and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Expansion logic exists on both sides of the marketplace. Families can move from one-off experiments into
              recurring clubs, camps, tutoring, or broader homeschool supplementation, while teachers can add more
              sections, time slots, and class formats in response to bi-weekly demand data and marketplace pricing
              guidance. But concentration risk is hard to underwrite with public data. Outschool does not disclose
              customer count by paying family, repeat household, or top buyer; it also does not publish NRR, GRR, cohort
              retention, contract length, or state-program revenue concentration. Several risks remain visible anyway.
              First, ESA and scholarship demand depends on state approval, policy continuity, and family navigation
              support. Second, programmatic case studies are disproportionately tied to a small set of states and
              partners, which may not represent the core direct-to-family marketplace. Third, both teacher supply and
              family demand are shaped by school calendars, time zones, and a bounded teacher-eligibility footprint, so
              geographic breadth does not eliminate seasonality and scheduling friction. Finally, the 2025 membership
              and support complaints suggest monetization changes can damage sentiment even when teacher-level class
              quality remains strong.
