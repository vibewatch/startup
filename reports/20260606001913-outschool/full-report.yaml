  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing history and the stale $3B mark
        blocks:
          - type: paragraph
            body: >-
              Outschool’s $3 billion valuation is well supported as a 2021 historical fact, but not as a freshly
              validated 2026 price. PRNewswire, TechCrunch, EdTechReview, IBL News, and Tracxn all corroborate the
              October 2021 $110 million Series D and the rapid step-up from the April 2021 Series C. Tracxn still shows
              the latest valuation as $3 billion as of October 2021, and none of the retained public sources shows a
              later round, secondary, or price-setting event that refreshes that mark. At the same time, current
              official pages still show a real, scaled marketplace: more than 140,000 classes, more than 1,000,000
              learners, global reach, current 70/30 teacher economics, memberships, and meaningful public-funded
              channels. The adverse problem is therefore not business existence but price freshness. TechCrunch’s 2022
              reporting that growth slowed more sharply than expected and that Outschool cut staff after schools
              reopened is a reminder that the 2021 mark was set in a more favorable period for education-technology
              sentiment than the one investors face in mid-2026.
            claimRefs:
