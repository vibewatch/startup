    title: Competitor profile table
    columns:
      - Competitor or substitute
      - Category
      - Scale or positioning signal
      - Target segment
      - Differentiation
      - Key limitation versus Outschool
    rows:
      - - Outschool
        - Reference company
        - 140,000+ classes, 1,000,000+ students, average disclosed 5:1 class ratio
        - Parents seeking live, interest-led K-12 classes and enrichment
        - Live small-group classes plus open teacher marketplace and explicit child-safety controls
        - Pricing/package shifts and marketplace quality consistency can still create fit and affordability questions
      - - Varsity Tutors
        - Direct paid live-learning rival
        - Public-company-backed live learning platform; hundreds of live classes plus tutoring
        - Families who want tutoring, test prep, and live classes in one membership
        - Closest overlap on live classes while also offering one-to-one matching
        - More tutoring-led and less browseable than Outschool's long-tail class marketplace
      - - Wyzant
        - Tutoring marketplace incumbent
        - 65,000 tutors, 300+ subjects, and 4 million 5-star reviews claimed
        - Families prioritizing one-to-one tutoring and tutor choice
        - Large tutor network, first-lesson-free guarantee, pay-after-lesson flow
        - Mostly built for one-to-one tutoring rather than social small-group classes
      - - Preply
        - Subscription tutoring marketplace
        - Trial-lesson funnel with recurring weekly subscriptions
        - Families wanting an ongoing tutor relationship, especially in languages and core help
        - Clear tutor-matching and recurring-study cadence
        - Not K-12-first and weaker on child-oriented group/community learning
      - - Schoolhouse.world
        - Free live substitute
        - Nonprofit volunteer tutor network with free SAT bootcamps and homework help
        - Students who need academic support at zero price
        - Live Zoom tutoring with no family payment
        - Narrower enrichment breadth and less professionalized supply than Outschool
      - - Khan Academy
        - Free self-paced substitute
        - Global nonprofit mission, free all-ages resources, parent and teacher tools
        - Families wanting mastery practice and self-paced academics
        - Free, standards-adjacent, study-at-your-own-pace model
        - Little live social learning or teacher marketplace discovery
      - - IXL
        - Standardized curriculum provider
        - Pre-K-12 skills across five major subject groups
        - Homeschool and mastery-focused families
        - Strong sequencing and standards-aligned practice depth
        - Less kid-choice breadth and less live human interaction than Outschool
      - - AoPS / Beast Academy
        - Advanced enrichment and homeschool alternative
        - Advanced grades 5-12 catalog plus live virtual campus and ages 6-13 Beast Academy
        - Advanced math, rigorous enrichment, and homeschool-heavy families
        - Strong rigor, small live classes, and specialized depth
        - Narrower subject breadth than Outschool's general-interest marketplace
      - - Udemy / Coursera
        - Broad async substitute
        - Massive on-demand and subscription libraries oriented to skills and credentials
        - Older self-directed learners and families with low-touch budget sensitivity
        - Huge content breadth and inexpensive async access
        - Adult or career orientation and weaker child-specific trust/live format
    notes: >-
      This table mixes direct rivals, adjacent tutoring marketplaces, curriculum substitutes, and free or async
      alternatives because buyers can solve the same learning job through different product shapes.
