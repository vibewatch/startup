  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Outschool's monetization model is legible even though its financial statements are not. The teacher-facing
              terms and teach page say the platform is free to list on, that teachers set their own prices, and that
              Outschool keeps a 30% service fee while educators receive 70% of class price. Families can now buy a la
              carte or through memberships. In the pay-per-class flow, parents pay the listed class price plus a
              marketplace fee; in the membership flow, families prepay monthly credits, avoid marketplace fees, and
              still leave teacher earnings unchanged. Credits are worth $0.50 each, and the public plan ladder runs from
              80 credits for $40 per month to 1,285 credits for $600 per month. That means the company now has at least
              two customer-cash collection paths layered over the same educator payout formula. What is missing is the
              bridge from gross customer spend to Outschool-recognized revenue: public pages do not disclose the
              marketplace-fee level, realized discounting after bonus credits, refund incidence, or whether memberships
              improve retention enough to offset lower per-credit pricing.
