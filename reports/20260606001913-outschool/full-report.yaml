      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is constructive on existence of monetization and cautious on everything that turns
              marketplace activity into investable revenue quality. Public sources clearly support a fee-based
              marketplace with a visible 30% educator split, upfront customer cash collection via memberships, and
              growing public-funded or partner-sponsored channels. That is materially better than a company whose
              revenue mechanism is still hypothetical. But the underwrite stops where visibility stops: there is no
              public GMV-to-net-revenue bridge, no disclosed ARR, no gross-margin segmentation by format, no CAC or
              payback, no refunds or credit-breakage rates, and no current burn or debt schedule. Even the most tempting
              revenue datapoint in the retained set—the $200 million 2024 figure from GetLatka—fails consistency checks.
              The practical conclusion is that Outschool may be a meaningful, scaled marketplace, but the margin path,
              capital intensity, and next-round dependency still depend on private materials. The minimum diligence pack
              is monthly revenue by payment type, cohort retention by format, marketplace-fee schedules, refund and
              write-off data, gross margin by class type, and a current balance-sheet and debt schedule.
