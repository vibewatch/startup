      - Current workflow problem
      - Outschool solution
      - Measurable benefit
      - Limitation
    rows:
      - - Find a class that fits a learner’s interests and schedule
        - Families otherwise browse fragmented tutoring, enrichment, and homeschool options across many sites
        - >-
          Outschool aggregates live and self-paced classes in one marketplace with personalized recommendations and
          visible reviews
        - >-
          Learner marketplace says 4.9 from 1.5 million class reviews; homepage advertises 140,000+ classes and
          personalized recommendations
        - Search/filter depth is visible, but ranking logic and quality-control economics are not
      - - Try a teacher before committing to a longer program
        - Families may hesitate to buy full-term courses without seeing fit
        - One-time, short, camp, semester, and recurring options let users ladder commitment levels
        - Official class-format docs explicitly separate short, one-time, camp, semester, and recurring structures
        - No public data shows which format converts or retains best
      - - Reduce checkout friction for frequent users
        - Paying a la carte creates repeated transactions and marketplace fees
        - Membership converts spend into credits, removes marketplace fees for members, and rolls unused credits forward
        - Public plans range from 80 credits/$40 to 1,285 credits/$600; credits are worth $0.50 each
        - Public evidence does not disclose how many buyers adopt membership or how fee waivers affect take rate
      - - Launch and schedule classes as a teacher
        - Teachers need reusable listings plus time-specific inventory and discoverability controls
        - Outschool separates classes from sections, defaults sections private, and lets teachers flip them public
        - Teachers can schedule up to 100 sections in a 24-hour period before system limits stop further scheduling
        - No public evidence on section-fill rates, teacher productivity, or listing-review SLA
      - - Run a live, interactive session safely
        - Standalone video tools do not include marketplace enrollment context or child-safety rules
        - >-
          Outschool launches section-specific Zoom meetings from the classroom and layers identity checks and moderation
          rules on top
        - Learners cannot enter until the teacher does; private learner-to-learner chat is disabled
        - Live delivery still depends on Zoom performance and teacher operational discipline
      - - Stay engaged between meetings or after class
        - Families need a lightweight way to access materials, posts, and recording follow-up
        - Outschool Classroom supports announcements, lessons, assignments, attachments, recordings, and messages
        - Welcome posts are auto-created and fixed-length classes can use syllabus-based posts and assignments
        - Public sources do not show completion, response-rate, or content-consumption analytics
      - - Manage classes while away from a desktop
        - Parents and learners need mobile access for reminders, search, and quick joins
        - Family apps support schedules, notifications, messaging, search, and joining live meetings
        - Official mobile support and app listings confirm mobile support for families on iOS and Android
        - Chat groups and some full-account flows still require a web browser; educator parity is incomplete
