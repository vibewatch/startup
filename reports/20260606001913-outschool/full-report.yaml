      - number: '3.4'
        title: Trust, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Outschool's moat is real but thinner than the catalog size suggests. The strongest pieces are clear: an
              average disclosed 5:1 class ratio, teacher screening and background checks, class review, learner conduct
              rules, public reviews, and a much broader long-tail class catalog than fixed curriculum businesses
              provide. Those are meaningful advantages over generic tutor-matching products. They are also advantages
              that rely on policy execution and marketplace health, not just software.


              The weak side of the moat is that both demand and supply look multi-homing-friendly. Teachers control
              their curriculum and pricing, which is good for variety but likely reduces lock-in. Families can peel away
              to one-to-one tutoring, mastery software, or free platforms when the job changes. Independent feedback
              already shows some affordability frustration with Outschool's credits model, while competitor reviews show
              their own trust problems but also underscore how easy it is for buyers to keep alternatives in the mix.
              Outschool therefore looks strongest as a niche leader in live, interest-led learning, not as a
              winner-take-all K-12 marketplace.
