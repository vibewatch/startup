      - - Membership-funded enrollments
        - Family prepays monthly credits and uses them across classes; no marketplace fee at checkout
        - Monthly plan plus credit consumption
        - Live and publicly documented
        - Better cash visibility and lower checkout friction, but bonus credits and rollovers muddy realized economics
        - >-
