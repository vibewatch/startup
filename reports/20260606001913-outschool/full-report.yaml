  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Current revenue bridge
        - Quarterly 2024-2026 revenue, GMV, and gross-to-net bridge by family-pay, membership, ESA, and partner channel
        - The valuation debate is mostly denominator risk.
        - Finance pack, board deck, and management accounts.
      - - Retention and repeat demand
        - Membership retention, reenrollment rates, repeat cohorts, refund rates, and class-level cohort behavior
        - A premium multiple requires stickier demand than public consumer-edtech comps imply.
        - Growth analytics review using cohort tables and dashboard exports.
      - - Gross margin and payout economics
        - Teacher payout waterfall, refunds, credits, chargebacks, and gross margin by format
        - Visible 70/30 mechanics do not tell investors what net contribution margin really is.
        - FP&A, payments, and marketplace operations review.
      - - Public-funded and partner quality
        - Channel-specific contribution margin, concentration, renewal rates, and policy dependency
        - Diversification can help the thesis, but only if the economics are durable.
        - State-program and partnership channel diligence.
      - - Cap table and price support
        - Preference stack, option overhang, secondaries, 409A history, and any post-2021 fairness or tender materials
        - Headline valuation can be misleading if economics have already reset beneath it.
        - Counsel review plus cap-table audit.
      - - Exit route and buyer map
        - Strategic interest, sponsor appetite, merger alternatives, and realistic IPO prerequisites
        - Return underwriting changes materially if the likely exit is strategic or sponsor-led instead of public.
        - CEO / board materials and banker references.
    notes: If these asks cannot be answered cleanly, the right stance is patience rather than price-taking.
    claimRefs:
      - CV021
      - CV041
      - CV046
      - CV047
      - CV049
      - CV050
