  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Marketplace surface and discovery UX
        blocks:
          - type: paragraph
            body: >-
              Outschool’s public surface is broader than a single tutoring or Zoom-class product. The homepage and
              learner marketplace both frame the product as a large catalog of live and self-paced classes for ages
              3–18, with discovery driven by reviews, teacher profiles, and personalized recommendations rather than a
              fixed curriculum path. The support center then fills in the format map: one-time classes, short courses,
              camps, semester courses, recurring weekly classes, and asynchronous groups all sit under the same
              marketplace umbrella. That is strategically important because it lets Outschool reuse one discovery layer
              across multiple learning cadences, while memberships add a second monetization-and-retention layer on top.
              Memberships change checkout mechanics by turning spend into credits, removing marketplace fees for
              members, and bundling a 100+ self-paced library plus rollover credits. The main product message is
              therefore flexibility: families browse a very large catalog, compare teacher-driven formats, and choose
              either pay-as-they-go or credit-backed usage. The weak point is that the same openness that creates
              breadth also makes quality heavily dependent on individual teacher execution, which outside reviews still
              flag as variable.
