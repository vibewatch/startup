        - Families with schedule changes or class mismatch risk losing money quickly
        - Request exception-rate data and refund-denial reasons by class format
      - - Credit or refund forfeiture
        - Policies say excessive refund or credit-return requests may disqualify future returns
        - Manual support workflow outside standard windows
