        - Evidence of weaker class fill rates, falling repeat enrollment, or renewed staff cuts
        - Another material cost reset or private KPIs showing sustained post-school-return deterioration
        - Re-cut growth, margin, and retention assumptions; treat as thesis pressure rather than noise
      - - Teacher quality / contractor fragility
        - Rising teacher complaints about weak demand, payout friction, or high commission without support
        - Meaningful churn among quality educators or declining learner outcomes / review quality
        - Assume catalog quality erosion and higher moderation burden
      - - Policy-channel reversal
        - State marketplace rule change, vendor approval loss, or reimbursement friction in key ESA states
        - Any change that materially delays or blocks funded purchases in a major state
        - Reduce confidence in publicly funded growth channels and reassess channel concentration
      - - Platform dependence crystallizes
        - Major Zoom / platform outage or repeated degraded performance across core components
        - Multi-hour live-class interruption, repeated incident clusters, or poor root-cause transparency
        - Treat as operational thesis break until reliability data and remediation are provided
    notes: >-
      Kill criteria are investor heuristics tied to observable public signals and the specific private data gaps that
      remain outstanding.
