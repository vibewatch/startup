      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Outschool does have visible mitigations: dense policy coverage, background checks, mandatory reporter
              rules, class review, platform-only Zoom links, recording retention controls, status transparency, and
              state-funding guidance. Those are meaningful because they show management understands where risk lives.
              But public mitigations are still mostly process evidence, not outcome evidence. Investors still lack
              current public data on incident rates, teacher churn, class fill rates, revenue mix by funded channels,
              and long-run outage frequency. That means the investment question is less 'does Outschool have policies?'
              and more 'do those policies hold up under post-pandemic economics?' The cleanest kill criteria are
              therefore operational and monitorable: any child-safety or privacy enforcement event; clear evidence of
              renewed fill-rate deterioration or family affordability backlash; teacher complaints suggesting rising
              churn among quality instructors; state rule changes that reduce ESA/vendor eligibility; or a material
              Zoom/platform outage that interrupts classes at scale. If two or more of those signals move together, risk
              transmission from trust to bookings to retention becomes fast.
