  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Only the bull case reaches the current $3B mark on public evidence; the probability-weighted middle is materially
      lower.
    data:
      items:
        - label: Bear case
          low: 360
          mid: 540
          high: 720
          displayValue: $0.36B-$0.72B
          detail: Revenue lands near $120M-$160M and the market grants only 3x-4.5x.
          tone: negative
        - label: Base case
          low: 900
          mid: 1220
          high: 1540
          displayValue: $0.90B-$1.54B
          detail: Revenue lands near $180M-$220M and the market pays 5x-7x.
          tone: warning
        - label: Bull case
          low: 2080
          mid: 2640
          high: 3200
          displayValue: $2.08B-$3.20B
          detail: Revenue lands near $260M-$320M and the market pays 8x-10x.
          tone: positive
    approximationNotes: >-
      Ranges are illustrative and explicitly tied to scenario assumptions rather than to a verified current revenue
      disclosure.
    claimRefs:
