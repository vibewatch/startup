            body: >-
              Outschool’s customer evidence points to a broad family-market segmentation rather than a single narrow use
              case. The company still clearly serves homeschool households: its homeschool hub positions Outschool as a
              way to build a full at-home curriculum, cites funding tools such as ESAs and tax-credit scholarships, and
              frames co-ops, tutors, and live online classes as core supports. But the current marketplace also
              explicitly merchandises after-school clubs, one-on-one classes, and summer camps, all with the same 4.9
