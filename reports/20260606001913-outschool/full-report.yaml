            Latka estimate; useful only as a rough denominator because the same page falsely says Outschool raised no
            outside funding.
          tone: warning
        - label: 2021 bookings clue
          value: 100
          detail: TechCrunch cited bookings above $100M in 2021, showing scale but not current revenue.
          tone: negative
    approximationNotes: Values are simple revenue thresholds for the current $3B mark; they are not discounted-cash-flow outputs.
