      - number: '5.2'
        title: Teacher workflow and live delivery
        blocks:
          - type: paragraph
            body: >-
              The teacher operating model is also fairly legible in public docs. Outschool separates class creation from
              section scheduling, so educators first define the learning experience and then publish one or more
              scheduled sections that learners can actually enroll into. That gives the marketplace a clean separation
              between reusable class metadata and time-specific inventory. The platform defaults new sections to private
              and lets teachers switch them public for marketplace discovery, while also imposing an operational ceiling
              of 100 scheduled sections in a 24-hour period. Once a section exists, Outschool gives it a dedicated
              classroom with announcements, discussions, welcome posts, lessons, posts, assignments, and file/video
              attachments. Fixed-length and self-paced classes diverge here: syllabus-driven formats get richer posting
              and assignment tools, while self-paced classes rely on lesson blocks and prerecorded videos. Live delivery
              itself is standardized on Zoom, integrated through the classroom so learners join the right section
              without handling raw meeting credentials. Outschool is not exposing a proprietary real-time classroom
              stack; it is orchestrating a teacher workflow, enrollment system, and content layer around a third-party
              video provider. That design likely accelerates feature delivery, but it also makes live-class quality and
              reliability partly dependent on Zoom plus the discipline of teachers using the tooling well.
            claimRefs:
