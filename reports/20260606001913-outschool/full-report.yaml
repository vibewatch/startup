      - CV043
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Outschool scores well on marketplace reality and channel breadth, but poorly on public valuation support and
      economics visibility.
    data:
      items:
        - label: Marketplace proof
          value: 4
          note: Official pages and 2021 coverage show real scale and supply depth.
        - label: Channel diversification
          value: 3.5
          note: Memberships and public-funded channels are visible, but their economics remain private.
        - label: Economics visibility
          value: 1.5
          note: Current revenue, margin, and retention data are not publicly disclosed.
        - label: Public price support
          value: 1
          note: The current mark is stale and screens rich versus public comps.
        - label: Sector backdrop
          value: 2
          note: EdTech funding and late-stage multiples are more disciplined than in 2021.
        - label: Downside asymmetry
          value: 1.5
          note: If revenue is far below the premium threshold, downside can be very large.
        - label: Exit readiness
          value: 2
          note: A strategic or sponsor path looks more realistic than a near-term IPO.
    approximationNotes: Scores are ordinal investment-committee aids anchored to retained evidence, not a mechanical valuation model.
