      - number: '3.3'
        title: Curriculum providers, free substitutes, and broad async platforms
        blocks:
          - type: paragraph
            body: >-
              Free and structured alternatives matter because many education purchases are not really about a specific
              marketplace brand. Schoolhouse.world and Khan Academy attack the same core-academics budget from opposite
              live/self-paced angles at a zero price point. IXL, AoPS, and Beast Academy compete where the family wants
              mastery sequences, advanced rigor, or homeschool-friendly structure. Udemy and Coursera pull from a
              different angle again: they make huge async course libraries cheap and convenient, especially for older
              learners, teens, and parents who are comfortable with self-directed content.


              None of those substitutes fully reproduces Outschool's mix of kid-safe live instruction, social presence,
              and open teacher discovery. But they do reset buyer expectations. The more the family values free help,
              standards alignment, advanced math rigor, or on-demand convenience, the more Outschool starts to look like
              a discretionary enrichment spend rather than a must-have academic utility. That dynamic matters for
              defensibility because it narrows the part of the market where Outschool is genuinely hard to replace.
