companyProfile:
  summary: |
    Outschool is a San Francisco–based private education marketplace founded in 2015 by Amir
    Nathoo, Mikhail Seregine, and Nick Grandy. The company connects families of learners ages 3–18
    with independent educators across live small-group classes, self-paced offerings, tutoring, and
    structured Courses, and it has expanded beyond homeschool roots into after-school enrichment,
    camps, and alternative-education use cases. Public sources support meaningful marketplace scale
    and about $239.9 million of disclosed capital raised through the October 2021 Series D, but
    current revenue, precise headcount, governance, and retention disclosure remain limited.
  foundedDate: '2015-01-01'
  founders:
    - name: Amir Nathoo
      role: CEO, Co-founder
      claimRefs:
        - CO010
        - CO011
    - name: Mikhail Seregine
      role: Co-founder
      background: Previously helped build Amazon Mechanical Turk and Google Consumer Surveys.
      claimRefs:
        - CO010
        - CO012
    - name: Nick Grandy
      role: Co-founder
      background: Former product manager at Clever.
      claimRefs:
        - CO010
        - CO013
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: |
    Outschool sells access to a two-sided online learning marketplace centered on live small-group
    classes, with additional self-paced classes, one-on-one tutoring, structured Courses, and
    seasonal camp-style programming. Official materials emphasize vetted teachers, small class sizes,
    and a broad catalog that now spans core academics, enrichment, and alternative-education use
    cases.
  customerFocus: |
    Families of K-12 learners ages 3–18, especially homeschool users, after-school enrichment
    buyers, tutoring users, camps-and-clubs buyers, and ESA-funded families, plus a smaller
    district, nonprofit, and community-program channel through Outschool.org.
  businessModel: |
    Two-sided marketplace model: teachers supply classes and generally set pricing, Outschool keeps a
    30% service fee on enrollments, and families can buy either per class or via monthly membership
    credits. The company also appears to monetize public-funded, scholarship, and partner channels.
  stage: Series D-backed private company
  fundingStatus: >-
    About $239.9M disclosed raised across seed through Series D; last public round was a $110M Series D at a $3B
    valuation in October 2021, with no later public financing disclosed.
