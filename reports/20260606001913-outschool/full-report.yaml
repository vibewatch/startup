        title: Unit economics clues and revenue-quality limits
        blocks:
          - type: paragraph
            body: >-
              Public unit-economics evidence is strongest on the visible teacher split and weakest on realized net
              economics. Outschool's pricing guide still points educators to category-specific pricing bands, and the
              company says it is not revisiting the 70/30 split. Membership pages show a cash-upfront model with
              rollover credits, one-time top-ups, and full upfront credit deductions for some multi-week enrollments,
              while teachers are paid only after class begins. Those mechanics imply potentially favorable
              working-capital timing for the platform, but they do not reveal how much value is ultimately kept after
              marketplace fees, promotional credits, refunds, chargebacks, or support costs. The public record also
              shows multiple monetizable formats—live group classes, ongoing clubs, one-on-one tutoring, week-long
              camps, and self-paced content—yet it does not disclose the mix across them. That matters because revenue
              quality likely differs by format: memberships and tutoring may offer better repeat behavior, while camps
              are more seasonal and self-paced content may function more as retention support than standalone profit
              center. Revenue quality therefore looks directionally promising but not underwriting-grade.
