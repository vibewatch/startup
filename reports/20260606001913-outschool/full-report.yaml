              Forbes and Today's Parent both describe Outschool as moving beyond homeschool roots into supplemental
              tutoring, enrichment, and social learning for conventionally schooled children. On the programmatic side,
              Outschool.org adds a distinct public-funding and community-program segment through ESA navigation,
              direct-to-family scholarships, and partnerships with districts, public schools, co-ops, and nonprofits.
