      - number: '2.3'
        title: Demand drivers, seasonality, and post-COVID normalization
        blocks:
          - type: paragraph
            body: >-
              Demand remains real, but it is no longer an undifferentiated pandemic-era edtech spike. Homeschooling
              continued to grow in 2024–25, and EdChoice’s 2026 sector view still puts 4.8% of students in homeschooling
              while 2.8% use an educational choice program. On the school side, NCES says 85% of public K–12 schools
              offer after-school programming, yet only 13% of students are expected to participate in academically
              focused programs and only 42% of schools can meet all demand. Afterschool Alliance and Wallace add the
              family lens: parents of nearly 30 million children want afterschool programs, but more than three quarters
              of that demand goes unmet because affordability, accessibility, and availability still bind. The
              learning-recovery case has also not disappeared. RAND finds districts still using tutoring, staffing, and
              additional instruction time, while the 2026 Education Scorecard shows students remain below pre-pandemic
              achievement baselines and that higher-poverty districts were more dependent on federal relief. At the same
              time, Freedonia’s slower 2024–27 growth rate versus 2020–24 shows normalization from emergency funding and
              rapid digital adoption. For Outschool, the implication is a market with real need, but one whose growth is
              seasonal and more measured around spring academic pressure, summer recovery/enrichment, and back-to-school
              schedule resets.
