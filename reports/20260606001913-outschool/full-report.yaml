  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, segmentation, and where Outschool fits
        blocks:
          - type: paragraph
            body: >-
              The right market frame for Outschool starts with boundary discipline. Outschool’s own product pages
              describe a marketplace serving ages 3–18 through live and self-paced online classes, with small-group
              interaction, an average 5:1 student-teacher ratio, and coverage from core academics to enrichment. That
              means the company is not just a tutoring vendor, but it is also not the whole K–12 edtech or schooling
              market. The cleanest included spend is paid supplemental learning outside the standard school day: online
              tutoring, homeschool electives, clubs, camps, academic assistance, academic enrichment, and other
              parent-paid or subsidy-supported classes. NCSL’s ESA overview matters because it shows that tutoring,
              instructional materials, educational technology, out-of-school-time activities, and homeschooling expenses
              can all sit inside the same wallet, and Outschool explicitly signals that some families use ESA or similar
              funding on the platform. Excluded spend should include full-time schooling, core district curriculum, and
              zero-price substitutes such as nonprofit tutoring or tuition-free virtual public school. In practice,
              Outschool fits best where families want flexible, live, social, interest-led, or homeschool-aligned
              learning rather than commodity homework help alone.
