      - number: '1.4'
        title: Milestones, platform broadening, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The chronology shows a company that expanded well beyond its original niche. After seed, Series A, Series
              B, Series C, and Series D financings, Outschool used the pandemic-era demand spike to move from a
              homeschool-adjacent marketplace into a broader education platform. The strongest later milestones are
              product and channel shifts: a 2023 tutoring launch with an AI Teaching Assistant, a 2024 Courses launch
              for homeschool and alternative-education families, and a 2025 partnership with Sora Schools for
              project-based summer camps. At the same time, not every milestone is positive. TechCrunch reported that
              Outschool laid off 31 people, or 18% of its workforce, in 2022 after rapid fundraising and hiring, while
              complaint surfaces such as ComplaintsBoard and BBB preserve ongoing friction around support and class
              access. The company’s trust-and-safety materials also show how much operational discipline is required in
              a marketplace serving children: Outschool maintains formal safety guidance, a teacher STRIKE framework,
              binding-arbitration terms, and public policy messaging around alternative education. The result is a
              business with clear brand and product momentum, but also visible execution, support, and governance
              questions that later chapters should not dismiss as edge noise.
