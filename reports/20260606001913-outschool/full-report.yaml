      - number: '8.3'
        title: Scenario range and return logic
        blocks:
          - type: paragraph
            body: >-
              Scenario work has to be explicit about what is evidence and what is assumption. The evidence side is
              relatively clear: the 2021 price was $3 billion, sector medians are far lower than pandemic-era
              enthusiasm, and the only retained current topline clue is a contradictory third-party estimate of $200
              million in 2024 revenue. The math that follows is therefore not a claim of precision; it is an
              entry-discipline tool. A base case that assumes roughly $180 million to $220 million of revenue and 5x to
              7x valuation multiples yields only about $0.9 billion to $1.5 billion of value. A bear case using $120
              million to $160 million and 3x to 4.5x produces about $0.36 billion to $0.72 billion. Only the bull case
              can reach the current mark, and that requires revenue already materially above the low-confidence public
              clue, plus stronger retention, margin quality, and channel durability than public sources currently prove.
              The sensitivity bridge makes the same point from the other direction: $3 billion needs about $385 million
              of revenue even at the 7.8x sector median, and about $300 million even at a premium 10x multiple.
            claimRefs:
