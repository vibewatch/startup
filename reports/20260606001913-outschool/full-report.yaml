        - Request how often this clause is enforced and against which user cohorts
      - - Support responsiveness
        - Trustpilot users describe AI-like or weak support; official support page points mainly to chat and email
        - Live chat and email are the visible channels
        - Slow resolution can amplify billing and class-fit disputes
        - Request first-response and full-resolution SLAs plus escalation paths
      - - Mobile-app limitations
        - >-
          App Store and Google Play describe family access, reminders, and class joining, but full account management
          remains web-centric
        - Website still needed for full account access
        - Mobile friction can weaken on-the-go retention and support satisfaction
        - Request app retention, support-ticket mix, and mobile conversion data
