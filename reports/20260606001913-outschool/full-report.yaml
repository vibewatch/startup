      - number: '3.2'
        title: Direct paid rivals in live tutoring and classes
        blocks:
          - type: paragraph
            body: >-
              Among paid alternatives, Varsity Tutors is the closest direct product challenger because it combines
              tutoring with hundreds of live group classes and benefits from a public-company disclosure surface through
              Nerdy. But its center of gravity still looks like a centrally packaged tutoring membership, not a
              browseable long-tail teacher marketplace. Wyzant is the opposite: it is deeply marketplace-native, with
              tutor profiles, reviews, schedules, background-check visibility, tutor-set hourly rates, and post-lesson
              payments, but it is structurally built for one-to-one tutoring rather than cohort classes. Preply pushes
              farther toward recurring tutor relationships through trial lessons and weekly subscription commitments.


              Compared with those rivals, Outschool asks parents to shop classes before they hire an instructor. That
              supports enrichment, hobby learning, and social exploration better than a tutoring marketplace does. It
              also creates softer edges around predictability: the family experience depends more on class
