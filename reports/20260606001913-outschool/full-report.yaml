      - number: '2.2'
        title: TAM, SAM, and geographic sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is useful only when treated as layered evidence rather than a single number. The
              outer shell is global private tutoring: Fortune Business Insights places that market at US$72.61 billion
              in 2026. A narrower delivery-mode lens comes from The Business Research Company, which sizes global online
              tutoring at US$16.86 billion in 2026 after US$14.06 billion in 2025. A narrower U.S. digital lens comes
              from Grand View Research at US$4.33 billion for U.S. online private tutoring in 2024, while
              Freedonia/Simba puts U.S. K–12 supplemental materials at US$4.73 billion in 2024 and StrategyMRC puts
              global K–12 supplemental education at US$2.5 billion in 2026. Those figures are not additive and do not
              disagree by rounding; they disagree because they measure different shells of spend, geographies, and buyer
              contexts. Geography is similarly uneven. Fortune says Asia Pacific represented 60.85% of global private
              tutoring in 2025, while a Frontiers review reports tutoring participation ranging from below 10% in
              Scandinavia to above 70% in countries such as Cambodia, Myanmar, and Singapore. For Outschool, that means
              broad TAM rhetoric should be discounted in favor of a narrower online, parent-pay, homeschool, and
              enrichment-adjacent SAM where marketplace-style live classes are actually relevant.
