            body: >-
              Public evidence suggests Outschool’s product is strongest at the application layer and weakest at the
              infrastructure layer. On distribution, the family mobile apps are real and useful: they support schedules,
              messaging, notifications, live-meeting joins, and class search, but both official support docs and store
              listings make clear that educators and some advanced account functions still fall back to the browser.
              Reliability transparency is better than average for a private marketplace because Outschool runs a public
              status page with separate components for Zoom access, website, classroom messaging, and purchasing.
              Recruiting adds the clearest stack clues: 2026 engineering job posts name TypeScript, React, Node.js,
              GraphQL, and PostgreSQL, and they say the company is building an AI-powered public-funding reimbursement
              platform while scaling the existing marketplace. A separate partner case study shows real
              AI/personalization activity, but at the lifecycle and recommendation layer rather than an explicitly
              documented learner-facing AI tutor. External reviews also show the product trade-off investors should keep
              in mind: memberships can create pricing friction for some families, and the marketplace model still
              inherits teacher-quality variance. The biggest technical diligence gap is therefore the invisible layer:
