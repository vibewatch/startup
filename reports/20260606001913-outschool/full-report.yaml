  - id: TM005
    title: Substitute and structural pressure table
    columns:
      - substitute
      - price point
      - what it solves
      - where it wins
      - limitation
      - implication for Outschool
    rows:
      - - Schoolhouse.world
        - Free
        - Live online tutoring and SAT prep
        - Budget-sensitive academic-help use cases
        - Narrower subject scope and volunteer-led model
        - Caps pricing power in commodity tutoring and test prep.
      - - District afterschool and summer programs
        - Free or subsidized
        - Academic support, supervision, and recovery programming
        - When a school already has funding and family trust
        - Capacity is constrained and access is uneven
        - Substitutes for academic help but often leaves unmet demand.
      - - Connections Academy and similar tuition-free virtual schools
        - Free tuition
        - Full-time online schooling
        - Families seeking zero-tuition comprehensive virtual delivery
        - Not modular or interest-led in the same way as a marketplace
        - Strong substitute for full-time online school, not for niche enrichment.
      - - AI homework helpers and generative-AI tools
        - Free or freemium
        - Instant explanations, brainstorming, revision, and homework help
        - Late-night or low-friction academic support
        - Efficacy, safety, and social learning quality are uneven
        - Pressures generic homework-help classes and low-differentiation tutoring.
      - - Homeschool co-ops, pods, and district part-time options
        - Variable, often local-market priced
        - Community, electives, and socialization
        - Families wanting in-person or hybrid local support
        - Geographically constrained and less scalable
        - Strong local substitute in homeschool-heavy markets.
      - - Free on-demand content libraries
        - Free
        - Recorded lessons and practice content
        - Self-paced independent learners
        - No live accountability, mentorship, or community
        - Pressure is highest on content-only classes, lower on live social formats.
    notes: >-
      Structural substitutes matter because many buyers can solve the same job with free, public, nonprofit, or local
      options before they ever reach a paid online marketplace.
