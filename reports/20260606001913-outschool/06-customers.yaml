company:
  name: Outschool
chapter:
  number: 6
  title: Customers
  summary: Outschool shows clear customer breadth across homeschool, after-school enrichment, tutoring, camps, ESA-funded families, and a smaller district or community-program channel via Outschool.org. Public satisfaction still looks broadly positive, but 2025-2026 complaint surfaces around memberships, refunds, and support materially weaken the retention story because the company does not publicly disclose cohort or concentration metrics.
sections:
- id: segmentation-adoption
  title: Customer segmentation and adoption trajectory
  body: 'Outschool’s customer evidence points to a broad family-market segmentation rather than a single narrow use case. The company still clearly serves homeschool households: its homeschool hub positions Outschool as a way to build a full at-home curriculum, cites funding tools such as ESAs and tax-credit scholarships, and frames co-ops, tutors, and live online classes as core supports. But the current marketplace also explicitly merchandises after-school clubs, one-on-one classes, and summer camps, all with the same 4.9 rating badge drawn from 1.5 million class reviews. Independent sources line up with that broader mix. Forbes and Today''s Parent both describe Outschool as moving beyond homeschool roots into supplemental tutoring, enrichment, and social learning for conventionally schooled children. On the programmatic side, Outschool.org adds a distinct public-funding and community-program segment through ESA navigation, direct-to-family scholarships, and partnerships with districts,
    public schools, co-ops, and nonprofits. The result is a diversified demand surface by use case, but not yet a disclosed revenue mix by segment.'
