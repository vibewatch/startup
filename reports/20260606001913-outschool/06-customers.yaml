- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Homeschool to full-curriculum supplementation
    - Public materials show breadth but not household wallet share or annual spend concentration
    - Could overstate durability if many families only buy occasional classes
    - Request cohort revenue by family type and annual household spend bands
  - - After-school to tutoring and recurring clubs
    - Membership-credit backlash may interrupt the conversion from trial to repeat spend
    - Platform monetization changes could reduce re-enrollment even with strong teacher ratings
    - Request conversion and churn before and after the credit-model rollout
  - - Summer camps to year-round enrichment
    - Camp demand is seasonal and tied to school calendars
    - Summer strength may not translate into full-year family retention
    - Request monthly class-booking and reactivation curves by format
  - - ESA and scholarship-funded families
    - Policy eligibility, approval, and reimbursement are state dependent
    - Revenue or bookings may concentrate in a small number of approval states or wallet platforms
    - Request bookings and repeat usage by ESA state and funding mechanism
  - - District and nonprofit programs
    - Case studies are real but may be concentrated in a limited set of grant-backed partners
    - Programmatic demand may be less scalable or less durable than the retail marketplace
    - Request renewal history, contract sizes, and margin profile for programmatic accounts
  - - Global reach plus limited teacher supply footprint
    - Learners are global but teacher eligibility and USD/PayPal economics are bounded
    - Geographic reach does not eliminate supply, scheduling, or payment-rail bottlenecks
    - Request learner and teacher concentration by country, time zone, and payout corridor
  notes: Risk rows focus on where public segment breadth is visible but revenue durability or concentration data is still missing.
