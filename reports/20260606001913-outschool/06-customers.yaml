- id: retention-satisfaction
  title: Retention proxies, satisfaction, and complaint signals
  body: 'Public satisfaction evidence is directionally positive but materially noisier than Outschool’s own merchandising implies. Official category pages keep repeating a 4.9 score from 1.5 million class reviews, and the annual report says 87% of Outschool.org learners wanted more classes. Trustpilot’s archived 2025 snapshot is still solid at 4.4 out of 5 across 3,295 customers, and several reviews describe repeat or long-term use. However, the complaint mix changed meaningfully after the membership-credit transition. Trustpilot and SmartCustomer or Sitejabber both contain detailed complaints about being pushed into monthly credit plans, losing accumulated credits on cancellation, difficulty downgrading, and slow or AI-like customer support. Outschool’s own support policies partly explain the friction: renewal charges are non-refundable, class cancellations are governed by narrow 24-hour windows, and excessive refund requests can reduce future eligibility. Today''s Parent also liked the
    class quality but said costs can add up quickly and Outschool is more like tutoring or extracurricular spend than a full-day camp replacement. The underwriting conclusion is that class-level satisfaction appears better than platform-level billing satisfaction, and public retention evidence is still proxy-based rather than KPI-grade.'
