- id: TU005
  title: Complaints, refund, and support friction table
  columns:
  - Issue
  - Evidence
  - Current policy or surface
  - Impact on customer durability
  - Diligence path
  rows:
  - - Membership credit confusion
    - Trustpilot and SmartCustomer complaints cite forced or confusing credit plans and hard-to-downgrade memberships
    - Membership credits roll over, but renewals are non-refundable
    - Can reduce trust and slow repeat spend even if class quality stays high
    - Request post-rollout churn, cancellation, downgrade, and complaint-contact rates
  - - Refund windows are narrow
    - Support docs allow most refunds only within 24 hours or before access begins
    - Direct-pay and membership rules both center on 24-hour windows
    - Families with schedule changes or class mismatch risk losing money quickly
    - Request exception-rate data and refund-denial reasons by class format
  - - Credit or refund forfeiture
    - Policies say excessive refund or credit-return requests may disqualify future returns
    - Manual support workflow outside standard windows
    - Could chill trust for high-usage households that experiment frequently
    - Request how often this clause is enforced and against which user cohorts
  - - Support responsiveness
    - Trustpilot users describe AI-like or weak support; official support page points mainly to chat and email
    - Live chat and email are the visible channels
    - Slow resolution can amplify billing and class-fit disputes
    - Request first-response and full-resolution SLAs plus escalation paths
  - - Mobile-app limitations
    - App Store and Google Play describe family access, reminders, and class joining, but full account management remains web-centric
    - Website still needed for full account access
    - Mobile friction can weaken on-the-go retention and support satisfaction
    - Request app retention, support-ticket mix, and mobile conversion data
  - - Scheduling and DST friction
    - Support docs warn families that cross-region DST changes can shift local class times by one hour
    - Times are localized automatically, but cross-region shifts still occur
    - International and non-U.S. users may face higher coordination friction
    - Request usage and churn by time zone and non-U.S. geography
  notes: This table blends official policy language with complaint surfaces to show where class quality and billing or support experience can diverge.
