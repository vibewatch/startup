tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Homeschool families
    - Parent buyer / learner user / parent or ESA payer
    - Core academics, interest-led curriculum, flexible scheduling
    - Explicit current hub plus state-by-state legal and funding guidance
    - Sticky starting wedge because Outschool can fill subjects families do not teach themselves
    - No public share of revenue or paying families from homeschool cohort
  - - After-school enrichment and clubs
    - Parent buyer / learner user / household budget
    - Social learning, hobbies, enrichment after school
    - Dedicated after-school clubs page with 4.9 score from 1.5M class reviews
    - Large and broad top-of-funnel use case for mainstream families
    - Unique-family denominator behind review count is undisclosed
  - - Tutoring and one-on-one learning
    - Parent buyer / learner user / household or scholarship payer
    - Remediation, acceleration, personalized support, social-skills coaching
    - Dedicated one-on-one page plus educator pricing guidance for tutoring
    - Higher-ticket and more outcome-oriented than generic enrichment
    - Public tutoring retention and repeat-purchase rates are not disclosed
  - - Summer camps and break-period learning
    - Parent buyer / learner user / household or ESA payer
    - School-break coverage, short intensives, academic boot camps, passion projects
    - Dedicated summer-camps page and educator guidance that says demand peaks May-Aug and again in December
    - Seasonal spend can pull in families who do not want a long-term commitment
    - Highly seasonal and not a substitute for full-day camp or school
  - - ESA, scholarship, and microgrant families
    - Parent buyer / learner user / state wallet or scholarship payer
    - Flexible learning funded through ESA, scholarship, or microgrant programs
    - Current ESA hub plus Outschool.org family-navigation support
    - Public funding can expand wallet size for classes that parents might not buy fully out of pocket
    - State approval, eligibility, and reimbursement rules create policy concentration risk
  - - District, nonprofit, and co-op programs
    - Program administrator buyer / learner user / grant, district, or public program payer
    - Tutoring, enrichment, direct-to-family scholarships, family advising
    - Outschool.org case studies with districts, co-ops, and community partners
    - Opens a programmatic channel beyond retail households and can seed future family demand
    - Direct marketplace revenue contribution versus nonprofit-program flow is not disclosed
  notes: Segments are grouped by buyer and payer logic; scale mixes current marketplace pages with nonprofit-program evidence rather than disclosed revenue mix.
