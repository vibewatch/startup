figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Observed family journey from discovery to repeat use and programmatic expansion.
  data:
    items:
    - label: Need discovery
      stage: Discover
      actors:
      - Parent
      - Learner
      touchpoints:
      - Homeschool hub
      - After-school clubs
      - Summer camps
      - Tutoring
      emotion: Families arrive through a concrete need such as enrichment, remediation, or schedule flexibility.
    - label: Teacher and class evaluation
      stage: Evaluate
      actors:
      - Parent
      touchpoints:
      - Teacher bios
      - Ratings and reviews
      - Age filters
      - ESA guidance
      emotion: Confidence rises when parents can match a child’s interest or learning need to a specific teacher.
    - label: First enrollment
      stage: Buy
      actors:
      - Parent
      - Learner
      touchpoints:
      - One-time class
      - Camp
      - Recurring club
      - 1-on-1 session
      emotion: Low-commitment entry points make experimentation easy, but billing rules matter immediately.
    - label: Repeat or weekly use
      stage: Use
      actors:
      - Parent
      - Learner
      - Teacher
      touchpoints:
      - Recurring classes
      - Support
      - Schedule management
      - Membership credits
      emotion: Teacher quality can create habit, while membership and refund friction can break it.
    - label: Expansion path
      stage: Expand
      actors:
      - Parent
      - Program administrator
      touchpoints:
      - More subjects
      - ESA or scholarship funding
      - District or nonprofit program
      - Referrals
      emotion: Expansion can move from retail spend into funded or programmatic channels, but public revenue visibility drops sharply here.
