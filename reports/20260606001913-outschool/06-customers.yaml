- id: named-customer-proof
  title: Named family and program proof
  body: 'For a consumer marketplace, Outschool’s strongest named-customer proof is not enterprise logo pages; it is a mix of named parent testimonials, dated class reviews, and program-partner case studies. Official parent quotes on the homepage describe confidence gains for an ADHD and dyslexic learner, strong engagement from flexible live instruction, and perceived value from coding classes. Category pages for one-on-one and summer camps add dated customer snippets that mention Honors Math support, social-skill gains, and willingness to re-enroll. Programmatic proof is stronger and more measurable: Charleston County School District’s tutoring partnership with Outschool.org shows assessment gains and expansion to another school, while Engaged Detroit and AmplifyGR demonstrate that the offering can work as a scholarship- or advising-enabled product for homeschool and district-adjacent families. What remains thinner is direct proof that these public-interest programs convert into large, durable
    marketplace revenue for Outschool.com rather than for the nonprofit channel alone.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU038
