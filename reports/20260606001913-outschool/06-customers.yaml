  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Marketplace NRR, GRR, logo churn, renewal rate, contract length, and cohort retention by family segment.
    whyItMatters: Without cohort-grade retention data, the investment case relies too heavily on testimonials, ratings, and one-off review proxies.
    diligencePath: Request board metrics, cohort tables, and monthly family re-enrollment data split by homeschool, tutoring, camps, and after-school segments.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue or booking concentration by state, ESA program, district or nonprofit partner, and top buyer cohort.
    whyItMatters: Current public proof shows breadth of segments but does not show whether bookings are concentrated in a few funded states or partners.
    diligencePath: Request revenue, bookings, and active-family concentration by geography, funding program, and top 20 buyers or programs.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: membership-change-impact
    missingEvidence: Churn, downgrade, complaint, and support-resolution metrics before and after the membership-credit rollout.
    whyItMatters: The retained complaint corpus suggests a policy-inflicted satisfaction hit that could reduce durable repeat spend despite strong class quality.
    diligencePath: Request monthly cancellation, downgrade, refund-denial, chargeback, and support-ticket trendlines spanning the old and new billing models.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU024
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: More named direct-family case studies with dated usage duration, class count, and spend or repeat-enrollment detail.
    whyItMatters: The chapter can prove that real families and programs use Outschool, but not yet that many named families become multi-year, high-LTV customers.
    diligencePath: Request anonymized but dated repeat-family cohorts and richer customer references that span homeschool, tutoring, clubs, and ESA-funded use cases.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU003
