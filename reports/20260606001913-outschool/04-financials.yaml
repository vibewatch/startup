figures:
  - id: FI001
    title: "Revenue model bridge"
    type: flow
    layout: wide
    summary: Outschool has two customer cash-collection paths feeding the same educator split, but public sources stop short of a full gross-to-net revenue bridge.
    data:
      nodes:
        - id: discovery
          label: Family or partner discovers class supply
          detail: Learners arrive through direct family browsing, memberships, public-funded programs, or partner-linked credits.
          tone: neutral
        - id: checkout
          label: Pay per class or membership checkout
          detail: A la carte checkout adds a marketplace fee; membership prepays credits and removes that fee.
          tone: positive
        - id: class-price
          label: Teacher-set class price
          detail: Outschool is free to list on and educators set prices in USD.
          tone: neutral
        - id: teacher-share
          label: Teacher receives 70% of class price
          detail: The core marketplace split is fixed publicly at 70/30.
          tone: positive
        - id: outschool-capture
          label: Outschool captures 30% service fee plus some undisclosed extras
          detail: Marketplace-fee level, bonus-credit dilution, refunds, and realized net take are not published.
          tone: risk
        - id: net-revenue
          label: Recognized revenue and gross profit remain undisclosed
          detail: Public pages do not reconcile family spend, credits, refunds, and support costs into net revenue.
          tone: risk
      edges:
        - from: discovery
          to: checkout
          label: demand enters platform
        - from: checkout
          to: class-price
          label: family commits spend
        - from: class-price
          to: teacher-share
          label: educator payout formula
        - from: class-price
          to: outschool-capture
          label: platform share
        - from: outschool-capture
          to: net-revenue
          label: accounting still opaque
