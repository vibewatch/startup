tables:
  - id: TI001
    title: "Revenue streams table"
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current public status
      - Revenue quality read
      - Diligence ask
    rows:
      - - Pay-per-class live and ongoing classes
        - Family pays listed class price plus a marketplace fee; teacher receives 70% of class price
        - Per learner enrollment
        - Live and publicly documented
        - Clear monetization path, but marketplace fee size and net take rate are undisclosed
        - Provide GMV, marketplace-fee revenue, refunds, and net revenue by pay-per-class flow.
      - - Membership-funded enrollments
        - Family prepays monthly credits and uses them across classes; no marketplace fee at checkout
        - Monthly plan plus credit consumption
        - Live and publicly documented
        - Better cash visibility and lower checkout friction, but bonus credits and rollovers muddy realized economics
        - Provide active members, monthly credit issuance, breakage, rollover balances, and net revenue by member cohort.
      - - 1-on-1 tutoring and coaching
        - Teacher-set hourly pricing sold through the same 70/30 marketplace model
        - Per learner-session or hourly equivalent
        - Explicitly promoted in pricing guidance and summer programs
        - Higher ticket and potentially stickier, but repeat rate and acquisition cost are not disclosed
        - Break out tutoring GMV, repeat usage, and contribution margin.
      - - Camps and multi-day programs
        - Course or club format sold around school-break demand
        - Per learner enrollment across multiple meetings
        - Peak demand from May to August and again in December
        - Seasonal spikes can lift volume, but seasonality can weaken revenue smoothness
        - Provide monthly GMV and margin by camp season versus non-camp months.
      - - Public-funded ESA and scholarship enrollments
        - State, scholarship, and microgrant dollars routed to families who then enroll on or through Outschool channels
        - Funded learner or family account spend
        - Publicly described as growing rapidly
        - Less discretionary than pure family spend, but program concentration and reimbursement timing are opaque
        - Provide funded-family GMV, net revenue, state concentration, and payment timing.
      - - Partner- and school-sponsored credits
        - Organizations or partner schools bundle Outschool credits or classes into broader education offerings
        - Sponsored credit package or contracted program
        - OpenEd Academy offers students up to $100 of credits; organizations can list classes
        - Could lower CAC and expand distribution, but contract economics are fully undisclosed
        - Provide contract value, subsidy economics, and retention after sponsored credits expire.
    notes: >-
      Stream-level net revenue, GMV, and mix are not publicly disclosed. “Current public status”
      reflects whether the mechanism is visible in retained sources, not whether its economics are
      quantified.
