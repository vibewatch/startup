  - id: TI004
    title: "Capital adequacy table"
    columns:
      - Input
      - Public evidence
      - Status
      - Why it matters
      - Diligence ask
    rows:
      - - Total disclosed funding
        - $240M across 6 rounds (Tracxn 2026 profile)
        - Third-party disclosed
        - Establishes the outside-capital base available before any 2026 liquidity judgment
        - Reconcile cap table against signed financing documents and board materials.
      - - Last priced round
        - $110M Series D at $3B valuation on 2021-10-14
        - Officially disclosed
        - Most recent confirmed valuation and financing support in retained sources
        - Provide any later internal marks, secondary pricing, or bridge financing.
      - - Rapid pre-normalization funding cadence
        - $45M Series B (2020), $75M Series C (Apr 2021), $110M Series D (Oct 2021)
        - Mixed official and third-party
        - Shows financing support arrived during the pandemic acceleration period
        - Provide post-2021 capital plan and whether any facility has since replaced equity support.
      - - Use of funds
        - Global expansion and new products for schools and parents
        - Officially disclosed at high level
        - Indicates capital was earmarked for growth rather than merely balance-sheet repair
        - Provide actual spend by product, geography, and channel since the raise.
      - - Current cash balance
        - null
        - Undisclosed
        - Required to judge survival without another financing event
        - Provide latest unrestricted cash and restricted cash balances.
      - - Monthly burn
        - null
        - Undisclosed
        - Needed to assess whether 2021 capital still covers today's cost base
        - Provide monthly operating cash burn and scenario plan.
      - - Runway months
        - null
        - Undisclosed
        - Next-round timing cannot be estimated without current liquidity and burn
        - Provide base, bear, and bull runway cases.
      - - Debt / credit facilities
        - null
        - Undisclosed
        - Hidden leverage can change downside risk materially
        - Provide debt schedule, vendor financing, lease liabilities, and covenant summary.
      - - Headcount proxy
        - 1,526 employees as of May 2026 (Tracxn)
        - Third-party estimate
        - Gives a rough operating-scale clue but not payroll cost or productivity
        - Confirm current FTE count, contractor spend, and role mix.
      - - Normalization signal
        - 2022 layoffs of 18% and later 25% / 43 people
        - Adverse third-party reporting
        - Suggests the pandemic-era cost base required resizing after demand normalized
        - Provide post-layoff operating plan and whether further restructuring occurred.
      - - Next-round trigger
        - No retained public source disclosed funding after Oct 2021
        - Inferred
        - With no current cash disclosure, future financing need remains unknowable from public data
        - Provide financing runway threshold and board-approved fundraising trigger.
    notes: >-
      This table separates what is truly disclosed from what must still be requested. “Undisclosed”
