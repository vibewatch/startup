  - id: capital-adequacy-and-contradictory-estimates
    title: "Capital adequacy, funding support, and contradictory estimates"
    body: >-
      The public capital story is fresher than the public operating story. Outschool's own October
      2021 release announced a $110 million Series D at a $3 billion valuation and said it followed
      a $75 million Series C in April 2021. Tracxn's 2026 company page extends that chronology to
      $240 million total funding across six rounds and puts employee count at 1,526 as of May 2026.
      What investors still cannot see is the present liquidity position. No retained public source
      disclosed current cash, monthly burn, runway, debt facilities, or covenant pressure, and no
      fresh public fundraising after 2021 appears in the retained source set. That makes 2022's
      layoffs financially relevant: they are one of the few external clues that the pandemic-era
      cost base overshot normalized demand. The best example of data-quality risk is GetLatka. Its
      page says Outschool hit $200 million of revenue in 2024, but the same page also describes the
      company as bootstrapped with zero outside funding, directly contradicting official and other
      database evidence. That contradiction is severe enough that modeled revenue estimates should be
      treated as low-confidence inputs rather than underwriting anchors.
    claimRefs:
      - CI026
      - CI027
      - CI030
      - CI031
      - CI032
