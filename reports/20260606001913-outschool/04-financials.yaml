  - id: FI004
    title: "Capital intensity / cash-flow map"
    type: flow
    layout: wide
    summary: The retained public record shows where growth capital was meant to go, but not what cash remains after normalization and restructuring.
    approximationNotes: >-
      This map is qualitative. It connects disclosed funding support and strategic uses of funds to
      the main cash demands visible in public sources; it does not assign dollar values to current
      spend because cash, burn, and runway are undisclosed.
    data:
      nodes:
        - id: funding-base
          label: 2020-2021 funding wave
          detail: Tracxn lists $45M Series B, $75M Series C, and a $110M Series D, with the last official round at a $3B valuation.
          tone: positive
        - id: growth-uses
          label: Global expansion and new products
          detail: Series D proceeds were earmarked for global expansion and new products for schools and parents.
          tone: neutral
        - id: channel-build
          label: Tutoring and funded-channel buildout
          detail: Public sources show a tutoring pivot, ESA and scholarship growth, and partner-sponsored credits.
          tone: neutral
        - id: operating-cost
          label: Teacher payouts, support, payments, and platform operations
          detail: The company pays educators after class begins and must support credits, refunds, compliance, and customer support.
          tone: neutral
        - id: normalization
          label: Post-COVID normalization pressure
          detail: 2022 layoffs show the cost base had to reset as demand slowed from pandemic highs.
          tone: risk
        - id: liquidity-gap
          label: Remaining cash and runway unknown
          detail: No retained public source discloses current cash, burn, debt, or runway.
          tone: risk
      edges:
        - from: funding-base
          to: growth-uses
          label: official use of funds
        - from: growth-uses
          to: channel-build
          label: product and distribution expansion
        - from: channel-build
          to: operating-cost
          label: higher service and support load
        - from: operating-cost
          to: normalization
          label: cost base meets slower demand
        - from: normalization
          to: liquidity-gap
          label: present adequacy unresolved
    claimRefs:
      - CI019
      - CI021
      - CI023
      - CI026
      - CI028
      - CI030
      - CI031
      - CI032
      - CI033
      - CI041
