  - id: TI005
    title: "Public financial gaps table"
    columns:
      - Missing metric
      - Current public proxy
      - Impact on verdict
      - Exact diligence path
    rows:
      - - Net revenue and ARR by payment model
        - 30% split, membership tiers, and modeled third-party estimates only
        - Cannot tell whether growth is driven by high-quality recurring net revenue or gross billings proxies
        - Request monthly net revenue and ARR by pay-per-class, membership, tutoring, sponsored, and funded channels.
      - - GMV-to-revenue bridge and marketplace-fee rate
        - Pay-per-class includes an undisclosed marketplace fee; memberships waive it
        - Without the bridge, take-rate quality and recognized revenue mechanics remain opaque
        - Request booking waterfall from family spend to teacher payout, marketplace fee, discounts, refunds, and recognized revenue.
      - - Gross margin by format
        - Teacher split is known; support, payment, and content costs are not
        - Margin path cannot be underwritten across tutoring, camps, self-paced, and funded channels
        - Request gross profit by format and by payment model.
      - - CAC, repeat rate, and retention by cohort
        - Tutoring pivot and public-funded growth are visible, but efficiency metrics are absent
        - Cannot assess whether post-COVID growth is efficient or subsidy-dependent
        - Request CAC, payback, repeat booking, churn, and 12-month retention by format.
      - - Refunds, chargebacks, credit breakage, and rollover liability
        - Policy mechanics are public; realized rates are not
        - Working-capital quality and effective take rate may differ materially from list economics
        - Request monthly refund and chargeback rates, unused-credit balances, and breakage recognition policy.
      - - Cash, burn, runway, and debt
        - 2021 funding support and 2022 layoffs are the main public clues
        - Capital adequacy cannot be judged without current liquidity data
        - Request latest balance sheet, cash flow statement, debt schedule, and runway model.
      - - Consumer versus funded or partner channel mix
        - Outschool.org, OpenEd, and webinar disclosures show channel growth but not revenue mix
        - Revenue resilience versus discretionary family spend remains unquantified
        - Request bookings, revenue, and gross margin by direct-pay, membership, funded, and sponsored channels.
      - - Audited or management financial statements
        - SEC Form D datasets are generic notices and are not a substitute for full filings
        - Public filing visibility is too thin for underwriting-grade diligence
        - Request audited annual financials, current management accounts, and revenue-recognition memo.
    notes: >-
      Each gap is actionable. The public record proves that Outschool monetizes real activity, but
      it does not supply the financial package needed to underwrite revenue quality, margin
      durability, or current runway.
