  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-mix-and-net-revenue
      missingEvidence: Net revenue, ARR, or GMV by pay-per-class, membership, tutoring, camp, sponsored, and public-funded channels.
      whyItMatters: Without a mix and gross-to-net bridge, the visible take rate does not tell you how much durable recurring revenue Outschool actually keeps.
      diligencePath: Request monthly management accounts with bookings, GMV, net revenue, and refunds by payment model and format for the last 24 months.
      relatedQuestionRefs:
        - QI019
        - QI020
        - QI029
      relatedTableRefs:
        - TI001
        - TI005
    - type: private-evidence-only
      severity: material
      topic: unit-economics-and-margin
      missingEvidence: Gross margin by format, CAC by acquisition channel, payback, repeat rate, cohort retention, and refund or chargeback rates.
      whyItMatters: These are the variables that separate a healthy marketplace from one that only looks attractive at the gross-bookings level.
      diligencePath: Request cohort tables, channel CAC, contribution margin by format, refund and chargeback logs, and credit-breakage policy.
      relatedQuestionRefs:
        - QI022
        - QI023
        - QI024
        - QI028
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-and-runway
      missingEvidence: Current cash balance, monthly burn, runway, debt facilities, lease liabilities, and board-defined financing trigger.
      whyItMatters: Capital adequacy cannot be judged from a 2021 raise alone, especially after 2022 layoffs signaled a normalization reset.
      diligencePath: Request the latest balance sheet, cash flow statement, debt schedule, covenant summary, and 12-24 month runway model.
      relatedQuestionRefs:
        - QI017
      relatedTableRefs:
        - TI004
        - TI005
    - type: conflicting-data
      severity: material
      topic: third-party-revenue-estimates
      missingEvidence: Independent corroboration of any revenue figure through audited accounts, management accounts, or multiple consistent high-quality data providers.
      whyItMatters: The only retained revenue estimate comes from a source that contradicts itself on funding, which makes valuation work fragile if the number is treated as fact.
      diligencePath: Require audited or board-level revenue data and reconcile any external estimate against the company's cap table and financing history.
      relatedQuestionRefs:
        - QI020
      relatedTableRefs:
        - TI003
        - TI005
    - type: missing-source
      severity: material
      topic: operating-filings
      missingEvidence: Company-specific operating filings or equivalent public financial statements that disclose revenue, profitability, or balance-sheet detail.
      whyItMatters: SEC Form D resources explain exempt-offering notice infrastructure, but they do not replace full-company financial disclosure.
      diligencePath: Request audited annual statements, current management accounts, and any lender or investor reporting package because the public filing trail is too thin.
      relatedQuestionRefs:
        - QI018
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: channel-resilience
      missingEvidence: Revenue and gross-margin mix between direct family spend, memberships, public-funded programs, and partner-sponsored channels.
      whyItMatters: Diversification looks strategically positive, but resilience cannot be measured unless funded and sponsored channels are quantified against consumer demand.
      diligencePath: Request bookings, revenue, and gross margin by direct-pay, member, funded, and sponsored cohorts, plus concentration by state program and partner.
      relatedQuestionRefs:
        - QI025
        - QI029
      relatedTableRefs:
        - TI001
        - TI005
