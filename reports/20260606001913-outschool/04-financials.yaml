  - id: seasonality-channel-mix-and-normalization
    title: "Seasonality, channel mix, and post-COVID normalization"
    body: >-
      Outschool's disclosed demand signals suggest a more diversified business than its original
      pandemic-era homeschooling narrative, but the company does not quantify how much revenue each
      channel contributes. The educator handbook says camp listings are typically most popular from
      May through August and again in December, yet the same page says learners still seek tutoring,
      clubs, courses, and one-time classes during summer. The 2026 summer guide similarly presents
      camps, enrichment classes, academic summer programs, and one-on-one tutoring as active use
      cases. Outside the direct family-pay channel, Outschool's public-funding webinar says funded
      enrollments and spend are growing rapidly, Outschool.org says it has deployed $100 million
      through direct-to-family scholarships and served 125,000 learners, and the OpenEd Academy
      partnership gives students up to $100 in Outschool credits. Those facts matter financially
      because they suggest some diversification away from pure discretionary enrichment spending.
      The adverse counterweight is the 2022 normalization shock: TechCrunch reported two layoffs and
      quoted management saying growth had come back down to earth as students returned to school,
      with Outschool leaning harder into tutoring.
    claimRefs:
