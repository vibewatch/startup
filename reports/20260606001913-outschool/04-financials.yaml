  - id: TI002
    title: "Pricing / monetization table"
    columns:
      - Offer / program
      - Public price or fee
      - List vs realized pricing
      - Discounts / unknowns
      - Source signal
      - Diligence implication
    rows:
      - - Educator revenue split
        - 70% to teacher / 30% service fee to Outschool
        - Public list mechanic, not realized platform margin
        - Does not disclose marketplace fee, refunds, bonuses, or support cost
        - Teach page plus teacher earnings policy
        - Need gross-to-net bridge from class price to recognized revenue and gross profit.
      - - Pay-per-class checkout
        - Listed class price plus marketplace fee
        - Family-visible checkout, but extra fee amount is undisclosed publicly
        - Marketplace-fee level and accounting treatment are not public
        - Parent and teacher payment FAQs
        - Need fee schedule by geography and payment type.
      - - Membership plans
        - 80/$40, 144/$70, 248/$120, 500/$240, 800/$380, 1285/$600
        - Public list prices for monthly plans
        - Bonus credits, introductory promos, and plan mix reduce realized revenue per credit
        - Membership page and support center
        - Need active-member counts, plan mix, churn, and discounted-credit economics.
      - - 1-on-1 pricing guidance
        - Core academic $65-$70/hr; enrichment & clubs $55-$60/hr
        - Guidance rather than platform-wide realized average
        - Teacher-set pricing can move above or below guidance
        - Educator pricing tips page
        - Need booked tutoring ASP, repeat rate, and tutor utilization.
      - - One-time and course pricing guidance
        - One-time core academic $20-$23/hr; one-time enrichment $18-$21/hr; courses $22.50-$24/hr
        - Guidance rather than realized revenue
        - Hourly framing does not reveal class size, coupons, or refund incidence
        - Educator pricing tips page
        - Need booked ASP by format and contribution margin by class type.
      - - Self-paced weekly pricing guidance
        - Core academic $15-$20/week; enrichment & clubs $12-$18/week
        - Guidance rather than realized average
        - Conversion, completion, and support burden are undisclosed
        - Educator pricing tips page
        - Need self-paced attach, completion, refund, and renewal data.
      - - Credit value
        - Each credit is worth $0.50 toward classes
        - Public mechanic, not a direct margin disclosure
        - Bonus credits imply lower realized revenue per credit at higher tiers
        - Membership page and teacher membership guide
        - Need realized revenue per credit issued and consumed.
    notes: >-
      Public price points show list mechanics only. Realized economics can differ because of coupons,
      referral offers, bonus credits, refunds, taxes, and the undisclosed marketplace fee on a la
      carte checkout.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI006
      - CI007
      - CI011
      - CI012
  - id: TI003
    title: "Unit economics table"
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Teacher payout share
        - 70% of class price
        - High
        - Visible revenue split anchors the platform's basic take-rate model
        - Confirm whether organizations or sponsored programs ever alter the standard split.
      - - Advertised platform share
        - 30% service fee plus an additional undisclosed marketplace fee on pay-per-class checkout
        - Medium
        - Shows monetization is not limited to the 30% split, but fee layering is not quantified
        - Provide marketplace-fee rate cards and blended take rate by payment flow.
      - - Credit value and advertised savings
        - Each credit = $0.50; memberships advertise 5-10% savings
        - High
        - Necessary to translate member billing into class purchasing power
        - Provide realized revenue per credit after bonus credits, rollovers, and expired promotions.
      - - Seasonal demand peaks
        - Camps typically peak May-Aug and again in December
        - Medium
        - Seasonality affects cash-flow timing, instructor supply, and cohort mix
        - Provide monthly bookings and net revenue by format for the last 24 months.
      - - Public-funded spend trend
        - Public-funded enrollments and spend are growing rapidly, but no amount disclosed
        - Medium
        - Could improve demand resilience versus discretionary family spend
        - Provide funded-family GMV, net revenue, and state-program concentration.
      - - Net revenue / ARR / GMV
        - Not publicly disclosed; one modeled source says $200M revenue in 2024
        - Low
        - Core valuation input; current quality cannot be assessed without a GMV-to-net-revenue bridge
        - Provide audited revenue, ARR if tracked, and GMV by payment model.
      - - Gross margin by format
        - null
        - Low
        - Margin durability differs between tutoring, camps, memberships, and sponsored channels
        - Provide gross margin for pay-per-class, membership, tutoring, and funded channels.
      - - CAC / payback / repeat rate
        - null
        - Low
        - Needed to judge whether growth is efficient after post-COVID normalization
        - Provide channel CAC, payback, repeat booking, and cohort retention by format.
      - - Refunds / credit breakage / rollovers liability
        - Policy mechanics are public; realized rates are not
        - Low
        - These factors can materially change effective take rate and working-capital quality
        - Provide refund rate, chargeback rate, credit rollover balances, and any breakage policy.
      - - Cash / burn / runway
        - null
        - Low
        - Current financing dependency cannot be judged without liquidity data
        - Provide latest cash balance, monthly burn, runway plan, and debt schedule.
      - - Headcount proxy
        - 1,526 employees as of May 2026 (Tracxn)
        - Medium
        - Gives a rough cost-base proxy when cash data is absent
        - Confirm current FTE count and payroll burden by function.
    notes: >-
      Null means the retained public source set does not disclose a usable company figure. The
      modeled 2024 revenue datapoint is included only as a low-confidence external estimate because
      the same source is internally inconsistent on funding.
