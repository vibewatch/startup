  topStrengths:
    - >-
      Real marketplace scale is visible in the public record through 140,000+ classes, broad learner reach, and a
      clearly monetized fee structure.
    - >-
      Product breadth has expanded beyond homeschool live classes into self-paced, tutoring, Courses, camps, and
      public-funded pathways.
    - >-
      Demand surfaces are diversified across homeschool, enrichment, tutoring, ESA-funded families, and
      programmatic/community channels.
    - >-
      Public product and trust-and-safety materials are detailed enough to verify a working platform rather than a thin
      demand-gen layer.
  topRisks:
    - Current revenue, ARR, GMV bridge, margin, burn, runway, and clean retention metrics are not publicly disclosed.
    - The 2021 $3B mark looks stale versus 2026 EdTech multiples and is not re-underwritten by retained public evidence.
    - >-
      Child-safety, privacy, and moderation are structural risks in a recorded live marketplace for minors that depends
      on independent teachers and Zoom.
    - >-
      Post-pandemic normalization plus 2025-2026 membership and refund complaints leave open questions about
      affordability, repeat demand, and teacher economics.
  unresolvedGaps:
    - Management-certified 2024-2026 revenue, GMV-to-net-revenue bridge, gross margin, cash balance, burn, and runway.
    - Family and teacher cohort retention, refund rates, repeat behavior, and pre/post membership-rollout churn.
    - Current cap table, liquidation preferences, secondaries, and any post-2021 price-setting event or internal mark.
    - Current headcount, board and governance visibility, and state-funded or ESA channel concentration.
