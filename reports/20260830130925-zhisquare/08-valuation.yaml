    - Repeated industrial deployments across multiple customers with disclosed economics would strengthen the thesis.
  - - Robot-brain differentiation could produce a platform premium if AlphaBrain / NeuroVLA materially improve deployment outcomes.
    - Independent field metrics or customer case studies showing better task success, uptime, or lower integration cost.
  - - Current valuation outruns public fundamentals and may reflect bubble conditions.
    - Revenue, margin, retention, and backlog-conversion evidence would reduce the anti-thesis.
  - - Customer concentration and governance opacity weaken underwriting quality.
    - Top-customer diversification and IPO-grade governance disclosure would improve conviction.
