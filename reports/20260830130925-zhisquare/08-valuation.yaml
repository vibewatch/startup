- id: scenario-view-and-what-would-move-the-call
  title: Scenario View and What Would Move the Call
  body: The base case is not collapse; it is progress with caution. Zhisquare can continue converting industrial credibility into broader deployment, keep attracting capital, and move toward an IPO window. But for the investment case to improve meaningfully at today's price, the company needs more than momentum. It needs repeat deployments beyond the first anchor, more customer diversification, and audited or at least management-grade evidence on revenue, gross margin, and concentration. Those are the milestones that would justify a premium entry rather than a watchful one. The bull case is therefore milestone-driven and operational. The bear case is not that embodied AI disappears, but that one strong order and strong funding optics turn out to be insufficient once the sector faces its first true correction or once IPO preparation demands cleaner numbers than the current narrative provides.
  claimRefs:
  - CV028
  - CV029
  - CV030
  - CV031
  - CV032
  - CV036
  tableRefs:
  - TV003
  - TV005
  figureRefs:
  - FV003
- id: recommendation
  title: Recommendation
  body: The recommended stance is Track / Research More with medium confidence and high risk. That is not a dismissal of the company. Zhisquare has real strategic relevance, one of the stronger public industrial proofs in the category, and clear upside if its operating evidence catches up quickly. The problem is price and visibility. Public sources still do not disclose the revenue package, margin profile, cap table, preference stack, concentration schedule, or exit mechanics needed to support an aggressive new-money entry at the current headline valuation. A disciplined investor can stay close to the name, define milestone-based entry terms, and be ready to move if the company produces those missing proofs. Until then, the valuation is best treated as rich, the optionality as real, and the diligence burden as unresolved. New-money investors should insist that operating evidence, not excitement, sets the next pricing step.
  claimRefs:
