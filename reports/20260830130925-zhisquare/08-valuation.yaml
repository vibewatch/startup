- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Backlog conversion disappoints
    - Flagship order misses deployment or expansion milestones
    - Weakens customer-proof pillar
    - Move to avoid / reprice stance.
  - - Metrics still opaque into IPO window
    - No credible revenue, margin, or concentration disclosure
    - Weakens governance and valuation support
    - Do not underwrite premium entry.
  - - Down-round or pulled IPO
    - Capital-market signal reverses
    - Weakens valuation and access-to-capital pillars
    - Reset comparable set and downside case.
  - - Safety or quality incident
    - Major incident, recall, or regulatory setback
    - Weakens deployment thesis directly
    - Pause entirely until facts clear.
  - - Peer repricing wave
    - Comparable leaders reprice sharply lower
    - Weakens sector multiple support
    - Use lower-entry discipline immediately.
  claimRefs:
  - CV036
  - CV025
  - CV034
  notes: Kill triggers are designed for investment-committee monitoring, not just post-mortem explanation.
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and margin package
    - Recognized revenue, gross margin, and backlog-conversion data
    - Core input to any credible valuation
    - Request management packet and audits.
  - - Cap table and preferences
    - Dilution, seniority, secondaries, governance rights
    - Affects real entry price and downside protection
    - Request signed financing summary and charter docs.
  - - Customer concentration
    - Top-customer share and renewal behavior
    - One anchor may overstate traction quality
    - Request top-10 customer schedule and cohorts.
  - - Safety and deployment proof
    - Certification, incident, and uptime metrics
    - Needed to defend scaled industrial thesis
    - Request site-level operating reports.
  - - Exit readiness
    - IPO workstream, auditors, board committees, reporting controls
    - Determines actual liquidity timeline
    - Request IPO readiness checklist.
  claimRefs:
  - CV009
  - CV033
  - CV006
  - CV034
  notes: These asks define the minimum package needed to convert today's story into an investable pricing decision.
