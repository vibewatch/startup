    - Current mark could be defended and potentially look early
    - Execution and safety still matter
    - Possible but needs proof
  - - Base
    - Strong narrative and some traction persist, but transparency improves slowly
    - Current mark stays hard to justify for new money without discounts or structure
    - Multiple compression and concentration linger
    - Most plausible on public evidence
  - - Bear
    - Backlog conversion disappoints, financing cools, IPO slips, bubble deflates
    - Private marks compress materially below current headline value
    - Concentration, unit economics, and sentiment all hit at once
    - Cannot be dismissed
