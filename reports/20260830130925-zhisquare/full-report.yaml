      - number: '6.4'
        title: Customer Chapter Verdict
        blocks:
          - type: paragraph
            body: >-
              Zhisquare appears to have moved beyond pure aspiration on the customer side. The company has a real
              industrial anchor, multiple named vertical references, and enough workflow specificity to show that
              customers are not only attending demos. That is a real strength. At the same time, the customer chapter is
              not yet strong enough to support a low-risk scale conclusion. Public evidence still mixes production
              deployments, strategic partnerships, planned rollouts, and operating demonstrations. The missing pieces
              are classic but critical: active site count, revenue by customer, renewal behavior, churn, and
              top-customer concentration. Until those are disclosed, the correct view is that Zhisquare has meaningful
              customer traction and proof-of-use, but the durability and diversification of that traction remain key
              underwriting unknowns. A disciplined investor should therefore treat customer quality as a prove-it-again
              area in management diligence rather than as a solved question.
