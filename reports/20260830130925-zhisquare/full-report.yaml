      - number: '4.4'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Zhisquare looks like a company with elite fundraising access and meaningful early commercial
              signal, but still well short of public underwriteability on fundamentals. That verdict is not bearish on
              the business itself; it is a statement about disclosure quality. The committee can reasonably infer that
              the company is building a real hardware-and-deployment business, that it has enough capital support to
              keep pressing ahead, and that named industrial demand exists. It cannot yet infer whether recognized
              revenue is material, whether gross margins can turn positive at scale, whether customer concentration is
              manageable, or whether the next phase of growth requires more capital than the headline round sizes imply.
              Reported Hong Kong IPO preparation may eventually force cleaner metrics into the open, but until then the
              prudent view is that Zhisquare's capital structure is impressive, its commercial proof is promising, and
              its financial internals remain the biggest diligence blocker. Until audited revenue, gross margin, and
              cash metrics surface, financing scale should be treated as breathing room rather than proof of operating
              quality.
