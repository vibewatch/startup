            claimRefs:
              - CV001
              - CV028
              - CV029
              - CV030
      - number: '8.4'
        title: Recommendation
        blocks:
          - type: paragraph
            body: >-
              The recommended stance is Track / Research More with medium confidence and high risk. That is not a
              dismissal of the company. Zhisquare has real strategic relevance, one of the stronger public industrial
              proofs in the category, and clear upside if its operating evidence catches up quickly. The problem is
              price and visibility. Public sources still do not disclose the revenue package, margin profile, cap table,
              preference stack, concentration schedule, or exit mechanics needed to support an aggressive new-money
              entry at the current headline valuation. A disciplined investor can stay close to the name, define
              milestone-based entry terms, and be ready to move if the company produces those missing proofs. Until
              then, the valuation is best treated as rich, the optionality as real, and the diligence burden as
              unresolved. New-money investors should insist that operating evidence, not excitement, sets the next
              pricing step.
            claimRefs:
