      - number: '3.4'
        title: Bottom-Line Competitive Read
        blocks:
          - type: paragraph
            body: >-
              On balance, Zhisquare belongs in the top tier of Chinese embodied-AI competitors by capital signal and
              narrative ambition, but it is not yet the cleanest public leader on commercialization proof. If the
              committee cares most about price transparency and visible hardware commercialization, Unitree is ahead. If
              it cares most about industrial enterprise packaging and published performance characteristics, Boston
              Dynamics currently looks more mature. If it cares most about overwhelming balance-sheet power, Tesla is
              unmatched. Zhisquare's differentiated lane is a China-industrial champion thesis built on a strong
              robot-brain narrative, a meaningful state-and-strategic capital coalition, and at least one large named
              industrial order. That is a compelling competitive starting point, but it still needs broader
              distribution, clearer economics, and proof that customers stay for performance rather than for novelty or
              policy momentum. The next decisive competitive datapoint will be multi-site repeat deployments that
              demonstrate buyer stickiness instead of episodic showcase wins.
            claimRefs:
