  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top Risk Clusters
        blocks:
          - type: paragraph
            body: >-
              Zhisquare's public risk surface is unusual because the company sits at the intersection of very high
              valuation, very rapid fundraising, early but real industrial deployment, and still-thin operating
              disclosure. That produces four top risk clusters. First, safety and regulatory risk: humanoid deployment
              standards are still moving, and MIIT is explicitly emphasizing safety controls, evaluation, and lifecycle
              management. Second, concentration and execution risk: the HKC-linked anchor is strong proof, but it is
              disproportionately more detailed than other customer evidence. Third, capital-market risk: the company has
              been marked up quickly in a sector that even bullish observers describe as vulnerable to a 2027-2028
              shakeout. Fourth, governance and people risk: the public identity is founder-led while board and
              executive-bench depth remain under-disclosed. The interaction effect is what matters. A fast-moving
              robotics company with cleaner unit-economics disclosure might justify similar valuation risk more easily,
              while a slower-moving but more audited industrial company could absorb safety and concentration concerns
              with less damage to valuation. Zhisquare has neither that long audit trail nor that public margin
              transparency today, so its risks cannot be treated independently from one another.
