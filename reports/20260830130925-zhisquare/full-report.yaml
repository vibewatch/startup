      - number: '3.2'
        title: Capability, Pricing, and Proof Comparison
        blocks:
          - type: paragraph
            body: >-
              Public comparison is uneven, which itself is informative. Unitree gives buyers the clearest sticker-price
              anchor with the H2 at US$29,900 plus hardware detail on degrees of freedom, torque, and compute. Boston
              Dynamics discloses Atlas operating characteristics, enterprise integrations, and a customer-testing
              pathway with Hyundai. Tesla discloses almost no product-level buying details, but the SEC filing makes
              clear that Optimus is being funded inside an enormous industrial and AI infrastructure machine. Zhisquare
              sits between these modes. It has a stronger public AI narrative than many peers through AlphaBrain and
              NeuroVLA, and it has a stronger named industrial order than many startups disclose, but it remains
              quote-led on price and opaque on margin, backlog conversion, and contract structure. For buyers, that
              means the choice is not just whose robot is best; it is also whose proof is legible enough to support
              procurement and whose supplier can survive the sector's capital intensity.
