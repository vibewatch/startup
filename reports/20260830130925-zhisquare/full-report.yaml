      - number: '4.3'
        title: Unit Economics and Why Public Proof Is Insufficient
        blocks:
          - type: paragraph
            body: >-
              The public record supports a strong view on which unit-economics variables matter and a weak view on what
              their values are. Because humanoid deployment is capital-intensive, Zhisquare's margin path will depend on
              realized ASP, hardware BOM, field-service intensity, warranty cost, utilization, and the speed at which
              integration work becomes more repeatable. MIIT's 2026 deployment guidance and Foxconn's
              smart-manufacturing posture both imply technically demanding enterprise buyers and long integration-led
              sales cycles, which usually mean higher pre-sales and delivery costs. That dynamic does not make the model
              unattractive; it simply means capital can disappear quickly if support burden stays high or customer ROI
              takes too long to prove. The danger is that mega-rounds can temporarily hide those inefficiencies. Without
              disclosed gross margin, payback, or warranty data, investors are mostly seeing financing momentum and one
              named order rather than a fully formed hardware-software contribution-margin story.
