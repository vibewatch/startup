  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Zhisquare is easy to articulate. China is accelerating humanoid and embodied-AI
              adoption, the Greater Bay Area is one of the best manufacturing clusters in the world for turning that
              adoption into real workflow deployment, and Zhisquare has assembled an unusually strong capital coalition
              around a robot-brain-led product story. That combination could make it a national-champion-style winner in
              industrial embodied AI. The anti-thesis is equally clear: public valuation has scaled faster than public
              financial disclosure, the customer proof base is still concentrated, and the broader sector is widely
              described as overheated. In other words, Zhisquare could still become strategically extraordinary while
              simultaneously being a poor risk-adjusted buy at the current private mark. That price sensitivity is the
              core of the recommendation.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV038
