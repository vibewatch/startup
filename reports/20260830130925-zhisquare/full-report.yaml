      - number: '7.2'
        title: Why These Risks Matter Economically
        blocks:
          - type: paragraph
            body: >-
              These risks are not abstract. A safety-control or certification gap can slow deployment, a concentration
              problem can make revenue appear stronger than it is, a scale-up miss can erode gross margin through rework
              and service burden, and a pulled IPO or down-round can reprice the entire financing story. Because public
              revenue, margin, and burn remain opaque, outside investors have fewer hard numbers to offset those
              downside pathways. That means risk transmission is unusually direct: if operational proof weakens, capital
              confidence can weaken fast, and if capital confidence weakens, valuation durability is immediately in
              question. Zhisquare does have mitigants: a deep local manufacturing ecosystem, state-backed capital
              access, and a scenario-specific learning loop that could compound if flagship deployments convert
              successfully. But those mitigants reduce rather than remove the need for hard operational evidence.
              Another reason the economic transmission is severe is that robotics failures are often expensive in
              several dimensions at once: a deployment can miss operational targets, require more onsite engineers,
              create customer dissatisfaction, and absorb scarce management attention, all before recognized revenue
              catches up. In a capital-rich phase those problems can be covered for a while, but once public or private
              markets tighten, the same issues can force rapid repricing.
            claimRefs:
              - CR003
              - CR011
              - CR012
              - CR034
              - CR035
              - CR036
