  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Classes of Competition
        blocks:
          - type: paragraph
            body: >-
              Zhisquare does not compete in a simple one-company-against-one-company lane. The competitive field spans
              Chinese full-stack startups, listed incumbents with adjacent robot businesses, global
              industrial-automation leaders, and the status quo of manual labor plus task-specific automation. The
              closest direct peers are Chinese embodied-AI companies trying to combine robot bodies with in-house brains
              and industrial deployment stories. Unitree and LimX are particularly relevant because they pair
              China-local product velocity with visible commercialization signals, while UBTech matters as a
              governance-visible listed local incumbent. Boston Dynamics and Tesla are the two most important global
              reference points: Boston because it is already selling an enterprise humanoid narrative with published
              industrial specs, and Tesla because its balance sheet and AI infrastructure mean it can absorb far more
              iteration cost than any startup. Against that backdrop, Zhisquare stands out most on capital signal and
              robot-brain positioning, not yet on publicly proven scale leadership.
