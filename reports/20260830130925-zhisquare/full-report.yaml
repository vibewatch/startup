  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Logic
        blocks:
          - type: paragraph
            body: >-
              The easiest way to overstate Zhisquare's opportunity is to call it a robotics company and inherit the
              entire automation or AI market. The reviewed evidence supports a narrower and more useful boundary.
              Zhisquare sells into embodied workflows where a reprogrammable robot body, a robot-brain stack,
              integration, and ongoing service are all required to replace or augment labor in real operating
              environments. That boundary excludes a large amount of fixed-function automation and pure software AI.
              Within that narrower boundary, public estimates are still meaningful. Morgan Stanley, as quoted by CNBC,
              estimated a $2 billion China humanoid market in 2026 and $15 billion by 2030, while TrendForce described
              China as the world's largest humanoid market entering a critical commercialization phase. These estimates
              are best treated as directional TAM lenses rather than precise Zhisquare underwriting inputs, because they
              remain national, external-sales-level views rather than buyer-budget bottoms-up models.
