      - number: '1.4'
        title: Ground Truth, Signal Strength, and Open Gaps
        blocks:
          - type: paragraph
            body: >-
              Overall, the reviewed evidence is strong enough for later chapters to treat a few points as ground truth:
              Zhisquare is real, Shenzhen-based, founded in 2023, founder-led by Guo Yandong, building a full-stack
              robot-brain-plus-hardware story, and financed at a super-unicorn level by mid-2026. The record is also
              good enough to say commercialization is not purely aspirational. The HKC-linked order, reported near RMB
              500 million with 1,000-plus robots over three years, gives the company at least one named industrial
              anchor and one of the clearer scale proofs in the sector. At the same time, several diligence-critical
              items remain unresolved. No audited revenue, ARR, current headcount, formal board roster, or exact June
              2026 cap table is visible in reviewed public sources. The company therefore enters the rest of the report
              as a highly legible strategic narrative with meaningful product and capital proof, but still with major
              disclosure gaps that matter for underwriting, governance, and downside analysis.
