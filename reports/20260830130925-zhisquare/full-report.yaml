  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and What Is Actually Visible
        blocks:
          - type: paragraph
            body: >-
              Zhisquare's public commercial story is clear at the level of mechanism but not at the level of realized
              economics. The company is selling more than a robot body: the official pages, launch materials, and WRC
              profile consistently imply a package that includes embodied hardware, a robot-brain stack, deployment into
              customer workflows, and ongoing operational support. That means revenue likely comes from some mix of
              hardware sales or leases, integration work, software/fleet value, and post-deployment service. However,
              the retained public record does not disclose recognized revenue, ARR, ASP, gross margin, or attach rates
              for any of those elements. The one important exception is proof of commercial demand: the HKC-linked order
              shows a sizeable named backlog signal, but even that is better understood as order proof than as
              recognized revenue proof. In other words, the business model is legible, while the income statement is
              not.
