      - number: '7.3'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The right underwriting posture is not to treat Zhisquare as uninvestable; it is to define what would
              de-risk or break the thesis. De-risking evidence would include formal safety and certification mapping,
              repeat multi-site deployments beyond the first anchor, disclosed cash and burn metrics, a broader customer
              base, and clearer governance as IPO preparation advances. Conversely, several events should be treated as
              kill criteria: a major safety incident or recall in a flagship site, clear failure to convert backlog into
              repeat production deployments, or visible capital-market stress after the 2026 financing surge. Those are
              measurable thresholds, not vibes. If any of them occur, the current super-unicorn narrative would need to
              be revised aggressively because so much of the present case rests on future operating proof catching up
              with current capital confidence. This chapter therefore recommends monitoring evidence cadence as closely
              as operating milestones. If management is still relying on broad strategic narration while specific risk
              indicators remain undisclosed, that itself should be treated as a warning sign rather than a neutral
              absence of data. In practice, that means requesting monthly deployment milestone reviews, incident
              reporting, concentration dashboards, and financing contingency plans rather than waiting for annual
              narrative updates. A company scaling this fast should be able to produce those materials if the operating
              foundation is truly as strong as the capital story implies.
            claimRefs:
