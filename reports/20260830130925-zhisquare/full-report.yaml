      - number: '6.2'
        title: Named Customer Proof and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Zhisquare has stronger public named-customer proof than many comparable robotics startups, but the proof
              is uneven. The standout anchor is the Shenzhen Huizhi IoT / HKC-linked program: more than 1,000 robots
              over three years, near RMB 500M in reported value, with workflow detail spanning warehousing, loading and
              unloading, assembly, testing, and OLED-related processes. That is a meaningful production-grade proof
              item, not a vague logo slide. Beyond HKC, the company has named Bloomage / Huaxi Biology for biotech
              manufacturing, Jingneng Microelectronics for semiconductor tasks, and an unnamed top international
              automaker for automotive manufacturing. WAIC coverage adds evidence of regular retail-style operations
              across 10-plus provinces and cities. The adoption path that emerges is credible: visibility, scenario
              validation, production deployment, then potential multi-line or multi-site expansion. The unresolved
              question is how many deployments actually make it through that full loop.
