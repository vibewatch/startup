      - number: '5.2'
        title: Architecture and How It Is Supposed to Work
        blocks:
          - type: paragraph
            body: >-
              The most differentiated aspect of Zhisquare's public product story is the amount of architecture language
              it is willing to expose. The 2025 AlphaBot 2 launch describes GOVLA as a full-body VLA system combining
              broad perception, long-horizon reasoning, and whole-body output rather than only robotic-arm trajectories.
              The architecture is described with a slow System2 for planning and a fast System1 for control. The 2026
              NeuroVLA narrative then adds a brain-inspired framing around cortex, cerebellum, and spinal-cord
              functions, explicitly linking semantic understanding, dynamic correction, millisecond execution, and fault
              recovery. AlphaBrain docs broaden that story into a larger technical framework spanning baseline VLA,
              world models, RL fine-tuning, and continual learning. For diligence, this is a strong sign that the
              company has an internally coherent architecture. It is not, by itself, proof that the architecture is
              better than competitors in production.
