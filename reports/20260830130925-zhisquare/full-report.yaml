chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founder, and Operating Surface
        blocks:
          - type: paragraph
            body: >-
              Zhisquare is not a stealth lab or a vague concept brand on the reviewed public record. The company's
              official English and Chinese surfaces describe AI² Robotics / 智平方 as an AGI-native general-purpose robot
              company founded in April 2023 and focused on taking embodied intelligence from the digital world into
              physical workflows. That narrative is backed by a legal-identity trail: a third-party registry-style page
              lists the Shenzhen entity as established on 2023-04-17, while the company's own anti-impersonation
              statement published in May 2025 gives a concrete registered and operating address in Nanshan, Shenzhen
              plus a Beijing office and official channels. Leadership is unusually founder-centric in public materials.
              Guo Yandong is the clearly visible operator and spokesperson, and the company repeatedly frames his
              Microsoft, XPeng, and OPPO background as proof that it can combine original AI work with large-scale
              intelligent-terminal productization. The public surface is therefore strong on identity, mission, and
              founder credibility, but weak on the broader executive bench and formal governance mechanics.
