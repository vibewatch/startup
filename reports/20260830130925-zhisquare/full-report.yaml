  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              The reviewed public record supports a clear customer thesis: Zhisquare is primarily selling into
              enterprise and industrial workflows, not consumer demand. Semiconductor display manufacturing is the
              strongest named segment, automotive and biotech are the next most credible industrial verticals, and
              airport, community, and retail-service scenarios extend the product into public-facing environments. That
              segmentation matters because the buyer, user, and payer are different in each case. In industrial
              settings, the buyer is usually an operator or plant owner, the user is a line worker or supervisor, and
              the payer is some mix of automation, capex, or operating-improvement budget. In service scenarios, the
              same product may be closer to an operator opex decision. The most important conclusion is that
              manufacturing-first, not mass consumer adoption, remains the center of gravity for Zhisquare's customer
              economics and adoption quality. That focus also makes customer diligence more legible, because factory
              buyers usually have clearer budget authority, workflow metrics, and repeat-expansion logic than purely
              consumer use cases.
