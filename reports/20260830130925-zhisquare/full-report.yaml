  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Zhisquare is not selling a single hardware SKU in isolation. The reviewed public record describes a
              layered product made of AlphaBot hardware, an embodied model stack that evolved from AI2R Brain to Alpha
              Brain and NeuroVLA, plus the deployment workflows and data loops needed to make those systems useful in
              real environments. This is important because it means product maturity cannot be judged only by whether
              the robot can walk or manipulate objects. The actual delivered system includes reasoning and control
              software, edge deployment, scenario adaptation, customer workflow fit, and field operations. The company's
              module map therefore looks more like a vertically integrated operating system for productivity robots than
              a bare robotic arm or demo humanoid. That is also why the open AlphaBrain Platform matters: it extends the
              technical surface beyond a closed appliance and supports the company's claim that model, hardware, and
              scenario data co-evolve together.
