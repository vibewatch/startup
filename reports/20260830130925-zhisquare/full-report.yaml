      - number: '5.4'
        title: Trust, Safety, and Product-Technology Verdict
        blocks:
          - type: paragraph
            body: >-
              The sharpest product-tech diligence gap is not imagination; it is trust evidence. MIIT's 2026 deployment
              action and standards work make clear that collision detection, force limits, emergency stop behavior,
              black-box functions, interfaces, lifecycle management, and evaluation standards are all becoming normal
              expectations for real humanoid deployments. Yet the reviewed Zhisquare public surface does not provide a
              complete answer on certification, reliability metrics, incident history, SLA design, or formal safety
              cases. That does not mean the company lacks these controls. It means the architecture story is materially
              ahead of the trust-and-operations story in public evidence. The right product verdict is therefore
              nuanced: Zhisquare shows one of the richer architecture narratives in Chinese embodied AI and a strong
              multi-scenario deployment ambition, but it still needs far more public or private proof on reliability,
              compliance, and field support maturity before a cautious investor should treat the stack as fully
              de-risked. A serious diligence process should therefore treat the stack as promising but not yet fully
              industrialized until hard reliability and certification evidence is produced.
