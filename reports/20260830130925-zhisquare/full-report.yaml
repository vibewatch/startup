              - CV038
      - number: '8.2'
        title: Current Price Context and Comparable Discipline
        blocks:
          - type: paragraph
            body: >-
              At a valuation above RMB 20B and after a near-RMB 5B round, Zhisquare is already priced as more than a
              promising startup. It is priced as a likely future leader. That does not mean the mark is wrong, but it
              does mean the burden of proof is high. The comparable set reinforces discipline rather than certainty.
              Unitree contributes transparency through public hardware pricing and reported IPO progress. LimX offers a
              fast-moving local full-stack peer with disclosed pricing in CNBC coverage. UBTech provides a
              governance-visible listed robotics reference. Boston Dynamics shows what enterprise deployment maturity
              looks like. Tesla is the scale benchmark that exposes just how capital-intensive the long game could
              become. None is a perfect comp, but together they say the same thing: Zhisquare deserves serious
              attention, yet the current mark is asking investors to pay up before the public record fully explains the
              economics. That is exactly why the committee should treat comparables as triangulation tools rather than
              as a false invitation to precision. Where one comp offers transparency, another offers scale, and another
              offers enterprise maturity. The overlap across them is the key signal: current Zhisquare pricing already
              assumes that several hard things go right in sequence.
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV037
          - type: table
            tableRef: TV004
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV032
              - CV036
              - CV034
              - CV010
      - number: '8.3'
        title: Scenario View and What Would Move the Call
        blocks:
          - type: paragraph
            body: >-
              The base case is not collapse; it is progress with caution. Zhisquare can continue converting industrial
              credibility into broader deployment, keep attracting capital, and move toward an IPO window. But for the
              investment case to improve meaningfully at today's price, the company needs more than momentum. It needs
              repeat deployments beyond the first anchor, more customer diversification, and audited or at least
              management-grade evidence on revenue, gross margin, and concentration. Those are the milestones that would
              justify a premium entry rather than a watchful one. The bull case is therefore milestone-driven and
              operational. The bear case is not that embodied AI disappears, but that one strong order and strong
              funding optics turn out to be insufficient once the sector faces its first true correction or once IPO
              preparation demands cleaner numbers than the current narrative provides.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV036
