      - number: '4.2'
        title: Capital History and Forward Adequacy
        blocks:
          - type: paragraph
            body: >-
              If the revenue surface is thin, the capital surface is the opposite. Zhisquare's funding cadence
              accelerated from official Pre-A and Pre-A+ announcements in 2025 to an RMB 1B-plus B-round in February
              2026 and then a near-RMB 5B round in June 2026 that pushed valuation above RMB 20B. Public reports and
              company language indicate these proceeds support commercialization, mass production, robot-brain R&D, and
              broader industrial rollout. That is an extraordinary financing profile and it clearly reduces the
              near-term probability of a simple liquidity crunch. But the underwriting limit is obvious: gross proceeds
              are not the same as available cash. Public sources do not disclose the split between primary and secondary
              capital, the post-close cash balance, restricted cash, planned burn, or financing commitments tied to
              factory construction. So the right conclusion is not that adequacy is solved; it is that Zhisquare has
              bought itself time and optionality, but not public transparency.
