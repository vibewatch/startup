      - number: '6.3'
        title: Retention, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              The main customer diligence problem is not lack of any proof; it is lack of durability proof. Public
              sources do not disclose active site count, renewal rate, churn, NRR, GRR, or customer-satisfaction data.
              The clearest contract-duration evidence is only the three-year HKC-linked term. That means the best
              current read on expansion is logical rather than audited: one successful robot workflow should be able to
              spread across more lines, shifts, and plants if ROI and reliability hold. Policy support and
              strategic-capital signaling may also open doors, but they do not by themselves prove that end customers
              renew when subsidies or attention fade. Concentration risk is therefore high. When one anchor customer is
              much more detailed than the rest of the proof set, the right assumption is that customer mix could be much
              narrower than the narrative implies until management proves otherwise. That is especially important in
              robotics, where one flashy first customer can hide a much shallower installed base and a much longer route
              to broad fleet standardization.
