company:
  name: Zhisquare
chapter:
  number: 1
  title: Company Overview
  summary: Zhisquare is a founder-led Shenzhen embodied-AI company with a clear legal identity, a coherent robot-brain-plus-hardware product story, and one of the fastest funding ramps in Chinese robotics. Public evidence strongly supports the April 2023 founding, Guo Yandong-led operating identity, super-unicorn valuation above RMB 20 billion by mid-2026, and at least one named industrial anchor order, but still leaves governance, headcount, current revenue, and exact cap-table economics materially under-disclosed.
sections:
- id: identity-and-operating-surface
  title: Identity, Founder, and Operating Surface
  body: 'Zhisquare is not a stealth lab or a vague concept brand on the reviewed public record. The company''s official English and Chinese surfaces describe AI² Robotics / 智平方 as an AGI-native general-purpose robot company founded in April 2023 and focused on taking embodied intelligence from the digital world into physical workflows. That narrative is backed by a legal-identity trail: a third-party registry-style page lists the Shenzhen entity as established on 2023-04-17, while the company''s own anti-impersonation statement published in May 2025 gives a concrete registered and operating address in Nanshan, Shenzhen plus a Beijing office and official channels. Leadership is unusually founder-centric in public materials. Guo Yandong is the clearly visible operator and spokesperson, and the company repeatedly frames his Microsoft, XPeng, and OPPO background as proof that it can combine original AI work with large-scale intelligent-terminal productization. The public surface is therefore
    strong on identity, mission, and founder credibility, but weak on the broader executive bench and formal governance mechanics.'
  claimRefs:
