  - FO001
- id: capital-syndicate-and-valuation-step-up
  title: Capital Syndicate and Valuation Step-Up
  body: 'Zhisquare''s step-change in profile came from capital formation. The 2025 official announcements show a rapid funding cadence already underway with Pre-A and Pre-A+ rounds aimed at model iteration and commercialization. External coverage then accelerates sharply: an A-series round in 2025, a reported RMB 1 billion-plus B-round in February 2026, and a near-RMB 5 billion financing in June 2026 that multiple outlets said pushed valuation above RMB 20 billion. The June syndicate mattered not only for size but for composition. Tencent News described a full-stack capital roster spanning national-level strategic funds, Guangdong and Shenzhen policy vehicles, insurers, industrial backers, brokers, and financial investors. That breadth is one reason outside observers treat Zhisquare as a regional and increasingly national standard-bearer in embodied AI rather than as one more venture-backed robotics experiment. The August 2026 36Kr story adds the next narrative layer by reporting shareholding
    reform and Hong Kong IPO preparations, effectively turning Zhisquare from a fast-funded private company into a near-term capital-markets story.'
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
