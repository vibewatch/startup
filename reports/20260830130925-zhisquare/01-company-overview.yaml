- id: product-and-commercial-footprint
  title: Product Footprint and Early Commercial Surface
  body: The strongest non-financing evidence is that Zhisquare has a coherent product story and has pushed that story into real use cases. Official materials center on AlphaBot hardware defined by the AlphaBrain / AI2R Brain model stack, then broaden the story through product launches, conference demonstrations, and scenario-specific partnerships. By the April 2025 AlphaBot 2 launch, the company was already presenting automotive, semiconductor, and biotechnology manufacturing as its core industrial triangle while also announcing planned airport and community-service extensions. The 2024 WRC write-up and 2026 WAIC coverage show a company using public events not just for branding but for capability framing. That still does not prove durable production economics, but it does show a company with an integrated product vocabulary, named embodiments, and repeatedly described customer-facing deployment targets rather than only a research-paper narrative.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO012
  - CO026
  - CO027
  - CO032
  - CO033
  - CO037
  tableRefs:
