evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, voting-rights summary, and reserved-matters schedule for major investors.
    whyItMatters: >-
      Governance rights determine whether strategic or policy investors can redirect commercialization, hiring, or IPO
      timing.
    diligencePath: Obtain the latest shareholder agreement, board observer side letters, and capitalization table from management.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A verified run-date employee count by city and function.
    whyItMatters: Headcount is needed to judge burn, operating leverage, and whether the team depth matches the product narrative.
    diligencePath: Request payroll-backed headcount, org charts, and a city-by-function hiring plan.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: An investor-by-investor breakdown of the June 2026 financing round and post-money ownership.
    whyItMatters: >-
      Valuation without ownership concentration obscures dilution risk, governance control, and future secondary
      overhang.
    diligencePath: Request the signed round summary, subscription documents, and post-close cap table.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue
    missingEvidence: >-
      Audited or at least management-certified current revenue run-rate, backlog conversion, and gross-margin
      disclosures.
    whyItMatters: A super-unicorn valuation is impossible to underwrite cleanly without a current economic baseline.
    diligencePath: Request monthly revenue, booked backlog, gross margin, and cash-burn reporting for 2025H2-2026YTD.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: A clean public record search on litigation, enforcement, and recall events specific to Zhisquare products.
    whyItMatters: The absence of a surfaced adverse event is not the same as proof that none exist.
    diligencePath: Run Chinese court, regulator, and product-incident searches using the legal entity name and major product aliases.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: zhsquare-specific-sam
    missingEvidence: A bottoms-up SAM showing addressable plants, lines, and budgets for Zhisquare within GBA manufacturing.
    whyItMatters: National TAM estimates do not show what Zhisquare can realistically sell into over 24-36 months.
    diligencePath: Build a bottoms-up list of target factories, automation budgets, and qualified scenarios by vertical.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: roi-benchmarks
    missingEvidence: >-
      Public deployment-specific ROI benchmarks for Chinese humanoid robots in electronics, semiconductor, or biotech
      factories.
    whyItMatters: Without realized payback, buyer readiness may be overstated.
    diligencePath: Request case-study metrics on labor savings, yield gains, uptime, and payback periods from named customers.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: budget-owners
    missingEvidence: >-
      Evidence on which exact budget owners pay for embodied robots and whether spend comes from capex, opex, or policy
      funds.
    whyItMatters: Budget source determines adoption speed and renewal durability.
    diligencePath: Interview enterprise buyers and inspect signed contracts or tender documentation.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: minor
    topic: standards-adoption-timing
    missingEvidence: A timeline linking evolving standards and insurance products to actual procurement acceleration.
    whyItMatters: Standards matter only if they reduce friction fast enough for 2026-2027 deployment cycles.
    diligencePath: Track draft-to-final standards, certification pilots, and insurer participation in deployments.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: speculative-demand-share
    missingEvidence: A quantified split between genuine commercial demand and financing-driven speculative deployment in 2026.
    whyItMatters: Valuation underwriting changes materially if customer pull is weaker than capital formation implies.
    diligencePath: Collect cohort data on pilots, repeat orders, cancellations, and self-funded versus subsidized deployments.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASPs, discounts, software attach, and service terms for Zhisquare and leading Chinese competitors.
    whyItMatters: Quote-led pricing obscures gross margin and procurement competitiveness.
    diligencePath: Collect signed customer proposals or channel quotations across major vendors.
    relatedQuestionRefs:
      - QP021
  - type: missing-source
    severity: material
    topic: repeat-production-proof
    missingEvidence: Comparable repeat-order, renewal, or multi-site expansion data across competitors.
    whyItMatters: One-time pilots and showcase orders do not prove a durable winner.
    diligencePath: Request customer cohort data and site-expansion histories from management and channel partners.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: data-mobility-and-lockin
    missingEvidence: Evidence on how portable task data and models are across robots, integrators, and customer environments.
    whyItMatters: Moat claims weaken if buyers can easily multi-home or retrain with another vendor.
    diligencePath: Interview integrators and inspect data-rights and migration clauses in customer contracts.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: buyer-bargaining-power
    missingEvidence: Evidence on how much large manufacturers capture economics versus robot vendors.
    whyItMatters: Buyer power could compress startup margins even if adoption grows.
    diligencePath: Study enterprise procurement terms, SLAs, warranty obligations, and lease structures.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: fastest-de-rating-risk
    missingEvidence: A quantified view of which peer would reset valuation benchmarks first in a commercialization downturn.
    whyItMatters: Valuation discipline depends on the first failed or repriced leader.
    diligencePath: Track late-private round terms, IPO progress, and public comp multiples for humanoid leaders.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: recognized-revenue
    missingEvidence: Recognized revenue, quarterly cadence, and backlog conversion schedule by customer and stream.
    whyItMatters: Valuation and runway cannot be judged without knowing what has actually been booked and collected.
    diligencePath: Request audited or management-certified monthly P&L, revenue recognition rules, and backlog aging.
    relatedQuestionRefs:
      - QI021
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-margin
    missingEvidence: Realized ASP, discount policy, service attach, hardware BOM, and gross margin by stream.
    whyItMatters: These are the core variables behind contribution margin and scale viability.
    diligencePath: Request price books, sample contracts, BOM analysis, and margin bridge by product line.
    relatedQuestionRefs:
      - QI022
  - type: private-evidence-only
    severity: material
    topic: primary-vs-secondary
    missingEvidence: A round summary splitting primary capital from secondary liquidity and showing post-money ownership.
    whyItMatters: A giant round can still be less supportive than it appears if a large share was secondary.
    diligencePath: Request signed financing summary, capitalization table, and shareholder secondary schedule.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, and 18-24 month runway plan.
    whyItMatters: Capital adequacy cannot be underwritten from gross proceeds alone.
    diligencePath: Request treasury report, operating plan, and downside scenario model.
    relatedQuestionRefs:
      - QI024
  - type: private-evidence-only
    severity: material
    topic: debt-and-project-finance
    missingEvidence: Debt, leases, guarantees, or project-finance obligations supporting factory scale-up.
    whyItMatters: Hidden obligations could change dilution, runway, and risk.
    diligencePath: Request complete schedule of debt, equipment leases, guarantees, and government-linked financing obligations.
    relatedQuestionRefs:
      - QI025
  - type: private-evidence-only
    severity: material
    topic: production-vs-demo-split
    missingEvidence: >-
      A module-by-module split showing which AlphaBrain / NeuroVLA components are running in production deployments
      versus demo or research mode.
    whyItMatters: Marketing and technical narration are richer than production-state disclosure.
    diligencePath: Request a product maturity matrix tied to paying deployments and version history.
    relatedQuestionRefs:
      - QE021
  - type: private-evidence-only
    severity: blocking
    topic: reliability-and-uptime
    missingEvidence: Uptime, MTBF, intervention rate, failure-recovery rate, and incident logs by scenario.
    whyItMatters: These are core go/no-go inputs for industrial deployment underwriting.
    diligencePath: Request field-performance dashboards and customer acceptance reports.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: material
    topic: subsystem-sourcing
    missingEvidence: A proprietary-versus-sourced map for actuators, sensors, batteries, compute, and critical controllers.
    whyItMatters: True differentiation and supply risk depend on which layers Zhisquare really owns.
    diligencePath: Request BOM ownership map and critical supplier list.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: blocking
    topic: safety-certification-package
    missingEvidence: Test reports, safety-case documents, emergency-stop validation, and any formal certifications already achieved.
    whyItMatters: Public architecture claims cannot substitute for safety assurance in human-robot environments.
    diligencePath: Request certification files, test protocols, and deployment site approvals.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: material
    topic: marketing-vs-field-delta
    missingEvidence: >-
      Independent third-party field studies quantifying the gap, if any, between demo performance and sustained
      production performance.
    whyItMatters: The product story risks being over-weighted toward demos without longitudinal proof.
    diligencePath: Collect third-party audits, customer references, and multi-month site results.
    relatedQuestionRefs:
      - QE025
  - type: private-evidence-only
    severity: blocking
    topic: active-paying-sites
    missingEvidence: A current list of active paying customer sites, by segment and geography, plus which ones are pilot vs production.
    whyItMatters: Without active-site data, customer-scale claims remain impressionistic.
    diligencePath: Request customer roster, deployment status, and ARR / revenue by site.
    relatedQuestionRefs:
      - QU021
  - type: private-evidence-only
    severity: blocking
    topic: pilot-vs-production-mix
    missingEvidence: A revenue-weighted split between pilot, production, and showcase demand.
    whyItMatters: It is impossible to judge traction durability when all proof items are treated as equivalent.
    diligencePath: Request revenue mix, contract stage, and customer-type segmentation.
    relatedQuestionRefs:
      - QU022
  - type: private-evidence-only
    severity: material
    topic: renewal-and-expansion-cohorts
    missingEvidence: Evidence on which named customers renewed, expanded to additional lines, or replicated to new plants.
    whyItMatters: Expansion quality is the difference between promising pilots and scalable adoption.
    diligencePath: Request cohort tables for top customers and major workflows.
    relatedQuestionRefs:
      - QU023
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: blocking
    topic: top-customer-concentration
    missingEvidence: Revenue and backlog concentration, including the share represented by HKC-linked demand.
    whyItMatters: One oversized anchor could distort both growth and risk perception.
    diligencePath: Request top-10 customer concentration schedule and downside scenario excluding the top account.
    relatedQuestionRefs:
      - QU024
  - type: missing-source
    severity: material
    topic: demo-vs-production-proof
    missingEvidence: An independent audit separating logo/demo exposure from real production usage across public references.
    whyItMatters: Conference visibility can exaggerate maturity if not separated from paying work.
    diligencePath: Gather third-party references, procurement records, and customer interviews.
    relatedQuestionRefs:
      - QU025
  - type: private-evidence-only
    severity: blocking
    topic: licenses-and-clearances
    missingEvidence: A deployment-by-deployment map of required licenses, safety approvals, and factory clearances plus current status.
    whyItMatters: The regulatory burden cannot be inferred from high-level policy texts alone.
    diligencePath: Request site approval files, safety reviews, and regulator correspondence for major deployments.
    relatedQuestionRefs:
      - QR025
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: incident-and-recall-history
    missingEvidence: Formal records of field incidents, near misses, worker injury, and any recalls or safety interventions.
    whyItMatters: A clean marketing surface is not a substitute for real incident reporting.
    diligencePath: Request internal incident logs, insurer notices, and customer safety reports.
    relatedQuestionRefs:
      - QR026
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration-share
    missingEvidence: Top-customer backlog and revenue share, including HKC-linked exposure.
    whyItMatters: Concentration is one of the most important residual risks in the public record.
    diligencePath: Request top-10 customer concentration schedules and downside cases excluding the top account.
    relatedQuestionRefs:
      - QR027
  - type: private-evidence-only
    severity: material
    topic: succession-and-bench-depth
    missingEvidence: Succession planning, key-hire retention, and org-chart depth across engineering and deployment.
    whyItMatters: Founder-centric companies can stall if leadership bandwidth becomes the bottleneck.
    diligencePath: Request org chart, retention grants, and succession documentation.
    relatedQuestionRefs:
      - QR028
  - type: private-evidence-only
    severity: blocking
    topic: valuation-break-thresholds
    missingEvidence: Specific board-defined thresholds that would trigger budget cuts, delay IPO, or force a down-round.
    whyItMatters: A fast-funded company needs explicit stress triggers, not just optimism.
    diligencePath: Request board materials, scenario models, and contingency planning documents.
    relatedQuestionRefs:
      - QR029
  - type: private-evidence-only
    severity: blocking
    topic: debt-and-obligations
    missingEvidence: Debt facilities, leases, guarantees, or state-linked obligations supporting scale-up.
    whyItMatters: Hidden obligations can magnify every other risk in the model.
    diligencePath: Request full debt, lease, guarantee, and covenant schedule.
    relatedQuestionRefs:
      - QR030
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin-package
    missingEvidence: Recognized revenue, gross margin, and backlog-conversion evidence by quarter and by stream.
    whyItMatters: A valuation call is mostly symbolic without operating economics.
    diligencePath: Request audited or management-certified financial package before underwriting price.
    relatedQuestionRefs:
      - QV025
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Cap table, preference stack, liquidation rights, and any secondaries in recent rounds.
    whyItMatters: Headline valuation can differ sharply from true entry economics.
    diligencePath: Request charter, financing summary, and investor-rights documents.
    relatedQuestionRefs:
      - QV026
  - type: private-evidence-only
    severity: material
    topic: best-anchor-comparable
    missingEvidence: A tighter comparable framework using actual private valuations or public trading comps most relevant to Zhisquare.
    whyItMatters: Current comp set is informative but still imperfect.
    diligencePath: Build a board-level comp book with exact valuation dates, terms, and business-similarity notes.
    relatedQuestionRefs:
      - QV027
    relatedTableRefs:
      - TV004
  - type: private-evidence-only
    severity: blocking
    topic: premium-justifying-milestone
    missingEvidence: The exact operating milestone package management believes justifies paying above the current mark.
    whyItMatters: Premium pricing should be tied to a milestone map, not narrative conviction alone.
    diligencePath: Request board or financing materials linking price to milestone thresholds.
    relatedQuestionRefs:
      - QV028
  - type: private-evidence-only
    severity: blocking
    topic: downside-trigger-model
    missingEvidence: A downside model showing which events would force an IPO delay, down-round, or budget reset.
    whyItMatters: Without a downside model the committee cannot size risk correctly.
    diligencePath: Request scenario model covering backlog miss, concentration shock, and financing compression.
    relatedQuestionRefs:
      - QV029
  - type: private-evidence-only
    severity: material
    topic: exit-route-readiness
    missingEvidence: Detailed IPO workplan, audit status, board committees, and alternative liquidity options.
    whyItMatters: Exit plausibility affects both hold period and pricing discipline.
    diligencePath: Request IPO readiness checklist and alternative exit analysis.
    relatedQuestionRefs:
      - QV030
