companyProfile:
  summary: Zhisquare (智平方, AI² Robotics) is a Shenzhen-based embodied-AI robotics startup founded in 2023 by Guo Yandong. Its public strategy is to build a vertically integrated productivity-robot platform in which AlphaBot hardware is defined by AlphaBrain / GOVLA / NeuroVLA model systems and iterated through real industrial scenarios in the Greater Bay Area. The company has moved unusually quickly from early financing to super-unicorn valuation while developing visible footholds in semiconductor/display, automotive, biotech, retail, and public-service workflows.
  foundedDate: '2023-04-17'
  founders:
    - name: Guo Yandong
      role: Founder and CEO
      background: Purdue PhD; former Microsoft researcher and former XPeng / OPPO AI leader, repeatedly used in company and media materials as proof of founder-market fit.
      claimRefs: [CO002, CO004, CO005]
  foundingLocation: Shenzhen, Guangdong, China
  headquarters: Shenzhen / Greater Bay Area, Guangdong, China
  productSummary: AlphaBot general-purpose robots plus AlphaBrain / GOVLA / NeuroVLA embodied-model systems aimed at industrial productivity and adjacent service scenarios.
  customerFocus: Manufacturing-first, especially semiconductor/display, automotive, biotech, and other workflow-intensive industrial settings, with selective retail and public-service adjacency.
  businessModel: Hardware-plus-deployment model with likely revenue from robot sales or leases, integration, support, and software value, but limited public disclosure on realized economics.
  stage: Super-unicorn private company
  fundingStatus: Public coverage shows a February 2026 B-round above RMB 1B and a June 2026 financing near RMB 5B that lifted valuation above RMB 20B; Hong Kong IPO preparation was later reported for as early as 2027.
  disclosureProfile: private-undisclosed
  claimRefs: [CO018, CO019, CO024, CE037, CU001, CU035]
