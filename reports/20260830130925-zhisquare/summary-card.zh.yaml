  topStrengths:
    - Zhisquare 拥有中国具身 AI 里最强的公开融资曝光度之一，包括 2026 年近 RMB 5B 融资，以及跨区域国资背景投资人支持。
    - 公司已有真实工业验证，尤其是媒体报道中 HKC 相关的 1,000+ 台机器人半导体 / 显示项目，三年规模约 RMB 500M。
    - AlphaBot 加 AlphaBrain / NeuroVLA 策略有技术差异化，对全栈具身模型架构的表述也少见地清晰。
    - 深圳和更广的大湾区，为工业机器人迭代部署提供强制造和落地生态。
  topRisks:
    - 公开收入、毛利率、现金跑道和股权结构条款仍太不透明，支撑不了高确信估值判断。
    - 客户证明有意义但仍集中；最强的点名锚定客户，披露细节远多于其他公开客户。
    - 安全、认证、可靠性和现场支持证据，明显薄于架构和融资故事。
    - 更广的人形机器人市场已经被公开描述为过热，倍数压缩或 IPO 延后风险随之上升。
    - 创始人依赖和披露不足的治理，在公司试图最快扩张时增加执行风险。
  unresolvedGaps:
    - 按季度确认的收入、毛利率、积压订单转化、烧钱速度 / 现金跑道。
    - 股权结构表、优先股堆叠、治理权，以及近期融资中新股与老股的拆分。
    - 头部客户集中度、续约行为和跨多 site 重复部署证据。
    - 安全论证文档、认证包、在线率 / MTBF 数据和事故历史。
    - IPO 准备细节，包括审计状态、董事会委员会、报告控制和替代流动性路径。
