company:
  name: Zhisquare
chapter:
  number: 6
  title: Customers
  summary: 'Zhisquare has real customer proof, not just demo visibility: the HKC-linked semiconductor/display program is a meaningful anchor, and the company has named additional biotech, semiconductor, automotive, retail, and public-service references. But the customer story is still materially under-disclosed on active paying site count, renewals, churn, and concentration, so the right conclusion is promising traction with unresolved durability risk.'
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'The reviewed public record supports a clear customer thesis: Zhisquare is primarily selling into enterprise and industrial workflows, not consumer demand. Semiconductor display manufacturing is the strongest named segment, automotive and biotech are the next most credible industrial verticals, and airport, community, and retail-service scenarios extend the product into public-facing environments. That segmentation matters because the buyer, user, and payer are different in each case. In industrial settings, the buyer is usually an operator or plant owner, the user is a line worker or supervisor, and the payer is some mix of automation, capex, or operating-improvement budget. In service scenarios, the same product may be closer to an operator opex decision. The most important conclusion is that manufacturing-first, not mass consumer adoption, remains the center of gravity for Zhisquare''s customer economics and adoption quality. That focus also makes customer diligence more legible,
    because factory buyers usually have clearer budget authority, workflow metrics, and repeat-expansion logic than purely consumer use cases.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU031
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof-and-adoption-trajectory
  title: Named Customer Proof and Adoption Trajectory
  body: 'Zhisquare has stronger public named-customer proof than many comparable robotics startups, but the proof is uneven. The standout anchor is the Shenzhen Huizhi IoT / HKC-linked program: more than 1,000 robots over three years, near RMB 500M in reported value, with workflow detail spanning warehousing, loading and unloading, assembly, testing, and OLED-related processes. That is a meaningful production-grade proof item, not a vague logo slide. Beyond HKC, the company has named Bloomage / Huaxi Biology for biotech manufacturing, Jingneng Microelectronics for semiconductor tasks, and an unnamed top international automaker for automotive manufacturing. WAIC coverage adds evidence of regular retail-style operations across 10-plus provinces and cities. The adoption path that emerges is credible: visibility, scenario validation, production deployment, then potential multi-line or multi-site expansion. The unresolved question is how many deployments actually make it through that full loop.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU010
  - CU014
  - CU013
  - CU017
  - CU020
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration
  body: 'The main customer diligence problem is not lack of any proof; it is lack of durability proof. Public sources do not disclose active site count, renewal rate, churn, NRR, GRR, or customer-satisfaction data. The clearest contract-duration evidence is only the three-year HKC-linked term. That means the best current read on expansion is logical rather than audited: one successful robot workflow should be able to spread across more lines, shifts, and plants if ROI and reliability hold. Policy support and strategic-capital signaling may also open doors, but they do not by themselves prove that end customers renew when subsidies or attention fade. Concentration risk is therefore high. When one anchor customer is much more detailed than the rest of the proof set, the right assumption is that customer mix could be much narrower than the narrative implies until management proves otherwise. That is especially important in robotics, where one flashy first customer can hide a much shallower
    installed base and a much longer route to broad fleet standardization.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU030
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-chapter-verdict
  title: Customer Chapter Verdict
  body: 'Zhisquare appears to have moved beyond pure aspiration on the customer side. The company has a real industrial anchor, multiple named vertical references, and enough workflow specificity to show that customers are not only attending demos. That is a real strength. At the same time, the customer chapter is not yet strong enough to support a low-risk scale conclusion. Public evidence still mixes production deployments, strategic partnerships, planned rollouts, and operating demonstrations. The missing pieces are classic but critical: active site count, revenue by customer, renewal behavior, churn, and top-customer concentration. Until those are disclosed, the correct view is that Zhisquare has meaningful customer traction and proof-of-use, but the durability and diversification of that traction remain key underwriting unknowns. A disciplined investor should therefore treat customer quality as a prove-it-again area in management diligence rather than as a solved question.'
  claimRefs:
  - CU032
  - CU033
  - CU034
  - CU035
