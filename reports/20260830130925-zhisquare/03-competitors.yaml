  - - Unitree H2
    - US$29,900 list, tax and shipping excluded
    - Humanoid body with stated hardware specs
    - Realized services and enterprise customization
    - Transparent headline price can anchor buyer expectations.
  - - LimX
    - Undisclosed / likely quote-led
    - Humanoid hardware plus embodied OS / VLA messaging
    - List price, services, fleet software pricing
    - Competitive pressure may depend on bundled software.
  - - UBTech
    - Undisclosed / enterprise sales-led
    - Humanoid service, education, elderly-care solutions
    - Industrial pricing and realized margins
    - Breadth may help packaging but obscures comparability.
  - - Boston Dynamics Atlas
    - Undisclosed / enterprise sales-led
    - Atlas robot plus Orbit and workflow integrations
    - Robot lease/purchase price and support economics
    - Value proposition may rest on enterprise ROI not sticker price.
  - - Tesla Optimus
    - Undisclosed / not yet fully commercial
    - General-purpose humanoid under development
    - Commercial price, deployment terms, support model
    - Future price aggression could compress sector margins.
