            body: >-
              公开对比并不均衡，而这种不均衡本身就有信息量。Unitree 用 US$29,900 的 H2 给买方提供了最清楚的标价锚点，同时披露自由度、扭矩和算力等硬件细节。Boston Dynamics 披露 Atlas
              的运行特征、企业集成，以及与 Hyundai 的客户测试路径。Tesla 几乎不披露产品层面的购买细节，但 SEC 文件清楚表明，Optimus 正在一个巨大的工业和 AI
              基础设施机器内部获得资金支持。Zhisquare 介于这些模式之间。借助 AlphaBrain 和 NeuroVLA，它的公开 AI
              叙事强于许多同行；它披露的具名工业订单，也强于许多创业公司的公开证明。但它在价格上仍以报价为主，毛利率、积压订单转收入和合同结构都不透明。对买方而言，选择不只是看谁的机器人最好，也要看谁的证明足够清晰、能支撑采购，以及谁能扛过这个赛道的资本强度。
