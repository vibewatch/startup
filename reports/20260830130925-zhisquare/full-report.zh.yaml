      - number: '8.2'
        title: 当前价格语境与可比公司纪律
        blocks:
          - type: paragraph
            body: >-
              估值超过 RMB 20B，且刚完成接近 RMB 5B 的融资后，Zhisquare
              已经不再按一家有前景创业公司定价。它被定价成一个很可能的未来领导者。这不意味着估值标记一定错误，但意味着证明负担很高。可比公司集合强化的是纪律，而不是确定性。Unitree 用公开硬件定价和据报道的 IPO
              进展提供透明度。LimX 是一个快速推进的本土全栈同行，CNBC 报道中披露了定价。UBTech 提供治理可见的上市机器人参照。Boston Dynamics 展示企业级部署成熟度的样子。Tesla
              则是规模标杆，也暴露出长期游戏可能有多高资本强度。没有一家是完美可比公司，但它们合在一起传递同一件事：Zhisquare
              值得严肃关注，但当前估值要求投资人在公开记录还没充分解释经济性之前先付高价。正因如此，委员会应把可比公司当作三角定位工具，而不是精确计算的虚假邀请。一个可比公司给透明度，另一个给规模，另一个给企业成熟度；它们的重叠部分才是关键信号：Zhisquare
              当前定价已经假设若干难事会按顺序做成。
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV037
