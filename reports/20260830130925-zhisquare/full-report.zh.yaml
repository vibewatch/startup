      - number: '8.4'
        title: 建议
        blocks:
          - type: paragraph
            body: >-
              建议立场是观察 / 继续研究，置信度中等，风险高。这不是否定公司。Zhisquare
              拥有真实战略相关性、同类公司里更强的公开工业证明之一；如果运营证据快速追上，仍有明确上行空间。问题在价格和可见度。公开来源仍未披露收入包、毛利率轮廓、股权结构表、优先股堆叠、集中度明细或退出机制，无法支撑在当前
              headline
              估值下激进投入新钱。纪律严明的投资人可以贴近公司，定义基于里程碑的进入条件，并在公司拿出缺失证明时准备行动。在此之前，最合适的判断是：估值偏高，选择权真实，尽调负担仍未解决。新钱投资人应坚持让运营证据，而不是市场兴奋，决定下一步定价。
