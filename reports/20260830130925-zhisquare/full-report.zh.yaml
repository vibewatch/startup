      - number: '2.3'
        title: 增长驱动、约束与采用张力
        blocks:
          - type: paragraph
            body: >-
              这个赛道罕见地同时具备很强的自上而下和自下而上驱动。自上而下看，深圳目标到 2027 年培育 10 家以上 RMB-10B 级具身机器人企业、20 家以上 RMB-1B 营收企业、50
              个以上十亿元级应用场景，并形成 RMB 100 billion 以上本地集群。MIIT 和 SASAC 则在 2026 年瞄准 100 个以上高价值场景，以及万台级部署能力。自下而上看，Zhisquare
              现在通过与 HKC
              相关的订单，在半导体显示制造里拿到了具名证据；更广泛的行业报道也说明，真正的启动区是工厂，而不是消费者家庭。但采用摩擦仍然真实存在。标准仍在制定，认证框架仍在演进，出货增长和融资总额也都不能证明工作流层面的
              ROI。反向市场解读是：公开估值和创业公司数量，已经跑在单位经济和稳定客户预算的硬证据前面。决定性证明会是反复出现的、由企业自掏腰包的订单，并且这些订单在最初的政策推动或试点光环消退后仍能延续。
