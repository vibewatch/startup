      - number: '1.2'
        title: 产品足迹与早期商业表面
        blocks:
          - type: paragraph
            body: >-
              非融资证据里最强的一点，是 Zhisquare 有一条连贯的产品故事，而且已经把故事推入真实用例。官方材料以 AlphaBot 硬件为中心，硬件由 AlphaBrain / AI2R Brain
              模型栈定义；随后，公司又通过产品发布、会议演示和面向具体场景的合作，把叙事铺开。到 2025 年 4 月 AlphaBot 2
              发布时，公司已经把汽车、半导体和生物技术制造列为核心工业三角，同时宣布计划延伸到机场和社区服务。2024 WRC 文章和 2026 WAIC
              报道显示，公司参加公共活动不只是做品牌曝光，也在定义能力边界。这仍不能证明它已经拥有可持续的量产经济性，但确实说明公司具备一套整合的产品语言、具名机身形态，以及反复被描述的面向客户部署目标，而不只是研究论文叙事。
