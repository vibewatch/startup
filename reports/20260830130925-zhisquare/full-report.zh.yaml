      - number: '6.4'
        title: 客户章节结论
        blocks:
          - type: paragraph
            body: >-
              Zhisquare 在客户侧看起来已经越过纯愿景阶段。公司有一个真实工业锚点、多个具名垂直参考，也有足够具体的工作流，说明客户不只是来观看
              demo。这是真实优势。与此同时，客户章节还不足以支撑低风险规模化结论。公开证据仍混合着生产部署、战略合作、计划 rollout
              和运营演示。缺失项经典但关键：活跃站点数、按客户拆分收入、续约行为、流失和头部客户集中度。在这些数据披露前，正确看法是 Zhisquare
              拥有有意义的客户牵引和使用证明，但牵引的耐久性和多元化仍是关键承销未知数。因此，纪律严明的投资人应把客户质量视为管理层尽调中需要“再次证明”的领域，而不是已经解决的问题。
            claimRefs:
              - CU032
              - CU033
              - CU034
              - CU035
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 主要风险簇
        blocks:
          - type: paragraph
            body: >-
              Zhisquare 的公开风险表面不同寻常，因为公司同时处在极高估值、极快融资、早期但真实的工业部署，以及仍然稀薄的运营披露交叉点上。这带来四组主要风险。第一，安全和监管风险：人形机器人部署标准仍在变化，MIIT
              明确强调安全控制、评估和生命周期管理。第二，集中度和执行风险：HKC 相关锚点是强证明，但细节远多于其他客户证据，比例过重。第三，资本市场风险：公司在一个被乐观观察者也形容为可能在 2027-2028
              年洗牌的赛道里，估值已经快速上调。第四，治理和人员风险：公开身份围绕创始人展开，而董事会和高管梯队深度披露不足。真正重要的是相互作用。如果一家高速机器人公司披露了更干净的单位经济，类似估值风险可能更容易被解释；如果一家增长更慢但审计更充分的工业公司面对安全和集中度问题，估值受损可能较小。Zhisquare
              今天既没有那么长的审计记录，也没有公开毛利透明度，所以不能把这些风险彼此割裂来看。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
              - CR025
