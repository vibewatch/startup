      - number: '3.4'
        title: 竞争底线判断
        blocks:
          - type: paragraph
            body: >-
              综合来看，按资本信号和叙事野心，Zhisquare 属于中国具身智能竞争者的第一梯队；但按商业化证明，它还不是公开记录里最干净的领导者。如果委员会最看重价格透明度和可见硬件商业化，Unitree
              领先。如果最看重工业企业级包装和已发布的性能特征，Boston Dynamics 目前更成熟。如果最看重压倒性的资产负债表实力，Tesla 无可匹敌。Zhisquare
              的差异化道路，是一个中国工业冠军逻辑：强机器人“大脑”叙事、有分量的国资和战略资本联盟，以及至少一个大型具名工业订单。这个竞争起点很有吸引力，但仍需要更广分销、更清晰经济性，以及证明客户留下来是因为性能，而不是新鲜感或政策势能。下一个决定性竞争数据点，将是多地点重复部署，能证明买方粘性，而不是一次性的展示胜利。
            claimRefs:
