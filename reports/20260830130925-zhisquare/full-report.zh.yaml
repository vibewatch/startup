      - number: '8.3'
        title: 情景视角与改变建议的因素
        blocks:
          - type: paragraph
            body: >-
              基准情景不是崩盘，而是谨慎推进。Zhisquare 可以继续把工业可信度转成更广部署，继续吸引资本，并走向 IPO
              窗口。但若要在今天价格上显著改善投资判断，公司需要的不只是动能。它需要首个锚点之外的重复部署、更分散的客户，以及经审计或至少达到管理层级别的收入、毛利率和集中度证据。这些才是能支撑溢价进入、而不是旁观等待的里程碑。因此，乐观情景由里程碑和运营驱动。悲观情景不是具身智能消失，而是一张强订单和强融资观感，在赛道遭遇第一次真正修正、或
              IPO 准备要求比当前叙事更干净的数字时，被证明并不够用。
            claimRefs:
              - CV028
              - CV029
              - CV030
