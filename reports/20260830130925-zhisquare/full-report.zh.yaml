      - number: '2.2'
        title: 买方、细分场景与大湾区适配性
        blocks:
          - type: paragraph
            body: >-
              买方地图比一个原始 TAM 数字更清楚。制造业是第一个严肃的钱包。MIIT 2026
              年真实场景训练通知，实际上给出了企业买方采购和降低具身机器人风险的蓝图：开放真实场景，和机器人厂商、供应商组建联合体，改造环境，在近似生产条件下训练，验证安全性和经济性，然后才进入常规部署。这套流程与大湾区优势匹配。深圳修订后的行动计划，明确要围绕核心部件、AI
              芯片、测试、开放数据、制造和应用场景，打造密集的具身机器人集群；Foxconn 在 GTC 的披露也显示，大型电子制造商已经围绕物理 AI、混合机器人和智能工厂工作流布局。具体到
              Zhisquare，汽车、半导体、生物科技、机场和社区场景的列表说明它走的是多细分策略，但短期最深的适配点仍在工业环境：预算负责人已经购买自动化，可重新编程劳动力也能抵消用工短缺、柔性需求或质量约束。
