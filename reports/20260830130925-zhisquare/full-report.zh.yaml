      - number: '1.3'
        title: 资本联盟与估值跃迁
        blocks:
          - type: paragraph
            body: >-
              Zhisquare 画像发生跃迁，来自资本形成。2025 年官方公告显示，公司已经以 Pre-A 和 Pre-A+ 轮快速融资，用于模型迭代和商业化。随后外部报道陡然提速：2025 年 A 系列融资、2026 年
              2 月据报超过 RMB 1B 的 B 轮，以及 2026 年 6 月接近 RMB 5B 的融资；多家媒体称这轮把估值推高到 RMB 20B 以上。6 月融资团的重要性不只在规模，也在构成。Tencent News
              描述的资本名单覆盖国家级战略基金、广东和深圳政策载体、保险资金、产业方、券商和财务投资人。正因如此，外部观察者更愿意把 Zhisquare
              看作具身智能的区域乃至国家级旗手，而不是又一家拿了风险投资的机器人实验公司。2026 年 8 月 36Kr 报道又叠加了下一层叙事：公司据称启动股改并筹备香港 IPO，等于把 Zhisquare
              从高速融资的私营公司，推成近期开启资本市场故事的标的。
