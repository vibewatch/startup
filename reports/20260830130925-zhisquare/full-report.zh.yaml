      - number: '1.4'
        title: 事实底座、信号强度与未解缺口
        blocks:
          - type: paragraph
            body: >-
              总体看，已审阅证据足以让后文把几件事当作事实底座：Zhisquare 是真实公司，总部在深圳，创立于 2023 年，由郭彦东主导，正在讲一个全栈机器人“大脑”加硬件的故事，并且到 2026
              年中已经获得超级独角兽级融资。记录也足以说明商业化并非纯愿景。与 HKC 相关的订单据报接近 RMB 500M、三年交付 1,000
              多台机器人，给公司至少一个具名工业锚点，也给出行业里更清楚的规模化证明之一。与此同时，多项尽调关键问题仍未解决。已审阅公开来源没有看到经审计收入、ARR、当前员工数、正式董事会名单，也没有看到 2026 年 6
              月融资后的精确股权结构表。因此，公司进入后文时，是一个高度可读的战略叙事，拥有有意义的产品和资本证明，但仍带着会影响承销、治理和下行情景分析的重大披露缺口。
