    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与真正可见的部分
        blocks:
          - type: paragraph
            body: >-
              Zhisquare 的公开商业故事，在机制层面很清楚，在已实现经济性层面并不清楚。公司卖的不只是一具机器人身体：官方页面、发布材料和 WRC
              画像都持续暗示，一个完整包会包括具身硬件、机器人“大脑”栈、部署到客户工作流，以及持续运营支持。这意味着收入很可能来自硬件销售或租赁、集成工作、软件 /
              机队价值和部署后服务的某种组合。然而，保留下来的公开记录没有披露确认收入、ARR、ASP、毛利率，也没有披露这些元素的 attach rate。一个重要例外是商业需求证明：与 HKC
              相关的订单给出了一个规模不小的具名积压订单信号，但即便如此，它也更适合理解为订单证明，而不是确认收入证明。换句话说，商业模式可读，利润表不可读。
