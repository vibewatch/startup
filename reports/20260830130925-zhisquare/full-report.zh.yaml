      - number: '2.4'
        title: 市场底线判断
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个强但克制的市场结论。Zhisquare
              所处的是一个真实且快速扩张的中国人形机器人与具身智能市场；粤港澳大湾区拥有制造、供应商和地方政策支持的高密度组合，是中国最适合把市场叙事转成部署的地区之一。今天证据最扎实的需求，来自工业工作流：买方可以用劳动力替代、产能吞吐或质量改善来证明支出合理。服务类相邻场景在战略上重要，但货币化证据还没那么充分。尽调里最大的市场问题，不是中国是否在投资这个品类——答案显然是肯定的——而是
              2026 年需求里有多少由补贴辅助，哪些买方预算能在没有政策支持时续上，以及标准和 ROI 证据要多快成熟，才能支撑规模化采用。
