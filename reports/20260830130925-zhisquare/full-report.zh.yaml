      - number: '7.3'
        title: 缓释、监控与否决标准
        blocks:
          - type: paragraph
            body: >-
              正确的承销姿态不是把 Zhisquare 视为不可投，而是定义哪些证据能降低风险，哪些事件会击穿逻辑。去风险证据包括正式安全和认证映射、超越首个锚点的多地点重复部署、披露现金和烧钱指标、更广客户基础，以及 IPO
              准备推进时更清晰的治理。反过来，几类事件应被视为否决标准：旗舰站点发生重大安全事故或召回，积压订单明显无法转成重复生产部署，或 2026
              年融资激增后出现可见资本市场压力。这些是可衡量阈值，不是感觉。只要发生其中任何一项，当前超级独角兽叙事都需要大幅修正，因为眼下案例很大一部分押注在未来运营证明追上当前资本信心。本章因此建议，像盯运营里程碑一样盯证据节奏。如果管理层仍依赖宏大的战略叙事，而具体风险指标持续不披露，这本身就应被视为警讯，而不是中性的“没有数据”。实践中，这意味着要求月度部署里程碑复盘、事故报告、集中度
              dashboard 和融资应急计划，而不是等待年度叙事更新。公司扩张这么快，如果运营地基真的像资本故事暗示的那样强，就应该能拿出这些材料。
