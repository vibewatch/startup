              客户尽调的主要问题不是没有任何证明，而是缺少耐久性证明。公开来源没有披露活跃站点数、续约率、流失、NRR、GRR 或客户满意度数据。最清楚的合同期限证据，也只有 HKC
              相关项目三年期。这意味着，当前对扩张的最佳判断仍是逻辑推断，而不是审计事实：如果 ROI
              和可靠性站得住，一个成功的机器人工作流应当能扩散到更多产线、班次和工厂。政策支持和战略资本信号也可能打开入口，但它们本身不能证明终端客户会在补贴或关注退潮后续约。因此，集中度风险很高。当一个锚点客户比其他证明集细节丰富得多时，合理假设应是：在管理层证明之前，客户组合可能比叙事暗示的窄得多。这在机器人行业尤其重要，因为一个耀眼的首个客户，可能遮住浅得多的装机基础，以及通往大范围机队标准化更长的路。
            claimRefs:
