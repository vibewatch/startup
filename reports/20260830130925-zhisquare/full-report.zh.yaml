  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Zhisquare 的投资逻辑很容易讲清楚。中国正在加速采用人形机器人和具身智能，粤港澳大湾区是全球最适合把这种采用转化为真实工作流部署的制造集群之一，而 Zhisquare
              围绕机器人“大脑”主导的产品故事，组建了一支异常强的资本联盟。这个组合可能让它成为工业具身智能里的国家冠军式赢家。反向逻辑同样清楚：公开估值扩张快于公开财务披露，客户证明基础仍然集中，整个赛道也被广泛描述为过热。换句话说，Zhisquare
              完全可能在战略上变得非同寻常，同时以当前私募估值来看却不是一笔风险调整后划算的买入。价格敏感性就是本建议的核心。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV038
