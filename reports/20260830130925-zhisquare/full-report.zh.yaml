      - number: '3.3'
        title: 护城河耐久性与 Zhisquare 真正取胜的位置
        blocks:
          - type: paragraph
            body: >-
              Zhisquare 真正的竞争论点，在政治、资本和模型野心交汇处最强。公司看起来与中国当前产业政策方向高度一致，而且对一家 2023
              年创立的私营机器人创业公司来说，融资能力异常强。这有助于它招人、建设产能、赢得关注，并可能拿到试点入口。问题在于，这些优势能否滚成可持续护城河。公开证据还没有证明。Unitree
              可能用透明定价和可见商业化给整个品类施压。LimX 正在软件和开源定位上快速推进。UBTech 提供公开市场治理可见度。Boston Dynamics
              展示了当企业级就绪度把集成和可靠性放在前台时应是什么样子。Tesla 仍是长周期的生存性威胁，因为它能把真实世界 AI、资本开支和制造能力结合到别人难以匹敌的规模。若 Zhisquare
              的机器人“大脑”栈能转化为实质更好的部署表现，或更快的工业扩张，它仍然能赢；但这个优势目前仍是承销问题，不是公开事实。
