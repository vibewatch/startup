            body: >-
              从财务角度看，Zhisquare
              像是一家拥有顶级融资渠道和有意义早期商业信号的公司，但基本面距离可公开承销仍差得很远。这个结论不是看空业务本身，而是在评价披露质量。委员会可以合理推断，公司正在建设真实的硬件加部署业务，有足够资本支持继续推进，也存在具名工业需求。但委员会还不能推断确认收入是否已具规模、毛利率能否在规模化后转正、客户集中度是否可控，或下一阶段增长是否需要比
              headline 轮次规模暗示的更多资本。据报道的香港 IPO 准备最终可能迫使更干净的指标浮出水面；在此之前，审慎判断应是：Zhisquare
              的资本结构令人印象深刻，商业证明有希望，财务内部情况仍是最大的尽调阻塞点。在经审计收入、毛利率和现金指标出现之前，融资规模应被视为喘息空间，而不是运营质量证明。
