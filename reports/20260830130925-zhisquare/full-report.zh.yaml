      - number: '7.2'
        title: 这些风险为什么有经济意义
        blocks:
          - type: paragraph
            body: >-
              这些风险并不抽象。安全控制或认证缺口会拖慢部署，集中度问题会让收入看起来比实际更强，规模化失误会通过返工和服务负担侵蚀毛利，IPO 撤回或 down round
              会重定价整个融资故事。由于公开收入、毛利和烧钱速度仍不透明，外部投资人更缺少硬数字来抵消这些下行路径。这意味着风险传导异常直接：运营证明一旦走弱，资本信心可能迅速走弱；资本信心一旦走弱，估值耐久性立刻成问题。Zhisquare
              确实有缓释因素：深厚的本地制造生态、国资支持的资本渠道，以及如果旗舰部署成功转化就可能滚起复利的场景化学习闭环。但这些缓释因素只能降低、不能取消硬运营证据的必要性。经济传导之所以严重，还有另一个原因：机器人失败往往会在多个维度同时变贵。一次部署可能错过运营目标、需要更多现场工程师、制造客户不满，并吃掉稀缺管理层注意力，而这些都发生在确认收入追上来之前。在资本充裕阶段，这些问题可以被覆盖一阵子；但一旦公开或私募市场收紧，同样的问题就会迫使估值快速重定价。
            claimRefs:
              - CR003
              - CR011
              - CR012
              - CR034
              - CR035
              - CR036
