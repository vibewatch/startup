      - number: '5.4'
        title: 信任、安全与产品技术结论
        blocks:
          - type: paragraph
            body: >-
              产品技术尽调中最尖锐的缺口不是想象力，而是信任证据。MIIT 2026
              年部署行动和标准工作清楚表明，碰撞检测、力限制、急停行为、黑箱功能、接口、生命周期管理和评估标准，都正在成为真实人形机器人部署的常规要求。但已审阅的 Zhisquare
              公开表面，没有完整回答认证、可靠性指标、事故历史、SLA 设计或正式安全论证。公司未必缺少这些控制；问题在于，公开证据里的架构故事明显跑在信任和运营故事前面。因此，正确的产品结论应当更有层次：Zhisquare
              展示了中国具身智能里更丰富的架构叙事之一，也有很强的多场景部署野心；但谨慎投资人要把这个技术栈视为充分去风险化之前，还需要远多于现在的公开或私下证明，尤其是可靠性、合规和现场支持成熟度。严肃尽调应把该技术栈视为有前景但尚未完全工业化，直到公司拿出硬可靠性和认证证据。
