        - 削弱治理和估值支撑
        - 不要承销溢价入场。
      - - 降价轮或 IPO 撤回
        - 资本市场信号反转
        - 削弱估值和资本通道两大支柱
        - 重置可比组和下行情景。
      - - 安全或质量事件
        - 重大事故、召回或监管挫折
        - 直接削弱部署逻辑
        - 事实清楚前完全暂停。
      - - 同行重估潮
        - 可比龙头估值大幅下修
        - 削弱行业倍数支撑
        - 立即采用更低入场纪律。
