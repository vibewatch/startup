  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              要夸大 Zhisquare 的机会，最容易的做法是把它称为机器人公司，然后把整个自动化或 AI 市场都算进来。已审阅证据支持更窄、也更有用的边界：Zhisquare
              卖入的是具身工作流，买方需要可重新编程的机器人身体、机器人“大脑”栈、集成和持续服务，才能在真实运营环境里替代或增强劳动力。这个边界排除了大量固定功能自动化和纯软件
              AI。在这个更窄的范围内，公开估算仍有参考意义。CNBC 引述 Morgan Stanley 估计，中国人形机器人市场 2026 年为 $2 billion，到 2030 年为 $15
              billion；TrendForce 则称中国进入关键商业化阶段时，已经是全球最大的人形机器人市场。这些估算更适合作为方向性的 TAM 视角，而不是精确的 Zhisquare
              承销输入，因为它们仍是全国性、外部销售口径的观点，不是从买方预算自下而上搭出来的模型。
