        title: 资本历史与前瞻充足性
        blocks:
          - type: paragraph
            body: >-
              如果说收入表面很薄，资本表面则正好相反。Zhisquare 的融资节奏从 2025 年官方 Pre-A 和 Pre-A+ 公告，提速到 2026 年 2 月超过 RMB 1B 的 B 轮，再到 2026 年 6
              月接近 RMB 5B 的融资，并把估值推高到 RMB 20B
              以上。公开报道和公司表述显示，这些资金用于支持商业化、量产、机器人“大脑”研发和更广泛的工业落地。这是一份非同寻常的融资履历，也明显降低了短期出现简单流动性危机的概率。但承销边界同样显而易见：总融资额不等于可用现金。公开来源没有披露新股和老股交易拆分、交割后现金余额、受限现金、计划烧钱速度，或与工厂建设绑定的融资承诺。因此，正确结论不是“资金充足性已经解决”，而是
              Zhisquare 为自己买到了时间和选择权，却没有买来公开透明度。
