  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争类别
        blocks:
          - type: paragraph
            body: >-
              Zhisquare
              面对的不是一家公司对另一家公司那种简单赛道。竞争场覆盖中国全栈创业公司、拥有相邻机器人业务的上市公司、全球工业自动化龙头，以及人工劳动力加任务专用自动化的现状。最直接的同行，是试图把机器人身体、自研大脑和工业部署故事结合起来的中国具身智能公司。Unitree
              和 LimX 尤其相关，因为它们把中国本土产品速度与可见商业化信号放在一起；UBTech 则作为治理更可见的本土上市公司而重要。Boston Dynamics 和 Tesla
              是两个最重要的全球参照点：Boston 已经在销售企业级人形机器人叙事，并发布了工业规格；Tesla 的资产负债表和 AI
              基础设施，则意味着它能承受任何创业公司都难以匹配的迭代成本。在这个背景下，Zhisquare 最突出的仍是资本信号和机器人“大脑”定位，还不是公开证明过的规模领先。
