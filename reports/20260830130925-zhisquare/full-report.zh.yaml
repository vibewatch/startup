          note: 10+ 个省市；图表采用下限。
        - label: 每日饮品杯数声明
          value: 100
          note: 声称每天数百杯；图表保守采用 100 下限。
        - label: 公开可见的多年期合同数
          value: 1
          note: 所审阅来源中，只有 HKC 锚定客户明确显示合同期限。
    claimRefs:
      - CU006
      - CU007
      - CU017
      - CU018
      - CU024
    approximationNotes: 多根柱采用下限，因为公开披露使用的是 1,000+、10+ 这类表述，而不是精确数量。
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险最高的环节是安全 / 合规披露、客户集中、规模化执行和估值依赖。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 安全 / 合规
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 客户集中
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 制造规模化
          values:
            - 中-高
            - 高
            - 中
            - 高
        - label: 融资 / 泡沫风险
          values:
            - 中-高
            - 高
            - 中
            - 高
        - label: 创始人 / 治理
          values:
            - 中
            - 高
            - 中-低
            - 中-高
    claimRefs:
      - CR006
      - CR010
      - CR012
      - CR002
      - CR015
    approximationNotes: 序数单元格反映已留存的公开记录，而不是统计损失模型。
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 最重要的风险会传导至客户采用、收入质量、融资信心和估值。
    data:
      nodes:
        - id: safety
          label: 安全 / 合规缺口
        - id: concentration
          label: 客户集中
        - id: scale
          label: 规模化执行
        - id: bubble
          label: 泡沫 / 融资风险
        - id: revenue
          label: 收入质量
        - id: funding
          label: 融资信心
        - id: valuation
          label: 估值韧性
      edges:
        - from: safety
          to: revenue
          label: 延缓部署
        - from: concentration
          to: revenue
          label: 加大波动
        - from: scale
          to: revenue
          label: 削弱交付
        - from: bubble
          to: funding
          label: 压缩资本
        - from: revenue
          to: funding
          label: 验证或证伪经济性
        - from: funding
          to: valuation
          label: 支撑估值
        - from: revenue
          to: valuation
          label: 支撑估值
    claimRefs:
      - CR011
      - CR034
      - CR037
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: Zhisquare 同时依赖政策资本、旗舰客户、监管进展和运营成熟。
    data:
      nodes:
        - id: policy
          label: 政策支持资本
        - id: customers
          label: 旗舰客户
        - id: reg
          label: 监管标准
        - id: ops
          label: 制造 + 现场运营
        - id: founder
          label: 创始人 / 领导层
        - id: zh
          label: Zhisquare 投资逻辑
      edges:
        - from: policy
          to: zh
          label: 为规模化供血
        - from: customers
          to: zh
          label: 证明需求
        - from: reg
          to: customers
          label: 允许部署
        - from: ops
          to: customers
          label: 交付可靠性
        - from: founder
          to: ops
          label: 推动执行
        - from: founder
          to: zh
          label: 锚定叙事
    claimRefs:
      - CR001
      - CR010
      - CR004
      - CR012
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 委员会决策应从真实客户验证和市场顺风出发，穿过经济性缺口与泡沫背景，落到价格敏感的观察立场。
    data:
      nodes:
        - label: 市场顺风
          detail: 中国人形机器人需求和政策支持都是真实的
          claimRefs:
            - CV007
        - label: 客户验证
          detail: HKC 相关工业锚定客户有分量
          claimRefs:
            - CV006
        - label: 资本实力
          detail: Zhisquare 融资通道不同寻常
          claimRefs:
            - CV005
        - label: 经济性缺口
          detail: 收入、利润率和客户集中度披露仍不足
          claimRefs:
            - CV009
        - label: 泡沫背景
          detail: 行业回调风险已被广泛提示
          claimRefs:
            - CV010
        - label: 观察 / 继续研究
          detail: 当前价格需要更多验证
          claimRefs:
            - CV022
            - CV025
            - CV039
            - CV040
      edges:
        - from: Market tailwind
          to: Track / research more
        - from: Customer proof
          to: Track / research more
        - from: Capital strength
          to: Track / research more
        - from: Economics gap
          to: Track / research more
        - from: Bubble context
          to: Track / research more
    claimRefs:
      - CV022
      - CV025
      - CV038
    approximationNotes: 这条流程说明，立场并非看空公司，而是在当前估值标记下保持怀疑。
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最大的敏感项不是市场规模，而是证据质量：客户多元化和已披露经济性，对公允价值信心的影响大于叙事动能。
    data:
      items:
        - label: 重复部署广度
          value: 9
          note: 最重要的上行驱动因素。
        - label: 收入 + 利润率披露
          value: 9
          note: 最重要的估值支撑驱动因素。
        - label: 客户集中度
          value: 8
          note: 客户集中会迅速压低公允价值。
        - label: IPO 准备度
          value: 7
          note: 影响流动性和治理溢价。
        - label: 行业倍数 / 泡沫压力
          value: 8
          note: 外部情绪会迅速重置估值标记。
    claimRefs:
      - CV032
      - CV036
      - CV034
      - CV010
    approximationNotes: 柱形为 1-10 的序数敏感性评分，不是统计弹性。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 核心经济性缺失，公开证据只能支撑宽估值区间，而不是精确目标价。
    data:
      items:
        - label: 悲观当前价值视角
          low: 8
          mid: 10
          high: 12
          unit: RMB Bn
          detail: 假设估值向最近明确引用的较低估值区间回调，并叠加客户集中折价。
        - label: 基准当前价值视角
          low: 12
          mid: 16
          high: 20
          unit: RMB Bn
          detail: 假设真实牵引力存在，但透明度仍低，并因资本通道获得一定溢价。
        - label: 乐观当前价值视角
          low: 20
          mid: 24
          high: 30
          unit: RMB Bn
          detail: 假设重复部署、客户更广，以及 IPO 级披露逐步出现。
    claimRefs:
      - CV001
      - CV028
      - CV029
      - CV030
    approximationNotes: 这个区间是克制的情景视角，不是基于审计财务的模型估值结果。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Zhisquare 在市场和战略相关性上得分高，验证程度中等，公开经济性可见度低。
    data:
      items:
        - label: 市场顺风
          value: high
          detail: 政策和出货动能是真实的。
        - label: 战略资本支持
          value: very high
          detail: 融资通道非常突出。
        - label: 客户验证
          value: medium-high
          detail: HKC 锚定客户很强，但集中度仍在。
        - label: 公开经济性可见度
          value: low
          detail: 缺少收入、利润率、烧钱速度和稀释数据。
        - label: 当前估值吸引力
          value: low
          detail: 相比公开基本面，当前估值标记显得偏高。
    claimRefs:
      - CV007
      - CV005
      - CV006
      - CV009
      - CV025
