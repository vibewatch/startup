companyProfile:
  summary: >-
    Zhisquare（智平方，AI² Robotics）是一家总部位于深圳的具身智能机器人创业公司，2023 年由郭彦东创立。它的公开策略，是搭建一个纵向一体化的生产力机器人平台：AlphaBot 硬件由 AlphaBrain /
    GOVLA / NeuroVLA 模型系统定义，再借助粤港澳大湾区的真实工业场景持续迭代。公司从早期融资走到超级独角兽估值的速度异常快，同时已在半导体 / 显示、汽车、生物科技、零售和公共服务工作流里露出可见落点。
