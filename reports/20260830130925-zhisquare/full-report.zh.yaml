  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创始人与运营边界
        blocks:
          - type: paragraph
            body: >-
              从已审阅的公开记录看，Zhisquare 不是隐身实验室，也不是概念模糊的品牌。公司官方英文和中文页面把 AI² Robotics / 智平方描述为一家 AGI-native 通用机器人公司，2023 年 4
              月创立，目标是把具身智能从数字世界带入物理工作流。法律身份线索也支撑这套叙事：第三方登记类页面列出深圳主体成立于 2023-04-17；公司 2025 年 5
              月发布的反冒名声明，则给出了深圳南山的具体注册地址和经营地址、北京办公室以及官方渠道。公开材料里的领导层高度围绕创始人展开。郭彦东是清晰可见的经营者和发言人，公司反复强调他的 Microsoft、XPeng 和
              OPPO 背景，证明自己能够把原创 AI 工作与大规模智能终端产品化结合起来。因此，公开侧面对身份、使命和创始人可信度的支撑很强，但对更广泛的高管梯队和正式治理机制仍然薄弱。
