- id: drivers-constraints-and-adoption-tension
  title: Growth Drivers, Constraints, and Adoption Tension
  body: The sector has unusually strong top-down and bottom-up drivers at the same time. On the top-down side, Shenzhen is targeting more than 10 RMB-10B embodied-robot companies, more than 20 RMB-1B revenue companies, 50+ billion-yuan-class application scenarios, and a RMB 100 billion-plus local cluster by 2027. MIIT and SASAC are targeting 100-plus high-value scenarios and 10,000-unit-scale deployment capability in 2026. On the bottom-up side, named Zhisquare evidence now exists in semiconductor-display manufacturing via the HKC-linked order, and broader industry coverage shows that factories rather than consumer households are the practical launch zone. But adoption friction remains real. Standards are still being written, certification frameworks are still evolving, and neither shipment growth nor funding totals prove workflow-level ROI. The adverse market read is that public valuations and startup counts are running ahead of hard proof on unit economics and steady customer budgets.
    The decisive proof would be repeated self-funded enterprise orders that continue even after the initial policy push or pilot spotlight fades.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM027
  - CM015
