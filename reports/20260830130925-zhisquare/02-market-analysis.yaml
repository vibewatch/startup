- id: bottom-line-market-view
  title: Bottom-Line Market View
  body: The public evidence supports a strong but disciplined market conclusion. Zhisquare is positioned in a real and fast-expanding Chinese humanoid and embodied-AI market, and the Greater Bay Area is one of the best places in China to convert that market from narrative into deployment because of its density of manufacturing, suppliers, and local policy support. The best-supported demand today sits in industrial workflows where buyers can justify spending through labor substitution, throughput, or quality improvement. Service adjacencies matter strategically but are not yet as well monetized. For diligence, the biggest remaining market questions are not whether China is investing in the category — clearly it is — but how much of 2026 demand is subsidy-assisted, which buyer budgets renew without policy support, and how quickly standards and ROI evidence mature enough to sustain scaled adoption.
  claimRefs:
  - CM007
  - CM006
  - CM025
  - CM024
  - CM035
  - CM034
  - CM039
