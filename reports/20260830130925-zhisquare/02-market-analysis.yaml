- id: buyers-segments-and-gba-fit
  title: Buyers, Segments, and GBA Fit
  body: 'The buyer map is clearer than a raw TAM figure. Manufacturing is the first serious wallet. MIIT''s 2026 real-scene training notice is effectively a blueprint for how enterprise buyers are expected to procure and de-risk embodied robots: open a real scenario, form a consortium with the robot maker and suppliers, adapt the environment, train in production-like conditions, validate safety and economics, and only then move to routine deployment. That process aligns with GBA strengths. Shenzhen''s revised action plan is explicitly designed to create a dense embodied-robot cluster around core components, AI chips, testing, open data, manufacturing, and application scenarios, while Foxconn''s GTC disclosure shows that major electronics manufacturers are already building around physical AI, hybrid robots, and smart-factory workflows. For Zhisquare specifically, the scenario list across automotive, semiconductor, biotech, airport, and community settings suggests a multi-segment strategy,
    but the deepest near-term fit remains in industrial environments where budget owners already buy automation and where reprogrammable labor can offset worker shortages, flexibility needs, or quality constraints.'
  claimRefs:
  - CM012
  - CM036
  - CM023
  - CM025
  - CM026
  - CM028
  - CM029
