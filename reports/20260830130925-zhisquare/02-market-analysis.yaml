chapter:
  number: 2
  title: Market Analysis
  summary: China's 2026 humanoid and embodied-AI market is large, policy-accelerated, and increasingly deployment-oriented, but the investable opportunity for Zhisquare is narrower than headline robotics TAMs. The strongest evidence points to manufacturing-first adoption in the Greater Bay Area, with Shenzhen policy and national MIIT programs lowering scenario friction, while the biggest unresolved issues remain buyer-level ROI, subsidy dependence, and Zhisquare's true bottoms-up SAM inside enterprise budgets.
sections:
- id: market-boundary-and-sizing
  title: Market Boundary and Sizing Logic
  body: The easiest way to overstate Zhisquare's opportunity is to call it a robotics company and inherit the entire automation or AI market. The reviewed evidence supports a narrower and more useful boundary. Zhisquare sells into embodied workflows where a reprogrammable robot body, a robot-brain stack, integration, and ongoing service are all required to replace or augment labor in real operating environments. That boundary excludes a large amount of fixed-function automation and pure software AI. Within that narrower boundary, public estimates are still meaningful. Morgan Stanley, as quoted by CNBC, estimated a $2 billion China humanoid market in 2026 and $15 billion by 2030, while TrendForce described China as the world's largest humanoid market entering a critical commercialization phase. These estimates are best treated as directional TAM lenses rather than precise Zhisquare underwriting inputs, because they remain national, external-sales-level views rather than buyer-budget bottoms-up
    models.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM019
  - CM020
  - CM021
  - CM017
  - CM039
  tableRefs:
  - TM001
