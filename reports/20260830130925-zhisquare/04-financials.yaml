- id: unit-economics-and-why-public-proof-is-insufficient
  title: Unit Economics and Why Public Proof Is Insufficient
  body: The public record supports a strong view on which unit-economics variables matter and a weak view on what their values are. Because humanoid deployment is capital-intensive, Zhisquare's margin path will depend on realized ASP, hardware BOM, field-service intensity, warranty cost, utilization, and the speed at which integration work becomes more repeatable. MIIT's 2026 deployment guidance and Foxconn's smart-manufacturing posture both imply technically demanding enterprise buyers and long integration-led sales cycles, which usually mean higher pre-sales and delivery costs. That dynamic does not make the model unattractive; it simply means capital can disappear quickly if support burden stays high or customer ROI takes too long to prove. The danger is that mega-rounds can temporarily hide those inefficiencies. Without disclosed gross margin, payback, or warranty data, investors are mostly seeing financing momentum and one named order rather than a fully formed hardware-software contribution-margin
    story.
  claimRefs:
  - CI020
  - CI022
  - CI023
  - CI026
  - CI035
  - CI036
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: financial-verdict
  title: Financial Verdict
  body: Financially, Zhisquare looks like a company with elite fundraising access and meaningful early commercial signal, but still well short of public underwriteability on fundamentals. That verdict is not bearish on the business itself; it is a statement about disclosure quality. The committee can reasonably infer that the company is building a real hardware-and-deployment business, that it has enough capital support to keep pressing ahead, and that named industrial demand exists. It cannot yet infer whether recognized revenue is material, whether gross margins can turn positive at scale, whether customer concentration is manageable, or whether the next phase of growth requires more capital than the headline round sizes imply. Reported Hong Kong IPO preparation may eventually force cleaner metrics into the open, but until then the prudent view is that Zhisquare's capital structure is impressive, its commercial proof is promising, and its financial internals remain the biggest diligence
    blocker. Until audited revenue, gross margin, and cash metrics surface, financing scale should be treated as breathing room rather than proof of operating quality.
  claimRefs:
  - CI032
  - CI033
  - CI034
  - CI037
