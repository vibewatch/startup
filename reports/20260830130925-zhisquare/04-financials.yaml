company:
  name: Zhisquare
chapter:
  number: 4
  title: Financials
  summary: Zhisquare has one of the strongest funding surfaces in Chinese embodied AI, with a rapid progression from 2025 official rounds to a reported RMB 1B-plus B round and a near-RMB 5B June 2026 financing at a valuation above RMB 20B. Yet the public record remains thin on the metrics that actually determine financial quality—recognized revenue, gross margin, cash balance, burn, runway, ASPs, and backlog conversion—so the prudent conclusion is that capital access is exceptional while public underwriteability of core economics is still poor.
sections:
- id: revenue-model-and-what-is-actually-visible
  title: Revenue Model and What Is Actually Visible
  body: 'Zhisquare''s public commercial story is clear at the level of mechanism but not at the level of realized economics. The company is selling more than a robot body: the official pages, launch materials, and WRC profile consistently imply a package that includes embodied hardware, a robot-brain stack, deployment into customer workflows, and ongoing operational support. That means revenue likely comes from some mix of hardware sales or leases, integration work, software/fleet value, and post-deployment service. However, the retained public record does not disclose recognized revenue, ARR, ASP, gross margin, or attach rates for any of those elements. The one important exception is proof of commercial demand: the HKC-linked order shows a sizeable named backlog signal, but even that is better understood as order proof than as recognized revenue proof. In other words, the business model is legible, while the income statement is not.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI011
  - CI012
  - CI013
  - CI014
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: capital-history-and-forward-adequacy
  title: Capital History and Forward Adequacy
  body: 'If the revenue surface is thin, the capital surface is the opposite. Zhisquare''s funding cadence accelerated from official Pre-A and Pre-A+ announcements in 2025 to an RMB 1B-plus B-round in February 2026 and then a near-RMB 5B round in June 2026 that pushed valuation above RMB 20B. Public reports and company language indicate these proceeds support commercialization, mass production, robot-brain R&D, and broader industrial rollout. That is an extraordinary financing profile and it clearly reduces the near-term probability of a simple liquidity crunch. But the underwriting limit is obvious: gross proceeds are not the same as available cash. Public sources do not disclose the split between primary and secondary capital, the post-close cash balance, restricted cash, planned burn, or financing commitments tied to factory construction. So the right conclusion is not that adequacy is solved; it is that Zhisquare has bought itself time and optionality, but not public transparency.'
