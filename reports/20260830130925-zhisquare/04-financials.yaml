- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Recognized revenue by quarter
    - Valuation cannot be benchmarked to output or backlog
    - Request monthly P&L and revenue-recognition policy.
  - - Gross margin by stream
    - Scale-up may destroy economics if service burden is high
    - Request unit BOM, warranty, and service margin analysis.
  - - Cash / burn / runway
    - Capital adequacy remains speculative
    - Request treasury report and 18-month operating plan.
  - - Primary vs secondary split
    - Round quality and dilution overhang remain unclear
    - Request signed round summary and cap table.
  - - Debt / guarantees / project finance
    - Factory obligations could tighten flexibility
    - Request loan, lease, and guarantee schedule.
