- id: thesis-scenarios
  title: Investment Thesis, Anti-Thesis, and Scenarios
  body: 'The bull case rests on category leadership: Rogo''s financing cadence (four blue-chip reinvestors plus a new top-tier
    lead), its embedded position at named bulge-bracket and elite-boutique accounts documented elsewhere in this diligence,
    and a macro backdrop where AI captured roughly 80% of Q1 2026 global venture funding all support the idea that capital
    is concentrating behind perceived category winners rather than spreading indiscriminately. The anti-thesis is that the
    same comparable set used to justify the price -- Hebbia, Glean, AlphaSense -- is itself under public skepticism for multiples
    of 12.5x-54x ARR with no public-market liquidity, and Rogo has disclosed none of the revenue, margin, or retention data
    that would let an outside investor confirm it deserves a similar multiple rather than a public workflow-software one.
    In the base case, Rogo''s still-undisclosed current ARR sits below what a $2 billion mark would require at AI-native multiples,
    so the nominal valuation holds at the next round but the effective multiple compresses as disclosure catches up; in the
    bear case, a below-chatter ARR print or a bulge-bracket account loss forces a down round. The bull case is supported by
    real, verifiable financing signals; the anti-thesis is supported by an equally real disclosure gap. Both are true at once,
    which is exactly why this chapter''s stance is track/research-more rather than a directional call.'
  claimRefs:
  - CV002
  - CV017
