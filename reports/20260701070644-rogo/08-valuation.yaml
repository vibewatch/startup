- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Key Assumption
  - Valuation/Return Logic
  - Key Risk
  - Probability Signal
  rows:
  - - Bull
    - Rogo sustains category-leader status and closes the ARR-disclosure gap at a run-rate consistent with recent funding
      cadence
    - $2B mark holds or re-rates upward alongside AI-native peer comps (Hebbia, Glean, AlphaSense all re-rated upward in 2025-2026)
    - Incumbent bundling (Microsoft, Bloomberg, S&P Global) narrows willingness-to-pay before Rogo can prove durable ARR
    - Supported by continued reinvestment from four blue-chip prior-round investors
  - - Base
    - Rogo grows but current ARR sits below what a $2B mark would require at AI-native multiples (12.5x-54x observed in comparables)
    - Valuation holds nominally at the next round but effective multiple compresses as ARR is disclosed
    - Multiple compression risk flagged across the AI software sector in 2026 market data
    - Consistent with a reported ~23% AI-startup valuation decline since late 2025 and 14% lower AI deal count
  - - Bear
    - Current ARR is materially below market chatter and/or a bulge-bracket account churns or in-sources
    - Down round or flat round at the next financing; effective loss for late entrants at the $2B mark
    - Undisclosed unit economics plus negative large-firm AI employment outlook in Rogo's own customer base
    - Consistent with 'crashed and burned' AI-startup pattern documented in 2026 funding trackers
  - - What would move the call
    - Independently verified current-year ARR, gross margin, and net revenue retention
    - N/A -- resolves the base/bull/bear split directly
    - N/A
    - Single most decision-relevant missing disclosure in this diligence
  notes: Return figures are intentionally omitted because no disclosed ARR, margin, or share count exists to anchor a numeric
