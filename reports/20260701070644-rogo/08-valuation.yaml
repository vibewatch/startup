slug: rogo
runDate: '2026-07-01'
company:
  name: Rogo
chapter:
  number: 8
  title: Valuation
  summary: Rogo's April 2026 Series D priced the company at roughly $2 billion, nearly tripling its $750 million Series C
    mark from three months earlier, but no source in this diligence discloses Rogo's own current-year revenue, margin, retention,
    or cash runway, so this chapter deliberately evaluates the $2 billion price against comparable AI-native private rounds
    (Hebbia, Glean, AlphaSense), public-market workflow-software comparables (FactSet, Intapp, S&P Global), and 2026 macro
    financing conditions rather than constructing an unsupported DCF or ARR-multiple valuation of Rogo itself, and concludes
    the price looks stretched relative to what can be independently underwritten today, warranting a track/research-more posture
    rather than a directional buy or avoid call.
sections:
- id: price-vs-value
  title: 'Price Paid vs. Intrinsic Value: Framing the $2 Billion Series D'
  body: On April 29, 2026, Rogo closed a $160 million Series D led by Kleiner Perkins, valuing the company at approximately
    $2 billion -- nearly tripling its $750 million mark from the January 2026 Series C just three months earlier. Kleiner
    Perkins partner Mamoon Hamid framed the investment as a bet that Rogo is becoming "the operating system for an entire
    industry," and Sequoia, Thrive Capital, Khosla Ventures, and J.P. Morgan Growth Equity Partners all reinvested alongside
    the new lead. Those facts establish that a specific syndicate of informed, repeat investors was willing to pay $2 billion
    for a stake in Rogo on that date. They do not, by themselves, establish that $2 billion is an externally verifiable intrinsic
    value. No source reviewed anywhere in this diligence discloses Rogo's own current-year revenue run-rate, gross margin,
    net revenue retention, or cash runway, and no secondary-market trade or independent fairness opinion has tested the Series
    D price. This chapter therefore treats the $2 billion figure as a primary-round clearing price -- real, but syndicate-priced
    and market-untested -- and deliberately avoids constructing a discounted-cash-flow or ARR-multiple valuation of Rogo itself.
    Instead, it evaluates the price against comparable private rounds, public-market multiples, and the 2026 financing backdrop,
    and states plainly where the evidence runs out.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV032
  - CV036
  tableRefs:
  - TV001
- id: comparable-benchmarks
  title: Private and Public Comparable Benchmarks
  body: 'Three AI-native peers with disclosed revenue give the closest read on what multiple category-leading finance- and
    knowledge-work AI companies command. Hebbia''s mid-2024 Series B valued it at roughly $700 million on about $13 million
    of profitable ARR -- about 54x -- and TechCrunch reported The Information''s estimate that Glean and Harvey traded at
    slightly over 60x ARR around the same period. Glean has since scaled to $300 million in annualized revenue as of May 2026
    while still carrying its $7.2 billion Series F valuation, an implied multiple of about 24x that has compressed from roughly
    72x when Glean was at $100 million ARR. AlphaSense''s June 2026 round valued it at $7.5 billion on about $600 million
    ARR, roughly 12.5x -- a multiple one analyst called consistent with public AI software trading at 8-15x forward ARR, even
    without AlphaSense''s public liquidity. Rogo''s nearest *listed* comparables tell a very different story: FactSet trades
    at roughly 4.0x trailing revenue and Intapp at roughly 3.1x, both far below any of the private AI-native prints. That
    gap is the central valuation tension this chapter cannot resolve with public evidence: Rogo''s $2 billion price implicitly
    assumes it deserves a private AI-native multiple, not a public workflow-software one, and no disclosed Rogo revenue figure
    exists to confirm which regime actually applies.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
