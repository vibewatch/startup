- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Dimension
  - Thesis
  - Anti-Thesis (What Would Change the View)
  rows:
  - - Category positioning
    - Rogo is emerging as a category-defining 'operating system' for finance-vertical AI, per its lead Series D investor
    - If a bulge-bracket bank ships an equally capable in-house or Microsoft/Bloomberg-bundled tool, the category-leader premium
      compresses
  - - Financing cadence
    - Four reinvesting blue-chip investors across rounds signal syndicate conviction in Rogo's growth
    - A single down round or a failed re-up by a prior lead investor would be a strong negative signal
  - - Comparable re-rating
    - AI-native peers (Hebbia, Glean, AlphaSense) have all re-rated upward on disclosed ARR growth, suggesting category-wide
      re-rating room
    - Those same peers face public skepticism about ARR multiples of 12.5x-54x with no public liquidity; a correction in any
      one could re-price the category
  - - Public comps
    - Incumbent data platforms (FactSet, Intapp, S&P Global) show that AI-augmented workflow revenue is real and monetizable
    - Those incumbents trade at 3x-4x revenue, not the double-digit multiples private AI-native rounds imply -- Rogo's price
      assumes it escapes that gravity
  - - Macro backdrop
    - AI captured roughly 80% of Q1 2026 global venture funding, evidence capital still favors category leaders
    - A reported 23% private AI valuation decline since late 2025 and a 4:1 AI investment-to-revenue ratio both point to broad
      repricing risk
  - - Disclosure
    - Rogo's growth narrative (funding cadence, investor quality, logo growth) is independently corroborated
    - Current-year ARR, gross margin, net revenue retention, and cash runway remain undisclosed, blocking any independent
      underwriting
  notes: Each row pairs a thesis argument with the specific evidence that would flip it; rows draw on both Rogo-specific financing facts and 2025-2026 comparable-company and macro sources cited elsewhere in this chapter.
  claimRefs:
  - CV002
