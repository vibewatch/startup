  - CV036
- calloutType: risk
  title: The Comparable Set Itself Is Under Public Skepticism
  body: Hebbia, Glean, and AlphaSense -- the closest AI-native comparables by buyer overlap -- all carry ARR multiples (12.5x-54x)
    that independent analysts have already flagged as aggressive, unproven by public-market liquidity, or dependent on continued
    hyper-growth. Benchmarking Rogo against a comparable set that is itself contested does not resolve the valuation question;
    it transfers the same uncertainty onto Rogo's price.
  claimRefs:
  - CV004
  - CV006
  - CV009
  - CV019
- calloutType: risk
  title: Incumbents Are Not Standing Still
  body: 'Microsoft''s bundled Copilot for Finance, Bloomberg''s new agentic Terminal interface (alongside a credible outside
    challenger in Perplexity''s Computer), and S&P Global''s in-house Kensho agentic framework all point the same direction:
    the workflow layer Rogo competes in is being contested by incumbents with existing distribution, data, and balance sheets.
    None of this proves displacement has happened, but it is a structural headwind to the willingness-to-pay assumptions embedded
    in a premium private valuation.'
  claimRefs:
  - CV025
  - CV026
  - CV027
  - CV028
- calloutType: recommendation
  title: Track / Research-More, Not Buy or Avoid
  body: Given a syndicate-priced but market-untested valuation, an undisclosed revenue base, and genuine but contested category-leader
    positioning, this chapter's stance is track / research-more. A buy call would require independently verified current-year
    ARR and margin data; an avoid call is not supported either, since the financing cadence and investor quality are real,
    verifiable signals of continued institutional confidence.
  claimRefs:
  - CV044
  - CV001
  - CV003
