- id: exit-readiness
  title: Exit Readiness and Path to Verification
  body: No AI-native enterprise-research peer close to Rogo's category has yet reached the public markets, so there is no
    listed exit comparable to anchor an eventual multiple. Built In's 2026 IPO watchlist names Databricks as the only large
    AI-native company nearing a listing with disclosed profitability (about $5.4 billion annualized revenue and positive free
    cash flow), while OpenAI and Anthropic remain unprofitable despite valuations discussed above $850 billion and $900 billion;
    a separate AI IPO tracker describes 2026 as the most AI-concentrated IPO year on record but notes late-stage private multiples
    remain well below 2021-2022 peaks, and an analysis of the pre-IPO market found only about one in four 2026 IPO-track startups
    genuinely ready to list, with the rest caught between an expired disclosure window and valuations public investors will
    not accept. Rogo itself has so far been an acquirer -- of Offset and other targets referenced elsewhere in this diligence
    -- rather than an acquisition target, which weakens the near-term strategic-sale scenario relative to a longer runway
    toward IPO or a later, larger strategic deal. FactSet, S&P Global, and Bloomberg are the incumbents most structurally
    positioned to consider Rogo as an acquisition rather than a competitor, given they are each independently building agentic
    research capability already. Closing this chapter's largest evidence gaps -- current-year revenue, margin, retention,
    cash runway, and any secondary-market print -- would do more to sharpen the valuation stance than any additional comparable-company
    research.
  claimRefs:
  - CV030
  - CV031
