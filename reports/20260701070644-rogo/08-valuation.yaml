- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / Valuation / Status
  - Relevance to Rogo
  - Limitation
  rows:
  - - Hebbia (private, Series B, mid-2024)
    - $13M ARR, profitable
    - $700M valuation, ~54x ARR
    - Closest AI-native peer by buyer overlap (asset managers, banks, law firms)
    - Round is now two years stale; current ARR/valuation not disclosed
  - - Glean (private, Series F, Jun 2025; ARR update May 2026)
    - $300M annualized revenue (May 2026) vs. $7.2B valuation (Jun 2025)
    - ~24x current run-rate, down from ~72x at $100M ARR
    - Shows how fast an AI-native multiple can compress as ARR scales
    - Horizontal enterprise search, not finance-vertical; valuation not re-set to current ARR
  - - AlphaSense (private, Jun 2026 round)
    - $600M ARR (Q1 2026)
    - $7.5B valuation, ~12.5x ARR
    - Closest by buyer overlap (banks, asset managers) and workflow category
    - Broader content-library business model than Rogo's agent-first product
  - - 'FactSet (public, NYSE: FDS)'
    - $2.40B trailing revenue, $597M FY2025 net income
    - ~$8.38B market cap, ~4.0x EV/Sales (down from ~$10.67B market cap in Oct 2025)
    - Incumbent data/workflow platform Rogo's own agents pull comparables from
    - Public multiple reflects a mature, profitable business, not a growth-stage AI product
  - - 'Intapp (public, Nasdaq: INTA)'
    - $560M total ARR (+23% YoY), $574-575M FY2026 revenue guide
    - ~$2B market cap, ~3.1x EV/Revenue, ~15.1x EV/EBITDA
    - Public vertical-workflow SaaS comp for professional/financial services
    - Not AI-native; multiple reflects legacy-plus-AI-feature positioning, not AI-first pricing
  - - 'S&P Global Market Intelligence / Capital IQ (public, NYSE: SPGI, segment)'
    - Contributes to $15.336B FY2025 consolidated revenue (+8% YoY)
    - Segment not separately market-priced
    - Data-platform incumbent building its own agentic layer (Kensho Grounding)
    - Segment-level revenue not broken out separately from parent; not a clean standalone multiple
  notes: Coverage is a representative sample, not an exhaustive list of every AI-finance or vertical-SaaS comparable; rows
    were chosen for direct buyer or workflow overlap with Rogo and for having at least one disclosed valuation-to-revenue
    data point in 2025-2026 sources.
