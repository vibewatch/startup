  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and the ARR Visibility Gap
        blocks:
          - type: paragraph
            body: >-
              Rogo's revenue model is best understood as enterprise SaaS-style licensing sold directly to investment
              banks, private equity firms, and asset managers, layered with an agentic add-on (Felix) that automates
              multi-step workflows such as deal screening, CIM generation, and buyer outreach. No source reviewed in
              this chapter or in Chapter 3's competitor pricing table discloses a per-seat or per-contract list price
              for Rogo; a competitor comparison page frames Rogo as an "enterprise custom pricing" product, implicitly
              contrasting it with lighter self-serve tools. In the absence of Rogo's own rate card, comparable AI-native
              research platforms provide the only available pricing anchors: AlphaSense discloses $10,000-$20,000 per
              seat annually with average enterprise deal sizes of $50,000-$100,000-plus, while Glean is estimated at
              $45-50-plus per user per month with a $50,000-$60,000 minimum annual commitment -- both materially above
              Microsoft 365 Copilot's $30 per user per month. Historical disclosed revenue is thin and inconsistent
              across trackers: Forbes reports Rogo's revenue grew from roughly $2 million in 2024 to more than $15
              million in 2025, while CB Insights separately lists Rogo's 2024 revenue at approximately $1 million -- a
              discrepancy this chapter cannot resolve without a company-confirmed figure. OpenAI's own case study states
              Rogo grew annual recurring revenue 27x since emerging from stealth in 2024, but an independent LLMOps
              technical review of the same case study cautions that this figure, along with the frequently repeated "10+
              hours saved per week" claim, is self-reported and should be treated with promotional skepticism absent
              independent verification. None of the sources reviewed distinguish disclosed historical revenue from a
              current 2026 annual recurring revenue figure, which is the central visibility gap this chapter must flag
              rather than paper over. Industry pricing analysis further argues that flat per-seat pricing misaligns cost
              and value for AI products, since a heavy user can generate roughly 100x the inference cost of a light user
              on an identical subscription fee -- a dynamic that likely applies to Rogo's own undisclosed pricing
              structure as much as to its peers.
