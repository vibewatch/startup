            title: LSEG Is Both Rogo's Data Partner and a Direct Competitor
            body: >-
              LSEG's Deep Research agent, built natively into Workspace and Microsoft Teams, competes for the exact
              natural-language research task Rogo performs -- on much of the same underlying LSEG content Rogo licenses
              through its own strategic partnership. This coopetition structure is not disqualifying (data vendors
              routinely sell to and compete with the same customers), but it does mean Rogo's continued data access
              rests on a commercial relationship with a company that has its own incentive to keep research workflows
              inside Workspace. Diligence should confirm the contractual protections governing data continuity and any
              non-compete or most-favored-customer terms.
            calloutType: risk
            claimRefs:
