      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: No public enforcement or litigation record does not mean no exposure
            body: >-
              No source reviewed for this chapter identifies a pending lawsuit, SEC/FINRA action, or confirmed breach
              naming Rogo. Given ~100% YoY growth in AI-related securities litigation from 2023-2024 and continued
              growth into 2026, plus an SEC unit built specifically to pursue AI-washing, this is an absence to monitor
              quarterly, not a clean bill of health to bank on.
            calloutType: risk
            claimRefs:
              - CR020
              - CR021
          - type: callout
            title: Regulatory perimeter tightens on a clock that lands inside this diligence window
            body: >-
              The EU AI Act's high-risk and GPAI enforcement powers activate August 2, 2026, roughly one month after
              this run's date, while US bank model-risk guidance was just loosened and explicitly excludes GenAI pending
              future rulemaking -- a mismatch that leaves Rogo's bank customers without a settled supervisory answer at
              the exact moment EU obligations tighten.
            calloutType: risk
            claimRefs:
              - CR015
              - CR017
          - type: callout
            title: Valuation has outrun disclosure
            body: >-
              Rogo's valuation nearly tripled from ~$750M to ~$2B in three months (Jan-Apr 2026) with no public ARR,
              margin, or retention figure to anchor the multiple, at the same time several tech investors and analysts
              were publicly debating an AI-sector valuation correction.
            calloutType: risk
            claimRefs:
              - CR038
              - CR039
              - CR040
          - type: callout
            title: Self-reported compliance and security claims are not independently audited in sources reviewed
            body: >-
              Rogo's Trust Center lists SOC 2, ISO 27001, ISO 42001, and EU AI Act compliance documentation, and names
              reference institutions as having reviewed its security posture, but no independent auditor confirmation,
              certificate-registry entry, or regulator statement corroborating these claims was found in this chapter's
              source set.
            calloutType: assumption
            claimRefs:
              - CR016
              - CR031
          - type: callout
            title: Treat forward-deployed hiring velocity as a leading indicator
            body: >-
              Because Rogo's growth model depends on scaling a labour category (forward-deployed bankers/engineers) that
              is growing in demand far faster than supply industry-wide, tracking Rogo's own forward-deployed headcount
              and time-to-fill is a more current signal of near-term growth capacity than logo count alone.
            calloutType: recommendation
            claimRefs:
              - CR044
              - CR045
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Price Paid vs. Intrinsic Value: Framing the $2 Billion Series D'
        blocks:
          - type: paragraph
            body: >-
              On April 29, 2026, Rogo closed a $160 million Series D led by Kleiner Perkins, valuing the company at
              approximately $2 billion -- nearly tripling its $750 million mark from the January 2026 Series C just
              three months earlier. Kleiner Perkins partner Mamoon Hamid framed the investment as a bet that Rogo is
              becoming "the operating system for an entire industry," and Sequoia, Thrive Capital, Khosla Ventures, and
              J.P. Morgan Growth Equity Partners all reinvested alongside the new lead. Those facts establish that a
              specific syndicate of informed, repeat investors was willing to pay $2 billion for a stake in Rogo on that
              date. They do not, by themselves, establish that $2 billion is an externally verifiable intrinsic value.
              No source reviewed anywhere in this diligence discloses Rogo's own current-year revenue run-rate, gross
              margin, net revenue retention, or cash runway, and no secondary-market trade or independent fairness
              opinion has tested the Series D price. This chapter therefore treats the $2 billion figure as a
              primary-round clearing price -- real, but syndicate-priced and market-untested -- and deliberately avoids
              constructing a discounted-cash-flow or ARR-multiple valuation of Rogo itself. Instead, it evaluates the
              price against comparable private rounds, public-market multiples, and the 2026 financing backdrop, and
              states plainly where the evidence runs out.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV032
              - CV036
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV032
              - CV044
      - number: '8.2'
        title: Private and Public Comparable Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Three AI-native peers with disclosed revenue give the closest read on what multiple category-leading
              finance- and knowledge-work AI companies command. Hebbia's mid-2024 Series B valued it at roughly $700
              million on about $13 million of profitable ARR -- about 54x -- and TechCrunch reported The Information's
              estimate that Glean and Harvey traded at slightly over 60x ARR around the same period. Glean has since
              scaled to $300 million in annualized revenue as of May 2026 while still carrying its $7.2 billion Series F
              valuation, an implied multiple of about 24x that has compressed from roughly 72x when Glean was at $100
              million ARR. AlphaSense's June 2026 round valued it at $7.5 billion on about $600 million ARR, roughly
              12.5x -- a multiple one analyst called consistent with public AI software trading at 8-15x forward ARR,
              even without AlphaSense's public liquidity. Rogo's nearest *listed* comparables tell a very different
              story: FactSet trades at roughly 4.0x trailing revenue and Intapp at roughly 3.1x, both far below any of
              the private AI-native prints. That gap is the central valuation tension this chapter cannot resolve with
              public evidence: Rogo's $2 billion price implicitly assumes it deserves a private AI-native multiple, not
              a public workflow-software one, and no disclosed Rogo revenue figure exists to confirm which regime
              actually applies.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
