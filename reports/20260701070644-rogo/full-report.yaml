  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Felix and the Core Product Surface
        blocks:
          - type: paragraph
            body: >-
              Rogo's product has evolved from a research assistant into Felix, an AI agent that turns a single prompt
              into client-ready PowerPoint decks, Excel models, Word documents, dashboards, and sourced research. Felix
              is reachable through email, chat, and a native Excel Plug-in, and can be delegated asynchronous, scheduled
              tasks -- for example, monitoring a company and re-running a report each time it reports earnings. Concrete
              finance workflows include deal screening, Confidential Information Memorandum generation, buyer outreach,
              and data-room diligence, alongside comps, models, pitchbooks, and investment committee memos.


              Rogo's May 2026 release consolidated the platform into a broader surface: Rogo Agents let firms encode
              proprietary templates, methodologies, and recurring workflows as reusable custom automations; Custom MCP
              lets firms attach their own or third-party Model Context Protocol servers as additional tools; a Slides
              Annotator maps deck markup directly to tracked, versioned Felix revisions; Memory persists a user's
              conventions and preferences across chats; and a Library centralizes every artifact Felix has produced.
              Together these features reposition Rogo from a single-purpose research chatbot toward a configurable
              workflow platform that a firm can adapt to its own standing processes.
