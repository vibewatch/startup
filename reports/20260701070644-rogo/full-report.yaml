  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Down round or flat round at next financing
        - Post-money valuation below $2B at the next disclosed round
        - Directly falsifies the 'category leader re-rating' bull case
        - Downgrade valuation stance to expensive/avoid; reassess entry price
      - - Disclosed current-year ARR far below implied comp multiples
        - Current ARR implying a multiple above the high end of the 12.5x-54x comparable band on the $2B mark
        - Confirms the base/bear scenario that the price outran disclosed fundamentals
        - Move from track/research-more to avoid pending re-pricing
      - - Loss of a marquee bulge-bracket or elite-boutique account
        - Any of the named logos in this diligence's customer evidence publicly churns or in-sources equivalent tooling
        - Undermines both the category-leader thesis and the retention assumption embedded in comparables
        - Treat as a material adverse event requiring immediate re-underwriting
      - - Incumbent bundling displaces a named account
        - >-
          A confirmed account switch to Microsoft Copilot for Finance, Bloomberg ASKB, or an S&P Global/Kensho agentic
          product
        - Validates the incumbent-bundling anti-thesis directly
        - Reduce confidence in durable pricing power; revisit TAM assumptions
      - - Independent secondary-market print below the Series D price
        - A confirmed secondary transaction or fairness opinion pricing Rogo below $2B
        - Provides the first market-tested (not syndicate-only) valuation signal
        - Use the secondary print, not the primary round price, as the reference mark
    notes: >-
      Thresholds are qualitative triggers drawn from this chapter's evidence, not contractual covenants disclosed by
      Rogo or its investors.
    claimRefs:
      - CV034
      - CV036
      - CV025
      - CV027
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Diligence Path
    rows:
      - - Current-year revenue
        - Audited or management-reported current-year ARR / revenue run-rate
        - Single largest blocker to applying any comparable multiple to Rogo directly
        - Request current-year revenue and cohort-level ARR breakdown under NDA before any follow-on commitment
      - - Unit economics
        - Gross margin, model-inference cost per seat, and CAC/LTV
        - Needed to distinguish a durable software margin profile from a services-heavy, lower-margin one
        - Request cost-of-revenue detail and per-seat inference cost benchmarks
      - - Retention
        - Net revenue retention and logo-level churn detail
        - Determines whether comparable ARR-multiples (Hebbia, Glean, AlphaSense) are even the right reference class
        - Request cohort retention curves for the accounts named in this diligence
      - - Cash position
        - Cash on hand, burn rate, and runway in months
        - Affects how much dilution risk exists before any exit event
        - Request most recent balance-sheet snapshot and monthly burn trend
      - - Secondary-market evidence
        - Any tender offer, employee secondary sale, or fairness opinion pricing Rogo
        - Would provide the first market-tested valuation signal independent of the primary round
        - Query cap-table/secondary platforms and existing investors for recent trade prints
      - - Exit preparation
        - CFO/auditor hires or bank engagement signaling IPO or sale preparation
        - Indicates management's own timeline and confidence in eventual liquidity
        - Monitor executive hiring announcements and public S-1/registration filings
    notes: >-
      Ranked by this chapter's judgment of blocking severity; none of these six items were resolved by any source
      reviewed in this run.
    claimRefs:
      - CV032
      - CV041
