      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Five buyer segments make up the addressable market, each with different budget ownership and adoption
              triggers. Bulge-bracket and global investment banks are the earliest, best-funded buyers, backed by IT
              budgets averaging roughly 9-11% of revenue and existing procurement relationships with Bloomberg, FactSet,
              and LSEG (CM044, CM019, CM020); adoption there is driven by peer pressure and junior-staffing cost
              economics. Middle-market and boutique banks are a later-adopting, more price-sensitive tier that typically
              waits for proven ROI at larger peers before committing partner-level budget (CM045). Private equity firms
              are embedding AI across diligence, deal-lifecycle automation, and portfolio-company operations, but the
              tooling budget sits with the general partner at the fund level, not with individual portfolio companies,
              and is increasingly justified to limited partners as evidence of value-creation sophistication (CM046,
              CM010). Hedge funds and asset managers budget separately for AI/alternative-data tools versus pure data
              acquisition, with software and technology commonly consuming a third to half of that separate budget
              (CM047); 94% of surveyed fund managers expected to increase this spending in 2026 (CM026), and 60% of
              institutional investors say they would favor allocating capital to a fund that dedicates meaningful budget
              to generative-AI research (CM028) -- an LP-driven adoption trigger distinct from per-deal ROI. Corporate
              development and in-house M&A teams round out the map as a smaller, CFO-budget-owned segment motivated by
              reducing reliance on paid advisory fees. Vendor and competitor commentary corroborates this framing: Rogo
              and Hebbia are positioned against large financial institutions and enterprise banking/PE teams, while
              smaller entrants target private-credit funds and family offices with leaner deal teams (CM021, CM022).
