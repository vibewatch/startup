        - ~24x current run-rate, down from ~72x at $100M ARR
        - Shows how fast an AI-native multiple can compress as ARR scales
        - Horizontal enterprise search, not finance-vertical; valuation not re-set to current ARR
      - - AlphaSense (private, Jun 2026 round)
        - $600M ARR (Q1 2026)
        - $7.5B valuation, ~12.5x ARR
        - Closest by buyer overlap (banks, asset managers) and workflow category
        - Broader content-library business model than Rogo's agent-first product
      - - 'FactSet (public, NYSE: FDS)'
        - $2.40B trailing revenue, $597M FY2025 net income
        - ~$8.38B market cap, ~4.0x EV/Sales (down from ~$10.67B market cap in Oct 2025)
        - Incumbent data/workflow platform Rogo's own agents pull comparables from
        - Public multiple reflects a mature, profitable business, not a growth-stage AI product
      - - 'Intapp (public, Nasdaq: INTA)'
        - $560M total ARR (+23% YoY), $574-575M FY2026 revenue guide
        - ~$2B market cap, ~3.1x EV/Revenue, ~15.1x EV/EBITDA
        - Public vertical-workflow SaaS comp for professional/financial services
        - Not AI-native; multiple reflects legacy-plus-AI-feature positioning, not AI-first pricing
