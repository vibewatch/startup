          - type: callout
            title: No Current AI Model Is Client-Ready Without Human Review
            body: >-
              BankerToolBench, an independent benchmark built with 502 active and former investment bankers from Goldman
              Sachs, JPMorgan, Morgan Stanley, and Evercore, found that none of nine tested AI models produced
              client-ready output without revision, and the best model still left 27% of outputs completely unusable.
              This is a category-wide reliability finding, not a claim about Rogo specifically, but it means any AI
              research platform selling into investment banking -- Rogo included -- is competing against a documented,
              independently measured trust gap that human-in-the-loop review and source-citation grounding only
              partially close.
            calloutType: risk
            claimRefs:
              - CP038
              - CP039
              - CP043
          - type: callout
            title: Workflow Integration Is Rogo's Most Defensible Moat Layer
            body: >-
              Rogo's deepest points of differentiation are not at the model layer, where Bloomberg, FactSet, and
              well-funded frontier-model providers can plausibly catch up, but at the workflow-integration layer:
              connections into a bank's own SharePoint, CRM, and data rooms combined with licensed data partnerships
              spanning LSEG, PitchBook, S&P Global, and FactSet. That combination is exactly the kind of bank-by-bank
              integration work that horizontal copilots like Microsoft 365 Copilot and Glean have not yet replicated
              with finance-specific depth, and it is why Rogo, Hebbia, and FactSet AI for Banking cluster together as
              the most banking-purpose-built options in the positioning map (FP001).
