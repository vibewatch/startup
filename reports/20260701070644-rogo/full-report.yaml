      - number: '1.3'
        title: Funding History, Valuation, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Rogo's financing history is compressed and steep. Citybiz and Sacra both report a $7 million seed round in
              February 2024 led by AlleyCorp, with Company Ventures, BoxGroup, and ScOp Ventures participating;
              SixThirty Ventures separately estimates the seed priced at roughly a $48 million post-money valuation. On
              October 1, 2024, Rogo's own press release announced an $18.5 million Series A led by Khosla Ventures at an
              $80 million post-money valuation, with Mantis VC, Jack Altman, and former Google CEO Eric Schmidt
              participating and Khosla General Partner Keith Rabois joining the board; total funding reached $26
              million. Around April 2025, Rogo raised a $50 million Series B led by Thrive Capital, with J.P. Morgan
              Growth Equity Partners, Tiger Global, and Positive Sum Ventures joining, taking total funding to $75
              million at a valuation both Forbes and Sacra place near $350 million.


              The pace then accelerated sharply. In January 2026, Rogo announced a $75 million Series C led by Sequoia
              Capital, with individual investor Henry Kravis (KKR co-founder) and Wells Fargo participating, pushing
              total funding past $165 million at a $750 million valuation -- more than double the Series B mark in under
              a year -- and funding the opening of Rogo's first international office in London. Just three months later,
              on April 29, 2026, Rogo announced a $160 million Series D led by Kleiner Perkins, joined by Sequoia,
              Thrive Capital, Khosla Ventures, J.P. Morgan Growth Equity Partners, BoxGroup, Mantis VC, Jack Altman,
              Evantic, and Positive Sum. The Series D brought total funding to more than $300 million, and independent
              reporting from Bloomberg and TBPN Digest states it priced Rogo at a $2 billion valuation -- nearly
              tripling in three months.


              The investor roster reads as a concentrated, high-conviction syndicate rather than a broad one: the same
              four institutional leads (AlleyCorp, Khosla, Thrive, Sequoia) plus Kleiner Perkins account for every
              priced round, with J.P. Morgan Growth Equity Partners and Henry Kravis notable for bridging the venture
              and incumbent-finance worlds. SixThirty Ventures' contemporaneous commentary on the Series A round raised
              a question that remains live at the Series D price: whether AI-analyst valuations across the sector,
              including Rogo's, are pricing in outlier-level revenue multiples relative to demonstrated traction.
