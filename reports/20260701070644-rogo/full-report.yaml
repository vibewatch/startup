      - number: '4.2'
        title: Go-to-Market Scale, Hiring, and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Rogo's most concrete go-to-market proxy is disclosed user and institution counts rather than revenue: its
              official April 2026 Series D announcement states the platform is used by more than 35,000 financial
              professionals across 250-plus institutions, including Rothschild & Co, Jefferies, Lazard, Moelis, and
              Nomura. Three months earlier, at the January 2026 Series C, independent coverage put the same figures at
              roughly 25,000 professionals across 50-plus tier-one firms -- implying meaningful growth in named users
              and a much larger jump in the count of institutions with any exposure to the platform, though the
              institution figure likely captures a broader definition of usage than paying enterprise seats alone. On
              the supply side, Rogo is scaling hiring aggressively: a Growjo estimate (low-confidence, algorithmically
              generated) puts headcount near 292 with 143% year-over-year growth, and Rogo's live careers board listed
              56 open roles as of the access date for this chapter, spanning engineering, sales, product, security, and
              customer-success functions across New York, London, and Singapore. New York State's Empire State
              Development agency has separately confirmed it is offering Rogo up to $6.5 million in performance-based
              Excelsior Jobs Program tax credits tied to 422 new full-time positions and nearly $14 million invested in
              its Manhattan headquarters -- a public commitment that only pays out if Rogo hits the underlying hiring
              and investment milestones. As a sales-efficiency proxy, Rogo's own claimed 10-plus hours saved per week
              per user sits above the 6.4-hour median found in a cross-vendor 2026 AI-agent productivity benchmark
              compiled from McKinsey, Gartner, Forrester, Bain, Deloitte, BCG, and MIT Sloan research, which also finds
              only 41% of AI-agent deployments hit year-one ROI targets and a 6.7-month average payback -- useful
              external yardsticks against which Rogo's self-reported number should be tested rather than accepted at
              face value.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
              - CI017
              - CI040
      - number: '4.3'
        title: Cost Structure and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Rogo does not disclose gross margin, COGS composition, or model-inference spend in any source reviewed, so
              this chapter can only bound the likely range using comparable-company and industry benchmarks. An
              independent LLMOps technical review describes Rogo's layered use of OpenAI models -- GPT-4o for
              user-facing Q&A, o1-mini for data contextualization, and the more expensive o1 reserved for high-stakes
              evaluation and reasoning -- as a deliberate cost-optimization pattern that limits use of the priciest
              model tier to the workloads that need it most. That pattern is consistent with 2026 GPU FinOps
              benchmarking showing inference now consumes 55-80% of enterprise AI GPU spend, with
              cost-per-million-tokens ranging from roughly $1.67 on A100 GPUs to $4.54-plus on H200 GPUs, and a single
              70-billion-parameter model serving realistic enterprise traffic capable of running roughly $347,000 per
              year in compute alone. Broader industry analysis of AI-first B2B SaaS economics estimates gross margins of
              55-70% for AI-native software, versus 78-85% for traditional SaaS, driven by variable inference COGS of
              20-40% of revenue against under 5% for classic SaaS -- a materially different economic profile than the
              legacy financial-data incumbents Rogo competes with. FactSet Research Systems' fiscal 2025 10-K, filed
              with the SEC in October 2025 for the year ended August 31, 2025, together with aggregated third-party data
              drawn from the same filing, show FactSet's trailing-twelve-month gross margin at approximately 52.7% on
              $2.32 billion of revenue -- a legacy-infrastructure benchmark that predates AI-inference-driven cost
              structures and should not be read as a Rogo-specific figure. Rogo's own service-delivery model compounds
              the cost question: a competitor comparison page describes Rogo's "white-glove banker-led implementation,"
              implying materially higher service-delivery cost per enterprise account than a self-serve product, though
              no source quantifies that cost.
            claimRefs:
              - CI018
              - CI019
