      - number: '8.4'
        title: Macro AI-Valuation Backdrop and Competitive Bundling Risk
        blocks:
          - type: paragraph
            body: >-
              Sector-wide data complicates any assumption that private AI multiples simply persist. One analysis citing
              PitchBook and IDC data put annual AI investment at roughly $400 billion against only about $100 billion of
              realized enterprise AI revenue -- a 4:1 ratio it likened to prior technology cycles that preceded
              corrections -- and reported that private AI startup valuations had already declined about 23% since late
              2025. A separate funding tracker found 2026 AI deal count down roughly 14% year over year even as total
              dollars invested rose, describing a barbell market where mega-rounds and micro-rounds grew while mid-stage
              startups without strong metrics struggled, and stated that more AI companies failed in 2026 than in the
              prior three years combined. Competitively, incumbents are not standing still: Microsoft bundles a Copilot
              for Finance add-on into its existing Microsoft 365 seat base, Bloomberg has added an agentic interface to
              its $12.6 billion-revenue Terminal just as Perplexity's rival "Computer" product demonstrated comparable
              research and modeling functionality at a fraction of the cost, and S&P Global's Kensho unit has built its
              own agentic "Grounding" framework directly on top of the Capital IQ data Rogo's own agents license. None
              of this proves displacement has occurred, but it is a structural headwind to the pricing power a premium
              multiple assumes. S&P Global's own 2026 labor-market survey adds a longer-run concern: large enterprises
              -- Rogo's core buyer segment -- forecast a net negative AI-driven employment impact, which could
              eventually shrink the junior-analyst headcount Rogo's workflow product is built to augment.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
      - number: '8.5'
        title: Exit Readiness and Path to Verification
        blocks:
          - type: paragraph
            body: >-
              No AI-native enterprise-research peer close to Rogo's category has yet reached the public markets, so
              there is no listed exit comparable to anchor an eventual multiple. Built In's 2026 IPO watchlist names
              Databricks as the only large AI-native company nearing a listing with disclosed profitability (about $5.4
              billion annualized revenue and positive free cash flow), while OpenAI and Anthropic remain unprofitable
              despite valuations discussed above $850 billion and $900 billion; a separate AI IPO tracker describes 2026
              as the most AI-concentrated IPO year on record but notes late-stage private multiples remain well below
              2021-2022 peaks, and an analysis of the pre-IPO market found only about one in four 2026 IPO-track
              startups genuinely ready to list, with the rest caught between an expired disclosure window and valuations
              public investors will not accept. Rogo itself has so far been an acquirer -- of Offset and other targets
              referenced elsewhere in this diligence -- rather than an acquisition target, which weakens the near-term
              strategic-sale scenario relative to a longer runway toward IPO or a later, larger strategic deal. FactSet,
              S&P Global, and Bloomberg are the incumbents most structurally positioned to consider Rogo as an
              acquisition rather than a competitor, given they are each independently building agentic research
              capability already. Closing this chapter's largest evidence gaps -- current-year revenue, margin,
              retention, cash runway, and any secondary-market print -- would do more to sharpen the valuation stance
              than any additional comparable-company research.
            claimRefs:
              - CV030
              - CV031
              - CV034
              - CV037
              - CV042
              - CV043
          - type: table
            tableRef: TV006
            claimRefs:
              - CV032
              - CV041
      - number: '8.6'
        title: Thesis-Break Triggers and Final Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              A handful of concrete events would resolve this chapter's uncertainty in one direction or the other: a
              down round or flat round at Rogo's next financing; a disclosed current-year ARR implying a multiple above
              the 12.5x-54x comparable band; the loss of a marquee bulge-bracket or elite-boutique account to churn or
              in-sourcing; a confirmed account switch to a bundled incumbent tool (Microsoft Copilot for Finance,
              Bloomberg's agentic Terminal, or an S&P Global/Kensho product); or an independent secondary-market print
              pricing Rogo below $2 billion. None of these have been observed as of this run. Weighing the evidence
              together -- real, verifiable financing and investor-quality signals against an undisclosed revenue base, a
              comparable set that is itself publicly contested, and sector-wide multiple-compression and bundling risk
              -- this chapter's valuation stance is that the $2 billion mark looks stretched relative to what can be
              independently underwritten today, though it is not indefensible given the private-market comparable band.
              The appropriate posture is track/research-more, not an outright buy or avoid call: a buy would require
              independently verified current-year ARR and margin data that does not yet exist in the public record, and
              an avoid call is not supported either, because the financing cadence and reinvestment pattern are real
              signals of continued institutional confidence that this diligence has independently corroborated.
            claimRefs:
              - CV034
              - CV040
              - CV041
              - CV044
          - type: table
            tableRef: TV005
            claimRefs:
              - CV034
              - CV036
              - CV025
              - CV027
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV032
              - CV004
              - CV011
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Price Paid Is Not the Same as Intrinsic Value
            body: >-
              This chapter treats Rogo's $2 billion Series D valuation as the price a specific syndicate of informed
              investors was willing to pay on April 29, 2026 -- not as an independently underwritten intrinsic value.
              Because no source reviewed discloses Rogo's own current-year ARR, gross margin, net revenue retention, or
              cash runway, this chapter deliberately avoids constructing a DCF or ARR-multiple valuation of Rogo itself
              and instead evaluates the price through comparable private rounds, public-market multiples, and macro
              financing conditions.
            calloutType: assumption
            claimRefs:
              - CV001
              - CV032
              - CV036
          - type: callout
            title: The Comparable Set Itself Is Under Public Skepticism
            body: >-
              Hebbia, Glean, and AlphaSense -- the closest AI-native comparables by buyer overlap -- all carry ARR
              multiples (12.5x-54x) that independent analysts have already flagged as aggressive, unproven by
              public-market liquidity, or dependent on continued hyper-growth. Benchmarking Rogo against a comparable
              set that is itself contested does not resolve the valuation question; it transfers the same uncertainty
              onto Rogo's price.
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV019
          - type: callout
            title: Incumbents Are Not Standing Still
            body: >-
              Microsoft's bundled Copilot for Finance, Bloomberg's new agentic Terminal interface (alongside a credible
              outside challenger in Perplexity's Computer), and S&P Global's in-house Kensho agentic framework all point
              the same direction: the workflow layer Rogo competes in is being contested by incumbents with existing
              distribution, data, and balance sheets. None of this proves displacement has happened, but it is a
              structural headwind to the willingness-to-pay assumptions embedded in a premium private valuation.
            calloutType: risk
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
          - type: callout
            title: Track / Research-More, Not Buy or Avoid
            body: >-
              Given a syndicate-priced but market-untested valuation, an undisclosed revenue base, and genuine but
              contested category-leader positioning, this chapter's stance is track / research-more. A buy call would
              require independently verified current-year ARR and margin data; an avoid call is not supported either,
              since the financing cadence and investor quality are real, verifiable signals of continued institutional
              confidence.
            calloutType: recommendation
            claimRefs:
              - CV044
              - CV001
              - CV003
