      - number: '2.4'
        title: Growth Drivers and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Several structural forces are pulling budget toward this category. Junior-banker cost and capacity
              pressure is the clearest: Anthropic shipped ten ready-to-run finance agent templates in 2026 covering
              pitchbooks, earnings-review monitoring, modeling, and comparables checks -- tasks historically owned by
              junior investment bankers (CM024) -- and commentary (of varying reliability) claims some banks have cut
              analyst-class sizes by as much as two-thirds as a result (CM025). LP and institutional-investor pressure
              is a second driver operating largely independent of proven per-deal ROI: 58% of alternative-investment
              managers expect wider front-office generative-AI integration, up from 20% in 2023 (CM027), and McKinsey's
              estimate that AI and operating-model levers could lift CIB profitability 20-30% gives banks a top-down
              mandate to fund adoption (CM005). Adoption follows a recognizable path: firms first evaluate and pilot
              tools, then integrate them into specific workflows such as M&A (86% of adopters did so by 2025, per
              CM038), and only a minority scale beyond pilots into measurable EBIT impact (roughly one-third scale, and
              just 6% qualify as AI "high performers," per CM037). This gap between adoption and scaled value is itself
              a constraint discussed further below, and it directly affects how quickly a vendor like Rogo can convert
              pilot seats into expansion revenue.
