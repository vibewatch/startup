      - number: '7.2'
        title: Regulatory and Compliance Risk -- SEC, FINRA, EU AI Act, and Litigation Posture
        blocks:
          - type: paragraph
            body: >
              US securities regulators have moved from talking about AI risk to acting on it. The SEC has brought
              enforcement actions against investment advisers, public issuers, and at least one startup founder since
              March 2024 for overstated or misleading "AI washing" claims, and now expects firms to substantiate
              AI-related statements with the same rigor as performance or risk-factor disclosures under the Advisers Act
              Marketing Rule [CR010]. In December 2025 the SEC's Investor Advisory Committee voted to recommend that
              issuers be required to define "artificial intelligence," disclose board oversight of AI deployment, and
              report separately on internal and consumer-facing AI effects -- a draft standard that, if adopted, would
              raise the bar for how Rogo's bank and asset-manager customers (and potentially Rogo itself, if it
              approaches a public listing) describe AI-driven outcomes [CR011]. Amended Regulation S-P also now requires
              broker-dealers to document oversight of third-party AI vendors, including 72-hour vendor breach
              notification and 30-day customer notification, which pushes AI-vendor risk management (including of Rogo)
              directly into broker-dealer compliance programs regardless of where the underlying fault sits [CR012].

              FINRA's 2026 oversight report reiterates that its rules are "technology neutral": supervision (Rule 3110),
              communications, recordkeeping, and fair-dealing obligations apply to GenAI-assisted output exactly as they
              would to human-produced output, and firms must archive prompts, outputs, and model-usage logs for audit
              purposes [CR013]. For Rogo's bank customers this means Felix-generated research and models are themselves
              subject to supervisory review and recordkeeping, an operational burden that could slow adoption or require
              additional Rogo-side audit tooling [CR014]. On the EU side, the AI Act's GPAI Code of Practice took effect
              August 2, 2025 with enforcement powers (information requests, model access, recalls) beginning August 2,
              2026, and full high-risk-system obligations for AI used in credit, AML, and similar financial workflows
              also become enforceable from August 2, 2026 -- a hard compliance deadline that lands inside this run's
              diligence window [CR015]. Rogo's own Trust Center lists "EU AI Act" among its compliance documentation,
              but that page is self-published and not independently verified by a named auditor in any source reviewed
              for this chapter [CR016].

              Federal banking regulators moved the opposite direction on model risk: the April 2026 interagency guidance
              from the OCC, Federal Reserve, and FDIC rescinds the 2011 SR 11-7-era framework in favour of a lighter,
              principles-based approach, and explicitly excludes generative and agentic AI models from its scope pending
              separate, future guidance -- leaving Rogo's bank customers without a settled supervisory answer for how to
              validate a vendor-supplied agentic research tool today [CR017]. Confidentiality is a distinct exposure:
              investment-bank engagements routinely involve material non-public information (MNPI), and feeding deal
              data into a third-party AI vendor raises both contractual and insider-trading-adjacent risk if training,
              retention, or cross-client data flows are not airtight -- a risk category regulators are addressing
              through Reg S-P vendor-oversight rules rather than AI-specific rules, meaning the burden of proof sits
              with Rogo's data-handling architecture rather than a single named regulation [CR018]. Rogo also sits close
              to the boundary between "research tool" and "investment advice": a tool that surfaces comps, models, and
              recommendations for real transactions can implicate adviser fiduciary and suitability obligations if a
              firm's compliance program does not clearly document that human judgment, not Felix output, is the basis
              for client-facing advice [CR019].

              No source reviewed for this chapter identifies a pending lawsuit, SEC or FINRA enforcement action, or
              confirmed data breach naming Rogo specifically [CR020]. That silence should be read carefully rather than
              treated as clean: AI-related securities class actions grew roughly 100% year-over-year from 2023 to 2024
              and continued growing through 2025 into 2026, and legal-industry trackers expect "event-driven" AI
              litigation to remain the dominant private-securities- litigation category through 2026, driven by a
              plaintiffs' bar that has built AI-specific expertise and an SEC Cybersecurity and Emerging Technologies
              Unit applying parallel pressure -- a fast-growing docket that a fast-growing, highly visible AI vendor
              like Rogo could enter with a single disputed claim or incident [CR021].
