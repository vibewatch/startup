      - Limitation
    rows:
      - - Hebbia (private, Series B, mid-2024)
        - $13M ARR, profitable
        - $700M valuation, ~54x ARR
        - Closest AI-native peer by buyer overlap (asset managers, banks, law firms)
        - Round is now two years stale; current ARR/valuation not disclosed
      - - Glean (private, Series F, Jun 2025; ARR update May 2026)
