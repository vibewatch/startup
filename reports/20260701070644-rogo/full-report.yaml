      - number: '5.6'
        title: Technical Strengths, Limitations, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Rogo's clearest technical strengths are architectural rather than model-specific: a harness that is
              model-agnostic across frontier vendors, a deep and growing bench of licensed financial-data connectors, a
              go-to-market model built on embedded Forward Deployed Bankers who translate firm-specific workflow
              requirements into product configuration, and a security/compliance program (SOC 2, ISO 27001, ISO 42001,
              Sisyphus continuous testing) that is unusually mature for a company still primarily selling to the most
              conservative segment of financial services. Because the harness -- not any single model -- is the stated
              moat, frontier-model upgrades are, in principle, a configuration change rather than a rewrite.


              The limitations are concentrated in exactly the areas diligence should weight most heavily.
              BigFinanceBench's own published result -- the best frontier agent reaching only 58.8 percent of rubric
              points on workflow-grounded derivation tasks -- is direct evidence that citation-level and step-level
              accuracy lags well behind polished, well-formatted final output, even before considering scale across very
              large or messy real-world document sets. An independent LLMOps review separately flags Rogo's own headline
              usage and growth metrics as self-reported and unverified, and notes that fine-tuning methodology and
              model-update handling are undisclosed. An independent product review adds that onboarding (data-source
              integration, permissions mapping, template configuration) is often non-trivial and that pricing targets
              large enterprise clients rather than smaller firms. None of these limitations are unique to Rogo among
              vertical finance-AI agents, but they temper the gap between marketing language and independently verified
              performance that this chapter's evidence can currently close.
            claimRefs:
              - CE045
              - CE049
              - CE047
