      - number: '7.6'
        title: Talent and Operational Scaling Risk
        blocks:
          - type: paragraph
            body: >
              Rogo's go-to-market depends on a forward-deployed-banker (and forward-deployed-engineer, FDE) model: staff
              embedded with customers to translate firm-specific workflows into product configuration. This exact hybrid
              skill set -- engineering fluency plus deep customer-domain judgment plus client-facing communication -- is
              now one of the tightest labour markets in tech: FDE job postings grew roughly 800% between January and
              September 2025 and roughly 1,165% year-over-year into early 2026, while the candidate pool grew only about
              50%, with total compensation at leading AI labs exceeding $500K for the most sought-after profiles
              [CR044]. Because Rogo is competing for this talent against OpenAI, Anthropic, Google, and Palantir -- all
              of which are also hiring FDEs aggressively -- Rogo's ability to scale its embedded-banker model at the
              pace its customer count implies is a genuine execution constraint rather than a solved problem, and slower
              FDE hiring would directly slow new-logo onboarding and configuration depth at existing accounts [CR045].

              The same AI adoption wave that created Rogo's market is also reshaping the customer-side talent pipeline
              Rogo will eventually recruit its own forward-deployed staff from: major banks (JPMorgan Chase, Citigroup,
              Goldman Sachs, Morgan Stanley, Standard Chartered) are shrinking junior-analyst intake as AI automates
              modelling, pitchbook, and comps work, with JPMorgan's CEO signalling the bank will likely hire more AI
              specialists and fewer traditional bankers going forward, and industry commentary warning of a widening
              "skills gap" as fewer junior bankers build the grunt-work judgment that has historically produced senior
              dealmakers [CR046]. This is double-edged for Rogo: it validates the category (banks are actively
              substituting AI for junior labour) but it also means Rogo's own recruiting pool of banking-literate
              technologists may shrink over time as fewer people enter the analyst programs Rogo's own founders came
              from [CR047].

              Leadership and integration risk round out this category. Rogo has grown by acquisition (Subset, Offset,
              Plux) as well as organically, and each deal adds founder-retention, culture-integration, and
              code-consolidation risk on top of the base execution risk of scaling from roughly 35,000 users and 250+
              institutional relationships toward whatever usage base its next round will be priced against; no source
              reviewed for this chapter discloses a named CFO, chief compliance officer, or chief risk officer for Rogo,
              which is a notable governance gap for a company selling compliance-adjacent AI tools into the most heavily
              regulated segment of financial services [CR048]. Taken together, the talent, integration, and governance
              gaps mean Rogo's operating risk is currently concentrated in a small founding and early-employee group
              scaling multiple simultaneous acquisitions, geographies, and an unusually tight FDE labour market at the
              same time [CR049].
            claimRefs:
