      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, SOM, and Contested Lenses'
        blocks:
          - type: paragraph
            body: >-
              No single, uncontested number describes this market, and this chapter preserves that disagreement rather
              than forcing a false consensus. Precedence Research puts the global generative-AI-in-financial-services
              market at $2.51 billion in 2026, rising to $17.88 billion by 2035 at a 24.81% CAGR (CM001, CM002). The
              Business Research Company scopes a narrower "banking and finance" category at $1.75 billion in 2025,
              growing to $7.71 billion by 2030 at a 34.5% CAGR (CM003) -- a materially different growth rate and base
              year that this chapter marks as an explicit conflict (CM003 contradicts CM001/CM002) rather than
              reconciling into one figure. Buyer-side anchors add further context without resolving the gap: global
              private-equity AUM reached approximately $8 trillion in 2026, with the largest platform (Blackstone) alone
              managing $1.3 trillion (CM007, CM008), while the broader asset-management industry manages $147 trillion,
              over 80% of whose 2025 revenue growth came from market appreciation rather than net new flows (CM009).
              None of the analyst reports reviewed isolate a serviceable addressable market specific to IB/PE/AM AI
              research-automation software -- every published figure conflates this narrow category with broader
              generative-AI-in-financial-services spend or with incumbent data-terminal revenue (CM043). Rogo's
              realistically obtainable revenue (SOM) is consequently not calculable from public data; it requires
              private ARR, seat-count, and per-seat-pricing disclosure the company has not published. This is recorded
              as a diligence gap, not estimated by assumption.
