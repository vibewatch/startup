      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Rogo was co-founded by Gabriel Stengel (CEO), John Willett, and Tumas Rackaitis, all of whom met as
              classmates at Princeton University. Stengel previously worked as an investment banking analyst at Lazard,
              an experience multiple sources describe as the direct catalyst for Rogo: the frustration of doing
              repetitive analytical work in Excel and PowerPoint at 2 a.m. as a junior banker. Willett previously worked
              at J.P. Morgan Chase and Barclays and now leads Rogo's European expansion out of its London office, opened
              alongside the Series C. Rackaitis, who holds a computer science degree from Oberlin College, serves as
              chief technology officer and is the company's named technical architecture lead.


              Beyond the three founders, Bloomberg reporting identifies Rahul Rekhi as Rogo's President, a role he took
              up after roughly a year in the U.S. Treasury Department and seven years at Lazard -- adding policy and
              senior-banking credibility to the leadership bench. What is not publicly visible is a fuller executive or
              governance structure: no independent board roster, committee structure, or named CFO/COO counterpart
              surfaced in any fetched company, investor, or press material. That leaves Rogo looking founder- and
              president-centric, with real key-person concentration risk relative to a company now valued at a reported
              $2 billion.


              A related governance flag surfaces in New York Weekly's Series D coverage: J.P. Morgan Growth Equity
              Partners is both a repeat Rogo investor (Series B through D) and, through its parent bank J.P. Morgan, a
              cited institutional customer of Rogo's platform. That dual investor-customer relationship is not
              inherently improper, but it is a natural diligence question about information-sharing walls and
              preferential access that later chapters or live diligence should probe directly.
