      - number: '3.5'
        title: Moat Durability, Commoditization Risk, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Rogo's most durable moat elements sit at the workflow-integration layer rather than the model layer: deep
              connections into a bank's own SharePoint, CRM, and data rooms, combined with licensed external data
              partnerships (LSEG, PitchBook, S&P Global, FactSet), create switching costs that a horizontal copilot
              cannot replicate without doing the same finance-specific integration work bank by bank. That moat is more
              exposed than it looks in three places. First, at the largest, most profitable accounts, bulge-bracket
              banks are increasingly building rather than buying: JPMorgan's LLM Suite already generates a full pitch
              deck in roughly 30 seconds using the bank's own proprietary data, refreshed every eight weeks, which
              directly substitutes for the workflow Rogo sells. Second, Hebbia's roughly $700 million valuation and
              overlapping enterprise customer base make it a well-capitalized direct competitor rather than a niche
              also-ran, and F2's independently benchmarked Excel engine sets a public reliability bar for deterministic
              computation that neither Rogo nor Hebbia has matched with disclosed results of its own. Third, and most
              consequential for the category as a whole, independent reliability benchmarks are genuinely adverse: the
              BankerToolBench study, built with 502 investment bankers from Goldman Sachs, JPMorgan, Morgan Stanley, and
              Evercore, found that none of nine tested AI models produced client-ready output without human revision,
              and a companion benchmark measured an 86% hallucination rate for the leading-ranked model. A documented
              real-world failure -- Deloitte Australia's fabricated-citation report to the Australian government in July
              2025 -- shows this is not a theoretical risk. The mitigating pattern across every serious vendor in this
              category, including Rogo, Bloomberg's ASKB, LSEG's Deep Research, and Kensho's API, is the same: ground
              every answer in a source-linked citation so errors are auditable rather than merely fewer. Whether Rogo's
              own implementation of that principle holds up to the same scrutiny as its incumbents' is an open diligence
              question this chapter's public sources cannot answer.
