    - $200M raised at $11B valuation (March 2026); >$1B total raised
    - AmLaw 100 law firms, 500+ in-house legal teams, 50+ asset management firms
    - 25,000+ custom agents; expanding long-horizon agents into fund formation and asset-management workflows
    - Not yet demonstrated in core IB deal workflows (CIMs, comps, pitchbooks); legal-AI-first product heritage
