- id: competitor-profiles-strategic-direction
  title: 'Competitor Profiles: Scale, Product Scope, and Strategic Direction'
  body: 'Among direct AI-native peers, Hebbia is the best-capitalized: a cumulative $160 million raised across two rounds (including a $130 million Series B led by a16z in 2024) puts it at roughly a $700 million valuation as of May 2026, with its Matrix product optimized for cell-level, multi-document diligence across large, messy data rooms rather than standardized deal-workflow generation. F2 targets a narrower slice -- private-market underwriting -- but backs its native Excel computation claim with a public, independently verified benchmark score (95.25% on SpreadsheetBench Verified) that neither Rogo nor Hebbia has matched with disclosed results of their own. The incumbent-bundled tier is moving in the same direction from the opposite side: FactSet''s Chief AI Officer frames the firm''s strategy as building "open, flexible, and secure solutions" atop Anthropic, Google, and OpenAI models for its 9,000+ clients, while S&P Global''s ChatIQ is explicitly "tailored to support the needs of banking and buyside analysts," and Bloomberg''s ASKB leans on a 363-billion-token, largely proprietary training corpus that predates most AI-native finance startups by years. LSEG occupies a uniquely dual role: it is simultaneously a licensed data partner feeding company fundamentals, estimates, and an M&A database of more than 1.5 million transactions into Rogo''s own platform, and the seller of its own competing Deep Research agent inside Workspace. Harvey''s strategic direction is the one most worth watching over the next 12-24 months: its $200 million raise at an $11 billion valuation funds expansion of "long-horizon agents" into fund formation, and it already counts more than 50 asset-management firms as customers -- a beachhead adjacent to, though not yet inside, Rogo''s core investment-banking workflow.'
