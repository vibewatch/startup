chapter:
  number: 3
  title: Competitors
  summary: Rogo competes across five tiers -- direct AI-native peers (Hebbia, F2, Marvin Labs), incumbent data-terminal bundlers racing to ship native GenAI (Bloomberg, FactSet, S&P Capital IQ/Kensho, LSEG), horizontal AI copilots (Microsoft 365 Copilot, Glean), adjacent deal-workflow CRM platforms (Intapp DealCloud), and status-quo alternatives (in-house bank-built AI, human-analyst outsourcing) -- with its most durable moat sitting at the workflow-integration layer rather than the model layer, and its position more exposed among the largest bulge-bracket accounts building proprietary tools and less exposed among boutique/PE buyers without internal AI budgets.
sections:
- id: competitive-landscape-map
  title: 'Competitive Landscape Map: Direct Peers, Incumbents, Adjacents, and Status Quo'
  body: 'Rogo''s competitive set is wider than a simple "who else sells AI to bankers" list. Direct AI-native peers such as Hebbia, F2, and Marvin Labs compete for the same enterprise deal-team budget with overlapping but distinct product bets: Hebbia on bulk document intelligence, F2 on native Excel computation for underwriting, and Marvin Labs on lighter-weight equity-research automation. A second tier -- Bloomberg, FactSet, S&P Capital IQ/Kensho, and LSEG -- is not standing still while AI-native entrants raise capital: each has shipped a native generative-AI research agent (ASKB, FactSet AI for Banking, ChatIQ, Deep Research) directly into a terminal or data platform banks already license, turning what used to be a pure data subscription into a bundled AI competitor. A third tier of horizontal AI copilots, Microsoft 365 Copilot and Glean, compete for the same enterprise AI budget line without finance-specific fine-tuning, but both already sit inside most banks'' existing software footprint. Intapp DealCloud occupies an adjacent, largely complementary lane: its Celeste AI targets deal origination and relationship intelligence rather than research-and-analysis generation, so it is more often paired with a research tool than substituted for one. Harvey, an adjacent legal-AI platform now expanding into asset-management and fund-formation workflows, is a likely entrant rather than a current competitor, but its agent infrastructure and capital base make it worth tracking. Finally, two status-quo alternatives persist regardless of vendor competition: large banks (JPMorgan, Goldman Sachs, Morgan Stanley) building proprietary in-house GenAI tools, and firms like SP2 Analytics that market human-analyst outsourcing explicitly as a lower-hallucination-risk substitute for AI research platforms. This landscape map (TP001) is deliberately scoped as a representative, evidence-backed sample rather than an exhaustive index of every point solution in the category.'
