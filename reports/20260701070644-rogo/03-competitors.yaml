callouts:
- calloutType: risk
  title: LSEG Is Both Rogo's Data Partner and a Direct Competitor
  body: LSEG's Deep Research agent, built natively into Workspace and Microsoft Teams, competes for the exact natural-language research task Rogo performs -- on much of the same underlying LSEG content Rogo licenses through its own strategic partnership. This coopetition structure is not disqualifying (data vendors routinely sell to and compete with the same customers), but it does mean Rogo's continued data access rests on a commercial relationship with a company that has its own incentive to keep research workflows inside Workspace. Diligence should confirm the contractual protections governing data continuity and any non-compete or most-favored-customer terms.
  claimRefs:
  - CP018
  - CP019
- calloutType: risk
  title: No Current AI Model Is Client-Ready Without Human Review
  body: BankerToolBench, an independent benchmark built with 502 active and former investment bankers from Goldman Sachs, JPMorgan, Morgan Stanley, and Evercore, found that none of nine tested AI models produced client-ready output without revision, and the best model still left 27% of outputs completely unusable. This is a category-wide reliability finding, not a claim about Rogo specifically, but it means any AI research platform selling into investment banking -- Rogo included -- is competing against a documented, independently measured trust gap that human-in-the-loop review and source-citation grounding only partially close.
  claimRefs:
  - CP038
  - CP039
  - CP043
- calloutType: strength
  title: Workflow Integration Is Rogo's Most Defensible Moat Layer
  body: 'Rogo''s deepest points of differentiation are not at the model layer, where Bloomberg, FactSet, and well-funded frontier-model providers can plausibly catch up, but at the workflow-integration layer: connections into a bank''s own SharePoint, CRM, and data rooms combined with licensed data partnerships spanning LSEG, PitchBook, S&P Global, and FactSet. That combination is exactly the kind of bank-by-bank integration work that horizontal copilots like Microsoft 365 Copilot and Glean have not yet replicated with finance-specific depth, and it is why Rogo, Hebbia, and FactSet AI for Banking cluster together as the most banking-purpose-built options in the positioning map (FP001).'
  claimRefs:
  - CP044
  - CP014
  - CP021
- calloutType: assumption
  title: Bulge-Bracket In-House AI Build Is a Real, Not Theoretical, Substitute
  body: JPMorgan's LLM Suite already demonstrated generating a full investment-banking pitch deck in about 30 seconds using the bank's own proprietary data, and Goldman Sachs has rolled its GS AI Assistant out to roughly 10,000 employees with a firm-wide goal. For the very largest, most profitable accounts -- exactly the customers a $2 billion-valued vendor like Rogo most needs -- the realistic competitive question may not be "which vendor wins" but "does this bank build the workflow internally instead of buying it at all."
  claimRefs:
  - CP003
  - CP004
  - CP005
