  title: 'Competitive Landscape Map: Direct, Incumbent, Adjacent, Substitute, and Status-Quo Alternatives'
  columns:
  - Entity
  - Category
  - Primary Business
  - Relationship to Rogo
  rows:
  - - Hebbia
    - Direct AI-native peer
    - Matrix document-intelligence grid for bulk diligence
    - Competes for the same enterprise finance/PE/credit deal-team budget
  - - F2 (F2.ai)
    - Direct AI-native peer (adjacent)
    - Agentic AI underwriting with native Excel computation engine
    - Competes with Hebbia for private-market underwriting; overlaps Rogo's Excel-automation ambitions
  - - Marvin Labs
    - Direct AI-native peer (niche)
    - Equity-research automation on filings, press releases, earnings calls
    - Smaller-scale peer targeting individual analysts rather than enterprise deal teams
  - - o11
    - Adjacent substitute
    - Excel/Word/PowerPoint-native AI execution layer
    - Positions explicitly against Rogo and Hebbia as a 'Last Mile' complement or replacement
  - - Bloomberg Terminal / ASKB / BloombergGPT
    - Incumbent bundled
    - Financial data terminal with native conversational AI agent
    - Substitutes if a bank's Terminal AI matches Rogo's research workflows; already licensed at most target accounts
  - - FactSet AI for Banking / FactSet AI
    - Incumbent bundled
    - Financial data platform with MCP server and banking AI workflow layer
    - Direct incumbent response aimed squarely at Rogo's investment-banking buyer
  - - S&P Capital IQ Pro / Kensho / ChatIQ
    - Incumbent bundled
    - Financial data platform with GenAI document intelligence and chat assistant
    - Data-layer and workflow overlap; ChatIQ explicitly targets banking and buyside analysts
  - - LSEG Workspace / Deep Research agent
    - Incumbent bundled AND data partner
    - Financial data/analytics platform with native AI research agent
    - Simultaneously a licensed data supplier to Rogo and a direct research-agent competitor
  - - Microsoft 365 Copilot / Copilot for Finance
    - Adjacent substitute (horizontal)
    - General-purpose office AI copilot embedded in Excel/Teams/Outlook
    - Competes for the same enterprise AI budget line without finance-specific fine-tuning
  - - Glean
    - Adjacent substitute (horizontal)
    - Enterprise search and agent platform with financial-services MCP ecosystem
    - Aggregates the same third-party data providers Rogo integrates, minus banking-specific workflow agents
  - - Harvey
    - Likely entrant (adjacent vertical)
    - Legal AI agent platform expanding into asset management and fund formation
    - Not yet a direct competitor, but shares well-capitalized agent infrastructure and an overlapping asset-management customer base
  - - Intapp DealCloud (Celeste)
    - Adjacent bundled
    - Deal- and relationship-intelligence CRM with agentic AI
    - Complements rather than replaces Rogo; targets deal origination/relationship tracking, not research generation
  - - Daloopa
    - Adjacent substitute (niche)
    - Automated financial-data extraction from filings into models
    - Narrower point solution; CB Insights lists Rogo as a Daloopa alternative
  - - In-house bank-built GenAI (JPMorgan LLM Suite, Goldman GS AI Assistant)
    - Status quo / internal build
    - Proprietary generative-AI tooling built and hosted inside the bank
    - Reduces addressable market among the largest, best-resourced bulge-bracket accounts
  - - Human-analyst outsourcing (e.g., SP2 Analytics offshore CA/CFA/MBA analysts)
    - Status quo / substitute
    - Outsourced human research analyst staffing
    - Marketed explicitly as a lower-hallucination-risk alternative to AI research platforms
  notes: 'Representative, not exhaustive: the AI-for-finance vendor landscape includes dozens of smaller point solutions (e.g., Fiscal.ai, Quartr, Visible Alpha, Fintool, Metal) not separately profiled here; see enumerationScope.'
