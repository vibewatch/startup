- id: switching-costs-lockin-distribution-power
  title: Switching Costs, Lock-In, Multi-Homing, and Distribution Power
  body: 'Distribution power in this market is often decided before a formal vendor evaluation ever starts. The clearest evidence is negative: when Ensis Partners, a restructuring-focused investment bank founded in February 2026, needed deal- and relationship-management infrastructure, its founders selected Intapp DealCloud with no competing-platform evaluation at all, because both had deployed DealCloud personally at prior firms (PJT Partners, Perella Weinberg, Blackstone, Citigroup). That pattern -- banker alumni networks defaulting to whatever platform they already know -- favors whichever vendor has the broadest existing footprint among the exact professionals doing the buying, and it is a distribution advantage Rogo cannot fully replicate as a newer entrant. Multi-homing is the norm rather than the exception in this category: buyers evaluating Rogo or Hebbia are explicitly advised by third-party comparison guides to also run a source-specific platform such as AlphaSense or FactSet in parallel, since no single tool covers both deal-workflow generation and deep market-data breadth. LSEG''s dual role as both Rogo''s data-licensing partner and the seller of its own Deep Research agent introduces a coopetition-specific lock-in risk: if LSEG were to prioritize its native Workspace agent, the terms governing Rogo''s continued data access become a material contract-risk question this chapter cannot resolve from public sources alone. Meanwhile, large banks that have already invested in proprietary in-house GenAI (JPMorgan''s LLM Suite, Goldman''s GS AI Assistant) face their own switching disincentive in the opposite direction: having built internal infrastructure and governance around a home-grown tool, they have less reason to add a fully external vendor for the same workflows Rogo targets, at least for the bulge-bracket accounts with the internal engineering resources to build and maintain it.'
