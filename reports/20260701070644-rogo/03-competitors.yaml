- id: TP005
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat Claim
  - Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - Deep integration with bank systems (SharePoint, CRM, data rooms) and licensed data partnerships (LSEG, PitchBook, S&P Global)
    - Data/platform incumbents (Bloomberg, FactSet, LSEG, S&P Global) are building native GenAI directly into terminals banks already license and pay for
    - High
    - Compare Rogo's multi-year contract renewal cadence against each incumbent's AI-feature rollout timeline; request named-account overlap data
  - - Workflow-native agentic automation (Felix) for banker-specific tasks (CIMs, comps, memos)
    - Horizontal AI copilots (Microsoft 365 Copilot, Glean) already licensed enterprise-wide could add finance-specific fine-tuning at low incremental cost
    - Medium
    - Track Microsoft Copilot for Finance's banking-specific agent rollout, win rates, and governance-driven adoption delays versus Rogo
  - - Customer trust and reference base (Baird, Moelis, Nomura, Tiger Global)
    - Bulge-bracket banks (JPMorgan, Goldman Sachs, Morgan Stanley) are building proprietary in-house GenAI, shrinking the addressable market among the largest, most profitable accounts
    - High
    - Diligence Rogo's penetration split between bulge-bracket/global banks versus middle-market, boutique, and PE firms lacking internal AI build budgets
  - - Data-room / diligence document-intelligence overlap with Hebbia's Matrix
    - Hebbia is a well-capitalized (~$700M valuation) direct competitor with an overlapping enterprise financial-services customer base and expanding modeling-agent capability
    - High
    - Request head-to-head win/loss data and named-account overlap between Rogo and Hebbia
  - - Excel-automation claims following Rogo's Subset/Offset acquisition
    - F2's independently benchmarked native Excel computation engine (95.25% on SpreadsheetBench Verified) sets a public reliability bar Rogo has not yet matched with disclosed benchmark results
    - Medium
    - Request Rogo's own SpreadsheetBench-style benchmark results or third-party audit of its Excel automation accuracy
  - - Category-wide AI reliability and trust
    - Independent benchmarks (BankerToolBench, JurisTech) show no current AI model reliably produces client-ready banking output without human revision, which could slow enterprise-wide adoption or push banks back toward analyst outsourcing or internal build
    - Medium
    - Request Rogo's own accuracy/hallucination benchmark results and evidence of its human-in-the-loop review workflow
  - - LSEG data-partner relationship
    - LSEG is simultaneously a licensed data supplier and a direct competitor via its own Deep Research agent, creating coopetition risk if LSEG favors its native product
    - Medium
    - Clarify contractual protections (data-access continuity, non-compete terms) governing the Rogo-LSEG partnership
  notes: Severity ratings reflect this chapter's qualitative assessment of likelihood and potential impact based on evidence reviewed, not a vendor-disclosed or third-party-audited risk score.
