companyProfile:
  summary: >
    Rogo is a New York-based AI company that builds an enterprise research and workflow-automation platform purpose-built
    for investment banks, private equity firms, and asset managers, anchored by its autonomous Felix agent. Co-founded by
    Gabriel Stengel (CEO), John Willett, and Tumas Rackaitis (CTO) -- all Princeton classmates -- the company grew from a
    2024 seed round to a $160 million Series D at a reported $2 billion valuation in April 2026, compounding financing and
    user adoption roughly every few months since its 2022 founding (Rogo's own earlier materials and a competitor analysis
    cite 2021).
  founders:
    - name: Gabriel Stengel
      role: CEO and Co-Founder
      background: Former investment banking analyst at Lazard; the frustration of repetitive Excel/PowerPoint work as a junior banker is described as the direct catalyst for Rogo.
      claimRefs:
        - CO004
        - CO007
    - name: John Willett
      role: Co-Founder; leads European expansion
      background: Previously worked at J.P. Morgan Chase and Barclays; now runs Rogo's London office opened alongside the Series C.
      claimRefs:
        - CO005
        - CO008
    - name: Tumas Rackaitis
      role: Co-Founder and Chief Technology Officer
      background: Holds a computer science degree from Oberlin College; named technical architecture lead.
      claimRefs:
        - CO006
        - CO009
  foundingLocation: New York, NY (Manhattan)
  headquarters: New York, NY, United States
  productSummary: >
    Felix, an autonomous AI agent launched alongside the April 2026 Series D, executes multi-step financial workflows --
    deal screening, CIM generation, buyer outreach, and data-room diligence -- by combining fine-tuned financial-reasoning
    models with integrations into a client firm's internal systems (SharePoint, CRM, data rooms) and licensed external data
    (FactSet, LSEG, S&P Global, PitchBook). Named product lines such as "Rogo Research" or "Rogo Comps" could not be
    corroborated against current company materials; Felix plus licensed-data connectors is the verified public product
    structure.
  customerFocus: Investment banks, private equity firms, and asset managers, with named institutional clients including Rothschild & Co, Jefferies, Lazard, Moelis, Nomura, J.P. Morgan, Bank of America, Wells Fargo, and Baird.
  businessModel: >
    Enterprise SaaS-style licensing sold directly to financial institutions, layered with an agentic add-on (Felix); no
    source discloses Rogo's own per-seat or per-contract pricing, though comparable AI-native research platforms
    (AlphaSense, Glean) price in the $10,000-$60,000+ per-seat/annual-commitment range.
  stage: late-stage private (Series D)
  fundingStatus: >
    $160 million Series D led by Kleiner Perkins closed April 29, 2026 at a reported $2 billion valuation, nearly tripling
    the $750 million Series C mark set three months earlier; total funding raised across seed through Series D exceeds
    $300 million, with Sequoia, Thrive Capital, Khosla Ventures, J.P. Morgan Growth Equity Partners, and other repeat
    investors participating.
  disclosureProfile: private-undisclosed
  claimRefs:
    - CO038
    - CO039
summary:
  headline: >
    Rogo is a fast-compounding, well-financed vertical AI platform for Wall Street with concrete institutional traction,
    but its $2 billion Series D price has outrun every public revenue, margin, and retention disclosure, warranting
    research-more rather than a directional buy or avoid call.
