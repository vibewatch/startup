  topStrengths:
    - "Concrete, quantified institutional traction: 35,000+ professionals at 250+ institutions, with a published Baird Equity Research case study showing 85% weekly and 70% daily active usage -- unusually strong proof for a company of this age."
    - "High-conviction financing syndicate: the same core investors (AlleyCorp, Khosla, Thrive, Sequoia) reinvested through every priced round plus Kleiner Perkins at Series D, nearly tripling the valuation from $750M to $2B in three months."
    - A workflow-integration and licensed-data moat (SharePoint/CRM/data-room integrations plus FactSet/LSEG/S&P/PitchBook connectors) that independent technical coverage frames as more defensible than the underlying model itself.
  topRisks:
    - No source discloses Rogo's own current-year ARR, gross margin, net revenue retention, or cash position, so the $2B valuation cannot be benchmarked against company-specific economics -- only third-party estimates and comparable-company multiples.
    - "Derivation-level accuracy gap: an expert-authored benchmark (BigFinanceBench) finds the best-performing AI agent reaches only 58.8% of rubric points checking each step of a financial derivation, implying client-ready Felix outputs can look complete while embedding uncaught errors."
    - A fast-tightening regulatory perimeter (EU AI Act enforcement from August 2026, FINRA/SEC/OCC scrutiny of GenAI in finance) with no independent audit corroborating Rogo's self-reported SOC 2 / ISO 27001 / ISO 42001 / EU AI Act compliance claims.
    - Incumbents (Microsoft Copilot for Finance, Bloomberg's agentic Terminal, S&P Global/Kensho) are building competing or adjacent agentic capability into products with existing distribution and data, contesting the same workflow layer.
    - "Thin independent customer verification: only about eight institutions are named or quoted across all fetched sources against a claimed base of 250+, alongside one anonymous but concrete churn report."
  unresolvedGaps:
    - Company-confirmed current-year ARR, revenue run-rate, gross margin, and cash position/burn rate remain undisclosed -- the single largest blocker to independently underwriting the $2B price.
    - No independent auditor, certificate registry, or regulator confirms Rogo's self-reported EU AI Act, SOC 2, or ISO 27001/42001 compliance claims.
    - Founder-retention, earn-out, and vesting terms for the Subset, Offset, and Plux acquisitions are undisclosed, leaving execution risk on recently acquired technical capability unquantified.
    - Data-provider contract terms (LSEG, PitchBook, FactSet/S&P entitlements) -- exclusivity, pricing, renewal dates -- are not public, despite LSEG also fielding a competing research agent.
    - Current headcount is only partially disclosed (~100 employees per Forbes vs. a leadership target of ~300 by year-end 2026 per Bloomberg), and no named CFO, CCO, or CRO appears in any source reviewed.
