callouts:
  - calloutType: risk
    title: No public enforcement or litigation record does not mean no exposure
    body: >-
      No source reviewed for this chapter identifies a pending lawsuit, SEC/FINRA action, or confirmed breach naming Rogo.
      Given ~100% YoY growth in AI-related securities litigation from 2023-2024 and continued growth into 2026, plus an SEC
      unit built specifically to pursue AI-washing, this is an absence to monitor quarterly, not a clean bill of health to
      bank on.
    claimRefs:
      - CR020
      - CR021
  - calloutType: risk
    title: Regulatory perimeter tightens on a clock that lands inside this diligence window
    body: >-
      The EU AI Act's high-risk and GPAI enforcement powers activate August 2, 2026, roughly one month after this run's
      date, while US bank model-risk guidance was just loosened and explicitly excludes GenAI pending future rulemaking -- a
      mismatch that leaves Rogo's bank customers without a settled supervisory answer at the exact moment EU obligations
      tighten.
    claimRefs:
      - CR015
      - CR017
  - calloutType: risk
    title: Valuation has outrun disclosure
    body: >-
      Rogo's valuation nearly tripled from ~$750M to ~$2B in three months (Jan-Apr 2026) with no public ARR, margin, or
      retention figure to anchor the multiple, at the same time several tech investors and analysts were publicly debating
      an AI-sector valuation correction.
    claimRefs:
      - CR038
      - CR039
      - CR040
  - calloutType: assumption
    title: Self-reported compliance and security claims are not independently audited in sources reviewed
    body: >-
      Rogo's Trust Center lists SOC 2, ISO 27001, ISO 42001, and EU AI Act compliance documentation, and names reference
      institutions as having reviewed its security posture, but no independent auditor confirmation, certificate-registry
      entry, or regulator statement corroborating these claims was found in this chapter's source set.
    claimRefs:
      - CR016
      - CR031
  - calloutType: recommendation
    title: Treat forward-deployed hiring velocity as a leading indicator
    body: >-
      Because Rogo's growth model depends on scaling a labour category (forward-deployed bankers/engineers) that is growing
      in demand far faster than supply industry-wide, tracking Rogo's own forward-deployed headcount and time-to-fill is a
      more current signal of near-term growth capacity than logo count alone.
    claimRefs:
      - CR044
      - CR045
