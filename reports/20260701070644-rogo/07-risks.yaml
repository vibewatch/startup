  - id: sec704
    title: Customer, Procurement, and Reference-Bias Risk
    body: >
      Rogo's reference customers are also its concentration risk. Publicly named production users -- Baird Equity Research,
      Jefferies, Rothschild & Co, Nomura, Moelis, and Lazard among the reference institutions listed on Rogo's own Trust
      Center -- are exactly the kind of marquee logos a growth-stage vendor needs, but a platform selling into fewer than a
      few hundred large financial institutions is structurally exposed to the loss, non-renewal, or public dissatisfaction
      of any single top-tier account, and no independent source reviewed for this chapter discloses per-customer revenue
      concentration, net revenue retention, or contract length for Rogo [CR031]. Enterprise AI procurement into investment
      banks and asset managers is also a long-cycle, multi-stakeholder process -- typically 9-24 months from first contact
      to signed contract once legal, compliance, risk, and IT security sign-off are included -- which slows Rogo's ability
      to convert pipeline into revenue growth at the pace its valuation trajectory implies, and gives incumbents (Bloomberg,
      FactSet, Microsoft) more time to close feature gaps before a competitive evaluation concludes [CR032].

      Reference bias is a distinct, harder-to-detect risk: the public praise available for Rogo comes almost entirely from
      Rogo's own customer pages, sponsored partner announcements, and press coverage of funding rounds, with only a thin,
      low-volume layer of independent, unsolicited review evidence (PeerSpot's Rogo listing reads as vendor-style
      descriptive copy rather than named user complaints, and Rogo's Trustpilot profile could not be independently verified
      during this run) [CR033]. The clearest unsolicited, practitioner-level discussion found is a Wall Street Oasis thread
      in which a mid-market bank product team asks peers for real-world opinions on Rogo, Hebbia, and ModelML, explicitly
      framing their own evaluation criteria as "accuracy, automating workflows, and the tool not being gimmicky" -- language
      that reads as skeptical of vendor marketing claims by default and underscores that even Rogo's own target buyers do
      not treat "AI accuracy" claims as self-evidently true [CR034]. Competitor-published comparison content (Hebbia, o11,
      F2) is directionally useful for feature positioning but is not independent evidence and should be discounted
      accordingly in any accuracy or reliability claim [CR035].

      Procurement and concentration risk also runs through Rogo's own vendor stack: any large bank customer performing the
      same third-party AI vendor-oversight diligence FINRA and the amended Regulation S-P now require of broker-dealers
      would need Rogo to produce audit logs, model-change documentation, and incident-response evidence on demand, which is
      a growing compliance cost for Rogo to bear across 250+ institutional relationships even where no incident exists
      [CR036]. The net effect is that Rogo's growth narrative currently rests on adoption breadth (35,000+ users, 250+
      institutions) more than on disclosed depth (retention, expansion, or per-seat economics), a gap this report's
      customers chapter also flags and that is directly relevant to how much weight a diligence process should place on
      logo-driven growth claims [CR037].
