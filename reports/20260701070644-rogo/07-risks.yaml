  - id: TR005
    title: Mitigation and kill criteria table
    subtitle: Monitorable triggers that would change the investment view on Rogo
    claimRefs:
      - CR015
      - CR021
      - CR025
      - CR038
      - CR041
      - CR043
      - CR045
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - EU AI Act non-compliance
        - Rogo or a named customer faces an EU AI Office information request, model-access demand, or recall action
        - Any formal AI Office enforcement action after Aug 2 2026
        - "Escalate diligence on Rogo's EU legal entity and customer-facing compliance representations; re-underwrite EU revenue exposure"
      - - AI-related securities/enforcement action
        - SEC litigation release, FINRA disciplinary action, or private securities suit naming Rogo
        - Any filing naming Rogo as a party or material fact witness
        - Pause new commitment pending outcome; reassess governance and disclosure controls
      - - Microsoft Copilot bundling erosion
        - Independent benchmark or customer survey showing meaningful share loss on commoditizable workflows (variance analysis, standard model builds) to bundled Copilot agents
        - Documented loss of >=2 named reference accounts to in-Office alternatives within 12 months
        - "Reassess differentiation thesis toward forward-deployed depth vs. Microsoft's expanding baseline"
      - - Valuation-fundamentals gap closes (or widens)
        - Rogo discloses ARR/revenue growth/margin (e.g. at a future raise, S-1, or press disclosure)
        - First disclosed audited or investor-verified revenue figure
        - Re-run valuation stance once real revenue multiple is calculable instead of inferred from usage counts
      - - Down round / repriced financing
        - A subsequent Rogo financing round or secondary print below the $2B Series D valuation
        - Any priced round or verified secondary transaction below $2B
        - Treat as confirmation of an AI-sector correction affecting Rogo specifically; revisit entry price discipline
      - - FDE/forward-deployed hiring stalls
        - "Rogo's own careers page or hiring reports show open forward-deployed roles aging beyond typical 3-month fill time at scale"
        - Sustained (2+ quarter) increase in unfilled forward-deployed roles
        - Downgrade near-term new-logo growth assumptions; treat onboarding backlog as a leading indicator
      - - Independent accuracy/incident disclosure
        - A named customer, regulator, or press investigation documents a material Rogo output error in a live transaction
        - One or more independently corroborated incident reports
        - Treat as a thesis-relevant reliability event; reassess product risk section entirely
    notes: Triggers are forward-looking monitoring criteria authored for this diligence process, not predictions; thresholds are illustrative and should be recalibrated once Rogo discloses more operating detail.
