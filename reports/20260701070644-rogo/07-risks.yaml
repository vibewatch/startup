  - id: sec705
    title: Valuation and Capital-Markets Risk
    body: >
      Rogo's valuation has moved faster than any public disclosure of the fundamentals that would normally justify it. The
      company reportedly went from a roughly $750M valuation at its January 2026 Series C to a $2B valuation at its April
      2026 Series D just three months later, a near-tripling led by Kleiner Perkins with Sequoia, Thrive Capital, Khosla
      Ventures, and J.P. Morgan Growth Equity participating [CR038]. No source reviewed in this or the financials chapter
      discloses audited revenue, gross margin, net revenue retention, or profitability for Rogo; the public narrative rests
      on user counts (35,000+) and institution counts (250+) rather than a disclosed ARR or growth-rate figure investors
      could use to sanity-check the implied revenue multiple [CR039]. That gap matters more, not less, at a $2B valuation,
      because the wider AI funding market is showing signs of a correction: several tech-industry analysts and investors
      were, as of January 2026, actively debating whether AI-sector valuations represent a bubble, citing a disconnect
      between roughly $400B in annual AI investment and a much smaller measured enterprise-productivity return, alongside
      survey evidence that a majority of enterprises report no measurable productivity improvement from AI deployments so
      far [CR040].

      If Rogo's growth decelerates below the rate implied by its funding cadence, or if a broader AI-valuation correction
      compresses comparable private multiples, Rogo would be exposed to a down round or a materially reduced IPO/exit
      valuation relative to its most recent primary price -- a pattern already visible at other late-stage AI-adjacent
      companies during 2025-2026 repricing [CR041]. AI-related securities litigation risk (Section 2) compounds this:
      plaintiffs' firms and the SEC's Cybersecurity and Emerging Technologies Unit have both grown their focus on
      disconnects between AI-driven growth narratives and disclosed fundamentals, a dynamic that would apply directly to
      Rogo if it pursues a public listing while its AI-driven revenue and retention claims remain largely undisclosed
      [CR042]. Until Rogo publishes (or is required to publish, e.g. at an S-1 stage) audited revenue, retention, and margin
      figures, any valuation stance on Rogo should be treated as provisional and heavily caveated by this disclosure gap
      [CR043].
