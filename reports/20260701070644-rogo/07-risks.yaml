  - id: sec703
    title: Competitive and Platform Dependency Risk
    body: >
      Rogo's harness-not-a-model architecture is a genuine strength against any single vendor's obsolescence, but it does
      not remove dependency -- it just spreads it across OpenAI, Anthropic, and Google, whichever of which currently wins
      Rogo's internal benchmark for a given task [CR022]. If any of those labs materially raises API pricing, restricts
      finance-sector access, or launches a directly competing finance product, Rogo's cost structure and differentiation
      narrow at the same time. Rogo's data layer is equally concentrated in a small number of licensed providers: LSEG (a
      strategic partnership announced in 2025, bringing fundamentals, consensus estimates, and M&A data into the platform)
      and PitchBook (deepened through 2025-2026 for private-capital deal, fund, and investor data) are both described by
      Rogo and by the providers themselves as central, expanding pillars of Rogo's data strategy, with contract renewal
      terms, pricing, and exclusivity not publicly disclosed [CR023]. Data providers increasingly build their own
      generative-AI layers directly into their terminals; any move by LSEG, PitchBook, FactSet, or S&P to restrict wholesale
      API access in favour of first-party AI features would directly impair Rogo's "grounded in licensed data" value
      proposition [CR024].

      Microsoft is simultaneously Rogo's largest strategic partner and its most credible platform threat. Rogo announced a
      Microsoft partnership and ships a native Excel plug-in, yet Microsoft's own 2026 roadmap folds increasingly capable,
      finance-specific Copilot agents -- variance analysis, DCF construction, reusable finance "skills," live connectors to
      FactSet/PitchBook/S&P-class data -- directly into the core Microsoft 365 Copilot subscription at no additional
      per-seat cost from October 2026, alongside a new Copilot Agent Store for third-party and first-party finance agents
      [CR025]. Because most of Rogo's target banks and asset managers are already Microsoft 365 customers, this bundling
      lowers the switching activation energy for at least the commoditizable slice of Rogo's workflow (variance
      explanations, standard model builds, data connectors) even if it does not yet match Rogo's forward-deployed,
      firm-specific configuration depth [CR026]. Independent competitor commentary frames Rogo and Hebbia as the two leaders
      on citation-linked, auditable financial research, with newer entrants (o11, F2) explicitly criticizing both for
      remaining "browser silo" tools that require moving data in and out of native Office apps rather than manipulating
      Excel cells or Word documents in place -- a workflow-friction critique that could matter more as Microsoft narrows
      that exact gap from inside Office itself [CR027].

      Capital-provider concentration is a milder but real dependency: Rogo's $160M Series D was led by Kleiner Perkins with
      continuing participation from Sequoia, Thrive Capital, Khosla Ventures, and J.P. Morgan Growth Equity, a syndicate
      that is diversified across top-tier late-stage investors but still concentrated among a small number of repeat backers
      whose continued conviction underpins Rogo's ability to raise a further round before profitability is independently
      demonstrated [CR028]. Bank-customer-as-strategic-investor dynamics (J.P. Morgan's participation alongside J.P. Morgan
      being a competitor building in-house AI tools) also introduce a governance question about whether investor and
      customer incentives could diverge if Rogo's largest bank customers accelerate their own in-house builds [CR029].
      Finally, Rogo's growth-through-acquisition strategy (Subset, Offset, Plux) concentrates integration risk in a small
      internal M&A team; each acquisition adds a distinct codebase, data-access pattern, and founder-retention question that
      compounds the platform-dependency picture rather than diversifying it [CR030].
