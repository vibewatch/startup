chapter:
  number: 7
  title: Risks
  summary: >
    Rogo's most decision-relevant risks cluster around product reliability at document and derivation scale, a
    fast-tightening US and EU regulatory perimeter for AI in finance, deep dependency on frontier model vendors and
    licensed data providers that Rogo does not control, and a valuation that has moved far faster than any public revenue,
    retention, or profitability disclosure. No public litigation, enforcement action, or confirmed security incident names
    Rogo as of this run; that absence is itself a diligence item given how fast AI-related securities litigation and
    regulatory examination activity is growing against AI vendors and their financial-services customers.

sections:
  - id: sec701
    title: Product and Output Risk -- Hallucination, Citation Granularity, and Scale
    body: >
      Rogo's core exposure is derivation quality, not headline accuracy. BigFinanceBench, a 928-item, expert-authored
      benchmark co-published with Rogo's own harness team on arXiv in June 2026, grades 36,241 rubric points that check each
      step of a financial derivation -- source choice, period and accounting-definition choice, assumptions, and calculation
      -- rather than only the final number, and finds that across ten current frontier and open-weight agents the
      best-performing system reaches only 58.8% of available rubric points, with final-answer accuracy acting as a "lossy
      proxy" for derivation quality [CR001]. Applied to Rogo's own Felix agent, this means a client-ready comp set, model,
      or memo can look complete and well-cited while still embedding a wrong period, a misapplied accounting definition, or
      an unstated assumption that a reviewing associate would need to catch -- a workflow-error risk that scales with the
      volume of decks, models, and memos Felix is designed to produce per analyst [CR002].

      Citation granularity compounds this: Rogo markets an audit trail and sourced research, but the granularity of a
      citation (page-level vs. paragraph-level vs. dataset-level) determines whether a banker can actually verify a number
      before it goes into a live deal document, and no independent, Rogo-specific benchmark of citation-to-source precision
      is publicly available [CR003]. The category-level precedent is unambiguous: FINRA's 2026 Annual Regulatory Oversight
      Report names "hallucinations" -- AI-generated information that is inaccurate or misleading -- as a top-line GenAI risk
      for member firms, and warns that firms relying on GenAI as part of a supervisory system must weigh "the integrity,
      reliability and accuracy of the AI model" [CR004]. Trade press coverage of the same report frames this as regulators
      "urging firms to be vigilant for the risk of hallucinations" in day-to-day operations [CR005].

      Document- and portfolio-scale handling is a second, related exposure. Felix is positioned to ingest data rooms,
      multi-year filings, and firm-private repositories simultaneously; independent technical coverage describes the product
      as an orchestration harness routing across multiple frontier models rather than a single fine-tuned model, a design
      that trades consistency for flexibility and pushes reliability engineering onto Rogo's own evaluation harness rather
      than a vendor-certified benchmark [CR006]. Outside finance, the starkest cautionary precedent is Deloitte Australia's
      AU$440,000 government report, which had to be partially refunded in late 2025 after outside academics found fabricated
      references and an invented quotation from a Federal Court judgment that had been generated by an undisclosed GPT-4o
      workflow and not caught before delivery [CR007]. That incident did not involve Rogo, but it is the clearest public
      evidence that a reputable professional-services firm's own internal review process failed to catch AI-fabricated
      content in a paid client deliverable -- exactly the failure mode Rogo's forward-deployed model is meant to prevent
      through human bankers in the loop, and exactly the failure mode diligence should test for directly rather than infer
      from marketing [CR008]. Separately, the 2026 wave of court sanctions for AI-hallucinated legal citations --at least
      $145,000 in first-quarter 2026 US penalties tied to fabricated case law -- shows the same failure pattern recurring
      across another high-stakes, citation-dependent professional domain [CR009].
