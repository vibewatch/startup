- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: 'Company Overview establishes Rogo''s full round-by-round financing chronology from its 2024 seed through the April 2026 Series D; this chapter does not restate that chronology and instead focuses on forward-looking capital adequacy. Two independent trackers broadly agree on the cumulative total: CB Insights lists $310.5 million raised across six rounds and Growjo lists $314 million, both consistent with the "more than $300 million" figure already established in Company Overview. An SEC Form D filed July 25, 2024 by "Rogo Series A ScOp SPV Jul 2024, a Series of CGF2021 LLC" -- a Delaware entity claiming a Section 3(c)(1) private-fund exemption -- independently confirms that at least one Series A investor, ScOp Ventures, routed its investment through a special-purpose vehicle rather than investing in Rogo directly; the filing does not itself disclose Rogo''s Series A valuation or round size, since Form D reporting for a feeder SPV covers the feeder''s own offering rather than the
    underlying portfolio company''s terms. On use of proceeds, Rogo''s official Series D announcement states the capital will deepen institutional partnerships, scale the Felix agentic platform, and accelerate global expansion, without a specific dollar allocation across those uses; coverage of the preceding Series C states those proceeds funded European growth, expanded R&D capacity, and cross-border support for North American partners, at a time when Rogo employed just over 100 people. None of the sources reviewed disclose Rogo''s cash on hand, monthly burn rate, or runway in months, so capital adequacy here rests on inference: the disclosed hiring commitment alone (422 new roles, roughly $14 million of HQ capex, and roughly $40 million of planned R&D spend) implies a capital-intensive near-term growth phase that will consume a material share of total funds raised well before any visible profitability inflection. Axios Pro''s January 28, 2026 exclusive independently corroborates the $750
    million Series C valuation already used in Company Overview, providing an additional independent data point for that figure even though the article itself is paywalled beyond its headline.'
