- id: gtm-hiring-and-sales-efficiency-proxies
  title: Go-to-Market Scale, Hiring, and Sales-Efficiency Proxies
  body: 'Rogo''s most concrete go-to-market proxy is disclosed user and institution counts rather than revenue: its official April 2026 Series D announcement states the platform is used by more than 35,000 financial professionals across 250-plus institutions, including Rothschild & Co, Jefferies, Lazard, Moelis, and Nomura. Three months earlier, at the January 2026 Series C, independent coverage put the same figures at roughly 25,000 professionals across 50-plus tier-one firms -- implying meaningful growth in named users and a much larger jump in the count of institutions with any exposure to the platform, though the institution figure likely captures a broader definition of usage than paying enterprise seats alone. On the supply side, Rogo is scaling hiring aggressively: a Growjo estimate (low-confidence, algorithmically generated) puts headcount near 292 with 143% year-over-year growth, and Rogo''s live careers board listed 56 open roles as of the access date for this chapter, spanning
    engineering, sales, product, security, and customer-success functions across New York, London, and Singapore. New York State''s Empire State Development agency has separately confirmed it is offering Rogo up to $6.5 million in performance-based Excelsior Jobs Program tax credits tied to 422 new full-time positions and nearly $14 million invested in its Manhattan headquarters -- a public commitment that only pays out if Rogo hits the underlying hiring and investment milestones. As a sales-efficiency proxy, Rogo''s own claimed 10-plus hours saved per week per user sits above the 6.4-hour median found in a cross-vendor 2026 AI-agent productivity benchmark compiled from McKinsey, Gartner, Forrester, Bain, Deloitte, BCG, and MIT Sloan research, which also finds only 41% of AI-agent deployments hit year-one ROI targets and a 6.7-month average payback -- useful external yardsticks against which Rogo''s self-reported number should be tested rather than accepted at face value.'
