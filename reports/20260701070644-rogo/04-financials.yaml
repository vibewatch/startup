- calloutType: risk
  title: A $2 Billion Valuation With No Disclosed ARR to Benchmark It
  body: 'Rogo''s April 2026 Series D valued the company at $2 billion, but no source reviewed in this or the Company Overview chapter discloses a current annual recurring revenue figure. Comparable AI-native research platforms show just how wide the resulting uncertainty is: AlphaSense trades at roughly 12.5x its disclosed $600M 2026 ARR, while Glean trades at roughly 36x its disclosed $200M 2026 ARR. Applying that same band to a low-confidence third-party ARR estimate for Rogo (~$43.2M, Growjo) would imply a multiple of roughly 46x-93x -- above every comparable in this chapter -- which shows the conclusion is only as good as an unverified estimate, not a company-confirmed number.'
  claimRefs:
  - CI035
  - CI036
- calloutType: insight
  title: Comparable AI Research Platforms Bound a Wide but Informative Multiple Range
  body: AlphaSense's disclosed $10,000-$20,000 per-seat pricing and Glean's estimated $45-50+ per-user-per-month pricing both sit well above Microsoft Copilot's $30/user/month, suggesting enterprise financial-AI platforms like Rogo can plausibly command premium per-seat economics even without public pricing. These comparables are the most useful available lens for bounding Rogo's own likely contract value and valuation multiple until the company discloses its own figures.
  claimRefs:
  - CI007
  - CI008
  - CI035
- calloutType: risk
  title: AI-Native Cost Structure Likely Compresses Margin Below Legacy Data Peers
  body: Industry benchmarks put AI-native SaaS gross margins at 55-70%, versus FactSet's disclosed ~52.7% FY2025 gross margin as a legacy financial-data incumbent and 78-85% for traditional (non-AI) SaaS. Because inference now consumes an estimated 55-80% of enterprise AI GPU spend, Rogo's own margin -- undisclosed in every source reviewed -- is more likely to sit in the compressed AI-native band than at legacy-SaaS levels, which has direct implications for the durability of its valuation multiple.
  claimRefs:
  - CI019
  - CI020
  - CI021
- calloutType: recommendation
  title: Prioritize a Confirmed ARR Figure, Margin Data, and Cash Position Before Underwriting
  body: The three most consequential blocking gaps identified in this chapter are a company-confirmed current ARR figure, a gross-margin/COGS breakdown, and disclosed cash position and burn rate. Every valuation-multiple, margin, and capital-adequacy conclusion in this chapter is a bounded estimate built on comparable-company benchmarks rather than Rogo-specific data, and should be treated as provisional until these three items are obtained directly from Rogo.
  claimRefs:
  - CI022
  - CI029
  - CI042
