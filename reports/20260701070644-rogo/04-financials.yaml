- id: cost-structure-and-margin-drivers
  title: Cost Structure and Margin Drivers
  body: 'Rogo does not disclose gross margin, COGS composition, or model-inference spend in any source reviewed, so this chapter can only bound the likely range using comparable-company and industry benchmarks. An independent LLMOps technical review describes Rogo''s layered use of OpenAI models -- GPT-4o for user-facing Q&A, o1-mini for data contextualization, and the more expensive o1 reserved for high-stakes evaluation and reasoning -- as a deliberate cost-optimization pattern that limits use of the priciest model tier to the workloads that need it most. That pattern is consistent with 2026 GPU FinOps benchmarking showing inference now consumes 55-80% of enterprise AI GPU spend, with cost-per-million-tokens ranging from roughly $1.67 on A100 GPUs to $4.54-plus on H200 GPUs, and a single 70-billion-parameter model serving realistic enterprise traffic capable of running roughly $347,000 per year in compute alone. Broader industry analysis of AI-first B2B SaaS economics estimates gross margins
    of 55-70% for AI-native software, versus 78-85% for traditional SaaS, driven by variable inference COGS of 20-40% of revenue against under 5% for classic SaaS -- a materially different economic profile than the legacy financial-data incumbents Rogo competes with. FactSet Research Systems'' fiscal 2025 10-K, filed with the SEC in October 2025 for the year ended August 31, 2025, together with aggregated third-party data drawn from the same filing, show FactSet''s trailing-twelve-month gross margin at approximately 52.7% on $2.32 billion of revenue -- a legacy-infrastructure benchmark that predates AI-inference-driven cost structures and should not be read as a Rogo-specific figure. Rogo''s own service-delivery model compounds the cost question: a competitor comparison page describes Rogo''s "white-glove banker-led implementation," implying materially higher service-delivery cost per enterprise account than a self-serve product, though no source quantifies that cost.'
