summary:
  headline: >
    Rogo 是面向 Wall Street 的垂直 AI 平台，增长很快、融资充足，也有具体机构 traction；但其 $2 billion Series D
    价格已经跑在所有公开收入、利润率和留存披露前面，因此应继续研究，而不是给出方向性买入或回避。
