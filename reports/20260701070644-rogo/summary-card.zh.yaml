  topStrengths:
    - 具体且量化的机构 traction：35,000+ 名专业人士、250+ 家机构；已发布的 Baird Equity Research 案例显示 85% 周活和 70% 日活，对这个阶段的公司来说是少见强证据。
    - 高确信融资财团：同一批核心投资人（AlleyCorp、Khosla、Thrive、Sequoia）连续参与每一轮定价融资，Series D 又加入 Kleiner Perkins，估值三个月内从 $750M 近三倍升至 $2B。
    - 工作流集成和授权数据护城河（SharePoint/CRM/data-room 集成，加上 FactSet/LSEG/S&P/PitchBook connectors）；独立技术报道认为，这比底层模型本身更可防守。
  topRisks:
    - 没有来源披露 Rogo 自身当年 ARR、毛利率、净收入留存或现金头寸，$2B 估值无法按公司具体经济性对标，只能靠第三方估计和可比公司倍数。
    - >-
      推导级准确率缺口：专家编写的基准 BigFinanceBench 显示，表现最佳的 AI agent 在逐步核对金融推导时只拿到 58.8% rubric points，意味着面向客户的 Felix
      输出可能看起来完整，却嵌入未被发现的错误。
    - >-
      监管边界快速收紧（EU AI Act 自 August 2026 执法、FINRA/SEC/OCC 审查金融 GenAI），且没有独立审计佐证 Rogo 自报的 SOC 2 / ISO 27001 / ISO 42001 /
      EU AI Act 合规主张。
    - >-
      既有厂商（Microsoft Copilot for Finance、Bloomberg 的 agentic Terminal、S&P Global/Kensho）正在把竞争或相邻 agentic
      能力塞进已有分发和数据产品，争夺同一工作流层。
    - 独立客户验证很薄：相对 250+ 声称客户，所有抓取来源中只有约八家机构被点名或引用，另有一条匿名但具体的流失报告。
  unresolvedGaps:
    - 公司确认的当年 ARR、收入运行率、毛利率和现金头寸 / 烧钱速度仍未披露——这是独立承销 $2B 价格的最大阻碍。
    - 没有独立审计方、证书注册库或监管机构确认 Rogo 自报的 EU AI Act、SOC 2 或 ISO 27001/42001 合规主张。
    - Subset、Offset 和 Plux 收购中的创始人留任、earn-out 和 vesting 条款未披露，近期买入技术能力的执行风险无法量化。
    - 数据供应商合同条款（LSEG、PitchBook、FactSet/S&P entitlements）——独家性、定价、续约日期——未公开；LSEG 自身也在推出竞争性研究 agent。
    - 当前员工数仅部分披露（Forbes 称约 100 人，Bloomberg 称管理层目标是到 2026 年底约 300 人），且所有已查来源都没有出现具名 CFO、CCO 或 CRO。
