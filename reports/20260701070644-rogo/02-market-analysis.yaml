- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Junior-banker cost and capacity pressure
    - Driver
    - Now (2026)
    - Banks have a direct incentive to buy automation that displaces the most expensive-to-train junior headcount
    - Verify Rogo's actual seat growth against banks' reported analyst-class size cuts
  - - LP/investor pressure on GPs to show AI-enabled value creation
    - Driver
    - Now through 2027
    - Creates a budget mandate for AI tooling that is partly independent of proven per-deal ROI
    - Ask GPs how AI spend is reported to LPs and whether it is scrutinized in fundraising due diligence
  - - Frontier-model commoditization (e.g., Anthropic finance agent templates)
    - Constraint (compresses vendor moat)
    - Now through 2026
    - General-purpose model providers can replicate narrow workflow templates, pressuring point-solution pricing
    - Assess how much of Rogo's value is proprietary workflow/integration versus base model capability
  - - Incumbent bundling (Bloomberg, FactSet, Microsoft Copilot)
    - Constraint
    - Now through 2027
    - Buyers may get 'good enough' AI features bundled into existing terminal or Office spend rather than buying a new line item
    - Track whether incumbents' AI features are cannibalizing pilot budgets earmarked for point solutions
  - - FINRA/SEC regulatory oversight of generative AI
    - Constraint
    - Now (2026 exam cycle)
    - Raises compliance cost and can slow procurement absent documented governance controls
    - Confirm Rogo's compliance posture against FINRA Rules 3110/4370 and SEC recordkeeping expectations
  - - EU AI Act enforcement phase reaching financial services
    - Constraint
    - August 2026
    - Adds cross-border compliance burden for globally operating banks and PE firms
    - Assess EU-specific governance requirements for Rogo's European customers
  - - AI ROI skepticism / 'pilot fatigue' (MIT 95% failure-rate finding)
    - Constraint
    - Now (2026)
    - Buyers may pull back budget or demand faster, harder proof of ROI before expanding seats
    - Request Rogo's own realized productivity/ROI case data, not just pilot counts
  - - Talent / skills shortage for AI deployment
    - Constraint
    - Now through 2027
    - Even willing buyers may lack staff to operationalize and govern new AI tools, slowing rollout speed
    - Ask how much of Rogo's sales cycle involves buyer-side AI/governance staffing gaps
  notes: Directions and timings reflect the author's synthesis of the cited 2025-2026 analyst, regulatory, and news sources rather than a single ranked survey; treat timing estimates as directional.
