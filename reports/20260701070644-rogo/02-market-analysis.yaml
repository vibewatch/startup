  rows:
  - - AI research & workflow-automation software for IB/PE/AM (core category)
    - Agentic AI tools for comps pulls, diligence synthesis, pitchbook drafting, and modeling automation sold to banks, PE firms, hedge funds, and asset managers
    - Generic consumer AI chat; non-finance verticals
