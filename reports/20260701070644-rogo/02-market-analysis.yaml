callouts:
- calloutType: insight
  title: Two Credible Analyst Lenses Diverge by Roughly 30-40% on Scope and Growth Rate
  body: 'Precedence Research and The Business Research Company both cover "generative AI in banking/financial services" but disagree on base year, scope, and CAGR (24.81% vs. 34.5%). Rather than average these into a false single number, this chapter treats the divergence itself as a diligence signal: the category is too young and too broadly defined for analysts to agree on its boundary.'
  claimRefs:
  - CM001
  - CM002
  - CM003
- calloutType: risk
  title: Incumbent Bundling Is the Most Immediate Constraint on New Budget Lines
  body: Bloomberg, FactSet, and Refinitiv already sit inside the buyer's existing technology spend, and Microsoft's 2026 finance-specific Copilot features now compete for the same budget without requiring a new vendor relationship. A point-solution vendor must demonstrate a clear capability gap these bundles cannot close.
  claimRefs:
  - CM016
  - CM029
  - CM030
  - CM031
- calloutType: assumption
  title: No Public Source Isolates an IB/PE/AM-Specific SAM
  body: Every sizing lens reviewed either covers all of financial services (too broad) or all of banking and finance including non-AI-native categories (still too broad). This chapter deliberately does not manufacture a SAM by applying an arbitrary penetration rate to a mismatched TAM.
  claimRefs:
  - CM043
- calloutType: risk
  title: Regulators Made Generative AI a 2026 Examination Priority
  body: Both FINRA and the SEC elevated generative-AI governance, recordkeeping, and explainability to formal 2026 examination priorities, meaning buyer procurement teams now factor vendor compliance posture into deal timelines, not just product capability.
  claimRefs:
  - CM032
  - CM033
  - CM034
- calloutType: strength
  title: LP and Peer Pressure Create a Budget Mandate Independent of Proven Per-Deal ROI
  body: 60% of institutional investors say they favor hedge funds that meaningfully fund generative-AI research, and PE investors report AI-mature portfolio companies see nearly double the ROIC of peers. These dynamics push budget toward AI research tools even before every buyer can prove a hard per-seat ROI case.
  claimRefs:
  - CM028
  - CM010
