- id: TM002
  title: TAM/SAM/SOM or Sizing Lens Table
  columns:
  - Lens
  - Definition
  - Value / Estimate
  - Basis / Methodology
  - Confidence
  rows:
  - - Broad GenAI-in-financial-services TAM (2026)
    - All generative-AI software revenue across banking, insurance, asset management, and capital markets
    - $2.51B in 2026, rising to $17.88B by 2035
    - Precedence Research bottom-up model; 24.81% CAGR 2026-2035
    - Medium
  - - Narrower GenAI-in-banking-and-finance TAM (alternate lens)
    - AI software scoped specifically to banking and finance, excluding insurance
    - $1.75B in 2025, rising to $7.71B by 2030
    - The Business Research Company; 34.5% CAGR
    - Medium (conflicts with row 1 on scope and growth rate)
  - - CIB services revenue base (context, not an AI-specific figure)
    - Global corporate & investment banking services revenue that AI tools are automating into
    - $3.0 trillion in 2024
    - McKinsey's annual CIB report
    - High as context; not a software TAM
  - - Global private-equity AUM (buyer-side sizing anchor)
    - Total assets under management across the ~100 largest PE platforms
    - Approximately $8 trillion in 2026
    - Compiled ranking using Q4 2025 filings, earnings reports, and press releases
    - Medium
  - - Global asset-management-industry AUM (buyer-side sizing anchor)
    - Total AUM across the asset-management industry
    - $147 trillion in 2025
    - BCG Global Asset Management Report 2026
    - Medium
  - - SAM for IB/PE/AM-specific AI research automation (Rogo's stated category)
    - Software revenue narrowly scoped to agentic research/workflow tools bought by banks, PE firms, and hedge funds
    - Not independently isolated in any public analyst report reviewed
    - No analyst report separates this slice from broader GenAI-in-finance spend or from data-terminal incumbent revenue
    - Low / evidence gap
  - - SOM (Rogo's realistically obtainable revenue)
    - Rogo's obtainable share of the unresolved SAM above
    - Not calculable from public data
    - Requires private ARR, seat-count, and per-seat-pricing disclosure that Rogo has not published
    - Low / evidence gap
  notes: Rows 1-2 use materially different scope and unit assumptions and are preserved as contradictory published lenses rather than reconciled into a single number; rows 6-7 record an explicit sizing gap rather than a guessed figure, per the diligence philosophy for this chapter.
