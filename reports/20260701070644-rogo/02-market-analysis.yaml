- id: adoption-constraints-regulatory-friction
  title: Adoption Constraints, Regulatory Friction, and Diligence Gaps
  body: 'Three forces constrain how fast this budget converts into signed contracts. First, incumbent bundling: Microsoft shipped finance-specific Copilot capabilities in 2026, including a Finance Agent embedded in Excel, Outlook, and Teams targeting FP&A, accounting, tax, compliance, and treasury workflows (CM029, CM030), giving IT buyers a "good enough" bundled alternative inside spend they already approve -- even though Microsoft''s own Copilot paid-seat penetration was estimated at only about 3.3% of its installed base against $190 billion of 2026 AI capex, a gap that has drawn investor skepticism about incumbent AI monetization generally (CM031). Second, regulatory oversight: FINRA''s 2026 Annual Regulatory Oversight Report added a dedicated generative-AI section for the first time, flagging hallucination risk, bias, cybersecurity exposure, and extending supervision to autonomous "agentic" AI (CM032), while the SEC''s FY2026 exam priorities elevated scrutiny of AI governance, explainability, and "AI-washing" in marketing claims, requiring AI prompt/output logs to be retained as supervised books and records (CM033); vendors cannot outsource this compliance burden to buyers or claim ignorance (CM034), and the EU AI Act''s most consequential enforcement phase reaches financial services in August 2026 (CM040). Third, demand-side skepticism: MIT''s GenAI Divide study found a 95% failure rate among enterprise generative-AI pilots by a six-month ROI test (CM035), 61% of business leaders report more pressure to prove AI ROI than a year earlier (CM036), and talent/skills shortages were the top reason 71% of enterprises evaluated AI but did not implement it (CM039). None of these constraints are fatal to Rogo''s thesis, but together with the unresolved SAM/SOM gap (CM043) and the absence of a current, precise count of addressable US broker-dealers, they define the diligence path an investor should follow before underwriting a specific market-share assumption.'
