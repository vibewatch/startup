chapter:
  number: 2
  title: Market Analysis
  summary: Rogo competes in a narrow but fast-moving category -- AI research and workflow automation purpose-built for investment banks, private equity firms, and asset managers -- that sits between entrenched financial-data terminals and general-purpose AI office copilots, with credible analyst lenses disagreeing by 30-40% on the category's size and no public source yet isolating a serviceable addressable market specific to Rogo's buyers.
sections:
- id: market-definition-boundary
  title: Market Definition and Boundary
  body: 'Rogo competes in AI research and workflow automation purpose-built for investment banks, private equity firms, and asset managers -- a narrower category than "AI in financial services" or generic AI office productivity software. Third-party trackers describe the product as a domain-specific research assistant that integrates internal and external financial data sources for banking, PE, and hedge-fund users, distinct from general-purpose large-language-model chat assistants (CM042, CM021). The addressable services base this category automates into is large: global corporate and investment banking revenue reached $3.0 trillion in 2024 (CM004), and the global equity research industry alone generates roughly $8.7 billion in annual revenue even after a roughly 18% decline in US sell-side analyst headcount since 2015 (CM017, CM018). The category sits between two very different substitutes. On one side, incumbent financial-data terminals -- Bloomberg (~33% share, ~$27,660/seat/year), Refinitiv Eikon (~20% share), Capital IQ, and FactSet ($12,000/seat/year) -- bundle data delivery with increasingly capable analytics layers and represent the entrenched status quo (CM014, CM015, CM016). On the other, general-purpose AI office copilots such as Microsoft 365 Copilot are finance-agnostic out of the box and compete for the same enterprise AI budget line without the licensed-data integrations or deal-specific workflows the core category requires (CM041). Legal- and consulting-focused AI research tools are explicitly excluded: they serve a different buyer (law firms, consultancies) and a different workflow, even though they use similar underlying model technology.'
  claimRefs:
