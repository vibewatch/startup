  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: sizing-gap
    missingEvidence: An analyst report or company disclosure that isolates IB/PE/AM-specific AI research-automation software revenue from the broader GenAI-in-financial-services or data-terminal categories.
    whyItMatters: Without an isolated SAM, Rogo's addressable-market claims cannot be checked against an independent third-party ceiling, which materially affects valuation and TAM-based growth assumptions.
    diligencePath: Request Rogo's own market-sizing methodology and seat/ACV assumptions, and monitor for a forthcoming vertical-specific analyst report (e.g., a dedicated 'AI for investment banking' category report).
    relatedQuestionRefs:
    - QM033
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: buyer-population
    missingEvidence: An authoritative, dated count of active US and global broker-dealers and investment banks for 2026 (e.g., a specific figure from the SIFMA Capital Markets Fact Book or a FINRA industry snapshot).
    whyItMatters: A precise buyer-population count would allow per-seat pricing to be converted into a bottom-up SAM instead of relying solely on top-down analyst TAM figures.
    diligencePath: Pull the current-year SIFMA Fact Book data tables or FINRA's industry snapshot directly, rather than relying on secondary summaries that could not confirm an exact 2026 figure.
    relatedQuestionRefs:
    - QM034
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmark
    missingEvidence: Rogo's and close competitors' (Hebbia, AlphaSense) actual per-seat annual contract values and seat counts, which are not independently published with verifiable sourcing.
    whyItMatters: Per-seat ACV is the key input for converting buyer headcount into a bottom-up SOM estimate and for judging pricing power relative to incumbent terminals.
    diligencePath: Seek disclosed ACV from customer references, procurement/RFP data, or a future funding-round data room rather than unverified marketing-page pricing claims.
    relatedQuestionRefs:
    - QM035
    relatedTableRefs:
    - TM002
