  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Disclosed NRR, GRR, logo-churn rate, or an investor-sourced retention cohort for Rogo's institutional accounts.
    whyItMatters: Without a quantified retention metric, durability of the ~250-institution customer base cannot be distinguished from a large but shallow pilot footprint.
    diligencePath: Request retention/renewal cohort data directly from Rogo, its board investors, or a reference-checkable sample of named accounts during live diligence.
    relatedQuestionRefs:
    - QU020
  - type: missing-source
    severity: material
    topic: contract-terms
    missingEvidence: Average or typical contract length and renewal cadence for institutional Rogo deployments.
    whyItMatters: Contract length materially changes revenue durability and switching-cost assumptions used in any valuation model.
    diligencePath: Request standard master-services-agreement terms and renewal history from Rogo or a named customer's procurement team.
    relatedQuestionRefs:
    - QU021
  - type: missing-source
    severity: blocking
    topic: revenue-concentration
    missingEvidence: Top-customer or top-10-account revenue concentration percentage.
    whyItMatters: Determines whether Rogo's growth depends on a small number of anchor accounts (e.g., Baird, Jefferies) whose loss or renegotiation could disproportionately affect revenue.
    diligencePath: Request a customer-cohort revenue breakdown from the company or lead investors under NDA.
    relatedQuestionRefs:
    - QU027
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Confirmation of seat expansion, renewal, or reduced usage for any named logo account since its initial deployment.
    whyItMatters: Logos alone do not prove ongoing production use; without a second-year data point for any named account, expansion versus stagnation cannot be assessed.
    diligencePath: Request a follow-up usage snapshot for Baird or another named account at least 12 months after its first disclosed metrics.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: minor
    topic: baird-engagement-metrics
    missingEvidence: A single reconciled Baird usage metric; three different figures are reported across sources (85% WAU / 70% DAU; 10,000+ weekly workflows at 95% engagement; 250K+ cumulative workflows).
    whyItMatters: Divergent metrics for the same flagship reference account make it hard to judge whether engagement is accelerating, steady, or being described inconsistently by different marketing surfaces.
    diligencePath: Ask Rogo or Baird directly which metric is current, what denominator each uses, and over what time window each was measured.
    relatedQuestionRefs:
    - QU008
    relatedTableRefs:
    - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: Public, sourced confirmation for the roughly 240-plus institutions beyond the seven to eight named or quoted logos identified in this chapter's fetched sources.
    whyItMatters: A claimed 250-plus institution base with fewer than ten independently named or quantified accounts leaves the vast majority of Rogo's customer proof unverifiable from public sources.
    diligencePath: Request a fuller, reference-checkable customer list or a sample of anonymized usage cohorts under NDA.
    relatedTableRefs:
    - TU003
acknowledgedWarnings:
- dimension: figureType
