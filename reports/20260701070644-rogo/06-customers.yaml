- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Forward-deployed banker model lowers switching friction for new bulge-bracket accounts
    - Same model relies on a small, hard-to-scale team of ex-banker deployment staff
    - Growth could outpace the forward-deployed team's capacity to onboard new accounts with the same white-glove motion
    - Ask for forward-deployed headcount versus institutional-account count
  - - Multi-model architecture (OpenAI, Anthropic, Google Gemini) reduces Rogo's own vendor lock-in
    - Institutions adopting Rogo become dependent on a single vendor (Rogo) for critical deal workflows
    - A Rogo outage, price change, or quality regression could disrupt customer deal timelines with no easy substitute mid-deal
    - Request business-continuity and multi-sourcing plans from Rogo
  - - Data-partner integrations (LSEG, PitchBook, Daloopa) expand workflow coverage for shared customers
    - Rogo's customer value proposition is contingent on maintaining all three data-licensing relationships simultaneously
    - Loss or renegotiation of any single data partnership could degrade the customer-facing product without Rogo controlling the outcome
    - Confirm minimum contract terms and renewal dates for each data partnership
  - - Boutique/mid-market expansion using bulge-bracket reference proof
    - Reference base still concentrated in a handful of named bulge-bracket logos (Jefferies, Lazard, Moelis, Nomura, Rothschild & Co)
    - If a marquee logo churns or downgrades, the credibility halo effect for boutique-bank sales could weaken disproportionately
    - Track renewal status of the five to six marquee named logos as a leading indicator
  - - Dual investor-customer relationships (Truist, J.P. Morgan) can accelerate procurement
    - Same overlap raises reference-bias and preferential-access questions specific to customer-proof credibility
    - External diligence cannot fully separate genuine product-market fit from investor-goodwill adoption for these accounts
    - Seek reference calls with non-investor customers to control for this bias
  - - Eight-month average POC-to-production sales cycle signals a repeatable enterprise motion once started
    - Same long cycle slows expansion and gives incumbent terminals (Bloomberg, FactSet, S&P Capital IQ) time to add competing AI features
    - Slower net-new account growth could compress the multiple justified by the current adoption narrative
    - Track quarter-over-quarter net-new institutional logo additions
  notes: Rows pair each expansion driver with its mirrored concentration risk rather than listing them separately, reflecting how the same mechanism cuts both ways in this evidence set.
