  - CU042
- id: deployment-compliance
  title: Deployment Model, Buying Motion, and Compliance Friction
  tableRefs:
  - TU006
  body: 'Rogo''s go-to-market motion is explicitly high-touch rather than self-serve. Its April 2026 Series D announcement states new capital funds "more forward-deployed bankers and engineers embedded within the firms we serve," and an independent recap describes this Forward Deployed Banker model in more detail: former finance professionals who physically embed inside partner institutions to drive adoption, explicitly compared to Palantir''s Forward Deployed Engineers. Rogo''s own Baird case study gives the clearest concrete example, describing in-person one-on-one sessions at Baird''s Milwaukee headquarters alongside office hours and direct outreach to individual users. OpenAI''s partner case study attributes a similar "deployment team of ex-bankers and investors" working with customers to refine features in real time, and Anthropic''s customer story quotes Rogo''s own Head of Product describing user sentiment shifting from skepticism to excitement once a workable output is validated -- a change-management pattern, not an instant-adoption one. That high-touch motion sits on top of real compliance friction: Jefferies'' CEO-hosted interview with Rogo''s founder describes jointly building Chinese-wall, MNPI-control, and role-based-access infrastructure before AI can touch live deal data, and Deloitte''s 2026 banking-agent risk guidance independently describes the kind of agent registries, audit trails, and disclosure layers regulated banks are expected to build before scaling any agentic deployment. Rogo''s own Trust Center publishes formal Acceptable Use, Access Control, and Asset Management policies as procurement collateral aimed at shortening that review, consistent with the roughly eight-month proof-of-concept-to-production sales cycle described elsewhere in this chapter.'
  claimRefs:
  - CU003
