callouts:
- calloutType: strength
  title: Jefferies and Truist proof clears an independent-domain bar
  body: Jefferies' own website hosting a leadership-spotlight interview with Rogo's CEO, and Truist Securities' CEO delivering an on-the-record quote, are stronger corroboration than a marketing logo wall alone -- few early-stage vertical AI vendors can point to customer-hosted, named-executive proof at this stage.
  claimRefs:
  - CU018
  - CU019
- calloutType: risk
  title: Fewer than ten accounts are independently named out of a claimed 250-plus
  body: Every fetched source in this chapter combined names or quotes only eight customers (Baird, Jefferies, Lazard, Moelis, Nomura, Rothschild & Co, Truist Securities, GTCR) against a reported base of 250-plus institutions and 35,000-plus users. That gap should temper how far the logo wall is trusted as evidence of broad, durable adoption.
  claimRefs:
  - CU025
  - CU017
- calloutType: risk
  title: A real, if anonymous, churn account exists
  body: An anonymous Wall Street Oasis poster reports churning from Rogo after about a year and calls it overhyped, while other posters in the same thread describe daily reliance and improvement since the Felix launch. This is the only concrete public churn signal found for Rogo and should be weighed as a directional flag, not dismissed simply because it is anonymous.
  claimRefs:
  - CU027
  - CU028
- calloutType: recommendation
  title: Prioritize retention economics and second-year account data in live diligence
  body: The single highest-value diligence path is requesting NRR/GRR, contract length, and a second-year usage snapshot for Baird or another named account; without those, adoption breadth cannot be distinguished from adoption depth.
  claimRefs:
  - CU026
  - CU044
  - CU045
