company:
  name: Rogo
chapter:
  number: 6
  title: Customers
  summary: 'Rogo''s customer proof is real but shallow relative to its claimed scale: a genuine, independent-domain-corroborated logo wall (Jefferies, Lazard, Moelis, Nomura, Rothschild & Co, Truist Securities) and one deeply quantified account (Baird Equity Research, ~85% weekly / ~70% daily active usage) sit against a reported base of 35,000-plus users at 250-plus institutions, with fewer than ten accounts independently named across all fetched 2026 sources, no disclosed retention economics, one concrete anonymous churn account, and layered concentration risk across marquee logos, AI-model providers, and third-party data partnerships.'
sections:
- id: customer-segmentation
  title: Customer Segmentation Across Finance Buying Layers
  tableRefs:
  - TU001
  figureRefs:
  - FU001
  body: 'Rogo''s own materials describe three primary buyer segments -- investment banks, private equity firms, and asset managers -- while Forbes'' independent profile substitutes hedge funds for asset managers, a small but real discrepancy in how the buyer base is framed across sources. The clearest, most concrete proof sits with bulge-bracket and global investment banks: Rogo''s official customer page individually labels logo placements for Jefferies, Lazard, Moelis, Nomura, and Rothschild & Co, corroborated by an independent 2026 funding writeup naming the same institutions as active users. Truist Securities adds an on-the-record CEO endorsement. Beyond the marquee logo wall, evidence thins quickly: a boutique-advisory-bank analyst and a $300B-AUM asset-management senior managing director appear only as anonymized testimonials on a third-party review aggregator, and GTCR is the sole named private-equity account, mentioned once in Series C funding coverage rather than in any dedicated case study. Equity research is the one segment with account-level depth, through the Baird Equity Research case study. Corporate finance and corporate-development teams appear only as an inferred use case drawn from Rogo''s own product positioning; no fetched 2026 source names a specific in-house account. Bulge-bracket procurement also looks structurally different from boutique or buy-side procurement, since Jefferies'' own leadership-spotlight interview with Rogo''s CEO frames the core sale as building compliance infrastructure around live deal data inside Chinese-wall and MNPI-controlled environments rather than a generic software purchase.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
- id: adoption-trajectory
  title: Adoption Trajectory and Scale Signals
  tableRefs:
  - TU002
  figureRefs:
  - FU002
  body: 'Rogo''s publicly reported scale has moved through at least four distinct data points in roughly eighteen months: over 5,000 bankers and 27x ARR growth in OpenAI''s 2024 partner case study, roughly 25,000 professionals processing 50,000 daily queries around the January 2026 Series C, a still-displayed 25,000-user/150-institution figure in Forbes'' company profile, and more than 35,000 professionals across 250-plus institutions in Rogo''s own April 29, 2026 Series D release, corroborated by an independent recap. That Forbes had not refreshed to the newer figure by this run''s access date is itself a useful freshness signal: public profiles of fast-growing private companies lag real usage by at least one funding cycle. Within that broader trend, Baird''s Equity Research deployment is the only account with reconcilable-in-principle usage detail, yet even there three different metrics circulate: Rogo''s own case study cites approximately 85% weekly and 70% daily active usage among 100-plus users; an independent Series D recap instead reports more than 10,000 weekly workflows at 95% engagement; and a customer-review aggregator cites a cumulative 250,000-plus workflows figure. None of these three numbers share an obvious denominator, and no fetched source explains how they relate, which is treated here as a conflicting-data evidence gap rather than resolved into a single headline metric.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
- id: named-customer-proof
  title: 'Named Customer Proof: Logos, Baird, and Direct Voices'
  tableRefs:
  - TU003
  figureRefs:
  - FU003
  body: 'Distinguishing logo-level marketing from verified production use matters most in this chapter. Raw markup on Rogo''s customers page confirms six individually labeled logos -- Jefferies, Lazard, Moelis, Nomura, Rothschild & Co, and Truist -- and an independent funding writeup separately lists five of the same names as active users, which is stronger corroboration than a marketing page alone. Jefferies clears a higher bar still: its own corporate website, not Rogo''s, published a leadership-spotlight interview with Rogo''s CEO describing a live deployment on real deal data, which counts as independent-domain proof rather than a vendor-controlled placement. Truist Securities'' CEO is separately quoted on the record praising integration, productivity, and risk-reduction outcomes, though Truist Ventures'' simultaneous role as a Series C investor repeats the investor-customer overlap pattern already flagged for J.P. Morgan in earlier chapters. GTCR is the only named private-equity account, mentioned in passing within funding coverage rather than a dedicated story. Two partner case studies -- from Anthropic and Google Cloud -- add indirect signal: Google Cloud''s own case study states that Rogo''s clients have confided they trust Google more than other AI vendors on security grounds, a rare glimpse of end-customer vendor sentiment relayed through a supplier rather than the customer directly. Set against a claimed base of 250-plus institutions, the total number of independently named or quoted accounts found across every fetched source in this chapter is eight, which should temper how much weight the logo wall alone can carry in a diligence narrative.'
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
- id: retention-durability
  title: Retention, Engagement, and Durability Evidence
  tableRefs:
  - TU004
  body: 'No fetched source discloses Rogo''s net revenue retention, gross revenue retention, logo churn rate, or average contract length, so this section is built around proxies and a genuine adverse data point rather than formal retention economics. Baird''s approximately 85% weekly and 70% daily active usage remains the only quantified repeat-usage figure tied to a named account, and it is a meaningful one for enterprise software inside a regulated financial institution. The most concrete durability signal in either direction, however, comes from an anonymous Wall Street Oasis forum thread: one poster states their firm churned from Rogo after roughly a year, calling it the most overhyped product they had used, while other posters in the same thread describe the platform as much improved since the Felix launch and report colleagues who rely on it daily. A separate director-level poster states the tool is largely useless above vice-president level, which is consistent with a pattern where junior- and mid-level analysts are the heaviest users and senior bankers are more skeptical. None of this can be tied to a specific named firm, so it is treated as directional sentiment rather than a verified churn statistic, but it is the only public evidence -- positive or negative -- of what happens to a Rogo account after the first year of usage.'
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
- id: expansion-concentration
  title: Expansion Paths, Concentration Risk, and Adverse Signals
  tableRefs:
  - TU005
  body: 'Rogo''s expansion story runs through its named bulge-bracket logos: independent commentary explicitly frames smaller and mid-market banks gaining access to analytical capability "previously the exclusive advantage of bulge-bracket firms," using the marquee accounts as reference proof. That same concentration in a handful of named logos is also the risk: if any one of Jefferies, Lazard, Moelis, Nomura, or Rothschild & Co were to churn or downgrade, the credibility halo effect that eases boutique-bank sales could weaken disproportionately. Supply-side concentration compounds the picture from a different angle. One 2026 funding writeup frames Rogo''s own dependency on third-party foundation-model providers as a company-level risk, while a separate recap frames the mirror-image risk for customers: heavy reliance on a single vendor, Rogo, for critical deal workflows. Layered on top of that, Rogo''s customer-facing product depends simultaneously on data-licensing partnerships with LSEG, PitchBook, and Daloopa, none of which Rogo fully controls. An eight-month average sales cycle from initial conversation to production deployment is described as industry-standard, which slows net-new logo growth and gives incumbent terminal providers -- Bloomberg, FactSet, S&P Capital IQ -- time to layer competing AI features onto their existing data advantages. Dual investor-customer relationships at Truist and J.P. Morgan add a reference-bias question that a diligence team should control for by seeking reference calls with non-investor customers specifically.'
  claimRefs:
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
