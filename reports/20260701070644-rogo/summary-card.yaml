summary:
  headline: >
    Rogo is a fast-compounding, well-financed vertical AI platform for Wall Street with concrete institutional traction,
    but its $2 billion Series D price has outrun every public revenue, margin, and retention disclosure, warranting
    research-more rather than a directional buy or avoid call.
