- id: trust-security-compliance
  title: Trust, Security, and Regulatory Compliance as Product Enablers
  body: 'Rogo''s Trust Center documents SOC 2 Type I and Type II, ISO/IEC 27001, and ISO/IEC 42001:2023 certifications, the
    last of which is the first international standard for AI management systems and covers model training and orchestration
    pipelines, data-integration lineage, and internal AI-governance structures. The Trust Center also lists CCPA alignment,
    a VPAT accessibility report, and EU AI Act compliance documentation, and names reference institutions including Jefferies,
    Rothschild & Co, Nomura, Moelis, and Lazard as having reviewed Rogo''s security posture. From August 2, 2026, the EU AI
    Act''s obligations for high-risk AI systems become fully enforceable across the EU, requiring documented risk management,
    technical documentation, human oversight, and post-market monitoring -- a compliance bar Rogo''s own certifications and
    Trust Center disclosures are positioned to help clear, though no regulator confirmation of that status was found for this
    chapter.


    Independent technical coverage also describes a second internal agent, Sisyphus, which runs automated offensive-security
    campaigns against Rogo''s own infrastructure roughly once or twice a day, chaining findings across authentication abuse,
    authorization bypass, injection, SSRF, and LLM-specific exploit classes; the same source reports it found 18 additional
    exploitable vulnerabilities within a week of a third-party penetration test and that high-confidence findings are calibrated
    to a greater-than-95-percent true-positive rate. Rogo''s public status page separately reports 100 percent API uptime
    and 99.97 percent application uptime for the April-to-June 2026 window, with one partial outage resolved within about
    18 minutes. Treated together, security and compliance function as a sales-enabling layer for a product whose buyers are
    among the most risk-averse enterprise customers in software.'
