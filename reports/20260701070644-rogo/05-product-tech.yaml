- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Manual Workflow
  - Rogo Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Deal screening
    - Manually filter target lists against thesis criteria across data terminals
    - Felix screens targets from connected data providers against stated criteria
    - Reduces hours of manual list-building per deal
    - Screening criteria quality depends on how well the thesis is specified
  - - CIM generation
    - Analyst drafts 50-100 page sell-side memorandum by hand
    - Felix drafts CIM sections from connected deal data and firm templates
    - Cuts drafting time from days to hours per Rogo and independent accounts
    - Output must still match exact firm house style to be usable
  - - Buyer outreach
    - Analyst manually builds contact lists and outreach drafts
    - Felix generates personalized buyer contact lists and initial communications
    - Speeds early-stage buyer-list creation
    - Personalization quality not independently benchmarked
  - - Data-room diligence
    - Analysts manually review large document piles for a deal
    - Felix synthesizes across data-room documents to surface key findings
    - Reduces manual document review time
    - Coverage across very large or poorly structured document sets is not independently verified
  - - Spreadsheet model build/maintenance
    - Analyst builds and rolls forward 40-tab models with fragile links
    - Subset-derived spreadsheet agent builds, rolls forward, and audits models, tracing drivers
    - Models update in seconds rather than days per Rogo's account
    - Reliability on highly bespoke or legacy model structures not independently tested
  - - Model maintenance as data changes
    - Analyst manually re-checks and updates assumptions when new data arrives
    - Offset-derived agents track how a model's assumptions and formulas evolve and update automatically
    - Reduces manual re-work when new information arrives
    - Newly integrated (announced March 2026); production track record is limited
  - - In-workbook analysis
    - Analyst switches between terminal, browser, and Excel to populate a model
    - Excel Plug-in lets Felix populate financials and build analysis inside the workbook
    - Removes context-switching between tools
    - Requires firm's data sources to already be connected to Rogo
  notes: Benefit figures are drawn from Rogo's own announcements and independent commentary; none are from an independently
    audited time-and-motion study.
