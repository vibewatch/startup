- id: reliability-citation-evaluation
  title: Reliability, Citation Behavior, and Evaluation Evidence
  body: 'The clearest third-party evidence on reliability comes from BigFinanceBench, a companion research paper to Rogo''s
    own benchmark harness, co-published on arXiv in June 2026. It scores 928 expert-authored, workflow-grounded financial-research
    tasks against more than 36,000 rubric points that check each step of a derivation -- source selection, period and accounting-definition
    choice, assumptions, and calculation -- rather than only the final answer. Across ten current frontier and open-weight
    agents, the best-performing system reached only 58.8 percent of available rubric points, and the authors conclude that
    final-answer accuracy is a lossy proxy for derivation quality, with capability varying non-uniformly across workflow stages.
    This is directly relevant to citation risk: an agent can produce a plausible, well-cited-looking answer while still failing
    individual steps of the underlying derivation that a reviewing analyst would need to audit.


    A separate independent LLMOps analysis is more explicitly skeptical of Rogo''s own public metrics, noting that headline
    figures such as bankers served, hours saved weekly, and ARR growth multiples are self-reported and were not independently
    verified in the material it reviewed, and that Rogo''s fine-tuning methodology and how it absorbs upstream model updates
    are not publicly detailed. Coverage of very large or poorly structured document sets in data-room diligence is likewise
    not independently benchmarked; the platform''s real-world derivation accuracy at scale, beyond Rogo''s curated benchmark,
    remains an evidence gap for this chapter.'
  tableRefs: []
