  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fine-tuning methodology disclosure
    missingEvidence: Rogo's dataset composition, fine-tuning training methodology, and process for absorbing upstream OpenAI/Anthropic/Google
      model updates without disrupting production behavior.
    whyItMatters: Without this detail, diligence cannot independently assess how much of Rogo's accuracy advantage comes from
      proprietary training versus prompt engineering on top of vendor models, which affects the durability of its technical
      moat.
    diligencePath: Request Rogo's model-training documentation and fine-tuning evaluation results directly from the company
      under NDA.
    relatedQuestionRefs:
    - QE032
    relatedTableRefs:
    - TE003
  - type: conflicting-data
    severity: material
    topic: self-reported usage and productivity metrics
    missingEvidence: Independently audited figures for documents searched, analyst hours saved, and revenue growth multiples
      that Rogo and secondary sources report.
    whyItMatters: An independent LLMOps analysis explicitly flags these metrics as company-reported and unverified; if overstated,
      they would inflate the perceived scale and efficiency benefit of the platform relative to competitors.
    diligencePath: Request underlying usage telemetry or a third-party audit of productivity claims from a reference customer.
    relatedQuestionRefs:
    - QE033
    relatedTableRefs: []
  - type: missing-source
    severity: minor
    topic: third-party validation of Sisyphus security-testing results
    missingEvidence: An independent security auditor's confirmation of Rogo's reported greater-than-95-percent true-positive
      rate and vulnerability-discovery counts for its internal Sisyphus penetration-testing agent.
    whyItMatters: Continuous automated security testing is a differentiated claim, but all detail currently traces to a single
      independent blog restating Rogo's own account rather than an audited source.
    diligencePath: Request Rogo's pentest and Sisyphus calibration reports (available via the Trust Center under NDA) or an
      independent security assessment.
    relatedQuestionRefs:
    - QE034
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: proprietary financial reasoning model architecture disclosure
    missingEvidence: Technical detail behind an independent review's reference to Rogo 'AI Tables powered by proprietary financial
      reasoning models,' which is not corroborated in Rogo's own official product or trust documentation reviewed for this
      chapter.
    whyItMatters: If accurate, a proprietary reasoning layer would strengthen Rogo's technical differentiation beyond being
      a harness over third-party frontier models; if marketing language, the differentiation claim is weaker than it appears.
    diligencePath: Ask Rogo directly whether 'AI Tables' relies on a proprietary trained model or on prompt-engineered calls
      to vendor frontier models.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE003
