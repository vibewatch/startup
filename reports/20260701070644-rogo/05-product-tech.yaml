- id: build-vs-buy-acquisitions
  title: 'Build-vs-Buy: Acquisitions and Platform Expansion'
  body: 'Rather than building every capability internally, Rogo has used acquisitions to add capability quickly. Subset (acquired
    2025) brought a spreadsheet agent that understands complex financial-model formulas and ranges and connects to Capital
    IQ, FactSet, PitchBook, LSEG, and firm-private data to build, roll forward, and audit models; it was founded by Jason
    Chan (ex-Bank of America, ex-Providence Equity Partners) and AJ Nandi (ex-Insight Partners). Offset (announced March 2026),
    founded by Raj Khare and Shiv Shrivastava, builds agentic systems with memory of how a specific model''s assumptions,
    formulas, and outputs evolve over time, so a model can be maintained automatically as new information arrives -- a structurally
    different problem from generating a model once. Plux AI (early 2026), founded by Deepak Guneja and Pratyush Chaudhary,
    monitors filings, lender updates, court documents, and company disclosures to surface long-form market signals and expanded
    Rogo''s UK/European coverage and engineering presence.


    Distribution has expanded through partnership as well as acquisition. In June 2026, Microsoft named Rogo a launch partner
    for partner-built skills in Copilot for Excel, alongside LSEG, Ramp, and Vena, to be sold through the Microsoft Marketplace
    from the third quarter of 2026 -- placing Rogo inside a distribution channel that Microsoft itself also uses to sell its
    own, separately expanding set of finance-data connectors. Rogo''s founder has acknowledged this dynamic directly, describing
    Rogo as simultaneously a customer, a distribution partner, and a potential competitive target of OpenAI and Anthropic,
    since both model vendors are separately building finance-facing AI products of their own.'
