  - CE032
callouts:
- calloutType: strength
  title: The Harness, Not the Model, Is the Stated Moat
  body: Independent technical coverage is explicit that Felix is an orchestration harness -- tool layer, citation system,
    output formatters, audit trail -- into which Rogo plugs whichever frontier model from OpenAI, Anthropic, or Google currently
    performs best, rather than a single fine-tuned model. That separation means frontier-model upgrades are, in principle,
    a configuration change rather than a rewrite, and it is reinforced by Rogo's own practitioner-authored Big Finance Benchmark,
    which gates which model version powers Felix in production.
  claimRefs:
  - CE002
  - CE021
  - CE026
- calloutType: risk
  title: Derivation-Level Accuracy Still Trails Polished Output
  body: Rogo's own companion research paper, BigFinanceBench, found that the best of ten current frontier and open-weight
    agents reached only 58.8 percent of available rubric points on workflow-grounded financial derivation tasks, and that
    final-answer accuracy is a lossy proxy for whether an agent got the underlying sourcing, period, and calculation steps
    right. Combined with an independent analysis flagging Rogo's own usage metrics as self-reported and unverified, this is
    the clearest evidence that citation granularity and step-level accuracy -- not just polished formatting -- remain the
    binding constraint on how far these workflows can be trusted unsupervised.
  claimRefs:
  - CE023
  - CE024
  - CE028
- calloutType: risk
  title: Model and Distribution Dependencies Cut Both Ways
  body: 'Rogo''s founder has publicly acknowledged that Rogo is simultaneously a customer, a distribution partner, and a potential
    competitive target of OpenAI and Anthropic. The same dynamic now extends to distribution: Microsoft made Rogo a launch
    partner for Copilot-in-Excel skills in June 2026, but the same update added Microsoft''s own live connectors to several
    of Rogo''s own data partners (FactSet, PitchBook, S&P Global), meaning the channel Rogo depends on for Excel-native distribution
    is simultaneously building competing native capability.'
  claimRefs:
  - CE046
  - CE019
  - CE020
- calloutType: strength
  title: Security and Compliance Are Sold as Product, Not Just Risk Mitigation
  body: Rogo pairs conventional certifications (SOC 2 Type I/II, ISO 27001) with the newer ISO/IEC 42001:2023 AI management-system
    standard and EU AI Act compliance documentation, and layers a continuously running internal red-team agent, Sisyphus,
    on top of periodic third-party penetration tests. For buyers in investment banking and private equity -- among the most
    risk-averse enterprise software markets -- this compliance depth functions as a sales enabler and adoption unlock, not
    merely a defensive cost center.
  claimRefs:
  - CE031
  - CE032
  - CE030
