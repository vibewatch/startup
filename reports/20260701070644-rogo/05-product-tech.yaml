- id: data-model-orchestration-architecture
  title: Data, Model, and Orchestration Architecture
  body: 'Independent technical coverage describes Felix not as a single fine-tuned model but as a harness: an orchestration
    scaffold, tool layer, citation system, output formatters, and audit trail into which Rogo plugs whichever frontier model
    -- currently spanning OpenAI, Anthropic, and Google -- performs best on its internal benchmark. A separate independent
    case study describes a tiered routing pattern underneath that harness: a primary model handles chat-based analysis, a
    smaller model handles data contextualization and search structuring, and a top-tier model is reserved for evaluation and
    synthetic data generation, trading off quality, latency, and inference cost across different task types.


    The data layer spans licensed external providers -- LSEG, S&P Capital IQ/FactSet, and PitchBook chief among them, alongside
    Moody''s, Daloopa, and Affinity -- plus internal connectors to SharePoint, Salesforce, and firm-specific document repositories.
    Rogo curates its own practitioner-authored evaluation suite, the Big Finance Benchmark, and has published a reference
    harness for it on GitHub with a minimal four-tool scaffold (web search, SEC EDGAR search, URL fetch, sandboxed Python
    execution) deliberately excluding premium data sources and vector-store retrieval, so the evaluation measures the underlying
    model rather than Rogo''s own tooling.'
  tableRefs:
  - TE003
  figureRefs:
