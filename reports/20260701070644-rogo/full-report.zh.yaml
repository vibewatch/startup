              $30/user/month，说明即便没有公开价格，Rogo 这类企业金融 AI 平台也有可能拿到高溢价的席位经济性。在 Rogo 披露自身数字前，这些可比对象是框定其潜在合约价值和估值倍数的最有用视角。
