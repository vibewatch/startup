      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Rogo 由 Gabriel Stengel（CEO）、John Willett 和 Tumas Rackaitis 联合创立，三人都在 Princeton University 读书时相识。Stengel
              此前曾在 Lazard 担任投资银行分析师，多方来源都把这段经历描述为 Rogo 的直接起因：作为初级银行家，他凌晨 2 点还在 Excel 和 PowerPoint
              里重复做分析，挫败感推动了公司诞生。Willett 此前在 J.P. Morgan Chase 和 Barclays 工作，现在从随 C 轮开设的 London 办公室负责 Rogo
              的欧洲扩张。Rackaitis 拥有 Oberlin College 计算机科学学位，担任首席技术官，也是公司公开列出的技术架构负责人。


              三位创始人之外，Bloomberg 报道确认 Rahul Rekhi 是 Rogo 的总裁。他在美国财政部工作约一年、在 Lazard
              工作七年后加入，为管理层补上政策和资深投行信誉。公开信息看不到的，是更完整的高管或治理结构：公司、投资人或媒体材料中都没有出现独立董事名单、委员会架构，或具名的 CFO/COO 职位。因此，以据报 $2
              billion 估值来看，Rogo 仍显得围绕创始人与总裁运转，关键人集中风险真实存在。


              New York Weekly 的 D 轮报道还露出另一个治理信号：J.P. Morgan Growth Equity Partners 既是 Rogo 的持续投资人（B 轮到 D 轮），又通过母行 J.P.
              Morgan 成为 Rogo 平台公开提到的机构客户。这种投资人兼客户的双重关系本身并非不当，但自然引出尽调问题：信息隔离墙如何设置，是否存在优先访问权。后续章节或现场尽调应直接追问。
