    summary: Rogo 的客户旅程从顶级投行标杆客户关系出发，经过合规建设，进入驻场部署生产使用；扩张分支之外，也有真实但匿名的流失分支。
    claimRefs:
      - CU002
      - CU005
      - CU041
      - CU046
      - CU048
      - CU050
      - CU027
    data:
      nodes:
        - label: 标杆客户关系
          detail: 具名顶级投行账户（Jefferies、Lazard、Moelis、Nomura、Rothschild & Co）支撑 Rogo 的参考客户基础和销售可信度。
          tone: positive
        - label: 合规和 MNPI 建设
          detail: 在 AI 接触真实交易数据之前，共同搭建信息隔离墙、MNPI 控制和基于角色的访问基础设施。
          tone: neutral
        - label: 驻场部署导入
          detail: 前银行家部署人员驻场嵌入（例如在 Baird Milwaukee 总部的线下培训），推动采用。
          tone: positive
        - label: 生产环境日常使用
          detail: Baird 显示约 85% 周活和约 70% 日活；其他具名客户仍停留在参考客户层级，未披露使用情况。
          tone: positive
        - label: 扩张分支
          detail: 精品和中端市场银行可获得顶级投行级分析能力，标杆客户作为参考背书。
          tone: positive
        - label: 流失 / 不满分支
          detail: 一个匿名论坛账号称约一年后流失，并称产品被过度炒作；同时，其他发帖者称每天都依赖该产品。
          tone: risk
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 平均 8 个月销售周期和共同合规建设先于驻场部署导入；之后，具名账户要么显示可衡量参与度（Baird），要么仍只停留在客户标识层级（多数其他具名银行）。
    claimRefs:
      - CU038
      - CU041
      - CU046
      - CU047
      - CU015
      - CU045
    data:
      nodes:
        - label: 初次沟通 / POC
          detail: 机构银行开始概念验证评估。
          tone: neutral
        - label: 合规和安全审查（平均约 8 个月）
          detail: 共同搭建 MNPI 控制、访问政策和 Trust Center 审阅材料。
          tone: neutral
        - label: 生产部署
          detail: 单租户部署为该账户上线。
          tone: positive
        - label: 驻场部署嵌入
          detail: 前银行家部署人员组织线下培训和答疑时段，推动日常使用。
          tone: positive
        - label: 可衡量参与度（仅 Baird）
          detail: Baird 披露 ~85% WAU / ~70% DAU；其他具名账户没有披露可比数字。
          tone: positive
        - label: 扩张或流失
          detail: 结果分化：一边是精品银行扩张叙事，另一边是一个匿名账户约 1 年后流失。
          tone: risk
      edges:
        - from: Initial conversation / POC
          to: Compliance and security review (~8 months average)
          label: 从 POC 到安全审查
        - from: Compliance and security review (~8 months average)
          to: Production deployment
          label: 控制项通过签批
        - from: Production deployment
          to: Forward-deployed embedding
          label: 上线
        - from: Forward-deployed embedding
          to: Measured engagement (Baird only)
          label: 导入
        - from: Measured engagement (Baird only)
          to: Expansion or churn
          label: 使用 12+ 个月后
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 只有 Baird 同时具备相对独立的佐证、生产环境状态和量化使用度；多数具名 logo 仍未量化，最强的负面信号来自匿名来源。
    claimRefs:
      - CU015
      - CU018
      - CU019
      - CU020
      - CU027
      - CU031
    data:
      columns:
        - 结果具体性
        - 独立性
        - 生产成熟度
        - 留存可见度
      rows:
        - label: Baird Equity Research
          values:
            - label: 强
              tone: positive
              detail: 量化披露 85% WAU / 70% DAU，并列出具名工作流用例
            - label: 弱
              tone: risk
              detail: 几乎全部来自 Rogo 自有案例研究和聚合网站转述
            - label: 强
              tone: positive
              detail: 具名、有日期、已在生产环境落地的案例研究，不是试点
            - label: 弱
              tone: risk
              detail: 没有第二年数据点或续约确认
        - label: Jefferies
          values:
            - label: 弱
              tone: risk
              detail: 未披露使用比例或席位数
            - label: 中
              tone: positive
              detail: Jefferies 官网也有佐证，不只是 Rogo 单方说法
            - label: 中
              tone: positive
              detail: CEO 级访谈显示，交易数据已在生产环境使用
            - label: 弱
              tone: risk
              detail: 没有续约、扩张或使用趋势证据
        - label: Truist Securities
          values:
            - label: 中
              tone: positive
              detail: CEO 公开具名引述，提到提高生产率、降低风险的效果
            - label: 弱
              tone: risk
              detail: Truist Ventures 同时也是 Series C 投资方
            - label: 中
              tone: positive
              detail: 有具名客户和高管引述，不只是 logo
            - label: 弱
              tone: risk
              detail: 未披露使用比例或趋势数据
        - label: GTCR（私募股权）
          values:
            - label: 弱
              tone: risk
              detail: 只在 Series C 融资报道中顺带点名
            - label: 中
              tone: positive
              detail: 由独立融资报道点名，不是 Rogo 营销材料
            - label: 弱
              tone: risk
              detail: 仅属 logo 级提及；没有案例研究或引述
            - label: 弱
              tone: risk
              detail: 没有使用或续约证据
        - label: 匿名流失账户（论坛）
          values:
            - label: 弱
              tone: risk
              detail: 没有量化结果；只是定性投诉
            - label: 强
              tone: positive
              detail: 完全独立于 Rogo，是一则主动发布的匿名论坛帖
            - label: Unknown
              tone: risk
              detail: 无法确认是哪家公司，也无法确认部署规模
            - label: 强（负面）
              tone: risk
              detail: 已检索来源中唯一具体的流失信号
  - id: FR001
    type: matrix
    title: 风险热力图
    subtitle: Rogo 风险严重度矩阵——可能性与影响（2026）
    approximationNotes: 可能性和影响是作者基于监管指引、品类基准以及媒体 / 分析师评论作出的定性判断；并非来自量化建模。
    claimRefs:
      - CR001
      - CR004
      - CR015
      - CR021
      - CR025
      - CR038
      - CR041
      - CR044
    data:
      columns:
