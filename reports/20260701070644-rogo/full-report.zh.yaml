  - id: TV005
    title: 投资论点破坏与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 下一轮降价轮或平轮
        - 下一次披露融资投后估值低于 $2B
        - 直接证伪「品类领导者重估」牛市情景
        - 将估值立场下调至昂贵 / 回避；重估进入价格
      - - 披露的当年 ARR 远低于可比倍数暗含水平
        - 按 $2B 标记估值计算，当前 ARR 暗含倍数高于 12.5x–54x 可比区间上沿
        - 证实基准 / 悲观情景：价格跑在披露基本面前面
        - 从跟踪 / 继续研究转为回避，等待重新定价
      - - 流失标志性大型投行或精英精品投行客户
        - 本尽调客户证据中的任何具名客户公开流失，或将同等工具内包
        - 削弱品类领导者投资论点，也削弱可比公司里隐含的留存假设
        - 视为重大不利事件，需要立即重新承保
      - - 既有厂商捆绑替代具名客户
        - 确认某个客户切换到 Microsoft Copilot for Finance、Bloomberg ASKB 或 S&P Global/Kensho 智能体产品
        - 直接验证既有厂商捆绑的反论点
        - 下调对持久定价权的信心；重审 TAM 假设
      - - 独立二级市场成交价低于 Series D 价格
        - 经确认的二级交易或公平性意见给 Rogo 定价低于 $2B
        - 给出第一个经市场检验（非仅财团定价）的估值信号
        - 以二级市场成交价而非主轮价格作为参考标记
    notes: 阈值是从本章证据提炼的定性触发项，不是 Rogo 或其投资人披露的合同约束。
    claimRefs:
      - CV034
      - CV036
      - CV025
      - CV027
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 当年收入
        - 经审计或管理层报告的当年 ARR / 收入年化口径
        - 这是将任何可比倍数直接套用到 Rogo 的最大阻碍
        - 任何后续承诺前，在 NDA 下要求披露当年收入和按客户批次拆分的 ARR
      - - 单位经济
        - 毛利率、每席位模型推理成本和 CAC/LTV
        - 需要区分它是可持续软件毛利模型，还是服务更重、毛利更低的模型
        - 要求披露收入成本明细和每席位推理成本基准
      - - 留存
        - 净收入留存和客户级流失明细
        - 决定可比 ARR 倍数（Hebbia、Glean、AlphaSense）是否还是正确参考类别
        - 要求提供本尽调点名账户的客户批次留存曲线
      - - 现金状况
        - 手头现金、烧钱率和现金续航（月数）
        - 影响退出事件前还存在多少稀释风险
        - 要求最近资产负债表快照和月度烧钱趋势
      - - 二级市场证据
        - 任何要约回购、员工二级出售或给 Rogo 定价的公平性意见
        - 会给出第一个独立于主轮融资的市场验证估值信号
        - 向股权结构表 / 二级平台和现有投资人查询近期成交价
      - - 退出准备
        - CFO / 审计师招聘或投行接触，显示 IPO 或出售准备
        - 表明管理层自身的流动性时间表和信心
        - 监控高管招聘公告和公开 S-1 / 注册文件
    notes: 按本章对阻塞严重性的判断排序；这六项均未被本次已审阅来源解决。
    claimRefs:
      - CV032
      - CV041
