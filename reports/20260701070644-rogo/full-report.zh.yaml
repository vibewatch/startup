      - number: '2.4'
        title: 增长驱动因素与采用路径
        blocks:
          - type: paragraph
            body: >-
              几股结构性力量正在把预算拉向这个品类。最清晰的是初级银行家的成本和产能压力：Anthropic 在 2026 年推出 10
              个可直接运行的金融智能体模板，覆盖路演材料、财报回顾监控、建模和可比公司检查——这些任务过去主要由初级投行人员完成（CM024）；一些可靠性不一的评论称，部分银行因此把分析师入职批次最多削减了三分之二（CM025）。LP
              和机构投资人的压力是第二个驱动因素，很大程度上独立于已经证明的单笔交易 ROI：58% 另类投资管理人预计前台会更广泛集成生成式 AI，高于 2023 年的 20%（CM027）；McKinsey 估计 AI
              与运营模式杠杆可把 CIB 盈利能力提高 20-30%，这给银行自上而下拨预算提供了理由（CM005）。采用路径很清楚：公司先评估和试点工具，再把工具嵌入 M&A 等特定工作流（截至 2025 年，86%
              采用者这样做，见 CM038），最后只有少数越过试点进入可衡量 EBIT 影响（约三分之一实现规模化，只有 6% 算作 AI「高绩效者」，见
              CM037）。采用与规模化价值之间的缺口，本身就是下文继续讨论的约束，也会直接影响 Rogo 这类供应商把试点席位转化为扩张收入的速度。
