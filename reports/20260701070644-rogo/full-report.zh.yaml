      - number: '7.3'
        title: 竞争与平台依赖风险
        blocks:
          - type: paragraph
            body: >
              Rogo「编排层而非模型」的架构，确实能降低单一供应商过时带来的冲击，但它没有消除依赖，只是把依赖分散到了 OpenAI、Anthropic 和 Google；具体任务由哪一家承接，取决于 Rogo
              内部基准测试当时的胜出者 [CR022]。如果任何一家实验室大幅提高 API 定价、限制金融行业访问，或推出直接竞争的金融产品，Rogo 的成本结构和差异化会同时收窄。Rogo
              的数据层同样集中在少数持牌供应商手里：LSEG（2025 年宣布战略合作，把基本面、共识预期和 M&A 数据接入平台）和 PitchBook（2025–2026 年深化合作，覆盖私募资本交易、基金和投资者数据）在
              Rogo 和供应商自身表述中，都是 Rogo 数据战略的核心且不断扩大的支柱；续约条款、定价和排他性均未公开 [CR023]。数据供应商正越来越多地把自己的生成式 AI
              层直接嵌入终端；LSEG、PitchBook、FactSet 或 S&P 任何一方若为了自有 AI 功能而限制批发 API 访问，都会直接削弱 Rogo「基于授权数据」的价值主张 [CR024]。

              Microsoft 同时是 Rogo 最大的战略伙伴，也是最可信的平台威胁。Rogo 宣布了 Microsoft 合作并交付原生 Excel 插件，但 Microsoft 自己的 2026
              年路线图会把能力越来越强、面向金融的 Copilot agents——方差分析、DCF 构建、可复用金融「skills」、连接 FactSet / PitchBook / S&P 级数据的实时连接器——从
              2026 年 10 月起直接并入 Microsoft 365 Copilot 核心订阅，且不再额外按席位收费；同时还会推出面向第三方和第一方金融 agents 的 Copilot Agent Store
              [CR025]。Rogo 目标银行和资产管理机构大多已经是 Microsoft 365 客户，因此这种捆绑会降低 Rogo
              至少一部分可商品化工作流的切换启动成本（方差解释、标准模型搭建、数据连接器），即便它尚未达到 Rogo 前置部署、按公司深度配置的程度 [CR026]。独立竞争者评论把 Rogo 和 Hebbia
              列为引用联动、可审计金融研究的两家领先者；新进入者（o11、F2）则明确批评二者仍是「浏览器孤岛」工具，需要把数据搬进搬出原生 Office 应用，而不是在原位操作 Excel 单元格或 Word 文档——随着
              Microsoft 从 Office 内部缩小同一差距，这种工作流摩擦可能更重要 [CR027]。

              资本提供方集中度较轻，但仍是真实依赖：Rogo 的 $160M Series D 由 Kleiner Perkins 领投，Sequoia、Thrive Capital、Khosla Ventures 和
              J.P. Morgan Growth Equity 继续参投。这个财团覆盖顶级后期投资者，但仍集中在少数重复支持者；在盈利能力得到独立证明之前，Rogo 能否再融一轮，依赖这些投资者继续相信公司
              [CR028]。银行客户同时也是战略投资者的结构（J.P. Morgan 参投，而 J.P. Morgan 这家银行本身也在自建 AI 工具）还带来治理问题：如果 Rogo
              最大的银行客户加速自研，投资者与客户激励是否会分化 [CR029]。最后，Rogo 通过收购增长的策略（Subset、Offset、Plux）把整合风险集中在一个小型内部 M&A
              团队；每笔收购都会新增独立代码库、数据访问模式和创始人留任问题，叠加在平台依赖图景之上，而不是分散该风险 [CR030]。
