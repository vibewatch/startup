      - number: '5.3'
        title: 可靠性、引用行为与评估证据
        blocks:
          - type: paragraph
            body: >-
              可靠性上最清晰的第三方证据来自 BigFinanceBench，这是 Rogo 自有基准框架的配套研究论文，2026 年 6 月共同发布在 arXiv。它用 36,000 多个评分点评估 928
              个专家编写、嵌入工作流的金融研究任务；评分检查推导的每一步——来源选择、期间和会计定义选择、假设、计算——而不只看最终答案。在十个当前前沿和开放权重智能体中，表现最佳的系统也只拿到可用评分点的
              58.8%；作者认为，最终答案准确率是推导质量的有损代理指标，能力在各工作流阶段分布也不均匀。这直接关系到引用风险：智能体可以产出一个看似可信、引用充分的答案，但底层推导的某些步骤仍然出错，而审阅分析师必须逐项审计这些步骤。


              另一篇独立 LLMOps 分析对 Rogo 自己公开指标的怀疑更直接：服务银行家数量、每周节省小时数、ARR 增长倍数等头部数字都是自报口径，在其审阅材料中没有独立验证；Rogo
              的微调方法，以及吸收上游模型更新的方式，也没有公开细节。数据室尽调中规模很大或结构很差的文档集处理，同样缺少独立基准。超出 Rogo 自选基准后，平台在真实世界大规模场景下的推导准确率，仍是本章的证据缺口。
