        - 约束
        - 现在（2026）
        - 买方可能收缩预算，或要求更快、更硬的 ROI 证据后才扩大席位
        - 索取 Rogo 已实现的生产力 / ROI 案例数据，而不只是试点数量
      - - AI 部署人才 / 技能短缺
