  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Rogo 竞争的是专为投资银行、私募股权机构和资产管理公司设计的 AI 研究与工作流自动化市场，比「金融服务 AI」或通用 AI 办公生产力软件更窄。第三方追踪机构把该产品描述为面向银行、PE
              和对冲基金用户的垂直研究助手，整合内部与外部金融数据源，区别于通用大语言模型聊天助手（CM042、CM021）。这个品类要自动化的服务收入底座很大：2024 年全球企业与投资银行收入达到 $3.0
              trillion（CM004），全球股票研究行业即使在美国卖方分析师人数自 2015 年以来约下降 18% 后，每年仍产生约 $8.7 billion
              收入（CM017、CM018）。该品类夹在两类截然不同的替代品之间。一边是传统金融数据终端——Bloomberg（约 33% 份额，约 $27,660/席位/年）、Refinitiv Eikon（约 20%
              份额）、Capital IQ 和 FactSet（$12,000/席位/年）——它们把数据交付与越来越强的分析层打包，代表根深蒂固的现状（CM014、CM015、CM016）。另一边是 Microsoft 365
              Copilot 等通用 AI 办公助手，开箱并不懂金融，但会争夺同一条企业 AI 预算线，同时缺少核心品类所需的授权数据集成和交易专属工作流（CM041）。法律和咨询导向的 AI
              研究工具被明确排除：它们服务的是不同买方（律所、咨询公司）和不同工作流，尽管底层模型技术相似。
