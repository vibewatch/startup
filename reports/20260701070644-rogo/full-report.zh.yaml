  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Rogo 守住品类领导者地位，并补上 ARR 披露缺口；披露年化口径与近期融资节奏匹配
        - $2B 标记估值守住，或随 AI 原生同业可比公司（Hebbia、Glean、AlphaSense 在 2025–2026 年均上调估值）继续上修
        - 既有厂商捆绑（Microsoft、Bloomberg、S&P Global）在 Rogo 证明持久 ARR 前削弱付费意愿
        - 四家蓝筹上一轮投资人继续跟投提供支撑
      - - 基准
        - Rogo 继续增长，但当前 ARR 低于 $2B 标记估值按 AI 原生倍数应要求的水平（可比公司观察到 12.5x–54x）
        - 下一轮名义估值守住，但 ARR 披露后有效倍数压缩
        - 2026 年市场数据已提示整个 AI 软件板块有倍数压缩风险
        - 与据报 AI 初创估值自 2025 年末以来约下降 23%、AI 交易数量下降 14% 一致
      - - 悲观
        - 当前 ARR 显著低于市场传闻，和/或大型投行客户流失或内包
        - 下一轮降价或平轮；按 $2B 标记估值进入的后续投资人出现有效亏损
        - 未披露单位经济，加上 Rogo 自身客户群中的大型机构 AI 就业前景为负
        - 与 2026 年融资追踪记录的 AI 初创「崩盘出局」模式一致
      - - 什么会改变判断
        - 经独立验证的当年 ARR、毛利率和净收入留存
        - N/A——直接拆解基准 / 乐观 / 悲观分歧
        - N/A
        - 本次尽调中对决策最关键的单项缺失披露
    notes: 由于没有已披露 ARR、利润率或股数可锚定数值回报计算，本表有意省略回报数字；按照本章受证据约束的方法，本表只表达情景逻辑和概率信号。
