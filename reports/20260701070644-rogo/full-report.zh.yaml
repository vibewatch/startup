      - number: '2.2'
        title: 市场规模：TAM、SAM、SOM 与相互冲突的测算视角
        blocks:
          - type: paragraph
            body: >-
              没有一个单一且无争议的数字能描述这个市场，本章保留这种分歧，而不是强行制造虚假的共识。Precedence Research 将全球金融服务生成式 AI 市场估为 2026 年 $2.51 billion，到
              2035 年升至 $17.88 billion，CAGR 为 24.81%（CM001、CM002）。The Business Research Company 划出更窄的「银行与金融」品类：2025 年
              $1.75 billion，到 2030 年增至 $7.71 billion，CAGR 为 34.5%（CM003）——这个增长率和基准年份都明显不同，本章把它标为明确冲突（CM003 与 CM001/CM002
              矛盾），而不是调和成一个数字。买方侧锚点提供了更多背景，但也不能消除缺口：2026 年全球私募股权 AUM 约 $8 trillion，最大平台 Blackstone 单独管理 $1.3
              trillion（CM007、CM008）；更广义资产管理行业管理 $147 trillion，其 2025 年收入增长超过 80%
              来自市场升值而非净新资金流入（CM009）。已审阅的分析师报告没有一份单独隔离出 IB/PE/AM AI 研究自动化软件的可服务可触达市场——所有已发布数字都把这个窄品类与更广的金融服务生成式 AI
              支出或传统数据终端收入混在一起（CM043）。因此，Rogo 可实际拿到的收入（SOM）无法用公开数据计算；它需要公司披露尚未公开的 ARR、席位数和按席位定价。本报告把这记录为尽调缺口，而不是靠假设估算。
