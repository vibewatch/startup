        - Rogo 竞争的核心可服务类别
      - - 金融数据终端与分析师工作站（Bloomberg、FactSet、Capital IQ、Refinitiv）
        - 市场 / 公司数据交付、筛选，以及部分嵌入式 AI 分析层
        - 跨文档和工作流的完整智能体式任务执行
        - 同一批买方，且常常是同一条技术预算线
        - 根深蒂固的现有替代品，也带来捆绑风险
      - - 通用 AI 办公 Copilot（Microsoft 365 Copilot、通用 LLM 助手）
        - 跨行业通用生产力、起草和摘要
        - 金融专用数据集成、授权市场数据、交易专用工作流
        - 企业 IT / Microsoft 365 预算
        - 相邻替代品，争夺同一条 AI 预算线
      - - 法律与咨询 AI 研究工具（如 Harvey 及同类）
        - 面向律所和咨询公司的 AI 研究自动化
        - 投行、PE 与资管专用工作流
        - 法务运营或咨询公司预算
        - 排除：买方不同，工作流不同
      - - 传统卖方股票研究生产
        - 银行分析师撰写并分发给客户的研究报告
        - AI 原生、由智能体运行的研究自动化
        - 研究部门预算，通常打包在交易佣金里
        - 相邻且萎缩的类别，AI 工具会替代其中一部分
      - - 面向对冲基金 / 资管公司的另类数据与分析平台
        - 投资决策所需的数据获取与分析工具
        - 银行 / PE 交易工作流自动化（用例不同）
        - CIO 或投资组合团队预算
        - 买方重叠相邻，集中在资管细分
