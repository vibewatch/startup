      - number: '1.4'
        title: 客户、规模与牵引力
        blocks:
          - type: paragraph
            body: >-
              Rogo 的规模指标显示企业采用又快又广。到 2026 年 4 月 D 轮公告时，超过 250 家机构的 35,000 多名金融专业人士每天使用该平台，高于 2026 年 1 月 C 轮公告中提到的约
              25,000 名专业人士，也高于 OpenAI 2024 年合作伙伴案例研究中提到的 5,000 名银行家；这条轨迹与 OpenAI 页面归因于 2024 年产品的 27x ARR 增长相符。Rogo 官网展示了
              Truist Securities CEO、Nomura 国际投行业务负责人和 Baird Global Investment Banking COO 的具名背书；多个来源列出的机构客户包括 Rothschild
              & Co、Jefferies、Lazard、Moelis、Nomura、J.P. Morgan、Bank of America、Wells Fargo 和 Singapore 的 GIC 主权财富基金。


              最具体的客户级证据，是 Rogo 自己发布的 Baird Equity Research 部门案例研究：超过 100 名专业人士活跃使用平台，约 85% 每周活跃、70% 每日活跃。Rogo
              把这种参与度定义为真正的工作流依赖，而不是尝鲜式采用。Forbes 的公司简介又为规模图景补上财务维度：收入从 2024 年约 $2 million 增至 2025 年超过 $15 million，同时估计截至
              2026 年 4 月员工约 100 人；Bloomberg 另称，Rogo 管理层预计到 2026 年底员工接近 300 人。


              即便如此，本年度财务图景仍然明显不完整：已抓取来源没有披露 2026 ARR、毛利率、净收入留存或盈利能力，导致据报 $2 billion 估值与外部尽调可获得的投资判断细节之间存在真实缺口。PeerSpot
              2026 年中竞争心智份额数据把 Rogo 放在 2.3%（FactSet 为 18.7%），这个交叉检查虽不完整但有用：即便 Rogo 份额快速增长，它的规模主张仍处在一个由传统龙头主导的市场里。
