  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与 ARR 可见性缺口
        blocks:
          - type: paragraph
            body: >-
              Rogo 的收入模型更适合按企业 SaaS 式授权来理解：直接卖给投行、私募股权公司和资产管理人，再叠加 Felix 这个智能体插件，自动跑交易筛选、CIM 生成、买方触达等多步工作流。本章和第 3
              章竞争对手定价表审阅的资料，都没有披露 Rogo 的按席位或按合约标价；一页竞品对比把 Rogo 归为「企业定制定价」产品，隐含地把它同更轻的自助式工具区分开。Rogo 自己没有价目表时，可比 AI
              原生研究平台就是唯一可用的定价锚：AlphaSense 披露每席位每年 $10,000-$20,000，平均企业合约规模 $50,000-$100,000+；Glean 估计为每用户每月
              $45-50+，最低年度承诺 $50,000-$60,000——两者都明显高于 Microsoft 365 Copilot 每用户每月 $30。历史披露收入既少又不一致：Forbes 称 Rogo 收入从
              2024 年约 $2 million 增至 2025 年超过 $15 million，CB Insights 却另列 Rogo 2024 年收入约 $1
              million；没有公司确认数字，本章无法消化这处差异。OpenAI 自己的案例研究称，Rogo 自 2024 年走出隐身以来 ARR 增长 27x；但一篇独立 LLMOps
              技术评审提醒，这个数字和反复出现的「每周节省 10+ 小时」一样，都是自报口径，缺少独立验证前应按营销材料打折看。已审阅资料没有一份把披露的历史收入与当前 2026 年 ARR
              区分开；这是本章必须点明、不能抹平的核心可见度缺口。行业定价分析还指出，固定按席位定价会让 AI 产品的成本和价值错位，因为重度用户在同一订阅费下产生的推理成本可能约为轻度用户的 100x；这一机制很可能也适用于
              Rogo 自己未披露的定价结构，不只适用于同行。
