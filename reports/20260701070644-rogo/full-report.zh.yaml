        - 直接 AI 原生同业（细分）
        - 基于申报文件、新闻稿和业绩会的股票研究自动化
        - 规模较小的同业，瞄准单个分析师而非企业级交易团队
      - - o11
        - 相邻替代品
        - Excel/Word/PowerPoint 原生 AI 执行层
        - 明确把自身定位为 Rogo 和 Hebbia 的「最后一公里」补充或替代
      - - Bloomberg Terminal / ASKB / BloombergGPT
        - 现有巨头捆绑
        - 带原生对话式 AI 智能体的金融数据终端
        - 如果银行的 Terminal AI 能匹配 Rogo 研究工作流，就会形成替代；多数目标账户已授权使用
      - - FactSet AI for Banking / FactSet AI（竞品）
        - 现有巨头捆绑
        - 带 MCP 服务器和银行 AI 工作流层的金融数据平台
        - 直接现有巨头回应，正面瞄准 Rogo 的投行买方
      - - S&P Capital IQ Pro / Kensho / ChatIQ（竞品）
        - 现有巨头捆绑
        - 带生成式 AI 文档智能和聊天助手的金融数据平台
        - 数据层和工作流均有重叠；ChatIQ 明确瞄准银行和买方分析师
      - - LSEG Workspace / Deep Research 智能体
        - 现有巨头捆绑兼数据伙伴
        - 带原生 AI 研究智能体的金融数据 / 分析平台
        - 同时是 Rogo 授权数据供应商和直接研究智能体竞争对手
      - - Microsoft 365 Copilot / Copilot for Finance（竞品）
        - 相邻替代品（横向）
        - 嵌入 Excel/Teams/Outlook 的通用办公 AI Copilot
        - 争夺同一条企业 AI 预算线，但没有金融专用微调
      - - Glean
        - 相邻替代品（横向）
        - 带金融服务 MCP 生态的企业搜索和智能体平台
        - 聚合 Rogo 所集成的同一批第三方数据提供商，但缺少银行专用工作流智能体
      - - Harvey
        - 可能进入者（相邻垂直）
        - 正在扩展到资管和基金设立的法律 AI 智能体平台
        - 尚非直接竞争对手，但共享资本充足的智能体基础设施，且资管客户群有重叠
      - - Intapp DealCloud (Celeste)
        - 相邻捆绑
        - 带智能体式 AI 的交易与关系智能 CRM
        - 补充 Rogo 而非替代 Rogo；瞄准交易拓展 / 关系跟踪，不是研究生成
      - - Daloopa
        - 相邻替代品（细分）
        - 从申报文件自动抽取金融数据并填入模型
        - 更窄的点解决方案；CB Insights 将 Rogo 列为 Daloopa 替代品
      - - 银行内部自建生成式 AI（JPMorgan LLM Suite、Goldman GS AI Assistant）
        - 现状 / 内部自建
        - 银行内部构建和托管的专有生成式 AI 工具
        - 在资源最强的大型全能银行账户中压缩可服务市场
