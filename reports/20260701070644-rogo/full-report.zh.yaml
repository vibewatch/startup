  summary: >
    Rogo 是一家总部位于纽约的 AI 公司，构建面向投资银行、私募股权机构和资产管理公司的企业研究与工作流自动化平台，核心是自主智能体 Felix。公司由 Gabriel Stengel（CEO）、John Willett 和
    Tumas Rackaitis（CTO）联合创立，三人都是 Princeton 同学；公司从 2024 年种子轮起步，到 2026 年 4 月以据报道 $2 billion 估值完成 $160 million D 轮，自 2022
    年成立以来（Rogo 自己的早期材料和一份竞品分析写作 2021 年），融资和用户采用大约每隔几个月就复利推进。
