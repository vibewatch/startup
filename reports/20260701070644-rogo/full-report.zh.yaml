              JPMorgan 的 LLM Suite 已经展示过用银行自有专有数据在约 30 秒内生成完整投行路演材料；Goldman Sachs 也已向约 10,000 名员工推出 GS AI
              Assistant，并设有全公司目标。对 Rogo 这种估值 $2 billion
              的供应商最需要的最大、最赚钱账户来说，现实竞争问题未必是「哪个供应商赢」，而可能是「这家银行是否干脆内部自建工作流，完全不采购」。
