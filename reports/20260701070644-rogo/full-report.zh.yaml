      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              可触达市场由五类买方组成，每类的预算归属和采用触发点都不同。大型综合投行和全球投行是最早、资金最充足的买方，背后有平均约占收入 9-11% 的 IT 预算，以及与 Bloomberg、FactSet、LSEG
              已存在的采购关系（CM044、CM019、CM020）；它们采用这类工具，主要受同行压力和初级员工成本经济性驱动。中型市场和精品投行采用更晚、价格更敏感，通常会等大型同行验证 ROI
              后，才投入合伙人层级预算（CM045）。私募股权机构正在把 AI
              嵌入尽调、交易生命周期自动化和被投公司运营，但工具预算在基金层面的普通合伙人手里，不在单个被投公司手里，并且越来越多地被拿来向有限合伙人证明价值创造能力（CM046、CM010）。对冲基金和资产管理公司会把
              AI/另类数据工具预算与纯数据采购分开，软件和技术通常吃掉这笔独立预算的三分之一到一半（CM047）；94% 受访基金经理预计 2026 年增加这项支出（CM026），60%
              机构投资人表示，他们更愿意把资本分配给对生成式 AI 研究投入可观预算的基金（CM028）——这是由 LP 驱动的采用触发点，区别于单笔交易 ROI。企业发展和内部 M&A 团队则补全版图：这是一个更小、由
              CFO 预算负责的细分市场，动机是减少对付费顾问费用的依赖。供应商和竞品评论印证了这个框架：Rogo 和 Hebbia 面向大型金融机构以及企业级银行 / PE
              团队定位，而更小的新进入者用更精简的交易团队切入私募信贷基金和家族办公室（CM021、CM022）。
