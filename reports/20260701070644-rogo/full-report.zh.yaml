      - number: '8.3'
        title: 投资论点、反论点与情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景建立在品类领导地位上：Rogo 的融资节奏（四家蓝筹投资者复投，加上一家新的顶级领投方）、本尽调其他章节记录的其在具名大型投行和顶级精品投行账户中的嵌入位置，以及 AI 捕获 2026 年 Q1
              全球风险投资约 80% 的宏观背景，都支持一个判断：资本正集中到被认为是品类赢家的公司身上，而不是无差别扩散。反论点是，用来支撑价格的同一组可比公司——Hebbia、Glean、AlphaSense——自身就因
              12.5x–54x ARR 倍数且缺乏公开市场流动性而受到公开质疑；Rogo 也没有披露收入、利润率或留存数据，让外部投资者无法确认它应获得类似倍数，而不是公开工作流软件倍数。基准情景下，Rogo 仍未披露的当前
              ARR 低于 $2 billion 标记在 AI-native 倍数下所需水平，因此下一轮名义估值守住，但随着披露追上来，实际倍数压缩；熊市情景下，低于市场传闻的 ARR
              披露或一个大型投行账户流失，会迫使降价轮。牛市情景有真实、可验证的融资信号支撑；反论点同样有真实披露缺口支撑。二者同时成立，这正是本章立场是跟踪 / 继续研究，而不是方向性判断的原因。
