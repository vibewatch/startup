              tone: warning
            - label: EU AI Act 高风险执法缺口
              tone: negative
            - label: 估值回调 / 下轮降估值
              tone: negative
        - label: 低可能性
          values:
            - label: SEC 以 AI 包装执法直接点名 Rogo
              tone: neutral
            - label: 确认发生安全 / 数据处理事件
              tone: warning
            - label: 真实交易文件中出现推导级幻觉
              tone: warning
            - label: 证券诉讼或执法点名 Rogo
              tone: negative
