      - number: '1.3'
        title: 融资历史、估值与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Rogo 的融资历史又短又陡。Citybiz 和 Sacra 都报道，Rogo 在 2024 年 2 月完成 $7 million 种子轮，由 AlleyCorp 领投，Company
              Ventures、BoxGroup 和 ScOp Ventures 参投；SixThirty Ventures 另行估计，该种子轮的投后估值约为 $48 million。2024 年 10 月 1 日，Rogo
              自己发布新闻稿，宣布完成 $18.5 million A 轮，由 Khosla Ventures 领投，投后估值 $80 million，Mantis VC、Jack Altman 和前 Google CEO
              Eric Schmidt 参投，Khosla 普通合伙人 Keith Rabois 加入董事会；累计融资达到 $26 million。约在 2025 年 4 月，Rogo 完成 $50 million B 轮，由
              Thrive Capital 领投，J.P. Morgan Growth Equity Partners、Tiger Global 和 Positive Sum Ventures 加入，累计融资升至 $75
              million，Forbes 和 Sacra 都把估值放在接近 $350 million 的水平。


              随后节奏明显加速。2026 年 1 月，Rogo 宣布完成 $75 million C 轮，由 Sequoia Capital 领投，个人投资人 Henry Kravis（KKR 联合创始人）和 Wells
              Fargo 参与，使累计融资超过 $165 million，估值达到 $750 million——不到一年就较 B 轮标记翻了一倍多——并为 Rogo 在 London
              开设首个国际办公室提供资金。仅三个月后，2026 年 4 月 29 日，Rogo 宣布完成 $160 million D 轮，由 Kleiner Perkins 领投，Sequoia、Thrive
              Capital、Khosla Ventures、J.P. Morgan Growth Equity Partners、BoxGroup、Mantis VC、Jack Altman、Evantic 和
              Positive Sum 加入。D 轮把累计融资推高到 $300 million 以上；Bloomberg 和 TBPN Digest 的独立报道称，Rogo 该轮估值为 $2
              billion——三个月里几乎翻三倍。


              投资人名单更像一个集中且高确信度的财团，而不是广撒网：AlleyCorp、Khosla、Thrive、Sequoia 这四家机构领投方加上 Kleiner Perkins 覆盖了每一轮定价融资，J.P.
              Morgan Growth Equity Partners 和 Henry Kravis 则显著地把风险资本世界与传统金融机构连接起来。SixThirty Ventures 在 A 轮同期评论里提出的问题，到了
              D 轮价格仍然成立：整个 AI 分析师赛道（包括 Rogo）的估值，相对已展示的牵引力，是否已经按离群级收入倍数定价。
