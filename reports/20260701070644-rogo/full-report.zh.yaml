      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公司概览已经梳理 Rogo 从 2024 年种子轮到 2026 年 4 月 Series D 的逐轮融资时间线；本章不再复述，转而看前瞻性的资本充足性。两个独立数据跟踪器对累计融资总额大体一致：CB
              Insights 列示六轮共融资 $310.5 million，Growjo 列示 $314 million，都与公司概览已确认的「超过 $300 million」相符。2024 年 7 月 25 日，「Rogo
              Series A ScOp SPV Jul 2024, a Series of CGF2021 LLC」向 SEC 提交 Form D；该 Delaware 实体主张 Section 3(c)(1)
              私募基金豁免，独立确认至少一名 Series A 投资方 ScOp Ventures 通过特殊目的载体投资，而不是直接投向 Rogo。该文件本身没有披露 Rogo Series A 的估值或轮次规模，因为该馈入型
              SPV 的 Form D 报告覆盖的是其自身发行，而不是底层被投公司的条款。资金用途上，Rogo 官方 Series D 公告称资本将深化机构合作、扩展 Felix
              智能体平台并加速全球扩张，但没有在这些用途之间给出具体金额分配；此前 Series C 报道称，当时 Rogo 员工刚过 100 人，融资用于欧洲增长、扩大 R&D
              能力，以及为北美合作伙伴提供跨境支持。已审阅资料均未披露 Rogo 手头现金、月度烧钱或现金续航月数，因此资本充足性只能靠推断：仅已披露的招聘承诺（422 个新岗位、约 $14 million 总部资本开支、约
              $40 million 计划 R&D 支出）就指向一个资本密集的近期增长阶段；在任何可见盈利拐点前，它会消耗已募资金的相当一部分。Axios Pro 2026 年 1 月 28
              日独家报道独立佐证了公司概览已使用的 $750 million Series C 估值；尽管正文在标题之后付费墙不可见，它仍为该数字提供了额外独立数据点。
