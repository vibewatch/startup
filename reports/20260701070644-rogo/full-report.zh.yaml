      - number: '5.5'
        title: 自建还是收购：并购与平台扩展
        blocks:
          - type: paragraph
            body: >-
              Rogo 没有把所有能力都放在内部自建，而是靠收购快速补能力。Subset（2025 年收购）带来一个电子表格智能体，能理解复杂金融模型公式和区域，并连接 Capital
              IQ、FactSet、PitchBook、LSEG 及机构私有数据，用来搭建、滚动更新和审计模型；其创始人为 Jason Chan（曾任 Bank of America、Providence Equity
              Partners）和 AJ Nandi（曾任 Insight Partners）。Offset（2026 年 3 月宣布）由 Raj Khare 和 Shiv Shrivastava
              创立，构建能记住特定财务模型假设、公式和输出如何随时间演变的智能体系统，让模型在新信息到来后自动维护——这与一次性生成模型是结构上不同的问题。Plux AI（2026 年初）由 Deepak Guneja 和
              Pratyush Chaudhary 创立，监测申报文件、贷款方更新、法院文件和公司披露，提炼长文本市场信号，并扩大了 Rogo 在英国 / 欧洲的覆盖和工程团队存在。


              分发扩张既靠合作，也靠收购。2026 年 6 月，Microsoft 将 Rogo 与 LSEG、Ramp、Vena 一起列为 Copilot for Excel 合作伙伴构建技能的首批伙伴，并计划自 2026
              年第三季度起通过 Microsoft Marketplace 销售——这把 Rogo 放进了一个分发渠道，而 Microsoft 自己也在用同一渠道销售其独立扩张的金融数据连接器组合。Rogo
              创始人已直接承认这种动态：Rogo 同时是 OpenAI 和 Anthropic 的客户、分发伙伴、潜在竞争目标，因为两家模型供应商也分别在自建面向金融的 AI 产品。
