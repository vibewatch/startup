      - number: '2.5'
        title: 采用约束、监管摩擦与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              三股力量限制预算转化为已签合同的速度。第一是传统厂商打包。Microsoft 在 2026 年推出金融专用 Copilot 能力，包括嵌入 Excel、Outlook 和 Teams 的 Finance
              Agent，面向 FP&A、会计、税务、合规和资金管理工作流（CM029、CM030），让 IT 买方在已经批准的支出里拿到一个「足够好」的打包替代品——即便 Microsoft 自己的 Copilot
              付费席位渗透率估计只有约 3.3%，对应其已安装基数和 $190 billion 的 2026 年 AI 资本开支，差距已经引发投资人对传统厂商 AI 货币化的普遍怀疑（CM031）。第二是监管监督。FINRA
              的 2026 Annual Regulatory Oversight Report 首次加入专门的生成式 AI 章节，点名幻觉风险、偏见、网络安全暴露，并把监督扩展到自主「智能体式」AI（CM032）；SEC 的
              FY2026 检查重点也提高了对 AI 治理、可解释性和营销声明中「AI-washing」的审查，要求保留 AI prompt/output
              日志，作为受监管的账簿和记录（CM033）。供应商不能把这项合规负担外包给买方，也不能声称不知情（CM034）；EU AI Act 最重要的执行阶段将在 2026 年 8
              月触达金融服务业（CM040）。第三是需求侧怀疑。MIT 的 GenAI Divide 研究发现，按六个月 ROI 测试，企业生成式 AI 试点失败率为 95%（CM035）；61% 企业领导者表示，证明 AI
              ROI 的压力比一年前更大（CM036）；人才 / 技能短缺是 71% 企业评估 AI 但没有实施的首要原因（CM039）。这些约束没有哪一项会致命打穿 Rogo 的论点，但它们与尚未解决的 SAM/SOM
              缺口（CM043）、缺少当前精确的美国 经纪交易商可触达数量一起，定义了投资人在支撑具体市场份额假设前应走的尽调路径。
