  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 维度
      - 投资论点
      - 反论点（什么会改变判断）
    rows:
      - - 品类定位
        - 按 Series D 领投方说法，Rogo 正在成为金融垂直 AI 的品类定义型「操作系统」
        - 如果大型投行推出同等能力的自研工具，或 Microsoft/Bloomberg 捆绑工具达到同等能力，品类领导者溢价会压缩
      - - 融资节奏
        - 四家蓝筹投资人跨轮次跟投，显示财团对 Rogo 增长有信心
        - 一次降价轮，或此前领投方未能续投，都会是强负面信号
      - - 可比公司重估
        - AI 原生同业（Hebbia、Glean、AlphaSense）均因披露 ARR 增长而上调估值，说明整个品类仍有重估空间
        - 同一批同业也因 12.5x–54x ARR 倍数且无公开流动性而遭遇公开质疑；其中任何一家修正，都可能重定价整个品类
      - - 上市可比公司
        - 既有数据平台（FactSet、Intapp、S&P Global）证明，AI 增强工作流收入真实且可变现
        - 这些既有公司交易倍数是 3x–4x 收入，不是私有 AI 原生融资暗含的两位数倍数——Rogo 的价格假设它能摆脱这种估值重力
      - - 宏观背景
        - AI 拿走 2026 年 Q1 全球风投资金约 80%，证明资本仍偏爱品类领导者
        - 据报私有 AI 估值自 2025 年末以来下降 23%，AI 投资收入比为 4:1，二者都指向广泛重定价风险
      - - 披露
        - Rogo 的增长叙事（融资节奏、投资人质量、客户数增长）获得独立佐证
        - 当年 ARR、毛利率、净收入留存和现金续航期仍未披露，阻碍任何独立承保
    notes: 每行把一个投资论点和会推翻该论点的具体证据配对；内容同时来自 Rogo 相关融资事实，以及本章其他位置引用的 2025–2026 年可比公司和宏观来源。
    claimRefs:
