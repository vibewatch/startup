chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              Rogo 是一家位于纽约州纽约市的 AI 公司，搭建专为金融服务设计的企业平台，卖给投资银行、私募股权机构和资产管理公司，而不是面向所有知识工作者的横向工具。公司材料以及 Forbes 和多篇 2026
              年融资报道都这样描述：平台把微调金融推理模型，与客户公司内部系统（SharePoint、CRM、数据室）和授权外部数据（FactSet、LSEG、S&P
              Global、PitchBook）深度整合，自动化研究、财务建模、可比公司分析和路演材料制作。截至 2026-07-01 运行日，Rogo 明确属于风险投资支持的后期私营公司：已经融到 D 轮，据报估值 $2
              billion，用户覆盖 250 多家机构的 35,000 多名专业人士。


              公司的成立日期，是记录中少数真正有争议的事实之一。Forbes 2026 年公司简介和 New York Weekly 的一篇特写都把 Rogo 的成立时间写成 2022 年，但 Rogo 自己 2024 年
              10 月的 A 轮新闻稿，以及 Hebbia 2026 年的一份竞品分析，都称 Rogo「成立于 2021 年」。Bloomberg 对 D 轮的报道有助于调和这个差异：它写道，联合创始人 Gabriel
              Stengel 在「2021 年底」离开 Lazard，开始和联合创始人在 Manhattan 的厨房桌旁搭产品，正式成立公司则发生在 2022 年。后续章节应以 2022
              年作为主要参考年份，同时注明来源之间的一年差异。


              Rogo 的核心产品架构围绕 Felix 展开。Felix 是随 2026 年 4 月 D 轮推出的自主 AI 智能体，用很少的人为介入执行多步骤金融工作流——交易筛选、CIM
              生成、买方触达、数据室尽调。尽调材料提到的「Rogo Research」「Rogo Comps」「Rogo Models」或「Rogo Pitchbook」等具名产品线，无法与 Rogo 当前网站或任何已抓取的
              2026 年报道交叉证实；公司实际公开的产品结构是 Felix 加一组授权数据连接器，这一缺口保留为开放问题，而不是靠假设补上。
