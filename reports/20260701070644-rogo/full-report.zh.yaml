  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 与 Rogo 的相关性
      - 局限
    rows:
      - - Hebbia（私有，Series B，2024 年中）
        - $13M ARR，已盈利
        - $700M 估值，约 54x ARR
        - 按买方重叠度看最接近的 AI 原生同业（资产管理人、银行、律所）
        - 该轮距今已两年；当前 ARR / 估值未披露
      - - Glean（私有，Series F，2025 年 6 月；ARR 2026 年 5 月更新）
        - $300M 年化收入（2026 年 5 月），对应 $7.2B 估值（2025 年 6 月）
        - 约 24x 当前年化收入，低于 $100M ARR 时的约 72x
        - 显示 AI 原生倍数在 ARR 扩大后压缩得有多快
        - 横向企业搜索，不是金融垂直；估值未按当前 ARR 重新定价
      - - AlphaSense（私有，2026 年 6 月融资轮）
        - $600M ARR（2026 年 Q1）
        - $7.5B 估值，约 12.5x ARR
        - 买方重叠（银行、资产管理人）和工作流品类最接近
        - 内容库商业模式比 Rogo 的智能体优先产品更宽
      - - 'FactSet（上市，NYSE: FDS）'
        - 过去 12 个月收入 $2.40B，FY2025 净利润 $597M
        - 市值约 $8.38B，EV/Sales 约 4.0x（低于 2025 年 10 月约 $10.67B 市值）
        - Rogo 自身智能体拉取可比公司的既有数据 / 工作流平台
        - 上市倍数反映成熟盈利业务，不是成长阶段 AI 产品
      - - 'Intapp（上市，Nasdaq: INTA）'
        - $560M 总 ARR（同比 +23%），FY2026 收入指引 $574–575M
        - 市值约 $2B，EV/Revenue 约 3.1x，EV/EBITDA 约 15.1x
        - 专业 / 金融服务领域的上市垂直工作流 SaaS 可比公司
        - 不是 AI 原生；倍数反映传统业务加 AI 功能定位，不是 AI 优先定价
      - - 'S&P Global Market Intelligence / Capital IQ（上市，NYSE: SPGI，分部）'
        - 为 FY2025 合并收入 $15.336B（同比 +8%）贡献收入
        - 分部未单独按市场定价
        - 正在搭建自有智能体层（Kensho Grounding）的数据平台既有厂商
        - 分部收入未与母公司单独拆分；不是干净的独立倍数
    notes: 覆盖范围是代表性样本，并非所有 AI 金融或垂直 SaaS 可比公司的穷尽列表；选择这些行，是因为它们与 Rogo 有直接买方或工作流重叠，并且在 2025–2026 年来源中至少有一个已披露估值收入数据点。
    enumerationScope:
      coverage: sample
      basis: >-
        Sample selected from 2025-2026 disclosed private financing rounds and public-market filings for AI-native
        finance-research peers and incumbent data/workflow platforms with direct buyer overlap
