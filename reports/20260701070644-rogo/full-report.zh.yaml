      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 对 Rogo 的意义
    rows:
      - - 面向 IB/PE/AM 的 AI 研究与工作流自动化软件（核心类别）
        - 面向银行、PE 机构、对冲基金和资管公司销售的智能体式 AI 工具，用于拉取可比公司数据、综合尽调、起草推介书、自动化建模
        - 通用消费者 AI 聊天；非金融垂直行业
