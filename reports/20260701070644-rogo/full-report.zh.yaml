      - number: '3.5'
        title: 护城河耐久性、商品化风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              Rogo 最耐久的护城河不在模型层，而在工作流集成层：深度接入银行自己的 SharePoint、CRM 和数据室，再叠加授权外部数据合作（LSEG、PitchBook、S&P
              Global、FactSet），创造出横向智能助手无法复制的切换成本，除非后者也逐家银行完成同样的金融专用集成工作。但这道护城河在三处比看起来更暴露。第一，在最大、最赚钱的账户里，大型投行越来越倾向于自建而不是采购：JPMorgan
              的 LLM Suite 已经能用银行自己的专有数据在约 30 秒内生成完整路演材料，并且每八周刷新一次，直接替代 Rogo 所售工作流。第二，Hebbia 约 $700 million
              估值和重叠的企业客户基础，使它不是小众陪跑，而是资本充足的直接竞争对手；F2 独立基准测试过的 Excel 引擎，则为确定性计算设下了公开可靠性门槛，Rogo 和 Hebbia
              都没有用披露结果追上。第三，也是对整个品类最关键的一点，独立可靠性基准确实不利：BankerToolBench 研究由 Goldman Sachs、JPMorgan、Morgan Stanley 和
              Evercore 的 502 名投行人员共同构建，发现 9 个被测试 AI 模型没有一个能在无人修改下产出客户就绪内容；配套基准还测得领先模型的幻觉率为 86%。Deloitte Australia 2025 年
              7 月向澳大利亚政府提交含伪造引用报告的真实失败案例，说明这不是理论风险。包括 Rogo、Bloomberg 的 ASKB、LSEG 的 Deep Research 和 Kensho 的 API
              在内，所有严肃供应商的缓解模式都相同：让每个答案都落在有来源链接的引用上，使错误可以被审计，而不只是减少错误数量。Rogo
              自己对这一原则的实现，能否承受与传统厂商同样的审视，仍是本章公开来源无法回答的开放尽调问题。
