  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前人工流程
      - Rogo 方案
      - 可量化收益
      - 局限
    rows:
      - - 交易筛选
        - 在多个数据终端按投资假设人工筛选标的清单
        - Felix 从已连接数据源中按既定标准筛选标的
        - 每笔交易少花数小时手工建清单
        - 筛选质量取决于投资假设是否写得足够清楚
      - - CIM 生成
        - 分析师手工起草 50-100 页卖方备忘录
        - Felix 基于已连接交易数据和机构模板起草 CIM 章节
        - Rogo 和独立叙述称，起草时间从数天压到数小时
        - 产出仍必须贴合机构固定文风，才能真正可用
      - - 买方触达
        - 分析师手工整理联系人清单和触达文案
        - Felix 生成个性化买方联系人清单和首轮沟通稿
        - 加快早期买方清单搭建
        - 个性化质量没有独立基准测试
      - - 数据室尽调
        - 分析师手工审阅交易数据室里的大量文件
        - Felix 汇总数据室文件，提炼关键发现
        - 减少手工审文件时间
        - 超大或结构混乱文件集的覆盖率没有独立验证
      - - 电子表格模型搭建 / 维护
        - 分析师搭建并滚动更新 40 个工作表的模型，链接脆弱
        - 来自 Subset 的电子表格智能体搭建、滚动更新并审计模型，同时追踪驱动项
        - 按 Rogo 说法，模型更新从数天缩到数秒
        - 高度定制或遗留模型结构上的可靠性没有独立测试
      - - 数据变化后的模型维护
        - 新数据到来后，分析师手工复核并更新假设
        - 来自 Offset 的智能体跟踪模型假设和公式如何变化，并自动更新
        - 新信息到来时减少手工返工
        - 刚整合（2026 年 3 月宣布）；生产环境记录有限
      - - 工作簿内分析
        - 分析师在终端、浏览器和 Excel 之间切换来填模型
        - Excel Plug-in 让 Felix 在工作簿内填充财务数据并搭建分析
        - 减少工具之间的上下文切换
        - 前提是机构数据源已经接入 Rogo
    notes: 收益数据来自 Rogo 自家公告和独立评论；没有一项来自独立审计的工时研究。
