      - number: '5.2'
        title: 数据、模型与编排架构
        blocks:
          - type: paragraph
            body: >-
              独立技术报道把 Felix 描述成一套编排外壳，而不是单个微调模型：编排脚手架、工具层、引用系统、输出格式化器和审计轨迹共同构成外壳；Rogo 再接入内部基准上表现最佳的前沿模型，目前覆盖
              OpenAI、Anthropic 和
              Google。另一份独立案例研究描述了这套外壳下的分层路由：主模型处理基于聊天的分析，小模型处理数据语境化和搜索结构化，顶级模型留给评估和合成数据生成，在不同任务类型之间权衡质量、延迟和推理成本。


              数据层覆盖授权外部数据商，核心包括 LSEG、S&P Capital IQ/FactSet 和 PitchBook，也包括 Moody's、Daloopa、Affinity；内部连接器则接到
              SharePoint、Salesforce 和机构专属文档库。Rogo 维护自己由从业者编写的评估套件 Big Finance Benchmark，并在 GitHub
              发布了参考框架；它只保留最小四工具脚手架（网页搜索、SEC EDGAR 搜索、URL 抓取、沙箱化 Python 执行），有意排除高级数据源和向量库检索，让评估衡量底层模型，而不是 Rogo 自己的工具。
