      - number: '8.4'
        title: 宏观 AI 估值背景与竞争捆绑风险
        blocks:
          - type: paragraph
            body: >-
              全行业数据让「私募 AI 倍数会简单延续」这一假设变得复杂。一项引用 PitchBook 和 IDC 数据的分析估计，年度 AI 投资约 $400 billion，而已实现企业 AI 收入只有约 $100
              billion，比例为 4:1；该分析将其类比为以往修正前的技术周期，并称私募 AI 创业公司估值自 2025 年末以来已下跌约 23%。另一份融资追踪显示，2026 年 AI 交易数量同比下降约
              14%，但投资总额上升；其描述的是一个杠铃市场：巨额融资轮和微型融资轮增长，而缺乏强指标的中期创业公司挣扎，并称 2026 年倒闭的 AI 公司数量超过前三年总和。竞争上，在位厂商没有停下：Microsoft 把
              Copilot for Finance 附加产品捆绑进既有 Microsoft 365 席位基础；Bloomberg 在其 $12.6 billion 收入的 Terminal 上增加了 agentic
              界面；与此同时，Perplexity 的竞争产品「Computer」展示出相近研究和建模功能，成本只是很小一部分；S&P Global 的 Kensho 部门则直接在 Rogo agents 所授权使用的
              Capital IQ 数据之上，构建了自己的 agentic「Grounding」框架。上述情况都不能证明替代已经发生，但它们是溢价倍数所假设定价权的结构性逆风。S&P Global 自己的 2026
              年劳动力市场调查还增加了一个更长期担忧：大型企业——Rogo 的核心买方群体——预计 AI 驱动就业影响为净负，这最终可能缩小 Rogo 工作流产品要增强的初级分析师人数。
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
      - number: '8.5'
        title: 退出准备度与验证路径
        blocks:
          - type: paragraph
            body: >-
              接近 Rogo 品类的 AI-native 企业研究同行还没有进入公开市场，因此没有上市退出可比公司可用来锚定最终倍数。Built In 2026 年 IPO 观察名单把 Databricks
              列为唯一接近上市且披露盈利能力的大型 AI-native 公司（约 $5.4 billion 年化收入、自由现金流为正）；OpenAI 和 Anthropic 尽管估值被讨论到 $850 billion 和
              $900 billion 以上，仍未盈利。另一份 AI IPO 追踪称 2026 年是史上 AI 集中度最高的 IPO 年，但指出后期私募倍数仍明显低于 2021–2022 年峰值；一项 pre-IPO
              市场分析发现，2026 年 IPO 轨道上的创业公司只有约四分之一真正准备好上市，其余卡在过期披露窗口和公开投资者无法接受的估值之间。Rogo 自身迄今是收购方——收购 Offset
              和本尽调其他部分提到的其他标的——而非被收购标的；这削弱了近期战略出售情景，相对更支持更长续航期后走向 IPO 或更晚、更大的战略交易。FactSet、S&P Global 和 Bloomberg
              是结构上最有可能考虑把 Rogo 作为收购标的而非竞争对手的在位厂商，因为它们各自已经在独立建设 agentic research
              能力。补齐本章最大证据缺口——当年收入、利润率、留存、现金续航期，以及任何二级市场定价——比继续做更多可比公司研究更能明确估值立场。
            claimRefs:
              - CV030
              - CV031
              - CV034
              - CV037
              - CV042
              - CV043
          - type: table
            tableRef: TV006
            claimRefs:
              - CV032
              - CV041
      - number: '8.6'
        title: 论点破裂触发器与最终估值立场
        blocks:
          - type: paragraph
            body: >-
              少数具体事件会把本章不确定性推向一个方向：Rogo 下一轮融资出现降价轮或平轮；披露的当年 ARR 隐含倍数高于 12.5x–54x
              可比区间；一个标志性大型投行或顶级精品投行账户因流失或自研而丢失；确认有账户切换到捆绑式在位厂商工具（Microsoft Copilot for Finance、Bloomberg agentic
              Terminal，或 S&P Global / Kensho 产品）；或独立二级市场交易把 Rogo 定价在 $2 billion
              以下。截至本轮，这些都没有被观察到。综合权衡证据——真实、可验证的融资和投资者质量信号，对上未披露收入基础、自身也受到公开争议的可比组，以及全行业倍数压缩和捆绑风险——本章估值立场是：相对今天能独立承销的证据，$2
              billion 标记看起来偏高；但考虑到私募市场可比区间，它并非不可辩护。合适姿态是跟踪 / 继续研究，而不是直接买入或回避：买入需要独立验证的当年 ARR
              和利润率数据，公共记录中目前还没有；回避也没有足够支撑，因为融资节奏和复投模式是真实信号，说明机构信心仍在，而本尽调已独立佐证这些信号。
            claimRefs:
              - CV034
              - CV040
              - CV041
              - CV044
