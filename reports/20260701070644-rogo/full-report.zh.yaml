  - id: FV001
    title: 从证据到建议：估值逻辑链
    type: flow
    layout: standard
    summary: 从已披露的规模与融资证据，串到未披露的单位经济，再到本章跟踪 / 继续研究建议。
    data:
      nodes:
        - id: n1
          label: 已披露证据：融资节奏、投资方复投、logo 增长
        - id: n2
          label: 未披露：当前 ARR、利润率、留存、现金续航期
        - id: n3
          label: 可比倍数：Hebbia ~54x、Glean ~24x、AlphaSense ~12.5x ARR
        - id: n4
          label: 上市可比公司：FactSet ~4.0x、Intapp ~3.1x EV/Revenue
        - id: n5
          label: 建议：跟踪 / 继续研究，而非买入或回避
      edges:
        - source: n1
          target: n5
        - source: n2
          target: n5
        - source: n3
          target: n5
        - source: n4
          target: n5
    approximationNotes: 节点标签概括本章发现；流程展示逻辑依赖，不是加权评分模型。
    claimRefs:
      - CV001
      - CV032
      - CV004
      - CV011
  - id: FV002
    title: 估值对所用倍数的敏感性
    type: bar
    layout: standard
    summary: 用本章私募轮可比公司与公开市场可比公司观察到的 ARR 倍数区间，示意隐含估值对所用倍数的敏感度——并非关于 Rogo 实际 ARR 的判断。
    data:
      items:
        - label: 上市既有厂商倍数（FactSet / Intapp，~3-4x EV/Revenue）
          value: 3.5
        - label: 上市 AI 原生软件中位数（~3.7x EV/Revenue，2026 年 6 月）
          value: 3.7
        - label: AlphaSense 私募轮倍数（~12.5x ARR）
          value: 12.5
        - label: Glean 当前年化收入倍数（~24x）
          value: 24
        - label: Hebbia 私募轮倍数（~54x ARR）
          value: 54
        - label: Glean 此前 72x ARR 估值记录（2025 年 6 月，ARR 为 $100M）
          value: 72
    approximationNotes: 柱形图绘制的是倍数，不是美元估值，因为 Rogo 自身 ARR 未披露；这个区间说明，在假设不同可比倍数适用时，同一个 $2B 价格会被解读得多么不同。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV015
  - id: FV003
    title: 上市可比公司倍数区间与私募 AI 原生倍数带
    type: range
    layout: standard
    summary: Rogo 最接近的上市可比公司 EV/Revenue 倍数区间，与私募 AI 原生同业轮次隐含的更宽倍数带对照；如果用上市而非私募可比公司作基准，$2B 价格必须跨过这道缺口。
    data:
      items:
        - label: '上市可比低点：Intapp（Nasdaq: INTA）EV/Revenue'
          low: 3.1
          high: 3.1
        - label: 上市 AI 原生软件 EV/Revenue 中位数（2026 年 6 月数据集）
          low: 3.7
          high: 3.7
        - label: '上市可比高点：FactSet（NYSE: FDS）EV/Sales'
          low: 4
          high: 4
        - label: 私募 AI 原生同业 ARR 倍数带（AlphaSense 至 Hebbia）
          low: 12.5
          high: 54
    approximationNotes: >-
      数值是 EV/Revenue 或 EV/Sales 倍数，不是美元估值，因为 Rogo 自身 ARR 未披露；上市可比公司的区间收敛为单点，因为每家公司只有一个离散、已披露的倍数，私募倍数带则覆盖本章观察到的
      AlphaSense 到 Hebbia 全区间。
    claimRefs:
      - CV004
      - CV008
      - CV011
      - CV013
  - id: FV004
    title: 投资尽调 KPI 记分卡
    type: kpi
    layout: compact
    summary: 截至本轮，本章按市场验证、护城河、单位经济、估值支撑和证据质量给出可提交 IC 的评分。
    data:
      items:
        - label: 市场 / 品类定位
          value: Investor-described as a category-defining 'operating system' for finance-vertical AI
          score: 8
        - label: 融资证据（复投、财团质量）
          value: Four blue-chip prior-round investors reinvested in the Series D
          score: 8
        - label: 已披露单位经济
          value: Current ARR, margin, retention, and cash runway all undisclosed
          score: 2
        - label: 估值支撑（可比公司）
          value: Private comparables (12.5x-54x ARR) support a premium multiple, but none are disclosed for Rogo itself
          score: 4
        - label: 赛道 / 宏观背景
          value: 4:1 AI investment-to-revenue ratio and ~23% reported private AI valuation decline since late 2025
          score: 3
        - label: 竞争 / 捆绑销售风险
          value: Microsoft, Bloomberg, and S&P Global/Kensho all shipping competing or adjacent agentic capability
          score: 4
    approximationNotes: 分数是本次尽调的定性 0-10 判断，不是供应商或投资方给出的评级。
    claimRefs:
      - CV002
      - CV025
      - CV028
      - CV032
      - CV040
