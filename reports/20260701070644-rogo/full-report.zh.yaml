      - number: '5.7'
        title: 图表
        blocks:
          - type: callout
            title: Rogo 宣称的护城河在编排框架，不在模型
            body: >-
              独立技术报道明确称，Felix 是一套编排框架——工具层、引用系统、输出格式化器、审计轨迹——Rogo 把当前表现最佳的 OpenAI、Anthropic 或 Google
              前沿模型接入其中，而不是依赖单个微调模型。这种分离意味着前沿模型升级原则上是配置变更，不是重写；Rogo 自己由从业者编写的 Big Finance Benchmark
              也强化了这一点，因为该基准决定哪个模型版本驱动生产环境中的 Felix。
            calloutType: strength
            claimRefs:
              - CE002
              - CE021
              - CE026
          - type: callout
            title: 推导级准确率仍落后于精美输出
            body: >-
              Rogo 自己的配套研究论文 BigFinanceBench 发现，在十个当前前沿和开放权重智能体中，最佳系统在嵌入工作流的金融推导任务上也只拿到可用评分点的
              58.8%；最终答案准确率只是判断智能体是否把底层来源、期间和计算步骤做对的有损代理指标。再叠加一篇独立分析指出 Rogo
              自身使用指标为自报且未验证，这就是最清晰的证据：约束这些工作流能否在无人监督下被信任的，不只是格式是否精美，而是引用粒度和步骤级准确率。
            calloutType: risk
            claimRefs:
              - CE023
              - CE024
              - CE028
          - type: callout
            title: 模型与分发依赖是双刃剑
            body: >-
              Rogo 创始人已公开承认，Rogo 同时是 OpenAI 和 Anthropic 的客户、分发伙伴、潜在竞争目标。同一动态如今延伸到分发：Microsoft 在 2026 年 6 月将 Rogo 列为
              Copilot-in-Excel 技能的首批伙伴，但同一次更新也加入了 Microsoft 自己连接 Rogo 多个数据伙伴（FactSet、PitchBook、S&P
              Global）的实时连接器；也就是说，Rogo 依赖的 Excel 原生分发渠道，同时在构建与之竞争的原生能力。
