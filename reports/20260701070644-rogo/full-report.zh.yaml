  - id: TU005
    title: 扩张和集中度风险表
    columns:
      - 扩张驱动
      - 集中度风险
      - 影响
      - 尽调路径
    rows:
      - - 前置部署的银行家模型降低新头部投行账户的切换摩擦
        - 同一模型依赖一支规模小、难扩张的前银行家部署团队
        - 增长可能超过前置部署团队的产能，导致新账户无法享受同样的白手套导入流程
        - 索要前置部署人数与机构账户数的对比
      - - 多模型架构（OpenAI、Anthropic、Google Gemini）降低 Rogo 自身的供应商锁定
        - 采用 Rogo 的机构会在关键交易工作流上依赖单一供应商 Rogo
        - 若 Rogo 宕机、涨价或质量回落，客户交易时间表可能受冲击，交易中途也很难替换
        - 向 Rogo 索要业务连续性和多供应计划
      - - 数据合作伙伴集成（LSEG、PitchBook、Daloopa）扩大共享客户的工作流覆盖
        - Rogo 的客户价值主张取决于同时维持三项数据授权关系
        - 任何一个数据合作丢失或重谈，都可能削弱面向客户的产品；结果不由 Rogo 完全控制
        - 确认每项数据合作的最低合同期限和续约日期
      - - 借头部投行背书向精品投行 / 中端市场扩张
        - 背书基础仍集中在少数具名头部投行 Logo（Jefferies、Lazard、Moelis、Nomura、Rothschild & Co）
        - 若一个标杆 Logo 流失或降级，精品投行销售所依赖的信誉光环可能被不成比例地削弱
        - 跟踪五到六个具名标杆 Logo 的续约状态，将其作为领先指标
      - - 投资方兼客户关系（Truist、J.P. Morgan）可加速采购
        - 同一重叠也会带来背书偏差和优惠准入问题，影响客户证据可信度
        - 外部尽调无法彻底拆分这些账户的真实产品市场契合与投资方善意带来的采用
        - 安排非投资方客户访谈，以控制这一偏差
      - - 平均八个月从 POC 到生产部署，说明企业销售动作一旦启动可重复
        - 同样的长周期会拖慢扩张，也给现有终端（Bloomberg、FactSet、S&P Capital IQ）留下上线竞争性 AI 功能的时间
        - 新增账户增长放慢，可能压缩当前采用叙事支撑的估值倍数
        - 跟踪机构 Logo 净新增的环比变化
    notes: 每行把扩张驱动与镜像集中度风险配对，而非分开列示，反映同一机制在这组证据中如何双向作用。
