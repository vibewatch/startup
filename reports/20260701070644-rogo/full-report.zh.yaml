      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 支付价格不等于内在价值
            body: >-
              本章把 Rogo 的 $2 billion Series D 估值视为一个特定知情投资者财团在 2026 年 4 月 29 日愿意支付的价格，而不是独立承销后的内在价值。由于审阅来源没有披露 Rogo 自身当年
              ARR、毛利率、净收入留存或现金续航期，本章刻意避免构建 Rogo 自身 DCF 或 ARR 倍数估值，而是通过可比私募融资、公开市场倍数和宏观融资条件评估该价格。
            calloutType: assumption
            claimRefs:
              - CV001
              - CV032
              - CV036
          - type: callout
            title: 可比组本身也受到公开质疑
            body: >-
              Hebbia、Glean 和 AlphaSense 是按买方重叠度最接近的 AI-native 可比公司，但它们都带着 12.5x–54x 的 ARR
              倍数；独立分析师已经指出，这些倍数激进、未经公开市场流动性验证，或依赖持续高增长。用一个本身有争议的可比组对标 Rogo，并不能解决估值问题，只是把同样的不确定性转移到 Rogo 价格上。
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV019
          - type: callout
            title: 在位厂商没有停下
            body: >-
              Microsoft 捆绑式 Copilot for Finance、Bloomberg 新的 agentic Terminal 界面（旁边还有 Perplexity Computer 这个可信外部挑战者），以及
              S&P Global 内部 Kensho agentic 框架，都指向同一方向：Rogo
              竞争的工作流层，正在被拥有既有分发、数据和资产负债表的在位厂商争夺。上述情况都不能证明替代已经发生，但它们会成为溢价私募估值中支付意愿假设的结构性逆风。
            calloutType: risk
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
          - type: callout
            title: 跟踪 / 继续研究，而不是买入或回避
            body: >-
              在一个由财团定价但未经市场检验的估值、未披露收入基础，以及真实但有争议的品类领导地位之间，本章立场是跟踪 / 继续研究。买入需要独立验证的当年 ARR
              和利润率数据；回避也没有足够支撑，因为融资节奏和投资者质量是真实、可验证的信号，显示机构信心仍在。
            calloutType: recommendation
            claimRefs:
              - CV044
              - CV001
              - CV003
