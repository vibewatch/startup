      - number: '5.4'
        title: 信任、安全与监管合规作为产品助推器
        blocks:
          - type: paragraph
            body: >-
              Rogo 的信任中心列出 SOC 2 Type I 和 Type II、ISO/IEC 27001、ISO/IEC 42001:2023 认证；最后一项是 AI
              管理系统的首个国际标准，覆盖模型训练与编排管线、数据集成血缘和内部 AI 治理结构。信任中心还列出符合 CCPA、VPAT 无障碍报告和欧盟 AI 法案合规文件，并点名 Jefferies、Rothschild
              & Co、Nomura、Moelis、Lazard 等参考机构已审查 Rogo 的安全姿态。自 2026 年 8 月 2 日起，欧盟 AI 法案对高风险 AI
              系统的义务将在全欧盟全面执行，要求形成文件化风险管理、技术文档、人工监督和上市后监测。Rogo 自身认证和信任中心披露意在帮助跨过这道合规门槛，但本章未找到监管机构确认其状态的证据。


              独立技术报道还描述了第二个内部智能体 Sisyphus：它每天约一到两次针对 Rogo 自身基础设施跑自动化攻击性安全演练，把认证滥用、授权绕过、注入、SSRF 和 LLM
              特有利用类别的发现串起来；同一来源称，它在第三方渗透测试后一周内又发现 18 个可利用漏洞，高置信度发现被校准到超过 95% 的真阳性率。Rogo 公开状态页另报 2026 年 4 月至 6 月窗口 API
              正常运行时间 100%，应用正常运行时间 99.97%，一次局部故障约 18 分钟内解决。合在一起，安全与合规构成销售助推层；Rogo 的买家属于企业软件里最厌恶风险的一群客户。
