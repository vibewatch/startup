  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Felix 与核心产品入口
        blocks:
          - type: paragraph
            body: >-
              Rogo 的产品已从研究助手演进为 Felix：一个 AI 智能体，可把单条提示词转成可直接交付客户的 PowerPoint 演示文稿、Excel 模型、Word 文档、看板和带来源的研究。Felix
              可通过邮件、聊天和原生 Excel 插件调用，也可承接异步、定时任务——例如监控一家公司，并在每次发布财报后重跑报告。具体金融工作流包括交易筛选、CIM
              生成、买方触达、数据室尽调，以及可比公司分析、模型、推介书和投委会备忘录。


              Rogo 2026 年 5 月发布把平台整合成更宽的产品界面：Rogo Agents 让机构把专有模板、方法论和重复工作流编码成可复用的自定义自动化；Custom MCP 让机构把自有或第三方 Model
              Context Protocol 服务器接入为额外工具；Slides Annotator 将演示文稿标注直接映射为可追踪、带版本的 Felix 修订；Memory 在多轮聊天中保留用户惯例和偏好；Library
              集中管理 Felix 产出的所有工件。合在一起，这些功能把 Rogo 从单一用途研究聊天机器人，推向机构可按自身固定流程配置的工作流平台。
