      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              已审阅供应商里，没有一家在企业金融买方看重的所有采购标准上都领先。智能体式交易工作流生成——CIM、可比公司分析、备忘录——Rogo 和 FactSet AI for Banking
              走得最远；大批量文档智能上，Hebbia 和 Glean 的权限感知企业图谱领先；原生 Excel 计算上，F2 的已跑基准引擎和 Microsoft Copilot in Excel
              是唯二有可验证主张的供应商；任何已审阅来源都没有给出 Rogo 自己来自 Subset/Offset 的 Excel 自动化基准测试。定价透明度同样分化很大：AlphaSense 发布五档结构，从每用户每年
              $10,000-$15,000 到 Enterprise Intelligence 团队许可的 $50,000-$100,000+ 不等，Marvin Labs 披露 $89/月档位，Daloopa
              提供免费入门层；而 Hebbia、Glean 和 Rogo 自己都没有公开按席位定价，让买方在最可能争夺大型企业合同的平台上只能盲谈。GTM
              和分发方面，传统厂商的优势是结构性的，而非产品驱动的：FactSet、Bloomberg、S&P Global 和 LSEG 已经在几乎每一个目标账户的续约谈判里，Microsoft 的 15 million
              个付费 Copilot 席位和 160% 同比增长也意味着，银行家评估 Rogo 之前，横向替代方案往往已经拿到许可。信任和监管姿态则有利有弊：Rogo 已披露的 EU AI Act 合规（第一章已说明）相对
              Microsoft Copilot 这类供应商是真差异化，后者在 2026 年初确认发生过数据丢失防护绕过；但 Bloomberg、FactSet 和 S&P Global
              等传统厂商带着数十年的既有合规基础设施，新进入者无法很快复制。
