  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 产品与输出风险——幻觉、引用粒度与规模化
        blocks:
          - type: paragraph
            body: >
              Rogo 的核心暴露点不是头条准确率，而是推导质量。BigFinanceBench 是一个 928 项、由专家编写的基准，2026 年 6 月由 Rogo 自有框架团队共同发布在 arXiv；它用 36,241
              个评分点检查金融推导的每一步——来源选择、期间和会计定义选择、假设、计算——而不只看最终数字，并发现十个当前前沿和开放权重智能体中，表现最佳的系统也只拿到可用评分点的
              58.8%；最终答案准确率只是推导质量的「有损代理指标」[CR001]。落到 Rogo 自己的 Felix
              智能体上，这意味着一个可直接交付客户的可比公司集、模型或备忘录，可能看起来完整、引用充分，却仍埋着错误期间、误用的会计定义或未说明假设；审阅人员必须抓住这些问题，而这种工作流错误风险会随 Felix
              为每名分析师生成的演示文稿、模型和备忘录数量一起放大 [CR002]。

              引用粒度会进一步放大这一问题：Rogo 推销审计轨迹和带来源研究，但引用粒度（页级、段落级、数据集级）决定了银行家能否在数字进入实时交易文件前真正核验；公开资料中没有独立且 Rogo 专属的引用到来源精度基准
              [CR003]。品类层面的先例很明确：FINRA 的 2026 Annual Regulatory Oversight Report 将「幻觉」——AI 生成的不准确或误导性信息——列为会员机构的首要 GenAI
              风险，并警告说，把 GenAI 作为监督系统一部分的机构，必须权衡「AI
              模型的完整性、可靠性和准确性」[CR004]。报道同一报告的行业媒体也把监管者立场概括为：日常运营中「敦促机构警惕幻觉风险」[CR005]。

              文档级和组合级规模处理是第二个相关暴露点。Felix
              的定位是同时摄入数据室、多年申报文件和机构私有资料库；独立技术报道把产品描述为一套跨多个前沿模型路由的编排框架，而不是单个微调模型。该设计用一致性换灵活性，也把可靠性工程推到 Rogo
              自己的评估框架上，而不是供应商认证基准上 [CR006]。金融之外，最刺眼的警示先例是 Deloitte Australia's AU$440,000 政府报告：2025
              年末，外部学者发现其中有捏造参考文献，以及一段由未披露 GPT-4o 工作流生成、交付前未被发现的 Federal Court 判决虚构引文，Deloitte 因此不得不部分退款 [CR007]。该事件不涉及
              Rogo，但它是最清晰的公开证据：一家有声誉的专业服务公司，自己的内部审阅流程没能抓住付费客户交付物中的 AI 捏造内容。这正是 Rogo
              的前线部署模型试图用人类银行家在环来防止的失败模式，也正是尽调应直接测试、而不是从营销中推断的失败模式 [CR008]。另一个领域也在重复同一模式：2026 年法院针对 AI 幻觉法律引用的制裁潮中，仅 2026
              年第一季度，美国因捏造判例法相关罚款就至少 $145,000；这是另一个高风险、依赖引用的专业领域 [CR009]。
            claimRefs:
