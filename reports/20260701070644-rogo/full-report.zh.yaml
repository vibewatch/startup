  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局图：直接同业、传统厂商、相邻玩家与现状替代
        blocks:
          - type: paragraph
            body: >-
              Rogo 的竞争集合，比简单列出「还有谁把 AI 卖给银行家」要宽。Hebbia、F2、Marvin Labs 等直接 AI 原生同业，争夺同一笔企业交易团队预算，但产品押注有重叠也有差异：Hebbia
              押注大批量文档智能，F2 押注面向承销的原生 Excel 计算，Marvin Labs 则押注更轻量的股票研究自动化。第二层是 Bloomberg、FactSet、S&P Capital IQ/Kensho 和
              LSEG；AI 原生新进入者融资时，它们并没有停在原地，而是各自把原生生成式 AI 研究智能体（ASKB、FactSet AI for Banking、ChatIQ、Deep
              Research）直接塞进银行已经许可的终端或数据平台，把过去单纯的数据订阅变成打包 AI 竞争对手。第三层是横向 AI 助手，包括 Microsoft 365 Copilot 和
              Glean，缺少金融专用微调，但会争夺同一条企业 AI 预算线，而且两者已经在大多数银行现有软件版图内。Intapp DealCloud 占据相邻且大体互补的赛道：Celeste AI
              面向交易发起和关系情报，而不是研究与分析生成，所以更常与研究工具搭配，而不是替代研究工具。Harvey 是一个相邻的法律 AI
              平台，正在扩展到资产管理和基金设立工作流；它更可能是未来进入者而非当前竞争对手，但其智能体基础设施和资本底座值得跟踪。最后，无论供应商竞争如何，两类现状替代仍然存在：大型银行（JPMorgan、Goldman
              Sachs、Morgan Stanley）自建内部 GenAI 工具，以及 SP2 Analytics 等公司把人工分析师外包明确营销为 AI
              研究平台的低幻觉风险替代品。这张竞争格局图（TP001）有意定义为一个有证据支撑的代表性样本，而不是该品类每一个点解决方案的完整索引。
