      - number: '5.6'
        title: 技术优势、限制与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Rogo 最清晰的技术优势不在某个模型，而在架构：一套跨前沿供应商、模型无关的编排框架；一组很深且持续扩展的授权金融数据连接器；基于嵌入式前线部署银行家的 GTM
              模型，把机构特定工作流需求翻译成产品配置；以及一套安全 / 合规计划（SOC 2、ISO 27001、ISO 42001、Sisyphus
              连续测试）。考虑到公司仍主要卖给金融服务中最保守的客群，这套计划成熟度并不常见。既然 Rogo 宣称的护城河是编排框架，而不是任何单一模型，前沿模型升级原则上就是配置变更，不是重写。


              限制也正集中在尽调最该加权的地方。BigFinanceBench 自己发布的结果显示，最佳前沿智能体在嵌入工作流的推导任务上只拿到 58.8%
              的评分点；这直接说明，引文级和步骤级准确率远落后于精美、格式漂亮的最终输出。即便还没考虑极大或混乱真实文档集上的规模问题，这个差距已经存在。另一篇独立 LLMOps 评审指出，Rogo
              自己的头部使用和增长指标都是自报且未验证，并注明微调方法和模型更新处理未披露。一篇独立产品评审还补充说，上线导入（数据源集成、权限映射、模板配置）往往并不简单，定价也面向大型企业客户，而不是小机构。这些限制并非
              Rogo 在垂直金融 AI 智能体中独有，但它们会收窄本章证据当前能弥合的营销话术与独立验证表现之间的差距。
            claimRefs:
              - CE045
              - CE049
              - CE047
              - CE028
              - CE023
