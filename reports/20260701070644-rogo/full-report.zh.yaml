      - number: '3.2'
        title: 竞品画像：规模、产品范围与战略方向
        blocks:
          - type: paragraph
            body: >-
              在直接 AI 原生同业里，Hebbia 资本最充足：两轮累计融资 $160 million（包括 2024 年 a16z 领投的 $130 million B 轮），截至 2026 年 5 月估值约 $700
              million。它的 Matrix 产品优化的是大型、混乱数据室里的单元格级、多文档尽调，而不是标准化交易工作流生成。F2 切的范围更窄——私人市场承销——但它用公开且独立验证的基准分数支撑原生 Excel
              计算主张（SpreadsheetBench Verified 得分 95.25%），Rogo 和 Hebbia 都没有披露自己的对应结果。传统厂商打包层则从相反方向往同一终点移动：FactSet 首席 AI
              官把公司战略定义为基于 Anthropic、Google 和 OpenAI 模型，为 9,000+ 客户构建「开放、灵活且安全的解决方案」；S&P Global 的 ChatIQ
              明确「为支持银行和买方分析师需求而定制」；Bloomberg 的 ASKB 依托 363 billion token、很大程度上自有的训练语料，比多数 AI 原生金融初创公司早了多年。LSEG
              的角色尤其双重：它既是授权数据伙伴，把公司基本面、估算和超过 1.5 million 笔交易的 M&A 数据库送入 Rogo 自己的平台；也是在 Workspace 内出售自有竞争产品 Deep Research
              智能体的卖方。Harvey 的战略方向，是未来 12-24 个月最值得观察的一条线：它以 $11 billion 估值融资 $200 million，资金用于把「长周期智能体」扩展到基金设立，并且已经拥有超过
              50 家资产管理公司客户——这是贴近 Rogo 核心投行业务流程的滩头阵地，尽管尚未真正进入核心区。
