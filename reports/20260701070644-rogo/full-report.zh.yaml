          - type: callout
            title: 监管边界按时钟收紧，时点落在本轮尽调窗口内
            body: >-
              EU AI Act 的高风险和 GPAI 执法权将在 2026 年 8 月 2 日启动，距本轮日期约一个月；与此同时，美国银行模型风险指引刚刚放松，并在未来规则制定前明确排除 GenAI——这种错配让 Rogo
              的银行客户在欧盟义务收紧的同一时点，仍没有稳定的监管答案。
            calloutType: risk
            claimRefs:
              - CR015
              - CR017
          - type: callout
            title: 估值已经跑在披露前面
            body: Rogo 估值在三个月内（2026 年 1–4 月）从约 $750M 几乎翻至约 $2B，却没有公开 ARR、利润率或留存数据锚定倍数；同一时期，多名科技投资者和分析师正公开讨论 AI 行业估值修正。
            calloutType: risk
            claimRefs:
              - CR038
              - CR039
              - CR040
          - type: callout
            title: 自报合规和安全主张在审阅来源中没有独立审计
            body: >-
              Rogo Trust Center 列出 SOC 2、ISO 27001、ISO 42001 和 EU AI Act
              合规文档，并称参考机构已审阅其安全态势；但本章来源集中没有发现独立审计确认、证书注册条目或监管机构声明来佐证这些主张。
            calloutType: assumption
            claimRefs:
              - CR016
              - CR031
          - type: callout
            title: 把前置部署招聘速度当作领先指标
            body: >-
              Rogo 的增长模式依赖扩张一个劳动力类别（前置部署投行人员 / 工程师），而全行业对这一类别的需求增速远快于供给；因此，追踪 Rogo
              自身前置部署人员数量和招聘周期，比只看客户标识数量更能及时反映近期增长产能。
            calloutType: recommendation
            claimRefs:
              - CR044
              - CR045
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格与内在价值：如何看待 $2B Series D
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月 29 日，Rogo 完成由 Kleiner Perkins 领投的 $160 million Series D，公司估值约 $2 billion——较 2026 年 1 月 Series C
              的 $750 million 标记在短短三个月内接近翻三倍。Kleiner Perkins 合伙人 Mamoon Hamid 将这笔投资定义为一次押注：Rogo
              正在成为「整个行业的操作系统」；Sequoia、Thrive Capital、Khosla Ventures 和 J.P. Morgan Growth Equity Partners
              也都随新领投方继续投资。这些事实说明，在那一天，一个由知情、重复投资者组成的特定财团愿意以 $2 billion 价格购买 Rogo 股权。它们本身并不能证明 $2 billion
              是外部可验证的内在价值。本次尽调审阅的任何来源都没有披露 Rogo 自身当年收入运行率、毛利率、净收入留存或现金续航期，也没有二级市场交易或独立公允性意见检验 Series D 价格。因此，本章把 $2
              billion 视为一级市场融资出清价——真实存在，但由财团定价、未经市场检验——并刻意避免为 Rogo 自身构建 DCF 或 ARR 倍数估值。相反，本章把该价格放到可比私募融资、公开市场倍数和 2026
              年融资背景中评估，并明确说明证据在哪里用尽。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV032
              - CV036
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV032
              - CV044
      - number: '8.2'
        title: 私募与公开可比基准
        blocks:
          - type: paragraph
            body: >-
              三家已披露收入的 AI-native 同行，最接近反映品类领先的金融与知识工作 AI 公司能拿到什么倍数。Hebbia 2024 年中 Series B 估值约 $700 million，对应约 $13
              million 盈利 ARR，约 54x；TechCrunch 报道 The Information 估计，Glean 和 Harvey 同期交易倍数略高于 60x ARR。此后，Glean 截至 2026 年
              5 月已扩张至 $300 million 年化收入，同时仍保持 $7.2 billion Series F 估值，隐含倍数约 24x，较 Glean 处于 $100 million ARR 时约 72x
              已经压缩。AlphaSense 2026 年 6 月融资按约 $600 million ARR 估值 $7.5 billion，约 12.5x——一位分析师称，即便 AlphaSense
              没有公开流动性，这一倍数也与公开 AI 软件 8–15x 未来 ARR 交易区间一致。Rogo 最接近的上市可比公司讲的是完全不同的故事：FactSet 约按 4.0x 过去收入交易，Intapp 约
              3.1x，二者都远低于任何私募 AI-native 定价。这个落差是本章无法用公开证据解决的核心估值张力：Rogo 的 $2 billion 价格隐含假设它应享有私募 AI-native
              倍数，而不是公开工作流软件倍数；但没有披露的 Rogo 收入数据能确认到底适用哪套估值体系。
            claimRefs:
