            body: 已审阅的每一种测算视角，要么覆盖全部金融服务（过宽），要么覆盖所有银行和金融并混入非 AI 原生品类（仍然过宽）。本章有意不把任意渗透率套到不匹配的 TAM 上来制造 SAM。
