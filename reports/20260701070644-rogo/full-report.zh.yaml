      - number: '3.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: LSEG 既是 Rogo 的数据伙伴，也是直接竞争对手
            body: >-
              LSEG 的 Deep Research 智能体原生嵌入 Workspace 和 Microsoft Teams，争夺的正是 Rogo 所执行的自然语言研究任务——而且很大一部分底层内容与 Rogo
              通过自身战略合作授权的 LSEG 内容相同。这种竞合结构并不构成否决项（数据供应商经常同时向同一批客户销售并与其竞争），但它意味着 Rogo 持续获得数据访问，依赖的是与一家有自身激励把研究工作流留在
              Workspace 内的公司的商业关系。尽调应确认保障数据连续性的合同保护，以及任何非竞争或最惠客户条款。
            calloutType: risk
            claimRefs:
              - CP018
              - CP019
          - type: callout
            title: 现有 AI 模型没有一个不经人工复核就能交付客户
            body: >-
              BankerToolBench 是一项独立基准，由 Goldman Sachs、JPMorgan、Morgan Stanley 和 Evercore 的 502 名现任及前任投行人员构建。它发现，9 个被测试
              AI 模型没有一个能不经修改就产出客户就绪内容，最佳模型仍有 27% 输出完全不可用。这是整个品类的可靠性发现，不是针对 Rogo 的具体主张；但它意味着，任何卖给投行的 AI 研究平台——包括
              Rogo——都在对抗一个有文档记录、独立测量的信任缺口，而人机协同复核和来源引用锚定只能部分弥合它。
            calloutType: risk
            claimRefs:
              - CP038
              - CP039
              - CP043
          - type: callout
            title: 工作流集成是 Rogo 最可防守的护城河层
            body: >-
              Rogo 最深的差异化不在模型层，Bloomberg、FactSet 和资金充足的前沿模型供应商都有可能追上；差异化在工作流集成层：接入银行自己的 SharePoint、CRM 和数据室，并叠加横跨
              LSEG、PitchBook、S&P Global、FactSet 的授权数据合作。这种组合正是横向智能助手（如 Microsoft 365 Copilot 和
              Glean）尚未用金融专用深度复制的逐银行集成工作，也解释了为什么在定位图（FP001）中，Rogo、Hebbia 和 FactSet AI for Banking 聚在一起，成为最贴近银行用途的选项。
