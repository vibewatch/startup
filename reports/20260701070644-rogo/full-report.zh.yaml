      - number: '4.2'
        title: GTM 规模、招聘与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Rogo 最具体的 GTM 代理指标不是收入，而是披露的用户数和机构数：2026 年 4 月官方 Series D 公告称，平台服务 250+ 家机构的 35,000+ 名金融专业人士，包括 Rothschild
              & Co、Jefferies、Lazard、Moelis 和 Nomura。三个月前的 2026 年 1 月 Series C，独立报道给出的同类数字约为 50+ 家一线机构的 25,000
              名专业人士——说明具名用户数明显增长，接触过平台的机构数跳升更大；不过机构口径很可能比付费企业席位更宽。供给侧，Rogo 正在激进扩招：Growjo 估算（低置信度、算法生成）员工接近 292 人，同比增长
              143%；截至本章访问日，Rogo 实时招聘页列出 56 个开放岗位，覆盖纽约、伦敦、新加坡的工程、销售、产品、安全和客户成功。纽约州 Empire State Development 机构另行确认，将向
              Rogo 提供最高 $6.5 million、与绩效挂钩的 Excelsior Jobs Program 税收抵免，条件是新增 422 个全职岗位并向曼哈顿总部投入近 $14
              million——这是一项公开承诺，只有 Rogo 达到招聘和投资里程碑才会兑现。作为销售效率代理指标，Rogo 自称每用户每周节省 10+ 小时，高于一项跨供应商 2026 年 AI 智能体生产力基准的 6.4
              小时中位数；该基准汇总 McKinsey、Gartner、Forrester、Bain、Deloitte、BCG 和 MIT Sloan 研究，还发现只有 41% 的 AI 智能体部署在第一年达到 ROI
              目标，平均回本期 6.7 个月。这些外部标尺可用来检验 Rogo 的自报数字，而不是照单全收。
