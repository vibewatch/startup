      - number: '1.5'
        title: 里程碑、监管姿态与负面信号
        blocks:
          - type: paragraph
            body: >-
              Rogo 自 2022 年成立后的里程碑显示，公司大约每隔几个月就在融资轮次、产品和合作发布之间交替推进。2024 年 2 月种子轮和 2024 年 10 月 A 轮之后，Rogo 在 2025 年收购
              Subset，以补入电子表格智能体的 Excel 建模技术，随后在 2025 年 4 月完成 $50 million B 轮。2026 年节奏进一步加快：1 月完成 $75 million C 轮并开设新的
              London 办公室，3 月收购由 Raj Khare 和 Shiv Shrivastava 创立的 AI 智能体初创公司 Offset，同月稍晚宣布 EU AI Act 合规工作，赶在该法案 2026 年 8
              月可执行期限之前，4 月则完成 $160 million D 轮并公开推出 Felix。此后 Rogo 继续叠加数据和分发合作——Daloopa（5 月）、深化 PitchBook 集成（5 月）、SS&C
              Intralinks（6 月），并成为 Microsoft Copilot in Excel 的首发合作伙伴（6 月）——把触达延伸到相邻的金融数据和生产力生态。


              监管与信任层面，Rogo 表示不会用客户数据训练或更新模型，并维护 SOC 2、ISO 27001、ISO 42001 和与 GDPR 对齐的文档，2026 年 3 月的 EU AI Act
              合规工作又进一步正式化这些承诺。对一家卖给全球监管最重机构之一的公司来说，这些承诺有意义，也可以验证。


              公开记录中最清晰的负面信号不是诉讼或监管行动，而是 D 轮报道本身突出带出的结构性质疑。Bloomberg 报道称，一些 AI 行业观察者认为 Rogo
              是不必要的中间层，因为金融专业人士原则上可以直接查询大型通用 AI 模型；这是一个关于竞争护城河的问题，也被 SixThirty Ventures 的分析师评论独立呼应，后者同样质疑 AI
              分析师估值整体是否反映了离群级收入倍数。另一个来源是竞争对手自己的 2026 年竞品指南（该来源显然有竞争动机，但提出了具体、可核查的主张），它指出了具体技术限制：Rogo
              难以把分析扩展到数千份文档，引用粒度停留在回答级而非句子级，团队协作工具也有限。最后，Bloomberg 描述了初级银行家的真实焦虑：Rogo 式自动化可能减少入门级招聘。Rogo
              创始人的回应是，技术会让银行增加更多资深交易人员，而不是减少初级人员；但这项主张仍未用银行实际招聘数据验证。
