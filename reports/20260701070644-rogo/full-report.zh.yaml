      - number: '3.4'
        title: 切换成本、锁定、多栖使用与分发权力
        blocks:
          - type: paragraph
            body: >-
              这个市场里的分发权力，往往在正式供应商评估开始前就已经决定。最清楚的证据是一个反例：Ensis Partners 是一家 2026 年 2
              月成立、聚焦重组的投行，当它需要交易和关系管理基础设施时，创始人没有评估其他竞品平台，直接选择了 Intapp DealCloud，因为两人此前在 PJT Partners、Perella
              Weinberg、Blackstone 和 Citigroup 都亲自部署过 DealCloud。这个模式——银行家校友网络默认选择自己已经熟悉的平台——有利于在实际采购人群中现有足迹最广的供应商，而这是
              Rogo 作为新进入者无法完全复制的分发优势。多栖使用是这个品类的常态，而不是例外：第三方比较指南明确建议评估 Rogo 或 Hebbia 的买方，同时并行运行 AlphaSense 或 FactSet
              等特定来源平台，因为没有单一工具同时覆盖交易工作流生成和深度市场数据广度。LSEG 既是 Rogo 的数据授权伙伴，又出售自己的 Deep Research 智能体，这种竞合角色带来特定锁定风险：如果 LSEG
              优先支持自己的原生 Workspace 智能体，Rogo 持续数据访问的条款就会变成一个重大合同风险问题，本章无法仅凭公开来源解决。与此同时，已经投资自有内部 GenAI（JPMorgan 的 LLM
              Suite、Goldman 的 GS AI Assistant）的大型银行，也在相反方向面临自己的切换阻力：既然已经围绕自研工具搭建内部基础设施和治理，它们就没有那么强的理由再为 Rogo
              所瞄准的同一批工作流增加一个完全外部供应商，至少对有内部工程资源建设和维护的大型投行账户来说如此。
            claimRefs:
              - CP004
