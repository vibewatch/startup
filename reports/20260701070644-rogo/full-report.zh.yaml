        - 中等影响
        - 高影响
        - 极高影响
      rows:
        - label: 高可能性
          values:
            - label: FDE / 前线部署招聘瓶颈
              tone: warning
            - label: FINRA GenAI 监督 / 记录保存负担
              tone: warning
            - label: Microsoft Copilot 捆绑销售侵蚀可商品化工作流
              tone: negative
            - label: '--'
              tone: positive
        - label: 中等可能性
          values:
            - label: Reg S-P 供应商监督审计负担
              tone: neutral
