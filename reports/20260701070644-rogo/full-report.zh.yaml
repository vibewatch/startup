      - number: '4.3'
        title: 成本结构与利润率驱动因素
        blocks:
          - type: paragraph
            body: >-
              已审阅资料没有披露 Rogo 的毛利率、COGS 构成或模型推理开支，本章只能借可比公司和行业基准框出可能区间。一篇独立 LLMOps 技术评审称，Rogo 分层使用 OpenAI 模型：GPT-4o
              处理面向用户的问答，o1-mini 处理数据语境化，更昂贵的 o1 留给高风险评估和推理。这是一套有意的成本优化模式，把最贵模型层限制在最需要它的工作负载上。该模式与 2026 年 GPU FinOps
              基准一致：推理如今占企业 AI GPU 支出的 55-80%，每百万 token 成本从 A100 GPU 上约 $1.67 到 H200 GPU 上 $4.54+ 不等；单个
              70-billion-parameter 模型服务真实企业流量，光算力一年就可能约 $347,000。更广泛的 AI 优先型 B2B SaaS 经济性分析估算，AI 原生软件毛利率为 55-70%，传统 SaaS
              为 78-85%；差异来自可变推理 COGS，占收入 20-40%，而经典 SaaS 低于 5%。这与 Rogo 竞争的传统金融数据巨头不是同一种经济模型。FactSet Research Systems 于
              2025 年 10 月向 SEC 提交 2025 财年 10-K（截至 2025 年 8 月 31 日），以及基于同一文件汇总的第三方数据，显示 FactSet 在 $2.32 billion
              收入上的过去十二个月毛利率约 52.7%——这是 AI 推理成本结构出现前的传统基础设施基准，不应读成 Rogo 专属数字。Rogo 自己的服务交付模型又放大了成本问题：一页竞品对比称 Rogo
              提供「白手套、银行家主导实施」，暗示每个企业账户的服务交付成本显著高于自助式产品，但没有资料量化这项成本。
