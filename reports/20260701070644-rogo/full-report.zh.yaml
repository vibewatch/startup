      - number: '7.2'
        title: 监管与合规风险——SEC、FINRA、欧盟 AI 法案与诉讼姿态
        blocks:
          - type: paragraph
            body: >
              美国证券监管机构已经从讨论 AI 风险转向直接执法。自 2024 年 3 月以来，SEC 已因夸大或误导性的「AI washing」表述，对投资顾问、上市发行人以及至少一名创业公司创始人采取执法行动；现在，SEC
              要求公司像论证业绩或《投资顾问法》营销规则下的风险因素披露一样，严谨支撑 AI 相关表述 [CR010]。2025 年 12 月，SEC 投资者咨询委员会投票建议要求发行人定义「人工智能」、披露董事会对 AI
              部署的监督，并单独报告内部和面向消费者的 AI 影响——如果这套草案标准落地，Rogo 的银行和资产管理客户（若 Rogo 接近公开上市，也可能包括 Rogo 自身）描述 AI 驱动结果的门槛都会被抬高
              [CR011]。修订后的 Regulation S-P 也要求券商记录对第三方 AI 供应商的监督，包括供应商 72 小时内通报数据泄露、30 天内通知客户；无论底层责任在哪里，AI 供应商风险管理（包括
              Rogo）都会被直接纳入券商合规流程 [CR012]。

              FINRA 2026 年监管报告重申，其规则「技术中立」：监督（Rule 3110）、通信、记录留存和公平交易义务适用于 GenAI 辅助输出，强度与人工输出相同；公司必须归档提示词、输出和模型使用日志以备审计
              [CR013]。对 Rogo 的银行客户来说，Felix 生成的研究和模型本身也要接受监督审查和记录留存，这一运营负担可能拖慢采用，或要求 Rogo 额外提供审计工具 [CR014]。欧盟侧，AI Act 的
              GPAI Code of Practice 已于 2025 年 8 月 2 日生效，执法权（信息请求、模型访问、召回）从 2026 年 8 月 2 日开始；用于信贷、AML 等金融工作流的 AI
              高风险系统完整义务也从 2026 年 8 月 2 日起可执行——这是一条硬合规期限，正落在本轮尽调窗口内 [CR015]。Rogo 自身 Trust Center 将「EU AI
              Act」列入合规文档，但该页面由公司自行发布，本章审阅的任何来源都没有具名审计机构独立验证 [CR016]。

              联邦银行监管机构在模型风险上走向相反方向：OCC、Federal Reserve 和 FDIC 2026 年 4 月的跨机构指引废止了 2011 年 SR 11-7
              时代框架，改用更轻的原则导向方法，并明确把生成式和 agentic AI 模型排除在范围外，等待未来另行指引——这让 Rogo 的银行客户今天还没有稳定的监管答案，无法判断该如何验证供应商提供的 agentic
              研究工具 [CR017]。保密性是另一类独立风险：投行业务经常涉及重大非公开信息（MNPI），如果训练、留存或跨客户数据流不够严密，把交易数据输入第三方 AI
              供应商会带来合同风险，也会贴近内幕交易风险——监管机构目前通过 Reg S-P 供应商监督规则处理这类风险，而不是 AI 专门规则，这意味着举证责任落在 Rogo 的数据处理架构上，而不是某一条具名法规上
              [CR018]。Rogo 也贴近「研究工具」与「投资建议」的边界：一个为真实交易生成可比公司、模型和建议的工具，如果公司合规程序没有清楚记录客户建议的依据是人工判断而非 Felix
              输出，就可能触发顾问受托责任和适当性义务 [CR019]。

              本章审阅的来源没有发现点名 Rogo 的未决诉讼、SEC 或 FINRA 执法行动，或已确认数据泄露 [CR020]。这种沉默应当谨慎解读，不能当作干净证明：AI 相关证券集体诉讼从 2023 年到 2024
              年同比增长约 100%，并在 2025 年至 2026 年继续增加；法律行业追踪机构预计，到 2026 年，「事件驱动型」AI 诉讼仍会是私人证券诉讼中的主导类别，背后既有已建立 AI
              专门能力的原告律师团队，也有 SEC Cybersecurity and Emerging Technologies Unit 施加的并行压力——这是一条快速扩张的案卷通道，像 Rogo
              这样高速增长、能见度很高的 AI 供应商，只需一次有争议的声明或事件就可能被卷入 [CR021]。
