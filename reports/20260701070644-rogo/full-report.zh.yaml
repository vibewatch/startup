      - number: '7.4'
        title: 客户、采购与参考偏差风险
        blocks:
          - type: paragraph
            body: >
              Rogo 的参考客户也是它的集中风险。公开点名的生产环境用户——Baird Equity Research、Jefferies、Rothschild & Co、Nomura、Moelis，以及 Rogo 自身
              Trust Center 列出的 Lazard
              等参考机构——正是成长阶段供应商需要的旗舰客户标识；但一个卖给不足数百家大型金融机构的平台，结构上会暴露于任何单一头部账户流失、不续约或公开不满的风险。本章审阅的独立来源没有披露 Rogo
              的单客户收入集中度、净收入留存或合同期限 [CR031]。投行和资管的企业 AI 采购也是长周期、多利益相关方流程——把法律、合规、风险和 IT 安全签核算进去，从首次接触到签约通常需要 9–24
              个月——这会放慢 Rogo 把管线转为收入增长的速度，使其难以匹配估值轨迹暗示的节奏，也给 Bloomberg、FactSet、Microsoft 等在位厂商更多时间在竞争评估结束前补齐功能差距 [CR032]。

              参考偏差是另一类更难识别的风险：Rogo 公开可见的赞誉几乎全部来自公司自己的客户页面、赞助合作公告和融资新闻；独立、非邀约评价只有很薄、低频的一层（PeerSpot 的 Rogo
              条目读起来更像供应商式描述文案，而不是具名用户投诉；本轮未能独立验证 Rogo 的 Trustpilot 档案）[CR033]。找到的最清晰非邀约、从业者层讨论来自 Wall Street Oasis
              一个帖子：一家中型银行产品团队向同行询问对 Rogo、Hebbia 和 ModelML
              的真实看法，并把自己的评估标准明确表述为「准确性、自动化工作流、工具不能只是噱头」——这种措辞默认对供应商营销主张保持怀疑，也说明即便是 Rogo 自己的目标买家，也不会把「AI 准确性」主张视为不证自明
              [CR034]。竞争者发布的比较内容（Hebbia、o11、F2）对功能定位有方向性参考价值，但不是独立证据；任何准确性或可靠性主张都应相应打折 [CR035]。

              采购和集中风险也穿过 Rogo 自己的供应商栈：任何大型银行客户若执行 FINRA 和修订后 Regulation S-P 现在要求券商开展的同类第三方 AI 供应商监督尽调，都需要 Rogo
              按需提供审计日志、模型变更文档和事件响应证据。即便没有事件发生，这也是 Rogo 在 250+ 家机构关系中持续承担、且不断增长的合规成本 [CR036]。净效果是，Rogo
              当前增长叙事更多建立在采用广度（35,000+ 用户、250+ 机构）上，而不是披露深度（留存、扩张或按席位经济性）上；本报告客户章节也标出这个缺口，它直接影响尽调流程应给客户标识驱动的增长主张多大权重
              [CR037]。
