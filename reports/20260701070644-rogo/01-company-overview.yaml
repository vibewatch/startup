  - CO039
  - CO041
  - CO047
- calloutType: risk
  title: Investor-customer overlap and competitor-flagged product limits merit scrutiny
  body: J.P. Morgan Growth Equity Partners is simultaneously a Rogo investor and, through its parent bank, a cited customer, while a rival vendor's competitor guide flags real technical limits (document-scale handling, citation granularity, collaboration features) that Rogo's own materials do not address.
  claimRefs:
  - CO040
  - CO046
