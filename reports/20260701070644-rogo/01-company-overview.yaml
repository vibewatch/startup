- id: customers-scale-traction
  title: Customers, Scale, and Traction
  body: 'Rogo''s scale metrics show fast, broad-based enterprise adoption. As of the April 2026 Series D announcement, more than 35,000 financial professionals at over 250 institutions were using the platform daily, up from roughly 25,000 professionals cited in the January 2026 Series C announcement and 5,000 bankers cited in OpenAI''s 2024 partner case study -- a trajectory consistent with the 27x ARR growth OpenAI''s page attributes to the 2024-era product. Rogo''s homepage displays on-the-record endorsements from Truist Securities'' CEO, Nomura''s international head of investment banking, and Baird Global Investment Banking''s COO, and named institutional clients across multiple sources include Rothschild & Co, Jefferies, Lazard, Moelis, Nomura, J.P. Morgan, Bank of America, Wells Fargo, and Singapore''s GIC sovereign wealth fund.


    The single most concrete customer-level proof point is Rogo''s own published case study on Baird''s Equity Research division: more than 100 professionals actively use the platform, with about 85% weekly and 70% daily active usage -- an engagement level Rogo frames as evidence of genuine workflow dependency rather than novelty adoption. Forbes'' company profile adds a financial dimension to the scale picture, reporting revenue growth from approximately $2 million in 2024 to more than $15 million in 2025, alongside a headcount estimate of roughly 100 employees as of April 2026; Bloomberg separately reports Rogo''s leadership expects headcount to approach 300 by year-end 2026.


    Even so, the current-year financial picture remains materially incomplete: no fetched source discloses 2026 ARR, gross margin, net revenue retention, or profitability, leaving a real gap between the reported $2 billion valuation and the underwriting detail available to an outside diligence process. PeerSpot''s mid-2026 competitive mindshare data placing Rogo at 2.3% (versus FactSet''s 18.7%) is a useful, if partial, cross-check that Rogo''s scale claims sit within a market still dominated by legacy incumbents even as its share is growing quickly.'
