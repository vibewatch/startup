chapter:
  number: 1
  title: Company Overview
  summary: Rogo is a New York-based AI company, founded in 2022 (with a one-year founding-date discrepancy across sources), that builds an enterprise research and workflow-automation platform for investment banks, private equity firms, and asset managers, anchored by its Felix agent. The company has compounded from a $7M 2024 seed round to a $160M Series D at a reported $2B valuation in April 2026, with more than 35,000 users at 250+ institutions and concrete customer proof (Baird Equity Research), but current-year revenue, margin, and full governance disclosure remain materially incomplete, and independent commentary has flagged both valuation-premium and junior-banker-displacement risk.
sections:
- id: identity-product-stage
  title: Identity, Product, and Stage
  body: 'Rogo is a New York, NY-based AI company that builds an enterprise platform purpose-built for financial services, selling into investment banks, private equity firms, and asset managers rather than a horizontal knowledge-work audience. The company''s own materials, echoed by Forbes and multiple 2026 funding-round writeups, describe a platform that automates research, financial modeling, comparable-company analysis, and pitch-deck creation by combining fine-tuned financial-reasoning models with deep integrations into a client firm''s internal systems (SharePoint, CRM, data rooms) and licensed external data (FactSet, LSEG, S&P Global, PitchBook). As of the 2026-07-01 run date, Rogo is squarely a late-stage, venture-backed private company: it has raised through a Series D, reports a $2 billion valuation, and counts more than 35,000 professionals at 250+ institutions as users.


    The company''s founding date is one of the few genuinely contested facts in the record. Forbes'' 2026 company profile and a New York Weekly feature both date Rogo''s founding to 2022, but Rogo''s own October 2024 Series A press release and a 2026 competitor analysis from Hebbia both state Rogo was "founded in 2021." Bloomberg''s reporting on the Series D helps reconcile the discrepancy: it describes co-founder Gabriel Stengel quitting Lazard in "late 2021" to begin building the product with his co-founders around a Manhattan kitchen table, with formal company founding following in 2022. Later chapters should treat 2022 as the primary reference year while noting the one-year variance across sources.


    Rogo''s core product architecture centers on Felix, an autonomous AI agent launched alongside the April 2026 Series D that executes multi-step financial workflows -- deal screening, CIM generation, buyer outreach, and data-room diligence -- with minimal human intervention. Diligence materials referencing named product lines such as "Rogo Research," "Rogo Comps," "Rogo Models," or "Rogo Pitchbook" could not be corroborated against Rogo''s current site or any fetched 2026 coverage; the company''s actual public product structure is Felix plus a set of licensed-data connectors, and this gap is preserved as an open question rather than resolved by assumption.'
