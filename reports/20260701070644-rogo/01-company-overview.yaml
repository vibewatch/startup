  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Rogo has not publicly disclosed exact current ARR, gross margin, or profitability; only Forbes' 2024/2025 revenue snapshot and OpenAI's 2024 ARR-growth-multiple figure are public.
    whyItMatters: Underwriting a $2B valuation requires current revenue and margin detail, not a one-year-old growth multiple or a single third-party revenue estimate.
    diligencePath: Request current ARR, gross margin, net revenue retention, and cash runway directly from Rogo management or its investors.
    relatedQuestionRefs:
    - QO014
    - QO019
  - type: missing-source
    severity: minor
    topic: product
    missingEvidence: No fetched source (official or independent) confirms "Rogo Research," "Rogo Comps," "Rogo Models," or "Rogo Pitchbook" as current branded product names; Rogo's own site organizes the platform around Felix plus data-partner connectors.
    whyItMatters: If a diligence brief assumes named product lines that do not match current branding, later chapters could mischaracterize the product architecture.
    diligencePath: Ask Rogo directly for its current product/module naming taxonomy and marketing collateral.
    relatedQuestionRefs:
    - QO020
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table
    missingEvidence: Rogo has not published a full executive roster, board composition, or independent-director slate beyond the three founders and President Rahul Rekhi.
    whyItMatters: A founder- and president-centric public profile at a $2B valuation leaves key-person and governance risk unresolved for diligence.
    diligencePath: Request a full org chart, board roster, and governance charter in live diligence.
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map
    missingEvidence: Only investors named in funding-round press coverage are captured; full cap table ownership percentages, board seats, and pro-rata/secondary terms are not public.
    whyItMatters: Ownership concentration and investor control rights materially affect governance and future financing dynamics.
    diligencePath: Request the capitalization table and investor rights agreements in live diligence.
    relatedTableRefs:
    - TO003
