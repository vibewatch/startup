  - id: FE001
    title: Starburst product architecture map
    type: stack
    summary: >-
      The commercial product layers governed access, acceleration, and operations over Trino federation and the
      customer's existing data estate.
    data:
      layers:
        - label: User and application access
          modules:
            - name: BI and SQL clients
              detail: Applications submit ANSI SQL through supported interfaces and drivers.
            - name: Analysts and AI agents
              detail: Natural-language and AI workflow surfaces are described in the 2025 announcement.
        - label: Enterprise context and governance
          modules:
            - name: Data products and lineage
              detail: Governed definitions and lineage provide reusable data context.
            - name: Policy controls
              detail: RBAC, ABAC, masking, encryption, and audit capabilities are company-described.
        - label: Query and execution engine
          modules:
            - name: Coordinator
              detail: Parses, plans, optimizes, and schedules distributed SQL work.
            - name: Worker cluster
              detail: Retrieves and processes source data in parallel.
        - label: Acceleration and workload control
          modules:
            - name: Query acceleration
              detail: Warp Speed, caching, pushdown, and cost-based optimization are claimed.
            - name: Routing
              detail: Role-based and deployment-set routing direct work across compute clusters.
        - label: Federation and data management
          modules:
            - name: Connectors and catalogs
              detail: Source-specific connectors expose distributed systems through configured catalogs.
            - name: Iceberg and open formats
              detail: Table-format support connects lakehouse storage to the query layer.
        - label: Customer data estate
          modules:
            - name: Lakes, warehouses, streams, and databases
              detail: Data remains in existing systems rather than requiring universal centralization.
            - name: Cloud, hybrid, and on-premises environments
              detail: Deployment choice is part of the Enterprise positioning.
    approximationNotes: >-
      This is a logical product stack synthesized from assigned sources, not a network topology or representation of
      every deployable component.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: Customer journey from distributed-data pain to expansion
    type: journey-map
    summary: >-
      Starburst's observable customer path moves from fragmented data access to governed use, with proof strongest at
      deployment and weakest at renewal.
    data:
      nodes:
        - id: problem
          label: Distributed and regulated data
          detail: Multiple clouds, on-premises systems, and data-residency constraints create the initial buying problem.
          touchpoints:
            - Data platform assessment
            - Governance and sovereignty requirements
        - id: deploy
          label: Federated deployment
          detail: Enterprise or Galaxy connects to existing sources without requiring wholesale centralization.
          touchpoints:
            - Connector configuration
            - Enterprise or managed deployment
        - id: use
          label: Governed analytics and AI
          detail: Analysts, engineers, and AI teams query or productize data through a governed access layer.
          touchpoints:
            - SQL and BI access
            - Data products and governed AI
        - id: reference
          label: Reference and proof
          detail: Named or referenceable customer evidence can reduce procurement uncertainty.
          touchpoints:
            - Customer reference
            - Outcome validation
        - id: renew
          label: Renewal decision
          detail: Renewal and expansion depend on realized value, adoption breadth, and procurement friction.
          touchpoints:
            - Renewal review
            - Expansion or contraction
        - id: expand
          label: Expansion and renewal
          detail: >-
            Potential expansion into more sources, workloads, regions, and users is plausible but not publicly
            quantified.
          touchpoints:
            - Additional workloads
            - Renewal and expansion proof gap
    approximationNotes: >-
      The sequence is an analytical model of the customer journey, not a measured conversion funnel; stages have
      different evidence bases and no conversion rates are inferred.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU012
      - CU013
