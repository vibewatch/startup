  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic job
        blocks:
          - type: paragraph
            body: >-
              The relevant market is enterprise software and services that query, govern, optimize, or expose data
              across distributed databases, object stores, warehouses, and lakehouse tables without requiring wholesale
              centralization. The boundary includes Starburst Enterprise, Starburst Galaxy, connectors, governance,
              workload management, data products, and related implementation or managed-service spend. It excludes
              general storage capacity, standalone BI seats, generic ETL unrelated to federated access, and all of a
              cloud warehouse's consumption spend when that spend is not substituting for distributed access. Trino
              documentation describes the underlying category as a query engine rather than a database system, while
              independent comparison evidence frames Starburst as a lakehouse/federation platform rather than a
              conventional warehouse. This boundary matters because the buyer is paying to reduce data movement,
              integration friction, governance duplication, or migration risk, not simply to purchase more storage.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
      - number: '2.2'
        title: Sizing lenses and limits
        blocks:
          - type: paragraph
            body: >-
              The strongest quantified lens is the global data-virtualization market: Mordor Intelligence estimates USD
              6.25 billion in 2025, USD 7.46 billion in 2026, and USD 18.09 billion by 2031, implying a 19.38% 2026–2031
              CAGR. Its segmentation provides useful demand shape—cloud represented 69.85% of 2025 revenue, large
              enterprises 58.25%, and BFSI 31.12%—but these are slices of the same market, not additive TAM, SAM, or SOM
              layers. A second data-lakehouse report identifies the relevant deployment and buyer segments but does not
              expose a usable value in the fetched text. Thus the chapter uses multiple lenses while marking
              Starburst-specific SAM, SOM, share, and obtainable annual spend as unresolved. The sizing pyramid is a
              directional evidence map, not a mathematically comparable funnel.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
