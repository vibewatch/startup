      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction evidence is company-issued rather than audited financial disclosure.
              Starburst says FY25 net-new customers grew 20%, Galaxy customer growth rose 76% year over year, Galaxy
              adoption increased 94% year over year, and ARR per customer exceeded $325,000. It also says ten of the top
              fifteen global banks are customers and that Dell selected Starburst as the analytics query engine for Dell
              Data Lakehouse. These disclosures indicate enterprise distribution and a growing cloud motion, but they do
              not establish cohort retention, gross retention, net retention, CAC, payback, sales-cycle duration, or the
              share of bookings converted to recognized revenue. Independent review evidence is directionally positive
              but mixed on economics: G2 users cite integration and query performance, while also describing
              configuration complexity and pricing that can become harder to justify as usage scales. The appropriate
              underwriting conclusion is commercial traction with incomplete efficiency visibility, not a proven
              efficient-growth profile.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Starburst's cost structure is likely shaped by distributed-query compute, connector and support
              engineering, enterprise implementation, and cloud operations, but the assigned evidence does not provide
              gross margin, hosting cost, support cost, capex, working-capital needs, cash balance, debt, burn, or
              runway. The platform can reduce customer data movement and duplication, yet that customer benefit does not
              establish Starburst's own margin profile. G2 reviewers report that consumption-based pricing can make
              monthly expense hard to predict, while PeerSpot characterizes Enterprise deployment as requiring more
              technical knowledge than Databricks; both are buyer-side signals that workload and delivery economics
              require measurement rather than inference. The 2025 Citi strategic investment is described by
              SiliconANGLE, but its size, valuation, instrument, and use of proceeds are not disclosed in the retained
              sources. Accordingly, capital adequacy cannot be underwritten from funding chronology alone: the next
              diligence step is a current cash-and-burn schedule reconciled to contracted ARR, renewal timing,
              implementation backlog, debt, and any financing covenants.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Starburst has credible enterprise traction and a monetization model that can support large annual contract
              values, but the public record is materially stronger on bookings-adjacent indicators than on accounting
              quality or cash durability. The reported ARR-per-customer figure and record contract are company claims,
              and the available independent sources mostly describe product experience or list-price proxies rather than
              audited financial outcomes. The adverse evidence also matters: an independent sovereignty analysis argues
              that Galaxy's US control-plane exposure can force regulated buyers toward self-hosting, potentially
              increasing sales friction, deployment cost, or deal qualification requirements in sensitive sectors. That
              does not prove lost revenue, but it is a plausible margin and cycle risk. A defensible financial stance is
              research-more: validate ARR reconciliation, renewal and concentration data, realized discounts, gross
              margin by deployment type, cash runway, debt, and the economics of the Galaxy-to-Enterprise mix before
              assigning a stronger recommendation.
            claimRefs:
              - CI014
              - CI015
              - CI016
