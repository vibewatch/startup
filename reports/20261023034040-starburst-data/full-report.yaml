chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Starburst Data, Inc. is described by two independent company profiles as a private Boston software company
              founded in 2017. Its core proposition is not another system of record: it commercializes the open-source
              Trino query engine so enterprises can query distributed data across clouds, data centers, warehouses,
              lakes, and operational databases. Starburst Galaxy is the managed-cloud offer, while Starburst Enterprise
              is self-hosted and aimed at private-cloud, hybrid, on-premises, and air-gapped environments. The official
              product page claims more than 50 native connectors and emphasizes querying data without moving or copying
              it. That architecture is well aligned with regulated and heterogeneous estates, but paid differentiation
              still depends on governance, support, performance, and AI features being valuable beyond freely available
              Trino.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
