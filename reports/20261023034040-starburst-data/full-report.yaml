  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              Starburst sits between an open-source query engine and a full data platform. Its Enterprise product is a
              supported distribution of Trino that queries data lakes, warehouses, operational databases, and
              on-premises systems in place, while Galaxy supplies a managed cloud path. The direct commercial comparison
              is Dremio, which also sells federated lakehouse access, but the broader substitute set includes Snowflake
              and Databricks when the buyer prefers a centralized managed platform, Firebolt or StarRocks when
              predictable low-latency analytics matters more than federation, and Trino when an internal team can
              self-manage open source. Spark is adjacent rather than directly equivalent: the available Trino comparison
              positions Spark for ETL/ELT and Trino for interactive analytics. This means the relevant buying question
              is architecture and operating model, not a generic feature count.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP009
              - CP014
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Starburst's material product advantage is the combination of in-place federation, deployment flexibility,
              and enterprise governance. Official product material describes 50+ native connectors, ANSI SQL access,
              private-cloud, hybrid, on-premises, and air-gapped deployment, plus row- and column-level controls and
              audit integrations. Those features are relevant to regulated buyers whose data residency or legacy-system
              constraints make a warehouse migration costly. They are not equivalent to independently verified
              performance or adoption: the official page's claim of up to 2x faster performance than open-source Trino
              is a vendor claim, and the independent review recommends workload-specific benchmarking. Databricks is
              reported to have an advantage in ease of deployment and customer service, while Starburst is favored for
              features in complex environments. The resulting distribution moat is strongest where partners, security
              teams, and platform engineers value compatibility, but weaker where a buyer prioritizes a single managed
              warehouse or a simpler operating model.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Switching costs, pricing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs are asymmetric. Moving from Starburst to open-source Trino is relatively plausible because
              the commercial product is built on the same engine, SQL dialect, and connector model; the sacrifice is
              enterprise acceleration, governance, provisioning, and support. Moving to storage-centric systems is more
              disruptive because data must be ingested into a target storage format rather than queried in place.
              Starburst's freemium and credit-based entry lowers evaluation friction, but it also makes production spend
              workload-dependent and therefore difficult to compare with fixed subscription alternatives without a
              customer benchmark. Independent review evidence flags resource consumption, setup complexity, and
              performance issues on complex queries as potential drawbacks. The moat is therefore durable around
              regulated federation and existing Trino expertise, but vulnerable to commoditization of connectors,
              open-source self-management, and buyer decisions to accept migration in exchange for simpler centralized
              operations.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The positioning map uses ordinal, evidence-backed coordinates rather than a quantitative market benchmark.
              Higher federation breadth reflects documented multi-source access; higher managed simplicity reflects the
              degree to which the cited source describes infrastructure as managed rather than self-operated. Starburst
              is placed between Trino and centralized managed platforms because the evidence supports both a managed
              Galaxy path and a self-managed Enterprise path. The map should be read as a decision aid for architecture
              fit, not as a claim that any vendor is objectively faster, cheaper, or more widely adopted.
            claimRefs:
              - CP002
              - CP006
              - CP011
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is strongest where data cannot move
            body: >-
              Starburst's clearest defensible wedge is governed access across distributed, regulated, or hybrid data
              estates where centralization is constrained.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: Open source and centralized platforms bracket the product
            body: >-
              Trino can undercut licensing when engineering capacity is available, while Databricks and Snowflake can
              win when buyers value a simpler managed destination over federation.
            calloutType: risk
            claimRefs:
              - CP003
              - CP009
              - CP013
          - type: callout
            title: Benchmark total cost on representative workloads
            body: >-
              Credit-based pricing, source-system performance, and complex-query behavior make a buyer-specific
              benchmark necessary before treating product claims as a durable moat.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Starburst sells a commercial layer around Trino through Starburst Galaxy, a managed service, and Starburst
              Enterprise, a self-managed deployment for private cloud, hybrid, and on-premises environments. The company
              describes Enterprise as connecting to more than 50 sources through one SQL interface without moving or
              copying data, while its managed offer shifts infrastructure operations to Starburst. That product split
              supports two revenue motions: recurring managed consumption and enterprise software/support contracts.
              Public pricing is not a transparent list price. SelectHub reports a starting point of $1 per credit in
              prose but $0.50 in its pricing panel, so even the public starting point is internally inconsistent. G2
              reports an average implementation time of four months, a 13-month return-on-investment figure, and a 10%
              average discount; these are marketplace or review-derived buyer indicators, not realized Starburst
              revenue. The FY25 company release reports ARR per customer above $325,000 and an eight-figure-per-year
              multi-year contract, but does not disclose contract accounting, recognized revenue, or product mix. This
              combination suggests enterprise-value selling with potentially meaningful services and support
              obligations, but the mix and revenue-recognition profile remain unverified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI010
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
