        - label: Databricks
          x: 4
          'y': 8
          detail: Managed platform with strong ML and collaboration
        - label: Snowflake
          x: 3
          'y': 9
          detail: Managed cloud warehouse and centralized operating model
        - label: Firebolt or StarRocks
          x: 2
          'y': 5
