              - CE003
              - CE004
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: Differentiation, trust, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Product differentiation is the governed commercial layer around open Trino, not a proprietary storage
              substrate. Starburst describes row- and column-level controls, masking, encryption, audit logging, and
              integrations with Ranger, Vault, Okta, and LDAP. SiliconANGLE also reported AI Workflows, a
              natural-language AI Agent, automated tagging, an Iceberg-oriented catalog, managed table maintenance, and
              workload-routing updates in May 2025. These broaden the product from query federation toward governed data
              and AI operations, but announcement coverage does not establish production maturity or certification.
              Independent review evidence is directionally useful but thin: PeerSpot's comparison exposes only two
              Starburst reviews, SelectHub aggregates 132 reviews across two sites, and a Reddit thread raises the
              commercial-value question without supplying practitioner answers. Deployment complexity, resource
              consumption, permissions administration, and complex-query performance therefore remain diligence topics
              rather than proven defects across the installed base.
            claimRefs:
              - CE010
              - CE011
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Evidence gaps and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a credible product boundary and a live upstream project, but it does not
              close the underwriting questions that determine whether Starburst's premium over self-managed Trino is
              durable. The strongest quantified implementation and performance evidence comes from a validation
              commissioned by Starburst, while independent review samples either lack depth or have small, disclosed
              denominators. The fetched Gartner text contains only its general reviewer disclaimer and no
              product-specific rating detail, so it cannot be used as a current satisfaction benchmark. Diligence should
              obtain reproducible connector benchmarks, deployment staffing and migration records, service objectives,
              recovery testing, current security attestations, penetration-test results, and incident history. Absence
              of those records from this pool is an evidence gap, not proof that a control is ineffective or that an
              incident has not occurred.
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent commercial layer over Trino
            body: >-
              Starburst combines federated SQL with commercial connectors, governance, acceleration, deployment choice,
              and support rather than requiring a proprietary storage substrate.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE011
          - type: callout
            title: Benchmark and assurance evidence is not yet underwriting-grade
            body: >-
              Current quantified performance evidence is company-claimed or sponsored, while public security assurance
              and independent implementation evidence remain incomplete.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE013
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and deployment segments
        blocks:
          - type: paragraph
            body: >-
              Starburst sells into organizations whose data is distributed across cloud, on-premises, and hybrid
              systems, with the strongest observable fit in regulated and data-intensive environments. Its buyer is
              typically a data-platform, analytics, or governance owner; users include analysts, data engineers, and AI
              teams; and the economic sponsor is motivated by avoiding data movement, improving governed access, or
              reducing infrastructure work. Starburst Enterprise is positioned for private-cloud, hybrid, on-premises,
              and air-gapped deployments, while Galaxy is the managed option. The official product surface names
              financial services, healthcare, insurance, and government as use cases, but the public material does not
              disclose segment-level revenue, account counts, or geographic mix. This supports a segment thesis, not a
              customer-base census.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption and named customer proof
        blocks:
          - type: paragraph
            body: >-
              The clearest named deployment is Citi: SiliconANGLE reports that Citi uses Starburst to unify data access
              across 165 countries while maintaining data sovereignty. This is meaningful production-style proof of a
              high-complexity, regulated use case, but it does not disclose contract value, deployment scope, renewal
              status, or the number of users. Commissioned Enterprise Strategy Group research adds customer-reported
              operating outcomes, including a newly acquired subsidiary connected and analyzed within two weeks, up to
              60% less platform-management time for one customer, and 70% less infrastructure-management time for one
              Galaxy customer. Because those customers are anonymized and the study was commissioned by Starburst, the
              results are useful directional evidence rather than independently auditable cohort data.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU012
              - CU013
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence is insufficient to quantify retention or expansion. PeerSpot reports two Starburst
              Enterprise reviews and a 100% willingness-to-recommend figure, while SelectHub aggregates 132 reviews from
              two recognized sites and reports an 87% satisfaction rating; these are review signals, not renewal, GRR,
              NRR, or revenue retention. The available reviews also identify deployment complexity, resource
              consumption, difficult permission management, and usage-based cost forecasting as adoption friction.
              UpGuard’s October 23, 2026 vendor-risk page describes continuous monitoring, but its free extract
              withholds the rating and underlying findings. There is therefore no public basis in the assigned evidence
              for a current customer-count, churn, renewal, or top-account concentration number. These gaps matter
              because a regulated-enterprise sales motion can be durable while still depending on a small number of
              large accounts or high-touch deployments.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Customer evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate named production evidence, anonymized outcome evidence, and broad review or segment
              signals. They should not be read as a funnel: the sources use different populations, units, and time
              bases, and none supports a conversion rate from prospects to active customers. The practical diligence
              priority is to obtain a customer cohort schedule showing active accounts, renewal dates, GRR/NRR,
              expansion revenue, implementation status, and the share of ARR attributable to the largest customers.
            claimRefs:
              - CU005
              - CU010
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Named regulated-enterprise proof
            body: >-
              Citi's reported use across 165 countries is the strongest public proof of Starburst serving a complex,
              sovereignty-sensitive deployment.
            calloutType: strength
            claimRefs:
              - CU005
          - type: callout
            title: Retention and concentration remain private
            body: >-
              No retained source establishes current active customers, GRR, NRR, churn, renewal timing, or the share of
              ARR from the largest accounts.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Starburst markets deployments for financial services, healthcare, insurance, and government, including
              air-gapped and data-residency-sensitive environments. That positioning raises the consequence of
              access-control, masking, audit-log, and data-sovereignty failures even where no public enforcement event
              was found in the assigned evidence. Its own Enterprise page describes row- and column-level controls,
              encryption, third-party integrations, and audit logging, while independent material describes governance
              and compliance as product benefits rather than as an audit result. The investment implication is
              conditional: regulated-market differentiation is valuable only if controls, certifications, incident
              response, and customer contractual obligations can be verified in diligence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, quality, and security risks
        blocks:
          - type: paragraph
            body: >-
              The platform's architecture distributes work across coordinators, workers, connectors, catalogs, and
              remote data systems. This creates multiple failure surfaces: query planning, connector behavior, source
              availability, resource sizing, permissions, upgrades, and performance under concurrency. A current job
              posting describes production support, migration troubleshooting, platform health, query failures,
              performance tuning, and incident root-cause analysis as required operating work. Independent review
              evidence also flags resource consumption, complex setup, slow complex queries, and decentralized
              permissions as user-reported or analyst-identified limitations. These signals do not prove an incident,
              but they support a material execution risk and make uptime, query-error, recovery-time, and
              security-incident metrics important kill criteria.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR013
      - number: '7.3'
        title: Partner, platform, and financial-model dependencies
        blocks:
          - type: paragraph
            body: >-
              Starburst depends on the Trino open-source engine, a broad connector ecosystem, cloud and on-premises
              infrastructure, and customer teams capable of administering distributed data systems. PeerSpot's
              comparison says Starburst can require more technical knowledge to deploy, while the company's own material
              emphasizes more than 50 connectors and operation across multiple environments. That combination creates
              both differentiation and support burden: connector compatibility, upstream vulnerabilities, cloud
              capacity, and customer skills can affect time to value. Public evidence in this pool does not establish
              cash runway, burn, margin, debt, customer concentration, or the structure of the Citi investment, so
              financial resilience and partner concentration remain unresolved rather than assumed safe.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Treat a material security incident, repeated high-severity connector outage, inability to demonstrate
              regulated-data controls, or implementation economics that prevent expansion as thesis-break signals.
              Financial diligence should also escalate if current burn, runway, debt, or customer concentration is
              materially weaker than management disclosure.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR013
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned public pool does not establish a complete litigation, incident, customer-concentration, or
              financial-resilience record. Those items remain diligence gaps rather than negative findings or
              assurances.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR008
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and price discipline
        blocks:
          - type: paragraph
            body: >-
              Starburst has a credible enterprise data-infrastructure proposition: it commercializes Trino-based
              federated querying, sells both managed and self-managed offerings, and positions governance and data
              residency as buying criteria for regulated customers. Independent coverage reported a $250 million Series
              D in February 2022 that brought the company to a $3.35 billion valuation and $414 million of cumulative
              financing, while the same reporting described nearly three-times revenue growth in 2021. Those facts
              support a real scale and financing signal, not a current valuation mark. The 2025 SiliconANGLE report adds
              a strategic Citi investment and says Citi uses Starburst across 165 countries, but gives no investment
              amount or price. Public evidence therefore supports a quality-positive, price-conditional thesis rather
              than a buy decision. Entry discipline should require a current cap table, preferred terms, latest
              financing price, ARR bridge, gross margin, net retention, cash, debt, and burn. Without those inputs, a
              precise private-company multiple or target return would be false precision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              The upside thesis is that Starburst can monetize a durable need to query distributed and sensitive data
              without centralizing it, then expand from query federation into governed data products and AI workflows.
              Sources describe more than 50 connectors, enterprise controls, and a product surface spanning Galaxy and
              Enterprise; these are differentiation signals, but most are company or ecosystem descriptions rather than
              audited financial proof. The anti-thesis is that open-source Trino limits switching costs, cloud data
              platforms and adjacent vendors can compress pricing, and the company may need sustained sales and
              engineering investment to turn a broad platform into durable recurring economics. A 2026 Enterprise
              Strategy Group validation commissioned by Starburst modeled 45% lower three-year total cost of ownership
              and a 414% return on investment for a hypothetical customer, but that sponsored model is not evidence of
              Starburst's own margins or valuation. The only directly refreshed public-market reference in the assigned
              pool is Snowflake, whose October 2026 market capitalization was reported at $110.76 billion; that is a
              scale and public-liquidity benchmark, not a like-for-like private valuation multiple. The comparable set
              is consequently directional and cannot justify marking Starburst above or below $3.35 billion without
              current Starburst revenue and margin data.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more reliable than a point estimate. In the bull case, Starburst converts its
              distributed-data and regulated-AI positioning into sustained expansion, with retention and margins strong
              enough to support a premium software multiple. In the base case, it remains a valuable but
              execution-sensitive private platform whose fair entry price depends on verified ARR quality and dilution
              terms. In the bear case, cloud competition, open-source substitution, slower AI monetization, or a down
              round compresses value and lengthens the exit window. These are conditional investment signals, not
              probability-weighted forecasts, because public sources do not disclose current ARR mix, GRR, churn,
              customer concentration, profitability, cash, debt, or the Citi transaction structure. Exit readiness is
              therefore unproven: historical reporting mentioned an IPO ambition, but no current filing or liquidity
              timetable is evidenced here. The decision should move toward buy only after price and operating evidence
              close the listed gaps; otherwise track or research-more is the appropriate protection against
              private-market information asymmetry.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research-more is the defensible recommendation: the historical financing signal is strong, but current
              price and private operating evidence are not sufficient for a buy.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV015
          - type: callout
            title: Downside trigger
            body: >-
              A down round, weak retention, customer concentration, or inability to verify cash and preferred terms
              would materially worsen the investment case.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV016
