              - CM014
      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The buying center is shaped by where data resides and who bears the cost of movement, governance, or
              operational complexity. Platform and data engineering teams are the primary users and technical
              evaluators; CIO, CTO, CDO, security, risk, and compliance leaders can own budget when sovereignty or
              regulated-data requirements dominate. Analysts, BI teams, and increasingly AI application teams are
              downstream users. Adoption is most credible where an enterprise has multiple clouds or legacy systems,
              cannot freely move sensitive data, or needs one governed access layer. Starburst's public product surfaces
              emphasize self-managed deployment for on-premises and hybrid estates, and an independent technical review
              says those deployments require infrastructure, networking, security, and governance expertise.
              SiliconANGLE also reports a Citi use case across 165 countries. These signals support an enterprise land
              motion, but they do not establish contract size, conversion rates, or repeatable payback.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are AI workloads, real-time analytics in regulated industries, data-mesh or logical-fabric
              architectures, and pressure to limit duplication and egress. Mordor's report identifies each as a market
              driver and separately flags governance failures, scarce optimization skills, egress fees, and fragmented
              sovereignty rules as restraints. Product evidence also indicates a switching-cost trade: federation can
              avoid migration, but deployment, query tuning, security integration, and resource management still require
              scarce expertise. Mordor reports that 90% of organizations experience critical talent gaps that add three
              to ten months to digital projects, and an independent technical review distinguishes Galaxy's lower
              operating burden from Enterprise's infrastructure, networking, security, and governance requirements.
              Accordingly, valuation relevance depends on proving durable expansion within regulated and distributed
              estates while validating implementation burden, gross margin, usage economics, and whether customers
              consolidate onto a competing warehouse or retain multi-platform architectures.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category growth is credible, company capture is not yet measurable
            body: >-
              The retained evidence supports a growing data-virtualization category and a coherent Starburst use case,
              but not a defensible company-specific market share or SOM.
            calloutType: insight
            claimRefs:
