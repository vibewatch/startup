  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Starburst's core customer workflow is to connect existing lakes, warehouses, operational databases, and
              on-premises systems, then query them through a common SQL layer rather than first centralizing every
              dataset. The open-source foundation is Trino, whose own site describes both in-place analysis and
              federation across multiple systems. Starburst Enterprise adds a self-managed deployment surface for
              private-cloud, hybrid, on-premises, and air-gapped environments, while older secondary documentation
              describes Galaxy as the managed SaaS counterpart. The commercial value therefore sits above the base
              engine: connector packaging, governance, acceleration, support, and reduced operating burden. A
              commissioned 2026 validation reports materially shorter source onboarding for interviewed customers, but
              that evidence should be treated as sponsored customer testimony, not as a representative implementation
              benchmark.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE010
      - number: '5.2'
        title: Architecture, deployment, and maturity
        blocks:
          - type: paragraph
            body: >-
              The technical core follows Trino's coordinator-worker pattern. The coordinator parses, plans, and
              schedules SQL; workers retrieve and process data through source-specific connectors; catalogs hold the
              configurations that determine how those connectors expose each source. This makes connector behavior,
              pushdown, source-system capacity, and network locality part of realized performance rather than
              implementation detail. Starburst's current Enterprise page claims more than 50 native connectors and up to
              two-times faster performance than open-source Trino, while a company-commissioned ESG report cites an
              internal benchmark of up to 28% over standard Trino and alternatives. Neither disclosure provides the
              workload-level evidence needed to generalize to a buyer's estate. The Trino GitHub release page listing
              version 484 on 2026-10-16 does, however, provide a current developer signal for the upstream engine.
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE009
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
