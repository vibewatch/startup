  - id: FP001
    title: 'Competitive positioning: federation breadth versus managed simplicity'
    type: quadrant
    summary: >-
      Starburst occupies a high-federation, medium-managed-simplicity position, with substitutes trading away one or
      both dimensions.
    data:
      points:
        - label: Starburst
          x: 8
          'y': 6
          detail: 50+ connectors, Galaxy managed cloud, Enterprise self-managed
        - label: Trino
          x: 8
          'y': 2
