      - ["Enterprise context and governance", "Data owners, analysts, and security teams", "Current official Enterprise product surface", "Data products, lineage, RBAC or ABAC, masking, and audit controls", "Independent control testing and policy-propagation evidence"]
      - ["AI workflows and agent", "Analysts and AI application teams", "Capabilities reported in a May 2025 product announcement", "SQL-managed workflows and natural-language access to governed data", "General availability, accuracy, observability, and model-risk controls"]
    notes: >-
      Status reflects the assigned public sources, including company material and sponsored
