    title: Workflow and use-case table
    columns: [User job, Prior or current workflow, Starburst approach, Source-described benefit, Limitation]
    rows:
      - ["Cross-source analysis", "Copy or transform data into a central platform", "Federated SQL against data where it resides", "Less movement, duplication, and ETL are claimed", "Network and source-system performance remain material"]
      - ["New-source onboarding", "Build bespoke integrations for each source", "Use packaged connectors and standardized catalogs", "Commissioned interviews report days or weeks rather than months or years", "Named workload mix and sample size are not disclosed"]
      - ["Regulated analytics", "Centralize sensitive data or maintain separate access paths", "Apply governed access while data remains distributed", "Supports residency and fine-grained controls as described", "Current attestations and operating-effectiveness evidence are absent"]
      - ["AI data preparation", "Create separate pipelines for unstructured data and vectors", "Use AI Workflows, SQL, Iceberg tables, and vector connectors", "Fewer external pipeline components are described", "Production quality and roadmap status require verification"]
      - ["Interactive BI and applications", "Connect each consuming tool to separate systems", "Use a common SQL interface, ODBC, and BI integrations", "Simpler access and routing are claimed", "End-to-end latency and recovery depend on deployment topology"]
    notes: >-
      Benefits are company-described or reported in a company-commissioned validation and
      are not normalized independent benchmarks.
    claimRefs: [CE002, CE003, CE007, CE008, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Principal risk]
    rows:
      - ["Client and application access", "Submits SQL or natural-language requests", "BI drivers, ODBC or JDBC, and identity services", "Compatibility, generated-query quality, and connection reliability"]
      - ["Coordinator", "Parses SQL, plans execution, and schedules tasks", "Cluster control plane and source statistics", "Planning bottlenecks and control-plane resilience"]
      - ["Worker cluster", "Retrieves and processes data in parallel", "Compute, memory, spill storage, and network capacity", "Resource contention and workload isolation"]
      - ["Connector layer", "Translates plans and accesses each source", "Source-specific connector implementation", "Incomplete pushdown, version drift, and source load"]
      - ["Catalog and table layer", "Configures access and manages open table formats", "Catalog metadata, Iceberg or Hive, and object storage", "Metadata consistency, compaction, and maintenance"]
      - ["Governance and context layer", "Applies policies, lineage, masking, and business definitions", "Identity providers and policy integrations", "Misconfiguration and inconsistent policy propagation"]
      - ["Acceleration and routing", "Caches, optimizes, and directs workloads across compute", "Workload statistics and multiple execution clusters", "Benchmark transferability, cost control, and failover behavior"]
    notes: >-
      Roles synthesize Trino technical descriptions and Starburst product material;
      dependency and risk columns are analytical interpretations requiring deployment review.
    claimRefs: [CE004, CE005, CE006, CE009, CE010, CE011]

figures:
  - id: FE001
    title: Starburst product architecture map
    type: stack
    summary: The commercial product layers governed access, acceleration, and operations over Trino federation and the customer's existing data estate.
    data:
      layers:
        - label: User and application access
          modules:
            - name: BI and SQL clients
              detail: Applications submit ANSI SQL through supported interfaces and drivers.
            - name: Analysts and AI agents
              detail: Natural-language and AI workflow surfaces are described in the 2025 announcement.
        - label: Enterprise context and governance
          modules:
            - name: Data products and lineage
              detail: Governed definitions and lineage provide reusable data context.
            - name: Policy controls
              detail: RBAC, ABAC, masking, encryption, and audit capabilities are company-described.
        - label: Query and execution engine
          modules:
            - name: Coordinator
              detail: Parses, plans, optimizes, and schedules distributed SQL work.
            - name: Worker cluster
              detail: Retrieves and processes source data in parallel.
        - label: Acceleration and workload control
          modules:
            - name: Query acceleration
              detail: Warp Speed, caching, pushdown, and cost-based optimization are claimed.
            - name: Routing
              detail: Role-based and deployment-set routing direct work across compute clusters.
        - label: Federation and data management
          modules:
            - name: Connectors and catalogs
              detail: Source-specific connectors expose distributed systems through configured catalogs.
            - name: Iceberg and open formats
              detail: Table-format support connects lakehouse storage to the query layer.
        - label: Customer data estate
          modules:
            - name: Lakes, warehouses, streams, and databases
              detail: Data remains in existing systems rather than requiring universal centralization.
            - name: Cloud, hybrid, and on-premises environments
              detail: Deployment choice is part of the Enterprise positioning.
    approximationNotes: >-
      This is a logical product stack synthesized from assigned sources, not a network
      topology or representation of every deployable component.
    claimRefs: [CE002, CE003, CE004, CE010, CE011, CE012]

callouts:
  - calloutType: strength
    title: Coherent commercial layer over Trino
    body: Starburst combines federated SQL with commercial connectors, governance, acceleration, deployment choice, and support rather than requiring a proprietary storage substrate.
    claimRefs: [CE001, CE002, CE003, CE004, CE011]
  - calloutType: risk
    title: Benchmark and assurance evidence is not yet underwriting-grade
    body: Current quantified performance evidence is company-claimed or sponsored, while public security assurance and independent implementation evidence remain incomplete.
    claimRefs: [CE006, CE007, CE009, CE013, CE014, CE016]

