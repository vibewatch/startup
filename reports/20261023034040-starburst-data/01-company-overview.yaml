    title: Scale metrics remain attributed
    body: Reported ARR, growth, retention, valuation, total funding, and headcount are not substitutes for audited financials, a reconciled capitalization history, or a dated workforce bridge.
    claimRefs:
      - CO008
      - CO009
      - CO011
      - CO012
      - CO013
