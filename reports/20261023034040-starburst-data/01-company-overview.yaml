company:
  name: Starburst Data
chapter:
  number: 1
  title: Company Overview
  summary: Starburst Data is a Boston-based private software company founded in 2017 that commercializes Trino through managed and self-managed data-access platforms. Secondary sources report substantial financing and more than $100 million of ARR, but the assigned evidence does not verify current ownership, customer count, margins, cash use, or the definitions behind several scale metrics.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Starburst Data, Inc. is described by two independent company profiles as a private Boston software company founded in 2017. Its core proposition is not another system of record: it commercializes the open-source Trino query engine so enterprises can query distributed data across clouds, data centers, warehouses, lakes, and operational databases. Starburst Galaxy is the managed-cloud offer, while Starburst Enterprise is self-hosted and aimed at private-cloud, hybrid, on-premises, and air-gapped environments. The official product page claims more than 50 native connectors and emphasizes querying data without moving or copying it. That architecture is well aligned with regulated and heterogeneous estates, but paid differentiation still depends on governance, support, performance, and AI features being valuable beyond freely available Trino.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Justin Borgman is identified as co-founder and CEO, with prior operating experience at Hadapt and Teradata. The supplied leadership profile identifies Steven Chung as president overseeing operations, go-to-market, and customer success; Toni Adams as the senior partner and alliances leader; and Megan Maslanka as chief people officer. This roster provides visible coverage across product vision, commercial execution, partnerships, and organizational development. It does not establish the board roster, investor directors, voting rights, founder ownership, succession planning, or whether the listed team is complete as of the run date. Those omissions matter because the company remains private and the evidence ties its origin and public identity closely to Borgman.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO016
    tableRefs:
      - TO002
  - id: financing-and-scale
    title: Financing and scale signals
    body: >-
      A 2026 secondary profile reports a $250 million Series D in May 2025 at a $3.35 billion valuation, led by Alkeon with participation from Andreessen Horowitz, Coatue, Index Ventures, and Salesforce Ventures. Another profile reports more than $414 million raised in total, but its page contains an internally inconsistent funding table, so that total should not be treated as reconciled. SiliconANGLE separately reported a strategic Citi investment without an amount or terms. Two profiles report that Starburst crossed $100 million in annual recurring revenue in February 2026, alongside approximately 40% year-over-year growth, 130% net dollar retention, and a $20 million AI run rate. These are attributed operating metrics, not audited revenue, cash, or profitability measures.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
    tableRefs:
      - TO003
  - id: milestones-and-diligence-boundary
    title: Milestones and diligence boundary
    body: >-
      The retained chronology links the 2017 founding to a documented two-product structure by mid-2023, a major financing and AI-product push in May 2025, a commissioned economic validation in January 2026, and reported ARR and workforce scale in early 2026. The evidence also introduces caution. Two profiles disagree on 2026 headcount, reporting 507 and 537 employees, while PeerSpot's October 2026 comparison gives Starburst only two reviews and notes greater deployment complexity than Databricks. The pool supplies no verified current customer count, complete cap table, board register, audited statements, gross margin, cash balance, burn, debt schedule, retention cohorts, or customer concentration. It also does not prove the absence of lawsuits, outages, breaches, sanctions, or other adverse events.
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    figureRefs:
      - FO001

