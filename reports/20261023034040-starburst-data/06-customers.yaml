      - [Data-intensive enterprises, "Buyer: analytics/data engineering; users: analysts, engineers, BI, and AI teams; payer: platform budget", "One SQL access layer across distributed data sources", "Product materials and analyst/market coverage", "No disclosed vertical mix or average contract size"]
      - [Partners and implementation channels, "Buyer: Starburst customer; users: technical and business teams; payer: customer services budget", "Implementation, enablement, governance, and optimization", "DataCouch identifies itself as an official enablement partner", "Partner-sourced demand and services dependence are unquantified"]
    notes: "Segments are qualitative market and deployment groupings, not a reported customer census; revenue, account counts, and payer mix are not disclosed."
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date / period, Source, Confidence, Implication, Missing denominator]
    rows:
      - [Named regulated deployment, "165 countries", "Reported 2025-05-19", "SiliconANGLE", high, "Evidence of complex global deployment and data-sovereignty relevance", "Users, contract value, renewal, and workload share"]
      - [New-subsidiary onboarding, "Within two weeks", "ESG customer report; period not stated", "Enterprise Strategy Group commissioned validation", medium, "Suggests connector-led time-to-value for one customer", "Customer identity, baseline, and sample size"]
      - [Platform-management time, "Up to 60% less time", "ESG customer report; period not stated", "Enterprise Strategy Group commissioned validation", medium, "Directional operating-efficiency benefit for one customer", "Baseline hours, customer identity, and sample size"]
      - [Infrastructure-management outcome, "70% less time", "ESG customer report; period not stated", "Enterprise Strategy Group commissioned validation", medium, "Directional benefit for one Galaxy customer", "Baseline hours, customer identity, and sample size"]
      - [Review willingness to recommend, "100%", "Updated 2024-12-05; two reviews", "PeerSpot", medium, "Positive but very small review sample", "Renewal behavior, population representativeness, and revenue coverage"]
    notes: "Values use the source's own units and qualifications. The sources do not provide a common population, denominator, or time basis; these rows are not comparable as a growth series."
    claimRefs: [CU005, CU006, CU007, CU008, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [Customer / evidence subject, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Citigroup, Financial services, "Unified data access across 165 countries while maintaining data sovereignty", "Reported active use; deployment scope not disclosed", "Global regulated-use proof", "No contract, ARR, renewal, or user data"]
      - [Unnamed customer A, Enterprise data platform, "Connected and analyzed data from a newly acquired subsidiary using native connectors", "Customer-reported deployment", "Within two weeks", "Anonymized and commissioned evidence; no baseline or sample size"]
      - [Unnamed customer B, Enterprise analytics, "Reduced time managing disparate platforms and custom integrations", "Customer-reported deployment", "Up to 60% less time", "Anonymized; 'up to' is not a typical result or verified average"]
      - [Unnamed customer C, Galaxy managed platform, "Reduced infrastructure management after adopting managed Galaxy", "Customer-reported deployment", "70% less infrastructure-management time", "Anonymized; period and baseline are not stated"]
    enumerationScope:
      coverage: sample
      basis: "Publicly named and anonymized customer evidence retained from the assigned pool, through 2026-10-23"
    notes: "The public pool contains one named customer and three anonymized customer examples; no exhaustive customer list or independently verified production-status register is available."
    claimRefs: [CU005, CU006, CU007, CU008]
figures:
  - id: FU001
    title: Customer journey from distributed-data pain to expansion
    type: journey-map
    summary: "Starburst's observable customer path moves from fragmented data access to governed use, with proof strongest at deployment and weakest at renewal."
    data:
      nodes:
        - id: problem
          label: Distributed and regulated data
          detail: "Multiple clouds, on-premises systems, and data-residency constraints create the initial buying problem."
          touchpoints: ["Data platform assessment", "Governance and sovereignty requirements"]
        - id: deploy
          label: Federated deployment
          detail: "Enterprise or Galaxy connects to existing sources without requiring wholesale centralization."
          touchpoints: ["Connector configuration", "Enterprise or managed deployment"]
        - id: use
          label: Governed analytics and AI
          detail: "Analysts, engineers, and AI teams query or productize data through a governed access layer."
          touchpoints: ["SQL and BI access", "Data products and governed AI"]
        - id: reference
          label: Reference and proof
          detail: "Named or referenceable customer evidence can reduce procurement uncertainty."
          touchpoints: ["Customer reference", "Outcome validation"]
        - id: renew
          label: Renewal decision
          detail: "Renewal and expansion depend on realized value, adoption breadth, and procurement friction."
          touchpoints: ["Renewal review", "Expansion or contraction"]
        - id: expand
          label: Expansion and renewal
          detail: "Potential expansion into more sources, workloads, regions, and users is plausible but not publicly quantified."
          touchpoints: ["Additional workloads", "Renewal and expansion proof gap"]
    approximationNotes: "The sequence is an analytical model of the customer journey, not a measured conversion funnel; stages have different evidence bases and no conversion rates are inferred."
    claimRefs: [CU001, CU003, CU005, CU012, CU013]
callouts:
  - calloutType: strength
    title: Named regulated-enterprise proof
    body: "Citi's reported use across 165 countries is the strongest public proof of Starburst serving a complex, sovereignty-sensitive deployment."
    claimRefs: [CU005]
  - calloutType: risk
    title: Retention and concentration remain private
    body: "No retained source establishes current active customers, GRR, NRR, churn, renewal timing, or the share of ARR from the largest accounts."
    claimRefs: [CU013, CU014]
