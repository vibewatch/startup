  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "A current cohort schedule with active accounts, GRR, NRR, churn, renewal timing, and expansion revenue."
      whyItMatters: "Deployment proof does not show whether customers renew or expand, which is central to recurring-revenue durability."
      diligencePath: "Request a monthly cohort bridge for the last eight quarters, reconciled to revenue and separating new, renewed, expanded, contracted, and churned accounts."
      relatedQuestionRefs: [QU002, QU004, QU005, QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer
      missingEvidence: "A customer register identifying named production deployments, pilots, locations, workloads, and implementation status."
      whyItMatters: "One named account and anonymized examples cannot establish customer breadth or concentration."
      diligencePath: "Obtain a referenceable customer list with permission status, deployment stage, ARR band, renewal date, and primary use case."
      relatedQuestionRefs: [QU003, QU007]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-customer revenue concentration and channel or partner dependence."
      whyItMatters: "A few large regulated-enterprise accounts or implementation partners could make reported adoption less durable than it appears."
      diligencePath: "Request ARR concentration by top 1, 5, and 10 customers and partner-sourced bookings for the last eight quarters."
      relatedQuestionRefs: [QU006, QU007]
    - type: stale
      severity: minor
