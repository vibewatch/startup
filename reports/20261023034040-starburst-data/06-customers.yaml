artifact: customers
slug: starburst-data
runDate: 2026-10-23
company:
  name: Starburst Data
chapter:
  number: 6
  title: Customers
  summary: Starburst has credible enterprise adoption signals, including a Citi deployment spanning 165 countries, customer-reported benefits in commissioned research, and a small but positive independent review footprint. Public evidence does not establish a verified customer count, retention cohort, or concentration profile, so adoption quality is stronger than disclosure quality.
sections:
  - id: customer-segments
    title: Buyer, user, and deployment segments
    body: >-
      Starburst sells into organizations whose data is distributed across cloud, on-premises, and
      hybrid systems, with the strongest observable fit in regulated and data-intensive environments.
      Its buyer is typically a data-platform, analytics, or governance owner; users include analysts,
      data engineers, and AI teams; and the economic sponsor is motivated by avoiding data movement,
      improving governed access, or reducing infrastructure work. Starburst Enterprise is positioned
      for private-cloud, hybrid, on-premises, and air-gapped deployments, while Galaxy is the managed
      option. The official product surface names financial services, healthcare, insurance, and
      government as use cases, but the public material does not disclose segment-level revenue,
      account counts, or geographic mix. This supports a segment thesis, not a customer-base census.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption and named customer proof
    body: >-
      The clearest named deployment is Citi: SiliconANGLE reports that Citi uses Starburst to unify
      data access across 165 countries while maintaining data sovereignty. This is meaningful
      production-style proof of a high-complexity, regulated use case, but it does not disclose
      contract value, deployment scope, renewal status, or the number of users. Commissioned
      Enterprise Strategy Group research adds customer-reported operating outcomes, including a
      newly acquired subsidiary connected and analyzed within two weeks, up to 60% less
      platform-management time for one customer, and 70% less infrastructure-management time for
      one Galaxy customer. Because
      those customers are anonymized and the study was commissioned by Starburst, the results are
      useful directional evidence rather than independently auditable cohort data.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: retention-expansion-risk
    title: Retention, expansion, and concentration
    body: >-
      Public evidence is insufficient to quantify retention or expansion. PeerSpot reports two
      Starburst Enterprise reviews and a 100% willingness-to-recommend figure, while SelectHub
      aggregates 132 reviews from two recognized sites and reports an 87% satisfaction rating; these
      are review signals, not renewal, GRR, NRR, or revenue retention. The available reviews also
      identify deployment complexity, resource consumption, difficult permission management, and
      usage-based cost forecasting as adoption friction. UpGuard’s October 23, 2026 vendor-risk page
      describes continuous monitoring, but its free extract withholds the rating and underlying
      findings. There is therefore no public basis in the assigned evidence for a current
      customer-count, churn, renewal, or top-account concentration number. These gaps matter because
      a regulated-enterprise sales motion can be durable while still depending on a small number of
      large accounts or high-touch deployments.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
  - id: customer-exhibits
    title: Customer evidence exhibits
    body: >-
      The exhibits separate named production evidence, anonymized outcome evidence, and broad
      review or segment signals. They should not be read as a funnel: the sources use different
      populations, units, and time bases, and none supports a conversion rate from prospects to
      active customers. The practical diligence priority is to obtain a customer cohort schedule
      showing active accounts, renewal dates, GRR/NRR, expansion revenue, implementation status,
      and the share of ARR attributable to the largest customers.
    claimRefs: [CU005, CU010, CU014]
tables:
