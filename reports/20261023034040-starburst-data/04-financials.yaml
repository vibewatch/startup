company:
  name: Starburst Data
chapter:
  number: 4
  title: Financials
  summary: Starburst discloses strong commercial momentum and a usage-oriented monetization model, but public evidence does not disclose cash, burn, gross margin, retention cohorts, or realized pricing. The underwriting case therefore rests on reported customer and ARR proxies while treating capital adequacy and unit economics as material diligence gaps.
sections:
  - id: monetization
    title: Revenue model and monetization
    body: >-
      Starburst sells a commercial layer around Trino through Starburst Galaxy, a managed
      service, and Starburst Enterprise, a self-managed deployment for private cloud, hybrid,
      and on-premises environments. The company describes Enterprise as connecting to more than
      50 sources through one SQL interface without moving or copying data, while its managed
      offer shifts infrastructure operations to Starburst. That product split supports two
      revenue motions: recurring managed consumption and enterprise software/support contracts.
      Public pricing is not a transparent list price. SelectHub reports a starting point of
      $1 per credit in prose but $0.50 in its pricing panel, so even the public starting point is
      internally inconsistent. G2 reports an average implementation time of four months, a
      13-month return-on-investment figure, and a 10% average discount; these are marketplace or
      review-derived buyer indicators, not realized Starburst revenue. The FY25 company release
      reports ARR per customer above $325,000 and an eight-figure-per-year multi-year contract,
      but does not disclose contract accounting, recognized revenue, or product mix. This
      combination suggests enterprise-value selling with potentially meaningful services and
      support obligations, but the mix and revenue-recognition profile remain unverified.
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      The strongest public traction evidence is company-issued rather than audited financial
      disclosure. Starburst says FY25 net-new customers grew 20%, Galaxy customer growth rose
      76% year over year, Galaxy adoption increased 94% year over year, and ARR per customer
      exceeded $325,000. It also says ten of the top fifteen global banks are customers and that
      Dell selected Starburst as the analytics query engine for Dell Data Lakehouse. These
      disclosures indicate enterprise distribution and a growing cloud motion, but they do not
      establish cohort retention, gross retention, net retention, CAC, payback, sales-cycle
      duration, or the share of bookings converted to recognized revenue. Independent review
      evidence is directionally positive but mixed on economics: G2 users cite integration and
      query performance, while also describing configuration complexity and pricing that can
      become harder to justify as usage scales. The appropriate underwriting conclusion is
      commercial traction with incomplete efficiency visibility, not a proven efficient-growth
      profile.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
  - id: cost-capital
    title: Cost structure and capital adequacy
    body: >-
      Starburst's cost structure is likely shaped by distributed-query compute, connector and
      support engineering, enterprise implementation, and cloud operations, but the assigned
      evidence does not provide gross margin, hosting cost, support cost, capex, working-capital
      needs, cash balance, debt, burn, or runway. The platform can reduce customer data movement
      and duplication, yet that customer benefit does not establish Starburst's own margin
      profile. G2 reviewers report that consumption-based pricing can make monthly expense hard
      to predict, while PeerSpot characterizes Enterprise deployment as requiring more technical
      knowledge than Databricks; both are buyer-side signals that workload and delivery economics
      require measurement rather than inference. The 2025 Citi strategic investment is described
      by SiliconANGLE, but its size, valuation, instrument, and use of proceeds are not disclosed
      in the retained sources. Accordingly, capital adequacy cannot be underwritten from funding
      chronology alone: the next diligence step is a current cash-and-burn schedule reconciled to
      contracted ARR, renewal timing, implementation backlog, debt, and any financing covenants.
    claimRefs: [CI010, CI011, CI012, CI013, CI016]
    tableRefs: [TI003]
  - id: verdict
    title: Financial underwriting verdict
    body: >-
      Starburst has credible enterprise traction and a monetization model that can support large
      annual contract values, but the public record is materially stronger on bookings-adjacent
      indicators than on accounting quality or cash durability. The reported ARR-per-customer
      figure and record contract are company claims, and the available independent sources mostly
      describe product experience or list-price proxies rather than audited financial outcomes.
      The adverse evidence also matters: an independent sovereignty analysis argues that Galaxy's
      US control-plane exposure can force regulated buyers toward self-hosting, potentially
      increasing sales friction, deployment cost, or deal qualification requirements in sensitive
      sectors. That does not prove lost revenue, but it is a plausible margin and cycle risk.
      A defensible financial stance is research-more: validate ARR reconciliation, renewal and
      concentration data, realized discounts, gross margin by deployment type, cash runway,
      debt, and the economics of the Galaxy-to-Enterprise mix before assigning a stronger
      recommendation.
    claimRefs: [CI014, CI015, CI016]
    tableRefs: []
tables:
  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Unit, Current value or status, Quality, Diligence ask]
    rows:
      - [Starburst Galaxy, Managed federated analytics and AI platform, Usage/contract, "Customer growth +76% YoY; adoption +94% YoY", Company-claimed, "ARR bridge by Galaxy cohort and recognized-revenue policy"]
      - [Starburst Enterprise, Self-managed software for private cloud/hybrid/on-premises, "Enterprise contract; term undisclosed", "50+ native connectors; pricing undisclosed", Official product evidence, "License, support, services, and renewal split"]
      - [Enterprise large contracts, Multi-year enterprise agreements, Annual contract value, "Largest disclosed deal is eight figures per year", Company-claimed, "Signed backlog, implementation obligations, and conversion to revenue"]
      - [Professional support and services, "Deployment, support, and operational assistance", "Unit and terms undisclosed", "Terms and mix undisclosed", Evidence gap, "Services attach rate, delivery cost, and gross margin"]
    notes: "Company releases and official product material; current values are company claims or product descriptors, not audited revenue; undisclosed fields are evidence gaps."
    claimRefs: [CI001, CI003, CI005, CI006, CI007]
  - id: TI002
    title: Pricing and monetization signals
    columns: [Price or contract signal, Basis, List vs realized, Confidence, Implication]
    rows:
      - ["Conflicting $1 and $0.50 per-credit starting figures", SelectHub product listing, List/starting indication, Medium, "Confirms usage-based framing but not a reliable public starting price, realized ACV, or margin"]
      - ["$325,000+ ARR per customer", FY25 Starburst release, Company-reported ARR proxy, Medium, "Suggests enterprise ACV but needs cohort and denominator reconciliation"]
      - ["Eight-figure contract per year", FY25 Starburst release, Signed contract value, Medium, "Shows capacity for large deals; revenue timing and concentration unknown"]
      - ["10% average discount", G2 pricing insights, Review-derived average, Low, "Potential discounting signal; validate against deal desk data"]
    notes: "Signals combine company claims with third-party marketplace/review data; they are not interchangeable measures of price, ARR, bookings, or recognized revenue."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR per customer, "$325,000+", Medium, "Indicates enterprise contract scale", "Reconcile numerator, active-customer denominator, and cohort vintage"]
      - [Net-new customer growth, "20% in FY25", Medium, "Signals demand but not retention or efficiency", "Bridge bookings, churn, and sales capacity"]
      - [Galaxy customer growth, "76% YoY", Medium, "Shows managed-product expansion", "Provide cohort retention and paid conversion"]
      - [Galaxy adoption growth, "94% YoY", Medium, "Indicates cloud momentum", "Define adoption denominator and revenue contribution"]
      - [Gross margin, null, Unavailable, "Determines scalability and valuation support", "Provide audited gross margin by product and deployment"]
      - ["Cash, burn, and runway", null, Unavailable, "Determines financing dependency", "Provide latest cash, monthly burn, runway, and next-round trigger"]
      - [CAC and payback, null, Unavailable, "Tests whether growth is economically repeatable", "Provide fully loaded CAC, sales cycle, and payback by segment"]
      - [Customer concentration, null, Unavailable, "Large contracts can increase downside concentration", "Provide top-10 ARR share, renewal dates, and exposure by vertical"]
    notes: "Public company disclosures provide growth proxies but not audited unit economics; null means the assigned successful sources did not disclose the metric and a specific diligence request is required."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI016]
