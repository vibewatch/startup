          label: "Enterprise demand for federated analytics and AI"
        - id: galaxy
          label: "Starburst Galaxy: managed usage and cloud adoption"
        - id: enterprise
          label: "Starburst Enterprise: software, support, and services"
        - id: contracts
          label: "Recurring contracts and large multi-year deals"
        - id: revenue
          label: "Recognized revenue (not publicly disclosed)"
        - id: gross-profit
          label: "Gross profit (not publicly disclosed)"
      edges:
        - [demand, galaxy]
        - [demand, enterprise]
        - [galaxy, contracts]
        - [enterprise, contracts]
        - [contracts, revenue]
        - [revenue, gross-profit]
    approximationNotes: "The bridge shows the disclosed commercial mechanism, not a quantitative reconciliation; revenue recognition and gross-profit conversion are unavailable in the assigned evidence."
    claimRefs: [CI001, CI002, CI003, CI008, CI016]
callouts:
  - calloutType: strength
    title: Enterprise monetization signal
    body: "Starburst reports ARR per customer above $325,000, a record multi-year eight-figure-per-year contract, and customers including ten of the top fifteen global banks."
    claimRefs: [CI003, CI005, CI006]
  - calloutType: risk
    title: Capital adequacy is not public
    body: "Cash, burn, runway, gross margin, debt, retention cohorts, and customer concentration remain unreported in the assigned evidence, so financing dependency cannot be assessed."
    claimRefs: [CI012, CI016]
  - calloutType: recommendation
    title: Underwrite the bridge before upgrading
    body: "Request ARR-to-revenue reconciliation, cohort retention, realized pricing, product-level gross margin, and a current cash-and-burn schedule before relying on the reported growth rates."
    claimRefs: [CI002, CI009, CI012, CI016]
