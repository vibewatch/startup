companyProfile:
  summary: >-
    Starburst Data is a Boston-based private software company founded in 2017 that commercializes the open-source Trino
    query engine through Starburst Galaxy and Starburst Enterprise. Its value proposition is governed access to
    distributed data across cloud, on-premises, and hybrid environments without requiring data movement.
  founders:
    - name: Justin Borgman
      role: Co-founder and CEO
      background: Co-founded Hadapt and later led Teradata's Hadoop portfolio.
      claimRefs:
        - CO005
  foundingLocation: Boston, Massachusetts, USA
  headquarters: Boston, Massachusetts, USA
  productSummary: >-
    Managed and self-hosted data-access platforms built around Trino for federated SQL querying, governance, connectors,
    and enterprise deployment.
  customerFocus: Enterprise data, analytics, AI, and governance teams, especially in regulated and data-intensive organizations.
  businessModel: Enterprise software, support, and managed-cloud consumption across Starburst Galaxy and Starburst Enterprise.
  stage: Series D
