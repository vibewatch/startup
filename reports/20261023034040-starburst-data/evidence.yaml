evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, capitalization table, voting-rights summary, investor-rights schedule, and executive
      succession plan.
    whyItMatters: >-
      Private-company control and key-person dependence cannot be assessed from leadership biographies or round
      summaries.
    diligencePath: Request the current cap table, charter, investor-rights agreements, board minutes, and succession materials.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated payroll- or HRIS-based employee count with contractor and geography definitions.
    whyItMatters: The 507 and 537 estimates create uncertainty in scale, hiring, and productivity analysis.
    diligencePath: Obtain a monthly headcount bridge by function, geography, employee status, hires, and departures.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue and support for ARR, retention, AI run rate, gross margin, cash, burn, debt, customer count, and
      concentration.
    whyItMatters: >-
      Attributed recurring-revenue metrics do not establish accounting revenue, profitability, liquidity, or revenue
      quality.
    diligencePath: >-
      Request audited statements, monthly recurring-revenue cohorts, cash and debt schedules, and top-customer
      concentration.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      A complete dated record of financing, leadership changes, partnerships, regulatory matters, outages, litigation,
      and security incidents.
    whyItMatters: The assigned pool supports selected milestones but cannot prove that no material adverse event occurred.
    diligencePath: >-
      Reconcile company announcements, investor records, court and regulator databases, status history, and incident
      disclosures.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A current Starburst-specific SAM and SOM model segmented by deployment, geography, and buyer.
    whyItMatters: Category growth does not establish the revenue pool Starburst can serve or capture.
    diligencePath: >-
      Request management's market model, pipeline coverage, win rates, ACV distribution, and segment-level
      serviceable-market assumptions.
    relatedQuestionRefs:
      - QM004
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: Observed budget ownership, sales-cycle duration, conversion, expansion, and payback by customer segment.
    whyItMatters: Public product positioning cannot verify repeatable adoption economics or valuation durability.
    diligencePath: >-
      Obtain anonymized cohort, pipeline, implementation-hours, renewal, and expansion data by Galaxy and Enterprise
      segment.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: A second numeric market estimate with comparable scope and methodology to the Mordor estimate.
    whyItMatters: The retained lakehouse report provides segmentation but no comparable value in fetched text.
    diligencePath: >-
      Retrieve the full methodology and value tables from the lakehouse report or commission a scope-matched market
      study.
    relatedQuestionRefs:
      - QM002
      - QM003
  - type: missing-source
    severity: material
    topic: competitive-scale
    missingEvidence: >-
      Comparable independent market share, customer counts, win-loss data, and current funding or valuation for
      Starburst and its direct peers.
    whyItMatters: The available comparisons describe product fit but cannot establish relative commercial scale or pricing power.
    diligencePath: >-
      Request a current competitive win-loss report, named-customer cohort data, and peer contract benchmarks from
      management or customers.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Representative production workloads and realized annual contract values across Starburst, Dremio, Snowflake, and
      Databricks.
    whyItMatters: List prices use different units and do not show total cost, discounts, support, or migration costs.
    diligencePath: >-
      Run matched workload tests and collect anonymized production invoices, including compute, storage, egress,
      support, and implementation costs.
    relatedQuestionRefs:
      - QP005
      - QP007
  - type: missing-source
    severity: minor
    topic: distribution
    missingEvidence: >-
      Independent evidence on channel contribution, partner access, renewal rates, and multi-homing among enterprise
      buyers.
    whyItMatters: Product capability alone does not establish durable distribution or switching friction.
    diligencePath: >-
      Interview channel partners and reference customers about implementation ownership, renewal triggers, and
      concurrent use of competing platforms.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt, covenants, and financing plan.
    whyItMatters: >-
      A private company can show ARR growth while still requiring frequent financing; without cash and burn, downside
      duration cannot be underwritten.
    diligencePath: >-
      Request the latest management accounts, cash reconciliation, 24-month forecast, debt schedule, and next-round
      trigger from management.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross retention, net retention, churn, CAC, payback, sales cycle, and customer concentration by product.
    whyItMatters: >-
      The disclosed growth rates and ARR-per-customer figure do not show whether growth is durable or economically
      efficient.
    diligencePath: >-
      Request cohort-level ARR and logo waterfalls, fully loaded CAC/payback, renewal calendar, and top-customer ARR
      concentration.
    relatedQuestionRefs:
      - QI003
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: regulatory-risk
    missingEvidence: >-
      Customer-specific evidence on whether data-sovereignty concerns affect Galaxy deployments, pricing, or sales
      cycles.
    whyItMatters: >-
      An adverse sovereignty assessment may indicate a qualification or delivery cost in regulated sectors, but public
      evidence does not quantify commercial impact.
    diligencePath: >-
      Review regulated-customer win/loss notes, security questionnaires, deployment mix, and any concessions required
      for EU or critical-infrastructure accounts.
    relatedQuestionRefs:
      - QI006
  - type: enumeration-incomplete
    severity: material
    topic: revenue-streams-table
    missingEvidence: Complete product, services, support, and partner revenue mix with recognition timing.
    whyItMatters: >-
      A high services or implementation mix would change margin and predictability relative to recurring software
      revenue.
    diligencePath: Request audited revenue disaggregation, deferred-revenue roll-forward, and product-versus-services gross margin.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: performance
    missingEvidence: >-
      Reproducible independent benchmarks comparing Starburst Enterprise with open-source Trino across representative
      connectors and workloads.
    whyItMatters: >-
      Company and sponsored performance statements cannot be translated into customer value without workload, baseline,
      cluster-size, and cost context.
    diligencePath: >-
      Request benchmark reports, query suites, connector versions, infrastructure configurations, and reproducible
      customer references.
    relatedQuestionRefs:
      - QE004
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      Current security certifications, penetration-test results, incident history, service objectives, and recovery-test
      evidence for Galaxy and Enterprise.
    whyItMatters: >-
      Described controls do not establish certification, operating effectiveness, recovery performance, or absence of
      prior incidents.
    diligencePath: >-
      Obtain the current trust package and incident record, then review them with security, privacy, and compliance
      specialists.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: implementation
    missingEvidence: >-
      Independent customer evidence quantifying deployment time, staffing, connector limitations, and total cost versus
      self-managed Trino.
    whyItMatters: >-
      The commercial premium depends on lowering operational burden enough to offset licensing, integration, and
      infrastructure costs.
    diligencePath: >-
      Interview at least three production customers and request implementation plans, staffing records, connector
      exceptions, and realized cost data.
    relatedQuestionRefs:
      - QE005
      - QE006
      - QE007
  - type: missing-source
    severity: minor
    topic: product-launch
    missingEvidence: >-
      Versioned general-availability documentation and production references for the AI Agent, AI Workflows, automated
      tagging, and routing capabilities.
    whyItMatters: Announcement coverage establishes direction but not production maturity, reliability, or adoption.
    diligencePath: Review current release notes, product documentation, roadmap status, and production reference deployments.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: A current cohort schedule with active accounts, GRR, NRR, churn, renewal timing, and expansion revenue.
    whyItMatters: >-
      Deployment proof does not show whether customers renew or expand, which is central to recurring-revenue
      durability.
    diligencePath: >-
      Request a monthly cohort bridge for the last eight quarters, reconciled to revenue and separating new, renewed,
      expanded, contracted, and churned accounts.
    relatedQuestionRefs:
      - QU002
      - QU004
      - QU005
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer
    missingEvidence: >-
      A customer register identifying named production deployments, pilots, locations, workloads, and implementation
      status.
    whyItMatters: One named account and anonymized examples cannot establish customer breadth or concentration.
    diligencePath: >-
      Obtain a referenceable customer list with permission status, deployment stage, ARR band, renewal date, and primary
      use case.
    relatedQuestionRefs:
      - QU003
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue concentration and channel or partner dependence.
    whyItMatters: >-
      A few large regulated-enterprise accounts or implementation partners could make reported adoption less durable
      than it appears.
    diligencePath: Request ARR concentration by top 1, 5, and 10 customers and partner-sourced bookings for the last eight quarters.
    relatedQuestionRefs:
      - QU006
      - QU007
  - type: stale
    severity: minor
    topic: review-evidence
    missingEvidence: A larger, current, independently verifiable review sample tied to customer tenure and deployment scale.
    whyItMatters: Review ratings are positive but small or aggregated, and they do not substitute for renewal data.
    diligencePath: >-
      Validate recent references directly with customers and reconcile review identities to active production accounts
      where permitted.
    relatedQuestionRefs:
      - QU005
      - QU009
  - type: missing-source
    severity: material
    topic: assurance
    missingEvidence: Current independent certification scope, control-test results, and customer security-assurance commitments.
    whyItMatters: Regulated-industry positioning makes assurance quality central to both adoption and downside exposure.
    diligencePath: >-
      Request current SOC 2 or ISO reports, bridge letters, DPA, subprocessor list, and representative customer security
      questionnaires.
    relatedQuestionRefs:
      - QR002
