company:
  name: Starburst Data
chapter:
  number: 8
  title: Valuation
  summary: "Starburst's last publicly reported financing implied a $3.35 billion valuation, but the evidence base is historical and private-company disclosures remain incomplete. The defensible stance is research-more: product and strategic traction are credible, while current price, retention, margins, cash, and the 2025 Citi investment structure are not publicly verifiable."
sections:
  - id: investment-case
    title: Investment case and price discipline
    body: >-
      Starburst has a credible enterprise data-infrastructure proposition: it commercializes Trino-based
      federated querying, sells both managed and self-managed offerings, and positions governance and data
      residency as buying criteria for regulated customers. Independent coverage reported a $250 million Series D
      in February 2022 that brought the company to a $3.35 billion valuation and $414 million of cumulative
      financing, while the same reporting described nearly three-times revenue growth in 2021. Those facts support
      a real scale and financing signal, not a current valuation mark. The 2025 SiliconANGLE report adds a strategic
      Citi investment and says Citi uses Starburst across 165 countries, but gives no investment amount or price.
      Public evidence therefore supports a quality-positive, price-conditional thesis rather than a buy decision.
      Entry discipline should require a current cap table, preferred terms, latest financing price, ARR bridge,
      gross margin, net retention, cash, debt, and burn. Without those inputs, a precise private-company multiple
      or target return would be false precision.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparable evidence
    body: >-
      The upside thesis is that Starburst can monetize a durable need to query distributed and sensitive data
      without centralizing it, then expand from query federation into governed data products and AI workflows.
      Sources describe more than 50 connectors, enterprise controls, and a product surface spanning Galaxy and
      Enterprise; these are differentiation signals, but most are company or ecosystem descriptions rather than
      audited financial proof. The anti-thesis is that open-source Trino limits switching costs, cloud data
      platforms and adjacent vendors can compress pricing, and the company may need sustained sales and engineering
      investment to turn a broad platform into durable recurring economics. A 2026 Enterprise Strategy Group
      validation commissioned by Starburst modeled 45% lower three-year total cost of ownership and a 414% return
      on investment for a hypothetical customer, but that sponsored model is not evidence of Starburst's own
      margins or valuation. The only directly refreshed public-market
      reference in the assigned pool is Snowflake, whose October 2026 market capitalization was reported at $110.76
      billion; that is a scale and public-liquidity benchmark, not a like-for-like private valuation multiple.
      The comparable set is consequently directional and cannot justify marking Starburst above or below $3.35
      billion without current Starburst revenue and margin data.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-decision
    title: Scenarios, exit readiness, and diligence gates
    body: >-
      A scenario framework is more reliable than a point estimate. In the bull case, Starburst converts its
      distributed-data and regulated-AI positioning into sustained expansion, with retention and margins strong
      enough to support a premium software multiple. In the base case, it remains a valuable but execution-sensitive
      private platform whose fair entry price depends on verified ARR quality and dilution terms. In the bear case,
      cloud competition, open-source substitution, slower AI monetization, or a down round compresses value and
      lengthens the exit window. These are conditional investment signals, not probability-weighted forecasts, because
      public sources do not disclose current ARR mix, GRR, churn, customer concentration, profitability, cash, debt,
      or the Citi transaction structure. Exit readiness is therefore unproven: historical reporting mentioned an IPO
      ambition, but no current filing or liquidity timetable is evidenced here. The decision should move toward buy
      only after price and operating evidence close the listed gaps; otherwise track or research-more is the
      appropriate protection against private-market information asymmetry.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Evidence, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Do not underwrite a buy without current price and operating evidence"]
      - [Confidence, "Medium", "Historical financing and product evidence are credible; current private metrics are incomplete"]
      - [Risk rating, "Medium", "Execution, competition, dilution, and liquidity risks remain material"]
      - [Valuation stance, "Fair / unverified", "The $3.35B mark is historical; current fair value cannot be established"]
    notes: "Assessment synthesized from assigned sources; the valuation stance is not a current appraisal and unavailable private metrics are not treated as zero."
    claimRefs: [CV001, CV003, CV012, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Distributed-data platform demand", "Federated querying and data products address data spread across clouds and on-premises systems", "Evidence of weak adoption, poor performance, or material customer churn"]
      - ["Regulated-enterprise wedge", "Citi use across 165 countries and residency/governance positioning", "A disclosed concentration problem, failed deployment, or regulatory blocker"]
      - ["Platform expansion", "Galaxy, Enterprise, data products, and AI workflow capabilities", "No measurable attach, expansion, or margin contribution from newer products"]
      - ["Open-source and cloud substitution", "Trino foundation and adjacent public data-platform competition", "Proof of durable switching costs, differentiated retention, and pricing power"]
    notes: "Arguments combine company-described capabilities with independent reporting; they are directional and do not establish market share or unit economics."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Operating assumptions, Valuation / return logic, Key risks and trigger]
    rows:
      - [Bull, "ARR grows with AI and regulated-enterprise expansion; retention and margins are strong", "Premium software valuation could support attractive returns from a disciplined entry price", "Trigger: verified expansion, margin, and financing evidence"]
      - [Base, "Core federation remains valuable but product mix, retention, and cash efficiency are mixed", "Fair value requires a price anchored to verified ARR quality and dilution terms", "Trigger: current cap table, ARR bridge, GRR/NRR, and cash review"]
      - [Bear, "Cloud alternatives, Trino substitution, or slower commercialization weaken growth", "Multiple compression or a down round creates dilution and poor returns", "Trigger: churn, concentration, burn, or financing stress"]
      - [Decision gate, "Current public evidence is insufficient for a probability-weighted point estimate", "Research-more / track until missing price and operating inputs are obtained", "Break: inability to verify transaction terms or sustainable economics"]
    notes: "Scenarios are conditional decision cases, not forecasts; no probabilities or precise valuation ranges are assigned because current ARR, margins, cash, and transaction terms are undisclosed."
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
