company:
  name: Starburst Data
chapter:
  number: 7
  title: Risks
  summary: Starburst's principal risks arise from operating a distributed query platform across sensitive enterprise data, where deployment complexity, connector and dependency behavior, and security or governance failures can impair adoption. Public evidence supports a medium residual-risk view, but current incident, concentration, financial-resilience, and contract evidence remains incomplete.
sections:
  - id: legal-regulatory
    title: Legal, regulatory, and governance exposure
    body: "Starburst markets deployments for financial services, healthcare, insurance, and government, including air-gapped and data-residency-sensitive environments. That positioning raises the consequence of access-control, masking, audit-log, and data-sovereignty failures even where no public enforcement event was found in the assigned evidence. Its own Enterprise page describes row- and column-level controls, encryption, third-party integrations, and audit logging, while independent material describes governance and compliance as product benefits rather than as an audit result. The investment implication is conditional: regulated-market differentiation is valuable only if controls, certifications, incident response, and customer contractual obligations can be verified in diligence."
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, quality, and security risks
    body: "The platform's architecture distributes work across coordinators, workers, connectors, catalogs, and remote data systems. This creates multiple failure surfaces: query planning, connector behavior, source availability, resource sizing, permissions, upgrades, and performance under concurrency. A current job posting describes production support, migration troubleshooting, platform health, query failures, performance tuning, and incident root-cause analysis as required operating work. Independent review evidence also flags resource consumption, complex setup, slow complex queries, and decentralized permissions as user-reported or analyst-identified limitations. These signals do not prove an incident, but they support a material execution risk and make uptime, query-error, recovery-time, and security-incident metrics important kill criteria."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-and-financial-resilience
    title: Partner, platform, and financial-model dependencies
    body: "Starburst depends on the Trino open-source engine, a broad connector ecosystem, cloud and on-premises infrastructure, and customer teams capable of administering distributed data systems. PeerSpot's comparison says Starburst can require more technical knowledge to deploy, while the company's own material emphasizes more than 50 connectors and operation across multiple environments. That combination creates both differentiation and support burden: connector compatibility, upstream vulnerabilities, cloud capacity, and customer skills can affect time to value. Public evidence in this pool does not establish cash runway, burn, margin, debt, customer concentration, or the structure of the Citi investment, so financial resilience and partner concentration remain unresolved rather than assumed safe."
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["Data-residency or access-control failure in regulated workloads", "medium", "high", "Documented product controls; external assurance not verified", "high", "Obtain current SOC 2/ISO scope and sample customer DPA/control evidence"]
      - ["Privacy or governance control gap across connected sources", "medium", "high", "RBAC/ABAC, masking, encryption, and audit features are described", "medium-high", "Test policy inheritance and auditability across representative connectors"]
      - ["Unverified litigation, enforcement, or IP posture", "unknown", "high", "No current legal record was identified in the assigned pool", "high", "Obtain counsel letter, litigation schedule, and IP ownership/indemnity terms"]
    notes: "Rows synthesize assigned official, independent, and adverse sources; likelihood and residual exposure are diligence judgments, not disclosed company probabilities."
    enumerationScope:
      coverage: partial
      basis: "Public assigned sources covering product controls and risk posture, not a complete legal or regulatory docket."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Connector or source-system incompatibility", "medium", "high", "50+ connectors and migration support are described", "medium-high", "Current connector defect and compatibility rates"]
      - ["Query performance or resource overrun", "medium", "high", "Caching, pushdown, autoscaling, and tuning are described", "medium", "Production p95 latency, error, and cost distributions"]
      - ["Complex deployment and permissions administration", "high", "medium-high", "Enterprise support and access-control integrations are described", "medium-high", "Customer implementation effort and permission failure rates"]
      - ["Security incident or upstream vulnerability", "unknown", "high", "Security controls and monitoring are described; incident history is not established", "high", "Obtain incident register and current Trino exposure assessment"]
    notes: "Independent review and job-posting evidence identify operational failure modes; absence of a recorded incident is not proof that none occurred."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Open-source query engine", "Trino community and maintainers", "Upstream vulnerability or incompatible change", "high", "Starburst adds support and enterprise features", "medium-high"]
      - ["Cloud, on-premises, and hybrid infrastructure", "Customer and infrastructure providers", "Capacity, residency, or availability constraint", "high", "Multi-environment and air-gapped deployment options", "medium"]
      - ["Connector ecosystem", "Source-system vendors and connector maintainers", "Connector regression or source API change", "high", "Broad connector coverage and supported integrations", "medium-high"]
      - ["Customer platform skills", "Customer data and infrastructure teams", "Slow deployment or poor adoption", "medium-high", "Professional services and enterprise support", "medium"]
    notes: "Dependency rows distinguish product capability claims from the operational evidence needed to validate resilience and concentration."
    claimRefs: [CR010, CR011, CR012, CR013]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: "The highest residual exposure is concentrated where regulated data, distributed dependencies, and incomplete public assurance overlap."
    data:
      columns: [Low, Medium, High, Unknown]
      rows:
        - label: Regulated-data control failure
          values: [0, 1, 2, 0]
        - label: Connector or source outage
          values: [0, 1, 2, 0]
        - label: Complex deployment and permissions
          values: [0, 2, 1, 0]
        - label: Security incident or upstream vulnerability
          values: [0, 0, 2, 1]
        - label: Financial or concentration shock
          values: [0, 0, 2, 1]
        - label: Legal or IP exposure
          values: [0, 0, 2, 1]
    claimRefs: [CR001, CR005, CR008, CR013]
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: "Treat a material security incident, repeated high-severity connector outage, inability to demonstrate regulated-data controls, or implementation economics that prevent expansion as thesis-break signals. Financial diligence should also escalate if current burn, runway, debt, or customer concentration is materially weaker than management disclosure."
    claimRefs: [CR003, CR007, CR008, CR013]
  - calloutType: assumption
    title: Evidence boundary
    body: "The assigned public pool does not establish a complete litigation, incident, customer-concentration, or financial-resilience record. Those items remain diligence gaps rather than negative findings or assurances."
    claimRefs: [CR004, CR008, CR013]
