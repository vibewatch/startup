      does not infer conversion, share, or value-proportional widths.
    claimRefs: [CM004, CM005, CM006, CM007, CM014]
callouts:
  - calloutType: insight
    title: Category growth is credible, company capture is not yet measurable
    body: >-
      The retained evidence supports a growing data-virtualization category and
      a coherent Starburst use case, but not a defensible company-specific
      market share or SOM.
    claimRefs: [CM004, CM007, CM014]
  - calloutType: risk
    title: Adoption can be slowed by operational complexity
    body: >-
      Governance, scarce tuning skills, resource consumption, and complex-query
      performance are material constraints that can lengthen deployments or
      increase total cost.
    claimRefs: [CM012, CM013]
