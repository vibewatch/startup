artifact: market-analysis
slug: starburst-data
runDate: 2026-10-23
company:
  name: Starburst Data
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Starburst operates in the data-virtualization and open lakehouse-querying
    boundary, where buyers value access to distributed data without migration.
    Public evidence supports a growing market and clear enterprise use cases,
    but does not isolate Starburst's serviceable market or share.
sections:
  - id: market-boundary
    title: Market boundary and economic job
    body: >-
      The relevant market is enterprise software and services that query,
      govern, optimize, or expose data across distributed databases, object
      stores, warehouses, and lakehouse tables without requiring wholesale
      centralization. The boundary includes Starburst Enterprise, Starburst
      Galaxy, connectors, governance, workload management, data products, and
      related implementation or managed-service spend. It excludes general
      storage capacity, standalone BI seats, generic ETL unrelated to
      federated access, and all of a cloud warehouse's consumption spend when
      that spend is not substituting for distributed access. Trino documentation
      describes the underlying category as a query engine rather than a
      database system, while independent comparison evidence frames Starburst
      as a lakehouse/federation platform rather than a conventional warehouse.
      This boundary matters because the buyer is paying to reduce data movement,
      integration friction, governance duplication, or migration risk, not
      simply to purchase more storage.
    claimRefs: [CM001, CM002, CM003, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and limits
    body: >-
      The strongest quantified lens is the global data-virtualization market:
      Mordor Intelligence estimates USD 6.25 billion in 2025, USD 7.46 billion
      in 2026, and USD 18.09 billion by 2031, implying a 19.38% 2026–2031 CAGR.
      Its segmentation provides useful demand shape—cloud represented 69.85% of
      2025 revenue, large enterprises 58.25%, and BFSI 31.12%—but these are
      slices of the same market, not additive TAM, SAM, or SOM layers. A second
      data-lakehouse report identifies the relevant deployment and buyer
      segments but does not expose a usable value in the fetched text. Thus the
      chapter uses multiple lenses while marking Starburst-specific SAM, SOM,
      share, and obtainable annual spend as unresolved. The sizing pyramid is
      a directional evidence map, not a mathematically comparable funnel.
    claimRefs: [CM004, CM005, CM006, CM007, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, and payer map
    body: >-
      The buying center is shaped by where data resides and who bears the cost
      of movement, governance, or operational complexity. Platform and data
      engineering teams are the primary users and technical evaluators; CIO,
      CTO, CDO, security, risk, and compliance leaders can own budget when
      sovereignty or regulated-data requirements dominate. Analysts, BI teams,
      and increasingly AI application teams are downstream users. Adoption is
      most credible where an enterprise has multiple clouds or legacy systems,
      cannot freely move sensitive data, or needs one governed access layer.
      Starburst's public product surfaces emphasize self-managed deployment for
      on-premises and hybrid estates, and an independent technical review says
      those deployments require infrastructure, networking, security, and
      governance expertise. SiliconANGLE also reports a Citi use case across
      165 countries. These signals support an enterprise land motion, but they
      do not establish contract size, conversion rates, or repeatable payback.
    claimRefs: [CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Demand drivers are AI workloads, real-time analytics in regulated
      industries, data-mesh or logical-fabric architectures, and pressure to
      limit duplication and egress. Mordor's report identifies each as a market
      driver and separately flags governance failures, scarce optimization
      skills, egress fees, and fragmented sovereignty rules as restraints.
      Product evidence also indicates a switching-cost trade: federation can
      avoid migration, but deployment, query tuning, security integration, and
      resource management still require scarce expertise. Mordor reports that
      90% of organizations experience critical talent gaps that add three to
      ten months to digital projects, and an independent technical review
      distinguishes Galaxy's lower operating burden from Enterprise's
      infrastructure, networking, security, and governance requirements.
      Accordingly, valuation relevance depends on proving durable expansion
      within regulated and distributed estates while validating implementation
      burden, gross margin, usage economics, and whether customers consolidate
      onto a competing warehouse or retain multi-platform architectures.
    claimRefs: [CM011, CM012, CM013, CM014]
    tableRefs: []
tables:
  - id: TM001
    title: Market definition and substitution boundary
    columns: [Segment or category, Included spend, Excluded spend, Buyer or payer, Relevance]
    rows:
      - [Federated query and data virtualization, "Query and governance software across distributed sources", "Standalone storage capacity", "Data platform or engineering", "Core Starburst job"]
      - [Enterprise lakehouse access, "Connectors, query optimization, security, lineage, data products", "Unrelated BI-seat spend", "CIO/CDO/platform budget", "Primary enterprise expansion surface"]
      - [Managed federation, "Galaxy-style managed query and operations", "Generic cloud infrastructure outside the service", "Cloud data or analytics team", "Lowers operational barrier"]
      - [Implementation and optimization services, "Deployment, connector, governance, and tuning work", "General consulting unrelated to federation", "Platform transformation budget", "May accelerate adoption but is not recurring software ARR"]
      - [Cloud data warehouse, "Only spend displaced or complemented by federated access", "Warehouse storage and compute not tied to federation", "Data and analytics platform", "Substitute or connected source, not the core category"]
      - [Open-source Trino or internal build, "Engineering, operations, and support for self-managed federation", "Unrelated application engineering", "Platform engineering", "Status-quo substitute for commercial packaging"]
    notes: >-
      Boundary is an analytical classification, not a reported market total.
      Categories overlap in buyer workflow; excluded items are not asserted to
      be economically unrelated, only outside this chapter's attributable spend.
    claimRefs: [CM001, CM002, CM003, CM016]
  - id: TM002
    title: Sizing lenses and disclosed limitations
    columns: [Publisher, Year or period, Geography, Value, CAGR or share, Methodology, Confidence, Limitation]
    rows:
      - [Mordor Intelligence, "2025", Global, "USD 6.25B data virtualization market", "Cloud 69.85% of 2025 revenue", "Proprietary estimation framework", medium, "Category is broader than Starburst addressable spend"]
      - [Mordor Intelligence, "2026", Global, "USD 7.46B data virtualization market", "19.38% forecast CAGR for 2026-2031", "Proprietary estimation framework", medium, "Forecast is not company revenue or market share"]
      - [Mordor Intelligence, "2031 forecast", Global, "USD 18.09B data virtualization market", "19.38% 2026-2031 CAGR", "Forecast from reported market framework", medium, "Forecast uncertainty and category scope remain material"]
      - [Research and Markets, "2026 report", Global and regional, "Value not exposed in fetched text", "Segments include cloud, on-premises, hybrid, and multi-cloud", "Report outline and segmentation", low, "No usable numeric total in retained text"]
    notes: >-
      Values retain the publishers' market definitions and forecast status.
      Shares are not additive sizing layers. A company-specific SAM, SOM, and
      obtainable spend estimate remain an evidence gap.
    claimRefs: [CM004, CM005, CM006, CM007, CM015]
  - id: TM003
    title: Segment, buyer, payer, workflow, and adoption trigger
    columns: [Segment, Buyer, User, Payer, Workflow, Adoption trigger]
    rows:
      - [Regulated financial services, "CIO/CDO, risk, compliance", "Risk and analytics teams", "Enterprise data or risk budget", "Cross-border risk and fraud analysis", "Data sovereignty and lineage requirements"]
      - [Healthcare and government, "CISO, CIO, data platform", "Analysts and application teams", "Security, platform, or modernization budget", "Query sensitive distributed data", "On-premises or residency constraints"]
      - [Large multi-cloud enterprise, "CDO, platform engineering", "BI, data engineering, AI teams", "Data platform or cloud transformation", "Federated queries and governed data products", "Avoid migration and duplication"]
      - [SME or cloud-first team, "Head of data or engineering", "Analysts and developers", "Consumption analytics budget", "Managed query access to existing sources", "Lower operations burden and consumption entry"]
    notes: >-
      Segment assignments synthesize product documentation and market
      segmentation. The retained evidence does not disclose Starburst-specific
      contract conversion, budget ownership by segment, or payback periods.
    claimRefs: [CM008, CM009, CM010, CM011]
