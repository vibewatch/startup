  topStrengths:
    - National pharmacy reach across more than 35,000 participating locations.
    - Two-part model spanning consumer prescription access and enterprise BlinkRx commercialization.
    - Fresh late-stage capital from a credible Series D investor syndicate.
  topRisks:
    - Opaque financials, unit economics, and capitalization details prevent confident underwriting.
    - Regulatory pressure on prescription pricing and PBM dynamics could compress the model.
    - Operational friction in fulfillment, mail delivery, and specialty onboarding can hurt retention.
