callouts:
  - calloutType: "insight"
    title: "Strategic Pivot to Pharma-Sponsored Branded Access"
    body: "Blink Health's evolution from a consumer generic coupon aggregator to a 'pharma-to-patient cloud' with BlinkRx represents a critical shift toward enterprise life sciences budgets. By providing digital concierge onboarding for branded therapies, Blink captures recurring manufacturer service fees while insulating its business model from consumer discount aggregator price competition."
    claimRefs:
      - "CU001"
      - "CU003"
  - calloutType: "risk"
    title: "Opaque Retention and Unit Retention Metrics"
    body: "While Blink Health demonstrates broad historical reach with over 500,000 purchasing customers and 35,000 retail pharmacy partners, the lack of audited net revenue retention, active patient cohorts, and manufacturer concentration metrics presents a significant diligence hurdle for assessing commercial stability."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU016"
