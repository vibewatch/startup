callouts:
  - calloutType: "insight"
    title: "Architectural Shift from Generic Coupons to Manufacturer Concierge"
    body: "Blink Health's technological evolution reflects a strategic repositioning from generic retail discount vouchers toward BlinkRx's prescription lifecycle management cloud. By creating a digital concierge that directly connects pharmaceutical manufacturers with patients, Blink bypasses traditional pharmacy benefit manager friction and captures recurring software facilitation fees rather than relying solely on retail copay spreads."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
  - calloutType: "risk"
    title: "Operational Vulnerability at the Retail Counter and Mail Fulfillment Boundary"
    body: "Despite high software automation, Blink's customer satisfaction depends heavily on external physical handoffs. Trustpilot reviews reveal friction points including retail pharmacist unfamiliarity with digital voucher codes, complex patient onboarding navigation, and occasional mail delivery delays or packaging defects. Technical robustness cannot entirely insulate the platform from downstream retail pharmacy execution failures."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
