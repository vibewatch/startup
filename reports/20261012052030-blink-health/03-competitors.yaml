callouts:
  - calloutType: "insight"
    title: "Workflow Integration as Blink's Strategic Moat"
    body: "Unlike coupon aggregators that monetize transient web traffic at the pharmacy counter, Blink Health's expansion into BlinkRx creates structural lock-in. By embedding directly into physician electronic health record (EHR) workflows, BlinkRx resolves prior authorization and manufacturer co-pay assistance before the prescription reaches the pharmacy, converting an administrative bottleneck into a proprietary distribution channel."
    claimRefs:
      - CP006
      - CP007
  - calloutType: "risk"
    title: "Displacement Risks from Transparent Cost-Plus Models and PBM Headwinds"
    body: "Blink Health faces dual-sided structural pressure. On the low-cost commodity generic side, Mark Cuban Cost Plus Drug Company sets an aggressive transparent cost-plus pricing floor that limits spread monetization. Concurrently, pharmacy benefit managers (PBMs) and large retail pharmacy chains continue to resist third-party discount intermediaries, creating potential network contraction and regulatory margin compression."
    claimRefs:
      - CP014
      - CP015
