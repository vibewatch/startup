  topStrengths:
    - 覆盖超过 35,000 个参与网点的全国药房网络。
    - 双轮驱动模式：面向消费者的处方药获取服务，以及面向企业的 BlinkRx 商业化。
    - 由可信的 D 轮投资人联合体提供的新近后期资本。
  topRisks:
    - 财务、单位经济模型和资本结构细节不透明，无法有把握地评估收入质量。
    - 处方药定价监管压力和 PBM 变化可能压缩商业模型。
    - 履约、邮件配送和专科服务接入中的运营摩擦可能损害留存。
  unresolvedGaps:
