  - id: FV001
    title: Valuation Decision Chain and Recommendation Pathway
    type: flow
    summary: >-
      Sequential decision framework illustrating how commercial distribution scale and high-profile financing are
      counterbalanced by financial opacity and valuation inflation to yield a research-more recommendation.
    data:
      nodes:
        - id: scale-proof
          label: Scale & Distribution Proof
          summary: >-
            35K+ participating retail pharmacies and $128.8M-$140M Series D funding demonstrate commercial network
            footprint.
        - id: opaque-financials
          label: Opaque Financial Underwriting
          summary: >-
            Discrepancy in lifetime funding ($165M vs $308M vs $576M) and unverified $85.9M revenue without audited
            margins.
        - id: regulatory-risks
          label: Structural & Regulatory Risk
          summary: Scrutiny over drug price negotiation, PBM competition, and consumer fulfillment complaints.
        - id: valuation-overhang
          label: Stretched Valuation Multiple
          summary: Nov 2024 mark of ~$2.0B represents ~23.3x unverified revenue, pricing in aggressive enterprise success.
        - id: deliberation-hurdle
          label: Investment Decision Hurdle
          summary: Risk-reward profile fails buyout/growth equity hurdle without primary financial and cap table disclosures.
        - id: final-recommendation
          label: 'Recommendation: Research-More'
          summary: Maintain tracking stance; require audited trailing revenue, margin breakdown, and cap table waterfall.
      edges:
        - from: scale-proof
          to: opaque-financials
          label: Scale offset by opacity
        - from: opaque-financials
          to: regulatory-risks
          label: Compounded by policy risks
        - from: regulatory-risks
          to: valuation-overhang
          label: Incompatible with premium mark
        - from: valuation-overhang
          to: deliberation-hurdle
          label: Fails entry discipline
        - from: deliberation-hurdle
          to: final-recommendation
          label: Drives rating
    approximationNotes: >-
      Flow diagram maps qualitative analytical reasoning and decision hurdles from initial distribution evidence through
      risk factors to final recommendation.
