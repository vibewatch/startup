chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Architecture, and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              Blink Health was established in 2014 by co-founders Geoffrey Chaiken and Matthew Chaiken, establishing its
              corporate headquarters in New York, New York. The enterprise was formed to address systemic pricing
              opacity and high patient out-of-pocket prescription expenses across the United States healthcare
              ecosystem. Rather than functioning purely as a conventional pharmacy benefit manager or coupon aggregator,
              Blink Health engineered a multi-tiered commercial architecture spanning consumer-facing generic discounts
              and specialized enterprise life sciences commercialization services. The consumer product suite features
              Blink Quick Save, which provides transparent, discounted cash-pay pricing for generic medications across
              participating community pharmacies, and Blink Cash Express, a direct-to-patient mail-order dispensing
              service delivering maintenance medications to patients' homes. Concurrently, the company operates BlinkRx
              as an enterprise-grade Prescription Lifecycle Management Platform, assisting life sciences manufacturers
              with prior authorization triage, copay assistance optimization, and customized fulfillment workflows for
              branded therapies.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO009
              - CO013
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Talent Scaling
        blocks:
          - type: paragraph
            body: >-
              Blink Health continues to be directed by its founding leadership team, with Geoffrey Chaiken serving as
              Chief Executive Officer and Matthew Chaiken serving as President. This core executive partnership
              maintains functional oversight across corporate strategy, life sciences enterprise development, pharmacy
              partner relations, and capital allocation. Additional senior technology leadership documented at the
              organization includes Selvam Velmurugan as Chief Technology Officer, alongside commercial leadership from
              Michael Nameth, Executive Vice President of Cloud and Specialty Pharmacy. To reinforce its regulatory,
              public policy, and healthcare access initiatives, Blink Health expanded its governance and advisory
              network in February 2026 by appointing former Senator Joe Manchin and healthcare executive Heather Manchin
              as senior advisors. On the technical infrastructure front, BlinkRx announced the establishment of a
              dedicated engineering hub in the San Francisco Bay Area, aiming to attract specialized full-stack and
              artificial intelligence engineering talent to advance its proprietary pharma-to-patient cloud
              architecture.
