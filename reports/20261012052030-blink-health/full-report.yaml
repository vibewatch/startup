      - number: '1.3'
        title: Capitalization History, Funding Rounds, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              The capital formation trajectory of Blink Health reflects sustained backing from prominent venture
              capital, growth equity, and institutional investors. Prior to its late-stage financing, historical private
              reporting documented approximately USD 165 million in aggregate equity capital raised across seed and
              growth rounds. On November 15, 2024, Blink Health completed a significant USD 128.76 million Series D
              financing round, led by 1789 Capital and joined by institutional investors including Fidelity Investments,
              Cercano Management, Sweetwater Capital Partners, and long-standing venture partner 8VC. Earlier investment
              syndicates also included venture entities such as Burch Creative Capital and Sutter Rock Capital. While
              the successful execution of the Series D round provides substantial balance sheet runway for software
              engineering and commercial expansion, the company does not publicly disclose its post-money valuation,
              liquidation preferences, or class-level waterfall rights, leaving precise equity valuation marks subject
              to private confirmatory review.
