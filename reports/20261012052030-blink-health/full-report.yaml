      - number: '4.2'
        title: Unit Economics and Fulfillment Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Evaluating Blink Health's unit-level economics requires distinguishing top-line gross prescription value
              from net retained platform revenue. On consumer cash-pay transactions, the patient remits payment directly
              to Blink Health through its digital portal, after which Blink reimburses the dispensing retail pharmacy
              according to pre-negotiated contracted dispensing rates. The company's net transaction take-rate
              represents the spread remaining after dispensing fee reimbursement, credit card interchange, and network
              clearing costs. For branded prescriptions managed through BlinkRx, revenue is supplemented by
              pharmaceutical manufacturer service fees for patient fulfillment coordination. On the cost side, Blink
              incurs variable expenditures including pharmacy network reimbursement, courier shipping for mail delivery,
              digital customer service, and specialized pharmacist concierge support. Customer review records indicate
              that fulfillment friction, packaging complications, and perceived high out-of-pocket costs on certain
              specialty prescriptions remain acute customer retention risks that could elevate per-patient acquisition
              and support costs.
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI007
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
