callouts:
  - calloutType: "risk"
    title: "Opaque Unit Economics and Regulatory Exposure"
    body: "Blink Health operates in an intensely competitive prescription pricing market alongside legacy PBMs and discount coupon aggregators. Because the company does not disclose audited contribution margins, take-rates, or customer retention metrics, prospective capital allocators must evaluate whether its discount pricing reflects durable negotiated spreads or vulnerable retail pharmacy subsidies that could be compressed by regulatory reforms or pharmacy network renegotiations."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI007"
      - "CI014"
  - calloutType: "insight"
    title: "Strategic Transition toward Enterprise Life Sciences Contracts"
    body: "The evolution from pure consumer discount couponing toward the BlinkRx Prescription Lifecycle Management platform represents a material strategic shift toward enterprise pharmaceutical software. By monetizing manufacturer budgets for branded drug adherence and hub administration rather than solely relying on thin generic transaction spreads, Blink Health seeks higher-margin, recurring software and concierge service revenues that diversify its financial profile."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
      - "CI009"
