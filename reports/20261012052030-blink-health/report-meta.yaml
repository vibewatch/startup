companyProfile:
  summary: >-
    Blink Health is a privately held prescription-access platform founded in 2014 by Geoffrey and Matthew Chaiken. The
    company operates a consumer discount business through Blink Quick Save and Blink Cash Express alongside BlinkRx, an
    enterprise prescription lifecycle platform for life sciences manufacturers. Its commercial model spans pharmacy
    network spreads, manufacturer service fees, concierge routing, and mail-order fulfillment, with nationwide reach
    across more than 35,000 participating pharmacies.
  founders:
