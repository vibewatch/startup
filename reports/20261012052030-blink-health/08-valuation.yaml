callouts:
  - calloutType: "insight"
    title: "The Multiple Compression Trap in Private Digital Health"
    body: "Blink Health's reported ~$2.0B Series D valuation in late 2024 implies an enterprise revenue multiple exceeding 20x against estimated revenue benchmarks of $85.9M. In public markets, peers like GoodRx trade at compressed multiples (historically falling from ~20.9x at IPO), indicating substantial downside risk if private multiples re-rate toward public comparables."
    claimRefs:
      - "CV004"
      - "CV010"
  - calloutType: "recommendation"
    title: "Diligence Prerequisites Before Capital Commitment"
    body: "Institutional investors must demand audited GAAP financials, a verified cap table detailing Series D liquidation preferences, and product-line revenue segmentation between BlinkRx and cash-pay generic programs before committing growth capital."
    claimRefs:
      - "CV002"
      - "CV014"
      - "CV016"
