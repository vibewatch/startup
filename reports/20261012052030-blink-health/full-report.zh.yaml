  - id: FE001
    title: 产品架构图
    type: stack
    summary: 分层展示 Blink Health 的处方接入平台，从用户互动延伸至实体药房履约。
    approximationNotes: 架构分层综合工程披露、技术招聘要求和公开产品规格；内部专有中间件层为估算。
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE009
      - CE013
      - CE014
    data:
      layers:
        - label: 用户互动层
          detail: 消费者移动应用、网页门户和开方方接诊入接口
          modules:
            - iOS 与 Android 患者应用
            - 网页处方搜索门户
            - 开方方数字接诊接口
        - label: 专属服务与远程医疗层
          detail: BlinkRx 数字专属服务、患者沟通引擎和护理协调工具
          modules:
            - BlinkRx 数字专属服务消息
            - 自动 SMS / MMS 状态提醒
            - 远程医疗咨询路由
        - label: 核心业务逻辑层
          detail: 处方生命周期管理、定价规则和代金券生成
          modules:
            - 处方状态机引擎
            - 动态现金支付定价引擎
            - 制药商共付整合模块
        - label: 数据持久化与合规层
          detail: 加密数据层，执行严格的 ePHI 防护和访问日志记录
          modules:
            - PostgreSQL 与 MySQL 关系集群
            - ePHI HIPAA 审计日志服务
            - 安全令牌化支付金库
        - label: 整合与交换路由层
          detail: 连接药房交换网络和制药商系统的高性能 API
          modules:
            - 药房交换网络 EDI 协议网关
            - 35,000+ 家零售药房连接器 API
            - 生命科学数据交换接口
        - label: 实体履约层
          detail: 合作零售药房柜台取货网络和邮购配药
          modules:
            - 零售药房柜台 POS 清算
            - Blink Cash Express 邮购配药
            - 承运商运输与冷链跟踪
  - id: FU001
    title: 跨平台界面的客户旅程与接入架构
    type: journey-map
    summary: 覆盖端到端客户入门、处方定价核验和双路径履约，连接数字专属服务配送与零售药房取货。
    data:
      items:
        - label: 发现与接入
          persona: Cash-Pay Patient or Branded Prescribe
          touchpoints: BlinkRx digital concierge intake, mobile app search, or doctor referral
          sentiment: 'Positive: immediate transparent pricing visibility'
        - label: 福利与价格确认
          persona: Self-Pay or Insured Patient
          touchpoints: Automated co-pay assistance routing or generic cash discount selection
          sentiment: 'Positive: bypasses traditional PBM retail price inflation'
        - label: 履约路由
          persona: Consolidated Patient Base
          touchpoints: Blink Cash Express mail delivery or local pickup at 35,000+ pharmacies
          sentiment: 'Neutral: split between fast 48-hour delivery and retail counter pickup'
        - label: 依从与续配
          persona: Maintenance Medication Patient
          touchpoints: Automated scripted refill reminders and customer care coordination
          sentiment: 'Mixed: smooth renewals offset by occasional specialty verification hoops'
        - label: 生命科学分析
          persona: Pharmaceutical Manufacturer
          touchpoints: BlinkRx prescription lifecycle data reporting and commercial analytics
          sentiment: 'Positive: actionable visibility into patient therapy onboarding'
        - label: 平台再触达
          persona: Broad Consumer Base
          touchpoints: Recurring digital pharmacy orders and ongoing multi-medication savings
          sentiment: 'Neutral: retention exposed to alternative discount aggregator options'
    approximationNotes: 旅程阶段刻画定性的患者工作流和制药商生命周期触点，来源于公司平台文档和客户评价。
