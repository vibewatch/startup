            body: >-
              评估 Blink Health 的单位经济，需要区分处方总交易额与平台实际留存收入。在消费者现金支付交易中，患者通过数字门户直接向 Blink Health 付款，Blink
              再按预先谈定的合同发药费向零售药房偿付。公司的净交易抽成是在扣除发药费偿付、信用卡交换费和网络清算成本后剩余的价差。通过 BlinkRx 管理品牌处方时，患者履约协调服务费还会补充收入。成本方面，Blink
              承担药房网络偿付、邮寄配送的快递费、数字客服和专科药师专属支持等变动支出。客户评价显示，履约摩擦、包装问题，以及部分专科处方较高的感知自付成本，仍是严重的客户留存风险，可能推高每位患者的获客和支持成本。
