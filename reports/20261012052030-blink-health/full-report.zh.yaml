            body: >-
              Blink Health 与传统 PBM
              和折扣优惠券聚合平台共同处在竞争激烈的处方药定价市场。由于公司没有披露经审计的贡献利润率、抽成或客户留存指标，潜在资本配置者必须判断其折扣价格究竟来自可持续的协商价差，还是来自容易被监管改革或药房网络重新谈判压缩的脆弱补贴。
