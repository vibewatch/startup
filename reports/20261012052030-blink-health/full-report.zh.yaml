              - CP010
              - CP011
      - number: '3.3'
        title: 定价架构、合同模式与利润率结构
        blocks:
          - type: paragraph
            body: >-
              处方药可及性平台能否持续商业化，很大程度取决于药品制造商、药房和消费者之间谈定的交易模式和收费结构。GoodRx 主要通过 PBM 伙伴针对每张在收银台处理的优惠券支付的交易费变现，同时辅以订阅制 GoodRx
              Gold。相比之下，Blink Health 不向消费者收取平台会员费或订阅费，消费者可使用其 Everyday Low Price 仿制药目录。Blink 实际上充当金融中介：消费者在线按预先谈妥的 Blink
              Price 全额付款，随后 Blink 再向发药药房支付合同约定的发药费。截至 2025 年，可比数字药房平台的交易抽成通常为交易总额的 10% 至
              20%。这种预先结算模式让患者免受零售柜台价格波动影响；无保险现金价格在不同药房之间可能相差 200% 至 400%。不过，Mark Cuban Cost Plus Drug Company
              等透明模式参与者通过公开披露批发采购成本上固定 15% 的加成和固定 $3 发药费，形成激进的价格基准，压缩高交易量长期用药的中间商利润。
            claimRefs:
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
      - number: '3.4'
        title: 壁垒耐久性、监管暴露与替代威胁
        blocks:
          - type: paragraph
            body: >-
              尽管 BlinkRx 带来了技术差异化，且 Blink Health 在 2024 年末完成了 $128.76 million 的 D
              轮融资，公司护城河仍有持续的结构性弱点。平台依赖零售药房合作，因而容易遭遇渠道反弹；大型零售连锁和 PBM 过去针对折扣凭证经济模式发起的法律挑战就是例证。Blink
              要求消费者预付款，也增加了心理和运营切换成本：习惯在柜台无摩擦使用优惠券的消费者，必须先建立数字账户并付款，才能取药；不熟悉 Blink Card
              计费代码的药房柜台员工偶尔会因此感到困惑。宏观政策和监管政策都在推动改革 PBM 价差定价、提高政府主导的药品价格透明度，这可能把第三方折扣平台排除在外。如果立法改革限制自付费用或消除 PBM 价差套利，支撑
              Blink Health 仿制药折扣业务的经济价差可能大幅收窄，公司将更依赖制造商赞助的 BlinkRx 专科合同。
            claimRefs:
              - CP014
              - CP015
      - number: '3.5'
        title: 例证
        blocks:
          - type: callout
            title: 流程集成是 Blink 的战略壁垒
            body: >-
              与在药房柜台把短暂网络流量变现的优惠券聚合平台不同，Blink Health 向 BlinkRx 扩张后形成了结构性锁定。BlinkRx
              直接嵌入医生电子健康记录（EHR）流程，在处方抵达药房前处理事前授权和制造商共付援助，把行政瓶颈转化为专有分销渠道。
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: 透明成本加成模式与 PBM 逆风带来的替代风险
            body: >-
              Blink Health 面临双向结构性压力。在低成本、商品化仿制药一侧，Mark Cuban Cost Plus Drug Company
              设定了激进的透明成本加成价格下限，限制价差变现。同时，药品福利管理机构（PBM）和大型零售药房连锁持续抵制第三方折扣中介，可能造成网络收缩和监管导致的利润率压缩。
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Blink Health 通过三条运营渠道变现处方药可及性生态：BlinkRx、Blink Quick Save 和 Blink Cash Express。旗舰企业产品 BlinkRx
              是专门的处方生命周期管理云，把生命科学制药制造商直接连接到使用品牌药的患者。BlinkRx
              不完全依赖零售处方加价，而是通过数字专属客服接入、事前授权分流和共付援助基础设施，从制药商业化预算中获得收入。与此同时，Blink Quick Save 和 Blink Cash Express
              面向现金支付仿制药市场。Quick Save 让消费者以协商价格在线购买药品，再到超过 35,000 家零售网络门店取药；Cash Express 则将长期用药送货上门。由于 Blink
              直接与制药制造商谈判价格，而不是作为传统 PBM 运营，其毛利率高度取决于交易量价差和制造商枢纽管理费。
            claimRefs:
