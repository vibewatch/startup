callouts:
  - calloutType: "risk"
    title: "Structural Threat from Federal Prescription Pricing Reform"
    body: "Federal legislative proposals and regulatory scrutiny targeting prescription drug pricing represent a core structural risk for third-party discount negotiators. If direct pricing reforms eliminate pharmacy benefit manager spread models, Blink Health's price arbitrage advantages could be severely curtailed."
    claimRefs:
      - "CR005"
  - calloutType: "insight"
    title: "Technical Turnaround Anchors Proprietary Infrastructure"
    body: "Following early execution friction in prescription fulfillment, Blink Health pivoted to develop internal technology systems for claims processing and dispensing rather than relying on legacy vendor rails. While this reduces third-party technology dependency, it elevates ongoing information security and compliance maintenance requirements."
    claimRefs:
      - "CR006"
      - "CR009"
