evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-financials
    missingEvidence: >-
      Audited financial statements detailing 2024-2026 revenue, gross margins, cash burn rate, and current post-Series D
      valuation.
    whyItMatters: >-
      Without audited financial disclosures, fundamental underwriting of unit economics and enterprise valuation relies
      on unverified private estimates.
    diligencePath: >-
      Request confidential disclosure of audited income statements, cash flow statements, and 409A valuation reports
      directly from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-governance
    missingEvidence: Formal board of directors roster, independent director appointments, and committee assignments.
    whyItMatters: >-
      Governance depth and investor oversight cannot be fully verified without confirmation of board composition and
      voting control.
    diligencePath: Review certificate of incorporation and voting agreements during confirmatory legal diligence.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-ownership
    missingEvidence: Fully diluted capitalization table, class-by-class liquidation preferences, and secondary transaction records.
    whyItMatters: Economic waterfall and preferred return hurdles determine common equity value and dilution vulnerability.
    diligencePath: Obtain company capitalization ledger and series stock purchase agreements from lead investors.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      Audited financial disclosure of Blink Health's current annual gross merchandise value (GMV), net revenue
      take-rate, and active patient cohort counts across BlinkRx and Quick Save.
    whyItMatters: >-
      Without current transaction run-rate and unit economics, calculating Blink Health's definitive share of the
      outpatient cash-pay market is constrained to cumulative historical milestones.
    diligencePath: >-
      Review confidential company management presentation, audited GAAP income statements, and partner pharmacy
      transaction volume reports.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: minor
    topic: funding-reconciliation
    missingEvidence: >-
      Reconciliation of disparate third-party database records listing historical total funding at $165M versus the
      Series D financing round of $128.76M reported by Preqin.
    whyItMatters: >-
      Contradictory capitalization and funding totals impact assessments of corporate cash reserves and capital
      intensity required to scale pharmacy networks.
    diligencePath: >-
      Inspect company certificate of incorporation, series D preferred stock purchase agreements, and verified cap table
      filings.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pharmacy-contract-economics
    missingEvidence: >-
      Granular disclosure of negotiated dispensing fees, transaction take-rates, and contract termination terms between
      Blink Health and top pharmacy chains (e.g. Walmart, Albertsons).
    whyItMatters: >-
      Without primary pharmacy network contracts, it is impossible to evaluate gross margin sustainability if retail
      pharmacy chains seek higher dispensing reimbursement.
    diligencePath: Review master service agreements and pharmacy network contracts under NDA during management diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: competitor-market-share
    missingEvidence: >-
      Audited longitudinal prescription volume and GMV market share comparisons across Blink Health, GoodRx, and Amazon
      Pharmacy.
    whyItMatters: >-
      Third-party estimates show GoodRx with greater web traffic and brand recognition, but exact active prescription
      volume shares remain privately held.
    diligencePath: >-
      Acquire third-party syndicated claims data (e.g., IQVIA NPA or Symphony Health) tracking digital voucher and cash
      pharmacy redemptions.
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials-and-segment-margins
    missingEvidence: >-
      Audited GAAP income statements, balance sheets, and gross margin breakdowns by product line (BlinkRx, Quick Save,
      Cash Express) for fiscal years 2024 through 2026.
    whyItMatters: >-
      Without audited segment margins and take-rates, prospective investors cannot determine whether platform revenue is
      accretive or if fulfillment and pharmacy reimbursements compress contribution margin.
    diligencePath: >-
      Obtain CFO-certified GAAP financial packets and product-line contribution margin schedules under NDA during
      phase-two diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Current cash on hand, monthly net cash burn rate, debt facility obligations, and board-approved operational budget
      following the Series D round.
    whyItMatters: >-
      Determines whether the $128.8M Series D round provides self-sustaining runway to profitability or if rapid R&D and
      concierge scaling will require follow-on equity dilution.
    diligencePath: >-
      Request most recent board meeting financial slide decks, 24-month rolling cash forecasts, and debt covenant
      agreements.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: private-evidence-only
    severity: material
    topic: manufacturer-concentration-and-take-rate
    missingEvidence: >-
      BlinkRx pharmaceutical manufacturer contract schedules, customer concentration percentages, average take-rate per
      fill, and manufacturer contract renewal rates.
    whyItMatters: Assesses commercial durability and churn risk within the high-margin enterprise life sciences segment.
    diligencePath: >-
      Perform contract review of top ten pharmaceutical manufacturer agreements and audit historical gross profit
      retention by manufacturer account.
    relatedQuestionRefs:
      - QI001
      - QI008
  - type: missing-source
    severity: material
    topic: technical-telemetry
    missingEvidence: >-
      Publicly accessible latency benchmarks, real-time uptime status feeds, and disaster recovery recovery-point
      objectives (RPO/RTO) for Blink Health's pharmacy routing engine and telemedicine backend.
    whyItMatters: >-
      Without production SLA telemetry or independent uptime monitoring data, technical diligence cannot evaluate
      high-availability guarantees during pharmacy POS routing outages or surge demand periods.
    diligencePath: >-
      Request SOC 2 Type II compliance audit reports, historical incident logs, AWS architectural review diagrams, and
      vendor BAA audit documentation during data-room diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Audited patient cohort retention curves, repeat refill frequencies, annual churn rates, and net revenue retention
      across BlinkRx and generic cash-pay segments.
    whyItMatters: >-
      Without repeat customer retention and cohort data, long-term customer lifetime value and the durability of demand
      against competing discount platforms cannot be verified.
    diligencePath: >-
      Request anonymized cohort retention tables, monthly active user metrics, and repeat refill percentages from
      management during confidential due diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: manufacturer-concentration
    missingEvidence: >-
      List of named pharmaceutical brand sponsors, therapeutic area breakdown, and revenue concentration across top life
      sciences clients on BlinkRx.
    whyItMatters: >-
      BlinkRx's revenue stability depends heavily on manufacturer enterprise contracts, and high concentration in a few
      branded drugs creates severe renewal and patent-cliff exposure.
    diligencePath: >-
      Review life sciences enterprise contracts, master services agreements, and manufacturer customer concentration
      schedules in the virtual data room.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: pharmacy-partner-dispensing-volumes
    missingEvidence: >-
      Breakdown of prescription dispensing volume and revenue realization across major retail pharmacy chains versus
      independent pharmacies.
    whyItMatters: >-
      Discloses whether retail dispensing is heavily reliant on a single partner such as Walmart or distributed evenly
      across the 35,000-pharmacy network.
    diligencePath: Obtain channel fulfillment volume reports detailing dispensing counts by pharmacy banner.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited financial statements confirming Blink Health's 2025-2026 gross margins, operating burn rate, and net unit
      economics across BlinkRx and generic cash-pay channels.
    whyItMatters: >-
      Without audited financial metrics, investors cannot verify operating runway or determine whether medication
      discounts generate sustainable gross profits.
    diligencePath: >-
      Request board-approved GAAP financial statements, detailed contribution margin schedules by channel, and bank cash
      statements during confirmatory diligence.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Full comprehensive registry of state-by-state pharmacy board licenses, telepharmacy dispensing permits, and
      pending litigation dockets across all 50 states.
    whyItMatters: >-
      Partial enumeration focuses on primary federal pricing and HIPAA rules, leaving state-level regulatory enforcement
      and licensing compliance unverified across regional fulfillment nodes.
    diligencePath: >-
      Obtain an exhaustive state regulatory compliance matrix, certificate of good standing for all operating pharmacy
      subsidiaries, and litigation disclosure schedules.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: audited-financials-and-burn
    missingEvidence: >-
      Audited financial statements for 2024-2026 showing GAAP revenue, gross margin, net income, operating cash burn,
      and cash runway.
    whyItMatters: >-
      Without audited financial statements, the reported ~$2.0B valuation and $85.9M revenue estimate cannot be reliably
      verified, preventing institutional underwriting.
    diligencePath: Request audited financial statements and quarterly management accounts directly from Blink Health under NDA.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-liquidation-waterfall
    missingEvidence: >-
      Complete board-approved capitalization table and Series D preferred share terms, including liquidation preference
      multiples and participation rights.
    whyItMatters: >-
      A $140M Series D round in a difficult digital health funding environment may carry senior liquidation preferences
      that significantly impair junior and common equity returns in base or bear scenarios.
    diligencePath: Request certified capitalization table, certificate of incorporation, and investors' rights agreements.
