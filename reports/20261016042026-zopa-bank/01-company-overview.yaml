company:
  name: Zopa Bank
chapter:
  number: 1
  title: Company Overview
  summary: Zopa Bank is a 2005-founded UK fintech that converted its peer-to-peer heritage into a profitable regulated digital bank in 2020 and is now broadening from lending and savings into current accounts and investments. Late-2024 reporting supports a still-private unicorn valuation and fresh capital, but founder attribution, current headcount, exact cap-table economics, and early Biscuit traction remain under-disclosed.
sections:
- id: identity-and-product-scope
  title: Identity, product scope, and present scale
  body: 'Zopa positions itself as a UK-focused digital bank built on a much older peer-to-peer lending base. Official pages say the company was founded in 2005, launched Zopa Bank in June 2020, and now pairs savings, personal loans, credit cards, car finance, current accounts, and new investment products inside one app-led proposition. That mix matters because the business model is no longer a single lending product story: Biscuit expands everyday banking, while the 2025 investments launch extends toward wealth products. Scale evidence is directionally strong but not perfectly harmonized: current official copy says over 1.5 million people use Zopa, while late-2025 product-launch communications said 1.6 million customers and more than £6 billion of savings, and late-2024 press reporting used 1.3 million to 1.4 million customers with £5 billion of deposits.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO016
  tableRefs:
  - TO001
- id: leadership-governance-and-capital
  title: Leadership, governance, and capital base
  body: 'The public leadership picture is clearest around current spokespeople and formal Companies House filings rather than a fully surfaced founder roster. Jaidev Janardana is the recurring executive voice in financing coverage, while Chief Strategy Officer Merve Ferrero fronted the investments launch, indicating that strategy and product adjacency are concentrated in a small visible bench. Governance filings show meaningful turnover: Giles Andrews, Scott Jones, and Marina Troshina left director roles in late 2025; Max Ohrstrand joined at the same point; and Paula Walter plus Bruce Fletcher were appointed in September 2026. Capital records also show a December 2024 share allotment and March 2025 capital-reduction paperwork, which signals cap-table activity that outside reporting does not fully unpack. That makes management access important for board rights, preference terms, and any remaining founder influence after the 2025 board reshuffle.'
  claimRefs:
  - CO010
  - CO011
  - CO013
  - CO014
  - CO015
  tableRefs:
  - TO002
  - TO003
- id: funding-trajectory-and-milestones
  title: Funding trajectory, operating momentum, and open diligence points
  body: Independent reporting frames Zopa as a profitable but still execution-sensitive private unicorn. TechCrunch and Finovate both described the late-2024 round as a fresh equity raise led by A.P. Moller Holding, while Sifted added the sharper caution that revenue remains highly concentrated in lending and that the current-account rollout was still limited to roughly 10,000 users at the time of its reporting. The same independent sources also show IPO timing slipping from earlier ambition to a wait-for-better-markets posture. Combined with the 2025-2026 governance changes and a UK savings market where headline rates reached 5.00% to 8.00% AER in October 2026, the core diligence question is not whether Zopa has product momentum, but whether it can diversify revenue and deepen primary-banking usage without losing the credit discipline that drove profitability.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO009
  - CO010
  - CO011
  - CO012
  - CO014
  - CO016
  figureRefs:
  - FO001
