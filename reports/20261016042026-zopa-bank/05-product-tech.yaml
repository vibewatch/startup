          modules:
            - label: Biscuit current account
              note: Interest-bearing current account live by Mar 2026.
            - label: Savings and ISA tools
            - label: Borrowing and cards
          outputs:
            - label: Multi-product adoption
              value: "1 in 4 customers hold more than one product"
        - label: Product engines
          detail: Multiple consumer-bank products share one relationship rather than isolated single-product apps.
          modules:
            - label: Personal loans
            - label: Credit cards
            - label: Vehicle finance
            - label: Savings balances
        - label: Partner distribution
          detail: The platform is used for partner-distributed lending as well as direct digital acquisition.
          modules:
            - label: Octopus Energy loans
            - label: John Lewis loans
        - label: Data and decisioning
          detail: Product analytics and transaction-enrichment hiring imply active decisioning and measurement infrastructure.
          modules:
            - label: Product analytics
            - label: BI and analytics engineering
            - label: Transaction enrichment
        - label: Platform and delivery engineering
          detail: Public hiring shows dedicated platform, database, mobile, web, and cards engineering capacity.
          modules:
            - label: Database platform engineering
            - label: Android and iOS engineering
            - label: Web and cards engineering
        - label: Governance and customer protection
          detail: Risk, privacy, and complaints operations are visible, but external proof of certifications or uptime is not.
          modules:
            - label: Ops risk
            - label: Data privacy
            - label: Complaints operations
    approximationNotes: This is an evidence-backed operating model sketch, not a vendor-level system diagram.
    claimRefs: [CE003, CE004, CE006, CE007, CE008, CE009, CE012]
