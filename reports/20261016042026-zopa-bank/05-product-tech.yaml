  evidenceGaps:
    - type: missing-source
      severity: material
      topic: core-infrastructure
      missingEvidence: Named core banking, cloud, data, fraud, and observability vendors plus an up-to-date production architecture diagram.
      whyItMatters: Product breadth is visible, but the durability and scalability of the bank stack cannot be underwritten without vendor and systems detail.
      diligencePath: Request an architecture review with vendor inventory, uptime history, recovery objectives, and engineering ownership map.
    - type: private-evidence-only
      severity: material
      topic: current-account-adoption
      missingEvidence: Biscuit account activation, salary-in usage, average balances, interchange contribution, and primary-banking conversion metrics.
      whyItMatters: The current account is the bridge from multi-product utility to true primary-bank status, but public evidence stops at launch narrative and ambition.
      diligencePath: Request monthly cohort reporting for Biscuit accounts, including funded status, spend activity, direct debits, and cross-sell conversion.
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Public security certifications, privacy-control evidence, incident history, complaint-resolution KPIs, and model-governance documentation for AI features.
      whyItMatters: Regulated consumer banking requires control quality, not just product breadth, and the assigned public pool is thin on externally verifiable control outcomes.
      diligencePath: Request audit summaries, security certifications, complaints MI, and AI-governance policies before underwriting the control environment.
