              采用并非推测。Zopa 的 FY2023 申报显示客户数 1.1 million，客户同比增长 30%，年末 60.8% 的客户活跃使用应用；同一申报称 36%
              的客户再次借款，说明至少借贷业务并非一次性获客。2024 年末独立报道进一步将规模更新为约 1.3 million 名客户和超过 £5 billion 存款，表明 Zopa
              在成为银行并实现首个完整盈利年度后仍持续增加家庭客户。

              不过，公开点名的证明最强的是获客和分销触点，而不是企业客户参考账户。申报称 Smart Saver 客户通常借助利率表和聚合平台获客；TechCrunch 点名 John Lewis 和 Octopus
              Energy 是正在运行的嵌入式分销合作渠道。这证明 Zopa 能超越自己的应用和品牌触达客户，但每条渠道贡献多少规模、留存或利润仍不清楚。
