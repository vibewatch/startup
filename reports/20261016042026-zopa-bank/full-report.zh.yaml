  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Biscuit 成为有意义的主银行产品，Ask 提升参与度和交叉销售；在不牺牲信贷质量的前提下，利润规模超过 2024 年末的运行水平。
        - 只有在披露更新或出现新的独立价格信号后，高于 2024 年末独角兽估值的溢价才站得住。
        - 活期账户采用率令人失望，或 AI 驱动的服务增加了成本和治理负担，却没有带来收入杠杆。
        - 以更优条款完成新融资、披露客户群经济性，以及更快的多产品渗透。
      - - 基准
        - Zopa 继续累积客户和存款，但经济性只是良好，并未大幅改善，退出时点仍在后移。
        - 价值围绕上次披露的私募估值锚点聚集，回报取决于价格，而不是取决于故事。
        - 利率竞争压缩利差经济性，私募市场流动性仍然有选择性。
        - 盈利稳定、客户稳步增长，且没有新的重估。
      - - 悲观
        - 竞争性储蓄定价、较弱的主账户采用率，或信贷与合规方面的意外，迫使公司在更宽的退出窗口改善前完成融资。
        - 由于市场仍缺乏扩张能实质提升特许经营价值的证据，平轮或下轮融资变得合理。
        - 隐藏的优先权条款、较弱的损失表现或产品渗透停滞，削弱新资金的下行回收。
        - 没有新证据却以高于旧估值锚点融资，或管理层拒绝开放清算瀑布和客户群资料包。
    notes: 情景逻辑有意保持定性：公开来源只给出一个披露的 2024 年末锚点，输入不足以进行精确 DCF 或同业倍数计算。
