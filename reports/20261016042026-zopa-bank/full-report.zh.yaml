      - number: '6.3'
        title: 持久性看起来有希望，但公开满意度信号相互矛盾，集中度仍不透明
        blocks:
          - type: paragraph
            body: >-
              Zopa 有一些真实的持久性信号，但它们是代理指标，不是完整留存指标。公开披露最有价值的数据包括 33% 的定期储蓄续存率、36% 的再次借款率、较高的应用商店评分，以及在客户快速增长期间报告的 NPS
              72。这些信号支持这样的判断：Zopa 至少能让部分客户持续使用多个产品，存款也不全是机会主义热钱。但指定证据中没有公开 GRR、NRR、产品层面流失率、续期节奏或合作伙伴集中度拆分。

              服务风险图景同样复杂。Zopa 自有披露强调应用商店和 Trustpilot 的高评分，但当前 Reviews.io 页面明显负面，35 条评价得分仅
              1.4/5，并有账户被冻结、欺诈处理缓慢和争议解决不佳的详细投诉。这不能证明整个客户组合出现系统性恶化，却意味着不能把官方满意度指标当成全部事实。集中度披露不完整，加上公开客户情绪不一致，给管理层核查留下真实的投资判断和服务问题。
