          - type: paragraph
            body: >-
              投资论点很直接：Zopa 现在把自己呈现为更广泛的日常银行平台，而不是狭窄的借贷业务；品牌持续获得面向客户的奖项，客户基础也从 2024 年融资前后报道的 1.3-1.4 million
              增至当前主页所称的“over 1.5 million”。如果 Biscuit 活期账户和 Ask AI 层提高主账户使用率，这些信号支持持久特许经营价值。反论点同样清楚：储蓄竞争仍激烈，Moneyfacts 显示
              2026 年 10 月英国市场 headline 利率为 5.00%-8.00% AER；最好的定期储蓄产品往往要求客户持有活期账户，同时仍限制余额。因此，headline
              产品质量不会自动转化为高价值、稳定的存款或干净的溢价倍数。实际结论是围绕执行和经济性证明构建牛市、基准和熊市情景，而不是围绕没有依据的估值数学。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: 可比背景、核查要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              公开可比对象无法完全解决定价问题。关键英国数字银行同业 Monzo 仍是活跃的私人有限公司，使这一重要同业继续处于私募市场不透明状态，无法给投资者实时公开估值基准。指定的 SoftBank
              来源在抓取文本中也没有提供当前 Zopa 专属组合估值，因此既有投资者线索没有收紧今日下行情景。最终核查应索取当前优先股堆叠、清算瀑布、2025-2026
              年客户群经济性、活期账户主导性指标、按产品划分的信贷损失表现，以及卡和 AI 触点的明确安全与合规验证。如果 Zopa 没有新的证明却需要以高于上一轮披露估值融资，Biscuit 未能成为主银行关系，或产品与
              AI 扩张超过治理和合规证据，投资论点就会失效。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 价格敏感型判断
            body: 跟踪公司，并且只有在价格纪律下参与；业务质量可信，但公开证据仍不支持支付高于上一轮披露独角兽估值的价格。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV012
          - type: callout
            title: 主要下行风险不是业务崩塌，而是买贵
            body: 当前公开记录支持规模和盈利，但优先股堆叠、当前经济性和退出时间仍过于不透明，不能把上一轮私募估值视为价格底线。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
          - type: callout
            title: 日常银行业务扩张必须提升客户关系价值
            body: Biscuit 和 Ask 只有在把客户转化为更高频、更持久的银行关系，而不是增加轻度变现的功能使用时，才足以支撑上行空间。
            calloutType: assumption
            claimRefs:
              - CV001
              - CV002
              - CV015
