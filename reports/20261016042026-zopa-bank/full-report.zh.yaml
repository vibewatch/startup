      - number: '4.2'
        title: 资产负债表规模、盈利能力与资本状态
        blocks:
          - type: paragraph
            body: >-
              Zopa 公开的 2025 年银行指标显示业务已有真实规模，但也确认增长仍绑定受监管的放贷资产负债表。TheBanks.eu 报告资产 GBP 7.24 billion、客户存款 GBP 6.39
              billion、客户贷款 GBP 3.51 billion、2025 年年度利润 GBP 33.38 million，ROA 为 0.50%、ROE 为 5.96%。Companies House 显示 2025
              年完整账目于 2026 年 5 月提交，并记录了 2025 年 3 月的资本行动，包括减资和后续配股申报。但这些法律资本记录不能证明监管资本充足。Finovate 与 TechCrunch 均称 2024 年
              12 月完成股权融资，累计融资超过 USD 1.0 billion，报道估值也超过 USD 1.0 billion；累计融资不等于可用现金。TechCrunch 还报道管理层在 2024 年称 Zopa
              现金充裕，并有 GBP 75 million 债务在多年后到期。这一历史表述不能证明当前现金、债务到期、资金续航、CET1、流动性或压力损失承受能力。
