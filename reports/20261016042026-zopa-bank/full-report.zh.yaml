chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前规模
        blocks:
          - type: paragraph
            body: >-
              Zopa 将自己定位为一家立足英国、建立在更早点对点借贷基础上的数字银行。官网称公司成立于 2005 年，Zopa Bank 于 2020 年 6
              月推出，如今在一个应用驱动的产品体系内同时提供储蓄、个人贷款、信用卡、汽车融资、活期账户和新投资产品。业务已不再只是单一借贷产品故事：Biscuit 扩展日常银行业务，2025
              年投资产品发布则开始触及财富管理。规模证据总体有力但口径并未完全统一：当前官网称有超过 1.5 million 人使用 Zopa，2025 年末产品发布材料称有 1.6 million 名客户、储蓄超过 £6
              billion，而 2024 年末媒体报道则称客户数为 1.3 million 至 1.4 million、存款为 £5 billion。
