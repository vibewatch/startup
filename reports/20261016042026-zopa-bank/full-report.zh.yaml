        label: 分销杠杆
        min: 1
        max: 5
        low: 主要靠直接获客
        high: 可信或嵌入式分销
        description: Ordinal score based on channel reach and trust signals in sources
        scale: ordinal
      points:
        - label: Zopa
          x: 4.5
          'y': 4
          detail: 覆盖活期账户、储蓄、贷款、信用卡和汽车融资的广泛组合，另有合作伙伴渠道。
        - label: Monzo
          x: 3
          'y': 3
          detail: Companies House 确认其为直接银行同业；但在本资料池中，对其更广泛定位的证据只有部分。
        - label: Starling 类挑战者应用
          x: 3
          'y': 3
          detail: 纳入原因是 Zopa 的一篇独立评测将 Starling 视为预算管理标杆，但更广泛的来源支持不足。
        - label: 储蓄利率领先者
          x: 1.5
          'y': 2.5
          detail: Moneyfacts 显示其 headline 收益率明显更高，但在这里主要被证实为仅提供储蓄的替代选项。
        - label: John Lewis 路径
          x: 1
          'y': 5
          detail: 不是完整银行替代品，但零售商渠道让 Zopa 接触到庞大且受信任的借款人受众。
        - label: API 组装式数字银行模式
          x: 2.5
          'y': 2.5
          detail: TechCrunch 将该模式与 Zopa 自建技术栈作对比，但指定资料池没有点名具体的 2026 年案例。
    approximationNotes: 坐标轴是序数而非测量所得的市场份额。分数只反映本工作资料池中保留的证据，应理解为相对定位，而非经审计的基准。
    claimRefs:
      - CP003
      - CP004
      - CP009
      - CP010
      - CP011
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: Zopa 的公开财务证据描述了一种由存款供资、合作伙伴协助获客的消费放款模式，并实现了温和但为正的利润转化。
    data:
      nodes:
        - id: savings
          label: 零售储蓄供资
          value: GBP 6.39bn customer deposits (2025)
          note: 存款是公开可见的主要资金基础。
        - id: distribution
          label: 直接与合作伙伴分销
          value: Online/mobile plus John Lewis and Octopus Energy
          note: 数字化自助服务是核心，公开资料也提到合作伙伴协助的放款渠道。
        - id: products
          label: 放款与信用卡产品
          value: Personal loans, car loans, credit cards
          note: 公开证实的资产负债表产品，把资金转化为生息资产。
        - id: revenue
          label: 收入生成
          value: Revenue 'north of' GBP 300m expected at end-2024
          note: 公开评论显示了规模，但没有经审计的 2025 年收入结构。
        - id: profit
          label: 利润转化
          value: GBP 33.38m annual profit (2025)
          note: 可以看到正收益，但 CAC、损失和 NIM 尚未披露。
        - id: capital
          label: 资本与风险约束
          value: EBA credit-risk capital framework
          note: 仅作一般背景；证据无法证明 Zopa 特有的英国比率或适用条款。
      edges:
        - from: savings
          to: products
          label: 资金基础
        - from: distribution
          to: products
          label: 客户获客
        - from: products
          to: revenue
          label: 利息与费用生成
        - from: revenue
          to: profit
          label: 经营转化
        - from: capital
          to: products
          label: 资产负债表约束
    claimRefs:
      - CI001
      - CI003
      - CI011
      - CI014
      - CI017
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持分层的数字银行技术栈，但可见的只有组织架构和合作伙伴模式；供应商细节尚未披露。
    data:
      layers:
        - label: 客户端界面
          detail: 以移动端为先、围绕跨产品自助服务的数字银行体验。
          modules:
            - label: Biscuit 活期账户
              note: Interest-bearing current account live by Mar 2026.
            - label: 储蓄与 ISA 工具
            - label: 借贷与信用卡
          outputs:
            - label: Multi-product adoption
              value: 1 in 4 customers hold more than one product
        - label: 产品引擎
          detail: 多个消费银行产品共享同一客户关系，而不是各自孤立的单产品应用。
          modules:
            - label: 个人贷款
            - label: 信用卡
            - label: 车辆融资
            - label: 储蓄余额
        - label: 合作伙伴分销
          detail: 该平台既用于合作伙伴分销放款，也用于直接数字获客。
          modules:
            - label: Octopus Energy 贷款
            - label: John Lewis 贷款
        - label: 数据与决策
          detail: 产品分析和交易数据增强岗位的招聘，意味着公司正在运行决策和衡量基础设施。
          modules:
            - label: 产品分析
            - label: BI 与分析工程
            - label: 交易数据增强
        - label: 平台与交付工程
          detail: 公开招聘显示，公司具备专门的平台、数据库、移动端、网页和卡片工程能力。
          modules:
            - label: 数据库平台工程
            - label: Android 与 iOS 工程
            - label: 网页与卡片工程
        - label: 治理与客户保护
          detail: 可以看到风险、隐私和投诉运营，但没有外部证据证明认证或正常运行时间。
          modules:
            - label: 运营风险
            - label: 数据隐私
            - label: 投诉运营
    approximationNotes: 这是有证据支持的运营模式草图，不是供应商级系统图。
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE007
      - CE008
      - CE009
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，消费者旅程围绕比较驱动的发现、应用驱动的服务和合作伙伴协助扩张，而不是企业客户销售。
    data:
      items:
        - label: 比较利率或信贷选项
          phase: 发现
          actor: 潜在客户
          channel: 利率表、聚合平台、媒体和品牌搜索
          touchpoints:
            - Smart Saver 客户通常通过利率表或其他聚合平台找到 Zopa。
            - Moneyfactscompare 和 This is Money 都运营着英国重要的储蓄表入口。
          tone: neutral
        - label: 在线开通储蓄或借贷产品
          phase: 入门
          actor: 消费者储户或借款人
          channel: Zopa 网站和应用
          touchpoints:
            - 2020 年推出时，定期储蓄被定位为首个银行产品。
            - Zopa 将透明的保证利率借贷和快速数字决策纳入开户流程。
          tone: positive
        - label: 将应用作为服务中心
          phase: 激活
          actor: 现有客户
          channel: Zopa 应用
          touchpoints:
            - 2023 年末，60.8% 的客户在积极使用应用。
            - Borrowing Power、消费分析和开放银行功能旨在让客户持续在应用内使用服务。
          tone: positive
        - label: 再借款或交叉销售相邻产品
          phase: 扩张
          actor: 现有借款人或储户
          channel: 应用提示、产品发布和产品内工具
          touchpoints:
            - 2023 财年，36% 的客户再次借款。
            - Smart ISA 和信用卡产品让客户关系超越最初的单一产品。
          tone: positive
        - label: 通过合作伙伴分销触达客户
          phase: 规模化
          actor: 合作伙伴转介的潜在客户
          channel: John Lewis、Octopus Energy 及其他合作关系
          touchpoints:
            - TechCrunch 点名 John Lewis 和 Octopus Energy 作为分销案例。
            - 年报称 Zopa 通过合作关系实现渠道多元化。
          tone: neutral
        - label: 留住存款并解决服务问题
          phase: 留存
          actor: 持有活跃账户或贷款的客户
          channel: 储蓄续期和支持互动
          touchpoints:
            - 2023 年定期存款续存率为 33%。
            - Reviews.io 的投诉显示账户访问和欺诈处理存在风险，尽管官方 NPS 和应用商店指标仍然强劲。
          tone: warning
    claimRefs:
      - CU004
      - CU006
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在监管范围扩张，其次是储蓄利润率压力和平台执行。
    data:
      columns:
        - label: 可能性
          detail: 按当前公开路线图，未来 12-24 个月内发生的概率。
        - label: 影响
          detail: 风险落地后可能对增长、利润率或监管姿态造成的下行影响。
        - label: 剩余严重性
          detail: 扣除公开来源可见缓解措施后的净严重性。
      rows:
        - label: 监管范围扩张
          note: 投资支持、活期账户功能和更广泛的行为义务扩大了合规边界。
          values:
            - label: 高
              tone: warning
              detail: 新批准事项和正在推进的规则制定，使近期变化很可能发生。
            - label: 高
              tone: negative
              detail: 延误、整改或更严格的监管会直接打击规模化逻辑。
            - label: 中高
              tone: warning
              detail: 银行身份和治理有所帮助，但资料包没有消除对控制细节的疑问。
        - label: 储蓄利润率压力
          note: Zopa 依赖有竞争力的储蓄定价，而市场领先利率变化很快。
          values:
            - label: 高
              tone: warning
              detail: Moneyfacts 显示当前 AER 市场在 5.00%-8.00%，可用性也会变化。
            - label: 高
              tone: negative
              detail: 即使客户继续增长，存款重新定价也会压缩盈利。
            - label: 中高
              tone: warning
              detail: 盈利能力提供下行缓冲，但公开利润率敏感性仍不透明。
        - label: 平台与 AI 执行
          note: 自研技术和前台 AI 同时提高了韧性和行为风险的重要性。
          values:
            - label: 中高
              tone: warning
              detail: 扩张迹象可见，但公开事故和控制指标尚未披露。
            - label: 高
              tone: negative
              detail: 重大宕机或控制失灵会损害信任和监管信心。
            - label: 中
              tone: neutral
              detail: 董事会加强有所帮助，但运营准备度证据仍不完整。
        - label: 资本获取与 IPO 期权价值
          note: 公司仍能获得融资，但公开证据仍将 IPO 时点描述为取决于市场。
          values:
            - label: 中
              tone: neutral
              detail: 现金和近期股权融资降低了紧迫性，但资本市场条件仍然重要。
            - label: 中高
              tone: warning
              detail: IPO 窗口关闭可能限制战略灵活性或提高稀释风险。
            - label: 中
              tone: neutral
              detail: 盈利能力和近期融资实质上抵消了下行风险。
        - label: 合作伙伴与渠道依赖
          note: 可见合作伙伴不止一个，但公开来源未披露各渠道的业务量占比。
          values:
            - label: 中
              tone: warning
              detail: 合作伙伴执行或续约风险是可能的，但尚未证明已严重化。
            - label: 中
              tone: warning
              detail: 分销流失会更大程度地伤害获客放款速度，而非特许经营生存能力。
            - label: 中
              tone: neutral
              detail: 多个公开合作伙伴降低了对单一交易对手的依赖。
        - label: 诉讼与执法可见度
          note: 公开法律检索范围清晰，但该资料包无法为公司免责。
          values:
            - label: 中
              tone: warning
              detail: 风险未解决，是因为没有案件层面的公开证据，而不是因为风险已被证伪。
            - label: 中高
              tone: warning
              detail: 隐藏的法律或执法问题会影响信任、成本和尽调时点。
            - label: 中
              tone: warning
              detail: 在完成对指定监管和法院的核查前，剩余风险仍处于高位。
    approximationNotes: 定性评级综合了有关范围、融资、定价和已披露缓解措施的来源事实，而不是来自外部发布的热力图。
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR009
      - CR011
      - CR014
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 公开经营证明真实存在，但定价滞后且下行条款缺失，阻碍了直接建议加价买入。
    data:
      nodes:
        - id: proof
          label: 经营证明
          detail: 2024 年已实现盈利；2024 年末报告显示收入超过 3 亿英镑，存款超过 50 亿英镑。
          tone: positive
        - id: traction
          label: 2026 年增长信号
          detail: 主页目前显示客户超过 150 万，并通过 Biscuit 和 Ask 持续扩展产品。
          tone: positive
        - id: pricing
          label: 最新公开价格锚点
          detail: 最清晰的估值仍是 2024 年末融资轮，报道为超过 10 亿美元，而不是 2026 年更新后的价格。
          tone: neutral
        - id: market
          label: 市场与退出谨慎
          detail: IPO 不是优先事项，英国储蓄市场的 headline 利率竞争仍然激烈。
          tone: risk
        - id: diligence
          label: 缺失的下行条款
          detail: 公开证据仍缺少当前优先股堆叠、清算瀑布以及详细的 2025-2026 年客户群经济性。
          tone: risk
        - id: call
          label: 建议
          detail: 保持价格纪律并继续跟踪；没有新证据，不要支付明显高于上次披露独角兽估值的价格。
          tone: opportunity
      edges:
        - from: proof
          to: pricing
          relationship: 强劲的业务质量让旧锚点仍然可信。
        - from: traction
          to: pricing
          relationship: 新产品和客户信号支持上行潜力。
        - from: pricing
          to: call
          relationship: 滞后的估值只能支持有纪律的入场。
        - from: market
          to: call
          relationship: 流动性推迟，降低了在证据出现前的支付意愿。
        - from: diligence
          to: call
          relationship: 隐藏条款和缺失的经济性信息会增加支付过高价格的风险。
    approximationNotes: 该流程是基于留存公开证据的分析性综合，而非公司提供的估值框架。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV008
      - CV009
      - CV012
      - CV015
