      - number: '4.3'
        title: 利润率路径、资本强度与剩余核查障碍
        blocks:
          - type: paragraph
            body: >-
              关键财务问题不是 Zopa 是否有规模，而是存款成本和信贷资本保持竞争力时，盈利能否持续复合增长。Moneyfacts 称 2026 年 10 月 15 日英国最高储蓄利率为 5.00% 至 8.00%
              AER，因此即使是成熟数字银行，吸收存款也不是免费的资金来源。EBA 信贷风险框架说明银行放贷为何取决于风险权重、违约定义和资本处理，但指定证据没有说明哪些 EBA 条款适用于这家英国银行，也没有披露 Zopa
              自身监管比率。因此，收入质量和盈利动能可作中度正面判断；在管理层披露产品级 CAC、回收期、核销、实际定价和资本比率前，对未来利润率持久性和资本充足仍应谨慎。
            claimRefs:
              - CI015
              - CI016
              - CI017
      - number: '4.4'
        title: 展示
        blocks:
          - type: callout
            title: 盈利已成事实，不只是承诺
            body: 公开的 2025 年银行指标显示，Zopa 已从增长故事进入真实经营规模：资产、存款、贷款和利润均同比增长，完整 2025 年账目已于 2026 年 5 月提交。
            calloutType: insight
