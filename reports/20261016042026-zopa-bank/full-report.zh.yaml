  - id: TV002
    title: 正论 / 反论表
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - Zopa 现在在一个应用中提供更宽的活期账户、储蓄、信用卡和借贷平台，而不再只是单一产品放款机构。
        - 若管理层披露 Biscuit 客户的主账户采用率和多产品附加率，信心会提升。
      - - 正论
        - 从 2024 年融资时约一百三十万至 1.4m 客户的区间看，客户增长似乎已达到当前主页显示的超过 1.5m。
        - 若能量化 2026 年按主银行关系、储蓄关系和借款关系划分的客户构成，增长信号会更具投资价值。
      - - 反论
        - 英国最优储蓄利率仍极具竞争力，因此存款增长可能是靠定价买来的，而不是靠持久的特许经营深度。
        - 稳定的存款结构及促销定价后的利润率证据，会降低这一担忧。
      - - 反论
        - 当前公开证据集没有显示实时优先股堆叠、清算瀑布或最新的独立估值。
        - 清晰的资本表资料包及更新的第三方估值锚点，会让投资评估依据明显更扎实。
    notes: 这些论点只反映保留的公开证据；管理层未披露的经济性和条款被视为待尽调事项。
