  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管范围扩张是首要剩余风险
        blocks:
          - type: paragraph
            body: >-
              Zopa 最大的公开市场风险信号不是近期偿付能力，而是银行扩大监管覆盖面的速度。截至 2026 年 5 月，Zopa 称已获监管批准为投资产品提供针对性支持；其更广路线图还覆盖储蓄、借贷、卡、活期账户功能和 AI
              客户支持。这一增长处在英国监管框架内，财政部和监管机构仍可为稳定、安全、稳健、竞争和消费者保护而广泛重塑规则。新增独立非执行董事是可信的缓释措施，但指定资料没有披露批准条件、控制设计或监管反馈，因此监管执行仍是最需要监测的论点破坏类别。
