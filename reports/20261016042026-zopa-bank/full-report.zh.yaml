  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争范围不止挑战者银行同业
        blocks:
          - type: paragraph
            body: >-
              指定证据显示，Zopa
              面对的竞争远不止直接挑战者银行。它同时提供活期账户、储蓄、个人贷款、信用卡和汽车融资，因此既要与活期账户驱动的挑战者争夺用户，也要面对储蓄专业机构、无担保借贷渠道，以及仍能处理现金和支票的网点银行。客户可以用多种替代品解决同一组家庭资金需求，不必锁定某个明确对手。

              本来源池对同业的证据主要是功能比较，并非完整的公司披露。独立的 2026 年评测按预算工具深度比较 Zopa、Monzo 和 Starling；Companies House 则确认 Monzo
              仍是活跃的英国银行。由此可以把挑战者应用视为数字化主银行用户最接近的直接替代品，但仅凭本来源池，仍不足以建立 Monzo、Starling 和 Revolut 的完整量化同业集合。

              替代品范围还不止这些。储蓄利率表显示，利率敏感型储户可以把资金转给 headline 收益明显高于 Zopa 活期和储蓄产品的专业机构；Zopa
              没有网点、现金存款和支票支持，也让传统网点银行继续成为依赖线下服务客户的默认选择。因此，竞争压力既来自收益率，也来自服务方式，并不只是其他数字银行带来的压力。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP011
              - CP014
      - number: '3.2'
        title: 功能覆盖广，但价格领先只存在于部分领域
        blocks:
          - type: paragraph
            body: >-
              在指定范围内，Zopa 的产品组合较广：Biscuit 提供活期账户、借记卡消费、余额利息和月度奖励选择，同一应用还覆盖 Smart Saver
              储蓄罐、个人贷款、信用卡和汽车融资。对希望在一个界面内同时借贷和储蓄的客户，这形成了连贯的交叉销售方案。

              证据不足以称 Zopa 在所有品类都拥有定价领先。BankAdvisor 的评测展示了 Biscuit 的免费账户和奖励结构；但 Moneyfacts 2026 年 10 月 15 日市场表显示，各品类储蓄
              headline 领先利率为 5.00%-8.00% AER，而 Zopa 自有菜单最高仅为一年期固定储蓄罐 4.65% AER、有限支取产品
              4.56%。因此本来源池支持的竞争卖点是便利性、整合式产品覆盖和奖励设计，而非储蓄利率绝对领先。

              转换摩擦有两面性。Zopa 没有网点、现金存款和支票存款，线下服务需求让传统银行仍有吸引力；独立评测对比 Monzo 和 Starling，也说明部分数字原生用户可能仍偏好预算优先的应用，而不是 Zopa
              更偏借贷和储蓄的设计。来源支持可信的产品组合故事，却不足以证明其在每项买方标准上都胜出。
            claimRefs:
