            title: 公开投资判断仍缺少决定利润率持久性的指标
            body: 指定来源池未披露 CAC、回收期、核销、实际定价或监管资本比率，因此投资者能看到动能，却还无法高精度评估利润率韧性。
            calloutType: risk
