companyProfile:
  summary: >-
    Zopa Bank 是一家英国消费数字银行，脱胎于 Zopa 2005 年创立的点对点借贷业务，并于 2020 年转为受监管银行。如今它通过应用驱动的产品体系提供储蓄、个人贷款、信用卡、汽车融资、Biscuit
    活期账户和较新的投资产品，获客既靠直营也靠合作伙伴分销。公开证据显示其零售业务真实存在，存款、贷款和利润都在增长；但股权结构表、当前员工数、主银行转化率和详细单位经济仍只披露了一部分。
