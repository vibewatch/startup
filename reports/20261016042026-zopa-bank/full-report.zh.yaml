      - number: '3.3'
        title: 持久性取决于嵌入式分销与受监管执行
        blocks:
          - type: paragraph
            body: >-
              指定证据中最强的壁垒信号不只是产品广度，还在于 Zopa 如何分销这些产品。TechCrunch 报道称，Zopa 从头自建平台，而非拼接第三方 fintech-as-a-service
              API；TechCrunch 和 Fintech Magazine 都称该技术栈已通过 John Lewis 和 Octopus Energy 支撑合作伙伴分销。Zopa
              因此不只是争夺直营获客的应用，也能进入其他受信任消费品牌的客户旅程。

              John Lewis 合作具有战略意义：它把 Zopa 延伸到预计拥有 23 million 名客户的零售生态，同时保留 Zopa 的监管边界。Fintech Magazine 称 John Lewis
              Finance 是 Zopa Bank 的 Introducer Appointed Representative，因此零售商贡献信任和触达，Zopa
              保留持牌银行角色。对消费信贷而言，这很重要，因为欧洲银行管理局将信贷风险规则视为覆盖机构放贷活动的资产负债表和合规要求。

              但嵌入式分销和自建基础设施并不能消除商品化风险。TechCrunch 还指出，监管、回报下降和行业退出令 P2P 模式吸引力下降，Zopa 随后转向其他方向，说明英国零售金融的经济性可能迅速变化。Zopa
              的壁垒更偏运营和渠道，而非网络效应；它必须持续证明合作伙伴分销和多产品变现更强，不能假定自己能长期隔绝挑战者或传统银行的反应。
            claimRefs:
