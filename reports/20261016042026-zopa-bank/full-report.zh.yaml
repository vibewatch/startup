        title: 估值锚点与建议
        blocks:
          - type: paragraph
            body: >-
              最强的公开锚点仍是 2024 年末融资：TechCrunch 报道 Zopa 融资 €82 million、估值远超 $1 billion；Finovate 则将该轮概括为 $87 million，并称总融资达到
              $1.067 billion。这个锚点没有明显失效：同一批报道描述了一家已盈利的银行，存款超过 GBP5 billion，客户约 1.3-1.4 million，收入超过 GBP300
              million。但它也并不明显保守，因为管理层称 IPO 不是优先事项，要等更好的市场环境；公开市场流动性近期无法支撑溢价重估。因此我的建议是跟踪而非追价：Zopa
              作为业务具备投资价值，但在缺乏新的经营证明和下行条款透明度前，公开证据不足以支持明显高于上一轮独角兽融资的价格。
