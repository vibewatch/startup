  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现空间
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Zopa 是靠零售资金和消费贷款驱动的数字银行，而不是按用量收费的 SaaS 引擎。TheBanks.eu
              列出其通过网银和移动应用提供储蓄账户、消费贷款、汽车贷款和信用卡；收入主要来自利差、卡业务和费用。TechCrunch 还称，管理层预计 2024 年末收入“north of” GBP 300
              million，并强调与 John Lewis、Octopus Energy 的合作，说明 Zopa 也能借助伙伴渠道发起或嵌入贷款。指定来源池没有披露当前实际
              APR、交换费率或客户层面的费用构成，所以我们能看清产品收入来源，但尚未按业务线拆出利润质量。
            claimRefs:
              - CI001
