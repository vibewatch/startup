              指定证据对运营模式的说明远强于对具体供应商的披露。TechCrunch 于 2024 年 12 月报道，Zopa 从头自建平台，而非主要拼接 fintech-as-a-service API；同一平台还支持通过
              Octopus Energy 和 John Lewis 分销的合作伙伴贷款
