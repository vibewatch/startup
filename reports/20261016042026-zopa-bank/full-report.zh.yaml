        title: 产品范围与客户流程
        blocks:
          - type: paragraph
            body: >-
              公开报道一致显示，Zopa 是多产品数字银行，而非单一产品贷款机构。独立报道列出的产品包括储蓄、个人贷款、信用卡和汽车融资；2026 年 3 月报道又加入 Biscuit
              活期账户，作为深化客户关系的日常银行切入口
              [CE001][CE002][CE003]。公司已出现早期交叉销售，而不只是账户数量增长：四分之一客户持有多个产品，管理层也明确将成功定义为成为客户的主银行，而非备用账户工具
              [CE004][CE005]。因此证据支持这样一套流程：在一个应用中整合借贷、储蓄和日常现金管理；但尚不能证明有多少 Biscuit 账户已成为真正的工资流入流出主账户。
