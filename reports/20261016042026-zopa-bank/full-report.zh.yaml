            title: 广度加分销是本组来源中最清晰的优势
            body: Zopa 最强的竞争故事不是某个单一产品，而是广泛的零售银行组合，加上由合作伙伴主导的获客路径，能把 Zopa 信贷放进受信任的第三方品牌。
            calloutType: strength
