  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Zopa 所处的相关市场如今是英国零售数字银行，覆盖储蓄、无担保借贷、信用卡、活期账户和相邻资金管理产品，而不是公司起步时的点对点借贷细分市场。TechCrunch 报道称，监管、回报下降和 Covid
              后的高调退出让 P2P 模式更难；Computer Weekly 另称 Zopa 于 2020 年成为银行、次年放弃
              P2P。替代品因此改变：买方可以留在传统银行，使用挑战者银行活期账户作为次要服务商，或为储蓄和信贷选择单点产品。即使是数字原生替代品也仍在银行边界内，例如 Companies House 将 Monzo Bank
              Limited 归为 SIC 64191 - Banks。
            claimRefs:
              - CM001
