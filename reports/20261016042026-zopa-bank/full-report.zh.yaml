      - number: '2.3'
        title: 驱动因素、约束与待补规模缺口
        blocks:
          - type: paragraph
            body: >-
              采用驱动因素很清楚：活期账户能加深钱包份额，储蓄仍是切实的获客抓手，现有客户基础也让交叉销售比纯绿地获客更顺畅。Computer Weekly 明确将活期账户与建立更广泛客户关系联系起来；Moneyfacts
              显示截至 2026 年 10 月 15 日，英国最高储蓄利率仍在 5.00% AER 至 8.00% AER 之间，凸显竞争激烈且由利率驱动。约束同样具有结构性。NCA
              称大量犯罪资金可能让机构触发刑事和监管处罚；Zopa 的扩张还需要 £80 million AT1 融资以及持续的 Companies House 报告和资本申报。尚未解决的公开缺口是，指定来源均未单独给出
              Zopa 的 SAM、按产品拆分的 SOM 或 Biscuit 主银行转化率。
