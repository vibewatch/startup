              公开证据支持几个受约束的市场视角，但无法形成一套干净的自下而上市场模型。Zopa 自披露的规模——2025 年 1.7 million 名客户、£6.4 billion 存款和 £3.8 billion
              毛贷款——是最清晰的已观察 SOM 代理值。除此之外，公司通过交叉销售和分销描述增量机会：FF News 称超过四分之一客户已持有多个产品；Financial IT 称 John Lewis 借贷合作可触达 23
              million 名客户；公司关联发布材料还将 Octopus 带来的 £23 billion 可再生能源相邻市场，以及持有闲置现金的 15 million
              英国人视为投资市场切入口。这些视角有用，但不可相加，而且混合了人数、合作伙伴受众和行业价值池。
