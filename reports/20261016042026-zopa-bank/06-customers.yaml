      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - ["Total customers", "1.1 million", "FY2023", "Zopa annual report", "Medium", "Large consumer base before the late-2024 scale-up", "No 2025 or 2026 official customer-count update in assigned evidence"]
      - ["Latest public customer count", "About 1.3 million; 1.4 million year-end expectation", "Dec-2024 reporting", "TechCrunch and Finovate", "High", "Growth continued after FY2023 and before current-account launch", "Stale versus the 2026 run date"]
      - ["Customer deposits", "£3.4 billion in FY2023; more than £5 billion in late 2024", "FY2023 and Dec-2024", "Zopa annual report plus TechCrunch and Finovate", "High", "Savings franchise is meaningful and deepening", "No current split by product or customer cohort"]
      - ["App engagement", "60.8% of customers actively using the app at year-end 2023", "FY2023", "Zopa annual report", "Medium", "Engagement extends beyond acquisition into servicing", "No MAU or DAU definition"]
      - ["Repeat borrowing", "36% of customers reborrowed", "FY2023", "Zopa annual report", "Medium", "Lending relationships can recur rather than reset each cycle", "No product-level cohort retention curve"]
      - ["Service sentiment", "NPS 72; Apple App Store 4.9/5; Google Play 4.7/5; Trustpilot 4.5/5", "FY2023", "Zopa annual report", "Medium", "Official metrics say service quality held while scaling", "Public review sample on Reviews.io is much worse"]
      - ["New card originations", "163,000 new card accounts", "FY2023", "Zopa annual report", "Medium", "Card remains a significant acquisition and cross-sell engine", "No active-card or revolve-rate disclosure"]
    notes: Later independent scale figures corroborate the direction of travel but are already old relative to the 2026 run date, so this table separates observed public scale from current unknowns.
