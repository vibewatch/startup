  - id: TU003
    title: Named customer proof table
    columns:
      - Public proof surface
      - Segment / counterparty
      - Deployment / use case
      - Production vs pilot
      - Outcome / signal
      - Limitation
    rows:
      - ["John Lewis", "Retail borrowers via partner distribution", "Personal loans offered directly to retailer customers", "Production", "Public proof that Zopa can acquire borrowers through a scaled external consumer brand", "No disclosed loan volume or profitability by partner"]
      - ["Octopus Energy", "Partner-distributed financial-services users", "Financial-services partnership named in independent coverage", "Production", "Shows Zopa can distribute beyond its own app and website", "No disclosed active-customer count or economics"]
      - ["Moneyfactscompare and This is Money savings tables", "Retail savers shopping for yield", "Comparison-table discovery for savings accounts and ISAs", "Production", "Consistent with Zopa's statement that Smart Saver customers typically arrive through rate tables or aggregators", "These are acquisition surfaces rather than proof of retention"]
      - ["Reviews.io review corpus", "Live retail banking and credit users", "Post-purchase service and dispute-resolution feedback", "Production", "Confirms real-world usage and surfaces adverse servicing anecdotes", "Anonymous complaint-heavy sample is not representative of the full base"]
    notes: Public proof in the assigned pool is partial and skewed toward channels, review surfaces, and partner distribution rather than an exhaustive named-customer roster or cohort-level retention evidence.
    enumerationScope:
      coverage: partial
      basis: Limited to named public proof surfaces and public review evidence in the assigned pool; Zopa does not publish an exhaustive named-customer list or partner-by-partner customer volumes here.
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence shows a consumer journey built around comparison-led discovery, app-led servicing, and partner-assisted expansion rather than enterprise account selling.
    data:
      items:
        - label: Compare rates or credit options
          phase: Discovery
          actor: Prospect
          channel: Rate tables, aggregators, media, and brand search
          touchpoints:
            - Smart Saver customers typically find Zopa through rate tables or other aggregators.
            - Moneyfactscompare and This is Money both operate prominent UK savings-table surfaces.
          tone: neutral
        - label: Open savings or borrowing product digitally
          phase: Onboarding
          actor: Consumer saver or borrower
          channel: Zopa website and app
          touchpoints:
            - The 2020 launch positioned fixed-term savings as the first bank product.
            - Zopa built transparent guaranteed-rate borrowing and fast digital decisions into onboarding.
          tone: positive
        - label: Use the app as the servicing hub
          phase: Activation
          actor: Existing customer
          channel: Zopa app
          touchpoints:
            - 60.8% of customers were actively using the app at year-end 2023.
            - Borrowing Power, spending analytics, and open-banking features aim to keep usage inside the app.
          tone: positive
        - label: Reborrow or cross-sell into adjacent products
          phase: Expansion
          actor: Existing borrower or saver
          channel: App prompts, product launches, and in-product tools
          touchpoints:
            - 36% of customers reborrowed in FY2023.
            - Smart ISA and card products extend the relationship beyond one initial product.
          tone: positive
        - label: Reach customers through partner distribution
          phase: Scale
          actor: Partner-referred prospect
          channel: John Lewis, Octopus Energy, and other partnerships
          touchpoints:
            - TechCrunch names John Lewis and Octopus Energy as distribution examples.
            - The annual report says Zopa diversified channels through partnerships.
          tone: neutral
        - label: Retain deposits and resolve service issues
          phase: Retention
          actor: Customer with live account or loan
          channel: Savings renewal and support interactions
          touchpoints:
            - Fixed-term resave rate was 33% in 2023.
            - Reviews.io complaints show account-access and fraud-resolution risk even as official NPS and app-store metrics stay strong.
          tone: warning
    claimRefs: [CU004, CU006, CU009, CU010, CU011]
callouts:
  - calloutType: strength
    title: Multi-product consumer base is real, not just a logo wall
    body: >-
      Zopa discloses meaningful scale across savings, cards, and lending rather than a single-product
      wedge, and its late-2024 public scale suggests the customer base kept growing after profitability.
    claimRefs: [CU002, CU003, CU013]
  - calloutType: insight
    title: Acquisition appears diversified before concentration is disclosed
    body: >-
      Public evidence points to app, comparison-table, and partner routes into the franchise, but Zopa
      does not disclose how much customer volume or gross profit each route contributes.
    claimRefs: [CU007, CU009, CU010, CU012]
  - calloutType: risk
    title: Customer-satisfaction proof is directionally positive but not clean
    body: >-
      The filing reports strong NPS and app-store ratings, yet Reviews.io shows sharply negative service
      anecdotes and a low aggregate score, so investor diligence should test complaints handling and fraud operations directly.
    claimRefs: [CU005, CU011]
