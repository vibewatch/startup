      - ["Fixed-term savers", "Consumer saver / same / same", "Fixed-term deposit funding", "Average deposit around £35,000; average age around 60; resave rate 33% in 2023", "Foundational funding source and evidence of older affluent saver appeal", "No disclosed customer count split or vintage-level renewal"]
      - ["Credit card customers", "Consumer borrower / same / same", "Revolving credit and balance-transfer borrowing", "442,000 customers; average age 41; average income £39,000 (FY2023)", "Major cross-sell surface with recurring engagement through the app", "Active-card rates and delinquency by cohort not disclosed"]
      - ["UPL and car-finance borrowers", "Consumer borrower / same / same", "Installment borrowing and vehicle finance", "321,000 customers in FY2023; 36% of customers reborrowed", "Core revenue engine and proof of repeat borrowing", "No product-level churn or default split by acquisition channel"]
      - ["Partner and comparison-table acquisition", "Prospect / applicant / borrower-or-saver", "Savings discovery via rate tables plus embedded-loan referrals", "Smart Saver customers typically come through rate tables or aggregators; John Lewis reach cited at 23 million customers", "Broadens acquisition beyond Zopa-owned surfaces", "Volume, conversion, and contribution margin by partner are undisclosed"]
    notes: Sources mix FY2023 filing disclosures with late-2024 independent reporting; scale cells use the latest disclosed figure for each segment and leave undisclosed cohort economics as gaps.
    claimRefs: [CU003, CU004, CU006, CU007, CU009, CU010, CU014]
