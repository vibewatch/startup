company:
  name: Zopa Bank
chapter:
  number: 6
  title: Customers
  summary: >-
    Zopa has a real retail customer franchise rather than just a marketing-led neobank story:
    its FY2023 filing reported 1.1 million customers and £3.4 billion of deposits, while late-2024
    independent coverage still described roughly 1.3 million customers and more than £5 billion
    of deposits. The customer base is diversified across savings, cards, and lending, but public
    proof of durability still relies on proxy metrics such as reborrowing, app activity, and savings
    resave rates rather than disclosed churn, NRR, or concentration data.
sections:
  - id: retail-segmentation
    title: Retail segments are visible; enterprise-style customer proof is not
    body: |-
      Zopa's disclosed customer base is overwhelmingly consumer retail rather than SME or enterprise banking. The FY2023 annual report shows a multi-product base spanning 442,000 credit-card customers, 321,000 unsecured-personal-loan and car-finance customers, and 178,000 Smart Saver customers, with materially different age and balance profiles across savings products. That mix matters because it shows Zopa is monetizing more than one consumer use case: day-to-day borrowing, balance-sheet funding through retail deposits, and app-led servicing.

      The segmentation is also different from UK digital banks built primarily for businesses. OakNorth explicitly markets itself as a bank for growing businesses and entrepreneurs, which sharpens the contrast: Zopa's public evidence points to a consumer-banking franchise centered on households seeking savings yield, personal credit, card functionality, and debt-management tools. The limitation is that public evidence does not break customers into profitable cohorts, primary-bank users, or high-value households, so the segment mix is visible but not fully monetized in public disclosures.
    claimRefs: [CU003, CU006, CU008, CU013, CU014]
    tableRefs: [TU001]
  - id: adoption-and-engagement
    title: Adoption is proven, with strongest public proof in channels and product usage
    body: |-
      Adoption is not speculative. Zopa's FY2023 filing reported 1.1 million customers, 30% year-over-year customer growth, and 60.8% of customers actively using the app at year-end; the same filing said 36% of customers reborrowed, which is meaningful evidence that at least the lending side is not one-and-done acquisition. Independent late-2024 coverage then moved the scale story forward to roughly 1.3 million customers and more than £5 billion in deposits, implying Zopa kept adding households after the first full profitable year as a bank.

      Public named proof, however, is strongest in acquisition and distribution surfaces rather than in the form of named enterprise reference accounts. The filing says Smart Saver customers typically arrive through rate tables and aggregators, and TechCrunch names John Lewis and Octopus Energy as live partner routes for embedded distribution. That is useful proof that Zopa can reach customers beyond its own app and brand, but it still leaves open how much volume, retention, or margin each route contributes.
    claimRefs: [CU001, CU002, CU004, CU007, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-expansion-and-friction
    title: Durability looks promising, but public satisfaction signals conflict and concentration remains opaque
    body: |-
      Zopa has some real durability signals, but they are proxies rather than complete retention metrics. The best disclosed datapoints are a 33% fixed-term savings resave rate, 36% reborrowing, strong app-store scores, and a reported NPS of 72 despite rapid customer growth. Those signals support the case that Zopa can keep at least part of its base engaged across multiple products, and that its deposits are not purely opportunistic hot money. Even so, there is no public GRR, NRR, product-level churn, renewal cadence, or partner concentration split in the assigned evidence.

      The service-risk picture is also mixed. Zopa's own disclosures emphasize strong app-store and Trustpilot ratings, but the current Reviews.io surface is sharply negative, with a 1.4/5 score from 35 reviews and detailed complaints about blocked accounts, slow fraud handling, and poor dispute resolution. That does not prove systemic deterioration across the whole book, but it does mean official satisfaction metrics should not be treated as the full story. The combination of incomplete concentration disclosure and inconsistent public customer sentiment leaves real underwriting and servicing questions for management diligence.
    claimRefs: [CU004, CU005, CU006, CU011, CU012]
    tableRefs: [TU003]
