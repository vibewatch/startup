  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer
      - Zopa evidence
      - Alternative benchmark in assigned pool
      - Unknowns / caveats
      - Implication
    rows:
      - - Everyday-account fee
        - Biscuit monthly account fee is £0
        - No verified peer account-fee pages are retained in this pool
        - Cannot confirm parity versus Monzo, Starling, or incumbents here
        - Zopa can pitch on free entry, but fee parity is not a proven moat
      - - Everyday-account reward
        - 1% AER on balance; 2.75% with boosted interest; or 3% cashback on up to £150 of eligible spend/bills
        - No retained challenger reward pages
        - Reward mechanics are source-backed for Zopa only
        - Differentiation leans toward tangible value rather than pure UX
      - - Fixed / notice savings
        - Up to 4.65% one-year fixed; 4.56% limited access; 3.08%-3.55% notice-style boosted pots
        - Market leaders in the retained tables run 5.00%-8.00% headline AER depending on category
        - Not every benchmark is the same term or access profile
        - Price-sensitive savers can defect even if Zopa wins on bundle convenience
      - - Personal-loan distribution
        - Loans from £1,000 to £35,000 offered directly and through John Lewis Money
        - No retained incumbent or challenger APR tables
        - Channel economics and approval rates are undisclosed
        - Competitive edge is distribution convenience, not proven rate leadership
    notes: >-
      Benchmarks mix Zopa reviewed pricing with market-rate tables and partner
      distribution evidence, so row-level implications focus on positioning
      rather than a claim of strict apples-to-apples parity.
