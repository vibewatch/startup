        - Independent review suggests stronger budgeting focus, but full 2026 feature pages are missing
        - Usually not the primary current-account option in this source set
        - Status-quo strength for users wanting branch-based servicing
      - - Cash and cheques
        - Not supported
        - Unknown in assigned pool
        - Not core to the savings-only use case
        - Likely incumbent advantage because Zopa explicitly lacks this workflow
      - - Savings yield leadership
        - Access at 2.95%; limited access up to 4.56%; one-year fixed up to 4.65%
        - Unknown in assigned pool
        - Market leaders at 5.00%-8.00% headline AER across categories
        - Unknown in assigned pool
      - - Borrowing breadth
        - Personal loans, credit card, and car finance in one app
        - Unknown in assigned pool
