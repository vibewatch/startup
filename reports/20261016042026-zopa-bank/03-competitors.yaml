      - - John Lewis Money + Zopa
        - Adjacent distribution route
        - John Lewis customer base estimated at 23 million
        - Personal-loan shoppers inside a trusted retail ecosystem
        - Brand trust and embedded loan journey extend reach beyond Zopa's app
        - Channel economics and conversion data are undisclosed
      - - Top savings-rate providers
