        - Rate-sensitive savers
        - Higher headline yield than Zopa's current-account and savings offers
        - Narrower scope than a bundled bank-plus-credit relationship
      - - High-street branch banks
        - Incumbent / status quo
        - Scale not quantified in assigned sources
        - Users needing branches, cash handling, or cheque support
        - Physical-service workflow that Zopa does not offer
        - Assigned pool lacks named incumbent pricing and feature pages
    notes: >-
      Mixed direct-company and independent-source snapshot. Unknowns remain where
      this assigned pool does not contain current verified competitor pages.
