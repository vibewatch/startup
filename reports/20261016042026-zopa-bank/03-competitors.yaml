      - CP003
      - CP011
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of product breadth versus distribution leverage using only the
      assigned source set.
    data:
      xAxis:
        label: Product breadth
        min: 1
        max: 5
        low: Narrow single-job offer
        high: Broad everyday-banking bundle
        description: Ordinal score based on source-backed product scope
        scale: ordinal
      yAxis:
        label: Distribution leverage
        min: 1
        max: 5
        low: Mostly direct acquisition
        high: Trusted or embedded distribution
        description: Ordinal score based on channel reach and trust signals in sources
        scale: ordinal
      points:
        - label: Zopa
          x: 4.5
          y: 4
          detail: Broad bundle across current account, savings, loans, credit card, and car finance, plus partner channels.
        - label: Monzo
          x: 3
          y: 3
          detail: Direct bank peer confirmed by Companies House; broader positioning is only partially evidenced in this pool.
        - label: Starling-class challenger apps
          x: 3
          y: 3
          detail: Included because an independent Zopa review treats Starling as a budgeting benchmark, but wider source support is missing.
        - label: Savings-rate leaders
          x: 1.5
          y: 2.5
          detail: Moneyfacts shows materially higher headline yields, but these substitutes are evidenced here mainly as savings-only options.
        - label: John Lewis route
          x: 1
          y: 5
          detail: Not a full-bank substitute, but the retailer channel gives Zopa access to a large trusted borrower audience.
        - label: API-assembled neobank model
          x: 2.5
          y: 2.5
          detail: TechCrunch contrasts this model with Zopa's self-built stack, but the assigned pool does not name specific 2026 examples.
    approximationNotes: >-
      Axes are ordinal, not measured market shares. Scores reflect only evidence
      retained in this worker pool and should be read as relative positioning,
      not audited benchmarks.
    claimRefs:
      - CP003
      - CP004
      - CP009
      - CP010
      - CP011
callouts:
  - calloutType: strength
    title: Breadth-plus-distribution is the clearest edge in this source set
    body: >-
      Zopa's strongest competitive story is not any single product, but the
      combination of a broad retail-banking bundle with partner-led origination
      routes that can place Zopa credit inside trusted third-party brands.
    claimRefs:
      - CP001
      - CP010
      - CP011
      - CP012
  - calloutType: risk
    title: Savings yield and budgeting depth remain open attack surfaces
    body: >-
      The assigned evidence does not support Zopa as the headline rate leader,
      and the independent review explicitly places Monzo and Starling ahead on
      advanced budgeting, leaving room for both price-led and engagement-led
      displacement.
    claimRefs:
      - CP003
      - CP005
  - calloutType: insight
    title: The moat looks operational, not winner-take-all
    body: >-
      Zopa's platform and regulatory setup help it win partner distribution, but
      the P2P pivot history shows that UK retail-finance economics can change
      quickly when regulation or returns move against a model.
    claimRefs:
      - CP009
      - CP012
      - CP013
      - CP015
