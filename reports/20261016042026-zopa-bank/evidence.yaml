evidenceGaps:
  - type: missing-source
    severity: material
    topic: founder-roster
    missingEvidence: >-
      A source in the assigned pool that explicitly names the founders and clarifies any ongoing board or ownership
      influence.
    whyItMatters: >-
      Key-person dependence and founder-market fit cannot be judged confidently if founder roles are inferred rather
      than evidenced.
    diligencePath: >-
      Request the latest board deck, cap-table summary, and executive biographies or add a sourced leadership page in a
      later refresh.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount-disclosure
    missingEvidence: Current employee count by function and location.
    whyItMatters: Headcount is a core scale and burn-efficiency metric for a private bank broadening product scope.
    diligencePath: Request management reporting, latest annual accounts headcount note, or HR dashboard extracts under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation-waterfall
    missingEvidence: >-
      Current share price, preference stack, and liquidation waterfall across the 2021, 2023, and 2024-2025 financing
      actions.
    whyItMatters: A press-implied unicorn valuation is not enough to judge downside protection or common-equity value realization.
    diligencePath: >-
      Obtain financing documents, board approvals, and a cap-table bridge that reconciles the Companies House capital
      actions.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: material
    topic: biscuit-traction
    missingEvidence: >-
      Post-launch Biscuit metrics such as funded accounts, primary-banking share, and cross-sell conversion into savings
      or investments.
    whyItMatters: >-
      The current-account launch is central to Zopa's diversification case, but public evidence still only confirms
      launch and a limited trial-stage base.
    diligencePath: Ask management for current-account KPIs, cohort retention, and product-attach rates since full rollout.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      Independent bottom-up UK SAM or product-level SOM estimates for Zopa by savings current accounts lending and
      investments.
    whyItMatters: >-
      Without a denominator the market case relies on proxy audiences and observed scale rather than a testable
      share-of-market model.
    diligencePath: >-
      Obtain management or analyst segmentation on addressable households balances and active-product penetration by
      line.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: current-account-traction
    missingEvidence: Active Biscuit account counts primary-banking designation rates interchange or fee mix and engagement cohorts.
    whyItMatters: >-
      Current accounts are the main relationship-deepening lever, so missing usage depth makes adoption timing and
      lifetime value harder to underwrite.
    diligencePath: >-
      Request cohort-level KPI disclosure for funded accounts salary-in behavior and multi-product conversion after
      current-account adoption.
  - type: private-evidence-only
    severity: material
    topic: unit-economics-by-product
    missingEvidence: CAC LTV delinquency and margin contribution by savings credit card personal loan and current-account cohorts.
    whyItMatters: >-
      Public growth disclosures are strong, but valuation still depends on whether new everyday-banking products improve
      or dilute unit economics.
    diligencePath: >-
      Ask management for cohort economics and capital-consumption metrics by product family, including acquisition
      channel split.
  - type: missing-source
    severity: material
    topic: peer-comparison-completeness
    missingEvidence: >-
      Current verified 2026 product and pricing pages for Monzo, Starling, Revolut, and at least one named high-street
      incumbent.
    whyItMatters: >-
      Like-for-like capability and pricing parity cannot be established from a Zopa review plus one Monzo registry
      record alone.
    diligencePath: >-
      Retain direct competitor product and pricing URLs in a later discovery pass instead of relying on comparison
      summaries.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: partner-unit-economics
    missingEvidence: >-
      Conversion rates, approval rates, economics, and contractual terms for the John Lewis and Octopus partner
      channels.
    whyItMatters: >-
      Distribution reach is visible, but moat durability depends on whether embedded channels convert efficiently and
      profitably.
    diligencePath: >-
      Request partner-channel KPI packs or management disclosures covering funnel, take rate, CAC, and loss performance
      by channel.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: minor
    topic: challenger-scale-parity
    missingEvidence: Current customer, funding, and product-breadth figures for Monzo and Starling from assigned eligible sources.
    whyItMatters: >-
      The chapter can identify direct peers, but it cannot quantify whether Zopa's scale is ahead of or behind the main
      app-led challengers.
    diligencePath: Add retained peer disclosures or reputable reporting for challenger-bank scale in the next evidence refresh.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Product-level CAC, payback period, repeat usage, and LTV by major product line.
    whyItMatters: >-
      Without channel economics, investors cannot tell whether profitable growth is driven by efficient acquisition or
      by favorable recent credit and rate conditions.
    diligencePath: >-
      Request board or lender-pack KPI dashboards with channel mix, payback, and cohort economics for savings, personal
      loans, cards, and auto lending.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Current Zopa-specific price cards, realized APRs and savings rates, discounting, and product-level fee take rates.
    whyItMatters: >-
      Public market-rate benchmarks do not reveal whether Zopa wins customers by price, by product quality, or by
      temporary promotional intensity.
    diligencePath: >-
      Request current rate cards, repricing history, portfolio yields, and margin bridges from list price to realized
      revenue.
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current CET1, leverage, liquidity, stress-loss, and product-level credit-loss disclosures.
    whyItMatters: >-
      A deposit-funded lender can look profitable while still being constrained by capital or loss absorption under a
      downturn scenario.
    diligencePath: Request regulatory capital packs, ICAAP-style stress outputs, and loan-book performance by cohort and product.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: core-infrastructure
    missingEvidence: >-
      Named core banking, cloud, data, fraud, and observability vendors plus an up-to-date production architecture
      diagram.
    whyItMatters: >-
      Product breadth is visible, but the durability and scalability of the bank stack cannot be underwritten without
      vendor and systems detail.
    diligencePath: >-
      Request an architecture review with vendor inventory, uptime history, recovery objectives, and engineering
      ownership map.
  - type: private-evidence-only
    severity: material
    topic: current-account-adoption
    missingEvidence: >-
      Biscuit account activation, salary-in usage, average balances, interchange contribution, and primary-banking
      conversion metrics.
    whyItMatters: >-
      The current account is the bridge from multi-product utility to true primary-bank status, but public evidence
      stops at launch narrative and ambition.
    diligencePath: >-
      Request monthly cohort reporting for Biscuit accounts, including funded status, spend activity, direct debits, and
      cross-sell conversion.
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public security certifications, privacy-control evidence, incident history, complaint-resolution KPIs, and
      model-governance documentation for AI features.
    whyItMatters: >-
      Regulated consumer banking requires control quality, not just product breadth, and the assigned public pool is
      thin on externally verifiable control outcomes.
    diligencePath: >-
      Request audit summaries, security certifications, complaints MI, and AI-governance policies before underwriting
      the control environment.
  - type: stale
    severity: material
    topic: customer-scale
    missingEvidence: >-
      Official 2025 or 2026 customer-count, deposit, and active-account disclosure, including current-account traction
      if launched.
    whyItMatters: >-
      The latest independent scale datapoints in the assigned pool are late 2024, which is too old to underwrite present
      adoption velocity or everyday-banking progress cleanly in a 2026 refresh.
    diligencePath: >-
      Request the latest investor update, management KPI pack, or recent FCA/Companies House filing that discloses
      current customers, deposits, and active accounts.
    relatedQuestionRefs:
      - QU002
  - type: private-evidence-only
    severity: material
    topic: retention-kpis
    missingEvidence: GRR, NRR, product-level churn, renewal cohorts, and active-card / active-saver retention by vintage.
    whyItMatters: >-
      Public proxies such as reborrowing, app activity, and fixed-term resave rates are helpful but insufficient to
      prove whether customer economics are compounding across the full franchise.
    diligencePath: >-
      Ask management for cohort retention slides by product, funding cohort, and acquisition channel, including
      primary-bank designation for any current-account base.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-disclosure
    missingEvidence: >-
      Partner-by-partner customer volumes, top-channel contribution, and any top-account or partner concentration
      metrics.
    whyItMatters: >-
      Public evidence confirms multiple channels, but not whether growth is diversified or overly dependent on a few
      distributors or customer clusters.
    diligencePath: >-
      Obtain channel-mix, partner-volume, and gross-profit contribution data from management; test it against
      underwriting and servicing KPIs for John Lewis, Octopus, and comparison-led savings acquisition.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: litigation-visibility
    missingEvidence: >-
      Current FCA, FOS, or court records showing whether Zopa has any live enforcement, complaint, or litigation
      matters.
    whyItMatters: >-
      Legal cleanliness is central to underwriting residual regulatory risk, and the assigned source pack does not clear
      it.
    diligencePath: >-
      Run named searches across FCA enforcement notices, FOS complaint themes, court filings, and Companies House
      disclosures.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: platform-and-partners
    missingEvidence: >-
      Incident history, vendor concentration, cloud concentration, and model-governance evidence for Zopa's in-house
      platform and customer-facing AI.
    whyItMatters: >-
      A bank can look financially healthy while still carrying concentrated operational or conduct risk in its control
      stack.
    diligencePath: Request board risk packs, outage logs, third-party concentration schedules, and model-risk governance materials.
    relatedQuestionRefs:
      - QR006
      - QR007
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: deposit-competition
    missingEvidence: >-
      Deposit beta, promotional funding mix, product-level margin disclosure, and economics for current-account and
      investment rollouts.
    whyItMatters: >-
      Public profitability alone does not show how quickly competition or new products could compress earnings or
      consume capital.
    diligencePath: >-
      Obtain product P&Ls, repricing cohorts, and management sensitivity analysis for rate, retention, and launch
      scenarios.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Current cap table, liquidation preferences, senior debt ranking, option pool overhang, and any ratchets or
      pay-to-play terms.
    whyItMatters: >-
      Public valuation stance can look reasonable while new-money downside recovery is still poor if hidden terms absorb
      value first.
    diligencePath: >-
      Request the latest financing documents, fully diluted cap table, and waterfall model from management and counsel
      before underwriting price.
    relatedQuestionRefs:
      - QV002
      - QV006
      - QV007
  - type: private-evidence-only
    severity: material
    topic: cohort-economics
    missingEvidence: >-
      2025-2026 cohort retention, CAC, LTV, deposit mix, current-account primacy, and credit-loss performance by
      product.
    whyItMatters: >-
      Without those economics, investors cannot tell whether customer and product growth really expands franchise value
      or only buys volume.
    diligencePath: >-
      Request cohort tables, contribution-margin bridges, and product-level credit performance for the last six
      quarters.
    relatedQuestionRefs:
      - QV005
      - QV008
  - type: missing-source
    severity: minor
    topic: security-validation
    missingEvidence: Zopa-specific external security or compliance validation for card, payments, and AI-assisted servicing surfaces.
    whyItMatters: >-
      Expansion into everyday banking and AI increases the importance of operational resilience and control evidence in
      the final investment call.
    diligencePath: >-
      Ask for current audit, certification, and model-governance evidence, plus any material remediation items and
      closure dates.
    relatedQuestionRefs:
      - QV008
