artifact: financials
slug: zopa-bank
runDate: 2026-10-16
company:
  name: Zopa Bank
chapter:
  number: 4
  title: Financials
  summary: >-
    Zopa now looks like a profitable, balance-sheet-led digital bank rather than a venture-subsidized
    fintech experiment: TheBanks.eu shows 2025 assets of GBP 7.24 billion, customer deposits of
    GBP 6.39 billion, and annual profit of GBP 33.38 million. The underwriting case is still
    constrained by missing public disclosure on realized product pricing, CAC, payback, charge-offs,
    and regulatory capital ratios, so the financial verdict is positive on momentum but incomplete on
    precision.
sections:
  - id: revenue-model
    title: Revenue model and monetization surface
    body: >-
      Public evidence points to a straightforward digital-bank model built on retail funding and
      consumer lending rather than a usage-priced SaaS engine. TheBanks.eu lists savings accounts,
      consumer loans, car loans, and credit cards delivered through online banking and a mobile app,
      which frames revenue as interest spread, card economics, and fee income around a direct digital
      channel. TechCrunch adds that management expected revenue "north of" GBP 300 million around the
      end of 2024 and highlighted John Lewis and Octopus Energy partnerships, indicating that Zopa can
      also use partner distribution to originate or embed lending offers. The assigned pool does not
      expose current realized APRs, interchange take rates, or customer-level fee mix, so the revenue
      model is visible at product level but not yet decomposed into margin-quality by line.
    claimRefs: [CI001, CI011, CI014, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: balance-sheet-and-capital
    title: Balance sheet scale, profitability, and capital posture
    body: >-
      Zopa's public 2025 banking metrics show real scale, but also confirm that growth remains tied to
      a regulated lending balance sheet. TheBanks.eu reports GBP 7.24 billion of assets, GBP 6.39
      billion of customer deposits, GBP 3.51 billion of loans to customers, and GBP 33.38 million of
      annual profit in 2025, alongside 0.50% ROA and 5.96% ROE. Companies House shows the 2025 full
      accounts were filed in May 2026 and also records March 2025 capital actions, including a share
      capital reduction and a later allotment filing. Those legal-capital records do not establish
      regulatory capital adequacy. Finovate and TechCrunch both describe a December 2024 equity raise,
      with cumulative funding above USD 1.0 billion and a reported valuation above USD 1.0 billion;
      cumulative funding is not cash available. TechCrunch also reported management saying in 2024
      that Zopa had plenty of cash and GBP 75 million of debt payable years later. That historical
      statement does not establish current cash, debt maturity, runway, CET1, liquidity, or stress-loss
      capacity.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI012]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Margin path, capital intensity, and remaining diligence blockers
    body: >-
      The key financial question is less whether Zopa has scale and more whether its profitability can
      compound while deposit costs and credit capital remain competitive. Moneyfacts said the highest
      UK savings rates on 15 October 2026 ranged from 5.00% to 8.00% AER, so deposit gathering is not
      a free funding source even for an established digital bank. The EBA's credit-risk framework is
      useful context for why bank lending depends on risk weights, default definitions, and capital
      treatment, but the assigned evidence does not establish which EBA provisions apply to this UK
      bank or disclose Zopa's own regulatory ratios. That combination supports a medium-positive view
      on revenue quality and earnings momentum, but a cautious stance on forward margin durability and
      capital adequacy until management discloses product-level CAC, payback, charge-offs, realized
      pricing, and capital ratios.
    claimRefs: [CI015, CI016, CI017]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Savings accounts, "Deposit funding supports interest-earning assets while creating interest expense", "GBP deposits / AER", "Customer deposits were GBP 6.39bn in 2025; current assigned-pool evidence does not expose Zopa's live rate card.", "Funding scale is reported; deposit cost and resulting spread are not.", "Provide current deposit product mix, weighted average cost of deposits, and repricing cadence."]
      - [Personal loans, "Interest income on consumer credit", "GBP loans outstanding / APR", "Loans to customers were GBP 3.51bn in 2025; public assigned-pool evidence confirms product presence but not realized APR or losses.", "Balance-sheet scale is public; unit economics are not.", "Provide product APR ranges, approval mix, vintage loss curves, and net interest margin by cohort."]
      - [Car loans, "Interest income and origination economics", "GBP loans outstanding / APR", "Product category is public, but assigned-pool evidence does not break out balances or margins for auto lending.", "Revenue line exists; economics are opaque.", "Provide auto-loan balances, dealer/partner economics, loss performance, and servicing cost assumptions."]
      - [Credit cards, "Revolving interest, interchange, and fees", "Accounts / balances / APR", "Product category is public, but assigned-pool evidence does not disclose card receivables, pricing, or interchange contribution.", "Monetization path is clear; disclosed data are thin.", "Provide receivables, revolve rates, APR bands, interchange share, and delinquency data."]
      - ["Embedded / partner lending", "Partner-assisted loan origination", "Partner volume / economics", "TechCrunch cites John Lewis and Octopus Energy partnerships, but public economics are undisclosed.", "Channel existence is evidenced; contribution is unknown.", "Provide partner volumes, take rates, marketing support, and renewal terms by channel."]
    notes: "Mix and economics are assembled from public product evidence; unknown means the assigned source pool does not disclose realized pricing, balances, or margin by product."
    claimRefs: [CI001, CI003, CI004, CI014, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price or status
      - List vs realized pricing
      - Source-backed caveat
      - Implication
    rows:
      - [Savings accounts, "Zopa-specific live savings rates are not exposed in the assigned pool.", "Unknown", "Moneyfacts says top UK savings rates on 15 Oct 2026 ranged from 5.00% to 8.00% AER across categories.", "Deposit growth likely requires active pricing discipline against a competitive market."]
      - [Personal loans, "No current public APR table in the assigned pool.", "Unknown", "TechCrunch and TheBanks confirm lending scale but not realized pricing or risk-adjusted yield.", "Revenue quality cannot be decomposed into yield versus credit cost from public evidence alone."]
      - [Credit cards, "No public assigned-pool rate card or fee schedule.", "Unknown", "The assigned pool confirms category presence but not card economics.", "Card contribution to profit remains unmodelled."]
      - [Current account, "TechCrunch said first current-account products were planned for 2025.", "Unknown", "Assigned-pool evidence does not show launch traction, fee model, or primary-banking adoption.", "The expansion thesis is plausible, but everyday-banking monetization remains unproven publicly."]
    notes: "This table separates market benchmarks from Zopa-specific disclosures; unknown means the assigned pool does not provide a current product price card or realized pricing evidence."
    claimRefs: [CI001, CI011, CI015, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value or null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Customer deposits (2025)", "GBP 6.39bn", medium, "Deposit scale is the core funding base for lending and savings spread economics.", "Reconcile deposit mix by product, tenor, and average cost of funds."]
      - ["Loans to customers (2025)", "GBP 3.51bn", medium, "Loan-book size indicates revenue capacity but also capital consumption and credit exposure.", "Break out balances by product, vintage, and expected loss profile."]
      - ["Annual profit (2025)", "GBP 33.38m", medium, "Profitability shows operating leverage, but not whether returns clear cost of capital through the cycle.", "Provide adjusted profit bridge, recurring versus one-off items, and segment profitability."]
      - ["ROA / ROE (2025)", "0.50% / 5.96%", medium, "Returns are positive but still modest for a lender that must absorb credit and funding volatility.", "Provide management targets for ROA, ROE, and CET1 under base and stress cases."]
      - ["Loans-to-deposits ratio (2025)", "54.41%", medium, "The ratio suggests lending headroom versus deposits, but not unused capital or liquidity constraints.", "Provide regulatory liquidity metrics and risk appetite limits."]
      - ["Public revenue run rate", "Revenue 'north of' GBP 300m expected at end-2024", medium, "Shows commercial momentum but is not the same as audited 2025 revenue.", "Provide audited 2025 revenue, product mix, and recognition policy."]
      - [CAC / payback / LTV, null, low, "Customer acquisition efficiency determines whether profitable growth is repeatable at scale.", "Provide CAC by channel, payback period, repeat usage, and LTV by product."]
      - [Charge-offs / NIM / cost to serve, null, low, "Credit losses and servicing cost decide whether deposit-funded growth improves or erodes margins.", "Provide NIM, delinquency and loss curves, servicing cost, and recovery assumptions by product."]
    notes: "Public metrics combine 2025 bank statistics with late-2024 management commentary; null means the assigned source pool does not disclose the metric."
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI011, CI016]
figures:
