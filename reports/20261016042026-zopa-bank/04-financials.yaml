          value: "Online/mobile plus John Lewis and Octopus Energy"
          note: "Digital self-serve is core, with partner-assisted lending channels also referenced publicly."
        - id: products
          label: Lending and card products
          value: "Personal loans, car loans, credit cards"
          note: "The publicly evidenced balance-sheet products that turn funding into earning assets."
        - id: revenue
          label: Revenue generation
          value: "Revenue 'north of' GBP 300m expected at end-2024"
          note: "Public commentary shows scale but not audited 2025 revenue mix."
        - id: profit
          label: Profit conversion
          value: "GBP 33.38m annual profit (2025)"
          note: "Positive earnings are visible, but CAC, losses, and NIM remain undisclosed."
        - id: capital
          label: Capital and risk constraints
          value: "EBA credit-risk capital framework"
          note: "General context only; the evidence does not establish Zopa-specific UK ratios or applicable provisions."
      edges:
        - from: savings
          to: products
          label: "Funding base"
        - from: distribution
          to: products
          label: "Customer acquisition"
        - from: products
          to: revenue
          label: "Interest and fee generation"
        - from: revenue
          to: profit
          label: "Operating conversion"
        - from: capital
          to: products
          label: "Balance-sheet constraint"
    claimRefs: [CI001, CI003, CI011, CI014, CI017]
callouts:
  - calloutType: insight
    title: Profitability is now real, not just promised
    body: >-
      Public 2025 banking metrics show Zopa has crossed from growth story into real operating scale:
      assets, deposits, loans, and profit all increased year over year, and full 2025 accounts were filed
      in May 2026.
    claimRefs: [CI002, CI003, CI004, CI005, CI007]
  - calloutType: risk
    title: Public underwriting is still missing the metrics that decide margin durability
    body: >-
      The assigned pool does not disclose CAC, payback, charge-offs, realized pricing, or regulatory
      capital ratios, so investors can observe momentum but cannot yet underwrite margin resilience with
      high precision.
    claimRefs: [CI015, CI016, CI017]
