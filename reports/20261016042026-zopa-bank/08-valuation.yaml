  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >-
        Current cap table, liquidation preferences, senior debt ranking, option
        pool overhang, and any ratchets or pay-to-play terms.
      whyItMatters: >-
        Public valuation stance can look reasonable while new-money downside
        recovery is still poor if hidden terms absorb value first.
      diligencePath: >-
        Request the latest financing documents, fully diluted cap table, and
        waterfall model from management and counsel before underwriting price.
      relatedQuestionRefs: [QV002, QV006, QV007]
    - type: private-evidence-only
      severity: material
      topic: cohort-economics
      missingEvidence: >-
        2025-2026 cohort retention, CAC, LTV, deposit mix, current-account
        primacy, and credit-loss performance by product.
      whyItMatters: >-
        Without those economics, investors cannot tell whether customer and
        product growth really expands franchise value or only buys volume.
      diligencePath: >-
        Request cohort tables, contribution-margin bridges, and product-level
        credit performance for the last six quarters.
      relatedQuestionRefs: [QV005, QV008]
    - type: missing-source
      severity: minor
      topic: security-validation
      missingEvidence: >-
        Zopa-specific external security or compliance validation for card,
        payments, and AI-assisted servicing surfaces.
      whyItMatters: >-
        Expansion into everyday banking and AI increases the importance of
        operational resilience and control evidence in the final investment call.
      diligencePath: >-
        Ask for current audit, certification, and model-governance evidence,
        plus any material remediation items and closure dates.
      relatedQuestionRefs: [QV008]
