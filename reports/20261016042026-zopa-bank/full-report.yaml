  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show a long arc from P2P pioneer to regulated digital bank broadening into current accounts and
      investments.
    data:
      items:
        - date: '2005'
          label: Founded as a peer-to-peer lender
          detail: Official and independent sources agree Zopa started in 2005 and pioneered UK peer-to-peer consumer lending.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2016'
          label: Started building banking services
          detail: Sifted says Zopa began developing banking services in 2016 to secure more stable loan-book funding.
          tone: neutral
          claimRefs:
            - CO002
        - date: Jun 2020
          label: Launched Zopa Bank
          detail: >-
            The company says it launched Zopa Bank in June 2020; independent coverage also marks 2020 as the bank pivot
            year.
          tone: positive
          claimRefs:
            - CO002
        - date: '2021'
          label: Closed P2P and reached unicorn valuation
          detail: >-
            Official history says the P2P business was shut in 2021, while TechCrunch ties the same year to a $300m
            round and first $1bn valuation.
          tone: neutral
          claimRefs:
            - CO003
            - CO011
        - date: '2023'
          label: Acquired DivideBuy
          detail: Zopa says it bought DivideBuy in 2023 to support a regulated BNPL 2.0 proposition.
          tone: positive
          claimRefs:
            - CO004
        - date: '2024'
          label: Reached profitability and raised fresh capital
          detail: >-
            Sifted cites £15.8m pre-tax profit on 2023 results, while TechCrunch and Finovate report the late-2024
            equity round led by A.P. Moller Holding.
          tone: positive
          claimRefs:
            - CO010
            - CO012
        - date: '2025'
          label: Expanded into everyday banking
          detail: Official pages say Zopa launched the Biscuit current account in 2025.
          tone: positive
          claimRefs:
            - CO005
        - date: 2025-11
          label: Reset board and headquarters footprint
          detail: >-
            Companies House records three director departures, one director appointment, and a registered-office move to
