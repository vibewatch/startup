      - number: '1.2'
        title: Leadership, governance, and capital base
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is clearest around current spokespeople and formal Companies House filings
              rather than a fully surfaced founder roster. Jaidev Janardana is the recurring executive voice in
              financing coverage, while Chief Strategy Officer Merve Ferrero fronted the investments launch, indicating
              that strategy and product adjacency are concentrated in a small visible bench. Governance filings show
              meaningful turnover: Giles Andrews, Scott Jones, and Marina Troshina left director roles in late 2025; Max
              Ohrstrand joined at the same point; and Paula Walter plus Bruce Fletcher were appointed in September 2026.
              Capital records also show a December 2024 share allotment and March 2025 capital-reduction paperwork,
              which signals cap-table activity that outside reporting does not fully unpack. That makes management
              access important for board rights, preference terms, and any remaining founder influence after the 2025
              board reshuffle.
