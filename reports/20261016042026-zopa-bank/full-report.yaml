    into a regulated bank in 2020. It now sells savings, personal loans, credit cards, car finance, a Biscuit current
    account, and newer investment products through an app-led proposition backed by both direct acquisition and partner
    distribution. Public evidence shows a real retail franchise with rising deposits, loans, and profit, but the cap
    table, current headcount, primary-banking conversion, and detailed unit economics remain only partly disclosed.
