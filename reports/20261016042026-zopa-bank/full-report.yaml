  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence shows a consumer journey built around comparison-led discovery, app-led servicing, and
      partner-assisted expansion rather than enterprise account selling.
    data:
      items:
        - label: Compare rates or credit options
          phase: Discovery
          actor: Prospect
          channel: Rate tables, aggregators, media, and brand search
          touchpoints:
            - Smart Saver customers typically find Zopa through rate tables or other aggregators.
            - Moneyfactscompare and This is Money both operate prominent UK savings-table surfaces.
          tone: neutral
        - label: Open savings or borrowing product digitally
          phase: Onboarding
          actor: Consumer saver or borrower
          channel: Zopa website and app
          touchpoints:
            - The 2020 launch positioned fixed-term savings as the first bank product.
            - Zopa built transparent guaranteed-rate borrowing and fast digital decisions into onboarding.
          tone: positive
        - label: Use the app as the servicing hub
          phase: Activation
          actor: Existing customer
          channel: Zopa app
          touchpoints:
            - 60.8% of customers were actively using the app at year-end 2023.
            - Borrowing Power, spending analytics, and open-banking features aim to keep usage inside the app.
          tone: positive
        - label: Reborrow or cross-sell into adjacent products
          phase: Expansion
          actor: Existing borrower or saver
          channel: App prompts, product launches, and in-product tools
          touchpoints:
            - 36% of customers reborrowed in FY2023.
            - Smart ISA and card products extend the relationship beyond one initial product.
          tone: positive
        - label: Reach customers through partner distribution
          phase: Scale
          actor: Partner-referred prospect
          channel: John Lewis, Octopus Energy, and other partnerships
          touchpoints:
            - TechCrunch names John Lewis and Octopus Energy as distribution examples.
            - The annual report says Zopa diversified channels through partnerships.
          tone: neutral
        - label: Retain deposits and resolve service issues
          phase: Retention
          actor: Customer with live account or loan
          channel: Savings renewal and support interactions
          touchpoints:
            - Fixed-term resave rate was 33% in 2023.
            - >-
              Reviews.io complaints show account-access and fraud-resolution risk even as official NPS and app-store
              metrics stay strong.
          tone: warning
    claimRefs:
      - CU004
      - CU006
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual-risk cluster is regulatory scope expansion, followed by savings-margin pressure and platform
      execution.
    data:
      columns:
        - label: Likelihood
          detail: Probability over the next 12-24 months under the current public roadmap.
        - label: Impact
          detail: Potential downside to growth, margin, or supervisory posture if the risk crystallizes.
        - label: Residual severity
          detail: Net severity after the mitigations visible in public sources.
      rows:
        - label: Regulatory scope expansion
          note: >-
            Investment support, current-account features, and broader conduct obligations widen the compliance
            perimeter.
          values:
            - label: High
              tone: warning
              detail: New approvals and active rulemaking make near-term change likely.
            - label: High
              tone: negative
              detail: Delays, remediation, or tighter supervision would directly hit the scale thesis.
            - label: Medium-High
              tone: warning
              detail: Bank status and governance help, but the source pack does not clear control details.
        - label: Savings-margin pressure
          note: Zopa depends on competitive savings pricing while market-leading rates move quickly.
          values:
            - label: High
              tone: warning
              detail: Moneyfacts shows a live 5.00%-8.00% AER market with changeable availability.
            - label: High
              tone: negative
              detail: Deposit repricing can compress earnings even if customer growth continues.
            - label: Medium-High
              tone: warning
              detail: Profitability cushions the downside, but public margin sensitivity is still opaque.
        - label: Platform and AI execution
          note: In-house technology and front-office AI widen both resilience and conduct stakes.
          values:
            - label: Medium-High
              tone: warning
              detail: Expansion is visible, but public incident and control metrics are not.
            - label: High
              tone: negative
              detail: A material outage or control failure would damage trust and supervisory confidence.
            - label: Medium
              tone: neutral
              detail: Board reinforcement is helpful, yet evidence of operational readiness remains incomplete.
        - label: Capital access and IPO optionality
          note: The company remains fundable, but public evidence still frames IPO timing as market-dependent.
          values:
            - label: Medium
              tone: neutral
              detail: Cash and recent equity reduce urgency, but capital-market conditions still matter.
            - label: Medium-High
              tone: warning
              detail: A shut IPO window can limit strategic flexibility or raise dilution risk.
            - label: Medium
              tone: neutral
              detail: Profitability and recent funding materially offset the downside.
        - label: Partner and channel dependence
          note: Multiple partners are visible, but public sources do not disclose volume share by channel.
          values:
            - label: Medium
              tone: warning
              detail: Partner execution or renewal risk is plausible but not yet evidenced as acute.
            - label: Medium
              tone: warning
              detail: Lost distribution would hurt origination velocity more than franchise viability.
            - label: Medium
              tone: neutral
              detail: Multiple public partners lower single-counterparty dependence.
        - label: Litigation and enforcement visibility
          note: The public legal search surface is clear, but this source pack does not clear the company.
          values:
            - label: Medium
              tone: warning
              detail: The risk is unresolved because case-level evidence is absent, not because it is disproved.
            - label: Medium-High
              tone: warning
              detail: A hidden legal or enforcement issue would affect trust, cost, and diligence timing.
            - label: Medium
              tone: warning
              detail: Residual risk stays elevated until named regulatory and court checks are complete.
    approximationNotes: >-
      Qualitative ratings are synthesized from sourced facts about scope, funding, pricing, and disclosed mitigations
      rather than from an externally published heatmap.
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR009
      - CR011
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public operating proof is real, but stale pricing and missing downside terms block an outright pay-up
      recommendation.
    data:
      nodes:
        - id: proof
          label: Operating proof
          detail: >-
            Profitable by 2024, with revenues north of GBP300 million and more than GBP5 billion of deposits in
            late-2024 reporting.
          tone: positive
        - id: traction
          label: 2026 traction signals
          detail: Homepage now shows over 1.5 million customers and ongoing product expansion through Biscuit and Ask.
          tone: positive
        - id: pricing
          label: Last public price anchor
          detail: >-
            The clearest mark is still the late-2024 round, reported at more than $1 billion rather than refreshed in
            2026.
          tone: neutral
        - id: market
          label: Market and exit caution
          detail: IPO is not a priority, and UK savings competition remains intense on headline rates.
          tone: risk
        - id: diligence
          label: Missing downside terms
          detail: >-
            Public evidence still lacks the current preference stack, liquidation waterfall, and detailed 2025-2026
            cohort economics.
          tone: risk
        - id: call
          label: Recommendation
          detail: Track with price discipline; do not pay materially above the last disclosed unicorn mark without new proof.
          tone: opportunity
      edges:
        - from: proof
          to: pricing
          relationship: Strong business quality keeps the old anchor credible.
        - from: traction
          to: pricing
          relationship: New product and customer signals support upside potential.
        - from: pricing
          to: call
          relationship: A stale mark can only support a disciplined entry.
        - from: market
          to: call
          relationship: Delayed liquidity lowers willingness to pay ahead of proof.
        - from: diligence
          to: call
          relationship: Hidden terms and missing economics increase overpay risk.
    approximationNotes: >-
      This flow is an analytical synthesis of retained public evidence rather than a company-provided valuation
      framework.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV008
      - CV009
      - CV012
      - CV015
