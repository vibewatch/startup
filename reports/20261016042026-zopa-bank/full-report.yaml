      - number: '1.3'
        title: Funding trajectory, operating momentum, and open diligence points
        blocks:
          - type: paragraph
            body: >-
              Independent reporting frames Zopa as a profitable but still execution-sensitive private unicorn.
              TechCrunch and Finovate both described the late-2024 round as a fresh equity raise led by A.P. Moller
              Holding, while Sifted added the sharper caution that revenue remains highly concentrated in lending and
              that the current-account rollout was still limited to roughly 10,000 users at the time of its reporting.
              The same independent sources also show IPO timing slipping from earlier ambition to a
              wait-for-better-markets posture. Combined with the 2025-2026 governance changes and a UK savings market
              where headline rates reached 5.00% to 8.00% AER in October 2026, the core diligence question is not
              whether Zopa has product momentum, but whether it can diversify revenue and deepen primary-banking usage
              without losing the credit discipline that drove profitability.
