  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Biscuit becomes a meaningful primary-banking product, Ask lifts engagement and cross-sell, and profitability
          scales beyond the late-2024 run rate without sacrificing credit quality.
        - >-
          A premium to the late-2024 unicorn mark becomes supportable, but only after updated disclosures or a new
          independent price signal.
        - >-
          Current-account adoption disappoints, or AI-led servicing adds cost and governance burden without revenue
          leverage.
        - New funding at better terms, disclosed cohort economics, and faster multi-product penetration.
      - - Base
        - >-
          Zopa keeps compounding customers and deposits, but economics remain good rather than dramatically better, and
          exit timing stays deferred.
        - >-
          Value clusters around the last disclosed private anchor, making returns price-dependent rather than
          story-dependent.
        - Rate competition compresses spread economics, and private-market liquidity remains selective.
        - Stable profitability, steady customer growth, and no fresh re-mark.
      - - Bear
        - >-
          Competitive savings pricing, weaker primary-account adoption, or credit and compliance surprises force a
          funding round before the broader exit window improves.
        - >-
          A flat or down round becomes plausible because the market still lacks proof that expansion materially raises
          franchise value.
        - Hidden preference terms, weaker losses, or stalled product traction impair downside recovery for new money.
        - >-
          Capital raising above the old mark without new proof, or management refusal to open the waterfall and cohort
          pack.
    notes: >-
      Scenario logic is qualitative by design: public sources give one disclosed late-2024 anchor, not a clean enough
      input set for a precise DCF or peer- multiple output.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV012
      - CV015
