              - CR006
              - CR009
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.3'
        title: The public record is enough to rank risks, not enough to clear them
        blocks:
          - type: paragraph
            body: >-
              The right reading of the current source pack is disciplined uncertainty. Public evidence supports a
              credible risk ranking and shows management has already navigated one major model pivot away from
              peer-to-peer lending, but it does not settle the open items that matter most for downside protection. The
              courts' public judgments archive gives diligence a concrete legal search path, yet this package still
              lacks case-level litigation records, incident-rate history, vendor concentration, deposit beta, and
              detailed economics for newer current-account and investment products. Investors should therefore treat
              regulatory remediation, renewed dependence on external capital, sustained savings-rate pressure, or a
              material platform or AI-control incident as explicit kill criteria until management evidence narrows those
              gaps.
            claimRefs:
              - CR010
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory expansion is the key kill-criteria bucket
            body: >-
              Zopa's next leg of growth adds investment support, broader everyday-banking functionality, and AI-led
              customer interactions faster than the public record proves the supporting control stack.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: callout
            title: Profitability lowers survival risk, not execution risk
            body: >-
              The strongest public mitigation is that Zopa is already profitable and still able to raise capital, but
              the unresolved downside has shifted toward conduct, margin, partner, and platform execution.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor and recommendation
        blocks:
          - type: paragraph
            body: >-
              The strongest public anchor is still the late-2024 financing, when TechCrunch reported that Zopa raised
              €82 million and was valued at well over $1 billion, while Finovate separately summarized the round as $87
              million and said total funding reached $1.067 billion. That anchor is not obviously broken: the same
              reporting described a profitable bank with more than GBP5 billion of deposits, around 1.3-1.4 million
              customers, and more than GBP300 million of revenue. But it is also not obviously conservative, because
              management said an IPO was not a priority and would wait for better market conditions, so public-market
              liquidity is not a near-term support for a premium re-mark. My recommendation is therefore track rather
              than chase: Zopa looks investable as a business, but public evidence does not justify paying materially
              above the last disclosed unicorn round without fresh operating proof and downside-term visibility.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
              - CV012
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and scenario boundaries
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward: Zopa now presents itself as a broader everyday-banking platform rather than
              a narrow lending business, the brand continues to accumulate customer-facing awards, and the customer base
              has moved from the 1.3-1.4 million range cited around the 2024 financing to "over 1.5 million" on the
              current homepage. Those signals support the case for durable franchise value if Biscuit current accounts
              and the Ask AI layer increase primary-account usage. The anti-thesis is equally clear: savings competition
              remains intense, with Moneyfacts showing 5.00%-8.00% AER headline rates in the UK market in October 2026,
              and the best regular saver offers often require a current account while still capping balances. That means
              headline product quality does not automatically convert into high-value, sticky deposits or a clean
              premium multiple. The practical conclusion is to frame bull, base, and bear cases around execution and
              proof of economics rather than around unsupported valuation math.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: Comparable context, diligence asks, and thesis breakers
        blocks:
          - type: paragraph
            body: >-
              Public comparables do not fully solve the pricing problem. A key UK neobank peer, Monzo, is still an
              active private limited company, which keeps an important peer inside private-market opacity rather than
              giving investors a live public valuation benchmark. The assigned SoftBank source also failed to provide a
              current Zopa-specific portfolio mark in fetched text, so the prior-investor trail does not tighten today's
              downside case. For final diligence, investors should ask for the current preference stack, liquidation
              waterfall, 2025-2026 customer-cohort economics, current-account primacy metrics, credit-loss performance
              by product, and explicit security and compliance validation for the card and AI surfaces. The thesis
              breaks if Zopa needs to raise above the last disclosed mark without new proof, if Biscuit fails to become
              a primary-banking relationship, or if product and AI expansion outpace governance and compliance evidence.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Track the company and engage only with price discipline; the business quality is credible, but public
              evidence still does not support paying up beyond the last disclosed unicorn mark.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV012
          - type: callout
            title: The main downside is not franchise collapse but overpay risk
            body: >-
              The current public record supports scale and profitability, yet leaves the preference stack, current
              economics, and exit timing too opaque to treat the last private mark as a floor.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
          - type: callout
            title: Everyday-banking expansion must deepen relationship value
            body: >-
              Biscuit and Ask only justify upside if they convert customers into higher-frequency, more durable banking
              relationships rather than adding lightly monetized feature usage.
            calloutType: assumption
            claimRefs:
              - CV001
              - CV002
              - CV015
