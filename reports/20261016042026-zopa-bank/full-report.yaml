  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory scope expansion is the top residual risk
        blocks:
          - type: paragraph
            body: >-
              Zopa's biggest public-market risk signal is not near-term solvency; it is the pace at which the bank is
              widening its supervisory surface. By May 2026, Zopa said it had regulatory approval to offer targeted
              support for investment products, and its broader roadmap already spans savings, lending, cards,
              current-account features, and AI-led customer support. That growth sits inside a UK framework that still
              gives the Treasury and regulators broad room to reshape rules in the name of stability, safety, soundness,
              competition, and consumer protection. New independent non-executive directors are a credible mitigation,
              but the assigned source pack does not expose the underlying approval conditions, control design, or
              supervisory feedback, so regulatory execution remains the most important thesis-break category to monitor.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
