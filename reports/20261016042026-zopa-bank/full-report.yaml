          - type: callout
            title: Customer-satisfaction proof is directionally positive but not clean
            body: >-
              The filing reports strong NPS and app-store ratings, yet Reviews.io shows sharply negative service
              anecdotes and a low aggregate score, so investor diligence should test complaints handling and fraud
              operations directly.
            calloutType: risk
            claimRefs:
