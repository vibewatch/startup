  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Zopa is now UK retail digital banking across savings, unsecured lending, credit
              cards, current accounts, and adjacent money-management products rather than the peer-to-peer niche where
              the company started. TechCrunch reported that regulation, reduced returns, and high-profile exits after
              Covid made the P2P model harder, while Computer Weekly separately noted that Zopa became a bank in 2020
              and dropped P2P a year later. That shift changes the substitute set: buyers can stay with incumbent banks,
              use challenger-bank current accounts as secondary providers, or pick point solutions for savings and
              credit. Even digitally native substitutes still sit inside the banking perimeter; for example, Companies
              House classifies Monzo Bank Limited under SIC 64191 - Banks.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM007
              - CM008
              - CM015
      - number: '2.2'
        title: Sizing lenses and buyer map
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several constrained market lenses, but not one clean bottom-up market model.
              Zopa's own disclosed scale — 1.7 million customers, £6.4 billion of deposits, and £3.8 billion of gross
              loans in 2025 — is the clearest observed SOM proxy. Beyond that, the company frames incremental
              opportunity through cross-sell and distribution: FF News said more than one in four customers already hold
              multiple products, Financial IT said the John Lewis lending partnership can reach 23 million customers,
              and both company-linked releases point to a £23 billion renewable-energy adjacency through Octopus and 15
              million Brits with excess cash as the investment-market wedge. These lenses are useful, but they are not
              additive and they mix people, partner audiences, and sector value pools.
            claimRefs:
