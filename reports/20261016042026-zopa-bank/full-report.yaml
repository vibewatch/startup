      - number: '4.2'
        title: Balance sheet scale, profitability, and capital posture
        blocks:
          - type: paragraph
            body: >-
              Zopa's public 2025 banking metrics show real scale, but also confirm that growth remains tied to a
              regulated lending balance sheet. TheBanks.eu reports GBP 7.24 billion of assets, GBP 6.39 billion of
              customer deposits, GBP 3.51 billion of loans to customers, and GBP 33.38 million of annual profit in 2025,
              alongside 0.50% ROA and 5.96% ROE. Companies House shows the 2025 full accounts were filed in May 2026 and
              also records March 2025 capital actions, including a share capital reduction and a later allotment filing.
              Those legal-capital records do not establish regulatory capital adequacy. Finovate and TechCrunch both
              describe a December 2024 equity raise, with cumulative funding above USD 1.0 billion and a reported
              valuation above USD 1.0 billion; cumulative funding is not cash available. TechCrunch also reported
              management saying in 2024 that Zopa had plenty of cash and GBP 75 million of debt payable years later.
              That historical statement does not establish current cash, debt maturity, runway, CET1, liquidity, or
              stress-loss capacity.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI011
              - CI016
      - number: '4.3'
        title: Margin path, capital intensity, and remaining diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The key financial question is less whether Zopa has scale and more whether its profitability can compound
              while deposit costs and credit capital remain competitive. Moneyfacts said the highest UK savings rates on
              15 October 2026 ranged from 5.00% to 8.00% AER, so deposit gathering is not a free funding source even for
              an established digital bank. The EBA's credit-risk framework is useful context for why bank lending
              depends on risk weights, default definitions, and capital treatment, but the assigned evidence does not
              establish which EBA provisions apply to this UK bank or disclose Zopa's own regulatory ratios. That
              combination supports a medium-positive view on revenue quality and earnings momentum, but a cautious
              stance on forward margin durability and capital adequacy until management discloses product-level CAC,
              payback, charge-offs, realized pricing, and capital ratios.
            claimRefs:
              - CI015
              - CI016
              - CI017
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Profitability is now real, not just promised
            body: >-
              Public 2025 banking metrics show Zopa has crossed from growth story into real operating scale: assets,
              deposits, loans, and profit all increased year over year, and full 2025 accounts were filed in May 2026.
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
          - type: callout
            title: Public underwriting is still missing the metrics that decide margin durability
            body: >-
              The assigned pool does not disclose CAC, payback, charge-offs, realized pricing, or regulatory capital
              ratios, so investors can observe momentum but cannot yet underwrite margin resilience with high precision.
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
              - CI017
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Public reporting consistently shows Zopa operating as a multi-product digital bank rather than a
              single-product lender. Across independent coverage, the product set includes savings, personal loans,
              credit cards, and vehicle finance, while Mar 2026 reporting adds the Biscuit current account as the
              everyday-banking wedge intended to deepen customer relationships [CE001][CE002][CE003]. That breadth
              matters because the company is already showing early cross-sell rather than pure logo growth: one in four
              customers held more than one product, and management explicitly framed success as becoming the customer's
              primary bank rather than a side-account utility [CE004][CE005]. The evidence therefore supports a workflow
              built around consolidating borrowing, saving, and day-to-day cash management inside one app, but it does
              not yet prove how many Biscuit accounts have become true salary-in/salary-out primary relationships.
            claimRefs:
              - CE001
