chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and present scale
        blocks:
          - type: paragraph
            body: >-
              Zopa positions itself as a UK-focused digital bank built on a much older peer-to-peer lending base.
              Official pages say the company was founded in 2005, launched Zopa Bank in June 2020, and now pairs
              savings, personal loans, credit cards, car finance, current accounts, and new investment products inside
              one app-led proposition. That mix matters because the business model is no longer a single lending product
              story: Biscuit expands everyday banking, while the 2025 investments launch extends toward wealth products.
              Scale evidence is directionally strong but not perfectly harmonized: current official copy says over 1.5
              million people use Zopa, while late-2025 product-launch communications said 1.6 million customers and more
              than £6 billion of savings, and late-2024 press reporting used 1.3 million to 1.4 million customers with
              £5 billion of deposits.
            claimRefs:
