      - number: '5.2'
        title: Operating model and technical organization
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence is much stronger on operating model than on named vendors. In Dec 2024 TechCrunch
              reported that Zopa built its platform itself from the ground up rather than mainly stitching together
              fintech-as-a-service APIs, and that this same platform supports partner-distributed lending through
              Octopus Energy and John Lewis [CE006][CE007]. Current recruiting also points to a materially in-house
              delivery organization: open roles span engineering leadership, cards engineering, platform and database
              engineering, Android, iOS, web, analytics, data privacy, and complaints operations, with product build
              concentrated in London and Manchester and distribution roles extending into regional auto channels
              [CE008][CE009]. That combination suggests Zopa's architecture likely couples product engines,
              decisioning/data, and control functions under one bank stack, but the public worker pool still does not
              disclose the actual core banking, cloud, observability, or fraud vendors used in production.
            claimRefs:
