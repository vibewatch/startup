      - number: '2.3'
        title: Drivers, constraints, and open sizing gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are clear: current accounts deepen share of wallet, savings remain a tangible acquisition
              hook, and the existing customer base creates a lower-friction cross-sell path than pure greenfield
              acquisition. Computer Weekly explicitly linked current accounts to building a wider customer relationship,
              while Moneyfacts showed that top UK savings rates still ranged from 5.00% AER to 8.00% AER as of 15
              October 2026, underscoring a competitive, rate-led environment. Constraints are equally structural. The
              NCA says large volumes of criminal money can trigger criminal and regulatory penalties for institutions,
              and Zopa's own expansion required an £80 million AT1 raise plus continued Companies House reporting and
              capital filings. The unresolved public gap is that none of the assigned sources isolate Zopa-specific SAM,
              SOM by product, or Biscuit primary-banking conversion.
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-sell is the cleanest public market lens
            body: >-
              The strongest disclosed market path is deepening wallet share inside Zopa's existing base, not proving a
              greenfield TAM from a single headline number.
            calloutType: insight
            claimRefs:
              - CM005
              - CM013
          - type: callout
            title: Primary-account conversion and compliance intensity still gate adoption
            body: >-
              Current accounts can raise relationship depth, but rate competition, AML obligations, and capital
              requirements can slow conversion from secondary-product usage to primary-bank status.
