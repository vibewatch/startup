              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-product consumer base is real, not just a logo wall
            body: >-
              Zopa discloses meaningful scale across savings, cards, and lending rather than a single-product wedge, and
              its late-2024 public scale suggests the customer base kept growing after profitability.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU013
          - type: callout
            title: Acquisition appears diversified before concentration is disclosed
            body: >-
              Public evidence points to app, comparison-table, and partner routes into the franchise, but Zopa does not
              disclose how much customer volume or gross profit each route contributes.
            calloutType: insight
            claimRefs:
              - CU007
              - CU009
