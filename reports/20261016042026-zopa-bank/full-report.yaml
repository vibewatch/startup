              - CR008
              - CR009
              - CR011
              - CR014
      - number: '7.2'
        title: Profitability helps, but pricing and execution sensitivity remain real
        blocks:
          - type: paragraph
            body: >-
              Zopa's FY2023 profit, operating-income growth, and repeated access to capital materially reduce immediate
              survival risk, and TechCrunch reported that management still had plenty of cash with only modest debt due
              years later. That said, the business remains exposed to margin compression and execution drift. Zopa
              itself emphasized competitive savings pricing as a growth tool, while Moneyfacts showed leading UK savings
              offers at 5.00%-8.00% AER in October 2026 with availability able to change at any time. The company is
              also leaning harder into an in-house platform, AI interfaces, and partner-led origination through names
              such as John Lewis, Octopus Energy, and Hive, which broadens operational, conduct, and dependency risk
              even if it expands distribution.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
