company:
  name: Zopa Bank
chapter:
  number: 7
  title: Risks
  summary: Zopa's highest residual risks are regulatory-scope expansion, margin sensitivity in a highly competitive savings market, and execution risk as it pushes an in-house platform, AI features, and partner distribution into more regulated use cases. Public evidence shows stronger mitigations than in many neobanks, but it does not yet clear litigation, control-architecture, or product-economics diligence.
sections:
  - id: ranked-risk-view
    title: Regulatory scope expansion is the top residual risk
    body: >-
      Zopa's biggest public-market risk signal is not near-term solvency; it is
      the pace at which the bank is widening its supervisory surface. By May
      2026, Zopa said it had regulatory approval to offer targeted support for
      investment products, and its broader roadmap already spans savings,
      lending, cards, current-account features, and AI-led customer support.
      That growth sits inside a UK framework that still gives the Treasury and
      regulators broad room to reshape rules in the name of stability, safety,
      soundness, competition, and consumer protection. New independent
      non-executive directors are a credible mitigation, but the assigned source
      pack does not expose the underlying approval conditions, control design,
      or supervisory feedback, so regulatory execution remains the most
      important thesis-break category to monitor.
    claimRefs: [CR004, CR005, CR006, CR007, CR015, CR016]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operating-and-dependency-risks
    title: Profitability helps, but pricing and execution sensitivity remain real
    body: >-
      Zopa's FY2023 profit, operating-income growth, and repeated access to
      capital materially reduce immediate survival risk, and TechCrunch reported
      that management still had plenty of cash with only modest debt due years
      later. That said, the business remains exposed to margin compression and
      execution drift. Zopa itself emphasized competitive savings pricing as a
      growth tool, while Moneyfacts showed leading UK savings offers at
      5.00%-8.00% AER in October 2026 with availability able to change at any
      time. The company is also leaning harder into an in-house platform, AI
      interfaces, and partner-led origination through names such as John Lewis,
      Octopus Energy, and Hive, which broadens operational, conduct, and
      dependency risk even if it expands distribution.
    claimRefs: [CR001, CR002, CR003, CR008, CR009, CR011, CR012, CR013, CR014]
    tableRefs: [TR002, TR003]
  - id: diligence-and-kill-criteria
    title: The public record is enough to rank risks, not enough to clear them
    body: >-
      The right reading of the current source pack is disciplined uncertainty.
      Public evidence supports a credible risk ranking and shows management has
      already navigated one major model pivot away from peer-to-peer lending,
      but it does not settle the open items that matter most for downside
      protection. The courts' public judgments archive gives diligence a
      concrete legal search path, yet this package still lacks case-level
      litigation records, incident-rate history, vendor concentration, deposit
      beta, and detailed economics for newer current-account and investment
      products. Investors should therefore treat regulatory remediation,
      renewed dependence on external capital, sustained savings-rate pressure,
      or a material platform or AI-control incident as explicit kill criteria
      until management evidence narrows those gaps.
    claimRefs: [CR010, CR015, CR016]
