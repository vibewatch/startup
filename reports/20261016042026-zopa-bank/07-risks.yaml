        - Medium
    notes: Public sources identify named channels and funders but do not disclose share-of-volume by partner, so concentration should be treated as directionally assessed.
    claimRefs: [CR003, CR008, CR009, CR012, CR013]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The highest residual-risk cluster is regulatory scope expansion, followed by savings-margin pressure and platform execution.
    data:
      columns:
        - label: Likelihood
          detail: Probability over the next 12-24 months under the current public roadmap.
        - label: Impact
          detail: Potential downside to growth, margin, or supervisory posture if the risk crystallizes.
        - label: Residual severity
          detail: Net severity after the mitigations visible in public sources.
      rows:
        - label: Regulatory scope expansion
          note: Investment support, current-account features, and broader conduct obligations widen the compliance perimeter.
          values:
            - label: High
              tone: warning
              detail: New approvals and active rulemaking make near-term change likely.
            - label: High
              tone: negative
              detail: Delays, remediation, or tighter supervision would directly hit the scale thesis.
            - label: Medium-High
              tone: warning
              detail: Bank status and governance help, but the source pack does not clear control details.
        - label: Savings-margin pressure
          note: Zopa depends on competitive savings pricing while market-leading rates move quickly.
          values:
            - label: High
              tone: warning
              detail: Moneyfacts shows a live 5.00%-8.00% AER market with changeable availability.
            - label: High
              tone: negative
              detail: Deposit repricing can compress earnings even if customer growth continues.
            - label: Medium-High
              tone: warning
              detail: Profitability cushions the downside, but public margin sensitivity is still opaque.
        - label: Platform and AI execution
          note: In-house technology and front-office AI widen both resilience and conduct stakes.
          values:
            - label: Medium-High
              tone: warning
              detail: Expansion is visible, but public incident and control metrics are not.
            - label: High
              tone: negative
              detail: A material outage or control failure would damage trust and supervisory confidence.
            - label: Medium
              tone: neutral
              detail: Board reinforcement is helpful, yet evidence of operational readiness remains incomplete.
        - label: Capital access and IPO optionality
          note: The company remains fundable, but public evidence still frames IPO timing as market-dependent.
          values:
            - label: Medium
              tone: neutral
              detail: Cash and recent equity reduce urgency, but capital-market conditions still matter.
            - label: Medium-High
              tone: warning
              detail: A shut IPO window can limit strategic flexibility or raise dilution risk.
            - label: Medium
              tone: neutral
              detail: Profitability and recent funding materially offset the downside.
        - label: Partner and channel dependence
          note: Multiple partners are visible, but public sources do not disclose volume share by channel.
          values:
            - label: Medium
              tone: warning
              detail: Partner execution or renewal risk is plausible but not yet evidenced as acute.
            - label: Medium
              tone: warning
              detail: Lost distribution would hurt origination velocity more than franchise viability.
            - label: Medium
              tone: neutral
              detail: Multiple public partners lower single-counterparty dependence.
        - label: Litigation and enforcement visibility
          note: The public legal search surface is clear, but this source pack does not clear the company.
          values:
            - label: Medium
              tone: warning
              detail: The risk is unresolved because case-level evidence is absent, not because it is disproved.
            - label: Medium-High
              tone: warning
              detail: A hidden legal or enforcement issue would affect trust, cost, and diligence timing.
            - label: Medium
              tone: warning
              detail: Residual risk stays elevated until named regulatory and court checks are complete.
    approximationNotes: Qualitative ratings are synthesized from sourced facts about scope, funding, pricing, and disclosed mitigations rather than from an externally published heatmap.
    claimRefs: [CR004, CR006, CR008, CR009, CR011, CR014]
callouts:
  - calloutType: risk
    title: Regulatory expansion is the key kill-criteria bucket
    body: Zopa's next leg of growth adds investment support, broader everyday-banking functionality, and AI-led customer interactions faster than the public record proves the supporting control stack.
    claimRefs: [CR004, CR005, CR006, CR007]
  - calloutType: insight
    title: Profitability lowers survival risk, not execution risk
    body: The strongest public mitigation is that Zopa is already profitable and still able to raise capital, but the unresolved downside has shifted toward conduct, margin, partner, and platform execution.
    claimRefs: [CR001, CR002, CR003, CR008, CR009, CR014]
