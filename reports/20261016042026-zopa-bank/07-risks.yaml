  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Retail funding competitiveness
        - UK savings market / depositors
        - Core funding source
        - High exposure to rate-sensitive retail savings flows
        - Repricing or outflows force margin sacrifice or slower balance-sheet growth
        - High
        - Profitability, product breadth, and brand trust
        - Medium-High
      - - Capital-market and investor access
        - Existing shareholders and debt providers
        - Buffer for growth and optionality
        - Moderate; recent equity and prior tiered capital support are visible
        - Weaker funding markets limit optional capital or delay IPO/strategic flexibility
        - Medium-High
        - FY2023 profit, capital raises, and 2024 equity round
        - Medium
