  topStrengths:
    - Real profitable scale with rising deposits, loans, and earnings momentum.
    - Broad consumer-banking product set with visible cross-sell and partner distribution.
    - Brand and platform breadth that support expansion into current accounts and investments.
  topRisks:
    - Savings-margin pressure in a highly competitive UK rate market.
    - Primary-banking conversion and product economics remain only partially proven publicly.
    - Regulatory, control, and platform-execution risk rises as the product surface widens.
  unresolvedGaps:
    - Full preference stack and liquidation waterfall remain undisclosed.
    - Product-level CAC, payback, loss curves, and realized pricing are still not public.
    - Biscuit primary-account adoption and share of wallet are not disclosed.
    - Detailed vendor stack, incident history, and current headcount remain opaque.
    - Current regulatory capital ratios and stress metrics are not publicly broken out.
