evidenceGaps:
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: >-
      A current priced-equity transaction or primary valuation document after the provider-reported 2023 and 2024
      anchors.
    whyItMatters: Stale and differently defined provider values cannot establish Cabify's current equity value.
    diligencePath: Request the latest financing documents, current diluted share count, and post-money capitalization schedule.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: ownership-and-control
    missingEvidence: Current diluted ownership, liquidation preferences, voting rights, reserved matters, and debt seniority.
    whyItMatters: >-
      Enterprise value cannot be translated into investor economics or governance control without instrument-level
      terms.
    diligencePath: Obtain the cap table, shareholder agreement, board minutes, and debt term sheets from management.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: workforce-and-funding
    missingEvidence: Primary records reconciling employee definitions and cumulative equity-versus-debt funding totals.
    whyItMatters: Provider differences can materially overstate operating scale and capital raised.
    diligencePath: >-
      Reconcile payroll headcount, contractor counts, round instruments, currencies, and debt proceeds with company
      records.
    relatedQuestionRefs:
      - QO003
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
