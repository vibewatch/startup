chapter:
  number: 7
  title: Risks
  summary: Cabify's most material risks are regulatory constraints on VTC operations, dependence on fleets and licensed drivers, intense city-level competition, and incomplete current financial and incident disclosure. Independent benchmark scores and jurisdiction-specific legal changes reinforce the need for active monitoring and targeted diligence rather than assuming that compliance positioning eliminates residual exposure.
sections:
  - id: regulatory-exposure
    title: Regulatory and legal exposure
    body: |-
      Spain's VTC framework creates a structural risk because national rules leave important implementation choices to autonomous regions and permit additional public-interest restrictions. Eurofound describes environmental, congestion, licensing and public-interest criteria that can limit VTC authorisations, while the Catalonia proposal described by Cronista would constrain urban operation, require advance booking and reduce licences if enacted. Colombia's 2025 labor reform adds a separate diligence issue for any Cabify activity that falls within its digital-delivery-platform provisions, including worker classification, occupational-risk contributions and algorithmic transparency. The sources identify concrete requirements, but they do not establish Cabify's current licence inventory, the final Catalan legal outcome, or the Colombian provisions' exact scope for Cabify. Management therefore needs jurisdiction-by-jurisdiction legal and operating inventories.
    claimRefs: [CR001, CR002, CR003, CR004, CR016]
    tableRefs: [TR001]
  - id: operational-and-competitive
    title: Operational, safety and competitive exposure
    body: |-
      A ride-hailing platform must preserve service reliability, driver screening, passenger safety and vehicle availability while competing for supply and demand in each city. Vendor descriptions identify verification, geolocation and safety features as core controls, but they are not independent assurance. The World Benchmarking Alliance's low published scores for Cabify across its just-transition, social, gender and urban benchmarks provide an adverse external signal, although the retained profile does not expose enough methodology to diagnose each score. Reuters supplies a concrete dependency example: Auro, a fleet owner employing 1,100 Cabify drivers, considered moving them to Uber or Bolt during a contract dispute. Together, the evidence supports material execution and partner risks while leaving current churn, incidents, service levels and driver economics unresolved.
    claimRefs: [CR005, CR006, CR007, CR008, CR015]
    tableRefs: [TR002]
  - id: dependencies-and-financial
    title: Partner, financial and disclosure dependencies
    body: |-
      Cabify's model depends on third-party drivers, fleet owners, licences, payment and marketplace infrastructure, and enough liquidity to maintain city operations. White Label Fox describes Cabify as a mediator between drivers and riders and reports a commission model. Tech Funding News reported that Cabify's 2023 financing followed a EUR 40 million European Investment Bank loan and was earmarked partly for expansion, fleet electrification and technology, linking strategic execution to continued capital deployment. Multiples reports historical valuation and revenue figures but explicitly warns that round-associated revenue may be run-rate or LTM. Dealroom also reports a broad investor base while withholding parts of the public cap-table view. Current audited cash, debt, margin, concentration and preference data therefore remain unestablished.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring indicators and thesis-break triggers
    body: |-
      The risk posture is manageable only if management can demonstrate that regulatory restrictions, partner concentration and operational failures are being monitored with measurable thresholds. The company-facing and vendor sources describe compliance, driver verification, safety tooling and corporate mobility, but they do not provide a current incident register, licence-by-city schedule, retention series or independently audited cash-flow view. The practical diligence plan is therefore to request those records and set explicit escalation triggers: a material loss of licensed supply in a core city, an adverse final regulatory decision that constrains ordinary bookings, repeated safety or availability failures, or liquidity that cannot fund the resulting remediation. Until those records are supplied, residual exposure remains high.
    claimRefs: [CR013, CR014]
    figureRefs: [FR001]
callouts:
  - calloutType: risk
    title: Highest-priority risk
    body: Regulatory restrictions and fleet-partner dependence can reduce available supply in a core market at the same time, so diligence should start with the city-level licence inventory, partner concentration and contract termination rights.
    claimRefs: [CR001, CR005, CR008]
  - calloutType: assumption
    title: Evidence limitation
    body: Public sources in this pool do not establish a current company-wide incident rate, cash runway, debt schedule, customer concentration or final status of every Spanish VTC restriction; those are open diligence items, not zeros.
    claimRefs: [CR012, CR014]
