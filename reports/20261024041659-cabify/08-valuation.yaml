artifact: valuation
slug: cabify
runDate: 2026-10-24
company:
  name: Cabify
chapter:
  number: 8
  title: Valuation
  summary: Cabify has credible scale, a documented path to profitability, and a 2023 private-market valuation around $1.5B, but the available evidence is stale, privately sourced, and inconsistent on the latest financing. The appropriate stance is research-more until current cap-table, cash-flow, and preference data are obtained.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investable thesis is that Cabify has combined a differentiated mobility position with operating discipline. A third-party funding dataset records $900M of revenue and a $1.5B valuation in March 2023, implying 1.7x revenue, while the same source says the multiple fell from 2.9x in October 2015 to 1.7x in March 2023. The evidence also records 2022 turnover of approximately $683.8M–$688M, up 32% from 2021, and break-even or slightly positive EBITDA globally in later 2023 reporting. That combination supports a lower-multiple platform case rather than a growth-at-any-price case. The anti-thesis is equally material: these are private-company and aggregator figures, not audited accounts; a 2024 Forge record shows a $895.57M post-money valuation, while another database reports $1.5B for 2023. The gap may reflect different securities, dates, or methodology, so it cannot support a current mark without primary financing documents.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: price-discipline
    title: Entry discipline and financing context
    body: >-
      Entry discipline should be anchored to the most recent verifiable security price, not to the headline unicorn mark. Multiples reports a March 2023 undisclosed-stage round with $65M raised and a $1.5B valuation, whereas Forge shows a May 2024 Series F-2 with $62.67M raised and an estimated $895.57M post-money valuation, 13,514,309 shares outstanding, a second-order 1.0x liquidation preference, and a 1.0x conversion ratio. Forge explicitly warns that its post-money valuation is estimated from company-submitted incorporation certificates and that it does not independently verify its data. This makes the 2024 record useful as a diligence lead, not a definitive fair value. Cabify remains private and illiquid; the Reuters report says it was considering an IPO but had announced no firm plan as of January 2022. An investor should require the current fully diluted share count, security waterfall, debt, cash, and latest management accounts before setting a bid.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: scenarios-and-decision
    title: Scenarios, comparables, and decision
    body: >-
      The scenario range should be driven by evidence that can be refreshed. The bull case requires confirmation that the 2023 revenue trajectory and profitability claims persisted, that expansion and electrification investments translated into durable margins, and that the latest financing did not introduce a materially senior or dilutive security. The base case assumes a private, mature mobility platform valued near a modest revenue multiple, with growth offset by regulation, fleet dependence, and competition. The bear case is a down-round or liquidity case in which fleet partners switch to rivals, price competition compresses take rate, or regulatory and capital requirements absorb cash. Reuters documented a 2022 dispute involving Auro, a fleet employing 1,100 Cabify drivers, and reported that Auro considered moving vehicles to Uber or Bolt; that is a concrete reminder that supply access is a valuation input, not merely an operating detail. Public-company comparisons are directional only: the pool's market datasets describe Uber as much larger and more diversified, so applying its multiple to Cabify would overstate comparability.
      World Benchmarking Alliance's low transition, social, gender, and urban-benchmark results add an independently issued downside signal, but they are not a valuation model. Current public evidence therefore supports research-more rather than a price-specific recommendation.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a purchase price until current financing and cash-flow evidence is obtained]
      - [Confidence, medium, Evidence supports direction but not a current mark]
      - [Risk rating, high, Private disclosure and mobility execution risks remain material]
      - [Valuation stance, unknown, 2023 and 2024 marks conflict and are not current audited fair value]
    notes: "Assessment synthesizes retained public and private-market sources; it is not an investment offer and unavailable current inputs remain unresolved."
    claimRefs: [CV001, CV006, CV009, CV010]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Scale and operating leverage, "Multiples records $900M revenue and 2022 turnover of approximately $683.8M-$688M", "Current audited revenue, contribution margin, and cash conversion"]
      - [Lower valuation multiple, "Multiples reports 1.7x revenue at the March 2023 $1.5B mark", "A current priced round or verified secondary transaction"]
      - [Financing uncertainty, "Forge reports $895.57M post-money in May 2024; Multiples reports $1.5B in March 2023", "Primary cap table and security terms"]
      - [Supply and competitive risk, "Reuters reports an Auro dispute involving 1,100 drivers and possible moves to Uber or Bolt", "Multi-year fleet retention and market-share evidence"]
    notes: "Rows deliberately separate company scale, valuation evidence, financing uncertainty, and operating downside; figures are not normalized across sources."
    claimRefs: [CV002, CV003, CV006, CV007, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "2023 profitability and growth persist; latest terms are ordinary and dilution is limited", "Upside requires a verified current mark plus audited growth; no range is supportable from public evidence", "Regulatory shocks and fleet attrition", "Unverified"]
      - [Base, "Mature platform grows with moderate margins and remains private", "Entry remains contingent on current accounts and a reconciled capitalization table", "Stale revenue, cash, and preference data", "Most consistent with current public evidence"]
      - [Bear, "Revenue or margins weaken and capital is needed on senior or dilutive terms", "Down-round or impaired secondary value is plausible; downside cannot be quantified from retained data", "Liquidity, competition, and fleet dependence", "Plausible because the later Forge mark is lower"]
      - [Catalyst, "Primary financing, audited accounts, or IPO filing provides current disclosure", "Narrower valuation range and stronger underwriting confidence", "No announced IPO plan in the Reuters account as of January 2022", "Evidence-dependent"]
      - [Kill trigger, "Current accounts show persistent cash burn or material senior preferences", "Do not proceed at the prior unicorn mark", "Preference overhang and weak cash conversion", "Binary diligence condition"]
    notes: "Scenario values are intentionally qualitative because the pool lacks current audited revenue, cash, debt, fully diluted shares, and preference waterfall data."
    claimRefs: [CV003, CV004, CV006, CV008, CV010, CV012, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Evidence quality and financing uncertainty lead to a research-more recommendation rather than a price-specific buy call.
    data:
      nodes:
        - {id: scale, label: "Scale and revenue evidence"}
        - {id: profitability, label: "Profitability signal"}
        - {id: mark, label: "Conflicting private marks"}
        - {id: terms, label: "Unknown dilution and preferences"}
        - {id: risk, label: "Fleet and regulation risk"}
        - {id: decision, label: "Research-more"}
      edges:
        - {from: scale, to: profitability}
        - {from: profitability, to: mark}
        - {from: mark, to: terms}
        - {from: terms, to: risk}
        - {from: risk, to: decision}
    claimRefs: [CV002, CV004, CV007, CV010, CV011]
callouts:
  - calloutType: recommendation
    title: Price discipline
    body: The evidence supports diligence priority, not a current buy price. Obtain primary financing documents, current management accounts, cash and debt, and the fully diluted cap table before underwriting.
    claimRefs: [CV006, CV007, CV008, CV010]
  - calloutType: risk
    title: Downside trigger
    body: A material senior preference stack, persistent cash burn, or loss of major fleet supply would invalidate the prior unicorn valuation anchor and should trigger a no-invest decision.
    claimRefs: [CV010, CV011, CV015]
