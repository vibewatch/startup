  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: current-valuation
      missingEvidence: Current primary financing documents, fully diluted cap table, and security waterfall.
      whyItMatters: Conflicting private marks cannot establish the price or investor economics of a current transaction.
      diligencePath: Request the latest term sheet, capitalization table, preference schedule, and any secondary transaction evidence from the company or lead investor.
      relatedQuestionRefs: [QV001, QV002, QV008]
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: Audited financial statements, current cash balance, debt, cash burn, and segment contribution margins.
      whyItMatters: Revenue and EBITDA snapshots do not establish cash conversion or downside funding needs.
      diligencePath: Obtain the latest audited accounts and monthly management reporting under NDA.
      relatedQuestionRefs: [QV003, QV008]
    - type: stale
      severity: material
      topic: exit
      missingEvidence: Current IPO, secondary liquidity, or strategic-exit status after the January 2022 Reuters account.
      whyItMatters: A stale IPO reference cannot be used to underwrite a current liquidity path.
      diligencePath: Verify current board-approved exit plans, filing status, and recent shareholder liquidity events.
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: competition
      missingEvidence: Current Cabify market share, fleet retention, and country-level unit economics.
      whyItMatters: Mobility valuation depends on durable supply access and local contribution margins.
      diligencePath: Request market-share, driver/fleet retention, take-rate, and contribution-margin cohorts by country and customer segment.
      relatedQuestionRefs: [QV004, QV006]
