company:
  name: Cabify
chapter:
  number: 3
  title: Competitors
  summary: Cabify competes in a crowded, multi-sided mobility market where Uber and Bolt can pressure fleet supply and price, while Blacklane shows how a scaled premium segment can be attached to a larger platform. Its defensibility appears strongest in local operating relationships, corporate workflows, and regulatory execution, but the assigned evidence also shows material switching, licensing, and incumbent-response risks.
sections:
  - id: landscape
    title: Competitive landscape and scale
    body: >-
      Cabify is a platform connecting passengers and drivers through a mobile app and website, with both individual and corporate customers. The assigned evidence describes a broad field rather than a single peer set: Tracxn lists 167 active competitors and names DiDi and Blacklane among the leading examples, while Multiples.vc uses an adjacent comparable set spanning ride-hailing, micromobility, and intercity sharing. Cabify's own 2018 report described a multimodal offer across VTC, taxi, rental cars, motorcycles, and scooters. The practical landscape therefore includes horizontal networks, corporate tools, premium chauffeur services, taxis and licensed private-hire fleets, and internal travel procurement. Cabify's 2021 scale indicators—$516 million of global revenue, more than 5.4 million registered users, and 230,000 drivers—are reported by Reuters, but are historical rather than current operating metrics.
    claimRefs: [CP001, CP002, CP003, CP004, CP015, CP016]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-comparison
    title: Buyer-facing capability and packaging
    body: >-
      The buying decision is not only an app comparison. Corporate buyers value booking control, scheduled journeys, consolidated payment, reporting, safety, and reliable supply; Bolt's business product explicitly markets a dashboard, company payment, scheduled rides up to 90 days, flight tracking, and more than 70,000 companies, although those are Bolt's own claims. Cabify's evidence supports corporate and private service, fixed per-kilometre pricing, and a focus on repeat customers, while its assigned sources do not provide a current public Cabify price card or comparable service-level commitments. Blacklane differentiates around premium service, trained chauffeurs, and global availability, and Uber's announced Blacklane transaction would combine that specialist offer with Uber's scale. Unsupported cells remain unknown rather than being scored as parity.
    claimRefs: [CP001, CP007, CP008, CP009, CP012, CP013]
    tableRefs: [TP002, TP003]
  - id: switching-and-moat
    title: Switching costs, distribution, and moat durability
    body: >-
      Multi-homing is structurally easy for riders and drivers because the same licensed vehicle or customer can work across apps. Reuters reports that Auro, a fleet owner employing 1,100 drivers, considered moving its drivers from Cabify to Uber or Bolt and that the dispute concerned exclusivity; the same account quotes a fleet operator saying Uber's algorithm was more efficient for earnings and Bolt charged less to gain share. These are third-party statements, not a benchmark, but they identify the concrete mechanism of disintermediation: fleet economics and local supply relationships can overwhelm brand preference. Cabify's corporate accounts, repeat-user orientation, fixed pricing, and local regulatory know-how may raise workflow and trust switching costs, yet the evidence does not quantify retention, exclusivity, or customer concentration.
    claimRefs: [CP005, CP006, CP012, CP013]
  - id: adverse-regulatory
    title: Adverse evidence and displacement risk
    body: >-
      Regulatory access is a competitive variable. MLex reported that Spain's Supreme Court accepted Cabify's request for an EU Court opinion on a rule limiting ride-hailing licenses to one for every 30 taxi licenses. El Pais separately reported that a Catalan rule requiring customers to request a ride 15 minutes in advance led Uber and Cabify to announce a Barcelona withdrawal in 2019, with the companies saying the delay made the on-demand model unviable. These episodes show that a nominally differentiated service can lose a city or face capacity constraints through policy changes. The 2026 Uber-Blacklane announcement adds a forward displacement risk: a large incumbent is explicitly expanding into premium travel, subject to regulatory approvals and closing conditions.
    claimRefs: [CP009, CP010, CP011]
    tableRefs: []
    figureRefs: []
tables:
