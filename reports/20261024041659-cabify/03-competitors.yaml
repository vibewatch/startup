    title: Competitor profile table
    columns: [Competitor, Category, Scale or funding evidence, Target segment, Differentiation, Limitation or risk]
    rows:
      - [Cabify, Direct ride-hailing and corporate mobility platform, "$516M global revenue in 2021; 5.4M+ registered users; 230,000 drivers", "Private and corporate passengers in Spain and Latin America", "App/web intermediation, fixed per-kilometre pricing, corporate accounts", "Current price, retention, margin, and city-level share are not disclosed in assigned sources"]
      - [Uber, Direct ride-hailing incumbent, "Madrid share estimated near Cabify's by Auro; global scale not quantified in assigned sources", "On-demand riders and drivers; expanding into premium travel", "Large network, algorithmic driver economics, Uber Reserve and announced premium expansion", "Fleet exclusivity disputes and regulatory exposure remain material"]
      - [Bolt, Direct ride-hailing and business mobility peer, "Bolt for Business claims 70,000+ companies", "Corporate travel, employees, guests, and consumers", "Lower-price positioning cited by Reuters; business dashboard and scheduled rides", "The assigned evidence does not quantify Bolt's Madrid share or realized price"]
      - [Blacklane, Premium chauffeur competitor and potential Uber capability, "500+ cities in 60+ countries", "Business and leisure premium travelers", "Trained chauffeurs, high-end vehicles, pre-booking, and service consistency", "Premium positioning may overlap with Uber after the announced acquisition"]
      - [DiDi, Direct ride-hailing peer, "Named by Tracxn as a top Cabify competitor; scale not quantified in assigned sources", "Ride-hailing users in relevant international markets", "Large-platform peer position", "Assigned evidence does not support current pricing, coverage, or capability detail"]
      - [Taxi and licensed private-hire status quo, Substitute and supply-side alternative, "Spain has regulated taxi and VTC license systems; Madrid had about 8,000 licensed ride-hailing vehicles in Reuters' 2022 account", "Local passengers and regulated transport buyers", "Existing licenses, local availability, and regulated service relationships", "Policy can favor taxis and constrain VTC immediacy"]
    notes: >-
      Snapshot uses different publication dates and issuer types; revenue, users, driver counts, and fleet counts are historical where explicitly dated. Unknown cells are not evidence of parity or inferiority.
    claimRefs: [CP003, CP004, CP005, CP007, CP008, CP010, CP011]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Cabify, Uber, Bolt, Blacklane, Evidence status]
    rows:
      - [Corporate booking and payment controls, "Corporate accounts supported; current controls unknown", "Platform and premium expansion; comparable controls unknown", "Dashboard, company payment, and guest booking", "App and web booking", "Bolt and Blacklane are issuer-described; Cabify/Uber parity is unknown"]
      - [Advance booking, "Not established in assigned sources", "Uber Reserve described only in Uber's Blacklane announcement", "Rides up to 90 days ahead", "Pre-booked chauffeur service", "Source-backed where stated; no inferred parity"]
      - [Pricing model, "Fixed price per kilometre described", "Minutes and kilometres described in historical comparison", "Lower-price positioning reported by Reuters; list pricing unknown", "Premium pricing unknown", "Historical or issuer-specific evidence; realized price unavailable"]
      - [Premium service and trust, "Driver screening and professional service described historically", "Premium travel expansion via Uber Elite and Blacklane", "Safety features and insured passengers claimed", "Trained professionals and high-end vehicles", "Trust posture is not an independent benchmark"]
      - [Network breadth, "Spain and Latin America", "Global incumbent; exact comparable coverage not assigned", "Worldwide driver partners claimed", "500+ cities in 60+ countries", "Geographies are not directly comparable"]
      - [Regulatory and licensing access, "VTC licenses and legal challenges documented", "VTC and taxi regulatory exposure documented", "Madrid fleet competition documented", "Closing and regulatory approvals required for acquisition", "Market access remains city-specific"]
    notes: >-
      Cells marked unknown mean the assigned successful sources do not establish the comparison. Company and competitor pages are issuer evidence, not independent validation; historical descriptions are not current product guarantees.
    claimRefs: [CP001, CP006, CP007, CP008, CP009, CP010, CP011, CP012]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider, Price or contract model, Included capabilities in assigned evidence, Discount or unknowns, Competitive implication]
    rows:
      - [Cabify, "Fixed price per kilometre in historical description; commission model reported", "Executive, Lite, Group, corporate and private passenger options", "Current list and realized pricing unknown", "Predictability may appeal to corporate buyers, but price competitiveness is unverified"]
      - [Uber, "Historical comparison uses minutes and kilometres; current comparable price unknown", "On-demand network, Uber Reserve, and premium expansion", "Discounting and realized price unknown", "Breadth and algorithmic supply economics can pressure Cabify"]
      - [Bolt, "Lower-price positioning reported by Reuters; current list price unknown", "Business dashboard, scheduled rides, payment controls, and multiple vehicle classes", "Discounts and contract terms unknown", "Price-led share capture is a direct displacement vector"]
      - [Blacklane, "Premium chauffeur price not disclosed in assigned evidence", "Airport, city-to-city, hourly bookings, high-end vehicles, and trained chauffeurs", "Discounts, contract terms, and realized price unknown", "Premium packaging raises the quality bar and may gain Uber distribution"]
    notes: >-
      No current comparable price sheet was successfully retained for all providers. The table separates issuer claims, historical descriptions, and unknown realized economics; it is not a price index.
    claimRefs: [CP007, CP008, CP009, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Cabify sits between broad ride-hailing peers and premium or corporate specialists on an ordinal, evidence-backed comparison rather than a measured market-share chart.
    data:
      points:
        - {label: Cabify, x: 3, y: 3, note: "Corporate and private platform with Spain/Latin America footprint; exact current breadth and retention unknown"}
        - {label: Uber, x: 4, y: 5, note: "Direct Madrid rival with algorithmic supply economics and premium expansion"}
        - {label: Bolt, x: 4, y: 4, note: "Lower-price pressure plus business controls and scheduled rides"}
        - {label: Blacklane, x: 5, y: 4, note: "Premium chauffeur service in 500+ cities and 60+ countries"}
        - {label: DiDi, x: 2, y: 4, note: "Named top competitor; assigned evidence does not quantify current coverage"}
        - {label: Taxi/VTC status quo, x: 2, y: 2, note: "Local licensed supply with policy-dependent access"}
      xAxis: "Breadth and distribution reach (ordinal 1-5)"
      yAxis: "Corporate/premium workflow depth (ordinal 1-5)"
    approximationNotes: >-
      Coordinates are author-assigned ordinal scores from the cited qualitative evidence, not measured market shares, prices, or benchmark scores. They should not be read as a quantitative ranking.
    claimRefs: [CP001, CP004, CP005, CP007, CP008, CP009, CP010]
callouts:
  - calloutType: strength
    title: Local operating relationships can matter
    body: Cabify's corporate workflows, repeat-user orientation, and local licensing experience are plausible differentiation, but assigned sources do not quantify retention or exclusivity.
    claimRefs: [CP001, CP012, CP013]
  - calloutType: risk
    title: Fleet and regulation can erase differentiation
    body: The Auro dispute, Spanish license limits, and Barcelona's advance-booking rule show how supply relationships and policy can quickly change competitive access.
    claimRefs: [CP005, CP006, CP010, CP011]
  - calloutType: insight
    title: Incumbent premium expansion raises the bar
    body: Uber's announced Blacklane acquisition would combine a premium chauffeur network with Uber's scale, although completion remains subject to approvals and closing conditions.
    claimRefs: [CP008, CP009]
