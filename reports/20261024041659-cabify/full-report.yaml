  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic model
        blocks:
          - type: paragraph
            body: >-
              The relevant market is digitally mediated, on-demand urban passenger transport: a platform matches a
              passenger or business account with a licensed driver, handles booking, payment, trip records, and service
              categories. GMI's scope explicitly includes e-hailing, rental, outstation, and corporate mobility
              platforms, and excludes non-platform street hails, private vehicle ownership, and freight-only activity.
              That boundary is useful for Cabify because its core demand is a trip rather than a software seat.
              Corporate accounts are an adjacent demand pool with a different budget owner and control workflow, while
              Cabify Go's subscriptions, micromobility, bikes, and courier services are adjacency experiments rather
              than interchangeable TAM. The status quo is a traditional taxi, public transport, private car,
              walking/cycling, or an employer's unmanaged reimbursement process. Cabify therefore competes for city
              trips and managed ground-transport spend, not all mobility or all logistics spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: Sizing lenses and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              The strongest external category lens is GMI's estimate of USD 188.6 billion in global ride-hailing service
              value in 2025, USD 213.2 billion in 2026, and USD 489.5 billion in 2035, implying a 9.7% 2026–2035 CAGR.
              Its scope includes corporate mobility and platform-booked two- to four-wheelers, buses, and shuttles, but
              excludes conventional street-hailed taxis and freight-only activity. A second lens is the EV ride segment,
              which GMI sizes at USD 35.6 billion in 2025, while a third is the enterprise lens: GMI describes corporate
              mobility as growing at 11.6% CAGR, above the overall market. These are not additive TAM layers. A June
              2026 independent analysis describes Cabify as operating in six countries and more than 40 cities, but the
              assigned evidence does not provide a current city-by-city spend denominator, take rate by segment, or a
              serviceable share. A precise SAM/SOM is therefore an evidence gap, not a number to infer from global
              market size.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Cabify has at least three economic demand paths. Consumers are the users and usually payers for individual
              trips or subscriptions; their trigger is reliable, transparent, convenient transport in a specific city.
              Corporate clients are buyers and budget owners, while employees are users; the trigger is controlled
              travel spend, receipts, policy enforcement, duty of care, and trip-level reporting. Fleet operators and
              professional drivers are supply-side participants rather than customers in the same sense, but their
              availability determines wait times, coverage, and price reliability. The multimodal subscription pilot
              shows a cross-sell path: Cabify placed ride-hailing, micromobility, bike subscriptions, and courier
              services under one app, and reported that 50% of Bive's user base was new to the Cabify platform. The
              adoption sequence is consequently city-specific: establish supply density, win a repeat use case, then
              expand into business accounts or adjacent modes. Public evidence does not quantify conversion, retention,
              or corporate budget share.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Urban congestion, smartphone access, on-demand preferences, and electrification are structural demand or
              cost drivers. GMI links platform growth to urban density and mobile connectivity, while its analysis says
              fleet electrification can become an operating-cost lever when financing, charging, and driver support are
              available. Those drivers do not automatically create margin: platform economics depend on local licensing,
              driver supply, fleet access, and the ability to price during peaks. In Madrid, reporting describes a
              dispute over an operator employing 1,100 Cabify drivers, with Cabify and Uber estimated at similar market
              share by the fleet owner; that is a concrete distribution and supply concentration risk. Spanish
              regulation is also fragmented. Merca2 reports that regional rules differ and that ordinary high-demand
              price increases in Madrid were being constrained. The market can grow while Cabify's addressable margin
              pool remains constrained by compliance and local density.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market conclusion
            body: >-
              The category is large and growing, but Cabify's investable market is a city-by-city serviceable pool whose
              size depends on licensed supply, corporate penetration, and repeat utilization; global TAM should not be
              treated as Cabify revenue potential.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM012
          - type: callout
            title: Adoption constraint
            body: >-
              Driver and fleet concentration plus changing regional rules can reduce coverage or constrain dynamic
              pricing before demand becomes the binding limitation.
            calloutType: risk
            claimRefs:
              - CM012
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              Cabify is a platform connecting passengers and drivers through a mobile app and website, with both
              individual and corporate customers. The assigned evidence describes a broad field rather than a single
              peer set: Tracxn lists 167 active competitors and names DiDi and Blacklane among the leading examples,
              while Multiples.vc uses an adjacent comparable set spanning ride-hailing, micromobility, and intercity
              sharing. Cabify's own 2018 report described a multimodal offer across VTC, taxi, rental cars, motorcycles,
              and scooters. The practical landscape therefore includes horizontal networks, corporate tools, premium
              chauffeur services, taxis and licensed private-hire fleets, and internal travel procurement. Cabify's 2021
              scale indicators—$516 million of global revenue, more than 5.4 million registered users, and 230,000
              drivers—are reported by Reuters, but are historical rather than current operating metrics.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: Buyer-facing capability and packaging
        blocks:
          - type: paragraph
            body: >-
              The buying decision is not only an app comparison. Corporate buyers value booking control, scheduled
              journeys, consolidated payment, reporting, safety, and reliable supply; Bolt's business product explicitly
              markets a dashboard, company payment, scheduled rides up to 90 days, flight tracking, and more than 70,000
              companies, although those are Bolt's own claims. Cabify's evidence supports corporate and private service,
              fixed per-kilometre pricing, and a focus on repeat customers, while its assigned sources do not provide a
              current public Cabify price card or comparable service-level commitments. Blacklane differentiates around
              premium service, trained chauffeurs, and global availability, and Uber's announced Blacklane transaction
              would combine that specialist offer with Uber's scale. Unsupported cells remain unknown rather than being
              scored as parity.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
      - number: '3.3'
        title: Switching costs, distribution, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Multi-homing is structurally easy for riders and drivers because the same licensed vehicle or customer can
              work across apps. Reuters reports that Auro, a fleet owner employing 1,100 drivers, considered moving its
              drivers from Cabify to Uber or Bolt and that the dispute concerned exclusivity; the same account quotes a
              fleet operator saying Uber's algorithm was more efficient for earnings and Bolt charged less to gain
              share. These are third-party statements, not a benchmark, but they identify the concrete mechanism of
              disintermediation: fleet economics and local supply relationships can overwhelm brand preference. Cabify's
              corporate accounts, repeat-user orientation, fixed pricing, and local regulatory know-how may raise
              workflow and trust switching costs, yet the evidence does not quantify retention, exclusivity, or customer
              concentration.
            claimRefs:
              - CP005
              - CP006
              - CP012
              - CP013
      - number: '3.4'
        title: Adverse evidence and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory access is a competitive variable. MLex reported that Spain's Supreme Court accepted Cabify's
              request for an EU Court opinion on a rule limiting ride-hailing licenses to one for every 30 taxi
              licenses. El Pais separately reported that a Catalan rule requiring customers to request a ride 15 minutes
              in advance led Uber and Cabify to announce a Barcelona withdrawal in 2019, with the companies saying the
              delay made the on-demand model unviable. These episodes show that a nominally differentiated service can
              lose a city or face capacity constraints through policy changes. The 2026 Uber-Blacklane announcement adds
              a forward displacement risk: a large incumbent is explicitly expanding into premium travel, subject to
              regulatory approvals and closing conditions.
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Local operating relationships can matter
            body: >-
              Cabify's corporate workflows, repeat-user orientation, and local licensing experience are plausible
              differentiation, but assigned sources do not quantify retention or exclusivity.
            calloutType: strength
            claimRefs:
              - CP001
              - CP012
              - CP013
          - type: callout
            title: Fleet and regulation can erase differentiation
            body: >-
              The Auro dispute, Spanish license limits, and Barcelona's advance-booking rule show how supply
              relationships and policy can quickly change competitive access.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
          - type: callout
            title: Incumbent premium expansion raises the bar
            body: >-
              Uber's announced Blacklane acquisition would combine a premium chauffeur network with Uber's scale,
              although completion remains subject to approvals and closing conditions.
            calloutType: insight
            claimRefs:
              - CP008
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and pricing
        blocks:
          - type: paragraph
            body: >-
              Cabify's core economic activity is transport intermediation: Bloomberg describes the Spanish entity as
              providing automobile transportation such as taxicabs, while Cabify's current App Store listing spans
              private-car and taxi rides, electric-moped rental, hybrid-car rental, deliveries, and corporate travel.
              AskCyborg characterizes monetization as ride commissions and service fees, which is consistent with a
              transaction model rather than ARR. Public pricing evidence is much thinner. The app presents an estimated
              trip price and applies promotions, but that is a customer quote, not realized net revenue. Multiples
              reports a 20% commission in 2015; it is a historical rate and should not be treated as Cabify's current
              take rate across countries, products, or corporate contracts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI004
              - CI005
      - number: '4.2'
        title: Traction and profitability signals
        blocks:
          - type: paragraph
            body: >-
              The available scale indicators are meaningful but not a clean time series. Reuters reported $516 million
              of global revenue, more than 5.4 million registered users, and 230,000 drivers in 2021. Multiples records
              $900 million of revenue alongside a March 2023 financing, but its own convention says financing-date
              figures may be run-rate revenue or reported LTM revenue; the figure is therefore not ARR and is not
              directly comparable without reconciliation. The same database summarizes later 2023 reports at $899.1
              million of gross revenue, $111.1 million of gross profit, and break-even or slightly positive global
              EBITDA. Those values imply improving scale, but the assigned text does not provide audited statements,
              accounting policies, or a bridge from customer spend to reported revenue and gross profit.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Cost base and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              Cabify's public record does not quantify driver incentives, insurance, payment processing, support, fraud
              loss, local compliance, or vehicle and license costs. Workforce evidence is also only a proxy: Dealroom
              maps 4,834 employees across 29 countries, while a careers aggregator documents recurring Recharge Days and
              benefits, but neither establishes payroll expense or the boundary between employees, contractors, and
              driver partners. A current Incognia partner release says the deployed fraud controls target fake rides,
              promo abuse, account sharing, and chargebacks, confirming that loss prevention consumes operating
              attention without disclosing savings or cost. A broad industry report puts 2021 U.S. ride-hailing
              operating costs at 45% of revenue; this is contextual only and cannot be applied to Cabify's Spain and
              Latin America footprint.
            claimRefs:
              - CI013
              - CI014
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI003
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Historical financing demonstrates access to capital but does not establish present liquidity. Selva
              reports a $110 million mixed equity-and-debt financing, a EUR 40 million European Investment Bank loan,
              and a planned $300 million Latin America investment; Multiples separately totals $469 million raised
              across seven rounds. These are different measures and cannot be converted into cash available, debt
              capacity, or runway. Supply concentration is another financial risk: Reuters reported that Auro, which
              employed 1,100 Cabify drivers, planned to move the fleet to Uber or Bolt during a 2022 dispute. The
              financial verdict is therefore conditional. Cabify shows transaction breadth and historical scale, but
              underwriting requires audited statements, country and segment contribution margins, take-rate and
              incentive waterfalls, current cash and debt schedules, covenant headroom, and a board-approved financing
              plan.
            claimRefs:
              - CI011
              - CI012
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Historical scale is visible
            body: >-
              Independent reporting and private-market data show substantial revenue scale, but periods and accounting
              labels must be reconciled before trend analysis.
            calloutType: strength
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI010
          - type: callout
            title: Funding raised is not cash available
            body: >-
              Public financing totals mix equity, debt, and planned investment and do not disclose current liquidity,
              burn, maturities, or runway.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
          - type: callout
            title: Condition underwriting on a financial data room
            body: >-
              Require audited statements, revenue-recognition policies, market-level contribution margins, cohort
              economics, and a current liquidity and debt package.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Cabify is not a single ride-booking SKU. Its consumer listing describes an app in which a user can reserve
              or request a car or taxi, choose among ride, taxi, electric moped, and delivery modes, receive driver and
              vehicle details, see an estimated price, choose a payment method, and share the journey. The enterprise
              surface adds immediate or scheduled rides for employees and guests, spending limits, cost centers,
              electronic invoicing, reporting, and dedicated support. Independent profiles also describe passenger
              transport, corporate service, and last-mile logistics, although they do not establish that every mode is
              live in every market. The product is therefore best understood as a set of workflow-specific interfaces
              over local driver, vehicle, payment, and support operations rather than as a uniformly available global
              catalog.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE014
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
              - CE011
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE009
              - CE010
              - CE011
      - number: '5.2'
        title: Engineering delivery and maturity
        blocks:
          - type: paragraph
            body: >-
              The clearest public technical evidence is Bitrise's Cabify customer case. It describes native iOS and
              Android development in Swift and Kotlin, split between mobility and growth squads. Cabify's engineering
              manager is quoted reporting an approximately 35% reduction in build times and build-success rates above
              95% after migration, followed by integration, regression, parallel, and nightly testing. The same case
              reports that iOS build times eventually stabilized at 18 minutes after Apple-silicon optimization. These
              signals support a disciplined mobile delivery process, but they are supplier case-study evidence with no
              publication date or independent release-history dataset. The current App Store page shows an actively
              versioned product, while Dealroom's workforce mapping indicates organizational scale; neither source
              discloses backend service boundaries, deployment frequency, cloud concentration, or production SLOs.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE011
              - CE012
              - CE013
      - number: '5.3'
        title: Trust, safety, privacy, and sustainability controls
        blocks:
          - type: paragraph
            body: >-
              Trust controls span both software and operations. The App Store disclosure lists financial, location,
              contact, user-content, identifier, usage, and diagnostics data as data that may be linked to a user,
              making privacy governance central to the product rather than peripheral. Cabify's corporate page describes
              verified drivers, GPS and route monitoring, an emergency button, trusted contacts, and continuous support.
              An investor profile separately describes driver training, certification, and limits on daily driving
              hours, but that relationship is not independent audit evidence. Sustainability is also productized through
              enterprise reporting and offset certificates; Cabify's 2025 project page identifies specific
              renewable-energy, conservation, and reforestation projects. The public record does not provide
              certification scope, privacy-control testing, penetration-test results, incident response performance, or
              a current availability history.
            claimRefs:
              - CE007
              - CE010
              - CE011
      - number: '5.4'
        title: Operating dependencies and execution risk
        blocks:
          - type: paragraph
            body: >-
              Cabify's technical experience depends on assets it does not fully control: local drivers, fleet partners,
              licenses, route data, payment rails, and market economics. Reuters reported in 2022 that fleet operator
              Auro intended to move 1,100 drivers from Cabify to Uber or Bolt; Auro's co-founder argued that Uber's
              algorithm enabled higher earnings, a competitor opinion rather than an independent benchmark. Mexico
              Business later reported that Cabify left Mexico in October 2024 after the company said its intended
              business model had not worked as expected and future opportunities were unpromising. These episodes do not
              prove a present platform defect, but they show that dispatch quality and feature breadth cannot be
              separated from local supply density, regulation, and unit economics. Product diligence should therefore
              test market-level reliability and availability rather than extrapolate from app functionality alone.
            claimRefs:
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mobile delivery has concrete process evidence
            body: >-
              The Bitrise case provides named technologies and measured build outcomes: native Swift and Kotlin apps,
              approximately 35% faster builds, build success above 95%, expanded automated testing, and a reported
              stable 18-minute iOS build after optimization.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
          - type: callout
            title: Software quality is inseparable from local supply
            body: >-
              Fleet-partner switching and Cabify's Mexico exit show that a functional app does not guarantee sufficient
              driver density, competitive earnings, or sustainable market operations.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
          - type: callout
            title: Underwrite controls, not feature copy
            body: >-
              Request a current architecture and dependency map, market-level SLOs and incident history, privacy and
              security assurance, driver-control testing, and active-product coverage by city before treating public
              workflow breadth as a defensible moat.
            calloutType: recommendation
            claimRefs:
              - CE007
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              Cabify serves at least two clear demand-side groups: individuals ordering rides or deliveries and
              organizations arranging employee transportation or managed delivery. The consumer flow spans cars, taxis,
              electric mopeds, and delivery, with an estimated price shown before travel. The corporate proposition adds
              access to a fleet and expense controls, making the employer or mobility manager the likely buyer while
              employees are the users. Delivery introduces another use case for individuals and businesses, including
              multi-stop movements. These surfaces show breadth, but the public record does not disclose segment
              revenue, current paying-account counts, or contribution margins. Driver scale therefore remains a supply
              indicator rather than evidence of customer demand.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU013
      - number: '6.2'
        title: Adoption evidence and durability limits
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence comes from incompatible metrics rather than a coherent cohort series. Reuters reported
              more than 5.4 million registered users in 2021, while an Endeavor profile described 33 million regular
              customers and more than 65,000 companies over Cabify's first ten years. Mexico Business News separately
              reported that more than 4,500 companies had hired Cabify for Businesses, and the current App Store surface
              showed a 4.5 rating from 291 ratings. Dealroom displayed 1.3 million monthly visits. These measures use
              different populations, periods, and denominators; none proves active use, repeat frequency, renewal,
              churn, GRR, or NRR.
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.3'
        title: Customer proof, expansion, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The retained evidence contains quantified customer cohorts but no named end-customer case study with
              contract scope, production-versus-pilot status, tenure, or measured outcome. That weakens confidence in
              enterprise reference quality and makes the named-customer table an audit of what is missing rather than a
              customer roster. Expansion is visible at the product level through corporate accounts and delivery, but
              durability depends partly on regulated supply. Reuters reported that Auro planned to move 1,100 drivers
              away from Cabify, while Spanish licensing constraints and unresolved Colombian platform-work rules show
              that fleet availability can be exposed to counterparties and regulation. These are operating dependencies,
              not evidence of customer churn.
            claimRefs:
              - CU004
              - CU008
              - CU012
              - CU013
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
              - CU008
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple demand surfaces share one workflow
            body: >-
              Consumer rides, managed employee transportation, and delivery can all begin from Cabify's app or
              business-account proposition, creating plausible cross-use expansion without proving that customers
              actually adopt multiple services.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU013
          - type: callout
            title: Durability remains unverified
            body: >-
              Registered users, web visits, app ratings, and historical company counts are not retention metrics; cohort
              activity, renewal, churn, concentration, and unit economics remain private-evidence diligence items.
            calloutType: risk
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Spain's VTC framework creates a structural risk because national rules leave important implementation
              choices to autonomous regions and permit additional public-interest restrictions. Eurofound describes
              environmental, congestion, licensing and public-interest criteria that can limit VTC authorisations, while
              the Catalonia proposal described by Cronista would constrain urban operation, require advance booking and
              reduce licences if enacted. Colombia's 2025 labor reform adds a separate diligence issue for any Cabify
              activity that falls within its digital-delivery-platform provisions, including worker classification,
              occupational-risk contributions and algorithmic transparency. The sources identify concrete requirements,
              but they do not establish Cabify's current licence inventory, the final Catalan legal outcome, or the
              Colombian provisions' exact scope for Cabify. Management therefore needs jurisdiction-by-jurisdiction
              legal and operating inventories.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
      - number: '7.2'
        title: Operational, safety and competitive exposure
        blocks:
          - type: paragraph
            body: >-
              A ride-hailing platform must preserve service reliability, driver screening, passenger safety and vehicle
              availability while competing for supply and demand in each city. Vendor descriptions identify
              verification, geolocation and safety features as core controls, but they are not independent assurance.
              The World Benchmarking Alliance's low published scores for Cabify across its just-transition, social,
              gender and urban benchmarks provide an adverse external signal, although the retained profile does not
              expose enough methodology to diagnose each score. Reuters supplies a concrete dependency example: Auro, a
              fleet owner employing 1,100 Cabify drivers, considered moving them to Uber or Bolt during a contract
              dispute. Together, the evidence supports material execution and partner risks while leaving current churn,
              incidents, service levels and driver economics unresolved.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
      - number: '7.3'
        title: Partner, financial and disclosure dependencies
        blocks:
          - type: paragraph
            body: >-
              Cabify's model depends on third-party drivers, fleet owners, licences, payment and marketplace
              infrastructure, and enough liquidity to maintain city operations. White Label Fox describes Cabify as a
              mediator between drivers and riders and reports a commission model. Tech Funding News reported that
              Cabify's 2023 financing followed a EUR 40 million European Investment Bank loan and was earmarked partly
              for expansion, fleet electrification and technology, linking strategic execution to continued capital
              deployment. Multiples reports historical valuation and revenue figures but explicitly warns that
              round-associated revenue may be run-rate or LTM. Dealroom also reports a broad investor base while
              withholding parts of the public cap-table view. Current audited cash, debt, margin, concentration and
              preference data therefore remain unestablished.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk posture is manageable only if management can demonstrate that regulatory restrictions, partner
              concentration and operational failures are being monitored with measurable thresholds. The company-facing
              and vendor sources describe compliance, driver verification, safety tooling and corporate mobility, but
              they do not provide a current incident register, licence-by-city schedule, retention series or
              independently audited cash-flow view. The practical diligence plan is therefore to request those records
              and set explicit escalation triggers: a material loss of licensed supply in a core city, an adverse final
              regulatory decision that constrains ordinary bookings, repeated safety or availability failures, or
              liquidity that cannot fund the resulting remediation. Until those records are supplied, residual exposure
              remains high.
            claimRefs:
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority risk
            body: >-
              Regulatory restrictions and fleet-partner dependence can reduce available supply in a core market at the
              same time, so diligence should start with the city-level licence inventory, partner concentration and
              contract termination rights.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR008
          - type: callout
            title: Evidence limitation
            body: >-
              Public sources in this pool do not establish a current company-wide incident rate, cash runway, debt
              schedule, customer concentration or final status of every Spanish VTC restriction; those are open
              diligence items, not zeros.
            calloutType: assumption
            claimRefs:
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Cabify has combined a differentiated mobility position with operating
              discipline. A third-party funding dataset records $900M of revenue and a $1.5B valuation in March 2023,
              implying 1.7x revenue, while the same source says the multiple fell from 2.9x in October 2015 to 1.7x in
              March 2023. The evidence also records 2022 turnover of approximately $683.8M–$688M, up 32% from 2021, and
              break-even or slightly positive EBITDA globally in later 2023 reporting. That combination supports a
              lower-multiple platform case rather than a growth-at-any-price case. The anti-thesis is equally material:
              these are private-company and aggregator figures, not audited accounts; a 2024 Forge record shows a
              $895.57M post-money valuation, while another database reports $1.5B for 2023. The gap may reflect
              different securities, dates, or methodology, so it cannot support a current mark without primary financing
              documents.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV011
      - number: '8.2'
        title: Entry discipline and financing context
        blocks:
          - type: paragraph
            body: >-
              Entry discipline should be anchored to the most recent verifiable security price, not to the headline
              unicorn mark. Multiples reports a March 2023 undisclosed-stage round with $65M raised and a $1.5B
              valuation, whereas Forge shows a May 2024 Series F-2 with $62.67M raised and an estimated $895.57M
              post-money valuation, 13,514,309 shares outstanding, a second-order 1.0x liquidation preference, and a
              1.0x conversion ratio. Forge explicitly warns that its post-money valuation is estimated from
              company-submitted incorporation certificates and that it does not independently verify its data. This
              makes the 2024 record useful as a diligence lead, not a definitive fair value. Cabify remains private and
              illiquid; the Reuters report says it was considering an IPO but had announced no firm plan as of January
              2022. An investor should require the current fully diluted share count, security waterfall, debt, cash,
              and latest management accounts before setting a bid.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: Scenarios, comparables, and decision
        blocks:
          - type: paragraph
            body: >-
              The scenario range should be driven by evidence that can be refreshed. The bull case requires confirmation
              that the 2023 revenue trajectory and profitability claims persisted, that expansion and electrification
              investments translated into durable margins, and that the latest financing did not introduce a materially
              senior or dilutive security. The base case assumes a private, mature mobility platform valued near a
              modest revenue multiple, with growth offset by regulation, fleet dependence, and competition. The bear
              case is a down-round or liquidity case in which fleet partners switch to rivals, price competition
              compresses take rate, or regulatory and capital requirements absorb cash. Reuters documented a 2022
              dispute involving Auro, a fleet employing 1,100 Cabify drivers, and reported that Auro considered moving
              vehicles to Uber or Bolt; that is a concrete reminder that supply access is a valuation input, not merely
              an operating detail. Public-company comparisons are directional only: the pool's market datasets describe
              Uber as much larger and more diversified, so applying its multiple to Cabify would overstate
              comparability. World Benchmarking Alliance's low transition, social, gender, and urban-benchmark results
              add an independently issued downside signal, but they are not a valuation model. Current public evidence
              therefore supports research-more rather than a price-specific recommendation.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV010
              - CV011
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline
            body: >-
              The evidence supports diligence priority, not a current buy price. Obtain primary financing documents,
              current management accounts, cash and debt, and the fully diluted cap table before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
          - type: callout
            title: Downside trigger
            body: >-
              A material senior preference stack, persistent cash burn, or loss of major fleet supply would invalidate
              the prior unicorn valuation anchor and should trigger a no-invest decision.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV015
