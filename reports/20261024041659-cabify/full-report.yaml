  - id: FI001
    title: Revenue model and cost bridge
    type: flow
    summary: >-
      Public evidence establishes the operating sequence, but not the monetary conversion between customer activity,
      recognized revenue, and profit.
    data:
      nodes:
        - id: customer-demand
