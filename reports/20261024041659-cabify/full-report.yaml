      - number: '1.3'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder Juan de Antonio remains CEO and board president, making founder continuity a material operating
              and governance dependency. Cabify's public management roster also identifies a CFO, CTO, and executives
              covering business strategy, legal, finance, partnerships, product, engineering, data, regions, and
              marketplace operations. The disclosed board includes representatives associated with Seaya Ventures,
              Orilla Asset Management, Rakuten, and AngelList, showing meaningful investor participation. However,
              public pages do not establish committee structure, reserved matters, voting rights, liquidation
              preferences, or a succession plan. The visible roster demonstrates functional coverage, not the allocation
              of control.
            claimRefs:
