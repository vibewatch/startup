  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Cabify was founded in Madrid in 2011 and operates a mobility marketplace for individual riders, corporate
              users, licensed drivers, and fleet operators. Its undated company profile says it is present in six
              countries and more than 40 cities, while describing over 50 million registered users and more than 40,000
              companies mobilized. Those are company-issued cumulative measures rather than active-user or retained-
              customer cohorts, and the page's reference to 13 years of operating history suggests some scale fields may
              not have been refreshed for the 2026 run date. The investable identity is therefore clear, but the latest
              period definitions behind its headline reach are not.
            claimRefs:
