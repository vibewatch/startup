      - number: '1.2'
        title: Scale, financing, and valuation anchors
        blocks:
          - type: paragraph
            body: >-
              Recent operating coverage is directionally constructive: two publications reported company-disclosed 2024
              revenue of $858 million, and La República reported $34 million of EBITDA. These are revenue and EBITDA,
              not ARR, cash flow, or audited net income. Capital records require more caution. Reuters reported $110
