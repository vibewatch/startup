      - number: '1.4'
        title: Milestones, operating risk, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Cabify's financing milestones show repeated access to institutional capital, but the operating record also
              demonstrates reliance on third- party licensed supply. Reuters reported in January 2022 that fleet owner
              Auro planned to move 1,100 drivers to Uber, Bolt, or both after an exclusivity dispute; Cabify cited an
              arbitration ruling requiring the fleet to continue working with its app. This episode does not establish a
              current disruption, but it illustrates concentration and switching risk in a marketplace whose service
              quality depends on external fleets and licences. Current diligence still needs audited financials, country
              and business-line contribution margins, a reconciled capitalization table, and city-level permit exposure
              before the public operating recovery can support a precise valuation conclusion.
