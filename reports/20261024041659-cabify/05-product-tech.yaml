      - ["Corporate mobility platform", "Travel administrator and employee", "Operating company-described product", "Policies, limits, cost centers, invoicing, reporting, guest booking, and support", "Permission model, control testing, realized savings, and reference customers"]
      - ["Delivery and logistics", "Sender and recipient", "Publicly described by company and independent profiles; market coverage is unclear", "Extends the mobility network beyond passenger travel", "Current countries, service boundaries, SLA, and delivery economics"]
      - ["Driver and fleet operations", "Driver, fleet operator, and rider", "Core operating dependency", "Verified-driver and monitored-trip positioning", "Screening consistency, supply density, utilization, and incident rates by city"]
      - ["Carbon reporting and offsets", "Enterprise ESG and procurement teams", "Company-described 2025 project portfolio", "Quarterly reporting and certificates integrated into corporate mobility", "Assurance scope, calculation boundary, additionality, and realized emissions reduction"]
    notes: >-
      Statuses synthesize the cited public pages as of the access date; product availability
      may vary by market, and unavailable metrics are expressed as diligence gaps rather than zero.
    claimRefs: [CE001, CE002, CE009, CE010, CE011, CE014]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Cabify solution, Publicly evidenced benefit, Limitation]
    rows:
      - ["Arrange personal transport", "Select origin, destination, and transport mode", "Consumer app for car, taxi, electric moped, or delivery requests", "Driver and vehicle details plus an estimated price before travel", "No current public dispatch, cancellation, or completion denominator"]
      - ["Manage employee travel", "Book for employees or guests and apply company policy", "Immediate or scheduled booking with centralized administration", "A guest can receive and track trip information without a Cabify account", "No public authorization model or enterprise availability metric"]
      - ["Control mobility spend", "Set limits and reconcile trips by team or project", "Alerts, spending policies, cost centers, reports, and electronic invoices", "Company describes real-time budget visibility and tax-compliant records", "No independent savings or policy-compliance measurement"]
      - ["Protect a passenger", "Monitor a trip and escalate a safety concern", "GPS and route monitoring, emergency button, trusted contacts, and support", "Controls are embedded in the trip workflow", "No current incident rate, response-time distribution, or external control test"]
      - ["Report mobility emissions", "Measure and document business-travel impact", "Quarterly emissions reports, annual offset certificates, and project-backed offsets", "Specific 2025 projects are named by market", "No assigned independent assurance of the full calculation and offset boundary"]
    notes: >-
      Benefits are limited to what the sources explicitly describe; company claims are not
      treated as independently verified outcomes.
    claimRefs: [CE001, CE002, CE007, CE009, CE010, CE011]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Principal risk]
    rows:
      - ["Native mobile clients", "Deliver rider and growth experiences on iOS and Android", "Swift, Kotlin, mobile OS versions, and app-store distribution", "Release regression, OS fragmentation, and opaque current crash performance"]
      - ["Build and test pipeline", "Compile, test, and deliver mobile releases", "Bitrise, GitLab integration, parallel tests, and Apple-silicon runners", "Supplier concentration and undated performance evidence"]
      - ["Trip coordination", "Connect users, drivers, vehicles, routes, and prices", "Fleet density, location data, routing, payments, and local permissions", "Supply imbalance, routing quality, fraud, and market-specific availability"]
      - ["Corporate controls", "Apply travel policies, budgets, invoices, and reports", "Identity, employer configuration, payment rails, and tax rules", "Incorrect authorization or incomplete country compliance"]
      - ["Trust and support", "Monitor trips and provide prevention and escalation", "Driver processes, GPS, emergency tooling, data governance, and support teams", "Control effectiveness, privacy governance, and incident response are undisclosed"]
    notes: >-
      This architecture is inferred only at the operating-layer level from assigned public
      evidence; backend services, APIs, data stores, cloud providers, and ownership are not disclosed.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE011, CE012]
callouts:
  - calloutType: strength
    title: Mobile delivery has concrete process evidence
    body: >-
      The Bitrise case provides named technologies and measured build outcomes: native
      Swift and Kotlin apps, approximately 35% faster builds, build success above 95%,
      expanded automated testing, and a reported stable 18-minute iOS build after optimization.
    claimRefs: [CE003, CE004, CE005, CE006]
  - calloutType: risk
    title: Software quality is inseparable from local supply
    body: >-
      Fleet-partner switching and Cabify's Mexico exit show that a functional app does not
      guarantee sufficient driver density, competitive earnings, or sustainable market operations.
    claimRefs: [CE012, CE013]
  - calloutType: recommendation
    title: Underwrite controls, not feature copy
    body: >-
      Request a current architecture and dependency map, market-level SLOs and incident
      history, privacy and security assurance, driver-control testing, and active-product
      coverage by city before treating public workflow breadth as a defensible moat.
    claimRefs: [CE007, CE011, CE012, CE013]
