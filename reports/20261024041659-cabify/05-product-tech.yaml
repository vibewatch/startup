schemaVersion: "report-v2"
artifact: product-tech
slug: cabify
runDate: 2026-10-24
company:
  name: Cabify
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Cabify exposes a mature multi-surface mobility product: consumer ride and delivery
    flows, enterprise travel controls, native mobile engineering, and safety operations.
    Public evidence is strongest for workflow breadth and mobile delivery practice, while
    platform architecture, current production reliability, and independent control
    assurance remain material diligence gaps.
sections:
  - id: product-surfaces
    title: Product surfaces and customer workflow
    body: >-
      Cabify is not a single ride-booking SKU. Its consumer listing describes an app in
      which a user can reserve or request a car or taxi, choose among ride, taxi, electric
      moped, and delivery modes, receive driver and vehicle details, see an estimated price,
      choose a payment method, and share the journey. The enterprise surface adds immediate
      or scheduled rides for employees and guests, spending limits, cost centers, electronic
      invoicing, reporting, and dedicated support. Independent profiles also describe
      passenger transport, corporate service, and last-mile logistics, although they do not
      establish that every mode is live in every market. The product is therefore best
      understood as a set of workflow-specific interfaces over local driver, vehicle,
      payment, and support operations rather than as a uniformly available global catalog.
    claimRefs: [CE001, CE002, CE009, CE014, CE015]
    tableRefs: [TE001, TE002]
  - id: engineering-maturity
    title: Engineering delivery and maturity
    body: >-
      The clearest public technical evidence is Bitrise's Cabify customer case. It describes
      native iOS and Android development in Swift and Kotlin, split between mobility and
      growth squads. Cabify's engineering manager is quoted reporting an approximately 35%
      reduction in build times and build-success rates above 95% after migration, followed
      by integration, regression, parallel, and nightly testing. The same case reports that
      iOS build times eventually stabilized at 18 minutes after Apple-silicon optimization.
      These signals support a disciplined mobile delivery process, but they are supplier
      case-study evidence with no publication date or independent release-history dataset.
      The current App Store page shows an actively versioned product, while Dealroom's
      workforce mapping indicates organizational scale; neither source discloses backend
      service boundaries, deployment frequency, cloud concentration, or production SLOs.
    claimRefs: [CE003, CE004, CE005, CE006, CE008, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-and-controls
    title: Trust, safety, privacy, and sustainability controls
    body: >-
      Trust controls span both software and operations. The App Store disclosure lists
      financial, location, contact, user-content, identifier, usage, and diagnostics data
      as data that may be linked to a user, making privacy governance central to the
      product rather than peripheral. Cabify's corporate page describes verified drivers,
      GPS and route monitoring, an emergency button, trusted contacts, and continuous
      support. An investor profile separately describes driver training, certification,
      and limits on daily driving hours, but that relationship is not independent audit
      evidence. Sustainability is also productized through enterprise reporting and offset
      certificates; Cabify's 2025 project page identifies specific renewable-energy,
      conservation, and reforestation projects. The public record does not provide
      certification scope, privacy-control testing, penetration-test results, incident
      response performance, or a current availability history.
    claimRefs: [CE007, CE010, CE011]
  - id: operating-dependencies
    title: Operating dependencies and execution risk
    body: >-
      Cabify's technical experience depends on assets it does not fully control: local
      drivers, fleet partners, licenses, route data, payment rails, and market economics.
      Reuters reported in 2022 that fleet operator Auro intended to move 1,100 drivers from
      Cabify to Uber or Bolt; Auro's co-founder argued that Uber's algorithm enabled higher
      earnings, a competitor opinion rather than an independent benchmark. Mexico Business
      later reported that Cabify left Mexico in October 2024 after the company said its
      intended business model had not worked as expected and future opportunities were
      unpromising. These episodes do not prove a present platform defect, but they show that
      dispatch quality and feature breadth cannot be separated from local supply density,
      regulation, and unit economics. Product diligence should therefore test market-level
      reliability and availability rather than extrapolate from app functionality alone.
    claimRefs: [CE012, CE013]
figures:
  - id: FE001
    title: Evidence-bounded product and operating stack
    type: stack
    summary: >-
      Public evidence supports an end-to-end mobility stack, but the physical-supply and
      assurance layers remain more externally dependent and less independently verified.
    data:
      layers:
        - label: Customer interfaces
          detail: Consumer ride and delivery workflows plus enterprise travel administration.
          items:
            - label: Consumer app
              detail: Reserve or request trips, choose modes, view pricing, and share journeys.
            - label: Enterprise app and web
              detail: Employee and guest booking with administration and support.
        - label: Commercial controls
          detail: Enterprise policy, payment, accounting, and reporting functions.
          items:
            - label: Spending controls
              detail: Limits, alerts, policies, and cost-center allocation.
            - label: Invoicing and reporting
              detail: Electronic invoices, receipts, and consumption reports.
        - label: Trip orchestration
          detail: Coordination among riders, drivers, vehicles, routes, and payments.
          items:
            - label: Request and dispatch
              detail: Mode selection, driver and vehicle assignment, and route information.
            - label: Fare and payment
              detail: Estimated pre-trip price and several payment methods.
        - label: Trust and safety
          detail: Customer-facing monitoring and operational driver controls.
          items:
            - label: In-app safeguards
              detail: GPS tracking, trip sharing, emergency tooling, and trusted contacts.
            - label: Driver operations
              detail: Training, certification, monitoring, and support processes are described.
        - label: Mobile delivery
          detail: Supplier case-study evidence covers the application build and test process.
          items:
            - label: Native applications
              detail: Swift on iOS and Kotlin on Android.
            - label: Automated pipeline
              detail: Integration, regression, parallel, and nightly testing.
        - label: External dependencies
          detail: Local supply and market conditions constrain the delivered experience.
          items:
            - label: Fleet and licenses
              detail: Driver density, vehicles, partners, and local authorization.
            - label: Market viability
              detail: Regulation, competition, and economics can narrow or end service.
    approximationNotes: >-
      This is an evidence-bounded operating model, not Cabify's disclosed internal system
      architecture; no public source in the assigned pool identifies cloud vendors or
      backend service boundaries.
    claimRefs: [CE001, CE002, CE007, CE011, CE012, CE013]
