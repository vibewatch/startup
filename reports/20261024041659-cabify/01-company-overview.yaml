company:
  name: Cabify
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Cabify is a founder-led, privately held mobility platform established in
    Madrid in 2011. Public evidence supports a six-country, 40-plus-city
    footprint and positive company-reported 2024 EBITDA, but workforce,
    cumulative funding, current valuation, ownership, and audited cash
    generation remain unresolved or inconsistent across sources.
sections:
  - id: identity-and-operating-scope
    title: Identity and operating scope
    body: >-
      Cabify was founded in Madrid in 2011 and operates a mobility marketplace
      for individual riders, corporate users, licensed drivers, and fleet
      operators. Its undated company profile says it is present in six
      countries and more than 40 cities, while describing over 50 million
      registered users and more than 40,000 companies mobilized. Those are
      company-issued cumulative measures rather than active-user or retained-
      customer cohorts, and the page's reference to 13 years of operating
      history suggests some scale fields may not have been refreshed for the
      2026 run date. The investable identity is therefore clear, but the latest
      period definitions behind its headline reach are not.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: scale-and-capital
    title: Scale, financing, and valuation anchors
    body: >-
      Recent operating coverage is directionally constructive: two publications
      reported company-disclosed 2024 revenue of $858 million, and La República
      reported $34 million of EBITDA. These are revenue and EBITDA, not ARR,
      cash flow, or audited net income. Capital records require more caution.
      Reuters reported $110 million of financing in March 2023, and Cinco Días
      later reported an €18.7 million shareholder injection in June 2024.
      Commercial databases do not reconcile: Multiples reports $469 million
      raised across seven rounds, while GetLatka reports $306.4 million across
      five. Their latest valuation anchors also differ in date and amount, so
      neither should be treated as a current priced-equity valuation.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Founder Juan de Antonio remains CEO and board president, making founder
      continuity a material operating and governance dependency. Cabify's
      public management roster also identifies a CFO, CTO, and executives
      covering business strategy, legal, finance, partnerships, product,
      engineering, data, regions, and marketplace operations. The disclosed
      board includes representatives associated with Seaya Ventures, Orilla
      Asset Management, Rakuten, and AngelList, showing meaningful investor
      participation. However, public pages do not establish committee
      structure, reserved matters, voting rights, liquidation preferences, or a
      succession plan. The visible roster demonstrates functional coverage,
      not the allocation of control.
    claimRefs: [CO007, CO008]
    tableRefs: [TO002]
  - id: milestones-risks-and-gaps
    title: Milestones, operating risk, and evidence limits
    body: >-
      Cabify's financing milestones show repeated access to institutional
      capital, but the operating record also demonstrates reliance on third-
      party licensed supply. Reuters reported in January 2022 that fleet owner
      Auro planned to move 1,100 drivers to Uber, Bolt, or both after an
      exclusivity dispute; Cabify cited an arbitration ruling requiring the
      fleet to continue working with its app. This episode does not establish a
      current disruption, but it illustrates concentration and switching risk
      in a marketplace whose service quality depends on external fleets and
      licences. Current diligence still needs audited financials, country and
      business-line contribution margins, a reconciled capitalization table,
      and city-level permit exposure before the public operating recovery can
      support a precise valuation conclusion.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Positive company-reported 2024 EBITDA
    body: >-
      La República reported $34 million of 2024 EBITDA on $858 million of
      revenue, while El Debate separately reported the same revenue scale.
    claimRefs: [CO014, CO015]
  - calloutType: risk
    title: Public scale records do not reconcile
    body: >-
      Workforce estimates, cumulative funding totals, and valuation anchors
      differ materially by source and cannot substitute for primary records.
    claimRefs: [CO005, CO006, CO011, CO012, CO013]
