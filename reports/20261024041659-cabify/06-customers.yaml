schemaVersion: "report-v2"
artifact: customers
slug: cabify
runDate: 2026-10-24
company:
  name: Cabify
chapter:
  number: 6
  title: Customers
  summary: Cabify addresses consumers, corporate mobility buyers, and delivery users through a shared app and business-account surface. Public evidence supports broad historical reach and a live customer journey, but it does not establish current active-customer counts, retention, customer concentration, or named enterprise outcomes.
sections:
  - id: segments-and-jobs
    title: Buyer, user, payer, and use-case segmentation
    body: >-
      Cabify serves at least two clear demand-side groups: individuals ordering rides or deliveries and organizations arranging employee transportation or managed delivery. The consumer flow spans cars, taxis, electric mopeds, and delivery, with an estimated price shown before travel. The corporate proposition adds access to a fleet and expense controls, making the employer or mobility manager the likely buyer while employees are the users. Delivery introduces another use case for individuals and businesses, including multi-stop movements. These surfaces show breadth, but the public record does not disclose segment revenue, current paying-account counts, or contribution margins. Driver scale therefore remains a supply indicator rather than evidence of customer demand.
    claimRefs: [CU001, CU002, CU003, CU004, CU013]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption evidence and durability limits
    body: >-
      Adoption evidence comes from incompatible metrics rather than a coherent cohort series. Reuters reported more than 5.4 million registered users in 2021, while an Endeavor profile described 33 million regular customers and more than 65,000 companies over Cabify's first ten years. Mexico Business News separately reported that more than 4,500 companies had hired Cabify for Businesses, and the current App Store surface showed a 4.5 rating from 291 ratings. Dealroom displayed 1.3 million monthly visits. These measures use different populations, periods, and denominators; none proves active use, repeat frequency, renewal, churn, GRR, or NRR.
    claimRefs: [CU005, CU006, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
  - id: proof-expansion-and-dependencies
    title: Customer proof, expansion, and dependency risk
    body: >-
      The retained evidence contains quantified customer cohorts but no named end-customer case study with contract scope, production-versus-pilot status, tenure, or measured outcome. That weakens confidence in enterprise reference quality and makes the named-customer table an audit of what is missing rather than a customer roster. Expansion is visible at the product level through corporate accounts and delivery, but durability depends partly on regulated supply. Reuters reported that Auro planned to move 1,100 drivers away from Cabify, while Spanish licensing constraints and unresolved Colombian platform-work rules show that fleet availability can be exposed to counterparties and regulation. These are operating dependencies, not evidence of customer churn.
    claimRefs: [CU004, CU008, CU012, CU013, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
callouts:
  - calloutType: strength
    title: Multiple demand surfaces share one workflow
    body: Consumer rides, managed employee transportation, and delivery can all begin from Cabify's app or business-account proposition, creating plausible cross-use expansion without proving that customers actually adopt multiple services.
    claimRefs: [CU003, CU004, CU013]
  - calloutType: risk
    title: Durability remains unverified
    body: Registered users, web visits, app ratings, and historical company counts are not retention metrics; cohort activity, renewal, churn, concentration, and unit economics remain private-evidence diligence items.
    claimRefs: [CU005, CU006, CU009, CU010, CU011, CU012]
tables:
  - id: TU001
    title: Customer segmentation
    columns: [Segment, Buyer / user / payer, Use case, Scale or strategic signal, Diligence gap]
    rows:
      - [Consumers, "Individual is buyer, user, and usually payer", "Car, taxi, electric-moped, or delivery request", "Live app workflow and marketplace rating", "Active users, repeat trips, and contribution margin"]
      - [Corporate mobility, "Employer or mobility manager buys; employees use", "Employee transportation and managed trips", "Corporate account and expense controls described", "Paying accounts, contract value, renewal, and revenue share"]
      - [Business delivery, "Business may buy; sender and recipient use", "Multi-stop movement of goods", "Cabify Delivery and API/web proof-of-delivery surface", "Order volume, SLA attainment, repeat rate, and economics"]
      - [Drivers and fleets, "Supply-side counterparty, not a demand-side customer", "Provide licensed vehicles and trip capacity", "230,000 drivers reported across markets in 2022", "Active supply, fleet concentration, exclusivity, and replacement time"]
    notes: "Segments and scale signals come from retained public sources; they use different units and vintages and do not constitute a revenue mix."
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU013]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Reported value, Period, Source / confidence, Implication, Missing denominator]
    rows:
      - ["Registered users", "More than 5.4 million", 2021, "Reuters / medium", "Historical reach", "Active users, geography, and registration definition"]
      - ["Regular customers", "33 million", "First ten years", "Endeavor / medium", "Large historical customer claim", "Definition, period end, active status, and reconciliation"]
      - ["Companies served", "More than 65,000", "First ten years", "Endeavor / medium", "Historical enterprise reach claim", "Current accounts, paying status, and contract value"]
      - ["Cabify for Businesses customers", "More than 4,500 companies", "Undated fetched article", "Mexico Business News / medium", "Evidence of a hired business service", "Publication date, active accounts, renewals, and revenue"]
      - ["App-store rating", "4.5/5 from 291 ratings", "Retrieved 2026-10-24", "Apple App Store / medium", "Current marketplace feedback surface", "Representativeness, market coverage, and trip volume"]
      - ["Monthly web visits", "1.3 million", "Profile at retrieval", "Dealroom / medium", "Digital interest across markets", "Unique visitors and booking conversion"]
      - ["Vulnerable-group users reached", "280,000", 2025, "Demócrata / medium", "Program reach beyond generic registered users", "Program definitions, unique users, and commercial status"]
    notes: "Metrics preserve each source's name, period, and denominator limits. No conversion, growth, retention, or active-customer rate is inferred across unlike measures."
    claimRefs: [CU005, CU006, CU009, CU010, CU011, CU012, CU014]
  - id: TU003
    title: Named customer proof table
    columns: [Customer / proof item, Segment, Deployment or use case, Production vs pilot, Reported outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Successful prefetched customer evidence assigned to this chapter and reviewed on 2026-10-24."
    rows:
      - ["Unnamed Cabify for Businesses cohort", "Enterprise", "Employee transportation", "Service described as hired; account status not broken out", "More than 4,500 companies reported", "No named customer, contract, renewal, or measured outcome"]
      - ["Unnamed consumer app users", "Consumer", "Ride, taxi, electric-moped, and delivery workflow", "Live product surface", "4.5/5 from 291 App Store ratings", "No named user, trip volume, repeat use, or representative satisfaction sample"]
      - ["Auro", "Fleet counterparty; not an end customer", "Licensed vehicles and drivers supporting ride fulfillment", "Operating relationship disputed in 2022", "Auro planned to move 1,100 drivers according to Reuters", "Supply dispute is not customer-retention or customer-outcome proof"]
    notes: "This partial audit intentionally distinguishes anonymous cohort evidence from named end-customer proof. Auro is included only as a named supply dependency, not as a customer reference."
    claimRefs: [CU003, CU005, CU008, CU012]
figures:
  - id: FU001
    title: Customer journey and expansion surfaces
    type: journey-map
    summary: "The observable journey moves from service selection to fulfillment and then to corporate or delivery expansion; retention stages remain undisclosed."
    data:
      nodes:
        - id: discover
          label: Discover available service
          touchpoints: ["Consumer app", "Corporate account proposition"]
        - id: choose
          label: Choose mobility mode
          touchpoints: ["Car", "Taxi", "Electric moped", "Delivery"]
        - id: request
          label: Request and price
          touchpoints: ["Origin and destination", "Estimated price before travel", "Payment method"]
        - id: fulfill
          label: Fulfill trip or delivery
          touchpoints: ["Licensed driver", "Ride or goods movement"]
        - id: manage
          label: Monitor and control
          touchpoints: ["Trip sharing", "Corporate expense controls", "Proof of delivery"]
        - id: expand
          label: Expand use
          touchpoints: ["Employee transportation", "Multi-stop delivery", "API or web workflow"]
    approximationNotes: "The sequence represents publicly described touchpoints, not measured conversion stages or a value-proportional funnel."
    claimRefs: [CU003, CU004, CU013]
