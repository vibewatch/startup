schemaVersion: "report-v2"
artifact: financials
slug: cabify
runDate: 2026-10-24
company:
  name: Cabify
chapter:
  number: 4
  title: Financials
  summary: Cabify has a transaction-led mobility model and historical evidence of substantial revenue, but public metrics vary in definition and stop short of audited current economics. Revenue quality, realized take rate, contribution margin, cash, debt, burn, and runway remain material underwriting gaps.
sections:
  - id: revenue-architecture-and-pricing
    title: Revenue architecture and pricing
    body: >-
      Cabify's core economic activity is transport intermediation: Bloomberg describes the Spanish entity as providing automobile transportation such as taxicabs, while Cabify's current App Store listing spans private-car and taxi rides, electric-moped rental, hybrid-car rental, deliveries, and corporate travel. AskCyborg characterizes monetization as ride commissions and service fees, which is consistent with a transaction model rather than ARR. Public pricing evidence is much thinner. The app presents an estimated trip price and applies promotions, but that is a customer quote, not realized net revenue. Multiples reports a 20% commission in 2015; it is a historical rate and should not be treated as Cabify's current take rate across countries, products, or corporate contracts.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: traction-and-profitability-signals
    title: Traction and profitability signals
    body: >-
      The available scale indicators are meaningful but not a clean time series. Reuters reported $516 million of global revenue, more than 5.4 million registered users, and 230,000 drivers in 2021. Multiples records $900 million of revenue alongside a March 2023 financing, but its own convention says financing-date figures may be run-rate revenue or reported LTM revenue; the figure is therefore not ARR and is not directly comparable without reconciliation. The same database summarizes later 2023 reports at $899.1 million of gross revenue, $111.1 million of gross profit, and break-even or slightly positive global EBITDA. Those values imply improving scale, but the assigned text does not provide audited statements, accounting policies, or a bridge from customer spend to reported revenue and gross profit.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: cost-base-and-operating-dependencies
    title: Cost base and operating dependencies
    body: >-
      Cabify's public record does not quantify driver incentives, insurance, payment processing, support, fraud loss, local compliance, or vehicle and license costs. Workforce evidence is also only a proxy: Dealroom maps 4,834 employees across 29 countries, while a careers aggregator documents recurring Recharge Days and benefits, but neither establishes payroll expense or the boundary between employees, contractors, and driver partners. A current Incognia partner release says the deployed fraud controls target fake rides, promo abuse, account sharing, and chargebacks, confirming that loss prevention consumes operating attention without disclosing savings or cost. A broad industry report puts 2021 U.S. ride-hailing operating costs at 45% of revenue; this is contextual only and cannot be applied to Cabify's Spain and Latin America footprint.
    claimRefs: [CI013, CI014, CI016]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Historical financing demonstrates access to capital but does not establish present liquidity. Selva reports a $110 million mixed equity-and-debt financing, a EUR 40 million European Investment Bank loan, and a planned $300 million Latin America investment; Multiples separately totals $469 million raised across seven rounds. These are different measures and cannot be converted into cash available, debt capacity, or runway. Supply concentration is another financial risk: Reuters reported that Auro, which employed 1,100 Cabify drivers, planned to move the fleet to Uber or Bolt during a 2022 dispute. The financial verdict is therefore conditional. Cabify shows transaction breadth and historical scale, but underwriting requires audited statements, country and segment contribution margins, take-rate and incentive waterfalls, current cash and debt schedules, covenant headroom, and a board-approved financing plan.
    claimRefs: [CI011, CI012, CI015]
callouts:
  - calloutType: strength
    title: Historical scale is visible
    body: Independent reporting and private-market data show substantial revenue scale, but periods and accounting labels must be reconciled before trend analysis.
    claimRefs: [CI006, CI008, CI009, CI010]
  - calloutType: risk
    title: Funding raised is not cash available
    body: Public financing totals mix equity, debt, and planned investment and do not disclose current liquidity, burn, maturities, or runway.
    claimRefs: [CI011, CI012]
  - calloutType: recommendation
    title: Condition underwriting on a financial data room
    body: Require audited statements, revenue-recognition policies, market-level contribution margins, cohort economics, and a current liquidity and debt package.
    claimRefs: [CI009, CI010, CI011, CI012, CI015]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Public status, Diligence ask]
    rows:
      - [Consumer car and taxi rides, "Commission or service fee on a completed trip", "Per trip", "Current product scope is public; current take rate is not", "Obtain bookings, take rate, incentives, refunds, and net-revenue bridge by market"]
      - [Corporate mobility, "Managed employee travel and deliveries through a corporate account", "Per trip or contract; public basis unavailable", "Management tooling is public; pricing and revenue mix are not", "Obtain contract pricing, volume, retention, concentration, and payment terms"]
      - [Delivery, "Service fee or commission on an in-app shipment", "Per delivery; public basis unavailable", "Current product capability is public; scale and margin are not", "Obtain orders, revenue, courier cost, loss rate, and contribution margin"]
      - [Micromobility and car rental, "Access to electric mopeds and hybrid cars", "Per rental; public basis unavailable", "Current App Store scope is public; asset economics are not", "Obtain ownership model, utilization, partner terms, capex, and maintenance cost"]
    notes: "The rows describe public product mechanisms, not disclosed segment revenue; units and realized prices remain unavailable where stated."
    claimRefs: [CI001, CI002, CI003]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing element, Public evidence, Period, Interpretation, Diligence ask]
    rows:
      - [Trip price, "Estimated price shown before travel", "Current App Store listing", "Customer-facing estimate, not recognized revenue", "Reconcile quoted fare, taxes, driver payment, incentives, refunds, and Cabify net revenue"]
      - [Current take rate, null, "Current", "No assigned source discloses a current realized rate", "Provide take rate by country, service, customer type, and channel"]
      - [Historical ride commission, "20%", "2015", "Historical database description; not a current pricing assumption", "Document every current commission schedule and exception"]
      - [Discounts and promotions, "Used for acquisition and retention; amount unavailable", "Current business-model description", "Discounting can raise bookings while reducing realized economics", "Provide promotion spend, redemption, incrementality, and cohort payback"]
    notes: "Null means unavailable rather than zero; the 2015 commission is preserved as historical and is not extrapolated to 2026."
    claimRefs: [CI002, CI004, CI005]
  - id: TI003
    title: Public financial indicators and underwriting gaps
    columns: [Metric, Value, Period and denominator, Confidence, Underwriting implication]
    rows:
      - [Global revenue, "$516M", "2021 global revenue reported by Reuters", "Medium", "Historical scale indicator; gross-versus-net basis is not stated in the assigned text"]
      - [Recorded revenue, "$900M", "March 2023 financing-date record; run-rate or reported LTM convention", "Low", "Do not label as ARR or combine with 2021 without reconciliation"]
      - [Gross revenue and gross profit, "$899.1M and $111.1M", "Later 2023 reports summarized by Multiples", "Low", "Paired figures imply about 12.4%, but the source does not label that ratio as audited gross margin"]
      - [Global EBITDA, "Break-even or slightly positive", "Later 2023 reports; no amount supplied", "Low", "Directionally positive but insufficient for cash-flow or covenant analysis"]
      - [CAC and payback, null, "Current, by country and cohort", "Unavailable", "Sales efficiency cannot be calculated"]
      - ["Cash, burn, debt maturities, and runway", null, "Current consolidated basis", "Unavailable", "Capital adequacy and the next-round trigger cannot be calculated"]
    notes: "Secondary-source metrics retain their original labels and periods; the 12.4% ratio is a rounded calculation of $111.1M divided by $899.1M, not a disclosed or audited margin."
    claimRefs: [CI006, CI008, CI009, CI010, CI011, CI012]
figures:
