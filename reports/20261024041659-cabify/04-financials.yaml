    title: Revenue model and cost bridge
    type: flow
    summary: Public evidence establishes the operating sequence, but not the monetary conversion between customer activity, recognized revenue, and profit.
    data:
      nodes:
        - id: customer-demand
          label: Consumer and corporate demand
          detail: "Ride, taxi, delivery, rental, and managed-business use cases."
        - id: quoted-price
          label: Quoted price and promotions
          detail: "The app shows an estimated trip price; realized discounts are not disclosed."
        - id: fulfillment
          label: Driver and vehicle fulfillment
          detail: "Driver and licensed-fleet access can constrain transaction volume."
        - id: customer-spend
          label: Customer spend
          detail: "Gross bookings or GMV are not disclosed in the assigned evidence."
        - id: cabify-revenue
          label: Commission and service-fee revenue
          detail: "Reported revenue definitions and current take rate require reconciliation."
        - id: profitability
          label: Gross profit and EBITDA
          detail: "Driver economics, incentives, fraud, support, insurance, and compliance shape conversion."
    approximationNotes: "This is a qualitative operating bridge; node order does not imply conversion rates, amounts, or a cumulative waterfall."
    claimRefs: [CI002, CI003, CI014, CI015, CI016]
