  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Current city-by-city passenger and corporate mobility spend, Cabify take rates, and serviceable supply by operating market.
      whyItMatters: Without a serviceable denominator, global category estimates cannot support a Cabify SAM, SOM, or revenue-to-market conversion.
      diligencePath: Request monthly trips, gross bookings, take rate, active riders, corporate account spend, and licensed supply by city for the latest twelve months.
      relatedQuestionRefs: [QM003, QM008]
    - type: conflicting-data
      severity: material
      topic: regulation
      missingEvidence: A current consolidated inventory of VTC licensing, fare, and fleet rules by Spanish autonomous community and Cabify operating city.
      whyItMatters: Fragmented rules can change prices, coverage, compliance cost, and the margin pool independently of category growth.
      diligencePath: Obtain Cabify's legal and licensing matrix, open proceedings, permit inventory, and scenario analysis for Madrid and other material cities.
      relatedQuestionRefs: [QM006, QM007]
    - type: private-evidence-only
      severity: material
      topic: buyer-segmentation
      missingEvidence: Segment-level conversion, retention, utilization, and corporate budget ownership data.
      whyItMatters: Adoption quality and recurring enterprise demand determine whether market growth translates into durable contribution margin.
      diligencePath: Request cohort retention, trip frequency, corporate gross bookings, churn, and contribution margin by consumer, business, and adjacency segment.
      relatedQuestionRefs: [QM004, QM008]
