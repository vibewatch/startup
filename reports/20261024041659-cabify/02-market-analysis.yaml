schemaVersion: "report-v2"
artifact: market-analysis
slug: cabify
runDate: 2026-10-24
company:
  name: Cabify
chapter:
  number: 2
  title: Market Analysis
  summary: Cabify participates in digitally mediated urban passenger transport, with adjacent corporate mobility, logistics, and multimodal services. External evidence supports a large and growing ride-hailing category, but the sources do not isolate Cabify's serviceable market or a defensible SOM; regulation, driver supply, and city-level density remain the key adoption and valuation constraints.
sections:
  - id: market-boundary
    title: Market boundary and economic model
    body: >-
      The relevant market is digitally mediated, on-demand urban passenger transport: a
      platform matches a passenger or business account with a licensed driver, handles
      booking, payment, trip records, and service categories. GMI's scope explicitly includes
      e-hailing, rental, outstation, and corporate mobility platforms, and excludes
      non-platform street hails, private vehicle ownership, and freight-only activity. That
      boundary is useful for Cabify because its core demand is a trip rather than a software
      seat. Corporate accounts are an adjacent demand pool with a different budget owner and
      control workflow, while Cabify Go's subscriptions, micromobility, bikes, and courier
      services are adjacency experiments rather than interchangeable TAM. The status quo is
      a traditional taxi, public transport, private car, walking/cycling, or an employer's
      unmanaged reimbursement process. Cabify therefore competes for city trips and managed
      ground-transport spend, not all mobility or all logistics spend.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what remains unproven
    body: >-
      The strongest external category lens is GMI's estimate of USD 188.6 billion in global
      ride-hailing service value in 2025, USD 213.2 billion in 2026, and USD 489.5 billion in
      2035, implying a 9.7% 2026–2035 CAGR. Its scope includes corporate mobility and
      platform-booked two- to four-wheelers, buses, and shuttles, but excludes conventional
      street-hailed taxis and freight-only activity. A second lens is the EV ride segment,
      which GMI sizes at USD 35.6 billion in 2025, while a third is the enterprise lens:
      GMI describes corporate mobility as growing at 11.6% CAGR, above the overall market.
      These are not additive TAM layers. A June 2026 independent analysis describes Cabify
      as operating in six countries and more than 40 cities, but the assigned evidence does
      not provide a current city-by-city spend denominator, take rate by segment, or a
      serviceable share. A precise SAM/SOM is therefore an evidence gap, not a number to
      infer from global market size.
    claimRefs: [CM004, CM005, CM006, CM007, CM011]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments
    title: Buyers, users, and adoption path
    body: >-
      Cabify has at least three economic demand paths. Consumers are the users and usually
      payers for individual trips or subscriptions; their trigger is reliable, transparent,
      convenient transport in a specific city. Corporate clients are buyers and budget owners,
      while employees are users; the trigger is controlled travel spend, receipts, policy
      enforcement, duty of care, and trip-level reporting. Fleet operators and professional
      drivers are supply-side participants rather than customers in the same sense, but their
      availability determines wait times, coverage, and price reliability. The multimodal
      subscription pilot shows a cross-sell path: Cabify placed ride-hailing, micromobility,
      bike subscriptions, and courier services under one app, and reported that 50% of Bive's
      user base was new to the Cabify platform. The adoption sequence is consequently
      city-specific: establish supply density, win a repeat use case, then expand into
      business accounts or adjacent modes. Public evidence does not quantify conversion,
      retention, or corporate budget share.
    claimRefs: [CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Urban congestion, smartphone access, on-demand preferences, and electrification are
      structural demand or cost drivers. GMI links platform growth to urban density and
      mobile connectivity, while its analysis says fleet electrification can become an
      operating-cost lever when financing, charging, and driver support are available.
      Those drivers do not automatically create margin: platform economics depend on local
      licensing, driver supply, fleet access, and the ability to price during peaks. In
      Madrid, reporting describes a dispute over an operator employing 1,100 Cabify drivers,
      with Cabify and Uber estimated at similar market share by the fleet owner; that is a
      concrete distribution and supply concentration risk. Spanish regulation is also
      fragmented. Merca2 reports that regional rules differ and that ordinary high-demand
      price increases in Madrid were being constrained. The market can grow while Cabify's
      addressable margin pool remains constrained by compliance and local density.
    claimRefs: [CM012, CM013, CM014, CM015]
    tableRefs: []
callouts:
  - calloutType: insight
    title: Market conclusion
    body: The category is large and growing, but Cabify's investable market is a city-by-city serviceable pool whose size depends on licensed supply, corporate penetration, and repeat utilization; global TAM should not be treated as Cabify revenue potential.
    claimRefs: [CM004, CM007, CM012]
  - calloutType: risk
    title: Adoption constraint
    body: Driver and fleet concentration plus changing regional rules can reduce coverage or constrain dynamic pricing before demand becomes the binding limitation.
    claimRefs: [CM012, CM014, CM015]
tables:
  - id: TM001
    title: Market definition and substitutes
    columns: [Segment/category, Included spend, Excluded spend, Buyer/payer, Relevance]
    rows:
      - [Platform-booked passenger trips, App-booked taxi and private-hire trips, Street-hailed non-platform taxi trips, Consumer or business account, Core Cabify transaction pool]
      - [Corporate mobility, Managed employee and business ground transport, Unmanaged personal travel reimbursement, Employer travel or procurement budget, Higher-control recurring demand]
      - [Multimodal mobility, Subscriptions and connected bike/micromobility services, Private vehicle ownership and unrelated mobility assets, Consumer subscription payer, Adjacency and cross-sell pool]
      - [Logistics adjacency, Platform-booked courier or last-mile services, Freight-only activity outside Cabify's selected markets, Business logistics budget, Separate adjacency; not core ride-hailing TAM]
    notes: GMI scope is the external category boundary; Cabify product adjacencies are separated because their spend, buyer, and unit economics are not interchangeable with passenger trips.
    claimRefs: [CM001, CM002, CM003, CM009]
  - id: TM002
    title: External sizing lenses
    columns: [Publisher, Year/period, Geography, Value, CAGR or rate, Methodology/scope, Confidence, Limitation]
    rows:
      - [GMI Insights, 2025, Global, "USD 188.6B", null, "Digitally mediated ride-hailing service market", medium, "Analyst estimate; not Cabify-specific"]
      - [GMI Insights, 2026, Global, "USD 213.2B", null, "Projected market size within the same scope", medium, "Projection; not a reported Cabify addressable pool"]
      - [GMI Insights, 2035, Global, "USD 489.5B", "9.7% 2026–2035", "Forecast for platform-booked passenger mobility", medium, "Forecast sensitivity and no Cabify share"]
      - [GMI Insights, 2025, Global, "USD 35.6B EV ride segment", "11.6% segment CAGR", "Electric-vehicle ride segment", medium, "Segment overlaps the total market; not additive"]
      - [GMI Insights, 2026–2035, Global, "Corporate mobility", "11.6% CAGR", "Enterprise mobility demand lens", medium, "Rate is not a disclosed market value"]
    notes: Values and rates are reproduced from GMI Insights; the lenses have different scopes and must not be summed or converted into Cabify SAM/SOM without city, segment, and take-rate evidence.
    claimRefs: [CM004, CM005, CM006, CM007, CM016]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Consumer ride-hailing, Individual passenger, Passenger, Individual passenger, "Book, ride, pay, rate", Consumer transport spend, Availability and reliable pickup]
      - [Corporate mobility, Employer or travel manager, Employee or guest, Employer, Policy-controlled booking and receipt, Travel/procurement, Spend control and duty of care]
      - [Driver/fleet supply, Fleet operator or driver, Driver, Fleet operator or driver, "Accept, complete, and reconcile trips", Fleet operating budget, Demand density and predictable earnings]
      - [Multimodal subscription, Individual subscriber, Subscriber, Subscriber, Select plan and use multiple services, Consumer mobility budget, Convenience and cross-service discount]
    notes: The map distinguishes demand-side buyers from supply-side participants; public sources do not quantify conversion, retention, or budget share for any segment.
    claimRefs: [CM008, CM009, CM010, CM011]
