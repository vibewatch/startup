companyProfile:
  summary: >-
    Meter is a San Francisco-based enterprise networking company founded in 2015 by brothers Anil
    and Sunil Varanasi. The company built a vertically integrated stack across hardware, software,
    deployment operations, and support, then wrapped that stack in a recurring service model that
    removes upfront customer capex. Public evidence shows a meaningful transition from founder-led
    product build-out into channel-led distribution through Microsoft, Lumen, CDW, WWT, and other
    partners, culminating in a $170 million Series C in June 2025 at roughly a $1 billion
    valuation. The major limitation is disclosure quality: the public record still does not provide
    revenue, ARR, profitability, customer-count, or current headcount data sufficient to underwrite
    the private mark with high confidence.
  foundedDate: "2015-01-01"
  founders:
    - name: Anil Varanasi
      role: Co-founder & CEO
      background: Co-founded Meter and leads the company's long-duration utility-style networking thesis, capital formation, and go-to-market narrative.
      claimRefs: [CO003, CO035]
    - name: Sunil Varanasi
      role: Co-founder & CTO
      background: Technical co-founder behind Meter's vertically integrated networking stack and ongoing emphasis on one unified platform across hardware and software.
      claimRefs: [CO003, CO005]
  foundingLocation: San Francisco, California, United States
  headquarters: San Francisco, California, United States
  productSummary: >-
    Meter provides enterprise internet, Wi-Fi, cellular, LAN/WAN networking, and lifecycle support
    through a single managed platform. It designs networking hardware, runs its own operating and
    management stack, installs networks, procures connectivity, and increasingly layers AI-assisted
    operations through Meter Command.
  customerFocus: >-
    U.S.-first organizations operating offices, warehouses, campuses, schools, and data centers,
    especially buyers that want to outsource networking complexity to a predictable managed service.
  businessModel: >-
    Recurring network-as-a-service subscription with no upfront hardware or installation charge to
    the customer; Meter carries hardware ownership, deployment, and refresh responsibility inside
    the contract.
  stage: Series C
  fundingStatus: >-
    Raised a $170 million Series C led by General Catalyst on 2025-06-12. Reviewed third-party
    market trackers place the post-money valuation at about $1 billion and total disclosed funding
    at about $315 million.
