  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: compliance-evidence
    missingEvidence: Customer-accessible SOC 2 report, penetration test summary, and any additional certifications beyond
      the public portal summary.
    whyItMatters: Security diligence is stronger when the underlying artifacts, scope, and exceptions can be reviewed directly
      rather than inferred from marketing copy.
    diligencePath: Request trust-portal downloads and security questionnaires during diligence, then compare control coverage
      with buyer requirements.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: command-benchmarks
    missingEvidence: Independent benchmark data on Command accuracy, false positives, rollback behavior, and production incident
      outcomes.
    whyItMatters: Autonomy and AI-assisted operations are central to Meter’s premium thesis, but public proof still leans
      on self-reported metrics and media paraphrases.
    diligencePath: Ask for benchmark methodology, customer references using Command in production, and redacted postmortems
      showing how automated actions behaved.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: supply-chain-resilience
    missingEvidence: Manufacturing partners, secondary-source strategy, component concentration, warranty reserves, and refresh-logistics
      detail for the custom hardware stack.
    whyItMatters: Meter’s differentiation and subscription economics both depend on reliable hardware supply and affordable
      lifecycle refreshes.
    diligencePath: Request hardware roadmap reviews, manufacturing redundancy plans, and service-logistics KPIs from hardware
      leadership.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: developer-ecosystem-depth
    missingEvidence: Public SDKs, richer docs, or broader practitioner-community signals that show developers building on
      Meter beyond demos and marketing pages.
    whyItMatters: A deeper ecosystem would strengthen the platform-control thesis and reduce concern that developer surface
      is still shallow.
    diligencePath: Ask for roadmap on SDKs, docs, partner integrations, and reference customers using the GraphQL API in production.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
