- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Meter workflow
  - Public benefit
  - Limitation or risk
  rows:
  - - Stand up a new site
    - Legacy procurement, design, install, and ISP coordination span many vendors
    - Meter runs discovery, planning, design, equipment planning, installation, validation, and ongoing management
    - Weeks-not-months deployment with one accountable provider
    - Customer still depends on Meter operations and partner timing for execution
  - - Replicate standard network configs across locations
    - Configuration drift and per-device changes slow expansion
    - Digital twin and templated topologies replicate settings across sites
    - Faster rollout with less manual pre-configuration
    - Desired-state mistakes could propagate broadly if templates are wrong
  - - Troubleshoot a live incident
    - Teams swivel between dashboards, CLIs, and support queues
    - Dashboard, support telemetry, and Command consolidate data and actions
    - Faster triage and proactive support claims
    - Public evidence of independent MTTR benchmarks is limited
  - - Secure browsing and enforce policy
    - Separate DNS or SWG tooling adds complexity
    - Cloudflare-backed DNS security policies are managed from Meter
    - Granular category and application filtering from the same stack
    - Security outcome partially depends on Cloudflare integration scope
  - - Improve indoor cellular coverage
    - DAS projects are slow, expensive, and operationally heavy
    - Meter installs neutral-host cellular APs on Ethernet and manages operations
    - Weeks-scale rollout and shared stack with network product
    - Carrier partnerships and local conditions constrain performance
  - - Buy LAN and WAN together
    - WAN procurement and LAN deployment happen in separate systems
    - Lumen metrics and procurement flow into Meter Connect and roadmap into Command
    - Lower coordination cost and unified visibility
    - WAN depth is partner-led rather than natively owned by Meter
  notes: The workflow rows emphasize user jobs that are explicitly described in Meter product, operations, partner, and customer
    materials rather than hypothetical use cases.
