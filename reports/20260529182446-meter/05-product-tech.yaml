- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or metric
  - Public status
  - Scope
  - Evidence
  - Residual gap
  rows:
  - - SOC 2 Type II
    - Claimed and downloadable via dashboard
    - Corporate control environment
    - Security and trust pages reference SOC 2 Type II plus downloadable compliance documents
    - Reports are not publicly downloadable outside customer access
  - - Penetration test report
    - Claimed available in dashboard
    - Security assurance artifact
    - Trust portal lists penetration test report as available to customers
    - No public summary of findings or remediation cadence
  - - HIPAA / PCI support
    - Claimed support
    - Customer compliance support
    - Security page says Meter supports customer compliance with HIPAA and PCI
    - Support statement is not the same as independent certification
  - - RBAC + audit logs
    - Claimed live control
    - Management plane and dashboard access
    - Security page describes role-based access and audit logs
    - No public granularity on role templates or admin review workflows
  - - Encryption and plane separation
    - Claimed live control
    - Data in transit / at rest and network architecture
    - Trust portal states data-control plane separation and no packet decryption; Command handbook states encryption at rest
      and in transit
    - No public cryptographic implementation detail
  - - DNS security
    - GA
    - Category, app, VLAN, and domain filtering
    - DNS-security blog, Meter announcement, and Cloudflare partner post describe live capabilities
    - Cloudflare dependency remains material
  - - Support SLAs / issue handling
    - Claimed live metric
    - Operational reliability
    - Support page states 99.99% solved within 24 hours and 3x faster response
    - No public incident feed or historical SLA attainment dataset
  - - Post-deployment validation
    - Claimed live process
    - Performance, core network features, failover, wireless, and site-specific checks
    - Operations design page documents validation categories
    - External benchmark or audit evidence is absent
  notes: Public trust evidence is stronger than for many startups, but several artifacts are summarized publicly while the
