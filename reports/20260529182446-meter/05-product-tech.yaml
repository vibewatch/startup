  title: Product architecture map
  type: stack
  layout: wide
  summary: Meter’s public architecture is a stacked control model where interfaces, control logic, unified NOS, and custom
    hardware are tightly coupled and then extended through external partners.
  data:
    layers:
    - label: User + admin interface
      detail: Operators interact through dashboard, Command, alerts, and shared multi-site views.
      modules:
      - Dashboard
      - Command
      - Alerts
      - Multi-site views
    - label: Programmatic + workflow layer
      detail: API and workflow services expose integrations, ticketing, and generated dashboards.
      modules:
      - GraphQL API
      - Integrations
      - Support ticketing
      - Shared canvas dashboards
    - label: Control + policy layer
      detail: Desired state, digital twin logic, and security policies orchestrate configuration changes.
      modules:
      - Desired state config
      - Digital twin
      - RBAC
      - DNS policies
      - VPN policies
    - label: Network operating layer
      detail: Unified NOS and telemetry services normalize behavior across the full stack.
      modules:
      - Unified NOS
      - Telemetry pipelines
      - Wireless control
      - Switching control
      - Firewall services
    - label: Hardware + edge layer
      detail: Custom APs, switches, firewalls, and gateways deliver the physical network surface.
      modules:
      - A-Series APs
      - S-Series switches
      - F-Series firewalls
      - G-Series / cellular gateways
    - label: External dependency layer
      detail: Partners and cloud providers extend DNS security, WAN, carrier reach, and model training.
      modules:
      - Cloudflare Tenant API
      - Lumen WAN APIs
      - Carrier partners
      - Azure compute
      - ISPs
  approximationNotes: The stack groups functions that Meter describes across multiple pages; it is an interpretive synthesis
    of public architecture rather than an official engineering diagram.
