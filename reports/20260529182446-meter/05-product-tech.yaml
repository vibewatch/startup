- id: TE001
  title: Product module / asset matrix
  columns:
  - Module or asset
  - Primary user
  - Current public status
  - Differentiation
  - Dependency or diligence gap
  rows:
  - - Meter Network core bundle
    - IT / infrastructure teams
    - Live core offer
    - Single subscription that bundles hardware, software, security, monitoring, and operations
    - Economics of bundle and interoperability with third-party gear remain lightly disclosed
  - - Meter Dashboard + API
    - Network admins, internal tooling teams
    - Live
    - Single control plane across topology, logs, VPN, VLANs, DNS security, and multi-site management plus GraphQL API access
    - Public docs do not expose broad SDK or rate-limit depth
  - - Meter Command
    - Network engineers, support, operations, partners
    - Launched in 2024 and expanded in 2025
    - Natural-language generative UI that can query data, build dashboards, and stage actions with confirmation
    - Independent benchmark data is limited and trust still relies on human-in-the-loop controls
  - - A-Series wireless
    - Site users and wireless admins
    - Current hardware family
    - Wi-Fi 7 APs integrated with RF automation, security policies, and unified management
    - Real-world enterprise client adoption of Wi-Fi 7 still lags the feature set
  - - S-Series switching + digital twin
    - Network engineers and deployment ops
    - Current hardware family
    - Virtualized staging, topology visibility, and switch-aware full-stack observability
    - Digital-twin depth is demonstrated publicly but mostly through Meter-owned channels
  - - F-Series firewalls
    - Security and infra teams
    - Current hardware family
    - High-throughput firewalls with built-in HA and 5G failover support
    - Public claims lack independent performance testing and incident-history transparency
  - - Cellular
    - Facilities-heavy enterprises, offices, warehouses, schools
    - GA in 2025 after 2024 beta
    - Neutral-host, single-Ethernet installation model integrated into the Meter stack
    - Carrier and regulatory dependencies are material
  - - WAN-to-LAN extension with Lumen
    - Distributed-enterprise buyers
    - Available through Meter Connect
    - Combines WAN procurement and metrics with Meter LAN management
    - Joint reliability depends on Lumen APIs, provisioning, and shared support execution
  notes: Rows reflect the major product and platform surfaces that are publicly visible as of 2026-05-29; this is a product
    map, not a complete SKU catalog.
