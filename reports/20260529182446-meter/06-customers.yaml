- id: retention-expansion-and-channel
  title: Retention and expansion signals exist, but they are narrow
  body: 'The chapter’s durability evidence is directionally positive but still narrow. Meter now cites 99.6% customer retention through Channel Dive, and FeaturedCustomers shows a healthy stock of testimonials, case studies, and reference ratings. More importantly, some stories suggest repeat use rather than one-off installations: LatchBio kept Meter during an office move, Strava and Loom talk about future locations, and Knowing Technologies is considering recommending Meter to more schools after the Keys deployment. That pattern fits Meter’s economic model. Official partner pages say the company is channel-first, aligns incentives through the full customer lifecycle, and in May 2026 launched a $100 million fund for partner-sourced migrations, enablement, and co-selling. Together, those signals imply that expansion is supposed to come from refresh events, repeat site templates, and partner referrals. But none of the public sources break out logo retention versus revenue retention, cross-sell
    attachment, or renewal cohort behavior. The public story supports “some expansion motion exists,” not “durability is independently proven.”'
