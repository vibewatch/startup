  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: customer-base-coverage
    missingEvidence: A full customer census with customer count, production site count, and vertical / geography mix rather than a public sample of case studies.
    whyItMatters: The current chapter proves Meter has real customers, but not whether revenue is diversified or concentrated in a few account types.
    diligencePath: Request current customer count, top 10 customers by ARR, and a vertical / geography revenue split from management.
    relatedQuestionRefs:
    - QU010
    - QU021
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Logo retention, GRR, NRR, cohort renewal timing, and the exact methodology behind the 99.6% retention claim.
    whyItMatters: Without cohort definitions, public retention proof remains too weak to underwrite durable expansion economics.
    diligencePath: Request cohort tables, renewal schedules, gross and net retention definitions, and customer churn data for the last 24 months.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: independent-satisfaction
    missingEvidence: Broader independent review depth or customer reference calls beyond Meter-authored stories and curated testimonial platforms.
    whyItMatters: The current reference set could overstate satisfaction if weaker deployments are simply not visible in public sources.
    diligencePath: Request raw reference-call availability, Gartner or G2 exports, and customer contacts not selected by Meter marketing.
    relatedQuestionRefs:
    - QU020
    - QU023
    relatedTableRefs:
    - TU004
    - TU006
  - type: missing-source
    severity: material
    topic: contract-exit-risk
    missingEvidence: Contract length, hardware ownership terms, termination rights, transition support, and SLA remedies for buyers who want to leave the platform.
    whyItMatters: Meter’s integrated NaaS model can create real switching friction if customers later want multivendor flexibility or need to replace the provider.
    diligencePath: Review the current MSA, order forms, renewal clauses, and migration support commitments with legal and customer references.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU006
