- id: concentration-and-customer-risks
  title: Concentration and customer-side risks remain the open diligence problem
  body: 'The core underwriting gap is not whether Meter has customers; it is whether investors can see enough of the customer base to judge concentration, independence of satisfaction, and switching risk. None of the fetched chapter sources publish customer count, top-account exposure, vertical ARR mix, NRR, GRR, or contract duration. The observable mix also skews toward venture-backed offices, schools, and warehouses, which is useful for proving the product works but does not prove how diversified revenue really is. Independent evidence is also thinner than the testimonial set suggests: PeerSpot has no collected reviews, while the positive reference depth is concentrated in Meter-authored stories and curated review collections. Finally, a general NaaS risk still applies. Independent NaaS analysis warns that buyers should care about vendor dependency, exit clauses, SLA terms, and provider-performance dependence. Because Meter’s promise is a vertically integrated one-provider relationship,
    that risk is not theoretical. The customer story is strong on productized simplicity, but still under-disclosed on concentration, renewal economics, and switching friction.'
