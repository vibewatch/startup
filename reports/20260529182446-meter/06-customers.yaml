- id: production-proof-across-verticals
  title: Production proof is real, but mostly company-authored
  body: 'Meter does clear the “are there real customers?” hurdle. The fetched set contains a dozen named customer case studies from 2022 through 2025, and the examples are not abstract logos: Brex, Loom, Strava, Thumbtack, GoBolt, Keys School, Webb School, Third Wave Automation, LatchBio, Perpay, Qualified, and Seis all describe specific environments, buyer roles, and reasons they adopted Meter. Several stories include stronger-than-usual operational detail: GoBolt ties the network to scanners and warehouse robotics across 13 sites; Webb School says a weekend basketball tournament streamed cleanly over the new network; Thumbtack reports a 3× savings outcome plus fewer support tickets; Strava points to dedicated monitoring and rapid DNS troubleshooting. The limitation is equally important. Nearly all of this proof is authored by Meter itself, not by customer procurement documents, audited renewal data, or independent integrator benchmarks. So investors can underwrite that production deployments
    exist, but not that the public story yet measures the whole installed base or the full durability of those deployments.'
