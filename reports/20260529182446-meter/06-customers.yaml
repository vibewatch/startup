- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver or risk
  - Public evidence
  - Strategic implication
  - Limitation / diligence path
  rows:
  - - Network refresh / office move trigger
    - Brex, Loom, Thumbtack, Qualified, and Seis all engage Meter during moves, rebuilds, or replacements
    - Meter can win when the buyer already has a forcing function
    - Need to know how much pipeline depends on refresh timing
  - - Operational pain trigger
    - GoBolt, Strava, and Keys all describe pain that a small internal team could not absorb alone
    - Labor leverage is a repeatable land motion
    - No public win-rate data by pain point
  - - Partner-led migration
    - 2026 partner fund includes rebates, spiffs, migration incentives, and enablement for partner-led deals
    - Channel can widen distribution and make switching easier
    - Unknown mix of new logos vs expansions
  - - MSP referral flywheel
    - Knowing Technologies is considering more school recommendations after the Keys deployment
    - A successful first education deployment can open adjacent accounts
    - Only one public partner case so far
  - - Concentration unknown
    - No public customer count, top-account exposure, or revenue-band disclosure appears in the chapter source set
    - Revenue diversification cannot be underwritten from public proof alone
    - Request top-customer ARR, logo count, and vertical split
  notes: The same evidence that shows expansion logic also shows where concentration risk remains under-disclosed, so the table combines both the upside path and its main blind spots.
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU031
  - CU032
  - CU039
- id: TU006
  title: Independent proof and diligence gap table
  columns:
  - Gap
  - Current public evidence
  - Potential impact
  - Diligence path
  rows:
  - - Independent review depth
    - FeaturedCustomers is populated, but PeerSpot has no collected reviews
    - Public satisfaction may look stronger than broad independent sentiment
    - Request raw reference lists and third-party review exports
  - - Retention quality
    - 99.6% retention appears only as a company-claimed metric reported by Channel Dive
    - Durability cannot be underwritten at cohort level
    - Ask for GRR, NRR, churn, and cohort renewal history
  - - Exit and contract terms
    - No public evidence shows contract length, hardware ownership, or migration assistance on exit
    - Customers may face switching friction if provider performance disappoints
    - Review master service terms and termination clauses
  - - Revenue concentration
    - No public customer count or top-account concentration appears in the chapter evidence set
    - A small number of large accounts could drive the business disproportionately
    - Request top 10 accounts by ARR and gross margin
  - - Model risk for NaaS buyers
    - Independent NaaS coverage warns about vendor dependency, SLA sensitivity, and possible latency issues
    - Meter’s one-provider model can create real switching and performance dependency
    - Pressure-test customer contracts, SLAs, and fallback options
  notes: 'This is the chapter’s diligence to-do list: the public proof is strong enough to show real customers, but not strong enough to clear concentration, renewal, and exit-risk underwriting.'
