  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sla-opacity
    missingEvidence: The full Platform SLA, support terms, service-credit schedule, and any negotiated enterprise riders.
    whyItMatters: Without remedy mechanics, investors cannot judge whether Meter’s contractual downside is proportional to the operational centrality of the service.
    diligencePath: Request the current Platform SLA, support terms, change log, and top-customer order forms with any custom liability or service-credit language.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: An independently verifiable incident history or public status page showing outage frequency, duration, and remediation outcomes.
    whyItMatters: The support page makes strong performance claims, but public evidence does not show how Meter performs under real service stress.
    diligencePath: Ask for Sev-1/Sev-2 incident logs, SLA attainment reports, credit payouts, and customer references for recent outages or service degradations.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR002
    - TR005
  - type: enumeration-incomplete
    severity: material
    topic: supplier-and-certification-depth
    missingEvidence: A SKU-by-SKU map of hardware certifications plus the list of critical component suppliers and backup vendors.
    whyItMatters: Without supplier and certification depth, the underwriting case cannot distinguish a resilient hardware program from a brittle one.
    diligencePath: Request current FCC grant inventory, product change notices, top component dependencies, lead times, and dual-source coverage by critical SKU.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: partner-fund-economics
    missingEvidence: Eligibility rules, subsidy mix, gross-margin impact, payback period, and loss-sharing terms for the $100M partner fund.
    whyItMatters: Channel-led growth can look powerful while still being economically fragile if subsidies, buybacks, or POCs are overused.
    diligencePath: Review partner-fund playbooks, approved uses, win-rate cohorts, and any portfolio-level caps on subsidy intensity.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: execution-bench
    missingEvidence: Org chart, support headcount by region, leadership succession plan, and hiring / attrition data for field, support, and networking roles.
    whyItMatters: A vertically integrated model fails operationally when staffing breadth lags sales and hardware footprint growth, even if the product is sound.
    diligencePath: Request org design, headcount plan, open roles, turnover data, and escalation ownership for support, compliance, and partner operations.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: Credible ARR, gross margin, burn, working-capital profile, refresh reserve assumptions, and top-customer concentration data.
    whyItMatters: This chapter’s top risks transmit through economics; without core financial and concentration data, the downside cannot be priced with conviction.
    diligencePath: Request board-approved KPI packs covering ARR, gross margin, cash burn, top-customer share, renewal rates, and refresh liability assumptions.
    relatedQuestionRefs:
    - QR017
    - QR023
    - QR027
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
