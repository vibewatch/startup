- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / compliance drift
    - Material inquiry, consent order, or lapse in independent security assurance
    - Any FCC/privacy enforcement action, or inability to maintain SOC 2 / equivalent evidence
    - Pause or re-price underwriting until counsel verifies scope and remediation cost
  - - Service reliability shortfall
    - Severe incident pattern or weak remedy structure
    - Repeated Sev-1 outages, meaningful public complaint pattern, or failure to disclose real SLA credits
    - Treat as thesis damage because contractual recourse already appears capped
  - - Customer concentration
    - Top-account or top-five exposure exceeds standard software red flags
    - Any single customer >10% of ARR or top five >30-40% without long-term contracted cover
    - Move view toward avoid unless diversification and retention evidence are strong
  - - Partner fund dependency
    - Growth depends on subsidized migrations without visible payback
    - Management cannot show partner-fund win-rate, payback, or gross-margin discipline
    - Treat as a capital-efficiency blocker rather than a go-to-market strength
  - - Supplier and deployment fragility
    - No documented diversification or lead-time resilience
    - Critical SKUs lack backup sourcing, field replacements stretch materially, or certifications slip
    - Assume margin and booking volatility until proven otherwise
  - - Financial opacity
    - Core economics remain undisclosed after diligence
    - No credible ARR, gross-margin, burn, or refresh-liability view
    - Stop before investment committee; this is a diligence blocker, not a paperable caveat
  notes: These kill criteria are intentionally monitorable from diligence and public follow-up, not from private vanity metrics.
