- id: SR004
  title: Financial opacity keeps mitigations provisional and defines the kill criteria
  body: |-
    Financial opacity is what keeps the preceding risks from compressing into a cleaner underwriting range. Meter’s pricing pages make clear why customers like the model: no upfront capex, bundled refreshes, predictable monthly fees, ASC 842 flexibility, included upgrades, and managed ISP economics. Those same features mean the vendor is absorbing more lifecycle, refresh, and working-capital responsibility than a normal software company. If hardware refresh cadence, support intensity, or partner-fund subsidies are mispriced, margin compression can show up long before customers feel pain. CRN’s reporting that Meter is ramping production during a memory-shortage and supply-chain crunch further raises the execution bar.

    Macro context makes that harder, not easier. Marsh highlights 2026 pressure from geopolitics, labor shortages, cyberattacks, and critical-material bottlenecks, while Network World notes the industry-wide shortage of network engineers that Meter is trying to offset with automation. These are exactly the conditions under which a vertically integrated hardware-plus-service model can look strongest in sales conversations and most fragile in financial statements. That is why the practical kill criteria in this chapter focus on evidence that can actually change the call: any material regulatory inquiry, repeated severe service incidents, customer concentration above standard red-flag levels, inability to prove supplier diversification, or continued refusal to disclose enough ARR/gross-margin/payback data to test whether Meter’s all-in economics are durable.
