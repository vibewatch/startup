- id: channel-economics-and-capital-adequacy
  title: Channel economics and capital adequacy
  body: 'Meter’s growth model now appears to lean heavily on channel-led recurring revenue rather than only direct enterprise sales. Meter’s own partner pages pitch high-margin annual recurring revenue, lower customer monthly costs, and faster closes, while LTT Partners markets installation and level-one support layered on top of Meter subscriptions. Third-party channel coverage makes the acquisition subsidy more explicit: ChannelDive says Meter launched a $100 million partner growth fund distributed through rebates, sales spiffs, migration incentives, training, and marketing-development funds, and CRN quotes SageNet expecting a 40% to 50% shift of traditional deployments to Meter’s model over the next 24 to 36 months. On financing, Meter’s June 2025 Series C is well corroborated at $170 million, but public databases disagree on total funding and employee count: Tracxn shows $315 million raised and 220 employees, while Network World lists $255 million of funding and PitchBook previews 142
    employees. The financing clearly supports expansion, but public cash, burn, runway, and debt data remain absent.'
