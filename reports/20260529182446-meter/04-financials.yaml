tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Core network subscription
    - Bundled hardware, software, security, support, network design, and ISP management sold as a recurring service
    - Monthly subscription
    - Explicitly disclosed and marketed as the primary commercial model
    - High if contracts are recurring and sticky, but realized pricing is undisclosed
    - Provide ARR, customer count, average contract value, and renewal cohorts by plan
  - - Professional subscription
    - Recurring contract with installation excluded and fulfilled by the customer or partner
    - Per location / per square foot
    - Publicly disclosed as a lighter-touch tier
    - Good recurring quality, but lower attached-services mix is unknown
    - Share mix of Professional versus Premium bookings and average gross margin by tier
  - - Premium subscription
    - Recurring contract plus Meter-led installation and rollout including cabling work
    - Per location / per square foot
    - Publicly disclosed as full-service option
    - Potentially higher ACV but also higher delivery burden
    - Break out attach rate, upfront deployment cost, and implementation payback by cohort
  - - Cellular and carrier-managed connectivity
    - Cellular access points, carrier contract management, installation, and carrier fees bundled around Meter Cellular
    - Monthly service plus pass-through carrier fees
    - Publicly marketed as an add-on or adjacent service line
    - Could raise share of wallet, but gross profit profile is not disclosed
    - Disclose penetration rate, contribution margin, and whether carrier fees are pass-through or marked up
  - - Buyback credits
    - Credit applied to the customer bill after go-live when legacy hardware is replaced
    - Bill credit / migration incentive
    - Publicly disclosed as an adoption aid rather than a standalone revenue stream
    - Negative near-term revenue/cash impact, potentially positive for conversion
    - Quantify average credit, reserve policy, and recovery value on recycled assets
  - - Partner-led recurring contracts
    - Channel partners originate deals while Meter remains the recurring service platform
    - Recurring contract plus partner incentive overlays
    - Supported by official partner pages and 2026 fund coverage
    - Potentially scalable, but partner subsidies may compress early contribution margin
    - Show direct-versus-channel mix, partner take rates, and payback after rebates/spiffs
  notes: Rows separate commercially distinct monetization motions. Public sources show packaging and incentives, not realized pricing or recognized revenue mix.
