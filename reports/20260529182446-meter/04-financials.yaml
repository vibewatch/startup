- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric / disclosure
  - Why it matters
  - Current public state
  - Exact diligence path
  rows:
  - - ARR, revenue, and revenue mix by product/tier
    - Needed to judge scale, concentration, and mix shift between network, premium rollout, and adjacent services
    - Not publicly disclosed in reviewed sources
    - Request monthly recurring revenue bridge by tier, add-on, geography, and channel origin
  - - Gross margin by hardware, software, installation, and support
    - Needed to test whether bundling actually compounds margin over time
    - No public margin disclosure
    - Request gross-margin waterfall with hardware reserve, field labor, and support allocations
  - - Median contract length, renewal rate, and churn
    - Determines revenue quality and payback durability
    - Only recurring language is public; contract details are not
    - Request cohort tables for contract term, renewal timing, churn, and expansion
  - - CAC payback and direct-versus-channel sales efficiency
    - Channel rebates and spiffs can make growth look stronger than economics support
    - No public sales-efficiency data
    - Request CAC, payback, win rate, and pipeline conversion by direct and partner motion
  - - Cash balance, burn, and runway
    - The main determinant of next-round dependency
    - No public disclosure
    - Request current cash, monthly burn, budgeted spend, and downside runway analysis
  - - Debt, lease exposure, and residual value assumptions
    - Lease and buyback programs can hide capital commitments
    - No public debt schedule surfaced
    - Request equipment-finance facilities, lease-default history, residual assumptions, and covenant package
  - - Partner-fund accounting and payout timing
    - Needed to know whether the $100M fund is marketing optics or near-term cash usage
    - Incentive categories are public, accounting treatment is not
    - Request funded, committed, and paid balances by incentive type
  - - Customer concentration and site concentration
    - A large multi-site customer base can improve retention but magnify concentration risk
    - Only reference customers and testimonials are public
    - Request top-10 customer ARR share, top verticals, and site concentration by account
  notes: These are the underwriting inputs that remain unsupported by public disclosures. Each row is a concrete request rather than a generic complaint.
