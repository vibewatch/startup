- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: The main cash-flow question is not whether Meter has recurring revenue, but how much capital it must front-load to create and support that revenue.
  data:
    columns:
    - Cash timing
    - Public evidence
    - Potential effect on margin/runway
    - Primary diligence need
    rows:
    - label: Hardware ownership and refreshes
      values:
      - Front-loaded and recurring
      - Meter owns equipment and includes upgrades at no extra charge
      - Can pressure gross margin and working capital if refresh cadence is aggressive
      - Disclose BOM, reserve policy, and refresh schedule by generation
    - label: Installation and rollout labor
      values:
      - Front-loaded
      - Premium includes cabling and rollout; installation is positioned as fast and turnkey
      - Can elongate payback if deployments are underpriced
      - Disclose implementation cost per site and rework rate
    - label: Support and SLA delivery
      values:
      - Recurring opex
      - 24/7 support and proactive monitoring are core promises
      - SLA quality can improve retention but raises fixed support burden
      - Disclose support cost per site and automation rate
    - label: Buyback credits
      values:
      - Front-loaded subsidy
      - Credits are applied to customer bills after go-live
      - Acts like acquisition spend rather than direct revenue
      - Disclose average credit and scrap recovery value
    - label: Partner rebates, spiffs, and MDF
      values:
      - Front-loaded and demand-linked
      - $100M partner fund backs partner-led opportunities
      - Can accelerate bookings while delaying CAC payback
      - Disclose committed versus paid incentives and cohort payback
    - label: Lease / financing exposure
      values:
      - Unknown timing
      - ASC 842 positioning is public, but debt or default statistics are not
      - Could hide off-balance-sheet or residual-value risk
      - Disclose lease mix, defaults, and financing facilities
  claimRefs:
