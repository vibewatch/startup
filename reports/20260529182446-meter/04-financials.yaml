  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current unrestricted cash balance, monthly burn, committed spend, and board runway scenarios.
    whyItMatters: Without cash and burn, the 2025 fundraise cannot be translated into financing sufficiency or next-round timing.
    diligencePath: Request the latest board deck or monthly finance package with cash, burn, and downside runway cases.
    relatedQuestionRefs:
    - QI017
    - QI025
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: ARR, revenue mix by tier and add-on, contract duration, logo churn, and net revenue retention.
    whyItMatters: Recurring packaging does not prove recurring revenue quality without retention and contract data.
    diligencePath: Request cohort tables for bookings, renewals, churn, expansion, and term by customer segment.
    relatedQuestionRefs:
    - QI001
    - QI003
    - QI014
    - QI019
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: margin-path
    missingEvidence: Gross margin split across hardware, installation, support, and software, plus reserve policy for refresh and warranty obligations.
    whyItMatters: The investment case depends on whether bundling compounds margin or simply hides service and hardware subsidies.
    diligencePath: Request a gross-margin waterfall with hardware BOM, subcontractor spend, support labor, and reserve assumptions.
    relatedQuestionRefs:
    - QI020
    - QI021
    relatedTableRefs:
    - TI003
