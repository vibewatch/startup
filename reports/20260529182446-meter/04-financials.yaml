  - CI012
  - CI024
  - CI025
  - CI039
  - CI045
  - CI047
callouts:
- calloutType: strength
  title: Recurring packaging is real
  body: 'Meter has a credible subscription product, not just marketing language: bundled infrastructure, one invoice, no upfront customer capex, and optional lease treatment are all documented publicly.'
