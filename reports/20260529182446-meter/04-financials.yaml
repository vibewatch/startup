- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - $50k upfront savings proxy
    - $50,000 upfront savings and roughly five years of Meter coverage in one office testimonial
    - Medium
    - Suggests strong customer ROI if representative, but it is still a single company quote
    - Request anonymized before/after TCO analyses across at least 10 customers
  - - Implementation speed proxy
    - Weeks not months; two-week coordination and one-day installation benchmark
    - Medium
    - Fast deployment can improve cash conversion and reduce partner/customer friction
    - Provide median and p90 deployment duration by site size and environment
  - - Support efficiency proxy
    - 99.99% of issues solved within 24 hours and 3x faster mean time to response than legacy vendors
    - Medium
    - Day-2 support cost and SLA burden are critical to subscription gross margin
    - Provide ticket volume per site, escalation rate, and support cost per deployed location
  - - Internal labor replacement proxy
    - Customers say Meter can avoid additional networking hires or multiple engineers
    - Medium
    - Indicates ROI for buyers and hints at labor-intensive work Meter is taking on
    - Provide implementation FTEs and support FTEs per 100 sites
  - - Hardware gross margin
    - null
    - Low
    - Hardware ownership and refresh promises make product margin a central unknown
    - Disclose bill of materials, warranty reserve, and blended hardware gross margin by generation
  - - Installation contribution margin
    - null
    - Low
    - Premium rollout likely carries labor and subcontractor cost that can overwhelm list pricing if mis-scoped
    - Provide installation revenue, subcontractor spend, and rework costs by cohort
  - - Sales efficiency / CAC payback
    - null
    - Low
    - Partner rebates and direct-sales expansion can distort growth quality without payback data
    - Provide CAC, payback, win rate, and sales-cycle data for direct and partner channels
  - - Retention / NRR / churn
    - null
    - Low
    - Recurring revenue quality cannot be underwritten without renewal behavior
    - Provide gross churn, net retention, logo retention, and expansion by customer segment
  notes: Public sources provide only operating proxies and customer anecdotes. Null rows are intentional and mark underwriting inputs that remain undisclosed.
