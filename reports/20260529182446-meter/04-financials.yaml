- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public disclosure
  - Implication
  - Confidence
  - Diligence ask
  rows:
  - - Latest financing
    - $170M Series C announced on 2025-06-12
    - Clearly lowers near-term financing pressure and funds scaling
    - High
    - Provide board-approved use-of-funds plan and cash bridge tied to this round
  - - Use of funds
    - Scale operations, staffing, technology, and hardware refresh
    - Signals spending needs remain ahead of the next phase of growth
    - Medium
    - Break out capital by R&D, go-to-market, hardware refresh, and working capital
  - - Total funding
    - $315M on Tracxn versus $255M in Network World’s at-a-glance box
    - Conflicting public totals reduce confidence in secondary-database capital history
    - Medium
    - Reconcile round history, SAFE/secondary treatment, and total primary capital raised
  - - Valuation
    - $1B post-money on Tracxn for the 2025 Series C
    - Confirms venture support but says nothing about current runway or margin profile
    - Medium
    - Provide current internal valuation marks, preference stack, and liquidation preferences
  - - Employee scale proxy
    - 220 employees on Tracxn versus 142 on PitchBook
    - Public opex proxies are directionally useful but not reliable enough for a burn model
    - Medium
    - Provide current headcount by function and planned hiring through the next 18 months
  - - Debt / project finance obligations
    - No public project-finance or equipment-finance obligations surfaced in reviewed sources
    - Could mean debt is minimal or simply undisclosed; underwriting cannot assume zero
    - Low
    - Provide debt schedule, lease obligations, covenants, and any off-balance-sheet commitments
  - - Cash / burn / runway
    - null
    - This is the core blocker to judging financing dependency
    - Low
    - Provide current unrestricted cash, monthly burn, budgeted spend, and downside runway analysis
  - - Partner fund and migration incentives
    - $100M partner fund plus buyback credits and migration incentives
    - May accelerate bookings but also consumes cash before recurring revenue matures
    - Medium
    - Disclose reserve policy, payout cadence, and funded versus committed incentive balance
  notes: Capital adequacy is only partially observable in public. The table combines disclosed funding facts with explicit non-disclosure where no cash or debt data is public.
