- id: financial-verdict-and-underwriting-blockers
  title: Financial verdict and underwriting blockers
  body: 'The financial verdict is directionally positive on revenue quality and directionally unresolved on margin path. Meter has a genuine recurring-revenue design: the offer is sold as an ongoing bundled service, customers avoid upfront capex, and partner programs reinforce repeatable recurring contracts instead of one-time hardware projects. But the same package pushes material cost and timing risk back onto Meter. Hardware ownership, upgrades, buybacks, installation labor, proactive support, and partner incentives all have to be funded before a contract matures. WWT’s 2025 NaaS report is a useful cautionary lens because it asks whether the category is transformative reality or just marketing hype and defines true NaaS against consumption-style opex metrics rather than appliance-led pricing. That does not invalidate Meter’s model, but it does mean investors should treat any assumptions on gross margin expansion, CAC payback, churn, net revenue retention, or runway as unsupported until
    management shares cohort-level contract economics and a current cash bridge. Underwriting should therefore anchor on the strength of the subscription model but haircut conviction on margin and financing sufficiency.'
  claimRefs:
