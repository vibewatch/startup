schemaVersion: report-v2
artifact: market-analysis
slug: meter
runDate: '2026-05-29'
company:
  name: Meter
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Meter is not underwriting the whole enterprise networking universe; it is selling a narrower,
    bundled networking-as-a-service wedge that combines local-network hardware, cloud management,
    deployment, ISP procurement, and lifecycle support under one recurring contract. Public market
    evidence supports real tailwinds from Wi-Fi 7 refresh, cloud-managed LAN adoption, enterprise
    outsourcing, and security convergence, but the published spend pools range from roughly $10.5
    billion enterprise WLAN to much broader managed-services categories above $100 billion because
    they measure different scopes. The market conclusion is positive on category direction and buyer
    urgency, but valuation work still needs a cleaner site-count and unit-economics bridge before a
    Meter-specific SAM or SOM can be treated as precise.
sections:
  - id: market-boundary-and-substitutes
    title: Market boundary, included spend, and status-quo substitutes
    body: |-
      Meter should be framed as full-stack, local-enterprise networking infrastructure delivered as a
      recurring service, not as a proxy for every dollar spent on networking hardware, telecom, or
      managed IT. Across Meter’s network, pricing, deployment, and customer pages, the company says it
      bundles ISP procurement, routing, switching, wireless, security, monitoring, installation,
      support, and hardware refresh into one monthly contract priced by square footage. That means the
      included spend is broader than an access-point or switch purchase, but still narrower than the
      entire managed-services universe because Meter stays focused on the local-network stack and the
      operations needed to deploy and maintain it.

      The exclusion logic matters as much as the inclusion logic. Consumer networking, end-user
      devices, unrelated cybersecurity products, and wide-area carrier spend that is not being managed
      through Meter should not be counted in the practical market boundary. The main substitute is a
      fragmented stack: multiple ISPs, separate hardware vendors, independent installers, and internal
      IT or MSP teams stitching the network together. Meter’s visible target environments—offices,
      warehouses, schools, and other multi-site commercial spaces—fit that framing. The market is
      therefore best described as enterprise LAN/WLAN plus adjacent deployment and lifecycle services,
      sold to buyers who want fewer vendors, less operational firefighting, and more predictable spend.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008, CM009, CM046]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: sizing-lenses-and-practical-sam
    title: Sizing lenses, overlap, and the practical underwriting denominator
    body: |-
      The public top-down evidence is directionally favorable, but it is not additive. IDC says the
      worldwide enterprise WLAN market reached $10.5 billion in 2025, while Dell’Oro says the 2026
      local area networking market will be well into the $30 billion range and that public
      cloud-managed LAN should exceed $12 billion by 2029. Separate managed-network-services reports
      are wider still: Mordor puts the 2026 market at $18.72 billion, while MarketsandMarkets frames a
      much broader managed-network-services category at $120.74 billion in 2025 growing to $172.04
      billion by 2030. Those numbers are useful lenses, but they capture different combinations of
      hardware, cloud software, outsourcing, and security services.

      The right underwriting move is to keep multiple lenses on the page rather than pretend there is a
      single clean TAM. Meter is broader than pure WLAN hardware because the contract includes design,
      installation, ISP management, monitoring, and lifecycle upgrades. But it is also narrower than
      broad managed-services categories because Meter still revolves around the local-network stack,
      owned hardware, and site-level deployment motion. Hospitals and schools alone establish large
      site-based verticals, yet public sources still do not provide a cleaned count of qualifying
      warehouse and office sites that match Meter’s service profile. That is why a precise public
      Meter-specific SAM or SOM still cannot be isolated with confidence.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015, CM016, CM017, CM018, CM019, CM020, CM021, CM022, CM023, CM024, CM025, CM026, CM027, CM028, CM040, CM041, CM042, CM048]
    tableRefs: [TM002]
    figureRefs: [FM002]
  - id: buyers-budgets-and-adoption
    title: Buyer, payer, and adoption path
    body: |-
      The buying motion is cross-functional, but central IT and network leadership remain the economic
      center of gravity. Cisco’s 2026 wireless report says average annual wireless infrastructure spend
      per organization is about US$13 million and that capital expenditure still accounts for 61% of
      the average wireless budget, which implies a formal infrastructure budget rather than casual
      departmental purchasing. Mordor likewise says large enterprises represented 62.60% of managed
      network-services share in 2025. In practice, the initiating pain can come from different places:
      a headquarters or branch refresh, a warehouse or school rollout, a relocation, a shortage of
      network engineers, or the desire to stop coordinating many vendors across many sites.

      Meter’s own customer proof shows why that pain converts. The company highlights office expansion,
      school deployments, and warehouse operations where buyers want faster rollout and less day-to-day
      network overhead. Webb School’s quoted timeline to functional internet infrastructure in two
      weeks and the private-school cost-reduction example indicate that buyers are not just shopping
      for faster Wi-Fi; they are shopping for a simpler operating model. The user is usually site IT,
      facilities-adjacent technical staff, or a lean internal infrastructure team, while the payer sits
      in a central networking or infrastructure budget. Meter wins when that buyer decides the right
      answer is not another box or another point product, but a recurring contract that converts
      fragmented CapEx and operations into one accountable provider.
    claimRefs: [CM007, CM008, CM009, CM024, CM029, CM030, CM031, CM032, CM033, CM039, CM047, CM049, CM050, CM051]
    tableRefs: [TM003]
    figureRefs: [FM003, FM004]
  - id: growth-drivers-and-constraints
    title: Growth drivers, security convergence, and market constraints
    body: |-
      The growth side of the story is tangible. IDC says Wi-Fi 7 already represented 39.7% of dependent
      AP revenue in 4Q25, up from 10.25% a year earlier, while Dell’Oro says enterprise-class Wi-Fi 7
      becomes mainstream in 2026 and should trigger switch renewals as buyers add higher-bandwidth and
      PoE capacity. IDC also argues AI-driven applications, video traffic, and IoT are forcing buyers
      to modernize wireless networks, and competitor materials from Cisco, HPE, Juniper, Extreme, and
      Fortinet all point to campuses, branches, factories, hospitals, and semi-industrial settings as
      standard environments for modern, cloud-managed, secure networking. Dell’Oro’s cloud-managed LAN
      work matters especially for Meter because it shows enterprises are more willing to pay recurring
      charges for advanced features and explicitly names startups like Meter inside that opportunity.

      The constraints are real as well. Dell’Oro’s 2025 outlook says fixed IT budgets can cause buyers
      to hold back purchases when macro visibility is weak, and it specifically cites trade tensions,
      inflation, and tariffs as headwinds. The same market also carries operational friction:
      deployment complexity, installed-base replacement, security integration, and a continuing shortage
      of qualified network engineers. Network World’s survey result that 59% of IT organizations plan a
      Wi-Fi upgrade in 2026 but only 7% already run predominantly Wi-Fi 7 shows the upgrade runway is
      large, not complete. That is good for category demand, but it also means Meter still has to prove
      that its recurring, high-touch deployment model can convert that refresh cycle into durable,
      efficient economics at scale.
    claimRefs: [CM012, CM013, CM014, CM015, CM016, CM017, CM018, CM020, CM021, CM031, CM032, CM034, CM035, CM036, CM037, CM038, CM043, CM044, CM045, CM047, CM048, CM050, CM052]
    tableRefs: [TM004]
