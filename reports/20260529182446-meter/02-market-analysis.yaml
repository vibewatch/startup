figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: wide
    summary: Meter sits inside a large enterprise networking stack, but the monetizable wedge narrows quickly once the buyer must want a bundled local-network contract rather than standalone hardware or broad outsourced IT.
    data:
      items:
        - label: Broad enterprise networking and managed services
          value: WLAN, campus switching, branch routing, managed services, security overlays, and cloud-managed networking
          note: Broadest outer denominator from IDC, Dell’Oro, Mordor, and MarketsandMarkets
        - label: Local area networking refresh
          value: Enterprise WLAN plus campus-switch upgrades driven by Wi-Fi 7, AI traffic, and branch modernization
          note: Best public lens for actual local-network equipment and refresh demand
        - label: Cloud-managed LAN and NaaS adjacency
          value: Recurring cloud control, campus NaaS, and managed LAN features that buyers pay for as ongoing service
          note: The closest public niche where Dell’Oro explicitly places startups like Meter
        - label: Meter target environments
          value: Offices, warehouses, schools, hospitals, and other multi-site commercial spaces needing integrated rollout and support
          note: Serviceable site pool is narrower than the whole cloud-managed or WLAN market
        - label: Underwriting wedge
          value: Full-stack local networking as a service with Meter-owned design, install, ISP procurement, monitoring, and lifecycle support
          note: The practical revenue pool is the narrowest layer, not the whole enterprise networking stack
    claimRefs: [CM004, CM005, CM009, CM021, CM026, CM027, CM028, CM040, CM041]
  - id: FM002
    title: Market estimate range
    type: range
    layout: wide
    summary: Published spend pools are all relevant to Meter, but the value changes materially with category scope, so the defensible answer is a range of lenses rather than one clean TAM.
    data:
      items:
        - label: Enterprise WLAN lens
          low: 10.5
          mid: 10.5
          high: 10.5
          note: IDC full-year 2025 enterprise WLAN market
        - label: Local area networking lens
          low: 30.0
          mid: 32.0
          high: 35.0
          note: Dell’Oro says 2026 LAN will be well into the $30B range; midpoint and high are illustrative brackets only
        - label: Managed network services lens
          low: 18.72
          mid: 18.72
          high: 18.72
          note: Mordor 2026 managed network services estimate
        - label: Broad managed services ceiling
          low: 120.74
          mid: 146.39
          high: 172.04
          note: MarketsandMarkets 2025 base, simple midpoint, and 2030 forecast for a much broader category
    approximationNotes: >-
      Values are USD billions. Rows are intentionally non-additive and represent different scope lenses;
      the LAN midpoint and high are bracketing approximations derived from Dell’Oro’s qualitative “well
      into the $30B range” language rather than a single published point estimate.
    claimRefs: [CM010, CM014, CM019, CM022, CM025, CM026, CM027, CM028]
  - id: FM003
    title: Buyer and segment map
    type: matrix
    layout: wide
    summary: The same deployment can have a different buyer, user, and payer depending on whether the immediate pain is site rollout, staffing, reliability, or a broad refresh cycle.
    data:
      columns:
        - Primary buyer
        - Main user
        - Typical payer
        - Adoption trigger
        - Proof needed
      rows:
        - label: Offices and HQ estates
          values:
            - IT or infrastructure lead
            - Site IT and office users
            - Central network budget
            - Expansion, relocation, or standardization across many offices
            - Faster rollout and lower vendor-management burden
        - label: Warehouses and logistics
          values:
            - Operations-minded IT sponsor
            - Site operators plus lean IT
            - Shared infrastructure budget
            - Need resilient wireless and low-touch troubleshooting at dispersed sites
            - Reliable coverage, fast deployment, and simpler support
        - label: Schools and education campuses
          values:
            - Director of technology
            - Staff, students, and campus admins
            - School or district technology budget
            - Security, staffing limits, or campus refresh
            - Demonstrable cost reduction and fast time to service
        - label: Hospitals and healthcare sites
          values:
            - Network architecture or infrastructure lead
            - Clinical and administrative users
            - Central healthcare IT budget
            - Need secure, resilient campus connectivity across many buildings
            - High availability, segmentation, and fewer operational gaps
        - label: Branch and campus-heavy enterprises
          values:
            - Central network leadership
            - Site admins and facilities-adjacent operators
            - Shared network and security budget
            - Desire to collapse multiple vendors and service contracts
            - Single-provider accountability plus recurring operational clarity
    claimRefs: [CM008, CM024, CM029, CM030, CM031, CM032, CM033, CM039, CM040, CM041, CM051]
  - id: FM004
    title: Adoption funnel or value-chain map
    type: flow
    layout: wide
    summary: Meter demand usually starts when a refresh, relocation, or staffing problem exposes how expensive it is to coordinate many networking vendors across many sites.
    data:
      nodes:
        - id: n1
          label: Refresh or expansion pressure appears
          detail: A buyer faces a new site, multi-site growth, relocation, Wi-Fi 7 upgrade, or reliability gap.
        - id: n2
          label: Internal team and vendor stack strain
          detail: Separate ISPs, hardware vendors, installers, and internal IT effort create coordination cost and slow rollout.
        - id: n3
          label: Recurring model is evaluated
          detail: Buyer compares CapEx-heavy procurement with a monthly, bundled service contract.
        - id: n4
          label: Meter wins on integration and lifecycle
          detail: ISP procurement, install, monitoring, support, and upgrades are packaged under one provider.
        - id: n5
          label: Expansion and renewal compound
          detail: Once the first site works, the buyer can extend the same operating model across offices, warehouses, schools, or branches.
      edges:
        - from: n1
          to: n2
          label: exposes complexity
        - from: n2
          to: n3
          label: buy versus coordinate
        - from: n3
          to: n4
          label: recurring contract chosen
        - from: n4
          to: n5
          label: site replication
    claimRefs: [CM009, CM017, CM023, CM033, CM039, CM045, CM046, CM049, CM050]
callouts:
  - calloutType: insight
    title: The important market fact is not that networking is big, but that Meter sells a narrower service layer inside it
    body: Broad enterprise-networking and managed-services numbers validate category scale, but Meter’s practical underwriting wedge is the site-level bundle of design, deployment, ISP management, and lifecycle support rather than the whole spend pool.
    claimRefs: [CM014, CM019, CM022, CM026, CM027, CM028]
  - calloutType: insight
    title: Wi-Fi 7 plus cloud-managed LAN adoption creates a real timing tailwind
    body: Public analyst data supports a current refresh cycle, and Meter’s model is especially aligned with buyers who want to convert that refresh into a recurring, cloud-managed operating model.
    claimRefs: [CM012, CM015, CM017, CM020, CM021, CM037, CM038]
  - calloutType: risk
    title: The market case is stronger than the public SAM math
    body: Schools and hospitals help bound visible site pools, but warehouse, office, and qualifying enterprise-site counts still need manual extraction and internal conversion assumptions before valuation can rely on a precise Meter-specific denominator.
    claimRefs: [CM040, CM041, CM042, CM048]
  - calloutType: recommendation
    title: Diligence should ask for site mix, signed buyer profile, and cohort economics
    body: The next step is not more generic TAM work; it is internal evidence on which verticals buy, who signs and pays, and what installation plus support cohorts look like after the first site goes live.
    claimRefs: [CM029, CM030, CM045, CM048, CM051]
