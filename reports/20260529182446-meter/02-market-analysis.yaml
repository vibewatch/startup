  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sam-site-count
      missingEvidence: A cleaned count of qualifying multi-site offices, warehouses, schools, hospitals, and similar commercial sites that fit Meter's target profile.
      whyItMatters: Without a filtered site denominator, public SAM and SOM estimates remain too approximate for valuation work.
      diligencePath: Pull NAICS-level establishment counts from County Business Patterns and then filter by site profile, geography, and outsourcing fit using internal win-rate data.
      relatedQuestionRefs: [QM019, QM025]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-contract-ownership
      missingEvidence: Real contract or quote data showing who signs, who pays, and how often Meter is bought from CapEx versus OpEx budgets.
      whyItMatters: The buyer and payer model directly affects sales efficiency, pricing power, and how durable the monthly-contract thesis is.
      diligencePath: Review recent customer contracts and pipeline notes by vertical to map signer, payer, budget source, and deployment trigger.
      relatedQuestionRefs: [QM010, QM011, QM020]
      relatedTableRefs: [TM003]
    - type: private-evidence-only
      severity: material
      topic: deployment-economics
      missingEvidence: Cohort-level installation cost, hardware payback, support burden, and gross margin by customer size and site type.
      whyItMatters: A favorable market is not enough if the recurring model cannot scale efficiently across complex multi-site deployments.
      diligencePath: Request internal cohort analysis separating first-site deployment cost, follow-on site economics, churn, and upgrade cadence.
      relatedQuestionRefs: [QM012, QM025]
      relatedTableRefs: [TM004]
    - type: conflicting-data
      severity: minor
      topic: overlapping-market-lenses
      missingEvidence: A bridge that reconciles enterprise WLAN, LAN, cloud-managed LAN, and managed-services categories into one non-overlapping meter-relevant framework.
      whyItMatters: Published market reports create false precision when used side by side without a scope reconciliation.
      diligencePath: Build an internal market map that explicitly tags which services are inside or outside Meter's commercial scope before using any TAM in valuation.
      relatedQuestionRefs: [QM004, QM005, QM006, QM007, QM008]
      relatedTableRefs: [TM002]
