callouts:
  - calloutType: strength
    title: Vertical integration gives Meter a clear narrative moat
    body: |
      Meter’s strongest public advantage is conceptual coherence. The same company claims to build
      the hardware, operating system, deployment workflow, support function, and recurring pricing
      model, which is materially easier for buyers and partners to understand than the bolt-on,
      acquisition-heavy stories told by many incumbents. Even if some of the benefits still need
      to be quantified in diligence, the narrative itself is unusually crisp.
    claimRefs: [CO005, CO029, CO031, CO035]
  - calloutType: risk
    title: Economic proof is still the missing chapter of the story
    body: |
      The public story is rich on product, partnerships, and philosophy, but thin on unit
      economics. Independent analyst and channel commentary is clear that Meter still has to prove
      the durability of its GTM and the scalability of its service economics. Without public
      revenue, ARR, margin, burn, customer-count, or headcount disclosure, investors are being
      asked to underwrite a model largely from narrative and partner momentum.
    claimRefs: [CO038, CO039, CO043, CO044, CO045, CO046]
  - calloutType: insight
    title: Meter is no longer only a product thesis
    body: |
      By late 2025 and early 2026, the company’s key milestones are distributional: Azure
      Marketplace access, 100 percent channel fulfillment for new business and renewals, WAN-to-LAN
      bundling with Lumen, and EMEA channel rollout. That suggests the next diligence question is
      not whether Meter built something novel, but whether it can turn that novelty into efficient,
      repeatable distribution.
    claimRefs: [CO020, CO021, CO022, CO023, CO025, CO034]
