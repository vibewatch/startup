artifact: company-overview
slug: meter
runDate: "2026-05-29"
company:
  name: Meter
chapter:
  number: 1
  title: Company Overview
  summary: |
    Meter is a San Francisco networking-as-a-service company founded in 2015 by brothers Anil and
    Sunil Varanasi. Public sources verify a $170 million Series C led by General Catalyst in June
    2025 at roughly a $1 billion valuation and show the business moving from product build-out into
    channel-led distribution, Microsoft marketplace sales, and integrated WAN-to-LAN partnerships.
    The core diligence caveat is disclosure: public materials still do not provide revenue, ARR,
    profitability, total customer count, or current headcount with primary-source support, while
    outside analysts note that the model still has to prove its economics and channel durability.
sections:
  - id: identity-business-model
    title: Identity, headquarters, and business model
    body: |
      Meter positions itself as a vertically integrated enterprise networking company rather than a
      reseller of third-party boxes. The company says it started in 2015 to make internet,
      networking, Wi-Fi, and cellular connectivity work like a utility for businesses, and its
      current headquarters is in San Francisco’s Mission District at 570 York Street. Across the
      homepage, about page, FAQ, and product documentation, Meter consistently describes one stack
      spanning hardware, firmware, software, deployment operations, support, and ISP procurement.
      That framing matters because it changes who carries the operational and financial burden:
      customers do not buy hardware up front, while Meter takes on deployment, lifecycle, and
      upgrade responsibility under a recurring service contract. The offering is described as
      suitable for offices, warehouses, campuses, and data centers, which supports the thesis that
      Meter is not just a Wi-Fi overlay vendor but a fuller networking infrastructure platform.
      By the run date, Meter still primarily supports customers throughout the U.S., with
      non-U.S. opportunities handled through direct inquiry while broader geographic expansion is
      being built through channel partnerships.
    claimRefs: [CO001, CO002, CO004, CO005, CO006, CO029, CO030, CO035, CO048, CO049]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: leadership-governance
    title: Founders, governance, and organizational dependence
    body: |
      Meter was founded by brothers Anil Varanasi and Sunil Varanasi, who remain the most publicly
      visible operating leaders: Anil as CEO and Sunil as CTO. The founders’ long-form interviews
      and company materials emphasize a long-duration operating philosophy, a bias toward building
      rather than buying, and an unusually founder-centric culture built around kind-but-ambitious
      hiring. Public evidence on broader governance is thinner. The clearest board datapoint in the
      reviewed set is Sequoia partner Ravi Gupta joining the board at the 2022 Series B. Meter’s
      careers page also shows how tightly the company’s operating system is tied to its San
      Francisco facility, where office space, distribution, and quality engineering sit together.
      That can be a strength for a hardware-plus-operations company, but it also signals meaningful
      key-person and operating concentration around the founders and one headquarters. Importantly,
      the reviewed public investor disclosures do not support the user thesis that Andreessen
      Horowitz or NEA are investors; the disclosed cap-table names instead center on General
      Catalyst, Sequoia, Microsoft, Tishman Speyer, WndrCo, Baillie Gifford, J.P. Morgan, and
      prominent angels.
    claimRefs: [CO003, CO012, CO013, CO036, CO046]
    tableRefs: [TO002]
  - id: capital-distribution
    title: Funding history, investor map, and route to market
    body: |
      Meter’s financing story is now legible even though the company remains private and
      financially opaque. Official company releases and third-party databases line up on a May 2022
      Series B announcement and a much larger June 12, 2025 Series C led by General Catalyst.
      Third-party funding trackers and trade coverage place the post-money valuation at about
      $1 billion and total raised at about $315 million after the Series C, putting Meter into the
      unicorn bracket while still much smaller than mature public networking incumbents. The more
      strategically important shift is commercial rather than purely financial: by late 2025, Meter
      said it had become effectively channel-led, with 95 percent of business through the channel,
      all new business and renewals fulfilled through channel partners, and Microsoft positioned as
      a major distribution route through Azure Marketplace consumption commitments. Lumen expands
      the commercial stack further by attaching WAN procurement and telemetry to Meter’s LAN and
      management layer. That means Meter’s next phase is less about proving the existence of a
      product and more about proving that a high-touch, vertically integrated networking model can
      scale economically through partners without losing simplicity.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO020, CO021, CO022, CO023, CO024, CO034]
    tableRefs: [TO003]
  - id: milestones-caveats
    title: Product milestones, outside validation, and disclosure gaps
    body: |
      The most important operating milestones in the reviewed record cluster from 2024 onward.
      Meter launched Command in August 2024 as a generative interface for network operations,
      reported more than doubling deployed square footage in 2024, and said its partner program was
      already working with hundreds of organizations by year-end. In 2025, the company used
      MeterUp to announce nine new hardware platforms, a fully channel-based route to market, and
      a growing partnership ecosystem that includes Microsoft, CDW, WWT, and Lumen. In 2026,
      Gartner named Meter a Visionary in enterprise wired and wireless LAN for the second
      consecutive year, and channel coverage documented an EMEA expansion push. At the same time,
      the evidence base remains incomplete where an investor most needs hard numbers. Public
      sources do not provide revenue or ARR, profitability or burn, a primary-source total customer
      count, or a current headcount. Outside analysis is directionally positive but not uncritical:
      Omdia says Meter still needs broader GTM capability to match incumbents, and IT Europa’s
      editor explicitly says the company could become either an “Uber-style disruptor” or a
      “WeWork implosion” depending on how the economics play out.
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO025, CO026, CO027, CO028, CO032, CO033, CO037, CO038, CO039, CO040, CO041, CO042, CO043, CO044, CO045]
    tableRefs: [TO004]
    figureRefs: [FO001, FO003]
