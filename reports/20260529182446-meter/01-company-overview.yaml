  evidenceGaps:
    - type: missing-source
      severity: material
      topic: revenue
      missingEvidence: Public revenue or ARR figures with methodology and periodization.
      whyItMatters: Without revenue scale, valuation cannot be benchmarked to public or private comps with confidence.
      diligencePath: Request board deck, audited financial statements, or data-room KPI pack covering revenue and ARR.
      relatedQuestionRefs: [QO031]
    - type: private-evidence-only
      severity: material
      topic: profitability
      missingEvidence: Gross margin, cash burn, and runway disclosures.
      whyItMatters: Meter's service-heavy model may be attractive strategically but still fail economically if support and deployment costs remain too high.
      diligencePath: Request monthly management reporting with gross margin bridge, burn, cash balance, and payback assumptions.
      relatedQuestionRefs: [QO032]
    - type: missing-source
      severity: material
      topic: customer-count
      missingEvidence: A current primary-source total customer count rather than logos or review-site proxies.
      whyItMatters: Customer concentration and deployment breadth cannot be measured from named logos alone.
      diligencePath: Ask for current customer count, active-site count, and top-10 customer concentration schedule.
      relatedQuestionRefs: [QO033]
    - type: private-evidence-only
      severity: minor
      topic: headcount
      missingEvidence: Current employee count and functional/geographic split.
      whyItMatters: Headcount is needed to assess operating leverage and the staffing intensity of deployment and support.
      diligencePath: Request latest org chart, employee census, and hiring plan by geography and function.
      relatedQuestionRefs: [QO034]
    - type: missing-source
      severity: minor
      topic: governance TO002
      missingEvidence: Full current board composition and independent-director profile.
      whyItMatters: Founder dependence looks high, so board depth and succession oversight matter for underwriting governance risk.
      diligencePath: Request current board list, observer rights, and committee structure from the company.
      relatedQuestionRefs: [QO013]
      relatedTableRefs: [TO002]
