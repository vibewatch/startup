        - Public evidence
        - Potential effect on margin/runway
        - Primary diligence need
      rows:
        - label: Hardware ownership and refreshes
          values:
            - Front-loaded and recurring
            - Meter owns equipment and includes upgrades at no extra charge
            - Can pressure gross margin and working capital if refresh cadence is aggressive
            - Disclose BOM, reserve policy, and refresh schedule by generation
        - label: Installation and rollout labor
          values:
            - Front-loaded
            - Premium includes cabling and rollout; installation is positioned as fast and turnkey
            - Can elongate payback if deployments are underpriced
            - Disclose implementation cost per site and rework rate
        - label: Support and SLA delivery
          values:
            - Recurring opex
            - 24/7 support and proactive monitoring are core promises
            - SLA quality can improve retention but raises fixed support burden
            - Disclose support cost per site and automation rate
        - label: Buyback credits
