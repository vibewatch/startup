  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue scale below public-comp support
        - Data-room revenue does not comfortably support even a Cisco-like multiple at the current mark
        - The valuation shifts from growth underwriting to hope underwriting
        - Do not invest at the current price; revisit only after a price reset or new proof.
      - - Contribution margin disappoints
        - Hardware, installation, support, and refresh obligations leave limited contract-level profit
        - The full-stack model stops looking like a moat and starts looking like embedded leverage
        - Downgrade to avoid unless structure or price compensates for the risk.
      - - Partner-fund payback is poor
        - Subsidies and POCs remain necessary beyond a normal land phase or exceed acceptable CAC payback
        - Channel momentum becomes expensive demand stimulation rather than durable distribution
        - Pause until CAC/payback and renewal data are shared.
      - - Series C preference stack is onerous
        - Liquidation preferences, ratchets, or senior rights capture a large share of base-case upside
        - Common or new-money return math deteriorates even if the company executes
        - Treat the company as structurally unattractive at current terms.
      - - Independent churn / concentration evidence fails
        - Cohort churn, customer concentration, or SLA outcomes are materially worse than public narrative suggests
        - The recurring-revenue case and strategic-exit case both weaken at once
        - Move to avoid or demand a much lower entry price.
    notes: >-
      These triggers are designed to be decision-useful. Each one links a diligence answer directly to valuation support
      rather than to generic company quality.
    claimRefs:
      - CV007
      - CV014
      - CV036
      - CV038
      - CV039
      - CV041
      - CV044
      - CV045
      - CV048
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue / ARR bridge
        - Current revenue, ARR, and revenue mix by product and services
        - Needed to place the $1B mark on a real comp band instead of a narrative range
        - CFO / finance data room
      - - Gross and contribution margins
        - Hardware gross margin, deployment contribution margin, and support-cost profile by cohort
        - Tests whether the full-stack service model compounds or just front-loads costs
        - Finance plus operations review
      - - Channel economics
        - Partner-fund use by deal, CAC, payback, POC conversion, and subsidy taper assumptions
        - Separates durable GTM leverage from incentive-driven growth
        - CRO / channel-ops diligence
      - - Cap table and preferences
        - Series C liquidation preferences, anti-dilution, pro rata, and employee-option overhang
        - Return math can fail even if company fundamentals improve
        - Legal counsel and board materials
      - - Contract quality
        - Term distribution, renewal rates, gross and net retention, and SLA-credit history
        - Needed to evaluate durability of recurring revenue claims
        - Revenue-ops and customer-success audit
      - - Customer concentration
        - Top-customer exposure, vertical mix, and partner concentration
        - Critical for downside protection and strategic-exit credibility
        - CFO and GTM review
    notes: >-
      This table is intentionally short and owner-specific. If management cannot produce these materials, the valuation
      debate should stop there.
    claimRefs:
      - CV036
      - CV041
