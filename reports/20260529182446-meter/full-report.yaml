  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who buys, who pays, and who uses Meter
        blocks:
          - type: paragraph
            body: >-
              Meter’s public customer proof is strongest where one small internal IT team, facilities owner, or
              technology leader is asked to make office, campus, or warehouse networking “just work” without hiring a
              larger networking staff. The buyer in the observable set is usually a Head of IT, CTO, Director of
              Technology, IT manager, or operations leader; the user is the broader environment behind them: employees
              in offices, students and teachers on campus, warehouse robots and scanners, or support-heavy SaaS teams.
              The payer appears to be the organization itself under a subscription or OpEx model, not an end user or a
              bundled consumer service. This matters because Meter is not selling to telecom buyers or developer-first
              network engineers who want deep multi-vendor tuning. It is winning where the customer values one
              accountable provider, predictable monthly pricing, and fewer internal handoffs. The one explicit
              partner-assisted proof in the chapter—Keys School with Knowing Technologies—also suggests Meter can fit
              inside a trusted MSP relationship instead of insisting on direct-only ownership of the account.
