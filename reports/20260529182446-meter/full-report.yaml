chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: |
              Meter positions itself as a vertically integrated enterprise networking company rather than a
              reseller of third-party boxes. The company says it started in 2015 to make internet,
              networking, Wi-Fi, and cellular connectivity work like a utility for businesses, and its
              current headquarters is in San Francisco’s Mission District at 570 York Street. Across the
              homepage, about page, FAQ, and product documentation, Meter consistently describes one stack
              spanning hardware, firmware, software, deployment operations, support, and ISP procurement.
              That framing matters because it changes who carries the operational and financial burden:
              customers do not buy hardware up front, while Meter takes on deployment, lifecycle, and
              upgrade responsibility under a recurring service contract. The offering is described as
              suitable for offices, warehouses, campuses, and data centers, which supports the thesis that
              Meter is not just a Wi-Fi overlay vendor but a fuller networking infrastructure platform.
              By the run date, Meter still primarily supports customers throughout the U.S., with
              non-U.S. opportunities handled through direct inquiry while broader geographic expansion is
              being built through channel partnerships.
