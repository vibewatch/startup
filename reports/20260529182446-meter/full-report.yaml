          The company keeps growing and channel motion works, but public evidence only supports moderate quality rather
          than elite economics.
        - $0.9B-$1.6B / roughly flat to modest upside. Treats the current mark as monitorable but not obviously cheap.
        - Medium. Most consistent with the public record today.
        - A flat valuation can still produce poor investor outcomes if preference stack or dilution is heavy.
      - - Bear
        - >-
          Disclosed economics show hardware ownership, migration credits, and support burden are consuming most of the
          gross profit, or the next financing is defensive.
        - >-
          $0.4B-$0.9B / roughly 0.4x-0.9x of the current mark. Down-round or forced strategic outcome becomes the
          realistic reference.
        - Medium. The downside path is economic, not product-irrelevance driven.
        - Preference protection, customer concentration, and subsidy dependence intensify downside for new money.
    notes: >-
      Scenario ranges are author estimates based on comparable multiples and explicit assumptions, not claims about
      current Meter revenue or margins. They are intended for discipline, not precision.
