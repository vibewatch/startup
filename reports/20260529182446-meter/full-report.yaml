  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Meter’s public architecture is a stacked control model where interfaces, control logic, unified NOS, and custom
      hardware are tightly coupled and then extended through external partners.
    data:
      layers:
        - label: User + admin interface
          detail: Operators interact through dashboard, Command, alerts, and shared multi-site views.
          modules:
            - Dashboard
            - Command
            - Alerts
            - Multi-site views
        - label: Programmatic + workflow layer
          detail: API and workflow services expose integrations, ticketing, and generated dashboards.
          modules:
            - GraphQL API
            - Integrations
            - Support ticketing
            - Shared canvas dashboards
        - label: Control + policy layer
          detail: Desired state, digital twin logic, and security policies orchestrate configuration changes.
          modules:
            - Desired state config
            - Digital twin
            - RBAC
            - DNS policies
            - VPN policies
        - label: Network operating layer
          detail: Unified NOS and telemetry services normalize behavior across the full stack.
          modules:
            - Unified NOS
            - Telemetry pipelines
            - Wireless control
            - Switching control
            - Firewall services
        - label: Hardware + edge layer
          detail: Custom APs, switches, firewalls, and gateways deliver the physical network surface.
          modules:
            - A-Series APs
            - S-Series switches
            - F-Series firewalls
            - G-Series / cellular gateways
        - label: External dependency layer
          detail: Partners and cloud providers extend DNS security, WAN, carrier reach, and model training.
          modules:
            - Cloudflare Tenant API
            - Lumen WAN APIs
            - Carrier partners
            - Azure compute
            - ISPs
    approximationNotes: >-
      The stack groups functions that Meter describes across multiple pages; it is an interpretive synthesis of public
      architecture rather than an official engineering diagram.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE008
      - CE012
      - CE016
      - CE026
      - CE030
      - CE031
      - CE033
      - CE038
      - CE039
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Meter’s go-to-market promise is that site rollout moves from discovery to ongoing operations inside one managed
      workflow rather than across many vendors.
    data:
      nodes:
        - id: n1
          label: Discovery inputs
          detail: Customer shares site goals, floor plans, and timelines.
        - id: n2
          label: Template-led design
          detail: Meter uses templated topologies and digital-twin logic to design the network.
        - id: n3
          label: Hardware and ISP preparation
          detail: Equipment planning, logistics, and carrier / ISP coordination are staged by Meter.
        - id: n4
          label: Install + validate
          detail: Plug-and-play installation, failover tests, wireless checks, and site-specific validation occur.
        - id: n5
          label: Operate in dashboard
          detail: Admins use Dashboard, API, and Command for monitoring, policy, and changes.
        - id: n6
          label: Proactive support + refresh
          detail: Meter monitors issues, supports users, and rolls hardware or software updates forward.
      edges:
        - from: n1
          to: n2
          label: requirements mapped
        - from: n2
          to: n3
          label: design staged
        - from: n3
          to: n4
          label: equipment deployed
        - from: n4
          to: n5
          label: network live
        - from: n5
          to: n6
          label: steady-state ops
    claimRefs:
      - CE002
      - CE008
      - CE020
      - CE021
      - CE022
      - CE023
      - CE029
      - CE032
      - CE035
      - CE044
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Meter controls much of the LAN stack itself, but critical security, WAN, compute, and carrier capabilities still
      flow through partner dependencies.
    data:
      nodes:
        - id: d1
          label: Meter control plane
          detail: Dashboard, API, Command, telemetry, and policy orchestration
        - id: d2
          label: Meter hardware + NOS
          detail: APs, switches, firewalls, gateways, and unified firmware / OS
        - id: d3
          label: Cloudflare tenant platform
          detail: DNS filtering, hierarchical policy, block pages, and endpoint types
        - id: d4
          label: Lumen APIs + provisioning
