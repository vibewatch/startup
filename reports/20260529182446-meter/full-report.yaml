      - number: '7.3'
        title: Channel, ISP, and customer concentration are the core commercial risk
        blocks:
          - type: paragraph
            body: >-
              The core commercial risk is dependency concentration across channel, carrier, and customer layers. Meter
              says it is 100% channel with no direct sales team, and CRN’s reporting on the $100 million partner fund
              suggests that enablement, migrations, hardware buybacks, and proof-of-concept economics are not peripheral
              tactics but part of the growth engine. That can accelerate adoption, especially when customers want
              monthly pricing instead of capex, but it also means go-to-market durability depends on partner
              productivity and on subsidies converting into durable recurring gross profit. The company’s public
              materials do not disclose partner-fund payback math, loss-sharing, or any ceiling on how much assistance
              is required to close deals.


              Carrier dependence is similarly embedded in the service promise. Meter markets a single-vendor experience,
              yet its own transparency and operating pages make clear that performance still depends on underlying ISPs,
              access technologies, and external circuits. Lumen integration improves workflow visibility, but Meter does
              not own bandwidth. On the demand side, public materials still do not disclose customer count, top-customer
              share, NRR, or contract duration. That leaves investors unable to judge whether revenue is diversified or
              whether a few reference accounts or partner relationships dominate the model. Concentration guidance from
              L40 and vendor-risk guidance from NPI and the Federal Reserve are therefore directly relevant: once a
              vendor becomes critical infrastructure, weak exit options and hidden concentration matter much more than
              they do for a peripheral software tool.
