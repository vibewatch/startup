      - number: '1.2'
        title: Founders, governance, and organizational dependence
        blocks:
          - type: paragraph
            body: |
              Meter was founded by brothers Anil Varanasi and Sunil Varanasi, who remain the most publicly
              visible operating leaders: Anil as CEO and Sunil as CTO. The founders’ long-form interviews
              and company materials emphasize a long-duration operating philosophy, a bias toward building
              rather than buying, and an unusually founder-centric culture built around kind-but-ambitious
              hiring. Public evidence on broader governance is thinner. The clearest board datapoint in the
              reviewed set is Sequoia partner Ravi Gupta joining the board at the 2022 Series B. Meter’s
              careers page also shows how tightly the company’s operating system is tied to its San
              Francisco facility, where office space, distribution, and quality engineering sit together.
              That can be a strength for a hardware-plus-operations company, but it also signals meaningful
              key-person and operating concentration around the founders and one headquarters. Importantly,
              the reviewed public investor disclosures do not support the user thesis that Andreessen
              Horowitz or NEA are investors; the disclosed cap-table names instead center on General
              Catalyst, Sequoia, Microsoft, Tishman Speyer, WndrCo, Baillie Gifford, J.P. Morgan, and
              prominent angels.
            claimRefs:
              - CO003
              - CO012
