            body: >-
              The chapter’s durability evidence is directionally positive but still narrow. Meter now cites 99.6%
              customer retention through Channel Dive, and FeaturedCustomers shows a healthy stock of testimonials, case
              studies, and reference ratings. More importantly, some stories suggest repeat use rather than one-off
