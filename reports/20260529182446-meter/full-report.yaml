      - number: '2.4'
        title: Growth drivers, security convergence, and market constraints
        blocks:
          - type: paragraph
            body: |-
              The growth side of the story is tangible. IDC says Wi-Fi 7 already represented 39.7% of dependent
              AP revenue in 4Q25, up from 10.25% a year earlier, while Dell’Oro says enterprise-class Wi-Fi 7
              becomes mainstream in 2026 and should trigger switch renewals as buyers add higher-bandwidth and
              PoE capacity. IDC also argues AI-driven applications, video traffic, and IoT are forcing buyers
              to modernize wireless networks, and competitor materials from Cisco, HPE, Juniper, Extreme, and
              Fortinet all point to campuses, branches, factories, hospitals, and semi-industrial settings as
              standard environments for modern, cloud-managed, secure networking. Dell’Oro’s cloud-managed LAN
              work matters especially for Meter because it shows enterprises are more willing to pay recurring
              charges for advanced features and explicitly names startups like Meter inside that opportunity.

              The constraints are real as well. Dell’Oro’s 2025 outlook says fixed IT budgets can cause buyers
              to hold back purchases when macro visibility is weak, and it specifically cites trade tensions,
              inflation, and tariffs as headwinds. The same market also carries operational friction:
              deployment complexity, installed-base replacement, security integration, and a continuing shortage
              of qualified network engineers. Network World’s survey result that 59% of IT organizations plan a
              Wi-Fi upgrade in 2026 but only 7% already run predominantly Wi-Fi 7 shows the upgrade runway is
              large, not complete. That is good for category demand, but it also means Meter still has to prove
              that its recurring, high-touch deployment model can convert that refresh cycle into durable,
              efficient economics at scale.
