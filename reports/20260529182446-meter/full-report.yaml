  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Meter’s public customer journey usually starts with a forcing-function network event and ends with repeat-site or
      partner-led expansion.
    data:
      items:
        - label: Refresh pain
          detail: Office move, licensing renewal, or failed incumbent setup creates urgency.
          tone: warning
        - label: Evaluate one provider
          detail: IT leaders compare Meter with multi-vendor stacks and monthly cost models.
          tone: neutral
        - label: Deploy production site
          detail: Meter handles survey, install, ISP coordination, and initial configuration.
          tone: positive
        - label: Operate with small team
          detail: Customers emphasize proactive alerts, 24/7 monitoring, and less internal toil.
          tone: positive
        - label: Expand or refer
          detail: Future offices, second sites, or partner referrals create the next motion.
          tone: opportunity
    claimRefs:
