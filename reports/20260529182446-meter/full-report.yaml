      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical impact
          values:
            - Hardware certification miss
            - Material telecom/privacy enforcement; common-mode platform defect
            - Customer concentration hidden until diligence; capital-efficiency failure
        - label: High impact
          values:
            - API-key abuse event
            - Underlying ISP outage; support-performance miss; partner-fund underperformance
            - Single-vendor lock-in amplifying churn after service disappointment
        - label: Medium impact
          values:
            - Lumen / integration slip
            - Leadership bandwidth strain; labor and logistics disruption
            - Complimentary-upgrade economics pressuring margins
