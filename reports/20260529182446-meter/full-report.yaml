  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation context: real company, still an unpriced diligence problem'
        blocks:
          - type: paragraph
            body: >-
              Meter is no longer a speculative product mockup. The company closed a $170 million Series C in June 2025,
              has a publicly cited $1 billion valuation mark, and is visibly leaning into a channel-first motion with a
              new $100 million partner growth fund. Those facts support a serious underwriting conversation rather than
              a curiosity trade. The positive side of the case is straightforward: Meter has a coherent full-stack
              story, it prices networking as a predictable recurring service instead of a capex project, and channel
              partners are publicly saying they want to move meaningful refresh activity onto the platform. That is
              enough to believe the company has product-market pull.


              The valuation question is harder. Public evidence still does not disclose Meter’s current revenue, ARR,
              gross margin, net revenue retention, or partner-fund payback. Even the best public churn datapoint remains
              management commentary rather than an independently verified cohort table. That gap matters because Meter’s
              model is not pure software: it owns hardware obligations, installation complexity, and long-duration
              service delivery. IT Europa’s editor captured the issue cleanly when he wrote that Meter could become
              either an Uber-style disruptor or a WeWork-style implosion depending on whether the economics work. The
              chapter conclusion therefore has to separate company quality from entry price. Public evidence supports
              continued diligence, not a clean buy decision at the current mark.
            claimRefs:
