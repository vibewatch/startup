  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: >-
      The main cash-flow question is not whether Meter has recurring revenue, but how much capital it must front-load to
      create and support that revenue.
    data:
      columns:
