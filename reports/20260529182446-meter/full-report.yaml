  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Meter’s public monetization story is clear at the packaging layer even though the realized economics
              remain hidden. The company markets one predictable monthly fee, no upfront costs, and a single vendor
              relationship that bundles hardware, software, security, support, design, and ISP management into a
              recurring contract. Public partner materials add two concrete monetization details that matter for
              underwriting: pricing is quoted per square foot and billing can run monthly, quarterly, or annually. The
              same materials split the offer into a Professional tier, where installation is not included and the
              customer or partner coordinates install, and a Premium tier, where Meter provides the end-to-end rollout
              including cabling work. Meter also markets cellular, carrier-fee management, and buyback credits as
              attached services or adoption aids. What is not disclosed publicly is just as important: list-to-realized
              discounts, median contract length, renewal terms, churn, and whether bundled installation or carrier
              management carries separate economics internally.
