  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Meter’s product is no longer just managed Wi-Fi. The public surface now describes a bundled enterprise
              connectivity platform that combines LAN hardware, cloud software, security services, ongoing operations,
              and adjacent WAN and cellular orchestration under one monthly service relationship. At the user layer,
              customers interact through the Meter Dashboard, APIs, and Meter Command; at the physical layer, Meter
              sells access points, switches, firewalls, and cellular access infrastructure that are designed to work
              together rather than as a stitched multi-vendor stack. This matters because Meter’s customer promise is
              operational simplicity: floor plans and site goals feed a templated design process, hardware ships
              pre-authenticated, networks go live in weeks, and Meter stays involved for support, monitoring, upgrades,
              and even carrier coordination. Customer proof from Switchyards and product pages for Cellular show that
              Meter is trying to win on end-to-end workflow ownership rather than isolated device features. The
              resulting product thesis is strongest in environments where buyers value single-vendor accountability,
              rapid rollout, and lifecycle refreshes more than freedom to mix best-of-breed components.
