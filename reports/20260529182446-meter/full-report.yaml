  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, categories, and where Meter actually competes
        blocks:
          - type: paragraph
            body: >-
              The competitive set around Meter only makes sense once the market is narrowed to campus
              network-as-a-service rather than the entire enterprise networking stack. IDC's 2024 Innovators note
              profiles Join, Meter, Nile, and Ramen together as emerging enterprise NaaS vendors, while Dell'Oro's
              campus-NaaS research breaks the market into enabler, turnkey, and LAN-as-a-utility models. In that frame,
              Meter belongs in the LAN-as-a-utility startup cohort rather than in the much broader WAN, cloud, or
              generic managed-services markets. Network World's coverage of Dell'Oro is especially useful because it
              explicitly says campus NaaS is a subset of public cloud-managed LAN and excludes WAN and cloud/storage
              services. That distinction matters because it prevents false comparisons with remote-access-only or
              backbone-heavy vendors.


              Within that narrower scope, the direct peer set is small: Nile, Join Digital, and Ramen. Nile is the
              closest look-alike because it also sells the network as an outcome, wraps hardware into service, and
              pitches operational simplicity as the reason to switch. Join is direct but differentiated: its public
              materials lean on open-standard hardware, agentic operations, and commercial-real-estate or
              flexible-workplace use cases. Ramen is closer to an adjacent edge/industrial competitor than a one-for-one
              office-campus replacement vendor because its proof points center on warehouses, factories, remote sites,
              and physical-AI infrastructure. The result is that Meter is not fighting a giant swarm of identical
              startups; it is fighting a small direct cohort plus a much larger outer ring of incumbents and
              substitutes.
