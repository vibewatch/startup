  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Contractual and regulatory asymmetry is the first diligence gate
        blocks:
          - type: paragraph
            body: >-
              Meter’s first underwriting gate is contractual and regulatory asymmetry. The public contract stack gives
              Meter unusually broad control relative to the customer: Meter can terminate immediately for prohibited
              use, limit most liability to the prior 12 months of fees, keep title to leased hardware, and update
              related terms, SLAs, and support terms by posting revisions. That structure is not unusual for SaaS, but
              it matters more here because Meter is not only a dashboard vendor. It is trying to sit in the middle of
              campus connectivity, ISP coordination, security controls, and field support. When the vendor is this
              operationally central, low contractual recourse becomes a real diligence issue rather than boilerplate.


              Meter’s own transparency disclosures also imply real telecom-style compliance risk. Connect is presented
              as broadband internet access service subject to FCC transparency rules, and the company acknowledges that
              customers can escalate complaints to the FCC. Meanwhile, FCC-focused legal analysis shows that privacy and
              breach expectations for communications providers have become stricter, especially around CPNI, PII, and
              notification timing. Meter does disclose meaningful mitigations — SOC 2 Type II, a trust portal,
              penetration-test availability, and default security controls — but the public record still does not expose
              the actual platform SLA or support terms that would determine whether remedies are commercially meaningful
              after a major incident. That makes regulatory/compliance drift plus contractual asymmetry the chapter’s
              first ranked risk.
            claimRefs:
