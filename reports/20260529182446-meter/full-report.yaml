          - type: callout
            title: Bull-case upside requires a premium-multiple business, not just a premium story
            body: >-
              The upside case is real only if Meter can show that its recurring revenue quality and margin structure
              deserve to sit closer to the top of the networking comp range. Without that proof, the current valuation
              can still be a ceiling rather than an entry point.
            calloutType: assumption
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV035
              - CV046
