      - number: '5.4'
        title: Roadmap maturity and technical risks
        blocks:
          - type: paragraph
            body: >-
              The product roadmap is real, not purely aspirational. Public releases show a sequence from the 2024
              switch-platform and Command launches, through DNS-security and cellular additions, to 2025 launches for
              nine new hardware platforms and the explicit autonomous-networking thesis. That cadence suggests Meter can
              ship across hardware, software, and operations in parallel, which is unusual for a company of its size.
              But the most important underwriting question is not whether the roadmap exists; it is whether the autonomy
              layer and hardware platform mature faster than execution risk compounds. Meter’s own material shows
              healthy caution on some fronts, such as delaying Wi-Fi 7 commercialization until testing and demand were
              stronger, yet the company is simultaneously claiming deterministic AI, support-ticket automation,
              full-stack design generation, and daily model improvement on Azure-backed compute. Public evidence for
              those claims is still mostly self-reported or media-amplified rather than independently benchmarked. The
              hardware story also carries concentration risk because Meter designs custom platforms, refreshes them as
              part of subscription economics, and manufactures and validates in Taiwan. In short, Meter appears
              productively ahead of many NaaS peers on integration and pace, but investors should treat autonomous
              operations, supply resilience, and ecosystem depth as the main technical diligence filters before
              assigning premium moat value.
