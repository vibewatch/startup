      - number: '1.3'
        title: Funding history, investor map, and route to market
        blocks:
          - type: paragraph
            body: |
              Meter’s financing story is now legible even though the company remains private and
              financially opaque. Official company releases and third-party databases line up on a May 2022
              Series B announcement and a much larger June 12, 2025 Series C led by General Catalyst.
              Third-party funding trackers and trade coverage place the post-money valuation at about
              $1 billion and total raised at about $315 million after the Series C, putting Meter into the
              unicorn bracket while still much smaller than mature public networking incumbents. The more
              strategically important shift is commercial rather than purely financial: by late 2025, Meter
              said it had become effectively channel-led, with 95 percent of business through the channel,
              all new business and renewals fulfilled through channel partners, and Microsoft positioned as
              a major distribution route through Azure Marketplace consumption commitments. Lumen expands
              the commercial stack further by attaching WAN procurement and telemetry to Meter’s LAN and
              management layer. That means Meter’s next phase is less about proving the existence of a
              product and more about proving that a high-touch, vertically integrated networking model can
              scale economically through partners without losing simplicity.
