      - number: '8.3'
        title: Scenario thinking supports research-more, medium confidence, and a stretched stance
        blocks:
          - type: paragraph
            body: >-
              Because current operating metrics are missing, the scenario work has to be explicit about what is observed
              and what is assumed. The observed facts are these: Meter has real financing support, a product
              architecture that customers and partners understand, and a go-to-market motion that could accelerate if
              refresh cycles and supply stress favor service-led alternatives. The unobserved facts are the ones that
              determine whether the private mark is fair: current revenue scale, contribution margin after hardware and
              field operations, cohort retention quality beyond a single company claim, and whether partner subsidies
              are transient accelerants or permanent requirements. That uncertainty forces the current call away from
              buy.


              The bull case exists, but it is conditional. Meter would need to disclose enough recurring revenue scale
              and unit economics to deserve a premium networking multiple, while proving that the partner-led model can
              scale without constant subsidy. The base case is more modest: the business is real, adoption continues,
              but public evidence never becomes good enough to underwrite a large premium to the current mark. The bear
              case is not product irrelevance; it is that channel incentives, refresh obligations, or cap-table terms
              absorb the upside before new investors get paid. Given those branches, the most defensible recommendation
              is Research More with medium confidence, a high risk rating, and a stretched valuation stance. The company
              may still compound well, but the current public record does not yet let an investor know whether that
              upside is already priced in.
