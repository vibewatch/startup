        - Operational criticality
        - Repeat / expand signal
        - Independent depth
      rows:
        - label: GoBolt
          values:
            - value: High
              detail: Zero unscheduled downtime; scanner drops stopped
              tone: positive
            - value: High
              detail: 13 warehouses and robotic / scanner workflows
              tone: positive
            - value: Medium
              detail: Large rollout proves depth but no public renewal data
              tone: warning
            - value: Low
              detail: Evidence is still a Meter-authored case study
              tone: risk
        - label: Webb School
          values:
            - value: High
              detail: Live event streaming and mDNS improvements
              tone: positive
            - value: High
              detail: 100-acre campus with 12 buildings
              tone: positive
            - value: Medium
              detail: School use suggests multi-year stickiness but not a disclosed renewal
              tone: warning
            - value: Low
              detail: No independent campus reference outside Meter materials
              tone: risk
        - label: Strava
          values:
            - value: Medium
              detail: Fast troubleshooting and launch speed
              tone: positive
            - value: Medium
              detail: Global office footprint but not warehouse or campus complexity
              tone: warning
            - value: High
              detail: Future offices explicitly discussed
              tone: positive
            - value: Low
              detail: Outcome depth comes from one official story
              tone: risk
        - label: Keys + MSP
          values:
            - value: Medium
              detail: Proactive support and overprovisioned coverage
              tone: positive
            - value: Medium
              detail: Two campuses and 400+ devices
              tone: warning
            - value: High
              detail: Direct proof of MSP-led adjacency expansion
              tone: positive
            - value: Low
              detail: Meter and partner co-author the evidence
