      - number: '3.4'
        title: Pricing visibility, distribution power, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Meter's pricing is unusually legible in public materials. The company says it charges by square foot,
              billed monthly, and that support, maintenance, and hardware refreshes are bundled into the rate. That
              creates a cleaner public comparison point than most alternatives. Nile clearly communicates that hardware
              is included and that the purchase is outcome-based, but its public pages do not post a list schedule. Join
              describes the service bundle and SLA but not a public rate card. HPE GreenLake says networking can be
              consumed as a single monthly subscription, yet still routes buyers to a consultative motion. Cloudflare's
              pricing page is the clearest example of substitute mismatch: it confirms Cloudflare One packaging exists,
              but pushes the buyer to contact sales rather than showing a hardware-inclusive campus-LAN price.


              Distribution and switching therefore matter as much as list pricing. Incumbents still own the broadest
              estates, channels, and adjacent products, which makes them hard to dislodge when a buyer already runs
              Cisco, HPE Aruba, Juniper, Fortinet, or Palo Alto. Startups are responding by using channels too — CRN
              notes that Join goes through partners and that Meter is building a recurring-revenue partner model — but
              their route-to-market is still catching up. Meanwhile, lifecycle ownership itself becomes a switching-cost
              engine. Once a buyer turns over ISP procurement, site design, installation, hardware refresh, policy
              control, and day-2 troubleshooting to a turnkey vendor, the replacement decision becomes far broader than
              swapping access points or changing security software.
