      - number: '1.4'
        title: Product milestones, outside validation, and disclosure gaps
        blocks:
          - type: paragraph
            body: |
              The most important operating milestones in the reviewed record cluster from 2024 onward.
              Meter launched Command in August 2024 as a generative interface for network operations,
              reported more than doubling deployed square footage in 2024, and said its partner program was
              already working with hundreds of organizations by year-end. In 2025, the company used
              MeterUp to announce nine new hardware platforms, a fully channel-based route to market, and
              a growing partnership ecosystem that includes Microsoft, CDW, WWT, and Lumen. In 2026,
              Gartner named Meter a Visionary in enterprise wired and wireless LAN for the second
              consecutive year, and channel coverage documented an EMEA expansion push. At the same time,
              the evidence base remains incomplete where an investor most needs hard numbers. Public
              sources do not provide revenue or ARR, profitability or burn, a primary-source total customer
              count, or a current headcount. Outside analysis is directionally positive but not uncritical:
              Omdia says Meter still needs broader GTM capability to match incumbents, and IT Europa’s
              editor explicitly says the company could become either an “Uber-style disruptor” or a
              “WeWork implosion” depending on how the economics play out.
