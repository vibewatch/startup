      - number: '5.2'
        title: Architecture, control plane, and Command
        blocks:
          - type: paragraph
            body: >-
              Meter’s architectural differentiation comes from collapsing control, telemetry, and hardware behavior into
              a single operating model. Public materials repeatedly describe one network operating system, one cloud
              source of truth, identical firmware across devices, and a digital-twin or desired-state workflow that lets
              Meter stage, validate, and propagate configuration without per-box CLI work. The Dashboard exposes the
              resulting control plane across topology, VLANs, routing, firewall, VPN, DNS security, logs, and multi-site
              views, while the GraphQL API gives customers a programmatic path into the same environment. Meter Command
              is the newest layer on top of this stack. The handbook and launch posts describe a three-stage
              planning-execution-synthesis pipeline that pulls live data, writes custom dashboards or configuration
              forms, and requires user confirmation before state-changing actions. Third-party coverage from Network
              World, theCUBE Research, Tech Field Day, and SiliconANGLE broadly corroborates the same picture: Meter is
              not wrapping a chatbot around loose device APIs, but building an AI-assisted interface on top of a
              vertically integrated back end. That makes the architecture more coherent than legacy alternatives, while
              also concentrating platform risk inside Meter’s own software quality and model discipline.
