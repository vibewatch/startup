  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The recommendation turns on whether real company proof can overcome the still-missing valuation bridge.
    data:
      nodes:
        - id: n1
          label: Real financing and product proof
          detail: Series C, integrated stack, and visible partner interest make Meter investable-in-principle.
        - id: n2
          label: Channel and pricing evidence
          detail: Recurring service pricing and a $100M partner fund show how adoption is being accelerated.
        - id: n3
          label: Economic disclosure gap
          detail: Revenue, ARR, gross margin, NRR, and preference terms remain outside the public record.
        - id: n4
          label: Comparable range is wide
          detail: Networking assets trade anywhere from low-single-digit to high-teens revenue multiples.
        - id: n5
          label: 'Current call: research more'
          detail: Public evidence supports diligence, not a clean buy at the current mark.
      edges:
        - from: n1
          to: n2
          label: quality exists
        - from: n2
          to: n3
          label: price still depends on economics
        - from: n3
          to: n4
          label: bridge cannot be placed
        - from: n4
          to: n5
          label: stay disciplined
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV013
      - CV036
      - CV041
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The same $1B mark implies radically different required revenue depending on which comparable multiple ultimately
      fits Meter.
    data:
      items:
        - label: Nile-like scarcity multiple
          value: 10
          detail: Implied revenue needed at ~100x valuation/revenue
          tone: positive
        - label: Arista-like premium multiple
          value: 52
          detail: Implied revenue needed at 19.41x EV/Sales
          tone: positive
        - label: Cisco-like scaled incumbent multiple
          value: 124
          detail: Implied revenue needed at 8.08x EV/Sales
          tone: warning
        - label: Extreme-like lower-margin multiple
          value: 358
          detail: Implied revenue needed at 2.79x EV/Sales
          tone: negative
    approximationNotes: >-
      Bars show the revenue that would be needed to support a $1B valuation under each comparable multiple. They do not
      assert Meter’s current revenue.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Scenario ranges are broad because the missing economics determine whether the current mark is a floor, a midpoint,
      or already optimistic.
    data:
      items:
        - label: Bear case
          low: 400
          mid: 600
          high: 900
          note: Economic proof disappoints; down-round or forced strategic outcome becomes relevant.
        - label: Base case
          low: 900
          mid: 1200
          high: 1600
          note: Business quality is real, but public data only supports modest upside over the current mark.
        - label: Bull case
          low: 1800
          mid: 2200
          high: 3000
          note: Meter proves recurring scale and margin quality strong enough for a premium multiple.
    approximationNotes: >-
      Values are USD millions and represent scenario endpoints under explicit assumptions, not current observed fair
      value.
    claimRefs:
      - CV041
      - CV042
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: The company scores well on relevance and proof-of-life, but poorly on economics evidence and price support.
    data:
      items:
        - label: Market relevance
          value: 4/5
          detail: Enterprises are still looking for simpler opex-style networking consumption.
          tone: positive
        - label: Product / architecture proof
          value: 4/5
          detail: Integrated stack and customer references are credible.
          tone: positive
        - label: GTM proof
          value: 3/5
          detail: Channel motion is visible, but subsidy intensity is unresolved.
          tone: warning
        - label: Economics evidence
          value: 1/5
          detail: Revenue, margins, NRR, and payback remain undisclosed publicly.
          tone: negative
        - label: Valuation support
          value: 1/5
          detail: A $1B mark cannot be placed confidently on the public-comp range today.
          tone: negative
        - label: Evidence quality
          value: 2/5
          detail: Enough to keep diligencing, not enough to clear the investment committee.
          tone: warning
    approximationNotes: >-
      Scores are author judgments derived from the chapter evidence set and are intended as a disciplined synthesis
      rather than a mechanical model.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
