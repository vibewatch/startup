companyProfile:
  summary: >-
    Meter is a San Francisco-based enterprise networking company founded in 2015 by brothers Anil and Sunil Varanasi.
    The company built a vertically integrated stack across hardware, software, deployment operations, and support, then
    wrapped that stack in a recurring service model that removes upfront customer capex. Public evidence shows a
    meaningful transition from founder-led product build-out into channel-led distribution through Microsoft, Lumen,
    CDW, WWT, and other partners, culminating in a $170 million Series C in June 2025 at roughly a $1 billion valuation.
    The major limitation is disclosure quality: the public record still does not provide revenue, ARR, profitability,
    customer-count, or current headcount data sufficient to underwrite the private mark with high confidence.
