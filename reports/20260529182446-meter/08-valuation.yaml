  - CV041
  - CV042
  - CV045
- calloutType: risk
  title: Channel enthusiasm cannot substitute for payback math
  body: 'Public partner quotes are encouraging, but they do not yet answer the core underwriting question: how much Meter is spending to win and migrate each customer, and how quickly that spend is recovered. Until that math is disclosed, GTM momentum should be treated as directional rather than decisive.'
