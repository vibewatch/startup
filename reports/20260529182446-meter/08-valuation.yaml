- id: SV002
  title: Comparable valuation work shows how much the missing revenue bridge matters
  body: 'The public comparable set is useful here not because Meter should trade exactly like any one company, but because the spread is so wide that it reveals what the market is paying for. Cisco is a scaled incumbent with an 8.08x EV/Sales reading on current market data. Arista is the premium outlier at roughly 19.41x EV/Sales because investors are paying for superior growth and margins. Extreme sits around 2.79x EV/Sales, reflecting a much lower-profit profile. Juniper’s last standalone public-market value before delisting was about $13.35 billion against roughly $5.45 billion of trailing revenue, while HPE framed the acquisition as attractive because it doubled the networking business and improved mix toward higher-margin growth areas. Nile is the opposite extreme: Sacra estimates a roughly $750 million valuation on only about $7.5 million of ARR, which is an early-stage scarcity premium, not a mature infrastructure multiple.


    Once those anchors are laid out, the problem with Meter’s current disclosure becomes obvious. If the company’s mark is about $1 billion, that could be conservative or aggressive depending on what current revenue and margin actually look like. At Cisco-like multiples, the mark implies only about $124 million of revenue. At Arista-like multiples, it implies roughly $52 million. At Extreme-like multiples, it implies roughly $358 million. Public evidence does not tell investors which of those worlds they are in. That is why the comp exercise does not produce a precise fair value today; it produces an entry-discipline test that management still has to pass.'
