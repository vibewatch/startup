  evidenceGaps:
  - type: missing-source
    severity: material
    topic: series-c-preferences
    missingEvidence: Series C liquidation preferences, anti-dilution terms, pro rata rights, and option-pool dilution detail.
    whyItMatters: The recommendation can look reasonable on company quality and still fail on investor returns if senior terms absorb the base-case upside.
    diligencePath: Request the current cap table, term sheet summary, and waterfall model from finance and counsel before any valuation discussion continues.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: channel-payback
    missingEvidence: Partner-fund usage by deal, CAC, payback period, proof-of-concept conversion rates, and subsidy taper assumptions.
    whyItMatters: Public partner enthusiasm is directionally positive but cannot tell investors whether Meter is buying growth or building durable channel leverage.
    diligencePath: Review partner program economics with CRO and channel-ops leadership, including cohort-level land-to-renewal performance.
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics-disclosure
    missingEvidence: Current revenue, ARR, gross margin, contribution margin, churn, and NRR by cohort and major customer segment.
    whyItMatters: Without these operating metrics the $1 billion mark cannot be placed on a credible comp framework and the recommendation cannot move above research-more.
    diligencePath: Request board or diligence-room KPI packs and reconcile them to audited or management financial statements.
    relatedQuestionRefs:
    - QV019
    - QV024
    - QV027
    relatedTableRefs:
    - TV001
    - TV006
  - type: missing-source
    severity: material
    topic: contract-quality
    missingEvidence: Independent renewal, churn, SLA-credit, and contract-length distribution data beyond founder commentary and one company-claimed retention metric.
    whyItMatters: The recurring-revenue thesis depends on contract durability, but the public record still lacks independent evidence that retention and service performance hold at scale.
    diligencePath: Sample major customer order forms and renewal cohorts, and review support-credit history with customer-success leadership.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: Additional private NaaS rounds and transaction comps with both disclosed valuation and operating-scale evidence.
    whyItMatters: The current comparable table is good enough to bracket valuation regimes, but private networking comps remain sparse and reduce precision at the upper and lower ends.
    diligencePath: Augment the comparable set with banker materials, secondary pricing, and private-round data when a live process provides access.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV014
    relatedTableRefs:
    - TV003
