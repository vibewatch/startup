- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Revenue / scale signal
  - EV or valuation mark
  - Multiple / status
  - Relevance to Meter
  - Limitation
  rows:
  - - Cisco
    - $60.75B LTM revenue
    - $490.99B EV; $474.63B market cap
    - 8.08x EV/Sales
    - Scaled incumbent anchor for a profitable networking platform with broad enterprise reach.
    - Too mature and diversified to be a direct stage match for Meter.
  - - Arista
    - $9.71B LTM revenue; $9.006B FY2025 revenue
    - $188.45B EV; $200.81B market cap
    - 19.41x EV/Sales; premium multiple
    - Upper-end quality multiple for a high-growth networking asset with elite margins.
    - Data-center and AI concentration make it a demanding benchmark for Meter.
  - - Extreme Networks
    - $1.25B LTM revenue; $1.14B FY2025 revenue
    - $3.49B EV; $3.47B market cap
    - 2.79x EV/Sales
    - Lower-margin public networking reference for a vendor with real hardware and services exposure.
    - Not a NaaS pure-play and public equity volatility is higher.
  - - Juniper
    - $5.45B LTM revenue; ~$799.7M FCF
    - $13.35B last standalone market cap
    - Public-market / strategic floor reference
    - Shows how strategic buyers value disclosed scale and installed base in networking.
    - Market-cap figure reflects delisting timing, not a clean standalone trading range today.
  - - Nile
    - $7.5M estimated ARR in 2023
    - $750M estimated valuation in 2024; $315M total funding
    - ~100x implied valuation/revenue
    - Private NaaS scarcity comp closest to Meter’s as-a-service narrative.
    - Estimated revenue and private valuation make the comp informative but low precision.
  enumerationScope:
    coverage: partial
    basis: Covers the most usable public networking anchors plus the clearest private NaaS comp with disclosed funding and estimated valuation. It is not an exhaustive universe because most late-stage private NaaS companies do not publish both valuation and operating scale.
  notes: Values mix current market data, filings, and estimated private marks. Rows are non-uniform by design because the goal is to bracket plausible valuation regimes rather than to pretend Meter has a perfect peer.
