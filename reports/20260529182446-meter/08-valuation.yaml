tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Public-evidence basis
  - Upgrade / downgrade implication
  rows:
  - - Recommendation
    - Research-more
    - Real financing and product proof exist, but price support is still opaque.
    - Upgrade only after management discloses revenue scale, margin quality, and cap-table terms.
  - - Confidence
    - Medium
    - Financing and comparable evidence are usable, but the missing operating bridge is material.
    - Falls if new data stays opaque; rises if audited or board-grade metrics are shared.
  - - Risk rating
    - High
    - Hardware ownership, partner subsidies, and late-stage term risk create non-software downside.
    - Downgrades only if contribution margin and preference stack are verified.
  - - Valuation stance
    - Stretched
    - A $1B mark may be defensible, but only under favorable revenue and margin assumptions not yet public.
    - Could move to fair if disclosed metrics place Meter in the mid-premium comp set.
  - - Decision implication
    - Monitor, do not underwrite current mark from public data alone
    - The diligence bottleneck is evidence quality, not product existence.
    - Proceed only through a data-room diligence process or at a materially better entry price.
  notes: 'This table converts chapter evidence into an IC decision. It is intentionally price-sensitive: the issue is not whether Meter is real, but whether the current mark is supported by public economics.'
