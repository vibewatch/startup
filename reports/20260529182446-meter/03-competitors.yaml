- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Meter moat claim
  - Competing threat
  - Severity
  - Why the threat matters
  - Current public counter-evidence / diligence ask
  rows:
  - - Vertical integration simplifies buying and operation
    - Nile competes on the same full-service outcome with stronger public service and contracting proof
    - High
    - A direct peer can neutralize Meter's convenience story if buyers trust Nile more on execution
    - Need win/loss SLA-credit and renewal data comparing Meter and Nile service quality
  - - Proprietary stack creates customer lock-in
    - Join markets open-standard hardware and agentic operations as a flexibility benefit
    - Medium
    - Buyers wary of vendor concentration may prefer an open-hardware path that still offloads operations
    - Need customer references on why Meter's proprietary hardware beats open alternatives on TCO and reliability
  - - One contract raises switching costs after deployment
    - Incumbents can defend accounts before a full rip-and-replace ever starts
    - High
    - Cisco HPE and Juniper can satisfy enough of the need inside existing estates to avoid a turnkey displacement project
    - Need Meter-specific replacement patterns by incumbent estate and deal stage
  - - Security can be bundled inside the Meter stack
    - Fortinet Palo Alto and Cloudflare can win security-led or branch-led projects without replacing the whole LAN
    - High
    - The budget owner may choose a security-first substitute that solves access and policy pain sooner
    - Need pipeline split by networking-led versus security-led opportunity and competitor class
  - - Owning hardware and operations can protect margin and performance
    - Owning hardware also concentrates roadmap supply and support risk in one vendor
    - Medium
    - If hardware or support stumbles customers cannot easily swap only one layer
    - Need hardware refresh cadence supplier concentration and field-failure data
  - - Direct startup cohort is gaining category visibility
    - Startups are still smaller than incumbents and are expanding from a narrow installed base
    - Medium
    - Market visibility is not the same as durable share or operating leverage
    - Need cohort ARR site count and renewal benchmarks before treating the moat as mature
  notes: Risk register focuses on public competitive durability evidence rather than unpublished internal metrics; every high-severity item points to a concrete diligence ask.
