- id: incumbents-and-substitutes
  title: Incumbents and substitute stacks still shape the buying decision
  body: |-
    Even if Meter wins the direct-startup comparison, the larger competitive gravity still belongs to incumbents. Cisco/Meraki, HPE Aruba, and Juniper Mist all bring broad campus LAN portfolios, mature cloud management, and increasingly aggressive AI-operations narratives. Meraki spans Wi-Fi, switching, SD-WAN, IoT, and device management. Cisco's wireless platform pitches offices, hospitals, factories, and stadiums, while HPE GreenLake explicitly sells networking as a monthly subscription and Aruba Central emphasizes AI-native automation across branch, campus, data center, and IoT. Marvis AI and Juniper's access-point portfolio reinforce that Juniper is selling not only hardware but also autonomous operations and Wi-Fi 7 readiness. Dell'Oro's observation that HPE has the broadest enabler portfolio and that Juniper has risen to number two in public cloud-managed WLAN revenue underscores how much incumbent scale still matters.

    The other threat comes from security-led substitutes rather than from like-for-like campus NaaS. Fortinet, Palo Alto Networks, and Cloudflare all market converged networking and security experiences that can solve the buyer's problem without replacing the entire enterprise LAN ownership model. FortiSASE combines SD-WAN and SSE and extends into thin-edge and WLAN/LAN integrations; Palo Alto pitches hybrid workforce and Zero Trust branch transformation; Cloudflare One sells a unified-by-design SASE platform that deploys in hours, not months, across more than 300 cities. Those vendors are not direct Meter clones, but they are credible substitutes whenever the decision starts with security, branch access, or remote user modernization rather than with full-lifecycle campus replacement.
