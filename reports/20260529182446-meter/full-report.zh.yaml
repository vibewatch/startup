        - 一个控制平面覆盖拓扑、日志、VPN、VLAN、DNS 安全和多站点管理，并提供 GraphQL API 访问
        - 公开文档没有展示广泛 SDK 或限流深度
      - - Meter Command
        - 网络工程师、支持、运营、合作伙伴
        - 2024 年推出，2025 年扩展
        - 自然语言生成式 UI，可查询数据、构建仪表盘，并将操作暂存至确认环节
        - 独立基准数据有限，信任仍依赖人在回路控制
      - - A-Series 无线
        - 站点用户和无线管理员
        - 当前硬件系列
        - Wi-Fi 7 AP 集成 RF 自动化、安全策略和统一管理
        - 企业客户在真实场景采用 Wi-Fi 7 仍落后于功能集
      - - S-Series 交换 + 数字孪生
        - 网络工程师和部署运营
        - 当前硬件系列
        - 虚拟化预演、拓扑可视性，以及感知交换机的全栈可观测性
        - 数字孪生深度已有公开展示，但主要来自 Meter 自有渠道
      - - F-Series 防火墙
        - 安全与基础设施团队
        - 当前硬件系列
        - 高吞吐防火墙，内置 HA 和 5G 故障切换支持
        - 公开说法缺少独立性能测试和事故历史透明度
      - - Cellular
        - 设施密集型企业、办公室、仓库、学校
        - 2024 年 beta 后，2025 年正式可用
        - 中立主机、单以太网安装模式，接入 Meter 技术栈
        - 运营商和监管依赖很重
