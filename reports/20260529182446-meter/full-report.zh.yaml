            body: >-
              该章关于耐久性的证据方向不错，但口径仍窄。Meter 现在借 Channel Dive 口径引用 99.6% 客户留存率，FeaturedCustomers
              上也有不少推荐语、案例和参考评分。更重要的是，部分故事显示的不是一次性安装，而是重复使用：LatchBio 搬办公室时继续保留 Meter，Strava 和 Loom 提到未来地点，Knowing
              Technologies 在 Keys 部署后考虑向更多学校推荐 Meter。这个模式符合 Meter 的经济模型。官方伙伴页面称，公司坚持渠道优先，在完整客户生命周期里对齐激励， 并在 2026 年 5 月推出
              $100 million 基金，用于伙伴来源迁移、赋能和联合销售。合起来看，这些信号意味着扩张本该来自 设备更新事件、可复制站点模板和伙伴转介。但公开来源没有拆分客户数留存与收入留存、交叉销售附着率，
              也没有披露续约队列行为。公开叙事能支撑“存在某种扩张动作”，还不能支撑“耐久性已经被独立证明”。
