      - number: '4.3'
        title: 渠道经济性和资本充足性
        blocks:
          - type: paragraph
            body: >-
              Meter 的增长模型如今似乎高度依赖渠道主导的经常性收入，而不只是直销企业销售。Meter 自己的伙伴页面推销高毛利年度经常性收入、更低客户月成本和更快成交；LTT Partners 则在 Meter
              订阅之上营销安装和一线支持。第三方渠道报道把获客补贴说得更直接：ChannelDive 称 Meter 推出 $100 million
              伙伴增长基金，通过返利、销售激励（spiffs）、迁移激励、培训和营销发展基金发放；CRN 引述 SageNet 预期，未来 24 到 36 个月，传统部署中 40% 到 50% 将转向 Meter
              模型。融资方面，Meter 2025 年 6 月 Series C 的 $170 million 证据充分，但公开数据库在累计融资和员工数上不一致：Tracxn 显示融资 $315 million、员工 220
              人，而 Network World 列出融资 $255 million，PitchBook 预览显示员工 142 人。融资显然支持扩张，但公开现金、烧钱速度、现金跑道和债务数据仍缺失。
