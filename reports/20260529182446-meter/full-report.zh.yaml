  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面和客户工作流
        blocks:
          - type: paragraph
            body: >-
              Meter 的产品不再只是托管 Wi-Fi。公开材料如今描述的是一套打包企业连接平台：在一段月度服务关系下，组合 LAN 硬件、云软件、安全服务、持续运营，以及相邻的 WAN 与蜂窝编排。在用户层，客户通过
              Meter Dashboard、API 和 Meter Command 交互；在物理层，Meter 销售接入点、交换机、防火墙和蜂窝接入基础设施，这些设备被设计为协同工作，而不是拼接的多供应商栈。这很重要，因为
              Meter 对客户的承诺是运营简单：楼层平面图和站点目标进入模板化设计流程，硬件预认证后发货，网络数周内上线，Meter 继续参与支持、监控、升级，甚至运营商协调。Switchyards 的客户证据和
              Cellular 产品页面显示，Meter 试图靠端到端工作流所有权取胜，而不是孤立设备功能。由此形成的产品投资逻辑，在买方更重视单一供应商责任、快速铺开和生命周期更新，而不是自由混搭最佳单品组件的环境中最强。
