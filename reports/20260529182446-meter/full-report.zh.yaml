        - 按站点规模和环境提供部署时长中位数与 p90
      - - 支持效率代理指标
        - 99.99% 问题在 24 小时内解决，平均响应时间比传统厂商快 3x
        - 中
        - Day-2 支持成本和 SLA 负担决定订阅毛利率
        - 提供每站点工单量、升级率和每个已部署地点的支持成本
      - - 内部人力替代代理指标
        - 客户称 Meter 可避免新增网络岗位或多名工程师
        - 中
        - 说明买家有 ROI，也暗示 Meter 接手了重人力工作
        - 提供每 100 个站点的实施 FTE 和支持 FTE
      - - 硬件毛利率
        - null
        - 低
