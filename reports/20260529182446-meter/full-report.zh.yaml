  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 指示性估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - Meter 披露足够的经常性收入规模和利润率耐久性，足以拿到高溢价网络倍数；留存说法经得起检验；合作伙伴补贴逐步收敛为正常 CAC。
        - $1.8B-$3.0B / 较当前 $1B 标记大约 1.8x-3.0x。使用高溢价公开网络公司倍数，而不是 Meter 当前可观察经济性。
        - 低到中。需要几个非公开证明点同时成立。
        - 利润率不及预期、补贴依赖，或下一轮带结构，都可能迅速抹掉溢价。
      - - 基准
        - 公司继续增长，渠道动作跑通，但公开证据只支持中等质量，而不是顶尖经济性。
        - $0.9B-$1.6B / 大致持平到温和上行。把当前标记视为可监测，但并不明显便宜。
        - 中。与今天公开记录最一致。
        - 如果优先股堆叠或稀释很重，持平估值仍可能带来糟糕投资结果。
      - - 悲观
        - 披露经济性显示，硬件所有权、迁移抵扣和支持负担吃掉了大部分毛利，或者下一轮融资是防御性的。
        - $0.4B-$0.9B / 约为当前标记的 0.4x-0.9x。下行轮或被迫战略出路成为现实参照。
        - 中。下行路径由经济性驱动，不是产品失去相关性。
        - 优先权保护、客户集中和补贴依赖会加重新资金下行。
    notes: 情景区间是作者基于可比倍数和明确假设给出的估计，不是对 Meter 当前收入或利润率的主张。它们服务于纪律，而非精确。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV035
      - CV041
