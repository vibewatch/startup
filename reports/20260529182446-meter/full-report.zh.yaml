      - number: '8.3'
        title: 情景思考支持继续研究、中等信心和偏高立场
        blocks:
          - type: paragraph
            body: >-
              由于当前经营指标缺失，情景工作必须明确哪些是已观察事实，哪些是假设。已观察事实是：Meter 有真实融资支持，产品架构能被客户和伙伴理解，
              如果更新周期和供应压力有利于服务驱动替代方案，市场进入动作可能加速。未观察事实才决定私有市场估值标记是否合理：当前收入规模、
              扣除硬件和现场运营后的贡献利润率、单一公司说法之外的队列留存质量，以及伙伴补贴是短期助推器还是永久要求。这种不确定性迫使当前判断离开买入。


              乐观情景存在，但有条件。Meter 需要披露足够的经常性收入规模和单位经济性，才能配得上高端网络倍数，同时证明伙伴主导模型不靠持续补贴也能扩张。
              基准情景更温和：业务真实，采用继续推进，但公开证据始终不足以承销相对当前估值标记的大幅溢价。悲观情景不是产品无关紧要，而是渠道激励、更新义务或股权结构条款
              在新投资人拿到回报前吃掉上行。沿着这些分支，最可辩护的建议是继续研究，信心中等，风险评级高，估值立场偏高。公司可能仍会很好地复合增长， 但当前公开记录还不能让投资人知道这部分上行是否已经计入价格。
