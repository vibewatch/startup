  - id: TV003
    title: 可比估值表
    columns:
      - 可比公司
      - 收入 / 规模信号
      - 企业价值或估值标记
      - 倍数 / 状态
      - 与 Meter 的相关性
      - 局限
    rows:
      - - Cisco
        - $60.75B LTM 收入
        - $490.99B EV；$474.63B 市值
        - 8.08x EV/Sales 倍数
        - 一个已有规模的龙头锚点：网络平台盈利，企业覆盖面广。
        - 成熟度和多元化程度太高，不能直接匹配 Meter 阶段。
      - - Arista
        - $9.71B LTM 收入；$9.006B FY2025 收入
        - $188.45B EV；$200.81B 市值
        - 19.41x EV/Sales；高溢价倍数
        - 高增长网络资产的高端质量倍数，利润率也顶尖。
        - 数据中心和 AI 集中度让它成为 Meter 很难对标的基准。
      - - Extreme Networks
        - $1.25B LTM 收入；$1.14B FY2025 收入
        - $3.49B EV；$3.47B 市值
        - 2.79x EV/Sales 倍数
        - 对于有真实硬件和服务敞口的厂商，它是低利润率公开网络可比对象。
        - 不是纯 NaaS，公开股票波动也更高。
      - - Juniper
        - $5.45B LTM 收入；约 $799.7M FCF
        - $13.35B 最后独立市值
        - 公开市场 / 战略底价参考
        - 展示战略买家如何给网络领域已披露的规模和装机基础定价。
        - 市值数字反映退市时点，不是今天干净的独立交易区间。
      - - Nile
        - $7.5M 估计 2023 ARR
        - $750M 估计 2024 估值；$315M 累计融资
        - ~100x 隐含估值 / 收入
        - 最接近 Meter “as-a-service” 叙事的私有 NaaS 稀缺可比。
        - 收入和私有估值都是估计值，因此可比有参考意义但精度低。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most usable public networking anchors plus the clearest private NaaS comp with disclosed funding and
        estimated valuation. It is not an exhaustive universe because most late-stage private NaaS companies do not
        publish both valuation and operating scale.
    notes: 数值混合了当前市场数据、文件披露和估计的私有估值。各行刻意不统一，因为目标是框出合理估值区间，而不是假装 Meter 有完美可比公司。
