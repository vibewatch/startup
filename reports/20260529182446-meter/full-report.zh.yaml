      - - Ramen
        - 相邻工业 NaaS
        - IDC Innovator；工业和物理 AI 定位
        - 仓库、工厂、远程设施、建筑自动化
        - 面向艰苦环境的 5G/LTE/Wi-Fi、卫星回传和分布式计算
        - 与常规办公室和分支园区更新的可比性较弱
      - - Cisco / Meraki
        - 既有云托管 LAN
        - 庞大装机基础；广泛的云托管 IT 产品组合
        - 以 Cisco 统一园区、分支和 Wi-Fi 资产的企业
        - 覆盖 Wi-Fi、交换、SD-WAN、IoT 和安全感知运维的广度
        - 通常不以单一交钥匙式 LAN 公用事业化合同销售
      - - HPE Aruba / GreenLake
        - 既有 NaaS 赋能方
        - Dell'Oro 口径下覆盖最广的 CNaaS 赋能方
        - 希望按月消费且选择成熟园区厂商的企业
        - 单一月度订阅选项，加上 Aruba Central AI 自动化
        - 通常围绕既有 HPE 生态和伙伴销售动作搭建， 而不是 Meter 式垂直整合替换
      - - Juniper Mist
        - 既有 AI 运维 LAN
        - Dell'Oro 口径公开云托管 WLAN 收入第 2
        - 重视 WLAN 质量和 AIOps 的组织
        - Marvis AI 与支持 Wi-Fi 7 的接入点组合
        - 全交钥匙生命周期负责制的公开证据弱于 Meter 或 Nile
      - - Fortinet
        - 安全网络替代品
        - 全球安全网络和 SASE 产品组合
        - 分支园区，以及由安全团队牵头的基础设施更新
        - 融合安全，加上 SD-WAN 和轻量边缘集成
        - 路径更从安全架构出发，而不是完整 LAN 即服务外包
      - - Palo Alto Networks
        - 安全牵头的替代品
        - 全面的 AI 驱动 Prisma SASE 平台
        - 混合办公员工与零信任分支买方
        - 强安全姿态，以及通过 MSP / 渠道切入分支改造
        - 公开材料中不是完整园区硬件生命周期替换方案
      - - Cloudflare
        - 远程访问与 SASE 替代品
        - 300+ 城市 SASE 覆盖和已发布 TEI 成果
        - 远程用户、分支办公室、云优先安全团队
        - 按统一架构设计的 SASE，部署快，远程访问叙事强
        - 没有公开的硬件包含式园区 NaaS 合同或标价
