      - number: '2.2'
        title: 规模测算视角、重叠和实际承销分母
        blocks:
          - type: paragraph
            body: >-
              公开自上而下证据方向有利，但不能相加。IDC 称，2025 年全球企业 WLAN 市场达到 $10.5 billion；Dell’Oro 称，2026 年本地区域网络市场将明显进入 $30 billion
              区间，公共云托管 LAN 到 2029 年应超过 $12 billion。另一些托管网络服务报告口径更宽：Mordor 把 2026 年市场放在 $18.72 billion，而
              MarketsandMarkets 将 2025 年更宽的托管网络服务类别定为 $120.74 billion，并增长至 2030 年的 $172.04
              billion。这些数字都是有用镜头，但捕捉的是硬件、云软件、外包和安全服务的不同组合。


              正确的承销动作，是把多个镜头同时留在页面上，而不是假装存在一个干净单一的 TAM。Meter 比纯 WLAN 硬件更宽，因为合同包含设计、安装、ISP 管理、监控和生命周期升级。但它也比宽泛托管服务类别更窄，因为
              Meter 仍围绕本地网络栈、自有硬件和站点级部署动作转动。仅医院和学校就能构成大型站点型垂直市场，但公开来源仍没有给出符合 Meter 服务画像的仓库和办公室站点清洗后数量。因此，精准的公开 Meter 专属
              SAM 或 SOM 仍无法有把握地拆出。
