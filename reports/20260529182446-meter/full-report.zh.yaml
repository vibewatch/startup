        - 新数据继续不透明则下调；若分享经审计或董事会级指标则上调。
      - - 风险评级
        - 高
        - 硬件所有权、合作伙伴补贴和后期轮条款风险带来非软件型下行。
        - 只有在贡献利润率和优先股堆叠得到验证后，风险评级才会下调。
      - - 估值立场
        - 偏高
        - $1B 标记或许站得住，但前提是收入和利润率假设有利，而这些假设尚未公开。
        - 若披露指标把 Meter 放进中高端可比组，立场可转为合理。
      - - 决策含义
        - 继续监测，不要仅凭公开数据为当前估值标记背书
        - 尽调瓶颈是证据质量，不是产品是否存在。
        - 只有通过数据室尽调流程，或在入场价明显更好时才推进。
    notes: 本表将章节证据转成投委会决策。它刻意对价格敏感：问题不在 Meter 是否真实，而在当前估值标记是否有公开经济性支撑。
