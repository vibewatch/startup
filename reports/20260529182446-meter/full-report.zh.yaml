      - number: '8.4'
        title: 退出准备度在经济账和条款尽调完成前仍属暂定
        blocks:
          - type: paragraph
            body: >-
              公开市场和战略退出证据表明，网络资产仍能获得有意义价值，但前提是买方能清楚看到规模和利润率画像。HPE 收购 Juniper 之所以重要， 不是因为 Meter
              今天可以直接对标，而是因为它展示了买方仍愿意付钱的资产类型：披露收入、自由现金流、安装基础和明确战略相关性的业务。Meter 有战略相关性，但没有同等披露质量。这意味着退出准备度仍是暂定的。战略买方可能在意
              Meter 的架构、伙伴足迹或垂直整合故事；但没有关于收入质量和股权结构优先级的干净证据， 外部人无法仅凭公开信息搭出可靠的下行底。


              因此，最终尽调清单很短，但没有余地。投资人承销当前价格前，需要当前收入与 ARR 桥接、毛利率和贡献利润率披露、渠道基金单位经济性、 真实合同期限和流失分布、客户集中度，以及实际 Series C
              优先股堆叠。推翻投资逻辑的触发器也必须保持明确。如果披露经济账显示，硬件所有权和迁移补贴正在吃掉大部分毛利，
              或者股权结构把下一轮变成保护优先权的操作，当前估值标记就可能不再像增长投资，而更像后期风险转移。在这些问题得到回答之前，Meter 是一个有吸引力的尽调候选，而不是已经过关的投资建议。
            claimRefs:
