  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁购买、谁付款、谁使用 Meter
        blocks:
          - type: paragraph
            body: >-
              Meter 的公开客户证据最强的场景，是一个小型内部 IT 团队、设施负责人或技术领导者，需要在不招聘更大网络团队的情况下，让办公室、园区或仓库网络「直接可用」。可观察样本里的买方通常是 IT
              负责人、CTO、技术总监、IT 经理或运营负责人；用户则是他们背后的更广环境：办公室员工、校园师生、仓库机器人和扫描器，或支持负担较重的 SaaS 团队。付款方看起来是组织本身，通过订阅或 OpEx
              模型付款，而不是终端用户或打包消费者服务。这很重要，因为 Meter
              不是卖给电信采购方，也不是卖给想深度调优多供应商环境的开发者优先网络工程师。它赢在客户重视一个负责到底的供应商、可预测月度定价和更少内部交接的场景。本章唯一明确的伙伴辅助证据——Keys School 与
              Knowing Technologies——也显示，Meter 可以嵌入受信任 MSP 关系，而不必坚持账户只能直销拥有。
