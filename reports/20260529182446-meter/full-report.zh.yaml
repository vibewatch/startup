          tone: positive
        - label: 扩张或转介绍
          detail: 新办公室、第二站点或合作伙伴推荐带来下一轮动作。
          tone: opportunity
    claimRefs:
      - CU004
      - CU005
      - CU026
      - CU031
      - CU038
  - id: FU002
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: Meter 的具名证据在运营结果上最强，在独立留存证据上最弱。
    data:
      columns:
        - 结果证明
        - 运营关键性
        - 复购 / 扩张信号
        - 独立证据深度
      rows:
        - label: GoBolt
          values:
            - value: High
              detail: 零计划外停机；扫描器掉线问题消失
              tone: positive
            - value: High
              detail: 13 个仓库和机器人 / 扫描器工作流
              tone: positive
            - value: Medium
              detail: 大规模上线证明深度，但没有公开续约数据
              tone: warning
            - value: Low
              detail: 证据仍来自 Meter 撰写的案例研究
              tone: risk
        - label: Webb School
          values:
            - value: High
              detail: 现场活动直播和 mDNS 改善
              tone: positive
            - value: High
              detail: 100 英亩校园、12 栋建筑
              tone: positive
            - value: Medium
              detail: 学校场景暗示多年黏性，但未披露续约
              tone: warning
            - value: Low
              detail: Meter 材料之外没有独立校园背书
              tone: risk
        - label: Strava
          values:
            - value: Medium
              detail: 快速排障和上线速度
              tone: positive
            - value: Medium
              detail: 全球办公室足迹，但不是仓库或校园复杂度
              tone: warning
            - value: High
              detail: 明确提到未来办公室
              tone: positive
            - value: Low
              detail: 结果深度来自一篇官方案例
              tone: risk
        - label: Keys + MSP
          values:
            - value: Medium
              detail: 主动支持和超额配置覆盖
              tone: positive
            - value: Medium
              detail: 两个校区、400+ 台设备
              tone: warning
            - value: High
              detail: MSP 牵头的相邻扩张有直接证据
              tone: positive
            - value: Low
              detail: Meter 与合作伙伴共同撰写证据
              tone: risk
        - label: LatchBio
          values:
            - value: Medium
              detail: 项目化管理办公室搬迁，服务仍然保留
              tone: positive
            - value: Low
              detail: 单一办公室环境
              tone: warning
            - value: High
              detail: 明确的重复部署 / 留存信号
              tone: positive
            - value: Low
              detail: 没有独立评论或续约指标
              tone: risk
    claimRefs:
      - CU013
      - CU015
      - CU017
      - CU024
      - CU030
      - CU031
      - CU035
  - id: FU003
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 可见的扩张循环从被迫更新开始，经过生产环境验证，走向合作伙伴牵头或重复站点增长。
    data:
      nodes:
        - id: pain
          label: 换代痛点
        - id: evaluate
          label: Meter 评估
        - id: launch
          label: 生产上线
        - id: operate
          label: 主动运营
        - id: repeat
          label: 重复站点 / 搬迁
        - id: partner
          label: 合作伙伴转介绍
      edges:
        - from: pain
          to: evaluate
          label: 成本、故障、续约或搬迁
        - from: evaluate
          to: launch
          label: 单一供应商 + 月费模式
        - from: launch
          to: operate
          label: 24/7 监控和支持
        - from: operate
          to: repeat
          label: 未来办公室或校区复用
        - from: operate
          to: partner
          label: MSP / 渠道推荐
        - from: partner
          to: evaluate
          label: 迁移激励
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU031
      - CU038
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 剩余风险集中在合同 / 监管不对称、渠道和集中度敞口，以及共模运营故障。
    claimRefs:
      - CR004
      - CR011
      - CR016
      - CR024
      - CR031
      - CR037
      - CR043
      - CR050
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - 硬件认证未达标
            - 重大电信 / 隐私执法；共模平台缺陷
            - 客户集中度到尽调才暴露；资本效率失灵
        - label: 高影响
          values:
            - API 密钥滥用事件
            - 底层 ISP 中断；支持表现不达标；合作伙伴基金表现不佳
            - 单一供应商锁定效应在服务失望后放大流失
        - label: 中等影响
          values:
            - Lumen / 集成延误
            - 管理层精力紧张；劳动力和物流中断
            - 免费升级经济性挤压利润率
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: Meter 的主要下行路径不是单一孤岛失效，而是在一体化栈内传导。
    claimRefs:
      - CR007
      - CR016
      - CR020
      - CR028
      - CR037
      - CR040
      - CR050
    data:
      nodes:
        - id: n1
          label: 合同 / 监管事件
          detail: FCC / 隐私调查，或补救结构薄弱
        - id: n2
          label: 平台退化
          detail: 统一固件或自动化失效
        - id: n3
          label: 运营商中断
          detail: 底层 ISP 或接入问题
        - id: n4
          label: 合作伙伴基金表现不佳
          detail: 补贴未能转化为持久 ARR
        - id: n5
          label: 供应链冲击
          detail: 组件、劳动力或物流瓶颈
        - id: n6
          label: 服务事故 / 延误
          detail: 故障、安装延误或支持降级
        - id: n7
          label: 流失 / 预订放缓
          detail: 客户信任或渠道速度下降
        - id: n8
          label: 利润率压缩
          detail: 换代、补贴或支持成本超出计划
        - id: n9
          label: 融资重估
          detail: 需要重新审视增长和烧钱
        - id: n10
          label: 估值减损
          detail: 价格纪律收紧，或交易停摆
      edges:
        - from: n1
          to: n6
        - from: n1
          to: n9
        - from: n2
          to: n6
        - from: n2
          to: n7
        - from: n3
          to: n6
        - from: n3
          to: n7
        - from: n4
          to: n7
        - from: n4
          to: n8
        - from: n5
          to: n6
        - from: n5
          to: n8
        - from: n6
          to: n7
        - from: n6
          to: n8
        - from: n7
          to: n9
        - from: n8
          to: n9
        - from: n9
          to: n10
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: Meter 的商业承诺依赖一张密集外部网络：合作伙伴、运营商、客户、监管方和供应商都在其中。
    claimRefs:
      - CR024
      - CR028
      - CR029
      - CR030
      - CR034
      - CR040
      - CR050
    data:
      nodes:
        - id: d1
          label: Meter 运营
          detail: 集中支持、自动化和服务交付
        - id: d2
          label: 制造 / 硬件
          detail: 自研设备和更新义务
        - id: d3
          label: 合作伙伴渠道
          detail: 主要销售和迁移动作
        - id: d4
          label: 底层 ISP
          detail: 线路交付和可用性底座
        - id: d5
          label: 关键客户
          detail: 收入耐久性和背书质量
        - id: d6
          label: FCC / 隐私制度
          detail: 连接和数据处理监管
        - id: d7
          label: 支持组织
          detail: 24/7 执行和 SLA 可信度
        - id: d8
          label: 资本提供方
          detail: 对更新和补贴负担的资金容忍度
      edges:
        - from: d2
          to: d1
        - from: d3
          to: d1
        - from: d4
          to: d1
        - from: d5
          to: d1
        - from: d6
          to: d1
        - from: d7
          to: d1
        - from: d8
          to: d1
        - from: d1
          to: d5
        - from: d3
          to: d5
        - from: d4
          to: d5
        - from: d2
          to: d8
        - from: d5
          to: d8
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议取决于真实公司证据能否补上仍缺失的估值桥。
    data:
      nodes:
        - id: n1
          label: 真实融资和产品证明
          detail: Series C、一体化栈和可见的合作伙伴兴趣，让 Meter 原则上具备可投性。
        - id: n2
          label: 渠道和定价证据
          detail: 经常性服务定价和 $100M 合作伙伴基金，说明公司如何加速采用。
        - id: n3
          label: 经济性披露缺口
          detail: 收入、ARR、毛利率、NRR 和优先权条款仍未进入公开记录。
        - id: n4
          label: 可比公司区间很宽
          detail: 网络资产交易倍数从低个位数到十几倍收入都有。
        - id: n5
          label: 当前判断：继续研究
          detail: 公开证据支持继续尽调，还不足以在当前估值上直接买入。
      edges:
        - from: n1
          to: n2
          label: 质量确实存在
        - from: n2
          to: n3
          label: 价格仍取决于经济性
        - from: n3
          to: n4
          label: 估值桥还搭不起来
        - from: n4
          to: n5
          label: 保持纪律
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV013
      - CV036
      - CV041
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 同一个 $1B 估值对应的所需收入差异巨大，取决于最终适配 Meter 的可比倍数。
    data:
      items:
        - label: 类似 Nile 的稀缺性倍数
          value: 10
          detail: 按约 100x 估值 / 收入推算的所需收入
          tone: positive
        - label: 类似 Arista 的溢价倍数
          value: 52
          detail: 按 19.41x EV/Sales 推算的所需收入
          tone: positive
        - label: 类似 Cisco 的规模化龙头倍数
          value: 124
          detail: 按 8.08x EV/Sales 推算的所需收入
          tone: warning
        - label: 类似 Extreme 的低利润率倍数
          value: 358
          detail: 按 2.79x EV/Sales 推算的所需收入
          tone: negative
    approximationNotes: 柱状条显示在各个可比倍数下支撑 $1B 估值所需的收入。它们并不声称 Meter 当前收入。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间很宽，因为缺失的经济性决定当前估值是地板、中点，还是已经偏乐观。
    data:
      items:
        - label: 悲观情景
          low: 400
          mid: 600
          high: 900
          note: 经济性证明低于预期；下轮降价融资或被迫战略交易开始需要纳入考虑。
        - label: 基准情景
          low: 900
          mid: 1200
          high: 1600
          note: 业务质量真实，但公开数据只支撑当前估值之上的有限上行。
        - label: 乐观情景
          low: 1800
          mid: 2200
          high: 3000
          note: Meter 证明经常性规模和利润率质量足够强，能撑住溢价倍数。
    approximationNotes: 数值单位为百万美元，代表显式假设下的情景端点，而不是当前观察到的公允价值。
    claimRefs:
      - CV041
      - CV042
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 公司在相关性和存活证明上得分较高，但在经济性证据和价格支撑上较弱。
    data:
      items:
        - label: 市场相关性
          value: 4/5
          detail: 企业仍在寻找更简单、按运营支出消耗的网络服务模式。
          tone: positive
        - label: 产品 / 架构证明
          value: 4/5
          detail: 一体化栈和客户背书可信。
          tone: positive
        - label: GTM 证明
          value: 3/5
          detail: 渠道动作可见，但补贴强度未解决。
          tone: warning
        - label: 经济性证据
          value: 1/5
          detail: 收入、利润率、NRR 和回本周期仍未公开披露。
          tone: negative
        - label: 估值支撑
          value: 1/5
          detail: 今天还无法把 $1B 估值有把握地放进公开可比公司区间。
          tone: negative
        - label: 证据质量
          value: 2/5
          detail: 足够继续尽调，但不足以通过投委会。
          tone: warning
    approximationNotes: 评分是作者基于章节证据集给出的判断，目标是有纪律的综合，而不是机械模型。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
