  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 重要性
      - 改变判断的因素
    rows:
      - - Meter 有真实资本支持，并由顶级投资人领投 $170M Series C
        - 投资逻辑
        - 大额后续融资降低短期融资风险，也验证市场兴趣。
        - 如果这一轮包含公开不可见的重结构或优先权保护，积极意义会打折。
      - - 产品是一套连贯的全栈服务，不是套在第三方盒子上的融资包装
        - 投资逻辑
        - 清晰的运营模式可以支撑更粘的合同和更简洁的合作伙伴叙事。
        - 如果客户部署仍依赖碎片化第三方流程，判断会变弱。
      - - 渠道合作伙伴公开愿意把更新活动和预算转向 Meter
        - 投资逻辑
        - 合作伙伴热情是最清晰的公开信号，说明 GTM 可能越过创始人直销继续放大。
        - 需要真实回本数据和续约质量，才能证明它不只是补贴催出的热情。
      - - 公开记录仍缺收入、ARR、毛利率、NRR 和 CAC / 回本周期
        - 反向逻辑
        - 没有这些指标，$1B 标记无法可靠落到任何可比区间。
        - 披露董事会级 KPI 后，估值讨论才有抓手。
      - - Meter 自己承担硬件、安装和更新义务
        - 反向逻辑
        - 这种模式可以创造耐久收入，但也会让错误变贵。
        - 按队列证明贡献利润率和现金转化表现。
      - - 独立评论已经指出，一旦经济性不及预期，公司可能很脆弱
        - 反向逻辑
        - 风险不是需求不足，而是模式可能先显得优雅，之后才暴露不赚钱。
        - 有盈利性续约和克制使用补贴的独立证据，才能削弱这一担忧。
    notes: 这些行把已观察到的优势，与足以改变建议的具体尽调事项一一配对。反向逻辑刻意聚焦经济性，而非技术。
    claimRefs:
