        - 重视安全 NaaS 成果的中大型企业
        - 全硬件包含、零信任网络架构、自治运维、财务背书保障
        - 公开证据高度依赖服务成果；开放硬件灵活性的证据较少
      - - Join Digital
        - 偏开放硬件的直接同业
        - 数百家 Fortune 1000 与中端市场企业
        - 商业地产、高科技、金融服务、分布式办公室
