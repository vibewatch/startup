  - id: TR005
    title: 缓解措施与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管 / 合规偏离
        - 重大调查、同意令，或独立安全保证失效
        - 任何 FCC / 隐私执法行动，或无法维持 SOC 2 / 等效证据
        - 暂停投资评估或重新定价，直到律师确认范围和整改成本
      - - 服务可靠性不足
        - 严重事故反复出现，或补救机制薄弱
        - Sev-1 故障反复、明显的公开投诉模式，或未披露真实 SLA 赔付
        - 视为投资逻辑受损，因为合同追索空间看起来已经封顶
      - - 客户集中度
        - 最大客户或前五大客户敞口超过标准软件红线
        - 任一单一客户 >10% ARR，或前五大 >30-40% 且缺少长期合同覆盖
        - 若多元化和留存证据不强，倾向回避
      - - 合作伙伴资金依赖
        - 增长依赖补贴迁移，但看不到回本
        - 管理层无法证明合作伙伴资金的赢单率、回本周期或毛利率纪律
        - 将其视为资本效率障碍，而不是 GTM 优势
      - - 供应商与部署脆弱性
        - 没有成文的多元化供应或交付周期韧性
        - 关键 SKU 缺少备选来源、现场更换周期明显拉长，或认证延误
        - 在证据出现前，假设毛利和订单都会波动
      - - 财务不透明
        - 尽调后核心经济性仍未披露
        - 缺少可信的 ARR、毛利率、烧钱速度或更新义务视图
        - 在投委会前停止；这是尽调阻断项，不是能写进材料里的保留意见
    notes: 这些否决标准刻意设计成可由尽调和公开跟进监测，而不是依赖私下的虚荣指标。
