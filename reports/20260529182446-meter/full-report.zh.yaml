      - number: '1.2'
        title: 创始人、治理和组织依赖
        blocks:
          - type: paragraph
            body: >
              Meter 由兄弟 Anil Varanasi 和 Sunil Varanasi 创立；两人仍是公开可见度最高的运营领导者，Anil 任 CEO，Sunil 任
              CTO。创始人的长访谈和公司材料强调长期运营哲学、偏好自建而非采购，以及围绕「善意但有野心」招聘构建的强创始人文化。更广义治理的公开证据较少。已审阅材料中最清楚的董事会数据点，是 Sequoia 合伙人 Ravi
              Gupta 在 2022 年 Series B 时加入董事会。Meter 的招聘页面也显示，公司运营系统与 San Francisco 设施高度绑定，办公室、配送和质量工程集中在一起。

              这对一家硬件加运营公司可以是优势，但也意味着创始人和单一总部周围存在明显关键人物与运营集中度。重要的是，已审阅的公开投资者披露并不支持用户提出的 Andreessen Horowitz 或 NEA
              为投资方的判断；已披露股权结构表名称集中在 General Catalyst、Sequoia、Microsoft、Tishman Speyer、WndrCo、Baillie Gifford、J.P. Morgan
              和知名天使投资人。
