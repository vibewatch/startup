    title: 护城河耐久性 / 竞争风险清单
    columns:
      - Meter 护城河主张
      - 竞争威胁
      - 严重程度
      - 威胁为何重要
      - 当前公开反证 / 尽调请求
    rows:
      - - 垂直整合简化采购与运营
        - Nile 争的是同一种全托管结果，公开服务与合同证据更强
        - 高
        - 如果买家更信任 Nile 的交付，直接同业就能削弱 Meter 的便利性叙事
        - 需要 Meter 与 Nile 服务质量的赢单 / 输单、SLA 赔付和续约对比数据
      - - 自研栈制造客户锁定
        - Join 将开放标准硬件和智能体运营包装成灵活性优势
        - 中
        - 担心供应商集中的买家，可能更偏好开放硬件路径，同时仍把运营外包
        - 需要客户证明：Meter 自研硬件在 TCO 和可靠性上为何胜过开放替代方案
      - - 单一合同在部署后抬高切换成本
        - 全面替换启动前，存量厂商就能守住账号
        - 高
        - Cisco、HPE 和 Juniper 可以在既有资产内满足足够多的需求，让客户避开一站式替换项目
        - 需要按存量厂商环境和交易阶段拆分的 Meter 替换模式
      - - 安全能力可打包进 Meter 栈
        - Fortinet、Palo Alto 和 Cloudflare 无需替换整套 LAN，也能赢下安全主导或分支主导项目
        - 高
        - 预算负责人可能选择安全优先的替代方案，更快解决访问与策略痛点
        - 需要按网络主导 / 安全主导机会和竞争者类别拆分管道
      - - 自有硬件和运营可守住毛利与性能
        - 自有硬件也把路线图、供应和支持风险集中到一家供应商
        - 中
        - 硬件或支持一旦出问题，客户很难只替换其中一层
        - 需要硬件刷新节奏、供应商集中度和现场故障数据
      - - 同类初创公司正在获得品类能见度
        - 初创公司仍小于存量巨头，扩张也从较窄安装基数出发
        - 中
        - 市场能见度不等于持久份额或经营杠杆
        - 将护城河视为成熟前，需要队列 ARR、站点数和续约基准
    notes: 风险清单聚焦公开的竞争耐久性证据，而不是未披露的内部指标；每个高严重度事项都对应一条具体尽调请求。
