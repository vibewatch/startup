      - number: '6.4'
        title: 集中度和客户侧风险仍是未解的尽调问题
        blocks:
          - type: paragraph
            body: >-
              核心承销缺口不是 Meter 有没有客户，而是投资人能否看到足够多的客户基础，从而判断集中度、满意度独立性和切换风险。 本章抓取到的来源都没有公布客户数、头部客户暴露、垂直行业 ARR 结构、NRR、GRR
              或合同期限。可观察的组合也偏向 风险投资支持的办公室、学校和仓库；这有助于证明产品能跑，但不能证明收入到底有多分散。独立证据也比推荐语集合看起来更薄： PeerSpot 没有收集到评论，正面参考深度则集中在
              Meter 自写案例和策展式评论集合里。最后，一般性的 NaaS 风险仍然适用。独立 NaaS 分析提醒买方关注供应商依赖、退出条款、SLA 条款和对提供商履约的依赖。Meter 的承诺是一种
              垂直整合、单一提供商关系，因此这项风险并不抽象。客户叙事在产品化简洁性上很强，但在集中度、续约经济性和切换摩擦上仍披露不足。
