  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Meter 应被界定为以经常性服务交付的全栈本地企业网络基础设施，而不是所有网络硬件、电信或托管 IT 支出的代理。Meter 的网络、定价、部署和客户页面都说明，公司把 ISP
              采购、路由、交换、无线、安全、监控、安装、支持和硬件更新打包进一份按面积计价的月度合同。因此，纳入支出比单买接入点或交换机更宽，但仍窄于整个托管服务宇宙，因为 Meter
              重点仍在本地网络栈，以及部署和维护它所需的运营。


              排除逻辑和纳入逻辑同样重要。消费者网络、终端用户设备、无关网络安全产品，以及未通过 Meter 管理的广域运营商支出，都不应计入实际市场边界。主要替代方案是一套碎片化栈：多个
              ISP、分离的硬件供应商、独立安装商，以及内部 IT 或 MSP 团队把网络缝起来。Meter 可见的目标环境——办公室、仓库、学校和其他多站点商业空间——契合这种框架。因此，最合适的市场描述是企业
              LAN/WLAN 加上相邻的部署和生命周期服务，卖给想减少供应商、降低运营救火、让支出更可预测的买方。
