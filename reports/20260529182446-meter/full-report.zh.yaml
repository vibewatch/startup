      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 继续研究是价格判断，不是产品否定
            body: Meter 已经跨过了投资人应该关注的门槛。缺的不是公司是否存在，也不是客户和伙伴是否认真看待它。缺的是当前估值标记是否已经计入公开记录仍未展示的经济账。
            calloutType: recommendation
            claimRefs:
              - CV037
              - CV041
              - CV042
              - CV045
          - type: callout
            title: 渠道热情不能替代回本数学
            body: 公开伙伴引述令人鼓舞，但还没有回答核心承销问题：Meter 为赢得并迁移每个客户花了多少钱，这笔支出多快能收回。在数学披露之前，GTM 动能应被视为方向性信号，而不是决定性证据。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV038
              - CV044
          - type: callout
            title: 乐观上行需要高倍数业务，不只是高溢价故事
            body: 只有 Meter 能证明其经常性收入质量和利润率结构足以靠近网络可比区间顶部，上行情景才成立。没有这项证明，当前估值仍可能是天花板，而不是入场点。
            calloutType: assumption
            claimRefs:
