      - number: '5.2'
        title: 架构、控制平面和 Command
        blocks:
          - type: paragraph
            body: >-
              Meter 的架构差异化来自把控制、遥测和硬件行为压进单一运营模型。公开材料反复描述一个网络操作系统、一个云端事实源、跨设备一致固件，以及数字孪生或期望状态工作流，让 Meter 不需要逐盒 CLI
              操作，也能暂存、验证并下发配置。Dashboard 把这一控制平面暴露到拓扑、VLAN、路由、防火墙、VPN、DNS 安全、日志和多站点视图；GraphQL API 则让客户以编程方式进入同一环境。Meter
              Command 是这套栈上的最新一层。手册和发布文章描述了一个规划—执行—综合三阶段流水线：拉取实时数据，编写自定义仪表板或配置表单，并在状态改变操作前要求用户确认。Network World、theCUBE
              Research、Tech Field Day 和 SiliconANGLE 的第三方报道大体印证了同一图景：Meter 不是把聊天机器人套在松散设备 API 上，而是在纵向整合后端之上构建 AI
              辅助界面。这让架构比传统替代方案更连贯，同时也把平台风险集中到 Meter 自己的软件质量和模型纪律上。
