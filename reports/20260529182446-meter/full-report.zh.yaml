      - number: '7.3'
        title: 渠道、ISP 和客户集中是核心商业风险
        blocks:
          - type: paragraph
            body: >-
              核心商业风险是渠道、运营商和客户三层的依赖集中。Meter 称自己 100% 走渠道且没有直销团队；CRN 关于 $100 million
              伙伴基金的报道显示，赋能、迁移、硬件回购和概念验证经济账不是边缘战术，而是增长引擎的一部分。客户希望用月费替代资本开支时，
              这会加速采用；但这也意味着市场进入耐久性取决于伙伴生产力，也取决于补贴能否转化为耐久的经常性毛利。公司的公开材料没有披露 伙伴基金回本数学、亏损分担，或成交所需支持金额的上限。


              运营商依赖同样嵌在服务承诺里。Meter 营销的是单一供应商体验，但其透明度和运营页面说明，性能仍取决于底层 ISP、接入技术和外部线路。 Lumen 集成改善了工作流可见性，但 Meter
              并不拥有带宽。需求侧，公开材料仍未披露客户数、头部客户占比、NRR 或合同期限。这让投资人无法判断收入是否分散， 也无法判断少数参考账户或伙伴关系是否主导模型。因此，L40 的集中度指引，以及 NPI 和
              Federal Reserve 的供应商风险指引，都直接相关： 一旦供应商变成关键基础设施，弱退出选项和隐藏集中度的重要性会远高于外围软件工具。
