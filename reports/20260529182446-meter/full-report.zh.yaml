      - number: '4.4'
        title: 财务结论和承销阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论是：收入质量方向上积极，利润率路径方向上未解。Meter 有真实的经常性收入设计：产品作为持续打包服务销售，客户避免前期
              capex，伙伴计划强化可重复的经常性合同，而不是一次性硬件项目。但同一套打包也把大量成本和时点风险推回 Meter。硬件所有权、升级、回购、安装劳动力、主动支持和伙伴激励，都要在合同成熟前先被资金覆盖。WWT
              2025 年 NaaS 报告是有用的警示镜头，因为它追问该类别是变革现实还是营销噱头，并用消费式 opex 指标而非设备主导定价来定义真正的 NaaS。这并不否定 Meter
              模型，但意味着管理层分享队列级合同经济性和当前现金桥之前，投资者应把任何关于毛利率扩张、CAC
              回本周期、流失、净收入留存或现金跑道的假设都视为无支撑。承销因此应锚定订阅模型强度，但在利润率和融资充足性的信心上打折。
