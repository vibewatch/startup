chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >
              Meter 把自己定位为纵向整合的企业网络公司，而不是第三方盒子的转售商。公司称，2015 年创办时的目标，是让企业互联网、网络、Wi-Fi 和蜂窝连接像公用事业一样运转；当前总部位于 San Francisco
              的 Mission District，地址为 570 York Street。无论首页、关于页面、FAQ 还是产品文档，Meter 都反复描述同一套栈：硬件、固件、软件、部署运营、支持和 ISP 采购连在一起。

              这个叙事重要，因为它改变了运营和财务负担由谁承担：客户不需要预先购买硬件，Meter 则在经常性服务合同下承担部署、生命周期和升级责任。产品适用于办公室、仓库、园区和数据中心，支撑了一个判断：Meter 不只是
              Wi-Fi 覆盖层供应商，而是更完整的网络基础设施平台。

              截至本次报告日期，Meter 仍主要服务美国客户；美国以外机会通过直接询问处理，更广的地域扩张则靠渠道伙伴推进。
