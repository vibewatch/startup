        - 按队列提供安装收入、分包支出和返工成本
      - - 销售效率 / CAC 回本
        - null
        - 低
        - 缺少回本数据时，合作伙伴返利和直销扩张会扭曲增长质量
        - 提供直销与合作伙伴渠道的 CAC、回本周期、赢率和销售周期数据
