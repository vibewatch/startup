  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 现有工作流痛点
      - Meter 工作流
      - 公开可见收益
      - 限制或风险
    rows:
      - - 新站点上线
        - 传统采购、设计、安装和 ISP 协调横跨多家供应商
        - Meter 负责调研、规划、设计、设备规划、安装、验证和持续管理
        - 部署按周完成，不拖成数月，且只有一个责任方
        - 客户执行仍依赖 Meter 运营和伙伴排期
      - - 跨地点复制标准网络配置
        - 配置漂移和逐设备修改拖慢扩张
        - 数字孪生和模板化拓扑在各站点复制设置
        - 上线更快，手工预配置更少
        - 模板出错时，期望状态错误可能大范围扩散
      - - 排查线上事故
        - 团队在仪表盘、CLI 和支持队列之间来回切换
        - 仪表盘、支持遥测和 Command 汇总数据与操作
        - 声称可更快分诊并提供主动支持
        - 独立 MTTR 基准的公开证据有限
      - - 保护浏览并执行策略
        - 独立 DNS 或 SWG 工具增加复杂度
        - 由 Cloudflare 支撑的 DNS 安全策略在 Meter 内管理
        - 同一技术栈提供细粒度类别和应用过滤
        - 安全效果部分取决于 Cloudflare 集成范围
      - - 改善室内蜂窝覆盖
        - DAS 项目慢、贵，运营负担重
        - Meter 安装接入以太网的中立主机蜂窝 AP，并负责运营
        - 按周推出，并与网络产品共用技术栈
        - 运营商合作和本地条件限制性能
      - - 一起采购 LAN 和 WAN
        - WAN 采购和 LAN 部署分散在不同系统
        - Lumen 指标和采购流入 Meter Connect，路线图还要接入 Command
        - 协调成本更低，可见性统一
        - WAN 深度由伙伴主导，不是 Meter 原生掌控
    notes: 这些工作流条目强调 Meter 产品、运营、伙伴和客户材料明确描述的用户任务，而非假设用例。
