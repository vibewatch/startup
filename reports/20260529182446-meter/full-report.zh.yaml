      - number: '3.4'
        title: 定价可见度、分销力量和切换成本
        blocks:
          - type: paragraph
            body: >-
              Meter 的定价在公开材料中异常清楚。公司称按面积收费、按月计费，并把支持、维护和硬件更新打包进费率。这比大多数替代方案提供了更干净的公开比较点。Nile
              明确传达硬件已包含、购买基于结果，但公开页面没有给出价目表。Join 描述服务包和 SLA，但没有公开费率表。HPE GreenLake
              称网络可以作为单一月度订阅消费，但仍把买方导向顾问式流程。Cloudflare 定价页面是替代不匹配最清楚的例子：它确认存在 Cloudflare One 打包，但让买方联系销售，而不是展示包含硬件的园区 LAN
              价格。


              因此，分销和切换与标价同样重要。传统厂商仍拥有最广的客户资产、渠道和相邻产品；当买方已经运行 Cisco、HPE Aruba、Juniper、Fortinet 或 Palo Alto
              时，它们很难被挤掉。创业公司也在用渠道回应——CRN 提到 Join 通过伙伴销售，Meter 正在建立经常性收入伙伴模型——但其市场路径仍在追赶。与此同时，生命周期所有权本身会成为切换成本引擎。一旦买方把
              ISP 采购、站点设计、安装、硬件更新、策略控制和第二天故障处理交给一家交钥匙供应商，替换决策就远不只是更换接入点或安全软件。
