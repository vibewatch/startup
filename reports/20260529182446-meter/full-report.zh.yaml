    type: stack
    layout: wide
    summary: Meter 的公开架构是一套堆叠式控制模型：界面、控制逻辑、统一 NOS 和自研硬件紧密耦合，再通过外部伙伴向外延伸。
    data:
      layers:
        - label: 用户 + 管理界面
          detail: 运营人员通过控制台、Command、告警和共享多站点视图交互。
          modules:
            - 控制台
            - Command
            - 告警
            - 多站点视图
        - label: 程序化 + 工作流层
          detail: API 和工作流服务开放集成、工单和自动生成看板。
          modules:
            - GraphQL API
            - 集成
            - 支持工单
            - 共享画布看板
        - label: 控制 + 策略层
          detail: 期望状态、数字孪生逻辑和安全策略编排配置变更。
          modules:
            - 期望状态配置
            - 数字孪生
            - RBAC
            - DNS 策略
            - VPN 策略
        - label: 网络操作层
          detail: 统一 NOS 和遥测服务把全栈行为标准化。
          modules:
            - 统一 NOS
            - 遥测管线
            - 无线控制
            - 交换控制
            - 防火墙服务
        - label: 硬件 + 边缘层
          detail: 自研 AP、交换机、防火墙和网关承载网络的物理层。
          modules:
            - A-Series AP
            - S-Series 交换机
            - F-Series 防火墙
            - G-Series / 蜂窝网关
        - label: 外部依赖层
