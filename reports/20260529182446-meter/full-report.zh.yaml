      - number: '3.3'
        title: 传统厂商和替代栈仍会塑造购买决策
        blocks:
          - type: paragraph
            body: >-
              即便 Meter 赢下直接创业公司比较，更大的竞争重力仍属于传统厂商。Cisco/Meraki、HPE Aruba 和 Juniper Mist 都有宽广的园区 LAN 组合、成熟的云管理，以及越来越激进的 AI
              运营叙事。Meraki 覆盖 Wi-Fi、交换、SD-WAN、IoT 和设备管理。Cisco 的无线平台面向办公室、医院、工厂和体育场；HPE GreenLake 明确把网络作为月度订阅销售，Aruba
              Central 则强调跨分支、园区、数据中心和 IoT 的 AI 原生自动化。Marvis AI 和 Juniper 接入点组合进一步说明，Juniper 卖的不只是硬件，也卖自主运营和 Wi-Fi 7
              就绪能力。Dell’Oro 观察到 HPE 拥有最宽的赋能型组合，Juniper 已升至公共云托管 WLAN 收入第二，这凸显传统厂商规模仍有多重要。


              另一类威胁来自安全主导的替代品，而非对等的园区 NaaS。Fortinet、Palo Alto Networks 和 Cloudflare 都在营销融合网络与安全体验，可以在不替换整个企业 LAN
              所有权模型的情况下解决买方问题。FortiSASE 结合 SD-WAN 和 SSE，并延伸到轻边缘与 WLAN/LAN 集成；Palo Alto 推销混合办公和零信任分支转型；Cloudflare One
              销售一套统一设计的 SASE 平台，可在数小时而非数月内跨 300 多个城市部署。这些供应商不是 Meter
              的直接克隆，但当决策起点是安全、分支接入或远程用户现代化，而不是全生命周期园区替换时，它们就是可信替代。
