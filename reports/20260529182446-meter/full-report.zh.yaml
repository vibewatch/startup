  - id: FI004
    title: 资本强度 / 现金流图
    type: matrix
    layout: wide
    summary: 现金流的核心问题不是 Meter 有没有经常性收入，而是为创造并支撑这笔收入，Meter 必须前置投入多少资本。
    data:
      columns:
        - 现金支出时点
        - 公开证据
        - 对利润率 / 现金跑道的潜在影响
        - 核心尽调需求
      rows:
        - label: 硬件所有权与更新换代
          values:
            - 前置且经常性
            - Meter 拥有设备，升级不额外收费
            - 更新节奏激进时，会挤压毛利率和营运资本
            - 披露 BOM、准备金政策和各代产品更新计划
        - label: 安装与上线人力
          values:
            - 前置
            - Premium 包含布线和上线；安装主打快速、交钥匙
            - 部署定价偏低时，回本周期会拉长
            - 披露单站点实施成本和返工率
        - label: 支持与 SLA 交付
          values:
            - 经常性运营开支
            - 24/7 支持和主动监控是核心承诺
            - SLA 质量能提高留存，但会抬高固定支持负担
            - 披露单站点支持成本和自动化率
        - label: 回购抵扣
          values:
            - 前置补贴
            - 上线后，抵扣计入客户账单
            - 更像获客支出，而不是直接收入
            - 披露平均抵扣额和报废回收价值
        - label: 伙伴返利、销售奖励和 MDF
          values:
            - 前置且随需求联动
            - $100M 伙伴基金支持伙伴主导的机会
            - 能加速签约额，但会推迟 CAC 回收
            - 披露已承诺与已支付激励，以及分批客户回本情况
        - label: 租赁 / 融资敞口
          values:
            - 时点未知
            - ASC 842 定位已公开，但债务或违约数据没有公开
            - 可能藏着表外或残值风险
            - 披露租赁组合、违约情况和融资额度
