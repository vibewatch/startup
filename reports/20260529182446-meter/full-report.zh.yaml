  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入规模低于公开可比支撑
        - 数据室收入连按 Cisco 式倍数都难以舒服支撑当前标记
        - 投资判断从增长支撑，变成押希望
        - 不按当前价格投资；只有价格重置或新证据出现后再重看。
      - - 贡献利润率不及预期
        - 硬件、安装、支持和更新义务让合同层面利润所剩有限
        - 全栈模式不再像护城河，反而像内嵌杠杆
        - 下调为回避，除非结构或价格补偿风险。
      - - 合作伙伴资金回本差
        - 补贴和 POC 在正常落地阶段后仍不可或缺，或超过可接受 CAC 回本周期
        - 渠道动能变成昂贵的需求刺激，而不是耐久分销
        - 暂停，直到 CAC / 回本周期和续约数据被分享。
      - - Series C 优先股堆叠沉重
        - 清算优先权、棘轮条款或高级权利拿走基准情景上行的大部分
        - 即使公司执行到位，普通股或新资金回报数学也会恶化
        - 按当前条款，将公司视为结构性吸引力不足。
      - - 独立流失 / 集中度证据不成立
        - 队列流失、客户集中或 SLA 结果明显差于公开叙事
        - 经常性收入逻辑和战略退出逻辑同时变弱
        - 转向回避，或要求低得多的入场价。
    notes: 这些触发项以决策可用为目标。每一项都把一个尽调答案直接连到估值支撑，而不是泛泛的公司质量。
    claimRefs:
      - CV007
      - CV014
      - CV036
      - CV038
      - CV039
      - CV041
      - CV044
      - CV045
      - CV048
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入 / ARR 桥梁
        - 当前收入、ARR，以及按产品和服务划分的收入结构
        - 需要用它把 $1B 标记放到真实可比区间，而不是叙事区间
        - CFO / 财务数据室
      - - 毛利率和贡献利润率
        - 按队列划分的硬件毛利率、部署贡献利润率和支持成本画像
        - 检验全栈服务模式是在复利增长，还是只是把成本前置
        - 财务加运营审查
      - - 渠道经济性
        - 按交易划分的合作伙伴资金使用、CAC、回本周期、POC 转化和补贴递减假设
        - 区分耐久 GTM 杠杆和激励驱动增长
        - CRO / 渠道运营尽调
      - - 股权结构表和优先权
        - Series C 清算优先权、反稀释、按比例认购权和员工期权悬空
        - 即使公司基本面改善，回报数学也可能失效
        - 法律顾问和董事会材料
      - - 合同质量
        - 期限分布、续约率、总留存率和净留存率，以及 SLA 赔付历史
        - 需要用它评估经常性收入说法的耐久性
        - 收入运营和客户成功审计
      - - 客户集中度
        - 最大客户敞口、垂直行业结构和合作伙伴集中度
        - 对下行保护和战略退出可信度很关键
        - CFO 和 GTM 审查
    notes: 本表刻意保持简短，并明确负责人。如果管理层无法提供这些材料，估值讨论应止步于此。
    claimRefs:
      - CV036
      - CV041
      - CV042
      - CV044
      - CV045
      - CV047
      - CV050
figures:
  - id: FO001
    title: Meter 拐点时间线
    type: timeline
    layout: standard
    summary: Meter 的公开历史显示，公司从长期搭建阶段，走向渠道、AI 和合作伙伴驱动的规模化。
    data:
      items:
        - label: 为重建网络而创立
          date: '2015'
          detail: Anil 和 Sunil Varanasi 兄弟在旧金山创办 Meter，投资逻辑是把网络做成公用事业式服务。
          tone: positive
        - label: Series B + 董事会信号
          date: 2022-05
          detail: Sequoia 和 Lachy Groom 支持 $38M 融资，Ravi Gupta 加入董事会。
          tone: positive
        - label: 推出 Command
          date: 2024-08
          detail: Meter 从托管连接延伸到生成式网络运营。
          tone: positive
        - label: 产品 + 合作伙伴放量
          date: 2024-12
          detail: Meter 称已部署面积增加一倍以上，合作伙伴计划已覆盖数百家组织。
          tone: positive
        - label: Series C 与分销阶段
          date: 2025-06
          detail: $170M 融资支持公司转向更大规模的渠道和产品扩张。
          tone: positive
        - label: MeterUp 成为平台展示窗口
          date: 2025-11
          detail: 九个硬件平台、与 Microsoft 相关的渠道动作，以及 Lumen WAN-to-LAN 集成被一起推出。
          tone: positive
        - label: 获认可，但执行仍有保留
          date: 2026-05
          detail: Gartner 认可和 EMEA 发布提升可信度，但分析师仍质疑经济性和 GTM 广度能否放大。
          tone: warning
        - label: 自主网络目标
          date: '2027'
          detail: Meter 的公开路线图瞄准完全自主网络。
          tone: positive
