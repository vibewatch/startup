      - number: '8.2'
        title: 可比估值工作显示，缺失的收入桥接有多关键
        blocks:
          - type: paragraph
            body: >-
              这里的公开可比组有用，不是因为 Meter 应该与任何一家公司完全同倍数交易，而是因为区间很宽，能看出市场到底在为什么买单。Cisco 是有规模的既有厂商，按当前市场数据 EV/Sales 为
              8.08x。Arista 是高端离群值，EV/Sales 约 19.41x，因为投资人在为更好的增长和利润率付钱。 Extreme 约为 2.79x EV/Sales，反映利润画像低得多。Juniper
              退市前最后一个独立公开市场价值约 $13.35 billion，对应约 $5.45 billion 的过去 12 个月收入；HPE
              将这笔收购描述为有吸引力，因为它让网络业务翻倍，并把组合推向利润率更高的增长领域。Nile 则在另一个极端： Sacra 估计其估值约 $750 million，而 ARR 只有约 $7.5
              million；这属于早期稀缺溢价，不是成熟基础设施倍数。


              一旦这些锚点摆出来，Meter 当前披露的问题就很明显。如果公司估值标记约为 $1 billion，保守还是激进取决于当前收入和利润率到底是什么样。 按 Cisco 式倍数，这个标记只意味着约 $124
              million 收入。按 Arista 式倍数，意味着约 $52 million。按 Extreme 式倍数，意味着约 $358
              million。公开证据没有告诉投资人公司处在哪个世界。因此，可比公司测算今天给不出精确公允价值；它给出的是管理层仍需通过的入场纪律测试。
