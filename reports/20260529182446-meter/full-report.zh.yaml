  - id: FP001
    title: 竞争定位图：生命周期掌控与渠道力量
    type: quadrant
    layout: standard
    summary: 主要竞争者的序数图。Meter 和 Nile 在生命周期掌控上最靠右，Cisco、HPE Aruba 和 Juniper 在渠道与装机基础力量上最高。安全牵引型替代方案渠道力量强，但完整园区生命周期掌控较弱。
    data:
      points:
        - label: Meter
          x: 9
          'y': 5
          note: 掌控 ISP、硬件、安装、云端运维和支持，但作为创业公司，GTM 仍在成熟
        - label: Nile
          x: 9
          'y': 5
          note: 在全服务掌控和合同便利性上最接近的直接同业
        - label: Join Digital
          x: 8
          'y': 4
          note: 托管生命周期叠加开放硬件，但聚焦的细分市场更窄
        - label: Ramen
          x: 7
          'y': 3
          note: 在工业场景掌控较多运营环节，但企业分销覆盖更窄
        - label: Cisco / Meraki
          x: 5
          'y': 10
          note: 装机基础和渠道力量很大，但较少公开证据证明其有交钥匙式 LAN 即服务合同
        - label: HPE Aruba / GreenLake
