      - 当前公开状态
      - 差异化
      - 依赖项或尽调缺口
    rows:
      - - Meter Network 核心打包
        - IT / 基础设施团队
        - 上线中的核心产品
        - 单一订阅打包硬件、软件、安全、监控和运营
        - 打包经济性和与第三方设备互操作性披露仍很少
