      - number: '1.3'
        title: 融资历史、投资者图谱和市场路径
        blocks:
          - type: paragraph
            body: >
              Meter 仍是私营公司，财务仍不透明，但融资故事已经清楚。公司官方发布和第三方数据库都指向 2022 年 5 月的 Series B 公告，以及 2025-06-12 由 General Catalyst
              领投、规模大得多的 Series C。第三方融资追踪和行业报道把 Series C 后投后估值放在约 $1 billion，累计融资约 $315 million，让 Meter
              进入独角兽区间；但它仍远小于成熟的上市网络设备龙头。

              更具战略意义的变化不是纯财务，而是商业化：到 2025 年末，Meter 称公司实际上已由渠道主导，95% 业务来自渠道，所有新业务和续约都由渠道伙伴履约，Microsoft 则通过 Azure
              Marketplace 消费承诺成为重要分销路径。Lumen 把 WAN 采购和遥测接到 Meter 的 LAN 与管理层上，进一步扩展商业栈。这意味着 Meter
              下一阶段不再只是证明产品存在，而是要证明高接触、纵向整合的网络模型能通过伙伴实现经济性扩张，同时不丢掉简单性。
