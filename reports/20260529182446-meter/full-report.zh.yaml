  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议背景：真实公司，但仍是未定价的尽调难题
        blocks:
          - type: paragraph
            body: >-
              Meter 已经不再是投机性的产品模型。公司在 2025 年 6 月完成 $170 million Series C 融资，公开引用估值为 $1 billion， 并明显押注渠道优先动作，推出新的 $100
              million 伙伴增长基金。这些事实支撑的不是猎奇交易，而是严肃承销讨论。正面逻辑很直接： Meter
              有一套连贯的全栈故事，把网络按可预测的经常性服务定价，而不是作为资本开支项目；渠道伙伴也公开表示，想把有意义的更新活动迁到这个平台上。 这些足以让人相信公司具备产品市场拉力。


              估值问题更难。公开证据仍未披露 Meter 当前收入、ARR、毛利率、净收入留存率或伙伴基金回本情况。即便最好的公开流失率数据点， 也仍是管理层评论，而不是经独立验证的队列表。这个缺口很重要，因为 Meter
              的模型不是纯软件：它承担硬件义务、安装复杂度和长期服务交付。 IT Europa 的编辑把问题说得很清楚：Meter 可能成为 Uber 式颠覆者，也可能成为 WeWork
              式崩塌，取决于经济账能否跑通。因此，本章结论必须把公司质量和入场价格分开。 公开证据支持继续尽调，而不是在当前估值标记下直接买入。
