        - 披露 Professional 与 Premium 预订额结构，以及各层级平均毛利率
      - - Premium 订阅
        - 经常性合同叠加 Meter 主导的安装和部署推广，包括布线
        - 按地点 / 按平方英尺
        - 公开披露为全服务选项
        - ACV 可能更高，但交付负担也更重
        - 按队列拆分附加率、前期部署成本和实施回本周期
      - - 蜂窝与运营商托管连接
        - 围绕 Meter Cellular 打包蜂窝接入点、运营商合同管理、安装和运营商费用
        - 月度服务费加转付运营商费用
        - 公开作为附加项或相邻服务线营销
        - 可能提高钱包份额，但毛利结构未披露
        - 披露渗透率、贡献毛利率，以及运营商费用是转付还是加价
      - - 回购抵扣
        - 替换旧硬件后，上线之后抵扣客户账单
        - 账单抵扣 / 迁移激励
        - 公开披露为采用助推，而非独立收入流
        - 短期拖累收入 / 现金，可能有利于转化
        - 量化平均抵扣额、准备金政策和回收资产变现价值
      - - 合作伙伴主导的经常性合同
        - 渠道合作伙伴带来交易，Meter 仍是经常性服务平台
        - 经常性合同叠加合作伙伴激励
        - 有官方合作伙伴页面和 2026 年基金报道支撑
        - 可能具备扩展性，但合作伙伴补贴可能压缩早期贡献毛利
        - 展示直销 / 渠道结构、合作伙伴分成率，以及返利 / 专项销售激励后的回本周期
    notes: 各行区分商业上不同的变现动作。公开来源显示打包和激励，不显示实际定价或确认收入结构。
