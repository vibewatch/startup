  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和定价机制
        blocks:
          - type: paragraph
            body: >-
              Meter 的公开变现故事在打包层面很清楚，尽管实际经济性仍被隐藏。公司营销一笔可预测月费、无前期成本，以及一段单一供应商关系，把硬件、软件、安全、支持、设计和 ISP
              管理打包进经常性合同。公开伙伴材料又补充了两个对承销重要的具体变现细节：按平方英尺报价，计费可以按月、按季或按年。相同材料把产品拆成 Professional 层和 Premium 层：Professional
              不包含安装，由客户或伙伴协调安装；Premium 则由 Meter 提供端到端铺设，包括布线工作。Meter
              还把蜂窝、运营商费用管理和回购积分作为附加服务或采用辅助来营销。公开没有披露的同样重要：标价到实际成交折扣、中位合同期限、续约条款、流失，以及打包安装或运营商管理在内部是否有单独经济性。
