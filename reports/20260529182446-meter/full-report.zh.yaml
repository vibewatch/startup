  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、类别和 Meter 实际竞争位置
        blocks:
          - type: paragraph
            body: >-
              只有把市场收窄到园区网络即服务（NaaS），而不是整个企业网络栈，Meter 周围的竞争集合才有意义。IDC 2024 年 Innovators 报告把 Join、Meter、Nile 和 Ramen
              放在一起，作为新兴企业 NaaS 供应商；Dell’Oro 的园区 NaaS 研究则把市场拆成赋能型、交钥匙和 LAN-as-a-utility 模型。在这个框架里，Meter 属于
              LAN-as-a-utility 创业公司群，而不是更宽的 WAN、云或通用托管服务市场。Network World 对 Dell’Oro 的报道特别有用，因为它明确说园区 NaaS 是公共云托管 LAN
              的子集，不包括 WAN 和云 / 存储服务。这个区分重要，因为它避免把 Meter 错误地拿去和只做远程接入或重骨干网的供应商比较。


              在这个更窄范围内，直接同业很少：Nile、Join Digital 和 Ramen。Nile 最像 Meter，因为它也把网络作为结果销售，把硬件包进服务，并把运营简单性作为切换理由。Join
              是直接竞争者，但差异明显：公开材料强调开放标准硬件、智能体运营，以及商业地产或灵活办公用例。Ramen 更像相邻的边缘 /
              工业竞争者，而不是一对一的办公室园区替代供应商，因为其证据点集中在仓库、工厂、远程站点和物理 AI 基础设施。结果是，Meter
              并不是在对抗一大群完全相同的创业公司；它面对的是一个小型直接群组，加上一圈更大的传统厂商和替代方案。
