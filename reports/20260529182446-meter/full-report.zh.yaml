      - number: '2.4'
        title: 增长驱动、安全融合和市场约束
        blocks:
          - type: paragraph
            body: >-
              增长侧的故事很具体。IDC 称，Wi-Fi 7 在 4Q25 已占从属 AP 收入的 39.7%，一年前为 10.25%；Dell’Oro 称，企业级 Wi-Fi 7 将在 2026
              年成为主流，并会在买方增加更高带宽和 PoE 容量时触发交换机更新。IDC 还认为，AI 驱动应用、视频流量和 IoT 正迫使买方升级无线网络；Cisco、HPE、Juniper、Extreme 和
              Fortinet 的竞品材料也都指向园区、分支、工厂、医院和半工业场景，把它们视为现代、云托管、安全网络的标准环境。Dell’Oro 对云托管 LAN 的工作对 Meter
              尤其重要，因为它显示企业更愿意为高级功能支付经常性费用，并在该机会中明确点名 Meter 等创业公司。


              约束同样真实。Dell’Oro 2025 年展望称，当宏观能见度较弱时，固定 IT
              预算会让买方推迟购买，并明确将贸易紧张、通胀和关税列为逆风。同一市场还有运营摩擦：部署复杂度、存量替换、安全集成，以及合格网络工程师持续短缺。Network World 调研显示，59% 的 IT 组织计划在
              2026 年升级 Wi-Fi，但只有 7% 已主要运行 Wi-Fi 7；这说明升级跑道很长，并未完成。对类别需求来说这是好事，但也意味着 Meter
              仍要证明，其经常性、高接触部署模型能把这轮更新周期转化为持久且高效的规模经济性。
