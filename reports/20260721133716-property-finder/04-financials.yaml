- id: financial-gaps-and-underwriting-limits
  title: Financial gaps and underwriting limits
  body: Even after the disclosure improvement, Property Finder is still a private company with major public-data gaps. No retained source gives exact current group revenue, group EBITDA, free cash flow, take rate, customer-retention metrics, or debt-covenant structure. The user terms and review surfaces also remind the reader that trust, disputes, and data privacy likely absorb meaningful operational cost that public margin markers do not fully reveal. The resulting underwriting stance should therefore be constructive but disciplined. Property Finder looks more like a scaled, profitable marketplace than like a cash-burning experiment, but the absence of audited statements and detailed unit-economics disclosure means the final valuation case must still carry a real private-opacity discount. A disciplined reader should therefore separate what is unusually encouraging for a private marketplace—growth evidence, margin hints, and financing access—from what is still missing for true underwriting,
    namely audited detail, debt terms, and cohort-level durability measures that explain how repeatable the recent performance really is.
  claimRefs:
  - CI025
  - CI026
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  - CI034
