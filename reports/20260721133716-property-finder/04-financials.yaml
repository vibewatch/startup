- id: capital-stack-and-balance-sheet-context
  title: Capital stack and balance-sheet context
  body: 'Property Finder’s capital history shows both equity and debt capacity. The 2024 Francisco Partners financing funded a BECO buyback, the 2025 Permira-led round added a large strategic minority investment, Ares provided a substantial debt facility, and the 2026 Mubadala-led round brought in sovereign capital plus BECO’s return. That sequence says three useful things. First, equity investors continue to believe there is meaningful regional upside. Second, lenders are comfortable underwriting the business, which usually implies operational confidence. Third, the balance sheet is no longer a simple venture-capital story: shareholder liquidity, leverage, and sovereign alignment are all now part of the financial profile. The caveat is that the public record still lacks debt covenants, maturity profiles, and exact preference or valuation detail, so capital quality is directionally strong but not fully transparent. A disciplined reader should therefore separate what is unusually encouraging
    for a private marketplace—growth evidence, margin hints, and financing access—from what is still missing for true underwriting, namely audited detail, debt terms, and cohort-level durability measures that explain how repeatable the recent performance really is.'
  claimRefs:
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI027
  - CI030
