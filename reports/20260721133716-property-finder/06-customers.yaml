- id: adoption-and-engagement
  title: Adoption and engagement
  body: On the consumer side, the clearest adoption markers are app-distribution and active engagement signals. Apple and Google surfaces show strong ratings, large listing inventories, and million-plus distribution on Android. Google’s case study adds a more financially meaningful layer by showing that the app is not just downloaded, but converts materially better than the mobile website. Market Pulse then shows that Property Finder can repeatedly elicit large-scale survey responses from in-market users and publish a live read on buy intent. These are all useful demand indicators, but they are not the same as retention or monetization cohorts. They show that attention exists and that the product is meaningfully used, not that users or agencies stay forever. The chapter should therefore be read as evidence of real adoption rather than as proof of fully underwritten retention. Property Finder clearly reaches both consumers and professionals at scale, but the final investment call still depends
    on whether that visible usage converts into durable cohorts, strong renewal behavior, and limited customer concentration.
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
