chapter:
  number: 6
  title: Customers
  summary: 'Property Finder has visible customer traction on both sides of the market: strong app-store distribution, large claimed professional networks, and active agency enablement via Partner Hub. But customer proof is mixed: ratings are solid in app stores, commercial testimonials are abundant, and market-pulse response volumes are strong, while Trustpilot and some app reviews show clear quality and trust complaints.'
sections:
- id: segments-and-proof
  title: Customer segments and proof surfaces
  body: 'Property Finder serves at least two economically important customer groups: consumers looking for homes and professionals who need demand, data, and conversion support. Public proof is stronger than it first appears. App stores show broad consumer scale, while Partner Hub and campaign pages show a recognizable set of agencies and agents who are actively engaged with the platform. This does not make the customer base fully transparent—there is no clean public customer-count ledger—but it does show that the company is not just claiming abstract marketplace liquidity. The evidence spans ratings, response-volume proxies, named commercial testimonials, and adjacent product review volumes. Together, they support a real two-sided-market story. The chapter should therefore be read as evidence of real adoption rather than as proof of fully underwritten retention. Property Finder clearly reaches both consumers and professionals at scale, but the final investment call still depends on whether
    that visible usage converts into durable cohorts, strong renewal behavior, and limited customer concentration.'
