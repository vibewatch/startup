- id: concentration-and-open-gaps
  title: Concentration risk and open gaps
  body: 'The customer picture is still UAE-heavy. The strongest direct evidence comes from UAE app, survey, agent, mortgage, and regulatory surfaces, even though the group operates more broadly across MENA. That means concentration risk should be treated as real until management provides a clearer geographic revenue and engagement mix. Public sources also stop short of the metrics that would most strengthen the customer case: retention, NRR, complaint resolution, and cohort-level attach for newer products like Home Valuation and Data Finder. The chapter therefore supports a positive adoption view with medium confidence, not a fully de-risked durability view. The chapter should therefore be read as evidence of real adoption rather than as proof of fully underwritten retention. Property Finder clearly reaches both consumers and professionals at scale, but the final investment call still depends on whether that visible usage converts into durable cohorts, strong renewal behavior, and limited
    customer concentration.'
