- id: satisfaction-repeat-and-friction
  title: Satisfaction, repeat use, and friction
  body: Customer satisfaction is mixed rather than uniformly strong. App-store ratings are favorable and Mortgage Finder’s review volume is impressive, which supports the view that many users find value in the platform. Yet Trustpilot and specific Google Play reviews show that weak agent response, scam exposure, spam-call concerns, and stale inventory remain very real customer experience issues. The broader implication is that Property Finder’s brand and trust tooling are meaningful but not complete insulation from a messy underlying market. Repeat-use logic also looks real—alerts, tracked properties, valuation portfolios, and financing journeys all encourage ongoing engagement—but public sources do not quantify how much of that engagement turns into durable retention or revenue. The chapter should therefore be read as evidence of real adoption rather than as proof of fully underwritten retention. Property Finder clearly reaches both consumers and professionals at scale, but the final investment
    call still depends on whether that visible usage converts into durable cohorts, strong renewal behavior, and limited customer concentration.
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
