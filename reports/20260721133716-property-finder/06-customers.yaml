  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer retention, NRR, GRR, churn, and repeat-usage cohorts by segment.
    whyItMatters: Strong adoption without durable retention does not justify premium marketplace economics.
    diligencePath: Request cohort dashboards by consumer feature, brokerage cohort, and product line.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue and usage concentration by brokerage, developer, and geography.
    whyItMatters: A UAE-heavy book or a few large customers could make the business more fragile than broad top-line proof suggests.
    diligencePath: Request top-customer concentration and geographic revenue mix.
    relatedQuestionRefs:
    - QU023
  - type: private-evidence-only
    severity: minor
    topic: complaint-resolution
    missingEvidence: Complaint-resolution rates, response SLAs, and fraud-incident rates over time.
    whyItMatters: Trust complaints can be tolerable or damaging depending on how fast and effectively the platform resolves them.
    diligencePath: Request trust-and-safety and CX operating dashboards.
    relatedQuestionRefs:
    - QU024
  - type: private-evidence-only
    severity: minor
    topic: new-product-attach
    missingEvidence: Attach and repeat-use cohorts for Home Valuation, transactions, and Data Finder.
    whyItMatters: These features are strategically important but commercially under-measured in public sources.
    diligencePath: Request feature-level MAU, attach, and retention reporting.
    relatedQuestionRefs:
    - QU025
