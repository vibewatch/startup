- id: workflow-and-enablement
  title: Workflow and partner enablement
  body: Property Finder’s workflow is now clearly broader than search to inquiry. Google’s case study frames the app as the best conversion surface. Partner Hub then picks up the B2B side by giving agencies market insights, training, and ROI-oriented guidance. Mortgage Finder takes the user from discovery into financing, while Keyper and Stake extend the journey further into rent or investment use cases. This matters because a portal that can stay in the loop across more steps has more chances to monetize and more ways to defend itself against commoditized listing inventory. It also means the company depends on more external systems and partners. Workflow expansion is therefore both a strength and a source of platform complexity. From a diligence perspective, the technology chapter is strongest on product direction and weakest on measured operational evidence. That is enough to support a favorable strategic read, but not enough to skip requests for reliability, governance, and attach-rate
    data before treating the newer layers as fully de-risked economic engines.
  claimRefs:
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE028
  - CE030
  - CE031
