- id: quality-limits-and-open-technical-gaps
  title: Quality limits and open technical gaps
  body: Public sources make the product look ambitious and current, but they do not make it fully legible. Terms still put responsibility for listing accuracy onto agents and third parties, and review surfaces show that scam, stale-inventory, and support complaints remain visible even after compliance improvements. The gap is not whether Property Finder is building useful tools; it clearly is. The gap is whether those tools work reliably enough, often enough, and at enough scale to justify stronger underwriting assumptions. No retained public source quantifies uptime, attach rates, model accuracy, or fraud-rate reduction. As a result, the product chapter can support a positive direction-of-travel view, but not a fully measured technology-risk view. From a diligence perspective, the technology chapter is strongest on product direction and weakest on measured operational evidence. That is enough to support a favorable strategic read, but not enough to skip requests for reliability, governance,
    and attach-rate data before treating the newer layers as fully de-risked economic engines.
  claimRefs:
  - CE025
  - CE026
  - CE032
  - CE033
  - CE034
  - CE035
  tableRefs: []
  figureRefs: []
