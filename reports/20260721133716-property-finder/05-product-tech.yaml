- id: trust-ai-and-data
  title: Trust, AI, and data layer
  body: The most strategically interesting layer is the combination of trust tooling and data products. SuperAgent attempts to solve a real platform problem by ranking responsiveness and listing quality, while the DLD compliance program and nightly sweeps aim to reduce bad listings before they distort user trust. Data Finder and the DLD / Property Finder House Price Index show that the company is also moving from search inventory toward market intelligence. Home Valuation pushes one step further by turning historical and sentiment data into forward-looking consumer insight. Together these features move Property Finder away from a pure paid-listing model toward software and intelligence. The commercial upside is higher-value monetization; the diligence risk is that public sources still do not expose reliability, accuracy, or attach-rate telemetry at the level an investor would want. From a diligence perspective, the technology chapter is strongest on product direction and weakest on measured
    operational evidence. That is enough to support a favorable strategic read, but not enough to skip requests for reliability, governance, and attach-rate data before treating the newer layers as fully de-risked economic engines.
  claimRefs:
  - CE005
  - CE009
