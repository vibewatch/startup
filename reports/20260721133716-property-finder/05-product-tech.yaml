  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Uptime, incident, and performance telemetry for search, valuation, compliance, and partner tools.
    whyItMatters: Investors need to know whether the visible product breadth is matched by robust and reliable execution.
    diligencePath: Request internal SLO/SLA dashboards, incident logs, and service-health summaries.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: material
    topic: attach-rates
    missingEvidence: Attach, usage, renewal, and revenue metrics for Data Finder, PF Manager, Lead Tracker, and Home Valuation.
    whyItMatters: Commercial value depends on how deeply these tools monetize and retain customers, not just on launch existence.
    diligencePath: Request product P&Ls and cohort usage dashboards.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: trust-effectiveness
    missingEvidence: Fraud, duplicate-listing, takedown, and complaint-resolution metrics tied to compliance tooling.
    whyItMatters: Verification and compliance are a core moat claim that should be measured, not just narrated.
    diligencePath: Request trust-and-safety operating dashboards.
