chapter:
  number: 3
  title: Competitors
  summary: Property Finder competes in a crowded ecosystem that includes Bayut and the broader Dubizzle Group, general-classifieds property sections, data-rich niche portals, and emerging transaction-layer adjacencies. Its strongest differentiators are verified-agent claims, DLD-compliance tooling, and partner-side data products, but multi-homing and rising attention scarcity limit moat certainty.
sections:
- id: landscape-and-categories
  title: Landscape and competitor categories
  body: 'Property Finder does not face a single rival type. The direct competition comes from large real-estate portals such as Bayut, but the broader ecosystem also includes general classifieds with property sections, niche research portals, and adjacent services that can capture more of the user journey after search begins. That matters because Property Finder’s brand strength alone is not enough to define the moat; the relevant comparison set is the whole workflow around discovering, evaluating, financing, and acting on property demand. Dubizzle Group is especially important because it combines Bayut, dubizzle, and Property Monitor inside a larger regional classifieds and data stack. Propsearch and OpenSooq matter for narrower or more price-sensitive use cases, while Stake matters as a different kind of threat: not to search traffic directly, but to the next layer of real-estate wallet capture. The competitive takeaway is therefore not that Property Finder lacks worthy rivals, but that
    it appears to be competing from a position of breadth and brand while still needing to protect user trust, agent ROI, and workflow relevance against platforms that can copy features or concentrate spend.'
