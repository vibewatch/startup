  evidenceGaps:
  - type: missing-source
    severity: material
    topic: traffic-share
    missingEvidence: A direct, fetchable 2026 source quantifying Bayut versus Property Finder consumer traffic share or lead-share.
    whyItMatters: Competitive leadership claims are stronger when anchored to directly comparable share metrics rather than platform-authored superiority language.
    diligencePath: Use internal management dashboards or current analytics-provider exports with methodology notes.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: material
    topic: pricing-cards
    missingEvidence: Published 2026 pricing cards or commercial package ranges for major UAE property portals.
    whyItMatters: Without price transparency, it is hard to tell whether commercial strength reflects product superiority, discounts, or both.
    diligencePath: Request agency proposals, rate cards, and actual spend / ROI case studies from management and customers.
    relatedQuestionRefs:
    - QP021
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: exclusive-supply
    missingEvidence: Data on exclusive listings, customer wallet share, and churn by agency cohort.
    whyItMatters: True switching costs and moat durability depend on whether agencies actually rely on Property Finder more than competitors.
    diligencePath: Ask for cohort churn, wallet-share, and exclusive-inventory metrics from Partner Hub analytics.
    relatedQuestionRefs:
    - QP016
    - QP019
  - type: stale
    severity: minor
    topic: bayut-direct-page
    missingEvidence: A current direct Bayut homepage source that fetches cleanly without archive fallback.
    whyItMatters: Current Bayut positioning is partly inferred from group pages and MyBayut rather than a clean 2026 homepage read.
    diligencePath: Re-fetch Bayut with a stable direct source when available.
    relatedQuestionRefs:
    - QP008
