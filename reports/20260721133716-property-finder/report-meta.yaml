  topStrengths:
    - Public evidence supports a category-leading UAE/MENA property platform with broad product expansion into data, trust, valuation, and workflow tooling.
    - Recent financing from Permira, Blackstone, Ares, HSBC, and Mubadala signals strong investor and lender appetite.
    - Customer and distribution proof is real across app stores, agent-facing surfaces, and mortgage adjacency, rather than resting on narrative alone.
  topRisks:
    - Audited consolidated revenue, EBITDA, cash-flow, debt-covenant, and cap-table terms are still not public.
    - Marketplace trust remains a real operating risk because listing quality and agent responsiveness still generate negative review evidence.
    - The strongest public operating evidence is UAE-centered, leaving concentration and regional diversification under-disclosed.
  unresolvedGaps:
    - The latest valuation, dilution terms, liquidation preferences, and secondary-liquidity structure are not publicly disclosed.
    - Public sources do not provide NRR, churn, top-customer concentration, or cohort attach for newer data and workflow products.
    - Investors still need direct evidence on fraud incidence, complaint-resolution performance, and debt-service headroom.
