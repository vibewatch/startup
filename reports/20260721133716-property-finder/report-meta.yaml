  productSummary: Consumer web and mobile property search with verified professionals, market data, home valuation, transaction intelligence, lead-management tools, and mortgage-adjacent workflows.
  customerFocus: Home seekers, property investors, agents, agencies, developers, and adjacent financing users across MENA, with the deepest visible traction in the UAE.
  businessModel: Marketplace and software model monetized through agent and agency subscriptions, lead-performance tooling, data products, and transaction-adjacent services.
  stage: Late-Stage Private (Unicorn)
  fundingStatus: Major public financing milestones include a 2024 $90M buyback debt transaction, a 2025 $525M strategic investment, a 2025 $250M Ares debt commitment, and a 2026 $170M Mubadala-led investment.
