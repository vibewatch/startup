companyProfile:
  summary: Property Finder is a Dubai-headquartered property marketplace founded in 2007 by Michael Lahyani. Public evidence supports a broad product stack spanning consumer home search, verified-agent discovery, market data, agent workflow tooling, home valuation, and mortgage adjacency. The company operates across multiple MENA markets, but the strongest public operating evidence remains UAE-centered. Financing history includes the 2024 Francisco Partners-backed buyback, the 2025 Permira-led $525M strategic investment with Blackstone participation, a 2025 Ares debt commitment, and a 2026 $170M investment led by Mubadala. Public indicators of quality are strong, but the business still fits a private-undisclosed disclosure profile because audited consolidated financials and round terms are not public.
  foundedDate: '2007-01-01'
  founders:
    - name: Michael Lahyani
      role: Founder and CEO
      background: Property Finder credits Lahyani with identifying the Middle East real-estate classifieds opportunity before launching the company in Dubai in 2007.
