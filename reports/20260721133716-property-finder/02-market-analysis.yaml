chapter:
  number: 2
  title: Market Analysis
  summary: 'Property Finder operates inside a large and still-digitizing Gulf residential property market where transaction values, off-plan activity, and investor participation remained strong into 2026. The market tailwind is real, but so are constraints: affordability, rising choice overload, more agents per listing, and a likely moderation path in parts of Dubai residential real estate.'
sections:
- id: market-boundary-and-buyers
  title: Market boundary and buyer map
  body: 'Property Finder does not participate in the full economics of the homes that change hands on its platform, so the report should not confuse real-estate transaction value with Property Finder’s own addressable revenue. The relevant market is a narrower one: digital search, discovery, lead generation, advertising, data, verification, mortgage, and transaction-adjacent services that sit around residential property decisions. Within that market, the user is the home seeker, but the main payer is the broker, agent, developer, or partner that wants qualified demand, better data, or conversion support. That distinction matters because UAE and Gulf property markets can be enormous in gross value while still supporting only a smaller classifieds and software wallet. Public evidence is strong enough to define the boundary and the buyer-user-payer map, even if it is not strong enough to isolate a precise SAM or SOM from published sources alone. That matters for diligence because demand strength
    alone does not determine portal economics; the better question is whether market structure, buyer intent, and data-rich search behavior create a durable wallet that can still grow even if transaction volumes cool from recent peaks.'
