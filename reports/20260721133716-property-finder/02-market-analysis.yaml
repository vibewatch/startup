  - - Consumer search and discovery
    - Audience reach, alerts, saved searches, inquiry tools
    - Offline brokerage or developer site traffic not touched by the platform
    - Home seekers
    - Drives lead inventory and network effects
  notes: The market boundary is deliberately narrower than total real-estate transaction value because Property Finder intermediates search and services, not principal property ownership.
