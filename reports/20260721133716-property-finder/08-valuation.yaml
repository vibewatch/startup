- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Audited financial quality disappoints
    - Revenue, margin, or cash conversion materially weaker than implied
    - Breaks quality-premium thesis
    - Do not pay premium / consider avoid
  - - Trust complaints rise despite controls
    - Persistent scam or stale-listing evidence
    - Weakens moat and customer ROI logic
    - Cut conviction and revisit customer-risk assumptions
  - - Growth moderates with weak attach
    - New products fail to deepen monetization
    - Compresses multiple support
    - Tighten price or pause
  - - Capital-structure terms are unattractive
    - Preference stack or debt overhang is heavy
    - Reduces equity return potential
    - Require repricing or pass
  - - Market share proves weaker than assumed
    - Bayut or rivals dominate attention and spend
    - Weakens category-leader thesis
    - Re-rate to lower comp quality
  notes: Triggers are phrased as concrete diligence outcomes that would change the recommendation, not generic worries.
