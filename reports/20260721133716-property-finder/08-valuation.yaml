- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financials
    - Revenue, EBITDA, cash flow, segment mix
    - Needed to translate quality into valuation
    - Management / finance room
  - - Retention and concentration
    - NRR, churn, top-customer exposure
    - Tests durability of marketplace economics
    - Management / customer analytics
  - - Debt and preference stack
    - Terms, covenants, maturities, preference rights
    - Determines downside protection and true entry economics
    - Management / legal
  - - Market share
    - Share versus Bayut / Dubizzle by country and segment
    - Tests category-leader claim
    - Management plus external market study
  - - Trust metrics
    - Fraud incidence, complaint resolution, listing-quality dashboards
    - Determines residual risk to monetization
    - Operations / trust-and-safety
  notes: These asks are the minimum set most likely to move the recommendation from track to buy or from track to avoid.
