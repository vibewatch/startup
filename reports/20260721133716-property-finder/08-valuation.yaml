- id: final-call-and-diligence-asks
  title: Final call and diligence asks
  body: 'The final call is positive on the business and cautious on the trade. Property Finder appears to be a valuable regional platform with genuine product leverage and good strategic positioning. That supports staying engaged, not walking away. But the recommendation should remain research-more or track until management provides the specific information that converts quality into underwritable value: audited revenue and EBITDA, renewal and concentration data, debt terms, and current-round economics. If that evidence comes in strong, the company could justify a premium late-stage entry. If it does not, discipline matters more than enthusiasm. At this stage, the biggest mistake would not be missing a great company; it would be overpaying for one without enough proof. This is why the recommendation remains intentionally conditional. Property Finder looks good enough to keep pursuing, but not transparent enough to price casually. A strong diligence package could improve the stance quickly;
    absent that package, the right investment behavior is patience, not forced precision.'
