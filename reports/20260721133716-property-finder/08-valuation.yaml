    - Execution and transparency still need proving
    - Possible but evidence incomplete
  - - Base
    - Profitable growth continues at moderate pace, UAE remains strong, new products add some monetization
    - Supports quality late-stage valuation but only with disciplined entry pricing
    - Limited financial granularity constrains willingness to overpay
    - Most consistent with current public evidence
  - - Bear
