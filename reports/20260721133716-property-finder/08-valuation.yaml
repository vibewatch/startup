  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Current round valuation, dilution, preference stack, and secondary-liquidity structure.
    whyItMatters: These terms define entry economics as much as enterprise quality does.
    diligencePath: Request cap table, term sheet, and financing summary.
