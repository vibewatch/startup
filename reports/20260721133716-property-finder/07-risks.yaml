- id: legal-regulatory-and-operational
  title: Legal, regulatory, and operational risk
  body: 'The legal picture is mixed. On the one hand, Property Finder’s terms are designed to limit the platform’s direct liability for listing accuracy and transactions. On the other hand, those same disclaimers underline that core trust still depends on outside actors. The DLD compliance program is a real mitigation and probably a strong one in Dubai, but it also highlights dependence on regulatory workflows, permits, QR logic, and ingestion quality. Operationally, the visible complaint patterns are exactly where an investor would expect a marketplace like this to remain vulnerable: fake or stale inventory, inconsistent agent behavior, and uneven support. Newer layers such as Home Valuation and SuperAgent add value, but they also add model-risk and fairness-risk questions that public evidence does not yet resolve. These risks are not abstract. Each one has an identifiable path into customer trust, agent ROI, revenue durability, financing flexibility, or valuation support. That is why the
    most important next step is not just to list mitigations, but to demand the monitoring data that shows whether the mitigations are actually working in production.'
