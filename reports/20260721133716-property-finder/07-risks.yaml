  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer / top-broker revenue concentration and spend elasticity.
    whyItMatters: Marketplace revenue can look diversified until a few large brokerages are inspected.
    diligencePath: Request top-20 revenue concentration and churn analyses.
    relatedQuestionRefs:
    - QR025
  - type: private-evidence-only
    severity: material
    topic: debt-transparency
    missingEvidence: Debt covenants, maturity, pricing, and headroom under recent facilities.
    whyItMatters: Capital-structure opacity can turn a growth equity story into a downside-protection problem.
    diligencePath: Request facility summaries and covenant compliance certificates.
    relatedQuestionRefs:
