- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Trust / listing quality
    - Complaint intensity or scam reports rise
    - Sustained increase without remediation evidence
    - Pause or reduce underwriting confidence
  - - Agency ROI deterioration
    - Lead quality falls or price resistance rises
    - Measured ROI compression across key cohorts
    - Revisit growth and margin assumptions
  - - Regulatory dependency
    - Compliance workflow disruption in Dubai
    - Material listing interruption or non-compliance event
    - Escalate legal / ops diligence immediately
  - - Financial opacity
    - Management cannot evidence margin / leverage quality
    - No credible audited bridge or debt detail
    - Avoid premium entry price
  - - Competitive pressure
    - Share loss versus Bayut / other portals in core UAE
    - Persistent share or engagement slippage despite healthy market
    - Move thesis toward hold / avoid
  notes: Kill criteria focus on externally monitorable conditions that change the investment case, not on generic concerns.
