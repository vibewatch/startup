- id: dependency-and-financial-risk
  title: Dependency and financial risk
  body: 'Property Finder’s business depends on several counterparties at once: agencies supplying inventory, app stores and digital channels driving discovery, regulators shaping compliance, and lenders or investors shaping capital flexibility. That is manageable when the market is hot and the product lead is widening. It is harder when competition for listing attention rises or when customers begin demanding more measured ROI. The financing story increases this complexity. Buyback debt, later debt commitments, and large strategic equity rounds are not inherently problematic, but they do mean the business should be evaluated with far more balance-sheet and preference-stack discipline than a simple growth narrative would suggest. Public disclosures do not yet provide that depth. These risks are not abstract. Each one has an identifiable path into customer trust, agent ROI, revenue durability, financing flexibility, or valuation support. That is why the most important next step is not just
    to list mitigations, but to demand the monitoring data that shows whether the mitigations are actually working in production.'
