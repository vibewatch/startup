  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fraud-and-trust
    missingEvidence: Fraud incidence, takedown quality, complaint-resolution SLAs, and trust-and-safety operating metrics.
    whyItMatters: Trust is the most direct transmission path from operations to monetization.
    diligencePath: Request monthly trust dashboards and review-ops processes.
    relatedQuestionRefs:
