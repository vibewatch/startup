chapter:
  number: 7
  title: Risks
  summary: Property Finder’s highest risks are not existential product-market fit risk but execution, trust, regulatory dependency, and valuation-discipline risk. The platform is strategically strong, but it sits on partner-supplied inventory, regulator-linked compliance flows, two-sided marketplace trust, and a still-opaque financial model.
sections:
- id: top-ranked-risks
  title: Top-ranked risks
  body: Property Finder’s risk stack is best understood as a ranked set of residual exposures that remain even after the company’s product improvements and recent financing wins. The top tier includes trust and listing-quality risk, regulatory dependency risk, and financial-transparency risk. These sit above more ordinary execution risks because they can directly affect willingness to pay, platform reputation, and entry valuation. The company’s strong market positioning reduces existential demand risk, but it does not eliminate the fact that inventory originates with third parties, compliance depends on outside institutions, and later-stage investors still have limited public visibility into the core financial engine. That combination argues for a risk posture of investable but cautious rather than aggressive underwriting. These risks are not abstract. Each one has an identifiable path into customer trust, agent ROI, revenue durability, financing flexibility, or valuation support. That is
    why the most important next step is not just to list mitigations, but to demand the monitoring data that shows whether the mitigations are actually working in production.
  claimRefs:
