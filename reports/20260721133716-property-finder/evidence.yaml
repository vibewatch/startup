evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A direct public financing memo or filing stating the latest post-money valuation and share class terms.
    whyItMatters: >-
      The company is publicly described as a unicorn, but exact current valuation and preference terms are not visible,
      limiting return underwriting.
    diligencePath: Request the latest board-approved financing deck, cap table, and term sheet from management.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited group revenue, EBITDA, cash, debt, and covenant disclosures for 2025-2026.
    whyItMatters: >-
      Overview-level stage assessment is strong, but investment precision still depends on audited operating results and
      leverage detail.
    diligencePath: Request audited annual financial statements, lender presentations, and current debt schedules.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: scale-copy
    missingEvidence: >-
      A single management-backed definition for listing count and trusted-professional count across iOS, Android, and
      web surfaces.
    whyItMatters: Channel copy mismatch is small in narrative terms but matters for report-wide metric consistency.
    diligencePath: >-
      Ask growth or product analytics to provide the latest board metric definitions for listings, agents, and active
      professionals.
    relatedQuestionRefs:
      - QO010
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Public disclosure of board committees, voting control, and founder ownership percentage.
    whyItMatters: Governance quality cannot be fully judged from executive bios and financing PRs alone.
    diligencePath: Request shareholder and governance materials or a current board deck summary.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: A public source that directly quantifies UAE or Saudi brokerage spend on portals, lead-gen, and data products.
    whyItMatters: >-
      Gross real-estate activity is large, but valuation requires knowing the narrower wallet Property Finder can
      realistically capture.
    diligencePath: >-
      Request management market-sizing materials showing brokerage, developer, and partner spend on portal products by
      market.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: Property Finder’s share of search traffic, paid agents, or developer spend by country and emirate.
    whyItMatters: A leading-market narrative is helpful, but competitive and valuation work need a measured share view.
    diligencePath: Ask management for internal market-share dashboards and board metrics by geography.
    relatedQuestionRefs:
      - QM021
  - type: conflicting-data
    severity: minor
    topic: market-size-lenses
    missingEvidence: A reconciled methodology explaining why transaction-value, analyst market-size, and platform demand lenses differ.
    whyItMatters: Different market-size lenses are directionally useful but not interchangeable in valuation models.
    diligencePath: Normalize each lens by included spend before using it in revenue projections.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: stale
    severity: minor
    topic: bayut-lens
    missingEvidence: A current 2025-2026 Bayut market-report page instead of an older Q1 2020 market-intelligence surface.
    whyItMatters: The retained Bayut page helps show the category’s data orientation, but not current market levels.
    diligencePath: Retrieve an up-to-date Bayut market report when a fetchable direct URL is available.
    relatedQuestionRefs:
      - QM019
  - type: missing-source
    severity: material
    topic: traffic-share
    missingEvidence: A direct, fetchable 2026 source quantifying Bayut versus Property Finder consumer traffic share or lead-share.
    whyItMatters: >-
      Competitive leadership claims are stronger when anchored to directly comparable share metrics rather than
      platform-authored superiority language.
    diligencePath: Use internal management dashboards or current analytics-provider exports with methodology notes.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: pricing-cards
    missingEvidence: Published 2026 pricing cards or commercial package ranges for major UAE property portals.
    whyItMatters: >-
      Without price transparency, it is hard to tell whether commercial strength reflects product superiority,
      discounts, or both.
    diligencePath: Request agency proposals, rate cards, and actual spend / ROI case studies from management and customers.
    relatedQuestionRefs:
      - QP021
      - QP025
  - type: private-evidence-only
    severity: minor
    topic: exclusive-supply
    missingEvidence: Data on exclusive listings, customer wallet share, and churn by agency cohort.
    whyItMatters: >-
      True switching costs and moat durability depend on whether agencies actually rely on Property Finder more than
      competitors.
    diligencePath: Ask for cohort churn, wallet-share, and exclusive-inventory metrics from Partner Hub analytics.
    relatedQuestionRefs:
      - QP016
      - QP019
  - type: stale
    severity: minor
    topic: bayut-direct-page
    missingEvidence: A current direct Bayut homepage source that fetches cleanly without archive fallback.
    whyItMatters: Current Bayut positioning is partly inferred from group pages and MyBayut rather than a clean 2026 homepage read.
    diligencePath: Re-fetch Bayut with a stable direct source when available.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited 2025 and current 2026 consolidated financial statements.
    whyItMatters: >-
      The company now looks profitable at the UAE-core level, but investment-grade underwriting still requires
      consolidated revenue, EBITDA, cash flow, and balance-sheet detail.
    diligencePath: Request the latest audited financial statements and management reporting pack.
    relatedQuestionRefs:
      - QI021
      - QI022
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Take rate, CAC payback, retention, refund, and support-cost cohorts by product and geography.
    whyItMatters: Strong high-level growth and margin markers do not reveal whether economics are durable across cohorts.
    diligencePath: Request channel- and cohort-level operating dashboards plus customer-retention analyses.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Debt maturity, pricing, covenant, and security packages for the 2024 and 2025 financings.
    whyItMatters: Leverage can support growth or constrain it depending on covenants and refinancing profile.
    diligencePath: Review debt agreements or lender presentation materials.
    relatedQuestionRefs:
      - QI024
  - type: private-evidence-only
    severity: minor
    topic: regional-mix
    missingEvidence: Revenue by country and by product line.
    whyItMatters: The Ares release gives unusually helpful UAE markers but not enough to judge concentration or diversification.
    diligencePath: Request management’s geographic and product-line revenue bridge.
    relatedQuestionRefs:
      - QI025
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Uptime, incident, and performance telemetry for search, valuation, compliance, and partner tools.
    whyItMatters: Investors need to know whether the visible product breadth is matched by robust and reliable execution.
    diligencePath: Request internal SLO/SLA dashboards, incident logs, and service-health summaries.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: material
    topic: attach-rates
