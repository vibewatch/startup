  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis vs anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Property Finder looks like the kind of private marketplace asset that can tempt investors into shortcut
              thinking: the market is attractive, the brand is visible, the funding history is strong, and the product
              roadmap is clearly becoming more sophisticated. That is the thesis. The anti-thesis is that later-stage
              marketplace investing is fundamentally about price and proof, not just quality. Public evidence supports
              the quality side better than it supports the price side. The company appears to have meaningful scale,
              product depth, and institutional backing, but there is still not enough public disclosure to underwrite
              the business with fine-grained precision. The right stance is therefore not “great company equals buy”; it
              is “great company may merit investment if the price compensates for unresolved evidence gaps.” This is why
              the recommendation remains intentionally conditional. Property Finder looks good enough to keep pursuing,
              but not transparent enough to price casually. A strong diligence package could improve the stance quickly;
              absent that package, the right investment behavior is patience, not forced precision.
