      - number: '8.2'
        title: Financing context and scenarios
        blocks:
          - type: paragraph
            body: >-
              The financing context is impressive but should not be overread. Permira’s 2025 strategic investment and
              Mubadala’s 2026 backing show that sophisticated capital sees real value in the asset. Debt capacity from
              Ares and HSBC points in the same direction. But those same signals can cut both ways for a new investor:
              they confirm quality and scarcity, while also increasing the chance that pricing has already baked in much
              of the upside. Given the public evidence, the base case should assume a profitable, still-growing
              marketplace with good strategic optionality but with less-than-perfect transparency. The bull case
              requires proof that new workflow and data products deepen monetization faster than the core market
              matures. The bear case requires only modest market moderation plus weaker lead economics or trust slippage
              to produce a much less attractive outcome. This is why the recommendation remains intentionally
              conditional. Property Finder looks good enough to keep pursuing, but not transparent enough to price
              casually. A strong diligence package could improve the stance quickly; absent that package, the right
              investment behavior is patience, not forced precision.
