      - number: '3.3'
        title: Distribution, pricing, and switching cost
        blocks:
          - type: paragraph
            body: >-
              Distribution power matters because agencies and developers can often multi-home across several portals.
              Public sources show strong commercial positioning by Property Finder’s own account, with Partner Hub
              claiming five times more searches than competitors and a dominant agent preference score. But public
              pricing is opaque, which makes it hard to know whether commercial strength reflects superior ROI,
              discounting, or both. The available evidence suggests that switching costs exist through data, agent
              reputation, and workflow habit, but not through exclusive inventory lock-in. In a fast-growing market that
              has also seen engagement per listing fall, agencies will likely keep testing multiple lead sources rather
              than relying on one portal forever. That means Property Finder’s moat has to be renewed through conversion
              quality and workflow utility, not just through brand familiarity. The competitive takeaway is therefore
              not that Property Finder lacks worthy rivals, but that it appears to be competing from a position of
              breadth and brand while still needing to protect user trust, agent ROI, and workflow relevance against
              platforms that can copy features or concentrate spend.
