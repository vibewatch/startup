      - number: '7.4'
        title: People, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The people risk is not that Property Finder lacks leadership; public evidence suggests the opposite. The
              risk is that strategy now spans multiple product lines, compliance systems, customer segments, and
              financing relationships, so execution has become more interdependent. Investors should therefore focus
              less on static résumés and more on measurable indicators. The most important ones are complaint intensity,
              listing-quality incidents, relative competitive share in UAE search behavior, attach and ROI metrics for
              professional tooling, and evidence of sustained profitable growth. If those indicators move the wrong way,
              valuation can compress even if the company remains operationally healthy. This is why kill criteria need
              to be explicit and monitored, not left as generic “execution risk” language. These risks are not abstract.
              Each one has an identifiable path into customer trust, agent ROI, revenue durability, financing
              flexibility, or valuation support. That is why the most important next step is not just to list
              mitigations, but to demand the monitoring data that shows whether the mitigations are actually working in
              production.
