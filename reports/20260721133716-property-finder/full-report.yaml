      - number: '2.2'
        title: Size, momentum, and geographic tailwinds
        blocks:
          - type: paragraph
            body: >-
              On almost any macro lens, Property Finder sits inside a large underlying market. The strongest official
              public lens is Dubai’s own 2025 transaction record of AED 917 billion and more than 270,000 transactions.
              Analyst and investor sources offer a second lens: a UAE market worth roughly $149 billion to $160 billion
              in 2024-2025 with additional medium-term growth still expected. Saudi Arabia adds another important
              tailwind because the public housing program continues to push homeownership higher and to support
              broad-based residential demand. For Property Finder, the underwriting implication is not just that real
              estate is big, but that digital search and market-intelligence layers still have runway in two of the most
              important Gulf housing markets. This does not prove limitless monetization, but it does support sustained
              demand for search, listings, valuation, and partner tools. That matters for diligence because demand
              strength alone does not determine portal economics; the better question is whether market structure, buyer
              intent, and data-rich search behavior create a durable wallet that can still grow even if transaction
              volumes cool from recent peaks.
