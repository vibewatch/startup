  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product module map
        blocks:
          - type: paragraph
            body: >-
              Property Finder’s current product surface is wide enough that calling it a property portal understates the
              stack. Public pages show at least four layers. First is the consumer discovery layer across web and
              mobile: search, alerts, price tracking, transactions, and new-project exploration. Second is the partner
              and agent layer: dashboards, lead tracking, optimization, and enablement. Third is the data and insight
              layer: transaction data, indices, valuation, and price intelligence. Fourth is the transaction-adjacent
              layer: mortgage advisory, rent management, and investment connectivity. These modules all still orbit the
              core search use case, but they also show why the business can try to expand wallet share without becoming
              a principal property owner or a full broker. The product architecture is therefore closer to a real-estate
              operating system than to a single website. From a diligence perspective, the technology chapter is
              strongest on product direction and weakest on measured operational evidence. That is enough to support a
              favorable strategic read, but not enough to skip requests for reliability, governance, and attach-rate
              data before treating the newer layers as fully de-risked economic engines.
