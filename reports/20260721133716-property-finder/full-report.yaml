      - number: '4.2'
        title: Growth, profitability, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The 2025 Ares financing announcement materially improved the public financial picture. It disclosed a 40%
              plus group revenue CAGR from 2020 to 2024, strong UAE revenue growth, and a UAE EBITDA margin above 60% in
              first-half 2025. That does not give full group profitability, but it is a strong signal that at least the
              core UAE business has meaningful operating leverage. The structural case for leverage is further supported
              by the one-brand, one-tech-stack narrative, the heavy engineering base, and the Google and AI case studies
              that frame better conversion and lower cost-per-lead outcomes for customers. Together these facts support
              a platform that can compound profitably if conversion quality, customer trust, and paid-product attach
              remain strong. They do not eliminate the need for audited statements, but they are more substantive than a
              generic ‘high growth’ narrative. A disciplined reader should therefore separate what is unusually
              encouraging for a private marketplace—growth evidence, margin hints, and financing access—from what is
              still missing for true underwriting, namely audited detail, debt terms, and cohort-level durability
