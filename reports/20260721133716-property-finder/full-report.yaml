        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Property Finder’s public financial logic is clearest when viewed as a paid-demand and software layer
              around the property journey. The agent terms make clear that subscription orders, fees, and service
              activation are part of the commercial model, while the product suite shows how monetization can extend
              beyond inventory placement into data, workflow, and mortgage adjacencies. This is strategically attractive
              because the company does not have to own homes or carry inventory to monetize the search and conversion
              process. Instead, it can sell visibility, insights, tools, and access to qualified intent. The resulting
              revenue quality should be better than a pure media model if ROI is measurable, but also harder to
              reverse-engineer from public sources because the company does not publish rate cards, take rates, or mix
              between core portal and adjacent products. A disciplined reader should therefore separate what is
              unusually encouraging for a private marketplace—growth evidence, margin hints, and financing access—from
              what is still missing for true underwriting, namely audited detail, debt terms, and cohort-level
              durability measures that explain how repeatable the recent performance really is.
