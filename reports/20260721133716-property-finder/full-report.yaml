      - number: '8.3'
        title: Comparable lens and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public-comparable triangulation is the best available method from public evidence. REA Group, Rightmove,
              and Hemnet are all relevant because they represent scaled residential-property platforms that monetize
              professionals and sit in markets where brand, inventory quality, and data services matter. CoStar is
              useful only as an upper-bound reference for platform ambition and information-services adjacency, not as a
              direct peer. Even this comp set must be used directionally because Property Finder’s geography, maturity,
              and mix are distinct. That makes entry discipline the center of the decision. If an investor can enter at
              a price anchored to proven profitability and moderate growth, the asset is compelling. If the price
              instead assumes exceptional transparency, dominant market share, and durable comp-like margins without
              evidence, caution is warranted. This is why the recommendation remains intentionally conditional. Property
              Finder looks good enough to keep pursuing, but not transparent enough to price casually. A strong
              diligence package could improve the stance quickly; absent that package, the right investment behavior is
              patience, not forced precision.
