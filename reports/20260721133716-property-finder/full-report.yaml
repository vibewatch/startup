    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and footprint
        blocks:
          - type: paragraph
            body: >-
              Property Finder should be framed as a scaled MENA property-classifieds and data platform rather than as a
              traditional brokerage. Its strongest public identity sources are the company about, contact, careers, and
              product pages, which together anchor the headquarters in Dubai, show offices across the Gulf plus Egypt
              and Turkey, and position the business as a regional proptech employer and product builder. The company’s
              own wording is important because later chapters depend on it: Property Finder sells search, data,
              verification, marketing, and transaction-adjacent tooling, not a property inventory position. The app and
              product surfaces reinforce the same point by advertising listings, verified professionals, home valuation,
              market data, and alerts. These sources are not equivalent to audited filings, but they are good enough to
              establish the company’s operating identity, footprint, and stage as a late-stage private unicorn with a
              broad real estate technology stack. Taken together, these sources show why Property Finder should be
              treated as a scaled regional technology platform with real operating breadth, but they also show why later
              chapters still need to stress-test trust quality, underwriting transparency, and execution depth before
              converting brand strength into an unquestioned investment conclusion.
