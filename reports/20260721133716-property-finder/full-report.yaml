      - number: '1.4'
        title: Trust tools and adverse context
        blocks:
          - type: paragraph
            body: >-
              The public picture is constructive but not unambiguously clean. Property Finder’s product and press pages
              emphasize verified professionals, AI-driven trust tools, and a larger mission to build transparency in
              MENA real estate. At the same time, the user terms sharply limit the company’s responsibility for
              transaction outcomes and the accuracy of listing information, while the review surface shows repeated
              complaints about fake listings, scam agents, weak support, and stale ads. Those two facts can both be
              true: Property Finder may be improving trust infrastructure while still operating in a market where fraud,
              multi-homing, and information asymmetry remain real. The diligence implication is that later chapters
              should not treat ‘verified’ as synonymous with zero fraud or perfect quality control. Public governance
              and funding momentum are clear strengths, but operational trust metrics remain a live underwriting
              question. Taken together, these sources show why Property Finder should be treated as a scaled regional
              technology platform with real operating breadth, but they also show why later chapters still need to
              stress-test trust quality, underwriting transparency, and execution depth before converting brand strength
              into an unquestioned investment conclusion.
            claimRefs:
              - CO019
              - CO035
              - CO036
              - CO037
