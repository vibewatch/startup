- id: capital-and-milestones
  title: Capital stack and milestones
  body: 'The funding record is unusually rich for a private regional proptech company. The path from the 2024 Francisco Partners debt-backed BECO buyback to the 2025 Permira-Blackstone minority investment, the 2025 Ares debt commitment, and the 2026 Mubadala-led round creates a strong chronology of outside validation. Importantly, the public record distinguishes equity from debt: the 2026 release describes nearly $700 million of aggregate equity capital and another $250 million of debt from Ares and HSBC, while the earlier Francisco transaction funded a shareholder buyback. That means Property Finder’s capital stack is supportive but not cleanly transparent, because exact valuation, preference, and covenant detail remain private. Still, multiple reputable investors and advisers appearing across consecutive transactions give the company far more financing credibility than a single venture round would. Taken together, these sources show why Property Finder should be treated as a scaled regional
    technology platform with real operating breadth, but they also show why later chapters still need to stress-test trust quality, underwriting transparency, and execution depth before converting brand strength into an unquestioned investment conclusion.'
