- id: leadership-and-governance
  title: Leadership and governance
  body: Leadership evidence is strong and mostly company-authored. Michael Lahyani remains publicly identified as founder and chief executive officer, which matters because the funding and product press releases still speak in his voice and position him as the strategic constant behind capital raises and market expansion. Ari Keşişoğlu is publicly listed as President, not CEO, and the company emphasizes his prior big-tech operating background in the Middle East. The 2025 additions of Jamie O’Mahony as CFO and Fernando Fanton as chief product officer suggest a business moving from founder-led growth to more institutionalized finance and product leadership. The board appointment of REA Group CEO Owen Wilson adds another classifieds operator to the governance perimeter. Together these signals support a company that is still founder-led but actively importing marketplace and public-classifieds operating expertise. Taken together, these sources show why Property Finder should be treated as a
    scaled regional technology platform with real operating breadth, but they also show why later chapters still need to stress-test trust quality, underwriting transparency, and execution depth before converting brand strength into an unquestioned investment conclusion.
