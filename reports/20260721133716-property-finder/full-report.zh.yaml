      - number: '5.3'
        title: 工作流和伙伴赋能
        blocks:
          - type: paragraph
            body: >-
              Property Finder 的工作流如今明显不止“搜索到询盘”。Google 的案例研究把 App 描述为最佳转化界面。Partner Hub 接住 B2B 一侧，为经纪机构提供市场洞察、 培训和 ROI
              导向指引。Mortgage Finder 把用户从发现带到融资，Keyper 和 Stake 又把旅程延伸到租金或投资用例。这很重要，因为一个能在更多步骤里留在回路中的门户，
              拥有更多变现机会，也有更多办法防御商品化房源库存。但这也意味着公司依赖更多外部系统和伙伴。因此，工作流扩张既是强项，也是平台复杂度来源。
              从尽调角度看，技术章节在产品方向上最强，在可衡量运营证据上最弱。这足以支持一个有利的战略解读，但在把新层视为完全去风险的经济引擎之前， 仍不能跳过对可靠性、治理和附着率数据的要求。
            claimRefs:
