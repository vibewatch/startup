      - number: '1.3'
        title: 资本结构和里程碑
        blocks:
          - type: paragraph
            body: >-
              对一家区域非上市房地产科技公司来说，Property Finder 的融资记录异常丰富。从 2024 年 Francisco Partners 债务支持的 BECO 回购，到 2025 年
              Permira-Blackstone 少数股权投资、2025 年 Ares 债务承诺，再到 2026 年 Mubadala 领投轮次，这条路径构成了强烈的外部认可时间线。重要的是，公开记录区分了股权和债务：
              2026 年新闻稿称累计股权资本接近 $700 million，另有来自 Ares 和 HSBC 的 $250 million 债务；更早的 Francisco 交易则用于股东回购。 这意味着 Property
              Finder 的资本结构提供支撑，但透明度并不干净，因为精确估值、优先权和契约细节仍是私有信息。尽管如此，多家声誉良好的投资者和顾问连续出现在多笔交易中，
              让公司的融资可信度远高于单一风险投资轮次。合在一起，这些来源解释了为什么应把 Property Finder 视为一个有实际经营宽度的区域技术平台；同时也说明，
              在把品牌强度转成不容质疑的投资结论之前，后续章节仍需压力测试信任质量、承销透明度和执行深度。
