companyProfile:
  summary: >-
    Property Finder 总部位于 Dubai，由 Michael Lahyani 于 2007 年创立。公开证据显示，公司产品栈覆盖消费者找房、认证经纪人发现、市场数据、经纪人工作流工具、房屋估值和房贷相邻服务。
    公司横跨多个 MENA 市场运营，但最强的公开经营证据仍集中在 UAE。融资历史包括 2024 年 Francisco Partners 支持的回购、2025 年 Permira 领投且 Blackstone 参投的 $525M
    战略投资、2025 年 Ares 债务承诺，以及 2026 年 Mubadala 领投的 $170M 投资。质量信号整体强劲， 但由于经审计合并财务和轮次条款并未公开，这家公司仍属于非上市且披露有限的画像。
