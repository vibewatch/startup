      - number: '1.4'
        title: 信任工具和反向背景
        blocks:
          - type: paragraph
            body: >-
              公开图景偏正面，但并非毫无杂质。Property Finder 的产品和新闻页面强调认证专业人士、AI 驱动的信任工具，以及在 MENA 房地产中建立透明度的更大使命。
              与此同时，用户条款大幅限制公司对交易结果和房源信息准确性的责任；评论页面则反复出现假房源、诈骗经纪人、支持薄弱和过期广告投诉。两件事可以同时成立： Property Finder
              可能在改善信任基础设施，同时仍处在一个欺诈、多平台投放和信息不对称真实存在的市场里。尽调含义是，后续章节不应把“verified”等同于零欺诈或完美质量控制。
              公开治理和融资动能是明确强项，但运营信任指标仍是活着的承销问题。合在一起，这些来源解释了为什么应把 Property Finder 视为一个有实际经营宽度的区域技术平台；
              同时也说明，在把品牌强度转成不容质疑的投资结论之前，后续章节仍需压力测试信任质量、承销透明度和执行深度。
