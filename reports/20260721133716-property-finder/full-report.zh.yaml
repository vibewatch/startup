              即便披露已有改善，Property Finder 仍是一家存在重大公开数据缺口的非上市公司。没有保留来源给出精确的当前集团收入、集团 EBITDA、自由现金流、抽成率、
              客户留存指标或债务契约结构。用户条款和评论页面也提醒读者，信任、纠纷和数据隐私很可能吃掉有意义的运营成本，而公开利润率标记并未完全揭示这些成本。 因此，承销姿态应是建设性但有纪律。Property Finder
              看起来更像一个有规模、能盈利的市场平台，而不是烧钱实验；但缺少经审计报表和详细单位经济披露，
