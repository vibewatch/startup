      - number: '4.2'
        title: 增长、盈利能力和运营杠杆
        blocks:
          - type: paragraph
            body: >-
              2025 年 Ares 融资公告实质性改善了公开财务图景。它披露 2020 到 2024 年集团收入 CAGR 超过 40%，UAE 收入增长强劲，且 2025 年上半年 UAE EBITDA 利润率高于
              60%。这没有给出完整集团盈利能力，但强烈表明至少 UAE 核心业务具备显著运营杠杆。一个品牌、一个技术栈的叙事，厚重工程团队， 以及 Google 和 AI
              案例研究中对客户更好转化和更低每线索成本的描述，又进一步支撑了杠杆逻辑。合在一起，这些事实支持一个判断：
              如果转化质量、客户信任和付费产品附着保持强劲，平台可以盈利性复利。它们不能消除经审计报表的必要性，但比泛泛的“高增长”叙事更有实质。
              严谨的读者应区分两类东西：对非上市市场平台来说异常令人鼓舞的内容——增长证据、利润率线索和融资通道；以及真正承销仍缺少的内容， 即经审计细节、债务条款和队列级耐久性指标，它们才能解释近期表现到底有多可重复。
