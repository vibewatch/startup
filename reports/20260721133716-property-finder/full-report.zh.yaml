chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位和业务版图
        blocks:
          - type: paragraph
            body: >-
              Property Finder 更应被视为一个有规模的 MENA 房产分类信息和数据平台，而不是传统经纪公司。最有力的公开身份来源来自公司的关于、联系方式、招聘和产品页面： 它们共同确认总部在
              Dubai，显示办公室覆盖 Gulf、Egypt 和 Turkey，并把公司定位为区域房地产科技雇主和产品建设者。公司自己的措辞很关键，因为后续章节都建立在这一点上： Property Finder
              卖的是搜索、数据、认证、营销和交易相邻工具，而不是持有房源库存。App 和产品界面也在强化同一点：它展示房源、认证专业人士、房屋估值、市场数据和提醒。
              这些来源不能等同于经审计文件，但足以确立公司的经营身份、版图和阶段——一家后期非上市独角兽，拥有宽泛的房地产技术栈。合在一起，这些来源解释了为什么应把 Property Finder
              视为一个有实际经营宽度的区域技术平台；同时也说明，在把品牌强度转成不容质疑的投资结论之前，后续章节仍需压力测试信任质量、承销透明度和执行深度。
