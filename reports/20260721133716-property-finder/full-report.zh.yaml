  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和变现
        blocks:
          - type: paragraph
            body: >-
              把 Property Finder 看成围绕房产旅程的付费需求和软件层时，它的公开财务逻辑最清楚。经纪人条款明确显示，订阅订单、费用和服务开通是商业模式的一部分；
              产品套件则说明，变现可以从库存展示延伸到数据、工作流和房贷相邻场景。这个战略很有吸引力，因为公司不必拥有房屋或承担库存，就能变现搜索和转化过程。 它可以卖可见度、洞察、工具，以及通向合格意向的入口。如果 ROI
              可衡量，收入质量应优于纯媒体模式；但公开来源也更难反推，因为公司不披露价目表、抽成率，
              也不披露核心门户和相邻产品之间的组合。严谨的读者应区分两类东西：对非上市市场平台来说异常令人鼓舞的内容——增长证据、利润率线索和融资通道；以及真正承销仍缺少的内容，
              即经审计细节、债务条款和队列级耐久性指标，它们才能解释近期表现到底有多可重复。
