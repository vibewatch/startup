  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Property Finder
              像是一类容易诱使投资人走捷径判断的非上市平台型资产：市场够好、品牌可见度高、融资履历强，产品路线也明显在变得更复杂。这是投资逻辑。反向逻辑在于，后期平台投资本质上看价格和证据，不只是看资产质量。公开证据更能支撑质量判断，却还不足以支撑价格判断。公司似乎已有可观规模、产品深度和机构背书，但公开披露仍不够，无法把业务拆细到足以支撑投资承销。因此正确姿态不是“好公司就买”，而是“好公司只有在价格足以补偿未解决的证据缺口时，才可能值得投”。建议也因此刻意保持有条件。Property
              Finder 好到值得继续追踪，但透明度还不够，不能随意定价。强有力的尽调资料包可以很快改善判断；如果拿不到，正确的投资动作是保持耐心，而不是强行追求精确。
