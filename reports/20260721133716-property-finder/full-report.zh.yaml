      - number: '1.2'
        title: 领导层和治理
        blocks:
          - type: paragraph
            body: >-
              领导层证据强，且大多由公司自己发布。Michael Lahyani 仍被公开列为创始人兼首席执行官，这一点重要，因为融资和产品新闻稿仍用他的口吻发声，并把他定位成资本募集和市场扩张背后的战略常量。 Ari
              Keşişoğlu 公开职务是总裁，而不是 CEO；公司也强调他此前在中东大型科技公司的运营背景。2025 年 Jamie O’Mahony 出任 CFO、Fernando Fanton
              出任首席产品官，显示公司正从创始人驱动增长转向更制度化的财务和产品领导。REA Group CEO Owen Wilson 加入董事会，又把一位分类信息运营者纳入治理边界。
              这些信号合在一起，支持一个判断：公司仍由创始人带队，但正在主动引入市场平台和公开市场分类信息运营经验。合在一起，这些来源解释了为什么应把 Property Finder
