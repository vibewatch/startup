      - number: '2.4'
        title: 市场结论和未解规模缺口
        blocks:
          - type: paragraph
            body: >-
              市场结论为正面，但带有重要保留。Property Finder 暴露于一个庞大、流动性强、监管支持的 UAE 市场，也暴露于仍受住房拥有政策支持的 Saudi 市场。
              市场深度、持续的期房需求和高强度买方搜索活动结合起来，为房产门户提供了强劲的中期需求背景。与此同时，门户经济性很可能比总交易额暗示的更难，因为生态竞争激烈，
              买方可能更价格敏感，经纪人面对更高的组合复杂度和预算强度。未解问题不是市场是否足够大，而是 Property Finder 能在不压缩利润率的情况下，拿下多少经纪、开发商和伙伴钱包。
              公开证据无法直接分离这笔支出，所以后续财务和估值章节应把市场规模当作顺风，而不是收入确定性的捷径。这一点关乎尽调，因为需求强度本身不决定门户经济性；更好的问题是，
              市场结构、买方意图和数据丰富的搜索行为，能否创造一个耐久的钱包，即便交易量从近期高点降温，仍能增长。
