  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块地图
        blocks:
          - type: paragraph
            body: >-
              Property Finder 当前产品界面足够宽，把它叫作房产门户会低估这套栈。公开页面显示至少四层。第一层是跨网页和移动端的消费者发现层：
              搜索、提醒、价格跟踪、交易和新项目探索。第二层是伙伴和经纪人层：仪表盘、线索跟踪、优化和赋能。第三层是数据和洞察层：交易数据、指数、估值和价格情报。
              第四层是交易相邻层：房贷咨询、租金管理和投资连接。这些模块仍围绕核心搜索用例运转，但也解释了为什么公司可以尝试扩大钱包份额，而不必成为自有房产持有人或完整经纪商。
              因此，产品架构更接近房地产操作系统，而不是单一网站。从尽调角度看，技术章节在产品方向上最强，在可衡量运营证据上最弱。这足以支持一个有利的战略解读，
              但在把新层视为完全去风险的经济引擎之前，仍不能跳过对可靠性、治理和附着率数据的要求。
