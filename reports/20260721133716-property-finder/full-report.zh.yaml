      - number: '7.2'
        title: 法律、监管和运营风险
        blocks:
          - type: paragraph
            body: >-
              法律图景是混合的。一方面，Property Finder 的条款旨在限制平台对房源准确性和交易的直接责任。另一方面，这些免责声明也强调，核心信任仍依赖外部参与者。 DLD 合规计划是真实缓释，在 Dubai
              大概率也很有力，但它同样凸显对监管工作流、许可证、QR 逻辑和数据摄取质量的依赖。运营上，可见投诉模式正是投资者预期这类市场平台仍会脆弱的地方： 假房源或过期库存、经纪人行为不一致，以及支持不均。Home
              Valuation 和 SuperAgent 等新层增加价值，但也增加模型风险和公平性风险问题，公开证据尚未解决这些问题。 这些风险并不抽象。每个风险都有一条可识别路径，通向客户信任、经纪人
              ROI、收入耐久性、融资灵活性或估值支撑。因此，最重要的下一步不只是列出缓释措施， 而是要求能证明这些缓释措施在生产环境中确实有效的监测数据。
