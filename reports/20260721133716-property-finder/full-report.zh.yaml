      - number: '8.2'
        title: 融资背景和情景
        blocks:
          - type: paragraph
            body: >-
              融资背景很亮眼，但不能读过头。Permira 的 2025 年战略投资和 Mubadala 的 2026 年背书，说明成熟资本确实看到了这项资产的价值。Ares 和 HSBC
              提供的债务容量也指向同一方向。但这些信号对新投资人也可能两面解释：它们验证质量和稀缺性，同时也提高了定价已消化大部分上行空间的概率。基于公开证据，基准情景应假设这是一家已盈利、仍在增长的平台，战略选择权不错，但透明度并不完美。乐观情景需要证明新的工作流和数据产品能让变现深化速度快过核心市场成熟速度。悲观情景不需要极端冲击；只要市场温和降温，叠加线索经济性走弱或信任滑坡，结果就会明显变差。建议也因此刻意保持有条件。Property
              Finder 好到值得继续追踪，但透明度还不够，不能随意定价。强有力的尽调资料包可以很快改善判断；如果拿不到，正确的投资动作是保持耐心，而不是强行追求精确。
