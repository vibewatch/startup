  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高级别风险
        blocks:
          - type: paragraph
            body: >-
              理解 Property Finder 的风险栈，最好把它看成一组排过序的剩余暴露：即便公司已有产品改进和近期融资胜利，这些暴露仍然存在。最高层包括信任和房源质量风险、
              监管依赖风险，以及财务透明度风险。它们高于更普通的执行风险，因为能直接影响付费意愿、平台声誉和进入估值。公司强市场位置降低了生存性需求风险，
              但没有消除几个事实：库存来自第三方，合规依赖外部机构，后期投资者对核心财务引擎的公开可见度仍有限。这个组合指向的风险姿态，是可投资但谨慎，而不是激进承销。
              这些风险并不抽象。每个风险都有一条可识别路径，通向客户信任、经纪人 ROI、收入耐久性、融资灵活性或估值支撑。因此，最重要的下一步不只是列出缓释措施， 而是要求能证明这些缓释措施在生产环境中确实有效的监测数据。
