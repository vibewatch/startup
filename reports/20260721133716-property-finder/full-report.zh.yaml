  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图和竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Property Finder 面对的不是单一类型对手。直接竞争来自 Bayut 等大型房地产门户，但更广泛的生态还包括带房产板块的综合分类信息平台、细分研究门户，以及能在搜索开始后拿走更多用户旅程的相邻服务。
              这很重要，因为仅凭 Property Finder 的品牌强度不足以定义护城河；真正的比较集合，是围绕发现、评估、融资和响应房产需求的整条工作流。Dubizzle Group 尤其关键， 因为它把
              Bayut、dubizzle 和 Property Monitor 放在一个更大的区域分类信息和数据栈里。Propsearch 和 OpenSooq 对更窄或更价格敏感的用例重要， Stake
              则是另一类威胁：不是直接威胁搜索流量，而是威胁房地产钱包捕获的下一层。因此，竞争结论不是 Property Finder 缺乏有分量的对手，而是它看起来凭宽度和品牌在竞争， 但仍必须守住用户信任、经纪人 ROI
              和工作流相关性，抵御能复制功能或集中支出的各类平台。
