              Property Finder 的业务同时依赖多类交易对手：供应库存的经纪机构、推动发现的应用商店和数字渠道、塑造合规的监管机构，以及影响资本灵活性的贷款方或投资者。
              市场火热且产品领先扩大时，这些依赖可管理；当房源注意力竞争上升，或客户开始要求更可衡量的 ROI 时，难度就会上升。融资故事增加了这种复杂度。
              回购债务、后续债务承诺和大额战略股权轮次本身并非问题，但确实意味着，评估这家公司时必须比简单增长叙事更重视资产负债表和优先股堆叠纪律。
              公开披露尚未提供这种深度。这些风险并不抽象。每个风险都有一条可识别路径，通向客户信任、经纪人 ROI、收入耐久性、融资灵活性或估值支撑。
