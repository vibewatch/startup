  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和买方地图
        blocks:
          - type: paragraph
            body: >-
              Property Finder 并不参与平台上房屋成交的全部经济利益，所以报告不能把房地产交易额和 Property Finder 自身可触达收入混为一谈。真正要看的市场更窄：
              围绕住宅房产决策的数字搜索、发现、线索生成、广告、数据、认证、房贷和交易相邻服务。在这个市场里，用户是找房者，但主要付款方是想获得合格需求、更好数据或转化支持的经纪公司、
              经纪人、开发商或合作伙伴。这个区分很重要，因为 UAE 和 Gulf 房地产市场的总价值可以极大，但仍只支撑更小的分类信息和软件钱包。公开证据足以定义边界和买方-用户-付款方地图，
              即使仅凭公开来源还无法分离出精确 SAM 或 SOM。这一点关乎尽调，因为需求强度本身不决定门户经济性；更好的问题是，市场结构、买方意图和数据丰富的搜索行为，能否创造一个耐久的钱包，
              即便交易量从近期高点降温，仍能增长。
