      - number: '3.3'
        title: 分发、定价和切换成本
        blocks:
          - type: paragraph
            body: >-
              分发权力很重要，因为经纪机构和开发商往往可以同时在多个门户投放。公开来源显示，按 Property Finder 自己的说法，它商业定位强：Partner Hub
              声称搜索量是竞争对手的五倍，并拥有占优的经纪人偏好得分。但公开定价不透明，很难判断商业强度来自更高 ROI、折扣，还是两者都有。现有证据显示，数据、经纪人声誉和工作流习惯会形成切换成本，
              但不是靠独家房源锁定。在一个高速增长、同时每房源互动下滑的市场里，经纪机构大概率会继续测试多个线索来源，而不是永远依赖一个门户。这意味着 Property Finder
              的护城河必须靠转化质量和工作流实用性反复更新，不能只靠品牌熟悉度。因此，竞争结论不是 Property Finder 缺乏有分量的对手，而是它看起来凭宽度和品牌在竞争， 但仍必须守住用户信任、经纪人 ROI
              和工作流相关性，抵御能复制功能或集中支出的各类平台。
