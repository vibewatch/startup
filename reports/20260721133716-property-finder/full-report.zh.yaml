      - number: '2.2'
        title: 规模、动能和地理顺风
        blocks:
          - type: paragraph
            body: >-
              几乎从任何宏观视角看，Property Finder 都处在一个庞大的底层市场里。最强的官方公开视角，是 Dubai 自己 2025 年 AED 917 billion、超过 270,000
              笔交易的纪录。分析师和投资者来源提供了第二个视角：UAE 市场在 2024-2025 年大约价值 $149 billion 至 $160 billion，中期仍预计继续增长。 Saudi Arabia
              又带来另一股重要顺风，因为公共住房计划持续推高住房拥有率，并支持广泛的住宅需求。对 Property Finder 来说，承销含义不只是房地产市场大， 而是数字搜索和市场情报层在两个最重要的 Gulf
              住房市场仍有跑道。这不能证明变现无限，但确实支持搜索、房源、估值和伙伴工具的持续需求。这一点关乎尽调，
              因为需求强度本身不决定门户经济性；更好的问题是，市场结构、买方意图和数据丰富的搜索行为，能否创造一个耐久的钱包，即便交易量从近期高点降温，仍能增长。
