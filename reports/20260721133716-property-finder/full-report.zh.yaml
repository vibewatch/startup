            body: >-
              Property Finder 的资本历史显示它同时具备股权和债务融资能力。2024 年 Francisco Partners 融资支持了 BECO 回购，2025 年 Permira
              领投轮次带来大额战略少数股权投资，Ares 提供了可观债务额度，2026 年 Mubadala 领投轮次又带来主权资本和 BECO 回归。这一序列说明三件有用的事。
              第一，股权投资者仍相信区域上行空间可观。第二，贷款方愿意承销这家公司，通常意味着对运营有信心。第三，资产负债表已不再是简单的风险资本故事：
              股东流动性、杠杆和主权资本对齐，如今都进入财务画像。保留项是，公开记录仍缺债务契约、到期结构，以及精确优先权或估值细节，所以资本质量方向上强，但并不完全透明。
              严谨的读者应区分两类东西：对非上市市场平台来说异常令人鼓舞的内容——增长证据、利润率线索和融资通道；以及真正承销仍缺少的内容， 即经审计细节、债务条款和队列级耐久性指标，它们才能解释近期表现到底有多可重复。
