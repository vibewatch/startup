      - number: '8.3'
        title: 可比公司框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开可比公司三角测算，是现有公开证据下最好的办法。REA Group、Rightmove 和 Hemnet
              都有参考价值，因为它们都是规模化住宅地产平台，向专业人士收费，并处在品牌、房源质量和数据服务都重要的市场。CoStar
              只能作为平台野心和信息服务相邻业务的上限参照，不能当作直接同业。即使这组可比公司也只能方向性使用，因为 Property Finder
              的地域、发展阶段和业务组合都不一样。因此，入场纪律才是决策核心。如果投资人能以已验证盈利能力和温和增长为锚进入，这项资产很有吸引力。如果价格在没有证据的情况下假设极高透明度、主导市场份额和持久的可比公司式利润率，就应该谨慎。建议也因此刻意保持有条件。Property
              Finder 好到值得继续追踪，但透明度还不够，不能随意定价。强有力的尽调资料包可以很快改善判断；如果拿不到，正确的投资动作是保持耐心，而不是强行追求精确。
