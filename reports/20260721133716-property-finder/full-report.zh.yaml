      - number: '8.4'
        title: 最终判断与尽调要求
        blocks:
          - type: paragraph
            body: >-
              最终判断是：看好业务，谨慎看待交易。Property Finder
              似乎是一个有价值的区域平台，确有产品杠杆，战略位置也不错。上述判断支持继续沟通，而不是离场。但在管理层给出能把质量转化为可承销价值的信息之前，建议仍应停留在继续研究或观察：经审计收入和
              EBITDA、续约和集中度数据、债务条款、当前轮次经济性。如果这些证据足够强，公司可以支撑一笔带溢价的后期入场。若证据不足，纪律比热情更重要。此阶段最大的错误不是错过一家好公司，而是在证据不足时为好公司付太高价格。建议也因此刻意保持有条件。Property
              Finder 好到值得继续追踪，但透明度还不够，不能随意定价。强有力的尽调资料包可以很快改善判断；如果拿不到，正确的投资动作是保持耐心，而不是强行追求精确。
