            body: >-
              Property Finder 至少服务两个经济上重要的客户群：找房消费者，以及需要需求、数据和转化支持的专业人士。公开证据比第一眼更强。应用商店显示广泛消费者规模； Partner Hub
              和营销页面则展示了一组可识别、且正积极使用平台的经纪机构和经纪人。这并不意味着客户群完全透明——公开资料里没有干净的客户数量台账——但它说明公司不是只在声称抽象的市场流动性。
              证据覆盖评分、响应量代理指标、具名商业证言，以及相邻产品评论量。合在一起，它们支持一个真实的双边市场故事。因此，本章应被读作真实采用的证据， 而不是完全承销过的留存证明。Property Finder
              明确以规模触达消费者和专业人士，但最终投资判断仍取决于这些可见使用能否转成耐久队列、强续约行为和有限客户集中度。
