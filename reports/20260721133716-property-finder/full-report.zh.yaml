      - number: '5.4'
        title: 质量边界和待解技术缺口
        blocks:
          - type: paragraph
            body: >-
              公开来源让产品看起来雄心足、也跟得上节奏，但并没有让它完全可读。条款仍把房源准确性责任压到经纪人和第三方身上；评论页面显示，即使合规改进后， 诈骗、过期库存和支持投诉仍然可见。缺口不在于 Property
              Finder 是否在建设有用工具——它显然在建设。缺口在于这些工具是否足够可靠、足够高频、足够规模化，
              能支撑更强的承销假设。没有保留的公开来源量化正常运行时间、附着率、模型准确率或欺诈率下降。因此，产品章节可以支持一个方向向好的判断，
              但不能支持一个完全量化的技术风险判断。从尽调角度看，技术章节在产品方向上最强，在可衡量运营证据上最弱。这足以支持一个有利的战略解读，
              但在把新层视为完全去风险的经济引擎之前，仍不能跳过对可靠性、治理和附着率数据的要求。
