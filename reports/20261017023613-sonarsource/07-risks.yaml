callouts:
  - calloutType: risk
    title: Publicly visible thesis-break triggers
    body: >-
      The downside case sharpens if Sonar cannot show concrete CRA readiness before reporting
      obligations begin, if enterprise users keep reporting upgrade or false-positive pain without
      offsetting ROI evidence, if agentic products need governance-heavy customer-specific LLM
      setups to work in production, or if license and overage controls visibly block analysis at
      critical moments.
    claimRefs: [CR001, CR002, CR008, CR010, CR013, CR014, CR015]
  - calloutType: insight
    title: Mitigants are real, but private disclosure lags public peers
    body: >-
      Sonar does have credible mitigants already visible in public materials: self-hosted and
      air-gapped deployment paths, cloud assurance, deep IDE and CI/CD integration, and stronger
      agentic-specific quality gates. GitLab's public valuation, gross-margin, and cash-flow
      metrics show the operating evidence available for a listed peer. The next diligence step is
      to test Sonar's controls and economics with comparable data rather than simply shifting
      complexity into implementation and operations.
    claimRefs: [CR004, CR005, CR006, CR007, CR011, CR017]
