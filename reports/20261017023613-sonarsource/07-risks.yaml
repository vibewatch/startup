company:
  name: SonarSource
chapter:
  number: 7
  title: Risks
  summary: >-
    SonarSource's refreshed risk profile is concentrated in execution and trust rather than
    product relevance: the 2026 agentic expansion adds LLM-provider, container, and deployment
    surface just as EU cyber rules tighten and public software benchmarks reset. Public mitigants
    exist in self-hosted deployment, quality gates, and cloud assurance, but customer reviews
    still report upgrade friction, false positives, and cost overhead while GitLab's public
    operating metrics highlight the disclosure gap facing a private-company valuation.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest residual risk is not whether Sonar solves a real problem; public product
      materials and customer reviews both show that code gating and security verification are
      valuable. The sharper question is whether Sonar can extend that trust into the agentic era
      without increasing operating complexity faster than customer ROI. The 2026 releases move the
      stack toward separately deployed agent containers, external LLM providers, and stricter
      controls for AI-generated code, which is strategically sensible but operationally heavier.
      Customer reviewers still describe upgrade surprises, false positives, and meaningful cost
      overhead, so the downside case is a product that remains important but becomes harder to
      deploy, govern, or justify economically at scale.
    claimRefs: [CR004, CR005, CR008, CR009, CR010, CR013, CR014, CR015]
    figureRefs: [FR001]
  - id: regulatory-and-licensing
    title: Regulatory and public-market benchmark risk
    body: >-
      Regulatory exposure centers on software-security obligations rather than an identified
      enforcement event. The EU Cyber Resilience Act now has dated reporting and compliance
      milestones, and some in-scope products may require third-party assessment before sale in the
      EU. At the same time, Sonar's newer AI capabilities rely on external model providers and
      endpoints, which raises diligence needs around data handling, contractual controls, and
      evidence trails. Public-market comparables add a separate underwriting risk: StockAnalysis
      reported GitLab at $3.10 billion of enterprise value and 3.25x EV/sales in May 2026, with
      public gross-margin and free-cash-flow data that private Sonar does not disclose. That gap
      makes a stale premium mark harder to defend without management evidence.
    claimRefs: [CR001, CR002, CR003, CR006, CR008, CR011, CR017]
    tableRefs: [TR001]
  - id: operational-and-security-delivery
    title: Operational, quality, and security-delivery risk
    body: >-
      The main operational risk is that Sonar's answer to agent-generated code also increases the
      number of moving pieces customers must trust. Sonar itself now frames agentic code as
      creating new dependency and injection risks, and the new products run outside the core server
      in orchestrated containers with egress and storage components. That expands the failure and
      configuration surface even before customer-specific LLM, CI/CD, and identity controls are
      layered in. Public mitigants are visible — self-hosted deployment, air-gapped options, cloud
      assurance, and quality gates — but customer review commentary still flags upgrade churn,
      backward-compatibility surprises, false positives, and operational overhead. That makes
      reliability and customer-friction monitoring a live diligence item, not a solved problem.
    claimRefs: [CR005, CR007, CR009, CR010, CR011, CR013, CR014, CR015]
    tableRefs: [TR002]
  - id: dependency-and-thesis-breakers
    title: Dependency risk, monitoring, and kill criteria
    body: >-
      Dependency risk is distributed across external platforms, model providers, and internal
      execution. Sonar is deeply tied to GitHub, GitLab, Azure DevOps, Bitbucket, and third-party
      AI endpoints, so integration or policy changes can create customer pain quickly. The
      AutoCodeRover acquisition adds integration and hiring risk while Sonar expands an R&D
      footprint in Singapore. Public GitLab metrics also provide a visible valuation and operating
      benchmark that Sonar's private disclosure does not match. The practical kill criteria are
      therefore monitorable: weak CRA readiness, repeated upgrade or false-positive complaints,
      blocked analyses from license controls, unclear agentic data governance, or a refreshed
      valuation that ignores public-market economics.
    claimRefs: [CR001, CR002, CR004, CR006, CR008, CR010, CR013, CR014, CR015, CR016, CR017]
    tableRefs: [TR003]
