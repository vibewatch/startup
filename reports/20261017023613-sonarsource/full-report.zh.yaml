      - number: '4.3'
        title: 成本结构、资本强度与投资判断边界
        blocks:
          - type: paragraph
            body: >-
              证据显示不同产品对应不同成本画像的混合交付模式。SonarQube Cloud 是托管 SaaS，SonarQube Server 由客户 自管，新代理产品则要求客户部署容器、共享存储和与许可绑定的用量额度。这让
              Sonar 能同时服务受监管企业与更 轻量的云买家，但也意味着客户群的支持、实施和基础设施负担不一。投资判断的关键问题不是商业信号不足，而是
              资产负债表和单位经济披露不足。材料没有提供现金余额、烧钱、现金跑道、毛利率、债务义务、NRR 或客户集中度， 因此资本充足性和利润率韧性仍是尽调要求，而非已纳入投资判断的事实。
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务看，Sonar 似乎拥有强劲的收入顶部和可信的变现架构：大型免费 / 社区漏斗、企业定价的核心版本， 以及可在大客户中加深钱包份额的增购订阅。负面解读是，独立证据同样指出部署复杂、功能缺口和定价敏感；
              若竞争 AppSec 平台压缩差异化，这些因素会拖慢转化或扩张。              因此，业务很可能值得认真尽调，却不能仅凭公开证据
              做出完整投资判断：收入质量方向良好，利润路径未解，若没有私有财务材料，也无法有把握判断融资依赖。
