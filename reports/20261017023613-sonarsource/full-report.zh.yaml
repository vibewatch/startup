      - number: '1.2'
        title: 规模、领导层与商业信号
        blocks:
          - type: paragraph
            body: >-
              当前材料池里最强的规模信号来自公司自身：Sonar 称平台有超过 700 万名开发者使用，财富 100 强中有 75% 依赖该平台，并称截至 2026 年 6 月 ARR 已超过 $430
              million。同一批发布材料确认 Tariq Shaukat 为 CEO，也是公司 AI 时代定位的公开代表，为本章补上了最新领导层锚点；但材料池没有独立重新确认更完整的
              高管团队、董事会、总部或付费客户数。因此，证据足以确认商业动能，却不足以把私营公司的财务或治理细节 当作已更新事实。
