  - id: FE001
    title: Sonar 产品架构图
    type: stack
    summary: Sonar 的产品栈在共享验证引擎之上叠加代码编写界面；独立标准则提高供应链透明度和修复控制的证据门槛。
    data:
      layers:
        - label: 开发者入口
          detail: 编写、审查代码或调用代理的位置
          items:
            - SonarQube for IDE 插件
            - SonarQube CLI
            - SonarQube MCP Server
            - 拉取请求分析与装饰
        - label: 验证引擎
          detail: 共享的策略与分析层
          modules:
            - 质量配置与质量门
            - 覆盖代码、IaC 和依赖项的静态分析
            - 架构分析
            - Advanced Security 界面
        - label: 代理式服务
          detail: 叠加在分析之上的可选 AI 产品
          modules:
            - Sonar Vortex
            - SonarQube Remediation Agent
            - Hunter Agent
            - Gitar AI Code Review
          outputs:
            - 受治理的编码代理上下文
            - 已验证的修复拉取请求
            - 深层安全发现
        - label: 集成
          detail: Sonar 在 SDLC 周边接入的系统
          modules:
            - GitHub
            - GitLab
            - Azure DevOps
            - CI/CD 流水线
        - label: 部署与证据控制
          detail: 运营选择与外部供应链要求
          modules:
            - SonarQube Cloud SaaS
            - SonarQube Server 自托管
            - SBOM 组件清单
            - VEX 漏洞适用性
        - label: 治理产出
          detail: 团队据此采取行动的工件与控制
          outputs:
            - 质量门通过或失败
            - 安全发现与警报
            - 架构漂移问题
            - 待办修复拉取请求
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE013
  - id: FU001
    title: 从免费入口到企业扩展的客户旅程
    type: journey-map
    summary: 公开产品套餐暗示了一条从免费或社区入口起步的旅程；当治理、分支感知审查或代理式修复变得有价值时，客户会继续扩展。
    data:
      items:
        - label: 免费 IDE / 社区入口
          actor: 个人开发者或小型开源维护者
          stage: 试用
          touchpoints:
            - Community Build 面向个人开发者和极小团队。
            - SonarQube for IDE 可免费安装，并即时反馈问题。
        - label: Cloud 自助试点
          actor: 小团队负责人
          stage: 采用
          touchpoints:
            - SonarQube Cloud 分析在 5 万行代码以内免费。
            - Team 层级提供 14 天无承诺试用。
        - label: CI/CD 质量门上线
          actor: 工程经理或 DevOps 负责人
          stage: 生产使用
          touchpoints:
            - 团队将分支分析、拉取请求装饰和质量门加入发布工作流。
            - 独立评测称 SonarQube 已嵌入持续集成流水线。
        - label: 多项目标准化
          actor: 平台工程或 AppSec
          stage: 扩展
          touchpoints:
            - Enterprise 套餐增加组合、合规以及更广泛的语言 / 安全控制。
            - TrustRadius 评测者描述了跨多个项目和语言的全组织使用。
        - label: 大规模部署 / 受监管部署
          actor: 中央平台负责人
          stage: 规模化
          touchpoints:
            - Data Center 推荐用于 20M+ LOC 和高可用场景。
            - 一位经过审核的评测者称，其部署覆盖 700 多个项目和略超 2000 万行代码。
        - label: 代理式修复加购
          actor: CTO、AppSec 或软件工程负责人
          stage: 扩展测试
          touchpoints:
            - Sonar 增加修复代理，将价值延伸到代码检测之外。
            - SiliconANGLE 称，收购 AutoCodeRover 意在为客户自动化调试和问题修复。
            - 开源 SAST 替代品增加了证明企业治理和工作流价值的必要性。
    approximationNotes: 这组顺序根据套餐、评测轶事和发布说明推断；它展示可能的扩展路径，而不是经过测量的转化漏斗。
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU008
      - CU012
      - CU013
