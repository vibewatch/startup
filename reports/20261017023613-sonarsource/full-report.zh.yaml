            body: >-
              Sonar 在 2026 年的发布显示，公司正有意从代码扫描扩展到代理式开发控制。2026.1 LTA 增加了 AI 原生 IDE 集成和 MCP 访问，并扩大供应链安全功能；2026.4
              增加专门针对代理生成代码的质量门禁，并将架构分析 引入 Server；2026.5 发布文档则把 Remediation Agent、Hunter Agent 和 Sonar Vortex 正式纳入企业产品
