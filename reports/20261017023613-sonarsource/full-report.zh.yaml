      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - AI 验证产品显著推动扩张，且 Sonar 证明其留存和利润率质量达到高溢价水平。
        - 以 $430M ARR 计算 10 倍至 12 倍，意味着约 $4.3B-$5.2B EV，大致维持或略高于陈旧的公开估值。
        - 需要 NRR、盈利能力和产品附加率的最新证据。
        - 新的一级市场估值，加上已披露的高效增长指标。
      - - 基准
        - Sonar 仍是品类领导者，但定价更像一家强劲的后期软件平台，而不是独一无二的 AI 异类。
        - 7 倍至 9 倍 ARR 意味着约 $3.0B-$3.9B EV，低于 2022 年公开估值，但仍高于软件行业中位数。
        - 如果 AI 功能不能转化为持久的增购，溢价会收窄。
        - 一笔指标扎实但不属顶尖的软件交易。
      - - 悲观
        - 倍数继续压缩，或尽调显示留存更弱、增长更慢，或者条款中的优先权更重。
        - 4 倍至 6 倍 ARR 意味着约 $1.7B-$2.6B EV，更接近 2026 年广义软件行业中位数。
        - 下轮融资观感、老股折价，或现金效率较弱。
        - 没有新的估值证据，单位经济性仍持续不透明。
    notes: 参考 EV 区间基于 2026 年 6 月 ARR 和 2026 年行业倍数资料推导；它们是谈判锚点，不是 DCF。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV010
      - CV014
