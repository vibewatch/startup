  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合：平台广度与单点工具替代品
        blocks:
          - type: paragraph
            body: >-
              保留的材料显示，Sonar 面对的不是一个整齐的同业群，而是两类差异很大的替代方案。一边是 Sonar 把自己 定位成集成式代码验证层，在 IDE、拉取请求和 CI 工作流中覆盖可维护性、可靠性、安全及 AI
              生成代码审查； 另一边则是更窄的开源工具：Opengrep 明确试图用完全开源的引擎让 SAST 商品化，ESLint 仍是广泛采用的 JavaScript/JSX 检查器，支持自动修复并嵌入编辑器和
              CI。因此，Sonar 不只要防守知名商业 AppSec 厂商， 还要面对只想用更便宜、更简单解决方案的团队。实际市场因此是分层的：买家要治理、部署选择和多语言覆盖时， Sonar 能收取更高价值；买家只需要
              OSS 引擎或特定语言的 lint 栈时，则容易被替代。
            claimRefs:
              - CP001
              - CP008
              - CP009
              - CP012
