  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 有证据支持的观点
      - 哪些情况会改变观点
    rows:
      - - 正论：战略规模
        - Sonar 称 ARR 已超过 $430M，服务 7M+ 开发者，覆盖《财富》美国 100 强中的 75%。
        - 若确认增速放缓或收入结构质量下降，战略规模溢价会被削弱。
      - - 正论：AI 时代的可选性
        - 独立的 AutoCodeRover 研究展示了利用 LLM 和代码搜索、全自动解决问题的方法。
        - Sonar 修复产品的附加率、定价或采用数据，可能证实或削弱溢价叙事。
      - - 反论：估值锚点陈旧
        - 上一次公开估值仍是 2022 年融资对应的 $4.7B；对照 2026 年 6 月 ARR，相当于约 10.9 倍 ARR。
        - 新一轮融资或按新清算价格进行的老股交易会取代这个陈旧锚点。
      - - 反论：质量指标缺失
        - 公开证据仍缺少 NRR、毛利率、EBITDA / 现金消耗和优先权条款，而 2026 年买方正是靠这些指标区分高溢价软件与软件中位水平。
        - 管理层披露，或尽调资料室中关于留存、利润率、现金和优先权的证据，可能显著提升信心。
    notes: 这张表将业务质量证据与入场价格证据分开；要得出买入结论，两者都必须成立。
