              - CM014
      - number: '2.4'
        title: 增长驱动、采用约束与仍待证明之处
        blocks:
          - type: paragraph
            body: >-
              材料池支持 Sonar 的真实需求逻辑：AI 生成及代理生成代码增加了验证负担，监管机构和企业买家把安全设计前置，
              云原生开发也持续偏好嵌入既有工作流的连续测试。但同一批证据也暴露商业化约束。企业级代理功能位于免费和 小团队版本之上，部分功能需要单独订阅及超额用量管理；自托管代理栈还要在核心服务器之外运行容器化组件，
              增加部署复杂度。独立 AST 评论也把成本、集成复杂度、技能短缺和误报风险列为采用阻力。最大未决问题是： Sonar 能否足够快地把广泛的开发者入口转成持久的付费扩张，以跨过这些摩擦；材料池没有独立的客户预算或
              失败试点证据。
            claimRefs:
              - CM008
              - CM011
              - CM014
              - CM015
              - CM016
