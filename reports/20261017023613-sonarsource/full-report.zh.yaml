      - number: '3.2'
        title: 包装、部署与工作流杠杆决定购买
        blocks:
          - type: paragraph
            body: >-
              Sonar 自身的产品包装，比材料池展示的任何单一外部对手都更能拓宽竞争边界。SonarQube Cloud 被呈现为面向 快速迭代 DevOps 团队的托管 SaaS；SonarQube Server
              面向需要数据驻留、边界内部署和更深控制的企业。Community Build 为想要 Sonar 工作流但无法承担企业定价的买家提供免费降级路径。商业版本再通过分支及拉取请求分析、高级 安全、更广语言支持和
              Sonar Vortex、Hunter Agent、Remediation Agent 等 AI 时代产品，拉开与免费基线的距离。 换言之，Sonar
              的竞争杠杆不只是检测深度，而是把多个工作流控制装进一个平台；替代决策必须重建政策、集成和 部署适配，而非只替换扫描输出。
            claimRefs:
