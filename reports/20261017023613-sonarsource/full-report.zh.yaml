      - number: '3.3'
        title: 护城河在企业工作流广度上最强，在价格敏感边缘最弱
        blocks:
          - type: paragraph
            body: >-
              证据指向一条真实但不均衡的护城河。买家看重多语言分析、安全模块、质量门禁、仪表盘、部署灵活性和新代理治理 功能时，Sonar
              的位置最强。替换项目必须重建一套可运行的运营模式，而不只是换个扫描器，因此替换更难。但同一 批证据也说明了边缘处护城河为何会收窄：Community Build 是 Sonar 家族内的免费自托管退路，公开
              DevOps 讨论 显示 SonarCloud 存在明显价格敏感，Opengrep 也在明确推动开源 SAST 商品化。由此看，客户只重视一个功能、只需 少数语言，或愿意自己拼接单点工具时，Sonar
              的定价保护伞最容易暴露。
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP012
