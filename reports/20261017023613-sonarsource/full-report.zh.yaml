  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“跟踪 / 继续研究”，而不是在最近一次披露的价格背景下直接买入。Sonar 的商业位置仍然亮眼：公司 称 ARR 已超过 $430 million，服务超过 700 万名开发者，并嵌入大型企业。关于
              AutoCodeRover 的独立研究也 支持自主软件问题解决的技术相关性，Sacra 则报告应用安全同业 Semgrep 已通过多轮融资筹得 $204 million。 这些信号支持继续尽调，但都不能证明
              Sonar 的付费扩张或当前成交价。

              问题在于，公开价格支撑没有随着运营进展同步更新。最新披露的估值仍是 2022 年的 $4.7 billion 融资轮； 将该估值与 2026 年 6 月 ARR 对照，隐含约 10.9x ARR。独立的 2026
              年软件估值参考表明，只有顶级或 AI 溢价 情景才能支撑这一水平；对于仍未公开披露留存率、毛利率、EBITDA、烧钱或清算优先权结构的发行人，不能直接
              视为合理。因此投资判断应对价格敏感：只有新一轮融资、二级交易或谈判入场价接近当前软件倍数，且管理层能验证 单位经济时，才值得推进。
