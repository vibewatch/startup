      - number: '2.3'
        title: 买家、用户与预算分层
        blocks:
          - type: paragraph
            body: >-
              Sonar 的产品包装有意从个人开发者和极小团队，逐步上探企业开发组织，再进入全企业治理。免费的 Community Build 和 IDE
              扩展降低了开发者采用门槛；商业版本增加分支及拉取请求分析、更广语言支持、高级安全、合规报告 和集中管理。产品页面进一步区分部署场景：SonarQube Cloud 面向追求快速见效的云原生团队，SonarQube
              Server 面向重视数据驻留、自定义集成和部署控制的受监管行业及大型企业。因此日常用户通常是开发者或开发团队，但 产品从编程助手升级为政策与治理层后，长期预算会向工程管理层、平台团队和 AppSec 上移。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
