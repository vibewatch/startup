        title: 展示项
        blocks:
          - type: callout
            title: 企业差异化来自集成式工作流控制
            body: Sonar 最强的竞争位置不是某一次扫描结果，而是把部署选择、拉取请求工作流、安全模块和新代理验证产品放进 一套受治理的技术栈。
            calloutType: strength
