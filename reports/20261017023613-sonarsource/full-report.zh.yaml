              Sonar 的公开牵引指标足以支撑产品驱动与企业增购并存的叙事，即使传统效率指标仍属私有信息。公司称截至 2026 年 6 月 ARR 已超过 $430 million，超过 700 万名开发者使用
              Sonar，财富 100 强中有 75% 依赖它。合作方 市场页面另称客户超过 6,000 家、使用 Community Edition 的组织超过 200,000 家；Sonar 还称用户每天分析超过 750
