          - type: paragraph
            body: >-
              Sonar 上一次公开估值足以证明历史投资者信心，却已经过时到不能可靠代表当前成交价。2022 年公司称一笔 $412 million 融资将 Sonar 估值定为 $4.7 billion；2026 年 6
              月公司披露 ARR 已超过 $430 million，平台 得到超过 700 万名开发者信任。这些信息支持其成为规模大、与品类相关的业务，但不能单独证明 2026 年末新投资者 仍应支付溢价倍数。

              独立市场参考显示软件估值环境已经重置。Eilla 将 2026 年公开 SaaS 倍数中位数放在约 4.8x–6.3x 收入， 私有 SaaS 并购放在约 4.1x–4.7x，10x–15x
              留给顶四分位结果。Acquiry 则认为传统 SaaS 大多处于 1.5x–8x ARR，10x–20x 只留给 ARR 增长超过 50% 的 AI 原生企业。Sonar 隐含的 10.9x ARR
              并非显然不可能，但需要 当前公开材料尚未充分提供的高留存、高毛利和 AI 变现证据。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景区间应以 2026 年 6 月 ARR 为锚，再按 2026 年软件买家愿意为质量、增长和 AI 防御力支付的价格调整。 乐观情景假设 Sonar
              把自主修复转成扩张收入，同时满足把安全视为核心业务要求的安全设计预期。基准情景假设 Sonar 仍是品类领导者，但市场把它当作强劲的后期软件公司，而非独特的 AI 复利资产。悲观情景假设倍数向传统
              软件区间压缩，或出现留存转弱、增长放缓或偏好权重过高的条款。

              有用的纪律是把公司质量与入场质量分开。即使入场价不对导致回报疲弱，Sonar 仍可能是强战略资产。在最新估值 标记和单位经济资料出现前，估值区间应被视为谈判锚点，而不是可直接投资的真相。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
              - CV014
      - number: '8.4'
        title: 退出准备度、尽调问题与论点击穿触发器
        blocks:
          - type: paragraph
            body: >-
              Sonar 的规模和代码验证定位对应持久的企业需求，因此对战略买家和后期投资者仍有战略相关性。AutoCodeRover 的独立研究证明自主解决问题在技术上可行；CISA 的 Secure by Design
              指南则要求产品设计把客户安全当作核心 业务要求，而不只是技术功能。这支持继续尽调，但产品相关性仍必须转化为付费扩张和持久增长。

              最终尽调应聚焦 2026 年买家明确奖励的变量：净留存、毛利率、CAC 效率、EBITDA 或烧钱轨迹、当前现金，以及 2022 年融资背后的完整股权结构表与优先股堆叠
              与优先权结构。论点击穿触发器很清楚：若最新融资仍高于过时的隐含溢价却没有 盈利能力证明，上行空间会受损；若验证后的净留存低于 110%、增长明显减速，或条款过度偏向优先权，也会削弱
              溢价逻辑，因为近期软件买家愿意为高效复利付费，而不只是为规模付费。
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 什么会让建议转为买入
            body: 最新融资或二级交易价格接近当前软件区间，并同时有经过验证的留存、毛利率和现金效率证据，将显著改善风险回报。
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV010
              - CV014
          - type: callout
            title: 什么会击穿论点
            body: 净留存低于 110%、增长质量明显转弱，或现有股权结构表背后的条款过度偏向优先权，都会让当前溢价叙事难以辩护。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV014
