      - number: '1.4'
        title: 独立核验与更新缺口
        blocks:
          - type: paragraph
            body: >-
              本章的独立证据能指明方向，但比官方更新材料薄弱。一份第三方比较资料称 SonarSource 成立于 2008 年， SonarQube 于 2007 年首次发布；实践者评论仍指出其相较更宽泛 AppSec
              套件存在部署复杂、定价阻力和感知 安全缺口。这些信号足以压低管理层的动能叙事，但无法填补最重要的私营公司尽调缺口：最新估值、累计融资、
              总部、董事会构成和付费客户数在材料池里都没有依据，应留待后续跟进，不应从过时历史中补回。
