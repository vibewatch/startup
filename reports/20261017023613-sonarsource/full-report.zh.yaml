  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：更广泛 AST 格局中的代码验证
        blocks:
          - type: paragraph
            body: >-
              Sonar 不宜被定义成通用网络安全厂商，也不是纯运行时 AppSec 工具。其产品从 IDE 起步，延伸到拉取请求、 CI/CD 以及自管或 SaaS
              治理，属于自动化代码审查、静态分析和验证。广义应用安全测试的市场估算通常还包括 DAST、IAST、移动测试和 SCA 等相邻类别；而 Sonar 的切入口更靠前，绑定的是开发者工作流采用度。本章实际采用
              的市场边界因此是代码质量和 SAST 主导的验证，再加上产品嵌入日常工程后可以争取的合规及 AI 代码治理支出。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
      - number: '2.2'
        title: 市场测算视角：可用的 SAST 口径与膨胀的广义 AST 标题数字
        blocks:
          - type: paragraph
            body: >-
              材料池给出的市场测算教训很清楚：先划定边界，再看自上而下的数字。Verified Market Research 发布的 AST 口径很宽，覆盖 SAST、DAST、IAST、移动测试和
              SCA，虽能给出数十亿美元级标题数字，但若直接当作 Sonar 核心切入口的 TAM，就会高估可服务市场。Mordor Intelligence 的口径更窄，更接近 Sonar 的代码验证起点，
              还提供可用于买家排序的细分数据。与其硬套一套虚假的 TAM/SAM/SOM，不如把 Sonar 看成参与一个快速增长的 安全测试品类，其可变现重心是企业级 SAST 及相邻治理，而不是整个应用安全市场。
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM010
              - CM013
