chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与当前产品版图
        blocks:
          - type: paragraph
            body: >-
              保留的官方材料将 SonarQube 描述为代码质量、代码安全和验证平台，直接在开发者工作流内审查人工编写、 AI 生成及开源代码。如今商业产品覆盖 SonarQube Cloud 和自托管的 SonarQube
              Server，版本结构仍从 Community Build 逐级延伸到 Developer、Enterprise 和 Data Center 服务器版本。这一组合对全文都很关键： 它把 Sonar
              定位成工作流与治理层，而非单点扫描器，也说明后文关于采用度、企业覆盖和代理式附加产品的主张， 应被理解为既有宽产品基础上的延伸，而不是凭空出现的新业务。
            claimRefs:
