        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Sonar 采用分层变现，而非单一产品 SKU。官方文档显示核心产品由 SonarQube Server、SonarQube Cloud 和 SonarQube for IDE
              三部分组成；公司主页与发布说明又加入 Advanced Security、Sonar Vortex、Hunter Agent 和 Remediation Agent 等新的付费 AI /
              安全附加产品。商业阶梯围绕代码行数阈值搭建：版本比较文章把 Developer 放在 100K+ LOC、Enterprise 放在 1M+ LOC、Data Center 放在 20M+
              LOC；第三方定价信息则暗示账户沿阶梯上移 时 ACV 会明显扩张。多条“先落地、再扩张”路径有利于收入质量，但公开证据仍未拆清订阅、维护、超额用量和新 用量计费附加产品的确切占比。
