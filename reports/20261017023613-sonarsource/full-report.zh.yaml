  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模和 AI 产品势头支持继续尽调，但定价证据陈旧、单位经济性缺失，因此结论仍是跟踪 / 继续研究。
    data:
      nodes:
        - id: scale
          label: 规模证据
          note: 2026 年 6 月公司证据称 ARR 为 $430M，开发者达 7M+，覆盖《财富》美国 100 强。
        - id: product
          label: AI 修复潜力
          note: 独立的 AutoCodeRover 研究展示了利用 LLM 和代码搜索自动解决问题。
        - id: disclosure
          label: 披露缺口
          note: 公开证据仍缺少 NRR、毛利率、现金消耗、现金和优先权细节。
        - id: market
          label: 2026 年估值摩擦
          note: 除非质量和 AI 防御性极其出色，否则独立软件基准会将估值重置到中个位数收入倍数。
        - id: entry
          label: 新价格检验
          note: 需要新一轮融资或老股交易估值，证明高溢价定价仍能成交。
        - id: decision
          label: 跟踪 / 继续研究
          note: 只有更新后的价格和尽调显示高溢价留存、利润率以及可控的优先权负担时才买入。
      edges:
        - from: scale
          to: product
          label: 支持战略相关性
        - from: product
          to: disclosure
          label: 仍需指标证明
        - from: disclosure
          to: market
          label: 限制高溢价投资判断
        - from: market
          to: entry
          label: 确定谈判区间
        - from: entry
          to: decision
          label: 促成价格敏感型建议
    approximationNotes: null
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV014
