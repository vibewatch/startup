evidenceGaps:
  - type: missing-source
    severity: material
    topic: headquarters-and-stage
    missingEvidence: A current corporate or filing source that names Sonar's legal headquarters and current company stage.
    whyItMatters: Identity and jurisdiction affect later diligence on governance, hiring footprint, and compliance obligations.
    diligencePath: >-
      Refresh the official about or legal page, or pull a current financing or corporate filing that states headquarters
      and entity status.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation-and-capital-raised
    missingEvidence: >-
      A fresh financing announcement, tender mark, filing, or other primary source for valuation and cumulative capital
      raised.
    whyItMatters: Valuation stance and ownership dilution cannot be refreshed from ARR or adoption claims alone.
    diligencePath: >-
      Request management materials or retrieve a current financing/tender document before carrying forward any valuation
      or total-raised figure.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-roster
    missingEvidence: A current leadership or board roster with founder and director names plus functional responsibilities.
    whyItMatters: >-
      Without the roster, key-person dependency and governance quality cannot be judged beyond the CEO's public
      visibility.
    diligencePath: >-
      Refresh the official leadership page or investor materials and then rebuild the leadership table with named
      executives and directors.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: paid-customer-count
    missingEvidence: A current source that distinguishes paid customers or paid accounts from broad developer adoption.
    whyItMatters: >-
      Developer reach is not the same as monetized customer penetration, which is central to valuation and
      sales-efficiency judgment.
    diligencePath: >-
      Look for current pricing, customer, or investor materials that disclose paying organizations, seats, or logo
      counts.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A consistent bottom-up market model that converts Sonar's relevant buyer populations into spend by deployment
      model and edition tier, plus a reconciled broad-AST forecast.
    whyItMatters: >-
      The assigned sources provide incompatible broad-AST and narrower SAST lenses, and Verified Market Research's
      forecast endpoints do not reconcile with its stated CAGR, so a single TAM/SAM/SOM stack would imply more precision
      than the evidence supports.
    diligencePath: >-
      Request management's current pipeline segmentation by cloud/server, enterprise tier, and seat or LOC pricing
      bands; reconcile it against an external peer set focused specifically on SAST and code-quality tooling.
    relatedQuestionRefs:
      - QM002
  - type: missing-source
    severity: material
    topic: disconfirming-demand-signals
    missingEvidence: >-
      Independent evidence of failed deployments, budget pullbacks, churn, or buyer dissatisfaction for Sonar-adjacent
      code-verification tooling.
    whyItMatters: >-
      Without independent negative demand evidence, the chapter can describe adoption frictions but cannot quantify how
      often those frictions block paid expansion.
    diligencePath: >-
      Add procurement records, peer-review forums, customer references, or independent reporting on AST consolidation,
      pricing pressure, or abandoned rollouts.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: budget-conversion
    missingEvidence: >-
      Conversion metrics from free developer entry points into paid enterprise accounts, including who actually approves
      budget by segment.
    whyItMatters: >-
      The go-to-market argument depends on bottom-up adoption maturing into centralized spend, but the assigned pool
      does not disclose conversion rates or seat economics.
    diligencePath: >-
      Request cohort data for free-to-paid conversion, expansion by edition, and security-add-on attach rates segmented
      by customer size and industry.
    relatedQuestionRefs:
      - QM003
      - QM007
  - type: missing-source
    severity: material
    topic: named-commercial-peer-benchmarking
    missingEvidence: >-
      Direct current pricing, packaging, and product-proof pages for named commercial competitors beyond open-source
      substitutes.
    whyItMatters: >-
      Without retained direct-peer evidence, the chapter can assess substitute pressure and Sonar's own packaging but
      cannot rank commercial peers with the same confidence as OSS alternatives.
    diligencePath: >-
      Add retained direct URLs for commercial AppSec and code-quality peers, especially current pricing, PR workflow,
      SCA, and deployment-control pages.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: realized-enterprise-pricing-and-multi-homing
    missingEvidence: >-
      Realized discounting, bundled enterprise contract terms, and customer multi-homing behavior across Sonar and named
      rivals.
    whyItMatters: >-
      These facts determine how durable Sonar's pricing umbrella is in procurement, but the retained pool only surfaces
      directional public evidence and not contract-level proof.
    diligencePath: >-
      Request customer references, procurement screenshots, or contract data showing negotiated pricing, add-on
      attachment, and coexistence patterns.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: liquidity-runway
    missingEvidence: Current cash balance, monthly burn, runway, and any debt or lease obligations.
    whyItMatters: These are the minimum inputs needed to assess capital adequacy and financing dependency.
    diligencePath: Request the latest board package or monthly finance dashboard with cash, burn, runway, and debt schedules.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, support burden, CAC, payback, NRR, and cohort expansion by product and customer segment.
    whyItMatters: Without unit economics, ARR scale does not tell investors whether growth is efficient or durable.
    diligencePath: Request segment P&Ls, sales-efficiency dashboards, and retention cohorts for cloud, server, and add-on products.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-recognition
    missingEvidence: >-
      Product-line revenue mix and the accounting split between subscription, maintenance, perpetual license, overage,
      and services.
    whyItMatters: Revenue quality depends on how much topline is recurring, usage-based, support-linked, or implementation-heavy.
    diligencePath: Request a revenue bridge by SKU and the current revenue recognition memo used for core products and add-ons.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: agentic-product-adoption
    missingEvidence: >-
      Product-level customer counts, paid attach rates, and deployment footprints for Sonar Vortex, Remediation Agent,
      and Hunter Agent.
    whyItMatters: >-
      Without install-base and monetization detail, it is hard to separate broad platform awareness from durable demand
      for the new agentic products.
    diligencePath: Request active-customer counts, bookings, renewal data, and reference accounts for each AI add-on.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: agentic-performance-validation
    missingEvidence: >-
      Independent benchmark or customer evidence validating quality gains, precision, and operational ROI for Vortex and
      Remediation Agent in production.
    whyItMatters: >-
      Official material describes meaningful workflow benefits, but underwriting product maturity needs third-party
      proof that the automation works at enterprise scale.
    diligencePath: >-
      Request redacted pilot results, customer references, and benchmark methodology for the cited AI-agent performance
      claims.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: Paid-customer count, NRR, GRR, logo churn, and median contract duration by product line.
    whyItMatters: These metrics determine whether Sonar's broad usage footprint converts into durable recurring revenue.
    diligencePath: Request cohort retention tables, renewal dashboards, and product-line customer counts from management.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-10 concentration, and any reseller or channel dependence disclosures.
    whyItMatters: Concentration can turn strong enterprise penetration into meaningful downside if a few accounts dominate bookings.
    diligencePath: Request customer concentration schedules, pipeline mix, and channel attribution from finance and sales ops.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: named-customer-outcomes
    missingEvidence: Named production case studies with deployment scope, modules purchased, outcomes achieved, and renewal status.
    whyItMatters: Logo references show credibility, but they do not prove deployment depth, expansion, or value realization.
    diligencePath: Ask for customer references, case studies, and win-loss summaries segmented by cloud versus server deployments.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: >-
      Twelve- to twenty-four-month incident history, postmortems, SLA-credit rates, and any outage metrics for SonarQube
      Cloud plus the new agentic runtime components.
    whyItMatters: >-
      Public materials describe controls and architecture but do not show whether the expanded operating surface has
      produced reliability failures or near misses in production.
    diligencePath: >-
      Request status-page history, incident review packets, and top enterprise support themes by severity for both cloud
      and self-hosted agentic deployments.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: concentration-and-dependency
    missingEvidence: Revenue concentration by large customers, platform ecosystems, and cloud or model-provider dependency share.
    whyItMatters: >-
      Public integration breadth does not reveal whether one or two platforms or customers can disproportionately affect
      sales efficiency, roadmap leverage, or renewal risk.
    diligencePath: >-
      Obtain top-customer concentration, channel mix, top platform attachment, and provider-spend concentration in
      management diligence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: regulatory-readiness-register
    missingEvidence: >-
      Product-level CRA applicability analysis, internal compliance owners, and any planned third-party assessments or
      audit artifacts tied to Sonar's European go-to-market.
    whyItMatters: >-
      The public sources provide dates and high-level obligations, but they do not prove which Sonar offerings are in
      scope or how prepared the company is to operationalize compliance.
    diligencePath: >-
      Request legal and product compliance workpapers mapped to each major SKU, with milestone owners and any external
      assessment requirements.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: customer-roi-and-overage
    missingEvidence: >-
      Current ARR by product tier, renewal rates, false-positive tuning effort, overage incidence, and support-cost
      trends for enterprise accounts.
    whyItMatters: >-
      Public reviews indicate meaningful cost and maintenance friction, but they do not quantify whether that friction
      is shrinking, stable, or worsening in the installed base.
    diligencePath: >-
      Request cohort retention, gross-margin bridge, support-ticket trends, and overage usage by plan tier before
      underwriting a scalable operating model.
    relatedQuestionRefs:
      - QR008
  - type: stale
    severity: material
    topic: fresh-valuation-mark
    missingEvidence: >-
      A post-2022 primary financing, secondary clearing price, or board-approved internal mark tied to current operating
      metrics.
    whyItMatters: >-
      The chapter can frame ranges, but without a refreshed price anchor it cannot validate whether investors are still
      paying a premium multiple for Sonar today.
    diligencePath: Request the latest financing memo, any 409A or board-mark documentation, and current secondary pricing history.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current NRR, gross margin, EBITDA or burn, CAC efficiency, and cash balance.
    whyItMatters: >-
      2026 software buyers pay up for efficient compounding, so missing retention and profitability metrics materially
      reduce conviction in any premium multiple.
    diligencePath: >-
      Obtain board or lender reporting with cohort retention, gross margin bridge, cash runway, and profitability
      trajectory.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: >-
      Current cap table, liquidation preferences, participation terms, and any secondary or structured-financing
      overhang.
    whyItMatters: >-
      Headline enterprise value can overstate investor proceeds and distort downside protection if preference terms or
      senior securities are material.
    diligencePath: >-
      Review the latest cap table, financing documents, and counsel summary of preference stack and protective
      provisions.
    relatedQuestionRefs:
      - QV003
      - QV008
