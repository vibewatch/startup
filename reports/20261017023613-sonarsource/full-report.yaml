  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive set: platform breadth versus point-tool substitutes'
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports a landscape with two materially different alternatives to Sonar rather than one
              clean peer group. On one side, Sonar positions the platform as an integrated code-verification layer
              covering maintainability, reliability, security, and AI-generated code review across IDE, pull request,
              and CI workflows. On the other side, the strongest substitutes in this worker pool are narrower
              open-source tools: Opengrep is explicitly trying to commoditize SAST with a fully open-source engine,
              while ESLint remains a widely adopted JavaScript/JSX linter with auto-fix and editor/CI embed. That means
              Sonar is not only defending against named commercial AppSec vendors; it is also defending against teams
              that decide they only need a cheaper or simpler slice of the job. The practical result is a segmented
              market in which Sonar can command higher value when the buyer wants governance, deployment choice, and
              multi-language coverage, but faces substitution when the buyer only needs an OSS engine or a
              language-specific linting stack.
            claimRefs:
              - CP001
