      - number: '6.3'
        title: Expansion logic is visible, but retention and concentration remain opaque
        blocks:
          - type: paragraph
            body: >-
              Sonar’s monetization and expansion logic is visible in public sources even when durability metrics are
              not. Paid value appears to unlock around branch analysis, pull-request decoration, portfolio management,
              compliance, and agentic remediation. At the same time, The New Stack reports that Opengrep offers
              unrestricted scanning capabilities and portable outputs, illustrating open-source substitution pressure at
              the lower end of the market. Livmo identifies growth, NRR, Rule of 40 performance, and customer
              concentration as major valuation drivers, yet reviewed Sonar materials do not disclose NRR, GRR, churn,
              contract length, channel mix, or top-customer revenue exposure. That keeps the adoption story
              directionally strong but commercially under-instrumented.
            claimRefs:
              - CU007
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Land-small, expand-on-governance faces open-source pressure
            body: >-
              Public packaging suggests Sonar can start with a free IDE or community install, then expand when teams
              need PR decoration, portfolio controls, or agentic remediation. Opengrep's unrestricted open-source
              scanning surface makes that expansion case dependent on governance and workflow value rather than basic
              scanner access alone.
            calloutType: insight
            claimRefs:
              - CU001
              - CU004
              - CU012
              - CU013
          - type: callout
            title: Public customer disclosure is still shallow for a late-stage company
            body: >-
              The reviewed source set supports broad adoption claims, but it does not disclose paid customer count,
              renewal metrics, or concentration, which keeps customer durability and revenue quality under-verified.
            calloutType: risk
            claimRefs:
