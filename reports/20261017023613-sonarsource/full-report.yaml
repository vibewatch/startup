              - CR017
      - number: '7.3'
        title: Operational, quality, and security-delivery risk
        blocks:
          - type: paragraph
            body: >-
              The main operational risk is that Sonar's answer to agent-generated code also increases the number of
              moving pieces customers must trust. Sonar itself now frames agentic code as creating new dependency and
              injection risks, and the new products run outside the core server in orchestrated containers with egress
              and storage components. That expands the failure and configuration surface even before customer-specific
              LLM, CI/CD, and identity controls are layered in. Public mitigants are visible — self-hosted deployment,
              air-gapped options, cloud assurance, and quality gates — but customer review commentary still flags
              upgrade churn, backward-compatibility surprises, false positives, and operational overhead. That makes
              reliability and customer-friction monitoring a live diligence item, not a solved problem.
            claimRefs:
              - CR005
              - CR007
