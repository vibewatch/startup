      - number: '7.4'
        title: Dependency risk, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Dependency risk is distributed across external platforms, model providers, and internal execution. Sonar
              is deeply tied to GitHub, GitLab, Azure DevOps, Bitbucket, and third-party AI endpoints, so integration or
              policy changes can create customer pain quickly. The AutoCodeRover acquisition adds integration and hiring
              risk while Sonar expands an R&D footprint in Singapore. Public GitLab metrics also provide a visible
              valuation and operating benchmark that Sonar's private disclosure does not match. The practical kill
              criteria are therefore monitorable: weak CRA readiness, repeated upgrade or false-positive complaints,
              blocked analyses from license controls, unclear agentic data governance, or a refreshed valuation that
              ignores public-market economics.
            claimRefs:
