      - number: '6.2'
        title: Public adoption proof is strongest at usage breadth, weaker at paid-account specificity
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption evidence is breadth, not monetization detail. Sonar’s June 2026 press
              release claims more than 7 million developers and deep Fortune 100 penetration, while independent review
              evidence describes a low-friction Cloud trial and production use inside CI pipelines, across multiple
              languages, and in one case across more than 700 projects and more than 20 million lines of code. OWASP's
              ASVS provides a separate buyer-side benchmark for testing technical security controls and
              secure-development requirements. Together, the evidence shows a large workflow footprint and a
              standards-aware buying context, but it still does not separate free, paid, or expansion cohorts cleanly.
            claimRefs:
              - CU004
