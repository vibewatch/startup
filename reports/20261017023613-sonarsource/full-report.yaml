              - CV008
              - CV010
              - CV014
      - number: '8.2'
        title: Current financing context versus market benchmarks
        blocks:
          - type: paragraph
            body: >-
              Sonar's last public valuation anchor remains strong enough to show historic investor conviction but stale
              enough to be unreliable as a current clearing price. In 2022 the company said a $412 million financing
              valued Sonar at $4.7 billion, while June 2026 company disclosure said ARR had surpassed $430 million and
              the platform was trusted by more than seven million developers. That combination supports a large,
              category-relevant business; it does not by itself prove that a new investor should still pay a premium
              multiple in late 2026.


              Independent market references point to a reset software backdrop. Eilla places median 2026 public SaaS
              multiples around 4.8x-6.3x revenue and private SaaS M&A around 4.1x-4.7x, with 10x-15x reserved for
              top-quartile outcomes. Acquiry likewise frames traditional SaaS mostly in a 1.5x-8x ARR band, with 10x-20x
              reserved for AI-native businesses growing above 50% ARR. That means Sonar's stale implied 10.9x ARR
              multiple is not obviously impossible, but it does require premium retention, margin, and AI monetization
              evidence that current public materials do not fully supply.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The scenario range should be anchored on June 2026 ARR and then adjusted by what 2026 software buyers are
              paying for quality, growth, and AI defensibility. The bull case assumes Sonar turns autonomous remediation
              into expansion revenue while meeting the secure-by-design expectation that security be treated as a core
              business requirement. The base case assumes Sonar remains a category leader but the market treats it as a
              strong late-stage software company rather than a unique AI compounder. The bear case assumes multiple
              compression toward traditional software ranges or evidence of weaker retention, slower growth, or
              preference-heavy terms.


              A useful discipline is to separate company quality from entry quality. Sonar may remain a strong strategic
              asset even if the wrong entry price still produces weak returns. Until a refreshed mark and unit-economics
              package exist, valuation ranges should be treated as indicative negotiation anchors rather than investable
              truth.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
              - CV014
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Sonar still screens as strategically relevant to both strategic buyers and late-stage investors because
              its scale and code-verification positioning address a durable enterprise need. Independent AutoCodeRover
              research demonstrates the technical possibility of autonomous issue resolution, while CISA's Secure by
              Design guidance says product design should prioritize customer security as a core business requirement
              rather than merely a technical feature. That supports continued diligence, but product relevance still has
              to translate into paid expansion and durable growth.


              Final diligence should focus on the variables that 2026 buyers explicitly reward: net retention, gross
              margin, CAC efficiency, EBITDA or burn trajectory, current cash, and the exact cap-table and preference
              stack behind the 2022 round. Thesis-break triggers are straightforward. A refreshed financing still above
              the stale implied premium without accompanying profitability proof would weaken upside. Verified sub-110%
              net retention, sharp growth deceleration, or preference-heavy terms would also undermine the premium case
              because recent software buyers pay up for efficient compounding, not for scale alone.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: What would move the call to buy
            body: >-
              A refreshed financing or secondary price closer to current software ranges, combined with verified
              retention, gross margin, and cash-efficiency evidence, would materially improve the risk-reward.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV010
              - CV014
          - type: callout
            title: What would break the thesis
            body: >-
              Sub-110% net retention, meaningfully weaker growth quality, or preference-heavy terms behind the existing
              cap table would make the current premium narrative hard to defend.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV014
