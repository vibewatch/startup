              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is not whether Sonar solves a real problem; public product materials and
              customer reviews both show that code gating and security verification are valuable. The sharper question
              is whether Sonar can extend that trust into the agentic era without increasing operating complexity faster
              than customer ROI. The 2026 releases move the stack toward separately deployed agent containers, external
              LLM providers, and stricter controls for AI-generated code, which is strategically sensible but
              operationally heavier. Customer reviewers still describe upgrade surprises, false positives, and
              meaningful cost overhead, so the downside case is a product that remains important but becomes harder to
              deploy, govern, or justify economically at scale.
            claimRefs:
              - CR004
              - CR005
