  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and AI-product momentum support continued diligence, but stale pricing evidence and missing unit economics
      keep the call at track / research-more.
    data:
      nodes:
        - id: scale
          label: Scale proof
          note: June 2026 company evidence cites $430M ARR, 7M+ developers, and Fortune 100 penetration.
        - id: product
          label: AI remediation potential
          note: Independent AutoCodeRover research demonstrates autonomous issue resolution using LLMs and code search.
        - id: disclosure
          label: Disclosure gap
          note: Public evidence still lacks NRR, gross margin, burn, cash, and preference details.
        - id: market
          label: 2026 valuation friction
          note: >-
            Independent software benchmarks reset toward mid-single-digit revenue multiples unless quality and AI
            defensibility are exceptional.
        - id: entry
          label: Fresh price test
          note: A new round or secondary mark is needed to prove that premium pricing still clears.
        - id: decision
          label: Track / research-more
          note: >-
            Buy only if refreshed pricing and diligence show premium retention, margins, and manageable preference
            overhang.
      edges:
        - from: scale
          to: product
          label: Supports strategic relevance
        - from: product
          to: disclosure
          label: Still needs proof in metrics
        - from: disclosure
          to: market
          label: Constrains premium underwriting
        - from: market
          to: entry
          label: Sets negotiation range
        - from: entry
          to: decision
          label: Drives price-sensitive recommendation
