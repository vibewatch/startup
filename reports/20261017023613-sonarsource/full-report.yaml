  - id: FE001
    title: Sonar product architecture map
    type: stack
    summary: >-
      Sonar's product stack layers authoring surfaces on top of a shared verification engine, while independent
      standards raise the evidence bar for supply-chain transparency and remediation controls.
    data:
      layers:
        - label: Developer entry points
          detail: Where code is authored, reviewed, or invoked by an agent
          items:
            - SonarQube for IDE
            - SonarQube CLI
            - SonarQube MCP Server
            - Pull-request analysis and decoration
        - label: Verification engine
          detail: Shared policy and analysis layer
          modules:
            - Quality profiles and quality gates
            - Static analysis across code, IaC, and dependencies
            - Architecture analysis
            - Advanced Security surfaces
        - label: Agentic services
          detail: Optional AI products layered on top of analysis
          modules:
            - Sonar Vortex
            - SonarQube Remediation Agent
            - Hunter Agent
            - Gitar AI Code Review
          outputs:
            - Governed context for coding agents
            - Verified remediation pull requests
            - Deep security findings
        - label: Integrations
          detail: Systems Sonar plugs into around the SDLC
          modules:
            - GitHub
            - GitLab
            - Azure DevOps
            - CI/CD pipelines
        - label: Deployment and evidence controls
          detail: Operational choice plus external supply-chain expectations
          modules:
            - SonarQube Cloud SaaS
            - SonarQube Server self-managed
            - SBOM component inventory
            - VEX vulnerability applicability
        - label: Governance outputs
          detail: Artifacts and controls teams act on
          outputs:
            - Quality-gate pass or fail
            - Security findings and alerts
            - Architecture drift issues
            - Backlog remediation pull requests
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE013
  - id: FU001
    title: Customer journey from free entry to enterprise expansion
    type: journey-map
    summary: >-
      Public product packaging implies a journey that starts with a free or community entry point and expands when
      governance, branch-aware review, or agentic remediation becomes valuable.
    data:
      items:
        - label: Free IDE / community entry
          actor: Individual developer or small open-source maintainer
          stage: Trial
          touchpoints:
            - Community Build is positioned for individual developers and very small teams.
            - SonarQube for IDE is free to install and gives immediate issue feedback.
        - label: Cloud self-serve pilot
          actor: Small team lead
          stage: Adoption
          touchpoints:
            - SonarQube Cloud analysis is free up to 50k lines of code.
            - Team tier offers a 14-day no-commitment trial.
        - label: CI/CD quality-gate rollout
          actor: Engineering manager or DevOps owner
          stage: Production use
          touchpoints:
            - Teams add branch analysis, pull-request decoration, and quality gates to release workflows.
            - Independent reviews describe SonarQube embedded in continuous integration pipelines.
        - label: Multi-project standardization
          actor: Platform engineering or AppSec
          stage: Expansion
          touchpoints:
            - Enterprise packaging adds portfolio, compliance, and broader language/security controls.
            - TrustRadius reviewers describe organization-wide use across many projects and languages.
        - label: Large-estate / regulated deployment
          actor: Central platform owner
          stage: Scale
          touchpoints:
            - Data Center is recommended for 20M+ LOC and high-availability use cases.
            - A vetted reviewer reports a deployment spanning 700+ projects and just over 20M LOC.
        - label: Agentic remediation attach
          actor: CTO, AppSec, or software engineering leader
          stage: Expansion test
          touchpoints:
            - Sonar added a remediation agent to extend value beyond code detection.
            - >-
              SiliconANGLE says the AutoCodeRover acquisition is intended to automate debugging and issue remediation
              for customers.
            - Open-source SAST alternatives increase the need to prove enterprise governance and workflow value.
    approximationNotes: >-
      Sequence is inferred from packaging, review anecdotes, and release notes; it shows a likely expansion path rather
      than a measured conversion funnel.
    claimRefs:
