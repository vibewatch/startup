  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a **track / research-more** recommendation rather than a buy call at the last
              disclosed price context. Sonar's commercial position is still impressive: the company says it has
              surpassed $430 million in ARR, serves more than seven million developers, and remains embedded across
              large enterprises.       independent research on AutoCodeRover also supports the technical relevance of
              autonomous

              software-issue resolution, while Sacra reports that application-security peer Semgrep has

              raised $204 million across its funding rounds. Those signals support continued

              diligence, but neither proves Sonar's paid expansion or current clearing price.


              The problem is that public price support has not refreshed alongside operating progress. The latest
              disclosed valuation is still the 2022 $4.7 billion round, and mapping that mark against June 2026 ARR
              implies roughly 10.9x ARR. Independent 2026 software valuation references suggest that is defensible only
              for top-tier or AI-premium outcomes, not for an issuer that still does not publicly disclose retention,
              gross margin, EBITDA or burn, or liquidation-preference structure. The right underwriting stance is
              therefore price-sensitive: pursue only if a fresh round, secondary, or negotiated entry moves closer to
              current software multiples and management can validate unit economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
