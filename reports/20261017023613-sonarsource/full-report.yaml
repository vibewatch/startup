  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and the commercial ladder
        blocks:
          - type: paragraph
            body: >-
              Sonar’s customer map is more segmented than a single "developer tools" label suggests. The official
              edition guide starts with Community Build for individual developers and very small teams, then moves into
              Developer Edition for small-to-medium engineering groups that need branch analysis and pull-request
              workflows, before stepping up to Enterprise and Data Center for portfolio governance, compliance
              reporting, and very large code estates. The Cloud product adds a self-serve acquisition path with a free
              tier and a trial motion, which lowers adoption friction for teams that do not want to self-host. Together,
              those surfaces imply a ladder where usage can begin with a lone developer or small squad and expand only
              when governance, multi-branch review, and enterprise controls become economically necessary.
