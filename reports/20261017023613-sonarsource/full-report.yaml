      - number: '4.3'
        title: Cost structure, capital intensity, and underwriting limits
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a mixed delivery model with different cost profiles by product. SonarQube Cloud is
              positioned as managed SaaS, while SonarQube Server is self-managed and the newer agentic products require
              customer-deployed containers, shared storage, and license-linked usage allowances. That structure should
              let Sonar serve both regulated enterprises and lighter-weight cloud buyers, but it also suggests varying
              support, implementation, and infrastructure burdens across the base. The key underwriting problem is not
              lack of commercial signals; it is lack of balance-sheet and unit-economics disclosure. The assigned
              sources do not provide cash on hand, burn, runway, gross margin, debt obligations, NRR, or customer
              concentration, so capital adequacy and margin durability remain diligence requests rather than
              underwritten facts.
