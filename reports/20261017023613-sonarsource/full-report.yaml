      - number: '3.3'
        title: Moat durability is strongest in enterprise workflow breadth, weakest on price-sensitive edges
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a moat that is real but uneven. Sonar's strongest position is where the buyer
              values integrated workflow breadth: multi-language analysis, security modules, quality gates, dashboards,
              deployment flexibility, and new agentic governance features. Those attributes make replacement harder
              because a switching project must rebuild a working operating model, not merely replace a scanner. But the
              same evidence also shows why that moat can compress at the edge. Community Build offers a free self-hosted
              fallback inside Sonar's own family, the public DevOps thread surfaces visible price sensitivity around
              SonarCloud, and Opengrep is explicitly marketing open-source SAST commoditization. That combination
              suggests Sonar's pricing umbrella is most exposed when the customer only values one function, only needs a
              narrow language set, or is comfortable assembling point tools into an internal stack.
