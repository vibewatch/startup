      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Sonar appears to have a strong topline and a credible monetization architecture, with a large
              free/community funnel, enterprise-priced core editions, and incremental add-on subscriptions that can
              deepen wallet share in larger accounts. The adverse read-through is that independent evidence also flags
              setup complexity, feature gaps, and pricing sensitivity, which can slow conversion or expansion if
              competing AppSec platforms compress differentiation. The result is a business that likely merits serious
              diligence, but not clean underwriting from public evidence alone: revenue quality looks directionally
              good, margin path is unresolved, and financing dependency cannot be judged confidently without private
              financial materials.
