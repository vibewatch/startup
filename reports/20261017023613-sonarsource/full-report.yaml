  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: code verification inside a broader AST landscape'
        blocks:
          - type: paragraph
            body: >-
              Sonar is not best framed as a generic cybersecurity vendor or a pure runtime AppSec tool. Its product
              surfaces place the company in automated code review, static analysis, and verification that starts in the
              IDE and extends through pull requests, CI/CD, and self-managed or SaaS governance. That matters because
              broad application-security-testing estimates often include adjacent categories such as DAST, IAST, mobile
              testing, and SCA, while Sonar's own wedge is earlier in the software-development lifecycle and tied to
              developer workflow adoption. The practical market boundary for this chapter is therefore code-quality and
              SAST-led verification, plus adjacent compliance and AI-code-governance spend that can be won once the
              product is embedded in daily engineering work.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
      - number: '2.2'
        title: 'Sizing lenses: usable SAST lens versus inflated broad-AST headline'
        blocks:
          - type: paragraph
            body: >-
              The clearest market-sizing lesson from the assigned pool is that top-down numbers are only useful after
              the boundary is defined. Verified Market Research publishes a very broad AST frame covering SAST, DAST,
              IAST, mobile testing, and SCA, which yields a multibillion-dollar headline but overstates the addressable
              market for Sonar's core wedge if treated as a direct TAM. Mordor Intelligence provides a narrower SAST
              lens that is much closer to Sonar's code-verification starting point and also includes segment data that
              is actionable for buyer prioritization. Rather than force a false single TAM/SAM/SOM stack, the better
              diligence read is that Sonar participates in a fast-growing security-testing category whose monetizable
              center of gravity is enterprise-grade SAST and adjacent governance, not the whole of application security.
            claimRefs:
              - CM006
