          - type: callout
            title: Mitigants are real, but private disclosure lags public peers
            body: >-
              Sonar does have credible mitigants already visible in public materials: self-hosted and air-gapped
              deployment paths, cloud assurance, deep IDE and CI/CD integration, and stronger agentic-specific quality
              gates. GitLab's public valuation, gross-margin, and cash-flow metrics show the operating evidence
              available for a listed peer. The next diligence step is to test Sonar's controls and economics with
              comparable data rather than simply shifting complexity into implementation and operations.
            calloutType: insight
