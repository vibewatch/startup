      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Publicly visible thesis-break triggers
            body: >-
              The downside case sharpens if Sonar cannot show concrete CRA readiness before reporting obligations begin,
              if enterprise users keep reporting upgrade or false-positive pain without offsetting ROI evidence, if
              agentic products need governance-heavy customer-specific LLM setups to work in production, or if license
              and overage controls visibly block analysis at critical moments.
            calloutType: risk
            claimRefs:
