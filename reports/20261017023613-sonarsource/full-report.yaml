      - number: '2.4'
        title: Growth drivers, adoption constraints, and what still needs proof
        blocks:
          - type: paragraph
            body: >-
              The pool supports a credible demand case for Sonar: AI-generated and agent-generated code are increasing
              verification load, regulators and enterprise buyers are pushing secure-by-design controls earlier in the
              lifecycle, and cloud-native development keeps favoring continuous testing integrated into existing
              workflows. But the same evidence also flags commercialization constraints. Enterprise-grade agentic
              features are packaged above the free and small-team tiers, some require separate subscriptions and overage
              management, and the self-hosted agentic stack adds deployment complexity by running containerized
              components outside the core server. Independent AST commentary also highlights cost, integration
              complexity, skills shortages, and false-positive risk as adoption brakes. The main unresolved gap is
              whether Sonar can translate its broad developer entry point into durable paid expansion fast enough to
              overcome those frictions, because the assigned pool does not contain independent customer-budget or
              failed-pilot evidence.
            claimRefs:
              - CM008
              - CM011
              - CM014
              - CM015
              - CM016
