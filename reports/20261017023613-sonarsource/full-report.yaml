        title: Exhibits
        blocks:
          - type: callout
            title: Bottom-up usage, top-down monetization
            body: >-
              Sonar can enter through free developer tooling, but the richer security, compliance, and agentic budgets
              sit higher in the org and cluster in enterprise editions.
            calloutType: insight
            claimRefs:
