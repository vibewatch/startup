      - number: '7.2'
        title: Regulatory and public-market benchmark risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure centers on software-security obligations rather than an identified enforcement event.
              The EU Cyber Resilience Act now has dated reporting and compliance milestones, and some in-scope products
              may require third-party assessment before sale in the EU. At the same time, Sonar's newer AI capabilities
              rely on external model providers and endpoints, which raises diligence needs around data handling,
              contractual controls, and evidence trails. Public-market comparables add a separate underwriting risk:
              StockAnalysis reported GitLab at $3.10 billion of enterprise value and 3.25x EV/sales in May 2026, with
              public gross-margin and free-cash-flow data that private Sonar does not disclose. That gap makes a stale
              premium mark harder to defend without management evidence.
            claimRefs:
              - CR001
              - CR002
