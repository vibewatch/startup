      - number: '3.2'
        title: Packaging, deployment, and workflow leverage shape the buying decision
        blocks:
          - type: paragraph
            body: >-
              Sonar's own packaging broadens the competitive envelope more than the retained pool shows for any single
              outside rival. SonarQube Cloud is presented as a managed SaaS product for fast-moving DevOps teams, while
              SonarQube Server is positioned for enterprises that need data residency, perimeter deployment, and deeper
              control. Community Build functions as a free downgrade path for buyers that want the Sonar workflow but
              cannot justify enterprise pricing. The commercial editions then reopen distance from the free baseline by
              adding branch and pull-request analysis, advanced security capabilities, broader language support, and
              AI-era products such as Sonar Vortex, Hunter Agent, and the Remediation Agent. In other words, Sonar's
              competitive leverage is not just detection depth; it is packaging multiple workflow controls into one
              platform so that a replacement decision has to recreate policy, integrations, and deployment fit rather
              than just scanner output.
