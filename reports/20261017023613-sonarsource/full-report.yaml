      - number: '2.3'
        title: Buyer, user, and budget segmentation
        blocks:
          - type: paragraph
            body: >-
              Sonar's packaging shows a deliberate ladder from individual developers and very small teams into corporate
              development organizations, then into enterprise-wide governance. The free Community Build and free IDE
              extension reduce adoption friction for developers, while commercial editions add branch and pull-request
              analysis, broader language support, advanced security, compliance reporting, and centralized management.
              The product page then sharpens the deployment split: SonarQube Cloud is positioned for cloud-native teams
              that want fast time to value, while SonarQube Server is positioned for regulated industries and large
              enterprises that care about data residency, custom integrations, and deployment control. That means the
              daily user is usually a developer or development team, but the durable budget owner shifts upward toward
              engineering leadership, platform teams, and AppSec as the product moves from coding assistant to policy
              and governance layer.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
