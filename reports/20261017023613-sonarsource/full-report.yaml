    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current product surface
        blocks:
          - type: paragraph
            body: >-
              The retained official materials describe SonarQube as a code-quality, code-security, and verification
              platform that reviews human-written, AI-generated, and open-source code directly inside developer
              workflows. The commercial surface now spans both SonarQube Cloud and self-hosted SonarQube Server, while
              the edition structure still ladders from Community Build through Developer, Enterprise, and Data Center
              server tiers. That combination matters for the rest of the report because it anchors Sonar as a workflow
              and governance layer rather than a point scanner, and it explains why later claims about adoption,
              enterprise reach, and agentic add-ons should be interpreted as extensions of an already broad product base
              rather than a standalone new business.
