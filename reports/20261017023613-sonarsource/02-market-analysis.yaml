  - - Enterprise code security and governance
    - Advanced SAST, compliance reporting, portfolio management, data residency, self-hosted control
    - Standalone DAST-only or ASM budgets without code-analysis workflow
    - AppSec, platform engineering, CTO organization
    - Highest-value budgets concentrate here, especially in regulated or large-enterprise accounts.
  - - Adjacencies that inflate broad AST TAM
