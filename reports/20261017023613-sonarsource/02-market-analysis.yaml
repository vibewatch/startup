company:
  name: SonarSource
chapter:
  number: 2
  title: Market Analysis
  summary: 'SonarSource sells into a narrowly defined code-verification segment inside the broader application-security-testing market: its strongest fit is developer-led code quality plus SAST verification, with monetization concentrated in larger and more regulated engineering organizations. The most usable third-party lens is Mordor Intelligence''s SAST market rather than a broad AST estimate, while Sonar''s own packaging shows how free IDE usage can expand bottom-up before enterprise controls, data residency, and agentic add-ons pull spend upmarket.'
sections:
- id: market-boundary
  title: 'Market boundary: code verification inside a broader AST landscape'
  body: |-
    Sonar is not best framed as a generic cybersecurity vendor or a pure runtime AppSec tool. Its product surfaces place the company in automated code review, static analysis, and verification that starts in the IDE and extends through pull requests, CI/CD, and self-managed or SaaS governance. That matters because broad application-security-testing estimates often include adjacent categories such as DAST, IAST, mobile testing, and SCA, while Sonar's own wedge is earlier in the software-development lifecycle and tied to developer workflow adoption. The practical market boundary for this chapter is therefore code-quality and SAST-led verification, plus adjacent compliance and AI-code-governance spend that can be won once the product is embedded in daily engineering work.
  claimRefs:
  - CM001
  - CM002
  - CM006
  - CM014
  tableRefs:
  - TM001
- id: sizing-lenses
  title: 'Sizing lenses: usable SAST lens versus inflated broad-AST headline'
  body: |-
    The clearest market-sizing lesson from the assigned pool is that top-down numbers are only useful after the boundary is defined. Verified Market Research publishes a very broad AST frame covering SAST, DAST, IAST, mobile testing, and SCA, which yields a multibillion-dollar headline but overstates the addressable market for Sonar's core wedge if treated as a direct TAM. Mordor Intelligence provides a narrower SAST lens that is much closer to Sonar's code-verification starting point and also includes segment data that is actionable for buyer prioritization. Rather than force a false single TAM/SAM/SOM stack, the better diligence read is that Sonar participates in a fast-growing security-testing category whose monetizable center of gravity is enterprise-grade SAST and adjacent governance, not the whole of application security.
  claimRefs:
  - CM006
  - CM007
  - CM009
  - CM010
  - CM013
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyer-segmentation
  title: Buyer, user, and budget segmentation
  body: |-
    Sonar's packaging shows a deliberate ladder from individual developers and very small teams into corporate development organizations, then into enterprise-wide governance. The free Community Build and free IDE extension reduce adoption friction for developers, while commercial editions add branch and pull-request analysis, broader language support, advanced security, compliance reporting, and centralized management. The product page then sharpens the deployment split: SonarQube Cloud is positioned for cloud-native teams that want fast time to value, while SonarQube Server is positioned for regulated industries and large enterprises that care about data residency, custom integrations, and deployment control. That means the daily user is usually a developer or development team, but the durable budget owner shifts upward toward engineering leadership, platform teams, and AppSec as the product moves from coding assistant to policy and governance layer.
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM012
  tableRefs:
  - TM003
- id: drivers-and-constraints
  title: Growth drivers, adoption constraints, and what still needs proof
  body: |-
    The pool supports a credible demand case for Sonar: AI-generated and agent-generated code are increasing verification load, regulators and enterprise buyers are pushing secure-by-design controls earlier in the lifecycle, and cloud-native development keeps favoring continuous testing integrated into existing workflows. But the same evidence also flags commercialization constraints. Enterprise-grade agentic features are packaged above the free and small-team tiers, some require separate subscriptions and overage management, and the self-hosted agentic stack adds deployment complexity by running containerized components outside the core server. Independent AST commentary also highlights cost, integration complexity, skills shortages, and false-positive risk as adoption brakes. The main unresolved gap is whether Sonar can translate its broad developer entry point into durable paid expansion fast enough to overcome those frictions, because the assigned pool does not contain independent customer-budget or failed-pilot evidence.
  claimRefs:
  - CM008
  - CM011
  - CM014
  - CM015
  - CM016
