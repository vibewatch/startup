      - ['Anti-thesis: missing quality metrics', 'Public evidence still lacks NRR, gross margin, EBITDA / burn, and preference terms that 2026 buyers use to separate premium from median software.', 'Management disclosure or diligence-room evidence on retention, margins, cash, and preferences could materially raise conviction.']
    notes: 'The table separates business-quality evidence from entry-price evidence; both must work for a buy call.'
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV009, CV010, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ['Bull', 'AI verification products materially deepen expansion and Sonar proves premium retention / margin quality.', '10x-12x ARR on $430M implies about $4.3B-$5.2B EV, roughly sustaining or modestly improving on the stale public mark.', 'Needs current proof on NRR, profitability, and product attach rates.', 'Fresh primary mark plus disclosed efficient growth metrics.']
      - ['Base', 'Sonar remains a category leader but is priced more like a strong late-stage software platform than a unique AI outlier.', '7x-9x ARR implies about $3.0B-$3.9B EV, below the 2022 headline valuation but still premium to software medians.', 'Premium compresses if AI features do not convert into durable upsell.', 'Refreshed transaction with solid but not elite software metrics.']
      - ['Bear', 'Multiple compression continues or diligence shows weaker retention, slower growth, or preference-heavy terms.', '4x-6x ARR implies about $1.7B-$2.6B EV, closer to broad 2026 software medians.', 'Down-round optics, secondary discounting, or weak cash efficiency.', 'No fresh valuation evidence and continued opacity on unit economics.']
    notes: 'Indicative EV ranges are derived from June 2026 ARR and 2026 sector multiple references; they are negotiation anchors, not a DCF.'
    claimRefs: [CV001, CV007, CV008, CV010, CV014]
