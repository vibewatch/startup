figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "Sonar's public evidence supports a land-and-expand path from free entry points into LOC-scaled commercial tiers and separately metered add-ons."
    data:
      nodes:
        - id: community
          label: "Free community and IDE entry"
          detail: "Community Build and IDE presence widen top-of-funnel adoption."
          note: "No public conversion rate disclosed."
        - id: workflow
          label: "Workflow-embedded adoption"
          detail: "CI/CD integrations, docs, and marketplace presence help embed usage in developer workflows."
          note: "Partner channel exists but revenue contribution is undisclosed."
        - id: paid-core
          label: "LOC-scaled paid core"
          detail: "Developer, Enterprise, and Data Center tiers scale by codebase size and governance needs."
          note: "Official packaging exists; realized pricing is mostly third-party intelligence."
        - id: deployment-choice
          label: "Cloud or self-managed deployment"
          detail: "Accounts can choose managed SaaS or self-hosted enterprise deployment."
          note: "Delivery model changes implementation and support burden."
        - id: add-ons
          label: "Add-on subscriptions"
          detail: "Advanced Security, Sonar Vortex, Hunter Agent, and Remediation Agent expand ACV."
          note: "Some add-ons are metered by tool calls, suggestions, or scan units."
        - id: renewals
          label: "Renewal and overage expansion"
          detail: "LOC growth, usage caps, and premium support create additional expansion vectors."
          note: "Public sources do not disclose retention, churn, or overage share."
      edges:
        - from: community
          to: workflow
          label: "Adoption through developer workflows"
        - from: workflow
          to: paid-core
          label: "Upgrade when collaboration, security, or scale needs rise"
        - from: paid-core
          to: deployment-choice
          label: "Select managed cloud or self-managed server"
        - from: deployment-choice
          to: add-ons
          label: "Attach security and agentic products"
        - from: add-ons
          to: renewals
          label: "Expand via usage, LOC growth, and support"
    approximationNotes: "Sequence shows commercial motion, not conversion rates, revenue mix, or margin contribution."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI011, CI016]
callouts:
  - calloutType: insight
    title: "Monetization breadth is a strength"
    body: >-
      Sonar is not relying on one pricing construct: it combines free/community
      entry, LOC-scaled commercial editions, managed cloud, and separate AI/security
      subscriptions that can deepen ACV in larger accounts.
    claimRefs: [CI001, CI002, CI004, CI005]
  - calloutType: risk
    title: "Public underwriting remains incomplete"
    body: >-
      The assigned sources do not disclose cash, burn, gross margin, NRR, or revenue
      mix, so strong demand signals still stop short of proving capital adequacy or
      margin durability.
    claimRefs: [CI009, CI015]
  - calloutType: recommendation
    title: "Priority diligence request list"
    body: >-
      Request product-line revenue mix, ARR-to-GAAP reconciliation, gross margin by
      product, CAC/payback, NRR, and a current cash-plus-runway schedule before using
      this chapter for valuation or financing judgments.
    claimRefs: [CI006, CI007, CI008, CI015, CI016]
