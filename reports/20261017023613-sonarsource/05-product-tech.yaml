      - ["Agentic services layer", "Provide governed context, deep analysis, and automated remediation", "Sonar Vortex, Hunter Agent, Remediation Agent", "Newest layer has the least independent production evidence"]
      - ["Supply-chain evidence layer", "Document component inventory and vulnerability applicability", "SBOM inventory plus VEX attestations", "Buyers still need proof that product outputs map cleanly into standardized software-supply-chain controls"]
    notes: "Rows combine Sonar product surfaces with independent SAST and supply-chain control benchmarks; the standards rows describe buyer expectations, not undisclosed Sonar implementation details."
    claimRefs: [CE001, CE005, CE006, CE011, CE013]
