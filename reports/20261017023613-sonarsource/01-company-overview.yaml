      - ["Founders / board not re-verified", "Unconfirmed in current pool", "Independent comparison dates SonarSource to 2008 and SonarQube to 2007, but retained current sources do not name founders or directors.", "Founder-market fit and board oversight cannot be refreshed from this evidence set.", "Governance concentration cannot be assessed until official leadership or board materials are refreshed."]
