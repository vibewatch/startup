      Partial refresh only: the assigned pool re-establishes the current CEO but does not
      provide a current leadership or board roster, so governance diligence remains incomplete.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to leadership signals explicitly supported in the assigned refresh pool rather
        than a full roster of executives, founders, and directors.
    claimRefs: [CO007, CO014]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Developers", "Primary end users and distribution engine", "Official pages say more than 7 million developers use Sonar, making developer adoption a core moat input.", "Split free/open-source usage from paid seats and active enterprise users."]
      - ["Large enterprises", "Primary budget holders", "Sonar claims 75% of the Fortune 100 rely on it and highlights self-hosted control plus compliance tooling.", "Verify logo concentration, expansion rates, and multi-product attach by segment."]
      - ["Regulated industries", "High-value compliance-sensitive buyers", "Server, air-gapped deployment, standards reporting, and architecture controls support premium enterprise use cases.", "Quantify revenue exposure to regulated sectors and whether compliance modules drive pricing power."]
      - ["AI coding teams", "Expansion wedge for new product spend", "Vortex, MCP access, agentic quality gates, and Hunter/Remediation Agents are the clearest 2026 upsell narrative.", "Measure attach, pricing, and displacement versus point tools for AI-code governance."]
      - ["Community and small teams", "Top-of-funnel acquisition channel", "Community Build and Cloud free entry points extend reach beyond enterprise accounts and likely seed later upgrades.", "Request conversion data from free/community usage into paid cloud or server deployments."]
    notes: >-
      This is a stakeholder map rather than a confirmed cap table; the assigned pool does not
      refresh investors, ownership percentages, or board-control rights.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the economically important user and buyer groups that can be refreshed from
        current official and independent materials, not a full ownership or investor register.
    claimRefs: [CO002, CO003, CO004, CO005, CO008, CO010, CO011, CO012, CO013, CO015]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The refresh pool supports an eight-step timeline from SonarQube's open-source origins to
      Sonar's 2026 agentic-verification expansion.
    data:
      items:
        - year: "2007"
          label: SonarQube open-source launch
          detail: Independent comparison says SonarQube was first released as an open-source project in 2007.
          tone: neutral
          claimRefs: [CO014]
        - year: "2008"
          label: SonarSource founding
          detail: Independent comparison lists SonarSource as founded in 2008.
          tone: neutral
          claimRefs: [CO014]
        - period: "2026.1 LTA"
          label: AI-native IDE and MCP expansion
          detail: 2026.1 says SonarQube now works with Claude Code, Cursor, Windsurf, and Gemini and adds MCP Server access for AI agents.
          tone: positive
          claimRefs: [CO008]
        - period: "2026.1 LTA"
          label: Supply-chain security broadens
          detail: 2026.1 adds SCA, SBOM vulnerability detection, and malicious package detection in Advanced Security.
          tone: positive
          claimRefs: [CO009]
        - period: "2026.4"
          label: Agentic AI quality gate introduced
          detail: 2026.4 launches a Sonar way for Agentic AI quality gate calibrated for agent-generated code.
          tone: positive
          claimRefs: [CO010]
        - period: "2026.4"
          label: Architecture analysis reaches Server
          detail: 2026.4 moves architecture analysis from Cloud-only availability into SonarQube Server at no additional cost.
          tone: positive
          claimRefs: [CO011]
        - date: "2026-06-30"
          label: Vortex and Remediation Agent announcement
          detail: Sonar announces Sonar Vortex and the SonarQube Remediation Agent and says ARR has surpassed $430 million.
          tone: positive
          claimRefs: [CO006, CO007]
        - period: "2026.5 LTA"
          label: Agentic add-ons formalized in release docs
          detail: Release notes describe Remediation Agent, Hunter Agent, and Sonar Vortex as deployable enterprise capabilities.
          tone: positive
          claimRefs: [CO012, CO013]
    approximationNotes: null
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
