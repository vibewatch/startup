company:
  name: SonarSource
chapter:
  number: 6
  title: Customers
  summary: >-
    Sonar shows very broad top-of-funnel reach and a clear upsell ladder from free/community
    usage to enterprise governance, but most public proof of paid adoption still comes from
    marketing aggregates and anonymous practitioner reviews rather than disclosed paid-account,
    renewal, or concentration metrics.
sections:
  - id: segment-ladder
    title: Customer segments and the commercial ladder
    body: >-
      Sonar’s customer map is more segmented than a single "developer tools" label suggests.
      The official edition guide starts with Community Build for individual developers and very
      small teams, then moves into Developer Edition for small-to-medium engineering groups that
      need branch analysis and pull-request workflows, before stepping up to Enterprise and Data
      Center for portfolio governance, compliance reporting, and very large code estates. The
      Cloud product adds a self-serve acquisition path with a free tier and a trial motion, which
      lowers adoption friction for teams that do not want to self-host. Together, those surfaces
      imply a ladder where usage can begin with a lone developer or small squad and expand only
      when governance, multi-branch review, and enterprise controls become economically necessary.
    claimRefs: [CU001, CU002, CU003, CU004, CU012, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Public adoption proof is strongest at usage breadth, weaker at paid-account specificity
    body: >-
      The strongest public adoption evidence is breadth, not monetization detail. Sonar’s June
      2026 press release claims more than 7 million developers and deep Fortune 100 penetration,
      while independent review evidence describes a low-friction Cloud trial and production use
      inside CI pipelines, across multiple languages, and in one case across more than 700 projects
      and more than 20 million lines of code. OWASP's ASVS provides a separate buyer-side benchmark
      for testing technical security controls and secure-development requirements. Together, the
      evidence shows a large workflow footprint and a standards-aware buying context, but it still
      does not separate free, paid, or expansion cohorts cleanly.
    claimRefs: [CU004, CU005, CU006, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-and-blind-spots
    title: Expansion logic is visible, but retention and concentration remain opaque
    body: >-
      Sonar’s monetization and expansion logic is visible in public sources even when durability
      metrics are not. Paid value appears to unlock around branch analysis, pull-request
      decoration, portfolio management, compliance, and agentic remediation. At the same time,
      The New Stack reports that Opengrep offers unrestricted scanning capabilities and portable
      outputs, illustrating open-source substitution pressure at the lower end of the market.
      Livmo identifies growth, NRR, Rule of 40 performance, and customer concentration as major
      valuation drivers, yet reviewed Sonar materials do not disclose NRR, GRR, churn, contract
      length, channel mix, or top-customer revenue exposure. That keeps the adoption story
      directionally strong but commercially under-instrumented.
    claimRefs: [CU007, CU012, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: insight
    title: Land-small, expand-on-governance faces open-source pressure
    body: >-
      Public packaging suggests Sonar can start with a free IDE or community install, then expand
      when teams need PR decoration, portfolio controls, or agentic remediation. Opengrep's
      unrestricted open-source scanning surface makes that expansion case dependent on governance
      and workflow value rather than basic scanner access alone.
    claimRefs: [CU001, CU004, CU012, CU013]
  - calloutType: risk
    title: Public customer disclosure is still shallow for a late-stage company
    body: >-
      The reviewed source set supports broad adoption claims, but it does not disclose paid
      customer count, renewal metrics, or concentration, which keeps customer durability and
      revenue quality under-verified.
    claimRefs: [CU011, CU016]
