      severity: material
      topic: customer-durability
      missingEvidence: Paid-customer count, NRR, GRR, logo churn, and median contract duration by product line.
      whyItMatters: These metrics determine whether Sonar's broad usage footprint converts into durable recurring revenue.
      diligencePath: Request cohort retention tables, renewal dashboards, and product-line customer counts from management.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue share, top-10 concentration, and any reseller or channel dependence disclosures.
      whyItMatters: Concentration can turn strong enterprise penetration into meaningful downside if a few accounts dominate bookings.
      diligencePath: Request customer concentration schedules, pipeline mix, and channel attribution from finance and sales ops.
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: material
      topic: named-customer-outcomes
      missingEvidence: Named production case studies with deployment scope, modules purchased, outcomes achieved, and renewal status.
      whyItMatters: Logo references show credibility, but they do not prove deployment depth, expansion, or value realization.
      diligencePath: Ask for customer references, case studies, and win-loss summaries segmented by cloud versus server deployments.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
