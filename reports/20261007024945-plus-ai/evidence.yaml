evidenceGaps:
  - type: missing-source
    severity: material
    topic: historical-funding-and-cap-table
    missingEvidence: >-
      Cumulative equity funding, debt financing, secondaries, legacy investor ownership, and a fully diluted cap table
      are not established by the assigned source pool.
    whyItMatters: >-
      Transaction valuation and potential proceeds cannot reveal invested capital, preference overhang, dilution, or
      stakeholder control without the historical financing record.
    diligencePath: >-
      Obtain the definitive registration statement, capitalization schedules, financing agreements, and board-approved
      cap table directly from the company and transaction counsel.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current employee count, customer count and denominator, unrestricted cash, debt, and net cash are absent from the
      assigned evidence.
    whyItMatters: >-
      These metrics determine operating scale, concentration, financing need, and runway; gross transaction sources
      cannot substitute for them.
    diligencePath: >-
      Request the current employee roster, customer and contract schedule, bank statements, debt register, and monthly
      management accounts, then reconcile them to audited filings.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-and-succession
    missingEvidence: >-
      Board membership, committee composition, director independence, executive tenure, compensation, retention
      arrangements, and succession plans are not in the assigned pool.
    whyItMatters: >-
      The issuer itself identifies senior-management and co-founder dependence, so an executive title list does not
      establish governance resilience.
    diligencePath: >-
      Review the definitive proxy and registration statement, board minutes, committee charters, employment agreements,
      equity grants, and documented succession plans.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: transaction-history
    missingEvidence: >-
      The assigned evidence does not state why the planned Churchill Capital IX combination described in January 2026
      did not remain the named transaction by September 2026.
    whyItMatters: >-
      The counterparty change may affect execution history, transaction costs, governance, investor rights, and the
      reliability of closing assumptions.
    diligencePath: >-
      Obtain the Churchill termination agreement and related board materials, compare them with the Texas Ventures
      agreement, and reconcile fees, break rights, and financing terms.
  - type: access-blocked
    severity: minor
    topic: identity-disambiguation
    missingEvidence: >-
      The prefetched Dokie AI page returned only a publisher word and supplied no review text that could substantiate a
      claim about either company.
    whyItMatters: >-
      Search results for the shared name are noisy, and inaccessible snippets must not be treated as independent
      corroboration about the autonomous-trucking business.
    diligencePath: >-
      Exclude the page from factual support and use the direct official product sites plus the usable independent
      NextDocs text only for identity disambiguation.
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent autonomous-trucking market data with an explicit spend denominator, route and vehicle population,
      adoption timing, and geography.
    whyItMatters: >-
      Without those inputs, the $1.7T headline cannot be converted into a defensible TAM, SAM, or probability-weighted
      SOM.
    diligencePath: >-
      Obtain the underlying industry datasets and build a corridor-level model using eligible Class 8 vehicles, annual
      autonomous miles, expected launch dates, and net software revenue per mile.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-map
    missingEvidence: >-
      Named procurement owners, approval thresholds, contract term, price escalators, minimum autonomous-mile
      commitments, and renewal mechanics for OEM and fleet buyers.
    whyItMatters: >-
      Public channel descriptions do not establish who controls the budget or whether the projected per-truck revenue is
      contractually repeatable.
    diligencePath: >-
      Review executed OEM and fleet agreements under NDA and interview procurement, fleet operations, and
      autonomous-vehicle program owners.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pilot-economics
    missingEvidence: >-
      Customer-verified route economics for the Ryder and International trial, including safety-driver cost,
      autonomous-mile share, intervention data, fuel use, uptime, and paid rate.
    whyItMatters: >-
      A supervised paid-freight pilot does not by itself validate driver-out savings or the illustrative $0.85 per-mile
      DaaS assumption.
    diligencePath: >-
      Request route-level invoices, dispatch logs, safety reports, intervention logs, and customer attestations for the
      full trial period.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: regulatory-constraints
    missingEvidence: >-
      Current regulator-issued jurisdiction-by-jurisdiction rules for testing and driver-out commercial operation on
      Plus.ai's intended lanes.
    whyItMatters: A company summary cannot establish the legal launch envelope or timing for each commercial corridor.
    diligencePath: >-
      Verify each proposed lane against current state, federal, and European regulator records and obtain counsel's
      deployment memorandum.
    relatedQuestionRefs:
      - QM008
      - QM010
  - type: private-evidence-only
    severity: material
    topic: peer-pricing-benchmarks
    missingEvidence: >-
      Publicly disclosed per-mile software license pricing and contract rate sheets from direct autonomous trucking
      peers Aurora Innovation and Kodiak Robotics.
    whyItMatters: >-
      Lack of public per-mile pricing data restricts quantitative margin benchmarking against alternative autonomous
      trucking platforms.
    diligencePath: Review carrier commercial agreements and customer rate schedules under NDA during direct management diligence.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: hyperfoundry-customer-identities
    missingEvidence: >-
      Customer identities, multi-year volume commitments, and retention rates backing the $25 million contracted value
      under HyperFoundry.
    whyItMatters: >-
      Assessing recurring software quality and customer lock-in requires visibility into third-party developer contracts
      beyond OEM anchor partners.
    diligencePath: Request customer contract schedules, revenue recognition terms, and pipeline conversion audits under NDA.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited GAAP income statement, balance sheet, cash flow statement, and auditor's report for FY 2024 and FY 2025.
    whyItMatters: >-
      Current disclosures rely entirely on non-GAAP presentations and management slides without GAAP reconciliation or
      independent audit verification.
    diligencePath: Review the full Form S-4 registration statement once declared effective by the SEC for TVAC and PlusAI.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI003
