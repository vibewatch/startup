    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - topic: Long-term OEM take-rate commitments and factory production quotas
    impact: >-
      Volume commitments per OEM brand (Scania, MAN, International, IVECO, Hyundai) are undisclosed, creating
      uncertainty regarding scale timing.
    diligencePath: >-
      Review commercial supply agreements between PlusAI and TRATON/IVECO/Hyundai filed as material contracts with the
      SEC.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: material
    topic: operational-safety-metrics
    missingEvidence: >-
      Disengagement frequency data, Mean Miles Between Interventions (MMBI), and formal safety driver takeover logs from
      the ongoing Ryder-International Texas pilot.
    whyItMatters: >-
