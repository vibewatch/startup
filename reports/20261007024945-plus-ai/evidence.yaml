    impact: >-
      Commercial fleet adoption data is restricted to Ryder System and International Motors; broader carrier pipeline
      conversion remains unverified.
    diligencePath: >-
      Audit forthcoming SEC Form S-4 customer disclosures and fleet pilot expansion announcements for additional tier-1
      logistics carriers.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
