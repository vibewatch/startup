  - type: private-evidence-only
    severity: material
    topic: l4-commercial-disengagement-metrics
    missingEvidence: >-
      Audited safety driver intervention rates, mean distance between disengagements (MDBD), and hardware fault
      injection test logs for the I-35 commercial pilot.
    whyItMatters: >-
      Validating true L4 commercial readiness requires independent verification of disengagement frequency and
      remote-assist escalation rates on live highway lanes.
    diligencePath: >-
      Request confidential OEM-validated safety cases and NHTSA autonomous vehicle incident reporting logs during
      technical diligence.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
