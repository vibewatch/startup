figures:
  - id: "FM001"
    title: "Market-Sizing Evidence Ladder"
    type: "pyramid"
    summary: "Six heterogeneous evidence points narrow from a broad company-labeled freight market to an assumption-driven SuperDrive revenue scenario; the figure is not a proportional TAM/SAM/SOM model."
    data:
      items:
        - label: "Broad heavy-trucking headline"
          value: 1.7
          unit: "USD trillion"
          detail: "Company-labeled global market with no retained denominator"
        - label: "Average operating-cost base"
          value: 2.34
          unit: "USD per mile"
          detail: "PlusAI presentation citing ATRI"
        - label: "Driver-cost component"
          value: 1.03
          unit: "USD per mile"
          detail: "44% of the stated $2.34 per-mile operating cost"
        - label: "Illustrative DaaS payment"
          value: 0.85
          unit: "USD per autonomous mile"
          detail: "Internal fleet-to-OEM assumption"
        - label: "Projected 2031 deployment"
          value: 25000
          unit: "trucks"
          detail: "Internal management projection"
        - label: "SuperDrive scenario at scale"
          value: 1
          unit: "USD billion ARR"
          detail: "Roughly $40,000 per projected truck multiplied by 25,000 trucks"
    approximationNotes: "Not to scale and not a conversion funnel: values use different units and preserve company assumptions. The assigned pool contains no independent TAM, route-level SAM, adoption probability, or verified SOM."
    claimRefs:
      - "CM007"
      - "CM010"
      - "CM016"
callouts:
  - calloutType: "insight"
    title: "The Bottom-Up Scenario Is More Auditable Than the Headline Market"
    body: "The $1B+ ARR scenario exposes its two principal assumptions—approximately $40,000 per truck and 25,000 trucks in 2031—whereas the $1.7T headline does not disclose its addressable-spend denominator in the retained evidence."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM016"
  - calloutType: "risk"
    title: "A Paid Pilot Is Not Yet Driverless Commercial Proof"
    body: "The retained route evidence shows paid freight in an existing fleet workflow, but the company presentation identifies a human safety driver; driver-out readiness, insurance acceptance, and repeatable customer economics remain unverified."
    claimRefs:
      - "CM012"
      - "CM015"
