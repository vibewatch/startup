company:
  name: "Plus.ai"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Plus.ai's relevant market is OEM-integrated autonomous-driving software for heavy trucks, with an adjacent market for AV data and development tools. The retained evidence supports a management scenario of $1B+ ARR at 25,000 trucks and roughly $40,000 per truck in 2031, but it does not provide an independently measured TAM, route-level SAM, or probability-weighted SOM."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Excluded Spend"
    body: >-
      Plus.ai's core market is software that enables Level 4 autonomous operation
      in factory-built commercial trucks. SuperDrive is positioned as the virtual
      driver, while OEM partners supply, integrate, manufacture, sell, and maintain
      the physical vehicle. The addressable revenue pool is therefore autonomy
      software and usage-based service revenue, not the full value of trucks,
      trailers, fuel, freight brokerage, warehouse operations, or carrier revenue.
      HyperFoundry is an adjacent market: PlusAI markets AV data, models, and
      simulation tools to automotive and other physical-AI developers. The assigned
      pool also contains several results for an unrelated presentation-software
      business at plusai.com. Those pages discuss PowerPoint, Google Slides, and
      per-seat software pricing; they are useful only to establish an excluded
      namesake category and must not be used to size autonomous trucking.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM005"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Evidence-Constrained Sizing Lenses"
    body: >-
      The available sizing evidence is company-issued and should be read as a
      hierarchy of assumptions rather than as independently verified TAM, SAM,
      and SOM. PlusAI labels global heavy trucking a $1.7 trillion market but does
      not disclose the denominator or calculation in the retained presentation.
      Its narrower SuperDrive scenario is more auditable: management multiplies
      roughly $40,000 of annual revenue per truck by 25,000 projected trucks in
      2031 to reach $1B+ ARR at scale. The same presentation describes a separate
      $50 million to $100 million-plus annual opportunity for HyperFoundry, also
      based on internal estimates. An independent GetLatka page estimates company
      revenue rather than market demand and therefore cannot validate these
      opportunity figures. The evidence supports scenario analysis, not a
      market-share forecast.
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyer, User, Payer, and Adoption Path"
    body: >-
      SuperDrive uses an OEM-led route to market. PlusAI says OEMs factory-install
      the software and sell autonomous trucks through their existing channels;
      fleets then pay the OEM a usage-based Driver-as-a-Service charge. This makes
      the OEM the integration and distribution counterparty, while the fleet is
      the operating customer and economic payer. Public evidence does not identify
      named internal budget owners or procurement approval thresholds, so those
      fields remain diligence gaps rather than inferred executive titles. Adoption
      proceeds from safety-driver trials and factory integration to driver-out
      commercial operations. The retained Ryder and International route is useful
      workflow evidence because it carries paid freight on an existing 600-plus-mile
      lane, but the presentation states that it remains supervised by a human
      safety driver and therefore does not prove driverless commercial readiness.
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Growth Drivers, Adoption Constraints, and Valuation Relevance"
    body: >-
      The economic driver is the labor and utilization gap identified in the
      company presentation. Citing an ATRI operating-cost study, PlusAI reports
      total U.S. trucking cost of about $2.34 per mile, including $1.03 per mile
      for driver compensation, or 44%. Management's illustrative model replaces
      that driver cost with a $0.85 per-mile payment from the fleet to the OEM and
      increases annual mileage from roughly 86,000 to 240,000. These are useful
      adoption hypotheses, not observed customer economics. Commercial timing is
      constrained by safety validation, truck-hardware reliability, OEM production
      priorities, fleet investment, and differing regulatory regimes. PlusAI's own
      risk disclosure says commercialization can be delayed by safety-case work,
      partner hardware, and customers deprioritizing autonomy. Valuation should
      therefore distinguish the broad freight cost pool from the narrower,
      execution-dependent software scenario.
    claimRefs:
      - "CM009"
      - "CM010"
      - "CM012"
      - "CM014"
      - "CM015"
      - "CM016"
