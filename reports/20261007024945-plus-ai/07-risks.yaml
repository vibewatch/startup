callouts:
  - calloutType: "risk"
    title: "The L4 Commercialization Chasm and Revenue Timing Asymmetry"
    body: "Plus.ai's valuation and equity narrative depend on bridging an acute revenue timing asymmetry: the company generated $25 million in 2026 contracted revenue via HyperFoundry data and development tools, but commercial Level 4 driverless truck revenues ($40,000 contracted ARR per truck target) are not projected to begin until 2027. If OEM manufacturing readiness or driver-out safety validation is delayed by even 12 to 18 months, the company's operating burn will rapidly consume available transaction liquidity, necessitating highly dilutive secondary financings."
    claimRefs:
      - "CR002"
      - "CR014"
      - "CR016"
