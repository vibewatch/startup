              TRATON、IVECO 和 Hyundai 能否按目标推进 2027 年工厂集成和商业发布，不取消项目或缩小技术范围。在承运商领域，Ryder
              部署仍是由人类安全员监管的运营试点，而不是无人驾驶商业货运合同。尽调还必须解决软件发现引擎中的持续重名：Julius AI 的独立评测和 Google Workspace Marketplace 列表评估的是
              Plus AI（plusai.com）运营的完全无关效率插件，该插件拥有超过九百条评价和 4.5 星评分，同时有客户支持及计费投诉。评估真实留存和合同持久性，必须把卡车自动驾驶证明与效率软件指标分开。
            claimRefs:
              - CU008
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示
        blocks:
          - type: callout
            title: HyperFoundry 在 L4 量产发布前提供关键收入桥梁
            body: PlusAI 将自动驾驶工具链拆分为 HyperFoundry，并在 2026 年与 TRATON 合作将 AV 数据和仿真模型变现为 $25 million，在卡车完全无人驾驶量产前数年建立商业收入。
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: 客户集中与安全员过渡障碍
            body: PlusAI 当前商业收入集中于单一 OEM 客户（TRATON），而与 Ryder 的车队运营仍是受监管试点；商业可行性要求在不失去核心 OEM 支持的情况下转向无人驾驶运营。
            calloutType: risk
            claimRefs:
              - CU008
              - CU010
              - CU011
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险分类与严重程度排序
        blocks:
          - type: paragraph
            body: >-
              评估 Plus.ai，必须把近期交易机制与重型自动驾驶卡车多年商业化障碍分开。作为开发 SuperDrive 虚拟驾驶员软件和 HyperFoundry 工具的新兴 Physical AI
              公司，其执行风险集中在五个维度：交易融资、客户与 OEM
              集中度、软硬件验证周期、机动车承运商监管不确定性及会计控制。公司依靠领先卡车制造商的工厂安装式分销，而非车辆改装或自营车队；这减少车辆采购资本开支，却提高对 OEM
              工程周期和采购路线图的战略依赖。历史经营亏损、HyperFoundry 商业历史有限以及对 SPAC 信托资金的依赖，也使公司在资本市场恶化或 OEM 降低自动驾驶项目优先级时面临显著下行风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR012
              - CR016
      - number: '7.2'
        title: 监管、许可与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              自动驾驶商用机动车处于联邦、州及国际司法辖区碎片化且不断变化的监管环境中。在美国，Level 4 重型卡车商业部署受州级框架以及 Federal Motor Carrier Safety
              Administration（FMCSA）和 National Highway Traffic Safety
              Administration（NHTSA）的联邦安全监管共同约束。部分主要货运走廊默示或明确允许无人驾驶，但 California
              等辖区过去要求在商业化前由安全员陪同进行大量测试。安全标准变化、自动驾驶系统事故报告要求或地方立法限制，都可能推迟商业化或增加合规负担。此外，Plus.ai 在 SEC 注册声明中披露，截至 2024 年 12
              月 31 日和 2025 年 12 月 31 日的财年，发现财务报告内部控制存在重大缺陷。无法建立和维持有效内部控制，可能削弱公司准确报告财务结果、满足 Nasdaq 上市要求和保持投资者信心的能力。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
      - number: '7.3'
        title: 运营、技术与安全验证风险
        blocks:
          - type: paragraph
            body: >-
              从人类监管的自动驾驶货运运行转向无安全员商业部署，会引入复杂工程和运营故障模式。Plus.ai 的 SuperDrive 已累计超过 7 million 英里自动驾驶里程，并在与 Ryder 和
              International 合作的德州 Laredo 至 Temple 600 英里日常走廊达到 92% 自动驾驶路线覆盖，但所有真实商业货运试点仍有安全员在驾驶室内。要在目标 2027
              年商业窗口前完成无安全员安全验证，需要严密闭环仿真、容错失效安全冗余及边缘计算，以安全应对恶劣天气、施工区、传感器失明和机械硬件故障等边缘情况。深度神经网络模型、车载摄像头/激光雷达/雷达传感器栈或远程协助通信出现缺陷，可能造成道路事故、产品责任和即时监管介入。不同于实体安全风险很低的消费演示软件插件，重型自动驾驶卡车受零容忍实体安全约束。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 合作伙伴与交易对手集中风险
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 的商业战略与一组高度集中的全球原始设备制造商深度绑定，尤其是 TRATON GROUP（Scania、MAN 和 International 品牌）、Iveco Group 及 Hyundai
              Motor Company。截至目前，公司唯一能产生 HyperFoundry 合同收入的最终协议是与 TRATON 签订的 Autonomy Acceleration Program
              Agreement，该协议贡献了 $25 million 已确认收入，用于支持 TRATON 的 L2+
              项目，包括自动驾驶数据、工具和工程服务。公司预计近期收入的很大一部分依赖少数客户，管理层也明确指出，Plus.ai 可能无法以有利条款、甚至无法与 HyperFoundry 达成更多最终协议。若关键 OEM
              伙伴推迟集成项目、削减自动驾驶卡车资本投入，或协商更低的按使用量计费软件费结构，Plus.ai 的收入路径和经营盈亏平衡进程将受到严重干扰。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 财务画像、烧钱与交易悬垂
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 自成立以来一直产生净亏损，并预计在推进 SuperDrive 商业化过程中继续承担经营亏损和资本开支。为资助运营并实现公开市场上市，Plus.ai 与特殊目的收购公司签订业务合并协议，最初于
              2026 年初筹划与 Churchill Capital Corp IX（CCIX）合并，随后在 2026 年中将条款转向 Texas Ventures Acquisition III
              Corp（TVAC），交易前股权估值为 $800 million（备考企业价值 $896 million）。交易结构存在严重财务脆弱性：高股东赎回率可能耗尽 SPAC
              信托账户，使交割后公司的资产负债表现金显著低于预计的 $135 million 净现金。此外，发起人
              promote、私募配售认股权证和可转换票据发行可能造成稀释并形成技术性股价悬垂；若交割延迟或失败，公司将被迫在艰难的风险融资环境中寻求紧急过桥融资。
            claimRefs:
              - CR002
              - CR013
              - CR014
              - CR016
      - number: '7.6'
        title: 风险缓释、监测指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              为降低前期资产风险，Plus.ai 采用资本效率更高的软件授权与数据销售架构，避免持有或租赁车队资产所需的高额资本投入。HyperFoundry 的双轨变现可带来近期商业现金流（2026 年已交付 $25
              million，全年目标为 $40 million 至 $50 million），同时 SuperDrive L4
              软件仍在进行多年期工厂集成。不过，投资者必须关注可验证的运营里程碑，而不是宣传性公告。明确的论点失效触发条件包括：任何商业试点安全事故导致得克萨斯州货运运营遭监管暂停；TRATON 开发合作终止或范围大幅收缩；到
              2027 年仍未能在 TRATON 之外获得至少两家新增付费 HyperFoundry 企业客户；SPAC 信托赎回率超过 80%，使交易净现金收益降至 $50 million 以下；以及 2027
              年商业无人驾驶卡车上市推迟至 2028 年之后。
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR015
      - number: '7.7'
        title: 展示材料
        blocks:
          - type: callout
            title: L4 商业化鸿沟与收入时点不对称
            body: >-
              Plus.ai 的估值与股权叙事取决于能否填补明显的收入时点不对称：公司通过 HyperFoundry 数据和开发工具在 2026 年产生了 $25 million 的签约收入，但商业化 L4
              无人驾驶卡车收入（每辆卡车 $40,000 签约 ARR 目标）预计要到 2027 年才开始。如果 OEM 制造准备或脱离驾驶员的安全验证哪怕延迟 12 至 18
              个月，公司的运营烧钱速度也会迅速耗尽可用交易流动性，迫使公司进行高度稀释性的二次融资。
            calloutType: risk
            claimRefs:
              - CR002
              - CR014
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              可辩护的建议是继续研究；对公允价值的信心较低，投资判断风险较高。PlusAI 的 2026 年第三季度演示文稿给出拟议的 $800 million 投前股权价值和约 $896 million
              的备考企业价值，但这只是交易条款，并非独立建立的估值 [CV004]。同一份演示文稿在所有权示意中排除了公开及非公开认股权证、尚未归属的奖励、业绩支付以及长期激励计划，同时其现金桥接假设信托资金有相当比例得以保留
              [CV006, CV007]。这些遗漏与假设使得无法干净地评估完全稀释后的入场价格。公司确有可观察的运营信号——已确认的 TRATON
              协议收入和正在运行的有人监督货运试点——但指定的公开证据无法独立验证经常性需求、经审计的 2026 年表现或赎回后的现金余额 [CV002,
              CV011]。因此，价格纪律意味着要等当前交易申报文件、赎回结果和完全稀释后的资本结构完成核对后再作承诺。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV011
              - CV016
      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              拟议的公开上市结构在 2026 年发生了变化。公司 1 月和 4 月的沟通将交易描述为与 Churchill Capital Corp IX 合并，而第三季度投资者演示文稿则称交易对手为 Texas
              Ventures Acquisition III Corp. [CV009]。后来的演示文稿测算约 $60 million 的已承诺资本、$100 million 的假设信托现金、注入资产负债表的 $135
              million 现金，以及预计 $25 million 的交易费用 [CV005]。其中 $100 million 的信托出资假设赎回率为 57.6%，并明确将现有现金或债务排除在备考估值桥接之外
              [CV006]。这些数字不等同于今天可用的现金。由于排除了明确列出的潜在稀释，该结构的完全稀释后所有权仍不完整 [CV007]。一份较早的独立报告显示，Plus 多年前就曾探索 SPAC
              融资，这说明其一直在寻求公开市场资本，但不能验证当前价格或条款 [CV015]。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
      - number: '8.3'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是，PlusAI 可以将 OEM 分销的软件层变现，而无需自行资助卡车制造。公司披露已完成超过七百万英里的自动驾驶里程，拥有六家 OEM 合作伙伴，并与 TRATON、Hyundai 和 IVECO
              开展工厂制造项目 [CV001]。公司还表示，TRATON 协议项下已确认 $25 million 收入，并将 2026 年收入目标定为 $40–50 million；这在 SuperDrive
              仍处于商业化前阶段时提供了较近的变现桥梁 [CV002, CV003]。反论点同样重要：收入证据集中在一份具名协议上，Ryder/International
              路线仍由人类安全驾驶员监督，而管理层自身披露了持续亏损、客户数量有限带来的依赖、技术风险和内部控制弱点 [CV011, CV012, CV013,
              CV014]。因此，指定来源集只能证明业务活动存在，不能证明这是一项可规模化、多元化且盈利的业务。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 情景、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              根据指定证据，无法支持数值化的乐观和悲观估值区间：当前唯一的基准页面是管理层自己的比较，且本工作单元没有分配到独立交易申报文件、市场数据来源或经审计的预测。因此，情景应视为有条件的决策路径，而不是点估计。乐观路径要求
              HyperFoundry 需求多元化、出现脱离驾驶员的商业化证据，并通过融资保留资金续航；基准路径要求达到 2026
              年目标，同时完全稀释后的经济条件透明；悲观路径则由高赎回率、进一步融资、客户集中或商业化延迟所预示 [CV003, CV006, CV011,
              CV013]。增加董事会成员有助于准备成为上市公司，但无法填补财务证据缺口 [CV010]。退出准备度仍取决于交易完成、符合 Nasdaq 上市资格、经审计的业绩、控制整改以及交割后的市场流动性 [CV014]。
            claimRefs:
              - CV003
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 入场纪律
            body: 不要把拟议交易价值等同于经独立验证的公允价值。只有在最终赎回、完全稀释后的资本结构、交割现金和经审计的 2026 年业绩均已明确后，才重新评估投资判断。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV016
          - type: callout
            title: 交易连续性尚未确立
            body: 公司沟通从 2026 年 1 月和 4 月的 Churchill IX 交易转向第三季度演示文稿中的 TVAC 交易。当前有效条款与状态需要以申报文件为依据确认。
            calloutType: risk
            claimRefs:
              - CV009
