            body: >-
              Plus.ai 通过两种软件机制实现商用货运自动驾驶：为工厂制造的 Class 8 卡车提供合同式 OEM 开发软件集成，以及按自动驾驶里程收取经常性
              Driver-as-a-Service（DaaS）软件费。公司不拥有车队，也不承担车辆制造资本开支，而是作为纯软件 Physical AI 供应商，直接向商用车 OEM 许可 SuperDrive
              虚拟驾驶员技术。在与 TRATON GROUP（包括 Scania、MAN 和 International）等基础合作伙伴的商业框架中，车队直接向 OEM 采购自动驾驶卡车，销售、车辆服务、保修和客户支持由
              OEM 持续负责。车队向 OEM 支付预计每自动驾驶英里 $0.85 的 DaaS 使用费，Plus.ai 据此按每辆卡车每英里约 $0.40 收取软件费，具体项目档位下占 DaaS 总经济性的 20% 至
              25%。按每辆卡车每年 240,000 英里自动驾驶的高利用率假设，这一模式以每辆部署卡车约 $40,000 年软件收入和规模化约 85% 毛利率为目标。在计划于 2027E
              交付工厂制造自动驾驶卡车之前，Plus.ai 通过覆盖 Data Factory、Model Factory 和 SimVerse 仿真工具的 HyperFoundry
              平台变现自动驾驶车辆数据资产和工程基础设施。HyperFoundry 与伙伴开发协议目前贡献 $25M 合同收入，支持管理层 2026E 年收入 $40M 至 $50M 的目标；Plus Docs Inc
