      - number: '4.3'
        title: 资本充足性、SPAC 融资依赖与稀释结构
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 的前瞻资本充足性根本取决于其拟议与 Texas Ventures Acquisition III Corp.（Nasdaq: TVA）业务合并的完成及净所得，该交易于 2026 年 9 月 3
              日宣布。在达成最终协议前，Plus.ai 已通过有记录的多轮风险投资融资约 $420M，包括 2021 年 4 月 $220M 的 Series D，并于 2026 年初评估过与 Churchill
              Capital Corp. IX 的潜在合并，随后与 TVAC 确定条款。TVAC 交易按 $800M 交易前股权价值（每股 $10.00）估值，对应 $896M 备考企业价值和 $1,031M
              备考股权价值。交易资金来源包括 PlusAI $800M rollover equity（备考持股 77.6%）、主要通过无担保可转换票据取得的 $60M PIPE 收益，以及在假设股东赎回率为 57.6% 下从
              TVAC $236M 信托账户中保留的 $100M。扣除预计 $25M 交易顾问费用后，交易结构预计向资产负债表增加 $135M 净现金。按管理层运营计划，这笔资金预计足以让公司在 2026E
              接近经营盈亏平衡，并在 2027E 随商业无人驾驶车辆部署实现正现金流。然而，融资结构带来显著资本充足性风险：鉴于 SPAC 同行经常低于 $10.00 交易，TVAC
              股东有强烈赎回动机；高赎回率可能令净所得低于假设的 $100M；公司还披露截至 2024 年 12 月 31 日和 2025 年 12 月 31 日财年的财务报告内部控制历史重大缺陷。
            claimRefs:
              - CI012
