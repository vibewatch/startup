      - number: '3.2'
        title: 自动驾驶卡车与 AI 效率软件的竞争者画像
        blocks:
          - type: paragraph
            body: >
              全面评估 PlusAI
              的竞争环境，既要看直接的商用卡车同行，也要看市场比较中出现的外部软件实体。在自动驾驶卡车领域，直接同行包括推进高速公路货运自动化的上市和非上市开发商。管理层基准显示，上市同行的企业估值较高；而 PlusAI 与
              Texas Ventures Acquisition III Corp（NASDAQ: TVA）的最终业务合并以 $800 million 交易前股权价值（$896 million
              备考企业价值）估值，存在吸引人的折价。不同于只依赖未来 Level 4 商业化里程碑的同行，PlusAI 已将 HyperFoundry 商业化。这一自动驾驶数据与仿真平台服务
              ADAS、L2+、机器人、国防和采矿领域的第三方开发者，并在 2026 年产生 $25 million 合同总价值。在搜索结果涉及的无关效率软件市场中，Plus AI（plusai.com）是集成于
              Microsoft PowerPoint 和 Google Workspace 的专业插件。该领域的竞争者包括用 Smart Slide 模板自动排版并独立生成演示文稿的
              Beautiful.ai；强调团队协作、可定制品牌模板和演示分析的 Pitch；主打提示词生成演示文稿的 Gamma；以及把计算数据分析接入幻灯片制作的 Julius AI。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP009
              - CP010
      - number: '3.3'
        title: 能力比较、定价模式与分销策略
        blocks:
          - type: paragraph
            body: >
              Physical AI 卡车与效率 SaaS 的关键购买标准和能力比较完全不同。自动驾驶卡车中，车队运营商看重商业化准备度、工厂 OEM 集成、监管合规、功能安全和整体运营经济性。PlusAI 的
              SuperDrive 聚焦与一级卡车 OEM 的工厂集成，避免售后改装硬件带来的高维护和可靠性负担。在商业试点中，PlusAI 与 Ryder System, Inc. 和 International
              Motors 合作，每日在德州 Laredo 与 Temple 之间的 I-35 走廊运营 600 英里货运路线。定价上，自动驾驶卡车软件面向按使用量计费的每英里
              Driver-as-a-Service（DaaS）经常性软件费，并通过 HyperFoundry 收取数据和仿真许可费。相反，供应商比较网站评估的效率软件市场采用按席位订阅。Plus
              AI（plusai.com）基础版 $10/月、Pro 版 $20/月、Team 版 $30/月。竞争演示平台价格也相近：Gamma 年付按月每席位起价 $9，Beautiful.ai $12/月，Pitch
              $13/月，Presentations.AI $9/月，Julius AI $16/月。
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP010
              - CP011
      - number: '3.4'
        title: 护城河持久性、平台防御力与不利风险
        blocks:
          - type: paragraph
            body: >
              PlusAI 的长期竞争持久性建立在 Physical AI 技术基础和深度 OEM 工厂集成之上。SuperDrive 虚拟驾驶员已累计超过 7 million
              英里真实商业运营和测试里程，沉淀了丰富的多模态传感器数据与边缘案例，供 HyperFoundry 数据工厂和 SimVerse 闭环仿真引擎使用。通过直接嵌入 TRATON GROUP、Hyundai 和
              IVECO，PlusAI 提高了卡车制造商的切换成本，因为这些制造商会把多年车辆工程项目绑定到其软件架构上。但 PlusAI
              也面临重大不利风险和竞争压力：市场竞争激烈，部分参与者拥有明显更强的资金、算力和测试资源；自动驾驶商业化部署可能因安全验证周期或供应商硬件交付延迟。除此之外，PlusAI 未来收入很大一部分依赖集中客户群；若
              OEM 伙伴将自动驾驶软件能力收回内部，或降低对自动驾驶商用车的投资优先级，其轻资产软件许可模式仍然脆弱。
            claimRefs:
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: 展示
        blocks:
