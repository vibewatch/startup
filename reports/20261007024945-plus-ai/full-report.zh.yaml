        title: 产品定义与商业组合
        blocks:
          - type: paragraph
            body: >-
              PlusAI 的商业产品是 Physical AI 软件，目标是消除重型物流中的人工驾驶约束。公司不组装专用自动驾驶卡车，也不改装车队，而是开发直接嵌入商用车制造商工厂产线的自动驾驶软件。旗舰产品
              SuperDrive 是面向复杂干线运输的全栈 Level 4 虚拟驾驶员，可运行于 Class 8 商用卡车。HyperFoundry 为其基础开发引擎，包含 Data
              Factory（自动摄取多模态数据集并自动标注）、Model Factory（将视觉-语言-动作模型蒸馏到汽车边缘处理器）和 SimVerse（神经闭环道路仿真）。这一软件优先模式已通过与 TRATON
              GROUP 达成的二千五百万美元自动驾驶加速协议取得初步商业进展，并朝着 2027 年工厂安装式商用量产推进。
