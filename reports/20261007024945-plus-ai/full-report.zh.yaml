    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Plus Automation, Inc. 以 PlusAI 名义经营 Physical AI 软件业务，聚焦工厂制造的自动驾驶商用卡车。公司将 SuperDrive 定义为 Level 4 虚拟驾驶员产品，将
              HyperFoundry 定义为数据、模型及仿真平台，并以此支持近期变现。其披露的市场路径以软件为核心：卡车 OEM 在工厂集成系统，并负责制造与分销。公司材料称总部位于硅谷，在美国和欧洲开展业务，办公室位于
              Santa Clara、Fremont 和 Munich。必须将这一身份与 plusai.com 上无关的 Plus AI 演示产品区分开；后者运行在 PowerPoint 和 Google Slides
              内，不能作为自动驾驶卡车公司的证据。
