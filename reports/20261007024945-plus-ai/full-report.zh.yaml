            title: 付费试点尚不等于无人驾驶商业证明
            body: 保留的路线证据显示现有车队工作流中存在付费货运，但公司演示稿明确有一名人类安全员；无安全员准备度、保险接受度及可重复的客户经济性仍未验证。
            calloutType: risk
