      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              SuperDrive 采用 OEM 主导的市场路径。PlusAI 称 OEM 在工厂安装软件，并通过现有渠道销售自动驾驶卡车；车队再向 OEM 支付按使用计费的 Driver-as-a-Service
              费用。因此，OEM
              是集成与分销交易对手，车队则是运营客户和经济付款方。公开证据没有列出具体的内部预算负责人或采购审批门槛，这些仍是尽调缺口，不能据此推断高管职务。采用路径从安全员试点和工厂集成推进到无安全员商业运营。保留的
              Ryder 与 International 路线能证明工作流，因为其在现有 600-plus 英里线路上承运付费货物；但演示稿称该路线仍由人类安全员监管，因此不能证明已具备无人驾驶商业化准备度。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              公司演示稿指出，经济驱动来自劳动力与车辆利用率之间的缺口。PlusAI 引用 ATRI 运营成本研究称，美国卡车运输总成本约为每英里 $2.34，其中司机薪酬为每英里 $1.03，占
              44%。管理层示例模型以车队向 OEM 支付的每英里 $0.85 替代司机成本，并将年行驶里程从约 86,000 英里提高至 240,000
              英里。这些是有助于分析采用的假设，不是已观察到的客户经济性。商业化时间受安全验证、卡车硬件可靠性、OEM 生产优先级、车队投资及不同监管制度约束。PlusAI
              自身风险披露称，安全案例工作、合作伙伴硬件及客户降低自动驾驶优先级都可能推迟商业化。因此，估值应区分广泛的货运成本池与更窄、依赖执行的预测软件场景。
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM014
              - CM015
              - CM016
