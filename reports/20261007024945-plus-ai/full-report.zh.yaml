      - number: '4.2'
        title: 运营成本结构、毛利率走势与资本强度
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 的财务架构以软件优先的经营杠杆和零车辆制造资本开支为核心。不同于融资、拥有并维护专用卡车基地的垂直整合自动驾驶运营商，Plus.ai
              的费用主要投向研发、安全案例验证和深度神经网络（DNN）模型蒸馏。历史非 GAAP 运营费用在 2024A 为 $54M（研发 $37M、SG&A $16M、股权激励 $4.1M），2025A 增至
              $70M（研发 $51M、SG&A $19M、股权激励 $1.8M）。管理层预计 2026E 运营费用为 $71M（研发 $51M、SG&A $20M），2027E 为 $77M（研发 $56M、SG&A
              $21M），反映工厂集成生产开始后的审慎间接费用增长。2026 年 1 月 Analyst Day 演示稿此前预计 2025 年 $75M、2027 年 $106M，说明公司在 2026 年 9 月 SPAC
              公告前收紧了计划中的商业间接费用。由于 OEM 伙伴和车队买方直接承担硬件物料清单、算力安装及现场服务人工，Plus.ai
              避免了基地基础设施资本开支和车辆折旧。该轻资产分销模式旨在经常性每英里软件许可放量后实现超过 85% 毛利率。但要持续盈利，必须让部署车辆数超出初始测试车队，因为 $25M 合同收入带来的近期毛利仍不足以覆盖超过
              $70M 的年度现金运营支出。
