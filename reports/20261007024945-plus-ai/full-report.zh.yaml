      - number: '1.4'
        title: 执行里程碑与待解问题
        blocks:
          - type: paragraph
            body: >-
              运营证据显示业务取得进展，但主要仍来自公司自身披露。德州试点于 2025 年 9 月开始，公司材料随后报告累计行驶超过 75,000 英里、运行超过 125 次，并在安全员监管下实现 92%
              的自动驾驶路线覆盖。2025 年下半年，PlusAI 报告 Safety Case Readiness 为 90.1%、Autonomous Miles Percentage 为 99.2%、Remote
              Assistance Free Trips 为 79.0%。这些指标使用公司定义的分母，不能证明已实现无安全员商业化。资本路径也发生变化：2026 年 1 月公告仍描述计划与 Churchill Capital
              IX 合并，而 9 月公告改称 Texas Ventures III。现有证据没有解释 Churchill 交易的处置结果。因此，2027 年发布仍是管理层目标，面临技术验证、OEM
              执行、监管、融资及已披露内部控制缺陷的影响。
