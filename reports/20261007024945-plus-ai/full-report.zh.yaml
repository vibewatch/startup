        title: 资本结构与商业规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 3 日，PlusAI 宣布与 Texas Ventures Acquisition III 达成最终业务合并协议，交易前股权价值为 $800 million。公告称资金最高约 $300
              million，包括超过 $60 million 的已承诺融资及当时披露约 $236 million 的信托资金。这些是交易资金来源，并非 PlusAI
              已可支配的现金；公众股东赎回及其他交割条件可能减少所得资金。商业披露同样取决于定义。PlusAI 称其根据与 TRATON 的协议确认了 $25 million 收入，而 $40 million 至 $50
              million 是管理层对 2026 年合同收入的目标，不是 ARR 或经审计的实现收入。现有资料无法支持当前员工数、客户数、历史融资额、现金余额或债务数据。
