      - number: '5.2'
        title: AV2.0 架构与双模型框架
        blocks:
          - type: paragraph
            body: >-
              PlusAI 的 AV2.0 技术栈用双模型框架替代规则繁重的传统机器人代码，把高层推理与即时反射式车辆控制分开。主边缘驾驶系统的核心是 Vision Language
              Model，负责场景抽象和语义推理，判断模糊道路状况、施工标志及交通参与者意图。高层指令输入端到端 transformer
              反射模型，由其高频预测运动并规划转向、油门和制动轨迹。为满足汽车安全标准，主驾驶模型持续由独立边缘后备系统监控，该系统执行确定性的规则安全边界。若意外边缘情况或传感器退化超出运营设计域，云端远程驾驶提供人在回路的异常处理；SimVerse
              神经仿真则用数百万合成和记录道路场景验证模型表现。
            claimRefs:
              - CE001
