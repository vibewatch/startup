        title: 展示
        blocks:
          - type: callout
            title: 自下而上的场景比标题市场更易审计
            body: $1B+ ARR 场景明确列出两项主要假设——每辆卡车约 $40,000、2031 年 25,000 辆卡车——而 $1.7T headline 在保留证据中没有披露可触达支出的分母。
            calloutType: insight
            claimRefs:
              - CM006
