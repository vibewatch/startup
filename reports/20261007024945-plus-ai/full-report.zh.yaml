  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局、行业架构与消歧边界
        blocks:
          - type: paragraph
            body: >
              Plus Automation, Inc.（PlusAI）的竞争格局有两个分析维度：自动驾驶商用卡车软件与 Physical AI
              的直接市场竞争，以及公开情报中的品牌结构性消歧。在重型商用车自动化这一核心领域，PlusAI 与一批自动驾驶系统开发商竞争。行业分为两类：收购并管理自有车队、资产较重的 Autonomous Freight
              Network（AFN）运营商；以及直接与原始设备制造商（OEM）合作、资产较轻的软件开发商。PlusAI 采用轻资产软件模式，与 TRATON
              GROUP（Scania、MAN、International）、Hyundai 和 IVECO 合作开发 SuperDrive
              虚拟驾驶员，让工厂制造的卡车实现自动驾驶。自动驾驶卡车软件的现状替代方案仍是传统人工驾驶的 Class 8 货运，车队承担较高的每英里人工成本并持续面临司机短缺。与此同时，市场研究和竞争情报工具常把 PlusAI
              与 plusai.com 旗下无关的 SaaS 演示软件开发商混为一谈。该实体向 Google Slides 和 PowerPoint 销售 AI 插件，直接与
              Beautiful.ai、Gamma、Pitch、Presentations.ai 和 Slidebean 等演示平台竞争。严谨尽调必须严格区分 PlusAI 的重型车辆自动化技术与办公效率软件插件。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
