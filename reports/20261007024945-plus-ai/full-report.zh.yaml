  - id: FI001
    title: Plus.ai 自动驾驶卡车经济性瀑布桥
    type: waterfall
    summary: 以每辆 Class 8 自动驾驶卡车为单位，示意年度收入与成本桥接关系，展示车队 DaaS 支出如何转化为 Plus.ai 软件净毛利。
    data:
      items:
        - label: 车队 DaaS 总支出
          value: 200000
          unit: USD
          detail: 240,000 英里自动驾驶里程，车队按每英里 $0.85 向 OEM 支付
        - label: OEM 留存的硬件与服务利润
          value: -160000
          unit: USD
          detail: OEM 为车辆集成、保修和现场支持留存 DaaS 费用的约 75-80%
        - label: PlusAI SuperDrive 软件收入
          value: 40000
          unit: USD
          detail: PlusAI 按每英里签约的软件许可费，约占 DaaS 经济效益的 20-25%
        - label: 云端与虚拟驾驶员交付成本
          value: -6000
          unit: USD
          detail: 云计算、仿真数据流和远程监控的估算成本（约占软件收入的 15%）
        - label: PlusAI 软件毛利
          value: 34000
          unit: USD
          detail: 商业化规模下，每辆部署的卡车目标软件毛利率约为 85%
        - label: 单位净贡献
          value: 34000
          unit: USD
          detail: 每辆已部署 Class 8 卡车的年度直接现金贡献，未扣除公司研发管理费用
    approximationNotes: 经济性基于 PlusAI 2026 年 1 月分析师日演示材料中的管理层示意性预测，假设每年自动驾驶 240,000 英里、DaaS 总费率为每英里 $0.85。
    claimRefs:
      - CI002
      - CI003
      - CI007
      - CI011
  - id: FE001
    title: SuperDrive 与 HyperFoundry 技术栈
    type: stack
    summary: PlusAI 实体 AI 平台的分层架构，从传感器输入经基础模型延伸至边缘执行。
    data:
      layers:
        - label: 传感器与底盘接口
          detail: 摄像头、雷达和激光雷达数据流，与 OEM 线控制动、转向及动力总成接口相连接
        - label: 感知与世界表征
          detail: 深度神经网络处理 360 度多模态输入、3D 占用栅格和动态障碍物跟踪
        - label: 推理核心（视觉语言模型）
          detail: 语义推理引擎生成透明、可解释的驾驶逻辑和高层场景抽象
        - label: 反射引擎（端到端 Transformer）
          detail: 以低延迟、高频率完成运动预测、轨迹规划和动态车辆运动控制
        - label: 安全保障与冗余边缘回退
          detail: 确定性的基于规则的安全边界、独立监控系统，以及触发最低风险机动的故障安全执行机制
        - label: 云端远程运营与 SimVerse 引擎
          detail: 远程人机协同异常处理、车队调度集成和神经闭环仿真
    approximationNotes: 该架构图反映公开的 AV2.0 设计披露和投资者演示材料。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    data:
      items:
        - label: 联合工程评估
          detail: OEM 对 SuperDrive 虚拟驾驶员以及 HyperFoundry 仿真和数据集能力进行技术审查
          tone: neutral
          touchpoints:
            - 将 AV2.0 视觉语言模型与传统自动驾驶技术栈进行基准比较
            - 确立汽车安全案例准备度（SCR）和硬件集成规格
        - label: 开发协议与数据合同
          detail: 签署 HyperFoundry 数据工具及 OEM 工厂联合设计的商业合同
          tone: positive
          touchpoints:
            - 签署 Autonomy Acceleration Program 协议（$25M TRATON 协议）
            - 授权使用 Data Factory、Model Factory 和 SimVerse 神经仿真模块
        - label: 工厂集成与装配
          detail: 直接在 OEM 装配线上安装 SuperDrive 计算设备、摄像头传感器和车辆执行器
          tone: positive
          touchpoints:
            - 在 OEM 车辆底盘上验证工厂预装硬件（International、MAN、Scania）
            - 交付前测试冗余制动、转向和边缘计算单元
        - label: 实时货运路线试点
          detail: 在商业车队调度下驶入专用干线货运走廊
          tone: positive
          touchpoints:
            - 与 Ryder System 一起启动沿 I-35 走廊每日 600 英里往返的货运运行
            - 记录实时商业运营里程，由人类安全驾驶员维持 100% 准时交付
        - label: 运营扩张与 ODD 延伸
          detail: 扩展路线复杂度、夜间运营和施工区域导航能力
          tone: neutral
          touchpoints:
            - 软件更新后，自动驾驶路线覆盖率达到 92%，并支持夜间驾驶
            - 将终端出车前检查时间缩短至 30 分钟以内
        - label: 无人驾驶系列推广（目标 2027 年）
          detail: 转为完全无人驾驶的商业货运运营，每辆卡车签约 ARR 为 $40k
          tone: risk
          touchpoints:
            - 获得监管部门批准的驾驶员退出运营许可及客户安全认可
            - 消除人类驾驶员休息限制，将车队资产利用率提高 4.5x
    approximationNotes: 旅程阶段模拟企业从 OEM 集成和受监督车道试验，过渡到预计 2027 年的无人驾驶运营。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU007
      - CU009
      - CU010
  - id: FR001
    title: 风险严重程度与可能性评估矩阵
    type: matrix
    summary: 风险评估矩阵按可能性和严重程度两个维度，映射技术、运营、财务和交易对手的核心脆弱点。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重程度：关键
          values:
            - label: 网络安全入侵
              detail: 未经授权篡改车辆，或利用车队范围的传感器网络
              tone: negative
            - label: 驾驶员退出后的硬件故障
              detail: 无人商业车道运行期间发生无法遏制的机械或计算故障
              tone: critical
            - label: TRATON 项目取消
              detail: 锚定客户流失，该客户占当前签约收入 $25M 的 100%
              tone: critical
        - label: 严重程度：高
          values:
            - label: CFIUS / 出口审查
              detail: 对跨境 AI 软件和数据管道传输施加监管限制
              tone: neutral
            - label: SPAC 信托赎回
              detail: 股东过度赎回，减少交易后的资产负债表净现金
              tone: critical
            - label: 内部控制薄弱
              detail: 财务报告缺陷持续存在，延迟履行公开报告合规要求
              tone: warning
        - label: 严重程度：中
          values:
            - label: 远程操控延迟
              detail: 偏远货运车道路段出现临时蜂窝网络断连
              tone: positive
            - label: 监管测试阻力
              detail: 核心得州运营范围以外的州级许可延误
              tone: warning
            - label: 认股权证稀释压力
              detail: 合并后的认股权证行权压低普通股市场定价
              tone: neutral
        - label: 严重程度：低
          values:
            - label: 轻微传感器校准漂移
              detail: 在计划中的终端维护期间解决常规摄像头或雷达偏移
              tone: positive
            - label: 与 Slide AI 的品牌混淆
              detail: 市场消费者将其与总部位于西雅图的 Plus AI 演示制作插件混淆
              tone: positive
            - label: 仿真基准差异
              detail: 神经闭环仿真验证保真度存在差异
              tone: positive
        - label: 严重程度：可忽略
          values:
            - label: 公关信息波动
              detail: 媒体例行询问自动驾驶商用车辆测试
              tone: positive
            - label: 供应商冗余
              detail: 对替代一级摄像头和雷达硬件供应商进行资质认证
              tone: positive
            - label: 测试车道重新规划
              detail: 因局部高速公路维护而进行轻微路线绕行调整
              tone: positive
        - label: 信息性监测
          values:
            - label: 专利公开节奏
              detail: 定期披露自动驾驶感知和轨迹规划方法
              tone: neutral
            - label: 竞争对手试点里程碑
              detail: 跟踪自动驾驶卡车同行开展的驾驶员退出商业运行
              tone: neutral
            - label: 宏观物流量变化
              detail: 北美整车运输市场的周期性货运量波动
              tone: neutral
      xAxis:
        label: 可能性
      yAxis:
        label: 严重程度
    approximationNotes: 严重程度和可能性评分是基于披露的风险因素、资本结构条款和运营里程碑得出的分析性评估。
    claimRefs:
      - CR001
      - CR004
      - CR012
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策路径将运营证据与交易条款及尚未解决的投资评估要素分开。
    data:
      nodes:
        - label: 运营证明
          detail: $25M TRATON 协议收入和受监督的付费货运试点
        - label: 商业化缺口
          detail: 驾驶员退出后的规模化运营、客户多元化和经常性经济性仍未验证
        - label: 交易参考值
          detail: $800M 交易前股权估值及约 $896M 备考企业价值
        - label: 资本调整
          detail: 纳入最终赎回、债务、可转债、认股权证、业绩奖励、授予奖励和交易成本
        - label: 证据门槛
          detail: 要求提供有效申报文件、经审计的 2026 年业绩和独立估值背景
        - label: 建议
          detail: 继续研究；不要仅凭指定证据评估公允价值
      edges:
        - from: Operating proof
          to: Commercial gap
        - from: Commercial gap
          to: Transaction reference
        - from: Transaction reference
          to: Capital adjustment
        - from: Capital adjustment
          to: Evidence threshold
        - from: Evidence threshold
          to: Recommendation
    approximationNotes: 这是定性的决策顺序，不代表数值概率、转化率或估值结果。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV007
      - CV011
      - CV016
