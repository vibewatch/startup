  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与排除项
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 的核心市场是让工厂制造的商用卡车实现 Level 4 自动驾驶的软件。SuperDrive 定位为虚拟驾驶员，OEM
              伙伴负责提供、集成、制造、销售和维护实体车辆。因此，可触达收入池是自动驾驶软件及按使用计费的服务收入，不包括卡车、挂车、燃油、货运经纪、仓储运营或承运商收入的全部价值。HyperFoundry
              属于相邻市场：PlusAI 向汽车及其他 Physical AI 开发者销售 AV 数据、模型和仿真工具。资料池还包含 plusai.com 上无关演示软件业务的若干结果。这些页面讨论
              PowerPoint、Google Slides 及按席位定价，只能用于确认一个应排除的同名类别，不得用于估算自动驾驶卡车市场规模。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.2'
        title: 受证据约束的规模估算视角
        blocks:
          - type: paragraph
            body: >-
              现有规模证据来自公司，应视为一组假设的层级，而不是经过独立验证的 TAM、SAM 和 SOM。PlusAI 将全球重型卡车市场标为 $1.7 trillion，但保留的演示稿没有披露分母或计算方法。更窄的
              SuperDrive 场景更易审计：管理层以每辆卡车约 $40,000 的年收入乘以 2031 年预计 25,000 辆卡车，得出规模化后 $1B+ ARR。同一演示稿还称 HyperFoundry 每年有
              $50 million 至 $100 million-plus 的独立机会，同样基于内部估算。独立的 GetLatka
              页面估算的是公司收入而非市场需求，因此无法验证这些机会规模。证据支持场景分析，不支持市场份额预测。
