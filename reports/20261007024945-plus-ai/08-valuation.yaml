        - "Unquantified; no independent forecast or probability evidence is assigned"
        - "Confirm diversified contracts, audited revenue, gross margin, retention, and driver-out commercial operations"
      - - "Base"
        - "Company approaches its $40M-$50M 2026 target and closes the TVAC transaction near modeled trust retention"
        - "The proposed ~$896M EV is a transaction reference, not a verified fair-value range"
        - "Unquantified; depends on filing, vote, redemption, and audited-result evidence"
        - "Reconcile final proceeds, fully diluted shares, and actual 2026 results"
      - - "Bear"
        - "Redemptions reduce proceeds, new financing dilutes holders, concentration persists, or commercialization slips"
        - "Downside may be below the transaction reference; the assigned evidence cannot support a precise floor"
        - "Material because management discloses continuing losses and limited-customer dependence"
        - "High redemptions, additional capital need, control-remediation delay, or missed commercial milestones"
    notes: "No numerical probability or unsupported valuation range is assigned; each case is a diligence-conditioned path based on company disclosures."
