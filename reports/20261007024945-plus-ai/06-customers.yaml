chapter:
  number: 6
  title: "Customers"
  summary: "PlusAI's commercial customer traction is bifurcated between factory-installed OEM development partnerships with TRATON GROUP, IVECO, and Hyundai, and active commercial freight fleet deployments with Ryder System and International Motors along the I-35 corridor in Texas. Monetization is initiated through $25 million in contracted revenue from TRATON via the HyperFoundry platform, while fleet-level SuperDrive L4 driverless operations remain in supervised pilot status ahead of targeted 2027 series production. Due diligence requires distinguishing heavy-duty autonomous trucking customer relationships from unrelated slide productivity software operating under the Plus AI brand."
sections:
  - id: "section-customer-segmentation"
    title: "Customer Base Segmentation and Buyer Dynamics"
    body: "PlusAI's commercial strategy addresses two distinct enterprise customer tiers within global logistics: commercial vehicle original equipment manufacturers (OEMs) and freight fleet transport operators. Commercial vehicle OEMs—headlined by TRATON GROUP (including Scania, MAN, and International Motors), IVECO, and Hyundai Motor Company—act as primary distribution partners and direct software buyers. These manufacturers integrate PlusAI's SuperDrive virtual driver software directly into factory assembly lines, procuring autonomy software licenses and engineering acceleration services through the HyperFoundry platform. In contrast, commercial fleet operators such as Ryder System, Inc. represent the operational end-users and route customers. Fleet buyers evaluate autonomous trucking systems on operational availability, cost-per-mile reduction against rising driver wage rates (which account for approximately forty-four percent of per-mile trucking costs), hours-of-service relief, and route predictability. In parallel, software indexes also document customer adoption of an unrelated productivity tool named Plus AI, which provides presentation-generation add-ons for Google Slides and Microsoft PowerPoint across enterprise marketing and consulting knowledge workers."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU013"
    tableRefs:
      - "TU001"
  - id: "section-commercial-traction-adoption"
    title: "Commercial Traction, Revenue Acceleration, and Adoption Trajectory"
    body: "PlusAI has established initial commercial revenue ahead of full uncrewed autonomous trucking deployment by monetizing its autonomy infrastructure platform. Under the Autonomy Acceleration Program Agreement with cornerstone OEM partner TRATON GROUP, PlusAI recognized twenty-five million dollars in contracted revenue during 2026 for providing autonomy datasets, development tools, and engineering acceleration services from its HyperFoundry platform. Management targets full-year 2026 contracted revenue between forty million and fifty million dollars, with longer-term platform revenue potential projected between fifty million and one hundred million dollars annually. For its core SuperDrive virtual driver, commercial monetization is structured on a per-truck recurring software subscription basis (contracted at approximately forty thousand dollars in annual recurring revenue per vehicle) once factory-installed autonomous trucks enter series production targeted for 2027. This dual-track revenue architecture provides near-term cash generation from Tier-1 OEM engineering contracts while building deployment pipelines toward long-haul logistics fleets."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "section-named-deployments-outcomes"
    title: "Named Customer Deployments and Operational Fleet Proof"
    body: "Operational proof for SuperDrive in commercial freight workflows is anchored by an active commercial pilot announced in early 2026 with Ryder System, Inc. and International Motors. Operating along the six-hundred-mile roundtrip Interstate 35 freight corridor between Ryder logistics warehouses in Laredo and Temple, Texas, factory-integrated International commercial trucks equipped with SuperDrive transport live customer freight. Disclosed deployment metrics demonstrate that the pilot logged more than seventy-five thousand cumulative miles across over one hundred twenty-five commercial runs. SuperDrive achieved one hundred percent on-time delivery and ninety-two percent autonomous route coverage, with vehicle operations supervised by an onboard safety driver. Pre-trip vehicle and sensor inspections were consistently completed in under thirty minutes. Ongoing software updates have expanded the vehicle's operational design domain to accommodate nighttime driving and complex highway construction zones, demonstrating the feasibility of integrating autonomous prime movers into existing fleet hub-and-spoke logistics schedules."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "section-retention-concentration-market-disambiguation"
    title: "Contract Durability, Concentration Risks, and Market Disambiguation"
    body: "PlusAI's commercial profile exhibits significant customer and partner concentration. Recognized revenue is heavily concentrated in a single OEM counterparty, TRATON GROUP, which accounts for the entire twenty-five million dollars in contracted HyperFoundry revenue announced to date. Long-term commercial success depends on TRATON, IVECO, and Hyundai maintaining factory integration schedules through their targeted 2027 commercial launches without cancellation or technology re-scoping. In the carrier segment, Ryder's deployment remains structured as an operational pilot with human safety drivers rather than an uncrewed commercial freight contract. Diligence must also resolve persistent name overlap across software discovery engines: independent reviews from Julius AI and marketplace listings on Google Workspace Marketplace evaluate an entirely separate productivity add-on operated by Plus AI (plusai.com), which boasts over nine hundred reviews and a 4.5-star rating while noting customer support and billing complaints. Separating trucking autonomy proof from productivity software metrics is essential to evaluating genuine retention and contractual durability."
    claimRefs:
      - "CU008"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
