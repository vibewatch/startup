callouts:
  - calloutType: "insight"
    title: "Capital-Light OEM Partnership Architecture Isolates Vehicle Capex"
    body: "Plus.ai's choice to commercialize via factory-installed OEM partnerships rather than owning and operating freight fleets creates a structurally superior gross margin profile of ~85% at scale. By transferring vehicle manufacturing, hardware warranty, depot operations, and vehicle financing to partners like TRATON, IVECO, and Hyundai, Plus.ai preserves its capital for core AI algorithm and safety case validation."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI007"
  - calloutType: "risk"
    title: "Severe Financing Vulnerability to SPAC Shareholder Redemptions"
    body: "The projected $135M pro forma cash injection required to reach 2027E cash flow breakeven relies on an assumed 57.6% redemption rate from TVAC's trust. If public shareholder redemptions track recent autonomous vehicle SPAC averages above 80% to 90%, net cash proceeds could drop precipitously, forcing Plus.ai to seek expensive dilutive equity or debt financing before commercial L4 launch."
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
