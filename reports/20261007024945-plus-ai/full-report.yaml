  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The decision path separates operating evidence from transaction terms and unresolved underwriting inputs.
    data:
      nodes:
        - label: Operating proof
          detail: $25M TRATON agreement revenue and a supervised paid-freight pilot
        - label: Commercial gap
          detail: Driver-out scale, customer diversification, and recurring economics remain unverified
        - label: Transaction reference
          detail: $800M pre-money equity and approximately $896M pro forma enterprise value
        - label: Capital adjustment
          detail: Apply final redemptions, debt, convertibles, warrants, earnout, awards, and transaction costs
        - label: Evidence threshold
          detail: Require operative filings, audited 2026 results, and independent valuation context
        - label: Recommendation
          detail: Research more; do not underwrite fair value from the assigned evidence
      edges:
        - from: Operating proof
          to: Commercial gap
        - from: Commercial gap
          to: Transaction reference
        - from: Transaction reference
          to: Capital adjustment
        - from: Capital adjustment
          to: Evidence threshold
        - from: Evidence threshold
          to: Recommendation
    approximationNotes: >-
      This is a qualitative decision sequence; it does not imply numerical probabilities, conversion rates, or valuation
      outputs.
