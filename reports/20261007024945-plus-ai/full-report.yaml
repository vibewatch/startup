        title: Capitalization and Commercial Scale
        blocks:
          - type: paragraph
            body: >-
              On September 3, 2026, PlusAI announced a definitive business combination with Texas Ventures Acquisition
              III at an $800 million pre-money equity value. The release describes up to approximately $300 million of
              capital: more than $60 million of committed financing plus a trust then reported at approximately $236
              million. These are transaction sources, not cash already available to PlusAI, and public-shareholder
              redemptions and other closing conditions can reduce proceeds. Commercial disclosure is similarly
              definition-sensitive. PlusAI says it recognized $25 million of revenue under its TRATON agreement, while
              the $40 million to $50 million figure is a management target for 2026 contracted revenue, not ARR or
              audited realized revenue. Current headcount, customer count, historical funding raised, cash balance, and
