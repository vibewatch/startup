      - number: '6.3'
        title: Named Customer Deployments and Operational Fleet Proof
        blocks:
          - type: paragraph
            body: >-
              Operational proof for SuperDrive in commercial freight workflows is anchored by an active commercial pilot
              announced in early 2026 with Ryder System, Inc. and International Motors. Operating along the
              six-hundred-mile roundtrip Interstate 35 freight corridor between Ryder logistics warehouses in Laredo and
              Temple, Texas, factory-integrated International commercial trucks equipped with SuperDrive transport live
              customer freight. Disclosed deployment metrics demonstrate that the pilot logged more than seventy-five
              thousand cumulative miles across over one hundred twenty-five commercial runs. SuperDrive achieved one
              hundred percent on-time delivery and ninety-two percent autonomous route coverage, with vehicle operations
              supervised by an onboard safety driver. Pre-trip vehicle and sensor inspections were consistently
              completed in under thirty minutes. Ongoing software updates have expanded the vehicle's operational design
              domain to accommodate nighttime driving and complex highway construction zones, demonstrating the
              feasibility of integrating autonomous prime movers into existing fleet hub-and-spoke logistics schedules.
            claimRefs:
              - CU009
