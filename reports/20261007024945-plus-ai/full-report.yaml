              - CI003
              - CI007
              - CI011
      - number: '4.2'
        title: Operating Cost Structure, Gross Margin Trajectory, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Plus.ai's financial architecture is structured around software-first operating leverage and zero vehicle
              manufacturing capital expenditure. Unlike vertically integrated autonomous vehicle operators that finance,
              own, and maintain dedicated truck depots, Plus.ai concentrates its expense base in research and
              development, safety case validation, and deep neural network (DNN) model distillation. Historical non-GAAP
              operating expenses totaled $54M in 2024A (comprising $37M in R&D and $16M in SG&A, with $4.1M in
              stock-based compensation) and increased to $70M in 2025A (comprising $51M in R&D and $19M in SG&A, with
              $1.8M in stock-based compensation). Management forecasts operating expenses of $71M in 2026E ($51M R&D,
              $20M SG&A) and $77M in 2027E ($56M R&D, $21M SG&A), reflecting disciplined overhead growth as
              factory-integrated production begins. In earlier financial disclosures from its January 2026 Analyst Day
              presentation, operating expense trajectories were modeled at $75M in 2025 and $106M in 2027, indicating
              that the company tightened planned commercial overhead ahead of its September 2026 SPAC announcement.
              Because hardware bills of materials, compute installation, and field service labor are absorbed directly
              by OEM partners and fleet purchasers, Plus.ai avoids depot infrastructure capex and vehicle depreciation.
              This asset-light distribution posture is designed to deliver gross margins above 85% once recurring
              per-mile software licensing ramps. However, the path to sustained operating profitability requires
              expanding deployed units beyond initial test fleets, as near-term gross profit from $25M in contracted
              revenue remains insufficient to cover annual cash operating expenditures exceeding $70M.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
              - CI015
      - number: '4.3'
        title: Capital Adequacy, SPAC Financing Dependency, and Dilution Structure
        blocks:
          - type: paragraph
            body: >-
              Plus.ai's forward capital adequacy is fundamentally tied to the consummation and net proceeds of its
              proposed business combination with Texas Ventures Acquisition III Corp. (Nasdaq: TVA), announced on
              September 3, 2026. Prior to this definitive agreement, Plus.ai had raised approximately $420M in private
              equity funding across recorded venture rounds, including a $220M Series D round in April 2021, and had
              evaluated a potential combination with Churchill Capital Corp. IX in early 2026 before entering definitive
              terms with TVAC. The TVAC transaction values Plus.ai at an $800M pre-money equity value ($10.00 per
              share), implying a pro forma enterprise value of $896M and pro forma equity value of $1,031M. Transaction
              sources comprise $800M in PlusAI rollover equity (77.6% pro forma ownership), $60M in PIPE proceeds
              primarily via unsecured convertible notes, and an assumed $100M retained from TVAC's $236M trust account
              under an assumed 57.6% shareholder redemption rate. This transaction structure models $135M in net cash
              added to the balance sheet after paying an estimated $25M in transaction advisory expenses. Under
              management's operating plan, this cash infusion is projected to provide sufficient liquidity to approach
              operational breakeven in 2026E and achieve positive cash flow in 2027E alongside commercial driverless
              vehicle deployments. Nevertheless, the financing structure exposes Plus.ai to substantial capital adequacy
              risks: TVAC shareholders face significant redemption incentives given that SPAC peers frequently trade
              below $10.00, high redemption rates could reduce net proceeds below the $100M assumption, and the company
              has disclosed historical material weaknesses in internal control over financial reporting for the fiscal
              years ended December 31, 2024 and 2025.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital-Light OEM Partnership Architecture Isolates Vehicle Capex
            body: >-
              Plus.ai's choice to commercialize via factory-installed OEM partnerships rather than owning and operating
              freight fleets creates a structurally superior gross margin profile of ~85% at scale. By transferring
              vehicle manufacturing, hardware warranty, depot operations, and vehicle financing to partners like TRATON,
              IVECO, and Hyundai, Plus.ai preserves its capital for core AI algorithm and safety case validation.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI007
          - type: callout
            title: Severe Financing Vulnerability to SPAC Shareholder Redemptions
            body: >-
              The projected $135M pro forma cash injection required to reach 2027E cash flow breakeven relies on an
              assumed 57.6% redemption rate from TVAC's trust. If public shareholder redemptions track recent autonomous
              vehicle SPAC averages above 80% to 90%, net cash proceeds could drop precipitously, forcing Plus.ai to
              seek expensive dilutive equity or debt financing before commercial L4 launch.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Commercial Portfolio
        blocks:
          - type: paragraph
            body: >-
              PlusAI defines its commercial offering around Physical AI software designed to eliminate human driver
              constraints in heavy-duty logistics. Rather than assembling specialized autonomous trucks or performing
              aftermarket fleet retrofits, the company develops embedded autonomy software that integrates directly into
              factory assembly lines operated by commercial vehicle manufacturers. The flagship commercial product is
              SuperDrive, a full-stack Level 4 virtual driver engineered to operate commercial Class 8 trucks across
              complex line-haul corridors. Supporting SuperDrive is HyperFoundry, a foundational autonomous vehicle
              development engine comprising three operational sub-systems: Data Factory for automated multimodal dataset
              ingestion and auto-labeling, Model Factory for vision-language-action model distillation onto automotive
              edge processors, and SimVerse for neural closed-loop road simulation. This software-first model has
              generated initial commercial traction through a twenty-five million dollar autonomy acceleration agreement
              with TRATON GROUP while advancing towards factory-installed commercial series production targeted for
              2027.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.2'
        title: AV2.0 Architecture and Dual-Model Framework
        blocks:
          - type: paragraph
            body: >-
              PlusAI's AV2.0 technology stack replaces conventional rule-heavy robotic code with a dual-model framework
              that decouples high-level reasoning from immediate reflex vehicle control. At the core of the primary edge
              driving system is a Vision Language Model that performs scene abstraction and semantic reasoning,
              evaluating ambiguous roadway conditions, construction signage, and traffic participant intent. This
              high-level guidance feeds into an end-to-end transformer reflex model that executes high-frequency motion
              forecasting and trajectory planning for vehicle steering, throttle, and braking actuation. To satisfy
              automotive safety standards, the primary driving models are continuously monitored by an independent edge
              fallback system that enforces deterministic rule-based safety envelopes. If unexpected corner cases or
              sensor degradation exceed the operational design domain, cloud-based teleoperation systems provide
              human-in-the-loop exception handling, while SimVerse neural simulation validates model performance against
              millions of synthetic and recorded roadway scenarios.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE010
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
