      - number: '5.3'
        title: Customer Workflows and Operational Design Domain
        blocks:
          - type: paragraph
            body: >-
              In customer deployment environments, SuperDrive is tailored to commercial hub-to-hub freight lanes that
              currently suffer from severe driver hours-of-service limitations and asset underutilization. On active
              freight lanes such as the six-hundred-mile roundtrip corridor along Interstate 35 between Ryder logistics
              facilities in Laredo and Temple, Texas, the system executes daily line-haul runs integrated directly into
              existing freight operations. Commercial vehicle pilots conducted with International Class 8 trucks have
              demonstrated one hundred percent on-time delivery across seventy-five thousand cumulative miles with
              ninety-two percent autonomous route coverage under safety driver supervision. Fleet deployment workflows
              require pre-trip inspections completed in under thirty minutes, followed by autonomous highway dispatch
              where SuperDrive manages high-speed transit, lane merging, night driving, and active work zones. By
              eliminating driver rest-break mandates, autonomous operating models enable trucks to reach approximately
              two hundred forty thousand annual operating miles compared to roughly eighty-six thousand miles for
              human-driven tractors.
            claimRefs:
              - CE006
              - CE008
