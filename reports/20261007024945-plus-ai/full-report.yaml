      - number: '6.4'
        title: Contract Durability, Concentration Risks, and Market Disambiguation
        blocks:
          - type: paragraph
            body: >-
              PlusAI's commercial profile exhibits significant customer and partner concentration. Recognized revenue is
              heavily concentrated in a single OEM counterparty, TRATON GROUP, which accounts for the entire twenty-five
              million dollars in contracted HyperFoundry revenue announced to date. Long-term commercial success depends
              on TRATON, IVECO, and Hyundai maintaining factory integration schedules through their targeted 2027
              commercial launches without cancellation or technology re-scoping. In the carrier segment, Ryder's
              deployment remains structured as an operational pilot with human safety drivers rather than an uncrewed
              commercial freight contract. Diligence must also resolve persistent name overlap across software discovery
              engines: independent reviews from Julius AI and marketplace listings on Google Workspace Marketplace
              evaluate an entirely separate productivity add-on operated by Plus AI (plusai.com), which boasts over nine
              hundred reviews and a 4.5-star rating while noting customer support and billing complaints. Separating
              trucking autonomy proof from productivity software metrics is essential to evaluating genuine retention
              and contractual durability.
            claimRefs:
              - CU008
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: HyperFoundry Provides Critical Revenue Bridge Prior to L4 Series Launch
            body: >-
              By unbundling its autonomy toolchain into HyperFoundry, PlusAI monetized its AV data and simulation models
              for $25 million in 2026 with TRATON, establishing commercial revenue years before full driverless truck
              series production.
            calloutType: insight
            claimRefs:
