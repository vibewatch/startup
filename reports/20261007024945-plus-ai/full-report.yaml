        title: Execution Milestones and Open Issues
        blocks:
          - type: paragraph
            body: >-
              The operating evidence shows progress but remains predominantly company-issued. A Texas trial began in
              September 2025, and company materials later reported more than 75,000 cumulative miles, more than 125
              runs, and 92% autonomous route coverage under human safety-driver supervision. For the second half of
