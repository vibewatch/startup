      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              The proposed public-listing structure changed during 2026. January and April company communications
              described a combination with Churchill Capital Corp IX, while the Q3 investor presentation describes a
              transaction with Texas Ventures Acquisition III Corp. [CV009]. The later deck models $60 million of
              approximate committed capital, $100 million of assumed trust cash, $135 million of cash to the balance
              sheet, and $25 million of estimated transaction expenses [CV005]. Its $100 million trust contribution
              assumes a 57.6% redemption rate and explicitly excludes existing cash or debt from the pro forma valuation
              bridge [CV006]. These are not equivalent to cash available today. The structure also leaves fully diluted
              ownership incomplete because specified potential dilution is excluded [CV007]. An older independent report
              shows that Plus had explored SPAC financing years earlier, which establishes a history of seeking
              public-market capital but does not validate the current price or terms [CV015].
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
      - number: '8.3'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that PlusAI can monetize an OEM-distributed software layer without funding truck
              manufacturing itself. The company reports more than seven million autonomy miles, six OEM partners, and
              factory-built programs with TRATON, Hyundai, and IVECO [CV001]. It also states that $25 million of revenue
              was recognized under the TRATON agreement and targets $40–50 million of 2026 revenue, providing a
              nearer-term monetization bridge while SuperDrive remains pre-commercial [CV002, CV003]. The anti-thesis is
              equally material: the revenue evidence is concentrated in one named agreement, the Ryder/International
              route remains supervised by a human safety driver, and management itself discloses continuing losses,
              limited-customer dependence, technology risk, and internal-control weaknesses [CV011, CV012, CV013,
              CV014]. The assigned source set therefore supports proof of activity, not proof of a scalable,
              diversified, profitable franchise.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Scenarios, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Numerical bull and bear valuation ranges are not supportable from the assigned evidence: the only current
              benchmark page is management's own comparison, and no independent transaction filing, market-data source,
              or audited forecast was allocated to this worker. Scenarios should therefore be treated as conditional
              decision paths rather than point estimates. A bull path requires diversified HyperFoundry demand,
              driver-out commercial evidence, and financing that preserves runway; a base path requires delivery against
              the 2026 target plus transparent fully diluted economics; and a bear path is signaled by high redemptions,
              more financing, customer concentration, or delayed commercialization [CV003, CV006, CV011, CV013]. Board
              additions improve public-company preparation, but they do not close the financial-evidence gap [CV010].
              Exit readiness remains conditional on transaction completion, Nasdaq eligibility, audited results, control
              remediation, and a liquid post-closing market [CV014].
            claimRefs:
              - CV003
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry discipline
            body: >-
              Do not equate the proposed transaction value with independently verified fair value. Re-underwrite only
              after final redemptions, fully diluted capitalization, closing cash, and audited 2026 performance are
              available.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV016
