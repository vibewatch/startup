            body: >-
              The September 2026 investor presentation names four co-founders in operating leadership: David Liu as
              chief executive, Shawn Kerrigan as chief operating officer, Hao Zheng as chief technology officer, and Tim
              Daly as chief architect. Bryant Park is listed as chief financial officer and Derrick Nueman as vice
              president of investor relations. The assigned evidence does not establish the board roster, committee
              composition, executive tenure, compensation, or succession arrangements. That omission matters because the
              same company-issued presentation identifies dependence on senior management and specifically the
              co-founders as an investment risk. The available record therefore supports functional coverage at the
