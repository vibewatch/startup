      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              SuperDrive uses an OEM-led route to market. PlusAI says OEMs factory-install the software and sell
              autonomous trucks through their existing channels; fleets then pay the OEM a usage-based
              Driver-as-a-Service charge. This makes the OEM the integration and distribution counterparty, while the
              fleet is the operating customer and economic payer. Public evidence does not identify named internal
              budget owners or procurement approval thresholds, so those fields remain diligence gaps rather than
              inferred executive titles. Adoption proceeds from safety-driver trials and factory integration to
              driver-out commercial operations. The retained Ryder and International route is useful workflow evidence
              because it carries paid freight on an existing 600-plus-mile lane, but the presentation states that it
              remains supervised by a human safety driver and therefore does not prove driverless commercial readiness.
            claimRefs:
