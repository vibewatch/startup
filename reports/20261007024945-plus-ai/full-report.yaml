      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Model Architecture Separates Reasoning and Reflex Controls
            body: >-
              PlusAI's AV2.0 decoupling of semantic VLM reasoning from high-frequency transformer reflexes addresses
              both interpretability for regulators and millisecond-level responsiveness for highway trucking safety.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Entity Ambiguity and Commercial Proof Gaps
            body: >-
              While PlusAI has contracted factory-installed OEM trials with TRATON and Iveco, full L4 driverless
              commercial operations remain slated for 2027, and search confusion with unrelated productivity tools
              underscores the need for clear market positioning.
            calloutType: risk
