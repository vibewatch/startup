            title: Transaction continuity is not established
            body: >-
              Company communications moved from a Churchill IX transaction in January and April 2026 to a TVAC
              transaction in the Q3 presentation. The current operative terms and status require filing-level
              confirmation.
            calloutType: risk
            claimRefs:
              - CV009
