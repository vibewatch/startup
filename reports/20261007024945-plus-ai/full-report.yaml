  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Excluded Spend
        blocks:
          - type: paragraph
            body: >-
              Plus.ai's core market is software that enables Level 4 autonomous operation in factory-built commercial
              trucks. SuperDrive is positioned as the virtual driver, while OEM partners supply, integrate, manufacture,
              sell, and maintain the physical vehicle. The addressable revenue pool is therefore autonomy software and
              usage-based service revenue, not the full value of trucks, trailers, fuel, freight brokerage, warehouse
              operations, or carrier revenue. HyperFoundry is an adjacent market: PlusAI markets AV data, models, and
              simulation tools to automotive and other physical-AI developers. The assigned pool also contains several
              results for an unrelated presentation-software business at plusai.com. Those pages discuss PowerPoint,
              Google Slides, and per-seat software pricing; they are useful only to establish an excluded namesake
              category and must not be used to size autonomous trucking.
