      - number: '6.2'
        title: Commercial Traction, Revenue Acceleration, and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              PlusAI has established initial commercial revenue ahead of full uncrewed autonomous trucking deployment by
              monetizing its autonomy infrastructure platform. Under the Autonomy Acceleration Program Agreement with
              cornerstone OEM partner TRATON GROUP, PlusAI recognized twenty-five million dollars in contracted revenue
              during 2026 for providing autonomy datasets, development tools, and engineering acceleration services from
              its HyperFoundry platform. Management targets full-year 2026 contracted revenue between forty million and
              fifty million dollars, with longer-term platform revenue potential projected between fifty million and one
              hundred million dollars annually. For its core SuperDrive virtual driver, commercial monetization is
              structured on a per-truck recurring software subscription basis (contracted at approximately forty
              thousand dollars in annual recurring revenue per vehicle) once factory-installed autonomous trucks enter
              series production targeted for 2027. This dual-track revenue architecture provides near-term cash
              generation from Tier-1 OEM engineering contracts while building deployment pipelines toward long-haul
              logistics fleets.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
