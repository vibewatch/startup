  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Dynamics
        blocks:
          - type: paragraph
            body: >-
              PlusAI's commercial strategy addresses two distinct enterprise customer tiers within global logistics:
              commercial vehicle original equipment manufacturers (OEMs) and freight fleet transport operators.
              Commercial vehicle OEMs—headlined by TRATON GROUP (including Scania, MAN, and International Motors),
              IVECO, and Hyundai Motor Company—act as primary distribution partners and direct software buyers. These
              manufacturers integrate PlusAI's SuperDrive virtual driver software directly into factory assembly lines,
              procuring autonomy software licenses and engineering acceleration services through the HyperFoundry
              platform. In contrast, commercial fleet operators such as Ryder System, Inc. represent the operational
              end-users and route customers. Fleet buyers evaluate autonomous trucking systems on operational
              availability, cost-per-mile reduction against rising driver wage rates (which account for approximately
              forty-four percent of per-mile trucking costs), hours-of-service relief, and route predictability. In
              parallel, software indexes also document customer adoption of an unrelated productivity tool named Plus
              AI, which provides presentation-generation add-ons for Google Slides and Microsoft PowerPoint across
              enterprise marketing and consulting knowledge workers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU013
