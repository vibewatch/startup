      - number: '5.4'
        title: Safety Framework, Differentiation, and Brand Disambiguation
        blocks:
          - type: paragraph
            body: >-
              PlusAI's primary competitive differentiation rests on its factory-installed OEM distribution model
              alongside TRATON GROUP brands Scania, MAN, and International, as well as Iveco and Hyundai. Embedding
              software during vehicle manufacturing ensures full hardware-software co-design, comprehensive safety
              validation, and warranty compatibility through established OEM dealer networks. The company's safety
              framework combines interpretable semantic decisions with multi-layered redundancy and remote assistance
              fallback. In technical diligence, analysts must also address market disambiguation: external software
              indexes and productivity reviews document an entirely separate software product named Plus AI operating at
              plusai.com, which provides presentation-generation add-ons for Google Slides and Microsoft PowerPoint.
              Distinguishing PlusAI's heavy-truck Physical AI autonomy platform from this unrelated slide-making tool is
              essential for technical indexing, trademark governance, and operational risk assessment.
            claimRefs:
