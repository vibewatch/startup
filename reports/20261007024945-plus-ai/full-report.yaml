      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The economic driver is the labor and utilization gap identified in the company presentation. Citing an
              ATRI operating-cost study, PlusAI reports total U.S. trucking cost of about $2.34 per mile, including
              $1.03 per mile for driver compensation, or 44%. Management's illustrative model replaces that driver cost
              with a $0.85 per-mile payment from the fleet to the OEM and increases annual mileage from roughly 86,000
              to 240,000. These are useful adoption hypotheses, not observed customer economics. Commercial timing is
              constrained by safety validation, truck-hardware reliability, OEM production priorities, fleet investment,
              and differing regulatory regimes. PlusAI's own risk disclosure says commercialization can be delayed by
              safety-case work, partner hardware, and customers deprioritizing autonomy. Valuation should therefore
              distinguish the broad freight cost pool from the narrower, execution-dependent software scenario.
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Bottom-Up Scenario Is More Auditable Than the Headline Market
            body: >-
              The $1B+ ARR scenario exposes its two principal assumptions—approximately $40,000 per truck and 25,000
              trucks in 2031—whereas the $1.7T headline does not disclose its addressable-spend denominator in the
              retained evidence.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM016
          - type: callout
            title: A Paid Pilot Is Not Yet Driverless Commercial Proof
            body: >-
              The retained route evidence shows paid freight in an existing fleet workflow, but the company presentation
              identifies a human safety driver; driver-out readiness, insurance acceptance, and repeatable customer
              economics remain unverified.
            calloutType: risk
            claimRefs:
              - CM012
