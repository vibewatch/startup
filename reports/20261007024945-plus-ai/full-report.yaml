chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Plus Automation, Inc. uses the PlusAI name for a physical-AI software business focused on factory-built
              autonomous commercial trucks. The company describes SuperDrive as its Level 4 virtual-driver product and
              HyperFoundry as the data, model, and simulation platform that also supports nearer-term monetization. Its
              disclosed route to market is software-led: truck OEMs integrate the system at the factory and retain
              manufacturing and distribution responsibilities. Company materials place headquarters in Silicon Valley,
              identify operations in the United States and Europe, and list offices in Santa Clara, Fremont, and Munich.
              This identity must be separated from the unrelated Plus AI presentation product at plusai.com; the latter
              operates inside PowerPoint and Google Slides and is not evidence about the autonomous-trucking company.
