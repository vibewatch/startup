            title: Customer Concentration and Safety-Driver Transition Hurdle
            body: >-
              PlusAI's commercial revenue is currently concentrated in a single OEM customer (TRATON), while fleet
              operations with Ryder remain supervised pilots; commercial viability requires transitioning to uncrewed
              operations without losing anchor OEM support.
            calloutType: risk
