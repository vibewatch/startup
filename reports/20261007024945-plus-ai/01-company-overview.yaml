company:
  name: "Plus.ai"

chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Plus Automation, Inc., operating as PlusAI, sells autonomous-trucking software rather than
    trucks and is pursuing a 2027 commercial launch through OEM partners. Its September 2026
    transaction announcement sets an $800 million pre-money equity value and describes up to
    approximately $300 million of potential transaction capital, but trust redemptions, closing
    conditions, customer concentration, continuing losses, and missing headcount and historical
    funding totals remain material diligence constraints.

sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: >-
      Plus Automation, Inc. uses the PlusAI name for a physical-AI software business focused on
      factory-built autonomous commercial trucks. The company describes SuperDrive as its Level 4
      virtual-driver product and HyperFoundry as the data, model, and simulation platform that also
      supports nearer-term monetization. Its disclosed route to market is software-led: truck OEMs
      integrate the system at the factory and retain manufacturing and distribution responsibilities.
      Company materials place headquarters in Silicon Valley, identify operations in the United
      States and Europe, and list offices in Santa Clara, Fremont, and Munich. This identity must be
      separated from the unrelated Plus AI presentation product at plusai.com; the latter operates
      inside PowerPoint and Google Slides and is not evidence about the autonomous-trucking company.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO016
    tableRefs:
      - TO001

  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      The September 2026 investor presentation names four co-founders in operating leadership:
      David Liu as chief executive, Shawn Kerrigan as chief operating officer, Hao Zheng as chief
      technology officer, and Tim Daly as chief architect. Bryant Park is listed as chief financial
      officer and Derrick Nueman as vice president of investor relations. The assigned evidence does
      not establish the board roster, committee composition, executive tenure, compensation, or
      succession arrangements. That omission matters because the same company-issued presentation
      identifies dependence on senior management and specifically the co-founders as an investment
      risk. The available record therefore supports functional coverage at the executive level, but
      not a conclusion that governance depth or succession risk has been independently tested.
    claimRefs:
      - CO004
      - CO005
    tableRefs:
      - TO002

  - id: "capitalization-and-commercial-scale"
    title: "Capitalization and Commercial Scale"
    body: >-
      On September 3, 2026, PlusAI announced a definitive business combination with Texas Ventures
      Acquisition III at an $800 million pre-money equity value. The release describes up to
      approximately $300 million of capital: more than $60 million of committed financing plus a
      trust then reported at approximately $236 million. These are transaction sources, not cash
      already available to PlusAI, and public-shareholder redemptions and other closing conditions
      can reduce proceeds. Commercial disclosure is similarly definition-sensitive. PlusAI says it
      recognized $25 million of revenue under its TRATON agreement, while the $40 million to
      $50 million figure is a management target for 2026 contracted revenue, not ARR or audited
      realized revenue. Current headcount, customer count, historical funding raised, cash balance,
      and debt are not supportable from the assigned source pool.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO011
      - CO012
    tableRefs:
      - TO003

  - id: "execution-milestones-and-open-issues"
    title: "Execution Milestones and Open Issues"
    body: >-
      The operating evidence shows progress but remains predominantly company-issued. A Texas trial
      began in September 2025, and company materials later reported more than 75,000 cumulative
      miles, more than 125 runs, and 92% autonomous route coverage under human safety-driver
      supervision. For the second half of 2025, PlusAI reported Safety Case Readiness of 90.1%,
      Autonomous Miles Percentage of 99.2%, and Remote Assistance Free Trips of 79.0%. Those metrics
      use company-defined denominators and do not establish driver-out commercialization. The capital
      path also changed: a January 2026 release still described a planned Churchill Capital IX
      combination, while the September announcement names Texas Ventures III. The assigned evidence
      does not explain the Churchill transaction's disposition. The 2027 launch therefore remains a
      management target exposed to technical validation, OEM execution, regulation, financing, and
      disclosed internal-control weaknesses.
    claimRefs:
      - CO010
      - CO013
      - CO014
      - CO015
    figureRefs:
      - FO001

