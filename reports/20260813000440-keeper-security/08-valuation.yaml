company:
  name: Keeper Security
chapter:
  number: 8
  title: Valuation
  summary: 'Keeper is easier to admire than to price. Public 2026 evidence now supports a scaled, profitable, debt-free identity-security platform: management disclosed $225M ARR, more than 95,000 organizations protected, 850 new organizations added per month and rapid KeeperPAM growth. That is enough to support a credible multibillion-dollar enterprise value. It is not enough to justify price-insensitive enthusiasm. Open sources still do not disclose NRR, GRR, seat depth, gross margin, cash flow, concentration, or the cap-table and preference terms that determine actual equity value. Public identity/security comparables in August 2026 cluster around roughly 8.5x sales for Okta, 9.5x for SailPoint and about 15x for CyberArk. Applying those bands to Keeper’s disclosed ARR implies a wide but useful range that supports unicorn status while making a rumored mid-$4B valuation look full unless management can prove better retention, margins or ARR than public evidence currently shows. The evidence-sensitive
    call is therefore track / research-more with medium confidence and a fair-to-full valuation stance.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation should remain track because platform proof exceeds price proof
  body: 'Keeper’s product and customer proof is now strong enough that a subscale or distressed framing no longer fits the facts. The company publicly disclosed $225 million of ARR in July 2026, more than 95,000 organizations protected, 850 new organizations added per month, more than threefold growth since 2021, profitability and a debt-free balance sheet. Customer and market evidence from prior chapters also shows meaningful enterprise, public-sector and PAM adoption rather than a purely consumer password-manager story. Those are valuation-supportive facts. The problem is not company quality but underwriting depth. Public sources still do not disclose net revenue retention, gross retention, gross margin, free cash flow, top-customer concentration, public-sector ARR mix, or the cap-table and preference terms that determine whether a headline enterprise value is actually attractive to new money. Open-source funding databases also remain frustratingly incomplete, showing a limited funding
    history but not a clean current post-money mark. The right recommendation is therefore track / research-more, not buy: Keeper appears to be a strong private cybersecurity asset, but the public evidence does not yet support price-insensitive conviction, especially if the seller’s expectation sits materially above the low-$3B range implied by current disclosed ARR and public comps.'
