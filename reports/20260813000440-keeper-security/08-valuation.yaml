    - Verify retention, concentration and margin quality in diligence
  - - Bear
    - ARR slips toward 180-220, pricing pressure rises or a trust/compliance issue slows growth
    - 5x-8x => about 900-1,760
    - Real downside if disclosure or risk posture disappoints
    - Evidence of weaker monetization quality or renewed trust damage
  notes: Ranges are scenario heuristics built from disclosed ARR because Keeper does not publish the revenue, retention or margin detail needed for a tighter model.
