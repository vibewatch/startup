- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - ARR quality
    - Current ARR bridge by product, geography and customer segment
    - Determines whether disclosed scale is concentrated, durable and mix-shift supportive
    - Request CFO package and board-level KPI deck
  - - Retention
    - NRR, GRR, logo churn and cohort expansion by enterprise / SMB / public sector
    - Most important input for premium-multiple support
    - Request monthly recurring revenue cohort analyses
  - - Margins and cash
    - Gross margin, contribution margin, opex structure, free cash flow and cash balance
    - Determines whether profitability claim is structurally strong or lightly defined
    - Request audited or board-reviewed financial statements
  - - Concentration
    - Top-10 customers, public-sector mix and channel concentration
    - Bounds downside from delayed renewals or customer loss
    - Request ARR concentration and renewal calendar
  - - Module economics
    - KeeperPAM and Secrets attach, win rate and implementation burden
    - Decides whether platform expansion deserves a premium vs password-only peers
    - Request product attach and win/loss by segment
  - - Cap table and preferences
    - Liquidation preferences, protective provisions, secondaries and any 2023+ marks
    - Enterprise value alone does not determine common-equity attractiveness
    - Request legal cap-table pack and transaction history
  notes: Each diligence ask is selected because it would materially move recommendation, multiple or downside calibration.
