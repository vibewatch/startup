    - Scale and comp evidence are decent, economics disclosure is incomplete
    - Use ranges and diligence gates rather than point precision
  - - Risk rating
    - medium
    - Trust-sensitive category plus real competitive and disclosure risk
    - Size conservatively and tie work to monitorable triggers
  - - Valuation stance
    - fair-to-full
    - Unicorn support is plausible, but public math struggles to support a mid-$4B ask today
    - Seek price discipline or richer disclosure before upgrading
  - - Decision threshold
    - evidence-sensitive
    - Call should move mainly with retention, margin and cap-table disclosure
    - Upgrade only if durability and equity economics are proven
  - - Likely exit lens
    - IPO or strategic optionality
    - Scale, profitability and category relevance are visible, timing is not
    - Model multiple exit paths rather than one dated outcome
  notes: This is a price-sensitive recommendation rather than a generic view that Keeper is a high-quality company.
