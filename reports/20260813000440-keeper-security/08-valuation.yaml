- id: comparable-framework-and-scenario-math
  title: Comparable math supports a unicorn outcome but not automatic support for a mid-$4B price
  body: 'The cleanest public framing for Keeper is to anchor on disclosed scale and then pressure-test that scale against public identity/security software multiples. The most decision-useful reference set in this run is Okta, SailPoint and CyberArk. StockAnalysis and CompaniesMarketCap imply roughly 8.5x sales for Okta, about 9.5x for SailPoint and about 15x for CyberArk using August 2026 market caps and latest disclosed trailing revenue. These are imperfect comparables: Okta is broader identity, SailPoint is an identity-governance specialist with full public-company disclosure, and CyberArk is the premium PAM comp with stronger enterprise control depth. But the set is still useful because all three operate in trust-sensitive identity/security categories and disclose far more than Keeper does. Applying the low end of that band to Keeper’s disclosed $225M ARR produces roughly $1.9B to $2.1B of enterprise value; a 12x multiple implies about $2.7B; a CyberArk-like 15x premium implies about
    $3.4B; and even 20x only gets to roughly $4.5B. That does not mean Keeper is overvalued at any price above $3B, because ARR is not identical to revenue and private scarcity can matter. It does mean that any valuation at or above the mid-$4B level needs management to prove materially stronger ARR, retention, margin quality or strategic scarcity than the public record currently reveals.'
