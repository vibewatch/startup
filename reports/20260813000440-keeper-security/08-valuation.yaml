- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence today
  - What would change the view
  rows:
  - - 'Thesis: Keeper is now a real scaled identity-security platform'
    - Disclosed $225M ARR, 95k+ organizations, 850 orgs/month, profitability and broad product surface
    - Evidence that ARR quality or module attach is materially weaker than top-line growth implies
  - - 'Thesis: Regulated-market and PAM exposure can justify a premium to commodity password tools'
    - FedRAMP Certified government posture, GovRAMP High, KeeperPAM growth and enterprise proof
    - Loss of trust, weaker public-sector traction or weak enterprise attach economics
  - - 'Anti-thesis: Public valuation support is incomplete'
    - No public NRR, GRR, gross margin, concentration, cash flow or preference-stack disclosure
    - Management disclosure that proves durable ARR quality and clean equity economics
  - - 'Anti-thesis: Trust and pricing issues can compress multiples quickly'
    - Security incidents, status/uptime complexity and review-site pricing friction all matter in this category
    - A long clean operating record plus stronger retention and pricing-quality data
  notes: Separates company-quality arguments from price-support arguments so the recommendation remains disciplined.
