    - About $25.82B market cap; about 8.5x sales
    - Large public identity platform provides a mature-category multiple floor
    - Broader product scope, different margins and much richer disclosure than Keeper
  - - SailPoint
    - TTM revenue about $1.12B; public 10-K and market data show full disclosure discipline
    - About $10.62B market cap; about 9.5x sales
    - Useful identity-security comp with current public filing support
    - Different product focus and stronger disclosure than Keeper
  - - CyberArk
    - 2025 revenue about $1.36B; premium PAM leader with strategic scarcity
    - About $20.63B market cap; about 15x sales
    - Best premium control-oriented comp for KeeperPAM and regulated workloads
    - Larger enterprise control depth and premium strategic positioning
  - - Keeper public context
    - Disclosed ARR $225M, profitability, debt-free status and strong customer-growth narrative, but no public NRR / GRR / margin detail
    - Supports unicorn plausibility, but direct support for a mid-$4B price is incomplete
    - Closest business-model fit because it is the target asset
    - Private-company opacity makes exact multiple selection fragile
  notes: Uses the most decision-useful public identity/security references in this run instead of pretending there is a perfect Keeper public comp.
