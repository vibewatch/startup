- id: exit-readiness-and-diligence-upgrade-path
  title: 'The upgrade path is simple: prove durable ARR quality and clean equity economics'
  body: 'Keeper’s next-step diligence asks are straightforward because the main blocker is not category ambiguity but private company opacity. Public evidence now supports real exit optionality: Keeper looks large enough, profitable enough and strategically relevant enough to reach either IPO preparation or credible strategic interest from identity, PAM or broader security incumbents. But no serious investment committee should convert that observation into a buy call without first seeing the numbers that determine durability and common-equity outcomes. Management needs to provide a current ARR bridge by product and segment, NRR, GRR, logo churn, gross margin, operating margin, cash generation, top-customer concentration, public-sector mix, module attach for PAM and secrets, and the actual preference stack or secondary marks tied to prior rounds. The risk chapter also has to stay wired directly into valuation. Another material trust incident, a pronounced slowdown in new-logo additions, or
    evidence that pricing friction is growing faster than product expansion would re-rate the company quickly toward the low end of the comp range. Until those questions are answered, the disciplined stance is fair-to-full, medium-confidence and track rather than buy. In other words, the diligence bottleneck is solvable, but it is still real enough to dominate price discipline today.'
