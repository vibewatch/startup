  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohort-quality
    missingEvidence: NRR, GRR, logo churn, cohort expansion and seat-depth metrics by segment.
    whyItMatters: Premium multiple support depends more on durability than on headline ARR alone.
    diligencePath: Request monthly or quarterly cohort packs reviewed by finance and the board.
    relatedQuestionRefs:
    - QV008
    - QV029
  - type: private-evidence-only
    severity: material
    topic: margin-and-cash-structure
    missingEvidence: Gross margin, contribution margin, opex mix, free cash flow and cash balance trends.
    whyItMatters: Profitability can mean very different things in private software without standardized cash and margin detail.
    diligencePath: Request audited statements or board-ready management accounts for the last eight quarters.
    relatedQuestionRefs:
    - QV006
    - QV029
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preference-overhang
    missingEvidence: Liquidation preferences, secondaries, protective provisions, option overhang and any 2023+ internal or external marks.
    whyItMatters: Enterprise value does not map cleanly to common-equity attractiveness without the actual equity stack.
    diligencePath: Request legal cap-table package, stock-ledger summary and any fairness or valuation memos.
    relatedQuestionRefs:
    - QV007
    - QV029
  - type: private-evidence-only
    severity: material
    topic: segment-mix-and-concentration
    missingEvidence: Top-customer concentration, public-sector ARR mix, channel mix and renewal calendar concentration.
    whyItMatters: These factors materially affect downside volatility and the discount rate applied to the comp range.
    diligencePath: Request ARR concentration by customer, segment and geography plus the next 12 months of renewal exposure.
    relatedQuestionRefs:
    - QV028
    - QV029
  - type: private-evidence-only
    severity: important
    topic: module-attach-and-unit-economics
    missingEvidence: KeeperPAM and Secrets attach rates, win/loss rates, implementation burden and support-cost profile.
    whyItMatters: Platform-expansion upside is the main lever that could justify a premium multiple above mature identity comps.
    diligencePath: Request product-level ARR bridges, attach cohorts and implementation margin snapshots.
    relatedQuestionRefs:
    - QV024
    - QV029
