- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Security or trust shock
    - One material incident affecting core vault, PAM or regulated-control credibility
    - Premium trust narrative weakens and multiple compresses quickly
    - Move to downside case and reprice
  - - Growth durability miss
    - New-logo pace and module attach deteriorate materially from current trajectory
    - High-growth narrative weakens and comp set shifts lower
    - Reassess scenario range and reduce acceptable entry price
  - - Pricing / retention deterioration
    - Broadening complaints plus weak renewals or smaller expansions
    - Premium pricing power looks less durable
    - Demand cohort metrics before proceeding
  - - Disclosure disappointment
    - Management cannot evidence healthy NRR, GRR, margins or clean cap table
    - Public valuation opacity remains unresolved
    - Maintain track / no-buy stance
  - - Public-sector or compliance slippage
    - FedRAMP/GovRAMP scope or renewal posture weakens
    - Government premium and control-story credibility deteriorate
    - Lower multiple assumptions and extension value
  notes: Thresholds are diligence heuristics grounded in public evidence, not company-guided KPI guardrails.
