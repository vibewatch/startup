  topStrengths:
    - 2026 年公开披露已经证明 Keeper 有真实规模：$225M 年经常性收入（ARR）、盈利、无债务，新 Logo 增长也强。
    - 产品边界不止密码管理，已经延伸到 PAM、Secrets、远程访问和受监管政府工作负载。
    - FedRAMP Certified 与 GovRAMP High 资质帮助 Keeper 区别于更简单的密码工具。
    - 客户与评价证据支持其企业级相关性，不只是消费安全故事。
  topRisks:
    - 公开证据仍缺 NRR、GRR、毛利率、现金生成、客户集中度和股权结构条款。
    - 身份与特权访问都是信任敏感位置，一次重大安全或合规事故就可能迅速压缩估值。
    - 高端定价和附加模块复杂度，在独立评价渠道里仍是可见摩擦。
    - 通行密钥、云端 Secret 存储和大型身份平台的捆绑替代方案，会封住低端估值倍数扩张空间。
  unresolvedGaps:
    - 当前 ARR 桥、产品组合以及各细分市场的模块附加率仍未披露。
    - 留存质量、Logo 流失和队列扩张不公开。
    - 优先股堆叠、老股交易价格以及清晰的当前投后估值仍不明确。
    - 毛利率、自由现金流、客户集中度和公共部门 ARR 占比，仍没有达到可决策质量的披露。
