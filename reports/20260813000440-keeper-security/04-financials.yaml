    - Negotiated enterprise economics
    - No public discount bands or support-bundle pricing
    - Official Keeper enterprise and pricing pages
    - Large-account unit economics cannot be inferred from list pages alone
  notes: Official public pricing is structural, not sufficient for realized revenue analysis. Private-company diligence must bridge from list architecture to actual contract economics.
