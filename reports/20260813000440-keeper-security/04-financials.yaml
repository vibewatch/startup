- id: gtm-motion-traction-and-unit-economics-proxies
  title: GTM motion, public traction, and unit-economics proxies
  body: 'Keeper’s July 2026 disclosure materially changes the traction baseline for this report. The company now claims US$225M in ARR, more than 3x ARR growth since 2021, more than 95,000 organizations protected, average new-logo additions of 850 organizations per month, and 10x year-over-year revenue growth for KeeperPAM since its February 2025 launch. A separate 2026 PR release tied to SoftwareReviews says Keeper’s 2025 global revenue growth rate was 53.42%, or 3.45x the overall market average cited in that release. Those are company-originated figures and should not be mistaken for audited filings, but they are directionally important because they imply Keeper is no longer a subscale password-vault vendor. The go-to-market motion also appears blended rather than purely enterprise-sales driven. Business and enterprise pages emphasize deploy-in-minutes onboarding, user adoption, 24x7 support and out-of-the-box identity integrations, which suggests product-led or product-assisted entry
    for smaller accounts. At the same time, custom pricing for KeeperPAM, compliance-heavy public-sector positioning and broader module attach imply a classic sales-assisted motion for larger enterprise and government deals. The unit-economics picture remains incomplete. Third-party databases disagree sharply on headcount and estimated revenue, which reinforces how noisy private-company data feeds can be. Publicly, that means the strongest underwriting inputs are the company’s own recent ARR/growth claims and product pricing architecture, while the weakest are precisely the metrics investors care about most: churn, net retention, CAC, payback, segment mix and realized expansion rates.'
