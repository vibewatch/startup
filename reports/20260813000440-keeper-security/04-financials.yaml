- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - ARR decomposition by product and segment
    - Without it, the sustainability of the 2026 ARR milestone cannot be separated into core vaulting, PAM, secrets, MSP and public-sector contributions
    - Request ARR by segment, product family, geography and customer-size cohort for 2024-2026
  - - GAAP gross margin and hosting/support cost structure
    - Prevents direct judgment on software margin quality and scalability
    - Request audited gross margin overall and by core vaulting, secrets and PAM
  - - CAC, payback and channel economics
    - Blocks any credible view of growth efficiency and partner leverage
    - Request CAC/payback by acquisition channel and contract band, including reseller economics
  - - NRR, churn and expansion by cohort
    - Makes cross-sell durability and downside risk unknowable
    - Request retention cohorts for SMB, enterprise, public sector and MSP accounts
  - - Cash balance, burn and runway
    - Leaves solvency and financing dependency unproven despite positive directionality
    - Request monthly burn, unrestricted cash, debt facilities and minimum liquidity targets
  - - Public-sector revenue share
    - Keeps compliance-led moat financially unquantified
    - Request ARR, bookings and retention for government and regulated verticals
  notes: These are ordinary private-company disclosures, but they remain decisive for investor-grade underwriting.
