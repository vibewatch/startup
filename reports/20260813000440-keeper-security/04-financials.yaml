  - - CAC payback
    - 'null'
    - low
    - Critical for underwriting sales-led module expansion
    - Provide payback by SMB, enterprise, public sector and partner-channel cohorts
  - - Net revenue retention
    - 'null'
    - low
    - Required to value seat expansion and module attach within installed accounts
    - Provide NRR and gross retention by cohort and product family
  - - Churn
    - 'null'
    - low
    - Low-end password categories can hide weak paid durability
    - Provide logo churn and gross-dollar churn by segment
  - - Headcount
    - 'Third-party estimates conflict: 506 employees (Growjo) versus 795 (Tracxn)'
    - low
    - Conflicting headcount undermines outside cost and productivity modeling
    - Provide current FTEs by function and geography
  - - Working capital burden
    - Likely light, but undisclosed
    - medium
    - Software model should be less working-capital intensive than hardware or transaction businesses
    - Provide deferred revenue, billing cadence, DSO/DPO and collections metrics
  notes: The nulls are the real blockers. Public growth signals are useful, but they do not replace retention, margin or cash-efficiency disclosure.
