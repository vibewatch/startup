company:
  name: Keeper Security
chapter:
  number: 1
  title: Company Overview
  summary: Keeper Security is a private Chicago identity-security company whose public materials now frame the business as a unified zero-trust control plane for privileged access, secrets, endpoints, remote connections and government workloads rather than only a consumer password manager. Public evidence supports a 2009 product origin, a 2011 corporate founding by Darren Guccione and Craig Lurey, a first disclosed $60M Insight investment in 2020, a later undisclosed minority growth investment from Summit Partners, and a current public-sector positioning anchored by FedRAMP High and GovRAMP High authorizations, while the main overview risks are undisclosed transaction terms, incomplete headcount transparency and a visible but contained vulnerability record.
sections:
- id: identity-product-and-scale
  title: Identity, product scope, and current public scale
  body: 'Keeper Security currently presents itself as an identity-security platform, not merely a vault app. The homepage describes Keeper as a unified control plane for privileged access, secrets, remote connections, endpoints and databases, while the core product pages show that this umbrella now spans KeeperPAM, Keeper Secrets Manager, secure remote access, government cloud and passkey capabilities. Across these surfaces, the company repeatedly anchors differentiation on zero-trust and zero-knowledge architecture with end-to-end encryption, arguing that only the customer can decrypt stored data. Public scale claims are meaningful but not perfectly synchronized: the homepage says Keeper serves more than 93,000 business customers, protects 4 million people and operates in more than 150 countries, while the December 2025 FedRAMP High announcement says Keeper protects more than 85,000 organizations. The discrepancy looks more like page-refresh cadence than a contradiction severe enough to
    discredit the platform narrative, but it is still important because later chapters should not assume one exact count without citing the page date. Product breadth also clearly extends beyond human-password storage. KeeperPAM unifies password, secrets, connection management, zero-trust network access and remote browser isolation, while Keeper Secrets Manager focuses on API keys, CI/CD credentials, containers and other non-human identities. The company’s public materials therefore support a view of Keeper as a broadened identity-security vendor with password management as the entry wedge and privileged access plus machine-secret control as the expansion path.'
