- id: capital-milestones-and-adverse-record
  title: Capital formation, chronology, and public adverse record
  body: 'Keeper’s publicly visible financing chronology begins with the August 2020 Insight Partners transaction, which Crunchbase News described as the company’s first equity raise and which Insight framed as a $60M growth round supporting a successful shift toward B2B enterprise password management. The later Summit Partners transaction is strategically important but financially incomplete in public record: Summit says it completed a significant minority investment and joined the board, while explicitly noting that no other terms of the private transaction were disclosed. Even without the missing check size or valuation, the company’s own and partner materials show a meaningful milestone chain after 2020: Glyptodon was acquired in late 2021 and reworked into Keeper Connection Manager in 2022, FedRAMP Moderate was achieved in August 2022, Tokyo opened as APAC headquarters in 2023, Keeper’s retrospective flagged both Summit’s investment and the KeeperPAM platform launch as defining moments
    of that year, mobile passkey support shipped in March 2024, FedRAMP High arrived in December 2025 and GovRAMP High followed in February 2026. The public adverse record is more about attack-surface scrutiny than a famous catastrophic breach. Keeper’s own documentation publishes vulnerability advisories for Keeper Connection Manager, including one high-severity SAML-response issue, OpenCVE tracks additional Keeper-related CVEs such as disputed plaintext-memory exposure and a KeeperChat biometric issue, and Built In’s AI-generated employer profile surfaces founder-led pressure and burnout commentary as a low-confidence culture signal. Those issues do not on their own negate Keeper’s platform quality, but they do show that diligence should price technical scrutiny and key-person dependence rather than assume a spotless record.'
