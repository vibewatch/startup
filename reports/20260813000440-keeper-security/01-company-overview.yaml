- id: leadership-governance-and-footprint
  title: Leadership, governance, legal identity, and operating footprint
  body: 'Public leadership pages show unusually strong founder continuity. Darren Guccione remains CEO and co-founder, Craig Lurey remains CTO and co-founder, and the executive bench names Amy Lindenmeyer as CFO, Tim Strickland as CRO, Tracy Dale-Baker as CHRO, Shane Barney as CISO and David Oskin as General Counsel. Governance also reflects external growth-equity influence: Keeper’s board page lists both Insight Partners managing director Thomas Krane and Summit Partners managing director Len Ferrington alongside Guccione and independent members, indicating that both major capital partners now have visible board representation. The about page and terms also make Keeper’s operating footprint concrete. The company lists Chicago as global headquarters, El Dorado Hills as product development, Cork as EMEA business sales and Tokyo as APAC business sales, while the terms page identifies the legal entity as Keeper Security, Inc. at 311 W. Monroe Street, Suite 406, Chicago, Illinois. One chronology
    nuance matters for later chapters: public sources distinguish between a 2009 product origin and a 2011 formal co-founding of Keeper Security, Inc. That distinction reconciles the seemingly conflicting dates visible across Chicago Innovation, Crunchbase News, Wikipedia and Summit’s company materials. What remains opaque is current headcount and cap-table control. Reviewed sources show that Keeper added 120 employees around the 2020 Insight round and several hundred more employees by the time of the Summit announcement, but none of the accessible official pages provides a precise current employee count or a detailed cap table.'
