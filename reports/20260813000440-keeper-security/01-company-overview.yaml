  evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A precise current employee count by geography or function from an official company source or reliable third-party filing/profile.
    whyItMatters: Headcount is a key maturity and burn proxy for a private software company and affects cost structure analysis later in the report.
    diligencePath: Request a current org chart or headcount snapshot from management, or access a reliable paid profile such as PitchBook or LinkedIn Talent Insights.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current valuation, Summit check size, ownership percentages, liquidation preferences and other transaction terms.
    whyItMatters: Without transaction terms, later valuation work can only bracket attractiveness rather than underwrite actual return outcomes.
    diligencePath: Request the 2023/2024 financing deck, cap table, board materials and most recent 409A or tender marks from management.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: milestone-precision
    missingEvidence: A canonical company-authored timeline with exact dates for early founding, app launch and Summit investment close.
    whyItMatters: Current chronology is supportable but still requires period-normalization because some public sources provide only month or year granularity.
    diligencePath: Request an internal corporate timeline or archived press kit from Keeper communications.
    relatedQuestionRefs:
    - QO002
    - QO008
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: governance-rights
    missingEvidence: Board committee assignments, observer rights and exact governance rights for Insight and Summit.
    whyItMatters: Private governance structure affects control, exit timing and investor alignment even when the top-line story is strong.
    diligencePath: Review charter documents, stockholder agreements and current board committee rosters under NDA.
    relatedQuestionRefs:
    - QO005
    - QO025
    relatedTableRefs:
    - TO003
    - TO002
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: A single dated source of truth reconciling 85,000+ organizations with 93,000+ business customers.
    whyItMatters: Overview metrics should not drift across later chapters without an explicit freshness explanation.
    diligencePath: Ask Keeper communications for the latest dated customer-count boilerplate used across official pages.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO001
