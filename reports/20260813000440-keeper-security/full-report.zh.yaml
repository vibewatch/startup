  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与变现架构
        blocks:
          - type: paragraph
            body: >-
              Keeper 的收入机制比经审计结果清晰得多。官方定价和产品页面显示，这是一门按席位订阅的业务，变现层次多于单一消费者应用。入口端，Keeper 向小团队销售 Business Starter；随后扩展到
              Business 和 Enterprise 层级，提供更宽的管理、身份提供商集成、SCIM、RBAC 和开发者 API。公司还销售或打包更高价值的相邻模块：Secrets Manager
              是商业计划的附加项，并包含在 KeeperPAM 中；KeeperPAM 本身采用定制报价；MSP 套餐暴露出面向渠道的收入面；每个企业用户免费获得 Keeper Family
              Plan，则是采用和留存增强器，即使它本身未必直接贡献增量 ARR。重要的财务解读是，Keeper
              按账户层级、治理深度和相邻模块附加来变现访问控制，而不是按交易量或重服务实施来收费。这通常会改善收入质量，因为席位订阅、企业治理功能和模块扩张通常具备经常性和粘性。但公开的变现清晰度仍不等于公开的变现深度。这些页面说明了
              Keeper 可以为什么收费；它们没有披露 ARR 有多少来自 SMB 密码管理、企业合同、公共部门、MSP、机密管理或 PAM，也没有披露折扣后的实际 ASP。因此，商业模式可以理解，但收入组合仍是私有信息。
