      - number: '2.2'
        title: 规模测算视角、地域与分段经济性
        blocks:
          - type: paragraph
            body: >-
              2026 年已发布市场规模测算方向上偏乐观，但数字彼此不一致，这正是 Keeper 市场应以区间呈现的原因。Mordor Intelligence 和 Research and Markets 都预计密码管理市场
              2026 年为 US$2.94B，并以 22.39% CAGR 增至 2031 年 US$8.07B；Fortune Business Insights 则把同一品类定为 2026 年 US$3.79B、2034
              年 US$10.63B，CAGR 为 13.77%。差距并不小：采用高位还是低位 2026 年数字，会让任何隐含份额或收入讨论相差近
              US$850M。比单点总量更有用的是分段和区域方向。北美仍是最大区域，占支出约三分之一到接近五分之二；亚太增长最快。云部署今天占主导，但在数据驻留和受监管工作负载压力下，混合模式增长很快。大型组织仍是收入锚点，SME
              则是增长最快的队列，因为订阅定价和低复杂度 SaaS 部署降低了准入门槛。BFSI 的垂直集中度和医疗健康的上升增长，与 Keeper 偏合规的定位相匹配。因此，Keeper 最站得住脚的 SAM
              不是“所有密码管理”，而是付费、多用户、合规敏感的那一片：买家足够看重最小权限、可审计性、身份提供商集成、通行密钥和机器机密控制，愿意为专业平台列预算。
