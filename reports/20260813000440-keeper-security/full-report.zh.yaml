  - id: TV005
    title: 投资逻辑破裂与放弃触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 安全或信任冲击
        - 一起影响核心保险库、PAM 或受监管控制可信度的重大事件
        - 高端信任叙事走弱，倍数迅速压缩
        - 转入下行情景并重新定价
      - - 增长耐久性不达标
        - 新客户增速和模块挂载较当前轨迹明显恶化
        - 高增长叙事走弱，可比对象集合下移
        - 重估情景区间，降低可接受入场价格
      - - 定价 / 留存恶化
        - 投诉扩大，续约偏弱或扩张缩小
        - 溢价定价权看起来不那么耐久
        - 推进前要求提供队列指标
      - - 披露不及预期
        - 管理层无法证明健康的 NRR、GRR、利润率或干净股权结构
        - 公开估值不透明仍未解决
        - 维持观察 / 不买立场
      - - 公共部门或合规滑坡
        - FedRAMP / GovRAMP 范围或续期姿态走弱
        - 政府业务溢价和控制叙事可信度恶化
        - 下调倍数假设和延展价值
    notes: 阈值是扎根公开证据的尽调启发式，不是公司给出的 KPI 护栏。
