  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Keeper 的公开架构如今把零知识密码库、特权访问控制平面、机密管理工具和可选自托管网关模式，叠在共享管理与合规控制之上。
    data:
      layers:
        - id: l1
          label: 用户和应用界面
          detail: 浏览器扩展、网页版密码库、桌面应用、移动客户端，以及原生管理 / 开发者入口；密码、通行密钥和会话都从这些入口发起。
        - id: l2
          label: 身份和策略层
          detail: SSO、MFA、设备批准、RBAC、管理控制台控制和审计钩子，决定谁可以访问哪些密码库、机密和会话。
        - id: l3
          label: 密码库、通行密钥和监控服务
          detail: 核心密码库、通行密钥存储 / 自动填充、BreachWatch 扫描和安全共享功能，服务员工和个人用户。
        - id: l4
          label: 特权访问和机密模块
          detail: KeeperPAM 会话、发现、轮换和 JIT 工作流，加上 Secrets Manager、SDK、CLI 和 REST 自动化界面，服务机器身份。
        - id: l5
          label: 部署和基础设施底座
          detail: Keeper Gateway 出站连接器、可选自托管 KCM、AWS 区域托管、AWS GovCloud、备份 / HSM 控制，以及上游 IdP / 浏览器依赖。
