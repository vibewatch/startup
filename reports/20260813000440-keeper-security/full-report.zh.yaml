      - number: '8.2'
        title: 可比公司测算支持独角兽结果，但不能自动支撑中段 $4B 估值
        blocks:
          - type: paragraph
            body: >-
              对 Keeper 最干净的公开框架，是锚定已披露规模，再用上市身份 / 安全软件倍数做压力测试。本次最有决策价值的参照组是 Okta、SailPoint 和 CyberArk。按 2026 年 8
              月市值和最新披露的过去十二个月收入，StockAnalysis 与 CompaniesMarketCap 隐含 Okta 销售额倍数约 8.5x，SailPoint 约 9.5x，CyberArk 约
              15x。这些可比公司并不完美：Okta 是更宽的身份平台，SailPoint 是身份治理专家且有完整上市公司披露，CyberArk 则是溢价 PAM
              可比公司，企业控制深度更强。但这个参照组仍有用，因为三家公司都处在对信任敏感的身份 / 安全品类，披露也远多于 Keeper。把这一区间低端套到 Keeper 披露的 $225M ARR 上，企业价值约为
              $1.9B 至 $2.1B；12x 倍数约为 $2.7B；CyberArk 式 15x 溢价约为 $3.4B；即便 20x 也只有约 $4.5B。这并不意味着 Keeper 在 $3B 以上任何价格都高估，因为
              ARR 不等同于收入，私有资产稀缺性也可能有价值。但它意味着，任何达到或超过中段 $4B 的估值，都需要管理层证明 ARR、留存、利润质量或战略稀缺性显著强于当前公开记录。
