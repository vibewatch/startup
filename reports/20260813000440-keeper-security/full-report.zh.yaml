  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与信任风险
        blocks:
          - type: paragraph
            body: >-
              最核心的法律和监管风险，是偏合规 GTM 下的信任失效。Keeper 面向 FedRAMP High、GovRAMP High、FIPS、SOC 2、ISO 和 NIST
              对齐的采购场景销售，并明确把自己定位为特权身份、机密和 AI agent
              的控制平面。这会放大任何认证失效、披露错误或安全事件的后果。公司公开材料正确地把许多控制项描述为差异化优势，但同一定位也意味着它们可能成为下行放大器。远程访问组件的漏洞、设备批准失败，或有争议的数据处理问题，都可能迅速转化为采购摩擦、续约延迟或法律审查，因为买家购买的不是低风险消费者工具，而是信任和合规系统。公开证据已经显示
              Keeper 并非无风险。Connection Manager 公告页面列出历史 CVE，包括一个高严重级别 SAML 验证问题；OpenCVE 还追踪其他 Keeper
              相关客户端或相邻产品问题。这些都不能证明当前平台薄弱，但确实证明大攻击面的正常现实。缓释因素也很实质：零知识设计、季度测试、Bugcrowd 披露、区域隔离和明确的加密控制。法律 / 监管结论不是 Keeper
              异常脆弱，而是公司选择了受监管、重控制客户分段；在那里，任何信任失误都会付出不成比例的代价。
