      - number: '4.2'
        title: GTM 动作、公开牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Keeper 2026 年 7 月披露显著改变了本报告的牵引力基线。公司现在称 ARR 为 US$225M，自 2021 年以来 ARR 增长超过 3x，保护超过 95,000 家组织，平均每月新增 850
              家组织，并且 KeeperPAM 自 2025 年 2 月发布以来收入同比增长 10x。另一份与 SoftwareReviews 相关的 2026 年 PR 称，Keeper 2025 年全球收入增长率为
              53.42%，是该稿引用的整体市场平均值的 3.45x。这些是公司来源数字，不应误认为经审计文件，但方向上重要，因为它们意味着 Keeper 已不再是小规模密码保险库厂商。GTM
              动作看起来也不是纯企业销售驱动，而是混合型。商业和企业页面强调数分钟部署的入职、用户采用、24x7 支持和开箱即用的身份集成，说明小账户可能通过产品驱动或产品辅助进入。与此同时，KeeperPAM
              的定制报价、偏合规的公共部门定位和更宽模块附加，又意味着较大企业和政府交易仍需要经典销售辅助动作。单位经济画像仍不完整。第三方数据库在员工数和估计收入上分歧很大，进一步说明私营公司数据源噪音很高。公开层面，最强的承销输入是公司最新
              ARR / 增长主张和产品定价架构；最弱的恰恰是投资者最关心的指标：流失、净留存、CAC、回本周期、分段组合和实际扩张率。
