  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议仍应保持观察，因为平台证明强于价格证明
        blocks:
          - type: paragraph
            body: >-
              Keeper 的产品和客户证明已经足够强，不能再把它描述成小规模或困境资产。公司公开披露，2026 年 7 月年经常性收入（ARR）为 $225 million，保护超过 95,000 家组织，每月新增 850
              家组织，2021 年以来增长超过三倍，同时盈利且资产负债表无债。前文的客户和市场证据也显示，Keeper 已经有实质性的企业、公共部门和 PAM
              采用，而不是一个纯消费者密码管理器故事。这些事实支撑估值。问题不在公司质量，而在承销深度。公开来源仍未披露净收入留存、总留存、毛利率、自由现金流、头部客户集中度、公共部门 ARR
              占比，也未披露决定名义企业价值对新资金是否有吸引力的股权结构表和优先权条款。开源融资数据库同样令人失望：只显示有限融资历史，却没有干净的当前投后估值标记。因此，正确建议是观察 /
              继续研究，而不是买入：Keeper 看起来是一个强劲的私有网络安全资产，但公开证据尚不足以支撑不计价格的信心；如果卖方预期显著高于当前披露 ARR 和上市可比公司隐含的低 $3B 区间，这一点尤其成立。
