companyProfile:
  summary: >-
    Keeper Security 是一家总部位于 Chicago 的私营网络安全公司，由 Darren Guccione 和 Craig Lurey 于 2011 年共同创立。公司起步于密码管理器，如今扩展成更宽的身份安全平台，覆盖
    KeeperPAM、机密管理、连接管理、远程浏览器隔离和公共部门产品。公开证据证实它在受监管市场已有实质进展，包括 FedRAMP Certified 与 GovRAMP High 资质；2026 年 7
    月披露进一步拉高了财务画像：$225M ARR、盈利、无债务，并管理层开始讲述具备 IPO 选择权的叙事。公开资料仍缺少精确估值和股权条款，因此应把 Keeper 视作一家已具规模的后期私营资产：平台能力真实，但价格透明度仍不完整。
