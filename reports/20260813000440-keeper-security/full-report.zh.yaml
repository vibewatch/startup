  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 供应商
      - 价格 / 计费单位 / 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 含义
    rows:
      - - Keeper
        - 按用户年度打包，高端模块走自定义报价路径
        - 定价页面呈现商业、企业、家庭福利、机密、PAM 和 MSP 邻接能力
        - 抓取文本无法干净还原精确标价；KeeperPAM 适用自定义报价
        - 交叉销售广度有吸引力，但实际定价权不透明
      - - 1Password
        - 定价页面抓取成功，但提取文本中没有清楚暴露面向企业的公开数字价格
        - 企业定位、强支持和更宽的访问平台范围
        - 当前抓取提取中，企业价格不透明
        - 传递高端定位信号，但也让直接标价对比更难
      - - Bitwarden
        - 年度订阅模式，包含 Teams 和 Enterprise 套餐
        - 保险库、共享、企业支持、健康报告、可选机密扩展
        - 当前提取的定价文本中没有精确数字
        - 即便公开数字标价提取不完整，价值叙事仍然强
      - - Dashlane
        - 按用户 / 月计费、按年支付，另有自定义企业打包
        - 密码管理、凭据保护、SSO/SCIM 和账号管理
        - 公开定价页面更强调打包结构，而不是干净的数字对比
        - 指向销售主导的企业路径，而不是纯自助对比
      - - LastPass
        - 付费套餐叠加在有限免费层之上
        - 零知识保险库和更广的密码管理器功能
        - 本次运行日期抓取企业定价页面返回 404
        - 当前公开打包清晰度似乎弱于同行
      - - CyberArk / Delinea
        - 企业销售路径
        - 更广的 PAM、动态授权、会话、机密和 AI 驱动审计
        - 公开页面强调能力，而不是透明标价
        - 这些供应商以更广套件竞争，不是低摩擦自助工具
      - - HashiCorp Vault
        - 产品主导文档，加企业部署路径
        - 机密引擎、动态凭据、加密和 API/CLI 工作流
        - 抓取到的文档表面未把公开定价放在核心位置
        - 工程主导的机密买方可能先比较架构，再比较价格
      - - 原生 / 捆绑替代品
        - 零新增成本或预先捆绑
        - 现有生态中的密码 / 通行密钥存储或云机密
        - 成本隐藏在平台或云关系中，而不是单独 SKU
        - 对低端和单云场景形成强替代压力
    notes: 当前抓取页面没有暴露干净公开数字定价时，表格会明确保留未知项，而不是导入未说明的标价。
