  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 示意估值逻辑（USD M）
      - 概率信号
      - 支撑条件
    rows:
      - - 乐观
        - ARR 升至约 275-325，盈利能力守住，PAM / Secrets 模块挂载增强，且没有信任冲击
        - 13x-15x => 约 3,575-4,875
        - 可能成立，但尚未证明
        - 证明 NRR 耐久、高挂载经济性和干净治理 / 股权结构条款
      - - 基准
        - ARR 维持在约 225-260，增速放缓但仍健康，利润率扎实，风险姿态保持稳定
        - 9x-12x => 约 2,025-3,120
        - 证据支撑最强的区间
        - 在尽调中验证留存、集中度和利润率质量
      - - 悲观
        - ARR 下滑至 180-220 附近，定价压力上升，或信任 / 合规问题拖慢增长
        - 5x-8x => 约 900-1,760
        - 若披露或风险姿态不及预期，下行空间真实存在
        - 变现质量较弱或信任再度受损的证据
    notes: 区间是基于已披露 ARR 搭出的情景启发式；Keeper 未披露收入、留存或利润率细节，模型无法更紧。
