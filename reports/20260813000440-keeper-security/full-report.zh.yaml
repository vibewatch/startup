  - id: TE001
    title: 产品模块 / 资产矩阵
    type: enumeration
    columns:
      - 模块
      - 主要用户 / 工作负载
      - 交付模型
      - 功能
      - 当前尽调判断
    rows:
      - - Business / Enterprise 保险库
        - 员工用户和 IT 管理员
        - SaaS 保险库，加浏览器、桌面和移动客户端
        - 密码、通行密钥、文件、共享、管理员策略、SSO/SCIM/RBAC
        - 成熟核心平台，也是相邻模块的底座
      - - KeeperPAM
        - 安全、IT、DevOps 和基础设施团队
        - 采用网关模式的云原生访问控制平面
        - JIT 访问、会话代理、发现、轮换、会话监控和特权工作流
        - 扩张引擎，也是产品范围跳出保险库最清晰的一步
      - - Keeper Connection Manager
        - 对主权敏感、自托管或气隙部署
        - 基于 Docker 的自托管远程访问网关
        - 基于浏览器的 RDP、SSH、VNC、K8s、数据库和内部 Web 访问，并支持录制
        - 差异化部署选项，但运营更重
      - - Keeper Secrets Manager
        - DevOps、软件工程和机器身份工作流
        - 带 SDK、CLI 和集成的全托管云服务
        - 基础设施密钥、API 密钥、证书、服务账户轮换和 CI/CD 注入
        - 与核心保险库相邻的强机器身份场景
      - - BreachWatch
