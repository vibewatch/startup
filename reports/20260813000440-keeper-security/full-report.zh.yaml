      - number: '3.3'
        title: 切换成本、分发力量与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Keeper 有真实但有条件的护城河。买家一旦配置文件夹、角色、SCIM
              预配、SSO、会话控制和入职工作流，切换成本就有分量；但这些成本不是绝对的，因为竞争对手会主动宣传迁移、导入和快速上线。这让功能平价压力始终很高。分发力量越来越来自生态广度和买家信任，而不只是密码存储：1Password
              伸向 SaaS 治理和 AI 发现，CyberArk 和 Delinea 伸向全身份特权控制，云原生机密存储则能靠已经在 AWS 或 Azure 内部“天然存在”取胜。已抓取页面中，Keeper
              最强的护城河信号是偏合规姿态、公共部门就绪度、密码加机密加 PAM 的统一叙事，以及把运营简单性与安全一起销售的能力。最大替代风险是 Apple、Google
              和平台厂商把基础保险库与通行密钥商品化，以及更宽身份安全玩家在高端推动套件竞争。因此，最重要的开放问题不是 Keeper
              是否功能完整——大体上是完整的——而是它能否足够稳定、足够快地赢下中间那片重控制整合市场，以抵消下方的捆绑原生替代品和上方的更宽套件整合。缺少当前赢单 /
              输单数据、实际定价和产品附加率之前，护城河耐久性应视为有前景，但尚未完全承销。
