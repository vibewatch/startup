      - number: '7.4'
        title: 附录
        blocks:
          - type: callout
            title: Keeper 的缓释因素是真实的，不只是愿景
            body: 已发布的密码学细节、活跃的发布节奏、客户证明、受监管市场姿态和外部评论强度，都指向同一个结论：Keeper 在管理一个复杂平台时，比简单的营销外壳更严谨。
