      - number: '8.3'
        title: 升级路径很简单：证明 ARR 质量持久，股权经济干净
        blocks:
          - type: paragraph
            body: >-
              Keeper 下一步尽调问题并不复杂，因为主要障碍不是品类不清，而是私有公司不透明。公开证据现在已经支撑真实的退出可选性：Keeper 看起来规模足够大、盈利能力足够强、战略相关性也足够高，可以进入 IPO
              准备，或吸引身份、PAM 或更广义安全在位者的可信战略兴趣。但任何严肃投委会都不应在看到决定持久性和普通股结果的数字之前，就把这一观察转成买入结论。管理层需要提供当前按产品和分部拆分的 ARR
              桥、NRR、GRR、客户账户流失、毛利率、营业利润率、现金生成、头部客户集中度、公共部门占比、PAM
              与机密凭证模块附加销售，以及与过往轮次绑定的实际优先股堆叠或老股交易标记。风险章节也必须继续直接连到估值。另一次重大信任事件、新客户新增明显放缓，或定价摩擦增长快于产品扩张的证据，都会迅速把公司重估到可比区间低端。在这些问题回答之前，纪律性立场应是估值合理至偏满、置信度中等、保持观察而非买入。换句话说，尽调瓶颈可以解决，但今天仍足够真实，足以主导价格纪律。
