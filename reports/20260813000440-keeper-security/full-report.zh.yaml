  - id: TV004
    title: 可比估值表
    type: enumeration
    columns:
      - 可比对象
      - 当前指标集
      - 估值 / 倍数 / 状态
      - 参考意义
      - 限制
    rows:
      - - Okta
        - TTM 收入约 $3.00B；公开证券文件体系和市场数据支撑当前披露深度
        - 市值约 $25.82B；销售额约 8.5x
        - 大型上市身份平台提供成熟品类的倍数底部
        - 产品范围更宽，利润率不同，披露远比 Keeper 充分
      - - SailPoint
        - TTM 收入约 $1.12B；公开 10-K 和市场数据体现完整披露纪律
        - 市值约 $10.62B；销售额约 9.5x
        - 有现行公开文件支撑，是有用的身份安全可比对象
        - 产品重心不同，披露强于 Keeper
      - - CyberArk
        - 2025 收入约 $1.36B；具战略稀缺性的高端 PAM 龙头
        - 市值约 $20.63B；销售额约 15x
        - KeeperPAM 和受监管工作负载最好的高端控制型可比对象
        - 企业控制深度更大，战略定位更高端
      - - Keeper 公开语境
        - 披露 ARR $225M、已盈利、无债务状态和强客户增长叙事，但没有公开 NRR / GRR / 利润率细节
        - 能支撑独角兽可能性，但对 $4B 中段价格的直接支撑不完整
        - 目标资产本身，业务模型最贴近
        - 私营公司不透明，精确选择倍数很脆弱
    notes: 本轮使用决策最有用的公开身份 / 安全参考，而不是假装存在完美的 Keeper 上市可比对象。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the four comparison references actually used in this chapter: two public identity platforms, one premium
        PAM leader and Keeper itself.
