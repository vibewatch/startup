      - number: '3.2'
        title: 同行画像、能力取舍与定价姿态
        blocks:
          - type: paragraph
            body: >-
              在直接同行中，1Password 是已披露业务规模里最强的高端标杆：其企业页面称超过 200,000 家企业信任该平台，公司如今围绕密码、机密、设备、SSO 之外的应用、AI
              发现和更宽的访问治理定位，而不只是保险库存储。Bitwarden 从相反方向进攻，凭借 80,000+ 家企业、开源透明度、云或自托管部署，以及量化的易部署和 ROI 主张。Dashlane
              正把自己从密码管理器重塑为 Omnix 凭据安全平台，把安全保险库与凭据保护和风险检测模块配在一起。LastPass 仍是可识别的跨平台零知识品牌，并与 SSO、MFA 相邻；但其当前官网仍用相当篇幅解释
              2022 年后整改和安全转型，显示信任拖累仍未完全消失。Keeper 自己的主张组合包括零知识架构、安全共享、SCIM / SSO、通行密钥、机密、KeeperPAM、MSP 支持、AI agent
              机密访问和公共部门合规。相邻企业买家侧，CyberArk 和 Delinea 现在销售动态授权、AI
              驱动审计、安全远程访问、机器身份和零常驻特权模型，能够吞并更简单的保险库点状方案。公开定价透明度参差不齐：多数已抓取页面展示按用户年度套餐或定制销售动作，但公开数字的可比性弱于品类买家预期，尤其当企业套装、ELA
