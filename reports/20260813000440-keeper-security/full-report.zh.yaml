      - number: '2.3'
        title: 买家、采用路径、增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              买方和付款方角色会随分段显著变化。个人和家庭自行购买；SMB 往往由业主或 IT 通才采购；更大的私营企业会让 CISO、IAM 负责人或安全架构师参与决策；当机密、自动化或多云轮换重要时，DevSecOps
              或平台工程团队会加入；联邦或 SLED 机构还会叠加采购和合规利益相关方。买方复杂度会拖慢交易，但需求驱动很持久。Verizon 2026 DBIR 继续把泄露成因与人为因素、钓鱼和被盗凭据绑定；IBM 2026
              报告把平均泄露成本定为 US$4.99M，并强调 AI 系统对身份控制的需求正在上升。NIST SP 800-207 和 CISA 零信任成熟度模型都强化了最小权限、逐请求访问和以数据为中心的安全控制；NIST
              SP 800-63B 现在要求 AAL2 提供抗钓鱼选项，并对联邦人员强制要求。Microsoft 2026 Entra 更新进一步推动市场：让通行密钥成为默认路径，并将在 2027 年停用 Microsoft
              提供的原生 SMS / 语音投递。这些都是 Keeper 所在品类的强顺风。反向力量同样重要：免费的内置密码 / 通行密钥工具压缩消费者和轻管理分段的支付意愿；PAM
              预算要与根深蒂固的老牌厂商竞争；云机密管理器能满足部分机器身份需求，无需另买供应商；组织也常低估迁移共享凭据、集成 IdP 和执行新最小权限工作流所需的变更管理工作。因此，Keeper
              的市场吸引力并不主要取决于网络风险是否存在——这很明显——而取决于它能否持续赢下整合度更高、控制要求更强的那一片市场，那里碎片化工具带来的运营负担已经痛到足以支撑整合采购。
