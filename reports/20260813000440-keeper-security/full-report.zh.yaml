  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Keeper
              所在的是分层市场，而不只是传统消费者密码管理器品类。当前产品页面覆盖员工密码管理、特权访问管理、机密管理、远程浏览器和远程基础设施访问、通行密钥管理以及公共部门身份安全。这意味着相关市场边界比“把密码存在保险库里”更宽，但又窄于完整身份栈。Keeper
              并不想成为通用目录、完整客户身份平台或广义
              SIEM；它切入的是组织需要安全凭据存储、最小权限会话控制、机器机密工作流和抗钓鱼认证，但又不想拼接多个点状工具的场景。因此，替代品集合具有结构性重要性。低端市场里，Google Password Manager
              和 Apple 的 Passwords 应用已经为消费者和轻管理团队提供零价格的内置密码与通行密钥存储。机器身份侧，AWS Secrets Manager 和 Azure Key Vault
              覆盖各自生态内的云机密存储。相邻企业安全预算中，BeyondTrust 等 PAM 老牌厂商已经销售即时授权和最小权限控制。Keeper
              的楔子在于把这些任务统一进一个零知识控制平面，尤其适合那些希望用一个系统横跨人工凭据、机密、特权会话和无密码迁移，而不是拆成多个供应商孤岛的买家。
