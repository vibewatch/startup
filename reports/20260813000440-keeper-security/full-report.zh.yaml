      - number: '5.2'
        title: 架构、加密、部署与信任控制
        blocks:
          - type: paragraph
            body: >-
              作为一家私营软件公司，Keeper 的技术核心披露异常明确。安全架构页面描述了客户端记录和文件夹密钥、主密码流程中一百万次迭代的 PBKDF2、用于 SSO 和无密码流程的基于 ECC 的设备批准、存储数据的
              AES-256 GCM、传输中的 TLS 1.3 加载荷封装，以及 2026 年 Q1 在传输密钥外增加一层抗量子封装。同一来源、用户指南和企业指南都强化了中心主张：加密和解密都在已批准设备本地完成，因此
              Keeper 员工无法解密客户数据。部署上，KeeperPAM 使用云访问控制平面和轻量级出站网关模式；Keeper Connection Manager
              则服务那些需要完全自托管、内网或隔离网络中基于浏览器网关的客户。这种灵活性有战略价值：它拓宽了 Keeper 在商业云、混合环境和受监管政府环境中的适配面。但它也带来更多需要保护的运行模式。自托管 KCM 会把
              Docker、SSL、数据库和补丁管理义务交给客户；云托管流程仍依赖设备信任、浏览器扩展行为和身份提供商完整性。架构看起来强且有差异化；攻击面也比简单保险库产品更宽。
