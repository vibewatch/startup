      - number: '6.3'
        title: 留存、扩张、集中度与客户结论
        blocks:
          - type: paragraph
            body: >-
              Keeper 的客户质量看起来有前景，但公开记录仍未达到投资级留存证明。扩张向量很容易看见：商业和企业账户内的按席位增长、企业到家庭的外溢、Secrets Manager 和 KeeperPAM 附加、通过
              Government Cloud 向公共部门增购，以及通过服务提供商客户实现 MSP
              式下游席位倍增。评论来源和案例研究也暗示，易实施性在商业上重要，因为低摩擦上线会同时提高采用和续约概率。与此同时，公开负面信号真实存在，不应忽视。G2、GetApp 和 Slashdot
              风格评论反复提到价格高或混乱、涨价、附加项疲劳、自动填充不一致、报告缺口，以及一些管理控制台或独立应用限制。这些投诉还没严重到暗示信任危机，但确实指出了流失或采购摩擦会积累的实践区域，尤其是在较小或成本敏感账户中。集中度风险在公开层面仍基本不可知。参考集合跨垂直和地域多元，反对任何单一行业的极端依赖，但前
              10 大客户收入、最大客户席位数和按模块拆分的续约表现都是私有信息。新鲜度也不均衡：部分 KCM 参考可追溯到 2022 年，而许多密码管理器和 KeeperPAM 参考来自 2025-2026
              年。因此，整体客户结论是有利但不完整：Keeper 似乎拥有多元化装机基础、真实生产参考和良好客户情绪，但决定耐久性的关键指标——NRR、GRR、流失、续约定价行为和集中度——在公开证据中仍未验证。
