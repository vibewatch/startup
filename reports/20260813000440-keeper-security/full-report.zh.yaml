  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分段、规模与具名客户覆盖
        blocks:
          - type: paragraph
            body: >-
              Keeper 可见的客户地图至少横跨七个有意义的分段。一端是使用跨设备保险库、安全共享和 BreachWatch
              的消费者个人与家庭；应用商店评分、家庭计划包装和反复出现的“数百万人”表述支撑了庞大的长尾用户基础。中间是 SMB 和中端市场企业客户，它们使用带
              SSO、SCIM、报告和安全共享的核心企业密码平台。高端则是关注特权访问、机密、会话监控和审计控制的企业和高度受监管买家。公共部门、高等教育和非营利用户显然是真实子分段，而不是营销抽象：New Mexico
              Taxation and Revenue Department、Illinois College、Oregon State University 和 Alzheimer’s Association 都出现在
              Keeper 案例库中，Government Cloud 信息也强化了专门的公共部门定位。MSP / 渠道需求也可见于 Lucidica 和 KeeperMSP 材料，其中买家是服务提供商，下游用户同时包括
              MSP 员工和托管客户。最后，一个技术操作者分段如今叠在基础保险库业务之上：Asite、Williams 和 Nokia
              这些案例突出的是需要特权会话、机密、凭据代理或远程访问基础设施的买家，而不只是员工密码存储。重要结论是，Keeper
              并不依赖单一客户故事。它的参考集合横跨商业、教育、金融、公共部门、电信、法律和托管服务，说明用途广泛，且没有明显单一垂直极端集中。
