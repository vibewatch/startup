  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 质量
        - 按产品、地区和客户分群拆分的当前 ARR 桥
        - 判断已披露规模是否集中、耐久，并支撑组合迁移
        - 索取 CFO 材料包和董事会级 KPI 演示材料
      - - 留存
        - 按企业 / SMB / 公共部门拆分的 NRR、GRR、logo 流失和队列扩张
        - 支撑溢价倍数最重要的输入
        - 索取月经常性收入队列分析
      - - 利润率和现金
        - 毛利率、贡献利润率、运营费用结构、自由现金流和现金余额
        - 判断盈利能力说法是结构性强，还是定义很轻
        - 索取经审计或董事会审阅的财务报表
      - - 集中度
        - 前 10 大客户、公共部门占比和渠道集中度
        - 限定续约延迟或客户流失带来的下行
        - 索取 ARR 集中度和续约日历
      - - 模块经济性
        - KeeperPAM 与 Secrets 挂载、赢率和实施负担
        - 判断平台扩张相对纯密码同行是否配得上溢价
        - 索取按分群拆分的产品挂载和赢 / 输数据
      - - 股权结构和优先权
        - 清算优先权、保护性条款、老股交易和任何 2023 年后的估值标记
        - 仅企业价值无法决定普通股吸引力
        - 索取法律版股权结构材料包和交易历史
    notes: 每个尽调请求都因会实质改变建议、倍数或下行校准而入选。
    claimRefs:
