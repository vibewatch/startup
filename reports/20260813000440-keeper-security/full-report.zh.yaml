chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前公开规模
        blocks:
          - type: paragraph
            body: >-
              Keeper Security 现在把自己呈现为身份安全平台，而不只是保险库应用。官网把 Keeper 描述为统一控制平面，覆盖特权访问、机密、远程连接、端点和数据库；核心产品页面显示，这把伞已经延伸到
              KeeperPAM、Keeper Secrets
              Manager、安全远程访问、政府云和通行密钥能力。公司在这些页面反复用零信任、零知识架构和端到端加密锚定差异化，并强调只有客户才能解密已存储数据。公开规模说法有分量，但并不完全同步：官网称 Keeper
              服务超过 93,000 家企业客户、保护 400 万人、业务遍及 150 多个国家；而 2025 年 12 月 FedRAMP High 公告称 Keeper 保护超过 85,000
              家组织。这种差异更像页面更新节奏问题，不足以严重动摇平台叙事，但后续章节仍不能在不注明页面日期的情况下假设一个精确数量。产品广度也明显超出人工密码存储。KeeperPAM
              统一密码、机密、连接管理、零信任网络访问和远程浏览器隔离；Keeper Secrets Manager 聚焦 API 密钥、CI/CD 凭据、容器和其他非人类身份。因此，公开材料支持这样一个判断：Keeper
              已从密码管理入口扩展为更宽的身份安全厂商，扩张路径是特权访问和机器机密控制。
