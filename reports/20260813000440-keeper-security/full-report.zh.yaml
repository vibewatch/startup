      - number: '7.3'
        title: 财务 / 模型风险、缓释因素与投资逻辑破坏点
        blocks:
          - type: paragraph
            body: >-
              最大模型风险，是增长叙事和可承销持久性之间的落差。相比一年前，Keeper 现在讲得出一个强得多的公开规模故事：保护超过 95,000 家组织、每月新增 850
              家组织、满意度指标扎实，并给出年经常性收入（ARR）迈向 US$1B 的路径。但投资人仍然看不到决定增长韧性的指标：净留存率（NRR）、总留存率（GRR）、客户账户流失、席位深度、头部客户集中度、公共部门 ARR
              占比、获客成本（CAC）回本周期，以及公司自称盈利之外的当前现金生成能力。缺失这些数据很关键，因为几个已识别风险会直接传导到估值。原生平台管理器的竞争压力会压缩低端定价。BeyondTrust 和 AWS
              Secrets Manager 等高端竞品可能侵蚀附加销售率，或拿下控制要求更高的工作负载。安全事件或认证问题会拖慢公共部门增长，并伤害销售效率。支持压力或定价反弹可能拉低转化或续约质量。好消息是，Keeper
              也有看得见的缓释因素：差异化的零知识信任模型、广泛客户证明、与受监管市场的适配、评论背书的易用性，以及超越单纯密码库的模块宽度。核心投资逻辑失效触发点因此可监控：若新客户增长明显放缓，若 PAM /
              机密凭证附加销售停滞，若公开评论情绪恶化，若发生重大安全事件，或若管理层在尽调中无法证明留存持久、收入多元，乐观情景会迅速削弱。这里的风险并不抽象，而是一组能识别的传导路径，会打到客户增长、利润质量和退出倍数支撑。
