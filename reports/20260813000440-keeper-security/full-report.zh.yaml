      - number: '7.2'
        title: 运营、依赖与人员风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Keeper 已经超出经典密码管理器较简单的失效模式。平台现在横跨云托管保险库、出站网关模式、自托管 Connection Manager、机密工具、特权会话、AI
              监控和公共部门变体。这种广度有战略意义，但也扩大了执行暴露。最可见的依赖风险在 AWS 和 GovCloud 基础设施、企业 IdP、浏览器、移动操作系统、应用商店，以及 KCM 底层继承的 Apache
              Guacamole 技术栈。自托管客户场景下，Keeper 还会从它并不完全控制的环境中继承微妙品牌风险：如果客户错误配置 SSL、数据库补丁滞后，或在 KCM 中处理升级不当，运营事故仍可能在情绪上归因于
              Keeper。评论来源还添加了另一个运营信号：客户反复称赞易部署，但也提到定价复杂、报告缺口、自动填充不一致，以及一些管理控制台摩擦。这些不是生死问题，却正是在新增客户速度保持高位时会随规模复合的烦恼。人员维度同样重要。创始人连续性是优势，但也意味着关键人物依赖在公司外部叙事和产品方向中仍有分量。快速平台扩张需要安全工程、支持、合规、公共部门运营和产品管理上的深厚梯队；公开来源没有证明这些梯队薄弱，但也没有证明继任深度或组织冗余。主要运营判断因此是典型扩张风险：Keeper
              的产品广度同时变成战略资产和协调负担。
