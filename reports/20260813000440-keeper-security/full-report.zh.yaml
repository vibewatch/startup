  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与操作者工作流
        blocks:
          - type: paragraph
            body: >-
              Keeper 的公开产品地图如今分为三层。基础层仍是员工和消费者保险库：安全密码、通行密钥、文件和机密数据存储，带策略控制、浏览器 / 移动覆盖和企业管理。第二层是机器与特权访问：KeeperPAM、Keeper
              Secrets Manager 和 Keeper Connection Manager
              一起覆盖机密、凭据轮换、发现、基于浏览器的远程访问、隧道、会话录制和零信任访问工作流。第三层是受监管和专用包装：面向公共部门买家的 Government Cloud、用于受损凭据监测的
              BreachWatch，以及快速增长的集成目录；该目录现在包括 AI agent 环境、CI/CD 工具、主要身份提供商和云服务。最重要的产品结论不是品类，而是架构：Keeper
              试图让保险库成为人工和机器身份工作流的共享控制平面。这给公司提供了连贯的交叉销售叙事，因为通行密钥、机密、远程会话和策略执行都继承同一套管理员和加密姿态。这也意味着后续产品会以核心保险库的信任标准来评判，从而抬高运营、检测质量和发布纪律门槛。包装广度在这里很重要，因为
              Keeper 现在能把同一套信任叙事卖进员工、开发者、特权管理员和公共部门场景。
