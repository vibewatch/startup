  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图、替代品与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              Keeper 的竞争集合最好理解为四类重叠玩家。第一类是直接的员工密码和凭据控制同行：1Password、Bitwarden、Dashlane 和
              LastPass，它们都向企业买家销售安全保险库、共享、管理员控制以及无密码或通行密钥支持。第二类是相邻的特权访问和身份安全套件，例如 CyberArk、Delinea 和
              BeyondTrust；它们不是从传统密码保险库起步，而是从最小权限、会话控制和零常驻特权工作流切入同一买家。第三类是以机密为中心的工具和云原生替代品，例如 HashiCorp Vault、AWS Secrets
              Manager 和 Azure Key Vault；它们解决问题中的机器身份一侧，并可能吸收本会流向统一平台的预算。第四类是零价格内置工具和现状本身：Google Password Manager、Apple
              Passwords，以及浏览器自动填充、硬编码机密和临时凭据共享等未治理习惯。关键在于，Keeper 会被两端挤压。Google 和 Apple 压缩低端支付意愿，CyberArk 或 Delinea
              则能把大型企业拉向更宽的身份安全套件。因此，Keeper
              可赢的可服务市场不是“所有有密码的人”，而是这样一片买家：他们足够看重密码、通行密钥、机密、特权访问和合规上的统一控制，愿意选择专业平台，而不是零散工具或捆绑替代品。
