callouts:
- calloutType: strength
  title: Keeper’s best market wedge is control-heavy consolidation, not generic password storage
  body: Keeper does not need to win every password saved on the internet. Its strongest market position is with buyers who need one governed platform spanning human credentials, machine secrets, privileged sessions and passkeys, especially when regulated deployment or operational simplicity matters.
  claimRefs:
  - CM001
  - CM014
  - CM028
  - CM029
  - CM030
  - CM035
- calloutType: risk
  title: A growing market does not eliminate substitute pressure or category-overlap risk
  body: Password-management and PAM markets are growing, but Google, Apple, AWS, Azure and incumbent privilege vendors already solve parts of the same job. Keeper only captures the attractive slice if buyers value unification and control enough to pay beyond those bundled or native options.
  claimRefs:
  - CM003
  - CM004
  - CM006
  - CM007
  - CM025
  - CM032
