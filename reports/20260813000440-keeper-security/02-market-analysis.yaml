- id: TM001
  title: Market definition table
  columns:
  - Segment / Category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Keeper
  rows:
  - - Workforce password management
    - Paid vault subscriptions, credential sharing, policy controls, audit logs and recovery workflows
    - Unmanaged spreadsheets, browser memory, and zero-price unmanaged storage
    - Individual, IT admin, CISO / user or employer
    - Core revenue wedge and historical brand anchor
  - - Privileged access management
    - Least-privilege access, credential rotation, session monitoring, remote access and endpoint privilege controls
    - Broad IAM directory spend or full network-security platforms
    - Security, IAM, infrastructure and compliance teams / security or IT budget
    - Fastest-growing adjacent market that KeeperPAM is explicitly targeting
  - - Secrets management / NHI security
    - API keys, service credentials, CI/CD secrets, cloud rotation and machine-to-machine access control
    - General cloud infrastructure spend not tied to credentials
    - DevSecOps and platform engineering / engineering or security budget
    - Important expansion path beyond human vaulting
  - - Passwordless / passkey orchestration
    - Passkey storage, sharing, autofill, workforce rollout and phishing-resistant login policy
    - Biometric hardware itself and consumer device OS lock-in
    - Identity, security and end-user IT / security or productivity budget
    - Strategic growth layer and retention defense as passwords decline
  - - Government / regulated identity security
    - FedRAMP/GovRAMP compliant access control, auditability and zero-trust privileged access
    - Broader public-sector ERP or case-management software
    - Agency security teams, procurement and compliance / public-sector IT budget
    - Where Keeper’s authorization stack expands TAM beyond commercial SMB
  - - Built-in / ecosystem substitutes
    - n/a — competitive context rather than Keeper revenue pool
    - Google Password Manager, Apple Passwords, CSP-native secrets stores
    - End user or existing cloud account owner / often no separate payer
    - Defines the zero-price or already-bundled baseline Keeper must exceed
  notes: This table defines the market by jobs-to-be-done rather than treating all identity spending as Keeper’s addressable opportunity.
