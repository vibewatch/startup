company:
  name: Keeper Security
chapter:
  number: 2
  title: Market Analysis
  summary: 'Keeper Security sells into an overlapping credential-security market rather than one neat category. Public 2026 password-management TAM estimates cluster between roughly US$2.94B and US$3.79B, but Keeper’s practical opportunity sits in the narrower slice where organizations need password vaulting, passkeys, least-privilege access, machine-secret controls and regulated deployment support. Growth drivers are strong—phishing, stolen credentials, zero-trust mandates, AI-driven attacks and public-sector compliance—yet constraints are equally real: built-in Google and Apple password stacks compress the consumer low end, cloud-secret managers and endpoint/PAM incumbents fragment budgets, and market-size publications disagree enough that Keeper-specific SAM should be treated as a bounded lens rather than a single number.'
sections:
- id: market-boundary-adjacencies-and-substitutes
  title: Market boundary, adjacencies, and status-quo substitutes
  body: Keeper participates in a layered market, not just the classic consumer-password-manager category. Its current product pages span workforce password management, privileged access management, secrets management, remote browser and remote infrastructure access, passkey management and public-sector identity security. That means the relevant market boundary is broader than “store passwords in a vault” but narrower than the entire identity stack. Keeper is not trying to be an all-purpose directory, full customer-identity platform or broad SIEM; instead it sits where organizations need secure credential storage, least-privilege session control, machine-secret workflows and phishing-resistant authentication without stitching together multiple point tools. The substitute set is therefore structurally important. At the low end, Google Password Manager and Apple’s Passwords app already give consumers and lightly managed workforces built-in password and passkey storage at a zero-price point.
    On the machine-identity side, AWS Secrets Manager and Azure Key Vault cover cloud-secret storage inside their own ecosystems. In adjacent enterprise-security budgets, BeyondTrust and other PAM incumbents already sell just-in-time and least-privilege controls. Keeper’s wedge is the unification of these jobs in one zero-knowledge control plane, especially for buyers who want one system to bridge human credentials, secrets, privileged sessions and passwordless migration rather than separate vendor silos.
