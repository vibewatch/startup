companyProfile:
  summary: Keeper Security is a private Chicago-based cybersecurity company co-founded in 2011 by Darren Guccione and Craig Lurey. What began as a password manager has expanded into a broader identity-security platform that now includes KeeperPAM, secrets management, connection management, remote browser isolation and public-sector offerings. Public evidence confirms meaningful regulated-market traction, including FedRAMP Certified and GovRAMP High posture, while July 2026 disclosures established a stronger financial profile with $225M ARR, profitability, debt-free status and a stated IPO-optional narrative. The open-source record is still incomplete on exact valuation and equity terms, so Keeper should be treated as a scaled late-stage private asset with real platform strength but still incomplete price transparency.
  foundedDate: '2011-01-01'
  founders:
    - name: Darren Guccione
      role: Co-founder & CEO
      background: Public-facing founder/CEO who still anchors Keeper's strategy, product positioning and investor narrative.
      claimRefs: [CO004, CR020]
    - name: Craig Lurey
      role: Co-founder & CTO
      background: Technical co-founder who remains central to product and architecture continuity.
      claimRefs: [CO004, CR020]
  foundingLocation: Chicago, Illinois, USA
  headquarters: Chicago, Illinois, USA
  productSummary: Keeper offers enterprise and consumer password management, KeeperPAM, Keeper Secrets Manager, Keeper Connection Manager, dark-web monitoring and regulated government-cloud identity security.
  customerFocus: Enterprise IT and security teams, public-sector agencies, SMBs, MSPs and consumer/family users that need zero-knowledge credential and privileged-access controls.
  businessModel: Subscription software with tiered business and enterprise plans, custom-priced PAM and public-sector deployments, and add-on or bundled expansion into secrets and advanced controls.
  stage: late-stage private / growth-equity-backed
  fundingStatus: Privately held; public evidence confirms Insight Partners led a $60M minority investment in 2020 and Summit Partners later made a significant minority investment with undisclosed economics. By July 2026, management framed the company as profitable, debt-free and increasingly IPO-optional rather than capital-constrained.
  disclosureProfile: private-undisclosed
  claimRefs: [CO004, CO012, CO013, CO016, CO017, CO022, CO023, CI021, CI024, CV001, CV003]
