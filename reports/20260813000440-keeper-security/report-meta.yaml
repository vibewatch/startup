  topStrengths:
    - Public 2026 disclosure now supports real scale with $225M ARR, profitability, debt-free status and strong new-logo momentum.
    - Product breadth extends beyond password management into PAM, secrets, remote access and regulated government workloads.
    - FedRAMP Certified and GovRAMP High posture help differentiate Keeper from simpler password-only tools.
    - Customer and review evidence supports genuine enterprise relevance rather than a purely consumer-security story.
  topRisks:
    - Public evidence is still thin on NRR, GRR, gross margin, cash generation, concentration and cap-table terms.
    - Trust-sensitive identity and privileged-access positioning means one material security or compliance failure could compress valuation quickly.
    - Premium pricing and add-on complexity remain visible friction points in independent review channels.
    - Bundled substitutes from passkeys, cloud-secret stores and larger identity platforms cap low-end multiple expansion.
  unresolvedGaps:
    - Current ARR bridge, product mix and module attach by segment remain undisclosed.
    - Retention quality, logo churn and cohort expansion are not public.
    - Preference stack, secondary marks and any clean current post-money valuation remain unclear.
    - Gross margin, free cash flow, concentration and public-sector ARR mix are still not available in decision-grade form.
