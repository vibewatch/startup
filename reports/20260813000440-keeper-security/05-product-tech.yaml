callouts:
- calloutType: strength
  title: Keeper’s clearest technical edge is unified control plus deployment flexibility
  body: Keeper’s product story is coherent because the same zero-knowledge trust model extends from the workforce vault into passkeys, secrets, privileged sessions and regulated deployments. The ability to offer both a cloud-native control plane and a self-hosted KCM mode makes the platform relevant to buyers that a simple SaaS password manager or a rigid bastion model would miss.
  claimRefs:
  - CE002
  - CE003
  - CE009
  - CE021
  - CE033
  - CE036
- calloutType: risk
  title: The platform’s breadth widens the evidence burden
  body: Keeper now covers endpoints, browser extensions, identity-provider handoffs, gateways, self-hosted remote access, machine secrets and emerging AI-agent workflows. Public materials show real engineering motion, but they do not yet provide the live uptime, module adoption or independent current-test detail needed to underwrite every newer surface with the same confidence as the core vault.
