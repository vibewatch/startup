company:
  name: Keeper Security
chapter:
  number: 5
  title: Product & Technology
  summary: 'Keeper is no longer just a password vault vendor on its public product surfaces. By August 2026 it presents a layered identity-security platform built around a zero-knowledge vault, a cloud-native privileged access control plane, machine-secret workflows, browser-based session brokering, passkeys, breach monitoring, and a regulated-government deployment. The technical story is strongest where the evidence is most concrete: client-side encryption, device approval, broad integration coverage, frequent release activity, and flexible deployment options spanning cloud-hosted gateway patterns and self-hosted Connection Manager. The main diligence limitations are operational rather than conceptual. Public materials still do not disclose measured uptime, product-line adoption, false-positive rates for AI monitoring, or the current independent test evidence investors and enterprise buyers would want before underwriting the newest surfaces.'
sections:
- id: product-surface-and-operator-workflow
  title: Product surface and operator workflow
  body: 'Keeper’s public product map now spans three layers. The base layer remains employee and consumer vaulting: secure password, passkey, file and confidential-data storage with policy controls, browser/mobile coverage, and enterprise administration. The second layer is machine and privileged access: KeeperPAM, Keeper Secrets Manager, and Keeper Connection Manager together cover secrets, credential rotation, discovery, browser-based remote access, tunnels, session recording and zero-trust access workflows. The third layer is regulated and specialized packaging: Government Cloud for public-sector buyers, BreachWatch for compromised-credential monitoring, and a rapidly growing integration catalog that now includes AI-agent environments, CI/CD tools, major identity providers and cloud services. The most important product conclusion is architectural, not just categorical: Keeper is trying to make the vault the shared control plane for both human and machine identity workflows. That gives the company a coherent cross-sell story because passkeys, secrets, remote sessions and policy enforcement all inherit the same admin and encryption posture. It also means later products are judged against the trust standard of the core vault, which raises the bar for operations, detection quality and release discipline. Packaging breadth matters here because Keeper can now sell the same trust story into workforce, developer, privileged-admin and public-sector contexts.'
