- id: architecture-encryption-deployment-and-trust-controls
  title: Architecture, encryption, deployment and trust controls
  body: 'The technical core is unusually explicit for a private software company. Keeper’s security architecture page describes client-side record and folder keys, PBKDF2 with one million iterations for master-password flows, ECC-based device approval for SSO and passwordless flows, AES-256 GCM for stored data, TLS 1.3 plus payload wrapping in transit, and a Q1 2026 rollout of an additional quantum-resistant wrapper on transmission keys. That same source, the user guides, and the enterprise guide all reinforce the central claim that Keeper employees cannot decrypt customer data because encryption and decryption occur locally on approved devices. On deployment, KeeperPAM uses a cloud access control plane with lightweight outbound gateway patterns, while Keeper Connection Manager exists for customers that need a fully self-hosted, in-network or air-gapped browser-based gateway. That flexibility is strategically valuable: it widens Keeper’s fit across commercial cloud, hybrid and regulated-government environments. But it also creates more operating modes to secure. Self-hosted KCM introduces Docker, SSL, database and patch-management obligations for customers, while cloud-hosted flows still depend on device trust, browser extension behavior and identity-provider integrity. The architecture looks strong and differentiated; the attack surface is broader than a simple vault product.'
