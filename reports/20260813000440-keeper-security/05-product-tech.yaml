- id: TE001
  title: Product module / asset matrix
  type: enumeration
  columns:
  - Module
  - Primary user / workload
  - Delivery model
  - What it does
  - Current diligence read
  rows:
  - - Business / Enterprise vault
    - Workforce users and IT admins
    - SaaS vault plus browser, desktop and mobile clients
    - Passwords, passkeys, files, sharing, admin policy, SSO/SCIM/RBAC
    - Mature core platform and the base layer for adjacent modules
  - - KeeperPAM
    - Security, IT, DevOps and infrastructure teams
    - Cloud-native access control plane with gateway pattern
    - JIT access, session brokering, discovery, rotation, session monitoring and privileged workflows
    - Expansion engine and the clearest product-scope shift beyond vaulting
  - - Keeper Connection Manager
    - Sovereignty-sensitive, self-hosted or air-gapped deployments
    - Self-hosted Docker-based remote access gateway
    - Browser-based RDP, SSH, VNC, K8s, database and internal web access with recording
    - Differentiated deployment option but operationally heavier
  - - Keeper Secrets Manager
    - DevOps, software engineering and machine identity workflows
    - Fully managed cloud service with SDKs, CLI and integrations
    - Infrastructure secrets, API keys, certificates, service-account rotation and CI/CD injection
    - Strong machine-identity adjacency to the core vault
  - - BreachWatch
    - End users and admins monitoring compromised credentials
    - Add-on feature inside Keeper clients
    - Local scans and dark-web / breach monitoring for records in vault
    - Mature adjunct security feature, not a standalone platform
  - - Government Cloud (KSGC)
    - Federal, state, local and contractor workloads
    - AWS GovCloud-based regulated offering
    - Passwords, secrets, session monitoring, secure remote access and compliance framing
    - Important regulated wrapper around broader Keeper stack
  - - Passkey management
    - Consumers, workforce users and admins
    - Native vault capability across clients
    - Save, sync, autofill and share passkeys with biometric unlock support
    - Extends vault relevance into passwordless workflows
  notes: Rows enumerate the public Keeper modules and packaging layers most material to product diligence as of 2026-08-13.
