- id: TE003
  title: Technology / operating architecture table
  type: enumeration
  columns:
  - Layer
  - Components / design
  - Evidence
  - Strength
  - Risk / unknown
  rows:
  - - Client crypto
    - Record keys, folder keys, user data key, local cache key, device-local encryption/decryption
    - Security architecture page
    - Strong least-privilege and blast-radius reduction story
    - Need independent architecture review and key-handling audit
  - - Authentication and device approval
    - PBKDF2 for master-password flow; ECC-256 device keys and DEDK for SSO/passwordless
    - Security architecture page
    - Clear separation between login modes with explicit device trust model
    - Endpoint compromise or extension compromise remains critical
  - - Hosted access plane
    - Cloud-native KeeperPAM plus outbound gateway model and no ingress requirement
    - KeeperPAM page and docs
    - Easier deployment than bastion-heavy legacy approaches
    - Public reliability and scale data absent
  - - Self-hosted access gateway
    - KCM Docker deployment with Guacamole, NGINX, Tomcat and supported DBs
    - KCM overview and security docs
    - Useful for air-gapped and in-network control needs
    - Customer owns more patching, SSL and DB posture
  - - Machine secrets layer
    - KSM SDKs, CLI, REST and CI/CD integrations
    - Secrets pages and developer docs
    - Broad automation surface for machine identity
    - Need attach and rotation-depth data by customer segment
  - - Trust and recovery layer
    - Record versioning, backups, recovery phrase, admin policy controls
    - Security page and guides
    - Strong data-resilience posture on paper
    - Recovery operations and support-driven restores are not quantified publicly
  - - Government packaging
    - AWS GovCloud deployment with regulated identity and compliance claims
    - Government page plus AWS GovCloud context
    - Extends fit into high-control public-sector workloads
    - Exact authorization package and workload reference depth not public
  notes: Public sources are detailed enough to map Keeper’s major operating layers, but not enough to test them empirically.
