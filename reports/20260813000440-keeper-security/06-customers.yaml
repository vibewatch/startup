- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - Per-seat expansion inside business and enterprise
    - Seat penetration and seat contraction rates are private
    - Core ARR growth driver likely meaningful but unverified
    - Request seat cohorts by initial deal size and annual expansion
  - - PAM and Secrets Manager attach
    - Module attach rates not public
    - High-value cross-sell may materially raise ARPU
    - Request attach by segment, product family ARR and renewal rates
  - - Business-to-family spillover
    - Unknown true conversion or retention lift
    - May increase adoption and reduce employee resistance
    - Request usage, conversion and retention delta for family-plan users
  - - Public-sector and education growth
    - Procurement cycles and contract concentration are private
    - Could improve durability but lengthen sales cycles
    - Request win rates, cycle length and ARR share by regulated buyers
  - - MSP/channel expansion
    - Downstream client concentration and partner dependence private
    - Can multiply distribution efficiently, but partner churn could bite
    - Request top-partner revenue share and downstream seat distribution
  - - Pricing and add-on friction
    - Repeated review complaints about pricing changes, add-ons and reporting extras
    - Can slow expansion or complicate renewal
    - Request renewal uplift, discount history and loss reasons by segment
  - - Vertical concentration
    - Public references are diverse, but top-customer revenue is unknown
    - Diversification appears favorable yet cannot be proven financially
    - Request top-10 customer revenue concentration and contract terms
  notes: The visible customer story supports expansion potential, but public concentration evidence is qualitative rather than financial.
