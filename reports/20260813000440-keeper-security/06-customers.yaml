figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: >-
    The dominant Keeper journey runs from insecure or fragmented credential habits into centralized vault adoption, then
    expands into higher-control features such as SSO, secrets, PAM, family spillover or public-sector deployment.
  data:
    nodes:
    - id: j1
      label: Discovery via reviews, peers, compliance pressure and breach pain
      detail: G2, GetApp, app stores, case studies and prior-tool dissatisfaction surface Keeper to both consumers and IT buyers.
    - id: j2
      label: Initial vault rollout
      detail: Consumer self-serve or IT-led business rollout replaces spreadsheets, browser storage or legacy password tools.
    - id: j3
      label: Admin control and secure sharing
      detail: Teams adopt shared folders, SSO, SCIM, MFA and reporting as the platform becomes operationally embedded.
    - id: j4
      label: Expansion into advanced workflows
      detail: Secrets, PAM, remote access, session recording or Government Cloud are added for higher-control use cases.
    - id: j5
      label: Reference, review and downstream expansion
      detail: Satisfied customers publish case studies, leave reviews, add family users or extend Keeper to managed clients and new departments.
  claimRefs:
  - CU001
  - CU011
  - CU012
  - CU028
  - CU031
  - CU038
