artifact: customers
slug: keeper-security
runDate: '2026-08-13'
company:
  name: Keeper Security
chapter:
  number: 6
  title: Customers
  summary: >-
    Keeper’s customer base in 2026 is broad and visibly diversified across consumer, SMB, enterprise, public sector,
    education, MSP/channel and privileged-access-heavy technical buyers. The strongest public scale anchor is the
    company’s July 2026 claim that it protects more than 95,000 organizations, while other fresh company surfaces now
    say over 100,000 organizations choose Keeper and app-store evidence still points to a very large consumer footprint.
    Named production references are unusually rich for a private cybersecurity vendor: Williams F1 Team, Asite,
    Lucidica, Illinois College, Peak Trust, Oregon State University, Nokia and a New Mexico state agency all publish
    deployment stories with concrete use cases and operator quotes. What remains missing are the hardest underwriting
    inputs: NRR, GRR, churn, top-customer concentration, active-seat depth by segment, and module attach economics.
sections:
- id: segmentation-scale-and-named-customer-coverage
  title: Customer segments, scale and named-customer coverage
  body: >-
    Keeper’s visible customer map spans at least seven meaningful segments. At one end are consumer individuals and
    families using the cross-device vault, secure sharing and BreachWatch surfaces; app-store ratings, family-plan
    packaging and repeated references to “millions of people” support a large long-tail user base. In the middle are
    SMB and mid-market business customers using the core enterprise password platform with SSO, SCIM, reporting and
    secure sharing. At the upper end are enterprise and highly regulated buyers that care about privileged access,
    secrets, session monitoring and audit controls. Public-sector, higher-education and nonprofit users are clearly real
    subsegments rather than marketing abstractions: New Mexico’s Taxation and Revenue Department, Illinois College,
    Oregon State University and Alzheimer’s Association all appear in Keeper’s case-study inventory, and Government
    Cloud messaging reinforces dedicated public-sector positioning. MSP/channel demand is also visible through the
    Lucidica and KeeperMSP materials, where the buyer is the service provider and the downstream users are both the MSP
    staff and managed clients. Finally, a technical operator segment now sits on top of the base vault business: Asite,
    Williams and Nokia highlight buyers who need privileged sessions, secrets, credential brokering or remote-access
    infrastructure rather than only employee password storage. The important conclusion is that Keeper is not dependent
    on one mono-segment customer story. Its reference set spans commercial, education, finance, public sector, telecom,
    legal and managed services, which argues for broad utility and low obvious single-vertical concentration.
