- id: TU001
  title: Customer segmentation table
  type: enumeration
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public scale signal
  - Strategic value
  - Gap
  rows:
  - - Consumer individual
    - Individual = buyer / user / payer
    - Passwords, passkeys, private vault, secure files, dark-web monitoring
    - Millions of people; 229K iOS ratings; 111K Android ratings
    - Brand, funnel and broad data set for product direction
    - Paid conversion and churn are private
  - - Families / household
    - Household organizer = payer; family members = users
    - Shared household credentials and emergency access
    - Publicly bundled and linked to business-family benefit
    - Retention enhancer and consumer expansion path
    - Family attach and renewal rates are private
  - - SMB / mid-market business
    - IT/admin = buyer; employees = users; company = payer
    - Shared vaults, admin controls, SSO, compliance and reporting
    - Material subset of 95,000+ orgs
    - Core land motion and seat-expansion engine
    - Segment mix and realized ASP are private
  - - Enterprise / regulated commercial
    - Security / IT / compliance = buyer; workforce = users
    - SSO/SCIM, audit, secrets, privileged access, policy enforcement
    - Many Fortune 500 enterprises cited by company
    - Premium contract and module-attach opportunity
    - Top-account concentration and retention are private
  - - Public sector / education / nonprofit
    - Agency/CIO/IT leadership = buyer; staff and students = users
    - Government Cloud, credential management, remote access, compliance
    - New Mexico, Illinois College, Oregon State, Alzheimer’s Association
    - Strong trust/compliance wedge
    - Current contracted ARR by public sector is private
  - - MSP / channel
    - MSP leadership = buyer / payer; MSP staff + managed clients = users
    - Multi-tenant password governance and client credential sharing
    - Lucidica and KeeperMSP references
    - Can multiply seats downstream across customer portfolios
    - Channel revenue share and partner concentration are private
  - - Privileged-access / developer / ops buyers
    - Security/platform/infra team = buyer; admins and developers = users
    - PAM, secrets, tunnels, secure remote access, session recording
    - Williams, Asite, Nokia and New Mexico KCM use cases
    - Higher-value expansion beyond core vaulting
    - Attach rate and renewal depth are private
  notes: Customer segments compiled from Keeper’s 2025-2026 product, review and case-study surfaces.
