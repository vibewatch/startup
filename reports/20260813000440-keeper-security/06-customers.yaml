- id: retention-expansion-concentration-and-customer-verdict
  title: Retention, expansion, concentration and customer verdict
  body: >-
    Keeper’s customer quality looks promising, but the public record still stops short of investor-grade retention proof.
    Expansion vectors are easy to see: per-seat growth inside business and enterprise accounts, business-to-family
    spillover, Secrets Manager and KeeperPAM attach, public-sector upsell through Government Cloud, and MSP-style
    downstream seat multiplication through service-provider customers. Review sources and case studies also hint that easy
    implementation matters commercially because low-friction rollout improves both adoption and renewal odds. At the same
    time, public adverse signals are real and should not be ignored. G2, GetApp and Slashdot-style reviews repeatedly
    mention high or confusing pricing, price increases, add-on fatigue, autofill inconsistency, reporting gaps and some
    admin-console or standalone-app limitations. Those complaints are not severe enough to suggest a trust crisis, but
    they do point to the practical areas where churn or procurement friction can accumulate, especially in smaller or
    cost-sensitive accounts. Concentration risk is still mostly unknowable publicly. The reference set is diverse across
    verticals and geographies, which argues against extreme dependence on any one sector, but top-10 customer revenue,
    top-customer seat counts and module-specific renewal performance are all private. Freshness is mixed too: some KCM
    references date back to 2022, while many password-manager and KeeperPAM references are 2025-2026. The overall
    customer verdict is therefore favorable but incomplete: Keeper appears to have a diversified installed base with real
    production references and good customer sentiment, yet the key durability metrics — NRR, GRR, churn, renewal pricing
    behavior and concentration — remain unverified in public evidence.
