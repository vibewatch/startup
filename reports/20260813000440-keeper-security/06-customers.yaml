    - label: Initial paid rollout
      value: 14
      detail: Consumer subscription or business deployment for shared credential control.
    - label: Admin-policy embedding
      value: 8
      detail: SSO, SCIM, MFA, secure sharing and reporting become operational defaults.
    - label: Advanced attach
      value: 3
      detail: Secrets, KeeperPAM, KCM, Government Cloud or MSP downstream expansion.
    - label: Renewal + reference loop
