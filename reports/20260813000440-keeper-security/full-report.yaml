      - number: '2.3'
        title: Buyers, adoption path, growth drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Buyer and payer roles vary materially by segment. Individuals and families self-procure; SMBs often buy
              through an owner or IT generalist; larger private enterprises route decisions through a CISO, IAM lead or
              security architect; DevSecOps or platform-engineering teams join when secrets, automation or multi-cloud
              rotation matter; and federal or SLED agencies layer procurement and compliance stakeholders on top. That
              buyer complexity can slow deals, but the demand drivers are durable. Verizon’s 2026 DBIR continues to tie
              breach causation to the human element, phishing and stolen credentials, while IBM’s 2026 report puts the
              average cost of a breach at US$4.99M and emphasizes the rising identity-control demands of AI systems.
              NIST SP 800-207 and CISA’s zero-trust maturity model both reinforce least-privilege, per-request access
              and data-centric security controls, and NIST SP 800-63B now requires phishing-resistant options at AAL2
              while mandating them for federal personnel. Microsoft’s 2026 Entra update pushes the market further by
              making passkeys the default path and retiring Microsoft-provided native SMS/voice delivery in 2027. Those
              are strong category tailwinds for Keeper. The counterweights are equally important: free built-in
              password/passkey tools compress willingness to pay in the consumer and light-admin segments; PAM budgets
              are contested by entrenched incumbents; cloud-secret managers satisfy some machine-identity needs without
              a separate vendor; and organizations often underestimate the change-management work required to migrate
              shared credentials, integrate IdPs, and enforce new least-privilege workflows. Keeper’s market
              attractiveness therefore depends less on the existence of cyber risk—which is obvious—and more on whether
              it can keep winning the integrated, higher-control slice where the operational burden of fragmented tools
              is already painful enough to justify consolidation.
