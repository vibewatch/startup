  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal and trust risk
        blocks:
          - type: paragraph
            body: >-
              The defining legal and regulatory risk is trust failure under a compliance-heavy go-to-market. Keeper
              markets into FedRAMP High, GovRAMP High, FIPS, SOC 2, ISO and NIST-aligned buying contexts, and it
              explicitly positions itself as the control plane for privileged identities, secrets and AI agents. That
              raises the consequence of any certification lapse, disclosure error or security incident. The company’s
              public materials correctly frame many of these controls as differentiators, but the same positioning means
              they can become downside multipliers. A vulnerability in a remote-access component, a failure in device
              approval, or a disputed data-handling issue can quickly turn into procurement friction, delayed renewals
              or legal scrutiny because buyers are not purchasing a low-stakes consumer utility — they are buying a
              trust and compliance system. Public evidence already shows that Keeper is not risk-free. The Connection
              Manager advisories page lists historical CVEs, including a high-severity SAML validation issue, and
              OpenCVE tracks additional Keeper-related client or adjacent-product issues. None of this proves a current
              platform weakness, but it does prove the normal reality of a large attack surface. The mitigating
              counterweight is substantial: zero-knowledge design, quarterly testing, Bugcrowd disclosure, region
              isolation and explicit cryptographic controls. The legal/regulatory verdict is not that Keeper is
              unusually fragile; it is that the business has chosen regulated, high-control customer segments where the
              penalty for any trust miss is disproportionately large.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
