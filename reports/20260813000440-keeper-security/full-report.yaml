      - number: '3.3'
        title: Switching costs, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Keeper has a real but conditional moat. Switching costs are meaningful once a buyer has configured
              folders, roles, SCIM provisioning, SSO, session controls and onboarding workflows, but they are not
              absolute because competitors actively advertise migration, import and rapid rollout. That keeps feature
              parity pressure high. Distribution power increasingly sits with ecosystem breadth and buyer trust rather
              than with password storage alone: 1Password stretches into SaaS governance and AI discovery, CyberArk and
              Delinea stretch into every-identity privilege control, and cloud-native secret stores can win by simply
              being “already there” inside AWS or Azure. Keeper’s strongest moat signals from fetched pages are its
              compliance-heavy posture, public-sector readiness, unified passwords-plus-secrets-plus-PAM story, and the
              ability to sell operational simplicity alongside security. Its biggest displacement risk is
              commoditization of basic vaulting and passkeys by Apple, Google and platform vendors, plus higher-end
              suite competition from broader identity-security players. The most important open question is therefore
              not whether Keeper is feature-complete—it broadly is—but whether it can consistently win the integrated
              control-heavy slice fast enough to offset bundled-native substitutes below and broader suite consolidation
              above. Without current win/loss data, realized pricing and product attach rates, moat durability should be
              viewed as promising but not yet fully underwritten.
