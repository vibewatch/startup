  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Keeper’s public architecture now stacks a zero-knowledge vault, privileged-access control plane, secrets tooling,
      and optional self-hosted gateway modes on top of shared admin and compliance controls.
    data:
      layers:
        - id: l1
          label: User and application surfaces
          detail: >-
            Browser extension, web vault, desktop apps, mobile clients and native admin/developer entry points where
            passwords, passkeys and sessions are initiated.
        - id: l2
          label: Identity and policy layer
          detail: >-
            SSO, MFA, device approval, RBAC, admin console controls and audit hooks that decide who may access which
            vaults, secrets and sessions.
        - id: l3
          label: Vault, passkey and monitoring services
          detail: >-
            Core password vault, passkey storage/autofill, BreachWatch scanning and secure-sharing functions used by
            workforce and consumer users.
        - id: l4
          label: Privileged access and secrets modules
          detail: >-
            KeeperPAM sessions, discovery, rotation and JIT workflows plus Secrets Manager, SDKs, CLI and REST
            automation surfaces for machine identities.
        - id: l5
          label: Deployment and infrastructure substrate
          detail: >-
            Keeper Gateway outbound connectors, optional self-hosted KCM, AWS regional hosting, AWS GovCloud, backup/HSM
            controls and upstream IdP/browser dependencies.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE009
      - CE015
      - CE021
      - CE033
      - CE036
