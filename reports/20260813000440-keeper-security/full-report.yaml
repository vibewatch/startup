      - number: '7.3'
        title: Financial/model risk, mitigations and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The biggest model risk is the gap between growth narrative and underwritten durability. Keeper now has a
              much better public scale story than it did even a year earlier: more than 95,000 organizations protected,
              850 new organizations per month, strong satisfaction metrics and a stated path toward US$1B ARR. But
              investors still lack the metrics that determine how resilient that growth is: NRR, GRR, logo churn, seat
              depth, top-customer concentration, public-sector ARR mix, CAC payback and current cash generation beyond
              company-claimed profitability. That missing data matters because several identified risks can transmit
              directly into valuation. Competitive pressure from native platform managers can compress low-end pricing.
              Higher-end competitors such as BeyondTrust and AWS Secrets Manager can erode attach rates or win
              control-heavy workloads. A security event or certification problem could slow public-sector growth and
              damage sales efficiency. Support strain or pricing backlash could reduce conversion or renewal quality.
              The good news is that Keeper also has visible mitigations: a differentiated zero-knowledge trust model,
              broad customer proof, regulated-market fit, review-backed usability and growing module breadth beyond pure
              vaulting. The core thesis-break triggers are therefore monitorable. If new-logo growth slows sharply, if
              PAM/Secrets attach stalls, if public review sentiment deteriorates, if a major security incident lands, or
              if management cannot evidence durable retention and diversified revenue during diligence, the bullish case
              weakens quickly. Risk here is not abstract; it is a set of identifiable transmission paths into customer
              growth, margin quality and exit multiple support.
