companyProfile:
  summary: >-
    Keeper Security is a private Chicago-based cybersecurity company co-founded in 2011 by Darren Guccione and Craig
    Lurey. What began as a password manager has expanded into a broader identity-security platform that now includes
    KeeperPAM, secrets management, connection management, remote browser isolation and public-sector offerings. Public
    evidence confirms meaningful regulated-market traction, including FedRAMP Certified and GovRAMP High posture, while
    July 2026 disclosures established a stronger financial profile with $225M ARR, profitability, debt-free status and a
    stated IPO-optional narrative. The open-source record is still incomplete on exact valuation and equity terms, so
    Keeper should be treated as a scaled late-stage private asset with real platform strength but still incomplete price
    transparency.
