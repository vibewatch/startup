      - number: '4.3'
        title: Cost structure, capital adequacy, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The most defensible inference about Keeper’s cost structure is what it is not. This is not a hardware,
              payments or inventory business. Its products are cloud software, client apps, identity integrations,
              secrets workflows and privileged-session controls, so the likely primary cost buckets are engineering,
              cloud infrastructure, security operations, compliance, customer success and go-to-market. Public
              identity-software comparables help bound the shape of those economics even if they do not prove Keeper’s
              own margins. Okta’s fiscal 2026 results show approximately 77% GAAP gross margin, sales and marketing
              expense equal to roughly 35% of revenue, R&D at roughly 22% of revenue, and free-cash-flow margin around
              30%. That is a useful benchmark for what scaled identity SaaS can look like: high gross margins, heavy but
              manageable sales investment, and strong cash generation once scale is reached. Keeper’s own July 2026 PR
              says the company combines profitability with a debt-free capital structure, which is directionally
              positive for capital adequacy. Insight’s 2020 US$60M growth investment and Summit Partners’ 2024 minority
              investment also suggest Keeper has not obviously needed distressed financing to reach its current stage.
              But none of that substitutes for current cash, burn or runway disclosure. The financial verdict is
              therefore favorable on revenue quality and likely margin shape, cautiously positive on capital adequacy
              direction, and still blocked on the most decision-critical private metrics. Put simply: Keeper now looks
              like a growthy, subscription-heavy identity platform with credible enterprise scale, but the public record
              is still too thin to underwrite efficiency or downside protection with confidence.
