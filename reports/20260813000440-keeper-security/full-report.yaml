  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Keeper’s revenue mechanism is much clearer than its audited results. Official pricing and product pages
              show a seat-based subscription business with layered monetization rather than a one-product consumer app.
              At the entry end, Keeper sells Business Starter for small teams; it then expands to Business and
              Enterprise tiers with broader administration, identity-provider integration, SCIM, RBAC and developer
              APIs. The company also sells or packages higher-value adjacencies: Secrets Manager is an add-on to
              business plans and included with KeeperPAM; KeeperPAM itself is sold through custom pricing; MSP packaging
              exposes a channel-oriented revenue surface; and a free Keeper Family Plan for every business user
              functions as an adoption and retention enhancer even if it is not itself a direct incremental ARR stream.
              The important financial reading is that Keeper is monetizing access control by account tier, governance
              depth and adjacent-module attach, not by transaction volume or services-heavy implementation. That
              generally improves revenue quality because seat subscriptions, enterprise governance features and module
              expansion are typically recurring and sticky. But public monetization clarity is still not the same as
              public monetization depth. The pages identify what Keeper can charge for; they do not disclose how much
              ARR comes from SMB password management versus enterprise contracts, public sector, MSP, secrets or PAM.
              They also do not expose realized ASP after discounting. So the business model is understandable, but
              revenue mix remains private.
