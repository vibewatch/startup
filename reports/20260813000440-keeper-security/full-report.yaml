      - number: '3.2'
        title: Peer profiles, capability trade-offs, and pricing posture
        blocks:
          - type: paragraph
            body: >-
              Among direct peers, 1Password is the strongest premium benchmark in disclosed business scale: its business
              page says more than 200,000 businesses trust the platform, and the company now positions around passwords,
              secrets, devices, apps outside SSO, AI discovery and broader access governance rather than only vaulting.
              Bitwarden attacks from the opposite direction with 80,000+ businesses, open-source transparency, cloud or
              self-host deployment, and quantified ease-of-setup and ROI claims. Dashlane is reframing itself from
              password manager to Omnix credential-security platform, pairing secure vaulting with credential-protection
              and risk-detection modules. LastPass remains a recognizable cross-platform zero-knowledge brand with SSO
              and MFA adjacency, but its own current site still spends meaningful real estate explaining post-2022
              remediation and security transformation, which signals persistent trust drag. Keeper’s own pitch combines
              zero-knowledge architecture, secure sharing, SCIM/SSO, passkeys, secrets, KeeperPAM, MSP support, AI-agent
              secret access and public-sector compliance. In adjacent enterprise buyers, CyberArk and Delinea now market
              dynamic authorization, AI-driven auditing, secure remote access, machine identities and
              zero-standing-privilege models that can subsume simpler vault point-solutions. Public pricing transparency
              is mixed: most fetched pages show per-user annual packaging or custom-sales motions, but public numeric
              comparability is weaker than category buyers might expect, especially once enterprise bundles, ELAs and
              custom quotes enter the picture.
