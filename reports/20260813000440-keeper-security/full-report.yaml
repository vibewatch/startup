  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Security incident / trust failure
        - Public disclosure, major CVE or certification incident
        - One material breach affecting core vault / PAM trust
        - Recut downside case; customer and valuation risk becomes first-order
      - - Growth durability
        - New-logo pace and module attach
        - Clear falloff from 850 orgs/month with weak PAM/Secrets attach
        - Reassess premium-growth multiple and IPO timing assumptions
      - - Retention / pricing quality
        - Renewal friction and review sentiment
        - Broadening complaints on price increases, add-ons or value mismatch
        - Pressure test gross retention and ASP assumptions
      - - Regulated-market execution
        - FedRAMP/GovRAMP scope or renewal slippage
        - Delayed or impaired public-sector authorization posture
        - Lower confidence in high-value government expansion
      - - Operational scaling
        - Support backlog, implementation times, defect escape rate
        - Sustained deterioration despite high release cadence
        - Increase execution discount and margin-risk assumptions
      - - Dependency shock
        - AWS/IdP/browser policy or outage event
        - Repeat availability or compatibility issue across critical surfaces
        - Increase platform-dependency discount and business-continuity scrutiny
