  claims:
  - id: CR001
    statement: Keeper’s downside is unusually trust-sensitive because the company sells identity, secrets, privileged access and government controls rather than a low-stakes utility product.
    type: inferred
    topic: trust-risk
    sourceRefs:
    - SR004
    - SR005
    - SR006
    - SR021
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR002
  - id: CR002
    statement: FedRAMP, GovRAMP, FIPS and NIST-aligned positioning increase the severity of any control failure because they are central to Keeper’s regulated-market pitch.
    type: inferred
    topic: regulatory-risk
    sourceRefs:
    - SR005
    - SR015
    - SR021
    - SR022
    - SR026
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR004
  - id: CR003
    statement: There is no first-order public evidence of current enforcement or active litigation dominating the risk case today.
    type: observed
    topic: legal-risk
    sourceRefs:
    - SR001
    - SR004
    - SR005
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR023
  - id: CR004
    statement: Keeper Connection Manager’s advisories page shows the remote-access surface has had historical vulnerabilities, including a high-severity SAML response validation issue.
    type: observed
    topic: security-risk
    sourceRefs:
    - SR010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR005
    statement: OpenCVE tracks additional Keeper-related client or adjacent-product issues, showing that residual edge-surface vulnerability risk remains even without evidence of a platform-wide catastrophe.
    type: observed
    topic: security-risk
    sourceRefs:
    - SR013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR006
    statement: Keeper’s zero-knowledge design meaningfully reduces provider-side plaintext exposure, but it does not eliminate endpoint, browser-extension or device-approval risk.
    type: inferred
    topic: security-risk
    sourceRefs:
    - SR004
    - SR009
    - SR013
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR007
    statement: The company’s trust posture is supported by concrete mitigations including published cryptographic detail, quarterly testing, Bugcrowd disclosure and region-isolated hosting.
    type: observed
    topic: mitigations
    sourceRefs:
    - SR004
    - SR009
    - SR020
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR020
  - id: CR008
    statement: Because Keeper positions itself as a unified control plane for privileged access and AI agents, a security incident would likely transmit quickly into procurement friction, customer trust and valuation.
    type: inferred
    topic: trust-risk
    sourceRefs:
    - SR006
    - SR014
    - SR024
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR024
  - id: CR009
    statement: Self-hosted KCM deployments create operational risk because customers must manage Docker, SSL, database posture and upgrades in environments Keeper does not fully control.
    type: inferred
    topic: operational-risk
    sourceRefs:
    - SR009
    - SR025
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR010
    statement: The public materials and release cadence indicate Keeper is now operating a wider and more complex product estate than a classic password manager.
    type: observed
    topic: execution-risk
    sourceRefs:
    - SR006
    - SR007
    - SR011
    - SR012
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR008
    - QR016
  - id: CR011
    statement: Review sources repeatedly surface pricing complexity, add-on fatigue, reporting gaps and autofill inconsistency as practical risks to customer satisfaction.
    type: observed
    topic: customer-friction
    sourceRefs:
    - SR017
    - SR018
    - SR019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR013
    - QR014
  - id: CR012
    statement: Review complaints appear operationally irritating rather than existential, but they are precisely the kind of friction that can accumulate in renewal or procurement cycles.
    type: inferred
    topic: customer-friction
    sourceRefs:
    - SR016
    - SR017
    - SR018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR013
    - QR014
  - id: CR013
    statement: IBM and Verizon both underscore that stolen credentials and identity failures remain economically severe, which increases the downside cost of any Keeper trust event.
    type: inferred
    topic: market-risk
    sourceRefs:
    - SR023
    - SR024
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR019
  - id: CR014
    statement: Keeper’s risk is broader than a simple vault product because it now spans PAM, secrets, remote access, AI monitoring and government-control surfaces.
    type: observed
    topic: execution-risk
    sourceRefs:
    - SR005
    - SR006
    - SR007
    - SR012
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR016
  - id: CR015
    statement: Rapid shipping across many surfaces raises the chance of quality regressions, support strain or coordination failures even when release velocity is a strength.
    type: inferred
    topic: execution-risk
    sourceRefs:
    - SR011
    - SR016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
    - QR024
  - id: CR016
    statement: Keeper has material platform dependence on AWS and AWS GovCloud for core hosting and regulated deployment.
    type: observed
    topic: dependency-risk
    sourceRefs:
    - SR004
    - SR005
    - SR020
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR009
    - QR010
  - id: CR017
    statement: Enterprise IdPs and provisioning systems are structurally important dependencies because Keeper’s business value often relies on SSO, SCIM and device-approval workflows.
