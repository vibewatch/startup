  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: incident-and-remediation-history
    missingEvidence: Current incident counts, severity distribution, patch latency, pentest results and remediation SLAs across core vault, PAM and KCM.
    whyItMatters: Public mitigations are credible, but residual trust risk cannot be sized without internal operating data.
    diligencePath: Request the last 24 months of incident metrics, executive pentest summaries and remediation-time reporting by severity.
    relatedQuestionRefs:
    - QR003
    - QR020
    - QR021
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, churn, seat-utilization, top-customer concentration and top-partner contribution.
    whyItMatters: These metrics determine whether the risk profile deserves premium valuation support.
    diligencePath: Request cohort retention by segment, top-20 concentration, partner-source revenue and module attach by customer size.
    relatedQuestionRefs:
    - QR017
    - QR022
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: support-and-execution-capacity
    missingEvidence: Support staffing ratios, implementation times, backlog levels, defect escape rates and release rollback history.
    whyItMatters: Fast growth plus broad product scope can erode experience before public reviews visibly deteriorate.
    diligencePath: Request CS/support dashboards, implementation-cycle data and software-quality KPIs for 2025-2026.
