company:
  name: Keeper Security
chapter:
  number: 3
  title: Competitors
  summary: Keeper competes in a layered identity-security field rather than a simple password-manager list. Direct workforce-vault peers are 1Password, Bitwarden, Dashlane, and LastPass; higher-complexity enterprise deals also pull in CyberArk, Delinea, BeyondTrust, HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, and native platform managers from Google and Apple. Keeper’s strongest wedge is the control-heavy middle where buyers want zero-knowledge vaulting plus passkeys, secrets, privileged access and public-sector-grade compliance in one stack. Its biggest threats are 1Password’s disclosed scale and broader access narrative, Bitwarden’s transparent/open-source value story, and the reality that native or cloud-bundled tools increasingly make simple credential storage free.
sections:
- id: landscape-substitutes-and-competitor-classes
  title: Landscape, substitutes, and competitor classes
  body: 'Keeper’s competitive set is best understood as four overlapping classes. First are direct workforce-password and credential-control peers: 1Password, Bitwarden, Dashlane and LastPass, all of which market secure vaulting, sharing, admin controls and passwordless or passkey support to business buyers. Second are adjacent privileged-access and identity-security suites such as CyberArk, Delinea and BeyondTrust, which approach the same buyer from least-privilege, session-control and zero-standing-privilege workflows rather than from a classic password-vault starting point. Third are secrets-centric tools and cloud-native substitutes such as HashiCorp Vault, AWS Secrets Manager and Azure Key Vault, which solve the machine-identity side of the problem and can absorb budget that might otherwise flow to a unified platform. Fourth are the zero-price built-ins and the status quo: Google Password Manager, Apple Passwords, and unmanaged habits like browser autofill, hard-coded secrets and ad
    hoc credential sharing. This matters because Keeper is squeezed from both ends. Google and Apple compress the low-end willingness to pay, while CyberArk or Delinea can pull larger enterprises toward broader identity-security suites. Keeper’s addressable win zone therefore is not “everyone with passwords” but the slice of buyers who value unified control across passwords, passkeys, secrets, privileged access and compliance enough to prefer a specialist platform over piecemeal or bundled substitutes.'
