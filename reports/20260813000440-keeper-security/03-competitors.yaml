- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Price / unit / contract model
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Keeper
    - Per-user annual packaging plus custom quote paths for higher-end modules
    - Business, enterprise, family-benefit, secrets, PAM and MSP adjacencies on the pricing surface
    - Exact numeric list prices were not cleanly recoverable from fetched text; custom quote applies for KeeperPAM
    - Cross-sell breadth is attractive, but realized pricing power is opaque
  - - 1Password
    - Pricing page fetched successfully but business-specific public numeric pricing was not clearly exposed in extracted text
    - Business positioning, strong support and broader access-platform scope
    - Opaque business price in current fetched extraction
    - Signals premium positioning but makes direct list-price comparison harder
  - - Bitwarden
    - Annual subscription model with Teams and Enterprise packages
    - Vaulting, sharing, business support, health reporting, optional secrets expansion
    - Exact numeric values were not present in current extracted pricing text
    - Value story remains strong even when public numeric list-price extraction is imperfect
  - - Dashlane
    - Per-user/month billed annually plus custom enterprise packaging
    - Password management, credential protection, SSO/SCIM and account management
    - Public pricing page emphasizes packaging structure more than clean numeric comparison
    - Suggests sales-led enterprise motion rather than pure self-serve comparison
  - - LastPass
    - Paid plans layered above a limited free tier
    - Zero-knowledge vaulting and broader password-manager functionality
    - Business pricing pages fetched as 404 at this run date
    - Current public packaging clarity appears weaker than peers
  - - CyberArk / Delinea
    - Enterprise sales motion
    - Broader PAM, dynamic authorization, sessions, secrets and AI-driven auditing
    - Public pages emphasize capability rather than transparent list pricing
    - These vendors compete as broader suites, not as low-friction self-serve tools
  - - HashiCorp Vault
    - Product-led docs plus enterprise deployment paths
    - Secrets engines, dynamic credentials, encryption and API/CLI workflows
    - Public pricing not central on fetched docs surfaces
    - Engineering-led secret buyers may compare architecture before price
  - - Native / bundled substitutes
    - Zero incremental or pre-bundled
    - Password/passkey storage or cloud secrets inside existing ecosystems
    - Cost is hidden inside platform or cloud relationship rather than separate SKU
    - Creates severe low-end and single-cloud substitute pressure
