- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / current signal
  - Diligence ask
  rows:
  - - Compliance-led differentiation
    - Broader vendors replicate enough controls for commercial buyers that only public-sector and regulated accounts remain clearly differentiated
    - High
    - Keeper foregrounds FedRAMP/GovRAMP and zero-knowledge architecture
    - Quantify public-sector ARR, renewal rates and win rates versus 1Password and CyberArk
  - - Unified human + machine identity story
    - AWS, Azure and HashiCorp can absorb the machine-secret slice while Apple/Google absorb simple user storage
    - High
    - Keeper pricing and product pages show secrets, AI-agent access and PAM in one platform
    - Measure attach rate of secrets and PAM in new logo wins
  - - Operational simplicity
    - Bitwarden and Dashlane both market fast deployment or admin-efficiency benefits
    - Medium
    - Keeper business page says deployment happens in minutes with 24x7 support
    - Validate implementation time and admin effort with recent customer references
  - - Trust and security architecture
    - Any major incident could rapidly reshape vendor selection, as LastPass shows
    - High
    - Keeper emphasizes zero-knowledge, audits and compliance posture
    - Request incident history, insurance impacts and large-account security questionnaires
  - - Pricing power
    - Opaque custom contracts may erase list-price or bundle advantages
    - Medium
    - Keeper can package family plans, MSP, secrets and PAM to expand value
    - Collect competitive quotes and discount bands by segment before underwriting pricing durability
  - - Suite consolidation defense
    - 1Password, CyberArk and Delinea all broaden the identity-control story beyond vaulting
    - High
    - Keeper already spans passkeys, secrets and privileged access
    - Assess whether buyers see Keeper as a true platform shortlist or as a vault plus add-ons
  notes: Severity reflects likely strategic pressure over the next 12-36 months rather than certainty of share loss.
