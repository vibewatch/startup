  - Limitation
  rows:
  - - Keeper Security
    - Direct enterprise credential-security platform
    - Thousands of organizations; millions of users; public-sector compliance posture emphasized
    - SMB, enterprise, public sector, MSPs
    - Zero-knowledge vaulting plus passkeys, secrets, KeeperPAM and compliance depth in one platform
    - Private company with limited public pricing realization and win/loss disclosure
  - - 1Password
    - Direct premium access platform
    - 200,000+ businesses trust 1Password
    - SMB to enterprise
    - Broader access story spanning passwords, secrets, apps, devices and AI/SaaS discovery
    - Public business pricing visibility was weak in fetched pages; less public-sector compliance emphasis than Keeper
  - - Bitwarden
    - Direct value/transparency peer
    - 80,000+ businesses worldwide
    - SMB, enterprise, regulated buyers, developers
    - Open-source transparency, self-host option, rapid deployment and ROI claims
    - Public-sector and compliance posture less foregrounded than Keeper’s
  - - Dashlane
    - Direct credential-security peer
    - Business scale not cleanly disclosed on fetched pages
    - Business and enterprise
    - Omnix repositioning, credential protection, admin controls, SSO/SCIM and least-privilege sharing
    - Pricing detail is largely custom/opaque in fetched pages and direct public scale signals are thinner
  - - LastPass
    - Direct incumbent password-manager peer
    - Recognized consumer and business brand; scale claims on current fetched pages are qualitative
    - Individuals, SMB, business
    - Cross-platform zero-knowledge vault plus SSO/MFA adjacency and broad install familiarity
    - Trust posture still shaped by disclosed 2022 incident and ongoing remediation messaging
  - - CyberArk
    - Adjacent identity-security / PAM suite
    - Large enterprise identity-security brand
    - Enterprise, cloud and security buyers
    - Zero-standing-privilege, every-identity control, agentic identity and secure remote access
    - Broader platform can be heavier than a pure workforce-vault deployment
  - - Delinea
    - Adjacent PAM / identity-security suite
    - Established enterprise PAM platform with Secret Server and remote access modules
    - Enterprise and regulated buyers
    - Dynamic authorization, AI-driven auditing, session monitoring, password rotation and remote privileged access
    - May be over-scoped for buyers who only need a workforce vault or lightweight sharing
  - - BeyondTrust
    - Adjacent endpoint / privilege management
    - Mature endpoint and privilege-management footprint
    - Enterprise security and endpoint buyers
    - Just-in-time / just-enough privilege with endpoint coverage and compliance framing
    - Less centered on consumer/workforce password UX than direct vault peers
  - - HashiCorp Vault
    - Adjacent developer secrets platform
    - Developer and platform-engineering standard for secret engines and dynamic credentials
    - Platform engineering, DevSecOps, multi-cloud teams
    - Strong API/CLI, dynamic credentials and encryption-as-a-service motion
    - Not a natural workforce password-sharing product
  - - Native and bundled substitutes
    - Substitute / status quo
    - Preinstalled at ecosystem scale or bundled with existing cloud spend
    - Consumers, lightly managed teams, single-cloud engineering teams
    - Zero incremental software purchase, familiarity, tight platform integration
    - Weak org-wide governance for mixed human-plus-machine identity control
  notes: 'The table covers the primary ways a buyer can solve the same credential-control job: direct peers, broader PAM suites, developer-secret platforms and bundled substitutes.'
