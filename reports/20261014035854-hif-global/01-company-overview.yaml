      - CO013
callouts:
  - calloutType: strength
    title: Pioneering Operational Proof and World-Class Strategic Backing
    body: HIF Global possesses an uncommon first-mover advantage as operator of Haru Oni, the world's first operational integrated e-fuels demonstration plant. Its cap table unites industrial power developers (AME), premium automotive manufacturers (Porsche), specialized energy infrastructure financiers (EIG), and sovereign-backed Asian energy importers (Idemitsu, JOGMEC, MOL), establishing critical strategic validation across technology, capital, and future offtake.
    claimRefs:
      - CO002
      - CO005
      - CO007
  - calloutType: risk
    title: Capital Intensity and Power-Price Vulnerability at Commercial Scale
    body: Transitioning from demonstration-scale output (Haru Oni) to commercial megaprojects ($5.3B Paysandú, multi-billion Matagorda) exposes HIF Global to severe input-cost risks. Power costs represent approximately 70% of e-fuels operating expenditures; failure to secure long-term power pricing at or below $40/MWh threatens project unit economics, final investment decisions, and capital deployment.
    claimRefs:
      - CO011
      - CO014
