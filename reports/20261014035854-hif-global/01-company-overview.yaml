  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: corporate-financials
      missingEvidence: Audited corporate financial statements disclosing annual revenue run-rate, gross margin, EBITDA, net loss, cash burn, and cash balance.
      whyItMatters: As a privately held developer, HIF Global does not publish financial statements, preventing quantitative assessment of operating cash runway and stand-alone commercial viability.
      diligencePath: Obtain confidential financial disclosure packet or audited accounts through direct investor diligence under non-disclosure agreement.
      relatedQuestionRefs:
        - QO009
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: valuation-and-capital-structure
      missingEvidence: Current corporate post-money valuation, detailed cap table after the 2024 capital raise, share class seniority, and liquidation preference terms.
      whyItMatters: Without valuation multiples, dilution percentages from Japanese investors, or debt covenants, investors cannot determine effective enterprise value or downside protection.
      diligencePath: Review shareholder agreements, term sheets, and capitalization tables from the April 2022 and 2024 financing rounds with corporate management.
      relatedQuestionRefs:
        - QO010
      relatedTableRefs:
        - TO003
