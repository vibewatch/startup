callouts:
- calloutType: risk
  title: Power Pricing and Subsidy Dependency Threaten Parity
  body: Because clean electricity accounts for roughly seventy percent of synthetic fuel operating costs, regional tariff
    negotiations and policy frameworks dictate project bankability. Disagreements over power pricing in Uruguay and exposure
    to United States Inflation Reduction Act subsidy rules demonstrate that favorable renewable resource endowments cannot
    compensate for uncompetitive utility contracts or shifting policy support.
  claimRefs:
  - CP009
  - CP011
  - CP012
- calloutType: insight
  title: Commercial First-Mover Advantage vs. FOAK Capital Intensity
  body: HIF Global established crucial early credibility through the Haru Oni pilot, but peer developments like European Energy
    and Mitsui's commercial facility in Denmark indicate that the industry is rapidly transitioning from demonstration pilots
    to multi-billion-dollar commercial execution where first-of-a-kind execution discipline will determine survivor outcomes.
  claimRefs:
  - CP002
  - CP005
  - CP015
