  - - Conventional Marine Bunkers (MGO/VLSFO)
    - Status Quo Fossil Incumbent
    - Global multi-hundred-million-tonne mature bunkering infrastructure
    - Global commercial maritime shipping fleet
    - Lowest current cash cost per energy unit and ubiquitous global port availability
    - Zero greenhouse gas reduction; facing severe regulatory penalties under EU ETS and FuelEU
  - - Biogenic Bio-Methanol Developers
    - Renewable Biofuel Substitute
    - 286 global low-carbon and renewable projects in Methanol Institute pipeline
    - Dual-fuel container shipping & road transport
    - Lower near-term capex per tonne utilizing gasified forestry or agricultural waste
    - Strict regional biogenic CO2 feedstock supply limits and land competition
  - - Direct Battery Electric Propulsion
    - Disruptive Technology Substitute
    - Rapid utility-scale battery pack cost declines and automotive EV expansion
    - Short-sea ferries, inland waterways, and passenger road transport
    - High round-trip electrical efficiency (>80%) with direct grid power
    - Gravimetric and volumetric energy density constraints prevent deep-sea or aviation deployment
  notes: Comparative data compiled from Methanol Institute global project registry (286 projects), Enki AI commercial project
    disclosures, and HIF Global technical filings. Commercial terms remain confidential.
