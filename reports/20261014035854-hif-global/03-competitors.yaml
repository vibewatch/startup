- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Alternative / Fuel Pathway
  - Pricing & Contract Structure
  - Included Capabilities & Compliance
  - Contract Discounts & Unknowns
  - Strategic Implications for Buyers
  rows:
  - - HIF Global e-Methanol
    - Long-term take-or-pay Heads of Agreement (HOA) linked to green power production costs
    - ISCC EU RFNBO certified renewable fuels with origin tracking and carbon accounting
    - Realized contract pricing formula and volume default penalties undisclosed
    - High forward compliance certainty for EU maritime regulations, offset by green premium risk
  - - European Energy / Mitsui e-Methanol
    - Fixed and indexed bilateral offtake contracts tied to Danish renewable power benchmarks
    - RFNBO-compliant green bunker fuel ready for European port bunkering
    - Long-term escalation indices and sovereign power tariff adjustments undisclosed
    - Secures first-mover commercial volumes in Northern Europe but subject to high power costs
  - - Biogenic Bio-Methanol
    - Indexed spot and term supply contracts tied to Rotterdam and US Gulf conventional indices
    - ISCC Plus certified low-carbon marine fuel suitable for dual-fuel maritime vessels
    - Feedstock price volatility linked to agricultural commodities and seasonal harvest yields
    - Lower near-term green premium than e-fuels, but vulnerable to regional biomass supply crunches
  - - Conventional Fossil Marine Fuel (MGO/VLSFO)
    - Spot commodity market pricing based on global crude oil benchmarks (Brent/WTI)
    - Standard ISO 8217 marine bunker specifications without decarbonization attributes
    - Subject to variable maritime emissions surcharges under EU ETS and FuelEU Maritime
    - Lowest upfront fuel purchase cost but mounting regulatory financial liability over time
  notes: Pricing structures derived from reported commercial offtake disclosures (Mabanaft, eFuel One) and regional electricity
    cost analyses. Exact formula margins remain private.
