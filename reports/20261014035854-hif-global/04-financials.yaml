      - - e-SAF (Aviation)
        - Methanol-to-jet supply contracts with airline off-takers
        - USD per gallon / metric ton
        - Development stage (Airbus partnership, technology licensing with Honeywell/JM)
        - Speculative (pre-construction, dependent on ASTM certification)
        - Review off-take LOIs and airline indexation formulas against fossil jet fuel
      - - Carbon Recycling & Attribute Credits
        - Environmental attribute and RFNBO compliance premium trading
        - USD per ton CO2e / credit
        - Regulatory certification achieved (ISCC Plus, EU RFNBO)
        - Uncertain (highly sensitive to EU/US compliance credit pricing volatility)
        - Audit eligibility of biogenic vs DAC CO2 credits under revised RED II/III rules
