callouts:
  - calloutType: risk
    title: Power Tariff Sensitivity and Commercial Underwriting Roadblock
    body: Electricity constitutes roughly 70 percent of variable operating expenditure for HIF Global synthetic fuels facilities. Disagreements over power pricing—such as the impasse in Uruguay between HIF $40/MWh target and state utility UTE—demonstrate that commercial viability hinges entirely on securing long-term sub-$40/MWh tariffs and substantial capital subsidies before facilities can achieve positive operating margins.
    claimRefs:
      - CI005
      - CI006
      - CI015
