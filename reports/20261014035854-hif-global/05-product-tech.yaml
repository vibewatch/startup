company:
  name: HIF Global
chapter:
  number: 5
  title: Product & Technology
  summary: HIF Global has established operational proof of concept for integrated synthetic fuel synthesis at its Haru Oni demonstration facility in Chile, but scaling to multi-billion-dollar commercial plants faces critical engineering, modular constructability, and electricity input tariff hurdles.
sections:
  - id: commercial-product-portfolio
    title: Commercial Product Portfolio & Customer Specifications
    body: HIF Global develops synthetic electro-fuels designed to substitute conventional refined petroleum products across maritime transportation, commercial aviation, and passenger road transport without requiring modifications to existing internal combustion engines or pipeline distribution infrastructure. The company's primary commercial product is e-methanol, a chemical intermediate and maritime bunker fuel synthesized by combining green hydrogen with captured carbon dioxide. For maritime logistics operators facing tightening greenhouse gas emissions standards, e-methanol serves as a direct low-carbon alternative compatible with current two-stroke dual-fuel marine engines. In addition to primary methanol synthesis, HIF Global has proven downstream upgrading into drop-in e-gasoline at its operational Haru Oni pilot facility in southern Chile, delivering synthetic fuel to lighthouse partners including Porsche and Shell. For the aviation sector, HIF is collaborating with Honeywell UOP and Johnson Matthey to develop a commercial methanol-to-jet synthesis route, positioning e-SAF as a drop-in replacement for standard Jet A-1 kerosene.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    tableRefs:
      - TE001
      - TE002
  - id: operating-architecture-synthesis
    title: Operating Architecture & Chemical Synthesis Mechanism
    body: HIF Global's technical operating model is anchored on an integrated Power-to-X architecture that pairs dedicated renewable generation assets with multi-stage chemical synthesis plants. At the front end of the process, high-capacity onshore wind turbines and solar photovoltaic installations generate renewable electricity to power proton exchange membrane electrolysers, which dissociate demineralized water into green hydrogen and oxygen. In parallel, carbon dioxide is acquired through direct air capture demonstration systems or sourced from sustainable biogenic waste streams and industrial point sources. The pressurized green hydrogen and purified carbon dioxide are subsequently routed into a catalytic synthesis loop where high-temperature, high-pressure reaction beds convert the gaseous inputs into crude liquid e-methanol. For gasoline applications, this e-methanol is routed through a secondary catalytic reactor utilizing ExxonMobil's proprietary methanol-to-gasoline process, which converts methanol into heavy gasoline fractions, liquefied petroleum gas, and water. Managing process stability under highly variable wind capacity factors constitutes the central operational engineering challenge.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
    figureRefs:
      - FE001
    tableRefs:
      - TE003
  - id: deployment-maturity-scaling
    title: Deployment Maturity, Scaling Roadmap & Utility Dependencies
    body: 'The deployment trajectory of HIF Global spans an operational demonstration phase at Haru Oni in Punta Arenas, Chile, progressing toward multi-train industrial-scale facilities across Latin America, the United States, and Australia. Haru Oni has been continuously operational since December 2022, functioning as a real-world testing ground for technical integration, equipment degradation, and fuels certification. To bridge the gap to industrial commercialization, HIF Global contracted Techint E&C in May 2024 to execute comprehensive conceptual and basic engineering for the Cabo Negro project in Chile, targeting annual capacity of up to 173,600 tonnes of e-methanol and 70,000 tonnes of e-gasoline. Internationally, HIF submitted its Prior Environmental Authorization application in March 2026 for the $5.3 billion Paysandú project in Uruguay, designed for 876,000 tonnes of e-methanol across four production trains. However, commercial execution remains heavily constrained by electricity procurement economics: power represents roughly seventy percent of synthetic fuel operational running costs, and prolonged grid tariff negotiations with state utilities represent a major hurdle to final investment decisions.'
    claimRefs:
      - CE001
      - CE002
      - CE009
      - CE010
      - CE013
  - id: certifications-quality-governance
    title: Quality Standards, Regulatory Compliance & Technical Gaps
    body: Commercial offtake of synthetic electro-fuels depends fundamentally on rigorous compliance with international sustainability certifications and emissions tracking frameworks. Fuels produced at HIF Global's Haru Oni facility are certified under the International Sustainability and Carbon Certification Plus (ISCC Plus) scheme, supported by more than one hundred routine laboratory quality control analyses to confirm fuel purity and octane ratings. For European offtake markets governed by the Renewable Energy Directive, synthetic fuels must qualify as Renewable Fuels of Non-Biological Origin (RFNBOs), a standard officially recognized by the European Commission under ISCC EU in December 2024. From an engineering diligence standpoint, HIF Global operates as a heavy industrial energy and chemical project developer rather than a software platform. Consequently, traditional software developer metrics such as GitHub repositories, open-source community traction, and developer APIs do not exist for the business. Diligence must instead focus on physical plant availability, electrolyser stack lifetime warranties, and executed EPC contracts.
    claimRefs:
      - CE011
      - CE012
      - CE014
