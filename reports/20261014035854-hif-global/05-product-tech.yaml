    title: Product Module and Commercial Asset Matrix
    columns:
      - Product Line / Asset
      - Primary Target User
      - Operational Maturity
      - Core Technical Differentiation
      - Diligence Knowledge Gap
    rows:
      - - HIF Haru Oni Pilot (Chile)
        - Porsche lighthouse fleets and performance automotive testing
        - Operational since December 2022 producing ~130,000 L/yr e-gasoline
        - Direct air capture integration with sub-MW PEM electrolysis and MtG synthesis
        - Long-term membrane degradation rates under variable Patagonian wind profiles
      - - HIF Cabo Negro Facility (Chile)
        - Maritime shipping operators and regional automotive fuel blenders
        - Advanced engineering under contract with Techint E&C
        - Scaled capacity to 173,600 t/yr e-methanol and 70,000 t/yr e-gasoline with modular design
        - Off-grid renewable integration buffering and port logistics constraints
      - - HIF Paysandú Facility (Uruguay)
        - European and Asian maritime shipping and chemical consumers
        - Prior Environmental Authorization submitted March 2026
        - Four production trains totaling 876,000 t/yr e-methanol utilizing local biogenic CO2
        - Unresolved $40/MWh state utility power tariff negotiation and final PPA execution
      - - Commercial e-SAF Line (Global)
        - Commercial aviation carriers seeking drop-in jet fuel compliance
        - Process development and partner collaboration phase
        - Methanol-to-jet catalytic upgrading pathway with Honeywell UOP and Johnson Matthey
        - Certified commercial yields, catalyst life cycles, and ASTM D7566 annex approval timing
    notes: Asset statuses and capacities compiled from official HIF Global disclosures, Techint E&C engineering contracts, and regulatory filings as of 2026.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
  - id: TE002
    title: Customer Workflow and Substitution Use Cases
    columns:
      - User Job
      - Conventional Workflow
      - HIF E-Fuel Solution
      - Measurable Substitution Benefit
      - Current Limitation
    rows:
      - - Decarbonizing maritime propulsion
        - Bunkering heavy fuel oil or fossil marine gas oil in two-stroke engines
        - Drop-in or dual-fuel bunkering of certified green e-methanol
        - Substantial lifecycle GHG reduction without modifying modern methanol ship engines
        - Production volume scarcity and price premium above conventional bunker fuel
      - - Decarbonizing high-performance road vehicles
        - Refueling with fossil petroleum gasoline at standard retail pumps
        - Direct fueling with synthetic e-gasoline chemically identical to unleaded fuel
        - Near-zero net CO2 emissions with identical energy density and zero engine alterations
        - High cost per liter from demonstration plant limits use to lighthouse events
      - - Compliance with EU RFNBO transport mandates
        - Purchasing conventional biofuel blending credits or paying non-compliance penalties
        - Importing ISCC EU certified e-fuels meeting strict additionality and emissions criteria
        - Full regulatory qualification under EU Renewable Energy Directive (RED II / RED III)
        - Complex audit documentation required for biogenic carbon and renewable power tracking
      - - Aviation fleet decarbonization
        - Refueling commercial aircraft with fossil Jet A-1 kerosene
        - Blending synthetic e-SAF produced via methanol-to-jet catalytic upgrading
        - Drop-in compatibility with legacy airport fueling pipelines and turbofan engines
        - Commercial-scale MtJ refining facilities have not yet broken ground
    notes: Substitution use cases reflect drop-in chemical compatibility characteristics demonstrated in real-world testing by Porsche, Shell, and Antarctica21.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE012
  - id: TE003
    title: Technology and Operating Architecture Dependencies
    columns:
      - Process Layer / Component
      - Technical Function
      - Key Equipment / Licensing Dependency
      - Critical Operational Risk
    rows:
      - - Renewable Power Generation
        - Supplies zero-carbon electrical energy to power electrolysis and auxiliary equipment
        - On-site wind turbines and dedicated solar PV parks (e.g., Faro del Sur, Lucía, Elena)
        - Intermittent generation requires process units to rapidly throttle without catalyst damage
      - - Water Demineralization & Electrolysis
        - Splits purified water into hydrogen and oxygen without fossil feedstock
        - PEM electrolyser stacks supplied by Siemens Energy and commercial suppliers
        - High capital cost per megawatt and sensitivity of membrane life to rapid power cycling
      - - Carbon Capture & Sourcing
        - Captures atmospheric or biogenic CO2 for chemical synthesis feedstock
        - Direct Air Capture units (Global Thermostat pilot) and biogenic / point-source scrubbers
        - High energy penalty per tonne of CO2 captured and limited commercial DAC operational scale
      - - Catalytic Methanol & MtG Synthesis
        - Converts pressurized syngas into liquid e-methanol and drop-in e-gasoline
        - ExxonMobil MtG technology licensing and specialized thermo-catalytic synthesis reactors
        - Thermal management of exothermic reactions and catalyst poisoning from impure feed gases
    notes: Architecture components and vendor relationships reflect pilot integration at Haru Oni and engineering packages developed for Cabo Negro.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
figures:
  - id: FE001
    title: Product Architecture and Chemical Synthesis Stack
    type: stack
    summary: Six-layer integrated Power-to-X operating architecture transforming renewable wind electricity and captured carbon dioxide into drop-in synthetic fuels.
    claimRefs:
      - CE007
      - CE008
      - CE011
    data:
      layers:
        - label: Renewable Power Supply & Interconnection
          detail: Onshore wind turbines and solar PV parks with power management systems adapted for variable generation.
        - label: Water Treatment & Green Hydrogen Electrolysis
          detail: Demineralized water input feeding PEM electrolysers to produce high-purity green hydrogen.
        - label: Carbon Dioxide Sourcing & Pre-Treatment
          detail: Direct air capture (DAC) pilot units and biogenic / industrial point-source carbon capture systems.
        - label: Thermo-Catalytic Methanol Synthesis
          detail: Catalytic conversion reactor combining pressurized H2 and CO2 into crude liquid e-methanol.
        - label: Downstream Synthetic Fuel Upgrading
          detail: ExxonMobil licensed methanol-to-gasoline (MtG) and Honeywell/JM methanol-to-jet (MtJ) synthesis reactors.
        - label: Product Storage, Quality Assurance & Logistics
          detail: ISCC Plus certified tank farm storage, automated fuel testing, and marine bunkering terminal export.
callouts:
  - calloutType: insight
    title: Operational Demonstration Versus Industrial Scale
    body: While the Haru Oni pilot demonstrates the functional viability of integrated wind-to-gasoline synthesis at 130,000 liters annually, scaling to commercial facilities such as Cabo Negro (173,600 tonnes e-methanol) and Paysandú (876,000 tonnes) represents an exponential step in engineering complexity, utility interconnection, and capital expenditure.
    claimRefs:
      - CE001
      - CE002
      - CE006
  - calloutType: risk
    title: Feedstock Energy Intensity and Grid Tariff Vulnerability
    body: Synthetic fuel synthesis is intrinsically energy-intensive, with electrical power comprising approximately 70% of operational expenditure at commercial facilities. Unresolved tariff disputes with national grid operators and variable wind capacity factors directly dictate synthesis economics.
    claimRefs:
      - CE009
      - CE010
