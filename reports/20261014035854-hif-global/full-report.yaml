      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Electricity Tariffs as Make-or-Break Project Gate
            body: >-
              Electricity costs represent approximately seventy percent of operating expenditure for e-fuel synthesis
              facilities. In Uruguay, negotiations with state utility UTE over power tariffs have stalled the $5.4
              billion Paysandú project, underscoring that without sub-$40/MWh power, commercial viability collapses.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Corporate Sponsorship, and Technical Moats
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for HIF Global centers on its verified first-mover operational advantage in
              commercial e-fuels and its elite syndicate of global industrial sponsors. Having commissioned the world's
              first integrated demonstration facility at Haru Oni in Magallanes, Chile, HIF Global established
              operational proof that electrolytic green hydrogen and recycled carbon dioxide can produce drop-in
              synthetic gasoline, e-methanol, and synthetic liquefied gas at field scale. This demonstration platform
              has operated for over three years, delivering certified e-gasoline volumes to Porsche AG and Shell for
              high-visibility motorsport and legacy fleet demonstrations, as well as marine logistics partners. Unlike
              pure-play technology licensors that bear technology scale-up risk in isolation, HIF Global operates as a
              vertically integrated project developer backed by equity sponsorship from EIG Partners and strategic
              capital from international energy and mobility leaders. Crucially, a consortium of major Japanese
              corporations—including shipping giant Mitsui O.S.K. Lines (MOL), refiner Idemitsu Kosan, and government
              agency JOGMEC—has committed approximately $200 million in development funding. These partners provide
              strategic offtake validation, supply-chain co-development, and maritime bunkering distribution channels
              that position HIF Global as the preeminent synthetic fuel developer globally.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV014
      - number: '8.2'
        title: Financing Architecture, Public Comparables, and Valuation Opacity
        blocks:
          - type: paragraph
            body: >-
              Despite world-class strategic sponsorship, rigorous underwriting of HIF Global is constrained by severe
              valuation opacity and the sheer capital intensity of its commercial pipeline. While HIF has announced
              landmark megaprojects—most notably the $5.3 billion to $5.4 billion Paysandú e-fuels facility in Uruguay
              and the multi-billion-dollar Matagorda plant in Texas—neither HIF Global nor its lead investors have
              disclosed post-money equity valuations, priced round share structures, liquidation preferences, or
              capitalization table breakdowns from recent financing tranches. When benchmarking against public
              clean-technology and carbon transformation peers, valuation discipline becomes critical. LanzaTech Global
              (LNZA), which went public via SPAC to commercialize biological carbon transformation, trades at a public
              enterprise value of approximately $61.2 million on trailing twelve-month revenue of $58.3 million,
              reflecting an EV-to-Revenue multiple of approximately 1.05x and substantial public market multiple
              compression. While HIF Global's infrastructure-heavy project development model differs from LanzaTech's
              licensing approach, the public multiple re-rating across carbon-tech demonstrates that infrastructure
              equity investors cannot underwrite speculative pre-money software or biotech multiples. Public evidence
              does not substantiate a priced private equity round, obliging outside investors to adopt a research-more
              stance.
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV014
      - number: '8.3'
        title: 'Scenario Underwriting: Bull, Base, and Bear Return Pathways'
        blocks:
          - type: paragraph
            body: >-
              Underwriting risk-adjusted returns for HIF Global requires balancing structural macroeconomic
              decarbonization tailwinds against binary project-level execution risks. In synthetic fuel synthesis,
              renewable electricity represents approximately 70% of total running costs, meaning small variations in
              input power pricing determine whether commercial production is economically viable or value-destroying. In
              Uruguay, HIF Global's $5.4 billion Paysandú development reached an impasse with the state power utility
              because HIF required power at $40/MWh to ensure project viability against regional competitors like
              Paraguay ($25/MWh), Chile ($32/MWh), and Brazil ($36/MWh). In our Bull Case (20% probability), HIF secures
              power below $40/MWh, reaches final investment decision (FID) on Paysandú and Matagorda, and captures
              premium compliance pricing from maritime dual-fuel fleets, unlocking a multi-billion-dollar enterprise
              value. In our Base Case (55% probability), facility construction progresses with 18-to-36-month timeline
              slippage, power tariffs settle near utility expectations, and equity returns compress to single-digit
              infrastructure yields. In our Bear Case (25% probability), power tariff disputes abort primary project
              development, European and Japanese compliance subsidies fail to bridge the fossil fuel cost gap, and high
              pre-FID development burn forces dilutive down-rounds.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit Realization Pathways, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Exit realization for HIF Global will not follow a conventional venture capital initial public offering
              path due to massive capital expenditure demands and volatile equity market sentiment toward pre-profit
              energy transition infrastructure. Instead, the most credible liquidity mechanisms comprise strategic trade
              sales to integrated oil majors (such as Shell, TotalEnergies, or ExxonMobil) seeking turn-key synthetic
              fuel assets, or project-level recapitalizations where infrastructure private equity funds refinance
              operational production trains. Outside capital allocation must be governed by strict thesis-break triggers
              and kill criteria. Specifically, investors should kill the investment thesis if: (1) HIF Global fails to
              execute a definitive power purchase agreement under $40/MWh in Uruguay, forcing a cancellation of the
              Paysandú project; (2) strategic partner MoUs fail to convert into legally binding, credit-supported
              take-or-pay offtake contracts with pricing floors; or (3) lead sponsors require unpriced inside bridge
              notes that dilute earlier equity holders without audited financial disclosures. Final diligence must focus
              on securing full cap-table access, reviewing project debt term sheets, and auditing bilateral offtake
              agreements.
            claimRefs:
              - CV006
              - CV011
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Consortium Capital Shields Technology but Masks Project Equity Returns
            body: >-
              Capital commitments from industrial giants such as MOL, Idemitsu Kosan, and Porsche AG validate the
              strategic necessity of e-fuels for compliance. However, corporate venture capital and subsidized Japanese
              state funding (JOGMEC) prioritize secured molecule access rather than venture-level equity returns,
              insulating the company while obscuring true market-clearing equity valuation.
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV011
          - type: callout
            title: Maintain Disciplined Research-More Stance Until Power Tariffs and Pricing Clear
            body: >-
              Investors should maintain a research-more stance and refuse priced equity rounds until HIF Global secures
              binding grid power purchase agreements below $40/MWh and demonstrates long-term commercial offtake
              contracts with price-indexed floors.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV014
