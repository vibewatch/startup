              - CU006
              - CU013
      - number: '6.4'
        title: Retention Durability, Customer Concentration, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Customer concentration and procurement frictions present material headwinds for commercial scale-up.
              Operational consumption to date is concentrated in anchor backer Porsche AG, which operates in a dual
              capacity as primary customer, technology co-developer, and significant equity shareholder. Crucially, HIF
              Global’s public reporting contains no disclosures regarding net revenue retention, cohort durability, or
              customer renewal metrics. Commercial expansion faces immediate structural hurdles at its flagship 5.3
              billion dollar Paysandú development in Uruguay, where production of up to 876,000 tonnes per year of
              e-methanol is planned following environmental submission in March 2026. Negotiations with Uruguay’s state
              electricity utility have stalled over electricity tariffs, which constitute approximately seventy percent
              of operating costs. While HIF Global demands power at forty dollars per megawatt-hour to maintain
              competitive fuel economics, regional peers offer power between twenty-five and thirty-six dollars, leaving
              commercial-scale offtake contracts on hold until power pricing is resolved.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU012
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Offtaker vs Shareholder Alignment
            body: >-
              HIF Global’s early customer traction is heavily intertwined with its strategic capital providers. Porsche
              AG serves simultaneously as primary anchor offtaker, co-developer of direct air capture technology, and
              major equity shareholder. While this alignment guarantees high-visibility demand for pilot volumes, it
              obscures arm’s-length commercial price discovery until independent third-party offtakers begin taking
              commercial deliveries.
            calloutType: insight
            claimRefs:
              - CU003
              - CU013
          - type: callout
            title: Commercial Dependency on Power Tariffs
            body: >-
              The commercialization path for HIF Global’s planned 876,000-tonne Paysandú facility highlights the
              fragility of green synthetic fuel economics. With electricity constituting approximately seventy percent
              of operating costs, the impasse between HIF Global’s forty-dollar target and Uruguay’s state utility
              demonstrates that customer offtake contracts cannot be finalized without long-term competitive renewable
              power pricing.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Environmental Permitting Exposure
        blocks:
          - type: paragraph
            body: >-
              HIF Global operates across multiple legal and regulatory jurisdictions with varying policy frameworks and
              environmental review standards. In Uruguay, the company submitted its Prior Environmental Authorization
              application and Environmental Impact Study for the USD 5.3 billion Paysandú project in March 2026,
              incorporating extensive design revisions such as a 35% plant footprint reduction and a 260-hectare
              ecological buffer zone. Concurrently, regional power pricing remains the pivotal regulatory hurdle.
              Negotiations with state utility UTE over power tariffs have stalled because electricity represents
              approximately seventy percent of total operating expenditure for synthetic fuel synthesis. At the
              international level, uneven member state transposition of the European Union Renewable Energy Directive
              III and potential political rollbacks of United States Inflation Reduction Act subsidies introduce
              material volatility into long-term commercial offtake pricing and investment certainty.
            claimRefs:
              - CR001
