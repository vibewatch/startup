      - number: '5.2'
        title: Operating Architecture & Chemical Synthesis Mechanism
        blocks:
          - type: paragraph
            body: >-
              HIF Global's technical operating model is anchored on an integrated Power-to-X architecture that pairs
              dedicated renewable generation assets with multi-stage chemical synthesis plants. At the front end of the
              process, high-capacity onshore wind turbines and solar photovoltaic installations generate renewable
              electricity to power proton exchange membrane electrolysers, which dissociate demineralized water into
              green hydrogen and oxygen. In parallel, carbon dioxide is acquired through direct air capture
              demonstration systems or sourced from sustainable biogenic waste streams and industrial point sources. The
              pressurized green hydrogen and purified carbon dioxide are subsequently routed into a catalytic synthesis
              loop where high-temperature, high-pressure reaction beds convert the gaseous inputs into crude liquid
              e-methanol. For gasoline applications, this e-methanol is routed through a secondary catalytic reactor
              utilizing ExxonMobil's proprietary methanol-to-gasoline process, which converts methanol into heavy
              gasoline fractions, liquefied petroleum gas, and water. Managing process stability under highly variable
              wind capacity factors constitutes the central operational engineering challenge.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
