      - number: '6.2'
        title: Operational Proof and Early Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption has progressed from facility commissioning to real-world demonstration and
              cross-border deliveries. Following initial synthetic fuel synthesis at Haru Oni in December 2022, HIF
              Global achieved its first commercial international export in November 2023 by shipping 24,600 liters of
              synthetic gasoline from southern Chile to the United Kingdom. Adoption gained significant public
              visibility during the 2024 motorsport season, when HIF Global fueled thirty-two Porsche race cars across
              eight European racing events in the Porsche Mobil 1 Super Cup, validating fuel combustion stability and
              octane performance under extreme operating conditions. In May 2025, HIF Chile formalized a trilateral
              supply agreement delivering Haru Oni e-gasoline to Shell’s Technology Centre in Hamburg, Germany, for
              lighthouse showcase events with Porsche. Operational reliability at Haru Oni is maintained through
              specialized instrumentation calibration from partner Beamex, underpinning international sustainability
              certification.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
          - type: table
