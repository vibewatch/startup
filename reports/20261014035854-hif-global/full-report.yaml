      - CP002
      - CP007
      - CP013
      - CP014
    data:
      points:
        - label: HIF Global (Haru Oni / Pipeline)
          x: 4.2
          'y': 3.8
          detail: >-
            Operating pilot with certified RFNBO compliance; multi-GW global pipeline facing high FOAK capex and power
            price negotiations.
        - label: European Energy & Mitsui (Kassø)
          x: 4
          'y': 4.5
          detail: >-
            Launched first large commercial e-methanol facility in Denmark (2025); grid-connected European commercial
            offtake.
        - label: Biogenic Bio-Methanol Developers
          x: 3.5
          'y': 3.5
          detail: >-
            Lower near-term production cost using agricultural and forestry waste, but constrained by regional biogenic
            CO2 feedstock supply crunch.
        - label: Conventional Fossil Fuels (MGO/VLSFO)
          x: 1
          'y': 4.8
          detail: >-
            Incumbent status quo with mature bunkering infrastructure and low fuel costs, but zero decarbonization and
            rising regulatory penalties.
        - label: Battery Electric Direct Propulsion
          x: 4.8
          'y': 2
          detail: >-
            High lifecycle emissions efficiency, but strictly confined to short-sea and road transport by volumetric and
            gravimetric energy density limits.
        - label: Green Ammonia Developers
          x: 4
          'y': 1.8
          detail: >-
            Zero-carbon molecule for deep-sea shipping, but held back by toxicity, bunkering safety regulations, and
            engine retrofit timelines.
        - label: Internal Utility / Sovereign Build
          x: 2.5
          'y': 2.5
          detail: >-
            State-backed green hydrogen initiatives pursuing captive production, competing for prime grid
            interconnections and water rights.
