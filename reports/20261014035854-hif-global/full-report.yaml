      - number: '7.3'
        title: Partner, Feedstock, and Commercial Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              HIF Global relies on an extensive network of strategic partners, industrial suppliers, and capital
              providers to advance its capital-intensive roadmap. The company depends on single-source commercial
              relationships for carbon dioxide point sources, including Linde at Haru Oni and ALUR in Uruguay, where
              local monopolies dictate feedstock pricing and delivery terms. On the commercialization and capital side,
              HIF secured approximately two hundred million dollars in Japanese funding from JOGMEC, Idemitsu Kosan, and
              Mitsui O.S.K. Lines, yet binding long-term offtake volumes with guaranteed price floors remain largely
              undisclosed. Furthermore, early automotive commentary highlighting synthetic gasoline costs of thirty-one
              dollars per gallon underscores the persistent gap between demonstration costs and wholesale commercial
              viability, leaving the enterprise vulnerable to offtaker pushback without permanent regulatory compliance
              mandates.
            claimRefs:
