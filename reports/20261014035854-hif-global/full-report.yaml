chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              HIF Global (Highly Innovative Fuels) was founded in October 2020 in Santiago, Chile, following feasibility
              studies initiated in 2016 by Chilean energy developer Andes Mining & Energy (AME). In December 2021, HIF
              Global LLC was established in the United States as the group parent entity, maintaining corporate
              operating hubs in Houston, Texas and Santiago, Chile. The company operates as a project developer and
              synthetic fuels producer converting renewable wind and solar electricity into green hydrogen via water
              electrolysis, which is then synthesized with biogenic or industrial captured carbon dioxide into liquid
              drop-in synthetic hydrocarbons—principally e-methanol, synthetic gasoline (e-gasoline), and sustainable
              aviation fuel (e-SAF)—that require no modification to existing transport engines, distribution
              infrastructure, or bunkering networks.
            claimRefs:
              - CO001
              - CO002
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO008
              - CO012
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              HIF Global operates under a seven-member Board of Managers representing founding sponsor AME, strategic
              automotive partner Porsche, and energy infrastructure fund EIG Global Energy Partners. President and Chief
              Executive Officer César Norton leads executive execution alongside Chief Operations Officer Clara Bowman,
              Chief Commercial Officer Meg Gentle, and Chief Strategy Officer Juan José Gana, with regional subsidiary
              CEOs directing project execution in Chile, Uruguay, the United States, and Australia. Governance authority
              is concentrated among long-standing energy infrastructure executives originating from AME's Chilean power
              generation platform, creating material key-person dependence on senior leadership for complex sovereign
              permitting, technology licensing, and international project financing negotiations.
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
      - number: '1.3'
        title: Capitalization History, Ownership Distribution, and Valuation Opacity
        blocks:
          - type: paragraph
            body: >-
              Since corporate inception, HIF Global has secured cumulative private equity commitments totaling
              approximately $480 million across two major capital raises. In April 2022, the company completed a $260
              million equity funding round with participation from Porsche AG, EIG Global Energy Partners, Baker Hughes,
              and Gemstone Investments, establishing AME as controlling shareholder with a 74% equity stake alongside
              Porsche (12%) and EIG (12%). In 2024, HIF Global secured an additional $220 million capital raise
              introducing Japanese sovereign and industrial backers including JOGMEC, Idemitsu Kosan, and Mitsui O.S.K.
              Lines (MOL) to commercialize maritime e-methanol. However, corporate post-money valuation, preference
              stack covenants, and financial metrics remain private and undisclosed, limiting valuation transparency.
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: Operational Milestones, Demonstration Output, and Project Pipeline Headwinds
        blocks:
          - type: paragraph
            body: >-
              HIF Global achieved technical operating proof in December 2022 with the startup of its Haru Oni
              demonstration plant in Punta Arenas, Chile, producing initial volumes of e-gasoline powered by Magallanes
              wind resources. In May 2025, HIF Chile signed a commercial supply agreement with Porsche and Shell to
              deliver Haru Oni fuel for European lighthouse showcase events. The company's expansion strategy hinges on
              advancing four commercial-scale developments: the $5.3 billion Paysandú e-methanol project in Uruguay
              (700,000 tonnes/year), the Matagorda project in Texas, the Cabo Negro facility in Chile, and the Burnie
              facility in Tasmania. However, large-scale deployment faces acute friction, notably in Uruguay where
              contract execution has been delayed over industrial electricity pricing negotiations between HIF and state
              utility UTE.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO013
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pioneering Operational Proof and World-Class Strategic Backing
            body: >-
              HIF Global possesses an uncommon first-mover advantage as operator of Haru Oni, the world's first
              operational integrated e-fuels demonstration plant. Its cap table unites industrial power developers
              (AME), premium automotive manufacturers (Porsche), specialized energy infrastructure financiers (EIG), and
              sovereign-backed Asian energy importers (Idemitsu, JOGMEC, MOL), establishing critical strategic
              validation across technology, capital, and future offtake.
            calloutType: strength
            claimRefs:
              - CO002
              - CO005
              - CO007
          - type: callout
            title: Capital Intensity and Power-Price Vulnerability at Commercial Scale
            body: >-
              Transitioning from demonstration-scale output (Haru Oni) to commercial megaprojects ($5.3B Paysandú,
              multi-billion Matagorda) exposes HIF Global to severe input-cost risks. Power costs represent
              approximately 70% of e-fuels operating expenditures; failure to secure long-term power pricing at or below
              $40/MWh threatens project unit economics, final investment decisions, and capital deployment.
            calloutType: risk
            claimRefs:
              - CO011
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying system
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than all low-carbon fuels and broader than one e-gasoline product. HIF's
              production platform first creates e-methanol, which can be sold into marine and chemical uses or converted
              into e-gasoline and e-SAF for road and aviation applications. This chapter therefore includes procurement
              of renewable methanol and electricity-derived transport fuels where HIF can supply the molecule, while
              excluding merchant green hydrogen, renewable-power equipment, conventional fossil fuels, and biofuels
              except as substitutes or benchmarks. Electrification and biofuels remain adjacent decarbonization paths
              rather than revenue automatically available to HIF. The buying system is also multi-party: ship operators
              and aviation fuel suppliers create demand, distributors and refiners handle delivery, OEMs can validate
              compatibility, and regulators make premium fuel purchases commercially necessary. Idemitsu's stated
              500,000-tonne 2035 supply ambition and the Shell-Porsche delivery arrangement show channel and
              demonstration pathways, not disclosed binding demand at commercial-project scale.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
