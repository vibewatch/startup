      - number: '6.3'
        title: Named Customer Commitments and Commercial Offtake
        blocks:
          - type: paragraph
            body: >-
              HIF Global has assembled a diverse roster of commercial partners and prospective offtakers across Europe
              and the Asia-Pacific region. In Europe, the company has executed bilateral offtake frameworks and heads of
              agreement with distributors including MB Energy and German eFuel One for future e-methanol supplies
              destined for industrial and transport blending. In Japan, strategic relationships with petroleum company
              Idemitsu Kosan and shipping giant Mitsui O.S.K. Lines combine equity investment with long-term cooperation
              agreements targeting marine bunkering and industrial CO2 recycling. Furthermore, HIF Global signed a
              memorandum of understanding with aerospace manufacturer Airbus to advance e-SAF commercialization.
              However, nearly all large-scale arrangements remain preliminary memorandums or non-binding frameworks
              rather than executed take-or-pay sales contracts, leaving long-term volume monetization exposed to project
              development milestones.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
