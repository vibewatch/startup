  - id: FE001
    title: Product Architecture and Chemical Synthesis Stack
    type: stack
    summary: >-
      Six-layer integrated Power-to-X operating architecture transforming renewable wind electricity and captured carbon
      dioxide into drop-in synthetic fuels.
    claimRefs:
      - CE007
      - CE008
      - CE011
    data:
      layers:
        - label: Renewable Power Supply & Interconnection
          detail: Onshore wind turbines and solar PV parks with power management systems adapted for variable generation.
        - label: Water Treatment & Green Hydrogen Electrolysis
          detail: Demineralized water input feeding PEM electrolysers to produce high-purity green hydrogen.
        - label: Carbon Dioxide Sourcing & Pre-Treatment
          detail: Direct air capture (DAC) pilot units and biogenic / industrial point-source carbon capture systems.
        - label: Thermo-Catalytic Methanol Synthesis
          detail: Catalytic conversion reactor combining pressurized H2 and CO2 into crude liquid e-methanol.
        - label: Downstream Synthetic Fuel Upgrading
          detail: ExxonMobil licensed methanol-to-gasoline (MtG) and Honeywell/JM methanol-to-jet (MtJ) synthesis reactors.
        - label: Product Storage, Quality Assurance & Logistics
          detail: ISCC Plus certified tank farm storage, automated fuel testing, and marine bunkering terminal export.
