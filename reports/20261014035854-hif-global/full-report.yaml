            combustion reliability.
          tone: positive
        - label: 'Phase 3: Cross-Border Commercial Supply'
          detail: >-
            Delivering e-gasoline to Shell Technology Centre in Hamburg and executing 24,600-liter commercial export to
            the United Kingdom.
          tone: positive
        - label: 'Phase 4: Bilateral Strategic MoUs'
          detail: >-
            Executing non-binding partnership frameworks with global energy players including Idemitsu Kosan, Mitsui
            O.S.K. Lines, and Airbus.
          tone: neutral
        - label: 'Phase 5: Offtake Heads of Agreement'
          detail: >-
