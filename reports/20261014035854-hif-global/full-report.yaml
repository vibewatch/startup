    type: quadrant
    summary: >-
      Ordinal positioning of alternative transport decarbonization pathways based on lifecycle emissions abatement,
      feedstock scalability, and infrastructure readiness.
    approximationNotes: >-
      Scores reflect ordinal evaluation (1.0 to 5.0 scale) derived from Methanol Institute project data, Enki AI
      competitive analysis, and EU RFNBO certification criteria; exact commercial parity timelines remain uncertain.
    claimRefs:
