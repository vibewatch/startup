      - number: '7.4'
        title: Financial Model, Capital Intensity, and Synthesis Heatmap
        blocks:
          - type: paragraph
            body: >-
              The financial profile of HIF Global is characterized by extreme capital intensity and extended pre-revenue
              gestation periods. Pipeline projects demand multi-billion-dollar outlays, including eight billion dollars
              targeted for the Porto do Açu e-methanol facility in Brazil with a projected 2028 final investment
              decision. In contrast to Chile and Uruguay where HIF plans dedicated renewable generation assets, the
              Brazilian model relies entirely on third-party electricity power purchase agreements, shifting risk toward
              long-term merchant tariff volatility. Given the prolonged cash burn required to navigate engineering,
              procurement, environmental permitting, and commercial negotiations across South America, North America,
              and Australia, any delay in final investment decisions or debt syndication could force punitive dilutive
              equity financings or selective project cancellations.
            claimRefs:
              - CR013
