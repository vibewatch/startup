              - CE008
              - CE011
      - number: '5.3'
        title: Deployment Maturity, Scaling Roadmap & Utility Dependencies
        blocks:
          - type: paragraph
            body: >-
              The deployment trajectory of HIF Global spans an operational demonstration phase at Haru Oni in Punta
              Arenas, Chile, progressing toward multi-train industrial-scale facilities across Latin America, the United
              States, and Australia. Haru Oni has been continuously operational since December 2022, functioning as a
              real-world testing ground for technical integration, equipment degradation, and fuels certification. To
              bridge the gap to industrial commercialization, HIF Global contracted Techint E&C in May 2024 to execute
              comprehensive conceptual and basic engineering for the Cabo Negro project in Chile, targeting annual
              capacity of up to 173,600 tonnes of e-methanol and 70,000 tonnes of e-gasoline. Internationally, HIF
              submitted its Prior Environmental Authorization application in March 2026 for the $5.3 billion Paysandú
              project in Uruguay, designed for 876,000 tonnes of e-methanol across four production trains. However,
              commercial execution remains heavily constrained by electricity procurement economics: power represents
              roughly seventy percent of synthetic fuel operational running costs, and prolonged grid tariff
              negotiations with state utilities represent a major hurdle to final investment decisions.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
              - CE013
      - number: '5.4'
        title: Quality Standards, Regulatory Compliance & Technical Gaps
        blocks:
          - type: paragraph
            body: >-
              Commercial offtake of synthetic electro-fuels depends fundamentally on rigorous compliance with
              international sustainability certifications and emissions tracking frameworks. Fuels produced at HIF
              Global's Haru Oni facility are certified under the International Sustainability and Carbon Certification
              Plus (ISCC Plus) scheme, supported by more than one hundred routine laboratory quality control analyses to
              confirm fuel purity and octane ratings. For European offtake markets governed by the Renewable Energy
              Directive, synthetic fuels must qualify as Renewable Fuels of Non-Biological Origin (RFNBOs), a standard
              officially recognized by the European Commission under ISCC EU in December 2024. From an engineering
              diligence standpoint, HIF Global operates as a heavy industrial energy and chemical project developer
              rather than a software platform. Consequently, traditional software developer metrics such as GitHub
              repositories, open-source community traction, and developer APIs do not exist for the business. Diligence
              must instead focus on physical plant availability, electrolyser stack lifetime warranties, and executed
              EPC contracts.
            claimRefs:
              - CE011
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational Demonstration Versus Industrial Scale
            body: >-
              While the Haru Oni pilot demonstrates the functional viability of integrated wind-to-gasoline synthesis at
              130,000 liters annually, scaling to commercial facilities such as Cabo Negro (173,600 tonnes e-methanol)
              and Paysandú (876,000 tonnes) represents an exponential step in engineering complexity, utility
              interconnection, and capital expenditure.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE006
          - type: callout
            title: Feedstock Energy Intensity and Grid Tariff Vulnerability
            body: >-
              Synthetic fuel synthesis is intrinsically energy-intensive, with electrical power comprising approximately
              70% of operational expenditure at commercial facilities. Unresolved tariff disputes with national grid
              operators and variable wind capacity factors directly dictate synthesis economics.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Market Structure
        blocks:
          - type: paragraph
            body: >-
              HIF Global structures its customer acquisition strategy across three primary decarbonization verticals:
              automotive transport, maritime bunkering, and commercial aviation. In automotive transport, the company
              focuses on high-octane synthetic e-gasoline designed as a drop-in replacement for internal combustion
              engines, targeting luxury original equipment manufacturers and specialty vehicle operators requiring
              emissions compliance without battery-electric fleet conversion. The maritime sector represents the largest
              potential volume absorber, where shipping conglomerates seek renewable e-methanol to power dual-fuel
              container vessels under international maritime emissions frameworks. In aviation, HIF Global pursues two
              distinct sustainable aviation fuel pathways, planning e-methanol exports to European refiners under
              ReFuelEU quotas while exploring waste-methane renewable natural gas in the United States. Across all
              segments, executive leadership emphasizes adapting production configurations to regional customer demands
              and evolving low-carbon mandates.
            claimRefs:
              - CU001
              - CU006
              - CU011
              - CU015
