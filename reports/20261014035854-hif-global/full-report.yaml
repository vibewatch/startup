        - Enterprise value expands toward $3B-$5B infrastructure asset base; equity returns >25% IRR.
        - Regulatory delays in EU RFNBO mandate enforcement reduce green fuel compliance willingness.
      - - Base Case (Protracted Timeline)
        - 55%
        - >-
          Power tariffs settle near $45/MWh; 24-month delay to commercial FID; funding closed through heavy debt and
          partner equity.
        - Valuation anchored at cost-plus; equity returns compress to 10-14% infrastructure hurdle rates.
        - Rising project finance interest rates inflate levelized cost of hydrogen and methanol.
      - - Bear Case (Execution Stall)
        - 25%
        - Power tariff dispute aborts Paysandú; Matagorda EPC costs blow out; corporate sponsors stall follow-on equity.
        - Down-round restructuring; pre-FID development capital written down by 50-80%.
