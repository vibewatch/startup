  - id: TV002
    title: Investment Thesis vs. Anti-Thesis Matrix
    columns:
      - Core Underwriting Vector
      - Investment Thesis (Pros & Upside)
      - Anti-Thesis (Risks & Headwinds)
      - What Would Change the View
    rows:
      - - Operational Proof & Technology
        - World's only operating integrated e-fuels facility at Haru Oni; certified exports to Europe.
        - Demonstration capacity (350 t/y methanol) is tiny compared to proposed gigawatt pipeline.
        - Successful commercial commissioning of Matagorda or first Paysandú train.
      - - Strategic Consortium Backing
        - $200M Japanese funding from MOL, Idemitsu, JOGMEC plus Porsche and EIG sponsorship.
        - Corporate venture investors prioritize molecule access over venture equity return hurdles.
        - Third-party institutional growth equity lead pricing an arm's-length round.
      - - Input Economics & Power Cost
        - Access to world-class wind and solar resources in Patagonia, Texas, and Uruguay.
        - Power represents 70% of opex; Uruguay project stalled on $40/MWh power tariff impasse.
        - Signed long-term PPA below $40/MWh with state utilities or captive renewable parks.
      - - Market Demand & Offtake
        - Over 380 dual-fuel marine vessels ordered globally create structural drop-in demand.
        - High green fuel premium over fossil fuels requires sustained regulatory compliance subsidies.
        - Binding take-or-pay maritime offtake contracts with price-indexed floors.
