      - number: '7.2'
        title: Operational Scale-Up and First-of-a-Kind Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Transitioning from the demonstration-scale Haru Oni facility in southern Chile to commercial-scale
              megaprojects introduces severe first-of-a-kind execution risks. Knowledge sharing disclosures from the
              Tasmanian development program highlight inherent capital expenditure and operating cost uncertainty
              arising from the absence of prior global reference plants. Sourcing sufficient carbon dioxide at
              commercial scale represents an unhedged operational bottleneck. Direct air capture technologies captured
              under 0.01 megatons of carbon dioxide globally in 2022, and HIF Global has acknowledged that no reliable
              commercial direct air capture solution currently exists to satisfy its megaton-scale facility
              requirements. Consequently, the commercial pipeline depends heavily on industrial and biogenic point
              sources, creating exposure to regional flue gas availability, upstream plant operational cycles, and
              biomass supply chains.
            claimRefs:
              - CR005
              - CR009
              - CR010
          - type: table
            tableRef: TR002
