figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Key corporate, operational, financing, and regulatory milestones spanning HIF Global's trajectory from 2016
      exploratory studies through 2026 industrial permitting.
    data:
      items:
        - date: 2016-2018
          label: Exploratory Wind-to-X Studies
          detail: >-
            Founding sponsor AME conducts studies in Chile's Magallanes Region identifying world-class wind resources
            for power-to-X synthetic fuels.
          tone: positive
        - date: 2020-10
          label: Corporate Founding in Chile
          detail: >-
            Highly Innovative Fuels (HIF) is officially established in Santiago de Chile to develop commercial synthetic
            fuel infrastructure.
          tone: neutral
        - date: 2021-12
          label: US Parent Incorporation
          detail: >-
            HIF Global LLC is formed in the United States as the parent holding entity, opening offices in Houston,
            Texas to steer international growth.
          tone: neutral
        - date: 2022-04
          label: Series Equity Financing Round
          detail: >-
            Secures $260 million equity investment led by Porsche AG, EIG Global Energy Partners, Baker Hughes, AME, and
            Gemstone Investments.
          tone: positive
        - date: 2022-12
          label: Haru Oni Demonstration Startup
          detail: >-
            HIF Chile produces the first synthetic gasoline at the Haru Oni pilot facility in southern Chile,
            demonstrating integrated e-fuel synthesis.
          tone: positive
        - date: 2024-06
          label: Japanese Capital Expansion Round
          detail: >-
            Completes $220 million capital raise introducing Idemitsu Kosan, JOGMEC, and Mitsui O.S.K. Lines to scale
            commercial projects and APAC supply.
          tone: positive
        - date: 2025-05
          label: Commercial Supply Agreement with Porsche & Shell
          detail: >-
            HIF Chile signs supply contract with Porsche AG and Shell for e-fuels produced at Haru Oni for delivery to
            Shell Technology Centre in Hamburg.
          tone: positive
        - date: 2026-03
          label: Paysandú Environmental Filing
          detail: >-
            HIF Global submits Prior Environmental Authorization application and Environmental Impact Study for the $5.3
            billion Paysandú project in Uruguay.
          tone: positive
        - date: 2026-06
          label: Uruguay Power Price Bottleneck
          detail: >-
            Negotiations between HIF Global and Uruguayan state utility UTE stall over industrial electricity pricing
            ($40/MWh ask), delaying investment decision.
          tone: negative
    approximationNotes: >-
      Timeline events and dates derived from verified company corporate sustainability reports, official regulatory
      announcements, and international reporting.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO013
