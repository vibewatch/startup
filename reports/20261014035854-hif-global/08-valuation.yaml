callouts:
  - calloutType: "insight"
    title: "Strategic Consortium Capital Shields Technology but Masks Project Equity Returns"
    body: "Capital commitments from industrial giants such as MOL, Idemitsu Kosan, and Porsche AG validate the strategic necessity of e-fuels for compliance. However, corporate venture capital and subsidized Japanese state funding (JOGMEC) prioritize secured molecule access rather than venture-level equity returns, insulating the company while obscuring true market-clearing equity valuation."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV011"
  - calloutType: "recommendation"
    title: "Maintain Disciplined Research-More Stance Until Power Tariffs and Pricing Clear"
    body: "Investors should maintain a research-more stance and refuse priced equity rounds until HIF Global secures binding grid power purchase agreements below $40/MWh and demonstrates long-term commercial offtake contracts with price-indexed floors."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV014"
