  - - European Industrial & Refining
    - Energy distributors, refiners, and chemical trading houses (MB Energy, German eFuel One)
    - e-Methanol feedstock for chemical synthesis and ReFuelEU compliance blending
    - "Commercial export tranches from planned Paysand\xFA facility (up to 876,000 tpa)"
    - Baseline multi-year commercial offtake providing debt-service coverage
    - Firm pricing mechanisms and binding take-or-pay commitments undisclosed
  - - Commercial Maritime Shipping
    - Deep-sea container carriers, bulk operators, and bunkering consortia (MOL, Idemitsu)
    - Drop-in marine e-methanol bunker fuel for dual-fuel commercial vessels
    - Commercial scale from Texas (1.4M tpa) and Australia (210,000 tpa) projects
    - Massive scale volume absorption supporting global decarbonization mandates
    - Zero commercial maritime deliveries completed to date; bunkering infrastructure unbuilt
  - - Commercial Aviation (e-SAF)
    - Commercial airlines, cargo carriers, and aerospace consortia (Airbus MoU)
    - Methanol-to-Jet drop-in e-SAF and waste-methane RNG aviation fuel
    - "Long-term production allocations planned across Matagorda and Paysand\xFA"
    - Highest-premium compliance market driven by statutory EU and US mandates
    - Early engineering stage; commercial ASTM-certified pathway deployment pending
