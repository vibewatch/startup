callouts:
- calloutType: insight
  title: Strategic Offtaker vs Shareholder Alignment
  body: "HIF Global\u2019s early customer traction is heavily intertwined with its strategic capital providers. Porsche AG\
    \ serves simultaneously as primary anchor offtaker, co-developer of direct air capture technology, and major equity shareholder.\
    \ While this alignment guarantees high-visibility demand for pilot volumes, it obscures arm\u2019s-length commercial price\
    \ discovery until independent third-party offtakers begin taking commercial deliveries."
  claimRefs:
  - CU003
  - CU013
- calloutType: risk
  title: Commercial Dependency on Power Tariffs
  body: "The commercialization path for HIF Global\u2019s planned 876,000-tonne Paysand\xFA facility highlights the fragility\
    \ of green synthetic fuel economics. With electricity constituting approximately seventy percent of operating costs, the\
    \ impasse between HIF Global\u2019s forty-dollar target and Uruguay\u2019s state utility demonstrates that customer offtake\
    \ contracts cannot be finalized without long-term competitive renewable power pricing."
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU014
