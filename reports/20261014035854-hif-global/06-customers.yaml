- id: FU001
  title: Customer adoption and commercialization journey map
  type: journey-map
  summary: Sequential commercialization path from pilot demonstration through racing showcases to mega-scale utility contracting
    and international offtake.
  data:
    items:
    - label: 'Phase 1: Pilot Synthesis & Instrument Validation'
      detail: Operational demonstration at Haru Oni facility in Chile utilizing Beamex precision calibration and achieving
        ISCC Plus certification.
      tone: positive
    - label: 'Phase 2: High-Visibility Lighthouse Showcases'
      detail: Porsche Mobil 1 Super Cup 2024 deployment powering 32 race cars across eight European races to prove combustion
        reliability.
      tone: positive
    - label: 'Phase 3: Cross-Border Commercial Supply'
      detail: Delivering e-gasoline to Shell Technology Centre in Hamburg and executing 24,600-liter commercial export to
        the United Kingdom.
      tone: positive
    - label: 'Phase 4: Bilateral Strategic MoUs'
      detail: Executing non-binding partnership frameworks with global energy players including Idemitsu Kosan, Mitsui O.S.K.
        Lines, and Airbus.
      tone: neutral
    - label: 'Phase 5: Offtake Heads of Agreement'
      detail: Signing forward e-methanol supply frameworks with European fuel distributors including MB Energy and German
        eFuel One.
      tone: neutral
    - label: 'Phase 6: Infrastructure Permitting & Power Contracting'
      detail: Negotiating crucial 0/MWh power tariff and submitting 5.3 billion dollar DINACEA environmental impact study
        in Uruguay.
      tone: risk
    - label: 'Phase 7: Multi-Facility Production Scaling'
      detail: "Advancing Matagorda, Paysand\xFA, and Tasmania facilities toward final investment decisions to serve maritime\
        \ bunker and aviation markets."
      tone: neutral
  approximationNotes: Progression illustrates commercial phases from operational demonstration to utility-scale project finance;
    dates reflect announced project milestones.
