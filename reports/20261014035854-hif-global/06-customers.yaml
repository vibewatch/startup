chapter:
  number: 6
  title: Customers
  summary: "HIF Global demonstrates operational customer validation through lighthouse automotive partnerships like Porsche\
    \ and initial commercial exports from Haru Oni, but commercial-scale offtake remains contingent on unbuilt mega-facilities\
    \ and unresolved power pricing negotiations for its planned Paysand\xFA project."
sections:
- id: customer-segmentation-and-market-structure
  title: Customer Segmentation and Market Structure
  body: 'HIF Global structures its customer acquisition strategy across three primary decarbonization verticals: automotive
    transport, maritime bunkering, and commercial aviation. In automotive transport, the company focuses on high-octane synthetic
    e-gasoline designed as a drop-in replacement for internal combustion engines, targeting luxury original equipment manufacturers
    and specialty vehicle operators requiring emissions compliance without battery-electric fleet conversion. The maritime
    sector represents the largest potential volume absorber, where shipping conglomerates seek renewable e-methanol to power
    dual-fuel container vessels under international maritime emissions frameworks. In aviation, HIF Global pursues two distinct
    sustainable aviation fuel pathways, planning e-methanol exports to European refiners under ReFuelEU quotas while exploring
    waste-methane renewable natural gas in the United States. Across all segments, executive leadership emphasizes adapting
    production configurations to regional customer demands and evolving low-carbon mandates.'
  claimRefs:
  - CU001
  - CU006
  - CU011
  - CU015
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: operational-proof-and-early-adoption-trajectory
  title: Operational Proof and Early Adoption Trajectory
  body: "Commercial adoption has progressed from facility commissioning to real-world demonstration and cross-border deliveries.\
    \ Following initial synthetic fuel synthesis at Haru Oni in December 2022, HIF Global achieved its first commercial international\
    \ export in November 2023 by shipping 24,600 liters of synthetic gasoline from southern Chile to the United Kingdom. Adoption\
    \ gained significant public visibility during the 2024 motorsport season, when HIF Global fueled thirty-two Porsche race\
    \ cars across eight European racing events in the Porsche Mobil 1 Super Cup, validating fuel combustion stability and\
    \ octane performance under extreme operating conditions. In May 2025, HIF Chile formalized a trilateral supply agreement\
    \ delivering Haru Oni e-gasoline to Shell\u2019s Technology Centre in Hamburg, Germany, for lighthouse showcase events\
    \ with Porsche. Operational reliability at Haru Oni is maintained through specialized instrumentation calibration from\
    \ partner Beamex, underpinning international sustainability certification."
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU007
  tableRefs:
  - TU002
- id: named-customer-commitments-and-commercial-offtake
  title: Named Customer Commitments and Commercial Offtake
  body: HIF Global has assembled a diverse roster of commercial partners and prospective offtakers across Europe and the Asia-Pacific
    region. In Europe, the company has executed bilateral offtake frameworks and heads of agreement with distributors including
    MB Energy and German eFuel One for future e-methanol supplies destined for industrial and transport blending. In Japan,
    strategic relationships with petroleum company Idemitsu Kosan and shipping giant Mitsui O.S.K. Lines combine equity investment
    with long-term cooperation agreements targeting marine bunkering and industrial CO2 recycling. Furthermore, HIF Global
    signed a memorandum of understanding with aerospace manufacturer Airbus to advance e-SAF commercialization. However, nearly
    all large-scale arrangements remain preliminary memorandums or non-binding frameworks rather than executed take-or-pay
    sales contracts, leaving long-term volume monetization exposed to project development milestones.
  claimRefs:
  - CU003
  - CU005
  - CU006
  - CU013
  tableRefs:
  - TU003
- id: retention-concentration-and-procurement-risks
  title: Retention Durability, Customer Concentration, and Procurement Friction
  body: "Customer concentration and procurement frictions present material headwinds for commercial scale-up. Operational\
    \ consumption to date is concentrated in anchor backer Porsche AG, which operates in a dual capacity as primary customer,\
    \ technology co-developer, and significant equity shareholder. Crucially, HIF Global\u2019s public reporting contains\
    \ no disclosures regarding net revenue retention, cohort durability, or customer renewal metrics. Commercial expansion\
    \ faces immediate structural hurdles at its flagship 5.3 billion dollar Paysand\xFA development in Uruguay, where production\
    \ of up to 876,000 tonnes per year of e-methanol is planned following environmental submission in March 2026. Negotiations\
    \ with Uruguay\u2019s state electricity utility have stalled over electricity tariffs, which constitute approximately\
    \ seventy percent of operating costs. While HIF Global demands power at forty dollars per megawatt-hour to maintain competitive\
    \ fuel economics, regional peers offer power between twenty-five and thirty-six dollars, leaving commercial-scale offtake\
    \ contracts on hold until power pricing is resolved."
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU012
  - CU014
