        title: 收入来源、承购结构与商业化路径
        blocks:
          - type: paragraph
            body: >-
              HIF Global 瞄准三类合成燃料的商业收入：用于海运和工业化工原料的电子甲醇、用于乘用车道路运输的电子汽油，以及用于商业航空的电子 SAF。迄今，实际商业收入仍局限于智利南部 Haru Oni
              试点生产的小批量示范燃料，包括向英国交付的首批 24,600 升合成汽油。商业规模运营设想的是与战略企业伙伴签署多年期双边照付不议承购协议，而非现货商品交易。公司已与 Porsche
              AG、Shell、Mitsui O.S.K. Lines 和 Idemitsu Kosan 等全球产业巨头签署商业及技术协议。但完整规模收入仍遥远，因为乌拉圭 Paysandú 等大型商业工厂（876,000
              吨/年）尚在开发，等待最终投资决策、环境许可和完整项目融资方案。
