  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 根据生命周期减排、原料可扩展性和基础设施成熟度，对替代交通脱碳路径进行序数定位。
    approximationNotes: 分数反映序数评估（1.0 至 5.0），来源于 Methanol Institute 项目数据、Enki AI 竞争分析和欧盟 RFNBO 认证标准；实现商业对等的确切时间仍不确定。
    claimRefs:
      - CP001
      - CP002
      - CP007
      - CP013
      - CP014
    data:
      points:
        - label: HIF Global（Haru Oni / 管线）
          x: 4.2
          'y': 3.8
          detail: 运营中的试点已获得 RFNBO 合规认证；全球多吉瓦管线面临高额 FOAK 资本开支和电价谈判。
        - label: European Energy 与 Mitsui（Kassø）
          x: 4
          'y': 4.5
          detail: 在丹麦建成首座大型商业电子甲醇设施（2025 年）；已接入电网并实现欧洲商业承购。
        - label: 生物源生物甲醇开发商
          x: 3.5
          'y': 3.5
          detail: 利用农业和林业废弃物降低近期生产成本，但受区域生物源 CO2 原料供应紧张约束。
        - label: 传统化石燃料（MGO/VLSFO）
          x: 1
          'y': 4.8
          detail: 具备成熟加注基础设施和低燃料成本的既有方案，但无法脱碳且面临不断上升的监管处罚。
        - label: 电池电动直接推进
          x: 4.8
          'y': 2
          detail: 生命周期排放效率高，但受体积和重量能量密度限制，只适用于近海和道路运输。
        - label: 绿色氨开发商
          x: 4
          'y': 1.8
          detail: 面向远洋航运的零碳分子，但受毒性、加注安全法规和发动机改造周期拖累。
        - label: 内部公用事业 / 主权建设
          x: 2.5
          'y': 2.5
          detail: 国家支持的绿色氢项目寻求专属生产，争夺优质电网接入和水权。
  - id: FI001
    title: “HIF Global 商业转化流程：从原料投入到现金流”
    type: flow
    summary: 展示将可再生电力和捕集的 CO2 转化为商业合成燃料收入及项目偿债现金流的工艺与财务流程。
    claimRefs:
      - CI004
      - CI005
      - CI012
      - CI015
    data:
      nodes:
        - id: renewable-power
          label: 可再生电力 PPA
          value: 70% of OPEX
          unit: PPA Tariff ($40/MWh target)
          detail: 风力和太阳能发电为水电解提供绿色电子
        - id: co2-feedstock
          label: 捕集的 CO2 原料
          value: 900k tons/yr
          unit: Input Volume
          detail: 通过供应协议签约获取生物源 CO2 或直接空气捕集原料
        - id: plant-synthesis
          label: 生产与合成
          value: $5.3B - $5.4B
          unit: Plant CAPEX
          detail: 多条生产线进行绿色氢生产和甲醇合成
        - id: refined-products
          label: 合成燃料产出
          value: 876k tons/yr
          unit: e-Methanol Volume
          detail: 经 ISCC Plus 认证的成品电子甲醇、电子汽油或电子 SAF
        - id: customer-offtake
          label: 商业承购合同
          value: Take-or-Pay
          unit: Contract Structure
          detail: 工业买家（航运、汽车、航空）依据长期协议采购数量
        - id: revenue-realization
          label: 项目总收入
          value: Contract Price
          unit: Wholesale Value
          detail: 通过绿色合规溢价实现的批发收入流
        - id: capital-servicing
          label: 债务偿付与股权回报
          value: Project Finance
          unit: Capital Allocation
          detail: 无追索权项目债务偿付、运营支出和股权分配
      edges:
        - from: renewable-power
          to: plant-synthesis
          label: 电力输入
        - from: co2-feedstock
          to: plant-synthesis
          label: 碳输入
        - from: plant-synthesis
          to: refined-products
          label: 合成
        - from: refined-products
          to: customer-offtake
          label: 燃料交付
        - from: customer-offtake
          to: revenue-realization
          label: 承购付款
        - from: revenue-realization
          to: capital-servicing
          label: 现金瀑布
  - id: FE001
    title: 产品架构与化学合成栈
    type: stack
    summary: 六层一体化 Power-to-X 运营架构，将可再生风电和捕集的二氧化碳转化为可直接替代的合成燃料。
    claimRefs:
      - CE007
      - CE008
      - CE011
    data:
      layers:
        - label: 可再生电力供应与并网
          detail: 配备适应波动发电的电力管理系统的陆上风机和太阳能光伏园区。
        - label: 水处理与绿色氢电解
          detail: 以去矿化水为输入，供 PEM 电解槽生产高纯度绿色氢。
        - label: 二氧化碳来源与预处理
          detail: 直接空气捕集（DAC）试点装置，以及生物源 / 工业点源碳捕集系统。
        - label: 热催化甲醇合成
          detail: 催化转化反应器将加压 H2 和 CO2 合成为粗液态电子甲醇。
        - label: 下游合成燃料提质
          detail: ExxonMobil 授权的甲醇制汽油（MtG）以及 Honeywell/JM 的甲醇制喷气燃料（MtJ）合成反应器。
        - label: 产品储存、质量保证与物流
          detail: ISCC Plus 认证的罐区储存、自动化燃料检测和船用燃料码头出口。
  - id: FU001
    title: 客户采用与商业化旅程图
    type: journey-map
    summary: 从试点示范，经赛车展示，走向超大规模公用事业签约和国际承购的商业化路径。
    data:
      items:
        - label: 阶段 1：试点合成与仪器验证
          detail: 在智利 Haru Oni 设施进行运营示范，采用 Beamex 精密校准并获得 ISCC Plus 认证。
          tone: positive
        - label: 阶段 2：高曝光灯塔项目展示
          detail: 在 2024 年 Porsche Mobil 1 Super Cup 的八场欧洲赛事中为 32 辆赛车提供动力，验证燃烧可靠性。
          tone: positive
        - label: 阶段 3：跨境商业供应
          detail: 向汉堡 Shell Technology Centre 交付电子汽油，并向英国完成 24,600 升商业出口。
          tone: positive
        - label: 阶段 4：双边战略谅解备忘录
          detail: 与 Idemitsu Kosan、Mitsui O.S.K. Lines 和 Airbus 等全球能源企业签署不具约束力的合作框架。
          tone: neutral
        - label: 阶段 5：承购协议要点
          detail: 与 MB Energy 和德国 eFuel One 等欧洲燃料分销商签署远期电子甲醇供应框架。
          tone: neutral
        - label: 阶段 6：基础设施许可与电力签约
          detail: 谈判关键的 0/MWh 电力关税，并在乌拉圭提交价值 $5.3B 的 DINACEA 环境影响研究。
          tone: risk
        - label: 阶段 7：多设施生产扩张
          detail: 推动 Matagorda、Paysandú 和 Tasmania 设施走向最终投资决策，服务海运燃料和航空市场。
          tone: neutral
    approximationNotes: 进程展示从运营示范到公用事业级项目融资的商业阶段；日期反映已公布的项目里程碑。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU008
