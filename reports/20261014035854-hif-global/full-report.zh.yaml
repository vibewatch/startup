    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              HIF Global（Highly Innovative Fuels）于 2020 年 10 月在智利圣地亚哥成立，此前智利能源开发商 Andes Mining & Energy（AME）自 2016
              年启动可行性研究。2021 年 12 月，HIF Global LLC
              在美国成立，作为集团母公司，并在得州休斯敦和智利圣地亚哥设运营中心。公司既开发项目，也生产合成燃料：先用水电解把风电和光伏电转成绿氢，再将其与生物源或工业捕集的二氧化碳合成为液态即插即用合成烃，主要产品包括电子甲醇、合成汽油（电子汽油）和可持续航空燃料（电子
              SAF），无需改造现有交通发动机、配送基础设施或加注网络。
            claimRefs:
              - CO001
              - CO002
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO008
              - CO012
      - number: '1.2'
        title: 高管领导、治理结构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              HIF Global 由七人经理人委员会管理，成员代表创始股东 AME、战略汽车伙伴 Porsche 和能源基础设施基金 EIG Global Energy Partners。总裁兼 CEO César
              Norton 与 COO Clara Bowman、CCO Meg Gentle、CSO Juan José Gana 共同负责执行，各地区子公司 CEO
              则统筹智利、乌拉圭、美国和澳大利亚的项目。治理权集中在一批长期从事能源基础设施、且来自 AME 智利发电平台的高管手中，因此复杂的主权许可、技术许可和国际项目融资谈判高度依赖核心管理层。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
      - number: '1.3'
        title: 资本历史、股权分布与估值不透明
        blocks:
          - type: paragraph
            body: >-
              公司成立以来，HIF Global 通过两轮主要融资获得约 $480 million 累计私募股权承诺。2022 年 4 月，公司完成 $260 million 股权融资，参与者包括 Porsche AG、EIG
              Global Energy Partners、Baker Hughes 和 Gemstone Investments；AME 以 74% 股权成为控股股东，Porsche 持 12%，EIG 持 12%。2024
              年，HIF 又融资 $220 million，引入 JOGMEC、Idemitsu Kosan 和 Mitsui O.S.K.
              Lines（MOL）等日本主权及产业投资者，推动海运电子甲醇商业化。但公司投后估值、优先股堆叠条款和财务指标仍属私有且未披露，估值透明度有限。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: 运营里程碑、示范产量与项目管线阻力
        blocks:
          - type: paragraph
            body: >-
              HIF Global 于 2022 年 12 月启动智利 Punta Arenas 的 Haru Oni 示范工厂，以 Magallanes 风能生产首批电子汽油，证明了技术可运营性。2025 年 5 月，HIF
              Chile 与 Porsche 和 Shell 签署商业供应协议，为欧洲灯塔式展示活动供应 Haru Oni 燃料。公司扩张取决于四个商业规模项目：乌拉圭 $5.3b 的 Paysandú
              电子甲醇项目（700,000 tonnes/year）、得州 Matagorda 项目、智利 Cabo Negro 工厂和塔斯马尼亚 Burnie 工厂。但大规模落地仍受明显阻力，尤其是在乌拉圭，HIF
              与国有公用事业 UTE 因工业电价谈判而延误合同执行。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
