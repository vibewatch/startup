      - number: '3.2'
        title: 能力对标与战略定位
        blocks:
          - type: paragraph
            body: >-
              HIF Global 的竞争地位建立在智利南部 Haru Oni 示范工厂的运营证明和监管合规之上。2026 年 7 月，公司成功续期 ISCC EU RFNBO
              认证，确认其合成汽油和电子甲醇符合欧盟可再生交通燃料要求，并较化石燃料基准至少减少七成
              的全生命周期温室气体排放。其合成烃架构的决定性技术优势是即插即用兼容：不同于氢气或低温氨，电子甲醇和电子汽油可以使用现有配送物流和标准内燃机动力系统，无需昂贵改造。汽车股东 Porsche
              通过车队部署验证了这一性能，并以电动车和合成即插即用燃料并行推进双轨脱碳路线。不过，在欧洲运营的竞争者离鹿特丹等关键加注枢纽更近，HIF 必须证明低成本规模化生产，以抵消跨洲运输物流。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP013
              - CP014
      - number: '3.3'
        title: 承购经济性、电价与区域套利
        blocks:
          - type: paragraph
            body: >-
              合成电子燃料的单位经济性主要由清洁电力驱动，电力约占总运营支出的七成。因此，竞争优势完全取决于能否锁定低于区域市场均值的长期购电协议。智利 Magallanes 的风电容量因子接近
              七成，可将可再生电力成本压到每兆瓦时二十美元以下，形成世界级生产节点。反过来，HIF 在乌拉圭 Paysandú 拟建的五十四亿美元工厂因国有公用事业无法保证每兆瓦时四十美元
              的目标电价而谈判停滞，暴露出主权电价风险。分销端的商业承购仍以长期双边协议和框架协议为主，包括 2025 年 4 月与 Mabanaft 签署的年供 10 万吨承诺，以及 2026 年 2 月与 eFuel
              One 签署的额外 10 万吨。虽然这些合同显示欧洲燃料分销商有商业兴趣，但实际净回值定价和照付不议罚则公式仍是严守的商业秘密。
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河持久性、补贴依赖与替代威胁
        blocks:
          - type: paragraph
            body: >-
              HIF Global 的竞争护城河受到资本密集度、政策脆弱性和原料替代的多重阻力。HIF 已宣布一百五十三亿美元的全球开发管线，包括得州数十亿美元的 Matagorda
              工厂以及乌拉圭、巴西和澳大利亚的大型项目。但所有首座 GW 级合成燃料工厂都面临漫长开发周期和高昂的单位电解装机资本开支。美国项目还高度暴露于《通胀削减法案》第 45V 条清洁氢和第 45Q
              条碳捕集抵免，任何联邦政策收缩都会立即侵蚀预期回报。此外，低成本生物源碳路线和工业 CO2 供应短缺也可能在直接空气捕集实现成本平价前挤压电子燃料利润。要守住防御性，HIF
              至少要让一座多列车商业工厂完成最终投资决策，并把意向性承购协议转为具约束力、可融资的合同。
            claimRefs:
