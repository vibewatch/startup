      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持分母统一的 TAM/SAM/SOM 传统拆分。HIF 2024 年可持续发展材料预计，到 2035 年全球可持续燃料市场将超过 250 million tonnes of
              e-methanol-equivalent；更早报告则转述 McKinsey 预计 2030
              年电子燃料年供应缺口为五百万吨。这些数字的指标、日期和范围都不同，所依据的市场研究也不在指定来源中。已宣布的工厂产能是供应标记，不是市场规模：行业报道提到得州每年 1.4 million
              tonnes、塔斯马尼亚每年 210,000 tonnes，而乌拉圭设计产能从早先的 700,000 tonnes 变为 HIF 2026 年 3 月披露的最高 876,000
              tonnes/year。差异可能来自重新设计或版本不同，但来源未予调和。这些标记说明潜在规模，却仍无法确定可触达、可融资和已签约的数量。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
