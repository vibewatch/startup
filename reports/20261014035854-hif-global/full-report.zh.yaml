      - 哪些事实会改变判断
    rows:
      - - 运营证明与技术
        - Haru Oni 是全球唯一在运营的综合电子燃料设施；产品已获认证并出口欧洲。
        - 示范产能（甲醇 350 吨 / 年）相较拟建的吉瓦级项目管线微不足道。
        - Matagorda 或首条 Paysandú 生产线成功商业投产。
      - - 战略财团支持
        - MOL、Idemitsu、JOGMEC 提供 $200M 日本资金，另有 Porsche 和 EIG 赞助。
        - 企业风险投资者优先考虑获取分子，而非满足风险投资股权回报门槛。
        - 第三方机构成长股权投资者主导一轮公平交易定价。
      - - 输入经济性与电力成本
        - 可利用巴塔哥尼亚、得州和乌拉圭的世界级风能与太阳能资源。
        - 电力占运营支出 70%；乌拉圭项目因 $40/MWh 电力关税僵局而停滞。
        - 与国有公用事业或专属可再生能源园区签署低于 $40/MWh 的长期 PPA。
      - - 市场需求与承购
        - 全球已订购超过 380 艘双燃料船，带来结构性替代需求。
        - 绿色燃料相较化石燃料的高溢价，需要持续的监管合规补贴。
        - 签署具有约束力、设有价格指数化底价的海运承购合同。
    notes: 核心投资评估向量对比了战略市场优势与项目层面的资本密集度及商业化阻力。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV014
  - id: TV003
    title: 乐观、基准与悲观情景预测
    columns:
      - 情景
      - 概率
      - 核心运营假设
      - 隐含估值 / 回报逻辑
      - 关键下行触发因素
    rows:
      - - 乐观情景（大型项目执行）
        - 20%
        - 乌拉圭电力 PPA 以 $40/MWh 签署；Paysandú 和 Matagorda 获得 FID；海运承购锁定 10 年底价。
        - 企业价值向 $3B-$5B 基础设施资产规模扩张；股权回报超过 25% IRR。
        - 欧盟 RFNBO 规定执行延迟，降低市场对绿色燃料合规的意愿。
      - - 基准情景（时间线拉长）
        - 55%
        - 电力关税稳定在约 $45/MWh；商业 FID 延迟 24 个月；通过高负债和伙伴股权完成融资。
        - 估值锚定成本加成；股权回报压缩至 10-14% 的基础设施门槛回报率。
        - 项目融资利率上升，推高氢和甲醇的平准化成本。
      - - 悲观情景（执行停滞）
        - 25%
        - 电力关税争议导致 Paysandú 取消；Matagorda EPC 成本失控；企业赞助方暂停后续股权投资。
        - 下轮融资重组；FID 前开发资本减记 50-80%。
        - HIF 取消乌拉圭项目，或伙伴财团撤回资本承诺。
    notes: 情景框架将商业执行概率与电力输入定价及项目融资条款进行对照。
    claimRefs:
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 涵盖 HIF Global 从 2016 年探索性研究到 2026 年工业许可的公司、运营、融资和监管关键里程碑。
    data:
      items:
        - date: 2016-2018
          label: 风能制 X 探索性研究
          detail: 创始赞助方 AME 在智利麦哲伦大区开展研究，确认适合 Power-to-X 合成燃料的世界级风能资源。
          tone: positive
        - date: 2020-10
          label: 在智利成立公司
          detail: Highly Innovative Fuels（HIF）在智利圣地亚哥正式成立，开发商业化合成燃料基础设施。
          tone: neutral
        - date: 2021-12
          label: 在美国注册母公司
          detail: HIF Global LLC 在美国成立，作为母公司控股实体，并在得州休斯敦设立办公室，统筹国际扩张。
          tone: neutral
        - date: 2022-04
          label: 股权融资轮
          detail: 获得 $260M 股权投资，由 Porsche AG、EIG Global Energy Partners、Baker Hughes、AME 和 Gemstone Investments 领投。
          tone: positive
        - date: 2022-12
          label: Haru Oni 示范项目启动
          detail: HIF Chile 在智利南部 Haru Oni 试点设施生产出首批合成汽油，展示综合电子燃料合成能力。
          tone: positive
        - date: 2024-06
          label: 日本资本扩张轮
          detail: 完成 $220M 融资，引入 Idemitsu Kosan、JOGMEC 和 Mitsui O.S.K. Lines，扩大商业项目和亚太供应。
          tone: positive
        - date: 2025-05
          label: 与 Porsche 和 Shell 签署商业供应协议
          detail: HIF Chile 与 Porsche AG 和 Shell 签署供应合同，将 Haru Oni 生产的电子燃料交付至汉堡 Shell Technology Centre。
          tone: positive
        - date: 2026-03
          label: Paysandú 环境申报
          detail: HIF Global 为乌拉圭 $5.3B 的 Paysandú 项目提交前置环境许可申请和环境影响研究。
          tone: positive
        - date: 2026-06
          label: 乌拉圭电价瓶颈
          detail: HIF Global 与乌拉圭国有公用事业 UTE 就工业电价（报价 $40/MWh）谈判陷入停滞，投资决策因此延迟。
          tone: negative
    approximationNotes: 时间线事件和日期来自经核实的公司可持续发展报告、官方监管公告和国际报道。
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO013
  - id: FM001
    title: 非加总市场与产能规模标记
    type: pyramid
    summary: 按序排列的规模标记展示主题市场估计、短缺估计、伙伴目标、规划工厂与当前示范产出之间的差距。
