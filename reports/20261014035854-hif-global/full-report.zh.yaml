        title: 资本充足性、融资依赖与尽调结论
        blocks:
          - type: paragraph
            body: >-
              HIF Global 已从资金实力雄厚的战略和产业伙伴处成功获得成长资本，包括 Porsche 2022 年 7,500 万美元股权投资，以及 2024 年由日本政府机构 JOGMEC、Idemitsu
              Kosan、Mitsui O.S.K. Lines 和 AME 支持的 $220m 融资。尽管有这笔股权，企业资本相对于在美国、南美和澳大利亚建设商业规模工厂所需的巨额资本开支仍很小。HIF Global
              不公开发布经审计财务报表、历史收入、公司现金消耗或现金跑道，财务评估因此高度依赖管理层私下披露。每个超过 50 亿美元的巨型项目都需要大额无追索权项目融资，债务与股权通常为 60:40 至 70:30。没有最终
              EPC 合同、获批环境许可和有约束力的长期承购承诺，机构债务银团无法推进。因此，虽然 HIF Global
              在电子燃料行业的运营可见度领先，但在商业项目完成融资、收入兑现得到证明前，公众投资者仍无法对其财务状况进行可靠评估。
