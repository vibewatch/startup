              合成电子燃料的商业承购根本上依赖国际可持续发展认证和排放追踪框架。HIF Global Haru Oni 工厂生产的燃料通过 ISCC Plus 认证，并以 100
              多项例行实验室质量控制分析确认燃料纯度和辛烷值。受可再生能源指令约束的欧洲承购市场要求合成燃料符合 RFNBO 标准，欧盟委员会于 2024 年 12 月通过 ISCC EU
