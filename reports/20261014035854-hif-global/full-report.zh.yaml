  - id: FV001
    title: 推荐决策流程：从验证到投资判断
    type: flow
    summary: 该决策树展示了运营验证和战略支持如何因估值与电力成本存在缺口，最终导向继续研究的判断。
    data:
      nodes:
        - id: haru-oni-proof
          label: 运营验证（Haru Oni 示范项目）
        - id: consortium-backing
          label: 战略支持（Porsche、EIG、MOL、Idemitsu）
        - id: capex-scaling
          label: 千兆瓦级项目规模（$5.3B+ Paysandú / Matagorda）
        - id: input-cost-friction
          label: 输入电力成本分歧（$40/MWh vs 公用事业）
        - id: valuation-opacity
          label: 私有估值不透明（无公开条款 / 倍数）
        - id: recommendation-stance
          label: 投资判断：继续研究 / 跟踪
      edges:
        - from: haru-oni-proof
          to: consortium-backing
          label: 吸引战略资本
        - from: consortium-backing
          to: capex-scaling
          label: 为项目管线开发提供资金
        - from: capex-scaling
          to: input-cost-friction
          label: 遇到电力成本障碍
        - from: input-cost-friction
          to: valuation-opacity
          label: 叠加私有条款影响
        - from: valuation-opacity
          to: recommendation-stance
          label: 促成审慎持有
    approximationNotes: 这条逻辑链将定性和定量尽调证据连接到最终的投资建议判断。
