      - number: '4.3'
        title: 成本结构、单位经济性与电力敏感度
        blocks:
          - type: paragraph
            body: >-
              合成燃料的运营成本主要是工业水电解槽制取绿氢所需的电力。运营数据和项目披露表明，电力约占合成燃料工厂总可变运营成本的 70%。因此，工厂经济性对当地可再生购电协议电价极其敏感。乌拉圭 $5.3b 至 $5.4b
              的 Paysandú 工厂因 HIF 需要约 $40/MWh 才能维持财务可行性、而国有公用事业 UTE 要价更高而停滞。邻近的巴拉圭、智利和巴西电力市场可提供 $25 至 $36/MWh
              的可再生电力基准，但跨区域输电约束和基础设施需求会制造本地摩擦。此外，商业工厂数十亿美元的资本开支（包括得州 Matagorda 县工厂预计
              $6.0b）带来沉重偿债负担；没有有保障的低成本基准电力，就无法据此评估融资。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI011
              - CI014
              - CI015
