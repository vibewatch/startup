      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 先发运营证明与一流战略支持
            body: >-
              作为全球首座投入运营的一体化电子燃料示范工厂 Haru Oni 的运营商，HIF Global 拥有少见的先发优势。其股权结构表汇集工业电力开发商 AME、高端汽车制造商 Porsche、专业能源基础设施融资机构
              EIG，以及有主权背景的亚洲能源进口商 Idemitsu、JOGMEC 和 MOL，从技术、资本到未来承购，都有关键战略伙伴撑腰。
            calloutType: strength
            claimRefs:
              - CO002
              - CO005
              - CO007
          - type: callout
            title: 商业规模下的资本密集度与电价脆弱性
            body: >-
              从 Haru Oni 示范产量走向商业巨型项目（Paysandú $5.3b、Matagorda 数十亿美元）会把 HIF Global 暴露在严重的投入成本风险下。电力约占电子燃料运营支出的
              70%；若无法锁定不高于 $40/MWh 的长期电价，项目单位经济性、最终投资决策和资本部署都会受威胁。
            calloutType: risk
            claimRefs:
              - CO011
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采购体系
        blocks:
          - type: paragraph
            body: >-
              相关市场比全部低碳燃料窄，却比单一电子汽油产品宽。HIF 的生产平台先制造电子甲醇，既可用于海运和化工，也可进一步转成电子汽油和电子 SAF，用于道路和航空。因此本章纳入 HIF
              能供应分子的可再生甲醇和电制交通燃料采购，同时将商业绿氢、可再生能源设备、传统化石燃料和生物燃料排除在外（除非作为替代品或基准）。电气化和生物燃料是相邻的脱碳路径，并不自动转化为 HIF
              的收入。采购体系也是多方参与：船运商和航空燃料供应商创造需求，分销商和炼厂负责交付，OEM 可验证兼容性，监管规则则让高价燃料采购具备商业必要性。Idemitsu 宣布的 2035 年 50 万吨供应目标以及
              Shell-Porsche 交付安排，证明了渠道和示范路径，但不等于商业项目规模的约束性需求。
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
