              - CM006
              - CM007
              - CM009
              - CM010
      - number: '2.3'
        title: 需求驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              监管是最清晰的需求机制。HIF 的政策摘要介绍欧盟可再生燃料、海运碳强度和航空掺混要求；ICAO 则称 CORSIA
              是首个适用于一个行业的全球市场化机制，并明确将可持续航空燃料与其他行业内措施并列。这些框架可能把采购从可选试点推向合规预算，但不会保证 HIF 获得订单。供给侧仍不成熟：IEA 报告称已有 200
              多项低排放氢投资获得承诺，同时警告成本、基础设施准备度和监管变化使增长不均衡。HIF 自己称电力最高可占绿氢生产成本的 70%。关于 Paysandu
              的独立报道虽采用不同分母，却得出相同商业结论：电力约占工厂运行成本的 70%，HIF 与国有公用事业仍未就价格达成一致。因此，政策需求必须先跨过地点特定的电价和融资门槛。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 采用路径与估值含义
        blocks:
          - type: paragraph
            body: >-
              HIF 已证明有运营产量和产品处理能力，但商业采用仍是一条待走通的序列，而非成熟的规模市场。AME 披露 Haru Oni 的产能为电子甲醇 350 吨/年、电子汽油 13 万升/年；HIF 披露已通过
              Shell 向 Porsche
              的灯塔式活动交付电子汽油。下一步不是简单地把示范规模乘以名义产能。每个商业项目都需要认证的全生命周期表现、可负担的可再生电力和碳源、稳定监管、可融资的长期承购以及融资。估值因此应更看重已签约的贡献毛利量和项目层面的
              FID 证据，而不是宽泛的市场预测或宣布产能。关键尽调缺口，是从政策目标和伙伴兴趣连接到价格、数量、罚则、期限、信用支持以及每座工厂可融资部分的合同级桥梁。没有这座桥，主题市场再大，也不能证明 HIF
              能拿到其中份额。
            claimRefs:
              - CM003
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 监管创造需求，但不会直接分配份额
            body: 海运和航空规则可以创造合规预算，但 HIF 仍需拿到认证燃料、可融资合同并实现交付经济性，才能捕获这些需求。
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
              - CM016
          - type: callout
            title: 电价是采用的关键约束
            body: HIF 认为电力最高占绿氢生产成本的 70%；独立报道虽采用另一种工厂运行成本分母，却在 Paysandu 得出相近的约 70% 暴露。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 替代脱碳路径与竞争格局
        blocks:
          - type: paragraph
            body: >-
              HIF Global 面对的商业竞争横跨交通和工业燃料的四类玩家：直接合成电子燃料开发商、替代性生物甲醇生产商、传统化石燃料供应商和相邻的电气化技术。在合成电子燃料领域，商业竞争已超越孤立技术试验。2025 年
              8 月，European Energy 与 Mitsui & Co. 在丹麦启用全球首座大型商业电子甲醇工厂，为北欧树立运营基准。同时，生物源生物甲醇已是即时商业替代品，Methanol Institute
              跟踪的全球可再生及低碳甲醇项目管线达 286
              个。生物源燃料的前期资本开支低于直接空气捕集合成，但受地理分散的生物质收集瓶颈拖累。传统船用柴油和超低硫燃油仍是主流基准，拥有较低的前期能源成本和成熟的全球加注网络，却承受国际海事监管机构日益加重的排放处罚。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
