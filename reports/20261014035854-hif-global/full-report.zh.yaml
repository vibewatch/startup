      - number: '4.2'
        title: 定价机制、市场基准与绿色溢价
        blocks:
          - type: paragraph
            body: >-
              与传统石油化石燃料相比，合成电子燃料的成本和售价溢价都很高。美国当前的试点生产经济性显示，终端价格约为 31 美元/加仑，早期部署几乎只能用于豪华汽车展示、Porsche Mobil 1 Supercup
              等赛车系列和小众营销示范。eFuel Alliance 等倡导组织预计，到 2030 年工业化生产可把欧洲柴油当量成本降至约 7 美元/加仑，但这需要巨额资本投入、供应链成熟和持续政策支持。HIF Global
              依赖欧盟 RFNBO 规则及国际海事碳监管框架，来支撑企业买家支付的高额绿色溢价。若没有带公式底价的可执行承购合同，商业价格实现仍会受监管要求波动和更便宜的替代脱碳路径影响。
