figures:
  - id: FM001
    title: Non-additive market and capacity scale markers
    type: pyramid
    summary: >-
      Ordered scale markers show the gap between thematic market estimates, shortage
      estimates, partner ambitions, planned plants, and today's demonstration output.
    data:
      items:
        - label: Global sustainable-fuels market estimate for 2035
          value: 250
          unit: million tonnes e-Methanol equivalent
          valueNote: Company-reported external projection; not HIF TAM.
        - label: Forecast e-Fuels supply shortage for 2030
          value: 5
          unit: million tonnes per year
          valueNote: HIF summary of a McKinsey study; underlying study not retained.
        - label: Matagorda announced capacity
          value: 1.4
          unit: million tonnes e-Methanol per year
          valueNote: Planned nameplate reported by ENGINE.
        - label: Paysandu current announced capacity
          value: 0.876
          unit: million tonnes e-Methanol per year
          valueNote: Up to 876,000 tonnes in HIF's March 2026 project statement.
        - label: Idemitsu 2035 supply ambition
          value: 0.5
          unit: million tonnes e-Methanol
          valueNote: Partner-wide supply goal; not HIF-contracted volume.
        - label: Tasmania announced capacity
          value: 0.21
          unit: million tonnes e-Methanol per year
          valueNote: Planned nameplate reported by ENGINE.
        - label: Haru Oni operating e-Methanol capacity
          value: 0.00035
          unit: million tonnes per year
          valueNote: 350 tonnes per year as reported by shareholder AME.
    approximationNotes: >-
      Tonnes were divided by one million solely for display. Items are ordered scale
      markers, not nested TAM/SAM/SOM layers; periods, scopes, and denominators differ
      and no values are added or converted into market share.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM009, CM010]
callouts:
  - calloutType: insight
    title: Regulation creates demand; it does not award share
    body: >-
      Maritime and aviation rules can create compliance budgets, but HIF still needs
      certified fuel, bankable contracts, and delivered economics to capture them.
    claimRefs: [CM012, CM013, CM016]
  - calloutType: risk
    title: Power price is the pivotal adoption constraint
    body: >-
      HIF identifies electricity as up to 70% of green-hydrogen production cost, while
      independent reporting uses a separate plant-running-cost denominator but finds a
      similar roughly 70% exposure in Paysandu.
    claimRefs: [CM014, CM015]
