company:
  name: HIF Global
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    HIF addresses a policy-created market for electricity-derived fuels in shipping,
    aviation, and selected road and chemical uses, where compatibility with existing
    infrastructure is attractive but low-cost power, certification, long-term offtake,
    and project finance determine adoption. The assigned evidence supports large
    demand and capacity markers, but not an independently auditable HIF-specific TAM,
    SAM, or SOM.
sections:
  - id: market-boundary-and-buyers
    title: Market boundary and buying system
    body: >-
      The relevant market is narrower than all low-carbon fuels and broader than one
      e-gasoline product. HIF's production platform first creates e-methanol, which can
      be sold into marine and chemical uses or converted into e-gasoline and e-SAF for
      road and aviation applications. This chapter therefore includes procurement of
      renewable methanol and electricity-derived transport fuels where HIF can supply
      the molecule, while excluding merchant green hydrogen, renewable-power equipment,
      conventional fossil fuels, and biofuels except as substitutes or benchmarks.
      Electrification and biofuels remain adjacent decarbonization paths rather than
      revenue automatically available to HIF. The buying system is also multi-party:
      ship operators and aviation fuel suppliers create demand, distributors and
      refiners handle delivery, OEMs can validate compatibility, and regulators make
      premium fuel purchases commercially necessary. Idemitsu's stated 500,000-tonne
      2035 supply ambition and the Shell-Porsche delivery arrangement show channel and
      demonstration pathways, not disclosed binding demand at commercial-project scale.
    claimRefs: [CM001, CM002, CM010, CM011]
    tableRefs: [TM001, TM003]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The retained evidence does not support a conventional TAM/SAM/SOM stack with a
      common denominator. HIF's 2024 sustainability material cites an expectation that
      the global sustainable-fuels market will exceed 250 million tonnes of
      e-methanol-equivalent by 2035, while its earlier report relays a McKinsey estimate
      of a five-million-tonne annual e-fuels supply shortage in 2030. Those are different
      metrics, dates, and scopes, and neither underlying market study is present in the
      assigned source pool. Announced plant capacities are supply markers rather than
      market size: trade reporting described 1.4 million tonnes per year in Texas and
      210,000 tonnes per year in Tasmania, while Uruguay's stated design changed from
      an earlier 700,000-tonne account to HIF's March 2026 figure of up to 876,000
      tonnes per year. The discrepancy may reflect redesign or vintage, but the sources
      do not reconcile it. These markers establish potential scale while leaving
      addressable, financeable, and contracted volume unknown.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: demand-drivers-and-constraints
    title: Demand drivers and adoption constraints
    body: >-
      Regulation supplies the clearest demand mechanism. HIF's policy summary describes
      EU renewable-fuel, maritime-carbon-intensity, and aviation blending requirements,
      while ICAO describes CORSIA as the first global market-based scheme applying to
      a sector and explicitly places sustainable aviation fuels alongside other
      in-sector measures. These frameworks can move purchasing from optional pilots
      toward compliance budgets, but they do not guarantee HIF awards. The supply side
      is less mature: the IEA reports more than 200 committed low-emissions-hydrogen
      investments while warning that growth remains uneven because of costs,
      infrastructure readiness, and evolving regulation. HIF itself says electricity
      can represent up to 70% of green-hydrogen production cost. Independent reporting
      on Paysandu uses a different denominator but reaches the same commercial concern,
      stating that power is roughly 70% of plant running costs and that HIF and the
      state utility remained apart on price. Policy demand must therefore clear a
      location-specific power-price and financing threshold.
    claimRefs: [CM012, CM013, CM014, CM015]
  - id: valuation-and-diligence-implications
    title: Adoption path and valuation implications
    body: >-
      HIF has evidence of operating output and product handling, but the commercial
      adoption path is still a sequence rather than an established volume market.
      AME reports Haru Oni capacity of 350 tonnes per year of e-methanol and 130,000
      litres per year of e-gasoline; HIF reports delivery of e-gasoline through Shell
      for Porsche lighthouse events. The next step is not simply multiplying those
      demonstrations by announced nameplate capacity. Each commercial project needs
      certified lifecycle performance, affordable renewable electricity and carbon,
      durable regulation, bankable long-term offtake, and financing. Valuation should
      therefore weight contracted margin-bearing volume and project-level FID evidence
      more heavily than broad market estimates or announced capacity. The key diligence
      gap is a contract-level bridge from policy targets and partner interest to price,
      volume, penalties, tenor, credit support, and the portion of each plant already
      financeable. Without that bridge, a large thematic market does not establish
      HIF's obtainable share.
    claimRefs: [CM003, CM011, CM013, CM014, CM015, CM016]
