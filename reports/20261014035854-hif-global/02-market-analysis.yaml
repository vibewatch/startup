      - [Road e-Gasoline, Fuel distributor OEM or specialty fleet, Existing combustion-engine vehicle, Fleet operator sponsor or end customer, Blend distribute and validate engine compatibility, Marketing motorsport or fleet procurement, Drop-in demonstration or policy-supported legacy-fleet decarbonization]
