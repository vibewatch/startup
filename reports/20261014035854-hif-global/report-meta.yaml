companyProfile:
  summary: >-
    HIF Global is an international synthetic fuels developer that converts renewable electricity and captured carbon
    dioxide into e-methanol, e-gasoline, and sustainable aviation fuel. The company has operating proof through Haru Oni
    in Chile, is backed by industrial and strategic investors, and is advancing a multi-jurisdiction project pipeline in
    Uruguay, Chile, Texas, and Tasmania.
  foundingLocation: Santiago, Chile
  headquarters: Houston, Texas and Santiago, Chile
  productSummary: >-
    Projects and produces drop-in synthetic fuels, including e-methanol, e-gasoline, and SAF, from renewable power,
    green hydrogen, and captured CO2.
  customerFocus: Industrial and mobility buyers that need drop-in low-carbon liquid fuels without major infrastructure changes.
  businessModel: >-
    Project development and commercial supply of synthetic fuels through large-scale e-fuels plants and offtake-led
    sales.
  stage: growth
  fundingStatus: Private-disclosed; HIF has announced roughly USD 480 million of equity commitments across its 2022 and 2024 rounds.
