  topStrengths:
    - First-mover operating proof at Haru Oni.
    - Strong strategic and industrial backers spanning auto, energy, and sovereign-linked partners.
    - Multi-market project pipeline with commercial-scale optionality.
  topRisks:
    - Power pricing and input-cost sensitivity remain the biggest constraint on commercial economics.
    - Permitting and first-of-a-kind scale-up execution could delay or weaken project timelines.
    - Valuation, cap table, and audited financials remain opaque.
