evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: corporate-financials
    missingEvidence: >-
      Audited corporate financial statements disclosing annual revenue run-rate, gross margin, EBITDA, net loss, cash
      burn, and cash balance.
    whyItMatters: >-
      As a privately held developer, HIF Global does not publish financial statements, preventing quantitative
      assessment of operating cash runway and stand-alone commercial viability.
    diligencePath: >-
      Obtain confidential financial disclosure packet or audited accounts through direct investor diligence under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation-and-capital-structure
    missingEvidence: >-
      Current corporate post-money valuation, detailed cap table after the 2024 capital raise, share class seniority,
      and liquidation preference terms.
    whyItMatters: >-
      Without valuation multiples, dilution percentages from Japanese investors, or debt covenants, investors cannot
      determine effective enterprise value or downside protection.
    diligencePath: >-
      Review shareholder agreements, term sheets, and capitalization tables from the April 2022 and 2024 financing
      rounds with corporate management.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent market studies with definitions datasets and regional fuel-price assumptions sufficient to calculate
      HIF-specific TAM SAM and SOM.
    whyItMatters: >-
      Company-reported market markers cannot establish obtainable share or a valuation multiple without common scope
      period and denominator.
    diligencePath: >-
      Obtain the underlying McKinsey study and independent maritime aviation and chemical demand datasets then reconcile
      them to HIF-eligible certified volume.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: offtake-coverage
    missingEvidence: >-
      Executed offtake contracts showing binding volume price formula tenor penalties credit support and allocation by
      planned facility.
    whyItMatters: >-
      Partner interest and demonstration deliveries do not establish bankable demand or the share of announced capacity
      that can support final investment decisions.
    diligencePath: >-
      Review contract schedules and lender models for Porsche Shell Idemitsu and other counterparties and map contracted
      volumes to each production train.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: material
    topic: planned-capacity
    missingEvidence: >-
      A dated project-capacity reconciliation explaining Paysandu's reported change from 700000 to up to 876000 tonnes
      per year and current schedules elsewhere.
    whyItMatters: >-
      Capacity vintage changes alter supply comparisons capital intensity and the denominator used for contracted-volume
      coverage.
    diligencePath: >-
      Obtain current FEED packages permitting submissions and board-approved schedules for Paysandu Matagorda and
      Tasmania and reconcile every public figure by date.
    relatedQuestionRefs:
      - QM007
      - QM008
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: offtake-pricing-terms
    missingEvidence: >-
      Detailed contract pricing, volume escalation schedules, and penalty clauses for long-term Heads of Agreement
      signed with Mabanaft and eFuel One.
    whyItMatters: >-
      Without realized net-back pricing, underwriting cannot verify whether customer commitments cover
      multi-billion-dollar FOAK plant capex or rely on speculative future green premiums.
    diligencePath: >-
      Request confidential commercial offtake term sheets and credit-support guarantees during confirmatory legal
      diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: power-tariff-agreements
    missingEvidence: >-
      Executed long-term power purchase agreements (PPAs) with UTE in Uruguay confirming finalized electricity rates vs
      HIF's $40/MWh target.
    whyItMatters: >-
      Power comprises approximately 70% of e-fuel plant operating costs; failure to secure low-cost electricity
      threatens project cancellation or relocation.
    diligencePath: >-
      Review government gazette notices and UTE utility board resolutions regarding industrial e-fuel tariff
      concessions.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: corporate-financial-disclosure
    missingEvidence: Audited corporate income statements, cash flow statements, and balance sheet cash balances for HIF Global
    whyItMatters: >-
      Without audited operating financials, underwriting cannot assess corporate cash burn, corporate-level runway, or
      historical revenue realization from pilot operations
    diligencePath: >-
      Request private financial statements, auditor letters, and current monthly cash burn figures directly under
      non-disclosure agreement
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: offtake-contract-terms
    missingEvidence: >-
      Binding commercial pricing formulas, minimum take-or-pay volumes, and indexation mechanisms for e-methanol and
      e-gasoline off-take agreements
    whyItMatters: >-
      Determining project debt service coverage ratios and equity returns requires knowing realized off-take prices
