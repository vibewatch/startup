    diligencePath: >-
      Inspect executed off-take and supply contracts with anchor partners (Porsche, Idemitsu, Shell) during confirmatory
      diligence
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: developer-signal-practitioner-proxy
    missingEvidence: >-
      Public developer repositories, SDKs, and software API documentation are absent because HIF Global builds physical
      synthetic fuel production plants rather than developer software platforms.
    whyItMatters: >-
      Standard developer telemetry such as GitHub stars, package downloads, and developer forum activity cannot be used
      to gauge technical maturity; engineering diligence must focus on plant run-time data, equipment warranties, and
      EPC agreements.
    diligencePath: >-
      Review confidential EPC completion records from Techint E&C, Siemens Energy electrolyser operational availability
      logs from Haru Oni, and process yield warranties under confidentiality agreement.
  - type: missing-source
    severity: material
    topic: long-term-power-pricing-paysandu
    missingEvidence: >-
      Finalized binding power purchase agreement and transmission wheeling tariffs between HIF Global and the Uruguayan
