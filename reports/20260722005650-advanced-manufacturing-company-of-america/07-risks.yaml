tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule/license/case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - CMMC 2.0 DFARS acquisition rule
    - United States / DoD
    - Effective November 10, 2025 with three-year phase-in
    - High
    - Critical
    - Map CUI/FCI systems, assessments, SPRS uploads, annual affirmation owners, and supplier flow-downs
    - Legacy acquisitions may have inconsistent controls, documentation, cloud boundaries, or assessor readiness
    - Review contract clauses, CMMC level by contract, SPRS records, C3PAO plan, POA&Ms, and annual affirmation sign-off process
  - - False Claims Act exposure from cybersecurity affirmations
    - United States / DoD / DOJ
    - Annual affirming official representations required for covered information systems
    - Medium
    - High
    - Board-level compliance certification protocol and evidence retention
    - Incorrect self-assessment or stale compliance can become contract, suspension, or FCA exposure
    - Have counsel review affirmation workflow, historic DFARS 7012 compliance, and remediation evidence
  - - ITAR registration and export controls for defense articles
    - United States / DDTC/BIS
    - Required where defense articles, technical data, or export-controlled services are handled
    - Medium
    - High
    - Central export-control owner, registration evidence, visitor/data controls, and technical-data segregation
    - Public sources do not disclose AMCA registration scope or inherited subsidiary controls
    - Request ITAR/DDTC registration, export-classification matrix, licenses, audits, and voluntary-disclosure history
  - - AS9100 quality management certification
    - Global aerospace customer quality standard
    - Public sources describe AS9100-certified sites and required compliance processes
    - Medium
    - High
    - Acquisition diligence should preserve certificates, audit trails, corrective actions, and special-process controls
    - Loss or scope gaps could block customer qualification and flight-critical shipments
    - Inspect site certificates, registrar findings, customer scorecards, and change-of-ownership audit impact
  - - Classified-program handling and controlled technical data
    - United States / DoD
    - BC Systems supports multiple growing classified defense programs according to AMCA
    - Medium
    - High
    - Facility/personnel-clearance governance, need-to-know controls, export and CUI segregation
    - Public record does not prove facility clearance status, derivative-classification procedures, or program-specific flow-down readiness
    - Verify FCL/cleared personnel status where applicable, CUI markings, secure networks, and classified contract clauses
  - - Prime and subcontractor flow-down obligations
    - United States / DoD supply chain
    - CMMC and quality clauses flow down to subcontractors handling FCI/CUI or critical requirements
    - High
    - High
    - Supplier qualification, cyber clauses, quality flow-down, and audit cadence integrated into M&A playbook
    - Specialized legacy suppliers may lack documentation maturity and could lose eligibility
    - Sample top suppliers and acquired entities for CMMC, ITAR, AS9100, counterfeit-parts, and source-inspection evidence
  notes: Severity-ranked legal register; likelihood and residual exposure are diligence judgments based on legal/regulatory sources and AMCA public disclosures.
