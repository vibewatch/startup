  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Regulatory / legal risk register coverage
    missingEvidence: Complete AMCA counsel-certified schedule of all applicable ITAR, EAR, CMMC, AS9100, classified-program, environmental, safety, and customer-flowdown obligations by entity and contract.
    whyItMatters: The public register is severity-ranked but partial; undisclosed contract clauses or site-specific obligations could change eligibility and residual risk.
    diligencePath: Request legal/compliance matrix, contract sample, export-control memo, CMMC package, AS9100 certificates, and classified-handling procedures.
    relatedQuestionRefs:
    - QR002
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: factory-level operating metrics
    missingEvidence: Site-level on-time delivery, quality escapes, rework, scrap, utilization, qualification cycle time, bottleneck equipment, and labor-retention metrics before and after acquisition.
    whyItMatters: AMCA’s risk mitigation depends on proving RAPID and integration actually improve qualified production rather than creating brittle centralized complexity.
    diligencePath: Review monthly operating reviews, customer scorecards, AS9100 corrective actions, shop-floor KPIs, and acquisition integration dashboards.
    relatedQuestionRefs:
    - QR023
    - QR010
    - QR028
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: financial disclosure and concentration
    missingEvidence: Audited financial statements, revenue by customer/platform, backlog by funded contract, gross margin, inventory turns, receivables aging, capex, debt, and acquisition integration budget.
    whyItMatters: The public record confirms funding and valuation but not whether the acquisition-funded roll-up can scale without margin compression or repeated equity dependence.
    diligencePath: Request quality-of-earnings report, backlog waterfall, platform/customer concentration schedule, debt schedule, capex plan, and working-capital bridge.
    relatedQuestionRefs:
    - QR024
    - QR017
    - QR018
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: ITAR and classified program controls
    missingEvidence: Direct evidence of AMCA ITAR/DDTC registration scope, export classification controls, facility clearance where needed, and procedures for handling controlled or classified technical data.
    whyItMatters: Defense growth can be blocked or materially impaired if export-control or classified-program obligations are not owned centrally across acquired entities.
    diligencePath: Ask management and counsel for registration records, export-control matrix, TCPs, visitor controls, FCL/personnel-clearance status, and any disclosures or enforcement correspondence.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: people and succession
    missingEvidence: Founder succession plan, plant-GM bench, selling-owner retention packages, key-person insurance, board emergency authority, and knowledge-capture progress for legacy experts.
    whyItMatters: AMCA’s model depends on specialized acquired-company knowledge and visible founder execution; attrition could undermine both integration and customer trust.
    diligencePath: Review organization chart, retention grants, earnouts, noncompetes, succession minutes, and knowledge-transfer artifacts by acquisition.
    relatedQuestionRefs:
    - QR031
    - QR020
    relatedTableRefs:
    - TR004
    - TR005
