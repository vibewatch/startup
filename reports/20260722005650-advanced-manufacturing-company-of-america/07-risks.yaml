- id: operational-integration-and-quality-risk
  title: Operational integration, qualification, and quality risk
  body: The operating risk is that AMCA's solution to the industrial-base bottleneck is itself exposed to the same bottleneck. AMCA has scaled to six critical-component factories plus an El Segundo prototyping and testing facility, 123,000+ square feet of qualified capacity, multiple recent acquisitions, and a RAPID workflow meant to reduce development-to-deployment lead time by more than 67%. That scale-up is impressive, but it increases the number of inherited ERP systems, quality procedures, suppliers, tooling constraints, machinist gaps, customer qualifications, and single-source failure points that must be harmonized. Oliver Wyman's 2026 defense supply-chain survey describes a nearly $900 billion backlog, a sub-tier “hollow middle,” weak forecast credibility, labor constraints, and Tier 2+ suppliers with limited financial and operational room to absorb ramp demand. Roland Berger separately reports that personnel shortages remain the most common aerospace ramp-up challenge at 65%, with production-capacity and financing constraints still material. AMCA can mitigate by codifying common quality metrics, qualification queues, technical-data-package ownership, supplier substitutability,
    workforce capture, and facility utilization, but residual risk remains high until private factory-level throughput and escape-rate evidence is reviewed.
  claimRefs:
