- id: partner-customer-and-program-dependency
  title: Partner, customer, and program dependency risk
  body: 'AMCA''s customer logos and platform exposure are attractive, but they concentrate the risk surface around Boeing, Lockheed Martin, DoD sustainment, and programs such as the F-35. The strongest adverse evidence is external: GAO reports that F-35 mission-capable rates fell from 67% in FY2021 to 44% in FY2025 and full-mission-capable rates fell from 38% to 25%, while the Global Support Solution Reset needs $13.7 billion more through FY2031, more than $7 billion of additional private-sector parts and material, and must overcome industry-capacity constraints and a more than $1 billion annual affordability gap by the mid-2030s. Breaking Defense, Air & Space Forces Magazine, and Defence Industry Europe corroborate the same readiness decline and cite spare-parts, depot, technical-data, software, corrosion, and supplier-base constraints. This is a double-edged signal for AMCA: readiness shortages create demand, but a dysfunctional prime/program ecosystem can delay qualifications, stretch working capital, or force AMCA into thin-margin surge commitments. The diligence question is whether AMCA has diversified programs, enforceable purchase commitments, customer concentration limits, and
    qualification control, rather than simply more exposure to stressed platforms.'
