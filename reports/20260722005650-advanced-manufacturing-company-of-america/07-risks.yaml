company:
  name: Advanced Manufacturing Company of America
chapter:
  number: 7
  title: Risks
  summary: 'AMCA''s adverse case is concentrated in regulated-defense execution: CMMC/ITAR/AS9100 obligations, classified-program handling, roll-up integration, and customer/program concentration collide with public evidence that the F-35 sustainment base is underperforming. GAO''s 2026 F-35 report and CMMC legal sources make this a diligence-first chapter: the upside only survives if AMCA proves compliance maturity, qualification throughput, working-capital control, and depth beyond Jai Malik and Eli Giovanetti.'
sections:
- id: regulatory-legal-and-compliance-burden
  title: Regulatory, legal, and compliance burden
  body: 'AMCA is building inside a rule set that can move from qualification advantage to gating risk. The company publicly says its manufacturing base is AS9100-certified and serves defense platforms, classified programs, and U.S. sustainment needs, which makes ITAR, export-control, cybersecurity, quality-system, and classified-handling discipline central rather than back-office. CMMC is the clearest dated risk: Pillsbury and Fox Rothschild both state the final DFARS acquisition rule became effective on November 10, 2025, with a three-year phase-in, annual SPRS affirmations, flow-down obligations, and False Claims Act exposure for inaccurate compliance representations. DefenseScoop adds the adverse operating reality that many defense-industrial-base suppliers remain unprepared and may need months of process, documentation, or cloud redesign to prove controls. For AMCA, this is not merely a checklist; acquiring legacy suppliers creates inherited system boundaries, inconsistent policies, supplier-flowdown evidence gaps, and bid eligibility risk. Mitigation should include a mapped CUI/FCI inventory, CMMC level by contract, ITAR/export-control registration evidence, AS9100 audit exceptions,
    classified-program facility procedures, and annual affirmation governance before underwriting defense growth.'
