- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold/event
  - Action implication
  rows:
  - - CMMC eligibility
    - CMMC level by contract, SPRS score, C3PAO schedule, annual affirmation owner
    - Missed contract eligibility, unsupported affirmation, or critical supplier unable to prove required status
    - Do not underwrite defense growth until remediation and counsel sign-off are complete
  - - ITAR / export-control compliance
    - DDTC registration, export classification, controlled technical-data procedures
    - Missing registration where required, unauthorized access/export, or unresolved voluntary-disclosure matter
    - Pause investment or require indemnity, escrow, and remediation covenant
  - - AS9100 / flight-critical quality
    - Registrar findings, customer escapes, corrective-action closure, on-time delivery
    - Loss of certification, major escape, repeated late corrective actions, or failed customer audit
    - Reprice or block close until quality system stabilizes
  - - Qualification throughput
    - Cycle time from design to qualified production and customer approval
    - RAPID lead-time claims fail in real customer qualification data or slip critical delivery windows
    - Condition financing on milestone evidence and customer acceptance
  - - F-35 / prime concentration
    - Revenue/backlog by platform, prime, and funded program
    - Any one platform or prime dominates without firm purchase commitments or margin protection
    - Require diversification plan, customer covenants, or lower valuation
  - - Working capital and integration cost
    - Inventory turns, receivables aging, capex, debt, integration budget
    - Cash conversion deteriorates as factories scale or acquisitions require repeated equity bridge
    - Reprice, tranche financing, or require audited working-capital covenant
  - - Key-person continuity
    - Founder/COO succession, plant GM retention, selling-owner transition
    - No credible continuity plan for Malik, Giovanetti, or critical acquired-entity technical leaders
    - Condition investment on governance, retention grants, and board-approved succession
  - - Supplier substitution
    - Alternate-source qualification and technical-data ownership
    - Critical single-source component lacks alternate source, owned technical package, or recovery plan
    - Treat as thesis-break for readiness-resilience narrative until resolved
  notes: Kill criteria are diligence thresholds derived from the risk register; most require private evidence before investment approval.
