tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / alternative
  - Category
  - Public scale or funding signal
  - Target segment
  - Product scope
  - Differentiation versus AMCA
  - Limitation / diligence ask
  rows:
  - - AMCA
    - Acquire-and-modernize critical-component platform
    - $300M Series B; >$1B valuation; six factories and 123,000+ sq ft
    - Aerospace and defense primes, platforms, and U.S. sustainment programs
    - Hydraulics, avionics, power electronics, sensors, switches, magnetics, HMI, RAPID qualification workflow
    - Acquired AS9100 supplier base plus RAPID from design to qualified production
    - Need private win/loss, realized pricing, quality, and throughput proof
  - - Hadrian
    - AI-automated precision-parts factories
    - $260M Series C; nearly/>$500M raised; 270,000-sq-ft Factory 3 Mesa
    - Space, defense, naval, munitions, DoD priority programs
    - CNC parts, expanding to welding, casting, additive; factories-as-a-service
    - Higher automation intensity and committed-capacity model
    - Qualification depth and overlap with legacy supplier acquisitions need head-to-head proof
  - - Divergent Technologies
    - Digital/additive manufacturing platform
    - $290M Series E at $2.3B valuation
    - Aerospace, defense, automotive customers including Lockheed/Raytheon/General Atomics
    - DAPS rapid design, additive manufacturing, automated assembly
    - Strong digital thread and additive redesign capability
    - Less focused on acquiring legacy AS9100 supplier portfolios
  - - Senra Systems
    - Software-driven wire-harness manufacturer
    - $65M Series B; >$112M raised; 5x capacity expansion
    - A&D wire harness bottlenecks for aircraft, spacecraft, satellites, defense systems
    - Amp software platform plus harness production and technician training
    - Deep focus in a specific bottleneck component class
    - Narrower product scope than AMCA critical-component portfolio
  - - Anduril
    - Vertically integrated defense-tech platform
    - $5B Series H at $61B valuation; 2025 revenue reported at $2.2B
    - DoD and allied defense systems
    - Defense systems, Lattice software, manufacturing infrastructure, acquisitions
    - Scale, balance sheet, contracts, and prime-like systems integration
    - Not a pure supplier peer but can absorb supplier margins or acquire capacity
  - - TransDigm
    - Public A&D component roll-up
    - PCE named TransDigm/Victor Sierra Aviation as a $2.2B transaction
    - Aerospace aftermarket and proprietary components
    - High-margin proprietary components and acquisition integration
    - Mature roll-up playbook and acquisition discipline
    - Economics are mature-public-company benchmark, not startup operating proof
  - - Howmet Aerospace
    - Public aerospace manufacturing incumbent
    - PCE named Howmet/Consolidated Aerospace Manufacturing as a $1.8B transaction
    - Commercial and defense aerospace manufacturers
    - Engineered metal products and aerospace manufacturing
    - Scale, incumbent quality systems, and customer trust
    - Less direct AI-software modernization narrative
  - - VSE Corporation
    - Public sustainment/MRO acquirer
    - PCE named VSE/Precision Aviation Group as a $2.15B transaction
    - Aviation aftermarket, MRO, sustainment
    - Parts distribution, repair, and aftermarket services
    - Existing sustainment channels and acquisition appetite
    - Different value-chain layer but competes for scarce assets
  - - Traditional PE aerospace roll-ups
    - Financial sponsor platforms
    - PCE reported 19 financial-buyer A&D deals among 143 LTM transactions
    - Lower-middle-market A&D suppliers and services
    - Platform acquisitions, operational improvement, add-ons
    - Can bid for the same certified suppliers as AMCA
    - May lack RAPID-like tech story but can pressure acquisition prices
  - - Primes in-house / existing suppliers
    - Status quo substitute
    - Embedded in Boeing, Lockheed, Northrop, RTX, Airbus and program supply chains
    - Current program managers and procurement teams
    - Qualified incumbent supply, in-house engineering, approved vendor lists
    - Lowest adoption risk where current suppliers are adequate
    - Can be slow, capacity-constrained, or single-source
  - - Internal build / new factory by customer
    - Build substitute
    - Not externally funded; budgeted inside primes or defense-tech platforms
    - Large primes, Anduril-like vertical integrators, government programs
    - Captive engineering, tooling, qualification, production control
    - Maximum control and data ownership
    - Requires capital, labor, qualification time, and utilization risk
  - - New American Dynamism entrants
    - Likely entrant pool
    - a16z and others frame defense, AI, manufacturing, and onshoring as investable national-security sectors
    - Investors and founders pursuing industrial-base bottlenecks
    - New factories, software-defined manufacturing, component niches
    - May attack narrow high-margin bottlenecks quickly
    - Named future entrants and proof points are not yet public in this chapter
  notes: Representative public landscape as of 2026-07-22; not an exhaustive census of all AS9100 aerospace component suppliers or prime-owned
    internal capabilities.
