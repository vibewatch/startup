callouts:
- calloutType: risk
  title: The moat is qualification-led, not capital-proof
  body: AMCA’s best defense is the combination of certified supplier acquisitions, RAPID, and qualification depth. That can be durable, but it
    does not prevent Hadrian, Divergent, Senra, Anduril, or incumbent roll-ups from attacking specific component bottlenecks with more capital
    or embedded distribution.
  claimRefs:
  - CP024
  - CP034
  - CP035
  - CP041
- calloutType: insight
  title: Malik’s Countdown history sharpens the diligence question
  body: The same founder who now leads AMCA previously argued that small specialist hard-tech capital struggled against multi-stage firms. For
    AMCA, the diligence question is whether ownership, integration, and qualified production create an operating edge that venture access alone
    did not.
  claimRefs:
  - CP006
  - CP036
