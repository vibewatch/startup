- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or risk
  - Threat source
  - Severity
  - Evidence
  - Mitigation or diligence ask
  rows:
  - - Acquire-and-modernize certified suppliers
    - Strategics, PE roll-ups, primes competing for the same assets
    - High
    - PCE shows active A&D M&A and high median multiples
    - Review proprietary sourcing funnel, LOI conversion, seller references, and post-close integration metrics
  - - RAPID shortens design-to-qualified-production time
    - Hadrian automation, Divergent DAPS, Senra Amp, customer internal digital thread
    - High
    - AMCA claims >67% faster; peers all market software-defined production
    - Obtain cycle-time dataset by program with quality escapes and rework rates
  - - Qualification and technical data depth
    - Existing qualified suppliers and prime in-house teams
    - High
    - AS9100/ITAR/CMMC and platform qualification make switching slow
    - Audit qualification packages and customer acceptance by platform
  - - Component breadth across critical classes
    - Narrow specialists cherry-picking high-pain bottlenecks
    - Medium
    - Senra is focused on wire harnesses; Divergent on additive/digital production
    - Segment AMCA wins by component class and margin pool
  - - Capital access and investor syndicate
    - Anduril, Hadrian, Divergent, Senra backed with large rounds
    - High
    - Recent rounds range from $65M to $5B and include top-tier investors
    - Stress-test follow-on capital needs under acquisition and greenfield scenarios
  - - Distribution through named primes
    - Prime in-house supply and incumbent procurement relationships
    - Medium-high
    - AMCA names major customers, but public win/loss and evaluated alternatives are absent
    - Request customer references that explicitly discuss displaced alternatives
  - - Thesis credibility after Countdown closure
    - Malik’s own prior skepticism on hard-tech VC inefficiency
    - Medium
    - TechCrunch reported Malik argued multi-stage firms have advantages in industrial startups
    - Separate operating-company edge from venture-access thesis in investment memo
  - - Market tailwinds and industrial-base urgency
    - Many entrants can raise capital in the same tailwind
    - Medium
    - a16z, budget, market, and industrial-base sources all support broad capital inflows
    - Underwrite AMCA-specific execution KPIs rather than category momentum
  notes: Severity is author-assessed from public evidence; recalibrate after private acquisition pipeline, win/loss, qualification, and pricing
    diligence.
