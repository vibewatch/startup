  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor profile table
    missingEvidence: A complete census of every AS9100 aerospace and defense component supplier, private-equity platform, and prime-owned internal
      component operation competing with AMCA.
    whyItMatters: The profile table is intentionally a material public sample, so obscure private suppliers and captive internal operations may
      be missing.
    diligencePath: Build a buyer-by-platform approved-vendor map from customer procurement data, SAM.gov awards, AS9100 registries, and management’s
      CRM exports.
    relatedQuestionRefs:
    - QP001
    - QP025
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: win/loss
    missingEvidence: Customer-level win/loss data against Hadrian, Divergent, Senra, Anduril, incumbent suppliers, primes internal build, and
      PE-backed roll-ups.
    whyItMatters: Public positioning cannot prove whether AMCA actually displaces alternatives in production programs.
    diligencePath: Request anonymized opportunity exports, evaluated-alternative fields, proposal scores, reasons lost, and five customer calls
      discussing alternatives.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing and packaging
    missingEvidence: Realized unit pricing, capacity-reservation fees, discounts, minimums, qualification charges, and gross margin by component
      class for AMCA and named peers.
    whyItMatters: Pricing opacity prevents a true comparison of AMCA economics against factories-as-a-service, DAPS, harness programs, or incumbent
      suppliers.
    diligencePath: Review top contracts, quote histories, capacity commitments, costed BOMs, and renewal/expansion price changes under NDA.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: customer evaluated alternatives
    missingEvidence: Specific named customers that evaluated AMCA against Hadrian, Divergent, Senra, Anduril, incumbent roll-ups, or internal
      build before award.
    whyItMatters: Moat durability depends on head-to-head choice evidence, not just overlapping market narratives.
    diligencePath: Run reference calls with Boeing, Lockheed, Northrop, Honeywell, and DoD sustainment buyers focused on evaluated alternatives
      and switching frictions.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: Independent lead-time, quality, yield, rework, and dollar-per-qualified-part benchmarks comparing AMCA, Hadrian, Divergent,
      Senra, and incumbent suppliers.
    whyItMatters: RAPID and peer automation claims are not normalized to a common task or component class in public evidence.
    diligencePath: Commission a blind benchmark on comparable component programs using fixed qualification criteria, lead time, yield, and cost
      metrics.
    relatedQuestionRefs:
    - QP013
    - QP026
    relatedTableRefs:
    - TP002
