- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / package
  - Published price or contract model
  - Included capabilities
  - Unknowns / discount caveat
  - Competitive implication
  rows:
  - - AMCA critical-component programs
    - No public list price; likely part/program contracts and acquired-factory capacity
    - Engineering, qualification testing, technical data, certified manufacturing, RAPID support
    - Unit price, margin, minimums, capacity reservations, and discounts unavailable
    - Diligence must compare realized lead time and quality-adjusted cost, not list price
  - - Hadrian Factories-as-a-Service
    - No public list price; committed factory capacity model
    - Dedicated capacity for parts, assemblies, or complete products; AI factory automation
    - Utilization commitments, qualification cost, and customer economics private
    - May outflank AMCA when buyers want guaranteed new capacity rather than acquired suppliers
  - - Divergent DAPS production
    - No public list price; platform/program manufacturing model
    - Rapid design, additive manufacturing, automated assembly, aerospace/defense part production
    - Per-part economics versus legacy suppliers and qualification burden private
    - Strong where additive redesign creates performance or cost advantage
  - - Senra harness programs
    - No public list price; programmatic harness production
    - Quoting, engineering, manufacturing, supply chain, workflow software, training, harness output
    - Quality yield, realized cost, and customer contract terms private
    - Narrow but powerful competitor where harnesses are the chokepoint
  - - Anduril vertical integration
    - Defense systems contracts and supplier acquisitions; no comparable component list price
    - System design, Lattice software, manufacturing infrastructure, supplier control
    - Supplier make-versus-buy decisions and transfer pricing opaque
    - Can pull demand away from merchant suppliers if vertical integration wins
  - - Incumbent suppliers / roll-ups
    - Contracted part pricing and M&A economics; public multiples only
    - Qualified installed suppliers, aftermarket, MRO, proprietary components
    - Program-level prices, renewal terms, and prime discounts private
    - Status quo may be good enough if incumbents can add capacity
  notes: Public sources do not disclose realized unit pricing for AMCA or direct peers; rows compare packaging and contract model rather than
    true price parity.
