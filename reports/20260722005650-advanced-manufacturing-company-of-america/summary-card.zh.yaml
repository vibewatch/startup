  topStrengths:
    - 切中窗口期：防务科技投资创纪录、航空航天供应链紧缺，美国国防工业基础又脆弱且正在整合。
    - >-
      不是纯叙事，而是有真实运营资产——6 家以上合格工厂（123,000+ sq ft），以及 Electro-Mech、Cal-Draulics、Electrocube、Payne Magnetics 等已点名收购标的，已经向
      Boeing 等主承包商供货。
    - >-
      投资人阵容一线——Caffeinated Capital 领投，Andreessen Horowitz、Lightspeed、Lux Capital、Construct Capital、House Capital 和
      Founders Fund 参投。
    - RAPID 平台定位有差异化，相比传统加工车间供应商主打设计到量产速度；公司称交期缩短 67%+。
    - 创始人履历可信——Jai Malik（Countdown Capital）和 Eli Giovanetti（前 SpaceX 生产负责人）。
  topRisks:
    - 财务不透明——收入、ARR、毛利率、EBITDA、烧钱速度、现金跑道和现金余额均未公开；据报道约 ~$1.1B 的独角兽估值无法靠披露证据承保。
    - 地理分散的传统工厂需要被并购整合，执行风险高；AS9100/ITAR/CMMC 合规负担，以及 F-35/DoD 项目就绪度依赖，会进一步放大风险。
    - 防务科技估值泡沫明显；据报道 17x–50x 收入倍数和类 Anduril 对标，一旦资本市场情绪降温，就有回撤风险。
    - 客户和项目集中在少数主承包商（Boeing、Lockheed Martin、Northrop Grumman、RTX），还暴露在 DoD 预算与采购周期波动中。
    - 关键人依赖 Malik 和 Giovanetti，公开披露的高管梯队偏薄。
  unresolvedGaps:
    - 绝对收入、毛利率、EBITDA、净烧钱速度、现金跑道和现金余额均未披露，承保被卡住。
    - 投后股权结构表、持股比例、清算优先权，以及任何债务或信贷额度均未公开。
    - 客户 / 项目收入集中度、在手订单，以及已点名供货关系中量产与试点的占比仍不清楚。
    - RAPID 平台技术成熟度，以及交期缩短主张背后的独立验证基础尚未证实。
    - 并购经济性未披露——支付的收购倍数、已兑现的整合协同，以及未来 M&A 管线都看不到。
