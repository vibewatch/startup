- id: trust-quality-compliance-and-traceability
  title: Trust, quality, compliance, and traceability
  body: 'For flight-critical components, trust is the product. AMCA’s stated capacity only matters if each site
    can pass the aerospace and defense access gates: AS9100 quality management, ITAR-controlled technical-data handling,
    CMMC/DFARS cybersecurity readiness, first-article evidence, material and lot traceability, configuration management,
    and supplier scorecards. Third-party technical sources make those controls concrete. AS9100 adds aerospace-specific
    requirements around product safety, counterfeit-parts prevention, change control, obsolescence, risk-based supplier
    oversight, and human factors. ITAR limits who can access defense technical data, including CAD files, process
    specs, machining programs, and traceability records. CMMC 2.0 becomes contract-relevant through the DFARS rule
    effective November 10, 2025. The right diligence artifact is therefore not a marketing trust page; it is a site-by-site
    compliance pack showing certificates, DDTC registration, CMMC readiness, AS9102 first-article reports, Certificates
    of Conformance, material certs, nonconformance/MRB logs, and customer audit results.'
  claimRefs:
  - CE018
