- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer or process
  - Role
  - Dependency
  - Risk
  rows:
  - - Customer requirements and drawings
    - Translate platform need into component requirements, interfaces, risks, and TDP tasks
    - Prime/customer data rights, export-control marking, requirements quality
    - Ambiguous requirements or restricted data access can slow concept-to-qualification work
  - - Design engineering and analysis
    - CAD, GD&T, first-principles analysis, CFD/FEA, manufacturability choices
    - Engineering talent, legacy product knowledge, CAD/CAE stack, senior review
    - Talent bottlenecks and inherited undocumented know-how can limit scaling
  - - Prototype and test loop
    - Build first units, collect test data, troubleshoot, and update drawings/specs
    - El Segundo lab, test instrumentation, build engineers, production feedback
    - Weak test coverage or late DFM feedback can erase claimed speed gains
  - - Qualification and technical data package
    - Generate evidence for qualification, FAI, conformity, configuration, and customer approval
    - AS9102 FAI discipline, material certs, process controls, traceability systems
    - Public evidence does not disclose pass/fail rates or full qualification cycle histories
  - - Certified manufacturing network
    - Produce qualified parts at AS9100/ITAR/CMMC-ready factories
    - Acquired facilities, skilled machinists, tooling, QMS, cyber and export controls
    - Integration risk rises as newly acquired and newly built factories are standardized
  - - AI/digital thread in RAPID
    - Coordinate design, test, documentation, and factory support across the network
    - High-quality shop-floor, ERP, QMS, and historical engineering data
    - RAPID architecture, model governance, and data quality are not publicly disclosed
  notes: Architecture is synthesized from public product claims, job postings, and manufacturing-AI analogs; AMCA
    has not published a RAPID reference architecture.
