company:
  name: Advanced Manufacturing Company of America
chapter:
  number: 5
  title: Product & Technology
  summary: AMCA’s product is an integrated design-to-qualified-production platform for flight-critical aerospace
    and defense components, anchored by the company-claimed RAPID AI workflow and a growing AS9100/ITAR-capable
    factory network. Public evidence supports broad component coverage and deep hiring/compliance signals, but RAPID’s
    lead-time claim, architecture, and site-level qualification evidence remain private diligence gates.
sections:
- id: product-service-and-customer-workflow
  title: Product/service and customer workflow
  body: 'AMCA is best understood as a critical-component development and manufacturing platform, not a catalog-only
    supplier or a generic machine shop. The customer workflow starts when a prime, tier supplier, or sustainment
    program has a readiness-limiting component need: a legacy HMI switch, a power unit, a hydraulic or fluid-control
    device, a transformer, a magnetics assembly, a sensor, or a flight-control-adjacent subsystem that sits between
    commodity parts and full aircraft or defense systems. AMCA then tries to own the full path from requirements
    and concept design through prototype build, qualification planning, technical-data-package creation, and certified
    production handoff. That workflow matters because public sources repeatedly frame the problem as handoff friction
    between engineering, qualification, and manufacturing capacity. RAPID is the claimed connective tissue, but
    the product is ultimately qualified hardware delivered from acquired or built factories. The diligence question
    is whether the platform can repeatedly convert scarce supplier know-how into production-grade parts without
    losing the quality discipline that made the legacy suppliers valuable.'
