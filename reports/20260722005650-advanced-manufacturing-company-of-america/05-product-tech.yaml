- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control, certification, or quality issue
  - Status
  - Public scope
  - Gap
  rows:
  - - AS9100 aerospace quality management
    - Company says facilities meet AS9100 aerospace quality standards; third-party sources describe AS9100D control
      expectations
    - Quality system for aviation, space, and defense manufacturing, including product safety, risk, change, counterfeit,
      and obsolescence controls
    - Need certificates by legal entity/site, registrar, scope, exceptions, and recent audit findings
  - - ITAR registration and technical data controls
    - AMCA engineering roles require U.S.-person eligibility; ITAR sources say defense manufacturers must register
      and protect technical data
    - Applies to drawings, CAD, process specs, machining programs, and traceability records
    - Need DDTC registration, technology-control plan, visitor/access logs, and controlled-data system map
  - - Traceability and FAI evidence
    - Third-party guides specify raw-material-to-final-inspection traceability and AS9102 FAI documentation
    - Material certs, lot/heat traceability, inspection records, C of C, configuration and process data
    - Request sample FAIRs, C of Cs, material cert packets, MRB/deviation logs, and retention policy
  - - CMMC 2.0 / DFARS cybersecurity
    - DFARS final rule effective November 10, 2025; Modus maps CMMC Level 2 to CUI and traceability data
    - Cyber controls for technical drawings, quality records, CUI, backups, access control, and incident response
    - Need SPRS score, CMMC level readiness, C3PAO plan, enclave boundaries, and supplier flow-down evidence
  - - Supplier qualification and scorecards
    - QSTRAT describes risk tiers, scorecards, requalification, SCARs, and approved-supplier-list controls
    - Relevant where AMCA manages acquired factories, sub-tier suppliers, materials, and special processes
    - Need on-time delivery, defect PPM, SCAR closure time, and customer scorecard history
  - - Qualification test reliability
    - Job postings show engineers define and execute qualification plans and perform root-cause/corrective actions
    - Applies to valves, regulators, solenoids, mechanisms, avionics hardware, and flight hardware handoff
    - Need qualification plans, environmental/functional test results, retest rates, and field-failure history
  notes: Compliance rows describe diligence artifacts required to verify public claims; no public source provides
    a complete site-by-site compliance packet.
