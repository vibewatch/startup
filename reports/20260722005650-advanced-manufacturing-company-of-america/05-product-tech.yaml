  title: Product module / asset matrix
  columns:
  - Module or asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - RAPID product-development platform
    - AMCA engineers, program teams, factory operations
    - Current company-claimed workflow being deployed across the network
    - Connects design, prototyping, qualification, TDP, and manufacturing support
    - Obtain architecture demo, data lineage, benchmark method, and before/after cycle-time records
  - - Hydraulics and fluid-control hardware
    - Primes, sustainment programs, aircraft and vehicle subsystem teams
    - Supported by Cal-Draulics context and active fluid/mechanical engineer hiring
    - Valves, regulators, actuators, manifolds, pressure analysis, CFD, and qualification ownership
    - Verify product catalog, AS9100 scope, test equipment, and acceptance history by program
  - - Human-machine interface switches and panels
    - Aircraft and military-vehicle OEMs and sustainment buyers
    - Electro-Mech was first acquisition and Boeing customer signal exists
    - Reliable tactile/backlit HMI products in the component layer between commodity parts and full systems
    - Request part-number list, platform qualifications, field failure rates, and customer scorecards
  - - Power electronics and transformers
    - Commercial aircraft and defense electronics programs
    - Electrocube acquired in 2026 with Boeing top-supplier narrative
    - Transformers, TRUs, capacitors, and EMI filters with long legacy qualification history
    - Validate Boeing ranking evidence, quality metrics, capacity expansion plan, and new-catalog milestones
  - - Power magnetics
    - Commercial platforms and warfighter programs
    - Payne acquired in 2026 with lightweight magnetics expertise
    - Small/light high-performance magnetics and RF-informed design/manufacturing know-how
    - Confirm platform-specific revenue, design-control transfer from Jon Payne, and new UAV/energetics variants
  - - Sensors, power units, flight-control computers
    - Primes and advanced-system developers
    - Launch-positioned product classes; public details limited
    - Targets the overlooked layer between standardized parts and full systems
    - Request SKU taxonomy, TRL/qualification stage, export-control markings, and production customers
  notes: Maturity is public-evidence maturity; it does not prove private revenue, qualification completion, or customer
    acceptance for every product line.
