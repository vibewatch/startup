- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - AMCA solution
  - Measurable benefit signal
  - Limitation
  rows:
  - - Readiness-shortage component replacement
    - Legacy sole-source suppliers, retirements, and long lead times constrain sustainment
    - Acquire supplier, preserve know-how, and develop qualified variants through RAPID
    - Company claims more-than-67% shorter development-to-deployment lead time
    - No public independent cycle-time audit or customer-by-customer proof
  - - New defense-system component development
    - New platforms need parts between commodity hardware and full systems
    - Use El Segundo prototyping/testing plus factory network for design-to-production handoff
    - Malik describes concept-to-qualified workflow in weeks or a few months
    - Qualification scope and failure/iteration rates are private
  - - Power-electronics supply resilience
    - Transformer, TRU, capacitor, EMI-filter, and magnetics suppliers are specialized and hard to replace
    - Electrocube and Payne create a power-electronics division with legacy customer roots
    - Electrocube and Payne releases cite Boeing, Honeywell, GE, 737MAX, F-16, and F-18 platform ties
    - Need actual approved-source-list position and product-level revenue mix
  - - Hydraulic and fluid-control capacity
    - Programs need qualified valves, regulators, actuators, manifolds, and flow-control hardware
    - Hire fluid/mechanical engineers who own analysis, prototyping, qualification, and production handoff
    - Job postings show CAD, GD&T, CFD, TDP, and qualification-plan requirements
    - Hiring signals prove intent and capability needs, not completed program outcomes
  - - Supplier qualification and compliance management
    - Primes require AS9100, ITAR, traceability, FAI, and cyber evidence before award
    - Operate AS9100-certified sites and build documentation into integrated workflow
    - Third-party sources describe these as access gates for defense aerospace work
    - Need site-specific certificates, DDTC registrations, CMMC status, and audit results
  notes: Benefit signals are public claims or public hiring/compliance evidence, not guaranteed customer ROI.
