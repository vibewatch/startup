- id: rapid-architecture-and-operating-model
  title: RAPID architecture and operating model
  body: 'The visible architecture has five layers: demand capture from primes or sustainment programs, engineering/TDP
    development, prototype and test activity at El Segundo and operating sites, qualification and traceability evidence,
    and certified manufacturing at the factory network. AMCA publicly says RAPID combines design engineering, prototyping,
    testing, technical documentation, and manufacturing support into one AI-powered workflow and reduces development-to-deployment
    lead time by more than 67%. Independent sources repeat the claim and Malik’s description that some cases are
    70% faster, but the claim remains company-originated and lacks a public benchmark packet. Manufacturing AI sources
    make the practical dependency clear: AI workflows in factories depend on clean machine, ERP, quality, and process-context
    data. For AMCA, RAPID’s real technical moat would be the integration of legacy drawings, qualification evidence,
    test feedback, supplier process history, and current shop-floor capacity into a reusable digital thread. Public
    materials do not expose that architecture, so diligence should request demos, data schemas, model-governance
    controls, and before/after qualification cycle evidence.'
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE031
  - CE032
  - CE039
  - CE041
