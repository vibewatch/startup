- id: facilities-product-lines-and-maturity
  title: Facilities, product lines, and maturity
  body: 'The product-line map is already broader than a single acquired shop. Public evidence points to six critical-component
    factories across California, Iowa, and New York plus an El Segundo advanced prototyping and testing headquarters,
    with more than 123,000 square feet of online qualified capacity. Electro-Mech supplies the HMI/switch origin
    story; Cal-Draulics and job postings support the hydraulics and fluid-control surface; BC Systems, Electrocube,
    and Payne indicate a growing power-electronics and magnetics cluster; and AMCA’s launch positioning includes
    sensors, power units, and flight-control computers. Electrocube and Payne are especially important because they
    bring legacy know-how that is difficult to recreate: Boeing-qualified transformer use cases, TRUs, capacitors,
    EMI filters, lightweight magnetics, and platform references such as 737MAX, F-16, and F/A-18. Maturity is therefore
    mixed. The acquired product lines have decades of incumbent qualification history, while the combined RAPID-led
    roadmap and new product variants are early and need customer acceptance evidence.'
