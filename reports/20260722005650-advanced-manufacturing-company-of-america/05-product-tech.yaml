figures:
- id: FE001
  title: Product architecture layers
  type: stack
  layout: wide
  summary: AMCA’s visible architecture runs from customer demand through RAPID-enabled engineering, qualification
    evidence, and certified factory production.
  data:
    layers:
    - label: Customer / program demand
      detail: Primes, OEMs, and sustainment programs identify critical component needs, platform interfaces, export-control
        constraints, and lead-time pain.
    - label: RAPID engineering and TDP layer
      detail: Design engineering, analysis, requirements documents, interface control documents, technical-data
        packages, and configuration management are pulled into one workflow.
    - label: Prototype and test layer
      detail: El Segundo and site teams build prototypes, run fluid/mechanical/electrical tests, collect feedback,
        and refine manufacturability.
    - label: Qualification and traceability layer
      detail: First Article Inspection, material certs, Certificates of Conformance, process validation, and customer
        qualification evidence support release.
    - label: Certified manufacturing layer
      detail: AS9100/ITAR/CMMC-ready factories produce hydraulics, avionics, HMI, power electronics, magnetics,
        and other critical components.
    - label: Field support and roadmap feedback
      detail: Customer quality feedback, root-cause investigations, obsolescence needs, and new variants feed the
        next development cycle.
  approximationNotes: Layering is synthesized from AMCA announcements, job postings, and aerospace traceability
    sources; RAPID internals are not publicly documented.
  claimRefs:
  - CE001
  - CE002
  - CE017
  - CE024
  - CE031
  - CE039
- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: A customer need moves through requirements, design, prototyping, qualification, production, and support
    rather than stopping at a drawing handoff.
  data:
    nodes:
    - label: 1. Identify bottleneck component
      detail: Program or customer flags a constrained, obsolete, long-lead, or new critical component.
    - label: 2. Capture requirements and controlled data
      detail: AMCA translates customer requirements, drawings, interfaces, and ITAR/CUI constraints into an engineering
        package.
    - label: 3. Design and analyze
      detail: Engineering teams produce CAD, GD&T drawings, analyses, risk assessments, and TDP elements.
    - label: 4. Prototype and test
      detail: In-house R&D, test engineers, and build teams create first units and gather qualification feedback.
    - label: 5. Qualify and document
      detail: FAI, material traceability, process controls, Certificates of Conformance, and customer approvals
        support release.
    - label: 6. Manufacture at qualified capacity
      detail: Certified factories execute production with quality, delivery, and configuration controls.
    - label: 7. Support field and variants
      detail: Root-cause investigations, corrective actions, obsolescence, and new defense needs feed product variants.
  approximationNotes: Flow abstracts public descriptions and job responsibilities; actual customer workflows vary
    by product and program.
