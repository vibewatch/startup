- id: differentiation-roadmap-and-open-diligence
  title: Differentiation, roadmap, and open diligence
  body: 'AMCA’s differentiation is plausible but not fully underwritten by public evidence. The strongest product-tech
    argument is that it combines three assets that normally sit in different organizations: supplier access to legacy
    sole-source parts, engineering/qualification talent, and certified manufacturing capacity. That differs from
    automated factory companies that emphasize software-driven precision-part production and from additive/digital-manufacturing
    companies that emphasize a new production method. AMCA instead bets that the defense bottleneck is often the
    missing qualified component, the aging owner base, and the unscalable handoff from drawing to production. The
    roadmap after Series B is straightforward: expand RAPID, acquire or build more factories, and bring more qualified
    capacity online. The adverse lens is equally straightforward. Qualification is slow for good reasons; AS9100/ITAR/CMMC
    evidence cannot be hand-waved; inherited tribal knowledge can leave with retirees; and public sources do not
    yet validate RAPID’s benchmark, architecture, or customer-level recurrence. Treat the platform as a credible
    integration thesis with material private-evidence gates.'
  claimRefs:
  - CE033
