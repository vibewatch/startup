  evidenceGaps:
  - type: missing-source
    severity: material
    topic: RAPID-benchmark
    missingEvidence: Independent, customer-reproducible cycle-time study showing baseline lead time, RAPID-enabled
      lead time, product class, qualification scope, rework rate, and statistical sample size.
    whyItMatters: The more-than-67% lead-time claim is central to differentiation, valuation, and capacity planning,
      but public evidence is company-originated.
    diligencePath: Request anonymized before/after program data, customer confirmations, qualification artifacts,
      and cohort analysis by component family.
    relatedQuestionRefs:
    - QE006
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: material
    topic: RAPID-architecture
    missingEvidence: RAPID reference architecture, data model, workflow screenshots, model-governance policy, audit
      logs, integration map to ERP/QMS/MES, and data-quality controls.
    whyItMatters: Without architecture evidence, investors cannot distinguish durable AI/digital-thread advantage
      from project-management software and expert tribal knowledge.
    diligencePath: Run a technical diligence session with product, quality, engineering, and factory operations
      leaders using a real component workflow.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: qualification-readiness
    missingEvidence: Site-by-site AS9100 certificates, DDTC/ITAR registration evidence, CMMC readiness records,
      FAIR examples, Certificates of Conformance, material cert packets, and customer audit results.
    whyItMatters: Flight-critical manufacturing scale only matters if each facility can clear quality, export-control,
      cyber, and traceability gates for real programs.
    diligencePath: Sample three shipped parts per major product family and trace each from customer requirement
      through material, FAI, test, C of C, and shipment records.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: product-line-map
    missingEvidence: Complete AMCA SKU/product taxonomy, acquired-site legal entity list, factory scopes, AS9100
      scopes, and product-level platform qualification status.
    whyItMatters: The public product map combines specific acquisitions with broad component classes, leaving uncertainty
      about which products are active, qualified, or roadmap-only.
    diligencePath: Request the product catalog, approved-source-list status by customer, and site/product responsibility
      matrix.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: capacity-bottlenecks
    missingEvidence: Factory utilization, labor plan, tooling constraints, supplier lead times, quality bottlenecks,
      requalification burden, and capex schedule for new and acquired factories.
    whyItMatters: Defense industrial base sources warn that AI and capital alone do not solve workforce, sub-tier,
      and qualification bottlenecks.
    diligencePath: Review the 24-month capacity plan by factory, product family, hiring funnel, machine/tooling
      constraint, and customer demand signal.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE005
