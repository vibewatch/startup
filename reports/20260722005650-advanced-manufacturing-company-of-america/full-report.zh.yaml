  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议：观察 / 继续研究；仅凭公开证据，不应按 $1.1 billion Series B 标记买入。正向逻辑是真实的：AMCA 已融资 $300
              million，快速进入独角兽行列，拼起六家工厂的关键部件网络，把 RAPID
              部署到工程到制造工作流，并向重要的航空航天和防务客户销售。价格纪律问题同样清楚。公开来源没有披露绝对收入、EBITDA、积压订单、毛利率、收购价格、优先股堆叠或客户集中度；Tectonic 那句有用的 10X
              收入增长引述只是增长率标记，不是收入基数。因此，投委会应采取证据敏感、而非否定公司的框架。若私有尽调证明 AMCA
              拥有自有部件、经常性保障收入、整合速度和战略稀缺性，它可能值得溢价。在此之前，公开记录支持建立关系、进入数据室尽调，并等待风险更低的入场触发点，而不是把 $1.1 billion
              投后估值当作天然公允来承做。工作假设应是：公开事实让 AMCA 获得尽调席位，私有事实才必须撑起估值；这个区分能避免把战略重要性误当成价格不敏感的投资承做。
