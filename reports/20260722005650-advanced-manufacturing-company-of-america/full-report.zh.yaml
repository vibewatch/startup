  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 采购标准
      - AMCA
      - Hadrian
      - Divergent
      - Senra
      - Anduril
      - 既有整合平台 / 主承包商
    rows:
      - - 已收购 AS9100 供应商深度
        - 强：核心模式就是收购并现代化认证供应商
        - 部分 / 未知：自动化工厂，但收购存量供应商组合的证据较少
        - 未知：平台化生产，并非以整合收购驱动
        - 未知：线束专用生产基地
        - 可通过收购实现，但供应商整合不是核心
        - 强：已嵌入合格供应商网络
      - - AI / 软件赋能制造
        - 强：RAPID 产品开发工作流
        - 强：Opus、AI、机器人和自动化
        - 强：DAPS 数字化制造和自动化装配
        - 强：Amp 线束工作流
        - 防务系统和制造基础设施能力强
        - 混合：取决于既有厂商和被收购资产
      - - 组件广度
        - 广：液压、航空电子、电力电子、传感器、开关、磁性元件
        - 拓宽中：CNC 加上焊接、铸造、增材和防务部门
        - 聚焦增材 / 数字化零件生产和系统
        - 窄：线束
        - 系统 / 平台很广，不是纯组件供应商
        - 覆盖既有供应商和售后市场基础，范围很广
      - - 认证与技术数据包深度
        - 工程、认证、TDP 和认证制造方面公开主张很强
        - 部分：重心在产能；认证证据公开层面尚不完全可比
        - 部分：客户零件号和航空航天 / 国防业务
        - 部分：线束质量有暗示，但私下细节稀少
        - 平台合同要求时能力强
        - 靠既有项目历史体现强度
      - - 承诺产能 / 工厂模式
        - 为关键组件自建 / 收购工厂
        - 强：工厂即服务和新工厂节奏
        - 生产平台，未包装为 FaaS
        - 线束 Factory 2 和第三工厂计划
        - 自有制造和供应商收购
        - 既有产能和并购整合
      - - 客户分布
        - 已具名主承包商和保障项目；仍在成形
        - 面向 DoD 和国防主承包商；合同细节有限
        - 具名 Lockheed、Raytheon、General Atomics、Triumph
        - A&D 客户；新闻稿中具体名称较少
        - DoD / 盟友合同和平台触达很强
        - 既有采购渠道和获批供应商准入很强
      - - 公开定价透明度
        - 低：没有标价或已落地合同
        - 低：承诺产能条款未公开
        - 低：平台 / 项目条款未公开
        - 低：线束项目条款未公开
        - 低：防务合同和系统经济性不一
        - 低：合同级定价通常不公开
      - - 主要公开证据缺口
        - 赢单 / 输单、毛利率、实际交付周期数据
        - 认证等同性和产能利用经济性
        - 单件成本相对减材 / 传统方法
        - 10,000 条线束 / 月计划下的质量和吞吐量
        - 供应商利润攫取与伙伴生态之间的取舍
        - 没有新进入者时，既有厂商能否足够增产
    notes: “支持”指留存公开来源确认该能力；“部分 / 未知”标记公开证据无法证明同等能力或落地表现的单元格。
