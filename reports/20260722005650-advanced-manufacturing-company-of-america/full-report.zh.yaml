  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 供应商 / 套餐
      - 公开价格或合同模式
      - 包含能力
      - 未知项 / 折扣提示
      - 竞争含义
    rows:
      - - AMCA 关键组件项目
        - 无公开标价；可能采用零件 / 项目合同和被收购工厂产能
        - 工程、认证测试、技术数据、认证制造、RAPID 支持
        - 单价、毛利、最低量、产能预留和折扣均未披露
        - 尽调必须比较实际交付周期和质量调整后成本，而不是标价
      - - Hadrian 工厂即服务
        - 无公开标价；承诺工厂产能模式
        - 面向零件、组件或完整产品的专用产能；AI 工厂自动化
        - 产能利用承诺、认证成本和客户经济性未公开
        - 买方想要有保障的新产能、而不是被收购供应商时，Hadrian 可能绕开 AMCA
      - - Divergent DAPS 生产
        - 无公开标价；平台 / 项目制造模式
        - 快速设计、增材制造、自动化装配、航空航天 / 国防零件生产
        - 相对存量供应商的单件经济性和认证负担未公开
        - 增材重设计能带来性能或成本优势时很强
      - - Senra 线束项目
        - 无公开标价；项目制线束生产
        - 报价、工程、制造、供应链、工作流软件、培训和线束产出
        - 质量良率、实际成本和客户合同条款未公开
        - 线束是卡点时，Senra 范围窄但竞争力强
      - - Anduril 纵向一体化
        - 防务系统合同和供应商收购；没有可比组件标价
        - 系统设计、Lattice 软件、制造基础设施、供应商控制
        - 供应商自制 / 外购决策和转移定价不透明
        - 若纵向一体化胜出，需求可能从独立供应商被抽走
      - - 既有供应商 / 整合平台
        - 合同零件定价和并购经济性；仅有公开倍数
        - 已装机合格供应商、售后市场、MRO、自有组件
        - 项目级价格、续约条款和主承包商折扣未公开
        - 若既有厂商能扩产，现状可能已经够用
    notes: 公开来源未披露 AMCA 或直接同行的实际单价；各行比较包装和合同模式，而不是真正的价格等同性。
