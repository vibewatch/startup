      - number: '7.4'
        title: 财务模型、关键人物和并购执行风险
        blocks:
          - type: paragraph
            body: >-
              财务风险不只是 AMCA 是私营且未审计；更关键的是，这套模型可能同时在多个方向吃现金。Series B 给 AMCA 带来 $300 million 新资本和超过 $1 billion
              的估值，但公开记录没有披露收入基数、毛利率、积压订单、EBITDA、债务、营运资本、采购承诺、整合成本、资本开支计划或审计财务。AMCA
              既计划继续收购工厂，也计划新建工厂，因此投资逻辑取决于：被收购供应商能否在不牺牲质量、不堆出过量库存的情况下支持吞吐提升；估值跃升是否由合同经济性支撑，而不只是防务科技热情。执行风险也很集中。公开来源突出 Jai
              Malik 的逻辑和 Eli Giovanetti 的 SpaceX 生产背景；TechCrunch 2024 年报道称，Malik 关闭 Countdown Capital，理由是硬科技
              VC“并没有低效到足以证明我们存在的必要”，这是需要追问的反向信号，不是直接出局理由。缓释包应包括审计财务、并购管线条款、债务表、工厂级营运资本桥、整合评分卡、出售方业主留任计划，以及创始人之外的治理厚度。
