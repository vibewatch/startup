  - id: TV005
    title: 投资逻辑破裂与放弃触发因素表
    targetSlug: thesis-break-and-kill-triggers-table
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入证据缺失
        - 管理层在 NDA 下仍不提供当前收入、在手订单或收入桥
        - 无法支撑 $1.1B 价格或收入隐含倍数
        - 保持观察 / 不建议发投资条款书
      - - 利润率证据弱
        - 整合后工厂层面毛利率和 EBITDA 未改善
        - 并购整合经济性不像高溢价 A&D 资产
        - 要求重置价格，或放弃
      - - 整合延误
        - 被收购厂点错过质量、交付或 RAPID 部署里程碑
        - 护城河从软件赋能平台，变成资本密集的工厂集合
        - 暂停，直到经营指标恢复
      - - 客户集中度冲击
        - 前两大客户或 F-35 关联订单主导在手订单，且没有分散化
        - 需求信号变成集中度风险
        - 要求保护性条款、压低价格，或回避
      - - 优先股堆叠悬顶
        - 参与型优先股、高清算堆叠、大规模期权刷新或债务 / 卖方票据削弱普通股上行
        - 退出价值未必转化为投资人回报
        - 重谈条款，或退出
      - - 市场倍数压缩
        - AMCA 达到规模前，防务科技 VC 或 A&D M&A 倍数下滑
        - 估值标记风险和退出路径恶化
        - 只有入场价更低且安全边际更大时才推进
    notes: 放弃标准把未解决的估值风险转化为可监控的投资动作。
    claimRefs:
      - CV004
      - CV011
      - CV020
