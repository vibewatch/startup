      - number: '4.5'
        title: 公开财务缺口与承销结论
        blocks:
          - type: paragraph
            body: >-
              财务结论是继续研究。AMCA
              有可信的收入机制、强资本基础、点名战略客户，以及一个显示自有航空航天部件成熟后可异常盈利的可比公司集合。阻碍因素正是让这个模型有吸引力的那些事实：认证周期、长寿命零件和老牌供应商整合，会把真实经济性藏在公开记录之外。反向证据也重要。Oliver
              Wyman 警告国防供应基础受到结构性约束，Tier 2+ 供应商最没有余量承接激增；TechCrunch 的 Countdown Capital
              文章提醒投资人，工业硬科技融资可能比小投资人预期更快变得有效定价且资本密集。承销前，投资人需要经审计或董事会批准的财务报表、当前收入和订单积压、毛利率桥、被收购公司
              P&L、收购价格分摊、营运资本明细、债务和卖方票据明细、客户集中度，以及一份与工厂和收购里程碑绑定的 24 个月现金计划。
