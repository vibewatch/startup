      - - Boeing 商用平台内容
        - Electrocube 与 Boeing 有明确绑定，许多子公司平台也是 Boeing 飞机
        - Boeing 停产、质量行动或供应商评分变化都可能打击产能利用率
        - 索取 Boeing 单机配套收入、积压订单、记分卡，以及按 737/767/777/787 拆分的平台敞口
      - - F-35 与国防保障业务
        - Lockheed/DoD 采购要求会让资质认证呈波动性，也增加涉密项目不透明度
        - 大型项目粘性强，但扩张慢，且难靠公开资料尽调
        - 索取直接授标金额、主承包商穿透合同、CMMC 证据和涉密收入集中度
      - - 面向 UAV、含能系统和下一代飞机的新产品变体
        - 新业务可能需要客户出资认证，也不一定转入量产
        - 内容扩张有潜力，但销售周期和认证风险仍高
        - 按 TRL、认证阶段、客户出资 NRE 和计划量产日期审查管线
      - - 123,000+ 平方英尺已上线合格产能
        - 若头部项目延迟、推迟或转向双来源采购，产能可能吃不满
        - 经营杠杆取决于已锁定需求，不只是厂房面积
        - 按工厂索取利用率、已签积压订单、准时交付率和逾期积压订单
      - - 工业基础承压与中段空心化
        - 需求顺风可能伴随供应商瓶颈、劳动力短缺和采购摩擦
        - 会抬升战略紧迫性，也会拉高执行和交付风险
        - 用客户访谈、逾期积压订单报告、用工计划和供应商质量趋势数据验证
    notes: 由于 AMCA 未披露客户集中度或分部收入，风险项把公开证据与明确尽调索取项合并呈现。
