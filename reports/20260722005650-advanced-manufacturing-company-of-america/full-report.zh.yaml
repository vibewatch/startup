              估值更多由资本市场偏好、任务相关性和快速收购活动支撑，而不是可公开审计的运营规模。反向信号也与创始人有关：TechCrunch 2024 年 1 月报道称，Malik 将关闭 Countdown
              Capital，理由是早期硬科技融资市场并没有低效到足以让小型专门基金证明自身价值，规模更大的多阶段基金位置更好。这不能证伪 Amca，但提醒投资人关注投资逻辑依赖、资本强度，以及 AMCA 的运营模型能否跑赢
