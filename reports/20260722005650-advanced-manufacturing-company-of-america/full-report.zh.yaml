      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              增长逻辑异常强，因为需求不是唯一信号：PwC 报告前 100 名收入和订单积压达到万亿美元里程碑；Deloitte 认为供应链压力至少持续到 2027 年；Accenture 预计到 2027 年国防采购支出接近
              $1 trillion，而产能落后于需求。反向逻辑同样重要。Oliver Wyman 调查描述了一个尚未准备好应对近 $900 billion 订单积压的工业基础，Tier 2+
              出现空心化，劳动力问题可能拖垮爬坡。Roland Berger 仍在航空航天供应商中看到人员、产能、融资和扰动约束；The Aviationist 保留了 FLRAA 和 F-35
              供应链风险等项目级例子。AMCA 的模型正是为这些约束而设计，但开放的承销问题不是市场是否足够大，而是 AMCA 能否把资本、被收购企业的经验诀窍、AS9100 认证和 RAPID
              更快转化成可防守份额、利润率和可靠交付，跑赢它试图解决的工业基础摩擦。因此尽调负担落在运营上：验证瓶颈是否被打通，而不只是预算是否获批。
