  - id: TV006
    title: 最终尽调事项表
    targetSlug: final-diligence-asks-table
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入与在手订单
        - 当前收入、已签在手订单、管线转化、按工厂和产品线拆分的收入
        - 判断 $1.1B 是否能被行业倍数支撑
        - 财务数据室；董事会材料；ERP 导出
      - - 单位经济性
        - 毛利率、EBITDA、报废 / 返工、库存周转、营运资本、人工利用率
        - 区分高溢价部件经济性和吃现金的产能建设
        - 工厂层面 P&L 复核和现场走访
      - - 收购质量
        - 收购价格、卖方票据、整合成本、被收购公司留存、质量指标
        - 并购整合回报取决于收购纪律和整合
        - M&A 协议和队列整合桥
      - - 客户集中度
        - 按客户、平台、项目和 F-35 暴露拆分的收入 / 在手订单
        - 测试 Boeing / Lockheed / DoD 集中带来的下行
        - 客户访谈、合同抽样和 F-35 敏感性分析
      - - RAPID 证据
        - RAPID 前后的周期时间、一次通过率、认证成功率、外流缺陷
        - 验证 AI 平台护城河，而不是营销说法
        - 技术尽调和经营指标队列
      - - 股权结构表与条款
        - 投前 / 投后估值、期权池、清算优先权、按比例跟投权、补充协议、债务义务
        - 判断总退出价值能否转化为可投回报
        - 律师复核融资文件和瀑布模型
      - - 退出路径
        - 战略收购方地图、可能的 IPO 就绪里程碑、投行反馈、老股交易兴趣
        - 界定持有期和终局倍数风险
        - 投行访谈、战略买方核验和董事会退出计划
    notes: 每项尽调都为把建议推向买入、重置价格或回避而设计。
    claimRefs:
      - CV037
      - CV039
      - CV041
      - CV043
      - CV044
      - CV045
