      - number: '8.4'
        title: 退出准备度和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度是卡口尽调主题。AMCA 所在类别有足够战略相关性，能够吸引资本，但最相关的退出证据喜忧参半：Crunchbase 和 Tech Times 显示创投资金流入创纪录、可能出现 IPO 候选；S&P
              Global 则提示，航空航天与防务 M&A 在 2021 年高点后放缓。这给 Series B 投资人带来盯市风险：如果公开市场或战略买方坚持要收入证明和采购耐久性，AMCA
              退出时必须拿出超过再工业化故事的东西。因此，最终尽调包应聚焦能把叙事转成投资承做的文件：经审计或董事会批准的收入、按工厂列示的积压订单、EBITDA 和毛利率、收购层面
              P&L、收购价分摊、库存和营运资本明细、股权结构表和优先权条款、客户集中度、F-35 敞口，以及经投行验证的收购方 / IPO 路径。若 AMCA
              无法提供这些材料，应只留在观察名单。退出尽调还应测试战略买方是更愿意把 AMCA 作为整合平台整体收购，还是以更低倍数选择性收购单个部件供应商。
