companyProfile:
  summary: >-
    Advanced Manufacturing Company of America（AMCA，品牌名“Amca”）是一家位于加利福尼亚州 El Segundo 的国防与航空航天制造商，2024 年成立，2025 年 4
    月公开亮相。公司走“收购 + 建设”路线：收购老牌、通常为家族持有的航空航天 / 国防部件供应商；若没有供应商适配某个项目，则自建新工厂；随后用 AI 驱动的 RAPID
    平台改造这些资产，加快精密零件（液压、航电、电力电子、人机界面）的设计、资质认证和生产。公司向 Boeing、Lockheed Martin、Northrop Grumman、RTX、Airbus 等国防主承包商和 OEM，以及
    F-35 等美国国防部项目供货。AMCA 在加利福尼亚、Iowa 和 New York 运营六座以上工厂，拥有 123,000+ 平方英尺通过资质认证的产能，并于 2026 年 5 月以据报约 ~$1.1B 估值完成 $300M
    Series B。
  foundedDate: null
  founders:
