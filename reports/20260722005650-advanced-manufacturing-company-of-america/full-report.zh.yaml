    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与运营模型
        blocks:
          - type: paragraph
            body: >-
              Advanced Manufacturing Company of America 以 Amca 为品牌，应被看作总部位于加利福尼亚州 El Segundo 的未上市 Series B
              航空航天与国防关键部件平台，而不是传统零件经纪商或泛工业自动化公司。核心模型是并购整合和自建工厂的混合打法：收购通过 AS9100
              认证的老牌航空航天与国防供应商，保住既有客户信任和员工队伍，再补上工程、资质测试、技术数据包开发、认证制造产能和软件化工作流。官方和独立来源一致显示，Amca 2024 年成立，2025 年 4 月公开亮相，到
              2026 年 5 月已在 California、Iowa 和 New York 运营六座关键部件工厂，并在 El Segundo 设有先进原型与测试设施。最凝练的一句话是：Amca
              设计、认证并制造介于商品零件和完整系统之间的飞行与任务关键部件，包括液压、航电、电力电子、传感器、开关、变压器、磁性件和飞控相关产品。
