  - id: FV001
    title: 推荐逻辑
    targetSlug: recommendation-logic
    type: flow
    layout: wide
    summary: AMCA 虽有强战略验证，但任何买入建议之前，都要先过私有数据关口。
    data:
      nodes:
        - id: tailwind
          label: DIB 现代化顺风
          detail: NDAA、工业基础承压与 American Dynamism 支撑需求
        - id: proof
          label: AMCA 验证点
          detail: $300M Series B、六家工厂、RAPID、具名头部客户
        - id: gap
          label: 披露缺口
          detail: 未披露收入、EBITDA、利润率、在手订单、条款或集中度数据
        - id: froth
          label: 市场过热
          detail: 防务科技融资激增，收入倍数 17x-50x 发出警示
        - id: diligence
          label: 尽调关口
          detail: 收入、单位经济、股权结构表、整合、客户集中度
        - id: call
          label: 最终判断
          detail: 关口未过前，在 $1.1B 估值下先观察 / 继续研究
      edges:
        - - tailwind
          - proof
        - - proof
          - gap
        - - gap
          - froth
        - - froth
          - diligence
        - - diligence
          - call
    approximationNotes: 基于公开证据和未解决的私有数据关口，给出定性投委会逻辑。
    claimRefs:
      - CV028
      - CV031
      - CV032
      - CV039
      - CV042
