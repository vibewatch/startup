      - - 反向逻辑：资本强度
        - 收购、工厂、库存、工装和合规会先吃现金，再谈盈利
        - 24 个月现金计划和按收购标的拆分的 P&L
      - - 反向逻辑：防务科技市场过热
        - Nexi/VCI 提到初创公司收入倍数达 17x-50x，追估值风险高
        - 入场价需绑定实际收入 / EBITDA，并配下行保护
    notes: 每条论点都把有证据支撑的投资逻辑，配上一项可证伪的尽调事项。
