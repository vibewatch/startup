  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张或风险
      - 威胁来源
      - 严重性
      - 证据
      - 缓释措施或尽调问题
    rows:
      - - 收购并现代化认证供应商
        - 战略买家、PE 整合平台、主承包商争夺同一批资产
        - 高
        - PCE 显示 A&D 并购活跃且中位数倍数较高
        - 审查专有寻源漏斗、LOI 转化、卖方推荐和交割后整合指标
      - - RAPID 缩短从设计到合格量产的时间
        - Hadrian 自动化、Divergent DAPS、Senra Amp、客户内部数字线程
        - 高
        - AMCA 声称速度快 >67%；同行都在营销软件定义生产
        - 按项目获取周期时间数据，并同步质量逃逸和返工率
      - - 资质和技术数据深度
        - 已获资质的供应商和主承包商内部团队
        - 高
        - AS9100/ITAR/CMMC 与平台资质让切换变慢
        - 按平台审计资质包和客户验收情况
      - - 关键组件类别覆盖广度
        - 窄领域专精者挑高痛点瓶颈切入
        - 中
        - Senra 聚焦线束；Divergent 聚焦增材 / 数字化生产
        - 按组件类别和利润池拆分 AMCA 的订单赢面
      - - 资本获取和投资人财团
        - Anduril、Hadrian、Divergent、Senra 均有大额融资支持
        - 高
        - 近期融资从 $65M 到 $5B 不等，且包括顶级投资人
        - 在收购和绿地建设情景下压力测试后续资本需求
      - - 借助具名主承包商分销
        - 主承包商内部供应和既有采购关系
        - 中高
        - AMCA 点名了主要客户，但公开胜负单和被评估替代方案缺失
        - 索取客户推荐，并要求明确讨论被 AMCA 替换的替代方案
      - - Countdown 关闭后的论点可信度
        - Malik 过去曾质疑硬科技风投效率低
        - 中
        - TechCrunch 报道称，Malik 认为多阶段基金在工业初创公司上有优势
        - 在投资备忘录中区分运营公司边际优势和风投渠道论点
      - - 市场顺风和工业基础紧迫性
        - 许多进入者都能借同一顺风融资
        - 中
        - a16z、预算、市场和工业基础来源都支撑资本广泛流入
        - 承保 AMCA 自身执行 KPI，而不是押注品类动能
    notes: 严重程度由作者根据公开证据评估；拿到私下收购管线、胜负单、资质和定价尽调后需要重校。
