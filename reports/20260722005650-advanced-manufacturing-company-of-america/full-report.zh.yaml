  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 公开规模或融资信号
      - 目标细分
      - 产品范围
      - 相对 AMCA 的差异化
      - 限制 / 尽调问题
    rows:
      - - AMCA
        - 收购并现代化关键组件的平台
        - $300M Series B 轮；估值 >$1B；6 家工厂，123,000+ sq ft
        - 航空航天与国防主承包商、平台项目和美国保障项目
        - 液压、航空电子、电力电子、传感器、开关、磁性元件、HMI、RAPID 认证工作流
        - 已收购 AS9100 供应商基础，加上从设计到合格生产的 RAPID
        - 需要私下尽调赢单 / 输单、实际定价、质量和吞吐量证据
      - - Hadrian
        - AI 自动化精密零件工厂
        - $260M Series C 轮；累计融资接近 / 超过 $500M；270,000-sq-ft Mesa 第 3 工厂
        - 太空、国防、海军、弹药、DoD 优先项目
        - CNC 零件，并扩展到焊接、铸造、增材；工厂即服务
        - 自动化强度更高，并采用承诺产能模式
        - 认证深度以及与存量供应商收购的重叠，需要正面对比证据
      - - Divergent Technologies
        - 数字化 / 增材制造平台
        - $290M Series E 轮，估值 $2.3B
        - 航空航天、国防、汽车客户，包括 Lockheed/Raytheon/General Atomics
        - DAPS 快速设计、增材制造、自动化装配
        - 数字线程强，增材重设计能力强
        - 不太聚焦收购存量 AS9100 供应商组合
      - - Senra Systems
        - 软件驱动线束制造商
        - $65M Series B 轮；累计融资 >$112M；产能扩张 5x
        - 飞机、航天器、卫星和防务系统的 A&D 线束瓶颈
        - Amp 软件平台，加上线束生产和技师培训
        - 深耕一个具体瓶颈组件类别
        - 产品范围窄于 AMCA 关键组件组合
      - - Anduril
        - 纵向一体化防务科技平台
        - $5B Series H 轮，估值 $61B；2025 年收入据报 $2.2B
        - DoD 和盟友防务系统
        - 防务系统、Lattice 软件、制造基础设施、收购
        - 规模、资产负债表、合同和类主承包商的系统集成能力
        - 不是纯供应商同行，但可能吸收供应商利润或收购产能
      - - TransDigm
        - 上市 A&D 组件整合平台
        - PCE 将 TransDigm/Victor Sierra Aviation 列为一笔 $2.2B 交易
        - 航空航天售后市场和自有组件
        - 高毛利自有组件和收购整合
        - 成熟的整合打法和收购纪律
        - 经济性是成熟上市公司基准，不是创业公司运营证据
      - - Howmet Aerospace
        - 上市航空航天制造既有厂商
        - PCE 将 Howmet/Consolidated Aerospace Manufacturing 列为一笔 $1.8B 交易
        - 商用和国防航空航天制造商
        - 工程金属产品和航空航天制造
        - 规模、既有质量体系和客户信任
        - AI 软件现代化叙事较弱
      - - VSE Corporation
        - 上市保障 / MRO 收购方
        - PCE 将 VSE/Precision Aviation Group 列为一笔 $2.15B 交易
        - 航空售后市场、MRO、保障
        - 零件分销、维修和售后服务
        - 既有保障渠道和收购胃口
        - 价值链层级不同，但会争夺稀缺资产
      - - 传统 PE 航空航天整合平台
        - 财务投资人平台
        - PCE 报告称，过去 12 个月 143 笔 A&D 交易中有 19 笔来自财务买方
        - 中低端市场 A&D 供应商和服务
        - 平台收购、运营改善、追加收购
        - 能与 AMCA 竞购同一批认证供应商
        - 可能缺少类似 RAPID 的技术故事，但会推高收购价格
      - - 主承包商内部能力 / 既有供应商
        - 现状替代方案
        - 已嵌入 Boeing、Lockheed、Northrop、RTX、Airbus 和项目供应链
        - 现有项目经理和采购团队
        - 合格既有供应、内部工程、获批供应商名单
        - 当前供应商足够时，采用风险最低
        - 可能缓慢、产能受限，或依赖单一来源
      - - 客户内部自建 / 新工厂
        - 自建替代方案
        - 无外部融资；预算在主承包商或防务科技平台内部
        - 大型主承包商、Anduril 式纵向一体化公司、政府项目
        - 自有工程、工装、认证和生产控制
        - 控制权和数据所有权最大
        - 需要资本、劳动力、认证时间，并承担产能利用风险
      - - 新的 American Dynamism 进入者
        - 潜在进入者池
        - a16z 等将国防、AI、制造和回流本土定义为可投资的国家安全赛道
        - 追逐工业基础瓶颈的投资人和创始人
        - 新工厂、软件定义制造、组件细分机会
        - 可能快速切入狭窄但高毛利的瓶颈
        - 具名未来进入者和证明点在本章尚未公开
    notes: 截至 2026-07-22 的代表性公开格局；并非穷尽所有 AS9100 航空航天组件供应商或主承包商自有内部能力。
