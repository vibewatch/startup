      - number: '3.3'
        title: 分销、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              在航空航天与国防领域替换供应商很难，因为零件与认证证据、工装、技术数据、合规、平台历史和主承包商采购缠在一起。这支撑了 AMCA
              的逻辑：收购认证老牌供应商，可以买到绿地工厂必须慢慢争取的认证深度和客户入口。同样的事实也保护既有玩家。战略买家和主承包商可以收购稀缺供应商、锁定产能，或把项目留在既有合格网络内。Hadrian
              可以用自动化吞吐和承诺设施挑战；Divergent 可以用数字 / 增材零件重设计挑战；Senra 可以卡住关键线束瓶颈；Anduril 可以把制造整合进更广泛的国防系统。因此，除非私有证据证明 RAPID
              和被收购工厂在交付周期、质量和经济性上持续赢得重复项目，AMCA 的护城河只能算中等耐久。投资判断应持续跟踪可复制供应商整合的证据：被收购车间多快采用
              RAPID，工程成果能否跨站点迁移，客户是否更快批准新零件或重设计零件，以及利用率是否在不牺牲质量的前提下提升。这些证明点才能把叙事护城河转化为可衡量的切换成本。
