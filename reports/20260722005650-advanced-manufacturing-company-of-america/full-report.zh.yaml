      - number: '7.2'
        title: 运营整合、认证和质量风险
        blocks:
          - type: paragraph
            body: >-
              运营风险在于：AMCA 用来解决工业基础瓶颈的方案，本身也暴露在同一瓶颈下。AMCA 已扩张到六家关键部件工厂，加上 El Segundo 原型和测试设施、123,000+ sq ft
              合格产能、近期多笔收购，以及一套旨在把开发到部署周期缩短超过 67% 的 RAPID 工作流。扩张本身亮眼，但也增加了必须统一的继承 ERP
              系统、质量流程、供应商、工装约束、机加工人才缺口、客户认证和单点来源失效点。Oliver Wyman 的 2026 年防务供应链调查指出，行业有近 $900 billion
              积压订单，次级供应商存在“空心中层”，预测可信度弱，劳动力受限，Tier 2+ 供应商的财务和运营余地不足，难以吸收爬坡需求。Roland Berger 另称，人员短缺仍是航空航天爬坡最常见挑战，占
              65%，产能和融资约束也仍然重要。AMCA 可以靠统一质量指标、认证排队、技术数据包归属、供应商可替代性、劳动力获取和设施利用率来缓释风险；但在审阅私有的工厂级吞吐和质量逃逸率证据前，剩余风险仍高。
