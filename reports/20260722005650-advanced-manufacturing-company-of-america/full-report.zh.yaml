      - number: '5.2'
        title: RAPID 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              可见架构有五层：来自主承包商或保障项目的需求捕捉、工程 / TDP 开发、El Segundo 和运营站点的原型与测试活动、认证和可追溯证据，以及工厂网络内的认证制造。AMCA 公开表示，RAPID
              把设计工程、原型、测试、技术文档和制造支持组合进一个 AI 驱动工作流，并把开发到部署的交付周期缩短超过 67%。独立来源复述了这一说法和 Malik 对部分案例快 70%
              的描述，但该说法仍来自公司，缺少公开基准资料包。制造 AI 来源把实际依赖说得很清楚：工厂里的 AI 工作流依赖干净的机器、ERP、质量和流程上下文数据。对 AMCA 而言，RAPID
              真正的技术护城河应是把老图纸、认证证据、测试反馈、供应商工艺历史和当前车间产能整合进可复用数字线程。公开材料没有披露这套架构，因此尽调应要求查看演示、数据模式、模型治理控制，以及认证周期前后对比证据。
