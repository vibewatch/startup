  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    targetSlug: bull-base-bear-scenario-table
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - RAPID 缩短认证周期，被收购供应商赢得重复项目，收入规模支撑高溢价 A&D / 防务科技可比公司
        - 若退出前估值达到大约 $3.3B-$5.5B，$1.1B 入场价仍有复利空间；稀释另计
        - 客户扩张、在手订单转化、自研 / 单一来源占比得到证明
        - 收入 / 利润率证据落空，或采购节奏滑坡
      - - 基准
        - 战略需求和客户入口可信，但私下指标仍不完整
        - 继续观察，直到收入证据撑住 $1.1B，或入场价重置到更低风险
        - 投资人保留接触和信息权，同时跟踪整合进展
        - 无法进入数据室、条款激进，或可比倍数压缩
      - - 悲观
        - 防务科技融资过热，工厂吃现金，收入过于集中或仍太早期
        - 平轮 / 降轮，或以低于上一轮优先股堆叠的价格战略出售
        - M&A / IPO 窗口走弱，客户集中度主导叙事
        - 毛利率弱、F-35 冲击，或被收购供应商整合失败
    notes: 情景估值是投资测算区间，不是公司预测；实际回报还需要持股比例、清算优先权和稀释数据。
    claimRefs:
