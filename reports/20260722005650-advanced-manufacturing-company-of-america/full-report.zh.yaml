      - number: '3.4'
        title: 反向视角：资本充足的对手、商品化与缺失的赢 / 输证明
        blocks:
          - type: paragraph
            body: >-
              反向逻辑异常具体。Hadrian、Anduril、Divergent 和 Senra 不是资金不足的模仿者；它们最近融资规模大，顶级投资人重合，策略也能吸收 AMCA 价值主张的部分内容。Hadrian
              可以自动化工厂并出售承诺产能，Divergent 可以围绕增材和数字工作流重构制造，Senra 可以主导高摩擦部件类别，既有并购整合方也可以在认证供应商竞购中出价超过 AMCA。Malik 自己关闭
              Countdown Capital 的经历提供了有用的怀疑视角：他此前认为，赢得硬科技工业机会最有位置的是大型多阶段机构，而不是小型专门基金。这不能反驳
              AMCA，因为它是一家运营公司，不是种子基金；但它迫使尽调回答一个问题：AMCA
              的认证深度和收购执行，到底能不能形成耐久优势，而不是一场资本密集竞赛。尽调负担也因此落在运营上。要给出干净的竞争通过结论，需要项目级报价历史、周期数据、一次通过率、逃逸缺陷率、客户授标理由和收购管线转化。没有这些，公开记录支持差异化策略，但还不能证明护城河牢不可破。
            claimRefs:
              - CP034
              - CP035
              - CP036
              - CP043
              - CP044
              - CP046
