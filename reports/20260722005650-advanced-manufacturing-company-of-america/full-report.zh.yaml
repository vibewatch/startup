  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: AMCA 的客户旅程从传统合格供应商关系出发，走向扩展后的工程响应和新项目内容。
    data:
      nodes:
        - label: 既有合格供应商关系
          detail: Electrocube、Payne、Cal-Draulics 和 Electro-Mech 带着既有航空航天客户和平台历史进入 AMCA。
        - label: 项目痛点或受限供应商
          detail: 主承包商、OEM 和 DoD 保障团队面临质量、交期、劳动力老龄化或单一来源瓶颈。
        - label: 工程与认证请求
          detail: 客户提出替换、第二来源或新变体支持需求，并要求文档和认证证据。
        - label: RAPID / 内部测试路径
          detail: AMCA 把设计、打样、DO-160 式测试、数据包和 AS9100 制造产能接起来。
        - label: 生产或保障供应
          detail: 合格部件进入商用平台、国防飞机、车辆、弹药系统或涉密项目。
        - label: 扩张回路
          detail: 新目录项、收购工厂和快速响应工程会扩大每个平台、每个客户的内容覆盖。
    approximationNotes: 旅程阶段综合了公开收购、子公司网站和融资披露；它们不是已测量的转化阶段。
