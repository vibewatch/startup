      - number: '7.5'
        title: 缓释、监控指标和否决标准
        blocks:
          - type: paragraph
            body: >-
              风险立场应按严重性排序，但保留条件：如果 AMCA 能证明它已把传统供应商的脆弱性转成可审计的运营控制，大多数风险并非天然致命。尽调包必须具体且可监控。若 AMCA 能展示当前
              CMMC/ITAR/出口管制归属、年度确认控制、AS9100 审计关闭和涉密项目隔离，监管风险会下降。若收购后工厂级准时交付、质量逃逸、认证周期、人员配置、瓶颈和供应商替换指标改善，运营风险会下降。若 F-35
              和 Boeing/Lockheed
              敞口分散到有采购订单支持的已拨款平台，而不只是客户标识，项目集中度风险会下降。若审计报表、积压订单、毛利率桥、整合成本、资本开支、库存周转和杠杆显示并购整合能在不持续依赖股权的情况下扩张，财务风险会下降。否决触发条件必须硬：CMMC
              资格闸口失败、ITAR/出口管制缺陷未解决、失去 AS9100 状态、飞行关键部件出现重大质量逃逸、认证周期滑坡并破坏客户交付、客户集中度超过审慎上限且没有照付不议支持，或创始人 /
              关键运营者离开且没有连续性安排，都应暂停或重定价投资。
