            body: >-
              Amca 的时间线显示，它是在快速整合和建厂，而不是发布单一产品。2025 年 4 月公开亮相确立了 $76.5 million 资本基础和第一笔收购：位于加利福尼亚州 South El Monte 的
              Electro-Mech Components，这是一家开关和人机界面供应商，已有 Boeing 客户背书。Manufacturing Dive 报道称，2025 年 8 月，公司又加入位于加利福尼亚州
              Corona 的高精密液压产品供应商 Cal-Draulics。2026 年 2 月，Amca 宣布收购 Electrocube，这是一家位于 Pomona、成立于 1961 年的电力电子供应商，被描述为
              Boeing 在质量、准时交付和响应速度上排名前 20 的直接供应商；一周后又宣布收购 Payne Magnetics，这是一家位于 Covina、成立于 1950 年代的磁性件供应商，产品用于
              737MAX、F-16 和 F-18 平台。2026 年 5 月 Series B 还披露了 BC Systems，这是一家支持机密国防项目的 New York
              电力电子供应商。这些事件解释了当前六座工厂、123,000+ 平方英尺的版图，但被收购公司的财务和整合 KPI 仍然私有。
