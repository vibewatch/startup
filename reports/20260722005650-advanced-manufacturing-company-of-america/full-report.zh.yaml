  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >-
              AMCA 公开呈现的收入模型不像
              SaaS，也没有可见的标价页。它是一个航空航天与国防部件平台：收购老牌认证供应商，保留其合格产品线和客户信任，增加工程和技术数据包产能，并在既有供应商无法满足战备需求时自建新工厂。因此收入应来自卖给主承包商、OEM
              和美国军事保障渠道的认证精密部件；新项目内容之外，还会叠加售后、备件、维修和由过时替换驱动的经常性需求。公开记录支持这个机制，但不支持规模判断。Malik 披露营收同比增长 10X，但 AMCA
              尚未披露绝对收入、已签订单积压、ARR、毛利率、实际定价或产品线组合。因此财务部分应把液压、航电、电力电子、磁性件、开关和 HMI 产品视为收入类别；在管理层提供财务系统导出前，所有以美元计价的 AMCA
              运营指标都应视作未公开的私有信息。
