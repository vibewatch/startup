  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品 / 服务与客户工作流
        blocks:
          - type: paragraph
            body: >-
              AMCA 最适合被理解为关键部件开发和制造平台，而不是只卖目录的供应商或泛机加工车间。客户工作流从一个主承包商、层级供应商或保障项目遇到限制战备的部件需求开始：可能是老牌 HMI
              开关、电源单元、液压或流体控制装置、变压器、磁性组件、传感器，或介于商品零件和完整飞机 / 国防系统之间的飞控相邻子系统。AMCA
              随后试图掌控从需求和概念设计，到原型制造、认证规划、技术数据包创建，再到认证生产交接的完整路径。这个工作流很重要，因为公开来源反复把问题描述为工程、认证和制造产能之间的交接摩擦。RAPID
              是公司声称的连接层，但产品最终是从被收购或自建工厂交付的合格硬件。尽调问题是，平台能否反复把稀缺供应商隐性知识转化为量产级零件，同时不丢掉让老牌供应商有价值的质量纪律。
