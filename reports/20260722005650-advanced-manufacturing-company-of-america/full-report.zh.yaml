      - number: '2.2'
        title: 规模测算视角与预算顺风
        blocks:
          - type: paragraph
            body: >-
              最干净的 TAM 锚点是全球航空航天与国防部件估算：2025 年 $71.97 billion，2026 年 $79.25 billion，到 2030 年 $111.52 billion，意味着 2026
              年快速增长，预测 CAGR 仍达 8.9%。这个数字在方向上有用，但不足以覆盖 AMCA，因为它包括全球商业、军用和航天部件，而不是 AMCA
              真正可收购或替代的更窄美国合格供应商池。第二个视角是预算拉动：FY2026 NDAA 授权 $900.6
              billion，强化国防工业基础，并加入采购、技术数据、第二来源认证、先进制造、弹药和劳动力条款。第三个视角是流入工业基础的短期现金：美国国防部计划在 FY2026 承付全部 $152 billion
              调和资金，其中约 $25 billion 用于弹药和供应链发展，超过 $1 billion 通过 Defense Production Act
              投放。这些视角不能相加，但合在一起显示了一个巨大的部件池，以及异常明确的现代化需求。
