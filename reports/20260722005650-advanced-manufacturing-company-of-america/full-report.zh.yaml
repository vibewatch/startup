  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状
        blocks:
          - type: paragraph
            body: >-
              AMCA
              应按航空航天与国防部件平台公司来承销，而不是泛工厂自动化供应商或新的国防主承包商。纳入的市场是介于商品输入和完整系统之间的合格部件层：液压、航电、电力电子、传感器、开关、变压器、磁性件、飞控计算机、人机界面，以及相关工程、测试、技术数据和认证制造工作。这个边界符合
              ResearchAndMarkets 对商业飞机、军用防务系统和航天应用专用零件的定义，也符合 AMCA
              在公开亮相时的表述：被忽视的一层既不是标准化零件，也不是完整系统。因此应排除完整飞机或武器系统、主承包集成、广义工业自动化、商品材料和未通过资质认证的
              来单加工工作。现状替代方案不是单一软件供应商类别，而是老牌单一来源供应商、主承包商内部工程团队、替代来源的漫长认证周期，以及更慢的保障采购。
