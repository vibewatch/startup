      - number: '5.4'
        title: 信任、质量、合规与可追溯性
        blocks:
          - type: paragraph
            body: >-
              对飞行关键部件而言，信任就是产品。只有每个站点都能通过航空航天与国防准入门槛，AMCA 声称的产能才有意义：AS9100 质量管理、ITAR 管制技术数据处理、CMMC/DFARS
              网络安全准备度、首件证据、材料和批次可追溯性、配置管理以及供应商评分卡。第三方技术来源让这些控制变得具体。AS9100
              增加航空航天专属要求，覆盖产品安全、防假冒件、变更控制、过时管理、基于风险的供应商监督和人为因素。ITAR 限制谁可以访问国防技术数据，包括 CAD 文件、工艺规范、加工程序和追溯记录。CMMC 2.0 通过
              2025 年 11 月 10 日生效的 DFARS 规则进入合同相关范畴。因此正确的尽调材料不是营销信任页，而是逐站点合规包：证书、DDTC 注册、CMMC 准备度、AS9102
              首件报告、合格证书、材料证书、不合格 / MRB 日志和客户审计结果。
