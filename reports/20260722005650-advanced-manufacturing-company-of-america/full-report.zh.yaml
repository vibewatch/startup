              交易市场解释了 AMCA 为什么能在发布收入前吸引大额 Series B：买家和投资人买的是任务关键入口，不只是当前 EBITDA。PCE 的 Q2 2026 更新报告称，航空航天、国防和政府承包 LTM 交易
              143 笔，中位 TEV/EBITDA 为 18.96x，TEV/revenue 为 4.09x，需求集中在国防电子、任务关键制造、航天系统和保障资产。First Page Sage 的私有市场表格给出军工与国防
              EBITDA 倍数区间 7.7x 到 14.7x；Capstone 则描述了有韧性的航空航天与国防并购活动和财务买方资本。这些是承销背景，不是 AMCA 的估值数学。没有 AMCA
              收入、EBITDA、订单积压、收购价格和收入组合，外部只能说行业奖励稀缺合格产能，无法判断 AMCA $1.0–$1.1 billion 投后估值按实际运营指标看是便宜还是昂贵。
