  - id: TE004
    title: 信任 / 质量 / 合规表
    columns:
      - 控制、认证或质量问题
      - 状态
      - 公开范围
      - 缺口
    rows:
      - - AS9100 航空航天质量管理
        - 公司称各设施符合 AS9100 航空航天质量标准；第三方资料描述了 AS9100D 的控制要求
        - 面向航空、航天和防务制造的质量体系，覆盖产品安全、风险、变更、防伪和停产过时控制
        - 需要按法人 / 场地列示证书、注册机构、范围、例外和近期审计发现
      - - ITAR 注册与技术数据控制
        - AMCA 工程岗位要求 U.S.-person 资格；ITAR 资料称防务制造商必须注册并保护技术数据
        - 适用于图纸、CAD、工艺规格、机加工程序和追溯记录
        - 需要 DDTC 注册、技术控制计划、访客 / 访问日志和受控数据系统图
      - - 可追溯性与 FAI 证据
        - 第三方指南要求从原材料到最终检验的可追溯性，以及 AS9102 FAI 文档
        - 材料证书、批次 / 炉号追溯、检验记录、C of C、配置和过程数据
        - 要求提供 FAIR 样本、C of C、材料证书包、MRB / 偏差日志和留存政策
      - - CMMC 2.0 / DFARS 网络安全
        - DFARS 最终规则于 November 10, 2025 生效；Modus 将 CMMC Level 2 映射到 CUI 和追溯数据
        - 面向技术图纸、质量记录、CUI、备份、访问控制和事件响应的网络控制
        - 需要 SPRS 分数、CMMC 等级准备度、C3PAO 计划、安全域边界和供应商要求下传证据
      - - 供应商认证与计分卡
        - QSTRAT 描述风险分层、计分卡、重新认证、SCAR 和合格供应商名单控制
        - AMCA 管理收购工厂、下级供应商、材料和特殊工艺时，这些控制最相关
        - 需要准时交付率、缺陷 PPM、SCAR 关闭时间和客户计分卡历史
      - - 认证测试可靠性
        - 招聘信息显示，工程师负责定义并执行认证计划，开展根因分析 / 纠正措施
        - 适用于阀门、调节器、电磁阀、机构、航电硬件和飞行硬件交接
        - 需要认证计划、环境 / 功能测试结果、复测率和现场故障历史
    notes: 合规行列出核验公开主张所需的尽调材料；没有公开来源提供完整的逐场地合规包。
