      - number: '3.2'
        title: 规模、能力与产品包装对比
        blocks:
          - type: paragraph
            body: >-
              公开对比呈现的是规模与范围的取舍。Hadrian 是最直接的工厂模型同行：它有 $260 million Series C、Mesa 的 Factory
              3、Factories-as-a-Service，以及面向航天和国防零件的软件 / 自动化叙事。Divergent 在增材和数字生产上更深，DAPS 覆盖从快速设计到自动化装配。Senra
              范围更窄，但在线束这个瓶颈部件类别上危险，因为线束高度依赖人工，并遍布飞机、航天器、卫星、运载火箭和国防系统。AMCA 的优势不是用资本硬碰 Anduril，或用纯自动化硬碰 Hadrian；而是把被收购的
              AS9100 认证产能、工程、资质测试、技术数据包工作和生产支持组合在一起。定价大多不透明，所以有用的公开比较是包装方式：零件项目、承诺产能、工厂服务、DAPS
              支持的生产、线束项目和既有合同工具。还要注意，公开融资数字会夸大竞争确定性：产能必须在具体平台上转化为通过认证并已交付的零件，而认证周期瓶颈可能压过工厂自动化。因此，比较 AMCA
              应看合格项目转化和客户接受度，而不只是平方英尺或融资额。
