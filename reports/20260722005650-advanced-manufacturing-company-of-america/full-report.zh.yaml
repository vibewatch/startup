  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与平台图谱
        blocks:
          - type: paragraph
            body: >-
              AMCA 的公开客户记录不像软件创业公司的早期客户墙：它是对已经嵌入航空航天和国防生产链的合格部件供应商做并购整合。客户基础分成国防主承包商和 OEM、商用机体
              OEM、层级航空航天供应商，以及直接或间接的美国军事保障项目。点名客户和终端平台集中在 Boeing、Lockheed Martin、Northrop
              Grumman、Airbus、RTX/Raytheon、Embraer、Honeywell、GE Aerospace、BAE Systems、Textron 和 Bombardier；公开平台证明覆盖
              F-35、F-16、F/A-18、Mk-48、M1 Abrams、商用宽体和窄体飞机，以及 Boeing
              737MAX。因此买方和用户画像是工程、质量、供应链、保障和项目办公室人员，而不是可自由支配的创新采购者。这是优势，因为客户需求绑定合格零件和战备；但收入分层仍是私有信息。尽调时，每个客户说法都应绑定平台、零件族、合格设施和付款路径，而不是简单按一个
              客户标识计数。Boeing 平台引用和 Honeywell 部件关系，在集中度、利润率和续约含义上并不相同。
