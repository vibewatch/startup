        title: 差异化、路线图与开放尽调
        blocks:
          - type: paragraph
            body: >-
              AMCA 的差异化可信，但公开证据还不足以完全承销。最强的产品技术论点是，它把通常分散在不同组织里的三类资产组合到一起：接触老牌单一来源零件的供应商入口、工程 /
              认证人才，以及认证制造产能。这不同于强调软件驱动精密零件生产的自动化工厂公司，也不同于强调新生产方法的增材 / 数字制造公司。AMCA
              押注的是，国防瓶颈往往是缺少合格部件、所有者群体老化，以及从图纸到生产的交接无法规模化。Series B 之后的路线图很直接：扩展
              RAPID、收购或建设更多工厂，让更多合格产能上线。反向视角同样直接。认证慢有其合理性；AS9100/ITAR/CMMC 证据不能一句带过；继承来的隐性知识可能随退休人员流失；公开来源尚未验证 RAPID
              的基准、架构或客户层面的重复性。应把该平台视为一个可信的整合逻辑，但它仍有实质性的私有证据关口。
