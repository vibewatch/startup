            body: >-
              扩张上行来自三条路径：加入拥有老客户批准的被收购工厂，通过工程和产品目录投入提高每个平台内容量，以及用 RAPID 加内部认证更快响应新项目请求。这些路径可信，因为 AMCA 已经点名主要主承包商和
              OEM，并称自己能比既有供应链快 67% 向大客户交付零件。反向角度同样具体。如果 Boeing、Lockheed/F-35、DoD 保障或机密 BC Systems
              项目主导收入，客户广度可能被高估。Oliver Wyman 的 2026 年国防工业基础研究强调，供应商基础订单积压压力大、中间层空心；Roland Berger 和 Aviationist
              也描述了航空航天供应链的持续脆弱性。这个环境为 AMCA
              创造需求，但也让采购批准、项目集中度、客户出资认证和机密项目不透明度，在承销重复性前成为实质尽调项。缓释办法不是简单增加更多客户标识，而是证明多元化采购订单、跨工厂经常性需求，以及客户在收购整合期后愿意为新的零件族认证
