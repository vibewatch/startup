  - id: FV003
    title: 估值 / 回报区间
    targetSlug: valuation-return-range
    type: range
    layout: standard
    summary: 在确切持股比例和条款明确前，乐观 / 基准 / 悲观区间用来框定 AMCA 围绕 $1.1B 投后估值的价格风险。
    data:
      items:
        - label: 悲观情景可支撑价值
          low: 0.3
          high: 0.7
          unit: USD billions
          basis: Revenue or margin proof fails and defense-tech multiples normalize
        - label: 基准情景可支撑入场价
          low: 0.7
          high: 1.1
          unit: USD billions
          basis: Track until revenue/backlog supports the upper end or entry resets
        - label: 乐观情景退出企业价值
          low: 3.3
          high: 5.5
          unit: USD billions
          basis: 3x-5x gross outcome from $1.1B before dilution and preference effects
    approximationNotes: 这些区间是基于公开可比公司和风投回报模型推导的投资测算；AMCA 尚未披露收入。
    claimRefs:
