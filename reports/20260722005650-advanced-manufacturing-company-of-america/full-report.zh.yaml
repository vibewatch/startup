      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方分层比单一 DoD 客户复杂得多。国防主承包商是最显眼的经济买家和渠道，因为 AMCA 点名 Boeing、Lockheed Martin、Northrop
              Grumman、Airbus、Embraer、Honeywell、Raytheon 等，而且其部件进入 F-35、F-16、F/A-18、Mk-48、M1
              Abrams、机密项目和商用飞机。平台出现来源减少或与战备有关的零件短缺时，DoD 保障和战备项目形成一条独立付款路径。商用航空 OEM 和售后运营方也重要，因为 AMCA 收购的企业供应 Boeing
              飞机、737MAX、Honeywell、GE 和更广泛的商业平台。卖方一侧同样关键：具备 AS9100 能力的老牌部件供应商所有者构成 AMCA 的收购漏斗，其既有信任可缩短客户采用周期。El Segundo
              本身不是买方，但带来集群优势，让 AMCA 靠近密集的航空航天与国防制造和国防科技生态。
