            body: >-
              最清晰的证明是通过收购继承来的量产历史，而不是新宣布的试点。Electrocube 成立于 1961 年，被 AMCA 描述为 Boeing 最受信任的合作伙伴之一，为几乎每个 Boeing 商业平台的 35
              个以上使用场景供应变压器，并在 Boeing 超过 5,000 家直接供应商中排名前 20。Payne Magnetics 成立于 1950 年代，长期进入 737MAX、F-16 和
              F/A-18。Cal-Draulics 和 Electro-Mech Components 公开列出服务了数十年的主要 Boeing、Embraer 和军用平台。因此，AMCA
              的采用轨迹是通过收购扩大内容、产能、工程响应和服务平台：Electro-Mech、Cal-Draulics、BC Systems、Electrocube 和 Payne
