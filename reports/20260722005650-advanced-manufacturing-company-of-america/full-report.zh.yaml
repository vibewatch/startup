      - 含义
      - 尽调问题
    rows:
      - - 全球 A&D 组件增长
        - 驱动因素
        - 当前至 2030 年
        - 自上而下市场规模从 2026 年 $79.25B 增至 2030 年 $111.52B
        - 将 AMCA 实际收入结构与市场报告中的组件类别对齐核验
      - - FY2026 国防预算与 DPA 工业基础支出
        - 驱动因素
        - FY2026
        - 预算授权和加速承付为弹药、先进制造和供应链韧性释放需求信号
        - 追踪哪些拨款流向 AMCA 可切入的组件项目，而不只是主承包商
      - - 商用飞机与国防订单积压
        - 驱动因素
        - 当前
        - 大额订单积压推高生产节奏、供应商可靠性和售后备件压力
        - 要求管理层按客户披露订单积压、采购订单和已授予项目内容
      - - 回流本土与 American Dynamism 资本逻辑
        - 驱动因素
        - 中期
        - 投资人和政策叙事偏向本土产能、韧性和战略制造主权
        - 检验该逻辑是否转化为非稀释资金、长期合同或优先供应商地位
      - - RAPID 与一体化认证工作流
        - 驱动因素
        - 当前
        - 若交付周期缩短 >67% 的说法成立，主承包商需要更快拿到合格硬件时，AMCA 会更有吸引力
        - 核验周期基线、认证通过率、客户接受度，以及 RAPID 部署后的毛利率
      - - 空心中层 Tier 2+ 供应商脆弱性
        - 约束 / 机会
        - 当前
        - 同样的下级供应商薄弱会带来收购供给，但 AMCA 买下资产后，扩张也可能被拖慢
        - 逐厂尽调劳动力、工装、质量逃逸、客户集中度和资本开支积压
      - - 劳动力和熟练技工短缺
        - 约束
        - 当前至 2027 年
        - 即使需求和资本都在，人员短缺和员工老化也会拖慢爬坡
        - 审查机械师、工程师和质量岗位招聘漏斗、留存、培训时间和工资通胀
      - - 认证、合规与技术数据瓶颈
        - 约束
        - 当前
        - AS9100、来源认证、技术数据权利、ITAR/CMMC 周边义务和客户批准都可能拉长采用周期
        - 要求按产品族提供认证时间线、未关闭不符合项、网络安全状态和技术数据所有权
    notes: 需求增长与转化缓慢可同时存在，因为认证、劳动力和资本关口会卡住进度，因此将驱动因素与约束并列。
