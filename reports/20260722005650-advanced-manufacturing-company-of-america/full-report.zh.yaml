  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规负担
        blocks:
          - type: paragraph
            body: >-
              AMCA 正在一套规则体系里扩张，这套规则既能形成资质优势，也可能变成准入闸口。公司公开称，其制造基地已通过 AS9100 认证，服务防务平台、涉密项目和美国保障需求；因此
              ITAR、出口管制、网络安全、质量体系和涉密处理纪律不是后台事务，而是核心能力。CMMC 是日期最明确的风险：Pillsbury 和 Fox Rothschild 均称，最终版 DFARS 采购规则已于 2025
              年 11 月 10 日生效，三年分阶段导入，要求每年向 SPRS 确认、向下游传导义务，并且合规陈述不实会暴露在 False Claims Act 风险下。DefenseScoop
              补上一条不利的运营现实：许多国防工业基础供应商仍未准备好，可能需要数月流程、文档或云重构，才能证明控制有效。AMCA
              面临的不只是清单；收购传统供应商会继承系统边界、政策不一致、供应商传导证据缺口和投标资格风险。缓释措施应包括映射后的 CUI/FCI 清单、按合同划定的 CMMC 等级、ITAR/出口管制注册证据、AS9100
              审计例外、涉密项目设施流程，以及在把防务增长写进投资假设前建立年度确认治理。
