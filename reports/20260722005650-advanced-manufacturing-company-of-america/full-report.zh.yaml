      - number: '7.3'
        title: 合作伙伴、客户和项目依赖风险
        blocks:
          - type: paragraph
            body: >-
              AMCA 的客户标识和平台敞口很有吸引力，但风险面也集中到 Boeing、Lockheed Martin、DoD 保障以及 F-35 等项目上。最强的反向证据来自外部：GAO 报告称，F-35 任务可用率从
              FY2021 的 67% 降至 FY2025 的 44%，全任务可用率从 38% 降至 25%；Global Support Solution Reset 到 FY2031 还需要额外 $13.7
              billion，超过 $7 billion 的额外私营部门零件和材料，并且到 2030 年代中期前还必须克服行业产能约束和超过 $1 billion 的年度可负担性缺口。Breaking Defense、Air
              & Space Forces Magazine 和 Defence Industry Europe 佐证了同样的战备下滑，并指出备件、维修厂、技术数据、软件、腐蚀和供应商基础约束。AMCA
              收到的是双刃信号：战备短缺创造需求，但失灵的主承包商 / 项目生态会拖慢认证、拉长营运资本占用，或把 AMCA 推进薄利的应急增产承诺。尽调问题不是 AMCA
              是否有更多受压平台敞口，而是它是否拥有多元化项目、可执行采购承诺、客户集中度上限和认证控制。
