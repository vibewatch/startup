      - number: '8.2'
        title: 可比支撑、防务科技泡沫和入场测算
        blocks:
          - type: paragraph
            body: >-
              可比组支持稀缺任务关键产能的价值，但区间太宽，无法给 AMCA 一个干净倍数。传统航空航天与防务 M&A 数据显示需求强劲：PCE 的 2026 年 Q2 市场更新报告中位 TEV/EBITDA 为
              18.96x、中位 TEV/revenue 为 4.09x；First Page Sage 和 Capstone 则把防务资产框定为高溢价但有周期性。防务科技创投可比则把方向拉向另一边。Anduril 的 $61
              billion 估值意味着约 28x 往绩收入，但 Anduril 已披露 $2.2 billion 收入基数、大型合同和规模画像，AMCA 尚未公开展示这些。Nexi、S&P Global 和 Venture
              Capital Insiders 都提醒，2026 年防务科技定价可能把结构性再配置和泡沫行为混在一起，尤其是收入倍数跑在采购转化前面时。仅按 PCE 的收入倍数，AMCA 需要约 $269 million
              年收入才能支撑 $1.1 billion；公开来源没有证明这一点。
