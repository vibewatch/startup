      - number: '6.3'
        title: 耐久性、留存代理指标与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              公开证据支持耐久供应关系，但没有披露留存指标。正向代理指标很强：数十年的供应商历史、AS9100 认证工厂、长寿命飞机和国防系统上的平台位置、供应商质量排名，以及站点文案邀请买家在质量、交付周期或定价承压时，把
              AMCA 公司用作已经合格的第二来源。在航空航天与国防领域，切换成本是运营和流程性的：买方要替换一个合格部件供应商，必须管理工程数据、认证测试、质量体系、国防信息进入范围时的 CMMC/DFARS
              网络要求、文档和项目办公室风险。通过认证后，这种锁定效应可以支撑留存，但也会拖慢新客户扩张。Lockheed 的供应商指南用要求供应商具备当前 CMMC 和 NIST 评估准备度，说明了这种摩擦。因此 AMCA
              应被尽调检验续约、合同期限、来源控制 状态和顶级平台收入，而不是只凭客户标识假设粘性。尽调姿态应把认证同时视为护城河和瓶颈：客户不太可能随意切换，但一个新的 AMCA
              变体也可能要等漫长的证据、网络和质量审查结束后，收入才能放大。
