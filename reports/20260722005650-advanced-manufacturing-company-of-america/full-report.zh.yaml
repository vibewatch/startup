  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、相邻国防科技、既有玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              AMCA 的竞争集合比普通机加工车间并购整合更宽。最接近的直接压力来自 AI 自动化和软件定义制造同行：做精密零件和自动化工厂的 Hadrian、做数字 / 增材制造的 Divergent，以及做软件驱动线束的
              Senra。Anduril
              等相邻国防科技平台也重要，因为它们可以收购供应商、锁定产能，并把制造拉进类似主承包商的运营模型。既有并购整合方和上市战略买家则出于另一层原因值得关注：TransDigm、Howmet、VSE、传统 PE
              平台和主承包商既有供应商基础，已经掌握认证历史、采购渠道和客户信任。因此现状不仅包括表现欠佳的老牌车间，也包括内部自建和既有合格供应商。AMCA 更尖锐的切入点是“收购并现代化”：买下认证供应商，叠加
              RAPID，补上工程到合格量产的缺口。
