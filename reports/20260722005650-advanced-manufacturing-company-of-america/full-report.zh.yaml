      - number: '8.3'
        title: 乐观、基准、悲观情景和下行触发因素
        blocks:
          - type: paragraph
            body: >-
              情景树刻意采用区间，因为私营公司的精确估值测算会制造虚假精确。乐观情景下，AMCA 证明被收购的合格供应商加上 RAPID，能够做出自有或单一来源部件、经常性保障内容和足够收入规模，使 $3 billion 到
              $5 billion 退出变得可信。基准情景下，AMCA 仍具备战略可信度，但披露不足，投资人保留接触、要求信息权，并等待更好的入场点或硬指标证明。悲观情景下，Series B
              反映的是防务科技热情峰值，而工厂、收购和营运资本消耗资本的速度快于毛利扩张。主要下行触发因素可衡量：拒绝披露收入 / 积压订单、利润率疲弱、整合滑坡、客户集中在 Boeing/Lockheed/DoD 或
              F-35 保障，以及 AMCA 达到退出规模前防务科技流动性窗口关闭。
