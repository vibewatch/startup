    - TRUs, capacitors, EMI filters, switches, sensors, and hydraulic assemblies
    - Honeywell and GE are named Electrocube customers; Honeywell and GE Aerospace also appear in AMCA customer proof
    - Strategic route into multiple aircraft and defense programs through subsystem content
    - No attach rate or program-by-program content map
  - - DoD sustainment and readiness programs
    - Military program offices and sustainment contractors
    - Repair, replacement, second-source, and production support for constrained components
    - F-35, F-16, F/A-18, Mk-48, and M1 Abrams appear in platform disclosures
    - High if AMCA can remove supply bottlenecks on readiness-critical parts
    - No direct contract vehicle, award value, or sustainment backlog disclosed
  - - Acquired subsidiary legacy customers
    - Existing buyers of Electro-Mech, Cal-Draulics, Electrocube, Payne, and BC Systems
    - Continuation of decades-long supplier relationships after ownership change
    - Subsidiary sites say longstanding aerospace companies have relied on their products for decades
    - Important installed base and reference-call pool for retention diligence
    - Customer roster is partial and logo images are not fully enumerated in text
