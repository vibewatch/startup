- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Acquired legacy supplier approvals
    - Revenue may be concentrated in a few inherited Boeing, Honeywell, GE, Lockheed, or DoD relationships
    - High upside but customer breadth may be less diversified than the logo list suggests
    - Request revenue by top 10 customers and by acquired subsidiary for the last eight quarters
  - - Boeing commercial-platform content
    - Electrocube is explicitly tied to Boeing and many subsidiary platforms are Boeing aircraft
    - Boeing production pauses, quality actions, or supplier-score changes could hit utilization
    - Request Boeing shipset revenue, backlog, scorecards, and platform exposure by 737/767/777/787
  - - F-35 and defense sustainment work
    - Lockheed/DoD procurement requirements can create lumpy qualification and classified-program opacity
    - Large programs can be sticky but slow to expand and difficult to diligence from public sources
    - Request direct award value, prime pass-through contracts, CMMC evidence, and classified revenue concentration
  - - New product variants for UAVs, energetics, and next-gen aircraft
    - New work may require customer-funded qualification and may not convert to production
    - Potential content expansion, but sales cycle and qualification risk remain high
    - Review pipeline by TRL, qualification stage, customer-funded NRE, and planned production date
  - - 123,000+ square feet of online qualified capacity
    - Capacity could be underutilized if top programs delay, defer, or dual-source elsewhere
    - Operating leverage depends on booked demand, not just facility footprint
    - Request utilization, booked backlog, on-time delivery, and late backlog by factory
  - - Industrial-base stress and hollow middle
    - Demand tailwind may come with supplier bottlenecks, labor shortages, and procurement friction
    - Can increase strategic urgency while raising execution and delivery risk
    - Test with customer references, aged backlog reports, labor plan, and supplier-quality trend data
  notes: Risk entries combine public evidence with explicit diligence asks because AMCA does not disclose customer concentration
    or segment revenue.
