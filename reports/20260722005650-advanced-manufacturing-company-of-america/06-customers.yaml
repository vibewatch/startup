  - - Defense primes and major integrators
    - Program supply-chain, engineering, quality, and sustainment teams
    - Qualified components for aircraft, weapons, vehicles, and classified programs
    - Named customers include Lockheed Martin, Northrop Grumman, RTX/Raytheon, BAE Systems, and direct military sustainment
      programs
    - High strategic value because readiness programs tolerate few qualified alternatives
    - No revenue by prime, program, or classified customer disclosed
  - - Commercial airframe OEMs
    - Airframe procurement, supplier quality, and engineering organizations
    - Transformers, switches, hydraulics, magnetics, and other flight-critical components
    - Boeing platform proof is strongest; Airbus, Embraer, Bombardier are named in customer lists
    - High because certified components can persist through long platform life cycles
    - No split between Boeing and non-Boeing commercial OEM revenue
  - - Tier-one and subsystem suppliers
