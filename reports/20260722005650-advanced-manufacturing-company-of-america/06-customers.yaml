company:
  name: Advanced Manufacturing Company of America
chapter:
  number: 6
  title: Customers
  summary: 'AMCA inherits real production customers through acquired aerospace suppliers: Electrocube is a top-20 Boeing direct
    supplier, Payne Magnetics has parts on the 737MAX, F-16, and F/A-18, and subsidiary sites show decades-long platform presence.
    The strongest diligence issue is not pilot validation but concentration and procurement durability around Boeing, Lockheed/DoD
    programs, and opaque renewal or revenue-share metrics.'
sections:
- id: segments-and-platform-map
  title: Customer segmentation and platform map
  body: 'AMCA’s public customer record looks unlike a software startup’s early logo wall: it is a roll-up of qualified component
    suppliers already embedded in aerospace and defense production chains. The customer base segments into defense primes
    and OEMs, commercial airframe OEMs, tiered aerospace suppliers, and direct or indirect U.S. military sustainment programs.
    Named customers and end platforms cluster around Boeing, Lockheed Martin, Northrop Grumman, Airbus, RTX/Raytheon, Embraer,
    Honeywell, GE Aerospace, BAE Systems, Textron, and Bombardier, with public platform proof spanning F-35, F-16, F/A-18,
    Mk-48, M1 Abrams, commercial widebody and narrowbody aircraft, and Boeing 737MAX. Buyer and user personas are therefore
    engineering, quality, supply-chain, sustainment, and program-office stakeholders rather than discretionary innovation
    buyers. This is a strength because customer need is tied to qualified parts and readiness, but revenue segmentation remains
    private. For diligence, this means every customer claim should be tied to a platform, part family, qualified facility,
    and payer path rather than counted once as a simple logo. A Boeing platform reference and a Honeywell component relationship
    have different concentration, margin, and renewal implications.'
