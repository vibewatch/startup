  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Full customer roster, active production account count, contract status, and revenue contribution for
      every named logo and platform in the public record.
    whyItMatters: The named-customer table is a strong public sample but cannot estimate penetration, concentration, or durability
      without the complete population.
    diligencePath: Request a customer-by-customer roster with platform, part family, direct or prime channel, 2024-2026 revenue,
      renewal status, and reference-call permission.
    relatedQuestionRefs:
    - QU003
    - QU010
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal dates, contract lengths, and source-control status by customer, platform, and
      acquired subsidiary.
    whyItMatters: Retention determines whether inherited production placements translate into durable revenue after AMCA ownership
      change.
    diligencePath: Request cohort-retention tables and validate with Boeing, Honeywell, GE, Lockheed, and two DoD or prime
      pass-through references.
    relatedQuestionRefs:
    - QU012
    - QU013
    - QU014
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer percentage, top-ten percentage, Boeing share, Lockheed or F-35 share, classified-program
      share, and direct DoD pass-through revenue.
    whyItMatters: A small number of Boeing, Lockheed, DoD, or classified programs could drive most revenue while public evidence
      appears diversified.
    diligencePath: Request revenue by top 20 customers and programs, with classified work bucketed by prime, contract vehicle,
      and recompete date.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU020
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: customer-satisfaction
    missingEvidence: Independent customer satisfaction data such as supplier scorecards beyond Boeing, late-delivery history,
      corrective-action records, NPS, or formal customer testimonials.
    whyItMatters: Supplier ranking at one customer does not establish satisfaction across Honeywell, GE, Lockheed, Airbus,
      BAE, or DoD sustainment programs.
    diligencePath: Obtain scorecards and quality escape history from the top five customers and compare against AMCA factory-level
      operational KPIs.
    relatedQuestionRefs:
    - QU014
    - QU025
  - type: private-evidence-only
    severity: material
    topic: procurement-friction
    missingEvidence: CMMC level, SPRS score, CCRA status, ITAR scope, open POAMs, and customer-funded qualification status
      for defense-prime and DoD work.
    whyItMatters: Defense customer expansion can be blocked or delayed by compliance and qualification gaps even when platform
      need is strong.
    diligencePath: Review compliance evidence in the data room and test it with Lockheed or prime-contractor procurement references.
    relatedQuestionRefs:
    - QU015
    - QU020
    - QU021
