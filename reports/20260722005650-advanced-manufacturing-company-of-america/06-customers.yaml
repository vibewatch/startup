- id: named-production-proof
  title: Named production proof and adoption trajectory
  body: 'The clearest proof is production heritage inherited through acquisition, not a newly announced pilot. Electrocube
    was founded in 1961 and is described by AMCA as one of Boeing’s most trusted partners, supplying transformers for more
    than 35 use cases across nearly every Boeing commercial platform and ranking in Boeing’s top 20 out of more than 5,000
    direct suppliers. Payne Magnetics was founded in the 1950s and has longstanding placements on the 737MAX, F-16, and F/A-18.
    Cal-Draulics and Electro-Mech Components publicly list major Boeing, Embraer, and military platforms served for decades.
    AMCA’s adoption trajectory is therefore acquisitive expansion of content, capacity, engineering response, and served platforms:
    Electro-Mech, Cal-Draulics, BC Systems, Electrocube, and Payne add switches, hydraulics, classified-program power electronics,
    transformers, TRUs, capacitors, EMI filters, and magnetics to a 123,000-plus-square-foot qualified production network.
    That evidence is materially stronger than early adopter language, but it still needs private validation because historical
    platform presence does not disclose current annual shipsets, open purchase orders, or whether AMCA is sole-source, dual-source,
    or an alternate qualified source on each part.'
