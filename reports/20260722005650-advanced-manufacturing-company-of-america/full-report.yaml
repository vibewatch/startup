  - id: TV005
    title: Thesis-break and kill triggers table
    targetSlug: thesis-break-and-kill-triggers-table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue proof missing
        - Management will not provide current revenue, backlog, or revenue bridge under NDA
        - Cannot support $1.1B price or revenue-implied multiple
        - Stay track / no term-sheet recommendation
      - - Margin proof weak
        - Factory-level gross margin and EBITDA do not improve after integration
        - Roll-up economics fail to resemble premium A&D asset profile
        - Demand price reset or pass
      - - Integration slippage
        - Acquired sites miss quality, delivery, or RAPID deployment milestones
        - Moat shifts from software-enabled platform to capital-heavy collection of shops
        - Pause until operating metrics recover
      - - Customer concentration shock
        - Top two customers or F-35-linked work dominate backlog without diversification
        - Demand signal becomes concentration risk
        - Require covenants, lower price, or avoid
      - - Preference stack overhang
        - >-
          Participating preferred, high liquidation stack, large option refresh, or debt/seller notes impair common
          upside
        - Exit value may not translate into investor return
        - Renegotiate terms or walk
      - - Market multiple compression
        - Defense-tech VC or A&D M&A multiples fall before AMCA reaches scale
        - Mark risk and exit path worsen
        - Only proceed with lower entry and larger margin of safety
    notes: Kill criteria translate unresolved valuation risks into monitorable investment actions.
    claimRefs:
      - CV004
      - CV011
      - CV020
      - CV021
      - CV022
      - CV027
      - CV037
      - CV040
      - CV042
      - CV043
  - id: TV006
    title: Final diligence asks table
    targetSlug: final-diligence-asks-table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue and backlog
        - Current revenue, booked backlog, pipeline conversion, revenue by factory and product line
        - Determines whether $1.1B is supportable on sector multiples
        - Finance data room; board pack; ERP export
      - - Unit economics
        - Gross margin, EBITDA, scrap/rework, inventory turns, working capital, labor utilization
        - Separates premium component economics from cash-consuming capacity build
        - Factory-level P&L review and site visits
      - - Acquisition quality
        - Purchase prices, seller notes, integration costs, acquired-company retention, quality metrics
        - Roll-up returns depend on acquisition discipline and integration
        - M&A agreements and cohort integration bridge
      - - Customer concentration
        - Revenue/backlog by customer, platform, program, and F-35 exposure
        - Tests downside from Boeing/Lockheed/DoD concentration
        - Customer calls, contract sampling, and F-35 sensitivity analysis
      - - RAPID proof
        - Cycle time, first-pass yield, qualification success, escaped defects before/after RAPID
        - Validates AI platform moat rather than marketing claim
        - Technical diligence and operating metric cohort
      - - Cap table and terms
        - Pre/post money, option pool, liquidation preference, pro rata, side letters, debt obligations
        - Determines whether gross exit value produces investable returns
        - Counsel review of financing docs and waterfall model
      - - Exit path
        - Strategic acquirer map, likely IPO readiness milestones, banker feedback, secondary interest
        - Frames hold period and terminal multiple risk
        - Banker calls, strategic-buyer checks, and board exit plan
    notes: Each ask is designed to move the recommendation to buy, price-reset, or avoid.
    claimRefs:
      - CV037
      - CV039
      - CV041
      - CV043
      - CV044
      - CV045
