      - number: '7.4'
        title: Financial model, key-person, and acquisition execution risk
        blocks:
          - type: paragraph
            body: >-
              The financial risk is not just that AMCA is private and unaudited; it is that the model likely consumes
              cash in several directions at once. The Series B gives AMCA $300 million of new capital and an over-$1
              billion valuation, but the public record discloses no revenue base, gross margin, backlog, EBITDA, debt,
              working capital, purchase commitments, integration cost, capex plan, or audited financials. AMCA plans
              both to acquire additional factories and create new ones, so the investment case depends on whether
              acquired suppliers can fund throughput gains without quality slippage or excessive inventory, and whether
              the valuation step-up is supported by contract economics rather than defense-tech enthusiasm. Execution
              risk is also concentrated. Public sources emphasize Jai Malik's thesis and Eli Giovanetti's SpaceX
              production background; TechCrunch's 2024 report that Malik shut Countdown Capital after concluding
              hard-tech VC was “not inefficient enough to justify our existence” is an adverse signal to interrogate,
              not a disqualifier. The mitigation package should include audited financials, acquisition pipeline terms,
              debt schedule, factory-level working-capital bridge, integration scorecard, retention plans for selling
              owners, and governance depth beyond the founders.
