  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and compliance burden
        blocks:
          - type: paragraph
            body: >-
              AMCA is building inside a rule set that can move from qualification advantage to gating risk. The company
              publicly says its manufacturing base is AS9100-certified and serves defense platforms, classified
              programs, and U.S. sustainment needs, which makes ITAR, export-control, cybersecurity, quality-system, and
              classified-handling discipline central rather than back-office. CMMC is the clearest dated risk: Pillsbury
              and Fox Rothschild both state the final DFARS acquisition rule became effective on November 10, 2025, with
              a three-year phase-in, annual SPRS affirmations, flow-down obligations, and False Claims Act exposure for
              inaccurate compliance representations. DefenseScoop adds the adverse operating reality that many
              defense-industrial-base suppliers remain unprepared and may need months of process, documentation, or
              cloud redesign to prove controls. For AMCA, this is not merely a checklist; acquiring legacy suppliers
              creates inherited system boundaries, inconsistent policies, supplier-flowdown evidence gaps, and bid
              eligibility risk. Mitigation should include a mapped CUI/FCI inventory, CMMC level by contract,
              ITAR/export-control registration evidence, AS9100 audit exceptions, classified-program facility
              procedures, and annual affirmation governance before underwriting defense growth.
            claimRefs:
              - CR001
              - CR002
              - CR003
