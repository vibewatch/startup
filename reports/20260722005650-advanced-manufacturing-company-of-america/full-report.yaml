              positive proxies are strong: decades-long supplier histories, AS9100-qualified factories, platform
              placements on long-lived aircraft and defense systems, supplier-quality rankings, and site language that
              invites buyers to use AMCA companies as already qualified second sources when quality, lead time, or
              pricing is strained. In aerospace and defense, switching costs are operational and procedural: a buyer
              replacing a qualified component supplier must manage engineering data, qualification tests, quality
              systems, CMMC/DFARS cyber expectations when defense information is in scope, documentation, and
              program-office risk. That lock-in can support retention once qualified, but it also slows new account
              expansion. Lockheed’s supplier guidance illustrates this friction by requiring current CMMC and
              NIST-assessment readiness from suppliers. AMCA should therefore be diligence-tested on renewal, contract
              term, source-control status, and top-platform revenue rather than assumed sticky from logos alone. The
              diligence posture should therefore treat qualification as both moat and bottleneck: a customer is unlikely
              to switch casually, yet a new AMCA variant can also wait through a long evidence, cyber, and quality
              review before revenue scales.
            claimRefs:
