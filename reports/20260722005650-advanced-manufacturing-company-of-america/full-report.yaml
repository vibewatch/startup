  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacent defense tech, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              AMCA’s competitive set is broader than an ordinary machine-shop roll-up. The closest direct pressure comes
              from AI-automated and software-defined manufacturing peers: Hadrian in precision parts and automated
              factories, Divergent in digital/additive manufacturing, and Senra in software-driven wire harnesses.
              Adjacent defense-tech platforms such as Anduril matter because they can buy suppliers, reserve capacity,
              and pull manufacturing inside a prime-like operating model. Incumbent roll-ups and public strategics
              matter for a different reason: TransDigm, Howmet, VSE, traditional PE platforms, and primes’ existing
              supplier bases already control qualification history, procurement channels, and customer trust. The status
              quo therefore includes internal build and existing qualified vendors, not merely underperforming legacy
              shops. AMCA’s sharper wedge is acquire-and-modernize: buy certified suppliers, add RAPID, and close the
              engineering-to-qualified-production gap.
            claimRefs:
