      - number: '8.3'
        title: Bull, base, bear, and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The scenario tree is intentionally range-based because precise private-company valuation math would be
              false precision. In the bull case, AMCA proves that acquired qualified suppliers plus RAPID can create
              proprietary or sole-source components, recurring sustainment content, and enough revenue scale to make a
              $3 billion to $5 billion exit plausible. In the base case, AMCA remains strategically credible but
              insufficiently disclosed, so investors keep access, ask for information rights, and wait for a better
              entry or hard metric proof. In the bear case, the Series B reflects peak defense-tech enthusiasm while
              factories, acquisitions, and working capital consume capital faster than gross profit scales. The main
              downside triggers are measurable: revenue/backlog refusal, margin weakness, integration slippage, customer
              concentration in Boeing/Lockheed/DoD or F-35 sustainment, and a defense-tech liquidity window that closes
              before AMCA reaches exit scale.
