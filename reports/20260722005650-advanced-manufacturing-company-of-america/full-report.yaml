    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Advanced Manufacturing Company of America, branded Amca, should be treated as a private Series B
              aerospace-and-defense critical-component platform headquartered in El Segundo, California, rather than as
              a conventional parts broker or generic industrial automation company. The core model is a hybrid roll-up
              and build-new-factories strategy: acquire legacy AS9100-qualified aerospace and defense suppliers,
              preserve their embedded customer trust and workforce, then add engineering, qualification testing,
              technical data package development, certified manufacturing capacity, and software-enabled workflows.
              Official and independent sources converge that Amca was founded in 2024, publicly launched in April 2025,
              and by May 2026 operated six critical-component factories in California, Iowa, and New York plus an El
              Segundo advanced prototyping and testing facility. The strongest one-line summary is that Amca designs,
              qualifies, and manufactures flight- and mission-critical components between commodity parts and full
              systems, including hydraulics, avionics, power electronics, sensors, switches, transformers, magnetics,
              and flight-control-related products.
