      - number: '2.3'
        title: Buyer, user, payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation is more complex than a single DoD customer. Defense primes are the most visible
              economic buyers and channels because AMCA names Boeing, Lockheed Martin, Northrop Grumman, Airbus,
              Embraer, Honeywell, Raytheon, and others, and because its components feed the F-35, F-16, F/A-18, Mk-48,
              M1 Abrams, classified programs, and commercial aircraft. DoD sustainment and readiness programs are a
              distinct payer path when a platform has declining sources or readiness-related part shortages. Commercial
              aerospace OEMs and aftermarket operators matter because AMCA's acquired businesses supply Boeing aircraft,
              737MAX, Honeywell, GE, and broader commercial platforms. The seller side also matters: legacy owners of
              AS9100-capable component suppliers are AMCA's acquisition funnel, and their embedded trust can shorten
              customer adoption. El Segundo adds a cluster advantage rather than a buyer by itself, placing AMCA near a
              dense A&D manufacturing and defense-tech ecosystem.
