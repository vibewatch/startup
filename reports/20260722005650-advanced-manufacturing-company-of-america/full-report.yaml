  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status quo
        blocks:
          - type: paragraph
            body: >-
              AMCA should be underwritten as an aerospace and defense component-platform company, not as a generic
              factory-automation vendor or a new defense prime. The included market is the qualified component layer
              that sits between commodity inputs and full systems: hydraulics, avionics, power electronics, sensors,
              switches, transformers, magnetics, flight-control computers, human-machine interfaces, and related
              engineering, testing, technical-data, and certified manufacturing work. That boundary fits the
              ResearchAndMarkets definition of specialized parts for commercial aircraft, military defense systems, and
              space applications, and it fits AMCA's launch framing that the neglected layer is neither standardized
              parts nor full systems. Excluded spend should therefore include complete aircraft or weapons systems,
              prime integration, broad industrial automation, commodity materials, and nonqualified job-shop work.
              Status-quo substitutes are legacy single-source suppliers, internal prime engineering teams, long
              qualification cycles for alternate sources, and slower sustainment procurement rather than a single
              software vendor category.
