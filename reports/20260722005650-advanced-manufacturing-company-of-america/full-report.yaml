      - number: '3.3'
        title: Distribution, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Supplier displacement in aerospace and defense is hard because parts are entangled with qualification
              evidence, tooling, technical data, compliance, platform history, and prime procurement. That supports
              AMCA’s thesis: acquiring certified legacy suppliers can buy qualification depth and customer access that a
              greenfield factory must earn. The same facts also protect incumbents. Strategic buyers and primes can
              acquire scarce suppliers, reserve capacity, or keep programs inside existing qualified networks. Hadrian
              can challenge on automation throughput and committed facilities; Divergent can challenge on
              digital/additive part redesign; Senra can own a critical harness bottleneck; Anduril can integrate
              manufacturing into broader defense systems. AMCA’s moat is therefore medium-durable unless private
              evidence proves RAPID and its acquired factories win repeat programs at better lead time, quality, and
              economics than those alternatives. The investment case should therefore track evidence of repeatable
              supplier integration: how quickly acquired shops adopt RAPID, whether engineering artifacts transfer
              across sites, whether customers approve new or redesigned parts faster, and whether utilization improves
              without sacrificing quality. Those are the proof points that would turn a narrative moat into measurable
              switching cost.
