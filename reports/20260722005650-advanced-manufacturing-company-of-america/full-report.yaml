  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Legacy acquired product lines have stronger maturity signals than the still-private RAPID architecture and
      cross-site integration proof.
    data:
      columns:
        - Public maturity
        - Evidence strength
        - Residual diligence risk
