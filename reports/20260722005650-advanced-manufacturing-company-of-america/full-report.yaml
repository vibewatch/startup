      - number: '3.4'
        title: 'Adverse view: capitalized rivals, commoditization, and missing win/loss proof'
        blocks:
          - type: paragraph
            body: >-
              The adverse case is unusually concrete. Hadrian, Anduril, Divergent, and Senra are not underfunded
              imitators; they have large recent rounds, overlapping top-tier investors, and strategies that can absorb
              parts of AMCA’s value proposition. Hadrian can automate factories and sell committed capacity, Divergent
              can redesign manufacturing around additive and digital workflows, Senra can dominate a high-friction
              component category, and incumbent roll-ups can outbid AMCA for certified suppliers. Malik’s own Countdown
              Capital closure adds a useful skeptical lens: he previously argued that large multi-stage firms, not small
              specialists, were best positioned to win hard-tech industrial opportunities. That does not refute AMCA,
              which is an operating company rather than a seed fund, but it forces diligence on whether AMCA’s
              qualification depth and acquisition execution create a durable edge rather than a capital-intensive race.
              The diligence burden is correspondingly operational. A clean competitive pass would require program-level
              quote histories, cycle-time data, first-pass yield, escaped-defect rates, customer-award rationales, and
              acquisition pipeline conversion. Without those, the public record supports a differentiated strategy but
              not yet an unassailable moat.
