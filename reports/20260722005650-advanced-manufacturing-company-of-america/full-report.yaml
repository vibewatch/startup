      - number: '8.2'
        title: Comparable support, defense-tech froth, and entry math
        blocks:
          - type: paragraph
            body: >-
              The comp set is supportive of scarce mission-critical capacity, but it is too wide to justify a clean AMCA
              multiple. Traditional aerospace and defense M&A data show strong demand: PCE’s Q2 2026 market update
              reports 18.96x median TEV/EBITDA and 4.09x median TEV/revenue, while First Page Sage and Capstone frame
              defense assets as premium but cyclical. Defense-tech venture comps pull the other direction. Anduril’s $61
              billion valuation implies about 28x trailing revenue, but Anduril has disclosed a $2.2 billion revenue
              base, large contracts, and a scale profile AMCA has not shown publicly. Nexi, S&P Global, and Venture
              Capital Insiders all warn that 2026 defense-tech pricing may mix structural reallocation with bubble
              behavior, especially where revenue multiples outrun procurement conversion. On PCE’s revenue multiple
              alone, AMCA would need roughly $269 million of annual revenue to support $1.1 billion; public sources do
              not prove that.
