      - number: '3.2'
        title: Scale, capability, and packaging comparisons
        blocks:
          - type: paragraph
            body: >-
              The public comparison is a scale-versus-scope trade. Hadrian is the most direct factory-model peer: it has
              a $260 million Series C, Factory 3 in Mesa, Factories-as-a-Service, and a software/automation story aimed
              at space and defense parts. Divergent is deeper in additive and digital production, with DAPS positioned
              from rapid design through automated assembly. Senra is narrower but dangerous in a bottleneck component
              class, because wire harnesses are manually intensive and ubiquitous across aircraft, spacecraft,
              satellites, launch vehicles, and defense systems. AMCA’s advantage is not raw capital against Anduril or
              pure automation against Hadrian; it is the combination of acquired AS9100-qualified capacity, engineering,
              qualification testing, technical-data-package work, and production support. Pricing remains mostly opaque,
              so the useful public comparison is packaging: part programs, committed capacity, factory services,
              DAPS-enabled production, harness programs, and incumbent contract vehicles. One further nuance is that
              public funding numbers overstate competitive certainty: capacity has to convert into qualified shipped
              parts on specific platforms, and the time-to-qualification bottleneck can dominate factory automation. For
              that reason, AMCA should be compared on qualified program conversion and customer acceptance, not only
              square footage or capital raised.
