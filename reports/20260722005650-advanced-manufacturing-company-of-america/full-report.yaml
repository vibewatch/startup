      - number: '6.4'
        title: Expansion, concentration, and adverse view
        blocks:
          - type: paragraph
            body: >-
              Expansion upside comes from three vectors: adding acquired factories with legacy customer approvals,
              increasing content per platform through engineering and product-catalog investment, and using RAPID plus
              in-house qualification to answer new program requests faster. Those vectors are credible because AMCA
              already names major primes and OEMs and says it can deliver parts to major customers 67% faster than the
              existing supply chain. The adverse angle is equally specific. Customer breadth may be overstated if
              Boeing, Lockheed/F-35, DoD sustainment, or classified BC Systems programs dominate revenue. Oliver Wyman’s
              2026 defense-industrial-base work highlights a backlog-stressed, hollow-middle supplier base, while Roland
              Berger and Aviationist describe persistent aerospace supply-chain vulnerability. That environment creates
              demand for AMCA, but also makes procurement approval, program concentration, customer-funded
              qualification, and classified-program opacity material diligence items before underwriting repeatability.
              The mitigation is not simply adding more logos; it is proving diversified purchase orders, recurring
              demand across factories, and referenceable customer willingness to qualify AMCA for new part families
              after the acquisition integration period.
