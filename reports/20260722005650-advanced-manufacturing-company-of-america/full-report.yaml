      - number: '7.5'
        title: Mitigation, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The risk stance should be severity-ranked but conditional: most AMCA risks are not inherently fatal if the
              company can prove that it has converted legacy supplier fragility into auditable operating control. The
              diligence package should be specific and monitorable. Regulatory risk falls if AMCA can show current
              CMMC/ITAR/export-control ownership, annual affirmation controls, AS9100 audit closure, and
              classified-program segregation. Operational risk falls if factory-level on-time delivery, quality escapes,
              qualification-cycle time, staffing, bottleneck, and supplier-substitution metrics improve after
              acquisition. Program concentration risk falls if F-35 and Boeing/Lockheed exposure is diversified across
              funded platforms with purchase orders, not merely logos. Financial risk falls if audited statements,
              backlog, margin bridge, integration cost, capex, inventory turns, and leverage show the roll-up can scale
              without constant equity. Kill triggers should be hard: a failed CMMC eligibility gate, unresolved
              ITAR/export-control deficiency, loss of AS9100 status, major quality escape on a flight-critical
              component, qualification cycle slippage that breaks customer delivery, customer concentration above a
              prudent limit without take-or-pay support, or founder/key-operator departure without continuity should
              pause or reprice the investment.
