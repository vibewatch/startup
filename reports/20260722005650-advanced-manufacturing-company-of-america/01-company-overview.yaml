  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private operating metrics
    missingEvidence: Revenue, ARR, bookings, backlog, gross margin, burn, runway, customer concentration, headcount, and facility-level utilization by acquired business and new factory.
    whyItMatters: These metrics determine whether Amca's valuation reflects executable operating scale or primarily capital-market confidence and acquisition velocity.
    diligencePath: Request audited financials, monthly KPI pack, backlog by program, revenue bridge, factory P&Ls, headcount census, and customer concentration schedule.
    relatedQuestionRefs:
    - QO018
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: financing and governance terms
    missingEvidence: Series B term sheet, post-money capitalization table, share class economics, liquidation preference, debt/credit facilities, secondary allocation, board seats, observer rights, and protective provisions.
    whyItMatters: The $1B-plus valuation and repeated Caffeinated lead position cannot be underwritten without understanding ownership, control, downside protection, and financing structure.
    diligencePath: Obtain the cap table, financing documents, investor-rights agreement, debt schedule, board minutes, and pro-rata/side-letter summaries.
    relatedQuestionRefs:
    - QO010
    - QO016
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table coverage
    missingEvidence: Complete current executive roster, board members, observers, succession plan, and functional ownership beyond Malik and Giovanetti.
    whyItMatters: Public evidence supports founder-market fit but not a complete governance or succession-risk assessment.
    diligencePath: Request management bios, org chart, board and observer list, delegated authority matrix, and emergency succession plan.
    relatedQuestionRefs:
    - QO007
    - QO010
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder or investor map coverage
    missingEvidence: Full investor list by round, ownership percentages, insider versus new-money allocation, any customer/investor commercial rights, and strategic restrictions.
    whyItMatters: Public investor names do not reveal who controls governance, who has reserves, or whether strategic relationships constrain customer neutrality.
    diligencePath: Reconcile primary financing documents, data-room cap table, investor consents, board approvals, and side letters against public announcements.
    relatedQuestionRefs:
    - QO015
    - QO016
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: material
    topic: Milestone table and acquisition chronology coverage
    missingEvidence: Exact incorporation date, closing dates and consideration for acquisitions, facility opening dates, certification dates, customer-award dates, and integration milestones.
    whyItMatters: Acquisition velocity is central to the overview, but timing and integration quality cannot be fully assessed from public announcements alone.
    diligencePath: Request corporate chronology, purchase agreements, integration scorecards, certification registers, customer award notices, and board approval packages.
    relatedQuestionRefs:
    - QO021
    - QO022
    - QO028
    relatedTableRefs:
    - TO004
