- id: capital-formation-and-stakeholders
  title: Funding history, valuation, and stakeholder map
  body: 'The capital record is coherent at the headline level but still incomplete at the securities-detail level. Amca launched publicly in April 2025 with $76.5 million in initial funding led by Caffeinated Capital, with Founders Fund, Lux Capital, Andreessen Horowitz, Construct Capital, and others present across the launch coverage. In May 2026 it announced a $300 million Series B led again by Caffeinated Capital, with major Lightspeed Venture Partners participation and continued support from a16z, Lux, Construct, and House Capital. Official Series B materials state a valuation over $1 billion, while TechCrunch’s unicorn tracker reports a $1.1 billion valuation and more than $370 million raised to date, citing PitchBook. Malik told Tectonic that the valuation step-up from the prior round was closer to five to seven times, not one to two times. What is missing is material: no public source disclosed share price, liquidation preference, ownership, secondaries, debt/credit facilities, or board/control rights.'
