- id: leadership-and-key-person-risk
  title: Founders, leadership coverage, and key-person dependence
  body: 'The overview is unusually founder-centric. Jai Malik is consistently the public voice for the thesis, financing narrative, acquisition strategy, and RAPID lead-time claims; he is also the bridge from early hard-tech venture investing into operating control. Independent background sources show Malik as the founder and general partner of Countdown Capital, a hard-tech fund active from 2020 until its 2024 shutdown, Forbes 30 Under 30 venture-capital recognition in 2023, NYU Stern education, and prior Rocana Ventures experience. Eli Giovanetti, president/COO and co-founder, supplies the complementary operating credential: Amca and Manufacturing Dive describe him as a former senior production and engineering leader at SpaceX. That pairing creates founder-market fit, but also a diligence concentration. Public sources do not yet publish a complete board, observer-rights schedule, executive roster, or succession plan, so later chapters should treat governance and key-person mitigation as open until management supplies the data room evidence.'
