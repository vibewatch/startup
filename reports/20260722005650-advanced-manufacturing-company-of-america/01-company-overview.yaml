- id: open-metrics-and-adverse-signals
  title: Open metrics, compliance context, and adverse signals
  body: 'The most important overview gaps are not exotic; they are the private-company basics that public sources do not disclose. Malik told Tectonic the company had “10X-ed” its top line versus the prior year, but he did not provide absolute revenue, ARR, gross margin, burn, runway, order backlog, customer concentration, headcount, or facility-level utilization. That leaves the $1.0B-plus valuation supported by capital-market appetite, mission relevance, and rapid acquisition activity rather than publicly auditable operating scale. The adverse signal is also founder-linked: TechCrunch reported in January 2024 that Malik would shut down Countdown Capital after concluding early-stage hard-tech funding was not inefficient enough for a small specialist fund to justify itself and that larger multistage funds were better positioned. That does not disprove Amca, but it is a useful caution about thesis dependence, capital intensity, and whether AMCA’s operating model can outperform the very funding-market dynamics Malik previously criticized. Compliance sources add a second diligence track around AS9100, ITAR, CMMC, traceability, and sub-tier visibility.'
