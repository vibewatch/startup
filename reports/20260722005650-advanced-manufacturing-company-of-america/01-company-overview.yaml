- id: milestones-scale-and-acquisitions
  title: Milestones, acquisitions, and scale signals
  body: 'Amca’s dated record shows a rapid consolidation and factory-build sequence rather than a single-product launch. The April 2025 launch established the $76.5 million capital base and first acquisition, Electro-Mech Components in South El Monte, California, a switch and human-machine-interface supplier with Boeing customer proof. Manufacturing Dive reports Cal-Draulics was added in August 2025 as a high-precision hydraulic-products supplier in Corona, California. In February 2026 Amca announced Electrocube, a Pomona power-electronics supplier founded in 1961 and described as a top-20 Boeing direct supplier for quality, on-time delivery, and responsiveness, followed a week later by Payne Magnetics, a Covina magnetics supplier founded in the 1950s with products on 737MAX, F-16, and F-18 platforms. The May 2026 Series B also revealed BC Systems, a New York power-electronics supplier supporting classified defense programs. These events explain the current six-factory, 123,000-plus-square-foot footprint, but acquired-company financials and integration KPIs are still private.'
