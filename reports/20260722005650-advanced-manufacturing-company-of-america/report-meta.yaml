companyProfile:
  summary: >-
    Advanced Manufacturing Company of America (AMCA, branded "Amca") is an El Segundo, California defense-and-aerospace
    manufacturer founded in 2024 and publicly launched in April 2025. It pursues a buy-and-build strategy — acquiring
    legacy, often family-owned aerospace/defense component suppliers and, where no supplier fits a program, building new
    factories — then modernizing them with its AI-driven RAPID platform to accelerate design, qualification, and
    production of precision parts (hydraulics, avionics, power electronics, human-machine interfaces). It supplies
    defense primes and OEMs including Boeing, Lockheed Martin, Northrop Grumman, RTX, and Airbus, as well as DoD
    programs such as the F-35. AMCA operates six-plus factories across California, Iowa, and New York with 123,000+
    square feet of qualified capacity, and closed a $300M Series B in May 2026 at a reported ~$1.1B valuation.
  foundedDate: null
  founders:
    - name: Jai Malik
      role: Co-founder & CEO
      background: Serial deep-tech investor who previously founded Countdown Capital (hard-tech / industrial focus) with an NYU Stern background and earlier Rocana Ventures experience.
      claimRefs: [CO006, CO009]
    - name: Eli Giovanetti
      role: Co-founder & President/COO
      background: Described by AMCA and Manufacturing Dive as a former senior production and engineering leader at SpaceX.
      claimRefs: [CO007, CO008]
  foundingLocation: El Segundo, California, USA
  headquarters: El Segundo, California, USA (six-plus factories across California, Iowa, and New York)
  productSummary: >-
    Precision aerospace and defense components — hydraulics, avionics, power electronics/magnetics, and human-machine
    interface parts — produced by acquired specialist suppliers and modernized through the RAPID platform (AI-assisted
    rapid design, prototyping, qualification, and manufacturing) that AMCA says compresses lead times versus legacy
    job-shop timelines.
  customerFocus: Defense primes and aerospace OEMs (Boeing, Lockheed Martin, Northrop Grumman, RTX, Airbus) and U.S. Department of Defense programs including the F-35.
  businessModel: Acquire-and-modernize roll-up of legacy component suppliers, monetized by manufacturing and selling qualified precision parts into defense/aerospace supply chains, with the RAPID platform as the operating differentiator.
  stage: Series B
  fundingStatus: $300M Series B closed May 2026 led by Caffeinated Capital with major Lightspeed participation at a valuation over $1B (~$1.1B reported); approximately $376.5M raised to date including a $76.5M April 2025 launch round.
  disclosureProfile: private-undisclosed
  claimRefs: [CO003, CO004, CO014, CO022, CO023]
