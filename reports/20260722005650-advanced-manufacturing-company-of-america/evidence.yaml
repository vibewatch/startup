evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private operating metrics
    missingEvidence: >-
      Revenue, ARR, bookings, backlog, gross margin, burn, runway, customer concentration, headcount, and facility-level
      utilization by acquired business and new factory.
    whyItMatters: >-
      These metrics determine whether Amca's valuation reflects executable operating scale or primarily capital-market
      confidence and acquisition velocity.
    diligencePath: >-
      Request audited financials, monthly KPI pack, backlog by program, revenue bridge, factory P&Ls, headcount census,
      and customer concentration schedule.
    relatedQuestionRefs:
      - QO018
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financing and governance terms
    missingEvidence: >-
      Series B term sheet, post-money capitalization table, share class economics, liquidation preference, debt/credit
      facilities, secondary allocation, board seats, observer rights, and protective provisions.
    whyItMatters: >-
      The $1B-plus valuation and repeated Caffeinated lead position cannot be underwritten without understanding
      ownership, control, downside protection, and financing structure.
    diligencePath: >-
      Obtain the cap table, financing documents, investor-rights agreement, debt schedule, board minutes, and
      pro-rata/side-letter summaries.
    relatedQuestionRefs:
      - QO010
      - QO016
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table coverage
    missingEvidence: >-
      Complete current executive roster, board members, observers, succession plan, and functional ownership beyond
      Malik and Giovanetti.
    whyItMatters: Public evidence supports founder-market fit but not a complete governance or succession-risk assessment.
    diligencePath: >-
      Request management bios, org chart, board and observer list, delegated authority matrix, and emergency succession
      plan.
    relatedQuestionRefs:
      - QO007
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder or investor map coverage
    missingEvidence: >-
      Full investor list by round, ownership percentages, insider versus new-money allocation, any customer/investor
      commercial rights, and strategic restrictions.
    whyItMatters: >-
      Public investor names do not reveal who controls governance, who has reserves, or whether strategic relationships
      constrain customer neutrality.
    diligencePath: >-
      Reconcile primary financing documents, data-room cap table, investor consents, board approvals, and side letters
      against public announcements.
    relatedQuestionRefs:
      - QO015
      - QO016
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: Milestone table and acquisition chronology coverage
    missingEvidence: >-
      Exact incorporation date, closing dates and consideration for acquisitions, facility opening dates, certification
      dates, customer-award dates, and integration milestones.
    whyItMatters: >-
      Acquisition velocity is central to the overview, but timing and integration quality cannot be fully assessed from
      public announcements alone.
    diligencePath: >-
      Request corporate chronology, purchase agreements, integration scorecards, certification registers, customer award
      notices, and board approval packages.
    relatedQuestionRefs:
      - QO021
      - QO022
      - QO028
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: AMCA SOM conversion
    missingEvidence: >-
      AMCA revenue by segment, backlog, customer concentration, win rate, pipeline, production capacity utilization, and
      margin by component family.
    whyItMatters: >-
      Public TAM and budget signals cannot be converted into a defensible share-capture or valuation model without
      operating evidence.
    diligencePath: >-
      Request management KPI pack by factory and customer, purchase orders, backlog aging, gross margin by product
      family, and customer reference calls.
    relatedQuestionRefs:
      - QM026
      - QM027
  - type: conflicting-data
    severity: material
    topic: sizing methodology
    missingEvidence: >-
      A bottom-up study that isolates U.S. qualified aerospace and defense critical-component spend addressable by AMCA
      from broader global component revenue and budget authorizations.
    whyItMatters: >-
      The $79.25B TAM, $25B munitions/supply-chain pool, and DPA funding are useful but non-additive lenses that can
      overstate serviceable market if blended.
    diligencePath: >-
      Build a bottoms-up SAM from platform bill-of-material slices, sole-source components, replacement rates,
      qualification timelines, and AMCA factory capacity.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: adoption funnel conversion
    missingEvidence: >-
      Measured conversion rates from AMCA pilots or engineering starts through qualification, production release, repeat
      orders, and platform expansion.
    whyItMatters: >-
      RAPID lead-time claims are credible directionally, but adoption speed and repeatability determine how quickly
      market demand becomes revenue.
    diligencePath: >-
      Ask for RAPID cohort data, cycle-time baselines, qualification pass rates, rejected designs, and contract
      expansion history.
    relatedQuestionRefs:
      - QM019
      - QM027
  - type: enumeration-incomplete
    severity: minor
    topic: competitor profile table
    missingEvidence: >-
      A complete census of every AS9100 aerospace and defense component supplier, private-equity platform, and
      prime-owned internal component operation competing with AMCA.
    whyItMatters: >-
      The profile table is intentionally a material public sample, so obscure private suppliers and captive internal
      operations may be missing.
    diligencePath: >-
      Build a buyer-by-platform approved-vendor map from customer procurement data, SAM.gov awards, AS9100 registries,
      and management’s CRM exports.
    relatedQuestionRefs:
      - QP001
      - QP025
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: win/loss
    missingEvidence: >-
      Customer-level win/loss data against Hadrian, Divergent, Senra, Anduril, incumbent suppliers, primes internal
      build, and PE-backed roll-ups.
    whyItMatters: Public positioning cannot prove whether AMCA actually displaces alternatives in production programs.
    diligencePath: >-
      Request anonymized opportunity exports, evaluated-alternative fields, proposal scores, reasons lost, and five
      customer calls discussing alternatives.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing and packaging
    missingEvidence: >-
      Realized unit pricing, capacity-reservation fees, discounts, minimums, qualification charges, and gross margin by
      component class for AMCA and named peers.
    whyItMatters: >-
      Pricing opacity prevents a true comparison of AMCA economics against factories-as-a-service, DAPS, harness
      programs, or incumbent suppliers.
    diligencePath: >-
      Review top contracts, quote histories, capacity commitments, costed BOMs, and renewal/expansion price changes
      under NDA.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer evaluated alternatives
    missingEvidence: >-
      Specific named customers that evaluated AMCA against Hadrian, Divergent, Senra, Anduril, incumbent roll-ups, or
      internal build before award.
    whyItMatters: Moat durability depends on head-to-head choice evidence, not just overlapping market narratives.
    diligencePath: >-
      Run reference calls with Boeing, Lockheed, Northrop, Honeywell, and DoD sustainment buyers focused on evaluated
      alternatives and switching frictions.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: >-
      Independent lead-time, quality, yield, rework, and dollar-per-qualified-part benchmarks comparing AMCA, Hadrian,
      Divergent, Senra, and incumbent suppliers.
    whyItMatters: RAPID and peer automation claims are not normalized to a common task or component class in public evidence.
    diligencePath: >-
      Commission a blind benchmark on comparable component programs using fixed qualification criteria, lead time,
      yield, and cost metrics.
    relatedQuestionRefs:
      - QP013
      - QP026
