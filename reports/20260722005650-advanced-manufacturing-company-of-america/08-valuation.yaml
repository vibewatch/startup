  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue opacity
    missingEvidence: Current revenue, recognized revenue, booked backlog, EBITDA, gross margin, and revenue bridge by factory
      and product line.
    whyItMatters: Without the revenue base, investors cannot compute AMCA revenue multiple, EBITDA multiple, cash conversion,
      or support for the $1.1B valuation.
    diligencePath: Request board-approved financials, ERP exports, backlog schedule, and customer/product revenue cohort under
      NDA.
    relatedQuestionRefs:
    - QV010
    - QV030
  - type: private-evidence-only
    severity: material
    topic: financing terms
    missingEvidence: Pre-money, option pool, liquidation preferences, participation, pro rata rights, side letters, debt,
      seller notes, and investor ownership.
    whyItMatters: Preference and dilution terms determine whether a future exit value creates venture returns from the Series
      B price.
    diligencePath: Review signed financing documents, waterfall model, debt schedules, and cap table with company counsel.
    relatedQuestionRefs:
    - QV027
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table
    missingEvidence: A complete banker-grade comp set with current public trading multiples for VSE, TransDigm, Howmet, Lockheed,
      RTX, Northrop, and private defense-tech secondary marks.
    whyItMatters: The table is a representative sample sufficient for chapter gating, not a fairness opinion or complete valuation
      deck.
    diligencePath: Commission banker comp pack and refresh public trading multiples immediately before IC.
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Revenue and backlog by top customer, platform, contract vehicle, program status, and F-35 exposure.
    whyItMatters: Blue-chip logos improve credibility but concentration can dominate downside and exit readiness.
    diligencePath: Review top-20 customer contracts, backlog aging, program-level forecasts, and customer reference calls.
    relatedQuestionRefs:
    - QV028
    - QV030
