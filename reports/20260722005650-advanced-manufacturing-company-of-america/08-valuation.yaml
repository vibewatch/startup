- id: TV002
  title: Thesis / anti-thesis table
  targetSlug: thesis-anti-thesis-table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  rows:
  - - 'Thesis: DIB modernization tailwind'
    - FY2026 policy and industrial-base sources support domestic capacity demand
    - Confirmed booked backlog tied to funded programs
  - - 'Thesis: roll-up plus RAPID moat'
    - AMCA has acquired certified suppliers and claims >67% lead-time reduction
    - Cohort proof that acquired shops improve output and margins
  - - 'Thesis: blue-chip customer access'
    - AMCA names Boeing, Lockheed Martin, Northrop, Airbus, Honeywell, Raytheon, and others
    - Revenue concentration and renewal/expansion evidence by customer
  - - 'Anti-thesis: revenue opacity'
    - Only 10X top-line growth is public; absolute revenue and EBITDA are missing
    - Audited revenue, backlog, and margin bridge
  - - 'Anti-thesis: capital intensity'
    - Acquisitions, factories, inventory, tooling, and compliance consume cash before profitability
    - 24-month cash plan and acquisition-level P&Ls
  - - 'Anti-thesis: frothy defense-tech tape'
    - Nexi/VCI cite 17x-50x revenue startup multiples and risky valuation chasing
    - Entry price linked to actual revenue/EBITDA and downside protections
  notes: Arguments pair each evidence-backed thesis with a falsifiable diligence item.
