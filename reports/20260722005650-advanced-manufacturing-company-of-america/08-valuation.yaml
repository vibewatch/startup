  title: Recommendation summary table
  targetSlug: recommendation-summary-table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more
    - Series B and customer proof are strong; revenue, margin, and terms are private
    - Maintain relationship and require data-room proof before buy
  - - Confidence
    - Medium
    - Financing and comp facts are corroborated; operating metrics are opaque
    - Use private diligence to move confidence up or down
  - - Risk rating
    - High
    - Capital-intensive roll-up, F-35/customer concentration, and defense-tech froth
    - Require staged commitment or price protection
  - - Valuation stance
    - Expensive on public evidence
    - $1.1B post-money with no disclosed revenue; frothy comp environment
    - Do not underwrite headline mark without revenue support
  - - Decision trigger
    - Move toward buy only if revenue, EBITDA, backlog, and terms clear thresholds
    - Diligence asks are measurable
    - Convert to price reset or avoid if management cannot provide data
  notes: Recommendation reflects public evidence as of 2026-07-22; private financing terms and operating metrics are not disclosed.
