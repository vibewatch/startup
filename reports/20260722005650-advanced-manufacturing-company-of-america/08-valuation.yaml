slug: advanced-manufacturing-company-of-america
runDate: '2026-07-22'
company:
  name: Advanced Manufacturing Company of America
chapter:
  number: 8
  title: Valuation
  summary: 'AMCA is strategically credible after a $300M Series B at a $1.1B TechCrunch/PitchBook mark, but public evidence
    does not disclose revenue, EBITDA, margins, or terms. The recommendation is track / research-more: the DIB modernization
    thesis and customer proof are attractive, while defense-tech froth and roll-up opacity make the $1.1B price expensive
    on public evidence.'
sections:
- id: recommendation-price-discipline
  title: Recommendation and valuation stance
  body: 'Recommendation: track / research-more, not buy on public evidence at the $1.1 billion Series B mark. The positive
    case is real: AMCA has raised $300 million, reached unicorn status quickly, assembled a six-factory critical-component
    network, deployed RAPID across engineering-to-manufacturing workflows, and sells into aerospace and defense customers
    that matter. The price discipline problem is equally clear. Public sources disclose no absolute revenue, EBITDA, backlog,
    gross margin, acquisition purchase prices, preference stack, or customer concentration; Tectonic’s useful 10X top-line
    quote is a growth-rate marker, not a revenue base. The right committee framing is therefore evidence-sensitive rather
    than company-dismissive. AMCA may deserve a premium if private diligence proves proprietary parts, recurring sustainment
    revenue, integration speed, and strategic scarcity. Until then, the public record supports relationship building, data-room
    diligence, and a lower-risk entry trigger rather than underwriting a $1.1 billion post-money as self-evidently fair. The
    working assumption should be that public facts earn AMCA a diligence slot, while private facts must earn the valuation;
    this distinction avoids confusing strategic importance with price-insensitive underwriting.'
  claimRefs:
