- id: TV004
  title: Comparable valuation table
  targetSlug: comparable-valuation-table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - AMCA
    - Latest private round
    - $300M Series B; $1.1B TechCrunch/PitchBook mark; >$370M raised
    - Direct subject and entry price
    - No revenue, EBITDA, backlog, or terms disclosed
  - - A&D M&A median
    - PCE Q2 2026
    - 18.96x TEV/EBITDA; 4.09x TEV/Revenue across 143 LTM deals
    - Best sector transaction multiple anchor
    - Mix includes mature cash-flow assets, not early roll-up platforms
  - - Private military/defense aerospace
    - First Page Sage Q1 2025
    - 7.7x-14.7x EBITDA range
    - Private-market check on defense component pricing
    - Older dataset and EBITDA-based, while AMCA EBITDA is undisclosed
  - - VSE / Precision Aviation Group
    - Public strategic comp / transaction
    - PCE lists $2.15B VSE/PAG transaction; VSE files public 10-K
    - Shows public buyer appetite for aviation supply-chain assets
    - VSE is mature and disclosed; AMCA is private and early
  - - Anduril
    - Defense-tech late-stage comp
    - $61B valuation; about $2.2B 2025 revenue; ~28x trailing revenue per Forbes
    - Upper-bound defense-tech premium when revenue and contracts are visible
    - Different business model and much larger disclosed revenue base
  - - Hadrian
    - Automated factory peer
    - $260M Series C for space/defense factory expansion
    - Closest direct automated-manufacturing peer
    - Greenfield automation differs from AMCA acquisition roll-up
  - - Divergent
    - Digital/additive manufacturing peer
    - $290M financing to strengthen defense manufacturing
    - Software-defined manufacturing comp
    - Additive/DAPS model differs from certified supplier roll-up
  - - Senra Systems
    - Wire-harness manufacturing peer
    - $65M Series B; third facility planned
    - Narrow component bottleneck peer
    - Earlier/narrower category and no direct valuation read-through
  notes: Sample enumeration of valuation-relevant public, private, and M&A comparables; AMCA multiples cannot be computed
    without private revenue or EBITDA.
