- id: exit-readiness-and-final-asks
  title: Exit readiness and final diligence asks
  body: 'Exit readiness is the gating diligence theme. AMCA’s category has enough strategic relevance to attract capital,
    but the most relevant exit evidence is mixed: Crunchbase and Tech Times show record venture inflows and possible IPO candidates,
    while S&P Global flags slower aerospace and defense M&A after the 2021 peak. That creates a mark-to-market risk for a
    Series B investor: if public or strategic buyers insist on revenue proof and procurement durability, AMCA must arrive
    at exit with more than a reindustrialization story. The final diligence package should therefore focus on documents that
    convert narrative into underwriting: audited or board-approved revenue, backlog, EBITDA and gross margin by factory, acquisition-level
    P&Ls, purchase-price allocation, inventory and working-capital schedule, cap table and preference terms, customer concentration,
    F-35 exposure, and a banker-validated acquirer/IPO path. Failure to produce those materials should keep AMCA on watchlist
    only. Exit diligence should also test whether strategic buyers would prefer to buy AMCA as an integrated platform or selectively
    acquire individual component suppliers at lower multiples.'
