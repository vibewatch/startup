- id: TV005
  title: Thesis-break and kill triggers table
  targetSlug: thesis-break-and-kill-triggers-table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue proof missing
    - Management will not provide current revenue, backlog, or revenue bridge under NDA
    - Cannot support $1.1B price or revenue-implied multiple
    - Stay track / no term-sheet recommendation
  - - Margin proof weak
    - Factory-level gross margin and EBITDA do not improve after integration
    - Roll-up economics fail to resemble premium A&D asset profile
    - Demand price reset or pass
  - - Integration slippage
    - Acquired sites miss quality, delivery, or RAPID deployment milestones
    - Moat shifts from software-enabled platform to capital-heavy collection of shops
    - Pause until operating metrics recover
  - - Customer concentration shock
    - Top two customers or F-35-linked work dominate backlog without diversification
    - Demand signal becomes concentration risk
    - Require covenants, lower price, or avoid
  - - Preference stack overhang
    - Participating preferred, high liquidation stack, large option refresh, or debt/seller notes impair common upside
    - Exit value may not translate into investor return
    - Renegotiate terms or walk
  - - Market multiple compression
    - Defense-tech VC or A&D M&A multiples fall before AMCA reaches scale
    - Mark risk and exit path worsen
    - Only proceed with lower entry and larger margin of safety
  notes: Kill criteria translate unresolved valuation risks into monitorable investment actions.
