- id: TV003
  title: Bull / base / bear scenario table
  targetSlug: bull-base-bear-scenario-table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - RAPID shortens qualification, acquired suppliers win repeat programs, and revenue scale supports premium A&D/defense-tech
      comps
    - $1.1B entry can compound if exit reaches roughly $3.3B-$5.5B before dilution
    - Customer expansion, backlog conversion, and proprietary/sole-source mix are proven
    - Revenue/margin evidence fails or procurement timelines slip
  - - Base
    - Strategic need and customer access are credible, but private metrics remain incomplete
    - Track until revenue support clears $1.1B or entry resets toward lower risk
    - Investors preserve access and information rights while monitoring integration
    - No data-room access, terms are aggressive, or comp multiples compress
  - - Bear
    - Defense-tech funding was frothy, factories consume cash, and revenue is too concentrated or early
    - Flat/down round or strategic sale below last preferred stack
    - M&A/IPO window weakens and customer concentration dominates
    - Weak gross margin, F-35 shock, or failed integration of acquired suppliers
  notes: Scenario values are underwriting ranges, not company forecasts; actual returns require ownership, liquidation preference,
