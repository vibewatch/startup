- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Global A&D component growth
    - Driver
    - Current to 2030
    - Top-down market grows from $79.25B in 2026 to $111.52B by 2030
    - Reconcile AMCA's actual revenue mix against the component categories in the market report
  - - FY2026 defense budget and DPA industrial-base spending
    - Driver
    - FY2026
    - Budget authorization and accelerated obligations create demand signals for munitions, advanced manufacturing and supply-chain resilience
    - Track which appropriations flow to AMCA-addressable component programs rather than primes only
  - - Commercial aircraft and defense backlogs
    - Driver
    - Current
    - Large backlogs raise pressure on production rates, supplier reliability and aftermarket spares
    - Ask management for backlog, purchase orders and awarded program content by customer
  - - Onshoring and American Dynamism capital thesis
    - Driver
    - Medium-term
    - Investor and policy narratives favor domestic capacity, resilience and strategic manufacturing sovereignty
    - Test whether the thesis converts into non-dilutive funding, long-term contracts or preferred supplier status
  - - RAPID and integrated qualification workflow
    - Driver
    - Current
    - A claimed >67% lead-time cut could make AMCA attractive where primes need qualified hardware faster
    - Verify cycle-time baselines, qualification pass rates, customer acceptance and gross margin after RAPID deployment
  - - Hollow-middle Tier 2+ supplier fragility
    - Constraint / opportunity
    - Current
    - The same sub-tier weakness creates acquisition supply but can slow scaling after AMCA buys assets
    - Diligence each factory's labor, tooling, quality escapes, customer concentration and capex backlog
  - - Workforce and skilled-labor shortages
    - Constraint
    - Current to 2027
    - Personnel shortages and aging workforces can delay ramp even when demand and capital are present
    - Review machinist, engineer and quality-hire funnel, retention, training time and wage inflation
  - - Qualification, compliance and technical-data bottlenecks
    - Constraint
    - Current
    - AS9100, source qualification, technical-data rights, ITAR/CMMC-adjacent obligations and customer approvals can extend adoption cycles
    - Request qualification timelines by product family, open nonconformances, cybersecurity status and technical-data ownership
  notes: Drivers and constraints are paired because demand growth can coexist with slow conversion when qualification, labor, and capital gates bind.
