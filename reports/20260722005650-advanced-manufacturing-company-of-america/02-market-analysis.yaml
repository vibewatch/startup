- id: drivers-constraints-and-diligence-gaps
  title: Growth drivers, adoption constraints, and diligence gaps
  body: 'The growth case is unusually strong because demand is not the only signal: PwC reports trillion-dollar top-100 revenue and backlog milestones, Deloitte sees supply-chain pressure persisting through at least 2027, and Accenture expects defense acquisition spending to approach $1 trillion by 2027 while production falls behind demand. The adverse case is just as important. Oliver Wyman''s survey describes a base unprepared for a nearly $900 billion backlog, a hollow middle at Tier 2+, and workforce issues that could cripple ramp-up. Roland Berger still finds personnel, production-capacity, financing, and disruption constraints across aerospace suppliers, while The Aviationist preserves program-level examples around FLRAA and F-35 supply-chain risk. AMCA''s model is designed for these constraints, but the open underwriting question is not whether the market is large; it is whether AMCA can turn capital, acquired know-how, AS9100 qualification, and RAPID into defensible share, margin, and reliable delivery faster than the industrial base frictions it is trying to solve. That makes the diligence burden operational: verify bottlenecks cleared, not just budgets authorized.'
