company:
  name: Advanced Manufacturing Company of America
chapter:
  number: 2
  title: Market Analysis
  summary: AMCA's market is best bounded as qualified aerospace and defense critical components plus defense industrial-base modernization, not generic manufacturing software. Public evidence supports a $79.25B 2026 global A&D components TAM growing to $111.52B by 2030, reinforced by FY2026 U.S. defense-budget and DPA tailwinds, while conversion is constrained by hollow-middle suppliers, labor, capital intensity, compliance, and long qualification cycles.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, adjacencies, and status quo
  body: 'AMCA should be underwritten as an aerospace and defense component-platform company, not as a generic factory-automation vendor or a new defense prime. The included market is the qualified component layer that sits between commodity inputs and full systems: hydraulics, avionics, power electronics, sensors, switches, transformers, magnetics, flight-control computers, human-machine interfaces, and related engineering, testing, technical-data, and certified manufacturing work. That boundary fits the ResearchAndMarkets definition of specialized parts for commercial aircraft, military defense systems, and space applications, and it fits AMCA''s launch framing that the neglected layer is neither standardized parts nor full systems. Excluded spend should therefore include complete aircraft or weapons systems, prime integration, broad industrial automation, commodity materials, and nonqualified job-shop work. Status-quo substitutes are legacy single-source suppliers, internal prime engineering teams, long qualification cycles for alternate sources, and slower sustainment procurement rather than a single software vendor category.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM038
