callouts:
- calloutType: insight
  title: Underwrite multiple lenses, not one TAM headline
  body: The $79.25B 2026 A&D components market is the best public TAM anchor, but the more relevant adoption signal is the combination of FY2026 industrial-base policy, munitions/supply-chain funding, and AMCA-specific qualified capacity. Treat these as separate lenses until management provides revenue, backlog, and win-rate data.
  claimRefs:
  - CM006
  - CM016
  - CM017
  - CM046
  - CM047
- calloutType: risk
  title: Budgets do not automatically solve the hollow middle
  body: 'Oliver Wyman, Roland Berger, Deloitte and The Aviationist all preserve the adverse case: sub-tier suppliers lack labor, financing, visibility, digital maturity and qualification speed. AMCA can benefit from that gap only if acquired factories scale without recreating the same bottlenecks.'
