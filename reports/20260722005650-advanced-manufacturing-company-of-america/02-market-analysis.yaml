  tableRefs:
  - TM001
  figureRefs: []
- id: sizing-lenses-and-budget-tailwinds
  title: Sizing lenses and budget tailwinds
  body: 'The cleanest TAM anchor is the global aerospace and defense components estimate: $71.97 billion in 2025, $79.25 billion in 2026, and $111.52 billion by 2030, implying rapid 2026 growth and a still-strong 8.9% forecast CAGR. That number is directionally useful but not sufficient for AMCA because it includes global commercial, military, and space components, not the narrower U.S. qualified supplier pool AMCA can actually acquire or displace. A second lens is budget pull: the FY2026 NDAA authorizes $900.6 billion, strengthens the defense industrial base, and adds acquisition, technical-data, secondary-source qualification, advanced manufacturing, munitions, and workforce provisions. A third lens is near-term cash into the base: DoD plans to obligate all $152 billion of reconciliation funds in FY2026, including about $25 billion for munitions and supply-chain development and more than $1 billion through the Defense Production Act. These lenses are not additive, but together they show a large component pool plus unusually explicit modernization demand.'
