- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to AMCA
  rows:
  - - Qualified aerospace and defense components
    - Hydraulics, avionics, power electronics, sensors, switches, transformers, magnetics, flight-control computers, and HMI products
    - Complete aircraft, weapons systems, prime integration, and commodity unqualified parts
    - Defense primes, commercial OEMs, Tier 1s, and sustainment offices
    - Core market boundary for AMCA's acquired factories and RAPID-led development
  - - Defense industrial base modernization
    - Technical data, alternate-source qualification, critical readiness items, surge capacity, advanced manufacturing, munitions and supply-chain upgrades
    - Pure software modernization without component manufacturing; unrelated base operations
    - DoD acquisition, Navy/Army/Air Force sustainment, primes and Tier 1s
    - Budget and policy tailwind for faster qualified domestic capacity
  - - Military sustainment and readiness shortages
    - Parts for F-35, F-16, F/A-18, Mk-48, M1 Abrams and programs with declining supply sources
    - New platform prime awards where AMCA has no component workshare
    - DoD sustainment programs and prime product-support teams
    - AMCA claims direct support for readiness-related shortages
  - - Commercial aerospace components and aftermarket
    - Boeing, Airbus, 737MAX, widebody/narrowbody component production, MRO and replacement demand
    - Airline operations, airframe final assembly, commodity cabin products
    - Commercial OEMs, Tier 1 suppliers, aftermarket and MRO buyers
    - Important adjacency because AMCA suppliers have Boeing, Honeywell, GE, Airbus and Embraer links
  - - Status quo and substitutes
    - Legacy single-source suppliers, prime in-house engineering, slow alternate qualification, manual technical-data work
    - New autonomous platforms and finished defense systems
    - Prime supply-chain teams, platform program offices, supplier owners
    - The substitute is slower incumbent capacity rather than a single software competitor
  notes: 'Boundary is analytical: rows separate AMCA-serviceable qualified components and modernization work from broader primes, platforms, and generic manufacturing spend.'
