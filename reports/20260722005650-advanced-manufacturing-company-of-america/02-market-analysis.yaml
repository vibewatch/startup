  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: AMCA SOM conversion
    missingEvidence: AMCA revenue by segment, backlog, customer concentration, win rate, pipeline, production capacity utilization, and margin by component family.
    whyItMatters: Public TAM and budget signals cannot be converted into a defensible share-capture or valuation model without operating evidence.
    diligencePath: Request management KPI pack by factory and customer, purchase orders, backlog aging, gross margin by product family, and customer reference calls.
    relatedQuestionRefs:
    - QM026
    - QM027
  - type: conflicting-data
    severity: material
    topic: sizing methodology
    missingEvidence: A bottom-up study that isolates U.S. qualified aerospace and defense critical-component spend addressable by AMCA from broader global component revenue and budget authorizations.
    whyItMatters: The $79.25B TAM, $25B munitions/supply-chain pool, and DPA funding are useful but non-additive lenses that can overstate serviceable market if blended.
    diligencePath: Build a bottoms-up SAM from platform bill-of-material slices, sole-source components, replacement rates, qualification timelines, and AMCA factory capacity.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: adoption funnel conversion
    missingEvidence: Measured conversion rates from AMCA pilots or engineering starts through qualification, production release, repeat orders, and platform expansion.
    whyItMatters: RAPID lead-time claims are credible directionally, but adoption speed and repeatability determine how quickly market demand becomes revenue.
    diligencePath: Ask for RAPID cohort data, cycle-time baselines, qualification pass rates, rejected designs, and contract expansion history.
    relatedQuestionRefs:
    - QM019
    - QM027
