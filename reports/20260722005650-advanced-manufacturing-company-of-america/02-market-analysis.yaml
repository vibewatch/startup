- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Defense primes and Tier 1s
    - Supply-chain, program, engineering, and procurement leaders at Boeing, Lockheed, Northrop, RTX/Raytheon, BAE and peers
    - Platform engineers, quality teams, production planners and sustainment teams
    - Prime program budgets and pass-through government contracts
    - Qualify alternate components, raise throughput, reduce long-lead bottlenecks, protect platform schedules
    - Program management, operations, procurement and supply-chain leadership
    - Single-source fragility, delivery delays, new defense platform ramps, or critical part shortages
  - - DoD sustainment and readiness programs
    - Program offices, product-support managers, depots, service sustainment commands
    - Maintainers, readiness planners, depot engineers and warfighter support teams
    - Defense appropriations, sustainment budgets, DPA and industrial-base funds
    - Replace obsolete or declining-source parts, rebuild technical data, qualify secondary suppliers
    - Service acquisition and sustainment organizations
    - Readiness gaps, mission-capable-rate pressure, expiring supplier capacity or technical-data insufficiency
  - - Commercial aerospace OEM and aftermarket
    - Boeing, Airbus, Embraer, Honeywell, GE Aerospace, MRO and aftermarket leaders
    - Aircraft production, MRO, reliability, quality and supplier-management teams
    - OEM production budgets, aftermarket contracts and supplier-development spend
    - Supply qualified components, repair spares, support rate increases and improve supplier performance
    - Commercial-aircraft supply-chain and aftermarket organizations
    - Backlog growth, narrowbody/widebody ramp pressure, aging fleets and MRO demand
  - - Legacy supplier owners
    - Founders, family owners, private sellers and brokers of AS9100-capable component suppliers
    - Engineering and production workforces at acquired factories
    - AMCA acquisition capital and post-close investment budgets
    - Sell to AMCA, preserve know-how, expand engineering, modernize production and add customers
    - AMCA corporate development and operating leadership
    - Succession gaps, underutilized tooling, retirement risk, capital need or customer demand beyond current capacity
  - - El Segundo / advanced manufacturing ecosystem
    - A&D firms, defense-tech companies and manufacturing partners near the Southern California cluster
    - Engineers, prototyping teams, materials specialists and qualification teams
    - Corporate R&D, program, venture and industrial-expansion budgets
    - Prototype, qualify and industrialize critical components near major A&D players
    - Company engineering, product development and industrial operations leaders
    - Need for faster local production, proximity to primes and secure advanced-manufacturing capability
  notes: Rows map buyer/user/payer roles rather than exhaustive customers; actual conversion depends on qualification, contract access, and referenceable delivery performance.
