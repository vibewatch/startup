tables:
- id: TI001
  title: Revenue Streams Table
  targetSlug: revenue-streams-table
  notes: AMCA stream values are public-status categories only; no reviewed source discloses current dollars or mix.
  columns:
  - Stream
  - Mechanism
  - Billing / unit proxy
  - Public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Legacy acquired component lines
    - Sell existing qualified parts from acquired suppliers to primes/OEMs
    - Purchase orders or long-term supplier awards
    - Supported by Electro-Mech, Electrocube, Payne examples
    - Potentially durable if qualification and customer trust transfer
    - Provide revenue, margin, backlog, and customer concentration by acquired entity
  - - New qualified components
    - RAPID-led design, prototyping, qualification, and production for mission-critical needs
    - Program content or qualified part number
    - RAPID and F-35/commercial aircraft use cases described
    - High upside if AMCA wins sole-source positions
    - Provide pipeline by part number, qualification status, and expected annual shipset value
  - - Aftermarket and sustainment
    - Replacement, repair, obsolescence, readiness, and declining-source support
    - Spare part, repair order, sustainment contract
    - Official sources reference U.S. military sustainment programs
    - Highest-quality revenue if recurring and proprietary
    - Disclose aftermarket revenue share, repeat rate, and installed-base map
  - - Factory capacity expansion
    - Create or acquire factories to add qualified production capacity
    - Capacity utilization and factory output
    - Six factories and 123,000+ sq ft disclosed
    - Can compound revenue but consumes capital ahead of utilization
    - Provide utilization, bookings, capex, and working-capital needs per site
  - - Power electronics and magnetics
    - Transformers, TRUs, capacitors, EMI filters, and magnetics from Electrocube/Payne
    - Component SKU or platform order
    - Boeing, 737MAX, F-16, and F/A-18 exposure described
    - Good if inherited programs continue and variants expand
    - Show purchase-price allocation, gross margin, and design-win pipeline
  - - Hydraulics / avionics / switches / HMI
    - Certified components spanning hydraulics, avionics, switches, and HMI products
    - Component SKU or production lot
    - Official and press sources name these classes
    - Portfolio breadth reduces single-product dependency
    - Break out revenue by component class and customer program
