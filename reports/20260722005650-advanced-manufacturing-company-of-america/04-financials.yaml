- id: TI005
  title: Public Financial Gaps Table
  targetSlug: public-financial-gaps-table
  notes: Gap table converts public opacity into diligence requests; null means no reviewed public source disclosed the metric.
  columns:
  - Missing metric
  - Public evidence status
  - Impact
  - Exact diligence path
  rows:
  - - Current revenue / run-rate
    - Only 10X top-line growth disclosed; no absolute revenue
    - Blocks revenue scale, multiple analysis, and sales-efficiency testing
    - Obtain monthly revenue, billings, backlog, and revenue-recognition policy
  - - Revenue mix
    - Product categories and customers named; mix by component, OE, aftermarket, and sustainment absent
    - Blocks revenue quality assessment
    - Export revenue by acquired entity, program, component class, and channel
  - - Gross margin / COGS
    - No AMCA margin; TransDigm is only a mature benchmark
    - Blocks unit-economics and valuation confidence
    - Provide gross margin bridge by factory, SKU, and acquired company
  - - Factory economics
    - Facilities and square footage disclosed; utilization and yield absent
    - Blocks capex productivity assessment
    - Provide utilization, yield, scrap, rework, throughput, and capex per site
  - - Acquisition economics
    - Targets named; purchase prices and acquired revenue absent
    - Blocks roll-up ROI analysis
    - Provide purchase agreements, PPA, acquired EBITDA, synergy plan, and earnouts
  - - Customer concentration / NRR
    - Named primes visible; revenue concentration and retention metrics absent
    - Can hide dependency on Boeing, Lockheed, or DoD sustainment
    - Provide top-customer revenue, backlog, renewal, recompete, and concentration schedule
  - - Cash, burn, runway
    - Funding disclosed; cash and monthly net burn absent
    - Blocks capital adequacy
    - Provide bank statements, budget-vs-actuals, burn multiple, and runway plan
  - - Debt and obligations
    - No public debt, seller notes, leases, or equipment finance found
    - Could materially change financing dependency
    - Provide complete debt, lease, guarantees, and off-balance commitment schedule
  - - Audited financials
    - No audited statements found in reviewed public sources
    - Blocks strict underwriting of margins, cash flow, and balance sheet
    - Provide audited or QoE financials for AMCA and acquired subsidiaries
