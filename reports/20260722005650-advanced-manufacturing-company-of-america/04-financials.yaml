- id: unit-economics
  title: Unit economics and margin drivers
  body: 'The best public lens for AMCA unit economics is a comp benchmark, not AMCA actuals. TransDigm shows what a mature
    proprietary aerospace-component roll-up can look like at scale: very high proprietary/sole-source exposure, a large aftermarket
    mix, roughly 60% gross margin, and EBITDA As Defined margins above 50%. Those numbers are relevant because AMCA is explicitly
    pursuing certified, critical components with long qualification cycles and inherited customer relationships. They are
    also dangerous if copied directly into AMCA’s model. AMCA is much earlier, acquisition-heavy, and still building factories
    and RAPID deployment. Its actual margin will depend on acquired-company purchase prices, labor utilization, scrap and
    rework, qualification cost, inventory turns, customer concentration, and the share of revenue that becomes recurring aftermarket
    rather than one-time new-production content. The diligence ask is a product-level P&L and cohort bridge, not a TransDigm
    margin assumption.'
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
