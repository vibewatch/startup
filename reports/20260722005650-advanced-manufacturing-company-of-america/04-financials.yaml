  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue
    missingEvidence: Current revenue, revenue run-rate, backlog, bookings, and revenue-recognition policy by component line
      and acquired entity.
    whyItMatters: The 10X growth statement has no public revenue denominator, so valuation and sales efficiency cannot be
      underwritten.
    diligencePath: Request finance-system exports for monthly revenue, bookings, billings, backlog, and deferred revenue,
      tied to audited or board-approved statements.
    relatedQuestionRefs:
    - QI003
    - QI017
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin, COGS bridge, scrap, rework, labor utilization, warranty expense, and manufacturing overhead
      by factory and product line.
    whyItMatters: TransDigm margins are only benchmarks; AMCA could have startup-stage integration and utilization drag.
    diligencePath: Review SKU-level gross margin, factory P&Ls, quality data, and acquired-company cost ledgers for the last
      eight quarters.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI013
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, pipeline conversion, win rate, gross retention, NRR, realized pricing, and
      customer concentration.
    whyItMatters: Named prime customers prove access but not efficient sales conversion or durable account expansion.
    diligencePath: Obtain CRM exports, top-20 customer contracts, contract duration, renewal history, discounts, and revenue
      concentration by customer and program.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI009
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: Cash on hand, monthly net burn, budget-to-actuals, restricted cash, committed capex, acquisition pipeline,
      and runway months.
    whyItMatters: Gross equity raised does not reveal whether the acquisition/factory plan is adequately funded.
    diligencePath: Review bank statements, cash forecast, board budget, capex plan, acquisition LOIs, and operating plan through
      2028.
    relatedQuestionRefs:
    - QI019
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Debt schedule, seller notes, equipment loans, leases, guarantees, project-finance obligations, and off-balance
      commitments.
    whyItMatters: A roll-up can hide leverage outside equity headlines, and leverage changes runway and downside risk.
    diligencePath: Request all debt agreements, acquisition consideration schedules, lease abstracts, equipment-finance agreements,
      and guarantees.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: acquisition-economics
    missingEvidence: Purchase prices, acquired-company revenue, EBITDA, synergies, integration budget, and purchase-price
      allocation for each acquisition.
    whyItMatters: Roll-up returns depend on buying high-quality assets at prices that can compound after integration.
    diligencePath: Review purchase agreements, QoE reports, PPA schedules, integration plans, and post-close performance versus
      underwriting.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI022
    relatedTableRefs:
    - TI002
    - TI004
    - TI005
