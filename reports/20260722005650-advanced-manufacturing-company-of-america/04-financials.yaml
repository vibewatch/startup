slug: advanced-manufacturing-company-of-america
runDate: '2026-07-22'
company:
  name: Advanced Manufacturing Company of America
chapter:
  number: 4
  title: Financials
  summary: AMCA has a plausible aerospace-and-defense component revenue engine and more than $370 million of disclosed capital,
    but it remains private-undisclosed on absolute revenue, audited financials, gross margin, cash, burn, runway, and debt.
    TransDigm and A&D M&A data frame mature roll-up economics; they are benchmarks, not AMCA actuals.
sections:
- id: revenue-model
  title: Revenue model and pricing architecture
  body: 'AMCA’s public revenue model is not SaaS-like and has no visible list-price page. It is an aerospace-and-defense component
    platform: acquire legacy certified suppliers, preserve their qualified product lines and customer trust, add engineering
    and technical-data-package capacity, and build new factories when existing suppliers cannot meet readiness needs. Revenue
    should therefore come from certified precision components sold into prime, OEM, and U.S. military sustainment channels,
    with new-program content complemented by recurring aftermarket, spares, repair, and obsolescence-driven replacement demand.
    The public record supports the mechanism but not the scale. Malik disclosed that top line had “10X-ed” year over year,
    yet AMCA has not disclosed absolute revenue, booked backlog, ARR, gross margin, realized pricing, or mix by product line.
    Financials should therefore treat hydraulics, avionics, power electronics, magnetics, switches, and HMI products as revenue
    categories, while keeping every dollarized AMCA operating metric private-undisclosed until management provides a finance-system
    export.'
  claimRefs:
