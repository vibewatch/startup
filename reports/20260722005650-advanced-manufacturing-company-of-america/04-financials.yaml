- id: comps-and-market-context
  title: Comps, multiples, and roll-up market context
  body: 'The transaction market explains why AMCA could attract a large Series B before publishing revenue: buyers and investors
    are paying for mission-critical access, not just current EBITDA. PCE’s Q2 2026 update reported 143 LTM aerospace, defense,
    and government-contracting transactions at median 18.96x TEV/EBITDA and 4.09x TEV/revenue, with demand concentrated in
    defense electronics, mission-critical manufacturing, space systems, and sustainment assets. First Page Sage’s private-market
    table puts military-and-defense EBITDA multiples in a wide 7.7x to 14.7x band, while Capstone describes resilient A&D
    M&A activity and financial-buyer capital. These are underwriting context, not AMCA’s valuation math. Without AMCA revenue,
    EBITDA, backlog, purchase prices, and revenue mix, the public can only say the sector rewards scarce qualified capacity;
    it cannot determine whether AMCA’s $1.0–$1.1 billion post-money is cheap or expensive on actual operating metrics.'
  claimRefs:
  - CI023
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI040
  - CI046
  tableRefs: []
  figureRefs: []
- id: financial-gaps-verdict
  title: Public financial gaps and underwriting verdict
  body: 'The financial verdict is research-more. AMCA has a credible revenue mechanism, a strong capital base, named strategic
    customers, and a comp set showing that proprietary aerospace components can be unusually profitable at maturity. The blockers
    are the same facts that make the model attractive: qualification cycles, long-lived parts, and legacy supplier integration
    hide true economics from the public record. Adverse evidence matters. Oliver Wyman warns that the defense supply base
    is structurally constrained and that Tier 2+ suppliers have the least room to absorb a surge; TechCrunch’s Countdown Capital
    article is a reminder that industrial hard-tech funding can become efficiently priced and capital-intensive faster than
    small investors expect. Before underwriting, investors need audited or board-approved financials, current revenue and
    backlog, gross margin bridge, acquired-company P&Ls, purchase-price allocation, working-capital schedule, debt and seller-note
    schedule, customer concentration, and a 24-month cash plan tied to factory and acquisition milestones.'
