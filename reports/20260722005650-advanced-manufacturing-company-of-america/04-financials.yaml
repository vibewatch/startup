- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: 'Financials can refer to the funding chronology only through local claims, and the local evidence shows large gross
    capital rather than proven self-funding. AMCA launched with $76.5 million, then announced a $300 million Series B at a
    valuation over $1 billion, implying approximately $376.5 million of disclosed gross equity capital and TechCrunch-reported
    total funding above $370 million. The proceeds are earmarked for RAPID expansion, factory creation, acquisitions, and
    faster component delivery. Those uses are strategically aligned but cash-consuming: manufacturing roll-ups must fund acquisitions,
    integration teams, specialized tooling, quality systems, inventory, receivables, and qualification cycles before repeat
    gross profit becomes visible. No public source discloses cash on hand, burn, runway months, debt, seller notes, equipment
    finance, or project-finance obligations. The next-round trigger is therefore not a calendar date; it is when acquisition
    and factory cash needs outpace demonstrated gross-profit conversion.'
