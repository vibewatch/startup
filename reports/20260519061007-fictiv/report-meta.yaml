companyProfile:
  summary: "Fictiv is a digital manufacturing marketplace founded in 2013 by brothers Dave Evans and Nathan Evans to simplify the sourcing of custom mechanical parts. The company combines instant quoting, DFM feedback, supplier-network orchestration, quality management, and supply-chain services across CNC machining, injection molding, 3D printing, and adjacent processes. After scaling from roughly 19 million parts for 3,000 companies in 2022 disclosures to 35M+ parts for 5,000+ companies on current official pages, Fictiv was acquired by MISUMI in June 2025 for $350 million, becoming MISUMI's custom-manufacturing platform layer for configurable and custom mechanical parts."
  foundedDate: "2013-01-01"
  founders:
    - name: "Dave Evans"
      role: "Co-Founder, CEO, and President of MISUMI Americas"
      background: "Stanford mechanical engineering graduate; first hire for Ford's Silicon Valley innovation lab before co-founding Fictiv."
      claimRefs: [CO001, CO018, CO020]
    - name: "Nathan Evans"
      role: "Co-Founder & CXO"
      background: "Stanford-trained operator with finance, strategy, and cross-border experience; publicly positioned as Fictiv's Chief Experience Officer."
      claimRefs: [CO001, CO019, CO021]
  foundingLocation: "San Francisco, CA"
  headquarters: "San Francisco Bay Area, CA"
  productSummary: "Digital supply-chain platform for custom mechanical parts spanning CNC machining, sheet metal, injection molding, 3D printing, die casting, urethane casting, compression molding, assembly, quality inspections, and export-control-enabled aerospace sourcing."
  customerFocus: "Product-development and manufacturing teams at hardware, industrial, aerospace, medical, robotics, climate-tech, semiconductor, automotive, and eVTOL companies ranging from startups to large enterprises."
  businessModel: "Platform-enabled manufacturing marketplace with instant-quote workflows, program management, supplier-network orchestration, and value-added quality and logistics services across prototype-to-production programs."
  stage: "Acquired"
  fundingStatus: "Raised about $192.6M through Series E before MISUMI acquired the company for $350M in June 2025."
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO006, CO009, CV001, CV002]
