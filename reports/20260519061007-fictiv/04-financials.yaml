- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Exact diligence path
  rows:
  - - ARR / recurring share
    - Cannot test software-like revenue quality
    - Request cohort split between repeat production programs and one-off jobs
  - - Standalone revenue and gross margin
    - Cannot benchmark acquisition value or margin path
    - Request audited pre-close P&L or MISUMI carve-out reporting
  - - Cash, debt, and burn
    - Cannot assess standalone runway or balance-sheet stress
    - Request last independent balance sheet and debt schedule
  - - Working-capital cycle
    - Cannot evaluate cash conversion or supplier financing needs
    - Request DSO / DPO / inventory and refund data
  - - Take rate / markup by process
    - Cannot test pricing power versus peers
    - Request process-level gross-to-net revenue bridge
  - - Customer concentration and dispute / rework rates
    - Cannot evaluate durability of order flow or hidden cost leakage
    - Request top-customer share, defect rates, and warranty claims
  notes: These are the minimum diligence asks required to move from directional commentary to underwritable
    financial analysis.
