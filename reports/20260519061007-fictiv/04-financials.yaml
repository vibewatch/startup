    - IOR fee and import charges can be passed through
    - Customer ultimately bears many trade-cost changes
    - Net retention unknown
    - Terms
  - - Process-specific lead-time choices
    - Lead-time options publicly marketed by process
    - Actual realized price / speed mix unknown
    - Expedite premium undisclosed
    - Service pages
  notes: Official surfaces show pricing mechanics, not realized net pricing. Unknowns are commercial by
