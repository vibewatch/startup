- id: traction-benchmarks-and-gaps
  title: Public traction signals versus missing private metrics
  body: 'Fictiv is not a tiny asset. Official and partner-backed sources disclose more than 35 million
    parts produced, more than 5,000 companies served, approximately 250 manufacturing partners, and employee
    counts ranging from 101-250 to roughly 454 depending on source and date. Funding is also documented:
    US$92M by early 2021, about US$192M by the 2022 Series E announcement, and US$192.6M on the archived
    Crunchbase profile. Third-party funding coverage adds some operating color: PR Newswire and Metrology
    repeated management’s claims that the 2022 round brought total funding to about US$192M, that Fictiv
    had already delivered more than 19 million parts to more than 3,000 product companies, and that 2021
    core-business revenue grew 100% year over year while employee count grew 81%. Helpful as those figures
    are, they remain episodic management-selected milestones rather than audited statements. None of the
    reviewed public sources disclose Fictiv revenue, ARR, gross margin, take rate, burn, or debt. That
    is where public comps become useful. Xometry and Protolabs show what listed digital-manufacturing
    peers look like when revenue, gross profit, cash, leverage, and filings are all visible: they can
    reach roughly half-a-billion to three-quarters-of-a-billion dollars of revenue, yet still exhibit
    industrial economics rather than software-margin economics. The contrast makes Fictiv’s disclosure
    gap more, not less, important.'
