  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: arr disclosure
    missingEvidence: Any audited or management-certified disclosure of ARR or recurring programmatic revenue
      share.
    whyItMatters: ARR is the cleanest way to test whether any portion of Fictiv behaves like recurring
      software or contracted industrial revenue.
    diligencePath: Request customer-cohort revenue schedules and repeat-program revenue concentration
      from management or MISUMI finance.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: revenue and margin disclosure
    missingEvidence: Standalone revenue, gross margin, and take-rate disclosure for the last independent
      reporting period before close.
    whyItMatters: Without topline and margin data, the US$350M acquisition value cannot be translated
      into a defensible revenue or profitability multiple.
    diligencePath: Request audited pre-close P&L, process mix, and gross-to-net revenue bridge from MISUMI
      or legacy Fictiv finance.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash debt and working capital
    missingEvidence: Pre-close cash, debt, monthly burn, DSO, DPO, inventory, and refund / rework cash
      impacts.
    whyItMatters: These metrics determine whether the transaction solved a solvency problem or simply
      shifted ownership of a healthy but opaque asset.
    diligencePath: Request the last monthly finance pack, debt schedule, and working-capital waterfall
      before and after the MISUMI close.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
