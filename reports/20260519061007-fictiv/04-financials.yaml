    - Refunds only in limited Fictiv-cancel or defect cases
    - Commercial exception policies unknown
    - Terms
  - - Material-cost repricing
    - Allowed if input costs move 3%+
    - Negotiated after quote if costs move
    - Rebid frequency unknown
    - Terms
