- id: TU005
  title: Expansion and concentration risk table
  notes: Expansion drivers are public and concrete, but concentration risk remains mostly an absence-of-disclosure question rather than a documented failure today.
  columns:
  - Expansion driver
  - Concentration / execution risk
  - Impact
  - Diligence path
  rows:
  - - Prototype-to-production continuity
    - Public sources do not quantify how many prototype accounts mature into recurring production accounts
    - The land-and-expand story is plausible but not measured
    - Request funnel conversion from first quote to first production order and 12-month reorder rates
  - - MISUMI standard + custom BOM workflow
    - Customer experience will depend on integration quality across catalog and custom-part flows
    - Could expand wallet share if seamless, or stall if workflows remain fragmented
    - Request joint funnel metrics, cross-sell rates, and customer references using both systems
  - - EVCO / GlobalFlex tooling and molding scope
    - Cross-border tooling and secondary-process complexity may add hidden coordination risk
    - Could help larger OEMs but execution quality matters
    - Request examples of multi-site tooling programs and failure-mode / escalation histories
  - - MRO and engineer-to-order use cases
    - RBC Bearings shows value, but public evidence does not reveal whether this is a niche or a major revenue stream
    - Customer mix uncertainty affects durability and margin assumptions
    - Request customer and revenue split by NPI, production, and MRO
  - - Regulated aerospace opportunity
    - Fictiv’s public boundary excludes some export-restricted work, limiting part of the addressable market
    - Important for sizing enterprise upside in defense-adjacent segments
    - Request revenue split by regulated vertical and pipeline lost to export-control limits
  - - Top-customer concentration
    - No public disclosure of top accounts, vertical mix, or revenue concentration
    - A few large accounts could dominate economics despite a broad logo base
    - Request top-10 customer share, churn history, and concentration by vertical and geography
  - - Agritech / vertical-farming adjacency
    - MISUMI and Oishii messaging suggests a new logo vertical but does not prove recurring Fictiv revenue yet
    - Can widen the top-of-funnel beyond classic industrial hardware
    - Request concrete Oishii or similar agritech program details, order history, and whether Fictiv is inside the commercial workflow
  claimRefs:
