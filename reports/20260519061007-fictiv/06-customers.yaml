- id: TU001
  title: Customer segmentation table
  notes: Segments are grouped by the public buying workflow Fictiv highlights, not by disclosed revenue split. Strategic value and gaps reflect only what is visible in reviewed sources.
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof
  - Strategic value / gap
  rows:
  - - Regulated enterprise engineering
    - Manufacturing engineer / sourcing lead / enterprise procurement
    - Precision components for aerospace and other quality-critical programs
    - Honeywell RE100 APU case study plus aerospace positioning
    - High-value proof of production relevance, but contract terms and spend are undisclosed
  - - Clean-energy hardware OEMs
    - VP Operations / hardware engineering / supply chain
    - Tooling, enclosures, structural assemblies, and production ramp support
    - Lunar Energy case study and customer homepage
    - Strong time-to-production proof, but no disclosed repeat-order cadence
  - - Founder-led consumer hardware brands
    - Founder / product designer / operations
    - Prototype iteration, BOM coordination, finish iteration, and first production run
    - Nightside case study and ecommerce site
    - Good prototype-to-production proof at smaller scale, but revenue value is unknown
  - - Quality-critical hardware teams
    - Engineering managers / hardware leads / purchasing
    - Inspection-documented parts and fewer-vendor sourcing
    - Gecko Robotics, Animax Designs, and Nexkey quotes
    - Useful satisfaction signal, but no dates, volumes, or deployment detail
  - - MRO and engineer-to-order buyers
    - Plant or general manager / operations / procurement
    - Maintenance, repair, and operations ordering with fast quoting
    - RBC Bearings quote in PRNewswire coverage
    - Independent proof of process value, but only one customer is named
  - - BOM-consolidation and tariff-management buyers
    - Engineering and supply-chain organizations
    - Standard plus custom parts, regional sourcing, and supplier simplification
    - MISUMI, EVCO, and 2026 report buyer-pain evidence
    - Expansion path is credible, but public conversion data is absent
  - - Agritech / automation adjacency
    - Operations and automation teams via MISUMI-linked channel
    - Potential vertical-farming and food-tech automation sourcing
    - Fictiv newsroom + MISUMI/Oishii announcement + Oishii site
    - Shows adjacency beyond core industrial verticals, but not disclosed as active Fictiv revenue
