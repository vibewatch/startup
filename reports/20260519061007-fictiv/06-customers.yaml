  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: A fuller named-customer roster with deployment stage, spend significance, and last-order timing beyond the small set of public case studies and quote snippets.
    whyItMatters: The current public sample proves real usage but cannot show how representative the visible names are of the overall installed base or revenue mix.
    diligencePath: Request a customer reference list segmented by vertical, lifecycle stage, and account size, plus permission to speak with a balanced mix of enterprise and emerging-brand customers.
    relatedQuestionRefs:
    - QU005
    - QU010
    - QU022
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, reorder cadence, and cohort retention by enterprise versus smaller accounts.
    whyItMatters: Without retention data, investors can verify customer value but cannot properly underwrite durability, expansion efficiency, or revenue quality.
    diligencePath: Request customer cohort tables, reorder-rate dashboards, and renewal / churn history by segment for the last 24 months.
    relatedQuestionRefs:
    - QU014
  - type: private-evidence-only
    severity: material
    topic: contract-renewal-visibility
    missingEvidence: Average contract length, renewal terms, MSA structure, and examples of multi-year customer agreements.
    whyItMatters: Enterprise and regulated-customer logos are more valuable when they convert into durable contractual relationships rather than one-off engineering projects.
    diligencePath: Request sample commercial terms, renewal data, and account histories showing how pilot, validation, and production programs convert into ongoing business.
    relatedQuestionRefs:
    - QU015
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share of revenue, concentration by vertical and geography, and whether a small set of enterprise accounts dominates gross profit.
    whyItMatters: A broad logo count can still mask concentration risk if a limited number of large industrial accounts drive most of the economics.
    diligencePath: Request top-10 customer revenue share, gross-margin contribution, and churn or downsell history for the largest accounts.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: access-blocked
    severity: minor
    topic: independent-review-visibility
    missingEvidence: Accessible third-party review snapshots or exports from G2, Capterra, Trustpilot, or another neutral satisfaction venue.
    whyItMatters: Independent review channels could validate whether official quotes overstate satisfaction or hide delivery and support complaints.
    diligencePath: Re-run review diligence with accessible licensed exports or ask management to provide reference-program materials that include detractor as well as promoter accounts.
    relatedQuestionRefs:
    - QU016
    - QU017
