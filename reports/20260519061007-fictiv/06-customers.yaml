- id: TU007
  title: Buyer pain points and procurement-friction evidence table
  notes: Pain points combine customer stories, product features, and the 2026 survey. Survey percentages describe manufacturing leaders broadly, not just signed Fictiv customers.
  columns:
  - Buyer pain point
  - Public evidence
  - Customer or buyer proof
  - Implication
  - Gap
  rows:
  - - Quote and sourcing latency
    - Honeywell cited supply-chain waits from months up to years and quotes in minutes instead of days
    - Honeywell case study
    - Speed is a primary wedge for enterprise adoption
    - No distribution of actual quote-turnaround SLA by process
  - - Tooling iteration drag
    - Lunar compared six-to-eight-week tooling to a traditional four-to-six-month cycle
    - Lunar case study
    - Shorter tooling loops can unlock hardware schedule compression
    - No defect or rework rate for those rapid cycles
  - - Prototype-to-production supplier switching
    - Nightside highlighted not needing to source multiple partners across stages
    - Nightside case study
    - Continuity is part of the value proposition
    - No conversion data from prototype-only to production customers
  - - Engineering admin burden
    - 83% of surveyed leaders said engineers spend 4+ hours per week on procurement tasks; 93% expect productivity gains from managed services
    - 2026 State of Manufacturing report
    - The pain Fictiv sells into is real and widespread
    - Survey is buyer-attitudinal, not a direct customer-retention metric
  - - Shipping and procurement-policy friction
    - Customers can add their own UPS/FedEx account for reuse at checkout
    - Shipping-account feature article
    - Platform is building enterprise-friendly procurement plumbing
    - No data on how widely customers use the feature
  - - Quality documentation burden
    - Customers can add inspection reports and certifications during ordering
    - Quality-config feature article
    - Supports regulated and repeat-procurement workflows
    - No public take-rate for the add-on quality services
