chapter:
  number: 6
  title: Customers
  summary: Fictiv’s public customer evidence is strongest on real adoption and prototype-to-production execution, not on contractual durability. Honeywell, Lunar Energy, and Nightside provide concrete proof of production-oriented use with quantified time, cost, and engineering outcomes, while broader quote-based references and independent coverage suggest a wider roster across aerospace, clean energy, robotics, medical, and consumer hardware. The main underwriting gap is not whether customers exist; it is the absence of public NRR, renewal, and concentration data.
sections:
- id: customer-base-and-segment-mix
  title: Customer Base and Segment Mix
  body: |-
    Fictiv’s customer story is broad in public materials but not evenly evidenced across segments. The company’s own 2025/2026 surfaces say it has served more than 5,000 companies and produced more than 35 million parts, which makes the customer base clearly larger than a handful of venture-backed hardware startups. The most visible verticals are aerospace, medical, robotics, semiconductor, climate tech, eVTOL, consumer products, and automotive, and those sectors also reappear in case studies, quality quotes, and partner messaging. That breadth matters because the product is not sold as a single-process machine shop; it is sold as a managed sourcing layer for teams that need to move from prototype through production without rebuilding the supplier base each time.

    The strongest segment logic is therefore by workflow, not by SIC code. Honeywell represents regulated enterprise engineering. Lunar Energy represents clean-energy hardware scaling from tooling and prototyping into production. Nightside represents founder-led consumer hardware moving from iteration to its first run. MISUMI and EVCO extend the channel story toward BOM consolidation and larger OEM supply-chain programs, while the 2026 manufacturing survey and the shipping-account feature make clear that procurement friction is one of the buyer problems Fictiv is explicitly trying to solve.
