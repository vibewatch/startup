- id: TU006
  title: Independent and semi-independent corroboration table
  notes: This table separates outside corroboration from official case studies. Some sources repeat company-provided data, so they corroborate existence and framing more than they independently verify economics.
  columns:
  - Source
  - Customer / use-case signal
  - What it corroborates
  - Limitation
  rows:
  - - PRNewswire 2022
    - RBC Bearings MRO quote
    - Quote time from seven days to seconds or minutes and lead times from weeks to days
    - Company-distributed release rather than arm’s-length reporting
  - - Axios archived article
    - 3,000+ companies and 19M parts by 2022
    - Broad adoption and platform framing for supply-chain simplification
    - Mostly company-reported data behind a limited preview
  - - 3DPrint.com 2021
    - Honeywell aerospace division; 1,000-10,000 unit sweet spot
    - Enterprise-customer relevance and job-size positioning
    - Historical and partly based on company interviews
  - - 3D Printing Industry 2021
    - Robotics, aerospace, automotive, and medical customer mix
    - Early customer-sector breadth and partner-network scale
    - Historical and not customer-cohort specific
  - - Metrology.news 2022
    - 40% accelerated cycle times and 20% engineering-productivity gains for customers
    - Operational value proposition beyond a single case study
    - Again largely repeats company disclosures
  - - LinkedIn 2026 customer panel
    - Shaper, Zipline, Carbon, and EnergyX
    - A wider named roster than the three flagship studies
    - No deployment details, spend, or outcomes attached
