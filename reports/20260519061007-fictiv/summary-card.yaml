  topStrengths:
    - >-
      Strategic ownership by MISUMI adds catalog breadth, global logistics, and manufacturing infrastructure that
      materially strengthen Fictiv's platform value proposition.
    - >-
      Broad multi-process manufacturing coverage, instant quoting, DFM tooling, and quality-management workflows support
      a real prototype-to-production use case rather than a narrow brokerage layer.
    - >-
      Customer proof is credible across very different hardware contexts, including Honeywell, Lunar Energy, and
      Nightside, with concrete speed and launch outcomes.
    - >-
      Official surfaces show meaningful scale at 35M+ parts and 5,000+ companies served, indicating durable demand
      despite still-limited financial disclosure.
    - >-
      The observed acquisition multiple sits between Proto Labs and Xometry public-comp bands, which supports the view
      that the transaction price was strategically rational.
  topRisks:
    - >-
      Current revenue run-rate, gross margin, take rate, retention, and concentration are still not publicly disclosed
      with the precision needed for clean underwriting.
    - >-
      Post-acquisition governance, org design, and integration KPIs remain only partially visible, increasing execution
      and accountability risk.
    - >-
      Tariffs, export-control complexity, and cross-border supply-chain exposure can compress margins or slow
      fulfillment if regional resilience investments lag demand.
    - >-
      Public metrics conflict across sources on funding totals, headcount, and headquarters wording, which reduces
      confidence in precision even when directional signals are strong.
    - >-
      Independent review visibility is limited, so customer-satisfaction and partner-quality conclusions rely heavily on
      official case studies and curated public proof.
  unresolvedGaps:
    - Current 2025-2026 revenue run-rate, gross margin, and repeat-order metrics after the MISUMI close.
    - Customer concentration, process mix, and geography mix of gross profit or contribution margin.
    - Post-acquisition integration scorecard across cross-sell, logistics leverage, and partner-network utilization.
    - Board or governance structure, management incentives, and autonomy boundaries inside MISUMI.
    - Employee-retention and supplier-retention trends after the June 2025 close.
