- id: operating-architecture-and-differentiation
  title: Operating Architecture and Differentiation
  body: 'Architecturally, Fictiv’s offer is a layered system: customer intake and quoting, DFM and engineering review, partner selection, inspection and compliance, then logistics and post-shipment documentation. The public materials do not show a software stack diagram, but they do show repeated evidence that the company sits between customers and suppliers as the workflow owner. That owner role is the core differentiation. Customers do not just buy capacity; they buy a managed manufacturing process with pricing, review, and quality artifacts standardized across multiple processes and regions.


    The strongest proof is customer outcome data. Honeywell’s RE100 auxiliary power unit program used CNC plus DFM support to cut lead time from 22 weeks to 3 weeks. Lunar Energy used the same networked model to compress tooling lead time to as little as six weeks and speed time to production by 50 percent. Nightside shows the opposite end of the market: a small consumer-products brand using fast turnaround, strong China-team support, and guided production ramping to clear a first run of more than 1,000 units. Those references imply the architecture is flexible across both enterprise and emerging-company buyers.'
  claimRefs:
  - CE031
  - CE032
  - CE033
  - CE034
  - CE039
  - CE040
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: trust-quality-and-regulated-programs
  title: Trust, Quality, and Regulated Programs
  body: 'Trust and compliance are not side claims on Fictiv’s public surface; they are central selling points. The quality page discloses an ISO 9001 QMS, supplier-network coverage across AS9100, ISO 13485, and IATF 16949 manufacturing suppliers, and a menu of inspection or qualification services including first-article inspection, PPAP, APQP, CMM inspection, XRF verification, and uploaded quality documentation. The network page complements that with supplier onboarding stages, ongoing monitoring, and a stated 95.4 percent perfect-order success metric.


    The March 2026 export-control update is equally important for product maturity. Fictiv now explicitly distinguishes self-serve EAR99 and EAR 9E991 work from ECCN-classified programs that must be reviewed off-platform, while drawing a hard no-ITAR boundary. That is the right product posture for a marketplace-like manufacturing system: automate the low-friction compliant path, but push edge-case regulatory review into human sales and compliance workflows. The remaining risk is that public sources still do not expose depth metrics such as false-positive rates, incident logs, or program-level defect escapes.'
