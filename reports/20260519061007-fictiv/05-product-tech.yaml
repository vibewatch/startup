- id: TE002
  title: Workflow / use-case table
  notes: Workflow steps are synthesized from official quoting, DFM, and feature pages plus customer case studies. Lead-time impacts come from referenced case studies, not from a universal SLA.
  columns:
  - User job
  - Current workflow
  - Fictiv workflow
  - Measurable benefit
  - Limitation
  rows:
  - - Source a CNC prototype
    - Upload CAD, wait for quote, exchange emails on manufacturability
    - Upload to platform, review quote, use DFM support, receive inspection docs
    - Honeywell cites 22-week to 3-week lead-time reduction on a representative program
    - Outcome is case-study-specific rather than platform-wide SLA
  - - Quote a simple injection-molded part
    - Manual RFQ with multi-day vendor back-and-forth
    - Instant quote for qualifying geometry with price and lead time in seconds
    - Reduces sourcing-cycle delay from weeks to seconds for eligible parts
    - Eligibility is limited to simpler geometries and size constraints
  - - Resolve drawing ambiguity during review
    - Revise PDF offline and re-upload or email attachments
    - Mark dimensions directly, download annotated PDF, submit marked file for review in-platform
    - Clearer communication and fewer missed details per product page
    - No public change-log or enterprise document-governance detail
  - - Select materials across programs
    - Search spreadsheets, prior projects, and external references
    - Use Materials.AI as a materials-selection and sourcing assistant
    - Faster early-stage narrowing of material options
    - No public benchmarking against engineer-led material selection
  - - Run an EAR-regulated aerospace job
    - Manual compliance screening after RFQ
    - Self-serve only for EAR99 / 9E991; ECCN programs routed off-platform for compliance review
    - Clearer compliance path and reduced accidental upload risk
    - No public cycle-time metrics for ECCN review queue
  - - Scale from prototype to production
    - Switch vendors between development and production or manage handoff manually
    - Stay inside Fictiv’s network and quality workflows across stages
    - Lunar and Nightside both cite smoother prototype-to-production transition
    - Public sources do not disclose customer retention rate through stage transitions
