  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-api-integration
    missingEvidence: Public API, SDK, webhook, ERP, or PLM integration documentation describing machine-readable integration patterns.
    whyItMatters: Large enterprise buyers often require deeper systems integration than CAD upload and portal review; without it, deployment friction and switching costs are hard to underwrite.
    diligencePath: Request product architecture docs, API references, enterprise integration diagrams, and sample implementation timelines under NDA.
    relatedQuestionRefs:
    - QE021
  - type: private-evidence-only
    severity: material
    topic: reliability-telemetry
    missingEvidence: Public defect-rate, on-time-by-region, incident, rework, or platform-availability telemetry beyond the single perfect-order metric.
    whyItMatters: A single headline KPI does not reveal failure modes, variance by process, or whether quality and delivery performance hold across complex regulated programs.
    diligencePath: Request internal dashboards covering defect escapes, NCR rates, supplier scorecards, incident logs, and SLA history by process and region.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: minor
    topic: supplier-count-detail
    missingEvidence: Supplier counts by process, geography, certification tier, and spend concentration beyond the four-region and 4,100-plus combination headline metrics.
    whyItMatters: Network breadth matters less than depth in critical processes; investors need to understand concentration and substitution options inside the supplier base.
    diligencePath: Request a supplier heat map showing active manufacturing partners by process, certification, region, and top-10 supplier share of volume.
    relatedQuestionRefs:
    - QE023
  - type: stale
    severity: minor
    topic: roadmap-dates
    missingEvidence: A dated forward roadmap for post-March-2026 platform releases, quality features, or regional expansions.
    whyItMatters: Fictiv markets a rapidly evolving platform, but investors cannot separate already-shipping capabilities from narrative roadmap without dated release commitments.
    diligencePath: Request a 12- to 18-month product roadmap showing shipped, in-beta, and planned features with owners and milestone dates.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: minor
    topic: service-level-depth
    missingEvidence: Region- and process-level service metrics connecting quoting speed, DFM turnaround, inspection throughput, and logistics performance.
    whyItMatters: The public workflow story is credible, but diligence still lacks operating metrics to prove the end-to-end system scales consistently across each service line.
    diligencePath: Request dashboards for quote-turnaround SLA, DFM review cycle time, inspection queue time, and shipment performance by capability.
    relatedQuestionRefs:
    - QE022
    - QE023
    - QE024
