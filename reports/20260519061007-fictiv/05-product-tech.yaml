company:
  name: Fictiv
chapter:
  number: 5
  title: Product & Technology
  summary: 'Fictiv’s product is a software-mediated manufacturing control plane layered over a qualified global supplier network, not a single-process shop. The strongest 2026 product evidence is operational: instant injection-molding quotes launched in March 2026, export-control workflows were expanded for EAR-regulated aerospace and advanced-technology programs, and the platform’s quality/network pages disclose four supply regions, 4,100-plus material-process-finishing combinations, IP-protection workflows, and a 95.4 percent perfect-order metric. Public evidence supports workflow breadth and trust controls, but leaves deeper diligence gaps around API-level integration, detailed service-level telemetry, supplier concentration by process, and a dated forward roadmap.'
sections:
- id: platform-scope-and-module-map
  title: Platform Scope and Module Map
  body: 'Fictiv is best understood as a digital manufacturing control layer wrapped around a broad outsourced production network. The public surface consistently describes one platform spanning upload, quote, DFM review, order tracking, inspection documentation, and prototype-to-production handoff rather than a single manufacturing process. Capabilities cover CNC, sheet metal, injection molding, die casting, additive processes, urethane casting, compression molding, and assembly or welding, which means the product promise is breadth plus orchestration more than proprietary machine ownership.


    The module map is therefore a mix of customer-visible software, managed manufacturing services, and embedded quality or compliance workflows. MISUMI positioning extends the scope toward one-BOM sourcing by splitting standard and configurable parts to MISUMI while leaving custom mechanical work with Fictiv. Industry targeting is also explicit: aerospace, medical, robotics, semiconductor, climate tech, and eVTOL all appear on official surfaces, which matches a product architecture built for engineer-led, regulated, or multi-step hardware programs rather than consumer self-serve print-on-demand.'
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE029
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: digital-workflow-and-automation
  title: Digital Workflow and Automation
  body: 'Fictiv’s most concrete 2026 product change is instant injection molding quoting. The March 2026 launch pages describe a workflow in which qualifying straight-pull parts can return production-ready price and lead-time outputs immediately, while more complex parts fall back to engineer-reviewed quotes with DFM support. That matters because injection molding is usually a quote bottleneck rather than a design bottleneck; Fictiv’s automation attacks procurement latency first, then preserves human engineering review for edge cases.


    The same pattern appears elsewhere. A dedicated help workflow exists for reviewing and approving molding DFM reports, showing that manufacturability review is operationalized inside the platform. Materials.AI extends the front end of the workflow by helping teams navigate material choice and part sourcing, while the Drawing Annotation Tool reduces document-friction during quote review by letting teams mark drawings directly, keep annotations attached, and submit the annotated file without re-uploading. Together these features suggest Fictiv’s software moat is in compressing the mechanical-engineering handoff loop rather than exposing a developer-style API surface.'
  claimRefs:
