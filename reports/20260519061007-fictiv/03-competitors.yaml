  - type: missing-source
    severity: material
    topic: partner exclusivity
    missingEvidence: Current disclosure of what share of Fictiv manufacturing partners are exclusive or
      highly committed to the platform.
    whyItMatters: Exclusive or quasi-exclusive capacity would materially strengthen moat durability and
      reduce supplier-side multi-homing risk.
    diligencePath: Request partner-retention, exclusivity, and region-by-process density data from management
      or MISUMI integration materials.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: realized pricing
    missingEvidence: Realized per-process pricing, take rates, discounting, or gross-margin snapshots
      for Fictiv and peer comparisons.
    whyItMatters: Pricing power is central to whether Fictiv’s service-led moat survives against more
      self-serve peers.
    diligencePath: Ask for anonymized quote-to-order cohorts, process-level markup data, and competitive
      win/loss price sheets.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-loss retention
    missingEvidence: Current win-loss, retention, or share-of-wallet evidence showing whether Xometry,
      Protolabs, or direct suppliers are taking share.
    whyItMatters: Without recent competitive outcomes, the moat assessment is directional rather than
      fully underwritten.
    diligencePath: Request recent enterprise renewal data, top-loss reasons, and procurement benchmark
      studies from management.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
