chapter:
  number: 3
  title: Competitors
  summary: Fictiv competes most directly with public digital-manufacturing platforms Xometry and Protolabs,
    while adjacent specialists such as Protolabs Network, Shapeways, and SyBridge carve off narrower workflow
    or process pools. Fictiv’s best differentiation is managed supply-chain depth plus MISUMI distribution,
    but public peers still lead on self-serve transparency, disclosure discipline, and buyer-visible pricing
    signals. Competitive durability therefore rests less on unique process ownership than on bundled sourcing,
    quality management, and logistics execution.
sections:
- id: landscape
  title: Direct peers, adjacencies, and the post-MISUMI landscape
  body: 'Fictiv is no longer just a venture-backed marketplace competing for prototype jobs; after the
    MISUMI transaction it sits inside a larger mechanical-components ecosystem. The direct comparison
    set still starts with Xometry and Protolabs because both sell multi-process digital manufacturing
    through public web surfaces, publish current scale metrics, and compete for the same engineering and
    procurement workflows. Around that core sit narrower but still relevant specialists: Protolabs Network/Hubs
    for networked outsourced production, Shapeways for additive-heavy programs, and SyBridge for tooling-led
    injection-molding work. The status-quo substitute remains direct supplier management and in-house
    procurement, which is often cheaper on paper but much heavier operationally. MISUMI changes the map
    because it lets Fictiv bundle configurable and standard parts with custom work, which is a real channel
    advantage against pure-play marketplace peers. That matters because procurement teams increasingly
    want fewer vendors covering custom parts, catalog items, logistics, and compliance under one commercial
    umbrella. The weakness is that Fictiv still discloses much less about current economics and performance
    than public peers do, so enterprise buyers get a broader menu but not the same level of financial
    transparency. The strategic story is stronger than before, but proof of actual cross-sell, account
    overlap, and wallet-share lift is still mostly absent from public evidence.'
