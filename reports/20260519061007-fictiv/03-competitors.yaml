- id: moat-durability
  title: Switching costs, multi-homing, and moat durability
  body: 'Fictiv’s moat is real, but it is narrower than a software-style marketplace moat. Buyer switching
    costs exist around approved drawings, supplier history, QA routines, logistics coordination, and the
    convenience of one portal; however, none of those elements make the underlying part geometry proprietary.
    A determined buyer can still re-quote the same design through Xometry, Protolabs, Protolabs Network,
    or a direct manufacturer. That makes multi-homing normal rather than exceptional. Fictiv’s best defense
    is therefore service depth: managed network curation, quality handling, MISUMI-enabled bill-of-materials
    bundling, and customer-service capacity that pure process specialists do not match. Public peers create
    a different kind of pressure. Because Xometry and Protolabs publish current metrics and filing cadence,
    they can look lower-risk to procurement teams that want counterparties with visible balance-sheet
    and demand data. That weakens any claim that Fictiv owns a winner-take-most network; the customer
    relationship is still contestable at each major requote or supplier-review event. Unless MISUMI distribution
    and bundled procurement create measurable lock-in, the moat should be treated as executional rather
    than structural. The harsh but fair competitive verdict is that Fictiv is strongest where program-management
    complexity matters, weaker where pure self-serve transparency matters, and still exposed to unresolved
    questions around partner exclusivity, realized pricing, and current win-loss performance.'
