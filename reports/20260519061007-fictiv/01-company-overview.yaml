- id: section-traction-risks
  title: Customer proof, financial disclosure, and diligence flags
  body: 'Customer proof is the strongest public evidence that Fictiv’s platform works across hardware categories. Honeywell reported a 22-week cycle reduced to three weeks for a critical aerospace component. Lunar Energy said Fictiv cut tooling lead times to about six weeks while saving around $1M and about 700 engineering hours. Nightside described prototype cycles dropping from weeks to days and credited Fictiv with helping manage a multi-part bill of materials through production.


    The MISUMI sale process also created a rare public financial window into the business. MISUMI disclosed $72.452M of 2024 net sales and continuing operating losses, which is far more concrete than Fictiv’s usual marketing surfaces. That is helpful, but still not enough to infer current valuation, gross margin, or concentration.


    There are also real diligence limits. SEC search results do not show Fictiv as a public issuer, and independent review surfaces were effectively inaccessible during fetch. Combined with conflicting funding totals and partial governance disclosure, this means identity and milestones can be established confidently, but not a fully transparent late-stage private-company profile.'
