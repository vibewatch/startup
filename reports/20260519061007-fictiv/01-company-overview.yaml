  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: independent review visibility
    missingEvidence: Accessible review histories or complaint threads from third-party review platforms.
    whyItMatters: Without readable review surfaces it is harder to test whether quality or service complaints are isolated or recurring.
    diligencePath: Re-pull review venues with working access methods or request complaint-rate data in diligence.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: post-close governance and cap table
    missingEvidence: A post-close board list, voting/control rights, and any rollover or management equity terms.
    whyItMatters: Ownership and governance determine how much autonomy Fictiv retains inside MISUMI.
    diligencePath: Request the current board roster, cap table, and integration governance documents.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: current employee count and office of record
    missingEvidence: A single authoritative 2026 employee count and reconciled statement of legal vs operating headquarters.
    whyItMatters: Headcount and HQ location affect org maturity and integration planning, but public sources disagree or lag.
    diligencePath: Request current HR headcount and confirm legal principal place of business versus operating HQ.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: customer concentration and revenue mix
    missingEvidence: Top-customer exposure, industry mix by revenue, and the split between prototype, bridge, and production programs.
    whyItMatters: Commercial concentration is critical for judging durability and downside risk.
    diligencePath: Request concentration and revenue-mix schedules in formal diligence.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
