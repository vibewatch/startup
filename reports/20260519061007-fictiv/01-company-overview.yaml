- id: section-capital
  title: Funding history, transaction terms, and stakeholder map
  body: 'Public financing history is straightforward up to 2022 and murkier after that. Fictiv announced a $35M Series D in February 2021 and a $100M Series E in May 2022, with the Series E release stating total investment had reached $192M. Later archival data from Crunchbase showed $192.6M, while Fictiv’s current website now advertises $200M. The safest reading is source-date drift rather than a clean single figure.


    The bigger capital event is the MISUMI acquisition. MISUMI announced a $350M all-cash deal on 2025-04-17 and disclosed completion on 2025-06-18, effective 2025-06-17 U.S. local time. That changes the capital structure completely: Fictiv is now a wholly owned strategic asset rather than a standalone venture-backed company.


    Stakeholder importance now shifts toward MISUMI, the founders, the manufacturing partner network, and enterprise customers. MISUMI contributes global catalog breadth, logistics, and manufacturing infrastructure; founders supply continuity and product vision; partners remain the supply backbone; and customer proof shows demand across very different hardware contexts.'
