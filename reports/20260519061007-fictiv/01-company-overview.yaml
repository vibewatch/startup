company:
  name: Fictiv
chapter:
  number: 1
  title: Company Overview
  summary: Fictiv is a digital manufacturing marketplace founded in 2013 by brothers Dave Evans and Nathan Evans. Public materials show a company that has scaled from 2022-era disclosures of ~19M parts for 3,000 companies to current website claims of 35M+ parts for 5,000+ companies, while still carrying source-date conflicts around total capital and headquarters wording. MISUMI announced a $350M all-cash acquisition in April 2025 and completed it in June 2025, giving Fictiv a strategic parent with much larger manufacturing and logistics infrastructure. Public diligence is materially better because of the sale process, but governance, current valuation, concentration, and independent review visibility remain limited.
sections:
- id: section-identity
  title: Identity, model, and current footprint
  body: 'Fictiv is a digital manufacturing marketplace and supply-chain platform founded in 2013 by Dave and Nathan Evans. The company frames its core job as simplifying the sourcing of custom mechanical parts by turning CAD uploads into quoted, manufactured, inspected, and delivered parts across CNC machining, injection molding, 3D printing, and adjacent workflows. Since the MISUMI transaction, Fictiv increasingly presents itself as the custom-manufacturing layer within a broader standard-plus-configurable-plus-custom bill-of-materials stack.


    The operating footprint is global even if the exact headquarters wording varies by source. Current Fictiv pages center activity in Oakland and list Phoenix, Guangzhou, Bengaluru, Pune, and Nuevo León, while older third-party profiles still call the company San Francisco-based. MISUMI’s acquisition notice separately described about 400 employees and about 250 manufacturing partners.


    Scale claims have also moved up over time. The current about page says Fictiv has delivered 35M+ parts for 5,000+ companies with fastest delivery in 24 hours, while 2022 funding coverage cited about 19M parts and 3,000 companies. The directional signal is clear, but the exact cover metrics should be read with source-date awareness.'
