callouts:
- calloutType: insight
  title: The relevant TAM is narrow-first, broad-second
  body: For diligence and valuation, the narrow on-demand manufacturing service market is the safer anchor because it maps to Fictiv’s direct monetization surface. The much larger digital manufacturing market is useful as adjacency and strategic context, but not as a clean near-term revenue pool.
  claimRefs:
  - CM005
  - CM009
  - CM010
  - CM035
- calloutType: strength
  title: 2026 demand drivers line up unusually well with Fictiv’s pitch
  body: 'AI adoption, regional resilience, sourcing complexity, and quality documentation are all moving in the same direction: buyers increasingly want a digital platform with rapid quoting, audited supply networks, and cross-region execution support.'
  claimRefs:
  - CM012
  - CM013
  - CM015
  - CM016
  - CM017
  - CM019
- calloutType: risk
  title: Adoption is not frictionless for smaller or highly regulated buyers
  body: SME integration issues, buyer price pressure, and unsupported export-control classes create real ceilings on conversion. The addressable market is large, but not every buyer can or will route complex regulated programs through the same digital workflow.
