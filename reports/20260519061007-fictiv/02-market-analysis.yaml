- id: section-drivers
  title: Growth drivers and adoption constraints
  body: 'The 2026 demand environment is unusually aligned with Fictiv’s story. Fictiv’s own survey data says AI is embedded in core workflows, digital manufacturing platforms are effectively non-negotiable, sourcing complexity is rising, and North American regional resilience is a priority. Xometry’s outlook points in the same direction, and Deloitte adds the macro frame of trade-policy uncertainty and rising digital-investment needs.


    Those drivers are balanced by real adoption frictions. Export-control requirements make some aerospace and advanced-technology programs more complex, and Fictiv openly says certain regulated classes remain off-platform. Business Research Insights also points to integration difficulty and skills shortages among smaller firms, suggesting adoption is easier for larger, more sophisticated buyers than for every SMB.


    Quality is the other major gate. In a market where buyers increasingly want instant quotes and faster launches, platforms still win or lose on inspection rigor, documented certifications, on-time delivery, and the ability to maintain execution under volatility.'
