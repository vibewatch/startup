  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exact SAM by region and sector
    missingEvidence: A management-quality split of revenue opportunity by geography, industry, and program type.
    whyItMatters: The narrow market exists, but investable sizing depends on what portion Fictiv can actually serve well.
    diligencePath: Request internal TAM/SAM/SOM planning and order mix by region / vertical.
    relatedQuestionRefs:
    - QM021
  - type: private-evidence-only
    severity: material
    topic: current customer-segment mix
    missingEvidence: Actual customer counts or revenue contribution by aerospace, medical, automotive, climate tech, robotics, and other segments.
    whyItMatters: Public case studies and industry pages show breadth, but not concentration or repeatability by segment.
    diligencePath: Request cohort and segment mix data from sales / finance systems.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: buyer willingness-to-pay and unit economics
    missingEvidence: Gross-margin, take-rate, and pricing-power data versus direct sourcing alternatives.
    whyItMatters: Valuation depends on margin structure, not only TAM size.
    diligencePath: Request gross-margin bridge, pricing studies, and churn / NPS by customer type.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: minor
    topic: unsupported regulated demand
    missingEvidence: A quantified estimate of ITAR or non-supported EAR opportunity currently forced off-platform.
    whyItMatters: Some of the highest-value aerospace and advanced-tech programs may sit just outside current support.
    diligencePath: Ask compliance and sales teams for off-platform referral volume and lost-deal reasons.
    relatedQuestionRefs:
    - QM024
