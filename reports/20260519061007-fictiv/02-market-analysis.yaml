- id: section-buyers
  title: Buyer, user, and payer segmentation
  body: 'The practical buyer set is cross-functional. Engineers often start the workflow because they need a fast quote, DFM feedback, or a prototype part. But as programs move toward repeat orders and production, the economic buyer shifts toward supply-chain, procurement, quality, and manufacturing-operations leaders who care about cost, documentation, region selection, and delivery performance.


    Sector fit is strongest where parts are custom, iteration speed matters, and documentation or compliance is non-trivial. Aerospace and MedTech bring high process expectations; automotive and EV combine tooling pressure with tariff and regional-resilience concerns; climate tech, robotics, semiconductor, and other emerging hardware segments need rapid iteration and mixed-volume sourcing. These are exactly the categories Fictiv emphasizes in current materials.


    The adoption path tends to follow a common pattern: first quote, first prototype, repeat sourcing, pilot or bridge production, then broader BOM consolidation. This pattern appears not just in Fictiv’s positioning but across Xometry, Protolabs, and Protolabs Network.'
  claimRefs:
  - CM008
  - CM014
  - CM018
  - CM021
  - CM022
  - CM028
