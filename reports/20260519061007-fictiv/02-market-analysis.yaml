company:
  name: Fictiv
chapter:
  number: 2
  title: Market Analysis
  summary: 'Fictiv’s directly relevant market is best understood as digital procurement for custom mechanical components rather than the entirety of manufacturing. Third-party estimates vary dramatically: a narrow on-demand manufacturing service lens points to roughly $6.9-$7.9B in 2026 demand, while a broad digital-manufacturing lens exceeds $699B because it includes much wider Industry 4.0 software and workflow categories. In 2026, the market backdrop is favorable for Fictiv’s pitch—AI adoption is near universal, digital manufacturing platforms are viewed as essential, tariffs are driving regional resilience, and quality/compliance expectations are rising. But the company’s SAM is still constrained by export-control support boundaries, buyer integration friction, and the fact that broad TAM statistics overstate Fictiv’s directly monetizable scope.'
sections:
- id: section-boundary
  title: 'Market boundary: custom-part procurement, not all manufacturing'
  body: 'The relevant market boundary for Fictiv is narrower than the phrase “digital manufacturing” suggests. The company sits in the layer where engineering, sourcing, and operations teams procure custom mechanical parts through a digital workflow that combines quoting, DFM feedback, supplier routing, inspection, and delivery visibility. That is a real market, but it is not the same thing as all factory automation, all contract manufacturing, or all industrial software.


    The MISUMI combination actually makes the boundary easier to describe. MISUMI handles standard and configurable parts; Fictiv handles custom parts. Together they can cover more of a bill of materials, but Fictiv’s core monetization surface is still the custom-procurement workflow. Included spend therefore centers on CNC, molding, additive, and related quality / program-management services for custom parts. Excluded spend should include pure catalog commerce, unrelated logistics, and broad industrial software categories that matter strategically but are not Fictiv’s direct revenue pool.


    This distinction matters because large headline TAMs can overstate what the company can actually capture.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM035
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: section-sizing
  title: 'Sizing lenses: narrow on-demand services versus broad digital manufacturing'
  body: 'Published market estimates differ by two orders of magnitude because they describe different things. Statifacts sizes the global on-demand manufacturing service market at roughly $6.88B in 2026, with one headline on the same page citing $7.94B. Either way, the narrow service market is meaningful and still forecast to grow at roughly 15% CAGR into the mid-2030s. That narrow dataset also shows CNC services dominating today’s mix.


    By contrast, Business Research Insights places digital manufacturing at about $699.2B in 2026. That broader figure includes much wider digitization themes, so it captures strategic tailwinds relevant to Fictiv without mapping directly to Fictiv revenue.


    A practical bridge is to compare Fictiv’s disclosed 2024 net sales from MISUMI’s filing against the narrow on-demand market, producing only about 0.9%-1.1% directional share. That calculation is imperfect, but it is still more decision-useful than pretending Fictiv can capture share of the entire broad TAM.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM035
  tableRefs:
  - TM002
  figureRefs:
