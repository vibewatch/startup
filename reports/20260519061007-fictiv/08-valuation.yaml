- id: recommendation-thesis-breaks-and-final-diligence
  title: Recommendation, thesis-breaks, and final diligence
  body: 'The practical investment call should be framed around the observable price, not a hypothetical upside number.
    At or modestly around the US$350 million takeout, the valuation stance is likely fair with medium confidence.
    At a materially higher price, the correct recommendation is not “buy the quality story anyway”; it is “do not
    chase without fresh operating proof.” The diligence agenda that would move the call is specific: 2025 and 2026
    revenue run-rate, gross margin or take rate, customer concentration, repeat-order quality, and a credible MISUMI
    integration KPI set. If those data show continued >30% growth, further loss improvement, and healthy concentration,
    the bull case becomes more credible. If they instead show slower growth, weak margins, or concentrated revenue,
    the downside case opens quickly because the current comp bridge is already directional rather than precise.
    That is why the final judgment is medium-confidence and why the best anchor remains the signed transaction price
    itself.'
