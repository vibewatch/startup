- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current run-rate revenue
    - Meaningfully below the implied growth path needed to clear 2024-plus expectations
    - Undercuts the strategic premium and bull case
    - Move toward bear case
  - - Gross margin / take rate
    - Weak enough that the 4.8x sales multiple no longer looks defensible
    - Removes the rationale for paying above Proto Labs-like levels
    - Demand a lower entry price
  - - Customer concentration
    - Single customer or top-10 share is much higher than expected
    - Converts adoption optics into concentration risk
    - Treat the current price as too high
  - - MISUMI integration KPIs
    - Cross-sell and service-expansion milestones stall
    - Breaks the strategic-premium rationale
    - Revert to lower multiple framing
  - - Transaction economics
    - Material undisclosed rollover, earnout, or retention economics sit outside headline price
    - Makes the public anchor less clean
    - Rebuild the valuation from revised economics
  notes: Triggers are chosen to map directly to the assumptions that make US$350M look fair today.
  claimRefs:
  - CV027
  - CV033
  - CV034
  - CV039
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - 2025-2026 revenue run-rate
    - Current revenue bridge under MISUMI ownership
    - Most important variable for moving off the observed price anchor
    - Management or MISUMI post-close reporting
  - - Gross margin / take rate
    - Current gross margin, take rate, and order-quality data
    - Determines whether 4.8x sales is conservative or aggressive
    - Finance diligence
  - - Customer concentration / retention
    - Top-10 share, largest customer share, repeat-order metrics
    - Determines durability and downside skew
    - Commercial diligence
  - - Integration KPIs
    - Cross-sell, shared-capability, and operating-efficiency milestones
    - Core proof for strategic premium
    - MISUMI integration office
  - - Headline vs total economics
    - Any earnout, rollover, or retention economics beyond the headline price
    - Could change the fairness assessment materially
    - Legal / merger-agreement review
  notes: The diligence list is intentionally short and prioritized around valuation-moving unknowns.
  claimRefs:
