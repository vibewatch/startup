- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Fictiv / MISUMI deal
    - Price / 2024 sales
    - US$350M / US$72.452M ≈ 4.8x
    - Best observable anchor for the company itself
    - Single strategic transaction, not a liquid market quote
  - - Xometry
    - Market-cap / sales proxy
    - ≈5.2x-8.5x using Yahoo and MacroTrends snapshots
    - Closest public digital-manufacturing marketplace analogue
    - Proxy uses market cap, not enterprise value; richer scale and disclosure
  - - Proto Labs
    - Market-cap / sales proxy
    - ≈2.5x-3.4x using Yahoo and MacroTrends snapshots
    - Digital manufacturing benchmark with more tangible production model
    - More mature and profitable; not a perfect marketplace analogue
  - - Category growth backdrop
    - Market size / CAGR
    - On-demand manufacturing ~US$7.94B in 2026 / 14.98% CAGR; US$16.68B by 2031
    - Supports paying above stagnant industrial multiples
    - Category growth does not guarantee company-level economics
  - - Broader digital manufacturing
    - Market size / CAGR
    - US$699.2B in 2026 / 21.39% CAGR to 2035
    - Shows large long-term digital-manufacturing tailwind
    - Much broader than Fictiv’s exact business mix
  enumerationScope:
    coverage: partial
    basis: Uses the observable Fictiv transaction plus the two most relevant public digital-manufacturing comps
      and two market-growth references; the set is directional rather than exhaustive.
  notes: Comparable rows combine transaction, public-comp, and market-context lenses because no single perfect listed
    peer exists.
