- id: public-comps-and-market-frame
  title: Public comps and market frame
  body: 'Directional public comps help triangulate whether the US$350 million takeout looks stretched or conservative.
    Xometry is the closest public analogue in terms of digital-manufacturing marketplace ambition, while Proto Labs
    is the more mature and more operationally tangible digital-manufacturing benchmark. Current public snapshots
    put Xometry at roughly 5.2x to 8.5x market-cap-to-sales depending on which market-cap source is used, while
    Proto Labs sits closer to roughly 2.5x to 3.4x. Fictiv’s implied 4.8x multiple therefore lands cleanly between
    them: above Proto Labs, consistent with a strategic platform premium, but below Xometry, consistent with Fictiv’s
    much smaller disclosed revenue base and much lower public transparency. Market-growth sources also point in
    the same direction. On-demand manufacturing is still a growing category and broader digital manufacturing is
    larger still, which supports paying above low-end industrial multiples. But the growth narrative has to be tempered
    by macro caution: Deloitte’s 2026 outlook and older TechCrunch reporting both underscore tariffs, labor pressure,
    supply uncertainty, and operational complexity. Those factors argue against giving Fictiv a top-of-range Xometry-style
    multiple without more current evidence.'
