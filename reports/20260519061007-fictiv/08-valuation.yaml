company:
  name: Fictiv
chapter:
  number: 8
  title: Valuation
  summary: The US$350 million all-cash MISUMI acquisition is the best observable valuation anchor for Fictiv. MISUMI’s
    filing gives a 2024 revenue base of US$72.452 million and implies an approximately 4.8x sales multiple—above
    Proto Labs’ current market-cap-to-sales proxy band and below Xometry’s. That pattern, combined with strategic-fit
    rationale and still-opaque forward KPIs, supports a medium-confidence stance that the takeout price was likely
    fair rather than obviously cheap or rich.
sections:
- id: observable-price-anchor-and-capital-context
  title: Observable price anchor and capital context
  body: 'Fictiv’s valuation discussion should start with the only hard price in public view: MISUMI’s US$350 million
    all-cash acquisition, announced in April 2025 and closed in June 2025. Unlike a rumor-based private mark, the
    MISUMI completion filing also gives a concrete 2024 operating snapshot: US$72.452 million of net sales, narrowing
    but still meaningful losses, and only US$12.206 million of net assets. That allows a direct revenue-multiple
    anchor of roughly 4.8x sales, which is far more defensible than trying to backsolve from stale venture headlines
    alone. The funding history still matters as context: public sources show at least a US$35 million Series D,
    a US$100 million Series E, and total capital invested in roughly the US$192.6 million to US$200 million range
    depending on whether one uses archived Crunchbase or Fictiv’s own company-profile language. That means the exit
    was strategically positive but not a blowout venture outcome. The right mental model is therefore a strategic
    acquisition with evidence-backed economics, not a speculative growth mark.'
  contentRequirementRefs:
