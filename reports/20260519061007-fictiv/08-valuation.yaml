  evidenceGaps:
  - type: missing-source
    severity: critical
    topic: Current run-rate revenue and gross margin (TV006)
    missingEvidence: 2025 and 2026 revenue run-rate, gross margin, or take-rate data under MISUMI ownership.
    whyItMatters: Without a current operating run-rate, it is impossible to justify paying materially above the
      observed deal price with confidence.
    diligencePath: Request post-close monthly or quarterly revenue, gross margin, and order-volume bridge from MISUMI
      or management.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: critical
    topic: Customer concentration and retention (TV006)
    missingEvidence: Top-customer share, top-10 concentration, repeat-order rates, and cohort retention by sector.
    whyItMatters: Category growth and parts-served metrics do not prove durable revenue quality or justify a premium
      multiple.
    diligencePath: Collect customer concentration schedules and repeat-order data directly from management.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: high
    topic: Headcount and org stability after close (TV006)
    missingEvidence: A reconciled post-close employee count and leadership-retention history.
    whyItMatters: Conflicting public snapshots prevent investors from cleanly assessing integration stability and
      cost base.
    diligencePath: Request current org chart, headcount by function, and post-close attrition by team.
    relatedQuestionRefs:
    - QV011
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: high
    topic: Acquisition economics beyond headline price (TV005)
    missingEvidence: Earnouts, rollover equity, retention packages, and explicit synergy milestones, if any exist
      beyond the public headline disclosure.
    whyItMatters: The fairness call could move if a material portion of value sits outside the headline US$350 million
      cash price.
    diligencePath: Review merger agreement economics or management side letters if available.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV005
  - type: missing-source
    severity: high
    topic: Comparable-set precision for TV004
    missingEvidence: Enterprise-value based comp math, current forward revenue, and a cleaner same-model peer set than the public market-cap proxies used here.
    whyItMatters: TV004 is intentionally partial because the public comp bridge is directional; cleaner comp inputs could move the fairness call modestly.
    diligencePath: Rebuild the comp set with EV, cash, debt, and current forward revenue once auditable figures are available.
    relatedQuestionRefs:
    - QV019
    - QV025
    relatedTableRefs:
    - TV004
