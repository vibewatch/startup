            body: >-
              Durability is where the public record gets materially thinner. The available sources show real
              repeat-usage signals — Honeywell uses Fictiv Enterprise for aerospace components, Lunar moved from
              prototyping into production ramp, Nightside is planning subsequent runs, and quality-page testimonials
              imply many orders over time — but none of the reviewed materials disclose NRR, GRR, logo churn, contract
              duration, renewal rates, or cohort behavior. That means the public evidence supports customer value and
              operational usefulness, not contract durability in the SaaS-investor sense.


              Independent satisfaction data is also weaker than ideal in this run. The direct G2 page was JS-blocked and
              the archived Capterra URL was unavailable because access was forbidden, so public review diligence could
