              Fictiv’s near-term roadmap is legible in shipped 2026 features but less legible beyond them. Instant
              molding quotes and expanded export-control workflows are now live. Materials.AI and the Drawing Annotation
              Tool show continuing investment in front-end engineering productivity. Public calculators for supply-chain
              risk and resilience plus digital-manufacturing value also show an attempt to productize buyer-side
              decision support rather than only transactional execution. The EVCO partnership adds a tariff-management
              angle to the injection-molding roadmap, while MISUMI integration broadens procurement coverage. A dated
              earlier precedent exists too: in October 2023 Fictiv announced a USA 3D-printing service expansion with 14
              new materials, which shows the company has historically shipped concrete capability expansions rather than
              only positioning statements. What remains harder to underwrite is timing: there is no dated public roadmap
              explaining which additional quoting, quality, or regional-capacity features land next.

              Ecosystem signal is therefore stronger in practitioner and employer proxies than in open-source software
