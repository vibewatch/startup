  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Observable price anchor and capital context
        blocks:
          - type: paragraph
            body: >-
              Fictiv’s valuation discussion should start with the only hard price in public view: MISUMI’s US$350
              million all-cash acquisition, announced in April 2025 and closed in June 2025. Unlike a rumor-based
              private mark, the MISUMI completion filing also gives a concrete 2024 operating snapshot: US$72.452
              million of net sales, narrowing but still meaningful losses, and only US$12.206 million of net assets.
              That allows a direct revenue-multiple anchor of roughly 4.8x sales, which is far more defensible than
              trying to backsolve from stale venture headlines alone. The funding history still matters as context:
              public sources show at least a US$35 million Series D, a US$100 million Series E, and total capital
              invested in roughly the US$192.6 million to US$200 million range depending on whether one uses archived
              Crunchbase or Fictiv’s own company-profile language. That means the exit was strategically positive but
              not a blowout venture outcome. The right mental model is therefore a strategic acquisition with
              evidence-backed economics, not a speculative growth mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
