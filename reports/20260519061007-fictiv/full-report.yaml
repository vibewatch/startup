      - number: '8.3'
        title: Scenarios and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The scenario analysis should therefore be intentionally simple and price-sensitive. The base case is not a
              fresh venture round fantasy; it is the observed acquisition itself, bracketed modestly around US$325
              million to US$375 million. A bull case above that range would need evidence that the 2024 growth rate
              remained healthy into 2025 and 2026, that losses continued to narrow, and that MISUMI integration actually
              accelerated conversion, cross-sell, or take-rate economics. None of that is clearly visible in the public
              record today. The bear case is easier to imagine because the downside drivers are explicit: tariff
              pass-through failure, softer demand, margin pressure, or a slower-than-expected integration could all
              compress the implied sales multiple toward the low-3x range. On balance, the observed US$350 million price
              looks likely fair. It captures enough premium to stand above Proto Labs’ lower public band and enough
              caution to remain below Xometry’s richer one. That is exactly the pattern one would expect for a strategic
              buyer paying for platform fit and network value without public proof of breakout-scale economics.
            claimRefs:
              - CV021
