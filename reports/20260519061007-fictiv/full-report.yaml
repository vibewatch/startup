      - number: '2.2'
        title: 'Sizing lenses: narrow on-demand services versus broad digital manufacturing'
        blocks:
          - type: paragraph
            body: >-
              Published market estimates differ by two orders of magnitude because they describe different things.
              Statifacts sizes the global on-demand manufacturing service market at roughly $6.88B in 2026, with one
              headline on the same page citing $7.94B. Either way, the narrow service market is meaningful and still
              forecast to grow at roughly 15% CAGR into the mid-2030s. That narrow dataset also shows CNC services
              dominating today’s mix.


              By contrast, Business Research Insights places digital manufacturing at about $699.2B in 2026. That
              broader figure includes much wider digitization themes, so it captures strategic tailwinds relevant to
              Fictiv without mapping directly to Fictiv revenue.


              A practical bridge is to compare Fictiv’s disclosed 2024 net sales from MISUMI’s filing against the narrow
              on-demand market, producing only about 0.9%-1.1% directional share. That calculation is imperfect, but it
              is still more decision-useful than pretending Fictiv can capture share of the entire broad TAM.
            claimRefs:
              - CM005
