      - number: '5.3'
        title: Operating Architecture and Differentiation
        blocks:
          - type: paragraph
            body: >-
              Architecturally, Fictiv’s offer is a layered system: customer intake and quoting, DFM and engineering
              review, partner selection, inspection and compliance, then logistics and post-shipment documentation. The
              public materials do not show a software stack diagram, but they do show repeated evidence that the company
              sits between customers and suppliers as the workflow owner. That owner role is the core differentiation.
              Customers do not just buy capacity; they buy a managed manufacturing process with pricing, review, and
              quality artifacts standardized across multiple processes and regions.


              The strongest proof is customer outcome data. Honeywell’s RE100 auxiliary power unit program used CNC plus
              DFM support to cut lead time from 22 weeks to 3 weeks. Lunar Energy used the same networked model to
              compress tooling lead time to as little as six weeks and speed time to production by 50 percent. Nightside
              shows the opposite end of the market: a small consumer-products brand using fast turnaround, strong
              China-team support, and guided production ramping to clear a first run of more than 1,000 units. Those
              references imply the architecture is flexible across both enterprise and emerging-company buyers.
