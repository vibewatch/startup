  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Scope and Module Map
        blocks:
          - type: paragraph
            body: >-
              Fictiv is best understood as a digital manufacturing control layer wrapped around a broad outsourced
              production network. The public surface consistently describes one platform spanning upload, quote, DFM
              review, order tracking, inspection documentation, and prototype-to-production handoff rather than a single
              manufacturing process. Capabilities cover CNC, sheet metal, injection molding, die casting, additive
              processes, urethane casting, compression molding, and assembly or welding, which means the product promise
              is breadth plus orchestration more than proprietary machine ownership.


              The module map is therefore a mix of customer-visible software, managed manufacturing services, and
              embedded quality or compliance workflows. MISUMI positioning extends the scope toward one-BOM sourcing by
              splitting standard and configurable parts to MISUMI while leaving custom mechanical work with Fictiv.
              Industry targeting is also explicit: aerospace, medical, robotics, semiconductor, climate tech, and eVTOL
              all appear on official surfaces, which matches a product architecture built for engineer-led, regulated,
              or multi-step hardware programs rather than consumer self-serve print-on-demand.
