companyProfile:
  summary: >-
    Fictiv is a digital manufacturing marketplace founded in 2013 by brothers Dave Evans and Nathan Evans to simplify
    the sourcing of custom mechanical parts. The company combines instant quoting, DFM feedback, supplier-network
    orchestration, quality management, and supply-chain services across CNC machining, injection molding, 3D printing,
    and adjacent processes. After scaling from roughly 19 million parts for 3,000 companies in 2022 disclosures to 35M+
    parts for 5,000+ companies on current official pages, Fictiv was acquired by MISUMI in June 2025 for $350 million,
    becoming MISUMI's custom-manufacturing platform layer for configurable and custom mechanical parts.
