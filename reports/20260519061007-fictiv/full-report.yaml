      - number: '4.3'
        title: Capital adequacy, ownership shift, and the financial verdict
        blocks:
          - type: paragraph
            body: >-
              Before the acquisition, capital adequacy would have been a classic venture-runway question. After the
              acquisition, it is better understood as a parent-support question. MISUMI signed the US$350M all-cash
              purchase in April 2025 and closed it in June 2025, which means Fictiv is no longer visibly dependent on a
              next outside round. That sharply reduces immediate financing risk relative to the pre-close venture
              period, but it also reduces transparency because the reviewed public sources do not provide separate
              post-close Fictiv financials. Macro conditions make the terms economics matter: Deloitte’s 2026
              manufacturing outlook still points to tariff and input-cost pressure, while Xometry’s 2026 outlook release
              points to higher quality demands and broad expectations of price increases. Those signals line up with
              Fictiv’s explicit pass-through and late-payment protections. Archived WSJ market-data pages are another
              reminder of what public-comp visibility looks like: even dated snapshots expose EPS, market cap, share
              count, and short-interest context for Xometry and Protolabs outside full filings. Fictiv offers nothing
              comparable now that it is private. The resulting verdict is practical rather than elegant: operating scale
              and parent backing are both real, but revenue quality, margin path, and standalone value cannot be
              underwritten to investment-grade confidence without internal financial disclosure.
