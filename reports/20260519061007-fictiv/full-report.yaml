      - number: '3.2'
        title: Capability breadth, pricing visibility, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is not where Fictiv looks weak. The company publicly claims broad custom-mechanical
              coverage, and the MISUMI bundle extends that story from purely custom work toward one-stop sourcing.
              Xometry and Protolabs still set the benchmark for buyer-visible self-serve behavior: Xometry openly
              markets instant quotes, certifications, and supplier-network scale, while Protolabs emphasizes quote
              speed, fast lead times, and public investor reporting. Fictiv’s pricing surface is more managed and less
              explicit. Buyers can clearly request instant quotes, but there is less public evidence of persistent list
              pricing, promo frameworks, or standardized public economics by process. That is acceptable for
              high-variation custom work, but it means price discovery still depends more on sales-assisted workflow
              than on pure software self-service. On trust posture, all three major vendors market quality systems;
              Xometry and Protolabs simply expose more public proof points. Fictiv’s counter is managed quality, local
              teams, and supply-chain execution depth. Public peers also benefit from repeated filing and
              investor-update cycles that train buyers to expect fresh revenue, balance-sheet, and operating disclosures
              alongside capability claims. For regulated buyers or CFO-led procurement motions, that disclosure
              asymmetry can matter even when the operational product is competitive. In practice, the market is split
              between customers who value disclosed, self-serve metrics and customers who value hands-on managed
              sourcing.
