  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: custom-part procurement, not all manufacturing'
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary for Fictiv is narrower than the phrase “digital manufacturing” suggests. The
              company sits in the layer where engineering, sourcing, and operations teams procure custom mechanical
              parts through a digital workflow that combines quoting, DFM feedback, supplier routing, inspection, and
              delivery visibility. That is a real market, but it is not the same thing as all factory automation, all
              contract manufacturing, or all industrial software.


              The MISUMI combination actually makes the boundary easier to describe. MISUMI handles standard and
              configurable parts; Fictiv handles custom parts. Together they can cover more of a bill of materials, but
              Fictiv’s core monetization surface is still the custom-procurement workflow. Included spend therefore
              centers on CNC, molding, additive, and related quality / program-management services for custom parts.
              Excluded spend should include pure catalog commerce, unrelated logistics, and broad industrial software
              categories that matter strategically but are not Fictiv’s direct revenue pool.


              This distinction matters because large headline TAMs can overstate what the company can actually capture.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM035
