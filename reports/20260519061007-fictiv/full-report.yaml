  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and compliance surface
        blocks:
          - type: paragraph
            body: >-
              Fictiv’s regulatory risk is shaped less by one existential license and more by a layered compliance stack
              that touches export controls, customs, supplier conduct, and regulated-industry quality standards. The
              clearest 2026 change is the company’s explicit push into EAR-regulated work: Fictiv now markets
              classification confirmation and automated safeguards for controlled programs, but the same public
              documents still say only EAR99 and 9E991 can run self-serve and that ITAR-controlled files cannot be
              handled on-platform. That means regulatory expansion also creates screening friction, false-positive
              deletion risk, and sales-cycle complexity for aerospace and defense-adjacent demand. Contract terms
              further show that tariffs, duties, and importer-of-record mechanics are heavily allocated by shipping
              choice, while supplier-code requirements confirm Fictiv’s dependence on partner labor, sanctions, and
              anti-bribery compliance. Public regulator and patent search surfaces do not show a clean legal bill of
              health; they simply leave legal and IP diligence unresolved.
