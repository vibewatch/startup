      - number: '5.4'
        title: Trust, Quality, and Regulated Programs
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance are not side claims on Fictiv’s public surface; they are central selling points. The
              quality page discloses an ISO 9001 QMS, supplier-network coverage across AS9100, ISO 13485, and IATF 16949
              manufacturing suppliers, and a menu of inspection or qualification services including first-article
              inspection, PPAP, APQP, CMM inspection, XRF verification, and uploaded quality documentation. The network
              page complements that with supplier onboarding stages, ongoing monitoring, and a stated 95.4 percent
              perfect-order success metric.


              The March 2026 export-control update is equally important for product maturity. Fictiv now explicitly
              distinguishes self-serve EAR99 and EAR 9E991 work from ECCN-classified programs that must be reviewed
              off-platform, while drawing a hard no-ITAR boundary. That is the right product posture for a
              marketplace-like manufacturing system: automate the low-friction compliant path, but push edge-case
              regulatory review into human sales and compliance workflows. The remaining risk is that public sources
              still do not expose depth metrics such as false-positive rates, incident logs, or program-level defect
              escapes.
