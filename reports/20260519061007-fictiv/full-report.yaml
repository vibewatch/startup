              operating change: Fictiv plus CNC and DFM support replaced a recast path and reduced lead time from 22
              weeks to 3 weeks. Lunar Energy is even richer on economics, with disclosed tooling lead times down to as
              little as six weeks, 50% faster time to production, approximately $1 million in tooling savings, and 700
              engineering hours saved. Nightside offers a different but useful lens: a smaller consumer-products brand
              that used Fictiv to bridge from repeated prototyping into a first run of more than 1,000 units while
              leaning on the China team for tooling, samples, and troubleshooting.


              Outside those flagship studies, the evidence becomes shallower but still directionally helpful. The
              quality page provides named quotes from Gecko Robotics, Animax Designs, and Nexkey about inspection
              quality and vendor consolidation. The injection-molding page adds a quip quote on mold timing. LinkedIn
              adds a 2026 customer-panel mention naming Shaper, Zipline, Carbon, and EnergyX. Together this is enough to
              conclude that customer usage is real and varied, but not enough to fully underwrite production durability
