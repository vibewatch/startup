          - type: paragraph
            body: >-
              Fictiv’s public surfaces describe a business built around custom manufacturing orders, not recurring
              software revenue. The product pages emphasize instant quotes, process-specific lead times, and production
              support across CNC machining, injection molding, and 3D printing. The legal terms make the economic
              structure clearer: customers pay before production starts, a quote becomes the order once accepted, custom
              orders cannot be cancelled, and Fictiv can reprice or exit if material costs move materially after
              quoting. Tariffs, duties, and importer-of-record fees can also be passed through. That combination tells
              us more about revenue quality than any topline number does. It suggests a transaction-led model that
              protects working capital and gross margin through contract design rather than through publicly posted list
              pricing or recurring ARR. The model also appears intentionally asset-light from the outside: Fictiv
              intermediates demand, routes work across a managed supplier network, and uses commercial terms to reduce
              cancellation and collection risk. That can support cash conversion even without visible inventory
              disclosures, but it also means outside analysts cannot separate service margin from pass-through
              manufacturing spend. The downside is that revenue predictability, take rate, and realized margin remain
              hidden; the public evidence mostly shows how Fictiv manages order economics, not what those economics add
              up to.
