            body: >-
              The upside case on customer expansion is credible. Public sources show Fictiv trying to own more of the
              lifecycle: early prototype acquisition through instant quotes and 3D printing, validation and tooling
              through injection molding and DFM, repeat enterprise procurement through shipping-account and
              quality-document features, BOM consolidation through MISUMI, and broader OEM program scope through EVCO.
              The 2026 manufacturing survey sharpens the “why now” by showing engineers still lose substantial time to
              sourcing and that buyers see managed digital-manufacturing services as a productivity lever rather than a
              nice-to-have.


              The main customer risk is not lack of logos; it is missing economic concentration and renewal detail.
              Public sources do not reveal whether growth is spread across thousands of small accounts or concentrated
              in a smaller enterprise core, nor do they show how sticky accounts become after the initial program.
