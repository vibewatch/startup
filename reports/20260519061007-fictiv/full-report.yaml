        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership remains founder-led. Dave Evans is still CEO and, as of January 2026, also became President of
              MISUMI Americas, making him the most important integration sponsor in the public record. Nathan Evans
              remains Chief Experience Officer. Their published backgrounds fit the original company thesis: Dave
              brought engineering and product-development acceleration, while Nathan brought finance, strategy, and
              cross-border fluency.


              Beyond the founders, the public bench is operationally oriented. Fictiv names regional general managers
              for the U.S., Mexico, China, and India, along with commercial and finance executives including Joanne
              Moretti and Eddie Chen. This shows the company is not only a founder story; there is a disclosed operating
              layer across supply regions.


              Governance transparency is still limited. Public sources identify post-close ownership through MISUMI, but
              do not provide a current board roster, a detailed management equity picture, or a clear split between
              legacy Fictiv governance and MISUMI oversight.
