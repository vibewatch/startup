      - number: '7.3'
        title: Commercial opacity and competitive pressure
        blocks:
          - type: paragraph
            body: >-
              The most underwriting-relevant commercial risk is that public disclosures still do not show how durable
              Fictiv’s customers are. Investors can see broad adoption signals such as funding history, parts served,
              partner count, and a large employee base, but they cannot see top-customer concentration, repeat-order
              rates, retention by cohort, or gross-profit exposure by sector. That matters because the category itself
              still looks healthy: third-party market sources continue to describe on-demand and contract manufacturing
              as growing markets. If the category is growing, then underperformance is more likely to come from
              competition, service quality, or concentration than from macro demand collapse alone. Public review
              surfaces also did not resolve the question cleanly because accessible buyer reputation evidence was thin
              in this packet. At the same time, market sources place Fictiv in a crowded field of digital-manufacturing
              alternatives, so any slippage in quote speed, DFM responsiveness, or partner performance would hit a core
              competitive promise rather than a peripheral feature.
            claimRefs:
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
