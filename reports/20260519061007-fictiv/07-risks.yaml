  evidenceGaps:
  - type: missing-source
    severity: critical
    topic: Customer concentration and retention visibility (TR003)
    missingEvidence: Named top-customer share, top-10 concentration, retention or repeat-order metrics, and post-close
      revenue mix by region/industry.
    whyItMatters: Commercial opacity prevents investors from sizing whether network breadth actually converts into
      durable gross profit and diversified demand.
    diligencePath: Request 2025-2026 cohort retention, top-10 customer concentration, and gross-profit concentration
      directly from management or MISUMI integration materials.
    relatedQuestionRefs:
    - QR017
    - QR027
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: high
    topic: Public customer and partner reputation evidence (TR002)
    missingEvidence: Accessible buyer reviews, NPS-style evidence, supplier scorecards, and partner defect-rate
      history.
    whyItMatters: Thin review surfaces make it hard to distinguish a genuinely strong operating reputation from
      a simply under-documented one.
    diligencePath: Collect customer references, supplier OTIF and NCR metrics, and direct screenshots or exports
      from live review surfaces.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: high
    topic: Litigation, enforcement, and patent diligence (TR001)
    missingEvidence: Court dockets, threatened claims, material settlement history, and an authoritative patent
      / freedom-to-operate review.
    whyItMatters: The current packet does not prove the absence of legal or IP issues; it only shows that none were
      surfaced by these public search surfaces.
    diligencePath: Run direct docket searches, outside-counsel IP review, and management legal-representation letters.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: high
    topic: People and integration metrics post-close (TR004)
    missingEvidence: Voluntary attrition, key-leader retention, integration milestones, and org design for the MISUMI/meviy
      combination.
    whyItMatters: Headcount snapshots conflict and do not reveal whether the right technical and commercial leaders
      stayed through integration.
    diligencePath: Request post-close org charts, attrition history, and MISUMI integration KPI dashboards.
    relatedQuestionRefs:
