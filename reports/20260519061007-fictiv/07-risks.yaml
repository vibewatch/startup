- id: network-supply-chain-and-operational-risk
  title: Network, supply-chain, and operational risk
  body: 'Operationally, Fictiv is a digitally coordinated but physically externalized network business. MISUMI’s
    own disclosure says Fictiv depended on roughly 250 manufacturing partners as of late 2024, and the terms of
    service make clear that customer specifications may be routed to subcontracted partners and that orders can
    fail if capacity or manufacturability breaks. The public quality page helps on the margin: Fictiv cites ISO
    9001, AS9100, ISO 13485, IATF-qualified suppliers, and dedicated quality engineers. But the DFM workflow also
    shows why execution still matters: customers must clear warning and approval-required items before tooling proceeds,
    and Fictiv may decline opportunities that are not sufficiently optimized. The EVCO partnership and the company’s
    own 2026 state-of-manufacturing framing reinforce that tariffs, regional resilience, supplier quality, and capacity
    constraints remain first-order operating realities. In short, the network can scale quickly, but it also imports
    partner-quality risk, logistics risk, and throughput volatility directly into customer experience.'
  contentRequirementRefs:
  - 0
  - 2
  - 3
