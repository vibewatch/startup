evidenceGaps:
  - type: access-blocked
    severity: material
    topic: independent review visibility
    missingEvidence: Accessible review histories or complaint threads from third-party review platforms.
    whyItMatters: >-
      Without readable review surfaces it is harder to test whether quality or service complaints are isolated or
      recurring.
    diligencePath: Re-pull review venues with working access methods or request complaint-rate data in diligence.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: post-close governance and cap table
    missingEvidence: A post-close board list, voting/control rights, and any rollover or management equity terms.
    whyItMatters: Ownership and governance determine how much autonomy Fictiv retains inside MISUMI.
    diligencePath: Request the current board roster, cap table, and integration governance documents.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: current employee count and office of record
    missingEvidence: A single authoritative 2026 employee count and reconciled statement of legal vs operating headquarters.
    whyItMatters: Headcount and HQ location affect org maturity and integration planning, but public sources disagree or lag.
    diligencePath: Request current HR headcount and confirm legal principal place of business versus operating HQ.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: customer concentration and revenue mix
    missingEvidence: Top-customer exposure, industry mix by revenue, and the split between prototype, bridge, and production programs.
    whyItMatters: Commercial concentration is critical for judging durability and downside risk.
    diligencePath: Request concentration and revenue-mix schedules in formal diligence.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: exact SAM by region and sector
    missingEvidence: A management-quality split of revenue opportunity by geography, industry, and program type.
    whyItMatters: The narrow market exists, but investable sizing depends on what portion Fictiv can actually serve well.
    diligencePath: Request internal TAM/SAM/SOM planning and order mix by region / vertical.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: current customer-segment mix
    missingEvidence: >-
      Actual customer counts or revenue contribution by aerospace, medical, automotive, climate tech, robotics, and
      other segments.
    whyItMatters: Public case studies and industry pages show breadth, but not concentration or repeatability by segment.
    diligencePath: Request cohort and segment mix data from sales / finance systems.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: buyer willingness-to-pay and unit economics
    missingEvidence: Gross-margin, take-rate, and pricing-power data versus direct sourcing alternatives.
    whyItMatters: Valuation depends on margin structure, not only TAM size.
    diligencePath: Request gross-margin bridge, pricing studies, and churn / NPS by customer type.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: minor
    topic: unsupported regulated demand
    missingEvidence: A quantified estimate of ITAR or non-supported EAR opportunity currently forced off-platform.
    whyItMatters: Some of the highest-value aerospace and advanced-tech programs may sit just outside current support.
    diligencePath: Ask compliance and sales teams for off-platform referral volume and lost-deal reasons.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: partner exclusivity
    missingEvidence: >-
      Current disclosure of what share of Fictiv manufacturing partners are exclusive or highly committed to the
      platform.
    whyItMatters: >-
      Exclusive or quasi-exclusive capacity would materially strengthen moat durability and reduce supplier-side
      multi-homing risk.
    diligencePath: >-
      Request partner-retention, exclusivity, and region-by-process density data from management or MISUMI integration
      materials.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: realized pricing
    missingEvidence: Realized per-process pricing, take rates, discounting, or gross-margin snapshots for Fictiv and peer comparisons.
    whyItMatters: Pricing power is central to whether Fictiv’s service-led moat survives against more self-serve peers.
    diligencePath: Ask for anonymized quote-to-order cohorts, process-level markup data, and competitive win/loss price sheets.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss retention
    missingEvidence: >-
      Current win-loss, retention, or share-of-wallet evidence showing whether Xometry, Protolabs, or direct suppliers
      are taking share.
    whyItMatters: Without recent competitive outcomes, the moat assessment is directional rather than fully underwritten.
    diligencePath: Request recent enterprise renewal data, top-loss reasons, and procurement benchmark studies from management.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: arr disclosure
    missingEvidence: Any audited or management-certified disclosure of ARR or recurring programmatic revenue share.
    whyItMatters: >-
      ARR is the cleanest way to test whether any portion of Fictiv behaves like recurring software or contracted
      industrial revenue.
    diligencePath: >-
      Request customer-cohort revenue schedules and repeat-program revenue concentration from management or MISUMI
      finance.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: revenue and margin disclosure
    missingEvidence: Standalone revenue, gross margin, and take-rate disclosure for the last independent reporting period before close.
    whyItMatters: >-
      Without topline and margin data, the US$350M acquisition value cannot be translated into a defensible revenue or
      profitability multiple.
    diligencePath: Request audited pre-close P&L, process mix, and gross-to-net revenue bridge from MISUMI or legacy Fictiv finance.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash debt and working capital
    missingEvidence: Pre-close cash, debt, monthly burn, DSO, DPO, inventory, and refund / rework cash impacts.
    whyItMatters: >-
      These metrics determine whether the transaction solved a solvency problem or simply shifted ownership of a healthy
      but opaque asset.
    diligencePath: >-
      Request the last monthly finance pack, debt schedule, and working-capital waterfall before and after the MISUMI
      close.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
