      - number: '8.3'
        title: 情景与估值立场
        blocks:
          - type: paragraph
            body: >-
              情景分析应刻意保持简单，并对价格敏感。基准情景不是新一轮风险融资的想象空间，而是已经发生的收购本身，在 US$325 million 到 US$375 million
              之间小幅框定。若要支撑高于该区间的乐观情景，需要证据显示 2024 年增速延续到 2025 和 2026 年，亏损继续收窄，MISUMI
              整合确实提升了转化、交叉销售或抽佣率经济性。今天的公开记录并没有清楚展示这些。悲观情景更容易想象，因为下行驱动因素已经写明：关税无法转嫁、需求转弱、利润率承压，或整合慢于预期，都可能把隐含销售倍数压向低 3x
              区间。总体看，已观察到的 US$350 million 价格可能是合理的。它给了足够溢价，高于 Proto Labs 较低的公开区间；也保留了足够谨慎，低于 Xometry
              更高的区间。这正是战略买方会呈现的模式：为平台契合和网络价值付费，但在没有公开证据证明经济性已经突破规模前，不把价格打满。
