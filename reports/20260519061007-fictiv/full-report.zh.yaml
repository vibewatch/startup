  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可观察价格锚与资本背景
        blocks:
          - type: paragraph
            body: >-
              讨论 Fictiv 估值，应从公开视野中唯一硬价格开始：MISUMI 的 US$350 million 全现金收购，2025 年 4 月宣布、2025 年 6 月交割。 这不同于基于传闻的私营标记；MISUMI
              的交割文件还给出具体的 2024 年运营快照：US$72.452 million 净销售额、亏损收窄但仍有意义， 以及仅 US$12.206 million 净资产。这允许直接给出约 4.8x
              销售额的收入倍数锚点，比单靠过时风投标题反推防守性强得多。 融资历史仍有背景意义：公开来源显示至少有 US$35 million Series D、US$100 million Series
              E，累计投入资本大约在 US$192.6 million 到 US$200 million 区间，取决于使用归档 Crunchbase 还是 Fictiv 自己的公司资料措辞。也就是说，
              这次退出在战略上是正面的，但不是风投意义上的爆炸性结果。正确心智模型应是有证据支撑经济性的战略收购，而不是投机性增长标记。
