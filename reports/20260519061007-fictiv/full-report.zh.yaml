        title: 客户证据、财务披露与尽调标记
        blocks:
          - type: paragraph
            body: >-
              客户证据是最强的公开证据，说明 Fictiv 平台能跨硬件品类运转。Honeywell 称，一个关键航空航天部件的周期从 22 周缩短到 3 周。 Lunar Energy 称，Fictiv 把工装交期压到约 6
              周，同时节省约 $1M 和约 700 个工程小时。Nightside 描述原型周期从数周降到数天， 并称 Fictiv 帮助其管理多零件 BOM，一路推进到生产。


              MISUMI 出售流程也给这家公司打开了少见的公开财务窗口。MISUMI 披露 Fictiv 2024 年净销售额为 $72.452M，且仍有经营亏损； 这比 Fictiv
              通常的营销页面具体得多。这个信息有帮助，但仍不足以推断当前估值、毛利率或客户集中度。


              尽调边界也是真实存在的。SEC 搜索结果没有显示 Fictiv 是公开发行人；抓取期间，独立评论页面基本无法访问。再叠加融资总额冲突和治理披露不完整，
              也就是说，身份与里程碑可以较有把握地建立，但无法拼出一个完全透明的后期私营公司画像。
