      - number: '5.4'
        title: 信任、质量与受监管项目
        blocks:
          - type: paragraph
            body: >-
              信任和合规不是 Fictiv 公开材料里的附带主张，而是核心卖点。质量页面披露 ISO 9001 QMS，供应商网络覆盖 AS9100、ISO 13485 和 IATF 16949
              制造供应商，并提供首件检验、PPAP、APQP、CMM 检验、XRF 验证和上传质量文档等检验或资质服务。网络页面还补充了供应商准入阶段、 持续监控，以及 95.4% 完美订单成功率指标。


              2026 年 3 月的出口管制更新，对产品成熟度同样重要。Fictiv 现在明确区分可自助处理的 EAR99 和 EAR 9E991 工作，与必须离线审查的 ECCN 分类项目，同时划出明确的“不接
              ITAR”边界。类似市场平台的制造系统需要这种产品姿态：把低摩擦合规路径自动化， 但把边缘监管审查推给人工销售和合规工作流。剩余风险是，公开来源仍没有披露误报率、事件日志或项目级缺陷外逃等深层指标。
