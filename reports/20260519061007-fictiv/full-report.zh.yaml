      - number: '4.2'
        title: 公开牵引信号与缺失的私营指标
        blocks:
          - type: paragraph
            body: >-
              Fictiv 不是一个小资产。官方和伙伴背书来源披露，公司已生产超过 35 million 个零件、服务超过 5,000 家公司、拥有约 250 家制造伙伴； 员工数则因来源和日期不同，在 101-250 到约
              454 之间。融资也有记录：2021 年初为 US$92M，2022 年 Series E 公告时约为 US$192M，归档 Crunchbase 资料为
              US$192.6M。第三方融资报道补充了一些运营信息：PR Newswire 和 Metrology 复述了管理层说法， 即 2022 年那轮融资后累计融资约 US$192M，Fictiv 已向 3,000+
              家产品公司交付 19 million+ 个零件，且 2021 年核心业务收入同比增长 100%、员工数增长 81%。这些数字有帮助，但仍是零散的管理层精选里程碑，不是经审计报表。已审阅的公开来源都没有披露
              Fictiv 收入、ARR、毛利率、抽成率、烧钱速度或债务。这也是公开可比公司有用的地方。Xometry 和 Protolabs 展示了上市数字制造同业在收入、
              毛利、现金、杠杆和监管文件全部可见时是什么样子：它们可以做到约 $0.5 billion 到 $0.75 billion 收入，但经济性仍更像工业公司， 而不是软件毛利公司。这个对比让 Fictiv
