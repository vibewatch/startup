chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、模式与当前版图
        blocks:
          - type: paragraph
            body: >-
              Fictiv 是一个数字制造市场和供应链平台，由 Dave 和 Nathan Evans 于 2013 年创立。公司把自己的核心任务定义为简化定制机械零件采购： 客户上传 CAD 后，Fictiv
              把报价、制造、检验和交付串起来，覆盖 CNC 加工、注塑成型、3D 打印及相邻流程。MISUMI 交易之后， Fictiv 越来越多地把自己定位为更大一套标准件 + 可配置件 + 定制件 BOM
              堆栈里的定制制造层。


              运营足迹已经是全球化，尽管不同来源对总部的表述并不完全一致。Fictiv 当前页面把活动重心放在 Oakland，并列出 Phoenix、Guangzhou、 Bengaluru、Pune 和 Nuevo
              León；较早的第三方资料仍称公司总部在 San Francisco。MISUMI 的收购公告另称，Fictiv 约有 400 名员工、 约 250 家制造伙伴。


              规模口径也在上移。当前关于页面称，Fictiv 已为 5,000+ 家公司交付 35M+ 个零件，最快 24 小时交付；2022 年融资报道则引用约 19M 个零件和 3,000
              家公司的说法。方向信号清楚，但封面指标需要结合来源日期来读。
