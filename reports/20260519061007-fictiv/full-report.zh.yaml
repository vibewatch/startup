companyProfile:
  summary: >-
    Fictiv 是一个数字制造市场和供应链平台，由 Dave Evans 和 Nathan Evans 兄弟于 2013 年创立，目标是简化定制机械零件的采购。 公司把即时报价、DFM
    反馈、供应商网络编排、质量管理和供应链服务串起来，覆盖 CNC 加工、注塑成型、3D 打印及相邻工艺。 Fictiv 在 2022 年披露为 3,000 家公司制造约 19 million 个零件，如今官方页面显示已为 5,000+
    家公司交付 35M+ 个零件。2025 年 6 月，MISUMI 以 $350 million 收购 Fictiv，使其成为 MISUMI 面向可配置和定制机械零件的定制制造平台层。
