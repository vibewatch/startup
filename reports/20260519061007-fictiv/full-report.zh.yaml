      - number: '8.2'
        title: 公开可比公司和市场框架
        blocks:
          - type: paragraph
            body: >-
              公开可比公司只能为 US$350 million 收购价是偏高还是保守提供方向性校准。按数字化制造市场平台的野心看，Xometry 最接近；Proto Labs
              则是更成熟、运营抓手更清楚的数字化制造基准。当前公开数据中，Xometry 的市值 / 销售额约 5.2x 到 8.5x，取决于采用哪一个市值来源；Proto Labs 更接近约 2.5x 到
              3.4x。Fictiv 隐含的 4.8x 倍数因此正好落在两者之间：高于 Proto Labs，说明战略平台溢价成立；低于 Xometry，也符合 Fictiv
              已披露收入规模小得多、公开透明度低得多的现实。市场增长数据也指向同一结论。按需制造仍在增长，更宽口径的数字化制造市场更大，因此买方支付高于低端工业倍数的价格有支撑。但增长叙事必须被宏观谨慎拉回：Deloitte
              2026 展望和较早的 TechCrunch 报道都强调关税、用工压力、供应不确定性和运营复杂度。没有更多当前证据前，不应给 Fictiv 最高区间的 Xometry 式倍数。
