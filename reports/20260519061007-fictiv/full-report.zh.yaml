      - number: '3.3'
        title: 切换成本、多平台使用与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Fictiv 的护城河是真实的，但比软件式市场平台护城河更窄。买方切换成本来自已批准图纸、供应商历史、QA 例程、物流协调和单一门户便利性；
              但这些元素都没有让底层零件几何变成专有资产。下定决心的买方仍能把同一设计拿到 Xometry、Protolabs、Protolabs Network
              或直接制造商那里重新报价。因此，多平台使用是常态，而不是例外。Fictiv 最好的防线是服务深度：托管网络筛选、质量处理、MISUMI 支持的 BOM
              打包，以及纯工艺专家难以匹配的客服能力。公开同业制造的是另一类压力。Xometry 和 Protolabs 发布当前指标并保持文件披露节奏，
              因此在想要可见资产负债表和需求数据的采购团队眼里，它们可能显得风险更低。这会削弱 Fictiv 拥有赢者通吃式网络的任何说法； 每一次大额重新报价或供应商复审时，客户关系仍可被争夺。除非 MISUMI
              分销和打包采购创造出可衡量的锁定效应，否则应把护城河视为执行型， 而非结构型。严厉但公允的竞争结论是：项目管理复杂度重要时，Fictiv
              最强；纯自助透明度重要时，它较弱；伙伴排他性、实际定价和当前赢输表现的问题仍未解决。
