      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              客户扩张的上行情景可信。公开来源显示，Fictiv 试图吃下生命周期中更多部分：用即时报价和 3D 打印获取早期原型需求；用注塑和 DFM 承接验证与工装；用运输账号和质量文档功能支撑重复企业采购；借
              MISUMI 做 BOM 整合；借 EVCO 拓宽 OEM 项目范围。 2026 年制造业调查把“为什么是现在”说得更尖锐：工程师仍在采购上损失大量时间，买方也把托管数字制造服务视为生产力杠杆，而不只是锦上添花。


              主要客户风险不是缺少 logo，而是缺少经济集中度和续约细节。公开来源没有说明增长是分散在数千个小账户中，还是集中在较小的企业核心里；
              也没有说明账户在初始项目后会变得多黏。受监管航空航天信息还凸显出一个边界：Fictiv 服务非出口受限航空航天工作，但不覆盖完整的国防 / 出口管制光谱。 实际读法是，Fictiv
              很可能有真实的先落地、再扩张潜力，但投资者仍需要私有队列、头部客户和续约数据，才能激进承销客户耐久性。
