  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与细分组合
        blocks:
          - type: paragraph
            body: >-
              Fictiv 的客户故事在公开材料中很宽，但各细分的证据并不均匀。公司自己的 2025/2026 公开材料称，已服务超过 5,000 家公司、生产超过 35 million
              个零件；这说明客户基础显然不只是少数风投支持的硬件初创公司。最可见的垂直行业是航空航天、医疗、机器人、半导体、气候科技、
              eVTOL、消费产品和汽车；这些行业也反复出现在案例研究、质量引语和伙伴信息里。这个宽度很重要，因为产品卖的不是单一工艺机加工车间， 而是一个托管采购层，帮助团队从原型走到生产，而不用每次重建供应商基础。


              因此，最强的细分逻辑按工作流划分，而不是按 SIC 代码划分。Honeywell 代表受监管企业工程。Lunar Energy 代表从工装和原型扩展到生产的清洁能源硬件。 Nightside
              代表创始人主导的消费硬件，从迭代走向首批生产。MISUMI 和 EVCO 把渠道故事延伸到 BOM 整合和更大 OEM 供应链项目； 2026 年制造业调查和运输账号功能也说明，采购摩擦是 Fictiv
              明确要解决的买方问题之一。
