      - number: '4.3'
        title: 资本充足性、所有权转换与财务结论
        blocks:
          - type: paragraph
            body: >-
              收购前，资本充足性会是典型的风投跑道问题。收购后，更应该把它理解为母公司支持问题。MISUMI 于 2025 年 4 月签署 US$350M 全现金收购，并于 2025 年 6 月交割，意味着 Fictiv
              不再明显依赖下一轮外部融资。相较交割前的风投阶段，短期融资风险大幅下降； 但透明度也下降了，因为已审阅公开来源没有提供交割后 Fictiv 的独立财务。宏观环境让条款经济性更重要：Deloitte 的 2026
              制造业展望仍指向关税和投入成本压力，Xometry 的 2026 展望发布也指向更高质量要求和普遍涨价预期。这些信号与 Fictiv 明示的转嫁和逾期付款保护相吻合。归档的 WSJ
              市场数据页面也提醒我们公开可比公司可见度是什么样：即便是过时快照，也会在完整文件之外暴露 Xometry 和 Protolabs 的 EPS、市值、股数和空头兴趣背景。Fictiv
              现在作为私营公司，没有可比披露。最终结论很务实而不优雅： 运营规模和母公司支持都是真实的，但没有内部财务披露，就无法用投资级信心承销收入质量、毛利率路径和独立价值。
