      - number: '1.3'
        title: 融资历史、交易条款与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              公开融资历史到 2022 年为止相对清楚，之后开始变得模糊。Fictiv 在 2021 年 2 月宣布 $35M Series D，2022 年 5 月宣布 $100M Series E；Series E
              新闻稿称累计投资已达 $192M。后来 Crunchbase 归档数据为 $192.6M，而 Fictiv 当前网站写成 $200M。 最稳妥的读法是来源日期漂移，而不是存在一个干净的单一数字。


              更大的资本事件是 MISUMI 收购。MISUMI 于 2025-04-17 宣布 $350M 全现金交易，并披露交易于 2025-06-18 完成，美国当地时间 2025-06-17
              生效。这彻底改变了资本结构：Fictiv 现在是全资战略资产，不再是独立的风投支持公司。


              利益相关方的重要性也转向 MISUMI、创始人、制造伙伴网络和企业客户。MISUMI 贡献全球目录宽度、物流和制造基础设施；创始人提供连续性和产品愿景；
              伙伴仍是供给骨架；客户证据则显示需求覆盖差异很大的硬件场景。
