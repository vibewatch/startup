      - number: '3.2'
        title: 能力宽度、定价可见度与信任姿态
        blocks:
          - type: paragraph
            body: >-
              能力宽度不是 Fictiv 的短板。公司公开声称覆盖广泛的定制机械业务，MISUMI 组合也把叙事从纯定制工作延伸到一站式采购。 Xometry 和 Protolabs 仍是买方可见自助体验的标杆：Xometry
              公开营销即时报价、认证和供应商网络规模，Protolabs 强调报价速度、 快交期和公开投资者报告。Fictiv
              的定价呈现更偏托管，也没那么显性。买方显然可以请求即时报价，但公开证据较少显示它按工艺长期公布标价、
              促销框架或标准化经济参数。高差异度的定制工作可以接受这种做法，但也意味着价格发现仍更依赖销售辅助流程，而不是纯软件自助。 在信任姿态上，三大供应商都营销质量体系；只是 Xometry 和 Protolabs
              暴露了更多公开证明点。Fictiv 的反击点是托管质量、 本地团队和供应链执行深度。公开同业还受益于反复的文件披露和投资者更新周期，让买方习惯在能力主张旁看到新鲜的收入、资产负债表和运营披露。 受监管买方或
              CFO 主导采购时，即便运营产品有竞争力，这种披露不对称也可能重要。实际市场被分成两类客户： 一类看重已披露的自助指标，另一类看重高接触度的托管采购。
