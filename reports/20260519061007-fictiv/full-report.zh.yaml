  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：定制零件采购，而不是全部制造
        blocks:
          - type: paragraph
            body: >-
              Fictiv 真正面对的市场边界比“数字制造”这个词窄。公司处在这样一层：工程、采购和运营团队通过数字流程采购定制机械零件， 这个流程把报价、DFM
              反馈、供应商路由、检验和交付可视化合在一起。这是一个真实市场，但不等于全部工厂自动化、全部合同制造或全部工业软件。


              MISUMI 的组合反而让边界更好描述。MISUMI 处理标准件和可配置件；Fictiv 处理定制件。两家公司合在一起可以覆盖 BOM 的更多部分， 但 Fictiv
              的核心变现面仍是定制采购流程。因此，纳入的支出应集中在 CNC、成型、增材制造，以及围绕定制零件的配套质量 / 项目管理服务。 排除的支出应包括纯目录电商、无关物流和广义工业软件品类；这类支出有战略意义，但不是
              Fictiv 的直接收入池。


              这个区分很关键，因为大标题 TAM 可能夸大公司实际能够捕获的规模。
