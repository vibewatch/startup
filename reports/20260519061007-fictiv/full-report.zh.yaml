      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              实际买方群体是跨职能的。工程师往往先启动流程，因为他们需要快速报价、DFM 反馈或原型零件。但项目走向重复订单和生产后，经济买方会转向供应链、
              采购、质量和制造运营负责人，他们更关心成本、文档、区域选择和交付表现。


              最适配的行业，通常具备几个特征：零件是定制的、迭代速度重要，文档或合规不是小事。航空航天和医疗科技带来高流程要求；汽车和 EV
              同时有工装压力、关税和区域韧性诉求；气候科技、机器人、半导体和其他新兴硬件领域需要快速迭代和混合批量采购。这些正是 Fictiv 当前材料强调的类别。


              采用路径往往遵循一个共同模式：第一次报价、第一次原型、重复采购、试点或桥接生产，然后更广泛的 BOM 整合。这个模式不仅出现在 Fictiv 的定位里，也出现在 Xometry、Protolabs 和
              Protolabs Network 身上。
