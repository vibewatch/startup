      - number: '7.4'
        title: 整合、人员与终止触发条件
        blocks:
          - type: paragraph
            body: >-
              MISUMI 的理由让战略逻辑很直观：Fictiv 与 meviy 具有数字制造亲和性，但品类和地域互补，因此组合可能加深上游产品开发关系。
              同一逻辑也带来执行风险，因为价值创造路径取决于能否整合系统、渠道和运营标准，同时不拖慢响应速度、不削弱伙伴质量。人员风险在这里并不抽象：
              公开快照对员工数说法不一，但都没有透露收购后谁留下来了、关键合规和工程负责人是否留任、MISUMI 如何衡量协同捕获。
              公开材料包也没有给出当前期运营披露，因此投资者仍缺少交割后收入组合和客户集中度的直接证据。基于这个原因，终止标准应聚焦可监控事项： 关税暴露与定价权之间的差距扩大，伙伴产能或 DFM
              吞吐恶化，无法证明客户集中度纪律，或任何迹象显示 MISUMI 整合带来的复杂度大于商业杠杆。 因此，即便已有战略所有者，剩余风险视角仍是中高。
