      - number: '2.2'
        title: 规模测算视角：窄口径按需服务，对照宽口径数字制造
        blocks:
          - type: paragraph
            body: >-
              已发布的市场估算相差两个数量级，因为它们描述的是不同对象。Statifacts 估计，2026 年全球按需制造服务市场约为 $6.88B， 同一页面的一个标题则写作
              $7.94B。无论采用哪个口径，狭义服务市场都有意义，并预计到 2030 年代中期仍以约 15% CAGR 增长。 这组狭义数据也显示，CNC 服务主导当前结构。


              相比之下，Business Research Insights 把数字制造市场放在 2026 年约 $699.2B。这个更宽口径包含广泛得多的数字化主题， 因此能反映 Fictiv
              面临的战略顺风，但不能直接映射为 Fictiv 收入。


              一个实用桥接方式，是把 MISUMI 文件披露的 Fictiv 2024 年净销售额同狭义按需市场比较，只得到约 0.9%-1.1% 的方向性份额。 这个计算并不完美，但仍比假装 Fictiv 能从整个宽口径
              TAM 中拿份额更有决策价值。
