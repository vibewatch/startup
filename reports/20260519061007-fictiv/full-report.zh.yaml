      - number: '7.3'
        title: 商业不透明与竞争压力
        blocks:
          - type: paragraph
            body: >-
              最影响承销的商业风险，是公开披露仍没有说明 Fictiv 的客户有多耐久。投资者能看到融资历史、服务零件数、伙伴数量和较大员工基础等广泛采用信号，
              但看不到头部客户集中度、重复订单率、按队列留存或按行业划分的毛利暴露。这很重要，因为品类本身看起来仍健康：第三方市场来源继续把按需和合同制造描述为增长市场。
              如果品类在增长，那么表现不佳更可能来自竞争、服务质量或集中度，而不是单纯的宏观需求崩塌。公开评论页面也没有干净解决这个问题， 因为本材料包里可访问的买方口碑证据很薄。与此同时，市场来源把 Fictiv
              放在一个拥挤的数字制造替代方案市场里； 因此，报价速度、DFM 响应或伙伴表现一旦滑坡，打到的是核心竞争承诺，而不是边缘功能。
