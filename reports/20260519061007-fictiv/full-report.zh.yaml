      - number: '5.5'
        title: 路线图、依赖关系与生态信号
        blocks:
          - type: paragraph
            body: >-
              Fictiv 的近期路线图能从 2026 年已发布功能里读出来，但再往后就不清楚。注塑即时报价和扩展出口管制工作流已经上线。Materials.AI 和 Drawing Annotation Tool
              显示，公司继续投资前端工程生产力。面向供应链风险与韧性、数字制造价值的公开计算器，也说明公司试图把买方侧决策支持产品化， 而不只是执行交易。EVCO 合作为注塑路线图加入了关税管理角度，MISUMI
              整合则扩宽采购覆盖。更早也有一个有日期的先例： 2023 年 10 月，Fictiv 宣布美国 3D 打印服务扩展，新增 14 种材料，说明公司历史上会发布具体能力扩展，而不只是讲定位。
              更难承销的是时间表：公开路线图没有说明下一批报价、质量或区域产能功能何时落地。

              因此，生态信号更多来自从业者和雇主代理指标，而不是开源软件足迹。LinkedIn 显示其有可观公开受众和可见招聘基础，这符合一家把核心 IP 私有化的制造平台。这个品类可以接受这种状态，但也强化了一点：承销
              Fictiv 时应把它当作“运营软件 + 网络”业务，而不是开发者平台。 最大的产品风险藏在私有运营数据里：公开材料证明了宽度和工作流设计，但没有证明按地区划分的服务水平差异，而这正是成熟投资者最终会关心的问题。
