        - 前瞻经济性改善后，可支付更高的平台溢价
        - 前瞻数据可能永远无法证实这条轨迹
      - - 基准
        - 55%
        - 已披露交易仍是最佳锚点；交易后没有强烈正面或负面意外
        - 325-375
        - 围绕已签约交易定价，支撑“大概率合理”的立场
        - 当前不透明度留下有限但不巨大的重新定价空间
      - - 悲观
        - 25%
        - 关税压力、增长放缓、利润率走弱，或收入集中
        - 225-275
        - 会把隐含倍数压向低 3x 区间
        - 若当前经济性不及预期，下行空间会很快打开
    notes: 概率基于判断；区间锚定已签收购，并参考方向性的公开可比公司区间。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV004
    title: 可比估值表
    columns:
      - 可比项
      - 指标
      - 倍数 / 估值 / 状态
      - 可比意义
      - 局限
    rows:
      - - Fictiv / MISUMI 交易
        - 价格 / 2024 年销售额
        - 倍数：US$350M / US$72.452M ≈ 4.8x
        - 公司自身最好的可观测锚点
        - 单一战略交易，不是流动市场报价
      - - Xometry
        - 市值 / 销售额代理
        - 基于 Yahoo 和 MacroTrends 快照约为 5.2x-8.5x
        - 最接近的上市数字制造市场平台类比
        - 代理值用市值而非企业价值；规模更大、披露更充分
      - - Proto Labs
        - 市值 / 销售额代理
        - 基于 Yahoo 和 MacroTrends 快照约为 2.5x-3.4x
        - 生产模式更偏实体的数字制造基准
        - 更成熟且有盈利；并非完美的平台类比
      - - 品类增长背景
        - 市场规模 / CAGR
        - 按需制造 2026 年约 US$7.94B / CAGR 14.98%；2031 年达 US$16.68B
        - 支持支付高于停滞工业企业倍数的价格
        - 品类增长不保证公司层面经济性
      - - 更宽泛的数字制造
        - 市场规模 / CAGR
        - 2026 年 US$699.2B / 至 2035 年 CAGR 21.39%
        - 显示数字制造长期顺风很大
        - 远宽于 Fictiv 的具体业务组合
    enumerationScope:
      coverage: partial
      basis: >-
        Uses the observable Fictiv transaction plus the two most relevant public digital-manufacturing comps and two
        market-growth references; the set is directional rather than exhaustive.
    notes: 可比行混合了交易、上市可比公司和市场背景三种视角，因为不存在单一完美的上市同业。
    claimRefs:
      - CV004
      - CV017
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: TV005
    title: 打破投资逻辑与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前收入运行率
        - 显著低于兑现 2024 年及以后预期所需的隐含增长路径
        - 削弱战略溢价和乐观情景
        - 转向悲观情景
      - - 毛利率 / 抽佣率
        - 弱到 4.8x 销售额倍数不再站得住
        - 拿掉高于 Proto Labs 类水平定价的理由
        - 要求更低入场价
      - - 客户集中度
        - 单一客户或前 10 大客户占比远高于预期
        - 将采用度表象转化为集中度风险
        - 将当前价格视为过高
      - - MISUMI 整合 KPI
        - 交叉销售和服务扩张里程碑停滞
        - 打破战略溢价逻辑
        - 回到较低倍数框架
      - - 交易经济性
        - 标价之外存在重大的未披露滚存、对赌或留任经济安排
        - 让公开锚点没那么干净
        - 用修订后经济性重建估值
    notes: 触发项直接映射到让 US$350M 今天看起来合理的假设。
    claimRefs:
      - CV027
      - CV033
      - CV034
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 2025-2026 年收入运行率
        - MISUMI 持有期间当前收入桥接
        - 决定能否脱离已披露价格锚点的最重要变量
        - 管理层或 MISUMI 交易后报告
      - - 毛利率 / 抽佣率
        - 当前毛利率、抽佣率和订单质量数据
        - 决定 4.8x 销售额倍数是保守还是激进
        - 财务尽调
      - - 客户集中度 / 留存
        - 前 10 大客户占比、最大客户占比、重复下单指标
        - 决定耐久性和下行偏斜
        - 商业尽调
      - - 整合 KPI
        - 交叉销售、共享能力和运营效率里程碑
        - 战略溢价的核心证据
        - MISUMI 整合办公室
      - - 标价与总经济性
        - 标价之外的任何对赌、滚存或留任经济安排
        - 可能实质改变价格合理性判断
        - 法务 / 合并协议审查
    notes: 尽调清单有意保持简短，并优先围绕能影响估值的未知数。
    claimRefs:
      - CV039
      - CV040
