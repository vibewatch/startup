        blocks:
          - type: paragraph
            body: >-
              公司仍由创始人带队。Dave Evans 仍任 CEO，并在 2026 年 1 月兼任 MISUMI Americas 总裁，是公开记录中最重要的整合推动者。 Nathan Evans
              仍任首席体验官。两人的公开履历贴合公司最初命题：Dave 带来工程和产品开发加速能力，Nathan 带来金融、战略和跨境能力。


              创始人之外，公开管理层偏运营导向。Fictiv 披露了美国、墨西哥、中国和印度的区域总经理，以及 Joanne Moretti、Eddie Chen
              等商业和财务高管。这说明公司不只是一个创始人故事；供应区域里已经有一层公开的运营组织。


              治理透明度仍有限。公开资料能通过 MISUMI 确认交割后的所有权，但没有给出当前董事会名单、详细的管理层股权图，也没有说清遗留 Fictiv 治理与 MISUMI 监督之间如何分工。
