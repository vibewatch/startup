      - number: '8.4'
        title: 建议、投资逻辑破裂点与最终尽调
        blocks:
          - type: paragraph
            body: >-
              实际投资判断应围绕可观察价格，而不是假想上行数字。以 US$350 million
              收购价或其小幅上下为锚，估值立场可能合理，置信度中等。若价格明显更高，正确建议不是“无论如何买入这个优质故事”，而是“没有新的经营证据就不要追价”。能够改变判断的尽调清单很具体：2025 和 2026
              年收入运行率、毛利率或抽佣率、客户集中度、重复订单质量，以及可信的 MISUMI 整合 KPI 组合。如果这些数据显示继续保持 >30%
              增长、亏损进一步改善且集中度健康，乐观情景可信度会上升。如果相反，数据显示增速放慢、利润率薄弱或收入集中，下行情景会很快打开，因为当前可比公司桥接本来就是方向性而非精确测算。因此最终判断只能给中等置信度，最佳锚点仍是已经签署的交易价格本身。
