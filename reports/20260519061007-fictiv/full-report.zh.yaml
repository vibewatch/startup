  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围与模块图谱
        blocks:
          - type: paragraph
            body: >-
              最适合把 Fictiv 理解为包裹在广泛外包生产网络外的一层数字制造控制层。公开材料一贯描述的是同一个平台，覆盖上传、报价、DFM 审查、
              订单跟踪、检验文档，以及从原型到生产的交接，而不是某一种单一制造工艺。能力覆盖 CNC、钣金、注塑成型、压铸、增材工艺、聚氨酯浇注、 压缩成型，以及装配或焊接；因此产品承诺更像是“宽度 +
              编排”，而不是自有机器所有权。


              因此，模块图谱混合了客户可见软件、托管制造服务，以及嵌入式质量或合规工作流。MISUMI 的定位把范围扩到一份 BOM 采购： 标准件和可配置件交给 MISUMI，定制机械工作留给
              Fictiv。行业目标也很明确：航空航天、医疗、机器人、半导体、气候科技和 eVTOL 都出现在官方材料中；这匹配的是为工程师主导、受监管或多步骤硬件项目搭建的产品架构，而不是面向消费者的自助按需打印。
