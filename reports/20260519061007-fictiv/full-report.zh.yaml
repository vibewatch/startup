      - number: '5.2'
        title: 数字工作流与自动化
        blocks:
          - type: paragraph
            body: >-
              Fictiv 在 2026 年最具体的产品变化，是注塑成型即时报价。2026 年 3 月的发布页面描述了一个工作流：符合条件的直抽式
              零件可以立即返回可用于生产的价格和交期结果，更复杂零件则回到工程师审查报价，并提供 DFM 支持。这很重要，因为注塑成型通常卡在报价， 而不是卡在设计；Fictiv
              的自动化先打采购延迟，再把人类工程审查留给边缘案例。


              同样模式也出现在其他地方。平台有专门帮助流程，用来审阅和批准成型 DFM 报告，说明可制造性审查已在平台内部运营化。Materials.AI 帮助团队导航材料选择和零件采购，把工作流前端向前延伸；Drawing
              Annotation Tool 则让团队直接标注图纸、保留标注并提交带标注文件， 无需重新上传，从而减少报价审查中的文档摩擦。合在一起，这些功能说明 Fictiv
              的软件护城河在于压缩机械工程交接循环，而不是暴露开发者式 API 表面。
