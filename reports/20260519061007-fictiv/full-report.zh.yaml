  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 从产品页面和客户条款看收入模式与定价线索
        blocks:
          - type: paragraph
            body: >-
              Fictiv 的公开材料显示，这是一门围绕定制制造订单搭建的生意，而不是经常性软件收入。产品页面强调即时报价、按工艺区分的交期， 以及横跨 CNC 加工、注塑成型和 3D
              打印的生产支持。法律条款把经济结构说得更清楚：客户在生产开始前付款；报价一旦被接受就成为订单； 定制订单不可取消；若报价后材料成本发生重大变化，Fictiv
              可以重新定价或退出。关税、税费和进口商记录费用也可以转嫁。 这组安排比任何单一收入数字更能说明收入质量。它指向一种交易驱动模式，靠合同设计保护营运资本和毛利率，而不是靠公开标价或经常性
              ARR。外部看来，这个模式也有意保持轻资产：Fictiv 聚合需求，把工作路由到托管供应商网络，并用商业条款降低取消和回款风险。
              即便没有可见库存披露，这也可能支持现金转化；但它也意味着外部分析师无法把服务毛利与转嫁的制造支出拆开。下行点是， 收入可预测性、抽成率和实际毛利率仍被遮住；公开证据主要展示 Fictiv
              如何管理订单经济，而不是这些经济性合计成什么样。
