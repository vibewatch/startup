      - number: '6.3'
        title: 耐久性、重复使用与满意度可见度
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录明显变薄的地方。现有来源显示真实的重复使用信号——Honeywell 用 Fictiv Enterprise 做航空航天部件，Lunar 从原型走到生产爬坡， Nightside
              计划后续批次，质量页面证言暗示时间跨度内有许多订单——但已审阅材料没有披露 NRR、GRR、logo 流失、合同期限、续约率或队列行为。 因此，公开证据支持客户价值和运营有用性，而不是 SaaS
              投资者意义上的合同耐久性。


              独立满意度数据在这次跑数中也弱于理想状态。直接 G2 页面被 JS 阻挡，归档 Capterra URL 因访问被禁止而不可用，因此公开评论尽调无法依赖第三方评分或投诉分布。
              因此，本章必须依靠具名官方客户引语、案例研究和半独立媒体报道。这足以交付一个中等置信度的客户章节，但置信度上限仍停在中等， 因为最重要的耐久性问题仍在私有材料里。
