  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、相邻玩家与 MISUMI 后的新格局
        blocks:
          - type: paragraph
            body: >-
              Fictiv 已不再只是一个争夺原型订单的风投支持市场平台；MISUMI 交易之后，它进入了更大的机械零部件生态。直接可比对象仍从 Xometry 和 Protolabs
              开始，因为两家公司都通过公开网页销售多工艺数字制造，发布当前规模指标，并争夺同一批工程和采购工作流。 核心之外，还有更窄但仍有意义的专家型玩家：Protolabs Network/Hubs
              做网络化外包生产，Shapeways 偏增材制造项目，SyBridge 则偏工装驱动的注塑成型。现状替代方案仍是直接管理供应商和内部采购，纸面上往往更便宜，但运营负担重得多。MISUMI 改变了地图， 因为
              Fictiv 可以把可配置件、标准件和定制工作打包，这相对纯市场平台同业是真实的渠道优势。采购团队越来越想减少供应商数量， 让定制件、目录件、物流和合规落在一个商业伞下，这一点很重要。弱点是，Fictiv
              对当前经济性和表现的披露仍远少于上市同业； 企业买方得到的是更宽菜单，却不是同等水平的财务透明度。战略叙事比以前更强，但实际交叉销售、账户重叠和钱包份额提升的证据， 在公开材料中仍大多缺席。
