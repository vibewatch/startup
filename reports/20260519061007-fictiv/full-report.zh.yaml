  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与合规暴露面
        blocks:
          - type: paragraph
            body: >-
              Fictiv 的监管风险不是由某一张生死攸关的牌照决定，而是由一套分层合规栈塑造，触及出口管制、海关、供应商行为和受监管行业质量标准。 最清楚的 2026 年变化，是公司明确推进 EAR 监管工作：Fictiv
              现在对外强调受控项目的分类确认和自动化防护，但同一批公开文件仍说， 只有 EAR99 和 9E991 可以自助处理，ITAR 受控文件不能在平台内处理。这意味着监管扩张也会给航空航天和国防相邻需求带来筛查摩擦、
              误报删除风险和销售周期复杂度。合同条款进一步显示，关税、税费和进口商记录机制会根据运输选择被大量分配；供应商准则要求也确认， Fictiv
              依赖伙伴的劳工、制裁和反贿赂合规。公开监管机构和专利搜索页面没有给出干净的法律健康证明；它们只是让法律和 IP 尽调仍未解决。
