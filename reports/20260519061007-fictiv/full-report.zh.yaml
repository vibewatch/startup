      - number: '6.2'
        title: 具名客户证据与外部印证
        blocks:
          - type: paragraph
            body: >-
              具名客户证据是本章最强的证据组。Honeywell 的 RE100 APU 故事在制造平台案例中格外具体，因为它把真实航空航天项目与清晰运营变化连在一起： Fictiv 加 CNC 和 DFM
              支持替代了重铸路径，把交期从 22 周降到 3 周。Lunar Energy 在经济性上更丰富，披露工装交期降至最短 6 周、 投产速度加快 50%、节省约 $1 million 工装成本，并节省 700
              个工程小时。Nightside 提供另一个有用视角：一个较小的消费产品品牌， 借 Fictiv 从反复原型过渡到超过 1,000 件的首批生产，同时依靠中国团队处理工装、样品和故障排查。


              这些旗舰案例之外，证据变浅，但方向上仍有帮助。质量页面提供 Gecko Robotics、Animax Designs 和 Nexkey 关于检验质量和供应商整合的具名引语。
              注塑页面加入了一条关于模具时点的俏皮引语。LinkedIn 还给出 2026 年客户圆桌提及，点名 Shaper、Zipline、Carbon 和 EnergyX。
              合在一起，这足以说明客户使用真实且多样，但仍不足以完全承销生产耐久性或按账户划分的收入重要性。
