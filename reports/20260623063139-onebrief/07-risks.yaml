callouts:
  - calloutType: risk
    title: "Thesis-Break: Customer Concentration Without Revenue Visibility"
    body: >-
      The combination of >60% estimated revenue concentration in three combatant commands and
      zero public financial disclosure creates a fragile investment thesis. Loss of a single
      GCC relationship — through protest, mandate shift, or budget reallocation — could impair
      revenue by 20–30% with no external early-warning signal.
    claimRefs:
      - CR012
      - CR013
      - CR001

  - calloutType: risk
    title: "Defense-Tech Valuation Overshoot"
    body: >-
      The 3.3× valuation step-up in 12 months without disclosed revenue metrics mirrors patterns
      that preceded corrections in prior venture cycles. S&P Global notes slowing M&A exits in
      defense tech; if the IPO/acquisition window remains closed, late-stage investors face
      extended illiquidity with uncertain terminal value.
    claimRefs:
      - CR003
      - CR004
      - CR006

  - calloutType: recommendation
    title: "Priority Diligence Asks"
    body: >-
      Before investment: (1) request audited ARR, burn, and customer-concentration data under NDA;
      (2) obtain ATO history and re-authorization timeline from Second Front; (3) confirm CEO
      succession plan and D&O coverage; (4) assess contract backlog resilience to 6-month CR;
      (5) benchmark valuation multiples against disclosed-revenue defense-tech peers.
    claimRefs:
      - CR001
      - CR007
      - CR012
      - CR033
      - CR028

