companyProfile:
  summary: Onebrief is a Honolulu-based defense-technology company building an AI-enabled operational planning and staff-collaboration platform for the U.S. military and allied commands. Founded in 2019 in Austin by U.S. Army veteran Grant Demaree and engineer Rafael "Rafa" Pereira, it digitizes the Military Decision Making Process and Joint Planning Process, replacing PowerPoint- and document-centric workflows with a live, networked planning workspace that runs on classified networks. After a rapid funding sequence culminating in a $200M Series D at a $2.15B post-money valuation in January 2026 (alongside the acquisition of wargaming firm Battle Road Digital), Onebrief is positioned as an emerging "command operating system," though its financial fundamentals remain undisclosed.
  foundedDate: '2019-01-01'
  founders:
    - name: Grant Demaree
      role: Co-founder and CEO
      background: West Point graduate (2013, Nuclear Engineering and International Relations) and former U.S. Army officer with deployments to Liberia (Ebola response) and Iraq (anti-ISIS); conceived Onebrief from firsthand frustration with legacy military planning tools.
      claimRefs:
        - CO009
    - name: Rafael "Rafa" Pereira
      role: Co-founder
      background: Software engineer with prior roles as Director of Product Engineering at data.world and VP of Engineering at IAC.
      claimRefs:
        - CO012
  foundingLocation: Austin, Texas, USA
  headquarters: Honolulu, Hawaii, USA
  productSummary: A web-based collaborative operational planning platform that turns slide- and document-based staff planning into real-time, auto-updating planning artifacts, with AI Assist (agentic AI) for course-of-action development and embedded wargaming and simulation, deployable across SIPR, NIPR, and JWICS classified networks and on DAF CLOUDworks.
  customerFocus: U.S. Department of Defense combatant commands, the Joint Staff, service component commands, and allied ministries of defense, spanning strategic, operational, and tactical planning echelons.
  businessModel: Enterprise software sold into the U.S. and allied defense market, deployed on classified and unclassified government cloud environments through accredited deployment partners; specific pricing and contract economics are not publicly disclosed.
  stage: Series D
