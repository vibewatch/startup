- id: funding-capitalization
  title: Funding History and Capitalization
  body: >-
    Onebrief has raised over $303 million in disclosed venture financing across multiple rounds. The company
    participated in Y Combinator's Summer 2020 batch and subsequently raised undisclosed earlier rounds. By
    January 2025, Insight Partners reported the company had raised a total of $103 million prior to its Series C.
    The Series C of $70 million (initially $50 million from General Catalyst and Insight Partners, expanded to $70
    million with Human Capital, Caffeinated Capital, and 9Yards Capital) closed in January 2025 at a $650 million
    post-money valuation. In June 2025, Battery Ventures led a $20 million Series C extension that nearly doubled
    the valuation to $1.1 billion in approximately three months, making Onebrief a unicorn. In January 2026,
    Onebrief closed a $200 million Series D (primary and secondary) at a $2.15 billion post-money valuation, led
    by Battery Ventures and Sapphire Ventures with participation from Salesforce Ventures, General Catalyst, and
    Insight Partners. On the same day as the Series D announcement, Onebrief acquired Battle Road Digital, a
    wargaming and simulation defense company. The 3.3x valuation increase from $650 million to $2.15 billion in
    twelve months is aggressive and warrants scrutiny regarding the sustainability of such step-ups given no
    public revenue disclosure.
