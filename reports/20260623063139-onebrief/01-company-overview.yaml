- id: leadership-governance
  title: Leadership, Founders, and Governance
  body: >-
    Grant Demaree serves as CEO and co-founder. A 2013 West Point graduate with degrees in Nuclear Engineering
    and International Relations, Demaree served as a U.S. Army officer with deployments to Liberia during the
    Ebola response and Iraq during anti-ISIS operations. He conceived Onebrief while deployed and founded the
    company after leaving active service. Co-founder Rafael "Rafa" Pereira brings a software engineering
    background, having previously served as Director of Product Engineering at data.world and VP of Engineering
    at IAC. In February 2026, Onebrief appointed Cory Ondrejka as Chief Technology Officer. Ondrejka is the
    co-creator and former CTO of Second Life at Linden Lab, former VP of Mobile Engineering at Meta during its
    desktop-to-mobile transformation, CTO of SmartNews, and held engineering roles at Google. With the Series C
    in January 2025, the company added two prominent board members: Chris C. Miller, former Acting U.S. Secretary
    of Defense, and Lt. Gen. Lewis Craparotta (Ret.), former USMC commander. The leadership team's concentration
    around Demaree as the public face and strategic decision-maker creates key-person dependence risk that
    investors should evaluate.
  claimRefs:
