callouts:
- calloutType: strength
  title: Deep penetration into highest-priority DoD planning workflows
  body: Onebrief is embedded in three of the four largest DoD operational plans and runs on all major classified networks. This level of adoption in mission-critical workflows creates significant switching costs and validates product-market fit in a notoriously difficult-to-enter buyer ecosystem.
  claimRefs:
  - CO028
  - CO029
  - CO005
  - CO006
- calloutType: risk
  title: No public revenue disclosure despite $2.15B valuation
  body: The company has never publicly disclosed revenue, ARR, or growth metrics. The 3.3x valuation step-up from $650M to $2.15B in twelve months relies entirely on investor conviction and customer adoption narratives that cannot be independently verified. Defense procurement cycles are long and unpredictable, creating execution risk that is invisible without financial transparency.
  claimRefs:
  - CO030
  - CO031
  - CO034
  - CO035
  - CO037
- calloutType: insight
  title: Board and CTO appointments signal institutional maturity push
  body: Adding a former Acting Secretary of Defense, a retired Lieutenant General, and a technology veteran CTO in rapid succession suggests Onebrief is deliberately building governance and technical credibility to support its next growth phase, likely anticipating larger program-of-record contracts and potential future liquidity events.
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
