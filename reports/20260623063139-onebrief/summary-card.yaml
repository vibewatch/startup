summary:
  headline: >-
    Onebrief has rare planner-native traction inside the U.S. defense establishment and a credible "command OS"
    trajectory, but its 3.3x valuation step-up in twelve months rests on fundamentals it does not disclose, leaving the
    $2.15B mark hard to underwrite from public evidence.
