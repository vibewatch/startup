      - number: '5.3'
        title: 架构、部署与机密网络运行
        blocks:
          - type: paragraph
            body: >-
              Onebrief 横跨美国三类主要涉密网络环境部署：NIPR（非密但敏感）、SIPR（Secret）和 JWICS（Top
              Secret/SCI）。不同密级的规划人员因此能在同一平台上工作，并按权限获得访问控制。多网络部署技术门槛高：每张网络都有不同安全要求、连接约束和认证标准。平台部署架构借助 Second Front
              Systems 的 Game Warden；后者是 DoD 认可的 DevSecOps 平台，提供 CI/CD 流水线、安全扫描、持续监控、7x24 事件响应和渗透测试。2026 年 5 月，Onebrief 在
              Department of the Air Force 的 CLOUDworks 环境中快速落地后，将 Second Front 定为首选部署伙伴。Game Warden 已获得 Impact Level
              5（DoD 云中的 Controlled Unclassified Information）、Impact Level 6（Secret 密级）和 Top Secret 级别授权，并按 NIST 800-53
              控制项和 DoD DevSecOps Reference Design 记录合规。上述架构让 Onebrief 能持续发布更新，同时守住任务关键型军事规划软件所需的安全姿态。Game Warden 零
              Critical/High CVE 的状态和 3PAO 审计就绪能力，也提供了 Authority to Operate 审批通常需要的合规材料。该部署模式减轻了 Onebrief
              团队在基础设施安全上的工程负担，也缩短了部署时间。
