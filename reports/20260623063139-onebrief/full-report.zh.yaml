  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与类别分类
        blocks:
          - type: paragraph
            body: >-
              Onebrief 竞争于一个多层防务规划与决策支持市场。CB Insights 识别出约 157 家活跃竞争者，其中 17
              家融资较充足。竞争场域可分为四类：（1）Palantir（Gotham、AIP、Maven Smart System）和 Anduril（Lattice OS）等防务 AI
              平台巨头，把规划视为更广义决策优势栈中的一个模块；（2）Comand AI、Primer AI、Hadean 等点状解决方案初创公司，解决兵棋仿真或 NLP 驱动情报融合等具体流程子问题；（3）Lockheed
              Martin、RTX/Raytheon、Northrop Grumman 等传统防务主承包商，其 CPOF、GCCS-J、IBCS 等既有 C2
              系统锚定了数十年采购关系；（4）现状替代方案——PowerPoint、Word 和 SharePoint 加手工 MDMP 流程，构成 Onebrief 必须替代的功能基线。Helsing 等欧洲进入者（2025
              年估值约 €5B）以及 Scale AI 等相邻数据基础设施玩家也让格局更复杂，它们正越来越多地布局防务规划相邻领域。理解这套分类很重要，因为 Onebrief
              的直接竞争威胁随类别而变：平台捆绑者拼宽度和资本，点状方案拼流程特异性，主承包商拼在位关系和切换成本，现状方案则靠惯性和零边际成本竞争。
