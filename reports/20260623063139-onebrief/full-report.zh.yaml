      - number: '2.2'
        title: 多视角市场测算
        blocks:
          - type: paragraph
            body: >-
              没有单一公开估算能精确覆盖军事规划软件的可服务市场，因此需要多视角判断。最窄且可信的视角是美国 JADC2 技术市场；MarketsandMarkets 估算其从 2023 年 $1.2B 增至 2030 年
              $8.6B，CAGR 为 31.7%，驱动因素是 DoD 对跨域集成指挥控制的需求。Emergen Research 给出另一组美国 JADC2 估算：2024 年 $6.5B，到 2034 年增至
              $15.2B，CAGR 为 8.8%，其定义更宽，纳入更多硬件和服务。在全球 JADC2 层面，360iResearch 和 GII Research 收敛到 2025 年 $9.84B、2026 年
              $11.46B、2032 年 $29.45B，CAGR 为 16.94%，覆盖所有参与国家的硬件、软件和服务。最宽的视角是 Fortune Business Insights 的指挥控制系统市场，2026 年
              $39.27B，到 2034 年增至 $73.33B，CAGR 为 8.1%，包括国防和民用领域的固定与移动 C2
              基础设施、网络和集成服务。这些估算之间的差距在分析上很重要：它反映的是范围边界不同，而不是对同一个数量的分歧。对纯软件规划平台而言，实际可服务可寻址市场（SAM）最好近似为美国 JADC2
              软件部分加上盟国同类需求，2026 年大概率在 $3-6B 区间；任何单一供应商的可服务可获得市场（SOM）还会被保密要求、采购工具和竞争格局进一步压缩。
