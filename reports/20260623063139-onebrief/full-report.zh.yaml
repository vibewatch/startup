  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与客户流程
        blocks:
          - type: paragraph
            body: >-
              Onebrief 是一个基于 Web 的协同规划操作系统，旨在替代军方传统作战规划方式；后者长期依赖 PowerPoint 演示、Word
              文档，以及在轮换参谋之间传递的邮件链。平台瞄准美国陆军参谋使用的军事决策流程（MDMP），以及作战司令部和联合特遣队层级使用的联合作战规划流程（JPP）。静态文档一经共享就会过时；Onebrief
              则把规划结构化为实时、自动更新的「cards」产物，并在整个规划周期中维持数据关系。情报评估一旦变化，依赖它的规划产物会自动更新，消除通常吞掉参谋军官数小时的手工对账。用户报告称，规划周期时间减少 70%，每周约
              20
              小时重复工作被消除。平台支持跨地理边界和保密等级的分布式协作，让不同总部的参谋可同时处理共享规划产品。这一流程变革很关键，因为现代军事行动要求的决策速度，已经超过手工、文档中心流程所能交付的水平。Onebrief
              的愿景是通过移除规划到执行周期中的摩擦，实现「超人类军事指挥」。
            claimRefs:
              - CE001
              - CE002
