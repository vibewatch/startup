      - number: '7.7'
        title: 人才、治理与利益冲突风险
        blocks:
          - type: paragraph
            body: >-
              Onebrief 存在围绕 CEO Grant Demaree 的关键人集中。其军事背景、West Point 网络和作战可信度，是公司在军装客户面前取得信任的核心组成。2026 年 2 月聘任 CTO（Cory
              Ondrejka）部分降低了技术领导层风险，但 Demaree 若离职或失能，会在重视其个人作战经验的 combatant-command 客户中造成急性信任缺口。董事会构成带来治理问题：Chris C.
              Miller（前 Acting SecDef）和 Lt. Gen. (Ret.) Lewis Craparotta
              提供可信度，也带来潜在利益冲突——曾任高级官员为一家向其过去领导过的司令部销售产品的公司提供建议，可能受到离职后政府雇佣伦理规则（18 USC §207）审视。投资人方面，General Catalyst 既是
              Onebrief 投资人，又运营自己的防务业务实践，可能产生信息和优先级冲突。公司 private-undisclosed
              状态放大了治理风险：没有公开财务报告、独立审计或少数股东保护，投资人只能完全依赖董事会层面的监督来获得受托保障。员工规模不透明（仅报道称「数百名员工」）也限制了外界观察组织健康、流失率和具备 clearance
              人才容量的能力。
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
