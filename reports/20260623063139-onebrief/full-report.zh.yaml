      - number: '4.4'
        title: 资本充足性、烧钱与 runway 评估
        blocks:
          - type: paragraph
            body: >-
              Onebrief 在 2026 年开局拥有大量弹药：2026 年 1 月 Series D 融资 $200M，外加 2025 年 Series C 轮次的 $90M。不过，由于烧钱速度未披露，runway
              无法计算。代理指标显示公司在激进投入：Battle Road Digital 收购（与 Series D
              同日宣布）消耗了部分一级融资，公司称有数百名员工，支撑三个安全域机密网络部署的基础设施也很吃资本。Series C（2025 年 1 月）时提到员工同比增长近
              130%，意味着人数快速扩张。若假设防务软件公司的烧钱曲线为每月 $3M–$8M（基于员工数和基础设施的粗略估计），Series D 的 $200M 一级资金可支撑 25–67 个月
              runway——但没有烧钱确认，这只是示意。募资用途披露点名 AI Assist 产品扩展和战时韧性基础设施，两者都需要持续资本。Series C
              时执行的要约收购让早期员工获得流动性，说明公司用二级交易管理留才，而不是依赖短期 IPO。没有公开披露债务、信贷额度或项目融资义务。
