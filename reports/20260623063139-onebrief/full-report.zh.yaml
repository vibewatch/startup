      - number: '8.4'
        title: 牛、基准、熊三种估值结果情景分析
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 Onebrief 的平台扩张策略成功：Battle Road 整合交付单一栈内的规划到仿真，收入在 2027 年由多年 program-of-record 合同推动超过 $100 million
              ARR，公司拿下管理层提出的「military command OS」定位。在该情景下，对 $100–150 million ARR 给予 30–40× forward multiple，公允价值区间为 $3–6
              billion，相对当前 Series D 估值有 40–180% 上行。考虑到可见采用强度，该情景概率权重中等，但受 Pentagon 采购周期约束；每次重大合同扩张通常需要 18–36
              个月。基准情景假设公司稳定增长，但低于创投预期：到 2027 年中，ARR 达到 $50–70 million，既有部署转化为有资金支持的 Programs of Record，但项目扩张周期拉长。按
              25–35× forward multiples，该情景公允价值为 $1.25–2.45 billion，大致持平或略低于当前定价，说明对相信基准情景的投资人来说，Series D
              入场介于合理和偏贵之间。熊市情景考虑在增长未加速时倍数压缩：如果防务科技融资周期降温（A.I. Ventures 和 The Economist 分析师已警告），行业倍数压缩至 15–20×，且 Onebrief
              因采购摩擦收入仍低于 $40 million，隐含价值区间会降至 $600 million–$800 million，较当前定价显著下修。Palantir 的竞争阴影会放大下行风险（$10 billion
              Army Enterprise Agreement 让 Palantir 在相邻规划层拥有杠杆），Onebrief cap-table 结构不透明也会放大风险；累计 $303 million primary /
              secondary capital 形成的未披露 preference stacks，可能在下轮情景中使后进入者处于劣后位置。
