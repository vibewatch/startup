        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的融资轨迹显示投资人信念正在加速。公司进入 Y Combinator 2020 年夏季批次，随后完成种子轮、Series A 和 Series B（2024 年由 Human Capital
              领投）；据 Insight Partners，Series C 前累计资本约 $103M。Series C 于 2025 年 1 月完成，规模 $50M，由 General Catalyst 和 Insight
              Partners 领投，Human Capital、Caffeinated Capital 和 9Yards Capital 参投，投后估值 $650M。仅五个月后，Battery Ventures 于 2025
              年 6 月领投 $20M Series C 延伸轮，估值几乎翻倍至 $1.1B，并赋予公司独角兽身份。2026 年 1 月 Series D 节奏进一步加快：Battery Ventures 和 Sapphire
              Ventures 领投 $200M（一级和二级交易），Salesforce Ventures、General Catalyst 和 Insight Partners 参投，投后估值 $2.15B。Series D
              含有二级交易，说明早期员工和早期投资人获得流动性——这既是机构化成熟信号，也说明公司在任何公开市场事件前进行了资本循环。累计融资约 $303M。估值 12 个月内从 $650M 跳升至 $2.15B，涨幅
              3.3×，按任何行业标准都激进；不过这与 2025–2026 年防务科技超级轮大环境一致，当时 VC 支持的防务初创公司估值中位数达到 $146M，而 2024 年为 $42.8M。
