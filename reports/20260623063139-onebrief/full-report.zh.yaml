      - number: '7.4'
        title: 竞争与捆绑风险
        blocks:
          - type: paragraph
            body: >-
              Onebrief 面临来自资本雄厚防务科技平台和传统主承包商的双重竞争加剧。Palantir（2026 年市值约 $150B+）已凭 Gotham 和 AIP 覆盖 DoD 多级指挥层，并积极争取 CJADC2
              集成合同。Anduril（2026 年 1 月估值约 $61B）把 Lattice OS 定位为统一的自主 C2 层，也有资本通过自研或收购捆绑规划能力。两家公司都有更大的工程团队、更深的 DoD
              关系网络，以及跨密级既有 ATO。传统主承包商（Lockheed、Northrop、RTX）在主要 Programs of Record 中占据 incumbency，随着 CJADC2
              架构成熟，可能把自有规划工具捆绑进更大的 system-of-systems 合同，甚至强制采用。CB Insights 数据识别出约 157 个活跃 Onebrief 竞争对手，其中 17
              个资金充足。风险不在于 Onebrief 今天技术更差——作战总部的用户采用显示出强产品市场匹配——而在于更大玩家吸收或复制协同规划价值主张，并在更广 C2/ISR 合同中以零边际成本捆绑。Onebrief 于
              2026 年 1 月收购 Battle Road Digital，部分补上了仿真缺口，但同时提高了整合复杂度和烧钱速度。
