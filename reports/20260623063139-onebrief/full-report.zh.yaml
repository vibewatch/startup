      - number: '1.4'
        title: 规模、里程碑与运营风险
        blocks:
          - type: paragraph
            body: >-
              Onebrief
              的采用集中在美国军方最高优先级的规划环境。平台已嵌入国防部四个最大作战计划（OPLANs）中的三个，并被三大地理作战司令部、联合参谋部和盟军使用。不过，具体客户身份和合同金额仍属机密或未披露。收入、ARR
              和准确员工数没有公开报告——媒体只称其有「数百名员工」，但没有精确数字。公司属于私人未披露状态，投资人只能依赖合同动能叙事，而不是经审计的财务证据。估值从 2025 年 1 月的 $650M 升至 2026 年
              1 月的 $2.15B，12 个月涨 3.3 倍，尤其在防务行业采购周期漫长、试点到列装项目之间存在「死亡谷」的背景下，增长指标是否足以支撑溢价值得追问。CEO Demaree
