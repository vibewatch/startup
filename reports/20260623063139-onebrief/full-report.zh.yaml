      - number: '7.6'
        title: 监管、安全与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              在 SIPR、NIPR 和 JWICS 涉密网络上运行，要求 Onebrief 维持 facility clearances（FCL）、多级人员安全 clearance，并通过 Second Front 的
              Game Warden 平台持续满足 NIST 800-171/CMMC、FedRAMP（云组件）和 DISA Impact Level（IL5/IL6/TS）认证。每个密级都有不同运营约束：具备
              clearance 的员工不能远程处理涉密任务，限制招聘地域；任何安全事件（spill、未经授权披露、insider threat）都可能触发停运和 clearance 审查。Onebrief
              向盟国扩张时，ITAR 和出口管制风险会显现——作战计划常含 ITAR 管制数据，与 Five Eyes 或 NATO 伙伴共享协同工作空间需要出口许可，或符合 ITAR §126 下的特定豁免。FAR Part
              4 网络安全要求（包括 DFARS 252.204-7012 对 Covered Defense Information
              的要求）带来随合同范围扩大而扩大的持续合规义务。任何合规失败都可能导致合同终止、禁止承包，或 False Claims Act 责任。监管负担又因依赖首选部署伙伴 Second Front Systems
              而加重；它是让 Onebrief 得以在涉密网络上运行的认证边界单点故障。
