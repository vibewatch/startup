      - number: '5.4'
        title: 技术领导力与 AI 路线图
        blocks:
          - type: paragraph
            body: >-
              Onebrief 于 2026 年 2 月任命 Cory Ondrejka 为 CTO，释放出加码工程深度和 AI 能力的信号。Ondrejka 拥有 30 多年经验，曾在 Google 担任 Google
              Experience VP，并作为 CEO Sundar Pichai 的技术战略顾问管理 1,500 多名工程师；在 Meta 担任移动工程 VP，参与从桌面到移动的转型；在 SmartNews 担任
              CTO，推动 LLM 采用；也曾在 Linden Lab 共同创建 Second Life 并担任 CTO。他在 Onebrief 的任务，是扩展 AI Assist 能力，并把 Battle Road
              Digital 的仿真技术接入平台。AI 路线图包括：自动化常规参谋流程的 agentic 工作流、用于行动方案开发的 AI 协同规划器，以及从真实世界作战数据中学习、随时间提升仿真保真度的 AI
              驱动兵棋。公司称平台会通过 AI 驱动学习持续演进。要在事关生命安全的军事场景里构建可信 AI，Ondrejka 过往把消费级平台扩展到移动时代、并把 AI 用到十亿级用户产品上的经历，提供了相关技术领导力。他的
