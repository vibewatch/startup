      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自大国竞争，以及由此产生的压缩决策周期紧迫感。DoD 的 CJADC2 计划明确希望从手工「swivel
              chair」分析转向集成数据共享模型，为能够融合规划、情报和执行的软件平台创造结构性需求。DoD FY25-26 Software Modernization Implementation Plan
              通过要求现代软件实践、持续授权运行（cATO）和大规模采用商业 SaaS，把这种紧迫性制度化。FY2026 NDAA 也通过包括 FORGED Act 在内的采办改革条款强化这些趋势，优先推动商业采购。AI
              采用进一步加速需求，因为军事规划越来越需要实时数据融合和预测分析，而老旧工具无法提供。盟军互操作要求放大了市场，联合作战需要跨保密边界共享规划平台。不过，约束仍然显著。GAO 2025 年 4 月对 CJADC2
              的评估发现，六年努力仍未形成统一框架来指导投资或衡量进展，各军种项目基本各自推进。过度严格的数据分级仍是共享指挥控制数据的重大障碍。FY2026 预算周期具体暴露了这些风险：2025 年 10 月开始的 43
              天政府停摆，随后延续至 2026 年 1 月的持续决议，推迟合同授予，并导致数十万 DoD 文职人员休假。GAO
              发现，约一半采办项目因持续决议出现进度延误，并伴随成本和行政负担上升。根深蒂固的老旧系统（CPOF、GCCS-J、PowerPoint）带来的切换成本，以及机密网络 ATO
              认证要求，又增加了采用摩擦。预算不确定性和 C2 投资权限分散，意味着即便位置有利的供应商，也要面对漫长销售周期和不可预测的采购时间表。
