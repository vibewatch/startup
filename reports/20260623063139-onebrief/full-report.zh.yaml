              最窄（美国 JADC2 $6.5B）与最宽（全球 C2 $39.27B）市场估算相差 5-7 倍，意味着估值倍数高度依赖投资人接受哪一种 TAM 定义。若平台供应商声称可覆盖完整 $39B
