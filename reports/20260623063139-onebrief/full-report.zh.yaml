      - number: '4.5'
        title: 估值倍数、防务科技背景与反向分析
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的 $2.15B 估值需要同时放在行业基准和基本面不透明度下审视。PCE Investment Bankers 称，2026 年 Q1 航空航天与防务 M&A 交易中位数达到 18.87×
              EBITDA 和 3.74× 收入——收入倍数为四年回看最高。防务科技私募 VC 轮次却按 10–20× 预计收入定价，模仿高增长商业 SaaS 倍数，而非防务行业常态。如果 Onebrief 未披露 ARR
              假设为 $30–50M（这一范围与其部署规模相符，但完全未经确认），隐含收入倍数将为 43–72×，远高于公开防务可比公司和典型成长期 SaaS。S&P Global Market Intelligence
              报告称，面向防务初创公司的 VC 融资在 2025 年达到 $29B，接近 2020 年总额的三倍；与此同时 M&A 活动放缓，意味着可验证这些入场价格的退出更少。Defense Tech Signals
              newsletter 强调，联邦义务（交付可信度的代理指标）常常远远落后于头部估值。对 Onebrief 而言，公开可见义务约 ~$16M，不到 $2.15B 估值的 1%，尽管机密支出很可能高得多。AIN
              Ventures 的量化分析认为，典型防务收购方收入倍数为 3–5×，防务科技入场估值存在跑赢退出可能性的风险。12 个月内从 $650M 到 $2.15B、涨
              3.3×，且没有任何公开收入披露，正体现了执行缺口风险：投资人定价的是对未来合同规模的信念，而不是已展示的财务表现。
