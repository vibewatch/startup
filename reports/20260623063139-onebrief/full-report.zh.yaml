            title: 流程原生设计制造结构性切换成本
            body: Onebrief 嵌入四个最大 OPLANs 中的三个，意味着迁移需要重建权威作战计划——这会耗时数月，并带来战备风险；没有指挥官会在部署周期中自愿承担。
            calloutType: strength
            claimRefs:
              - CP023
              - CP024
