      - number: '4.6'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Onebrief 的财务画像呈现悖论：资本获取能力极强，运营透明度却几乎为零。公司显然已达到足以吸引顶级投资人、并支撑估值快速上升的产品市场匹配，USASpending 也确认存在真实政府收入。但
              ARR、收入增长、毛利率、烧钱速度、客户集中度和合同级经济性均未披露，意味着外部任何一方都无法仅凭基本面承销 $2.15B 估值。关键尽调卡点包括收入规模和增长轨迹（ARR 是 $20M、$50M 还是
              $100M？）、毛利率和成本结构（这是 70%+ 软件毛利业务，还是重基础设施成本导致 40% 毛利的混合业务？）、客户集中度（是否一个作战司令部贡献超过 50%
              收入？）、合同期限和续约可见性（年度订阅还是多年承诺？），以及机密与非机密收入的拆分（这决定可审计性和公开市场准备度）。正确的投资姿态不是回避——公司显然真实且在增长——而是在按当前价格承销前，坚持要求管理层披露。
