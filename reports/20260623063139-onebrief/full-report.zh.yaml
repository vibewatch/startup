      - number: '5.5'
        title: 信任姿态、安全控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的安全姿态很大程度依赖部署伙伴 Second Front Systems。其 Game Warden 平台记录 NIST 800-53 合规，维持零 Critical/High CVE
              状态，并提供 7x24 事件响应和持续监控。平台运行在已认证的涉密网络（SIPR、NIPR、JWICS）上，说明它已经取得或正在沿用既有 Authority to Operate。但公开材料里，Onebrief
              自身的安全架构、数据治理和软件保障做法披露有限。外界看不到公开状态页、渗透测试结果、安全架构图，也看不到 Onebrief 专属的事件响应政策。依赖 Second Front
              让部署基础设施形成单点依赖。技术风险还包括：在事关生命安全的规划场景里，AI 可靠性要求极高；一旦生成幻觉情报评估或有缺陷的行动方案建议，可能造成作战失败。跨密级维护多项
              ATO，也意味着持续合规开销。Battle Road Digital 的整合带来执行风险：兵棋和仿真能力必须与规划工作流紧密耦合，同时继续满足涉密网络合规。若用涉密作战数据训练
              AI，数据治理还会引出模型如何跨密级边界隔离的问题。防务科技分析师指出，政府采购机制限制了利润率上行，漫长销售周期也会消耗 VC 支持公司的资本；这些公司还必须同时在多个环境里维持认证。
