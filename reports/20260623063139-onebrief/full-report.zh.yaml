      - number: '7.2'
        title: DoD 预算、Continuing Resolution 与停摆风险
        blocks:
          - type: paragraph
            body: >-
              Onebrief 几乎所有已披露收入都来自美国 Department of Defense 项目，因此对联邦预算动态高度敏感。CSIS 分析指出，财年初任何 continuing
              resolution（CR）都会冻结新合同义务、禁止 new-start programs，并把支出限制在上一年水平——这会直接冲击依赖扩张 task orders 增长的软件供应商。FY2026 防务预算在
              2025 年末面临显著 CR 风险，GAO 高风险报告也反复将 DoD 采办管理列为长期治理弱项。全面政府停摆还会叫停合同修改、延迟向承包商付款，并可能导致具备 clearance
              的人员被裁；这些人员无法休假而不危及其 clearance 状态。像 Onebrief 这样收入基础集中在 combatant-command 作战预算（OPA/RDTE line items）的公司，即便 60
              天 CR 也可能把整整一个季度的管线扩张实际冻结。宏观风险又被防务预算不确定性放大：虽然 topline 已增长，但 NDAA 授权流程过去多个周期出现多年延误和 sequestration
              威胁。Onebrief 依赖 OTA 和 SBIR/Tradewinds 路径；这些路径授标更快，但资金耐久性不如 Programs of Record，也会放大其对年度拨款扰动的脆弱性。
