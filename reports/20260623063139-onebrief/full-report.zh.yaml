              Onebrief 通过部署在机密网络（SIPR、NIPR、JWICS）上的政府软件许可变现。定价模型未公开披露，但防务 SaaS 合同通常依据司令部范围和用户数，年合同额在 $1M–$50M+
              区间。公司未公开披露 ARR、收入、毛利率、客户数量或净留存。USASpending.gov 记录确认，2022 至 2026 年间，Onebrief Inc. 至少获得来自 Department of the
              Air Force 和 Department of the Army 的 $16M 非机密联邦义务，跨多项合同动作——包括一笔 $3.5M Air Force 采购订单（2025 年 8 月）、一笔 $3.0M
              交付订单（2024 年 12 月）、一笔 $2.51M 奖项（2026 年 3 月）和一笔 $2.5M Army 合同（2024 年 9 月）。这些只代表非机密部分；Onebrief
              对地理作战司令部和联合参谋部的大多数部署，很可能通过公开义务数据库不可见的机密资金渠道流动。公司声称用户小时数年化增长 19,600%、生产率提升 2×，但这些是参与度指标，不是收入指标。Series C
              延伸轮新闻稿提到对齐 $140B 年度防务支出，并有潜力释放超过 $100B 节省——这类表述是愿景式，而非财务数据。没有披露 ARR 时，无法计算收入 / 估值倍数，形成关键尽调缺口。
