      - number: '8.3'
        title: 防务 AI 软件的公开与私有可比估值
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年，防务技术板块经历了前所未有的估值扩张。Anduril 最新一轮估值约 $61 billion；Helsing 作为欧洲领先防务 AI 公司，据报估值接近 $5.5
              billion；Shield AI 在 Series F 后约 $5.3 billion；Saronic 在自主海军系统领域进入独角兽行列。在这个背景下，Onebrief 的 $2.15 billion
              估值处于私有防务科技独角兽的中档，但在专注防务软件的公司里偏高。最有参考意义的公开可比仍是 Palantir Technologies：其市值约 $286 billion，TTM revenue 为 $5.2
              billion（截至 2026 年中，P/S ratio 约 55×）。Palantir 溢价反映了二十年的政府关系、经验证的规模化利润率（毛利率 80% 以上），以及加速增长的商业收入——这些基准
              Onebrief 尚未公开证明。私有可比组透明度更低：Anduril 的 $61 billion 估值由庞大的硬件和自主业务支撑，估计收入超过 $1 billion，暗示倍数在 40–60× 区间。Helsing
              和 Shield AI 处于更早收入阶段，R&D 投入重，但披露的财务颗粒度低于 Palantir。全行业模式很清楚：投资人愿意为在盟国军队内部扩大采用的防务 AI
              公司支付平台转型倍数；但溢价与已披露收入规模、单一客户之外的多元化，以及盈利路径可见度相关。Onebrief 的独特之处在于采用指标强（嵌入四个最大 OPLAN 中的三个、覆盖多个 combatant
              commands），但财务证明点完全私有；相对于估值，它是可比组里最不透明的公司。
            claimRefs:
              - CV017
              - CV018
              - CV019
