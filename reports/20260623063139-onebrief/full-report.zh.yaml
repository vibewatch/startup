      - number: '8.5'
        title: 估值立场与关键尽调要求
        blocks:
          - type: paragraph
            body: >-
              公开证据的权重支持偏拉伸的估值立场。$2.15 billion 估值从战略角度可以辩护——Onebrief 占据军事规划软件中的真实空白地带，在 DoD
              最关键作战计划中形成自下而上采用，并组建了愿意以溢价为增长可选性定价的高质量投资人团。但公开证据无法确认该价格是否由底层单位经济支撑。收入、利润率、合同积压、净留存和客户级经济性均未披露，外部投资人无法独立验证倍数、与基准比较，或通过
              preference-stack 分析评估下行保护。按概率权重汇总情景，公允价值区间约为 $1.2–3.5 billion，中枢估计接近 $1.8–2.2 billion——这说明 Series D
              估值处在可辩护区间的上沿，而不是明显落在区间内部。建议为 research-more：鉴于护城河特征和采用证据，战略兴趣成立；但若在当前估值下承销，且没有收入披露、利润率可见度和 cap-table
              透明度，投资人会暴露于一个已出现倍数压缩信号行业中的非对称下行。关键尽调要求包括：确认 ARR 和增长率、毛利率与盈利路径、preference-stack 和 liquidation-waterfall
              条款、Battle Road 整合里程碑，以及客户级合同经济性。没有这些披露，仅凭公开证据无法解决入场纪律问题。
