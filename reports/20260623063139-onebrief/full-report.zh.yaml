      - number: '2.5'
        title: 市场测算不确定性与矛盾估算
        blocks:
          - type: paragraph
            body: >-
              市场测算不确定性，是投资人评估防务 C2 软件时的重大分析风险。MarketsandMarkets 对美国 JADC2 的估算（2023 年 $1.2B 至 2030 年
              $8.6B）意味着小基数上的爆发式增长；Emergen Research 的估算（2024 年 $6.5B 至 2034 年
              $15.2B）则显示当前市场更大、增长更慢。两者并非通常意义上的矛盾——它们反映的是不同范围定义（狭义软件 vs. 包含硬件和服务的更宽技术栈）。但如果投资人不理解定义边界，就拿某一个估算验证
              TAM，会严重误判机会。全球 JADC2 数字（2032 年 $29.45B）包含非美国支出，而主要部署在美国机密网络上的平台未必能立即触达。最宽的 C2 系统估算（2034 年
              $73.33B）包含完全落在军事规划软件领域之外的硬件和民用应用。自下而上的 SOM 估算必须考虑潜在司令部级部署的实际数量、每个部署的预算权限，以及在保密约束和现有竞争下的现实渗透率。GAO 发现 DoD
              缺乏追踪 CJADC2 投资的框架，这又引入额外不确定性：没有清晰投资追踪时，依赖已宣布项目预算的市场模型，可能重复计算，也可能完全漏掉那些增加或减少可寻址机会的项目。
            claimRefs:
              - CM032
              - CM033
              - CM034
              - CM035
              - CM009
              - CM010
