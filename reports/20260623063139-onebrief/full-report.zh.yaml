      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              防务规划软件市场的买方—用户—付款方结构很特殊，由军事采办权限塑造。用户是作战司令部、军种组成司令部和联合参谋部中每天执行规划流程的 J-staff 军官（J3 作战、J5 计划、J35
              未来作战）。买方是这些司令部内评估和选择工具的项目办公室与采办机构，常常通过非传统采购机制行动。付款方是预算所有者：作战司令部的运营维护账户、军种级研发资金，以及资助 C2
              现代化的联合项目办公室。采购路径包括用于快速原型的 Other Transaction Authorities（OTAs）、Small Business Innovation Research（SBIR）奖项、由
              Chief Digital and AI Office 管理的 Tradewinds Solutions Marketplace（截至 2026 年 2 月促成超过 $3.26B 奖项，平均采购周期 51
              天），以及支持迭代交付的 Software Acquisition Pathway。盟国国防部（UK、Australia、NATO
              成员）形成扩大的买方池，各自拥有预算权限；但互操作要求会偏好已经接入美国机密网络的平台。这一区分很关键，因为预算权限是分散的：没有单一项目办公室控制所有潜在支出，这既带来机会（多个切入口），也带来摩擦（需求信号碎片化）。
