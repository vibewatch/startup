      - number: '3.2'
        title: 直接竞争者与平台捆绑者
        blocks:
          - type: paragraph
            body: >-
              Palantir 是 Onebrief 最强的直接竞争者。凭借 Maven Smart System 合同（2024-2025 年由美国陆军授予，多阶段总值约 $480M），Palantir
              已在各作战司令部扎根为主要的数据融合和决策支持层。Gotham 为防务和情报分析师专门打造，AIP 则把 LLM 驱动的推理扩展到作战流程。Palantir 2025 年收入超过 $2.8B，防务约占总业务
              55%。关键问题是 Palantir 是否会把 Maven 向下延伸到协同规划，直接重叠 Onebrief 的 MDMP 流程。Anduril 在 2026 年 1 月融资后估值约 $61B，通过 Lattice
              OS 以不同方式切入：这是一个实时指挥控制网格，用于自主资产编排。虽然 Lattice 聚焦传感器到射手的杀伤链自动化，而不是参谋规划，但 Anduril
              成为防务操作系统的公开野心，带来长期碰撞可能。Anduril 累计融资超过 $6B，接近 Onebrief 约 $303M 累计融资的 20 倍。Shield AI（Hivemind 自主平台，估值约
              ~$5B）和 Helsing（欧洲 AI 防务冠军，估值约 ~€5B）是相邻威胁，随着平台成熟，可能扩展进规划流程。资本不对称非常刺眼：Palantir $60B+ 市值和 Anduril $61B
              估值，都远高于 Onebrief 的 $2.15B，引出一个问题：点状方案玩家能否在捆绑式平台经济面前保持独立。
