  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入 / 排除支出
        blocks:
          - type: paragraph
            body: >-
              协同军事规划与决策支持软件的相关市场，涵盖指挥控制（C2）软件平台、作战规划工具、兵棋推演和仿真引擎，以及面向联合作战和联合行动的 AI 决策支持。纳入支出包括软件许可、SaaS
              订阅、集成服务，以及作战和战略层级军事参谋使用数字规划平台所需的培训。硬件平台（雷达、卫星、武器）、纯弹药和独立自治系统被排除，因为它们对应不同预算科目和采办权限。该市场要替代的现状方案包括 PowerPoint
              式简报流程、老旧 Command Post of the Future（CPOF）终端、Global Command and Control
              System-Joint（GCCS-J），以及多数司令部仍占主导的手工参谋流程。相邻领域包括更广义的
              C4ISR、信号情报平台和网络作战工具；它们共享预算所有者，但解决的是不同作战问题。市场边界影响测算，因为分析师报告从狭义 JADC2 专用软件，到包含硬件、服务和网络基础设施的广义 C2
              系统，口径差异很大。投资人必须弄清每个估算背后的定义，避免把 $11B 的软件中心 TAM 与 $39B 的综合系统市场混为一谈。
