chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品
        blocks:
          - type: paragraph
            body: >-
              Onebrief 是一个云原生军事规划与参谋协作平台，总部位于 Hawaii 的 Honolulu。公司 2019 年由 Grant Demaree 和 Rafael "Rafa" Pereira 在 Texas
              的 Austin 创立，两人均为 Y Combinator 2020 年夏季批次毕业生。Demaree 作为美国陆军军官部署期间，看见军事规划仍靠 PowerPoint 幻灯片、Word
              文档和割裂的邮件线程推进，由此构思出这款产品。平台用实时、基于 Web 的协作工作区替代军事决策流程（MDMP）和联合作战规划流程（JPP），核心包括自动更新的规划产物「cards」、提供智能体 AI 支持的
              AI Assist 能力，以及 2026 年 1 月收购 Battle Road Digital 后获得的集成兵棋推演和仿真工具。Onebrief 运行在 SIPR、NIPR、JWICS
              等机密网络上，定位为公司所称「超人类军事指挥」的操作系统。2026 年 5 月，Second Front Systems 被指定为 Onebrief 首选部署伙伴，可通过已获 IL5、IL6 和 Top
              Secret 环境授权的 Game Warden 平台快速部署。
