      - number: '7.3'
        title: 客户集中与涉密采购不透明
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的客户基础集中在少数美国 combatant commands 和 Joint Staff。公司声称已部署进四个最大 DoD 作战计划中的三个，并覆盖三个最大的 Geographic
              Combatant
              Commands（INDOPACOM、EUCOM、CENTCOM），但合同金额、上限、续约条款和期权期等细节仍为涉密或未披露。这种不透明使外界无法独立评估收入耐久性、合同积压和重新竞标风险。客户集中度制造生存级暴露：单个
              GCC 关系一旦丢失——例如因 protest、领导层更替，或平台授权转向由主承包商捆绑的替代方案——都可能实质损害收入。涉密采购环境还意味着，DoD IT 中常见的 bid protests
              可能延迟或推翻授标，且在解决前没有公开可见度。GAO 支持约 12–15% 已提交 bid protests，涉密合同还面临额外程序复杂性。此外，combatant-command
              预算并非隔离资金池；它们要在防务 topline 内与硬件和部队结构优先事项竞争。任何向动能平台的再平衡（如战时补充拨款中所见），都可能挤出支撑 Onebrief 合同的软件资金线。
