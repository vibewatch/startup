            body: >-
              Onebrief 在 DoD 内的采用轨迹呈现鲜明的自下而上模式。初级军官先发现工具，将其用于作战规划，并制造出最终传导到高级领导层的组织需求。CEO Grant Demaree
              曾描述，最早用户靠非常规方式获得：离线的 Navy 批准笔记本电脑、政府信用卡采购；之后公司才拿到正式合同工具。平台增长指标非常醒目：Onebrief 称收入同比增长 4x，使用小时数年化增幅据报达到
              19,600%；但公司仍为私有状态，外界无法独立验证这些数字。部署足迹覆盖所有主要涉密网络：SIPR（Secret）、NIPR（Unclassified）和 JWICS（Top Secret/SCI），并通过
              Second Front 的 Game Warden 平台确认了 Impact Level 5、IL6 和 Top Secret 授权。2026 年 5 月迁移至 DAF CLOUDworks 后，Secret
