        title: 财务不透明与估值风险
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的估值轨迹从 $650M（Series C，2025 年 1 月）升至 $1.1B（C 轮扩展，2025 年 6 月），再到 $2.15B（Series D，2026 年 1
              月），十二个月内跳升 3.3×，却没有披露任何收入、ARR、毛利率或单位经济数据。公司处于 private-undisclosed
              状态，投资人只能基于采用叙事和涉密管线说法来给股权定价，而这些说法无法独立验证。这给后期参与者制造了严重信息不对称。防务科技创投估值普遍受到市场分析师质疑：政府合同收入很少能按此类倍数隐含的速度增长，行业内多数退出仍缺乏流动性。S&P
              Global 数据显示，虽然 2025–2026 年 VC 对防务科技的投资激增，M&A 活动却放缓，减少了独角兽级防务初创公司的现实退出路径库存。3.3× 跳升还意味着，如果公司无法在 24–36
              个月内长进估值，快速稀释风险会抬头；平轮或下轮将伤害员工留存（期权缩水），并释放市场疲弱信号。Onebrief 未披露盈利路径时间表、烧钱速度或现金 runway，投资人只能依赖内部人士说法。
