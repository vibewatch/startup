      - number: '3.3'
        title: 传统主承包商与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              防务主承包商——Lockheed Martin、RTX（Raytheon）和 Northrop Grumman——在指挥控制系统中维持了数十年的在位位置。Lockheed 的 C4ISR 组合包括 Command
              Post of the Future（CPOF，最初 2005 年部署），并参与 GCCS-J（Global Command and Control System – Joint）。Northrop
              Grumman 运营 IBCS（Integrated Battle Command System）以及联合任务规划基础设施的大部分。RTX
              在导弹防御和空中作战中心维持作战管理系统。这些系统为工业时代的作战节奏而设计，出了名难改，但它们嵌在列装项目预算中，拥有数十年保障合同。主承包商合计每年防务收入超过
              $180B，并雇用数十万持密人员——这是初创公司无法正面匹敌的资源优势。不过，它们的弱点在架构：老旧 C2 系统单体化，保密等级之间割裂，并且需要数月培训。按安装基础看，PowerPoint/SharePoint
              现状可能是 Onebrief 最重要的竞争者。军事参谋几十年来一直用幻灯片做作战规划。从 PowerPoint
              切换的成本不是财务性的，而是心理和流程性的——参谋军官已经熟悉这套工具，在部署周期中改变作战流程会带来风险。Onebrief 面对现状的优势在于速度和降错：协同实时编辑、规划产品之间自动更新交叉引用、AI
              辅助行动方案开发，可以把数周参谋工作压缩到数小时。
