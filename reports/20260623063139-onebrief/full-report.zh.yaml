companyProfile:
  summary: >-
    Onebrief 是一家总部位于 Honolulu 的防务科技公司，面向美国军方和盟军司令部，打造 AI 驱动的作战规划与参谋协作平台。公司 2019 年由美国陆军退伍军人 Grant Demaree 和工程师 Rafael
    "Rafa" Pereira 在 Austin 创立，把军事决策流程（MDMP）和联合作战规划流程（JPP）数字化，用可在机密网络上运行的实时联网规划工作区，替代以 PowerPoint 和文档为中心的流程。2026 年 1
    月，公司以 $2.15B 投后估值完成 $200M Series D，并收购兵棋推演公司 Battle Road Digital；Onebrief 因而被定位为新兴的「指挥操作系统」，但财务基本面仍未披露。
