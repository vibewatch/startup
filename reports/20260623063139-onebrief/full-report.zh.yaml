      - number: '7.5'
        title: 技术与 AI 可靠性风险
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的 AI Assist 功能在军事规划工作流中提供 agentic AI 能力；该领域一旦出错，可能造成生死后果。GAO 的 AI Accountability
              Framework（GAO-21-519SP）规定，联邦机构在决策支持系统中部署 AI 时，必须维持稳健治理、监控和人工监督机制。DoD Responsible AI Strategy 进一步要求用于作战规划的
              AI 系统可追溯、可靠、可治理。若 Onebrief 的 AI 输出影响行动方案选择、兵力分配或目标优先级（即便是间接影响），任何幻觉、偏见或数据质量故障都可能沿规划链灾难性扩散。涉密网络上 AI 系统的
              Authority to Operate（ATO）负担很重——需要持续监控、渗透测试和再授权周期，吃掉工程资源并拖慢功能发布。GAO 2024 年对联邦 AI 落地的审查发现，多数机构尚未完成 AI
              系统关键治理要求，这提高了 Onebrief 证明合规的门槛。此外，在涉密环境中依赖商业 AI 模型（很可能基于 LLM）会引入供应链风险：模型更新、微调流水线和推理基础设施都必须在 air-gapped
              网络内运行，增加成本并拉长开发周期。
            claimRefs:
