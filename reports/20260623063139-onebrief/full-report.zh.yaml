  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的客户基础高度偏向美国 Department of Defense 组织，盟国军事司令部是第二层存在。主要买方包括 Geographic Combatant
              Commands（GCCs）、Joint Staff、Service Component Commands，以及 Air Combat Command 等 Major Commands。Onebrief
              已公开确认，至少有美国七个 geographic combatant commands 中的四个、以及三个最大的 GCC 在使用平台；但受密级限制，具体司令部名称未公开。公司最早的牵引力来自聚焦
              Indo-Pacific 的单位，这与 CEO Grant Demaree 的经历和公司 Honolulu 总部位置一致。美国军队之外，盟国军事组织正在成为增长中的客群，但具体盟国客户仍未披露。DoD
              采购里的买方、用户和付款方结构分层：program offices 和 command J-staffs 掌握预算，战略、战役和战术层级的规划人员才是真正用户。采购工具包括 Other Transaction
              Authorities（OTAs）、SBIR 奖项，以及 Air Combat Command 的 EMC3 奖项等直接合同机制。Second Front Systems
              是首选部署伙伴，承担安全托管渠道角色，而不是客户。截至 2026 年中，收入似乎高度偏向 DoD，尚未披露商业或非防务客户。
