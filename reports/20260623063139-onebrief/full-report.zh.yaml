        - 平台整合可能侵蚀空白市场优势
        - 客户访谈；Joint Staff 采用情况审计
    notes: 每个尽调问题都对应一个打破投资逻辑的触发项：若任一单项无法在悲观情景阈值或以上得到确认，立场应下调为“回避”。
