  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 从 Series C 到 Series D 的融资节奏与定价轨迹
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的估值轨迹在大约十二个月内压缩了三次定价事件；对私有防务技术公司来说，这个节奏异常快。Series C 于 2025 年 1 月完成，post-money 为 $650 million，由
              General Catalyst 和 Insight Partners 领投，新增股权 $70 million。五个月内，Battery Ventures 领投 $20 million 扩展轮，headline
              估值几乎翻倍至 $1.1 billion，并在 2025 年 6 月确立独角兽身份。2026 年 1 月，Battery Ventures 和 Sapphire Ventures 共同领投 $200
              million Series D，估值 $2.15 billion，Salesforce Ventures 和早期支持者参投，节奏进一步加速。公司累计融资超过 $300 million，从 2020 年 Y
              Combinator 起，经历 seed、Series A、Series B 和最近三轮。Series C 到 Series D 在单一日历年内跳升
              3.3×，按历史私募市场标准很激进，意味着公司要么收入异常加速，要么投资人愿意为防务规划软件中的战略稀缺性付费。鉴于收入数字仍未披露，后者解释权重很高。每一轮都引入新的机构资本——General
              Catalyst、Insight Partners、Battery Ventures、Sapphire Ventures、Salesforce Ventures——让 cap table
              更多元，也提高了当前入场价格下的回报门槛。资金支持了产品扩张、员工数增长至估计 500 人，并在 Series D 同日收购 Battle Road
              Digital（兵棋仿真）；这表明公司处于由投资人信念而非已证明现金流支撑的激进增长姿态。相对 $2.15 billion 估值，已融 $303 million 暗示仅 D 轮就约有 14% 的合计
              primary issuance；但实际稀释取决于未披露的优先权条款、期权池扩张，以及 $200 million 总额中包含的 secondary 成分。
