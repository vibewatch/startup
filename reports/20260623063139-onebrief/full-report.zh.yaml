      - number: '5.2'
        title: 产品能力与功能架构
        blocks:
          - type: paragraph
            body: >-
              Onebrief 平台围绕三根支柱组织能力。第一，协同规划提供核心流程替代：把 MDMP 和 JPP
              输出结构化为相互链接、可持续更新的活文档，并随上游输入变化实时更新。参谋军官在平台内构建行动方案、同步矩阵和执行命令，而不是在割裂工具之间手工拼装。第二，AI Assist 提供智能体 AI
              能力，加速参谋工作。AI 协同规划员帮助生成规划产物、总结情报、起草参谋估计，并识别行动方案中的缺口。CTO Cory Ondrejka 正在领导这些 AI 驱动支持能力的扩展，他带来在 Google 和
              Meta 产品中应用 AI 的经验。AI 层设计为增强而非替代人类规划人员，在保留指挥官监督的同时，减少常规分析和起草任务所需时间。第三，2026 年 1 月收购 Battle Road Digital
              后加入的兵棋推演与仿真，让指挥官在投入兵力前，能够用模拟对手行动对计划进行压力测试。Battle Road
              把一流游戏技术用于防务挑战，提供连接仿真和实战行动的实时作战决策支持。整合后形成一个统一环境，军事领导者可在一个系统内完成规划、仿真和决策，而不必在割裂的规划和兵棋工具之间切换上下文。
