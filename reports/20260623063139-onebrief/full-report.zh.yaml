        title: 展示要点
        blocks:
          - type: callout
            title: 资本不对称带来捆绑威胁
            body: >-
              Palantir（$60B+ 市值）和 Anduril（约 $61B 估值）的资本基础各自是 Onebrief 的 25-30
              倍。两家公司都公开表达平台野心，可能把规划流程作为捆绑功能吞入平台，而不是作为独立产品销售，从而削弱 Onebrief 在联合客户中的付费意愿。
