      - number: '6.4'
        title: 留存、耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开证据没有披露 Onebrief 的
              NRR、GRR、流失率、合同续约率或客户满意度指标。公司私有、客户涉密，使这些指标无法独立评估。不过，几个结构性信号指向留存动态：军事规划工具一旦嵌入作战工作流，就会形成高切换成本；若已进入战争计划和日常战斗节奏，切换成本更高。平台部署在涉密网络上并需要
              ATO，意味着竞争对手一旦想替换已安装的 Onebrief，就要面对多年授权周期。Onebrief 的 land-and-expand 动作很清楚：从单个单位采用扩展到全司令部铺开（ACC
              案例），再从单网络部署走向多网络部署。扩张方向包括更多 combatant commands、借助离线能力进入战术单位层级、盟国军事采用，以及兵棋和仿真等相邻用例（通过收购 Battle Road
              Digital）。客户集中度风险是该客户画像的首要担忧。收入似乎几乎完全依赖美国 DoD 拨款，显著暴露于 continuing resolutions、政府停摆和预算 sequestration。公司自己的
              Series B 公告也明确承认这一风险，称融资部分是为了对冲全年 Continuing Resolution 情景。一名退役三星将领、Pentagon Joint AI Center
              前负责人公开警告过防务科技里的循环融资动态，以及脱离商业产出的估值。110x 收入倍数（据 Implicator.ai 对约 $19M 收入与 $2.15B 估值的分析）迫使公司把试点阶段采用转化为企业级
              Programs of Record。Pentagon 采购周期并不像企业软件销售，从 OTA 资助试点走到 indefinite-delivery 生产合同，仍是 Onebrief 最核心的商业挑战。
