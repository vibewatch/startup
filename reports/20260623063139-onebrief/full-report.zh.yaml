          - type: callout
            title: 现状（PowerPoint）仍是最大竞争力量
            body: 尽管技术竞争者融资充足，Onebrief 在多数新客户获取中必须替代的功能基线，仍是基于 PowerPoint 的手工 MDMP。零边际成本和普遍熟悉度，让现状成为最难规模化消灭的竞争者。
            calloutType: insight
            claimRefs:
