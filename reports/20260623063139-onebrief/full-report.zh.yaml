      - number: '3.4'
        title: Onebrief 护城河评估与差异化耐久性
        blocks:
          - type: paragraph
            body: >-
              Onebrief 的竞争护城河建立在五个相互咬合的因素上：（1）围绕 MDMP 和 JPP 条令打造、而非从商业分析工具改造而来的规划人员原生流程设计；（2）部署在 SIPR、NIPR 和 JWICS
              机密网络上——这道合规和认证壁垒需要多年才能打穿，多数商业软件公司根本不会尝试；（3）深度嵌入 DoD 四个最大作战计划（OPLANs）中的三个，形成任务关键切换成本；（4）创始人的领域经验——CEO Grant
              Demaree 在 Iraq 作为美国陆军军官部署期间构思产品；（5）2026 年 1 月收购 Battle Road Digital，补入兵棋推演和仿真能力，把规划流程延伸到执行演练。切换成本尤其强，因为
              Onebrief 的规划产物会成为权威作战记录——一个 OPLAN 一旦在 Onebrief 中建成，迁出就需要重建整个作战计划。不过，竞争耐久性面临三类结构性威胁。第一，Palantir 和 Anduril
              能以近零边际成本，把规划功能捆绑进现有平台合同，侵蚀客户为独立工具付费的意愿。第二，传统主承包商控制集成预算——如果 Lockheed 或 Northrop 给 GCCS-J 或 IBCS 加上现代 UX
              层，它们可在既有列装项目内提供规划升级。第三，DoD 采购惯性意味着 Onebrief 必须在各作战司令部持续赢得新授权，而不能依赖全企业范围授权，增长执行负担很重。
            claimRefs:
              - CP023
