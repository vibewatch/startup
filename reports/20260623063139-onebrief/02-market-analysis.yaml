  - id: sizing-gaps-contradictions
    title: Sizing Uncertainties and Contradictory Estimates
    body: >-
      Market-sizing uncertainty is a material analytical risk for investors evaluating defense C2 software. The MarketsandMarkets U.S. JADC2 estimate ($1.2B in 2023 to $8.6B by 2030) implies explosive growth from a small base, while the Emergen Research estimate ($6.5B in 2024 to $15.2B by 2034) suggests a much larger current market growing more slowly. These are not contradictory in the usual sense—they reflect different scope definitions (narrow software vs. broader technology stack including hardware and services). However, investors using one estimate as TAM validation without understanding the definitional boundary would materially misjudge the opportunity. The global JADC2 figure ($29.45B by 2032) includes non-U.S. spending that may not be immediately addressable by a platform primarily deployed on U.S. classified networks. The broadest C2 systems estimate ($73.33B by 2034) includes hardware and civilian applications entirely outside the military planning software domain. A bottoms-up SOM estimate must account for the actual number of potential command-level deployments, budget authority per deployment, and realistic penetration rates given classification constraints and incumbent competition. The GAO's finding that DoD lacks a framework to track CJADC2 investments introduces additional uncertainty: without clear investment tracking, market-sizing models that rely on announced program budgets may double-count or miss entirely programs that contribute to or detract from the addressable opportunity.
    claimRefs:
      - CM032
      - CM033
      - CM034
      - CM035
      - CM009
