callouts:
  - calloutType: insight
    title: Market Definition Drives Valuation Logic
    body: >-
      The 5-7x spread between the narrowest ($6.5B U.S. JADC2) and broadest ($39.27B global C2) market estimates means that valuation multiples are highly sensitive to which TAM definition an investor accepts. A platform vendor claiming to address the full $39B market would need to demonstrate hardware and civilian capabilities far beyond planning software.
    claimRefs:
      - CM009
      - CM011
      - CM033
  - calloutType: risk
    title: Budget Instability Creates Procurement Uncertainty
    body: >-
      The FY2026 budget cycle produced a 43-day government shutdown and subsequent CR, delaying contract awards and forcing the Pentagon to divert unspent R&D and shipbuilding funds to cover troop pay. GAO found that about half of acquisition programs experience schedule effects from CRs, meaning defense software vendors face recurring annual risk of delayed revenue recognition.
    claimRefs:
      - CM027
      - CM028
      - CM029
  - calloutType: risk
    title: CJADC2 Governance Gap May Slow Market Materialization
    body: >-
      The GAO's April 2025 finding that DoD lacks a unified CJADC2 investment framework introduces structural risk: without coordinated spending, the theoretical $11-15B market may materialize more slowly than forecasts suggest, with duplicative investments and scattered adoption rather than consolidated platform demand.
    claimRefs:
      - CM024
      - CM025
      - CM034
  - calloutType: strength
    title: Multiple Procurement Fast-Lanes Exist
    body: >-
      The Tradewinds marketplace ($3.26B awarded, 51-day average PALT, 88% to non-traditional vendors), OTAs, and the Software Acquisition Pathway create viable fast-lane alternatives to traditional defense procurement, reducing the cycle time for a qualified software vendor to reach contract award.
    claimRefs:
      - CM017
      - CM022
