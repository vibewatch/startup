chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The military planning and decision-support software market sits at the intersection of three sizing lenses: a narrow JADC2/CJADC2 technology market (~$11.46B globally in 2026, growing to ~$29.45B by 2032 at ~16.9% CAGR), a U.S.-specific JADC2 segment ($1.2B in 2023 projected to $8.6B by 2030 at 31.7% CAGR), and the broader command-and-control systems market (~$39.27B in 2026, ~$73.33B by 2034 at 8.1% CAGR). Growth is driven by great-power competition, software modernization mandates, COTS acquisition reform, and AI adoption, but constrained by fragmented implementation (per GAO findings), classification barriers, continuing-resolution budget disruptions, and incumbent switching costs from legacy CPOF/GCCS/PowerPoint workflows.
sections:
  - id: market-boundary
    title: Market Boundary and Included/Excluded Spend
    body: >-
      The relevant market for collaborative military planning and decision-support software encompasses command-and-control (C2) software platforms, operational planning tools, wargaming and simulation engines, and AI-enabled decision support for joint and combined operations. Included spend covers software licenses, SaaS subscriptions, integration services, and training for digital planning platforms used by military staffs at the operational and strategic levels. Hardware platforms (radars, satellites, weapons), pure munitions, and standalone autonomy systems are excluded because they serve different budget lines and acquisition authorities. The status-quo substitutes that this market displaces include PowerPoint-based briefing workflows, legacy Command Post of the Future (CPOF) terminals, the Global Command and Control System-Joint (GCCS-J), and manual staff processes that remain dominant across most headquarters. Adjacencies include broader C4ISR, signals intelligence platforms, and cyber operations tools, which share budget owners but address different operational problems. The market boundary matters for sizing because analyst reports range from narrow JADC2-specific software to broad C2 systems that include hardware, services, and networking infrastructure. Investors must understand which definition underpins each estimate to avoid conflating a $11B software-centric TAM with a $39B inclusive systems market.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001
    figureRefs:
      - FM003
  - id: market-sizing
    title: Market Sizing with Multiple Lenses
    body: >-
      No single published estimate captures the addressable market for military planning software precisely, so a multi-lens approach is necessary. The narrowest credible lens is the U.S. JADC2 technology market, which MarketsandMarkets sizes at $1.2B in 2023 growing to $8.6B by 2030 at a 31.7% CAGR, driven by the DoD's need for integrated cross-domain command and control. Emergen Research provides an alternative U.S. JADC2 estimate of $6.5B in 2024 projected to $15.2B by 2034 at 8.8% CAGR, using a broader definition that includes more hardware and services. At the global JADC2 level, 360iResearch and GII Research converge on $9.84B in 2025, $11.46B in 2026, and $29.45B by 2032 at 16.94% CAGR, encompassing hardware, software, and services across all participating nations. The broadest lens is Fortune Business Insights' command-and-control systems market at $39.27B in 2026 growing to $73.33B by 2034 at 8.1% CAGR, which includes fixed and mobile C2 infrastructure, networking, and integration services across defense and civilian domains. The spread between these estimates is analytically significant: it reflects different scope boundaries rather than disagreement about the same quantity. For a pure-software planning platform, the practical serviceable addressable market (SAM) is best approximated by the U.S. JADC2 software component plus allied equivalents, likely in the $3-6B range by 2026, while the serviceable obtainable market (SOM) for any single vendor is further constrained by classification requirements, procurement vehicles, and competitive dynamics.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
