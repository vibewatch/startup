  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      The defense planning software market has a distinctive buyer-user-payer structure shaped by military acquisition authorities. Users are J-staff officers (J3 Operations, J5 Plans, J35 Future Operations) at combatant commands, service component commands, and the Joint Staff who execute planning processes daily. Buyers are program offices and acquisition authorities within these commands who evaluate and select tools, often through non-traditional procurement mechanisms. Payers are the budget owners: combatant command operations and maintenance accounts, service-level research and development funds, and joint program offices that fund C2 modernization. Procurement paths include Other Transaction Authorities (OTAs) for rapid prototyping, Small Business Innovation Research (SBIR) awards, the Tradewinds Solutions Marketplace managed by the Chief Digital and AI Office (which has facilitated over $3.26B in awards as of February 2026 with an average 51-day procurement lead time), and the Software Acquisition Pathway for iterative delivery. Allied Ministries of Defence (UK, Australia, NATO members) represent an expanding buyer pool with their own budget authorities but interoperability requirements that favor platforms already integrated into U.S. classified networks. The distinction matters because budget authority is dispersed: no single program office controls all potential spend, creating both opportunity (multiple entry points) and friction (fragmented demand signals).
    claimRefs:
      - CM014
      - CM015
      - CM016
      - CM017
