  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      The strongest growth driver is great-power competition and the associated urgency to compress decision cycles. The DoD's CJADC2 initiative explicitly seeks to transition from manual "swivel chair" analysis to integrated data-sharing models, creating structural demand for software platforms that can fuse planning, intelligence, and execution. The DoD Software Modernization Implementation Plan for FY25-26 codifies this urgency by mandating modern software practices, continuous authorization to operate (cATO), and commercial SaaS adoption at scale. The FY2026 NDAA reinforces these trends through acquisition reform provisions including the FORGED Act, which prioritizes commercial procurement. AI adoption is accelerating demand further, as military planning increasingly requires real-time data fusion and predictive analytics that legacy tools cannot provide. Allied interoperability requirements amplify the market, since coalition operations demand shared planning platforms across classification boundaries. However, significant constraints persist. The GAO's April 2025 CJADC2 assessment found that six years of effort have produced no unified framework for guiding investments or measuring progress, with military services pursuing projects largely in isolation. Overly restrictive data classification remains a significant hindrance to sharing command and control data. The FY2026 budget cycle demonstrated these risks concretely: a 43-day government shutdown starting October 2025, followed by a continuing resolution through January 2026, delayed contract awards and caused hundreds of thousands of DoD civilian furloughs. The GAO found that about half of acquisition programs experienced schedule delays due to CRs, with increased costs and administrative burdens. Switching costs from entrenched legacy systems (CPOF, GCCS-J, PowerPoint) and the requirement for ATO certification on classified networks create additional adoption friction. Budget uncertainty and the diffuse nature of C2 investment authority mean that even well-positioned vendors face protracted sales cycles and unpredictable procurement timelines.
    claimRefs:
      - CM020
      - CM021
      - CM022
      - CM023
