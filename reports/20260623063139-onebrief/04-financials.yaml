chapter:
  number: 4
  title: Financials
  summary: >-
    Onebrief has raised ~$303M across five rounds, reaching a $2.15B post-money valuation by January 2026 — a 3.3× markup in 12 months. The capital access is exceptional for a defense-software company, but revenue, ARR, burn, and margin remain fully undisclosed, making fundamental underwriting impossible on public evidence alone. USASpending obligations confirm real but modest visible government revenue (~$16M+), while the classified nature of most customers obscures the bulk of the commercial relationship.
sections:
  - id: financing-history
    title: Financing history and capital structure
    body: >-
      Onebrief's financing trajectory demonstrates accelerating investor conviction. The company entered Y Combinator's Summer 2020 batch, raised a seed round, then a Series A and Series B (led by Human Capital in 2024), bringing total pre-Series-C capital to approximately $103 million according to Insight Partners. The Series C closed in January 2025 at $50 million led by General Catalyst and Insight Partners, with participation from Human Capital, Caffeinated Capital, and 9Yards Capital, setting the post-money valuation at $650 million. Just five months later, Battery Ventures led a $20 million Series C extension in June 2025, nearly doubling the valuation to $1.1 billion and conferring unicorn status. The cadence accelerated further with the Series D in January 2026: $200 million (primary and secondary) led by Battery Ventures and Sapphire Ventures, with participation from Salesforce Ventures, General Catalyst, and Insight Partners, at a $2.15 billion post-money valuation. The Series D's inclusion of a secondary component indicates early-employee and early-investor liquidity — a signal of institutional maturity but also of capital recycling ahead of any public-market event. Total lifetime capital raised stands at approximately $303 million. The 3.3× valuation step-up from $650 million to $2.15 billion in 12 months is aggressive by any sector standard, though consistent with the broader defense-tech mega-round environment in 2025–2026 where median VC-backed defense startup valuations reached $146 million versus $42.8 million in 2024.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI038
    tableRefs:
      - TI001
    figureRefs:
      - FI001
      - FI002
  - id: investor-quality
    title: Investor roster and governance signals
    body: >-
      The investor syndicate reflects unusually deep defense-sector conviction. General Catalyst brings dedicated national-security practice (Lt. Gen. USAF Ret. Scott Howell, Paul Kwan), Insight Partners offers scale-stage SaaS operating infrastructure, Battery Ventures contributed growth-stage defense-tech pattern recognition (Michael Brown), and Sapphire Ventures entered at Series D with over $11 billion in AUM and enterprise software specialization. Salesforce Ventures' participation signals potential commercial CRM or platform partnership optionality. Board-level appointments reinforce credibility: former Acting Secretary of Defense Chris C. Miller and Lt. Gen. (Ret.) Lewis Craparotta (USMC, former I MEF commander and MarForPac) joined alongside the Series C. The investor syndicate is not merely financial — it is a customer-access and procurement-credibility layer. However, heavy insider participation across multiple rounds (General Catalyst, Insight, Battery each appearing in two or more rounds) raises the question of whether price discovery is truly arms-length or whether markup velocity reflects insider conviction recycled at favorable terms.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI039
    tableRefs:
      - TI002
  - id: revenue-and-unit-economics
    title: Revenue model, unit economics, and traction signals
    body: >-
      Onebrief monetizes through government software licenses deployed across classified networks (SIPR, NIPR, JWICS). The pricing model is not publicly disclosed, though defense SaaS contracts typically range from $1M–$50M+ in annual contract value depending on command scope and user count. The company has not disclosed ARR, revenue, gross margin, customer count, or net retention publicly. USASpending.gov records confirm at least $16 million in unclassified federal obligations to Onebrief Inc. from the Department of the Air Force and Department of the Army across multiple contract actions between 2022 and 2026 — including a $3.5M Air Force purchase order (August 2025), a $3.0M delivery order (December 2024), a $2.51M award (March 2026), and a $2.5M Army contract (September 2024). These represent only the unclassified component; the majority of Onebrief's deployment to Geographic Combatant Commands and the Joint Staff likely flows through classified funding channels invisible to public obligation databases. The company claims 19,600% annualized user-hour growth and 2× productivity gains, though these are engagement metrics, not revenue metrics. The Series C extension press release references a $140 billion annual defense spend alignment and potential to unlock over $100 billion in savings — framing that is aspirational rather than financial. Without disclosed ARR, the revenue-to-valuation multiple cannot be computed, creating a critical diligence gap.
