callouts:
  - calloutType: strength
    title: Exceptional capital access and investor quality
    body: >-
      Raising ~$303M with a 3.3× valuation step-up in 12 months, backed by General Catalyst, Insight Partners, Battery Ventures, and Sapphire Ventures, demonstrates that top-tier growth investors with defense expertise believe in Onebrief's trajectory. The syndicate's defense-specific credentials (former Acting SecDef on board, Lt. Gen. advisors) add procurement credibility.
    claimRefs:
      - CI001
      - CI007
      - CI011
      - CI014
  - calloutType: risk
    title: Revenue opacity makes valuation unverifiable
    body: >-
      With ARR, growth, margin, and burn all undisclosed, no external party can independently verify whether the $2.15B valuation is justified by fundamentals. The ~$16M in visible USASpending obligations represent less than 1% of the valuation, and while classified revenue likely accounts for much more, this opacity creates binary underwriting risk.
    claimRefs:
      - CI024
      - CI033
      - CI040
      - CI042
  - calloutType: risk
    title: Defense-tech valuation froth may limit exit optionality
    body: >-
      Strategic defense acquirers historically pay 3–5× revenue. If Onebrief's implied revenue multiple is 40–70×, a gap exists between VC entry price and realistic exit values. S&P Global notes M&A activity in defense tech has slowed even as VC funding surged, creating fewer near-term exit paths for highly priced private companies.
    claimRefs:
      - CI031
      - CI034
      - CI035
      - CI036
      - CI037
  - calloutType: recommendation
    title: Require management disclosure before underwriting
    body: >-
      The appropriate investor posture is not avoidance but conditioned engagement. Before committing capital at $2.15B, require disclosure of audited ARR, trailing growth rate, gross margin by cost category, customer concentration analysis (anonymized if classified), and 12-month cash-flow projection.
    claimRefs:
      - CI040
      - CI041
      - CI043
