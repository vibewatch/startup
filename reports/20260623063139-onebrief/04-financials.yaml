  - id: capital-adequacy
    title: Capital adequacy, burn, and runway assessment
    body: >-
      With $200 million raised in the Series D (January 2026) and an additional $90 million from the Series C rounds in 2025, Onebrief entered 2026 with substantial dry powder. However, because burn rate is undisclosed, runway cannot be computed. Proxies suggest the company is investing aggressively: the Battle Road Digital acquisition (announced same day as Series D) consumed some primary proceeds, the company reports hundreds of employees, and infrastructure supporting classified-network deployments across three security domains is capital-intensive. Employee growth of nearly 130% year-over-year was cited at Series C (January 2025), implying rapid headcount acceleration. Assuming a defense-software-company burn profile of $3M–$8M per month (a rough estimate based on headcount and infrastructure), the $200M primary component of Series D could support 25–67 months of runway — but without confirmation of burn, this is purely illustrative. The proceeds-use disclosure names AI Assist product expansion and wartime resiliency infrastructure, both recurring capital needs. The tender offer executed at Series C enabled early-employee liquidity, suggesting the company is managing retention through secondary rather than relying on near-term IPO. No debt, credit facilities, or project-finance obligations are publicly disclosed.
    claimRefs:
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
