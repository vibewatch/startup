callouts:
  - calloutType: risk
    title: Capital asymmetry creates bundling threat
    body: >-
      Palantir ($60B+ market cap) and Anduril (~$61B valuation) each have 25-30x Onebrief's capital
      base. Both companies have stated platform ambitions that could subsume planning workflows as a
      bundled feature rather than standalone product, potentially eroding Onebrief's willingness-to-pay
      among joint customers.
    claimRefs:
      - CP010
      - CP011
      - CP027
      - CP028
  - calloutType: strength
    title: Workflow-native design creates structural switching costs
    body: >-
      Onebrief's embedding in three of four largest OPLANs means migration requires reconstructing
      authoritative operational plans — a months-long process with operational-readiness risk that no
      commander would undertake voluntarily during a deployment cycle.
    claimRefs:
      - CP023
      - CP024
      - CP025
  - calloutType: insight
    title: Status quo (PowerPoint) remains the largest competitive force
    body: >-
      Despite well-funded technology competitors, the functional baseline Onebrief must displace in most
      new customer acquisitions remains PowerPoint-based manual MDMP. Zero marginal cost and universal
      familiarity make the status quo the hardest competitor to kill at scale.
    claimRefs:
      - CP019
      - CP020
      - CP021
