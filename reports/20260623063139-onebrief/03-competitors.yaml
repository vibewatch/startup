  - id: legacy-incumbents
    title: Legacy primes and status-quo alternatives
    body: >-
      The defense prime contractors — Lockheed Martin, RTX (Raytheon), and Northrop Grumman — maintain decades-long
      incumbent positions in command-and-control systems. Lockheed's C4ISR portfolio includes the Command Post of
      the Future (CPOF, originally fielded 2005) and contributions to GCCS-J (Global Command and Control System –
      Joint). Northrop Grumman operates IBCS (Integrated Battle Command System) and large portions of the joint
      mission-planning infrastructure. RTX maintains battle-management systems across missile defense and air
      operations centers. These systems were designed for industrial-era operational tempo and are notoriously
      difficult to modify, but they are embedded in program-of-record budgets with multi-decade sustainment
      contracts. The primes collectively generate over $180B in combined annual defense revenue and employ
      hundreds of thousands of cleared personnel — resource advantages no startup can match directly. However,
      their weakness is architectural: legacy C2 systems are monolithic, disconnected between classification
      levels, and require months of training. The PowerPoint/SharePoint status quo is arguably Onebrief's
      most important competitor by install base. Military staffs have used slide decks for operational planning
      for decades. The switching cost from PowerPoint is psychological and procedural rather than financial — staff
      officers already know the tool, and changing operational workflows during deployment cycles carries risk.
      Onebrief's advantage against the status quo is speed and error reduction: collaborative real-time editing,
      auto-updating cross-references between planning products, and AI-assisted course-of-action development
      collapse weeks of staff work into hours.
    claimRefs:
      - CP016
      - CP017
      - CP018
      - CP019
      - CP020
      - CP021
      - CP022
    tableRefs:
      - TP003
    figureRefs:
      - FP003
  - id: moat-and-differentiation
    title: Onebrief moat assessment and differentiation durability
    body: >-
      Onebrief's competitive moat rests on five interlocking factors: (1) planner-native workflow design built
      around MDMP and JPP doctrine rather than adapted from commercial analytics tools; (2) classified-network
      deployment on SIPR, NIPR, and JWICS — a compliance and accreditation barrier that takes years to achieve
      and that most commercial software companies never attempt; (3) deep embedding in three of the four largest
      DoD operational plans (OPLANs), creating mission-critical switching costs; (4) founder domain expertise —
      CEO Grant Demaree conceived the product while deployed as a U.S. Army officer in Iraq; and (5) the Battle
      Road Digital acquisition (January 2026), which adds wargaming and simulation capabilities that extend
      the planning workflow into execution rehearsal. The switching cost is particularly powerful because
      Onebrief's planning artifacts become the authoritative operational record — once an OPLAN is built
      in Onebrief, migrating away requires reconstructing the entire operational plan. However, competitive
      durability faces three structural threats. First, Palantir and Anduril can bundle planning features
      into existing platform contracts at near-zero marginal cost, eroding willingness-to-pay for a standalone
      tool. Second, legacy primes control the integration budgets — if Lockheed or Northrop add modern UX
      layers to GCCS-J or IBCS, they could offer planning upgrades within existing programs of record.
      Third, DoD procurement inertia means Onebrief must continually win new authorizations across
      combatant commands rather than relying on enterprise-wide mandates, making growth execution-intensive.
