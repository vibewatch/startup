chapter:
  number: 3
  title: Competitors
  summary: >-
    Onebrief faces a competitive landscape spanning well-capitalized defense-AI platforms (Palantir, Anduril),
    adjacent autonomy/decision-support startups (Shield AI, Helsing, Scale AI, Comand AI), legacy prime C2
    incumbents (Lockheed, RTX, Northrop), and the entrenched PowerPoint/CPOF status quo. Its moat rests on
    planner-native MDMP/JPP workflow depth, classified-network deployment, and embedded OPLAN switching costs,
    but faces bundling risk from better-capitalized rivals with broader platform plays.
sections:
  - id: landscape-overview
    title: Competitive landscape and category taxonomy
    body: >-
      Onebrief competes across a multi-layered defense planning and decision-support market. CB Insights identifies
      approximately 157 active competitors, of which 17 are well-funded. The competitive field segments into four
      categories: (1) defense-AI platform giants like Palantir (Gotham, AIP, Maven Smart System) and Anduril (Lattice OS),
      which approach planning as one module in a broader decision-superiority stack; (2) point-solution startups like
      Comand AI, Primer AI, and Hadean that tackle specific workflow sub-problems such as wargaming simulation or
      NLP-driven intelligence fusion; (3) legacy defense primes (Lockheed Martin, RTX/Raytheon, Northrop Grumman)
      whose incumbent C2 systems like CPOF, GCCS-J, and IBCS anchor decades of procurement relationships; and
      (4) the status-quo substitute — PowerPoint, Word, and SharePoint combined with manual MDMP processes that
      represent the functional baseline Onebrief must displace. The landscape is further complicated by European
      entrants like Helsing (valued at approximately €5B in 2025) and adjacent data-infrastructure players like
      Scale AI that are increasingly positioning for defense planning adjacencies. Understanding this taxonomy
      matters because Onebrief's direct competitive threat differs by category: platform bundlers compete on
      breadth and capital; point solutions compete on workflow specificity; primes compete on incumbency and
      switching cost; and the status quo competes on inertia and zero marginal cost.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: direct-competitors
    title: Direct competitors and platform bundlers
    body: >-
      Palantir represents Onebrief's most formidable direct competitor. With its Maven Smart System contract
      (awarded by the U.S. Army in 2024-2025, valued at approximately $480M over multiple phases), Palantir has
      entrenched itself as the primary data-fusion and decision-support layer across combatant commands. Gotham
      was purpose-built for defense and intelligence analysts, while AIP extends LLM-powered reasoning across
      operational workflows. Palantir's 2025 revenue exceeded $2.8B with defense accounting for roughly 55% of
      total business. The critical question is whether Palantir will extend Maven downstream into collaborative
      planning — directly overlapping with Onebrief's MDMP workflow. Anduril, valued at approximately $61B after
      its January 2026 funding round, approaches the problem differently through Lattice OS, a real-time
      command-and-control mesh designed for autonomous asset orchestration. While Lattice focuses on sensor-to-shooter
      kill-chain automation rather than staff planning, Anduril's stated ambition to become a defense operating
      system creates long-term collision potential. Anduril has raised over $6B in total capital — nearly 20x
      Onebrief's lifetime raise of approximately $303M. Shield AI (Hivemind autonomy platform, valued at ~$5B)
      and Helsing (European AI-defense champion, ~€5B valuation) represent adjacent threats that could expand
      into planning workflows as their platforms mature. The capital asymmetry is stark: Palantir's $60B+ market
      cap and Anduril's $61B valuation dwarf Onebrief's $2.15B, raising questions about whether a
      point-solution player can sustain independence against bundled platform economics.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
      - CP014
      - CP015
