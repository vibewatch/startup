- id: trust-security-risks
  title: Trust posture, security controls, and technical risks
  body: Onebrief's security posture relies heavily on its deployment partner Second Front Systems, whose Game Warden platform documents NIST 800-53
    compliance, maintains a zero Critical/High CVE posture, and provides 24/7 incident response and continuous monitoring. The platform operates
    on accredited classified networks (SIPR, NIPR, JWICS) indicating it has obtained or is operating under existing Authorities to Operate. However,
    public documentation of Onebrief's own security architecture, data governance, and software assurance practices is limited. There are no public
    status pages, no disclosed penetration testing results, no published security architecture diagrams, and no public incident response policy specific
    to Onebrief. The reliance on Second Front creates a single-point dependency for deployment infrastructure. Technical risks include AI reliability
    in life-critical planning contexts where hallucinated intelligence assessments or flawed course-of-action recommendations could lead to operational
    failures. The maintenance burden of multiple ATOs across classification levels represents ongoing compliance overhead. Battle Road Digital integration
    introduces execution risk as wargaming and simulation capabilities must be tightly coupled with planning workflows while maintaining classified
    network compliance. Data governance for AI training on classified operational data raises questions about model isolation across classification
    boundaries. Defense-tech analysts note that government contracting mechanisms limit margin upside, and long sales cycles create capital
    consumption risk for VC-backed companies that must maintain accreditation across multiple environments simultaneously.
