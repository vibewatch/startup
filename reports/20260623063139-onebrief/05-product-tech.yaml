- id: tech-leadership-ai
  title: Technical leadership and AI roadmap
  body: Onebrief appointed Cory Ondrejka as CTO in February 2026, signaling serious investment in engineering depth and AI capabilities. Ondrejka
    brings over 30 years of experience from leadership roles at Google (VP of Google Experience, serving as CEO Sundar Pichai's technical strategy
    advisor managing 1,500+ engineers), Meta (VP of Mobile Engineering during the desktop-to-mobile transformation), SmartNews (CTO, driving LLM
    adoption), and as co-creator and CTO of Second Life at Linden Lab. His mandate at Onebrief focuses on expanding AI Assist capabilities and
    integrating Battle Road Digital's simulation technologies into the platform. The AI roadmap includes agentic workflows that automate routine staff
    processes, an AI co-planner for course-of-action development, and AI-driven wargaming that learns from real-world operational data to improve
    simulation fidelity over time. The platform is described as continuously evolving through AI-driven learning. Ondrejka's background in scaling
    consumer platforms through mobile transitions and applying AI at products used by billions brings relevant technical leadership for the challenge
    of building trusted AI capabilities in a life-critical military context. His Naval Academy background also provides institutional credibility
    with military users who must trust the system with operational planning.
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
