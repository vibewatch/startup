- id: architecture-deployment
  title: Architecture, deployment, and classified network operations
  body: Onebrief operates across the three primary U.S. classified network environments — NIPR (unclassified but sensitive), SIPR (Secret), and JWICS
    (Top Secret/SCI) — enabling planners at every classification level to use the same platform with appropriate access controls. This multi-network
    deployment is technically demanding because each network imposes different security requirements, connectivity constraints, and accreditation
    standards. The platform's deployment architecture leverages Second Front Systems' Game Warden, a DoD-accredited DevSecOps platform that provides
    CI/CD pipelines, security scanning, continuous monitoring, 24/7 incident response, and penetration testing. In May 2026, Onebrief designated
    Second Front as its preferred deployment partner following rapid deployment in the Department of the Air Force's CLOUDworks environment. Game Warden
    is authorized at Impact Level 5 (Controlled Unclassified Information in DoD cloud), Impact Level 6 (Secret classified), and Top Secret classification
    levels, with compliance documented against NIST 800-53 controls and the DoD DevSecOps Reference Design. The architecture enables Onebrief to
    ship updates continuously while maintaining the security posture required for mission-critical military planning software. Game Warden's zero
    Critical/High CVE posture and 3PAO audit readiness provide the compliance documentation typically required for Authority to Operate approvals.
    This deployment model reduces the engineering burden on Onebrief's team for infrastructure security while accelerating time-to-deploy.
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
