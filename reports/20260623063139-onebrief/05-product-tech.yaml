- id: product-capabilities
  title: Product capabilities and feature architecture
  body: Onebrief's platform organizes capabilities around three pillars. First, collaborative planning delivers the core workflow replacement by
    structuring MDMP and JPP outputs into linked, living documents that update in real-time as upstream inputs change. Staff officers build courses
    of action, synchronization matrices, and execution orders within the platform rather than assembling them manually across disconnected tools.
    Second, AI Assist provides agentic AI capabilities that accelerate staff work. The AI co-planner helps generate planning artifacts, summarize
    intelligence, draft staff estimates, and identify gaps in courses of action. CTO Cory Ondrejka is leading the expansion of these AI-driven support
    capabilities, bringing experience from applying AI across Google and Meta products. The AI layer is designed to augment rather than replace human
    planners, preserving commander oversight while reducing the time required for routine analytical and drafting tasks. Third, wargaming and simulation,
    added through the January 2026 acquisition of Battle Road Digital, enables commanders to stress-test plans against simulated adversary actions
    before committing forces. Battle Road applies best-in-class gaming technology to defense challenges, providing real-time operational decision support
    that bridges simulation and live operations. The integration creates a unified environment where military leaders can plan, simulate, and decide
    within one system rather than context-switching between disconnected planning and wargaming tools.
  claimRefs:
  - CE007
  - CE008
