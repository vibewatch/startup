callouts:
- calloutType: strength
  title: Unified planning-to-simulation workflow is genuinely novel
  body: By combining collaborative planning, AI-assisted analysis, and wargaming/simulation in one platform deployed on classified networks, Onebrief
    addresses a workflow gap that no incumbent defense contractor has solved. Legacy tools are disconnected and document-centric; Onebrief's integrated
    approach reduces context-switching and enables faster iteration on plans.
  claimRefs:
  - CE001
  - CE007
  - CE009
  - CE014
- calloutType: strength
  title: CTO hire signals engineering seriousness
  body: Cory Ondrejka's appointment brings scaled-platform and AI expertise from Google, Meta, and SmartNews to a defense startup that needs to ship
    reliable AI features in high-stakes environments. His Naval Academy background adds institutional credibility with military customers.
  claimRefs:
  - CE021
  - CE022
  - CE023
- calloutType: risk
  title: AI reliability in life-critical military planning
  body: Deploying agentic AI in contexts where flawed recommendations could lead to operational failures or loss of life introduces unique reliability
    requirements beyond typical enterprise software. Public evidence does not yet demonstrate how Onebrief validates AI outputs or handles model
    errors in classified planning environments.
  claimRefs:
  - CE030
  - CE032
  - CE034
- calloutType: risk
  title: Single-point deployment dependency on Second Front
  body: Onebrief's classified network deployment relies entirely on Second Front Systems' Game Warden platform. Any disruption to Second Front's
    accreditation, operations, or business continuity would directly impact Onebrief's ability to serve its most critical customers.
  claimRefs:
  - CE019
  - CE028
  - CE031
- calloutType: recommendation
  title: Request application-layer security documentation
  body: Diligence should request Onebrief's own security architecture, data governance policies, AI model isolation practices across classification
    boundaries, and any independent security assessments beyond what Second Front provides at the infrastructure layer.
  claimRefs:
  - CE027
  - CE030
  - CE031
