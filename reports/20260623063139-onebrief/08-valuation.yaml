  - id: comparable-landscape
    title: Public and private comparable valuations in defense-AI software
    body: >-
      The defense-technology sector experienced unprecedented valuation expansion through 2025–2026, with Anduril reaching approximately $61 billion
      in its latest round, Helsing reportedly valued near $5.5 billion as Europe's leading defense-AI company, Shield AI at roughly $5.3 billion
      after its Series F, and Saronic reaching unicorn status in autonomous naval systems. Against this backdrop, Onebrief's $2.15 billion mark
      sits in the mid-tier of private defense-tech unicorns but at the high end of defense-software-specific companies. The most instructive
      public comparable remains Palantir Technologies, which commands a market capitalization of approximately $286 billion on TTM revenue of
      $5.2 billion (P/S ratio of approximately 55× as of mid-2026). Palantir's premium reflects two decades of government relationships, proven
      at-scale margins above 80% gross, and accelerating commercial revenue — benchmarks that Onebrief has not yet demonstrated publicly.
      The private comparable set is less transparent: Anduril's $61 billion valuation is anchored by a large hardware and autonomy business
      with estimated revenues above $1 billion, suggesting a multiple in the 40–60× range. Helsing and Shield AI operate at earlier revenue
      stages with heavy R&D investment but have disclosed less granular financials than Palantir. The sector-wide pattern is clear — investors
      are willing to pay platform-transition multiples for defense-AI companies with growing adoption inside allied militaries — but the premium
      correlates with disclosed revenue scale, diversification beyond a single customer, and path-to-profitability visibility. Onebrief's
      position is unique in that its adoption metrics (embedded in three of four largest OPLANs, multiple combatant commands) are strong,
      but its financial proof points remain entirely private, making it the most opaque company in the comparable set relative to its valuation.
