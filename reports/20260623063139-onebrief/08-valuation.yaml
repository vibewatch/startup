chapter:
  number: 8
  title: Valuation
  summary: >-
    Onebrief's Series D priced the company at $2.15 billion in January 2026, representing a 3.3× step-up in twelve months from the $650 million Series C.
    With revenue undisclosed, the implied multiple on estimated ARR is extremely high relative to public defense-software comparables, supporting a
    stretched valuation stance that requires private diligence to underwrite.
sections:
  - id: valuation-trajectory
    title: Capital-raise cadence and pricing trajectory from Series C through Series D
    body: >-
      Onebrief's valuation trajectory compressed three pricing events into roughly twelve months, an unusually rapid pace for private defense-technology
      companies. The Series C closed in January 2025 at a $650 million post-money mark, led by General Catalyst and Insight Partners with $70 million in
      new equity. Within five months Battery Ventures led a $20 million extension that nearly doubled the headline to $1.1 billion, establishing unicorn
      status by June 2025. The pace accelerated further when Battery Ventures and Sapphire Ventures co-led the $200 million Series D at $2.15 billion in
      January 2026, with Salesforce Ventures and earlier backers participating. Cumulatively the company has raised over $300 million across its lifetime,
      progressing from Y Combinator in 2020 through seed, Series A, Series B, and the three most recent rounds. The 3.3× step-up from Series C to
      Series D over a single calendar year is aggressive by historical private-market standards and implies either extraordinary revenue acceleration or
      investor willingness to pay for strategic scarcity in defense-planning software. Given that revenue figures remain undisclosed, the latter explanation
      carries significant weight. Each successive round brought in new institutional capital — General Catalyst, Insight Partners, Battery Ventures,
      Sapphire Ventures, Salesforce Ventures — diversifying the cap table but also raising the bar for returns at current entry prices. The capital has
      funded product expansion, headcount growth toward an estimated 500 employees, and the same-day acquisition of Battle Road Digital (wargaming
      simulation) alongside the Series D, suggesting an aggressive growth posture funded by investor conviction rather than demonstrated cash-flow
      generation. The implied ownership dilution from $303 million raised against a $2.15 billion mark is approximately 14% aggregate primary issuance
      in the D round alone, though actual dilution depends on undisclosed preference terms, option pool expansion, and secondary components embedded
      in the $200 million total.
