callouts:
  - calloutType: "risk"
    title: "Extreme customer concentration in U.S. DoD"
    body: "Onebrief appears to derive effectively 100% of revenue from U.S. Department of Defense customers. This creates acute exposure to continuing resolutions, government shutdowns, sequestration, and shifts in DoD modernization priorities. The company's own fundraising strategy acknowledged this risk explicitly."
    claimRefs: ["CU027", "CU028", "CU031", "CU032"]
  - calloutType: "risk"
    title: "Classified opacity limits independent verification"
    body: "Most customer-adoption claims cannot be independently verified due to classification. Investors must rely on company representations and cleared-reference checks. The gap between company-claimed breadth (three largest GCCs, Joint Staff, allies) and publicly confirmable customers (ACC, partial AMC/Navy) is material."
    claimRefs: ["CU029", "CU033", "CU034"]
  - calloutType: "strength"
    title: "Deep workflow embedding creates structural retention"
    body: "Once embedded in operational war plans on classified networks with ATO requirements, Onebrief faces minimal competitive displacement risk. The multi-year authorization process for classified environments and integration into daily battle rhythm create high switching costs."
    claimRefs: ["CU014", "CU015", "CU035", "CU036"]
  - calloutType: "insight"
    title: "Bottom-up adoption mirrors early Palantir playbook"
    body: "Onebrief's growth pattern — junior officers adopting the tool, creating institutional demand, commanding staff-wide rollouts — mirrors the adoption motion that built Palantir's DoD business. This pattern is validated but creates dependence on continued grassroots enthusiasm and competitive tool superiority."
    claimRefs: ["CU008", "CU009", "CU038"]
