company:
  name: "Onebrief"
chapter:
  number: 6
  title: "Customers"
  summary: "Onebrief's customer base is concentrated within the U.S. Department of Defense, with confirmed adoption across at least four geographic combatant commands, the Joint Staff, Air Combat Command, and allied militaries. The platform is embedded in three of the four largest DoD operational plans and runs on SIPR, NIPR, and JWICS classified networks. However, nearly all specific customer identities remain classified or undisclosed, limiting independent verification of adoption breadth and creating material concentration risk tied to DoD procurement cycles and budget appropriations."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation"
    body: "Onebrief's customer base is overwhelmingly weighted toward U.S. Department of Defense organizations, with a secondary presence in allied military headquarters. The primary buyer segments include Geographic Combatant Commands (GCCs), the Joint Staff, Service Component Commands, and Major Commands such as Air Combat Command. Onebrief has publicly confirmed usage across at least four of seven U.S. geographic combatant commands and the three largest GCCs, though the specific commands are not publicly named due to classification constraints. The company's earliest traction came from Indo-Pacific-focused units, consistent with CEO Grant Demaree's background and the company's Honolulu headquarters location. Beyond U.S. forces, allied military organizations represent a growing segment, though specific allied customers remain undisclosed. The buyer-user-payer structure in DoD procurement is layered: program offices and command J-staffs act as budget owners, while planners at strategic, operational, and tactical echelons are the actual users. Procurement vehicles include Other Transaction Authorities (OTAs), SBIR awards, and direct contract mechanisms like the Air Combat Command's EMC3 award. Second Front Systems serves as the preferred deployment partner, acting as a channel for secure hosting rather than a customer. Revenue concentration appears heavily skewed toward DoD, with no disclosed commercial or non-defense customers as of mid-2026."
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006", "CU007", "CU030"]
    tableRefs: ["TU001"]
    figureRefs: ["FU003"]
  - id: "adoption-trajectory-and-deployment"
    title: "Adoption Trajectory and Deployment Footprint"
    body: "Onebrief's adoption trajectory follows a distinctive bottom-up pattern within the DoD. Junior officers discover the tool, adopt it for operational planning, and create institutional demand that eventually reaches senior leadership. CEO Grant Demaree has described how first users were acquired through unconventional methods—offline Navy-approved laptops and government credit card purchases—before the company secured formal contract vehicles. The platform's growth metrics are striking: Onebrief claims 4x year-over-year revenue growth and a reported 19,600% annualized increase in usage hours, though independent verification of these figures is not possible given the company's private status. The deployment footprint spans all major classified networks: SIPR (Secret), NIPR (Unclassified), and JWICS (Top Secret/SCI), with Impact Level 5, IL6, and Top Secret authorizations confirmed through Second Front's Game Warden platform. The May 2026 migration to DAF CLOUDworks established cloud-scale infrastructure for the Secret-level instance, with Top Secret migration underway. Air Combat Command's January 2025 EMC3 contract represents the most publicly detailed adoption milestone, establishing Onebrief as the foundation for ACC's Agile Battle Lab mission command system with rollout across all staff directorates. The company anticipates that more than half of U.S. Combatant Commands will utilize its platform by end of the current fiscal year, per its Series B announcement. Embedding in three of the four largest DoD OPLANs indicates strategic-level adoption where the platform informs war plans, not merely day-to-day staff coordination."
    claimRefs: ["CU008", "CU009", "CU010", "CU011", "CU012", "CU013", "CU014", "CU015", "CU016", "CU017"]
    tableRefs: ["TU002", "TU003"]
    figureRefs: ["FU001"]
  - id: "named-customer-proof"
    title: "Named Customer Proof and Evidence Quality"
    body: "The strongest publicly verifiable customer proof for Onebrief comes from the Air Combat Command EMC3 contract, announced via BusinessWire in January 2025. This contract explicitly names ACC as the buyer, describes the use case (mission command, control, and communication), identifies the deployment scope (all ACC staff directorates), and includes named testimonials from ACC's AI Technical Director and the ABL Director of Operations. Beyond ACC, specific customer identities are almost entirely classified or company-claimed without independent corroboration. The Implicator.ai analysis provides the most granular revenue-adjacent data available: confirmed federal awards totaling approximately $10–15 million across several years, with the Air Mobility Command deal cited as the largest at $7.5 million over five years, and the Navy Fleet Forces Command contributing $1.66 million. These figures, if accurate, represent meaningful footholds but remain small relative to the company's $2.15 billion valuation. The Series B press release references usage across U.S. military headquarters worldwide, while the General Catalyst investment memo describes embedding in three of the four largest OPLANs. Company-claimed adoption at the three largest GCCs and Joint Staff lacks independent confirmation beyond investor materials. Allied adoption is referenced but no specific allied ministry of defense is named. The overall evidence quality is moderate: one named customer with full attribution (ACC), a handful of contract-value datapoints from investigative analysis, and multiple company-claimed adoption metrics that cannot be independently verified due to classification."
    claimRefs: ["CU018", "CU019", "CU020", "CU021", "CU022", "CU023", "CU024", "CU025", "CU026"]
    tableRefs: ["TU004"]
    figureRefs: ["FU002"]
  - id: "retention-durability-and-expansion"
    title: "Retention, Durability, Expansion, and Concentration Risk"
    body: "No public evidence discloses NRR, GRR, churn rates, contract renewal rates, or customer satisfaction metrics for Onebrief. The company's private status and classified customer base make these metrics unavailable for independent assessment. However, several structural indicators suggest retention dynamics: military planning tools that become embedded in operational workflows create high switching costs, particularly when integrated into war plans and daily battle rhythm. The platform's presence on classified networks with ATO (Authority to Operate) requirements means competitors face multi-year authorization timelines to displace Onebrief once installed. The land-and-expand motion is evident in Onebrief's trajectory from individual unit adoption to command-wide rollouts (ACC example) and from single-network to multi-network deployment. Expansion vectors include additional combatant commands, tactical unit-level deployment via offline capabilities, allied military adoption, and adjacent use cases such as wargaming and simulation (via Battle Road Digital acquisition). Concentration risk is the dominant concern for this customer profile. Revenue appears almost entirely dependent on U.S. DoD appropriations, with material exposure to continuing resolutions, government shutdowns, and budget sequestration. The company's own Series B announcement acknowledged this risk explicitly, noting the fundraise was partly a hedge against yearlong Continuing Resolution scenarios. A retired three-star general and former head of the Pentagon's Joint AI Center has publicly warned about circular funding dynamics and valuations untethered from commercial output in defense tech. The 110x revenue multiple (per Implicator.ai's analysis of ~$19M revenue against $2.15B valuation) creates pressure to convert pilot-stage adoption into enterprise-scale programs of record. Pentagon procurement cycles do not operate like enterprise software sales, and the path from OTA-funded pilots to indefinite-delivery production contracts remains Onebrief's central commercial challenge."
    claimRefs: ["CU027", "CU028", "CU029", "CU031", "CU032", "CU033", "CU034", "CU035", "CU036", "CU037", "CU038", "CU039"]
    tableRefs: ["TU005"]
    figureRefs: ["FU004"]
