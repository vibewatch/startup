  - id: TV007
    title: Final diligence asks and thesis-break triggers
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Confirmed ARR & growth
        - Actual revenue run-rate and YoY trajectory
        - Cannot validate multiple without revenue denominator
        - Request audited financials or investor data room
      - - Gross margin profile
        - Software vs. services mix; margin trajectory
        - Determines whether premium SaaS multiple applies
        - Financial diligence; P&L decomposition
      - - Preference stack & liquidation waterfall
        - Terms of $303M cumulative capital; seniority, participation
        - Subordination risk for new entrants in down-round
        - Review cap table with counsel; preference modeling
      - - Battle Road integration milestones
        - Technical integration status; AtomEngine independence from Palantir
        - Platform narrative depends on owning full stack
        - Product diligence; engineering roadmap review
      - - Net retention & contract economics
        - Dollar-based NRR; expansion rates within commands
        - Validates land-and-expand thesis vs. one-time deployments
        - Customer reference calls; contract structure review
      - - Competitive moat durability
        - Palantir overlap risk post-$10B Army EA; switching costs
        - Platform consolidation could erode whitespace advantage
        - Customer interviews; Joint Staff adoption audit
    notes: >-
      Each diligence ask maps to a thesis-break trigger: failure to confirm any single item at or above the bear-case
      threshold implies downgrade to 'avoid' stance.
