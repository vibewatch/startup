companyProfile:
  summary: >-
    Onebrief is a Honolulu-based defense-technology company building an AI-enabled operational planning and
    staff-collaboration platform for the U.S. military and allied commands. Founded in 2019 in Austin by U.S. Army
    veteran Grant Demaree and engineer Rafael "Rafa" Pereira, it digitizes the Military Decision Making Process and
    Joint Planning Process, replacing PowerPoint- and document-centric workflows with a live, networked planning
    workspace that runs on classified networks. After a rapid funding sequence culminating in a $200M Series D at a
    $2.15B post-money valuation in January 2026 (alongside the acquisition of wargaming firm Battle Road Digital),
    Onebrief is positioned as an emerging "command operating system," though its financial fundamentals remain
    undisclosed.
