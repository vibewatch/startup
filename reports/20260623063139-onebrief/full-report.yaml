              military planning tools that become embedded in operational workflows create high switching costs,
              particularly when integrated into war plans and daily battle rhythm. The platform's presence on classified
              networks with ATO (Authority to Operate) requirements means competitors face multi-year authorization
              timelines to displace Onebrief once installed. The land-and-expand motion is evident in Onebrief's
