              (including DFARS 252.204-7012 for Covered Defense Information) impose ongoing compliance obligations that
              scale with contract scope. Any compliance failure could result in contract termination, debarment, or
              False Claims Act liability. The regulatory burden is compounded by dependence on Second Front Systems as
              the preferred deployment partner — a single point of failure for the accreditation envelope that enables
