              deployment via offline capabilities, allied military adoption, and adjacent use cases such as wargaming
              and simulation (via Battle Road Digital acquisition). Concentration risk is the dominant concern for this
              customer profile. Revenue appears almost entirely dependent on U.S. DoD appropriations, with material
              exposure to continuing resolutions, government shutdowns, and budget sequestration. The company's own
              Series B announcement acknowledged this risk explicitly, noting the fundraise was partly a hedge against
              yearlong Continuing Resolution scenarios. A retired three-star general and former head of the Pentagon's
              Joint AI Center has publicly warned about circular funding dynamics and valuations untethered from
              commercial output in defense tech. The 110x revenue multiple (per Implicator.ai's analysis of ~$19M
              revenue against $2.15B valuation) creates pressure to convert pilot-stage adoption into enterprise-scale
