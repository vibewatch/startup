      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue opacity makes the $2.15B mark unverifiable on public evidence
            body: >-
              Without disclosed ARR, margins, or contract backlog, outside investors cannot independently determine
              whether the Series D pricing reflects fundamental value or venture-market exuberance. The single
              third-party revenue estimate ($19M) implies an extreme multiple that exceeds all public comparables.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV034
          - type: callout
            title: Adoption depth across operational plans provides genuine strategic value
            body: >-
              Embeddedness in three of four largest DoD OPLANs and deployment across classified networks creates
              switching costs that justify some valuation premium. Platform stickiness reduces churn risk relative to
              typical enterprise SaaS.
            calloutType: strength
            claimRefs:
              - CV007
              - CV026
          - type: callout
            title: Research-more stance until private diligence confirms revenue trajectory
            body: >-
              The recommendation is research-more with medium confidence: upgrade to track/buy only after confirming ARR
              above $50M, gross margins above 70%, and acceptable preference-stack terms. Without these confirmations,
              the stretched valuation stance holds.
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV035
              - CV037
