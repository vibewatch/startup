              capabilities organically or via acquisition. Both competitors have significantly larger engineering teams,
              deeper DoD relationship networks, and established ATOs across classification levels. Traditional primes
              (Lockheed, Northrop, RTX) maintain incumbency on major Programs of Record and could bundle or mandate
              their own planning tools as part of larger system-of-systems contracts, particularly as CJADC2
              architecture matures. CB Insights data identifies ~157 active Onebrief competitors with 17 well-funded.
              The risk is not that Onebrief is technically inferior today — user adoption at operational HQs suggests
              strong product-market fit — but that a larger player absorbs or replicates the collaborative-planning
              value proposition and bundles it at zero marginal cost within a broader C2/ISR contract. The acquisition
              of Battle Road Digital by Onebrief in January 2026 partially addresses the simulation gap but
