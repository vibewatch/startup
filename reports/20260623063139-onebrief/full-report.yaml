            body: >-
              Onebrief faces intensifying competition from both well-capitalized defense-tech platforms and traditional
              prime contractors. Palantir (market cap ~$150B+, 2026) already operates across DoD command echelons with
              Gotham and AIP, and actively pursues CJADC2 integration contracts. Anduril (~$61B valuation, Jan 2026)
