      - number: '8.2'
        title: Implied revenue-multiple analysis given undisclosed financials
        blocks:
          - type: paragraph
            body: >-
              Because Onebrief does not publicly disclose ARR, revenue, or margins, any multiple-based valuation
              assessment must work backward from the known post-money mark of $2.15 billion. Independent analysis from
              Implicator.ai — citing unnamed sources — suggests 2024 revenue of approximately $19 million, which would
              imply a trailing revenue multiple of roughly 110×. This figure is extraordinarily high by any benchmark:
              Palantir currently trades at approximately 55× trailing sales with $5.2 billion TTM revenue and net-income
              profitability, while early-stage defense SaaS companies historically attract 20–50× forward revenue
              multiples. If the $19 million estimate is directionally correct and the company achieved the claimed 4×
              year-over-year growth, 2025 run-rate revenue could approach $70–80 million, which would compress the
              forward multiple to roughly 27–31× on 2025 estimated revenue — still premium but within range of
              high-growth defense-software peers. This scenario-dependent analysis underscores the central valuation
              challenge: the same $2.15 billion price can look stretched or defensible depending entirely on revenue
              assumptions that management has chosen not to confirm publicly. The table below presents sensitivity
              scenarios illustrating how the implied multiple changes across a range of estimated ARR values. At any
              revenue figure below $40 million, the multiple exceeds the upper bound of publicly traded defense-software
              comparables and signals venture-style pricing that requires extraordinary growth to justify. Above $70
              million, the multiple compresses into territory where platform-transition narratives
              (planning-to-simulation-to-C2 operating system) can rationalize the premium. Without confirmed financials,
              confidence in any specific scenario remains low, and investors must treat this as a faith-based entry
              where the growth trajectory is the only path to value realization.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
