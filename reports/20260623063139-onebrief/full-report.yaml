      - - Base
        - 50–70
        - 25–35×
        - 1250–2450
        - Steady growth; existing deployments convert; no step-change acceleration
        - Moderate-to-high — consistent with typical defense-software scaling
      - - Bear
        - 20–40
        - 15–20×
        - 300–800
        - Sector multiples compress; Palantir captures planning layer; procurement stalls
        - Low-to-moderate — requires active sector deterioration
