      - number: '3.4'
        title: Onebrief moat assessment and differentiation durability
        blocks:
          - type: paragraph
            body: >-
              Onebrief's competitive moat rests on five interlocking factors: (1) planner-native workflow design built
              around MDMP and JPP doctrine rather than adapted from commercial analytics tools; (2) classified-network
              deployment on SIPR, NIPR, and JWICS — a compliance and accreditation barrier that takes years to achieve
              and that most commercial software companies never attempt; (3) deep embedding in three of the four largest
              DoD operational plans (OPLANs), creating mission-critical switching costs; (4) founder domain expertise —
              CEO Grant Demaree conceived the product while deployed as a U.S. Army officer in Iraq; and (5) the Battle
              Road Digital acquisition (January 2026), which adds wargaming and simulation capabilities that extend the
              planning workflow into execution rehearsal. The switching cost is particularly powerful because Onebrief's
              planning artifacts become the authoritative operational record — once an OPLAN is built in Onebrief,
              migrating away requires reconstructing the entire operational plan. However, competitive durability faces
              three structural threats. First, Palantir and Anduril can bundle planning features into existing platform
              contracts at near-zero marginal cost, eroding willingness-to-pay for a standalone tool. Second, legacy
              primes control the integration budgets — if Lockheed or Northrop add modern UX layers to GCCS-J or IBCS,
              they could offer planning upgrades within existing programs of record. Third, DoD procurement inertia
              means Onebrief must continually win new authorizations across combatant commands rather than relying on
              enterprise-wide mandates, making growth execution-intensive.
