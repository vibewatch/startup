        title: Scale, Milestones, and Operating Risks
        blocks:
          - type: paragraph
            body: >-
              Onebrief's adoption is concentrated in the U.S. military's highest-priority planning environments. The
              platform is embedded in three of the four largest DoD operational plans (OPLANs) and is used by the three
              largest Geographic Combatant Commands, the Joint Staff, and allied militaries. However, specific customer
              identities and contract values remain classified or undisclosed. Revenue, ARR, and exact headcount are not
              publicly reported — media descriptions reference "hundreds of employees" but no precise figure. The
              company operates as private-undisclosed, meaning investors must rely on contract momentum narratives
              rather than audited financial evidence. The rapid valuation trajectory (from $650 million in January 2025
              to $2.15 billion in January 2026, a 3.3x step-up in twelve months) raises questions about whether growth
              metrics justify the premium, particularly given the defense sector's notoriously long procurement cycles
              and the "valley of death" between pilot programs and programs of record. Key-person dependence on CEO
              Demaree, concentration of customer base in a single buyer ecosystem (DoD), and the inherent opacity of
              classified deployments represent material risks that cannot be fully mitigated through open-source
              diligence alone.
