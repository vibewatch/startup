  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Product
        blocks:
          - type: paragraph
            body: >-
              Onebrief is a cloud-native military planning and staff collaboration platform headquartered in Honolulu,
              Hawaii. The company was founded in 2019 in Austin, Texas by Grant Demaree and Rafael "Rafa" Pereira, both
              graduates of the Y Combinator Summer 2020 batch. Demaree conceived the product while deployed as a U.S.
              Army officer, observing firsthand how military planning still relied on PowerPoint slides, Word documents,
              and disconnected email threads. The platform replaces the Military Decision Making Process (MDMP) and
              Joint Planning Process workflows with a real-time, web-based collaborative workspace featuring
              auto-updating planning artifacts called "cards," an AI Assist capability providing agentic AI support, and
              integrated wargaming and simulation tools gained through the January 2026 acquisition of Battle Road
              Digital. Onebrief operates on classified networks including SIPR, NIPR, and JWICS, positioning it as the
              operating system for what the company calls "superhuman military command." Second Front Systems was named
              Onebrief's preferred deployment partner in May 2026, enabling rapid deployment via the Game Warden
              platform authorized to IL5, IL6, and Top Secret environments.
