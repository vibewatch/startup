      - number: '8.4'
        title: Scenario analysis with bull, base, and bear valuation outcomes
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Onebrief's platform-expansion strategy succeeds: Battle Road integration delivers
              planning-to-simulation in a single stack, revenue accelerates past $100 million ARR by 2027 driven by
              multi-year program-of-record contracts, and the company captures the "military command OS" positioning
              that management has articulated. Under this scenario, a 30–40× forward multiple on $100–150 million ARR
              yields a fair value range of $3–6 billion, representing 40–180% upside from the current Series D mark. The
              probability weight on this case is moderate given visible adoption strength but is constrained by Pentagon
              procurement timelines of 18–36 months per major contract expansion. The base case assumes steady growth
              but slower than venture expectations: ARR reaches $50–70 million by mid-2027 as existing deployments
              convert to funded programs of record, but program-expansion cycles stretch. At 25–35× forward multiples,
              fair value in this scenario ranges from $1.25–2.45 billion, roughly flat to modestly below current
              pricing, suggesting the Series D is a fair-to-stretched entry for base-case believers. The bear case
              considers multiple compression without growth acceleration: if the defense-tech funding cycle cools (as
              analysts at A.I. Ventures and The Economist have warned), sector multiples compress toward 15–20×, and
              Onebrief's revenue stays below $40 million due to procurement friction, the implied value range drops to
              $600 million–$800 million — a meaningful markdown from current pricing. This downside is amplified by the
              Palantir competitive overhang (the $10 billion Army Enterprise Agreement gives Palantir leverage across
              adjacent planning layers) and by the opacity of Onebrief's cap-table structure, where undisclosed
              preference stacks from $303 million in cumulative primary/secondary capital could subordinate later
              entrants in a down-round scenario.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
