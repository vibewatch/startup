              alongside near-total operational opacity. The company has clearly achieved product-market fit sufficient
              to attract top-tier investors at rapidly escalating valuations, and USASpending confirms real government
              revenue. But the absence of disclosed ARR, revenue growth, gross margin, burn rate, customer
              concentration, and contract-level economics means that no external party can underwrite the $2.15 billion
              valuation on fundamentals alone. The key diligence blockers are revenue magnitude and growth trajectory
              (is ARR $20M, $50M, or $100M?), gross margin and cost structure (is this a 70%+ software margin business
