      - number: '8.5'
        title: Valuation stance and critical diligence requirements
        blocks:
          - type: paragraph
            body: >-
              The weight of public evidence supports a stretched valuation stance. The $2.15 billion mark is defensible
              on strategic grounds — Onebrief occupies a genuine whitespace in military planning software, has bottom-up
              adoption across the DoD's most consequential operational plans, and has assembled a high-quality investor
              syndicate willing to price growth optionality at a premium. However, public evidence does not confirm
              whether the price is supported by underlying unit economics. The absence of disclosed revenue, margins,
              contract backlog, net retention, and customer-level economics means outside investors cannot independently
              validate the multiple, compare it to benchmarks, or assess downside protection through preference-stack
              analysis. The fair-value range, aggregating scenarios with probability weights, spans approximately
              $1.2–3.5 billion with a central estimate near $1.8–2.2 billion — suggesting the Series D mark sits at the
              upper boundary of a defensible range rather than clearly inside it. The recommendation is research-more:
              strategic interest is warranted given the moat characteristics and adoption evidence, but underwriting at
              the current mark without revenue disclosure, margin visibility, and cap-table transparency exposes
              investors to asymmetric downside in a sector experiencing multiple compression signals. Critical diligence
              asks include confirmed ARR and growth rate, gross margin and path to profitability, preference-stack and
              liquidation-waterfall terms, Battle Road integration milestones, and customer-level contract economics.
              Without these disclosures, the entry discipline question cannot be resolved on public evidence alone.
            claimRefs:
              - CV034
              - CV035
              - CV036
