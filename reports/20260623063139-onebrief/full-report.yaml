      - number: '7.5'
        title: Technology and AI Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              Onebrief's AI Assist feature provides agentic AI capabilities within the military planning workflow — a
              domain where errors can have life-or-death consequences. GAO's AI Accountability Framework (GAO-21-519SP)
              establishes that federal agencies deploying AI in decision-support systems must maintain robust
              governance, monitoring, and human-oversight mechanisms. The DoD's Responsible AI Strategy further mandates
              that AI systems used in operational planning be traceable, reliable, and governable. If Onebrief's AI
              outputs influence the selection of courses of action, force allocation, or targeting priorities (even
              indirectly), any hallucination, bias, or data-quality failure could propagate catastrophically through the
              planning chain. The Authority to Operate (ATO) burden for AI-enabled systems on classified networks is
              substantial — requiring continuous monitoring, penetration testing, and re-authorization cycles that
              consume engineering resources and delay feature releases. GAO's 2024 review of federal AI implementation
              found that most agencies have not completed key governance requirements for AI systems, raising the bar
              for Onebrief to demonstrate compliance. Additionally, the reliance on commercial AI models (likely
              LLM-based) within classified environments introduces supply-chain risk: model updates, fine-tuning
              pipelines, and inference infrastructure must all operate within air-gapped networks, adding cost and
              latency to the development cycle.
