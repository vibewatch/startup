      - number: '2.2'
        title: Market Sizing with Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single published estimate captures the addressable market for military planning software precisely, so
              a multi-lens approach is necessary. The narrowest credible lens is the U.S. JADC2 technology market, which
              MarketsandMarkets sizes at $1.2B in 2023 growing to $8.6B by 2030 at a 31.7% CAGR, driven by the DoD's
              need for integrated cross-domain command and control. Emergen Research provides an alternative U.S. JADC2
              estimate of $6.5B in 2024 projected to $15.2B by 2034 at 8.8% CAGR, using a broader definition that
              includes more hardware and services. At the global JADC2 level, 360iResearch and GII Research converge on
              $9.84B in 2025, $11.46B in 2026, and $29.45B by 2032 at 16.94% CAGR, encompassing hardware, software, and
              services across all participating nations. The broadest lens is Fortune Business Insights'
              command-and-control systems market at $39.27B in 2026 growing to $73.33B by 2034 at 8.1% CAGR, which
              includes fixed and mobile C2 infrastructure, networking, and integration services across defense and
              civilian domains. The spread between these estimates is analytically significant: it reflects different
              scope boundaries rather than disagreement about the same quantity. For a pure-software planning platform,
              the practical serviceable addressable market (SAM) is best approximated by the U.S. JADC2 software
              component plus allied equivalents, likely in the $3-6B range by 2026, while the serviceable obtainable
              market (SOM) for any single vendor is further constrained by classification requirements, procurement
              vehicles, and competitive dynamics.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
