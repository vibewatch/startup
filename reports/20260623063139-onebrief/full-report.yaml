      - number: '2.5'
        title: Sizing Uncertainties and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Market-sizing uncertainty is a material analytical risk for investors evaluating defense C2 software. The
              MarketsandMarkets U.S. JADC2 estimate ($1.2B in 2023 to $8.6B by 2030) implies explosive growth from a
              small base, while the Emergen Research estimate ($6.5B in 2024 to $15.2B by 2034) suggests a much larger
              current market growing more slowly. These are not contradictory in the usual sense—they reflect different
              scope definitions (narrow software vs. broader technology stack including hardware and services). However,
              investors using one estimate as TAM validation without understanding the definitional boundary would
              materially misjudge the opportunity. The global JADC2 figure ($29.45B by 2032) includes non-U.S. spending
              that may not be immediately addressable by a platform primarily deployed on U.S. classified networks. The
              broadest C2 systems estimate ($73.33B by 2034) includes hardware and civilian applications entirely
              outside the military planning software domain. A bottoms-up SOM estimate must account for the actual
              number of potential command-level deployments, budget authority per deployment, and realistic penetration
              rates given classification constraints and incumbent competition. The GAO's finding that DoD lacks a
              framework to track CJADC2 investments introduces additional uncertainty: without clear investment
              tracking, market-sizing models that rely on announced program budgets may double-count or miss entirely
              programs that contribute to or detract from the addressable opportunity.
            claimRefs:
              - CM032
              - CM033
              - CM034
              - CM035
              - CM009
              - CM010
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Definition Drives Valuation Logic
            body: >-
              The 5-7x spread between the narrowest ($6.5B U.S. JADC2) and broadest ($39.27B global C2) market estimates
              means that valuation multiples are highly sensitive to which TAM definition an investor accepts. A
              platform vendor claiming to address the full $39B market would need to demonstrate hardware and civilian
              capabilities far beyond planning software.
            calloutType: insight
            claimRefs:
              - CM009
              - CM011
              - CM033
          - type: callout
            title: Budget Instability Creates Procurement Uncertainty
            body: >-
              The FY2026 budget cycle produced a 43-day government shutdown and subsequent CR, delaying contract awards
              and forcing the Pentagon to divert unspent R&D and shipbuilding funds to cover troop pay. GAO found that
              about half of acquisition programs experience schedule effects from CRs, meaning defense software vendors
              face recurring annual risk of delayed revenue recognition.
            calloutType: risk
            claimRefs:
              - CM027
              - CM028
              - CM029
          - type: callout
            title: CJADC2 Governance Gap May Slow Market Materialization
            body: >-
              The GAO's April 2025 finding that DoD lacks a unified CJADC2 investment framework introduces structural
              risk: without coordinated spending, the theoretical $11-15B market may materialize more slowly than
              forecasts suggest, with duplicative investments and scattered adoption rather than consolidated platform
              demand.
            calloutType: risk
            claimRefs:
              - CM024
              - CM025
              - CM034
          - type: callout
            title: Multiple Procurement Fast-Lanes Exist
            body: >-
              The Tradewinds marketplace ($3.26B awarded, 51-day average PALT, 88% to non-traditional vendors), OTAs,
              and the Software Acquisition Pathway create viable fast-lane alternatives to traditional defense
              procurement, reducing the cycle time for a qualified software vendor to reach contract award.
            calloutType: strength
            claimRefs:
              - CM017
              - CM022
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and category taxonomy
        blocks:
          - type: paragraph
            body: >-
              Onebrief competes across a multi-layered defense planning and decision-support market. CB Insights
              identifies approximately 157 active competitors, of which 17 are well-funded. The competitive field
              segments into four categories: (1) defense-AI platform giants like Palantir (Gotham, AIP, Maven Smart
              System) and Anduril (Lattice OS), which approach planning as one module in a broader decision-superiority
              stack; (2) point-solution startups like Comand AI, Primer AI, and Hadean that tackle specific workflow
              sub-problems such as wargaming simulation or NLP-driven intelligence fusion; (3) legacy defense primes
              (Lockheed Martin, RTX/Raytheon, Northrop Grumman) whose incumbent C2 systems like CPOF, GCCS-J, and IBCS
              anchor decades of procurement relationships; and (4) the status-quo substitute — PowerPoint, Word, and
              SharePoint combined with manual MDMP processes that represent the functional baseline Onebrief must
              displace. The landscape is further complicated by European entrants like Helsing (valued at approximately
              €5B in 2025) and adjacent data-infrastructure players like Scale AI that are increasingly positioning for
              defense planning adjacencies. Understanding this taxonomy matters because Onebrief's direct competitive
              threat differs by category: platform bundlers compete on breadth and capital; point solutions compete on
              workflow specificity; primes compete on incumbency and switching cost; and the status quo competes on
              inertia and zero marginal cost.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
