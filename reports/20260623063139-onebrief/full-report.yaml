  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Onebrief is a web-based collaborative planning operating system designed to replace the military's legacy
              approach to operational planning, which historically relies on PowerPoint presentations, Word documents,
              and email chains passed among rotating staff members. The platform targets the Military Decision Making
              Process (MDMP) used by U.S. Army staffs and the Joint Planning Process (JPP) used at combatant command and
              joint task force levels. Rather than static documents that become outdated as soon as they are shared,
              Onebrief structures planning into real-time, auto-updating artifacts called "cards" that maintain data
              relationships across the entire planning cycle. When an intelligence assessment changes, dependent
              planning artifacts update automatically, eliminating the manual reconciliation that typically consumes
              hours of staff officer time. Users report a 70% reduction in planning cycle time and elimination of
              approximately 20 hours of weekly redundant work. The platform enables distributed collaboration across
              geographic boundaries and classification levels, allowing staffs in different headquarters to work
              simultaneously on shared planning products. This workflow transformation is critical because modern
              military operations demand decision speeds that exceed what manual, document-centric processes can
              deliver. Onebrief's stated vision is to enable "superhuman military command" by removing friction from the
              planning-to-execution cycle.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
