      - number: '3.3'
        title: Legacy primes and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              The defense prime contractors — Lockheed Martin, RTX (Raytheon), and Northrop Grumman — maintain
              decades-long incumbent positions in command-and-control systems. Lockheed's C4ISR portfolio includes the
              Command Post of the Future (CPOF, originally fielded 2005) and contributions to GCCS-J (Global Command and
              Control System – Joint). Northrop Grumman operates IBCS (Integrated Battle Command System) and large
              portions of the joint mission-planning infrastructure. RTX maintains battle-management systems across
              missile defense and air operations centers. These systems were designed for industrial-era operational
              tempo and are notoriously difficult to modify, but they are embedded in program-of-record budgets with
              multi-decade sustainment contracts. The primes collectively generate over $180B in combined annual defense
              revenue and employ hundreds of thousands of cleared personnel — resource advantages no startup can match
              directly. However, their weakness is architectural: legacy C2 systems are monolithic, disconnected between
              classification levels, and require months of training. The PowerPoint/SharePoint status quo is arguably
              Onebrief's most important competitor by install base. Military staffs have used slide decks for
              operational planning for decades. The switching cost from PowerPoint is psychological and procedural
              rather than financial — staff officers already know the tool, and changing operational workflows during
              deployment cycles carries risk. Onebrief's advantage against the status quo is speed and error reduction:
              collaborative real-time editing, auto-updating cross-references between planning products, and AI-assisted
              course-of-action development collapse weeks of staff work into hours.
