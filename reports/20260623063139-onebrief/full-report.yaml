              unicorn. In January 2026, Onebrief closed a $200 million Series D (primary and secondary) at a $2.15
              billion post-money valuation, led by Battery Ventures and Sapphire Ventures with participation from
              Salesforce Ventures, General Catalyst, and Insight Partners. On the same day as the Series D announcement,
              Onebrief acquired Battle Road Digital, a wargaming and simulation defense company. The 3.3x valuation
              increase from $650 million to $2.15 billion in twelve months is aggressive and warrants scrutiny regarding
              the sustainability of such step-ups given no public revenue disclosure.
