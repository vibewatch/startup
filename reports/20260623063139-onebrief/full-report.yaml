  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included/Excluded Spend
        blocks:
          - type: paragraph
            body: >-
              The relevant market for collaborative military planning and decision-support software encompasses
              command-and-control (C2) software platforms, operational planning tools, wargaming and simulation engines,
              and AI-enabled decision support for joint and combined operations. Included spend covers software
              licenses, SaaS subscriptions, integration services, and training for digital planning platforms used by
              military staffs at the operational and strategic levels. Hardware platforms (radars, satellites, weapons),
              pure munitions, and standalone autonomy systems are excluded because they serve different budget lines and
              acquisition authorities. The status-quo substitutes that this market displaces include PowerPoint-based
              briefing workflows, legacy Command Post of the Future (CPOF) terminals, the Global Command and Control
              System-Joint (GCCS-J), and manual staff processes that remain dominant across most headquarters.
              Adjacencies include broader C4ISR, signals intelligence platforms, and cyber operations tools, which share
              budget owners but address different operational problems. The market boundary matters for sizing because
              analyst reports range from narrow JADC2-specific software to broad C2 systems that include hardware,
              services, and networking infrastructure. Investors must understand which definition underpins each
              estimate to avoid conflating a $11B software-centric TAM with a $39B inclusive systems market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
