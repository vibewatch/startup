        title: DoD Budget, Continuing-Resolution, and Shutdown Risk
        blocks:
          - type: paragraph
            body: >-
              Onebrief derives effectively all disclosed revenue from U.S. Department of Defense programs, making it
              acutely sensitive to federal budget dynamics. CSIS analysis identifies that any continuing resolution (CR)
              at the start of a fiscal year freezes new contract obligations, prohibits new-start programs, and caps
              spending at prior-year levels — directly impacting software vendors whose growth depends on expanding task
              orders. The FY2026 defense budget faced significant CR risk through late 2025, and GAO's high-risk reports
              repeatedly flag DoD acquisition management as a persistent governance weakness. A full government shutdown
              further halts contract modifications, delays payments to contractors, and can trigger layoffs among
              cleared personnel who cannot be furloughed without jeopardizing their clearance status. For a company like
              Onebrief whose revenue base is concentrated in combatant-command operational budgets (OPA/RDTE line
              items), even a 60-day CR can effectively freeze pipeline expansion for an entire quarter. The macro risk
              is compounded by defense-budget uncertainty: while the topline has grown, the NDAA authorization process
              has experienced multi-year delays and sequestration threats in past cycles. Onebrief's reliance on OTA and
              SBIR/Tradewinds pathways — which offer faster awards but less funding durability than Programs of Record —
              amplifies vulnerability to annual appropriations disruptions.
            claimRefs:
