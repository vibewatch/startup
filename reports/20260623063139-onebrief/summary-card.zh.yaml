  topStrengths:
    - 在美国国防体系内采用深、粘性强：已嵌入 DoD 四大作战计划中的三个，并部署在 SIPR、NIPR、JWICS 等涉密网络。
    - 创始人与市场高度匹配，产品为规划人员原生设计，直接数字化 MDMP / Joint Planning Process，而不是把分析功能叠在旧式工作流上。
    - 投资人组合和融资动能强（General Catalyst、Insight、Battery、Sapphire、Salesforce Ventures），董事会具备国防履历，CTO Cory Ondrejka 也是资深技术负责人。
    - 借 Battle Road Digital 收购把平台延伸到兵棋推演 / 仿真，并通过 Second Front 在 DAF CLOUDworks 上完成合规部署。
  topRisks:
    - 估值 12 个月内升至 $2.15B，涨幅 3.3 倍，但收入、ARR、毛利率、烧钱速度均未公开，基本面很难支撑该标记。
    - 收入集中在美国 DoD 这一单一买方生态，受持续决议、政府停摆和项目拨款风险影响；涉密不透明也限制了采用声明的核验。
    - Palantir、Anduril 等资金充足的竞争者和主承包商可能把规划能力打包销售，挤压这一聚焦型点解决方案。
    - 技术与认证风险仍在：AI 用于生命攸关规划的可靠性、ATO 维护、对 Second Front 部署的依赖，再叠加 CEO 关键人风险。
  unresolvedGaps:
    - 收入、ARR、增长率、毛利率、烧钱速度和现金跑道均未披露。
    - 准确员工数、客户数、合同金额以及续约 / 留存经济性未公开。
    - 具名客户和作战司令部采用的精确范围大多涉密，公开来源无法核验。
    - 股权结构表条款、Series D 的老股成分、清算优先权，以及 $2.15B 标记是否给新投资人留下干净经济性。
