  topStrengths:
    - 产品表面真实存在，覆盖消费者 app、网页、模板、API 与实时世界模型研发，而不是单一 demo 模型。
    - 对一家成立两年的中国 AI 视频初创来说，公开融资动能异常强，最终落到由 CDH 领投的 $300M Series C。
    - 据报道的规模标记（>100M 用户、>16M MAU、>$40M ARR 下限）如果经验证，就有意义，足以支持继续尽调而不是直接放弃。
    - PixVerse 出现在独立 benchmark 和消费者 app 生态里，说明产品故事不只是公司自己的营销。
  topRisks:
    - 公开证据仍无法对齐 March 2026 轮融资的精确投后估值、优先股堆叠或证券质量。
    - '>$40M ARR 数字与公司口径有关且未经审计，收入究竟是耐久的企业 / API 支出，还是更脆弱的创作者需求，仍未说清。'
    - AI 视频竞争仍激烈，OpenAI、Runway、Kling、Wan、Hailuo、Jimeng/Seedance 与 Pika 都在场，定价权和锁定效应受限。
    - 即便用户增长保持强劲，中国监管、标识、版权与先进算力依赖风险也可能压低变现和毛利质量。
  unresolvedGaps:
    - 按产品表面拆分的经审计 ARR 桥、渠道组合、毛利率与单位经济性仍未披露。
    - March 2026 条款清单、投后股权结构表、清算瀑布与附函未公开。
    - 公开来源未披露付费客户数、留存 / NRR 或头部客户集中度。
    - 董事会构成、合规审计材料与详细信任安全落地，在已抓取记录中仍不完整。
