companyProfile:
  summary: >-
    AIsphere (北京爱诗科技有限公司) is a Beijing-based generative-video startup founded in April
    2023 around founder and CEO Wang Changhu, with co-founder Xie Xuzhang publicly visible in
    2026 financing coverage. Its flagship product, PixVerse, spans text-to-video, image-to-video,
    creator templates, mobile distribution, enterprise-style APIs, and a real-time world-model
    track through PixVerse R1. Public financing moved quickly from large Series A fundraising in
    2025 to an Alibaba-led Series B and a CDH-led $300 million Series C in March 2026. The public
    case for the company is therefore real and scaled, but still under-documented on revenue
    quality, margin structure, governance, and security terms.
  foundedDate: '2023-04-07'
  founders:
