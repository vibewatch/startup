  topStrengths:
    - Real product surface across consumer app, web, templates, APIs, and real-time world-model R&D rather than a single demo model.
    - Public financing momentum is exceptional for a two-year-old China AI-video startup, culminating in a CDH-led $300M Series C.
    - Reported scale markers (>100M users, >16M MAU, >$40M ARR floor) are meaningful if validated and support continued diligence rather than dismissal.
    - PixVerse appears in independent benchmark and consumer-app ecosystems, suggesting the product story is broader than company-only marketing.
  topRisks:
    - Public evidence still does not reconcile exact post-money valuation, preference stack, or the security quality of the March 2026 round.
    - The >$40M ARR figure is company-linked and unaudited, leaving open whether revenue is durable enterprise/API spend or more fragile creator demand.
    - AI-video competition remains intense across OpenAI, Runway, Kling, Wan, Hailuo, Jimeng/Seedance, and Pika, limiting pricing power and lock-in.
    - China regulatory, labeling, copyright, and advanced-compute dependency risks could impair monetization or margin quality even if user growth stays strong.
  unresolvedGaps:
    - Audited ARR bridge, channel mix, gross margin, and unit economics by product surface remain undisclosed.
    - March 2026 term sheet, post-money cap table, liquidation waterfall, and side letters are not public.
    - Public sources do not disclose paying-customer count, retention / NRR, or top-customer concentration.
    - Board composition, compliance audit artifacts, and detailed trust-and-safety implementation remain incomplete in the fetched record.
