    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and product scope
        blocks:
          - type: paragraph
            body: >-
              AIsphere is publicly traceable as Beijing Aishi Technology Co., Ltd. (北京爱诗科技有限公司), a Beijing-based startup
              founded in April 2023. The official corporate site describes the company as building world-leading AI
              video generation large models and applications, while PixVerse serves as the outward-facing product layer
              for both consumer creation and enterprise API workflows. Public launch coverage shows PixVerse entering
              the overseas market in early 2024, and the official product surface now spans web, mobile, templates,
              APIs, and world-model research. That combination matters because AIsphere is not presenting itself as a
              one-off demo app; it is positioning itself as a vertically integrated video-model company with proprietary
              foundation-model R&D, distribution surfaces, and monetizable creation tooling. The fetched evidence also
              shows the company actively maintaining separate consumer, blog, app-download, and enterprise-facing
              surfaces, which strengthens confidence that the product footprint is operational rather than aspirational.
