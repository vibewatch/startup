      - number: '7.5'
        title: Capital and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Capital risk is real even after the Series C because fresh financing does not answer the core underwriting
              questions. Public evidence shows AIsphere raising $300 million and pushing into larger product surfaces,
              but burn, runway, customer payback, top-customer concentration, and retained gross-margin profile remain
              undisclosed. That matters because PixVerse's pricing is explicitly credit-based and low-friction, which
              can accelerate adoption while masking whether heavy usage translates into durable contribution margins
              once compute and support costs are fully allocated. Execution risk also sits higher than the company's
              growth narrative might suggest. The organization now needs a leadership bench that can support compliance,
              trust and safety, partner enablement, enterprise support, cloud operations, and legal oversight at the
              same time. Yet public materials mostly emphasize product velocity rather than the staffing depth behind
              those functions. The result is a mid-to-high risk bucket: financing strength reduces immediate insolvency
              concern, but incomplete operational and financial disclosure means investors still cannot test whether
              AIsphere can convert consumer-scale momentum into durable, compliant, and economically attractive
