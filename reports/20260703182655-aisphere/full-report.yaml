          detail: Chinese AI and AI-video appetite still helps comp marks, but it is not a company-specific moat.
          tone: neutral
        - label: Benchmark durability
          value: 3
          detail: Competitive first-tier performance matters, but a narrow product gap alone does not solve monetization risk.
          tone: neutral
