    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      AIsphere scores well on strategic relevance and product credibility, but poorly on evidence depth and security
      visibility.
    data:
      items:
        - label: Strategic market timing
          value: 7
          max: 10
          note: The AI-video and Chinese AI capital narrative remains supportive in 2026.
        - label: Product credibility
          value: 7
          max: 10
          note: PixVerse is independently benchmarked and looks first-tier rather than speculative.
        - label: Monetization surface
          value: 6
          max: 10
          note: Consumer, API, and enterprise-style surfaces exist, but the mix is not fully visible.
        - label: Revenue-quality visibility
          value: 3
          max: 10
          note: No public revenue bridge, cohort metrics, or audited recurring-revenue detail.
        - label: Security-term visibility
          value: 2
          max: 10
          note: Preference stack and post-money ownership effects remain private.
        - label: Relative valuation comfort
          value: 4
          max: 10
          note: The mark is understandable, but not clearly attractive on today's evidence.
    approximationNotes: Scores are IC-style heuristics based on retained evidence as of the run date; they are not management KPIs.
