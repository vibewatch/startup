  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              AIsphere's risk stack is led by three issues that can compound rather than appear in isolation. First,
              PixVerse is a public AI-video product with Chinese and international surfaces, so China's generative-AI
              and labeling rules are not theoretical background: they directly govern content labeling, complaint
              handling, personal-information duties, and potential service suspension if regulators view controls as
              insufficient. Second, frontier video quality and low-latency inference still depend on advanced computing
              and cloud infrastructure, leaving AIsphere exposed to U.S. export-control tightening, NVIDIA supply
              limits, and concentration around Alibaba Cloud-backed global deployment. Third, the company sits inside
              the unresolved copyright zone facing the broader generative-AI industry, where training-data provenance,
              output ownership, and licensed IP usage remain contested. Below that top tier sit model-quality and
              consumer-distribution fragility, since app-store scale and leaderboard status can reverse quickly in AI
              video, followed by capital and execution risk because AIsphere has ample fresh financing but little public
              disclosure on burn, customer concentration, or compliance staffing. The risk picture is therefore best
              understood as a transmission chain from regulation and supply into product reliability, enterprise trust,
              margin quality, and eventually valuation.
            claimRefs:
              - CR036
              - CR041
              - CR042
              - CR043
              - CR045
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR041
