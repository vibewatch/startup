      - number: '2.3'
        title: Buyer, user, and payer are fragmented across five economically different segments
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more fragmented than a casual “creator app” label suggests. Individual creators are real
              users, and Google Play plus PixVerse's blog make clear that templates, viral effects, and mobile workflows
              can attract bottom-up adoption. But TBRC also names marketing and social-media use cases, and Vidu
              explicitly sells into ad and storytelling workflows, so marketers and SMBs are another budget owner. Media
              and IP holders form a third segment because branded content, licensed templates, and collaborative
              production processes require workflow control beyond one-off consumer prompts. Developers and API teams
              are separate again: PixVerse's R1 partner program targets studios, platform developers, and tool builders,
              while Runway markets a real-time Characters API. Finally, enterprise and governed teams buy differently
              from casual creators. They care about control, deployment model, team access, and contract packaging. In
              practice, that means the chapter has to distinguish user from buyer and buyer from payer: the end creator
              may love a product, but the economic decision often sits with a marketing lead, studio operations owner,
              platform product manager, or enterprise procurement function.
