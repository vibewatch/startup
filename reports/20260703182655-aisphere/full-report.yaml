  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, substitutes, internal build, and likely entrants'
        blocks:
          - type: paragraph
            body: >-
              AIsphere's competitor set is unusually broad because buyers can solve the same job in several ways. The
              narrowest direct-peer bucket is creator-facing AI video generation: Runway, OpenAI Sora, Kling, Vidu,
              Hailuo, Wan, Jimeng/Seedance, and Pika all market some combination of text-to-video, image-to-video,
              audio, or controllable cinematic workflows. Those are the cleanest substitutes when a creator, studio, or
              prosumer wants a packaged video-generation product rather than a general chatbot. Benchmark sources
              further show that Chinese labs and apps now dominate much of the quality frontier: Artificial Analysis
              currently places ByteDance Seedance above Kling, Vidu, Wan, and PixVerse on multiple leaderboards, while
              Hailuo, Grok, LTX, and Veo keep adding more alternatives at different price points. That means PixVerse is
              competing inside a dense and rapidly iterating global field rather than a niche category it can name by
              itself.


              The market boundary is even wider once substitutes are included. Internal build is credible because the
              benchmark field already includes open-weight models such as LTX-2.x and Wan variants, which gives
              sophisticated teams a self-hosted option instead of a subscription product. Model-routing platforms are
              another substitute: Runway now bundles third-party models like Kling, Seedance, and Veo inside its own
              paid plans, while Pika's MCP and agent positioning openly promise access to “all the models.” Finally,
              likely entrants do not have to launch a standalone video app to matter. Generalist labs such as OpenAI and
              Moonshot can pull developers into broader agent or assistant ecosystems, while OS-level or distribution
              incumbents can win simply by becoming the default surface where creation already happens. For AIsphere,
              that makes the real question less “who else makes AI video?” and more “which surfaces own the user, the
              workflow, and the routing layer around AI video?”
            claimRefs:
