      - number: '2.4'
        title: Growth drivers are expanding the category from clip generation into broader production workflows
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are clear and fairly well corroborated. TBRC explicitly names the expansion
              of social media and digital platforms as a demand driver, and both market publishers point to automated
              editing, personalized marketing, collaboration, and cloud workflows as tailwinds. Official product
              surfaces suggest why. PixVerse now markets a world engine with long-horizon generation, real-time 1080p,
              and production-ready APIs; Runway pushes general world models and interactive video characters; Pika
              pushes agents and workflow automation. These are not just prettier clip generators. They are attempts to
              move video AI into repeatable workflows, interactive experiences, and software budgets that can scale
              beyond novelty. Pricing design also helps adoption. PixVerse exposes low-dollar, credits-based creation
              economics, while Runway offers free entry, prosumer subscriptions, and enterprise custom packaging. That
              mix supports a classic land-and-expand path: creators can test cheaply, teams can formalize workflows, and
              enterprises can negotiate larger deployments once the output is good enough and operationally reliable.
