  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      A scenario band is more defensible than a single-point target because price support depends on evidence that is
      still missing.
    data:
      items:
        - label: Bear case
          low: 550
          mid: 650
          high: 750
          displayValue: $0.55B-$0.75B
          detail: ARR quality disappoints or sector multiples compress before better disclosure arrives.
          tone: negative
        - label: Base case
          low: 850
          mid: 975
          high: 1100
          displayValue: $0.85B-$1.10B
          detail: Commercial reality holds up, but evidence and terms remain only partly disclosed.
          tone: warning
        - label: Bull case
          low: 1400
          mid: 1600
          high: 1800
          displayValue: $1.4B-$1.8B
          detail: Audited economics, cleaner enterprise mix, and sustained first-tier product proof justify upside.
          tone: positive
    approximationNotes: >-
      Ranges are editorial scenario estimates derived from disclosed ARR floors, comp brackets, and disclosure quality
      rather than from a DCF or exit-model precision exercise.
