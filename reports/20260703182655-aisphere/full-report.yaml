  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: generative video AI is a workflow layer, not the whole AI economy'
        blocks:
          - type: paragraph
            body: >-
              The most important discipline in this chapter is defining the boundary before sizing anything. The narrow
              market here is not all generative AI, and it is not all media software. TBRC defines generative AI in
              video creation as the use of generative models to create, edit, or enhance video content, while both TBRC
              and Research and Markets segment that category by deployment, application, and end-user. Those definitions
              capture text-to-video, image-to-video, editing and enhancement, collaboration, and cloud or on-premise
              delivery. They do not justify counting upstream GPU training spend, generic hyperscaler AI revenue, or
              non-AI production software as direct market revenue for video-creation vendors. The official surfaces of
              PixVerse, Runway, Pika, Vidu, Kling, Jimeng, and Wan also show that the competitive set now spans consumer
              creation tools, workflow platforms, and API products. That matters for AIsphere because the company sits
              inside a real but narrower wedge of the AI economy: creative-video generation and the workflows
              immediately around it, not the entire foundation-model stack.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
