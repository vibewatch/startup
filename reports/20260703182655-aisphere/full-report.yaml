              - CR045
      - number: '7.2'
        title: Legal and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              Legal and regulatory exposure is AIsphere's clearest top-tier risk because PixVerse combines exactly the
              features that regulators are trying to discipline: public-facing generative video, real-time interaction,
              user-uploaded content, and growing API distribution. China's interim measures apply to public
              generative-AI services that generate text, images, audio, video, or other content, require lawful
              training-data sources, and explicitly mandate labeling obligations through the deep-synthesis regime. The
              2025 labeling measures add both explicit user-facing marks and implicit metadata requirements, while also
              pushing providers toward complaint handling, user agreements, logging, and content-safety controls. For
              AIsphere, that creates a concrete implementation burden rather than a remote policy headline because
              PixVerse markets Chinese and global web surfaces, consumer apps, and production workflows. Export controls
              are the second major legal vector: BIS clarified in 2026 that advanced-computing items still require
              licenses for China-linked entities, so any tightening in frontier GPU access can flow straight into model
              cadence and service economics. The third legal vector is copyright. Generative-AI litigation in the United
              States still leaves open questions around training-data fair use, output ownership, and downstream
              liability, and AI-video products face additional exposure when they market branded or character-based
              outputs. AIsphere has started to experiment with licensed-IP infrastructure, which is directionally
              helpful, but public evidence does not yet show a mature, audited legal-control stack.
            claimRefs:
              - CR001
