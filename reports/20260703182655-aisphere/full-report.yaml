      - number: '7.3'
        title: Operational, Model-Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, AIsphere is no longer just a consumer effects app. Its public materials now describe a
              production platform, real-time world-model features, and an API partner program, which expands the failure
              surface across latency, moderation, partner support, and enterprise reliability. Real-time video matters
              here because continuous interaction is harder to label, review, and moderate than one-off clip generation,
              especially once user prompts, uploads, and downstream distribution all happen at scale. Public evidence
              supports strong momentum rather than mature operational disclosure: Artificial Analysis shows PixVerse
              among leading video-model vendors, AppBrain shows very large mobile adoption, and the company highlights
              broad feature breadth. What is missing is just as important. Public sources do not show a robust incident
              history, enterprise SLA schedule, or implementation evidence for compliance operations across China and
              international markets. Dependence on cloud and infrastructure vendors also deserves attention. Comparable
              public-cloud filings from Cloudflare, Datadog, and Snowflake all warn that outages, security incidents,
              and third-party infrastructure failures can damage availability and customer trust. AIsphere is unlikely
              to be exempt from those dynamics; if anything, fast product expansion and real-time video raise the
              operational bar further. The result is a risk profile where reliability, moderation, and security are not
              known weak points today, but are materially under-documented relative to the ambition of the product
              roadmap.
