        title: Exhibits
        blocks:
          - type: callout
            title: No single TAM survives contact with scope
            body: >-
              The narrow generative-video market is a real category, but it is vastly smaller than the broader
              generative-AI stack. Keeping both frames visible is more honest than pretending one number answers every
              market-sizing question.
            calloutType: insight
            claimRefs:
