            body: >-
              AIsphere’s own materials hint at why the margin path is still the core financial question. Credit pricing
              rises with resolution, duration, audio, and faster generation, which means the customer-facing tariff
              already reflects variable resource intensity. The product roadmap then moves further toward expensive
              workloads: real-time 720p API access for partners, continuous shared worlds, multi-user sessions, and
              official claims of real-time 1080p output. None of that proves weak unit economics, but it does show that
              the highest-value use cases are probably also the most compute-hungry. Public-company filings are helpful
              here as analogies, not as substitutes for company data. Datadog discloses cloud-hosting costs in cost of
              revenue, Cloudflare discloses network and equipment-serving costs, Snowflake warns about minimum cloud
              commitments, and NVIDIA frames cost per token as a live infrastructure battle. Against that backdrop,
              AIsphere’s lack of disclosed gross margin, compute commitments, or working-capital profile is material.
              The economics may improve with better hardware and routing, but public evidence does not yet prove they
