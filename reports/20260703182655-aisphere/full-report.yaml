  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - A down round or heavy structured financing
        - New capital prices below the implied unicorn level or adds aggressive senior preferences
        - Shows that the current headline mark overstated outside support or overstated security quality.
        - Move from research-more to avoid / wait-for-reset unless terms improve dramatically.
      - - Weak revenue bridge
        - >-
          Recognized revenue, ARR composition, or API/enterprise mix does not support the >$40M headline in quality
          terms
        - Breaks the thesis that scale signals are converting into durable software economics.
        - Re-rate valuation into the bear band.
      - - Thin paid-customer quality
        - Low paid conversion, weak renewals, or high concentration behind the user headline
        - Turns product popularity into a weaker monetization story than the valuation assumes.
        - Require a lower entry price or milestone-based structure.
      - - Benchmark slippage
        - PixVerse loses first-tier status or falls meaningfully behind on quality/cost tradeoffs
        - Undercuts the argument that product competitiveness can sustain premium pricing.
        - Reduce bull-case probability and compress acceptable multiple.
      - - Sector multiple compression
        - Hong Kong or private-market appetite for Chinese AI cools materially
        - Removes scarcity support that currently props up private and newly public comps.
        - Shift posture from diligence to wait-for-repricing.
    notes: >-
      These are valuation-specific kill criteria linked to entry price and security quality rather than a general risk
      register restatement.
    claimRefs:
      - CV027
      - CV028
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue bridge
        - Monthly bookings, ARR, deferred revenue, and recognized revenue by consumer, API, and enterprise channels
        - >-
          Determines whether the >$40M ARR headline supports a software-quality multiple or only a promotional scale
          story.
        - Finance team, board materials, and auditor pack.
      - - Cap table and preference stack
        - Post-Series C capitalization table, liquidation waterfall, anti-dilution, and side-letter economics
        - Defines security quality and true downside at the current headline valuation.
        - Company counsel and financing document review.
      - - Unit economics
        - Gross margin by product surface, compute cost per video minute, support burden, and cloud commitments
        - Tests whether AI-video usage can scale profitably rather than just visibly.
        - FP&A, infrastructure, and cloud-contract review.
      - - Cohort quality
        - Paid customer count, NRR, churn, expansion, and concentration by top accounts
        - Separates user scale from durable recurring revenue quality.
        - Revenue operations and billing exports.
      - - Enterprise/API proof
        - Named enterprise accounts, API revenue share, contract terms, and renewal history
        - Shows whether AIsphere deserves to be valued closer to workflow/API peers than to consumer novelty tools.
        - Sales leadership plus top-customer contract sampling.
      - - Next-round / exit path
        - Timing and structure of the next financing, secondary, or listing plan
        - Current private marks are partly supported by a favorable AI funding and Hong Kong issuance window.
        - Board, lead investors, and banking advisors.
    notes: >-
      These asks are prioritized by how quickly they would change the recommendation or acceptable entry price, not by
      how easy they are to obtain.
    claimRefs:
      - CV037
