      - number: '2.2'
        title: Multiple sizing lenses are necessary because the published numbers measure different things
        blocks:
          - type: paragraph
            body: >-
              Public sizing only becomes usable once the chapter preserves multiple lenses instead of forcing one
              headline TAM. The narrowest lens comes from the dedicated generative-video reports: TBRC says the market
              reached $0.39 billion in 2025, grows to $0.47 billion in 2026, and reaches $0.98 billion in 2030; Research
              and Markets uses the same $0.47 billion 2026 starting point and the same $0.98 billion 2030 end point.
              That is a small market relative to the broader generative AI complex, where Fortune Business Insights
              estimates $103.58 billion in 2025, $161 billion in 2026, and more than $1.26 trillion by 2034. Those
              numbers are not contradictory so much as scope-mismatched: one measures a narrow application layer and the
              other measures a huge cross-modal technology stack. A third lens is adoption rather than revenue. a16z
              says AI video became fairly dependable for short clips and highlights video companies moving into the top
              consumer AI rankings, while Artificial Analysis shows enough convergence in quality and enough spread in
              pricing to support experimentation and buyer shopping. For diligence, the right answer is a range of
              frames, not a fake single TAM.
