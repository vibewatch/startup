              Scenario analysis is more defensible here than a single-point target. In the bull case, AIsphere would
              turn the public ARR and user claims into a cleaner audited bridge, prove that enterprise/API economics are
              meaningful, and keep PixVerse competitive enough that the company still benefits from sector-level
              scarcity. Under that fact pattern, a valuation in roughly the $1.4 billion to $1.8 billion range is
              supportable. In the base case, the public commercial story proves directionally real but not cleanly
              underwritten: ARR is real yet partly creator-heavy, margins remain hard to assess, and terms stay private.
              That supports something like $0.85 billion to $1.1 billion, which makes the current headline mark closer
              to fair-to-stretched than obviously cheap.


              The bear case is a double hit. If paid conversion, enterprise quality, or API depth disappoints at the
              same time that AI-video scarcity premiums cool, the valuation could compress toward roughly $0.55 billion
              to $0.75 billion. That does not require the company to fail. It only requires investors to decide that a
              still-opaque AI-video startup should no longer be valued like the most exuberant peers. This is why entry
              discipline matters more than narrative enthusiasm: the upgrade path is better evidence or a better price,
              ideally both.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
