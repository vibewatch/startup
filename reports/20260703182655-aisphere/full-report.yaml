      - number: '8.2'
        title: Comparable set and where AIsphere actually sits
        blocks:
          - type: paragraph
            body: >-
              The best way to read AIsphere's implied mark is as a middle position inside a frothy but internally
              stratified comp set. Runway is the closest private AI-video workflow comp: TechCrunch says it raised at a
              $5.3 billion valuation in February 2026, while Sacra estimates $90 million of annualized revenue in 2025,
              implying roughly a 59x revenue multiple. Pika sits much lower at about a $470 million valuation, but
              public sources do not disclose its revenue cleanly enough to produce a reliable multiple. At the high end,
              Moonshot's May 2026 round and April ARR disclosure imply something like a 100x ARR floor, while MiniMax's
              Hong Kong IPO valuation against reported revenue and losses shows that public markets were willing to
              underwrite very rich Chinese AI multiples as long as narrative momentum held.


              AIsphere is cheaper than those hotter comps on the headline arithmetic, but it is also weaker on proof.
              Independent benchmarks place PixVerse V6 in the competitive first tier, not the clearly dominant slot, and
              the category remains crowded enough that buyer switching is real. The public record also lacks the
              enterprise-quality disclosure that later-stage software or infrastructure investors would normally demand.
              That is why the right takeaway is not “AIsphere is cheap because 25x is below 59x or 100x.” The better
              takeaway is that the market may be giving AIsphere a disclosure discount for good reason, even while
              conceding that the company has real scale and a credible product.
