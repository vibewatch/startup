  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and the implied ARR multiple
        blocks:
          - type: paragraph
            body: >-
              AIsphere has enough evidence to support a valuation discussion, but not enough to support a clean price.
              Multiple March 2026 reports independently confirm a $300 million Series C and repeat the same commercial
              shorthand: AIsphere had surpassed $40 million in ARR, more than 100 million users, and over 16 million
              monthly active users. Those are meaningful scale markers for an AI-video startup. They also fit the
              earlier report framing that the company is directionally a unicorn-level asset after the round. The
              problem is that none of the retained public sources fully reconcile the exact post-money, the cap-table
              effects, or the economics of the security being sold.


              That uncertainty matters because it changes how to read the headline multiple. If the company was marked
              at roughly $1 billion and ARR merely exceeded $40 million, the implied headline multiple is around 25x ARR
              or lower because the disclosed ARR number is only a floor. On the surface that is less aggressive than the
              hottest AI-video and Chinese AI scarcity comps. But the discount is not obviously a bargain. It mostly
              compensates for weak visibility into revenue quality, paid-customer mix, gross margin, and preference
              structure. In other words, AIsphere looks investable enough to stay on the funnel, but not transparent
              enough to treat the current headline price as self-validating.
            claimRefs:
