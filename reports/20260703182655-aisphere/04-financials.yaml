- id: capital-adequacy-and-financing-dependency
  title: 'Capital adequacy and financing dependency: fresh capital lowers near-term risk but does not clear runway'
  body: 'AIsphere is not presenting like a capital-starved pre-product startup. Multiple March 2026 reports independently place the latest round at $300 million, describe it as a record financing for China’s AI-video segment, and say the proceeds are for R&D, new-business exploration, and global expansion. AI Insider adds the now-familiar unicorn framing, while KrASIA says the founder believes subscription revenue already covers costs. Those signals matter because they lower immediate survivability risk and suggest investors are comfortable funding world-model ambitions. But the underwriting ceiling is still low. No fetched source discloses cash on hand, monthly burn, runway, debt, cloud commitments, or the exact next-round trigger. Even the strongest positive evidence remains directional rather than balance-sheet specific. Runway’s February 2026 $315 million round at a $5.3 billion valuation is useful context: frontier AI-video peers can still require very large financings even after proving demand. AIsphere’s latest raise is therefore a buffer, not proof that the company has escaped financing dependency.'
