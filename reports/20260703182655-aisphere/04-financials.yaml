- id: TI003
  title: Unit economics table
  columns:
  - metric
  - value / null
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Official starter-pack price anchor
    - $0.20 per V6 720p 5s no-audio video (derived from $1 = 5 videos)
    - Medium
    - Gives the clearest public unit-price floor, but not the realized mix or enterprise rate card
    - Provide realized ASP by consumer plan, enterprise contract, and API workload.
  - - Public ARR
    - '>$40M (reported)'
    - Medium
    - Shows the business is likely monetizing at meaningful scale, but not how durable or profitable that revenue is
    - Provide monthly revenue bridge, deferred revenue, and auditor-reviewed recognition policy.
  - - Public user base
    - '>100M users (reported / claimed)'
    - Medium
    - Large funnel size helps explain investor appetite and freemium-style monetization potential
    - Break users into registered, active, paying, and retained cohorts by geography.
  - - Public monthly active users
    - '>16M MAU (reported)'
    - Medium
    - MAU is a useful engagement proxy, but not a substitute for paying accounts or revenue retention
    - Provide MAU to payer conversion, payer churn, and share of MAU on paid plans.
  - - Official platform scale claim
    - 100M+ users, 175+ countries, 2B+ generated videos (company-claimed)
    - Medium
    - High usage can help data flywheels and distribution, but it may also raise compute and moderation costs
    - Disclose paid vs unpaid generation share and support or moderation cost per active user.
  - - Founder-reported profitability marker
    - Subscription revenues cover costs
    - Low
    - Potentially important if true, but the claim is not audited and does not specify whether it excludes R&D or stock comp
    - Provide GAAP and non-GAAP contribution margin by major product line.
  - - Gross margin / NRR / enterprise customer count
    - null
    - Low
    - These are the core quality metrics needed to judge whether AIsphere behaves like a durable software business
    - Provide gross margin, NRR, top-customer count, large-account thresholds, and cohort retention.
