- id: gtm-proxies-and-revenue-quality
  title: 'GTM proxies and revenue quality: the funnel is broad, but contract quality is opaque'
  body: The public go-to-market picture is broader than a single consumer app. Google Play copy, app-download flows, and A16Z’s consumer ranking still point to a creator-led top funnel, while the production-platform, Canvas, and R1 partner-program updates show AIsphere trying to convert that attention into teams, developers, studios, streaming platforms, and tool builders. Team Plan features such as consolidated billing and pooled credits are classic organizational upsell mechanics, and the partner program is explicitly selective, with engineering-capacity requirements and roadmap access that look closer to enterprise sales than to self-serve checkout. The traction proxies are meaningful but still uneven in quality. March 2026 coverage repeatedly echoed ARR above $40 million, more than 100 million users, and more than 16 million MAU; PR and official posts add 175-plus countries and two billion generated videos. Those numbers make the company look commercially real, but they do not answer how many customers actually pay, how often they renew, what ACVs look like, or whether usage is durable enough to support software-like retention.
