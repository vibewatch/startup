tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current value/status
  - quality
  - diligence ask
  rows:
  - - Consumer credit or subscription spend
    - Users pay through PixVerse plans and credit balances to generate clips on the consumer surface
    - Per month / per credit / per clip
    - Official pricing docs expose credit-based list pricing and monthly plan structures, but actual paid-user conversion is undisclosed
    - Medium for existence, low for realized yield
    - Provide paying-user count, conversion rate, refund rate, and net revenue per active payer by plan.
  - - Prepaid credit top-ups
    - Customers buy one-off credit packs for additional generation volume
    - Per pack / per credit
    - Official docs show pack denominations from $50 to $5,000, implying wallet-style upsell
    - Medium for packaging, low for demand quality
    - Disclose top-up frequency, share of revenue from packs versus subscriptions, and breakage policy.
  - - API or developer-platform usage
    - Developers or product teams integrate generation through the public platform and API surfaces
    - Per generation / usage contract
    - Platform pages and docs show API positioning, but realized API price and volume are not public
    - Medium for surface existence, low for economics
    - Provide API tariff card, committed-volume terms, and margin by model family.
  - - Team workspace billing
    - Organizations buy pooled credits, admin controls, and shared workspaces through Team Plan
    - Per seat / pooled credits / org subscription
    - Official production-platform update confirms consolidated billing and pooled credits; no public rate card for teams was fetched
    - Medium for feature existence, low for pricing clarity
    - Provide team-plan seat pricing, overage rules, and average organization spend.
  - - Selective R1 partner contracts
    - Studios, streamers, and tool builders integrate real-time video via gated partner access
    - Negotiated contract / usage commitment
    - Official partner-program post says pricing is favorable and grandfathered for early partners, but no public numbers are disclosed
    - Medium for GTM motion, low for monetization visibility
    - Provide partner count, average contract value, committed volume, and support burden.
  - - Vertical workflow tools and commercial production services
    - Mini Apps and workflow tooling target ads, marketing, and other production use cases
    - Per campaign / per workflow / enterprise contract
    - Official workflow posts show productized commercial tooling, but no public segment revenue is broken out
    - Low to medium
    - Disclose whether vertical tools monetize via standalone SKU, usage uplift, or enterprise bundle expansion.
  notes: Rows separate publicly visible monetization surfaces from still-undisclosed realization data. Presence of a product surface does not prove its revenue contribution.
