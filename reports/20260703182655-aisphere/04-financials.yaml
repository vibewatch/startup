chapter:
  number: 4
  title: Financials
  summary: 'AIsphere now shows a real public monetization surface: PixVerse exposes credit-based video pricing, team-workspace features, API positioning, and a selective partner program, while multiple 2026 reports repeat that ARR exceeded $40 million. The same record still fails the underwriting test because realized pricing, customer concentration, gross margin, cash, burn, runway, and debt remain undisclosed; public filings from Cloudflare, Datadog, Snowflake, Adobe, and NVIDIA mainly serve as context for the metrics AIsphere does not publish.'
sections:
- id: pricing-and-revenue-surfaces
  title: 'Pricing and revenue surfaces: list pricing exists, realized economics do not'
  body: 'Unlike many private AI startups, AIsphere does expose a visible commercial surface. PixVerse runs a public platform site, an official pricing document, consumer app flows, and 2026 product updates that describe team billing, pooled credits, API access, and partner programs. The strongest official pricing fact is simple and useful: the docs say $1 equals five V6 videos at 720p, five seconds, and no audio on the Starter pack. The same page meters usage by model, resolution, duration, audio, and motion mode, and it also shows larger credit packs and higher-tier plans. That is enough to conclude that AIsphere has moved beyond pure hype into a real credit economy. It is not enough to conclude what investors ultimately care about. Public materials still do not reveal realized enterprise pricing, discounting, refunds, conversion from free to paid, or segment revenue mix between consumer subscriptions, prepaid credits, API usage, and negotiated contracts. The fetched record therefore proves monetization intent and some list pricing, but not revenue quality.'
