- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - public value / status
  - confidence
  - implication
  - diligence ask
  rows:
  - - Latest disclosed financing
    - $300M Series C in March 2026
    - Medium
    - Provides a meaningful near-term capital buffer for R&D and expansion
    - Obtain close memo, cash received date, and post-money ownership effects.
  - - Stated use of funds
    - R&D, new-business exploration, and global expansion
    - Medium
    - Shows proceeds are intended for growth rather than only balance-sheet repair
    - Request 12- to 24-month budget by compute, personnel, sales, and international infrastructure.
  - - Investor breadth
    - 20+ institutions reported; CDH-led round with domestic and overseas investors
    - Medium
    - Broad participation lowers single-investor risk and may support future financing access
    - Provide board rights, pro-rata obligations, and any strategic-commercial side letters.
  - - Founder-reported operating coverage
    - KrASIA says subscription revenues cover costs
    - Low
    - Helpful directional signal, but insufficient to infer full-company profitability or cash generation
    - Provide audited income statement and definition of “costs” used in the founder statement.
  - - Cash on hand
    - null
    - Low
    - Without cash, investors cannot estimate solvency or strategic flexibility
    - Provide latest unrestricted cash, restricted cash, and short-term investments.
  - - Monthly burn and runway
    - null
    - Low
    - The single largest missing input for financing dependency
    - Provide current burn, scenario runway, and monthly compute spend by workload.
  - - Debt, leases, and cloud commitments
    - null
    - Low
    - Commitments can make a seemingly asset-light AI company meaningfully more fixed-cost than it appears
    - Disclose debt, leases, minimum cloud commitments, and hardware-financing obligations.
  - - Next-round trigger
    - null
    - Low
    - Investors need to know whether growth, model training, or infrastructure scale will force another raise soon
    - Provide the internal trigger metrics for raising again, including user, revenue, and compute thresholds.
  notes: Public evidence proves fundraising access, not capital adequacy. The missing cash, burn, and commitment rows are the real diligence blockers.
