- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on judgment
  - exact diligence path
  rows:
  - - Revenue mix by consumer, team, API, and partner contracts
    - Prevents any clean view of concentration, quality, and dependence on low-value consumer usage
    - Request monthly revenue bridge by product line and geography with paying-account counts.
  - - Realized enterprise pricing and discount bands
    - Prevents translating visible list prices into actual contract economics
    - Review top 20 contracts, rate cards, discount approvals, and overage schedules.
  - - Gross margin and compute COGS
    - Prevents judging whether real-time AI video is scaling profitably or only growing usage
    - Request model-level serving cost, GPU-hours, bandwidth, storage, moderation, and support cost allocation.
  - - Customer concentration, ACV, and retention
    - Prevents knowing whether ARR comes from durable software accounts or a small volatile account set
    - Request top-customer concentration, ACV buckets, cohort churn, NRR, and renewal schedules.
  - - Deferred revenue, backlog, or RPO
    - Prevents comparing AIsphere with public software-style revenue quality markers
    - Provide deferred-revenue rollforward, signed backlog, and remaining performance obligations.
  - - Cash, burn, runway, debt, and cloud commitments
    - Prevents any serious conclusion on next-round timing or downside resilience
    - Request current balance sheet, debt schedule, lease obligations, and minimum cloud-commitment contracts.
  notes: These are the minimum public-data gaps that block a clean underwriting case on AIsphere financials as of 2026-07-03.
