  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Product-line gross margin, compute COGS, and contribution margin by consumer, API, and enterprise workflow.
    whyItMatters: Without cost-of-revenue detail, investors cannot tell whether credit pricing scales into attractive software margins or merely covers variable GPU bills.
    diligencePath: Request management accounts, cloud invoices, GPU-hour allocation by model, and product-line gross-margin reporting.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, runway months, debt, leases, and minimum cloud commitments.
    whyItMatters: These are the decisive variables for financing dependency and downside resilience after the latest round.
    diligencePath: Obtain the latest balance sheet, debt schedule, board cash-forecast pack, and all minimum cloud-commitment agreements.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Segment revenue mix, realized enterprise pricing, discount policy, customer concentration, and ACV distribution.
    whyItMatters: Without mix and concentration data, public ARR does not tell investors whether revenue is durable, recurring, or excessively dependent on a small number of accounts or low-quality usage.
    diligencePath: Review contract samples, billing exports, and a monthly revenue bridge segmented by channel, geography, and customer cohort.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-quality-metrics
    missingEvidence: Deferred-revenue rollforward, backlog or RPO, NRR, and large-account thresholds comparable with public software peers.
    whyItMatters: Those metrics are the standard public markers for recurring-revenue quality, and their absence forces investors to infer too much from top-line ARR and user counts.
    diligencePath: Request cohort-retention reporting, deferred-revenue schedules, signed backlog summaries, and internal enterprise-account segmentation.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
