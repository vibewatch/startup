evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board roster, voting rights, and current fully diluted cap table.
    whyItMatters: Control rights and dilution determine who truly governs the company after several rapid financing rounds.
    diligencePath: Request board materials, charter documents, and the latest cap-table export under NDA.
    relatedQuestionRefs:
      - QO002
      - QO027
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: valuation mechanics
    missingEvidence: A reconciled March 2026 post-money valuation, liquidation preference stack, and any side-letter economics.
    whyItMatters: The headline unicorn-level valuation may overstate investability if preference terms or structure are aggressive.
    diligencePath: Obtain the Series C term sheet, shareholder agreement, and post-money capitalization schedule.
    relatedQuestionRefs:
      - QO003
      - QO028
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue quality
    missingEvidence: >-
      Audited or management-certified ARR bridge, net revenue retention, and gross-margin detail behind the >$40M ARR
      claim.
    whyItMatters: Headline ARR alone cannot support underwriting without knowing pricing quality, churn, and cost-to-serve.
    diligencePath: Request monthly recurring revenue cohort tables, churn/NRR, and contribution-margin reports.
    relatedQuestionRefs:
      - QO016
  - type: conflicting-data
    severity: minor
    topic: user metrics
    missingEvidence: A single dated dashboard reconciling global users, MAU, and videos generated across web and mobile.
    whyItMatters: >-
      Different public sources cite 40M, 60M, and 100M+ users at different times, which is directionally positive but
      not cleanly standardized.
    diligencePath: Request first-party analytics exports with a common definition of users, MAU, and cumulative videos.
    relatedQuestionRefs:
      - QO005
      - QO015
  - type: private-evidence-only
    severity: material
    topic: sam-isolation
    missingEvidence: >-
      Segmented revenue or GMV by creator subscriptions, SMB marketing, media production, API usage, and enterprise
      contracts.
    whyItMatters: >-
      Without segment-level monetization, the chapter can bound market demand but cannot defend a company-specific
      SAM/SOM or margin-rich revenue wedge.
    diligencePath: >-
      Ask management for the last 12 months of revenue mix, active paid accounts, ARPU by channel, and top ten customer
      contract values.
    relatedQuestionRefs:
      - QM025
      - QM026
  - type: missing-source
    severity: material
    topic: compliance-costs
    missingEvidence: >-
      Public data on moderation headcount, filing timelines, labeling tooling cost, and incident rates for AI-video
      providers operating in China.
    whyItMatters: >-
      Compliance can convert nominal demand into slow or low-margin deployment if labeling and governance are labor
      intensive.
    diligencePath: >-
      Request internal compliance org charts, filing status by product, moderation vendor spend, and historical
      enforcement or takedown logs.
    relatedQuestionRefs:
      - QM027
  - type: missing-source
    severity: material
    topic: enterprise-stickiness
    missingEvidence: Retention, seat expansion, and API usage curves for team, studio, and enterprise buyers across the category.
    whyItMatters: >-
      The valuation case depends more on durable workflow adoption than on casual creator experimentation, but public
      retention data is sparse.
    diligencePath: >-
      Ask for cohort retention, seat growth, API call growth, and the share of revenue under annual or multi-year
      contracts.
    relatedQuestionRefs:
      - QM026
  - type: conflicting-data
    severity: minor
    topic: tam-methodology
    missingEvidence: >-
      A methodology crosswalk that reconciles narrow generative-video estimates with broader generative-AI market
      studies and benchmark-led adoption proxies.
    whyItMatters: >-
      Investors can misread these figures as additive or directly comparable when they measure different layers,
      geographies, and years.
    diligencePath: >-
      Maintain the multi-lens table in future refreshes and ask each publisher for inclusion/exclusion definitions
      before using the figures in valuation work.
    relatedQuestionRefs:
      - QM004
      - QM028
  - type: missing-source
    severity: material
    topic: hailuo-wan-disclosure
    missingEvidence: Detailed public pricing, enterprise packaging, and governance documentation for Hailuo and Wan.
    whyItMatters: >-
      Thin public disclosure makes it hard to judge whether these peers are lightweight consumer apps or more serious
      enterprise competitors.
    diligencePath: >-
      Fetch official pricing, docs, trust-center, or API pages for Hailuo and Wan and add them to the comparative
      pricing and trust sections.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-competitor-set
    missingEvidence: A fuller long-tail enumeration of niche creator apps and traditional creative-suite substitutes.
    whyItMatters: >-
      The main chapter covers the decision-relevant set, but a broader census would help quantify how fragmented the
      market really is.
    diligencePath: >-
      Extend the profile table with additional long-tail creators, creative suites, and regional apps only if they
      materially change the buy-side substitute map.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: retention-and-switching
    missingEvidence: >-
      Customer-level retention, win-loss, and multi-homing data showing why PixVerse wins or loses against Runway,
      Kling, Vidu, or routed alternatives.
    whyItMatters: >-
      Competitive durability cannot be underwritten confidently from benchmark scores alone; the moat question is
      ultimately commercial and workflow-based.
    diligencePath: >-
      Request churn, cohort retention, top-five competitor loss reasons, and enterprise migration case studies from
      management.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Product-line gross margin, compute COGS, and contribution margin by consumer, API, and enterprise workflow.
    whyItMatters: >-
      Without cost-of-revenue detail, investors cannot tell whether credit pricing scales into attractive software
      margins or merely covers variable GPU bills.
    diligencePath: >-
      Request management accounts, cloud invoices, GPU-hour allocation by model, and product-line gross-margin
      reporting.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, runway months, debt, leases, and minimum cloud commitments.
    whyItMatters: These are the decisive variables for financing dependency and downside resilience after the latest round.
    diligencePath: >-
      Obtain the latest balance sheet, debt schedule, board cash-forecast pack, and all minimum cloud-commitment
      agreements.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Segment revenue mix, realized enterprise pricing, discount policy, customer concentration, and ACV distribution.
    whyItMatters: >-
      Without mix and concentration data, public ARR does not tell investors whether revenue is durable, recurring, or
      excessively dependent on a small number of accounts or low-quality usage.
    diligencePath: >-
      Review contract samples, billing exports, and a monthly revenue bridge segmented by channel, geography, and
      customer cohort.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: revenue-quality-metrics
    missingEvidence: >-
      Deferred-revenue rollforward, backlog or RPO, NRR, and large-account thresholds comparable with public software
      peers.
    whyItMatters: >-
      Those metrics are the standard public markers for recurring-revenue quality, and their absence forces investors to
      infer too much from top-line ARR and user counts.
    diligencePath: >-
      Request cohort-retention reporting, deferred-revenue schedules, signed backlog summaries, and internal
      enterprise-account segmentation.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: trust-disclosure-gap
    missingEvidence: >-
      A public trust center or equivalent documentation covering SOC 2 or ISO status, moderation policies, provenance or
      watermarking design, and incident-response commitments.
    whyItMatters: Enterprise adoption risk is hard to underwrite when public governance disclosure lags public feature breadth.
    diligencePath: >-
      Request the latest trust packet, security certifications, moderation playbooks, and provenance implementation
      notes from AIsphere during diligence.
    relatedQuestionRefs:
      - QE021
      - QE027
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: api-reliability
    missingEvidence: >-
      Documented API SLA, uptime history, rate-limit policy, queue behavior, and incident postmortems for PixVerse
      Platform and R1 partner endpoints.
    whyItMatters: >-
      A priced platform can look mature commercially while still being unproven operationally for enterprise-scale
      buyers.
    diligencePath: >-
      Ask for enterprise contract templates, SLA language, historical uptime dashboards, and priority-support escalation
      policies.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: compute-supply
    missingEvidence: >-
      Named cloud or GPU suppliers, mitigation plans for export-control disruptions, and any approved-designer or
