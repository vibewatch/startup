      channels.
    diligencePath: >-
      Request the compute vendor map, regulatory counsel memo, and contingency plan for 2026–2027 export-control
      scenarios.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: enterprise-adoption
    missingEvidence: >-
      Cohort-level retention, paid-seat counts, API customer counts, and B2B revenue mix across consumer app, Team Plan,
      API, and R1 partner surfaces.
    whyItMatters: >-
      Workflow breadth is strategically valuable only if adoption converts beyond creator experimentation into durable
      team or enterprise spend.
    diligencePath: >-
      Request product analytics by surface, paid conversion funnels, and top customer deployment examples segmented by
      product layer.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE001
      - TE005
  - type: missing-source
    severity: minor
