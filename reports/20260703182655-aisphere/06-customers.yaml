company:
  name: AIsphere
chapter:
  number: 6
  title: Customers
  summary: 'AIsphere’s public customer evidence is broadest at the consumer-creator edge: PixVerse shows massive app-store reach, template-led community behavior, and repeated official or reported claims of 100M+ users. The evidence gets thinner as diligence moves toward real paying customers—named proof is mostly partner, program, or IP driven rather than classic enterprise-logo heavy, and public sources still do not disclose paying-customer count, NRR, concentration, or enterprise revenue mix.'
sections:
- id: buyer-user-payer-segmentation
  title: Buyer, user, and payer segmentation spans consumer creators, teams, and embedded users
  body: 'PixVerse’s public customer map is broad on users and much narrower on disclosed payers. The most visible users are consumer creators who encounter PixVerse through the mobile app, Google Play, third-party Android stores, Product Hunt, and viral template pages. Those surfaces are optimized for quick social-video creation rather than for procurement-style sales. A second layer sits above them: prosumers, marketers, and agencies that need repeatable campaign workflows, client organization, and better output quality. Official Team Plan and Canvas materials show PixVerse explicitly productizing for that segment with shared workspaces, pooled credits, role-based permissions, and campaign or client organization. Beyond that, the company is also targeting API and embedded users through the R1 partner program, where the buyer is a studio, platform developer, or tool builder rather than a consumer creator. The net result is a credible buyer-user-payer ladder, but public evidence still identifies
    user surfaces far more clearly than it identifies who pays at meaningful scale.'
  claimRefs:
