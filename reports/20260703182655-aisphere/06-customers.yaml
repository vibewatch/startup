- id: named-proof-template-behavior-and-use-cases
  title: Named proof is real, but it is partner- and template-led rather than classic enterprise-logo heavy
  body: 'The most concrete named public proofs are not Fortune-500 customer stories with quantified ROI. They are partner programs, branded campaigns, workflow integrations, and creator initiatives. Captain Tsubasa and KAGAMI Gate show PixVerse being used as the operating surface for a licensed IP campaign and an IP-usage tracking proof-of-concept. Tripo Studio shows a concrete game-art workflow in which PixVerse acts as the cinematic look-development stage before a 3D asset is built. The UN AI for Good partnership gives PixVerse an institutional creator program with workshop and film-festival exposure. At the same time, the template pages matter because they reveal how everyday users actually behave: they use pre-built, low-friction creative formats such as Dancing Baby, Winter Sovereign, and Fly to the Sun, rather than only blank-canvas prompt engineering. This is meaningful customer evidence, but it is better read as proof of active community behavior and partner experimentation than
    as proof of diversified enterprise revenue.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
