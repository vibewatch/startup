  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: paying-customer-count
    missingEvidence: Paying subscriber count, paying-team count, and free-to-paid conversion by segment.
    whyItMatters: Reach without payer counts does not tell investors whether PixVerse is monetizing a broad base or only a narrow slice of heavy users.
    diligencePath: Request monthly paid subscribers, paying teams, payer ARPU, and free-to-paid cohort conversion by acquisition channel.
    relatedQuestionRefs:
    - QU018
    - QU027
  - type: private-evidence-only
    severity: material
    topic: retention-renewal
    missingEvidence: NRR, GRR, churn, contract length, renewal timing, and renewal rate for each monetized segment.
    whyItMatters: Without durability metrics, large app-store reach and named partner programs cannot be translated into recurring revenue quality.
    diligencePath: Request cohort tables for consumer subscribers, Team Plan accounts, and API partners, plus sample contract terms.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU027
  - type: missing-source
    severity: material
    topic: concentration-and-mix
    missingEvidence: Top-customer share, partner concentration, and revenue split between consumer, team, API, and partner programs.
    whyItMatters: A high-value but concentrated partner base would change how investors read the same adoption numbers and customer-proof stories.
    diligencePath: Request customer concentration tables and segment revenue mix from management or the data room.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU027
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Named paying customers with outcome, production status, contract scope, and renewal history rather than only partner/program references.
    whyItMatters: The current named-proof set is strategically interesting but does not yet prove that PixVerse has a diversified base of disclosed paying enterprise customers.
    diligencePath: Ask management for five named paying references across consumer subscriptions, teams, API partners, and branded programs, or for anonymized account cohorts if names cannot be disclosed.
    relatedQuestionRefs:
    - QU022
    - QU027
    relatedTableRefs:
    - TU003
