- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Public proof
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Free creator to paid subscriber upsell
    - R1 access is immediate for paid subscribers and premium quality is emphasized in official guides
    - Free-to-paid conversion is undisclosed
    - Could be the core consumer monetization lever if conversion is healthy
    - Disclose conversion, payer ARPU, and subscriber retention by plan.
  - - Solo creator to team workspace
    - Team Plan, shared workspaces, pooled credits, and Canvas project organization
    - No named teams, seat counts, or renewals are public
    - Key bridge from consumer traction into higher-value accounts
    - Disclose team-plan logos, seat growth, and renewal cohorts.
  - - Team workflow to API / embedded program
    - Selective R1 partner program for studios, platform developers, and tool builders
    - Selective access may mean revenue is concentrated in a few partners
    - Potentially highest ACV route, but also the biggest opacity source
    - Disclose partner count, contract size, and top-partner exposure.
  - - Branded / IP campaigns
    - Captain Tsubasa, KAGAMI Gate, and AI for Good show PixVerse can package branded or mission-driven programs
    - Could be one-off promotional revenue rather than repeat revenue
    - Adds strategic optionality in licensing and campaigns
    - Disclose repeat program count, contract structure, and renewal history.
  - - Toolchain / game workflow partners
    - Tripo Studio creates a concrete prosumer-to-pro workflow
    - No named downstream paying studios are public
    - Supports gaming and 3D expansion, but commercial depth is unproven
    - Disclose active partner-generated accounts and studio expansion.
  - - Distribution platforms and community channels
    - Google Play, iOS, third-party stores, Product Hunt, and social invite channels drive discovery
    - Acquisition mix may be overly dependent on platforms and virality
    - Large funnel, but higher platform-policy and trend risk
    - Disclose acquisition mix by store, web, referral, and partner channels.
  notes: Risk rows are based on public channel structure and disclosure gaps; they describe plausible expansion mechanics, not verified realized revenue mix.
