tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof surface
  - Strategic value
  - Key gap
  rows:
  - - Consumer creators
    - Individual creator discovers, uses, and sometimes pays through self-serve plans
    - Quick social clips, photo animation, text-to-video, viral effects
    - Google Play, app-download page, AppBrain, Uptodown, APKPure
    - Largest visible top-of-funnel user base
    - Paid conversion and subscriber count are undisclosed
  - - Prosumers / marketers
    - Individual or small-team payer; creator or marketer is the daily user
    - Campaign clips, product demos, social-ready brand content
    - APKPure marketer language, Canvas workflow copy, hot-template pages
    - Bridges casual creation into repeat commercial use
    - No segment revenue, ACV, or retention split is public
  - - Team / agency workspaces
    - Admin pays; creators, reviewers, and admins use the product
    - Shared asset management, campaign organization, pooled credits, approvals
    - Production-platform Team Plan and Canvas pages
    - Clearest emerging enterprise-style layer
    - No named agencies, seat counts, or renewal proof
  - - API / embedded partners
    - Studio, platform developer, or tool builder pays; downstream end user consumes the output
    - Real-time video generation embedded in products or workflows
    - R1 partner program and platform surfaces
    - Potential higher-ACV route beyond self-serve subscriptions
    - Selective program with no disclosed contract sizes or live customer count
  - - IP / licensing partners
    - Brand or IP partner plus end-user fans; commercial payer mix unclear
    - Licensed template libraries and governed use of character IP
    - Captain Tsubasa collaboration and KAGAMI Gate PoC
    - Differentiates PixVerse from generic prompt tools
    - Promo value is visible; recurring revenue terms are not
  - - Institutional / creator programs
    - Organizer, sponsor, or creator may pay depending on program design
    - Film-festival submissions, workshops, community storytelling
    - UN AI for Good program and Product Hunt community surface
    - Extends trust and reach beyond pure entertainment apps
    - Monetization and renewal from these programs are not disclosed
  notes: Segments are inferred from public product surfaces and named programs; the evidence identifies users more clearly than it identifies high-value payers.
