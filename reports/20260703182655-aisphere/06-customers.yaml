- id: adoption-and-distribution-evidence
  title: Adoption evidence is strongest in app-store distribution and broad creator reach
  body: 'AIsphere’s public adoption proof is strongest where consumer platforms publish telemetry or rankings. AppBrain provides the sharpest external read: the page displays 50,000,000+ downloads, separately says the app has been downloaded 73 million times, shows roughly 980 thousand downloads in the last 30 days, ranks the app #2 in photography, and reports a 4.49 rating from roughly 4.3 million ratings. Product Hunt adds a much smaller but still useful prosumer signal, with 304 followers, six reviews, and four launches. Apptopia confirms an iOS listing under MotivAI Private Limited, while Google Play, Uptodown, and APKPure together show broad distribution beyond a single storefront. At the company-claim layer, PRNewswire, PixVerse’s production-platform update, and March 2026 financing coverage all reinforce the same headline: more than 100 million users, international reach, and very large cumulative video volume. What those numbers do not reveal is the fraction of users who pay, stay,
    or expand into higher-value contracts.'
  claimRefs:
