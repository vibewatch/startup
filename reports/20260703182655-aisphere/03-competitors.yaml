- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or dependency
  - Competitive threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - PixVerse can win on raw model quality
    - Seedance, Kling, Vidu, Wan, and Veo keep quality clustered within a benchmarked field
    - High
    - Artificial Analysis leaderboards show several nearby substitutes and a non-PixVerse leader
    - Request normalized win-rate, retention, and output-preference data for paying cohorts, not only benchmark
      screenshots
  - - PixVerse can price above peers
    - Runway, Seedance, Vidu, and open-weight LTX set visible price anchors
    - High
    - Official PixVerse and Runway pricing plus AA $/min comparisons
    - Map realized ASP, discounting, and enterprise price floors versus the top five alternatives
  - - Standalone app distribution will remain enough
    - Aggregators and routing layers can own the subscription while swapping the underlying model
    - High
    - Runway bundles third-party models and Pika promises access to “all the models”
    - Measure how often customers multi-home and whether PixVerse remains the default generation surface over time
  - - China and enterprise compliance will be a differentiator
    - Rules create burden, but better-documented rivals can turn compliance into a sales advantage
    - Medium-high
    - China labeling rules, EU GPAI obligations, and NIST trust expectations all raise process requirements
    - Audit visible governance artifacts, labeling workflows, copyright position, and customer-ready trust documentation
  - - China-linked supply and scaling risk is manageable
    - BIS export-control diligence can still complicate advanced-computing access for China-linked entities
    - Medium
    - BIS homepage and GT guidance confirm continuing license requirements
    - Review compute counterparties, geography of access, and backup capacity plans under tighter export enforcement
  - - Generalist labs are not a near-term threat
    - Moonshot, Veo, Grok, and future assistant ecosystems can absorb video into broader AI workspaces
    - Medium-high
    - Moonshot funding scale and benchmark entrants from Google/xAI
    - Track whether enterprise buyers increasingly prefer all-in-one AI suites over single-purpose video apps
  notes: Severity rates the risk to AIsphere’s durable competitive position, not the attractiveness of AI video
    demand overall. The main issue is whether value stays with PixVerse or migrates to the routing, OS, or generalist-platform
    layer.
