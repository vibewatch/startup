  title: The biggest risk is not a single rival — it is the ease of comparison and routing
  body: Runway and Pika are both teaching buyers to think in multi-model terms, while open-weight substitutes set
    a visible floor on price. That environment weakens any one-model moat unless PixVerse owns the workflow or contract.
