  - - Runway
    - Global direct peer / aggregator
    - $315M Series E at $5.3B valuation; world-model platform ambitions
    - Creators, studios, agencies, enterprise teams
    - Multi-model packaging, branded tooling, and enterprise GTM
    - Benchmark edge can still be routed across many model providers
  - - OpenAI Sora
    - Global direct peer / likely entrant
    - Previewed as world-simulation product, then sunset the standalone experience in 2026
    - Developers and creators already inside OpenAI ecosystem
    - OpenAI brand, safety tooling, and adjacent platform reach
    - Standalone durability looked weaker than the headline suggested
  - - Kling
    - Chinese direct peer
    - Kling 3.0 and 3.0 Omni ranked near the top of AA leaderboards
    - Prosumers and premium creator workflows
    - Strong cinematic control, long-form storyboards, native audio
    - Public price points are relatively high versus PixVerse and Vidu
  - - Vidu
    - Chinese direct peer
    - AA-ranked quality plus reference-video workflow positioning
    - Fast-turn social, ad, and storytelling creators
    - Reference-video workflow and competitive benchmark pricing
    - Fetched public governance material is relatively light
  - - Hailuo
    - Chinese direct peer
    - a16z cites Hailuo as a Chinese video product exported globally
    - Consumer creators
    - Brand visibility and China-led iteration speed
    - Fetched landing page exposes little pricing or compliance detail
  - - Wan
    - Chinese direct peer / internal-build substitute
    - AA benchmark presence across model variants and open-style field comparison
    - Developers and creators mixing closed and self-hosted flows
    - Strong benchmark visibility with open-style substitute pressure around the family
    - Public landing page is thin; enterprise packaging is unclear in retained sources
  - - Jimeng / Seedance
    - Chinese direct peer / likely entrant
    - Seedance leads retained AA leaderboards; Jimeng exposes ByteDance creator workflow DNA
    - Chinese creators and ByteDance-adjacent users
    - Leaderboard-leading quality plus community and Chinese prompt fit
    - ByteDance can route value through broader ecosystems rather than a standalone vendor
  - - Pika
    - Global direct peer / routing layer
    - Agent and MCP framing promises access to “all the models”
    - Creators who want effects plus AI-agent workflows
    - Can aggregate models instead of betting on one frontier model
    - Public fetched pricing is thin and positioning is still evolving
  - - Internal build / open-weight stack
    - Substitute
    - LTX open-weight models and benchmarked open-style alternatives are already in buyer comparison sets
    - Studios, agencies, and technical teams
    - Lowest routing cost and highest control
    - Requires ops talent and may trail premium apps on polish
  - - Generalist entrants (Moonshot, Veo, Grok)
    - Likely entrants / adjacent substitutes
    - Moonshot has $20B valuation; Veo and Grok appear near the frontier in AA rankings
    - Developers who want broad AI workspaces, not just video tools
    - Can bundle video with coding, search, reasoning, or platform defaults
    - Video may be one feature among many, pressuring pure-play margins
