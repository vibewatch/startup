- id: distribution-trust-and-switching-costs
  title: 'Distribution, trust, and switching costs: the control plane is moving above the model'
  body: |-
    Distribution and trust are where the asymmetry becomes most important. Runway is no longer just a model vendor; it is building a world-model platform and already uses pricing to position itself as a multi-model gateway. Pika is doing something similar through agents and MCP, and a16z's Top 100 report argues that many persistent consumer winners either route to third-party models or succeed without owning the best frontier model. That is strategically important for AIsphere: even if PixVerse keeps pace on quality, value can migrate upward to the routing layer or sideways to the platform that already has the user relationship. The same report says Chinese video products such as Hailuo and Kling have exported globally, while app stores are cracking down on copycat surfaces. That favors products with a real brand and community, but it also means new consumer leaders can emerge without owning a unique underlying model.

    Trust and regulatory posture add another selection filter. China-facing vendors already operate under the 2023 Interim Measures for generative AI services and the 2025 labeling regime that requires visible and metadata-based identification of AI-generated content. Those rules create operational burdens around labeling, logging, export/download controls, and platform review. U.S. and EU-facing enterprise buyers have a different lens: NIST's AI RMF, the EU AI Act, and Article 53-style GPAI obligations push toward documentation, copyright handling, training-data summaries, and identifiable generated content. In other words, product quality gets a vendor shortlisted, but governance process can determine who survives procurement. The public record is mixed here: OpenAI and Runway discuss safety or product limitations in detail, while Hailuo and Wan expose far less public governance detail on their fetched surfaces. If AIsphere wants to sell deeper into enterprise or regulated creative workflows, its trust posture has to become as legible as its model demos.
