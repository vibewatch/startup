- id: partner-dependency-customer-and-competition
  title: Partner, Dependency, Customer, and Competition Risk
  body: 'AIsphere''s dependency stack is unusually dense. Alibaba Cloud reportedly provides full-stack support for training, inference, global deployment, and compliance, which makes the relationship strategically valuable but also makes cloud concentration a direct economic and availability risk. GPU dependence compounds that problem because frontier video models still need advanced computing, while export rules can affect China-linked access at exactly the time when world-model ambitions increase compute appetite. Distribution is also concentrated. App-store scale is a strength, but it means discovery, payments, ranking visibility, and part of customer trust sit on third-party platforms rather than inside AIsphere''s own channels. Enterprise monetization introduces a different dependency pattern: the R1 API partner program is selective instead of fully open, so near-term enterprise revenue may depend on a relatively small set of qualified partners and support resources. Licensed-IP and
    workflow partnerships cut both ways as well. Captain Tsubasa and KAGAMI Gate show that AIsphere is trying to build rights-cleared growth loops, while the Tripo integration broadens creator workflows, but each partner also becomes a potential point of delay, renegotiation, or dilution. Competition raises the stakes further because Runway and other video labs pursue similar world-model narratives, and fast shifts in category leaders can turn current traction into tomorrow''s churn if quality leadership slips.'
  claimRefs:
