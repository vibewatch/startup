company:
  name: AIsphere
chapter:
  number: 7
  title: Risks
  summary: AIsphere's highest-severity risks are not generic startup risks but a specific stack of China compliance and AI-labeling exposure, frontier GPU and cloud concentration, and unresolved copyright or IP liability in AI-video generation. Consumer scale, strong benchmarks, and a $300 million Series C soften near-term financing pressure, but public evidence still leaves burn, compliance staffing, enterprise SLA discipline, and customer durability materially under-disclosed.
sections:
- id: severity-ranked-overview
  title: Severity-Ranked Risk Overview
  body: 'AIsphere''s risk stack is led by three issues that can compound rather than appear in isolation. First, PixVerse is a public AI-video product with Chinese and international surfaces, so China''s generative-AI and labeling rules are not theoretical background: they directly govern content labeling, complaint handling, personal-information duties, and potential service suspension if regulators view controls as insufficient. Second, frontier video quality and low-latency inference still depend on advanced computing and cloud infrastructure, leaving AIsphere exposed to U.S. export-control tightening, NVIDIA supply limits, and concentration around Alibaba Cloud-backed global deployment. Third, the company sits inside the unresolved copyright zone facing the broader generative-AI industry, where training-data provenance, output ownership, and licensed IP usage remain contested. Below that top tier sit model-quality and consumer-distribution fragility, since app-store scale and leaderboard
    status can reverse quickly in AI video, followed by capital and execution risk because AIsphere has ample fresh financing but little public disclosure on burn, customer concentration, or compliance staffing. The risk picture is therefore best understood as a transmission chain from regulation and supply into product reliability, enterprise trust, margin quality, and eventually valuation.'
  claimRefs:
  - CR036
  - CR041
  - CR042
  - CR043
  - CR045
  figureRefs:
  - FR001
- id: legal-and-regulatory-risk
  title: Legal and Regulatory Risk
  body: 'Legal and regulatory exposure is AIsphere''s clearest top-tier risk because PixVerse combines exactly the features that regulators are trying to discipline: public-facing generative video, real-time interaction, user-uploaded content, and growing API distribution. China''s interim measures apply to public generative-AI services that generate text, images, audio, video, or other content, require lawful training-data sources, and explicitly mandate labeling obligations through the deep-synthesis regime. The 2025 labeling measures add both explicit user-facing marks and implicit metadata requirements, while also pushing providers toward complaint handling, user agreements, logging, and content-safety controls. For AIsphere, that creates a concrete implementation burden rather than a remote policy headline because PixVerse markets Chinese and global web surfaces, consumer apps, and production workflows. Export controls are the second major legal vector: BIS clarified in 2026 that advanced-computing
    items still require licenses for China-linked entities, so any tightening in frontier GPU access can flow straight into model cadence and service economics. The third legal vector is copyright. Generative-AI litigation in the United States still leaves open questions around training-data fair use, output ownership, and downstream liability, and AI-video products face additional exposure when they market branded or character-based outputs. AIsphere has started to experiment with licensed-IP infrastructure, which is directionally helpful, but public evidence does not yet show a mature, audited legal-control stack.'
