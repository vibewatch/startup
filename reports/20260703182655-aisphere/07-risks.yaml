  - type: enumeration-incomplete
    severity: material
    topic: regulatory / legal risk register
    missingEvidence: Company-specific CAC filing history, security-assessment evidence, and labeling implementation artifacts for PixVerse.
    whyItMatters: The highest-ranked risk cannot be bounded without direct evidence that AIsphere has implemented China-specific controls in practice.
    diligencePath: Request CAC filing records, label-design samples, moderation SOPs, and complaint-handling metrics from management.
    relatedQuestionRefs:
    - QR013
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: burn and runway
    missingEvidence: Monthly burn, cash balance, runway, and board-approved downside plan after the Series C.
    whyItMatters: Capital risk remains material because public funding headlines do not show how much cushion exists against compute, cloud, and hiring plans.
    diligencePath: Review monthly management accounts, cash forecast, and financing plan under NDA.
    relatedQuestionRefs:
    - QR019
  - type: missing-source
    severity: material
    topic: customer durability
    missingEvidence: Top-customer concentration, segment mix, retention cohorts, and NRR or repeat-purchase evidence.
    whyItMatters: Consumer scale does not prove durable enterprise monetization or balanced revenue concentration.
    diligencePath: Request customer-concentration schedule, top-10 accounts, cohorts, and paid retention metrics.
    relatedQuestionRefs:
    - QR021
  - type: missing-source
    severity: material
    topic: compliance and support staffing
    missingEvidence: Org chart and headcount for legal, trust and safety, moderation, solutions engineering, and partner support.
    whyItMatters: Execution risk cannot be judged accurately when the staffing depth behind compliance and enterprise support is opaque.
