- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - China compliance and labeling
    - Regulatory notice or missing audit evidence
    - Takedown, warning, or inability to show label workflow
    - Pause underwriting until controls are verified
  - - Frontier GPU access
    - License delay or shrinking capacity buffer
    - Less than 6-12 months credible access to required compute
    - Cut growth and model-cadence assumptions
  - - Copyright and provenance
    - No training-data controls or weak indemnities
    - Management cannot evidence provenance, rights-cleared data, or indemnity posture
    - Reduce enterprise revenue confidence or avoid
  - - Cloud concentration
    - Single-vendor dependency remains dominant
    - No meaningful failover or commercial leverage versus a primary provider
    - Discount reliability and gross-margin assumptions
  - - App-store dependence
    - Consumer distribution weakens
    - Ratings, downloads, or store status deteriorate materially
    - Lower scale and monetization assumptions
  - - Model-quality expectations
    - Benchmark slippage versus leaders
    - Loss of top-tier quality standing for multiple release cycles
    - Lower moat and conversion assumptions
  - - Capital adequacy
    - Runway shortens faster than planned
    - Under 12 months runway without committed capital
    - Treat financing as thesis-critical
  - - Execution depth
    - Support or compliance bench does not scale
    - Partner backlog, unresolved incidents, or missing compliance hires
    - Move to research-more unless corrected
  notes: Triggers are designed to be monitorable and investment-relevant rather than abstract risk labels.
