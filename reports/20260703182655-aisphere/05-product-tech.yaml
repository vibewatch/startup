- id: architecture-and-operating-model
  title: 'Architecture and operating model: proprietary video foundation models underneath, with R1 pushing toward a persistent multimodal world engine'
  body: 'The public architecture story has two layers. The first is the mature video-generation stack around V6, V5.6, C1, and related creation modes. Official launch material, pricing docs, and the detailed V6 review show a cloud model family that already supports text-to-video, image-to-video, transition, extension, reference-to-video, integrated audio, and 1080p outputs with transparent credit pricing. The second is the newer R1 direction, which PixVerse describes not as a clip generator but as a real-time world model: continuous interactive 1080p video, omni-native multimodal processing, low sampling steps, memory-augmented attention, and updated support for single-photo avatars, persistent sessions, and multi-user shared worlds. That operating model is strategically important because it shifts AIsphere from competing only on short-form clip quality toward an architecture that could support simulations, interactive entertainment, and live environments. The partner-program packaging,
    however, shows the immaturity of this layer: the most novel R1 capability is still selectively gated, early-access infrastructure rather than a broad self-serve production API. In other words, the proprietary video foundation-model layer looks commercial today; the world-model layer looks technologically ambitious but still partially pre-general-availability.'
