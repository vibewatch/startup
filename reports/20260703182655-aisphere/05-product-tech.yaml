  - - Automate generation inside a product or pipeline
    - Manual web generation or stitched third-party scripts
    - API Platform plus claimed CLI support
    - Programmable generation and transparent per-second/credit pricing
    - Public docs do not yet expose full SLA, auth, or quota disclosure
  - - Prototype an interactive world or live narrative
    - Game engine plus bespoke assets and logic stack
    - R1 real-time world model and partner API
    - Continuous world generation, avatars, synchronized audio, and narrative steering
    - Selective partner gating means the surface is not broadly self-serve
  - - Validate a game asset look before 3D modeling
    - Static concept art followed by blind modeling
    - PixVerse cinematic look-dev linked to Tripo Studio
    - Teams can test lighting, motion, and silhouette before mesh production
    - The proof is a partner workflow post, not a neutral customer case study
  - - Launch licensed fan or brand templates
    - Unofficial fan content or after-the-fact takedown risk
    - KAGAMI Gate controlled licensing plus Captain Tsubasa templates
    - Rights holder terms are applied at creation time rather than after publication
    - The licensing system is still proof-of-concept and franchise-specific
  - - Operate a mobile-first creator workflow
    - Browser-first tool with weak phone support
    - Official iOS/Android app plus cloud sync
    - On-the-go generation and direct social sharing widen distribution
    - The app remains cloud-backed rather than local, so service quality still depends on backend performance
