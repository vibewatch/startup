  evidenceGaps:
  - type: missing-source
    severity: material
    topic: trust-disclosure-gap
    missingEvidence: A public trust center or equivalent documentation covering SOC 2 or ISO status, moderation policies, provenance or watermarking design, and incident-response commitments.
    whyItMatters: Enterprise adoption risk is hard to underwrite when public governance disclosure lags public feature breadth.
    diligencePath: Request the latest trust packet, security certifications, moderation playbooks, and provenance implementation notes from AIsphere during diligence.
    relatedQuestionRefs:
    - QE021
    - QE027
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: api-reliability
    missingEvidence: Documented API SLA, uptime history, rate-limit policy, queue behavior, and incident postmortems for PixVerse Platform and R1 partner endpoints.
    whyItMatters: A priced platform can look mature commercially while still being unproven operationally for enterprise-scale buyers.
    diligencePath: Ask for enterprise contract templates, SLA language, historical uptime dashboards, and priority-support escalation policies.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: compute-supply
    missingEvidence: Named cloud or GPU suppliers, mitigation plans for export-control disruptions, and any approved-designer or licensed-import pathways that protect model training and inference continuity.
    whyItMatters: Export rules can become a real product-delivery risk if AIsphere depends on constrained advanced-computing channels.
    diligencePath: Request the compute vendor map, regulatory counsel memo, and contingency plan for 2026–2027 export-control scenarios.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: enterprise-adoption
    missingEvidence: Cohort-level retention, paid-seat counts, API customer counts, and B2B revenue mix across consumer app, Team Plan, API, and R1 partner surfaces.
    whyItMatters: Workflow breadth is strategically valuable only if adoption converts beyond creator experimentation into durable team or enterprise spend.
    diligencePath: Request product analytics by surface, paid conversion funnels, and top customer deployment examples segmented by product layer.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: watermarking-provenance
    missingEvidence: Public evidence that PixVerse attaches default provenance metadata, visible labels, or watermark controls comparable to peers that disclose them.
    whyItMatters: As labeling and synthetic-media scrutiny rise, provenance controls become part of technical trust, not just a policy footnote.
    diligencePath: Ask product and trust teams for the current output-labeling roadmap, metadata schema, and whether provenance is on by default for API and consumer outputs.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
