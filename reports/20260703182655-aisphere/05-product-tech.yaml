- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Consumer creation shell
    - Hosts creation modes, templates, references, and creator UX
    - Web app, mobile apps, account sync, and cloud generation backend
    - High feature breadth can still mask weak enterprise observability or governance disclosure
  - - Workflow orchestration layer
    - Stores project state, nodes, references, storyboards, batches, and team assets
    - Canvas, Team Plan, shared libraries, and permission model
    - Operational complexity rises as PixVerse moves from a clip tool to a collaborative system of record
  - - Proprietary video foundation models
    - Generate core V6/C1 clip outputs with camera, audio, and multi-shot behavior
    - Training data, inference infrastructure, and per-second pricing engine
    - Independent benchmarks show strong but not dominant quality, so raw-model edge is contestable
  - - Audio / scene-control layer
    - Coordinates speech, music, effects, camera motion, and shot continuity
    - Integrated audio switches, literal prompting discipline, and multi-shot handling
    - Brand-accurate product shots, multilingual dialogue, and chaotic action still need human review
  - - R1 world-model layer
    - Creates continuous interactive video worlds instead of discrete finished clips
    - Omni-native multimodal processing, low-step sampling, memory-augmented attention
    - Selective-access packaging means real throughput and support characteristics are still under-disclosed
  - - API / automation layer
    - Lets partners and developers script generation or embed it in pipelines
    - Platform pricing docs, claimed CLI access, and R1 partner program
    - Public docs emphasize commercial access more than implementation detail or SLA depth
  - - Rights / compliance layer
    - Applies labeling, IP rules, and usage policies at distribution or creation time
    - China labeling obligations, KAGAMI Gate controls, app-store review, internal moderation
    - No public trust-center equivalent or provenance standard is described on official surfaces
  - - Compute / supply chain layer
    - Supplies the GPUs and advanced computing needed for training and inference
    - Export-control environment, vendor relationships, and backend cloud capacity
    - BIS guidance shows China-linked compute access remains a live operational dependency
  notes: The architecture table mixes software modules, governance layers, and external dependencies because PixVerse’s public operating model is commercial workflow plus cloud service, not only model architecture in the narrow ML sense.
