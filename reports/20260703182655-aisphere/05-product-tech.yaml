- id: trust-compliance-and-limitations
  title: 'Trust, compliance, and limitations: regulation is visible, public governance disclosure is still thinner than the product surface'
  body: 'Public trust evidence is mixed. On the positive side, PixVerse is clearly operating inside visible governance constraints: China’s 2023 generative-AI rules apply to public video services, 2025 labeling measures require visible and metadata-based markings for AI-generated content, and the KAGAMI Gate experiment shows the company is testing a permissioned IP-licensing layer rather than relying only on takedowns. The Google Play and AppBrain surfaces also make the mobile permission footprint legible, while the Harris and BIS materials highlight that compliance risk is not hypothetical: content-labeling enforcement, export licensing, and workflow documentation all matter operationally. The weakness is what the company has not publicly shown. Across the reviewed official web, app, blog, and platform surfaces, there is no public trust center, no SOC 2 or ISO 27001 page, no public uptime/status history, and no clear equivalent to the watermarking and provenance disclosures that some frontier
    peers already publish. That absence does not prove weak internal controls, but it does mean diligence on moderation, abuse handling, watermarking, API SLA, incident response, and GPU-supply resilience still has to move from public-web review into private diligence. For underwriting, that is the main technical risk: product breadth is already public, but enterprise-grade governance and reliability are not.'
