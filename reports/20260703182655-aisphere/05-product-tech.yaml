company:
  name: AIsphere
chapter:
  number: 5
  title: Product & Technology
  summary: 'PixVerse is no longer just a consumer text-to-video app: the public product stack now spans a creator-facing web and mobile surface, node-based team workflow tools, a priced API platform, and an early real-time world-model layer. The strongest evidence sits around workflow breadth, packaging, and model iteration cadence; the weakest public areas are still enterprise trust controls, self-serve reliability disclosures, and how much of the R1 world-model roadmap is production rather than selective-partner preview.'
sections:
- id: delivered-product-stack
  title: 'Delivered product: PixVerse now spans consumer creation, collaborative workflow, programmable APIs, and an early world-model layer'
  body: 'The public product definition is much broader than a single prompt box. The consumer-facing surface is visible on app.pixverse.ai, whose navigation now exposes Creation, Agent, Canvas, Mini-Apps, Marketing Hub, and API Platform; the mobile tutorial and Google Play listing show that the same stack is distributed through official iOS and Android apps with cloud-sync behavior rather than as a separate stripped-down companion. That matters because it turns PixVerse into a cross-surface workflow: a solo creator can start with a template or text prompt on mobile, a team can move into shared workspaces and centralized assets, and a developer can escalate the same generation workflow into API or CLI automation. The 2026 production-platform update makes that layering explicit by adding Team Plan permissions, pooled billing, and Mini Apps, while Canvas adds a node-based board for scripts, references, storyboards, batches, and finals. In workflow terms, AIsphere is delivering a creator operating
    system for AI video, not only a model endpoint. The strategic implication is positive: workflow ownership and surface breadth make switching harder than a raw leaderboard comparison does. The caveat is that public proof is strongest for packaging and feature breadth, and much thinner for how much revenue or enterprise retention each layer is already carrying.'
