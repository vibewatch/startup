- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap
  rows:
  - - China generative-AI service rules
    - Publicly applicable
    - Video services provided to the public in China must use lawful data, protect personal information, label certain outputs, and provide stable service
    - Compliance implementation detail at PixVerse is not publicly documented
  - - 2025 China AI-content labeling rules
    - Publicly applicable and time-bound
    - Visible labels plus metadata/implicit labels for AI-generated text, image, audio, video, and virtual scenes
    - Public PixVerse pages do not spell out what labeling path users or APIs actually receive
  - - IP-rights control via KAGAMI Gate
    - Visible proof-of-concept
    - Rights-managed template creation for Captain Tsubasa collaboration
    - The framework is promising but not yet proven across multiple major franchises
  - - Mobile permission and privacy footprint
    - Visible through app-store and AppBrain surfaces
    - Camera, microphone, storage, notifications, ad IDs, and network access align with a media-generation app
    - Users still need better public explanation of data handling, ads, and retention practices
  - - Public reliability / trust center surface
    - Not located on reviewed official pages
    - Status history, SOC 2, ISO 27001, incident reporting, trust center, or API SLA
    - Enterprise buyers still need private diligence because the public control plane is thin
  - - Public provenance / watermark disclosure
    - Not located in reviewed PixVerse materials
    - Whether generated videos carry explicit provenance metadata or default watermarks
    - Frontier peers disclose more here, so trust differentiation remains unclear
  - - User-visible output quality and credit complaints
    - Mixed
    - AppBrain reviews praise voice models and free credits but also mention drift and wasted credits
    - The presence of complaints does not prove systemic failure, but it does show production reliability is not frictionless
  notes: “Not located” means the item was not visible on the reviewed public surfaces; it does not prove the control is absent internally.
