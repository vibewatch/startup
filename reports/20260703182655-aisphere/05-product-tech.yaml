  rows:
  - - Consumer creation app + web
    - Solo creators and prosumers
    - Mature public surface
    - Fast multi-mode creation across text, image, transition, extension, references, and templates
    - Public materials do not split paid conversion or retention by web vs app cohort
  - - Canvas visual workspace
    - Creators, agencies, and internal teams
    - New but clearly productized
    - Node-based board keeps scripts, references, batches, and finals in one traceable workspace
    - No public usage or adoption metrics by team size were located
  - - Team Plan + shared asset library
    - Collaborative production teams
    - Commercially announced
    - Shared workspaces, role-based permissions, centralized assets, and pooled billing move PixVerse beyond single-user tooling
    - Seat pricing, admin controls, and audit-log depth are not public
  - - Mini Apps / Ad Master
    - Marketers and vertical operators
    - Early product extension
    - Purpose-built workflow shells reduce distance from brief to deliverable in specific use cases
    - Only the first mini app is described in detail; broader module roadmap is still sparse
  - - PixVerse Platform API + CLI path
    - Developers, studios, and enterprises
    - Active but partly gated
    - Programmable generation with priced credits and automation hooks
    - Public docs remain pricing-heavy; full API schema, SLA, and auth detail are not visible
  - - V6 / C1 proprietary video models
    - High-end video creators and production teams
    - Core commercial engine
    - Proprietary model stack with 1080p output, audio, camera control, and per-second pricing
    - Independent proof supports first-tier quality, but not uncontested category leadership
  - - R1 real-time world model
    - Studios, platform builders, interactive-experience developers
    - Emerging / selective access
    - Persistent interactive world generation pushes PixVerse beyond clip synthesis
    - General-availability timing, throughput, and reliability remain undisclosed
  - - IP / partner workflow layer
    - Rights holders, game studios, brand programs
    - Experimental but distinctive
    - KAGAMI Gate licensing and Tripo look-dev create workflow hooks competitors do not all expose
    - Current proof is partnership-blog depth rather than long-run production case studies
  notes: 'Status reflects what is visible on public surfaces as of 2026-07-03: mature means broadly shipped, announced means commercial surface exists, and emerging means partner-gated or still evidence-light.'
