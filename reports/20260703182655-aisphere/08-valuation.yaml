- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - A down round or heavy structured financing
    - New capital prices below the implied unicorn level or adds aggressive senior preferences
    - Shows that the current headline mark overstated outside support or overstated security quality.
    - Move from research-more to avoid / wait-for-reset unless terms improve dramatically.
  - - Weak revenue bridge
    - Recognized revenue, ARR composition, or API/enterprise mix does not support the >$40M headline in quality terms
    - Breaks the thesis that scale signals are converting into durable software economics.
    - Re-rate valuation into the bear band.
  - - Thin paid-customer quality
    - Low paid conversion, weak renewals, or high concentration behind the user headline
    - Turns product popularity into a weaker monetization story than the valuation assumes.
    - Require a lower entry price or milestone-based structure.
  - - Benchmark slippage
    - PixVerse loses first-tier status or falls meaningfully behind on quality/cost tradeoffs
    - Undercuts the argument that product competitiveness can sustain premium pricing.
    - Reduce bull-case probability and compress acceptable multiple.
  - - Sector multiple compression
    - Hong Kong or private-market appetite for Chinese AI cools materially
    - Removes scarcity support that currently props up private and newly public comps.
    - Shift posture from diligence to wait-for-repricing.
  notes: These are valuation-specific kill criteria linked to entry price and security quality rather than a general risk register restatement.
