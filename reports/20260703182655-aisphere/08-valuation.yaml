- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - What supports it
  - What would change the view
  rows:
  - - AIsphere is a real scaled asset, not a concept story.
    - thesis
    - The company raised $300M, exposes paid product surfaces, and appears in independent benchmark sets.
    - Audited channel-level revenue and cohort data would turn this from credibility proof into full underwriting proof.
  - - The current mark may still be mostly a narrative mark.
    - anti-thesis
    - The public record does not reconcile the exact post-money, preference stack, or recognized-revenue quality.
    - A clean term sheet and revenue bridge would reduce the narrative premium.
  - - AIsphere is cheaper than the hottest AI comps on surface arithmetic.
    - thesis
    - A rough 25x ARR ceiling sits below Runway and Moonshot headline multiples.
    - If ARR quality is weak or terms are aggressive, the discount disappears.
  - - PixVerse is competitive but not clearly dominant.
    - anti-thesis
    - Artificial Analysis shows a first-tier product in a tight field rather than a runaway benchmark leader.
    - Durable benchmark leadership or segment-specific win-rate evidence would strengthen premium-multiple arguments.
  - - Disclosure quality is materially below mature public software norms.
    - anti-thesis
    - Public filings disclose revenue-quality and margin markers that AIsphere does not publish.
    - Management-level KPI disclosure and audited statements would narrow the credibility discount.
  - - Security quality may lag company quality.
    - anti-thesis
    - No public cap table, liquidation waterfall, or side-letter economics are visible.
    - Clean terms could improve investability faster than more growth headlines.
  notes: The anti-thesis is mainly about pricing, proof quality, and security structure rather than denying that AIsphere has a real product.
