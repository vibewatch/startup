- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Key metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - AIsphere (private, Mar 2026)
    - '>$40M ARR claim; >100M users; >16M MAU'
    - Directionally unicorn-level / ~$1B headline mark; exact post-money undisclosed
    - Direct asset under review
    - ARR is a company-linked floor and the security terms are not public.
  - - Runway (private, Feb 2026)
    - Sacra estimated $90M annualized revenue in 2025
    - $5.3B valuation; ~59x revenue on Sacra's estimate
    - Closest AI-video workflow and world-model comp with visible 2026 financing
    - Revenue is third-party estimated rather than audited, and Runway has broader enterprise proof.
  - - Pika (private, Jun 2024)
    - Consumer-first AI-video product; revenue undisclosed
    - ~$470M valuation after an $80M round
    - Useful lower-end AI-video comp for the category's floor
    - Older mark and no clean revenue base for a multiple comparison.
  - - Moonshot AI (private, May 2026)
    - ARR topped $200M in April 2026
    - ~$20B valuation; roughly ~100x ARR on the disclosed floor
    - Upper-bound China AI scarcity comp with fresh ARR commentary
    - Much broader model, API, and agent scope than AIsphere.
  - - Zhipu AI (Hong Kong IPO, Jan 2026)
    - Hong Kong IPO targeting about $640M of proceeds
    - ~$6.7B / HK$51.2B IPO valuation target
    - Shows public investors were willing to back Chinese AI scarcity in 2026
    - Our retained set gives limited normalized revenue detail for a clean multiple comparison.
  - - MiniMax (Hong Kong IPO, Jan 2026)
    - $53M of 9M25 revenue; $512M loss
    - ~$6.5B IPO valuation and later $33B market-cap rally after model-driven enthusiasm
    - Best public AI-video-adjacent China comp for frothy late-stage appetite
    - Listing-day and post-rally pricing are volatile and not steady-state fair value.
  notes: This is a sample-based comparable set intended to bracket valuation logic across private AI-video peers and public Chinese AI issuers rather than to force one “correct” multiple.
