- id: final-diligence-asks-and-kill-triggers
  title: Final diligence asks and thesis-break triggers
  body: |-
    The remaining diligence work is unusually concentrated and highly actionable. First, investors need a monthly bridge from bookings to ARR to recognized revenue by channel, because the current >$40 million ARR claim is not enough to tell whether AIsphere deserves a software-quality multiple. Second, investors need the March 2026 term sheet, post-money cap table, liquidation waterfall, and any side letters, because security quality can be much weaker than company quality at the same headline valuation. Third, investors need unit-economics proof: compute cost per video minute, gross margin by product surface, and the share of revenue that is renewal-like rather than campaign-like.

    The kill triggers are correspondingly concrete. A down round, heavy senior preferences, or a weak revenue bridge would show that the unicorn narrative got ahead of the evidence. A widening benchmark gap or lower paid conversion would weaken the claim that product quality can sustain premium economics. And a colder Hong Kong or Chinese AI funding tape would remove the scarcity premium that currently helps support comparables. Until those items are closed, the right posture is continued diligence rather than conviction buying.
