- id: thesis-anti-thesis-and-recommendation
  title: Investment thesis, anti-thesis, and recommendation
  body: |-
    The thesis is straightforward. AIsphere is not a slideware company. It has raised real capital, exposes real product surfaces, shows real user-scale claims, and appears in independent benchmark sets rather than only in its own marketing. Those facts matter because they separate AIsphere from pre-revenue concept stories and make a unicorn-level narrative at least directionally understandable. The anti-thesis is equally important. The company has not shown the exact valuation mechanics, the ARR claim remains company-linked rather than audited, and the current evidence does not tell investors whether the revenue base is mostly sticky enterprise/API spend or a more fragile mix of creator subscriptions and promotional traffic. Public filings from Adobe, Snowflake, Datadog, Cloudflare, and NVIDIA make that disclosure gap impossible to ignore.

    Given those offsets, the supportable call is research-more, not buy. Confidence should be medium because the company-quality case is real but the security-quality case is still incomplete. Risk should be high because valuation support depends on multiple things going right at once: revenue conversion, compute discipline, and a still-open AI capital-markets window. The valuation stance should therefore be stretched. AIsphere is not obviously absurd at the headline mark, but the current evidence base is too thin to say the price is attractive.
