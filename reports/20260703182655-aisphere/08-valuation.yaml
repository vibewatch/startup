  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation mechanics
    missingEvidence: A reconciled March 2026 post-money valuation, cap table, liquidation waterfall, anti-dilution terms, and any side-letter economics.
    whyItMatters: The headline unicorn-level mark may overstate investability if new money sits below aggressive senior rights or hidden dilution.
    diligencePath: Obtain the signed Series C term sheet, shareholder agreement, and post-money capitalization schedule from counsel or the data room.
    relatedQuestionRefs:
    - QV004
    - QV009
  - type: private-evidence-only
    severity: material
    topic: revenue quality
    missingEvidence: A monthly bridge from bookings to ARR to recognized revenue by channel, plus paid customer counts and renewal cohorts.
    whyItMatters: AIsphere's surface multiple depends on whether the >$40M ARR claim behaves like durable software revenue or a lower-quality usage mix.
    diligencePath: Request finance reporting exports, auditor support schedules, and billing-cohort views segmented by consumer, API, and enterprise revenue.
    relatedQuestionRefs:
    - QV002
    - QV005
    - QV007
    - QV024
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Gross margin by product surface, compute cost per video minute, support burden, and cloud-commitment schedules.
    whyItMatters: Without a cost bridge, investors cannot tell whether growth scales value creation or just scales GPU and support spend.
    diligencePath: Review FP&A margin decks, cloud contracts, and operating dashboards that allocate infrastructure cost to product lines.
    relatedQuestionRefs:
    - QV022
    - QV025
    - QV027
  - type: private-evidence-only
    severity: material
    topic: enterprise quality
    missingEvidence: Named enterprise/API customers, contract terms, concentration, and renewal history for the non-consumer revenue base.
    whyItMatters: The bull case depends on AIsphere resembling a workflow/API platform more than a creator novelty tool.
    diligencePath: Sample top-customer contracts, inspect revenue concentration tables, and confirm renewal behavior with sales leadership.
    relatedQuestionRefs:
    - QV006
    - QV020
    - QV026
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable coverage
    missingEvidence: A broader, fully normalized set of private and public AI-video comps with audited revenue and term-sheet detail.
    whyItMatters: The comparable table is intentionally sample-based because most private AI-video peers do not publish enough clean revenue and term data for exhaustive like-for-like valuation work.
    diligencePath: Expand the comp set only when additional peers publish audited financials, IPO prospectuses, or cleaner financing disclosures.
    relatedTableRefs:
    - TV004
