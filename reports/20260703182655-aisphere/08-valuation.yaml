  title: Recommendation summary table
  columns:
  - Decision field
  - Current view
  - Supporting evidence
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - The company looks real and scaled, but public evidence still underspecifies revenue quality and security terms.
    - Keep AIsphere live in the funnel; do not clear the current price for investment yet.
  - - Confidence
    - medium
    - Funding, product, and comp evidence are real, but exact valuation mechanics and ARR quality remain under-documented.
    - Prioritize data-room diligence over a hard pass or positive term-sheet recommendation.
  - - Risk rating
    - high
    - Valuation support depends on revenue conversion, compute economics, and a favorable AI capital-markets window.
    - Treat any deal as diligence-heavy and downside-sensitive.
  - - Valuation stance
    - stretched
    - A ~$1B headline mark on >$40M ARR implies a lower multiple than hotter peers, but also reflects weaker disclosure and proof.
    - Require either better evidence or a more forgiving entry price.
  - - Entry discipline
    - No fresh capital at the current mark without cap-table and revenue-bridge clarity
    - The biggest unresolved variables are preference stack, paid-customer quality, and gross-margin durability.
    - Push for price protection, milestone tranching, or wait.
  - - Upgrade path
    - Audited proof or cheaper entry
    - A cleaner ARR bridge and terms package would move the call faster than another narrative funding headline.
    - Revisit only when evidence or price changes materially.
