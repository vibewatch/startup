company:
  name: AIsphere
chapter:
  number: 1
  title: Company Overview
  summary: AIsphere is a real Beijing-based AI-video startup founded in 2023 around Wang Changhu, with PixVerse spanning consumer creation, enterprise APIs, and 2026 world-model ambitions. Public evidence verifies a fast financing climb from Series A through a CDH-led $300 million Series C and strong consumer-scale claims, but governance detail, exact valuation mechanics, and audited economics remain materially under-disclosed.
sections:
- id: identity-and-product-scope
  title: Identity, founding, and product scope
  body: AIsphere is publicly traceable as Beijing Aishi Technology Co., Ltd. (北京爱诗科技有限公司), a Beijing-based startup founded in April 2023. The official corporate site describes the company as building world-leading AI video generation large models and applications, while PixVerse serves as the outward-facing product layer for both consumer creation and enterprise API workflows. Public launch coverage shows PixVerse entering the overseas market in early 2024, and the official product surface now spans web, mobile, templates, APIs, and world-model research. That combination matters because AIsphere is not presenting itself as a one-off demo app; it is positioning itself as a vertically integrated video-model company with proprietary foundation-model R&D, distribution surfaces, and monetizable creation tooling. The fetched evidence also shows the company actively maintaining separate consumer, blog, app-download, and enterprise-facing surfaces, which strengthens confidence that the product footprint
    is operational rather than aspirational.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO008
  - CO024
  - CO025
  - CO035
  tableRefs:
