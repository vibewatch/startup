- id: adverse-signals-and-disclosure-caveats
  title: Adverse signals and disclosure caveats
  body: 'The cautionary evidence is mostly strategic and disclosure-oriented rather than legal-penalty driven. KrASIA’s retelling of AIsphere’s rise emphasizes that the company was founded when many investors doubted independent video-model startups could survive beside OpenAI and China’s internet giants. The same article says subscription revenue now covers costs, but that remains a founder-reported milestone rather than an audited financial disclosure. More broadly, headline metrics such as ARR, user totals, and sector-leadership claims are still concentrated in company-linked or single-chain media reporting. Governance transparency is also thin: there is no clean public board roster, cap table, or exact Series C post-money valuation. That does not negate the business; it means chapter-one confidence should be grounded in product and funding reality while still carrying explicit evidence gaps.'
