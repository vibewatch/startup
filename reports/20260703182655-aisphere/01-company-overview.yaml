- id: leadership-and-governance
  title: Leadership, founder-market fit, and governance visibility
  body: 'The public leadership record centers on Wang Changhu and, to a lesser extent, co-founder Xie Xuzhang. Wang’s prior experience at Microsoft Research Asia and ByteDance gives AIsphere a founder profile that maps directly to high-scale video and computer-vision systems, which likely helps both recruiting and investor trust. Xie appears in 2026 financing coverage as a public voice on strategy, global expansion, and the company’s world-model ambition. What is missing is equally important: the fetched public record does not disclose a full board roster, exact ownership structure, or preference-stack detail. That leaves governance and economic control less transparent than the fundraising headlines suggest. For diligence purposes, the lack of a published board roster matters almost as much as the presence of a strong founder, because later-round control can change quickly in capital-intensive AI companies.'
  claimRefs:
  - CO006
  - CO007
  - CO036
  - CO040
  tableRefs:
  - TO002
- id: funding-stage-and-stakeholders
  title: Funding history, stage, and investor coalition
  body: AIsphere’s public financing path moved quickly from a >CNY400 million aggregate Series A by March 2025, to a $60 million Alibaba-led Series B in September 2025, to a $300 million Series C in March 2026 led by CDH Investments. The investor mix broadened across financial investors, strategic internet/cloud backers, state-linked funds, entertainment groups, and Southeast Asian financial institutions. Public coverage consistently describes the Series C as the largest single financing yet in China’s AI-video sector. That supports the user-supplied “Series C / unicorn” framing directionally, but the precise post-money valuation and preference terms remain under-disclosed in the fetched public record.
  claimRefs:
  - CO009
  - CO012
  - CO013
  - CO015
