  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board roster, voting rights, and current fully diluted cap table.
    whyItMatters: Control rights and dilution determine who truly governs the company after several rapid financing rounds.
    diligencePath: Request board materials, charter documents, and the latest cap-table export under NDA.
    relatedQuestionRefs:
    - QO002
    - QO027
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: valuation mechanics
    missingEvidence: A reconciled March 2026 post-money valuation, liquidation preference stack, and any side-letter economics.
    whyItMatters: The headline unicorn-level valuation may overstate investability if preference terms or structure are aggressive.
    diligencePath: Obtain the Series C term sheet, shareholder agreement, and post-money capitalization schedule.
    relatedQuestionRefs:
    - QO003
    - QO028
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue quality
    missingEvidence: Audited or management-certified ARR bridge, net revenue retention, and gross-margin detail behind the >$40M ARR claim.
    whyItMatters: Headline ARR alone cannot support underwriting without knowing pricing quality, churn, and cost-to-serve.
    diligencePath: Request monthly recurring revenue cohort tables, churn/NRR, and contribution-margin reports.
    relatedQuestionRefs:
    - QO016
  - type: conflicting-data
    severity: minor
    topic: user metrics
    missingEvidence: A single dated dashboard reconciling global users, MAU, and videos generated across web and mobile.
    whyItMatters: Different public sources cite 40M, 60M, and 100M+ users at different times, which is directionally positive but not cleanly standardized.
    diligencePath: Request first-party analytics exports with a common definition of users, MAU, and cumulative videos.
    relatedQuestionRefs:
    - QO005
    - QO015
