- id: traction-milestones-and-platform-evolution
  title: Traction claims, product milestones, and platform evolution
  body: 'The company’s public story is unusually milestone-dense for a two-year-old startup. By March 2025, Yicai reported more than 40 million users and more than 15 million monthly active users. By late 2025 and early 2026, company-linked and media-linked coverage escalated that story to more than 100 million users, more than 16 million monthly active users, and ARR above $40 million. On the product side, AIsphere launched R1 in January 2026 as a real-time world model and V6 in March 2026 as a more controllable cinematic model, while official update pages show an expanding production platform that includes CLI, team, and enterprise-facing layers. The broad pattern is clear: AIsphere is scaling both product scope and distribution speed very rapidly.'
