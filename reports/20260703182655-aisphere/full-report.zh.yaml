  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：生成式视频 AI 是工作流层，不是整个 AI 经济
        blocks:
          - type: paragraph
            body: >-
              本章最重要的纪律，是先定义边界，再谈规模。这里的窄口径市场不是全部生成式 AI，也不是全部媒体软件。TBRC 将视频创作中的生成式 AI 定义为： 用生成模型创建、编辑或增强视频内容；TBRC 和
              Research and Markets 都按部署、应用和终端用户切分该类别。这些定义覆盖文本生成视频、 图像生成视频、编辑和增强、协作，以及云端或本地部署交付。它们并不能把上游 GPU
              训练支出、通用超大规模云厂商 AI 收入，或非 AI 制作软件算作视频创作厂商的直接市场收入。 PixVerse、Runway、Pika、Vidu、Kling、Jimeng 和 Wan
              的官方界面也显示，竞争集合如今横跨消费者创作工具、工作流平台和 API 产品。 这对 AIsphere 很关键，因为公司处在 AI
              经济中一个真实但更窄的楔子里：创意视频生成以及紧邻它的工作流，而不是整个基础模型栈。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
