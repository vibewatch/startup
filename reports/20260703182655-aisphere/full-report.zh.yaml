  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、替代品、内部自建和潜在进入者
        blocks:
          - type: paragraph
            body: >-
              AIsphere 的竞争集合异常宽，因为买方可以用多种方式完成同一项任务。最窄的直接同业桶是面向创作者的 AI 视频生成：Runway、OpenAI Sora、
              Kling、Vidu、Hailuo、Wan、Jimeng/Seedance 和 Pika 都在营销文本生成视频、图像生成视频、音频或可控电影化工作流的某种组合。
              当创作者、工作室或专业消费者想要打包的视频生成产品，而不是通用聊天机器人时，这些就是最干净的替代品。基准测试来源进一步显示， 中国实验室和应用如今主导了相当一部分质量前沿：Artificial Analysis
              目前在多个排行榜上把 ByteDance Seedance 排在 Kling、Vidu、Wan 和 PixVerse 之前，Hailuo、Grok、LTX 和 Veo 也在不同价位持续增加选择。这意味着
              PixVerse 不是在一个可以自我命名的小众类别里竞争， 而是在一个密集、快速迭代的全球赛场中竞争。


              一旦纳入替代品，市场边界还会更宽。内部自建是可信选项，因为基准测试场中已经有 LTX-2.x 和 Wan 变体等开放权重模型，成熟团队可以选择自托管，
              而不是购买订阅产品。模型路由平台也是另一类替代品：Runway 现在把 Kling、Seedance 和 Veo 等第三方模型打包进自己的付费计划， Pika 的 MCP
              和智能体定位也公开承诺接入“所有模型”。最后，潜在进入者不需要发布独立视频应用也能产生影响。OpenAI 和 Moonshot 这样的通用实验室可以把开发者拉进更广的智能体或助手生态，
              操作系统级或分发端既有玩家则可以只靠成为创作发生的默认界面取胜。对 AIsphere 来说，真正的问题不是“还有谁做 AI 视频”，而是“谁拥有 AI 视频周围的用户、 工作流和路由层”。
