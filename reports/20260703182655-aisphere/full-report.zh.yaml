  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 数值 / 空值
      - 可信度
      - 为何重要
      - 尽调问题
    rows:
      - - 官方入门包价格锚点
        - $0.20 / 条 V6 720p 5s 无音频视频（由 $1 = 5 条视频推导）
        - 中
        - 给出最清晰的公开单位价格底线，但没有反映实际组合或企业价格表
        - 提供按消费者套餐、企业合同和 API 工作负载拆分的实际 ASP。
      - - 公开 ARR
        - '>$40M（报告称）'
        - 中
        - 显示业务很可能已在有意义的规模上变现，但未说明收入有多持久、利润如何
        - 提供月度收入桥、递延收入和经审计师审阅的收入确认政策。
      - - 公开用户基数
        - '>100M 用户（报告称 / 公司声称）'
        - 中
        - 用户漏斗大，有助于解释投资人兴趣和免费增值式变现潜力
        - 按地域把用户拆成注册、活跃、付费和留存用户群。
      - - 公开月活跃用户
        - '>16M MAU（报告称）'
        - 中
        - MAU 是有用的参与度代理指标，但不能替代付费账户或收入留存
        - 提供 MAU 到付费用户转化、付费用户流失，以及付费套餐 MAU 占比。
      - - 官方平台规模说法
        - 100M+ 用户、175+ 个国家、2B+ 条生成视频（公司声称）
        - 中
        - 高使用量有助于数据飞轮和分发，但也可能抬高算力和审核成本
        - 披露付费与免费生成占比，以及每活跃用户的支持或审核成本。
      - - 创始人口径盈利标记
        - 订阅收入覆盖成本
        - 低
        - 如果属实，这可能很重要，但该说法未经审计，也没有说明是否排除 R&D 或股权激励
        - 提供按主要产品线拆分的 GAAP 与 non-GAAP 贡献利润率。
      - - 毛利率 / NRR / 企业客户数
        - null
        - 低
        - 这些是判断 AIsphere 是否像持久软件业务那样运转的核心质量指标
        - 提供毛利率、NRR、头部客户数、大客户门槛和同期群留存。
    notes: 本表把公开牵引力代理指标和公共记录止步处的有意空值放在一起。空值标记缺失的承销输入，不是零值。
