        - 直接同业
        - PixVerse 把自己定位为具备 API 和全球创作者触达能力、可服务企业的 AI 媒体平台
        - 创作者、专业消费者、团队和 API 构建者
        - 迭代快、价格定位强，并连接中国与全球市场
        - 不只要证明模型质量，还要证明留存和工作流所有权
      - - Runway
        - 全球直接同业 / 聚合器
        - $315M Series E 轮，估值 $5.3B；世界模型平台野心
        - 创作者、工作室、代理商、企业团队
        - 多模型打包、品牌化工具和企业 GTM
        - 基准优势仍可被路由到多家模型提供商
      - - OpenAI Sora
        - 全球直接同业 / 潜在进入者
        - 曾以世界模拟产品预览，随后在 2026 年下线独立体验
        - 已在 OpenAI 生态内的开发者和创作者
        - OpenAI 品牌、安全工具和相邻平台触达
        - 独立产品持久性看起来弱于标题叙事
      - - Kling
        - 中国直接同业
        - Kling 3.0 和 3.0 Omni 在 AA 排行榜接近头部
        - 专业消费者和高端创作者工作流
        - 电影感控制强、长篇分镜、原生音频
        - 公开价格点相较 PixVerse 和 Vidu 偏高
      - - Vidu
        - 中国直接同业
        - AA 排名质量，加上参考视频工作流定位
        - 快速周转的社交、广告和叙事创作者
        - 参考视频工作流和有竞争力的基准价格
        - 抓取到的公开治理材料相对薄
      - - Hailuo
        - 中国直接同业
        - a16z 将 Hailuo 列为面向全球输出的中国视频产品
        - 消费级创作者
        - 品牌能见度和中国牵引的迭代速度
        - 抓取到的落地页几乎不披露价格或合规细节
      - - Wan
        - 中国直接同业 / 自建替代
        - 多个模型变体出现在 AA 基准中，并进入开放式替代对比
        - 混用闭源和自托管流程的开发者与创作者
        - 基准能见度强，同时系列周边有开放式替代压力
        - 公开落地页信息薄；保留来源看不清企业打包
      - - Jimeng / Seedance
        - 中国直接同业 / 潜在进入者
        - Seedance 在保留的 AA 排行榜领先；Jimeng 露出 ByteDance 创作者工作流基因
        - 中国创作者和 ByteDance 邻近用户
        - 排行榜领先质量，加上社区和中文提示适配
        - ByteDance 可通过更大生态承接价值，而不必依赖独立厂商
      - - Pika
        - 全球直接同业 / 路由层
        - 以智能体和 MCP 叙事承诺接入“所有模型”
        - 需要特效和 AI 智能体工作流的创作者
        - 可聚合模型，而非押注单一前沿模型
        - 抓取到的公开价格信息薄，定位仍在演进
      - - 内部自建 / 开放权重栈
        - 替代方案
        - LTX 开放权重模型和进入基准的开放式替代品已进入买方比较集
        - 工作室、代理商和技术团队
        - 路由成本最低、控制力最高
        - 需要运维人才，打磨度可能落后高端应用
      - - 通用型进入者（Moonshot、Veo、Grok）
        - 潜在进入者 / 相邻替代品
        - Moonshot 估值 $20B；Veo 和 Grok 在 AA 排名中接近前沿
        - 需要广义 AI 工作空间、而不只是视频工具的开发者
        - 可把视频与代码、搜索、推理或平台默认项打包
        - 视频可能只是众多功能之一，挤压纯视频厂商利润率
    notes: 本表刻意混合直接应用、替代方案和相邻进入者，因为买方可用打包应用、路由平台或自托管栈完成同一任务。
