      - number: '7.5'
        title: 资本与执行风险
        blocks:
          - type: paragraph
            body: >-
              即便完成 Series C，资本风险仍然真实存在，因为新融资没有回答核心承销问题。公开证据显示 AIsphere 融资 $300 million
              并推进更大的产品界面，但烧钱速度、现金跑道、客户回本、头部客户集中度和留存后毛利率结构仍未披露。这很重要，因为 PixVerse
              的定价明确以积分为基础、门槛低；它可以加速采用，也可能掩盖一个问题：在完整分摊算力和支持成本之后，重度使用能否转化为耐久的贡献利润率。执行风险也高于公司增长叙事暗示的水平。组织现在需要一支管理梯队，同时支撑合规、信任与安全、合作伙伴赋能、企业支持、云运营和法律监督。但公开材料大多强调产品速度，而不是这些职能背后的人员深度。结果是一个中高风险项：融资实力降低了短期破产担忧，但运营和财务披露不完整，投资者仍无法检验
              AIsphere 能否把消费者级规模动量转化为耐久、合规且经济性有吸引力的企业增长。
