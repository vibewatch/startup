  - id: TV005
    title: 打破投资逻辑与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降价融资或重结构化融资
        - 新资金定价低于隐含独角兽水平，或加入激进的优先级条款
        - 说明当前公开估值高估了外部支持，或高估了证券质量。
        - 除非条款大幅改善，否则从继续研究转为回避 / 等待重置。
      - - 收入桥接薄弱
        - 从质量看，确认收入、ARR 构成或 API / 企业端结构支撑不了 >$40M 的公开口径
        - 打破“规模信号正在转化为持久软件经济性”的投资逻辑。
        - 将估值重定价到悲观区间。
      - - 付费客户质量薄弱
        - 低付费转化、续约弱，或用户规模背后高度集中
        - 让产品热度变成比估值假设更弱的变现故事。
        - 要求更低入场价或里程碑式结构。
      - - 基准测试滑坡
        - PixVerse 失去第一梯队位置，或在质量 / 成本权衡上明显落后
        - 削弱产品竞争力能够支撑溢价定价的论据。
        - 降低乐观情景概率，并压缩可接受倍数。
      - - 行业倍数压缩
        - 香港或私募市场对中国 AI 的风险偏好明显降温
        - 移除当前支撑私有和新上市可比公司的稀缺性支撑。
        - 从尽调转为等待重新定价。
    notes: 这些是与入场价格和证券质量相连的估值专项终止标准，不是对一般风险登记表的重复。
    claimRefs:
