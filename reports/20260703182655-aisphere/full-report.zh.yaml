        - 生成核心 V6/C1 短片输出，覆盖镜头、音频和多镜头行为
        - 训练数据、推理基础设施和按秒计费引擎
        - 独立基准显示质量强但并非领先无争议，原始模型优势仍可被挑战
      - - 音频 / 场景控制层
        - 协调语音、音乐、音效、镜头运动和镜头连续性
        - 集成音频开关、字面化提示词规范和多镜头处理
        - 品牌准确的产品镜头、多语言对白和混乱动作仍需要人工复核
      - - R1 世界模型层
        - 生成连续可交互的视频世界，而不是一段段离散成片
        - Omni 原生多模态处理、低步数采样、记忆增强注意力
        - 选择性开放的包装意味着真实吞吐量和支持能力披露仍不足
      - - API / 自动化层
        - 让合作伙伴和开发者用脚本生成，或嵌入流水线
        - 平台定价文档、声称的 CLI 访问和 R1 合作伙伴计划
        - 公开文档更强调商业访问，对实现细节或 SLA 深度披露较少
      - - 权利 / 合规层
        - 在分发或创作时执行标识、IP 规则和使用政策
        - 中国标识义务、KAGAMI Gate 控制、应用商店审核、内部审核
        - 官方页面未描述类似信任中心的机制或溯源标准
      - - 算力 / 供应链层
        - 供给训练和推理所需的 GPU 与先进计算
        - 出口管制环境、供应商关系和后端云容量
        - BIS 指引显示，与中国相关的算力获取仍是现实运营依赖
    notes: 这张架构表把软件模块、治理层和外部依赖放在一起，因为 PixVerse 的公开运营模式是商业工作流加云服务，不只是狭义机器学习里的模型架构。
