      - 买方 / 付款方
      - 与 AIsphere 的相关性
    rows:
      - - 消费级创作应用
        - 创作者购买的文生视频、图生视频、模板、编辑、特效、订阅和积分
        - 泛娱乐支出、非 AI 编辑工具，以及无关社交平台广告收入
        - 个人创作者或专业消费者付款方
        - 相关，因为 PixVerse 仍在争夺创作者心智和自下而上的付费转化
      - - SMB / 营销人员工作流
        - 营销活动视频生成、广告素材、社交内容、轻量工作流自动化
        - 与视频生成或生产输出无关的广义营销云支出
        - 营销经理或 SMB 业主
        - 相关，因为视频 AI 可以由增长预算买单，而不只依赖创作者订阅
      - - 媒体 / IP 生产
        - 协作生产、品牌模板、授权内容工作流、资产管理和分发工具
        - 与 AI 视频工作流无关的传统工作室资本开支、无关后期制作和权利成本
        - 工作室运营或媒体制作预算负责人
        - 相关，因为可控性和品牌工作流可以支撑更高价值、类似企业的预算
      - - 开发者 / API 层
        - API 调用、合作伙伴计划、工作流集成、工具构建者使用，以及嵌入式实时视频服务
        - 视频工作流之外的通用云推理支出，或非视频开发者工具
        - 平台产品负责人或工程预算
        - 相关，因为 AIsphere 营销的是 API 和实时视频基础设施，而不只是终端用户创作
      - - 企业 / 受治理部署
        - 团队方案、治理、私有或受控部署、采购主导合同和合规工具
        - 没有视频 AI 用例的广义数字化转型预算
        - IT、采购或业务单元负责人
        - 相关，因为企业买方更看重控制、治理和工作流可靠性，而不是一次性短片的新奇感
      - - 相邻但排除的上游层
        - 不直接计入视频应用厂商直接市场收入
        - 基础模型训练资本开支、超大规模云厂商 GPU 支出、通用公有云 AI 收入和无关 AI 软件
        - 算力和平台所有者
        - 作为投入成本和议价能力很重要，但不是 AIsphere 的干净直接 TAM
    notes: 本表定义本章可计入的市场边界。它纳入已变现的视频生成工作流，排除上游 AI 基础设施和无关软件支出。
