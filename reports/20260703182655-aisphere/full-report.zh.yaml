  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 支撑证据
      - 改变判断的证据
    rows:
      - - AIsphere 是已有规模的真实资产，不是概念故事。
        - 投资逻辑
        - 公司已融资 $300M，开放付费产品入口，并出现在独立基准测试样本中。
        - 经审计的分渠道收入和队列数据，会把这条从可信度证据推进到完整承销证据。
      - - 当前估值仍可能主要是叙事估值。
        - 反向逻辑
        - 公开记录尚未对准确投后估值、优先股堆叠或确认收入质量做出对账。
        - 干净的投资条款清单和收入桥接会降低叙事溢价。
      - - 从表面算术看，AIsphere 比最热 AI 可比公司便宜。
        - 投资逻辑
        - 粗略 25x ARR 上限低于 Runway 和 Moonshot 的公开倍数。
        - 如果 ARR 质量偏弱或条款激进，这个折价就会消失。
      - - PixVerse 有竞争力，但尚未清楚占据主导。
        - 反向逻辑
        - Artificial Analysis 显示，它是在竞争紧密的第一梯队，而不是遥遥领先的基准王者。
        - 如果能长期领跑基准测试，或拿出分场景胜率证据，溢价倍数论据会更强。
      - - 披露质量明显低于成熟上市软件公司的规范。
        - 反向逻辑
        - 上市公司文件会披露收入质量和利润率标记，而 AIsphere 没有公布。
        - 管理层级 KPI 披露和审计报表会缩小可信度折价。
      - - 证券条款质量可能落后于公司质量。
        - 反向逻辑
        - 看不到公开股权结构表、清算瀑布或附函经济条款。
        - 干净条款提升可投性的速度，可能快过更多增长标题。
    notes: 反向逻辑主要针对定价、证据质量和证券结构，而不是否认 AIsphere 有真实产品。
