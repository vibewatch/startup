      - number: '5.2'
        title: 架构与运行模式：底层是自研视频基础模型，R1 则推向持久多模态世界引擎
        blocks:
          - type: paragraph
            body: >-
              公开架构故事有两层。第一层是围绕 V6、V5.6、C1 和相关创作模式的成熟视频生成栈。官方发布材料、定价文档和详细 V6 评测显示，
              这是一个云端模型家族，已经支持文本生成视频、图像生成视频、转场、延展、参考生成视频、集成音频，以及 1080p 输出，并配有透明点数定价。 第二层是较新的 R1 方向，PixVerse
              不把它描述为短片生成器，而是实时世界模型：连续交互式 1080p 视频、omni-native 多模态处理、 低采样步数、记忆增强注意力，并更新支持单张照片
              avatar、持久会话和多用户共享世界。这一运行模式在战略上重要，因为它把 AIsphere 从只比拼短视频质量， 推向可能支撑模拟、交互娱乐和实时环境的架构。但合作伙伴计划的打包显示，这一层还不成熟：最具新意的
              R1 能力仍是选择性开放的早期访问基础设施， 不是广泛自助的生产 API。换句话说，自研视频基础模型层今天看起来已经商业化；世界模型层技术上很有野心，但仍部分处于普遍可用前阶段。
