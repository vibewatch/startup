        - 未知企业买家是否拿到显著不同的有效价格
        - 官方定价文档
      - - 分辨率、时长、音频和运动计费
        - 积分随模型参数变化；快速运动会让积分消耗翻倍
        - 明确的标价规则
        - 客户选择高阶设置的频率未知，套餐是否削弱定价也未知
        - 官方定价文档
      - - 预付积分包
        - $50、$500、$2,000 和 $5,000 档位出现在抓取页面上
        - 可见标价
        - 促销、企业返利或年度承诺之后每美元可得多少积分未知
        - 官方定价文档
      - - Scale 计划
        - 抓取文本显示价格为 $1,500，含 239,230 月度积分和 5,316 条生成视频
        - 可见标价，但页面抽取不完美
        - 抓取文本中入门层级版式部分错乱，因此对外引用前应实时复核低层级套餐
        - 官方定价文档
      - - Business 计划
        - 抓取文本显示价格为 $6,000，含 1,069,500 月度积分和 23,766 条生成视频
        - 可见标价，但页面抽取不完美
        - 合同期限、用户上限、支持权益，以及显示的经济性是否对应特定模型基线均未知
        - 官方定价文档
      - - Team 与伙伴合同
        - 基于报价或选择性定价；官方文章提到合并计费和伙伴旧价沿用，但未公开费率
        - 可能主要是实际定价，而不是公开标价
        - 未抓取到公开席位下限、折扣带、支持加价或承诺用量条款
        - 生产平台与 R1 伙伴计划更新
    notes: 只复现清晰可读的官方数字。定价文档抽取有部分噪声，因此本表使用可见锚点，并在存在模糊处明确标注。
