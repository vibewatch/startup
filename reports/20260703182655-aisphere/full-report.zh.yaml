          tone: neutral
      edges:
        - from: funding
          to: decision
        - from: scale
          to: decision
        - from: comp
          to: decision
        - from: quality
          to: decision
        - from: terms
          to: decision
    approximationNotes: 该流程是定性的，不是概率化的；它映射保留估值证据所暗含的决策链。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV026
      - CV030
      - CV033
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 相比又一条叙事型融资头条，AIsphere 的价值对证据质量和条款更敏感。
    data:
      items:
        - label: 收入桥接质量
          value: 5
          detail: 最大的缺失输入，是报告 ARR 如何转化为已确认的经常性收入。
          tone: warning
        - label: 股权结构 / 优先权
          value: 5
          detail: 条款一旦可见，证券质量的重估速度可能快过公司质量。
          tone: warning
        - label: 付费客户分群
          value: 4
          detail: NRR、流失率和集中度决定规模故事是否配得上软件式倍数。
          tone: warning
        - label: 算力 / 毛利证明
          value: 4
          detail: AI 视频经济性对每 token 成本和每分钟成本效率高度敏感。
          tone: warning
        - label: 板块稀缺溢价
          value: 3
          detail: 中国 AI 和 AI 视频仍有资金胃口，能支撑可比估值标记，但这不是公司特有护城河。
          tone: neutral
        - label: 基准表现持久性
          value: 3
          detail: 有竞争力的一线表现很重要，但单靠小幅产品差距无法化解变现风险。
          tone: neutral
    approximationNotes: 数值是 1 到 5 的序数型影响评分，不是概率，也不是机械定价模型。
    claimRefs:
      - CV020
      - CV022
      - CV023
      - CV024
      - CV025
      - CV037
      - CV042
      - CV045
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 采用情景区间比单点目标更站得住脚，因为价格支撑取决于仍然缺失的证据。
    data:
      items:
        - label: 悲观情景
          low: 550
          mid: 650
          high: 750
          displayValue: $0.55B-$0.75B
          detail: ARR 质量不及预期，或板块倍数在更充分披露到来前压缩。
          tone: negative
        - label: 基准情景
          low: 850
          mid: 975
          high: 1100
          displayValue: $0.85B-$1.10B
          detail: 商业真实性站得住，但证据和条款仍只披露一部分。
          tone: warning
        - label: 乐观情景
          low: 1400
          mid: 1600
          high: 1800
          displayValue: $1.4B-$1.8B
          detail: 经审计的经济性、更清晰的企业客户结构和持续的一线产品证据支撑上行。
          tone: positive
    approximationNotes: 区间是基于已披露 ARR 下限、可比公司估值区间和披露质量推导的编辑性情景估计，不是 DCF 或退出模型式精确测算。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV038
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: AIsphere 在战略相关性和产品可信度上得分高，但在证据深度和证券可见度上得分低。
    data:
      items:
        - label: 战略市场时点
          value: 7
          max: 10
          note: 2026 年，AI 视频和中国 AI 资本叙事仍提供支撑。
        - label: 产品可信度
          value: 7
          max: 10
          note: PixVerse 有独立基准测试支撑，看起来是一线产品，而不是投机概念。
        - label: 变现触点
          value: 6
          max: 10
          note: 消费者、API 和类企业场景都已出现，但结构还没有完全看清。
        - label: 收入质量可见度
          value: 3
          max: 10
          note: 没有公开收入桥接、cohort 指标或经审计的经常性收入细节。
        - label: 证券条款可见度
          value: 2
          max: 10
          note: 优先权栈和投后所有权影响仍未公开。
        - label: 相对估值舒适度
          value: 4
          max: 10
          note: 当前估值标记可以理解，但基于现有证据，吸引力并不明显。
    approximationNotes: 评分是基于运行日已保留证据的 IC 式启发判断，不是管理层 KPI。
    claimRefs:
      - CV019
      - CV020
      - CV026
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV047
