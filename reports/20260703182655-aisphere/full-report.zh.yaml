companyProfile:
  summary: >-
    AIsphere（北京爱诗科技有限公司）是一家位于北京的生成式视频创业公司，2023 年 4 月由创始人兼 CEO Wang Changhu 创立， 联合创始人 Xie Xuzhang 也在 2026 年融资报道中公开露面。旗舰产品
    PixVerse 覆盖文本生成视频、图像生成视频、创作者模板、 移动端分发、企业风格 API，并通过 PixVerse R1 延伸到实时世界模型。公开融资节奏很快：2025 年完成大额 Series A 轮， 随后是 Alibaba
    领投的 Series B 轮，再到 2026 年 3 月 CDH 领投的 $300 million Series C 轮。因此，公司的公开故事是真实且已起规模的， 但收入质量、毛利结构、治理和安全条款仍缺少足够披露。
