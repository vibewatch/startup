      - number: '4.4'
        title: 资本充足性与融资依赖：新资金降低短期风险，但没有跑通现金跑道
        blocks:
          - type: paragraph
            body: >-
              AIsphere 并不像缺资本的预产品创业公司。多篇 2026 年 3 月报道独立把最新轮次定位为 $300 million，称其为中国 AI 视频赛道创纪录融资， 并称资金用于研发、新业务探索和全球扩张。AI
              Insider 又加入熟悉的独角兽框架，KrASIA 则称创始人认为订阅收入已覆盖成本。这些信号重要，
              因为它们降低了即时生存风险，也显示投资人愿意为世界模型雄心提供资金。但承销上限仍低。抓取来源没有披露手头现金、月度烧钱、现金跑道、债务、
              云承诺或下一轮触发条件。即便最强的正面证据也仍是方向性的，而非资产负债表级别。Runway 2026 年 2 月以 $5.3 billion 估值融资 $315 million，是有用背景：前沿 AI
              视频同业即使证明需求后，仍可能需要非常大额融资。因此，AIsphere 最新融资是一层缓冲， 不是公司已经摆脱融资依赖的证明。
