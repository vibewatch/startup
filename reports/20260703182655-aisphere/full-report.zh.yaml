      - number: '7.4'
        title: 合作伙伴、依赖、客户与竞争风险
        blocks:
          - type: paragraph
            body: >-
              AIsphere 的依赖栈异常密集。据报道，Alibaba Cloud 为训练、推理、全球部署和合规提供全栈支持，这让双方关系具有战略价值，也让云集中度成为直接的经济和可用性风险。GPU
              依赖进一步放大问题，因为前沿视频模型仍需要先进计算，而世界模型野心推高算力需求时，出口规则正好可能影响中国相关访问。分发也很集中。应用商店规模是优势，但也意味着发现、支付、排名可见度和一部分客户信任都落在第三方平台上，而不是
              AIsphere 自有渠道里。企业变现引入了另一种依赖模式：R1 API 合作伙伴计划是选择性开放，而非完全开放，因此近期企业收入可能依赖一组相对较小的合格合作伙伴和支持资源。授权 IP
              与工作流合作同样有两面性。Captain Tsubasa 和 KAGAMI Gate 显示 AIsphere 正在构建权利清晰的增长循环，Tripo
              集成拓宽了创作者工作流，但每个合作伙伴也都可能成为延误、重新谈判或稀释的节点。竞争进一步抬高风险，因为 Runway
              和其他视频实验室都在讲类似的世界模型叙事；如果质量领先地位滑落，品类领导者的快速轮换可能把今天的牵引力变成明天的流失。
