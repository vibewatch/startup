      - number: '8.2'
        title: 可比公司组，以及 AIsphere 实际所处位置
        blocks:
          - type: paragraph
            body: >-
              解读 AIsphere 隐含估值的最好方式，是把它放在一个情绪亢奋但内部分层的可比公司组中。Runway 是最接近的私有 AI 视频工作流可比公司：TechCrunch 称其在 2026 年 2 月以 $5.3
              billion 估值融资，而 Sacra 估算其 2025 年年化收入为 $90 million，隐含约 59x 收入倍数。Pika 低得多，估值约 $470
              million，但公开来源没有足够清晰地披露收入，无法得出可靠倍数。高端则是 Moonshot 的 2026 年 5 月融资和 4 月 ARR 披露，隐含大约 100x ARR 下限；MiniMax 的香港
              IPO 估值相对其披露收入和亏损，也说明只要叙事动量还在，公开市场愿意接受非常高的中国 AI 倍数。


              按表面算术，AIsphere 比这些更热的可比公司便宜，但它的验证也更弱。独立基准测试把 PixVerse V6
              放在有竞争力的第一梯队，而不是明确主导位置；品类仍足够拥挤，买方切换是真风险。公开记录也缺少后期软件或基础设施投资者通常会要求的企业级披露。因此，正确结论不是「AIsphere 很便宜，因为 25x 低于 59x
              或 100x」。更好的结论是，市场可能有充分理由给 AIsphere 一个披露折价，同时承认公司确实有真实规模和可信产品。
