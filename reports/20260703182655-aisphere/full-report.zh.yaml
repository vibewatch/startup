  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: PixVerse 把创作者 UX、工作流编排、自研生成模型和初现轮廓的实时世界模型层，叠在云交付和合规控制之上。
    data:
      layers:
        - id: L1
          label: 创作者 / 用户入口
          description: 网页应用、移动应用、模板、参考素材和适配社交发布的创作外壳
          detail: 公开入口包括 Creation、Agent、Mini-Apps、Marketing Hub 和官方移动下载流程。
        - id: L2
          label: 工作流与协作层
          description: Canvas 节点、共享工作区、素材库和权限
          detail: 工作流层把 PixVerse 从单用户生成器变成带记忆和复用能力的项目系统。
        - id: L3
          label: 自研视频生成层
          description: V6、V5.6、C1、音视频控制、转场、延展，以及参考图生视频逻辑
          detail: 核心商业视频引擎支持 1080p、音频、多镜头和按秒计费积分定价。
        - id: L4
          label: 实时世界模型层
          description: R1 连续交互视频、虚拟形象、持久性和多人世界
