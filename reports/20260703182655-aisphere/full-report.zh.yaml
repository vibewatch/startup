    rows:
      - - 中国生成式 AI 服务规则
        - 公开适用
        - 面向中国公众提供的视频服务必须使用合法数据、保护个人信息、标识特定输出，并提供稳定服务
        - PixVerse 的合规落地细节没有公开文档
      - - 2025 年中国 AI 内容标识规则
        - 公开适用且有时间约束
        - 对 AI 生成的文本、图像、音频、视频和虚拟场景，要求显式标识以及元数据 / 隐式标识
        - PixVerse 公开页面没有说明用户或 API 实际获得哪种标识路径
      - - KAGAMI Gate 的 IP 权利管控
        - 可见概念验证
        - 为 Captain Tsubasa 合作提供受权利管理的模板创作
        - 框架有潜力，但尚未在多个大型 IP 系列中验证
      - - 移动端权限与隐私足迹
        - 可从应用商店和 AppBrain 页面看到
        - 相机、麦克风、存储、通知、广告 ID 和网络访问，与媒体生成应用相符
        - 用户仍需要更清楚的公开说明，涵盖数据处理、广告和留存实践
      - - 公开可靠性 / 信任中心页面
        - 已审阅官方页面未发现
        - 状态历史、SOC 2、ISO 27001、事故报告、信任中心或 API SLA
        - 公开控制平面很薄，企业买家仍需私下尽调
      - - 公开溯源 / 水印披露
        - 已审阅 PixVerse 材料未发现
        - 生成视频是否带有明确溯源元数据或默认水印
        - 前沿同行披露更多，PixVerse 的信任差异化仍不清楚
      - - 用户可见的输出质量和点数投诉
