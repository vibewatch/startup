      - number: '3.3'
        title: 分发、信任与切换成本：控制平面正在移到模型之上
        blocks:
          - type: paragraph
            body: >-
              分发和信任是非对称性最重要的地方。Runway 不再只是模型供应商；它在建设世界模型平台，并已经用定价把自己定位成多模型网关。Pika 通过智能体和 MCP 做类似事情；a16z Top 100
              报告则认为，许多持久的消费者赢家要么路由到第三方模型，要么不靠拥有最佳前沿模型也能成功。这对 AIsphere 具有战略意义： 即使 PixVerse
              在质量上跟得上，价值也可能向上迁移到路由层，或横向迁移到已经拥有用户关系的平台。同一份报告称，Hailuo 和 Kling 等中国视频产品已经走向全球；
              同时应用商店正在打击山寨界面。这有利于拥有真实品牌和社区的产品，但也意味着新的消费者领导者不一定要拥有独特底层模型。


              信任和监管姿态又加了一道筛选。面向中国的厂商已经处在 2023 年生成式 AI 服务暂行办法和 2025 年标识制度之下，后者要求对 AI 生成内容做可见和基于元数据的标识。 这些规则带来标识、日志、导出 /
              下载控制和平台审核上的运行负担。面向美国和欧盟的企业买方则有另一套镜头：NIST AI RMF、EU AI Act 和 Article 53 式 GPAI
              义务，都会把厂商推向文档、版权处理、训练数据摘要和可识别生成内容。换句话说，产品质量让厂商进入候选名单，治理流程则可能决定谁能通过采购。 公开记录在这里好坏参半：OpenAI 和 Runway
              详细讨论安全或产品限制，Hailuo 和 Wan 在抓取界面上公开的治理细节少得多。如果 AIsphere 想更深入销售给企业或受监管的创意工作流， 信任姿态必须像模型演示一样清晰可读。
