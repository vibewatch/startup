        - Web 应用、移动应用、账号同步和云端生成后端
        - 功能面很宽，仍可能掩盖企业级可观测性或治理披露不足
      - - 工作流编排层
        - 存储项目状态、节点、参考素材、故事板、批次和团队资产
        - Canvas、Team Plan、共享素材库和权限模型
