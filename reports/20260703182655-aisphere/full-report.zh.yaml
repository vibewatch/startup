      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景逻辑与价格纪律
        blocks:
          - type: paragraph
            body: >-
              在这里，情景分析比单点目标更站得住。在乐观情景下，AIsphere 会把公开 ARR 和用户主张转化为更清晰的审计桥，证明企业 / API 经济性具备实质意义，并让 PixVerse
              保持足够竞争力，使公司继续受益于板块层面的稀缺性。在这种事实组合下，约 $1.4 billion 到 $1.8 billion 的估值可以支撑。基准情景下，公开商业故事方向上真实，但还无法干净承销：ARR
              真实但部分偏创作者，利润率仍难评估，条款仍是私有信息。这支撑大约 $0.85 billion 到 $1.1 billion 的估值，使当前名义估值更接近公平偏紧，而不是显然便宜。


              悲观情景是双重打击。如果付费转化、企业质量或 API 深度令人失望，同时 AI 视频稀缺性溢价降温，估值可能压缩到大约 $0.55 billion 到 $0.75
              billion。这并不要求公司失败。它只需要投资者决定，一家仍不透明的 AI 视频创业公司不应再按最亢奋同行的方式定价。因此，入场纪律比叙事热情更重要：升级路径是更好的证据或更好的价格，最好两者都有。
