        - 让 AIsphere 继续留在漏斗中；当前价格暂不放行投资。
      - - 置信度
        - 中
        - 融资、产品和可比公司证据都真实存在，但具体估值机制和 ARR 质量仍缺少足够文件支持。
        - 优先做数据室尽调，而不是直接否决或给出正面投资条款建议。
      - - 风险评级
        - 高
        - 估值支撑取决于收入转化、算力经济性，以及 AI 资本市场窗口是否有利。
        - 任何交易都应按高尽调强度、对下行情景敏感来处理。
      - - 估值立场
        - 偏高
        - 约 $1B 的公开估值若对应 >$40M ARR，倍数低于更热同行，但也反映披露和验证更弱。
        - 要么拿到更扎实证据，要么争取更宽松入场价格。
      - - 入场纪律
        - 若股权结构表和收入桥接不清，不按当前估值投入新资金
        - 最大未解变量是优先股堆叠、付费客户质量和毛利率耐久性。
        - 争取价格保护、里程碑分期，或者等待。
      - - 上调路径
        - 经审计证据或更低入场价
        - 更清晰的 ARR 桥接和条款包，比又一条叙事型融资新闻更能快速改变判断。
        - 只有证据或价格出现实质变化时再重估。
    notes: 本表刻意对价格敏感：它总结的是当前估值已经隐含的假设，而不是抽象地给 AIsphere 打分。
