  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - 消费者积分或订阅支出
        - 用户通过 PixVerse 套餐和积分余额付费，在消费者端生成短片
        - 按月 / 按积分 / 按短片
        - 官方定价文档披露基于积分的标价和月度套餐结构，但实际付费用户转化未披露
        - 存在性可信度中，实际收益低
        - 提供付费用户数、转化率、退款率，以及按套餐拆分的活跃付费用户净收入。
      - - 预付积分充值
        - 客户购买一次性积分包，以增加生成量
        - 按包 / 按积分
        - 官方文档显示 $50 至 $5,000 的包档位，意味着钱包式追加销售
        - 打包方式可信度中，需求质量低
        - 披露充值频率、积分包相对订阅的收入占比，以及未用余额处理政策。
      - - API 或开发者平台使用
        - 开发者或产品团队通过公开平台和 API 入口接入生成能力
        - 按次生成 / 用量合同
        - 平台页面和文档展示 API 定位，但实际 API 价格和用量未公开
        - 入口存在可信度中，经济性低
        - 提供 API 资费表、承诺用量条款，以及按模型家族拆分的毛利率。
      - - 团队工作区计费
        - 组织通过 Team Plan 购买共享积分、管理员控制和共享工作区
        - 按席位 / 共享积分 / 组织订阅
        - 官方生产平台更新确认合并计费和共享积分；未抓取到团队公开价格表
        - 功能存在可信度中，定价清晰度低
        - 提供 Team Plan 席位价格、超额规则和组织平均支出。
      - - 选择性 R1 伙伴合同
        - 工作室、流媒体平台和工具开发者通过受控伙伴准入接入实时视频
        - 议价合同 / 用量承诺
        - 官方伙伴计划文章称早期伙伴享受优惠定价且可沿用旧价，但没有披露公开数字
        - GTM 路径可信度中，变现可见度低
        - 提供伙伴数量、平均合同价值、承诺用量和支持负担。
      - - 垂直工作流工具和商业制作服务
        - Mini Apps 和工作流工具面向广告、营销和其他制作场景
        - 按活动 / 按工作流 / 企业合同
        - 官方工作流文章展示产品化商业工具，但未公开拆分分部收入
        - 低至中
        - 披露垂直工具是通过独立 SKU、用量提升，还是企业包扩张来变现。
    notes: 各行区分公开可见的变现入口和仍未披露的实现数据。产品入口存在，并不证明它贡献了收入。
