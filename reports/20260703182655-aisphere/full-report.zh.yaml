        - 质量接近 PixVerse，同时看起来比 Kling 更有价格竞争力
      - - Seedance 2.0 720p
        - AA 基准视角：$9.07 / min
        - 基准比较中的模型级 API 定价
        - 品类领先的文生视频和图生视频质量
        - 如果最佳基准质量也具备价格竞争力，其他厂商的利润空间都会被压缩
      - - Wan 2.7
        - AA 基准视角：$16.90 / min
        - 模型级基准价格；公开落地页信息薄
        - 有竞争力的图像 / 视频质量，以及系列周边开放式替代压力
        - 基准存在感真实，但公开打包透明度有限
      - - Pika
        - 保留抓取的首页没有清晰公开价目卡
        - 应用、实验、智能体和 MCP 入口
        - 特效、智能体工作流和多模型接入
        - 路由便利性可能比透明单位定价更重要
      - - 内部自建 / LTX-2.3 Fast
        - AA 基准视角：$2.40 / min
        - 开放权重或自托管路线
        - 成本更低的自管视频生成
        - 保留选项中最便宜的一档，会限制高端应用在商品化用例上的收费
    notes: 本表比较来源集中留存的最佳公开经济指标；并非每个竞争对手都披露清晰订阅或 API 价目卡，所以这里有意混用基准 $/min 和官方积分定价，并逐项标注。
