  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 经审计 ARR 和渠道结构验证其具备软件质量的经常性收入；条款干净；PixVerse 在基准测试中保持第一梯队。
        - $1.4B-$1.8B；只有披露质量追上故事时，当前估值才显得可接受。
        - 低-中
        - 需要企业 / API 经济性比当前公开记录显示得强得多。
      - - 基准
        - ARR 被证明真实，但收入结构仍只披露一部分，证券条款继续不公开。
        - $0.85B-$1.1B；今天的估值大致在合理到偏高之间，安全边际有限。
        - 中
        - 投资人仍暴露在倍数压缩和条款清单意外之下。
      - - 悲观
        - 在 AIsphere 展示更清晰经济性之前，付费转化、企业收入质量或行业风险偏好转弱。
        - $0.55B-$0.75B；公司即便经营未失败，也可能被重估到远低于独角兽叙事的水平。
        - 中-高
        - 叙事溢价和收入质量担忧可能同时破裂。
    notes: 区间是情景估值，不是 DCF 输出；公开证据对股权结构机制、确认收入质量和利润率结构披露不足，不能假装精确。
