        - id: n2
          label: 选择入口：app / 网页端 / 小程序 / 团队工作区
          detail: 用户路径取决于任务是快速短片、营销活动，还是协作制作。
        - id: n3
          label: 在 Canvas 或共享素材库中整理资产与参考
          detail: 项目记忆变成持久状态，而不是一串孤立提示词。
