      - number: '2.4'
        title: 增长驱动正在把类别从短片生成推向更广的制作工作流
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动很清楚，也有相当充分的佐证。TBRC 明确把社交媒体和数字平台扩张列为需求驱动，两家市场研究发布方也指出自动化编辑、 个性化营销、协作和云工作流是顺风。官方产品界面解释了原因。PixVerse
              现在在营销一个世界引擎，带有长时域生成、实时 1080p 和可用于生产的 API； Runway 推出通用世界模型和交互式视频角色；Pika
              推出智能体和工作流自动化。这些不只是更漂亮的短片生成器，而是在尝试把视频 AI 推进可重复工作流、 交互式体验和可扩张的软件预算。定价设计也帮助采用。PixVerse
              暴露低金额、基于点数的创作经济模型，Runway 则提供免费入口、专业消费者订阅和企业定制打包。
              这个组合支撑经典的落地再扩张路径：创作者可以低成本试用，团队可以把工作流正式化，企业则在输出足够好且运行足够可靠后谈判更大部署。
