      - number: '7.2'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              法律与监管暴露是 AIsphere 最清晰的第一层风险，因为 PixVerse 正好集合了监管想要约束的特征：面向公众的生成式视频、实时交互、用户上传内容，以及不断扩大的 API
              分发。中国暂行办法适用于向公众提供、生成文本、图像、音频、视频或其他内容的生成式 AI 服务，要求训练数据来源合法，并通过深度合成制度明确规定标识义务。2025
              年标识办法进一步加入显式面向用户的标记和隐式元数据要求，同时推动提供者完善投诉处理、用户协议、日志记录和内容安全控制。对 AIsphere 来说，这不是遥远政策标题，而是具体落地负担，因为 PixVerse
              同时经营中国和全球网页界面、消费应用和生产工作流。出口管制是第二条主要法律线索：BIS 在 2026 年澄清，先进计算物项仍需为中国相关实体申请许可证，因此任何前沿 GPU
              访问收紧都可能直接传导到模型节奏和服务经济性。第三条法律线索是版权。美国生成式 AI 诉讼仍然没有解决训练数据合理使用、输出所有权和下游责任问题；AI
              视频产品在营销品牌或角色类输出时，还会面对额外暴露。AIsphere 已开始尝试授权 IP 基础设施，这是方向上的加分项，但公开证据尚未显示出成熟、经过审计的法律控制栈。
