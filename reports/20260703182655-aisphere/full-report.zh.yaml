  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付产品：PixVerse 现在覆盖消费者创作、协作工作流、可编程 API 和早期世界模型层
        blocks:
          - type: paragraph
            body: >-
              公开产品定义远不止一个提示词输入框。面向消费者的界面可见于 app.pixverse.ai，其导航如今暴露 Creation、Agent、Canvas、Mini-Apps、 Marketing Hub 和 API
              Platform；移动端教程和 Google Play 列表显示，同一套栈通过官方 iOS 和 Android App 分发，并具备云同步， 而不是一个独立缩水的伴侣应用。这很重要，因为它把 PixVerse
              变成了跨界面的工作流：个人创作者可以在移动端从模板或文本提示词开始， 团队可以转入共享工作区和集中资产，开发者可以把同一生成工作流升级为 API 或 CLI 自动化。2026 年生产平台更新把这一层次显性化：
              增加 Team Plan 权限、池化计费和 Mini Apps；Canvas 则为脚本、参考、分镜、批量和成片提供节点式看板。按工作流看，AIsphere 交付的是 AI
              视频的创作者操作系统，而不只是模型端点。战略含义偏正面：工作流所有权和界面宽度，比原始排行榜比较更能提高切换难度。但需要注意的是， 公开证明最强的是打包和功能广度；每一层已经承载多少收入或企业留存，证据要薄得多。
