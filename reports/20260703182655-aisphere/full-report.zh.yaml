      - number: '5.4'
        title: 信任、合规与局限：监管可见，但公开治理披露仍比产品界面薄
        blocks:
          - type: paragraph
            body: >-
              公开信任证据好坏参半。正面看，PixVerse 明显运行在可见治理约束内：中国 2023 年生成式 AI 规则适用于公开视频服务， 2025 年标识措施要求对 AI 生成内容做可见和基于元数据的标记；KAGAMI
              Gate 实验也说明，公司正在测试带许可的 IP 授权层， 而不是只靠下架。Google Play 和 AppBrain 界面也让移动端权限足迹可读，Harris 和 BIS 材料则强调合规风险不是假设：
              内容标识执法、出口许可和工作流文档都会影响运行。弱点在于公司没有公开展示的内容。覆盖官方 Web、App、博客和平台界面后， 仍看不到公开信任中心、SOC 2 或 ISO 27001 页面、公开可用性 /
              状态历史，也看不到某些前沿同业已发布的水印和来源证明披露。 这种缺失不能证明内部控制弱，但意味着审核、滥用处理、水印、API SLA、事件响应和 GPU 供给韧性，仍必须从公开网页核查转入私下尽调。
              对承销来说，这是主要技术风险：产品广度已经公开，企业级治理和可靠性还没有。
