  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              AIsphere 的风险栈由三个可能相互叠加、而非孤立出现的问题牵引。第一，PixVerse 是一个同时面向中国和国际界面的公开 AI 视频产品，因此中国的生成式 AI
              和标识规则不是理论背景：它们直接约束内容标识、投诉处理、个人信息义务，以及监管认为控制不足时可能触发的服务暂停。第二，前沿视频质量和低延迟推理仍依赖先进计算和云基础设施，使 AIsphere
              暴露在美国出口管制收紧、NVIDIA 供应限制，以及 Alibaba Cloud 支撑的全球部署集中度之下。第三，公司处在整个生成式 AI 行业尚未解决的版权地带，训练数据来源、输出所有权和授权 IP
              使用仍有争议。下一层风险是模型质量和消费者分发脆弱性，因为 AI 视频里的应用商店规模和榜单地位可能快速逆转；再往下是资本和执行风险，因为 AIsphere
              刚拿到充足融资，但在烧钱速度、客户集中度和合规人员配置上几乎没有公开披露。因此，风险图景更适合被理解为一条传导链：监管和供给先传导到产品可靠性、企业信任、利润率质量，最终传导到估值。
            claimRefs:
              - CR036
              - CR041
              - CR042
              - CR043
              - CR045
