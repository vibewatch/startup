      - number: '2.3'
        title: 买方、用户和付款方分散在五个经济属性不同的细分市场
        blocks:
          - type: paragraph
            body: >-
              买方地图比随口说“创作者应用”更碎。个人创作者是真实用户；Google Play 和 PixVerse 博客也说明，模板、爆款特效和移动端工作流可以带来自下而上的采用。 但 TBRC
              也点名营销和社交媒体用例，Vidu 也明确卖给广告和叙事工作流，因此营销人员和 SMB 是另一类预算方。媒体和 IP 持有者构成第三个细分市场，
              因为品牌内容、授权模板和协同制作流程需要超过一次性消费者提示词的工作流控制。开发者和 API 团队又是单独一类：PixVerse 的 R1 合作伙伴计划面向工作室、 平台开发者和工具构建者，Runway
              则销售实时 Characters API。最后，企业和受治理约束的团队购买逻辑不同于普通创作者；他们关心控制、
              部署模式、团队访问和合同打包。实践中，本章必须区分用户、买方和付款方：终端创作者也许很喜欢产品，但经济决策通常在营销负责人、工作室运营负责人、 平台产品经理或企业采购职能手里。
