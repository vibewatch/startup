      - number: '8.5'
        title: 最终尽调问题和推翻投资论点的触发因素
        blocks:
          - type: paragraph
            body: >-
              剩余尽调工作异常集中，而且高度可执行。第一，投资者需要按渠道拆出从订单额到 ARR 再到确认收入的月度桥，因为当前 >$40 million ARR 主张不足以说明 AIsphere
              是否配得上软件质量倍数。第二，投资者需要 2026 年 3
              月条款清单、投后股权结构表、清算瀑布和所有附函，因为在同一个名义估值下，证券质量可能远弱于公司质量。第三，投资者需要单位经济性证据：每视频分钟算力成本、按产品界面划分的毛利率，以及收入中类似续约而非类似营销活动的比例。


              终止触发因素也同样具体。降价轮、沉重的高级清算优先权，或薄弱的收入桥都会说明独角兽叙事跑在了证据前面。基准测试差距扩大或付费转化降低，会削弱产品质量能够支撑溢价经济性的主张。香港或中国 AI
              融资环境转冷，则会拿走目前支撑可比公司的稀缺性溢价。在这些事项关闭前，正确姿态是继续尽调，而不是确信买入。
