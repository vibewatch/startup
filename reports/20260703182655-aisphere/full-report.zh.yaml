      - number: '2.2'
        title: 需要多组规模镜头，因为公开数字衡量的不是同一件事
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只有在保留多组镜头、而不是强行压成一个 TAM 标题时，才有用。最窄的镜头来自专门的生成式视频报告：TBRC 称市场在 2025 年达到 $0.39 billion，2026 年增至 $0.47
              billion，2030 年达到 $0.98 billion；Research and Markets 使用同样的 $0.47 billion 2026 起点和同样的 $0.98 billion 2030
              终点。相对更大的生成式 AI 复合体，这只是一个小市场；Fortune Business Insights 估计后者 2025 年为 $103.58 billion、2026 年为 $161 billion，到
              2034 年超过 $1.26 trillion。这些数字并不矛盾，更多是范围错配： 一个衡量窄应用层，另一个衡量巨大的跨模态技术栈。第三个镜头不是收入，而是采用率。a16z 称 AI
              视频对短片已变得相当可靠，并指出视频公司进入消费者 AI 榜单前列；Artificial Analysis
              则显示，质量已足够收敛、价格已足够分散，能支撑试用和买方比价。尽调上的正确答案是一组框架，而不是伪造一个单一 TAM。
