              秒、无音频。同一页面按模型、分辨率、时长、音频和运动模式计量使用，也展示更大的点数包和更高层套餐。这足以说明 AIsphere
              已经从纯炒作进入真实点数经济。它还不足以回答投资人最终关心的问题。公开材料仍未披露真实企业定价、折扣、退款、免费转付费、 以及消费者订阅、预付点数、API
