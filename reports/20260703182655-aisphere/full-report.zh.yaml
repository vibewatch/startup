      - number: '8.3'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              投资论点很直接。AIsphere 不是只停留在路演 PPT 的公司。它融到了真实资本，开放了真实产品界面，展示了真实用户规模主张，也出现在独立基准测试集合里，而不是只活在自家营销材料中。这些事实重要，因为它们把
              AIsphere 与尚无收入的概念故事区分开来，也让独角兽级叙事至少方向上说得通。反论点同样重要。公司没有展示准确的估值机制，ARR 主张仍与公司相关而非审计确认，现有证据也没有告诉投资者收入基础主要是粘性的企业
              / API 支出，还是更脆弱的创作者订阅与推广流量组合。Adobe、Snowflake、Datadog、Cloudflare 和 NVIDIA 的公开申报文件，让这个披露缺口无法被忽视。


              在这些抵消因素下，可支撑的判断是继续研究，而不是买入。信心应为中等，因为公司质量案例真实存在，但证券质量案例仍不完整。风险应为高，因为估值支撑取决于多件事同时做对：收入转化、算力纪律，以及仍然打开的 AI
              资本市场窗口。因此，估值立场应为偏紧。按名义估值看，AIsphere 并不显然荒谬，但当前证据基础太薄，不能说价格有吸引力。
