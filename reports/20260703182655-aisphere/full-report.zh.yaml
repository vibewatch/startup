  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和隐含 ARR 倍数
        blocks:
          - type: paragraph
            body: >-
              AIsphere 有足够证据支撑估值讨论，但还不足以支撑一个干净价格。多篇 2026 年 3 月报道相互印证了 $300 million C 轮，并重复同一组商业摘要：AIsphere 的 ARR 已超过 $40
              million、用户超过 100 million、月活用户超过 16 million。对一家 AI
              视频创业公司来说，这些都是有意义的规模标记。它们也符合早前报道的框架：公司在本轮之后方向上已经是独角兽级资产。问题在于，纳入保留的公开来源没有完全对齐准确的投后估值、股权结构影响，或所售证券的经济性。


              这种不确定性很重要，因为它会改变名义倍数的解读。如果公司估值约为 $1 billion，且 ARR 只是超过 $40 million，隐含名义倍数约为 25x ARR 或更低，因为披露的 ARR
              数字只是下限。表面看，这比最热门的 AI 视频和中国 AI 稀缺性可比公司温和。但折价并不显然就是便宜。它主要补偿的是收入质量、付费客户结构、毛利率和优先权结构上的低可见度。换句话说，AIsphere
              真实到足以留在漏斗里，但透明度还不足以把当前名义价格视为自证合理。
