        title: 财务结论与尽调阻塞点：业务在变现，但还不能完全承销
        blocks:
          - type: paragraph
            body: >-
              财务结论复杂但清楚。正面：AIsphere 有可见标价、宽消费者漏斗、组织变现功能、反复出现的 ARR 和规模主张，以及非常新的 $300 million
              融资，这应能买来执行时间。负面：证据仍停在决定收入质量和利润率耐久性的变量之前。公开材料没有展示客户数、 ACV
              分布、队列留存、订单积压、递延收入、合同收入、毛利率、经营现金流、现金余额、债务，或按地域和客户类型的集中度。 上市可比公司让这种缺失更明显，因为它们通常披露这些标记。这不意味着 AIsphere
              弱；它意味着投资人还无法区分一家强软件业务， 和一家快速增长但算力沉重、折扣沉重或服务辅助较多的业务。本章的正确姿态因此应保持谨慎：收入很可能真实，定价肯定真实，
              但在管理层拿出董事会级财务资料和合同级队列证据前，收入质量仍是中低置信度。
