  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与产品范围
        blocks:
          - type: paragraph
            body: >-
              公开资料可以追溯到 AIsphere 即北京爱诗科技有限公司，这是一家 2023 年 4 月在北京成立的创业公司。公司官网称其在打造全球领先的 AI 视频生成大模型和应用，PixVerse
              则是面向消费者创作和企业 API 工作流的外层产品。公开发布报道显示，PixVerse 在 2024 年初进入海外市场； 官方产品界面如今覆盖 Web、移动端、模板、API
              和世界模型研究。这一组合很关键：AIsphere 并不是把自己包装成一次性演示应用，
              而是在把自己定位成垂直一体化的视频模型公司，具备自研基础模型研发、分发界面和可变现的创作工具。抓取到的证据还显示，公司在持续维护消费者、
              博客、应用下载和企业界面，这提高了一个判断的置信度：产品足迹已经在运行，而不是停留在愿景。
