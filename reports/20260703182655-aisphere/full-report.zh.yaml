  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 关键指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - AIsphere（私有，2026 年 3 月）
        - '>$40M ARR 口径；>100M 用户；>16M MAU'
        - 方向上为独角兽级 / 约 $1B 公开估值；准确投后估值未披露
        - 本次直接评估标的
        - ARR 是公司关联口径的下限，证券条款未公开。
      - - Runway（私有，2026 年 2 月）
        - Sacra 估计 2025 年年化收入为 $90M
        - 估值 $5.3B；按 Sacra 估计约 59x 收入
        - 最接近的 AI 视频工作流和世界模型可比公司，且 2026 年融资可见
        - 收入来自第三方估计而非审计，且 Runway 的企业端验证更广。
      - - Pika（私有，2024 年 6 月）
        - 消费端优先的 AI 视频产品；收入未披露
        - $80M 融资后估值约 $470M
        - 可作为该品类底部区间的低端 AI 视频可比对象
        - 估值时间较早，也缺少干净收入基数来做倍数比较。
      - - Moonshot AI（私有，2026 年 5 月）
        - 2026 年 4 月 ARR 超过 $200M
        - 约 $20B 估值；按披露下限粗略约 100x ARR
        - 有最新 ARR 口径的中国 AI 稀缺性上限可比对象
        - 模型、API 和智能体范围远比 AIsphere 更宽。
      - - Zhipu AI（香港 IPO，2026 年 1 月）
        - 香港 IPO 目标募资约 $640M
        - 约 $6.7B / HK$51.2B 的 IPO 估值目标
        - 说明 2026 年公开市场投资人愿意支持中国 AI 稀缺资产
        - 我们保留的样本提供的标准化收入细节有限，难以干净比较倍数。
      - - MiniMax（香港 IPO，2026 年 1 月）
        - 9M25 收入 $53M；亏损 $512M
        - IPO 估值约 $6.5B，随后在模型驱动热情下市值涨至 $33B
        - 最适合观察泡沫化后期风险偏好的中国公开 AI 视频相邻可比对象
        - 上市日和上涨后的定价波动很大，不能代表稳态公允价值。
    notes: 这是一组样本型可比对象，目的是在私有 AI 视频同行和中国公开 AI 发行人之间框定估值逻辑，而不是强行得出一个“正确”倍数。
    enumerationScope:
