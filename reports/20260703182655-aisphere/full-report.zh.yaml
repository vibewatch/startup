      - number: '2.5'
        title: 约束：算力、监管、信任和竞争都会限制单一厂商可捕获的价值
        blocks:
          - type: paragraph
            body: >-
              约束栈和增长栈同样重要。信任和监管上，中国 2023 年生成式 AI 措施适用于向公众生成文本、图像、音频和视频的服务，2025 年标识规则则要求标记 AI
              生成的在线内容。因此，上市速度不只取决于模型质量，也受备案、治理、审核和标识义务约束。成本和供给上，BIS 表示，即使实体位于中国境外， 向中国关联实体出口先进计算仍需许可证；外部法律评论也确认，该要求在
              2026 年仍有效。因此，对中国关联厂商而言，算力可得性仍是真瓶颈。 可靠性和平台连续性也没有完全解决。a16z 称 AI 视频只是最近才对短片变得相当可靠，OpenAI 停止 Sora
              则说明，即便类别领导者也可能突然改变产品方向。 最后，竞争很激烈：官网和基准测试显示可信替代品范围很宽，这意味着并非每一次使用激增都会转化为 AIsphere 的持久收入或利润率捕获。
