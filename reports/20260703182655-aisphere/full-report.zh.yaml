      - number: '3.2'
        title: 能力与定价：质量已经拥挤，打包方式正在变成武器
        blocks:
          - type: paragraph
            body: >-
              能力质量已经不足以单独拉开差距。Artificial Analysis 在宽模型场中比较质量、速度和价格，显示排行榜头部非常拥挤：Seedance 目前同时领先文本生成视频和图像生成视频，
              Kling、Vidu、Wan、Grok、Veo 和 PixVerse 都处在相对紧密的性能区间。这压缩了 PixVerse 拥有独特优势能力栈的说法。即使 PixVerse 表现不错，
              买方也可以在同一个独立记分板上，把它直接同多个相近替代品比较，这减少了不透明价值定价的空间。AIsphere 官方材料仍能讲出可信产品故事—— 面向企业的
              API、近实时生成和激进价格定位——但独立证据表明，这个类别已经变得容易比较、也容易切换。


              定价和打包进一步强化了这种压力。PixVerse 公开文档称，在 Starter pack 下，$1 可生成五段 V6 720p、5 秒、无音频视频；Runway 则发布免费、 Standard、Pro 和
              Max 层级，提供固定月度点数和越来越宽的模型访问。Artificial Analysis 还给出 API 层直接同业可比项：Vidu Q3 Pro 标价 $9.60 per minute，Seedance
              2.0 为 $9.07，Wan 2.7 为 $16.90，多个 Kling 变体显著高于 PixVerse 自己声称的费率。 低端则有开放权重 LTX
              模型，说明开发者如果接受较弱质量，可以购买或自托管便宜得多的视频生成。结果是杠铃型市场：高端品牌应用在打磨程度、
              社区和工作流控制上竞争，开放或聚合栈则限制任何单一视频模型可维持的利润率。这有利于类别增长，却不利于持久的独立护城河。
