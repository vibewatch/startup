      - CV042
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入桥接
        - 按消费者、API 和企业渠道拆分的月度订单额、ARR、递延收入和确认收入
        - 判断 >$40M ARR 口径到底支撑软件质量倍数，还是只支撑促销式规模故事。
        - 财务团队、董事会材料和审计师资料包。
      - - 股权结构表与优先股堆叠
        - C 轮后股权结构表、清算瀑布、反稀释条款和附函经济条款
        - 界定当前公开估值下的证券质量和真实下行风险。
        - 公司法律顾问和融资文件审查。
      - - 单位经济性
        - 按产品入口拆分的毛利率、每视频分钟算力成本、支持负担和云承诺
        - 检验 AI 视频使用量能否带着利润扩张，而不只是看起来有规模。
        - FP&A、基础设施和云合同审查。
      - - 队列质量
        - 付费客户数、NRR、流失、扩张，以及头部客户集中度
        - 区分用户规模和可持续经常性收入质量。
        - 收入运营和账单导出。
      - - 企业 / API 证据
        - 具名企业客户、API 收入占比、合同条款和续约历史
        - 判断 AIsphere 是否应更接近工作流 / API 同行估值，而不是消费端新奇工具。
        - 销售负责人加头部客户合同抽样。
      - - 下一轮 / 退出路径
        - 下一轮融资、老股交易或上市计划的时间和结构
        - 当前私有市场估值部分受有利的 AI 融资和香港发行窗口支撑。
        - 董事会、领投方和银行顾问。
    notes: 这些问题按其改变推荐结论或可接受入场价的速度排序，而不是按获取难易度排序。
    claimRefs:
      - CV037
      - CV043
      - CV044
      - CV045
      - CV046
