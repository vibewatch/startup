- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Social and digital-platform expansion
    - positive
    - current
    - Expands demand for fast, repeatable short-form video creation
    - Quantify which channels actually convert casual usage into paid accounts or recurring enterprise demand.
  - - Automated editing, collaboration, and personalization
    - positive
    - current
    - Moves value from novelty clips into recurring workflow software
    - Test whether workflow features improve retention and willingness to pay versus pure generation quality.
  - - World models, agents, and real-time APIs
    - positive
    - emerging
    - Create new developer and interactive-media budgets beyond creator subscriptions
    - Ask how much current revenue already comes from API or production-platform usage.
  - - Low-friction self-serve pricing
    - positive
    - current
    - Supports land-and-expand adoption from creators into teams
    - Measure paid conversion, ARPU, and the share of users who later upgrade to team or enterprise plans.
  - - Compute cost and advanced-chip access
    - negative
    - current
    - Can cap margins and slow iteration for China-linked vendors
    - Review cloud/GPU commitments, model serving cost per minute, and hardware dependency by product line.
  - - Labeling, governance, and filing requirements in China
    - negative
    - current
    - Turn trust and compliance into recurring operational cost and launch friction
    - Request filing status, moderation process, and average lead time for compliance review.
  - - Platform continuity and reliability risk
    - negative
    - current
    - Buyers may hesitate if leading vendors can change or discontinue products
    - Check SLA terms, export options, data portability, and API versioning commitments.
  - - Crowded substitute set and price competition
    - negative
    - current
    - Competition can compress value capture even if demand grows quickly
    - Map win reasons versus Runway, Pika, Vidu, Kling, and other substitutes by segment.
  notes: The market has real growth tailwinds, but each positive row has an operational qualifier. In this category, adoption often scales faster than durable revenue capture.
