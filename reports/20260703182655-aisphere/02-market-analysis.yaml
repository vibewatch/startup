- id: constraints-and-diligence-gaps
  title: 'Constraints: compute, regulation, trust, and competition all limit how much value any one vendor can capture'
  body: 'The constraint stack is just as important as the growth stack. On the trust and regulation side, China''s 2023 generative AI measures apply to services that generate text, images, audio, and video for the public, while the 2025 labeling rules require AI-generated online content to be marked. That means speed to market is conditioned by filing, governance, moderation, and labeling obligations, not only by model quality. On the cost and supply side, BIS says advanced-computing exports to China-linked entities still need licenses even when the entity sits outside China, and outside legal commentary confirms that requirement remained in force in 2026. Compute availability therefore remains a real bottleneck for China-linked vendors. Reliability and platform continuity also remain unresolved. a16z says AI video only recently became fairly dependable for short clips, and OpenAI''s Sora discontinuation shows that even category leaders can change product direction abruptly. Finally, competition
    is intense: official sites and benchmarks show a wide field of credible substitutes, which means not every usage surge will translate into durable revenue or margin capture for AIsphere.'
