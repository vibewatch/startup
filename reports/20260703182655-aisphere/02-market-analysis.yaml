  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-isolation
    missingEvidence: Segmented revenue or GMV by creator subscriptions, SMB marketing, media production, API usage, and enterprise contracts.
    whyItMatters: Without segment-level monetization, the chapter can bound market demand but cannot defend a company-specific SAM/SOM or margin-rich revenue wedge.
    diligencePath: Ask management for the last 12 months of revenue mix, active paid accounts, ARPU by channel, and top ten customer contract values.
    relatedQuestionRefs:
    - QM025
    - QM026
  - type: missing-source
    severity: material
    topic: compliance-costs
    missingEvidence: Public data on moderation headcount, filing timelines, labeling tooling cost, and incident rates for AI-video providers operating in China.
    whyItMatters: Compliance can convert nominal demand into slow or low-margin deployment if labeling and governance are labor intensive.
    diligencePath: Request internal compliance org charts, filing status by product, moderation vendor spend, and historical enforcement or takedown logs.
    relatedQuestionRefs:
    - QM027
  - type: missing-source
    severity: material
    topic: enterprise-stickiness
    missingEvidence: Retention, seat expansion, and API usage curves for team, studio, and enterprise buyers across the category.
    whyItMatters: The valuation case depends more on durable workflow adoption than on casual creator experimentation, but public retention data is sparse.
    diligencePath: Ask for cohort retention, seat growth, API call growth, and the share of revenue under annual or multi-year contracts.
    relatedQuestionRefs:
    - QM026
  - type: conflicting-data
    severity: minor
    topic: tam-methodology
    missingEvidence: A methodology crosswalk that reconciles narrow generative-video estimates with broader generative-AI market studies and benchmark-led adoption proxies.
    whyItMatters: Investors can misread these figures as additive or directly comparable when they measure different layers, geographies, and years.
    diligencePath: Maintain the multi-lens table in future refreshes and ask each publisher for inclusion/exclusion definitions before using the figures in valuation work.
    relatedQuestionRefs:
    - QM004
    - QM028
