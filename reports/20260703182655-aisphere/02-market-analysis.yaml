tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to AIsphere
  rows:
  - - Consumer creation apps
    - Text-to-video, image-to-video, templates, editing, effects, subscriptions, and credits purchased by creators
    - Generic entertainment spending, non-AI editing tools, and unrelated social-platform ad revenue
    - Individual creator or prosumer payer
    - Relevant because PixVerse still competes for creator mindshare and bottom-up paid conversion
  - - SMB / marketer workflow
    - Campaign video generation, ad creatives, social content, lightweight workflow automation
    - Broad marketing-cloud spend unrelated to video generation or production output
    - Marketing manager or SMB owner
    - Relevant because video AI can be funded from growth budgets rather than only creator subscriptions
  - - Media / IP production
    - Collaborative production, branded templates, licensed content workflows, asset management, and distribution tooling
    - Traditional studio capex, unrelated post-production, and rights costs not tied to AI video workflows
    - Studio operations or media production budget owner
    - Relevant because controllability and branded workflows can support higher-value enterprise-like budgets
  - - Developer / API layer
    - API calls, partner programs, workflow integrations, tool-builder usage, and embedded real-time video services
    - Generic cloud inference spend outside the video workflow or non-video developer tooling
    - Platform product owner or engineering budget
    - Relevant because AIsphere markets APIs and real-time video infrastructure, not only end-user creation
  - - Enterprise / governed deployment
    - Team plans, governance, private or controlled deployment, procurement-led contracts, and compliance tooling
    - Broad digital-transformation budgets without a video-AI use case
    - IT, procurement, or business-unit owner
    - Relevant because enterprise buyers value control, governance, and workflow reliability more than one-off clip novelty
  - - Adjacent but excluded upper layer
    - None directly counted as direct market revenue for video-app vendors
    - Foundation-model training capex, hyperscaler GPU spend, generic public-cloud AI revenue, and unrelated AI software
    - Compute and platform owners
    - Important as input cost and bargaining power, but not a clean direct TAM for AIsphere
  notes: This table defines the countable market boundary for the chapter. It includes monetized video-generation workflows and excludes upstream AI infrastructure and unrelated software spend.
