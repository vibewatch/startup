callouts:
- calloutType: insight
  title: No single TAM survives contact with scope
  body: The narrow generative-video market is a real category, but it is vastly smaller than the broader generative-AI stack. Keeping both frames visible is more honest than pretending one number answers every market-sizing question.
  claimRefs:
  - CM009
  - CM010
  - CM012
  - CM045
- calloutType: risk
  title: Regulation and compute can delay monetization even when demand is obvious
  body: Category demand can rise faster than deployable, compliant, margin-positive revenue. Labeling rules, filings, export controls, and platform continuity all sit between model quality and durable budget capture.
  claimRefs:
  - CM038
