    - 2025 adoption proxy
    - Global consumer web/mobile
    - Ranking-based proxy
    - Video products enter top AI consumer rankings and Hailuo/Kling surpass Sora in monthly visits
    - Demand and usage proxy rather than revenue size
    - Does not show paid conversion or segment mix
  - - Artificial Analysis
    - 2026 benchmark proxy
    - Global model benchmark surface
    - Elo 1069–1096 in cited examples
    - PixVerse V6 competes within a narrow quality band but at lower posted price than Veo 3.1
    - Performance and price proxy for buyer experimentation
    - Benchmark scores are not the same as market share or revenue
  - - PixVerse official pricing
    - 2026 monetization proxy
    - Global self-serve platform
    - $1 = 5 V6 starter videos
    - Usage-based credits show low-friction creator entry point
    - Bottom-up monetization and developer API economics
    - Company-authored pricing does not reveal realized net revenue or retention
  - - Runway pricing
    - 2026 monetization proxy
    - Global self-serve plus enterprise
    - $12 / $28 / $76 plus enterprise custom credits
    - Tiered packaging supports creator, pro, and enterprise expansion
    - Comparable vendor pricing and packaging lens
    - Competitor pricing still does not reveal industry contract sizes or churn
  notes: 'These rows intentionally preserve different units of analysis: narrow market reports, broad generative-AI context, consumer adoption proxies, and monetization proxies. They are complementary lenses, not additive TAM components.'
