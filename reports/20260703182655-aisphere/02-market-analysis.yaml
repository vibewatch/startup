slug: aisphere
runDate: '2026-07-03'
company:
  name: AIsphere
chapter:
  number: 2
  title: Market Analysis
  summary: 'AIsphere operates inside a real but much narrower market than the headline generative-AI boom implies: dedicated generative video creation plus adjacent workflow and API spend. Public evidence supports three distinct lenses—a sub-$1 billion near-term AI-video-creation market, a much larger $100B+ broader generative-AI market, and consumer/benchmark adoption proxies that show rising usage but not yet clean spend attribution. The opportunity is real across creators, marketers, media/IP, developers, and enterprises, but valuation capture is still constrained by compute economics, platform reliability, regulation, and crowded competition.'
sections:
- id: market-boundary
  title: 'Market boundary: generative video AI is a workflow layer, not the whole AI economy'
  body: 'The most important discipline in this chapter is defining the boundary before sizing anything. The narrow market here is not all generative AI, and it is not all media software. TBRC defines generative AI in video creation as the use of generative models to create, edit, or enhance video content, while both TBRC and Research and Markets segment that category by deployment, application, and end-user. Those definitions capture text-to-video, image-to-video, editing and enhancement, collaboration, and cloud or on-premise delivery. They do not justify counting upstream GPU training spend, generic hyperscaler AI revenue, or non-AI production software as direct market revenue for video-creation vendors. The official surfaces of PixVerse, Runway, Pika, Vidu, Kling, Jimeng, and Wan also show that the competitive set now spans consumer creation tools, workflow platforms, and API products. That matters for AIsphere because the company sits inside a real but narrower wedge of the AI economy:
    creative-video generation and the workflows immediately around it, not the entire foundation-model stack.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Multiple sizing lenses are necessary because the published numbers measure different things
  body: 'Public sizing only becomes usable once the chapter preserves multiple lenses instead of forcing one headline TAM. The narrowest lens comes from the dedicated generative-video reports: TBRC says the market reached $0.39 billion in 2025, grows to $0.47 billion in 2026, and reaches $0.98 billion in 2030; Research and Markets uses the same $0.47 billion 2026 starting point and the same $0.98 billion 2030 end point. That is a small market relative to the broader generative AI complex, where Fortune Business Insights estimates $103.58 billion in 2025, $161 billion in 2026, and more than $1.26 trillion by 2034. Those numbers are not contradictory so much as scope-mismatched: one measures a narrow application layer and the other measures a huge cross-modal technology stack. A third lens is adoption rather than revenue. a16z says AI video became fairly dependable for short clips and highlights video companies moving into the top consumer AI rankings, while Artificial Analysis shows enough
    convergence in quality and enough spread in pricing to support experimentation and buyer shopping. For diligence, the right answer is a range of frames, not a fake single TAM.'
