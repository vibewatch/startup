      - number: '4.2'
        title: Unit economics, liquidity, and leverage
        blocks:
          - type: paragraph
            body: >-
              The Q1 2026 release suggests the business is producing operating leverage: revenue rose, mature-location
              margins were strong, and full-year guidance moved up. At the same time, EquipmentShare still has a large
              fleet, a meaningful debt stack, and a liquidity profile that depends on continued access to revolving
              credit and bond markets. That means underwriting cannot stop at top-line growth; it has to weigh
              depreciation, interest, capital expenditure, and how much of the OWN Program simply shifts financing
              obligations rather than removing them. The most investor-relevant nuance is that a growing revenue base
              does not automatically translate into free cash flow if the company keeps reinvesting into branch openings
              and equipment refresh cycles.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI003
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: What still cannot be underwritten precisely
        blocks:
          - type: paragraph
            body: >-
              The most important financial gap is that public disclosures do not separate external software ARR from the
              rental and services engine. Gross margin by segment is also not transparent enough to build a clean SOTP
              without assumptions. That makes the company easier to understand as a growth platform than as a narrowly
              modeled SaaS business. The investment case therefore rests on public revenue growth, location expansion,
              leverage trends, and the company's ability to keep fleet economics and financing costs under control.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product is
        blocks:
          - type: paragraph
            body: >-
              The product definition is broad because EquipmentShare sells a jobsite operating system, not a single SKU.
              T3 provides visibility into equipment, people, access control, service status, and utilization, while the
              physical rental business gives the company a distribution layer and a reason to install hardware. The
              public materials also show a range of tooling and mobile workflows, including internal apps, time cards,
              and tool-trailer use cases. In practical terms, the product is best thought of as a combined
              hardware-software-ops bundle. The product gets stronger when those layers reinforce one another rather
              than compete for attention.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: figure
