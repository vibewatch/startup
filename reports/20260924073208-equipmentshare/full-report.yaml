      - number: '6.3'
        title: Retention, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              The hard part is that public evidence does not provide a clean NRR, GRR, churn, or customer-count metric.
              That means retention has to be inferred from branch expansion, internal case studies, and repeated use
              cases rather than from a standard SaaS dashboard. The favorable read is that the business seems to expand
              once embedded in a complex jobsite. The adverse read is that concentrated revenue from large national and
              industrial customers can cut both ways if a downturn or project delay hits. The public record therefore
              gives a helpful picture of who buys, but only an incomplete picture of how sticky the relationship really
              is once the initial rental win lands, especially at renewal time.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked legal, financial, and operational risks
        blocks:
          - type: paragraph
            body: >-
              The highest risks are the ones that can break the thesis fastest: a downturn in non-residential
              construction, a capital markets squeeze, or a failure to keep the fleet and T3 stack reliable. Governance
              is also a real risk because the company came public with a founder-controlled structure. Those risks do
              not make the business weak, but they do mean the investment case depends on disciplined execution and a
              macro environment that stays constructive enough to support fleet utilization and refinancing. In
              practice, that means quarterly reporting, branch health, credit access, and customer demand all have to
              move together. A single weak quarter would not end the story, but a few weak quarters would.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
