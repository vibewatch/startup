              - CO005
              - CO010
              - CO011
      - number: '1.2'
        title: Scale, funding, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The latest public disclosures show a company that has scaled to hundreds of locations, roughly a billion
              dollars of quarterly revenue, and a large managed fleet, but still depends on recurring fleet investment
              and external capital. The IPO launched at $24.50 per share and raised roughly $747 million before the
              company traded on Nasdaq in January 2026. A later first-quarter release showed 407 locations, $989 million
              of revenue, and raised full-year 2026 guidance, while an earlier financing release showed a $3 billion ABL
              facility and $640 million of senior notes. That combination suggests meaningful operating leverage, but it
              also keeps the capital-intensity question front and center.
            claimRefs:
              - CO004
              - CO005
              - CO007
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
