chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, ownership, and what the company actually sells
        blocks:
          - type: paragraph
            body: >-
              EquipmentShare is now a public company trading on Nasdaq under EQPT, but the business still looks like the
              vertically integrated model it built privately: equipment rental, equipment sales, parts and service, plus
              T3 software and connected-jobsite tooling. The official website frames the company as a construction
              productivity platform rather than a pure rental broker, and the public filings / press releases show that
              the company uses the rental fleet to seed adoption of the technology layer. The result is a business with
              two linked engines — physical branch density and software-enabled fleet visibility — that share the same
              customer relationship and operating backbone.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
