              - CU011
      - number: '6.2'
        title: Adoption path and proof of use
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is strongest when a public case study or operational article shows actual usage rather
              than just a logo. The Retool case study is useful because it shows internal EquipmentShare teams using
              low-code tools to build market-data and rate-setting workflows, while the official safety article shows
              branch-level operational discipline. Together, these sources suggest that the company consumes its own
              software-style tools internally and then reuses that workflow logic for customer-facing products, which
              makes adoption look operationally real rather than purely promotional.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
