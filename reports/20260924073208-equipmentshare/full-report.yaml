companyProfile:
  summary: >-
    EquipmentShare (Nasdaq: EQPT) is a Columbia, Missouri-based construction technology and equipment rental company
    founded in 2015 by Jabbok Schlacks and Willy Schlacks. It combines equipment rental, sales, service, and the T3
    connected-jobsite platform to serve large contractors, industrial customers, infrastructure projects, and
    data-center builders. The refreshed Q1 2026 reporting set showed 407 operational locations, $989 million of
    quarterly revenue, $1.605 billion of liquidity, and raised full-year 2026 guidance, reinforcing the view that the
    company is still scaling with disciplined execution.
  foundedDate: '2015-01-01'
  founders:
    - name: Jabbok Schlacks
      role: CEO and Co-Founder
      background: Co-founded EquipmentShare and remains the public face of the company.
    - name: Willy Schlacks
      role: President and Co-Founder
      background: Co-founded EquipmentShare and leads product and operating execution.
  foundingLocation: Columbia, MO
  headquarters: Columbia, MO
  productSummary: >-
    Equipment rental, equipment sales, parts and service, and T3-connected jobsite software that combines telematics,
    fleet visibility, access control, and workflow tools.
  customerFocus: >-
    Large contractors, industrial operators, infrastructure developers, and complex-jobsite customers that value uptime,
    visibility, and fleet control.
  businessModel: >-
    A hybrid model with equipment rental as the core revenue engine, supported by sales, service, OWN program economics,
    and software-enabled workflow control.
  stage: Public
  fundingStatus: >-
    Public company after its January 2026 IPO; still supported by prior venture capital, asset-backed lending, and
    OWN-program financing.
  disclosureProfile: public
