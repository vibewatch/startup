evidenceGaps:
  - type: missing-source
    severity: material
    topic: software-monetization
    missingEvidence: A separate disclosure of external T3 ARR or recurring software revenue.
    whyItMatters: Without a standalone software line, the technology layer cannot be valued independently from rental economics.
    diligencePath: Search for a public investor presentation, S-1 exhibit, or management commentary that isolates software revenue.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A fuller public bioset for the management team and board.
    whyItMatters: The leadership table is intentionally partial and should be expanded if public board bios become available.
    diligencePath: Review investor-relations governance pages and any proxy statement for board and executive biographies.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: TO003 stakeholder coverage
    missingEvidence: Full cap-table and investor concentration details.
    whyItMatters: The stakeholder map is directionally useful but not a substitute for full ownership disclosure.
    diligencePath: Review the proxy statement, underwriter materials, and any updated investor relations disclosures.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: TAM construction
    missingEvidence: A current third-party market sizing study for construction rental plus connected-jobsite software.
    whyItMatters: The thesis depends on a bounded market size rather than a generic large-market claim.
    diligencePath: Pull a recent industry report or comparable public-company commentary that isolates rental and telematics spend.
    relatedQuestionRefs:
      - QM004
      - QM008
  - type: missing-source
    severity: material
    topic: pricing transparency
    missingEvidence: Public competitor rate cards or contract terms.
    whyItMatters: Pricing and contract structure drive actual switching costs and margin comparison.
    diligencePath: Collect recent published rate sheets, bid examples, or customer quotes for the major incumbents.
    relatedQuestionRefs:
      - QC007
      - QP008
  - type: missing-source
    severity: material
    topic: segment margin disclosure
    missingEvidence: Gross margin by rental, sales, service, and software segment.
    whyItMatters: Without segment margins, the blend can overstate or understate the software opportunity.
    diligencePath: Pull a later investor presentation or management commentary with segment margin disclosure.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: security architecture
    missingEvidence: A public security, privacy, or API document that shows controls and release cadence.
    whyItMatters: Product trust depends on more than marketing claims when software touches hardware and active jobsites.
    diligencePath: Look for a trust center, security page, or public API documentation.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: retention metrics
    missingEvidence: NRR, GRR, churn, or renewal metrics.
    whyItMatters: Without retention data, expansion has to be inferred from case studies and branch growth.
    diligencePath: Look for an investor deck, public filing, or interview that discloses retention or renewal metrics.
    relatedQuestionRefs:
      - QU007
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: security metrics
    missingEvidence: Public data on incident rates, security controls, or uptime SLAs.
