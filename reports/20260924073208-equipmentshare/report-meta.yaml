  topStrengths:
    - Scaled branch network and strong Q1 2026 execution support continued growth
    - T3 gives the company a differentiated operating layer across connected jobsites
    - Liquidity and leverage improved enough to keep the financing story manageable
    - OWN-program economics reduce some of the fleet-capex burden
  topRisks:
    - Construction cyclicality can quickly compress utilization and margins
    - Software monetization remains opaque relative to the rental business
    - Safety, uptime, and branch execution are core operating risks
  unresolvedGaps:
