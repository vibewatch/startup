companyProfile:
  summary: >-
    EquipmentShare (Nasdaq: EQPT) is a Columbia, Missouri-based construction technology and equipment rental company
    founded in 2015 by Jabbok Schlacks and Willy Schlacks. It combines equipment rental, sales, service, and the T3
    connected-jobsite platform to serve large contractors, industrial customers, infrastructure projects, and
    data-center builders. The refreshed Q1 2026 reporting set showed 407 operational locations, $989 million of
    quarterly revenue, $1.605 billion of liquidity, and raised full-year 2026 guidance, reinforcing the view that the
    company is still scaling with disciplined execution.
  foundedDate: '2015-01-01'
