company:
  name: EquipmentShare
chapter:
  number: 4
  title: Financials
  summary: 'EquipmentShare''s financial profile is that of a scaled but still capital-intensive platform: rental revenue is growing quickly, EBITDA is expanding, and liquidity is ample, yet fleet investment, debt, and the lack of a separately disclosed software line keep the underwriting question anchored on capital efficiency rather than simple revenue growth.'
sections:
- id: finance-revenue-model
  title: Revenue streams and monetization
  body: 'The company monetizes the same customer in several ways: rental, sales, parts and service, telematics, and related jobsite tools. That mix is useful because the rental relationship creates a low-friction path to additional products, but it also makes the revenue line less clean than a pure software company. Public disclosures show rental as the majority of revenue and telematics as an important but still relatively small monetization layer. The practical underwriting question is whether incremental attach from T3 can lift margins enough to justify the capital intensity of the fleet. In other words, the story is not just about what the company sells today, but about whether the same customer can be monetized more richly over time without losing the operating discipline that makes the fleet model work.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: finance-unit-economics
  title: Unit economics, liquidity, and leverage
  body: 'The Q1 2026 release suggests the business is producing operating leverage: revenue rose, mature-location margins were strong, and full-year guidance moved up. At the same time, EquipmentShare still has a large fleet, a meaningful debt stack, and a liquidity profile that depends on continued access to revolving credit and bond markets. That means underwriting cannot stop at top-line growth; it has to weigh depreciation, interest, capital expenditure, and how much of the OWN Program simply shifts financing obligations rather than removing them. The most investor-relevant nuance is that a growing revenue base does not automatically translate into free cash flow if the company keeps reinvesting into branch openings and equipment refresh cycles.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI002
  - TI003
  figureRefs: []
- id: finance-gaps
  title: What still cannot be underwritten precisely
  body: The most important financial gap is that public disclosures do not separate external software ARR from the rental and services engine. Gross margin by segment is also not transparent enough to build a clean SOTP without assumptions. That makes the company easier to understand as a growth platform than as a narrowly modeled SaaS business. The investment case therefore rests on public revenue growth, location expansion, leverage trends, and the company's ability to keep fleet economics and financing costs under control.
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  tableRefs: []
  figureRefs: []
