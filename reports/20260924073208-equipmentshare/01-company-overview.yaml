company:
  name: EquipmentShare
chapter:
  number: 1
  title: Company Overview
  summary: EquipmentShare is a public construction equipment rental and jobsite technology platform headquartered in Columbia, Missouri. The latest public evidence points to a company that combines a fast-growing branch network, a large T3 telematics footprint, and capital-intensive rental operations, but the exact current valuation, headcount, and external SaaS monetization remain only partially disclosed.
sections:
- id: overview-identity
  title: Identity, ownership, and what the company actually sells
  body: "EquipmentShare is now a public company trading on Nasdaq under EQPT, but the business still looks like the vertically integrated model it built privately: equipment rental, equipment sales, parts and service, plus T3 software and connected-jobsite tooling. The official website frames the company as a construction productivity platform rather than a pure rental broker, and the public filings / press releases show that the company uses the rental fleet to seed adoption of the technology layer. The result is a business with two linked engines \u2014 physical branch density and software-enabled fleet visibility \u2014 that share the same customer relationship and operating backbone."
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO006
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: overview-scale-and-capital
  title: Scale, funding, and operating leverage
  body: The latest public disclosures show a company that has scaled to hundreds of locations, roughly a billion dollars of quarterly revenue, and a large managed fleet, but still depends on recurring fleet investment and external capital. The IPO launched at $24.50 per share and raised roughly $747 million before the company traded on Nasdaq in January 2026. A later first-quarter release showed 407 locations, $989 million of revenue, and raised full-year 2026 guidance, while an earlier financing release showed a $3 billion ABL facility and $640 million of senior notes. That combination suggests meaningful operating leverage, but it also keeps the capital-intensity question front and center.
  claimRefs:
  - CO004
  - CO005
  - CO007
  - CO010
  - CO011
  tableRefs:
  - TO002
  - TO003
- id: overview-gaps-and-judgment
  title: What remains opaque and why it matters
  body: "The main underwriting gap is not whether EquipmentShare has scale \u2014 it clearly does \u2014 but how much of the value accrues to the software layer versus the rental fleet, and how much dilution or leverage is still embedded in the capital structure. Public evidence supports the existence of T3, the OWN program, and a growing branch network, yet the company does not separately disclose external SaaS ARR, segment gross margins by product line, or a fully consistent current headcount figure across sources. Those gaps do not break the story, but they do limit precision around valuation and margin durability. For that reason, this chapter treats the company as public, scalable, and operationally improving, while keeping the hidden economics explicit."
  claimRefs:
  - CO008
  - CO009
  - CO012
