              - CR006
      - number: '7.2'
        title: 现场运营、生产安全与数据安全风险敞口
        blocks:
          - type: paragraph
            body: >-
              安全生产绝非仅仅停留在企业文化口号，而是直接的业务运营风险，因为公司日常管理着维修车间、设备堆场、货运车队、维保技师以及车联网硬件设备。公开证据表明公司已上线安全与监控管理规范，但这也仅能降低而非根除风险敞口。正是这套带来产品差异化优势的车载互联模式，反过来扩大了潜在攻击面，并使设备停机故障或服务中断更容易暴露在客户面前。任何网点层面的疏漏都会迅速体现在客户体验、维修成本与企业声誉上。这也正是严谨的现场运营本就是产品交付的核心部分、而绝非后台附属职能的原因。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
