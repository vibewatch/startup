companyProfile:
  summary: >-
    EquipmentShare (Nasdaq: EQPT) 是一家总部位于密苏里州哥伦比亚的建筑科技与工程设备租赁公司，由 Jabbok Schlacks 与 Willy Schlacks 于 2015
    年创立。公司将设备租赁、销售、售后维保以及 T3 互联工地平台融为一体，主要服务大型总包商、工业级客户、基建工程与数据中心承建商。2026 年 Q1 披露的最新财报显示，公司拥有 407 个运营网点、单季收入 9.89
    亿美元、流动性达 16.05 亿美元，并上调了 2026 年全年业绩指引，进一步印证了公司在保持严谨执行力的同时仍在持续扩张。
  foundedDate: '2015-01-01'
  founders:
    - name: Jabbok Schlacks
      role: 联合创始人兼 CEO
      background: 联合创立 EquipmentShare，现为公司公开事务的核心代表。
    - name: Willy Schlacks
      role: 联合创始人兼总裁
      background: 联合创立 EquipmentShare，主管产品与运营执行。
  foundingLocation: Columbia, MO
  headquarters: Columbia, MO
  productSummary: 设备租赁、设备销售、配件与售后维保，以及集成远程车载信息处理（telematics）、车队可视性、门禁权限管理与现场工作流工具的 T3 互联工地软件平台。
  customerFocus: 看重正常运行时间（uptime）、可视性与车队把控力的大型总包商、工业运营商、基础设施开发商及复杂工地客户。
  businessModel: 以设备租赁为核心收入引擎的混合商业模式，辅以销售、维保、OWN 计划（OWN program）资产端分成，以及由软件驱动的工作流管控。
  stage: Public
