      - number: '4.2'
        title: 单店经济模型、流动性与杠杆水平
        blocks:
          - type: paragraph
            body: >-
              2026 年 Q1 财报显示公司正在释放经营杠杆：营收走高，成熟网点利润率表现强劲，且上调了全年业绩指引。但与此同时，EquipmentShare
              仍维持着庞大的车队规模、可观的债务负担，其流动性高度依赖循环授信额度与债券市场的持续通畅。因此投资评估不能只看收入增速，必须审慎权衡折旧、利息支出、资本开支，以及 OWN
              计划究竟是在真正化解还是仅仅转移了融资义务。对投资者而言最微妙的关键在于：如果公司持续将资金砸向新设网点与设备以旧换新周期，不断扩大的收入规模并不会自然转化为自由现金流。
