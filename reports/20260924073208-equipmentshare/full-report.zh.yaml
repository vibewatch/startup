      - number: '8.2'
        title: 市场可能对其给予折价的原因
        blocks:
          - type: paragraph
            body: >-
              悲观情景同样简单：业务依然属于重资本开支模式，公开披露仍显欠缺，且软件业务尚未获得独立公允估值。换言之，市场唯有假设车队周转效率、融资纪律与软件搭售率持续改善，才能支撑起当前估值。一旦其中任一环节放缓，估值倍数可能迅速回落，因为市场会重新将其审视为一家带有债务杠杆的周期性设备租赁公司，而非高估值倍数的软件平台。当商业叙事同时依赖规模增长与资本克制时，微小的执行失误都会被放大，尤其是在融资条件转向严苛的背景下。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
