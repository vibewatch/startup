      - number: '7.3'
        title: 逻辑证伪触发条件与核心监控指标
        blocks:
          - type: paragraph
            body: >-
              核心跟踪信号包括杠杆率、流动性、客户集中度、网点单店表现，以及 T3
              能否持续加深客户锁定效应。一旦收入增速断崖式放缓、车队周转效率下滑，抑或软件业务始终无法发展为具备独立规模的支柱板块，市场终将把公司重新估值为一家平庸的重资产租赁商。唯有管理层守住利润率高位、维系资产负债表稳健并持续增强平台黏性，这一投资逻辑方能立住。若其中若干核心指标长时间亮起红灯，尤其是伴随下游客户需求走弱，将是最明确的预警信号。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 市场看好该逻辑的核心理由
        blocks:
          - type: paragraph
            body: >-
              乐观情景清晰直白：公司具备上市公司体量的收入规模、庞大的线下网点布局、持续改善的利润率，以及深植于运营体系中的软件技术底座。公司在 2026 年 Q1 财报后上调了业绩指引，表明下游需求依然坚挺。若投资者相信
              T3 能够加深客户留存并释放更多商业化潜力，公司理应获得高于传统租赁商的估值溢价。当市场将 EquipmentShare
              视作混合型平台而非单一重资产车队公司时，投资逻辑最为顺畅。只要后续季度披露的文件与投资者交流持续验证这一方向，该溢价便更容易得到支撑。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
