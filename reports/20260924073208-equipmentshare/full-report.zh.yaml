        blocks:
          - type: paragraph
            body: >-
              最新公开披露显示，公司业务已扩张至数百个网点、单季收入约 10 亿美元并管理庞大车队，但日常依然依赖持续的车队重资产投入与外部资本支撑。公司于 2026 年 1 月在纳斯达克挂牌前，以每股 $24.50
              的价格完成 IPO，募资约 $747M。随后发布的一季度财报显示，网点数增至 407 个、单季收入达 $989M，并上调了 2026 年全年业绩指引；而更早的融资公告显示，公司拥有 $3B ABL 授信额度以及
