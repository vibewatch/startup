      - number: '2.3'
        title: 尚无法清晰量化的维度
        blocks:
          - type: paragraph
            body: >-
              尽调的核心缺口在于，公开材料并未将 T3
              软件层与线下物理租赁业务各自捕获的市场份额单独拆分。这就要求估值判断必须牢牢锚定公开证据：已披露的网点扩张速度、公开收入增幅、公布的客户结构以及车联网硬件使用情况。若公司未来能将互联工地技术层直接变现出更多收入，市场给予更高估值倍数便合情合理；反之，它的交易估值就更接近一家带有软件增量潜力的规模化设备租赁平台，而非纯
              SaaS 公司。
