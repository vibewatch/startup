  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞争对手、相邻领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              直接竞争对手以大型上市租赁巨头为首，但实际的对标范围更为广泛：二手设备交易市场、本地经销商网络、单点车队管理工具，以及承包商自有的设备车队。当客户不仅看重交易摩擦成本，更看重能统一管理设备、人员与维保的单一运营体系时，EquipmentShare
              便能占据优势。这使得竞争重心更偏向工作流掌控力、车队数据资产与网点密度，而非单点功能差异或单一租金报价。在实际业务中，每一次签单都是一次系统级选型，绝非简单的单台设备租赁报价。
