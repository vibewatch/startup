            body: >-
              最核心的财务信息缺口在于，公开披露并未将外部软件 ARR
              从租赁与综合服务底盘中独立拆分出来。各业务分部的毛利率也缺乏足够透明度，无法在不借助假设的情况下搭建出纯粹的分部估值模型（SOTP）。这使得公司更适合被看作一家高增长的综合运营平台，而非套用精细化模型测算的
              SaaS 公司。因此，投资逻辑依然立足于公开收入增速、网点扩张节奏、杠杆率走势，以及公司管控车队经济模型与融资成本的实际能力。
