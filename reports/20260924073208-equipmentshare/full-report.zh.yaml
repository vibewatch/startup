    sections:
      - number: '1.1'
        title: 公司定位、股权结构与核心产品
        blocks:
          - type: paragraph
            body: >-
              EquipmentShare 目前已在纳斯达克挂牌上市（代码：EQPT），但其业务结构依然沿袭非上市时期的垂直整合模式：涵盖设备租赁、设备销售、配件与售后维保，外加 T3
              软件与互联工地工具链。公司官网将其定位为建筑生产力平台，而非单纯的设备租赁中介；公开申报文件与新闻稿显示，公司借助租赁车队切入客户，顺势推广软件技术层。这最终构成了由线下网点密度与软件端车队可视性双轮驱动的业务体系，二者共享同一套客户关系与运营底座。
