      - number: '6.3'
        title: 留存率、增购与客户集中度缺口
        blocks:
          - type: paragraph
            body: >-
              评估的难点在于，公开信息未提供清晰明确的 NRR、GRR、客户流失率或客户总数指标。换句话说，判断客户留存只能从网点扩张节奏、内部案例分析与高频复用场景中逆向推导，而无法依赖标准的 SaaS
              核心指标看板。乐观的推论是，业务一旦扎根复杂工地，增购扩展顺理成章；偏空的担忧则是，若遭遇宏观下行或工程延期，集中来自大型全国总包商与工业客户的收入可能成为一把双刃剑。因此，公开资料清晰描绘了“谁在买单”，但在初次设备租赁签单之后客户黏性究竟有多强、尤其是续约节点的真实情况，仍只能看清一部分。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、财务与运营风险优先级排序
        blocks:
          - type: paragraph
            body: >-
              最高级别的风险是那些能迅速击穿投资逻辑的致命因子：非住宅类工程建设陷入低迷、资本市场流动性收紧，或者车队与 T3
              软件栈失去稳定性。公司治理同样是不容忽视的现实风险，因为公司采用创始人绝对控股架构上市。这些风险并不代表商业模式脆弱，但确实意味着整个投资逻辑高度依仗严谨的运营执行力，以及宏观环境需维持在足以支撑车队出租率与债务再融资的水平。在实操中，这要求季度财报业绩、网点健康度、信贷通畅度与下游客户需求同频向好。单一季度业绩疲软不至于推翻逻辑，但连续数个季度不及预期则足以动摇基本盘。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
