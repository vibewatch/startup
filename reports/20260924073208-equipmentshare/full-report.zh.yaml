      - number: '5.3'
        title: 差异化优势与信任度缺口
        blocks:
          - type: paragraph
            body: >-
              其差异化壁垒源于数据密度、车队掌控力与网点执行力的紧密咬合，而非某项单一的专利特性。最大的信任风险集中在运营端：车联网硬件必须稳定运行，维保响应必须及时，且系统在活跃工地上控制高价值重型设备时必须确保绝对安全。现有公开资料证实了其安全与治理流程的存在，但未能深入披露其安全架构与发布管理机制。换言之，产品具备可信度，但透明度仍显不足。对公司而言，最核心的破局点在于将这种未完全公开的后台能力持续转化为可复现的客户价值。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 目标客群画像
        blocks:
          - type: paragraph
            body: >-
              申报文件中的论述表明，其客户群并非单一的小微企业客群。相反，客户结构明显向全国性和区域性大型承包商、工业采购方、基建项目以及政府采购倾斜，小型承包商则更多是根据临时需求零星使用。这一客群特征非常关键：大型且复杂的工程现场，对全盘把控、设备正常运行时间以及将设备、人工、物料归拢在同一平台管理的需求最为迫切。租赁关系是切入工地的滩头阵地；软件渗透则是后续顺理成章的“打单与扩张”（land-and-expand）路径。这种客群倾斜也意味着，当采购方的核心诉求是确保工期节点而非一味追求最低租金成本时，公司更容易拿下订单。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
