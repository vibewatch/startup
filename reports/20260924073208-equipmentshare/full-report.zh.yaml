      - number: '1.3'
        title: 信息不透明之处及其影响
        blocks:
          - type: paragraph
            body: >-
              投资评估的核心缺口不在于 EquipmentShare 是否具备规模——其规模已显而易见——而在于软件业务相比租赁车队究竟沉淀了多少价值，以及资本结构中还隐含多少股权稀释或杠杆风险。公开证据证实了 T3、OWN
              计划以及持续扩张的网点网络，但公司并未单独披露外部 SaaS
              ARR、各产品线的分部毛利率，各类公开渠道给出的当前员工人数也不完全一致。这些信息缺口虽未动摇其基本面逻辑，却限制了对估值与利润率持久性的精确测算。因此，本章认定公司已上市、具备规模化能力且运营持续改善，同时将这些未完全透明的财务实质明确列出。
            claimRefs:
              - CO008
              - CO009
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              该市场更准确的定义是：工程设备租赁，叠加架构在租赁、人力与维保之上的互联工地技术栈。EquipmentShare
              并非试图吞下整个施工预算，而是聚焦那些对设备正常运行时间、设备调配响应速度以及资产和人员可视性要求极高的高价值支出。现阶段的替代方案仍是客户自主采购拥有、本地经销商网络、居间租赁经纪以及碎片化的单点软件工具。厘清这一边界至关重要：它解释了公司为何能同时扮演租赁平台与软件厂商双重角色，以及为何设备租赁关系是推动软件落地的核心通道。关键推论在于，评估该市场空间必须结合工作流渗透深度，而不能仅看粗放的支出分类。
