        title: 市场规模测算视角与需求驱动力
        blocks:
          - type: paragraph
            body: >-
              公开证据支持从多种测算视角推导市场规模，而非给出一个单一且干净的 TAM。第一种视角是管理层在 IPO
              申报文件中引述的美国工程建设项目储备；第二种视角是市场上现有的租赁车队与线下网点网络规模；第三种视角是自有或托管资产上的软件与车联网硬件搭售机会。下游需求主要受基础设施、工业制造、数据中心及先进制造业拉动；主要制约因素则是资本密集度、周期性，以及大量承包商依然自主持有大部分设备的事实。这些制约使得其渗透速度慢于纯软件公司，但一旦嵌入工作流，也会构筑更高的客户切换成本。鉴于数据来源多元且部分带有方向性推断，最稳妥的结论是：市场空间广阔，但尚未得到精确测算。
