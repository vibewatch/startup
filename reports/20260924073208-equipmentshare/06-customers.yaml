company:
  name: EquipmentShare
chapter:
  number: 6
  title: Customers
  summary: EquipmentShare's customer base skews toward larger contractors and complex jobsites where visibility, uptime, and speed matter. The company appears to land through rental and then expand into workflow tooling, but the most important open questions are still around concentration, retention, and the exact depth of customer adoption.
sections:
- id: customer-segmentation
  title: Who the customers are
  body: Public filing commentary shows that the customer base is not a single small-business segment. Instead, the mix skews toward national and regional contractors, industrial buyers, infrastructure projects, and government work, with smaller contractors using the platform more opportunistically. That matters because large, complex jobsites create the strongest need for control, uptime, and the ability to manage fleet, labor, and materials in one place. The rental relationship is the beachhead; software expansion is the land-and-expand logic. That skew also means the company wins more often when the buyer has a project schedule to protect than when the buyer simply wants the lowest cash outlay.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: customer-adoption
  title: Adoption path and proof of use
  body: Adoption evidence is strongest when a public case study or operational article shows actual usage rather than just a logo. The Retool case study is useful because it shows internal EquipmentShare teams using low-code tools to build market-data and rate-setting workflows, while the official safety article shows branch-level operational discipline. Together, these sources suggest that the company consumes its own software-style tools internally and then reuses that workflow logic for customer-facing products, which makes adoption look operationally real rather than purely promotional.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
  - TU003
- id: customer-gaps
  title: Retention, expansion, and concentration gaps
  body: The hard part is that public evidence does not provide a clean NRR, GRR, churn, or customer-count metric. That means retention has to be inferred from branch expansion, internal case studies, and repeated use cases rather than from a standard SaaS dashboard. The favorable read is that the business seems to expand once embedded in a complex jobsite. The adverse read is that concentrated revenue from large national and industrial customers can cut both ways if a downturn or project delay hits. The public record therefore gives a helpful picture of who buys, but only an incomplete picture of how sticky the relationship really is once the initial rental win lands, especially at renewal time.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
