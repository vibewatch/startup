      - CU015
      - CU017
      - CU019
      - CU024
      - CU026
      - CU028
      - CU031
      - CU034
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开证明在结果具体性上最强、在留存可见性上最弱，独立佐证只集中在少数旗舰账户。
    data:
      columns:
        - 结果具体性
        - 独立佐证
        - 持续性可见度
        - 集中度可见度
      rows:
        - label: Moloco Ads
          values:
            - 高 — ShopBack、Scopely、Nexon 和 Fanatics 展示了具体活动结果。
            - 中低 — 即使点名客户，大多数证明仍由 Moloco 撰写。
            - 低 — 没有公开续约、NRR 或合同期限数据。
            - 低 — 未披露按广告主划分的花费集中度。
        - label: Commerce Media
          values:
            - 高 — Bucketplace 和 Musinsa 有量化结果，Costco 也确认了推出细节。
            - 中高 — Costco 获多家媒体独立佐证，Google Cloud 也验证了广告主规模。
            - 中低 — Costco 仍处测试版，更广客户续约情况未公开。
            - 低 — 零售商数量、ARR 结构和头部网络敞口未披露。
        - label: Streaming Monetization
          values:
            - 中高 — JioCinema 和 Karrot 披露了具体运营或活动结果。
            - 中 — JioCinema 包含客户引述，但更广客户名单偏薄。
            - 中 — Viacom18 明确为多年合作，强于多数公开证明。
            - 低 — 未披露收入分成、最低承诺或平台组合。
        - label: 合作伙伴 / 基础设施渠道
          values:
            - 中 — Topsort 和 Google Cloud 更能体现生态触达，而非直接终端用户 ROI。
            - 高 — 合作伙伴侧来源独立于 Moloco 自有案例库。
            - 低 — 间接渠道续约与经济性未披露。
            - 低 — 直接与间接客户集中度仍不透明。
    claimRefs:
