      - number: '2.4'
        title: 隐私与测量约束
        blocks:
          - type: paragraph
            body: >-
              隐私环境是 Moloco 市场的核心，不是旁枝。Apple 的归因堆栈明确要限制用户级追踪，Google 的 Privacy Sandbox 仍是不断演进的外部依赖。这些变化给 Moloco
              带来悖论。正面看，它们提高了第一方零售商数据和模型驱动优化的价值。负面看，它们让移动测量更难，削弱确定性身份识别，并迫使营销团队接受更多模型化归因。


              因此，Moloco 的市场应被看作结构上有吸引力，但运营上受约束。隐私变化不会消灭需求；它们会把优势重新分配给仍能从有限信号中学习的平台。如果 Moloco 的 ML
              堆栈显著强于同行，它就会受益；但同一隐私环境也会提高执行风险，并在平台规则变化快于产品适配周期时压缩可观察表现。这也意味着，客户证明可以看起来很强，同时仍遮住某些渠道中的信号衰减、学习周期拉长或归因置信度下降。
            claimRefs:
              - CM010
              - CM011
              - CM029
              - CM031
              - CM032
              - CM036
      - number: '2.5'
        title: 展示要点
        blocks:
          - type: callout
            title: 三类预算池，一条 ML 逻辑
            body: Moloco 服务三个相邻市场，这些市场都奖励从第一方数据中做出更好预测：应用增长、零售媒体和流媒体变现。这扩大了预算基础，同时不要求公司变成泛品牌广告平台。
            calloutType: strength
            claimRefs:
