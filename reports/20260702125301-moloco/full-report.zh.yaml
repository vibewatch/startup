  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 公开快照
      - 重要性
      - 用于 Moloco 时的主要局限
      - 状态
    rows:
      - - AppLovin
        - 2026 年 7 月市值约 $192.33B
        - 显示公开市场愿为顶级效果型 adtech 叙事支付多高价格
        - 规模和溢价都过高，不能直接作为 Moloco 定价锚
        - 异常高溢价可比对象
      - - The Trade Desk
        - 约 $9.08B 市值；2026 年 7 月 TTM P/S 3.03
        - 这组里最好的开放互联网 DSP 式公开基准
        - 业务模式和市场认知仍不同于 Moloco 的零售媒体组合
        - 核心开放互联网 DSP 可比对象
      - - Criteo
        - 约 $0.95B 市值；2026 年 7 月 TTM P/S 0.4772
        - 有用的低倍数商业媒体 / 效果广告参照
        - 代表公开市场里估值压缩更明显的结果
        - 低倍数下行可比对象
      - - DoubleVerify
        - 约 $1.72B 市值；可获取当前 10-K 页面
        - 可作为公开市场纪律下的测量 / 验证基准
        - 更接近测量，而不是需求侧投放执行
        - 相邻赛道可比对象
      - - Integral Ad Science
        - 约 $1.73B 市值；2024 年年报公开可得
        - 第二个测量 / 品牌安全参照，用来看公开市场如何给广告基础设施相邻资产定价
        - 同样不是 DSP 或零售媒体运营商
        - 相邻赛道可比对象
      - - Amazon DSP
        - 一款拥有丰富第一方信号的开放互联网 DSP，即使不在 Amazon 上卖货也可使用
        - 用来衡量信号密集型效果采购竞争门槛的战略基准
        - 不是估值可比对象，因为 DSP 经济性嵌在 Amazon 更大的平台里
        - 战略参照，而非估值可比对象
    notes: 这是一组用于框定估值区间的部分可比对象；它混合了直接、相邻和战略参照，因为没有一家公开公司能干净对应 Moloco 的三条产品线。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-useful public adtech and commerce-media reference points available in the fetched
        corpus, not an exhaustive global peer screen of every adtech issuer.
