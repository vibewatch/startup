  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 按产品线划分的客户群
        blocks:
          - type: paragraph
            body: >
              Moloco 并不是把一个单体广告产品卖给一种买方。公开材料显示三类不同客户。Moloco Ads 面向应用营销团队和效果团队，帮助它们在独立应用生态中做用户获取和再营销。Moloco Commerce
              Media 面向零售商和交易平台，帮助它们把第一方购物者数据和数字店面库存变成广告业务。Moloco Streaming Monetization
              面向流媒体平台和媒体所有者，帮助它们扩大广告主需求，并通过更好的广告投放和优化提升变现。这个三分法很重要，因为不同产品的买方、用户和付款方不同：应用营销团队用媒体预算购买 Moloco
              Ads；零售商或交易平台运营方购买 Commerce Media 基础设施，品牌方间接使用；流媒体平台购买变现基础设施，广告主则为需求侧出资。


              公开规模标记显示，Moloco 在这些赛道中都有足够宽度，尽管披露仍不均匀。Moloco 称其广告平台覆盖超过 20 亿日活用户，并让广告主触达数百万个独立应用；投资人更新称已有一千多家全球广告主使用
              DSP。商业媒体侧，Google Cloud 称 Moloco RMP 在全球支持 35,000 多个广告主，Moloco 则表示该平台可在一天内激活超过 10,000
              个广告主。这些指标没有告诉投资人，有多少零售商、交易平台或媒体所有者客户直接向 Moloco 付费，但它们说明公司运营在真实广告主和曝光规模上，而不是只停留在试点体量。
