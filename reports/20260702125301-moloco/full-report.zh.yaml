      - number: '6.4'
        title: 扩张、集中度风险与尽调缺口
        blocks:
          - type: paragraph
            body: >
              Moloco 客户章节最大的弱点不是缺少客户标识，而是缺少经济性。公开证据没有披露 NRR、GRR、总流失率、净流失率、平均合同期限、单广告主平均支出、头部客户收入占比或产品线集中度。这个遗漏很重要，因为
              Moloco 最强的公开参考账户本身也是标杆账户：商业媒体的 Costco，流媒体的 JioCinema，以及 Scopely、ShopBack、Fanatics
              等知名游戏和应用营销客户用于效果广告。这些例子验证能力，但如果少数旗舰账户或大型广告主贡献了不成比例的收入或产品可信度，它们仍可能夸大多元化程度。


              文件中最有用的反向来源是 The Drum 的 Costco 文章。文章认为，零售媒体比 Costco 更需要 Costco，并引用 Costco 的说法称，零售媒体应改善客户体验，而不只是提取收入。对
              Moloco
              来说，这是重要警示，因为它暗示公司必须通过证明相关性和购物者效用来赢得扩张，而不能只靠增加广告负载。它也说明为什么不应过度解读试点阶段胜利。落实到尽调，投资人仍需要按直接付款方划分的客户数量、前十大收入集中度、基础设施客户的合同期限和续约数据、DSP
              广告主的支出留存分组，以及由客户发布、从买方侧验证 ROI 的案例研究，而不只是 Moloco 自有营销材料。
