      - number: '8.3'
        title: 情景区间和建议
        blocks:
          - type: paragraph
            body: >
              正确的估值问题不是 Moloco 是否是一家真实公司，而是下一美元入场价格究竟由证据支撑，还是由叙事支撑。公开证据确实支撑一个真实底部。Moloco 2021 年已经越过 >$100M 的运行率，2023
              年投资者更新中报告 2022 年收入 >$200M，到 2026 年仍称收入超过 $200M，同时资金充足并保持盈利。因此，2023 年二级交易给出的 >$2B 估值可信。如果只使用公开收入底线，>$2B
              估值意味着基于超过 $200M 收入的倍数低于 10x；如果当前收入明显高于该底线，有效倍数还会更低。


              但估值可信不等于估值有吸引力。牛市情景需要当前收入增长、细分结构和留存来证明：Moloco
              不只是强劲的移动效果广告专家，已经具备软件品质的零售媒体和流媒体平台特征。基准情景是：盈利能力、规模和第三方效果信号真实，公司应获得中个位数到高个位数倍数；但披露不足，尚不能赢得 AppLovin
              式溢价。熊市情景是增长、客户耐久度或细分质量不及预期，市场把 Moloco 压回较低的上市广告技术区间。因此，这里的纪律性建议是继续研究 / 跟踪，中等信心，估值立场为公允。
