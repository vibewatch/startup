              Moloco 的运营规模让基础设施和模型质量风险具有实质性，而不是理论问题。Google Cloud 称 Moloco 的零售媒体平台支持 35,000 多个广告主，每天处理约 6000 亿次竞价请求，并运行
              20 多个深度神经网络模型。这些指标在战略上有吸引力，但也意味着小幅可靠性回退可能同时传导到许多客户和广告主。Google Cloud Vector Search
              案例尤其重要，因为它把具体业务结果与架构相连：容量约提升 10 倍，p95 延迟最高降低 25%，几次上线中收入提升约 4%。这是技术深度的好证据，但也证明延迟、检索和打分质量直接挂钩变现结果。JioCinema
              的 3200 万并发观众证明和 Costco 的 AI 驱动站内广告进一步说明，Moloco
              运营在错误会被看见且代价高昂的环境中。安全和品牌安全材料显示了有意义的控制，但公开文件仍缺少事故日志、在线率历史和服务级别细节，这让可靠性、危机处理和企业支持成熟度上仍有剩余承销风险。
