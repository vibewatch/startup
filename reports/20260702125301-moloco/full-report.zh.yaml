      - number: '6.2'
        title: 具名客户证明与部署深度
        blocks:
          - type: paragraph
            body: >
              Moloco 的公开证明最深的地方，是广告活动级和部署级案例，而不是正式客户名录。应用广告侧，ShopBack 称 Moloco 帮助其 SKAN 安装量扩大 15 倍，同时 CAC 保持稳定；Scopely 称
              Moloco 在 30 天内为 Monopoly GO 带来超过 100 万次安装，并以 2.6 倍超过 ROAS 目标；Nexon 称 Moloco 的 CTV 方案相对其他渠道让 CPIR 改善约
              50%，ROAS 提高超过 30 个百分点。Musinsa 和 Karrot 尤其有用，因为它们显示 Moloco 横跨多个触点：Musinsa 使用 Moloco Ads
              加商业媒体能力，把再激活转化为购买效率；Karrot 使用 TVING 上的流媒体广告加 Moloco 再营销，把用户从认知推进到聊天和房源浏览。Bucketplace
              又提供了一个零售商变现证明点，结果指标挂钩购物者支出、商家 GMV 和商家广告采用。


              最有说服力的独立或准独立印证来自 Costco 和 JioCinema。Progressive Grocer、Adweek 和 The Drum 都报道了 Costco 决定使用 Moloco 做 AI
              驱动的站内广告和数字端架；这些报道也清楚说明，推出一开始是试点，而不是完全成熟部署。Viacom18 的 JioCinema 引述在生产规模上更强：Moloco 支持的广告投放在 Tata IPL 2023
              期间为 3200 万并发观众处理定向广告，且双方关系被明确描述为多年合作。Fanatics 是较轻但仍有用的 Performance CTV 新证明，因为引述显示已有真实广告主采用，尽管公开发布没有给出
              ShopBack 或 Scopely 那样的量化深度。整体看，Moloco 在应用增长、零售媒体和流媒体上都有真实具名客户证明，但证明质量因账户而明显不同。
