  - id: TV002
    title: 正反论点表
    columns:
      - 视角
      - 看多论点
      - 反论点
      - 哪些证据会改变判断
    rows:
      - - 财务质量
        - 这是一家已盈利、资金充足的私营公司，值得按优质资产重点关注
        - 当前经审计的经营经济性仍缺位，盈利质量还无法完全校准
        - 当前收入、毛利率、自由现金流画像
      - - 产品组合
        - 零售媒体和流媒体把 Moloco 从单一移动 DSP 叙事中拉出来
        - 如果高价值收入仍集中在核心 DSP，产品宽度可能仍是叙事重于收入
        - 分业务收入结构和附加销售率
      - - 市场顺风
        - 零售媒体和数字视频到 2026 年仍在快速增长
        - 品类增长快，不等于平台抽成率和留存能长期守住
        - 直接付费方留存率和扩张分群
      - - 第三方验证
        - Google Cloud 的规模指标和外部排名显示业务确有真实进展
        - 多数指向 Moloco 超额表现的说法仍来自公司自己
        - 独立客户背调和续约证据
      - - 可比公司框架
        - Moloco 可能配得上高于低倍数 adtech 同行的估值
        - 目前公开证据还不足以支撑 AppLovin 式溢价
        - 基于 Moloco 当前指标的详细可比桥
    notes: 反论点关注的是估值压缩和证据质量，并不是在断言 Moloco 没有产品市场契合。
