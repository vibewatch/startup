        - 延迟回退会直接降低广告相关性和转化表现
      - - 已认证运营和开发者界面
        - 通过令牌化认证和安全传输开放活动或 API 访问
        - 登录账号控制、API 密钥管理和 TLS 1.2 或更高版本
        - 凭证滥用或访问治理薄弱，会带来安全和支持负担
      - - 生态数据共享和测量层
        - 与 SSP、DSP、MMP、广告聚合和合规伙伴发送或接收数据
        - 伙伴 API、隐私政策、ATT 和其他平台规则
        - 外部平台变更可能打破测量假设，或减少可用标识符
