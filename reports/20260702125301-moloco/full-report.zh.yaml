  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议链条很简单：官方估值可信度是真实的，市场顺风也是真实的，但证据质量仍不完整，不足以支撑激进价格承销。
    data:
      nodes:
        - id: n1
          label: 官方锚点
          detail: 2021 年 $1.5B、2023 年 >$2.0B 的二级交易，且无一级融资所得
        - id: n2
          label: 经营支撑
          detail: '>$200M 收入、多年盈利以及资金充足表述支撑可信度'
        - id: n3
          label: 市场顺风
          detail: 零售媒体和数字视频到 2026 年仍是有吸引力的终端市场
        - id: n4
          label: 缺失的承销输入
          detail: 当前收入、利润率、留存和条款仍未公开披露
        - id: n5
          label: 建议
          detail: 继续研究 / 以公允估值立场跟踪
      edges:
        - from: n1
          to: n2
          label: 业务已放大，因此价格可信
        - from: n2
          to: n3
          label: 质量遇上顺风
        - from: n3
          to: n4
          label: 但仅靠可比公司和市场数据还不够
        - from: n4
          to: n5
          label: 不透明挡住买入结论
