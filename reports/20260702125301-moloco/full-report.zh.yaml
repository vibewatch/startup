            body: >-
              最干净的硬财务数据点来自 2021 年融资披露和 2023 年投资人更新。合起来看，公司到 2021 年年化收入口径已经跨过 $100M，2022 年收入超过 $200M，并在 Fidelity 和 EDBI
              通过二级交易进入时，已经连续 12 个季度盈利。2026 年 CEO 简历和招聘页面延续了这条叙事，称 Moloco 已经盈利五年，资金充足。


              这些声明由公司自己发布，因此不等同于经审计报表。即便如此，它们方向一致，并且旁边还有 Google Cloud
              的真实规模信号支撑，使盈利叙事比普通增长期创业公司说法更可信。它们也指向一家很可能已经跨过脆弱早期阶段、能从更强运营基础上继续为产品扩张供血的公司。
