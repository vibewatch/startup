  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、平台与监管暴露
        blocks:
          - type: paragraph
            body: >-
              Moloco 的风险画像起点在于：它自己的通知描述的是一个数据密集型广告系统，而外部平台和监管规则仍在收紧。广告通知称，Moloco
              产品可以处理广告标识符、设备属性、使用信号和衍生数据，用于衡量表现和优化广告活动。这在广告科技中商业上常见，但意味着任何缩窄标识符、归因、SDK 行为或数据共享权限的规则变化，都会让 Moloco
              承受结构性暴露。Apple 的 ATT 授权要求、Apple 对 fingerprinting 的禁令、Google Play 的用户数据和 SDK 义务，以及 Privacy Sandbox
              仍在演进的测量框架，都把风险从 Moloco 自身代码推向客户的应用环境和平台关系。欧洲和 California 隐私制度加入了由权利驱动的合规义务，FTC 仍是活跃的美国执法背景。Moloco
              有可见缓释措施：当前隐私通知、2026 年 2 月安全页面、第一方数据定位和访问控制语言。剩余问题是，公开材料仍没有足够披露客户 DPA、服务承诺或面向监管机构的运营历史，因此无法得出治理风险极低的结论。
