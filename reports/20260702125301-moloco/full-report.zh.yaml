  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与套件逻辑
        blocks:
          - type: paragraph
            body: >-
              Moloco 应被理解为多产品面的广告与变现平台，而不是单一移动 UA 网络。当前公开套件包括：用于获客和再营销的 Moloco Ads，用于零售商和交易平台站内媒体的 Commerce Media，用于 OTT
              和直播库存的 Streaming Monetization，以及面向发布商的 Moloco SDK，后者帮助发布商获得直接广告主需求，而不只依赖瀑布流聚合。Performance CTV
              把同一定位延伸到联网电视；这很重要，因为它显示 Moloco 想把同一套优化堆栈跨屏迁移，而不是停留在只做移动的工具。架构含义是，Moloco
              正把共享机器学习能力卖进不同运营方工作流：营销团队、零售商、流媒体平台和发布商。这个宽度在战略上有吸引力，因为它扩大预算和数据尾气，但也提高了尽调难度：这套产品到底是一个连贯平台，还是几个相邻产品共享同一品牌和
              ML 叙事。
