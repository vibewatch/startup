companyProfile:
  summary: >-
    Moloco 成立于 2013 年，已经从一家移动效果 DSP 长成覆盖开放互联网的广告平台，产品涵盖应用增长、零售媒体、流媒体变现和发布商变现。2026 年公开材料支持一个有规模的私营公司画像：收入超过
    $200M、连续多年盈利、员工超过 700 人，并具备显著全球覆盖；Google Cloud
    材料也印证了其零售媒体基础设施规模并不常见。业务在战略上有价值，运营也相对成熟，但公司对治理、当前财务、客户集中度和交易条款的公开披露仍然选择性很强。
