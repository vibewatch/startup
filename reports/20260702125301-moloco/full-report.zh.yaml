  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分部逻辑
        blocks:
          - type: paragraph
            body: >-
              Moloco 很难塞进某个传统广告科技盒子。当前公开产品面已经覆盖应用增长需求、零售商自有站内媒体和流媒体变现；发布商变现和效果 CTV 又把同一套优化逻辑延伸到相邻工作流。因此，相关市场不只是移动 DSP
              支出，而是开放互联网应用获客预算、零售商和交易平台为广告变现投入的软件预算，以及流媒体库存的变现基础设施预算。


              关键分析点在于，每个分部的买方、用户和付款方都不同。应用营销团队用效果媒体预算购买 Moloco
              Ads；零售商和交易平台购买商业媒体基础设施，广告主间接使用；流媒体平台购买变现软件，广告主需求为收入池出资。因此，Moloco 的机会比纯媒体购买工具更宽，但投资人应使用多个市场镜头，而不是套用一个虚假的单一
              TAM 数字。
