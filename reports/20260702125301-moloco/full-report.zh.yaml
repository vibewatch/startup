      - number: '5.2'
        title: 架构与运营流
        blocks:
          - type: paragraph
            body: >-
              最强的公开技术证据集中在 Commerce Media 和 Ads API 产品面。零售商侧，Moloco 描述了一个 API
              驱动系统，摄取搜索、浏览、加购和购买行为等第一方信号，再用深度学习排序广告、优化竞价，并把结果送回测量循环。Google Cloud 给出最清晰的外部确认：BigQuery、GKE 自动扩缩容、Cloud TPU
              训练、Cloud Bigtable 检索，以及后来为了语义匹配和托管运营迁移到 Vector Search。因此，这套工作流不是静态广告位引擎，而是持续的检索、打分、投放和反馈循环。Ads 和 SDK
              集成也为应用营销团队和发布商讲了一个平行故事。公开 API 文档显示，访问需要基于 token 的认证访问，并明确要求 TLS；SDK
              材料则描述了直接广告主需求、创意控制和快速渲染。仍不够可见的是，Streaming Monetization 使用的究竟是完全相同的控制平面，还是同一优化和投放基础组件的轻量改造。
