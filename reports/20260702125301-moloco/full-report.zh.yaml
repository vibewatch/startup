          detail: Moloco 围绕结果目标运行出价、个性化、定向或广告投放。
        - id: n4
          label: 公开披露结果
          detail: 案例研究引用安装量、ROAS、GMV、视频完播、CPA 或并发观众规模。
        - id: n5
          label: 预算 / 界面扩张
          detail: 客户扩展到更多市场、更多渠道、更多点位或更长合作范围。
      edges:
        - from: n1
          to: n2
          label: 数据接入
        - from: n2
          to: n3
          label: 模型训练
        - from: n3
          to: n4
          label: 已衡量结果
        - from: n4
          to: n5
          label: 价值证明
    claimRefs:
