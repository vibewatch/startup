      - number: '5.4'
        title: 信任、隐私与技术风险
        blocks:
          - type: paragraph
            body: >-
              Moloco 的信任姿态比内部拓扑记录更充分。安全和政策页面明确声称具备 SOC 2、ISO 27001、GDPR 对齐、SSO、MFA、面向客户模型的私有云隔离，以及带下架时限和 app-ads.txt
              支持的正式品牌安全运营流程。这些都是企业买方在意的信号，尤其因为 Moloco 所在广告品类中，平台信任和错投风险很重要。更难的问题是，外部平台政策变化和生态数据共享会如何影响产品耐久性。Moloco
              自己的隐私通知说得很清楚：产品可以处理标识符、行为事件和预测指标，数据也可能流向 SSP、DSP、广告聚合，以及 AI 或 ML 提供商。Apple ATT 让应用开发者对第三方 SDK 追踪行为负责，而
              Privacy Sandbox 仍是持续演进的外部依赖。换句话说，Moloco 有可见控制，但隐私、测量和平台治理风险仍是结构性的，并未完全解决。
