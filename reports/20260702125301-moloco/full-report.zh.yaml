            body: >-
              市场背景有利，但容错很低。MediaPost 对 IAB 研究的摘要称，商业媒体预计将在 2026 年带动 $74B
              广告支出，但也强调碎片化、标准化薄弱和成本上升。这类市场里，公司可以高速增长，同时仍被利润率、集成和渠道竞争狠狠挤压。Moloco 现在横跨 App 增长需求、零售媒体基础设施、流媒体变现和新的
              Performance CTV。机会明摆着，但每多一个界面，就多一层实施负担、政策接触点和客户成功风险。Costco 是一个有用的预警信号：这次部署具有战略价值，但仍处早期；Costco
              自己的表述也说得很清楚，购物体验排在广告收入榨取之前。竞争对手的信息披露同样重要。AppLovin、DoubleVerify 和 Criteo 等上市同行持续发布 10-K
              或最新业绩，投资者因此能更直接地对标其风险因素和经营轨迹，而不是只能看 Moloco。Moloco 因此同时面对经营竞争和叙事竞争：它必须证明跨界面执行力，却拿不出上市同行那样充分的公开证据。
