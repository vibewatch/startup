      - number: '3.2'
        title: 能力与工作流对比
        blocks:
          - type: paragraph
            body: >-
              同业集合按能力宽度分化。Amazon DSP 和 Google DV360 看起来比 Moloco 更宽，因为它们销售大型企业级广告活动管理环境，并拥有特权数据或平台集成。Criteo、Skai 和
              Topsort 在零售媒体上更锋利，但各自强调的角度略有不同：零售商和广告主规模、跨零售商媒体管理，或 API 优先的商业媒体基础设施。AppLovin、Unity 和 InMobi
              在游戏和移动增长处于重心的场景中更强。


              Moloco 的相对优势在于，它比多数专业厂商更宽，却没有变成泛化的全渠道套件。它可以用一套以 ML
              为中心的叙事，与应用营销团队、零售媒体运营方、流媒体平台和发布商对话。弱点是，许多竞争对手在自己的分部也能声称同等或更强的宽度，同时拥有更强数据、供给或既有买方关系。重视本地控制和模型驱动相关性的买方可能偏好
              Moloco，而重视巨型平台集成的买方可能默认选择别处。
