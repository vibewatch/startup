chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与产品边界
        blocks:
          - type: paragraph
            body: >-
              Moloco 已经不适合再被描述成单点移动广告科技供应商。公司在 2026 年的一贯叙事是：Moloco 是一个 AI
              原生的效果广告平台，面向开放互联网，把大科技公司的机器学习能力交给其他企业使用。官方材料仍以应用增长效果营销为锚点，但现在展示的是更宽的产品套件：Moloco Ads 做用户获取和再营销，Moloco
              Commerce Media 服务零售商和交易平台，Moloco Streaming Monetization 面向媒体所有者，Moloco SDK 则支持发布商变现。这个组合重要，因为它说明 Moloco
              正从广告活动优化，走向跨需求、供给和变现场景的基础设施。

              商业模式看起来也比早期 DSP 标签更偏企业级。Moloco 的产品页面和 Google Cloud
              合作伙伴材料显示，公司靠软件和托管广告基础设施变现，这套基础设施依赖第一方数据、实时预测和结果导向优化，而不是静态受众分层。官方规模口径已经覆盖 200 多个国家和地区，Moloco Ads 日活用户超过
              2B，并且在零售商和流媒体侧有广泛部署。结果是，Moloco 仍在广告科技市场竞争，但越来越像一个多产品 AI 平台，而不是狭窄的投放工具。
