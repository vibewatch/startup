  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入和分业务结构
        - 按 DSP、商业媒体和流媒体划分的 2026 年收入
        - 决定真实倍数，也决定 Moloco 是否比传统 adtech 更像软件公司
        - 索取当前管理层报告包或经审计财务数据
      - - 毛利率和现金生成
        - 分业务毛利率、EBITDA 和自由现金流桥
        - 区分健康的软件质量规模和质量较低的体量增长
        - 索取财务尽调材料和月度 P&L
      - - 留存和集中度
        - NRR、GRR、前 10 大客户收入占比和分群扩张
        - 验证溢价逻辑的持久性，以及对标杆客户的暴露
        - 索取客户分析看板和续约分群表
      - - 证券条款和治理
        - 股份类别、清算优先权、董事会权利和信息权
        - 决定名义估值之外的真实进入经济性
        - 审阅最新二级或一级交易文件
      - - IPO 准备度
        - 银行聘书、审计准备度、内控成熟度，以及任何申报文件草稿工作
        - 说明退出选择权是真实存在，还是只停留在传闻层面
        - 向管理层和律师索取 IPO 准备材料
      - - 背调质量
        - 覆盖零售媒体、DSP 和流媒体的独立客户访谈
        - 验证公开案例是否能转化为预算持久性
        - 与直接付费方操作负责人跑客户访谈清单
    notes: 这些尽调问题是从情景框架走向真正承销所需的最低材料包。
