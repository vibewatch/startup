      - number: '8.2'
        title: 可比框架和市场背景
        blocks:
          - type: paragraph
            body: >
              Moloco 很难找可比公司，因为它不只是单一业务。公开证据显示，公司横跨效果
              DSP、零售媒体基础设施和流媒体变现，因此最佳可比组必须混合开放互联网采买平台、商业媒体或效果广告同行，以及衡量或验证供应商。经营顺风确实存在。Google Cloud 2026 年零售媒体架构文章称，该类别
              2025 年增长 21.9%，到 2027 年 CAGR 为 19.7%；IAB 预测美国数字视频 2026 年将超过 $80B，商业媒体约 $74B。Moloco 自身由第三方材料支撑的旁证也重要：Google
              Cloud 称 Moloco RMP 支持超过 35,000 个广告主，AppsFlyer 在其 2025 年指数中分析了 39K 个 App、88 个媒体源上的 16.2B 次安装，Singular 称其
              2026 年 ROI 指数建立在万亿级展示和数十亿次安装之上。


              可比分化极端。CompaniesMarketCap 2026 年 7 月快照显示，Criteo 约 $0.95B，DoubleVerify 约 $1.72B，IAS 约 $1.73B，The Trade Desk
              约 $9.08B，AppLovin 约 $192.33B。Criteo 的 TTM P/S 只有 0.4772，而 The Trade Desk 2026 年 7 月 TTM P/S 为 3.03。Moloco
              应放在这个镜头下看：一家已盈利、有规模、高效果的私人公司，可以比成熟低倍数广告技术公司拿到更高估值；但除非当前收入规模和结构有强得多的证据，否则公开证据不支持把它当成 AppLovin 式离群值。
