      - number: '1.3'
        title: 资本基础、估值与所有权信号
        blocks:
          - type: paragraph
            body: >-
              最强的干净融资数据点仍是 2021 年 8 月的 Series C。官方和 TechCrunch 报道在关键事实上一致：Moloco 融资 $150M，由 Tiger Global 领投，估值
              $1.5B，累计融资额达到 $200M，年化净收入口径已超过 $100M。这一轮把 Moloco 定位为一家快速增长的广告科技公司，准备向更广产品扩张，包括零售媒体。与许多私营广告科技同行不同，Moloco
              后续公开资本叙事并不围绕新的一级融资展开。2023 年的关键事件是一组二级交易，Fidelity Management & Research 和 EDBI 因此进入股权结构，Korea Investment
              Partners 向 Fidelity 出售股份。Moloco 明确表示，公司没有获得一级融资款项。

              这条二级交易叙事支持公司成熟度和资本效率。官方来源称，这些交易对 Moloco 的估值超过 $2.0B，2022 年收入超过 $200M，且公司已经连续 12
              个季度盈利。当前招聘页面进一步表示，公司资金充足，不需要额外资本，自 2020 年以来收入增长超过 5 倍，并且盈利超过五年。问题不是没有正面证据，而是冲突和不透明。Premier Alternatives
              目前显示，截至 2024 年 5 月 1 日估值要低得多，为 $1.8B，融资总额则给出不太可信的 $499.5M；PM Insights 只提供二级市场分析的预告级信息。审慎判断是，Moloco
              的经营质量比当前账面估值更有公开证据支撑。
