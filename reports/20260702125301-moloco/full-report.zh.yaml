  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入流
        blocks:
          - type: paragraph
            body: >-
              Moloco 的公开财务叙事从它似乎在销售什么开始。公司通过几类业务变现：与效果广告支出挂钩的需求侧活动，以及商业媒体、流媒体变现和发布商供给侧的软件或基础设施产品面。这让 Moloco
              在经济性上比单线广告活动工具更有意思，因为它的商业模式可以把交易挂钩经济性和类软件平台价值混合起来。产品页面、Google Cloud Marketplace 分发，以及 Moloco
              现在分别向应用营销团队、零售商、流媒体平台和发布商销售不同产品面，都是这个组合的公开证据。


              公开文件没有给出的是组合比例。没有产品线收入拆分，没有抽成率披露，也没有合同级细节让投资人估算收入中有多少是经常性软件，有多少是效果媒体流水。实践中，这意味着即便外部视角判断非常正面，分部经济性仍必须被当作尽调事项，而不是已经解决的建模输入。
