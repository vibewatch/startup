  - id: TR005
    title: 缓释与叫停标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / 平台政策断裂
        - 平台拒审、由 ATT 引发的效果崩塌，或牵涉 Moloco 支持应用的强制整改
        - 任何重大的 Apple 或 Google 政策事件，只要迫使产品重设计，或让可归因效果连续两个季度下滑
        - 暂停投资判断，直到管理层拿出客户级整改和花费留存证据。
      - - 云 / 延迟依赖
        - 大客户投放容量或延迟恶化
        - 低延迟优势丧失、公开可见的可用性事故，或客户证据显示架构调整后投放经济性转弱
        - 如果可靠性不再像护城河，而像脆弱点，应视为投资逻辑破裂。
      - - 旗舰账户执行
        - Costco 上线停滞，或 JioCinema 级别证明无法在其他地方复现
        - 旗舰账户仍停留在试点状态、无法扩张，或不能转化为更广泛的直接客户突破
        - 下调客户证明质量权重；估值上调前，要求更强的多元化证据。
      - - 竞争压力与市场碎片化
        - 同行表现改善，但 Moloco 不能在精选案例之外证明差异化可持续
        - AppLovin / DoubleVerify / Criteo 这类公开基准保持强劲，而 Moloco 拿不出同等强度的私有 KPI
        - 降低确信度，并要求更多产品线 ROI 证据或客户推荐。
      - - 财务与集中度不透明
        - 管理层在尽调中无法提供当前收入结构、头部账户集中度，或直接 / 间接拆分
        - 没有可信的 2026 年 data room，无法验证产品线增长、利润率和账户集中度
        - 对任何需要确信度的推荐，都应视为硬性尽调阻断点。
      - - 合同与治理不透明
        - 看不到 DPA、SLA 或标准客户协议
        - 投资决策前无法审查核心法律条款
        - 在法律尽调补齐缺口前，将建议维持在继续研究 / 跟踪。
    notes: 这些阈值刻意设成可监控，而不是叙事化。Moloco 的投资逻辑应在两种证据下破裂：未缓释依赖恶化，或公司拒绝披露监控所需数据。
