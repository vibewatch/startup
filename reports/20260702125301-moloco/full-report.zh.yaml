      - number: '2.3'
        title: 市场结构与在位者压力
        blocks:
          - type: paragraph
            body: >-
              Moloco 的目标市场有吸引力，部分原因在于它们仍然分散，但分散并不等于容易。Amazon DSP、Google DV360、Criteo、AppLovin、InMobi、Unity、PubMatic 和
              Skai 都在一个或多个与 Moloco 买方工作流重叠的切片中销售可信方案。有的主打第一方数据，有的主打全渠道触达，有的主打游戏规模的应用增长，有的主打零售商自有媒体工具。


              这对 Moloco 很重要，因为它需要靠产品匹配取胜，而不是进入一片空白市场。买方希望获得大科技级优化，同时保留对库存、购物者体验或广告主经济性的本地控制时，Moloco
              的机会最强。风险在于，大型在位者已经在许多相同工作流中拥有买方关系、供给或测量堆栈。因此，市场吸引力确实存在，但并不像垄断市场。
