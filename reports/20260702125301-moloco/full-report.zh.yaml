        title: 资本基础与 IPO 准备度
        blocks:
          - type: paragraph
            body: >-
              对一家仍未上市的广告科技公司来说，Moloco 的资本故事异常成熟。最有支撑的一级资本锚点仍是 2021 年前累计融资 $200M。之后的公开资本事件并不是另一轮已披露一级融资，而是 2023 年一组二级交易，使
              Fidelity 和 EDBI 以 >$2.0B 估值进入股权结构，同时公司没有获得一级融资款项。这一模式与管理层当前信息一致：Moloco 资金充足，并未处于即时融资压力之下。


              IPO 准备度更试探性。多篇 2026 年报道称 Moloco 选择了 Goldman Sachs 和 JPMorgan，并在探索上市，但这些报道也都强调讨论仍在进行。在 S-1 出现之前，IPO
              准备应被解读为真实的就绪度和流动性规划信号，而不是已经完成的融资事件。它能提供方向，但经审计披露、时间点和估值区间仍未解决。
