              财务章节最弱的一环是当前精度。PM Insights、Premier Alternatives、Notice、CB Insights 和 Craft 都显示 Moloco
              已经出现在私营市场数据平台上，但没有任何一家给出关于当前估值、累计融资或当前收入的完整公开一致答案。Premier Alternatives 显示 2024 年估值为 $1.8B，融资总额则与 Moloco
