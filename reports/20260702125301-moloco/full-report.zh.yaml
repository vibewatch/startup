  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与同业集合框架
        blocks:
          - type: paragraph
            body: >-
              Moloco 同时在多个战场竞争，这让竞争格局比一张同业表更复杂。在应用增长中，它会遇到 AppLovin、Unity、InMobi、Amazon、Google 以及能吸收效果预算的更广义
              DSP。在零售媒体中，它与 Criteo、Skai 和 Topsort 重叠，也间接与零售商自建系统竞争。在流媒体和发布商工具中，它面对的是需求侧平台，以及承诺更强控制、透明度或直接需求的供应路径或变现产品。


              这很重要，因为买方会根据工作流把 Moloco 与不同替代方案比较。承销中要问的不是 Moloco 有没有竞争对手；答案显然是有。真正的问题是，共享 ML
              层能否产生足够的效果和运营杠杆，抵消竞争对手的数据所有权、分发能力或工作流锁定。答案很可能因分部而异，而不是全局通用。因此，同业分析应按工作流做，而不能只按公司规模做。
