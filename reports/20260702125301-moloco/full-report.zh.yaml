      - number: '3.3'
        title: 信任、合规与切换成本
        blocks:
          - type: paragraph
            body: >-
              竞争不只看拍卖质量。信任和实施深度同样重要。Moloco 有公开的隐私、广告、品牌安全和开发者文档页面，显示一定运营严肃性。Apple 隐私规则和 Google Privacy Sandbox
              让这些信任与合规层对整个同业集合都很关键，因为买方需要供应商在适应平台变化时，不破坏测量、数据处理或发布商信任。


              同时，公开证据显示切换成本真实存在，但并非绝对。SDK 集成、零售媒体工作流和合作伙伴实施会让 Moloco
              变得粘性更强，尤其是模型已经在本地数据上训练之后。但多归属仍非常可能，因为广告主、零售商和发布商常常同时测试多个伙伴。没有公开留存或赢单 / 输单证据时，投资人应假设 Moloco
              所处市场中产品质量重要，但排他性并不常见。实践中，这意味着 Moloco 可能一次赢下一条工作流的许多扩张，而不是永久锁住整个账户。
