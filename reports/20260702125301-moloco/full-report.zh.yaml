    rows:
      - - 乐观
        - 当前收入已远高于公开披露的 >$200M 下限，盈利能力仍强，商业媒体 / 流媒体看起来像可持续的软件收入
        - 2.5 至 3.2
        - 方向上可能成立，但需要目前公开材料尚未给出的当前指标
        - 需要经审计的 2026 年财务数据，以及留存和分业务数据
      - - 基准
        - 收入若高于已知下限，Moloco 作为已规模化且盈利的 adtech / 软件混合体，可承受中个位数至高个位数收入倍数
        - 1.7 至 2.4
        - 这是公开证据最能支撑的区间，因为同时照顾了业务质量和信息不透明
        - 官方 >$2B 估值历史提供支撑，但精确承销输入仍缺位
      - - 悲观
        - 增长或结构不及预期，旗舰客户案例不够持久，市场把 Moloco 估得更接近低倍数 adtech 或测量类同行
        - 0.8 至 1.5
        - 如果客户持久性或当前收入规模弱于叙事暗示，该情景就成立
        - 续约疲弱、客户集中或分业务变现有限会证实这一情景
    notes: 区间是示意性承销带，由公开估值锚、当前可比公司离散度和情景假设拼出，而不是来自完整建模的当前股权结构。
