  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值锚点和证据质量
        blocks:
          - type: paragraph
            body: >
              Moloco 公开资料里最干净的估值锚点，仍是官方披露，而不是追踪网站。Moloco 2021 年 8 月 Series C 公告与 TechCrunch 报道在关键事实上一致：公司融资 $150M，估值达到
              $1.5B，累计融资 $200M，年化净收入运行率已经超过 $100M。下一次清晰上调出现在 2023 年 6 月：Moloco 称，引入 Fidelity 和 EDBI 进入股权表的二级交易把公司估值推到
              $2.0B 以上，且没有新股融资款进入公司。这一点重要，因为它意味着估值在没有公开披露新稀释资本的情况下继续上行。


              问题不在于 Moloco 缺少正面信号，而在于最新信号仍不是完整核验包。当前招聘文案仍称 Moloco 估值超过 $2B、资金充足、收入超过
              $200M，且已连续多年盈利；这些表述方向上利好，但仍由公司自述。Premier Alternatives 现在给出较低的 $1.8B 估值，并列出一个不可信的 $499.5M 累计融资额，和 Moloco
              自己披露的历史相冲突；PM Insights 和 Notice.co 只呈现预告或标题级视图，没有透明方法论。实际结论是：投资者可以相信 Moloco 存在一个 $2B
              以上的后期私募估值，但不能把当前追踪网站的精确数字当成审计事实。
