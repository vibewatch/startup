        - 上传第一方数据，设置目标和素材，在独立 App 中投放
        - Moloco Ads 在 UA 和再营销场景中围绕 ROAS 或 CPA 优化
        - 用一个投放入口同时覆盖拉新和再互动，并明确以结果为导向
        - 公开证明仍主要来自公司说法，而非按客群做独立基准测试
      - - 上线零售商站内媒体
        - 接入商品目录、购物者事件和活动管理流程
        - Commerce Media 通过深度学习排序和测量闭环投放赞助广告
        - 公开 A/B 结果声称 CTR、转化、广告收入和 GMV 更高
        - 需要跨多个零售商、且不只限于精选案例的更中立证据
      - - 变现直播或高端流媒体库存
        - 聚合碎片化需求，并在并发压力下决定价格或结果
        - Streaming Monetization 将 Moloco 的投放和优化用于 OTT 环境
        - JioCinema 案例显示该栈能扛住大型直播事件负载
        - 流媒体架构深度和路线图颗粒度，公开信息仍然偏薄
      - - 为 App 变现栈增加直接需求
        - 安装 SDK，保留素材控制，并接入现有广告聚合流程
        - Moloco SDK 通过自助集成开放直接广告主需求
        - 发行商不必重建完整变现栈，就能增加一个新竞价方
        - 公开开发者证据少于开源或由软件包驱动的生态
      - - 把移动效果投放延伸到 TV
        - 用 MMP 归因和开放供给伙伴，把 CTV 作为效果渠道采购
        - Performance CTV 针对明确业务结果优化每一次曝光
        - 早期 beta 声称部分案例安装响应更快、ROI 高于移动
        - 仍处于早期发布，独立证据有限，供给深度也在演进
