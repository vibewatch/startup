      - number: '1.2'
        title: 领导层、治理与地域
        blocks:
          - type: paragraph
            body: >-
              Moloco 仍明显由创始人主导。Ikkjin Ahn 继续担任 CEO，也是公司长期论点最清晰的公开代言人：AI 不应只服务围墙花园，也应驱动更广泛的互联网经济。技术创始团队仍然可见：联合创始人 David
              Sehyuk Park 仍被介绍为 CIO，也是公司核心机器学习组织的早期搭建者；Donghwan Jeon 在 2015 年加入后，自 2016 年起担任
              CTO。相比创始团队，产品和商业化领导层披露不够透明，但 Sunil Rayan 在 2026 年发布材料中被公开列为首席商务官兼 Moloco Ads 总经理。

              2026 年，Moloco 任命 Dawn Ostroff 进入董事会，并披露现有独立董事 Sabrina Simmons 和 Pat
              Wadors，治理披露因此有所改善。即便如此，公开文件仍未给出完整董事会名单、委员会结构、投票控制摘要或投资人权利矩阵。地域信息比治理清楚得多。当前官方材料把总部放在 Silicon Valley / Menlo
              Park，并反复提到公司在美国、英国、德国、韩国、中国、印度、日本和新加坡设有办公室；招聘页面还列出更广的运营足迹，包括以色列和远程岗位。合起来看，公开记录支持 Moloco
              是一家全球运营公司，技术领导层较集中，但治理文件尚不完全透明。
