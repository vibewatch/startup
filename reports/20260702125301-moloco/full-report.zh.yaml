      - number: '1.4'
        title: 规模、里程碑与风险信号
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司而言，Moloco 的公开运营规模证据相当充分。Google Cloud 的 Moloco 案例研究称，零售媒体平台支持 35,000 多个广告主，运行 20 多个深度神经网络模型，每天处理约
              600B 次竞价请求。配套的 2026 年向量搜索架构文章又给出技术证据，说明系统仍在大规模升级：几次上线中容量约提升 10 倍，p95 延迟最高降低 25%，变现提升
              4.0%。客户证明也跨越多条产品线，而不是单一旗舰用例：JioCinema 称 Moloco 在 Tata IPL 2023 期间为 32M 并发观众投放定向广告；ShopBack 称 SKAN 安装量扩大 15
              倍，同时 CAC 保持稳定；Scopely 称 Monopoly GO 在 30 天内带来超过 1M 次安装；Bucketplace 报告商家 GMV 翻倍，广告主 ROAS 达到 3 倍。

              近期里程碑进一步强化了产品宽度。Moloco 于 2025 年通过 Google AdMob 和 Ad Manager 推出 SDK 竞价，称已有近 500 家发布商使用该 SDK；2026 年 4 月又发布
              Ads for Performance CTV，早期 ROI 声明显示公司正在走出移动端。安全和隐私信号扎实但标准：官方材料提到 SOC 2、ISO 27001 和 GDPR
              对齐。更尖锐的风险在战略和证据层面。The Drum 对 Costco 的报道表明，Moloco 可以具备战略价值，但仍只是零售商控制的模块化堆栈中的一层；获取材料中 Gartner 评论可见度很薄；2026 年
              2 月的 IPO 报道没有备案或官方确认，仍停留在传闻级。
