          - type: callout
            title: 大市场不等于容易获取份额
            body: Moloco 盯上的每个分部都有具备规模的在位者，它们拥有分发、数据或买方关系优势。市场背景支持增长，但拿份额仍需要真正的产品优势，并谨慎适应隐私驱动的测量变化。
            calloutType: risk
