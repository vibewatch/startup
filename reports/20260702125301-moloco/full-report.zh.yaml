      - number: '6.3'
        title: 采用、耐久性与评论代理指标
        blocks:
          - type: paragraph
            body: >
              Moloco 不公开披露经典 SaaS 留存指标，因此客户质量只能从二阶信号推断。其中几项有意义。Google Cloud 案例研究称 Moloco RMP 在全球支持 35,000 多个广告主；Moloco
              投资人更新称一千多家全球广告主使用 DSP；Moloco 自有产品材料称广告平台覆盖超过 20 亿日活用户。这些不是直接收入留存指标，但确实说明 Moloco
              已经在显著规模上运营，客户基础也不只是少数设计伙伴。最清晰的耐久性信号是 Viacom18 明确使用多年合作语言，这比常见广告活动案例格式更强，因为它暗示持续运营依赖，而不是一次性测试。


              第三方排名和评论表面也有帮助，但应谨慎解读。AppsFlyer 称其 2025 Performance Index 分析了 39,000 个应用、88 个媒体来源上的 16.2B 次安装，Moloco
              自己的回顾称其在该版总体排名第五。Singular 的 2026 ROI Index 以及 Moloco 对该报告的摘要，也给出类似信号：Moloco 继续出现在围墙花园之外的许多榜单类别中。Gartner 还在
              2026 年托管了一个 Moloco 零售媒体供应商评论页，这至少说明该产品已有足够市场存在感，可以产生外部终端用户评论基础设施。这些信号都不能替代 NRR、流失率或续约分组，但合起来支持一个判断：Moloco
              产品被反复使用到足以出现在生态排名、评论表面和多市场案例研究中。
