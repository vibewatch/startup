      - number: '8.4'
        title: 核验缺口和论点失效触发器
        blocks:
          - type: paragraph
            body: >
              公开资料仍留下太多待核验变量，不能仅凭估值建议追高投资。所引公开来源均未披露当前 2026 年收入、毛利率、NRR、直接付费方集中度，或
              DSP、商业媒体和流媒体之间的细分结构。本次抓取的资料集中，也没有公开来源披露二级交易每股价格、清算优先权、董事或观察员权利，或真实私募购买中会影响判断的其他条款。IPO
              准备度也仍停留在传闻层面：Stankevicius 称 Goldman Sachs 和 JPMorgan 已被选中，准备 2026 年 2 月的预期公开发行，但抓取记录中没有 S-1 或官方申报文件。


              更尖锐的论点失效信号很具体。如果核验显示当前收入只比 2022 年底线略高，估值逻辑会立刻变弱。如果零售媒体胜利仍以试点或 beta 为主，而不是耐久的软件合同，Moloco
              应更接近低倍数广告技术同行定价。如果旗舰客户证明不能转化为可复制的留存和扩张，公司的可比组可能应大幅收窄。反过来，如果管理层能展示显著更高的当前收入、持续盈利、干净的治理和交易条款，以及
              商业媒体和流媒体中耐久的直接付费方留存，那么在上一次清晰的 >$2B 估值之上核验上行情景就会容易得多。
