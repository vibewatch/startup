  - id: TV005
    title: 论点破裂与否决触发器表
    columns:
      - 触发器
      - 阈值或事件
      - 重要性
      - 行动含义
    rows:
      - - 当前收入不及预期
        - 管理层披露收入仅略高于 2022 年 >$200M 下限
        - 如果公开市场叙事跑在经营规模前面，倍数逻辑会塌
        - 从合理转为偏贵 / 避免加价定价
      - - 盈利质量走弱
        - 利润率或现金生成显著弱于公开叙事暗示
        - 即便增长仍不错，合理倍数也会下调
        - 要求更低价格或暂停
      - - 零售媒体持久性被夸大
        - 旗舰客户仍以 beta 或试点为主，缺少可重复的软件续约
        - 会压缩叙事中软件质量的部分
        - 将 Moloco 重新框定为更窄的 adtech 暴露
      - - 客户集中度高
        - 少数标杆账户贡献了过高收入占比
        - 会削弱分散度和退出准备度主张
        - 为集中度风险压价，或推迟
      - - IPO 或二级交易条款偏弱
        - 后续申报文件或资料室暴露沉重优先权、治理包袱或流动性压力
        - 即使名义估值看似不变，有效进入经济性也会改变
        - 投资前要求完整条款归一化
    notes: 这些触发器服务于投资纪律，而非经营管理；每一项都直接映射到估值传导，而不是泛泛的公司风险。
