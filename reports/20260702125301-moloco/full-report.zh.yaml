      - number: '7.4'
        title: 财务不透明度、缓释措施和论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Moloco 的融资历史可信，但用于核验当前风险时，披露仍然不足。公司有一个清晰的 2021 年 Series C 轮数据点，也有 2023 年二级交易：Fidelity 和 EDBI
              进入股权表，且没有新增新股融资；管理层还称 2022 年收入超过 $200M，到 2023 年底已连续 12
              个季度盈利。信号正面，但远不到申报文件级可见度。本次审阅的公开资料没有披露当前产品线收入结构、头部客户集中度、直接与间接收入拆分、合同条款或服务水平。投资者只能依赖里程碑新闻稿和旗舰案例，而不是持续更新的经营台账。剩余含义不只是“财务未知”；更关键的是，除非管理层开放更深的数据室，否则
              Moloco
              若干最高严重度风险只能被间接监控。因此，下方明确的风险矩阵把隐私平台依赖、云和模型性能依赖、旗舰账户执行、披露不对称列为最高的剩余暴露。一旦这些风险不再可监控，而是变得不透明、缺乏缓释或明显恶化，Moloco
              投资论点就应失效。
