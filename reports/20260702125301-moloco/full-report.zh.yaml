      - number: '2.2'
        title: 零售媒体、移动和 CTV 的增长顺风
        blocks:
          - type: paragraph
            body: >-
              市场背景在三个方向有利。第一，零售媒体持续复合增长，因为零售商拥有高意图第一方数据，也越来越希望变现这些数据，而不把经济利益交给 Amazon 或 Google。Google Cloud 的 Moloco
              架构文章在这里有用，因为它引用 Dentsu 增长预测，并解释了为什么许多零售商有数据，却没有能把数据投入运营的 ML 堆栈。第二，在最大围墙花园之外，移动广告仍然庞大而活跃，AppsFlyer
              继续看到高安装量和媒体来源竞争。第三，Moloco 推出 CTV 说明，重视效果的应用营销团队现在把流媒体库存看作可衡量的相邻场景，而不只是纯品牌渠道。


              合起来看，这些趋势支持 Moloco 同时受益于多个品类扩张。需要谨慎的是，公开证据对品类增长的支持远强于对 Moloco
              分部收入获取的支持。在尽调中，这意味着品类动能应被视为承销的顺风，而不是分部组合或转化质量数据的替代品。
