companyProfile:
  summary: >-
    Moloco was founded in 2013 and has grown from a mobile-performance DSP into a broader
    open-internet advertising platform with products for app growth, retail media, streaming
    monetization, and publisher monetization. Public 2026 materials support a scaled private
    company with more than $200M in revenue, multi-year profitability, more than 700 employees,
    and meaningful global reach, while Google Cloud materials corroborate unusual infrastructure
    scale in retail media. The business looks strategically relevant and operationally mature, but
    public disclosure remains selective on governance, current financials, customer concentration,
    and transaction terms.
  foundedDate: '2013-01-01'
  founders:
    - name: Ikkjin Ahn
      role: CEO & Co-founder
      background: Former Google engineer who worked on Android data infrastructure and YouTube monetization systems before founding Moloco.
      claimRefs: [CO008, CO009]
    - name: David Sehyuk Park
      role: Co-founder & CIO
      background: Publicly identified as co-founder and CIO, previously leading Moloco's largest machine-learning, data science, and data engineering team.
      claimRefs: [CO010]
  foundingLocation: Redwood City, California, USA
  headquarters: Menlo Park, California, USA
  productSummary: >-
    Moloco sells Moloco Ads for mobile performance advertising, Moloco Commerce Media for retailer
    and marketplace ad monetization, Moloco Streaming Monetization for media owners, and Moloco
    SDK tooling that helps publishers place native ad experiences inside their products.
  customerFocus: >-
    App marketers, retailers and marketplaces, streaming or media owners, and publishers that need
    machine-learning-driven advertising or ad monetization on the open internet.
  businessModel: >-
    Software and managed-adtech revenue tied to programmatic advertising spend, retailer or media
    monetization enablement, and supporting platform services.
  stage: Private growth stage
  fundingStatus: >-
    Officially disclosed capital raised stood at $200M as of the 2021 Series C. Moloco later said
    2023 secondary transactions valued the company above $2.0B with no primary proceeds; public
    2026 IPO-preparation coverage remains unconfirmed by any filing in the fetched record.
