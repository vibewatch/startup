company:
  name: Moloco
chapter:
  number: 8
  title: Valuation
  summary: >
    Official disclosures anchor Moloco at a $1.5B 2021 valuation with a >$100M revenue run-rate and at >$2.0B in 2023
    secondary transactions with no primary proceeds, while 2026 company materials still say the business is valued above $2B,
    exceeds $200M in revenue, and has been profitable for years. That operating profile makes a >$2B mark directionally
    credible, but public evidence still lacks current audited revenue, margin, retention, and transaction-term detail, so
    investors can underwrite the price only as fair-to-plausible rather than obviously cheap. Against a public comp set that
    ranges from low-multiple commerce-media and measurement names to AppLovin’s outlier premium, Moloco looks like a
    research-more / fair situation whose upside depends on proving that retail media and streaming are scaling into durable
    software-quality revenue.
sections:
  - id: current-valuation-anchors-and-evidence-quality
    title: Current Valuation Anchors and Evidence Quality
    body: |
      The cleanest valuation anchors in Moloco's public file are still the official ones, not the tracker pages. Moloco's August 2021 Series C announcement and TechCrunch coverage align on the key facts: the company raised $150M, reached a $1.5B valuation, had raised $200M in total, and had already surpassed a $100M annual net revenue run-rate. The next clean step-up came in June 2023 when Moloco said secondary transactions that brought Fidelity and EDBI onto the cap table valued the company at more than $2.0B, with no primary proceeds going to the company. That matters because it implies the valuation moved higher without fresh dilution capital being publicly disclosed.

      The problem is not that Moloco lacks positive signals; it is that the latest signals are still not a full underwriting package. Current careers copy continues to say Moloco is valued over $2B, fully funded, above $200M in revenue, and profitable for years, which is directionally supportive but still self-authored. Premier Alternatives now shows a lower $1.8B mark and an implausible $499.5M total funding figure that conflicts with Moloco's own disclosed history, while PM Insights and Notice.co expose only teaser- or headline-level views with no transparent methodology. The practical takeaway is that investors can trust the existence of a later-stage private mark above $2B, but they cannot treat current tracker precision as audited truth.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: comparable-framework-and-market-context
    title: Comparable Framework and Market Context
    body: |
      Moloco is difficult to comp because it is not just one thing. Public evidence shows a business that spans performance DSP, retail media infrastructure, and streaming monetization, so the best comp set has to mix open-internet buying platforms, commerce-media or performance-ad peers, and measurement or verification vendors. The operating tailwind is real. Google Cloud's 2026 retail-media architecture post says the category grew 21.9% in 2025 and is on a 19.7% CAGR through 2027, while IAB forecasts put U.S. digital video above $80B in 2026 and commerce media around $74B. Moloco's own third-party-adjacent proof also matters here: Google Cloud says Moloco RMP supports more than 35,000 advertisers, AppsFlyer analyzed 16.2B installs across 39K apps and 88 media sources in its 2025 index, and Singular says its 2026 ROI index is built on trillions of impressions and billions of installs.

      The comp dispersion is extreme. CompaniesMarketCap's July 2026 snapshots place Criteo near $0.95B, DoubleVerify near $1.72B, IAS near $1.73B, The Trade Desk near $9.08B, and AppLovin at roughly $192.33B. Criteo's TTM P/S ratio is only 0.4772, while The Trade Desk's July 2026 TTM P/S ratio is 3.03. That spread is the right lens for Moloco: a profitable, scaled, high-performance private company can justify more than mature lower-multiple adtech, but public evidence does not support treating it like an AppLovin-style outlier without much stronger proof of current revenue scale and mix.
    claimRefs: [CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028]
    tableRefs: [TV002, TV004]
    figureRefs: [FV002, FV004]
  - id: scenario-ranges-and-recommendation
    title: Scenario Ranges and Recommendation
    body: |
      The right valuation question is not whether Moloco is a real company; it is whether the next dollar of entry price is being set against evidence or against narrative. Public evidence does support a real floor. Moloco had already crossed a >$100M run-rate in 2021, reported >$200M of 2022 revenue in its 2023 investor update, and still says it exceeds $200M in 2026 while remaining fully funded and profitable. That makes the >$2B 2023 secondary mark believable. If one uses only the public revenue floor, a >$2B valuation implies a sub-10x multiple on more than $200M of revenue; if current revenue is materially above that floor, the effective multiple is lower still.

      But valuation credibility is not the same as valuation attractiveness. The bull case needs current revenue growth, segment mix, and retention to show Moloco is becoming a software-quality retail-media and streaming platform rather than simply a strong mobile-performance specialist. The base case is that the company deserves a mid-single-digit to high-single-digit multiple because profitability, scale, and third-party performance signals are real, but not well enough disclosed to earn an AppLovin-like premium. The bear case is that growth, customer durability, or segment quality disappoints and the market compresses Moloco toward lower public adtech ranges. That is why the disciplined recommendation here is research-more / track with medium confidence and a fair valuation stance.
    claimRefs: [CV029, CV030, CV031, CV032, CV033, CV034, CV035]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: diligence-gaps-and-thesis-break-triggers
    title: Diligence Gaps and Thesis-Break Triggers
    body: |
      The public file still leaves too many underwriting variables open to recommend a step-up investment on valuation alone. No cited public source discloses current 2026 revenue, gross margin, NRR, direct-payer concentration, or segment mix across DSP, commerce media, and streaming. No public source in the fetched set discloses secondary-transaction price per share, liquidation preferences, board or observer rights, or other terms that would matter in a real private-market purchase. IPO readiness is also still rumor-level: Stankevicius says Goldman Sachs and JPMorgan were selected for an anticipated public offering in February 2026, but no S-1 or official filing appears in the fetched record.

      The sharper thesis-break signals are concrete. If diligence shows current revenue is only modestly above the 2022 floor, the valuation case weakens immediately. If retail media wins are still pilot- or beta-heavy rather than durable software contracts, Moloco should be valued closer to lower-multiple adtech peers. If flagship customer proof does not translate into repeatable retention and expansion, the business may deserve a far narrower comp set. Conversely, if management can show substantially higher current revenue, continued profitability, clean governance and transaction terms, and durable direct-payer retention across commerce media and streaming, the upside case above the last clean >$2B mark becomes materially easier to underwrite.
    claimRefs: [CV036, CV037, CV038, CV039, CV040, CV041, CV042, CV043]
    tableRefs: [TV005, TV006]
