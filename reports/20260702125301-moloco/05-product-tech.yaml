- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Moloco solution
  - Measurable benefit
  - Limitation
  rows:
  - - Acquire or re-engage app users
    - Upload first-party data, set goals and creatives, buy across independent apps
    - Moloco Ads optimizes for ROAS or CPA across UA and remarketing
    - One buying door across acquisition and re-engagement with explicit outcome framing
    - Public proof is still mostly company-claimed rather than independently benchmarked by cohort
  - - Launch retailer onsite media
    - Connect catalog, shopper events, and campaign-management flows
    - Commerce Media serves sponsored ads with deep-learning ranking and measurement loops
    - Public A/B claims show higher CTR, conversion, ad revenue, and GMV
    - Need more neutral evidence across multiple retailers and not only featured cases
  - - Monetize live or premium streaming inventory
    - Aggregate fragmented demand and make price or outcome decisions under concurrency
    - Streaming Monetization applies Moloco serving and optimization to OTT environments
    - JioCinema case suggests the stack can hold under major live-event loads
    - Streaming architecture depth and roadmap granularity are still thin publicly
  - - Add direct demand to an app monetization stack
    - Install SDK, keep creative control, and connect to existing mediation flows
    - Moloco SDK exposes direct advertiser demand through self-serve integrations
    - Publishers can add a new bidder without rebuilding the full monetization stack
    - Public developer evidence is lighter than for open-source or package-led ecosystems
  - - Extend mobile performance buying into TV
    - Use MMP attribution and open supply partners to buy CTV as a performance channel
    - Performance CTV optimizes each impression against explicit business outcomes
    - Early beta claims show faster install response and higher ROI than mobile in some cases
    - Still an early release with limited independent evidence and evolving supply depth
  notes: Benefits are workflow-level statements drawn from product pages, partner proof, and launch materials; they are not equivalent to audited customer ROI across the full installed base.
