chapter:
  number: 5
  title: Product & Technology
  summary: 'Moloco''s public product surface is unusually broad for a private adtech company: one ML core is marketed across app-growth demand, retailer media, streaming monetization, publisher SDK supply, and a newly launched 2026 CTV extension. Google Cloud''s case study and vector-search write-up make the Commerce Media architecture materially more concrete than the rest of the suite, while Ads API docs, SDK integrations, and Costco and JioCinema deployments show real integration depth. The main underwriting gaps are not whether Moloco has product breadth, but whether the shared stack has fully visible tenancy, uptime, roadmap, and builder-support maturity across every module.'
sections:
- id: product-surface-and-suite-logic
  title: Product surface and suite logic
  body: 'Moloco should be understood as a multi-surface advertising and monetization platform rather than a single mobile UA network. The current public suite spans Moloco Ads for acquisition and re-engagement, Commerce Media for retailer and marketplace onsite media, Streaming Monetization for OTT and live-streaming inventory, and Moloco SDK for publishers that want direct advertiser demand without depending only on mediation waterfalls. Performance CTV extends the same positioning into connected television, which matters because it shows Moloco trying to move the same optimization stack across screens rather than remaining a mobile-only tool. The architectural implication is that Moloco is selling a shared machine-learning capability into different operator workflows: marketers, retailers, streamers, and publishers. That breadth is strategically attractive because it broadens budgets and data exhaust, but it also raises the diligence burden on how much of the suite is one coherent platform
    versus several adjacent products sharing a brand and ML narrative.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
