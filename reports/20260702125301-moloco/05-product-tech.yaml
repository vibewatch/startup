  rows:
  - - SOC 2, ISO 27001, GDPR
    - Claimed on security page
    - Company-wide trust and compliance posture
    - Need audit scope, control inheritance, and product-line mapping detail
  - - SSO, MFA, private cloud model isolation, CSA STAR Level 1
    - Claimed on Commerce Media surface
    - Commerce Media access control and tenant separation story
    - Need evidence that the same rigor extends consistently to every module
  - - Brand-safety block lists, publisher transparency, takedown policy, app-ads.txt
    - Described in Brand Safety Policy
    - Programmatic inventory quality and advertiser governance
    - Need observed enforcement metrics and recent exception examples
  - - Privacy rights and platform-role disclosures
    - Described in privacy notices
    - Device-level requests, retailer handoffs, and adtech data processing
    - Need exact regional workflows, request volumes, and fulfillment success rates
  notes: Controls listed here are based on company-authored trust and policy pages; the main diligence need is independent scope and operating evidence rather than another marketing summary.
