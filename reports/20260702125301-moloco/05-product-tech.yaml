tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Moloco Ads
    - App marketers and performance teams
    - Mature core product
    - Unified user acquisition and re-engagement buying with ROAS and CPA optimization across the independent app ecosystem
    - Need audited breakdown of how much optimization logic is shared with newer surfaces such as CTV
  - - Moloco Commerce Media
    - Retail media, marketplace, and ads-product teams
    - Most technically substantiated enterprise surface
    - AI-native onsite media stack with first-party data personalization, advertiser self-serve, and retailer monetization focus
    - Need tenant-boundary, SLA, and feature-generalization detail beyond case studies
  - - Streaming Monetization
    - Streaming and OTT monetization operators
    - Commercial but less transparently documented
    - Extends Moloco ad serving into live and premium streaming use cases with outcome optimization
    - Need deeper public architecture, reporting, and integration documentation
  - - Moloco SDK
    - Publisher monetization and ad-ops teams
    - Distribution maturity increased in 2025
    - Direct advertiser demand, low-latency rendering, and self-serve integration across major mediation partners
    - Need broader external evidence on crash rates, fill behavior, and docs/support quality
  - - Performance CTV
    - App marketers extending mobile buying into TV
    - New 2026 launch
    - Applies Moloco's mobile performance logic to CTV with MMP attribution and publisher-level reporting
    - Need proof that early beta performance generalizes across more advertisers and supply partners
  notes: Status reflects the depth of public technical and deployment evidence available as of the 2026 run date, not a private audit of every module.
