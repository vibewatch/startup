- id: architecture-and-operating-flow
  title: Architecture and operating flow
  body: 'The strongest public technical evidence sits in Commerce Media and the Ads API surface. On the retailer side, Moloco describes an API-driven system that ingests first-party signals such as search, browse, cart, and purchase behavior, then uses deep learning to rank ads, optimize bids, and feed measurement loops. Google Cloud provides the clearest outside confirmation: BigQuery, GKE autoscaling, Cloud TPU training, Cloud Bigtable retrieval, and a later Vector Search migration for semantic matching and managed operations. The workflow is therefore not a static placement engine; it is a continuous retrieval, scoring, serving, and feedback loop. Ads and SDK integration tell a parallel story for app marketers and publishers. The public API docs show tokenized authenticated access with explicit TLS requirements, while the SDK materials describe direct advertiser demand, creative control, and rapid rendering. What remains less visible is whether Streaming Monetization uses the exact same
    control plane or a thinner adaptation of the same optimization and serving primitives.'
