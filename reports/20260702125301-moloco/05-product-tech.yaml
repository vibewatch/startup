- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Retailer and advertiser event ingestion
    - Captures search, browse, cart, purchase, and campaign signals for ranking and measurement
    - First-party data quality, data pipelines, and partner integrations
    - Weak event hygiene would degrade personalization and learning loops
  - - Model training and scoring stack
    - Uses deep neural networks plus TPU or GPU-backed training and scoring for ad decisions
    - Google Cloud compute, data pipelines, and model refresh cadence
    - High ML dependence raises cost, observability, and rollback complexity
  - - Retrieval and serving layer
    - Combines vector retrieval, bidding, and low-latency serving into millisecond user experiences
    - Vertex AI Vector Search, Cloud Bigtable, and serving infrastructure
    - Latency regressions would directly reduce ad relevance and conversion performance
  - - Authenticated operator and developer surface
    - Exposes campaign or API access through tokenized auth and secure transport
    - Signed-in account control, API key management, and TLS 1.2 or later
    - Credential misuse or weak access governance can create security and support burden
  - - Ecosystem data-sharing and measurement layer
    - Sends or receives data with SSPs, DSPs, MMPs, ad mediation, and compliance partners
    - Partner APIs, privacy policies, ATT, and other platform rules
    - External platform changes can break measurement assumptions or reduce usable identifiers
  notes: This table reconstructs the public operating stack from Moloco, Google Cloud, and policy materials; it is still an outside-in model rather than a maintainer-authored architecture diagram.
