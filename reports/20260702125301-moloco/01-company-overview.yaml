company:
  name: Moloco
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Moloco is a 2013-founded, Menlo Park-headquartered AI advertising company that has expanded from a mobile DSP into a broader open-internet platform spanning app growth, retail media, streaming monetization, and publisher monetization. Official 2026 materials depict a scaled, profitable private company with more than $200M in revenue, more than 700 employees, and a board newly strengthened by Dawn Ostroff, while Google Cloud materials show unusually large infrastructure scale in retail media. The capital story is credible but still imperfectly transparent: Moloco raised $150M at a $1.5B valuation in 2021, disclosed that 2023 secondary trades valued it above $2.0B with no primary proceeds, and now says it is fully funded, but third-party secondary-market trackers publish conflicting marks. That mix makes Moloco look operationally mature and strategically relevant, yet still under-disclosed on cap-table detail, governance rights, and IPO readiness.
sections:
  - id: identity-and-platform
    title: Identity, positioning, and product scope
    body: >-
      Moloco is no longer best described as a single-point mobile adtech vendor. The consistent 2026 company narrative is that Moloco is an AI-native performance advertising platform built for the open Internet and designed to make the machine-learning capabilities of big tech available to other businesses. Official materials still anchor the company in app-growth performance marketing, but they now present a broader suite: Moloco Ads for user acquisition and re-engagement, Moloco Commerce Media for retailers and marketplaces, Moloco Streaming Monetization for media owners, and Moloco SDK for publisher monetization. That product mix matters because it shows Moloco moving from campaign optimization into infrastructure for demand, supply, and monetization across multiple surfaces.

      The business model also appears more enterprise-oriented than the original DSP framing suggested. Moloco’s product pages and Google Cloud partner materials show the company monetizing through software and managed ad infrastructure that rely on first-party data, real-time prediction, and outcome-based optimization rather than static audience segmentation. Official scale claims now span more than 200 countries and territories, over 2B daily active users for Moloco Ads, and broad retailer and streaming deployments. The result is a company that still competes in adtech, but increasingly does so as a multi-product AI platform rather than a narrow campaign tool.
