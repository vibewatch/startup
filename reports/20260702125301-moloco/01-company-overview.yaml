  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation-conflict
      missingEvidence: A management-validated 2024-2026 valuation history, 409A summary, or board-approved pricing memo that reconciles official >$2.0B secondary valuation commentary with lower third-party secondary-market tracker marks.
      whyItMatters: Current valuation directly affects investability, employee option value, IPO readiness, and whether Moloco is compounding from or below its last disclosed step-up.
      diligencePath: Request the latest cap-table package, any 409A or third-party valuation deck, and summaries of recent secondary trades from finance or counsel.
      relatedQuestionRefs:
        - QO013
        - QO026
      relatedTableRefs:
        - TO001
        - TO003
    - type: private-evidence-only
      severity: material
      topic: governance-opacity
      missingEvidence: A full current board roster, committee list, ownership percentages, and investor-rights summary.
      whyItMatters: Without control-rights visibility, it is hard to judge founder control, investor veto power, and IPO-governance preparedness.
      diligencePath: Request the board deck cover pages, charter extracts, and a fully diluted ownership table with voting and observer rights.
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO002
        - TO003
    - type: missing-source
      severity: minor
      topic: ipo-rumor
      missingEvidence: An SEC filing, company statement, or banker-confirmed primary source validating any 2026 IPO process.
      whyItMatters: Rumor-level IPO coverage can distort market-readiness assessments and investor expectations if treated as settled fact.
      diligencePath: Monitor SEC EDGAR, Moloco newsroom updates, and any tier-one finance coverage for an S-1, F-1, or formal mandate confirmation.
      relatedQuestionRefs:
        - QO024
    - type: enumeration-incomplete
      severity: minor
      topic: leadership and founder table coverage
      missingEvidence: A complete executive leadership roster and any board observers or non-independent directors not named in public releases.
      whyItMatters: Later diligence chapters may need a full accountability map for product, finance, legal, and people functions.
      diligencePath: Request the internal org chart and current board list, then reconcile against public bios and press releases.
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: minor
      topic: milestone table coverage
      missingEvidence: A complete chronology of product launches, legal events, and financing discussions beyond the highest-signal public milestones captured here.
      whyItMatters: This chapter is the chronology of record for later chapters, so missing milestones can ripple through market, risk, and financial interpretation.
      diligencePath: Export a complete newsroom archive, legal-events log, and financing timeline from management to supplement the public chronology.
      relatedTableRefs:
        - TO004
