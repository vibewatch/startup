  - id: leadership-governance-and-geography
    title: Leadership, governance, and geography
    body: >-
      Moloco remains meaningfully founder-led. Ikkjin Ahn still serves as CEO and is the clearest public face of the company’s long-term thesis that AI should power the broader Internet economy, not just the walled gardens. The technical founding bench also remains visible: co-founder David Sehyuk Park is still presented as CIO and historical builder of the company’s core machine-learning organization, while Donghwan Jeon has operated as CTO since 2016 after joining in 2015. Product and go-to-market leadership are less transparently documented than the founder bench, but Sunil Rayan is publicly identified as Chief Business Officer and GM of Moloco Ads in 2026 launch materials.

      Governance disclosure improved somewhat in 2026 when Moloco appointed Dawn Ostroff to its board and named existing independent directors Sabrina Simmons and Pat Wadors. Even so, the public file still does not provide a full board roster, committee structure, voting-control summary, or investor-rights matrix. Geography is much clearer than governance. Current official materials place the headquarters in Silicon Valley / Menlo Park and repeatedly describe offices across the U.S., U.K., Germany, Korea, China, India, Japan, and Singapore, while the careers page lists an even broader operating footprint including Israel and remote roles. Taken together, the public record supports a global operating company with concentrated technical leadership, but not a fully transparent governance file.
