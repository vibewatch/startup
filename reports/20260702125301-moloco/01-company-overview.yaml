  - id: scale-milestones-and-risk-signals
    title: Scale, milestones, and risk signals
    body: >-
      Moloco’s public operating scale is unusually well evidenced for a private company. Google Cloud’s Moloco case study says the retail-media platform supports more than 35,000 advertisers, runs 20+ deep neural network models, and processes around 600B bid requests each day. The companion 2026 vector-search architecture write-up adds technical proof that the system is still being upgraded at large scale, citing roughly 10x higher capacity, up to 25% lower p95 latency, and 4.0% monetization uplift in several rollouts. Customer proof spans multiple product lines rather than one flagship use case: JioCinema credits Moloco with serving targeted ads to 32M concurrent viewers during Tata IPL 2023, ShopBack says SKAN installs scaled 15x while CAC stayed stable, Scopely says Monopoly GO drove more than 1M installs in 30 days, and Bucketplace reports merchant GMV doubled with 3x ROAS for advertisers.

      Recent milestones reinforce breadth. Moloco launched SDK bidding through Google AdMob and Ad Manager in 2025, said nearly 500 publishers were already using the SDK, and launched Ads for Performance CTV in April 2026 with early ROI claims that suggest the company is pushing beyond mobile. Security and privacy signals are solid but standard: official materials cite SOC 2, ISO 27001, and GDPR alignment. The sharper risks are strategic and evidentiary. Costco coverage in The Drum suggests Moloco can be strategically valuable while still acting as only one layer in a retailer-controlled modular stack, Gartner review visibility is thin in the fetched corpus, and a February 2026 IPO report remains rumor-level without a filing or official confirmation.
