- id: capital-base-and-ipo-readiness
  title: Capital base and IPO readiness
  body: 'Moloco’s capital story is unusually mature for a still-private adtech company. The best-supported primary-capital anchor remains $200M raised by 2021. The later public capital event was not another disclosed primary round but a 2023 set of secondary transactions that brought Fidelity and EDBI onto the cap table at a >$2.0B valuation while producing no primary proceeds for the company. That pattern is consistent with management’s current message that Moloco is fully funded and not operating under immediate financing pressure.


    IPO readiness is more tentative. Multiple 2026 reports say Moloco selected Goldman Sachs and JPMorgan and was exploring a listing, but all of them also emphasize that deliberations were ongoing. Until an S-1 exists, IPO preparation should be interpreted as a real signal of readiness and liquidity planning, not as a completed financing event. It is helpful for direction, but it still leaves audited disclosure, timing, and valuation range unresolved.'
