- id: tracker-conflicts-and-gaps
  title: Tracker conflicts and public-data gaps
  body: 'The weakest part of the financial chapter is current precision. PM Insights, Premier Alternatives, Notice, CB Insights, and Craft all suggest that Moloco is visible on private-market data platforms, but none provides a fully reconciled public answer on present valuation, total funding, or current revenue. Premier Alternatives shows a $1.8B 2024 valuation and a funding total that conflicts with Moloco’s own disclosures. Notice presents pre-IPO trading context without turning that into audited enterprise value. PM Insights advertises deeper secondary and revenue datasets but withholds the detail in its public preview.


    The result is straightforward: Moloco’s operating quality is more supportable than its exact paper mark. Public sources are enough for a strong qualitative financial view and a bounded scenario model, but not enough for precise current-statement analysis. The contrast with a public 10-K from a listed adtech peer also highlights just how much disclosure still sits behind the private-company veil. Public-market cap feeds create the same contrast in real time.'
