chapter:
  number: 4
  title: Financials
  summary: Moloco discloses enough to support a credible profitability-and-scale story but not enough to support full financial modeling. The strongest anchors are >$100M run-rate in 2021, >$200M revenue in 2022, and profitability claims that extend from 12 profitable quarters in 2023 to five years profitable in 2026. The weaker anchors are current valuation, capital structure, and current-period financial statements, where third-party trackers disagree and official disclosure remains sparse.
sections:
- id: revenue-model-and-streams
  title: Revenue model and streams
  body: 'Moloco’s public financial story starts with what it appears to sell. The company monetizes through a combination of performance-ad-spend-linked demand-side activity and software or infrastructure surfaces in commerce media, streaming monetization, and publisher supply. That makes Moloco economically more interesting than a one-line campaign tool because its business model can blend transaction-linked economics with software-like platform value. Public evidence for that mix comes from product pages, Google Cloud marketplace distribution, and the fact that Moloco now markets distinct surfaces to app marketers, retailers, streamers, and publishers.


    What the public file does not show is the mix. There is no product-line revenue split, no take-rate disclosure, and no contract-level detail that would let an investor estimate how much revenue is recurring software versus performance-media flow. In practice, that means even a very positive outside-in view still has to treat segment economics as a diligence item rather than as a solved modeling input.'
  claimRefs:
  - CI021
  - CI023
  - CI029
  - CI032
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: disclosed-scale-and-profitability
  title: Disclosed scale and profitability
  body: 'The cleanest hard financial datapoints come from the 2021 financing disclosure and the 2023 investor update. Together they show a company that had already crossed $100M run-rate by 2021, exceeded $200M of revenue in 2022, and reached 12 consecutive profitable quarters by the time Fidelity and EDBI entered via secondary transactions. The 2026 CEO bio and careers page extend that story by saying Moloco has been profitable for five years and is fully funded.


    Those claims are company-authored, so they are not equivalent to audited statements. Even so, they are directionally consistent and sit alongside real scale signals from Google Cloud, which helps make the profitability narrative more credible than a generic growth-stage startup claim would be. They also point to a business that has likely crossed the fragile early-stage threshold and can fund continued product expansion from a stronger operating base.'
