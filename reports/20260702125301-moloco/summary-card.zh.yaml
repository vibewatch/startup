  topStrengths:
    - 公开材料支撑一个少见的私有 adtech 组合：有规模、收入超过 $200M，并且连续多年盈利。
    - 产品覆盖 app 增长 DSP、零售媒体、流媒体变现和出版方变现。
    - Google Cloud 佐证其技术规模不小，包括 35,000+ 广告主和约 600B 次每日竞价请求。
    - 公开客户案例覆盖游戏、零售、交易平台、金融、旅游和流媒体场景。
  topRisks:
    - 当前收入、利润率、留存和客户集中度细节仍有重大缺口。
    - Apple、Google、GDPR 及相关隐私政策变化可能削弱定向、归因和广告活动衡量。
    - 标杆 commerce-media 案例有价值，但仍偏早期，Costco 被明确描述为 beta 推出。
    - 对 Google Cloud 的规模和性能依赖带来运营和经济敏感性。
    - 外部估值跟踪和 IPO 准备报道，要么与公司官方披露冲突，要么证据质量低于官方披露。
  unresolvedGaps:
    - 2026 年当前收入、分部组合、毛利率和现金流细节。
    - 净收入留存、流失率、续约率、平均合同期限和头部客户集中度。
    - 当前 cap table 权属、二级转让条款，以及任何 2023 年后的一级融资。
    - 官方 IPO 准备证据，例如 S-1、经审计报表或来自一手来源的承销商确认。
