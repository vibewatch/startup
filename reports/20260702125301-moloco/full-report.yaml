  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and segment logic
        blocks:
          - type: paragraph
            body: >-
              Moloco does not fit neatly into one legacy adtech box. The public product surface now spans app-growth
              demand, retailer-owned onsite media, and streaming monetization, with publisher monetization and
              performance CTV extending the same optimization logic into adjacent workflows. That means the relevant
              market is not simply mobile DSP spend. It is a combination of open-internet app acquisition budgets,
              retailer and marketplace software budgets for ad monetization, and monetization infrastructure budgets for
              streaming inventory.


              The important analytical point is that each segment has a different buyer, user, and payer. App marketers
              buy Moloco Ads with performance media budgets; retailers and marketplaces buy commerce-media
              infrastructure while advertisers consume that infrastructure indirectly; streamers buy monetization
              software while advertiser demand funds the revenue pool. Moloco’s opportunity is therefore wider than a
              pure media-buying tool, but investors should use multiple market lenses rather than a false single-number
              TAM.
            claimRefs:
