      - number: '6.2'
        title: Named Customer Proof and Deployment Depth
        blocks:
          - type: paragraph
            body: >
              Moloco's public proof is deepest in campaign-level and deployment-level case studies rather than in a
              formal customer roster. On the app-advertising side, ShopBack says Moloco helped it scale SKAN installs
              15x while keeping CAC stable, Scopely says Moloco drove more than one million installs in 30 days for
              Monopoly GO and beat ROAS targets by 2.6x, and Nexon says Moloco's CTV solution improved CPIR by roughly
              50% and ROAS by more than 30 percentage points versus other channels. Musinsa and Karrot are especially
              useful because they show Moloco spanning multiple touchpoints: Musinsa used Moloco Ads plus commerce-media
              capabilities to turn reactivation into purchase efficiency, while Karrot used streaming ads on TVING plus
              Moloco retargeting to move users from awareness to chat and listing exploration. Bucketplace adds a
              retailer monetization proof point with outcome metrics tied to shopper spend, merchant GMV, and merchant
              ad adoption.


              The most persuasive independent or quasi-independent corroboration sits in Costco and JioCinema.
              Progressive Grocer, Adweek, and The Drum all reported Costco's decision to use Moloco for AI-powered
              onsite ads and digital endcaps, and those reports make clear that the rollout began as a beta rather than
              as a fully mature deployment. Viacom18's JioCinema quote is even stronger on production scale:
              Moloco-supported ad serving handled targeted ads for 32 million concurrent viewers during Tata IPL 2023,
              and the relationship is explicitly described as multi-year. Fanatics is a lighter but still useful new
              proof for Performance CTV, because the quote shows live advertiser adoption even though the public release
              does not provide the same quantitative depth seen in ShopBack or Scopely. Overall, Moloco has real named
              customer proof across app growth, retail media, and streaming, but proof quality varies materially by
              account.
