      - number: '6.4'
        title: Expansion, Concentration Risk, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              The biggest weakness in Moloco's customer chapter is not logo scarcity; it is missing economics. Public
              evidence does not disclose NRR, GRR, gross churn, net churn, average contract length, average spend per
              advertiser, top-customer revenue share, or product-line concentration. That omission matters because
              Moloco's strongest public reference accounts are also marquee accounts: Costco for commerce media,
              JioCinema for streaming, and high-profile game and app marketers such as Scopely, ShopBack, and Fanatics
              for performance advertising. Those examples validate capability, but they can still overstate
              diversification if a small number of flagship accounts or large advertisers drive a disproportionate share
              of revenue or product credibility.


              The most useful adverse source in the file is The Drum's Costco article. It argues that retail media needs
              Costco more than Costco needs retail media and quotes Costco as saying retail media should improve
              customer experience rather than simply extract revenue. That is an important warning for Moloco because it
              suggests the company must earn expansion by proving relevance and shopper utility, not just by increasing
              ad load. It also highlights why beta-stage wins should not be over-interpreted. In practical diligence
              terms, investors still need customer counts by direct payer, top-10 revenue concentration, contract length
              and renewal data for infrastructure customers, spend-retention cohorts for DSP advertisers, and
              customer-issued case studies that verify ROI from the buyer side rather than only from Moloco's own
              marketing stack.
