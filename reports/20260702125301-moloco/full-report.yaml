  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy, platform, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Moloco's risk profile starts with the fact that its own notices describe a data-rich advertising system
              while the surrounding platform and regulatory rules keep tightening. The advertising notice says Moloco's
              products can process advertising identifiers, device properties, usage signals, and derived data to
              measure performance and optimize campaigns. That is commercially normal for adtech, but it means Moloco is
              structurally exposed to any rule change that narrows identifiers, attribution, SDK behavior, or
              data-sharing permissions. Apple's ATT permission requirement, Apple's ban on fingerprinting, Google Play's
              user-data and SDK obligations, and Privacy Sandbox's still-evolving measurement framework all push risk
              outward from Moloco's own code into its customers' app environments and platform relationships. European
              and California privacy regimes add rights-driven compliance obligations, while the FTC remains an active
              U.S. enforcement backdrop. Moloco does have visible mitigations: current privacy notices, a February 2026
              security page, first-party-data positioning, and access-control language. The residual problem is that
              public materials still do not reveal customer DPAs, service commitments, or regulator-facing operating
              history in enough detail to conclude that governance risk is de minimis.
