        title: Revenue model and streams
        blocks:
          - type: paragraph
            body: >-
              Moloco’s public financial story starts with what it appears to sell. The company monetizes through a
              combination of performance-ad-spend-linked demand-side activity and software or infrastructure surfaces in
              commerce media, streaming monetization, and publisher supply. That makes Moloco economically more
              interesting than a one-line campaign tool because its business model can blend transaction-linked
              economics with software-like platform value. Public evidence for that mix comes from product pages, Google
              Cloud marketplace distribution, and the fact that Moloco now markets distinct surfaces to app marketers,
              retailers, streamers, and publishers.


              What the public file does not show is the mix. There is no product-line revenue split, no take-rate
              disclosure, and no contract-level detail that would let an investor estimate how much revenue is recurring
              software versus performance-media flow. In practice, that means even a very positive outside-in view still
              has to treat segment economics as a diligence item rather than as a solved modeling input.
