      - number: '7.3'
        title: Commercial, competitive, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The market backdrop is constructive but unforgiving. MediaPost's summary of IAB research says commerce
              media is expected to drive $74 billion of ad spend in 2026, but it also emphasizes fragmentation, weak
              standardization, and rising costs. That is the kind of market where a company can grow quickly and still
              face brutal margin, integration, and channel competition. Moloco is now stretching across app-growth
              demand, retail-media infrastructure, streaming monetization, and new performance CTV. The opportunity is
              obvious, yet each new surface adds implementation burden, policy touchpoints, and customer-success risk.
              Costco is a useful warning signal: the deployment is strategically valuable, but still early, and Costco's
              own framing makes clear that shopper experience comes before ad revenue extraction. Competitive disclosure
              also matters. Public peers such as AppLovin, DoubleVerify, and Criteo continue to publish 10-Ks or current
              results, which means investors can benchmark their risk factors and operating trajectories more directly
              than Moloco's. Moloco therefore faces both operating competition and narrative competition: it must prove
              cross-surface execution while offering less public evidence than listed peers.
