      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Moloco’s moat is strongest where customers want better prediction from their own first-party data without
              depending entirely on a giant platform. That is attractive in retail media and in parts of open-internet
              performance advertising. The moat is weaker where competitors already control the data, the inventory, or
              the enterprise workflow. Amazon and Google have obvious structural advantages there, and specialist peers
              can still win on sharper product focus or simpler integrations.


              The public record therefore supports a balanced view. Moloco is not a commodity point solution, but
              neither is its differentiation unassailable. The key diligence gaps are competitive win rates, pricing
              behavior, retention versus peers, and the degree to which Moloco can keep customers from shifting spend
              back to walled gardens or sideways to better-capitalized alternatives. Those gaps matter because adtech
              market share can reverse quickly when a buyer finds a simpler path to performance, transparency, or
              distribution.
