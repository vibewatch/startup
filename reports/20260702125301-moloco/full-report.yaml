      - number: '8.3'
        title: Scenario Ranges and Recommendation
        blocks:
          - type: paragraph
            body: >
              The right valuation question is not whether Moloco is a real company; it is whether the next dollar of
              entry price is being set against evidence or against narrative. Public evidence does support a real floor.
              Moloco had already crossed a >$100M run-rate in 2021, reported >$200M of 2022 revenue in its 2023 investor
              update, and still says it exceeds $200M in 2026 while remaining fully funded and profitable. That makes
              the >$2B 2023 secondary mark believable. If one uses only the public revenue floor, a >$2B valuation
              implies a sub-10x multiple on more than $200M of revenue; if current revenue is materially above that
              floor, the effective multiple is lower still.


              But valuation credibility is not the same as valuation attractiveness. The bull case needs current revenue
              growth, segment mix, and retention to show Moloco is becoming a software-quality retail-media and
              streaming platform rather than simply a strong mobile-performance specialist. The base case is that the
              company deserves a mid-single-digit to high-single-digit multiple because profitability, scale, and
              third-party performance signals are real, but not well enough disclosed to earn an AppLovin-like premium.
              The bear case is that growth, customer durability, or segment quality disappoints and the market
              compresses Moloco toward lower public adtech ranges. That is why the disciplined recommendation here is
              research-more / track with medium confidence and a fair valuation stance.
            claimRefs:
