      - number: '6.3'
        title: Adoption, Durability, and Review Proxies
        blocks:
          - type: paragraph
            body: >
              Because Moloco does not publicly disclose classic SaaS retention metrics, customer quality has to be
              inferred from second-order signals. Several are meaningful. Google Cloud's case study says Moloco RMP
              supports more than 35,000 advertisers globally, Moloco's investor update says more than a thousand global
              advertisers use the DSP, and Moloco's own product materials say the ads platform reaches more than two
              billion daily active users. Those are not direct revenue-retention metrics, but they do suggest that
              Moloco is operating at significant scale with a customer base that is broader than a handful of design
              partners. The clearest durability signal is Viacom18's explicit multi-year partnership language, which is
              stronger than the usual campaign-case-study format because it implies continuing operational dependence
              rather than a one-off test.


              Third-party ranking and review surfaces also help, though they should be interpreted carefully. AppsFlyer
              says its 2025 Performance Index analyzed 16.2 billion installs across 39,000 apps and 88 media sources,
              and Moloco's own recap says it ranked fifth overall in that edition. Singular's 2026 ROI Index and
              Moloco's summary of that report provide a similar signal that Moloco continues to show up across many
              leaderboard categories outside walled gardens. Gartner also hosted a Moloco retail-media vendor review
              page in 2026, which at minimum indicates that the product has enough market presence to generate external
              end-user review infrastructure. None of those signals substitute for NRR, churn, or renewal cohorts, but
              together they support the view that Moloco's products are used repeatedly enough to show up in ecosystem
              rankings, review surfaces, and multi-market case studies.
