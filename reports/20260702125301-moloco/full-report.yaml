  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: >-
      Named customer proof repeatedly follows the same sequence: first-party signal ingestion, ML optimization,
      measurable outcome, then a claim of broader scale or expansion.
    data:
      nodes:
        - id: n1
          label: Initial customer need
          detail: Growth efficiency, new ad revenue, or live-stream monetization problem.
        - id: n2
          label: First-party signal onboarding
          detail: App events, shopper data, catalog context, or streaming demand signals are integrated.
        - id: n3
          label: ML optimization in production
          detail: Moloco runs bidding, personalization, targeting, or ad serving against outcome goals.
        - id: n4
          label: Publicly disclosed result
          detail: Case studies cite installs, ROAS, GMV, video completion, CPA, or concurrent-viewer scale.
        - id: n5
          label: Budget / surface expansion
          detail: Customer expands into more markets, more channels, more placements, or longer partnership scope.
      edges:
        - from: n1
          to: n2
          label: data access
        - from: n2
          to: n3
          label: model training
        - from: n3
          to: n4
          label: measured outcome
        - from: n4
          to: n5
          label: proof of value
    claimRefs:
      - CU012
      - CU015
      - CU017
      - CU019
      - CU024
      - CU026
      - CU028
      - CU031
      - CU034
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public proof is strongest on outcome specificity and weakest on retention visibility, with independent
      corroboration concentrated in only a few flagship accounts.
    data:
      columns:
        - Outcome specificity
        - Independent corroboration
        - Durability visibility
        - Concentration visibility
      rows:
        - label: Moloco Ads
          values:
            - High — ShopBack, Scopely, Nexon, and Fanatics show concrete campaign outcomes.
            - Low-medium — most proofs are Moloco-authored, even when the customer is named.
            - Low — no public renewal, NRR, or contract-length data.
            - Low — no spend concentration by advertiser is disclosed.
        - label: Commerce Media
          values:
            - High — Bucketplace and Musinsa are quantified, and Costco confirms rollout specifics.
            - >-
              Medium-high — Costco is independently corroborated by multiple outlets and Google Cloud validates
              advertiser scale.
            - Low-medium — Costco is still in beta and broader customer renewals are not public.
            - Low — retailer count, ARR mix, and top-network exposure are undisclosed.
        - label: Streaming Monetization
          values:
            - Medium-high — JioCinema and Karrot disclose concrete operating or campaign outcomes.
            - Medium — JioCinema includes a customer quote, but the broader roster is thin.
            - Medium — Viacom18 is explicitly multi-year, which is better than most public proofs.
            - Low — no revenue share, minimum commitment, or platform mix is disclosed.
        - label: Partner / infrastructure channel
          values:
            - Medium — Topsort and Google Cloud show ecosystem reach more than direct end-user ROI.
            - High — partner-side sources are independent of Moloco's own case-study hub.
            - Low — indirect-channel renewal and economics are not disclosed.
            - Low — direct vs. indirect customer concentration remains opaque.
    claimRefs:
