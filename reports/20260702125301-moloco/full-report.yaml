  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a simple chain: official valuation credibility is real, market tailwinds are real, but
      evidence quality is still too incomplete for aggressive price underwriting.
    data:
      nodes:
        - id: n1
          label: Official anchors
          detail: $1.5B in 2021 and >$2.0B in 2023 secondary trades with no primary proceeds
        - id: n2
          label: Operating support
          detail: '>$200M revenue, multi-year profitability, and fully funded messaging support credibility'
        - id: n3
          label: Market tailwind
          detail: Retail media and digital video remain attractive 2026 end markets
        - id: n4
          label: Missing underwriting inputs
          detail: Current revenue, margin, retention, and terms are still undisclosed publicly
        - id: n5
          label: Recommendation
          detail: Research-more / track with fair valuation stance
      edges:
        - from: n1
          to: n2
          label: price is credible because business scaled
        - from: n2
          to: n3
          label: quality meets tailwind
        - from: n3
          to: n4
          label: but comp and market data are not enough alone
        - from: n4
          to: n5
          label: opacity blocks a buy call
    claimRefs:
