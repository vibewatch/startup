      - number: '8.2'
        title: Comparable Framework and Market Context
        blocks:
          - type: paragraph
            body: >
              Moloco is difficult to comp because it is not just one thing. Public evidence shows a business that spans
              performance DSP, retail media infrastructure, and streaming monetization, so the best comp set has to mix
              open-internet buying platforms, commerce-media or performance-ad peers, and measurement or verification
              vendors. The operating tailwind is real. Google Cloud's 2026 retail-media architecture post says the
              category grew 21.9% in 2025 and is on a 19.7% CAGR through 2027, while IAB forecasts put U.S. digital
              video above $80B in 2026 and commerce media around $74B. Moloco's own third-party-adjacent proof also
              matters here: Google Cloud says Moloco RMP supports more than 35,000 advertisers, AppsFlyer analyzed 16.2B
              installs across 39K apps and 88 media sources in its 2025 index, and Singular says its 2026 ROI index is
              built on trillions of impressions and billions of installs.


              The comp dispersion is extreme. CompaniesMarketCap's July 2026 snapshots place Criteo near $0.95B,
              DoubleVerify near $1.72B, IAS near $1.73B, The Trade Desk near $9.08B, and AppLovin at roughly $192.33B.
              Criteo's TTM P/S ratio is only 0.4772, while The Trade Desk's July 2026 TTM P/S ratio is 3.03. That spread
              is the right lens for Moloco: a profitable, scaled, high-performance private company can justify more than
              mature lower-multiple adtech, but public evidence does not support treating it like an AppLovin-style
              outlier without much stronger proof of current revenue scale and mix.
