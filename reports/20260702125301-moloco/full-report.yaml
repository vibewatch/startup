      - number: '8.4'
        title: Diligence Gaps and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              The public file still leaves too many underwriting variables open to recommend a step-up investment on
              valuation alone. No cited public source discloses current 2026 revenue, gross margin, NRR, direct-payer
              concentration, or segment mix across DSP, commerce media, and streaming. No public source in the fetched
              set discloses secondary-transaction price per share, liquidation preferences, board or observer rights, or
              other terms that would matter in a real private-market purchase. IPO readiness is also still rumor-level:
              Stankevicius says Goldman Sachs and JPMorgan were selected for an anticipated public offering in February
              2026, but no S-1 or official filing appears in the fetched record.


              The sharper thesis-break signals are concrete. If diligence shows current revenue is only modestly above
              the 2022 floor, the valuation case weakens immediately. If retail media wins are still pilot- or
              beta-heavy rather than durable software contracts, Moloco should be valued closer to lower-multiple adtech
              peers. If flagship customer proof does not translate into repeatable retention and expansion, the business
              may deserve a far narrower comp set. Conversely, if management can show substantially higher current
              revenue, continued profitability, clean governance and transaction terms, and durable direct-payer
              retention across commerce media and streaming, the upside case above the last clean >$2B mark becomes
              materially easier to underwrite.
