  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation Anchors and Evidence Quality
        blocks:
          - type: paragraph
            body: >
              The cleanest valuation anchors in Moloco's public file are still the official ones, not the tracker pages.
              Moloco's August 2021 Series C announcement and TechCrunch coverage align on the key facts: the company
              raised $150M, reached a $1.5B valuation, had raised $200M in total, and had already surpassed a $100M
              annual net revenue run-rate. The next clean step-up came in June 2023 when Moloco said secondary
              transactions that brought Fidelity and EDBI onto the cap table valued the company at more than $2.0B, with
              no primary proceeds going to the company. That matters because it implies the valuation moved higher
              without fresh dilution capital being publicly disclosed.


              The problem is not that Moloco lacks positive signals; it is that the latest signals are still not a full
              underwriting package. Current careers copy continues to say Moloco is valued over $2B, fully funded, above
              $200M in revenue, and profitable for years, which is directionally supportive but still self-authored.
              Premier Alternatives now shows a lower $1.8B mark and an implausible $499.5M total funding figure that
              conflicts with Moloco's own disclosed history, while PM Insights and Notice.co expose only teaser- or
              headline-level views with no transparent methodology. The practical takeaway is that investors can trust
              the existence of a later-stage private mark above $2B, but they cannot treat current tracker precision as
              audited truth.
            claimRefs:
              - CV001
              - CV002
              - CV003
