  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation by Product Line
        blocks:
          - type: paragraph
            body: >
              Moloco does not sell one monolithic advertising product to one buyer. Public materials show three distinct
              customer groups. Moloco Ads is aimed at app marketers and performance teams that want user acquisition and
              re-engagement across the independent app ecosystem. Moloco Commerce Media is aimed at retailers and
              marketplaces that want to turn first-party shopper data and digital storefront inventory into an ads
              business. Moloco Streaming Monetization is aimed at streaming platforms and media owners that want to grow
              advertiser demand and improve monetization with better ad serving and optimization. That three-way
              segmentation matters because the buyer, user, and payer differ by product: an app marketer spends media
              budget on Moloco Ads, a retailer or marketplace operator buys Commerce Media infrastructure while brands
              use it indirectly, and a streaming platform buys monetization infrastructure while advertisers fund the
              demand side.


              Public scale markers suggest Moloco has enough breadth to matter in each of those lanes, even though
              disclosure remains uneven. Moloco says its ads platform reaches more than two billion daily active users
              and gives advertisers access to millions of independent apps, while its investor update says more than a
              thousand global advertisers already use the DSP. On the commerce side, Google Cloud says Moloco RMP
              supports more than 35,000 advertisers globally, and Moloco says the platform can activate more than 10,000
              advertisers in a single day. Those metrics do not tell investors how many retailer, marketplace, or
              media-owner customers pay Moloco directly, but they do show that the company operates at real advertiser
              and impression scale rather than at pilot-only volume.
