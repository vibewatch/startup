      - number: '7.2'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Moloco's operating scale makes infrastructure and model-quality risk material rather than theoretical.
              Google Cloud says Moloco's retail-media platform supports more than 35,000 advertisers, processes around
              600 billion bid requests daily, and runs more than 20 deep neural network models. Those metrics are
              strategically attractive, but they also mean small reliability regressions can cascade into many customers
              and advertisers at once. The Google Cloud Vector Search case is especially important because it links
              concrete business outcomes to architecture: about 10x higher capacity, up to 25% lower p95 latency, and
              around 4% revenue uplift in several rollouts. That is good evidence of technical depth, but it also proves
              that latency, retrieval, and scoring quality are directly tied to monetization outcomes. JioCinema's 32
              million-concurrent-viewer proof and Costco's AI-driven onsite ads reinforce the point that Moloco is
              operating in environments where mistakes are visible and expensive. Security and brand-safety materials
              show meaningful controls, but the public file still lacks incident logs, uptime history, and service-level
              detail, which raises residual underwriting risk around reliability, crisis handling, and enterprise
              support maturity.
