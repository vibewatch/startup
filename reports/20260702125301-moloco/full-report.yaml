      - number: '1.3'
        title: Capital base, valuation, and ownership signals
        blocks:
          - type: paragraph
            body: >-
              The strongest clean financing datapoint remains the August 2021 Series C. Official and TechCrunch coverage
              align on the essentials: Moloco raised $150M, Tiger Global led the round, the valuation was $1.5B, total
              capital raised reached $200M, and annual net revenue run-rate had already surpassed $100M. That round
              framed Moloco as a fast-growing adtech company preparing for broader product expansion, including retail
              media. Unlike many private adtech peers, Moloco’s subsequent public capital narrative is not centered on
              new primary fundraising. The key 2023 event was a secondary transaction set that brought Fidelity
              Management & Research and EDBI onto the cap table, with Korea Investment Partners selling shares to
              Fidelity. Moloco explicitly said it received no primary proceeds.

              That secondary narrative supports maturity and capital efficiency. Official sources say the trades valued
              Moloco at more than $2.0B, 2022 revenue exceeded $200M, and profitability had already extended to 12
              consecutive quarters. The current careers page goes further by saying the company is fully funded, does
              not need additional capital, has grown revenue more than 5x since 2020, and has been profitable for more
              than five years. The problem is not absence of positive evidence; it is conflict and opacity. Premier
              Alternatives currently shows a much lower $1.8B mark as of May 1, 2024 and an implausible $499.5M funding
              total, while PM Insights offers only teaser-level secondary-market analytics. The prudent view is that
              Moloco’s operating quality is better supported than its current paper valuation.
            claimRefs:
