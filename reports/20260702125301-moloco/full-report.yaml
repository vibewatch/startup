        - Not a valuation comp because DSP economics sit inside Amazon’s broader platform
        - Strategic rather than valuation comp
    notes: >-
      This is a partial comp set designed to frame valuation bands; it mixes direct, adjacent, and strategic references
      because no single public company cleanly matches Moloco’s three-product mix.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-useful public adtech and commerce-media reference points available in the fetched
        corpus, not an exhaustive global peer screen of every adtech issuer.
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold or event
      - Why it matters
      - Action implication
    rows:
      - - Current revenue disappoints
        - Management shows revenue only modestly above the 2022 >$200M floor
        - The multiple case collapses if public-mark narrative outran operating scale
        - Move from fair to stretched / avoid step-up pricing
      - - Profitability quality weakens
        - Margins or cash generation prove materially weaker than the public narrative implies
        - Would reduce the right multiple even if growth remains decent
        - Demand lower price or pause
      - - Retail-media durability is overstated
        - Flagship wins remain beta-heavy or pilot-heavy without repeatable software renewals
        - Would shrink the software-quality portion of the story
        - Reframe Moloco as narrower adtech exposure
      - - Customer concentration is high
        - A small number of marquee accounts drive a disproportionate share of revenue
        - Would weaken diversification and exit-readiness claims
        - Price for concentration risk or defer
      - - IPO or secondary terms are weak
        - Future filing or data room reveals heavy preferences, governance overhang, or liquidity stress
        - Would change effective entry economics even if the headline valuation looks unchanged
        - Require full term normalization before investing
    notes: >-
      These triggers are designed for investment discipline, not for operating management; each one maps directly to
      valuation transmission rather than generic company risk.
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current revenue and segment mix
        - 2026 revenue by DSP, commerce media, and streaming
        - Determines the real multiple and whether Moloco is more software-like than legacy adtech
        - Request current management reporting pack or audited financials
      - - Gross margin and cash generation
        - Segment gross margin, EBITDA, and free-cash-flow bridge
        - Separates healthy software-quality scale from lower-quality volume growth
        - Request finance diligence deck and monthly P&L
      - - Retention and concentration
        - NRR, GRR, top-10 customer share, and cohort expansion
        - Tests durability of the premium case and exposure to marquee logos
        - Request customer analytics dashboard and renewal cohort tables
      - - Security terms and governance
        - Share class, liquidation preference, board rights, and information rights
        - Determines true entry economics beyond headline valuation
        - Review latest secondary or primary transaction documents
      - - IPO readiness
        - Bank mandates, audit readiness, controls maturity, and any draft filing work
        - Clarifies whether exit optionality is real or just rumor-level
        - Ask management and counsel for IPO-prep materials
      - - Reference quality
        - Independent customer calls across retail media, DSP, and streaming
        - Validates that public case studies translate into budget durability
        - Run customer call list with direct payer operators
    notes: These diligence asks are the minimum package required to move from scenario framing to genuine underwriting.
    claimRefs:
      - CV035
      - CV036
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
