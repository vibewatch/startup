companyProfile:
  summary: >-
    Moloco was founded in 2013 and has grown from a mobile-performance DSP into a broader open-internet advertising
    platform with products for app growth, retail media, streaming monetization, and publisher monetization. Public 2026
    materials support a scaled private company with more than $200M in revenue, multi-year profitability, more than 700
    employees, and meaningful global reach, while Google Cloud materials corroborate unusual infrastructure scale in
    retail media. The business looks strategically relevant and operationally mature, but public disclosure remains
    selective on governance, current financials, customer concentration, and transaction terms.
