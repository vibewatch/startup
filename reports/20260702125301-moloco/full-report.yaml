  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer-set framing
        blocks:
          - type: paragraph
            body: >-
              Moloco competes on several fronts at once, which makes the landscape more complicated than a single peer
              table. In app growth it runs into AppLovin, Unity, InMobi, Amazon, Google, and broader DSPs that can
              absorb performance budgets. In retail media it overlaps with Criteo, Skai, and Topsort while also
              competing indirectly with retailer in-house builds. In streaming and publisher tooling it faces both
              demand-side platforms and supply-path or monetization products that promise better control, transparency,
              or direct demand.


              That matters because buyers compare Moloco against different alternative sets depending on workflow. The
              relevant underwriting question is not whether Moloco has competitors; it clearly does. The question is
              whether its shared ML layer produces enough performance and operational leverage to overcome rival data
              ownership, distribution power, or workflow lock-in. The answer is likely segment-specific rather than
              universal, which is why peer analysis should be done by workflow and not only by company size.
