        title: Product surface and suite logic
        blocks:
          - type: paragraph
            body: >-
              Moloco should be understood as a multi-surface advertising and monetization platform rather than a single
              mobile UA network. The current public suite spans Moloco Ads for acquisition and re-engagement, Commerce
              Media for retailer and marketplace onsite media, Streaming Monetization for OTT and live-streaming
              inventory, and Moloco SDK for publishers that want direct advertiser demand without depending only on
              mediation waterfalls. Performance CTV extends the same positioning into connected television, which
              matters because it shows Moloco trying to move the same optimization stack across screens rather than
              remaining a mobile-only tool. The architectural implication is that Moloco is selling a shared
              machine-learning capability into different operator workflows: marketers, retailers, streamers, and
              publishers. That breadth is strategically attractive because it broadens budgets and data exhaust, but it
              also raises the diligence burden on how much of the suite is one coherent platform versus several adjacent
              products sharing a brand and ML narrative.
