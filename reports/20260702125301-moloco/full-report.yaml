      - number: '7.4'
        title: Financial opacity, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Moloco's financing history is credible but still under-disclosed for underwriting current risk. The
              company has a clean 2021 Series C datapoint and a 2023 secondary transaction that added Fidelity and EDBI
              with no new primary capital, plus management claims of more than $200 million in 2022 revenue and 12
              consecutive profitable quarters by late 2023. Those are positive signals, but they stop well short of
              filing-grade visibility. The reviewed public set does not disclose current product-line revenue mix,
              top-customer concentration, direct-versus-indirect revenue split, contract terms, or service levels. That
              leaves investors relying on milestone press releases and flagship proofs rather than a continuously
              updated operating ledger. The residual implication is not simply "unknown financials"; it is that several
              of Moloco's highest-severity risks can only be monitored indirectly unless management opens a deeper data
              room. The explicit risk matrix below therefore ranks privacy-platform dependency, cloud and
              model-performance dependency, flagship-account execution, and disclosure asymmetry as the top residual
              exposures. A thesis on Moloco should break if those risks stop looking monitorable and start looking
              opaque, unmitigated, or clearly worsening.
