chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and product scope
        blocks:
          - type: paragraph
            body: >-
              Moloco is no longer best described as a single-point mobile adtech vendor. The consistent 2026 company
              narrative is that Moloco is an AI-native performance advertising platform built for the open Internet and
              designed to make the machine-learning capabilities of big tech available to other businesses. Official
              materials still anchor the company in app-growth performance marketing, but they now present a broader
              suite: Moloco Ads for user acquisition and re-engagement, Moloco Commerce Media for retailers and
              marketplaces, Moloco Streaming Monetization for media owners, and Moloco SDK for publisher monetization.
              That product mix matters because it shows Moloco moving from campaign optimization into infrastructure for
              demand, supply, and monetization across multiple surfaces.

              The business model also appears more enterprise-oriented than the original DSP framing suggested. Moloco’s
              product pages and Google Cloud partner materials show the company monetizing through software and managed
              ad infrastructure that rely on first-party data, real-time prediction, and outcome-based optimization
              rather than static audience segmentation. Official scale claims now span more than 200 countries and
              territories, over 2B daily active users for Moloco Ads, and broad retailer and streaming deployments. The
              result is a company that still competes in adtech, but increasingly does so as a multi-product AI platform
              rather than a narrow campaign tool.
