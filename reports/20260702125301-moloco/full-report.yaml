            body: >-
              Moloco's trust posture is better documented than its internal topology. Security and policy pages
              explicitly claim SOC 2, ISO 27001, GDPR alignment, SSO, MFA, private-cloud isolation for client models,
              and a formal brand-safety operating process with takedown timelines and app-ads.txt support. Those are
              meaningful signals for enterprise buyers, especially because Moloco works in ad categories where platform
              trust and misplacement risk matter. The harder question is how external platform policy changes and
              ecosystem data sharing affect product durability. Moloco's own privacy notice makes clear that its
              products can process identifiers, behavioral events, and predictive metrics, and that data may flow to
              SSPs, DSPs, ad mediation, and AI or ML providers. Apple ATT keeps app developers responsible for
              third-party SDK tracking behavior, while Privacy Sandbox remains an evolving external dependency. In other
              words, Moloco has visible controls, but privacy, measurement, and platform-governance risk remain
              structural rather than fully solved.
