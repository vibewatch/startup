      - number: '3.3'
        title: Trust, compliance, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Competition is not only about auction quality. Trust and implementation depth also matter. Moloco has
              public privacy, advertising, brand-safety, and developer-doc surfaces that show some operational
              seriousness. Apple privacy rules and Google Privacy Sandbox make those trust and compliance layers
              relevant for the whole peer set, because buyers need vendors that can adapt to platform change without
              breaking measurement, data handling, or publisher trust.


              At the same time, public evidence suggests switching costs are real but not absolute. SDK integrations,
              retailer-media workflows, and partner implementations can make Moloco sticky, especially once models are
              trained on local data. But multi-homing remains highly plausible because advertisers, retailers, and
              publishers often test multiple partners at once. Without public retention or win-loss evidence, investors
              should assume Moloco competes in a market where product quality matters but exclusivity is uncommon. In
              practice, that means Moloco probably wins many expansions one workflow at a time instead of locking entire
              accounts forever.
            claimRefs:
