    - 10,000+ advertisers activated in a single day
    - Operational scale lens for commerce-media adoption
    - Throughput does not reveal direct revenue per advertiser or retailer count
  notes: Multiple sizing lenses are more defensible than a forced single TAM because Moloco spans media buying, retail software, and streaming monetization.
