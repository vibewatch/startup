- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Retailer first-party data monetization
    - Positive
    - Current
    - Strengthens the case for Commerce Media and partner channels
    - How many direct retail operators are live and revenue-generating?
  - - Privacy-safe mobile attribution
    - Mixed
    - Current
    - Raises demand for ML optimization but lowers signal richness
    - What share of Moloco performance still relies on modeled vs deterministic measurement?
  - - Incumbent competition from Amazon / Google / AppLovin / others
    - Negative
    - Current
    - Can compress margins and slow share gains in every segment
    - Where does Moloco win consistently on performance or economics?
  - - CTV becoming performance-measurable
    - Positive
    - Emerging
    - Creates an adjacency for Moloco’s existing app-growth customers
    - How broad is current Performance CTV advertiser and publisher adoption?
  - - Retailer UX sensitivity to ad load
    - Negative
    - Current
    - Can limit expansion if onsite ads harm shopper experience
    - What guardrails and lift tests exist at major retail deployments?
  notes: Growth is not the same as capture; the key underwriting question is how much of each trend Moloco can convert into durable revenue.
