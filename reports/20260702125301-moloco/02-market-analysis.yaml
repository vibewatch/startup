- id: market-structure-and-incumbents
  title: Market structure and incumbent pressure
  body: 'Moloco’s target markets are attractive partly because they remain fragmented, but that fragmentation does not mean they are easy. Amazon DSP, Google DV360, Criteo, AppLovin, InMobi, Unity, PubMatic, and Skai all market credible solutions across one or more slices that overlap with Moloco’s buyer workflows. Some lead with first-party data, some with omnichannel reach, some with gaming-scale app growth, and some with retailer-owned media tooling.


    That matters for Moloco because it needs to win on product fit rather than on an empty white space. Its opportunity is strongest where a buyer wants big-tech-grade optimization while preserving local control over inventory, shopper experience, or advertiser economics. Its risk is that large incumbents already own buyer relationships, supply, or measurement stacks in many of the same workflows. Market attractiveness is therefore real, but it is not monopoly-like.'
