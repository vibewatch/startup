- id: growth-tailwinds
  title: Growth tailwinds across retail media, mobile, and CTV
  body: 'The market backdrop is favorable on three fronts. First, retail media keeps compounding because retailers own high-intent first-party data and increasingly want to monetize it without handing economics to Amazon or Google. Google Cloud’s Moloco architecture write-up is useful here because it cites Dentsu growth forecasts and explains why many retailers have data but not the ML stack required to operationalize it. Second, mobile advertising is still large and active outside the biggest walled gardens, with AppsFlyer continuing to see high install volumes and media-source competition. Third, Moloco’s CTV launch suggests that performance-minded app marketers now see streaming inventory as a measurable adjacency rather than as a pure brand channel.


    Together, those trends support the idea that Moloco is riding multiple category expansions at once. The caution is that public evidence is much better on category growth than on Moloco’s segment-level revenue capture. In diligence, that means category momentum should be treated as a tailwind to underwriting, not as a substitute for segment mix or conversion-quality data.'
