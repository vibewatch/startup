  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Adoption trigger
  rows:
  - - App growth
    - VP Growth / UA lead
    - Media buyer / lifecycle marketer
    - Performance media budget owner
    - Buy, optimize, and measure installs or revenue events
    - Need to scale outside Meta / Google while holding ROAS or CPA
  - - Retail media
    - Marketplace GM or ads-business lead
    - Ads-ops, merchandising, and data teams
    - Software / infrastructure budget owner
    - Monetize owned storefront traffic and first-party data
    - Need to build new ad revenue without a large in-house ML team
  - - Streaming monetization
    - Chief revenue officer or ad-monetization lead
    - Ad ops / yield teams
    - Platform monetization owner
    - Increase advertiser demand and improve ad relevance at scale
    - Need better measurable outcomes for premium or live inventory
  - - Publisher monetization
    - Head of monetization
    - Publisher ad-ops / engineering team
    - Yield budget owner
    - Add direct advertiser demand through SDK or bidding surfaces
    - Need diversified demand without rebuilding the stack
  notes: The same Moloco brand serves different economic buyers, which is why a buyer-user-payer map is necessary for correct market definition.
