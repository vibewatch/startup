- id: privacy-and-measurement-constraints
  title: Privacy and measurement constraints
  body: 'The privacy environment is central to Moloco’s market, not a side topic. Apple’s attribution stack is explicitly designed to limit user-level tracking, and Google’s Privacy Sandbox remains an evolving external dependency. Those changes create a paradox for Moloco. On the positive side, they increase the value of first-party retailer data and model-based optimization. On the negative side, they make mobile measurement harder, reduce deterministic identity, and force marketers to accept more modeled attribution.


    This is why Moloco’s market should be viewed as structurally attractive but operationally constrained. Privacy changes do not eliminate demand; they redistribute advantage toward platforms that can still learn from limited signals. Moloco benefits from that if its ML stack is meaningfully better than peers, but the same privacy environment also raises execution risk and can compress observed performance if platform rules change faster than product adaptation cycles. It also means that customer proof can look strong while still masking signal decay, longer learning periods, or weaker attribution confidence in specific channels.'
