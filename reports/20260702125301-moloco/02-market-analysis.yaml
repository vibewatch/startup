- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or software
  - Excluded from scope
  - Buyer / payer
  - Relevance to Moloco
  rows:
  - - Open-internet app performance advertising
    - UA and re-engagement spend across independent apps
    - Search ads inside walled gardens and pure agency services
    - App marketer / performance budget owner
    - Moloco Ads is the core incumbent product surface
  - - Retail media infrastructure
    - Retailer or marketplace software, ad serving, ranking, and measurement
    - Retailer-owned media sold entirely in-house without external tech
    - Retailer / marketplace operator
    - Moloco Commerce Media is the clearest expansion vector beyond the DSP base
  - - Streaming / CTV monetization
    - Ad serving, optimization, and demand consolidation for OTT inventory
    - Linear TV upfront buying and pure SSP services without ML layer
    - Streaming platform monetization owner
    - Streaming Monetization and Performance CTV make this a real adjacency
  - - Publisher monetization / SDK demand
    - SDK-mediated access to advertiser demand and fill optimization
    - Pure mediation software without direct demand
    - Publisher monetization team
    - Extends Moloco into supply-side operator workflows
  notes: A single-market label understates Moloco because the company now sells into distinct demand, retailer, streamer, and publisher workflows.
