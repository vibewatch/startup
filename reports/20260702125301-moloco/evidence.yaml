evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-conflict
    missingEvidence: >-
      A management-validated 2024-2026 valuation history, 409A summary, or board-approved pricing memo that reconciles
      official >$2.0B secondary valuation commentary with lower third-party secondary-market tracker marks.
    whyItMatters: >-
      Current valuation directly affects investability, employee option value, IPO readiness, and whether Moloco is
      compounding from or below its last disclosed step-up.
    diligencePath: >-
      Request the latest cap-table package, any 409A or third-party valuation deck, and summaries of recent secondary
      trades from finance or counsel.
    relatedQuestionRefs:
      - QO013
      - QO026
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: A full current board roster, committee list, ownership percentages, and investor-rights summary.
    whyItMatters: >-
      Without control-rights visibility, it is hard to judge founder control, investor veto power, and IPO-governance
      preparedness.
    diligencePath: >-
      Request the board deck cover pages, charter extracts, and a fully diluted ownership table with voting and observer
      rights.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: ipo-rumor
    missingEvidence: An SEC filing, company statement, or banker-confirmed primary source validating any 2026 IPO process.
    whyItMatters: >-
      Rumor-level IPO coverage can distort market-readiness assessments and investor expectations if treated as settled
      fact.
    diligencePath: >-
      Monitor SEC EDGAR, Moloco newsroom updates, and any tier-one finance coverage for an S-1, F-1, or formal mandate
      confirmation.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table coverage
    missingEvidence: >-
      A complete executive leadership roster and any board observers or non-independent directors not named in public
      releases.
    whyItMatters: Later diligence chapters may need a full accountability map for product, finance, legal, and people functions.
    diligencePath: Request the internal org chart and current board list, then reconcile against public bios and press releases.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table coverage
    missingEvidence: >-
      A complete chronology of product launches, legal events, and financing discussions beyond the highest-signal
      public milestones captured here.
    whyItMatters: >-
      This chapter is the chronology of record for later chapters, so missing milestones can ripple through market,
      risk, and financial interpretation.
    diligencePath: >-
      Export a complete newsroom archive, legal-events log, and financing timeline from management to supplement the
      public chronology.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: market-mix
    missingEvidence: Segment-level revenue mix across app growth, commerce media, and streaming.
    whyItMatters: >-
      Without mix disclosure it is impossible to turn category growth into a precise Moloco SAM or revenue sensitivity
      model.
    diligencePath: Request internal revenue split and forward pipeline by product line.
    relatedQuestionRefs:
      - QM021
      - QM022
      - QM023
  - type: missing-source
    severity: material
    topic: tam
    missingEvidence: Direct third-party TAM reports for every segment rather than company-cited or proxy growth lenses.
    whyItMatters: A cleaner independent market model would reduce reliance on proxy metrics and company-selected comparables.
    diligencePath: Obtain direct Dentsu, eMarketer, or equivalent market reports in diligence.
    relatedQuestionRefs:
      - QM010
      - QM020
  - type: private-evidence-only
    severity: minor
    topic: capture
    missingEvidence: Win-rate and share-of-wallet data against named incumbents by segment.
    whyItMatters: The market is attractive but competitive; capture quality matters more than category growth alone.
    diligencePath: Request competitive bake-off results and cohort-level expansion data.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Competitive win-loss data, retention against named rivals, and pricing outcomes by segment.
    whyItMatters: Public vendor pages show positioning, not actual buying behavior or durable share capture.
    diligencePath: Request win-rate data, displacement examples, and net-spend-retention versus direct peers.
    relatedQuestionRefs:
      - QP021
      - QP022
      - QP023
  - type: missing-source
    severity: minor
    topic: pricing
    missingEvidence: Comparable public pricing or contract-model detail across peers.
    whyItMatters: Packaging and take-rate structure influence market share and margin durability.
    diligencePath: Collect customer and channel-partner pricing examples during diligence.
    relatedQuestionRefs:
      - QP009
      - QP021
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Evidence showing whether Moloco is embedded deeply enough to prevent multi-homing or budget reallocation.
    whyItMatters: Competitive durability depends more on retention and integration stickiness than on marketing language.
    diligencePath: Request cohort retention, migration stories, and implementation churn by product line.
    relatedQuestionRefs:
      - QP013
      - QP023
      - QP025
  - type: private-evidence-only
    severity: material
    topic: financial-statements
    missingEvidence: Audited income statement, balance sheet, and cash flow statement for recent years.
    whyItMatters: Without audited statements, public profitability and funding claims cannot be converted into a full underwrite.
    diligencePath: Request audited financials and monthly management reporting.
    relatedQuestionRefs:
      - QI022
      - QI023
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Reconciled current share count and valuation methodology across company disclosures and tracker marks.
    whyItMatters: Current paper value affects dilution, IPO expectations, and scenario framing.
    diligencePath: Request cap-table summary, recent secondary transaction data, and board-approved 409A or internal marks.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI015
      - QI021
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Product-line and geography revenue split plus direct vs partner-channel economics.
    whyItMatters: Different Moloco surfaces likely carry different margin and durability profiles.
    diligencePath: Request product P&L and channel-contribution bridge.
    relatedQuestionRefs:
      - QI001
      - QI016
      - QI017
  - type: missing-source
    severity: material
    topic: multi-tenant-ops
    missingEvidence: >-
      Tenant-isolation design, per-product status history, SLO or SLA metrics, and recent incident postmortems across
      Ads, Commerce Media, Streaming, SDK, and CTV.
    whyItMatters: >-
      Without service-history and tenancy detail, it is hard to judge whether Moloco's shared ML story is operationally
      coherent or just commercially adjacent across modules.
    diligencePath: >-
      Request architecture review materials, trust-portal exports, last-12-month incident logs, and representative
      enterprise SLA language by product line.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: roadmap-depth
    missingEvidence: >-
      Module-level roadmap and release-cadence detail for Commerce Media, Streaming Monetization, SDK, and CTV beyond
      the public launch and rollout announcements.
    whyItMatters: >-
      Public milestones show expansion, but they do not reveal whether features are broadly GA, still design-partner
      only, or bespoke to a handful of accounts.
    diligencePath: >-
      Ask product leadership for a roadmap, release-note history, and a maturity map that labels beta, limited
      availability, and GA features by module.
    relatedQuestionRefs:
      - QE018
      - QE025
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: minor
    topic: developer-community
    missingEvidence: >-
      Public change logs, package metrics, support-forum activity, or open-source repositories that demonstrate external
      builder adoption beyond API docs and recruiting pages.
    whyItMatters: >-
      Developer signal helps validate docs quality, support burden, and the repeatability of self-serve integration
      motions for APIs and SDKs.
    diligencePath: >-
      Request documentation analytics, API usage cohorts, SDK integration funnel metrics, and any public developer
      support or changelog surfaces.
    relatedQuestionRefs:
      - QE016
      - QE025
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: full-customer-roster
    missingEvidence: >-
      A current product-line roster of direct paying customers, separated from indirect advertisers using retailer or
      streaming networks.
    whyItMatters: >-
      The public file shows strong flagship proof but does not reveal whether Moloco's direct payer base is broad or
      concentrated.
    diligencePath: >-
      Request customer counts by product line, top 20 direct accounts, and a split between direct customers and
      advertisers served through customer networks.
    relatedQuestionRefs:
      - QU001
      - QU003
      - QU023
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewals
    missingEvidence: NRR, GRR, churn, contract length, renewal timing, and expansion rates by product line.
    whyItMatters: >-
      Without retention and renewal data, it is impossible to distinguish a strong case-study engine from a durable
      recurring-revenue base.
    diligencePath: >-
      Request historical retention cohorts, renewal schedules for infrastructure customers, and spend-retention curves
      for DSP advertisers.
    relatedQuestionRefs:
      - QU017
      - QU018
      - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, top-10 account concentration, and indirect-vs-direct revenue mix.
    whyItMatters: >-
      Flagship references such as Costco and JioCinema could overstate diversification if a small number of customers
      drive a large share of revenue or proof quality.
    diligencePath: >-
      Request top-10 customer concentration, product-line ARR mix, and dependence on any single retailer, media owner,
      or advertiser cohort.
    relatedQuestionRefs:
