  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: product-line-financial-mix
    missingEvidence: Current 2026 revenue mix, gross margins, and growth rates by Ads, Commerce Media, Streaming Monetization, and CTV.
    whyItMatters: Without product-line economics, investors cannot tell whether Moloco's new surfaces are scaling profitably or simply broadening narrative scope.
    diligencePath: Request a current board-style KPI deck with product-line revenue, contribution margin, growth, and customer-count splits.
    relatedQuestionRefs:
    - QR024
    - QR025
    - QR026
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-rollout-maturity
    missingEvidence: Top-account revenue concentration, direct-versus-indirect revenue split, and launched-versus-contracted flagship deployments.
    whyItMatters: Flagship references such as Costco and JioCinema can overstate diversification if they represent outsized proof value or revenue share.
    diligencePath: Request top-10 customer concentration, reference-account ARR, renewal timing, and pipeline conversion from beta to scaled deployment.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR015
    - QR025
    - QR026
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: incident-history-and-slas
    missingEvidence: Public or private incident history, uptime performance, status-page history, and standard SLA remedies.
    whyItMatters: At Moloco's disclosed scale, reliability lapses can transmit quickly into customer budgets and valuation, so investors need more than certifications.
    diligencePath: Request historical uptime reports, postmortems, standard SLA language, and escalation procedures for flagship customers.
    relatedQuestionRefs:
    - QR011
    - QR022
    - QR031
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: dpas-and-regulatory-history
    missingEvidence: Standard DPAs, customer indemnity / limitation terms, and any regulator inquiries, audits, or enforcement correspondence.
    whyItMatters: Privacy and platform risk is underwritable only if the company can show how it contracts, responds, and governs under real pressure.
    diligencePath: Request standard MSA/DPA schedules plus legal letters describing open, closed, or historical regulatory matters by jurisdiction.
    relatedQuestionRefs:
    - QR009
    - QR027
    - QR032
    relatedTableRefs:
    - TR001
