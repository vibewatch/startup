- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / platform-policy breakage
    - Platform rejection, ATT-related performance collapse, or mandatory remediation tied to Moloco-enabled apps
    - Any material Apple or Google policy event that forces product redesign or cuts attributable performance for two consecutive quarters
    - Pause underwriting until management shows customer-level remediation and spend-retention evidence.
  - - Cloud / latency dependency
    - Serving-capacity or latency deterioration at large customers
    - Loss of low-latency edge, visible uptime incidents, or customer evidence that campaign economics weakened after architecture changes
    - Treat as thesis-break if reliability no longer looks like a moat but a fragility.
  - - Flagship-account execution
    - Costco rollout stalls or JioCinema-scale proofs fail to repeat elsewhere
    - Flagship accounts remain beta-like, fail to expand, or cannot be translated into broader direct-customer wins
    - Discount customer-proof quality and require stronger diversification evidence before moving valuation higher.
  - - Competitive pressure and market fragmentation
    - Peer performance improves while Moloco cannot show durable differentiation outside selected case studies
    - AppLovin / DoubleVerify / Criteo style public benchmarks stay strong while Moloco cannot show equivalent private KPIs
    - Lower conviction and demand more product-line ROI evidence or customer references.
  - - Financial and concentration opacity
    - Management cannot provide current revenue mix, top-account concentration, or direct-vs-indirect split in diligence
    - No credible 2026 data room for product-line growth, margins, and account concentration
    - Treat as a hard diligence blocker for any conviction-level recommendation.
  - - Contract and governance opacity
    - No DPA, SLA, or standard customer agreement visibility
    - Inability to review core legal terms before investment decision
    - Keep recommendation at research-more / track until legal diligence closes the gap.
  notes: The thresholds are intentionally monitorable rather than narrative. A Moloco thesis should break on evidence of worsening unmitigated dependency or on refusal to disclose the data needed to monitor it.
