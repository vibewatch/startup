  - - Trust and privacy posture
    - Platform rules change faster than vendor messaging
    - medium
    - Compliance adaptation affects every performance platform
    - Review incident history and release responsiveness to policy changes
  notes: Competitive durability is best tested with retention and win-rate evidence; public materials mostly show positioning rather than durable switching-cost proof.
