chapter:
  number: 3
  title: Competitors
  summary: Moloco faces real competition from both scaled incumbents and sharper specialists. Amazon, Google, and The Trade Desk own broader media-buying systems or privileged data and supply, while Criteo, Skai, Topsort, AppLovin, Unity, InMobi, and PubMatic attack narrower slices that overlap with Moloco’s product lines. The result is a company with credible differentiation around applied ML and open-internet performance, but not one operating in an empty field.
sections:
- id: landscape-and-peer-set
  title: Landscape and peer-set framing
  body: 'Moloco competes on several fronts at once, which makes the landscape more complicated than a single peer table. In app growth it runs into AppLovin, Unity, InMobi, Amazon, Google, and broader DSPs that can absorb performance budgets. In retail media it overlaps with Criteo, Skai, and Topsort while also competing indirectly with retailer in-house builds. In streaming and publisher tooling it faces both demand-side platforms and supply-path or monetization products that promise better control, transparency, or direct demand.


    That matters because buyers compare Moloco against different alternative sets depending on workflow. The relevant underwriting question is not whether Moloco has competitors; it clearly does. The question is whether its shared ML layer produces enough performance and operational leverage to overcome rival data ownership, distribution power, or workflow lock-in. The answer is likely segment-specific rather than universal, which is why peer analysis should be done by workflow and not only by company size.'
