  topStrengths:
    - Public materials support a rare private-adtech combination of scale, >$200M revenue, and multi-year profitability.
    - Product breadth spans app-growth DSP, retail media, streaming monetization, and publisher monetization.
    - >-
      Google Cloud corroborates meaningful technical scale, including 35,000+ advertisers and roughly 600B daily bid
      requests.
    - Public customer proof spans gaming, retail, marketplaces, finance, travel, and streaming use cases.
  topRisks:
    - Current revenue, margin, retention, and customer-concentration detail remain materially undisclosed.
    - >-
      Apple, Google, GDPR, and related privacy-policy changes can weaken targeting, attribution, and campaign
      measurability.
    - Flagship commerce-media proof is valuable but still early, with Costco explicitly described as a beta rollout.
    - Dependence on Google Cloud for scale and performance creates operational and economic sensitivity.
    - >-
      External valuation trackers and IPO-preparation coverage conflict with or sit below the quality of official
      company disclosures.
  unresolvedGaps:
    - Current 2026 revenue, segment mix, gross margin, and cash-flow detail.
    - Net revenue retention, churn, renewal rates, average contract length, and top-customer concentration.
    - Current cap-table ownership, secondary-transfer terms, and any post-2023 primary financing.
    - Official IPO-readiness evidence such as an S-1, audited statements, or primary-source underwriter confirmation.
