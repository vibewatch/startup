artifact: customers
slug: moloco
runDate: "2026-07-02"
company:
  name: Moloco
chapter:
  number: 6
  title: Customers
  summary: >
    Moloco's customer story is strongest where public sources show concrete outcomes across multiple product lines:
    Google Cloud says its retail-media platform supports more than 35,000 advertisers, JioCinema says Moloco served
    ads to 32 million concurrent viewers during Tata IPL 2023, Costco independently confirmed a beta rollout for
    Moloco-powered onsite ads, and case studies for ShopBack, Scopely, Bucketplace, Musinsa, Karrot, and Nexon
    disclose measurable campaign or monetization gains. The main underwriting gap is not whether Moloco has real
    customers, but how durable and concentrated that revenue is, because most quantified proofs are still
    Moloco-authored and public sources do not disclose NRR, churn, contract length, or top-customer exposure.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation by Product Line
    body: |
      Moloco does not sell one monolithic advertising product to one buyer. Public materials show three distinct customer groups. Moloco Ads is aimed at app marketers and performance teams that want user acquisition and re-engagement across the independent app ecosystem. Moloco Commerce Media is aimed at retailers and marketplaces that want to turn first-party shopper data and digital storefront inventory into an ads business. Moloco Streaming Monetization is aimed at streaming platforms and media owners that want to grow advertiser demand and improve monetization with better ad serving and optimization. That three-way segmentation matters because the buyer, user, and payer differ by product: an app marketer spends media budget on Moloco Ads, a retailer or marketplace operator buys Commerce Media infrastructure while brands use it indirectly, and a streaming platform buys monetization infrastructure while advertisers fund the demand side.

      Public scale markers suggest Moloco has enough breadth to matter in each of those lanes, even though disclosure remains uneven. Moloco says its ads platform reaches more than two billion daily active users and gives advertisers access to millions of independent apps, while its investor update says more than a thousand global advertisers already use the DSP. On the commerce side, Google Cloud says Moloco RMP supports more than 35,000 advertisers globally, and Moloco says the platform can activate more than 10,000 advertisers in a single day. Those metrics do not tell investors how many retailer, marketplace, or media-owner customers pay Moloco directly, but they do show that the company operates at real advertiser and impression scale rather than at pilot-only volume.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU033, CU048]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]

  - id: named-customer-proof-and-deployment-depth
    title: Named Customer Proof and Deployment Depth
    body: |
      Moloco's public proof is deepest in campaign-level and deployment-level case studies rather than in a formal customer roster. On the app-advertising side, ShopBack says Moloco helped it scale SKAN installs 15x while keeping CAC stable, Scopely says Moloco drove more than one million installs in 30 days for Monopoly GO and beat ROAS targets by 2.6x, and Nexon says Moloco's CTV solution improved CPIR by roughly 50% and ROAS by more than 30 percentage points versus other channels. Musinsa and Karrot are especially useful because they show Moloco spanning multiple touchpoints: Musinsa used Moloco Ads plus commerce-media capabilities to turn reactivation into purchase efficiency, while Karrot used streaming ads on TVING plus Moloco retargeting to move users from awareness to chat and listing exploration. Bucketplace adds a retailer monetization proof point with outcome metrics tied to shopper spend, merchant GMV, and merchant ad adoption.

      The most persuasive independent or quasi-independent corroboration sits in Costco and JioCinema. Progressive Grocer, Adweek, and The Drum all reported Costco's decision to use Moloco for AI-powered onsite ads and digital endcaps, and those reports make clear that the rollout began as a beta rather than as a fully mature deployment. Viacom18's JioCinema quote is even stronger on production scale: Moloco-supported ad serving handled targeted ads for 32 million concurrent viewers during Tata IPL 2023, and the relationship is explicitly described as multi-year. Fanatics is a lighter but still useful new proof for Performance CTV, because the quote shows live advertiser adoption even though the public release does not provide the same quantitative depth seen in ShopBack or Scopely. Overall, Moloco has real named customer proof across app growth, retail media, and streaming, but proof quality varies materially by account.
    claimRefs: [CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU023, CU024, CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU034, CU035, CU042, CU045]
    tableRefs: [TU003, TU006]
    figureRefs: [FU002]

  - id: adoption-durability-and-review-proxies
    title: Adoption, Durability, and Review Proxies
    body: |
      Because Moloco does not publicly disclose classic SaaS retention metrics, customer quality has to be inferred from second-order signals. Several are meaningful. Google Cloud's case study says Moloco RMP supports more than 35,000 advertisers globally, Moloco's investor update says more than a thousand global advertisers use the DSP, and Moloco's own product materials say the ads platform reaches more than two billion daily active users. Those are not direct revenue-retention metrics, but they do suggest that Moloco is operating at significant scale with a customer base that is broader than a handful of design partners. The clearest durability signal is Viacom18's explicit multi-year partnership language, which is stronger than the usual campaign-case-study format because it implies continuing operational dependence rather than a one-off test.

      Third-party ranking and review surfaces also help, though they should be interpreted carefully. AppsFlyer says its 2025 Performance Index analyzed 16.2 billion installs across 39,000 apps and 88 media sources, and Moloco's own recap says it ranked fifth overall in that edition. Singular's 2026 ROI Index and Moloco's summary of that report provide a similar signal that Moloco continues to show up across many leaderboard categories outside walled gardens. Gartner also hosted a Moloco retail-media vendor review page in 2026, which at minimum indicates that the product has enough market presence to generate external end-user review infrastructure. None of those signals substitute for NRR, churn, or renewal cohorts, but together they support the view that Moloco's products are used repeatedly enough to show up in ecosystem rankings, review surfaces, and multi-market case studies.
    claimRefs: [CU007, CU008, CU018, CU019, CU027, CU036, CU037, CU038, CU039, CU040, CU047, CU048, CU049]
    tableRefs: [TU004]
    figureRefs: [FU003]

  - id: concentration-risk-and-diligence-gaps
    title: Expansion, Concentration Risk, and Diligence Gaps
    body: |
      The biggest weakness in Moloco's customer chapter is not logo scarcity; it is missing economics. Public evidence does not disclose NRR, GRR, gross churn, net churn, average contract length, average spend per advertiser, top-customer revenue share, or product-line concentration. That omission matters because Moloco's strongest public reference accounts are also marquee accounts: Costco for commerce media, JioCinema for streaming, and high-profile game and app marketers such as Scopely, ShopBack, and Fanatics for performance advertising. Those examples validate capability, but they can still overstate diversification if a small number of flagship accounts or large advertisers drive a disproportionate share of revenue or product credibility.

      The most useful adverse source in the file is The Drum's Costco article. It argues that retail media needs Costco more than Costco needs retail media and quotes Costco as saying retail media should improve customer experience rather than simply extract revenue. That is an important warning for Moloco because it suggests the company must earn expansion by proving relevance and shopper utility, not just by increasing ad load. It also highlights why beta-stage wins should not be over-interpreted. In practical diligence terms, investors still need customer counts by direct payer, top-10 revenue concentration, contract length and renewal data for infrastructure customers, spend-retention cohorts for DSP advertisers, and customer-issued case studies that verify ROI from the buyer side rather than only from Moloco's own marketing stack.
    claimRefs: [CU020, CU021, CU022, CU041, CU042, CU043, CU044, CU045, CU046, CU047, CU049]
    tableRefs: [TU005]

