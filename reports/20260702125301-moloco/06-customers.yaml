  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: full-customer-roster
      missingEvidence: "A current product-line roster of direct paying customers, separated from indirect advertisers using retailer or streaming networks."
      whyItMatters: "The public file shows strong flagship proof but does not reveal whether Moloco's direct payer base is broad or concentrated."
      diligencePath: "Request customer counts by product line, top 20 direct accounts, and a split between direct customers and advertisers served through customer networks."
      relatedQuestionRefs: [QU001, QU003, QU023]
      relatedTableRefs: [TU003]

    - type: private-evidence-only
      severity: material
      topic: retention-and-renewals
      missingEvidence: "NRR, GRR, churn, contract length, renewal timing, and expansion rates by product line."
      whyItMatters: "Without retention and renewal data, it is impossible to distinguish a strong case-study engine from a durable recurring-revenue base."
      diligencePath: "Request historical retention cohorts, renewal schedules for infrastructure customers, and spend-retention curves for DSP advertisers."
      relatedQuestionRefs: [QU017, QU018, QU025]

    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: "Top-customer revenue share, top-10 account concentration, and indirect-vs-direct revenue mix."
      whyItMatters: "Flagship references such as Costco and JioCinema could overstate diversification if a small number of customers drive a large share of revenue or proof quality."
      diligencePath: "Request top-10 customer concentration, product-line ARR mix, and dependence on any single retailer, media owner, or advertiser cohort."
      relatedQuestionRefs: [QU023, QU025]
      relatedTableRefs: [TU005]

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-table
      missingEvidence: "A fuller named customer roster for each product line and more customer-issued references outside Moloco-authored case studies."
      whyItMatters: "The named customer proof table is representative rather than exhaustive, so it should not be mistaken for the complete Moloco customer book."
      diligencePath: "Ask management for the top current reference accounts by product, plus customer references willing to confirm deployment maturity and renewal history."
      relatedQuestionRefs: [QU003, QU007, QU008, QU019]
      relatedTableRefs: [TU003]
