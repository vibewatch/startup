figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: "Across all three product lines, Moloco appears to land customers by pairing first-party data access with measurable outcome optimization, then tries to expand into more surfaces and budgets."
    data:
      items:
        - id: stage-pain
          label: Pain point
          actor: "App marketer, retailer, or streaming operator"
          description: "Customer starts with a monetization or growth problem such as expensive user acquisition, weak onsite ad relevance, or fragmented streaming demand."
          channels:
            - "High CAC / limited incrementality"
            - "Low onsite ad relevance"
            - "Weak advertiser demand"
        - id: stage-integration
          label: Data integration
          actor: "Growth or monetization team"
          description: "Moloco connects first-party signals such as app events, shopper behavior, catalog context, or viewing data to its machine-learning stack."
          channels:
            - "App event data"
            - "Shopper / catalog data"
            - "Streaming audience data"
        - id: stage-live-campaign
          label: Live campaign or ad serving
          actor: "Operational user"
          description: "The product moves from setup into live bidding, ad serving, or re-engagement execution across mobile apps, storefronts, or streaming inventory."
          channels:
            - "Moloco Ads"
            - "Commerce Media"
            - "Streaming Monetization"
        - id: stage-measured-lift
          label: Measured lift
          actor: "Customer decision maker"
          description: "Public case studies emphasize visible ROI metrics such as installs, ROAS, GMV, audience reach, or concurrent ad-serving stability."
          channels:
            - "15x installs"
            - "3x ad revenue / 2x GMV"
            - "32M concurrent viewers"
        - id: stage-expansion
          label: Expansion / renewal
          actor: "Budget owner"
          description: "The intended endpoint is more surfaces, more markets, more ad load, or longer-term contracts, but public renewal economics are disclosed only rarely."
          channels:
            - "Multi-market expansion"
            - "Broader availability"
            - "Multi-year partnership"
    approximationNotes: "The path is qualitative because Moloco does not publish standardized cohort or contract-stage data across product lines."
    claimRefs: [CU001, CU002, CU003, CU004, CU013, CU017, CU021, CU024, CU028, CU047]

  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: "Named customer proof repeatedly follows the same sequence: first-party signal ingestion, ML optimization, measurable outcome, then a claim of broader scale or expansion."
    data:
      nodes:
        - id: n1
          label: Initial customer need
          detail: "Growth efficiency, new ad revenue, or live-stream monetization problem."
        - id: n2
          label: First-party signal onboarding
          detail: "App events, shopper data, catalog context, or streaming demand signals are integrated."
        - id: n3
          label: ML optimization in production
          detail: "Moloco runs bidding, personalization, targeting, or ad serving against outcome goals."
        - id: n4
          label: Publicly disclosed result
          detail: "Case studies cite installs, ROAS, GMV, video completion, CPA, or concurrent-viewer scale."
        - id: n5
          label: Budget / surface expansion
          detail: "Customer expands into more markets, more channels, more placements, or longer partnership scope."
      edges:
        - from: n1
          to: n2
          label: data access
        - from: n2
          to: n3
          label: model training
        - from: n3
          to: n4
          label: measured outcome
        - from: n4
          to: n5
          label: proof of value
    claimRefs: [CU012, CU015, CU017, CU019, CU024, CU026, CU028, CU031, CU034]

  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: "Public proof is strongest on outcome specificity and weakest on retention visibility, with independent corroboration concentrated in only a few flagship accounts."
    data:
      columns:
        - Outcome specificity
        - Independent corroboration
        - Durability visibility
        - Concentration visibility
      rows:
        - label: Moloco Ads
          values:
            - "High — ShopBack, Scopely, Nexon, and Fanatics show concrete campaign outcomes."
            - "Low-medium — most proofs are Moloco-authored, even when the customer is named."
            - "Low — no public renewal, NRR, or contract-length data."
            - "Low — no spend concentration by advertiser is disclosed."
        - label: Commerce Media
          values:
            - "High — Bucketplace and Musinsa are quantified, and Costco confirms rollout specifics."
            - "Medium-high — Costco is independently corroborated by multiple outlets and Google Cloud validates advertiser scale."
            - "Low-medium — Costco is still in beta and broader customer renewals are not public."
            - "Low — retailer count, ARR mix, and top-network exposure are undisclosed."
        - label: Streaming Monetization
          values:
            - "Medium-high — JioCinema and Karrot disclose concrete operating or campaign outcomes."
            - "Medium — JioCinema includes a customer quote, but the broader roster is thin."
            - "Medium — Viacom18 is explicitly multi-year, which is better than most public proofs."
            - "Low — no revenue share, minimum commitment, or platform mix is disclosed."
        - label: Partner / infrastructure channel
          values:
            - "Medium — Topsort and Google Cloud show ecosystem reach more than direct end-user ROI."
            - "High — partner-side sources are independent of Moloco's own case-study hub."
            - "Low — indirect-channel renewal and economics are not disclosed."
            - "Low — direct vs. indirect customer concentration remains opaque."
    claimRefs: [CU008, CU020, CU027, CU033, CU034, CU035, CU041, CU042, CU043, CU044, CU049]

