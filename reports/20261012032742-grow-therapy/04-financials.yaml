callouts:
  - calloutType: "insight"
    title: "Transaction Take-Rate Alignment with In-Network Healthcare"
    body: "Grow Therapy's monetization relies on session-based transaction take rates rather than subscription billing. By monetizing only when clinical care is successfully delivered and reimbursed by payers, Grow removes upfront friction for clinicians and recurring costs for patients, aligning revenue growth with visit volume."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI005"
  - calloutType: "risk"
    title: "Opacity of GAAP Margins and Working Capital Clawback Exposure"
    body: "While Grow Therapy scaled to an annualized revenue run rate of approximately $1 billion in 2025 across seven million visits, the company does not disclose GAAP net margins, clinician take rates, or cash burn. Underwriters face unverified unit profitability and balance sheet exposure from guaranteeing weekly clinician payouts while absorbing payer clawback risks."
