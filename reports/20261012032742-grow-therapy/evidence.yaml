evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements reconciling reported $1 billion annual revenue run-rate to GAAP net revenue, cost of
      care delivery, and net operating income.
    whyItMatters: >-
      Gross booking volume significantly diverges from net commission revenue in healthcare marketplaces, obscuring
      underlying unit economics and cash burn.
    diligencePath: >-
      Request GAAP audited financial statements, provider pay-out schedules, and management EBITDA reconciliations under
      NDA.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: >-
      Complete capitalization table, share class breakdown, and detailed investor syndicate holdings for Series A
      through Series D rounds.
    whyItMatters: >-
      Without a full cap table, liquidation seniority, voting control between founders and lead investors (TCV, Goldman
      Sachs), and dilution cannot be fully evaluated.
    diligencePath: Request the latest post-Series D capitalization table and investor rights agreement from company legal counsel.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: payer-concentration-and-reimbursement-terms
    missingEvidence: >-
      Contractual fee-schedule splits, at-risk performance incentives, renewal terms, and revenue concentration across
      top commercial payers (e.g. Aetna, UnitedHealthcare, Cigna) remain undisclosed private data.
    whyItMatters: >-
      Without payer-specific reimbursement terms and provider churn metrics, valuation models cannot determine margin
      vulnerability to insurer rate cuts or clinician disintermediation.
    diligencePath: >-
      Request audited GAAP revenue reconciliation, payer-level revenue concentration schedules, and longitudinal 1099
      clinician cohort retention data during confirmatory diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: clinician-churn-and-multihoming
    missingEvidence: >-
      Audited cohort-level clinician retention data, longitudinal provider churn figures, and multi-homing overlap
      statistics across Grow Therapy, Headway, and Alma.
    whyItMatters: >-
      Because independent mental health providers operate as non-exclusive contractors without upfront platform fees,
      high clinician multi-homing and churn could erode Grow Therapy network liquidity and drive up provider acquisition
      costs.
    diligencePath: >-
      Request anonymized provider cohort retention data by sign-up vintage and conduct direct mystery-shopping audits
      across competing network directories to measure clinician cross-listing rates.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: profitability-transparency
    missingEvidence: >-
      Audited financial statements reconciling gross patient and payer billings to GAAP net revenue, clinician cost of
      goods sold, and operating income.
    whyItMatters: >-
      Without GAAP gross margins and take-rate disclosures, underwriting cannot confirm whether the $1 billion revenue
      run-rate translates into viable unit gross profit.
    diligencePath: Request confidential historical income statements and auditor reports under NDA during formal underwriting.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Data on clinician session retention, average clinician monthly churn rate, and patient episode completion rates.
    whyItMatters: >-
      Clinician acquisition cost and payback periods depend on multi-year clinician retention on the platform, which is
      currently undisclosed.
    diligencePath: Request provider cohort retention curves and net revenue retention by provider vintage during management meetings.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: clinical-outcome-validation
    missingEvidence: >-
      Independent, peer-reviewed clinical outcome studies or audited health plan claims data validating Grow Therapy's
      80% 30-day symptom improvement rate across diverse patient cohorts.
    whyItMatters: >-
      Enterprise health plans and self-insured employers increasingly require validated clinical quality and ROI metrics
      before expanding in-network behavioral health partnerships.
    diligencePath: >-
      Request formal outcome registry data, third-party actuarial validation reports, and IRB-approved study
      publications from management.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: minor
    topic: ehr-interoperability-standards
    missingEvidence: >-
      Technical documentation on FHIR/HL7 API interfaces, uptime SLA metrics, and native EHR interoperability
      specifications with major hospital systems like Epic or Cerner.
    whyItMatters: >-
      Deeper health system integration depends on automated bi-directional data flow rather than portal-based or manual
      referral coordination.
    diligencePath: Review API documentation, architecture whitepapers, and integration case studies under technical diligence NDA.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Independent longitudinal cohort retention rates, patient drop-off curves, and provider churn percentages across
      commercial versus Medicaid populations.
    whyItMatters: >-
      Without cohort retention and provider churn data, long-term customer lifetime value and network stability cannot
      be audited independently.
    diligencePath: >-
      Request audited cohort retention schedules, provider attrition rates by tenure, and payer-specific active member
      renewal data during management diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-enterprise-deployments
    missingEvidence: >-
      Comprehensive roster of named employer and health plan enterprise contract values, minimum volume commitments, and
      specific clinical utilization rates.
    whyItMatters: >-
      Public disclosure provides named carrier and employer partners but omits contract terms, revenue concentration,
      and renewal metrics.
    diligencePath: Examine customer contract schedules and top-ten customer revenue concentration tables under non-disclosure review.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: payer-audit-clawback-loss-rates
    missingEvidence: >-
      Detailed historical data on commercial payer audit clawback frequencies, recoupment dollar amounts, and net
      provisions absorbed by Grow Therapy.
    whyItMatters: >-
      Grow Therapy offers clawback protection to clinicians, meaning platform gross margin and working capital absorb
      unforeseen retroactive recoupments.
    diligencePath: >-
      Request audited revenue reconciliation schedules showing reserve provisions for payer audit recoupments and
      historical clawback settlement rates.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
      - TR002
  - type: enumeration-incomplete
    severity: material
    topic: state-by-state-payer-panel-availability
    missingEvidence: >-
      Comprehensive census of open versus closed payer panels by state and managed care organization across Grow
      Therapy's 50-state coverage footprint.
    whyItMatters: >-
      Panel closures by major commercial insurers directly limit clinician onboarding velocity, provider earnings
      potential, and marketplace referral liquidity.
    diligencePath: >-
      Review internal platform network operations dashboards tracking panel credentialing bottlenecks and payer
      admission freezes by state.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Audited Series D term sheet detailing liquidation preference multiples, seniority rankings, participation rights,
      and secondary transaction share volumes.
    whyItMatters: >-
      Preference overhang could subordinate junior equity or common shareholders in an exit below the $3B post-money
      valuation threshold.
    diligencePath: >-
      Review capitalization table, investor rights agreements, and certificate of incorporation amendments filed with
      Delaware state registry.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: financial-reconciliation
    missingEvidence: >-
      Audited GAAP financial statements reconciling reported ~$1B revenue between gross therapy billings and net
      platform take-rate, along with gross margin and cash burn.
    whyItMatters: >-
      A 3.0x valuation multiple on net software/service revenue is attractive, but a 3.0x multiple on gross pass-through
      medical billings with thin margins would represent significant overvaluation.
    diligencePath: >-
      Request audited income statements, provider fee schedule schedules, and cash flow statements during confirmatory
      management diligence.
