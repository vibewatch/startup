callouts:
  - calloutType: "insight"
    title: "Reimbursement-Driven Affordability Unlocks Latent Demand"
    body: "By operating on an in-network insurance model rather than a direct consumer subscription, Grow Therapy lowers the average out-of-pocket patient session cost to approximately $21, with one in three patients paying $0. This directly addresses Gallup's finding that affordability is the primary barrier preventing 52% of Americans from receiving mental health treatment."
    claimRefs:
      - "CM008"
      - "CM013"
  - calloutType: "risk"
    title: "Provider Panel Retention and Commercial Payer Concentration"
    body: "Because therapists join Grow as independent 1099 contractors whose credentials remain tied to the platform's contracts, clinicians who desire long-term panel ownership or direct payer negotiations face switching disincentives. Furthermore, platform revenues remain dependent on commercial reimbursement fee schedules that are vulnerable to payer audit clawbacks or margin compression."
    claimRefs:
      - "CM003"
      - "CM014"
