  topStrengths:
    - 广泛的支付方接入和覆盖多个州的医疗服务提供者，带来了可观的分销广度。
    - 面向临床医生的运营系统和 AI 文档工具，解决了独立医疗服务提供者的真实行政负担。
    - 收入增长和融资势头表明商业化采用度强劲。
  topRisks:
    - 公开来源仍无法将据报达到 $1B 的年化收入规模与 GAAP 净收入或盈利能力勾稽起来。
    - 临床医生相对容易更换平台，多平台使用和竞争对手压力可能削弱定价能力。
    - 支付方报销、追索以及合规风险敞口仍是核心运营风险。
  unresolvedGaps:
    - 公开来源无法将据报约 $1B 的收入数字与 GAAP 净收入、毛利或现金创造能力勾稽起来。
    - 支付方集中度、收费表、续约率及报销趋势数据仍未披露。
    - 提供者流失、患者留存及雇主渠道续约数据披露仍不充分。
    - D 轮条款、任何老股转让成分及优先股清算细节均未公开披露。
    - 关于安全控制、AI 笔记验证结果及董事会层面治理的独立证据仍然有限。
