      - number: '5.2'
        title: 临床医生操作系统与 AI 工具
        blocks:
          - type: paragraph
            body: >-
              平台的运营核心是临床医生执业软件，旨在缓解制约独立提供方供给的行政负担。传统独立执业的心理健康从业者每周要花费大量无偿时间处理保险资质认证、提交纸质理赔和编写会谈后文档；Grow
              提供开箱即用的执业工作区，将排班、基于 WebRTC 的安全远程医疗、客户消息和自动保险理赔提交打包在一起。临床医生每周及时收款，Grow 则以估计 10% 至 15%
              的已收报销分成承担支付方追偿风险。核心竞争资产是内嵌的环境式 AI 记录助手，并在战略收购 Tenor Therapy
              后显著增强：经治疗师和客户双方同意，该工具在后台转录会谈音频，并按标准病程格式起草结构化临床记录。公司内部数据称，这一环境式文档工作流可将治疗师制表时间削减近
              70%，释放临床接诊容量，并配合会谈间患者日记和情绪打卡模块形成持续互动闭环。
