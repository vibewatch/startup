    title: 推荐逻辑
    type: flow
    summary: 这条逻辑链从 Grow Therapy 的运营规模、AI 临床验证、主要尽调风险和估值倍数出发，最终指向“继续研究”的建议。
    data:
      nodes:
        - id: scale
          label: 运营规模
          detail: 2025 年服务 7M 次，拥有 26k+ 名服务提供者和 125+ 家支付方，覆盖 220M 人
        - id: proof
          label: 临床与 AI 验证
          detail: 文档记录时间节省 70%，30 天症状改善率 80%
        - id: revenue
          label: 已披露收入
          detail: 顶线收入运行率约 $1B，截至 2024 年的 3 年 CAGR 为 455.6%
        - id: uncertainty
          label: 财务不透明
          detail: GAAP 口径净收入、毛利率和经营现金消耗均未披露
        - id: competition
          label: 市场整合
          detail: Spring Health 与 Alma 合并后，形成覆盖 170M 人、规模达 $6-7B 的竞争对手
        - id: valuation
          label: 估值基准
          detail: $3B 的 D 轮融资对应表面收入倍数 3.0x；若毛利保持，这一估值尚属合理
        - id: decision
          label: 推荐结论
          detail: 仍需取得 GAAP 口径毛利并完成支付方合同审计，暂建议继续研究
      edges:
        - from: scale
          to: proof
        - from: proof
          to: revenue
        - from: revenue
          to: uncertainty
        - from: uncertainty
          to: competition
        - from: competition
          to: valuation
        - from: valuation
          to: decision
