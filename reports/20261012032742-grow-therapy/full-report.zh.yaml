        title: 单位经济性与提供方成本结构
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 围绕独立 1099 临床医生构建提供方网络，医生保持临床自主权，自行安排日程并设定理想病例量。为在竞争激烈的行为健康市场吸引并留住临床医生，Grow
              承担行政负担，提供免费的资质认证、电子病历、自动排班和计费基础设施。平台对临床医生的核心财务价值主张是有保障的每周按次结算报酬，使执业者免受保险追偿、计费拒付和漫长支付方回款周期影响。Grow
              从向支付方收取的保险报销总额与发放给临床医生的净结算额之间赚取价差；但这种结构也使公司暴露于营运资金摩擦和报销账期滞后，因为 Grow 每周向医生付款，而商业支付方通常需要 30 至 90 天裁定理赔。此外，由于
              Grow 未公开披露合同约定的临床医生分成比例、GAAP 毛利率或获客成本，其单位经济性的持久性仍是核心投资判断问题。
