      - number: '1.2'
        title: 创始人、高管团队与运营治理
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 由 Duke University 校友 Jake Cooper、Manoj Kanagaraj 和 Alan Ni
              共同创办，三人于新冠疫情期间发现保险覆盖的行为医疗供给短缺并构想了这项业务。首席执行官 Jake Cooper 曾在 Blackstone 和 Apollo Global Management
              从事私募股权投资，将机构金融严谨性引入医疗报销流程；首席战略官 Manoj Kanagaraj 负责企业健康计划谈判、风险分担协议和医疗系统转诊整合；首席技术官 Alan Ni
              负责技术架构、计费基础设施和面向临床医生的软件工程。公司治理对三位联合创始人存在集中的关键人依赖，三人持续掌管核心资本配置、技术设计和支付方关系。2025 年 11 月，管理层在纽约市百老汇 100 号签署
              19,000 平方英尺总部租约，并获得最高 $1.8M 的绩效型 Excelsior Jobs Program 税收抵免，以在五年内新增至少 186 个工程、营销和运营全职岗位。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
