              Grow Therapy 展现出强劲的顶线扩张，收入从 2021 年的 $3.6M 增长至 2024 年的 $617.4M（获得 Financial Times 认可的 455.6% 复合年增长率），随后在
              2025 年七百万次促成就诊基础上报告约 $1B 的年化收入运行率。快速的商业采用支撑公司在 2026 年 3 月以 $3B 估值完成由 TCV 和 Goldman Sachs 领投的 $150M Series
              D 融资，累计股权及债务融资达到 $328M。充足的股权缓冲为技术投入和支付方扩张提供了多年运营续航。不过，公司近期在 20
              个市场启动全国电视与流媒体品牌广告活动，表明获客动力正从提供方主导的自然转诊转向资本密集度更高的消费者获取。由于 Grow 对 GAAP
