      - number: '3.6'
        title: 切换成本、多平台执业与长期护城河持久性
        blocks:
          - type: paragraph
            body: >-
              尽管网络扩张迅速，Grow Therapy 的长期防御力仍面临临床医生多平台执业和低切换成本带来的结构性风险。独立临床医生作为非排他性承包商运营，不支付前期平台费，常同时在 Grow Therapy 和
              Headway 上维护活跃资料。由于客户记录和支付方资质可在不同平台间复制，哪家中介提供更高的单次报销分成或更快的转诊速度，临床医生就容易把就诊量转向哪家。此外，以 Spring Health 收购 Alma
              为代表的企业整合，可能将参保雇主业务导入自有提供方面板；除非 Grow Therapy 成功扩大直接雇主合作，否则定价权将受到限制。
