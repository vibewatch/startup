      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 估值 / 回报逻辑
      - 主要下行 / 风险触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 企业雇主合同推动净抽成率扩大；AI 工具提升临床医生生产率；ARR 达到 $1.5B 以上
        - 估值扩大至 $5.0B-$6.0B（净收入的 3.5 倍至 4.0 倍）；18–24 个月内走向公开 IPO
        - 支付方反对费率表；数字医疗公开市场倍数压缩
        - 25%
      - - 基准情景
        - 收入同比增长 20%–30%；提供方网络稳定在 28,000；实现温和的经营盈利
        - 估值维持在 $3.0B-$3.5B（收入的 2.5 倍至 3.0 倍）；战略退出或推迟后期 IPO
        - 临床医生令平台去中介化；雇主削减 EAP 福利预算
        - 50%
      - - 悲观情景
        - 支付方审计和利润率压缩降低净抽成率；竞争平台之间的提供方流失加剧
        - 估值在下轮融资或结构化资本重组中降至 $1.5B-$1.8B（收入的 1.5 倍）
        - 主要商业支付方网络退出；监管部门针对 AI 记录计费执法
        - 25%
    notes: 情景建模假设过去约 $1B 的表面收入基数及当前私募市场数字医疗倍数。
