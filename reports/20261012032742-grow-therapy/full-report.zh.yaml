          detail: 由自主执业的 1099 临床医生提供 45–60 分钟线上或线下会谈
        - id: documentation
          label: AI 记录生成
          detail: 环境式临床记录在提供方审阅前将记笔记时间削减 70%
        - id: billing
          label: 理赔提交与计费
          detail: Grow 提交标准化保险理赔并收取患者共付额
        - id: reimbursement
          label: 支付方裁定与收款
          detail: Grow 承担支付方追回风险，并收取合同约定的总报销额
        - id: payout
