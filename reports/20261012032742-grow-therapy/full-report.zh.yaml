              - CO009
              - CO010
      - number: '1.3'
        title: 融资历史、估值与投资方阵容
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 自成立以来累计获得约 $328M 风险投资与成长股权融资。早期种子轮和 A 轮投资方包括 SignalFire、SVB、Able Partners 和 Gaingels；2022 年 9
              月，TCV 领投 $75M Series B，Transformation Capital 联合领投。2024 年 4 月，Goldman Sachs Alternatives 旗下 Growth Equity
              领投 Series C，以加速保险网络扩张。2026 年 3 月，公司完成由现有投资方 TCV 和 Goldman Sachs Alternatives 联合领投的 $150M Series D，Menlo
              Ventures、British Columbia Investment Management Corporation（BCI）以及长期股东 Sequoia Capital 参投，巩固了独角兽地位。Series
              D 将 Grow Therapy 的投后股权估值定为 $3B，对应据报 $1B 的年度收入运行率。不过，公开资本结构披露没有说明清算优先权、股息约束，或一级运营资本与早期投资人及创始人二级流动性的比例。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO011
              - CO012
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
