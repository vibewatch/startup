            body: >-
              Grow Therapy 和市场报道均引用截至 2026 年 3 月 $1B 的年度收入运行率及 $3B 的投后估值，但公开披露没有将该数字与 GAAP 净收入或患者就诊总额勾稽。随着 Spring Health
              等竞争对手于 2026 年 5 月收购 Alma 并形成覆盖 1.7 亿人的网络，GAAP 盈利能力、提供方流失和报销利润率缺乏透明度带来尽调风险。
