        title: 展示
        blocks:
          - type: callout
            title: 零费用供给飞轮与支付方网络密度
            body: >-
              Grow Therapy 和 Headway 通过取消治疗师前期平台费，从结构上打破了 Alma 等传统临床医生 SaaS
              模式。两家公司从保险报销中抽取行政分成，而非依赖软件订阅，因此能更快完成提供方入网并聚合供给，吸引头部健康计划。
