      - number: '5.4'
        title: 安全控制、监管合规与疗效证据缺口
        blocks:
          - type: paragraph
            body: >-
              在受保护健康信息（PHI）与临床生成式 AI 交叉领域运营，需要严格的数据隐私和监管合规控制。Grow Therapy
              保持符合《健康保险流通与责任法案》（HIPAA），与临床医生及企业合作伙伴签署商业伙伴协议（BAA），并持有 SOC 2 Type II 认证。为保护 AI 记录工具使用的敏感临床转录内容，公司于 2025
              年末收购数字隐私公司 neosync，整合专用数据掩码与匿名化层，防止未经授权的数据泄露或使用原始治疗会谈训练模型。尽管取得了这些合规里程碑，围绕临床疗效仍存在重大尽调缺口：Grow 公开强调 30
              天内患者症状改善率达 80%、净推荐值（NPS）为 85，但在 Series D
              融资时未发布经审计、同行评审的临床数据集。对于评估长期合同扩大的机构支付方、承担风险的医疗系统和自保企业雇主而言，验证这些自报改善率能否推广到复杂共病精神科人群，仍是关键的投资判断里程碑。
            claimRefs:
              - CE010
              - CE011
              - CE012
