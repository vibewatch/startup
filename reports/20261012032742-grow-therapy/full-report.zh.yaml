        title: 产品定义与双边诊疗工作流
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 提供技术驱动的行为健康平台，以协同双边市场形式运作。需求侧，潜在患者可访问可搜索目录，按临床专科、地理位置、72 小时内可预约情况及 125 个健康计划的网络内保险覆盖，筛选
              26,000 多名独立治疗师和精神科处方医生。平台实时展示平均每次 $21 的共付额估算（约三分之一商业参保患者无需自付），解决传统行为医疗普遍存在的可负担性与导诊障碍。供给侧，Grow 充当独立 1099
              临床医生的全栈虚拟执业操作系统，承担保险资质认证、患者获取、排班、电子病历（EHR）和理赔计费。为突破消费者搜索入口，公司已与 Circle Medical
              等全国性初级保健提供方打通双向转诊通道，通过无缝交接将阳性抑郁筛查转化为实际赴约就诊。
