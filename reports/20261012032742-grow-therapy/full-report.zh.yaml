      - number: '3.5'
        title: 市场定位与结构性防御力
        blocks:
          - type: paragraph
            body: >-
              按保险整合广度与提供方运营自主权评估，行为健康平台处于不同的战略象限。直接面向消费者的平台处于低保险整合层级，容易受到自付预算削减冲击；Talkiatry
              等专业精神科提供方强制网络内保险覆盖，但施加严格临床监管，限制了医生自主权。Grow Therapy 和 Headway 位于右上象限，将广泛保险合同与独立承包商运营灵活性结合起来。Grow Therapy
              通过覆盖 125+ 支付方网络（包括选择性参与 Medicare 和 Medicaid）建立独特广度，既保护就诊量免受单一支付方政策变动冲击，也需要复杂的多支付方计费合规基础设施。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP009
              - CP012
