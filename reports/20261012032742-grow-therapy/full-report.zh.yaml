  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现机制
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy
              运营双边心理健康市场与提供方基础设施平台，从每次完成的治疗和精神科就诊中抽取一定比例的交易分成获得收入。平台不向消费者收取传统远程治疗应用的订阅费，也不收取传统执业管理套件的软件月费，而是让患者使用商业及政府健康计划覆盖的网络内诊疗。Grow
              已与超过 100 家主要保险支付方签约——包括 Medicare、Medicaid、Aetna、Cigna 和 Blue Cross Blue Shield——为数亿受保人群提供网络内覆盖。参保客户平均每次支付约
              $21 的标准共付额，受益于良好的福利设计，约三分之一客户自付为零；对于无保险或网络外个人，临床医生设定的自费价格通常为每次 $75 至 $200。由于 Grow
              按会谈总账单金额抽取比例费用，其商业模式与实际完成的临床业务量及快速理赔裁定直接挂钩，既免受订阅流失影响，也让财务表现高度取决于支付方报销费率。
