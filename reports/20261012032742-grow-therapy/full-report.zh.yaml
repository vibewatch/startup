      - number: '1.4'
        title: 里程碑演进、企业扩张与分析披露
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 的发展轨迹展现出从低保真试验性原型向全国规模化医疗基础设施平台的快速跃迁。公司最初于 2020 年通过定向 Craigslist 广告测试临床医生对外包保险资质认证的接受度，并于
              2021 年 2 月正式启动商业运营。2021 至 2025 年间，平台实现全美 50 个州覆盖，推出将提供方文档时间缩短近 70% 的环境式 AI 临床记录功能，并在 2025 年单年将年度就诊量扩大到 700
              万次。2026 年初，公司从核心直接面向消费者的市场向企业雇主心理健康福利扩展，帮助员工从员工援助计划无缝转入健康计划保障，同时与 Circle Medical
              等临床提供方建立转诊合作。尽管商业势头强劲，分析审视仍指向明显的尽调风险：公开来源无法将据报 $1B 的顶线收入运行率与 GAAP 净收入或经审计营业利润勾稽，而 Spring Health 于 2026 年 5
              月收购同行网络 Alma 后，提供方留存也面临更大竞争压力。
