              由于治疗师以独立承包商身份执业且无需前期资本投入，切换成本天然偏低。提供方常在 Grow、Headway 和 Alma
              之间多平台执业以最大化日程利用率；若竞争对手提供更高的净报销费率或更低的行政摩擦，平台利润率就会面临持续风险。
