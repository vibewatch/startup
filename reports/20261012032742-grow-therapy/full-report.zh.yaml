chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与双边市场模式
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 是一家技术驱动的医疗平台，运营连接独立心理健康提供方、健康保险支付方和寻求行为医疗服务患者的三边市场。公司于 2020
              年成立，总部位于纽约市，消除了长期阻碍持证心理健康专业人员建立可持续医保私人诊所的行政壁垒。Grow Therapy 不向消费者收取订阅费或要求全额自费，而是直接接入全美 50 个州的 125
              多家商业健康计划、Medicare 和 Medicaid 项目。在此运营模式下，参与的治疗师和精神科医生可获得开箱即用的电子病历工具、自动计费、资质认证支持和环境式 AI
              临床记录工具；患者则按签约网络内保险费率获得线下或线上诊疗，平均每次共付额为 $21，三分之一客户无需自付。截至 2026 年 3 月，平台已通过 26,000 名独立提供方组成的网络累计促成 1000
              万次患者就诊。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
              - CO013
