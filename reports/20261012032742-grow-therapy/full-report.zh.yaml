      - CI007
      - CI010
    data:
      nodes:
        - id: booking
          label: 患者会谈预约
          detail: 患者通过目录选择网络内提供方，预计共付额为 $0–$50，平均 $21
        - id: eligibility
          label: 保险资格核验
