        title: 平台架构与企业互操作性
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy 的底层技术架构连接四个独立的运营层面：面向患者的网页和移动端层、临床医生执业 EHR 门户、机器学习临床文档管线，以及企业清算所集成网关。接入层处理保险资格核验和预约路由，通过安全
              API 与覆盖 2.2 亿参保人的商业及政府支付方门户通信。为解决行业长期存在的“EAP 断崖”难题——企业员工用完初期员工援助会谈后失去治疗师连续性——Grow 于 2026
              年初推出专用企业福利产品，采用按使用量计费模式替代固定按人按月收费，使员工能够沿用同一治疗师从企业 EAP 保障无缝过渡到商业健康保险。不过，与外部医疗系统的集成目前仍依赖协调式门户交接，而非完全标准化的双向
              FHIR 或 HL7 接口，这也是平台向复杂医院网络扩展时的技术互操作边界。
