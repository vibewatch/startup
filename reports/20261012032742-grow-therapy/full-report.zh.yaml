      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 密集支付方整合与提供方赋能飞轮
            body: >-
              Grow Therapy 已与覆盖 2.2 亿人的 125 多家健康计划建立商业合同。公司通过消除资质认证、计费和排班中的行政摩擦，并提供环境式 AI 临床记录工具，加快提供方入网，同时将客户平均自付成本降至每次
              $21。
            calloutType: strength
