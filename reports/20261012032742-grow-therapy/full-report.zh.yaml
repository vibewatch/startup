  - id: TV002
    title: 正向论点 / 反方论点表
    columns:
      - 支柱
      - 正向论点
      - 反方论点
      - 改变判断的条件
    rows:
      - - 市场需求
        - 220M+ 承保人群对保险覆盖的心理健康服务存在巨大的未满足需求
        - 支付方报销压缩和费率下调挤压平台净抽成率
        - 多年期商业支付方合同，并保证商业费率表
      - - 提供方护城河
        - 26,000 多名提供方组成的网络借助 AI 工具扩张，记录时间节省 70%
        - 临床医生同时入驻 Headway 和 Alma，独立医生流失仍无对冲
        - 经审计的年度临床医生留存率超过 85%，并设有独家业务量分层
      - - 财务质量
        - 据报道，收入从 2021 年的 $3.6M 增长至约 $1B，CAGR 为 455.6%
        - 会谈收入的高额转付可能掩盖较低的净抽成率和持续经营亏损
        - 经审计的 GAAP 财务报表披露净收入、毛利率和 EBITDA
      - - 竞争地位
        - 与 125 多个健康计划深度整合，形成较高的监管和运营壁垒
        - Spring Health 收购 Alma 后，形成覆盖 1.7 亿人、估值 $6B-$7B 的竞争平台
        - 已证明在雇主赞助及价值型医疗合同中的市场份额增长
    notes: 基于据报道的 2026 年平台里程碑和行业结构性风险，对正反论点进行对照综合。
