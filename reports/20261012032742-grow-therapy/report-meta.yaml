companyProfile:
  summary: >-
    Grow Therapy is a behavioral health marketplace and clinician operating platform that connects insured patients with
    independent therapists and psychiatrists across all 50 states. The company couples a payer-connected booking layer
    with back-office tooling for credentialing, billing, scheduling, and AI documentation, which has helped it scale to
    more than 26,000 clinicians and 125+ health-plan relationships while still leaving revenue quality and profitability
    largely undisclosed.
