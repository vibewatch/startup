        - CO008
  headquarters: New York, New York
  productSummary: >-
    Grow Therapy sells a two-sided behavioral health marketplace plus clinician operating system spanning discovery,
    scheduling, credentialing, claims billing, and ambient AI documentation.
  customerFocus: Insured therapy and psychiatry patients, independent clinicians, and commercial health plans / payors.
  businessModel: >-
    Transaction-based revenue sharing on in-network therapy and psychiatry visits, plus adjacent enterprise and platform
