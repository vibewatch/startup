  topStrengths:
    - Broad payer integration and multi-state provider coverage create meaningful distribution breadth.
    - >-
      The clinician operating system and AI documentation tools address real administrative pain for independent
      providers.
    - Revenue growth and financing momentum show strong commercial adoption.
  topRisks:
    - Public sources still do not reconcile the reported $1B run-rate to GAAP net revenue or profitability.
    - Clinician switching is relatively easy, so multi-homing and competitor pressure can erode pricing leverage.
    - Payer reimbursement, clawback, and compliance exposure remain central operational risks.
  unresolvedGaps:
    - >-
      Public sources do not reconcile the reported ~$1B revenue figure to GAAP net revenue, gross profit, or cash
      generation.
    - Payer concentration, fee schedules, renewal rates, and reimbursement-trend data remain undisclosed.
    - Provider churn, patient retention, and employer-channel renewal data remain insufficiently disclosed.
    - The Series D terms, any secondary component, and preferred liquidation details are not publicly disclosed.
    - >-
      Independent evidence on security controls, AI-note validation outcomes, and board-level governance remains
      limited.
