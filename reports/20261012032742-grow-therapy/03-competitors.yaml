callouts:
  - calloutType: insight
    title: The Zero-Fee Supply Flywheel vs. Payer Network Density
    body: >-
      Grow Therapy and Headway have structurally disrupted legacy clinician SaaS models like Alma by eliminating upfront
      platform fees for therapists. By monetizing administrative take-rates from insurance reimbursements instead of
      software subscriptions, they achieve faster provider onboarding and aggregate supply that attracts flagship health
      plans.
    claimRefs:
      - CP004
      - CP007
      - CP010
  - calloutType: risk
    title: Clinician Multi-Homing Limits Platform Switching Costs
    body: >-
      Because therapists operate as independent contractors with zero upfront capital commitment, switching costs remain
      inherently low. Providers frequently multi-home across Grow, Headway, and Alma to maximize schedule utilization,
      creating ongoing margin risk if competitors offer superior net reimbursement rates or lower administrative
      friction.
    claimRefs:
      - CP007
      - CP012
      - CP014
