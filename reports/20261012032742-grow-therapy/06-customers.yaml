callouts:
  - calloutType: "risk"
    title: "Payer Dependency and 1099 Service Quality Variance"
    body: "Grow Therapy's reliance on independent 1099 contractors introduces inherent variability in clinical intake and late-cancellation policies compared to W-2 staff models. Furthermore, with over 90% of sessions subsidized by third-party health plans, platform margins remain acutely sensitive to payer fee renegotiations and credentialing turnaround times."
    claimRefs:
      - "CU004"
      - "CU014"
      - "CU015"
  - calloutType: "insight"
    title: "Administrative Decoupling as the Primary Supply-Side Moat"
    body: "By automating insurance enrollment, handling billing, and guaranteeing weekly payments shielded from payer clawbacks, Grow Therapy solves the primary operational friction preventing private clinicians from taking insurance. This supply-side value proposition generates the density required to secure broad payer network inclusion."
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU013"
