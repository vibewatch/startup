              - CR012
              - CR014
      - number: '7.4'
        title: Financial Exposure, Clawback Absorption, and Revenue Model Uncertainty
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy does not charge therapists an upfront subscription fee and instead monetizes by retaining a
              percentage share of collected insurance reimbursements. To attract independent clinicians away from solo
              direct billing, Grow Therapy guarantees predictable weekly payouts and explicitly protects participating
              clinicians from retroactive insurance payer clawbacks. This clawback guarantee represents a substantial
              balance-sheet risk for the company: if commercial payers or Medicaid managed care programs conduct
              retrospective utilization audits and recoup reimbursement for documentation deficiencies or medical
              necessity disputes, Grow Therapy must absorb the clawback losses directly. Supported by a $150 million
              Series D financing round, the platform possesses balance-sheet cushion, but sustained audit clawback
              exposure could compress corporate net revenue and operating margins.
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR014
      - number: '7.5'
        title: Risk Matrix, Mitigation Maturity, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              A comprehensive assessment of Grow Therapy's operational and legal landscape highlights distinct residual
              exposures across regulatory compliance, clinician retention, and payer relationships. Platform lock-in
              represents an operational friction point for practitioners who adopt Grow Therapy's proprietary practice
              workspace, as migrating clinical records and client communications off the platform incurs significant
              switching overhead. Critical thesis-break triggers for prospective investors include: any widespread
              retrospective payer audit resulting in material unreserved clawback recoupments, regulatory enforcement
              challenging 1099 independent contractor classification for platform clinicians, commercial payer
              reimbursement cuts exceeding 10% across major panels, or catastrophic protected health information
              exposure involving ambient AI session data.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR009
              - CR011
              - CR013
