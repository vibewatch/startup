              - CR013
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Clawback Absorption Risk on Payer Recoupments
            body: >-
              By shielding clinicians from retroactive payer clawbacks and paying providers weekly on completed
              sessions, Grow Therapy absorbs substantial balance-sheet risk if commercial or Medicaid payers
              subsequently dispute medical necessity or session documentation standards during retrospective audits.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Core Diligence Verification on Clinical AI Accuracy and Payer Audits
            body: >-
              Prospective investors must prioritize direct review of Grow Therapy's historical clawback reserve loss
              rates and independently audited documentation error metrics for ambient AI clinical notes prior to
              underwriting Series D or follow-on growth equity valuations.
            calloutType: recommendation
            claimRefs:
              - CR002
