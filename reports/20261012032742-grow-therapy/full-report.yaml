              - CU008
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Payer Dependency and 1099 Service Quality Variance
            body: >-
              Grow Therapy's reliance on independent 1099 contractors introduces inherent variability in clinical intake
              and late-cancellation policies compared to W-2 staff models. Furthermore, with over 90% of sessions
              subsidized by third-party health plans, platform margins remain acutely sensitive to payer fee
              renegotiations and credentialing turnaround times.
            calloutType: risk
            claimRefs:
              - CU004
              - CU014
              - CU015
          - type: callout
            title: Administrative Decoupling as the Primary Supply-Side Moat
            body: >-
              By automating insurance enrollment, handling billing, and guaranteeing weekly payments shielded from payer
              clawbacks, Grow Therapy solves the primary operational friction preventing private clinicians from taking
              insurance. This supply-side value proposition generates the density required to secure broad payer network
              inclusion.
            calloutType: insight
            claimRefs:
              - CU002
              - CU005
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Licensing, and Healthcare Compliance Exposures
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy operates as the contracted administrative network entity for participating clinicians across
              commercial payers and state Medicaid managed care plans. This structure abstracts direct payer enrollment
              for independent therapists but centralizes billing compliance risk and healthcare regulatory scrutiny at
              the corporate network level. Participating clinicians join the marketplace as 1099 independent contractors
              rather than statutory employees, which preserves clinician scheduling autonomy but exposes the operating
              model to shifting federal and state worker classification standards. In addition, because Grow Therapy
              supports psychiatric prescribers alongside behavioral health therapists across multiple states, the
              platform must continuously verify active unrestricted state licensure and mandatory professional
              malpractice coverage across diverse state medical and behavioral health boards.
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
