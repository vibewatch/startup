      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Market Demand
        - Huge unmet demand for insurance-covered behavioral health across 220M+ covered lives
        - Payer reimbursement compression and rate cuts squeeze net platform take-rate
        - Multi-year commercial payer contracts with guaranteed commercial fee schedules
      - - Provider Moat
        - Network of 26,000+ providers expanded with 70% documentation time savings via AI tools
        - Independent clinician churn remains unhedged as clinicians multi-home across Headway and Alma
        - Audited annual clinician retention rates exceeding 85% and exclusive volume tiers
      - - Financial Quality
        - Reported revenue scaled to ~$1B from $3.6M in 2021 with a 455.6% CAGR
        - Gross pass-through session revenue may mask thin net take-rates and ongoing operating losses
        - Audited GAAP financial statements disclosing net revenue, gross margin, and EBITDA
      - - Competitive Position
        - Deep insurance integration with 125+ health plans creates high regulatory and operational barriers
        - Spring Health acquisition of Alma creates a $6B-$7B rival platform spanning 170M lives
        - Demonstrated market share gains in employer-sponsored and value-based care contracts
