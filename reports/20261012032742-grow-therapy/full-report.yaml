      - number: '6.3'
        title: Care Experience, Retention Loops, and Practice Workflow
        blocks:
          - type: paragraph
            body: >-
              The customer journey on Grow Therapy is structured to minimize intake friction and promote sustained
              therapeutic engagement. Patients enter the platform through digital direct-to-consumer search or partner
              referral channels, filtering available providers by state licensure, accepted insurance carrier, clinical
              specialty, and demographic preferences. Appointments can typically be booked within 72 hours for virtual
              or in-person care, bypassing conventional multi-week waitlists prevalent across outpatient behavioral
              health. Before sessions, clients complete digital check-ins that populate clinical context within the
              clinician's electronic dashboard. During appointments, optional ambient artificial intelligence tools
              draft structured clinical notes with client and therapist consent, reportedly reducing administrative
              documentation time by up to 70%. Between scheduled encounters, clients engage with mobile reflection
              exercises and secure asynchronous provider messaging, while standardized clinical assessments track
              symptom improvement every three sessions. This workflow reinforces provider retention through weekly
              session payouts protected from insurer clawbacks, although individual practice styles and cancellation
              policies vary across independent contractors.
            claimRefs:
              - CU006
              - CU011
              - CU013
              - CU014
          - type: figure
