      - number: '6.2'
        title: Adoption Trajectory, Visit Velocity, and Platform Scale
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy's customer adoption metrics indicate rapid operational expansion since its founding in 2021.
              The platform's active clinician supply network has scaled from early regional clusters to over 26,000
              licensed therapists and psychiatrists across all 50 states, reaching an expanded milestone of 27,000
              clinicians by late 2026. This clinician density has facilitated cumulative volume of approximately 10
              million therapy appointments over five years, with calendar year 2025 alone accounting for roughly 7
              million visits. This rapid volume acceleration underpins reported annualized revenue run-rates reaching $1
              billion as of the company's Series D financing in early 2026. Concurrently, Grow Therapy's institutional
              payer relationships have grown to more than 125 health plans, extending in-network coverage eligibility to
              over 220 million American lives, with later disclosures indicating expansion toward 230 million covered
              lives. While headline visit volume demonstrates strong marketplace liquidity, the company does not
              publicly disclose active weekly clinician caseload utilization or the precise mix between initial
              evaluations and recurring visits.
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU012
