            title: Dense Payer Integration and Provider Enablement Flywheel
            body: >-
              Grow Therapy has established commercial contracts across more than 125 health plans covering 220 million
              lives. By eliminating administrative friction in credentialing, billing, and scheduling, and providing
              ambient AI clinical documentation tools, Grow accelerates provider onboarding while reducing client
              out-of-pocket costs to an average of $21 per visit.
