      - number: '5.3'
        title: Platform Architecture and Enterprise Interoperability
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy's underlying technical architecture links four discrete operational planes: a patient-facing
              web and mobile client tier, a clinician practice EHR portal, a machine learning clinical documentation
              pipeline, and an enterprise clearinghouse integration gateway. The ingestion tier handles insurance
              eligibility verification and appointment routing, communicating via secure APIs with commercial and
              government payer portals covering 220 million insured lives. To solve the persistent industry challenge
              known as the EAP cliff—where corporate workers lose therapist continuity after exhausting introductory
              employee assistance sessions—Grow launched a dedicated enterprise benefit product in early 2026. This
              architecture enables employees to transition seamlessly from corporate EAP coverage to commercial health
              insurance with the same therapist under a utilization-based pricing model that replaces flat
              per-member-per-month fees. However, external integrations with health systems currently rely on
              coordinated portal handoffs rather than fully standardized bi-directional FHIR or HL7 interfaces,
              representing a technical interoperability boundary as the platform expands into complex hospital networks.
            claimRefs:
              - CE007
