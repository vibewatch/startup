              - CR009
      - number: '7.3'
        title: Payer Concentration, Reimbursement Dependencies, and Network Freezes
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy accepts health insurance from over 100 commercial and public health plans, connecting clients
              to in-network care with average out-of-pocket copays around $21. However, the business remains heavily
              dependent on major commercial payers including UnitedHealthcare, Aetna, Cigna, and Blue Cross Blue Shield
              plans, alongside state Medicaid managed care organizations. Because payer contracting occurs at the
              network level, regional commercial plans periodically freeze panel admissions or cap provider enrollment
              in specific geographic markets, restricting clinician onboarding velocity. Furthermore, Grow Therapy's
              marketplace infrastructure handles credentialing, billing, and directory self-booking, but does not
              provide live telephone intake for prospective patients calling private practices directly, leaving
              external conversion dependent on third-party practice workflows.
            claimRefs:
              - CR001
              - CR008
              - CR010
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
