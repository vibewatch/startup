              Grow Therapy and market reporting cite a $1 billion annual revenue run-rate and a $3 billion post-money
              valuation as of March 2026. However, public disclosures do not reconcile this figure to GAAP net revenue
              versus gross patient visit volume. With competitors such as Spring Health acquiring Alma in May 2026 to
              create a 170-million-life network, lack of visibility into GAAP profitability, provider churn, and
              reimbursement margins poses diligence risk.
            calloutType: risk
            claimRefs:
              - CO001
