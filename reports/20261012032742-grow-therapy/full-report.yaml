              - CR004
              - CR007
      - number: '7.2'
        title: Operational Quality, Ambient AI Scribe Accuracy, and Data Security
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy has integrated ambient artificial intelligence documentation technology into clinician
              workflows to draft clinical notes and reduce administrative session charting time. While automated
              charting dramatically increases therapist throughput and daily appointment capacity, automated
              documentation introduces potential clinical hallucination and documentation error risks if clinicians fail
              to rigorously audit machine-generated notes before billing submission. Grow Therapy requires dual
              clinician and patient informed consent before enabling ambient recording features, but handling sensitive
              clinical audio across multi-tenant cloud systems creates heightened Health Insurance Portability and
              Accountability Act data exposure. The company acquired digital privacy vendor neosync to bolster privacy
              and synthetic data compliance, yet maintaining airtight protected health information segregation remains a
              critical ongoing operational requirement.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
