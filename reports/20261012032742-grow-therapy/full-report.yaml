      - number: '5.4'
        title: Security Controls, Regulatory Compliance, and Outcome Gaps
        blocks:
          - type: paragraph
            body: >-
              Operating at the intersection of protected health information (PHI) and clinical generative AI requires
              rigorous data privacy and regulatory compliance controls. Grow Therapy maintains compliance with the
              Health Insurance Portability and Accountability Act (HIPAA), executes Business Associate Agreements (BAAs)
              with clinicians and enterprise partners, and holds SOC 2 Type II certification. To safeguard sensitive
              clinical transcripts utilized by its AI notetaking tools, the company acquired digital privacy firm
              neosync in late 2025, integrating specialized data masking and anonymization layers to prevent
              unauthorized data leakage or model training on raw therapy sessions. Despite these compliance milestones,
              significant diligence gaps persist regarding clinical outcome efficacy. While Grow publicly highlights an
              80% patient symptom improvement rate within 30 days and an 85 Net Promoter Score, the company declined to
              release audited, peer-reviewed clinical datasets alongside its Series D financing. For institutional
              payers, risk-bearing health systems, and self-insured enterprise sponsors evaluating long-term contract
              expansions, validating whether these self-reported improvements generalize across complex, comorbid
              psychiatric populations remains a critical underwriting milestone.
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Ambient AI Scribe Creates Provider Retention and Throughput Moat
            body: >-
              By natively embedding ambient clinical documentation into its EHR to cut charting time by 70%, Grow
              Therapy addresses the primary driver of independent clinician burnout without displacing clinical
              decision-making.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: Clinical Efficacy Claims Await Independent Validation
            body: >-
              While Grow reports 80% client symptom improvement within 30 days, the lack of published, peer-reviewed
              clinical outcome datasets leaves health plans and self-insured employers unable to independently audit
              long-term clinical efficacy.
            calloutType: risk
            claimRefs:
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments, Economic Buyers, and Payer Alignment
        blocks:
          - type: paragraph
            body: >-
              Grow Therapy operates across a three-sided marketplace structure aligning individual patients, independent
              clinical providers, and commercial and government insurance payors. On the demand side, individual
              psychotherapy clients and psychiatric medication management patients represent the primary care-seeking
              users. These users are predominantly insulated from out-of-pocket pricing through participating health
              plan coverage, paying an average copay of approximately $21 per clinical visit, with roughly one in three
              patients paying zero dollars out of pocket depending on benefit plan design. On the supply side,
              independent licensed therapists and prescribers act as commercial users who adopt the platform to
              eliminate private practice administrative overhead, including credentialing, scheduling, electronic health
              record workflows, and billing collections. The platform aligns these two constituencies with commercial
              health plans and government programs that serve as institutional payers seeking to satisfy behavioral
              health parity regulations and expand timely outpatient network access for their enrolled member
              populations.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
