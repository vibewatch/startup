callouts:
  - calloutType: strength
    title: Dense Payer Integration and Provider Enablement Flywheel
    body: Grow Therapy has established commercial contracts across more than 125 health plans covering 220 million lives. By eliminating administrative friction in credentialing, billing, and scheduling, and providing ambient AI clinical documentation tools, Grow accelerates provider onboarding while reducing client out-of-pocket costs to an average of $21 per visit.
    claimRefs:
      - CO002
      - CO005
      - CO006
      - CO013
  - calloutType: risk
    title: Reconciliation Gaps on Reported Run-Rate and Unit Economics
    body: Grow Therapy and market reporting cite a $1 billion annual revenue run-rate and a $3 billion post-money valuation as of March 2026. However, public disclosures do not reconcile this figure to GAAP net revenue versus gross patient visit volume. With competitors such as Spring Health acquiring Alma in May 2026 to create a 170-million-life network, lack of visibility into GAAP profitability, provider churn, and reimbursement margins poses diligence risk.
    claimRefs:
      - CO001
      - CO003
      - CO015
