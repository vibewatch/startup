company:
  name: Grow Therapy
chapter:
  number: 1
  title: Company Overview
  summary: Founded in 2020 and headquartered in New York, Grow Therapy operates a two-sided mental health marketplace and provider operating platform connecting clients to insurance-covered therapy while providing clinicians with billing, scheduling, and AI documentation tools. Following a $150 million Series D led by TCV and Goldman Sachs Alternatives in March 2026, the company achieved a reported $3 billion valuation on $1 billion in annual revenue, though GAAP reconciliation and detailed profitability remain undisclosed.
sections:
  - id: sec-identity-model
    title: Corporate Identity, Mission, and Marketplace Model
    body: Grow Therapy is a technology-enabled healthcare platform that operates a three-sided marketplace aligning independent mental health providers, health insurance payers, and patients seeking behavioral health services. Founded in 2020 and headquartered in New York City, the company eliminates the structural administrative barriers that historically prevented licensed mental health professionals from establishing viable insurance-based private practices. Rather than charging consumer subscription fees or requiring out-of-pocket cash payments, Grow Therapy integrates directly with over 125 commercial health plans, Medicare, and Medicaid programs across all 50 states. Under this operating model, participating therapists and psychiatrists receive turnkey electronic health record tooling, automated billing, credentialing assistance, and ambient AI clinical documentation tools. Concurrently, patients access in-person or virtual care at their contracted in-network insurance rate, resulting in an average patient copay of $21 per visit with one in three clients paying zero dollars out of pocket. By March 2026, the platform had scaled to facilitate 10 million cumulative patient appointments across a network of 26,000 independent providers.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
      - CO006
      - CO013
    tableRefs:
      - TO001
    figureRefs: []
  - id: sec-leadership-governance
    title: Founders, Executive Leadership, and Operational Governance
    body: Grow Therapy was co-founded by Duke University alumni Jake Cooper, Manoj Kanagaraj, and Alan Ni, who conceptualized the venture during the COVID-19 pandemic after identifying acute supply constraints in insurance-covered behavioral health. Chief Executive Officer Jake Cooper brings institutional finance rigor to healthcare reimbursement workflows, having previously worked in private equity at Blackstone and Apollo Global Management. Chief Strategy Officer Manoj Kanagaraj directs enterprise health plan negotiations, risk-sharing agreements, and health system referral integration, while Chief Technology Officer Alan Ni leads technical architecture, billing infrastructure, and clinician-facing software engineering. Corporate governance exhibits concentrated key-person dependence across the three executive co-founders, who continue to manage primary capital allocation, technology design, and payer relationships. In November 2025, executive leadership deepened its commitment to New York City by signing a 19,000 square foot headquarters lease at 100 Broadway, supported by up to $1.8 million in performance-based Excelsior Jobs Program tax credits to add at least 186 full-time engineering, marketing, and operational roles over five years.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
    tableRefs:
      - TO002
    figureRefs: []
  - id: sec-capitalization-investors
    title: Capitalization History, Valuation, and Stakeholder Syndicate
    body: Grow Therapy has raised approximately $328 million in cumulative venture capital and growth equity financing since its founding. Early capitalization was supported by seed and Series A investors including SignalFire, SVB, Able Partners, and Gaingels, followed by a $75 million Series B round in September 2022 led by TCV and co-led by Transformation Capital. In April 2024, Growth Equity at Goldman Sachs Alternatives led a Series C round to accelerate insurance network expansion. The company solidified its unicorn status in March 2026 by completing a $150 million Series D financing round co-led by existing backers TCV and Goldman Sachs Alternatives, alongside participation from Menlo Ventures, British Columbia Investment Management Corporation (BCI), and long-term shareholder Sequoia Capital. The Series D priced Grow Therapy at a post-money equity valuation of $3 billion, pegged to a reported $1 billion annual revenue run-rate. However, capitalization disclosures do not specify liquidation preferences, dividend covenants, or the ratio between primary operational capital and secondary liquidity for early investors and founders.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO011
      - CO012
      - CO015
    tableRefs:
      - TO003
    figureRefs: []
  - id: sec-milestones-evolution
    title: Milestone Evolution, Enterprise Expansion, and Analytical Disclosures
    body: 'The trajectory of Grow Therapy reflects a rapid transition from a low-fidelity experimental prototype to a nationally scaled healthcare infrastructure platform. Originating in 2020 from a targeted Craigslist advertisement testing clinician receptivity to outsourced insurance credentialing, Grow officially launched commercial operations in February 2021. Between 2021 and 2025, the platform achieved 50-state geographic reach, introduced ambient AI clinical note generation that reduced provider documentation time by nearly 70%, and scaled annual visit volume to 7 million sessions in 2025 alone. In early 2026, the company diversified beyond its core direct-to-consumer marketplace by introducing an enterprise employer mental health benefit designed to seamlessly transition employees from Employee Assistance Programs to health plan coverage, while establishing referral partnerships with clinical providers such as Circle Medical. Despite this commercial momentum, analytical scrutiny highlights meaningful diligence risks: public sources do not reconcile the reported $1 billion top-line run-rate to GAAP net revenue or audited operating profit, while provider retention dynamics face heightened competitive pressure following Spring Health''s May 2026 acquisition of peer network Alma.'
    claimRefs:
