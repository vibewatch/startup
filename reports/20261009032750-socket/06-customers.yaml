callouts:
  - calloutType: "insight"
    title: "Bottom-Up Developer Adoption Anchors Enterprise Security Wedge"
    body: >
      Socket’s go-to-market advantage stems from positioning security checks directly inside developer workflows—pull requests, CLI commands, and editor extensions—rather than functioning as an out-of-band compliance scanner. This frictionless onboarding generates rapid repository and commit volume, creating organic internal demand when security directors seek to standardize software supply chain governance.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"

  - calloutType: "risk"
    title: "Lack of Monetization Transparency and Concentration Visibility"
    body: >
      Despite impressive top-line usage figures including 27,000 organizations and 1.5 million repositories, Socket provides no visibility into paid customer counts, ARR run rate, or customer concentration. If the vast majority of volume remains on the free tier without converting into recurring enterprise subscriptions, revenue growth may lag the $1 billion Series C valuation expectations.
    claimRefs:
      - "CU001"
      - "CU010"
      - "CU012"
      - "CU016"

