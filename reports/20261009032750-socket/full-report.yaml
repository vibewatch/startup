      - CE004
      - CE005
      - CE006
      - CE009
      - CE010
    data:
      layers:
        - label: Developer & Integration Surfaces
          detail: >-
            Developer workstation interfaces, CLI wrappers, package manager hooks, IDE extensions, GitHub/GitLab apps,
            and emerging MCP agent gateways.
        - label: Policy & Enforcement Layer
          detail: >-
            Socket Firewall network interception, automated CI/CD build gates, enterprise compliance policies, and
            certified security patch distribution.
        - label: Core Intelligence & Analysis Engine
          detail: >-
            Continuous registry package ingestion, static AST parsing, behavioral heuristic analyzers, and AI-assisted
            threat triaging with human verification.
        - label: Reachability & Call-Graph Tracing
          detail: >-
            Function-level static call graphing and dependency invocation tracing that filters out alerts for
            unreachable vulnerable code.
        - label: Global Threat Telemetry & Data Infrastructure
          detail: >-
            Real-time feeds across npm, PyPI, and other package registries, tracking 85+ supply chain risk indicators
            and known threat actor behaviors.
        - label: Governance, Audit & Security Controls
          detail: >-
            Enterprise audit logs, centralized package review workflows, license compliance tracking, and administrative
            access controls.
