      - number: '3.2'
        title: Capability Dimensions, Reachability, and Packaging Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Head-to-head capability benchmarks highlight meaningful architectural divergence between Socket and peer
              platforms. Whereas incumbents such as Snyk Open Source emphasize proprietary vulnerability intelligence
              documenting CVEs ahead of public databases alongside call-graph reachability, specialists like Endor Labs
              focus heavily on transitive call-graph reachability across 40+ languages to achieve reported noise
              reductions averaging 92% to 97%. In contrast, independent reviews indicate that Socket's core
              differentiation centers on install-time and runtime behavioral analysis that catches zero-day supply chain
              compromises, typosquatting, and account takeovers before CVE advisories are published. Commercial
              packaging models diverge sharply across the cohort: Socket provides a free public tier alongside per-seat
              plans for reachability, certified patches, and enterprise firewall governance; Aikido and Snyk offer
              freemium tiers; and enterprise players like Chainguard, Endor Labs, and ReversingLabs enforce quote-based
              annual enterprise commitments. In addition, buyers assessing total cost of ownership note that while
              Socket's developer-focused GitHub App enables rapid time-to-value, achieving full organizational
              governance across non-GitHub source code managers requires upgrading to higher enterprise tiers.
