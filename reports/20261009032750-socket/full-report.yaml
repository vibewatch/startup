            body: >-
              Socket was founded in 2020 and is headquartered in San Francisco, with independent reporting and a
              company-profile surface supporting those identity points. Its product analyzes open source dependencies
              for malicious behavior and is positioned to block supply chain attacks before packages reach developer
              machines, continuous-integration systems, or production. That approach is more specific than a generic
              vulnerability database: the available reporting describes checks for malware, typo-squatting, misleading
              packages, excessive permissions, and other behavioral signals. The evidence supports a developer-oriented
              software supply chain security business, but the assigned sources do not establish a verified legal-entity
              structure, geographic office list, or current revenue model terms.
