  - id: FV001
    title: Recommendation Logic
    type: flow
    summary: >-
      A six-step underwriting chain separates observable scale and financing facts from the missing evidence that
      controls the decision.
    data:
      nodes:
        - id: market-need
          label: Supply-chain security need
          detail: Behavioral dependency inspection addresses a documented enterprise concern.
        - id: product-proof
          label: Product and customer proof
          detail: Named customers and incident-driven onboarding support relevance.
        - id: scale-signal
          label: Company-reported scale
          detail: Protected-organization and repository counts are usage signals, not revenue.
        - id: financing-mark
          label: $1B financing mark
          detail: The Series C mark followed a roughly 3.2x step-up.
        - id: economics-gap
          label: Operating-economics gap
          detail: ARR, retention, margin, burn, cash, and preference terms are missing.
        - id: decision
          label: Track; no public price target
          detail: Private diligence must precede a capital commitment.
      edges:
        - from: market-need
          to: product-proof
        - from: product-proof
          to: scale-signal
        - from: scale-signal
          to: financing-mark
        - from: financing-mark
          to: economics-gap
        - from: economics-gap
          to: decision
    approximationNotes: >-
      The figure is a qualitative decision sequence and does not encode probability, valuation, or conversion-rate
      magnitudes.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV014
      - CV015
