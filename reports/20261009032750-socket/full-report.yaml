      - number: '4.2'
        title: Cost Structure, Unit Economics, and GTM Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              Because Socket is an early-growth private enterprise, audited GAAP income statements and cost breakdowns
              are withheld from public disclosure. Nevertheless, the underlying technical architecture and go-to-market
              motion provide clear proxies for its cost structure and operating leverage. Socket's cost of goods sold
              (COGS) is predominantly composed of multi-cloud compute infrastructure (used for behavioral package
              detonation, static analysis, and reachability graph computation), cloud storage for package registry
              mirrors and historical AST telemetry, and third-party AI inference APIs utilized to accelerate certified
              patch generation and code summarization.


              Unlike legacy software composition analysis (SCA) tools that rely on manual security research teams to
              catalog vulnerabilities post-disclosure, Socket leverages automated real-time behavioral analysis across
              package registries (npm, PyPI, Go, Maven) paired with AI-driven reachability. This infrastructure-centric
              approach carries higher upfront compute and registry indexing costs but exhibits exceptional incremental
              gross margins once baseline registry monitoring is operationalized. Gross margin profile is expected to
              benchmark in the 75% to 85% range standard for developer-first security SaaS, though enterprise
              on-premises or private data-boundary requirements could introduce hosting friction.


              On the go-to-market side, customer acquisition costs (CAC) are heavily cushioned by Socket's freemium
              product-led growth (PLG) motion. With over 27,000 organizations protected, 1.5 million repositories
              secured, and its founding team having authored open-source software downloaded over 1 billion times per
              month, inbound developer interest serves as a zero-cost top-of-funnel pipeline. Sales efficiency is driven
              by inbound conversion from developers hitting Free or Team tier thresholds in active CI pipelines.
              However, because paid conversion rates, net revenue retention (NRR), and gross revenue retention (GRR)
              remain undisclosed, underwriting models cannot verify whether the high volume of protected repositories
              translates into sustained multi-year enterprise expansion or remains concentrated in low-ACV self-serve
              tiers.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Capital Adequacy, Cash Runway, and Public Market Disambiguation
        blocks:
          - type: paragraph
            body: >
              Socket's capital adequacy was dramatically strengthened in May 2026 with the closing of a $60 million
              Series C financing round led by Thrive Capital, featuring participation from Andreessen Horowitz, Abstract
              Ventures, and Capital One Ventures. This financing expanded Socket's total equity raised to $125 million
              and established a post-money valuation benchmark of $1.0 billion, officially elevating the startup to
              unicorn status. With an estimated headcount of approximately 100 employees as of mid-2026, Socket's
              annualized operating expense run-rate (assuming a fully loaded engineering and sales cost of $250,000 to
              $300,000 per employee) is approximately $25 million to $30 million. Even in the absence of material
              top-line revenue, the $60 million cash injection affords Socket between 24 and 36 months of unassisted
              operational runway, providing substantial insulation against macroeconomic downturns.


              A critical diligence requirement when evaluating Socket's financial profile is the absolute disambiguation
              from Socket Mobile, Inc. (NASDAQ: SCKT), a publicly traded hardware manufacturer of barcode scanners and
              contactless data capture peripherals headquartered in Fremont, California. Public market aggregators and
              search engines frequently conflate the two distinct corporate entities. In Q2 2026, Socket Mobile reported
              GAAP hardware revenue of $3.033 million (down 25% year-over-year from $4.042 million), a GAAP gross margin
              of 46.4% constrained by manufacturing factory underutilization, an operating loss of $1.195 million, and a
              precarious cash balance of just $1.6 million alongside bank covenant constraints.


              Underwriters must rigorously enforce that Socket Security, Inc. shares zero corporate lineage, legal
              liabilities, hardware balance sheet risks, or operational exposure with Socket Mobile. Socket Security
              owns no barcode manufacturing facilities, carries no physical inventory risks, and operates purely as a
              private enterprise software business. However, Socket Security's own $1.0 billion valuation represents a
              forward multiple that demands substantial commercial ARR scale. Without audited revenue figures,
              institutional investors cannot evaluate the implied ARR multiple, making private ARR disclosure the
              paramount diligence gating item.
            claimRefs:
              - CI008
              - CI009
              - CI010
