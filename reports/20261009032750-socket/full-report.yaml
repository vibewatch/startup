  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >
              Socket Security, Inc. monetizes its software supply chain security platform through a multi-tiered
              Software-as-a-Service (SaaS) subscription architecture anchored on developer seat licensing. In contrast
              to legacy application security testing (AST) vendors that meter consumption by scanned code repositories,
              compute minutes, or lines of code, Socket indexes pricing directly to active contributors—specifically
              defined as developers who have committed code to scanned repositories within the preceding 90 days.


              The commercial structure spans a four-tier freemium ladder. The entry Free tier ($0 per developer per
              month) functions as a developer-adoption engine, granting open-source projects free coverage and providing
              small commercial teams up to 1,000 scans, three organization members, and single-repository visibility.
              Commercial monetization initiates at the Team tier ($25 per developer per month on monthly billing,
              discounted roughly 20% on annual billing), which expands capacity to 5,000 monthly scans, ten seats, Slack
              notification integrations, and precomputed reachability analysis. For larger engineering organizations,
              the Business tier ($50 per developer per month) removes scan and member caps while unlocking enterprise
              table-stakes features including SAML/SSO, SBOM export/import across SPDX and CycloneDX specifications,
              compliance integrations, and GitHub Actions CI scanning.


              At the top of the ladder, Enterprise packaging is customized and quote-based. It gates advanced governance
              capabilities such as fine-grained function-level reachability triage, non-GitHub source code management
              (SCM) integrations (GitLab, Bitbucket, Azure DevOps), automated user provisioning via SCIM, centralized
              audit logs, and dedicated technical account management. Additionally, Socket packages modular capabilities
              including Socket Firewall (which is offered free for developer laptops but incurs enterprise packaging for
              central network proxy management), Socket Certified Patches, and basic security modules under the same
              product family. This hybrid self-serve and sales-led motion allows Socket to capture developer bottom-up
              adoption while extracting six-figure annual contract values (ACVs) from enterprise buyers.
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI001
            claimRefs:
