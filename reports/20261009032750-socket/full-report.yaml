        blocks:
          - type: paragraph
            body: >-
              Socket's defensible market boundary begins with software supply chain security, not every product category
              containing the word "socket." The company says it scans packages and updates for malicious behavior across
              major registries, while SecurityWeek describes a platform that analyzes open-source dependencies before
              they affect enterprise products. Those descriptions support inclusion of dependency-risk analysis,
              malicious-package detection, and controls placed in developer environments or CI pipelines. By contrast,
              the assigned searches also returned electrical receptacles, semiconductor sockets, impact-tool sockets,
              and semiconductor-test thermal systems. Those four categories have different products, buyers, units, and
              demand drivers, so their published market values cannot be used to value Socket. This separation is
              essential because otherwise a name collision would create a precise-looking but economically meaningless
