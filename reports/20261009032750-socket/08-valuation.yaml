company:
  name: "Socket"
chapter:
  number: 8
  title: "Valuation"
  summary: "Socket's May 2026 Series C announcement established a $1 billion financing mark after a roughly 3.2x step-up from its October 2024 Series B mark. The retained public evidence supports a track recommendation rather than a new investment at that price because revenue, retention, margins, burn, capitalization terms, and a comparable revenue multiple remain undisclosed."
sections:
  - id: "financing-mark-and-entry-discipline"
    title: "Financing Mark and Entry Discipline"
    body: >-
      Socket announced a $60 million Series C at a $1 billion valuation in May
      2026, led by Thrive Capital with participation from a16z, Abstract
      Ventures, and Capital One Ventures; Tracxn records March 19 as the round
      date. Tracxn also records a $40 million Series B at a $312 million
      post-money valuation in October 2024, implying a roughly 3.2x mark-up
      over about 18 to 19 months. That financing velocity is observable, but it
      is not a revenue multiple: the retained sources do not disclose ARR,
      GAAP revenue, retention, gross margin, burn, cash available, or preference
      terms. The $125 million cumulative funding figure therefore describes
      capital raised, not current liquidity. Entry discipline should treat the
      $1 billion mark as unverified by public operating economics and require
      private financial and capitalization evidence before committing.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
    tableRefs:
      - "TV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The thesis is that Socket addresses a real and expanding control point:
      its official materials describe behavioral inspection of open-source
      dependencies, while independent coverage reports recognizable AI and
      developer-tool customers and rapid onboarding after a package-security
      event. Company-reported reach of more than 27,000 protected organizations
      and 1.5 million repositories suggests substantial top-of-funnel scale,
      but those denominators are not paid-customer, revenue, or retention
      measures. The anti-thesis is equally material. Tracxn identifies 81 active
      competitors, Market Briefs describes a crowded cybersecurity-unicorn
      cohort, and the assigned evidence contains no independently verified
      conversion or software-economics data. The investment case can strengthen
      only if diligence connects usage scale to durable paid expansion and
      demonstrates that differentiation survives platform bundling and
      category crowding.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV011"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "scenario-framework"
    title: "Bull, Base, and Bear Framework"
    body: >-
      Public evidence does not support precise fair-value ranges or target
      returns, so the scenarios are expressed as underwriting conditions rather
      than invented revenue multiples. The bull case requires proof that broad
      usage converts into high-quality recurring enterprise revenue, strong
      retention, attractive gross margins, and efficient growth; only then
      could the current mark be tested against genuine software comparables.
      The base case preserves a track stance: customer and product signals are
      promising, but the $1 billion price remains unsupported by disclosed
      economics. The bear case activates if paid conversion, retention, margin,
      or burn evidence disappoints, or if competition forces bundling and price
      compression. Headcount reports also differ between approximately 100 in
      That gap reinforces the need for a current operating data room rather
      than extrapolation.
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV010"
    tableRefs:
      - "TV003"
    figureRefs:
      - "FV001"
  - id: "exit-readiness-and-final-diligence"
    title: "Exit Readiness and Final Diligence"
    body: >-
      The category has transaction activity, but the available references are
      context rather than valuation comparables: CyberWire reported Akamai's
      $205 million agreement for LayerX and an approximately $50 million price
      for Cyera's acquisition of Genie Security, without the revenue, growth,
      margin, product-scope, or deal-term data needed to normalize either
      transaction to Socket. Tracxn also reports exited competitors, but that
      does not establish Socket's own IPO or acquisition readiness. No credible
      target return, hold period, or exit range can be set until investors
      receive historical financials, cohort retention, customer concentration,
      cash and burn data, a fully diluted capitalization table, liquidation
      preferences, and secondary-transfer terms. Thesis-break triggers are weak
      paid conversion, declining retention, margin pressure, inefficient burn,
      or a financing below the current mark.
    claimRefs:
      - "CV005"
      - "CV010"
      - "CV012"
      - "CV013"
