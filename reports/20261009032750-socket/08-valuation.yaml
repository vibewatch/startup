        - "Independent efficacy testing that fails to show earlier or better detection."
      - - "Thesis"
        - "Recognizable AI and developer-tool customers support enterprise relevance."
        - "Coverage names Anthropic, xAI, Replit, Cursor, Figma, and Vercel."
        - "Evidence that logos are unpaid, immaterial, or non-renewing."
      - - "Thesis"
        - "Reported usage scale provides a large monetization surface."
        - "Socket reports more than 27,000 protected organizations and 1.5 million repositories."
        - "Low paid conversion or weak expansion among protected organizations."
      - - "Anti-thesis"
        - "Usage metrics do not establish revenue quality."
        - "The assigned sources do not disclose ARR, retention, gross margin, or burn."
        - "Audited recurring revenue, cohort retention, and margin evidence."
      - - "Anti-thesis"
        - "Competition can compress differentiation and price."
        - "Tracxn lists 81 active competitors, including 16 funded companies."
        - "Sustained win rates and expansion against named enterprise alternatives."
      - - "Anti-thesis"
        - "Cybersecurity-unicorn crowding can expose the mark to multiple compression."
        - "Market Briefs reports about 75 cybersecurity companies valued at $1 billion or more."
        - "A financing or exit benchmark supported by comparable operating data."
    notes: "Company scale metrics are self-reported and are not presented as independently verified paid-customer or revenue measures."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV011"
      - "CV015"
  - id: "TV003"
    title: "Bull, Base, and Bear Scenarios"
    columns:
      - "Case"
      - "Evidence-based assumptions"
      - "Valuation / return logic"
      - "Probability signal"
      - "Downside trigger"
    rows:
      - - "Bull"
        - "Usage scale converts to durable paid enterprise growth with strong retention, margins, and burn efficiency."
        - "Test the $1 billion mark against verified recurring revenue and genuinely comparable software transactions; no public range is supportable."
        - "Named customers, reported onboarding, and product differentiation are positive leading indicators."
        - "Paid conversion or expansion fails to validate the usage metrics."
      - - "Base"
        - "Commercial traction continues, but private economics remain unavailable or only partly verified."
        - "Track without committing; require a price or terms that compensate for unresolved economics."
        - "This best matches the current mix of strong qualitative proof and missing financial disclosure."
        - "A financing below the current mark or materially weaker retention."
      - - "Bear"
        - "Competition, bundling, or weak monetization reduces growth while operating costs expand."
        - "Expect material multiple compression or down-round risk; no precise downside value is supportable from the assigned evidence."
        - "Crowded competition and inconsistent headcount snapshots increase uncertainty."
        - "Weak margins, inefficient burn, customer concentration, or preference overhang."
    notes: "Scenarios are conditional and qualitative because the assigned public sources provide no ARR, revenue growth, retention, margin, burn, or normalized comparable multiples."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV008"
      - "CV010"
      - "CV011"
      - "CV012"
