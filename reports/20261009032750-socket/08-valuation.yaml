        - from: "product-proof"
          to: "scale-signal"
        - from: "scale-signal"
          to: "financing-mark"
        - from: "financing-mark"
          to: "economics-gap"
        - from: "economics-gap"
          to: "decision"
    approximationNotes: "The figure is a qualitative decision sequence and does not encode probability, valuation, or conversion-rate magnitudes."
