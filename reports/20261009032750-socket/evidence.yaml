evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-gap
    missingEvidence: >-
      Current ARR, GAAP revenue, gross margin, retention, burn, runway, and paid-customer counts with dated definitions
      and denominators.
    whyItMatters: >-
      The $1 billion financing valuation cannot be tested against operating performance or cash efficiency without these
      metrics.
    diligencePath: >-
      Request audited financial statements, management ARR bridge, customer cohorts, cash statements, and board-approved
      budget under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, voting agreements, investor protective provisions, fully diluted cap table, debt, and
      secondary transaction details.
    whyItMatters: >-
      Control, dilution, liquidation preferences, and key-person protections materially affect investor economics and
      governance risk.
    diligencePath: >-
      Obtain the charter, cap table, financing documents, board minutes, voting agreements, and management organization
      chart.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: series-c-date
    missingEvidence: Primary closing documents establishing whether the Series C closed in March or May 2026.
    whyItMatters: A consistent transaction date is needed for valuation vintage, cash runway, and milestone chronology.
    diligencePath: Review the executed stock purchase agreement, amended charter, and company closing announcement.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: Independent legal, regulatory, outage, breach, sanctions, or complaint records tied unambiguously to Socket, Inc.
    whyItMatters: >-
      The adverse query returned no assigned source, and absence of evidence cannot establish that no incident or
      dispute exists.
    diligencePath: >-
      Run entity-verified litigation, regulator, sanctions, breach-notification, and incident-history checks using legal
      identifiers.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market sizing gap
    missingEvidence: >-
      A software supply chain security market study or bottom-up dataset with category revenue, geography, period,
      denominator, and methodology.
    whyItMatters: Without a category-relevant spending base, TAM, SAM, SOM, growth, and Socket market share cannot be quantified.
    diligencePath: >-
      Obtain independent application-security spending data and reconcile it to paid seats, contract values, and
      eligible customer segments.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer segmentation
    missingEvidence: Paid-customer segmentation by buyer, payer, budget owner, contract path, organization size, and geography.
    whyItMatters: Named users do not establish who controls budget or how protected organizations convert into revenue.
    diligencePath: Review customer contracts, CRM opportunity roles, win-loss notes, and paid-versus-free account cohorts.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption constraints
    missingEvidence: >-
      Independent customer evidence on procurement timing, switching costs, false-positive burden, workflow disruption,
      and renewal behavior.
    whyItMatters: Product coverage and company-reported activity do not establish adoption speed or durability.
    diligencePath: >-
      Interview reference and churned customers, obtain cohort retention, and compare implementation timelines against
      incumbent tools.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: operating scale
    missingEvidence: >-
      Definitions, measurement windows, paid share, and independent verification for organizations, repositories,
      commits, and blocked attacks.
    whyItMatters: >-
      The footprint metrics cannot be translated into monetized market penetration without consistent denominators and
      paid-account linkage.
    diligencePath: >-
      Reconcile product telemetry to billing records and customer cohorts, with definitions and period-over-period
      retention.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-net-retention
    missingEvidence: >-
      Audited GAAP revenue, ending ARR, annual contract values (ACVs), Net Revenue Retention (NRR), and Gross Revenue
      Retention (GRR).
    whyItMatters: >-
      Essential to underwrite Socket's $1.0B Series C valuation multiple and determine whether commercial revenue
      supports late-stage venture pricing.
    diligencePath: >-
      Request confidential CFO financial pack, audited annual income statements, and customer cohort expansion schedules
      under NDA.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Itemized cost of goods sold (COGS) detailing cloud infrastructure, package registry detonation compute, and AI
      inference API expenditures.
    whyItMatters: >-
      Determines long-term gross margin leverage and verifies whether behavioral analysis and automated patching scale
      profitably.
    diligencePath: >-
      Review management accounting reports, AWS/cloud hosting bills, and API unit cost metrics with engineering
      leadership.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: telemetry-and-reachability-accuracy
    missingEvidence: >-
      Empirical false-positive rates, build latency overhead benchmarks, and cross-language call-graph reachability
      accuracy metrics.
    whyItMatters: >-
      Without independent benchmarking of Socket Firewall latency and reachability false-positive rates, underwriting
      enterprise deployment friction and multi-language parity is difficult.
    diligencePath: >-
      Request customer deployment telemetry, average CI build overhead measurements, and technical evaluation test
      suites from Socket.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: minor
    topic: multi-ecosystem-parity
    missingEvidence: >-
      Independent feature parity comparisons between Socket's npm/JavaScript tooling and its Python, Go, and Java
      support.
    whyItMatters: >-
      Enterprises with polyglot tech stacks require equivalent behavioral protection and reachability across
      non-JavaScript ecosystems.
    diligencePath: >-
      Review public package analysis benchmarks across non-npm registries and conduct technical proof-of-concept testing
      in mixed-language codebases.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Audited paid customer count, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and revenue concentration
      across top 10 enterprise accounts.
    whyItMatters: >-
      Without retention and concentration data, the durability of Socket's revenue base and resilience to customer churn
      cannot be verified against the $1B valuation.
    diligencePath: >-
      Request confidential management presentations, cohort-based revenue retention schedules, and customer
      concentration schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: false-positive-benchmarks
    missingEvidence: >-
      Quantitative benchmarking data documenting Socket's exact false-positive rate and alert volume across large
      enterprise Node.js and Python codebases.
    whyItMatters: >-
      High false-positive rates induce developer alert fatigue and lead engineering teams to disable blocking rules,
      diminishing the platform's effective enterprise retention.
    diligencePath: >-
      Request customer deployment case metrics and telemetry reports from production design partners detailing
      suppressed versus actionable alerts.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register-completeness
    missingEvidence: >-
      Non-public enterprise SaaS contracts, complete trademark litigation dockets, and confidential settlement records
      for Socket Security, Inc.
    whyItMatters: >-
      Public sources do not provide exhaustive discovery of private corporate litigation, customer indemnification caps,
      or pending intellectual property disputes.
    diligencePath: >-
      Review the confidential legal disclosure schedule, active customer MSAs, and insurance policies in the virtual
      data room.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-economics
    missingEvidence: >-
      Current ARR or GAAP revenue, revenue growth, gross margin, net and gross retention, customer concentration, burn,
      cash balance, and runway.
    whyItMatters: >-
      These metrics determine whether the one-billion-dollar financing mark reflects durable software economics and
      whether a target return is supportable.
    diligencePath: >-
      Obtain audited annual statements, current management accounts, ARR bridge, cohort schedules, customer
      concentration, cash ledger, and board-approved operating plan.
    relatedQuestionRefs:
      - QV007
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: capitalization-terms
    missingEvidence: >-
      Fully diluted capitalization, liquidation preferences, participation rights, anti-dilution terms, option-pool
      treatment, and secondary-transfer terms.
    whyItMatters: >-
      Headline post-money valuation does not reveal proceeds waterfall, dilution, or the return available to a new
      investor.
    diligencePath: >-
      Review the Series C stock purchase documents, amended charter, investor-rights agreement, pro forma cap table, and
      modeled exit waterfalls.
    relatedQuestionRefs:
      - QV006
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: comparable-normalization
    missingEvidence: >-
      Revenue, growth, margin, product-scope, and transaction-term data for genuinely comparable public companies,
      private rounds, and acquisitions.
    whyItMatters: Headline transaction values alone cannot produce a defensible valuation range for Socket.
    diligencePath: >-
      Build a comparable set from filings and transaction documents after Socket's verified operating metrics and
      business mix are available.
    relatedQuestionRefs:
      - QV004
      - QV008
    relatedTableRefs:
      - TV001
