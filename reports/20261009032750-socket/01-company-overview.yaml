company:
  name: "Socket"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Socket is a San Francisco software supply chain security company founded in 2020 and led by founder-CEO Feross Aboukhadijeh. Independent reports converge on a $60 million Series C, $125 million total funding, and a $1 billion valuation, but disagree on the round date and current headcount; revenue, governance, and cap-table economics remain unverified."
sections:
  - id: "identity-and-product"
    title: "Identity and Product"
    body: "Socket was founded in 2020 and is headquartered in San Francisco, with independent reporting and a company-profile surface supporting those identity points. Its product analyzes open source dependencies for malicious behavior and is positioned to block supply chain attacks before packages reach developer machines, continuous-integration systems, or production. That approach is more specific than a generic vulnerability database: the available reporting describes checks for malware, typo-squatting, misleading packages, excessive permissions, and other behavioral signals. The evidence supports a developer-oriented software supply chain security business, but the assigned sources do not establish a verified legal-entity structure, geographic office list, or current revenue model terms."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "leadership-and-scale"
    title: "Leadership and Operating Scale"
    body: "Feross Aboukhadijeh is consistently identified as Socket's founder and chief executive. His open source maintenance and security background provide clear founder-market fit, yet the assigned evidence names no broader executive bench or board roster, creating material key-person and governance diligence gaps rather than proof that those structures do not exist. Scale indicators also require careful attribution: Socket itself claims more than 27,000 organizations protected and 1.5 million repositories covered, while two third-party sources report materially different workforce snapshots—approximately 100 employees around the May 2026 financing coverage and 139 employees as of August 2026. Those figures may reflect growth, methodology differences, or timing, so neither should be treated as a precise current headcount without payroll evidence."
    claimRefs:
      - "CO003"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "funding-and-milestones"
    title: "Funding and Milestones"
    body: "The financing record shows a rapid progression from seed capital through a $20 million Series A in August 2023, a reported $40 million Series B in October 2024, and a $60 million Series C. CyberWire, SecurityWeek, Tracxn, and Multiples agree that the latest round brought total funding to $125 million and valued Socket at $1 billion; CyberWire and SecurityWeek also identify Thrive Capital as lead, with Andreessen Horowitz, Abstract Ventures, and Capital One Ventures participating. The timing is not fully reconciled: Tracxn records March 19, 2026, while three other assigned sources place the round in May 2026. The timeline therefore presents both dates rather than selecting one without primary closing documents."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "evidence-limits"
    title: "Evidence Limits and Diligence Implications"
    body: "Public financing coverage is considerably stronger than the operating disclosure. Multiples records a $17 million figure for August 2023, but its own methodology says such entries may represent run-rate revenue, ARR, or last-twelve-month revenue; it therefore cannot be presented as audited GAAP revenue or current ARR. A separate funding database still reports $65 million and labels Series A as the latest round, directly conflicting with the better-corroborated Series C record and illustrating aggregator lag. No assigned independent adverse, legal, or regulatory source was returned by the executed adverse query, which is an evidence gap—not proof that no adverse event exists. Investment diligence should obtain current financials, board and cap-table documents, and source-of-truth financing records."
    claimRefs:
      - "CO007"
      - "CO015"
      - "CO016"
