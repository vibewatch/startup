  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 软件供应链安全格局与替代方案类型
        blocks:
          - type: paragraph
            body: >-
              Socket 所处竞争格局包含五类不同替代方案：广泛的开发者安全和 SCA 龙头、深度告警优先级专家、多扫描器整合平台、精简型容器与操作系统供应商，以及免费的生态原生工具。Socket
              通过检查软件包运行时和安装时行为——包括安装脚本、网络请求、文件系统写入和 shell 执行——建立差异化，而不是只依赖滞后的 CVE 漏洞数据库。不过，2026 年企业 DevSecOps
              团队的买方评估显示，市场越来越厌倦点工具泛滥。评估 Socket 的组织经常在其主动恶意软件检测与整合 AppSec 套件的便利性之间权衡，后者把
              SCA、SAST、密钥检测和容器扫描合并进一份供应商合同和一个仪表盘。此外，Socket 虽然能对 npm 和 JavaScript 进行深度行为检测，但维护大型 Java、Go、.NET 或 C/C++
              代码库的多语言企业会遇到覆盖不对称，往往仍需第二套 SCA 工具。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
