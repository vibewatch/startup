  - id: FI001
    title: Socket 从开发者到收入的商业转化桥梁
    type: flow
    summary: 从开源开发者采用到高价值企业 ARR 的结构化转化路径。
    data:
      nodes:
        - id: open-source-reach
          label: 开源触达
          detail: 每月 1B+ 次维护者下载，以及对公开开源项目的保护
        - id: free-tier-adoption
          label: 免费层采用
          detail: 27,000+ 个受保护组织使用免费的 GitHub App 和 CLI Firewall
        - id: seat-limit-trigger
          label: 席位与功能上限触发
          detail: 超过 3 名成员、每月 1,000 次扫描，或需要可达性告警
        - id: self-serve-monetization
          label: 自助式变现
          detail: 通过信用卡订阅 Team（$25/seat）和 Business（$50/seat）
        - id: enterprise-expansion
          label: 企业合同扩张
          detail: 为 SSO、SCIM、多 SCM 和函数可达性提供定制 ACV 合同
        - id: retention-and-expansion
          label: 账户留存与扩张
          detail: 企业范围内的席位增长，以及采用相邻模块（Firewall、Patches）
    approximationNotes: 流程图展示架构层面的市场进入路径；转化速度和各阶段的转化流失情况属于公司机密。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Socket 的检查、分析、可达性与工作流执行架构的分层呈现。
    approximationNotes: 基于 Socket 平台文档和技术能力发布内容综合出的概念性功能栈。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE009
      - CE010
    data:
      layers:
        - label: 开发者与集成面
          detail: 开发者工作站界面、CLI 封装、软件包管理器钩子、IDE 扩展、GitHub/GitLab 应用，以及新兴的 MCP 智能体网关。
        - label: 政策与执行层
          detail: Socket Firewall 网络拦截、自动化 CI/CD 构建门禁、企业合规政策，以及经认证的安全补丁分发。
        - label: 核心智能与分析引擎
          detail: 持续接入注册表软件包、静态 AST 解析、行为启发式分析器，以及经人工核验的 AI 辅助威胁分流。
        - label: 可达性与调用图追踪
          detail: 函数级静态调用图和依赖调用追踪，过滤不可达漏洞代码产生的告警。
        - label: 全球威胁遥测与数据基础设施
          detail: 覆盖 npm、PyPI 和其他软件包注册表的实时数据流，追踪 85+ 项供应链风险指标和已知威胁行为者行为。
        - label: 治理、审计与安全控制
          detail: 企业审计日志、集中式软件包审查工作流、许可证合规追踪和管理员访问控制。
  - id: FU001
    title: 客户旅程与扩张生命周期
    type: journey-map
    summary: 客户从免费开发者采用走向企业治理和留存的可视化路径。
    data:
      items:
        - label: 1. 开发者发现
          description: 开源开发者或工程师安装免费的 CLI、GitHub App，或在 socket.dev 上检查软件包。
          touchpoints:
            - 免费软件包搜索
            - GitHub App 市场
            - Socket CLI 与 Firewall
        - label: 2. 团队启用
          description: 开发负责人采用付费 Team 计划（$25/dev/month），用于拦截 PR、接收 Slack 告警和可达性分析。
          touchpoints:
            - 拉取请求机器人评论
            - Slack 通知钩子
            - CI 流水线扫描门禁
        - label: 3. AppSec 标准化
          description: 安全团队升级至 Business 计划（$50/dev/month），以获得 SAML/SSO、SBOM 导出和 AI 工具覆盖。
          touchpoints:
            - 企业仪表盘
            - SBOM 导入与导出
            - AI 与扩展扫描
        - label: 4. 企业治理
          description: 中央采购合同为多 SCM 集成、SCIM 和专属 CSM 支持定制 Enterprise 层级。
          touchpoints:
            - GitLab / Bitbucket / Azure SCM
            - 集中式防火墙代理
            - 客户成功工程师入驻
        - label: 5. 扩张与附加产品
          description: Enterprise 通过开发者席位、Basics 容器扫描和 Certified Patches 扩大覆盖范围。
          touchpoints:
            - 席位数扩张
            - Socket Basics 容器
            - Certified Patches 推出
        - label: 6. 续约与审计
          description: 年度合同续约依据拦截攻击指标、开发者交付速度和合规审计日志评估。
          touchpoints:
            - 季度业务回顾
            - SOC2 / 合规导出
            - 年度续约协议
    approximationNotes: 该流程基于层级门槛和评审结果，展示典型的自下而上的 SaaS 开发者安全路径。
    claimRefs:
      - CU002
      - CU004
      - CU011
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按发生可能性和影响严重程度，评估 Socket 面临的主要运营、法律、合作伙伴和技术风险。
    approximationNotes: 评估综合了运营依赖和生态集成节点的定性判断。
    data:
      columns:
        - 影响可忽略
        - 影响低
        - 影响中等
        - 影响高
        - 影响严重
        - 影响极高
      rows:
        - label: 发生可能性极高
          values:
            - label: 轻微遥测偏移
            - label: 文档错别字
            - label: 误报告警造成的摩擦
            - label: 注册表 webhook 延迟
            - label: CI 构建队列延迟
            - label: 上游 API 速率限制阻断
        - label: 发生可能性高
          values:
            - label: 公开股票代码名称混淆
            - label: 遥测噪声
            - label: CLI 安装权限查询
            - label: AI MCP 托管服务延迟
            - label: 传递依赖包告警噪声
            - label: GitHub 原生打包竞争
        - label: 发生可能性中等
          values:
            - label: 商标查询重叠
            - label: 包索引重新编制
            - label: OAuth 令牌刷新失败
            - label: IDE 扩展版本滞后
            - label: 注册表格式 schema 变更
            - label: 上游大型平台政策转向
        - label: 发生可能性低
          values:
            - label: 硬件租赁混淆
            - label: 开发者门户宕机
            - label: 作用域包命名问题
            - label: 依赖搜索查询超时
            - label: 多阶段恶意软件规避
            - label: 供应链零日漏洞
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 六步投资判断链条将可观察的规模和融资事实，与决定投资判断的缺失证据分开。
    data:
      nodes:
        - id: market-need
          label: 供应链安全需求
          detail: 行为依赖检查回应了已有记录的企业关切。
        - id: product-proof
          label: 产品与客户证明
          detail: 已点名客户和由事件驱动的入驻流程，支持产品相关性判断。
        - id: scale-signal
          label: 公司披露的规模
          detail: 受保护组织和代码库数量是使用信号，不是收入。
        - id: financing-mark
          label: $1B 融资估值标记
          detail: Series C 的估值标记较前轮大约上升 3.2 倍。
        - id: economics-gap
          label: 运营经济性缺口
          detail: ARR、留存、利润率、烧钱速度、现金和优先权条款均缺失。
        - id: decision
          label: 观察；无公开目标价
          detail: 承诺资本之前，必须先完成私下尽调。
      edges:
        - from: market-need
          to: product-proof
        - from: product-proof
          to: scale-signal
        - from: scale-signal
          to: financing-mark
        - from: financing-mark
          to: economics-gap
        - from: economics-gap
          to: decision
    approximationNotes: 该图是定性的决策顺序，不代表概率、估值或转化率大小。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV014
      - CV015
