  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 基于证据的假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观情景
        - 使用规模转化为持久的付费企业增长，同时留存、利润率和烧钱效率强劲。
        - 用已核实的经常性收入和真正可比的软件交易检验 $1 billion 估值；公开信息无法支撑具体区间。
        - 点名客户、据报道的上手情况和产品差异化都是积极的先行指标。
        - 付费转化或扩张未能验证使用指标。
      - - 基准情景
        - 商业势头延续，但私有运营经济性仍不可得或仅得到部分核实。
        - 继续观察而不下注；要求价格或条款补偿尚未解决的经济性问题。
        - 这最符合当前“定性证据强、财务披露缺失”的组合。
        - 融资价格低于当前估值，或留存明显走弱。
      - - 悲观情景
        - 竞争、捆绑销售或变现疲弱压低增长，同时运营成本上升。
        - 预计倍数将大幅压缩，或面临低价轮风险；指定证据不足以支持精确的下行估值。
        - 竞争拥挤且员工数快照不一致，加剧不确定性。
        - 利润率疲弱、烧钱低效、客户集中，或优先权悬挂。
    notes: 由于指定公开来源没有 ARR、收入增长、留存、利润率、烧钱速度或标准化可比倍数，这些情景均为条件性的定性判断。
