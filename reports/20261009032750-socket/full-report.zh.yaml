  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与开发者工作流集成
        blocks:
          - type: paragraph
            body: >-
              Socket 是主动型软件供应链防御平台，旨在保护现代应用开发工作流免受恶意依赖和零日软件包篡改。由于开源软件估计占当代应用代码库的
              90%，完全依赖静态扫描或被动式通用漏洞披露（CVE）目录的传统漏洞管理工具，无法在代码执行前捕获新植入的恶意软件。              Socket
              实时扫描主要软件包注册表中的开源软件包和更新，填补这一结构性缺口。平台直接嵌入软件开发生命周期（SDLC），覆盖开发者设备、命令行界面、源代码控制代码库、拉取请求检查和持续集成（CI）流水线。开发者添加或更新软件包时，Socket
              会检查依赖的实际行为特征——如创建网络 socket、篡改文件系统、执行 shell、收集环境变量或使用混淆载荷——并在安装前拦截恶意组件。
            claimRefs:
