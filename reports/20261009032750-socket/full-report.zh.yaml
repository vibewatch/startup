      - number: '3.2'
        title: 能力维度、可达性与套餐取舍
        blocks:
          - type: paragraph
            body: >-
              正面对比能力基准显示，Socket 与同业平台存在明显架构差异。Snyk Open Source 等龙头强调自研漏洞情报，在公开数据库之前记录 CVE，并提供调用图可达性；Endor Labs 等专家则重点覆盖
              40+ 种语言的传递调用图可达性，据报道平均将噪声降低 92% 至 97%。相比之下，独立评论显示 Socket 的核心差异在安装时和运行时行为分析，能在 CVE
              通告发布前捕获零日供应链入侵、仿冒拼写和账户接管。各家商业套餐也明显不同：Socket 提供免费公开层，并按席位提供可达性、认证补丁和企业防火墙治理方案；Aikido 和 Snyk
              提供免费增值层；Chainguard、Endor Labs 和 ReversingLabs 等企业玩家则要求按报价签订年度企业承诺。此外，评估总拥有成本的买方注意到，面向开发者的 GitHub App
              虽能快速产生价值，但要在非 GitHub 源代码管理器上实现完整组织治理，必须升级更高企业层级。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
