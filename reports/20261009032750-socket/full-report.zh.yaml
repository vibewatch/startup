      - number: '4.2'
        title: 成本结构、单位经济与 GTM 效率代理指标
        blocks:
          - type: paragraph
            body: >
              由于 Socket 是一家处于早期增长阶段的私营企业，经审计 GAAP 损益表和成本明细未向公众披露。不过，其底层技术架构和市场进入方式仍可为成本结构与经营杠杆提供清晰代理。Socket
              的销售成本（COGS）主要包括多云计算基础设施（用于行为软件包引爆、静态分析和可达性图计算）、软件包注册表镜像与历史 AST 遥测的云存储，以及用于加速认证补丁生成和代码摘要的第三方 AI 推理 API。


              不同于依靠人工安全研究团队在披露后整理漏洞的传统软件成分分析（SCA）工具，Socket 在 npm、PyPI、Go、Maven 等软件包注册表上开展自动化实时行为分析，并结合 AI
              驱动的可达性分析。这种基础设施导向的方法前期计算和注册表索引成本较高，但基础监测上线后，增量毛利预计会非常高。毛利率预计可落在面向开发者的安全 SaaS 常见的 75% 至 85%
              区间，不过企业本地部署或私有数据边界要求可能带来托管摩擦。


              市场进入路径上，Socket 的免费增值产品驱动增长（PLG）显著缓冲了获客成本（CAC）。公司保护超过 27,000 个组织、保障 1.5 million 个代码库，且创始团队编写的开源软件每月下载量超过 1
              billion 次；开发者主动兴趣构成零成本漏斗顶部。销售效率来自活跃 CI 流水线中达到 Free 或 Team
              层门槛的开发者向内转化。不过，由于付费转化率、净留存率（NRR）和总收入留存率（GRR）仍未披露，投资判断模型无法确认大量受保护代码库是否转化为持续多年的企业扩张，还是仍集中在低 ACV 的自助层级。
