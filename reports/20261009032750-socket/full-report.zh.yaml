            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              该类别确实有交易活动，但现有案例只能提供背景，不能直接作为估值可比：CyberWire 报道 Akamai 以 $205 million 收购 LayerX，Cyera 以约 $50 million 收购
              Genie Security；但两笔交易都缺少将其与 Socket 标准化比较所需的收入、增长、利润率、产品范围和交易条款数据。Tracxn 也报道了已退出的竞争者， 但这不能证明 Socket 自身具备 IPO
              或被收购的准备度。在投资人拿到历史财务数据、队列留存、客户集中度、现金和烧钱数据、完全摊薄后的股权结构表、清算优先权及老股转让条款前，
              无法设定可信的目标回报、持有期或退出区间。付费转化疲弱、留存下降、利润率承压、烧钱低效或融资价格低于当前估值，都会触发投资逻辑失效。
            claimRefs:
              - CV005
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 融资不等于流动性
            body: 报道中的 $125 million 累计融资总额不能被当作可用现金、现金跑道或烧钱能力；指定来源没有披露这些余额。
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
          - type: callout
            title: 对价格敏感的决策
            body: 继续观察 Socket，但在验证经常性收入质量、单位经济、现金使用和优先权条款前，不要按 $1 billion 估值进行投资判断，也不要发布目标回报。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
