        blocks:
          - type: paragraph
            body: >-
              Socket 平台的核心技术差异在于行为分析引擎，以及 AI 辅助威胁分诊和人工验证。传统软件成分分析（SCA）方案依赖已知 CVE 数据库，而漏洞往往在公开披露数日或数周后才被记录；Socket 则通过监测超过
              85 个供应链风险指标，动态评估软件包风险。引擎拆解软件包源代码、依赖清单、安装脚本（如 preinstall 和 postinstall
              生命周期钩子）及作者元数据，标记作者冒用、维护突变、熵值飙升和网络传输逻辑等异常。此外，Socket Firewall
              和可达性检查能力可阻止受损依赖渗入企业构建代理或开发者工作站。通过判断漏洞函数或软件包是否确实处于应用执行路径中，Socket 大幅减少告警疲劳，让工程组织集中修复可被主动利用的威胁。
