      - number: '7.3'
        title: 平台集中、软件包注册表耦合与治理缓释
        blocks:
          - type: paragraph
            body: >-
              Socket 在主要开发者生态中面临明显的交易对手和基础设施集中。其主要摄取和拦截面直接依赖上游软件包注册表（npm、PyPI、Go）提供实时发布数据，也依赖 GitHub
              等平台托管方完成拉取请求检查、GitHub App 权限和代码库扫描 webhook。未公告的限流、API 弃用、模式变更或注册表政策转向，都可能削弱 Socket
              在安装前拦截零日恶意软件的能力。集成开发者平台的竞争反制——包括 GitHub Advanced
              Security、原生软件包管理器安全检查或自研云生态扫描器——也构成持续的平台集中风险。为缓释这些暴露，Socket
              扩大了多个注册表生态的覆盖，建立独立托管服务，并强化依赖搜索能力。治理尽调需要明确清算标准和投资逻辑破裂触发条件：严重平台锁定、注册表 API
              持续限流，或开发者工作流破坏性变更引发的重大客户流失，都将从根本上削弱 Socket 的平台防御力。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 自动化风险扫描中的实体辨析障碍
            body: >-
              自动化尽调流水线经常把 Socket Mobile, Inc.（NASDAQ: SCKT）的公开公司债务、经营租赁负债和营运资金赤字匹配到私营网络安全供应商
              Socket。区分这两个实体，是准确评估公司和财务风险的必要前提。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: 供应链防御中的行为启发式取舍
            body: 主动行为检测能在 CVE 发布前捕获零日恶意代码，但也会自然地对非标准软件包结构产生误报。管理分诊体验和开发者通知阈值，是 Socket 关键的运营平衡。
            calloutType: insight
            claimRefs:
              - CR006
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资标记与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Socket 于 2026 年 5 月宣布以 $1 billion 估值完成 $60 million Series C，由 Thrive Capital 领投，a16z、Abstract Ventures 和
              Capital One Ventures 参投；Tracxn 则记录本轮日期为 3 月 19 日。Tracxn 还记录 2024 年 10 月 $40 million Series B 的投后估值为 $312
              million，意味着约 18 至 19 个月内估值约上涨 3.2 倍。融资速度可观察，但不是收入倍数：保留来源没有披露 ARR、GAAP 收入、留存、毛利率、烧钱速度、可用现金或优先权条款。因此，$125
              million 累计融资描述的是募集资本，而不是当前流动性。入场纪律应将 $1 billion 标记视为尚未由公开运营经济数据验证，并在承诺投资前要求私有财务和资本结构证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是，Socket 抓住了一个真实且不断扩大的控制点：官方材料描述其对开源依赖进行行为检查，独立报道则提到知名 AI 和开发者工具客户，以及软件包安全事件后的快速接入。公司称保护超过 27,000
              个组织、1.5 million 个代码库，说明漏斗顶部规模可观，但这些分母不是付费客户、收入或留存指标。反向逻辑同样重要。Tracxn 识别出 81 家活跃竞争者，Market Briefs
              称网络安全独角兽群体拥挤，指定证据也没有独立验证的转化或软件经济数据。只有当尽调把使用规模与持久的付费扩张连接起来，并证明差异化经得住平台打包和类别拥挤，投资逻辑才会增强。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持精确的公允价值区间或目标回报，因此这些情景以投资判断条件表达，而不是虚构收入倍数。乐观情景要求证明广泛使用能转化为高质量经常性企业收入、强留存、有吸引力的毛利率和高效增长；只有这样，当前估值标记才可与真正的软件可比公司比较。基准情景保持观察立场：客户和产品信号令人鼓舞，但
              $1 billion 价格仍缺乏已披露经营数据支持。若付费转化、留存、利润率或烧钱证据令人失望，或竞争迫使公司打包销售并压低价格，悲观情景就会触发。员工数报告也存在约 100
              人的差异。这个缺口进一步说明需要当前运营数据室，而不是外推。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
