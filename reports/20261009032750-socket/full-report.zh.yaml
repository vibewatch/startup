      - number: '3.3'
        title: 护城河持久性、平台防御力与替代风险
        blocks:
          - type: paragraph
            body: >-
              Socket 的长期护城河能否持久，取决于其自研行为威胁情报和嵌入开发者工作流的能力能否顶住平台整合压力。2026 年以 $1 billion 估值完成的 $60 million Series
              C，为其将保护范围扩展到浏览器扩展、代码编辑器集成、AI 开发者工具和 Model Context Protocol（MCP）服务器提供了充足跑道。不过，切换成本呈现两极。对标准化采用 GitHub
              工作流的工程团队，Socket 的合并前 PR 反馈闭环带来较高用户留存和较低迁移摩擦。相反，优先整合供应商的企业采购委员会越来越偏好 Aikido 或 Snyk Enterprise
              这类统一平台，在一条预算项下覆盖更广的合规和代码级漏洞。最后，第三方基准评估显示，与传统 SCA 龙头相比，Socket 在主要软件目录中的独立评论覆盖仍相对有限，正式企业 RFP 评估时持续面临验证摩擦。
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: 工具泛滥与供应商整合的逆风
            body: >-
              Socket 在企业账户中的主要结构性逆风，是 AppSec 套件整合的宏观趋势。希望减少工具泛滥和管理开销的工程组织，经常面临将 SCA、SAST、IaC 和密钥管理打包进 Aikido 或 Snyk
              等统一平台的压力。当企业把单一供应商采购置于最佳行为恶意软件检测之上时，Socket 就有被替代的风险，除非 Socket Firewall 和认证补丁工作流能证明常规 CVE 扫描器无法复制的明确预防回报。
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP016
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >
              Socket Security, Inc. 以开发者席位授权为核心，通过多层级
              Software-as-a-Service（SaaS）订阅架构将软件供应链安全平台变现。不同于按扫描代码库、计算分钟数或代码行数计量用量的传统应用安全测试（AST）供应商，Socket
              直接按活跃贡献者定价，即过去 90 天内向被扫描代码库提交过代码的开发者。


              商业结构分为四级免费增值阶梯。入门 Free 层（每名开发者每月 $0）充当开发者采用引擎，为开源项目提供免费覆盖，并为小型商业团队提供最多 1,000 次扫描、3 名组织成员和单代码库可见性。 商业变现从
              Team 层开始（月付每名开发者每月 $25，年付约折扣 20%），容量扩大到每月 5,000 次扫描、10 个席位，并提供 Slack 通知集成和预计算可达性分析。对更大的工程组织，Business
              层（每名开发者每月 $50）取消扫描和成员上限，并解锁企业必备功能，包括 SAML/SSO、按 SPDX 和 CycloneDX 规范进行 SBOM 导入导出、合规集成和 GitHub Actions CI
              扫描。


              阶梯顶端的 Enterprise 套餐按客户定制并以报价为准，包含细粒度函数级可达性分诊、非 GitHub 源代码管理（SCM）集成（GitLab、Bitbucket、Azure DevOps）、通过 SCIM
              自动配置用户、集中式审计日志和专属技术客户管理等高级治理能力。此外，Socket 还在同一产品家族中组合 Socket Firewall（开发者笔记本免费，但集中网络代理管理需企业套餐）、Socket
              Certified Patches 和基础安全模块。这种自助式与销售驱动结合的模式，让 Socket 既能捕获开发者自下而上的采用，也能从企业买方取得六位数年度合同金额（ACV）。
