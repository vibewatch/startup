        - label: 扩展、AI 工具与 MCP 服务器
          detail: SecurityWeek 报道的扩展面
    approximationNotes: 各层级是定性的功能层级，不是嵌套的支出池。指定证据不足以支持软件 TAM、SAM 或 SOM，因此不推断美元数值或转化率。
    claimRefs:
      - CM002
      - CM007
      - CM008
      - CM009
      - CM010
  - id: FP001
    title: 竞争定位图：威胁检测重点 vs. 平台广度
    type: quadrant
    summary: 对软件供应链安全厂商进行可视化比较，呈现专业化行为威胁检测与多扫描器 AppSec 整合之间的差异。
    approximationNotes: 坐标轴代表基于 AppSec Santa 和 RFP.wiki 尽调证据中技术能力评测得出的序数定性评分；坐标体现相对架构侧重点。
    data:
      xAxis:
