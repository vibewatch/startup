            body: >-
              Socket 的技术价值主张依赖于在 npm、PyPI
              和相关注册表发布后数分钟内完成行为检查和主动软件包拦截。但这种架构也带来固有运营风险：启发式和行为检测机制可能把遥测异常或文件结构非标准的良性软件包更新标记为风险，在开发者 CI/CD
              工作流和自动化拉取请求中造成误报摩擦。如果开发者因未经验证的告警噪声而中断工作流，工程团队可能出现告警疲劳，甚至绕过拦截控制。此外，Socket 部署 Model Context
              Protocol（MCP）服务器和依赖搜索界面，将威胁面扩展至自动化 AI 智能体工作流。托管公开 MCP 端点并集成 Claude、VS Code Copilot 和 Cursor 等 AI
              助手，使其依赖公开服务器可用性、API 令牌认证和第三方模型集成的完整性。依赖评分工具服务降级或 API 延迟会直接损害开发者速度和实时安全态势评估。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
