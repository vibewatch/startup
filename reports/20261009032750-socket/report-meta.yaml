companyProfile:
  summary: >-
    Socket is a San Francisco-based, founder-led software supply chain security company founded in 2020. It sells a
    developer-first platform that inspects open-source dependencies for malicious behavior across GitHub, CI, and
    adjacent developer workflows, and monetizes through a freemium SaaS model with custom enterprise licensing. Public
    evidence shows strong adoption and a $60 million Series C at a $1 billion valuation, but the core operating
    economics that would justify a more aggressive valuation remain undisclosed.
