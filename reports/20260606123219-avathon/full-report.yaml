  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Relevant market scope
        blocks:
          - type: paragraph
            body: >-
              The cleanest narrow shell for Avathon is predictive maintenance and asset-performance software, but the
              company’s own pages clearly sell a broader industrial-operations and autonomy narrative. That broader
              shell includes safety, logistics, and cross-functional decision support around physical operations. That
              broader framing is why valuation and competitive comparisons need caution. A narrow maintenance-software
              lens understates Avathon’s exposure to safety, logistics, and government workflows, while an all-purpose
              “industrial AI” label risks becoming so wide that it stops being analytically useful. The sensible middle
              ground is to anchor on predictive maintenance and industrial-operations software, then explicitly show how
              adjacent spending pools can expand or compress the opportunity. A buyer does not have to adopt every
              module to validate the market thesis; one high-cost workflow can be enough to open the door. A buyer does
              not have to adopt every module to validate the market thesis; one high-cost workflow can be enough to open
              the door.
            claimRefs:
              - CM001
              - CM011
              - CM007
