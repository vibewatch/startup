        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Avathon is not a lightly regulated consumer software story. Defense procurement, aviation maintenance, and
              trade-compliance-linked workflows all raise the documentation and execution bar. The public record shows
              regulatory adjacency clearly enough to matter, even if it does not enumerate every obligation. The legal
              point is not that a specific public enforcement action has already occurred. It is that Avathon is
              stepping into environments where auditability, procurement integrity, human review, and domain-specific
              compliance become part of the product burden. That burden rises when software is used in defense, MRO, or
              other safety-sensitive settings, because buyers may tolerate less ambiguity around process controls than
              they would for a purely back-office analytics product. That distinction matters because a private company
              can accumulate meaningful compliance exposure before those obligations become visible in a public
              controversy. That distinction matters because a private company can accumulate meaningful compliance
              exposure before those obligations become visible in a public controversy. A disciplined risk read should
              therefore treat legal exposure as a diligence burden that rises with every move into government,
              aerospace, or operational-decision software. The public record also lacks the detailed privacy, audit, and
              liability pack that would let an investor decide whether Avathon's controls are mature enough for these
              settings. That is why regulatory risk here is mostly about proof quality and process readiness, not about
              one already-known court case.
