      - number: '3.2'
        title: Capability breadth is real, but pricing transparency is weak
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports the view that Avathon competes on breadth rather than on one isolated
              application. Google Cloud, Armada, BAE Systems, HSE/video-intelligence, and aerospace-and-defense
              materials collectively show that Avathon is trying to sell an industrial platform that spans predictive
              maintenance, supply-chain planning, visual AI, and regulated operational workflows. That gives Avathon a
              plausible cross-sell story and helps explain why simple one-to-one benchmarking against a single vendor
              can miss the company’s ambition.


              The problem is that breadth does not translate into clean pricing evidence. Avathon’s retained public
              surfaces do not publish standardized list prices or contract norms, and the same is broadly true for
              C3.ai, Augury, and the adjacent OT-security specialists reviewed here. Competitors emphasize ROI, case
              studies, or high-level product packaging; they rarely reveal per-asset, per-site, or services-inclusive
              commercial terms. That means even a reasonably strong feature comparison still leaves investors blind on a
              critical underwriting dimension: whether Avathon wins deals because its product is better, because it
              prices aggressively, or because it bundles services and partner delivery in ways outsiders cannot see.
