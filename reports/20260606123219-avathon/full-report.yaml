      - number: '3.3'
        title: Moat durability depends on proof, not just category language
        blocks:
          - type: paragraph
            body: >-
              The strongest bullish interpretation is that Avathon’s product breadth creates a durable wedge across
              multiple industrial workflows. Named customer proof in aviation and safety-critical settings suggests the
              company can land credible use cases, and partner relationships may reduce distribution friction. But the
              strongest skeptical interpretation is also visible in the retained evidence. Nozomi discloses an
              installation base and customer-retention metric that Avathon does not. C3.ai and public-company
              adjacencies disclose revenue and cash balances that make commercial maturity easier to judge. Dragos and
              related OT-security evidence show that resilience and incident-response narratives can outrank
              optimization stories when operators feel exposed.


              On balance, the moat case is plausible but not yet fully evidenced in public. Investors should preserve
              pricing opacity as a real diligence gap, ask for win-loss data instead of relying on marketing language,
              and separate three things that are easy to blur together in industrial AI: technical capability breadth,
              repeatable GTM motion, and pricing power. Avathon clearly demonstrates the first in public materials. The
              latter two remain much less proven from retained sources, which is why displacement and commoditization
              risk should still be treated as live issues rather than as solved problems. Investors should also test
              where Avathon can displace a legacy stack versus where it merely overlays existing tools, because overlay
              vendors often face budget compression faster than systems of record when industrial buyers retrench. That
              distinction matters in downturns. One more subtle risk is that buyers may prefer fewer vendors even if
              Avathon’s feature breadth looks attractive on paper. In industrial environments, incumbent relationships,
              existing procurement vehicles, and perceived balance-sheet durability can matter as much as feature lists.
              That means Avathon’s moat is not only technical; it also depends on proving that breadth translates into
              repeatable commercial wins against better-capitalized or better-known alternatives.
