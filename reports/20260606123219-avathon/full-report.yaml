              to current market reality but still indicative rather than dispositive. That split matters because it
              changes the valuation method. The 2022 round is a historical fact about where the company once financed;
              it is not proof that the same value should still anchor a 2026 memo. The secondary platforms are much
              noisier, but they are still useful because they force the diligence process to confront the possibility
              that public market appetite for private industrial-AI exposure has reset materially since the unicorn-era
              funding environment. In that sense, the valuation chapter is less about defending one exact number and
              more about deciding how much uncertainty the current evidence already forces an investor to price. In that
              sense, the valuation chapter is less about defending one exact number and more about deciding how much
              uncertainty the current evidence already forces an investor to price. That tension is exactly why the
              chapter does not try to split the difference mechanically. A stale high mark and a noisy low mark do not
