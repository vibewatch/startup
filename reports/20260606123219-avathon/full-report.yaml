      - number: '1.3'
        title: Funding history and valuation dispersion
        blocks:
          - type: paragraph
            body: >-
              The 2022 Series D is the cleanest financing anchor in the retained record. After that point, valuation
              evidence becomes noisy: ET lifts total raised to roughly $340 million, Yahoo/Forge and PremierAlts imply a
              much lower secondary-market value, and Latka is directly inconsistent with known funding history. That
              dispersion should shape diligence behavior. The Series D and SEC trail are usable historical anchors; the
              platform screens are stress indicators, not substitute cap-table records. Investors should therefore
              separate historical capitalization from current fair-value estimates, and ask management to reconcile
              secondary marks, total capital raised, and any post-2022 financing or secondary activity before relying on
              a single headline number. That reconciliation is a board-level diligence ask, not a cosmetic cleanup item.
              That is why the chapter keeps medium confidence on current fair value rather than pretending the databases
              agree.
