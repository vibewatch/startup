        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Aging assets, labor scarcity, and resilience risk support adoption. Data quality, OT/IT fragmentation, and
              AI-governance weakness slow it. That combination supports a positive market view, but one where deployment
              quality and conversion timing can vary dramatically. The market signal is therefore favorable but not
              frictionless. Category growth can be real even while adoption quality varies widely by plant, fleet, or
              program. Avathon’s addressable demand exists because industrial operators need better uptime and
              resilience, but conversion still depends on data readiness, integration work, and change management. That
              is exactly why the strongest vendors in this market are usually those that combine software, domain
              context, and deployment discipline. In other words, the category tailwind is real, but investors still
              need to underwrite conversion friction, not just headline CAGR. In other words, the category tailwind is
