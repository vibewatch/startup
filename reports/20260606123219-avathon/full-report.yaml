  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: visible products, invisible economics'
        blocks:
          - type: paragraph
            body: >-
              Avathon’s public materials make the revenue model legible at the product level, but not at the economic
              level. The company clearly sells into multiple industrial and government workflows: government maintenance
              support, battery-storage optimization, renewable-energy autonomy, liquid-bulk logistics planning, aviation
              MRO improvement, and a broader industrial AI platform for maintenance and resilience. This supports the
              idea that Avathon is not a single-use-case startup. It is trying to be a multi-vertical industrial
              software platform with several monetizable application layers.


              What remains missing is the commercial translation from those workflows into reported revenue. None of the
              retained official sources publish list prices, per-asset rates, contract minimums, or a clean
              software-versus-services split. The product releases imply enterprise contracts, implementation work, and
              partner-assisted delivery rather than self-serve SaaS. That has two consequences for underwriting. First,
              the business may have richer expansion potential than a single product surface implies. Second, revenue
              quality is still hard to judge because there is no public evidence on how much revenue is recurring
              software, how much is project-driven services, and how much channel partners keep or influence
              economically. The mining partnership with Draslovka points in the same direction.
