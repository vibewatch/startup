      - number: '2.3'
        title: Buyers and workflows
        blocks:
          - type: paragraph
            body: >-
              Across energy, renewables, manufacturing, aerospace, and logistics, the consistent buyer logic is
              physical-operations pain. The user may be an operator, reliability engineer, maintainer, or planner, but
              the sale starts when uptime, readiness, safety, or lead-time pain becomes costly enough. This buyer
              structure is helpful for judging GTM complexity. The economic buyer may sit in operations, reliability, or
              supply-chain leadership, but implementation often touches IT, safety, compliance, or defense-procurement
              stakeholders as well. That multi-threaded buying motion tends to lengthen cycles, increase proof
              requirements, and reward vendors that can connect technical outcomes to operational KPIs such as downtime,
              yield, safety events, and readiness. That is supportive of real demand, but it also explains why
              deployments often succeed or fail on cross-functional execution rather than on the model alone. That is
              supportive of real demand, but it also explains why deployments often succeed or fail on cross-functional
              execution rather than on the model alone.
