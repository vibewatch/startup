chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform thesis
        blocks:
          - type: paragraph
            body: >-
              Avathon now presents itself as a broad industrial-AI platform company rather than a narrow point-solution
              vendor. The retained company, platform, and rebrand pages all emphasize extending the life of critical
              infrastructure, integrating complex industrial data, and moving from isolated AI workflows toward
              autonomous operations. The rebrand also matters for market interpretation because it marks a shift from a
              general AI brand into a more operational, infrastructure-facing identity. The company now talks about
              industrial data, physical-asset uptime, and orchestration of real-world workflows instead of abstract
              enterprise AI. That positioning is important later in the report because it changes which peers, buyers,
              and diligence questions should dominate the underwriting conversation. The identity section therefore does
              double duty: it explains what Avathon says it is now, and it highlights how much of that story depends on
              post-rebrand execution rather than legacy SparkCognition brand recognition alone. It also explains why
              later chapters lean heavily on industrial-software, resilience, and operations-market lenses instead of
              treating the company as a generic AI vendor. In practical diligence terms, the identity shift should be
              tested against customer budgets, deployment ownership, and whether buyers truly adopt Avathon as a
              platform rather than a bundle of adjacent applications.
