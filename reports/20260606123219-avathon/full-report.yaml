      - number: '8.4'
        title: Recommendation and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The safest public-only posture is track / research-more with medium confidence. The most important next
              steps are to obtain current economics, reconcile valuation fields, and understand whether the post-rebrand
              traction is recurring or still largely narrative and pilot-driven. The practical consequence is that
              valuation discipline has to do more work than normal. If diligence later reveals strong ARR quality,
              reasonable margins, and repeat customer expansion, the current secondary range could look overly harsh. If
              it reveals pilot-heavy adoption, partner-dependent distribution, or weak recurring economics, even the
              current range may not be cheap enough. The only defensible public-only position today is a cautious one
              that treats missing economic data as a valuation input, not a footnote. The recommendation is therefore
              intentionally conservative: do the diligence work first, then decide whether the current range is a
              bargain or a trap. The recommendation is therefore intentionally conservative: do the diligence work
              first, then decide whether the current range is a bargain or a trap. For now, the recommendation is
              intentionally price-sensitive rather than company-dismissive. Avathon has enough strategic relevance to
              justify continued work, but not enough transparent economics to justify urgency. The burden of proof sits
              with the next diligence pack, not with the narrative.
