companyProfile:
  summary: >-
    Avathon, formerly SparkCognition, was founded in 2013 in Austin, Texas by Amir Husain to apply AI to industrial
    assets and infrastructure. In October 2024 the company rebranded as Avathon, launched a system-level Industrial AI
    platform, and relocated its headquarters to the San Francisco Bay Area. Public materials show a broad platform
    spanning predictive maintenance, asset performance, logistics, supply chain, visual AI, and government-defense
    workflows, with visible deployments across renewables, aviation, logistics, and military sustainment. The company
    remains strategically interesting, but the combination of sparse financial disclosure and conflicting
    secondary-market valuation signals prevents a high-conviction underwriting view.
  foundedDate: '2013-01-01'
  founders:
    - name: Amir Husain
      role: Founder and former CEO of SparkCognition
      background: >-
        Founded SparkCognition in Austin in 2013 and led the company through its early industrial-AI buildout and 2022
        Series D financing before current public leadership materials centered on CEO Pervinder Johar.
      claimRefs:
        - CO001
        - CO005
        - CO008
  foundingLocation: Austin, Texas, USA
  headquarters: San Francisco Bay Area, California, USA
  productSummary: >-
    Avathon sells an Industrial AI platform that combines knowledge-graph context, predictive and prescriptive
    maintenance analytics, logistics and supply-chain decision tools, visual AI, and defense-oriented modules such as
    Digital Maintenance Advisor and multi-domain awareness products. Public product materials emphasize normal behavior
    modeling, machine vision, natural-language processing, partner integrations, and deployment across capital-intensive
    physical operations.
  customerFocus: >-
    Energy operators, renewable developers, manufacturers, aerospace and defense organizations, logistics teams, and
    government customers running complex physical assets or supply chains where uptime, readiness, safety, and
    operational efficiency matter.
  businessModel: >-
    Enterprise software and solution sales centered on industrial AI applications, usually supported by partner-
    assisted go-to-market, implementation work, and government procurement channels. Public evidence points to recurring
    software value in APM, logistics, and visual AI, but pricing, gross margin, contract duration, and retention metrics
    are not disclosed.
  stage: Series D
  fundingStatus: >-
    Last disclosed primary round was a $123M Series D in January 2022 at a valuation above $1.4B, taking official
    disclosed capital to $300M. A November 2024 Economic Times interview reported roughly $340M total funding and said
    management viewed an IPO as 2-3 years away while prioritizing another private raise.
