  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The comp set is broad because Avathon is broad
        blocks:
          - type: paragraph
            body: >-
              The direct industrial-AI peer set is narrower than the buzz around "industrial AI" suggests. In retained
              sources, the cleanest direct comparisons are C3.ai Reliability and Augury because they explicitly position
              around reliability, process optimization, or predictive maintenance. Avathon’s own public surfaces support
              that framing: the platform page highlights predictive maintenance, anomaly detection, and optimization,
              while the 2024 rebrand and later vertical launches expand into logistics planning, renewable-asset
              autonomy, visual AI, and defense workflows. That breadth can be strategically useful, but it also widens
              the benchmark set far beyond pure maintenance vendors.


              The adjacent comp set therefore matters almost as much as the direct peer set. Nozomi, Dragos, and Claroty
              compete for OT and cyber-resilience budgets that often sit close to maintenance, reliability, and
              industrial-operations spending. Palantir and PTC matter less as narrow feature-matched peers than as
              examples of what buyers can do with broader enterprise or industrial software suites that come with larger
              balance sheets, public-company disclosure, and procurement familiarity. The practical diligence conclusion
              is that investors should not ask only "Is Avathon better than Augury or C3.ai?" but also "Which budget
              line is Avathon really trying to win, and which incumbents already own that committee?"
