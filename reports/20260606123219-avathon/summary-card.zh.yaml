  topRisks:
    - 没有可靠公开 ARR、毛利率、NRR、烧钱速度或客户集中度披露。
    - 2026 年二级市场估值来源暗示，公司较 2022 年独角兽轮出现大幅下调。
    - 企业、关键基础设施和政府销售周期长，执行消耗重。
    - 产品广度和品牌重塑后的扩张，抬高了集成、交付和聚焦风险。
