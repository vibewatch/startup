  topStrengths:
    - 工业 AI 平台覆盖面宽，横跨维护、物流、供应链、视觉 AI 和国防场景。
    - 可再生能源、航空、军事保障和能源基础设施的公开验证点，说明产品能在真实场景落地。
    - 2024-2025 年动能包括品牌重塑发布、Google Cloud 合作、Air Force 项目、Tradewinds 上架和 Army VIPER 奖项。
