evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR, revenue, gross margin, and burn-rate disclosures.
    whyItMatters: The overview cannot connect company narrative to present-day economics without them.
    diligencePath: Request current board pack and audited operating metrics.
    relatedQuestionRefs:
      - QO036
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Cap table, ownership percentages, and preference stack detail.
    whyItMatters: Control and liquidation terms affect every valuation read.
    diligencePath: Request cap table and investor-rights documents.
    relatedQuestionRefs:
      - QO037
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-enumeration-gap
    missingEvidence: A fully current executive roster, reporting lines, and board committee structure.
    whyItMatters: The overview chapter relies on a partial public roster, which limits governance and key-person risk assessment.
    diligencePath: Request the current org chart, board committee list, and executive biographies in the diligence room.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: milestone-enumeration-gap
    missingEvidence: A management-confirmed chronology of financings, product launches, partnerships, and adverse events.
    whyItMatters: >-
      The milestone table is the chapter chronology of record, so omissions would distort the company-overview
      narrative.
    diligencePath: >-
      Request a management timeline that reconciles all financing, leadership, product, partnership, and regulatory
      milestones since founding.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: segment-share
    missingEvidence: Vertical revenue mix, win rates, ACV, and deployment counts by segment.
    whyItMatters: Broad market shells are not enough to infer Avathon’s actual market position.
    diligencePath: Request segment-level bookings and customer counts.
    relatedQuestionRefs:
      - QM031
  - type: missing-source
    severity: minor
    topic: tam-som
    missingEvidence: Company-specific TAM/SAM/SOM math or bottoms-up segment assumptions.
    whyItMatters: Without it, scenario modeling will rely on category proxies.
    diligencePath: Ask management for internal market model and penetration assumptions.
    relatedQuestionRefs:
      - QM032
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Standard rate cards, typical contract minimums, services attachment, and realized discounting by product line.
    whyItMatters: >-
      Without commercial terms, public feature comparisons cannot be translated into payback, ASP, or pricing-power
      judgment.
    diligencePath: Request current pricing templates, top-20 deal summaries, and services vs software mix by product.
    relatedQuestionRefs:
      - QP004
      - QP020
      - QP026
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: Public or management-grade data on churn, multi-homing, replacement events, and win-loss history.
    whyItMatters: Moat durability depends on actual stickiness, not only on feature breadth or named-customer announcements.
    diligencePath: Request logo churn, top losses, displacement reasons, and evidence of renewal or expansion by cohort.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: Current customer count, ARR, by-vertical revenue split, and segment-level pipeline conversion.
    whyItMatters: Public product breadth is hard to value without evidence on where Avathon actually monetizes today.
    diligencePath: Request segment ARR, top customers by vertical, and active deployment counts by product family.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: competitor-pricing
    missingEvidence: Comparable public pricing or procurement documents for direct peers and OT-security adjacencies.
    whyItMatters: Normalized competitor pricing would materially improve apples-to-apples analysis of Avathon’s commercial position.
    diligencePath: >-
      Search procurement records, customer contracts, and partner quote sheets; ask management for live competitive
      price cards.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current unrestricted cash, monthly burn, and runway by base and downside case.
    whyItMatters: Financing dependency cannot be judged responsibly without a live liquidity view.
    diligencePath: Request current treasury report, burn bridge, and board runway scenarios.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: Gross margin, CAC, payback, NRR, and services-attachment economics.
    whyItMatters: >-
      The company cannot be valued like scalable software without evidence that software economics dominate delivery
      effort.
    diligencePath: Request current unit-economics dashboard by product family and channel.
    relatedQuestionRefs:
      - QI018
      - QI019
    relatedTableRefs:
      - TI003
      - TI002
  - type: conflicting-data
    severity: material
    topic: cumulative-funding-conflict
    missingEvidence: Reconciled cap-table history showing every round and total capital raised after 2022.
    whyItMatters: >-
      Current valuation interpretation changes materially depending on whether later capital actually entered the
      company.
    diligencePath: Request cap-table round history and reconcile Yahoo / ET / management numbers.
    relatedQuestionRefs:
      - QI017
      - QI027
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Split of software subscriptions, services, partner-sourced revenue, and government program revenue.
    whyItMatters: Revenue quality and scalability depend on mix, not just on named logos or product breadth.
    diligencePath: Request revenue segmentation by product, vertical, customer type, and channel.
    relatedQuestionRefs:
      - QI028
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Debt schedule, credit facilities, covenants, or project-finance structures tied to infrastructure deployments.
    whyItMatters: Hidden leverage can materially change financing risk even if equity history looks strong.
    diligencePath: Request debt and covenant summary plus any asset-level financing obligations.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: technical-metrics
    missingEvidence: Model accuracy, latency, uptime, deployment counts, and customer-side observability metrics.
    whyItMatters: Technical quality cannot be scored from architecture language alone.
    diligencePath: Request product telemetry, SLOs, and benchmark packs.
    relatedQuestionRefs:
      - QE029
  - type: missing-source
    severity: minor
    topic: security-controls
    missingEvidence: Explicit security-control, certification, or governance documentation for the current platform.
    whyItMatters: Industrial buyers and defense customers will care about verifiable control evidence.
    diligencePath: Request security white papers and audit summaries.
    relatedQuestionRefs:
      - QE030
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Renewal, NRR, and cohort data by customer segment.
    whyItMatters: Named proofs do not guarantee durable recurring economics.
    diligencePath: Request cohort tables and top-customer renewal history.
    relatedQuestionRefs:
      - QU029
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer concentration and revenue mix by sector.
    whyItMatters: A few large accounts could dominate economics or risk exposure.
    diligencePath: Request top-10 customer concentration data and sector mix.
    relatedQuestionRefs:
      - QU030
    relatedTableRefs:
      - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-gap
    missingEvidence: A complete named-customer roster with deployment stage, ACV, renewal status, and expansion history.
    whyItMatters: >-
      The chapter can show credible named proof, but the public record is still partial relative to the underlying
      customer base.
    diligencePath: >-
      Request the current customer-reference list, deployment stage by account, and renewal / expansion schedule for top
      customers.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: controls
    missingEvidence: Security controls, incident-response readiness, and governance documentation for the current platform.
    whyItMatters: Industrial buyers and government programs require trust evidence, not just workflow claims.
    diligencePath: Request security white papers, incident-response policy, and audit summaries.
    relatedQuestionRefs:
      - QR033
  - type: private-evidence-only
    severity: material
    topic: valuation-risk
    missingEvidence: Management view on how it interprets the gap between old primary pricing and current secondary signals.
    whyItMatters: Financing narrative risk can alter execution freedom.
    diligencePath: Request latest 409A, board valuation memo, and fundraising plan.
    relatedQuestionRefs:
      - QR034
    relatedTableRefs:
      - TR005
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register-gap
    missingEvidence: >-
      The full compliance pack covering security controls, procurement obligations, and legal review processes for
      defense and regulated industrial deployments.
    whyItMatters: The lead risk register is explicitly partial, so without a deeper pack the legal-risk map may understate exposure.
    diligencePath: >-
      Request security documentation, contracting controls, legal review memos, and any open compliance findings by
      vertical.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: current-economics
    missingEvidence: Current ARR, margin, NRR, pricing, and services mix.
    whyItMatters: No credible valuation call is possible without them.
    diligencePath: Request full KPI pack and audited recent financials.
    relatedQuestionRefs:
      - QV036
  - type: private-evidence-only
    severity: material
    topic: fair-value
    missingEvidence: Latest 409A, board-approved fair-value memo, and recent secondary transaction evidence.
    whyItMatters: Needed to reconcile stale primary pricing with current private-market screens.
    diligencePath: Request current 409A and any transaction history.
    relatedQuestionRefs:
      - QV037
    relatedTableRefs:
      - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-gap
    missingEvidence: >-
      A management-approved comparable set with current revenue, growth, margin, and contract-quality bridges to public
      peers.
    whyItMatters: >-
      The comparable table is explicitly partial, so misframing peers could distort the recommendation and fair-value
      range.
    diligencePath: >-
      Request the company’s internal public-comp bridge, secondary-mark evidence, and any board materials used to assess
      fair value.
    relatedTableRefs:
      - TV004
