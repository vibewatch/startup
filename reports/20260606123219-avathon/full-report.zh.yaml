companyProfile:
  summary: >-
    Avathon 原名 SparkCognition，2013 年由 Amir Husain 创立于德克萨斯州奥斯汀，目标是把 AI 用在工业资产和基础设施上。2024 年 10 月，公司更名为 Avathon，推出系统级工业 AI
    平台，并将总部迁至旧金山湾区。公开材料显示，这是一套横跨预测性维护、资产绩效、物流、供应链、视觉
    AI，以及政府和国防流程的平台，在可再生能源、航空、物流和军事保障中都有可见部署。公司仍有战略吸引力，但财务披露稀少、二级市场估值信号互相冲突，暂时无法形成高置信度投资判断。
  foundedDate: '2013-01-01'
  founders:
