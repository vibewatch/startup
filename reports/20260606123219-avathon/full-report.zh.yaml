  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议来自一组冲突：战略证明很强，但公开经济性很弱，估值信号也相互打架。
    data:
      nodes:
        - id: a
          label: 战略证明
          detail: 合作伙伴、政府和垂直领域落地
        - id: b
          label: 经济性不透明
          detail: 没有可靠的公开 ARR、利润率或 NRR
        - id: c
          label: 二级市场重估
          detail: 当前屏显价格远低于 2022 年独角兽锚点
        - id: d
          label: 基于公开证据的建议
          detail: 跟踪 / 继续研究，中等信心
      edges:
        - from: a
          to: d
          label: 支撑兴趣
        - from: b
          to: d
          label: 限制信心
        - from: c
          to: d
          label: 让立场保持谨慎
    approximationNotes: null
    claimRefs:
      - CV008
      - CV009
      - CV002
      - CV010
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 公开估值最大的驱动因素，是当前经济性披露、重复客户证明，以及任何新融资的方向。
    data:
      items:
        - label: 当前 ARR / 利润率正面披露
          value: 0.4
          unit: x conviction
          detail: 对信心的最大上行
        - label: 重复客户经济性变得可见
          value: 0.3
          unit: x conviction
          detail: 改善收入故事质量
        - label: 二级市场进一步走弱
          value: -0.5
          unit: x conviction
          detail: 对立场的最大下行
        - label: 合作伙伴牵引转化为可持续订单额
          value: 0.2
          unit: x conviction
          detail: 支撑乐观情形
    approximationNotes: null
    claimRefs:
      - CV008
      - CV009
      - CV010
  - id: FV003
    title: 估值回报区间
    type: range
    layout: standard
    summary: 公开区间从过时的独角兽锚点一路下探到当前私人市场屏显价格，基准情形更接近后者。
    data:
      items:
        - label: 历史锚点
          low: 1.4
          mid: 1.4
          high: 1.4
          detail: Series D 主轮估值，十亿美元
        - label: 当前公开区间
          low: 0.323
          mid: 0.329
          high: 0.335
          detail: Yahoo / PremierAlts 2026，十亿美元
        - label: 草案基准情形公允价值判断
          low: 0.3
          mid: 0.35
          high: 0.45
          detail: 在真实经济性披露前，仅作方向性区间
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV011
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 基于公开证据的投资评分卡，战略相关性最强，经济性和披露质量最弱。
    data:
