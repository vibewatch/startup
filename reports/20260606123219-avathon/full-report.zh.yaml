  foundingLocation: Austin, Texas, USA
  headquarters: San Francisco Bay Area, California, USA
  productSummary: >-
    Avathon 销售一套工业 AI 平台，把知识图谱上下文、预测性与处方性维护分析、物流和供应链决策工具、视觉 AI，以及 Digital Maintenance Advisor
    和多域态势感知等面向国防的模块组合在一起。公开产品材料强调正常行为建模、机器视觉、自然语言处理、合作伙伴集成，以及在资本密集型实体运营中的部署。
  customerFocus: 能源运营商、可再生能源开发商、制造商、航空航天和国防组织、物流团队，以及运营复杂实体资产或供应链的政府客户；这些场景看重正常运行时间、战备状态、安全和运营效率。
  businessModel: 围绕工业 AI 应用销售企业软件和解决方案，通常依靠合作伙伴协助 GTM、实施工作和政府采购渠道。公开证据指向 APM、物流和视觉 AI 中的经常性软件价值，但价格、毛利率、合同期限和留存指标均未披露。
