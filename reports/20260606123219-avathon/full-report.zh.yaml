        title: 图表与证据
        blocks:
          - type: callout
            title: 估值张力是概览主线
            body: 核心概览问题不是 Avathon 是否有叙事动能，而是这股动能能否解释 2026 年私募市场估值标记为何远低于 2022 年独角兽轮。
            calloutType: risk
