      - number: '4.3'
        title: 资本基础：2022 年证据扎实，2026 年估值信号嘈杂
        blocks:
          - type: paragraph
            body: >-
              历史融资证据是本章最干净的部分。PR Newswire 和多家独立转载支持 2022 年 1 月 $123M Series D，估值超过 $1.4B，使当时累计融资达到 $300M。SEC Form D
              结果也确认更早的豁免发行活动，进一步说明 Avathon 在更名前早已获得外部融资。这些事实可用。它们不是完整股权结构历史，但比投机性数据库条目扎实得多。


              相比之下，当前估值远未定论。Yahoo Finance 的 Forge 衍生私人公司页面指向约 $323M 的估算估值和超过 $653M 的累计融资；Premier Alternatives 暗示类似的低
              $300M 价值；Economic Times 则引用 $340M 累计融资。Latka 又叠加了更有问题的一层，声称收入 $30M、估值
              $90.1M，而且完全没有外部融资。这些不是小差异，而是不同现实。保守解读是，二级市场页面可作为方向性压力信号，但投资者应锚定扎实的历史融资披露，并在管理层完成对账前，把当前私人估值视为未解决问题。即便后来的
              World Economic Forum Unicorn Community 新闻稿，也更适合作为公司继续以独角兽身份进行市场叙事的证据，而不是当前公允价值的证明。
