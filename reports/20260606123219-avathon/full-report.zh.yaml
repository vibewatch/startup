      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              合作伙伴杠杆是一把双刃剑。Google Cloud、Armada、NVIDIA 和国防入口渠道提升能力和市场触达，也增加了对外部路线图、商业条款和运营可靠性的依赖。品类广度会放大依赖风险。Avathon
              越把自己销售成一个横跨云伙伴、边缘部署、视频智能和国防入口渠道的平台，执行质量就越依赖它无法完全控制的外部方。伙伴丰富的模式可以加速分发，但如果集成或采购路线意外变化，也可能压缩定价权、让支持边界复杂化，并造成路线图耦合。这使伙伴治理成为核心风险控制问题，而不是实施细节。这使伙伴治理成为核心风险控制问题，而不是实施细节。国防采购又增加一层，因为可见牵引可以早早支撑叙事，却未必证明耐久经常性收入。如果关键入口放缓、改变条款，或无法转化为可复制签约额，Avathon
              可能会发现外部杠杆对叙事的帮助大于对经济性的帮助。因此，依赖和集中度需要放在一起读，而不是当作两个独立勾选项。
