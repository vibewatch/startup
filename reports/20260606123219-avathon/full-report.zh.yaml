      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公司显然已经离开创始人主导日常公共领导的阶段。Pervinder Johar 是当前运营重心，2024
              年末扩充的团队又补上了战略、工程、商业和产品营销深度。公开治理能见度有所改善，但委员会结构和所有权仍未披露。这套领导组合传递出有用信号：Avathon 并不把自己包装成研究驱动的
              moonshot，而是在搭建面向工业商业化、国防项目和多垂直 GTM 的班底。剩下的治理缺口在于，投资者仍看不到委员会结构、股权集中度，以及 CEO
              交接后创始人影响力的准确程度。上述证据出现前，领导层深度可以视为有希望，但尚未完全证明治理成熟。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: 融资历史与估值分散
        blocks:
          - type: paragraph
            body: >-
              2022 年 Series D 是留存记录中最干净的融资锚点。此后估值证据开始嘈杂：ET 把累计融资抬到约 $340M；Yahoo/Forge 和 PremierAlts 暗示一个低得多的二级市场价值；Latka
              则与已知融资历史直接冲突。这种离散度应该改变尽调动作。Series D 和 SEC
              线索可作为历史锚点；平台截图是压力信号，不是股权结构记录的替代品。因此投资者应把历史资本结构和当前公允价值估计分开，并要求管理层在依赖任何单一头条数字前，对二级市场估值标记、累计融资额，以及 2022
              年后任何融资或二级交易作出对账。这是董事会层面的尽调要求，不是表面清理。因此本章对当前公允价值保持中等置信度，而不是假装数据库彼此一致。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: 里程碑与行进方向
        blocks:
          - type: paragraph
            body: >-
              最可信的初步判断是，Avathon
              的战略和产品动能比私募市场估值标记本身显示得更强。政府牵引、生态伙伴和多垂直发布让故事仍然成立，但缺少当前财务披露仍是公司概览中的核心缺口。时间线也说明，不能用一个指标压缩整个故事。更名后，Avathon
              补强了领导层，推出新垂直产品，并深化政府和生态入口，显示战略动能仍在延续。但同样的广度也提高了对可复制性、经济性和控制系统的证明要求，因为一家公司积累公告的速度可能快于积累耐久收入质量的速度。给后文的信号很直接：动能存在，但每增加一个垂直叙事，举证责任也更重。因此尽调框架必须把公告速度，与耐久经济性、治理控制和重复客户价值的证据分开。
            claimRefs:
              - CO012
          - type: table
            tableRef: TO004
            claimRefs:
              - CO001
              - CO008
              - CO002
              - CO012
