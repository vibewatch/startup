      - number: '2.3'
        title: 买方与工作流
        blocks:
          - type: paragraph
            body: >-
              横跨能源、可再生能源、制造、航空航天和物流，稳定的买方逻辑都是实体运营痛点。用户可能是操作员、可靠性工程师、维护人员或计划人员，但销售起点是正常运行时间、战备状态、安全或交期痛点已经贵到必须处理。这个买方结构有助于判断
              GTM 复杂度。经济买方可能坐在运营、可靠性或供应链领导层，但实施往往也牵涉
              IT、安全、合规或国防采购利益相关方。这种多线买方动作通常会拉长周期、提高证明要求，并奖励那些能把技术结果连接到停机时间、良率、安全事件和战备状态等运营 KPI
              的供应商。这支持真实需求存在，但也解释了为什么部署成败往往取决于跨职能执行，而不只是模型本身。这支持真实需求存在，但也解释了为什么部署成败往往取决于跨职能执行，而不只是模型本身。
            claimRefs:
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
          - type: figure
            figureRef: FM003
            claimRefs:
              - CM006
              - CM007
      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              老化资产、劳动力短缺和韧性风险支撑采用；数据质量、OT/IT 割裂和 AI
              治理薄弱则拖慢采用。这组因素支持正面的市场判断，但部署质量和转化时点可能差异极大。因此市场信号有利，却并非无摩擦。即使采用质量在不同工厂、车队或项目之间差别很大，品类增长仍可能真实存在。Avathon
              的可寻址需求来自工业运营商对更高正常运行时间和韧性的需要，但转化仍取决于数据准备度、集成工作和变革管理。这也正是为什么该市场中最强的供应商通常会把软件、领域上下文和部署纪律结合起来。换句话说，品类顺风真实存在，但投资者仍需要承接转化摩擦，而不只是头条
              CAGR。换句话说，品类顺风真实存在，但投资者仍需要承接转化摩擦，而不只是头条 CAGR。
            claimRefs:
