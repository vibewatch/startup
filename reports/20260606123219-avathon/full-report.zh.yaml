chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与平台论点
        blocks:
          - type: paragraph
            body: >-
              Avathon 现在把自己定义为一家宽口径工业 AI 平台公司，而不是狭窄的点解决方案供应商。留存的公司页、平台页和更名页面都强调：延长关键基础设施寿命，整合复杂工业数据，把孤立 AI
              流程推向自主运营。更名本身也影响市场解读，因为它标志着公司从泛 AI 品牌转向更贴近运营和基础设施的身份。公司如今谈的是工业数据、实体资产正常运行时间，以及真实世界工作流编排，而不是抽象的企业
              AI。该定位会影响报告后文的同业、买方和尽调问题选择，因此很重要。本节承担两件事：说明 Avathon 现在自称是什么，也点出这套叙事有多大程度取决于更名后的执行，而不只是旧 SparkCognition
              品牌认知。它也解释了为什么后文更多采用工业软件、韧性和运营市场的视角，而不是把公司当成普通 AI 供应商。落实到尽调，身份转向需要拿客户预算、部署所有权，以及买方是否真的把 Avathon
              当平台而非相邻应用包来检验。
