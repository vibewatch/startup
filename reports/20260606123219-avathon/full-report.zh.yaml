      role: SparkCognition 创始人、前 CEO
      background: 2013 年在奥斯汀创立 SparkCognition，带领公司完成早期工业 AI 建设和 2022 年 Series D 融资；目前公开领导层材料的中心已转向 CEO Pervinder Johar。
      claimRefs:
