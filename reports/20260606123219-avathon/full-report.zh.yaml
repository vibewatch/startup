  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与冲突
        blocks:
          - type: paragraph
            body: >-
              公开估值记录分成两个阶段：2022 年超过 $1.4 billion 的新股融资，以及 2026
              年二级市场平台显示约为该估值四分之一。前者是干净的历史记录；后者可能更接近当前市场现实，但仍只能指示，不能定论。这个分裂很重要，因为估值方法随之改变。2022
              轮次只是公司曾经以什么价格融资的历史事实，并不能证明同一价值仍该锚定一份 2026 年备忘录。二级平台噪音大得多，但仍有用，因为它迫使尽调正视一种可能：独角兽时代的融资环境过去后，公开市场对私营工业 AI
              敞口的胃口已经显著重置。从这个意义上，估值章节不是为某个精确数字辩护，而是判断现有证据已经迫使投资人给多少不确定性定价。从这个意义上，估值章节不是为某个精确数字辩护，而是判断现有证据已经迫使投资人给多少不确定性定价。正因为有这种张力，本章不试图机械折中。一个过期高点和一个嘈杂低点，平均不出真相。它们框定的是一个尽调问题。忽视重置信号的投资人是在做宣传；不核查价格来源就把重置当作已经完全证明的投资人，则是在另一个方向偷懒。
