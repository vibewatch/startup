      - number: '2.2'
        title: 规模区间与分母质量
        blocks:
          - type: paragraph
            body: >-
              分析师证据说明市场很大且在增长，但并不指向同一个东西。Allied、Mordor 和 MarketsandMarkets 描述的是相互重叠但并不完全相同的市场外壳。因此，用区间思维比押注一个“真实” TAM
              数字更站得住。这种区间差异不是缺陷，更像是线索。不同分析师纳入的传感器、APM 软件、服务、OT 安全和更广工业分析支出组合不同。基于这一点，本章把公开预测视为品类动能的方向性证据，而不是可直接塞进精确
              TAM/SAM/SOM 瀑布图的单一分母。投资者更该关注需求形态和采用障碍，而不是虚假的小数点确定性。因此正确结论是：Avathon 所在市场足够大，而不是某个精确 TAM
              已被证明。因此正确结论是：Avathon 所在市场足够大，而不是某个精确 TAM 已被证明。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
