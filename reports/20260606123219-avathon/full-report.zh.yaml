  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 相关市场范围
        blocks:
          - type: paragraph
            body: >-
              Avathon
              最干净的窄口径市场外壳，是预测性维护和资产绩效软件；但公司自己的页面显然在销售更宽的工业运营和自主化叙事。这一更宽外壳包括安全、物流，以及围绕实体运营的跨职能决策支持。也正因为如此，估值和竞争对标需要谨慎。只用维护软件视角会低估
              Avathon 对安全、物流和政府工作流的暴露；把它笼统称为“工业
              AI”又可能过宽，失去分析价值。更合理的中间路径是锚定预测性维护和工业运营软件，再明确展示相邻支出池如何放大或压缩机会。买方不必采用每个模块才能验证市场论点；一个高成本工作流就足以打开入口。买方不必采用每个模块才能验证市场论点；一个高成本工作流就足以打开入口。
            claimRefs:
              - CM001
              - CM011
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
