      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              工业 AI 产品风险与数据质量和运营安全分不开。Avathon 自己承认数据质量问题，IBM 和 Dragos 则说明糟糕治理和 OT 暴露为何会转化为实质业务影响。工业 AI
              出错时还会产生不对称下行。误报会浪费维护精力并侵蚀信任；漏报则可能让关键问题在无人发现的情况下发展为停机、安全事件或昂贵的战备问题。公开材料显示 Avathon
              理解数据质量挑战，但尚未提供谨慎投资者想要的完整外部证明材料包，包括安全控制、模型治理成熟度和失效模式处理。公开记录没有显示某个具体灾难性故障，但已展示足够品类层面的风险，足以支撑对控制质量的硬尽调。公开记录没有显示某个具体灾难性故障，但已展示足够品类层面的风险，足以支撑对控制质量的硬尽调。网络安全同样重要。面向
              OT 的软件即使不是最先被攻破的系统，也可能通过停机、应急响应或受损客户信任间接制造成本。这会让运营风险很快传导成商业风险。投资者应假设事件响应、模型监控和数据治理成熟度会影响估值，而不只是产品团队自己的事。
