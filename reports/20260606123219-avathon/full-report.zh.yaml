  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Avathon 越宽，对标集合越宽
        blocks:
          - type: paragraph
            body: >-
              直接的工业 AI 同业集合，比“工业 AI”热词暗示的更窄。在留存来源中，最干净的直接对比对象是 C3.ai Reliability 和
              Augury，因为它们明确围绕可靠性、流程优化或预测性维护定位。Avathon 自身公开界面也支持这种框架：平台页强调预测性维护、异常检测和优化；2024
              年更名及后续垂直发布则扩展到物流规划、可再生资产自主化、视觉 AI 和国防工作流。这种广度在战略上可能有用，但也把基准集合远远拉出了纯维护供应商范围。


              相邻对标集合因此几乎和直接同业一样重要。Nozomi、Dragos 和 Claroty 争夺 OT 与网络韧性预算，这些预算常常贴近维护、可靠性和工业运营支出。Palantir 和 PTC
              作为窄功能匹配同业并不那么重要，更重要的是它们展示了买方可以用更宽的企业或工业软件套件做什么；这些套件还带着更大的资产负债表、上市公司披露和采购熟悉度。实操尽调结论是，投资者不应只问“Avathon 是否优于
              Augury 或 C3.ai？”，还要问“Avathon 真正在争哪条预算线？哪些既有厂商已经掌握了那个委员会？”
