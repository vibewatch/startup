      - number: '3.3'
        title: 护城河耐久度取决于证据，不只是品类话术
        blocks:
          - type: paragraph
            body: >-
              最乐观的解释是，Avathon
              的产品广度在多个工业工作流中创造了耐久楔子。航空和安全关键场景中的具名客户证据表明，公司能够落地可信用例，合作伙伴关系也可能降低分发摩擦。但留存证据中同样能看到最强的怀疑解释。Nozomi 披露了 Avathon
              没有披露的安装基数和客户留存指标。C3.ai 及相邻上市公司披露收入和现金余额，让商业成熟度更容易判断。Dragos 和相关 OT 安全证据说明，当运营方感到暴露在风险中时，韧性和事件响应叙事可能压过优化故事。


              综合来看，护城河叙事合理，但公开证据尚未完全证明。投资者应把价格不透明保留为真实尽调缺口，要求提供赢单/输单数据，而不是依赖营销语言，并拆开工业 AI 中容易混在一起的三件事：技术能力广度、可复制 GTM
              动作和定价权。Avathon 在公开材料中清楚展示了第一点。后两者从留存来源看仍远未充分证明，因此替代风险和商品化风险仍应视为活问题，而不是已解决问题。投资者还应测试 Avathon
              在哪里能够替换旧技术栈，哪里只是叠加在既有工具之上，因为工业买方收缩时，叠加型供应商往往比记录系统更快受到预算挤压。这个差异在下行周期很重要。还有一个更细的风险：即使 Avathon
              的功能广度在纸面上好看，买方也可能偏好更少供应商。在工业环境中，既有关系、现有采购工具和感知到的资产负债表耐久度，可能和功能清单一样重要。这意味着 Avathon
              的护城河不只是技术问题，还取决于能否证明广度能在资本更充足或知名度更高的替代方案面前，转化为可复制的商业胜利。
