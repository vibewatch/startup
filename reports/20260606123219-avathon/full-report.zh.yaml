  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Avathon
              不是一个轻监管的消费者软件故事。国防采购、航空维护和与贸易合规相连的工作流，都会抬高文档和执行门槛。公开记录已经足够清楚地显示监管相邻性，足以影响判断，即使它没有列出每一项义务。法律要点不是某个具体公开执法行动已经发生，而是
              Avathon 正进入一些环境；在那里，可审计性、采购完整性、人工复核和特定领域合规都会成为产品负担的一部分。当软件用于国防、MRO
              或其他安全敏感场景时，这一负担会上升，因为相比纯后台分析产品，买方可能更不能容忍流程控制含糊。这个差异很重要，因为私人公司可以在这些义务通过公开争议显现之前，先积累可观合规暴露。这个差异很重要，因为私人公司可以在这些义务通过公开争议显现之前，先积累可观合规暴露。纪律化的风险判断因此应把法律暴露视为一种尽调负担；公司每进一步进入政府、航空航天或运营决策软件，这个负担都会上升。公开记录还缺少详细的隐私、审计和责任材料包，无法让投资者判断
              Avathon 的控制是否足以成熟到服务这些场景。因此这里的监管风险主要关乎证明质量和流程准备度，而不是某个已知法院案件。
