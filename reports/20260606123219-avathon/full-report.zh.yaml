      - number: '3.2'
        title: 能力广度真实存在，但价格透明度薄弱
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这样的判断：Avathon 竞争靠的是广度，而不是某一个孤立应用。Google Cloud、Armada、BAE Systems、HSE/视频智能，以及航空航天和国防材料合起来显示，Avathon
              正试图销售一套横跨预测性维护、供应链规划、视觉 AI 和受监管运营工作流的工业平台。这让 Avathon 的交叉销售故事更可信，也解释了为什么拿一家供应商做简单一对一对标，可能会漏掉公司的野心。


              问题在于，广度并不会自动转化为干净的定价证据。Avathon 留存的公开界面不发布标准化标价或合同惯例；C3.ai、Augury 和此处审阅的相邻 OT 安全专家大体也是如此。竞争对手强调
              ROI、案例研究或高层级产品包装；它们很少披露按资产、按站点或包含服务的商业条款。这意味着，即便功能对比相当扎实，投资者在一个关键投资判断维度上仍然看不清：Avathon
              赢单到底是因为产品更好、定价更激进，还是因为它以外部人看不见的方式捆绑了服务和合作伙伴交付。
