  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-economics
    missingEvidence: Current ARR, margin, NRR, pricing, and services mix.
    whyItMatters: No credible valuation call is possible without them.
    diligencePath: Request full KPI pack and audited recent financials.
    relatedQuestionRefs:
    - QV036
  - type: private-evidence-only
    severity: material
    topic: fair-value
    missingEvidence: Latest 409A, board-approved fair-value memo, and recent secondary
      transaction evidence.
    whyItMatters: Needed to reconcile stale primary pricing with current private-market
      screens.
    diligencePath: Request current 409A and any transaction history.
    relatedQuestionRefs:
    - QV037
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-gap
    missingEvidence: A management-approved comparable set with current revenue, growth,
      margin, and contract-quality bridges to public peers.
    whyItMatters: The comparable table is explicitly partial, so misframing peers
      could distort the recommendation and fair-value range.
    diligencePath: Request the company’s internal public-comp bridge, secondary-mark
      evidence, and any board materials used to assess fair value.
    relatedTableRefs:
    - TV004
