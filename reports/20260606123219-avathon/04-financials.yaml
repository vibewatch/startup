- id: capital-base-and-valuation-lenses
  title: 'Capital base: strong 2022 evidence, noisy 2026 valuation signals'
  body: 'Historical funding evidence is the cleanest part of the chapter. PR Newswire and multiple independent republications support a January 2022 Series D of $123 million at a valuation above $1.4 billion, bringing total capital raised at that time to $300 million. The SEC Form D result also confirms earlier exempt-offering activity, which reinforces that Avathon was externally funded well before the rebrand. Those facts are usable. They are not complete cap-table history, but they are materially stronger than speculative database entries.


    Current valuation, by contrast, is much less settled. Yahoo Finance’s Forge-derived private-company page points to an estimated valuation near $323 million and cumulative funding above $653 million, while Premier Alternatives implies a similarly low-$300 million value and the Economic Times cites $340 million total capital raised. Latka adds an even more problematic layer by claiming $30 million revenue, a $90.1 million valuation, and no outside funding at all. These are not small discrepancies. They are different realities. The conservative interpretation is that secondary-market pages are useful as directional stress signals, but investors should anchor on robust historical funding disclosures and treat current private valuation as unresolved until management reconciles it. Even the later World Economic Forum Unicorn Community press release is better read as evidence that the company continued to market itself as a unicorn than as proof of present-day fair value.'
