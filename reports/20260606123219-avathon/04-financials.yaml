- id: unit-economics-and-cost-structure
  title: 'Unit economics: customer proof exists, but margin evidence does not'
  body: 'Public customer and deployment proof is real. Avathon can point to Air Force work, Tradewinds availability, BAE Systems in aviation maintenance, UBS-backed battery projects totaling 730 MW, and Ørsted’s 5.5 GW renewable deployment. Those examples matter because they show product relevance across multiple verticals, not only slideware ambition. They also hint at a GTM motion that combines direct enterprise selling with partners, procurement channels, and ecosystem support from companies such as Google Cloud and Armada.


    But customer proof is not the same thing as unit-economics proof. The public record does not reveal gross margin, CAC, payback, NRR, or customer concentration. Pricing opacity means investors cannot tell whether growth comes from software leverage, heavy services work, aggressive discounting, or some mix of all three. Workforce signals likewise point in multiple directions: official India expansion plans and earlier hiring announcements imply a meaningful people-cost base, yet employee proxies from Yahoo, Built In, the Economic Times, and Latka do not align cleanly enough to support reliable efficiency analysis. The right conclusion is not that unit economics are bad; it is that public evidence is too thin to know. The late-2024 leadership-expansion release and the BlackBerry AtHoc integration further suggest that Avathon continues to spend against vertical domain coverage and partner-led commercial routes, even though the company does not disclose what that costs.'
