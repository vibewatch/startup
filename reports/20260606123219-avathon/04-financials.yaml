- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Why it matters
  - Exact diligence path
  rows:
  - - Current revenue / ARR
    - Blocking
    - Top-line scale cannot be underwritten from public evidence
    - Obtain monthly recurring-revenue bridge and audited or board-level revenue history
  - - Gross margin and services mix
    - Blocking
    - Need to separate software economics from implementation-heavy delivery
    - Request gross margin by product and services attachment rate
  - - Cash, burn, and runway
    - Blocking
    - Cannot assess financing urgency or downside resilience
    - Request current cash balance, burn rate, and runway by scenario
  - - Realized pricing and discounts
    - Material
    - Pricing opacity blocks payback and sales-efficiency analysis
    - Request rate cards, average contract value, and realized discount waterfall
  - - Customer concentration and contract duration
    - Material
    - Named logos do not show revenue dependence or renewability
    - Request top-20 customers by ARR and average contract term
  - - Debt, credit, or project finance
    - Material
    - Infrastructure exposure can hide leverage even when equity funding looks strong
    - Request debt facilities, covenants, and any special-purpose financing
  - - Post-2022 cumulative funding reconciliation
    - Material
    - Secondary-market and press sources disagree on total raised
    - Request cap-table round history and reconcile with Yahoo / ET estimates
  - - Software vs services revenue mix
    - Material
    - Without mix, revenue quality and scalability remain unclear
    - Request revenue segmentation by software, services, government, and partner channel
  notes: This chapter deliberately carries unresolved gaps forward instead of forcing false precision. Each row names the exact evidence needed to close the gap.
