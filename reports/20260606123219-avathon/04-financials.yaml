  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current unrestricted cash, monthly burn, and runway by base and downside case.
    whyItMatters: Financing dependency cannot be judged responsibly without a live liquidity view.
    diligencePath: Request current treasury report, burn bridge, and board runway scenarios.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: Gross margin, CAC, payback, NRR, and services-attachment economics.
    whyItMatters: The company cannot be valued like scalable software without evidence that software economics dominate delivery effort.
    diligencePath: Request current unit-economics dashboard by product family and channel.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs:
    - TI003
    - TI002
  - type: conflicting-data
    severity: material
    topic: cumulative-funding-conflict
    missingEvidence: Reconciled cap-table history showing every round and total capital raised after 2022.
    whyItMatters: Current valuation interpretation changes materially depending on whether later capital actually entered the company.
    diligencePath: Request cap-table round history and reconcile Yahoo / ET / management numbers.
    relatedQuestionRefs:
    - QI017
    - QI027
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Split of software subscriptions, services, partner-sourced revenue, and government program revenue.
    whyItMatters: Revenue quality and scalability depend on mix, not just on named logos or product breadth.
    diligencePath: Request revenue segmentation by product, vertical, customer type, and channel.
    relatedQuestionRefs:
    - QI028
    relatedTableRefs:
    - TI001
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Debt schedule, credit facilities, covenants, or project-finance structures tied to infrastructure deployments.
    whyItMatters: Hidden leverage can materially change financing risk even if equity history looks strong.
    diligencePath: Request debt and covenant summary plus any asset-level financing obligations.
