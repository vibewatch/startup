  topStrengths:
    - Broad industrial AI platform spanning maintenance, logistics, supply chain, visual AI, and defense use cases.
    - >-
      Public proof points across renewables, aviation, military sustainment, and energy infrastructure show real-world
      applicability.
    - >-
      2024-2025 momentum includes the rebrand launch, Google Cloud collaboration, Air Force work, Tradewinds listing,
      and Army VIPER award.
    - Industrial-domain positioning and partner ecosystem are differentiated from generic enterprise AI platforms.
    - >-
      The company still carries a unicorn-grade primary valuation anchor and visible access to strategic ecosystems in
      defense, energy, and logistics.
  topRisks:
