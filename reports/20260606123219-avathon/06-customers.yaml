  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Renewal, NRR, and cohort data by customer segment.
    whyItMatters: Named proofs do not guarantee durable recurring economics.
    diligencePath: Request cohort tables and top-customer renewal history.
    relatedQuestionRefs:
    - QU029
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer concentration and revenue mix by sector.
    whyItMatters: A few large accounts could dominate economics or risk exposure.
    diligencePath: Request top-10 customer concentration data and sector mix.
    relatedQuestionRefs:
    - QU030
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-gap
    missingEvidence: A complete named-customer roster with deployment stage, ACV, renewal status, and expansion history.
    whyItMatters: The chapter can show credible named proof, but the public record is still partial relative to the underlying customer base.
    diligencePath: Request the current customer-reference list, deployment stage by account, and renewal / expansion schedule for top customers.
    relatedTableRefs:
    - TU003
acknowledgedWarnings:
- dimension: figureType
  reason: Public sources do not disclose percentage retention cohorts, so the chapter substitutes an evidence-visibility matrix for the planned cohort figure.
