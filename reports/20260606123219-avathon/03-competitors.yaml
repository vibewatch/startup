  rows:
  - - Avathon
    - Direct industrial AI platform
    - Private; no current revenue, ARR, or customer count disclosed
    - Asset-intensive operators across energy, logistics, defense, aviation, safety
    - Broad multi-vertical scope across predictive maintenance, logistics, and visual AI
    - Pricing and commercial scale remain opaque
  - - C3.ai
    - Direct industrial AI / reliability
    - Public; ~$1.54B market cap and $250.27M ttm revenue on Yahoo (Jun 2026)
    - Large enterprises running predictive maintenance and operations AI
    - Detailed public reliability ROI claims and public-company disclosure
    - Still loss-making and broader enterprise AI exposure dilutes pure industrial focus
  - - Augury
    - Direct industrial AI / machine & process health
    - $75M round in 2025; maintains $1B+ valuation
    - Manufacturing and Fortune 500 industrial operators
    - Strong manufacturing focus with disclosed growth claims
    - Private-market economics and pricing still opaque
  - - Nozomi Networks
    - Adjacent OT / IoT security
    - 115M+ devices monitored; 12K+ installations
    - Critical infrastructure and industrial cyber defenders
    - Visibility, threat detection, and strong disclosed install base
    - Security-first posture rather than broad operational optimization
  - - Dragos
    - Adjacent OT security specialist
    - Thought-leadership heavy; OT threat dataset and incident-response positioning
    - Industrial operators prioritizing cyber resilience and response
    - Credibility with OT incident response and threat intelligence
    - Not a full predictive-maintenance suite
  - - Claroty
    - Adjacent CPS / xIoT security
    - SecurityWeek says ~$900M raised and path to IPO discussion
    - Enterprises buying xIoT security, exposure management, and secure access
    - Well-funded adjacent specialist with strong OT-security narrative
    - Evidence retained here is financing news, not product-pricing detail
  - - Palantir
    - Broad adjacent enterprise AI platform
    - Public; ~$340.90B market cap and $5.22B ttm revenue on Yahoo (Jun 2026)
    - Government and enterprise operations teams needing broad AI / data orchestration
    - Far greater disclosed resources and public-company transparency
    - Not a narrow predictive-maintenance specialist
  - - PTC
    - Industrial software incumbent / substitute
    - Public; ~$15.82B market cap and $3.0B ttm revenue on Yahoo (Jun 2026)
    - Industrial software buyers with existing product-lifecycle and operations stacks
    - Installed-base and balance-sheet scale exceed Avathon disclosures
    - Retained evidence here is scale-heavy, not detailed pricing or feature disclosure
  notes: Rows combine direct peers, adjacent specialists, and broader substitutes because Avathon’s own scope spans multiple industrial workflows. Public pricing remains sparse across the set.
