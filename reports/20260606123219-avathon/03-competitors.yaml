  - - Predictive-maintenance expertise
    - OT-security specialists can redirect budgets toward resilience and incident response
    - High
    - Request overlap analysis of Avathon vs security-led deal cycles
  - - Enterprise pricing power
    - Public pricing opacity blocks third-party validation of payback and discount discipline
    - High
    - Request standard rate cards, realized ASPs, and services gross margin by product
  - - Switching costs
    - No public churn or multi-homing data shows actual stickiness
    - Medium
    - Request logo churn, replacement events, and reasons for wins and losses
  notes: Severity reflects diligence materiality, not confirmed customer losses. Several risks exist because public disclosure is thin, not because failure has been proven.
