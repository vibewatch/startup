companyProfile:
  summary: >-
    Alpaca is a San Mateo-based API-first brokerage infrastructure company and self-clearing
    broker-dealer founded in 2015 by Yoshi Yokokawa and Hitoshi Harada. Originally a financial
    time-series database startup (MarketStore), it pivoted in 2018 to brokerage-as-a-service,
    enabling global fintechs, neobanks, crypto exchanges, and wealth platforms to embed US
    equities, ETFs, options, fixed income, and crypto trading through its Broker API and
    Trading API. Alpaca self-clears through DTCC (equities), OCC (options), and FICC
    (Treasuries), eliminating third-party clearing costs and capturing the full economics of
    each trade. The company raised a $150M Series D at a $1.15B unicorn valuation in January
    2026 led by Drive Capital, with co-investors including Citadel Securities, BNP Paribas,
    MUFG, and Kraken, bringing total disclosed funding to $320M+. In April 2026 Alpaca
    acquired WealthKernel to establish Alpaca Europe, and in June 2026 launched the Binance
    stock trading integration serving Binance's 300M+ user base.
  foundedDate: "2015-01-01"
  founders:
    - name: Yoshi Yokokawa
      role: Co-Founder & CEO
      background: >-
        Former investment banker (Lehman Brothers, US and Japan); personal algorithmic trader
        whose experience with inadequate retail tooling catalyzed the Alpaca founding;
        primary public spokesperson and strategic driver since 2015; central to Japan and APAC
        institutional relationships.
      claimRefs: [CO010]
    - name: Hitoshi Harada
      role: Co-Founder & CPO
      background: >-
        Engineering and product co-founder; financial data engineering background; leads API
        architecture and product roadmap including MarketStore, the Broker API, and the
        Universal Transaction System clearing platform.
      claimRefs: [CO011]
  foundingLocation: San Mateo, California, USA
  headquarters: San Mateo, California, USA
  productSummary: >-
    Two primary API products: the Broker API—a full-stack brokerage-as-a-service enabling
    fintechs and institutions to embed US stocks, ETFs, options, fixed income, and crypto—and
    the Trading API targeting algorithmic traders and prop firms. Ancillary products include
    fully paid securities lending, a high-yield cash sweep, 24/5 US equity trading, multi-leg
    options, and the Instant Tokenization Network for on-chain US equity custody. Alpaca
    self-clears through DTCC, OCC, and FICC, completing the full trade lifecycle in-house.
  customerFocus: >-
    Global fintechs, neobanks, crypto exchanges, wealth platforms, robo-advisors, Islamic
    finance apps, and institutional broker-dealers seeking to embed US brokerage infrastructure
    in their products, primarily outside the US domestic retail market.
  businessModel: >-
    B2B2C multi-stream broker economics: payment for order flow (PFOF), API and platform fees,
    margin lending interest, fully paid securities lending income, high-yield cash sweep spread,
    and crypto maker-taker fees. Revenue scales with partner trading volume and account activity;
    self-clearing eliminates third-party clearing costs and retains the full economic value of
    each transaction.
  stage: Series D (private, venture-backed)
  fundingStatus: >-
    $150M Series D at $1.15B post-money valuation (Jan 2026) led by Drive Capital;
    $320M+ total disclosed funding across nine rounds since 2017; $40M line of credit
    secured alongside the Series D (lender and terms undisclosed).
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO010, CO011, CO025, CO026, CO028]
