evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: >-
      Full board composition beyond Chris Olsen (Drive Capital) and the co-founders is not publicly disclosed; C-suite
      executives beyond CEO and CPO are unconfirmed in external sources as of the run date.
    whyItMatters: >-
      Board governance and broader leadership team affect assessment of key-person risk, succession planning, and
      institutional accountability—all of which are material to investment diligence.
    diligencePath: >-
      Request a full leadership and board roster from Alpaca investor relations; cross-reference any SEC filings or
      FINRA registration disclosures that list control persons.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: revenue-headcount
    missingEvidence: >-
      Alpaca does not publicly disclose audited revenue figures, exact headcount by geography, or employee count; the
      revenue growth claim (doubled YoY) is company-stated in a press release without independent audit.
    whyItMatters: >-
      Revenue and headcount are standard KPIs for investment diligence; unverified figures limit financial analysis in
      later chapters (financials, valuation).
    diligencePath: >-
      Request management accounts or audited financials directly from Alpaca; cross-reference LinkedIn headcount trends
      and public job postings for triangulation.
    relatedQuestionRefs:
      - QO024
      - QO028
  - type: conflicting-data
    severity: minor
    topic: brokerage-account-count
    missingEvidence: >-
      Alpaca's about-us page states 7M+ brokerage accounts while the January 2026 Series D blog states 9M+; no
      date-specific intermediate reports are available to confirm the growth trajectory between the two figures.
    whyItMatters: >-
      The difference (7M vs. 9M) is material to scale narrative; unclear whether it reflects different measurement
      dates, different counting methodology (accounts vs. funded accounts), or different entity scope.
    diligencePath: >-
      Request a reconciliation of these figures from Alpaca with explicit measurement date, methodology definition, and
      entity perimeter.
  - type: enumeration-incomplete
    severity: minor
    topic: series-d-minor-investors
    missingEvidence: >-
      Several Series D participants (Flat Capital, Altered Capital, X&KSK, Bank Muscat, Unbound, Diagram, Social
      Leverage, Vlad Yatsenko) are confirmed in the company blog but their specific ticket sizes, governance rights, and
      strategic relationships are not disclosed.
    whyItMatters: >-
      Understanding the full investor roster and any strategic commercial obligations is important for assessing
      alignment of interests, potential conflicts, and preferential treatment clauses.
    diligencePath: Request the full capitalization table and any side letters from Alpaca IR as part of formal due diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone-internal-launches
    missingEvidence: >-
      Several Alpaca product milestones—including the exact dates of AlpacaJapan JSDA registration, Alpaca Crypto LLC
      NMLS registration, AlpacaX Bahamas formation, and the precise timing of the Alpaca Securities to Alpaca Clearing
      operational rename—are not confirmed by independent sources.
    whyItMatters: >-
      Accurate milestone chronology is the foundation for later chapters' analysis of regulatory trajectory and
      international market entry pacing.
    diligencePath: >-
      Review FINRA registration amendment history in CRD; review JSDA and SCB public registers directly; request Alpaca
      corporate timeline from IR.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: alpaca-europe-regulatory-details
    missingEvidence: >-
      Alpaca Europe's FCA and MiFID authorization details (firm reference number, regulated activity scope, authorized
      entity name post-WealthKernel rebrand) are not confirmed by a regulatory filing or FCA register excerpt in the
      source set.
    whyItMatters: >-
      Regulatory authorization scope determines what Alpaca Europe can offer to UK and EU partners; gaps here would
      affect the European market entry narrative.
    diligencePath: >-
      Search FCA Financial Services Register for 'WealthKernel' and 'Alpaca Europe'; retrieve the relevant firm
      authorization pages directly.
  - type: missing-source
    severity: material
    topic: market-sizing-SOM
    missingEvidence: >-
      An independent bottom-up estimate of global brokerage API infrastructure fee revenue in isolation from transaction
      volumes or broader embedded finance categories
    whyItMatters: >-
      Without isolated fee market sizing, investors cannot assess Alpaca's revenue capture rate against a precise SAM;
      all current sizing proxies are either too broad (embedded finance $115–156B) or only partially applicable
      (fractional share infra $4.8B)
    diligencePath: >-
      Commission a bespoke analysis of disclosed revenue at Apex (private), DriveWealth (private), Alpaca (private), and
      public proxies at IBKR to build a bottom-up market model; alternatively, derive from FINRA net capital reports for
      PFOF and clearing revenue components
    relatedQuestionRefs:
      - QM002
