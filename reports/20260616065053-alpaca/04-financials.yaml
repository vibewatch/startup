  - id: "unit-economics"
    title: "Unit Economics and the Self-Clearing Dividend"
    body: >-
      Alpaca's transition to full self-clearing is the central driver of its improving unit economics. Before DTCC
      approval in 2024, Alpaca paid per-trade clearing fees to a third-party clearing firm, which captured a
      meaningful portion of the margin and securities lending economics that would otherwise accrue to Alpaca.
      By joining DTCC (equities clearing), OCC (options clearing, approved August 2025), and FICC (Treasuries and
      repos, approved August 2025), Alpaca now controls the full trade lifecycle—execution, clearing, settlement,
      and custody—and retains the complete economic value of each transaction. This internalisation of the clearing
      function eliminates the per-trade fees previously paid to an outside clearer and allows Alpaca to capture
      margin interest and securities lending income directly.


      The strategic parallels to Interactive Brokers illustrate the potential margin upside from full self-clearing
      at scale. IBKR, a mature self-clearing global broker, reported a 75% pretax profit margin for Q4 2024,
      $477 million in commission revenue for the quarter (up 37% year-over-year on higher trading volumes), and
      $3.1 billion in net interest income for FY2024—its dominant revenue line, growing 13% year-over-year. By
      FY2025 IBKR reached $6.2 billion in total revenue with consistent ~77% pretax margins, demonstrating what
      a mature, self-clearing, multi-asset global broker can achieve. Robinhood's trajectory adds a different data
      point: in 2021 over 77% of its net revenue was PFOF-based; by FY2024 Robinhood had diversified and reached
      $2.95 billion in total revenue (up 58% year-over-year), but the transition away from PFOF dependence required
      substantial reinvestment and product expansion. Alpaca's ability to replicate IBKR-style margin efficiency
      will depend on the pace of volume growth, partner diversification, and cost discipline in compliance,
      technology, and clearing operations.


      Alpaca's self-clearing cost structure includes compliance and legal overhead, the proprietary Universal
      Transaction System clearing platform operations, market data subscriptions, partner-facing customer support,
      regulatory capital reserves under SEC Rules 15c3-1 and 15c3-3, bank and payment connectivity for ACH, wire,
      and FDIC sweep programs, and ongoing clearinghouse membership fees across DTCC, OCC, FICC, and Nasdaq Exchange.
      The architecture—built on Flatbuffers for zero-copy data interchange and Redpanda for high-throughput
      messaging—reflects a deliberate technology investment to minimize per-unit operating costs. As a benchmark,
      IBKR's own execution, clearing, and distribution fees expense totalled $115 million in Q4 2024 alone, illustrating
      that clearing cost management remains critical even for highly efficient operators.
