  - id: "FI003"
    title: "Unit Economics Bridge"
    type: "flow"
    layout: "wide"
    summary: >-
      Trade activity enters Alpaca's clearing stack and generates revenue across three capture points; the self-clearing
      transition determines how much of the value is retained rather than paid to an intermediary.
    data:
      nodes:
        - id: "order-flow"
          label: "Order Flow from Partners"
          detail: "Partner platforms generate equity, options, fixed income, and crypto orders via Broker and Trading APIs."
          tone: "positive"
        - id: "execution"
          label: "Execution and Routing"
          detail: "Alpaca routes orders; market makers pay PFOF for uninformed retail flow. Commission-free to end users."
          tone: "neutral"
        - id: "clearing-settlement"
          label: "Clearing and Settlement (In-House)"
          detail: "DTCC (equities), OCC (options), FICC (Treasuries): all in-house since 2024–2025. Eliminates third-party fees."
          tone: "positive"
        - id: "revenue-capture"
          label: "Revenue Capture Points"
          detail: "PFOF, margin interest, FPSL, cash sweep spread, and API fees are retained at this stage."
          tone: "positive"
        - id: "cost-pool"
          label: "Cost Pool"
          detail: "Clearing ops, compliance, market data, regulatory capital, bank connectivity, technology licensing."
          tone: "warning"
        - id: "partner-dilution"
          label: "Partner Revenue Sharing"
          detail: "Binance 50% PFOF / 65% lending split; other partner arrangements unknown."
          tone: "warning"
        - id: "net-economics"
          label: "Net Unit Economics"
          detail: "Retained after costs and partner sharing; not publicly disclosed. IBKR benchmark: ~71–77% pretax margin at maturity."
          tone: "neutral"
      edges:
