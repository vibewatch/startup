  - id: "FI004"
    title: "Capital Intensity and Cost Structure Matrix"
    type: "matrix"
    layout: "wide"
    summary: >-
      Operating a self-clearing multi-asset broker carries seven distinct cost categories; Alpaca's technology
      investments aim to lower per-unit costs, but regulatory capital and compliance remain fixed burdens at scale.
    data:
      columns:
        - "Self-Clearing Impact"
        - "Scale Sensitivity"
        - "Underwriting Confidence"
      rows:
        - label: "Compliance and legal"
          values:
            - label: "Ongoing"
              tone: "warning"
              detail: "FINRA, SEC, OCC, FICC compliance; multiple regulatory event remediation (SEC 2024 order)."
            - label: "Fixed-plus-variable"
              tone: "neutral"
              detail: "Base compliance cost is relatively fixed; grows with new licenses and jurisdictions."
            - label: "High"
              tone: "positive"
              detail: "Publicly disclosed regulatory footprint gives cost category visibility."
        - label: "Clearing technology operations"
          values:
            - label: "Internalized"
              tone: "positive"
              detail: "Proprietary UTS platform (Flatbuffers, Redpanda) eliminates vendor dependency but adds ops cost."
            - label: "Variable"
              tone: "neutral"
              detail: "Scales with transaction volume; architecture designed for efficiency."
            - label: "Low"
              tone: "warning"
              detail: "Internal tech spend not publicly disclosed; estimated as a core capex category."
        - label: "Market data subscriptions"
          values:
            - label: "Necessary"
              tone: "warning"
              detail: "Exchange fees for real-time data; standard clearing member cost."
            - label: "Fixed-plus-volume"
              tone: "neutral"
              detail: "Base fees plus incremental per-query or per-user charges from exchanges."
            - label: "Low"
              tone: "warning"
              detail: "No public disclosure of data spend."
        - label: "Regulatory capital reserves"
          values:
            - label: "Required"
              tone: "warning"
              detail: "SEC Rule 15c3-1 (net capital) and 15c3-3 (customer reserve) mandate ongoing capital lock-up."
            - label: "Volume-correlated"
              tone: "warning"
              detail: "Customer reserve grows proportionally with account balances; constrains capital efficiency."
            - label: "Medium"
              tone: "neutral"
              detail: "Minimum net capital requirement is $250K but actual capital lock-up inferred to be significantly higher."
        - label: "Bank and payment connectivity"
          values:
            - label: "Expanding"
              tone: "neutral"
              detail: "ACH, wire, FX, sweep bank relationships, and cross-border payment rails for 40+ countries."
            - label: "Fixed-plus-geography"
              tone: "neutral"
              detail: "Each new jurisdiction adds connectivity cost."
            - label: "Low"
              tone: "warning"
              detail: "Specific costs not disclosed."
        - label: "Licensing and membership fees"
          values:
            - label: "Mandatory"
              tone: "warning"
              detail: "DTCC, OCC, FICC, FINRA, Nasdaq Exchange Member fees; growing as new memberships are added."
            - label: "Mostly fixed"
              tone: "neutral"
              detail: "Membership fees are largely fixed; volume-based components at DTCC/OCC."
            - label: "Medium"
              tone: "neutral"
              detail: "Individual fee schedules are public; blended total not disclosed."
        - label: "Customer and partner support"
          values:
            - label: "Scales with partners"
              tone: "neutral"
              detail: "Supporting 300+ B2B partners across 40+ countries; technical integration and ops support overhead."
            - label: "Variable"
              tone: "neutral"
              detail: "Headcount-driven; scales roughly linearly with partner count."
            - label: "Low"
              tone: "warning"
              detail: "Headcount not publicly disclosed; support cost inferred from partner scale."
    approximationNotes: >-
      Scale sensitivity and confidence ratings are qualitative assessments derived from regulatory filings, IBKR
      comparables, and Alpaca's public disclosures. No Alpaca-specific cost data is publicly available. IBKR's
      Q4 2024 clearing cost of $115M/quarter serves as the upper-bound comparable for a mature self-clearing operator.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI018
      - CI040

callouts:
  - calloutType: "strength"
    title: "Self-Clearing Unlocks IBKR-Grade Economics at Scale"
    body: >-
      By internalizing clearing across DTCC, OCC, and FICC, Alpaca eliminates the third-party clearing margin
      leakage that constrained its economics as an introducing broker. Interactive Brokers—the most comparable
      mature self-clearing multi-asset global broker—operates at 71–77% pretax margins, with net interest income
      as its dominant revenue line. Alpaca's trajectory toward that margin profile is credible, though currently
      unverifiable given absent margin disclosure.
    claimRefs:
      - CI011
      - CI012
      - CI027
      - CI028
      - CI040

  - calloutType: "risk"
    title: "Binance Revenue Share Halves PFOF and Lending Economics on a Dominant Partner"
    body: >-
      The June 2026 Binance disclosure revealed that Binance receives 50% of Alpaca's PFOF and 65% of securities
      lending profit (after user interest) on all Binance-sourced accounts. Combined with Binance's minority equity
      stake in Alpaca, this creates a structural revenue dilution for what is likely one of Alpaca's largest single
      partner relationships by volume. The omnibus custody structure amplifies concentration risk: a single regulatory
      action against Binance's ADGM-regulated entity could affect a significant portion of Alpaca's AUC simultaneously.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI039

  - calloutType: "risk"
    title: "PFOF Regulatory Headwinds Are Real and Accelerating"
    body: >-
      The EU banned PFOF under MiFIR Article 39a effective end-June 2026, directly impacting Alpaca Europe. The
      SEC is implementing Rule 605 amendments with an August 2026 compliance date. UK, Australia, Canada, and
      Singapore have already curtailed PFOF. The SEC DERA working paper on PFOF (January 2025) noted the practice
      generated $3.8 billion annually across the twelve largest US brokerages—illustrating the scale of potential
      revenue at risk if US regulation follows the EU path. Alpaca's diversified revenue model reduces but does not
      eliminate this risk.
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI030

  - calloutType: "recommendation"
    title: "Underwriting Requires Disclosure of Gross Margin, Credit Terms, and NRR"
    body: >-
      A completed financial judgment is not possible without: (1) audited revenue and gross margin data to validate
      the Sacra growth estimates; (2) terms of the $40M line of credit—lender, rate, covenants, maturity, and drawn
      amount; (3) net revenue retention to assess B2B revenue quality; and (4) an aggregate partner revenue
      concentration analysis. These four items are the minimum data room requirements before financial underwriting
      can proceed with confidence.
    claimRefs:
      - CI036
      - CI037
      - CI038
      - CI022
      - CI024

