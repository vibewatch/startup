  - id: "capital-structure"
    title: "Capital Structure, Funding, and the $40M Credit Facility"
    body: >-
      Alpaca raised $150 million in Series D equity financing in January 2026, led by Drive Capital at a $1.15 billion
      post-money valuation—establishing unicorn status and bringing total disclosed funding to more than $320 million.
      Alongside the equity raise, the company secured a $40 million line of credit to strengthen its balance sheet
      during continued global expansion. The investor syndicate included Citadel Securities and DRW Venture Capital
      (both market makers with direct operational alignment), Opera Tech Ventures (BNP Paribas), MUFG Innovation
      Partners, Kraken, and Flat Capital—a roster whose strategic composition signals institutional distribution
      relationships as much as pure financial investment. Series D proceeds are earmarked for: establishing local
      market presence and new regulatory licenses in key jurisdictions, advancing institutional-grade trading
      capabilities, bridging traditional and tokenized asset ecosystems, and reinforcing cybersecurity and platform
      resilience.


      The $40 million line of credit is a material but substantially opaque financial instrument. Its terms—including
      lender identity, interest rate, maturity date, financial covenants, and collateral provisions—are not publicly
      disclosed. For underwriting purposes, this creates two risks: first, a credit facility secured against Alpaca's
      clearing infrastructure or receivables could interact with net capital calculations under SEC Rule 15c3-1;
      second, any financial covenant failures could restrict operational flexibility at a critical growth phase.
      The lender's identity—whether a strategic partner, incumbent commercial bank, or institutional credit provider—
      and rate relative to benchmark are both unknown, preventing a stress-test of refinancing risk. The Series D
      also came with Binance holding a minority equity stake, acquired through the stock trading partnership,
      which is an additional governance consideration.


      The capital intensity of operating as a self-clearing broker with DTCC, OCC, FICC, and Nasdaq Exchange
      memberships is substantial. Each membership requires ongoing reserve fund contributions, operational liquidity
      buffers, and the ability to absorb intraday settlement obligations at scale. The Series D raises short-term
      liquidity meaningfully, but Alpaca's ability to sustain self-clearing operations—particularly as account and
      volume scale—without further capital raises is unknown given the absence of cash burn disclosure.
