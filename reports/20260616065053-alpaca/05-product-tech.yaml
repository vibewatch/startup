  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "api-throughput-sla"
      missingEvidence: >-
        Published SLA commitments (uptime guarantee, credit mechanism, MTTR targets), throughput benchmarks
        (orders per second, API call latency percentiles), and capacity limits for Alpaca's Trading API and
        Broker API under production load.
      whyItMatters: >-
        Without public SLA terms, enterprise fintech partners cannot underwrite reliability risk, and
        investors cannot assess whether Alpaca's infrastructure is sufficient for high-volume institutional use.
        Third-party monitors have reported below-99.9% availability in specific windows, which may not match
        Alpaca's own claims.
      diligencePath: >-
        Request Alpaca's enterprise SLA documentation, infrastructure architecture deck, and any existing
        partner-level uptime guarantees or credits from the commercial team; review incident postmortems.
      relatedQuestionRefs: [QE005, QE014]

    - type: private-evidence-only
      severity: material
      topic: "tokenization-regulatory"
      missingEvidence: >-
        Formal SEC guidance or enforcement actions specifically targeting Alpaca's ITN or its third-party
        tokenization partners after the January 2026 staff statement, and Alpaca's formal legal analysis of
        whether the ITN structure constitutes a security-based swap subject to CFTC/SEC dual jurisdiction.
      whyItMatters: >-
        The SEC's statement identified third-party tokenization—Alpaca's current model—as carrying heightened
        regulatory risk. If ITN products are reclassified as security-based swaps, Alpaca and its partners
