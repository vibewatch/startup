  - id: "architecture"
    title: "Technical Architecture: Self-Clearing, Order Routing, and Integration Model"
    body: >-
      Alpaca's most defensible technical asset is its fully self-clearing architecture. Having obtained DTCC
      membership for US equities in 2023–2024, and OCC and FICC memberships in August 2025, Alpaca now manages
      the complete trade lifecycle—from execution to clearing to settlement—across equities, ETFs, options, and
      Treasuries without relying on any third-party clearing broker. This eliminates a historically significant cost
      layer and gives Alpaca and its partners real-time post-trade visibility, faster processing, and greater
      workflow flexibility. Alpaca also became a Nasdaq Exchange Member in 2025, adding direct exchange
      connectivity for order routing.

      For 24/5 overnight trading, Alpaca routes orders via the Blue Ocean Alternative Trading System (BOATS), an
      ATS independent of traditional US stock exchanges. The overnight session runs Sunday 8:00 PM to Friday
      8:00 AM ET (overnight period), covering all NMS securities but not OTC equities. Only limit orders are
      accepted during the overnight session, and Day Trading Buying Power does not apply; maximum margin is 2x.
      This is a meaningful liquidity caveat that partners must communicate to end customers.

      Fractional share trading is available for 2,000+ US equities in both live and paper environments. Orders
      accept either a qty (fractional quantity) or notional (dollar amount, min $1) parameter in the POST /v2/orders
      endpoint; fractional orders are executed on a principal or riskless-principal basis and can only be sold
      with market orders during normal market hours (short sales in fractional orders are not supported). Fractional
      trading extends into pre-market, post-market, and the overnight sessions.

      For fixed income, Alpaca aggregates quotes from a network of liquidity providers and routes orders to the
      most competitive bid/ask price. Orders placed outside US bond market hours (9:30 AM–4:00 PM ET) are queued
      for the next session. The Broker API onboarding model supports two KYC workflows: Alpaca-managed (using
      Trulioo and Onfido for non-regulated entities) and partner-managed (for investment advisors and
      broker-dealers with their own AML programs). Partner bank account linking is handled through a Plaid
      integration. Account status updates and trade events flow through the Events API via streaming.
