callouts:
  - calloutType: "strength"
    title: "Self-clearing stack is a genuine and defensible technical moat"
    body: >-
      Alpaca's simultaneous DTCC, OCC, and FICC memberships—completed as of August 2025—give it full in-house
      control over the trade lifecycle across equities, options, and Treasuries. Few brokerage infrastructure
      providers of Alpaca's size hold all three memberships simultaneously. This eliminates third-party clearing
      broker fees and enables real-time post-trade visibility, which are direct competitive advantages over
      correspondent-clearing peers and provide structural cost leverage as partner volume scales.
    claimRefs:
      - CE018
      - CE019
      - CE020

  - calloutType: "risk"
    title: "Tokenization concentration creates single-point-of-failure risk for the on-chain equity market"
    body: >-
      Alpaca's ~94% market share as the clearing broker for tokenized US equities means the entire nascent
      tokenized-stock sector depends on a single regulated intermediary. The SEC's January 2026 staff statement
      explicitly flagged the third-party tokenization model—where end investors do not hold direct ownership—as
      carrying higher regulatory risk than issuer-sponsored structures. Any regulatory action, compliance
      disruption, or relationship change at Alpaca would simultaneously affect most of the tokenized-equity
      platforms globally. This sector concentration is a reputational and systemic risk that investors should
      weigh independently of ITN's revenue potential.
    claimRefs:
      - CE016
      - CE034
      - CE035

