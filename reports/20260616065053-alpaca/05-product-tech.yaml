figures:
  - id: "FE001"
    title: "Alpaca Product Architecture Stack"
    type: stack
    layout: wide
    summary: >-
      Alpaca's platform can be read as five layers from developer surfaces through clearing and regulatory rails,
      with the self-clearing stack as the most defensible differentiator.
    data:
      layers:
        - label: "Developer Surfaces"
          description: "docs.alpaca.markets, OpenAPI specs, official SDKs (Python/C#/Go/JS), MCP Server v2, CLI, paper trading sandbox"
          detail: "Distribution layer that puts Alpaca's trading infrastructure into daily developer workflows; key developer-moat vector"
        - label: "API Gateway"
          description: "Broker API, Trading API, Market Data API (Basic / Algo Trader Plus), Crypto API"
          detail: "REST + WebSocket + SSE endpoints; versioned; idempotency and request-ID primitives; OpenAPI spec-driven"
