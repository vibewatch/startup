      HEAVILY ESTIMATED. Alpaca does not disclose NRR, GRR, or churn rates. Year 1 values of 95–100 are inferred from
      the absence of any publicly reported partner departures. Multi-year retention for 2022–2024 cohorts (90–95%) is
      derived from the observable fact that named partners (Sarwa, Dime!, Gotrade) remain active through 2026 and no
