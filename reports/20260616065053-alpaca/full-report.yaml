            body: >-
              Binance serves 300 million global users — more than 33 times the current 9 million Alpaca-powered account
              base. If Binance's US stock feature achieves even 3–5% penetration of its user base, it would generate
              9–15 million accounts on Alpaca's infrastructure from a single partner, creating extreme concentration.
              Combined with Binance's partially disclosed revenue-sharing terms and its minority equity stake, this
