      - number: '1.3'
        title: Funding History and Capitalization
        blocks:
          - type: paragraph
            body: >-
              Alpaca has raised capital across at least nine financing events since its 2015 founding, reaching a
              cumulative total exceeding $320M and achieving unicorn status in January 2026. The earliest disclosed
              round was a $1.7M seed in 2017 from D4V (an IDEO/Genuine Startups joint venture), Monex Ventures, and
              MUCAP (MUFG). A $3M pre-Series A followed in October 2018, led by Global Brain, coinciding with the public
              launch of the commission-free trading platform. Spark Capital led a $6M round in late 2019—earning Alpaca
              the 'Stripe of stocks' framing—and Portag3 (now Portage Ventures) led a $10M Series A in October 2020. In
              August 2021 Tribe Capital led the $50M Series B, with participation from Horizons Ventures, Eldridge,
              Positive Sum, and returning investors Portage, Spark Capital, and Social Leverage; at that point total
              funding reached approximately $72M. In October 2023 Alpaca secured a $15M convertible note from SBI Group,
              a strategic Japanese financial institution, pushing the cumulative total to approximately $120M. The $52M
              Series C closed in April 2025 (investors: Derayah Financial, 850 Management, National Investments Company
              Kuwait, Unbound, and Portage Ventures) brought total funding to $170M. The January 2026 Series D of $150M
              was led by Drive Capital; other new participants included Citadel Securities, Opera Tech Ventures (BNP
              Paribas), MUFG Innovation Partners, Flat Capital (with Klarna CEO Sebastian Siemiatkowski as controlling
              UBO), DRW Venture Capital, Kraken, Altered Capital, X&KSK (Keisuke Honda), Bank Muscat, and Endeavor
              Catalyst. Returning investors in the Series D included Portage, Horizons Ventures, Social Leverage,
              Unbound, Diagram, and Derayah Financial; angel participation came from Revolut CTO Vlad Yatsenko.
              Alongside the equity raise, Alpaca secured a $40M line of credit. The Series D values Alpaca at $1.15
              billion, and the company states total funding has exceeded $320M post-close.
