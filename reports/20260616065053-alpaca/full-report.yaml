      - number: '3.4'
        title: Capability, Pricing, Distribution, and Trust Comparison
        blocks:
          - type: paragraph
            body: >-
              Comparing Alpaca against its peers on key buying criteria reveals a differentiated but incomplete picture.
              On self-clearing depth, Alpaca is in rare company: among pure-play API-first platforms, only DriveWealth
              also self-clears. Apex self-clears under its Apex Clearing brand but primarily targets RIAs and
              broker-dealers rather than the API-first fintech market. IBKR self-clears at massive scale but is not
              primarily a B2B infrastructure provider. Tradier does not self-clear. Saxo does not offer US equities
              clearing-as-a-service to third parties. Asset breadth is where Alpaca most clearly differentiates: stocks,
              ETFs, multi-leg options, US Treasuries, crypto, and tokenized equities in a single API is a capability
              combination that no other pure B2B API infrastructure provider has matched. DriveWealth covers equities
              and fractional shares but lacks fixed income and options depth. Apex covers a broader institutional asset
              universe but is not API-first for fintechs. Zero Hash covers crypto and tokenization but not traditional
              equities clearing. IBKR covers all asset classes but at enterprise-only pricing complexity.

              Geographic reach is a second differentiator. Alpaca serves 40+ countries via a single API (with Alpaca
              Europe adding UK/EU regulatory depth), while DriveWealth covers 150+ countries for fractional equities.
              Tradier is US-only. Saxo covers 170+ countries but is not US-equities clearing focused for third-party
              fintechs.

              Pricing transparency is an adverse differentiator for Alpaca. Tradier is the only major competitor in this
              space that publishes a complete retail pricing schedule—commission-free equities, $0.35/contract options
              on the free tier, $10/month Pro, $35/month Pro Plus. All other enterprise B2B infrastructure
              providers—Alpaca, DriveWealth, Apex, and Saxo—require custom sales negotiation and do not publish
              enterprise pricing. This opacity is an industry norm rather than an Alpaca-specific weakness, but it
              creates an evidence gap in competitive diligence.

              On regulatory trust posture, Alpaca carries the September 2024 SEC off-channel communications penalty
              ($400K, later resolved through FINRA SD-2436 continuance approval) as a documented compliance blemish;
              DriveWealth and Apex have cleaner disclosed records, though Apex's private ownership limits public
              scrutiny. Post-Synapse, regulatory credibility of the intermediary layer is a real factor in partner due
              diligence. Developer tooling is Alpaca's strongest non-regulatory differentiator: the combination of a
              public REST + WebSocket API, Python and JavaScript SDKs, extensive documentation, a paper trading sandbox,
              and a 61,000 MAD developer community makes Alpaca the most accessible API brokerage for developers—a
              capability that IBKR, Apex, and Saxo do not match in the same frictionless way.
