      - number: '4.5'
        title: Underwriting Gaps, Adverse Risks, and Diligence Agenda
        blocks:
          - type: paragraph
            body: >-
              The single most material barrier to underwriting Alpaca's financial quality is its private-company
              opacity. As of the run date, Alpaca has not disclosed absolute annual revenue, gross margin, net margin,
              cash burn rate, net revenue retention, customer acquisition cost, or runway. These are the core metrics
              required to form a grounded view on capital sufficiency, margin trajectory, and go-forward funding needs.
              The growth narrative is supported by analyst estimates and company-stated revenue claims—neither of which
              is audited—and the absence of public financials means diligence must rely on comparable analysis,
              management representation, and off-balance-sheet disclosure review.


              The PFOF regulatory environment is the principal structural adverse risk to Alpaca's revenue model. The EU
              banned PFOF under MiFIR Article 39a with effect from end-June 2026, directly eliminating a revenue stream
              for Alpaca Europe (the post-WealthKernel UK/EU entity). The SEC is implementing amended Rule 605 with an
              August 1, 2026 compliance date, expanding execution-quality disclosure obligations and reporting costs for
              US brokers. UK, Australia, Canada, and Singapore have already curbed or banned PFOF. A SEC DERA working
              paper (January 2025) studied PFOF impacts and noted the practice generates approximately $3.8 billion
              annually across the twelve largest US brokerages—underscoring how much revenue would be at risk if the US
              follows the EU's trajectory. If PFOF is curtailed in the US, Alpaca would need to offset the lost revenue
              with API fees, margin interest, FPSL income, and cash sweep spread—a scenario that is plausible given the
              diversified model but unquantified without internal margin data.


              The Binance revenue-sharing terms—50% PFOF and 65% lending profit—represent a third adverse factor. If
              Binance becomes a dominant share of Alpaca's total account and volume growth, which its user scale makes
              plausible, the effective blended PFOF yield per account across the book will deteriorate. The omnibus
              custody structure (all Binance platform customers pooled in a single NEST Trading Limited account)
              amplifies operational concentration: any Binance regulatory action could affect a significant portion of
              custody AUC simultaneously. The undisclosed $40 million line of credit creates additional balance-sheet
              opacity—covenants, pledge, and maturity unknown—that cannot be stress-tested without disclosure. Together,
              PFOF regulatory headwinds, Binance revenue extraction, private-company opacity, and undisclosed credit
              terms constitute the primary underwriting blockers requiring resolution before a completed financial
              judgment is possible.
