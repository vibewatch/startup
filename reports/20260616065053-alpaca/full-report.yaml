      - number: '5.3'
        title: Developer Experience, SDK Ecosystem, and AI-Native Tooling
        blocks:
          - type: paragraph
            body: >-
              Alpaca's developer-first positioning is substantiated by a multi-language SDK ecosystem, comprehensive
              documentation, and increasingly AI-native tooling. The official Python SDK (alpaca-py) supports Python
              3.8+, uses Pydantic for data validation and OOP request models, and covers Trading API, Broker API, and
              Market Data API. It is available on PyPI as the primary installable package and is actively maintained by
              alpacahq on GitHub. The C#/.NET SDK (Alpaca.Markets 7.2.0 on NuGet) supports .NET 6+, .NET Standard 2.0,
              and .NET Framework 4.6.2; the Go SDK (alpaca-trade-api-go) and the JavaScript/Node SDK are also officially
              maintained. Alpaca's documentation site lists OpenAPI specifications for Broker API, Trading API, and
              Market Data API, enabling custom client generation. Community contributors have created additional
              wrappers for C++, Java, TypeScript, R, Rust, Scala, Ruby, and Elixir.

              The Market Data API has two plans: the Basic (free) plan provides real-time IEX data, 200 API calls per
              minute, and WebSocket streams limited to 30 symbols; the Algo Trader Plus plan ($99/month) provides full
              SIP consolidated tape from all US exchanges, 10,000 API calls per minute, and unlimited WebSocket symbol
              streams. Market data for the overnight session (BOATS feed) is also included in the Algo Trader Plus plan.
              The paper trading sandbox mirrors live trading end-to-end using real-time IEX data; it is free, available
              globally, and offers the same API surface (paper-api.alpaca.markets). Documented limitations include the
              lack of market impact simulation, price slippage from latency, order queue position, and regulatory fees.

              In Q1 2026, Alpaca's API usage growth accelerated nearly 4× quarter-over-quarter—rising from single-digit
              monthly growth in Q4 2025 to approximately 30% per month in Q1 2026—driven by AI-driven and agent-based
              market participants. To capture this shift, Alpaca released a new CLI and MCP Server v2 in April 2026. The
              MCP Server v2 is a complete rewrite using FastMCP and OpenAPI specifications, expanding coverage from 43
              endpoints in v1 to 61 in v2. It enables natural-language trading via AI assistants like Claude, Cursor,
              and VS Code, and is open source on GitHub. ALPACA_TOOLSETS environment variable filtering lets
              administrators restrict agent access to specific capability subsets, reducing risk from
              large-language-model errors.
