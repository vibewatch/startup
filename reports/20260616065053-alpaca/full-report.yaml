  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Mission
        blocks:
          - type: paragraph
            body: >-
              Alpaca is a US-headquartered, self-clearing broker-dealer and globally recognized leader in brokerage
              infrastructure APIs. The company was founded in 2015 by Japanese entrepreneurs Yoshi Yokokawa and Hitoshi
              Harada, initially operating in San Mateo, California as a database and machine-learning company that
              processed large volumes of financial market data for institutional clients using deep neural networks.
              That early engineering work led directly to the creation of MarketStore—an open-source, purpose-built
              time-series database optimized for financial data—which remains cited as the engineering foundation of
              Alpaca's infrastructure philosophy. Around 2018, Alpaca pivoted to API-first brokerage infrastructure and
              launched a commission-free trading platform for algorithmic traders; it subsequently expanded its Broker
              API to allow global fintechs and financial institutions to build fully custom investing products on top of
              Alpaca's regulatory and clearing stack. Alpaca's stated mission is to open financial services to everyone
              on the planet, and its commercial goal is building the global de facto standard for brokerage
              infrastructure. The company was part of Y Combinator's Winter 2019 batch, which added early developer
              community credibility. Alpaca offers two primary API products: the Broker API—a full-stack
              brokerage-as-a-service enabling fintechs and institutions to build investing applications—and the Trading
              API, targeting algorithmic traders, retail investors, hedge funds, and prop firms automating strategies
              across stocks, options, and crypto. As of June 2026 the legal broker-dealer entity, Alpaca Securities LLC
              (CRD# 288202, SEC# 8-69928), is incorporated in Delaware, was formed on March 15, 2017, and maintains its
              main registered office at 12 East 49th Street, Floor 11, New York, NY 10017, under FINRA New York Office
              regulation.
