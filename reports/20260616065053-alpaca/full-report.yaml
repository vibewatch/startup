  - id: FI004
    title: Capital Intensity and Cost Structure Matrix
    type: matrix
    layout: wide
    summary: >-
      Operating a self-clearing multi-asset broker carries seven distinct cost categories; Alpaca's technology
      investments aim to lower per-unit costs, but regulatory capital and compliance remain fixed burdens at scale.
    data:
      columns:
        - Self-Clearing Impact
        - Scale Sensitivity
        - Underwriting Confidence
      rows:
        - label: Compliance and legal
          values:
            - label: Ongoing
              tone: warning
              detail: FINRA, SEC, OCC, FICC compliance; multiple regulatory event remediation (SEC 2024 order).
            - label: Fixed-plus-variable
              tone: neutral
              detail: Base compliance cost is relatively fixed; grows with new licenses and jurisdictions.
            - label: High
              tone: positive
              detail: Publicly disclosed regulatory footprint gives cost category visibility.
        - label: Clearing technology operations
          values:
            - label: Internalized
              tone: positive
              detail: Proprietary UTS platform (Flatbuffers, Redpanda) eliminates vendor dependency but adds ops cost.
            - label: Variable
              tone: neutral
              detail: Scales with transaction volume; architecture designed for efficiency.
            - label: Low
              tone: warning
              detail: Internal tech spend not publicly disclosed; estimated as a core capex category.
        - label: Market data subscriptions
          values:
            - label: Necessary
              tone: warning
              detail: Exchange fees for real-time data; standard clearing member cost.
            - label: Fixed-plus-volume
              tone: neutral
              detail: Base fees plus incremental per-query or per-user charges from exchanges.
            - label: Low
              tone: warning
              detail: No public disclosure of data spend.
        - label: Regulatory capital reserves
          values:
            - label: Required
              tone: warning
              detail: SEC Rule 15c3-1 (net capital) and 15c3-3 (customer reserve) mandate ongoing capital lock-up.
            - label: Volume-correlated
              tone: warning
              detail: Customer reserve grows proportionally with account balances; constrains capital efficiency.
            - label: Medium
              tone: neutral
              detail: Minimum net capital requirement is $250K but actual capital lock-up inferred to be significantly higher.
        - label: Bank and payment connectivity
          values:
            - label: Expanding
              tone: neutral
              detail: ACH, wire, FX, sweep bank relationships, and cross-border payment rails for 40+ countries.
            - label: Fixed-plus-geography
              tone: neutral
              detail: Each new jurisdiction adds connectivity cost.
            - label: Low
              tone: warning
              detail: Specific costs not disclosed.
        - label: Licensing and membership fees
          values:
            - label: Mandatory
              tone: warning
              detail: DTCC, OCC, FICC, FINRA, Nasdaq Exchange Member fees; growing as new memberships are added.
            - label: Mostly fixed
              tone: neutral
              detail: Membership fees are largely fixed; volume-based components at DTCC/OCC.
            - label: Medium
              tone: neutral
              detail: Individual fee schedules are public; blended total not disclosed.
        - label: Customer and partner support
          values:
            - label: Scales with partners
              tone: neutral
              detail: Supporting 300+ B2B partners across 40+ countries; technical integration and ops support overhead.
            - label: Variable
              tone: neutral
              detail: Headcount-driven; scales roughly linearly with partner count.
            - label: Low
              tone: warning
              detail: Headcount not publicly disclosed; support cost inferred from partner scale.
    approximationNotes: >-
      Scale sensitivity and confidence ratings are qualitative assessments derived from regulatory filings, IBKR
      comparables, and Alpaca's public disclosures. No Alpaca-specific cost data is publicly available. IBKR's Q4 2024
      clearing cost of $115M/quarter serves as the upper-bound comparable for a mature self-clearing operator.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI018
      - CI040
