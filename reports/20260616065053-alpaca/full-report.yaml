      - number: '5.5'
        title: Product and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Alpaca's product and technology surface carries several material risks that investment committees should
              evaluate independently.

              Tokenization ownership structure: The ITN's commercial prominence belies a significant product-law
              constraint. Alpaca's own legal disclosures confirm that tokenized assets provide economic exposure, not
              direct legal ownership, of underlying shares. Token holders have no voting rights, dividend entitlements,
              or residual claims in a liquidation. This structure—third-party tokenization where the issuing platform
              (xStocks, Ondo, Dinari) and not the end investor holds the beneficial interest—was explicitly identified
              by the SEC's January 2026 staff statement as a higher-risk model compared to issuer-sponsored
              tokenization. Alpaca's ~94% concentration as the clearing broker for tokenized US equities means that any
              regulatory or business disruption to Alpaca would simultaneously impair most platforms issuing tokenized
              US stocks globally.

              24/5 liquidity caveats: Overnight trading via BOATS carries documented risks of partial fills, wider
              bid-ask spreads, higher volatility from news-driven moves, and price discontinuities between sessions.
              Only limit orders are permitted overnight; standard market orders are rejected. These constraints limit
              24/5's utility for high-frequency or market-order-dependent strategies.

              Crypto regulatory exposure: Alpaca Crypto LLC's FinCEN MSB registration does not provide the same customer
              protections as a FINRA-registered broker-dealer. Crypto assets are excluded from SIPC and FDIC coverage.
              Evolving crypto regulation in the US creates ongoing compliance overhead and potential product
              restrictions.

              Enterprise integration complexity and documentation gaps: The Broker API's flexibility (dual KYC models,
              configurable revenue splits, multi-asset support, dual clearing-layer distinctions between SIPC, FDIC, and
              cash collateral) creates significant implementation complexity for new partners. Documentation quality is
              high for core endpoints but thinner for edge cases in options clearing, FPSL collateral mechanics, and
              OmniSub sub-accounting. MCP Server v2 changed all tool names and parameters from v1, creating a migration
              burden for existing AI agent integrations.

              Platform concentration on US market structure: All of Alpaca's clearing memberships and the Blue Ocean ATS
              dependency are US-specific. While the WealthKernel acquisition brings Xetra access, the core technology
              stack is not natively designed for non-US clearing and settlement systems. This limits the near-term
              addressable partner market to US-registered securities, creating a structural dependency on US exchange
              and regulatory continuity.
            claimRefs:
              - CE016
              - CE034
              - CE035
              - CE011
              - CE004
              - CE010
              - CE027
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Self-clearing stack is a genuine and defensible technical moat
            body: >-
              Alpaca's simultaneous DTCC, OCC, and FICC memberships—completed as of August 2025—give it full in-house
              control over the trade lifecycle across equities, options, and Treasuries. Few brokerage infrastructure
              providers of Alpaca's size hold all three memberships simultaneously. This eliminates third-party clearing
              broker fees and enables real-time post-trade visibility, which are direct competitive advantages over
              correspondent-clearing peers and provide structural cost leverage as partner volume scales.
            calloutType: strength
            claimRefs:
              - CE018
              - CE019
              - CE020
          - type: callout
            title: Tokenization concentration creates single-point-of-failure risk for the on-chain equity market
            body: >-
              Alpaca's ~94% market share as the clearing broker for tokenized US equities means the entire nascent
              tokenized-stock sector depends on a single regulated intermediary. The SEC's January 2026 staff statement
              explicitly flagged the third-party tokenization model—where end investors do not hold direct ownership—as
              carrying higher regulatory risk than issuer-sponsored structures. Any regulatory action, compliance
              disruption, or relationship change at Alpaca would simultaneously affect most of the tokenized-equity
              platforms globally. This sector concentration is a reputational and systemic risk that investors should
              weigh independently of ITN's revenue potential.
            calloutType: risk
