  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Risk Event
      - Threshold or Trigger
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Binance partnership disruption
        - Binance exits, renegotiates economics below 50% PFOF share, or faces US regulatory shutdown affecting accounts
        - Removes likely largest revenue partner; structural revenue gap; down-round pressure
        - Immediate coverage review; downgrade to avoid if disruption confirmed
      - - US PFOF ban or severe restriction
        - SEC finalizes rule eliminating or capping PFOF for exchange-listed equities
        - Eliminates primary revenue stream; forces pivot to commission model at lower monetization per trade
        - Re-underwrite without PFOF; model pure API-fee + margin + lending revenue
      - - Confirmed ARR below $100M in audited FY2025 financials
        - Audited revenue materially below Sacra $100M estimate by more than 15%
        - Sacra estimates overstated; implied multiple rises; growth thesis impaired
        - Downgrade to avoid; thesis rests on growth trajectory validation
      - - Gross margin confirmed below 25%
        - Audited gross margin below 25% in FY2025
        - Self-clearing dividend not captured; Binance haircut exceeds clearing savings
        - Reevaluate unit economics; recalculate multiple on net margin basis
      - - Regulatory license loss or suspension
        - FINRA, SEC, or international regulator suspends Alpaca's broker-dealer or clearing licenses
        - Operational shutdown; irreversible thesis break
        - Immediate avoid; do not re-enter without full regulatory reinstatement
    notes: >-
      Triggers are scenario conditions, not current observations. Based on evidence from Chapters 4, 6, and 7 and
      publicly confirmed regulatory events. Thresholds are conservative; actual investment committee may set different
      trigger levels.
    claimRefs:
      - CV032
      - CV033
      - CV035
      - CV042
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financials
        - FY2024 and FY2025 audited revenue, gross margin, operating loss/income, and cash
        - Without audited figures, ARR and margin estimates are third-party inferences with ±30% error band
        - Company management; data room request; Big-4 audit report
      - - NRR by partner cohort
        - Net revenue retention rate by partner vintage and geography
        - NRR >110% validates expansion; NRR <100% indicates churn or contraction in installed base
        - Company management; cohort analysis in data room
      - - Binance concentration and terms
        - Exact % of Alpaca's ARR attributable to Binance accounts; full terms of Binance revenue-sharing agreement
        - Binance earns 50% PFOF + 65% lending profit; if >25% of ARR, blended economics impair multiple
        - Company management + Binance partnership agreement review
      - - Cap table and preference overhang
        - Current cap table with preference stack, anti-dilution provisions, and liquidation waterfall
        - >-
          Nine financing rounds plus $40M credit line create potential preference overhang that reduces effective common
          equity value
        - Company management; data room cap table model
      - - Credit line terms
        - '$40M line of credit: lender, rate, maturity, covenants, security'
        - Restrictive covenants or high-rate debt would constrain operating flexibility and impair equity value
        - Company management; credit agreement review
      - - WealthKernel integration costs and EU ARR
        - Integration spend, timeline, and incremental EU revenue from WealthKernel as Alpaca Europe
        - Determines whether European expansion adds ARR quickly or is a multi-year drag on margins
        - Company management; Alpaca Europe revenue forecast
      - - Tokenization revenue pipeline
        - Current tokenization revenue run rate and pipeline by customer
        - >-
          Tokenization is listed as a strategic differentiator; if revenue is zero, the multiple must be justified on
          core API economics alone
        - Company management; tokenization partner contracts
    notes: >-
      Diligence asks are prioritized by materiality for the $1.15B entry price. Items 1–4 are blocking for a buy
      recommendation. Items 5–7 are material but not alone blocking. All items should be reviewed before commitment in a
      data room process.
    claimRefs:
      - CV035
      - CV044
      - CV032
      - CV026
      - CV038
