      - number: '2.3'
        title: Buyer Segmentation and Adoption Map
        blocks:
          - type: paragraph
            body: >
              The brokerage infrastructure API market segments along two primary axes: application type (what the
              partner builds) and institution type (regulated entity vs. technology-first platform). The largest segment
              by partner count is fintech apps and neobanks: consumer-facing platforms embedding investing as a
              supplemental feature alongside payments or banking, seeking to increase user ARPU and reduce churn. These
              buyers are typically led by product or engineering VPs, operate on SaaS-style API fee contracts, and are
              motivated by the proven 2–5× ARPU uplift that embedded financial products deliver. Apex Fintech Solutions
              reported serving 200+ fintech companies with $235B+ in assets under its infrastructure as of February
              2026; Coinbase's simultaneous launch of U.S. equity trading on its "Everything Exchange" platform (powered
              by Apex) illustrates how large crypto exchanges are now a material buyer segment seeking traditional
              equities rails.


              DriveWealth serves 100+ fintech partners globally including Revolut, Block (formerly Square), Papara,
              MoneyLion, C6 Bank, and Viva Republica, with a demonstrated three-year revenue CAGR exceeding 50%,
              confirming the market's growth rate from a leading incumbent. RIAs and wealth management platforms form a
              second segment: they require white-label brokerage infrastructure for model-portfolio execution and
              fractional trading within advisory tools, with compliance officers and CTOs as co-budget owners. Regional
              banks seeking to compete with neobanks on investing features form a third segment. International
              investment apps—in Southeast Asia, Latin America, the Middle East, and Africa—form a fourth fast-growing
              segment seeking compliant U.S. equities access at a cost and speed unavailable through legacy
              correspondent brokers. Robinhood's FY2025 scale (28.4M investment accounts, $324B platform assets, $4.5B
              revenue, 52% YoY growth) anchors the end-user market size that brokerage infrastructure customers are
              trying to serve. The tokenization buyer segment—crypto exchanges (Kraken, Coinbase), DeFi protocols, and
              non-U.S. fintechs seeking 24/7 tradeable U.S. stock representations—is a distinct and emerging class,
              illustrated by xStocks surpassing $10B in combined transaction volume by December 2025. Interactive
              Brokers serves as an incumbent offering API-accessible brokerage for sophisticated and institutional
              buyers across 3.8M accounts in 40+ countries and 170+ market centers.
