  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Partner Ecosystem: Scale, Segments, and Geographic Reach'
        blocks:
          - type: paragraph
            body: >-
              Alpaca's customer base is structured as a B2B2C ecosystem: Alpaca sells brokerage infrastructure APIs and
              self-clearing services to institutional and fintech partners (the direct paying customer), who in turn
              embed those capabilities into end-user products (the ultimate beneficiary). As of the January 2026 Series
              D announcement, Alpaca has partnered with over 300 organizations in more than 40 countries, collectively
              powering over 9 million end-user brokerage accounts. A slightly earlier data point—from the December 2025
              BridgeWise partnership announcement—cited the same 9 million accounts figure, while the Kraken Embed blog
              post (which predates the Series D) cited "more than 200 enterprise partners and over five million end-user
              accounts," indicating strong account growth in 2025 alone. Alpaca's developer community of 61,000 monthly
              active developers (as stated on the company homepage) is a leading indicator of pipeline breadth.


              Segmenting Alpaca's partner base reveals five primary vertical clusters. First, fintech investment apps
              represent the largest cohort by count: these are digital-first investment platforms such as Dime!
              (Thailand), Gotrade (Southeast Asia), Raenest (Nigeria), PandaPanda (Kenya), trii (Chile), Zesty (Chile),
              Midas (Turkey), Wallace Finance, and CUSP Wealth (GCC), all documented via Alpaca's case study blog.
              Second, neobanks and embedded-finance players include GoTyme Bank (Philippines BSP-licensed) and Birbank
              Invest / Pasha Capital (Azerbaijan), using Alpaca's Broker API to add investing rails to banking products.
              Third, crypto exchanges and multi-asset platforms represent the most strategically significant new
              segment, anchored by Kraken (US equities + xStocks tokenization) and Binance (launched June 1, 2026 for
              300M+ global users). Fourth, wealth platforms and robo-advisors include Sarwa (UAE, since 2021),
              BridgeWise (AI insights), Vesto (Spain/Andorra), and Musaffa (global Shariah-compliant). Fifth,
              institutional and broker-dealer partners are typified by SBI Securities (Japan's largest online broker)
              and Alpaca's Japan broker entity (AlpacaJapan).


              Geographically, the partner base spans North America (Composer, Manzil), Southeast Asia (Dime!, Gotrade,
              GoTyme Bank), Japan (SBI Securities, AlpacaJapan), the Middle East and GCC (Sarwa, ZAD, CUSP Wealth),
              Africa (Raenest, PandaPanda), LATAM (Bitso, trii, Zesty), Europe (Vesto, Birbank, and now Alpaca Europe
              post-WealthKernel), and Global via crypto exchanges (Kraken, Binance, Bitget). The 40+ country figure is
              corroborated by multiple independent press releases; the composition of those 300+ organizations is
              broadly consistent with the case-study portfolio, though the full list is not publicly disclosed. The
              61,000 MAD developer metric and 300+ partner figure are company-claimed and not independently audited.
