      - number: '2.5'
        title: Adoption Constraints and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              The primary regulatory constraint on brokerage infrastructure adoption is the capital-intensive,
              multi-year path to self-clearing broker-dealer status: FINRA membership, DTCC/OCC/FICC clearing approvals,
              ongoing net capital requirements, and supervisory infrastructure make internal build prohibitively
              expensive for all but the largest fintechs, creating structural demand for outsourced BaaS. SEC Rule 605,
              with a compliance deadline of August 1, 2026, now requires broker-dealers to report granular execution
              quality data, creating additional reporting burdens and transparency into PFOF-linked routing practices;
              the EU's PFOF ban (transitional exemption expired June 30, 2026) creates regulatory divergence that
              complicates globally unified brokerage strategies. China's May 2026 CSRC crackdown on Futu Securities
              (fined 1.85B yuan / approximately USD 256M) and Tiger Brokers (410M yuan / approximately USD 57M)
              represents a material adverse market development: the two-year wind-down of mainland Chinese cross-border
              investing via these platforms, backed by eight government agencies, effectively eliminates approximately 1
              million mainland Chinese investor accounts and approximately HKD 200–250B in affected assets from the
              addressable market for U.S. equities infrastructure serving retail end-users. This crackdown may
              paradoxically redirect some institutional demand through FINRA-regulated channels, but its near-term
              effect is a reduction in addressable international retail demand.


              The 2024 Synapse Financial Technologies bankruptcy and related BaaS failures (Blue Ridge Bank, Evolve
              Bank, Solaris, Railsr) left more than 100,000 people without access to $265M in funds and raised the
              due-diligence bar for fintech buyers selecting infrastructure providers—benefiting regulated self-clearing
              providers over middleware BaaS models, but also creating deal-cycle friction for all embedded finance
              vendors. Geographic localization requires sustained investment: while Alpaca covers 40+ countries,
              international expansion requires local regulatory approvals, AML/KYC adaptations, and currency handling in
              each jurisdiction. Interactive Brokers' global scale (3.8M accounts, 170+ market centers, 40+ countries)
              represents an incumbent alternative for larger buyers.


              Key sizing diligence gaps: no independent bottom-up estimate of the brokerage API infrastructure fee
              market exists in isolation from broader embedded finance or fractional share infrastructure measures;
              Alpaca's claimed 94% market share in tokenized U.S. equities (from a company-published 2025 report) is
              unverified by any independent source; DriveWealth has not published financial updates since its 2021
              Series D ($450M, $2.85B valuation), creating a gap in assessing peer competitive health; and analyst
              estimates of the addressable embedded finance market diverge by 4–5× due to incompatible scope
              definitions. The tokenized equities market additionally shows a 5× discrepancy between represented-value
              and live circulating metrics, making cross-source comparisons unreliable without careful alignment.
