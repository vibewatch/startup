  - id: FV004
    title: 'Investment KPIs: IC-Ready Scoring'
    type: kpi
    layout: standard
    summary: >-
      Scores Alpaca across seven IC-relevant dimensions on a 0–10 scale based on available evidence, with higher scores
      reflecting stronger evidence quality and thesis support.
    data:
      items:
        - label: Market opportunity
          value: 8
          description: >-
            Global brokerage API infrastructure is a multi-hundred-billion TAM with secular tailwinds from embedded
            finance and tokenization
        - label: Demand proof
          value: 7
          description: 300+ institutional partners, 9M+ accounts, 40+ countries, 150% YoY growth (Sacra); blue-chip partner roster
        - label: Competitive moat
          value: 6
          description: >-
            Self-clearing stack, global licensing, and developer community are real; DriveWealth and Apex are credible
            alternatives
        - label: Unit economics
          value: 4
          description: Self-clearing structurally positive but gross margin undisclosed; Binance haircut material; NRR unknown
        - label: Risk profile
          value: 4
          description: High – Binance concentration, PFOF regulation, SEC penalty history, private opacity
        - label: Valuation discipline
          value: 5
          description: >-
            ~10–11.5x ARR defensible for high-growth infra; above M&A floor; below public premium; insufficient public
            evidence to confirm
        - label: Evidence quality
          value: 4
          description: >-
            No audited financials, no NRR, no cap table; ARR is third-party estimate; multiple diligence gates remain
            open
    approximationNotes: >-
      Scores are author judgment based on evidence gathered through 2026-06-16 and should not be treated as a precise
      quantitative measure. Evidence quality score is explicitly discounted for private-company opacity.
    claimRefs:
      - CV003
      - CV004
      - CV010
