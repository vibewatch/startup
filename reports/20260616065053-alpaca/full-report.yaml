  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product Suite: APIs, Asset Classes, and Proprietary Programs'
        blocks:
          - type: paragraph
            body: >-
              Alpaca's commercial product surface is organized around two primary integration paths—the Broker API and
              the Trading API—supported by a Market Data API and a Crypto API, and enriched by a portfolio of ancillary
              programs that increase per-account revenue for fintech partners.

              The Broker API is the B2B backbone: it allows regulated and non-regulated fintechs to launch full
              brokerage products including account opening (with Alpaca-managed or partner-managed KYC), funding via
              Plaid, trading across equities, ETFs, options, fixed income, and crypto, and downstream reporting—all
              without obtaining a separate broker-dealer license. The Trading API targets algorithmic traders, hedge
              funds, and prop firms who want direct commission-free market access. Both APIs expose REST, WebSocket, and
              SSE endpoints. Alpaca's homepage as of June 2026 also lists OmniSub (an API-first sub-accounting ledger
              for omnibus structures) and Shariah-compliant investing as additional product lines, signaling continued
              product breadth.

              In fixed income, Alpaca's Broker API provides access to 229+ tradable US T-bills and 500+ investment-grade
              and high-yield US corporate bonds, with FICC membership enabling in-house clearing. Callable bonds are
              currently supported; fractional bonds, putable, Reg S, and 144a bonds are on the roadmap. The High-Yield
              Cash program earns Trading API users up to 3.30% APY on uninvested USD cash, with up to $2.5 million FDIC
              pass-through coverage per account through multiple program banks, and funds remain immediately available
              as buying power. The Fully Paid Securities Lending (FPSL) program enables partner platforms to offer
              clients passive income on securities they fully own; cash collateral equal to at least 100% of loaned
              security value is held at a third-party bank.

              Alpaca's most strategically visible product is the Instant Tokenization Network (ITN), launched at
              TOKEN2049 Singapore in October 2025. The ITN enables institutions to perform in-kind minting and
              redemption of tokenized US stocks 24/7 via a single API call, with Solana as the initial settlement chain.
              As of November 2025, Alpaca claims 94% market share in tokenized US equities with over $480M in tokenized
              AUC. However, the official ITN disclaimer is legally significant: tokenized assets do not represent direct
              equity ownership; holders have no voting rights, dividend entitlements, or legal claims to underlying
              shares. Neither Alpaca Securities LLC nor Alpaca Crypto LLC is the issuer or directly involved in the
              tokenization—it is performed by third-party partners including Backed Finance (xStocks), Ondo Finance, and
              Dinari.
