  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, Adjacents, Substitutes, and Internal Build'
        blocks:
          - type: paragraph
            body: >-
              Alpaca's competitive landscape is best understood by separating API-first brokerage infrastructure
              companies from retail brokers that have added APIs as a secondary feature. The former
              category—DriveWealth, Apex Fintech Solutions, and Tradier—are genuine B2B peers building the same category
              of embedded-investing rails. The latter category— Interactive Brokers, Saxo Bank, and Schwab
              Institutional—have deep trading infrastructure and global reach but were not designed as API-first B2B
              platforms. Zero Hash occupies an adjacent lane: it is the leading crypto and stablecoin infrastructure
              provider, and its expanding tokenization work directly overlaps with Alpaca's Instant Tokenization
              Network. The status quo and internal-build alternatives remain meaningful substitutes: large fintechs or
              banks can apply for FINRA membership, achieve DTCC/OCC clearing membership (requiring substantial
              regulatory capital and operational build-out), and operate their own brokerage stack, but this path takes
              years and tens of millions of dollars in capital and compliance investment.

              DriveWealth and Alpaca are the most direct competitors in the global API-first brokerage infrastructure
              space. Both are FINRA-registered, self-clearing, and designed from inception to power third-party fintech
              applications. Both offer B2B2C models where the partner owns the end-customer relationship and Alpaca or
              DriveWealth owns the regulatory, clearing, and custody stack beneath it. Apex Fintech Solutions is the
              dominant US clearing and custody infrastructure provider by accounts (22M+) and AUC ($200B+), but its
              primary business is institutional and RIA custody alongside clearing—it has historically served
              established broker-dealers and wealth managers rather than lean API-first fintechs. Tradier is positioned
              as the most developer-accessible option for US equities and options, with transparent public pricing and
              100+ integrations, but it is not self-clearing (it clears through Apex) and does not cover crypto, fixed
              income, or tokenization. Interactive Brokers is an institutional-grade incumbent with a $10B+ revenue base
              and global multi-asset reach, but it is fundamentally a self-directed brokerage with API access rather
              than a pure infrastructure provider.

              The adjacent threat from Zero Hash is growing: IBKR itself is both a Zero Hash investor and client, using
              Zero Hash infrastructure to power 24/7 stablecoin-based funding and crypto for its own customers. If the
              boundary between crypto and equities infrastructure continues to blur, Zero Hash (backed by IBKR, Morgan
              Stanley, Apollo, and SoFi) represents a well-capitalized path into adjacent rails that could compete with
              Alpaca's tokenization leadership. The European market adds a further competitive dimension: Alpaca Europe
              (formerly WealthKernel) now competes against Upvest, FNZ, Seccl, and Third Financial for UK and EU
              embedded investment infrastructure mandates.
