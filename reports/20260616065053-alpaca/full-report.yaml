      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Across Multiple Lenses'
        blocks:
          - type: paragraph
            body: >
              Multiple independent research approaches converge on a large, fast-growing opportunity for embedded
              investment infrastructure, though estimates diverge significantly depending on scope definition and
              methodology. At the broadest level—the global embedded finance market encompassing payments, lending,
              insurance, banking, and investment sub-segments—Mordor Intelligence estimates the 2026 market at $155.96B
              growing to $454.48B by 2031 at a 23.84% CAGR, while The Business Research Company estimates $115.03B in
              2026 growing to $250.95B by 2030 at a 21.8% CAGR. Both sources agree the embedded investment sub-category
              is the fastest-growing embedded finance segment: Mordor projects 27.66% CAGR for investments through 2031,
              outpacing payments (which already leads with 43.68% market share in 2025 but grows more slowly). By 2026,
              Bain & Company estimates embedded finance platform and infrastructure revenue in the U.S. alone at $51B,
              doubling from $21B in 2021.


              A narrower, more directly comparable lens is the global fractional share trading infrastructure market,
              valued at $4.8B in 2025 and projected to grow to $12.7B by 2034 at an 11.2% CAGR (Dataintelo, based on
              primary and secondary research through Q4 2025). North America leads this market with 38.2% revenue share
              ($1.83B), with DriveWealth and Apex Fintech Solutions identified as current leaders. Alpaca has processed
              over 50 billion API-driven trading requests since founding, per this same report. This $4.8B figure is the
              most directly comparable sizing lens for Alpaca's core infrastructure fee market, but it likely
              understates the post-2025 tokenization-driven acceleration.


              The tokenized equities and securities market adds an adjacent, high-growth layer. Mordor Intelligence
              estimates the tokenized securities market at $24.69B in 2025 growing to $35.82B in 2026 and $184.27B by
              2031 at a 38.76% CAGR, with equity securities specifically projected at a 46.21% CAGR through 2031.
              On-chain distributed market cap of tokenized stocks was $1.43B in May 2026 (per RWA.xyz data), while a
              broader "represented value" figure of $5.5B (The Block/Binance Research, June 2026) reflects a 5×
              methodological gap versus live circulating market cap. Citigroup projects tokenized securities could reach
              $4–5 trillion by 2030, contextualizing the current figures as nascent. BCG and Adyen estimate a total
              addressable embedded finance revenue opportunity for SaaS platforms of $185B, with less than 20% captured
              in 2026—roughly $150B still in play.
