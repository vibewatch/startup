      - number: '7.4'
        title: Governance, Reputational, and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Alpaca's entity and brand naming creates confusion that is itself a governance risk indicator. The
              operating broker-dealer registered with FINRA under CRD #288202 is Alpaca Securities LLC. The same entity
              is described in some company communications as "Alpaca Clearing LLC," reflecting its transition to
              self-clearing status, but no separate CRD registration for "Alpaca Clearing LLC" appears in publicly
              available FINRA BrokerCheck records as of this report's run date. The parent entity AlpacaDB, Inc.
              (separately registered, CRD #317262) has no disclosed disciplinary events, but the operating subsidiary
              Alpaca Securities LLC (CRD #288202) carries two enforcement disclosures. A partner conducting diligence on
              the entity named "Alpaca Markets" or "Alpaca Clearing" without tracing to the correct CRD may
              inadvertently rely on an entity with a clean BrokerCheck record while the operating broker-dealer entity
              has material regulatory history.


              Governance transparency is limited. Alpaca does not publish a board composition, committee structure,
              audit committee charter, or governance guidelines. As a private company backed by Portage Ventures, Spark
              Capital, Tribe Capital, and SBI Group, board composition is presumably investor-driven rather than
              independent. The September 2024 SEC order's finding that senior executives themselves violated compliance
              policies—and that this behavior was tolerated firm-wide—suggests that tone-at-the-top governance was
              deficient during the critical 2022–2024 growth period.


              The disclosure profile of Alpaca's risk disclosures has evolved. Earlier documentation described Alpaca as
              an introducing broker, while the February 2026 SEC comment letter clearly states the firm is a
              "self-clearing and carrying firm." This represents a material change in the operational and regulatory
              risk profile, and investors or partners relying on older documentation may have an outdated view of
              counterparty risk.


              FINRA's 2026 Annual Regulatory Oversight Report (released December 9, 2025) explicitly flags best
              execution, Regulation BI compliance, crypto communications controls, AML program adequacy, third-party
              vendor risk management, and GenAI governance as its examination priorities. Every one of these corresponds
              to a risk area in which Alpaca's historical compliance record has shown weaknesses. The forthcoming SEC
              Rule 605 enhancements (execution quality disclosure, required by August 1, 2026) will require Alpaca to
              publish more granular order-execution statistics, potentially revealing whether the regulatory-driven
              off-channel communications suppression also affected execution quality monitoring.


              Key-person risk is material. The founding team—CEO Yoshi Yokokawa and CTO Lu Zhao—hold both regulatory
              relationships and partnership trust; departure of either would likely trigger partner contract
              renegotiations and potentially FINRA principal-approval requirements.
