companyProfile:
  summary: >-
    Alpaca is a San Mateo-based API-first brokerage infrastructure company and self-clearing broker-dealer founded in
    2015 by Yoshi Yokokawa and Hitoshi Harada. Originally a financial time-series database startup (MarketStore), it
    pivoted in 2018 to brokerage-as-a-service, enabling global fintechs, neobanks, crypto exchanges, and wealth
    platforms to embed US equities, ETFs, options, fixed income, and crypto trading through its Broker API and Trading
    API. Alpaca self-clears through DTCC (equities), OCC (options), and FICC (Treasuries), eliminating third-party
    clearing costs and capturing the full economics of each trade. The company raised a $150M Series D at a $1.15B
    unicorn valuation in January 2026 led by Drive Capital, with co-investors including Citadel Securities, BNP Paribas,
    MUFG, and Kraken, bringing total disclosed funding to $320M+. In April 2026 Alpaca acquired WealthKernel to
    establish Alpaca Europe, and in June 2026 launched the Binance stock trading integration serving Binance's 300M+
    user base.
