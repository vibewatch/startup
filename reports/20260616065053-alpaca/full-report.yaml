      - number: '4.4'
        title: Financial Trajectory and Public-Comparable Anchors
        blocks:
          - type: paragraph
            body: >-
              Alpaca's publicly available financial trajectory points to a business on a steep growth curve anchored by
              expanding partner volume and self-clearing efficiency gains, but the picture is incomplete. The company
              stated in its January 2026 Series D announcement that it more than doubled year-over-year revenue for the
              preceding period. Sacra, the private-markets research firm, estimates Alpaca reached $60 million in
              annualized revenue in 2024—up 150% year-over-year—driven by annualized trading volume growing to
              approximately $180 billion (3x year-over-year). Sacra further estimates Alpaca reached $100 million in
              annualized revenue by September 2025, continuing a rapid growth trajectory. These estimates are analyst
              assessments based on public traction signals and channel checks rather than audited financials, so they
              carry meaningful uncertainty, but their directional consistency with the company's own growth claims
              provides some corroboration.


              The most relevant structural comparable is Apex Fintech Solutions, which generated approximately $230
              million in revenue in 2020 before a proposed SPAC at a $4.7 billion valuation implying roughly a 20x
              revenue multiple. Sacra positions Alpaca as the international equivalent of Apex, enabling non-US fintechs
              to embed US equities in the same way Apex enabled domestic platforms. DriveWealth, a direct incumbent
              competitor, was projecting $100 million in revenue for 2024 as of July 2024—suggesting Alpaca at $60
              million ARR in 2024 trails DriveWealth in absolute scale but has outpaced it in growth rate. The
              self-clearing infrastructure and tokenized equities dominance (94% claimed market share in tokenized US
              equities custody) may support higher long-run margins than the introducing-broker model either DriveWealth
              or Apex historically operated.


              Alpaca held $480 million in assets under custody as of December 2025, representing 29% of the $1.62
              billion total tokenized stock market. The June 2026 Binance launch—which partners Alpaca's infrastructure
              with the world's largest crypto exchange's user base—could materially accelerate volume and account
              growth. However, the disclosed PFOF and lending revenue-sharing terms mean that the incremental
              per-account economics from Binance partnerships will be materially lower than the blended economics across
              Alpaca's broader partner base.
