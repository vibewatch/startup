      - number: '5.4'
        title: Trust Controls, Compliance Memberships, and Third-Party Dependencies
        blocks:
          - type: paragraph
            body: >-
              Alpaca's trust architecture layers regulatory memberships, customer protection programs, and
              partner-facing controls. Alpaca Securities LLC (member FINRA/SIPC) is the regulated broker-dealer for
              equities, ETFs, options, and fixed income; Alpaca Crypto LLC (FinCEN-registered MSB, NMLS #2160858)
              handles digital asset services and is not a SIPC or FINRA member—crypto assets are not FDIC or SIPC
              insured. As of February 2026, Alpaca Clearing upgraded its excess SIPC coverage to $75 million in
              securities and $75 million in cash per customer, with a total aggregate cap of $250 million across all
              accounts, underwritten by Lloyd's of London (increased from a prior $30M securities / $1M cash / $150M
              aggregate structure).

              The FDIC Bank Sweep program underlying High-Yield Cash provides pass-through FDIC coverage of $250,000 per
              customer per program bank; with multiple program banks, Alpaca advertises up to $2.5M per account. Funds
              in the sweep are not SIPC-insured. FPSL loans are not SIPC-covered; instead, 100% cash collateral is held
              at a third-party bank and released to customers in the event of Alpaca's bankruptcy. The distinction
              between SIPC, FDIC, and cash-collateral protection modes is significant for partners building
              customer-facing products and must be communicated clearly in disclosures.

              Alpaca's status page (status.alpaca.markets) publicly monitors the Live Trading API (Account, Orders,
              Positions, Assets, Trade Updates, Fractional Orders), Paper Trading API, Dashboard and Account services,
              and 13 discrete Broker API sandbox endpoints. In June 2026 the company experienced several operational
              incidents: a June 14 funding services disruption from upstream provider maintenance (resolved in under 2
              hours), June 11 intermittent order rejections from an execution venue connection issue (resolved in
              approximately 12 minutes), and a June 1 journal processing delay of approximately 99 minutes. Third-party
              monitors reported an aggregate availability below 99.9% over a 30-day window in June 2026, though Alpaca's
              own status page shows near-100% uptime over 60 days for most components. No formal published SLA
              commitments (uptime guarantee, credits, or MTTR targets) have been identified in public documentation.
