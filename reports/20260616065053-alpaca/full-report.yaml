  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Alpaca's revenue model is a multi-stream brokerage infrastructure play blending traditional broker
              economics with an API platform premium. The company monetizes across six primary vectors: payment for
              order flow (PFOF), API and platform fees from B2B partners, margin lending interest, fully paid securities
              lending (FPSL), a high-yield cash sweep spread, and crypto maker-taker fees. Each stream is structurally
              tied to trading volume and account activity at partner platforms rather than to direct retail client
              relationships, reflecting Alpaca's B2B2C model where revenue scales with partner growth.


              PFOF is the most visible and historically largest revenue stream: Alpaca routes customer orders to
              wholesale market makers who pay for the execution opportunity, enabling commission-free trading for end
              users while Alpaca captures the routing premium. However, the June 2026 Binance stock trading launch
              revealed a material commercial constraint. Under Binance's published securities trading terms, Binance
              receives 50% of the PFOF fees generated by Alpaca from Binance-sourced orders, and 65% of the residual
              profit from securities lending on Binance accounts after users receive their interest. Binance also holds
              a minority equity stake in Alpaca, deepening the alignment beyond a standard vendor arrangement. For what
              is likely one of Alpaca's largest single partner relationships by volume, this revenue-sharing structure
              cuts effective PFOF and lending revenue per account roughly in half.


              API and platform fees, margin interest, FPSL income, and the High-Yield Cash sweep spread are secondary
              streams that distinguish Alpaca from a pure-PFOF broker. Alpaca's published margin lending rate of 6.25%
              per transaction reflects a standard B2B2C margin lending rate. The FPSL program allows fintech partners to
              offer securities lending to their customers while Alpaca retains a portion of the lending fee income. The
              High-Yield Cash sweep earns Alpaca a spread on deposits swept to FDIC-insured program banks. Crypto
              trading uses a published maker-taker fee schedule (0.15% maker / 0.25% taker at the lowest volume tier).
              Regulatory pass-through fees including the SEC Section 31 fee ($20.60 per $1 million of principal sold as
              of April 2026) and the FINRA Trading Activity Fee are remitted to regulators rather than retained by
              Alpaca.
