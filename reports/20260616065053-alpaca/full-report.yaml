      - number: '6.4'
        title: 'Customer Value Proposition: Why Partners Choose Alpaca'
        blocks:
          - type: paragraph
            body: >-
              The primary customer value proposition Alpaca delivers to B2B partners is speed-to-market with compliant,
              self-clearing brokerage infrastructure that would cost tens of millions of dollars and multiple years to
              replicate in-house. Specifically, partners receive: (1) a regulated US broker-dealer (FINRA/SIPC member,
              DTCC/OCC/FICC clearing memberships, Nasdaq Exchange Member) without having to acquire and operate a
              broker-dealer license themselves; (2) a multi-asset API covering US equities, ETFs, options, fixed income,
              crypto, and tokenized securities under one integration; (3) fractional and notional trading (enabling
              platforms like Dime! to allow $1.50 minimum investments); (4) self-clearing custody removing correspondent
              broker dependency; and (5) a developer-first API surface with OAuth, REST, WebSocket, FIX, and SDKs
              including Python, JavaScript, and Go, allowing integration in weeks rather than months.


              Partners articulate the value in specific terms. Dime! CPO Chattrin Laksanabunsong cited three primary
              decision criteria: low minimum cost, fractional shares, and simplified W-8BEN tax filing—all of which
              Alpaca delivers natively. Sarwa's CTO Jad Sayegh highlighted automated account approval via SSE events and
              real-time market data integration. ZAD's co-founder Abdullah Alotaibi noted that Alpaca was willing to
              innovate Shariah-compliant margin products (asset-backed rather than interest-based) rather than offering
              a generic off-the-shelf product. Binance chose Alpaca for "API-based flexibility, product diversity and
              capabilities, and ease of integration."


              The BrokerChooser and AlgoPlatforms reviews (both from the developer/trader perspective rather than the
              partner perspective) corroborate the API quality: BrokerChooser rates Alpaca 4.1/5 overall and named it
              "Best broker for algorithmic trading 2026," while AlgoPlatforms cites Alpaca's paper trading environment,
              high rate limits, and SDK quality as best-in-class. Independent reviews consistently identify customer
              support as a weakness—Alpaca primarily relies on community forums and GitHub for issue resolution rather
              than dedicated human support—which is a friction point for non-developer partners needing operational
              support.


              The Islamic finance vertical has emerged as a distinctive use-case cluster. Alpaca has now enabled
              Shariah-compliant versions of instant funding, margin trading (asset-backed), options trading, and
              high-yield cash accounts (sukuk-style sweep). Partners like ZAD (Kuwait), Manzil (USA), and Musaffa
              (global) represent a segment where Alpaca has built differentiated infrastructure—Shariah-compliant
              brokerage-as-a-service—that few if any competitors offer. Alpaca has explicitly stated the margin product
              is "scalable across other Islamic regions," implying a replicable playbook for Southeast Asia, Africa, and
              additional GCC markets.
            claimRefs:
              - CU036
              - CU037
              - CU038
              - CU039
              - CU040
      - number: '6.5'
        title: Durability, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Alpaca does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), contract
              lengths, churn rates, or per-partner revenue contribution—the core metrics needed to assess true customer
              durability. What can be inferred from public evidence is encouraging but insufficient for a
              high-confidence retention judgment. Sarwa's 4+ year continuous partnership (since 2021, active through
              2026), Dime!'s ongoing feature expansion (options trading planned), and ZAD's continued new-product
              co-development signal that at least for key MENA and APAC partners, the relationship is deepening over
              time. The Alpaca 2025 in-review post references "hundreds of global partners" without quantifying any
              churn, and no partner has been publicly identified as having churned from the platform.


              The most significant concentration risk in the partner base is the dual Kraken relationship. Kraken is
              simultaneously a Series D equity investor ($150M round participant), a commercial API partner for US
              equities, a commercial API partner for crypto (Kraken Embed into Alpaca's network), and a tokenization
              partner (xStocks preferred venue). This degree of interlock means Kraken's commercial trajectory and
              Alpaca's revenue trajectory are partly co-dependent; any deterioration in Kraken's business (regulatory
              action, market-share loss, or strategic pivot away from equities) could materially impact Alpaca. The
              partner-investor governance question—whether Kraken receives preferential commercial terms as a
              consequence of its equity stake—is not publicly disclosed and represents a material diligence gap.


              The Binance partnership (June 2026) introduces a new and potentially dominant concentration risk. Binance
              serves 300 million global users; even modest penetration of Alpaca's equity infrastructure into Binance's
              user base would likely exceed all other Alpaca partner accounts combined. Binance holds a minority equity
              stake, disclosed revenue-sharing terms (details per blockchain.news / coinalertnews reports, not
              officially confirmed), and has announced further plans for bStocks tokenization. If Binance becomes the
              dominant revenue contributor, Alpaca would face material partner-concentration risk comparable to a
              single-customer business—a risk that would substantially offset the diversity narrative across 300+
              partners.


              Geographic expansion provides a counter-concentration narrative. Alpaca's 40+ country footprint, the April
              2026 WealthKernel acquisition (Alpaca Europe, UK and EU regulated, Xetra live), and the pipeline of new
              LATAM (Bitso, trii, Zesty), Africa (Raenest, PandaPanda), Eastern Europe (Birbank/Azerbaijan), and GCC
              (ZAD, CUSP Wealth) partners dilute US-centric and single-partner revenue concentration. Alpaca's stated
              Saudi Vision 2030 alignment (cited by CEO Yokokawa in the Series D announcement) and the Derayah Financial
              partnership suggest further MENA expansion is strategically prioritized. However, the underlying revenue
              contribution of emerging-market partners (which typically start with smaller account populations) versus
              anchor partners (Kraken, Binance, SBI) is entirely opaque.


              TradingView's verified user review board surfaces a recurring complaint pattern about Alpaca's customer
              support: delayed responses during high-volume periods, accounts restricted based on compliance reviews
              without clear communication, and authentication/MFA lockout issues. These complaints are qualitative and
              may reflect the retail Trading API user base rather than institutional Broker API partners, but they
              signal a support infrastructure that may not scale with the partner base's complexity. BrokerChooser
              (4.1/5) and DailyForex (3.5/5) each cite limited market coverage (US-only assets, no international
              equities) and community-forum-only support as notable weaknesses for retail users.
