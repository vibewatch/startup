      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Assessing Alpaca's risk mitigation maturity requires separating the disclosures Alpaca has voluntarily
              made from the compliance posture revealed by regulators. On the positive side: Alpaca admitted the SEC
              violations, cooperated with investigations, and has since obtained OCC and FICC clearing memberships
              indicating FINRA and clearing organization confidence in current-state compliance. The 2025 annual audit
              by Grant Thornton provides independent financial verification of the broker-dealer entity. The net capital
              position shows significant cushion over the regulatory minimum.


              Against these mitigants, the severity ranking is: (1) highest severity—repeated supervisory control
              failures spanning multiple regulators and a five-year time window; (2) high severity—May 2026 uptime of
              48.4% in a production B2B brokerage infrastructure context; (3) high severity—partner concentration in
              Kraken/Binance with no public SLA, uptime guarantee, or concentration disclosure; (4) medium
              severity—tokenization legal classification risk under January 2026 SEC guidance; (5) medium
              severity—undisclosed financial position and credit-facility terms; (6) medium severity—entity naming
              confusion between Alpaca Securities LLC and Alpaca Clearing LLC; (7) lower severity—cross-border licensing
              footprint gap.


              The most concrete near-term kill trigger is any new material enforcement action filed by the SEC or FINRA
              within 24 months of the March 2026 AWC—the standard for "heightened supervision" classification. A third
              action would likely trigger FINRA's Membership Application Program (MAP) review, potentially freezing new
              product launches and international expansion until compliance remediation is verified. Similarly, any
              Binance or Kraken regulatory de-authorization (e.g., Binance's ongoing DOJ and global regulatory matters)
              that prevents either firm from serving US customers would impose an immediate revenue shock to Alpaca's
              infrastructure utilization.


              Monitoring indicators proposed: (a) BrokerCheck disclosures page for new enforcement events; (b) SEC EDGAR
              FOCUS report filings for net capital trend; (c) status.alpaca.markets monthly uptime for infrastructure
              reliability; (d) quarterly PFOF revenue disclosure once SEC Rule 606/605 amendments take effect; (e)
              Alpaca Europe FCA or equivalent licensing announcements; (f) xStocks product regulatory status updates for
              any SEC staff no-action or reclassification.
