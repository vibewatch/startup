      - number: '7.2'
        title: Operational and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Alpaca's August 2025 acquisition of OCC and FICC clearing memberships—completing a full multi-asset
              self-clearing stack (DTCC for equities, OCC for options, FICC for treasuries)—was strategically necessary
              but operationally concentrating. As a self-clearing and carrying firm, Alpaca now owns every link in the
              trade lifecycle from execution to settlement, eliminating third-party clearing costs but absorbing every
              operational and capital risk that previously sat with a clearing correspondent.


              The service reliability record is materially concerning. Third-party monitoring services show May 2026
              uptime at 48.4%, meaning the Broker API and trading systems experienced issues on roughly half of all
              calendar days that month. April 2026 uptime was 86.7%, and June 2026 (through mid-month) 81.3%. The
              specific incidents include multi-hour Broker API timeout events (May 26-30, 2026), journal processing
              delays on June 1, 2026, execution venue disconnections on June 11, 2026, and funding-service outages on
              June 14, 2026. Over the 90-day window through mid-June 2026, Alpaca recorded 15 incidents with a median
              duration of approximately 1 hour 56 minutes. For a B2B platform whose partners embed it in production
              financial applications serving millions of retail end-users, even brief outages have chain-reaction
              impacts on partner customer experience, regulatory order-handling obligations, and SLA liability.


              The self-clearing model adds settlement-failure risk. In a T+1 settlement environment, any infrastructure
              failure that prevents timely settlement creates counterparty obligations at DTCC, OCC, or FICC. A clearing
              member suspension—even temporary—would prevent all Alpaca partners from settling trades, triggering a
              potential cascading failure across the 300+ partner ecosystem. Alpaca carries substantial customer
              collateral (fractional share repurchase obligations and margin receivables on its balance sheet) and
              operates with customer cash sweep programs; an operational failure at settlement could require emergency
              liquidity.


              Alpaca's crypto arm (Alpaca Crypto LLC, NMLS #2160858) is a FinCEN-registered money services business but
              is not a FINRA member and its assets are not FDIC- or SIPC-insured. This segregation means that end-users
              transacting through crypto-integrated partners like GoTyme Bank or Binance (for crypto-side assets) have
              materially different investor-protection profiles than users holding US equities through the
              SIPC-registered Alpaca Securities LLC entity.


              Cybersecurity risk has also heightened: FINRA's 2026 Annual Regulatory Oversight Report specifically flags
              new account fraud, account takeover, GenAI-enabled identity spoofing, and ransomware as threats targeting
              broker-dealers. The same recordkeeping failures that triggered the 2024 SEC enforcement action indicate
              that Alpaca's communications-governance infrastructure has historically lagged its growth pace.
