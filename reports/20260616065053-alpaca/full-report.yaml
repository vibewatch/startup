      - number: '3.5'
        title: Switching Costs, Multi-Homing, Moat Durability, and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              Alpaca's competitive moat rests on four reinforcing mechanisms: regulatory infrastructure depth (full US
              clearing stack), technical integration lock-in, multi-asset breadth, and tokenization ecosystem dominance.
              The switching cost of migrating a fintech partner off Alpaca to a competitor is non-trivial: it requires
              re-implementing the full account opening and KYC flow, re-testing order management and clearing
              integration, migrating existing customer accounts (potentially requiring ACAT processes), renegotiating
              regulatory compliance documentation, and absorbing potential downtime. For partners with large established
              user bases (e.g., an app with hundreds of thousands of active accounts), this migration cost is
              effectively prohibitive on short timescales. However, for new partners—especially those in the ideation or
              early build stage—multi-homing (running parallel integrations on Alpaca and DriveWealth, for instance) is
              technically feasible and creates competitive pressure at the acquisition stage.

              The tokenization moat is the most asymmetric and novel element of Alpaca's position. Alpaca claims ~94%
              market share in tokenized US equities custody as of its 2025 Instant Tokenization Network launch, with
              major token issuers (Ondo Finance, Dinari, Backed/xStocks, Kraken) all using Alpaca as their underlying US
              securities custodian. This creates a network effect: the more tokenization platforms depend on Alpaca, the
              more the tokenized equity market effectively endorses Alpaca's infrastructure. However, this concentration
              is also a systemic risk: a regulatory change, technical outage, or financial stress at Alpaca would
              simultaneously affect all downstream tokenization platforms, concentrating systemic counterparty exposure
              in a way that regulators may eventually require to be diversified.

              Adverse evidence and moat threats: First, balance sheet asymmetry. IBKR generated $10.22B in 2025 revenue;
              Alpaca is a $1.15B unicorn that has not disclosed revenue. The incumbents can sustain price wars,
              regulatory investments, and product expansions at a pace Alpaca cannot match from internal cash flow.
              Second, DriveWealth's EU regulatory expansion (Bank of Lithuania MiFID II, 2024) means Alpaca Europe will
              face a direct API-first competitor in its most important new geography. Third, the Synapse collapse raised
              broad BaaS trust issues that affect the entire embedded brokerage sector. While Alpaca holds its own FINRA
              membership and self-clears (unlike Synapse, which depended on sponsor banks), the sector perception damage
              is real, and compliance-sensitive partners now perform deeper due diligence on intermediary counterparty
              risk. Fourth, partner concentration: Alpaca's wholesale B2B model means revenue is likely concentrated in
              a small number of high-volume partners; loss of one or two top partners would have a disproportionate
              impact. Fifth, Apex's State Street partnership creates a well-capitalized competitor in the institutional
              and wealth-manager-focused clearing market, potentially pulling upmarket fintech clients toward Apex/State
              Street combined infrastructure.

              Despite these risks, Alpaca's moat durability is assessed as above average for the 2–4 year horizon: the
              combination of self-clearing infrastructure, tokenization custody dominance, multi-asset breadth, and
              Europe expansion via Alpaca Europe makes it meaningfully differentiated from any single competitor. The
              key variable is whether DriveWealth or a well-capitalized new entrant can close the tokenization and
              multi-asset gap before Alpaca deploys its $150M Series D capital into further self-clearing and product
              expansion.
