  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Alpaca operates at the intersection of brokerage-as-a-service infrastructure, fractional share trading
              technology, and tokenized equities settlement rails. The core market addressed is brokerage infrastructure
              APIs: the regulatory and technology services that allow fintech apps, neobanks, crypto exchanges, wealth
              platforms, and international investment apps to embed U.S. equities, ETF, options, and fixed-income
              trading without building their own FINRA-registered broker-dealer or obtaining self-clearing approvals
              from DTCC, OCC, or FICC. The included spend boundary encompasses per-account platform fees, per-trade
              infrastructure and execution fees, clearing and settlement charges passed through to partners,
              securities-lending revenue sharing, payment-for-order-flow rebates, and tokenization minting/redemption
              infrastructure charges. Excluded from the core market boundary are retail brokerage commissions earned on
              direct-to-consumer platforms (Robinhood, IBKR, Schwab), pure ACH or card payment network fees, credit
              bureau data services, core banking software licenses, and crypto spot-exchange infrastructure.


              The principal status-quo substitute is the internal build path: a fintech obtaining its own
              FINRA-registered introducing or self-clearing broker-dealer license. This path requires multi-year
              regulatory approval (FINRA membership, net capital requirements of $250K–$5M+ depending on clearing model,
              DTCC clearing membership which required Alpaca itself approximately five years), ongoing compliance
              staffing, and initial build costs typically in the $5–15M range before achieving operational scale. A
              second substitute is a legacy white-label clearing relationship with an incumbent custodian such as
              Pershing (BNY Mellon), National Financial Services (Fidelity), or RBC Clearing—firms that offer custody
              and clearing services but lack modern RESTful API architecture and require higher minimum volume
              commitments. A third substitute is using an existing API-first brokerage infrastructure competitor:
              DriveWealth, Apex Fintech Solutions, or Interactive Brokers Prime. Tokenized-equities infrastructure—fees
              charged to issuers and DeFi protocols for minting and redeeming tokenized equities through compliant
              broker-dealer rails—is an adjacent and rapidly growing market segment that Alpaca pursues through its
              Instant Tokenization Network but that differs from traditional brokerage API fees in its revenue model and
              counterparty type.
