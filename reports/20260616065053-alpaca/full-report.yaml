  - id: FI001
    title: Revenue Model Bridge
    type: flow
    layout: wide
    summary: >-
      Alpaca converts partner trading activity into revenue through six monetization nodes; retained gross profit
      depends on partner revenue-sharing terms—most visibly the Binance 50/65 split—and self-clearing efficiency.
    data:
      nodes:
        - id: pfof
          label: Payment for Order Flow
          detail: >-
            Market makers pay Alpaca for routing; primary revenue vector. Binance receives 50% of PFOF on
            Binance-sourced orders.
          tone: warning
        - id: api-fees
          label: API / Platform Fees
          detail: B2B enterprise fees for Broker API access and clearing infrastructure; pricing not publicly listed.
          tone: positive
        - id: margin-interest
          label: Margin Interest
          detail: Interest on margin loans at 6.25% published rate; scales with account and balance growth.
          tone: positive
        - id: fpsl
          label: Securities Lending (FPSL)
          detail: >-
            Fully paid securities lending income; Binance takes 65% of residual profit after user interest on Binance
            accounts.
          tone: warning
        - id: cash-sweep
          label: High-Yield Cash Sweep
          detail: FDIC sweep spread on uninvested cash balances; rate not publicly disclosed.
          tone: positive
        - id: crypto-fees
          label: Crypto Maker-Taker Fees
          detail: Volume-tiered 0.15–0.25% fee on crypto trading; competitive but additive.
          tone: neutral
        - id: gross-revenue
          label: Gross Revenue Pool
          detail: All six streams contribute to the gross revenue base before partner sharing and costs.
          tone: positive
        - id: partner-sharing
          label: Partner Revenue Sharing
          detail: Binance and potentially other partners receive contractual revenue shares before Alpaca retains.
          tone: warning
        - id: retained-profit
          label: Retained Gross Profit
          detail: Alpaca's net retained revenue after partner sharing and clearing cost; not publicly disclosed.
          tone: neutral
      edges:
        - from: pfof
          to: gross-revenue
        - from: api-fees
          to: gross-revenue
        - from: margin-interest
          to: gross-revenue
        - from: fpsl
          to: gross-revenue
        - from: cash-sweep
          to: gross-revenue
        - from: crypto-fees
          to: gross-revenue
        - from: gross-revenue
          to: partner-sharing
        - from: partner-sharing
          to: retained-profit
    approximationNotes: >-
      Bridge is qualitative. Revenue mix by stream is not publicly disclosed. Partner revenue-sharing terms other than
      the Binance arrangement are unknown. Retained gross profit is estimated directionally only.
