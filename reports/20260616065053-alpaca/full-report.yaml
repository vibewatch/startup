      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >-
              Alpaca was co-founded by Yoshi Yokokawa and Hitoshi Harada, both Japanese nationals who relocated to
              Silicon Valley to build the company. Yokokawa, who serves as CEO, previously worked as an investment
              banker in both the United States and Japan (including at Lehman Brothers) before pivoting to
              entrepreneurship after a period of personal algorithmic day-trading that made him acutely aware of the
              inadequacy of retail brokerage tooling. He has served as the company's primary public spokesperson and
              strategic driver since founding. Hitoshi Harada serves as Chief Product Officer (CPO), overseeing Alpaca's
              API product architecture; both founders remain operationally active. In connection with the January 2026
              Series D financing, Chris Olsen—co-founder and partner of lead investor Drive Capital—joined Alpaca's
              Board of Directors, becoming the only publicly confirmed board-level addition from this round. Following
              the April 2026 acquisition of WealthKernel, Karan Shanmugarajah (previously CEO of WealthKernel) was
              appointed CEO of Alpaca Europe, overseeing the company's UK and EU operations. Beyond these named
              individuals, Alpaca's broader C-suite and full board composition are not publicly disclosed as of the run
              date. Yokokawa's dual roots in Japanese finance—combined with investors including SBI Group, MUFG
              Innovation Partners, Monex Ventures, and the licensed Japanese entity AlpacaJapan Co.—represent a
              meaningful strategic differentiator for the company's Asia-Pacific growth ambitions and its ability to
              source institutional distribution partners in Japan and wider Southeast Asia.
