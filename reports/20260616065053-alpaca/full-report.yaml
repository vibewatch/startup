      - number: '8.4'
        title: Anti-Thesis, Private Opacity, and Risk Adjustments
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Alpaca rests on three structural claims: that brokerage API infrastructure is a
              high-moat, recurring-revenue business model; that self-clearing creates a durable unit-economics
              advantage; and that the company's global partner breadth positions it to compound as embedded investing
              grows internationally. Each claim is partially supported by evidence, but each also carries a significant
              anti-thesis.


              The moat claim is genuine but contested. Alpaca has a first-mover advantage in several geographies, a
              developer-friendly API reputation, and a DTCC+OCC+FICC self-clearing stack that took years to build.
              DriveWealth has similar infrastructure and has served blue-chip customers including Cash App, Revolut, and
              BTG Pactual for longer. Apex Fintech Solutions powers SoFi and Webull at larger scale. None of these
              platforms have demonstrated winner-take-all dynamics; the largest partner relationships can be
              renegotiated or switched, and new entrants from large banks and exchanges could commoditize the API layer.


              The private opacity problem is central to the anti-thesis. Alpaca has not disclosed audited financials,
              gross margin, NRR, burn rate, or cap-table structure. Without gross-margin data, it is impossible to
              assess whether the self-clearing dividend has been realized at the unit level or whether the PFOF haircut
              from Binance (50% of PFOF, 65% of lending profit on Binance-sourced accounts) has eroded the margin gains.
              Binance holds a minority equity stake in Alpaca, making the economic relationship multi-layered and harder
              to renegotiate. If Binance represents 20–30% of Alpaca's account activity—plausible given the size of
              Binance's user base—the blended economics for that cohort are materially different from the headline ARR
              figure.


              The tokenization option value embedded in the $1.15B mark adds upside optionality that is not yet
              monetized. Alpaca's claim of 94% market share in tokenized US equities and ETFs reflects company-stated
              figures that have not been independently verified, and the tokenization revenue stream is nascent.
              WealthKernel adds a regulated European footprint but comes with integration costs and regulatory
              complexity that are not quantified. Both items are real option values but should not be the primary
              underwriting thesis for the current valuation.


              The regulatory environment adds residual risk from the September 2024 SEC order (off-channel
              communications, $400K civil penalty), FINRA SD-2436 membership continuance review, and ongoing PFOF
              regulatory uncertainty in international markets. The FINRA review was resolved in favor of continued
              membership after Alpaca's remediation, but the episode added reputational and operational overhead.
              European PFOF restrictions under MiFID II complicate the global revenue mix, and regulatory evolution in
              the UAE, Southeast Asia, and Latin America—key partner geographies—introduces execution risk.
