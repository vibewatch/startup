      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >
              Five principal growth drivers underpin expansion of the brokerage infrastructure API market through 2026
              and beyond. First, retail investor digitization: U.S. retail investors' share of equity market trading
              grew from 14% in 2019 to 22% by 2022, and global fintech adoption reached approximately 64% of digitally
              active consumers in 2024, with B2B fintech companies (API-driven infrastructure) growing from 45% to 62%
              of all new fintech startups between 2022 and 2026. Second, global equities access demand: approximately
              55–62% of U.S. adults own equities, but participation rates in emerging markets are only 5–15%—a
              structural gap amplified by capital control regimes in China ($50K annual forex quota), India ($250K), and
              Brazil. Tokenized equities and embedded brokerage offer a compliantly accessible path into U.S. markets
              for these investors, creating a large unserved demand base. Third, the December 2025 DTCC authorization to
              tokenize Russell 1000 constituents, select ETFs, and U.S. Treasuries under a three-year pilot—with live
              trading planned for 2026—provides major institutional infrastructure momentum. Fourth, Alpaca's expanded
              xStocks partnership with Kraken, in which Alpaca serves as preferred custody and ITN venue for tokenized
              equity minting and redemption, demonstrates the demand from crypto-native platforms for compliant U.S.
              equities rails that did not previously exist as a market segment. Fifth, 24/7 and 24/5 trading
              capabilities: Alpaca launched 24/5 stock trading in 2025, and ITN provides round-the-clock settlement,
              appealing to international buyers operating in different time zones who are currently constrained by U.S.
              market hours.
