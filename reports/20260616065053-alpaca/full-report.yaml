      - number: '1.5'
        title: Key Milestones and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Alpaca's history contains a rich sequence of founding, financing, product, and regulatory milestones
              alongside one material adverse event. The company's 2015 founding, early MarketStore work, and 2018
              commission-free brokerage API launch established its engineering DNA and developer-first identity. YC W19
              participation in early 2019 added accelerator credibility and network access. The 2021 Series B marked
              Alpaca's first major institutional round and triggered rapid B2B2C expansion—accounts grew from near zero
              at end-2020 to over 100,000 by mid-2021. DTCC approval in 2023 and full transition to self-clearing in
              2024 was a critical operational milestone enabling Alpaca to manage the complete trade lifecycle in-house
              without correspondent brokers. In 2025, Alpaca secured OCC and FICC memberships (completing coverage of
              equities, options, and Treasuries), became a Nasdaq Exchange Member, and launched several major products
              including options, fully paid securities lending, fixed income, and 24/5 trading. The April 2026
              acquisition of WealthKernel—rebranded as Alpaca Europe—with Xetra live on day one represents Alpaca's
              formal European market entry. The principal adverse event in Alpaca's record is the September 24, 2024 SEC
              order (Exchange Act Release No. 101137) finding that Alpaca Securities LLC willfully violated Section
              17(a) of the Exchange Act and Rule 17a-4(b)(4) by failing to preserve off-channel communications from May
              2022 onward, with supervisors using personal devices in violation of firm policies. The SEC censured
              Alpaca, ordered it to cease and desist, and imposed a $400,000 civil penalty. FINRA subsequently issued
              Membership Continuance Notice SD-2436 on March 6, 2025, approving continued FINRA membership despite the
              resulting statutory disqualification—confirming that the regulator found remediation adequate. Alpaca
              implemented enhanced compliance controls, policy changes, and communications technology prior to the
              order's issuance.
