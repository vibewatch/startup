      - number: '1.4'
        title: Scale, Products, and Regulatory Footprint
        blocks:
          - type: paragraph
            body: >-
              Alpaca's scale metrics as of June 2026 come from two slightly different company-issued figures reflecting
              different reporting dates. The about-us page reports hundreds of institutional and fintech partners in 40+
              countries, with partners having opened over 7 million accounts, and a developer community of 61,000
              monthly active developers (MAD). The January 2026 Series D announcement states Alpaca has partnered with
              300+ organizations in more than 40 countries and powers over 9 million brokerage accounts—a figure updated
              from the about-us. These two figures are reconcilable as reflecting different measurement dates, with the
              Series D figure being more recent and authoritative. Alpaca's product suite expanded substantially in
              2025: the company launched multi-leg options, fully paid securities lending (FPSL), fixed-income (U.S.
              Treasuries), and 24/5 U.S. stock trading. It introduced a High-Yield Cash product through an
              interest-bearing sweep program and unveiled its Instant Tokenization Network at TOKEN2049 Singapore in
              late 2025 with launch partners including xStocks, Dinari, Ondo Finance, and the Solana Foundation. Alpaca
              has claimed a 94% market share in tokenized U.S. equities and ETFs as of its 2025 tokenization report—a
              company-stated figure not independently verified. The company also stated it more than doubled
              year-over-year revenue in the period prior to the Series D. Alpaca's regulatory footprint spans multiple
              jurisdictions: in the U.S., Alpaca Securities LLC (also operating as Alpaca Clearing) holds FINRA
              membership and self-clears through DTCC (equities), OCC (options), and FICC (Treasuries); Alpaca Crypto
              LLC (NMLS# 2160858) handles digital-asset operations; AlpacaJapan Co. (JSDA# 3024) operates in Japan;
              AlpacaX entities operate in the Bahamas; and following the April 2026 WealthKernel acquisition, Alpaca
              Europe is regulated in the UK and EU. Alpaca also became a Nasdaq Exchange Member in 2025. BrokerCheck
              confirms the firm conducts 11 types of businesses and carries two regulatory disclosure events.
