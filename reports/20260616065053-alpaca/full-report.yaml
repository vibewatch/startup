      - number: '3.2'
        title: 'Direct Peer Profiles: DriveWealth, Apex Fintech, IBKR, and Tradier'
        blocks:
          - type: paragraph
            body: >-
              DriveWealth was founded in 2012 and raised approximately $569M in total capital through its August 2021
              Series D, which valued the company at $2.85B—the highest disclosed valuation among pure API-first
              brokerage infrastructure peers. Its core product is a fractional-share Brokerage-as-a-Service platform
              with patented dollar-based trading, API-driven clearing and custody, and NYSE Floor execution access.
              DriveWealth's infrastructure has attracted 100+ global fintech partners and is used to power embedded
              investing in digital wallets, neobanks, and broker-dealer apps across multiple continents. A February 2025
              partnership with wealth management platform OneVest extended DriveWealth's reach into advisory and
              portfolio management tooling. A 2024 Bank of Lithuania license provides passportable MiFID II coverage
              across 30 EEA states—directly competing with Alpaca's European ambitions via Alpaca Europe. DriveWealth
              enterprise pricing is custom and undisclosed, similar to Alpaca. The key limitation relative to Alpaca is
              that DriveWealth's last major funding round was in 2021, and no new equity raise has been publicly
              announced since then, raising questions about balance-sheet trajectory; moreover, its asset coverage does
              not include fixed income, multi-leg options, or tokenized equities at the same depth as Alpaca.

              Apex Fintech Solutions, owned by PEAK6 Group, is the largest pure-play B2B clearing and custody platform
              in the US by accounts (22M+) and AUC ($200B+). State Street Corporation—the world's second-largest
              custodian with $49 trillion in AUC/AUA—took a minority stake in Apex in 2025, validating Apex's
              institutional credibility and adding a channel to global wealth management clients. Apex launched the Apex
              Ascend platform in 2025, a real-time cloud-native infrastructure upgrade covering onboarding, ledger,
              order management, smart order routing, portfolio rebalancing, and cloud data tools. Apex is self-clearing
              (Apex Clearing brand) and supports a broad asset universe including equities, ETFs, options, mutual funds,
              and alternatives. Crucially, Tradier—a direct Alpaca API competitor—clears through Apex Clearing, making
              Apex the infrastructure backbone beneath Tradier. Apex's primary limitation for Alpaca's target segment is
              its focus on established RIA and broker-dealer clients rather than lean fintech API startups; it lacks
              Alpaca's tokenization capability and international API reach.

              Interactive Brokers is the most powerful incumbent in the broader ecosystem. IBKR generated approximately
              $10.22 billion in net revenue in 2025 (9.73% YoY growth) and serves 4.4M+ client accounts across 200+
              countries. Its APIs—REST Web API, FIX, and TWS API—support multi-asset trading across 170+ markets in
              stocks, options, futures, FX, fixed income, crypto, and funds. IBKR operates a white-label and
              introducing-broker program under which broker-dealers and fintechs can offer branded platforms that
              execute and clear through IBKR's infrastructure. The competitive risk from IBKR is its asymmetric scale
              and balance sheet: IBKR's institutional capitalization and multi-asset coverage far exceeds Alpaca's
              current footprint. However, IBKR is not API-first in the B2B infrastructure sense—its primary business
              remains self-directed retail and institutional trading, and its developer experience and onboarding
              complexity are notably less frictionless than Alpaca's.

              Tradier is the most transparent and developer-accessible API brokerage for US equities and options.
              Published pricing includes commission-free equity trades and $0.35/contract options on its free tier, with
              a Pro plan at $10/month for unlimited options, and a Pro Plus plan at $35/month with futures access.
              Tradier provides REST and WebSocket APIs with full options chain data (including Greeks), supports 100+
              third-party platform integrations, and uses OAuth 2.0 for authentication. Its limitation is structural:
              Tradier is not self-clearing (it clears through Apex Clearing) and covers only US equities and options,
              with no crypto, fixed income, fractional international equities, or tokenization capability. For US retail
              algo traders and developer-first applications, Tradier is a strong choice; for B2B brokerage
              infrastructure building a global multi-asset platform, it is out of scope.
