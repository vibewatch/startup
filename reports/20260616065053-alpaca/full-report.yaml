      - number: '6.3'
        title: Adoption Trajectory and Growth Velocity
        blocks:
          - type: paragraph
            body: >-
              Alpaca's partner and account growth trajectory is well-documented across a multi-year arc, though the data
              comes entirely from company-issued announcements and is not independently audited. The key inflection
              points are: the Kraken Embed blog post (undated but estimated pre-2025) cited "more than 200 enterprise
              partners and over five million end-user accounts"; the SBI Securities announcement (early 2025) cited
              "hundreds of partners across 40 countries, collectively serving over 7 million brokerage accounts"; the
              December 2025 GoTyme Bank announcement cited "hundreds of fintechs and institutions in 40+ countries with
              over $170M in funding" and "over 8 million brokerage accounts"; and the January 2026 Series D announcement
              confirmed "300+ organizations in more than 40 countries" powering "over 9 million brokerage accounts." The
              progression from 5 million to 9 million accounts across approximately 12–18 months implies material growth
              in the partner-originated account base.


              Partnership velocity is also evident from the 2025–2026 case study cadence documented on Alpaca's blog,
              which lists 66 total case studies (some active, some announced). Notable new additions include Binance
              (June 2026), BridgeWise (March 2026), GoTyme Bank (December 2025), Gotrade (new SEA features), Bitget
              Reality (tokenized stocks), Anchored (tokenized NASDAQ stocks with DeFi composability), Birbank Invest /
              Pasha Capital (Azerbaijan), Raenest (Nigeria), and PandaPanda (Kenya). The geographic diversification of
              new partnerships—spanning APAC, Africa, Eastern Europe, and LATAM—is consistent with Alpaca's stated
              mission of opening financial services to everyone on the planet. The developer community of 61,000 monthly
              active developers is a leading indicator of pipeline conversion, though the conversion rate from MAD to
              active Broker API partner is not disclosed.


              The Alpaca 2025 year-in-review blog confirms that the company held a Partner Summit in Kyoto (Japan) in
              2025, where it announced 24/5 trading—signaling sufficient partner scale and strategic weight to warrant
              an in-person global summit. The announcement of Binance in June 2026, the world's largest crypto exchange,
              represents a step-change in potential account scale: Binance serves over 300 million users globally, and
              even 1% conversion to US stock trading via Alpaca would dwarf the current 9 million account base.
