      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Self-Clearing Infrastructure as a Durable Moat
            body: >-
              Alpaca's transition to full self-clearing across DTCC (equities), OCC (options), and FICC
              (Treasuries)—combined with Nasdaq Exchange Member status—is a rare and capital-intensive regulatory
              achievement for a fintech company of its size. Self-clearing enables Alpaca to offer faster trade
              processing, real-time post-trade visibility, and customizable workflows to partners without correspondent
              brokers, creating a structural cost and capability advantage that is difficult for pure-API competitors to
              replicate without comparable regulatory investment and capital commitment.
            calloutType: strength
            claimRefs:
              - CO031
              - CO032
              - CO033
          - type: callout
            title: SEC Enforcement and FINRA Disqualification History
            body: >-
              The September 2024 SEC order (Release No. 101137) finding willful records-retention violations, resulting
              in a $400,000 civil penalty and statutory disqualification, is the most material adverse event in Alpaca's
              regulatory history. Although FINRA approved continued membership via SD-2436 in March 2025 after reviewing
              Alpaca's remediation, heightened regulatory supervision remains ongoing. Prospective institutional
              partners and investors should review both regulatory events—confirmed in BrokerCheck as Disclosure Event
              count: 2—as part of standard counterparty due diligence.
            calloutType: risk
