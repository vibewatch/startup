figures:
  - id: "FM001"
    title: "Brokerage Infrastructure Market Sizing Pyramid (TAM / SAM / SOM)"
    type: "pyramid"
    layout: "standard"
    summary: "Three-layer view from the global embedded finance TAM to the fractional share infrastructure SAM and Alpaca's estimated SOM, illustrating the wedge the company is capturing within a large market."
    data:
      items:
        - label: "TAM: Global Embedded Finance Market (2026)"
          value: "$115–156B"
          description: "Full global embedded finance market including payments (43.7% share), lending, investment, insurance, and banking sub-segments. Investment category growing fastest at 27.66% CAGR to 2031. Sources: Mordor Intelligence, The Business Research Company."
        - label: "SAM: Embedded Investment & Brokerage Infrastructure (2026 est.)"
          value: "~$12–23B"
          description: "Embedded investment sub-segment estimated at 10–15% of embedded finance total, plus U.S. infrastructure revenue ($51B by 2026 per Bain, investment share ~15%). Includes API fees, clearing fees, securities-lending, and tokenization infrastructure. Sources: Mordor, TBRC, Bain/CoinLaw."
        - label: "SOM: Fractional Share Trading Infrastructure Market (2025)"
          value: "$4.8B (2025), growing to $12.7B by 2034"
