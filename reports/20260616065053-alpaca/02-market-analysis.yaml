    approximationNotes: "SAM ($12–23B) is a derived estimate applying a 10–15% allocation of embedded finance to investment infrastructure; no independent source publishes this sub-segment in isolation. SOM uses Dataintelo's fractional share infrastructure market as the best available proxy. Tokenized equities infrastructure ($35.8B tokenized securities market, Mordor) is excluded from this pyramid as a distinct adjacent market."
