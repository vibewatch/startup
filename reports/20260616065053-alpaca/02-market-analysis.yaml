callouts:
  - calloutType: "insight"
    title: "Scope Divergence Makes TAM Comparisons Unreliable Without Boundary Alignment"
    body: "Published TAM estimates for embedded finance range from $115B to $185B+ for 2026 from credible analysts. The 4–5× spread is almost entirely driven by scope definition: the high end includes all embedded finance sub-segments while the low end may restrict to specific verticals. Investors should anchor on the fractional share infrastructure market ($4.8B, 2025) as the most directly comparable sizing for Alpaca's current fee revenue, while treating the broader embedded finance market as a ceiling on long-run opportunity if Alpaca's infrastructure stack captures adjacent categories."
    claimRefs: [CM038, CM042]

  - calloutType: "risk"
    title: "China CSRC Crackdown Eliminates a Material Cross-Border Equities Segment"
    body: "The May 22, 2026 CSRC enforcement action against Futu Securities and Tiger Brokers—backed by eight Chinese government agencies—represents the most significant adverse market event for U.S. equities infrastructure in 2026. The two-year wind-down period for approximately 1 million mainland Chinese investor accounts, with an estimated HKD 200–250B in affected assets, materially reduces the addressable international retail investor base. Any Alpaca partner with material exposure to mainland Chinese end-users should be treated as facing reduced growth prospects through 2028."
    claimRefs: [CM033, CM034]

  - calloutType: "strength"
    title: "Self-Clearing Status Provides Structural Revenue and Moat Advantages"
    body: "Alpaca's self-clearing status—obtained after DTCC approval in 2023, extended to OCC and FICC in 2025—enables it to capture the full clearing margin in-house rather than sharing with a third-party clearer. This structural advantage allows more competitive pass-through pricing to partners and creates a meaningful barrier for rivals that remain introducing brokers. The same self-clearing infrastructure enables the ITN tokenization network, which would be economically impossible to operate compliantly as a non-self-clearing introducing broker."
    claimRefs: [CM003, CM028]

