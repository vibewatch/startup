    type: "quadrant"
    layout: "wide"
    summary: >-
      Alpaca leads the upper-right quadrant combining API-first design with multi-jurisdiction regulatory depth;
      IBKR leads on global reach but is not API-first in the B2B infrastructure sense; DriveWealth is the closest
      direct peer; Tradier and Zero Hash occupy more specialized positions.
