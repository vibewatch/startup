  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing-transparency"
      missingEvidence: >-
        Current enterprise B2B pricing for Alpaca Broker API, DriveWealth BaaS, and Apex Fintech clearing
        services—including per-account fees, order-flow revenue share, and minimum volume commitments.
      whyItMatters: >-
        Without enterprise pricing data, it is impossible to assess the true cost-of-switching for fintech partners
        or model the revenue economics and margin structure of Alpaca's infrastructure business.
      diligencePath: >-
        Request full enterprise pricing schedules for Alpaca, DriveWealth, and Apex in management due diligence;
        seek reference calls with 2–3 mutual fintech partners who have evaluated or switched between platforms.
      relatedQuestionRefs: [QP013]
      relatedTableRefs: [TP003]

    - type: "private-evidence-only"
      severity: "material"
      topic: "partner-concentration"
      missingEvidence: >-
        Distribution of Alpaca's revenue or order flow across its 300+ partner base; identity and weight of the
        top 5 partners; any partner non-renewal or churn events in 2025–2026.
      whyItMatters: >-
        A highly concentrated partner base would materially amplify the impact of any single partner insourcing,
        switching to DriveWealth, or failing—directly affecting Alpaca's moat durability assessment.
      diligencePath: >-
        Request partner concentration disclosure in due diligence; ask management for the number of partners
        exceeding 5% of order flow and any churn incidents since 2024.
      relatedQuestionRefs: [QP017]
      relatedTableRefs: [TP004]

    - type: "private-evidence-only"
