callouts:
  - calloutType: "strength"
    title: "Rare full self-clearing stack plus tokenization dominance"
    body: >-
      Among API-first brokerage infrastructure companies, Alpaca is the only platform combining full self-clearing
      across all three US verticals (DTCC equities, OCC options, FICC Treasuries) with a ~94% tokenized equity
      custody market share. This infrastructure depth is the primary moat. DriveWealth self-clears US equities
      but does not match Alpaca on options clearing, fixed income, or tokenization. No other pure B2B API peer
      has replicated this combination as of June 2026.
    claimRefs:
      - CP026
      - CP027
      - CP041
  - calloutType: "risk"
    title: "Partner concentration and balance sheet asymmetry are the primary adverse risks"
    body: >-
      Alpaca's B2B wholesale model concentrates revenue in a small number of high-volume fintech partners, and the
      company does not disclose partner revenue distribution. A top-partner exit or insourcing event could have
      outsized impact. Separately, IBKR's $10B+ revenue and the State Street/Apex alliance illustrate that well-
      capitalized incumbents have material advantages in price and product investment capacity relative to Alpaca's
      $1.15B unicorn scale.
    claimRefs:
      - CP034
      - CP037
      - CP008

