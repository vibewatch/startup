  - id: "incumbents-adjacent-substitutes"
    title: "Incumbents, Adjacent Rails, Substitutes, and Internal Build"
    body: >-
      Saxo Bank's OpenAPI represents the institutional white-label brokerage model most comparable to Alpaca at the
      enterprise tier, but focused on a different geography and asset universe. Saxo offers multi-asset coverage
      spanning FX, equities, commodities, bonds, and derivatives through a REST API with OAuth 2.0 authentication,
      accessible via a dedicated developer portal with sandbox, SDKs, and simulation accounts. White-label clients—
      broker-dealers, banks, and fintechs—can build fully branded trading portals running on Saxo's regulatory
      infrastructure and global market access across 170+ countries. Saxo is implementing enhanced KYC/AML onboarding
      requirements for introducing brokers and OpenAPI users with phased mandatory compliance deadlines in December 2025
      and January 2027. Saxo's primary differentiation vs. Alpaca is its multi-decade institutional track record and FX
      depth; its limitation is that it does not offer API-native US equities clearing-as-a-service to fintechs in the
      way Alpaca does, and its developer tooling is older and more complex than Alpaca's.

      Zero Hash occupies an adjacent position that is becoming more relevant as the crypto-equities boundary blurs.
      Zero Hash raised a $104M Series D in 2025 led by Interactive Brokers, with major participation from Morgan Stanley,
      Apollo-managed funds, SoFi, and Jump Crypto, reaching a $1B+ valuation and $275M in total capital raised since
      its 2017 founding. Its infrastructure powers crypto, stablecoin, and tokenization services for Stripe, BlackRock's
      BUIDL fund, Franklin Templeton, DraftKings, Republic, and over 80 fintech partners. Zero Hash is regulated across
      50 US states and 200+ international jurisdictions. The CEO's stated positioning as "the AWS of on-chain infrastructure"
      mirrors Alpaca's own positioning in equity rails—and the two platforms are beginning to converge in the tokenization
      space. For Alpaca, the dual risk is that Zero Hash could expand into equity custody rails while simultaneously
      threatening Alpaca's tokenization franchise by offering a competing custodian option to Ondo, Dinari, or Backed.

      The internal build / status quo alternative remains a genuine substitute for large institutions. Achieving FINRA
      membership, DTCC clearing membership, OCC options clearing membership, and FICC fixed income access requires
      substantial minimum capital (DTCC membership requires meeting net capital requirements typically in the millions),
      dedicated compliance and operations teams, multi-year regulatory approval timelines, and ongoing FINRA oversight.
      Alpaca's own journey from YC W19 to full DTCC/OCC/FICC/Nasdaq member status took approximately five years
      (2019–2025). For well-capitalized incumbents (Robinhood, traditional banks), this path is viable but costly;
      for lean fintechs and international apps, the regulatory complexity makes Alpaca's infrastructure a compelling
      alternative to internal build. The Synapse BaaS collapse of April 2024—where a $60-95M reconciliation failure
      left customer funds inaccessible for months—increased regulatory scrutiny of all BaaS and brokerage-as-a-service
      models, particularly regarding omnibus account integrity and the treatment of customer funds held through
      intermediaries. This event raised the compliance bar for all participants in the space.
