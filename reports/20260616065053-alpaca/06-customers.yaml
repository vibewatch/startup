  - id: "named-partner-proof"
    title: "Named Partner Proof: Verified Deployments and Evidence Quality"
    body: >-
      Alpaca has an unusually rich public record of named, production-deployed partners for a private brokerage
      infrastructure company. The January 2026 Series D announcement explicitly named Kraken, SBI Securities, and
      Dime! as representative partners, providing first-party confirmation of production status. Sarwa CEO Mark
      Chahwan's quoted endorsement in the same announcement—"Our partnership allowed us to connect global markets
      and MENA investors. We became Alpaca's first partner to offer options trading globally"—provides strong
      third-party corroboration of a multi-year, expanding relationship.


      Kraken represents Alpaca's most strategically multidimensional partnership. Kraken launched US equities for
      its 15+ million global clients via Alpaca's Broker API (US-only), offering access to 11,000+ stocks and ETFs
      commission-free with fractional shares. The relationship expanded in December 2025 when Kraken designated
      Alpaca as its preferred venue for sourcing and custodying the equities that back xStocks 1:1—tokenized
      equities that have surpassed $10 billion in combined transaction volume since their June 2025 launch.
      Separately, Alpaca integrated Kraken Embed (Crypto-as-a-Service) to offer crypto access across its 200+
      partner network. Kraken is also a Series D investor, creating a dual investor-partner alignment that—while
      commercially deepening the relationship—introduces governance and conflict-of-interest diligence questions.


      SBI Securities, Japan's largest online broker with over $338 billion in client assets under custody and
      Japan's top-ranked broker by accounts, number of accounts, and individual stock trading value, confirmed
      Alpaca as its US stock execution service provider. The partnership capitalizes on surging Japanese retail
      demand for US equities under the new NISA tax-advantaged savings program, with US equity holdings by
      Japanese investors rising from $596 billion in 2019 to $975 billion in 2024. This is a production execution
      relationship at institutional scale, not a pilot.


      Binance, the world's largest crypto exchange by trading volume with over 300 million global users, launched
      24/5 US stock and ETF trading powered by Alpaca on June 1, 2026—just 15 days before the run date. Users
      can access 7,000+ US-listed equities for as little as $5, funded by stablecoins (USDC, USDT, BNB).
      Binance chose Alpaca for its API flexibility, product diversity, and regulated self-clearing status. Binance
      has also announced plans to launch bStocks (tokenized US securities) in partnership with Alpaca's ITN
      infrastructure. The commercial terms include a publicly disclosed revenue-sharing arrangement where Binance
      receives a minority equity stake in Alpaca-generated flows.


      Sarwa, one of the UAE's leading investment platforms, has partnered with Alpaca since 2021—representing one
      of the earliest and longest-tenured deployments. In that time, Sarwa surpassed $3 billion in total trading
      volume and became the first Middle East fintech to offer US options trading (Level 1 and 2). The 2021 start
      date and continued active engagement through 2026 (confirmed by the Series D endorsement) provide the
      strongest publicly available proxy for partner retention.


      Dime! is Thailand's market-leading US investment app, confirmed as a named partner in the Series D
      announcement. Dime! reported 500% year-over-year growth, with Alpaca enabling fractional shares from 50
      baht ($1.50), simplified W-8BEN tax filing, and planned options trading. GoTyme Bank (Philippines),
      launched December 8, 2025, is a BSP-licensed, co-owned neobank (Gokongwei Group + Tyme Group) that used
      Alpaca's Broker API to launch GoCrypto, offering 11 cryptocurrencies to the Philippines' rapidly growing
      digital-asset market with 76% of Filipinos underbanked.


      ZAD (Kuwait) and Manzil (Canada/USA) are Alpaca's flagship Shariah-compliant partners, both representing
      active, publicly announced July 2025 partnerships. ZAD (a platform of The Securities House) offers
      Shariah-compliant US stocks and ETFs to GCC markets and is building Shariah-compliant margin trading,
      options, and high-yield cash with Alpaca. Manzil launched Manzil Invest USA in July 2025, an SEC-registered
      advisor platform powered by Alpaca to serve the estimated 3.45 million Muslims in the United States with
      AAOIFI-screened halal portfolios.
