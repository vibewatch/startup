callouts:
  - calloutType: "strength"
    title: "Binance and Kraken validate Alpaca's infrastructure at global exchange scale"
    body: >-
      The dual partnerships with Kraken (15M+ global clients, Series D investor, xStocks tokenization anchor)
      and Binance (300M+ users, launched June 1 2026) position Alpaca as infrastructure for the world's largest
      crypto-to-TradFi convergence platforms. No direct competitor has secured comparable partnerships with both
      exchanges simultaneously, and the partnerships validate both product reliability and compliance quality at
      institutional scale.
    claimRefs:
      - CU011
      - CU012
      - CU014
      - CU021
      - CU022

  - calloutType: "strength"
    title: "Sarwa's 4+ year partnership provides the strongest publicly available retention evidence"
    body: >-
      Sarwa's continuous partnership since 2021, $3B+ cumulative trading volume, progression from equities to
      crypto to options, and CEO-level endorsement in the Series D announcement constitute the best available
      proxy for long-term partner durability. The relationship has survived multiple market cycles and product
      launches, suggesting both technical reliability and commercial alignment between the parties.
    claimRefs:
      - CU019
      - CU020
      - CU043

  - calloutType: "risk"
    title: "Binance concentration risk could dwarf the rest of the partner portfolio"
    body: >-
      Binance serves 300 million global users — more than 33 times the current 9 million Alpaca-powered account
      base. If Binance's US stock feature achieves even 3–5% penetration of its user base, it would generate
      9–15 million accounts on Alpaca's infrastructure from a single partner, creating extreme concentration.
      Combined with Binance's partially disclosed revenue-sharing terms and its minority equity stake, this
      partnership may become Alpaca's dominant revenue source within 12–24 months — a structural shift not
      reflected in the current "300+ partners" narrative.
    claimRefs:
      - CU021
      - CU044
      - CU045

  - calloutType: "risk"
    title: "NRR and churn opacity are the primary diligence blockers for durability judgment"
    body: >-
      Alpaca discloses no NRR, GRR, churn, or cohort data. Named partner tenure proxies (Sarwa 4+ years, Dime!
      2+ years) are encouraging but derived from a handful of publicly highlighted relationships — the
      performance of the remaining 290+ partners is entirely opaque. Any investment judgment on customer
      durability must acknowledge this gap as a material uncertainty requiring direct management confirmation
      and ideally audited cohort data.
    claimRefs:
      - CU041
      - CU042

