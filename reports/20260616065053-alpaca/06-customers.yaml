  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: >-
        Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) from Alpaca's Broker API partner base;
        cohort-level churn data broken down by partner vintage (2021, 2022, 2023, 2024).
      whyItMatters: >-
        Without NRR/GRR, it is impossible to assess whether Alpaca's account growth is organic (new partner
        acquisition) or compensating for churning partners—the critical distinction for infrastructure durability.
        A company claiming 300+ partners may have acquired 500+ cumulatively if churn is material.
      diligencePath: >-
        Request NRR and GRR by cohort year from management. Ask for the number of Broker API partners active
        as of Dec 31 each year 2021–2025 versus the number of new partners acquired each year. Review
        representative partner contracts for auto-renewal terms and SLAs.
      relatedQuestionRefs: [QU013]

    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: >-
        Per-partner revenue contribution and revenue concentration metrics (e.g., top 3 partners as % of
        total Broker API revenue); Binance and Kraken's share of total partner-originated revenue.
      whyItMatters: >-
        The "300+ partners" narrative implies diversification, but if Kraken + Binance account for >50% of
        Broker API revenue, Alpaca's financial profile is effectively a concentrated-partner business. The
        Binance launch (June 1, 2026) may shift concentration materially within months.
      diligencePath: >-
        Request revenue breakdown by partner (with top 5 named and anonymized remainder). Ask management what
        % of 2025 revenue came from the top partner and top 3 partners. Model Binance upside/risk scenarios
        under different penetration rates.
      relatedQuestionRefs: [QU015]

    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: >-
        Whether any Broker API partners have churned or terminated their Alpaca relationship, and if so, the
        reasons (cost, compliance, product gaps, or strategic pivot).
      whyItMatters: >-
        Absence of publicly reported churn does not confirm zero churn. With 300+ partners and 66 case studies,
        there is a gap between the active partner count and the documented base. Understanding churn drivers
        (and whether departures involve switching to DriveWealth or Apex Fintech) is material to retention judgment.
      diligencePath: >-
        Ask Alpaca management directly for any partner terminations in 2023–2025. Review Alpaca's BrokerCheck
        filing for any disclosed complaints from institutional clients. Check if DriveWealth or Apex have
        announced wins that may correspond to Alpaca losses.
      relatedQuestionRefs: [QU016]

    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: >-
        The commercial terms of the Kraken investor-partner relationship: whether Kraken receives preferential
        pricing on API fees, revenue sharing, or governance rights as a consequence of its Series D equity stake.
      whyItMatters: >-
        Arm's-length pricing is essential for accurately modeling Alpaca's unit economics. If Kraken-originated
        revenue is significantly discounted relative to market rates, Alpaca's underlying profitability from
        institutional partnerships is overstated.
      diligencePath: >-
        Request a copy of the Kraken commercial agreement (with redactions as necessary). Confirm whether Kraken
        has an MFN clause or commercial preference. Ask if Kraken has board observer rights or veto powers
        on product decisions that affect crypto or tokenization strategy.
      relatedQuestionRefs: [QU026]

    - type: enumeration-incomplete
      severity: minor
      topic: adoption-trajectory
      missingEvidence: >-
        Year-over-year partner count data for 2023, 2024, and 2025 that would allow calculation of the
        precise growth rate from the ~200 partner count (Kraken Embed blog, pre-2025) to 300+ (Jan 2026).
      whyItMatters: >-
        Without precise annual partner count data, the growth rate claimed is ambiguous. The 50%+ growth
        from 200 to 300 partners implied over ~12 months is encouraging but cannot be confirmed without
        audited historical data. This affects assessment of sales velocity and pipeline maturity.
      diligencePath: >-
        Request annual partner count by cohort year (2021–2025) from Alpaca management. Review press releases
        and blog posts for historical milestone claims. Cross-check against case-study publication dates on
        the blog as a proxy for new partner onboarding timing.
      relatedQuestionRefs: [QU027]

    - type: enumeration-incomplete
      severity: minor
      topic: partner-count
      missingEvidence: >-
        The complete list of 300+ Alpaca Broker API partner organizations; revenue and account contribution
        from the 230+ partners not documented in case studies.
      whyItMatters: >-
        The 10 named partners in TU003 represent approximately 3% of the claimed 300+ partner base. The
        quality, scale, and retention profile of the unnamed 97% are unknown; they could include largely
        dormant or micro-scale partners.
      diligencePath: >-
        Request full partner list (with size, asset class, and launch date) from Alpaca under NDA. Review
