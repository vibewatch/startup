  - id: "financial-partner-concentration-risks"
    title: "Financial, Partner, and Concentration Risks"
    body: >-
      Alpaca's financial risk profile is materially opaque. As a private company, AlpacaDB, Inc. does not
      publish consolidated income statements, margins, or unit economics. Third-party estimates place Alpaca's
      annualized revenue in the $66–100M range, but this figure is unverified and the underlying model
      (PFOF, margin interest, API access fees) has never been publicly decomposed. Neither burn rate nor
      free-cash-flow position is disclosed. The $150M Series D raised in January 2026 and the separately
      mentioned $40M credit facility provide working capital visibility, but the credit facility terms—
      lender identity, rate, covenant package, and cross-default triggers—are undisclosed, creating a
      diligence gap for any partner or investor trying to assess financial-distress risk.


      The broker-dealer subsidiary (Alpaca Securities LLC) had net capital of $41.47M at June 30, 2025,
      an excess of $40.82M over its minimum requirement of $648K. While this excess appears comfortable, the
      minimum net capital required ($648K) is extremely low relative to the scale of customer assets being
      cleared, suggesting that regulatory minimum net capital may be an inadequate gauge of operational risk
      capital. The 2025 annual audit was prepared by Grant Thornton LLP and filed on Form X-17A-5 (February
      27, 2026, period ending December 31, 2025), providing independent verification of the broker-dealer
      entity's financial position but not the consolidated parent AlpacaDB.


      Partner concentration is the most visible financial risk. The Kraken partnership (US equities and
      xStocks tokenization) and the Binance partnership (launched June 1, 2026, targeting 300+ million global
      users) together likely represent a dominant share of Alpaca's total transaction volume and API usage.
      SBI Securities (Japan's largest online broker) adds a third mega-partner layer. No public concentration
      data has been disclosed, but the pattern of partnerships—where Alpaca CEO Yoshi Yokokawa described
      Kraken and Binance as centerpiece relationships in the Series D announcement—implies that the top 2–3
      partners likely account for a substantial majority of clearing flow. Loss of any of these partners
      through contract non-renewal, competitive displacement, regulatory de-authorization (e.g., Binance's
      ongoing global regulatory complexities), or technical failure could impose a step-function revenue shock
      that exceeds Alpaca's estimated runway from the Series D.


      International expansion execution risk also requires scrutiny. Alpaca is now present in 40+ countries,
      and the Series D was explicitly described as capital for continued international build-out. Entering new
      brokerage markets requires local licenses, capital adequacy compliance, data-localization compliance,
      and operational infrastructure in each jurisdiction. The track record of supervisory failures in the US
      operations does not inspire confidence that these new-market regulatory requirements will be met without
      further enforcement exposure.
