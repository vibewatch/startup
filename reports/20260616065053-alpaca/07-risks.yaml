callouts:
  - calloutType: "risk"
    title: "Two Enforcement Actions in 18 Months Signal Systemic Compliance Governance Gap"
    body: >-
      The overlap of FINRA Rule 3110 violations across both the SEC (Sept 2024) and FINRA (March 2026) actions
      is not coincidental—both found that Alpaca's supervisory systems failed to achieve compliance. Senior
      executives violated the firm's own policies in the SEC matter. A third enforcement action would likely
      trigger FINRA's heightened supervision program, potentially freezing product launches and international
      expansion until compliance remediation is independently verified.
    claimRefs:
      - CR001
      - CR008
      - CR039
      - CR042

  - calloutType: "risk"
    title: "May 2026 Uptime of 48.4% Is Unacceptable for a Production B2B Brokerage Infrastructure"
    body: >-
      ServiceAlert.ai monitoring shows Alpaca experienced issues on roughly half of all days in May 2026, with
      a 90-day median incident duration of nearly two hours. No public SLA exists. For a platform serving
      300+ financial institutions whose end-customers depend on it for trade execution, this reliability
      level constitutes a material partner-attrition and regulatory-exposure risk under FINRA's business
      continuity obligations.
    claimRefs:
      - CR023
      - CR024
      - CR025

  - calloutType: "recommendation"
    title: "Require Independent Compliance Review Attestation Before Material Partnership Decisions"
    body: >-
      Any institutional partner or investor should require: (1) a current compliance attestation confirming
      no open SEC or FINRA examination referrals; (2) a legal opinion on xStocks classification under
      the Jan 28, 2026 SEC joint staff statement; (3) a net capital trend from FOCUS reports; and (4) audited
      consolidated financials for AlpacaDB, Inc. rather than the subsidiary-only broker-dealer statements.
    claimRefs:
      - CR007
      - CR013
      - CR018
      - CR019
      - CR033

