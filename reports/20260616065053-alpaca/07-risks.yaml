chapter:
  number: 7
  title: "Risks"
  summary: >-
    Alpaca Securities LLC carries a compounding regulatory liability: two enforcement actions in under 18 months
    (SEC cease-and-desist and $400k penalty in September 2024 for firm-wide off-channel communications; FINRA
    $300k fine and censure in March 2026 for trade-reporting deficiencies spanning December 2020 through
    February 2026). These actions, layered on top of an operationally demanding self-clearing transition (OCC and
    FICC memberships approved August 2025) and a tokenization model whose regulatory treatment remains unsettled
    under the SEC's January 2026 joint staff statement, create material compliance, operational, and reputational
    risks. Concentration in a small number of mega-partners (Kraken, Binance, SBI Securities), chronic API
    reliability issues (May 2026 uptime: 48.4%), and a private-company opacity that withholds unit economics and
    credit-facility terms from potential partners and investors round out the risk landscape at the time of this report.

sections:
  - id: "regulatory-legal-risks"
    title: "Regulatory and Legal Risks"
    body: >-
      Alpaca Securities LLC (FINRA CRD #288202, SEC File 8-69928) is the regulated broker-dealer subsidiary of
      AlpacaDB, Inc. Its disclosed enforcement history now spans two separate regulator actions in less than two
      years, a pattern that raises a systemic compliance governance question beyond the individual violations.


      The first action is the SEC's September 24, 2024 administrative order (Release No. 34-101137). The
      Commission found that from at least May 2022, Alpaca personnel—including senior executives—routinely
      communicated via WhatsApp and personal-device text messages about the firm's broker-dealer business.
      Because those messages were never preserved, Alpaca violated Section 17(a) of the Exchange Act and Rule
      17a-4(b)(4). The SEC found the failure "firm-wide and involved personnel at various levels of authority,"
      imposed a $400,000 civil money penalty, a formal censure, and a cease-and-desist order. Alpaca admitted the
      facts and acknowledged federal securities law violations. The practical concern beyond the penalty is that
      the SEC explicitly noted the recordkeeping failures "likely impacted the Commission's ability to carry out
      its regulatory functions and investigate violations" across multiple subpoena responses—meaning the
      evidentiary impact extends beyond the recordkeeping issue itself.


      The second action is FINRA's March 20, 2026 Letter of Acceptance, Waiver and Consent. FINRA found that
      between April 2021 and June 2025, Alpaca failed to timely report approximately 1.87 million transactions to
      the FINRA/Nasdaq Trade Reporting Facility (FNTRF), violating Rules 6380A and 2010. Between February 2021
      and May 2023, the firm submitted inaccurate reports: execution quantities were wrong on over 6,700
      transactions, and required prior-reference-price modifiers and times were omitted on approximately 2.2
      million transactions. Compounding this, from December 2020 through February 2026—a span covering the
      firm's entire period as a self-clearing and carrying broker—Alpaca lacked written supervisory procedures
      reasonably designed to achieve compliance with FINRA's trade-reporting rules (FINRA Rules 3110 and 2010).
      FINRA imposed a $300,000 fine and censure. The overlap of FINRA Rule 3110 (supervision) violations across
      both the SEC and FINRA actions—recordkeeping supervision and trade-reporting supervision respectively—is
      a direct indicator of structural weaknesses in Alpaca's compliance infrastructure.


      A third emerging legal risk concerns tokenized securities. The SEC's January 28, 2026 joint staff statement
      (Divisions of Corporation Finance, Investment Management, and Trading and Markets) clarifies that federal
      securities laws apply to all tokenized securities regardless of whether ownership is recorded on-chain or
      off-chain. The statement distinguishes issuer-sponsored models from third-party models, and further
      differentiates custodial tokenized securities (which convey an indirect ownership interest) from synthetic
      tokenized securities (which may constitute security-based swaps, tradeable only with eligible contract
      participants under the Exchange Act). Alpaca's xStocks tokenization product—offered through the Kraken
      partnership—is a third-party custodial model. The legal classification determines end-investor rights,
      counterparty risk exposure, and the applicability of exchange-trading requirements; any regulatory
      reclassification of xStocks as a security-based swap product would materially restrict the eligible
      investor universe and require SEC registration of a trading venue.


      Cross-border licensing risk is structurally elevated. Alpaca operates in 40+ countries through partner
      embedding, which means each partner's end-users are effectively consuming a US-registered broker-dealer's
      clearing infrastructure without local country-level Alpaca registration in most jurisdictions. Alpaca
      Europe (built on the WealthKernel acquisition) provides a partial EU footprint, but the company does not
      publicly disclose the full licensing map. Unauthorized broker-dealer activity in any jurisdiction can
      trigger enforcement, partner liability, or forced withdrawal.
