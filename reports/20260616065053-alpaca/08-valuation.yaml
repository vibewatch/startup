chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Alpaca's $1.15B Series D post-money mark (January 2026) is anchored in evidence—Sacra estimates $100M ARR
    in September 2025 on 150% YoY growth, implying roughly 10–11.5x ARR at close—but the absence of audited
    financials, gross-margin disclosure, NRR, and cap-table detail forces a research-more call with medium
    confidence and a stretched stance rather than a price-insensitive buy. Public brokerage comps (HOOD at ~19.8x,
    IBKR at ~25.4x) trade at premiums justified by scale and liquidity; Alpaca's private-company discount is
    appropriate but leaves limited cushion given Binance revenue-sharing, partner concentration, and an
    unresolved PFOF regulatory overhang. The bull case at 12–18x on $200M+ ARR in 2027 puts fair value well
    above the current mark; the bear case at 5–7x on $100–120M brings it materially below.

sections:
  - id: "recommendation-and-anchor"
    title: "Recommendation and Valuation Anchor"
    body: >-
      Alpaca's January 2026 Series D set a $1.15B post-money unicorn valuation and closed $150M in new equity
      alongside a $40M line of credit. The round was led by Drive Capital—a growth-stage specialist with a
      track record in fintech infrastructure—joined by 27+ co-investors including Citadel Securities, BNP
      Paribas's Opera Tech Ventures, MUFG Innovation Partners, Kraken, and DRW Venture Capital. The
      strategic breadth of the investor roster confirms that sophisticated institutional participants with
      direct knowledge of brokerage economics priced the company at unicorn scale in January 2026. That
      evidence anchors the starting valuation for this analysis.


      At a $1.15B mark against Sacra's September 2025 estimate of $100M ARR—a figure corroborated by the
      company's own statement that revenue "more than doubled" year-over-year in the period preceding the
      Series D—the implied revenue multiple is approximately 11.5x on the Sacra figure or roughly 8.9–9.6x
      if the ARR trajectory continued to $120–130M by January 2026. Both readings place Alpaca squarely in
      the high-growth private fintech infrastructure bracket rather than at bubble-era extremes. The Series
      D validated product-market fit, partner breadth (300+ organizations, 40+ countries), and the self-
      clearing dividend from DTCC, OCC, and FICC memberships that structurally improve per-unit economics
      by eliminating third-party clearing costs.


      The recommended stance is research-more with medium confidence and a stretched valuation label. The
      stretch does not reflect an obviously bad price; it reflects private-company opacity that prevents
      confirmation of the evidence required for a buy call. Absent audited financials, gross-margin data,
      NRR, burn trajectory, and cap-table detail, a disciplined investor cannot determine whether the
      current price reflects a fair entry or an overpriced round. The recommendation would upgrade to buy
      on confirmation of ARR above $120M, gross margins above 35%, NRR above 110%, and Binance
      concentration below 25% of total revenue.
