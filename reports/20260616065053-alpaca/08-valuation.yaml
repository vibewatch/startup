  - id: "diligence-asks-and-investment-discipline"
    title: "Final Diligence Asks and Investment Discipline"
    body: >-
      The path from research-more to buy requires closing four core evidence gaps that no amount of
      public market benchmarking can substitute for. First, audited financials or management-prepared
      unaudited statements for FY2024 and FY2025 are required to confirm ARR, gross margin, cash burn,
      and EBITDA trajectory. Second, NRR must be confirmed above 110% to validate that Alpaca's installed
      partner base is expanding rather than churning. Third, the Binance revenue concentration must be
      quantified; if Binance represents more than 25% of ARR, the effective economics are meaningfully
      worse than the headline figures imply and the $1.15B entry price requires a higher growth rate to
      justify. Fourth, the cap table—including preference overhang from nine rounds of equity financing
      and the $40M credit line—must be reviewed to assess effective common equity value.


      Beyond the quantitative gaps, two qualitative conditions matter. Self-clearing must demonstrably
      improve gross margins versus the pre-DTCC baseline; if margin data shows that PFOF and lending
      income improvements are being consumed by WealthKernel integration costs and partner revenue-
      sharing, the self-clearing thesis is intact in theory but not yet captured in economics.
      Additionally, the tokenization regulatory environment needs monitoring—on-chain settlement of
      US equities through the Instant Tokenization Network has no settled legal framework in the US,
      and adverse SEC guidance could constrain the tokenization revenue upside.


      An investor who can obtain the required disclosures and confirm the upgrade criteria—ARR above
      $120M, gross margin above 35%, NRR above 110%, Binance concentration below 25%, no adverse cap-
      table structure—should find the $1.15B entry compelling given the market opportunity and
      competitive positioning. Without those confirmations, the risk-adjusted return at the current
      mark is below the threshold for a conviction buy in the context of a still-compressed private
      fintech market.
