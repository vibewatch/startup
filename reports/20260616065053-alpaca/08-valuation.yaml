callouts:
  - calloutType: "recommendation"
    title: "Recommendation: Research-More at Current $1.15B Entry"
    body: >-
      The evidence supports a research-more recommendation with medium confidence, high risk, and a
      stretched valuation stance. Alpaca's $1.15B Series D is not obviously mispriced, but it cannot
      be confirmed as fairly priced without audited financials, NRR, and Binance concentration data.
      The upgrade criteria are: confirmed ARR >$120M, gross margin >35%, NRR >110%, Binance revenue
      share <25%, and no adverse preference overhang. A buy call without these confirmations would
      be opinion-driven rather than evidence-supported.
    claimRefs:
      - CV001
      - CV003
      - CV035
      - CV045

  - calloutType: "risk"
    title: "Highest-Conviction Risk: Binance Concentration and Revenue-Sharing Terms"
    body: >-
      The Binance partnership is the highest-conviction risk in this analysis. Binance earns 50% of
      PFOF and 65% of securities lending profit on accounts it sources, and holds a minority equity
      stake. If Binance represents 20–30% of Alpaca's partner-sourced ARR, blended effective economics
      for that cohort are materially worse than the company's headline ARR implies. Any regulatory
      action against Binance, partnership renegotiation, or Binance internalizing its infrastructure
      would constitute a direct thesis-break trigger.
    claimRefs:
      - CV032
      - CV033
      - CV042

  - calloutType: "assumption"
    title: "Key Assumption: Sacra $100M ARR Estimate Is Within 15% of Actual"
    body: >-
      The entire comparable multiple framework—and most scenario valuations—rest on Sacra's September
      2025 estimate of $100M ARR. Sacra is a credible analyst with a track record of estimating
      private fintech revenues, and the company's own language ("more than doubled") is consistent
      with the $60M end-2024 to $100M September 2025 trajectory. However, if actual ARR is
      significantly below $80M, the implied multiple rises above 14x and the stretched stance
      becomes outright expensive. Confirming ARR in a data room is the single most important
      diligence action before commitment.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV025

