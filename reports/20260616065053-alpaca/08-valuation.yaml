  - id: "public-comparable-framework"
    title: "Public Comparable Framework and Implied Multiple"
    body: >-
      Benchmarking Alpaca against public brokerage and exchange infrastructure companies reveals a wide
      dispersion in price-to-revenue multiples that reflects differences in business model, growth rate,
      and market. Robinhood (HOOD) trades at approximately 19.8x trailing revenue on a June 2026 market
      capitalization of $88.35B and FY2025 revenue of $4.47B—a premium driven by retail trading momentum,
      Robinhood Gold subscription growth, and a 51.6% year-over-year revenue increase in 2025. Interactive
      Brokers (IBKR) trades at approximately 25.4x on $157.34B market cap and $6.21B FY2025 revenue, a
      multiple supported by its self-clearing vertical integration, institutional client base, near-80%
      operating margins, and compounding client asset growth. Both of these are outliers justified by
      demonstrated profitability and cash generation at scale.


      Coinbase (COIN) trades at approximately 6.8x on a June 2026 market cap of $44.68B against $6.56B
      FY2024 revenue—a discount reflecting high revenue cyclicality tied to crypto market conditions and
      regulatory uncertainty. Futu Holdings (FUTU) trades at approximately 5.2x on $14.03B market cap
      against approximately $2.71B USD revenue in FY2025 (HK$21.1B), reflecting China market regulatory
      risk and a narrower product set. Charles Schwab reported $19.6B total revenue for FY2024 and
      $23.9B in FY2025—a large, diversified institution that screens at low single-digit P/S reflecting
      its bank-like economics and minimal growth premium.


      Among private peers, DriveWealth's most recent disclosed valuation is $2.85B from its August 2021
      Series D; the company reported approximately $75M ARR as of November 2024, implying a stale mark
      of roughly 38x. Its CEO projected $100M revenue and cash-flow positivity for 2024 and is targeting
      an IPO within approximately 24 months from July 2024. Apex Fintech Solutions generated approximately
      $157.5M ARR in 2024 at a $472.5M valuation—a roughly 3.0x multiple reflecting its cancelled SPAC
      history and PE-ownership reset. Alpaca's ~10–11.5x implied multiple sits between the compressed
      Apex figure and the stale DriveWealth peak, and below the premium public names—a defensible
      position for a high-growth private infrastructure API at this stage.


      The fintech valuation environment as of mid-2026 provides important context. The Forge Global
      private fintech basket shows that sector valuations are approximately 39% below 2021 last-round
      marks as of May 2025, and the PitchGrade M&A landscape analysis shows infrastructure platform
      transactions clearing at 3–7x revenue in 2026. Alpaca's ~10–11.5x multiple is above the M&A
      clearing range, meaning that a strategic acquirer at today's prices would need to underwrite
      significant organic value creation rather than re-rating at comparable private transaction
      multiples. This creates meaningful exit path dependency on either continued organic growth
      or an IPO at a premium to M&A comps.
