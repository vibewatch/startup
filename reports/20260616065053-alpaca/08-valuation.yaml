  - id: "scenario-analysis"
    title: "Bull, Base, and Bear Scenario Analysis"
    body: >-
      Scenario analysis for Alpaca requires range-based underwriting rather than point estimates,
      because absolute revenue, gross margin, burn rate, and NRR are all undisclosed. Three scenarios
      bracket the realistic outcome set based on publicly available evidence and first-principles
      assumptions about fintech infrastructure economics.


      In the bull case, Alpaca sustains revenue growth at 50%+ annually through 2027, reaching
      $200M+ ARR. The self-clearing dividend continues to compound gross margins toward 40%+, the
      WealthKernel European integration adds a new revenue geography, and tokenization becomes a
      meaningful incremental stream. Binance partner concentration is diluted as new partners (banks,
      exchanges, enterprise fintechs) scale up their account activity. At a 12–18x exit multiple—
      consistent with a strategic acquisition by IBKR, a major exchange group, or a large bank seeking
      brokerage infrastructure—the implied enterprise value would be $2.4B–$3.6B. Given the $1.15B
      entry mark, this represents a 2.1–3.1x return before dilution, subject to cap-table terms that
      are not publicly disclosed.


      In the base case, revenue growth moderates to 25–35% as the partner base scales and the incremental
      account contributions from smaller partners grow more slowly than early-stage cohorts. Alpaca
      reaches $150M ARR by 2027 with gross margins improving but remaining below 35% due to the Binance
      revenue-sharing haircut on PFOF and lending. Self-clearing margins are partially offset by
      WealthKernel integration costs. The exit multiple compresses to 8–12x as the company approaches
      profitability rather than achieving it within the hold period. Implied enterprise value is
      $1.2B–$1.8B—representing flat to modest uplift from the current $1.15B mark before dilution.
      This scenario implies a below-threshold return for most institutional growth investors.


      In the bear case, revenue growth decelerates to below 20% due to Binance disruption (regulatory
      action against Binance, renegotiation of the economics, or Binance building its own infrastructure),
      PFOF regulatory changes in the US or key international markets, or partner attrition. ARR
      stagnates between $100M–$120M in 2027. With a below-average growth profile and continuing
      regulatory uncertainty, the exit multiple compresses to 5–7x, consistent with the M&A clearing
      range for mature infrastructure assets. Implied value is $500M–$840M—materially below the current
      $1.15B entry price and constituting a down-round scenario for the Series D cohort.
