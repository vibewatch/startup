      - number: '5.4'
        title: 信任控制、合规会员资格与第三方依赖
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的信任架构叠加了监管会员资格、客户保护计划和面向伙伴的控制。Alpaca Securities LLC（FINRA/SIPC 会员）是股票、ETF、期权和固定收益的受监管
              broker-dealer；Alpaca Crypto LLC（FinCEN 注册 MSB，NMLS #2160858）处理数字资产服务，不是 SIPC 或 FINRA 会员——加密资产不受 FDIC 或
              SIPC 保险保护。截至 2026 年 2 月，Alpaca Clearing 将超额 SIPC 覆盖升级到每客户 $75 million 证券和 $75 million 现金，所有账户合计总上限 $250
              million，由 Lloyd's of London 承保（此前结构为 $30M 证券 / $1M 现金 / $150M 合计）。

              High-Yield Cash 背后的 FDIC Bank Sweep 计划，为每客户每计划银行提供 $250,000 穿透式 FDIC 覆盖；通过多家计划银行，Alpaca 宣传每账户最高
              $2.5M。扫存资金不受 SIPC 保险保护。FPSL 贷款也不受 SIPC 覆盖；作为替代，100% 现金抵押品由第三方银行持有，并在 Alpaca
              破产时释放给客户。对打造面向客户产品的伙伴来说，SIPC、FDIC 和现金抵押三种保护模式的差别很重要，必须在披露中讲清楚。

              Alpaca 状态页（status.alpaca.markets）公开监控 Live Trading API（Account、Orders、Positions、Assets、Trade
              Updates、Fractional Orders）、Paper Trading API、Dashboard 和 Account 服务，以及 13 个独立 Broker API 沙盒端点。2026 年 6
              月，公司发生多起运营事件：6 月 14 日上游提供商维护导致资金服务中断（2 小时内解决）；6 月 11 日执行场所连接问题导致间歇性订单拒绝（约 12 分钟解决）；6 月 1 日日记账处理延迟约 99
              分钟。第三方监测显示，2026 年 6 月 30 天窗口内总可用性低于 99.9%，但 Alpaca 自有状态页显示，多数组件 60 天正常运行时间接近 100%。公开文档中未发现正式发布的 SLA
              承诺（正常运行时间保证、补偿积分或 MTTR 目标）。
