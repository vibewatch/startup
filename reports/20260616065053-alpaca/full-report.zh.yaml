  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Alpaca 通过六个变现节点把伙伴交易活动转化为收入；留存毛利取决于伙伴收入分成条款——最明显是 Binance 50/65 分成——以及自清算效率。
    data:
      nodes:
        - id: pfof
          label: 订单流付款
          detail: 做市商为路由向 Alpaca 付费；这是主要收入向量。Binance 来源订单中，Binance 获得 50% PFOF。
          tone: warning
        - id: api-fees
          label: API / 平台费
          detail: Broker API 访问和清算基础设施的 B2B 企业费用；定价未公开列示。
          tone: positive
        - id: margin-interest
          label: 保证金利息
          detail: 按公开 6.25% 利率收取保证金贷款利息；随账户和余额增长放大。
          tone: positive
        - id: fpsl
          label: 证券借贷（FPSL）
          detail: 全额付清证券借贷收入；在 Binance 账户中，用户利息之后的剩余利润由 Binance 拿走 65%。
          tone: warning
        - id: cash-sweep
          label: 高收益现金扫存
          detail: 未投资现金余额上的 FDIC sweep 利差；利率未公开披露。
          tone: positive
        - id: crypto-fees
          label: 加密 Maker-Taker 费用
          detail: 加密交易按成交量分层收取 0.15–0.25% 费用；有竞争力且形成增量。
          tone: neutral
        - id: gross-revenue
          label: 总收入池
          detail: 六条收入流全部进入伙伴分成和成本前的总收入基数。
          tone: positive
        - id: partner-sharing
          label: 伙伴收入分成
          detail: Binance 以及潜在其他伙伴在 Alpaca 留存前获得合同收入分成。
          tone: warning
        - id: retained-profit
          label: 留存毛利
          detail: Alpaca 在伙伴分成和清算成本之后留存的净收入；未公开披露。
          tone: neutral
      edges:
        - from: pfof
          to: gross-revenue
        - from: api-fees
          to: gross-revenue
        - from: margin-interest
          to: gross-revenue
        - from: fpsl
          to: gross-revenue
        - from: cash-sweep
          to: gross-revenue
        - from: crypto-fees
          to: gross-revenue
        - from: gross-revenue
          to: partner-sharing
        - from: partner-sharing
          to: retained-profit
    approximationNotes: 该桥是定性图。按收入流划分的收入结构未公开披露。除 Binance 安排外，其他伙伴收入分成条款未知。留存毛利仅作方向性估算。
