      - number: '1.4'
        title: 规模、产品与监管足迹
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Alpaca 的规模指标来自公司发布的两组略有差异的数据，反映不同报告日期。About-us 页面称，公司在 40+ 国家拥有数百家机构和 fintech 合作伙伴，合作伙伴已开设超过
              700 万个账户，开发者社区有 61,000 名月活跃开发者（MAD）。 2026 年 1 月 Series D 公告则称，Alpaca 已与 40 多个国家 300+ 机构合作，支撑超过 900
              万个券商账户——该数字较 about-us 更新。这两组数据可以解释为不同测量日期，Series D 数字更新、也更权威。Alpaca 的产品组合在 2025 年大幅扩张：
              公司推出多腿期权、全额付清证券借贷（FPSL）、固定收益（美国国债）和 24/5 美股交易。公司通过计息 sweep 项目推出 High-Yield Cash 产品，并在 2025 年末 TOKEN2049
              Singapore 发布 Instant Tokenization Network，首发伙伴包括 xStocks、Dinari、Ondo Finance 和 Solana Foundation。Alpaca 在
              2025 年 tokenization 报告中称，公司在代币化美股和 ETF 市场拥有 94% 市占率——这是公司口径，未获独立验证。公司还称 Series D 之前一段时期的收入同比增长超过一倍。Alpaca
              的监管足迹横跨多个司法辖区：在美国，Alpaca Securities LLC（也以 Alpaca Clearing 运营）持有 FINRA 会员资格，并通过 DTCC（股票）、OCC（期权）和
              FICC（美国国债）自清算；Alpaca Crypto LLC（NMLS# 2160858）处理数字资产业务； AlpacaJapan Co.（JSDA# 3024）在日本运营；AlpacaX 实体在
              Bahamas 运营；2026 年 4 月收购 WealthKernel 后， Alpaca Europe 在英国和欧盟受监管。Alpaca 也在 2025 年成为 Nasdaq Exchange
              Member。BrokerCheck 确认，公司开展 11 类业务，并有两起监管披露事件。
