      - number: '2.2'
        title: 市场规模：从多重视角看 TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              多种独立研究方法都指向嵌入式投资基础设施拥有大且快速增长的机会，但估算会随范围定义和方法论显著分化。最宽口径是全球 embedded finance 市场， 覆盖支付、借贷、保险、银行和投资等子板块；Mordor
              Intelligence 估计 2026 年市场为 $155.96B，到 2031 年增至 $454.48B， CAGR 为 23.84%；The Business Research Company 估计
              2026 年为 $115.03B，到 2030 年增至 $250.95B，CAGR 为 21.8%。 两家来源都认为嵌入式投资子类是 embedded finance 中增长最快的部分：Mordor
              预测投资板块到 2031 年 CAGR 为 27.66%，快于支付 （支付已在 2025 年以 43.68% 市占率领先，但增速更慢）。Bain & Company 估计，仅美国 embedded finance
              平台和基础设施收入到 2026 年就达到 $51B，较 2021 年 $21B 翻倍。


              更窄、也更能直接对照的视角，是全球零股交易基础设施市场。该市场 2025 年价值 $4.8B，预计到 2034 年增至 $12.7B，CAGR 为 11.2%（Dataintelo，基于截至 2025
              年第四季度的一手和二手研究）。North America 以 38.2% 收入份额（$1.83B）领跑该市场， DriveWealth 和 Apex Fintech Solutions
              被列为当前领导者。同一报告称，Alpaca 自创立以来已处理超过 500 亿次 API 驱动交易请求。 这个 $4.8B 数字最能直接对照 Alpaca 核心基础设施费市场，但它很可能低估了 2025 年后由
              tokenization 推动的加速。


              代币化股票和证券市场叠加了一层相邻的高增长机会。Mordor Intelligence 估计，代币化证券市场 2025 年为 $24.69B，2026 年增至 $35.82B，到 2031 年达
              $184.27B，CAGR 为 38.76%；其中股票类证券预计到 2031 年 CAGR 为 46.21%。2026 年 5 月， 代币化股票链上流通市值为 $1.43B（按 RWA.xyz 数据），而更宽的
              “represented value” 数字为 $5.5B（The Block/Binance Research， 2026 年 6 月），显示与实时流通市值之间存在 5× 方法论差距。Citigroup
              预计，到 2030 年代币化证券可能达到 $4–5 trillion， 说明当前数字仍属早期。BCG 和 Adyen 估计，SaaS 平台可触达的 embedded finance 收入机会为 $185B，其中
              2026 年捕获不足 20%—— 约 $150B 仍在争夺中。
