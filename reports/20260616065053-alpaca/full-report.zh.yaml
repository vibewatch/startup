chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与使命
        blocks:
          - type: paragraph
            body: >-
              Alpaca 是一家总部在美国、自清算的 broker-dealer，也是全球认可的券商基础设施 API 领导者。公司由日本创业者 Yoshi Yokokawa 和 Hitoshi Harada 于 2015
              年创立，最初在加州 San Mateo 运营，是一家数据库和机器学习公司， 用深度神经网络为机构客户处理大规模金融市场数据。早期工程积累直接催生了 MarketStore——一款面向金融数据优化、
              专门构建的开源时间序列数据库；MarketStore 至今仍被视为 Alpaca 基础设施理念的工程根基。2018 年前后， Alpaca 转向 API
              优先的券商基础设施，并为算法交易者推出免佣交易平台；随后，公司扩展 Broker API，让全球 fintech 和金融机构能在 Alpaca 的监管与清算栈之上搭建完全定制的投资产品。Alpaca
              公开使命是向地球上每个人开放金融服务， 商业目标则是成为全球事实上的券商基础设施标准。公司入选 Y Combinator 2019 冬季批次，为早期开发者社区背书。 Alpaca 提供两条核心 API
              产品：Broker API 是全栈 brokerage-as-a-service，帮助 fintech 和机构搭建投资应用； Trading API
              面向算法交易者、零售投资者、对冲基金和自营交易公司，自动化股票、期权和加密策略。截至 2026 年 6 月， 法定 broker-dealer 实体 Alpaca Securities LLC（CRD#
              288202，SEC# 8-69928）注册于 Delaware， 成立于 2017 年 3 月 15 日，主要注册办公室位于 12 East 49th Street, Floor 11, New York,
              NY 10017， 受 FINRA New York Office 监管。
