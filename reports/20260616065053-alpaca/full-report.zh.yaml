              Alpaca 同时持有 DTCC、OCC 和 FICC 会员资格——截至 2025 年 8
              月完成——让它对股票、期权和国债的交易生命周期拥有完整内部控制。同等规模的券商基础设施提供商，很少同时持有三项会员资格。这消除了第三方清算券商费用，并实现实时交易后可见性；相对依赖代理清算的同业，这是直接竞争优势，也会在伙伴交易量放大时提供结构性成本杠杆。
