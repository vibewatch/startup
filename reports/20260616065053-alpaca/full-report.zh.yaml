      - number: '5.2'
        title: 技术架构：自清算、订单路由与集成模型
        blocks:
          - type: paragraph
            body: >-
              Alpaca 最可防守的技术资产，是完整自清算架构。公司在 2023–2024 年取得美国股票 DTCC 会员资格，又在 2025 年 8 月取得 OCC 和 FICC
              会员资格；现在它无需依赖任何第三方清算券商，就能管理股票、ETF、期权和国债从执行到清算再到结算的完整交易生命周期。这消除了历史上很重的一层成本，也让 Alpaca
              及其伙伴获得实时交易后可见性、更快处理速度和更高流程灵活性。Alpaca 还在 2025 年成为 Nasdaq Exchange Member，为订单路由增加直接交易所连接。

              24/5 隔夜交易中，Alpaca 通过 Blue Ocean Alternative Trading System（BOATS）路由订单；BOATS 是独立于传统美国证券交易所的 ATS。隔夜时段从周日
              8:00 PM 到周五 8:00 AM ET（overnight period），覆盖所有 NMS 证券，但不覆盖 OTC 股票。隔夜时段只接受限价单，Day Trading Buying Power
              不适用；最高保证金为 2x。这是实质流动性限制，伙伴必须向终端客户说明。

              碎股交易在实盘和模拟环境中都覆盖 2,000+ 只美国股票。订单可在 POST /v2/orders 端点接受 qty（碎股数量）或 notional（美元金额，最低
              $1）参数；碎股订单以本金或无风险本金方式执行，并且只能在正常交易时段用市价单卖出（碎股订单不支持卖空）。碎股交易延伸到盘前、盘后和隔夜时段。

              固定收益上，Alpaca 聚合一组流动性提供方的报价，并把订单路由到最有竞争力的买 / 卖价。美国债券市场时段（9:30 AM–4:00 PM ET）外下单，会排队到下一时段。Broker API
              onboarding 模型支持两种 KYC 流程：Alpaca 管理（面向不受监管实体，使用 Trulioo 和 Onfido）和伙伴管理（面向拥有自有 AML 项目的投资顾问和券商）。伙伴银行账户绑定通过
              Plaid 集成处理。账户状态更新和交易事件通过 Events API 以流式方式传递。
