      - number: '5.3'
        title: 开发者体验、SDK 生态与 AI 原生工具
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的开发者优先定位，有多语言 SDK 生态、完整文档和越来越 AI 原生的工具作支撑。官方 Python SDK（alpaca-py）支持 Python 3.8+，用 Pydantic 做数据校验和
              OOP 请求模型，覆盖 Trading API、Broker API 和 Market Data API。它作为主要可安装包发布在 PyPI，并由 GitHub 上的 alpacahq 活跃维护。C#/.NET
              SDK（NuGet 上的 Alpaca.Markets 7.2.0）支持 .NET 6+、.NET Standard 2.0 和 .NET Framework 4.6.2；Go
              SDK（alpaca-trade-api-go）和 JavaScript/Node SDK 也由官方维护。Alpaca 文档站列出 Broker API、Trading API 和 Market Data API
              的 OpenAPI 规格，支持生成自定义客户端。社区贡献者还为 C++、Java、TypeScript、R、Rust、Scala、Ruby 和 Elixir 创建了额外封装。

              Market Data API 有两档计划：Basic（免费）计划提供实时 IEX 数据、每分钟 200 次 API 调用，以及限 30 个 symbol 的 WebSocket 流；Algo Trader
              Plus 计划（$99/month）提供所有美国交易所的完整 SIP consolidated tape、每分钟 10,000 次 API 调用，以及不限 symbol 的 WebSocket
              流。隔夜时段市场数据（BOATS feed）也包含在 Algo Trader Plus 计划中。模拟交易沙盒用实时 IEX 数据端到端镜像实盘交易；它免费、全球可用，并提供同样的 API
              表面（paper-api.alpaca.markets）。已记录限制包括缺少市场冲击模拟、延迟导致的价格滑点、订单队列位置和监管费用。

              2026 年 Q1，在 AI 驱动和 agent-based 市场参与者推动下，Alpaca 的 API 使用量增长环比加速近 4×——从 2025 年 Q4 的个位数月增长，升至 2026 年 Q1 约 30%
              月增长。为抓住这次转变，Alpaca 在 2026 年 4 月发布新 CLI 和 MCP Server v2。MCP Server v2 使用 FastMCP 和 OpenAPI 规格完全重写，覆盖范围从 v1
              的 43 个端点扩展到 v2 的 61 个端点。它支持通过 Claude、Cursor 和 VS Code 等 AI 助手进行自然语言交易，并在 GitHub 开源。ALPACA_TOOLSETS
              环境变量过滤让管理员把 agent 访问限制在特定能力子集，降低大语言模型错误带来的风险。
