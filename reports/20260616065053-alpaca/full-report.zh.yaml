      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议：以当前 $1.15B 入场价继续研究
            body: >-
              证据支持继续研究建议：置信度中等，风险高，估值偏紧。Alpaca 的 $1.15B Series D 并非明显定价错误，但没有经审计财务、NRR 和 Binance 集中度数据，就无法确认其公允。升级标准是：确认
              ARR >$120M、毛利率 >35%、NRR >110%、Binance 收入占比 <25%，且没有不利的优先权压力。没有这些确认就给出买入判断，只是观点驱动，而非证据支撑。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV035
              - CV045
          - type: callout
            title: 最高确信风险：Binance 集中度与收入分成条款
            body: >-
              Binance 合作关系是本分析中确信度最高的风险。Binance 对其导入账户收取 50% PFOF 和 65% 证券出借利润，并持有少数股权。若 Binance 占 Alpaca 伙伴来源 ARR 的
              20–30%，该客群的混合实际经济性会明显差于公司表面 ARR 暗示。任何针对 Binance 的监管行动、伙伴关系重新谈判，或 Binance 将基础设施内化，都会直接触发论点破裂。
            calloutType: risk
            claimRefs:
              - CV032
              - CV033
              - CV042
          - type: callout
            title: 关键假设：Sacra $100M ARR 估计与实际值偏差在 15% 以内
            body: >-
              整个可比倍数框架，以及多数情景估值，都建立在 Sacra 2025 年 9 月 $100M ARR 估计之上。Sacra 是可信分析机构，有估算私营金融科技收入的记录；公司自己的「more than
              doubled」表述，也与 2024 年末 $60M 到 2025 年 9 月 $100M 的轨迹一致。不过，若实际 ARR 明显低于 $80M，隐含倍数会升至 14x
              以上，偏紧估值就会变成明确昂贵。投资前，在数据室确认 ARR 是最重要的单项尽调动作。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV025
