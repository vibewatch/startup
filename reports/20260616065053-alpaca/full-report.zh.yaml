      - number: '7.4'
        title: 治理、声誉与执行风险
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的实体和品牌命名制造了混淆，而这种混淆本身就是治理风险指标。向 FINRA 注册、CRD #288202 的运营 broker-dealer 是 Alpaca Securities
              LLC。同一实体在部分公司沟通中被称为「Alpaca Clearing LLC」，反映其转向自清算状态；但截至本报告运行日，公开可得的 FINRA BrokerCheck 记录中没有出现「Alpaca
              Clearing LLC」的独立 CRD 注册。母公司 AlpacaDB, Inc.（另行注册，CRD #317262）没有披露纪律事件，但运营子公司 Alpaca Securities LLC（CRD
              #288202）有两项执法披露。合作伙伴若对名为「Alpaca Markets」或「Alpaca Clearing」的实体做尽调，却没有追踪到正确 CRD，可能会误依赖一份干净的 BrokerCheck
              记录，而实际运营 broker-dealer 实体已有重大监管历史。


              治理透明度有限。Alpaca 不公布董事会构成、委员会结构、审计委员会章程或治理准则。作为由 Portage Ventures、Spark Capital、Tribe Capital 和 SBI Group
              支持的私营公司，董事会构成大概率由投资方驱动，而非独立。2024 年 9 月 SEC 命令认定，高级管理层本人违反了合规政策，且这种行为在全公司范围内被容忍；这说明在 2022–2024
              年关键增长期，最高层治理基调存在缺陷。


              Alpaca 风险披露的口径已经变化。早期文件将 Alpaca 描述为 introducing broker，而 2026 年 2 月 SEC comment letter
              明确称公司是「self-clearing and carrying firm」。这代表运营和监管风险画像发生重大变化，依赖旧文件的投资者或合作伙伴可能对交易对手风险持有过时认知。


              FINRA 2026 Annual Regulatory Oversight Report（2025 年 12 月 9 日发布）明确将 best execution、Regulation BI
              合规、加密资产沟通控制、AML 项目充分性、第三方供应商风险管理和 GenAI 治理列为检查重点。每一项都对应 Alpaca 历史合规记录中已经暴露弱点的风险领域。即将生效的 SEC Rule 605
              增强要求（执行质量披露，2026 年 8 月 1 日前要求）将要求 Alpaca 发布更细粒度的订单执行统计数据，可能揭示监管驱动的非官方渠道通信压制是否也影响了执行质量监控。


              关键人物风险重大。创始团队——CEO Yoshi Yokokawa 和 CTO Lu Zhao——同时掌握监管关系和合作伙伴信任；任何一人离开，都可能触发合作伙伴合同重谈，并可能触发 FINRA
              principal approval 要求。
