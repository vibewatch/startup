      - number: '6.2'
        title: 具名伙伴证据：已验证部署与证据质量
        blocks:
          - type: paragraph
            body: >-
              作为一家私有券商基础设施公司，Alpaca 公开披露的具名、已上线生产环境的合作伙伴记录异常丰富。2026 年 1 月 Series D 公告明确点名 Kraken、SBI Securities 和 Dime!
              为代表性合作伙伴，给出了生产状态的一手确认。同一公告中，Sarwa CEO Mark Chahwan 的背书——「我们的合作让全球市场与 MENA 投资者连接起来。我们成为 Alpaca
              首个在全球提供期权交易的合作伙伴」——则为双方多年且持续扩展的关系提供了强有力的第三方佐证。


              Kraken 是 Alpaca 战略维度最复杂的合作关系。Kraken 借助 Alpaca 的 Broker API（仅限美国）为其 1500 多万全球客户推出美国股票，提供 11,000 多只股票和 ETF
              的免佣金、碎股交易。2025 年 12 月，Kraken 指定 Alpaca 为其 xStocks 1:1 支撑股票的首选采购和托管场所，合作进一步扩展；xStocks 是代币化股票，自 2025 年 6
              月上线以来累计交易额已超过 $10 billion。另一路，Alpaca 集成 Kraken Embed（Crypto-as-a-Service），向其 200 多个合作伙伴网络提供加密资产访问。Kraken
              同时也是 Series D 投资方，形成投资方—合作伙伴的双重绑定；这种绑定在商业上加深关系，也带来治理和利益冲突尽调问题。


              SBI Securities 是日本最大的线上券商，客户托管资产超过 $338 billion，并按账户、账户数量和个人股票交易额位列日本第一。SBI Securities 确认 Alpaca
              是其美国股票执行服务提供商。新 NISA 税优储蓄计划带动日本散户对美国股票的需求激增；日本投资者持有的美国股票从 2019 年的 $596 billion 增至 2024 年的 $975
              billion，合作正好承接这一趋势。这是一项机构级规模的生产执行关系，不是试点。


              Binance 是全球交易量最大的加密交易所，全球用户超过 3 亿。2026 年 6 月 1 日，也就是本报告运行日前 15 天，Binance 上线由 Alpaca 支撑的 24/5 美国股票和 ETF
              交易。用户最低 $5 即可访问 7,000 多只美国上市股票，资金来源可用稳定币（USDC、USDT、BNB）。Binance 选择 Alpaca，看中的是 API
              灵活性、产品多样性和受监管的自清算资质。Binance 还宣布计划与 Alpaca 的 ITN 基础设施合作推出 bStocks（代币化美国证券）。商业条款包含一项已公开披露的收入分成安排：Binance 获得
              Alpaca 产生交易流中的少数股权权益。


              Sarwa 是阿联酋领先的投资平台之一，自 2021 年起与 Alpaca 合作，是最早、持续时间最长的部署之一。在此期间，Sarwa 总交易额超过 $3 billion，并成为首家提供美国期权交易（Level
              1 和 2）的中东金融科技公司。2021 年的起始时间，以及截至 2026 年仍持续活跃的合作（由 Series D 背书确认），构成公开可得的最强合作伙伴留存代理指标。


              Dime! 是泰国市场领先的美国投资 App，在 Series D 公告中被确认为具名合作伙伴。Dime! 披露同比增长 500%；Alpaca 支持其以 50 泰铢（$1.50）起投碎股、简化 W-8BEN
              税表申报，并规划期权交易。GoTyme Bank（菲律宾）于 2025 年 12 月 8 日上线，是持有 BSP 牌照、由 Gokongwei Group 与 Tyme Group 共同拥有的新银行。GoTyme
              Bank 使用 Alpaca 的 Broker API 推出 GoCrypto，向菲律宾快速增长的数字资产市场提供 11 种加密货币；当地 76% 的菲律宾人银行服务不足。


              ZAD（科威特）和 Manzil（加拿大 / 美国）是 Alpaca 符合伊斯兰教法合作伙伴中的旗舰案例，二者均为 2025 年 7 月公开宣布且仍活跃的合作关系。ZAD（The Securities House
              旗下平台）向 GCC 市场提供符合伊斯兰教法的美国股票和 ETF，并正与 Alpaca 共建符合伊斯兰教法的保证金交易、期权和高收益现金。Manzil 于 2025 年 7 月上线 Manzil Invest
              USA，这是一个由 Alpaca 支撑、面向美国约 345 万穆斯林的 SEC 注册顾问平台，提供经 AAOIFI 筛选的清真投资组合。
