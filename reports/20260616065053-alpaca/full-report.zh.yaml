  - id: FI004
    title: 资本强度与成本结构矩阵
    type: matrix
    layout: wide
    summary: 运营一家自清算的多资产券商会带来七类不同成本；Alpaca 的技术投入旨在压低单位成本，但监管资本和合规在规模化后仍是固定负担。
    data:
      columns:
        - 自清算影响
        - 规模敏感性
        - 承保置信度
      rows:
        - label: 合规与法律
          values:
            - label: 持续
              tone: warning
              detail: FINRA、SEC、OCC、FICC 合规；多起监管事件整改（SEC 2024 年命令）。
            - label: 固定加可变
              tone: neutral
              detail: 基础合规成本相对固定；随新牌照和司法辖区增加而上升。
            - label: 高
              tone: positive
              detail: 公开披露的监管足迹让这一成本类别更可见。
        - label: 清算技术运营
          values:
            - label: 内部化
              tone: positive
              detail: 自研 UTS 平台（Flatbuffers、Redpanda）消除供应商依赖，但增加运营成本。
            - label: 可变
              tone: neutral
              detail: 随交易量扩张；架构为效率而设计。
            - label: 低
              tone: warning
              detail: 内部技术支出未公开披露；估计属于核心资本开支类别。
        - label: 市场数据订阅
          values:
            - label: 必要
              tone: warning
              detail: 实时数据的交易所费用；清算会员的标准成本。
            - label: 固定加用量
              tone: neutral
              detail: 基础费用之外，交易所按查询或用户增量收费。
            - label: 低
              tone: warning
              detail: 数据支出没有公开披露。
        - label: 监管资本准备金
          values:
            - label: 必需
              tone: warning
              detail: SEC Rule 15c3-1（净资本）和 15c3-3（客户准备金）要求持续锁定资本。
            - label: 与规模相关
              tone: warning
              detail: 客户准备金随账户余额按比例增长；压制资本效率。
            - label: 中
              tone: neutral
              detail: 最低净资本要求为 $250K，但推断实际资本锁定明显更高。
        - label: 银行与支付连接
          values:
            - label: 扩张中
              tone: neutral
              detail: 覆盖 40+ 个国家的 ACH、电汇、FX、sweep 银行关系和跨境支付轨道。
            - label: 固定加地域
              tone: neutral
              detail: 每进入一个新司法辖区都会增加连接成本。
            - label: 低
              tone: warning
              detail: 具体成本未披露。
        - label: 牌照与会员费
          values:
            - label: 强制
              tone: warning
              detail: DTCC、OCC、FICC、FINRA、Nasdaq 交易所会员费；随着新增会员资格继续增长。
            - label: 大多固定
              tone: neutral
              detail: 会员费大体固定；DTCC/OCC 有基于交易量的组成部分。
            - label: 中
              tone: neutral
              detail: 单项费率表公开；混合总额未披露。
        - label: 客户与合作伙伴支持
          values:
            - label: 随合作伙伴扩张
              tone: neutral
              detail: 支持 40+ 个国家的 300+ 家 B2B 合作伙伴；技术集成和运营支持带来额外开销。
            - label: 可变
              tone: neutral
              detail: 由人员驱动；大致随合作伙伴数量线性扩张。
            - label: 低
              tone: warning
              detail: 员工数未公开披露；支持成本从合作伙伴规模推断。
    approximationNotes: >-
      规模敏感性和置信度评级来自监管文件、IBKR 可比公司和 Alpaca 公开披露的定性评估。没有公开可得的 Alpaca 专属成本数据。IBKR 2024 年第四季度
      $115M/季度的清算成本，可作为成熟自清算运营商的上限可比值。
