      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              Alpaca 在 2025 年 8 月取得 OCC 和 FICC 清算会员资格，补齐完整的多资产自清算栈（股票用 DTCC、期权用 OCC、国债用 FICC）。这在战略上必要，但在运营上提高了集中度。作为自清算和
              carrying firm，Alpaca 现在拥有从执行到结算的交易生命周期每一环，去掉第三方清算成本的同时，也吸收了过去由清算 correspondent 承担的所有运营和资本风险。


              服务可靠性记录实质上令人担忧。第三方监控服务显示，2026 年 5 月正常运行率为 48.4%，意味着 Broker API 和交易系统在当月约一半自然日出现问题。2026 年 4 月正常运行率为
              86.7%，2026 年 6 月（截至月中）为 81.3%。具体事件包括多小时 Broker API 超时（2026 年 5 月 26–30 日）、2026 年 6 月 1 日 journal 处理延迟、2026
              年 6 月 11 日执行场所断连，以及 2026 年 6 月 14 日入金服务中断。截至 2026 年 6 月中旬的 90 天窗口内，Alpaca 记录 15 起事件，中位持续时间约 1 小时 56 分钟。对一家
              B2B 平台而言，合作伙伴将其嵌入服务数百万零售终端用户的生产金融应用，即便短暂宕机也会对合作伙伴客户体验、监管订单处理义务和 SLA 责任造成连锁影响。


              自清算模式增加了结算失败风险。在 T+1 结算环境下，任何阻碍及时结算的基础设施故障，都会在 DTCC、OCC 或 FICC 形成交易对手义务。清算会员资格哪怕只是临时暂停，也会让所有 Alpaca
              合作伙伴无法结算交易，可能在 300 多家合作伙伴生态中触发级联故障。Alpaca 承担大量客户抵押品（资产负债表上的碎股回购义务和保证金应收款），并运营客户现金 sweep
              项目；结算环节发生运营故障，可能需要紧急流动性。


              Alpaca 的加密业务实体（Alpaca Crypto LLC，NMLS #2160858）是 FinCEN 注册的 money services business，但不是 FINRA 成员，其资产也不受
              FDIC 或 SIPC 保险保护。这种隔离意味着，通过 GoTyme Bank 或 Binance 等加密集成合作伙伴交易的终端用户（就加密侧资产而言），与通过 SIPC 注册实体 Alpaca
              Securities LLC 持有美国股票的用户相比，投资者保护画像存在实质差异。


              网络安全风险也在上升：FINRA 2026 Annual Regulatory Oversight Report 特别提示，新账户欺诈、账户接管、GenAI 驱动的身份伪造和勒索软件，都是针对
              broker-dealer 的威胁。触发 2024 年 SEC 执法行动的同类记录留存失败，也表明 Alpaca 的通信治理基础设施在历史上落后于增长速度。
