  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件：API、资产类别与自有计划
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的商业产品面围绕两条主要集成路径组织：Broker API 和 Trading API；Market Data API 与 Crypto API
              提供支撑，一组附加计划则帮助金融科技伙伴提高每账户收入。

              Broker API 是 B2B 主干：受监管和不受监管的金融科技公司无需单独取得 broker-dealer 牌照，就能推出完整券商产品，包括开户（由 Alpaca 管理或伙伴管理 KYC）、通过 Plaid
              入金、股票 / ETF / 期权 / 固定收益 / 加密资产交易，以及下游报告。Trading API 面向算法交易者、对冲基金和自营交易公司，服务其直接免佣接入市场的需求。两个 API 都暴露
              REST、WebSocket 和 SSE 端点。截至 2026 年 6 月，Alpaca 首页还列出 OmniSub（面向 omnibus 结构的 API-first 子账户账本）和符合 Shariah
              的投资作为新增产品线，显示产品宽度仍在扩展。

              固定收益上，Alpaca 的 Broker API 可接入 229+ 只可交易美国 T-bills，以及 500+ 只投资级和高收益美国公司债；FICC
              会员资格让公司可以内部清算。目前支持可赎回债；碎股债券、可回售债、Reg S 和 144a 债券在路线图上。High-Yield Cash 计划让 Trading API 用户对未投资美元现金最高获得 3.30%
              APY；通过多家计划银行，每账户最多有 $2.5 million FDIC 穿透承保，资金仍可立即作为购买力使用。Fully Paid Securities
              Lending（FPSL）计划让伙伴平台向客户提供其全额持有证券的被动收入；等同至少 100% 出借证券价值的现金抵押品由第三方银行持有。

              Alpaca 最具战略可见度的产品，是 2025 年 10 月在 TOKEN2049 Singapore 发布的 Instant Tokenization Network（ITN）。ITN 让机构可以通过单次
              API 调用，7×24 对代币化美国股票进行实物铸造和赎回，初始结算链为 Solana。截至 2025 年 11 月，Alpaca 称其在代币化美国股票中拥有 94% 市场份额，代币化 AUC 超过
              $480M。但 ITN 官方免责声明在法律上很关键：代币化资产不代表直接股权所有权；持有人没有投票权、分红权，也没有对底层股票的法律请求权。Alpaca Securities LLC 和 Alpaca
              Crypto LLC 都不是发行方，也不直接参与代币化；代币化由 Backed Finance（xStocks）、Ondo Finance 和 Dinari 等第三方伙伴执行。
