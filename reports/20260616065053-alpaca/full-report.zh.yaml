      - number: '3.3'
        title: 既有玩家、相邻 rails、替代方案与内部自建
        blocks:
          - type: paragraph
            body: >-
              Saxo Bank 的 OpenAPI 代表了企业层级最接近 Alpaca 的机构 white-label 券商模型，但地理重点和资产范围不同。Saxo 通过 REST API 和 OAuth 2.0
              认证提供多资产覆盖，横跨 FX、股票、大宗商品、债券和衍生品；客户可通过专门开发者门户使用 sandbox、SDK 和模拟账户。 White-label 客户——broker-dealer、银行和
              fintech——可以在 Saxo 的监管基础设施和覆盖 170+ 国家的全球市场接入之上，搭建完全品牌化交易门户。 Saxo 正为 introducing brokers 和 OpenAPI 用户实施强化
              KYC/AML 开户要求，强制合规截止期分阶段落在 2025 年 12 月和 2027 年 1 月。 Saxo 相对 Alpaca 的主要差异化，是数十年机构记录和 FX 深度；其限制在于，它并不像 Alpaca
              那样向 fintech 提供 API-native 美股 clearing-as-a-service，开发者工具也更老、更复杂。

              随着加密与股票边界变模糊，Zero Hash 所处的相邻位置更重要。Zero Hash 在 2025 年完成由 Interactive Brokers 领投的 $104M Series D， Morgan
              Stanley、Apollo 管理基金、SoFi 和 Jump Crypto 大额参投，估值达到 $1B+，自 2017 年创立以来累计融资 $275M。其基础设施为 Stripe、BlackRock 的
              BUIDL fund、Franklin Templeton、DraftKings、Republic 和 80 多家 fintech 合作伙伴提供加密、stablecoin 和 tokenization
              服务。Zero Hash 在美国 50 个州和 200+ 国际司法辖区受监管。CEO 将其定位为 “the AWS of on-chain infrastructure”， 与 Alpaca 在股票 rails
              中的自我定位相呼应——两家平台开始在 tokenization 领域收敛。对 Alpaca 来说，双重风险在于 Zero Hash 可能扩张进入股票托管 rails， 同时通过向 Ondo、Dinari 或
              Backed 提供竞争性托管选项，威胁 Alpaca 的 tokenization franchise。

              内部自建 / 现状替代方案对大型机构仍是真实替代。取得 FINRA 会员资格、DTCC 清算会员资格、OCC 期权清算会员资格和 FICC 固定收益接入，需要大量最低资本 （DTCC
              会员资格要求满足通常以数百万美元计的净资本要求）、专门合规和运营团队、多年监管审批周期，以及持续 FINRA 监督。Alpaca 自己从 YC W19 走到完整 DTCC/OCC/FICC/Nasdaq
              会员身份，大约用了五年（2019–2025）。对资本充足的既有玩家（Robinhood、传统银行）而言，这条路可行但昂贵； 对轻量 fintech 和国际应用来说，监管复杂度让 Alpaca
              基础设施成为相对内部自建更有吸引力的选择。2024 年 4 月 Synapse BaaS 崩盘——$60-95M 对账失败让客户资金数月无法取用——提高了所有 BaaS 和
              brokerage-as-a-service 模型的监管审视，尤其围绕 omnibus account 完整性，以及通过中介持有客户资金的处理。 该事件抬高了该领域所有参与者的合规门槛。
