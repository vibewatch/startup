  - id: FV004
    title: 投资 KPI：可提交投委会的评分
    type: kpi
    layout: standard
    summary: 基于现有证据，从七个投委会相关维度按 0–10 分为 Alpaca 打分；分数越高，证据质量和投资论点支撑越强。
    data:
      items:
        - label: 市场机会
          value: 8
          description: 全球券商 API 基础设施对应数千亿美元级 TAM，嵌入式金融和代币化提供长期顺风
        - label: 需求验证
          value: 7
          description: 300+ 机构合作伙伴、9M+ 账户、40+ 国家、150% YoY 增长（Sacra）；合作伙伴名单质量高
        - label: 竞争护城河
          value: 6
          description: 自清算栈、全球牌照和开发者社区都是真资产；DriveWealth 与 Apex 仍是可信替代选项
        - label: 单位经济性
          value: 4
          description: 自清算在结构上利好，但毛利率未披露；Binance 折价影响显著；NRR 未知
        - label: 风险画像
          value: 4
          description: 高 —— Binance 集中度、PFOF 监管、SEC 处罚记录、私有公司不透明
        - label: 估值纪律
          value: 5
          description: 对高增长基础设施公司而言，约 10–11.5x ARR 说得通；高于 M&A 底部，低于上市溢价；公开证据仍不足以确认
        - label: 证据质量
          value: 4
          description: 没有审计财务、没有 NRR、没有股权结构；ARR 来自第三方估算；多项尽调关口仍未关闭
    approximationNotes: 评分是作者基于截至 2026-06-16 收集证据作出的判断，不应视为精确量化指标。证据质量分数已明确因私有公司不透明而下调。
