      - number: '4.4'
        title: 财务轨迹与公开可比锚点
        blocks:
          - type: paragraph
            body: >-
              Alpaca 公开可见的财务轨迹指向一家公司正沿着陡峭增长曲线前进，支点是伙伴交易量扩张和自清算效率提升，但图景仍不完整。公司在 2026 年 1 月 Series D
              公告中称，上一期间收入同比增长超过一倍。私募市场研究机构 Sacra 估计，Alpaca 2024 年年化收入达到 $60 million——同比增长 150%——由年化交易量增长至约 $180
              billion（同比 3x）驱动。Sacra 进一步估计，截至 2025 年 9 月，Alpaca 年化收入达到 $100
              million，延续快速增长轨迹。这些估计来自分析师基于公开牵引信号和渠道调研的判断，不是经审计财务，因此不确定性显著；但其方向与公司自己的增长说法一致，提供了一定佐证。


              最相关的结构性可比公司是 Apex Fintech Solutions。Apex 在 2020 年创造约 $230 million 收入，之后拟以 $4.7 billion 估值 SPAC 上市，隐含约 20x
              收入倍数。Sacra 把 Alpaca 定位为 Apex 的国际版：Apex 帮助美国本土平台嵌入美国股票，Alpaca 则让非美国金融科技公司做同样的事。直接现有竞争对手 DriveWealth 截至 2024
              年 7 月预计 2024 年收入为 $100 million——这意味着 Alpaca 2024 年 $60 million ARR 在绝对规模上落后
              DriveWealth，但增长速度更快。自清算基础设施和代币化股票主导地位（声称在代币化美国股票托管中市场份额 94%）可能支撑长期利润率高于 DriveWealth 或 Apex 过去运营的介绍券商模型。


              截至 2025 年 12 月，Alpaca 托管资产为 $480 million，占 $1.62 billion 代币化股票总市场的 29%。2026 年 6 月 Binance 上线——把 Alpaca
              基础设施接入全球最大加密交易所的用户基础——可能显著加速交易量和账户增长。但已披露的 PFOF 和借贷收入分成条款意味着，来自 Binance 合作的新增每账户经济性会明显低于 Alpaca
              更广泛伙伴基础的混合经济性。
