      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              五个主要增长驱动支撑券商基础设施 API 市场在 2026 年及之后扩张。第一，零售投资者数字化：美国零售投资者在股票市场交易中的份额从 2019 年 14% 增至 2022 年 22%；2024 年，全球
              fintech 在数字活跃消费者中的采用率约为 64%；B2B fintech 公司（API 驱动基础设施）在所有新 fintech 创业公司中的占比从 2022 年 45% 升至 2026 年
              62%。第二，全球股票接入需求：约 55–62% 的美国成年人持有股票，但新兴市场参与率只有 5–15%；中国（每年 $50K
              外汇额度）、印度（$250K）和巴西的资本管制放大了结构性缺口。代币化股票和嵌入式券商为这些投资者提供合规接入美国市场的路径， 形成庞大未满足需求。第三，2025 年 12 月 DTCC 授权在三年试点下
              tokenized Russell 1000 成分股、部分 ETF 和美国国债，并计划 2026 年上线交易， 提供了重要机构基础设施动能。第四，Alpaca 与 Kraken 扩展 xStocks
              合作，Alpaca 担任代币化股票铸造和赎回的首选托管方与 ITN 场所，说明加密原生平台对合规美股 rails 有需求， 而这一细分此前并不存在。第五，24/7 和 24/5 交易能力：Alpaca 于
              2025 年推出 24/5 股票交易，ITN 提供全天候结算，吸引跨时区运营、目前受美国市场交易时间限制的国际买方。
