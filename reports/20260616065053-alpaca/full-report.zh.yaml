      - number: '5.5'
        title: 产品与技术风险
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的产品和技术表面存在几项重大风险，投资委员会应独立评估。

              代币化所有权结构：ITN 的商业声量掩盖了一个重要产品法律约束。Alpaca
              自身法律披露确认，代币化资产提供的是底层股票的经济敞口，而不是直接法律所有权。代币持有人没有投票权、分红权，也没有清算中的剩余请求权。这种结构——由第三方代币化，发行平台（xStocks、Ondo、Dinari）而非最终投资者持有受益权益——已被
              SEC 2026 年 1 月工作人员声明明确列为比发行人赞助代币化更高风险的模型。Alpaca 作为代币化美国股票清算券商约 94% 的集中度意味着，Alpaca
              的任何监管或业务中断，都会同时损害全球大多数发行代币化美国股票的平台。

              24/5 流动性限制：通过 BOATS 进行隔夜交易，存在有记录的部分成交、买卖价差更宽、新闻驱动波动更高、时段之间价格跳变等风险。隔夜只允许限价单；标准市价单会被拒绝。这些约束限制了 24/5
              对高频策略或依赖市价单策略的效用。

              加密监管暴露：Alpaca Crypto LLC 的 FinCEN MSB 注册，不能提供 FINRA 注册 broker-dealer 同等的客户保护。加密资产被排除在 SIPC 和 FDIC
              覆盖之外。美国加密监管演进会持续带来合规开销和潜在产品限制。

              企业集成复杂度和文档缺口：Broker API 的灵活性（双 KYC 模型、可配置收入分成、多资产支持、SIPC / FDIC /
              现金抵押之间的双清算层差异）给新伙伴带来显著实施复杂度。核心端点文档质量高，但期权清算、FPSL 抵押机制和 OmniSub 子账户等边缘场景更薄。MCP Server v2 改掉了 v1
              的所有工具名称和参数，给既有 AI agent 集成带来迁移负担。

              平台集中于美国市场结构：Alpaca 的所有清算会员资格和 Blue Ocean ATS 依赖都限定在美国。尽管收购 WealthKernel 带来 Xetra
              接入，核心技术栈并不是为非美国清算和结算系统原生设计。这把近期可服务伙伴市场限制在美国注册证券上，也制造了对美国交易所和监管连续性的结构性依赖。
