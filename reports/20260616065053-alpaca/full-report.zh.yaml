      - number: '2.5'
        title: 采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >
              券商基础设施采用的主要监管约束，是通往自清算 broker-dealer 地位的资本密集、多年路径：FINRA 会员资格、DTCC/OCC/FICC 清算批准、持续净资本要求和监督基础设施， 使内部自建对最大型
              fintech 之外的公司都过于昂贵，从而创造对外包 BaaS 的结构性需求。SEC Rule 605 的合规截止日为 2026 年 8 月 1 日， 现在要求 broker-dealer
              报告细颗粒度执行质量数据，增加报告负担，也提高 PFOF 相关路由实践的透明度；EU 的 PFOF 禁令（过渡豁免于 2026 年 6 月 30 日到期）造成监管分化，使全球统一券商策略更复杂。中国 CSRC
              2026 年 5 月打击 Futu Securities（罚款 18.5 亿元人民币 / 约 USD 256M）和 Tiger Brokers（4.10 亿元人民币 / 约 USD
              57M），是重要负面市场进展：在八个政府机构支持下，两年内逐步清退中国大陆投资者经由这些平台跨境投资， 实际上从服务零售终端用户的美国股票基础设施可触达市场中，剔除了约 100 万个中国大陆投资者账户和约 HKD
              200–250B 受影响资产。此轮打击可能反向把部分机构需求导向 FINRA 监管渠道，但其短期效果是压缩可触达的国际零售需求。


              2024 年 Synapse Financial Technologies 破产及 BaaS 失败案例（Blue Ridge Bank、Evolve Bank、Solaris、Railsr）让超过 100,000
              人无法取用 $265M 资金，并抬高 fintech 买方选择基础设施提供商时的尽调门槛——这有利于受监管自清算提供商，相对中间件 BaaS 模式占优， 但也让所有 embedded finance
              供应商的交易周期承压。地理本地化需要持续投入：尽管 Alpaca 覆盖 40+ 国家，国际扩张仍需在每个司法辖区取得本地监管批准、 调整 AML/KYC，并处理货币。Interactive Brokers
              的全球规模（3.8M 账户、170+ 市场中心、40+ 国家）为大型买方提供了既有替代方案。


              关键规模尽调缺口：目前没有独立的、自下而上的券商 API 基础设施费市场估算，能把该市场从更宽的 embedded finance 或零股基础设施口径中单独剥离； Alpaca 声称在代币化美股中拥有 94%
              市占率（来自公司发布的 2025 年报告），未获任何独立来源验证；DriveWealth 自 2021 年 Series D（$450M， $2.85B
              估值）以来未发布财务更新，给评估同业竞争健康度留下缺口；分析师对可触达 embedded finance 市场的估算因范围定义不兼容而相差 4–5×。 代币化股票市场还显示 represented-value
              与实时流通指标之间有 5× 差异；若不仔细对齐，跨来源比较并不可靠。
