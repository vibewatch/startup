companyProfile:
  summary: >-
    Alpaca 是一家总部位于 San Mateo、API 优先的券商基础设施公司，也是一家自清算 broker-dealer， 由 Yoshi Yokokawa 和 Hitoshi Harada 于 2015
    年创立。公司最初是金融时间序列数据库创业公司 MarketStore，2018 年转向 brokerage-as-a-service，让全球 fintech、新银行、加密交易所和财富平台 借助 Broker API 与
    Trading API 嵌入美国股票、ETF、期权、固定收益和加密交易。Alpaca 通过 DTCC（股票）、OCC（期权）和 FICC（美国国债）自清算，省去第三方清算成本，并捕获每笔交易的完整经济性。 2026 年 1
    月，公司完成由 Drive Capital 领投的 $150M Series D，投后估值 $1.15B，进入独角兽行列； Citadel Securities、BNP Paribas、MUFG、Kraken
    等共同参投，披露融资总额超过 $320M。2026 年 4 月，Alpaca 收购 WealthKernel，搭建 Alpaca Europe；2026 年 6 月，公司上线 Binance 股票交易集成， 服务 Binance
    300M+ 用户基础。
