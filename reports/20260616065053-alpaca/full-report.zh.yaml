      - number: '6.5'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Alpaca
              没有公开披露净收入留存（NRR）、总收入留存（GRR）、合同期限、流失率或单个合作伙伴收入贡献；这些才是评估真实客户耐久性的核心指标。从公开证据能推断出的信号偏正面，但不足以支撑高置信度的留存判断。Sarwa
              持续合作 4 年以上（自 2021 年起，至 2026 年仍活跃）、Dime! 持续扩展功能（计划推出期权交易）、ZAD 持续共研新产品，都说明至少对关键 MENA 和 APAC
              合作伙伴而言，关系在随时间加深。Alpaca 2025 年度回顾提到「数百家全球合作伙伴」，但没有量化任何流失；也没有任何合作伙伴被公开确认为已从平台流失。


              合作伙伴基础中最重要的集中度风险，是与 Kraken 的双重关系。Kraken 同时是 Series D 股权投资方（$150M 轮参与者）、美国股票商业 API 合作伙伴、加密资产商业 API
              合作伙伴（Kraken Embed 接入 Alpaca 网络），以及代币化合作伙伴（xStocks 首选场所）。这种交织程度意味着 Kraken 的商业轨迹与 Alpaca 的收入轨迹部分共依赖；Kraken
              业务一旦恶化（监管行动、市场份额流失，或战略转向远离股票），都可能对 Alpaca 造成实质影响。合作伙伴—投资方治理问题——Kraken 是否因其股权而获得优惠商业条款——没有公开披露，是一个重大尽调缺口。


              Binance 合作（2026 年 6 月）引入了新的、且可能占主导的集中度风险。Binance 服务 3 亿全球用户；只要 Alpaca 的股票基础设施在 Binance
              用户群中的渗透率稍有起量，账户数就可能超过其他 Alpaca 合作伙伴合计。Binance 持有少数股权，收入分成条款已披露（细节来自 blockchain.news / coinalertnews
              报道，未获官方确认），并宣布了 bStocks 代币化的进一步计划。如果 Binance 成为主导收入贡献方，Alpaca 将面临类似单一客户业务的重大合作伙伴集中风险——这会大幅抵消「300
              多家合作伙伴」的多元化叙事。


              地理扩张提供了反集中度叙事。Alpaca 覆盖 40 多个国家，2026 年 4 月收购 WealthKernel（Alpaca Europe，受英国和欧盟监管，Xetra 已上线），再加上
              LATAM（Bitso、trii、Zesty）、非洲（Raenest、PandaPanda）、东欧（Birbank / 阿塞拜疆）和 GCC（ZAD、CUSP
              Wealth）的新合作伙伴管线，分散了美国中心和单一合作伙伴收入集中。Alpaca 宣称与 Saudi Vision 2030 对齐（CEO Yokokawa 在 Series D 公告中提及），以及
              Derayah Financial 合作，表明 MENA 进一步扩张是战略优先项。但新兴市场合作伙伴（通常从较小账户群起步）与锚定合作伙伴（Kraken、Binance、SBI）的底层收入贡献对比完全不透明。


              TradingView 的已验证用户评论板块呈现出 Alpaca 客户支持的反复抱怨模式：高峰期响应延迟、基于合规审查限制账户但沟通不清，以及认证 / MFA 锁定问题。这些投诉是定性信息，可能反映的是零售
              Trading API 用户群，而非机构 Broker API 合作伙伴，但它们提示支持基础设施可能跟不上合作伙伴基础复杂度的上升。BrokerChooser（4.1/5）和
              DailyForex（3.5/5）也分别将市场覆盖有限（仅美国资产、无国际股票）和仅靠社区论坛支持列为零售用户的显著弱点。
