  productSummary: >-
    两条核心 API 产品线：Broker API 是全栈 brokerage-as-a-service，让 fintech 和机构嵌入美国股票、ETF、 期权、固定收益和加密交易；Trading API
    面向算法交易者和自营交易公司。配套产品包括全额付清证券借贷、 高收益现金 sweep、24/5 美股交易、多腿期权，以及用于链上美股托管的 Instant Tokenization Network。 Alpaca 通过
    DTCC、OCC 和 FICC 自清算，把完整交易生命周期放在内部完成。
  customerFocus: 全球 fintech、新银行、加密交易所、财富平台、robo-advisor、伊斯兰金融应用，以及希望把美国券商基础设施嵌入 自身产品的机构 broker-dealer；重心主要在美国本土零售市场之外。
  businessModel: >-
    B2B2C 多收入流券商经济模型：payment for order flow（PFOF）、API 与平台费、保证金融资利息、全额付清证券借贷收入、 高收益现金 sweep 利差，以及加密 maker-taker
    费用。收入随合作伙伴交易量和账户活跃度扩张；自清算省去第三方清算成本， 留住每笔交易的完整经济价值。
