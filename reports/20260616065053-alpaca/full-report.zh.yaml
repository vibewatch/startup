  - id: FE001
    title: Alpaca 产品架构栈
    type: stack
    layout: wide
    summary: Alpaca 平台可以拆成五层：从开发者界面到清算和监管轨道；其中自清算栈是最具防御性的差异点。
    data:
      layers:
        - label: 开发者界面
          description: docs.alpaca.markets、OpenAPI specs、官方 SDK（Python/C#/Go/JS）、MCP Server v2、CLI、paper trading 沙盒
          detail: 分发层把 Alpaca 的交易基础设施嵌入开发者日常工作流；也是关键开发者壁垒向量
        - label: API 网关
          description: API 层：Broker API、Trading API、Market Data API（Basic / Algo Trader Plus）、Crypto API
          detail: REST + WebSocket + SSE 端点；版本化；具备幂等性和 request-ID 原语；由 OpenAPI spec 驱动
        - label: 产品模块
          description: 股票 / ETF、期权、固定收益、Crypto、Fractional Shares、24/5 Trading、FPSL、High-Yield Cash、ITN
          detail: 面向合作伙伴的创收产品界面；成熟度和监管处理因模块而异
        - label: 清算与结算
          description: DTCC（股票）、OCC（期权）、FICC（美国国债）、Blue Ocean ATS（隔夜）、Alpaca Crypto LLC（crypto/ITN）
          detail: 自清算会员资格让股票、期权和美国国债无需第三方券商；BOATS 是第三方 ATS 依赖
        - label: 监管与信任层
          description: FINRA broker-dealer（Alpaca Securities LLC）、FinCEN MSB（Alpaca Crypto LLC）、SIPC 会员、FDIC sweep 计划、KYC 合规
          detail: 底层信任基础设施；SIPC/FDIC/抵押品保护因产品而异；crypto 不纳入标准投资者保护
    approximationNotes: 该架构栈根据公开文档和披露搭建。内部系统冗余、云服务商身份以及未披露的可靠性基础设施没有纳入。
