      - 方向
      - 时间
      - 对 Alpaca 市场的影响
      - 尽调问题
    rows:
      - - 散户投资者数字化（全球）
        - 正向驱动
        - 持续 / 加速
        - 数字 app 对投资功能的结构性需求在增长；美国散户交易占比从 14% 升至 22%（2019–2022）
        - 监测月活开发者数量和新增合作伙伴的同比变化
      - - API 优先的 fintech 产品发布
        - 正向驱动
        - 持续；到 2026 年，B2B fintech 在新增 fintech 中的占比升至 62%
        - 构建投资 app 的开发者群体扩大；潜在合作伙伴漏斗变宽
        - 跟踪 API sandbox 注册量和转正式上线转化率
      - - 全球对美国股票准入的需求
        - 正向驱动
        - 结构性；中国、印度、巴西及 50 多个 EM 国家仍有资本管制
        - 大量未被服务的散户人口（全球 85% 人口在发达市场之外）推动代币化股票和嵌入式券商需求
        - 量化国际合作伙伴与本土合作伙伴的收入贡献
      - - DTCC 代币化试点（2025 年 12 月）
        - 正向驱动
        - 2026–2029（3 年试点，2026 年开始实时交易）
        - 机构级基础设施授权降低代币化股票的合法性门槛；Alpaca 作为 ITN provider 受益
        - 跟踪 2026 年使用 DTCC 授权框架赢得的机构代币化 mandate
      - - 24/7 和 24/5 交易需求
        - 正向驱动
        - 2026 年已活跃；随全球用户群增长
        - Alpaca 借此区别于传统清算公司；也降低非美国时区国际合作伙伴的摩擦
        - 评估 24/5 交易量占总量比例；监测代币化股票 24/7 结算采用情况
      - - FINRA / 资本要求构成进入壁垒（自建）
        - 正向约束（护城河）
        - 结构性；预计近期不会变化
        - 阻止 fintechs 自建 broker-dealer；把支出导向 API providers
        - 确认 FINRA 会员申请积压数据，将其作为自建尝试的代理指标
      - - SEC Rule 605 执行质量披露（2026 年 8 月）
        - 负向约束（合规成本）
        - 截止 2026 年 8 月 1 日；Reg NMS 修正案 2026 年 11 月分阶段实施
        - 提高路由经济性的透明度；审视 PFOF 关系；增加报告负担
        - 评估 Alpaca 的 Rule 605 合规架构，以及对合作伙伴 PFOF 收入的潜在影响
      - - 欧盟 PFOF 禁令（2026 年 6 月过渡期结束）
        - 负向约束（欧洲）
        - 2026 年 Q3 对零售订单在欧盟范围生效
        - 使用 Alpaca 欧盟（Alpaca Europe）基础设施、面向欧洲的券商 app，其 PFOF 相关收入会下降
        - 量化欧盟合作伙伴 PFOF 收入占比；评估 Alpaca Europe 禁令后的替代收入模式
      - - 中国 CSRC 打击跨境投资（2026 年 5 月）
        - 负向约束（不利市场事件）
        - 2 年退出期；大陆客户进入只卖不买模式
        - 约 100 万中国大陆散户投资者账户被排除在跨境股票覆盖之外；服务中国大陆的合作伙伴 TAM 缩小
        - 评估是否有 Alpaca 合作伙伴对中国用户有实质性敞口
      - - BaaS 平台失败（Synapse 2024 + 其他）
        - 负向约束（信任、合规）
        - 2026 年以后尽调环境仍持续收紧
        - 买方审查更严，交易周期拉长；受监管的自清算提供商受益，但所有 BaaS vendor 的销售摩擦都会增加
        - 审阅 Alpaca 对监管资本、SIPC / 客户资产隔离的披露，确认韧性叙事能否站住
    notes: 时间和方向是基于监管文件、独立研究和公司披露给出的分析判断。驱动因素与约束按券商基础设施 API 市场评估；它们对 Alpaca 本身的绝对影响尚未被独立量化。
