              Alpaca 作为代币化美国股票清算券商拥有约 94% 市场份额，这意味着整个新生的代币化股票板块依赖单一受监管中介。SEC 2026 年 1
              月工作人员声明明确提示，第三方代币化模型——最终投资者不持有直接所有权——比发行人赞助结构有更高监管风险。Alpaca
              的任何监管行动、合规中断或关系变化，都会同时影响全球大多数代币化股票平台。这种行业集中度是声誉和系统性风险，投资者应独立于 ITN 的收入潜力来权衡。
