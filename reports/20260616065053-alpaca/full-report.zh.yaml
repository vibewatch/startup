  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Alpaca Securities LLC（FINRA CRD #288202，SEC File 8-69928）是 AlpacaDB, Inc. 旗下受监管的 broker-dealer
              子公司。其披露的执法历史现在已在不到两年内覆盖两起独立监管行动；这种模式提出的问题不止是单个违规，而是系统性合规治理。


              第一项行动是 SEC 2024 年 9 月 24 日行政命令（Release No. 34-101137）。委员会认定，自至少 2022 年 5 月起，Alpaca 人员——包括高级管理层——经常通过
              WhatsApp 和个人设备短信沟通公司的 broker-dealer 业务。由于这些信息从未被留存，Alpaca 违反了 Exchange Act 第 17(a) 条和 Rule 17a-4(b)(4)。SEC
              认定该缺失「覆盖全公司，并涉及不同权限层级的人员」，处以 $400,000 民事罚款、正式谴责和停止并终止令。Alpaca 承认事实，并确认违反联邦证券法。罚款之外的现实担忧在于，SEC
              明确指出，记录留存失败「可能影响委员会履行监管职能和调查违规的能力」，且影响横跨多次传票回应——也就是说，证据影响超出了记录留存问题本身。


              第二项行动是 FINRA 2026 年 3 月 20 日的 Letter of Acceptance, Waiver and Consent。FINRA 认定，2021 年 4 月至 2025 年 6
              月期间，Alpaca 未及时向 FINRA/Nasdaq Trade Reporting Facility（FNTRF）报告约 187 万笔交易，违反 Rules 6380A 和 2010。2021 年 2 月至
              2023 年 5 月期间，公司提交了不准确报告：超过 6,700 笔交易的执行数量错误，约 220 万笔交易遗漏了必要的 prior-reference-price 修饰符和时间。更严重的是，2020 年 12
              月至 2026 年 2 月——覆盖公司作为自清算和 carrying broker 的整个期间——Alpaca 缺乏合理设计、用于遵守 FINRA 交易报告规则的书面监督程序（FINRA Rules 3110 和
              2010）。FINRA 处以 $300,000 罚款和谴责。SEC 与 FINRA 两项行动中均出现 FINRA Rule 3110（监督）违规——分别对应记录留存监督和交易报告监督——这是 Alpaca
              合规基础设施存在结构性弱点的直接指标。


              第三项正在浮现的法律风险涉及代币化证券。SEC 2026 年 1 月 28 日联合员工声明（Corporation Finance、Investment Management、Trading and
              Markets 三个部门）明确，联邦证券法适用于所有代币化证券，无论所有权记录在链上还是链下。该声明区分了发行人赞助模式与第三方模式，并进一步区分托管型代币化证券（传递间接所有权权益）与合成型代币化证券（可能构成
              security-based swaps，且在 Exchange Act 下只能由 eligible contract participants 交易）。Alpaca 通过 Kraken 合作推出的
              xStocks 代币化产品属于第三方托管模式。法律分类决定终端投资者权利、交易对手风险敞口以及交易所交易要求是否适用；如果监管将 xStocks 重新分类为 security-based swap
              产品，合格投资者范围会被实质性收窄，并需要交易场所完成 SEC 注册。


              跨境牌照风险在结构上偏高。Alpaca 通过合作伙伴嵌入方式在 40 多个国家运营，这意味着在多数司法辖区，合作伙伴的终端用户实际上在使用一家美国注册 broker-dealer 的清算基础设施，而 Alpaca
              并未在当地取得国家层面的注册。基于 WealthKernel 收购搭建的 Alpaca Europe 提供了部分欧盟覆盖，但公司没有公开完整牌照地图。任何司法辖区内未经授权的 broker-dealer
              活动，都可能触发执法、合作伙伴责任或被迫退出。
