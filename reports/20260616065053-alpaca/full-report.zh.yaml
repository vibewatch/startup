  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Alpaca 位于 brokerage-as-a-service 基础设施、零股交易技术和代币化股票结算 rails 的交汇处。其核心市场是券商基础设施 API： 监管和技术服务让 fintech
              应用、新银行、加密交易所、财富平台和国际投资应用无需自建 FINRA 注册 broker-dealer，也无需取得 DTCC、OCC 或 FICC
              自清算批准，就能嵌入美国股票、ETF、期权和固定收益交易。纳入支出边界包括按账户收取的平台费、按交易收取的基础设施和执行费、
              转嫁给合作伙伴的清算与结算费用、证券借贷收入分成、payment-for-order-flow 返佣，以及 tokenization 铸造 / 赎回基础设施费用。
              核心市场边界之外的是直接面向消费者平台（Robinhood、IBKR、Schwab）赚取的零售券商佣金、纯 ACH 或卡支付网络费用、信用局数据服务、 核心银行软件许可，以及加密现货交易所基础设施。


              最主要的现状替代方案是内部自建：fintech 自己取得 FINRA 注册 introducing 或自清算 broker-dealer 牌照。这条路需要多年监管审批 （FINRA 会员资格、按清算模式不同为
              $250K–$5M+ 的净资本要求、DTCC 清算会员资格——Alpaca 自己大约用了五年），还要持续配备合规人员， 并在达到运营规模前通常投入 $5–15M 初始建设成本。第二类替代方案，是与
              Pershing（BNY Mellon）、National Financial Services （Fidelity）或 RBC Clearing 等既有托管方建立传统 white-label
              清算关系；这些公司提供托管和清算服务，但缺少现代 RESTful API 架构， 且要求更高的最低交易量承诺。第三类替代方案，是使用现有 API 优先券商基础设施竞争者：DriveWealth、Apex
              Fintech Solutions 或 Interactive Brokers Prime。代币化股票基础设施——向发行方和 DeFi 协议收取费用，使其通过合规 broker-dealer rails
              铸造和赎回代币化股票—— 是相邻且快速增长的市场细分；Alpaca 通过 Instant Tokenization Network 追逐这一市场，但其收入模型和交易对手类型不同于传统券商 API 费用。
