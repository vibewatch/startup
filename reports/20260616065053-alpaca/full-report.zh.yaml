            body: >-
              Alpaca 未披露 NRR、GRR、流失率或 cohort 数据。具名合作伙伴的期限代理指标（Sarwa 4 年以上、Dime! 2 年以上）偏正面，但它们来自少数公开重点展示的关系——剩余 290
              多家合作伙伴的表现完全不透明。任何关于客户耐久性的投资判断，都必须把这一缺口视为重大不确定性，需要管理层直接确认，理想情况下还要有经审计的 cohort 数据。
