      - number: '8.4'
        title: 反向论点、私营不透明与风险调整
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的投资论点靠三条结构性判断支撑：券商 API
              基础设施是高护城河、经常性收入的商业模式；自清算能带来持久的单位经济优势；公司全球伙伴覆盖够宽，能随着嵌入式投资在国际市场增长而复利。三条判断都有部分证据支持，但每一条也都有明显反论点。


              护城河真实存在，但并非无争议。Alpaca 在多个地区有先发优势，API 对开发者友好的口碑较强，DTCC+OCC+FICC 自清算栈也花了多年才搭起来。DriveWealth 拥有类似基础设施，服务 Cash
              App、Revolut、BTG Pactual 等蓝筹客户的时间更长。Apex Fintech Solutions 则以更大规模支撑 SoFi 和
              Webull。这些平台都没有跑出赢家通吃格局；最大伙伴关系可以重新谈判或切换，来自大型银行和交易所的新进入者也可能把 API 层做成商品化能力。


              私营公司不透明，是反论点的核心。Alpaca 没有披露经审计财务、毛利率、NRR、烧钱速度或股权结构。没有毛利率数据，就无法判断自清算红利是否已经落到单位层面，还是 Binance 的 PFOF
              分成折扣（Binance 来源账户 50% PFOF、65% 出借利润归 Binance）已经吃掉了利润率提升。Binance 持有 Alpaca 少数股权，让双方经济关系多了一层，也更难重新谈判。若
              Binance 占 Alpaca 账户活动的 20–30%——考虑 Binance 用户体量，这一假设并非不合理——该客群的混合经济性会显著不同于表面 ARR。


              $1.15B 估值里包含的代币化期权价值，带来尚未变现的上行空间。Alpaca 声称在代币化美国股票和 ETF 中有 94% 市占率，但这是公司口径，尚未独立验证，代币化收入流也仍处早期。WealthKernel
              带来受监管的欧洲落点，但整合成本和监管复杂度没有量化。两项都是真实期权价值，但不应成为当前估值的主要承销论点。


              监管环境还留下剩余风险：2024 年 9 月 SEC 处罚令（非官方渠道通信，$400K 民事罚款）、FINRA SD-2436 会员延续审查，以及国际市场 PFOF 监管仍不确定。Alpaca
              整改后，FINRA 审查结果支持其继续保留会员资格，但该事件增加了声誉和运营负担。MiFID II 下的欧洲 PFOF 限制让全球收入组合更复杂；阿联酋、东南亚、拉美这些关键伙伴地区的监管演进，也带来执行风险。
