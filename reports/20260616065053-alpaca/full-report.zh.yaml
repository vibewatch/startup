  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与商业化架构
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的收入模型是多条线并行的券商基础设施业务，把传统券商经济性和 API 平台溢价揉在一起。公司主要从六个方向变现：订单流付款（PFOF）、B2B 伙伴支付的 API
              和平台费、融资融券利息、全额支付证券借贷（FPSL）、高收益现金扫存利差，以及加密 maker-taker 费用。每条收入线都结构性绑定伙伴平台上的交易量和账户活跃度，而不是直接零售客户关系；这也反映了
              Alpaca 的 B2B2C 模型——收入跟着伙伴增长放大。


              PFOF 是最显眼、历史上也最大的收入流：Alpaca 把客户订单路由给批发做市商，后者为执行机会付费，终端用户得以免佣交易，Alpaca 则拿走路由溢价。但 2026 年 6 月 Binance
              股票交易上线披露了一个实质商业约束。按 Binance 公布的证券交易条款，来自 Binance 的订单为 Alpaca 产生的 PFOF 费用，Binance 拿走 50%；Binance
              账户证券借贷在用户拿到利息后剩余的利润，Binance 拿走 65%。Binance 还持有 Alpaca 少数股权，双方绑定超过标准供应商关系。对一个很可能按交易量计算属于 Alpaca
              最大单一伙伴之一的关系，这种分成结构把每账户有效 PFOF 和借贷收入大约砍半。


              API 和平台费、保证金融资利息、FPSL 收入、高收益现金扫存利差，是让 Alpaca 区别于纯 PFOF 券商的次级收入线。Alpaca 公布的融资利率为每笔交易 6.25%，对应标准 B2B2C
              保证金融资利率。FPSL 计划让金融科技伙伴向客户提供证券借贷，同时 Alpaca 留存一部分借贷费收入。High-Yield Cash 扫存让 Alpaca 从扫入 FDIC
              承保计划银行的存款中赚取利差。加密交易使用公开 maker-taker 费率表（最低交易量层级为 0.15% maker / 0.25% taker）。SEC Section 31 费用（截至 2026 年 4
              月，每卖出 $1 million 本金收 $20.60）和 FINRA Trading Activity Fee 等监管转收费会汇给监管机构，不由 Alpaca 留存。
