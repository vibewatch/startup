      - number: '7.5'
        title: 缓释措施、监控指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              评估 Alpaca 的风险缓释成熟度，需要把 Alpaca 自愿披露的信息，与监管机构揭示的合规状态分开看。正面因素包括：Alpaca 承认 SEC 违规、配合调查，并已取得 OCC 和 FICC
              清算会员资格，表明 FINRA 和清算组织对当前合规状态有信心。Grant Thornton 对 2025 年年度审计，为 broker-dealer
              实体提供了独立财务验证。净资本位置显示其相对监管最低要求有显著缓冲。


              与这些缓释因素相对，严重性排序为：（1）最高严重性——横跨多个监管机构、持续五年窗口的重复监督控制失败；（2）高严重性——2026 年 5 月正常运行率 48.4%，且处于生产 B2B
              券商基础设施场景；（3）高严重性——Kraken / Binance 合作伙伴集中，且没有公开 SLA、正常运行保证或集中度披露；（4）中等严重性——2026 年 1 月 SEC
              指引下的代币化法律分类风险；（5）中等严重性——财务状况和信贷额度条款未披露；（6）中等严重性——Alpaca Securities LLC 与 Alpaca Clearing LLC
              之间的实体命名混淆；（7）较低严重性——跨境牌照覆盖缺口。


              最具体的近期终止触发条件，是在 2026 年 3 月 AWC 后 24 个月内，SEC 或 FINRA 提起任何新的重大执法行动——这是「heightened
              supervision」分类的标准。第三起行动很可能触发 FINRA 的 Membership Application Program（MAP）审查，在合规整改被验证前，可能冻结新产品上线和国际扩张。同样，如果
              Binance 或 Kraken 因监管被撤销授权（例如 Binance 持续面对的 DOJ 和全球监管事项）而无法服务美国客户，将立刻冲击 Alpaca 基础设施利用率带来的收入。


              建议监控指标包括：（a）BrokerCheck 披露页是否出现新的执法事件；（b）SEC EDGAR FOCUS 报告中的净资本趋势；（c）status.alpaca.markets
              月度正常运行率，用于跟踪基础设施可靠性；（d）SEC Rule 606/605 修订生效后的季度 PFOF 收入披露；（e）Alpaca Europe FCA 或同等牌照公告；（f）xStocks
              产品监管状态更新，包括任何 SEC 员工 no-action 或重新分类。
