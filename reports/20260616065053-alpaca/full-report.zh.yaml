      - number: '6.3'
        title: 采用轨迹与增长速度
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的合作伙伴和账户增长轨迹有多年公开记录支撑，但数据完全来自公司发布的公告，未经过独立审计。关键拐点包括：Kraken Embed 博文（未注明日期，估计早于 2025 年）称其拥有「超过 200
              家企业合作伙伴、超过 500 万终端用户账户」；SBI Securities 公告（2025 年初）称「覆盖 40 个国家的数百家合作伙伴，共同服务超过 700 万个券商账户」；2025 年 12 月
              GoTyme Bank 公告称其覆盖「40 多个国家的数百家金融科技公司和机构，融资超过 $170M」，并拥有「超过 800 万个券商账户」；2026 年 1 月 Series D 公告确认「40 多个国家的
              300 多家组织」支撑「超过 900 万个券商账户」。账户数在约 12–18 个月内从 500 万增至 900 万，意味着由合作伙伴带来的账户基数出现实质增长。


              2025–2026 年 Alpaca 博客披露的案例研究节奏，也显示出合作推进速度。博客列出 66 个案例研究（部分已上线，部分为已宣布）。值得注意的新合作包括 Binance（2026 年 6
              月）、BridgeWise（2026 年 3 月）、GoTyme Bank（2025 年 12 月）、Gotrade（新的东南亚功能）、Bitget Reality（代币化股票）、Anchored（具备 DeFi
              可组合性的代币化 NASDAQ 股票）、Birbank Invest / Pasha Capital（阿塞拜疆）、Raenest（尼日利亚）和 PandaPanda（肯尼亚）。新合作地域横跨
              APAC、非洲、东欧和 LATAM，与 Alpaca 宣称的「向地球上每个人开放金融服务」使命一致。每月活跃开发者 61,000 人是管线转化的领先指标，但 MAD 转化为活跃 Broker API
              合作伙伴的比例并未披露。


              Alpaca 2025 年度回顾博客确认，公司 2025 年在京都（日本）举办 Partner Summit，并在会上宣布 24/5 交易——这表明其合作伙伴规模和战略分量已足以支撑一次线下全球峰会。2026 年
              6 月宣布与全球最大加密交易所 Binance 合作，代表潜在账户规模出现台阶式变化：Binance 全球用户超过 3 亿，即便只有 1% 转化为通过 Alpaca 交易美国股票，也会远超当前 900
              万账户基数。
