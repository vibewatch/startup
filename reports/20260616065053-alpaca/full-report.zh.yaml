      - number: '4.5'
        title: 承销缺口、负面风险与尽调议程
        blocks:
          - type: paragraph
            body: >-
              承销 Alpaca 财务质量的最大单一障碍，是私营公司的不透明。截至本次运行日期，Alpaca 尚未披露绝对年度收入、毛利率、净利率、现金消耗率、净收入留存、获客成本或资金
              runway。要对资本充足性、利润率轨迹和后续融资需求形成扎实判断，这些都是核心指标。增长叙事由分析师估计和公司自述收入增长支撑——两者都未经审计；缺少公开财务意味着尽调只能依赖可比分析、管理层陈述和表外披露审查。


              PFOF 监管环境是 Alpaca 收入模型的主要结构性负面风险。欧盟根据 MiFIR Article 39a 禁止 PFOF，自 2026 年 6 月底生效，直接抹掉 Alpaca
              Europe（WealthKernel 之后的英国 / 欧盟实体）的一条收入流。SEC 正在实施修订后的 Rule 605，合规日期为 2026 年 8 月 1
              日，扩大美国券商的执行质量披露义务和报告成本。英国、澳大利亚、加拿大和新加坡已经限制或禁止 PFOF。SEC DERA 工作论文（2025 年 1 月）研究了 PFOF
              影响，并指出这种做法每年为美国十二大券商带来约 $3.8 billion——如果美国沿着欧盟路径走，面临风险的收入规模很大。若 PFOF 在美国受限，Alpaca 需要用 API 费、保证金融资利息、FPSL
              收入和现金扫存利差补回损失；考虑到模型已经多元化，这种情景可行，但没有内部利润率数据就无法量化。


              Binance 收入分成条款——50% PFOF 和 65% 借贷利润——构成第三个负面因素。如果 Binance 借其用户规模成为 Alpaca 总账户和交易量增长中的主导份额，全账簿每账户有效混合 PFOF
              收益率会恶化。综合托管结构（所有 Binance 平台客户都汇入单一 NEST Trading Limited 账户）放大运营集中度：任何针对 Binance 的监管行动，都可能同时影响 Alpaca 托管
              AUC 的重要部分。未披露的 $40 million 信贷额度进一步增加资产负债表不透明度——约束、质押和到期日未知——没有披露就无法压力测试。PFOF 监管逆风、Binance
              收入抽取、私营公司不透明和未披露信贷条款合在一起，构成完成财务判断前必须解决的主要承销阻碍。
