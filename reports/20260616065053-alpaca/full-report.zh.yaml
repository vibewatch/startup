      - number: '8.2'
        title: 公开可比框架与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              将 Alpaca 与公开上市的券商和交易所基础设施公司对标，会看到市销率倍数高度分散，反映了商业模式、增长率和市场差异。Robinhood（HOOD）按 2026 年 6 月市值 $88.35B 和 FY2025
              收入 $4.47B 计算，交易倍数约为 19.8x trailing revenue；溢价来自零售交易动能、Robinhood Gold 订阅增长，以及 2025 年收入同比增长
              51.6%。Interactive Brokers（IBKR）按 $157.34B 市值和 FY2025 收入 $6.21B 计算，交易倍数约为 25.4x；该倍数由其自清算垂直整合、机构客户基础、接近 80%
              的运营利润率和客户资产复合增长支撑。二者都是异常值，但有规模化盈利和现金生成能力作为依据。


              Coinbase（COIN）按 2026 年 6 月市值 $44.68B 和 FY2024 收入 $6.56B 计算，交易倍数约为 6.8x；折价反映了与加密市场状况绑定的高收入周期性和监管不确定性。Futu
              Holdings（FUTU）按 $14.03B 市值和 FY2025 约 $2.71B 美元收入（HK$21.1B）计算，交易倍数约为 5.2x，反映中国市场监管风险和更窄的产品组合。Charles Schwab
              FY2024 总收入 $19.6B，FY2025 为 $23.9B；作为大型多元化机构，其筛选结果是低个位数 P/S，反映类银行经济学和很低的增长溢价。


              私有同业中，DriveWealth 最近披露估值来自 2021 年 8 月 Series D，为 $2.85B；公司截至 2024 年 11 月披露约 $75M ARR，意味着该陈旧估值约为 38x。其 CEO
              预计 2024 年收入 $100M 且现金流转正，并以 2024 年 7 月起约 24 个月内 IPO 为目标。Apex Fintech Solutions 2024 年产生约 $157.5M ARR，对应
              $472.5M 估值，倍数约 3.0x，反映其取消 SPAC 历史和 PE 所有权重置。Alpaca 约 10–11.5x 的隐含倍数，位于被压缩的 Apex 数字和陈旧的 DriveWealth
              峰值之间，也低于高溢价上市公司——对现阶段高增长私有基础设施 API 来说，这一位置可以辩护。


              截至 2026 年中，金融科技估值环境提供了重要背景。Forge Global 私有金融科技篮子显示，截至 2025 年 5 月，行业估值较 2021 年最后一轮估值低约 39%；PitchGrade M&A
              landscape analysis 显示，2026 年基础设施平台交易在 3–7x 收入完成。Alpaca 约 10–11.5x 的倍数高于 M&A
              成交区间，这意味着战略收购方若按当前价格出手，必须押注显著的有机价值创造，而不是靠可比私有交易倍数重估。这让退出路径实质依赖于持续有机增长，或以高于 M&A 可比倍数的溢价 IPO。
