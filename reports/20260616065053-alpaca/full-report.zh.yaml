      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Alpaca 自 2015 年创立以来至少经历九次融资事件，累计融资超过 $320M，并在 2026 年 1 月达到独角兽状态。 最早披露的一轮是 2017 年 $1.7M 种子轮，投资方包括
              D4V（IDEO/Genuine Startups 合资）、Monex Ventures 和 MUCAP（MUFG）。2018 年 10 月，公司完成 $3M pre-Series A，由 Global
              Brain 领投，时间点与免佣交易平台公开上线重合。 2019 年末，Spark Capital 领投 $6M 融资，也让 Alpaca 获得 “Stripe of stocks” 的叙事；2020 年 10
              月， Portag3（现 Portage Ventures）领投 $10M Series A。2021 年 8 月，Tribe Capital 领投 $50M Series B， Horizons
              Ventures、Eldridge、Positive Sum，以及回归投资方 Portage、Spark Capital、Social Leverage 参投； 当时累计融资约 $72M。2023 年 10
              月，Alpaca 获得日本战略金融机构 SBI Group 的 $15M 可转债，将累计融资推至约 $120M。2025 年 4 月完成 $52M Series C（投资方：Derayah
              Financial、850 Management、National Investments Company Kuwait、Unbound 和 Portage Ventures），总融资升至 $170M。2026
              年 1 月 $150M Series D 由 Drive Capital 领投； 其他新参投方包括 Citadel Securities、Opera Tech Ventures（BNP Paribas）、MUFG
              Innovation Partners、Flat Capital （Klarna CEO Sebastian Siemiatkowski 为控制 UBO）、DRW Venture
              Capital、Kraken、Altered Capital、X&KSK （Keisuke Honda）、Bank Muscat 和 Endeavor Catalyst。Series D 回归投资方包括
              Portage、Horizons Ventures、 Social Leverage、Unbound、Diagram 和 Derayah Financial；天使投资人包括 Revolut CTO Vlad
              Yatsenko。股权融资之外， Alpaca 同步获得 $40M 信贷额度。Series D 将 Alpaca 估值定在 $1.15 billion；公司称交割后总融资已超过 $320M。
