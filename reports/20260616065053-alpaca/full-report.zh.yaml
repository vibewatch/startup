  - id: FI003
    title: 单位经济桥
    type: flow
    layout: wide
    summary: 交易活动进入 Alpaca 清算栈，并在三个捕获点产生收入；自清算转换决定多少价值由 Alpaca 留存，而不是付给中介。
    data:
      nodes:
        - id: order-flow
          label: 来自伙伴的订单流
          detail: 伙伴平台通过 Broker 和 Trading API 产生股票、期权、固定收益和加密订单。
          tone: positive
        - id: execution
          label: 执行和路由
          detail: Alpaca 路由订单；做市商为非知情散户订单流支付 PFOF。终端用户免佣金。
          tone: neutral
        - id: clearing-settlement
          label: 清算与结算（自营）
          detail: DTCC（股票）、OCC（期权）、FICC（美国国债）：2024–2025 年以来全部自营。第三方费用被拿掉。
          tone: positive
        - id: revenue-capture
          label: 收入截留点
          detail: PFOF、保证金融资利息、FPSL、现金 sweep 利差和 API 费用都在这一环节留存。
          tone: positive
        - id: cost-pool
          label: 成本池
          detail: 清算运营、合规、市场数据、监管资本、银行连接、技术授权。
          tone: warning
        - id: partner-dilution
          label: 合作伙伴收入分成
          detail: Binance 按 50% PFOF / 65% 借贷收入分成；其他合作伙伴安排未知。
          tone: warning
        - id: net-economics
          label: 净单位经济
          detail: 成本和合作伙伴分成之后的留存；未公开披露。IBKR 基准：成熟期税前利润率约 71–77%。
          tone: neutral
      edges:
        - from: order-flow
          to: execution
        - from: execution
          to: clearing-settlement
        - from: clearing-settlement
          to: revenue-capture
        - from: revenue-capture
          to: cost-pool
        - from: revenue-capture
          to: partner-dilution
        - from: cost-pool
          to: net-economics
        - from: partner-dilution
          to: net-economics
    approximationNotes: 该桥接为定性判断。净单位经济未公开披露。IBKR 税前利润率基准对应一家规模大得多、完全成熟的运营商；考虑到 Alpaca 当前规模和增长投入，其当前利润率很可能明显更低。
