      - number: '8.5'
        title: 最终尽调问题与投资纪律
        blocks:
          - type: paragraph
            body: >-
              从继续研究走向买入，必须补齐四个核心证据缺口，任何公开市场对标都无法替代。第一，需要 FY2024 和 FY2025 经审计财务或管理层编制的未经审计报表，以确认 ARR、毛利率、现金消耗和 EBITDA
              轨迹。第二，NRR 必须确认高于 110%，才能验证 Alpaca 已安装伙伴基础是在扩张，而不是在流失。第三，必须量化 Binance 收入集中度；若 Binance 占 ARR 超过
              25%，实际经济性会明显差于表面数字，$1.15B 入场价也需要更高增速才能自洽。第四，必须审阅股权结构，包括九轮股权融资带来的优先权压力和 $40M 信贷额度，以评估普通股的实际价值。


              定量缺口之外，还有两个定性条件很关键。自清算必须能证明，相比接入 DTCC 前的基线，毛利率确实改善；若利润率数据显示，PFOF 和出借收入提升被 WealthKernel
              整合成本和伙伴收入分成吃掉，自清算论点在理论上仍成立，但尚未转化为经济收益。同时，代币化监管环境需要持续跟踪——通过 Instant Tokenization Network
              进行美国股票链上结算，在美国还没有明确法律框架，若 SEC 指引转向不利，可能压缩代币化收入上行空间。


              如果投资者能拿到所需披露，并确认升级标准——ARR 高于 $120M、毛利率高于 35%、NRR 高于 110%、Binance 集中度低于
              25%、没有不利的股权优先权结构——结合市场机会和竞争位置，$1.15B 入场价具有吸引力。缺少这些确认时，在私营金融科技市场仍受压的背景下，当前估值的风险调整回报低于高确信买入门槛。
            claimRefs:
              - CV035
              - CV044
              - CV045
              - CV033
              - CV026
