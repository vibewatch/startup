  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 伙伴生态：规模、细分与地理覆盖
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的客户基础是 B2B2C 生态：Alpaca 向机构和金融科技伙伴（直接付费客户）出售券商基础设施 API 和自清算服务；伙伴再把这些能力嵌入终端用户产品（最终受益方）。截至 2026 年 1 月
              Series D 公告，Alpaca 已与 40+ 个国家的 300 多家组织合作，共同支撑 900 多万个终端用户券商账户。略早的 2025 年 12 月 BridgeWise 合作公告引用了同样的 900
              万账户数字；而早于 Series D 的 Kraken Embed 博客则称“200 多家企业伙伴、超过 500 万个终端用户账户”，说明仅 2025 年账户增长就很强。Alpaca 的 61,000
              月活开发者社区（公司首页披露）是管线宽度的领先指标。


              拆分 Alpaca 的伙伴基础，可以看到五个主要垂直集群。第一，金融科技投资 App
              按数量构成最大群体：Dime!（泰国）、Gotrade（东南亚）、Raenest（尼日利亚）、PandaPanda（肯尼亚）、trii（智利）、Zesty（智利）、Midas（土耳其）、Wallace
              Finance 和 CUSP Wealth（GCC）等数字优先投资平台，都有 Alpaca 案例研究博客记录。第二，新银行和嵌入式金融玩家包括 GoTyme Bank（菲律宾 BSP 持牌）和 Birbank
              Invest / Pasha Capital（阿塞拜疆），它们用 Alpaca 的 Broker API 给银行产品增加投资轨道。第三，加密交易所和多资产平台是最具战略意义的新细分，由 Kraken（美国股票 +
              xStocks 代币化）和 Binance（2026 年 6 月 1 日面向 300M+ 全球用户上线）支撑。第四，财富平台和 robo-advisors 包括 Sarwa（阿联酋，自 2021
              年起）、BridgeWise（AI 洞察）、Vesto（西班牙 / 安道尔）和 Musaffa（全球 Shariah 合规）。第五，机构和 broker-dealer 伙伴以 SBI
              Securities（日本最大线上券商）和 Alpaca 的日本券商实体（AlpacaJapan）为代表。


              地理上，伙伴基础覆盖北美（Composer、Manzil）、东南亚（Dime!、Gotrade、GoTyme Bank）、日本（SBI Securities、AlpacaJapan）、中东和
              GCC（Sarwa、ZAD、CUSP Wealth）、非洲（Raenest、PandaPanda）、LATAM（Bitso、trii、Zesty）、欧洲（Vesto、Birbank，以及 WealthKernel
              之后的 Alpaca Europe），并通过加密交易所在全球覆盖（Kraken、Binance、Bitget）。40+ 国家数字得到多份独立新闻稿佐证；300+
              组织的构成与案例研究组合大体一致，但完整名单未公开披露。61,000 MAD 开发者指标和 300+ 伙伴数字是公司自称，未经独立审计。
