  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、既有玩家、相邻 rails、替代方案与内部自建
        blocks:
          - type: paragraph
            body: >-
              理解 Alpaca 的竞争格局，最好把 API 优先券商基础设施公司，与把 API 作为附加功能的零售券商分开。前一类——DriveWealth、 Apex Fintech Solutions 和
              Tradier——是真正的 B2B 同业，都在搭建同一类嵌入式投资 rails。后一类——Interactive Brokers、 Saxo Bank 和 Schwab
              Institutional——拥有深厚交易基础设施和全球触达，但并非按 API 优先 B2B 平台设计。Zero Hash 处在相邻赛道： 它是领先的加密和 stablecoin 基础设施提供商，正在扩展的
              tokenization 业务与 Alpaca 的 Instant Tokenization Network 直接重叠。 现状方案和内部自建仍是有意义的替代：大型 fintech 或银行可以申请 FINRA
              会员资格，取得 DTCC/OCC 清算会员资格（需要大量监管资本和运营建设）， 并运营自己的券商栈，但这条路需要多年时间和数千万美元资本与合规投入。

              DriveWealth 和 Alpaca 是全球 API 优先券商基础设施领域最直接的竞争者。两家公司都注册为 FINRA 会员、自清算，并从成立之初就服务第三方 fintech 应用。两者都采用 B2B2C
              模式：合作伙伴拥有终端客户关系，Alpaca 或 DriveWealth 拥有其下方的监管、清算和托管栈。Apex Fintech Solutions 按账户数（22M+）和
              AUC（$200B+）是美国占主导地位的清算与托管基础设施提供商，但其主营业务是机构和 RIA 托管及清算；历史上服务的是成熟 broker-dealer 和财富管理人，而不是轻量 API 优先
              fintech。Tradier 定位为美国股票和期权中最便于开发者接入的选择，公开定价透明，并有 100+ 集成；但它不是自清算（通过 Apex 清算），也不覆盖加密、固定收益或
              tokenization。Interactive Brokers 是机构级既有玩家，收入基数超过 $10B，全球多资产触达很强；但本质上是带 API 接入的自助券商，而非纯基础设施提供商。

              Zero Hash 的相邻威胁正在增长：IBKR 本身既是 Zero Hash 投资人，也是客户，使用 Zero Hash 基础设施为自身客户提供 24/7 stablecoin
              融资和加密服务。如果加密与股票基础设施的边界继续模糊，由 IBKR、Morgan Stanley、Apollo 和 SoFi 支持的 Zero Hash，代表一条资本充足、进入相邻 rails 的路径，可能与
              Alpaca 的 tokenization 领导地位竞争。欧洲市场又增加一层竞争维度：Alpaca Europe（原 WealthKernel）如今要与 Upvest、FNZ、Seccl 和 Third
              Financial 争夺英国和欧盟 embedded investment infrastructure mandate。
