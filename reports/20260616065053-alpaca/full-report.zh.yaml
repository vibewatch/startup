      - number: '3.4'
        title: 能力、定价、分销与信任对比
        blocks:
          - type: paragraph
            body: >-
              把 Alpaca 放到关键采购标准下和同业对比，结论是：差异化清楚，但拼图并不完整。 自清算深度上，Alpaca 属于少数派：纯 API-first 平台里，只有 DriveWealth 也做自清算。Apex
              通过 Apex Clearing 品牌自清算，但主要服务 RIA 和券商，而不是 API-first 金融科技市场。IBKR 的自清算规模极大，但核心定位不是 B2B 基础设施商。Tradier
              不自清算。Saxo 不向第三方提供美国股票清算即服务。资产覆盖才是 Alpaca 最突出的差异点：股票、ETF、多腿期权、美国国债、加密资产和代币化股票都塞进同一个 API；其他纯 B2B API
              基础设施商还没有拼出这组能力。DriveWealth 覆盖股票和碎股，但固定收益和期权深度不足。Apex 的机构资产范围更广，却不是面向金融科技公司的 API-first 平台。Zero Hash
              覆盖加密和代币化，但不做传统股票清算。IBKR 覆盖所有资产类别，但定价复杂度只适合企业客户。

              地理覆盖是第二个差异点。Alpaca 用单一 API 服务 40+ 个国家（Alpaca Europe 补上英国 / 欧盟监管深度），DriveWealth 则在 150+ 个国家提供碎股服务。Tradier
              只在美国。Saxo 覆盖 170+ 个国家，但并不聚焦为第三方金融科技公司提供美国股票清算。

              定价透明度反而是 Alpaca 的负向差异点。这个赛道里，Tradier 是唯一公布完整零售价目表的主要竞争对手——股票免佣、免费层期权 $0.35/contract、Pro $10/month、Pro Plus
              $35/month。其他企业级 B2B 基础设施商——Alpaca、DriveWealth、Apex 和 Saxo——都需要销售定制谈判，也不公布企业定价。这种不透明更像行业常态，不是 Alpaca
              独有弱点，但它给竞争尽调留下了证据缺口。

              监管信任姿态上，Alpaca 带着 2024 年 9 月 SEC 对其离线通讯的处罚（$400K，后续通过 FINRA SD-2436 延续批准解决），这是有记录的合规瑕疵；DriveWealth 和 Apex
              披露记录更干净，尽管 Apex 私有化所有权限制了外部审视。Synapse 之后，中介层的监管可信度已经成为合作伙伴尽调的真实因素。开发者工具是 Alpaca 最强的非监管差异点：公开 REST +
              WebSocket API、Python 和 JavaScript SDK、完整文档、模拟交易沙盒、61,000 MAD 开发者社区组合起来，让 Alpaca 成为开发者最容易上手的 API
              券商；IBKR、Apex 和 Saxo 没有用同样低摩擦方式复制这项能力。
