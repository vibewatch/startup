        - 需要接入 FICC 的主经纪商；最低名义金额高
        - 通过 Broker API 提供 Fixed Income，并由 FICC 清算
        - 直接接入 T-bill 和公司债；价格来自流动性聚合，可实时定价
        - ET 9:30–4:00 PM 之外的债券订单会排队；零碎债券尚不可用
      - - 在美国股票上运行 24/7 自动交易策略
        - 受限于交易所时段（9:30 AM–4:00 PM），或需要昂贵的 ATS 接入
        - Trading API，配套 24/5 BOATS 隔夜时段
        - 接近全天候接入；同一套 API 表面，仅有少量参数变化
        - 隔夜仅限限价单；流动性更低、点差更宽；免费计划不提供 BOATS
      - - 面向全球 DeFi 用户发行代币化美国股票
        - 从零搭建托管基础设施，或使用未受监管的离岸结构
        - Instant Tokenization Network，通过 Alpaca Crypto LLC 实物铸造 / 赎回
        - API 驱动的 24/7 铸造；连接 Solana；与成熟合作伙伴合计 $480M+ AUC
        - 代币化资产不赋予直接所有权；作为第三方代币化，其监管处理仍受 SEC 审查
      - - 给闲置客户现金增加被动收益
        - 传统券商现金赚取货币市场利率；没有独立银行账户就没有 FDIC
        - High-Yield Cash API，将现金扫入项目银行并获得 FDIC 保险
        - 最高 3.30% APY；最高 $2.5M FDIC；可作为流动购买力
        - 仅面向非 PDT 用户；APY 可变；银行名单可能变化
    notes: 工作流表依据公开记录的产品能力和合作伙伴集成场景。收入和单位经济数据依据已披露条款（如 Binance 合作）；其他合作伙伴经济性未公开。
