              Alpaca 监管历史上最重要的负面事件。尽管 FINRA 在审查 Alpaca 整改后，于 2025 年 3 月通过 SD-2436
              批准其继续保留会员资格，强化监管监督仍在持续。潜在机构合作伙伴和投资人应在标准交易对手尽调中，同时审阅这两起监管事件—— BrokerCheck 确认 Disclosure Event count: 2。
