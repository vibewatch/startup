      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              Alpaca 由 Yoshi Yokokawa 和 Hitoshi Harada 共同创立，两人均为日本籍，后来迁往 Silicon Valley 创业。 Yokokawa 担任
              CEO，此前曾在美国和日本做投资银行家（包括 Lehman Brothers）；一段个人算法日内交易经历让他强烈感受到 零售券商工具不足，随后转向创业。自公司创立以来，他一直是 Alpaca
              主要公开发言人和战略驱动者。Hitoshi Harada 担任 Chief Product Officer（CPO），负责 Alpaca 的 API 产品架构；两位创始人仍深度参与运营。2026 年 1 月
              Series D 融资时，领投方 Drive Capital 的联合创始人兼合伙人 Chris Olsen 加入 Alpaca Board of Directors，
              成为本轮唯一公开确认的董事会层级新增成员。2026 年 4 月收购 WealthKernel 后，Karan Shanmugarajah（前 WealthKernel CEO）被任命为 Alpaca Europe
              CEO，负责公司英国和欧盟业务。除上述人士外，截至报告运行日，Alpaca 更广泛的 C-suite 和完整董事会构成未公开。Yokokawa 扎根日本金融的双重背景，加上 SBI Group、MUFG
              Innovation Partners、 Monex Ventures 以及持牌日本实体 AlpacaJapan Co. 等投资人与实体，为公司亚太增长抱负和在日本及更广泛东南亚获取机构分销伙伴的能力，
              构成有意义的战略差异化。
