      - number: '4.3'
        title: 资本结构、融资与 $40M 信贷额度
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月，Alpaca 完成 $150 million Series D 股权融资，由 Drive Capital 领投，投后估值 $1.15
              billion——公司因此进入独角兽行列，披露融资总额超过 $320 million。股权融资之外，公司还拿到 $40 million 信贷额度，用于在持续全球扩张期间强化资产负债表。投资方包括 Citadel
              Securities 和 DRW Venture Capital（两者都是与运营直接协同的做市商）、Opera Tech Ventures（BNP Paribas）、MUFG Innovation
              Partners、Kraken 和 Flat Capital；这份名单的战略构成，不仅指向财务投资，也指向机构分销关系。Series D
              资金用途包括：在关键司法辖区建立本地市场存在并取得新监管牌照，推进机构级交易能力，连接传统资产与代币化资产生态，并强化网络安全和平台韧性。


              $40 million 信贷额度是重要但高度不透明的金融工具。贷款方身份、利率、到期日、财务约束和抵押条款都未公开。承销视角下，它带来两类风险：第一，如果信贷额度以 Alpaca
              的清算基础设施或应收款作担保，可能与 SEC Rule 15c3-1
              下的净资本计算发生联动；第二，任何财务约束违约都可能在关键增长阶段限制运营灵活性。贷款方是谁——战略伙伴、现有商业银行，还是机构信贷提供方——以及利率相对基准的水平都未知，因此无法压力测试再融资风险。Series
              D 还伴随 Binance 通过股票交易合作取得 Alpaca 少数股权，这是额外治理考量。


              以自清算券商身份运营，并持有 DTCC、OCC、FICC 和 Nasdaq Exchange
              会员资格，资本强度很高。每项会员资格都要求持续缴纳准备基金、保留运营流动性缓冲，并具备规模化承受日内结算义务的能力。Series D 明显抬高了短期流动性，但在缺少现金消耗披露的情况下，Alpaca
              能否不再融资就持续支撑自清算运营——尤其账户和交易量放大之后——仍未知。
