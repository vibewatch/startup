      - number: '3.5'
        title: 转换成本、多平台接入、护城河耐久性与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的竞争护城河靠四个机制互相加固：监管基础设施深度（完整美国清算栈）、技术集成锁定、多资产覆盖，以及代币化生态主导地位。金融科技合作伙伴从 Alpaca 迁到竞争对手，转换成本不低：要重做完整开户和
              KYC 流程，重测订单管理和清算集成，迁移既有客户账户（可能需要 ACAT 流程），重新谈监管合规文件，还要承受潜在停机。已经有大规模用户基础的伙伴（例如拥有数十万活跃账户的
              App），短期内几乎迁不动。新伙伴则不同，尤其还在构思或早期开发阶段时，多平台接入（例如同时接 Alpaca 和 DriveWealth）技术上可行，也会在获客阶段制造竞争压力。

              代币化护城河是 Alpaca 位置里最不对称、也最新的部分。Alpaca 称，截至 2025 年 Instant Tokenization Network 发布时，公司在代币化美国股票托管中的市场份额约
              94%，主要代币发行方（Ondo Finance、Dinari、Backed/xStocks、Kraken）都把 Alpaca 用作底层美国证券托管方。网络效应由此形成：越多代币化平台依赖
              Alpaca，代币化股票市场就越像在为 Alpaca 的基础设施背书。但这种集中也是系统性风险：一旦 Alpaca
              遇到监管变化、技术故障或财务压力，所有下游代币化平台会同时受影响，系统性交易对手暴露过于集中，监管方最终可能要求分散。

              负面证据和护城河威胁有五点。第一，资产负债表不对称。IBKR 2025 年收入 $10.22B；Alpaca 是估值
              $1.15B、未披露收入的独角兽。现有巨头可以靠内部现金流支撑价格战、监管投入和产品扩张，节奏是 Alpaca 追不上的。第二，DriveWealth 在欧盟的监管扩张（2024 年 Bank of
              Lithuania MiFID II）意味着 Alpaca Europe 会在最重要的新区域面对直接 API-first 竞争对手。第三，Synapse 倒闭引发了广泛的 BaaS
              信任问题，波及整个嵌入式券商板块。Alpaca 持有自己的 FINRA 会员资格并自清算（不同于依赖发起银行的
              Synapse），但行业观感受损是真实的；合规敏感型伙伴现在会更深入审查中介交易对手风险。第四，伙伴集中：Alpaca 的批发 B2B
              模型意味着收入很可能集中在少数高交易量伙伴；流失一两个头部伙伴会造成不成比例的冲击。第五，Apex 与 State Street
              的合作在机构和财富管理清算市场造出一个资本充足的竞争对手，可能把更高端的金融科技客户拉向 Apex/State Street 联合基础设施。

              即便有这些风险，Alpaca 在 2–4 年维度的护城河耐久性仍高于平均：自清算基础设施、代币化托管主导地位、多资产覆盖，以及通过 Alpaca Europe
              扩张欧洲，让它相对任何单一竞争对手都有实质差异。关键变量是：在 Alpaca 把 $150M Series D 资金投向进一步自清算和产品扩张之前，DriveWealth
              或资本充足的新进入者能否补上代币化和多资产差距。
