      - number: '8.3'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              Alpaca 情景分析需要用区间承销，而不是点估计，因为绝对收入、毛利率、烧钱速度和 NRR 都未披露。基于公开可得证据，以及对金融科技基础设施经济学的第一性原理假设，三个情景框定了现实结果区间。


              牛市情景下，Alpaca 到 2027 年仍能保持 50% 以上年收入增长，达到 $200M+ ARR。自清算红利继续推动毛利率向 40%+ 复合改善，WealthKernel
              欧洲整合增加新的收入地域，代币化成为有意义的增量收入流。随着新合作伙伴（银行、交易所、企业金融科技公司）扩大账户活动，Binance 合作伙伴集中度被稀释。若退出倍数为 12–18x——与
              IBKR、主要交易所集团或寻求券商基础设施的大型银行进行战略收购相一致——隐含企业价值为 $2.4B–$3.6B。相对于 $1.15B 进入估值，这意味着稀释前回报为
              2.1–3.1x，但取决于未公开披露的股权结构条款。


              基准情景下，随着合作伙伴基础扩大、较小合作伙伴贡献的增量账户增长慢于早期 cohort，收入增速降至 25–35%。Alpaca 到 2027 年达到 $150M ARR，毛利率改善但仍低于 35%，原因是
              Binance 在 PFOF 和借贷上的收入分成削减。自清算利润率被 WealthKernel 整合成本部分抵消。随着公司接近盈利而非在持有期内实现盈利，退出倍数压缩至 8–12x。隐含企业价值为
              $1.2B–$1.8B，相比当前 $1.15B 估值为持平至小幅上行，且未计入稀释。该情景意味着多数机构成长投资者的回报低于门槛。


              熊市情景下，收入增速因 Binance 受扰（针对 Binance 的监管行动、经济条款重谈，或 Binance 自建基础设施）、美国或关键国际市场的 PFOF 监管变化，或合作伙伴流失而降至 20%
              以下。2027 年 ARR 停滞在 $100M–$120M。增长低于平均水平且监管不确定性持续时，退出倍数压缩至 5–7x，与成熟基础设施资产的 M&A 成交区间一致。隐含价值为
              $500M–$840M，显著低于当前 $1.15B 进入价格，并构成 Series D cohort 的 down-round 情景。
            claimRefs:
