  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 机制
      - 单位 / 当前定价
      - 收入质量
      - 尽调问题
    rows:
      - - 订单流支付（PFOF）
        - Alpaca 将客户订单路由给做市商，做市商为执行权付费
        - 可变；做市商按股 / 合约设定返佣
        - 中——机制可见，但欧盟已禁、SEC 正在审视；Binance 来源账户的合作伙伴分成占 50%
        - 量化 PFOF 占总收入的百分比；按地区披露；建模 PFOF 归零情景
      - - API / 平台费（Broker API）
        - B2B fintech 和机构合作伙伴为 Broker API 准入、入驻和基础设施使用付费
        - 合同 / 企业定价未公开披露
        - 中——经常性 B2B 收入，但无公开费率卡或 NRR 数据
        - 披露 API 费率结构、最低合同额、交易量阶梯和合作伙伴 NRR
      - - 保证金利息收入
        - 客户用保证金交易时，Alpaca 对借入资金收取利息
        - 每笔交易 6.25%（公开披露费率）
        - 中——与保证金余额挂钩的稳定收益收入；费率有竞争力
        - 披露保证金余额总额和净保证金收益率
      - - 全额支付证券借贷（FPSL）
        - Alpaca 将客户全额支付证券借给卖空方，赚取借贷费收入
        - 费用由证券借贷市场决定；Binance 账户的剩余利润由 Binance 分走 65%
        - 中——收入有意义；但 Binance 来源账户被显著稀释
        - 汇总披露 FPSL 收入、利用率和合作伙伴收入分成条款
      - - 高收益现金扫款利差
        - Alpaca 将客户未投资现金扫入 FDIC 项目银行，并从存款余额中赚取利差
        - 利差率未公开披露；扫款项目已运营
        - 低–中——基于利差、对利率敏感；稳定但与利率周期相关
        - 披露利差率、扫款余额和项目银行关系
      - - 加密货币 Maker-Taker 费用
        - 加密货币交易采用 maker-taker 费率表；按交易量分层
        - 最低层 maker 0.15% / taker 0.25%（公开披露）
        - 中——直接手续费收入；比 PFOF 更透明，但要与零手续费交易所竞争
        - 披露加密货币交易量和手续费收益率
      - - 监管转嫁费用
        - 强制性 SEC、FINRA 和 OCC 费用汇给监管机构；Alpaca 不留存
        - SEC Section 31：每 $1M 卖出本金 $20.60（截至 2026 年 4 月）；FINRA TAF：$0.000195/share
        - N/A——成本转嫁，不是利润中心
        - 确认费率表准确性和监管义务范围
    notes: >-
      收入质量评级是基于公开证据和分析师估计，对 Alpaca 作出的专项判断；没有可用的审计收入结构。Binance 收入分成条款（PFOF 50%、扣除用户利息后的借贷利润 65%）仅适用于 Binance 来源账户，未必代表非
      Binance 合作伙伴账户的经济性。
