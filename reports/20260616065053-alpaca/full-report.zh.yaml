        - 零售券商佣金、做市商价差、终端投资者直接支付的 DTC 费用
        - 金融科技应用、neobank（付款方）；零售终端投资者（用户）
        - 主市场 — 面向股票、ETF、期权、固定收益的 Broker API
      - - 零碎股交易基础设施
        - 零碎股订单路由、小于 1 美分结算、零碎股托管管理、综合账户管理
        - DTCC 整股托管、ETF 创建 / 赎回、机构主经纪业务
        - 金融科技应用和国际投资应用（付款方）；零售投资者（用户）
        - 核心产品 — 零碎股能力是全球零售采用的入场券
      - - 证券出借与 FPSL
        - 全额缴付证券出借收入分成、保证金融资浮存收益、再质押费用
        - 面向机构的主经纪保证金贷款、回购融资
        - 向用户开放证券出借的金融科技伙伴
        - 增长中产品 — Alpaca 于 2025 年推出 FPSL
      - - 代币化基础设施
        - ITN 铸造 / 赎回费、代币化股票托管支持、代币化交易结算
        - 加密交易所现货交易费、区块链 gas 费、稳定币发行
        - DeFi 协议、非美国加密交易所、代币化平台（付款方）；加密原生投资者（用户）
        - 相邻且快速增长 — Alpaca ITN 于 2025 年 10 月推出
      - - 高收益现金 / sweep 计划
