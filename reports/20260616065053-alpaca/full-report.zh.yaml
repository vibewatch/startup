  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值锚
        blocks:
          - type: paragraph
            body: >-
              Alpaca 2026 年 1 月 Series D 确定了 $1.15B 的投后独角兽估值，并完成 $150M 新股权融资，同时获得 $40M 信贷额度。本轮由 Drive Capital 领投；Drive
              Capital 是成长阶段投资机构，在金融科技基础设施领域有投资记录。共同投资方超过 27 家，包括 Citadel Securities、BNP Paribas 的 Opera Tech
              Ventures、MUFG Innovation Partners、Kraken 和 DRW Venture Capital。投资人名单的战略广度说明，直接理解券商经济学的成熟机构参与者在 2026 年 1
              月以独角兽规模为公司定价。这一证据构成本分析的起始估值锚。


              以 $1.15B 估值对照 Sacra 2025 年 9 月估计的 $100M ARR——公司自身也称 Series D 前一段时间收入同比「翻倍以上」，为该数字提供佐证——隐含收入倍数约为 Sacra 数字的
              11.5x；如果 ARR 轨迹到 2026 年 1 月继续增至 $120–130M，则约为 8.9–9.6x。两种读数都把 Alpaca 放在高增长私有金融科技基础设施区间，而不是泡沫时代极端水平。Series
              D 验证了产品市场契合、合作伙伴广度（300 多家组织、40 多个国家），以及 DTCC、OCC、FICC 会员资格带来的自清算红利；后者通过去掉第三方清算成本，结构性改善单位经济。


              建议立场是继续研究，置信度中等，估值标签为偏高。这里的偏高并不意味着价格明显糟糕；它反映的是私营公司不透明，无法确认支撑买入判断所需的证据。缺少经审计财务、毛利率数据、NRR、烧钱轨迹和股权结构细节时，纪律严明的投资者无法判断当前价格是公平进入点还是定价过高。本建议将在以下条件被确认后上调至买入：ARR
              高于 $120M、毛利率高于 35%、NRR 高于 110%、Binance 集中度低于总收入的 25%。
