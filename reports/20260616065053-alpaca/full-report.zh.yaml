      - number: '1.6'
        title: 图表
        blocks:
          - type: callout
            title: 自清算基础设施构成持久护城河
            body: >-
              Alpaca 完成覆盖 DTCC（股票）、OCC（期权）和 FICC（美国国债）的全面自清算转型，并叠加 Nasdaq Exchange Member 身份； 以其规模的 fintech
              公司而言，这是一项罕见且资本密集的监管成就。自清算让 Alpaca 不依赖 correspondent brokers，
              就能向合作伙伴提供更快交易处理、实时交易后可见性和可定制工作流，形成结构性成本与能力优势；纯 API 竞争者若没有同等监管投入和资本承诺， 很难复制。
