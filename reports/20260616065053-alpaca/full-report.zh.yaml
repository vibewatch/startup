        - Binance 退出、把经济条款重新谈到 PFOF 分成低于 50%，或遭遇影响账户的美国监管关停
        - 可能最大收入伙伴消失；收入结构性缺口；下轮估值承压
        - 立即复核覆盖；若中断确认，下调至回避
      - - 美国禁止或严限 PFOF
        - SEC 最终规则取消或限制交易所上市股票的 PFOF
        - 主要收入流被切断；被迫转向佣金模式，单笔交易变现更低
        - 剔除 PFOF 重新承保；建模纯 API 费 + 保证金 + 借券收入
      - - 经审计 FY2025 财务确认 ARR 低于 $100M
        - 经审计收入比 Sacra $100M 估算低 15% 以上
        - Sacra 估算偏高；隐含倍数上升；增长论点受损
        - 下调至回避；论点依赖增长轨迹验证
      - - 毛利率确认低于 25%
        - FY2025 经审计毛利率低于 25%
        - 自清算红利未体现；Binance 折让超过清算节省
        - 重新评估单位经济；按净利润率口径重算倍数
      - - 监管牌照丢失或暂停
        - FINRA、SEC 或国际监管机构暂停 Alpaca 的券商交易商或清算牌照
        - 运营关停；论点不可逆破裂
        - 立即回避；监管全面恢复前不再进入
    notes: 触发器是情景条件，不是当前观察。依据来自第 4、6、7 章的证据和已公开确认的监管事件。阈值偏保守； 实际投委会可能设定不同触发水平。
    claimRefs:
      - CV032
      - CV033
      - CV035
      - CV042
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - FY2024 和 FY2025 经审计收入、毛利率、经营亏损 / 收益和现金
        - 没有经审计数字，ARR 和利润率估算只是第三方推断，误差带约 ±30%
        - 公司管理层；数据室请求；四大会计师事务所审计报告
      - - 按伙伴队列划分的 NRR
        - 按伙伴批次和地区划分的净收入留存率
        - NRR >110% 验证扩张；NRR <100% 表明已安装基础流失或收缩
        - 公司管理层；数据室队列分析
      - - Binance 集中度和条款
        - Alpaca ARR 中 Binance 账户贡献的精确占比；Binance 收入分成协议完整条款
        - Binance 获得 50% PFOF + 65% 借券利润；若占 ARR >25%，混合经济性会压低倍数
        - 公司管理层 + Binance 合作协议审阅
      - - 股权结构和优先权负担
        - 当前股权结构，包括优先权层级、反稀释条款和清算瀑布
        - 九轮融资加 $40M 信贷额度可能形成优先权负担，压低普通股有效价值
        - 公司管理层；数据室股权结构模型
      - - 信贷额度条款
        - $40M 信贷额度：贷款方、利率、到期日、契约、担保
        - 限制性契约或高利率债务会约束经营灵活性，并损害股权价值
        - 公司管理层；信贷协议审阅
      - - WealthKernel 整合成本和欧盟 ARR
        - WealthKernel 作为 Alpaca Europe 带来的整合支出、时间表和新增欧盟收入
        - 判断欧洲扩张能否快速增加 ARR，还是会多年拖累利润率
        - 公司管理层；Alpaca Europe 收入预测
      - - 代币化收入管线
        - 当前代币化收入运行率，以及按客户划分的管线
        - 代币化被列为战略差异点；若收入为零，倍数只能靠核心 API 经济性支撑
        - 公司管理层；代币化伙伴合同
    notes: 尽调问题按 $1.15B 入场价格的重要性排序。第 1–4 项是买入建议的阻断项。第 5–7 项重要，但单独不足以阻断。 承诺前应在数据室流程中审阅所有项目。
    claimRefs:
      - CV035
      - CV044
      - CV032
      - CV026
      - CV038
      - CV045
