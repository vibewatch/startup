              Binance 服务 3 亿全球用户——是当前 900 万个 Alpaca 支撑账户基数的 33 倍以上。如果 Binance 的美国股票功能在其用户群中达到哪怕 3–5% 的渗透率，单一合作伙伴就会在
              Alpaca 基础设施上产生 900–1500 万个账户，形成极端集中度。再加上 Binance 部分披露的收入分成条款和少数股权，这一合作可能在 12–24 个月内成为 Alpaca
