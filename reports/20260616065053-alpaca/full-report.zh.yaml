      - number: '4.2'
        title: 单位经济与自清算红利
        blocks:
          - type: paragraph
            body: >-
              Alpaca 转向完整自清算，是单位经济改善的核心驱动。2024 年拿到 DTCC 批准之前，Alpaca 需要向第三方清算公司按笔支付清算费；这家公司会拿走本应归 Alpaca
              的保证金融资和证券借贷经济性中的相当一部分。加入 DTCC（股票清算）、OCC（期权清算，2025 年 8 月获批）和 FICC（国债与回购，2025 年 8 月获批）后，Alpaca
              现在掌控完整交易生命周期——执行、清算、结算和托管——并留存每笔交易的完整经济价值。清算功能内化后，过去付给外部清算商的按笔费用被消除，Alpaca 也能直接捕捉保证金融资利息和证券借贷收入。


              Interactive Brokers 的战略参照展示了完整自清算在规模化后的潜在利润率上行空间。IBKR 是成熟的自清算全球券商，2024 年 Q4 税前利润率 75%，当季佣金收入 $477
              million（交易量提升带动同比增长 37%），FY2024 净利息收入 $3.1 billion——这是它的主导收入线，同比增 13%。到 FY2025，IBKR 总收入达到 $6.2
              billion，税前利润率稳定在约 77%，说明成熟、自清算、多资产全球券商能跑到什么水平。Robinhood 的路径提供了另一组参照：2021 年，其净收入超过 77% 来自 PFOF；到
              FY2024，Robinhood 已经多元化，总收入达到 $2.95 billion（同比增长 58%），但摆脱 PFOF 依赖需要大量再投资和产品扩张。Alpaca 能否复制 IBKR
              式利润率效率，取决于交易量增长速度、伙伴多元化，以及合规、技术和清算运营上的成本纪律。


              Alpaca 的自清算成本结构包括合规和法律开销、自研 Universal Transaction System 清算平台运营、市场数据订阅、面向伙伴的客户支持、SEC Rules 15c3-1 和 15c3-3
              下的监管资本储备、ACH / 电汇 / FDIC 扫存项目的银行和支付连接，以及 DTCC、OCC、FICC 和 Nasdaq Exchange 的持续清算所会员费。这套架构用 Flatbuffers
              做零拷贝数据交换、用 Redpanda 做高吞吐消息，体现了公司有意投入技术以压低单位运营成本。作为基准，IBKR 仅 2024 年 Q4 的执行、清算和分销费用就达到 $115
              million，说明即便是高效率运营商，清算成本管理仍然关键。
