      - number: '7.3'
        title: 财务、合作伙伴与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的财务风险画像实质上不透明。作为私营公司，AlpacaDB, Inc. 不发布合并利润表、利润率或单位经济。第三方估计 Alpaca 年化收入在 $66–100M
              区间，但该数字未经验证，底层模型（PFOF、保证金利息、API 接入费）从未公开拆分。烧钱速度和自由现金流状况也未披露。2026 年 1 月募集的 $150M Series D 以及另行提到的 $40M
              信贷额度，提供了营运资本可见度；但信贷额度条款——贷款方身份、利率、契约包和交叉违约触发条件——均未披露，给任何试图评估财务困境风险的合作伙伴或投资者留下尽调缺口。


              broker-dealer 子公司（Alpaca Securities LLC）截至 2025 年 6 月 30 日净资本为 $41.47M，比 $648K 的最低要求高出
              $40.82M。虽然这一超额看似充足，但相对于被清算的客户资产规模，$648K 的最低净资本要求极低，说明监管最低净资本可能不足以衡量运营风险资本。2025 年年度审计由 Grant Thornton LLP
              编制，并以 Form X-17A-5 提交（2026 年 2 月 27 日，期间截至 2025 年 12 月 31 日），为 broker-dealer 实体的财务状况提供了独立验证，但不覆盖合并母公司
              AlpacaDB。


              合作伙伴集中度是最显性的财务风险。Kraken 合作（美国股票和 xStocks 代币化）与 Binance 合作（2026 年 6 月 1 日上线，面向 3 亿多全球用户）合计很可能占 Alpaca 总交易量和
              API 使用量的主导份额。SBI Securities（日本最大线上券商）又叠加第三个超级合作伙伴层。公开市场没有披露任何集中度数据，但合作模式——Alpaca CEO Yoshi Yokokawa 在
              Series D 公告中将 Kraken 和 Binance 描述为核心关系——暗示前 2–3 家合作伙伴很可能贡献绝大部分清算流。任何一个合作伙伴因合同不续约、竞争替代、监管撤销授权（例如 Binance
              持续面对的全球监管复杂性）或技术失败而流失，都可能带来台阶式收入冲击，超过 Alpaca 从 Series D 获得的估计 runway。


              国际扩张执行风险也需要审视。Alpaca 目前覆盖 40 多个国家，Series D
              也被明确描述为用于继续国际扩张的资本。进入新的券商市场，需要在每个司法辖区满足本地牌照、资本充足率、数据本地化合规和运营基础设施要求。美国运营中已经出现的监督失败记录，无法让人相信这些新市场监管要求会在没有进一步执法风险的情况下得到满足。
