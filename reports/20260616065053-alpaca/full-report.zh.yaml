      - number: '6.4'
        title: 客户价值主张：合作伙伴为何选择 Alpaca
        blocks:
          - type: paragraph
            body: >-
              Alpaca 给 B2B 合作伙伴提供的核心客户价值，是用合规、自清算的券商基础设施缩短上市时间；如果合作伙伴自建，通常需要数千万美元和数年时间。具体而言，合作伙伴获得：（1）一家受监管的美国
              broker-dealer（FINRA/SIPC 成员，拥有 DTCC/OCC/FICC 清算会员资格和 Nasdaq Exchange Member 身份），无需自行取得并运营 broker-dealer
              牌照；（2）覆盖美国股票、ETF、期权、固定收益、加密资产和代币化证券的多资产 API，一次集成即可接入；（3）碎股和名义金额交易（让 Dime! 这类平台能提供 $1.50 起投）；（4）自清算托管，去掉对
              correspondent broker 的依赖；（5）开发者优先的 API 表面，支持 OAuth、REST、WebSocket、FIX，以及 Python、JavaScript、Go 等
              SDK，使集成周期从数月压缩到数周。


              合作伙伴用很具体的语言解释价值。Dime! CPO Chattrin Laksanabunsong 提到三项主要决策标准：低最低成本、碎股交易、简化 W-8BEN 税表申报——这些都是 Alpaca
              原生提供的能力。Sarwa CTO Jad Sayegh 强调了通过 SSE 事件自动批准开户，以及实时市场数据集成。ZAD 联合创始人 Abdullah Alotaibi 指出，Alpaca
              愿意创新符合伊斯兰教法的保证金产品（资产支持而非计息），而不是提供通用现成产品。Binance 选择 Alpaca，是因为其「基于 API 的灵活性、产品多样性和能力，以及集成便利」。


              BrokerChooser 和 AlgoPlatforms 的评测（视角来自开发者 / 交易者，而非合作伙伴）也佐证了 API 质量：BrokerChooser 给 Alpaca 总体评分
              4.1/5，并将其评为「2026 年最佳算法交易券商」；AlgoPlatforms 则称 Alpaca 的模拟交易环境、高速率限制和 SDK 质量属于同类最佳。独立评测一致指出客户支持是弱项——Alpaca
              主要依赖社区论坛和 GitHub 解决问题，而不是专门的人工支持——这会给需要运营支持的非开发者合作伙伴带来摩擦。


              伊斯兰金融垂直领域已经形成一个有辨识度的用例集群。Alpaca 现在已经支持符合伊斯兰教法的即时入金、保证金交易（资产支持）、期权交易和高收益现金账户（类似 sukuk 的
              sweep）。ZAD（科威特）、Manzil（美国）和 Musaffa（全球）等合作伙伴代表了一个 Alpaca 已经搭出差异化基础设施的细分市场——符合伊斯兰教法的
              Brokerage-as-a-Service——几乎没有竞争对手提供同类能力。Alpaca 明确表示，该保证金产品「可扩展到其他伊斯兰地区」，暗示其在东南亚、非洲和更多 GCC 市场有可复制打法。
