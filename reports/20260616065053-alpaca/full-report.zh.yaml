      - number: '1.5'
        title: 关键里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              Alpaca 的历史里，创立、融资、产品和监管里程碑密集，同时也有一起重要负面事件。2015 年创立、早期 MarketStore 工作、 2018 年免佣券商 API 上线，奠定了公司的工程 DNA
              和开发者优先身份。2019 年初加入 YC W19，为公司带来加速器背书和网络资源。 2021 年 Series B 是 Alpaca 第一轮重要机构融资，并触发 B2B2C 快速扩张——账户数从 2020
              年底接近零增长到 2021 年中超过 100,000。2023 年获得 DTCC 批准、2024 年完全转向自清算，是关键运营里程碑，让 Alpaca 无需 correspondent brokers，
              就能在内部管理完整交易生命周期。2025 年，Alpaca 获得 OCC 和 FICC 会员资格（完成股票、期权和美国国债覆盖），成为 Nasdaq Exchange
              Member，并推出期权、全额付清证券借贷、固定收益和 24/5 交易等几项重要产品。2026 年 4 月收购 WealthKernel——并更名为 Alpaca Europe——且 Xetra 首日上线，标志
              Alpaca 正式进入欧洲市场。Alpaca 记录中最主要的负面事件是 2024 年 9 月 24 日 SEC 命令（Exchange Act Release No. 101137）：SEC 认定 Alpaca
              Securities LLC 自 2022 年 5 月起未保存 off-channel 通信，主管人员使用个人设备违反公司政策，故意违反 Exchange Act Section 17(a) 和 Rule
              17a-4(b)(4)。SEC 对 Alpaca 予以谴责，要求其停止并纠正，并处以 $400,000 民事罚款。FINRA 随后在 2025 年 3 月 6 日发布 Membership Continuance
              Notice SD-2436，尽管存在由此产生的 statutory disqualification，仍批准其继续保持 FINRA 会员资格—— 这确认监管方认为整改充分。Alpaca
              在命令发布前已加强合规控制、调整政策，并部署通信技术。
