      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 范围分歧使 TAM 比较必须先对齐边界
            body: >-
              可信分析机构发布的 2026 年 embedded finance TAM 估算从 $115B 到 $185B+ 不等。4–5× 差距几乎完全由范围定义驱动： 高端口径纳入所有 embedded finance
              子板块，低端口径可能只限制在特定垂直领域。投资人应以零股基础设施市场（2025 年 $4.8B）作为最能直接对照 Alpaca 当前费用收入的规模锚点；同时把更宽的 embedded finance
              市场视为长期机会天花板，前提是 Alpaca 的基础设施栈能捕获相邻类别。
            calloutType: insight
            claimRefs:
              - CM038
              - CM042
          - type: callout
            title: 中国 CSRC 打击剔除重要跨境股票细分市场
            body: >-
              2026 年 5 月 22 日，CSRC 对 Futu Securities 和 Tiger Brokers 采取执法行动，并得到八个中国政府机构支持；这是 2026 年美国股票基础设施面临的最重要负面市场事件。
              约 100 万个中国大陆投资者账户将在两年内逐步清退，受影响资产估计为 HKD 200–250B，显著压缩可触达国际零售投资者基础。任何对中国大陆终端用户有重大敞口的 Alpaca 合作伙伴，都应被视为到
              2028 年增长前景下降。
            calloutType: risk
            claimRefs:
              - CM033
              - CM034
          - type: callout
            title: 自清算地位带来结构性收入与护城河优势
            body: >-
              Alpaca 在 2023 年获得 DTCC 批准，并于 2025 年扩展至 OCC 和 FICC 后取得自清算地位；这让公司能在内部捕获完整清算利润，而不是与第三方清算商分成。 这一结构性优势支持 Alpaca
              向合作伙伴提供更有竞争力的转嫁定价，也为仍是 introducing brokers 的竞争者设置了有意义的门槛。同一套自清算基础设施支撑 ITN tokenization 网络；若不是自清算
              introducing broker，要合规运营这一网络在经济上并不可行。
