      - number: '2.3'
        title: 买方分层与采用地图
        blocks:
          - type: paragraph
            body: >
              券商基础设施 API 市场沿两条主轴分层：应用类型（合作伙伴要搭建什么）和机构类型（受监管实体还是技术优先平台）。按合作伙伴数量看，最大细分是 fintech
              应用和新银行：面向消费者的平台把投资作为支付或银行之外的补充功能嵌入，以提升用户 ARPU、降低流失。这类买方通常由产品或工程 VP 主导， 采用 SaaS 式 API 费合同，动机来自嵌入式金融产品已验证的
              2–5× ARPU 提升。Apex Fintech Solutions 报告，截至 2026 年 2 月，其基础设施服务 200+ fintech 公司，资产超过 $235B；Coinbase 同期在
              “Everything Exchange” 平台上线美国股票交易（由 Apex 支撑）， 说明大型加密交易所已成为寻求传统股票 rails 的重要买方细分。


              DriveWealth 在全球服务 100+ fintech 合作伙伴，包括 Revolut、Block（原 Square）、Papara、MoneyLion、C6 Bank 和 Viva
              Republica，已显示三年收入 CAGR 超过 50%，从领先既有玩家角度确认市场增速。RIA 和财富管理平台构成第二个细分：它们需要 white-label
              券商基础设施，用于咨询工具中的模型组合执行和零股交易，合规官与 CTO 共同掌握预算。希望在投资功能上与新银行竞争的区域银行构成第三个细分。 国际投资应用——位于 Southeast Asia、Latin
              America、Middle East 和 Africa——构成第四个快速增长细分，寻求以传统 correspondent brokers 无法提供的成本和速度，合规接入美股。Robinhood 的 FY2025
              规模（28.4M 投资账户、$324B 平台资产、$4.5B 收入、52% YoY 增长）为券商基础设施客户试图服务的终端用户市场定锚。 tokenization
              买方细分——加密交易所（Kraken、Coinbase）、DeFi 协议，以及寻求 24/7 可交易美股映射的非美国 fintech——是一类独立且新兴的买方， xStocks 到 2025 年 12
              月合计交易量突破 $10B 即是例证。Interactive Brokers 作为既有玩家，为成熟买方和机构买方提供可通过 API 接入的券商服务， 覆盖 40+ 国家、3.8M 账户和 170+ 市场中心。
