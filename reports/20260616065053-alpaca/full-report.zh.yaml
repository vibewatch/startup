      - number: '3.2'
        title: 直接同业画像：DriveWealth、Apex Fintech、IBKR 与 Tradier
        blocks:
          - type: paragraph
            body: >-
              DriveWealth 创立于 2012 年，截至 2021 年 8 月 Series D 累计融资约 $569M，当时公司估值 $2.85B——这是纯 API 优先券商基础设施同业中披露的最高估值。
              其核心产品是零股 Brokerage-as-a-Service 平台，具备专利的按美元交易、API 驱动清算与托管，以及 NYSE Floor 执行接入。DriveWealth 的基础设施吸引了 100+ 全球
              fintech 合作伙伴，用于在多个大洲的数字钱包、新银行和 broker-dealer 应用中嵌入投资。2025 年 2 月与财富管理平台 OneVest 的合作， 把 DriveWealth
              触达延伸到咨询和组合管理工具。2024 年 Bank of Lithuania 牌照提供可在 30 个 EEA 国家 passport 的 MiFID II 覆盖， 通过 Alpaca Europe 与
              Alpaca 的欧洲野心直接竞争。DriveWealth 企业定价为定制且未披露，与 Alpaca 类似。相对 Alpaca，主要限制在于 DriveWealth 上一次主要融资是在 2021
              年，此后未公开宣布新的股权融资，引发对资产负债表轨迹的疑问；此外，其资产覆盖深度不包括固定收益、多腿期权或代币化股票， 难与 Alpaca 相当。

              Apex Fintech Solutions 由 PEAK6 Group 持有，按账户（22M+）和 AUC（$200B+）计，是美国最大的 pure-play B2B 清算和托管平台。 State Street
              Corporation——全球第二大托管机构，AUC/AUA 达 $49 trillion——于 2025 年入股 Apex 少数股权，验证 Apex 的机构可信度，
              并为其增加通往全球财富管理客户的渠道。Apex 于 2025 年推出 Apex Ascend 平台，这是实时云原生基础设施升级，覆盖开户、账本、订单管理、 智能订单路由、组合再平衡和云数据工具。Apex
              自清算（Apex Clearing 品牌），支持广泛资产范围，包括股票、ETF、期权、共同基金和另类资产。关键是， Tradier——Alpaca 的直接 API 竞争者——通过 Apex Clearing
              清算，使 Apex 成为 Tradier 下方的基础设施骨干。Apex 面向 Alpaca 目标细分的主要限制， 是它聚焦成熟 RIA 和 broker-dealer 客户，而非轻量 fintech API
              创业公司；同时缺少 Alpaca 的 tokenization 能力和国际 API 触达。

              Interactive Brokers 是更广生态中最强大的既有玩家。IBKR 2025 年净收入约 $10.22 billion（同比增长 9.73%），服务 200+ 国家 4.4M+ 客户账户。其
              API——REST Web API、FIX 和 TWS API——支持跨 170+ 市场的多资产交易，覆盖股票、期权、期货、FX、固定收益、加密和基金。 IBKR 运营 white-label 和
              introducing-broker 计划，broker-dealer 和 fintech 可借此提供品牌化平台，并通过 IBKR 基础设施执行和清算。 IBKR
              的竞争风险来自不对称规模和资产负债表：其机构级资本实力和多资产覆盖远超 Alpaca 当前足迹。不过，IBKR 在 B2B 基础设施意义上并非 API 优先；
              其主营仍是自助零售和机构交易，开发者体验和开户复杂度明显不如 Alpaca 顺滑。

              Tradier 是面向美国股票和期权最透明、最方便开发者接入的 API 券商。公开定价包括免费档股票免佣交易、期权 $0.35/contract，Pro 计划为 $10/month、提供无限期权交易，Pro
              Plus 计划为 $35/month、带期货接入。Tradier 提供 REST 和 WebSocket API，包含完整期权链数据 （包括 Greeks），支持 100+ 第三方平台集成，并使用 OAuth
              2.0 认证。它的限制是结构性的：Tradier 不是自清算（通过 Apex Clearing 清算）， 且只覆盖美国股票和期权，不提供加密、固定收益、国际零股或 tokenization 能力。对于美国零售
              algo traders 和开发者优先应用，Tradier 是强选择； 对于要搭建全球多资产平台的 B2B 券商基础设施，它不在范围内。
