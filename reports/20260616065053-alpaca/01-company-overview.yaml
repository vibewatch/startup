company:
  name: "Alpaca"

chapter:
  number: 1
  title: "Company Overview"
  summary: "Alpaca is a US-headquartered, self-clearing broker-dealer and API-first brokerage infrastructure company founded in 2015 by Yoshi Yokokawa (CEO) and Hitoshi Harada (CPO), having evolved from a database and machine-learning startup into a platform powering stocks, ETFs, options, fixed income, and crypto for 300+ institutional and fintech partners in 40+ countries. In January 2026 the company closed a $150M Series D led by Drive Capital at a $1.15B unicorn valuation—bringing total disclosed funding to over $320M—and in April 2026 acquired WealthKernel to formally enter Europe as Alpaca Europe with equities trading live on Xetra. A September 2024 SEC order for off-channel communications records failures (resulting in a $400K civil penalty) and subsequent FINRA Membership Continuance SD-2436 represent the principal adverse events in Alpaca's regulatory history; FINRA approved continued membership after reviewing the company's remediation program."

sections:
  - id: "identity-mission"
    title: "Company Identity and Mission"
    body: "Alpaca is a US-headquartered, self-clearing broker-dealer and globally recognized leader in brokerage infrastructure APIs. The company was founded in 2015 by Japanese entrepreneurs Yoshi Yokokawa and Hitoshi Harada, initially operating in San Mateo, California as a database and machine-learning company that processed large volumes of financial market data for institutional clients using deep neural networks. That early engineering work led directly to the creation of MarketStore—an open-source, purpose-built time-series database optimized for financial data—which remains cited as the engineering foundation of Alpaca's infrastructure philosophy. Around 2018, Alpaca pivoted to API-first brokerage infrastructure and launched a commission-free trading platform for algorithmic traders; it subsequently expanded its Broker API to allow global fintechs and financial institutions to build fully custom investing products on top of Alpaca's regulatory and clearing stack. Alpaca's stated mission is to open financial services to everyone on the planet, and its commercial goal is building the global de facto standard for brokerage infrastructure. The company was part of Y Combinator's Winter 2019 batch, which added early developer community credibility. Alpaca offers two primary API products: the Broker API—a full-stack brokerage-as-a-service enabling fintechs and institutions to build investing applications—and the Trading API, targeting algorithmic traders, retail investors, hedge funds, and prop firms automating strategies across stocks, options, and crypto. As of June 2026 the legal broker-dealer entity, Alpaca Securities LLC (CRD# 288202, SEC# 8-69928), is incorporated in Delaware, was formed on March 15, 2017, and maintains its main registered office at 12 East 49th Street, Floor 11, New York, NY 10017, under FINRA New York Office regulation."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO039, CO043]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: "founders-leadership"
    title: "Founders and Leadership"
    body: "Alpaca was co-founded by Yoshi Yokokawa and Hitoshi Harada, both Japanese nationals who relocated to Silicon Valley to build the company. Yokokawa, who serves as CEO, previously worked as an investment banker in both the United States and Japan (including at Lehman Brothers) before pivoting to entrepreneurship after a period of personal algorithmic day-trading that made him acutely aware of the inadequacy of retail brokerage tooling. He has served as the company's primary public spokesperson and strategic driver since founding. Hitoshi Harada serves as Chief Product Officer (CPO), overseeing Alpaca's API product architecture; both founders remain operationally active. In connection with the January 2026 Series D financing, Chris Olsen—co-founder and partner of lead investor Drive Capital—joined Alpaca's Board of Directors, becoming the only publicly confirmed board-level addition from this round. Following the April 2026 acquisition of WealthKernel, Karan Shanmugarajah (previously CEO of WealthKernel) was appointed CEO of Alpaca Europe, overseeing the company's UK and EU operations. Beyond these named individuals, Alpaca's broader C-suite and full board composition are not publicly disclosed as of the run date. Yokokawa's dual roots in Japanese finance—combined with investors including SBI Group, MUFG Innovation Partners, Monex Ventures, and the licensed Japanese entity AlpacaJapan Co.—represent a meaningful strategic differentiator for the company's Asia-Pacific growth ambitions and its ability to source institutional distribution partners in Japan and wider Southeast Asia."
    claimRefs: [CO010, CO011, CO012, CO013]
    tableRefs: [TO002]
    figureRefs: []

  - id: "funding-capitalization"
    title: "Funding History and Capitalization"
    body: "Alpaca has raised capital across at least nine financing events since its 2015 founding, reaching a cumulative total exceeding $320M and achieving unicorn status in January 2026. The earliest disclosed round was a $1.7M seed in 2017 from D4V (an IDEO/Genuine Startups joint venture), Monex Ventures, and MUCAP (MUFG). A $3M pre-Series A followed in October 2018, led by Global Brain, coinciding with the public launch of the commission-free trading platform. Spark Capital led a $6M round in late 2019—earning Alpaca the 'Stripe of stocks' framing—and Portag3 (now Portage Ventures) led a $10M Series A in October 2020. In August 2021 Tribe Capital led the $50M Series B, with participation from Horizons Ventures, Eldridge, Positive Sum, and returning investors Portage, Spark Capital, and Social Leverage; at that point total funding reached approximately $72M. In October 2023 Alpaca secured a $15M convertible note from SBI Group, a strategic Japanese financial institution, pushing the cumulative total to approximately $120M. The $52M Series C closed in April 2025 (investors: Derayah Financial, 850 Management, National Investments Company Kuwait, Unbound, and Portage Ventures) brought total funding to $170M. The January 2026 Series D of $150M was led by Drive Capital; other new participants included Citadel Securities, Opera Tech Ventures (BNP Paribas), MUFG Innovation Partners, Flat Capital (with Klarna CEO Sebastian Siemiatkowski as controlling UBO), DRW Venture Capital, Kraken, Altered Capital, X&KSK (Keisuke Honda), Bank Muscat, and Endeavor Catalyst. Returning investors in the Series D included Portage, Horizons Ventures, Social Leverage, Unbound, Diagram, and Derayah Financial; angel participation came from Revolut CTO Vlad Yatsenko. Alongside the equity raise, Alpaca secured a $40M line of credit. The Series D values Alpaca at $1.15 billion, and the company states total funding has exceeded $320M post-close."
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026]
    tableRefs: [TO003]
    figureRefs: [FO001]

  - id: "scale-regulatory-footprint"
    title: "Scale, Products, and Regulatory Footprint"
    body: "Alpaca's scale metrics as of June 2026 come from two slightly different company-issued figures reflecting different reporting dates. The about-us page reports hundreds of institutional and fintech partners in 40+ countries, with partners having opened over 7 million accounts, and a developer community of 61,000 monthly active developers (MAD). The January 2026 Series D announcement states Alpaca has partnered with 300+ organizations in more than 40 countries and powers over 9 million brokerage accounts—a figure updated from the about-us. These two figures are reconcilable as reflecting different measurement dates, with the Series D figure being more recent and authoritative. Alpaca's product suite expanded substantially in 2025: the company launched multi-leg options, fully paid securities lending (FPSL), fixed-income (U.S. Treasuries), and 24/5 U.S. stock trading. It introduced a High-Yield Cash product through an interest-bearing sweep program and unveiled its Instant Tokenization Network at TOKEN2049 Singapore in late 2025 with launch partners including xStocks, Dinari, Ondo Finance, and the Solana Foundation. Alpaca has claimed a 94% market share in tokenized U.S. equities and ETFs as of its 2025 tokenization report—a company-stated figure not independently verified. The company also stated it more than doubled year-over-year revenue in the period prior to the Series D. Alpaca's regulatory footprint spans multiple jurisdictions: in the U.S., Alpaca Securities LLC (also operating as Alpaca Clearing) holds FINRA membership and self-clears through DTCC (equities), OCC (options), and FICC (Treasuries); Alpaca Crypto LLC (NMLS# 2160858) handles digital-asset operations; AlpacaJapan Co. (JSDA# 3024) operates in Japan; AlpacaX entities operate in the Bahamas; and following the April 2026 WealthKernel acquisition, Alpaca Europe is regulated in the UK and EU. Alpaca also became a Nasdaq Exchange Member in 2025. BrokerCheck confirms the firm conducts 11 types of businesses and carries two regulatory disclosure events."
    claimRefs: [CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO040, CO041, CO042]
    tableRefs: []
    figureRefs: [FO003]

  - id: "milestones-adverse"
    title: "Key Milestones and Adverse Events"
    body: "Alpaca's history contains a rich sequence of founding, financing, product, and regulatory milestones alongside one material adverse event. The company's 2015 founding, early MarketStore work, and 2018 commission-free brokerage API launch established its engineering DNA and developer-first identity. YC W19 participation in early 2019 added accelerator credibility and network access. The 2021 Series B marked Alpaca's first major institutional round and triggered rapid B2B2C expansion—accounts grew from near zero at end-2020 to over 100,000 by mid-2021. DTCC approval in 2023 and full transition to self-clearing in 2024 was a critical operational milestone enabling Alpaca to manage the complete trade lifecycle in-house without correspondent brokers. In 2025, Alpaca secured OCC and FICC memberships (completing coverage of equities, options, and Treasuries), became a Nasdaq Exchange Member, and launched several major products including options, fully paid securities lending, fixed income, and 24/5 trading. The April 2026 acquisition of WealthKernel—rebranded as Alpaca Europe—with Xetra live on day one represents Alpaca's formal European market entry. The principal adverse event in Alpaca's record is the September 24, 2024 SEC order (Exchange Act Release No. 101137) finding that Alpaca Securities LLC willfully violated Section 17(a) of the Exchange Act and Rule 17a-4(b)(4) by failing to preserve off-channel communications from May 2022 onward, with supervisors using personal devices in violation of firm policies. The SEC censured Alpaca, ordered it to cease and desist, and imposed a $400,000 civil penalty. FINRA subsequently issued Membership Continuance Notice SD-2436 on March 6, 2025, approving continued FINRA membership despite the resulting statutory disqualification—confirming that the regulator found remediation adequate. Alpaca implemented enhanced compliance controls, policy changes, and communications technology prior to the order's issuance."
    claimRefs: [CO003, CO004, CO031, CO032, CO033, CO035, CO036, CO037, CO038]
    tableRefs: [TO004]
    figureRefs: []

