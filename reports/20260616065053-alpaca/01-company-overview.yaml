callouts:
  - calloutType: "strength"
    title: "Self-Clearing Infrastructure as a Durable Moat"
    body: "Alpaca's transition to full self-clearing across DTCC (equities), OCC (options), and FICC (Treasuries)—combined with Nasdaq Exchange Member status—is a rare and capital-intensive regulatory achievement for a fintech company of its size. Self-clearing enables Alpaca to offer faster trade processing, real-time post-trade visibility, and customizable workflows to partners without correspondent brokers, creating a structural cost and capability advantage that is difficult for pure-API competitors to replicate without comparable regulatory investment and capital commitment."
    claimRefs: [CO031, CO032, CO033]

  - calloutType: "risk"
    title: "SEC Enforcement and FINRA Disqualification History"
    body: "The September 2024 SEC order (Release No. 101137) finding willful records-retention violations, resulting in a $400,000 civil penalty and statutory disqualification, is the most material adverse event in Alpaca's regulatory history. Although FINRA approved continued membership via SD-2436 in March 2025 after reviewing Alpaca's remediation, heightened regulatory supervision remains ongoing. Prospective institutional partners and investors should review both regulatory events—confirmed in BrokerCheck as Disclosure Event count: 2—as part of standard counterparty due diligence."
    claimRefs: [CO037, CO038, CO042]

  - calloutType: "insight"
    title: "Japanese-Founder Network as a Strategic Geographic Asset"
    body: "Alpaca's Japanese-founder heritage—combined with investors including SBI Group, MUFG Innovation Partners, Monex Ventures, and AlpacaJapan Co. (JSDA-registered)—provides a credentialed entry point into Japanese and broader Asia-Pacific financial services markets. The alignment with Saudi Vision 2030 (cited by Yokokawa in the Series D announcement), Middle East institutional investors (Derayah Financial, Bank Muscat, National Investments Company Kuwait), and Australian (Altered Capital) and Keisuke Honda (X&KSK) investors reflects deliberate geographic diversification that positions Alpaca's institutional partner network well beyond U.S. borders."
    claimRefs: [CO010, CO019, CO023, CO024, CO041]

