    {
      "id": "direct-peers-incumbents-and-entrants",
      "title": "Direct peers, incumbents, and likely entrants",
      "body": "Synchron is the nearest direct commercial rival because it targets the same end user — people with paralysis who need digital agency — but pursues a very different product strategy. Its Stentrode is designed for catheter delivery through the jugular vein and blood vessels rather than skull-opening surgery, and the company is explicitly funding commercialization, AI decoding, and pivotal-trial preparation. Precision Neuroscience is the strongest regulatory counterexample to the usual Neuralink narrative: its Layer 7-T has already received FDA 510(k) clearance for short-term cortical use, and the company is positioning itself around reversibility, hospital scale, and lower-trauma surgical access rather than around maximum publicity.\n\nBlackrock Neurotech and BrainGate show where the field's evidence base actually comes from. Blackrock's NeuroPort platform has the longest visible human-research footprint and underpins a large share of the published intracortical literature, while BrainGate continues to prove performance in elite centers with feasibility-study users and high-speed typing results. Paradromics is the most important next-wave entrant because it is optimized for speech restoration with a fully wireless, high-data-rate system and a 2026 clinical-study start. Taken together, these competitors show that Neuralink does not face a single standardized rival; it faces a portfolio of procedure-led, regulatory-led, evidence-led, and speech-led alternatives that attack different parts of the same job-to-be-done.",
