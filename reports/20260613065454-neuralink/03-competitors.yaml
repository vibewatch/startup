    {
      "id": "pricing-distribution-and-switching-cost",
      "title": "Pricing opacity, distribution power, and switching cost",
      "body": "No leading implantable BCI vendor in this chapter publishes a clean chronic-implant price card, which is itself an important competitive fact. Synchron, Precision, Blackrock/BrainGate, and Paradromics still route access through studies, hospital partners, and research programs rather than through ordinary procurement pages. In contrast, Tobii already offers a packaged SGD with eye tracking, bundled software, and a funding workflow that can run through therapists, payers, or self-purchase. CMS's SGD rules show what mature coverage looks like: defined HCPCS codes, documentation standards, and explicit non-covered boundaries. Medtronic's 2026 DBS guide shows the same thing on the implant side, with concrete physician payment anchors and a durable specialist channel.\n\nThat asymmetry creates the real distribution moat in this market today. Hospital systems, neurosurgeons, rehab teams, and payers control access far more than consumer brand does. Once a patient is implanted, switching costs are also unusually high because hardware, surgical team, decoding software, training data, and follow-up support all move together. Multi-homing exists mostly above the implant layer: users can combine different software endpoints or output devices more easily than they can switch core neural hardware. Neuralink therefore has some lock-in once implanted, but it does not yet control the upstream channel power the way DBS incumbents or Medicare-coded substitutes already do.",
