figures:
  - id: FO001
    title: Neuralink — milestone timeline
    type: timeline
    layout: wide
    summary: Key dated inflection points from founding through the 2025 Series E and multi-patient update.
    data:
      items:
        - label: Founded
          date: '2016'
          detail: Neuralink launches with Musk and an initial scientist/engineer group.
          tone: neutral
        - label: Show-and-tell
          date: 2022-11
          detail: Human-trial timing and recruitment push become central to the public story.
          tone: neutral
        - label: FDA first-in-human approval
          date: 2023-05
