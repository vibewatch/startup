      - number: '7.5'
        title: Mitigations, monitoring, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              There is a real mitigation case here, but it is still immature. Neuralink has expanded from a single U.S.
              feasibility story into a multi-country clinical network, publicly discloses some device setbacks rather
              than only successes, and appears to be investing early in reimbursement strategy instead of assuming
              clinical progress alone will unlock revenue. Those are constructive signs. So is the company’s own stated
              focus on thread retention, reduced invasiveness, and collaboration with regulators and hospital sites. But
              the retained record still does not provide the documents that would let an outside investor close the main
              risks with high confidence: detailed adverse-event logs, regulator correspondence, quantified explant and
              revision obligations, payer engagement materials, or economic disclosures that turn progress into a
              durable business model.


              The practical implication is that Neuralink is investable only with explicit monitoring discipline. A
              clean thesis needs proof that reliability is improving without hidden support cost inflation, that sites
              can multiply without governance cracks widening, and that reimbursement work is advancing from abstract
              lobbying to actual coding and coverage traction. The thesis breaks if serious safety or disclosure
              controversies recur, if hospital or regulator support becomes more conditional, or if capital needs keep
              compounding without a clearer path to payment and postmarket obligations. In other words, the company’s
              upside remains real, but today’s valuation support should be tied to staged evidence release rather than
              broad faith in Musk-led inevitability.
