      - number: '5.4'
        title: Differentiation, trust, privacy, compliance, and unresolved controls
        blocks:
          - type: paragraph
            body: >-
              Neuralink's differentiation is strongest where hardware, software, surgery, and clinical iteration meet.
              The public technical paper, patent trail, and official product pages together support a real moat in
              flexible high-density threads, custom electronics, robot-assisted placement, and direct ownership of the
              decoder-and-user-experience stack. The company also appears to be building the surrounding operating
              system for neurotechnology commercialization: a patient registry informed by advocacy groups,
              interdisciplinary hiring across engineering/science/operations, and at least a modest public developer
              signal through its GitHub organization. Compared with peers that emphasize one component such as a stent
              route, a cortical film, or research tooling, Neuralink's public story is unusually end-to-end.


              That same end-to-end ambition creates the trust burden. Neuralink's privacy policy says clinical-trial
              processing is governed by protocols, informed consents, and HIPAA authorizations where applicable; that it
              collects sensitive health and communication data; that it may share data with research partners and
              providers; and that it does not sell personal information or share it for targeted advertising. Yet
              independent sources still surface material concerns. GAO warns that BCI users face unclear data ownership
              and potential loss of access or support after trials. KU Leuven and Frontiers argue that invasive BCIs
              create unusually serious autonomy and neuroprivacy risks, while Frontiers also flags long-term safety
              uncertainty and prior transparency criticism around trial-registration norms. PCRM's records and campaign
              pages keep the animal-welfare controversy alive as an adverse reputational overhang. As a result, the
              chapter's verdict is that Neuralink's product edge is credible, but the trust stack remains only partially
              proved in public evidence: quality-system detail, cybersecurity design, explant outcomes, and long-term
              support obligations remain materially under-disclosed.
