      - number: '3.4'
        title: Moat durability, displacement risk, and adverse field evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence here is not mainly that one named rival has already won the market; it is that the
              whole category remains structurally unfinished. Blackrock's field review and Nature's market overview both
              point out that implanted BCIs have been in human trials for decades without a fully approved
              medical-market winner. GAO goes further, identifying unresolved data-rights, post-trial-support, and
              CMS-coverage problems that sit above any one company. Those are not abstract policy concerns: they
              directly affect whether hospitals, payers, and families will trust a permanent implant vendor with
              long-lived support obligations.


              That makes Neuralink's moat real but not yet durable. Synchron can attack the market from the low-friction
              procedural side; Precision can attack it from the regulatory-and-hospital side; Blackrock and BrainGate
              can keep proving that deep evidence matters more than brand; Paradromics can attack the speech niche with
              higher-throughput claims; and Tobii-style substitutes can keep many communication-first users out of
              surgery altogether. Neuralink still benefits from capital, attention, and aggressive vertical ambition,
              but the field evidence says commoditization and displacement risk are already visible wherever a buyer
              values lower invasiveness, known reimbursement, or proven support more than maximum channel count.
