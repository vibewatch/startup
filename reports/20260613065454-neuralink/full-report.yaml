      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is narrower than the condition pool. Today's first buyer is the academic or specialty
              hospital that can sponsor or host an implant study, assemble neurosurgery and rehabilitation workflows,
              and manage follow-up. The day-to-day user is the patient, but operational users also include
              neurosurgeons, neurologists, therapists, and BCI engineers who calibrate and maintain performance. The
              current payer is usually some blend of study funding, company capital, philanthropy, or grant support
              rather than routine insurance reimbursement. If the category matures, later payers would likely be
              Medicare, commercial insurers, and health systems that accept procedure-plus-support economics. This
              matters because Neuralink is not selling a one-time hardware box; it is trying to insert a managed neural
              interface into hospital and home workflows. The adoption path therefore runs from referral and screening,
              to investigational implant, to decoder training and at-home use, and only then to any scaled reimbursement
              pathway. Public hospital-share data in broad BCI reports supports hospital-centric adoption, but the
              absence of implant-specific reimbursement means budget ownership will remain highly concentrated until
              evidence and coding become more standard.
