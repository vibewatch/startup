  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and governance risk
        blocks:
          - type: paragraph
            body: >-
              Neuralink is still fundamentally a clinical-stage implant program, not a marketed medical-device business.
              FDA guidance and GAO’s BCI assessment both imply a long path from early-feasibility studies to broad
              commercialization: invasive implants sit in a high-risk regulatory category, IDE studies must show
              benefits justify participant risks, and postmarket surveillance, registries, and reporting obligations are
              likely to matter if the device ever reaches market. Public reimbursement is not a downstream detail but a
              central gating dependency. GAO calls CMS interaction difficult for BCI developers, CMS’s own NTAP
              framework requires marketing authorization and substantial clinical improvement evidence, and Inside BCI
              reports that Neuralink has already hired federal lobbyists explicitly to work on “coverage of such
              devices.”


              The adverse overlay is unusually important here because it is no longer confined to historical criticism
              of Musk ventures. PCRM’s complaints and records claims, Fast Company’s Reuters-sourced account of
              FDA-cited animal-lab deficiencies, and STAT’s account of therapeutic messaging colliding with
              transhumanist rhetoric all point to the same underwriting problem: Neuralink needs regulators, hospital
              partners, and future payers to trust a company whose public narrative can oscillate between medical
              restoration and AI-era augmentation. Even if none of these issues independently blocks progress, together
              they raise the odds of delay, narrower labels, extra monitoring demands, or valuation haircuts tied to
              governance quality rather than just technical performance.
            claimRefs:
