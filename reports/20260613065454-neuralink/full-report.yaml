  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, substitutes, and adjacencies
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Neuralink is not “all neurotechnology” and not even every
              brain-computer-interface product. Neuralink's current public offer is an investigational implantable BCI
              for adults with tetraplegia due to spinal cord injury or ALS, delivered through robot-assisted surgery and
              intended to restore high-bandwidth computer control. That means the included spend is the implant,
              surgical workflow, decoding software, clinical programming, and ongoing support needed to make the system
              usable in a hospital-to-home pathway. It does not cleanly include consumer EEG headsets, gaming
              interfaces, generic AI-neurotech narratives, or even all neurostimulation. Status-quo substitutes today
              are eye-tracking AAC and Medicare-covered speech-generating devices for communication, plus established
              implanted neurostimulation like DBS for other neurologic jobs. Adjacent categories such as exoskeletons,
              stroke-rehab BCIs, and future motor-restoration systems matter strategically, but they should be treated
              as expansion vectors rather than as Neuralink's already-open serviceable market.
