  - id: FP001
    title: Competitive positioning map
    type: quadrant
    layout: standard
    summary: >-
      Synchron sits in the highest deployment-ease zone among implant rivals, Precision pairs moderate deployment ease
      with strong regulatory readiness, and Blackrock/BrainGate remain high-capability but low-scale pathways. Tobii
      anchors the easiest-to-deploy substitute quadrant, while Neuralink and Paradromics cluster at the high-capability
      / high-procedure-burden end.
    approximationNotes: >-
      X-axis = deployment ease and channel readiness (1 = elite-center custom stack only, 5 = broadly procurable today).
      Y-axis = control richness and future upside (1 = narrow symptom or communication utility, 5 = high-bandwidth
      general digital-control promise). Scores are evidence-backed ordinal assessments synthesized from public procedure
      descriptions, regulatory status, reimbursement maturity, and product scope; they are not measured market-share
      values.
    data:
      points:
        - label: Neuralink
          x: 2
          'y': 5
          detail: High-bandwidth ambition and strong capital, but open-skull clinical workflow and no approved market path yet
        - label: Synchron
          x: 4
          'y': 3
          detail: >-
            Catheter-delivered and commercialization-funded, but first-gen channel count is lower than intracortical
            rivals
        - label: Precision
          x: 3
          'y': 4
          detail: Short-term FDA clearance plus lower-trauma cortical approach improves hospital readiness
        - label: Blackrock / BrainGate
          x: 1
          'y': 4
          detail: Rich evidence base and high capability, but still centered on bespoke research deployment
        - label: Paradromics
          x: 2
          'y': 5
          detail: Speech-first, high-data-rate thesis with human-study start in 2026 but no outcome data yet
        - label: Tobii Dynavox
          x: 5
          'y': 2
          detail: Much easier to deploy and fund, but lower control richness than implanted BCIs
        - label: Medtronic DBS
          x: 4
          'y': 1
          detail: >-
            Mature hospital workflow and reimbursement, but designed for neuromodulation rather than thought-driven
            computing
    claimRefs:
