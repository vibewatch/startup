  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by solution class, not just by startup name
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set for Neuralink is broader than a list of flashy implant startups. Direct peers
              are implantable BCI companies trying to restore digital control or communication for people with severe
              paralysis, with Synchron and Precision Neuroscience the clearest current examples. Incumbents matter too:
              Blackrock Neurotech and the BrainGate consortium carry the deepest published human-implant track record,
              even if they are still closer to research infrastructure and academic custom stacks than to packaged
              mass-market products. Paradromics belongs in the likely-entrant bucket because it is pursuing the same
              speech-and-computer-control job with a newer, high-bandwidth architecture that only began its clinical
              study in 2026.


              Just as important, the buyer can solve many user needs without choosing Neuralink at all. Tobii Dynavox
              already sells eye-tracking speech-generating devices through assessment and funding workflows, while
              Medtronic's DBS business gives hospitals a familiar implanted-brain procedure and reimbursement benchmark
              even though DBS does a different clinical job. That means Neuralink is competing simultaneously on signal
              quality, surgical burden, hospital workflow, reimbursement plausibility, and substitute sufficiency. The
              competitive question is therefore not simply who has the highest channel count; it is which solution
              clears the real-world path from operating room to home use with acceptable risk, support, and economics.
            claimRefs:
