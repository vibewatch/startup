      Current Neuralink customer journey is a high-friction clinical workflow running from registry to surgery, tuning,
      daily use, and extension into broader autonomy tasks.
    data:
      items:
        - label: Interest / referral
          detail: Prospective users enter through the patient registry, advocacy awareness, or physician referral.
          touchpoints:
            - Patient registry
            - Advocacy / caregiver discovery
            - Site outreach
        - label: Eligibility screening
          detail: Sites filter for diagnosis, injury stability, age, communication ability, and caregiver support.
          touchpoints:
            - SCI or ALS focus
            - English communication
            - Caregiver check
        - label: Site activation + surgery
          detail: Specialized hospital teams and regulators clear the study before robot-assisted implantation.
          touchpoints:
            - Barrow / Miami / UCLH / Newcastle
            - FDA or MHRA/HRA approvals
            - R1-assisted implant
        - label: Calibration + early home use
          detail: Participants begin cursor control quickly, then continue tuning with clinicians and Neuralink engineers.
          touchpoints:
            - Day-after activation
            - Remote sessions
            - Home calibration
        - label: Expansion of autonomy
          detail: Daily digital control can broaden into art, CAD, gaming, communication, and robotic-arm assistance.
          touchpoints:
            - Phones and computers
            - CAD / gaming
            - CONVOY robotic arm
    approximationNotes: >-
      The journey map reflects the public workflow described across site pages and official updates; it is structural
      rather than a measured funnel.
