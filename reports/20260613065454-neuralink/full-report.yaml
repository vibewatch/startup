  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The call stays at research-more because strategic upside, investor support, and patient utility are
      counterbalanced by missing economics, reimbursement dependency, and governance risk.
    data:
      nodes:
        - id: n1
          label: Platform upside
          detail: Full-stack BCI architecture plus multi-indication optionality.
        - id: n2
          label: Financing signal
          detail: $650M Series E shows investor appetite remains strong.
        - id: n3
          label: Disclosure gap
          detail: No public revenue, margin, burn, or cap-table waterfall.
        - id: n4
          label: Coverage dependency
          detail: Commercial revenue still requires authorization and reimbursement mechanics.
        - id: n5
          label: Governance / execution risk
          detail: Adverse legal and operating signals keep a discount in place.
        - id: n6
          label: Valuation assessment
          detail: Formal round is usable; premium secondary marks are not well supported.
        - id: n7
          label: Recommendation
          detail: Research-more / track only with price and diligence discipline.
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
        - from: n6
          to: n7
