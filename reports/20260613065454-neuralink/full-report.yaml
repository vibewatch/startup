chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and current stage
        blocks:
          - type: paragraph
            body: |-
              Neuralink is a private neurotechnology company building implantable brain-computer interfaces
              rather than a software-only AI business or a general robotics platform. The official site
              consistently frames the company around brain-to-device control, while third-party evidence
              places its present headquarters in Fremont, California and its broader operating footprint
              across California and Texas. The current product story is still clinical: the company is
              recruiting and implanting patients through PRIME and related programs, not selling a
              broadly available commercial device.

              Public evidence also supports a late-stage clinical-development designation rather than a
              revenue stage. Neuralink has progressed from FDA trial approval in 2023 to first-patient
              evidence in 2024 and a large Series E financing in 2025, but the sources reviewed here do
              not disclose revenue, ARR, or customer count. Sacra's framing of the business model — a
              vertically integrated medical-device system sold through hospitals with surgery and support
              attached — is directionally plausible, but it remains an intended monetization path rather
              than a proven operating model. That distinction matters because later diligence chapters
              should treat clinical execution and capital sufficiency, not existing commercial scale, as
              the company-overview baseline.
