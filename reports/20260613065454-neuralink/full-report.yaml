      - number: '6.3'
        title: Durability, concentration, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Durability is the biggest unresolved customer question because Neuralink can show repeated usage but not
              yet mature retention metrics. There is no public NRR, GRR, churn, contract duration, or renewal data
              because there is no disclosed commercial installed base. What the evidence does show is continued
              participant engagement after implantation, ongoing calibration sessions, and increasingly diverse use
              cases. Against that, GAO and Inside BCI point to a structural issue for the whole implantable-BCI field:
              trial participants can lose support, maintenance, or even device access when studies end and reimbursement
              is absent. For Neuralink, that means today’s best usage proof does not yet answer who pays for revisions,
              software tuning, explants, or long-term follow-up once a study closes or scales beyond sponsor-funded
              pilots.


              Concentration and procurement friction are also high. Public proof is concentrated in a handful of
              institutions—Barrow, University of Miami, and the UK sites around UCLH and Newcastle—and in a small
              participant set. Enrollment requires surgery, specialized investigators, caregiver availability,
              regulatory approvals, and hospital workflow coordination, all before a user can become an active daily
              customer. Payer adoption is even earlier: CMS has a pathway for new technologies, but public BCI analysis
              still describes no dedicated implantable-BCI coverage framework, and GAO explicitly flags CMS coordination
              as a hindrance to adoption. Add adverse overhang from thread-retraction history, neuroprivacy concerns,
              and PCRM-driven safety scrutiny, and the picture is clear: Neuralink has stronger user proof than revenue
              proof, stronger site momentum than payer readiness, and stronger clinical excitement than commercial
              durability disclosure.
