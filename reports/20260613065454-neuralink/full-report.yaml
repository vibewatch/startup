      - number: '1.2'
        title: Founders, leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: |-
              The public record supports a 2016 founding date but is much thinner on canonical governance
              than on Neuralink's technical narrative. Fortune reporting carried by Yahoo Finance says
              Elon Musk launched the company with seven scientists and one engineer, and that only Musk
              and president DJ Seo remain from the original group. TipRanks currently lists Jared
              Birchall as CEO, Musk as co-founder/co-CEO, DJ Seo as co-founder/president/COO, and Shivon
              Zilis as director of operations and special projects. That gives a workable operating map,
              but it is still indirect because the official pages reviewed during this run do not publish
              a board roster or a clean executive-team page.

              The title record is also inconsistent. Fortune/Yahoo says Birchall is listed in documents
              as CFO among other roles, while TipRanks calls him CEO. That does not prevent analysis, but
              it raises a governance diligence question: outsiders can infer who matters, yet cannot cleanly
              verify who formally owns which executive mandate. Key-person dependence therefore appears high
              around Musk as brand, capital magnet, and strategic sponsor; DJ Seo as founding technical
              continuity; and Birchall as Musk-linked administrative operator. This concentration should be
              treated as a risk amplifier, especially because the company is still private and disclosure-light.
            claimRefs:
