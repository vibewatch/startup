  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Current customer surface and segmentation
        blocks:
          - type: paragraph
            body: >-
              Neuralink's current "customers" are best understood as a clinical adoption network rather than paying
              enterprise accounts or reimbursed health-system buyers. The present end user is a person with profound
              motor impairment who wants more direct control over computers, phones, and eventually robotic limbs. The
              immediate operating buyers are not consumers swiping a card but study operators: Neuralink itself, partner
              hospitals, neurosurgeons, trial coordinators, caregivers, and regulators who decide whether a patient can
              be screened, implanted, supported, and followed. Barrow's PRIME page, Miami's site announcement, and the
              UK GB-PRIME materials all describe a tightly screened pathway with age, injury-stability, communication,
              and caregiver requirements that make adoption look more like complex clinical onboarding than like a broad
              consumer launch.


              Segmentation today therefore runs across several axes. By user condition, the live PRIME lane centers on
              cervical spinal cord injury and ALS; by geography, public site proof spans Phoenix, Miami, and a UK
              network led by UCLH and Newcastle; by use case, the base product is digital device control, while CONVOY
              extends the same implanted user into assistive robotic-arm control. The payer remains effectively the
              sponsor-and-trial stack because public sources do not show routine insurer reimbursement or hospital
              purchasing programs. Neuralink's registry broadens future demand mapping beyond today's implanted cohort
              to paraplegia, vision loss, deafness, and aphasia, but that registry is an intake and research channel,
              not evidence of deployed commercial accounts. For diligence purposes, the important distinction is that
              user demand appears wider than current treated-patient volume, while channel readiness still depends on a
              small number of specialized sites and protocol-driven infrastructure.
            claimRefs:
