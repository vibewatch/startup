  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and public module map
        blocks:
          - type: paragraph
            body: >-
              Neuralink's product is not a standalone chip and not a generic AI interface. In workflow terms, the
              current offer is an investigational brain-computer-interface service that starts with patient screening,
              neurosurgical implantation, decoder training, and ongoing computer-control use for people with profound
              motor impairment. The official Device Control materials define the near-term user as someone with limited
              or no use of both hands because of spinal cord injury or ALS, while Telepathy updates frame the job to be
              done as restoring digital autonomy across computers, phones, and eventually robotic limbs. That makes the
              company closer to a managed neurotechnology stack than to a consumer electronics launch.


              The public module map now has three visible lines. First is Telepathy/PRIME, which is the core
              device-control path for cursoring and everyday digital use. Second is CONVOY, a feasibility extension that
              uses the same N1 implant to control an investigational assistive robotic arm and therefore broadens the
              product from digital freedom toward physical task execution. Third is Blindsight, a future
              visual-prosthesis program that bypasses the natural eye-to-brain pathway and pushes the roadmap toward
              sensory restoration. Supporting assets around those modules include the patient registry, the
              hospital-site network, the Neuralink Application that decodes signals into actions, and a visible if
              limited developer/operations footprint through careers and GitHub signals. The product family is therefore
              best understood as an integrated platform with multiple clinical indication tracks, not a single one-off
              implant.
