  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - 'THESIS: Neuralink is the flagship invasive BCI platform.'
        - Large Series E financing, multi-indication roadmap, and real patient-use proof keep the strategic case alive.
        - A clinically superior rival or materially weaker patient outcomes would erode category-leader status.
      - - 'THESIS: The investor syndicate is still validating the category.'
        - Official and independent 2025 sources show major investors still funding the company at scale.
        - A future round that depends on insider support or reprices lower would weaken this signal.
      - - 'THESIS: Platform optionality could justify premium value later.'
        - Telepathy, speech, and future indication logic suggest one implant architecture can support several markets.
        - If approvals stay narrow or support economics stay heavy, platform optionality deserves a smaller premium.
      - - 'ANTI-THESIS: Public economics are still missing.'
        - No reviewed source discloses revenue, gross margin, burn, runway, or realized reimbursement.
        - Audited commercial and cash-flow disclosure would narrow the valuation discount.
      - - 'ANTI-THESIS: Reimbursement is still a gating dependency.'
        - >-
          Neuralink is already lobbying on coverage before commercialization, and CMS / GAO sources show the path is
          complex.
        - A clear FDA filing path plus concrete coding and payer progress would improve support.
      - - 'ANTI-THESIS: Governance and execution noise can compress valuation.'
        - >-
          Animal-lab citations, SEC-related scrutiny, and employee litigation increase the chance of a governance
          discount.
        - Clean remediation, fuller disclosure, and uneventful clinical scaling would remove some of this overhang.
    notes: >-
      The anti-thesis is valuation-specific: it argues that the current mark asks investors to pay for future success
      before public economics exist.
