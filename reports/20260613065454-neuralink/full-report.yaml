  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: >-
      Neuralink scores highly on market ambition and product differentiation, but much lower on disclosure,
      reimbursement readiness, and near-term exit readiness.
    data:
      items:
        - label: Market opportunity
          value: 8
          detail: BCI remains a category-scale opportunity if medical use cases compound into adjacent indications.
        - label: Product differentiation
          value: 8
          detail: The integrated implant-plus-robot-plus-software stack is still differentiated in invasive BCI.
        - label: Clinical proof
          value: 5
          detail: Human-use evidence is real but still early and small in installed-base terms.
        - label: Reimbursement readiness
          value: 3
          detail: Coverage work has started, but public evidence still shows a gating policy path rather than a solved one.
        - label: Disclosure quality
          value: 2
          detail: No public revenue bridge, margin profile, burn disclosure, or preference stack.
        - label: Governance / execution
          value: 3
          detail: Adverse legal and lab-process signals still justify a discount.
        - label: Valuation discipline
          value: 3
          detail: Formal round is defensible as an upside anchor, but premium secondary marks are not publicly supported.
        - label: Exit readiness
          value: 2
          detail: No visible IPO timeline; current evidence implies a long-duration private hold.
    claimRefs:
      - CV039
      - CV041
      - CV042
      - CV043
      - CV052
      - CV053
