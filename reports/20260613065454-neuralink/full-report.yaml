        - Audited revenue, gross margin, burn, runway, and monthly cash roll-forward
        - Without this, valuation cannot be tied to disclosed fundamentals.
        - Finance team / data room; request audited statements and monthly operating pack.
      - - Cap table and preferences
        - Current cap table, share classes, liquidation stack, anti-dilution, and any senior claims
        - Return math changes materially if prior capital sits ahead of a new investor.
        - Legal diligence; review charter, investor-rights docs, and waterfall model.
      - - Reimbursement dossier
        - Coding strategy, payer roadmap, CMS engagement status, and cost-effectiveness framing
        - Coverage is a gating event between clinical success and real revenue.
        - Market access and policy leads; request full reimbursement workplan.
      - - Safety and support packet
        - Adverse events, revisions, explant policy, post-trial continuity plan, and reserves
        - BCI valuation can break on support obligations as much as on device efficacy.
        - Clinical, quality, and medical affairs diligence.
      - - Manufacturing and unit economics
        - Robot utilization, implant cost stack, yield, service burden, and site-setup economics
        - High support or manufacturing drag can erase platform upside.
        - Operations diligence; request BOM, yield, labor, and service-cost model.
      - - Exit and governance readiness
        - Board reporting cadence, banker conversations, IPO-readiness work, and control remediation
        - Helps test whether the hold period and governance discount are improving.
        - CEO, CFO, GC, and board materials review.
    notes: >-
      These asks are prioritized by what most directly changes underwriting. Items 1-4 are valuation blockers; items 5-6
      determine whether the premium case is durable.
