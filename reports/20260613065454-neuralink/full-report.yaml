      - number: '5.2'
        title: Architecture, implant stack, and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture is unusually vertically integrated for a still-investigational BCI company. Neuralink's
              technology page describes a fully implantable, cosmetically invisible device with a hermetic biocompatible
              enclosure, wireless inductive charging, custom low-power electronics, highly flexible threads, and a
              Neuralink Application that decodes neural signals into intended actions. The operating loop is: neural
              activity is recorded from movement-related brain regions, on-device electronics process and transmit the
              signals wirelessly, the decoder turns those signals into commands, and the user controls a cursor, phone,
              or other external device. The public pages consistently present the implant, software, and user experience
              as a single product system rather than separable SKUs.


              The second pillar is the surgical robot and the manufacturing/packaging know-how behind it. Neuralink's
              own technology page says the threads are too fine for the human hand, while the 2019 JMIR paper and its
              PMC version describe the earlier research platform in concrete engineering terms: up to 3,072 electrodes
              across 96 polymer threads, robotic insertion of six threads per minute, custom ASICs for low-power
              amplification and digitization, and a package smaller than 23×18.5×2 mm3. The same paper also makes clear
              that the research platform was wired for raw-bandwidth development work, while future clinical devices
              were expected to move toward hermetic fully implanted packaging with wireless power and telemetry. Patent
              titles spanning computer-vision robotics, network-on-chip neurological data, and polymer implant
              enclosures reinforce that the differentiation is not just in one chip but in the combined thread, robot,
              signal-processing, and packaging stack.
