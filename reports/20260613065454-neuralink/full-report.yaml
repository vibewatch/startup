      - number: '7.2'
        title: Operational, safety, and patient-support risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is not just “can the implant work once,” but whether Neuralink can repeatedly implant,
              support, revise, and, if necessary, explant the device across a widening site network. Company updates
              provide real progress but also reveal unresolved engineering and service risk. Neuralink disclosed that
              some threads retracted after the first PRIME surgery, reducing effective electrodes before software
              improvements restored performance. Later company materials still discuss improving thread retention and
              reducing invasiveness, which means the company itself is presenting reliability as an active workstream
              rather than a closed issue. That is normal for an early platform, but it makes durability and revision
              economics central diligence topics rather than future details.


              The patient-support side is just as important. GAO explicitly warns that some BCI participants have had
              devices removed because no funds or medical support were available after trials, while the Columbia
              bioethics analysis argues that abandonment can collapse restored communicative agency itself. Neuralink’s
              own updates show meaningful functional benefit, including robot-arm use, but the public record reviewed
              here still does not quantify explant reserves, revision obligations, adverse-event rates, or long-term
              continuity support by jurisdiction. Add labor and safety allegations from the 2024 employee lawsuit, plus
              FDA-cited animal-lab deficiencies in preclinical work, and the operating picture becomes clear:
              Neuralink’s core downside is not a single catastrophic incident already proven in humans, but a stack of
              unresolved process risks that could become expensive, reputationally damaging, and hard to fix once the
              installed base grows.
            claimRefs:
