      - number: '8.4'
        title: Entry discipline, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Entry discipline therefore matters more than brand excitement. A disciplined investor should start from
              the last formal round or below it, then demand the private evidence package that public sources do not
              provide: audited revenue and burn, the full preference stack, reimbursement planning, adverse-event and
              support obligations, and manufacturing or unit-economics detail. Without that packet, paying up for
              tracker-based secondary marks would mean underwriting narrative momentum instead of underwritable
              fundamentals.


              Exit readiness is still low. No reviewed source gives a public IPO timeline, and the business still reads
              like a long-duration clinical and policy build rather than a near-term liquidity story. That pushes the
              expected holding period into a seven-to-ten-year band and makes return math demanding: even a simple 3x
              gross target from a roughly $9.6 billion entry needs close to $28.8 billion of exit value before dilution.
              Thesis-break triggers are straightforward: a down round or structurally weaker round than 2025, stalled
              FDA or coverage progress, serious support or safety failures, or evidence that manufacturing and
              reimbursement are lagging the company's valuation narrative.
