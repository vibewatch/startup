      - number: '7.4'
        title: Capital model and execution risk
        blocks:
          - type: paragraph
            body: >-
              Financial-model risk is less about near-term insolvency than about how much unpriced execution remains
              between today’s capital base and a repeatable commercial business. Neuralink’s 2025 Series E was large at
              $650 million and came with a high-profile investor list, but both company and third-party funding coverage
              present capital as fuel for expanding access, adding sites, and building future devices—not as proof of
              self-sustaining economics. The same public materials that celebrate five active users and global trials do
              not disclose revenue, burn, unit cost, margin, or cash-runway figures. That opacity forces investors to
              treat the company more like a long-duration venture platform than an underwritable medtech operating
              model.


              Execution risk is amplified by concurrency. Neuralink is simultaneously running and expanding Telepathy
              studies, iterating hardware to improve retention and invasiveness, preparing for broader reimbursement
              fights, and extending the narrative into speech and vision programs. STAT’s reporting suggests that this
              breadth can undermine credibility when promotional rhetoric outpaces the narrower therapeutic reality of
              current trials. The employee-safety litigation and animal-welfare scrutiny add a separate
              people-and-culture discount: even if the claims are ultimately resolved without catastrophic findings,
              they raise the probability that internal process discipline is being stretched by ambition. That matters
              because the most expensive failure mode for Neuralink is not missing one technical milestone; it is trying
              to scale across jurisdictions, indications, and policy regimes before its reliability, support model, and
              disclosure practices are mature enough to support the weight of its valuation.
