  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Financing reset
        - New priced round below the 2025 formal mark or heavily structure-dependent financing
        - Would show the private market no longer accepts the current anchor.
        - Move stance toward avoid / optionality-only unless price compensates.
      - - FDA / coverage delay
        - No visible progress from clinical proof toward marketing authorization and coverage mechanics
        - Delays revenue timing and extends dependency on outside capital.
        - Cut base-case value and extend hold assumptions.
      - - Safety or support failure
        - Serious adverse event pattern, explant / revision concern, or weak post-trial support plan
        - Undermines the platform and raises liability / reputation costs.
        - Pause underwriting until full incident and support packet is reviewed.
      - - Governance escalation
        - Expanded enforcement, unresolved ethics scrutiny, or repeated labor issues
        - Adds a governance discount even if technical progress continues.
        - Demand stronger controls and lower entry price.
      - - Economics disappointment
        - Private data show weak margins, heavy support cost, or no reimbursement path
        - Breaks the premium-platform valuation narrative.
        - Re-rate toward public implant analogs, not frontier-tech optionality.
      - - Competitive displacement
        - A less invasive rival wins stronger evidence or commercialization traction
        - Reduces the scarcity premium embedded in the Neuralink story.
        - Trim terminal multiple and strategic-option value.
    notes: >-
      These triggers are designed to be monitorable through new financings, regulatory steps, company disclosures, or a
      private diligence packet.
