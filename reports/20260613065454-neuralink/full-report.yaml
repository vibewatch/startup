      - number: '1.4'
        title: Milestones, regulatory progress, and adverse signals
        blocks:
          - type: paragraph
            body: |-
              Neuralink's chronology is strong enough to establish a reusable baseline for later chapters.
              The company moved from a 2022 show-and-tell recruiting push, to FDA approval for its first
              in-human study in May 2023, to PRIME recruitment in September 2023, first implantation in
              January 2024, public first-patient proof in March 2024, and disclosure of a thread-retraction
              issue in May 2024. TechCrunch then reported both a September 2024 Blindsight breakthrough-device
              milestone and, by June 2025, an official Series E close plus company claims that five people
              with severe paralysis had received implants.

              That forward motion does not erase the adverse record. CNBC documented a hazardous-materials
              transport investigation, Reuters/CNBC reported that the FDA had earlier rejected a trial
              application over core safety questions, and Reuters/Inc said the animal lab drew FDA criticism
              for objectionable conditions. PCRM went further, publishing graphic allegations from monkey
              experiments tied to UC Davis. None of those issues prove the clinical program will fail, but
              together they show that Neuralink's progress has been earned through a contested regulatory and
              ethical path rather than through clean, low-friction execution. The milestone chronology below is
              therefore both a growth narrative and a risk narrative.
