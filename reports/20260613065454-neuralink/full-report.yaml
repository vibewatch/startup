  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, financing context, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Neuralink still matters enough to stay on an investor's radar. The company closed a very large $650
              million Series E in June 2025, kept a top-tier investor roster engaged, and continues to position its
              implant platform as the category leader in invasive brain-computer interfaces. That is real signal. But
              the valuation has moved much faster than public fundamentals. Semafor and follow-on coverage placed the
              round at about $9 billion pre-money, Acquinox framed it near $9.6 billion post-money, and higher
              tracker-based secondary quotes range far beyond that. None of those higher marks comes with public
              revenue, gross margin, burn, or reimbursement disclosure.


              That gap drives the recommendation. At the last formal round, Neuralink looks strategically important but
              financially under-disclosed, so the right call is research-more rather than buy. Confidence is only medium
              because the technology and investor base are impressive, yet risk remains high because commercialization
              still depends on FDA marketing authorization, reimbursement architecture, and durable post-trial support.
              A new investor should require at least venture-style returns and should treat the 2025 formal round—not
              noisy secondary marks—as the relevant starting anchor.
