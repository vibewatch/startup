  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 当前客户界面与分层
        blocks:
          - type: paragraph
            body: >-
              Neuralink
              当前的“客户”最好理解为一个临床采用网络，而不是付费企业账户或已报销的医疗系统买方。当前终端用户是重度运动障碍者，他们想更直接地控制电脑、手机，并最终控制机械肢体。直接运营买方不是刷卡消费者，而是研究运营方：Neuralink
              自身、伙伴医院、神经外科医生、试验协调员、照护者和监管者，他们决定患者能否被筛查、植入、支持和随访。Barrow 的 PRIME 页面、Miami 的站点公告和英国 GB-PRIME
              材料都描述了一条严格筛选路径，包含年龄、伤情稳定性、沟通和照护者要求，使采用更像复杂临床导入，而不是广泛消费发布。


              因此，今天的分层沿着几条轴展开。按用户病况，正在运行的 PRIME 通道聚焦颈髓损伤和 ALS；按地域，公开站点证据覆盖 Phoenix、Miami，以及由 UCLH 和 Newcastle
              牵头的英国网络；按用例，基础产品是数字设备控制，CONVOY 则把同一植入用户延伸到辅助机械臂控制。支付方实际上仍是赞助方和试验栈，因为公开来源没有显示常规保险报销或医院采购项目。Neuralink
              的登记系统把未来需求映射扩展到截瘫、视力丧失、耳聋和失语，但该登记是受理和研究渠道，不是已部署商业账户的证据。尽调上，关键区别是用户需求看起来宽于当前治疗患者数量，而渠道准备度仍取决于少数专门站点和协议驱动的基础设施。
