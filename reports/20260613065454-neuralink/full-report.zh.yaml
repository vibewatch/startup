  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按解决方案类别看格局，而不只是按创业公司名单
        blocks:
          - type: paragraph
            body: >-
              Neuralink 的相关竞争集合比一串高调植入式创业公司更宽。直接同业是那些试图为重度瘫痪人群恢复数字控制或沟通能力的可植入 BCI 公司，Synchron 和 Precision Neuroscience
              是当前最清楚的例子。既有玩家也重要：Blackrock Neurotech 和 BrainGate
              联盟拥有最深的已发表人体植入记录，哪怕它们距离打包的大众市场产品还更远，更接近研究基础设施和学术定制栈。Paradromics
              应放在潜在进入者桶里，因为它追求的是同一项语音和电脑控制任务，只是采用更新的高带宽架构，并且到 2026 年才开始临床研究。


              同样重要的是，买方不选择 Neuralink 也能解决很多用户需求。Tobii Dynavox 已经通过评估和资助流程销售带眼动追踪的语音生成设备；Medtronic 的 DBS
              业务则给医院一个熟悉的植入式脑部手术和报销基准，尽管 DBS 解决的是不同临床任务。这意味着 Neuralink
              同时在信号质量、手术负担、医院工作流、报销可信度和替代方案充分性上竞争。因此，竞争问题并不只是“谁的通道数最高”；真正的问题是，哪种方案能以可接受的风险、支持和经济性，跑通从手术室到居家使用的真实路径。
