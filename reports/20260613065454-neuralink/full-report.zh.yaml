      - number: '8.3'
        title: 可比框架与乐观 / 基准 / 悲观区间
        blocks:
          - type: paragraph
            body: >-
              最干净的估值框架是分阶段参照法，而不是 DCF。正式私募锚点显示，Neuralink 在 2023 年老股交易中约为 $5 billion，在 2023 年融资追踪器摘要中约为 $3.5 billion，在
              2025 年正式融资中约为 $9-9.6 billion。公开医疗器械可比公司不是直接同业，但它们是有用的披露锚点，因为它们展示了当估值绑定已报告销售额时，投资者拿到的是什么：NeuroPace
              在已披露数千万美元设备收入基础上，股权价值接近半个十亿美元；Inspire 以 2025 年 $912 million 收入支撑约 $2.7 billion 估值；Medtronic 和 Abbott
              这样的大型多元化龙头披露深得多，市值 / 销售额代理倍数也低于未披露私募标记所暗示的水平。


              这形成了较窄的基准情景和很有可选性的乐观情景。只有商业化去风险速度显著快于当前公开记录，并且报销架构开始显得可处理而不是停留在理论层面，乐观情景才成立。基准情景把 2025
              年融资轮视为最强锚点，但因公开基本面仍不透明而折扣老股市场的亢奋。悲观情景则在又一轮融资先于收入证明到来，或安全、支持、政策问题扩大折价时，重置到更早锚点。
