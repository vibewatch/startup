      - number: '6.3'
        title: 耐久性、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              耐久性是最大未解客户问题，因为 Neuralink 能展示重复使用，却还不能展示成熟留存指标。没有公开
              NRR、GRR、流失、合同期限或续约数据，因为公司没有披露商业装机基础。证据能显示的是植入后参与者继续互动、持续校准训练，以及用例越来越多样。与之相对，GAO 和 Inside BCI 指出了整个可植入 BCI
              领域的结构性问题：研究结束且缺少报销时，试验参与者可能失去支持、维护，甚至设备访问。对 Neuralink
              而言，这意味着今天最好的使用验证还没有回答，一项研究结束或扩展到赞助方资助试点之外后，谁来支付修订、软件调优、取出或长期随访。


              集中度和采购摩擦也很高。公开验证集中在少数机构——Barrow、University of Miami，以及 UCLH 和 Newcastle
              周边的英国站点——也集中在一小群参与者身上。入组需要手术、专门研究者、照护者可用性、监管批准和医院工作流协调，完成这些之后用户才能成为活跃日常客户。支付方采用更早期：CMS 有新技术路径，但公开 BCI
              分析仍称没有专门的可植入 BCI 覆盖框架，GAO 也明确把 CMS 协调列为采用障碍。再叠加线体回缩历史、神经隐私担忧和 PCRM 驱动的安全审查带来的反向包袱，图景很清楚：Neuralink
              的用户验证强于收入验证，站点动能强于支付方准备度，临床兴奋度强于商业耐久性披露。
            claimRefs:
              - CU021
              - CU022
              - CU023
              - CU024
              - CU025
              - CU026
