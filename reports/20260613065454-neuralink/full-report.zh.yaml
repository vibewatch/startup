            body: >-
              融资图景明显强于收入图景。官方披露支持 2025 年 6 月 $650 million Series E 和 2023 年 8 月 $280 million Series D，这给出过去两轮具名融资中至少
              $930 million
              的清晰公开底线。它降低了短期破产风险，也显示公司能反复获得资本，但没有回答承销真正关心的问题：保留下来的公开来源没有披露账上现金、月烧钱速度、债务、营运资金需求或现金跑道月数。因此，下一次融资触发点是隐含的，而不是明示的。如果报销路径、站点经济性或从临床到商业的转化比预期更慢，Neuralink
              很可能在公开投资者看到规范化植入毛利之前再次回到市场。财务上，结论是混合偏谨慎：公司披露的外部背书足以继续推进试验和产品扩张，但收入质量未验证，毛利形状不透明，资本强度高。最大的尽调阻碍是实际定价、报销设计、试验后支持准备金，以及完整的现金
