  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: Neuralink 主要风险如何传导为商业化延迟、融资需求和估值压力。
    data:
      nodes:
        - id: n1
          label: 设备可靠性问题
          description: 电极线保留或支持失败浮出水面
        - id: n2
          label: 伦理或劳工负面事件
          description: 动物、披露或职场争议升级
        - id: n3
          label: 医院 / 监管摩擦
          description: 站点扩张或修订变慢，条件也更多
        - id: n4
          label: 覆盖延迟
          description: CMS / 支付方架构落后于临床进展
        - id: n5
          label: 商业化延迟
          description: 试验推进，但收入时间点后移
        - id: n6
          label: 支持成本上升
          description: 修订、随访或连续服务义务增加
        - id: n7
          label: 需要更多外部资本
          description: 付款到来前，现金需求持续叠加
        - id: n8
          label: 估值压缩
          description: 投资者从平台上行转向执行折价
        - id: n9
          label: 投资逻辑破裂
          description: 进展不再跑赢持续叠加的风险栈
