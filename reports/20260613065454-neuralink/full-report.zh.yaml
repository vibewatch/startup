        - 直接同行 / 参照点
        - 知名度高、融资充足的私营临床阶段项目；仍属试验性
        - 重度瘫痪人群，以及更长期、更广泛的 BCI 用户
        - 机器人植入的高通道皮层内系统，目标是垂直整合
        - 尚未获得完整商业批准；开颅工作流和支持经济性仍未解决
      - - Synchron
        - 直接同行
