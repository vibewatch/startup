      - number: '1.4'
        title: 里程碑、监管进展与反向信号
        blocks:
          - type: paragraph
            body: >-
              Neuralink 的时间线足够扎实，可以作为后续章节复用的基线。公司从 2022 年展示会式招募推进，到 2023 年 5 月获得 FDA 首次人体研究批准，2023 年 9 月启动 PRIME 招募，2024
              年 1 月完成首例植入，2024 年 3 月公开首例患者验证，2024 年 5 月披露线体回缩问题。随后 TechCrunch 报道称，Blindsight 在 2024 年 9 月获得突破性设备里程碑；到
              2025 年 6 月，公司正式完成 Series E，并声称已有五名重度瘫痪患者接受植入。


              这种向前推进没有抹掉反向记录。CNBC 记录了危险材料运输调查；Reuters/CNBC 报道 FDA 曾因核心安全问题拒绝试验申请；Reuters/Inc 称动物实验室因令人反感的条件受到 FDA
              批评。PCRM 走得更远，公布了与 UC Davis 相关的猴子实验图文指控。这些问题单独看都不能证明临床项目会失败，但合在一起说明，Neuralink
              的进展来自一条充满监管和伦理争议的路径，而不是干净、低摩擦的执行。因此，下方里程碑时间线既是增长叙事，也是风险叙事。
