      - number: '1.2'
        title: 创始人、领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              公开记录支持 2016 年创立这一时间点，但与 Neuralink 的技术叙事相比，规范治理信息要薄得多。Yahoo Finance 转引的 Fortune 报道称，Elon Musk
              与七名科学家和一名工程师共同启动公司，原始团队中只剩 Musk 和总裁 DJ Seo。TipRanks 目前列出 Jared Birchall 为 CEO、Musk 为联合创始人 / 联席 CEO、DJ Seo
              为联合创始人 / 总裁 / COO、Shivon Zilis 为运营和特殊项目总监。这给出了可用的运营地图，但仍是间接证据，因为本次审阅的官方页面没有公布董事会名单，也没有清晰的高管团队页面。


              头衔记录也不一致。Fortune/Yahoo 称 Birchall 在文件中被列为 CFO 等职务，TipRanks 则称他为
              CEO。这不妨碍分析，但提出了治理尽调问题：外部人能推断谁重要，却无法清楚核实谁正式承担哪项高管授权。因此，关键人物依赖看起来高度集中在几个人身上：Musk 是品牌、资本磁铁和战略赞助人；DJ Seo
              提供创始技术连续性；Birchall 则是与 Musk 相关的行政操盘者。公司仍为私营且披露较少，这种集中度应被视为风险放大器。
