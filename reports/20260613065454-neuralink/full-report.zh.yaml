  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 结论仍是继续研究，因为战略上行、投资者支持和患者效用，被缺失的经济性、报销依赖和治理风险抵消。
    data:
      nodes:
        - id: n1
          label: 平台上行
          detail: 全栈 BCI 架构叠加多适应证可选性。
        - id: n2
          label: 融资信号
          detail: $650M Series E 轮显示投资者胃口仍强。
        - id: n3
          label: 披露缺口
          detail: 公开信息没有收入、利润率、烧钱速度或股权结构瀑布。
        - id: n4
          label: 覆盖依赖
          detail: 商业收入仍需要授权和报销机制。
        - id: n5
          label: 治理 / 执行风险
          detail: 负面法律和运营信号仍构成折价。
        - id: n6
          label: 估值评估
          detail: 正式轮次可用；高溢价老股标记缺乏充分公开支持。
        - id: n7
          label: 推荐
          detail: 继续研究 / 仅在价格和尽调纪律到位时观察。
      edges:
        - from: n1
          to: n6
