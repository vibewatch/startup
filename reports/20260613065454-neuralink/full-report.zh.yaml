  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: compact
    summary: >-
      这个领域竞争激烈，因为不同对手各自掌握不同就绪优势：Synchron 在手术路径上占优，Precision 在公开 FDA 进展上占优，Blackrock/BrainGate 在证据深度上占优，Tobii
      在可部署替代品经济性上占优，GAO 定义的政策缺口则构成下行压力。
    data:
      items:
        - label: 最接近商业化的挑战者
          value: Synchron
          detail: 10 名植入患者、累计融资 $345M、关键试验准备，以及 Apple 集成
          tone: warning
        - label: 同业中唯一公开 FDA 批准
          value: Precision Layer 7-T
          detail: 最长 30 天的实质等同 510(k)，但不是慢性居家使用
          tone: positive
        - label: 最深公开人体证据基础
          value: Blackrock / BrainGate
          detail: Blackrock 综述中 67 名参与者有 38 名使用 NeuroPort 阵列；BrainGate 居家打字达到 22 WPM
          tone: warning
        - label: 摩擦最低的沟通替代品
          value: Tobii SGD + Medicare coding
          detail: 打包式眼动追踪 AAC，已有既定 SGD 覆盖规则
          tone: risk
        - label: 全领域阻断点
          value: Coverage + post-trial support unresolved
          detail: GAO 指出 BCI 普遍存在 CMS 路径、维护负担和数据权利问题
          tone: risk
    claimRefs:
      - CP009
      - CP015
