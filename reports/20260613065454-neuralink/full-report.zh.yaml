      - number: '2.4'
        title: 增长驱动、采用约束与保留的证据缺口
        blocks:
          - type: paragraph
            body: >-
              Neuralink 所在品类的增长逻辑很直接：瘫痪和沟通丧失存在严重未满足需求，已发表植入试验持续改善真实世界表现，相邻系统也显示运动和感觉的双向恢复正在推进。但门槛约束同样清楚。可植入 BCI
              面临高风险医疗器械监管、手术和长期安全义务，商业化路径也比非侵入式替代方案难得多。GAO 和市场政策来源还强调试验结束后的结构性缺口，包括维护资金、数据所有权和用户支持。报销是近期最锋利的瓶颈。CMS
              已经覆盖语音生成设备，医疗系统也长期拥有 DBS 的 Medicare 编码，但可植入 BCI 仍缺少专门的编码、覆盖和支付框架；Anthem 还明确把 BCI
              康复设备归类为研究性且非医疗必要。因此，信任、植入后支持、资本强度和保险公司行为，对采用时点的影响至少不低于原始技术进展。合适的投资姿态是保留相互矛盾的规模估计，把需求按真实但分阶段来承销，并继续追问定价、站点容量、支持成本和支付方路径，而不是用一个宣传式
              TAM 数字填补这些缺口。
