  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与公开模块地图
        blocks:
          - type: paragraph
            body: >-
              Neuralink 的产品不是一颗独立芯片，也不是通用 AI 接口。按工作流看，当前提供的是一项研究性脑机接口服务：先筛查患者，再做神经外科植入，随后训练解码器，并让重度运动障碍人群持续使用电脑控制。官方
              Device Control 材料把近期用户定义为因脊髓损伤或 ALS 而双手使用受限或完全无法使用的人；Telepathy
              更新则把待完成任务定义为恢复跨电脑、手机，并最终延伸到机械肢体的数字自主能力。因此，公司更接近一套托管式神经技术栈，而不是一次消费电子发布。


              公开模块地图现在有三条可见产品线。第一是 Telepathy/PRIME，即用于光标和日常数字使用的核心设备控制路径。第二是 CONVOY，这是一个可行性扩展，用同一枚 N1
              植入物控制研究性辅助机械臂，因此把产品从数字自由扩展到物理任务执行。第三是
              Blindsight，这是未来视觉假体项目，绕开自然的眼到脑路径，把路线图推向感觉恢复。围绕这些模块的支持资产包括患者登记、医院站点网络、把信号解码为动作的 Neuralink
              Application，以及通过招聘和 GitHub 信号可见但有限的开发者 / 运营足迹。因此，产品家族最好理解为拥有多条临床适应症轨道的整合平台，而不是单个一次性植入物。
