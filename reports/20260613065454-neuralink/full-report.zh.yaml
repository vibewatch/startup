      - number: '7.2'
        title: 运营、安全与患者支持风险
        blocks:
          - type: paragraph
            body: >-
              运营风险不只是「植入物能否工作一次」，而是 Neuralink 能否在越来越多的站点里反复完成植入、支持、修订，并在必要时取出设备。公司更新显示了真实进展，也暴露出尚未解决的工程和服务风险。Neuralink
              披露，首次 PRIME
              手术后部分导线回缩，导致有效电极减少；随后靠软件改进恢复了表现。后续公司材料仍在讨论提升导线留存、降低侵入性，说明公司自己也把可靠性视为仍在推进的工作流，而非已经关闭的问题。早期平台出现这种情况并不异常，但它让耐久性和修订经济性成为核心尽调议题，而不是未来细节。


              患者支持同样关键。GAO 明确警告，一些 BCI 受试者曾因试验后没有资金或医疗支持而被移除设备；Columbia 的生物伦理分析则认为，放弃支持可能让已经恢复的沟通能动性本身崩塌。Neuralink
              自身更新显示了有意义的功能收益，包括机械臂使用；但本次保留的公开记录仍未量化取出设备准备金、修订义务、不良事件率，或按司法辖区划分的长期连续支持。再叠加 2024 年员工诉讼中的劳动与安全指控，以及临床前工作里
              FDA 指出的动物实验室缺陷，运营图景已经清楚：Neuralink 的核心下行风险不是一个已经在人类身上证实的单一灾难事件，而是一组尚未解决的流程风险。装机基数一旦扩大，这些风险可能变得昂贵、伤害声誉且难以修复。
