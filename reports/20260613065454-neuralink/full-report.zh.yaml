      - number: '5.4'
        title: 差异化、信任、隐私、合规与未解决控制
        blocks:
          - type: paragraph
            body: >-
              Neuralink
              的差异化在硬件、软件、手术和临床迭代交汇处最强。公开技术论文、专利线索和官方产品页面合在一起，支持公司在高密度柔性线体、自研电子器件、机器人辅助放置，以及直接拥有解码器和用户体验栈上拥有真实护城河。公司似乎也在搭建神经技术商业化所需的外围操作系统：由倡导组织参与设计的患者登记、覆盖工程
              / 科学 / 运营的跨学科招聘，以及通过 GitHub 组织释放出的至少温和公开开发者信号。与强调单一组件的同业相比，无论是支架路径、皮层薄膜还是研究工具，Neuralink 的公开故事都异常端到端。


              同样的端到端野心也制造了信任负担。Neuralink 隐私政策称，临床试验处理受协议、知情同意和适用时 HIPAA
              授权约束；公司收集敏感健康和沟通数据；可能与研究伙伴和服务提供者共享数据；不出售个人信息，也不为定向广告共享个人信息。但独立来源仍提出实质担忧。GAO 警告，BCI
              用户面临数据所有权不清、试验后可能失去访问或支持的问题。KU Leuven 和 Frontiers 认为，侵入式 BCI 带来异常严肃的自主性和神经隐私风险；Frontiers
              还提示长期安全不确定性，以及围绕试验注册规范的既有透明度批评。PCRM 的记录和倡议页面让动物福利争议继续成为负面声誉包袱。因此，本章结论是：Neuralink
              的产品边缘可信，但信任栈在公开证据中只得到部分证明；质量体系细节、网络安全设计、取出结果和长期支持义务仍严重披露不足。
