  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 参考
      - 当前指标或已披露规模
      - 估值或融资锚点
      - 与 Neuralink 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private valuation references retained during this run: Neuralink
        formal and tracker marks, two private BCI financings, and four disclosed public neuro-device anchors. It is not
        a complete census of all neurotechnology or med-device peers.
    rows:
      - - Neuralink 2025 正式轮
        - $650M Series E 轮
        - 投前估值 ~$9B；追踪器覆盖中投后估值约 ~9.6B
        - 当前入场讨论的主要锚点。
        - 公开收入、利润率或股权结构细节未伴随该标记披露。
      - - Neuralink 基于追踪器的二级市场
        - $14.9B 到约 ~40B 指示性区间
        - 仅追踪器报价
        - 显示私人市场想赋予多大的投机上行。
        - 报价不一致且明确未经确认，因此不能支撑基准情景。
      - - Synchron 2025 Series D
        - 已融资 $200M；累计 $345M；10 名患者
        - 私人融资，面向商业化
        - 最接近的侵入式 / 相邻 BCI 融资参考，且有明确商业化表述。
        - 保留来源未披露直接估值；方案侵入性低于 Neuralink。
      - - Precision 2024 Series C
        - 已融资 $102M；累计 $155M
        - 私人融资，面向临床扩张
        - 显示另一家严肃 BCI 平台仍处于更小的已披露资本规模。
        - 保留来源未披露直接估值。
      - - NeuroPace 上市公司
        - 过去 12 个月 RNS 收入约 ~$81.7M
        - 市值约 ~$533M
        - 有真实收入和融资约束的上市植入设备现实校验。
        - 适应症和产品类别不同；市值代理不是 EV。
      - - Inspire 上市公司
        - 2025 年收入 $912M
        - 市值约 ~$2.744B
        - 商业化神经刺激类比，报销敏感性已可见。
        - 睡眠呼吸暂停神经刺激在临床和商业上比 BCI 更成熟。
      - - Medtronic 上市公司
        - FY26 收入 $36.4B
        - 市值约 ~$102.96B
        - 顶级设备披露锚点，也是多元化战略买家参考。
        - 业务过于多元，不能作为直接定价同业。
      - - Abbott 上市公司
        - 2025 年销售额 $44.3B
        - 市值约 ~$153.59B
        - 另一家大型上市公司披露锚点，展示已报告基本面的样子。
        - 业务过于多元，不能作为直接 BCI 同业。
    notes: 这组可比的有用结论是披露质量和阶段纪律，而不是逐一匹配同业。Neuralink 因品类雄心应有溢价，但不应因不透明而获得无限溢价。
