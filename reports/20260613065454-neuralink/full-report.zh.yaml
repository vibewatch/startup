  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 融资重估
        - 新一轮定价融资低于 2025 年正式估值，或融资高度依赖复杂条款
        - 这会说明私募市场不再接受当前估值锚。
        - 除非价格补偿足够，否则立场转向回避 / 只保留期权价值。
      - - FDA / 覆盖延迟
        - 从临床验证走向上市授权和覆盖机制，仍看不到进展
        - 收入时点被推迟，对外部资本的依赖也被拉长。
        - 下调基准情景价值，并拉长持有假设。
      - - 安全或支持失灵
        - 严重不良事件形成模式、取出 / 修订担忧，或试验后支持计划薄弱
        - 这会削弱平台可信度，并抬高责任和声誉成本。
        - 在完整事故与支持材料完成审阅前，暂停承销。
      - - 治理升级
        - 执法扩大、伦理审查悬而未决，或劳动问题反复出现
        - 即便技术进展延续，也会增加治理折价。
        - 要求更强控制，并压低入场价格。
      - - 经济性不及预期
        - 私有数据显示毛利率薄弱、支持成本沉重，或没有报销路径
        - 这会打破高端平台估值叙事。
        - 按公开植入物可比公司重新定价，而不是按前沿技术期权定价。
      - - 竞争替代
        - 侵入性更低的对手拿到更强证据或商业化牵引
        - 这会压低 Neuralink 故事里内含的稀缺性溢价。
        - 下调终局倍数和战略期权价值。
    notes: 这些触发项都能通过新融资、监管步骤、公司披露或私有尽调资料包来跟踪。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV041
      - CV045
      - CV046
