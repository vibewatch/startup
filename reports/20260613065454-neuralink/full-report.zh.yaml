      - number: '3.4'
        title: 护城河耐久性、替代风险与领域反向证据
        blocks:
          - type: paragraph
            body: >-
              这里的反向证据并不主要是某个具名对手已经赢下市场，而是整个品类在结构上仍未完成。Blackrock 的领域回顾和 Nature 的市场概览都指出，植入式 BCI
              已进入人体试验数十年，却还没有一个完全获批的医疗市场赢家。GAO 更进一步，识别出悬而未决的数据权利、试验后支持和 CMS
              覆盖问题，这些问题高于任何单家公司。它们不是抽象政策担忧：它们直接影响医院、支付方和家庭是否会信任一家永久植入物供应商来承担长期支持义务。


              这让 Neuralink 的护城河真实存在，但还不耐久。Synchron 可以从低摩擦手术侧切入市场；Precision 可以从监管和医院侧切入；Blackrock 和 BrainGate
              可以持续证明深度证据比品牌更重要；Paradromics 可以用更高吞吐量主张攻击语音细分；Tobii 式替代品则可以让很多以沟通为先的用户完全避开手术。Neuralink
              仍受益于资本、注意力和激进的垂直整合野心，但领域证据显示，只要买方更看重更低侵入性、已知报销或已验证支持，而不是最大通道数，商品化和替代风险就已经可见。
