  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代品与相邻赛道
        blocks:
          - type: paragraph
            body: >-
              Neuralink 正确的市场边界不是“全部神经技术”，甚至也不是每一种脑机接口产品。Neuralink 当前公开提供的是一款研究性可植入 BCI，面向因脊髓损伤或 ALS
              导致四肢瘫痪的成人，通过机器人辅助手术交付，目标是恢复高带宽电脑控制。因此，应纳入的支出包括植入物、手术流程、解码软件、临床编程，以及让系统能在医院到家庭路径中可用的持续支持。这个边界不能干净地覆盖消费级 EEG
              头戴设备、游戏接口、泛 AI 神经技术叙事，甚至也不覆盖全部神经刺激。今天的现状替代品包括用于沟通的眼动追踪 AAC 和 Medicare 覆盖的语音生成设备，以及 DBS
              等服务于其他神经学任务的成熟植入式神经刺激。外骨骼、中风康复 BCI 和未来运动恢复系统等相邻类别有战略意义，但应被视为扩张向量，而不是 Neuralink 已经打开的可服务市场。
