  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Neuralink 公开栈把植入硬件、机器人植入、解码软件和试验运营拼在一起。
    data:
      layers:
        - label: 临床接收
          modules:
            - 患者登记
            - 资格筛查
            - 医院站点排期
          note: >-
            Pipeline starts with registry demand capture and moves quickly into site-specific screening because the
            product is still trial-bound.
        - label: 手术交付
          modules:
            - R1 式手术机器人
            - 神经外科团队
            - 耗材 + 充电器
          note: Delivery is inseparable from specialized surgical workflow rather than an outpatient consumer install.
        - label: 植入硬件
          modules:
            - 气密封装
            - 无线电池
            - 定制芯片
            - 柔性电极线
          note: This layer is where packaging, power, and thread-density differentiation live.
        - label: 信号解码
          modules:
            - Neuralink 应用
            - 解码器调校
            - 特定任务控制
          note: >-
            Neuralink controls the decode loop directly, which likely speeds iteration but leaves outside integration
            largely opaque.
        - label: 用户结果
          modules:
            - 电脑 / 手机控制
            - 机械臂控制
            - 未来视觉感知
          note: Public roadmap extends from current digital autonomy into physical and sensory restoration.
    approximationNotes: 该栈由官方产品、更新和技术文档来源综合而成；内部子系统的精确边界并未完全公开。
