  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入与现金桥
        - 经审计收入、毛利率、烧钱速度、现金跑道，以及月度现金滚动表
        - 缺了这些，估值就无法和已披露基本面挂钩。
        - 财务团队 / 数据室；要求提供经审计报表和月度经营包。
      - - 股权结构表与优先权
        - 当前股权结构表、股份类别、清算堆叠、反稀释条款，以及任何优先债权
        - 如果既有资本排在新投资人之前，回报测算会发生实质变化。
        - 法务尽调；审阅章程、投资人权利文件和分配瀑布模型。
      - - 报销资料包
        - 编码策略、付款方路线图、CMS 沟通状态，以及成本效益叙事
        - 覆盖是临床成功走向真实收入之间的闸门。
        - 市场准入和政策负责人；要求提供完整报销工作计划。
      - - 安全与支持资料包
        - 不良事件、修订、取出政策、试验后连续性计划和准备金
        - BCI 估值会被支持义务击穿，程度不亚于设备疗效。
        - 临床、质量和医学事务尽调。
      - - 制造与单位经济性
        - 机器人利用率、植入成本结构、良率、服务负担和站点搭建经济性
        - 支持或制造拖累过重，会吃掉平台上行空间。
        - 运营尽调；要求提供 BOM、良率、人工和服务成本模型。
      - - 退出与治理就绪度
        - 董事会汇报节奏、投行沟通、IPO 准备工作和控制整改
        - 这能检验持有期和治理折价是否在改善。
        - CEO、CFO、总法律顾问，以及董事会材料审阅。
    notes: 这些问题按对承销影响最直接的程度排序。第 1–4 项是估值阻断点；第 5–6 项决定高估值情景是否站得住。
