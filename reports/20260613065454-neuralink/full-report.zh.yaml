      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Neuralink 当前市场进入动作最适合理解为医院站点创建、患者筛查和未来支付方赋能，而不是客户经理吞吐量。Barrow 的 PRIME 页面招募四肢瘫痪或 ALS 成人进入机器人辅助植入研究；官方
              Series E 公告点名三个国家、两大洲的神经外科机构。FDA 指南解释了为什么这个动作缓慢且程序化：高风险神经植入物要经过预提交工作、IDE 支持的研究和之后的上市申请；Medtronic DBS
              等成熟脑设备类比产品已经依赖具体的 CPT、HCPCS、医院和编程编码。这些事实足以推断销售和导入周期很长、临床教育负担重、部署需要大量支持。它们不足以计算 CAC、回本周期、转化率或站点级贡献毛利。因此，公开
              GTM 证据是方向性的：Neuralink 看起来像一个 B2B2C 医疗器械推广，成败取决于医院委员会批准、外科医生工作流和报销执行，而不是仅靠消费者需求。
