      - number: '2.2'
        title: 多视角测算、相互矛盾的估计与证据约束下的 SAM
        blocks:
          - type: paragraph
            body: >-
              公开测算数据确认 BCI 是真实市场，但不足以支撑一个可承销的 Neuralink TAM。本次审阅的分析师页面把 2026 年市场规模放在约 $295.5 million 到 $3.33 billion
              之间；仅植入式来源和 Grand View 的理论侵入式 TAM 框架又把区间拉得更宽。这些估计互相冲突，因为它们混合了广义 BCI
              收入、更窄的神经技术子集、仅植入式收入池和理论可触达机会。更安全的读法应看结构而不是标题数字：非侵入式系统仍占据多数已发布收入，侵入式系统今天更小但常被预测增长更快，北美仍是领先商业化区域。第二个视角来自疾病患病率。WHO
              估计全球约 15.4 million 人带着脊髓损伤生活，CDC 则预计美国 ALS 患病人数将从 2022 年约 33,000 例增至 2030 年超过 36,000
              例。这些人群池显示未满足需求有意义，但不能直接换算成 Neuralink SAM，因为候选资格仍取决于四肢瘫痪严重程度、手术适应性、语言和支持要求、站点可及性以及支付方覆盖。因此，本章保留规模区间，并明确把
              Neuralink 特定的 SAM/SOM 留为未解决问题。
