      - number: '8.2'
        title: 投资逻辑、反向逻辑与公开支撑测试
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是自洽的。Neuralink 已经搭出差异化全栈系统——植入物、导线、机器人、软件和多适应症路线图——并已把它转化为患者效用和异常强的融资能力。官方 Series E
              材料和独立报道都指向一家公司：在人类使用里程碑之后，它仍能吸引严肃资本；更广泛的 BCI 市场也在通过医疗、辅助，以及最终由软件定义的应用继续扩张。如果 Neuralink
              能从早期验证走向可复制临床部署，公司可能成为神经科技中少数平台型资产之一。


              反向逻辑是，在公开经济性出现前，价格已经被要求承担太多工作。已审阅证据仍显示这是一家临床阶段平台，没有公开收入桥，没有公开报销回款，也没有公开股权结构瀑布。与此同时，风险堆叠异常耦合：商业化前，CMS
              式覆盖工作已经成为游说重点；GAO 记录的试验后支持问题可能打穿 BCI 经济性；反向来源还在持续提出治理、动物实验室和劳动问题。这意味着头部估值由可选性支撑，而不是由已披露现金生成支撑。
