      - CP047
  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 公开证据支持一条由医院居中串起的路径：从患者筛查走向未来可报销的植入收入，但价格和回款环节仍未披露。
    data:
      nodes:
        - id: registry
          label: 患者登记 / 转诊
          detail: 需求起点是重度瘫痪候选人和转诊临床医生，而不是开放式结账流程。
          tone: neutral
        - id: site
          label: 临床站点筛查
          detail: 招募通过专科中心进行，由中心筛选四肢瘫痪或 ALS 合格患者。
          tone: neutral
        - id: implant
          label: 植入 + 机器人辅助程序
          detail: 经济价值首先体现为高接触度的植入事件，而不是纯软件登录。
          tone: neutral
        - id: support
          label: 编程与支持
          detail: 植入后使用很可能需要编程、排障、再训练和随访服务。
          tone: warning
        - id: payer
          label: 编码 / 覆盖 / 回款
          detail: 收入质量取决于站点能否对植入环节和后续服务同时编码、开票并回款。
          tone: warning
        - id: revenue
          label: 确认收入和毛利
          detail: 这个终局在经济上说得通，但留存公开来源仍未披露。
          tone: positive
      edges:
        - from: registry
          to: site
        - from: site
          to: implant
        - from: implant
          to: support
        - from: support
          to: payer
        - from: payer
