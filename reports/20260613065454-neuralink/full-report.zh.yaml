companyProfile:
  summary: >-
    Neuralink 是一家 2016 年创立的私营神经技术公司，做的是侵入式脑机接口平台，而不是纯软件 AI 或通用机器人业务。公开证据支持把加州 Fremont 视为最稳妥的总部信号，也支持将公司归为后期私营临床开发企业：它已从
    2023 年获得 FDA 首次人体研究批准，推进到 2024 年首例患者验证、国际试验扩张，并在 2025 年完成 $650M Series E，但仍未公开披露商业收入。当前产品栈把 N1
    植入物、机器人植入、解码软件和医院主导的临床流程组合起来，服务于瘫痪患者的设备控制，同时把路线图延伸到辅助机械臂控制和视觉恢复。
