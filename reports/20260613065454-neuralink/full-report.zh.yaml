      - number: '4.3'
        title: 成本结构、毛利路径与服务交付负担
        blocks:
          - type: paragraph
            body: >-
              可能的成本栈比头条患者数量里程碑暗示的重得多。Neuralink 的模式组合了植入硬件、专门制造、机器人辅助神经外科、站点导入、监管运营和反复发生的植入后支持。GAO 和 Inside BCI
              把这一品类的服务负担说得异常清楚：可植入 BCI 可能需要长期维护、软件更新、算法再训练，以及试验阶段后的支持；一些历史参与者已经在资金消失后失去访问。公开类比也指向同一方向。Medtronic 的 DBS
              报销指南显示，植入式脑部流程包含独立的植入、发生器和编程活动；Medtronic 的 2025 10-K 则显示，成熟植入物业务线会背负多少制造、上市和现场商业化支出。学术 BCI
              商业化回顾更让人警醒：即便一个植入项目在科学上成功，如果制造成本、康复负担、报销摩擦和医生采用不能同步放大，商业上仍可能失败。如果 Neuralink
              最终把固定成本摊到更多植入上，长期毛利率可能改善；但近期毛利路径资本密集、支持负担重。
