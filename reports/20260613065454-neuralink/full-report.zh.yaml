      - number: '5.2'
        title: 架构、植入栈与运营模式
        blocks:
          - type: paragraph
            body: >-
              对仍处于研究阶段的 BCI 公司来说，这套架构的垂直整合程度异常高。Neuralink
              技术页描述的是一款完全可植入、外观不可见的设备，包含密封生物相容外壳、无线感应充电、自研低功耗电子器件、高柔性线体，以及把神经信号解码为意图动作的 Neuralink
              Application。运行闭环是：从与运动相关的脑区记录神经活动，设备端电子器件处理并无线传输信号，解码器把信号转成指令，用户控制光标、手机或其他外部设备。公开页面始终把植入物、软件和用户体验呈现为单一产品系统，而不是可分开的
              SKU。


              第二根支柱是手术机器人，以及背后的制造和封装诀窍。Neuralink 自己的技术页称，线体细到人手无法操作；2019 年 JMIR 论文及其 PMC 版本则用具体工程语言描述了早期研究平台：96
              根聚合物线体上最多 3,072 个电极，机器人每分钟插入六根线体，自研 ASIC 做低功耗放大和数字化，封装小于 23×18.5×2
              mm3。同一篇论文也说明，研究平台用有线方式服务原始带宽开发，而未来临床设备预计转向密封全植入封装，配备无线供电和遥测。涵盖计算机视觉机器人、片上网络神经数据和聚合物植入物外壳的专利标题进一步说明，差异化不只在一颗芯片，而在线体、机器人、信号处理和封装栈的组合。
