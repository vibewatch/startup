      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比疾病人群池窄得多。今天的第一类买方是能赞助或承接植入研究、组织神经外科和康复流程并管理随访的学术医院或专科医院。日常用户是患者，但运营用户还包括负责校准和维护性能的神经外科医生、神经科医生、治疗师和
              BCI 工程师。当前支付方通常是研究资金、公司资本、慈善资金或拨款支持的某种组合，而不是常规保险报销。如果品类成熟，之后的支付方很可能是 Medicare、商业保险公司，以及接受“手术 +
              支持”经济性的医疗系统。这一点重要，因为 Neuralink
              卖的不是一次性硬件盒子；它试图把托管式神经接口嵌入医院和家庭工作流。因此，采用路径从转诊和筛查开始，进入研究性植入，再到解码器训练和居家使用，最后才可能走向规模化报销路径。广义 BCI
              报告中的公开医院份额数据支持以医院为中心的采用，但缺少植入特定报销意味着，在证据和编码更标准化之前，预算所有权会高度集中。
