chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Neuralink 是一家私营神经技术公司，正在开发可植入脑机接口，而不是纯软件 AI 业务或通用机器人平台。官网始终把公司定位在脑到设备控制上，第三方证据则把其当前总部锚定在加州
              Fremont，并显示运营足迹覆盖加州和得州。当前产品故事仍处于临床阶段：公司通过 PRIME 及相关项目招募并植入患者，而不是销售一款广泛可得的商业设备。


              公开证据同样支持把 Neuralink 定义为后期临床开发公司，而不是收入阶段公司。公司已从 2023 年 FDA 试验批准推进到 2024 年首例患者证据和 2025 年大额 Series E
              融资，但本报告审阅的来源没有披露收入、ARR 或客户数。Sacra
              对商业模式的表述——通过医院销售、附带手术和支持的垂直整合医疗器械系统——方向上合理，但它仍是目标变现路径，不是已经验证的运营模式。这个区别很重要：后续尽调章节应把临床执行和资本充足性，而不是既有商业规模，作为公司概况的基线。
