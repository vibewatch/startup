      - number: '1.3'
        title: 融资历史、估值信号与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Neuralink 的资本故事在单轮融资公告层面清晰得多，在累计融资层面则模糊得多。最强锚点是 2025 年 6 月官方宣布的 $650 million Series E，CNBC 和 TechCrunch
              均有佐证。公开报道还点名了一个可识别的投资方组合，包括 ARK Invest、Founders Fund、Sequoia、Thrive 和 Lightspeed。早期报道补充了 $280 million
              Series D 以及之后 $43 million 的追加批次，这有助于解释为什么第三方数据库显示不同的累计金额。


              问题不是融资证据不足，而是缺少一本权威台账。TechCrunch 在 2025 年交割前引用了约 $9 billion 的投前估值；Sacra 目前既显示 $9.0 billion 的估值标记，又在叙事中称
              2026 Series E 录入后新股融资约 $1.85 billion。这与同一页面上更保守的 $1.20 billion
              融资页眉有实质差异。因此，本章把单轮事实视为可靠，但把累计融资和估值数字按区间处理。TipRanks 估计 681
              名员工，也强化了这幅图景：一家资本充足的私营公司在收入、客户数或股权集中度披露更充分之前，已经先扩大员工规模。
