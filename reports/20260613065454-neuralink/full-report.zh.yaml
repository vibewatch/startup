  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价不透明与公开牵引力缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个连贯的未来收入机制，但不支持商业收入判断。Neuralink 披露的产品路径是面向重度瘫痪人群的机器人植入 BCI，仍在通过研究性试验和医院伙伴推进，而不是进入普通采购。官方和独立的 2025 年
              6 月融资报道称，已有五名植入用户活跃，四项 Telepathy 试验正在运行；Series E
              公告称资金将用于扩大患者准入和未来设备。缺失的是投资级桥梁：这些里程碑如何转化为确认收入。保留下来的来源没有披露标价、实际报销、合同期限、支持绑定、收入组合或确认销售额。因此，收入质量是本章核心未知数。商业模式看起来更接近高触达、由医院和支付方中介的植入平台，而不是纯软件订阅；但本章必须把定价、收入确认和变现组合视为私有证据缺口，不能用编造数字填补。
