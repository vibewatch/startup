      - number: '7.4'
        title: 资本模型与执行风险
        blocks:
          - type: paragraph
            body: >-
              财务模型风险不是近期资不抵债，而是从今天的资本基础走到可复制商业业务之间，还有多少未定价的执行工作。Neuralink 2025 年 Series E 规模很大，达到 $650
              million，投资人名单也很亮眼；但公司和第三方融资报道都把资金描述为扩展可及性、增加站点、打造未来设备的燃料，而不是自我维持经济性的证明。同一批公开材料一边庆祝五名活跃用户和全球试验，一边没有披露收入、烧钱速度、单位成本、毛利率或现金跑道。信息不透明迫使投资者把公司更像一个长周期风险平台来对待，而不是一个可以承销的医疗科技运营模型。


              并行推进放大了执行风险。Neuralink 同时运行并扩展 Telepathy 研究，迭代硬件以提升留存并降低侵入性，准备更广泛的报销博弈，还把叙事延伸到语音和视觉项目。STAT
              的报道显示，当宣传话术跑在当前试验更窄的治疗现实前面时，这种广度可能削弱可信度。员工安全诉讼和动物福利审视又带来一层人员与文化折价：即便相关主张最终没有灾难性发现，它们也提高了内部流程纪律被野心拉伸的概率。这一点重要，因为
              Neuralink 最昂贵的失败模式不是错过某个技术里程碑；而是在可靠性、支持模型和披露实践还不足以支撑估值重量之前，就试图跨司法辖区、适应症和政策制度扩张。
