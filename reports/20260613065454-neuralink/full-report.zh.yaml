  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 正方：Neuralink 是侵入式 BCI 旗舰平台。
        - 大额 Series E 融资、多适应症路线图和真实患者使用证明，让战略逻辑仍然成立。
        - 临床上更优的竞争对手，或明显更弱的患者结果，会削弱品类领导地位。
      - - 正方：投资者财团仍在验证这个品类。
        - 官方和独立的 2025 年来源显示，主要投资者仍在大规模资助公司。
        - 如果未来轮次依赖内部支持或降价重定价，这一信号会变弱。
      - - 正方：平台期权未来可能支撑溢价。
        - Telepathy、语音和未来适应症逻辑表明，一套植入架构可支持多个市场。
        - 如果审批范围保持狭窄，或支持经济性仍重，平台期权应获得更小溢价。
      - - 反方：公开经济性仍缺位。
        - 审阅来源均未披露收入、毛利率、烧钱、现金跑道或已实现报销。
        - 经审计的商业和现金流披露会收窄估值折价。
      - - 反方：报销仍是关口依赖。
        - Neuralink 已在商业化前就覆盖问题展开游说，CMS / GAO 来源显示路径复杂。
        - 清晰的 FDA 申报路径，加上具体编码和支付方进展，会改善支撑。
      - - 反方：治理和执行噪音会压缩估值。
        - 动物实验室处罚、SEC 相关审查和员工诉讼，提高了治理折价的可能性。
        - 彻底整改、更充分披露，以及平稳的临床扩张，会移除部分压力。
    notes: 反方论点针对估值：它认为在公开经济性出现前，当前标记已要求投资者先为未来成功买单。
