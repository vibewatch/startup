      - number: '8.4'
        title: 进入纪律、退出准备度与投资逻辑破裂触发器
        blocks:
          - type: paragraph
            body: >-
              因此，进入纪律比品牌兴奋更重要。纪律严格的投资者应从上一轮正式融资价或更低水平出发，再要求公开来源无法提供的私下证据包：经审计收入和烧钱速度、完整优先股堆叠、报销规划、不良事件和支持义务，以及制造或单位经济性细节。没有这套资料包，为基于追踪器的老股标记加价，等于承销叙事动能，而不是可承销的基本面。


              退出准备度仍低。已审阅来源没有给出公开 IPO 时间表；业务读起来仍像长周期临床和政策建设，而不是近期流动性故事。这把预期持有期推到七到十年区间，也让回报数学变得苛刻：即便从约 $9.6 billion
              进入、只要求简单 3x 毛回报，也需要接近 $28.8 billion 的退出价值，且未计稀释。投资逻辑破裂触发器很直接：低价轮或结构上弱于 2025 年的融资轮、FDA
              或覆盖进展停滞、严重支持或安全失败，或证据显示制造和报销落后于公司估值叙事。
