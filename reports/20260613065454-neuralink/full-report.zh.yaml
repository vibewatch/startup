      - number: '3.3'
        title: 定价不透明、分销权力与切换成本
        blocks:
          - type: paragraph
            body: >-
              本章没有一家领先可植入 BCI 厂商公布清晰的长期植入价格表，这本身就是重要竞争事实。Synchron、Precision、Blackrock/BrainGate 和 Paradromics
              仍通过研究、医院伙伴和研究项目提供访问，而不是通过普通采购页面。相比之下，Tobii 已经提供带眼动追踪、捆绑软件和资助流程的打包 SGD，可以通过治疗师、支付方或自费购买完成。CMS 的 SGD
              规则展示了成熟覆盖是什么样：明确的 HCPCS 编码、文件标准和明示的不覆盖边界。Medtronic 的 2026 DBS 指南在植入侧展示了同一件事：具体医生支付锚点和耐久的专科渠道。


              这种不对称构成了当下这个市场真正的分销护城河。医院系统、神经外科医生、康复团队和支付方对准入的控制远大于消费品牌。一旦患者植入，切换成本也异常高，因为硬件、手术团队、解码软件、训练数据和随访支持都绑在一起。多归属主要存在于植入层之上：用户可以比更换核心神经硬件更容易地组合不同软件端点或输出设备。因此，Neuralink
              一旦完成植入就有一定锁定效应，但它尚未像 DBS 既有玩家或 Medicare 编码替代品那样控制上游渠道权力。
