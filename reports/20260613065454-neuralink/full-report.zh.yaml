  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、融资背景与估值立场
        blocks:
          - type: paragraph
            body: >-
              Neuralink 仍足够重要，值得留在投资者观察名单上。公司在 2025 年 6 月完成规模很大的 $650 million Series
              E，继续吸引顶级投资人阵容，并持续把其植入平台定位为侵入式脑机接口的类别领导者。这是真信号。但估值跑得远快于公开基本面。Semafor 及后续报道把该轮定在约 $9 billion 投前，Acquinox
              将其表述为接近 $9.6 billion 投后，更高的基于追踪器的老股报价则远超这个水平。这些更高标记没有任何公开收入、毛利、烧钱速度或报销披露支撑。


              这个缺口决定了建议。在上一轮正式融资价位上，Neuralink
              看起来具备战略重要性，但财务披露不足，因此正确结论是继续研究，而不是买入。置信度只有中等，因为技术和投资人基础令人印象深刻；但风险仍高，因为商业化仍取决于 FDA
              上市许可、报销架构和持久的试验后支持。新投资者至少应要求风险投资式回报，并应把 2025 年正式融资轮，而不是嘈杂的老股标记，作为相关起始锚点。
