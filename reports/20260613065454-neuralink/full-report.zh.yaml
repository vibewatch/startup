  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 里程碑信心和披露质量对可辩护估值区间的影响，远大于叙事性老股传闻能够支撑的范围。
    approximationNotes: 条形反映依赖里程碑的估值锚，而不是 DCF。它们是基于正式私募标记、较早锚点和阶段折价构建的情景估计。
    data:
      items:
        - label: 2023 轮 / 重置情景
          value: 3500
        - label: 2023 老股锚点
          value: 5000
        - label: 基准承销中点
          value: 8000
        - label: 2025 正式投后估值
          value: 9600
        - label: 乐观承销中点
          value: 13000
        - label: 基于跟踪器的老股低位
          value: 14900
    claimRefs:
      - CV004
      - CV005
      - CV037
      - CV047
      - CV048
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 该区间显示：若临床、覆盖或融资里程碑滑坡，今天价格下新投资者的上行空间相对下行风险有多窄。
    approximationNotes: 区间是分析师估计，绑定阶段推进和正式私募锚点。最后一项把这些数值转换为相对大约 $9.6B 入场价的总价值结果。
    data:
      items:
        - label: 悲观公允价值（USD M）
          low: 3500
          mid: 5000
          high: 6000
        - label: 基准公允价值（USD M）
          low: 6000
          mid: 8000
          high: 10000
        - label: 乐观公允价值（USD M）
          low: 11000
          mid: 13000
          high: 15000
        - label: 总价值 / ~$9.6B 入场（x）
          low: 0.36
          mid: 0.83
          high: 1.56
    claimRefs:
      - CV047
      - CV048
      - CV049
      - CV050
      - CV051
      - CV052
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: Neuralink 在市场野心和产品差异化上得分很高，但披露、报销准备度和近期退出准备度明显更低。
    data:
      items:
        - label: 市场机会
          value: 8
          detail: 如果医疗用例能叠加到相邻适应证，BCI 仍是品类级机会。
        - label: 产品差异化
          value: 8
          detail: 植入体 + 机器人 + 软件的一体化栈，在侵入式 BCI 中仍有差异化。
        - label: 临床证明
          value: 5
          detail: 人体使用证据真实存在，但按装机基础看仍早期且规模小。
        - label: 报销准备度
          value: 3
          detail: 覆盖工作已经开始，但公开证据仍显示政策路径是门槛，不是已解决问题。
        - label: 披露质量
          value: 2
          detail: 没有公开收入桥、利润率画像、烧钱披露或优先股堆叠。
        - label: 治理 / 执行
          value: 3
          detail: 负面法律和实验室流程信号仍足以支撑折价。
        - label: 估值纪律
          value: 3
          detail: 正式轮次可作为上行锚点来辩护，但高溢价老股标记缺乏公开支持。
        - label: 退出准备度
          value: 2
          detail: 看不到明确 IPO 时间线；现有证据意味着长期持有私募资产。
    claimRefs:
      - CV039
      - CV041
      - CV042
      - CV043
      - CV052
      - CV053
