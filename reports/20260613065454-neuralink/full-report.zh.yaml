      - number: '3.2'
        title: 直接同业、既有玩家与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Synchron 是最近的直接商业对手，因为它瞄准同一终端用户——需要数字自主能力的瘫痪人群——但产品策略完全不同。它的 Stentrode
              设计为通过颈静脉和血管用导管送达，而不是开颅手术；公司也明确在为商业化、AI 解码和关键试验准备融资。Precision Neuroscience 是对常见 Neuralink 叙事最有力的监管反例：它的
              Layer 7-T 已获得 FDA 510(k) clearance，可用于短期皮层使用；公司把自己定位在可逆性、医院规模和低创伤手术通路上，而不是最大化曝光。


              Blackrock Neurotech 和 BrainGate 展示了这个领域的证据基础真正从哪里来。Blackrock 的 NeuroPort
              平台拥有最长的可见人体研究足迹，并支撑了已发表皮层内文献的很大一部分；BrainGate 则继续在顶尖中心通过可行性研究用户和高速打字结果证明性能。Paradromics
              是最重要的下一波进入者，因为它针对语音恢复优化，采用全无线、高数据速率系统，并在 2026 年启动临床研究。合在一起，这些竞争对手说明 Neuralink
              面对的不是一个标准化单一对手；它面对的是一组由手术路径、监管路径、证据路径和语音场景分别主导的替代方案，分别攻击同一待完成任务的不同部分。
