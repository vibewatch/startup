        - 瘫痪用户加神经外科临床 / 研究环境
        - 柔性 1,024 电极皮层薄膜，可逆放置；当前用于短期临床，之后拓展到更广泛的计算场景
        - 当前 FDA 许可是临时 30 天使用，不是长期居家部署
      - - Blackrock Neurotech
        - 既有平台
        - 2024 年获 Tether $200M 多数股权投资；公司投资者公告称已帮助 >40 人
        - 研究型医院、神经假体实验室和重度残障植入研究
        - NeuroPort / Utah Array 平台，覆盖多类临床研究任务的记录和刺激
        - 商业化叙事仍是平台商业化，而不是常规广泛护理交付
      - - BrainGate
        - 学术机构自建
        - 多中心 NIH / 学术可行性项目，不是风投支持的产品公司
        - 顶尖研究中心内的四肢瘫痪用户
        - 定制皮层内技术栈，经由顶级医院证明快速打字和电脑控制
        - 不是封装产品，也无法通过普通医院采购部署
      - - Paradromics
        - 潜在进入者
