    summary: 仅用本章保留的公开证据，按可能性和影响定位 Neuralink 的剩余风险。
    data:
      columns:
        - 关键影响
        - 高影响
        - 中等影响
      rows:
        - label: 高可能性
          values:
            - tone: negative
              label: 报销路径仍未证明
            - tone: negative
              label: 经济性和支持披露不透明
            - tone: neutral
              label: 医院站点集中
        - label: 中等可能性
          values:
            - tone: negative
              label: 安全或支持事件拖慢监管
            - tone: negative
              label: 动物 / 劳工争议扩大治理折价
            - tone: neutral
              label: 国际扩张复杂度
        - label: 低可能性
          values:
            - tone: negative
              label: 围绕披露或临床前实践的正式执法行动
            - tone: negative
              label: 涉及神经数据的大型隐私事件
            - tone: neutral
              label: 增强叙事触发支付方怀疑
