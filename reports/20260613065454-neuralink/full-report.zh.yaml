      - number: '6.2'
        title: 采用轨迹与具名验证
        blocks:
          - type: paragraph
            body: >-
              公开采用曲线在绝对规模上很小，但已经不再是假设。Barrow 在 2024 年初建立首个站点并完成首例人体植入；Neuralink 2024 年 5 月用户体验更新随后披露 Noland Arbaugh
              的具体使用数据，包括工作日最多八小时研究使用、周末超过十小时个人使用，以及单周总计 69 小时。第二名参与者更新增加了另一类验证：Alex 不到五分钟就实现光标控制，几天内使用 CAD，并把植入物与
              Quadstick 配对，获得更丰富的游戏控制。这些例子仍来自公司发布的文章，但它们把证据基础从静态演示视频推进到反复的居家和研究使用。


              2025 年和 2026 年，新鲜度明显提升，因为医院开始发布自己的站点和患者更新。Miami 记录 RJ 成为第五名 PRIME 参与者，也是 UHealth Tower 首位植入患者；UCLH 记录 Paul
              在当天或次日开始实现功能使用，之后又报告 2025 年 10 月至 12 月间七名 GB-PRIME 参与者接受植入。Neuralink 2026 年 1 月 Telepathy 更新声称已有 21
              名参与者，并突出更多任务多样性，包括艺术、家庭沟通和辅助机械臂进食。合在一起，这对一项研究性服务构成了可信的类生产验证：具名站点、具名研究者、具名或化名患者、出院时点和真实用户任务。但它还不是广泛商业验证，因为分母仍很小，大多数证据仍由赞助方或站点生成，也没有公开来源披露从登记到植入的漏斗转化、活跃用户衰减或单次部署经济性。
