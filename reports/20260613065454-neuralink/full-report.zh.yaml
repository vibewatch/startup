      - number: '7.3'
        title: 伙伴、站点与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Neuralink 当前进展依赖少数外部机构，每一家都扮演闸门角色。Barrow、Miami、UHN、Cleveland Clinic Abu Dhabi
              这样的旗舰医院不是可互换的分销渠道；它们是高度专业化的临床伙伴，提供外科人才、患者筛选、监管接口和植入后随访。UHN 材料同时凸显机会和集中度：Toronto Western 是加拿大独家手术站点，也是首个进行
              Neuralink 手术的美国以外站点；UAE 项目则集中在 Cleveland Clinic Abu Dhabi，并与当地 Department of Health
              绑定。集中有战略价值，因为它允许谨慎扩张；但也意味着任何站点级暂停、研究者流失、不良事件或特定司法辖区政策变化，都可能不成比例地拖慢入组和学习速度。


              覆盖与商业化依赖同样集中。Inside BCI 的报道清楚表明，即便尚未获得上市许可，Neuralink 已经在推进 Medicare
              架构；这强烈说明管理层理解，商业化要穿过报销和编码，而不只是拍更多患者视频。尽调上的含义是，伙伴依赖有多层：Neuralink
              依赖医院站点执行试验，依赖监管机构延续研究并确定标签范围，依赖支付方和政策中介最终兑现收入，也依赖投资者撑过这些闸门清除前的阶段。这样的组合让公司比典型软件创业公司，甚至比进入市场路径更简单的普通医疗科技创业公司更脆弱。
