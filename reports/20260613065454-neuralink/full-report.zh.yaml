  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              Neuralink 本质上仍是临床阶段植入项目，不是已经上市的医疗器械公司。FDA 指引和 GAO 对 BCI 的评估都指向一条从早期可行性研究走向广泛商业化的长路：侵入式植入物属于高风险监管类别，IDE
              研究必须证明收益足以覆盖受试者风险；如果设备最终上市，上市后监测、登记系统和报告义务很可能都会变得关键。公共报销不是下游细节，而是核心闸门。GAO 称 BCI 开发者与 CMS 打交道很难，CMS 自身 NTAP
              框架要求产品先获得上市许可，并拿出重大临床改善证据；Inside BCI 还报道，Neuralink 已经聘请联邦游说者，明确推进「此类设备的覆盖」。


              这里的反向证据格外重要，因为它已不再只是对 Musk 旗下公司的历史批评。PCRM 的投诉和记录主张、Fast Company 基于 Reuters 的 FDA 所指动物实验室缺陷报道，以及 STAT
              所写治疗叙事与超人类主义话术冲突，都指向同一个承销问题：Neuralink 需要监管机构、医院伙伴和未来支付方信任一家公司，而这家公司的公共叙事可能在医疗恢复与 AI
              时代增强之间来回摇摆。即便这些问题单独看都不阻断进展，叠加后也会提高延期、标签收窄、额外监测要求，或因治理质量而非单纯技术表现导致估值折价的概率。
