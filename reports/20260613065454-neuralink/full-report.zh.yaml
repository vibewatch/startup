      - number: '5.3'
        title: 部署、集成、支持、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              今天的部署模式明确由医院主导，且支持负担很重。PRIME 招募通过 Barrow 和 University of Miami 等站点伙伴推进；UCLH 的 GB-PRIME
              更新显示英国也是同样模式：患者接受筛查，在专门神经外科中心植入，学习使用数字设备，随后通过持续训练时段加独立日常使用获得支持。Miami 第五名参与者公告和 Neuralink
              自有更新合在一起，展示了一个实际术后流程：一天内出院、初始导入、以及反复软件或任务调优。这不是即插即用可穿戴设备；它依赖手术、站点能力、照护者可靠性和持续随访。


              可靠性进展真实存在，但仍很早期。Neuralink
              第二名参与者更新公开称，第一名参与者经历线体回缩，性能一度下降；同一篇文章称，公司通过减少脑部运动、缩小植入物与脑表面的间隙来改变手术技术，并且在第二名参与者身上没有观察到线体回缩。这是令人鼓舞的迭代证据，但仍是公司报告且试验规模很小。路线图扩张也快于已发表证据基础。根据
              Neuralink 2026 年 1 月更新，Telepathy 已达到 21 名参与者；CONVOY 把同一植入物延伸到机械臂控制；Blindsight 则在 FDA Breakthrough Device
              Designation 下增加视觉恢复路径。这些动作提高了期权价值，也传递平台野心，但在任何广泛商业发布可见之前，它们也扩大了支持、临床运营和长期可靠性的负担。
