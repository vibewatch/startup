- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Regulatory path risk
    - FDA / jurisdictional correspondence and public study status
    - Study hold, narrower-than-expected authorization path, or new surveillance obligations without offsetting data quality gains
    - Pause commercialization assumptions and re-underwrite timing, cost, and label scope.
  - - Reimbursement risk
    - Coverage architecture progress
    - No clear coding / CMS strategy or no payer progress as participant count grows
    - Treat adoption as sponsor-funded only and haircut revenue timing materially.
  - - Safety and support risk
    - Adverse-event, revision, or explant disclosure
    - Serious event recurrence, unexplained support withdrawals, or continued absence of quantified continuity plans
    - Demand full incident and support packet before giving credit for scale.
  - - Governance and labor risk
    - Closure of lawsuits, watchdog complaints, and board-level remediation
    - New employee-safety claims, adverse disclosure findings, or no credible remediation evidence
    - Apply a governance discount and revisit whether management can scale responsibly.
  - - Capital-model risk
    - Funding and unit-economics visibility
    - Need for additional capital before reimbursement milestones, without disclosed burn or cost improvements
    - Shift valuation stance toward optionality rather than underwritable medtech compounding.
  notes: Kill criteria are designed to be monitorable from regulator actions, company disclosures, or private diligence packets rather than from subjective sentiment.
