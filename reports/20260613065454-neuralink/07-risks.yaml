  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Monthly burn, cash runway, implant unit cost, gross-margin bridge, and service-cost assumptions.
    whyItMatters: Without these numbers, investors cannot tell whether current capital is enough to clear reimbursement and postmarket milestones or how dilutive the next round may be.
    diligencePath: Request board reporting packs, budget-to-actual burn, scenario runway analysis, and unit-economics by implant, surgery, and support cohort.
    relatedQuestionRefs:
    - QR017
  - type: missing-source
    severity: material
    topic: support-continuity
    missingEvidence: Participant continuity agreements, explant policy, revision obligations, and who pays for long-term support by jurisdiction.
    whyItMatters: Post-trial support failure is a direct patient-harm, ethics, and liability risk for an implanted device whose utility may become mission-critical to users.
    diligencePath: Request template consent forms, post-trial care commitments, insurance coverage assumptions, and any explant reserve or contingency structure.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: regulator-and-legal-closure
    missingEvidence: Current SEC, FDA, and employment-matter status letters plus any formal remediation or closure documentation.
    whyItMatters: Residual legal and governance overhang can delay financing, site expansion, and commercialization if it later surfaces with more serious facts than the public record currently shows.
    diligencePath: Request regulator correspondence log, litigation-status memo, board committee minutes on remediation, and any outside-counsel summaries.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: safety-metrics
    missingEvidence: Cohort-level adverse-event, revision-surgery, explant, and discontinuation metrics, plus site-by-site complication variance.
    whyItMatters: Company updates can highlight progress while still omitting the statistics needed to judge whether reliability and patient burden are improving fast enough for scale.
    diligencePath: Request current safety dashboard, DSMB or equivalent summaries, site-level complication tables, and protocol amendments tied to hardware iteration.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR002
