  - - Employment and workplace-safety litigation
    - California / labor law
    - Former employee alleges unsafe monkey handling, retaliation, and pregnancy discrimination; no public merits resolution was found in retained sources
    - medium
    - high
    - low-medium — allegations are public, but remediation evidence is thin
    - medium-high
    - Cultural-control failures can bleed into hiring, compliance, and regulator trust
    - Request lawsuit status, settlement or defense posture, training records, and post-complaint process changes.
