  - - SEC / investor-disclosure and animal-welfare scrutiny
    - U.S. / SEC and public-watchdog pressure
    - PCRM says SEC reopened an investigation after complaints tied to monkey-death disclosures; public closure was not found in retained sources
    - medium
    - high
