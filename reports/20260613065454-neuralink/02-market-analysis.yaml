    {
      "id": "multi-lens-sizing-and-contradictions",
      "title": "Multi-lens sizing, contradictory estimates, and evidence-constrained SAM",
      "body": "Public sizing data confirms that BCI is a real market, but it does not justify one underwritten TAM for Neuralink. Analyst pages reviewed in this run place 2026 market size anywhere from about $295.5 million to $3.33 billion, while implantable-only sources and Grand View's theoretical invasive-TAM framing widen the spread further. Those estimates conflict because they mix broad BCI revenue, narrower neurotechnology subsets, implantable-only revenue pools, and theoretical addressable opportunity. The safer read is structural rather than headline-driven: non-invasive systems still dominate most published revenue, invasive systems are smaller today but often forecast to grow faster, and North America remains the leading commercialization region. A second lens comes from condition prevalence. WHO estimates about 15.4 million people living with spinal cord injury globally, while CDC projects U.S. ALS prevalence from about 33,000 cases in 2022 to over 36,000 by 2030. Those pools demonstrate meaningful unmet need, but they do not convert directly into Neuralink SAM because candidacy still depends on tetraplegia severity, surgical eligibility, language and support requirements, site access, and payer coverage. The chapter therefore preserves the sizing range and explicitly leaves Neuralink-specific SAM/SOM unresolved.",
