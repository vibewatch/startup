    "number": 2,
    "title": "Market Analysis",
    "summary": "Neuralink sits inside a broad brain-computer-interface category, but its relevant near-term market is much narrower: implantable assistive neurotechnology for adults with severe paralysis that requires surgery, decoder software, clinical training, and long-term support. Public market estimates range from hundreds of millions to a few billion dollars because vendors define BCI scope differently, while the investable near-term bottlenecks are reimbursement, trial-grade clinical evidence, qualified implant sites, and trust rather than lack of patient need."
  },
  "sections": [
    {
      "id": "market-boundary-substitutes-and-adjacencies",
      "title": "Market boundary, substitutes, and adjacencies",
      "body": "The right market boundary for Neuralink is not “all neurotechnology” and not even every brain-computer-interface product. Neuralink's current public offer is an investigational implantable BCI for adults with tetraplegia due to spinal cord injury or ALS, delivered through robot-assisted surgery and intended to restore high-bandwidth computer control. That means the included spend is the implant, surgical workflow, decoding software, clinical programming, and ongoing support needed to make the system usable in a hospital-to-home pathway. It does not cleanly include consumer EEG headsets, gaming interfaces, generic AI-neurotech narratives, or even all neurostimulation. Status-quo substitutes today are eye-tracking AAC and Medicare-covered speech-generating devices for communication, plus established implanted neurostimulation like DBS for other neurologic jobs. Adjacent categories such as exoskeletons, stroke-rehab BCIs, and future motor-restoration systems matter strategically, but they should be treated as expansion vectors rather than as Neuralink's already-open serviceable market.",
