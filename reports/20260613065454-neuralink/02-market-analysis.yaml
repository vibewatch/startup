    {
      "id": "growth-drivers-constraints-and-gaps",
      "title": "Growth drivers, adoption constraints, and preserved evidence gaps",
      "body": "The growth case for Neuralink's category is straightforward: there is severe unmet need in paralysis and communication loss, published implant trials continue to improve real-world performance, and adjacent systems show that bidirectional restoration of movement and sensation is progressing. But the gating constraints are equally clear. Implantable BCIs face high-risk medical-device regulation, surgical and long-term safety obligations, and a materially harder commercialization path than non-invasive alternatives. GAO and market-policy sources also highlight structural gaps after trials end, including maintenance funding, data ownership, and user support. Reimbursement is the sharpest near-term bottleneck. CMS already covers speech-generating devices and the healthcare system has long-established Medicare coding for DBS, yet implantable BCIs still lack a dedicated coding, coverage, and payment framework, while Anthem explicitly classifies BCI rehabilitation devices as investigational and not medically necessary. That means trust, post-implant support, capital intensity, and insurer behavior will determine adoption timing at least as much as raw technical progress. The appropriate investment posture is therefore to keep contradictory sizing estimates visible, underwrite demand as real but staged, and carry forward concrete diligence asks on pricing, site capacity, support cost, and payer pathway rather than filling those gaps with a single promotional TAM number.",
