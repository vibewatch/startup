      "calloutType": "risk",
      "title": "The biggest financial risk is reimbursement lag, not lack of technical ambition",
      "body": "Public evidence shows a credible technical and funding story, but CMS coding, coverage, and post-implant support frameworks are not yet purpose-built for implantable BCIs. If those pieces lag, Neuralink can have working hardware and still fail to convert milestones into collectible revenue.",
