    {
      "id": "gtm-motion-and-sales-efficiency-proxies",
      "title": "GTM motion and sales-efficiency proxies",
      "body": "Neuralink's current go-to-market motion is best understood as hospital-site creation, patient screening, and future payer enablement rather than account-executive throughput. Barrow's PRIME page recruits adults with tetraplegia or ALS into a robot-assisted implant study, and the official Series E announcement names neurosurgical institutions across three countries and two continents. FDA guidance reinforces why this motion is slow and procedural: high-risk neurological implants move through pre-submission work, IDE-backed studies, and later marketing filings, while mature brain-device analogs such as Medtronic DBS already rely on specific CPT, HCPCS, hospital, and programming codes. Those facts are enough to infer long sales and onboarding cycles, significant clinical education burden, and support-heavy deployment. They are not enough to calculate CAC, payback, conversion, or site-level contribution margin. Public GTM evidence is therefore directional: Neuralink looks like a B2B2C medical-device rollout that will be won or lost through hospital committee approvals, surgeon workflow, and reimbursement execution, not through consumer demand alone.",
