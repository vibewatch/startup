    "number": 4,
    "title": "Financials",
    "summary": "Neuralink's public financial story is still a financing-and-clinical-scale story, not a disclosed revenue story. The retained source pack supports a hospital-and-payer mediated implant business model with high service and reimbursement dependence, but it does not disclose price, revenue, gross margin, burn, runway, or debt; the latest $650 million round therefore buys time, not public underwriting clarity."
