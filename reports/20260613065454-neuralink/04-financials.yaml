    {
      "id": "cost-structure-margin-path-and-service-burden",
      "title": "Cost structure, margin path, and service-delivery burden",
      "body": "The likely cost stack is much heavier than the headline patient-count milestone suggests. Neuralink's model combines implant hardware, specialized manufacturing, robot-assisted neurosurgery, site onboarding, regulatory operations, and recurring post-implant support. GAO and Inside BCI make the service burden unusually clear for this category: implantable BCIs may require long-lived maintenance, software updates, algorithm retraining, and support after the trial phase, while some historical participants have already lost access when funding disappeared. Public analogs point the same way. Medtronic's DBS reimbursement guide shows that an implanted-brain workflow carries separate implantation, generator, and programming activities, and Medtronic's 2025 10-K shows how much manufacturing, launch, and field-commercialization spend mature implant franchises can carry. The academic BCI commercialization review is even more sobering: a scientifically successful implant program can still fail commercially when manufacturing cost, rehab burden, reimbursement friction, and physician adoption do not scale together. Long-run margins may improve if Neuralink eventually spreads fixed costs across more implants, but the near-term margin path is capital-intensive and support-heavy.",
