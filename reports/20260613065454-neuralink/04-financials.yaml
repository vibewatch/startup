  "sections": [
    {
      "id": "revenue-model-pricing-and-traction-gaps",
      "title": "Revenue model, pricing opacity, and public traction gaps",
      "body": "The public record supports a coherent future revenue mechanism but not a commercial revenue read. Neuralink's disclosed product path is a robotically implanted BCI for people with severe paralysis that is still running through investigational studies and hospital partners rather than ordinary procurement. Official and independent June 2025 funding coverage says five implanted users were active and four Telepathy trials were running, while the Series E announcement says funds will expand patient access and future devices. What is missing is the investor-grade bridge from those milestones to recognized revenue: no retained source discloses list price, realized reimbursement, contract length, support attachment, revenue mix, or recognized sales. That makes revenue quality the core unknown of the chapter. The business model appears closer to a high-touch hospital-and-payer mediated implant platform than to a pure software subscription, but the chapter must treat pricing, revenue recognition, and monetization mix as private-evidence gaps rather than fill them with invented numbers.",
