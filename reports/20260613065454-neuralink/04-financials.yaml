    {
      "id": "capital-adequacy-and-financial-verdict",
      "title": "Capital adequacy, financing dependency, and financial verdict",
      "body": "The funding picture is meaningfully stronger than the revenue picture. Official disclosures support a $650 million Series E in June 2025 and a $280 million Series D in August 2023, which gives a clean public floor of at least $930 million raised across the last two named rounds. That reduces immediate insolvency risk and shows repeated capital access, but it does not answer the questions that matter for underwriting: no retained public source discloses cash on hand, monthly burn, debt, working-capital needs, or runway months. The next financing trigger is therefore implicit rather than stated. If reimbursement pathways, site economics, or clinical-to-commercial conversion take longer than hoped, Neuralink likely returns to the market before public investors ever see normalized implant margins. Financially, the verdict is mixed-to-cautious: the company has enough disclosed external backing to keep pushing trials and product expansion, but revenue quality is unproven, margin shape is opaque, and capital intensity is high. The biggest diligence blockers are realized pricing, reimbursement design, post-trial support reserves, and a full cash/burn/debt bridge.",
