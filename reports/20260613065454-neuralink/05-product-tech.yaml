    {
      "id": "deployment-reliability-and-roadmap",
      "title": "Deployment, integration, support, reliability, and roadmap",
      "body": "The deployment model today is explicitly hospital-led and support-heavy. PRIME recruitment flows through site partners such as Barrow and University of Miami, while UCLH's GB-PRIME update shows the same pattern in the UK: patients are screened, implanted at specialized neurosurgical centers, trained to use digital devices, and then supported through ongoing sessions plus independent everyday use. Miami's fifth-participant announcement and Neuralink's own updates together show a practical post-surgery workflow of discharge within a day, initial onboarding, and iterative software or task tuning. This is not a plug-and-play wearable: it depends on surgery, site capability, caregiver reliability, and sustained follow-up.\n\nReliability progress is real but still early. Neuralink's second-participant update openly says the first participant experienced thread retraction that temporarily reduced performance; the same post says the company changed surgical technique by reducing brain motion and reducing the gap between implant and brain surface, and that it had observed no thread retraction in the second participant. That is encouraging evidence of iteration, but it is still company-reported and trial-scale. The roadmap is also broadening faster than the published evidence base. Telepathy has reached 21 participants according to Neuralink's January 2026 update, CONVOY extends the same implant to robotic-arm control, and Blindsight adds a vision-restoration pathway under FDA Breakthrough Device Designation. Those moves improve option value and signal platform ambition, but they also expand the burden on support, clinical operations, and long-term reliability before any broad commercial launch is visible.",
