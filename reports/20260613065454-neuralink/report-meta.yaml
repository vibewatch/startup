  productSummary: >-
    Neuralink's current platform is a managed implant-service workflow built around
    the N1 brain implant, robotic insertion system, on-device signal processing,
    wireless decoding software, and hospital-led support for people with paralysis
    using computers, phones, and related external devices. The roadmap also includes
    CONVOY for assistive robotic-arm control and Blindsight as a future visual
    prosthesis program.
  customerFocus: >-
    Current end users are adults with severe paralysis, especially people with
    tetraplegia due to spinal cord injury or ALS, while today's practical buyers and
    operating partners are trial-capable hospitals, neurosurgical teams, and study
    operators rather than self-serve consumers.
  businessModel: >-
    Public evidence supports a hospital- and payer-mediated implant model in which
    Neuralink ultimately monetizes through implanted hardware, surgery, decoder
    support, and follow-up services routed through specialized clinical sites rather
    than consumer subscriptions or broad direct sales.
  stage: "Late-stage private clinical development"
  fundingStatus: >-
    Latest disclosed financing was a $650M Series E announced on 2025-06-02 with
    participation from major existing investors. Public reporting around that round
    points to roughly $9B pre-money and about $9.6B post-money, but broader lifetime
    funding tallies remain inconsistent across third-party sources.
