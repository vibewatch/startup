companyProfile:
  summary: >-
    Neuralink is a private neurotechnology company founded in 2016 that is building
    an invasive brain-computer-interface platform rather than a software-only AI or
    general robotics business. Public evidence supports Fremont, California as the
    best-anchored headquarters signal and classifies the company as a late-stage
    private clinical-development business: it has progressed from FDA approval for
    first-in-human study work in 2023 to first-patient proof in 2024, international
    trial expansion, and a $650M Series E in 2025, but it still does not publicly
    disclose commercial revenue. Its current product stack combines the N1 implant,
    robotic implantation, decoder software, and hospital-led clinical workflow for
    paralysis-focused device control, while extending the roadmap toward assistive
    robotic-arm control and vision restoration.
