    "title": "Customers",
    "summary": "Neuralink does not yet have a mature commercial customer base; its current proof comes from a small but expanding network of implanted paralysis patients, hospital trial sites, principal investigators, and regulators that together form a clinical-service buying center. Public evidence shows real usage intensity and multi-site expansion, but retention, payer coverage, post-trial support, and concentration economics remain materially under-disclosed."
