    {
      "id": "adoption-trajectory-and-named-proof",
      "title": "Adoption trajectory and named proof",
      "body": "The public adoption curve is small in absolute terms but no longer hypothetical. Barrow established the first site and first human implant in early 2024; Neuralink's May 2024 user-experience update then disclosed concrete utilization from Noland Arbaugh, including up to eight research hours on weekdays, more than ten hours of weekend personal use, and 69 total hours in a single week. The second participant update added a different type of proof: Alex reached cursor control in less than five minutes, used CAD within days, and paired the implant with a Quadstick for richer game control. Those examples still come from company-reported posts, but they move the evidence base beyond static demo reels into repeated home and research use.\n\nFreshness improved markedly in 2025 and 2026 because hospitals began publishing their own site and patient updates. Miami documented RJ as the fifth PRIME participant and the first implanted at UHealth Tower, while UCLH documented a same-day or day-after functional start for Paul and later reported seven GB-PRIME participants implanted between October and December 2025. Neuralink's January 2026 Telepathy update claims 21 participants and highlights broader task diversity including art, family communication, and assistive robotic-arm feeding. Taken together, this is credible production-like proof for an investigational service: named sites, named investigators, named or pseudonymous patients, discharge timing, and real user tasks. It is not yet broad commercial proof because the denominator remains tiny, most evidence is still sponsor or site generated, and no public source discloses funnel conversion from registry to implant, active-user decay, or economics per deployment.",
