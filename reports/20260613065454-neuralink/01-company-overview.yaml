    {
      "id": "funding-and-stakeholders",
      "title": "Funding history, valuation signals, and stakeholder map",
      "body": "Neuralink's capital story is much clearer at the round-announcement level than at the\ncumulative-funding level. The strongest anchor is the official June 2025 announcement of a\n$650 million Series E, corroborated by CNBC and TechCrunch. Public coverage also names a\nrecognizable investor syndicate including ARK Invest, Founders Fund, Sequoia, Thrive, and\nLightspeed. Earlier reporting adds a $280 million Series D and a later $43 million add-on\ntranche, which helps explain why third-party databases show different cumulative totals.\n\nThe problem is not a lack of financing evidence but a lack of one canonical ledger. TechCrunch\ncited a roughly $9 billion pre-money figure ahead of the 2025 close, while Sacra currently\nshows both a $9.0 billion valuation marker and a narrative claiming roughly $1.85 billion of\nprimary funding after a 2026 Series E entry. That is materially different from the more modest\n$1.20 billion funding header on the same page. As a result, this chapter treats round-level\nfacts as reliable but total-raised and valuation figures as range-based. TipRanks' 681-employee\nestimate reinforces the picture of a well-capitalized private company scaling headcount ahead\nof broader disclosure on revenue, customer count, or ownership concentration.",
