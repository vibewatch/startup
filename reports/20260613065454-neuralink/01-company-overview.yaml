    {
      "id": "milestones-and-adverse-signals",
      "title": "Milestones, regulatory progress, and adverse signals",
      "body": "Neuralink's chronology is strong enough to establish a reusable baseline for later chapters.\nThe company moved from a 2022 show-and-tell recruiting push, to FDA approval for its first\nin-human study in May 2023, to PRIME recruitment in September 2023, first implantation in\nJanuary 2024, public first-patient proof in March 2024, and disclosure of a thread-retraction\nissue in May 2024. TechCrunch then reported both a September 2024 Blindsight breakthrough-device\nmilestone and, by June 2025, an official Series E close plus company claims that five people\nwith severe paralysis had received implants.\n\nThat forward motion does not erase the adverse record. CNBC documented a hazardous-materials\ntransport investigation, Reuters/CNBC reported that the FDA had earlier rejected a trial\napplication over core safety questions, and Reuters/Inc said the animal lab drew FDA criticism\nfor objectionable conditions. PCRM went further, publishing graphic allegations from monkey\nexperiments tied to UC Davis. None of those issues prove the clinical program will fail, but\ntogether they show that Neuralink's progress has been earned through a contested regulatory and\nethical path rather than through clean, low-friction execution. The milestone chronology below is\ntherefore both a growth narrative and a risk narrative.",
