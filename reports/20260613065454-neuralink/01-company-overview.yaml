    "number": 1,
    "title": "Company Overview",
    "summary": "Neuralink is a private brain-computer-interface company founded in 2016 and publicly anchored\ntoday by a Fremont, California headquarters signal, ongoing human-trial activity, and a large\nJune 2025 Series E raise. The chapter finds strong evidence of clinical and financing progress,\nbut also persistent governance opacity, valuation ambiguity, and a meaningful adverse record in\nanimal-testing and regulatory scrutiny."
  },
  "sections": [
    {
      "id": "identity-and-stage",
      "title": "Identity, product model, and current stage",
      "body": "Neuralink is a private neurotechnology company building implantable brain-computer interfaces\nrather than a software-only AI business or a general robotics platform. The official site\nconsistently frames the company around brain-to-device control, while third-party evidence\nplaces its present headquarters in Fremont, California and its broader operating footprint\nacross California and Texas. The current product story is still clinical: the company is\nrecruiting and implanting patients through PRIME and related programs, not selling a\nbroadly available commercial device.\n\nPublic evidence also supports a late-stage clinical-development designation rather than a\nrevenue stage. Neuralink has progressed from FDA trial approval in 2023 to first-patient\nevidence in 2024 and a large Series E financing in 2025, but the sources reviewed here do\nnot disclose revenue, ARR, or customer count. Sacra's framing of the business model — a\nvertically integrated medical-device system sold through hospitals with surgery and support\nattached — is directionally plausible, but it remains an intended monetization path rather\nthan a proven operating model. That distinction matters because later diligence chapters\nshould treat clinical execution and capital sufficiency, not existing commercial scale, as\nthe company-overview baseline.",
