    {
      "id": "leadership-and-governance",
      "title": "Founders, leadership, governance, and key-person risk",
      "body": "The public record supports a 2016 founding date but is much thinner on canonical governance\nthan on Neuralink's technical narrative. Fortune reporting carried by Yahoo Finance says\nElon Musk launched the company with seven scientists and one engineer, and that only Musk\nand president DJ Seo remain from the original group. TipRanks currently lists Jared\nBirchall as CEO, Musk as co-founder/co-CEO, DJ Seo as co-founder/president/COO, and Shivon\nZilis as director of operations and special projects. That gives a workable operating map,\nbut it is still indirect because the official pages reviewed during this run do not publish\na board roster or a clean executive-team page.\n\nThe title record is also inconsistent. Fortune/Yahoo says Birchall is listed in documents\nas CFO among other roles, while TipRanks calls him CEO. That does not prevent analysis, but\nit raises a governance diligence question: outsiders can infer who matters, yet cannot cleanly\nverify who formally owns which executive mandate. Key-person dependence therefore appears high\naround Musk as brand, capital magnet, and strategic sponsor; DJ Seo as founding technical\ncontinuity; and Birchall as Musk-linked administrative operator. This concentration should be\ntreated as a risk amplifier, especially because the company is still private and disclosure-light.",
      "claimRefs": [
        "CO003",
        "CO025",
        "CO026",
