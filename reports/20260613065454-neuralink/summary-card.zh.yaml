summary:
  headline: Neuralink 是侵入式 BCI 里的旗舰平台，临床和融资动能都可信；但公开经济性缺失，报销与长期支持依赖仍未解决，~$9B-$9.6B 的估值锚也偏紧，因此仍只能继续研究。
