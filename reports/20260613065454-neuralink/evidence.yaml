evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and formal executive remit map.
    whyItMatters: Without it, investors cannot confidently assess oversight, title clarity, or control concentration.
    diligencePath: Request a current board deck or org chart from management and cross-check with financing documents.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-valuation
    missingEvidence: A canonical company-backed total-raised and post-money valuation history.
    whyItMatters: >-
      Public sources disagree on both lifetime funding and valuation, which weakens benchmark comparisons and dilution
      analysis.
    diligencePath: >-
      Request the financing history table from the company or lead investor and reconcile it against announcement-level
      sources.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO014
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Revenue, ARR, customer count, and commercial pipeline metrics.
    whyItMatters: >-
      These metrics determine whether Neuralink is merely clinically interesting or also approaching a fundable
      commercial transition.
    diligencePath: >-
      Request current internal KPI reporting or investor materials with commercial-metric definitions and period
      coverage.
    relatedQuestionRefs:
      - QO015
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: clinical-expansion
    missingEvidence: >-
      A regulator-grade source set for every announced indication beyond PRIME, including patient counts and protocol
      status for newer programs.
    whyItMatters: >-
      Later-stage product and market chapters will need clean separation between marketed ambition and verified clinical
      scope.
    diligencePath: >-
      Fetch the specific ClinicalTrials.gov entries or IDE-related disclosures for each newer program as they become
      public.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      A public source that isolates implantable BCI SAM or SOM for adults with severe paralysis after candidate
      screening, implant eligibility, pricing, and support costs.
    whyItMatters: >-
      Without a priced serviceable market, investor narratives can overstate near-term revenue by leaning on broad BCI
      headlines.
    diligencePath: >-
      Request company or hospital-level assumptions on candidate conversion, implant pricing, support burden, and center
      rollout; then rebuild SAM/SOM bottom-up.
    relatedQuestionRefs:
      - QM013
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Publicly verifiable data on who currently funds implants, training, software support, and explant obligations
      across implantable BCI studies.
    whyItMatters: Budget ownership determines whether adoption can move from sponsored pilots into repeatable clinical purchasing.
    diligencePath: >-
      Interview trial sites, reimbursement specialists, and the company on procedure funding, post-trial support
      commitments, and internal cost allocation.
    relatedQuestionRefs:
      - QM016
      - QM017
      - QM018
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: site-capacity
    missingEvidence: >-
      A reliable public count of implant-capable centers, trained teams, and expected throughput for Neuralink-like
      systems.
    whyItMatters: Commercialization pace depends on qualified site capacity as much as on patient demand.
    diligencePath: >-
      Map every active and planned implant site, associated neurosurgery teams, and expected annual implant capacity
      from trial registries and direct outreach.
    relatedQuestionRefs:
      - QM019
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      Comparable methodology notes that reconcile why BCI publishers report 2026 market size from roughly $0.30B to
      $3.33B and theoretical invasive TAMs far above revenue pools.
    whyItMatters: Using incompatible market estimates without reconciliation would create false precision in TAM discussions.
    diligencePath: >-
      Obtain full paid methodology notes or analyst definitions before averaging, triangulating, or using any single
      headline estimate in valuation work.
    relatedQuestionRefs:
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: implant-pricing-transparency
    missingEvidence: Public list pricing, hospital contracting structures, and maintenance bundles for chronic implantable BCI systems.
    whyItMatters: >-
      Without public price architecture, it is impossible to compare implant economics cleanly against SGD substitutes
      or DBS analogs.
    diligencePath: Request hospital quotes, capital-equipment terms, and lifetime support estimates from vendors or trial sites.
    relatedQuestionRefs:
      - QP015
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: channel-and-site-capacity
    missingEvidence: Site-by-site implantation throughput, wait times, and commercial funnel conversion by hospital partner.
    whyItMatters: >-
      Channel power in this market sits with named neurosurgical and rehab centers, but public sources do not show how
      scalable those networks really are.
    diligencePath: Obtain site-volume dashboards, planned-center onboarding schedules, and signed-partner targets from each vendor.
    relatedQuestionRefs:
      - QP020
  - type: private-evidence-only
    severity: material
    topic: post-trial-support-obligations
    missingEvidence: >-
      Vendor-specific warranties, explant commitments, maintenance funding, and user-support obligations after trials
      end.
    whyItMatters: >-
      The field-level GAO warning is clear, but investors still need company-by-company evidence to compare lifecycle
      burden and reputational risk.
    diligencePath: >-
      Review clinical-trial consent forms, service agreements, and policy manuals for post-trial maintenance and explant
      support.
    relatedQuestionRefs:
      - QP024
  - type: stale
    severity: minor
    topic: paradromics-human-outcomes
    missingEvidence: First human-performance and safety results from the 2026 Connect-One study.
    whyItMatters: >-
      Paradromics is the main speech-first entrant, but preclinical throughput claims are not enough to rank real
      competitive readiness.
    diligencePath: Track first conference presentations, regulatory updates, and published interim results from Connect-One.
    relatedQuestionRefs:
      - QP011
      - QP025
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Executed customer or hospital contracts, recognized revenue by stream, and ASP / reimbursement waterfalls for
      implants and support.
    whyItMatters: >-
      Without mix and realized pricing, the committee cannot judge revenue quality, recurring content, or whether
      support revenue is additive or margin-dilutive.
    diligencePath: >-
      Request the last 12 months of recognized revenue by stream, top contract templates, billed-vs-collected schedules,
      and payer denials / concessions by implant cohort.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: >-
      Cash balance, monthly burn, working-capital roll-forward, inventory levels, warranty reserves, and post-trial
      support reserves.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from round sizes alone because implant businesses can consume large
      amounts of cash in inventory, support, and site buildout.
    diligencePath: >-
      Request current balance sheet, 12-month cash bridge, inventory aging, reserve policies, and per-site operating
      budgets.
    relatedQuestionRefs:
      - QI012
      - QI019
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-obligations
    missingEvidence: >-
      Debt schedule, equipment leases, collateral terms, covenants, guarantees, and any project-finance or
      structured-capital obligations.
    whyItMatters: >-
      A company can appear well funded on paper while still carrying obligations that materially shorten runway or
      constrain strategic options.
    diligencePath: >-
      Request lender agreements, covenant calculations, maturity ladder, lease schedule, and board-approved downside
      financing plans.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI005
      - TI006
  - type: missing-source
    severity: material
    topic: site-economics
    missingEvidence: >-
      Site-level reimbursement assumptions, hospital contribution margins, programming labor assumptions, and
      post-implant support reimbursement plans.
    whyItMatters: >-
      Hospital adoption is the practical GTM gate; if sites cannot make money or at least break even, commercial scaling
      stalls even with strong clinical outcomes.
    diligencePath: >-
      Request pilot-site P&Ls, coding plans, staff-hour estimates, reimbursement consultant memos, and sensitivity
      analyses for denial or underpayment scenarios.
    relatedQuestionRefs:
      - QI015
      - QI024
    relatedTableRefs:
      - TI003
      - TI006
  - type: private-evidence-only
    severity: material
    topic: cybersecurity-architecture
    missingEvidence: >-
      A technical security architecture for implant telemetry, decoder access controls, logging, encryption boundaries,
      and incident response.
    whyItMatters: >-
      The trust case depends on how Neuralink protects uniquely sensitive neural and health data, not just on a generic
      privacy-policy disclosure.
    diligencePath: >-
      Request architecture and security-review materials under NDA, including data-flow diagrams, auth model, logging
      controls, and any penetration-test or red-team outputs.
    relatedQuestionRefs:
      - QE021
  - type: private-evidence-only
    severity: material
    topic: quality-metrics
    missingEvidence: >-
      Manufacturing yield, implant reliability, field-failure rate, revision-rate, and sterile-process quality metrics
      for the human program.
    whyItMatters: >-
      Without these numbers, investors cannot judge whether Neuralink's surgical and packaging complexity scales
      economically or safely.
    diligencePath: Request QMS summaries, manufacturing KPI dashboards, CAPA examples, and implant reliability trend data by cohort.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: explant-outcomes
    missingEvidence: >-
      Third-party or regulator-visible explant and revision outcomes for human recipients, including reasons,
      complications, and post-removal function.
    whyItMatters: >-
      A permanent implant category cannot be underwritten responsibly without a credible revision and end-of-life
      pathway.
    diligencePath: >-
      Request investigator brochures, IDE safety updates, and site-level revision/explant protocols and outcomes; search
      for future registry publications and conference abstracts.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: minor
    topic: developer-interfaces
    missingEvidence: Public SDK, API, or third-party integration documentation for the decoder or application layer.
