    {
      "id": "SV003",
      "title": "Comparable framework and bull / base / bear ranges",
      "body": "The cleanest valuation framework is a staged-reference method, not a DCF. Formal private anchors say Neuralink was around $5 billion in 2023 secondary trading, roughly $3.5 billion in 2023 round-tracker summaries, and about $9-9.6 billion in the 2025 formal financing. Public med-device comps are not direct peers, but they are useful disclosure anchors because they show what investors get when valuation is tied to reported sales: NeuroPace sits near a half-billion dollars of equity value on disclosed tens-of-millions device revenue, Inspire around $2.7 billion on $912 million of 2025 revenue, and large diversified leaders like Medtronic and Abbott trade with much deeper disclosure and lower market-cap-to-sales proxies than an undisclosed private mark would imply.\n\nThat creates a narrow base case and a very optional bull case. The bull case only works if commercialization de-risks materially faster than the current public record shows and if reimbursement architecture starts to look tractable rather than theoretical. The base case treats the 2025 round as the strongest anchor but discounts secondary exuberance because public fundamentals are still opaque. The bear case resets toward older anchors if another financing arrives before revenue proof, or if safety, support, or policy problems widen the discount.",
