    {
      "id": "SV002",
      "title": "Investment thesis, anti-thesis, and public-support test",
      "body": "The thesis is coherent. Neuralink has built a differentiated full-stack system—implant, threads, robot, software, and multi-indication roadmap—and it has already translated that into patient utility and unusually strong fundraising power. Official Series E materials and independent coverage both point to a company still capable of attracting serious capital after human-use milestones, while the broader BCI market keeps expanding through medical, assistive, and eventually software-defined applications. If Neuralink can move from early proof into repeatable clinical deployment, the company could become one of the few platform assets in neurotechnology.\n\nThe anti-thesis is that the price is being asked to do a lot of work before public economics exist. The reviewed evidence still shows a clinical-stage platform with no public revenue bridge, no public reimbursement receipts, and no public cap-table waterfall. Meanwhile, the risk stack is unusually coupled: CMS-style coverage work is already a lobbying priority before commercialization, GAO documents the post-trial support problem that can break BCI economics, and adverse sources continue to raise governance, animal-lab, and labor questions. That means the headline valuation is being supported by optionality, not by disclosed cash generation.",
