  topStrengths:
    - >-
      Neuralink has built the strongest public full-stack invasive BCI narrative in the field, combining implant
      hardware, robotic insertion, decoding software, and a multi-indication roadmap rather than a single-component
      product story.
    - >-
      Clinical proof is no longer purely conceptual: first-patient use arrived in 2024, public updates reached 21
      participants by January 2026, and the site network expanded beyond the U.S. into additional international
      programs.
    - >-
      Capital access remains exceptional for the category, highlighted by the June 2025 $650M Series E and participation
      from a top-tier investor syndicate.
    - >-
      The platform already shows option value beyond cursor control through CONVOY robotic-arm work and Blindsight's FDA
      Breakthrough Device Designation.
  topRisks:
    - >-
      The company remains clinical-stage with no public revenue, pricing, gross-margin, burn, or runway disclosure, so
      the business cannot yet be underwritten on operating fundamentals.
    - >-
      Commercialization still depends on FDA marketing authorization, coding and reimbursement architecture, and durable
      post-trial support obligations that the public record does not show as solved.
    - >-
      Device reliability and continuity risk remain real: Neuralink disclosed thread retraction in the first
      participant, while public evidence still lacks revision-rate, adverse-event, and explant-reserve detail.
    - >-
      Governance and trust overhangs — animal-welfare scrutiny, labor allegations, opaque executive-role mapping, and
      unresolved documentary closure on some adverse matters — can widen the discount to intrinsic technology value.
    - >-
      At roughly the 2025/2026 price anchor, valuation appears stretched relative to the tiny disclosed installed base
      and the absence of public commercial proof.
  unresolvedGaps:
    - >-
      No public revenue bridge exists: pricing, reimbursement receipts, revenue mix, gross margin, burn, debt, and
      runway remain undisclosed.
    - >-
      Lifetime capital raised and the full cap-table / liquidation-preference structure are not reconciled in retained
      public evidence.
    - >-
      Public evidence does not quantify revision surgeries, serious adverse events, discontinuation, cohort retention,
      or a formal explant / continuity reserve.
    - >-
      The specific reimbursement plan — coding path, CMS engagement detail, and private-payer traction — is still not
      disclosed at an investor-underwritable level.
    - >-
      Governance visibility remains incomplete because the reviewed official materials do not publish a full board
      roster or a clean executive-governance map.
