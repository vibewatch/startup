summary:
  headline: >-
    Neuralink is the flagship invasive BCI platform with credible clinical and financing momentum, but absent public
    economics, unresolved reimbursement and long-term support dependencies, and a stretched ~$9B-$9.6B valuation anchor
    keep the name in research-more territory.
