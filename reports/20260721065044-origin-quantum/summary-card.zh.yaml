  topStrengths:
    - 硬件、控制、低温、云、开发者工具和 Origin Pilot 操作系统已经能看见全栈整合；这个故事比单颗芯片发布更像一个深平台。
    - 公开生态牵引指标很强：服务 145+ 个国家和地区，合作高校 60+ 所，计算任务 1.19M+ 个，云平台全球访问量 30M+ 次。
    - 在中国国家级量子推进中占据主权科技定位，公开背后有国资关联或战略投资者支持，西班牙项目也给出可见的出海叙事。
    - Wukong-180 发布显示工程确有进展，也证明公司正从实验室走向平台化交付和云端访问。
    - 金融、能源、教育、AI、生物医药和天气等应用营销铺得很宽；商业化一旦加深，长期可选项会更多。
  topRisks:
    - 没有经审计公开财务，没有公开烧钱速度和现金跑道披露，估值锚点还彼此冲突，仅靠公开信息无法精确定价。
    - 客户证据最强的是生态覆盖，最弱的是具名付费标杆客户、合同深度、留存和集中度。
    - 技术证据在整合层面较强，但容错和逻辑量子比特层面仍不完整，执行风险还很大。
    - 即使技术继续推进，出口管制和地缘紧张也可能影响合作、零部件来源和国际商业化。
    - 量子基础设施扩张仍重资本；同行证据显示，在商业化成熟前，公司很可能反复依赖融资。
  unresolvedGaps:
    - FY2024-FY2025 经审计财务报表，包括收入结构、毛利率、现金余额、烧钱速度和现金跑道。
    - 需要把 CB Insights、行业媒体和真实条款单中的 2025-2026 年估值与融资时间线对齐。
    - 具名付费客户清单、续约、集中度指标，以及由合同支撑的客户访谈。
    - 精确股权估值所需的股权结构表、优先股条款、清算优先权和股数。
    - 可靠性指标：正常运行时间、事故历史、SLA 承诺、良率数据，以及逻辑量子比特 / 容错路线图证据。
