- id: customer-expansion
  title: International and enterprise expansion
  body: |-
    The Spain integrated computing-center project is Origin’s strongest public symbol of international customer ambition. Multiple independent reports describe the partnership as an effort to build Europe’s largest integrated computing center, which implies that Origin can export not just concepts but installed capability. At the same time, the company’s enterprise-solution pages show that it is trying to sell value in practical domains such as finance, smart grid management, molecular simulation, and weather forecasting. Together, these signals suggest that Origin wants to be seen as a sovereign infrastructure supplier with exportable relevance.

    But investors should not over-read them. International project visibility does not erase geopolitical friction, and application marketing does not automatically equal scaled revenue. The customer story is therefore promising, but still transitional.
  claimRefs:
  - CU011
