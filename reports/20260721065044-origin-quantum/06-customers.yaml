chapter:
  number: 6
  title: Customers
  summary: 'Origin Quantum has credible evidence of ecosystem penetration: broad geographic reach, dozens of partner universities, heavy cloud activity, and visible international ambitions such as the Spain computing-center project. What remains under-disclosed is the monetized customer roster — public proof supports real usage, but not yet a fully transparent list of paying lighthouse accounts or contract economics.'
sections:
- id: customer-segments
  title: Customer segments and channel structure
  body: |-
    Origin Quantum’s public customer narrative is intentionally multi-layered. The company markets to universities, researchers, developers, public institutions, and enterprises at the same time. That breadth is visible in its education offerings, research publication index, developer tools, cloud platform, and vertical solution pages. Instead of defining a single buyer, Origin defines a stack of entry points. Students can enter through education and competition programs, researchers through publications and cloud access, and enterprises through applied use cases in finance, energy, biomedicine, weather, and AI.

    That segmentation strategy makes sense for a frontier computing platform where demand is still being created. It also means the customer story is stronger at the segment level than at the individual-account level. Public materials reveal the categories of users much more clearly than they reveal who pays what.
  claimRefs:
  - CU001
