- id: customer-proof
  title: Public proof points and adoption evidence
  body: |-
    Origin’s most credible public proof points are usage reach and academic ecosystem depth. The cloud platform claims service across more than 145 countries and regions, cooperation with more than 60 partner universities, more than 1.19 million computing tasks, and more than 30 million global visits. Those are meaningful adoption signals because they show the company is not confined to a closed laboratory environment. The publications and cloud-events pages reinforce that impression by showing active experimentation and engagement around the platform.

    Still, these metrics are adoption proxies, not commercialization metrics. They do not reveal paid account count, contract value, retention, or revenue mix. So the evidence supports “users exist and activity is real,” but not “customer economics are proven.”
