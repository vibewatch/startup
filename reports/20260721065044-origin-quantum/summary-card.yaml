summary:
  headline: >-
    Origin Quantum looks like one of China’s most credible full-stack quantum infrastructure companies, but incomplete
    financial disclosure, customer-transparency gaps, fault-tolerance uncertainty, and geopolitical friction keep the
    investment stance at research-more rather than conviction buy.
