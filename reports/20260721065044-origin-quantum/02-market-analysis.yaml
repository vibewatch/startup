  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public pricing sheets or procurement contracts for cloud-quantum and on-prem systems.
    whyItMatters: Without pricing, conversion from interest to monetizable demand remains hard to test.
    diligencePath: Request public tenders, reseller sheets, or customer contracts.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: roi
    missingEvidence: Named enterprise case studies with quantified outcomes and renewals.
    whyItMatters: Pilot activity is not equivalent to durable production demand.
    diligencePath: Request renewal cohorts and pilot-to-production conversion data.
    relatedQuestionRefs:
    - QM023
    - QM025
  - type: conflicting-data
    severity: minor
    topic: market-methodology
    missingEvidence: A harmonized methodology across broader quantum-industry and pure quantum-computing market estimates.
    whyItMatters: Different scopes can overstate addressable market if mixed carelessly.
    diligencePath: Keep broader and narrower market lenses separate in investor materials.
    relatedQuestionRefs:
    - QM001
    - QM019
    relatedTableRefs:
    - TM002
