- id: market-drivers
  title: Growth drivers and commercialization tailwinds
  body: |-
    The growth story is fundamentally policy-led. The Quantum Insider and Entangled Future both describe a Chinese market shaped by state direction, national labs, provincial cluster support, and strategic-fund allocation. The 15th Five-Year Plan moves emphasis from pure frontier research toward commercialization support, procurement, and manufacturing localization. In practical terms, that improves the demand environment for Origin’s full-stack strategy because local buyers can justify pilot deployments as national-capability building, not only as near-term ROI projects.

    A second driver is application adjacency. Origin does not need fault-tolerant general-purpose quantum computing to benefit from early experimentation budgets in finance, biomedicine, energy, education, or AI. Its product and solution pages are explicitly structured around these verticals. A third driver is cloud plus tooling: once developer access, competitions, and courseware exist, the market can widen even while hardware remains specialized. Those factors explain why the commercialization opportunity is real even though public revenue scale remains immature.
