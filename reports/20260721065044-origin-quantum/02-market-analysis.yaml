chapter:
  number: 2
  title: Market Analysis
  summary: Origin Quantum participates in an early but rapidly expanding China quantum-computing market that third-party research sizes at roughly $259 million in 2025 and $3.56 billion by 2034. The strongest near-term demand is policy-backed research, education, and pilot deployment rather than mass enterprise production, which makes Origin’s market attractive but still immature.
sections:
- id: market-boundary
  title: Market boundary and sizing lens
  body: |-
    The relevant market for Origin Quantum is not all “quantum” spend. It is the narrower segment where superconducting quantum-computing infrastructure, cloud access, developer software, and early application services meet actual budgets. That excludes most pure-play quantum communications infrastructure and sensing-only programs unless they directly create compute demand. Within that boundary, public market research is still sparse but usable. IMARC estimates the China quantum-computing market at USD 258.64 million in 2025 and projects it to USD 3.56 billion by 2034 at a 33.84 percent CAGR. Those figures should be treated as directional rather than audited, but they offer a market-lens far more specific than “all quantum technology.”

    For diligence, the most important implication is that Origin’s realistic addressable market is a subset of that forecast. The company sells full-stack compute hardware, cloud access, developer tools, and vertical solution narratives. That makes its TAM broader than a chip vendor’s but smaller than China’s full quantum policy complex. A reasonable framing is: TAM equals Chinese quantum-computing spend; SAM equals superconducting compute plus adjacent cloud/software deployments in research and regulated industries; SOM equals the narrow slice of workloads that can be bought or piloted today.
