  topStrengths:
  - Visible full-stack integration across hardware, control, cryogenics, cloud, developer tools, and the Origin Pilot operating system; this is a deeper platform story than a single-chip launch.
  - 'Strong public ecosystem traction indicators: 145+ countries/regions served, 60+ partner universities, 1.19M+ computing tasks, and 30M+ global visits on the cloud platform.'
  - Strategic sovereign-tech positioning inside China’s national quantum push, with public backing from state-linked or strategic investors and a visible export narrative via the Spain project.
  - Wukong-180 launch shows real engineering progress and a credible transition from laboratory work to platformized delivery and cloud access.
  - Broad application marketing across finance, energy, education, AI, biomedicine, and weather increases long-run optionality if commercialization deepens.
  topRisks:
  - No audited public financials, no public burn/runway disclosure, and conflicting valuation anchors make precise underwriting impossible from public information alone.
  - Customer proof is strongest on ecosystem reach and weakest on named paying lighthouse accounts, contract depth, retention, and concentration.
  - Technical proof is strong at the integration level but still incomplete at the fault-tolerance and logical-qubit level, leaving major execution risk.
  - Export-control and geopolitical tension can affect collaborations, component sourcing, and international commercialization even if technical progress continues.
  - Quantum infrastructure scale-up remains capital intensive; peer evidence suggests repeated financing dependence is likely until commercialization matures.
  unresolvedGaps:
  - Audited FY2024-FY2025 financial statements, including revenue mix, gross margin, cash position, burn, and runway.
  - Reconciled 2025-2026 valuation and funding chronology spanning CB Insights, trade press, and actual term sheets.
  - Named paying-customer roster, renewals, concentration metrics, and contract-backed reference calls.
  - Cap table, preferred terms, liquidation preferences, and share count needed for precise equity valuation.
  - 'Reliability metrics: uptime, incident history, SLA commitments, yield data, and logical-qubit / fault-tolerance roadmap evidence.'
disclaimer: This diligence report is based exclusively on publicly available information as of 21 July 2026. It does not constitute investment advice or a solicitation to buy or sell any security. The authors have no affiliation with Origin Quantum, its investors, or its advisers. Financial and valuation ranges in this report are analytical composites built from disclosed funding anchors, peer disclosures, and scenario analysis; they are not audited company guidance. Readers should conduct independent technical, legal, financial, and customer diligence before making any investment decision.
