  foundingLocation: Hefei High-Tech Zone, Anhui, China
  headquarters: Hefei, Anhui, China
  productSummary: Full-stack quantum platform including Wukong-series superconducting quantum computers, superconducting chips, Tianji quantum control systems, SL1000 dilution refrigeration, OriginQ Cloud, QPanda3, VQNet, and Origin Pilot quantum operating system.
  customerFocus: Universities, researchers, developers, public-sector or strategic-computing institutions, and enterprise pilots in finance, energy, weather, AI, and biomedicine, with international infrastructure ambitions via the Spain computing-center project.
  businessModel: Likely mix of hardware-system sales, quantum-cloud usage, developer-stack access, and project-based or licensed vertical applications. Public materials reveal the monetization surfaces but not the segment revenue mix or unit economics.
  stage: Late-stage private / pre-IPO; multiple disclosed funding rounds with competing 2025–2026 valuation anchors.
  fundingStatus: CB Insights public data shows eight rounds and $165.65M of disclosed total raised. Chinese trade press separately reported a nearly CNY 3B 2026 pre-IPO round at a CNY 21B pre-investment valuation. The inconsistency itself is a key diligence issue.
