- id: financial-traction
  title: Public traction, revenue proxies, and data quality
  body: |-
    Because audited revenue is missing, investors are forced to rely on proxy signals. Official cloud metrics show partner universities, countries served, visits, and task counts. Those metrics support adoption, but not monetization. Specialist analyst profiles go further and publish low-confidence revenue estimates around RMB 99.4 million or roughly $14 million for 2024. Those estimates are directionally useful because they imply real commercial activity, but they are not management-confirmed and they do not explain margin structure, deferred revenue, or cash conversion.

    This leaves Origin in an awkward middle ground: clearly beyond the purely conceptual stage, yet still materially below public-company disclosure standards. The company is more real than a hype deck, but less measurable than a conventional growth software or hardware investment. That gap is the central financial diligence issue.
