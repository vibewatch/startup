- id: overview-milestones
  title: Milestones, platform maturity, and international signal
  body: |-
    Origin Quantum’s milestone curve is strongest when viewed as a sequence of system-building achievements rather than purely as qubit inflation. Analyst profiles and company materials trace a path from early cloud and software releases, through Origin Pilot in 2021, to the 72-qubit Origin Wukong in January 2024 and the 180-qubit Wukong-180 release in May 2026. The current flagship’s public specification set — 180 computational qubits, 251 coupling qubits, 40 microseconds T1, 20 microseconds T2 echo, 99.9 percent single-qubit gate fidelity, and 99 percent two-qubit and readout fidelity — is detailed enough to support a credible engineering story. The company pairs that story with cloud-distribution metrics and ecosystem contests intended to widen developer usage.

    The Malaga computing-center agreement adds a second kind of milestone: international relevance. Supporters read it as validation that Origin can export hybrid quantum infrastructure beyond China. Critics, especially MERICS, read the same deal as a sign that Chinese quantum exports may create data and dependence risks for Europe. Both interpretations are important. Together they show that Origin Quantum has crossed from domestic prestige project into geopolitically legible technology supplier.
