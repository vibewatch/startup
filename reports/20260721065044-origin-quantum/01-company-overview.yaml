- id: overview-capital
  title: Funding, valuation, and disclosure quality
  body: |-
    Funding evidence is available, but not perfectly harmonized. The cleanest public database view comes from CB Insights, which lists eight rounds, $165.65 million of disclosed capital raised, and a latest June 7, 2026 unattributed VC round associated with Norinco, CASVC Investment, China Internet Investment Fund, Hefei Hi-Tech Investment, and Shenzhen Capital Group. The same page leaves the latest post-money valuation behind subscription, while exposing a September 2025 valuation marker of $969.89 million. Chinese trade press presents a materially larger financing picture: C114 reported a nearly CNY 3 billion pre-IPO round in 2026 at a CNY 21 billion pre-investment valuation. Those data points do not reconcile cleanly, and no audited capital table is published on the company website.

    That mismatch is itself an important diligence fact. It implies that Origin Quantum has real access to state-linked capital, but outside investors cannot yet build a single unquestioned cap-table chronology from public records alone. The company is therefore financeable, but not yet easily underwritable with public data. That is why this report treats all current valuation anchors as medium- or low-confidence unless corroborated by multiple independent sources.
  claimRefs:
