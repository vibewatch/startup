  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, committee structure, and executive bench.
    whyItMatters: Governance quality cannot be assessed from founder-scientist profiles alone.
    diligencePath: Request the latest board deck, cap table, and management org chart.
    relatedQuestionRefs:
    - QO021
    - QO024
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: A reconciled 2026 round amount and post-money valuation across Chinese media and market-intelligence databases.
    whyItMatters: Current public financing signals imply very different underwriting entry points.
    diligencePath: Obtain the latest financing memo or listing-counseling materials.
    relatedQuestionRefs:
    - QO006
    - QO023
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, burn, and cash balances.
    whyItMatters: Scale proxies cannot substitute for capital adequacy.
    diligencePath: Request audited 2024-2025 financial statements and 2026 budget.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: capital-structure
    missingEvidence: Debt facilities, credit lines, or project-finance obligations if any exist.
    whyItMatters: Leverage changes downside resilience and dilution risk.
    diligencePath: Request debt schedules and security agreements.
    relatedQuestionRefs:
    - QO022
  - type: conflicting-data
    severity: minor
    topic: ip
    missingEvidence: A single patent methodology spanning granted patents, applications, families, and publications.
    whyItMatters: Patent scale is part of the moat narrative but the public counts differ materially.
    diligencePath: Request the company patent register and external counsel summary.
    relatedQuestionRefs:
    - QO016
  - type: missing-source
    severity: minor
    topic: TO004 governance-table coverage
    missingEvidence: A fuller named leadership and management roster beyond founder-scientist disclosures.
