  name: Origin Quantum
chapter:
  number: 1
  title: Company Overview
  summary: Origin Quantum is a 2017-founded Hefei full-stack quantum-computing company spun out of the USTC/CAS ecosystem. Public evidence shows a credible technical stack, visible cloud reach, and repeated state-linked investor support, but late-stage governance and valuation disclosure remain incomplete and partially inconsistent across sources.
sections:
- id: overview-identity
  title: Identity, roots, and current stage
  body: |-
    Origin Quantum presents itself as China’s flagship full-stack quantum-computing company: the official English website frames the business around quantum machines, cloud access, developer tools, and industry solutions, while the official about page ties the company’s technical origin to the CAS Key Laboratory of Quantum Information and the University of Science and Technology of China. Public analyst profiles broadly agree on the core identity: a Hefei-based superconducting quantum startup founded in 2017 to convert a nationally important research cluster into an industrial stack. That industrialization angle matters because Origin does not market only a processor. It markets the whole operating environment — chip, control electronics, cryogenics, operating system, cloud, and vertical application software — as a sovereign domestic alternative to foreign quantum stacks.

    The company’s current stage is best described as late private and pre-IPO rather than venture infancy or public-company maturity. Public materials emphasize technical launches and ecosystem reach, not audited financial scale. The strongest current scale markers are operational proxies: cloud visits, countries served, partner universities, and the launch of Wukong-180 for global users in May 2026. That combination positions Origin Quantum as a strategic infrastructure company whose significance exceeds what public financial disclosure alone would suggest.
