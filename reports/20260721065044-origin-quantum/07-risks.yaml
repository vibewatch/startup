chapter:
  number: 7
  title: Risks
  summary: 'Origin Quantum is best framed as a high-strategic-value but high-execution-risk quantum infrastructure company. Its biggest risks are compounding ones: superconducting scaling and fault-tolerance uncertainty, export-control and geopolitical friction, thin monetization disclosure, and the capital intensity of turning visible launches into durable commercial scale.'
sections:
- id: technical-risks
  title: Technical and operating risks
  body: |-
    Origin Quantum’s technical risks begin with the reality that Wukong-180 is still a superconducting NISQ-era system, not a publicly demonstrated fault-tolerant machine. The official performance metrics are meaningful, but they do not close the gap between launching a high-spec system and sustaining logical-qubit performance. Origin’s own materials acknowledge this by describing logical-qubit and fault-tolerant capability as an upgrade path. The company’s own explainers on quantum error correction, quantum chips, and quantum-computer components also reveal how many tightly coordinated layers must work for the system to scale.

    This is not a criticism unique to Origin; it is intrinsic to the category. But for underwriting purposes it means physics and engineering risk remain first-order, even after a visible launch.
