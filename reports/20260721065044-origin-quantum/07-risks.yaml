- id: policy-risks
  title: Regulatory, export-control, and geopolitical risks
  body: |-
    Quantum computing is not an ordinary software market, and the legal sources make that clear. Chinese legal overviews frame the field as strategic and policy-relevant, while U.S. and sector analyses show that export controls and geopolitical restrictions can shape collaboration, sourcing, and cross-border commercialization. MERICS reinforces the point by emphasizing how Europe-facing ambitions for Chinese quantum firms still run through political filters.

    Origin’s Spain-linked export visibility is therefore double-edged. It validates technical ambition and international relevance, but it also increases scrutiny. The same project that proves exportability can make the company more legible to regulators and geopolitical critics. Investors should therefore interpret this section as an evidence-backed risk lens rather than as a completed disclosure set.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
