  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sla
    missingEvidence: System uptime, latency, error-rate trend, and formal support SLA metrics.
    whyItMatters: Deployment seriousness is easier to judge with operating statistics than with marketing prose.
    diligencePath: Request the latest operations dashboard and customer SLA template.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: yield
    missingEvidence: Manufacturing yield, chip defect rates, and field-return data.
    whyItMatters: Scaling claims depend on reproducibility, not only on one launch configuration.
    diligencePath: Request fab yield summaries and reliability reports.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: material
    topic: fault-tolerance
    missingEvidence: A concrete QEC roadmap with milestones and benchmark results.
    whyItMatters: The public frontier-performance case remains provisional without this.
    diligencePath: Request the internal roadmap and benchmark deck.
