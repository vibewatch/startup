      - number: '2.4'
        title: 采用约束、监管与尽调提示
        blocks:
          - type: paragraph
            body: >-
              支持上行空间的同一批来源，也说明为什么承销这个市场仍然困难。IMARC 指出量子专业人才严重短缺，并强调低温、材料、软件和系统工程叠加出的跨学科人才负担。Quantum.gov、BIS
              和法律评论显示，出口管制和本地化压力是结构性的，不是暂时性的；它们影响低温系统、组件和海外协作。与此同时，IMARC 和 McKinsey 都暗示，技术尚未走到能够轻松证明广泛生产 ROI
              的阶段。公开证据仍偏向研究使用、教育和试点。


              因此，市场有吸引力，但还不干净。Origin
              的机会存在于由战略政策支撑的早期采用环境中，而不是成熟软件品类里那种定价标准化、回报显而易见的市场。本章因此同时保留增长逻辑和方法提示：市场规模报告有用，但不能替代真实采购、重复收入或公开定价数据。
