      - number: '2.2'
        title: 买方地图与采用路径
        blocks:
          - type: paragraph
            body: >-
              量子计算在进入标准化软件预算之前，仍要先穿过机构体系，因此买方地图格外分层。高校和国家实验室重要，因为它们购买培训能力、研究访问和生态可信度。政府机构和超算中心重要，因为有政策支持的采购能在商业 ROI
              清晰之前很久，就补贴前沿基础设施。企业买方——尤其是金融、能源、生物医药、AI 和天气领域——更像试点赞助方，而非可重复放量的生产客户。Origin
              自己的解决方案页面也强化了这个结构，点名组合优化、智能电网优化、分子模拟、量子机器学习和天气预报等目标用例。


              云交付是跨越这些细分客群的桥。Origin
              把低温基础设施抽象掉之后，可以用同一访问层服务研究人员、学生和早期企业团队。这降低了采用摩擦，也把可服务市场扩展到不愿购买完整系统的机构之外。它还解释了为什么合作高校数量和云使用统计仍是今天最好的公开需求代理指标之一。
