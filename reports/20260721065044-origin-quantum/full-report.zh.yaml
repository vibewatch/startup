      - number: '1.3'
        title: 融资、估值与披露质量
        blocks:
          - type: paragraph
            body: >-
              融资证据存在，但并不完全一致。最干净的公开数据库视角来自 CB Insights：页面列出 8 轮融资、已披露融资 $165.65 million，以及最新一轮 June 7, 2026 未具名 VC
              融资，关联投资方包括 Norinco、CASVC Investment、China Internet Investment Fund、Hefei Hi-Tech Investment 和 Shenzhen
              Capital Group。同一页面把最新投后估值放在订阅墙后，但露出 September 2025 的估值标记 $969.89 million。中国行业媒体给出显著更大的融资图景：C114 报道称，公司
              2026 年完成近 CNY 3 billion 的 pre-IPO 轮融资，投前估值 CNY 21 billion。这些数据点无法干净对齐，公司官网也没有发布经审计股权结构表。


              这种错位本身就是重要尽调事实。它说明 Origin Quantum
              确实能获得国资背景资本，但外部投资人仅靠公开记录，还无法建立一条无争议的股权结构时间线。因此，公司具备融资能力，但还不能被公开数据轻松承销。这也是本报告把当前所有估值锚点都视为中置信度或低置信度的原因，除非有多个独立来源相互印证。
