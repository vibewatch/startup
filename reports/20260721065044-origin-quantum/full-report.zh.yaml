              但护城河耐久性不是绝对的。云访问降低了上手摩擦，也可能降低普通用户的切换摩擦。公开同行往往披露更强商业牵引，或更强容错信号。因此，这条护城河是情境性的，不是普适性的：在中国主权量子建设内部更强；在与资本更充足或披露更充分的对手争夺全球前沿心智时更弱。
