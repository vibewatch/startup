            body: >-
              在系统层面，Wukong-180 是一台面向云的超导量子计算机，围绕一颗 180 个计算量子比特、251
              个耦合量子比特的芯片构建。官方资料把架构拆成三根硬件支柱——芯片、控制和环境支撑——再加三层软件——操作系统、云平台和应用。这个拆分很重要，因为它展示了 Origin
              如何理解产品化。芯片不是孤立出售的，而是嵌入受控运行环境，并通过软件编排交付给用户。


              Origin Pilot 是这个模型里的胶水。公开文档描述了调度、监控、噪声修正、后端抽象和混合任务管理。QPanda3 和 VQNet 则更靠近开发者与算法层。这套架构不能证明前沿领导力，但能证明产品认真度。
