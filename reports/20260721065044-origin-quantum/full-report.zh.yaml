            body: >-
              商业风险的核心，不在于 Origin
              是否有用户，而在于这些用户能否足够快地转化为耐久且有利润的账户。公开证据强力支持生态活动，但尚未支持成熟的留存、集中度或变现客户深度披露。这意味着投资人无法干净区分探索性使用和生产关键采用。公开治理披露也偏薄，让外界更难判断一个研究出身的组织将如何治理资本配置和规模化纪律。


              人才又增加了一层风险。全栈量子系统需要横跨物理、低温、控制、软件和应用的稀缺跨学科人才。人才竞争既全球化，也具有战略性。
