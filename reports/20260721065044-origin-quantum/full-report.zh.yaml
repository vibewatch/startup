            body: >-
              反向证据是真实的。Quantinuum 的融资历史、IonQ 的收入规模，以及 IBM 嵌入式企业覆盖，都展示了 Origin
              尚未公开匹配的东西：要么是大规模披露商业化，要么是可审计的企业覆盖宽度。分析师来源还认为，Origin 落后于领先的容错叙事。对投资人而言，这意味着不能因为 Origin
              的国内战略角色，就把它按前沿领导者来估值。


              正向对照同样真实。少有同行能把国产芯片、控制、低温、OS、云和应用层放进同一个以中国为中心的平台。在正在分岔的量子市场里，这有战略价值。因此，竞争结论是平衡的：Origin
              没有赢下透明度竞赛，也没有明确赢下前沿容错竞赛，但它仍可能是中国最有战略意义的主权全栈量子平台。


              竞争承销不应只盯量子比特数，还要看商业模式耐久性、技术栈宽度，以及在中国市场里主权定位相对全球生态规模有多重要。


