      - number: '2.3'
        title: 增长驱动与商业化顺风
        blocks:
          - type: paragraph
            body: >-
              增长故事本质上由政策牵引。The Quantum Insider 和 Entangled Future 都描述了一个由国家方向、国家实验室、省级集群支持和战略基金配置塑造的中国市场。第 15
              个五年规划把重心从纯前沿研究转向商业化支持、采购和制造本地化。落到实践里，这改善了 Origin 全栈战略的需求环境，因为本地买家可以把试点部署解释为国家能力建设，而不只是短期 ROI 项目。


              第二个驱动来自应用邻近性。Origin 不需要等到容错通用量子计算成熟，才能从金融、生物医药、能源、教育或 AI
              的早期实验预算中受益。它的产品页和解决方案页明确围绕这些垂直行业组织。第三个驱动是云与工具链：一旦开发者访问、竞赛和课程体系存在，硬件仍然专业化时，市场也能继续扩宽。这些因素解释了为什么商业化机会真实存在，尽管公开收入规模仍不成熟。
