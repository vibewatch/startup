            body: >-
              Origin Quantum 的技术风险首先来自一个现实：Wukong-180 仍是超导 NISQ
              时代系统，不是公开证明的容错机器。官方性能指标有意义，但它们没有填平高规格系统发布与持续逻辑量子比特性能之间的缺口。Origin
