      - number: '5.4'
        title: 差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              技术优势逻辑很清楚：技术栈宽度、软件编排和自研子系统。技术风险逻辑同样清楚：Origin 仍未公开展示足以消除核心工程不确定性的容错证据、正常运行时间统计或制造良率数据。就连 Origin
              自己的资料，也把逻辑量子比特能力描述为未来方向，而不是当前成果。PostQuantum 的外部画像更明确地指出了差距：Origin 落后于西方前沿容错项目。


              因此，Origin 的产品故事应被理解为工程成熟度加主权一体化，而不是物理问题已经解决。公司作为已部署的 NISQ
              时代平台看起来可信，但作为近期容错胜出者，证明还不足。投资人应拆开这两个产品主张，不能让其中一个替代另一个。


              因此，技术逻辑在被评估为一个拥有真实部署界面的集成平台时最强；在被评估为已经越过今天工程瓶颈、公开证明的容错计算领导者时最弱。


              本章保持谨慎的另一个原因是，现场可靠性指标、客户 SLA 语言和重复服务证据在公开文件中仍大体缺席。更强的产品投资逻辑需要证明工程集成正在转化为生产环境中可预测的运行表现。如果 Origin
              披露正常运行时间历史、服务指标，以及更清晰的证据，证明云用户和装机系统用户把这套技术栈体验为可靠运行产品，而不是一次性工程里程碑，公开证明会显著改善。
