chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、根基与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum 把自己定位为中国旗舰级全栈量子计算公司：英文官网围绕量子机器、云访问、开发者工具和行业解决方案展开；官方 About 页面则把公司的技术源头连接到 CAS Key
              Laboratory of Quantum Information 和 University of Science and Technology of
              China。公开分析师画像大体认同这一核心身份：一家位于合肥的超导量子创业公司，2017 年成立，目标是把一个具有国家重要性的科研集群转化为工业化技术栈。这个工业化角度很关键，因为 Origin
              不是只卖处理器。它把芯片、控制电子、低温系统、操作系统、云和垂直应用软件打包成完整运行环境，作为海外量子栈的主权国产替代。


              公司当前阶段更接近私营后期和 IPO 前，而不是创业早期或成熟上市公司。公开资料强调技术发布和生态覆盖，而非经审计财务规模。当前最强的规模标记是运营代理指标：云访问量、服务国家、高校伙伴，以及 May 2026
              面向全球用户发布 Wukong-180。这个组合让 Origin Quantum 更像一家战略基础设施公司，其重要性超过单看公开财务披露所能体现的水平。
