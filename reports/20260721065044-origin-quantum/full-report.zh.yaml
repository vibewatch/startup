      - number: '5.3'
        title: 部署、支持与验证
        blocks:
          - type: paragraph
            body: >-
              对一家前沿硬件供应商来说，公司公开资料对部署步骤的描述异常明确：供货、安装、测试、支持和维护都被点名。这很重要，因为它释放出一个信号：公司愿意像工业系统供应商那样运作，而不是停留在实验室研究团队。云层把同一部署逻辑延伸给永远不会拥有硬件的用户。因此，Origin
              可以用同一套更宽的技术栈，同时服务装机系统客户和远程用户。


              验证也部分体现在论文索引和活跃活动日历里。论文页面展示了科学和应用工作负载中的使用，云活动页面则展示竞赛、激励项目和培训课程，扩大用户基础。这些不能替代 SLA
              或正常运行时间指标，但它们是一个活跃产品生态的可信证据。
