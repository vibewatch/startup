      - number: '8.3'
        title: 折价、溢价与情景设计
        blocks:
          - type: paragraph
            body: >-
              Origin 既有理由拿战略溢价，也必须承受硬折价。溢价来自全栈整合、主权科技相关性、Wukong 的可见发布，以及西班牙项目这类国际基础设施雄心。折价来自经审计披露偏薄、客户变现不清、容错证明未解，以及地缘政治
              / 出口管制摩擦。换句话说，战略故事是真的，但风险还没有完全拆掉。


              因此，情景分析比单点估值更站得住。下行情景靠近较低的公开锚点，并施加较大的披露折价。上行情景可以承认，国内战略资本支付的价格可能远高于单靠西方式经审计可比公司能支撑的水平。中间情景应奖励平台价值，同时继续惩罚不透明度。
