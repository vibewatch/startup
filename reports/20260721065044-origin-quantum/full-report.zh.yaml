  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与战略定位
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum 同时在三层竞争。第一层是前沿既有玩家和公开量子品牌，例如 IBM、Google、IonQ、Rigetti 和 Quantinuum。第二层是中国同行，例如 QuantumCTek 和
              SpinQ，它们切入国内生态的相邻环节。第三层是替代品：经典 HPC、AI 加速器，以及能满足部分探索性工作负载、且无需专用量子硬件的公有云实验环境。这一点很重要，因为 Origin
              最强的主张不是自己领先每一个前沿指标。它最强的主张，是自己是中国最可见的一体化国产计算栈。


              这种定位让公司不太像单一模态硬件实验室，更像一套主权平台战略。因此，正确问题不是“Origin 比 IBM 或 IonQ 更大吗？”而是“相较依赖海外云、海外组件或更窄产品范围的同行，Origin
              是否拥有更多以中国为中心的价值链？”在这个框架下，即便公开市场同行规模更大、透明度更高，Origin 仍具备战略差异化。
