      - number: '1.4'
        title: 里程碑、平台成熟度与国际信号
        blocks:
          - type: paragraph
            body: >-
              如果把 Origin Quantum 的里程碑曲线看成一连串系统搭建成果，而不是单纯的量子比特膨胀，它最有说服力。分析师画像和公司资料勾勒出一条路径：早期云和软件发布，2021 年推出 Origin
              Pilot，January 2024 发布 72 量子比特 Origin Wukong，May 2026 发布 180 量子比特 Wukong-180。当前旗舰机的公开规格足够详细，能支撑一个可信工程故事：180
              个计算量子比特、251 个耦合量子比特、40 microseconds T1、20 microseconds T2 echo、99.9 percent 单量子比特门保真度，以及 99 percent
              双量子比特和读出保真度。公司又把这个故事与云分发指标和生态竞赛相连，试图扩大开发者使用。


              Malaga 计算中心协议增加了另一类里程碑：国际意义。支持者把它解读为 Origin 能把混合量子基础设施出口到中国之外的验证。批评者，尤其是
              MERICS，则把同一交易解读为中国量子出口可能给欧洲带来数据和依赖风险的信号。两种解读都重要。放在一起看，它们表明 Origin Quantum 已经从国内声望工程，跨入了地缘政治可识别的技术供应商范畴。
