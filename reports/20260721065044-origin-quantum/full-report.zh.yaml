      - number: '4.4'
        title: 承销结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论很直接：Origin Quantum 有可信的收入架构，但损益表披露不足。公司几乎肯定在技术栈多层变现，但公开证据没有揭示结构、利润率、留存、流失、现金消耗或净现金。这让干净的 DCF 或 SaaS
              式承销不可能成立。它也意味着，私募估值工作除了前沿量子公司通常面对的技术、地缘政治和商业化折价，还必须纳入披露折价。


              目前最可辩护的结论是，Origin
              具备战略融资能力，但不能靠公开数据承销。下一步尽调不是再读一篇叙事文章，而是拿到经审计财务、已签订单管线和融资文件。没有这些，本章可以解释商业模式及其可能的资本强度，但无法验证经营质量。


              在经审计收入结构、现金和融资条款出现之前，投资人应把每个公开估值锚点都当作指示性信息，而非决定性信息，并在任何承销模型中加入实质性披露折价。


              因此，扎实的财务尽调不仅要测试融资渠道是否顺畅，还要测试回款转化、项目利润率、云变现和融资优先权结构。这些输入对估值置信度的改变，会远大于另一篇泛泛的媒体文章。
