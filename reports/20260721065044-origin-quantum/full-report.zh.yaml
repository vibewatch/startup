  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值锚点及可靠性
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum 的公开估值图景一上来就是冲突，而不是精确。一个锚点来自 CB Insights：它在 2025 年 9 月给出约 $969.89 million 的估值标记。另一个锚点来自
              C114：其报道称 2026 年 IPO 前融资对应 CNY 21 billion 融资前估值。若逐字读取，这两组数字对应的置信区间会完全不同。更合理的理解不是一个必然为真、另一个必然为假，而是 Origin
              私募融资的公开可见度并不完整。


              这会立即影响投资测算。公开锚点分歧这么大，不能靠单条标题给公司定价。正确做法是先圈出区间，再解释哪些因素把公司推向区间下半段或上半段。
