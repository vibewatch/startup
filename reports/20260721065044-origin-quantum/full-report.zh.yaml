      - number: '1.2'
        title: 创始人、治理与领导层集中度
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum 的公开创始人叙事格外偏科学。郭国平教授在官方和分析师资料中多次作为运营创始人与技术架构师出现；郭光灿院士则被呈现为资深科学背书人，其工作推动形成了公司所源出的 USTC-CAS
              量子集群。这给一家中国民营深科技创业公司带来罕见的科学合法性，但也让公开故事集中在较窄的领导圈层上。已审阅资料没有呈现完整公开董事会名单、财务职能，或能独立可见的第二梯队管理层。这在中国前沿硬件公司里并不少见，但尽调上意味着公司的公开治理披露落后于技术野心。


              缺少详细董事会图谱之所以重要，是因为 Origin 正在从科研声望转向资本密集型商业化。投资人需要知道，谁能治理采购周期、出口管制应对、供应链本地化和最终 IPO
              准备。现有证据仍指向一个创始科学家模型，公开管理透明度有限。结果是：技术领导力信号置信度高，治理信号置信度中等。
