companyProfile:
  summary: >-
    Origin Quantum（本源量子）是一家总部位于合肥的中国量子计算公司，2017 年从 USTC / CAS 量子信息生态中走出。公司销售一套全栈平台，覆盖超导量子硬件、控制系统、低温基础设施、云访问、开发者工具和
    Origin Pilot 操作系统。其 2026 年公开产品叙事围绕第四代超导量子计算机 Wukong-180；采用叙事则围绕云平台已服务 145+ 个国家 / 地区、60+ 所合作高校、1.19M+ 次计算任务和 30M+
    次全球访问。Origin 具备战略重要性和技术可信度，但财务披露仍不足，也暴露在地缘政治风险之下。
  foundedDate: '2017-01-01'
  founders:
    - name: Guo Guoping
      role: 创始人 / 首席科学家
      background: 一位与 USTC 相关的量子科学家，公开资料将其列为 Origin Quantum 的创始人与技术负责人。
      claimRefs:
        - CO005
    - name: Guo Guangcan
      role: 创始科学背书人
      background: 一位院士，公开资料将其列为来自 USTC / CAS 生态的创始科学背书人。
      claimRefs:
        - CO006
  foundingLocation: Hefei High-Tech Zone, Anhui, China
  headquarters: Hefei, Anhui, China
  productSummary: 全栈量子平台，包括 Wukong 系列超导量子计算机、超导芯片、Tianji 量子测控系统、SL1000 稀释制冷机、OriginQ Cloud、QPanda3、VQNet 和 Origin Pilot 量子操作系统。
  customerFocus: 面向高校、研究人员、开发者、公共部门或战略计算机构，以及金融、能源、天气、AI、生物医药等领域的企业试点；同时借西班牙计算中心项目推进国际基础设施布局。
  businessModel: 可能由硬件系统销售、量子云用量、开发者栈访问，以及项目制或授权式垂直应用构成。公开资料展示了可变现界面，但没有披露分部收入结构或单位经济。
