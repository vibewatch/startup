  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum
              面对的可投市场不是全部“量子”支出，而是更窄的一段：超导量子计算基础设施、云访问、开发者软件和早期应用服务与真实预算相交的地方。除非直接创造计算需求，多数量子通信基础设施和仅做传感的项目都应排除在外。在这个边界内，公开市场研究仍稀疏，但可用。IMARC
              估计，中国量子计算市场 2025 年为 USD 258.64 million，并预计到 2034 年以 33.84 percent CAGR 增至 USD 3.56
              billion。这些数字应被当作方向性参考，而非经审计事实，但它们提供了一个比“所有量子技术”更具体的市场口径。


              尽调上最重要的含义是，Origin 的现实可服务市场只是上述预测的一部分。公司销售全栈计算硬件、云访问、开发者工具和垂直解决方案叙事。这让它的 TAM
              比芯片供应商更宽，但比中国完整量子政策综合体更窄。合理框架是：TAM 等于中国量子计算支出；SAM 等于超导计算加上研究和受监管行业中的相邻云 / 软件部署；SOM 等于今天已经能购买或试点的那一小段工作负载。
