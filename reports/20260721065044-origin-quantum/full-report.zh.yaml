      - number: '6.4'
        title: 集中度、披露与承销风险
        blocks:
          - type: paragraph
            body: >-
              核心客户风险在于披露深度。公开资料让人容易看出 Origin
              希望需求来自哪里，但更难验证这些需求的规模、黏性和付费质量。具名灯塔客户稀少。客户集中度没有披露。公开证据没有区分教育活动与企业生产使用，也没有区分公共部门赞助与经常性商业需求。MERICS
              还强调，地缘政治敏感性会过滤中国量子公司进入海外市场的通道。


              这并不推翻客户故事。它意味着应把这个故事按“生态牵引 + 合同透明度不足”来承销。下一步尽调是客户访谈、合同审阅和队列分析，而不是更多漏斗顶部营销指标。


              因此，未来客户尽调应从覆盖指标转向账户质量：谁付费、多久续约一次、报告了什么结果，以及收入在研究、公共部门和企业桶之间有多集中。


              这个区分很重要，因为一家基础设施公司可以在积累高质量经常性收入之前很久，就先积累用户。因此，客户章节对采用宽度保持支持，但在具名参考客户和续约得到验证之前，对变现账户深度刻意保守。一个耐久的客户投资逻辑，必须把这些漏斗顶部证据转化为参考客户、续约、付费用量和分部集中度数据，并经得起更硬的承销标准。


              最现实的近期尽调推进应当分段进行：确认高校和研究基础是否会导入付费云使用，测试战略项目是否转化为长期合同，并把象征性国际胜利与有经济意义的经常性客户分开。这个动作很可能把本章从生态乐观，推进到更硬的商业质量判断。
