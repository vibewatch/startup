      - number: '8.4'
        title: 估值底线立场
        blocks:
          - type: paragraph
            body: >-
              截至 2026-07-21，最站得住的立场既不是把 Origin
              打成炒作，也不是照单全收最高的公开私募估值。公开证据能支持三件事：公司有真实战略价值、真实工程进展和真实期权价值。公开证据不能支持一个精确、高置信的点估值。因此，投资人应把 Origin
              视为有溢价的未上市战略资产，但可写进投资模型的价值上限受披露质量约束。


              落到模型上，公开数据支持一个宽区间：低端由数据库中低于 $1 billion 的锚点约束，高端由媒体报道约 $2.9 billion
              等值的上方锚点约束。在经审计财务、客户证明和股权结构条款出现前，中点应低于最乐观的媒体数字。


              因此，正确的公开市场姿态是纪律，而不是虚假的精确：Origin 可能值得战略溢价，但证据集仍要求投资人在接受最高估值叙事前打出有意义的折扣。


              实务含义是，投资人该锚定决策质量，而不是最聪明的点估值。一个更宽但推理更扎实的估值区间，比建立在薄弱披露和不完整市场证据上的紧数字更站得住。情景纪律因此比胆量更重要。公司可以具备战略重要性，同时仍然过于不透明，难以给出窄区间估值；本章因此保持宽区间和保守建议。


              这种姿态也与报告其余部分一致：Origin 不像该被一笔勾销的资产，但也不像能只靠公开数据自信定价的资产。最站得住的投资人做法，是在模型里保留上行期权，同时要求每个乐观假设都经受披露、变现和政策现实的检验。
            claimRefs:
              - CV003
              - CV027
              - CV028
              - CV032
              - CV033
              - CV034
