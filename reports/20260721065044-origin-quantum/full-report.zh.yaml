      - number: '8.2'
        title: 可比框架与同业映射
        blocks:
          - type: paragraph
            body: >-
              最合适的公开同业框架，要把上市与未上市可比公司放在一起看。IonQ 和 Rigetti 提供上市量子公司的当前公开市场参照；Quantinuum 是未上市全栈战略可比；IBM
              更像生态天花板，而不是直接可比。这些同业说明，前沿量子股权哪怕当前收入不高，也能拿到很大的估值，尤其当投资人承保的是长期战略期权，而不是短期盈利。


              同业也说明，抄捷径很危险。公开流动性、司法辖区、披露质量和商业模式差异，让估值倍数一键平移并不可靠。Origin
              还需要针对不透明度、地缘政治和发展阶段做调整。因此，投资人应把本节视作有证据支撑的风险镜头，而不是一套完整披露材料。
