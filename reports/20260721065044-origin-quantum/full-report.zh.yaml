        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum
              卖的是平台，不是单个盒子。官网把这个平台组织成机器、云、开发者工具和行业解决方案。这已经指向一个多层客户工作流：买方可以把公司当作硬件供应商、云提供商、工具栈，或应用量子合作伙伴来接触。硬件目录覆盖旗舰
              Wukong-180 计算机、超导芯片、Tianji 测控系统、稀释制冷、微波互连和激光退火。软件目录覆盖 Origin Pilot、OriginQ Cloud、QPanda3 和
              VQNet。应用层覆盖金融、教育、能源、生物医药和天气。

              这种宽度很重要，因为它是 Origin 全栈主张的基础。客户可以先为学习或实验采用某一层，等工作负载成熟后再迁移到更深的技术栈依赖。这比单纯讲量子比特数更有产品叙事力。
