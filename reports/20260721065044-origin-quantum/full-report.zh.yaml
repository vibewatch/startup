  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现界面
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum
              的公开财务故事从商业模式宽度开始，而不是从已披露收入开始。公司销售量子机器、云访问、开发者工具和垂直应用。这意味着变现可以来自一次性硬件销售、经常性或按用量计费的云消耗、企业软件和编排，以及金融、生物医药、能源及相邻行业的项目制解决方案工作。战略上，这很有吸引力，因为它提供了多个射门机会；但它也让利润率分析更复杂：低温硬件交付的经济模型，不是云运行时或教学平台的经济模型。


              公开问题在于，Origin 没有披露任何一层贡献多少。没有经审计的硬件、软件、服务和云拆分。没有发现价目表。没有公开 ARR 或递延收入桥。因此，正确表述不是“模型不清楚”，而是“模型看得懂，但单位经济不透明”。
