              能力比较先从技术路线开始。IonQ 和 Quantinuum 大体代表离子阱领导者，Rigetti 和 Origin 则代表超导路径。IBM 和 Google
              是既有玩家，量子业务嵌在更大的企业和研究体系里。SpinQ 更偏教育。QuantumCTek 更偏通信与基础设施。放在这个场域里，Origin
              的全栈主张很突出：官方和分析师资料反复把它描述为覆盖芯片、低温、控制、操作系统、云和应用的技术栈。这种宽度重要，因为客户买的往往是可用环境，而不是裸量子比特数。


              客户焦点也不同。IonQ 已经披露商业收入结构和国际销售。Rigetti 强调政府和研究装机。Quantinuum 倚重性能领导力、软件和全球合作。相比之下，Origin
              看起来更偏研究、教育、公共部门和战略基础设施。这不等于弱，而是变现方式不同、政策暴露也不同。
