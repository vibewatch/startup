            body: >-
              即便 Origin 自身数字不透明，同行披露也说明公司很可能资本密集。IonQ 2025 年业绩显示收入 $130 million，但调整后 EBITDA 仍大幅亏损；Rigetti 2025 年收入仅 $7.1
              million，却伴随非常可观的净亏损和数亿美元资产负债表资本。Quantinuum 的 $300 million 和 $600 million
              私募轮也传递同一信息：前沿全栈量子公司要吸收多年资本，成熟经营杠杆才会出现。


              Origin 的公开资本证据彼此不一致，但方向上支持同一结论。CB Insights 显示一段规模不小但不完整的已披露融资历史；中国媒体报道了一轮大得多的 pre-IPO
              融资。两个版本都意味着公司依赖股权融资，而不是自我供血。两个版本都无法得出有信心的公开现金跑道计算。因此，投资人应在经审计报表证明相反之前，假设公司仍依赖持续融资。
