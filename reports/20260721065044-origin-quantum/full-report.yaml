      - number: '3.2'
        title: Capability breadth, modality, and customer focus
        blocks:
          - type: paragraph
            body: >-
              Capability comparison starts with modality. IonQ and Quantinuum largely represent trapped-ion leadership,
              while Rigetti and Origin represent superconducting pathways. IBM and Google are incumbents whose quantum
              efforts sit inside broader enterprise and research machines. SpinQ is more education oriented. QuantumCTek
              is more communications and infrastructure oriented. Against that field, Origin’s full-stack claim stands
              out: official and analyst materials repeatedly describe a stack spanning chips, cryogenics, control,
              operating system, cloud, and applications. That breadth matters because customers often buy a usable
              environment rather than a bare qubit count.


              Customer focus also differs. IonQ has already disclosed commercial revenue mix and international sales.
              Rigetti emphasizes government and research installations. Quantinuum leans on performance leadership,
              software, and global partnerships. Origin, by contrast, looks more research, education, public-sector, and
              strategic-infrastructure oriented. That does not make it weak; it makes it differently monetized and
              differently exposed to policy.
