      - number: '2.4'
        title: Adoption constraints, regulation, and diligence caveats
        blocks:
          - type: paragraph
            body: >-
              The same sources that support the upside also reveal why underwriting this market remains difficult. IMARC
              identifies an acute shortage of skilled quantum professionals and highlights the interdisciplinary talent
              burden created by cryogenics, materials, software, and systems engineering. Quantum.gov, BIS, and legal
              reviews show that export controls and localization pressure are structural rather than temporary; they
              affect cryogenic systems, components, and foreign collaboration. Meanwhile, IMARC and McKinsey both imply
              that the technology is not yet at the point where broad production ROI is easy to prove. Public evidence
              still skews toward research use, education, and pilots.


              This means the market is attractive, but not yet clean. Origin’s opportunity exists inside an
              early-adopter environment supported by strategic policy, not inside a mature software category with
              standardized pricing and obvious payback. The chapter therefore preserves both the growth case and the
              methodological caveat: market-size reports are useful, but they are not substitutes for real procurement,
              repeat revenue, or public pricing data.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM032
              - CM033
              - CM037
