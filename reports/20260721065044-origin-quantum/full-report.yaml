  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum’s public financial story begins with business-model breadth rather than disclosed revenue.
              The company markets quantum machines, cloud access, developer tools, and vertical applications. That means
              monetization can occur through one-off hardware sales, recurring or usage-based cloud consumption,
              enterprise software and orchestration, and project-based solution work in finance, biomedicine, energy,
              and adjacent industries. This is strategically attractive because it provides multiple shots on goal, but
              it also complicates margin analysis: the economics of a cryogenic hardware delivery are not the economics
              of a cloud runtime or a teaching platform.


              The public problem is that Origin does not disclose how much any of these layers contributes. There is no
              audited split between hardware, software, services, and cloud. No price sheet was identified. No ARR or
              deferred-revenue bridge is public. So the right framing is not “the model is unclear” — it is “the model
              is legible, but the unit economics are opaque.”
