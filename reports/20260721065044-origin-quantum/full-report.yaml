        blocks:
          - type: paragraph
            body: >-
              Origin Quantum sells a platform, not a single box. The official site organizes that platform into
              machines, cloud, developer tools, and industry solutions. That already implies a multi-layer customer
              workflow: a buyer can encounter the company as a hardware vendor, a cloud provider, a tooling stack, or an
              applied quantum partner. The hardware catalog spans the flagship Wukong-180 computer, superconducting
              chips, Tianji control systems, dilution refrigeration, microwave interconnects, and laser annealing. The
              software catalog spans Origin Pilot, OriginQ Cloud, QPanda3, and VQNet. The applications layer spans
              finance, education, energy, biomedicine, and weather.


              This breadth matters because it is the foundation of Origin’s full-stack claim. A customer can adopt one
              layer for learning or experimentation, then migrate toward deeper stack dependence if workloads mature.
