  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lens
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Origin Quantum is not all “quantum” spend. It is the narrower segment where
              superconducting quantum-computing infrastructure, cloud access, developer software, and early application
              services meet actual budgets. That excludes most pure-play quantum communications infrastructure and
              sensing-only programs unless they directly create compute demand. Within that boundary, public market
              research is still sparse but usable. IMARC estimates the China quantum-computing market at USD 258.64
              million in 2025 and projects it to USD 3.56 billion by 2034 at a 33.84 percent CAGR. Those figures should
              be treated as directional rather than audited, but they offer a market-lens far more specific than “all
              quantum technology.”


              For diligence, the most important implication is that Origin’s realistic addressable market is a subset of
              that forecast. The company sells full-stack compute hardware, cloud access, developer tools, and vertical
              solution narratives. That makes its TAM broader than a chip vendor’s but smaller than China’s full quantum
              policy complex. A reasonable framing is: TAM equals Chinese quantum-computing spend; SAM equals
              superconducting compute plus adjacent cloud/software deployments in research and regulated industries; SOM
              equals the narrow slice of workloads that can be bought or piloted today.
