  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation anchors and their reliability
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum’s public valuation picture begins with conflict, not precision. One anchor comes from CB
              Insights, which shows a roughly $969.89 million valuation marker in September 2025. Another comes from
              C114, which reported a 2026 pre-IPO financing at a CNY 21 billion pre-investment valuation. Those numbers
              imply radically different confidence intervals if read literally. The most sensible interpretation is not
              that one is certainly true and the other false; it is that public visibility into Origin’s private-market
              financing is incomplete.


              That immediately affects underwriting. A company whose public anchors disagree this much should not be
              valued from a single headline. The right task is to bracket a range and explain what pushes the company
              toward the lower or upper half of that range.
            claimRefs:
              - CV001
              - CV002
