      - number: '8.2'
        title: Comparable framework and peer read-through
        blocks:
          - type: paragraph
            body: >-
              The best public peer frame mixes public and private comparables. IonQ and Rigetti provide current
              public-market reference points for listed quantum companies; Quantinuum provides a private full-stack
              strategic comp; IBM acts as an ecosystem ceiling rather than a direct comp. These peers show that frontier
              quantum equity can command very large valuations despite modest current revenue, especially when investors
              are underwriting long-dated strategic optionality rather than near-term profitability.


              But peers also show why shortcuts are dangerous. Public liquidity, jurisdiction, disclosure quality, and
              business-model differences make a one-click multiple transfer unreliable. Origin needs adjustments for
              opacity, geopolitics, and stage. Investors should therefore interpret this section as an evidence-backed
              risk lens rather than as a completed disclosure set.
