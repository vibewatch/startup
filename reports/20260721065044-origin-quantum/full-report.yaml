      - number: '5.4'
        title: Differentiation and technical risks
        blocks:
          - type: paragraph
            body: >-
              The technical strength case is clear: stack breadth, software orchestration, and self-developed
              subsystems. The technical risk case is equally clear: Origin still does not publicly show the kind of
              fault-tolerance evidence, uptime statistics, or manufacturing-yield data that would remove core
              engineering uncertainty. Even Origin’s own materials frame logical-qubit capability as a future direction
              rather than a current achievement. PostQuantum’s external profile makes the gap more explicit by placing
              Origin behind western frontier fault-tolerance programs.


              That means Origin’s product story should be read as engineering maturity plus sovereign integration, not
              as solved physics. The company looks credible as a deployed NISQ-era platform and less proven as a
              near-term fault-tolerant winner. Investors should separate those two product claims rather than letting
              one substitute for the other.


              The technology case is therefore strongest when evaluated as an integrated platform with real deployment
              surfaces, and weakest when evaluated as a publicly proven fault-tolerant computing leader already beyond
              today's engineering bottlenecks.


              Another reason the chapter remains cautious is that field reliability metrics, customer SLA language, and
              repeat-service evidence are still largely absent from public documents. A stronger product investment case
              would show that engineering integration is translating into predictable operating performance in
              production settings. Public proof would improve materially if Origin disclosed uptime history, service
              metrics, and clearer evidence that cloud and installed-system users experience the stack as a reliable
              operating product rather than as a one-time engineering milestone.
