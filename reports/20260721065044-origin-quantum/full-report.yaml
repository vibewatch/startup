      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is straightforward: Origin Quantum has a believable revenue architecture but an
              under-disclosed income statement. It almost certainly monetizes multiple layers of the stack, yet public
              evidence does not reveal mix, margin, retention, churn, cash burn, or net cash. That makes any clean DCF
              or SaaS-style underwriting impossible. It also means private valuation work must include a disclosure
              discount in addition to the usual technology, geopolitical, and commercialization discounts that frontier
              quantum companies already face.


              For now, the most defensible conclusion is that Origin is strategically financeable but not publicly
              underwritable. The next diligence step is not another narrative article; it is access to audited
              financials, booked pipeline, and financing documents. Without that, this chapter can explain the business
              model and its likely capital intensity, but it cannot validate operating quality.


              Until audited revenue mix, cash, and financing terms are available, investors should treat every public
              valuation anchor as indicative rather than decisive and should apply a material disclosure discount to any
              underwriting model.


              A robust financial diligence process would therefore test not only headline funding access, but also
              payment conversion, project margin, cloud monetization, and financing-preference structure. Those inputs
              would change valuation confidence more than another generic press article ever could.
