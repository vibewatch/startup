            body: >-
              Commercial risk is less about whether Origin has users and more about whether those users convert into
              durable, profitable accounts quickly enough. Public evidence strongly supports ecosystem activity, but not
              yet mature disclosure on retention, concentration, or monetized customer depth. That means investors
              cannot cleanly separate exploratory usage from production-critical adoption. Public governance disclosure
              is also thin, which makes it harder to judge how a research-rooted organization will govern capital
              allocation and scale-up discipline.


              Talent adds another layer of risk. Full-stack quantum systems need scarce interdisciplinary talent across
              physics, cryogenics, controls, software, and applications. The competition for that talent is global and
              strategic.
