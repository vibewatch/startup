      - number: '2.2'
        title: Buyer map and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is unusually layered because quantum computing still moves through institutions before it
              reaches normalized software budgets. Universities and national labs matter because they buy training
              capacity, research access, and ecosystem credibility. Government agencies and supercomputing centers
              matter because policy-backed procurement can subsidize frontier infrastructure long before commercial ROI
              is obvious. Enterprise buyers — especially in finance, energy, biomedicine, AI, and weather — matter as
              pilot sponsors rather than as repeat-volume production customers. Origin’s own solution pages reinforce
              this structure by naming portfolio optimization, smart grid optimization, molecular simulation, quantum
              machine learning, and weather forecasting as target use cases.


              Cloud delivery is the bridge across these segments. By abstracting away cryogenic infrastructure, Origin
              can serve researchers, students, and early enterprise teams with the same access layer. That lowers
              adoption friction and expands the serviceable market beyond institutions willing to purchase full systems.
              It also explains why partner-university counts and cloud-usage statistics remain some of the best public
              demand proxies available today.
