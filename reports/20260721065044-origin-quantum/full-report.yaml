            body: >-
              Peer disclosures clarify why Origin is likely capital intensive even if its own numbers are opaque. IonQ’s
              2025 results show $130 million of revenue but still a large adjusted EBITDA loss, while Rigetti reported
              only $7.1 million of 2025 revenue against a very substantial net loss and hundreds of millions of dollars
              of balance-sheet capital. Quantinuum’s $300 million and $600 million private rounds reinforce the same
              message: frontier full-stack quantum companies absorb capital for years before mature operating leverage
              appears.


              Origin’s public capital evidence is inconsistent but directionally supportive of that same conclusion. CB
              Insights shows a sizable but incomplete disclosed-funding history; Chinese media reports a much larger
              pre-IPO round. Both versions imply equity dependence rather than self-funding. Neither version yields a
