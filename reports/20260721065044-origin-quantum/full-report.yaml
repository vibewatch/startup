  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical and operating risks
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum’s technical risks begin with the reality that Wukong-180 is still a superconducting
              NISQ-era system, not a publicly demonstrated fault-tolerant machine. The official performance metrics are
              meaningful, but they do not close the gap between launching a high-spec system and sustaining
              logical-qubit performance. Origin’s own materials acknowledge this by describing logical-qubit and
              fault-tolerant capability as an upgrade path. The company’s own explainers on quantum error correction,
              quantum chips, and quantum-computer components also reveal how many tightly coordinated layers must work
              for the system to scale.


              This is not a criticism unique to Origin; it is intrinsic to the category. But for underwriting purposes
              it means physics and engineering risk remain first-order, even after a visible launch.
