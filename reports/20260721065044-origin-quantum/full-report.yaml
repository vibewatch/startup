      - number: '3.4'
        title: Competitive verdict and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is real. Quantinuum’s funding history, IonQ’s revenue scale, and IBM’s embedded
              enterprise reach all show what Origin has not yet publicly matched: either large-scale disclosed
              commercialization or auditable enterprise breadth. Analyst sources also argue that Origin trails leading
              fault-tolerance narratives. For investors, this means Origin should not be valued as if its domestic
              strategic role alone guarantees frontier leadership.


              The positive counterpoint is equally real. Few peers combine domestic chip, control, cryogenic, OS, cloud,
              and application layers under one China-centered roof. That is strategically valuable in a bifurcating
              quantum market. The competitive conclusion is therefore balanced: Origin does not win the transparency
              contest, and it does not clearly win the frontier-fault-tolerance contest, but it may still be the most
              relevant sovereign full-stack quantum platform in China.


              Competitive underwriting should therefore focus not only on qubit counts, but also on business-model
              durability, stack breadth, and how much sovereign positioning matters in China relative to global
              ecosystem scale.


              A second competitive lens is commercialization quality: public peers disclose more operating detail, while
              Origin competes by sovereignty and stack integration. That difference matters because the most relevant
              comp set is not just technical adjacency, but also disclosure depth and capital-market access.
            claimRefs:
