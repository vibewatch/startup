companyProfile:
  summary: >-
    Origin Quantum (本源量子) is a Hefei-headquartered Chinese quantum-computing company founded in 2017 out of the USTC /
    CAS quantum-information ecosystem. The company markets a full-stack platform spanning superconducting quantum
    hardware, control systems, cryogenic infrastructure, cloud access, developer tools, and the Origin Pilot operating
    system. Its public 2026 product narrative centers on the Wukong-180 fourth-generation superconducting quantum
    computer, while its adoption narrative centers on 145+ countries/regions served, 60+ partner universities, 1.19M+
    computing tasks, and 30M+ global visits on its cloud platform. Origin appears strategically important and
    technically credible, but it remains financially under-disclosed and geopolitically exposed.
