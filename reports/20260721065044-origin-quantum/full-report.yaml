      - number: '5.2'
        title: Architecture, operating model, and workflow
        blocks:
          - type: paragraph
            body: >-
              At the system level, Wukong-180 is a cloud-ready superconducting quantum computer built around a
              180-computational-qubit chip with 251 coupling qubits. Official materials frame the architecture as three
              hardware pillars — chip, control, and environmental support — plus three software layers — operating
              system, cloud platform, and applications. That decomposition is important because it shows how Origin
              thinks about productization. The chip is not sold in isolation; it is embedded in a controlled operating
              environment and presented to users through software orchestration.


              Origin Pilot is the glue in that model. Public documentation describes scheduling, monitoring, noise
              correction, backend abstraction, and hybrid task management. QPanda3 and VQNet then sit closer to the
              developer and algorithm layer. This architecture does not prove frontier leadership, but it does prove
              product seriousness.
