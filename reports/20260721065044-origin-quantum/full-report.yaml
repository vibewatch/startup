      - number: '6.4'
        title: Concentration, disclosure, and underwriting risk
        blocks:
          - type: paragraph
            body: >-
              The central customer-risk issue is disclosure depth. Public materials make it easy to see where Origin
              wants demand to come from, but much harder to verify the size, stickiness, and paying quality of that
              demand. Named lighthouse accounts are sparse. Customer concentration is not disclosed. Public evidence
              does not separate educational activity from enterprise production usage, or public-sector sponsorship from
              recurring commercial demand. MERICS also highlights the geopolitical sensitivity that can filter Chinese
              quantum firms’ access to foreign markets.


              That does not invalidate the customer story. It means the story should be underwritten as ecosystem
              traction with incomplete contract transparency. The next diligence step is customer-reference work,
              contract review, and cohort analysis — not more top-of-funnel marketing indicators.


              Future customer diligence should therefore move from reach metrics to account quality: who pays, how often
              they renew, what outcomes they report, and how concentrated that revenue is across research,
              public-sector, and enterprise buckets.


              That distinction matters because an infrastructure company can accumulate users long before it accumulates
              high-quality recurring revenue. The customer chapter therefore remains supportive on adoption breadth but
              deliberately conservative on monetized-account depth until named references and renewals are verified. A
              durable customer investment case would require translating this top-of-funnel evidence into references,
              renewals, paid usage, and segment-level concentration data that can survive a harder underwriting
              standard.


              The most realistic near-term diligence progression is therefore segmented: confirm whether the university
              and research base is a feeder into paid cloud usage, test whether strategic projects convert into
              long-duration contracts, and separate symbolic international wins from economically meaningful recurring
              customers. That exercise would likely sharpen the current chapter from ecosystem optimism into a harder
              commercial-quality judgment.
