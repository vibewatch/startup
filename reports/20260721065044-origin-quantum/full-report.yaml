      - number: '8.3'
        title: Discounts, premiums, and scenario design
        blocks:
          - type: paragraph
            body: >-
              Origin deserves both strategic premiums and hard discounts. The premium case rests on full-stack
              integration, sovereign-tech relevance, visible Wukong launches, and international infrastructure ambition
              such as the Spain project. The discount case rests on thinner audited disclosure, unclear customer
              monetization, unresolved fault-tolerance proof, and geopolitical/export-control friction. In other words,
              the strategic story is real, but it is not yet fully de-risked.


              That is why scenario analysis is more defensible than a single-point valuation. The downside case leans
              toward the lower public anchor and applies a large disclosure discount. The upside case can acknowledge
              that strategic domestic capital may pay far above what western-style audited comps alone would justify.
              The middle case should reward the platform while still penalizing opacity.
            claimRefs:
