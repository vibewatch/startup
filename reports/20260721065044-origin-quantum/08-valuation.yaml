chapter:
  number: 8
  title: Valuation
  summary: Origin Quantum appears to be a premium private strategic asset, but public data does not support a precise point estimate. The most defensible public stance is a scenario range between roughly $0.9B and $2.9B, with any case near the upper end requiring explicit discounts for disclosure opacity, customer-proof weakness, technical uncertainty, and geopolitical risk.
sections:
- id: valuation-anchors
  title: Public valuation anchors and their reliability
  body: |-
    Origin Quantum’s public valuation picture begins with conflict, not precision. One anchor comes from CB Insights, which shows a roughly $969.89 million valuation marker in September 2025. Another comes from C114, which reported a 2026 pre-IPO financing at a CNY 21 billion pre-investment valuation. Those numbers imply radically different confidence intervals if read literally. The most sensible interpretation is not that one is certainly true and the other false; it is that public visibility into Origin’s private-market financing is incomplete.

    That immediately affects underwriting. A company whose public anchors disagree this much should not be valued from a single headline. The right task is to bracket a range and explain what pushes the company toward the lower or upper half of that range.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV027
  - CV028
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: valuation-comps
  title: Comparable framework and peer read-through
  body: |-
    The best public peer frame mixes public and private comparables. IonQ and Rigetti provide current public-market reference points for listed quantum companies; Quantinuum provides a private full-stack strategic comp; IBM acts as an ecosystem ceiling rather than a direct comp. These peers show that frontier quantum equity can command very large valuations despite modest current revenue, especially when investors are underwriting long-dated strategic optionality rather than near-term profitability.

    But peers also show why shortcuts are dangerous. Public liquidity, jurisdiction, disclosure quality, and business-model differences make a one-click multiple transfer unreliable. Origin needs adjustments for opacity, geopolitics, and stage. Investors should therefore interpret this section as an evidence-backed risk lens rather than as a completed disclosure set.
