- id: competitive-moat
  title: Lock-in, distribution power, and moat durability
  body: |-
    Origin’s moat is strongest where localization, software control, and policy fit reinforce one another. Origin Pilot and OriginQ Cloud can create switching costs if users standardize workflows, teaching materials, or hybrid applications on the platform. Full-stack control also makes it easier to localize components and respond to export restrictions. MERICS and other analyst sources suggest this is precisely why China’s quantum ecosystem is becoming structurally distinct from the U.S.-aligned one.

    But moat durability is not absolute. Cloud access lowers onboarding friction, which can also lower switching friction for casual users. Public peers often disclose stronger commercial traction or stronger fault-tolerance signaling. So the moat is contextual, not universal: stronger inside China’s sovereign quantum build-out, weaker in direct competition for global frontier mindshare against better-capitalized or better-disclosed rivals.
