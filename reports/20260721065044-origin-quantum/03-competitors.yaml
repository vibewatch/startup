chapter:
  number: 3
  title: Competitors
  summary: Origin Quantum competes against better-disclosed public peers such as IonQ and Rigetti, better-funded private leaders such as Quantinuum, and diversified incumbents such as IBM and Google. Its clearest differentiation is not superior public commercialization but unusually broad China-centered full-stack control.
sections:
- id: competitive-landscape
  title: Competitive set and strategic positioning
  body: |-
    Origin Quantum competes across three layers at once. First are frontier incumbents and public quantum brands such as IBM, Google, IonQ, Rigetti, and Quantinuum. Second are Chinese peers such as QuantumCTek and SpinQ that address adjacent slices of the domestic ecosystem. Third are substitutes: classical HPC, AI accelerators, and public-cloud experimentation environments that satisfy some exploratory workloads without dedicated quantum hardware. This matters because Origin’s strongest claim is not that it leads every frontier metric. Its strongest claim is that it is China’s most visibly integrated domestic compute stack.

    That positioning makes the company less comparable to a single-modality hardware lab and more comparable to a sovereign platform strategy. The right question is therefore not “is Origin bigger than IBM or IonQ?” It is “does Origin own more of the China-centered value chain than peers that depend on foreign clouds, foreign components, or narrower product scope?” On that framing, Origin is strategically distinctive even where public-market peers are larger or more transparent.
