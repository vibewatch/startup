callouts:
  - calloutType: insight
    title: 'Strategic Divergence: In-Licensing vs. De Novo Discovery'
    body: Pathos AI avoids the multi-year cycle times and early biological attrition of de novo drug discovery by focusing exclusively on in-licensing clinical-stage assets that have demonstrated safety in Phase 1 trials. This positioning allows Pathos to deploy capital directly into patient selection and trial optimization rather than target discovery chemistry.
    claimRefs:
      - CP001
      - CP002
      - CP004
  - calloutType: risk
    title: Severe External Data Dependency and Partner Friction
    body: Pathos relies heavily on Tempus AI for de-identified multimodal patient records, paying $200 million in data licensing and model development fees alongside AstraZeneca. Because Tempus shares model access across partners and retains the core patient diagnostic relationship, Pathos lacks proprietary upstream clinical data generation, exposing it to partner renegotiation risk.
    claimRefs:
      - CP009
      - CP010
      - CP011
