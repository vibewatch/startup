  topStrengths:
    - Large disclosed funding base and late-stage private valuation support continued development runway.
    - Major strategic partnerships with AstraZeneca, Tempus AI, and Alphamab validate the platform commercially.
    - Broadening clinical pipeline gives the company multiple shots on goal beyond a single asset.
  topRisks:
    - Lead clinical assets remain early-stage, so human efficacy and safety de-risking is incomplete.
    - Burn, runway, cap-table preferences, and full investor terms remain publicly opaque.
    - Heavy data-licensing and licensing obligations create material counterparty and capital-intensity risk.
  unresolvedGaps:
    - Series D investor identities and terms remain mostly undisclosed; the cap table and preference stack are unknown
    - No audited financial statements, burn rate, cash balance, or runway disclosure is publicly available
    - Clinical efficacy data for pocenbrodib Phase 1b/2a and a public AI-to-approval track record are not yet available
