companyProfile:
  summary: >-
    Pathos AI is a venture-backed clinical-stage biotechnology company founded in 2022 and headquartered in Chicago that
    combines multimodal oncology data, causal AI, and direct clinical development to advance in-licensed and proprietary
    assets. The company’s platform centers on PathOS and Foundry, which support patient stratification, trial
    simulation, and translational biomarker work, while its commercial model relies on licensing economics, milestone
    payments, royalties, and strategic data/model collaborations rather than recurring SaaS revenue.
