  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Conventional Biopharma Workflow
      - Pathos Foundry Solution
      - Measurable Benefit
      - Operational Limitation
    rows:
      - - Asset Identification & In-Licensing
        - Heuristic literature review and broad preclinical screening
        - Multimodal causal AI screening of Phase 1 compounds with safe profiles but modest efficacy
        - Identifies hidden responsive patient subsegments in stalled or shelved assets
        - Dependent on availability and licensing terms of external clinical-stage compounds
      - - Clinical Trial Simulation
        - Empirical dose-escalation and static cohort assumptions
        - In silico simulation of thousands of trial regimens, populations, and endpoints
        - Optimizes dosing schedules and inclusion criteria before first human subject dosing
        - Simulations require high-fidelity historical data that may not capture novel toxicity
      - - Biomarker & Patient Stratification
        - Single-gene companion diagnostics (e.g., single IHC or NGS mutation)
        - High-dimensional multiomic signatures linking RNA expression and clinical outcomes
        - Increases probability of clinical trial success by enriching for likely responders
        - Requires prospective multiomic patient profiling infrastructure at clinical trial sites
      - - Adaptive Clinical Execution
        - Fixed protocol parameters with retrospective interim amendments
        - Continuous real-world evidence integration to adapt dose and cohort enrollment
        - Accelerates high-confidence go/no-go decisions during Phase 1b/2a execution
        - Regulatory acceptance of adaptive endpoints varies across global health authorities
    notes: Workflow stages reflect Pathos Foundry operational architecture and public platform descriptions; quantitative acceleration factors represent corporate model targets rather than audited historical industry averages.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE013
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer
      - Core Components
      - Primary Operating Role
      - Key Dependencies
      - Technical & Operational Risk
    rows:
      - - Multimodal Data Intake & Curation
        - Electronic health records, multiomics (DNA/RNA-seq), histopathology imaging
        - Aggregates and standardizes millions of oncology patient records across institutions
        - Data licensing partnerships (Tempus, academic medical centers)
        - Data access agreement revocability, patient privacy compliance, and EHR harmonization noise
      - - Causal Knowledge & Biological Graph Engine
        - Causal inference models, gene regulatory networks, survival association graphs
        - Maps functional connections between target modulation and clinical survival outcomes
        - Curated biological pathway knowledge and high-throughput multiomic databases
        - False-positive causal attributions due to confounding factors in observational clinical data
      - - Agentic Simulation & Trial Modeling
        - Thousands of autonomous AI agents, in silico patient cohorts, pharmacokinetic models
        - Simulates trial scenarios, dosing regimens, and drug combination synergy
        - High-performance compute clusters and validated pharmacological simulation packages
        - Model drift and overfitting to historical training populations rather than prospective cohorts
      - - Clinical Trial Execution & Deployment
        - Foundry platform clinical interfaces, biomarker assay protocols, site monitoring
        - Translates model-derived stratification signatures into prospective clinical trial screening
        - Clinical research organizations (CROs), trial sites, and diagnostic lab turnaround
        - Operational trial recruitment bottlenecks and site non-compliance with complex molecular screening
    notes: Architecture components compiled from Pathos AI technical presentations and partner releases; proprietary internal model architectures and specific software toolchains remain confidential trade secrets.
    claimRefs:
      - CE003
