callouts:
  - calloutType: risk
    title: Capital Outflow Overhang and Partner Lock-In
    body: Pathos AI has structured substantial contingent capital commitments across its pipeline—most notably US$125 million upfront and up to US$2,093 million in milestones for Alphamab's JSKN016, alongside $200 million in Tempus data licensing and model development fees. While the $365 million Series D provides near-term liquidity, ongoing capital intensity and high private valuation benchmarks create acute financing risk if clinical readouts are delayed or fail to hit efficacy endpoints.
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR012
