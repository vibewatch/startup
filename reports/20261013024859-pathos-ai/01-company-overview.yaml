company:
  name: Pathos AI
chapter:
  number: 1
  title: Company Overview
  summary: Pathos AI is a clinical-stage biotechnology company founded in 2022 that applies multimodal patient data and causal AI to precision oncology drug development, capitalized by $467 million in total funding including a $365 million Series D round at a $1.6 billion post-money valuation. The company has advanced its lead CBP/p300 inhibitor pocenbrodib into Phase 1b/2a clinical trials, established major strategic foundation-model agreements with AstraZeneca and Tempus AI, and secured ex-China commercial rights to bispecific ADC JSKN016, though key commercial metrics, burn rate, and long-term clinical efficacy remain unverified.
sections:
  - id: corporate-identity-and-foundational-model
    title: Corporate Identity and AI Platform Model
    body: Pathos AI, Inc. is a venture-backed, clinical-stage biotechnology company founded in 2022 by technology and healthcare entrepreneurs Eric Lefkofsky and Ryan Fukushima. Operating with principal corporate offices in Chicago, Illinois and New York, New York, the company is pioneering a differentiated operating model for oncology drug development that combines large-scale multimodal real-world patient data with proprietary causal artificial intelligence frameworks. Rather than focusing exclusively on de novo computational molecular design, Pathos deploys its proprietary PathOS platform to analyze transcriptomic, genomic, and clinical records to uncover biological mechanisms of drug response, identify specific patient sub-populations, and resurrect or acquire clinical-stage therapeutic assets that demonstrated tolerable safety profiles in early Phase 1 trials. While the company actively advances proprietary and partnered pipeline programs, foundational commercial scale metrics—including commercial revenue, net cash burn, and employee headcount—remain undisclosed private data.
    claimRefs:
      - CO001
      - CO002
      - CO014
    tableRefs:
      - TO001
  - id: executive-leadership-and-governance-structure
    title: Executive Leadership, Governance, and Key-Person Architecture
    body: Pathos AI is governed by an experienced executive and scientific leadership cohort spanning artificial intelligence, computational biology, and oncology drug development. In May 2025, Pathos appointed Iker Huerga as Chief Executive Officer and board member, succeeding co-founder Ryan Fukushima who previously served as Interim CEO before transitioning to an ongoing board directorship. Huerga brings more than two decades of biotechnology and machine learning expertise, having previously served as Chief Data Scientist for Oncology R&D at AstraZeneca and Executive Vice President at Tempus Labs. Scientific leadership is anchored by Chief Scientific Officer Eric Schadt, Ph.D., a pioneer in integrative computational biology, former CSO of Pacific Biosciences, and founding CEO of Sema4. Operational execution is directed by Chief Operating Officer Matt De Silva, former founder and CEO of Notable Labs and venture partner at Builders VC. Board oversight is chaired by co-founder Eric Lefkofsky (founder and CEO of Tempus AI), with institutional director representation from New Enterprise Associates Co-CEO Mohamad Makhzoumi and Amit Mehta.
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO002
  - id: capitalization-investor-syndicate-and-partnerships
    title: Capitalization History, Investor Syndicate, and Strategic Alliances
    body: Pathos AI has completed rapid institutional capital formation, accumulating approximately $467 million in total equity financing across consecutive institutional rounds. In October 2024, the company closed an oversubscribed $62 million Series C financing round led by New Enterprise Associates (NEA) with participation from Revolution Growth, Lightbank, and Builders VC at a $600 million post-money valuation, bringing total paid-in capital at that date to $102 million. In May 2025, Pathos announced a landmark $365 million Series D financing round that elevated its post-money valuation to approximately $1.6 billion. Alongside equity financing, Pathos has executed major biopharma alliances, notably entering a multi-year collaboration in April 2025 with AstraZeneca and Tempus AI to develop a multimodal oncology foundation model, committing $200 million in data licensing and model development fees to Tempus. However, specific Series D syndicate composition, share classes, liquidation preferences, and cap table allocations remain undisclosed.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
    tableRefs:
      - TO003
  - id: clinical-pipeline-and-strategic-milestones
    title: Clinical Pipeline Development and Chronological Milestones
    body: Pathos AI operating thesis is centered on advancing clinical-stage precision oncology therapeutics validated through its computational biomarker discovery engine. In March 2025, Pathos initiated patient dosing in its multicenter Phase 1b/2a clinical trial (P300-02-001, NCT06785636) evaluating lead candidate pocenbrodib—an oral, small-molecule CBP/p300 inhibitor—as monotherapy and in combination with abiraterone acetate, olaparib, or 177Lu-PSMA-617 for metastatic castration-resistant prostate cancer (mCRPC). The company substantially broadened its pipeline in August 2026 by entering an exclusive licensing agreement with Alphamab Oncology for JSKN016, a first-in-class TROP2/HER3 bispecific antibody-drug conjugate (ADC), for territories outside Greater China, agreeing to a $125 million non-refundable upfront payment and up to $2,093 million in regulatory and commercial bio-dollar milestones. Despite rapid pipeline accumulation, independent observers emphasize that clinical translation in oncology faces formidable historical failure rates, resistance mechanisms, and tumor heterogeneity, requiring rigorous Phase 2 efficacy confirmation.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
    figureRefs:
      - FO001
