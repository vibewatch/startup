callouts:
  - calloutType: "risk"
    title: "Substantial Outgoing Capital Commitments"
    body: "Pathos AI faces significant outgoing cash obligations, including a $125 million non-refundable upfront payment to Alphamab and $200 million in data licensing and model development fees to Tempus, creating high cash burn before clinical proof of concept is established."
    claimRefs:
      - "CI005"
      - "CI009"
      - "CI015"
  - calloutType: "insight"
    title: "Asset Ownership Versus Pure Software Economics"
    body: "By developing its own clinical oncology pipeline rather than operating as a pure software provider, Pathos captures substantial upside from successful therapeutic approvals, but assumes the intense capital requirements, high failure risks, and lengthy development timelines typical of clinical-stage biotechnology companies."
    claimRefs:
      - "CI002"
      - "CI013"
