            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM009
              - CM014
      - number: '2.3'
        title: 买方分层、工作流整合与预算归属
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 在生物制药领域连接三类买方和合作伙伴：全球大型药企、寻找西方临床合作伙伴的区域生物科技公司，以及需要生物标志物分层的临床阶段肿瘤开发商。对 AstraZeneca
              这类跨国药企，经济买方是掌管数百万美元战略创新预算的全球肿瘤研发执行副总裁和首席科学官。这些企业买方与 Pathos
              共建多模态基础模型，使用专有患者数据集发现新靶点并优化临床资产定位，同时不放弃对核心资产的控制。第二类是海外生物制药开发商，如中国的 Alphamab Oncology；其首席商务官和董事会寻找资金充足、能走
              FDA 监管路径并承担昂贵中国境外试验的临床开发伙伴，以换取可观预付款、分层商业特许权使用费和数十亿美元里程碑。最后，内部临床开发团队和转化医学负责人是 Pathos 自有管线的主要临床用户，直接把 PathOS
              计算平台和 Foundry 代理架构接入 Phase 1b/2 方案设计、入组标准选择和实时试验监测。
            claimRefs:
              - CM001
              - CM004
              - CM010
              - CM013
