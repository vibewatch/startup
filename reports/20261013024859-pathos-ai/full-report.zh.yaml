  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代运营范式
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 位于临床药物开发与计算生物科技交叉点，区别于纯计算发现引擎。第一代 AI 药物发现公司重在从头生成分子、筛选化学和靶点预测，Pathos
              则主要聚焦临床资产授权引进及肿瘤转化患者富集。竞争者可分四类：① Recursion Pharmaceuticals、Relay Therapeutics 和 Schrödinger 等全栈 AI
              生物科技公司与计算化学平台；②以 Tempus AI 和 Caris Life Sciences 为代表的临床级诊断及多模态数据分析供应商；③ AstraZeneca、Roche/Genentech、Pfizer
              等大型药企的现状临床发起方和内部转化生物信息团队；④ Roivant Sciences 等资产授权引进 / 临床再定位药企。Pathos 通过授权引进 pocenbrodib（P-300）和 P-500
              等临床验证化合物，并用多模态真实世界数据寻找响应患者，试图避开发现生物学的多年周期和早期淘汰。但其同时面对拥有专有临床试验数据的药企内部项目，以及向治疗开发扩张的专业临床数据聚合商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 竞争对手画像、规模与相对定位
        blocks:
          - type: paragraph
            body: >-
              对主要竞争者的细致考察显示，精准肿瘤领域的战略重点、资本结构和商业模式各不相同。Recursion Pharmaceuticals 代表规模化自动发现范式，用大规模自动化表型实验室在多个疾病领域寻找先导化合物，和
              Pathos 专注临床阶段肿瘤的定位明显不同。Relay Therapeutics 侧重基于运动的结构生物学和变构蛋白动力学，在进入临床前针对历史上难以成药的靶点发现小分子。Tempus AI
              掌握最大的真实世界临床及分子肿瘤数据库，为大型药企提供临床诊断测序和数据授权。Tempus 既是 Pathos 的关键基础设施伙伴，也可能成为未来竞争者，             
              多年基础模型合作正说明两者兼具这两重身份。AstraZeneca 等现状药企拥有庞大内部研发预算、成熟的全球商业化分销体系和深厚监管关系，但常在临床试验患者选择上遇到困难，导致有希望的化合物在未分选的 Phase
              2 试验中失败。Pathos 已融资超过 $467 million，包括 2025 年以 $1.6 billion 投后估值完成的 $365 million Series D，足以资助 pocenbrodib 和
              P-500 的中期试验，但仍落后于现有生物制药公司的数十亿美元研发储备。
            claimRefs:
              - CP001
