  - id: FE001
    title: 产品架构图
    type: stack
    summary: Pathos AI 药物开发平台从多模态数据接入到临床试验执行与治理的分层架构。
    data:
      layers:
        - label: 多模态数据基础层
          detail: 整合数百万份肿瘤患者记录，涵盖全外显子组测序、RNA 转录组学、数字病理影像与纵向临床结局。
        - label: 因果推断与生物建模层
          detail: 构建因果基因调控网络与疾病进展图谱，将治疗反应的驱动机制与相关性伪象区分开。
        - label: 智能体体外计算模拟层
          detail: 部署数千个计算模拟智能体，建模虚拟患者队列、给药方案与终点概率分布。
        - label: 离体生物筛选与验证层
          detail: 利用患者来源的生物模型开展正交湿实验与合成致死验证，确认计算模拟预测。
        - label: Foundry 临床试验优化层
          detail: 在进行中的肿瘤试验中落地预测性生物标志物分层、适应性试验设计与实时临床监测。
        - label: 制药合作与治理接口层
          detail: 为共同开发合作提供安全的多租户数据访问、联合指导委员会监督与监管文件。
    approximationNotes: 架构图依据 Pathos AI 公开的平台描述、合作伙伴公告与专利披露；专有算法组件被抽象为功能层。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE008
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 以六个阶段描绘 Pathos AI 如何从计算资产搜寻一路连接生物制药合作伙伴与临床研究者，直至临床执行和商业里程碑。
    data:
      items:
        - label: 候选资产搜寻
          stage: 候选资产搜寻
          actor: 生物制药许可方与 Scout Engine
          action: Screening clinical-stage compounds with known safety profiles but ambiguous responder populations.
          touchpoints:
            - 公开临床试验注册库
            - 合作伙伴资产数据库
            - PathOS Scout 机器学习数据摄入
          outcome: Identification of underappreciated compounds such as FT-7051, PRT811, and JSKN016
        - label: 计算模拟评估
          stage: 计算模拟多模态评估
          actor: Pathos AI 研究团队与 Tempus 数据引擎
          action: Simulating response hypotheses across 200+ PB of multimodal clinical, molecular, and imaging records.
          touchpoints:
            - Tempus 多模态肿瘤数据集
            - 因果基因表达算法
            - 离体生物验证筛选
          outcome: Computational stratification signature and target patient subgroup identification
        - label: 合作伙伴许可
          stage: 合作伙伴许可与交易设计
          actor: 生物制药合作伙伴（Alphamab、Novo Nordisk、Prelude）
          action: Negotiating exclusive territory development licenses or multi-party co-development pacts.
          touchpoints:
            - 全球或大中华区以外地域许可协议
            - 预付款与里程碑条款清单（JSKN016 预付款 $125M）
            - 战略共同开发章程（AstraZeneca/Tempus）
          outcome: Secured pipeline ownership with milestone and royalty payment structures
        - label: 试验分层
          stage: 生物标志物与适应性试验设计
          actor: 临床开发团队与试验研究者
          action: Embedding molecular signatures and patient stratification criteria into clinical study protocols.
          touchpoints:
            - FDA / 监管方案提交
            - 试验中心选择算法
            - 前瞻性患者筛选标准
          outcome: Enrichment protocols designed to increase probability of trial success
        - label: 临床执行
          stage: 临床执行与患者入组
          actor: 临床肿瘤中心与已入组患者
          action: Administering precision therapeutics to molecularly matched patient populations across multicenter sites.
          touchpoints:
            - 多中心试验入组中心
            - 1b/2a 期剂量探索队列（203 名 mCRPC 患者）
            - 持续监测安全性、PK/PD 与 PSA 反应
          outcome: Real-world human clinical efficacy and biomarker validation data
        - label: 商业扩张
          stage: 下游扩张与商业化
          actor: 全球生物制药商业化合作伙伴
          action: Out-licensing validated phase 2 assets or commercializing precision medicines in licensed territories.
          touchpoints:
            - 下游商业里程碑达成
            - 按汇总净销售额执行分层版税
            - 根据试验反馈重新训练下一代模型
          outcome: Compound platform learning and commercial milestone monetizations
    approximationNotes: 流程阶段综合自公开许可披露、临床试验方案与平台描述；各项生物制药合作条款不尽相同。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
