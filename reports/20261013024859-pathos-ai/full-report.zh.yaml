      - number: '1.3'
        title: 资本化历程、投资者联盟与战略合作
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 已快速完成机构融资，连续多轮累计获得约 $467 million 股权融资。2024 年 10 月，公司完成由 New Enterprise Associates（NEA）领投的超额认购
              $62 million Series C，Revolution Growth、Lightbank 和 Builders VC 参投，投后估值 $600 million；当时累计实缴资本达到 $102
              million。2025 年 5 月，Pathos 宣布完成标志性的 $365 million Series D，使投后估值升至约 $1.6 billion。除股权融资外，公司还在 2025 年 4 月与
              AstraZeneca 和 Tempus AI 达成多年合作，开发多模态肿瘤基础模型，并承诺向 Tempus 支付 $200 million 数据授权和模型开发费用。但 Series D
              的具体投资者构成、股份类别、清算优先权和股权结构表分配仍未披露。
