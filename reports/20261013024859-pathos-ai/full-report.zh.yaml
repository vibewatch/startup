  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: Pathos AI 的临床管线推进与商业价值创造路径。
    data:
      nodes:
        - label: 患者数据摄入
          detail: 来自 Tempus 与合作伙伴的 PB 级多模态肿瘤临床记录与基因组数据
        - label: PathOS 因果建模
          detail: AI 基础模型识别有反应的患者亚群与生物标志物
        - label: 资产引进许可
          detail: 获取搁置或临床阶段化合物（Pocenbrodib、P-500、JSKN016）
        - label: 1b/2a 期临床试验
          detail: 按生物标志物指导患者分层，实施适应性试验
        - label: 生物制药共同开发
          detail: 合作伙伴关系（AstraZeneca），分摊开发成本并共享技术资产
        - label: 商业化变现
          detail: 实现许可里程碑付款与分层产品版税
    claimRefs:
