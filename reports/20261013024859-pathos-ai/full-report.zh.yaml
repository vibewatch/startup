  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、Foundry 平台与工作流架构
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 是一个 AI 驱动的临床阶段生物科技平台，旨在解决肿瘤临床试验反复出现的失败模式。传统精准肿瘤药物开发在进入 Phase 2
              时淘汰率很高，常见原因是入组没有机制性患者选择或预测性生物标志物分层。Pathos 通过自有临床开发平台 Foundry 应对这一结构性弱点，在患者入组前和入组期间模拟并落实试验执行的每个阶段。Foundry
              工作流分为候选识别、实验设计模拟、自适应临床执行和结果评估四个阶段。候选识别根据真实世界多组学数据集和机制性生物学依据筛选排序，而不是依赖经验试错；实验设计阶段在首例患者入组前，于计算机内模拟数千种试验场景、给药计划、患者亚群标准和替代终点；临床进行时，实时数据持续校准给药和生物标志物截点；最后，按反应概率对患者队列分层，以减少失败
              Phase 2 试验的资本浪费并缩短开发周期。
            claimRefs:
              - CE001
              - CE002
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
