chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与 AI 平台模式
        blocks:
          - type: paragraph
            body: >-
              Pathos AI, Inc. 是一家由科技和医疗创业者 Eric Lefkofsky 与 Ryan Fukushima 于 2022
              年创立的风险投资支持型临床阶段生物科技公司。公司主要办公室位于芝加哥和纽约，正在打造一种差异化的肿瘤药物开发模式：把大规模多模态真实世界患者数据与自有因果人工智能框架结合。Pathos
              不只做从头计算分子设计，还用 PathOS 分析转录组、基因组和临床记录，寻找药物反应的生物学机制、识别特定患者亚群，并重新启用或收购早期 Phase 1
              试验中已显示可耐受安全性的临床阶段资产。公司虽在推进自有和合作管线，但商业收入、净现金消耗和员工人数等基础规模指标仍是未披露的私人数据。
            claimRefs:
              - CO001
              - CO002
              - CO014
