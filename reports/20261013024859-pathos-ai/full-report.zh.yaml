      - number: '5.3'
        title: 多模态架构、计算建模与技术治理
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 技术差异化的核心是自有多模态肿瘤数据基础设施。公司已整合数百万份患者记录，连接高维基因组、转录组、组织病理影像、非结构化临床文本和纵向生存结局。这一统一多组学基础让 Pathos
              超越相关性统计，描绘治疗反应和获得性耐药的因果机制。2025 年 5 月，在以 $1.6 billion 估值完成 $365 million Series D 后，Pathos
              宣布开发专为肿瘤打造的多模态基础模型，用跨分子和影像模态的深度学习表征支持临床资产选择、临床方案设计和生物标志物发现；架构中有数千个自主模拟代理，对虚拟患者画像评估药物—靶点扰动。2025 年 4
              月，Pathos 又与 AstraZeneca 和 Tempus 启动多年合作，构建用于癌症靶点发现的大规模多模态深度学习模型，承诺向 Tempus 支付最高 $200 million
              数据授权和模型开发费用。尽管商业验证较强，Pathos 仍是封闭式生物制药平台，没有公开开发者代码库、开放基准代码或可访问 API 端点，独立算法基准和模型泛化能力因此难以尽调。
