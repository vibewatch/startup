      - number: '3.4'
        title: 不利竞争压力与商品化威胁
        blocks:
          - type: paragraph
            body: >-
              不利市场信号揭示了 Pathos AI
              长期企业价值的多项系统性风险。关键脆弱点是生物学基础机器学习架构和基础模型快速商品化。开源多模态模型及超大规模云厂商的商业生物学基础架构降低了竞争型生物科技初创公司和大型药企生物信息团队的进入门槛。精准肿瘤中，即便是生物标志物靶向化合物，历史管线淘汰仍然很高：Pathos
              生态中的 milademetan（在 Phase 3 脂肪肉瘤受挫后通过 Rain Oncology 收购）以及行业数据库记录的 tarloxotinib bromide、DS-3032
              等终止候选药，都说明计算再定位不能保证临床疗效，也无法消除生物靶点缺陷。生物制药授权条款同样昂贵；Pathos 与 Alphamab Oncology 就 JSKN016 的协议要求 $125 million
              预付款和最高 $2,093 million 里程碑，增加现金消耗和执行压力。如果 pocenbrodib 的 Phase 1b/2a 数据在生物标志物筛选队列中未能实现统计显著的总反应或 PSA
              下降，Pathos 关于 AI 患者选择能够恢复临床价值的核心假设，将遭到临床肿瘤学家和机构投资者的严重质疑。
