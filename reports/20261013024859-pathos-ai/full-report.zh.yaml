      - number: '5.2'
        title: 临床阶段管线、核心资产与授权引进策略
        blocks:
          - type: paragraph
            body: >-
              Pathos AI
              不把业务限制在软件授权或临床前命中发现，而是把计算平台直接用于自有、授权引进或共同开发的临床阶段治疗资产。这种混合生物科技平台模式让公司既能获取药物股权价值，又能用计算模型降低人体临床试验中患者选择的风险。核心临床项目是
              pocenbrodib（P-300），一种靶向 CREBBP/EP300（CBP/p300）的口服小分子抑制剂。抑制 CBP/p300 会下调关键致癌转录驱动因素，尤其是雄激素受体（AR）及其耐药变体。2025
              年 3 月，Pathos 在 P300-02-001（NCT06785636）启动受试者给药；该开放标签、多中心 Phase 1b/2a 剂量探索试验面向转移性去势抵抗性前列腺癌患者，大约 203 人，测试
              pocenbrodib 单药及与 abiraterone acetate、olaparib 或 177Lu-PSMA-617 联用。为扩大小分子以外的管线，Pathos 于 2026 年 8 月与
              Alphamab Oncology 就 JSKN016 完成重大授权引进交易；该首创新型 ADC 靶向 TROP2 和 HER3。公司以 $125 million
              不可退还预付款获得中国大陆以外的独家开发和商业化权利，另有最高 $2,093 million 潜在里程碑和分层特许权使用费，并用 Foundry 定义 JSKN016
              在实体瘤适应症中的临床分层标志物和患者选择标准。
            claimRefs:
              - CE006
              - CE007
