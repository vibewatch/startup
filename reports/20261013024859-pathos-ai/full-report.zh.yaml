      - number: '3.3'
        title: 差异化持久性、切换壁垒与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 的竞争护城河有三根支柱：PathOS 自有因果 AI 算法、多模态临床和分子记录访问权，以及转化试验执行速度。通过整合临床结局、DNA 和 RNA 测序及离体生物学验证，Pathos
              试图挽救那些 Phase 1 安全性可耐受但在未分层队列中疗效不足、因此停滞或降级的化合物。不过，这种差异化的持久性面临结构性阻力。首先，数据依赖严重：Pathos 与 Tempus AI、AstraZeneca
              的战略协议包含向 Tempus 支付 $200 million 数据授权和模型开发费用，说明 Pathos 并未在所需规模上自建训练基础模型的临床数据供应链。其次，知识产权和资产供给受限。随着生物制药巨头增强内部
              AI 与数据科学能力，或直接与数据经纪商合作，以有利条款可供授权引进的优质、已降低风险的 Phase 1 化合物池会收缩。第三，大药企伙伴的切换成本中等：它们可以把候选药物授权给
              Pathos，却会同时使用多个计算生物学平台，与 Isomorphic Labs、Owkin 和 Recursion 等并行合作。若没有证明 PathOS 筛选患者具有更高反应率的 Phase 2/3
              临床证据，竞争者一旦复制其多模态生物标志物特征，Pathos 就可能面临估值倍数压缩。
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
