      - number: '1.2'
        title: 高管领导、治理与关键人物架构
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 由覆盖人工智能、计算生物学和肿瘤药物开发的资深管理及科学团队治理。2025 年 5 月，公司任命 Iker Huerga 为 CEO 兼董事会成员，接替此前担任临时
              CEO、随后继续担任董事的联合创始人 Ryan Fukushima。Huerga 拥有逾二十年的生物科技和机器学习经验，曾任 AstraZeneca 肿瘤研发首席数据科学家及 Tempus Labs
              执行副总裁。科学团队由首席科学官 Eric Schadt, Ph.D. 领衔；他是整合计算生物学先驱、Pacific Biosciences 前 CSO 及 Sema4 创始 CEO。运营由首席运营官 Matt
              De Silva 负责，他曾创办并领导 Notable Labs，也是 Builders VC 的风险合伙人。董事会由联合创始人 Eric Lefkofsky（Tempus AI 创始人兼
              CEO）担任主席，New Enterprise Associates 联席 CEO Mohamad Makhzoumi 和 Amit Mehta 代表机构董事。
