    notes: 综合核心尽调维度与估值指标，形成最终投资立场。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
  - id: TV002
    title: 正反论点表
    columns:
      - 视角
      - 核心论点
      - 证据锚点
      - 哪些情况会改变判断
    rows:
      - - 论点：多模态平台
        - 基于多组学数据训练的专有 AI 引擎优化肿瘤试验患者选择
        - AstraZeneca 与 Tempus 的多年战略合作
        - 制药合作伙伴终止合作或不再采用
      - - 论点：管线广度
        - 在研临床资产（pocenbrodib、P-500、JSKN016）瞄准未满足需求高的肿瘤适应症
        - 近期引进 JSKN016 ADC 许可，并推进 pocenbrodib 1b/2a 期给药
        - 未能在 2 期证明患者反应与生物标志物相关
      - - 反论点：估值溢价
        - $1.6B 估值提前计入商业基础模型成功，早于 2 期数据公布
        - 在 $600M C 轮融资后 7 个月内上调至 $1.6B
        - 早期许可收入或大额非稀释性制药预付款
      - - 反论点：资本承诺
        - 激进引进许可（向 Alphamab 支付 $125M 预付款）及 Tempus $200M 费用带来高烧钱
        - 相对于私募融资基础，预付款现金义务沉重
        - 经审计财务报表证明烧钱率低且现金跑道可支撑多年
    notes: 比较基本面投资支柱与主要执行、财务风险。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV010
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 概率信号
      - 关键运营假设
      - 估值 / 回报逻辑
      - 下行触发因素
    rows:
      - - 乐观情景
        - 25%
        - Pocenbrodib 2 期成功、JSKN016 加速开发、制药企业采用 AI 模型
        - $3.0B-$4.0B 估值（D 轮回报 1.9 倍–2.5 倍）
        - 监管延迟或竞争性 ADC 靶点获批
      - - 基准情景
        - 50%
        - pocenbrodib 试验稳定推进，与 Tempus/AZ 稳步构建基础模型
        - $1.4B-$1.8B 公允价值（D 轮回报持平至 1.1 倍）
        - 患者入组缓慢、生物标志物验证延迟
      - - 悲观情景
        - 25%
        - Pocenbrodib 1b/2a 期安全性 / 疗效失败、许可现金耗尽、下轮融资
        - $500M-$700M 估值（较 D 轮减值 56%–69%）
        - 试验终止、股权结构表中的优先权归零、制药方退出
      - - 下行底线
        - 尾部风险
        - 管线全面失败、平台过时并进入清算
        - 低于 $200M 的净清算或资产出售价值
        - 临床同时失败且失去 Tempus 数据访问
    notes: 情景模型根据概率性临床结果评估 24–36 个月估值区间。
    claimRefs:
      - CV006
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Pathos AI 的创立、融资、临床试验、合作与许可关键里程碑按时间顺序排列。
    approximationNotes: 日期以官方公开公告为准；许可预付款与里程碑金额反映合同中的标题条款。
    data:
      items:
        - date: '2022'
          label: 创立与平台起步
          detail: Pathos AI 由 Eric Lefkofsky 与 Ryan Fukushima 在芝加哥创立，旨在打造因果 AI 药物开发平台。
          tone: positive
        - date: '2024-10-29'
          label: C 轮融资（$62M）
          detail: 完成由 New Enterprise Associates 领投的 $62M C 轮融资，投后估值 $600M。
          tone: positive
        - date: '2025-03-20'
          label: Pocenbrodib 1b/2a 期试验启动
          detail: 在评估晚期前列腺癌主要 CBP/p300 抑制剂的 1b/2a 期试验（P300-02-001）中完成首例患者给药。
          tone: positive
        - date: '2025-04-23'
          label: AstraZeneca 与 Tempus 战略联盟
          detail: 签署多年期协议，共建肿瘤学基础模型，并承诺向 Tempus 支付 $200M 费用。
          tone: positive
        - date: '2025-05-08'
          label: 任命 Iker Huerga 为 CEO
          detail: 任命前 AstraZeneca 首席数据科学家、Tempus 执行副总裁 Iker Huerga 为首席执行官。
          tone: neutral
        - date: '2025-05-15'
          label: D 轮融资（$365M，估值 $1.6B）
          detail: 完成 $365M D 轮融资，投后估值约为 $1.6B。
          tone: positive
        - date: '2025-05-16'
          label: 临床转化与肿瘤异质性警示
          detail: 行业分析凸显 AI 药物开发者面临的肿瘤学高淘汰率与生物复杂性。
          tone: warning
        - date: '2026-08-04'
          label: Alphamab JSKN016 大中华区以外许可交易
          detail: 以 $125M 预付款获得临床阶段双特异性 ADC 的大中华区以外独家权利，里程碑款最高达 $2,093M。
          tone: positive
    claimRefs:
      - CO001
      - CO006
      - CO007
      - CO010
      - CO011
      - CO012
      - CO013
