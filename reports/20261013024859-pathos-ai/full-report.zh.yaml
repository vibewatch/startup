            body: >-
              Pathos AI 的商业模式不同于传统 AI 药物发现平台。计算领域同行通常靠 SaaS 订阅或早期靶点生成费变现，而 Pathos
              是一家拥有并推进临床阶段疗法的全栈药物开发企业。公司收购临床数据有限的外部候选药物，再用 PathOS 因果 AI
              引擎识别响应患者亚群和分子生物标志物。收入来自长期生物制药共同开发协议、临床资产对外授权及最终商业销售特许权使用费。比如，Pathos 于 2025 年 3 月在核心化合物 Pocenbrodib 的 1b/2a
              期临床试验中，为转移性去势抵抗性前列腺癌患者完成首例给药。由于公司获取的是后续临床所有权而非 SaaS 费用，短期收入取决于里程碑达成和合作保留费，而非可预测的经常性软件现金流。
