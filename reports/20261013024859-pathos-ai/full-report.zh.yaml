      - number: '1.4'
        title: 临床管线开发与时间线里程碑
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 的运营论点是借助计算生物标志物发现引擎推进经验证的临床阶段精准肿瘤疗法。2025 年 3 月，公司开始在多中心 Phase 1b/2a 试验（P300-02-001,
              NCT06785636）中给患者用药，评估核心候选药物 pocenbrodib——一种口服小分子 CBP/p300 抑制剂——单药以及与 abiraterone acetate、olaparib 或
              177Lu-PSMA-617 联用治疗转移性去势抵抗性前列腺癌（mCRPC）。2026 年 8 月，公司与 Alphamab Oncology 就 JSKN016 达成中国大陆以外地区的独家授权，引入首创新型
              TROP2/HER3 双特异性抗体偶联药物（ADC），同意支付 $125 million 不可退还预付款及最高 $2,093 million 的监管和商业 bio-dollar
              里程碑。尽管管线增长迅速，独立观察者仍指出肿瘤临床转化面临历史高失败率、耐药机制和肿瘤异质性，必须严格确认 Phase 2 疗效。
            claimRefs:
