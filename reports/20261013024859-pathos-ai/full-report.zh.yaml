  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 的可服务市场位于临床阶段肿瘤药物开发、多模态生物建模和 AI 试验编排的交叉地带。不同于侧重高通量从头分子设计或虚拟筛选库的传统 tech-bio 平台，Pathos 明确把商业重点限定在
              Phase 1 和 Phase 2
              临床试验优化及资产授权引进。历史上，癌症疗法在早期临床开发失败每年会让生物制药行业损失数十亿美元；行业证据显示，许多挫折并非分子没有生物活性，而是传统试验在未分层的异质患者队列中评估化合物，而非针对分子反应亚群。为解决这一结构性低效，Pathos
              业务由四根支柱支撑：引进高潜力临床资产（尤其是中国境外肿瘤化合物）、与药企共建大规模多模态基础模型、部署计算代理建模患者反应，以及直接执行临床开发。替代方案包括缺少自有预测建模的传统
              CRO、依赖回顾性组织染色的转化生物标志物实验室，以及缺少临床执行基础设施的从头计算化学供应商。公司将超过 200 petabytes
              的专有数据规模与直接试验发起结合，绕开软件授权收入瓶颈，转而持有大量治疗资产。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
      - number: '2.2'
        title: 受约束行业视角下的可服务市场规模
        blocks:
          - type: paragraph
            body: >-
              评估 AI 药物开发公司的市场，需要多种分析视角，而不是一个投机性的总收入数字。最宽的宏观边界是全球生物制药肿瘤研发支出，每年超过 $65
              billion，动力来自靶向疗法、双特异性构建体和新型抗体偶联药物的持续临床需求。但把全部肿瘤研发视为眼前可服务市场会高估短期现实，因为行业资本大多已投入固定发现基础设施、上市后 Phase 4
              研究和标准化临床中心管理。将范围收窄至 SAM，可得到北美和欧洲约 $7.5 billion 的外包及内部 Phase 1、Phase 2 精准肿瘤临床开发业务。在这一层级，Pathos 的 SOM
              由实际商业交易和管线承诺体现。2026 年 8 月，公司签署两项同步授权协议，累计里程碑承诺最高 $2.3 billion，其中包括为 Alphamab Oncology 的双特异性 ADC JSKN016
              中国境外开发权支付 $125 million 现金预付款。公司还以 $1.6 billion 投后估值完成 $365 million Series D，具备为 203 名患者的 Phase 1b/2a
              pocenbrodib 试验等多臂临床试验提供资金的资产负债表资源，同时瞄准 $300 million Series E。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM014
