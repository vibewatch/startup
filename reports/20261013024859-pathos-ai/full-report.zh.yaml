              - CM010
              - CM013
      - number: '2.4'
        title: 采用驱动因素、结构性瓶颈与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 的开发加授权双重模式受到多项宏观因素推动：单患者临床试验成本飙升、传统肿瘤资产专利悬崖，以及需要在西方临床去风险的高度工程化中国境外分子不断增加。Pathos
              借助多模态基础模型和大规模真实世界数据队列，帮助合作伙伴压缩试验设计周期、提高 Phase 2 概念验证成功率。尤其是 pocenbrodib 在转移性前列腺癌模型中进入 Phase
              1b/2a，为平台的患者筛选算法提供了真实世界测试场。反过来，严重的临床肿瘤淘汰和尽调缺口限制长期企业估值：历史数据表明 Phase 2 肿瘤化合物失败率超过
              70%，计算生物标志物建模无法消除固有毒性或脱靶耐药机制。此外，Pathos 的净现金消耗、项目层面利润分成以及 $2.3 billion 交易承诺下的长期里程碑义务仍存在关键缺口。在核心资产公开披露成熟的
              Phase 2 临床反应数据和生存结局之前，临床执行不确定性将继续压制估值扩张。
            claimRefs:
              - CM005
              - CM008
              - CM012
              - CM014
      - number: '2.5'
        title: 案例
        blocks:
          - type: callout
            title: 中国境外资产授权引进的非对称经济性
            body: Pathos AI 通过引进 JSKN016 等已降低风险的中国临床资产配置资本，避免投机性的从头分子发现成本，再用计算平台优化后续西方临床试验。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM011
          - type: callout
            title: 历史上 Phase 2 肿瘤项目的高淘汰壁垒
            body: 即便有先进的计算患者分层，肿瘤临床试验仍容易受到生物学复杂性和人体疗效淘汰影响；因此市场扩张取决于切实的临床反应率。
            calloutType: risk
            claimRefs:
              - CM002
