figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Six-stage lifecycle mapping how Pathos AI engages biopharma partners and clinical investigators from computational asset sourcing through clinical execution and commercial milestones.
    data:
      items:
        - label: Candidate Sourcing
          stage: Candidate Sourcing
          actor: Biopharma Licensors & Scout Engine
          action: Screening clinical-stage compounds with known safety profiles but ambiguous responder populations.
          touchpoints:
            - Public clinical trial registers
            - Partner asset databases
            - PathOS Scout machine learning ingestion
          outcome: Identification of underappreciated compounds such as FT-7051, PRT811, and JSKN016
        - label: In-Silico Evaluation
          stage: In-Silico Multimodal Evaluation
          actor: Pathos AI Research & Tempus Data Engine
          action: Simulating response hypotheses across 200+ PB of multimodal clinical, molecular, and imaging records.
          touchpoints:
            - Tempus multimodal oncology dataset
            - Causal gene expression algorithms
            - Ex-vivo biological verification screens
          outcome: Computational stratification signature and target patient subgroup identification
        - label: Partner Licensing
          stage: Partner Licensing & Deal Structuring
          actor: Biopharma Partners (Alphamab, Novo Nordisk, Prelude)
          action: Negotiating exclusive territory development licenses or multi-party co-development pacts.
          touchpoints:
            - Worldwide or ex-China territory licensing agreements
            - Upfront and milestone term sheets ($125M upfront for JSKN016)
            - Strategic co-development charters (AstraZeneca/Tempus)
          outcome: Secured pipeline ownership with milestone and royalty payment structures
        - label: Trial Stratification
          stage: Biomarker & Adaptive Trial Design
          actor: Clinical Development Team & Trial Investigators
          action: Embedding molecular signatures and patient stratification criteria into clinical study protocols.
          touchpoints:
            - FDA/regulatory protocol submissions
            - Trial site selection algorithms
            - Prospective patient screening criteria
          outcome: Enrichment protocols designed to increase probability of trial success
        - label: Clinical Execution
          stage: Clinical Execution & Patient Enrollment
          actor: Clinical Oncology Centers & Enrolled Patients
          action: Administering precision therapeutics to molecularly matched patient populations across multicenter sites.
          touchpoints:
            - Multicenter trial enrollment sites
            - Phase 1b/2a dose-finding cohorts (203 mCRPC patients)
            - Ongoing safety, PK/PD, and PSA response monitoring
          outcome: Real-world human clinical efficacy and biomarker validation data
        - label: Commercial Expansion
          stage: Downstream Expansion & Commercialization
          actor: Global Biopharma Commercialization Partners
          action: Out-licensing validated phase 2 assets or commercializing precision medicines in licensed territories.
          touchpoints:
            - Downstream commercial milestone achievement
            - Tiered royalty execution on aggregate net sales
            - Next-generation model retraining from trial feedback
          outcome: Compound platform learning and commercial milestone monetizations
    approximationNotes: Process stages synthesized from public licensing disclosures, clinical trial protocols, and platform descriptions; individual biopharma collaboration terms vary.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
callouts:
  - calloutType: insight
    title: Hybrid Biopharma Model Diverges from Traditional SaaS Metrics
    body: Pathos AI operates as an in-licensing clinical development biotech and AI co-developer rather than a conventional SaaS platform vendor. Customer adoption is reflected in high-value asset in-licensing agreements, such as the $125 million upfront JSKN016 licensing deal with Alphamab and multi-year foundation model collaboration with AstraZeneca, rather than annual software subscription counts or net revenue retention.
    claimRefs:
      - CU005
      - CU006
      - CU012
  - calloutType: risk
    title: Severe Counterparty Concentration and Intercompany Fee Burdens
    body: Commercial traction exhibits heavy concentration around a small circle of partner relationships, notably Tempus AI and AstraZeneca. The foundation model partnership required $200 million in data licensing and model development fees paid to Tempus—an entity founded by Pathos co-founder Eric Lefkofsky—highlighting substantial cash drain and governance exposure tied to foundational data access.
    claimRefs:
      - CU006
      - CU008
      - CU009
