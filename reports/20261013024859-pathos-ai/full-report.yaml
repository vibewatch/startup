    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Frameworks, Clinical Licenses, and Licensing Liabilities
        blocks:
          - type: paragraph
            body: >-
              Pathos AI operates in a heavily regulated clinical biotechnology environment governed by the United States
              Food and Drug Administration (FDA) and international healthcare regulatory authorities. The company's
              clinical pipeline relies on in-licensed intellectual property rather than wholly owned proprietary
              chemical discovery, exposing Pathos to strict contractual covenants, contingent milestone payment
              liabilities, and counterparty IP validity risks. Most prominently, the global in-licensing agreement with
              Alphamab Oncology for bispecific antibody-drug conjugate JSKN016 outside Greater China imposes a
              non-refundable upfront payment of US$125 million and potential development and commercialization
              milestones totaling up to US$2,093 million, alongside tiered royalties. Regulatory clearance for
              early-phase clinical protocols requires demonstrating stringent Good Clinical Practice (GCP) compliance,
              reliable chemistry, manufacturing, and controls (CMC) documentation, and reproducible patient
              stratification biomarkers. Any regulatory hold, unexpected toxicology signal, or adverse clinical trial
              safety finding across lead programs would impair development velocity and trigger severe milestone
              renegotiation pressure.
