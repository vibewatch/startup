  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Foundry Platform, and Workflow Architecture
        blocks:
          - type: paragraph
            body: >-
              Pathos AI operates as an AI-enabled, clinical-stage biotechnology platform engineered to address the
              persistent failure modes of oncology clinical trials. Traditional precision oncology drug development
              experiences high attrition during Phase 2 transitions, often because trial cohorts are enrolled without
              mechanistic patient selection or predictive biomarker stratification. Pathos counters this structural
              vulnerability through Foundry, its proprietary clinical development platform designed to simulate and
              operationalize every stage of trial execution before and during patient enrollment.


              The Foundry operating workflow executes across four distinct functional phases: candidate identification,
              experimental design simulation, adaptive clinical execution, and outcome evaluation. In candidate
              identification, compounds are screened and prioritized based on real-world multiomic datasets and
              mechanistic biological rationales rather than empirical trial-and-error. During experimental design,
              Foundry simulates thousands of trial scenarios, dosing schedules, patient subpopulation criteria, and
              surrogate endpoints in silico prior to enrolling the first human patient. In the active clinical phase,
              incoming real-world and trial data continuously refine dosing and biomarker cutoff parameters. Finally, by
              stratifying patient cohorts prospective of response probability, Pathos aims to reduce capital waste from
              failed Phase 2 studies and shorten development timelines.
            claimRefs:
              - CE001
              - CE002
              - CE004
          - type: table
