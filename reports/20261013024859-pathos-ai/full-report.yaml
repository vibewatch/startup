        blocks:
          - type: paragraph
            body: >-
              At the core of Pathos AI's technical differentiation is its proprietary multimodal oncology data
              infrastructure. Pathos has integrated millions of patient records linking high-dimensional genomics,
              transcriptomics, histopathology imaging, unstructured clinical text, and longitudinal patient survival
              outcomes. This unified multiomic foundation allows Pathos to move beyond correlative statistical
              associations to map causal mechanisms of therapeutic response and acquired drug resistance.


              In May 2025, supported by a $365 million Series D financing round valuing the company at $1.6 billion,
              Pathos announced the development of a purpose-built multimodal foundation model for oncology. The model
              coordinates deep learning representations across molecular and imaging modalities to inform clinical asset
              selection, clinical protocol design, and biomarker discovery. The computational architecture employs
              thousands of autonomous simulation agents that evaluate drug-target perturbations against virtual patient
              profiles.


              Pathos has also established significant institutional and pharmaceutical partnerships to reinforce its
              data access and model validation. In April 2025, Pathos entered into a multi-year collaborative initiative
