      - number: '8.3'
        title: Scenario Analysis and Expected Returns
        blocks:
          - type: paragraph
            body: >-
              Evaluating Pathos AI across probabilistic outcome scenarios highlights an asymmetric risk profile skewed
              toward downside multiple compression under clinical delay. In the Base Case (50% probability), pocenbrodib
              progresses through Phase 1b/2a dose-escalation without safety signals, and the multimodal foundation model
              built with AstraZeneca and Tempus validates targeted biomarker signatures, supporting a fair value range
              of $1.4 billion to $1.8 billion. In the Bull Case (25% probability), accelerated biomarker-guided response
              in mCRPC and early Phase 1 momentum for P-500 and JSKN016 demonstrate repeatable platform value, driving
              multiple expansion toward $3.0 billion to $4.0 billion via strategic biopharma partnerships. Conversely,
              the Bear Case (25% probability) assumes pocenbrodib fails to show differentiated efficacy over standard
              anti-androgen combinations, while heavy upfront commitments deplete cash balances, forcing a structured
              bridge or down-round valuation between $500 million and $700 million. Because current entry at $1.6
              billion fully prices in base-case platform execution without offering sufficient margin of safety against
              early clinical attrition, disciplined investors should avoid chasing the mark.
