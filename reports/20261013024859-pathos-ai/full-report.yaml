      - number: '5.2'
        title: Clinical-Stage Pipeline, Lead Assets, and In-Licensing Strategy
        blocks:
          - type: paragraph
            body: >-
              Rather than restricting its operations to software licensing or preclinical hit-finding, Pathos AI deploys
              its computational platform directly onto clinical-stage therapeutic assets that it owns, in-licenses, or
              co-develops. This hybrid biotech-platform posture allows the company to capture direct drug equity value
              while utilizing its computational models to de-risk patient selection in human clinical trials.


              The company's lead clinical-stage program is pocenbrodib (P-300), an oral small molecule inhibitor
              targeting CREBBP/EP300 (CBP/p300). Inhibiting CBP/p300 downregulates key oncogenic transcription drivers,
              notably the androgen receptor (AR) and its resistance variants. In March 2025, Pathos initiated subject
              dosing in study P300-02-001 (NCT06785636), an open-label, multicenter Phase 1b/2a dose-finding trial in
              patients with metastatic castration-resistant prostate cancer (mCRPC). The trial tests pocenbrodib both as
              monotherapy and in combination with abiraterone acetate, olaparib, or 177Lu-PSMA-617 across an anticipated
              cohort of approximately 203 patients.


              To expand its clinical pipeline beyond small molecules, Pathos completed a major in-licensing transaction
              in August 2026 with Alphamab Oncology for JSKN016, a first-in-class bispecific antibody-drug conjugate
              (ADC) targeting TROP2 and HER3. Under the agreement, Pathos acquired exclusive development and
              commercialization rights outside Greater China for an upfront non-refundable consideration of $125
              million, plus up to $2,093 million in potential milestone payments and tiered royalties. Pathos deploys
              its Foundry platform to define the clinical stratification biomarkers and patient selection criteria for
              JSKN016 across solid tumor indications.
