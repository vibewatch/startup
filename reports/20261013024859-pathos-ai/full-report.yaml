      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Architecture
        blocks:
          - type: paragraph
            body: >-
              Pathos AI is governed by an experienced executive and scientific leadership cohort spanning artificial
              intelligence, computational biology, and oncology drug development. In May 2025, Pathos appointed Iker
              Huerga as Chief Executive Officer and board member, succeeding co-founder Ryan Fukushima who previously
              served as Interim CEO before transitioning to an ongoing board directorship. Huerga brings more than two
              decades of biotechnology and machine learning expertise, having previously served as Chief Data Scientist
              for Oncology R&D at AstraZeneca and Executive Vice President at Tempus Labs. Scientific leadership is
              anchored by Chief Scientific Officer Eric Schadt, Ph.D., a pioneer in integrative computational biology,
              former CSO of Pacific Biosciences, and founding CEO of Sema4. Operational execution is directed by Chief
              Operating Officer Matt De Silva, former founder and CEO of Notable Labs and venture partner at Builders
              VC. Board oversight is chaired by co-founder Eric Lefkofsky (founder and CEO of Tempus AI), with
              institutional director representation from New Enterprise Associates Co-CEO Mohamad Makhzoumi and Amit
              Mehta.
