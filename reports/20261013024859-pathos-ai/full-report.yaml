  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Hierarchical architecture of the Pathos AI drug development platform from multimodal data intake to clinical trial
      execution and governance.
    data:
      layers:
        - label: Multimodal Data Foundation Layer
          detail: >-
            Integrates millions of oncology patient records encompassing whole-exome sequencing, RNA transcriptomics,
            digital pathology imaging, and longitudinal clinical outcomes.
        - label: Causal Inference & Biological Modeling Layer
          detail: >-
            Constructs causal gene regulatory networks and disease progression graphs to distinguish driver mechanisms
            of treatment response from correlative artifacts.
        - label: Agentic In Silico Simulation Layer
          detail: >-
            Deploys thousands of computational simulation agents to model virtual patient cohorts, dosing regimens, and
            endpoint probability distributions.
        - label: Ex Vivo Biological Screening & Validation Layer
          detail: >-
            Performs orthogonal wet-lab testing and synthetic lethality verification using patient-derived biological
            models to confirm in silico predictions.
        - label: Foundry Clinical Trial Optimization Layer
          detail: >-
            Operationalizes predictive biomarker stratification, adaptive trial designs, and real-time clinical
            monitoring across active oncology trials.
        - label: Pharma Collaboration & Governance Interface Layer
          detail: >-
            Provides secure multi-tenant data access, joint steering committee oversight, and regulatory documentation
            for co-development partnerships.
    approximationNotes: >-
      Architectural representation reflects Pathos AI published platform descriptions, partner announcements, and patent
      disclosures; proprietary algorithmic components are abstracted into functional layers.
