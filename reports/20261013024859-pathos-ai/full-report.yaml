            body: >-
              The capital history of Pathos AI demonstrates rapid private valuation inflation driven by investor
              exuberance for generative AI in biotechnology. Prior to its Series D, Pathos had raised approximately $102
              million in aggregate funding, including a $62 million Series C round closed in October 2024 at a $600
              million post-money valuation led by New Enterprise Associates alongside Revolution Growth, Lightbank, and
              Builders VC. The subsequent $365 million Series D represented an aggressive upward re-rating to $1.6
