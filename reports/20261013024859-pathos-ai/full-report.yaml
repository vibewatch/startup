      - number: '4.2'
        title: Contract Economics and Licensing Obligations
        blocks:
          - type: paragraph
            body: >-
              The economic architecture of Pathos AI is governed by major licensing and partnership agreements rather
              than conventional software pricing schedules. In August 2026, the company entered a major global licensing
              agreement with Alphamab Oncology for JSKN016, a first-in-class TROP2/HER3 bispecific antibody-drug
              conjugate. Under the contract terms, Pathos committed to a non-refundable upfront payment of $125 million,
              with additional developmental and commercial milestone obligations totaling up to $2,093 million,
              alongside tiered royalties ranging from high-single digit to low-double digit rates on net territorial
              sales. Furthermore, Pathos formed a multi-year strategic alliance with AstraZeneca and Tempus AI in April
              2025 to co-develop an oncology multimodal foundation model. While these contractual frameworks secure
              valuable intellectual property and clinical pipelines, they establish substantial fixed capital hurdles
              and revenue-sharing obligations that materially impact net commercial margins upon prospective drug
              approvals.
