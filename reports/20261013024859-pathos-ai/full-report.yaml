chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and AI Platform Model
        blocks:
          - type: paragraph
            body: >-
              Pathos AI, Inc. is a venture-backed, clinical-stage biotechnology company founded in 2022 by technology
              and healthcare entrepreneurs Eric Lefkofsky and Ryan Fukushima. Operating with principal corporate offices
              in Chicago, Illinois and New York, New York, the company is pioneering a differentiated operating model
              for oncology drug development that combines large-scale multimodal real-world patient data with
              proprietary causal artificial intelligence frameworks. Rather than focusing exclusively on de novo
              computational molecular design, Pathos deploys its proprietary PathOS platform to analyze transcriptomic,
              genomic, and clinical records to uncover biological mechanisms of drug response, identify specific patient
              sub-populations, and resurrect or acquire clinical-stage therapeutic assets that demonstrated tolerable
              safety profiles in early Phase 1 trials. While the company actively advances proprietary and partnered
              pipeline programs, foundational commercial scale metrics—including commercial revenue, net cash burn, and
              employee headcount—remain undisclosed private data.
            claimRefs:
              - CO001
              - CO002
              - CO014
