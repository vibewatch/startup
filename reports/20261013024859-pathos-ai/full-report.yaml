      - number: '4.3'
        title: Cost Structure and Unit Economics Opacity
        blocks:
          - type: paragraph
            body: >-
              Evaluating unit economics for Pathos AI requires analyzing clinical development and computational
              infrastructure expenses rather than software gross margins. The company's principal operating expenditures
              stem from multi-center clinical trial execution, patient recruitment, and large-scale data licensing. In
              its multi-year collaboration with AstraZeneca and Tempus AI, contract terms include $200 million in data
