      - number: '1.4'
        title: Clinical Pipeline Development and Chronological Milestones
        blocks:
          - type: paragraph
            body: >-
              Pathos AI operating thesis is centered on advancing clinical-stage precision oncology therapeutics
              validated through its computational biomarker discovery engine. In March 2025, Pathos initiated patient
              dosing in its multicenter Phase 1b/2a clinical trial (P300-02-001, NCT06785636) evaluating lead candidate
              pocenbrodib—an oral, small-molecule CBP/p300 inhibitor—as monotherapy and in combination with abiraterone
              acetate, olaparib, or 177Lu-PSMA-617 for metastatic castration-resistant prostate cancer (mCRPC). The
              company substantially broadened its pipeline in August 2026 by entering an exclusive licensing agreement
              with Alphamab Oncology for JSKN016, a first-in-class TROP2/HER3 bispecific antibody-drug conjugate (ADC),
              for territories outside Greater China, agreeing to a $125 million non-refundable upfront payment and up to
              $2,093 million in regulatory and commercial bio-dollar milestones. Despite rapid pipeline accumulation,
              independent observers emphasize that clinical translation in oncology faces formidable historical failure
              rates, resistance mechanisms, and tumor heterogeneity, requiring rigorous Phase 2 efficacy confirmation.
