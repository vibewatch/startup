      - number: '1.3'
        title: Capitalization History, Investor Syndicate, and Strategic Alliances
        blocks:
          - type: paragraph
            body: >-
              Pathos AI has completed rapid institutional capital formation, accumulating approximately $467 million in
              total equity financing across consecutive institutional rounds. In October 2024, the company closed an
              oversubscribed $62 million Series C financing round led by New Enterprise Associates (NEA) with
              participation from Revolution Growth, Lightbank, and Builders VC at a $600 million post-money valuation,
              bringing total paid-in capital at that date to $102 million. In May 2025, Pathos announced a landmark $365
              million Series D financing round that elevated its post-money valuation to approximately $1.6 billion.
              Alongside equity financing, Pathos has executed major biopharma alliances, notably entering a multi-year
              collaboration in April 2025 with AstraZeneca and Tempus AI to develop a multimodal oncology foundation
              model, committing $200 million in data licensing and model development fees to Tempus. However, specific
              Series D syndicate composition, share classes, liquidation preferences, and cap table allocations remain
              undisclosed.
