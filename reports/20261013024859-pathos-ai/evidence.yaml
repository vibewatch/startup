  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited financial statements, current revenue run-rate, net cash burn, and remaining cash runway.
    whyItMatters: Essential to evaluate runway duration and capital consumption velocity ahead of clinical milestone readouts.
    diligencePath: Request audited financials, current cash balance, and monthly burn schedule during management diligence sessions.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-and-cap-table
    missingEvidence: >-
      Complete Series D investor syndicate breakdown, board observer rights, and detailed cap table shareholding
      percentages.
    whyItMatters: Undisclosed liquidation preferences and syndicate concentration could impact common equity upside.
    diligencePath: Obtain fully diluted cap table, shareholder agreement, and voting rights schedule from company counsel.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: addressable-pipeline-economics
    missingEvidence: >-
      Granular breakdown of Pathos AI's internal unit economics per in-licensed clinical program, net milestone
      obligations, and partner cost-sharing terms.
    whyItMatters: >-
      Without program-level cost and revenue-share disclosure, bottom-up SOM sizing must rely on top-line deal milestone
      announcements rather than net margins.
    diligencePath: >-
      Review audited partnership agreements, SEC partner filings (AstraZeneca, Tempus), and confidential licensing
      disclosures during future financing rounds.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: phase-2-clinical-efficacy-benchmarks
    missingEvidence: >-
      Completed Phase 2 clinical response and survival readouts for pocenbrodib (P300-02-001) demonstrating AI patient
      selection efficacy over unstratified standard of care.
    whyItMatters: >-
      Biopharma buyer willingness to pay for PathOS platform capabilities depends on proven clinical risk reduction
      rather than retrospective biomarker correlations.
    diligencePath: >-
      Track ClinicalTrials.gov NCT06785636 primary completion results, medical conference abstracts (ASCO/ESMO), and
      peer-reviewed clinical validation studies.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: head-to-head clinical efficacy
    missingEvidence: >-
      Comparative Phase 2 clinical response and survival data directly contrasting PathOS biomarker-selected patient
      cohorts against standard-of-care unselected patient arms.
    whyItMatters: >-
      Direct comparative clinical response proof is required to demonstrate whether PathOS patient stratification
      confers measurable therapeutic benefit over standard clinical trials.
    diligencePath: >-
      Track mature Phase 1b/2a pocenbrodib study readouts (NCT06785636) and subsequent randomized Phase 2 trial results
      as data matures.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: in-house biopharma AI capabilities
    missingEvidence: >-
      Internal benchmarking and productivity metrics from proprietary AI/ML platforms inside big pharma sponsors (e.g.
      AstraZeneca, Novartis, Roche).
    whyItMatters: >-
      Internal pharma capabilities govern the long-term willingness of large biopharmaceutical companies to out-license
      clinical compounds or partner on foundation models.
