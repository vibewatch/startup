            title: 最宽的市场标题不是最有用的估值视角
            body: USD 28.5 billion 的数字身份服务数字作为品类地图是真实的，但会夸大 ID.me 的直接机会，因为其中包含相邻的编排和钱包服务；许多买家购买这些服务时，并不一定会选择高保证、可复用的核验提供商。
