        - 要求持股比例、董事会权利和继任规划
      - - Ribbit Capital
        - Series E 领投方
        - 传递对金融科技 / 基础设施的信念，也很可能带来董事会或观察员影响力
        - 2025 年 9 月融资公告中列名为领投方
        - 确认治理权利和持仓规模
      - - Ares Management / Ares Credit
        - 债权人和股权参与方
        - 可能是创始人之外最重要的财务利益相关方，因为债务会塑造下行和契约
        - 官方公告加 Sacra 均识别 Ares 信贷支持
        - 审阅完整信贷协议和贷款方保护
      - - Moonshots Capital & Positive Sum
        - Series E 股权参与方
        - 支持轮次银团化，但公开影响力水平不清
        - 在 2025 年 9 月官方轮次披露中被点名
        - 确认所有权和任何战略权利
      - - CapitalG、Morgan Stanley Counterpoint、FTV、PSP、Viking 等投资方
        - 早前披露的成长投资者
        - 传递后期机构背书和潜在跨市场预期
        - Sacra 将其列为多个轮次的知名投资者
        - 要求入场价格、所有权和二级交易历史
      - - 联邦机构（IRS、CMS、SSA、VA）
        - 关键任务客户基础
        - 经济集中度和声誉杠杆可能不亚于投资者影响力
        - 公开合同和流程文件显示重大依赖
        - 按机构拆分收入集中度和合同续约风险
      - - Carahsoft
        - 政府分销伙伴
        - 塑造公共部门采购触达和转售渠道规模
        - Carahsoft 合作公告
        - 厘清渠道经济性和独占性
    notes: 这里混合了投资者、债权人、创始人以及关键任务渠道 / 客户利益相关方，因为公开控制可见度比股权表可见度更宽。
