  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前估值标记高于公开证据支撑的基准情景，只是小幅落在乐观情景内。
    data:
      items:
        - label: 悲观情景
          low: 0.8
          mid: 1
          high: 1.2
          unit: USD B
          detail: 采购放缓，或隐私审查恶化。
        - label: 基准情景
          low: 1.4
          mid: 1.6
          high: 1.8
          unit: USD B
          detail: 缺少经审计的上行证明，估值只给可比公司调整后的溢价。
        - label: 乐观情景
          low: 2.2
          mid: 2.5
          high: 2.8
          unit: USD B
          detail: 收入和复用证明显著超过公开锚点。
    approximationNotes: 这些区间是以十亿美元计的判断带，来自公开可比公司约束和第三方收入锚点，不是管理层预测或 DCF。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV046
