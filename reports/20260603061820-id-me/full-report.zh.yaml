      - number: '5.2'
        title: 集成界面与运营架构
        blocks:
          - type: paragraph
            body: >-
              ID.me 的公开技术界面比消费者钱包落地页暗示的更宽。开发者文档列出 OIDC、SAML、OAuth 2.0、PKCE、Shared Signals Framework、Applications
              API、Document Passback API、Events API、Services API、Identity Gateway、Digital Wallet、Work
              Authentication、Attributes Exchange 和 Attribute Matching，说明它要做的是夹在依赖方和钱包之间的联合身份层，而不是单一固定登录流程。最具体的代码级披露是
              Android SDK。公开代码库和 README 显示，它支持基于 Chrome Custom Tab 的认证、OAuth PKCE 和 OIDC 模式、令牌存储与刷新、加密凭证、JWT
              校验、生产与沙盒环境，以及分组策略支持。同一代码库还暴露了认证、令牌、JWT、存储、网络和演示代码的内部模块边界，比高层文档更能让外部看清集成机制。代价是后端架构仍选择性不透明：公开材料清楚标出协议界面和 SDK
              模块，但没有披露核验、钱包和联合身份服务之间的内部服务拓扑、租户隔离设计、速率限制或故障域边界。
