        title: 资本充足性与最终判断：融资可信，投资判断信息不完整
        blocks:
          - type: paragraph
            body: >-
              短期资本可得性看起来充足，但尚未完全尽调。ID.me 宣布 2025 年 $340 million 融资，估值超过 $2 billion；Sacra 称其中包括 $65 million 股权和 $275
              million 信贷额度。这足以说明公司仍获得投资人和贷款人支持，尤其是在 IRS 和 CMS 合同动能延续的背景下。收入估算也有建设性方向：Sacra 估计 2023 年收入为 $130
              million；MicroVentures 报道 2024 年收入为 $150 million，并复述管理层称截至 2024 年增长超过
              450%。但这些数字都未经审计，也未分部披露；已保留的公开来源没有披露手头现金、月度烧钱、现金续航、债务契约或客户集中度。市场报告和公开身份软件可比公司支持长期需求，以及 API 优先经常性模型的吸引力；但
              ID.me 自身证据基础仍更像合同驱动、服务偏重，而不是纯软件。投资判断因此是：需求、分销和新融资为正面；但在产品级毛利、集中度和资产负债表披露可见之前，对估值支撑保持谨慎。
