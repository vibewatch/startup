      - number: '1.4'
        title: 里程碑、政府规模与反向信号
        blocks:
          - type: paragraph
            body: >-
              ID.me 的里程碑轨迹显示，公司先在信任敏感的政府和福利流程中扩张，之后再拓展到医疗和商业身份用例。早期时间线从 2010 年创立，到 2013 年更名和 NIST 拨款，再到 2016 年 VA.gov，以及
              2017–2018 年的政府安全里程碑。疫情期似乎是拐点：公司称 7 个州认为它帮助阻止了超过 $270 billion 的失业欺诈，Virginia Employment Commission
              案例研究称，2024 年上线后，数字化采用率、呼叫中心负载和员工效率均出现实质改善。


              近期动能集中在政府项目。官方和独立来源显示，CMS 扩展到 Medicare.gov、Social Security 2025 年把在线登录改为仅支持 ID.me 或 Login.gov、以及据报道 IRS
              BPA 到 2030 年最高可达 $1 billion。公开规模指标也在 2025 年持续上升，从周年文章中的 139 million 用户，到 9 月融资公告中的 152 million，再到 12 月 CMS
              公告中的 157 million。尽管不同来源之间并不完全同步，这些数字的方向仍很强。


              下行情景不在明显商业崩塌，而在监督和运营可靠性。GAO 和 Biometric Update 记录了 IRS 项目的严重监督缺口，包括缺少绩效目标和 AI 清单控制；FedScoop
              则记录了面部识别争议仍在持续。另一个信号是，状态页在 2026 年 5 月下旬记录了一起移动钱包事件。这些事实都不能推翻规模故事，但说明 ID.me 的信任护城河同时依赖监管信心和正常运行纪律。
