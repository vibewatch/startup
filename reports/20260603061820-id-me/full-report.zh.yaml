      - number: '7.4'
        title: 财务和模型风险只有设定明确止损标准才可控
        blocks:
          - type: paragraph
            body: >-
              公开财务叙事足以证明动能，却不足以让人有把握地承保下行情景。ID.me 披露了一笔融资方案，公司估值超过 $2 billion，也显示钱包和登录增长很快；Sacra
              描述的则是按使用量计费的模型，成功身份结果和后续复用推动收入。只要转化率保持高位、机构持续续约，这个模型很有吸引力。但如果监管信任滑坡、故障拖慢恢复流程，或联邦买家转向替代方案，风险就会变大，因为这些变化会同时影响首次验证收入和后续凭证复用。更大的问题是披露深度。公开来源仍未显示当前年收入、联邦收入占比、重大合同利润结构，也没有披露失败场景下决定下行严重度的
              SLA 和赔偿条款。因此，正确的投资姿态应当是有条件的：在假设规模自动等于韧性之前，先要求集中度明细、合同包和公平性证据。
