        - 销售可配置的全球身份智能，并扩展到有限的可复用身份
        - 公开入口以演示为主，可见的公共部门凭证叙事弱于 ID.me
      - - Auth0 / Okta
        - 既有 IAM / CIAM 替代方案
        - 每月 10B plus 次认证，并提供公开自助定价
        - 消费应用、联网设备、企业开发团队
        - 登录、SSO、MFA、无密码、机器人检测、集成、可扩展性
        - 将客户身份打包进更广的开发者和企业身份工作流
        - 针对 CIAM 和账户编排优化，而不是跨机构与品牌的可复用核验
      - - Trulioo
        - 全球入驻与 KYC 同业
        - 私营全球身份平台，销售以演示带动
        - 跨境入驻、支付、交易、市场平台、受监管服务
        - 个人验证、KYC 数据和文件、电子身份、企业验证、防欺诈智能
        - 在最看重全球覆盖和工作流灵活性的场景拿单
        - 公开信息未显示消费者钱包或透明入门价格
      - - CLEAR1
        - 公共部门与医疗替代方案
        - 官方信息显示 41mm plus 现有用户，并入选 Medicare
        - 医疗、劳动力、客户入驻、账户恢复买方
        - 多信号身份验证、劳动力和患者工作流
        - 将可信生物识别品牌延展到企业身份和 Medicare 相邻工作流
        - 广泛跨机构复用的证据少于 ID.me，企业销售仍以报价带动
      - - Login.gov
        - 政府替代方案
        - FedRAMP Moderate ATO 和官方机构合作伙伴模式
        - 联邦、州、地方和属地机构
        - MFA、认证、身份验证、SAML 和 OIDC 集成
        - 作为政府拥有的登录基础设施服务机构项目
        - 政府合作之外，不能作为商业、商务或医疗钱包使用
      - - SheerID
        - 相邻的已验证属性替代方案
        - 声称覆盖数百个品牌和 200K plus 权威数据源
        - 零售、媒体、旅游、电信、消费应用、会员和优惠团队
        - 受众资格验证、优惠保护、已验证客户数据采集
        - 将已验证身份转化为营销、会员和优惠保护工作流
        - 在高保证身份、跨机构登录和公共部门凭证上比 ID.me 窄
    notes: 公开来源对竞争对手类别、产品范围和 GTM 姿态的支撑强于实际合同规模。因此， 规模单元格使用最强的可支撑公开信号，而不是强行统一成收入或融资数字。
