chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、阶段和运营模式
        blocks:
          - type: paragraph
            body: >-
              ID.me 是一家位于弗吉尼亚州 McLean 的数字身份公司，Blake Hall 于 2010 年创立，2013 年从 TroopSwap/Troop ID 更名并扩展为更广义的 ID.me
              钱包平台。公司现在把自己定义为可复用数字身份钱包：用户验证一次，存储已验证身份或社区「卡片」，之后即可在政府、医疗和商业网站之间复用这些凭证，无需每次重新走核验流程。官方材料强调用户可以控制共享哪些数据；产品页面则把产品定位为不止一个登录组件：这套栈覆盖身份验证、MFA、访问管理、凭证校验和钱包服务。


              公开渠道中最清晰的商业模式描述来自 Sacra，也与 ID.me 自身产品界面一致。公司采用 B2B2C
              模式，机构、医疗组织和品牌为成功验证和持续凭证复用付费，终端用户不直接买单。只要同一高保证凭证能在多个依赖方之间复用，这种模式就最有力，尤其是在公共部门流程中。公开材料和案例研究显示，同一个身份层已经用于联邦福利访问、州失业救济流程、医疗身份核验和商业社区验证。


              截至本次报告日期，估值超过 $2 billion、2025 年 Series E 加信贷组合、以及不断扩大的联邦合同足迹，足以把 ID.me
              归入后期私营公司。更不清楚的是典型封面指标的深度：公开来源在用户、机构和融资标题上信息更强，但对经审计收入、员工数、设施数量和董事会透明度披露有限。
