  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 政府身份核验和登录
        - 面向联邦 / 州门户的高保障公民核验、MFA、可复用登录和身份恢复
        - 通用网站 SSO、低保障账户创建、无关机构软件
        - 机构采购并付款；公民使用
        - ID.me 已经实现规模化采用的核心当前市场
      - - 医疗患者和受益人访问
        - 面向 Medicare、患者门户、记录访问和互操作流程的身份验证与可复用凭证
        - 与身份无关的临床系统支出、通用 EHR 授权
        - 机构、付款方、服务提供者或健康平台付款；患者使用
        - CMS 和更广医疗足迹已经验证的具体相邻市场
      - - 雇主和劳动力 / 福利身份
        - 劳动力或资格核验、强登录、社区或就业状态验证
        - 未绑定核验的通用 HRIS、薪资或协作软件
        - 雇主付款；员工或申请人使用
        - 经过验证的身份可降低欺诈和帮助台摩擦，因此是有用相邻市场
      - - 品牌、商户和社区验证
        - 面向折扣、门控访问和信任项目的已验证属性与社区检查
        - 广义营销技术支出或通用忠诚度软件
        - 品牌付款；消费者使用
        - 重要商业切入口，但不是整个消费者互联网认证市场
      - - 可复用钱包和属性交换
        - 钱包卡、便携凭证复用、经同意的属性分享和依赖方集成
        - 没有复用层的一次性证件检查
        - 依赖方付款；用户携带凭证
        - 这是能把价值扩展到一次性验证之外的差异化因素
      - - 更广数字身份 / CIAM 相邻市场
        - API 身份流程、编排、云身份服务和身份基础设施
        - 不需要高保障核验或可复用属性的通用 IAM 或 CIAM 合同
        - 横跨安全、IT、产品和合规的混合企业买家
        - 对预算语境重要，但太宽，不能称为 ID.me 的直接 SAM
    notes: 边界由受监管流程和可复用信任价值界定，而不是由最宽泛的身份软件标签界定。最后一行是相邻支出，不是完全纳入的市场池。
