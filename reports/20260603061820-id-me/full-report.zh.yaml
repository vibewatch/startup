    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值摆动最大的因素，是 ID.me 是否配得上相对已披露公开身份可比公司的溢价。
    data:
      items:
        - label: Mitek 市销率（Jun 2026）
          value: 4.25
        - label: Okta 市销率（Jun 2026）
          value: 8.13
        - label: CLEAR 市销率（Jun 2026）
