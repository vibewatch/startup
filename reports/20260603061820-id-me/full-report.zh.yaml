  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 含义
      - 尽调问题
    rows:
      - - 身份欺诈、网络犯罪和 KYC/AML 压力
        - 驱动因素
        - 当前 + 持久
        - 受监管行业会更优先为高保证身份核验安排预算
        - 按对欺诈敏感的工作流和合规制度拆分需求
      - - 政府数字服务现代化与互操作性
        - 驱动因素
        - 当前 + 中期
        - 支撑 CMS、IRS、SSA、VA 及相关项目扩张
        - 梳理哪些机构要可复用的跨项目凭证，哪些只要点状方案
      - - 可复用凭证和钱包网络效应
        - 驱动因素
        - 当前 + 持久
        - 如果大量用户已完成验证，后续依赖方的获客摩擦可能更低
        - 要求提供复用率、重复登录和跨依赖方转化的队列数据
      - - API 优先与云集成模式
        - 驱动因素
        - 当前 + 中期
        - ID.me 能嵌进现有身份栈时，企业嵌入会更可行
        - 按细分市场测算平均集成时间和对合作伙伴的依赖
      - - 实施成本、人工审核和包容性运营
        - 约束
        - 当前
        - 相比更轻量的 API，高保证和兜底路径可能抬高服务成本
        - 按工作流索取毛利率和人工审核强度
      - - 隐私、生物识别留存和 AI 监管审视
        - 约束
        - 当前 + 政策敏感
        - 信任出问题会拖慢采购、触发监督，或限制用户接受度
        - 审查删除控制、可审计性和反向政策暴露
      - - 替代方案和多供应商工作流
        - 约束
        - 当前 + 中期
        - 即便 ID.me 在场，Login.gov、CLEAR 和平台原生钱包也能拿下部分工作流
        - 量化买方同时使用多家供应商时的工作流份额和续约风险
      - - 公共部门集中度和采购节奏
        - 约束
        - 当前
        - 大型公共部门交易能撑起规模，也会带来集中度和政策风险
        - 要求提供垂直收入结构、最大客户暴露和采购管线时点
    notes: 表中同时放入品类层面的需求驱动因素和买方特定采用约束，因为 ID.me 卖进的是 受监管工作流，而不是一个同质的软件市场。
