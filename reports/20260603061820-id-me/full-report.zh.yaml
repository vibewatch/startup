  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同行、相邻套件与可能替代品
        blocks:
          - type: paragraph
            body: >-
              ID.me 的竞争场域比一份简单的身份验证供应商名单更宽，因为买家可以用多种方式完成同一任务。最接近的直接同行是 Persona、Socure、Jumio 和 Trulioo 等 API
              优先的身份与欺诈平台，它们都强调可配置入门、KYC/KYB、证件或生物识别检查，以及可编程流程。只要买家把身份视为交易型验证层，而不是可携带钱包或可复用凭证，这些供应商就会与 ID.me 重叠。Auth0
              从另一个方向竞争：它大规模销售 CIAM 和登录基础设施，开发者工具强、公开定价清晰、装机基础信誉广，但不提供消费者钱包或政府级可复用身份网络。CLEAR1 和 Login.gov
              重要，因为它们是可见的公共部门替代品。SheerID 范围更窄，但在已验证属性电商中仍有相关性，因为它解决优惠和资格验证，而不要求买家采用 ID.me 更宽的钱包模式。
