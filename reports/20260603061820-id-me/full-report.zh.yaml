  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品交付与用户流程
        blocks:
          - type: paragraph
            body: >-
              从客户流程看，ID.me 销售的是可复用数字身份钱包。个人创建一次账户，用 MFA
              加固，完成高保证核验步骤，然后同意把已验证数据回传给政府机构、医疗站点、雇主或消费品牌。公司并不把钱包只呈现为登录容器：同一个界面用于政府访问、社区身份卡和属性共享。最强的流程证据来自政府用例，用户旅程很明确。依赖方把用户引导到
              ID.me，用户创建或复用钱包，完成 MFA，上传证件和 SSN
              证据，然后自助完成，或升级到短时视频、延长视频或线下核验，最后返回伙伴网站同意释放数据。这一流程足够具体，可以把产品判断为身份与属性经纪层，而不只是凭证保险箱；但公开材料仍未披露各路径转化率、步骤流失率或辅助验证的人员服务水平。
