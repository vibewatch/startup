  - id: TP004
    title: 分发、信任与监管姿态对比
    columns:
      - 供应商
      - 分发锚点
      - 公开信任或合规信号
      - GTM 动作
      - 对 ID.me 的含义
    rows:
      - - ID.me
        - 可复用钱包已用于机构、州、医疗和品牌
        - IAL2/AAL2 和公共部门核验叙事
        - 自上而下的受监管销售，加上消费者凭证复用
        - 如果钱包接受度持续累积，网络效应会真实释放
      - - Persona
        - 面向开发者和创业公司的可获得性，配套可配置平台
        - SOC 2 信息和按成功验证计价的逻辑
        - 产品驱动入口加企业方案
        - 买方先要灵活工作流、还没要钱包网络时，Persona 能赢
      - - Socure
        - 防欺诈工具广度、自助 Launch 和企业 RiskOS
        - FedRAMP 授权和公共部门采购工具
        - 自助与企业混合动作
        - 以欺诈捕获为核心的机构和金融科技交易中威胁很强
      - - Auth0
        - Okta 装机基础和开发者触达
        - 公开网站上的 99.99 percent SLA 和规模指标
        - 强自助能力和企业扩张
        - 任何被包装成登录和客户身份编排的新支出，门槛都会被抬高
      - - Jumio
        - 全球证件和身份覆盖
        - 平台声称有数十亿笔交易和 5K plus 身份证件类型
        - 企业顾问式销售
        - 在跨境开户或欺诈驱动型部署中，是强替代方案
      - - CLEAR1
        - 消费者生物识别网络，品牌信任度高
        - 41mm 以上用户，并在官网列为 Medicare 选项
        - 面向企业医疗和劳动力场景销售
        - 在账户恢复和医疗身份流程中切入点强
      - - Login.gov
        - 官方政府合作伙伴模式
        - FedRAMP Moderate、NIST 对齐，支持 SAML 和 OIDC
        - 仅走机构合作路径
        - 机构偏好政府自有基础设施时，会压制 ID.me 在公共部门的上行空间
      - - SheerID
        - 商务和忠诚度项目，拥有数百个品牌关系
        - 200K 以上权威数据源，并有结果导向的案例
        - 营销和权益项目销售路径
        - 守住已验证属性商务这个细分市场，但不具备 ID.me 更大的钱包野心
    notes: 这个品类的分发来自不同资产：有的供应商从用户网络起步，有的靠开发者、欺诈工具或政府认证切入。资产组合决定获胜率，也决定切换成本。
    claimRefs:
      - CP002
      - CP010
      - CP017
      - CP023
      - CP026
      - CP041
      - CP044
  - id: TP005
    title: 政府 / 公共部门替代表
    columns:
      - 替代方案
      - 公开来源中的可见位置
      - 买家可能选择它的原因
      - 相比 ID.me 的约束
      - 竞争含义
    rows:
      - - Login.gov
        - Login.gov 合作伙伴页面；SSA 和 VA 同时支持 Login.gov 与 ID.me
        - 政府自有 MFA 和身份基础设施，具备 FedRAMP Moderate，并支持 OIDC/SAML
        - 仅面向政府，不是广泛的商业钱包
        - 真实替代机构登录项目，尤其是在公共所有权重要时
      - - CLEAR1
        - CLEAR1 官方 Medicare 声明，加上 FedScoop 的 Medicare 报道
        - 消费者生物识别品牌强，定位覆盖账户恢复、医疗和劳动力场景
        - 公开证据较少，无法证明凭证可在多机构间广泛复用
        - 可与 ID.me 共存，并削弱医疗和恢复流程中的钱包独占性
      - - 机构或州自建的现状方案
        - IRS、SSA 和 VA 仍通过自身账户流程和 MFA 政策页面界定身份
        - 把控制权留在现有门户和政策内
        - 在可携带性、复用和私营部门连续性上往往更弱
        - 拖慢“单一私营钱包成为通用前门”的叙事
      - - Socure 公共部门打法
        - 通过 FedRAMP 授权的联邦与州 / 地方页面，并列出采购载体
        - 面向机构主打欺诈降低和 AI 决策
        - 公开页面没有可比的消费者钱包复用故事
        - 当欺诈拦截优先级高于凭证可携带性时，会威胁 ID.me
      - - API 优先的全球供应商
        - Persona、Jumio 和 Trulioo 都主打可配置的开户、KYC 和全球验证
        - 工作流灵活，覆盖跨境，并能接入开发者
        - 机构登录标准化的公开证据较弱
        - 现代化项目更想要组件而非品牌钱包时，这类供应商最重要
      - - IAM 和 CIAM 套件
        - Auth0 公开的 CIAM 页面和定价
        - 试用容易，已有企业关系，登录功能集合宽
        - 设计目标不是可复用的公共福利钱包
        - 可吸收部分购买标准，降低买家新增专用身份层的意愿
    notes: 本表聚焦能拿走同一预算全部或部分份额的替代方案。这里同时列入供应商和现状方案，因为机构解决身份问题时，并不总是用另一家商业供应商替换现有供应商。
    claimRefs:
      - CP024
      - CP025
      - CP026
      - CP027
      - CP028
      - CP029
      - CP040
      - CP043
  - id: TP006
    title: 切换成本与多平台并用比较
    columns:
      - 锁定路径
      - 黏性来源
      - 黏性证据
      - 多平台并用的出口
      - 含义
    rows:
      - - 可复用钱包采用
        - 用户可把一个已验证凭证带到更多依赖方
        - ID.me 公开强调钱包可在机构和私营实体间复用
        - 买家仍可为特定工作流加入其他验证方
        - 护城河有帮助，但前提是更多依赖方持续接受该钱包
      - - 高保障合规姿态
        - 项目不愿重做保障、无障碍和支持设计
        - ID.me、Login.gov 和机构页面都用标准与 MFA 选择来界定身份
        - 机构可把部分流程转到 Login.gov 或分层供应商
        - 合规带来惯性，但不保证独占
      - - 恢复与支持运营
        - 多语言恢复、辅助验证和视频兜底很难快速重建
        - ID.me 与 CLEAR 都强调监管工作流中的恢复和支持价值
        - Medicare 显示，恢复流程可以按旅程拆分
        - 运营支持有黏性，但买家仍可切分技术栈
      - - API 与工作流配置
        - 工程团队会把真实时间投入定制集成和策略逻辑
        - Persona、Socure、Jumio、Trulioo 和 Auth0 都主打可编程身份层
        - 若身份被视为组件，竞品 API 可以相互替换
        - API 占比高的账户，耐久性可能不如钱包驱动账户
      - - 已验证属性和忠诚度项目
        - 营销项目会长期复用同一套受众逻辑和优惠
        - SheerID 在已验证受众商务中给出强商业证据
        - 商务买家可选择更窄的已验证属性工具，而非完整身份钱包
        - 即便有钱包卡片，ID.me 也没有完全占住这条赛道
      - - 采购和伙伴渠道
        - 联邦和企业买家常依赖获批采购载体和熟悉的伙伴
        - Socure 列出采购载体；Login.gov 是官方方案；ID.me 有机构覆盖
        - 新进入者仍可通过相邻合同或打包套件进入
        - 渠道准入抬高门槛，但不足以挡住侧翼进入者
    notes: 切换成本证据在监管运营和可复用身份中最强，但公开记录也显示，买家可按工作流、受众或采购路径清晰地多平台并用。
    claimRefs:
      - CP001
      - CP002
      - CP025
      - CP026
      - CP028
      - CP031
      - CP040
      - CP041
  - id: TP007
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河或风险
      - 证据
      - 威胁来源
      - 严重性
      - 尽调要点
    rows:
      - - 可复用的高保障钱包是真正差异化
        - ID.me 和 Sacra 都强调价值不止一次性检查，而在复用
        - 若依赖方接受度停滞，钱包价值会下降
        - 中
        - 按垂直行业衡量复用频率、依赖方增长和重复登录变现
      - - 政府和医疗立足点带来信任与分发
        - ID.me 公开声称已有机构和医疗规模
        - Login.gov 和 CLEAR 显示，同一批买家仍可采用替代方案
        - 高
        - 获取当前机构层面独占部署与共享部署的拆分
      - - 透明 API 定价会重置买家预期
        - Persona、Socure 和 Auth0 都公布自助入门价格
        - 较小或中端市场买家可能拿 ID.me 与更便宜或更容易试用的方案比较
        - 中
        - 量化有多少交易因其他地方更容易发现价格而在采购前流失
      - - Medicare 证明多平台并用，而非赢家通吃
        - CLEAR 官网和 FedScoop 都显示其与 ID.me 共存
        - 类似拆分部署可能出现在其他公共项目
        - 高
        - 请求 CMS、SSA 和 VA 账户旅程的范围、量级和续约细节
      - - API 优先和编排迁移可能让单点身份检查商品化
        - Future Market Insights 指出，API 优先 SaaS 和编排正成为收入重心
        - 买家想要组件而非网络时，Persona、Socure、Jumio 和 Trulioo 竞争力强
        - 高
        - 测试 ID.me 靠复用赢单的频率是否足以抵消低摩擦 API 竞争
      - - 平台原生和套件供应商可能吸收身份预算
        - Sacra 强调 Apple、Google 和企业套件是长期替代风险
        - 更宽的平台可把专业厂商挤到边缘场景或备用流程
        - 中
        - 跟踪移动凭证、套件捆绑或政府自有基础设施是否降低对第三方钱包的需求
    notes: 严重性反映的是 ID.me 竞争耐久性的承销风险，而非被替代的确定性。公开证据支持“中等护城河且压力点清晰”的判断，而不是赢家通吃的市场结构。
