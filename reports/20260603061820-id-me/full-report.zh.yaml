      - number: '2.2'
        title: 受证据约束的 TAM、SAM 与公开市场视角
        blocks:
          - type: paragraph
            body: >-
              公开市场数据有方向价值，但数字并不一致。MarketsandMarkets 预计全球身份验证市场 2025 年为 USD 14.34 billion，2030 年为 USD 29.32 billion；Grand
              View Research 则给出略小的历史基数，但仍预计 2030 年达到 USD 33.93 billion。Future Market Insights 采用更宽的数字身份服务口径，2025 年为 USD
              28.5 billion，因为它纳入编排、凭证签发、钱包和纯验证之外的其他服务层。正确结论不是某个估算「正确」，而是这些视角描述了不同边界。更窄的地域代理是 2025 年 USD 4.34 billion
              的美国身份验证市场，比全球数字身份标题更贴近 ID.me 几乎完全在美国的足迹。买家层面的公开预算信号更窄：GovConWire 报道 IRS 一揽子采购协议到 2030 年最高 USD 1
              billion，FedScoop 把 CMS/Medicare 扩展放在约 USD 5 million 的合同背景中。这些视角比模型生成的 SOM 更能框定机会。ID.me 披露的 152 million 至
              157 million 用户、76 million 至 80 million 个 IAL2 验证身份，证明采用规模可观；但公开数据仍没有充分披露合同定价、垂直行业组合、续约或附加率，无法支撑精确的可获取份额模型。
