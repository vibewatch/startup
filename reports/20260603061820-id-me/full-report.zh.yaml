  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 何种证据会改变判断
    rows:
      - - 投资逻辑
        - 可复用凭证如今已出现在 IRS、SSA、VA、宾夕法尼亚州失业救济和 Medicare 流程中；市场报告仍支持身份领域的长期顺风，2025 年融资也证明资本仍可获得。
        - 只有管理层证明这种复用能转化为比公开锚点强得多的当前收入、利润率和留存，才上调判断。
      - - 反向逻辑
        - 同一份公开记录也显示，隐私和 AI 监督正受审查，政府部署由多家供应商参与，CLEAR、Jumio、Mitek 和 Okta/Auth0 构成真实竞争，名义估值已经高于公开可比公司快照。
        - 如果留存规则拉长、采购放缓，或隐藏融资堆叠对新投资者明显更优先，就应迅速下调判断。
    notes: 反向逻辑关注的是估值耐久性和证据质量，并不是否认 ID.me 已经搭起了真实平台。
