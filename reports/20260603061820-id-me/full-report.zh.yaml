  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私风险仍是最高严重度风险栈
        blocks:
          - type: paragraph
            body: >-
              ID.me 最高的剩余风险不是普通产品竞争，而是围绕生物识别身份核验的监管信任。公开记录显示，IRS 仍依赖 ID.me 作为其唯一 IAL2 提供商，用于一个 2021 年至 2024 年处理超过 150
              million 次访问的项目；与此同时，GAO 关于目标和 AI 监督的核心建议仍显示未完成。这个组合很重要，因为公司的法律文件清楚表明，ID.me 收集异常敏感的输入——政府身份证件图像、关联 Social
              Security
              的信息、生物识别数据和机构报告数据——而其生物识别同意声明允许在钱包关闭后最多保留一年。这些政策不是不当行为证据；它们是高保证身份提供商的正常法律脚手架。但如果监管机构、立法者或政府机构认定删除规则、公平性证据或
              AI 治理控制不足，这些政策就定义了冲击半径。因此，这项风险最好被视为按严重度排序的隐私和采购敞口，而不是单一诉讼标题。
