            body: >-
              当买家需要高保证核验、凭证复用，以及多语言协助或跨项目恢复等包容性兜底路径时，ID.me
              的护城河最可信。这些功能会制造真实切换成本，因为买家替换的不只是一项证件检查，而是一个可能已经横跨多个依赖方的凭证网络、支持流程和合规工作流。但同一组证据也说明，护城河并非绝对。API
              优先的身份供应商正在把品类推向编排和经常性 SaaS
              经济性，让身份更容易围绕流程灵活度和开发速度进行比较。平台原生和套件供应商可能把更多登录与信任预算吸收到更大的合同里。同时，公共部门客户可以在不同旅程中同时使用 ID.me、Login.gov 和
              CLEAR。最稳妥的结论是护城河耐久性中等：ID.me 在可复用、高保证身份上确有防御力，但当买家更看重速度、可配置性或套件杠杆，而不是钱包复用和包容性时，商品化风险会上升。
