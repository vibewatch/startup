      - number: '6.3'
        title: 耐久性代理指标、重复登录与扩张循环
        blocks:
          - type: paragraph
            body: >-
              ID.me 不披露 NRR、GRR、logo 流失或平均合同期限等经典 B2B 耐久性指标。即便如此，公开记录仍提供了几个有用代理指标。第一，重复使用在产品结构里内嵌：客户为可复用凭证付费，Sacra
              明确称，当已验证身份被复用于登录和属性检查时，收入会继续产生。第二，披露的登录量很大，2024 年成功登录超过 409 million 次；相比原始 logo
              数，这更能读出耐久性，因为它反映回访使用。第三，州福利证据显示上线后的结果质量：VEC 报告数字使用率提高、呼叫量下降，并且大部分客户通过 ID.me 成功访问福利；Pennsylvania
              则描述了快速自助流程以及人工和线下兜底路径。扩张循环也可见。政府装机基础成为 OtisHealth 医疗获客楔子，已验证候选人基础降低 Sterling
              招聘流程摩擦，品牌折扣项目把政府、医院和医护人员身份拉入商业场景。这些是真实扩张信号，但在 ID.me 披露留存或分细分的货币化数据之前，它们仍只是代理指标。
