  - id: TP003
    title: 定价 / 打包方式对比
    columns:
      - 供应商
      - 公开定价信号
      - 打包姿态
      - 销售动作
      - 对买方的含义
    rows:
      - - ID.me
        - 引用信息中没有广泛公开标价
        - 高保证身份钱包和机构 / 企业项目
        - 以报价和采购流程带动
        - 很适合复杂受监管账户，但自助发现较弱
      - - Persona
        - Essential 每月 USD 250 起；Growth 和 Enterprise 转为联系销售
        - 分层身份平台，提供自助和定制选项
        - 自助入口加企业增购
        - 小团队更容易试用，同时仍能支持复杂项目
      - - Socure
        - Launch 标价每次评估 USD 0.80 至 USD 1.30，另有 USD 1,000 月度额度；Enterprise 定制
        - 预置自助方案加完整 RiskOS 企业栈
        - 自助与企业混合
        - 给买方一个清晰的 API 式验证经济性基准
      - - Auth0
        - 企业版之前有免费、每月 USD 35、每月 USD 240 自助方案
        - CIAM 平台，带附加项和企业层级
        - 产品驱动自助，再向企业扩张
        - 适合想要开发者快速采用和预算清晰的团队
      - - Jumio
        - 引用平台页面仅提供演示
        - 可配置身份智能平台
        - 企业销售带动
        - 最适合买方已准备好进入顾问式入驻流程的场景
      - - Trulioo
        - 引用产品页面仅提供演示
        - 全球身份平台，提供模块化服务
        - 企业销售带动
        - 全球覆盖叙事不错，但公开价格透明度弱
      - - CLEAR1
        - 引用页面没有公开企业标价
        - 企业身份产品绑定医疗、劳动力和账户恢复用例
        - 企业和合作伙伴销售带动
        - 受益于品牌信任，但价格发现仍需要销售周期
      - - SheerID
        - 引用页面没有公开标价
        - 资格验证和受众数据平台
        - 以演示和联系销售为主
        - 对商业优惠有吸引力，但不太适合作为受监管登录定价的直接基准
    notes: 本表比较面向买方公开展示的打包方式，不是实际合同费率。公共部门和医疗的谈判价格 可能与标价或自助入口价格有实质差异。
