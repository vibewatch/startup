      - number: '4.3'
        title: 成本结构与单位经济性：包容性和合规推高交付成本
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，ID.me 的毛利率路径取决于两件事：有多少用户能留在自动化流程里，以及多少量仍会升级到成本更高的人工审核。服务可能要求证件上传、自拍或活体检测、SSN 校验、MFA
              和可复用凭证签发。官方帮助内容显示，视频通话验证可能需要多份证件和真人客服审核；安全页面则强调受监督的远程或线下路径，避免自动化失败的用户被排除。这种包容性优势在政府采购中有商业价值，但几乎肯定会增加纯 API
              供应商不用承担的人工成本。固定成本也不低。ID.me 描述了专职安全人员、FedRAMP 托管基础设施、加密、年度审计和多项 NIST/Kantara 控制。GAO 和 Biometric Update
              显示，IRS 会从 ID.me 收到详细的通过率和流失仪表盘，这意味着公司在运营层面衡量单位经济性，即便没有公开披露。投资人能看到成本栈的大致形状，但看不到实际毛利率或回本测算。
