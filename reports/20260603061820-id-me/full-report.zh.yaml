      - number: '4.2'
        title: GTM 与合同经济性：采购驱动分销，排他性不一
        blocks:
          - type: paragraph
            body: >-
              政府采购是公开记录中最清晰的 GTM 引擎。Carahsoft 通过经销伙伴、GSA Schedule 和 ITES-SW2 扩大触达；VA 和 VEC
              案例研究则显示，合规可信度和可量化服务结果可以把实施胜利转化成续约故事。合同证据也说明，投资人应区分管线和已入账收入。GovConWire 报道 IRS 一揽子采购协议到 2030 年最高 $1
              billion；FedScoop 则把 CMS Medicare.gov 扩展描述为 HHS 合同的一部分，金额约 $5
              million。两者都有经济意义，但代表的货币化阶段完全不同。上限型合同工具代表预算入口和战略重要性，并不保证收入确认。竞争进一步限制定价权。SSA 明确允许 Login.gov 或 ID.me
              二选一，FedScoop 报道 CLEAR 也会支持 Medicare.gov 身份流程。这种共存说明，ID.me 的 GTM 强项来自信任、合规和复用，而不是垄断式联邦排他性。
