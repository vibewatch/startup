      - number: '1.2'
        title: 创始人主导的管理层、治理可见度与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              ID.me 仍明显由创始人主导。Blake Hall 仍是创始人兼 CEO，已审阅的官方来源反复让 Hall 作为公司使命、重大融资和重要政府合同里程碑的外部发声人。这种模式很重要：它说明公司的公开可信度仍与
              Hall 的创始人叙事、军旅背景和长期的隐私与信任框架紧密绑定。从尽调角度看，这是典型的关键人信号。它不必然是负面，但确实意味着战略叙事、投资人信心和公共部门信任异常集中在一个高管形象上。


              公开可见的其他领导梯队更薄。Carahsoft 2023 年合作公告披露 Derrick Roberts 为业务拓展总监，FedScoop 对 CMS 的报道提到 Wes Turbeville
              是联邦与医疗高级副总裁，说明公共部门分销和行业 GTM 周围有职能领导。但本次审阅的来源未给出当前完整高管名单、具名董事会成员或委员会结构。考虑到 ID.me
              现在横跨敏感的政府和医疗流程，却仍是私营公司，且治理信息相对不透明，这一点值得注意。


              实际含义是，领导连续性看起来很强，但治理尽调不能只依赖公开材料。任何严肃尽调都应直接索取董事会名单、投资人权利结构，以及 Hall 之外哪些高管分别负责产品、财务、运营、安全和监管事务。
