            body: >-
              主要客户风险不在于 ID.me
              是否已有采用，而在于按收入看这些采用有多持久、多分散。公开具名证据集中在政府和受监管访问，这与公司的合规优势一致；但组合也意味着对公共采购周期、监督和单一供应商争论有实质敞口。Carahsoft
              通过经销商和合同工具拓宽获客渠道，但这并不能消除机构内部围绕包容性、成本和监督进行论证的必要性。GAO 对 IRS 的审查是最清晰的公开警示信号：项目规模很大，但机构没有设定清晰绩效目标，也没有完整记录对
              ID.me 支持系统的监督；监管报道仍把隐私、公平性和单一供应商依赖视为正在发生的问题。私营部门宽度是真实的，尤其在品牌、医疗折扣和劳动力验证中；但公开披露仍没有展示头部账户集中度、续约行为或细分
