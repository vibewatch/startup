      - number: '8.4'
        title: 退出准备度目前仍不完整，所以尽调问题必须聚焦披露质量和下行保护
        blocks:
          - type: paragraph
            body: >-
              ID.me 的体量看起来已经重要，但以这里保留的证据集看，还没到上市就绪。Okta 和 Mitek 给投资者年度报告节奏、申报基础设施和经常性 KPI 披露；ID.me
              给的是私有融资标题、强客户轶事和间接收入锚点。这个差距很重要，因为公开市场买家惩罚收入质量、利润结构和治理不确定性，往往比后期私募投资者更严厉。战略退出的可选性比 IPO
              准备度更容易相信，因为相邻身份和安全平台可以重视客户触达、医疗入口和可复用凭证覆盖，而不必立刻让资产暴露在公开市场披露规范下。但即便这条路，如果隐私留存实践继续有争议，或政府集中度比当前叙事更周期化，也会变窄。因此，必不可少的下一步不是再讲一个市场规模故事，而是一套硬尽调包，把当前收入、利润率、集中度、优先权结构和留存控制对齐。没有这些，正确姿态就是继续跟踪这个真实资产，同时拒绝为公开记录仍无法完全支撑的价格拉伸。
