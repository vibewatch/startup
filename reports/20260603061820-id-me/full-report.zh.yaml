      - number: '5.3'
        title: 部署、凭证复用与差异化
        blocks:
          - type: paragraph
            body: >-
              ID.me 产品成熟度最强的证据不是架构白皮书，而是公开部署行为。IRS、SSA、VA、Virginia 失业系统和已宣布的 Medicare.gov
              上线都描述了同一套可复用凭证逻辑：用户完成一次身份核验，之后可在多个服务中复用该凭证，无需重复完整核验仪式。这种复用把钱包变成分销和数据可用性护城河。公司声称用户超过 157
              million，覆盖广泛的联邦、州、医疗和商业场景；VEC 还给出了更运营化的证据，称上线后数字采用率提高、支持量下降。这种网络效应是 ID.me 区别于 API
              优先验证供应商的主要方式；后者优化一次性检查。它也区别于 Carahsoft
              等更宽采购渠道；这些渠道能帮助分销，但不能替代核心凭证层。同一模式也制造依赖：产品在这些情况下最有价值——机构彼此信任对方的凭证签发、用户到达时已预验证、政府继续偏好可复用中介，而不是多个本地凭证或更新的平台原生身份栈。
