  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议仍为 research-more，因为当前标记价已经计入太多好消息
        blocks:
          - type: paragraph
            body: >-
              以当前公开价格锚点看，正确判断是 research-more，而不是买入。ID.me 确实有后期公司信号：公司和 Sacra 对一笔 2025 年 $340 million 融资方案口径一致，估值超过 $2
              billion；披露的投资财团还包括 Ribbit 和 Ares 这类严肃资本。问题不是 ID.me 看起来弱。问题在于，这个价格已经要求投资者承保公开记录尚未展示的财务结果。第三方收入锚点约为 2023 年
              $130 million、2024 年 $150 million，这意味着在投资者了解 2025 年收入、毛利率、NRR 或债务契约之前，后视估值倍数已经高于约 13x 至
              15x。对一家有网络效应的身份平台来说，这并非不可能；但在同一记录仍缺少审计财务、股权结构优先权和下行保护细节时，很难说有吸引力。因此，入场纪律比欣赏公司更重要：只有尽调证明当前经济性明显更强，或价格跌向能真正补偿披露缺口的公开证据区间，这个标记价才会变得有吸引力。
