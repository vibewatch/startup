      - number: '8.2'
        title: 正命题是有真实客户验证的可复用身份；反命题是审查、集中度和竞争
        blocks:
          - type: paragraph
            body: >-
              ID.me 的多头逻辑很直接。多份市场报告显示，数字身份和验证仍是规模大、还在增长的品类；公司也有公开证据，证明产品不只是一次性证件检查。CMS、Pennsylvania、VA、SSA 和 IRS
              的流程页面都指向一种可复用凭证，并在不同政府场景下配有兜底支持。这比纯交易型 KYC 更像护城河。同一模式也制造出最尖锐的反命题。GAO 称 IRS 仍缺少可衡量的项目目标和合格的 AI
              清单纪律；Biometric Update 强调删除控制依赖供应商证明；Politico 描述了延长生物特征留存的压力；ID.me 自己的隐私政策也保留了有意义的留存弹性。竞争也不是假设。CLEAR 已经进入
              Medicare 推出计划，Jumio、Mitek 和 Okta/Auth0
              也都在销售相邻的身份、风险或客户认证栈。所以本章论点不是「好公司，所以照买」，而是「这是一个真实的可复用身份资产，但如果政策耐久性、独占性或经济性不及预期，溢价会很快压缩」。
