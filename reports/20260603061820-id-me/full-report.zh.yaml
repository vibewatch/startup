      - number: '7.3'
        title: 可携带性有价值，但公共部门集中度和渠道依赖仍会重定价增长
        blocks:
          - type: paragraph
            body: >-
              ID.me 的网络效应是真实的，但同一组公开证据也说明，不能把可携带性误读成独占性。Social Security 和 VA 都允许 Login.gov 与 ID.me 并存，Medicare 还在加入
              CLEAR 作为另一种选择。也就是说，钱包可以跨机构有用，却仍可能被替代：只要某个供应商看起来更便宜、更容易治理，或政治争议更小。采购集中度会放大这种风险。GovConWire 报道 IRS 的 BPA 最高可达
              $1 billion，公共部门分销也经过 Carahsoft 这类政府聚合渠道。这些安排能放大销售、降低导入摩擦，但也意味着预算周期、合同工具、转售商经济性和机构采购偏好会直接传导到收入。VA 和
              Virginia 这类最强公共客户证据证明了耐久性和成效；但它们不能消除一个风险：少数公共机构仍主导战略可信度，并贡献有意义的业务量。
