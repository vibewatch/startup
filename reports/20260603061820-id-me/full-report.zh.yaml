      - number: '2.3'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              理解 ID.me
              的市场分层，最好看谁拥有流程和预算，而不是看单一终端行业。在联邦和州项目中，买家和付款方是试图保护福利、税务或公民服务访问的政府机构，用户则是越来越希望复用既有凭证的居民、纳税人或申领人。在医疗领域，买家可以是付款方、公共机构、医疗系统或数字健康平台，它们需要以更强核验和互操作性支持患者或受益人访问。在雇主和商业品牌用例中，组织付费，让用户无需反复人工检查就能证明资格、员工身份或社区状态。可复用钱包很关键，因为它缩短后续依赖方的入门流程：IRS、SSA、VA
              以及现在的 CMS 都告诉用户，既有 ID.me 凭证可以沿用。这种复用创造了真实网络效应，但每个细分仍以不同方式评估
              ID.me。公共机构关心减欺诈、可及性和采购路径；医疗买家关心合规、患者体验和数据共享信任；品牌和雇主关心转化、欺诈和已验证属性的效用。因此，同一平台横跨多个买家类别，但每条赛道的采用触发因素、预算所有者和竞争替代品不同。
