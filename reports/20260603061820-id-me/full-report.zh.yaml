      - number: '2.4'
        title: 增长驱动、采用约束与关键缺口
        blocks:
          - type: paragraph
            body: >-
              这个品类最强的增长驱动来自持续的欺诈压力、政府和受监管流程数字化，以及复用已验证身份、避免反复人工核验的价值。MarketsandMarkets 和 Grand View Research
              都把网络犯罪、身份盗窃和合规列为需求引擎；CMS 和 Medicare 的表述也显示，现代化和互操作性已经成为公共部门的明确购买动机。ID.me 还受益于 Carahsoft
              带来的采购杠杆、与主流身份栈的技术兼容性，以及案例研究显示买家上线后能提升服务水平、降低支持成本。但约束同样重要。高保证核验不是轻量插件：集成工作、合规审查、人工兜底和包容性路径都会推高服务成本。隐私和信任仍是结构性门槛，因为监管机构、立法者、民权组织和媒体持续审视面部识别、生物识别留存和
              AI 监督。多供应商竞争也很真实。Login.gov 仍是联邦访问中的替代方案，FedScoop 报道 CMS 也在 Medicare 流程的一部分使用 CLEAR；Sacra 还强调 Apple、Google
              和企业身份套件带来的长期平台风险。结论是，市场有强劲长期顺风，但在毛利、政策耐久性或干净的可获取份额假设上，没有免费通行证。
