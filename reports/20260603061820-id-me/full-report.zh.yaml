        - 询问新机构上线时，已验证用户的激活率
      - - 雇主工作流扩张
        - Sterling 合作延长至 2028 年，并增加招聘、面试欺诈、I-9 和线下能力
        - 正向：打开了一个非福利类企业销售动作
        - 虽然发布于 2023 年，但仍足以支撑战略方向判断
        - 具名终端雇主集中度不可见
        - 索取头部雇主客户、ACV，以及线下验证的附着率
      - - 医疗健康扩张
        - OtisHealth 和医疗服务方页面显示患者访问和提供方 EPCS 验证
        - 正向：医疗健康可以把同一批政府场景沉淀用户变现
        - 2024 年合作加上当前工作流页面
        - 医疗健康没有公开的量级、续约或收入拆分
        - 索取活跃医疗健康组织、MAU 和重复病历请求率
      - - 商业和社群覆盖广度
        - 政府、医院、医疗和公司细分场景里存在数千个合作优惠和员工折扣流程
        - 正向：扩大品牌触面和用户效用
        - 当前商城和帮助页面仍可见
        - 公开证据大多是优惠流程，不是量化合同结果
        - 索取活跃品牌数、GMV 影响和头部合作伙伴集中度
      - - 公共部门采购依赖
        - Carahsoft 带来经销商和合同渠道；GAO 同时指出 IRS 单一供应商项目存在监督缺口
        - 影响混合：渠道有利于分销，但大型机构仍需要谨慎处理采购和治理
        - 风险信号来自 2025 年 GAO，渠道证据仍在
        - 监督、隐私和单一供应商担忧可能拖慢续约或扩张
        - 按采购工具索取公共部门管线、续约胜率和机构审计历史
      - - 集中度不透明
        - 公开材料给出了宽泛数量，但头部客户构成、细分 ARR 和续约指标没有披露
        - 风险在于，投资人无法判断收入是充分分散，还是锚定在少数大型公共部门账户上
        - 截至本次运行日期仍如此
        - 可能掩盖对少数机构、医疗健康组织或品牌项目的依赖
        - 索取前 10 大客户集中度、细分构成和垂直行业流失率
      - - 成本与包容性主张
        - ID.me 称其方案比竞争对手便宜 10-16x，并通过多种兜底路径支撑 87-93% 的通过率
        - 如果属实，在采购中很有杀伤力
        - 当前公司营销材料
        - 方法论来自公司，公开记录中没有完整基准对照
        - 索取独立基准研究和并列 win-loss 分析
    notes: 该表把扩张循环与尽调中最可能重要的公开缺口放在一起。乐观情景是一个已验证凭证跨行业复利；风险情景是，收入集中度和续约质量仍不透明，而公共部门监督又格外关键。
