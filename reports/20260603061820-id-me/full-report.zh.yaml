        title: 客户分层与可复用钱包模型
        blocks:
          - type: paragraph
            body: >-
              ID.me 的客户地图很特殊，因为买家、付款方和终端用户在各细分中差异很大。在联邦和州福利中，CMS、IRS、SSA、VA、Pennsylvania DLI 和 VEC
              等机构是发起客户，公民是终端用户。在医疗中，场景从患者访问病历，扩展到医疗服务方为 EPCS 证明身份，以及医护人员为伙伴优惠验证身份。在雇主和劳动力流程中，Sterling 把 ID.me
              定位为招聘中的身份优先筛查层；商业和社区细分则覆盖政府雇员、医疗、医院和公司员工在数千个合作品牌中的折扣。共同主线是钱包复用。IRS、SSA、VA、Pennsylvania、VEC 和 CMS
              的官方材料都描述了「验证一次」行为：已经证明身份的用户可以返回或跨服务迁移，而不用重复完整核验步骤。这是最强的公开信号，说明客户关系可以在每次部署后复利，而不是重置。
