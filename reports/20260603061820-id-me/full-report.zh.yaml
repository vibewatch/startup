  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 当前收入已高于大约 $200M，复用驱动的增长保持强劲，Medicare 和相邻机构扩张加深，隐私审查仍可控。
        - 支撑约 $2.2B-$2.8B；除非收入明显强于公开锚点，否则较当前估值只有温和上行。
        - 投资者必须相信其经济性比公开记录显示的更像软件公司。
        - 在披露经审计或董事会层面的 2025/26 指标前，概率较低。
      - - 基准
        - 公开 2023 和 2024 年收入锚点大方向正确，增长继续，但利润率或集中度尚未完全去风险；投资者给出按可比公司调整后的溢价，而不是稀缺性溢价。
        - 支撑约 $1.4B-$1.8B，意味着当前估值已经跑在公开证据之前。
        - 如果债务或优先权安排激进，这个估值仍可能过于慷慨。
        - 最符合当前证据集。
      - - 悲观
        - 采购势头放缓，留存或隐私审查恶化，或隐藏融资条款吸收的价值高于预期。
        - 支撑约 $0.8B-$1.2B，并指向降价轮或严重倍数压缩风险。
        - 如果公司无法证明政府规模也意味着耐久经济性，下行会加速。
        - 若新尽调无法补上财务和政策缺口，概率会明显上升。
    notes: 区间是以十亿美元计的宽泛判断带，来自公开可比公司纪律和第三方收入锚点，不是管理层预测。
    claimRefs:
