      - number: '8.3'
        title: 公开可比公司和情景区间支持纪律，而不是追逐动量
        blocks:
          - type: paragraph
            body: >-
              公开可比公司会给私有叙事加上纪律。按 2026 年 6 月快照，CompaniesMarketCap 显示 Okta 约 8.1x 销售额、CLEAR 约 8.4x、Mitek 约
              4.25x。这些公司不是完美可比，但足以框定投资者通常愿意为已披露身份或身份相邻业务支付什么价格。在这个背景下，ID.me
              基于公开收入锚点的隐含后视倍数仍明显高于区间。这不能证明私有标记价错了；但它意味着举证责任转向管理层。牛市情景需要当前收入明显高于公开锚点，还要证明复用、医疗扩张和反欺诈定位正在转化成软件式经济性。基准情景认为今天的标记价略领先公开证据，应更接近经过可比公司调整的区间。熊市情景则认为，隐私审查、采购放缓或隐藏融资结构会把公司拉向更严苛的公开市场视角。换句话说，情景分布很宽，因为证据缺口很宽。
