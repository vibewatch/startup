      - number: '1.3'
        title: 融资历史、投资人图谱与披露限制
        blocks:
          - type: paragraph
            body: >-
              融资标题很清楚：ID.me 2025 年 9 月宣布一揽子 $340 million 融资，估值超过 $2 billion。公司披露 Ribbit Capital 领投，Ares Credit
              funds、Moonshots Capital 和 Positive Sum 参与；Sacra 则报道该组合大致由 $65 million 新股权和 $275 million Ares 信贷额度构成。Sacra
              还指向此前已披露的 2021 年 $100 million、2023 年 $132 million 融资，以及 2021 年 $1.5 billion 估值。这些披露支持 2021 年以来至少 $572
              million 的资本投入，但无法完全回答公司生命周期累计融资问题，因为早期轮次、二级交易和债务工具的精确范围仍只部分公开。


              投资人组合本身也有信号。Ribbit 领投说明身份基础设施获得金融科技级别的信心；Ares 带来资本，也带来债权人影响；Sacra 列出的早期支持者包括 CapitalG、Morgan Stanley
              Counterpoint、FTV Capital、PSP Growth 和 Viking Global，说明资金更像长期增长资本，而不只是小型 VC
              支持。话虽如此，投资人可见度仍强于股权结构精度。外部看不到持股比例、清算优先权、二级交易或契约细节。


              对投资读者来说，正确结论不是资本基础薄弱，而是公司在后期阶段财务可信，同时仍把核心融资机制留在私域。这种组合在高关注度私营公司中很常见，但意味着下行和控制权分析无法仅凭公开材料完成。
