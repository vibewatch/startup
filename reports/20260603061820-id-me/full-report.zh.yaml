  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：横跨公共与私营部门的可复用身份结果
        blocks:
          - type: paragraph
            body: >-
              ID.me 的收入模型更像交易与复用驱动的身份网络，而不是按席位收费的 SaaS 供应商。Sacra
              称，身份验证成功时客户付费，已验证凭证被用于登录和属性检查时客户继续付费。公司官方公告让这条复用回路具象化：ID.me 称 2024 年新增 20.4 million 个钱包，支撑 409 million
              次成功登录，并在 2025 年末达到 152 million 至 157 million 用户。钱包、IRS、SSA、VA 和 CMS
              界面都强化了同一商业逻辑：一旦用户拥有已验证凭证，下一个机构或企业就可以接受该凭证，而不必强迫用户完整重走流程。这对收入质量有利，因为装机基础可以复利增长，公司不必从零重新获取每个用户。负面是，公开证据仍未披露按垂直行业确认的收入、按客户类型实现的定价，或首次验证、经常性登录和属性验证收入之间的拆分。
