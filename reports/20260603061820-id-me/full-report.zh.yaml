      - CV046
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入桥接
        - 经审计的 2025 年收入、最新 2026 年收入，以及从公开 2023 和 2024 年锚点出发的桥接
        - 没有这些证据，当前倍数很难站住脚
        - 财务团队；董事会材料或可审计的月度报表。
      - - 毛利率和净留存率（NRR）
        - 按客户类型拆分的毛利率、队列留存，以及登录到收入的转化
        - 只有使用量能转化为经济复利，可复用身份逻辑才配得上溢价
        - 财务 + 收入运营；队列模型和续约材料包。
      - - 政府客户集中度
        - 按机构拆分的收入、头部客户集中度、续约日期和采购依赖
        - 公共部门验证是优势，直到它变成集中度风险
        - 收入运营 + 公共部门销售负责人。
      - - 债务与优先股堆叠
        - 信贷协议、契约、认股权证、清算优先权和董事会权利
        - 入场经济性可能与名义估值大幅偏离
        - CFO + 法律顾问；最新融资文件。
      - - 隐私与留存控制
        - 关于生物识别数据删除和按合作方拆分留存计划的独立审计证据
        - 政策耐久性直接影响采购和 IPO 准备度
        - 安全、隐私和法律审查。
      - - 治理与退出准备度
        - 董事会构成、审计流程、风险治理，以及任何 IPO 准备路线图
        - 如果公司想守住溢价退出，公开市场披露标准很重要
        - CEO、CFO 和董事会观察员尽调会议。
