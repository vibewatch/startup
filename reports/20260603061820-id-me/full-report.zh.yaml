      - number: '7.2'
        title: 运营可靠性、支持复杂度和安全负担是真实执行风险
        blocks:
          - type: paragraph
            body: >-
              ID.me
              的运营风险，关键不在于公司有没有控制措施，而在于这些控制在当前规模下能否继续跑得快、覆盖得广、也足够可靠。状态页已经证明，钱包故障会公开发生；商业模式又决定了故障不只是客服麻烦：只有验证和复用登录成功，公司才收得到钱。与此同时，ID.me
              自己的安全与合规页面也显示，公司确实搭了缓释栈——FedRAMP 托管、加密和多项标准合规。更难的问题在于，包容性需要昂贵路径支撑。NIST 明确推动同等保障选项和例外处理，ID.me
              也公开运营自助、短视频、延长视频和线下验证路径。这些路径是优势，因为它们降低排斥、帮助公共部门客户；但它们也带来人员、QA 和恢复复杂度。一旦欺诈压力或政策审查上升，成本可能正好被拉宽。
