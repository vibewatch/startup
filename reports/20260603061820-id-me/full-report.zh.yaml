            - label: 高
              tone: negative
              detail: IRS 或 CMS 变化会传导到收入、声誉和估值。
            - label: 中
              tone: warning
              detail: 钱包复用和广泛覆盖能缓冲集中度，但不能消除集中度。
            - label: 高
