    rows:
      - - 联邦机构和福利网站
        - 买方 / 付款方：联邦机构；用户：公民、受益人或纳税人
        - 高保证登录、身份核验和账户访问
        - CMS、IRS、SSA 和 VA 已被公开点名
        - 生产证据最深，合规护城河最强
        - 未公开续约或按机构拆分收入
      - - 州劳工和福利机构
        - 买方 / 付款方：州机构；用户：申领人或居民
        - 福利登录、失业救济申请和身份恢复
        - Pennsylvania DLI 和 VEC 有直接文档记录
        - 显示钱包复用不止一个联邦项目，也保留包容性兜底路径
        - 已点名州名单和逐州收入仍未公开
      - - 医疗患者和病历访问用户
        - 买方 / 付款方：医疗机构或合作应用；用户：患者
        - 安全患者登录、病历访问和经同意的数据共享
        - OtisHealth 和 CMS/Medicare 是被点名的医疗侧证据
        - 医疗把政府端安装基础延伸到持续患者访问
        - 70+ 家医疗机构没有被点名名单
      - - 医疗服务提供者和医护人员
        - 买方 / 付款方：医疗机构、药房工作流或零售合作方；用户：服务提供者或工作人员
        - EPCS 身份核验，加上基于雇佣或执照的状态验证
        - 医疗服务提供者、医疗状态和医院员工流程已公开
        - 显示医疗场景不只服务患者登录，也能服务另一侧
        - 服务提供者与患者用例之间的量和收入拆分未披露
      - - 雇主和劳动力筛查
        - 买方 / 付款方：雇主或筛查合作方；用户：求职者或员工
        - 入职前身份验证、面试欺诈防范和 I-9 相关工作流
        - Sterling 是最清晰的点名证据
        - ID.me 进入招聘和承包商访问场景，而不只做福利
        - 除 Sterling 外，被公开点名的企业客户很少
      - - 消费品牌和社群验证
        - 买方 / 付款方：零售商或品牌；用户：政府工作人员、医务专业人员、医院员工或公司员工
        - 折扣资格、社群验证和电商优惠
        - ID.me Shop，加上面向医疗人员和政府 / 医院员工的帮助流程
        - 数千个合作方优惠被展示，说明覆盖面很广
        - 多数证据来自结账或优惠流程，不是量化企业案例研究
    notes: 细分同时覆盖赞助客户和终端用户群，因为 ID.me 销售的是可复用凭证层，不同工作流里的经济买方会变化。点名证据在政府和受监管访问细分中最强； 私营部门证据更广，但通常量化较少。
