  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高的残余风险集中在监管信任、隐私治理和公共部门集中度，而不是纯粹的功能竞争。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: IRS 监督 / AI 治理
          values:
            - label: 高
              tone: negative
              detail: GAO 未结事项和单一供应商依赖让风险持续活跃。
            - label: 严重
              tone: negative
              detail: 可能影响采购、信任和公共运营面。
            - label: 中
              tone: warning
              detail: 隐私指令和公司控制已存在，但没有补上治理缺口。
            - label: 高
              tone: negative
              detail: 监管发现得到可验证关闭之前，残余风险仍高。
        - label: 生物识别隐私反弹
          values:
            - label: 中高
              tone: warning
              detail: 敏感数据收集和保留条款仍然可见，也可被审查。
            - label: 高
              tone: negative
              detail: 公平性或保留争议会冲击高风险政府用例。
            - label: 中
              tone: warning
              detail: 同意、钱包销毁和删除承诺重要，但不是完整保护。
            - label: 高
              tone: negative
              detail: 没有公开的公平性和删除验证证据，残余风险仍处于高位。
        - label: 可靠性 / 支持复杂度
          values:
            - label: 中
              tone: warning
              detail: 状态页显示了规模化事故和恢复义务。
            - label: 高
              tone: warning
              detail: 身份核验或恢复路径失败，会同时伤害信任和可变现复用。
            - label: 中高
              tone: warning
              detail: 安全与合规控制已公开，但 SLO 和合同补救条款未公开。
            - label: 中高
              tone: warning
              detail: 在拿到 SLA 和队列深度证据之前，剩余敞口仍然较大。
        - label: 公共部门集中度 / 替代方案
          values:
            - label: 中高
