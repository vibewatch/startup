      - CV041
      - CV046
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 关联度
      - 局限
    rows:
      - - Okta / Auth0
        - 客户身份基础设施 + 2026 年 6 月 P/S 快照
        - 8.13x P/S；上市公司
        - 可作为已披露身份软件公司的基准：它有客户身份野心，也有广泛开发者分发。
        - 劳动力身份和企业客户组合比 ID.me 更宽，披露质量也高得多。
      - - CLEAR Secure
        - 身份平台 + 2026 年 6 月 P/S 快照
        - 8.43x P/S；上市公司
        - 可参考其生物识别、消费者身份认知度以及当前 Medicare 重叠。
        - 消费者订阅和旅行场景起家，使其收入模型不同于 ID.me 偏政府的组合。
      - - Mitek Systems
        - 身份验证 + 2026 年 6 月 P/S 快照
        - 4.25x P/S；上市公司
        - 可作为上市文件可查的纯身份验证和反欺诈工具参考。
        - 规模更小、分散方式不同，IDV 之外还有支票和反欺诈产品。
      - - ID.me 隐含估值
        - 相对于公开 2023/2024 收入锚点的估值
        - 2024 年收入 >13x，或 2023 年收入 >15x；私营
        - 显示新投资者在 >$2B 估值上隐含买单的溢价。
        - 依赖第三方收入锚点，因为公司未披露经审计的当前收入。
    notes: 可比倍数只是 2026 年 6 月的粗略公开快照，用来约束估值纪律，不是完整标准化 EV/收入模型。
    enumerationScope:
