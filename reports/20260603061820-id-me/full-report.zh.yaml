      - number: '3.2'
        title: 能力、定价与分销对比
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，面向开发者采用的身份供应商，与面向高保证企业或政府部署的供应商之间分化明显。Persona、Socure 和 Auth0
              都公开了有意义的自助或入门定价，降低了测试、集成和从小账户扩张的摩擦。Socure 和 Persona 还宣传可配置套餐，并可上探到企业定制；Auth0
              则把免费和付费层级连接到企业支持。相比之下，Jumio、Trulioo、CLEAR1 和 ID.me 在公开界面上仍更偏演示或报价驱动。分销锚点同样不同。ID.me 的分销来自可复用钱包和公共部门足迹；Auth0
              的分销来自开发者心智和 Okta 规模；CLEAR1 来自既有消费者生物识别网络；Socure 来自欺诈工具宽度和 FedRAMP 授权公共部门打包；SheerID 来自已验证受众电商
              ROI。结果是，买家不只在选择能力，也在选择能多快试用产品、前期能拿到多少定价确定性，以及自己需要的是可复用凭证、可配置 API，还是已有用户触达的可信品牌。
