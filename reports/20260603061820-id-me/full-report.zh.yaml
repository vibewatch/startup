      - number: '5.4'
        title: 安全、隐私、可靠性与技术风险
        blocks:
          - type: paragraph
            body: >-
              公开信任材料足够详细，可以建立有意义的控制基线。ID.me 称其用 AES-256 和动态密钥轮换加密 PII，运行在 FedRAMP 授权的 AWS 隔离 VPC
              内，并在属性释放前执行基于角色的访问、职责分离、MFA、最小数据请求和用户同意。在受监管流程中，公司还宣传符合 NIST 800-63-3 IAL2/AAL2，并覆盖 TEFCA、DEA EPCS、CCPA 和
              KYC 等相邻合规界面。但风险面同样真实。IRS 专属公开材料称，自拍、视频和生物识别数据会自动删除，除非涉及可疑或欺诈活动；但 GAO 发现，IRS 仍缺少项目的可衡量目标、正式绩效评估和 AI
              治理文档。Biometric Update 补充说，部分删除控制已写入合同，但监督仍高度依赖供应商证明。运营上，公开状态页显示移动钱包会发生真实事件，包括 2026 年 5 月一次故障，在修复部署前用户看到
              “Couldn’t load your wallet” 错误。结论是，产品在控制和合规叙事上看起来安全成熟，但仍需要尽调 AI 治理、辅助核验运营、定价经济性和真实服务水平透明度。
