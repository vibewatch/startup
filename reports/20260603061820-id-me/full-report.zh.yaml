  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与相邻预算
        blocks:
          - type: paragraph
            body: >-
              ID.me
              并不争夺所有贴着数字身份标签的支出。最有防御力的市场边界，是面向受监管数字访问的可复用、高保证身份核验、认证和属性交换。纳入支出由核验、强认证、凭证复用和流程集成构成，让政府机构、医疗组织、雇主或商户可以信任此前已验证的用户。这比一次性
              KYC API 更宽，因为钱包复用和已验证属性会在多个依赖方之间产生后续价值；但它又小于整个数字身份服务栈。广义编排、通用 CIAM 和员工 IAM 预算属于相邻预算，因为它们也解决登录和访问问题，但通常不具备
              ID.me 差异化所依赖的高保证核验、可携带钱包或社区 /
              资格属性。商业边界还包括品牌和雇主的福利与社区验证流程，同时排除大多数物理访问订阅和低保证认证工具。实践中，这个品类更像跨垂直行业的信任基础设施：同一个钱包可以打开 IRS 服务、Social
              Security、VA 访问、Medicare.gov、雇主流程和已验证属性电商，但每个买家仍会按自己的预算、合规和集成视角评估支出。
