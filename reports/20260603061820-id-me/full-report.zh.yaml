      - number: '3.3'
        title: 政府替代品与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              公共部门赛道尤其重要，因为 ID.me 第一眼看上去最强，但仍面对可见替代品。Login.gov 不是商业身份市场，但对希望采用政府自有伙伴模式的机构来说，它是真实替代方案，并提供 MFA、SAML/OIDC
              集成和 FedRAMP Moderate 授权。SSA 和 VA 都明确同时支持 Login.gov 和 ID.me，这意味着机构和终端用户已经可以在多个登录系统之间多归属，而不是把 ID.me
              视为排他标准。CLEAR1 也重要，因为 Medicare.gov 也没有统一到单一身份供应商：CLEAR 称自己被 Medicare 选中，FedScoop 报道 CLEAR 负责账户创建和恢复，而 ID.me
              支持验证和登录。这种共存削弱了任何简单的赢家通吃叙事。现状替代方案也仍以机构专属恢复、采购和合规决策形式存在，因此高保证身份仍是凭证政策、减欺诈、互操作性和支持路径要求共同塑造的采购，而不是一套统一市场打法。
