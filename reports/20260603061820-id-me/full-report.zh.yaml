  - id: TV005
    title: 投资逻辑失效与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入桥接不及预期
        - 私下尽调仍显示经济性接近公开 $130M-$150M 锚点，而不是明显高于它们
        - 当前 >$2B 估值相对公开可比公司失去溢价支撑
        - 不要领投；按基准或悲观情景重新承销。
      - - 资本结构比预期更偏优先
        - 债务契约、清算优先权或认股权证明显压低普通股上行
        - 名义估值不再代表投资者入场经济性
        - 要求重新定价或更强下行保护。
      - - 生物识别留存义务扩大
        - 合作方或政府政策更接近长期留存规范
        - 监管和公开市场接受度下降，合规成本与诉讼风险上升
        - 下调目标持仓，或退出。
      - - 多机构复用停滞
        - 主要项目停止扩张，或大型机构选择不具备可比 ID.me 复用能力的替代方案
        - 可复用凭证护城河变弱，变现耐久性下降
        - 切换到更低倍数框架。
      - - 公开可比估值带压缩
        - 身份类公开可比公司估值下修，而 ID.me 仍寻求私募溢价
        - 即便执行稳定，入场价也可能没有安全边际
        - 等价格重置前暂停投资。
      - - 监督发现恶化
        - GAO、国会或机构客户披露超出现有记录缺口的新控制失效
        - 退出准备度和采购耐久性同时恶化
        - 立即切换至悲观情景。
    notes: 每个触发项都应能在尽调期间或入场后马上监测，而不是模糊的战略担忧。
    claimRefs:
