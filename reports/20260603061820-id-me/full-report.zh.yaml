  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前值 / 状态
      - 质量
      - 尽调要点
    rows:
      - - 联邦机构身份核验和登录
        - 机构合同覆盖初始核验和可复用凭证登录
