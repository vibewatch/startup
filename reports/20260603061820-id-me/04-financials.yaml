    {
      "id": "cost-structure",
      "title": "Cost structure and unit economics: inclusion and compliance raise delivery costs",
      "body": "Public evidence suggests ID.me’s gross-margin path depends on how often it can keep users in automated flows and how much volume still escalates into higher-cost human review. The service can require document upload, selfie or liveness checks, SSN validation, MFA, and reusable credential issuance. Official help content shows that video-call verification may require multiple documents plus live agent review, while the security pages emphasize supervised remote or in-person pathways so that users who fail automation are not excluded. That inclusion advantage is commercially valuable in government procurement, but it almost certainly adds labor cost that a pure API vendor would not bear. Fixed costs also look real. ID.me describes dedicated security personnel, FedRAMP-hosted infrastructure, encryption, annual audits, and multiple NIST/Kantara controls. GAO and Biometric Update indicate the IRS receives detailed pass-rate and drop-off dashboards from ID.me, which means the company is measuring unit economics operationally, even if it is not disclosing them publicly. Investors can see the shape of the cost stack, but not the actual gross margin or payback math.",
