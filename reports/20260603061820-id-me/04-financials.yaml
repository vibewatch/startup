    "number": 4,
    "title": "Financials",
    "summary": "ID.me's public financial evidence supports a growing transaction-and-reuse identity network with meaningful government contract traction and fresh 2025 financing, but it still does not disclose the realized pricing, margins, or liquidity data needed for clean underwriting. The chapter therefore leans positive on demand and near-term capital adequacy, while remaining cautious on revenue quality and valuation precision."
  },
  "sections": [
    {
      "id": "revenue-model",
      "title": "Revenue model: reusable identity outcomes across public and private sectors",
      "body": "ID.me’s revenue model is best understood as a transaction-and-reuse identity network rather than a seat-based SaaS vendor. Sacra says customers pay when identity verification succeeds and continue paying as verified credentials are reused for logins and attribute checks. Official company releases make that reuse loop tangible: ID.me said it added 20.4 million new wallets in 2024, powered 409 million successful logins, and reached 152 million to 157 million users by late 2025. The wallet, IRS, SSA, VA, and CMS surfaces all reinforce the same commercial logic: once a user has a verified credential, the next agency or enterprise can accept the credential without forcing a full restart. That is positive for revenue quality because the installed base can compound without the company reacquiring each user from scratch. The negative is that public evidence still does not disclose recognized revenue by vertical, realized pricing by customer type, or the split between first-time verification, recurring login, and attribute-verification revenue.",
