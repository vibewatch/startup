companyProfile:
  summary: ID.me is a McLean, Virginia-based reusable identity-wallet company that grew from military-community roots into a high-assurance digital identity platform used across U.S. government, healthcare, employer, and consumer-brand workflows. Public evidence shows meaningful scale, broad relying-party reach, and fresh capital support, but the core underwriting variables for a late-stage investor—current revenue quality, gross margin, concentration, and debt or preference terms—remain private. The result is a real strategic asset with a national footprint, but one whose premium valuation still rests on partially disclosed economics.
  foundedDate: '2010-02-02'
  founders:
    - name: Blake Hall
      role: Founder & CEO
      background: Founded the company from the TroopSwap/Troop ID lineage and remains the principal public face across financing, policy, and customer announcements.
      claimRefs: [CO001, CO015]
    - name: Matt Thompson
      role: Co-founder
      background: Early co-founder identified in user-provided task context; public founder detail in reviewed retained sources is thinner than for Blake Hall.
      claimRefs: []
  foundingLocation: McLean, Virginia, USA
  headquarters: McLean, Virginia, USA
  productSummary: Reusable digital identity wallet plus identity gateway, proofing, MFA, and attribute-sharing stack that lets users verify once and reuse credentials across government, healthcare, employer, and brand workflows.
  customerFocus: U.S. federal and state agencies, healthcare organizations, employers, and consumer brands that need high-assurance identity proofing, login security, or verified-attribute workflows.
  businessModel: Usage- and reuse-driven identity verification model in which customers pay for successful proofing outcomes and repeated credential use rather than classic seat licenses.
  stage: Late-stage private company with national public-sector penetration and a September 2025 financing at a valuation above $2 billion.
  fundingStatus: September 2025 financing package of $340 million at a valuation above $2 billion, with public reporting indicating a mix of Series E equity and a large credit facility.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO007, CO008, CO022, CO025, CE001, CI001, CI034]
summary:
  headline: ID.me is a real reusable-identity asset with national-scale reach, but the current >$2B private mark still runs ahead of the public evidence on revenue quality, margins, concentration, and policy durability.
