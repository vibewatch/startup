          - type: callout
            title: Government proof is deepest, but expansion beyond government is real
            body: >-
              CMS, IRS, SSA, VA, Pennsylvania, and VEC give ID.me a stronger named-proof set than many identity vendors
              have in regulated markets. The story does not stop there: OtisHealth shows a healthcare records-access
              wedge, Sterling shows a hiring and workforce wedge, and shop/help flows show that community verification
              also extends into commerce. The issue is not whether expansion exists; it is how much of it is large and
              durable versus surface-level brand breadth.
            calloutType: strength
