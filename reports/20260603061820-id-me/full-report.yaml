      - number: '4.2'
        title: 'GTM and contract economics: procurement-led distribution with mixed exclusivity'
        blocks:
          - type: paragraph
            body: >-
              Government procurement is the clearest GTM engine in the public record. Carahsoft expands access through
              reseller partners, GSA Schedule, and ITES-SW2, while VA and VEC case studies show that compliance
              credibility and measurable service outcomes can turn implementation wins into renewal stories. The
              contract evidence also shows why investors should separate pipeline from booked revenue. GovConWire
              reported an IRS blanket purchase agreement worth up to $1 billion through 2030, while FedScoop described
              the CMS Medicare.gov expansion as part of an HHS contract worth roughly $5 million. Those are both
              economically meaningful, but they represent very different stages of monetization. Ceiling vehicles signal
              budget access and strategic importance; they do not guarantee recognition. Competition further tempers
              pricing power. SSA explicitly allows either Login.gov or ID.me, and FedScoop reported CLEAR will also
              support Medicare.gov identity workflows. That coexistence suggests ID.me’s GTM strength comes from trust,
              compliance, and reuse rather than monopolistic federal exclusivity.
