  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - >-
          Current revenue is already above roughly $200M, reuse-led growth stays strong, Medicare and adjacent agency
          expansion deepen, and privacy scrutiny remains contained.
        - >-
          Supports roughly $2.2B-$2.8B and only modest upside from today unless revenue is much stronger than public
          anchors.
        - Requires investors to trust that economics look more software-like than the public record shows.
        - Low until audited or board-level 2025/26 metrics are shared.
      - - Base
        - >-
          Public 2023 and 2024 revenue anchors are directionally right, growth continues but without fully de-risking
          margins or concentration, and investors apply a comp-adjusted premium rather than a scarcity premium.
        - Supports roughly $1.4B-$1.8B, implying the current mark is ahead of public proof.
        - Could still prove too generous if debt or preferences are aggressive.
        - Most consistent with the current evidence set.
      - - Bear
        - >-
          Procurement momentum slows, retention or privacy scrutiny worsens, or hidden financing terms absorb more value
          than expected.
        - Supports roughly $0.8B-$1.2B and points to down-round or severe multiple-compression risk.
        - Downside accelerates if the company cannot show that government scale also means durable economics.
        - Rises materially if new diligence fails to close the financial and policy gaps.
    notes: >-
      Ranges are broad judgment bands in USD billions derived from public comp discipline and third-party revenue
      anchors, not management forecasts.
