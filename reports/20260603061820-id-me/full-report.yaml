  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation stays research-more because the current mark already prices a lot of good news
        blocks:
          - type: paragraph
            body: >-
              At the current public price anchor, the right call is research-more, not buy. ID.me has real late-stage
              signals: the company and Sacra line up on a $340 million 2025 financing package at a valuation above $2
              billion, and the disclosed syndicate includes serious capital providers such as Ribbit and Ares. The
              problem is not that ID.me looks weak. The problem is that the price already asks investors to underwrite
              financial outcomes the public record still does not show. Third-party revenue anchors sit at roughly $130
              million for 2023 and $150 million for 2024, which implies a trailing valuation multiple above roughly 13x
              to 15x before investors know 2025 revenue, gross margin, NRR, or debt covenants. That is not impossible
              for an identity platform with network effects, but it is hard to call attractive when the same record
              still lacks audited financials, cap-table preferences, and downside-protection detail. Entry discipline
              therefore matters more than admiration: the mark only becomes compelling if diligence proves materially
              stronger current economics or if price falls toward a public-evidence band that actually compensates
              investors for the disclosure gap.
            claimRefs:
              - CV001
              - CV002
              - CV003
