  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, adjacent suites, and likely substitutes
        blocks:
          - type: paragraph
            body: >-
              ID.me's competitive field is wider than a simple identity-verification vendor list because buyers can
              solve the same job in several ways. The closest direct peers are API-first identity and fraud platforms
              such as Persona, Socure, Jumio, and Trulioo, which all emphasize configurable onboarding, KYC/KYB,
              document or biometric checks, and programmable workflows. Those vendors overlap with ID.me whenever a
              buyer treats identity as a transactional verification layer rather than as a portable wallet or reusable
              credential. Auth0 competes from a different direction: it sells CIAM and login infrastructure at scale,
              with strong developer tooling, public pricing, and broad installed-base credibility, but it does not
              present a consumer wallet or government-grade reusable identity network. CLEAR1 and Login.gov matter
              because they are visible public-sector substitutes. SheerID is narrower, but it is still relevant in
              verified-attribute commerce because it solves offer and eligibility verification without requiring the
              buyer to adopt ID.me's broader wallet model.
