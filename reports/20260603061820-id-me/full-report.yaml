chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, stage, and operating model
        blocks:
          - type: paragraph
            body: >-
              ID.me is a McLean, Virginia-based digital identity company founded by Blake Hall in 2010 and rebranded
              from TroopSwap/Troop ID into the broader ID.me wallet platform in 2013. The company now describes itself
              as a reusable digital identity wallet: a user verifies once, stores verified identity or community
              “cards,” and can then reuse those credentials across government, healthcare, and commercial sites without
              restarting the proofing process each time. Official materials emphasize user control over what data gets
              shared, while product pages position the offer as more than a single login widget: the stack spans
              identity verification, MFA, access management, credential validation, and wallet services.


              The clearest public business-model description comes from Sacra and aligns with ID.me’s own product
              surfaces. The company operates a B2B2C model in which agencies, healthcare organizations, and brands pay
              for successful verifications and ongoing credential reuse, rather than end users paying directly. That
              model is strongest where the same high-assurance credential can be reused across multiple relying parties,
              especially in public-sector workflows. Public materials and case studies show the same identity layer
              being applied to federal benefits access, state unemployment workflows, healthcare identity proofing, and
              commercial community verification.


              As of the run date, the combination of a valuation above $2 billion, a 2025 Series E plus credit package,
              and expanding federal contract footprint supports a late-stage private-company classification. What
              remains less clear is classic cover-metric depth: public sources are much stronger on users, agencies, and
              financing headlines than on audited revenue, headcount, facility count, or board transparency.
