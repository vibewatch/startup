      - number: '3.3'
        title: Government substitutes and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              The public-sector lane is especially important because it is where ID.me looks strongest at first glance
              yet still faces visible substitutes. Login.gov is not a commercial identity marketplace, but it is a real
              alternative for agencies that want a government-owned partner model with MFA, SAML/OIDC integration, and
              FedRAMP Moderate authorization. SSA and VA both explicitly support both Login.gov and ID.me, which means
              agencies and end users can already multi-home across sign-in systems instead of treating ID.me as an
              exclusive standard. CLEAR1 matters because Medicare.gov is not standardizing on one identity vendor
              either: CLEAR says it was selected for Medicare, and FedScoop reports CLEAR is handling account creation
              and recovery while ID.me supports verification and sign-in. That coexistence reduces any simple
              winner-take-all narrative. The status quo also persists in the form of agency-specific recovery,
              procurement, and compliance decisions, so high-assurance identity is still bought through a mix of
              credential policy, fraud reduction, interoperability, and support-path requirements rather than through
              one universal market motion.
