      - number: '1.4'
        title: Milestones, government scale, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              ID.me’s milestone pattern shows a company that scaled first through trust-sensitive government and
              benefits workflows, then broadened into healthcare and commercial identity use cases. The early chronology
              runs from 2010 founding to the 2013 rebrand and NIST grant, then to VA.gov in 2016 and government-security
              milestones in 2017-2018. The pandemic period appears to have been the inflection point: the company says
              seven states credited it with preventing more than $270 billion of unemployment fraud, and the Virginia
              Employment Commission case study claims material improvements in digital adoption, call-center load, and
              staff efficiency after a 2024 rollout.


              Recent momentum is concentrated in government programs. Official and independent sources show CMS
              expansion for Medicare.gov, Social Security’s 2025 move to ID.me-or-Login.gov-only online sign-in, and a
              reported IRS BPA worth up to $1 billion through 2030. Public scale metrics also climbed across 2025,
              moving from 139 million users in the anniversary article to 152 million in the September financing release
              and 157 million in the December CMS announcement. Those figures are directionally strong even though they
              are not perfectly synchronized across sources.


              The downside case sits in oversight and operating reliability rather than obvious commercial collapse. GAO
              and Biometric Update document serious oversight gaps in the IRS program, including missing performance
              goals and missing AI inventory controls, while FedScoop records continuing facial-recognition controversy.
              Separately, the status page logged a mobile-wallet incident in late May 2026. None of those facts
              disproves the scale story, but they do show that ID.me’s trust moat depends on maintaining regulatory
              confidence and uptime discipline at the same time.
