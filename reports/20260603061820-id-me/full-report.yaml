  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product delivered and user workflow
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, ID.me sells a reusable digital identity wallet that lets an individual create
              an account once, secure it with MFA, complete a high-assurance proofing step, and then consent to share
              verified data back to a government agency, healthcare property, employer, or consumer brand. The company
              does not present the wallet as only a login container: the same surface is used for government access,
              community-status cards, and attribute sharing. The strongest workflow evidence is in government use cases,
              where the user journey is explicit. A relying party sends the user to ID.me, the user creates or reuses a
              wallet, completes MFA, uploads document and SSN evidence, and either finishes self-service or escalates to
              short video, extended video, or in-person proofing before returning to the partner site to consent to data
              release. That workflow is specific enough to underwrite the product as an identity-and-attribute broker,
              not just a credential vault, but public materials still stop short of exposing conversion by pathway,
              abandonment by step, or staffing service levels for assisted verification.
