      - number: '8.3'
        title: Public comparables and scenario ranges argue for discipline rather than momentum chasing
        blocks:
          - type: paragraph
            body: >-
              Public comps impose discipline on the private story. On June 2026 snapshots, CompaniesMarketCap shows Okta
              near 8.1x sales, CLEAR near 8.4x, and Mitek near 4.25x. Those companies are not perfect comparables, but
              they are relevant enough to frame what investors are usually willing to pay for disclosed identity or
              identity-adjacent businesses. Against that backdrop, ID.me’s implied trailing multiple on public revenue
              anchors still sits materially above the band. That does not prove the private mark is wrong; it does mean
              the burden of proof shifts to management. The bull case needs current revenue well above the public
              anchors plus evidence that reuse, healthcare expansion, and fraud-defense positioning are translating into
              software-like economics. The base case says today’s mark is somewhat ahead of public proof and belongs
              closer to a comp-adjusted band. The bear case says privacy scrutiny, procurement slowdown, or hidden
              financing structure can pull the company down toward a much harsher public-market lens. In other words,
              the scenario spread is wide because the evidence gap is wide.
            claimRefs:
