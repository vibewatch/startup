      - number: '3.4'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              ID.me's moat is most credible where buyers need high-assurance proofing, credential reuse, and inclusive
              fallback pathways such as multilingual assistance or recovery across multiple programs. Those features
              create real switching costs because the buyer is not only replacing a document check; it is replacing a
              credential network, support process, and compliance workflow that may already sit across several relying
              parties. But the same evidence also shows why the moat is not absolute. API-first identity vendors are
              pushing the category toward orchestration and recurring SaaS economics, which makes identity easier to
              compare on workflow flexibility and developer speed. Platform-native and suite vendors threaten to absorb
              more of the login and trust budget into broader contracts. Meanwhile, public-sector customers can
              multi-home across ID.me, Login.gov, and CLEAR for different journeys. The safest conclusion is moderate
              moat durability: ID.me has real defensibility in reusable, high-assurance identity, but commoditization
              risk rises when the buyer values speed, configurability, or bundle leverage more than wallet reuse and
              inclusion.
