      - number: '7.4'
        title: Financial and model risk is manageable only with explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              The public financial story is strong enough to show momentum but not strong enough to underwrite downside
              with confidence. ID.me has disclosed a financing package that values the company above $2 billion and
              shows rapid wallet and login growth, while Sacra describes a usage-based model in which successful
              identity outcomes and subsequent reuse drive revenue. That is an attractive model if conversion stays high
              and agencies keep renewing. It is a riskier model if regulatory trust slips, if outages slow recovery
              flows, or if federal buyers rebalance toward alternatives, because those changes would affect both initial
              verification revenue and later credential reuse. The bigger issue is disclosure depth. Public sources
              still do not show current annual revenue, federal revenue share, major-contract margin structure, or the
              SLA and indemnity terms that would determine downside severity in a failure scenario. The right investment
              stance is therefore conditional: demand concentration schedules, contract packs, and fairness evidence
              before assuming that scale automatically means resilience.
