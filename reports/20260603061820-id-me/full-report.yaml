          - type: callout
            title: Concentration and procurement resilience remain the key open customer questions
            body: >-
              Public materials show broad counts but not the revenue mix underneath them. That matters because the most
              visible customers are still government and regulated-access programs, exactly where procurement, privacy,
              and oversight debates can alter growth or renewal timing. GAO's IRS review makes this concrete: very large
              production use did not prevent oversight gaps from becoming a public issue, and investors still cannot see
              top-account concentration, segment ARR, or renewal quality.
