  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      The highest residual risks cluster around regulatory trust, privacy governance, and public-sector concentration
      rather than pure feature competition.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: IRS oversight / AI governance
          values:
            - label: high
              tone: negative
              detail: Open GAO items and single-provider dependence keep this active.
            - label: critical
              tone: negative
              detail: Could affect procurement, trust, and the public operating surface.
            - label: medium
              tone: warning
              detail: Privacy directives and company controls exist but do not close the governance gap.
            - label: high
              tone: negative
              detail: Residual risk stays high until oversight findings are demonstrably closed.
        - label: Biometric privacy backlash
          values:
            - label: medium-high
              tone: warning
              detail: Sensitive data collection and retention terms remain visible and reviewable.
            - label: high
              tone: negative
              detail: A fairness or retention controversy would hit high-stakes government use cases.
            - label: medium
              tone: warning
              detail: Consent, wallet destruction, and deletion commitments matter but are not full protection.
            - label: high
              tone: negative
              detail: Residual risk stays elevated without public fairness and deletion-verification evidence.
        - label: Reliability / support complexity
          values:
            - label: medium
              tone: warning
              detail: The status page shows incidents and recovery obligations at scale.
            - label: high
              tone: warning
              detail: A failed proofing or recovery path harms both trust and monetized reuse.
            - label: medium-high
              tone: warning
              detail: Security and compliance controls are public, but SLOs and contract remedies are not.
            - label: medium-high
              tone: warning
              detail: Residual exposure stays material until SLA and queue-depth evidence is available.
        - label: Public-sector concentration / alternatives
          values:
            - label: medium-high
              tone: warning
              detail: Portability exists, but agency buyers visibly retain alternatives.
            - label: high
              tone: negative
              detail: IRS or CMS changes would transmit into revenue, reputation, and valuation.
            - label: medium
              tone: warning
              detail: Wallet reuse and broad footprint soften but do not remove concentration.
            - label: high
              tone: negative
              detail: Residual risk remains high without customer-mix disclosure and contract detail.
    claimRefs:
      - CR057
      - CR058
      - CR059
      - CR061
  - id: FR002
    title: Risk transmission map
    type: dag
    summary: >-
      Regulatory and operational shocks propagate through procurement, conversion, and reuse before they show up in
      valuation.
    data:
      nodes:
        - id: regulatory
          label: Regulatory trust
          detail: GAO, privacy, and fairness scrutiny
        - id: outage
          label: Service reliability
          detail: Wallet and proofing interruptions
        - id: procurement
          label: Agency procurement
          detail: Renewals, scope, and channel economics
        - id: conversion
          label: New verification conversion
          detail: Pass rates and support-assisted completion
        - id: reuse
          label: Credential reuse
          detail: Repeat logins and downstream monetization
        - id: revenue
          label: Revenue
          detail: Usage-based verification economics
        - id: margin
          label: Margin
          detail: Support, fraud, and compliance cost
        - id: valuation
          label: Valuation
          detail: What investors can justify paying
      edges:
        - from: regulatory
          to: procurement
          label: tightens
        - from: regulatory
          to: margin
          label: raises cost
        - from: outage
          to: conversion
          label: reduces
        - from: outage
          to: margin
          label: raises support cost
        - from: procurement
          to: revenue
          label: scales
        - from: conversion
          to: revenue
          label: feeds
        - from: reuse
          to: revenue
          label: compounds
        - from: revenue
          to: valuation
          label: anchors
        - from: margin
          to: valuation
          label: compresses
        - from: conversion
          to: reuse
          label: enables
    claimRefs:
      - CR046
      - CR047
      - CR048
      - CR049
      - CR058
      - CR061
      - CR062
