            title: Wallet reuse is the core customer-retention signal
            body: >-
              The strongest public evidence that ID.me retains value after first deployment is not a published NRR
              figure; it is the repeated verify-once language across IRS, SSA, VA, Pennsylvania, VEC, and CMS. The
              product is explicitly designed to turn one proofing event into later logins and adjacent-service
              activation, and disclosed 2024 login volume shows that this reuse loop matters in practice.
            calloutType: strength
