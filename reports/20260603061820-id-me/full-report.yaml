      - number: '8.2'
        title: >-
          The thesis is reusable identity with real customer proof; the anti-thesis is scrutiny, concentration, and
          competition
        blocks:
          - type: paragraph
            body: >-
              The bullish side of ID.me is straightforward. Multiple market reports show that digital identity and
              verification are large and still growing categories, and the company has actual public proof that its
              product is more than a one-time document check. CMS, Pennsylvania, VA, SSA, and IRS workflow pages all
              point to a reusable credential with fallback support across different government contexts, which is more
              moat-like than pure transactional KYC. That same model also produces the sharpest anti-thesis. GAO says
              IRS still lacks measurable program goals and proper AI inventory discipline, Biometric Update highlights
              reliance on vendor attestation for deletion controls, Politico describes pressure toward longer biometric
              retention, and ID.me’s own privacy policy keeps meaningful retention latitude. Competition is also real
              rather than hypothetical. CLEAR is already part of the Medicare rollout, while Jumio, Mitek, and
              Okta/Auth0 all market adjacent identity, risk, or customer-authentication stacks. So the chapter thesis is
              not “great company, buy anyway”; it is “real reusable-identity asset, but one whose premium can compress
              quickly if policy durability, exclusivity, or economics disappoint.”
            claimRefs:
