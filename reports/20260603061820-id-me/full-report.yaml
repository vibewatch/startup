  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Government identity proofing and sign-in
        - High-assurance citizen proofing, MFA, reusable login, and identity recovery for federal/state portals
        - Generic website SSO, low-assurance account creation, unrelated agency software
        - Agency buys and pays; citizen uses
        - Core current market where ID.me already has scaled adoption
      - - Healthcare patient and beneficiary access
        - >-
          Identity verification and reusable credentials for Medicare, patient portals, record access, and
          interoperability workflows
        - Clinical systems spend unrelated to identity, general EHR licensing
        - Agency, payer, provider, or health platform pays; patient uses
        - Concrete adjacency now validated by CMS and broader healthcare footprint
      - - Employer and workforce / benefits identity
        - Workforce or eligibility proofing, strong login, community or employment-status validation
        - General HRIS, payroll, or collaboration software not tied to proofing
        - Employer pays; employee or applicant uses
        - Useful adjacency where verified identity can lower fraud and helpdesk friction
      - - Brand, merchant, and community verification
        - Verified-attribute and community checks for discounts, gated access, and trust programs
        - Broad marketing-tech spend or generic loyalty software
        - Brand pays; consumer uses
        - Material commercial wedge, but not the whole consumer-internet auth market
      - - Reusable wallet and attribute exchange
        - Wallet cards, portable credential reuse, consented attribute sharing, and relying-party integration
        - One-time document checks with no reuse layer
        - Relying party pays; user carries credential
        - This is the differentiator that can expand value beyond a one-off verification
      - - Broader digital identity / CIAM adjacency
        - API identity workflows, orchestration, cloud identity services, and identity infrastructure
        - Generic IAM or CIAM contracts that do not require high-assurance proofing or reusable attributes
        - Mixed enterprise buyers across security, IT, product, and compliance
        - Important adjacency for budget context, but too broad to call ID.me’s direct SAM
    notes: >-
