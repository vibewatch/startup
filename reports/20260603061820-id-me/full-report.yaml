      - number: '5.4'
        title: Security, privacy, reliability, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Public trust materials are detailed enough to establish a meaningful control baseline. ID.me says it
              encrypts PII with AES-256 and dynamic key rotation, runs inside a FedRAMP-authorized AWS isolated VPC, and
              enforces role-based access, separation of duties, MFA, minimum-data requests, and user consent before
              attribute release. In regulated workflows it also markets NIST 800-63-3 IAL2/AAL2 alignment and adjacent
              compliance surfaces such as TEFCA, DEA EPCS, CCPA, and KYC. But the risk surface is equally real.
              IRS-specific public materials say selfie, video, and biometric data are deleted automatically except for
              suspicious or fraudulent activity, yet GAO found that IRS still lacked measurable goals, formal
              performance evaluation, and AI-governance documentation for the program. Biometric Update adds that some
              deletion controls were contractually specified while oversight still relied heavily on vendor attestation.
              Operationally, the public status page shows the mobile wallet can experience real incidents, including a
              May 2026 outage that produced a “Couldn’t load your wallet” error before a fix was deployed. The result is
              a product that looks security-mature in controls and compliance framing, but still needs diligence on AI
              governance, assisted-proofing operations, pricing economics, and true service-level transparency.
