        - Without it, the current multiple cannot be defended with confidence
        - Finance team; board package or audit-ready monthlys.
      - - Gross margin and NRR
        - Gross margin, cohort retention, and logins-to-revenue conversion by customer type
        - The reusable-identity thesis deserves a premium only if usage compounds economically
        - Finance + revops; cohort model and renewal pack.
      - - Government concentration
        - Revenue by agency, top-customer concentration, renewal dates, and procurement dependency
        - Public-sector proof is a strength until it becomes concentration risk
        - Revenue operations + public-sector sales leadership.
      - - Debt and preference stack
        - Credit agreement, covenants, warrants, liquidation preferences, and board rights
        - Entry economics can diverge sharply from the headline valuation
        - CFO + counsel; latest financing documents.
      - - Privacy and retention controls
        - Independent audit evidence on biometric deletion and partner-specific retention schedules
        - Policy durability directly affects procurement and IPO readiness
        - Security, privacy, and legal review.
      - - Governance and exit readiness
        - Board composition, audit process, risk governance, and any IPO-readiness roadmap
        - Public-market disclosure standards matter if the company wants to defend a premium exit
