      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              ID.me’s market segments are best understood by who owns the workflow and budget, not by a single end
              industry. In federal and state programs, the buyer and payer are agencies trying to secure benefits, tax,
              or citizen-service access, while the user is a resident, taxpayer, or claimant who increasingly expects to
              reuse an existing credential. In healthcare, the buyer can be a payer, public agency, health system, or
              digital-health platform that needs patient or beneficiary access with stronger proofing and
              interoperability. In employer and commercial-brand use cases, the organization pays so that users can
              prove eligibility, workforce identity, or community status without repeated manual checks. The reusable
              wallet matters because it shortens onboarding for later relying parties: IRS, SSA, VA, and now CMS all
              tell users an existing ID.me credential can carry over. That reuse creates real network effects, but each
              segment still evaluates ID.me differently. Public agencies care about fraud reduction, accessibility, and
              procurement pathways; healthcare buyers care about compliance, patient experience, and data-sharing trust;
              brands and employers care about conversion, fraud, and verified-attribute utility. The same platform
              therefore crosses multiple buyer categories, but with different adoption triggers, budget owners, and
              competitive alternatives in each lane.
