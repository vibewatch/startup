            body: >-
              The main customer risk is not whether ID.me has adoption; it is how durable and diversified that adoption
              is by revenue. Public named proof is concentrated in government and regulated access, which makes sense
              given the company's compliance strengths, but the mix also implies meaningful exposure to public
              procurement cycles, oversight, and single-vendor debates. Carahsoft broadens the acquisition channel
              through resellers and contract vehicles, yet that does not remove the need to win inclusion, cost, and
              oversight arguments inside agencies. GAO's IRS review is the clearest public warning signal: the program
              is large, but the agency had not set clear performance goals or fully documented oversight of the
              ID.me-enabled system, and watchdog coverage continues to frame privacy, fairness, and single-provider
              dependence as live issues. Private-sector breadth is real, especially in brands, medical discounts, and
              workforce verification, but public disclosures still do not reveal top-account concentration, renewal
              behavior, or segment-level ARR. Investors can therefore underwrite genuine customer proof and wallet
              reuse, but they still need diligence on who pays most of the bill, which segments renew, and whether
              public-sector expansion can continue without heavier procurement friction.
