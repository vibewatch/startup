            body: >-
              Capital availability looks adequate in the near term, but not fully diligenced. ID.me announced $340
              million of 2025 financing at a valuation exceeding $2 billion, and Sacra says that total consisted of $65
              million of equity plus a $275 million credit facility. That is enough to conclude the company still has
              investor and lender support, especially alongside continued contract momentum at IRS and CMS. Revenue
              estimates are directionally constructive too: Sacra puts 2023 revenue at $130 million, while MicroVentures
              reported $150 million for 2024 and echoed management’s claim of more than 450% growth through 2024. But
              none of those figures are audited or segmented, and no retained public source disclosed cash on hand,
              monthly burn, runway, debt covenants, or customer concentration. Market reports and public
              identity-software comps support secular demand and the appeal of API-first recurring models, yet ID.me’s
              own evidence base still looks more contract-led and service-heavy than pure software. The underwriting
              verdict is therefore positive on demand, distribution, and fresh financing, but cautious on valuation
