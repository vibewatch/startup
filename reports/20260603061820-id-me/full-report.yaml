            body: >-
              ID.me's customer map is unusual because buyer, payer, and end user differ sharply by segment. In federal
              and state benefits, agencies such as CMS, IRS, SSA, VA, Pennsylvania DLI, and VEC act as sponsoring
              customers while citizens are the end users. In healthcare, the surface expands from patients seeking
              records access to medical providers proving identity for EPCS and healthcare workers verifying status for
              partner offers. In employer and workforce flows, Sterling positions ID.me as an identity-first screening
              layer for hiring, while the commerce and community segment spans government-employee, medical, hospital,
              and company-worker discounts across thousands of partner brands. The common thread is wallet reuse.
              Official IRS, SSA, VA, Pennsylvania, VEC, and CMS materials all describe verify-once behavior that lets an
              already-proved user return or move across services without repeating the full proofing step, which is the
