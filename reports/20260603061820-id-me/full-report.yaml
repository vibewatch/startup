      - number: '5.2'
        title: Integration surface and operating architecture
        blocks:
          - type: paragraph
            body: >-
              ID.me's public technical surface is broader than a consumer wallet landing page suggests. The developer
              documentation enumerates OIDC, SAML, OAuth 2.0, PKCE, Shared Signals Framework, Applications API, Document
              Passback API, Events API, Services API, Identity Gateway, Digital Wallet, Work Authentication, Attributes
              Exchange, and Attribute Matching, which implies a federation layer meant to sit between relying parties
              and the wallet rather than a single fixed sign-in flow. The most concrete code-level disclosure is the
              Android SDK. Its public repo and README show Chrome Custom Tab-based auth, OAuth PKCE and OIDC modes,
              token storage and refresh, encrypted credentials, JWT validation, production versus sandbox environments,
              and grouped policy support. The same repo also exposes internal module boundaries for auth, token, JWT,
              storage, networking, and demo code, giving a better external view into integration mechanics than the
              high-level docs do. The trade-off is that the backend architecture remains selectively opaque: public
              materials identify protocol surfaces and SDK modules clearly, but they do not disclose internal service
              topology, tenant-isolation design, rate limits, or failure-domain boundaries across proofing, wallet, and
