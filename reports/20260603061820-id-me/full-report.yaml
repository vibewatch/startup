    rows:
      - - Persona
        - API-first direct peer
        - Private vendor with public pricing starting at USD 250 per month
        - Fintech, marketplaces, digital health, government, regulated onboarding teams
        - Modular KYC/KYB, age assurance, workforce IDV, fraud orchestration
        - Expand from templated self-serve to configurable and enterprise identity programs
        - No public evidence of a reusable cross-agency wallet or broad public-sector credential network
      - - Socure
        - API-first direct peer
        - Self-serve Launch pricing plus enterprise motion and FedRAMP-authorized public-sector surface
        - Fintechs, banks, sponsor banks, governments, higher education
        - Identity verification, fraud, eCBSV, biometrics, graph intelligence, sanctions, orchestration
        - Pair AI-driven risk and fraud capture with both self-serve and enterprise deployments
        - Public positioning is strongest on fraud decisioning, not on consumer-held reusable identity
      - - Jumio
        - Global identity verification peer
        - Billions of transactions, tens of millions of known identities, 5K plus ID types claimed
        - Global onboarding teams in regulated industries
        - Verification, AML, risk scoring, orchestration, analytics, APIs and SDKs
        - Sell configurable global identity intelligence and expand into limited reusable identity
        - Demo-led surface and weaker visible public-sector credential narrative than ID.me
      - - Auth0 / Okta
        - Incumbent IAM / CIAM alternative
        - 10B plus authentications per month and public self-serve pricing
        - Consumer apps, connected devices, enterprise development teams
        - Login, SSO, MFA, passwordless, bot detection, integrations, extensibility
        - Bundle customer identity into broader developer and enterprise identity workflows
        - Optimized for CIAM and account orchestration rather than reusable proofing across agencies and brands
      - - Trulioo
        - Global onboarding and KYC peer
        - Private global identity platform with demo-led sales
        - Cross-border onboarding, payments, trading, marketplaces, regulated services
        - Person verification, KYC data and docs, electronic ID, business verification, fraud intelligence
        - Win where worldwide coverage and workflow flexibility matter most
        - Public surface does not show a consumer wallet or transparent entry pricing
      - - CLEAR1
        - Public-sector and healthcare substitute
        - 41mm plus existing users and Medicare selection on official surface
        - Healthcare, workforce, customer onboarding, account recovery buyers
        - Multi-signal identity verification, workforce and patient workflows
        - Extend a trusted biometric brand into enterprise identity and Medicare-adjacent workflows
        - Less evidence of broad cross-agency reuse than ID.me and still quote-led on enterprise sales
      - - Login.gov
        - Government substitute
        - FedRAMP Moderate ATO and official agency partner model
        - Federal, state, local, and territory agencies
        - MFA, authentication, identity verification, SAML and OIDC integration
        - Serve as government-owned sign-in infrastructure for agency programs
        - Not available as a commercial commerce or healthcare wallet outside government partnerships
      - - SheerID
        - Adjacent verified-attribute substitute
        - Hundreds of brands and 200K plus authoritative data sources claimed
        - Retail, media, travel, telecom, consumer apps, loyalty and offer teams
        - Audience eligibility verification, offer protection, verified-customer data capture
        - Turn verified identities into marketing, loyalty, and offer-protection workflows
        - Narrower than ID.me on high-assurance identity, cross-agency sign-in, and public-sector credentials
