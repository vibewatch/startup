      - number: '1.3'
        title: Funding history, investor map, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The headline financing fact is clear: ID.me announced a $340 million package in September 2025 at a
              valuation above $2 billion. The company identified Ribbit Capital as lead investor, alongside Ares Credit
              funds, Moonshots Capital, and Positive Sum, while Sacra reported that the package consisted of roughly $65
              million of new equity plus a $275 million Ares credit facility. Sacra also points to earlier disclosed
              rounds of $100 million in 2021 and $132 million in 2023, plus a 2021 valuation of $1.5 billion. Those
              disclosures support at least $572 million of capital since 2021, but they do not fully close the
              lifetime-capital question because early rounds, secondaries, and the precise scope of the debt facility
              remain only partially public.


              The investor mix is notable for what it implies. Ribbit’s lead role points to fintech-grade conviction in
              identity infrastructure; Ares introduces creditor influence as well as capital; and Sacra’s list of
              earlier backers includes CapitalG, Morgan Stanley Counterpoint, FTV Capital, PSP Growth, and Viking
              Global, indicating long-duration growth capital rather than only small-VC sponsorship. That said, investor
              visibility remains stronger than cap-table precision. There is no public view here into ownership
              percentages, liquidation preferences, secondaries, or covenant detail.


              For an investment reader, the right takeaway is not that the capital base is weak; it is that the company
              is financially credible at a late stage while still leaving core financing mechanics private. That
              combination is common for high-profile private companies, but it means downside and control analysis
              cannot be completed from public materials alone.
