      - number: '2.2'
        title: Evidence-Constrained TAM, SAM, and Public Market Lenses
        blocks:
          - type: paragraph
            body: >-
              Public market data is directionally useful but numerically inconsistent. MarketsandMarkets projects the
              global identity verification market at USD 14.34 billion in 2025 and USD 29.32 billion in 2030, while
              Grand View Research frames a somewhat smaller historical base but still projects USD 33.93 billion by
              2030. Future Market Insights uses a broader digital identity services lens worth USD 28.5 billion in 2025
              because it includes orchestration, credential issuance, wallets, and other service layers beyond pure
              verification. The right conclusion is not that one estimate is “correct,” but that these lenses describe
              different boundaries. A narrower geographic proxy is the U.S. identity verification market at USD 4.34
              billion in 2025, which fits ID.me’s overwhelmingly domestic footprint better than a global digital
              identity headline. Buyer-specific public budget signals are narrower again: GovConWire reported a federal
              IRS blanket purchase agreement worth up to USD 1 billion through 2030, and FedScoop tied the CMS/Medicare
              expansion to a contract context of roughly USD 5 million. Those lenses bracket opportunity better than a
              model-generated SOM. ID.me’s disclosed footprint of 152 million to 157 million users and 76 million to 80
              million IAL2-verified identities proves substantial adoption, but public data still does not reveal
              contract pricing, vertical mix, renewal, or attach rate strongly enough to support a precise
              obtainable-share model.
