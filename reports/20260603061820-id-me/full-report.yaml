    data:
      items:
        - label: Bear
          low: 0.8
          mid: 1
          high: 1.2
          unit: USD B
          detail: Procurement slows or privacy scrutiny worsens.
        - label: Base
          low: 1.4
          mid: 1.6
          high: 1.8
          unit: USD B
          detail: Comp-adjusted premium without audited upside proof.
        - label: Bull
          low: 2.2
          mid: 2.5
          high: 2.8
          unit: USD B
          detail: Revenue and reuse proof materially exceed public anchors.
    approximationNotes: >-
