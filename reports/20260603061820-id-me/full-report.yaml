            title: The broadest market headline is not the most useful valuation lens
            body: >-
              The USD 28.5 billion digital identity services figure is real as a category map, but it overstates ID.me’s
              direct opportunity because it includes adjacent orchestration and wallet services that many buyers can
              purchase without choosing a high-assurance, reusable proofing provider.
