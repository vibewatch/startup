  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Detailed debt agreement, cap table, liquidation preferences, warrant coverage, and board-rights package from the latest financing.
    whyItMatters: The headline valuation is not the same as investor entry economics, and hidden seniority or covenant packages could erase much of the apparent upside.
    diligencePath: Request the latest term sheet, debt agreement, and post-money cap table from management and counsel before underwriting price.
    relatedQuestionRefs:
    - QV002
    - QV014
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited 2025 and latest 2026 revenue, gross margin, NRR, free-cash-flow, and segment mix with a bridge from the public 2023 and 2024 anchors.
    whyItMatters: Without a current audited financial pack, investors cannot test whether the >$2 billion mark reflects real economics or just a scarcity premium.
    diligencePath: Obtain the board package or audit-ready monthly financials plus cohort and segment bridges from finance leadership.
    relatedQuestionRefs:
    - QV004
    - QV027
  - type: missing-source
    severity: material
    topic: concentration-and-retention
    missingEvidence: Government versus commercial revenue mix, top-customer concentration, renewal schedule, churn, and logins-to-revenue conversion by cohort.
    whyItMatters: The reusable-identity thesis only deserves a premium if usage converts into sticky recurring economics rather than episodic procurement spikes.
    diligencePath: Request a top-20 customer revenue table, renewal calendar, and cohort monetization deck from finance and revops.
    relatedQuestionRefs:
    - QV012
    - QV026
  - type: missing-source
    severity: material
    topic: privacy-audit
    missingEvidence: Independent audit evidence on biometric deletion, retention exceptions, and partner-specific retention schedules after GAO and IRS scrutiny.
    whyItMatters: Retention practices directly affect procurement durability, regulatory risk, and eventual IPO readiness for a company handling government-linked biometric data.
    diligencePath: Review privacy-control audit reports, partner retention schedules, and legal analysis of any pending IRS policy changes before sizing a position.
    relatedQuestionRefs:
    - QV025
    - QV030
  - type: missing-source
    severity: minor
    topic: TV004 comparable-set expansion
    missingEvidence: A broader stage-matched private comparable set covering recent financing or M&A marks for adjacent identity vendors beyond the public comp rows in TV004.
    whyItMatters: The current comparable table is decision-useful but still weighted toward public names, which can understate how late-stage private identity assets are occasionally priced.
    diligencePath: Collect recent private financing or acquisition references for adjacent identity providers and expand TV004 before a final IC memo.
    relatedQuestionRefs:
    - QV019
    - QV029
    relatedTableRefs:
    - TV004
