- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - evidence
  - what would change the view
  rows:
  - - Thesis
    - Reusable credentials now appear across IRS, SSA, VA, Pennsylvania unemployment, and Medicare workflows, while market reports still support secular identity tailwinds and the 2025 financing confirms capital availability.
    - Upgrade the view only if management shows that this reuse converts into materially stronger current revenue, margin, and retention than the public anchors prove.
  - - Anti-thesis
    - The same public record shows privacy and AI oversight scrutiny, multi-provider government deployments, real competition from CLEAR, Jumio, Mitek, and Okta/Auth0, and a headline valuation already above public comp snapshots.
    - Downgrade quickly if retention rules lengthen, procurement slows, or the hidden financing stack proves materially senior to new investors.
  notes: The anti-thesis is about valuation durability and evidence quality, not denial that ID.me has built a real platform.
