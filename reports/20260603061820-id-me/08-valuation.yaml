  - limitation
  rows:
  - - Okta / Auth0
    - Customer identity infrastructure + June 2026 P/S snapshot
    - 8.13x P/S; public
    - Useful benchmark for disclosed identity software with customer-identity ambitions and broad developer distribution.
    - Workforce and enterprise mix are broader than ID.me and disclosure quality is much higher.
  - - CLEAR Secure
    - Identity platform + June 2026 P/S snapshot
    - 8.43x P/S; public
    - Relevant for biometrics, consumer identity familiarity, and current Medicare overlap.
    - Consumer subscription and travel roots make the revenue model different from ID.me's government-heavy mix.
  - - Mitek Systems
    - Identity verification + June 2026 P/S snapshot
    - 4.25x P/S; public
    - Useful pure-play identity-verification and fraud-tooling reference with public filings.
    - Smaller and differently diversified, with check and fraud products beyond IDV.
  - - ID.me implied
    - Valuation versus public 2023/2024 revenue anchors
    - '>13x on 2024 revenue or >15x on 2023 revenue; private'
    - Shows the premium new investors implicitly underwrite at a >$2B mark.
    - Relies on third-party revenue anchors because the company does not publish audited current revenue.
  notes: Comparable multiples are rough June 2026 public snapshots used for discipline, not a full normalized EV/revenue model.
