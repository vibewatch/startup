- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Revenue bridge disappoints
    - Private diligence still shows economics close to the public $130M-$150M anchors rather than materially above them
    - The current >$2B mark loses its premium support versus public comps
    - Do not lead; re-underwrite to base or bear case.
  - - Capital structure is more senior than expected
    - Debt covenants, liquidation preferences, or warrants materially reduce common-equity upside
    - Headline valuation no longer describes investor entry economics
    - Require repricing or stronger downside protection.
  - - Biometric retention obligations expand
    - Partner or government policy moves closer to long-duration retention norms
    - Regulatory and public-market appetite fall while compliance cost and litigation risk rise
    - Reduce target position size or walk away.
  - - Multi-agency reuse stalls
    - Major programs stop expanding, or large agencies choose alternatives without comparable ID.me reuse
    - The reusable-credential moat weakens and monetization durability falls
    - Recut to a lower multiple framework.
  - - Public comp band compresses
    - Identity public comps rerate lower while ID.me still seeks a private premium
    - Even stable execution could leave no margin of safety at entry
    - Pause investment until price resets.
  - - Oversight findings worsen
    - GAO, Congress, or agency customers surface new control failures beyond the current documented gaps
    - Exit readiness and procurement durability both deteriorate
    - Escalate to bear case immediately.
  notes: Each trigger is meant to be monitorable during diligence or immediately after entry rather than a vague strategic worry.
