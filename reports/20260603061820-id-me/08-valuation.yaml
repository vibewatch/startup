- id: exit-readiness-and-final-asks
  title: Exit readiness is incomplete today, so diligence asks must focus on disclosure quality and downside protection
  body: ID.me looks big enough to matter, but not public-ready on the evidence set retained here. Okta and Mitek give investors annual-report cadence, filing infrastructure, and recurring KPI disclosure; ID.me gives a private financing headline, strong customer anecdotes, and only indirect revenue anchors. That gap matters because public-market buyers punish uncertainty around revenue quality, margin structure, and governance more harshly than late-stage private investors often do. Strategic exit optionality is easier to believe than IPO readiness because adjacent identity and security platforms can value customer access, healthcare entry, and reusable-credential reach without immediately exposing the asset to public-market disclosure norms. But even that route narrows if privacy retention practices remain controversial or if government concentration proves more cyclical than the current story suggests. The indispensable next step is therefore not another market-size argument. It is a hard
    diligence pack that reconciles current revenue, margins, concentration, preference stack, and retention controls. Without that, the right posture is to keep tracking a real asset while refusing to stretch for a price that the public record still cannot fully defend.
