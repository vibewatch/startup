    {
      "id": "adoption-and-named-proof",
      "title": "Adoption trajectory and named customer proof",
      "body": "Public adoption is large enough to take seriously even though the exact segment counts drift by date. Across late-2025 and early-2026 sources, ID.me disclosed roughly 152 million to 157 million users, 76 million to 80 million federally verified users, 20 to 21 federal agencies, 45 to 50 state agencies, more than 70 healthcare organizations, more than 500 employers, and more than 600 consumer brands or private-sector entities. The strongest named proof set is in government and other regulated workflows. CMS selected ID.me for Medicare.gov, the IRS expanded with a multi-year BPA, SSA made Login.gov and ID.me its only sign-in paths, VA treats ID.me as a core credential-provider option, Pennsylvania uses ID.me for claimant verification, and VEC pairs an official launch notice with a later success story. Outside public-sector benefits, the most concrete named proofs are OtisHealth in patient-directed healthcare records access and Sterling in employment screening. That breadth is meaningful, but it also shows where proof is thinner: private-sector brand and employer presence is visible through help flows and shop surfaces, not through many independently described enterprise case studies.",
