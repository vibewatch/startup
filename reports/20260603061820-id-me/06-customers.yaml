  "callouts": [
    {
      "calloutType": "strength",
      "title": "Wallet reuse is the core customer-retention signal",
      "body": "The strongest public evidence that ID.me retains value after first deployment is not a published NRR figure; it is the repeated verify-once language across IRS, SSA, VA, Pennsylvania, VEC, and CMS. The product is explicitly designed to turn one proofing event into later logins and adjacent-service activation, and disclosed 2024 login volume shows that this reuse loop matters in practice.",
      "claimRefs": [
        "CU004",
        "CU005",
        "CU007",
        "CU008",
        "CU009",
        "CU010",
        "CU011",
        "CU012"
      ]
    },
    {
      "calloutType": "strength",
      "title": "Government proof is deepest, but expansion beyond government is real",
      "body": "CMS, IRS, SSA, VA, Pennsylvania, and VEC give ID.me a stronger named-proof set than many identity vendors have in regulated markets. The story does not stop there: OtisHealth shows a healthcare records-access wedge, Sterling shows a hiring and workforce wedge, and shop/help flows show that community verification also extends into commerce. The issue is not whether expansion exists; it is how much of it is large and durable versus surface-level brand breadth.",
      "claimRefs": [
        "CU013",
        "CU014",
        "CU015",
        "CU016",
        "CU017",
        "CU018",
        "CU019",
        "CU021",
        "CU023",
        "CU024",
        "CU026"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Concentration and procurement resilience remain the key open customer questions",
      "body": "Public materials show broad counts but not the revenue mix underneath them. That matters because the most visible customers are still government and regulated-access programs, exactly where procurement, privacy, and oversight debates can alter growth or renewal timing. GAO's IRS review makes this concrete: very large production use did not prevent oversight gaps from becoming a public issue, and investors still cannot see top-account concentration, segment ARR, or renewal quality.",
      "claimRefs": [
        "CU042",
        "CU043",
        "CU044",
        "CU045",
        "CU046",
        "CU047",
        "CU048",
        "CU049"
      ]
    }
  ],
