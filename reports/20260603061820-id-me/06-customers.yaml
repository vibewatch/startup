    {
      "id": "durability-and-expansion",
      "title": "Durability proxies, repeat sign-in, and expansion loops",
      "body": "ID.me does not publish classic B2B durability metrics such as NRR, GRR, logo churn, or average contract term. Even so, the public record contains several useful proxies. First, repeat usage is structurally embedded in the product: customers are paying for a reusable credential, and Sacra explicitly says revenue continues when verified identities are reused for logins and attribute checks. Second, disclosed login volume is large, with more than 409 million successful logins in 2024, which is a better durability read-through than a raw logo count because it reflects returning usage. Third, state-benefits evidence shows outcome quality after deployment: VEC reported higher digital usage, lower call volume, and a large share of customers successfully accessing benefits through ID.me, while Pennsylvania describes quick self-service flows plus human and in-person fallback paths. Expansion loops are also visible. The government-installed base becomes a healthcare acquisition wedge in OtisHealth, the verified-candidate base lowers friction in Sterling hiring workflows, and brand-discount programs pull government, hospital, and medical-worker identities into commerce. Those are real expansion signals, but they are still proxies until ID.me discloses retention or segment-level monetization data.",
