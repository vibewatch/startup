  title: Company Overview
  summary: ID.me is a McLean, Virginia-based digital identity wallet company founded in 2010 by Blake Hall that has become a late-stage private provider of reusable identity infrastructure for government, healthcare, and commercial workflows. Public materials strongly support scale, security credentials, and financing momentum, but remain materially thinner on board disclosure, audited financials, headcount, and debt terms.
