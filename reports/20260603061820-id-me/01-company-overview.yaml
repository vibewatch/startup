- id: section-2
  title: Founder-led leadership, governance visibility, and key-person dependence
  body: |-
    ID.me remains visibly founder-led. Blake Hall is still the founder and CEO, and the reviewed official sources repeatedly use Hall as the external voice for the company’s mission, major financing, and major government-contract milestones. That pattern matters: it suggests that the company’s public credibility is still tightly coupled to Hall’s founder narrative, military-service background, and longstanding privacy-and-trust framing. From a diligence perspective, this is a classic key-person signal. It is not automatically negative, but it does mean that strategic messaging, investor confidence, and public-sector trust are unusually concentrated in one executive persona.

    The rest of the publicly visible leadership bench is thinner. Carahsoft’s 2023 partnership announcement surfaced Derrick Roberts as director of business development, and FedScoop’s CMS coverage referenced Wes Turbeville as senior vice president of federal and healthcare, which shows functional leadership around public-sector distribution and sector GTM. But the source set reviewed here did not surface a current full executive roster, named board members, or committee structure. That is notable because ID.me now operates across sensitive government and healthcare workflows while remaining private and comparatively opaque on governance.

    The practical implication is that leadership continuity looks strong, but governance diligence cannot rely on public materials alone. Any serious diligence process should ask directly for the board roster, investor-rights structure, and which executives beyond Hall own product, finance, operations, security, and regulatory affairs.
  claimRefs:
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  tableRefs:
