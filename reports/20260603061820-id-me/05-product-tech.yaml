chapter:
  number: 5
  title: Product & Technology
  summary: ID.me's public product surface supports a credible digital-identity-platform thesis rather than a thin login widget story. The product combines a reusable wallet, multi-path identity proofing, federation via OIDC/SAML/OAuth 2.0 + PKCE, and visible developer assets including APIs and an Android SDK. Its strongest differentiation is credential reuse across a large government and commercial network with human fallback paths for inclusion, while the main diligence risks are biometric/AI governance, limited public SLA or pricing detail, and demonstrated operational dependence on live wallet and video-support systems.
sections:
- id: product-surface-and-user-workflow
  title: Product delivered and user workflow
  body: 'In customer workflow terms, ID.me sells a reusable digital identity wallet that lets an individual create an account once, secure it with MFA, complete a high-assurance proofing step, and then consent to share verified data back to a government agency, healthcare property, employer, or consumer brand. The company does not present the wallet as only a login container: the same surface is used for government access, community-status cards, and attribute sharing. The strongest workflow evidence is in government use cases, where the user journey is explicit. A relying party sends the user to ID.me, the user creates or reuses a wallet, completes MFA, uploads document and SSN evidence, and either finishes self-service or escalates to short video, extended video, or in-person proofing before returning to the partner site to consent to data release. That workflow is specific enough to underwrite the product as an identity-and-attribute broker, not just a credential vault, but public materials
    still stop short of exposing conversion by pathway, abandonment by step, or staffing service levels for assisted verification.'
  claimRefs:
