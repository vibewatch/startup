- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - ID.me solution
  - Measurable benefit
  - Limitation
  rows:
  - - Access IRS online accounts
    - Create account, secure it, prove identity, then sign in again per service
    - Two-part setup with one ID.me account reused across most IRS accounts and services
    - One verified account reused across multiple IRS services
    - IRS still depends on one vendor for IAL2 proofing
  - - Verify for VA.gov
    - Online identity verification before benefits access
    - Self-service for standard IDs with video or in-person fallback paths
    - One-time verification usually takes about 10 minutes
    - Document and MFA requirements can still exclude some users
  - - File Virginia unemployment claims
    - Fraud controls and support burdens slowed benefits access
    - Reusable wallet plus self-service, video chat, and in-person proofing
    - VEC reports 173% higher online usage and 57% lower call volume
    - Outcomes are from one public case study, not a broad benchmark
  - - Sign in to Medicare.gov beginning 2026
    - Separate credentials across SSA, VA, and CMS touchpoints
    - Reuse existing ID.me credential with high-assurance matching and multilingual video support
    - Reduces re-proofing and continuity breaks across agencies
    - Medicare flow is announced, not yet broadly observed in production
  notes: Benefits are public workflow outcomes or agency/company statements, not independent cohort-level conversion studies.
