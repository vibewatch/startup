  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Reusable identity wallet
    - Individuals plus relying parties
    - Broadly deployed
    - One-time proofing with cross-site credential reuse
    - No public conversion or service-level breakdown by pathway
  - - Identity Gateway and federation layer
    - Agency and enterprise integrators
    - Publicly documented
    - OIDC, SAML, OAuth 2.0, PKCE, and APIs exposed in one docs surface
    - No public rate limits, tenancy model, or failover design
  - - Community / attribute verification cards
    - Merchants, employers, agencies, end users
    - Live production surface
    - Wallet extends beyond identity to reusable status cards such as military, nurse, and student
    - Independent adoption split by vertical is not public
  - - Mobile SDK and sample integrations
    - Mobile developers
    - Active public artifacts
    - Chrome Custom Tab auth, encrypted storage, token refresh, JWT validation
    - GitHub Packages + PAT requirement adds setup friction
  - - Assisted verification pathways
    - Thin-file or failed self-service users
    - Operational in public deployments
    - Short video, extended video, and in-person options widen inclusion versus pure automation
    - No public staffing model or queue-time SLA
  notes: Maturity means publicly evidenced product surface, not audited attach rate or commercial penetration by module.
