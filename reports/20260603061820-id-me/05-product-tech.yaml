callouts:
- calloutType: strength
  title: Reusable credentials are the real moat
  body: The strongest product differentiator is not just proofing accuracy but the ability to reuse one credential across multiple agencies and sectors, which compounds user convenience and partner value as the network grows.
  claimRefs:
  - CE018
  - CE028
  - CE029
  - CE042
- calloutType: risk
  title: Human fallback increases inclusion but adds operating burden
  body: Video and in-person pathways make the product more inclusive than pure automation, but they also increase staffing, oversight, and service-level dependence just as agencies scrutinize biometrics and AI governance more closely.
  claimRefs:
  - CE007
  - CE037
  - CE041
  - CE043
