- id: deployment-reuse-and-differentiation
  title: Deployment, credential reuse, and differentiation
  body: 'The strongest evidence for ID.me''s product maturity is not an architecture white paper but public deployment behavior. IRS, SSA, VA, Virginia unemployment systems, and the announced Medicare.gov rollout all describe the same reusable-credential logic: a user proves identity once, then reuses that credential across multiple services without repeating the full proofing ceremony. That reuse turns the wallet into a distribution and data-availability moat. The company claims more than 157 million users and broad federal, state, healthcare, and commercial coverage, and VEC provides a more operational proof point by reporting better digital adoption and lower support volume after rollout. This network effect is the main way ID.me differentiates from API-first verification vendors that optimize for one-off checks and from broader procurement channels such as Carahsoft that help distribute, but do not replace, the core credential layer. The same pattern also creates dependencies: the product
    is most valuable where agencies trust each other’s credentialing, where users arrive pre-verified, and where governments keep preferring a reusable intermediary over multiple local credentials or newer platform-native identity stacks.'
