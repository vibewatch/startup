- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Evidence capture layer
    - Collect document, SSN, selfie/video, and supporting evidence
    - Government IDs, SSN availability, camera-equipped devices, assisted agents
    - Coverage and accuracy depend on document quality and pathway design
  - - Wallet + credential layer
    - Issue and hold reusable verified credential plus community cards
    - Persistent account, MFA enrollment, consented sharing model
    - Reuse moat weakens if relying-party trust or user continuity breaks
  - - Federation / API layer
    - Broker relying-party access and attribute exchange
    - OIDC, SAML, OAuth 2.0, PKCE, Applications / Events / Services / Document Passback APIs
    - Public docs expose surface area but not back-end tenancy or rate controls
  - - Mobile client layer
    - Embed proofing and login into apps
    - Android SDK, GitHub Packages, redirect URI handling, Chrome Custom Tabs
    - PAT-based package install and mobile redirect correctness add integration friction
  - - Operations + trust layer
    - Host, secure, monitor, and disclose service state
    - FedRAMP-authorized AWS, encryption, RBAC, status page, compliance programs
    - Public control disclosures are stronger than public architecture or SLA detail
  notes: This is a public-evidence operating model, not an internal engineering diagram or control narrative.
