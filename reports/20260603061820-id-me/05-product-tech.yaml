  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: service-level-transparency
    missingEvidence: Public SLAs, SLOs, queue-time commitments, and service health metrics for wallet, API, and assisted-verification operations.
    whyItMatters: Without service-level transparency, it is hard to price outage risk or understand whether video support and wallet operations can scale during surge events.
    diligencePath: Request customer SLAs, internal SLO dashboards, queue-time distributions, and incident postmortems segmented by wallet, API, and video pathways.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: ai-bias-and-liveness-benchmarks
    missingEvidence: Public benchmark data for liveness, false-positive and false-negative rates, demographic performance, and human-escalation rates across biometric proofing pathways.
    whyItMatters: The public risk debate focuses on fairness, exclusion, and AI governance, but investors still cannot quantify model quality or whether human fallback meaningfully closes demographic gaps.
    diligencePath: Request third-party bias testing, liveness evaluations, false-match metrics, and escalation outcome data split by pathway and protected cohort where legally available.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: material
    topic: commercial-and-api-terms
    missingEvidence: Public pricing, per-verification economics, API rate limits, implementation SLAs, and support entitlements for enterprise and government buyers.
    whyItMatters: The product may be strategically strong while still being operationally expensive or difficult to integrate, and public materials do not reveal whether reuse offsets service costs in real deployments.
    diligencePath: Request price sheets, sample MSAs/SOWs, API limit docs, and support-policy exhibits for at least one federal, one healthcare, and one commercial customer archetype.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: minor
    topic: internal-architecture-disclosure
    missingEvidence: A deeper public description of internal services, tenant isolation, regional failover, and data-plane boundaries between proofing, wallet, and federation components.
    whyItMatters: Public integration detail is stronger than public backend detail, leaving blast-radius and resilience analysis dependent on management access rather than external evidence.
    diligencePath: Request architecture review materials, environment diagrams, and a recent resilience tabletop or DR test summary from engineering leadership.
