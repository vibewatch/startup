  evidenceGaps:
  - type: missing-source
    severity: material
    topic: federal-revenue-concentration
    missingEvidence: Current public revenue or bookings split by IRS, broader federal customers, and non-government segments.
    whyItMatters: Without segment concentration, investors cannot tell whether a single procurement reset would dent revenue modestly or break the model.
    diligencePath: Request a customer concentration schedule, trailing-12-month revenue by segment, and top-agency gross-margin bridge.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: sla-indemnity-terms
    missingEvidence: Major customer contract exhibits covering uptime commitments, service credits, indemnities, audit rights, and breach allocation.
    whyItMatters: Residual downside depends on whether service failures or privacy incidents create capped support costs or open-ended contractual exposure.
    diligencePath: Obtain the top agency and top commercial contract packs, including security exhibits, incident-response annexes, and negotiated indemnity carve-outs.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: biometric-bias-benchmarks
    missingEvidence: Public third-party fairness, false-positive, false-negative, and demographic performance data for biometric proofing pathways.
    whyItMatters: This gap prevents rigorous underwriting of civil-rights, exclusion, and regulator-response risk in high-stakes government workflows.
    diligencePath: Request model cards, external bias-audit results, complaint rates by demographic segment, and remedial process metrics for failed verifications.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
    - TR002
