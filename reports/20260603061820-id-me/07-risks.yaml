- id: operational-security-service
  title: Operational reliability, support complexity, and security burden are real execution risks
  body: 'Operational risk at ID.me is less about whether the company has controls and more about whether those controls can remain fast, inclusive, and reliable at the company’s current scale. The status page proves wallet failures do happen in public, and the business model means failures are not just support annoyances: the company gets paid when verifications and reused logins succeed. At the same time, ID.me’s own security and compliance pages show a real mitigation stack—FedRAMP hosting, encryption, and multi-standard compliance. The harder problem is that inclusion requires expensive pathways. NIST explicitly pushes comparable-assurance options and exception handling, and ID.me publicly operates self-service, short-video, extended-video, and in-person verification paths. Those pathways are a strength because they reduce exclusion and help public customers, but they also create staffing, QA, and recovery complexity that can widen costs precisely when fraud pressure or policy scrutiny
    rises.'
