- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - Regulatory trust breakdown
    - GAO / agency oversight status
    - Recommendation 1 or 4 still open at next refresh, or a new agency review adds findings on AI, privacy, or fairness
    - Move from monitor to hard re-underwrite and require a remediation memo plus dated closure commitments.
  - - Reliability and support failure
    - Wallet or proofing incidents
    - Repeated customer-visible incidents, prolonged queue times, or no private evidence of uptime/SLA discipline
    - Raise required return and demand service-level exhibits before underwriting durable reuse revenue.
  - - Federal procurement concentration
    - Agency choice and contract posture
    - Loss, shrinkage, or material repricing of IRS / CMS scope, or visible migration toward Login.gov or CLEAR
    - Cut exposure unless management shows offsetting wins and low dependence on the affected program.
  - - Disclosure and financing mismatch
    - Growth claims versus financial detail
    - New valuation or debt expansion without segment revenue, margin, concentration, and contract economics
    - Treat as a stop-and-reunderwrite event rather than extrapolating usage metrics into resilient cash flow.
  notes: These kill criteria are designed to be monitored from official status pages, oversight publications, contract announcements, and diligence materials rather than intuition.
