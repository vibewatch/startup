chapter:
  number: 7
  title: Risks
  summary: ID.me’s highest residual risks are regulatory trust and privacy governance around biometric proofing, followed by public-sector concentration and the execution burden of keeping inclusive identity verification reliable at scale. Public mitigations matter, but open oversight findings, visible alternatives, and thin financial disclosure keep residual risk high until diligence closes the remaining gaps.
sections:
- id: legal-regulatory-privacy
  title: Regulatory, legal, and privacy risk remains the highest-severity stack
  body: ID.me’s top residual risk is not ordinary product competition but regulatory trust around biometric identity proofing. The public record shows that the IRS still depends on ID.me as its sole IAL2 provider for a program that handled more than 150 million accesses from 2021 through 2024, while GAO still shows core recommendations on goals and AI oversight as open. That combination matters because the company’s legal documents make clear that ID.me collects unusually sensitive inputs—government ID images, Social Security-linked information, biometric data, and agency reporting data—while its biometric consent statement allows retention for up to a year after wallet closure. Those policies are not evidence of wrongdoing; they are the normal legal scaffolding for a high-assurance identity provider. But they do define the blast radius if regulators, lawmakers, or agencies decide that deletion rules, fairness evidence, or AI-governance controls are insufficient. The risk is therefore best
    read as severity-ranked privacy and procurement exposure rather than a single lawsuit headline.
