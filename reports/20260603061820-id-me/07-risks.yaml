- id: dependency-and-concentration
  title: Portability is valuable, but public-sector concentration and channel dependence can still reprice growth
  body: ID.me’s network effects are real, but the same public evidence also shows that portability should not be mistaken for exclusivity. Social Security and VA both allow Login.gov alongside ID.me, and Medicare is adding CLEAR as another option. That means the wallet can be useful across agencies while still being vulnerable to substitution if one provider looks cheaper, easier to govern, or less politically controversial. Procurement concentration compounds that risk. GovConWire reported a BPA worth up to $1 billion at the IRS, and public-sector distribution also runs through channels such as Carahsoft’s government-aggregator model. These arrangements help scale sales and reduce onboarding friction, but they also mean that budget cycles, contract vehicles, reseller economics, and agency procurement preferences can transmit directly into revenue. The strongest public customer proof, like the VA and Virginia cases, shows durability and outcomes; it does not eliminate the risk that a small
    number of public institutions still dominate strategic credibility and a meaningful share of volume.
  claimRefs:
