      label: Fraud / compliance trigger
      detail: Identity theft, KYC mandates, or public-service modernization elevate identity proofing into a funded workflow.
      claimRefs:
      - CM007
      - CM050
      - CM051
    - id: buyer
      label: Buyer / payer owns workflow
      detail: Agency, payer, employer, brand, or enterprise team decides whether the use case needs high assurance and reuse.
      claimRefs:
      - CM012
      - CM013
      - CM029
    - id: procure
      label: Procurement + integration
      detail: The platform must clear procurement channels and fit OIDC/SAML/API identity stacks.
      claimRefs:
      - CM019
      - CM028
    - id: proof
      label: Proofing and login execution
      detail: Users complete self-service or fallback verification and then sign in with strong authentication.
      claimRefs:
