    - n/a
    - Installed-base and network-utility lens
    - high
    - Traction lens is not revenue, margin, or obtainable-share disclosure
  notes: This table intentionally mixes market revenue, budget-cap, and installed-base lenses because public evidence does not support a clean ID.me TAM/SAM/SOM stack. The mixed-unit approach is the least assumption-heavy way to bracket opportunity.
