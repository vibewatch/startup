  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-pricing
    missingEvidence: Segment-level contract volumes, realized pricing, renewal rates, and revenue mix by government, healthcare, employer, and brand workflows.
    whyItMatters: Without pricing and mix data, public evidence can bracket TAM and demand lanes but cannot support a clean ID.me SAM or obtainable-share model.
    diligencePath: Request cohort-level contract data, pricing waterfalls, and renewal metrics by vertical from management or data room materials.
    relatedQuestionRefs:
    - QM008
    - QM026
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: footprint-metrics
    missingEvidence: A reconciled bridge for user, IAL2-verified, agency, and healthcare counts across 2024 and late-2025 disclosures.
    whyItMatters: The public record shows rapid growth but uses changing cutoffs, which makes network-effect and penetration analysis less precise.
    diligencePath: Ask management for a dated KPI bridge that reconciles 2024, September 2025, and December 2025 footprint metrics using one methodology.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: minor
    topic: multi-vendor-share
    missingEvidence: Independent public data on workflow share between ID.me, Login.gov, CLEAR, and platform-native credentials inside the same regulated buyer journeys.
    whyItMatters: The market clearly supports substitutes and multi-homing, but the public record does not quantify how often ID.me owns the whole workflow versus one step of it.
    diligencePath: Collect customer references, procurement scopes, and workflow diagrams that show whether ID.me is the primary identity layer or one vendor among several.
    relatedQuestionRefs:
    - QM014
