slug: id-me
runDate: '2026-06-03'
company:
  name: ID.me
chapter:
  number: 2
  title: Market Analysis
  summary: ID.me's relevant market is the narrower high-assurance, reusable identity layer that sits inside but is not equivalent to the broader identity verification and digital identity services markets. Public sizing lenses range from about USD 9.9 billion for legacy identity verification to USD 28.5 billion for broader digital identity services in 2025, but the more decision-useful lens for ID.me is a smaller U.S. regulated-access market spanning government, healthcare, employers, and verified-attribute commerce. Growth is supported by fraud pressure, compliance mandates, and credential reuse, while privacy scrutiny, integration burden, and multi-vendor substitutes constrain any clean TAM/SAM/SOM claim.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Adjacencies
  body: 'ID.me does not compete for every dollar labeled digital identity. Its most defensible market boundary is reusable, high-assurance identity proofing, authentication, and attribute exchange for regulated digital access. Included spend is the combination of proofing, strong authentication, credential reuse, and workflow integration that lets an agency, healthcare organization, employer, or merchant rely on a previously verified user. That is broader than a one-time KYC API, because wallet reuse and verified attributes create follow-on value across multiple relying parties, but it is narrower than the whole digital identity services stack. Broad orchestration, generic CIAM, and workforce IAM budgets are adjacent because they solve login and access problems, yet they often do so without the high-assurance proofing, portable wallet, or community/eligibility attributes that define ID.me’s differentiation. The commercial boundary also includes benefits and community-verification workflows
    at brands and employers, while excluding most physical-access subscriptions and low-assurance authentication tools. In practice, the category behaves like cross-vertical trust infrastructure: the same wallet can unlock IRS services, Social Security, VA access, Medicare.gov, employer workflows, and verified-attribute commerce, but each buyer still evaluates the spend through its own budget, compliance, and integration lens.'
