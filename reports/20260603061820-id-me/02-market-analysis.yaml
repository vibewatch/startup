figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Three nested lenses move from the broadest digital identity-services framing to the narrower U.S. identity-verification proxy that best fits ID.me’s current footprint.
  data:
    items:
    - label: Broad digital identity services
      value: USD 28.5B in 2025
      detail: Future Market Insights includes wallets, orchestration, fraud, authentication, and other identity-service layers.
    - label: Global identity verification
      value: USD 14.34B in 2025
      detail: MarketsandMarkets provides a narrower verification-focused market lens than the broader digital identity stack.
    - label: U.S. identity verification
      value: USD 4.34B in 2025
      detail: The U.S. submarket is the most decision-useful public proxy for ID.me’s current domestic, regulated-access footprint.
  approximationNotes: The layers are comparable in currency but not perfectly nested definitions. They are intended as progressively narrower public lenses, not a precise bottom-up TAM/SAM/SOM cascade.
