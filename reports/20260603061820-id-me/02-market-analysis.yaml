- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Identity fraud, cybercrime, and KYC/AML pressure
    - Driver
    - Current + durable
    - Expands budget priority for high-assurance proofing across regulated sectors
    - Break demand by fraud-sensitive workflow and compliance regime
  - - Government digital-service modernization and interoperability
    - Driver
    - Current + medium-term
    - Supports CMS, IRS, SSA, VA, and related program expansion
    - Map which agencies want reusable cross-program credentials versus point solutions
  - - Reusable credential and wallet network effects
    - Driver
    - Current + durable
    - Later relying parties may face lower user-acquisition friction if many users are already verified
    - Request cohort data on reuse rates, repeat logins, and cross-relying-party conversion
  - - API-first and cloud integration patterns
    - Driver
    - Current + medium-term
    - Makes enterprise embedding more feasible when ID.me fits existing identity stacks
    - Measure average integration time and partner dependency by segment
  - - Implementation cost, human review, and inclusion operations
    - Constraint
    - Current
    - High-assurance and fallback pathways can raise cost to serve relative to lighter-weight APIs
    - Ask for gross margin and manual-review intensity by workflow
  - - Privacy, biometric retention, and AI oversight scrutiny
    - Constraint
    - Current + policy-sensitive
    - Trust failures can slow procurement, trigger oversight, or limit user acceptance
    - Review deletion controls, auditability, and adverse policy exposure
  - - Substitutes and multi-vendor workflows
    - Constraint
    - Current + medium-term
    - Login.gov, CLEAR, and platform-native wallets can win part of the workflow even when ID.me is present
    - Quantify share of workflow and renewal risk where buyers multi-home vendors
  - - Public-sector concentration and procurement cadence
    - Constraint
    - Current
    - Large public-sector deals can support scale but also create concentration and policy risk
    - Request vertical revenue mix, largest-customer exposure, and procurement pipeline timing
  notes: The table mixes category-level demand drivers with buyer-specific adoption constraints because ID.me sells into regulated workflows rather than a single homogeneous software market.
