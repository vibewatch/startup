callouts:
- calloutType: insight
  title: The broadest market headline is not the most useful valuation lens
  body: The USD 28.5 billion digital identity services figure is real as a category map, but it overstates ID.me’s direct opportunity because it includes adjacent orchestration and wallet services that many buyers can purchase without choosing a high-assurance, reusable proofing provider.
  claimRefs:
  - CM003
  - CM005
  - CM016
  - CM047
- calloutType: risk
  title: Privacy and policy risk can cap adoption even while demand grows
  body: Fraud, modernization, and compliance create real demand, but adverse scrutiny from GAO, lawmakers, and the press means trust failures can slow procurement or force buyers to multi-home vendors instead of standardizing on a single reusable identity stack.
  claimRefs:
  - CM030
  - CM037
  - CM038
  - CM039
  - CM043
- calloutType: assumption
  title: Reuse economics matter more than one-time verification counts
  body: ID.me’s strongest market argument is not raw verification volume; it is that one verified credential can lower later acquisition friction for the next relying party. That assumption appears plausible, but public data still does not quantify reuse-driven monetization by vertical.
  claimRefs:
  - CM014
  - CM021
  - CM033
  - CM049
