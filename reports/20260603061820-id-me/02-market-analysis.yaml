- id: growth-drivers-and-constraints
  title: Growth Drivers, Adoption Constraints, and Critical Gaps
  body: 'The category’s strongest growth drivers are persistent fraud pressure, digitization of government and regulated workflows, and the value of reusing a verified identity instead of repeating manual proofing. MarketsandMarkets and Grand View Research both point to cybercrime, identity theft, and compliance as demand engines, while CMS and Medicare framing shows modernization and interoperability are now explicit public-sector buying motives. ID.me also benefits from procurement leverage through Carahsoft, technical compatibility with mainstream identity stacks, and case-study evidence that buyers can improve service levels and lower support cost after deployment. But the constraints are equally material. High-assurance proofing is not a lightweight plug-in: integration work, compliance review, human fallback, and inclusion pathways raise cost to serve. Privacy and trust remain structural gating factors because regulators, lawmakers, civil-rights groups, and the press continue to scrutinize
    facial recognition, biometric retention, and AI oversight. Multi-vendor competition is real as well. Login.gov remains a substitute in federal access, and FedScoop reported that CMS is also using CLEAR for part of the Medicare workflow, while Sacra highlights longer-term platform risk from Apple, Google, and enterprise identity suites. The result is a market with strong secular tailwinds but no free pass on margin, policy durability, or clean obtainable-share assumptions.'
