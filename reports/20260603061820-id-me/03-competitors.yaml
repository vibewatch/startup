  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor
      - Public pricing signal
      - Packaging posture
      - Sales motion
      - Buyer implication
    rows:
      - - ID.me
        - No broad public list pricing in cited surfaces
        - High-assurance identity wallet and agency / enterprise programs
        - Quote-led and procurement-led
        - Strong fit for complex regulated accounts but weaker self-serve discovery
      - - Persona
        - Essential starts at USD 250 per month; Growth and Enterprise move to contact sales
        - Tiered identity platform with self-guided and bespoke options
        - Self-serve entry plus enterprise upsell
        - Easier to trial for smaller teams while still supporting complex programs
      - - Socure
        - Launch posts USD 0.80 to USD 1.30 per evaluation plus USD 1,000 monthly credits; Enterprise custom
        - Pre-built self-serve solutions plus full RiskOS enterprise stack
        - Self-serve and enterprise hybrid
        - Gives buyers a clear benchmark for API-style verification economics
      - - Auth0
        - Free, USD 35 per month, and USD 240 per month self-serve plans before enterprise
        - CIAM platform with add-ons and enterprise tiers
        - Product-led self-serve with enterprise expansion
        - Strong for teams that want fast developer adoption and budget clarity
      - - Jumio
        - Demo only on cited platform surface
        - Configurable identity intelligence platform
        - Enterprise sales-led
        - Best suited to buyers already prepared for a consultative onboarding process
      - - Trulioo
        - Demo only on cited product surfaces
        - Global identity platform with modular services
        - Enterprise sales-led
        - Good global coverage story, but weak public price transparency
      - - CLEAR1
        - No public enterprise list price on cited surface
        - Enterprise identity product tied to healthcare, workforce, and account recovery use cases
        - Enterprise and partner sales-led
        - Benefits from brand trust, but price discovery still requires a sales cycle
      - - SheerID
        - No public list price on cited surfaces
        - Eligibility verification and audience-data platform
        - Demo and contact-sales oriented
        - Attractive for commerce offers, but less suitable as a direct benchmark for regulated sign-in pricing
    notes: This table compares public buyer-facing packaging, not realized contract rates. Negotiated public-sector and healthcare pricing can differ materially from list or self-serve entry points.
