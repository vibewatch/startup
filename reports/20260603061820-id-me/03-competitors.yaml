  - id: FP003
    title: Moat / readiness KPIs
    type: kpi
    summary: Compact underwriting view of ID.me's current competitive readiness and where displacement risk is most visible.
    data:
      items:
        - label: Wallet reuse moat
          value: Real
          detail: Public sources consistently show the clearest differentiation in reusable, high-assurance identity rather than raw API breadth.
        - label: Public-sector exclusivity
          value: Weakening
          detail: Medicare, SSA, and VA show buyers can support CLEAR or Login.gov alongside ID.me.
        - label: Pricing transparency
          value: Low
          detail: ID.me remains quote- and procurement-led while several rivals expose self-serve entry pricing.
        - label: API commoditization risk
          value: High
          detail: Market reports and rival positioning point toward API-first orchestration and workflow flexibility as the center of gravity.
        - label: Long-term moat durability
          value: Moderate
          detail: Defensible in regulated reuse-heavy workflows, but vulnerable where buyers prioritize speed, configurability, or bundle leverage.
