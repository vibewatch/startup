  - id: TP006
    title: Switching cost and multi-homing comparison
    columns:
      - Lock-in vector
      - Why it is sticky
      - Evidence of stickiness
      - Multi-home escape hatch
      - Implication
    rows:
      - - Reusable wallet adoption
        - Users can carry one verified credential across more relying parties
        - ID.me publicly stresses wallet reuse across agencies and private entities
        - Buyers can still add other verifiers for selected workflows
        - Helpful moat, but only if more relying parties keep accepting the wallet
      - - High-assurance compliance posture
        - Programs do not want to restart assurance, accessibility, and support design work
        - ID.me, Login.gov, and agency pages all frame identity through standards and MFA choices
        - Agencies can shift some journeys to Login.gov or layered vendors
        - Compliance creates inertia, but it does not guarantee exclusivity
      - - Recovery and support operations
        - Multilingual recovery, assisted verification, and video fallback are hard to rebuild quickly
        - ID.me and CLEAR both highlight recovery and support value in regulated workflows
        - Recovery can be split by journey, as Medicare shows
        - Operational support is sticky, yet buyers can still segment the stack
      - - APIs and workflow configuration
        - Engineering teams invest real time in custom integrations and policy logic
        - Persona, Socure, Jumio, Trulioo, and Auth0 all sell programmable identity layers
        - Competing APIs can replace each other if identity is treated as a component
        - API-heavy accounts may be less durable than wallet-led accounts
      - - Verified-attribute and loyalty programs
        - Marketing programs reuse the same audience logic and offers over time
        - SheerID shows strong commercial proof in verified-audience commerce
        - Commerce buyers can choose narrower verified-attribute tools instead of full identity wallets
        - ID.me does not own this lane outright even if it has wallet cards
      - - Procurement and partner channels
        - Federal and enterprise buyers often rely on approved vehicles and known partners
        - Socure lists procurement vehicles; Login.gov is official; ID.me has agency footprint
        - New entrants can still arrive through adjacent contracts or bundled suites
        - Channel access raises barriers, but not enough to prevent flank entrants
    notes: Switching-cost evidence is strongest in regulated operations and reusable identity, but the public record also shows clear pathways for multi-homing by workflow, audience, or procurement lane.
    claimRefs:
      - CP001
      - CP002
      - CP025
      - CP026
      - CP028
      - CP031
      - CP040
      - CP041
  - id: TP007
    title: Moat durability / competitive risk register
    columns:
      - Moat or risk
      - Evidence
      - Threat source
      - Severity
      - Diligence ask
    rows:
      - - Reusable high-assurance wallet is real differentiator
        - ID.me and Sacra both emphasize reuse beyond a one-time check
        - Wallet value falls if relying-party acceptance stalls
        - Medium
        - Measure reuse frequency, relying-party growth, and repeat-login monetization by vertical
      - - Government and healthcare foothold creates trust and distribution
        - ID.me has public agency and healthcare scale claims
        - Login.gov and CLEAR show the same buyers can still adopt substitutes
        - High
        - Get current agency-level split of exclusive versus shared deployments
      - - Transparent API pricing can reset buyer expectations
        - Persona, Socure, and Auth0 all publish self-serve entry economics
        - Smaller or mid-market buyers may compare ID.me to cheaper or easier trials
        - Medium
        - Quantify how often deals are lost before procurement because price discovery is easier elsewhere
      - - Medicare demonstrates multi-homing rather than winner-take-all
        - CLEAR official site and FedScoop both show coexistence with ID.me
        - Similar split deployments could appear in other public programs
        - High
        - Request scope, volume, and renewal detail on CMS, SSA, and VA account journeys
      - - API-first and orchestration shift can commoditize point identity checks
        - Future Market Insights points to API-first SaaS and orchestration as the revenue center of gravity
        - Persona, Socure, Jumio, and Trulioo compete well when buyers want components not networks
        - High
        - Test whether ID.me wins on reuse often enough to offset lower-friction API competition
      - - Platform-native and suite vendors could absorb identity budget
        - Sacra highlights Apple, Google, and enterprise suites as long-term displacement risk
        - Broader platforms can relegate specialists to edge cases or backup flows
        - Medium
        - Track whether mobile credentials, suite bundles, or government-owned infrastructure reduce the need for a third-party wallet
    notes: Severity reflects underwriting risk to ID.me's competitive durability, not certainty of displacement. Public evidence supports a moderate moat with clear pressure points rather than a winner-take-all market structure.
