callouts:
  - calloutType: insight
    title: Reuse is the strongest differentiator, not the only buying criterion
    body: ID.me looks most differentiated when the buyer values one verified credential that can travel across multiple relying parties, especially in regulated workflows. Many rival products win instead on configurability, faster self-serve deployment, or narrower use-case fit.
    claimRefs:
      - CP001
      - CP003
      - CP036
      - CP037
  - calloutType: risk
    title: Public-sector buyers are clearly willing to multi-home
    body: Medicare, SSA, and VA public materials show that agencies can support multiple identity providers at once. That weakens any assumption that an early public-sector foothold automatically becomes exclusive long-term control.
    claimRefs:
      - CP025
      - CP027
      - CP028
      - CP040
