  - id: TP004
    title: Distribution, trust, and regulatory posture comparison
    columns:
      - Vendor
      - Distribution anchor
      - Public trust or compliance signal
      - GTM motion
      - What it means for ID.me
    rows:
      - - ID.me
        - Reusable wallet already used across agencies, states, healthcare, and brands
        - IAL2/AAL2 and public-sector proofing narrative
        - Top-down regulated sales plus consumer credential reuse
        - Real network effects if wallet acceptance keeps compounding
      - - Persona
        - Developer and startup accessibility with configurable platform
        - SOC 2 messaging and successful-verification pricing logic
        - Product-led entry plus enterprise plans
        - Can win when buyers want flexible workflows before they want a wallet network
      - - Socure
        - Fraud tooling breadth and self-serve Launch plus enterprise RiskOS
        - FedRAMP authorization and public-sector procurement vehicles
        - Hybrid self-serve and enterprise motion
        - Strong threat in agency and fintech deals that center on fraud capture
      - - Auth0
        - Okta installed base and developer reach
        - 99.99 percent SLA and scale metrics on public site
        - Strong self-serve and enterprise expansion
        - Raises the hurdle for any new spend framed as login and customer identity orchestration
      - - Jumio
        - Global document and identity coverage
        - Platform claims around billions of transactions and 5K plus ID types
        - Enterprise consultative sales
        - Strong substitute in cross-border onboarding or fraud-led deployments
      - - CLEAR1
        - Consumer biometric network and high-brand trust
        - 41mm plus users and Medicare selection on official site
        - Enterprise healthcare and workforce sales
        - Strong wedge for account recovery and healthcare identity journeys
      - - Login.gov
        - Official government partner model
        - FedRAMP Moderate, NIST alignment, SAML and OIDC support
        - Agency partnership motion only
        - Constrains ID.me's public-sector upside where agencies prefer government-owned infrastructure
      - - SheerID
        - Commerce and loyalty programs with hundreds of brand relationships
        - 200K plus authoritative data sources and outcome-oriented case examples
        - Marketing and offer-program sales motion
        - Defends the verified-attribute commerce niche without matching ID.me's broader wallet ambition
    notes: 'Distribution in this category comes from different assets: some vendors start with a user network, others with developers, fraud tooling, or government certifications. That asset mix shapes both win rates and switching costs.'
