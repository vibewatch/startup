  - id: TP005
    title: Government / public-sector substitute table
    columns:
      - Substitute
      - Where visible in public sources
      - Why a buyer might choose it
      - Constraint versus ID.me
      - Competitive implication
    rows:
      - - Login.gov
        - Login.gov partner page; SSA and VA support both Login.gov and ID.me
        - Government-owned MFA and identity infrastructure with FedRAMP Moderate and OIDC/SAML support
        - Government only and not a broad commercial wallet
        - Real substitute for agency sign-in programs, especially where public ownership matters
      - - CLEAR1
        - CLEAR1 official Medicare claim plus FedScoop Medicare reporting
        - Strong consumer biometric brand, account recovery, healthcare, and workforce positioning
        - Less public evidence of broad cross-agency credential reuse
        - Can coexist with ID.me and shrink wallet exclusivity in healthcare and recovery flows
      - - Agency or state-built status quo
        - IRS, SSA, and VA still frame identity through their own account journeys and MFA policy pages
        - Keeps control inside existing portals and policies
        - Often weaker on portability, reuse, and private-sector continuity
        - Slows any narrative that a single private wallet becomes the universal front door
      - - Socure public-sector motion
        - FedRAMP-authorized federal and state/local page with procurement vehicles
        - Strong fraud-reduction and AI decisioning pitch for agencies
        - No comparable consumer wallet reuse story on public surface
        - Threatens ID.me when fraud capture outranks credential portability
      - - API-first global vendors
        - Persona, Jumio, and Trulioo all market configurable onboarding, KYC, and global verification
        - Flexible workflows, cross-border coverage, and developer integration
        - Weaker public evidence of agency sign-in standardization
        - Matter most when modernization programs want components more than a branded wallet
      - - IAM and CIAM suites
        - Auth0 public CIAM surface and pricing
        - Easy trial, existing enterprise relationships, broad login feature set
        - Not designed as a reusable public-benefits wallet
        - Can absorb parts of the buying criteria and reduce willingness to add a dedicated identity layer
    notes: This table focuses on substitutes that can take all or part of the same budget. It mixes vendor and status-quo options because agencies do not always solve identity problems by replacing one commercial vendor with another.
