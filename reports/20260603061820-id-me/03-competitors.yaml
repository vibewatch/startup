  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Realized contract pricing, minimum commitments, and unit economics for ID.me versus CLEAR, Login.gov, and API-first rivals.
      whyItMatters: Public packaging differs materially across the field, so underwriting pricing power from list pages alone would be misleading.
      diligencePath: Request current customer contracts, recent RFP responses, and renewal pricing by federal, healthcare, and commercial segment.
      relatedQuestionRefs:
        - QP017
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: win-rates
      missingEvidence: Public win-loss, migration, and replacement data showing when ID.me displaces or loses to Persona, Socure, CLEAR, Login.gov, or Auth0.
      whyItMatters: Competitive moat claims are much stronger with observed replacement behavior than with product-page comparison alone.
      diligencePath: Ask management for top 20 competitive deal reviews, recent RFP outcomes, and named displacement case studies by vertical.
      relatedQuestionRefs:
        - QP021
      relatedTableRefs:
        - TP007
    - type: missing-source
      severity: material
      topic: medicare-scope-split
      missingEvidence: CMS workflow scope, user-routing logic, and volumes split between ID.me and CLEAR on Medicare.gov.
      whyItMatters: Medicare is the clearest live example of public-sector coexistence, so the exact scope split affects how durable ID.me's healthcare moat really is.
      diligencePath: Pull CMS procurement documents, implementation statements, and management commentary clarifying which journeys each vendor owns.
      relatedQuestionRefs:
        - QP023
      relatedTableRefs:
        - TP005
    - type: private-evidence-only
      severity: material
      topic: self-serve-segmentation
      missingEvidence: Evidence on whether ID.me loses SMB or mid-market opportunities to self-serve vendors before formal procurement begins.
      whyItMatters: Transparent product-led rivals may compress ID.me's expansion path even if they do not win the largest regulated accounts.
      diligencePath: Review funnel data by deal size, self-serve trial requests lost to competitors, and reasons for no-decision outcomes.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: renewal-retention
      missingEvidence: Renewal, churn, and reuse-frequency evidence by agency, healthcare customer, and commercial relying party.
      whyItMatters: Durable moat depends on retention and repeat usage, not just on landing new logos or announcing partnerships.
      diligencePath: Request cohort retention, net revenue retention, and agency-level reuse statistics tied to wallet or credential reuse.
      relatedQuestionRefs:
        - QP027
      relatedTableRefs:
        - TP006
