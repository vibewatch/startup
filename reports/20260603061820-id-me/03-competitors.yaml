  - id: capability-pricing-and-distribution
    title: Capability, pricing, and distribution comparisons
    body: >-
      Public evidence shows a sharp split between identity vendors built for developer adoption and vendors built for high-assurance enterprise or government deployments. Persona, Socure, and Auth0 all expose meaningful self-serve or entry pricing, which lowers the friction to test, integrate, and expand from small accounts. Socure and Persona also advertise configurable plans that move up into enterprise customization, while Auth0 bridges free and paid tiers into enterprise support. By contrast, Jumio, Trulioo, CLEAR1, and ID.me remain more demo- or quote-led on public surfaces. Distribution anchors differ just as much as pricing. ID.me's distribution is its reusable wallet and public-sector footprint; Auth0's is developer mindshare and Okta scale; CLEAR1's is an existing consumer biometric network; Socure's is fraud tooling breadth and FedRAMP-authorized public-sector packaging; and SheerID's is verified-audience commerce ROI. The result is that buyers are not only choosing capabilities. They are also choosing how quickly they can trial the product, how much pricing certainty they get upfront, and whether they need a reusable credential, a configurable API, or a trusted brand with existing user reach.
