companyProfile:
  summary: >-
    CoolIT Systems is a Calgary-based liquid cooling infrastructure company founded in 2001 and focused on direct-to-chip
    cooling systems for AI data centers and high-performance compute. The business evolved from consumer gaming thermal hardware
    into enterprise data center cooling, building product depth across cold plates, coolant distribution units, and engineering-led
    deployment support for hyperscale and HPC environments. KKR acquired the company in 2023 and exited through Ecolab's
    $4.75B cash acquisition in July 2026, which validated CoolIT as a critical AI-infrastructure supplier even though detailed
    standalone financial disclosures remain limited.
  foundedDate: '2001-01-01'
  foundingLocation: Calgary, Alberta, Canada
  headquarters: Calgary, Alberta, Canada
  productSummary: CoolIT sells direct-to-chip cold plates, rack and row liquid-cooling hardware, CHx and AHx coolant distribution units, and associated engineering, deployment, and maintenance support for AI and HPC data centers.
  customerFocus: Hyperscale cloud operators, HPC installations, AI compute clusters, and colocation data centers deploying dense accelerator infrastructure.
  businessModel: Hardware sales for cold plates and CDUs, paired with engineering services, deployment support, and maintenance/service contracts under multi-year customer programs.
  stage: acquired
  fundingStatus: Private/founder-backed historically, acquired by KKR in 2023 with Mubadala as co-investor, then acquired by Ecolab for $4.75B in July 2026.
