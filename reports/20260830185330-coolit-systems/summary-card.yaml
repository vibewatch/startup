  topStrengths:
    - >-
      CoolIT built a market-leading direct-to-chip liquid cooling stack spanning cold plates, CDUs, and engineering-led
      deployment support.
    - >-
      The 2026 Ecolab acquisition at $4.75B and roughly 29x NTM EBITDA validates exceptional strategic value in AI
      cooling infrastructure.
    - >-
      OEM and ecosystem alignment with NVIDIA, Intel, AMD, Dell, HPE, and Supermicro supports durable relevance in
      next-generation AI racks.
    - >-
      More than 300 deployed data center footprints and meaningful employee equity participation suggest real operating
      scale rather than lab-only traction.
  topRisks:
    - Integration into Ecolab introduces execution and cultural risk for a hardware-centric AI infrastructure business.
    - Revenue is likely concentrated among a small number of hyperscale and large compute customers.
    - >-
      Competing thermal architectures, especially immersion cooling and in-house hyperscaler design, could compress
      future share gains.
    - Public sources remain incomplete on standalone margin profile, renewal behavior, and post-close autonomy.
  unresolvedGaps:
