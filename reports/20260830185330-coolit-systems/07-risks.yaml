- id: operational-regulatory-and-legal-risk
  title: Operational, regulatory, and legal risk
  body: |-
    CoolIT manufacturing operations in Calgary depend on specialized inputs including copper heat exchangers, precision gear pumps, and specialty cooling fluids. Supply chain disruptions affecting these components could impact delivery timelines. US-China trade tensions and export controls on advanced manufacturing equipment add geopolitical risk to Asian component sourcing. Reuters and The Register documented significant supply chain pressure in data center hardware in 2026.

    EU Ecodesign Regulation 2025 creates compliance requirements for cooling equipment sold in Europe, affecting CoolIT European deployments. ESG reporting requirements and energy intensity regulations in the US, EU, and Singapore are increasing compliance burden. IEA data center power demand report confirms global regulatory scrutiny is intensifying.

    The 25-times CDU capacity expansion under KKR in three years creates risk of undisclosed quality control or warranty obligations. This scale of manufacturing ramp warrants due diligence on warranty claim history, yield rates, and quality control documentation. No public evidence of warranty or quality issues was found, but absence of evidence is not evidence of absence for a private company.

    CoolIT IP in coldplate design and CDU thermal management is a core competitive asset. McDermott Will and Emery analysis of industrial technology acquisitions confirms that IP transfer requires explicit patent and trade secret assignment at close. Post-acquisition IP ownership structure must be verified in data room. No patent infringement claims against CoolIT were identified in SEC filings or public court records.

    Labor market risk in technical cooling engineering and global professional services represents a growing operational challenge as CoolIT scales post-acquisition. Engineering headcount growth to support the $4B Ecolab target requires sustained hiring velocity.
