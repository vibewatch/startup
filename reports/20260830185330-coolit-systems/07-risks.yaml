  title: Risks
  summary: CoolIT risk profile is dominated by hyperscale customer concentration, Nvidia GPU architecture dependency, and Ecolab integration execution risk. Operational risks include supply chain exposure, rapid manufacturing scale-up quality risk, and competitive pressure from Vertiv and immersion cooling. No material adverse evidence was found. Thesis-break triggers center on Nvidia architectural change, hyperscale account loss, and Ecolab cost-cutting overriding AI cooling investment.
sections:
- id: severity-ranked-risk-register
  title: Severity-ranked risk register
  body: |-
    CoolIT Systems risk profile is shaped by three structural factors: its position as a critical supplier to hyperscale AI infrastructure, its transition from an independent PE-backed company to an Ecolab subsidiary, and its dependence on Nvidia GPU thermal architecture. The five highest-severity risks in descending order are: hyperscale customer concentration, Nvidia GPU architecture dependency, Ecolab integration execution, data center CapEx cycle pauses, and competitive displacement from Vertiv, Asetek, and immersion cooling alternatives.

    Customer concentration is both the most material financial risk and the least publicly quantified. Direct revenue from a small number of hyperscale operators means a single procurement decision by AWS or Azure could have outsized financial impact. This risk is inherent to the data center cooling market given the small number of large-scale operators but remains unmitigated without diversification.

    Nvidia GPU architecture dependency is a key technical risk. CoolIT coldplates are engineered to the thermal envelope of specific GPU die generations. Next-generation GPU architectural changes require re-engineering on Nvidia timelines, creating a customer-imposed product refresh cycle. CoolIT demonstrated GB200 NVLink rack compatibility, partially mitigating near-term risk.

    Vertiv and Schneider Electric entering direct liquid cooling at scale, alongside funded competitors Asetek and Liquidstack, represent increasing pricing pressure. The competitive landscape is materially more intense in 2026 than when KKR invested in 2023. No material adverse evidence of product failures, operational incidents, quality disputes, or legal proceedings was identified across reviewed sources.
