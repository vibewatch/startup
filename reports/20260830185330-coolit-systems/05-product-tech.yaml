  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability statistics
    missingEvidence: Field failure rates, RMA data, leakage incidence, and model-level uptime performance.
    whyItMatters: Public technical milestones do not substitute for population-level reliability evidence in mission-critical infrastructure.
    diligencePath: Request qualification reports, field-return logs, MTBF/MTTR data, and warranty claim summaries.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: material
    topic: formal certifications and software controls
    missingEvidence: Explicit certification packet and security/control documentation for monitoring or control layers.
    whyItMatters: Enterprise infrastructure buyers often require standardized compliance evidence in addition to thermal performance proof.
    diligencePath: Request ISO/SOC/environmental certification list, security architecture docs, and controller/software hardening materials.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: minor
    topic: developer or practitioner signal
    missingEvidence: Open developer ecosystem evidence comparable to software-company product-tech chapters.
    whyItMatters: This is a hardware infrastructure business, so product adoption is better observed through partner and customer proof than through open-source or package-download signals.
    diligencePath: Use partner engineering talks, OEM integration posts, or conference presentations as practitioner proxies if needed.
    relatedQuestionRefs:
    - QE023
