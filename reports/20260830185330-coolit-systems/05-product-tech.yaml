chapter:
  number: 5
  title: Product & Technology
  summary: CoolIT delivers a modular direct liquid cooling stack that starts at the chip with coldplates and extends through loops, manifolds, CDUs, and room-side integration, supported by co-design, validation, manufacturing, and field service. The company’s strongest public technical signals are AI-rack-specific CDUs, validated 15kW-class coldplates, and evidence of scaled testing and manufacturing, while the main diligence gaps are around formal certifications, reliability statistics, and software/security disclosures.
sections:
- id: product-definition
  title: Product Definition and Module Map
  body: 'In customer workflow terms, CoolIT sells a modular direct liquid cooling stack rather than a single component. The stack starts at the processor with coldplates, extends through coldplate loops and rack manifolds, and then connects into CDU and technology-cooling-system infrastructure that interfaces with the facility. That architecture lets the company participate at multiple points in the deployment rather than only at the chip socket. Importantly, the product is not just metal and plumbing: co-design, simulation, validation, manufacturing, commissioning, and field support are part of how the solution is delivered. This is why public materials repeatedly combine product pages with capability and service pages. Buyers are adopting a cooled workflow, not just a part number. That framing also explains why CoolIT’s sales motion looks closer to engineered infrastructure delivery than to commodity component distribution. The installed outcome is a stable thermal operating envelope for
    compute infrastructure, and every module exists in service of that workflow objective.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE027
  - CE028
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-and-dependencies
  title: Architecture, Integration, and Critical Dependencies
  body: 'CoolIT’s architecture is explicitly layered: chip-level heat exchange, intra-server distribution, rack-level coolant management, CDU control, and facility interface. That modularity is a product strength because it can be integrated into multiple server and rack designs, but it also creates multiple dependency points. Semiconductor roadmaps, especially around NVIDIA’s GB-series systems, shape the power-density envelope. Manufacturing precision matters because the company is managing high heat flux, seals, metals, and fluid paths at production scale. Coolant chemistry and warm-water operating assumptions also matter because real-world performance depends on more than lab thermals. The result is a product architecture that is differentiated, but also highly dependent on qualification and execution across the whole chain. In practice, the architecture is only as strong as the weakest transition between chip, rack, and facility layers. This is why design, validation, manufacturing,
    and support should be read as technical dependencies rather than as optional service wrappers.'
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE012
  - CE015
  - CE016
  tableRefs:
  - TE003
  figureRefs:
  - FE002
  - FE003
- id: technical-differentiation-and-maturity
  title: Technical Differentiation, Roadmap, and Maturity
  body: 'CoolIT’s public technical differentiation is stronger than generic AI-cooling marketing. The company cites validated single-phase coldplates beyond 15kW, heat-flux performance above 300 W/cm², OMNI all-metal coldplate architecture, Split-Flow design elements, and AI-era CDU sizing that maps directly to NVIDIA GB300 and GB200 rack configurations. These are specific engineering statements rather than only broad claims of efficiency. The roadmap also shows progression: a data-center pivot in 2012, OEM integrations in the mid-2010s, megawatt-class infrastructure and OMNI in 2024, and higher-density CDUs plus 15kW coldplates in 2026. Public case studies across supercomputing, research computing, and data-center environments support the view that the platform is commercially mature rather than a pilot-only technology. Few of these milestones would matter if they were purely lab artifacts, so deployment evidence is a key maturity signal. The cumulative pattern is a system platform moving
    up the density curve in step with the AI hardware cycle.'
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE033
  - CE034
  - CE035
  - CE029
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-quality-and-gaps
  title: Trust, Quality Controls, and Remaining Product Risks
  body: 'The strongest public trust signals are engineering-centric: testing and validation capability, scaled manufacturing, patent depth, and deployed case studies. Those are meaningful for hardware infrastructure because reliability problems are expensive and visible. Public materials are less clear on formal certifications, software security, privacy posture, or detailed quality statistics such as failure rates and RMA performance. That does not imply weak controls; it means the public proof is biased toward thermal engineering rather than toward standardized compliance disclosure. For diligence, the technology looks credible and advanced, but the underwriting of product quality still requires private evidence on field failure, coolant lifecycle behavior, and support performance across heterogeneous customer environments. The main remaining risk is therefore execution transparency, not a lack of visible technical ambition. The public record supports capability, yet it still leaves open
    the question of how that capability performs across the full installed base over time in production.'
  claimRefs:
  - CE013
  - CE014
  - CE026
  - CE030
  - CE031
  - CE032
  - CE036
  - CE037
