- id: named-customers-and-deployment-evidence
  title: Named customers and deployment evidence
  body: |-
    CoolIT named customer record is strongest in the HPC and scientific computing segments, where institutions publish detailed technical documentation of their infrastructure. The acquisition press release and subsequent analysis confirmed these named deployments and set the 300-facility milestone.

    atNorth, the Nordic data center operator based in Iceland, deployed CoolIT direct liquid cooling as a core component of its energy-efficient infrastructure offering. The atNorth case study is one of CoolIT most visible European deployments and demonstrates application in high-density colocation environments.

    Durham University COSMA supercomputer in the UK deployed CoolIT cooling as part of the DIRAC national HPC program. This deployment serves computational astrophysics workloads and represents CoolIT penetration into UK national research computing infrastructure.

    LLNL Livermore and TACC Frontera at the University of Texas Austin represent two of the largest US national laboratory and academic computing deployments. Computerome at the Danish Technical University further demonstrates European HPC market presence. ORNL Frontier, the worlds top-ranked supercomputer in 2022-2023, used liquid cooling architectures compatible with CoolIT CDU specifications.

    The Open Compute Project involvement demonstrates CoolIT alignment with open rack cooling standards that major hyperscalers including Meta, Microsoft, and Google use as procurement benchmarks. OCP certification validates CoolIT cooling for further hyperscale customer acquisition. CoolIT global professional services organization provides installation and commissioning teams in North America, Europe, and Asia Pacific, supporting the international customer base.
