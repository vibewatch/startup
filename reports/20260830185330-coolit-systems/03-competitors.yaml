- id: switching-cost-and-channel-power
  title: Switching Cost, Multi-Homing, and Channel Power
  body: The major commercial reality is that cooling is sticky once qualified. Switching a liquid-cooling partner affects not only the coldplate but also the loop, rack manifold, CDU, validation package, spares, and field-service procedures. That creates real lock-in after deployment. At the same time, specialists do not control the whole stack. OEMs, semiconductor ecosystem partners, and hyperscalers retain significant leverage because they decide who gets design access and whether solutions are standardized or multi-sourced. Buyers can probably multi-home across programs or facilities, but within a given qualified platform the switching cost is meaningfully higher than in most infrastructure software categories. That makes win rates, attach rates, and partner relationships more important than published feature checklists. It also means weak pricing transparency is not just a reporting nuisance; it hides where ecosystem power really sits. In many accounts, the commercial winner may be the
    vendor that reduces integration risk fastest rather than the one with the single most elegant component design, documentation set, or service motion.
  claimRefs:
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP029
  tableRefs:
