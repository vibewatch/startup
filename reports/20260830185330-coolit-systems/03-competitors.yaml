company:
  name: CoolIT Systems
chapter:
  number: 3
  title: Competitors
  summary: 'CoolIT competes in a layered landscape: direct-to-chip specialists such as Asetek, broad infrastructure incumbents such as Vertiv and Schneider Electric, OEM-integrated alternatives from Dell/HPE/Supermicro, immersion substitutes such as Submer, and internal build by hyperscalers. Its strongest differentiators appear to be AI-rack-specific direct liquid cooling performance, validation infrastructure, manufacturing scale, and global deployment support, but channel power and commoditization risk remain material.'
sections:
- id: landscape-map
  title: Landscape Across Direct Peers, Incumbents, Substitutes, and Internal Build
  body: 'CoolIT’s competitive set is wider than “other liquid cooling startups.” The most direct public peer is Asetek, which also markets direct-to-chip data-center cooling. Vertiv and Schneider Electric are different kinds of competitors: they approach the problem from the room, power, and facility side, with broader portfolios and enterprise account coverage. Dell, HPE, and Supermicro are not standalone direct competitors in every sale, but they hold crucial platform and channel power because buyers often want qualified liquid-cooled server configurations rather than a bag of components. Submer is the clearest substitute architecture competitor because immersion cooling can attack the same density problem from a different operating model. Finally, the largest hyperscalers can internalize portions of design and qualification, making internal build a persistent strategic threat. The practical implication is that CoolIT rarely competes only on component merit; it competes inside partner-controlled
    qualification and procurement systems, standards choices, and capacity commitments.'
