- id: differentiation
  title: Capability Differentiation and Route-to-Market
  body: CoolIT’s public differentiation is unusually tangible. Rather than generic “AI-ready” messaging, the company discloses validated 15kW single-phase coldplates, more than 300 W/cm² heat flux, and AI-era CDU pairings tied directly to NVIDIA GB-series rack formats. It also leans heavily into co-innovation, design engineering, and formal validation assets, which suggests its route to market depends on winning qualification programs rather than only pushing standardized SKUs. This matters because enterprise liquid cooling is rarely purchased as a commodity on day one; it is integrated into server, rack, and facility workflows. OEMs and incumbents can counter with breadth and account control, but CoolIT appears stronger on disclosed direct-to-chip specificity than many of them. That differentiation should matter most in dense new-build AI programs where buyers still care about serviceability, reliability, lifecycle support, and time to qualification.
  claimRefs:
  - CP008
  - CP009
  - CP010
  - CP011
  - CP015
