      - number: '8.2'
        title: 情景与可比估值
        blocks:
          - type: paragraph
            body: >-
              CoolIT-Ecolab 分部的乐观情景假设 AI 冷却市场到 2030 年以 25% CAGR 增长，CoolIT 到 2028 年收入达到 $1B+，Ecolab 分部到 2030 年达到 $2B，收购
              IRR 超过 20%。该情景需要 AI 集群建设速度持续、超大规模云账户留存成功，并有效扩张到新地域和工业细分市场。Nvidia GB200 NVLink 机架认证给乐观情景提供了近期收入可见度。


              基准情景采用与分析师估计一致的 20% CAGR，假设 CoolIT 到 2028 年收入达到 $800M、2030 年达到 $1.5B，IRR 为 12-15%。从 5 年维度看，这意味着收入从 $550M
              增至 $900M，估值倍数从 8.6 倍压缩到 6-7 倍；仍增厚价值，但前提是整合成功。悲观情景假设 2027 年超大规模云厂商暂停 CapEx、收入持平且 Ecolab 整合摩擦加大，导致收购 IRR
              低于资本成本。


              Vertiv 以 18-22 倍远期 EBITDA 和 4-5 倍远期收入交易，印证了 CoolIT 收购溢价。2025-2026 年数据中心 M&A 中，多笔 AI 基础设施资产交易达到 25-35 倍
              EBITDA，支撑本次交易倍数区间。Asetek 作为小市值上市液冷公司以 3-5 倍收入交易，印证了专业冷却相对于通用硬件的市场溢价。HPE 和 Dell 服务器硬件以 10-15 倍 EBITDA
              交易，印证了 AI 冷却专业公司相对于 OEM 渠道的溢价。


              CoolIT 300 多个部署点意味着每年 $100-200M 的经常性维护和升级收入，即便在悲观情景下也是有价值的基础业务。2025-2026 年 AI 基础设施行业吸引了品类溢价收购，说明并非 CoolIT
              单点高估，而是行业层面的重估。
