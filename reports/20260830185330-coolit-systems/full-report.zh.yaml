      - number: '8.3'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月收购交割后，CoolIT 已完全并入 Ecolab；截至报告日，不存在独立退出路径。投资逻辑现在是 Ecolab ECL 股票逻辑，不再是直接持有 CoolIT。KKR 已用 15
              倍回报锁定了战略价值；未来价值取决于 Ecolab 执行。


              针对 Ecolab 机构投资逻辑，关键尽调路径包括：要求提供 CoolIT FY2024-2025 经审计收入和 EBITDA，以确认增长轨迹；取得客户集中度明细，评估对超大规模云厂商的依赖；审阅产能放大 25
              倍后的 CDU 保修索赔历史；并从 FY2027 起跟踪 Ecolab 季度分部报告结构，观察 CoolIT 业绩透明度。


              投资逻辑破裂信号包括：Nvidia GB200 热架构变化使当前 CoolIT 冷板设计过时；12 个月内两个或更多主要超大规模云账户流失；Ecolab 在交割后 24 个月内减记 CoolIT 分部价值；或
              CEO Jason Waxman 离任。估值信心最大的缺口是缺少经审计的历史收入数据；Ecolab 给出的 $550M NTM 数字是前瞻性口径，尚未由审计报表确认。


              Ecolab 因收购增加的杠杆可控；按 Moodys 分析，Ecolab 的自由现金流状况可以承受约 $3-4B 新债。基于 AI 投资周期历史和整合风险基准率，悲观情景概率估计为 25%，基准情景
              55%，乐观情景 20%。将 Ecolab ECL 建模为 AI 基础设施代理标的的机构投资者，在分部估值中给 CoolIT 冷却业务分配每股 $70-90 价值。
