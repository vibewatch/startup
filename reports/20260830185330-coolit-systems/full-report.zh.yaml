  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同行、传统巨头、替代方案和内部自建构成的格局
        blocks:
          - type: paragraph
            body: >-
              CoolIT 的竞争集合比“其他液冷初创公司”更宽。最直接的公开同行是 Asetek，它也销售数据中心芯片直冷方案。Vertiv 和 Schneider Electric
              是另一类竞争者：它们从机房、供电和设施侧切入，产品组合更宽，企业客户覆盖更广。Dell、HPE 和 Supermicro
              并不是每一单中的独立直接竞争对手，但它们掌握关键平台和渠道权力，因为买方往往要的是已认证的液冷服务器配置，而不是一袋组件。Submer
              是最清晰的替代架构竞争者，因为浸没式冷却可以用另一种运营模式解决同一个密度问题。最后，最大的超大规模云厂商可以把部分设计和认证内化，使内部自建成为持续存在的战略威胁。实际含义是，CoolIT
              很少只靠组件优劣竞争；它是在伙伴控制的认证和采购系统、标准选择以及产能承诺里竞争。
