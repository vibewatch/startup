companyProfile:
  summary: >-
    CoolIT Systems 是一家总部位于 Calgary 的液冷基础设施公司，成立于 2001 年，聚焦 AI
    数据中心和高性能计算的芯片直冷系统。公司从消费级游戏散热硬件转向企业数据中心冷却，在冷板、冷却液分配单元，以及面向超大规模和 HPC 环境、由工程团队主导的部署支持上形成了产品深度。KKR 于 2023 年收购公司，并在 2026
    年 7 月通过 Ecolab 的 $4.75B 现金收购退出；这笔交易把 CoolIT 验证为关键 AI 基础设施供应商，尽管其详细独立财务披露仍然有限。
