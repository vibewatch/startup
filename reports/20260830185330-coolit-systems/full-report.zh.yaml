      - number: '7.2'
        title: 运营、监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              CoolIT 在 Calgary
              的制造运营依赖专用投入品，包括铜换热器、精密齿轮泵和专用冷却液。影响这些组件的供应链中断可能冲击交付时间。美中贸易紧张和先进制造设备出口管制，也为亚洲组件采购增加地缘政治风险。Reuters 和 The
              Register 记录了 2026 年数据中心硬件中的显著供应链压力。


              EU Ecodesign Regulation 2025 对在欧洲销售的冷却设备提出合规要求，影响 CoolIT 在欧洲的部署。美国、欧盟和新加坡的 ESG 报告要求与能耗强度监管正在加重合规负担。IEA
              数据中心电力需求报告确认，全球监管审视正在加剧。


              KKR 持有三年内把 CDU 产能扩张
              25x，带来未披露质量控制或保修义务风险。这种制造爬坡规模，需要尽调保修索赔历史、良率和质量控制文档。公开证据没有发现保修或质量问题，但对私营公司而言，没有证据不等于证据不存在。


              CoolIT 在冷板设计和 CDU 热管理上的 IP 是核心竞争资产。McDermott Will and Emery 对工业技术收购的分析确认，IP 转移需要在交割时明确专利和商业秘密转让。收购后 IP
              所有权结构必须在数据室核实。在 SEC 文件或公开法院记录中没有发现针对 CoolIT 的专利侵权主张。


              随着 CoolIT 在收购后扩张，技术冷却工程和全球专业服务的人才市场风险正成为更大的运营挑战。要支撑 Ecolab 的 $4B 目标，工程人员增长需要持续的招聘速度。
