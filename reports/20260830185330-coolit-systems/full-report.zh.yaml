  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险清单
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems 的风险画像由三项结构性因素塑造：它是超大规模 AI 基础设施的关键供应商，正从独立 PE 支持公司转为 Ecolab 子公司，并且依赖 Nvidia GPU
              热架构。按严重程度从高到低，五大风险是：超大规模客户集中度、Nvidia GPU 架构依赖、Ecolab 整合执行、数据中心 CapEx 周期暂停，以及来自 Vertiv、Asetek
              和浸没式冷却替代方案的竞争替代。


              客户集中度既是最重要的财务风险，也是公开量化最少的风险。来自少数超大规模运营商的直接收入意味着，AWS 或 Azure
              的单一采购决定就可能产生超比例财务影响。考虑到数据中心冷却市场大型运营商数量很少，这一风险内生存在；若没有多元化，它仍未被缓释。


              Nvidia GPU 架构依赖是一项关键技术风险。CoolIT 冷板按特定 GPU 芯片世代的热边界设计。下一代 GPU 架构变化要求 CoolIT 按 Nvidia
              时间表重新工程化，形成由客户强加的产品刷新周期。CoolIT 已展示 GB200 NVLink 机架兼容性，部分缓释近期风险。


              Vertiv 和 Schneider Electric 大规模进入直接液冷，再加上获得融资的 Asetek 和 Liquidstack，代表定价压力正在上升。2026 年的竞争格局明显比 KKR 2023
              年投资时更激烈。已审阅来源中没有发现产品故障、运营事故、质量纠纷或法律程序方面的重大负面证据。
