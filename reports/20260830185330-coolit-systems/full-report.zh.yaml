      - number: '6.3'
        title: 留存、扩张和集中度风险
        blocks:
          - type: paragraph
            body: >-
              CoolIT 的客户留存特征只能从商业模式和交易动态推断，而不是来自披露指标。公司不发布 NRR、GRR
              或流失率。按硬件生命周期模型，留存由长期维护合同、冷却液耗材，以及替换嵌入式热管理基础设施的切换成本驱动。来自 300 多个安装点的维护合同和服务协议，代表一条不断增长的经常性收入流，利润率高于硬件销售。


              客户扩张遵循可预测路径：先在单个机架或机列试点，证明性能和可靠性，再扩大到完整数据大厅覆盖。每个阶段都有专业服务介入，形成黏性关系和经常性收入流。KKR 报告的 2.18B kWh
              节能指标暗示，公司有可量化客户成果记录，可支持续约和扩张。相比风冷，客户获得 20% 至 30% 节能和 PUE 改善，从而降低总拥有成本。


              集中度风险是最重要的未解客户风险。来自五家或更少超大规模运营商的直接收入，可能占 CoolIT 总销售额的不成比例份额。AWS、Azure 或 GCP
              的任何采购转向都可能成为重大财务事件。已审阅来源中没有发现重大合同取消或质量故障。


              Ecolab 收购可能通过交叉销售进入工业、边缘和企业市场，从而分散客户基础。$4B 的 2030 年收入目标要求公司进入远超当前超大规模和 HPC 部署的客户板块；Ecolab
              现有全球工业客户关系构成自然的交叉销售机会。
