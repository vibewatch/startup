      - number: '3.2'
        title: 能力差异化和市场通路
        blocks:
          - type: paragraph
            body: >-
              CoolIT 的公开差异化少见地具体。公司不是泛泛喊“AI 就绪”，而是披露经验证的 15kW 单相冷板、超过 300 W/cm² 的热通量，以及直接绑定 NVIDIA GB 系列机架形态的 AI 时代 CDU
              搭配。公司也强调共同创新、设计工程和正式验证资产，这说明它的市场通路依赖赢下认证项目，而不是只推标准化 SKU。这很重要，因为企业液冷很少在第一天就像商品一样采购；它会被嵌入服务器、机架和设施流程。OEM
              和传统巨头可以用产品宽度和账户控制反击，但 CoolIT 在已披露的芯片直冷具体性上看起来强于其中许多对手。这种差异化最应在高密度新建 AI
              项目中发挥作用，因为买方仍然重视可维护性、可靠性、生命周期支持和认证速度。
