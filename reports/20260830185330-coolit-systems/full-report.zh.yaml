  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从 CoolIT 的规模和验证出发，串起风险与估值，落到「观察」建议的决策链。
    data:
      nodes:
        - id: scale
          label: |-
            规模：300+ 部署
            $550M NTM 收入
          type: input
        - id: proof
          label: |-
            验证：KKR 15x 回报
            Nvidia GB200 已认证
          type: input
        - id: market
          label: |-
            市场：20-25% CAGR
            2026 年 AI 冷却 $6-8B
          type: input
        - id: risk
          label: |-
            风险：超大规模客户集中
            Ecolab 整合
          type: process
        - id: valuation
          label: |-
            估值：29x EBITDA
            8.6x 收入
          type: process
        - id: rec
          label: |-
            观察
            Ecolab ECL
            中等信心
          type: output
      edges:
        - from: scale
          to: valuation
          label: 支撑溢价
        - from: proof
          to: valuation
          label: 验证护城河
        - from: market
          to: valuation
          label: 板块重估
        - from: valuation
          to: risk
          label: 溢价依赖执行
        - from: risk
          to: rec
          label: 净结论：观察
    approximationNotes: 推荐逻辑基于证据综合，并非量化模型。
    claimRefs:
      - CV004
      - CV001
      - CV007
