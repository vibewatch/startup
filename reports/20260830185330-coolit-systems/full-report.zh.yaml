  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值背景
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems 在 2026 年 7 月被 Ecolab 收购时，是质量最高的直接液冷资产。投资逻辑有四根支柱：AI 基础设施大趋势下极强的产品市场匹配、300
              多个全球部署点构成的切换成本护城河、冷板与 CDU 设计中的稀缺工程 IP，以及 Ecolab 在工业、超大规模云和国际市场加速渗透的战略能力。


              收购价格为 $4.75 billion、约 29 倍 NTM EBITDA，显著高于 Vertiv 公开市场可比公司的 18-22 倍远期 EBITDA 和 4-5
              倍远期收入。溢价背后有三点：兼具技术深度、部署规模和 OEM 关系并达到 CoolIT 水平的公司稀缺；2025-2026 多笔交易显示 AI 基础设施资产享有 25-40 倍 EBITDA
              的行业溢价；以及直接收购而非自建同等能力的战略价值。IDC MarketScape 将 CoolIT 列为领先的直接液冷供应商，Futurum Group 也独立验证了对收购溢价的这一解读。


              反向逻辑同样重要。29 倍 EBITDA 的估值写入了相当高的 AI 冷却增长假设。只要超大规模云厂商暂停 CapEx、Nvidia 架构变化让当前冷板过时，或 Ecolab
              整合失败，都会造成重大价值毁损。公告后 Ecolab 股价下跌 3-5%，一些投资者质疑一家工业公司能否在这一估值下管理高增长 AI 冷却业务。Moodys 将该收购标记为增量信用负面，原因是杠杆增加。


              新投资者已经无法直接投资 CoolIT 这家私人公司。投资逻辑现在转为 Ecolab ECL 股票逻辑。建议评级为观察：AI 冷却的结构性增长真实存在，但在如此高的溢价倍数下，要相信整合执行，还需要更多证据。
            claimRefs:
