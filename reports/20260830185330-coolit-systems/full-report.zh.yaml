      - number: '2.3'
        title: 买方分层、付款方和采用流程
        blocks:
          - type: paragraph
            body: >-
              价值最高的买方是超大规模云厂商和云规模 AI 运营商，因为它们部署最密集的 GPU 集群，也能用机群经济性证明前置冷却改造的合理性。Dell、HPE、Supermicro 等 OEM
              是最重要的市场通路中介，因为许多企业、甚至部分超大规模客户更偏好已认证的液冷服务器配置，而不是定制硬件集成。托管数据中心运营商是下一大板块：它们需要液冷能力来吸引 AI 租户，但不一定自己拥有算力。高校和政府
              HPC 站点像灯塔客户一样重要，因为它们验证性能和可靠性，但不是主要收入池。预算所有权通常横跨多个利益相关方——平台工程、基础设施采购、设施和运营——所以能把芯片、服务器、CDU
              和设施流程接起来的供应商更有优势。这种复杂性也解释了为什么规模化验证、部署和服务能力在这个市场具有商业重要性。
