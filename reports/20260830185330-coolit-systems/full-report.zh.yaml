      - number: '1.3'
        title: 所有权历史、融资背景和 2026 年退出
        blocks:
          - type: paragraph
            body: >-
              关于 CoolIT，最重要的资本市场事实是：截至本次运行日期，它已不再是独立的风投支持标的。KKR 于 2023 年通过 Global Impact Fund II 收购公司，Mubadala 共同参与；之后
              KKR 在 2026 年 3 月宣布、7 月完成的交易中把公司卖给 Ecolab。Ecolab 为一家私营基础设施公司披露了少见但很有价值的公开经济数据：签约时未来 12 个月销售额约 $550M，估值约为未来
              12 个月调整后 EBITDA 的 29x、2027 年调整后 EBITDA 的 24x。KKR 另行披露约 15x 回报，并强调员工广泛持股获得派现。合在一起看，这些披露说明 CoolIT
              已从私营成长型工业技术公司，转为一项战略基础设施资产；其价值建立在 AI 驱动的液冷需求、制造规模，以及更大水处理和化学平台内的经常性服务 / 交叉销售潜力之上。
