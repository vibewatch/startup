  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的评分框架，覆盖市场、验证、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场规模和增长
          value: 8
          unit: / 10
          detail: $6-8B 市场；20-25% CAGR；AI 顺风强劲
        - label: 技术护城河
          value: 8
          unit: / 10
          detail: IP 深度；OCP 验证；GB200 认证；22 年 R&D
        - label: 客户验证
          value: 7
          unit: / 10
          detail: 300 个部署；具名 HPC 客户；超大规模客户确认有限
        - label: 财务质量
          value: 5
          unit: / 10
          detail: $550M NTM 收入；约 $163M EBITDA；没有审计报表
        - label: 风险画像
          value: 5
          unit: / 10
          detail: 超大规模客户集中；依赖 Nvidia；整合风险
        - label: 估值纪律
          value: 5
          unit: / 10
          detail: 29x EBITDA 溢价；板块逻辑能支撑，但对执行要求高
        - label: 证据质量
          value: 7
          unit: / 10
          detail: 多个已验证来源；有一手监管文件；财务缺口仍在
    approximationNotes: KPI 分数是投委会框架下的定性评估，不是量化评级。
    claimRefs:
      - CV001
      - CV005
      - CV028
      - CV037
      - CV035
