            body: >-
              CoolIT 的具名客户记录在 HPC 和科学计算板块最强，因为这些机构会发布基础设施的详细技术文档。收购新闻稿和后续分析确认了这些具名部署，并给出 300 个设施这一里程碑。


              atNorth 是总部位于 Iceland 的北欧数据中心运营商，它把 CoolIT 直接液冷部署为节能基础设施方案的核心组件。atNorth 案例研究是 CoolIT
              最可见的欧洲部署之一，也展示了它在高密度托管环境中的应用。


              英国 Durham University COSMA 超级计算机作为 DIRAC 国家 HPC 项目的一部分部署了 CoolIT 冷却。该部署服务计算天体物理工作负载，也代表 CoolIT
              进入英国国家研究计算基础设施。


              LLNL Livermore 和 University of Texas Austin 的 TACC Frontera 代表美国最大的国家实验室和学术计算部署之一。Danish Technical
              University 的 Computerome 进一步展示了 CoolIT 在欧洲 HPC 市场的存在。ORNL Frontier 是 2022–2023 年全球排名第一的超级计算机，使用了与 CoolIT
              CDU 规格兼容的液冷架构。


              参与 Open Compute Project 显示 CoolIT 与开放机架冷却标准对齐；Meta、Microsoft 和 Google 等主要超大规模客户会把这些标准用作采购基准。OCP 认证验证了
              CoolIT 冷却方案，有助于进一步获得超大规模客户。CoolIT 的全球专业服务组织在北美、欧洲和亚太提供安装和调试团队，支撑其国际客户基础。
