  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层和规模
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems 服务一个多元且技术要求高的客户基础，横跨四个主要板块：超大规模云运营商、高性能计算研究机构、AI 聚焦数据中心和托管数据中心运营商。到 2026 年 Ecolab
              收购时，CoolIT 已在全球 300 多个数据中心部署液冷方案；对于一家专业热管理公司，这是异常大的装机基础。


              客户基础由全球最大的超大规模运营商锚定。AWS、Azure、GCP 和 Meta 都公开承诺为 AI 工作负载采用直接液冷；CoolIT 的产品定位，以及与 Dell、HPE、Supermicro 的 OEM
              关系，让它成为这些运营商部署中的强候选。保密的数据中心供应协议通常会阻止这些关系按名称公开披露。


              HPC 研究客户是公开记录最充分的板块。Durham University COSMA 集群、LLNL Livermore、UT Austin 的 TACC Frontera、Iceland 的
              atNorth、DTU 的 Computerome，以及多个欧洲科学计算中心，都是公开确认的 CoolIT 部署。这些机构在学术论文、新闻稿和设施公告中记录了自己的冷却基础设施。


              通过 Dell、HPE 和 Supermicro 认证项目形成的 OEM 渠道，为企业和云客户提供了嵌入式分销路径。启用 CoolIT 液冷的 Dell PowerEdge 服务器线，让企业数据中心无需与
              CoolIT 建立直接关系，就能通过标准服务器供应链采购。Nvidia A100 到 H100 再到 GB200 的 AI 集群升级周期，在 2022 至 2026 年推动同一批超大规模站点反复采购
              CoolIT。
