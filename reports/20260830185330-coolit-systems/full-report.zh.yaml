      - number: '4.2'
        title: 单位经济和资本结构
        blocks:
          - type: paragraph
            body: >-
              CoolIT 的单位经济特征符合一家已实现规模化的精密制造公司。专用冷却设备的硬件毛利率通常为 40% 至 55%，反映了定制冷板和 CDU 的工程复杂性、中等材料成本和专有制造工艺。CoolIT
              没有公开披露经审计利润率；这些数字来自 McKinsey 和分析师来源的行业可比项。


              从 2023 年初到 2026 年 7 月 Ecolab 交割，KKR 控股为公司引入了机构资本纪律，包括在 Calgary 扩大制造规模、建设现场服务基础设施，以及引入 Mubadala
              共同投资以获得中东数据中心市场入口。资本结构符合 PE 支持工业公司的典型形态：硬件销售产生强劲经营现金流，抵消制造 CapEx。三年 15x 回报确认了业务在持有期内一直能产生现金。


              收购倍数达到 29x NTM EBITDA，高于 Vertiv 通常的远期 EBITDA 交易区间，也高于多数可比工业技术收购，反映 Ecolab 为 AI 冷却敞口支付了溢价。S&P Global Market
              Intelligence 确认，随着超大规模客户建设推动战略收购，数据中心基础设施并购倍数在 2025 至 2026 年达到创纪录水平。公告后 Ecolab
              股价小幅下跌，因为部分投资者质疑一家工业公司是否为技术邻近资产付得过高。战略逻辑很清楚：Ecolab 计划到 2030 年打造 $4B 高科技业务，CoolIT 是基础。


              Mubadala 于 2023 年共同投资，为公司带来海湾资本，也释放出中东数据中心市场相关性的信号。没有或有对价或滚存股权的完整退出确认了干净的交易结构；根据 Ecolab 8-K，KKR 和 Mubadala
              在交割时完全变现持仓。按假设的 $316M 入场价计算，KKR 股权投资约 15x 回报，即便放在高增长工业技术里也很强。PitchBook 数据确认，相比可比工业 PE 退出，这一回报画像异常强。
