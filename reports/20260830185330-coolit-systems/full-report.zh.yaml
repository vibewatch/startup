      - number: '7.3'
        title: 缓释措施和论点破裂触发点
        blocks:
          - type: paragraph
            body: >-
              CoolIT 的主要风险缓释来自产品深度、装机基础带来的切换成本，以及 Ecolab 的收购逻辑。300 多个部署点形成护城河。通过 Dell、 HPE 和 Supermicro 建立的多厂商 OEM
              渠道，降低了对单一超大规模云运营商的依赖。CoolIT 在 GB200 NVLink 机架兼容性上的工程投入，部分对冲了 Nvidia 架构风险。Ecolab 承诺保持 CoolIT
              运营自主权，也部分缓释了整合执行风险。


              需要跟踪的关键风险指标包括：超大规模云厂商在季度业绩电话会中的 CapEx 指引、Nvidia GPU 路线图发布、Ecolab 自 FY2027 起按季度披露的冷却分部收入、竞争性 RFP 结果与 CoolIT
              胜率，以及欧盟服务器 Ecodesign 合规时间表。


              一旦出现以下投资逻辑破裂信号，应转向撤资建议：Nvidia 架构变化使现有冷板设计过时；两个或更多主要超大规模云账户流失给竞争对手；Ecolab 优先削减成本而非投资 AI 冷却；发现重大未披露保修负债；或
              CEO Jason Waxman 离任且没有合适继任者。Ecolab 总部与 CoolIT 工程领导层若战略错位，可能让人才流失超过典型并购后水平，并拖慢路线图执行。


              为细化风险评估，关键尽调问题包括：客户集中度收入明细；IP 所有权结构与转让文件；2023 至 2026 年 CDU 保修索赔历史；Ecolab 整合治理与 CoolIT 自主权契约；制造质量控制文件；以及
              Ecolab 自 FY2027 起的分部报告结构。
