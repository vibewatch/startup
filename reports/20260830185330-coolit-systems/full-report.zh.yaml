  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和替代方案
        blocks:
          - type: paragraph
            body: >-
              CoolIT
              并不均匀服务整个热管理市场。它最相关的市场是高密度计算的直接液冷基础设施：处理器冷板、液体回路、机架歧管、冷却液分配单元、二级回路接口，以及部署这些系统所需的工程和现场服务。这个定义有意排除了传统楼宇冷水机组、通用
              CRAC/CRAH 设备，以及分析师 TAM 幻灯片里常被算进广义“冷却”支出的大部分项目。它还把浸没式冷却视为替代架构，而不是 CoolIT 核心可服务市场的一部分，因为 CoolIT
              的产品栈围绕芯片直冷流程和可维护服务器设计展开。更窄的边界很重要，因为它把市场同真实采用触发因素对齐——GPU 功率密度、OEM
              认证、设施管路和服务要求——而不是同所有数据中心散热支出对齐。它也避免把相邻设施支出重复计算进来；这些支出可能在收购后让 Ecolab 受益，但本不属于独立 CoolIT 的硬件收入。
