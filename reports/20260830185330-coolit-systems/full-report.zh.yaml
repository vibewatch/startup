  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和财务规模
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems 采用资本设备收入模式：公司向 OEM
              服务器制造商和超大规模数据中心运营商直接销售液冷硬件，包括冷板回路、机架歧管和冷却液分配单元。收入以项目为导向，而非订阅制，并且在大型平台关系中存在有意义的集中度。


              最可靠的财务锚点来自 Ecolab 的收购新闻稿，其中称 CoolIT 预计未来 12 个月将产生约 $550M 销售额。这个数字显著高于早期分析师估计，也反映出过去两年 AI
              驱动的数据中心部署快速放量。Data Center Knowledge 和 Futurum Group 都独立引用了 29x NTM EBITDA 倍数，确认了收购溢价这一解读。


              收入构成没有公开拆分，但产品组合指向三条合理收入流：通过嵌入式认证项目，向 Dell、HPE、Supermicro 等服务器制造商销售 OEM
              硬件；面向超大规模云运营商的定制或交钥匙部署直销；以及安装、调试和持续维护合同等专业服务。与一次性硬件销售相比，专业服务板块有更高利润率潜力；考虑到 CoolIT
              拥有专门的全球专业服务组织，这一板块在收入中的占比似乎正在上升。


              CoolIT 定价按解决方案和项目确定。冷板或 CDU
              产品没有公开标价。项目按定制基础投标，反映了液冷部署的工程复杂性和设施特定性。这种定制模式限制了它与软件公司的可比性，但对一家服务超大规模基础设施的资本设备供应商来说是合适的。
