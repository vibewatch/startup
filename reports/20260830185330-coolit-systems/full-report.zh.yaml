      - number: '3.3'
        title: 切换成本、多供应商并行和渠道权力
        blocks:
          - type: paragraph
            body: >-
              核心商业现实是：冷却方案一旦通过认证就很黏。更换液冷伙伴影响的不只是冷板，还包括回路、机架歧管、CDU、验证包、备件和现场服务流程。部署之后，真实锁定就会形成。与此同时，专业厂商并不控制整条技术栈。OEM、半导体生态伙伴和超大规模云厂商仍有很大杠杆，因为它们决定谁能获得设计访问权，也决定方案是标准化还是多源供应。买方大概可以在项目或设施之间多供应商并行，但在某个已认证平台内，切换成本明显高于多数基础设施软件类别。因此，赢单率、绑定率和伙伴关系比公开功能清单更重要。定价透明度弱也不只是披露麻烦；它遮住了生态权力真正落点。很多账户里，商业赢家可能不是组件设计最优雅、文档最完整或服务动作最漂亮的供应商，而是最快降低集成风险的供应商。
