chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems 是一家总部位于 Alberta 省 Calgary 的加拿大液冷公司，现在称自己完全聚焦 AI
              和高性能计算基础设施。公司当前模式是模块化直接液冷硬件：定制处理器冷板、服务器级冷板回路、机架歧管、技术冷却系统管路和冷却液分配单元。公司把这些组件卖进 OEM 服务器平台、超大规模数据中心项目和前沿 HPC
              集群，而不是消费级改装市场。这个定位很关键，因为 CoolIT 卡在 AI 供应链的散热瓶颈上：GPU、CPU 和网络设备的热负载已经超过风冷的实际上限。公开材料一直把 CoolIT 描述为半导体公司、OEM
              和云规模运营商的共同开发伙伴，因此它更像基础设施供应商，而不是小众散热组件厂商。
