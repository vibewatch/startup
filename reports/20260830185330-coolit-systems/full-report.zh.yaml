      - number: '2.2'
        title: 规模测算视角、增长驱动和估计分歧
        blocks:
          - type: paragraph
            body: >-
              公开第三方市场估计支持一个巨大且快速扩张的机会，但也必须谨慎解读。Future Market Insights 单独测算 AI 数据中心液冷市场，估计 2026 年需求约 $3.7B，到 2036 年增至约
              $17.8B；MarketsandMarkets 和 360iResearch
              发布的则是更宽口径类别估计，包含更大的液冷宇宙。由此产生的差异不是噪音，而是反映了被计入对象定义不同。即便如此，各来源给出的战略结论一致：AI
              基础设施正在把冷却推向液冷，因为在最高机架密度下，风冷无法高效带走热量。CoolIT 自己的产品发布，尤其是围绕 GB200/GB300 时代机架设计的
              CDU，与这些第三方需求信号暗示的时间点相吻合。关键承销含义是，类别增长应锚定可部署机架密度和已认证项目，而不是页面上最宽泛的分析师数字。
