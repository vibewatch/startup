      - number: '4.3'
        title: 财务缺口和尽调问题
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems 作为 KKR 控股下的私营公司，没有发布经审计财务报表。公开记录中的收入、毛利率、EBITDA 和现金流，建立在收购定价和 Ecolab 自身投资者沟通之上，而非直接披露。$550M
              NTM 收入是最可靠的数据点，但它代表交割时的前瞻预测，不是经审计的历史数字。所有其他财务指标，包括毛利率、客户集中度、服务结构和 CapEx 强度，仍是推导估计或未解决缺口。


              最重要的财务尽调问题包括：FY2024 和 FY2025 经审计收入和毛利润，以确认增长轨迹；客户集中度披露，以量化对头部超大规模云厂商的依赖；服务与硬件收入拆分及各自利润率画像；大规模 CDU
              和冷板订单对应的制造 CapEx 强度和营运资本；以及 Ecolab 的整合计划，尤其是 CoolIT 是否会作为独立分部报告。CAC、NRR 和烧钱率指标未披露，使外部无法独立评估单位经济质量。


              2026 至 2030 年数据中心液冷市场 CAGR 超过 20%，是高溢价倍数的结构性基础。FMI、MarketsandMarkets 和 360iResearch 等多家分析机构确认，市场在 2026 年达到
              $6B–$8B，后续仍强劲增长。McKinsey 对 AI 数据中心经济性的分析进一步支撑冷却溢价论点。这些市场动态支撑了 Ecolab
              的交易逻辑和收购倍数。已审阅来源中没有发现违约、减记或合同纠纷等负面财务证据。
