      - number: '2.4'
        title: 约束、矛盾和剩余规模缺口
        blocks:
          - type: paragraph
            body: >-
              需求叙事很强，但采用并非没有摩擦。改造项目可能需要重做管路、重新设计机架和建立新的运营流程；芯片、冷却液、服务器和设施层之间的认证周期，也会在客户想上液冷时拖慢部署。市场报告还留下重要承销缺口：公开证据没有按
              OEM 组合、地域和部署类型拆出 CoolIT
              的精确可服务可获得市场，供应商赞助报告在范围上也差异很大。与此同时，液冷不会自动替代所有替代方案。更先进的风冷在较低密度下仍然可行；浸没式冷却也有真实但更窄的角色，尤其在运营商把极端密度放在传统可维护性之前时。正确的尽调结论是：这是一个很有吸引力的市场，但带有定义和执行层面的限定条件，不是毫无摩擦的绿地
              TAM。实践中，赢家应是那些缩短认证时间、吸收部署复杂性的供应商，而不是只发布最大 TAM 幻灯片的供应商。比较私营公司增长主张和公开基础设施市场叙事时，这层细微差别尤其重要。
