evidenceGaps:
  - type: missing-source
    severity: material
    topic: founders / TO002
    missingEvidence: Authoritative founder identities and original formation narrative before the current executive era.
    whyItMatters: >-
      Founder-market fit and continuity of technical leadership are central to judging how much of CoolIT’s advantage is
      institutional versus tied to original inventors.
    diligencePath: >-
      Request early corporate history materials, founder biographies, or pre-2010 archived company profiles from
      management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: board-governance / TO002
    missingEvidence: Current board roster, committee structure, and post-Ecolab integration governance lines.
    whyItMatters: >-
      Without board visibility it is difficult to assess control, oversight, and whether technical leadership retained
      meaningful authority after the sale.
    diligencePath: Obtain board list from management, transaction documents, or investor materials not published on the public site.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Exact employee count by geography and function as of mid-2026.
    whyItMatters: >-
      Headcount is a useful proxy for operating scale, engineering intensity, and post-acquisition integration
      complexity.
    diligencePath: Request current HR roster summary or employee-count disclosure from management or Ecolab integration materials.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: blocking
    topic: standalone-financials / TO003
    missingEvidence: Audited pre-acquisition revenue, gross margin, EBITDA, and customer-concentration figures for standalone CoolIT.
    whyItMatters: >-
      Ecolab disclosed forward-looking sales and EBITDA multiples, but underwriting revenue quality still requires
      standalone historical financial statements.
    diligencePath: Request QoE materials, audited statements, or lender/board decks from the transaction process.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: chronology gaps / TO004
    missingEvidence: Precise dates and participant lists for early financing and governance milestones before the 2023 KKR transaction.
    whyItMatters: >-
      The milestone table is strong on product and exit events but thinner on early capital formation and board change
      chronology.
    diligencePath: Review archived press releases, provincial filings, and management timelines for early board and financing events.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: SAM / SOM
    missingEvidence: >-
      Customer-level pipeline, OEM program mix, and attach rates needed to convert broad market estimates into a precise
      CoolIT SAM or SOM.
    whyItMatters: Valuation depends more on addressable share and conversion speed than on generic market-growth slides.
    diligencePath: Request revenue by buyer segment, OEM platform attach rate, and pipeline by geography and deployment type.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: OEM vs hyperscaler split
    missingEvidence: Share of bookings or revenue driven by OEM-qualified platforms versus direct hyperscaler programs.
    whyItMatters: The route-to-market mix changes gross margin, support burden, and concentration risk.
    diligencePath: Request cohort revenue by channel and top programs by deployment volume.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: pricing and win rates
    missingEvidence: >-
      Head-to-head pricing, discounting, attach rates, and win-loss data against Asetek, OEM, and incumbent
