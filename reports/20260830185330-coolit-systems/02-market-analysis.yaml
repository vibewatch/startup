  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI GPU rack density
    - Positive
    - Immediate 2026+
    - Pushes buyers beyond practical air-cooling limits
    - Quantify which customer programs exceed 100kW or 200kW per rack
  - - OEM catalog expansion
    - Positive
    - Near term
    - Makes liquid cooling easier for enterprise and cloud buyers to adopt
    - Map revenue split between qualified OEM programs and bespoke designs
  - - Energy efficiency / fan power reduction
    - Positive
    - Near term
    - Strengthens TCO case, especially for large clusters
    - Validate realized site-level savings versus vendor claims
  - - Heat reuse and warm-water operation
    - Positive
    - Medium term
    - Can improve economics and sustainability in Europe and select campuses
    - Check site-specific heat-reuse monetization
  - - Retrofit complexity
    - Negative
    - Immediate
    - Slows brownfield adoption and lengthens sales cycles
    - Estimate cost and downtime for representative retrofit types
  - - Qualification and reliability requirements
    - Negative
    - Immediate
    - Favors scaled vendors with validation capability but slows market conversion
    - Review failure-rate data and qualification backlog
  notes: The same forces that create market growth also determine which vendors can convert demand into revenue at acceptable deployment risk.
