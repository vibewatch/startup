callouts:
- calloutType: insight
  title: The real underwriting question is density conversion, not abstract TAM
  body: Market reports support a large opportunity, but CoolIT’s value depends more on how quickly dense GPU racks convert into qualified OEM and hyperscaler liquid-cooled deployments. Product evidence around CHx2000 and AHx240 suggests the company is aligned with that density transition.
  claimRefs:
  - CM003
  - CM009
  - CM010
  - CM029
- calloutType: risk
  title: Market estimates are directionally useful but definition-sensitive
  body: Because publishers disagree on whether they are measuring AI-specific liquid cooling or the broader liquid-cooling universe, market-size figures should be treated as lenses, not precise valuation inputs. Public evidence is also insufficient to isolate CoolIT’s exact SAM or OEM/hyperscaler mix.
  claimRefs:
  - CM032
  - CM033
  - CM034
  - CM035
