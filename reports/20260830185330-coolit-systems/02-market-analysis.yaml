    - OEM platform teams, hyperscalers
    - Core product surface for CoolIT
  - - Rack and row liquid distribution
    - CDUs, secondary loops, TCS hardware, controls
    - Whole-building chilled-water plant
    - Facilities, infrastructure engineering
    - Critical to scale from server to room deployment
  - - Deployment and support services
    - Qualification, commissioning, field service, maintenance
    - Generic staffing or outsourced FM unrelated to liquid cooling
    - Operations, procurement
