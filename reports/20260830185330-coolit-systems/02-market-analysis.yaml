  - - Substitutes and adjacent categories
    - Advanced air systems and immersion considered as alternatives
    - Do not count as CoolIT core served revenue
    - Architecture teams
    - Necessary to frame competitive boundary without overstating TAM
  notes: This boundary focuses on the direct liquid cooling stack that CoolIT actually sells into, while keeping substitute architectures explicit but outside the core served market.
