company:
  name: CoolIT Systems
chapter:
  number: 1
  title: Company Overview
  summary: CoolIT Systems is a Calgary-founded direct liquid cooling specialist that evolved from gaming-PC thermal products into a core supplier of AI and HPC coldplates, loops, manifolds, and CDUs for hyperscalers and OEMs. KKR and Mubadala acquired the company in 2023, expanded manufacturing and field-service scale aggressively, and agreed to sell it to Ecolab for approximately $4.75 billion in March 2026; the acquisition closed in July 2026.
sections:
- id: identity-and-focus
  title: Identity, Headquarters, and Business Model
  body: 'CoolIT Systems is a Canadian liquid-cooling company headquartered in Calgary, Alberta that now describes itself as fully focused on AI and high-performance compute infrastructure. The company’s current business model is modular direct liquid cooling hardware: custom processor coldplates, server-level coldplate loops, rack manifolds, technology cooling system piping, and coolant distribution units. These components are sold into OEM server platforms, hyperscaler data-center programs, and frontier HPC clusters rather than consumer retrofit markets. That positioning matters because it places CoolIT in the thermal bottleneck of the AI supply chain: at the point where GPUs, CPUs, and networking gear exceed the practical limits of air cooling. Public materials consistently frame CoolIT as a co-development partner for semiconductor companies, OEMs, and cloud-scale operators, which makes the company more comparable to infrastructure suppliers than to niche thermal-component vendors.'
