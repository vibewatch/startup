- id: scale-and-footprint
  title: Operating Scale, Manufacturing Footprint, and Customer Reach
  body: 'Public evidence suggests CoolIT reached meaningful industrial scale before the Ecolab close. KKR said the company expanded manufacturing to more than 300,000 square feet and increased CDU capacity 25x after 2023. A separate CoolIT manufacturing article said the new Starfield facility in Calgary spans 112,000 square feet and that Starfield plus the LiquidLab facilities represent nearly 150,000 square feet of dedicated manufacturing and R&D space. The same materials describe production and support coverage across more than 80 countries and installations at more than 300 data centers worldwide. That mix matters strategically: many liquid-cooling startups have compelling component designs but limited qualification capacity or field-service reach, whereas CoolIT appears to have built the deployment, test, and support infrastructure needed for hyperscaler and OEM programs. The public sales estimate from Ecolab supports the view that this was not merely a science project by 2026.'
  claimRefs:
  - CO006
