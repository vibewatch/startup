callouts:
- calloutType: insight
  title: Scaled infrastructure asset, not an early-stage cooling startup
  body: By the time of the Ecolab sale, CoolIT had already combined product breadth, OEM channel access, manufacturing scale, and global field support—traits that are uncommon in younger liquid-cooling startups and that help explain the strategic-multiple acquisition outcome.
  claimRefs:
  - CO022
  - CO023
  - CO029
  - CO007
  - CO006
- calloutType: risk
  title: Public transparency still lags operating scale
  body: Even with unusually helpful transaction disclosures, the public record still lacks exact headcount, full board visibility, founder identification, and standalone audited operating statements. Those gaps matter because they limit independent verification of concentration, incentives, and pre-acquisition quality of revenue.
  claimRefs:
  - CO048
  - CO018
  - CO019
  - CO049
