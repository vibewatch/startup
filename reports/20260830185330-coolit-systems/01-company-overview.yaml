- id: leadership-and-governance
  title: Leadership, Governance, and Disclosure Gaps
  body: CoolIT’s 2026 public materials provide a clear view of the current operating team but only a partial view of governance. Jason Waxman leads the company as CEO after senior Intel leadership roles and a stint as President of Fluke; Patrick McGinn oversees operations and commercial execution as President and COO; Kamal Mostafavi leads technology strategy as CTO; David Meffe, Ken Lau, and Paul O’Connor add commercial, ecosystem, and supply-chain depth from Intel, industrial technology, and procurement-heavy environments. This is a seasoned go-to-market and scaling team for an AI infrastructure supplier. The main governance gap is that current website materials do not clearly identify the original founders or the board roster. For diligence, that means the operating bench looks strong, but founder-market-fit analysis and board-control assessment remain incomplete without management materials or transaction documents beyond the public sale disclosures.
