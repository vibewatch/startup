- id: milestones-and-adverse-signals
  title: Milestones, Customer Proof, and Adverse Signals
  body: 'CoolIT’s public milestone record shows a company that migrated steadily up the compute stack: from gaming-PC liquid cooling in 2001, to patented graphics-card coldplates in 2009, to data-center direct liquid cooling in 2012, to OEM integrations with HPE and Dell in the mid-2010s, and then to exascale and AI-class systems in the 2020s. The customer-proof surface is broad rather than perfectly quantified, with case references spanning Frontier, Durham/DiRAC COSMA, atNorth, DTU, GWDG, Fraunhofer, and Frontera. The main adverse caveat is not lack of demand but disclosure opacity and transaction risk. Public materials do not provide audited standalone financials, precise headcount, or board detail, and the March 2026 sale materials carried standard but meaningful warnings around approvals, integration, and customer or supplier disruption. For diligence, CoolIT looks like a real scaled asset with strong technical and customer validation, but not a fully transparent one.'
