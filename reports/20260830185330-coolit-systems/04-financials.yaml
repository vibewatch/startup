  title: Financials
  summary: CoolIT Systems financial profile is anchored by Ecolab disclosure of approximately $550 million in NTM sales at the $4.75 billion acquisition close. At approximately 29 times NTM EBITDA, the acquisition reflects AI cooling market expectations. KKR generated approximately 15 times returns in three years. Revenue is estimated across OEM hardware, direct hyperscale, and professional services; detailed audited financials are not publicly available as a private company.
sections:
- id: revenue-model-and-financial-scale
  title: Revenue model and financial scale
  body: |-
    CoolIT Systems operates a capital equipment revenue model: the company sells direct liquid cooling hardware including coldplate loops, rack manifolds, and coolant distribution units to OEM server manufacturers and directly to hyperscale data center operators. Revenue is project-oriented rather than subscription-based, with meaningful concentration in large platform relationships.

    The most reliable financial anchor is Ecolab own acquisition press release, which stated that CoolIT is expected to generate approximately $550 million in sales over the next twelve months. That figure substantially exceeds earlier analyst estimates and reflects the rapid scale-up of AI-driven data center deployments over the prior two years. Data Center Knowledge and Futurum Group both independently cited the 29 times NTM EBITDA multiple, confirming the acquisition premium interpretation.

    The revenue composition is not publicly broken out, but the product portfolio implies three logical revenue streams: OEM hardware sold to server manufacturers like Dell, HPE, and Supermicro through embedded qualification programs; direct sales to hyperscale cloud operators for custom or turnkey deployments; and professional services including installation, commissioning, and ongoing maintenance contracts. The professional services segment carries higher margin potential than one-time hardware sales and appears to be a growing share of revenue given CoolIT dedicated global professional services organization.

    CoolIT pricing is solution-specific and project-oriented. No public list prices exist for coldplate or CDU products. Projects are bid on a custom basis, reflecting the engineering complexity and facility-specific nature of liquid cooling deployment. This bespoke model limits comparability to software businesses but is appropriate for a capital equipment supplier to hyperscale infrastructure.
