      - number: '2.3'
        title: Buyer Segments, Payers, and Adoption Workflow
        blocks:
          - type: paragraph
            body: >-
              The highest-value buyers are hyperscalers and cloud-scale AI operators because they deploy the densest GPU
              clusters and can justify up-front cooling redesign around fleet economics. OEMs such as Dell, HPE, and
              Supermicro are the most important route-to-market intermediaries because many enterprises and even some
              hyperscalers prefer qualified liquid-cooled server configurations rather than bespoke hardware
              integration. Colocation operators are the next major segment: they need liquid-cooling capability to
              attract AI tenants without necessarily owning the compute themselves. Academic and government HPC sites
              matter as lighthouse customers because they validate performance and reliability, but they are not the
              main revenue pool. Budget ownership usually spans multiple stakeholders—platform engineering,
              infrastructure procurement, facilities, and operations—so vendors that can bridge chip, server, CDU, and
              facility workflows gain an advantage. That complexity helps explain why scaled validation, deployment, and
              service capabilities are commercially important in this market.
            claimRefs:
