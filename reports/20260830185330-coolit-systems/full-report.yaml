      - number: '4.2'
        title: Unit economics and capital structure
        blocks:
          - type: paragraph
            body: >-
              CoolIT unit economics are consistent with a precision manufacturing company that has achieved scale.
              Hardware gross margins for specialized cooling equipment typically run 40 to 55 percent, reflecting the
              engineering complexity of custom coldplates and CDUs, moderate material cost, and proprietary
              manufacturing processes. CoolIT has not publicly disclosed audited margins; these are industry comparables
              from McKinsey and analyst sources.


              KKR ownership from early 2023 through the July 2026 Ecolab close introduced institutional capital
              discipline including manufacturing scale-up in Calgary, field service infrastructure buildout, and
              co-investment from Mubadala for Middle East data center market access. The capital structure was typical
              for PE-backed industrials, with strong operating cash flow from hardware sales offsetting manufacturing
              CapEx. The 15 times return in three years confirms the business was cash-generating throughout the hold
              period.


              At 29 times NTM EBITDA, the acquisition multiple exceeds Vertiv typical forward EBITDA trading range and
              most comparable industrial technology acquisitions, reflecting the premium Ecolab paid for AI cooling
              exposure. S&P Global Market Intelligence confirmed that data center infrastructure M&A multiples reached
              record levels in 2025 to 2026 as hyperscaler buildout drove strategic acquisitions. Ecolab share price
              declined modestly after announcement as some investors questioned whether an industrial company was
              overpaying for a tech-adjacent asset. The strategic rationale is clear: Ecolab is building a $4 billion
              high-tech business by 2030 with CoolIT as the foundation.


              Mubadala co-investment in 2023 provided Gulf capital and signaled Middle East data center market
              relevance. The full exit with no earn-out or rollover equity confirmed clean deal structure; KKR and
              Mubadala fully monetized their positions at closing per Ecolab 8-K. KKR equity investment return of
              approximately 15 times on the assumed $316 million entry is unusually strong even for high-growth
              industrial technology. PitchBook data confirms the unusually strong return profile relative to comparable
              industrial PE exits.
