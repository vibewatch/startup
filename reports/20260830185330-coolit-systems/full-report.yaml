      - number: '1.3'
        title: Ownership History, Funding Context, and 2026 Exit
        blocks:
          - type: paragraph
            body: >-
              The most important capital-market fact about CoolIT is that it is no longer an independent venture-backed
              target as of the run date. KKR acquired the business in 2023 through Global Impact Fund II alongside
              Mubadala, then sold it to Ecolab in a transaction announced in March 2026 and later closed in July 2026.
              Ecolab disclosed unusually helpful public economics for a private infrastructure company: approximately
              $550 million of next-twelve-month sales at signing and valuation multiples of about 29x next-twelve-month
              adjusted EBITDA and 24x 2027 adjusted EBITDA. KKR separately disclosed an approximately 15x return and
              highlighted a broad-based employee ownership payout. Together these disclosures imply that CoolIT
              transitioned from a private-growth industrial technology company to a strategic infrastructure asset whose
              value rested on AI-driven liquid-cooling demand, manufacturing scale, and recurring service/cross-sell
              potential inside a larger water-and-chemistry platform.
