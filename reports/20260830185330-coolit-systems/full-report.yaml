    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems is a Canadian liquid-cooling company headquartered in Calgary, Alberta that now describes
              itself as fully focused on AI and high-performance compute infrastructure. The company’s current business
              model is modular direct liquid cooling hardware: custom processor coldplates, server-level coldplate
              loops, rack manifolds, technology cooling system piping, and coolant distribution units. These components
              are sold into OEM server platforms, hyperscaler data-center programs, and frontier HPC clusters rather
              than consumer retrofit markets. That positioning matters because it places CoolIT in the thermal
              bottleneck of the AI supply chain: at the point where GPUs, CPUs, and networking gear exceed the practical
              limits of air cooling. Public materials consistently frame CoolIT as a co-development partner for
              semiconductor companies, OEMs, and cloud-scale operators, which makes the company more comparable to
              infrastructure suppliers than to niche thermal-component vendors.
