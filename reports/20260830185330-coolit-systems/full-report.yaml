        title: Milestones, Customer Proof, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              CoolIT’s public milestone record shows a company that migrated steadily up the compute stack: from
              gaming-PC liquid cooling in 2001, to patented graphics-card coldplates in 2009, to data-center direct
              liquid cooling in 2012, to OEM integrations with HPE and Dell in the mid-2010s, and then to exascale and
