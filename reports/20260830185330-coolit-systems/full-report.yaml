  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, CoolIT sells a modular direct liquid cooling stack rather than a single
              component. The stack starts at the processor with coldplates, extends through coldplate loops and rack
              manifolds, and then connects into CDU and technology-cooling-system infrastructure that interfaces with
              the facility. That architecture lets the company participate at multiple points in the deployment rather
              than only at the chip socket. Importantly, the product is not just metal and plumbing: co-design,
              simulation, validation, manufacturing, commissioning, and field support are part of how the solution is
              delivered. This is why public materials repeatedly combine product pages with capability and service
              pages. Buyers are adopting a cooled workflow, not just a part number. That framing also explains why
              CoolIT’s sales motion looks closer to engineered infrastructure delivery than to commodity component
              distribution. The installed outcome is a stable thermal operating envelope for compute infrastructure, and
              every module exists in service of that workflow objective.
