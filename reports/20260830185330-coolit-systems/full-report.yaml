              Public evidence suggests CoolIT reached meaningful industrial scale before the Ecolab close. KKR said the
              company expanded manufacturing to more than 300,000 square feet and increased CDU capacity 25x after 2023.
              A separate CoolIT manufacturing article said the new Starfield facility in Calgary spans 112,000 square
