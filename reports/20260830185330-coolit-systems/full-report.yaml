              not provide audited standalone financials, precise headcount, or board detail, and the March 2026 sale
              materials carried standard but meaningful warnings around approvals, integration, and customer or supplier
              disruption. For diligence, CoolIT looks like a real scaled asset with strong technical and customer
              validation, but not a fully transparent one.
