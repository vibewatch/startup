              CoolIT primary risk mitigations are product depth, installed base switching costs, and Ecolab acquisition
              rationale. The 300-plus deployment installed base creates moat. Multi-vendor OEM channel through Dell,
              HPE, and Supermicro reduces single-operator hyperscale dependency. CoolIT engineering investment in GB200
              NVLink rack compatibility partially mitigates Nvidia architecture risk. Ecolab stated commitment to CoolIT
              operational autonomy partially mitigates integration execution risk.


              Key monitoring indicators to track risk materializing include: hyperscaler CapEx guidance in quarterly
              earnings calls, Nvidia GPU roadmap announcements, Ecolab quarterly disclosure of cooling segment revenue
              from FY2027, competitive RFP outcomes and CoolIT win rate, and EU regulatory timeline for server Ecodesign
              compliance.


              Thesis-break triggers that would prompt disinvestment recommendation include: Nvidia architectural change
              making existing coldplate design obsolete; loss of two or more major hyperscale accounts to competitors;
              Ecolab prioritizing cost-cutting over AI cooling investment; discovery of material undisclosed warranty
              liabilities; or Jason Waxman CEO departure without suitable replacement. Strategic misalignment between
              Ecolab corporate and CoolIT engineering leadership could accelerate talent attrition beyond typical
              post-M&A norms and slow roadmap execution.


              Critical diligence asks to refine risk assessment: customer concentration revenue schedule; IP ownership
              structure and assignment documentation; CDU warranty claim history from 2023 to 2026; Ecolab integration
              governance and CoolIT autonomy covenants; manufacturing quality control documentation; and Ecolab segment
