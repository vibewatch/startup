      - number: '8.2'
        title: Scenarios and comparable valuation
        blocks:
          - type: paragraph
            body: >-
              The bull case for CoolIT-Ecolab segment assumes AI cooling market grows at 25 percent CAGR through 2030,
              CoolIT reaches $1B+ revenue by 2028, and Ecolab segment hits $2B by 2030, with acquisition IRR exceeding
              20 percent. This scenario requires continued AI cluster buildout velocity, successful hyperscale account
              retention, and effective expansion into new geographies and industrial segments. Nvidia GB200 NVLink rack
              qualification provides near-term revenue visibility for the bull case.


              The base case assumes 20 percent CAGR consistent with analyst estimates, CoolIT reaching $800M revenue by
              2028 and $1.5B by 2030, with 12-15 percent IRR. On a 5-year horizon this implies revenue growing from
              $550M to $900M and multiple compression from 8.6 times to 6-7 times; still value-accretive but requiring
              successful integration. Bear case assumes a hyperscaler CapEx pause in 2027, flat revenue, and Ecolab
              integration friction, resulting in acquisition IRR below cost of capital.


              Vertiv trades at 18-22 times forward EBITDA and 4-5 times forward revenue, confirming the CoolIT
              acquisition premium. Data center M&A in 2025-2026 saw multiple transactions at 25-35 times EBITDA for AI
              infrastructure assets, supporting the deal multiple range. Asetek, the small-cap public liquid cooling
              company, trades at 3-5 times revenue, confirming market premium for specialized cooling versus generic
              hardware. HPE and Dell server hardware trades at 10-15 times EBITDA, confirming AI cooling specialist
              premium versus OEM channels.


              CoolIT installed base of 300-plus deployments implies $100-200M annually in recurring maintenance and
              upgrade revenue, a valuable base business even in bear case scenarios. AI infrastructure sector attracted
              category premium acquisitions in 2025-2026, confirming this is not CoolIT-specific overvaluation but a
              sector-level re-rating.
