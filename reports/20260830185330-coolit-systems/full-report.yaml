      - number: '2.4'
        title: Constraints, Contradictions, and Remaining Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              The demand story is strong, but adoption is not frictionless. Retrofit projects can require plumbing
              rework, rack redesign, and new operational procedures, while qualification cycles across chip, coolant,
              server, and facility layers slow deployments even when customers want liquid cooling. Market reports also
              leave important underwriting gaps: public evidence does not isolate CoolIT’s precise serviceable available
              market by OEM mix, geography, and deployment type, and vendor-sponsored reports differ materially on
              scope. At the same time, liquid cooling does not automatically displace every substitute. Advanced air
              remains viable at lower densities, and immersion has a real if narrower role where operators prioritize
              extreme density over conventional serviceability. The correct diligence takeaway is a very attractive
              market with definitional and execution caveats, not a frictionless greenfield TAM. In practice, the
              winners should be the vendors that shorten qualification time and absorb deployment complexity rather than
              those that only publish the largest TAM slide. That nuance is especially important when comparing
              private-company growth claims to public infrastructure-market narratives.
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM030
              - CM034
              - CM035
              - CM033
              - CM040
          - type: table
            tableRef: TM004
            claimRefs:
              - CM008
              - CM013
              - CM021
              - CM022
              - CM023
              - CM030
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real underwriting question is density conversion, not abstract TAM
            body: >-
              Market reports support a large opportunity, but CoolIT’s value depends more on how quickly dense GPU racks
              convert into qualified OEM and hyperscaler liquid-cooled deployments. Product evidence around CHx2000 and
              AHx240 suggests the company is aligned with that density transition.
            calloutType: insight
            claimRefs:
