        title: Customer base segmentation and scale
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems serves a diverse and technically sophisticated customer base spanning four primary
              segments: hyperscale cloud operators, high-performance computing research institutions, AI-focused data
              centers, and colocation operators. As of the Ecolab acquisition in 2026, CoolIT had deployed liquid
              cooling solutions in more than 300 data centers globally, an unusually large installed base for a
              specialized thermal management company.


              The customer base is anchored by the largest hyperscale operators globally. AWS, Azure, GCP, and Meta have
              each made public commitments to direct liquid cooling for AI workloads, and CoolIT product positioning and
              OEM relationships with Dell, HPE, and Supermicro make it a strong candidate for each of these operators
              deployments. Confidential data center supply agreements typically prevent public disclosure of these
              relationships by name.


              HPC research customers are the most publicly documented segment. Durham University COSMA cluster, LLNL
              Livermore, TACC Frontera at UT Austin, atNorth Iceland, Computerome at DTU, and multiple European
              scientific computing centers are all publicly confirmed CoolIT deployments. These institutions have
              documented their cooling infrastructure in academic papers, press releases, and facility announcements.


              The OEM channel through Dell, HPE, and Supermicro qualification programs creates an embedded distribution
              route to enterprise and cloud customers. Dell PowerEdge server lines with CoolIT liquid cooling enabled
              allow enterprise data centers to procure through standard server supply chains without a direct
              relationship with CoolIT. The AI cluster upgrade cycle from Nvidia A100 to H100 to GB200 has driven repeat
              CoolIT procurement at same hyperscale sites from 2022 through 2026.
