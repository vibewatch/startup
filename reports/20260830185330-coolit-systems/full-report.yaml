  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and valuation context
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems represents the highest-quality direct liquid cooling franchise at the point of its July
              2026 Ecolab acquisition. The investment thesis rests on four pillars: exceptional product-market fit in
              the AI infrastructure megatrend, a 300-plus global deployment installed base creating switching cost moat,
              rare engineering IP in coldplate and CDU design, and Ecolab strategic capability to accelerate market
              penetration across industrial, hyperscale, and international verticals.


              At $4.75 billion and approximately 29 times NTM EBITDA, the acquisition multiple significantly exceeds
              Vertiv public market comps of 18-22 times forward EBITDA and 4-5 times forward revenue. This premium
              reflects: the scarcity of companies combining technology depth, deployment scale, and OEM relationships at
              CoolIT level; the AI infrastructure sector premiums of 25-40 times EBITDA observed across multiple
              2025-2026 transactions; and the strategic value of acquiring rather than building comparable capabilities.
              IDC MarketScape positions CoolIT as a leading direct liquid cooling vendor, and Futurum Group
              independently validated the acquisition premium interpretation.


              The anti-thesis is equally important. The 29 times EBITDA multiple encodes significant AI cooling growth
              assumptions. Any hyperscaler CapEx pause, Nvidia architectural change making current coldplates obsolete,
              or Ecolab integration failure would cause material value destruction. Ecolab share price declined 3-5
              percent post-announcement as some investors questioned whether an industrial company can manage a
              high-growth AI cooling business at this multiple. Moodys flagged the acquisition as incrementally
              credit-negative due to added leverage.


              For new investors, CoolIT is no longer an investable private opportunity. The thesis is now an Ecolab ECL
              stock thesis. The recommendation is Track: the AI cooling structural growth is real, but confidence in the
              integration execution at this premium multiple requires additional evidence.
            claimRefs:
