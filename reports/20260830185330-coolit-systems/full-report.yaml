      - number: '5.2'
        title: Architecture, Integration, and Critical Dependencies
        blocks:
          - type: paragraph
            body: >-
              CoolIT’s architecture is explicitly layered: chip-level heat exchange, intra-server distribution,
              rack-level coolant management, CDU control, and facility interface. That modularity is a product strength
              because it can be integrated into multiple server and rack designs, but it also creates multiple
              dependency points. Semiconductor roadmaps, especially around NVIDIA’s GB-series systems, shape the
              power-density envelope. Manufacturing precision matters because the company is managing high heat flux,
              seals, metals, and fluid paths at production scale. Coolant chemistry and warm-water operating assumptions
              also matter because real-world performance depends on more than lab thermals. The result is a product
              architecture that is differentiated, but also highly dependent on qualification and execution across the
              whole chain. In practice, the architecture is only as strong as the weakest transition between chip, rack,
              and facility layers. This is why design, validation, manufacturing, and support should be read as
              technical dependencies rather than as optional service wrappers.
