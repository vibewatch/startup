      - number: '4.3'
        title: Financial gaps and diligence asks
        blocks:
          - type: paragraph
            body: >-
              CoolIT Systems as a private company under KKR ownership did not publish audited financial statements. The
              public record on revenue, gross margin, EBITDA, and cash flow is built from acquisition pricing and Ecolab
              own investor communications rather than direct disclosure. The $550 million NTM revenue figure is the most
              reliable data point but represents a forward projection at close, not a historical audited figure. All
              other financial metrics including gross margin, customer concentration, services mix, and CapEx intensity
              remain derived estimates or unresolved gaps.


              The most important financial diligence asks are: audited revenue and gross profit for FY2024 and FY2025 to
              confirm growth trajectory; customer concentration disclosure to quantify dependency on the top
              hyperscalers; services versus hardware revenue split and associated margin profile; manufacturing CapEx
              intensity and working capital for large-scale CDU and coldplate orders; and Ecolab integration plan
              specifically regarding whether CoolIT will be reported as a distinct segment. The absence of disclosed
              CAC, NRR, and burn rate metrics prevents independent assessment of unit economics quality.


              The data center liquid cooling market CAGR of 20 percent plus in 2026 through 2030 is the structural basis
              for the premium multiple. Multiple analyst firms including FMI, MarketsandMarkets, and 360iResearch
              confirm that the market reached $6-8 billion in 2026 with strong growth ahead. McKinsey analysis of AI
              data center economics further supports the cooling premium thesis. These market dynamics underpinned both
              the Ecolab deal rationale and the acquisition multiple. No adverse financial evidence such as defaults,
              write-offs, or contract disputes was found in reviewed sources.
