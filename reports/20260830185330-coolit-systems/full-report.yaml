            body: >-
              CoolIT customer retention characteristics are inferred from the business model and deal dynamics rather
              than disclosed metrics. The company does not publish NRR, GRR, or churn rates. Based on the hardware
              lifecycle model, retention is driven by long-term maintenance contracts, cooling fluid consumables, and
              the switching cost of replacing embedded thermal management infrastructure. Maintenance contracts and
              service agreements from 300-plus installations represent a growing recurring revenue stream with margins
              above hardware sales.


              Customer expansion follows a predictable pattern: pilot deployment in a single rack or row, demonstrated
              performance and reliability, then expansion to full data hall coverage. Professional services involvement
              at each stage creates sticky relationships and recurring revenue streams. The 2.18 billion kWh energy
              savings metric from KKR reporting implies a track record of measurable customer outcomes that support
              renewal and expansion. Customers benefit from 20 to 30 percent energy savings and improved PUE versus air
              cooling, reducing total cost of ownership.


              Concentration risk is the most material unresolved customer risk. Direct revenue from five or fewer
              hyperscale operators likely accounts for a disproportionate share of CoolIT total sales. Any procurement
              shift by AWS, Azure, or GCP would be a material financial event. No major contract cancellations or
              quality failures were identified in reviewed sources.


              Ecolab acquisition potentially diversifies the customer base through cross-selling into industrial, edge,
              and enterprise markets. The $4 billion 2030 revenue target requires entry into customer segments well
              beyond current hyperscale and HPC deployments, and Ecolab existing global industrial customer
              relationships represent a natural cross-sell opportunity.
