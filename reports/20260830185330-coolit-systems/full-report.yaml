  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              CoolIT does not serve the whole thermal-management market equally. Its most relevant market is direct
              liquid cooling infrastructure for high-density compute: processor coldplates, liquid loops, rack
              manifolds, coolant distribution units, secondary-loop interfaces, and the engineering and field services
              needed to deploy them. That definition deliberately excludes conventional building chillers, generic
              CRAC/CRAH equipment, and much of the broad “cooling” spend often included in analyst TAM slides. It also
              treats immersion cooling as a substitute architecture rather than part of CoolIT’s core served market
              because CoolIT’s product stack centers on direct-to-chip workflows and serviceable server designs. This
              tighter boundary matters because it aligns the market with actual adoption triggers—GPU power density, OEM
              qualification, facility plumbing, and service requirements—rather than with all data-center thermal spend.
              It also prevents double counting of adjacent facility spend that may benefit Ecolab after the acquisition
              but would not have belonged to standalone CoolIT hardware revenue.
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM036
              - CM037
