      - number: '2.2'
        title: Sizing Lenses, Growth Drivers, and Estimate Spread
        blocks:
          - type: paragraph
            body: >-
              Public third-party market estimates support a large and rapidly expanding opportunity, but they also
              require caution. Future Market Insights isolates the AI data-center liquid cooling market and estimates
              about $3.7 billion in 2026 demand growing to roughly $17.8 billion by 2036, while MarketsandMarkets and
              360iResearch publish broader category estimates that include a wider liquid-cooling universe. The
              resulting variance is not noise; it reflects different definitions of what is being counted. Even so, the
              strategic conclusion is consistent across sources: AI infrastructure is forcing a shift toward liquid
              cooling because air cannot efficiently remove heat at the highest rack densities. CoolIT’s own product
              announcements, especially CDUs designed around GB200/GB300-era racks, line up with the timing implied by
              these third-party demand signals. The key underwriting implication is that category growth should be
              anchored to deployable rack density and qualified programs, not to the broadest analyst number on the
              page.
