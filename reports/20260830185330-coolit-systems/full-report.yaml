              Because publishers disagree on whether they are measuring AI-specific liquid cooling or the broader
              liquid-cooling universe, market-size figures should be treated as lenses, not precise valuation inputs.
              Public evidence is also insufficient to isolate CoolIT’s exact SAM or OEM/hyperscaler mix.
            calloutType: risk
