      - number: '8.3'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              CoolIT is fully integrated into Ecolab post-acquisition close in July 2026; no independent exit path
              exists as of the report date. Investment thesis is now an Ecolab ECL stock thesis, not a direct CoolIT
              position. The strategic value was captured by KKR at 15 times return; future value depends on Ecolab
              execution.


              For the Ecolab institutional thesis, the critical due diligence path includes: requesting audited CoolIT
              revenue and EBITDA for FY2024-2025 to confirm growth trajectory; obtaining customer concentration schedule
              to assess hyperscale dependency; reviewing CDU warranty claim history from the 25-times capacity scale-up;
              and monitoring Ecolab quarterly segment reporting structure from FY2027 for transparency on CoolIT
              performance.


              Thesis-break triggers include: Nvidia GB200 thermal architecture change obsoleting current CoolIT
              coldplate design; loss of two or more major hyperscale accounts in 12 months; Ecolab writing down CoolIT
              segment value within 24 months of close; or Jason Waxman CEO departure. The largest gap in valuation
              confidence is the absence of audited historical revenue data; the $550M NTM figure from Ecolab is
              forward-looking and not confirmed by audited statements.


              Ecolab leverage from the acquisition is manageable at approximately $3-4B in new debt given Ecolab free
              cash flow profile per Moodys analysis. Bear case probability is estimated at 25 percent based on AI
              investment cycle history and integration risk base rates; base case at 55 percent; bull at 20 percent.
              Institutional investors modeling Ecolab ECL as an AI infrastructure proxy assign $70-90 per share of value
              to CoolIT cooling segment in sum-of-parts analysis.
