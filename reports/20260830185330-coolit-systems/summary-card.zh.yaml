  topStrengths:
    - CoolIT 搭出市场领先的芯片直连液冷栈，覆盖冷板、CDU，以及由工程团队牵头的部署支持。
    - 2026 年 Ecolab 以 $4.75B、约 29x NTM EBITDA 收购，验证了 AI 冷却基础设施的高战略价值。
    - 与 NVIDIA、Intel、AMD、Dell、HPE、Supermicro 等 OEM 和生态方对齐，支撑其在下一代 AI 机架中的长期相关性。
    - 已部署超过 300 个数据中心足迹，员工股权参与也有实质规模，说明 CoolIT 有真实运营规模，不只是实验室牵引力。
  topRisks:
    - 并入 Ecolab 后，硬件属性强的 AI 基础设施业务会面临执行和文化风险。
    - 收入很可能集中在少数超大规模云厂商和大型算力客户手里。
    - 竞争性热管理架构，尤其是浸没式冷却和超大规模云厂商自研设计，可能压缩后续份额提升。
    - 公开资料仍未补齐独立利润率、续约行为和交割后自主权。
  unresolvedGaps:
    - 经审计独立收入结构、毛利率和 EBITDA 桥接仍未公开。
    - 头部超大规模云客户的集中度和合同层面的耐久性仍未披露。
    - 收购后在 Ecolab 内部的组织架构、决策权和留任结果还不透明。
    - 保留材料尚未完整说明累计节能的精确计算方法和单次部署经济性。
