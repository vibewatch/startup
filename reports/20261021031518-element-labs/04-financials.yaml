callouts:
  - calloutType: "risk"
    title: "Funding raised is not runway"
    body: >-
      The reported $400.0 million cumulative financing cannot be treated as cash available.
      Underwriting requires current cash, restricted cash, debt and lien terms, monthly burn,
      committed tape-out or production spend, and milestone timing.
    claimRefs: [CI001, CI002, CI011, CI015]
