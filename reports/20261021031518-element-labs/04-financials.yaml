    claimRefs: [CI008, CI010]
  - id: "TI003"
    title: "Unit economics and capital-adequacy checklist"
    columns:
      - "Metric"
      - "Public value"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Revenue / ARR", null, "Unavailable", "Establishes whether financing has converted into commercial traction", "Monthly recognized revenue, bookings, backlog, and ARR reconciliation"]
      - ["Realized ASP and gross margin", null, "Unavailable", "Tests pricing power against fabrication, packaging, memory, and support cost", "Customer-level ASP, standard cost, yield, warranty, and gross-margin bridge"]
      - ["Customer acquisition cost / payback / sales cycle", null, "Unavailable", "Shows whether design-win effort can scale efficiently", "Pipeline cohort, sales expense, conversion, cycle, and payback"]
      - ["Utilization and buyer TCO", null, "Unavailable for Element", "Low or volatile inference utilization can change energy and cost economics", "Workload benchmarks at idle, average, and peak utilization with full system cost"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines whether current capital reaches tape-out, qualification, and production milestones", "Bank statements, 18-month cash forecast, debt schedule, and milestone-triggered financing plan"]
    notes: "All Element-specific values are null because the assigned evidence does not disclose them; the utilization row uses LBNL only as an external sensitivity, not an Element estimate."
    claimRefs: [CI009, CI010, CI011, CI012, CI015]
