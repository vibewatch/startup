        - Geography-dependent and unquantified
        - Power scarcity, interconnection delay, or cooling limits block deployment
        - Medium-high
        - Validate site power, cooling, utilization, and efficiency at system level
        - Medium-high under Berkeley Lab demand scenarios
      - - Capital and specialist talent
        - Existing and future investors; semiconductor labor market
        - Fund design, tape-out, software, qualification, and working capital
        - Runway and hiring plan undisclosed
        - Better-funded rivals outspend Element before production proof
        - High
        - Milestone-based financing plan and critical-role retention review
        - High because $50 million raised does not establish cash available or runway
