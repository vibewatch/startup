  topStrengths:
    - 创始人多次参与半导体公司的创立与退出，履历包括 Habana Labs、Annapurna Labs 和 Galileo。
    - 独立报道显示投资人支持力度较大，且公司在 2026 年获得了 $300 million-$400 million 融资。
    - 其推理方案针对延迟、带宽、利用率和数据中心功耗等真实约束。
  topRisks:
    - 留存的来源没有证明 Element 已交付产品、提供可复现的基准测试、公布生产客户或取得部署结果。
    - 收入、毛利率、现金消耗、现金余额、资金可支撑期限、融资条款和客户集中度仍未披露。
    - 量产取决于芯片、软件、先进封装、客户认证和高资本投入扩张能否同步落地。
    - 据报道，above-$4-billion 估值明显跑在公开经营证据能够支撑的投资判断之前。
  unresolvedGaps:
    - 获取一手融资条款、完全摊薄后的资本结构表、现金、现金消耗、债务与留置权条款，以及按里程碑计算的资金可支撑期限。
    - 核实已点名的付费部署、从试点转入生产的转化、签约量、留存率和客户集中度。
    - 对照可用替代方案，复核涵盖延迟、吞吐量、功耗、软件成熟度和总成本的可复现工作负载基准测试。
    - 确认晶圆厂、制程节点、封装产能分配、良率、认证时间表和第二供应源规划。
