      - ["Management software", "Schedules workloads and exposes the system to applications", "Compiler, runtime, frameworks, APIs, telemetry, and updates", "No public developer surface or compatibility evidence"]
      - ["Compute silicon", "Executes inference and general processing", "Foundry, packaging, memory, firmware, and board qualification", "No disclosed silicon status, specifications, yield, or supply plan"]
      - ["Communications silicon", "Moves data within and between systems", "Protocols, switching, interconnect, and topology", "Reported scope is not backed by public product documentation"]
      - ["Server and facility", "Supplies power, cooling, networking, and operational capacity", "OEM design, rack integration, utilization, and service operations", "Idle power and peak provisioning can weaken energy economics"]
      - ["Trust and support", "Protects workloads and sustains production service", "Secure development, privacy, compliance, quality, status, and support controls", "No public security, certification, incident, reliability, or SLA evidence"]
    notes: "Architecture is a diligence model based on reported scope and independent data-center research, not a verified Element design."
    claimRefs: ["CE002", "CE005", "CE006", "CE009", "CE011", "CE013"]
