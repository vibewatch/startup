callouts:
  - calloutType: "risk"
    title: "Evidence maturity trails reported system breadth"
    body: >-
      The public proposition spans several hard semiconductor and software layers, while the
      assigned evidence contains no product documentation, benchmarks, release artifacts, or
      named deployment proof.
    claimRefs: ["CE004", "CE005", "CE012"]
  - calloutType: "insight"
    title: "Energy efficiency must be tested at observed utilization"
    body: >-
      Inference economics depend on peak provisioning, idle power, and actual utilization, so
      chip efficiency alone cannot establish lower system energy or cost.
    claimRefs: ["CE009", "CE010"]
