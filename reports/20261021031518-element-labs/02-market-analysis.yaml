      - ["Cloud or hosting provider", "Capacity and product leader", "Fleet and serving teams", "Cloud operator", "Capacity plan, validate system, expose service", "Infrastructure capex owner", "Differentiated inference economics at utilization"]
      - ["Regulated or data-local application", "Business and security sponsor", "Application and ML teams", "Enterprise business unit", "Privacy review, local pilot, production approval", "Business unit with security approval", "Locality or confidentiality requirement"]
      - ["Existing GPU estate", "Infrastructure architecture team", "Operations and developers", "Enterprise or service provider", "Compare porting cost and total cost of ownership", "Infrastructure budget", "Challenger advantage exceeds switching cost"]
      - ["AI application portfolio", "Product or transformation leader", "Developers and operations", "Application owner", "Prove ROI, manage risk, scale successful use cases", "Product or transformation budget", "Repeatable business value beyond proof of concept"]
    notes: "Roles and adoption sequence are inferred from the retained company-positioning, incumbent-product, market-demand, and adoption-risk evidence; no public Element customer procurement record was available."
    claimRefs: ["CM002", "CM011", "CM012", "CM013", "CM014", "CM015", "CM016"]
