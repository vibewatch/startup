      - ["Other novel accelerators", "Unknown in assigned sources", "Hardware, cloud, or system packaging varies", "Architecture and software stack differ by vendor", "Normalize latency, throughput, power, software labor, and capacity utilization"]
      - ["Internal heterogeneous build", "No single unit price", "Capex, cloud, integration, and operations", "Buyer-selected components and software", "Include migration, idle capacity, engineering labor, and lock-in risk"]
    notes: >-
      The assigned evidence contains no realized customer contract or like-for-like quote.
      Relative vendor TCO statements are preserved as claims, not converted into dollar prices.
