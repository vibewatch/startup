        - label: SambaNova
          x: 4
          y: 4
          detail: Independently measured prior generation plus named SN50 customer and financing.
        - label: Cerebras
          x: 4
          y: 3
          detail: Independently measured architecture; commercialization evidence is limited here.
        - label: Groq
          x: 4
          y: 3
          detail: Independently measured architecture; commercialization evidence is limited here.
        - label: Intel Gaudi
          x: 4
          y: 2
          detail: Independently measured stack but adverse roadmap and customer evidence.
    approximationNotes: >-
      Analyst-authored ordinal scale from 1 (least evidence) to 5 (most evidence). The x-axis is
      retained public performance comparability and the y-axis is retained commercialization
      proof. Scores are not benchmark results, market shares, or forecasts.
    claimRefs: [CP003, CP004, CP006, CP008, CP011, CP012, CP016]
