        blocks:
          - type: paragraph
            body: >-
              Globes 在 2026 年 6 月估计 Caesarea 和 Tel Aviv 两地共有 350 名员工，另有数百名外包人员；但该数字未经公司确认，承包商也不应计入员工人数。留存来源没有披露 Element
              Labs 的收入、客户数、具名量产客户、部署量、毛利率、现金消耗或现金跑道。竞争证据抬高了验证门槛：SambaNova 已宣布首个具名 SN50 部署和 $350 million 融资，而 Element
              被报道的云合作关系仍属推测。需求论点真实存在，但并非没有风险。Berkeley Lab 预计美国数据中心用电量将大幅上升；Gartner 则预计许多代理式 AI
              项目会因成本、价值和控制问题被取消。因此，Element 需要工作负载层面的性能、部署和经济性证据，才能支撑报道中的估值。
