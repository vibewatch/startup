          label: 市场需求
          detail: 推理增长与数据中心电力压力
        - id: founder-precedent
          label: 创始人先例
          detail: 多次半导体融资与退出经历
        - id: benchmark-gate
          label: 基准门槛
          detail: 在公认的可用性框架下，未保留 Element 的结果
        - id: commercial-gate
          label: 商业门槛
          detail: 收入、量产客户、利润率和留存率均未披露
        - id: terms-gate
          label: 条款门槛
          detail: 股权结构表、优先权安排、稀释情况和现金需求均未披露
        - id: recommendation
          label: 建议
          detail: 继续研究；仅在里程碑触发条件下入场
    approximationNotes: 这条链路是定性且有顺序的；它不会基于无法获得的经营数据赋予概率、转化率或估值。
