        - 经审计财务数据，以及独立验证的客户和基准证据
      - - 风险评级
        - 高
        - 半导体执行、需求转化、软件采用、稀释和退出风险仍未定价。
        - 里程碑完成情况，加上合同客户和供应链证明
      - - 估值立场
        - 看起来昂贵 / 缺乏依据
        - 在未披露收入、利润率或量产客户分母的情况下，据报道估值已超过 $4B。
        - 站得住脚的运营模型，以及按相匹配阶段和经济性开展的可比交易分析
      - - 目标回报 / 持有 / 退出
        - 公开证据不足以支持
        - 入场持股、优先权、稀释、现金需求和退出时间均未披露。
