      - number: '3.2'
        title: 性能与软件可比性
        blocks:
          - type: paragraph
            body: >-
              竞争性能不能压缩成一个峰值速度数字。MLCommons
              将可比的封闭提交与开放提交分开，也区分可用、预览和研究系统。独立研究者同样发现，最佳平台会随批量大小、序列长度和模型大小而变化。他们的测量显示，多种替代加速器存在空闲功耗惩罚，编译时间也可能远超 GPU
              基线，因此利用率和软件成熟度都是经济比较的一部分。按这一标准，留存的 Element 证据没有可复现提交或工作负载结果。这不证明 Element
              没有高性能产品，只说明公开记录尚不能验证其相对时延、吞吐量、能耗或可编程性。下文任何定位评分，衡量的都是证据可见度和商业化证明，而非硬件能力。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
