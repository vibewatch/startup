        title: 领导层、创始人匹配度与治理
        blocks:
          - type: paragraph
            body: >-
              这组创始人创办半导体公司并成功退出的经历异常强。Willenz 与 Galileo、Annapurna Labs、Habana Labs 及其他基础设施投资有关；Dahan 和 Halutz 此前曾在
              PrimeSense 工作，之后共同创办 Habana。这段经历可能帮助招聘、融资、获得晶圆厂资源和建立战略引荐，但不能证明当前的执行质量或治理水平。关于 Habana 被 Intel
              吸收的报道提到客户失望、产品取消、官僚主义以及原团队大部分成员离开。这些事件发生在 Intel 收购之后，不能全部归因于 Element
              创始人；但也因此，当前董事会构成、决策权、继任安排和技术问责证据都必须作为尽调重点。
