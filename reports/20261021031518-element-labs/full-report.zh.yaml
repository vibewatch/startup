  - id: FR001
    title: 基于可得公开证据的剩余风险热力图
    type: matrix
    summary: 商业化转化、封装、利用率经济性和路线图执行仍是最高的剩余暴露，因为公开的缓解证据有限。
    data:
      columns:
        - 影响
        - 可能性信号
        - 缓解措施成熟度
        - 剩余风险
      rows:
        - label: 量产转化
          values:
            - text: 高
              detail: 收入节奏取决于付费量产采用。
            - text: 中高
              detail: Deloitte 报告称，受调查企业中试点规模化转化有限。
            - text: 未披露
              detail: 指定证据中没有出现已点名的 Element 量产部署。
            - text: 高
              detail: 以付费部署和验收数据补足。
        - label: 先进封装
          values:
            - text: 高
              detail: 延迟可能推迟认证和量产计划。
            - text: 2026 年前均为高
              detail: TrendForce 报告称，生态仍存在供需缺口。
            - text: 未披露
              detail: 该证据池中没有 Element 产能分配和第二供应源计划的公开信息。
            - text: 高
              detail: 以合同、良率和认证里程碑补足。
        - label: 推理利用率经济性
          values:
            - text: 高
              detail: 利用率影响客户 ROI 和交付系统成本。
            - text: 中高
              detail: Berkeley Lab 假设利用率较低，并报告实测证据有限。
            - text: 已陈述概念
              detail: 降低能源和带宽压力是报道中的产品目标。
            - text: 高
              detail: 以独立工作负载和全系统基准补足。
        - label: 路线图执行
          values:
            - text: 高
              detail: 芯片代际失误可能让软件和客户陷入停滞。
            - text: 中
              detail: Habana 是相关但不具预测性的历史信号。
            - text: 创始人经验
              detail: 当前里程碑控制措施和客户反馈未披露。
            - text: 中高
              detail: 以流片、软件和设计合作伙伴证据补足。
        - label: 主权与合规
          values:
            - text: 触发时为高
              detail: 采购或出口限制可能阻断目标市场。
            - text: 有条件
              detail: 暴露取决于地理位置、最终用途和部署模式。
            - text: 未披露
              detail: 指定证据池中没有出现 Element 发布的合规文件。
            - text: 未量化
              detail: 通过法律、安全、隐私和出口审查补足。
        - label: 融资竞争
          values:
            - text: 高
              detail: 芯片开发和认证都需要大量资本。
            - text: 中高
              detail: 2026 年第一季度有 18 家私营半导体公司融资超过 $100 million。
            - text: 报道融资 $50M
              detail: 已融资金额不等于可用现金或资金续航。
            - text: 高
              detail: 结论应落到现金、烧钱速度、现金跑道和里程碑融资数据上。
    approximationNotes: 定性类别综合了引用的生态系统证据和范围明确的公开披露缺口；它们不是事件发生概率的数值估计，也不代表存在未披露事件。
    claimRefs:
      - CR003
      - CR005
      - CR009
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 按顺序串起的证据链说明了为何据报道的融资和市场需求，尚未跨过商业证明与价格纪律这两道门槛。
