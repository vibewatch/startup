      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              最强的负面先例是 Habana 在 Intel 内部的商业化历程。报道说 Gaudi 未达到 Intel 预计的 2024 年收入目标，Falcon Shores
              受到客户负面反馈，最终不会商业销售。这段历史说明，即使拥有差异化芯片和资金充足的母公司，也可能因集成薄弱、路线图分散、客户抗拒或软件与分销不足而失败。作为聚焦型初创公司，Element
              可能避开部分大公司官僚机制，但仍要克服相同的采用机制。人才和专业经验可以帮助执行，却不是自动持久的法律护城河。这里引用的法律分析强调，公开专利材料和普通职业技能不能直接转化为商业秘密。因此，投资逻辑依赖尚未在留存来源中出现的专有实现、软件、客户定制优化和可重复部署证据。
