          status: Supported
          detail: 更小型、本地化的数据中心
          evidence: Repeated positioning, but no named buyer
        - label: 接触与认证
          status: Leading indicator
          detail: 据报道，创始人网络打开了行业入口
          evidence: Access is not a design win
        - label: 芯片准备度
          status: Historical plan
          detail: 首个芯片系列和 TSMC 生产测试已列入计划
          evidence: No public completion or customer-sample date in the retained sources
        - label: 试点转量产
          status: Unverified
