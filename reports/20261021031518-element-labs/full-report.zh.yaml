      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              创始人网络已经证明其融资和退出能力：eeNews 回顾了 Galileo、Annapurna Labs 和 Habana Labs 的既往出售，Ynet 报道 Astera Labs 在 2024 年 IPO
              时估值 $5.5 billion。这些先例提高了资本获取可信度，却不能证明 Element 已具备退出准备度。MLCommons
              将可用系统与预览、研发系统区分开来，为产品成熟度提供有用的证据标准；指定来源没有显示 Element 会在哪一档合格，也没有 Element
              提交记录。投资前应取得定价轮条款清单和资本表、经审计现金与消耗、晶圆厂和封装承诺、具名生产合同、工作负载级性能与功耗结果、软件移植工作量和出口管制分析。若付费部署无法转化、声称的总成本优势无法复现、进度或良率出现重大滑坡，或条款导致稀释后无法达到所需回报，这些都是论点失效触发器。没有这些材料，无法负责任地给出目标回报、持有期或可信的退出估值。
            claimRefs:
              - CV010
              - CV012
              - CV013
              - CV016
