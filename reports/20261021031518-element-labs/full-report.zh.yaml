            body: >-
              Element Labs 于 2024 年 8 月以该名称注册。半导体行业媒体和以色列商业媒体持续将其描述为 Avigdor Willenz、David Dahan 和 Ran Halutz
              的新创公司。报道中的产品设想是面向推理的处理器与服务器架构，目标是降低为训练好的 AI 模型提供服务的成本和能耗。Globes 称公司运营基地在 Caesarea，并报道 Caesarea 和 Tel Aviv
              均有员工，但留存证据没有官方注册摘录、公司网站或法律地址确认。Tracxn 还列出一家名称相近但无关的美国显示技术公司，因此精确匹配实体是重要的研究控制问题，而非文书细节。
