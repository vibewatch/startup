  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应围绕面向更小型企业和本地数据中心的推理加速器系统划定，而不是覆盖整个半导体、AI 或数据中心经济。独立资料持续将 Element Labs
              描述为设计推理处理器；后续报道则把部署目标收窄到更靠近用户的计算场景，因为时延、带宽和能耗压力在这里更突出。因此，计入的支出应是加速器硬件，以及本地部署设施直接需要的服务栈；模型训练、通用
              CPU、存储、网络、设施建设和无关云消费均应排除。边界并不封闭：成熟 GPU 平台、边缘 AI 芯片、优化后的云推理和内部软件优化都能解决同一买方问题。AMD
              能将加速器与企业软件栈打包，并兼容现有基础设施，使现状成为实质性替代方案，而非被动邻接市场。VentureRadar 的同行集合还包括边缘、光子、Transformer 专用和通用 AI
              处理器方案，说明架构新颖性本身并不能定义受保护的品类。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM012
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              Lawrence Berkeley National Laboratory 提供了目前最强的需求侧锚点：其基准情景估计，2030 年美国数据中心用电量为 649 TWh，占美国用电量的
              11.8%。同一研究的复合不确定区间为 521 至 843 TWh，七种情景还会随设备安装量、加速器组合、AI 芯片寿命以及服务器空闲功耗和利用率而变化。这是基础设施强度视角，而不是收入
              TAM：若没有利用率、硬件更换、系统价格、市场地域和工作负载结构等假设，不能把用电量换算成加速器销售额。322 TWh
              的高低差本身具有决策价值，因为它显示该品类对部署假设有多敏感。没有留存来源拆分出更小型或本地数据中心可由推理加速器服务的部分，也没有来源支持 Element 特定的 SAM 或
              SOM。因此，估值工作应采用情景区间，并在确定市场份额前要求管理层提供自下而上的管线、单价、部署转化和更换周期证据。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM009
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              可能的经济买方是企业或本地数据中心基础设施所有者；平台工程和机器学习团队是日常用户，财务或基础设施负责人掌握预算。采用过程必须通过工作负载资格审查、软件移植、机架与电力评估、安全和知识产权审查、试点基准测试及生产上线。AMD
              的成熟方案明确强调可在现有机架、既有电力和散热范围内运行，并配套企业软件栈；挑战者不能只凭芯片规格取胜，而要超过这套完整的迁移基线。最有价值的触发因素是持续的推理量、时延或数据本地化要求，以及可量化的总成本节省。最重要的缺失买方证据，是
              Element 能在集成成本之后满足生产服务水平并带来节省的公开证明。在客户、工作负载结果、定价和重复部署披露前，买方细分只是有依据的地图，而不是已验证的销售漏斗。
            claimRefs:
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              数据中心耗电上升，以及从模型训练转向持续推理的趋势支撑需求；在时延和数据本地化使靠近用户部署更有价值的场景中，这一点尤其明显。制约因素是采用质量。Gartner 预计，到 2027 年底，超过 40% 的代理式
              AI 项目会因成本、价值不清或风险控制薄弱而被取消，并称传统系统集成在技术上复杂且可能造成干扰。法律分析还指出，AI
              系统结合硬件、软件、模型、数据和部署流程，因此保密与商业秘密控制也是企业采购的一部分。硬件执行风险同样重要：关于 Intel Habana 计划的报道称 Gaudi 未达到 2024 年收入目标，Falcon
              Shores 则因客户负面反馈而未进入商业发布。对 Element 而言，只有当基准测试证明客户层面的
              ROI、软件栈降低切换成本且试点转化为可重复的生产需求时，市场增长才足以支撑估值；品类扩张本身不能证明可获得的收入。
            claimRefs:
              - CM006
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 品类增长不等于可获得市场
            body: 公开证据支持基础设施需求上升，但不支持 Element 特定的定价、合格管线、客户转化、生产基准或市场份额。估值案例应以管理层证据为前提，证明其能把广泛需求信号转化为自下而上的 SAM 和 SOM。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              据报道，Element Labs 正在为更小型、更加本地化的数据中心开发推理处理器，而不是 Habana Labs 所对应的大型训练系统。其竞争对象不止一家直接初创公司：买方可以继续使用 NVIDIA 或 AMD
              GPU 基础设施，也可以评估 SambaNova、Cerebras、Groq、Intel Gaudi 或 Google TPU
              架构，还可以围绕现有云端或本地算力搭建异构内部栈。学术比较表明，这些架构的取舍差异很大，并非一个可互换的品类。Element 创始人拥有 Habana
              的直接经验，但创始人履历并不能消除买方的现状优势：成熟栈已经具备软件、采购、运营和开发者熟悉度。因此，Element 需要工作负载特定的强证据，证明集成和迁移值得投入，而不能只提出“推理是大市场”这一宽泛主张。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP014
          - type: table
            tableRef: TP001
