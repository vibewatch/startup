      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 证据边界
            body: 指定来源没有证明当前存在 Element 特定的诉讼、数据泄露、停机、召回或执法行动。这是覆盖限制，不是不存在问题的证明；法律、安全、客户、供应和财务尽调仍属必需。
            calloutType: risk
            claimRefs:
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              报道中的融资轮是强融资信号，但不是估值证明。SemIsrael 转述 Globes 称，Element Labs 正以 $300 million-$400 million 融资，估值超过 $4
              billion，并点名 Fidelity
              参与。该证据证明了报道中的市场成交背景，却没有说明估值是投前还是投后、适用何种清算优先权，或收入与客户承诺是否足以支撑价格。指定来源没有提供这些分母。合适的建议因此是继续研究而不是买入：把报道中的估值作为谈判参考，要求主要融资文件，在经审计的经济性、生产部署和独立可复现性能证据出现前，不要按高于该价格的溢价进行承销。信心低、风险高，因为制定目标回报、稀释模型和退出倍数所需的公开输入是缺失，而非只是不精确。
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 正论与反论
        blocks:
          - type: paragraph
            body: >-
              正论由创始人履历、聚焦推理的架构和巨大的效率问题组成。CTech 和 eeNews 识别出 Habana 创始团队，并称 Element 聚焦于更小型或本地数据中心的推理处理器。Berkeley Lab
              在基准情景中预计 2030 年美国数据中心用电量为 649 TWh，并称推理利用率可能持续偏低，因为系统必须按峰值需求配置；这为更低成本、更低能耗的推理留下了真实空间。反论同样重要。Ynet 报道，前身
              Gaudi 项目未达到 Intel 预计的 $500 million 2024 年收入目标，Falcon Shores 也不会商业化；Gartner 则预计到 2027 年底超过 40% 的代理式 AI
              项目会被取消。因此，创始人历史和市场增长不能代替当前产品、软件、客户和单位经济性证据。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景与估值逻辑
        blocks:
          - type: paragraph
            body: >-
              公开记录不支持精确概率权重或绝对估值区间，因此情景框架有意相对于报道中的超过 $4 billion
              估值。乐观情景需要可独立复现的工作负载结果、生产部署和经济性，证明持久的推理优势；只有之后才可评估溢价。基准情景是继续尽调，并在报道价格或以下、以里程碑为门槛入场，同时为进度、良率、软件和客户转化风险保留下行保护。悲观情景是不投资，或在试点无法转化、基准证据仍缺失、融资条款造成优先权悬置时给予大幅折价。Cerebras
              的比较是警示而非直接基准：留存分析说明，即使上市后，客户集中度和融资治理也可能继续触发公开市场重估。因此必须直接审查 Element 的具体条款。
            claimRefs:
              - CV001
              - CV011
              - CV012
