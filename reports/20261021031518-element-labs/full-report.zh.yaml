  - id: FE001
    title: 报道中的产品架构与证据成熟度栈
    type: stack
    summary: 该技术栈将报道中的客户价值主张与仍缺少一手证明的技术层分开。
    data:
      layers:
        - label: 推理工作负载
          detail: 报道中的重点：在更小型或本地化数据中心运行模型推理。
          items:
            - 对延迟敏感的用户请求
        - label: 管理软件
          detail: 报道中的系统层；接口、框架、版本发布和控制措施未披露。
          items:
            - 调度和组件管理
        - label: AI 与核心计算
          detail: 报道中的处理器范围；没有公开 SKU、规格、基准测试或芯片里程碑。
          items:
            - 推理加速器和核心处理器
        - label: 通信
          detail: 报道中的通信芯片范围；协议和拓扑未披露。
          items:
            - 系统内与网络数据传输
        - label: 服务器与设施
          detail: 部署依赖 OEM 集成、内存、电力、散热和利用率。
          items:
            - 本地或企业数据中心系统
        - label: 量产保障
          detail: 客户试点、可靠性、安全、合规、质量和支持仍未得到验证。
          items:
            - 认证和运营
    approximationNotes: 概念性的证据成熟度视图；层级顺序用于分析，不断言公司的内部实现。
