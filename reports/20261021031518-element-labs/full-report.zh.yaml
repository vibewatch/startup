  - id: TV002
    title: 正论与反论
    columns:
      - 立场
      - 论点
      - 证据
      - 改变判断的因素
    rows:
      - - 正论
        - 专注推理有望切入增长快、受电力约束的工作负载。
        - 据报道，Element 瞄准较小型或本地化数据中心的推理场景；Berkeley Lab 预计数据中心用电量将大幅增长。
        - 可复现的工作负载级延迟、吞吐量、功耗和总成本结果
      - - 正论
        - 创始团队有半导体融资和退出先例。
        - 独立报道将该团队与 Habana 及此前多次退出联系起来。
        - 新团队和运营计划能否独立于此前结果执行的直接证据
      - - 反论
        - 前代产品未达到商业预期。
        - Ynet 报道称，Gaudi 未达到 Intel 预计的 $500M 2024 年收入目标，Falcon Shores 也未实现商业化。
        - 有明确客户名称的付费部署，以及续约或采购量承诺
      - - 反论
        - 终端需求和变现可能落后于基础设施热度。
        - Gartner 预测，截至 2027 年底，超过 40% 的智能体 AI 项目将被取消。
        - 具有可量化、可重复生产需求且获客经济性可接受的客户工作负载
    notes: 前代产品和市场证据只是风险类比，并不能证明 Element 会重演这些结果；仍需公司层面的运营证据。
