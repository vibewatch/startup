      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 假设与证据门槛
      - 估值 / 回报逻辑
      - 概率信号
      - 下行或论点失效触发条件
    rows:
      - - 乐观
        - 实现量产部署、基准可复现、单位经济性强，且供应得到保障。
        - 只有在证据支持可持续增长和退出倍数后，才会考虑高于报道中 >$4B 估值的溢价。
        - 多个已点名客户从评估阶段进入签约采购量
        - 在代表性客户工作负载上，性能或软件优势未能成立
      - - 基准
        - 推理设计有潜力，也能获得融资，但商业化证据仍不完整。
        - 在不高于报道估值的水平、以里程碑为门槛入场；在条款和经济性披露前，不给出精确回报区间。
        - 付费试点和独立基准测试按计划出现
        - 进度、良率、现金或转化不达标，需要重新定价并加强保护条款
      - - 悲观
        - 需求转化停滞，产品证据仍停留在私下，或优先权和稀释条款过于苛刻。
        - 相比报道估值大幅折价，或不投资；保全资本，不为套用终值倍数而强行投资。
        - 在可验证的量产牵引力出现前反复融资
        - 没有可重复的客户经济性、出现重大出口限制，或无法为商业化融资
    notes: 这些是有条件的决策情景，不是按概率加权的预测；现有证据不足以支持数值概率、绝对估值区间或目标回报。
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV011
      - CV012
      - CV013
      - CV016
