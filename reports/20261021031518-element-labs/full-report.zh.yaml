      - number: '3.3'
        title: 市场进入、定价与分销
        blocks:
          - type: paragraph
            body: >-
              SambaNova 展示了新推理架构面临的竞争门槛：它把公司自称的性能和总成本优势，与具名部署、新制造资本以及覆盖基础设施和市场进入执行的 Intel
              合作计划放在一起。这些披露不是对速度或成本主张的独立验证，但确实展示了留存 Element 证据所没有的分销资产和客户证明。Element
              被报道的融资和团队规模提供了开发能力，却都不能替代产品可用性、收入、客户采用或可用现金。指定证据中的大多数替代方案，其公开单价、合同条款、部署范围、折扣、服务义务和渠道经济性仍未知。因此，仅凭这些来源，买方无法比较每项工作负载的实际成本，投资者也不应把厂商
              TCO 主张换算成收入或利润率假设。
            claimRefs:
