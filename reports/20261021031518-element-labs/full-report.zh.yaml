  - id: FI001
    title: 收入模型桥接：从报道活动到未披露经济性
    type: flow
    summary: 公开证据能确认产品开发，但还未到足以证明收入或毛利的商业阶段。
    data:
      nodes:
        - id: development-capital
          label: 开发资本
          detail: 据报道总融资为 $400.0M，但剩余现金未披露。
        - id: processor-system
          label: 推理处理器 / 系统
          detail: 产品意图有报道；成本、良率和量产状态未量化。
        - id: customer-qualification
          label: 客户认证
          detail: 尚无公开的设计赢单、试点、基准测试或验收证据。
        - id: commercial-contract
          label: 商业合同
          detail: 价格、单价、期限、折扣、渠道分成和履约义务均未披露。
        - id: revenue-and-cash
          label: 收入与现金回款
          detail: 收入、ARR、积压订单、开票和回款数据不可得。
        - id: gross-profit
          label: 毛利
          detail: COGS、交付成本、保修和毛利率数据不可得。
      edges:
        - from: development-capital
          to: processor-system
        - from: processor-system
          to: customer-qualification
        - from: customer-qualification
          to: commercial-contract
        - from: commercial-contract
          to: revenue-and-cash
        - from: revenue-and-cash
          to: gross-profit
