        - date: "2026-04-14"
          label: Inference positioning described
          detail: CTech described the company as developing inference-optimized processors for smaller, localized data centers.
          tone: neutral
          claimRefs: [CO003]
        - date: "2026-06-29"
          label: Large follow-on financing reported
          detail: Globes reported another $300 million to $400 million at a valuation exceeding $4 billion.
          tone: positive
          claimRefs: [CO005, CO006]
    approximationNotes: >-
      Two 2025 entries have year-only precision because the retained articles did not provide
      exact closing dates; the public record supports six dated milestones, not the eight-item
      quality target.
    claimRefs: [CO001, CO002, CO003, CO005, CO006, CO007]
callouts:
  - calloutType: strength
    title: Founder network compresses the capital-access problem
    body: >-
      The team combines repeated semiconductor-company formation, prior exits, and access to
      institutional investors, which can improve recruiting and supply-chain introductions.
    claimRefs: [CO002, CO009, CO016]
  - calloutType: risk
    title: Valuation has outrun public verification
    body: >-
      A reported valuation above $4 billion is not matched by public revenue, customer,
      deployment, benchmark, or governance evidence in the retained source set.
    claimRefs: [CO006, CO008, CO012]
