  evidenceGaps:
    - type: missing-source
      severity: material
      topic: leadership
      missingEvidence: Official corporate registry records, current executive roster, board composition, ownership, voting rights, and succession documentation.
      whyItMatters: Founder concentration and investor control cannot be assessed from press reporting alone.
      diligencePath: Obtain registry extracts, the charter, cap table, board minutes, voting agreements, and signed employment and vesting documents.
      relatedQuestionRefs: [QO002]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: disclosure
      missingEvidence: Audited revenue, gross margin, burn, runway, employee roster, customer count, contracted backlog, and deployment-stage data.
      whyItMatters: Reported funding and valuation cannot substitute for operating traction or liquidity evidence.
      diligencePath: Review monthly management accounts, bank statements, payroll extracts, pipeline data, signed orders, invoices, and customer-reference permissions.
      relatedQuestionRefs: [QO004, QO007, QO010]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: customer-proof
      missingEvidence: Named production customers, workload benchmarks, deployment volumes, acceptance criteria, renewals, and paid revenue evidence.
      whyItMatters: Confidential discussions, pilots, design wins, and production contracts imply materially different commercial readiness.
      diligencePath: Conduct consented customer calls and inspect signed contracts, purchase orders, deployment telemetry, acceptance tests, and cash receipts.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO003]
    - type: enumeration-incomplete
      severity: minor
      topic: milestones
      missingEvidence: At least two additional dated company milestones supported by attributable public or company records.
      whyItMatters: The six-item public timeline is too sparse to establish a complete product, regulatory, partnership, and adverse-event history.
      diligencePath: Request a board-approved corporate chronology and dated product, foundry, tape-out, partnership, regulatory, and incident records.
      relatedQuestionRefs: [QO005]
    - type: conflicting-data
      severity: minor
      topic: entity-resolution
      missingEvidence: A definitive legal entity identifier and official domain for the current Israeli AI-chip company.
      whyItMatters: Same-name databases can contaminate founding, funding, employee, and acquisition records with an unrelated U.S. display company.
      diligencePath: Match registry number, legal name, registered address, directors, and domain ownership before importing any database record.
      relatedQuestionRefs: [QO001, QO008]
