              - CI007
              - CI009
              - CI012
              - CI016
      - number: '4.3'
        title: Utilization and service-delivery economics are the central unknowns
        blocks:
          - type: paragraph
            body: >-
              Element-specific cost data are absent. No retained source discloses fabrication or packaging terms,
              inventory commitments, warranty reserves, cloud-validation expense, field-support cost, gross margin,
              working capital, or capital expenditure. The LBNL data-center study provides a relevant external
              sensitivity rather than an Element metric: it says inference-server utilization may be lower than
              previously assumed and remains difficult to verify. For a supplier whose value proposition depends on
              lower-cost inference, realized customer utilization, idle power, software overhead, yield, and support
              intensity can determine both buyer total cost of ownership and vendor margin. Until management provides
              workload-level benchmarks and contract economics, neither a hardware-margin case nor a recurring-software
              case is supportable.
            claimRefs:
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.4'
        title: Financial underwriting remains blocked despite strong financing signals
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse analogue is the founders' prior platform after acquisition: CTech and Ynet report
              that Intel's Gaudi product missed a stated 2024 revenue target and that Falcon Shores was not
              commercialized. That outcome is not evidence that Element will repeat the failure, but it shows that
              technically credible AI silicon can still miss adoption and revenue objectives. Gartner's broader forecast
              that more than 40% of agentic-AI projects will be canceled because of cost, unclear value, or controls
              adds demand-side uncertainty, while Lex Machina's litigation benchmark is only a sector-wide legal-cost
              warning and does not identify an Element incident. The financial verdict is therefore research-more:
              financing capacity appears meaningful, but revenue quality, margin path, capital intensity, and runway
              remain unquantified.
            claimRefs:
              - CI006
              - CI013
              - CI014
              - CI016
