        title: The product thesis is clearer than the revenue model
        blocks:
          - type: paragraph
            body: >-
              Multiple independent reports describe Element Labs as developing inference processors for smaller or
              localized data centers, with some secondary profiles also describing system, interconnect, and software
              layers. No retained source establishes whether the company will sell chips, complete systems, licensed
              intellectual property, software subscriptions, support, or a bundled appliance. Public sources likewise
              provide no list price, realized price, contract duration, discounting, acceptance milestone, backlog,
              revenue-recognition policy, revenue, ARR, customer count, or production deployment. The tables below
