      - number: '1.3'
        title: Financing history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The clearest current financing evidence is Globes' June 2026 report that existing investors, including
              Fidelity, invested another $300 million to $400 million at a valuation exceeding $4 billion. CTech
              separately reported a $50 million raise in 2025, while Globes cited a $1.1 billion 2025 valuation from
              PitchBook. These are reported financing events, not evidence of cash currently available, revenue, or an
              audited capitalization table. The latest round's exact size, closing status, security type, dilution,
              liquidation preferences, board rights, debt, and secondary components remain undisclosed. Publicly visible
              stakeholders therefore indicate access and ambition, while control and economic ownership remain open.
