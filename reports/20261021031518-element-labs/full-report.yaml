              - CP008
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital formation is visible; liquidity is not
        blocks:
          - type: paragraph
            body: >-
              Startupim reports $400.0 million of total funding across three rounds through June 2026, while two other
              profiles support only the earlier $50 million 2025 financing snapshot. The newer total is a financing-flow
              datapoint, not a cash-balance datapoint: none of the retained sources discloses proceeds remaining,
              committed manufacturing spend, monthly burn, debt principal, covenant terms, or runway. Startupim also
              lists four active charges or liens, but the underlying instruments and secured obligations are not
              available in the assigned evidence. Those registrations could be ordinary venture-company security
              arrangements or material financing obligations; the public record here does not permit a conclusion. The
              investment case therefore requires a current cash-to-milestone bridge rather than treating cumulative
              funding as available liquidity.
            claimRefs:
