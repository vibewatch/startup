        title: Scale evidence and diligence limits
        blocks:
          - type: paragraph
            body: >-
              Globes estimated 350 employees across Caesarea and Tel Aviv plus several hundred outsourced workers in
              June 2026, but the figure is not company-confirmed and contractors should not be counted as employees. The
              retained source set discloses no Element Labs revenue, customer count, named production customer,
              deployment volume, gross margin, burn, or runway. Competitive evidence raises the proof bar: SambaNova has
              announced both a named first SN50 deployment and a $350 million financing, while Element's reported cloud
              relationships remain speculative. The demand thesis is real but not risk-free. Berkeley Lab projects
              sharply rising U.S. data-center electricity consumption, whereas Gartner expects many agentic-AI projects
              to be canceled because of cost, value, and control problems. Element therefore needs workload-level
              performance, deployment, and economics evidence to justify its reported valuation.
