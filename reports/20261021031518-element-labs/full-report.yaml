  - id: FR001
    title: Residual-risk heatmap from available public evidence
    type: matrix
    summary: >-
      Commercial conversion, packaging, utilization economics, and roadmap execution remain the highest residual
      exposures because public mitigation evidence is limited.
    data:
      columns:
        - Impact
        - Likelihood signal
        - Mitigation maturity
        - Residual
      rows:
        - label: Production conversion
          values:
            - text: High
              detail: Revenue timing depends on paid production adoption.
            - text: Medium-high
              detail: Deloitte reports limited scaled pilot conversion across surveyed enterprises.
            - text: Undisclosed
              detail: No named Element production deployment appears in the assigned evidence.
            - text: High
              detail: Close with paid deployments and acceptance data.
        - label: Advanced packaging
          values:
            - text: High
              detail: Delay could move qualification and production schedules.
            - text: High through 2026
              detail: TrendForce reports a remaining ecosystem supply-demand gap.
            - text: Undisclosed
              detail: Element allocation and second-source plans are not public in the pool.
            - text: High
              detail: Close with contracts, yields, and qualification milestones.
        - label: Inference utilization economics
          values:
            - text: High
              detail: Utilization affects customer ROI and delivered system cost.
            - text: Medium-high
              detail: Berkeley Lab assumes low utilization and reports limited measured evidence.
            - text: Concept stated
              detail: Lower energy and bandwidth strain is a reported product goal.
            - text: High
              detail: Close with independent workload and full-system benchmarks.
        - label: Roadmap execution
          values:
            - text: High
              detail: Missed silicon generations can strand software and customers.
            - text: Medium
              detail: Habana is a relevant but non-predictive historical signal.
            - text: Founder experience
              detail: Current milestone controls and customer feedback are undisclosed.
            - text: Medium-high
              detail: Close with tape-out, software, and design-partner evidence.
        - label: Sovereignty and compliance
          values:
            - text: High if triggered
              detail: Procurement or export restrictions can block target markets.
            - text: Conditional
              detail: Exposure depends on geography, end use, and deployment model.
            - text: Undisclosed
              detail: No Element-issued compliance artifact appears in the assigned pool.
            - text: Unquantified
              detail: Close through legal, security, privacy, and export review.
        - label: Financing competition
          values:
            - text: High
              detail: Chip development and qualification are capital intensive.
            - text: Medium-high
              detail: Eighteen private semiconductor companies raised more than $100 million in Q1 2026.
            - text: $50M reported
              detail: Funding raised is not cash available or runway.
            - text: High
              detail: Close with cash, burn, runway, and milestone financing data.
    approximationNotes: >-
      Qualitative categories synthesize cited ecosystem evidence and bounded public-disclosure gaps; they are not
      numerical incident probabilities or evidence of an undisclosed event.
    claimRefs:
      - CR003
      - CR005
      - CR009
      - CR012
      - CR014
      - CR016
