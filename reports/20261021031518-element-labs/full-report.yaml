    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating posture
        blocks:
          - type: paragraph
            body: >-
              Element Labs was registered under that name in August 2024 and has been consistently described by
              semiconductor trade and Israeli business reporting as the new venture of Avigdor Willenz, David Dahan, and
              Ran Halutz. The reported product thesis is an inference-focused processor and server architecture intended
              to reduce the cost and energy burden of serving trained AI models. Globes places the operating base in
              Caesarea and reports employees in both Caesarea and Tel Aviv, but the retained evidence contains no
              official registry extract, company website, or legal-address confirmation. A similarly named, unrelated
              U.S. display-technology company in Tracxn makes exact entity matching a material research-control issue
              rather than a clerical detail.
            claimRefs:
