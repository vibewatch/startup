        - Production deployments, reproducible benchmarks, strong unit economics, and secured supply.
        - >-
          A premium to the reported >$4B mark is considered only after evidence supports durable growth and an exit
          multiple.
        - Multiple named customers move from evaluation to contracted volume.
        - Performance or software advantage fails on representative customer workloads.
      - - Base
        - Promising inference design and financing access, but commercial proof remains incomplete.
        - >-
          Milestone-gated entry at or below the reported mark; no precise return range until terms and economics are
          disclosed.
        - Paid pilots and independent benchmark participation emerge on schedule.
        - Schedule, yield, cash, or conversion misses require repricing and stronger protections.
      - - Bear
        - Demand conversion stalls, product proof remains private, or preference and dilution terms are onerous.
        - >-
          Substantial discount to the reported mark or no investment; preserve capital rather than force a terminal
          multiple.
        - Repeated financing precedes verifiable production traction.
        - No repeatable customer economics, material export constraint, or inability to finance commercialization.
    notes: >-
      These are conditional decision cases, not probability-weighted forecasts; the evidence does not support numeric
      probabilities, an absolute valuation range, or a target return.
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV011
      - CV012
      - CV013
      - CV016
