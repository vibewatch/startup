      - number: '1.2'
        title: Leadership, founder fit, and governance
        blocks:
          - type: paragraph
            body: >-
              The founder group has unusually strong semiconductor formation and exit experience. Willenz is associated
              with Galileo, Annapurna Labs, Habana Labs, and other infrastructure investments; Dahan and Halutz
              previously co-founded Habana after work at PrimeSense. That history plausibly improves recruiting,
              financing, foundry access, and strategic introductions. It does not establish current execution quality or
              governance. Reporting on Habana's absorption into Intel describes customer disappointment, product
              cancellations, bureaucracy, and the departure of most of the original team. Those events occurred after
              Intel's acquisition and cannot be assigned solely to the Element founders, but they make current board
              composition, decision rights, succession, and technical-accountability evidence essential diligence items.
            claimRefs:
              - CO002
              - CO009
              - CO010
