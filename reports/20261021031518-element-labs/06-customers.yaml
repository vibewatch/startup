    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU008, CU009]
callouts:
  - calloutType: risk
    title: Founder access is not customer validation
    body: >-
      Reported industry access can accelerate introductions and qualification, but no retained
      source converts that access into a named design win, production deployment, measured
      outcome, renewal, or revenue contribution.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
