evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: >-
      Official corporate registry records, current executive roster, board composition, ownership, voting rights, and
      succession documentation.
    whyItMatters: Founder concentration and investor control cannot be assessed from press reporting alone.
    diligencePath: >-
      Obtain registry extracts, the charter, cap table, board minutes, voting agreements, and signed employment and
      vesting documents.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: >-
      Audited revenue, gross margin, burn, runway, employee roster, customer count, contracted backlog, and
      deployment-stage data.
    whyItMatters: Reported funding and valuation cannot substitute for operating traction or liquidity evidence.
    diligencePath: >-
      Review monthly management accounts, bank statements, payroll extracts, pipeline data, signed orders, invoices, and
      customer-reference permissions.
    relatedQuestionRefs:
      - QO004
      - QO007
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named production customers, workload benchmarks, deployment volumes, acceptance criteria, renewals, and paid
      revenue evidence.
    whyItMatters: >-
      Confidential discussions, pilots, design wins, and production contracts imply materially different commercial
      readiness.
    diligencePath: >-
      Conduct consented customer calls and inspect signed contracts, purchase orders, deployment telemetry, acceptance
      tests, and cash receipts.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: At least two additional dated company milestones supported by attributable public or company records.
    whyItMatters: >-
      The six-item public timeline is too sparse to establish a complete product, regulatory, partnership, and
      adverse-event history.
    diligencePath: >-
      Request a board-approved corporate chronology and dated product, foundry, tape-out, partnership, regulatory, and
      incident records.
    relatedQuestionRefs:
      - QO005
  - type: conflicting-data
    severity: minor
    topic: entity-resolution
    missingEvidence: A definitive legal entity identifier and official domain for the current Israeli AI-chip company.
    whyItMatters: >-
      Same-name databases can contaminate founding, funding, employee, and acquisition records with an unrelated U.S.
      display company.
    diligencePath: >-
      Match registry number, legal name, registered address, directors, and domain ownership before importing any
      database record.
    relatedQuestionRefs:
      - QO001
      - QO008
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Element-specific target-account count, qualified pipeline, unit pricing, production conversion, replacement cycle,
      and geography needed for a bottom-up SAM and SOM.
    whyItMatters: >-
      Without a bottom-up bridge, broad data-center demand cannot support an obtainable revenue or market-share
      assumption.
    diligencePath: >-
      Request management's account-level pipeline, deployment stages, pricing, bill of materials, conversion history,
      and capacity assumptions; reconcile them to signed customer evidence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: positioning-uncertainty
    missingEvidence: >-
      Primary product documentation, independent workload benchmarks, public customer references, and production
      deployment evidence for the smaller or local data-center positioning.
    whyItMatters: >-
      The product boundary and buyer map remain provisional without evidence that the claimed positioning is technically
      and commercially real.
    diligencePath: >-
      Obtain product specifications, software compatibility documentation, audited benchmarks, reference calls, and
      workload-level pilot-to-production records.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM001
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracts
    missingEvidence: >-
      Realized unit pricing, hardware and software packaging, minimum commitments, discounts, support obligations, and
      like-for-like workload cost for Element and alternatives.
    whyItMatters: >-
      Vendor TCO claims cannot establish customer price, gross margin, or workload economics without contract scope and
      utilization assumptions.
    diligencePath: >-
      Obtain customer quotes and contracts, normalize them to identical models, latency, throughput, power,
      availability, and support requirements, and reconcile to invoices.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-lock-in
    missingEvidence: >-
      Customer deployment architecture, migration effort, compiler and framework portability, multi-homing behavior,
      supply commitments, and proprietary partner access for Element.
    whyItMatters: >-
      These inputs determine whether differentiation creates durable retention or can be displaced by an incumbent or
      another accelerator.
    diligencePath: >-
      Review design-partner agreements and deployment diagrams, interview reference customers, and test representative
      model migration across Element and incumbent stacks.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: element-benchmark-gap
    missingEvidence: >-
      A reproducible Element submission or independently witnessed benchmark covering latency, throughput, power,
      quality, software maturity, and system availability.
    whyItMatters: >-
      The competitive thesis cannot distinguish product capability from founder reputation or market intent without
      workload-level proof.
    diligencePath: >-
      Run agreed customer workloads under a documented MLPerf-like protocol and compare available systems at matched
      model quality, batch size, sequence length, and power.
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy-gap
    missingEvidence: >-
      Current cash, restricted cash, monthly burn, debt and lien terms, committed production spend, milestone timing,
      and runway.
    whyItMatters: >-
      Funding raised does not show whether available capital reaches tape-out, qualification, volume production, or the
      next financing trigger.
    diligencePath: >-
      Obtain bank statements, the debt and security schedule, board-approved forecast, monthly cash burn, and an
      18-month milestone bridge.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: monetization-gap
    missingEvidence: >-
      Executed customer agreements, price lists, realized ASP, discounts, channel economics, performance obligations,
      and revenue-recognition policy.
    whyItMatters: Without contract evidence, the revenue mechanism and quality of any commercial traction cannot be assessed.
    diligencePath: >-
      Review a representative contract set, invoice and collection samples, pricing approvals, channel agreements, and
      the accounting memo.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: >-
      Revenue, backlog, customer cohorts, bill of materials, yield, gross margin, utilization, warranty, support cost,
      CAC, payback, and sales cycle.
    whyItMatters: >-
      These inputs determine whether technical performance can produce durable gross profit before additional capital is
      required.
    diligencePath: >-
      Request monthly financials, customer and pipeline cohorts, standard-cost and yield reports, workload benchmarks,
      and a gross-margin bridge.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI006
      - QI010
    relatedTableRefs:
      - TI003
  - type: conflicting-data
