  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-input-gap
      missingEvidence: >-
        Priced-round term sheet, fully diluted capitalization table, liquidation preferences,
        pro-rata rights, option-pool treatment, and expected future financing needs.
      whyItMatters: >-
        Ownership, dilution, preference overhang, and exit proceeds cannot be modeled without these
        terms, so the reported valuation is not a usable return denominator.
      diligencePath: >-
        Obtain board-approved financing documents and model investor proceeds across downside, base,
        and upside exits on a fully diluted basis.
      relatedQuestionRefs: [QV009]
      relatedTableRefs: [TV001, TV003]
    - type: missing-source
      severity: material
      topic: benchmark-standard
      missingEvidence: >-
        Element-specific, reproducible inference results on representative customer workloads with
        hardware availability, software configuration, latency, throughput, power, and cost disclosed.
      whyItMatters: >-
        Product differentiation and the bull-case premium depend on performance and total-cost
        advantages that the assigned public evidence does not demonstrate.
      diligencePath: >-
        Commission independent benchmark reproduction and request customer acceptance-test results,
        ideally mapped to an MLCommons availability category.
      relatedQuestionRefs: [QV008]
      relatedTableRefs: [TV002, TV003]
    - type: private-evidence-only
      severity: material
      topic: commercial-proof
      missingEvidence: >-
        Audited revenue, gross margin, burn, cash runway, paid-pilot conversion, contracted production
        volume, retention, and customer concentration.
      whyItMatters: >-
        A price-sensitive valuation, target return, hold period, and exit case require company-specific
        cash-flow and customer evidence rather than market-growth proxies.
      diligencePath: >-
        Review audited monthly financials, bank statements, customer contracts, pipeline conversion,
        cohort retention, and a board-approved operating plan.
      relatedTableRefs: [TV001, TV003]
