    title: Recommendation logic
    type: flow
    summary: >-
      An ordered evidence chain shows why reported financing and market need do not yet clear the
      commercial-proof and price-discipline gates.
    data:
      nodes:
        - id: reported-financing
          label: Reported financing
          detail: "$300M-$400M at a valuation above $4B"
        - id: market-need
          label: Market need
          detail: "Inference growth and data-center power pressure"
        - id: founder-precedent
          label: Founder precedent
          detail: "Multiple prior semiconductor financings and exits"
        - id: benchmark-gate
          label: Benchmark gate
          detail: "No retained Element result under a recognized availability framework"
        - id: commercial-gate
          label: Commercial gate
          detail: "Revenue, production customers, margins, and retention undisclosed"
        - id: terms-gate
          label: Terms gate
          detail: "Cap table, preferences, dilution, and cash needs undisclosed"
        - id: recommendation
          label: Recommendation
          detail: "Research more; milestone-gated entry only"
    approximationNotes: >-
      The flow is qualitative and ordered; it does not assign probabilities, conversion rates, or a
      valuation from unavailable operating inputs.
    claimRefs: [CV001, CV005, CV006, CV007, CV009, CV012, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price discipline
    body: >-
      Do not underwrite a premium to the reported above-$4-billion valuation until primary financing
      terms, production customer proof, audited economics, and reproducible workload benchmarks
      support the required return.
    claimRefs: [CV001, CV013, CV014, CV015, CV016]
  - calloutType: risk
    title: Comparable evidence is diagnostic, not dispositive
    body: >-
      Habana and Cerebras illustrate commercialization and concentration risks in AI silicon, but
      neither provides a directly comparable Element valuation; direct company evidence must drive
      the investment decision.
    claimRefs: [CV009, CV011, CV013]
