      - number: '3.2'
        title: 能力矩阵、采购敏捷性与标准合规
        blocks:
          - type: paragraph
            body: >-
              评估竞争能力，要看实际航位推算精度、电子战韧性和环境认证。在新墨西哥州美国陆军全域持续实验（APEX）的战术地面测试中，Advanced Navigation 展示了搭载红外激光测速传感器的 Boreas D90
              FOG INS，在受干扰电子战环境下实现 0.012% 的航位推算误差（65 公里行程误差 7.5 米）。在地形可预测、配合轮速编码器时，同一架构的距离误差为 0.018%（65 公里误差 11.7
              米）。AdNav Intelligence 软件的能力正在这里体现：它动态评估传入传感器的可靠性，而不是依赖静态卡尔曼滤波。从认证角度看，Advanced Navigation 按 MIL-STD-810
              环境应力和 MIL-STD-461 电磁兼容标准验证系统。商业竞争者常省略完整的军用冲击和振动测试，国防主承包商则需要漫长的一次性工程周期；Advanced Navigation
              把军用级环境加固和商用现货采购速度结合起来。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
