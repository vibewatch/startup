  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合、传感器模块化与分层定位系统
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 设计、研发并制造分层的定位、导航与授时（PNT）硬件组合，覆盖 MEMS、闭环数字光纤陀螺（FOG）和水下声学收发器。在战术级，Motus IMU 和 Certus
              GNSS-INS 等微型 MEMS 方案提供低尺寸、重量、功耗和成本（SWaP-C）的运动跟踪，为批量无人机和自主移动机器人维持 0.05 degree 俯仰与横滚精度以及 10 millimeter RTK
              定位。在高完整性和战略级，Boreas 系列以 Boreas D90 和 Boreas D70 为代表，采用自有数字 FOG 线圈，可实现 0.001 degree per hour 偏置稳定性和 0.01
              degree seclat 真北寻向陀螺罗经。2025 年末，公司以紧凑的 Boreas 50 系列扩展旗舰产品线，推出 A50 AHRS 和 D50 战略级
              INS，服务空间受限的海事及战术地面作战平台。更关键的是，Advanced Navigation 让所有 MEMS、FOG
              和声学传感器采用架构统一的通信协议，使国防和商业系统集成商能随任务要求升级动态更换传感器等级，无需重写自主中间件或改动硬件线束。
