  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 保障型 PNT 的市场边界与运营范围
        blocks:
          - type: paragraph
            body: >-
              电子战、射频干扰和复杂卫星欺骗在受争夺环境中扩散，推动定位、导航与授时（PNT）市场发生结构性转变。过去，商用自主平台和标准国防车辆主要依赖 GNSS
              接收器，把外部卫星信号当作持续可用的基础设施；但民航机构和国防部门已记录广泛且持续的信号退化，使标准 GPS 跟踪不可靠甚至具有欺骗性。保障型 PNT 覆盖一类专门的导航支出，目标是在 GPS
              不可用或退化时持续估算速度、位置和航向，包含自包含 IMU、FOG 和 MEMS INS、航位推算算法、声学跟踪及多传感器感知引擎。未经加固的消费级 GPS
              芯片、独立非惯性远程信息单元，以及缺少传感器融合或电子防护的娱乐导航模块不在核心市场内。系统集成商的战略要务，是让海陆空天平台保持自主生存能力，同时不依赖脆弱的轨道下行链路或受限的出口许可制度。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM010
              - CM013
              - CM014
      - number: '2.2'
        title: 可寻址市场规模与受约束的采购视角
        blocks:
          - type: paragraph
            body: >-
              要估算保障型 PNT
              市场，不能只看宏观航空航天和机器人支出，而要把它拆成可核验的零部件级硬件和子系统采购流。市场评论常把全球可寻址国防自主化空间说成数百亿美元以上；但供应商真正能拿到的机会，受平台集成周期和主权制造约束强烈限制。底层的全球
              GNSS 依赖型基础设施包括商用航空、海运和需要备份韧性的关键民用公用事业。在这片大底盘中，可寻址的惯性硬件市场覆盖战术级 MEMS 单元和导航级 FOG
              系统，部署于无人机（UAV）、自主水下航行器（AUV）及战术装甲车辆。Advanced Navigation 已在 70 个国家向超过 2,800 家客户部署超过 100,000
              套导航系统，证明了商业牵引力；其收入超过 80% 来自美国和欧洲客户。公司于 2026 年完成 US10 million Series C
              融资，用于建设区域工程中心和扩大产能。尽管牵引力已经显现，私人披露不足，仍无法经审计确认经常性软件收入与一次性硬件销售的占比，因此确切的可服务市场份额还要继续尽调验证。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
