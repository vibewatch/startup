  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业收入流
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 采用专业化军民两用模式，为商业机器人、航空航天、海事和国防领域提供保障型定位、导航与授时（APNT）方案。公司的主要商业变现引擎，是直接销售涵盖 MEMS
              和数字光纤陀螺（DFOG）系统的自有惯性导航硬件。这些硬件产品面向 GPS 拒止或受争夺的电子战环境，提供任务关键的位置、姿态和航向信息，不依赖外部卫星信号。除核心地面和空中导航硬件外，Advanced
              Navigation 还通过 Subsonus 系列和自主水下航行器变现水下声学定位系统。为配合高价值硬件部署，公司提供基于网页的后处理软件 Kinematica，帮助操作员把原始 GNSS
              和惯性遥测数据处理到测量级精度。硬件出货仍是主要收入驱动，但客户合作越来越多地纳入云端机队指挥和软件许可。
