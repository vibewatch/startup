      - number: '3.3'
        title: 定价模式、切换摩擦与护城河韧性
        blocks:
          - type: paragraph
            body: >-
              国防导航的商业采购模式，在定制国防合同与标准化硬件采购之间泾渭分明。老牌主承包商签订数百万美元的成本加成合同，把自研软件和定制线缆捆在一起，为长期正式项目筑起很高的切换壁垒。Advanced Navigation
              依靠在澳大利亚垂直整合制造来打破这一格局，把设备交付从数年缩短到数周。为降低客户集成摩擦，公司让所有 MEMS 和 FOG 硬件采用通用通信协议、统一电气接口（Ethernet、CAN
              Bus、RS232/RS422）和多语言软件开发包（C++、Python）。这种互操作性让车辆集成商能在入门级战术单元与战略级 FOG
              系统之间切换，无需重做平台线缆或任务计算机。不过，国防主承包商凭借既有客户信任、数十年的任务安全认证和西方国防采购机构的惯性，仍保有深厚护城河。Advanced Navigation 在英国、欧洲和美国建设区域
              PNT 卓越中心，是建立本土可信度、直接争取盟国主权国防项目的必要投资。
