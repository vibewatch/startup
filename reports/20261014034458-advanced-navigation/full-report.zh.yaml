      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 保障型 PNT 作为工业制造瓶颈
            body: 保障型 PNT 的战略瓶颈，已经从算法概念验证转向精密硬件扩产。制造导航级惯性系统需要专业光学装配、严格热校准和供应链控制，通用电子制造无法复制这套能力。
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
          - type: callout
            title: 塑造盟友需求的监管与出口障碍
            body: >-
              严格的 ITAR 出口管制过去限制了国际国防合作，并把采购周期拉长到数年。Advanced Navigation 在澳大利亚设计、无 ITAR 的架构，能让 NATO 和 AUKUS
              伙伴更快采用，但也面临本地化国防生产要求带来的竞争加剧。
            calloutType: risk
            claimRefs:
              - CM005
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代方案格局与架构权衡
        blocks:
          - type: paragraph
            body: >-
              保障型定位、导航与授时（APNT）市场横跨成熟航空航天主承包商、战术级 MEMS 专家和现有 GNSS 方案。Honeywell、Northrop Grumman 及 Safran/Kearfott
              等老牌厂商，凭借经过飞行验证的环形激光陀螺和高端 FOG 系统掌控传统国防平台。但这些主承包商受严格的国际武器贸易条例（ITAR）和多年生产周期束缚。商业 MEMS 供应商则提供紧凑外形，却难以应对 GNSS
              长时间拒止下的传感器漂移。美国联邦航空管理局的官方指引凸显了混合 GNSS-INS
              架构的结构性脆弱：遭到蓄意干扰时，混合系统失去约束传感器漂移所需的外部更新；欺骗攻击还会污染导航解算，触发地图偏移和错误航向修正。相比之下，自包含惯性导航系统只靠内部加速度计和陀螺仪计算姿态与速度，不依赖外部射频。Advanced
              Navigation 的 Boreas FOG 系列和 Certus MEMS 产品线正面应对这一架构弱点，强调真北寻向陀螺罗经能力，以及不依赖卫星的自主保持。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP014
