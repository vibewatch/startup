        title: 资本化历程、Series C 融资与投资者结构
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 通过连续的风险投资、私募股权和主权战略股权轮次，为研发、产品商业化和全球产能建设提供资金。公司 2019 年完成 AUD$20 million 首轮融资，并于 2026 年
              3 月完成大型 Series C，融资 US$110 million（相当于 AUD$158 million）。本轮由澳大利亚风投 Airtree Ventures 领投，Quadrant Private
              Equity 的 Strategic Equity Fund 和澳大利亚联邦 National Reconstruction Fund Corporation（NRFC）参与。NRFC
              依据法定职责，以结构化优先股投资注入 AUD$50 million，支持澳大利亚主权国防和高科技制造。早期机构投资者还包括 Main Sequence Ventures、In-Q-Tel、KKR 和 Alpha
