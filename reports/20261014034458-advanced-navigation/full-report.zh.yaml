        - GPS World 报道系统数量超过 100,000 套、保持三位数增长，且超过 80% 的收入来自美国和欧洲
        - 经审计数据若显示复购疲弱或一次性项目集中，会削弱这一判断
      - - 反向逻辑
        - 大多数产品和运营差异化来自公司自身发布的信息
        - 不受 ITAR 约束的状态、军用标准验证、交付周期和供应商覆盖范围都属于营销性主张
        - 独立基准、验收测试和客户推荐将增强信心
      - - 反向逻辑
        - 公开证据无法确定经济性或入场价值
        - 确切估值、经审计利润率、烧钱速度、订单积压质量和资本化条款均缺失
        - 需要经审计报表和已签署的融资文件
    notes: 将公司和供应商主张与独立报道分开；部署数据不视为经审计收入或留存数据。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险和下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 经审计收入超过 US$100 million，增长保持强劲，利润率稳健，且区域扩张按预算执行
        - 只有将标准化经审计指标套用到相关可比公司集合，并检验优先权瀑布后，才可考虑溢价
        - 预测落空、经常性需求疲弱、利润率收缩或扩张超支
        - 无法根据指定公开证据估计
      - - 基准情景
        - 融资支持持续增长，但经济性和集中度仍属非公开信息
        - 在披露入场价格和经审计运营情况前，没有可辩护的区间或目标回报
        - 采购周期长、订单不均及资本需求会延迟流动性
        - 无法根据指定公开证据估计
      - - 悲观情景
        - 未披露的独角兽级别入场估值之后，转化速度放缓，制造或收购执行成本高昂
        - 下轮融资或结构化资本重组可能把价值转移给高级优先股持有人
        - 现金短缺、优先权负担、整合失败或重大项目流失
        - 无法根据指定公开证据估计
    notes: 这些是定性决策条件，不是预测；指定来源不支持任何数值估值区间或概率。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Advanced Navigation 从成立至 2026 年的关键公司、融资、设施、产品和领导层里程碑。
    approximationNotes: 里程碑日期反映公开公告和媒体报道；月份和季度反映已宣布的完成日期。
    data:
      items:
        - date: '2012'
          label: 公司成立
          details: 在澳大利亚悉尼成立，开发 AI 驱动的神经网络惯性导航算法。
        - date: 2019-11
          label: A 轮融资
          details: 获得 $20M A 轮融资，用于扩大全球分销和商业 INS 生产。
        - date: 2021-02
          label: 治理扩展
          details: 前澳大利亚总理 Malcolm Turnbull 被任命为董事会成员。
        - date: 2023-10
          label: Botany 工厂启用
          details: 在 Botany 的 UTS TechLab 揭幕机器人和 AI 制造工厂，扩大 Boreas DFOG 产能。
        - date: 2025-09
          label: Boreas 50 与全球中心
          details: 推出紧凑型 Boreas 50 FOG INS，并宣布在英国和美国设立国际卓越中心。
        - date: 2025-10
          label: 不受 ITAR 约束的国防定位
          details: 正式确立面向 GPS 拒止战术作战环境中国防舰队的不受 ITAR 约束出口定位。
        - date: 2026-03
          label: US$110M C 轮融资
          details: 完成由 Airtree 领投的 US$110M（AUD$158M）C 轮融资，Quadrant 参与，并包含 NRFC 的 $50M 优先股投资。
        - date: 2026-06
          label: Huntsville 与 EMEA 扩张
          details: 在美国阿拉巴马州 Huntsville 建立美国 PNT 卓越中心，并任命 EMEA 董事总经理。
    claimRefs:
      - CO011
      - CO012
  - id: FM001
    title: 市场规模视角：有约束的保障型 PNT 需求层级
    type: pyramid
    summary: 市场可触达性金字塔从广泛的全球 GNSS 依赖型基础设施，逐层收窄至不受 ITAR 约束的可服务惯性硬件需求。
    data:
      items:
        - label: 全球 GNSS 依赖型民用与国防运营
          value: Macro Base
          detail: 全球每天超过 100,000 个商业航班，以及大量易受卫星信号拒止影响的军事资产。
        - label: 受争议环境下的国防与自主平台
          value: Core Market
          detail: 在已知干扰和欺骗冲突区运行的空中、陆地、海上和水下平台。
        - label: 韧性 PNT 与替代导航架构
          value: Addressable Architecture
          detail: 结合惯性、光学和声学模态的多传感器融合架构。
        - label: 战术与战略惯性导航硬件（INS）
          value: Hardware TAM
          detail: 能在没有外部参考信号的情况下运行的 FOG 和 MEMS 导航系统。
        - label: 不受 ITAR 约束的盟国国防与商业自主系统
          value: Serviceable TAM (SAM)
          detail: 面向美国、欧洲和澳大利亚盟国国防主承包商及机器人 OEM 的出口灵活型导航硬件。
        - label: Advanced Navigation 已证实的部署足迹
          value: 100k+ Units / 2.8k Clients
          detail: 已在 70+ 个国家实现生产部署，80%+ 的收入来自美国和欧洲。
    approximationNotes: 层级边界代表运营和监管约束，而非单一来源经审计的金融市场总额；顶层反映平台整体脆弱性，底层反映可实现的组件采购。
    claimRefs:
      - CM002
      - CM006
      - CM008
      - CM011
  - id: FP001
    title: 竞争定位图：国防级保障能力与部署速度
    type: quadrant
    summary: 将导航替代方案按电子战韧性 / PNT 保障能力（Y 轴）以及采购敏捷性和不受 ITAR 约束的可及性（X 轴）进行战略定位。
    approximationNotes: 定位基于记录在案的电子战表现（APEX 试验）、FAA 干扰脆弱性分析及已发布的 ITAR 出口管制分类，在 0–10 量表上进行定性序数评分。
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
      - CP014
      - CP015
    data:
      points:
        - label: Advanced Navigation（Boreas FOG）
          x: 8.5
          'y': 8.8
          note: 电子战韧性高，可在数周内完成不受 ITAR 约束的全球交付
        - label: Advanced Navigation（Certus MEMS）
          x: 8.8
          'y': 6.5
          note: 敏捷、低 SWaP-C 的战术 MEMS，符合 MIL-STD 资质
        - label: Honeywell Aerospace（RLG/FOG）
          x: 2.5
          'y': 9.5
          note: 历史积淀和战略精度最高；成本高且受 ITAR 限制
        - label: Northrop Grumman（战略 INS）
          x: 2
          'y': 9.2
          note: 根基深厚的国防主承包商；采购交付周期多年
        - label: SBG Systems（战术 MEMS）
          x: 7.5
          'y': 5.2
          note: 商业 / 双用途敏捷，但战略级 FOG 保持能力有限
        - label: 商业 GNSS / RTK 接收机
          x: 9.2
          'y': 1.5
          note: 可即时获得；对干扰或欺骗完全没有韧性
        - label: 内部定制集成
          x: 4
          'y': 4.5
          note: NRE 成本高、维护负担重；传感器性能不稳定
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 客户运营需求通过垂直整合的硬件制造、软件许可和持续国防服务，转化为收入和毛利。
    approximationNotes: 流程图展示商业变现路径；收入实现时间会随采购周期变化。
    data:
      nodes:
        - label: 客户运营需求
          description: 国防、海事和自主系统运营商识别 GPS 拒止环境下的导航需求
        - label: 采购与评估
          description: 通过不受 ITAR 约束的开放架构和 COTS 集成快速取得资质
        - label: 核心硬件交付
          description: 直接销售 MEMS 和 FOG 导航系统（$500-$50,000/台 ASP）
        - label: 软件与传感器辅助
          description: Kinematica 后处理软件许可和固件升级带来经常性收入
        - label: 生命周期支持与服务
          description: 通过区域 COE 提供多年维护、传感器校准和备件
        - label: 毛利转化
          description: 垂直整合制造支持获取较高毛利率
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI007
  - id: FE001
    title: Advanced Navigation 核心技术与运营架构栈
    type: stack
    summary: 六层架构层级展示从物理光子学和 MEMS 换能器，到 AI 传感器融合，再到任务级自主平台的过渡。
    data:
      layers:
        - label: 物理换能器与光学硬件
          detail: 闭环数字光纤线圈（FOG）、三轴硅 MEMS 加速度计 / 陀螺仪，以及多通道声学水听器阵列
        - label: 嵌入式实时信号采集
          detail: 高速数字信号处理器以 1000 Hz 采样，并配有完整的 -40°C 至 85°C 工厂热校准图
        - label: 深度学习与传感器融合引擎
          detail: 专有神经网络滤波算法动态估计传感器偏差，速度快于经典扩展卡尔曼滤波器
        - label: 电子防护与多星座 GNSS
          detail: 全频段多频 GNSS 接收机搭配硬件电子防护（EP），抵御射频干扰和欺骗
        - label: 统一协议与集成中间件
          detail: 标准化的不受 ITAR 约束通信总线、开放 API 及 Kinematica 云后处理软件
        - label: 任务级自主平台应用
          detail: 地下采矿激光测速传感器混合系统、水下 AUV/ROV 导航、战术 UAS 及装甲车辆 APNT
    approximationNotes: Advanced Navigation 技术架构的概念性呈现，依据已发布技术文档及专利 / 产品披露。
    claimRefs:
      - CE001
      - CE010
      - CE011
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 国防主承包商和企业自主系统运营商的评估、集成及扩张轨迹。
    data:
      items:
        - label: 1. 规格与基准测试
          description: 主承包商依据严格的军用 SWaP-C 和抗干扰基准，评估不受 ITAR 约束的 FOG 和 MEMS 替代方案。
          touchpoints:
            - 技术数据包审阅
            - 不受 ITAR 约束的合规审计
            - 实验室环境测试
        - label: 2. 原型与试点评估
          description: 在测试场地和受争议 GNSS 作战环境中部署评估单元。
          touchpoints:
            - Boreas 和 Certus 评估单元
            - 电子防护验证
            - 传感器融合 API 集成
        - label: 3. 平台架构集成
          description: 直接集成至主承包商车辆任务计算机和战斗炮塔的电气与机械系统。
          touchpoints:
            - CAN Bus、Ethernet 和 RS-422 接口
            - MIL-STD-810 和 MIL-STD-461 测试
            - Lance 炮塔与车辆总线配置
        - label: 4. 主权国防资质认证
          description: 在 Land 400 等大型采购项目下接受政府和国防主承包商资质认证。
          touchpoints:
            - 分包执行
            - 澳大利亚主权供应链审计
            - 本土 PNT 中心支持
        - label: 5. 生产车队部署
          description: 为在产车辆批量制造并交付具备飞行和作战条件的导航单元。
          touchpoints:
            - 分批交付 Boreas D70 单元
            - Boxer CRV 和 Redback IFV 安装
            - Kongsberg PROTECTOR C-UAS 组装
        - label: 6. 项目扩张与车队改装
          description: 面向盟国车辆变体、国际国防销售和无人平台的后续采购。
          touchpoints:
            - Hanwha 国际扩张 MoU
            - 欧洲 NATO 车辆改装
            - 软件维护和传感器升级
    approximationNotes: 各阶段综合公开的国防主承包商采购里程碑和系统集成流程。
    claimRefs:
      - CU005
      - CU007
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 映射 Advanced Navigation 面临的主要技术、运营和监管风险的严重性与可能性矩阵。
    approximationNotes: 根据可获得的国防、监管及公司披露，在可能性和影响维度上进行定性分类。
    data:
      columns:
        - label: 低影响
        - label: 中等影响
        - label: 高影响
      rows:
        - label: GNSS 欺骗导致的滤波器损坏
          note: 虚假 GPS 数据损坏惯性卡尔曼滤波器的运营漏洞
          values:
            - label: 低
              tone: positive
            - label: 中等
              tone: warning
            - label: 高
              tone: negative
        - label: ITAR 双用途重新分类
          note: 澳大利亚 FOG 和 INS 系统可能受到美国 ITAR 出口限制的监管风险
          values:
            - label: 低
              tone: positive
            - label: 中
              tone: warning
            - label: 高
              tone: negative
        - label: 双枢纽扩张执行
          note: 在澳大利亚、英国和美国扩大制造规模时的运营摩擦
          values:
            - label: 低
              tone: positive
            - label: 中
              tone: warning
            - label: 高
              tone: negative
        - label: NRFC 优先股契约
          note: 财务治理约束，要求总部和制造业务留在澳大利亚
          values:
            - label: 低
              tone: positive
            - label: 中
              tone: warning
            - label: 高
              tone: negative
        - label: 关键组件供应瓶颈
          note: 供应链暴露于特种光纤和晶圆厂组件的交付周期
          values:
            - label: 中等
              tone: positive
            - label: 中
              tone: warning
            - label: 高
              tone: negative
        - label: 盟友国防预算周期
          note: 鉴于超过 80% 的收入集中在美国和欧洲，国防采购延迟带来的市场风险
          values:
            - label: 低
              tone: positive
            - label: 中等
              tone: warning
            - label: 高
              tone: negative
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR013
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 决策先看市场相关性和规模信号，再经过证据与定价关卡，最终给出继续研究的建议。
    data:
      nodes:
        - label: 任务需求
          detail: GPS 信号减弱或受阻时仍能保持导航连续性
        - label: 商业信号
          detail: C 轮融资、据称的部署数据和地域收入结构
        - label: 扩张计划
          detail: 区域制造、工程能力和潜在收购
        - label: 证据关卡
          detail: 核实经审计收入、利润率、烧钱速度、订单积压和收入集中度
        - label: 定价关卡
          detail: 核实投后估值和优先证券的分配瀑布
        - label: 决策
          detail: 继续研究；公开证据不足以给出价格或目标回报
      edges:
        - - Mission need
          - Commercial signals
        - - Commercial signals
          - Expansion plan
        - - Expansion plan
          - Evidence gate
        - - Evidence gate
          - Price gate
        - - Price gate
          - Decision
    approximationNotes: 该流程是定性的投资评估顺序，不代表量化转化率或概率。
    claimRefs:
      - CV011
      - CV012
      - CV015
      - CV016
