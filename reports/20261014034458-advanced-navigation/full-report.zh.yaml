              - CM008
              - CM011
      - number: '2.3'
        title: 买方细分、采用驱动因素与生产约束
        blocks:
          - type: paragraph
            body: >-
              保障型 PNT 的需求集中在四类买方：盟国国防主承包商、无人机器人 OEM、海底及海事运营商，以及商用航空航天机队。国防场景中，Anduril、Rheinmetall 和 Hanwha
              等主集成商需要能快速接入模块化车辆架构的韧性导航载荷。Advanced Navigation 的一项关键优势，是总部在澳大利亚且采用无 ITAR 设计理念，绕开长达数年的美国出口授权瓶颈，也便于在 NATO 和
              AUKUS 盟国间互操作。NOAA 等政府机构以及 Intuitive Machines 等商业月球项目，则是在 GPS
              物理上不可用的极端或外太空环境中运行、对可靠性要求极高的采用者。不过，市场采用速度仍受明显的结构性约束。惯性导航硬件是专门的制造门类，扩产不能靠通用电子代工完成，而要配备专用洁净室、精密光学对准和多温度校准。接受未经验证卫星更新的混合导航架构还容易受到欺骗信号污染，因此必须配套严格的电子防护软件。国防项目的供应商认证周期通常为
              12 至 24 个月，供应商还需证明具备本地支持基础设施。
            claimRefs:
