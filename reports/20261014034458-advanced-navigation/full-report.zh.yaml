  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation 是一家由 Xavier Orr 和 Chris Shaw 于 2012 年在悉尼创立的澳大利亚深科技公司，专注开发和制造高精度保障型定位、导航与授时（APNT）系统，服务于
              GNSS 和 GPS 信号受争夺、干扰、欺骗或完全不可用的环境。公司将战术级 MEMS 与战略级 DFOG 高精度惯性测量硬件，接入名为 AdNav Intelligence 的自研 AI
              深度学习传感器融合软件，为空中、陆地、海上、水下和太空领域提供自主导航。公司在澳大利亚运营垂直整合的硬件制造体系，并向美国和欧洲扩张，配备自动化生产、校准和耐压测试设施。商业化依靠直接 OEM
              销售、国防主承包商集成，以及面向全球 70 个国家超过 2,800 家客户的软件后处理许可。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
