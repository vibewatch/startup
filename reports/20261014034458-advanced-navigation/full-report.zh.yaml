        blocks:
          - type: paragraph
            body: >-
              公司高管和董事会治理把深科技技术专长与高层机构及政治监督结合起来。联合创始人 Chris Shaw 现任 CEO，在原联合创始人 Xavier Orr 完成领导层交接后负责执行战略和全球扩张。管理团队还包括
              CFO Tom Pereira、CTO Pawel Michalak、首席供应链官 Shane Albances、首席人事官 Adrian West 和 CRO Christopher
              McNamara。董事会由澳大利亚前总理 Malcolm Turnbull 主持；他于 2021 年加入董事会，支持国际国防、航空航天和主权工业战略。机构投资者在董事会拥有重要席位，包括代表 Airtree
              Ventures 的 Kelland Reilly 和代表 Quadrant 的 Louis Casey。资深机构董事缓解了早期治理不足，但公司仍明显依赖联合创始人 Chris Shaw，以及负责核心 DFOG
              知识产权的光子学和算法工程领导层。
