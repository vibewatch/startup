              - CE013
      - number: '5.4'
        title: 无 ITAR 供应链、全球制造扩张与质量标准
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation
              相比盘踞已久的美国国防主承包商，最主要的战略差异在于无国际武器贸易条例（ITAR）的监管架构和垂直整合供应链。传统惯性导航供应商往往设置多年采购周期和繁重的再出口许可控制，拖慢盟国国防集成及 NATO
              联合自主项目。Advanced Navigation 发源于澳大利亚悉尼，光学线圈和传感器组件不使用受限美国国防物项，因此国际客户无需经历国务院出口摩擦，就能部署高性能战术和战略级 PNT 系统。2026 年 3
              月，在 Airtree Ventures 和 Quadrant Private Equity 领投的 110 million US dollar Series C
              融资后，公司启动激进的全球制造扩张。除澳大利亚和英国的生产中心外，Advanced Navigation America 还在 Alabama 州 Huntsville
              建立专门的定位、导航与授时卓越中心，扩大光学、MEMS 和量子传感硬件的本地制造。公司按 MIL-STD-810 环境冲击与振动标准及 MIL-STD-461
              电磁兼容规范，对商用和国防硬件进行严格认证，确保战术无人平台和装甲平台具备经过验证的韧性。
            claimRefs:
