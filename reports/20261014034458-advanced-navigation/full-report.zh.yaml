              Advanced Navigation 的产品组合采用宽幅定价，从约 $500 的入门级传感器，到单台最高 $50,000 的高精度战略级惯性导航系统。入门级 MEMS
              姿态和航向参考系统服务于商业机器人与测量应用，这些场景最看重成本效率以及低尺寸、重量和功耗（SWaP）。相比之下，高端 Boreas
