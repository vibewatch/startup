      - number: '5.2'
        title: 运营工作流、地下部署与受争夺战场
        blocks:
          - type: paragraph
            body: >-
              自主化运营经常需要在恶劣环境中高精度航位推算，此时卫星信号可能被电子反制完全阻断、退化或蓄意拒止。在地下采矿环境，深厚岩层完全隔绝卫星接收，重矿化又会造成严重磁异常，干扰传统电子罗盘。Advanced
              Navigation 把 Boreas D90 FOG INS 与激光测速传感器（LVS）配对，形成一套地下综合里程计。2025 年 8 月，在芬兰 Pyhäsalmi
              欧洲最深地下矿中的严格多轮测试里，系统在地下 1.4 kilometers、全长 22.9 kilometers 的线路上运行，不依赖既有地图或外部无线电信标，定位精度优于总行程的 0.1
              percent。在国防行动中，无人平台会遭遇高功率射频干扰和协同 GPS 欺骗等复杂电子战威胁。Advanced Navigation
              通过快速真北寻向陀螺罗经和紧密集成的电子防护模块，让舰艇、无人机系统和装甲作战车辆在敌方干扰切断卫星链路时，仍能维持可靠的定位、姿态和目标遥测。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: 光学传感器架构、AI 传感器融合与电子防护
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation
              的技术架构与传统惯性系统明显不同：它用自研深度学习传感器融合算法替代经典扩展卡尔曼滤波。经典卡尔曼滤波依赖线性化高斯噪声假设，遇到动态冲击、非线性电机谐波或突发多轴加速度峰值时，常会发散或累积系统性偏差。Advanced
              Navigation 的神经网络融合引擎以 1000 Hz 运行，持续建模非线性传感器误差参数、热漂移曲线和 g 敏感度变化，覆盖 minus 40 至 85 degrees Celsius
              的完整工作范围。在光学硬件中，公司的数字 FOG 技术采用自研自动绕线和光电信号处理，在缩小物理外壳体积的同时达到战略级光学干涉灵敏度。为防御敌对电子战，硬件集成电子防护（EP）电路和全频段多星座 GNSS
              接收器，分析输入信号特征、识别射频欺骗异常，并自动隔离受污染的卫星观测值。任务结束后，Kinematica 云软件读取原始惯性和 GNSS 测量数据，通过自动差分基站修正，最高可将精度提升 200 times。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE010
              - CE011
