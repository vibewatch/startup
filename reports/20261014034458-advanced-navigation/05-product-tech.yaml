- id: operational-workflows-and-gps-denied-environments
  title: Operational Workflows, Subterranean Deployments, and Contested Battlefields
  body: Operational autonomy frequently demands high-precision dead reckoning in harsh environments where satellite signals are entirely blocked, degraded, or deliberately denied by electronic countermeasures. In subterranean mining environments, deep rock overburden completely eliminates satellite reception, while heavy mineralization induces severe magnetic anomalies that disrupt classical electronic compasses. Advanced Navigation addresses this extreme operational envelope by pairing its Boreas D90 FOG INS with a Laser Velocity Sensor (LVS), creating an integrated subterranean odometry package. In August 2025, rigorous multi-run trials conducted in Europe's deepest underground mine in Pyhäsalmi, Finland—operating 1.4 kilometers beneath the surface across a 22.9 kilometer subterranean circuit—demonstrated positioning accuracy better than 0.1 percent of total distance traveled without relying on pre-existing maps or external radio beacons. In defense operations, uncrewed platforms encounter
    sophisticated electronic warfare threats, including high-power radio frequency jamming and coordinated GPS spoofing. By providing rapid North-seeking gyrocompassing and tightly integrated electronic protection modules, Advanced Navigation ensures naval vessels, uncrewed aerial systems, and armored combat vehicles sustain assured positioning, orientation, and targeting telemetry when adversary jamming severs satellite links.
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
