callouts:
- calloutType: strength
  title: Strategic Moat in ITAR-Free Assured PNT and Vertically Integrated FOG Manufacturing
  body: Advanced Navigation differentiates itself from legacy defense suppliers by offering strategic-grade FOG and tactical MEMS navigation systems completely free of US ITAR export restrictions. By establishing vertically integrated manufacturing across Australia, the United Kingdom, and the United States, the company bypasses multi-year procurement delays typical of legacy primes, enabling rapid integration into NATO and allied autonomous defense platforms.
  claimRefs:
  - CE001
  - CE005
  - CE014
- calloutType: risk
  title: Field Reliability and Subterranean Environmental Robustness Under Electronic Warfare
  body: While Advanced Navigation demonstrated sub-0.1% drift in controlled subterranean mining trials, scaling these systems into contested military operations exposes dependencies on auxiliary sensor aiding and electronic protection resilience. Without verified independent electronic warfare range telemetry, the long-term drift characteristics of pure inertial dead reckoning remain an underwriting uncertainty.
