- id: FE001
  title: Advanced Navigation Core Technology and Operating Architecture Stack
  type: stack
  summary: Six-layer architectural hierarchy depicting the transition from physical photonics and MEMS transducers through AI sensor fusion to mission-level autonomous platforms.
