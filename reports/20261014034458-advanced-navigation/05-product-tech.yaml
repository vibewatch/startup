    layers:
    - label: Physical Transducers & Optical Hardware
      detail: Closed-loop digital fiber-optic coils (FOG), triaxial silicon MEMS accelerometers/gyros, and multi-channel acoustic hydrophone arrays
    - label: Embedded Real-Time Signal Acquisition
      detail: High-speed digital signal processors sampling at 1000 Hz with full -40°C to 85°C factory thermal calibration maps
    - label: Deep Learning & Sensor Fusion Engine
      detail: Proprietary neural network filter algorithms dynamically estimating sensor biases faster than classical extended Kalman filters
    - label: Electronic Protection & Multi-Constellation GNSS
      detail: All-band multi-frequency GNSS receivers paired with hardware Electronic Protection (EP) against RF jamming and spoofing
    - label: Unified Protocol & Integration Middleware
      detail: Standardized ITAR-free communication bus, open APIs, and Kinematica cloud post-processing software
    - label: Mission-Level Autonomous Platform Applications
      detail: Subterranean mining Laser Velocity Sensor hybrids, subsea AUV/ROV navigation, tactical UAS, and armored vehicle APNT
