companyProfile:
  summary: >-
    Advanced Navigation is an Australian assured-PNT manufacturer that builds inertial, FOG- and MEMS-based navigation
    systems plus software-enhanced autonomy tooling for GPS-denied environments across defense, maritime, mining, and
    related autonomous platforms. The company is headquartered in Sydney, operates vertically integrated production and
    testing facilities in Australia while expanding in the United States and Europe, and disclosed a March 2026 Series C
    alongside claims of more than 100,000 deployed systems and more than 2,800 clients across 70 countries. Public
    evidence shows strong strategic demand and capital backing, but it does not disclose audited economics or the full
    capitalization waterfall.
  headquarters: Sydney, Australia
  foundingLocation: Sydney, Australia
  productSummary: >-
    Assured-PNT navigation hardware and software, including inertial navigation systems, FOG-based products, and
    autonomy systems for GNSS-denied environments.
  customerFocus: >-
    Defense, maritime, mining, aerospace, and other autonomy-heavy operators that need navigation when GPS is weak,
    jammed, spoofed, or unavailable.
  businessModel: Primarily hardware-led systems sales with associated integration and software-enabled value capture.
  stage: Late private / Series C
  fundingStatus: >-
    March 2026 Series C financing of US$110 million (AUD$158 million) with Airtree Ventures, Quadrant Private Equity,
