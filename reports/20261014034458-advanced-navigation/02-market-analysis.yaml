callouts:
- calloutType: insight
  title: Assured PNT as an Industrial Manufacturing Bottleneck
  body: The strategic bottleneck in assured PNT has shifted from algorithmic proof-of-concept to precision hardware scaling.
    Fabricating navigation-grade inertial systems requires specialist optical assembly, rigorous thermal calibration, and
    supply chain control that cannot be replicated via generic electronics manufacturing.
  claimRefs:
  - CM002
  - CM008
- calloutType: risk
  title: Regulatory and Export Impediments Shaping Allied Demand
  body: Strict ITAR export controls historically limited international defense collaboration and lengthened procurement lead
    times to multiple years. Advanced Navigation's Australian-engineered, ITAR-free architecture enables faster allied adoption
    across NATO and AUKUS partners but faces increasing competition from localized defense production mandates.
  claimRefs:
  - CM005
  - CM012
