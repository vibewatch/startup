callouts:
  - calloutType: "risk"
    title: "Persistent Spoofing Vulnerabilities in Inertial Integration"
    body: "Federal aviation and infrastructure security evaluations demonstrate that sophisticated GNSS spoofing poses insidious operational risks to integrated navigation architectures. Corrupted satellite signals can bias inertial navigation system Kalman filters, causing systems to report false position solutions that persist even after exiting an active interference zone."
    claimRefs:
      - "CR005"
      - "CR006"
  - calloutType: "insight"
    title: "Strategic Tradeoffs in Sovereign Capital Covenants"
    body: "While the National Reconstruction Fund Corporation's $50 million investment provides essential non-dilutive preferred equity to scale domestic manufacturing, its statutory charter legally anchors Advanced Navigation's headquarters and primary R&D in Australia, limiting corporate restructuring options if foreign defense procurement mandates onshore manufacturing shifts."
    claimRefs:
      - "CR013"
      - "CR014"
