figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Evaluation, integration, and expansion trajectory of defense primes and enterprise autonomous system operators.
  data:
    items:
    - label: 1. Specification & Benchmarking
      description: Primes evaluate ITAR-free FOG and MEMS alternatives against strict military SWaP-C and jamming resilience
        benchmarks.
      touchpoints:
      - Technical data package review
      - ITAR-free compliance audit
      - Laboratory environmental testing
    - label: 2. Prototyping & Pilot Evaluation
      description: Field deployment of evaluation units across test ranges and contested GNSS operational environments.
      touchpoints:
      - Boreas and Certus evaluation units
      - Electronic protection validation
      - Sensor fusion API integration
    - label: 3. Platform Architecture Integration
      description: Direct electrical and mechanical integration into prime vehicle mission computers and combat turrets.
      touchpoints:
      - CAN Bus, Ethernet, and RS-422 interface
      - MIL-STD-810 and MIL-STD-461 testing
      - Lance turret & vehicle bus configuration
    - label: 4. Sovereign Defense Qualification
      description: Government and defense prime qualification under major procurement programs such as Land 400.
      touchpoints:
      - Subcontract execution
      - Australian sovereign supply chain audit
      - Onshore PNT center support
    - label: 5. Production Fleet Deployment
      description: Serial manufacturing and delivery of flight- and combat-ready navigation units for active vehicle production.
      touchpoints:
      - Batch delivery of Boreas D70 units
      - Boxer CRV and Redback IFV installation
      - Kongsberg PROTECTOR C-UAS assembly
    - label: 6. Program Expansion & Fleet Retrofit
      description: Follow-on procurement across allied vehicle variants, international defense sales, and uncrewed platforms.
      touchpoints:
      - Hanwha international expansion MoU
      - European NATO vehicle retrofits
      - Software maintenance and sensor upgrades
  approximationNotes: Stages synthesize public defense prime procurement milestones and system integration workflows.
