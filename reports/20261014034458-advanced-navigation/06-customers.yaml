company:
  name: Advanced Navigation
chapter:
  number: 6
  title: Customers
  summary: Advanced Navigation has delivered over 100,000 navigation systems to more than 2,800 global clients, securing major
    defense prime subcontracts with Hanwha, Rheinmetall, and Kongsberg across allied armored vehicle and counter-UAS programs.
    Over 80 percent of revenue is concentrated in the US and Europe, though long-term customer retention, ARR visibility,
    and conversion of broad collaboration agreements into binding production orders remain critical diligence questions.
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation and Geographic Footprint
  body: Advanced Navigation maintains a bifurcated customer base spanning commercial robotics and defense prime integrators
    across 70 countries globally. The commercial base encompasses over 2,800 clients utilizing acoustic positioning and MEMS
    inertial sensors in offshore survey, subsea robotics, and industrial automation. However, enterprise customer spending
    and top-line expansion are overwhelmingly concentrated in allied defense and government programs. United States and European
    markets account for greater than 80 percent of consolidated revenues, where defense primes seek ITAR-free assured positioning,
    navigation, and timing (APNT) solutions to replace legacy hardware. In addition to defense vehicles, high-profile commercial
    and space clients include BHP in mining haulage, Anduril in autonomous defense platforms, NOAA in maritime research, and
    Intuitive Machines in lunar exploration, providing cross-domain validation across land, sea, air, and space environments.
  claimRefs:
  - CU001
  - CU003
  - CU012
  - CU013
  tableRefs:
  - TU001
- id: adoption-trajectory-and-scale
  title: Adoption Trajectory and Volume Deployment Scale
  body: Cumulative system deliveries have exceeded 100,000 units globally, illustrating meaningful commercial and tactical
    manufacturing scale. Recent customer demand has accelerated sharply due to acute electronic warfare pressures, with international
    aviation and defense organizations reporting a 67 percent increase in GNSS jamming and a 193 percent surge in signal spoofing
    incidents between 2023 and 2025. In response to contested navigation environments across Eastern Europe and the Middle
    East, Advanced Navigation reported triple-digit revenue growth in the EMEA theater during the twelve months leading into
    mid-2026. To support surging operational procurement from NATO and allied defense forces, the company doubled its workforce
    and initiated the rollout of dedicated PNT Centers of Excellence across the United Kingdom, Europe, and the United States
    to deliver local engineering support, calibration, and sovereign supply integration.
  claimRefs:
  - CU002
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU002
- id: named-customer-deployments
  title: Named Customer Proof and Defense Prime Subcontracts
  body: Advanced Navigation has successfully converted initial platform evaluations into high-value sovereign production contracts
    with leading international defense contractors. Under Australia Land 400 Phase 3 program, Hanwha Defence Australia awarded
    the company an 8.7 million Australian dollar subcontract to supply 138 Boreas D70 digital fiber-optic gyroscope (DFOG)
    systems for Redback infantry fighting vehicles. This builds upon an established partnership with Rheinmetall Defence Australia,
    which initially integrated over 200 FOG INS units into Boxer Combat Reconnaissance Vehicles under Land 400 Phase 2 in
    2021 before executing a multi-million-dollar follow-on contract in late 2024. Additionally, Kongsberg Defence & Aerospace
    selected the Boreas navigation architecture for integration into hundreds of PROTECTOR counter-unmanned aerial systems
    (C-UAS) platforms, establishing the company as an embedded subsystem provider across heavy armor, combat reconnaissance,
    and counter-drone domains.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  tableRefs:
  - TU003
- id: retention-expansion-and-concentration-risks
  title: Customer Journey, Expansion Friction, and Concentration Risks
  body: The customer procurement journey in mission-critical defense and autonomy markets is characterized by rigorous multi-year
    qualification cycles followed by long-tail production deployments. Advanced Navigation differentiates against traditional
    prime contractors by delivering ITAR-free hardware with standard digital interfaces (CAN Bus, Ethernet, RS-422), enabling
    integrators to bypass bureaucratic export delays and compress development timelines from years to months. Nevertheless,
    significant diligence risks remain regarding customer concentration and order durability. While broad framework agreements
    like the global Hanwha memorandum of understanding signal strong strategic alignment, they do not guarantee binding purchase
    volumes. Furthermore, the company does not disclose net revenue retention (NRR), customer churn, software subscription
    attach rates, or single-client revenue concentration, leaving the long-term durability of hardware replacement cycles
    unverified.
  claimRefs:
  - CU007
  - CU010
  - CU014
  - CU015
  figureRefs:
  - FU001
