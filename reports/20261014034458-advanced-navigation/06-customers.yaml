callouts:
- calloutType: strength
  title: High-Profile Tier-1 Defense Prime Integration
  body: Advanced Navigation has established firm production footholds in major allied armored vehicle programs, supplying
    138 Boreas D70 units to Hanwha for the Land 400 Phase 3 Redback IFV and over 200 FOG INS systems to Rheinmetall for the
    Boxer CRV. These multi-million-dollar subcontracts validate strategic-grade hardware maturity and sovereign defense supplier
    positioning.
  claimRefs:
  - CU008
  - CU009
- calloutType: risk
  title: Contract Binding Friction and Customer Concentration Opacity
  body: Despite expansive collaboration agreements such as the global Hanwha memorandum of understanding, public defense prime
    announcements often lack immediate binding production contracts. Furthermore, with over 80 percent of revenue concentrated
    in US and European defense markets, the company has not disclosed single-customer concentration metrics or commercial
    retention durability.
  claimRefs:
  - CU003
  - CU010
  - CU015
