    title: "ITAR-Free Status as a Geopolitical and Procurement Catalyst"
    body: "Advanced Navigation's Australian manufacturing base and non-ITAR classification remove months or years of U.S. State Department licensing friction for allied defense forces. In an operating climate where NATO allies and AUKUS partners require interoperable autonomous capabilities, export agility enables rapid fleet modernizations that traditional U.S. primes cannot match under International Traffic in Arms Regulations."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP007"
  - calloutType: "risk"
    title: "Incumbent Program-of-Record Moats and Customer Switching Inertia"
    body: "While Advanced Navigation offers superior procurement speed and modern multi-sensor fusion, established defense primes such as Honeywell and Northrop Grumman hold multi-decade flight-safety certifications and entrenched positions in major military programs of record. Overcoming institutional procurement inertia in tier-1 Western platforms requires sustained field validation and costly platform-level qualification testing."
