evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Series C Cap Table and Liquidation Preferences
    missingEvidence: >-
      Audited capitalization table disclosing post-money valuation, preferred equity liquidation preferences, and
      downside protection terms for the NRFC $50M tranche.
    whyItMatters: >-
      Without valuation and preference seniority disclosures, downside risk and true enterprise equity value cannot be
      verified for common and minority investors.
    diligencePath: >-
      Request confidential Series C term sheet, shareholders agreement, and capitalization table during primary sponsor
      diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: Consolidated Financials and Cash Burn
    missingEvidence: >-
      Audited consolidated income statement, gross margin breakdown across hardware vs. software/services, and cash burn
      rate.
    whyItMatters: >-
      Prevents independent assessment of operating leverage, unit economics, and cash runway following the Series C
      expansion.
    diligencePath: Obtain statutory audited financial statements filed with ASIC or require management reporting pack.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-revenue-breakdown
    missingEvidence: >-
      Audited financial breakdown distinguishing hardware unit sales, recurring software/algorithm licensing, and
      regional support services across Advanced Navigation's US, European, and Australian revenue streams.
    whyItMatters: >-
      Without segmented product-line revenue data, investors cannot verify the gross margin profile, durability, or
