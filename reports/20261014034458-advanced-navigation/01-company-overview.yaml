  title: Vertically Integrated Sovereign Manufacturing
  body: Advanced Navigation operates automated domestic manufacturing across Sydney and Huntsville, combining automated assembly
    and sensor calibration to deliver ITAR-free inertial systems with significantly shorter lead times than legacy defense
    contractors.
  claimRefs:
