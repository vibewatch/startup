company:
  name: Advanced Navigation
chapter:
  number: 1
  title: Company Overview
  summary: Advanced Navigation is an Australian deep-tech autonomous navigation manufacturer founded in Sydney, specializing
    in AI-driven assured positioning, navigation, and timing (APNT) systems for GPS-denied environments across defense, commercial,
    and subsea markets. In March 2026, the company secured a US$110M (AUD$158M) Series C financing round led by Airtree Ventures
    with Quadrant Private Equity and a $50M preferred equity commitment from Australia's National Reconstruction Fund Corporation
    (NRFC). Despite reporting deployment of over 100,000 systems and rapid international expansion across Huntsville, Alabama,
    and Europe, consolidated revenue, operating margins, valuation cap-table mechanics, and exact governance rights remain
    undisclosed private metrics.
sections:
- id: corporate-identity-and-mission
  title: Corporate Identity, Product Architecture, and Business Model
  body: Advanced Navigation is an Australian deep-technology company founded in Sydney in 2012 by Xavier Orr and Chris Shaw.
    The company specializes in the development and manufacture of high-accuracy assured positioning, navigation, and timing
    (APNT) systems designed specifically for environments where Global Navigation Satellite Systems (GNSS) and GPS signals
    are contested, jammed, spoofed, or wholly unavailable. By coupling high-precision inertial measurement hardware—including
    tactical-grade Micro-Electro-Mechanical Systems (MEMS) and strategic-grade Digital Fiber-Optic Gyroscope (DFOG) sensors—with
    proprietary artificial intelligence and deep-learning sensor fusion software called AdNav Intelligence, Advanced Navigation
    provides autonomous navigation solutions across air, land, maritime, subsea, and space domains. The company operates a
    vertically integrated hardware manufacturing model with automated production, calibration, and pressure-tolerant testing
    facilities located across Australia and expanding into the United States and Europe. Commercialization is driven by direct
    OEM sales, defense prime contractor integrations, and ongoing software post-processing licensing across more than 2,800
    clients and 70 countries globally.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO013
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership Structure, Governance, and Key-Person Dependencies
  body: The company’s executive leadership and board governance combine technical deep-tech expertise with high-level institutional
    and political oversight. Advanced Navigation was co-founded by Chief Executive Officer Chris Shaw, who now leads executive
    strategy and global expansion following the leadership transition from original co-founder Xavier Orr. The broader executive
    bench includes Chief Financial Officer Tom Pereira, Chief Technology Officer Pawel Michalak, Chief Supply Chain Officer
    Shane Albances, Chief People Officer Adrian West, and Chief Revenue Officer Christopher McNamara. Governance is anchored
    by a formal board of directors chaired by former Australian Prime Minister Malcolm Turnbull, who joined the board in 2021
    to support international defense, aerospace, and sovereign industrial strategy. Institutional investors hold significant
    board representation, including Kelland Reilly representing lead venture investor Airtree Ventures and Louis Casey representing
    private equity backer Quadrant. While the presence of seasoned institutional directors mitigates early-stage governance
    deficits, Advanced Navigation maintains meaningful key-person exposure to co-founder Chris Shaw and specialized photonics
    and algorithmic engineering leadership responsible for its core DFOG intellectual property.
  claimRefs:
  - CO004
  - CO005
  - CO014
  tableRefs:
  - TO002
- id: capitalization-and-stakeholders
  title: Capitalization History, Series C Financing, and Investor Structure
  body: Advanced Navigation has funded its research, product commercialization, and global production buildout through successive
    venture capital, private equity, and sovereign strategic equity rounds. After an initial AUD$20 million financing round
    in 2019, the company completed a major Series C funding round in March 2026 raising US$110 million (equivalent to AUD$158
    million). The round was led by Australian venture capital firm Airtree Ventures, with participation from Quadrant Private
    Equity’s Strategic Equity Fund and the Commonwealth of Australia’s National Reconstruction Fund Corporation (NRFC). The
    NRFC contributed AUD$50 million through a structured preferred equity investment under its statutory remit to anchor sovereign
    defense and high-tech manufacturing within Australia. Prior institutional investors include Main Sequence Ventures, In-Q-Tel,
    KKR, and Alpha Intelligence Capital. However, post-money valuation, liquidation preferences, coupon or hurdle rights attached
    to the NRFC preferred equity tranche, and minority shareholder protections remain confidential, creating material opacity
    for external underwriting regarding common share dilution and liquidation priority.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO010
  tableRefs:
  - TO003
- id: scale-expansion-and-milestones
  title: Manufacturing Footprint, International Scale, and Strategic Milestones
  body: From its initial research foundation in Sydney, Advanced Navigation has achieved rapid industrial and geographic expansion
    across key allied defense markets. The company operates a dedicated high-tech robotics manufacturing facility established
    in Botany, New South Wales, in collaboration with the University of Technology Sydney TechLab, which houses automated
    manufacturing lines for its Boreas DFOG product family. To satisfy soaring demand from NATO-allied defense programs and
    mitigate lead-time vulnerabilities, Advanced Navigation launched international PNT Centers of Excellence, including a
    dedicated facility in Huntsville, Alabama, serving U.S. defense primes and the Department of War, alongside a European
    headquarters and UK Center of Excellence. Over 80% of company revenues are generated outside Australia in the United States
    and Europe. The company has deployed over 100,000 systems globally and maintains strategic prime partnerships with Kongsberg
    Defence & Aerospace, Anduril, Hanwha, and Intuitive Machines for NASA Commercial Lunar Payload Services.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
