              - CI003
              - CI004
              - CI005
              - CI007
      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation cost architecture is anchored by an aggressive vertical integration strategy across
              design, sensor manufacturing, automated calibration, and final assembly. Rather than outsourcing precision
              subcomponents to specialized third-party foundries, the company maintains internal production
              infrastructure, including a dedicated robotics manufacturing facility at the University of Technology
              Sydney TechLab in Botany, New South Wales. This integrated footprint encompasses cleanroom equipment,
              machine learning-assisted calibration, and automated assembly for its Boreas DFOG product family.
              Executive disclosures indicate that Advanced Navigation achieved operational profitability by its ninth
              operational month, suggesting disciplined early cash generation from foundational hardware sales. However,
              unit-level gross margins, direct bill-of-materials costs, and recurring service-delivery overhead remain
              undisclosed in public disclosures, creating an analytical gap regarding the true incremental margin
              profile of its high-volume manufacturing lines versus high-touch defense customization.
            claimRefs:
              - CI006
              - CI008
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI015
      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              On commercial traction, Advanced Navigation claims deliveries to over 2,800 customers across more than 70
              countries globally, paired with executive revenue targets of more than US$100 million and aspirational
              year-on-year doubling. In its latest funding milestone, the company closed a $158 million Series C round
              led by Airtree Ventures with participation from Quadrant Private Equity and Australia National
              Reconstruction Fund Corporation, which contributed $50 million in sovereign capital. Management has
