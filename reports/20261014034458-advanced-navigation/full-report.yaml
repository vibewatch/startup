figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Key corporate, financing, facility, product, and leadership milestones for Advanced Navigation from founding
      through 2026.
    approximationNotes: >-
      Milestone dates reflect public announcements and media coverage; months and quarters reflect announced completion
      dates.
    data:
      items:
        - date: '2012'
          label: Company Founding
          details: Founded in Sydney, Australia, developing AI-driven neural network inertial navigation algorithms.
        - date: 2019-11
          label: Series A Financing
          details: Secured $20M Series A financing to expand global distribution and commercial INS production.
        - date: 2021-02
          label: Governance Expansion
          details: Former Australian Prime Minister Malcolm Turnbull appointed to board of directors.
        - date: 2023-10
          label: Botany Facility Opening
          details: Unveiled robotics and AI manufacturing facility at UTS TechLab in Botany, scaling Boreas DFOG production.
        - date: 2025-09
          label: Boreas 50 & Global Centers
          details: Launched Boreas 50 compact FOG INS and announced international Centers of Excellence across UK and US.
        - date: 2025-10
          label: ITAR-Free Defense Positioning
          details: Formalized ITAR-free export positioning for defense fleets in GPS-denied tactical operational environments.
        - date: 2026-03
          label: US$110M Series C Round
          details: Completed US$110M (AUD$158M) Series C led by Airtree with Quadrant and $50M NRFC preferred equity.
        - date: 2026-06
          label: Huntsville & EMEA Expansion
          details: Established US PNT Center of Excellence in Huntsville, Alabama, and appointed EMEA Managing Director.
    claimRefs:
      - CO011
      - CO012
  - id: FM001
    title: 'Market Sizing Lens: Constrained Tiers of Assured PNT Demand'
    type: pyramid
    summary: >-
      Constrained market addressability pyramid cascading from broad global GNSS-dependent infrastructure down to
      ITAR-free serviceable inertial hardware demand.
    data:
      items:
        - label: Global GNSS-Dependent Civil and Defense Operations
          value: Macro Base
          detail: Over 100,000 global commercial flights daily and vast military assets vulnerable to satellite signal denial.
        - label: Contested-Environment Defense & Autonomous Platforms
          value: Core Market
          detail: Air, land, maritime, and subsea platforms operating in known jamming and spoofing conflict zones.
        - label: Resilient PNT & Alternative Navigation Architectures
          value: Addressable Architecture
          detail: Multi-sensor fusion architectures combining inertial, optical, and acoustic modalities.
        - label: Tactical and Strategic Inertial Navigation Hardware (INS)
          value: Hardware TAM
          detail: FOG and MEMS navigation systems capable of operating without external reference signals.
        - label: ITAR-Free Allied Defense & Commercial Autonomous Systems
          value: Serviceable TAM (SAM)
          detail: Export-agile navigation hardware for US, European, and Australian allied defense primes and robotics OEMs.
        - label: Advanced Navigation Proven Deployment Footprint
          value: 100k+ Units / 2.8k Clients
          detail: Demonstrated production volume across 70+ nations with 80%+ revenue in the US and Europe.
    approximationNotes: >-
      Tier boundaries represent operational and regulatory constraints rather than single-source audited financial
      market totals; top tiers reflect total platform vulnerability while lower tiers reflect realizable component
      procurement.
    claimRefs:
      - CM002
      - CM006
      - CM008
      - CM011
