  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio, Sensor Modularity, and Tiered Positioning Systems
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation designs, engineers, and fabricates a tiered portfolio of Positioning, Navigation, and
              Timing (PNT) hardware spanning Micro-Electro-Mechanical Systems (MEMS), closed-loop digital Fiber-Optic
              Gyroscopes (FOG), and subsea acoustic transceivers. At the tactical tier, miniature MEMS solutions such as
              the Motus IMU and Certus GNSS-INS deliver low size, weight, power, and cost (SWaP-C) motion tracking,
              maintaining 0.05 degree pitch and roll precision with 10 millimeter RTK positioning for volume unmanned
              aerial vehicles and autonomous mobile robots. At the high-integrity and strategic tier, the Boreas
              family—headlined by the Boreas D90 and Boreas D70 systems—deploys proprietary digital FOG coils capable of
              0.001 degree per hour bias stability and 0.01 degree seclat North-seeking gyrocompassing. In late 2025,
              the company expanded this flagship line with the compact Boreas 50 series, introducing the A50 AHRS and
              D50 strategic INS to address space-constrained maritime and tactical ground combat platforms. Crucially,
              Advanced Navigation enforces an architectural common communication protocol across all MEMS, FOG, and
              acoustic sensors, enabling defense and commercial systems integrators to swap sensor grades dynamically as
              operational requirements escalate without rewriting autonomy middleware or altering hardware wiring
              harnesses.
