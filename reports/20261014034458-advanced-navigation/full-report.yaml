            - Boxer CRV and Redback IFV installation
            - Kongsberg PROTECTOR C-UAS assembly
        - label: 6. Program Expansion & Fleet Retrofit
          description: Follow-on procurement across allied vehicle variants, international defense sales, and uncrewed platforms.
          touchpoints:
