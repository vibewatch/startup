              - CU010
              - CU011
      - number: '6.4'
        title: Customer Journey, Expansion Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The customer procurement journey in mission-critical defense and autonomy markets is characterized by
              rigorous multi-year qualification cycles followed by long-tail production deployments. Advanced Navigation
              differentiates against traditional prime contractors by delivering ITAR-free hardware with standard
              digital interfaces (CAN Bus, Ethernet, RS-422), enabling integrators to bypass bureaucratic export delays
              and compress development timelines from years to months. Nevertheless, significant diligence risks remain
              regarding customer concentration and order durability. While broad framework agreements like the global
              Hanwha memorandum of understanding signal strong strategic alignment, they do not guarantee binding
              purchase volumes. Furthermore, the company does not disclose net revenue retention (NRR), customer churn,
              software subscription attach rates, or single-client revenue concentration, leaving the long-term
              durability of hardware replacement cycles unverified.
            claimRefs:
              - CU007
              - CU010
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
