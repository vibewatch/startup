      - number: '1.2'
        title: Leadership Structure, Governance, and Key-Person Dependencies
        blocks:
          - type: paragraph
            body: >-
              The company’s executive leadership and board governance combine technical deep-tech expertise with
              high-level institutional and political oversight. Advanced Navigation was co-founded by Chief Executive
              Officer Chris Shaw, who now leads executive strategy and global expansion following the leadership
              transition from original co-founder Xavier Orr. The broader executive bench includes Chief Financial
              Officer Tom Pereira, Chief Technology Officer Pawel Michalak, Chief Supply Chain Officer Shane Albances,
              Chief People Officer Adrian West, and Chief Revenue Officer Christopher McNamara. Governance is anchored
              by a formal board of directors chaired by former Australian Prime Minister Malcolm Turnbull, who joined
              the board in 2021 to support international defense, aerospace, and sovereign industrial strategy.
              Institutional investors hold significant board representation, including Kelland Reilly representing lead
              venture investor Airtree Ventures and Louis Casey representing private equity backer Quadrant. While the
              presence of seasoned institutional directors mitigates early-stage governance deficits, Advanced
              Navigation maintains meaningful key-person exposure to co-founder Chris Shaw and specialized photonics and
              algorithmic engineering leadership responsible for its core DFOG intellectual property.
