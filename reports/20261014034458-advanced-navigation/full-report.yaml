              - CU004
      - number: '6.3'
        title: Named Customer Proof and Defense Prime Subcontracts
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation has successfully converted initial platform evaluations into high-value sovereign
              production contracts with leading international defense contractors. Under Australia Land 400 Phase 3
              program, Hanwha Defence Australia awarded the company an 8.7 million Australian dollar subcontract to
              supply 138 Boreas D70 digital fiber-optic gyroscope (DFOG) systems for Redback infantry fighting vehicles.
              This builds upon an established partnership with Rheinmetall Defence Australia, which initially integrated
              over 200 FOG INS units into Boxer Combat Reconnaissance Vehicles under Land 400 Phase 2 in 2021 before
              executing a multi-million-dollar follow-on contract in late 2024. Additionally, Kongsberg Defence &
              Aerospace selected the Boreas navigation architecture for integration into hundreds of PROTECTOR
              counter-unmanned aerial systems (C-UAS) platforms, establishing the company as an embedded subsystem
              provider across heavy armor, combat reconnaissance, and counter-drone domains.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
