    title: Thesis and Anti-Thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - Demand for navigation that can operate without reliable GPS is strategically important
        - GPS World describes defense, energy, maritime, and space use and reports a new $110 million round
        - Independent loss data or materially lower demand would weaken the case
      - - Thesis
        - Deployment and geographic revenue signals indicate commercial scale
        - >-
          GPS World reports more than 100,000 systems, triple-digit growth, and over 80% of revenue from the US and
          Europe
        - Audited data showing weak repeat orders or concentrated one-time programs would weaken the case
      - - Anti-thesis
        - Most product and operating differentiation is company-issued
        - ITAR-free status, military-standard validation, lead times, and supplier reach are promotional claims
        - Independent benchmarks, acceptance testing, and customer references would strengthen confidence
      - - Anti-thesis
        - Public evidence cannot establish economics or entry value
        - Exact valuation, audited margins, cash burn, backlog quality, and capitalization terms are absent
        - Audited statements and the executed financing documents are required
    notes: >-
      Company and supplier claims are separated from independent reporting; deployment figures are not treated as
      audited revenue or retention.
