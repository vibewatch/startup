        - Do not invest from public evidence alone
      - - Confidence
        - Medium
        - Multiple publications confirm the round, but key operating figures are management-reported
        - Use private diligence to test the thesis
      - - Risk rating
        - High underwriting risk
        - Price, preference stack, margins, cash burn, and concentration are undisclosed
        - Require downside protection and full terms review
      - - Valuation stance
        - Unpriceable with stretch risk
