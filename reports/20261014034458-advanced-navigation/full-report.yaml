      - number: '3.2'
        title: Capability Matrix, Procurement Agility, and Standards Compliance
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitive capability requires examining operational dead-reckoning accuracy, electronic
              warfare resilience, and environmental qualification. In tactical ground trials during the U.S. Army's
              All-Domain Persistent Experiment (APEX) in New Mexico, Advanced Navigation demonstrated its Boreas D90 FOG
              INS fused with an infrared laser velocity sensor, achieving a dead-reckoning error rate of 0.012% of
              distance traveled (7.5 meters over 65 kilometers) under contested electronic warfare jamming. When paired
              with a wheel-speed encoder in predictable terrain, the same architecture achieved 0.018% distance error
              (11.7 meters over 65 kilometers). This performance highlights the capability of AdNav Intelligence
              software, which dynamically weighs incoming sensor reliability rather than relying on static Kalman
              filtering. From a qualification perspective, Advanced Navigation validates its systems against MIL-STD-810
              environmental stress and MIL-STD-461 electromagnetic compatibility standards. While commercial competitors
              frequently omit full military shock and vibration testing and defense primes require lengthy non-recurring
              engineering cycles, Advanced Navigation combines military-grade environmental hardening with
              commercial-off-the-shelf procurement velocity.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Pricing Models, Switching Friction, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Commercial procurement models in defense navigation are characterized by sharp divides between bespoke
              defense contracts and standardized hardware purchasing. Legacy primes engage in multi-million-dollar
              cost-plus contracts that bundle proprietary software and custom cabling, establishing high switching
              barriers for long-term programs of record. Advanced Navigation challenges this dynamic through vertically
              integrated manufacturing in Australia, enabling equipment delivery in weeks rather than years. To lower
              customer integration friction, the company standardizes all MEMS and FOG hardware on common communication
              protocols, universal electrical interfaces (Ethernet, CAN Bus, RS232/RS422), and multi-language software
              development kits (C++, Python). This interoperability allows vehicle integrators to swap between
              entry-level tactical units and strategic-grade FOG systems without redesigning platform cabling or mission
              computers. Nevertheless, defense prime incumbents retain deep competitive moats through established
              customer trust, multi-decade mission safety accreditations, and institutional inertia within Western
              defense procurement offices. Advanced Navigation's expansion to establish regional PNT Centers of
              Excellence across the United Kingdom, Europe, and the United States represents an essential investment to
              build onshore credibility and compete directly for sovereign allied defense programs.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: ITAR-Free Status as a Geopolitical and Procurement Catalyst
            body: >-
              Advanced Navigation's Australian manufacturing base and non-ITAR classification remove months or years of
              U.S. State Department licensing friction for allied defense forces. In an operating climate where NATO
              allies and AUKUS partners require interoperable autonomous capabilities, export agility enables rapid
              fleet modernizations that traditional U.S. primes cannot match under International Traffic in Arms
              Regulations.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP007
          - type: callout
            title: Incumbent Program-of-Record Moats and Customer Switching Inertia
            body: >-
              While Advanced Navigation offers superior procurement speed and modern multi-sensor fusion, established
              defense primes such as Honeywell and Northrop Grumman hold multi-decade flight-safety certifications and
              entrenched positions in major military programs of record. Overcoming institutional procurement inertia in
              tier-1 Western platforms requires sustained field validation and costly platform-level qualification
              testing.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Streams
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation operates a specialized dual-use business model providing assured positioning,
              navigation, and timing (APNT) solutions across commercial robotics, aerospace, maritime, and defense
              domains. The company primary commercial monetization engine centers on the direct sale of proprietary
              inertial navigation hardware spanning Micro-Electromechanical Systems (MEMS) and Digital Fiber-Optic
              Gyroscope (DFOG) systems. Hardware product lines are designed to provide mission-critical position,
              orientation, and heading in GPS-denied or contested electronic warfare environments without relying on
              external satellite signals. Beyond core surface and aerial navigation hardware, Advanced Navigation
              monetizes acoustic underwater positioning systems through its Subsonus line and autonomous underwater
              vehicles. To complement high-value hardware deployments, the company provides Kinematica, a web-based
              post-processing software application that allows operators to refine raw GNSS and inertial telemetry data
              into survey-grade precision. While hardware shipments constitute the primary revenue driver, customer
              engagements increasingly incorporate cloud-based fleet command and software licensing.
            claimRefs:
              - CI001
              - CI002
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
      - number: '4.2'
        title: Pricing Architecture and Go-to-Market Execution
        blocks:
          - type: paragraph
            body: >-
              Monetization across Advanced Navigation product portfolio is structured along a broad pricing spectrum,
              ranging from entry-level sensors priced near $500 to high-precision strategic-grade inertial navigation
              systems commanding up to $50,000 per unit. Entry-level MEMS attitude and heading reference systems serve
              commercial robotics and surveying applications where cost efficiency and low size, weight, and power
              (SWaP) dominate procurement criteria. In contrast, higher-tier Boreas digital fiber-optic gyroscope
              systems command strategic price points from prime defense contractors and allied armed forces requiring
              extreme shock resilience and north-seeking gyrocompassing. The company go-to-market motion emphasizes an
              ITAR-free design ethos and commercial-off-the-shelf availability, enabling international defense customers
              to bypass the multi-year administrative and regulatory delays common to legacy American suppliers. To
              capture accelerating demand across NATO allies, Advanced Navigation is establishing regional Centers of
              Excellence in the United Kingdom, continental Europe, and the United States to deliver localized
              engineering, calibration, and support.
            claimRefs:
              - CI003
              - CI005
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI001
              - CI002
          - type: figure
            figureRef: FI001
            claimRefs:
