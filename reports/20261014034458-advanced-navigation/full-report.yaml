  - id: FE001
    title: Advanced Navigation Core Technology and Operating Architecture Stack
    type: stack
    summary: >-
      Six-layer architectural hierarchy depicting the transition from physical photonics and MEMS transducers through AI
      sensor fusion to mission-level autonomous platforms.
    data:
      layers:
        - label: Physical Transducers & Optical Hardware
          detail: >-
            Closed-loop digital fiber-optic coils (FOG), triaxial silicon MEMS accelerometers/gyros, and multi-channel
            acoustic hydrophone arrays
        - label: Embedded Real-Time Signal Acquisition
          detail: >-
            High-speed digital signal processors sampling at 1000 Hz with full -40°C to 85°C factory thermal calibration
            maps
        - label: Deep Learning & Sensor Fusion Engine
          detail: >-
            Proprietary neural network filter algorithms dynamically estimating sensor biases faster than classical
            extended Kalman filters
        - label: Electronic Protection & Multi-Constellation GNSS
          detail: >-
            All-band multi-frequency GNSS receivers paired with hardware Electronic Protection (EP) against RF jamming
            and spoofing
        - label: Unified Protocol & Integration Middleware
          detail: Standardized ITAR-free communication bus, open APIs, and Kinematica cloud post-processing software
        - label: Mission-Level Autonomous Platform Applications
          detail: >-
            Subterranean mining Laser Velocity Sensor hybrids, subsea AUV/ROV navigation, tactical UAS, and armored
            vehicle APNT
    approximationNotes: >-
      Conceptual representation of Advanced Navigation technical architecture based on published technical documentation
      and patent/product disclosures.
    claimRefs:
      - CE001
      - CE010
      - CE011
      - CE012
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Evaluation, integration, and expansion trajectory of defense primes and enterprise autonomous system operators.
    data:
      items:
        - label: 1. Specification & Benchmarking
          description: >-
            Primes evaluate ITAR-free FOG and MEMS alternatives against strict military SWaP-C and jamming resilience
            benchmarks.
          touchpoints:
