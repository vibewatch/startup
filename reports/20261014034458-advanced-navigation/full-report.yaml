    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks and downside triggers
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited revenue exceeds US$100 million, growth remains strong, margins are durable, and regional expansion
          executes on budget
        - >-
          A premium could be considered only after applying normalized audited metrics to a relevant comparable set and
          testing the preference waterfall
        - Forecast miss, weak recurring demand, margin compression, or expansion overruns
        - Not estimable from assigned public evidence
      - - Base
        - Financing supports continued growth, but economics and concentration remain private
        - No defensible range or target return until the entry price and audited operating profile are disclosed
        - Long procurement cycles, uneven orders, and capital requirements delay liquidity
        - Not estimable from assigned public evidence
      - - Bear
        - >-
          An undisclosed unicorn-level entry is followed by slower conversion and expensive manufacturing or acquisition
          execution
        - A down round or structured recapitalization can transfer value to senior preferred holders
        - Cash shortfall, preference overhang, failed integration, or loss of major programs
        - Not estimable from assigned public evidence
    notes: >-
      These are qualitative decision conditions, not forecasts; no numerical valuation range or probability is supported
      by the assigned sources.
