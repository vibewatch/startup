        title: Capitalization History, Series C Financing, and Investor Structure
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation has funded its research, product commercialization, and global production buildout
              through successive venture capital, private equity, and sovereign strategic equity rounds. After an
              initial AUD$20 million financing round in 2019, the company completed a major Series C funding round in
              March 2026 raising US$110 million (equivalent to AUD$158 million). The round was led by Australian venture
              capital firm Airtree Ventures, with participation from Quadrant Private Equity’s Strategic Equity Fund and
              the Commonwealth of Australia’s National Reconstruction Fund Corporation (NRFC). The NRFC contributed
              AUD$50 million through a structured preferred equity investment under its statutory remit to anchor
              sovereign defense and high-tech manufacturing within Australia. Prior institutional investors include Main
              Sequence Ventures, In-Q-Tel, KKR, and Alpha Intelligence Capital. However, post-money valuation,
              liquidation preferences, coupon or hurdle rights attached to the NRFC preferred equity tranche, and
              minority shareholder protections remain confidential, creating material opacity for external underwriting
              regarding common share dilution and liquidation priority.
