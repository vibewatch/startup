      - number: '6.2'
        title: Adoption Trajectory and Volume Deployment Scale
        blocks:
          - type: paragraph
            body: >-
              Cumulative system deliveries have exceeded 100,000 units globally, illustrating meaningful commercial and
              tactical manufacturing scale. Recent customer demand has accelerated sharply due to acute electronic
              warfare pressures, with international aviation and defense organizations reporting a 67 percent increase
              in GNSS jamming and a 193 percent surge in signal spoofing incidents between 2023 and 2025. In response to
              contested navigation environments across Eastern Europe and the Middle East, Advanced Navigation reported
              triple-digit revenue growth in the EMEA theater during the twelve months leading into mid-2026. To support
              surging operational procurement from NATO and allied defense forces, the company doubled its workforce and
              initiated the rollout of dedicated PNT Centers of Excellence across the United Kingdom, Europe, and the
              United States to deliver local engineering support, calibration, and sovereign supply integration.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU002
            claimRefs:
