    title: 'Competitive Positioning Map: Defense-Grade Assurance vs. Deployment Velocity'
    type: quadrant
    summary: >-
      Strategic positioning of navigation alternatives across electronic warfare resilience / PNT assurance (Y-axis)
      versus procurement agility and ITAR-free accessibility (X-axis).
    approximationNotes: >-
      Positioning represents qualitative ordinal scoring on a 0–10 scale based on documented electronic warfare
