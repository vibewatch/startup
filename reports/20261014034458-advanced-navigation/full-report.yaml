chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Advanced Navigation is an Australian deep-technology company founded in Sydney in 2012 by Xavier Orr and
              Chris Shaw. The company specializes in the development and manufacture of high-accuracy assured
              positioning, navigation, and timing (APNT) systems designed specifically for environments where Global
              Navigation Satellite Systems (GNSS) and GPS signals are contested, jammed, spoofed, or wholly unavailable.
              By coupling high-precision inertial measurement hardware—including tactical-grade Micro-Electro-Mechanical
              Systems (MEMS) and strategic-grade Digital Fiber-Optic Gyroscope (DFOG) sensors—with proprietary
              artificial intelligence and deep-learning sensor fusion software called AdNav Intelligence, Advanced
              Navigation provides autonomous navigation solutions across air, land, maritime, subsea, and space domains.
              The company operates a vertically integrated hardware manufacturing model with automated production,
              calibration, and pressure-tolerant testing facilities located across Australia and expanding into the
              United States and Europe. Commercialization is driven by direct OEM sales, defense prime contractor
              integrations, and ongoing software post-processing licensing across more than 2,800 clients and 70
              countries globally.
            claimRefs:
