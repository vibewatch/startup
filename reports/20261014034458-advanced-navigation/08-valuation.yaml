  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "series-c-terms"
      missingEvidence: "Executed Series C documents showing pre-money and post-money valuation, security seniority, liquidation preferences, participation rights, anti-dilution protection, and ownership dilution."
      whyItMatters: "Round size is not entry valuation, and preferred terms determine downside recoveries and the return available to new or junior equity."
      diligencePath: "Request the capitalization table, subscription documents, shareholders agreement, side letters, and counsel-prepared waterfall from the company and lead investor."
      relatedQuestionRefs:
        - "QV007"
    - type: "missing-source"
      severity: "material"
      topic: "comparable-valuation"
      missingEvidence: "A normalized comparable set with verified revenue mix, growth, margins, backlog quality, enterprise values, transaction dates, and security terms."
      whyItMatters: "Applying public or transaction multiples without matching business mix and economics would create false precision."
      diligencePath: "Build a transaction and public-company set after audited segment data are available, then normalize fiscal periods, currency, growth, margins, and liquidity."
      relatedQuestionRefs:
        - "QV006"
    - type: "private-evidence-only"
      severity: "material"
      topic: "operating-economics"
      missingEvidence: "Audited consolidated revenue, gross margin, operating cash flow, cash balance, backlog conversion, repeat-order cadence, and customer concentration."
      whyItMatters: "Management forecasts and deployment counts do not establish revenue quality, capital efficiency, or downside runway."
      diligencePath: "Obtain audited statements, monthly management accounts, bookings and backlog cohorts, customer-level revenue schedules, and cash forecasts."
      relatedQuestionRefs:
        - "QV003"
        - "QV009"
