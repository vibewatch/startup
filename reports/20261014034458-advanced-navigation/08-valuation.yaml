company:
  name: "Advanced Navigation"
chapter:
  number: 8
  title: "Valuation"
  summary: "The March 2026 Series C and reported commercial scale support strategic relevance, but the public record does not disclose an exact valuation, audited economics, or the preference stack. The appropriate stance is research-more: do not underwrite a numeric return or entry price until those private inputs are verified."
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: "The recommendation is research-more, with medium confidence and high underwriting risk. GPS World reported a $110 million Series C, while SmartCompany reported the same financing as $158 million; neither fetched article labels the currency attached to its headline amount, so they should not be combined into a currency conversion without deal documents. SmartCompany separately reported a $50 million preferred-equity commitment from NRFC, again without a currency label in the fetched text. Forbes Australia reported that management declined to disclose the round valuation while asserting that it had doubled since Series B and reached unicorn status. That combination establishes financing capacity, not a defensible entry price. Until the post-money valuation and security terms are known, the valuation stance is unpriceable with stretch risk rather than a precise multiple or range."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV016"
    tableRefs:
      - "TV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis, Anti-Thesis, and Evidence Quality"
    body: "The thesis rests on a genuine operating problem and visible scale signals. GPS World reported triple-digit revenue growth, more than 80% of revenue from the United States and Europe, and more than 100,000 deployed systems. A supplier listing reports more than 2,800 clients across over 70 countries, but that listing is company-supplied promotional content rather than independent customer verification. The company also claims ITAR-free procurement advantages, military-standard validation, and vertically integrated delivery. The anti-thesis is that most operating proof remains management- or supplier-issued: current customer concentration, repeat-order behavior, gross margin, backlog conversion, and cash use are absent. Product breadth and demand can justify diligence, but not a premium price by themselves."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "scenario-framework"
    title: "Bull, Base, and Bear Framework"
    body: "The retained evidence cannot support numerical valuation ranges or scenario probabilities. A bull case would require audited confirmation of management's forecast for more than US$100 million of revenue and subsequent doubling, alongside durable margins and successful regional capacity expansion. The base case recognizes a well-funded supplier with deployment evidence but treats valuation and returns as indeterminate because the price, cash burn, and capitalization waterfall are unknown. The bear case is an undisclosed unicorn-level entry followed by slower conversion, manufacturing or acquisition integration costs, and a structured down round that transfers value to preferred holders. These are decision conditions, not forecasts: no public comparable transaction or normalized public-company data set in the assigned evidence supports applying a revenue multiple."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV011"
      - "CV012"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence-gates"
    title: "Exit Readiness and Diligence Gates"
    body: "Exit readiness is conditional rather than demonstrated. The Series C funds regional manufacturing, engineering, research and development, and potential technology acquisitions, while the company has announced PNT Centers of Excellence in the United States and Europe. Those initiatives can improve strategic relevance but also introduce execution and capital-allocation risk before a public-market or strategic exit. The investment committee should require the closing capitalization table, liquidation and anti-dilution terms, audited consolidated financials, revenue-quality and customer-concentration schedules, backlog conversion, and acquisition pipeline economics. Thesis-break triggers are failure to validate the US$100 million revenue claim, weakening repeat orders, material cost overruns in regional expansion, or security terms that make target returns unattainable at the requested price."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV011"
      - "CV012"
      - "CV015"
      - "CV016"
    figureRefs:
      - "FV001"
