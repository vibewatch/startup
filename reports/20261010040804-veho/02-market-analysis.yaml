callouts:
  - calloutType: "insight"
    title: "The Carrier Diversification Imperative"
    body: "With nearly two-thirds of e-commerce brands adopting three or more carriers, delivery has evolved from a pure cost-minimization function into a retention engine. Veho capitalizes on this structural shift by offering next-day reliability and interactive SMS drop-off controls that reduce customer service inquiries and increase brand lifetime value."
    claimRefs:
      - "CM008"
      - "CM010"
  - calloutType: "risk"
    title: "Unit Economics and Gig Workforce Fragility"
    body: "Despite rapid geographic scaling to 66 markets, Veho's reliance on crowdsourced gig drivers creates ongoing exposure to independent contractor reclassification and rising labor costs. Combined with an unverified cash burn rate and undisclosed gross margins, the long-term profitability of its asset-light delivery network remains an open diligence question."
    claimRefs:
      - "CM014"
      - "CM015"
