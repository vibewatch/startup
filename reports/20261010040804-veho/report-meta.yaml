companyProfile:
  summary: >-
    Veho is a tech-enabled last-mile delivery platform that serves premium e-commerce brands through a crowdsourced
    driver network, merchant-facing billing, and software-guided sortation, delivery, and returns workflows. The company
    is positioned as an alternative to legacy parcel carriers for brands that want more control over customer
    experience, delivery transparency, and reverse logistics, but it still operates within a financially opaque
    private-company model.
