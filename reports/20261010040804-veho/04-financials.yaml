  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-metrics
      missingEvidence: Audited GAAP income statements, historical balance sheets, gross margin schedules, and current monthly cash burn data.
      whyItMatters: Without audited financial statements, underwriting cannot determine whether Veho generates positive gross contribution margins after driver and sortation labor or is burning capital to subsidize delivery rates.
      diligencePath: Request audited annual financial statements and quarterly management reports under non-disclosure agreement during formal data-room review.
      relatedQuestionRefs:
        - QI008
      relatedTableRefs:
        - TI003
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: Granular route-level economics including driver pay per delivered package, stop density curves, and lost-package claims costs.
      whyItMatters: Route profitability dictates whether density expansion converts into positive EBITDA or if driver churn and claims leakage exacerbate operating losses as volume grows.
      diligencePath: Obtain cohort-level unit economics across top five mature markets versus newer expansion metros from company management.
      relatedQuestionRefs:
        - QI008
      relatedTableRefs:
        - TI003
