callouts:
  - calloutType: risk
    title: Stale Valuation Benchmark and Forward Capital Runway Uncertainty
    body: Veho has not closed or announced a priced institutional funding round since its $170M Series B in February 2022, which established a $1.5B valuation mark. While management restructured operations in January 2024 to target self-funded profitability by 2025, no announcement of profitability has followed, creating substantial uncertainty regarding remaining cash runway and potential down-round valuation risk [CI008, CI009, CI010, CI011].
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
  - calloutType: insight
    title: Stop Density as the Decisive Driver of Last-Mile Unit Economics
    body: Veho's unit economics hinge entirely on route stop density within its covered metropolitan clusters. Because the carrier pays drivers fixed route blocks and absorbs local sortation hub leases while undercutting incumbent ground rates by 30% to 40% with no peak surcharges, achieving profitability requires concentrating high package volumes into existing zip codes rather than premature geographic expansion [CI002, CI005, CI013, CI014].
    claimRefs:
      - CI002
      - CI005
      - CI013
      - CI014
