        - Company announcements and trade media reporting
      - - Doorstep Returns Service
        - Premium per-pickup fee billed to merchant partner
        - Value-based pricing reflecting reduced return friction
        - Included packaging and digital QR scanning waiver
        - Merchant absorption vs customer co-pay policies
