      - - Enterprise Strategic MSAs
        - Master service agreement with tiered volume rebates
        - Custom confidential rate schedule per distribution center
        - Waiver of standard carrier fuel and address correction fees
        - Underlying penalty terms for shipper volume shortfalls
        - Industry logistics teardowns and carrier comparisons
    notes: Veho publishes no standard public rate card; commercial pricing is custom negotiated based on package profile, density, and volume commitments.
