chapter:
  number: 6
  title: "Customers"
  summary: "Veho delivers tech-enabled last-mile logistics for premium e-commerce enterprise retailers across apparel, beauty, and food-oriented consumer categories, reporting a 99% on-time delivery rate and 4.9/5 satisfaction score across 65 U.S. markets. However, the business faces structural customer adoption friction from luxury consumers' preference for professional over gig drivers, unverified long-term net revenue retention, and significant operational dependence on a small cluster of marquee national retail clients."

sections:
  - id: "customer-segmentation-and-target-verticals"
    title: "Customer Segmentation & Target Retail Verticals"
    body: "Veho's commercial model deliberately concentrates on premium direct-to-consumer and omnichannel retail segments where package delivery outcomes directly dictate consumer brand perception, repeat purchasing, and long-term customer lifetime value. Unlike legacy national parcel carriers that optimize for aggregate package density across generic industrial and commercial freight, Veho targets consumer-facing brands in apparel, beauty, specialty food, and personalized styling services that view doorstep delivery as an explicit extension of their digital storefront. These enterprise clients typically maintain high average order values and face acute customer churn penalties when shipments arrive late, damaged, or without transparent doorstep placement. Consequently, Veho's value proposition reframes parcel logistics from a pure freight cost line into a strategic retention driver for brand marketing and supply chain executives."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU011"
    tableRefs:
      - "TU001"

  - id: "adoption-trajectory-and-operational-footprint"
    title: "Adoption Trajectory & Operational Footprint"
    body: "Veho's commercial expansion has scaled from 14 operational markets at the end of 2021 to 65 major U.S. metropolitan markets as of 2026, creating dense regional last-mile delivery footprints across the East Coast, Midwest, Texas, and Sunbelt corridors. Enterprise brand adoption follows a standardized phased deployment playbook: rather than initiating national coverage on day one, brand shippers launch regional pilots across three to four metropolitan markets to evaluate delivery velocity, customer contact reductions, and on-time reliability against incumbent carrier baselines. As service quality benchmarks are established, shippers progressively expand carrier allocation across additional hubs. Operationally, Veho supports this trajectory through a flexible network of approximately 120,000 registered crowdsourced delivery partners managed via proprietary sortation and dispatch software. To broaden merchant adoption across different margin structures, Veho commercializes segmented shipping speeds, offering expedited Ground Plus for time-critical deliveries and FlexSave for cost-sensitive merchandise. This modular product structure enables enterprise retailers to pass transportation cost savings to consumers while maintaining consistent tracking and SMS-based delivery transparency."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"

  - id: "named-customer-deployments-and-performance-proof"
    title: "Named Customer Deployments & Performance Proof"
    body: "Documented customer case studies and operational announcements demonstrate substantial operational improvements across Veho's enterprise retail client base. Brand clients utilizing Veho's delivery network report cutting major metropolitan transit times in half, achieving an average 20% increase in customer repurchase frequency, an eight-point lift in Net Promoter Score, and a 40% expansion in customer lifetime value relative to traditional shipping alternatives. Shippers also report material operational efficiencies, including a two percentage point reduction in freight spend as a percentage of revenue and an approximate 50% decrease in package damage rates. Under Veho's commercial operating model, merchants retain complete ownership of consumer relationships, inventory reconciliation, and refund authorizations, while Veho operates as the specialized transportation execution partner. Driver partners capture photographic proof of delivery at recipient doorsteps and adhere to granular delivery instructions submitted by consumers in real time. This operational separation allows enterprise merchants to maintain strict brand governance while leveraging Veho's crowdsourced courier infrastructure to eliminate friction during the final fifty feet of the parcel lifecycle."
    claimRefs:
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU003"

  - id: "retention-concentration-and-delivery-friction"
    title: "Retention Durability, Concentration & Customer Friction"
    body: "Despite high customer satisfaction scores, Veho faces persistent structural friction in customer retention durability and enterprise concentration. Industry research highlights that 89% of online shoppers have diverted orders to Amazon or Walmart due to superior delivery experiences, and 40% permanently cease purchasing from a merchant after experiencing a single lost package. Furthermore, independent consumer surveys reveal widespread recipient skepticism regarding crowdsourced gig couriers delivering high-value designer apparel and luxury goods, where consumers heavily prefer professional uniformed drivers. From an investment underwriting standpoint, Veho does not publicly disclose audited net revenue retention, gross revenue retention, annual client churn, or revenue concentration percentages among its top enterprise accounts. Given that last-mile logistics networks require immense localized package volume to maintain profitable driver utilization, the potential defection of an anchor retail account like Macy's or HelloFresh would severely undermine route density and unit economics in affected metropolitan sortation facilities."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU015"

