              - CE003
              - CE005
              - CE007
              - CE008
              - CE011
      - number: '5.3'
        title: Software Stack, Route Optimization, and Operational Controls
        blocks:
          - type: paragraph
            body: >-
              Technology represents Veho's primary structural differentiator against legacy logistics carriers. The
              company commits nearly half of its corporate workforce to software engineering and technology research and
              development, a concentration substantially higher than conventional parcel networks. The proprietary
              software architecture is vertically integrated, spanning custom warehouse management systems (WMS),
              automated sortation scanning engines, dynamic routing algorithms, and driver dispatch applications. To
              maintain operational agility, approximately 68% of Veho's warehouse sortation operations are executed
              through third-party logistics (3PL) partners who operate under Veho's standardized process guidelines and
              proprietary software. Software and operational leadership is centralized at a dedicated Center of
              Expertise in Dallas, Texas, which serves as a testing ground for algorithmic routing improvements and
              network performance telemetry before national rollout.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE008
              - CE009
              - CE010
      - number: '5.4'
        title: Trust, Verification Controls, and Technical Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Consumer trust and delivery integrity are enforced through specialized application workflows and security
              controls. Veho's consumer platform provides interactive tracking, enabling shoppers to submit delivery
              notes, gated community codes, and photo-based drop-off preferences. To mitigate porch piracy and delivery
              disputes on high-value retail merchandise, the company deploys mandatory photo proof of delivery and a
              4-digit PIN verification system requiring in-person code confirmation before package handover. From a
              diligence perspective, critical verification gaps persist: Veho's marketed 99% on-time delivery rates and
              35% fully-landed cost savings are unaudited vendor claims lacking independent benchmark corroboration.
              Additionally, prospective investors must distinguish the U.S. logistics platform Veho Tech, Inc. from the
              unrelated European automotive distribution firm Veho Group, and independently audit the stability and API
              performance of Veho's proprietary dispatch stack.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid Asset-Light Sortation Architecture
            body: >-
              Veho's strategy of operating 68% of warehouse sortation through third-party logistics partners under
              proprietary WMS controls provides substantial elasticity during peak volume surges without requiring fixed
              real estate buildout.
            calloutType: strength
            claimRefs:
              - CE006
              - CE008
          - type: callout
            title: Third-Party Execution and Verification Opacity
            body: >-
              While Veho advertises >99% on-time delivery and strict PIN/photo verification, heavy reliance on
              independent contractor drivers and 3PL warehouse labor creates process variance, and core performance
              claims remain unaudited by independent parties.
            calloutType: risk
            claimRefs:
              - CE006
