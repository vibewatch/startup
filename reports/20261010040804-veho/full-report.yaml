    title: Customer journey map
    type: journey-map
    summary: >-
      Six-stage lifecycle mapping brand client acquisition, pilot deployment, checkout integration, doorstep
      fulfillment, returns, and volume expansion.
    data:
      nodes:
        - id: stage-evaluation
          label: 1. ROI Evaluation & Return on Shipping Audit
          stage: Evaluation
          detail: >-
            Brand evaluates delivery failure costs, customer service contacts, and parcel loss rates against Veho's ROI
            calculator.
        - id: stage-pilot
          label: 2. Regional Pilot Deployment
          stage: Pilot
          detail: >-
            Brand initiates testing in 3 to 4 regional metro markets to benchmark on-time delivery rates and recipient
            NPS.
        - id: stage-checkout
          label: 3. Checkout & API Integration
          stage: Integration
          detail: Merchant connects inventory and order APIs; customer selects shipping speed tiers (Ground Plus vs FlexSave).
        - id: stage-fulfillment
          label: 4. Sortation & Crowdsourced Doorstep Delivery
          stage: Fulfillment
          detail: >-
            Packages scanned via Maestro AI sortation and dispatched to crowdsourced drivers with photo placement
            verification.
        - id: stage-communication
          label: 5. Real-Time Two-Way Customer Communication
          stage: Communication
          detail: >-
            End recipients receive SMS alerts, submit delivery instructions or access PINs, and resolve delivery
            exceptions.
        - id: stage-expansion
          label: 6. Multi-Market Expansion & Doorstep Returns
          stage: Expansion
          detail: Client expands parcel volume allocation across 65 metropolitan hubs and enables doorstep return workflows.
