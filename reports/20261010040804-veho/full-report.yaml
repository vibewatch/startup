          tone: positive
        - date: '2022-02-15'
          label: Series B Growth Financing
          detail: Raises $170M led by Tiger Global and SoftBank Vision Fund 2 at a $1.5B–$1.6B valuation to automate hubs.
          tone: positive
        - date: 2022-03
          label: Multi-Market Rollout
          detail: Expands to 15 regional MSAs including Orlando, targeting nationwide tech-enabled delivery network.
