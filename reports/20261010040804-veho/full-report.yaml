      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Veho’s executive leadership and vision remain tightly centered on co-founder and Chief Executive Officer
              Itamar Zur, who has led corporate strategy, equity fundraising, and enterprise client partnerships since
              inception. Technical co-founder Fred Cook played an instrumental role in architecting the initial mobile
              dispatch and route assignment infrastructure and continues to serve on Veho's board of directors. The
              broader management team includes specialized domain executives such as Vice President of Marketing
              Catherine Dummitt, who drives merchant research and shipper messaging, alongside operating leaders
              overseeing national sorting hubs and client onboarding. Governance is exercised through a corporate board
              comprising executive founders alongside independent venture directors including Kyle Doherty, who has
              served over four years providing capital allocation and scaling oversight. While executive stability has
              supported rapid geographic rollout into competitive coastal markets, key-person dependency on Zur remains
              high given his central role in capital formation and institutional customer relationships. Management
              diligence should focus on engineering leadership retention, depth of operational leadership in regional
              hubs, and formal committee oversight over contractor safety and labor compliance.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO009
              - CO013
      - number: '1.3'
        title: Capitalization, Valuation, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: >-
              Veho established an accelerated capitalization trajectory during the 2021–2022 logistics technology
              venture boom, securing $300 million in total equity financing across five funding rounds. The company
              reached unicorn status in December 2021 upon closing a $125 million Series A round co-led by General
              Catalyst and Construct Capital at a $1.0 billion post-money valuation. Six weeks later, in February 2022,
              Veho completed a $170 million Series B round led by Tiger Global Management with participation from
              SoftBank Vision Fund 2, establishing a $1.5 billion valuation mark (reported at up to $1.6 billion in
              secondary and podcast references). The round drew participation from earlier investors including Bling
              Capital, Origin Ventures, and Industry Ventures, alongside notable direct-to-consumer founders from Warby
              Parker, Allbirds, and Flexport. However, Veho has announced no subsequent primary equity rounds or debt
              facilities in the more than four years between February 2022 and October 2026. Private transaction
              benchmarks from Tracxn reflect an estimated $1.5 billion valuation as of January 2026, marking a 7%
              contraction from peak 2021 pricing and underscoring valuation plateau risks in high-capital-intensity
              last-mile logistics.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO011
              - CO012
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO011
      - number: '1.4'
        title: Operational Milestones, Scale Trajectory, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Veho has expanded from 15 regional metropolitan facilities in early 2022 to a national operating network
              spanning major logistics hubs, including successful recent expansions into dense, complex coastal markets
              such as New York City and Southern California. The company reports having doubled parcel volume flowing
              through its sorting network and tripled new client onboardings during 2025, while maintaining an on-time
              delivery rate exceeding 99% and customer satisfaction ratings averaging 4.9 out of 5 stars across
              enterprise clients including Macy's, Sephora, Lululemon, and HelloFresh. Crucially, leadership has
              asserted that all regional operating markets are currently profitable. Despite these positive operational
              signals, significant diligence gaps persist. In 2022, Veho publicly projected quadrupling its headcount to
              2,000 employees by year-end; however, tracked employment stood at approximately 1,129 as of August 2026,
              revealing substantial hiring moderation or organizational consolidation. Most critically, because Veho
              remains closely held, audited GAAP revenue, gross margin profiles, facility lease liabilities, unit-level
              driver acquisition costs, and net cash burn remain entirely undisclosed, creating fundamental underwriting
              blind spots for outside investors.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO012
              - CO013
              - CO014
              - CO015
