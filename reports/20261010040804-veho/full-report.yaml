  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries and Logistics Spend Scope
        blocks:
          - type: paragraph
            body: >-
              Veho focuses narrowly on the business-to-consumer (B2C) e-commerce parcel delivery segment, deliberately
              separating high-touch doorstep parcel fulfillment from legacy freight brokerage and long-haul transport.
              Under North American Industry Classification System (NAICS) code 4885 for Freight Transportation
              Arrangement, statistical estimates evaluate the company's annual revenue run-rate between $100 million and
              $500 million. Unlike traditional hub-and-spoke carriers such as FedEx and UPS that prioritize volume
              density over individualized delivery experiences, Veho captures shipping budget from brands whose customer
              lifetime value hinges directly on delivery execution. The addressable spend encompasses next-day and
              two-day parcel shipping, scheduled delivery windows, and coordinated doorstep returns, while explicitly
              excluding drayage, bulk palletized line-haul freight, and instant under-two-hour food courier services.
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: Market Sizing Lenses and Addressable Footprint
        blocks:
          - type: paragraph
            body: >-
              Evaluating Veho's total addressable market requires decomposing broader logistics figures into serviceable
              e-commerce parcel boundaries. Independent market research values the global last-mile delivery market at
              $132.71 billion in 2022, forecasting expansion to $258.68 billion by 2030 at an 8.8% compound annual
              growth rate. North America accounts for approximately 31% of this total ($41.14 billion in 2022),
              propelled by sustained online shopping adoption and rising consumer demand for next-day and two-day
              delivery standards. Within this market, US brand parcel shipping spend represents an estimated $110
              billion industry. Veho's serviceable addressable opportunity is physically constrained by its operating
              network footprint: as of early 2026, the company operates across 66 US metropolitan markets, providing
              geographic coverage to 144 million Americans or 42% of the national population following an aggressive 50%
              year-over-year expansion into major western metropolitan hubs.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
