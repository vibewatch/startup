              - CE011
      - number: '5.2'
        title: Operating Model and Facility Network Architecture
        blocks:
          - type: paragraph
            body: >-
              Veho's physical operating model combines centralized regional injection hubs with an expansive
              crowdsourced driver network. As of early 2026, the company operates across 66 distinct metropolitan
              markets covering 144 million Americans, representing approximately 44% of the contiguous United States
              population. The backbone of this logistics footprint comprises 10 regional parcel injection and sortation
              hubs that coordinate more than 3,000 linehaul freight truck movements each month. Major facility
              expansions include two regional sortation facilities in Phoenix, Arizona, and Ontario, California,
              spanning over 150,000 square feet near critical intermodal rail, air, and marine hubs including the Ports
              of Los Angeles and Long Beach. Final-mile parcel delivery is executed by independent contractor driver
              partners who schedule flexible daytime and evening delivery blocks via mobile applications, allowing the
              network to absorb significant demand fluctuations during retail peak shopping seasons.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
