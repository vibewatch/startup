  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Target Retail Verticals
        blocks:
          - type: paragraph
            body: >-
              Veho's commercial model deliberately concentrates on premium direct-to-consumer and omnichannel retail
              segments where package delivery outcomes directly dictate consumer brand perception, repeat purchasing,
              and long-term customer lifetime value. Unlike legacy national parcel carriers that optimize for aggregate
              package density across generic industrial and commercial freight, Veho targets consumer-facing brands in
              apparel, beauty, specialty food, and personalized styling services that view doorstep delivery as an
              explicit extension of their digital storefront. These enterprise clients typically maintain high average
              order values and face acute customer churn penalties when shipments arrive late, damaged, or without
              transparent doorstep placement. Consequently, Veho's value proposition reframes parcel logistics from a
              pure freight cost line into a strategic retention driver for brand marketing and supply chain executives.
            claimRefs:
              - CU001
              - CU003
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU011
      - number: '6.2'
        title: Adoption Trajectory & Operational Footprint
        blocks:
          - type: paragraph
            body: >-
              Veho's commercial expansion has scaled from 14 operational markets at the end of 2021 to 65 major U.S.
              metropolitan markets as of 2026, creating dense regional last-mile delivery footprints across the East
              Coast, Midwest, Texas, and Sunbelt corridors. Enterprise brand adoption follows a standardized phased
              deployment playbook: rather than initiating national coverage on day one, brand shippers launch regional
              pilots across three to four metropolitan markets to evaluate delivery velocity, customer contact
              reductions, and on-time reliability against incumbent carrier baselines. As service quality benchmarks are
              established, shippers progressively expand carrier allocation across additional hubs. Operationally, Veho
              supports this trajectory through a flexible network of approximately 120,000 registered crowdsourced
              delivery partners managed via proprietary sortation and dispatch software. To broaden merchant adoption
              across different margin structures, Veho commercializes segmented shipping speeds, offering expedited
              Ground Plus for time-critical deliveries and FlexSave for cost-sensitive merchandise. This modular product
              structure enables enterprise retailers to pass transportation cost savings to consumers while maintaining
              consistent tracking and SMS-based delivery transparency.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU013
      - number: '6.3'
        title: Named Customer Deployments & Performance Proof
        blocks:
          - type: paragraph
            body: >-
              Documented customer case studies and operational announcements demonstrate substantial operational
              improvements across Veho's enterprise retail client base. Brand clients utilizing Veho's delivery network
              report cutting major metropolitan transit times in half, achieving an average 20% increase in customer
              repurchase frequency, an eight-point lift in Net Promoter Score, and a 40% expansion in customer lifetime
              value relative to traditional shipping alternatives. Shippers also report material operational
              efficiencies, including a two percentage point reduction in freight spend as a percentage of revenue and
              an approximate 50% decrease in package damage rates. Under Veho's commercial operating model, merchants
              retain complete ownership of consumer relationships, inventory reconciliation, and refund authorizations,
              while Veho operates as the specialized transportation execution partner. Driver partners capture
              photographic proof of delivery at recipient doorsteps and adhere to granular delivery instructions
              submitted by consumers in real time. This operational separation allows enterprise merchants to maintain
              strict brand governance while leveraging Veho's crowdsourced courier infrastructure to eliminate friction
              during the final fifty feet of the parcel lifecycle.
            claimRefs:
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU008
      - number: '6.4'
        title: Retention Durability, Concentration & Customer Friction
        blocks:
          - type: paragraph
            body: >-
              Despite high customer satisfaction scores, Veho faces persistent structural friction in customer retention
              durability and enterprise concentration. Industry research highlights that 89% of online shoppers have
              diverted orders to Amazon or Walmart due to superior delivery experiences, and 40% permanently cease
              purchasing from a merchant after experiencing a single lost package. Furthermore, independent consumer
              surveys reveal widespread recipient skepticism regarding crowdsourced gig couriers delivering high-value
              designer apparel and luxury goods, where consumers heavily prefer professional uniformed drivers. From an
              investment underwriting standpoint, Veho does not publicly disclose audited net revenue retention, gross
              revenue retention, annual client churn, or revenue concentration percentages among its top enterprise
              accounts. Given that last-mile logistics networks require immense localized package volume to maintain
              profitable driver utilization, the potential defection of an anchor retail account like Macy's or
              HelloFresh would severely undermine route density and unit economics in affected metropolitan sortation
              facilities.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated Post-Purchase Experience as an Enterprise Acquisition Lever
            body: >-
              Veho's focus on recipient-centric delivery—evidenced by a 99% on-time delivery rate, 4.9/5 satisfaction
              score, and proactive two-way SMS communication—allows premium retail brands to improve repeat purchase
              rates and Net Promoter Scores relative to legacy national parcel carriers.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Consumer Resistance to Gig Economy Delivery in Luxury Retail
            body: >-
              While crowdsourced delivery drivers offer variable cost flexibility, independent survey data showing heavy
              consumer preference for professional over gig delivery in luxury merchandise poses an adoption barrier for
              high-end fashion and jewelry brands concerned with theft, brand perception, and service consistency.
            calloutType: risk
            claimRefs:
              - CU003
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: Contractor Classification and Labor Standards'
        blocks:
          - type: paragraph
            body: >-
              Veho's core delivery logistics depend fundamentally on crowdsourcing independent contractor drivers who
              use their personal passenger vehicles to execute doorstep deliveries. This operating architecture creates
              substantial regulatory and legal exposure under federal Department of Labor guidelines and state wage
              orders such as California AB5. The legal scrutiny facing Veho was highlighted by an investigation
              initiated by plaintiffs' law firm Migliaccio and Rathod LLP regarding whether Veho Technologies improperly
              classified delivery drivers as independent contractors, withheld statutory minimum wages, or failed to
              reimburse vehicle operating expenses. Although the firm's formal intake investigation was closed on
              September 30, 2026 without a filed class action, the underlying vulnerability remains unmitigated. Veho
              drivers must supply personal vehicles, finance fuel and maintenance, adhere to app-directed routes, and
              perform package scanning and loading. Furthermore, in broader intellectual property and regulatory risk,
              European vehicle distributor Veho Group operates extensively in Finland, Sweden, and the Baltics,
              presenting potential international trademark clearance and entity confusion risks if US Veho expands
              internationally.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR012
      - number: '7.2'
        title: 'Operational and Quality Risk: Network Execution and Claims Management'
        blocks:
          - type: paragraph
            body: >-
              Operational reliability in last-mile e-commerce logistics requires flawless doorstep execution under tight
              time constraints. Veho provides next-day and two-day delivery across dozens of regional markets,
              maintaining strict operational protocols such as prohibiting drivers from entering customer residences or
              garages and mandating photo documentation for delivery confirmation. However, last-mile parcel logistics
              inherently suffers from delivery failure modes, including misdeliveries, damaged packaging, porch piracy,
              and inaccessible delivery locations. To manage commercial exposure, Veho's customer policies disclaim
              direct financial claims processing with consumers, routing all refund and replacement workflows back
              through the original merchant. While this contractual boundary protects Veho from immediate consumer cash
              claims, it shifts friction onto merchant partners whose brand equity suffers when deliveries fail.
              Additionally, Veho's commitments to automate sorting facilities and expand warehouse throughput introduce
              facility-level operational bottleneck risks during holiday volume surges, where unexpected sorting system
              downtime directly compromises delivery windows.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 'Partner and Dependency Risk: Enterprise Concentration and Legacy Carrier Power'
        blocks:
          - type: paragraph
            body: >-
              Veho's commercial expansion is highly reliant on volume from a concentrated portfolio of premium
              e-commerce and direct-to-consumer apparel and beauty brands. Public customer references indicate
              significant revenue concentration in anchor accounts such as Sephora, Lululemon, Revolve, and Macy's
              across its 66 to 78 active metropolitan markets. This customer concentration leaves Veho highly vulnerable
              to contract renegotiations, volume reallocation, or insourcing decisions by top-tier retailers.
              Concurrently, Veho faces formidable competitive pressure from national legacy parcel carriers, most
              notably Amazon Logistics, which controls approximately 50% of the US last-mile parcel delivery market,
              alongside FedEx and UPS. While Veho differentiates on customized communication, delivery windows, and
              doorstep returns, legacy carriers possess immense capital reserves, automated sorting infrastructure, and
              integrated air and ground freight networks. A predatory pricing push or aggressive service-level matching
              by national carriers in tier-1 metropolitan markets would squeeze Veho's delivery margins and constrain
              customer acquisition.
            claimRefs:
              - CR001
              - CR009
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Financial Resilience, Valuation Overhang, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              From a financing and balance sheet perspective, Veho's last-mile logistics network requires substantial
              ongoing working capital and facility lease commitments. In February 2022, Veho raised $170 million in
              Series B financing led by Tiger Global and SoftBank Vision Fund 2 at a post-money valuation of $1.5
              billion, following a $125 million Series A round six weeks prior. However, this $1.5 billion valuation
              mark was established at the zenith of venture capital tech-logistics valuations. In the subsequent years,
              logistics venture multiples have compressed dramatically. With audited financials, gross margins, cash
              burn, and cash balances withheld from public disclosure, Veho faces significant down-round or structured
              preference overhang risk in any prospective capital raise. A critical thesis-break trigger for investors
              would be a definitive administrative ruling or judicial precedent reclassifying crowdsourced delivery
              drivers as statutory employees, which would immediately impose mandatory payroll taxes, overtime
              obligations, and vehicle mileage reimbursements that would overwhelm platform economics.
            claimRefs:
              - CR008
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Existential Independent Contractor Reclassification Exposure
            body: >-
              Veho's operational cost advantage hinges on crowdsourced couriers who absorb personal vehicle operating
              costs, fuel, maintenance, and insurance. Department of Labor joint-employer and economic reality tests,
              alongside state wage orders, represent an existential regulatory vulnerability. A legal reclassification
              of drivers as employees would trigger mandatory payroll taxes, statutory minimum wage adjustments, and
              mileage reimbursements that would destroy platform unit economics.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Stale Valuation Mark and Financing Overhang
            body: >-
              Veho's $1.5 billion valuation from February 2022 is four years stale and reflects peak pandemic-era
              venture logistics multiples. Given the lack of public audited revenue, gross margins, or cash runway
              figures, any future liquidity event or growth equity raise carries severe risk of down-round repricing or
              onerous liquidation preferences unless sustained gross profitability is demonstrated.
            calloutType: insight
            claimRefs:
              - CR008
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Veho rests on its specialized positioning as a premium last-mile parcel
              carrier tailored explicitly for modern e-commerce brands, circumventing legacy hub-and-spoke networks with
              modern routing technology and crowdsourced driver capacity. Operating across more than 60 metropolitan
              markets, the platform provides consumer-centric features including SMS-driven delivery coordination,
              visual confirmation photos, and specialized handling that generate reported 99% on-time delivery metrics.
              These capabilities deliver demonstrated value to brand partners via improved post-purchase customer
              retention, expanded lifetime customer value, and substantial net promoter score enhancements compared to
              legacy parcel providers. Conversely, the anti-thesis centers on three structural headwinds: complete
              opacity surrounding unit economics and cash burn, severe vulnerability to independent contractor
              misclassification enforcement under evolving labor standards, and intense consumer friction during
              delivery exceptions as evidenced by customer dissatisfaction regarding lost packages, unyielding automated
              support, and lack of direct claim remediation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV011
      - number: '8.2'
        title: Recommendation, Risk Rating, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              We assign Veho an investment recommendation of track with medium confidence, a high risk rating, and a
              stretched valuation stance. The company has raised approximately $295M to $300M in total equity financing,
              culminating in a $1.5B to $1.6B post-money valuation mark established during its February 2022 Series B
              funding round co-led by Tiger Global Management and SoftBank Vision Fund 2. That financing event occurred
              during peak late-stage venture capital multiples for logistics and e-commerce infrastructure. In the four
              years elapsed since that transaction, public market comparables and private logistics valuations have
              compressed drastically, while Veho has provided no audited disclosure of net revenue, EBITDA, cash
              reserves, or contract renewal rates. Without audited financial statements proving sustainable gross
              margins and positive contribution economics per route, underwriting an entry at or near the historical
              $1.5B headline valuation represents excessive downside risk, warranting a disciplined wait-and-see stance
              pending a clean equity recapitalization or data-room disclosure.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario Analysis and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our scenario underwriting examines three divergence paths across bull, base, and bear outcomes. The bull
              case assumes Veho leverages its 907-person organization and over 99% on-time delivery track record to
              capture national market share among enterprise retail merchants, driving positive operating leverage and
              defending an equity valuation of $1.8B. The base case projects a realistic private market repricing to
              approximately $750M to $900M (representing a 40% to 50% discount to peak Series B marks), reflecting
              sector multiple contraction and customer service delivery challenges documented across independent
              consumer channels. The bear case models a severe valuation write-down to $250M to $350M triggered by
              regulatory or judicial reclassification of crowdsourced drivers as statutory employees, which would
              inflate unit delivery costs, crush variable margins, and necessitate aggressive dilutive recapitalization.
              Critical pre-investment diligence must prioritize data-room access to audited P&L statements, route-level
              unit contribution margins, driver retention data, and quantified legal contingent liabilities.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Stale Valuation Mark and Financial Opacity
            body: >-
              Veho's headline valuation of $1.5B dates back to February 2022, representing an unverified benchmark
              negotiated during peak venture exuberance. Without verified gross margin and cash burn disclosures,
              investors face severe down-round risk.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: callout
            title: Diligence Conditions Required for Underwriting
            body: >-
              A transition from track to buy requires three verifiable milestones: an arms-length priced round
              establishing market-clearing valuation, audited proof of route-level contribution profitability, and
              ring-fenced mitigation of driver misclassification exposure.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV014
              - CV015
