chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Veho was founded in 2016 by CEO Itamar Zur while attending Harvard Business School, created out of direct
              personal frustration with inconsistent consumer package deliveries and opaque tracking. The company
              operates as a technology-enabled parcel delivery platform specifically engineered for the e-commerce
              sector, positioning doorstep delivery as an extension of brand loyalty rather than merely a back-office
              cost center to be minimized. Headquartered in New York with major corporate operations and technology
              engineering hubs in Boulder and Dallas, Veho coordinates sorting centers and regional delivery networks
              across more than 40 major metropolitan markets. Rather than deploying traditional fleet vehicles and
              employee couriers, the operating model pairs localized cross-dock sorting warehouses with a flexible
              crowdsourced network of independent contractor drivers operating personal passenger vehicles. Software
              powers driver onboarding, real-time dispatch, AI-assisted route optimization, and end-customer
              communication, enabling delivery rescheduling, precise location photo capture, and door-to-door tracking.
              This positioning has attracted prominent direct-to-consumer apparel, beauty, and subscription brands
              seeking transit speed, reduced return friction, and personalized delivery experiences that match high
              customer acquisition costs.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO010
              - CO015
