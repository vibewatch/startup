  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Operational sequence and value conversion mechanics transforming merchant shipping volume into recognized revenue
      and operating contribution margin.
    data:
      nodes:
        - id: N1
          label: Merchant Package Injection
          description: E-commerce brand injects parcel volume at Veho sorting facility or regional distribution hub
        - id: N2
          label: Sortation & Route Optimization
          description: Hub personnel and automated sortation batch packages into high-density 2-6 hour delivery blocks
        - id: N3
          label: Crowdsourced Driver Dispatch
          description: Independent contractor driver claims block in mobile app with fixed upfront earnings commitment
        - id: N4
          label: Last-Mile Delivery Execution
          description: Doorstep delivery with photo verification, text communication, and customer tracking updates
        - id: N5
          label: Merchant Carriage Billing
          description: Per-parcel shipping fee invoiced to merchant without peak-season or residential accessorial surcharges
        - id: N6
          label: Contribution Margin Capture
          description: Carriage revenue less driver route payouts, hub facility leases, sortation labor, and claims overhead
      edges:
        - from: N1
