          tone: positive
        - date: '2017-03-07'
          label: Seed Financing
          detail: Veho closes its initial seed funding round to build software for crowd-sourced package delivery.
          tone: neutral
        - date: '2020-07-22'
          label: Early Series A Extension
          detail: Secures $4.16M financing round as pandemic accelerates demand for residential e-commerce delivery.
          tone: positive
        - date: '2021-12-21'
          label: Series A Unicorn Milestone
