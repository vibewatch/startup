callouts:
  - calloutType: "risk"
    title: "Existential Independent Contractor Reclassification Exposure"
    body: "Veho's operational cost advantage hinges on crowdsourced couriers who absorb personal vehicle operating costs, fuel, maintenance, and insurance. Department of Labor joint-employer and economic reality tests, alongside state wage orders, represent an existential regulatory vulnerability. A legal reclassification of drivers as employees would trigger mandatory payroll taxes, statutory minimum wage adjustments, and mileage reimbursements that would destroy platform unit economics."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
  - calloutType: "insight"
    title: "Stale Valuation Mark and Financing Overhang"
    body: "Veho's $1.5 billion valuation from February 2022 is four years stale and reflects peak pandemic-era venture logistics multiples. Given the lack of public audited revenue, gross margins, or cash runway figures, any future liquidity event or growth equity raise carries severe risk of down-round repricing or onerous liquidation preferences unless sustained gross profitability is demonstrated."
    claimRefs:
      - "CR008"
      - "CR010"
