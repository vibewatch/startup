evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financials-and-burn
    missingEvidence: Audited GAAP income statement, balance sheet, cash burn rate, cash runway, and gross margins.
    whyItMatters: >-
      Veho is an unlisted private company that has not raised primary equity capital since February 2022; assessing cash
      runway and solvency requires audited financial statements.
    diligencePath: Request audited financials and board-approved budget model in confidential management data room.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: Full executive roster, complete board of directors committees, and key technical architecture leads.
    whyItMatters: >-
      Public records only reveal co-founders, selected VP-level marketing leadership, and one external board member,
      leaving potential key-person dependencies obscured.
    diligencePath: Request comprehensive organizational chart and board governance agreements in management due diligence.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-and-cap-table
    missingEvidence: >-
      Complete detailed cap table including share classes, option pool, liquidation preferences, and secondary
      transaction records.
    whyItMatters: >-
      Public announcements reveal round lead investors but omit precise equity ownership percentages, seniority of
      preferred shares, and secondary liquidity terms.
    diligencePath: Review certified capitalization table and investor rights agreement during formal legal due diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Audited financial statements, gross margin figures, net revenue retention rates, and customer count breakdowns for
      Veho.
    whyItMatters: >-
      Without audited financials or disclosed gross margins, unit economics and operating leverage under the hybrid 3PL
      warehouse and gig-driver model cannot be independently verified.
    diligencePath: >-
      Request confidential data room access, including audited income statements, cohort retention schedules, and
      market-by-market contribution margin reports.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-win-rates
    missingEvidence: Audited win/loss records from Veho's Deal Desk detailing contract conversion rates against FedEx, UPS, and OnTrac.
    whyItMatters: >-
      Without empirical RFP win/loss conversion figures, commercial pricing durability and displacement trends cannot be
      precisely calculated.
    diligencePath: Review internal Deal Desk quarterly pipeline reviews and commercial bid performance debrief logs under NDA.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: contractor-turnover
    missingEvidence: >-
      Official driver partner retention rates, route abandonment metrics, and network-wide driver churn data across key
      markets.
    whyItMatters: >-
      High driver turnover under fixed-route pay models could inflate driver acquisition costs and impair service
      reliability during peak seasons.
    diligencePath: Request driver cohort retention metrics and route fulfillment telemetry from operations diligence.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: financial-metrics
    missingEvidence: >-
      Audited GAAP income statements, historical balance sheets, gross margin schedules, and current monthly cash burn
      data.
    whyItMatters: >-
      Without audited financial statements, underwriting cannot determine whether Veho generates positive gross
      contribution margins after driver and sortation labor or is burning capital to subsidize delivery rates.
    diligencePath: >-
      Request audited annual financial statements and quarterly management reports under non-disclosure agreement during
      formal data-room review.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Granular route-level economics including driver pay per delivered package, stop density curves, and lost-package
      claims costs.
    whyItMatters: >-
      Route profitability dictates whether density expansion converts into positive EBITDA or if driver churn and claims
      leakage exacerbate operating losses as volume grows.
    diligencePath: >-
      Obtain cohort-level unit economics across top five mature markets versus newer expansion metros from company
      management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: performance-metrics
    missingEvidence: >-
      Independent third-party audit or customer-corroborated benchmark dataset verifying Veho's claimed >99% on-time
      delivery (OTD) rate and 35% fully-landed cost savings.
    whyItMatters: >-
      On-time delivery and net landed cost savings are core value claims in commercial pitches; without third-party
      audit, performance figures represent unaudited vendor-reported metrics.
    diligencePath: >-
      Request blinded shipper cohort transit logs, service level agreement (SLA) penalty credit reports, and
      carrier-comparison billing audits from prospective investment data rooms.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: technology-stack
    missingEvidence: >-
      Proprietary software architecture documentation, algorithmic dispatch specifications, and codebase audit details
      for warehouse sortation and dynamic routing systems.
    whyItMatters: >-
      Veho claims a deep proprietary software advantage over legacy carriers, but technical architecture details remain
      privately held with limited external developer signals.
    diligencePath: >-
      Conduct a formal technical architecture review with Veho engineering leadership and inspect dispatch latency,
      algorithm optimization patents, and API telemetry.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: named-customer-contracts
    missingEvidence: >-
      Audited carrier allocation splits, multi-year volume commitments, and renewal terms for named enterprise retail
      accounts (including Macy's, Sephora, and Lululemon).
    whyItMatters: >-
      Without verified contract duration and volume commitments, durability of enterprise revenue cannot be confirmed
      against carrier switching.
    diligencePath: Request customer contract schedules, minimum volume commitments, and SLA penalty terms during data room diligence.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU009
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), annual customer churn rates, and revenue
      concentration percentages among top 5 accounts.
    whyItMatters: >-
      Last-mile parcel delivery platforms often suffer from high customer concentration where losing one anchor
      enterprise retail client severely disrupts route density.
    diligencePath: >-
      Review management presentations, audited customer cohort revenue retention matrices, and top-10 account revenue
      contribution tables.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: blocking
    topic: contingent-liability-and-ic-exposure
    missingEvidence: >-
      Audited payroll, driver mileage reimbursement audits, and legal reserve calculations regarding independent
      contractor misclassification exposure under Department of Labor guidelines and state wage orders.
    whyItMatters: >-
      A judicial reclassification of delivery drivers as statutory employees would impose retroactive FICA, minimum wage
      floor adjustments, workers' compensation insurance, and overtime liabilities that would eliminate gross operating
      margins.
    diligencePath: >-
      Review internal legal risk assessments, driver arbitration agreements, Class Action Waivers, and data-room
      contingent liability schedules in confirmatory diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: partner-and-customer-concentration
    missingEvidence: >-
      Audited customer revenue breakdown for top retail accounts (including Sephora, Lululemon, Revolve, and Macy's) and
      contract renewal schedules.
    whyItMatters: >-
      High concentration among a handful of enterprise e-commerce merchants creates catastrophic revenue fragility if an
      anchor brand insources logistics or renegotiates parcel rates.
    diligencePath: >-
      Request customer concentration matrices, Master Services Agreements (MSAs), termination-for-convenience clauses,
      and minimum volume commitments.
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: >-
      Audited financial statements detailing GAAP revenue, gross margins, contribution profit per delivery, and monthly
      cash burn rate.
    whyItMatters: >-
      Without verified route-level unit economics and cash balance disclosures, underwrite models cannot calculate an
      intrinsic valuation.
    diligencePath: >-
      Obtain confidential financial data room access and verify historical audited income statements and audited balance
      sheets.
    relatedQuestionRefs:
      - QV007
      - QV008
    relatedTableRefs:
      - TV001
