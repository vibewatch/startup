      - CR010
      - CR011
      - CR012
      - CR014
  - id: FV001
    title: 估值与建议决策逻辑
    type: flow
    summary: 将 Veho 的运营规模、结构性风险和估值时点转化为审慎跟踪建议的分步逻辑链。
    data:
      nodes:
        - id: scale
          label: 已证明规模：60+ 个市场、907 名员工、>99% OTD
        - id: governance
          label: 治理与资本：5 轮风险融资募资 $300M
        - id: opacity
          label: 财务不透明：收入、利润率与现金消耗未披露
        - id: risks
          label: 结构性风险：IC 劳工脆弱性与索赔纠纷
        - id: valuation
          label: 估值背景：2022 年 2 月确定的 $1.5B Series B 估值标记
        - id: decision
          label: 立场：估值偏高；投资决定：跟踪
      edges:
        - from: scale
          to: governance
        - from: governance
          to: opacity
        - from: opacity
          to: risks
        - from: risks
          to: valuation
        - from: valuation
          to: decision
    approximationNotes: 该流程图展示了基于已核实证据综合提炼的定性决策架构。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
