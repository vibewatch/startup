      - number: '3.3'
        title: 护城河持久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Veho 的防御性护城河主要来自企业客户的软切换成本、与电商平台的软件集成，以及司机间照片图钉访问记录等专有司机导航流程。Lululemon、Sephora、Macy's 和 HelloFresh 等企业品牌采用
              Veho，是为了提高客户终身价值、降低配送相关退款率和提升净推荐值。但企业包裹合同竞争激烈：多承运商运输软件（如 ShipEngine 和企业 TMS
              平台）让大型零售发货方可以根据区域价格和服务表现动态比价，并在承运商之间拆分货量。此外，Veho
              向司机合作伙伴按完成路线支付固定费率，而非保证时薪；扣除燃油和车辆维护成本后，司机实际收入会波动。如果传统承运商扩大灵活的零工式配送选项，网络将面临司机留存波动和劳动监管挑战。
            claimRefs:
