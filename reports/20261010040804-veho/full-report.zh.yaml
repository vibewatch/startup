  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Veho 主要通过直接向电商零售合作伙伴开具的单包裹运输费，将技术驱动型配送网络变现 [CI001, CI002]。Veho 没有复制 UPS、FedEx
              等传统包裹承运商复杂的附加服务费表，而是免收住宅配送附加费、取消假日旺季涨价，以此形成差异化定价 [CI002, CI013]。核心货量来自 60
              多个大都市市场的次日电商包裹运输，另有上门退货取件服务，以减少商户退货摩擦 [CI001, CI003]。2025 年 1 月，公司在 44 个市场推出 Premium Economy
              地面运输，扩充服务组合，为一磅以下轻型包裹提供保证两至五天配送时段 [CI006]。独立拆解分析估计，Veho 在覆盖邮编的定价比现有全国地面运输费率低 30% 至 40%
              [CI013]；但实际每件净收入和合同最低量仍是保密的私营数据。
            claimRefs:
              - CI001
              - CI002
              - CI003
