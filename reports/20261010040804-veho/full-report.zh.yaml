    approximationNotes: 序数评分将有记录的覆盖范围（1-10）与双向 SMS、门口退货等客户体验功能（1-10）进行对比。
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP007
      - CP008
      - CP011
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 展示将商户运输量转化为确认收入和运营贡献利润的运营流程及价值转化机制。
    data:
      nodes:
        - id: N1
          label: 商户包裹注入
          description: 电商品牌在 Veho 分拣设施或区域配送枢纽注入包裹量
        - id: N2
          label: 分拣与路线优化
          description: 枢纽人员和自动化分拣将包裹批量编入高密度的 2-6 小时配送时段
        - id: N3
          label: 众包司机调度
          description: 独立承包商司机在移动应用中主张领取时段，并获得固定的预付收入
        - id: N4
          label: 末端配送执行
          description: 在门口完成配送，并提供照片核验、短信沟通和客户跟踪更新
        - id: N5
          label: 商户运输计费
          description: 按包裹向商户开具运输费账单，不收取旺季或住宅附加访问费
        - id: N6
          label: 捕获贡献利润
          description: 运输收入扣除司机路线报酬、枢纽设施租赁、分拣人工和赔付主张管理费用
      edges:
        - from: N1
          to: N2
          label: 隔夜分拣
        - from: N2
          to: N3
          label: 司机应用分配
        - from: N3
          to: N4
          label: 门口配送
        - from: N4
          to: N5
          label: 配送确认
        - from: N5
          to: N6
          label: 利润实现
    approximationNotes: 基于公开拆解分析和承运商架构，展示运营流程及价值转化机制；实际利润差额属于机密。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI007
      - CI011
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从商户结账到末端门口投递，展示 Veho 软件与实体物流配送栈的六层架构。
    data:
      layers:
        - label: 商户集成层
          detail: 电商平台 API、购物车结账配送承诺组件和运输舱单摄入。
        - label: 履约与干线摄入
          detail: 10 个全国性注入与分拣枢纽协调从发货人仓库转运的干线货物。
        - label: 专有仓库管理系统（WMS）
          detail: 在 Veho 和 3PL 合作伙伴设施中部署标准化分拣、扫描和托盘化软件。
        - label: 动态调度与路线优化引擎
          detail: 通过算法路线规划，将优化后的包裹组合和配送时段分配给众包司机时段。
        - label: 末端众包配送网络
          detail: 独立承包商司机伙伴灵活执行住宅配送，并采集照片证明。
        - label: 消费者互动与核验层
          detail: 移动跟踪界面、SMS 通知网关、投递位置偏好和 4 位 PIN 安全机制。
    approximationNotes: 层级结构反映依据公司披露推导的运营数据和包裹流转；内部微服务边界属于专有信息，未予披露。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 六阶段生命周期涵盖品牌客户获取、试点部署、结账集成、门口履约、退货和业务量扩张。
    data:
      nodes:
        - id: stage-evaluation
          label: 1. ROI 评估与运输回报审计
          stage: Evaluation
          detail: 品牌将配送失败成本、客户服务联系量和包裹丢失率与 Veho 的 ROI 计算器进行对照评估。
        - id: stage-pilot
          label: 2. 区域试点部署
          stage: Pilot
          detail: 品牌在 3 到 4 个区域大都会市场启动测试，以基准化准时配送率和收件人 NPS。
        - id: stage-checkout
          label: 3. 结账与 API 集成
          stage: Integration
          detail: 商户连接库存和订单 API；客户选择配送速度层级（Ground Plus 与 FlexSave）。
        - id: stage-fulfillment
          label: 4. 分拣与众包门口配送
          stage: Fulfillment
          detail: 包裹通过 Maestro AI 分拣扫描后，调度给众包司机，并核验照片投递位置。
        - id: stage-communication
          label: 5. 实时双向客户沟通
          stage: Communication
          detail: 最终收件人接收 SMS 提醒、提交配送指示或访问 PIN，并解决配送异常。
        - id: stage-expansion
          label: 6. 多市场扩张与门口退货
          stage: Expansion
          detail: 客户将包裹量分配扩展至 65 个大都会枢纽，并启用门口退货流程。
    approximationNotes: 流程模型综合 Veho 高管访谈、产品文档和客户支持流程得出。
    claimRefs:
      - CU004
      - CU006
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
