      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Veho 的高管团队和公司愿景仍高度围绕联合创始人兼 CEO Itamar Zur 展开。自创立以来，他一直负责公司战略、股权融资和企业客户合作。技术联合创始人 Fred Cook
              在早期移动调度和路线分配基础设施的搭建中发挥了关键作用，目前仍在 Veho 董事会任职。更广泛的管理团队还包括营销副总裁 Catherine Dummitt
              等领域负责人；她负责商户研究与发货方沟通，另有运营负责人管理全国分拣枢纽和客户导入。公司治理由企业董事会执行，成员包括执行创始人和独立风险投资董事，其中 Kyle Doherty
              任职超过四年，负责资本配置和规模化监督。高管稳定性支持了公司向竞争激烈的沿海市场快速扩张，但由于 Zur
              在融资和机构客户关系中的核心作用，公司对关键人物的依赖仍然很高。管理层尽调应重点关注工程领导层留任、区域枢纽的运营管理深度，以及承包商安全和劳动合规的正式委员会监督。
            claimRefs:
