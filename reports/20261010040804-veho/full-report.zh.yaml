    title: 估值情景与敏感性框架
    columns:
      - 情景
      - 概率
      - 隐含估值
      - 关键运营假设
      - 下行 / 论点失效触发因素
    rows:
      - - 乐观情景
        - 20%
        - $1,800M
        - OTD 持续 >99%，扩展至 100 个市场，路线利润率 >15%
        - 未能进入持续 EBITDA 盈利
      - - 基准情景
        - 55%
        - $850M
        - 相比 2022 年估值标记下调 40-50%，温和增长，利润率持平
        - 可比物流公司的交易倍数进一步压缩
      - - 悲观情景
        - 25%
        - $300M
        - 司机被强制重新分类，配送赔付主张损失扩大
        - 锚定电商商户合同流失，现金消耗严重
    notes: 隐含估值基于情景建模，并以 2022 年 2 月 $1.5B 的 Series B 基准为参照。
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV014
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Veho 从 2016 年哈佛商学院项目起步，经历独角兽融资，并于 2026 年扩展至全国的时间进程。
    approximationNotes: 里程碑时间线依据公司公布日期、SEC / 风险融资公告及行业跟踪基准；单项发布时点四舍五入至公布月份。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO006
      - CO007
      - CO008
      - CO012
    data:
      items:
        - date: '2016'
          label: 公司成立
          detail: Itamar Zur 和 Fred Cook 在哈佛商学院将 Veho 启动为一个电商包裹配送项目。
          tone: positive
        - date: '2017-03-07'
          label: 种子融资
          detail: Veho 完成首轮种子融资，用于开发众包包裹配送软件。
          tone: neutral
        - date: '2020-07-22'
          label: 早期 Series A 延伸轮
          detail: 疫情加速住宅电商配送需求，Veho 获得 $4.16M 融资。
          tone: positive
        - date: '2021-12-21'
          label: Series A 独角兽里程碑
          detail: Veho 在 General Catalyst 和 Construct Capital 领投下募资 $125M，投后估值达到 $1.0B。
          tone: positive
        - date: '2022-02-15'
          label: Series B 成长融资
          detail: Veho 在 Tiger Global 和 SoftBank Vision Fund 2 领投下募资 $170M，估值 $1.5B–$1.6B，用于自动化枢纽。
          tone: positive
        - date: 2022-03
          label: 多市场扩张
          detail: Veho 扩展至包括 Orlando 在内的 15 个区域 MSA，目标是建立全国性的技术赋能配送网络。
          tone: neutral
        - date: '2025-10-13'
          label: 全国覆盖与区域盈利
          detail: Veho 宣布包裹量翻倍、进入 NYC 和 SoCal，并在所有运营区域实现盈利。
          tone: positive
        - date: '2026-01-01'
          label: 估值基准收缩
          detail: 二级市场跟踪将估值标记定为 $1.5B，较 2021 年 12 月 $1.6B 的峰值定价下降 7%。
          tone: risk
        - date: '2026-08-05'
          label: 《2026 年配送现状》发布
          detail: Veho 发布全国消费者研究，强调配送质量和跟踪能力决定客户的品牌忠诚度。
          tone: neutral
  - id: FM001
    title: Veho 可触达市场与规模测算层级
    type: pyramid
    summary: 以层级规模金字塔对比全球及北美包裹配送 TAM、Veho 的可触达人口覆盖范围和建模收入运行率。
    approximationNotes: 市场 TAM 估算来自第三方行业报告；人口覆盖对应 Veho 在美国的 66 个活跃市场；收入区间代表统计建模结果。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM007
      - CM015
    data:
      items:
        - label: 全球末端配送市场（2030E TAM）
          value: 258.68
          unit: USD Billion
          detail: 全球末端配送市场预计以 8.8% CAGR 增长，从 2022 年的 $132.71B 起算
        - label: 全球末端配送市场（2022 TAM 基线）
          value: 132.71
          unit: USD Billion
          detail: 覆盖所有包裹类别和运输细分的全球末端配送市场基线
        - label: 美国电商包裹配送支出（2021 年品牌基线）
          value: 110
          unit: USD Billion
          detail: 零售品牌通过传统承运商网络产生的包裹运输总支出
        - label: 北美末端配送市场（2022 SAM 视角）
          value: 41.14
          unit: USD Billion
          detail: 北美区域份额，占 2022 年全球末端配送市场的 31%
        - label: Veho 可服务人口触达（SOM 地理视角）
          value: 144
          unit: Million People
          detail: 截至 2026 年，Veho 枢纽服务覆盖 66 个大都会市场，占美国人口的 42%
        - label: Veho 年收入指标（当前建模运行率）
          value: 100
          unit: USD Million
          detail: 按 NAICS 4885 分类，统计建模收入区间（$100M-$500M）的下限
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 评估不同承运商模式，将配送体验和消费者触点个性化程度与地理网络覆盖进行比较。
    data:
      xAxis:
        label: 地理网络覆盖与资产广度
        min: 0
