      - number: '2.3'
        title: 买方画像与电商采用触发因素
        blocks:
          - type: paragraph
            body: >-
              Veho
              的商业扩张由电商品牌评估物流采购方式的根本变化推动。物流高管和首席商务官不再把运输仅视为运营成本中心，而越来越把购买后的体验当作促进客户复购的战略杠杆。研究显示，近三分之二的零售商已采用多承运商策略，使用三家或更多承运商，以避免单一供应商瓶颈和不断上升的附加费。与
              Veho 合作的品牌报告称，客户终身价值提升 19.2% 至 40%、净推荐值提升 8 个点、运输费用最多下降 21%，同时运费占收入比例下降两个百分点。Veho 与商户发货方保持直接 B2B
              计费关系；消费者退款和索赔争议则按合同由商户处理。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
      - number: '2.4'
        title: 宏观增长驱动、运营约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              区域包裹承运商的加速发展受电商包裹增长、商户对配送透明度的需求以及零售商对传统承运商旺季附加费的不满推动。为在保持轻资产的同时支持增长，Veho 采用约 68%
              仓库分拣设施由第三方物流（3PL）合作伙伴运营的模式，合作伙伴使用 Veho
              专有的路线规划与分拣技术，并配合众包零工司机网络。然而，独立战略分析指出了严重的结构性风险：公司持续现金消耗高，新区域枢纽的单位盈利路径尚未验证，并容易受到联邦和州独立承包商重新分类规则影响。经审计财报、准确客户数、毛利率和净收入留存率仍未披露，这些都是潜在投资者的关键尽调缺口。
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 承运商多元化的必然性
            body: 近三分之二的电商品牌采用三家或更多承运商后，配送已从单纯的成本最小化职能变成留存引擎。Veho 通过提供次日配送可靠性和交互式短信投递控制，减少客户服务咨询并提高品牌客户终身价值，从这一结构性转变中获益。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
          - type: callout
            title: 单位经济与零工劳动力脆弱性
            body: 尽管 Veho 已快速扩展至 66 个市场，但依赖众包零工司机使其持续暴露于独立承包商重新分类和劳动力成本上升风险。再加上未经验证的现金消耗率和未披露的毛利率，其轻资产配送网络的长期盈利能力仍是开放的尽调问题。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代模式
        blocks:
          - type: paragraph
            body: >-
              Veho 面临的竞争格局涵盖五种运营模式：全国传统综合承运商（FedEx、UPS）、区域包裹承运商（OnTrac、LaserShip、GLS）、众包零工配送网络（Amazon
              Flex、Roadie、DoorDash Drive）、零售商自营物流网络，以及传统邮政服务。在企业销售中，Veho 明确以 FedEx、UPS 等传统承运商以及 OnTrac、GoFo
              等区域玩家为基准。传统承运商依靠多层级全国枢纽辐射系统、专用飞机和货运车队；Veho 则依靠由独立合同司机和自有乘用车驱动的本地仓库到家配送架构。这种轻资产设计避免了资本密集型固定车队投资，并支持灵活的 7
              天运营，但在主要大都市集群以外容易出现网络密度不足，也让企业客户承受多承运商路由复杂度。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
      - number: '3.2'
        title: 竞争者画像与能力比较
        blocks:
          - type: paragraph
            body: >-
              企业包裹发货方会从配送速度选项、收件人可见性、客户支持响应、周末覆盖和逆向物流便利度等维度评估物流供应商。FedEx、UPS
              等传统全国承运商主导跨国中段运输、危险品运输和国际贸易，但通常对住宅周末配送实行僵化的多日地面运输时效和标准附加费。相比之下，Veho 的核心商业方案围绕 Ground Plus
              Suite，提供五种可定制配送速度，而非传统的地面与空运二元分类；同时配备双向交互短信追踪、上门配送照片验证，以及集成 QuikReturn 的无标签、无箱上门取件。不过，OnTrac
              等区域竞争者已将覆盖扩展到美国西部和东部多个区域，在保持专用商业车队、能够承载更重商业货物的同时，也提供激进的区域配送价格。
            claimRefs:
