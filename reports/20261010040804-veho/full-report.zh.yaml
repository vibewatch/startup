      - number: '4.2'
        title: 单位经济与运营成本结构
        blocks:
          - type: paragraph
            body: >-
              Veho 配送经济的核心是两至六小时路线时段模式：独立众包司机通过 Veho Driver 应用领取打包好的配送路线，并获得预先确定的固定收入 [CI001, CI005]。在这一结构下，Veho
              不承担车队资本开支和持续司机福利，但必须承担分拣设施租金、枢纽劳动力和中段运输成本 [CI005, CI014]。包裹丢失和损坏的赔付主张是持续的运营摩擦点；不过，Veho
              按合同将赔付处理和客户补偿转给商户卖家，而不是直接向零售收件人付款 [CI007]。因此，单位盈利几乎完全取决于大都市停靠点密度：Veho
              必须让每个路线时段的包裹吞吐量足够集中，使累计运输费超过路线承包商报酬、分拣间接成本和商户赔付让利 [CI014]。
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI014
