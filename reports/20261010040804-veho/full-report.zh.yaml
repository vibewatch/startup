chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Veho 由 CEO Itamar Zur 于 2016
              年就读哈佛商学院期间创立，源于他亲身经历消费者包裹配送不稳定、物流追踪不透明的挫败感。公司是一家专为电商行业打造的技术驱动型包裹配送平台，把上门配送定位为品牌忠诚度的延伸，而不是应被压缩的后台成本中心。公司总部位于纽约，并在
              Boulder 和 Dallas 设有主要企业运营与技术工程中心；Veho 在 40
              多个主要大都市市场协调分拣中心和区域配送网络。其运营模式不是传统车队加雇员配送员，而是将本地化越库分拣仓与灵活的众包独立承包司机网络结合起来，司机使用自有乘用车。软件负责司机入职、实时调度、AI
              辅助路线优化和终端客户沟通，支持改期配送、精确位置拍照及端到端追踪。凭借这一定位，公司吸引了知名 DTC 服装、美妆和订阅制品牌；这些品牌希望提升运输速度、减少退货摩擦，并提供与高获客成本相匹配的个性化配送体验。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO010
              - CO015
