      - number: '1.4'
        title: 运营里程碑、规模轨迹与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Veho 已从 2022 年初的 15 个区域大都市设施扩展到覆盖主要物流枢纽的全国运营网络，近期成功进入纽约市和南加州等密集、复杂的沿海市场。公司报告称，2025
              年通过分拣网络的包裹量翻倍，新客户导入量增长至三倍；企业客户包括 Macy's、Sephora、Lululemon 和 HelloFresh，准时配送率超过 99%，客户满意度平均为 4.9/5
              星。更关键的是，管理层声称目前所有区域运营市场均已盈利。尽管运营信号积极，尽调缺口仍然显著。Veho 曾在 2022 年公开预计到年底将员工数扩大四倍至 2,000 人；然而，截至 2026 年 8
              月，追踪到的员工数约为 1,129 人，显示招聘明显放缓或组织发生整合。最重要的是，Veho 仍由少数股东紧密持有，经过审计的 GAAP
              收入、毛利率结构、设施租赁负债、单位层面的司机获客成本和净现金消耗均完全未披露，使外部投资者无法看清核心投资判断。
