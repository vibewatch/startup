      - number: '1.3'
        title: 资本结构、估值与利益相关方
        blocks:
          - type: paragraph
            body: >-
              在 2021–2022 年物流科技创投热潮期间，Veho 加速扩充资本，分五轮累计获得 $300 million 股权融资。2021 年 12 月，公司完成由 General Catalyst 和
              Construct Capital 共同领投的 $125 million Series A，投后估值达到 $1.0 billion，成为独角兽。六周后，即 2022 年 2 月，Veho 完成 Tiger
              Global Management 领投、SoftBank Vision Fund 2 参与的 $170 million Series B，估值达到 $1.5 billion（在二级交易和播客资料中据报道最高为
              $1.6 billion）。Bling Capital、Origin Ventures 和 Industry Ventures 等早期投资者继续参与，Warby Parker、Allbirds 和
              Flexport 的知名 DTC 创始人也加入。可是，从 2022 年 2 月到 2026 年 10 月的四年多时间里，Veho 没有宣布后续首轮股权融资或债务融资。Tracxn 的私募交易基准显示，截至
              2026 年 1 月估计估值约为 $1.5 billion，较 2021 年峰值价格收缩 7%，凸显高资本强度末端物流的估值停滞风险。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO011
              - CO012
              - CO014
