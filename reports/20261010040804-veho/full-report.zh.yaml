  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与目标零售垂直领域
        blocks:
          - type: paragraph
            body: >-
              Veho 有意将商业模式集中在高端 DTC 和全渠道零售领域，因为包裹配送结果直接决定消费者对品牌的认知、复购和长期客户终身价值。传统全国包裹承运商优化的是通用工业和商业货运中的总体包裹密度；Veho
              则瞄准服装、美妆、特色食品和个性化造型服务等面向消费者的品牌，这些品牌把上门配送视为数字店铺的明确延伸。此类企业客户通常拥有较高平均订单价值；当货物延迟、损坏或没有透明地放置在门口时，客户流失代价会很高。因此，Veho
              将包裹物流从纯货运成本项目重新定义为品牌营销和供应链高管的战略留存驱动因素。
            claimRefs:
              - CU001
              - CU003
              - CU011
