      - number: '2.2'
        title: 市场规模视角与可触达范围
        blocks:
          - type: paragraph
            body: >-
              评估 Veho 的总体可触达市场，需要将更宽泛的物流数据拆解为可服务的电商包裹边界。独立市场研究估计，全球末端配送市场 2022 年为 $132.71 billion，预计到 2030 年以 8.8%
              的复合年增长率扩张至 $258.68 billion。北美约占总市场的 31%（2022 年为 $41.14
              billion），受持续的网购渗透和消费者对次日、两日配送标准的需求上升推动。在这一市场中，美国品牌包裹运输支出约为 $110 billion。Veho 的可服务机会受运营网络覆盖限制：截至 2026
              年初，公司覆盖美国 66 个大都市市场，为 144 million 美国人提供地理覆盖，占全国人口的 42%；过去一年向主要西部大都市枢纽扩张了 50%。
            claimRefs:
