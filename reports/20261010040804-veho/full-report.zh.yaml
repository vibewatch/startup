  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与物流支出范围
        blocks:
          - type: paragraph
            body: >-
              Veho 专注于 B2C 电商包裹配送，并有意将高接触度的上门包裹履约与传统货运经纪和长途运输区分开。按 North American Industry Classification
              System（NAICS）4885「货运运输安排」分类，统计估算认为公司的年化收入运行率在 $100 million 至 $500 million 之间。FedEx、UPS
              等传统枢纽辐射型承运商优先追求货量密度，而非个性化配送体验；Veho
              则从配送执行直接影响客户终身价值的品牌中获取运输预算。可服务支出包括次日和两日包裹运输、预约配送时段及协调式上门退货，但明确不包括短驳、整托盘大宗干线货运及两小时以内即时食品配送。
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
