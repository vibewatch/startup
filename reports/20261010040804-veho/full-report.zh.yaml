      - number: '6.2'
        title: 采用轨迹与运营覆盖
        blocks:
          - type: paragraph
            body: >-
              Veho 已从 2021 年底的 14 个运营市场扩展到 2026 年的 65 个美国主要大都市市场，在东海岸、中西部、Texas 和 Sunbelt
              走廊形成密集的区域末端配送覆盖。企业品牌采用标准化分阶段部署方案：发货方不是第一天就启动全国覆盖，而是先在三至四个大都市市场开展区域试点，评估配送速度、客户联系减少情况和相对于现有承运商基准的准时可靠性。服务质量基准建立后，发货方再逐步把承运商分配扩展到更多枢纽。运营上，Veho
