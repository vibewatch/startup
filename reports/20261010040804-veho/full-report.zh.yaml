      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              自 2016 年成立以来，Veho 累计获得约 $295M 至 $300M 机构股权资本，最终于 2022 年 2 月宣布 $170M Series B，估值为 $1.5B [CI008,
              CI009]。但之后四年里公司没有宣布任何定价股权融资，使其名义估值仍锚定在 2021–2022 年物流科技周期高点 [CI009]。2024 年 1 月，管理层削减约 19% 的企业员工（约 65
              个岗位），以控制现金消耗，并让业务朝 2025 年自筹资金盈利的既定目标靠拢 [CI010]。截至 2026 年初，企业员工数随后稳定在 1,000 人以下，远低于 Series B 后最初 2,000
              名企业员工的扩张目标 [CI012]。由于 Veho 没有正式公告确认 2025 年目标日期之后已经实现运营盈利，未来现金消耗和剩余流动性储备仍承受重大投资判断风险 [CI011]。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: 财务结论与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              从投资尽调角度看，Veho 是传统包裹承运商之外一个引人关注的高增长市场选项，公司的运营报告显示其在 60 多个市场的准时配送率超过 99%
              [CI003]。然而，私营财务信息完全不透明，构成机构投资判断无法跨越的障碍 [CI004]。公司没有披露经审计的 GAAP 收入、毛利率、EBITDA 轨迹或资产负债表流动性余额
              [CI004]。在没有包裹毛贡献、停靠点密度单位成本和司机留存经济学的已验证数据前，无法判断收入增长是在产生复合现金流，还是在放大配送亏损 [CI011,
              CI014]。在经审计财报和队列单位指标通过保密审阅提供之前，机构投资判断必须把未来偿付能力和资本充足性视为尚未证明的假设。
            claimRefs:
              - CI003
              - CI004
              - CI011
              - CI014
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 过时的估值基准与未来现金跑道不确定性
            body: >-
              自 2022 年 2 月 $170M Series B（确立 $1.5B 估值）以来，Veho 没有完成或宣布新的定价机构融资。管理层虽在 2024 年 1 月重组运营、目标于 2025
              年实现自筹资金盈利，但此后没有盈利公告，剩余现金跑道和潜在下轮估值风险因此高度不确定 [CI008, CI009, CI010, CI011]。
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: callout
            title: 停靠点密度是末端单位经济的决定性驱动因素
            body: >-
              Veho 的单位经济完全取决于覆盖大都市集群内的路线停靠点密度。承运商向司机支付固定路线时段并承担本地分拣枢纽租金，同时在无旺季附加费的情况下将地面运输价格压低 30% 至
              40%；要实现盈利，就必须把高包裹量集中到已有邮编，而不是过早进行地域扩张 [CI002, CI005, CI013, CI014]。
            calloutType: insight
            claimRefs:
