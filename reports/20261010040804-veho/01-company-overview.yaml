company:
  name: Veho
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Veho is a tech-enabled last-mile delivery operator serving premium e-commerce brands through a crowdsourced driver
    network, reaching a $1.5B valuation in 2022 before experiencing plateaued headcount and extended financial opacity
    through 2026.
sections:
  - id: identity-and-business-model
    title: Company Identity and Business Model
    body: >-
      Veho was founded in 2016 by CEO Itamar Zur while attending Harvard Business School, created out of direct personal
      frustration with inconsistent consumer package deliveries and opaque tracking. The company operates as a
      technology-enabled parcel delivery platform specifically engineered for the e-commerce sector, positioning
      doorstep delivery as an extension of brand loyalty rather than merely a back-office cost center to be minimized.
      Headquartered in New York with major corporate operations and technology engineering hubs in Boulder and Dallas,
      Veho coordinates sorting centers and regional delivery networks across more than 40 major metropolitan markets.
      Rather than deploying traditional fleet vehicles and employee couriers, the operating model pairs localized
      cross-dock sorting warehouses with a flexible crowdsourced network of independent contractor drivers operating
      personal passenger vehicles. Software powers driver onboarding, real-time dispatch, AI-assisted route
      optimization, and end-customer communication, enabling delivery rescheduling, precise location photo capture, and
      door-to-door tracking. This positioning has attracted prominent direct-to-consumer apparel, beauty, and
      subscription brands seeking transit speed, reduced return friction, and personalized delivery experiences that
      match high customer acquisition costs.
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO010
      - CO015
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Founders, Leadership, and Governance
    body: >-
      Veho’s executive leadership and vision remain tightly centered on co-founder and Chief Executive Officer Itamar
      Zur, who has led corporate strategy, equity fundraising, and enterprise client partnerships since inception.
      Technical co-founder Fred Cook played an instrumental role in architecting the initial mobile dispatch and route
      assignment infrastructure and continues to serve on Veho's board of directors. The broader management team
      includes specialized domain executives such as Vice President of Marketing Catherine Dummitt, who drives merchant
      research and shipper messaging, alongside operating leaders overseeing national sorting hubs and client
      onboarding. Governance is exercised through a corporate board comprising executive founders alongside independent
      venture directors including Kyle Doherty, who has served over four years providing capital allocation and scaling
      oversight. While executive stability has supported rapid geographic rollout into competitive coastal markets,
      key-person dependency on Zur remains high given his central role in capital formation and institutional customer
      relationships. Management diligence should focus on engineering leadership retention, depth of operational
      leadership in regional hubs, and formal committee oversight over contractor safety and labor compliance.
    claimRefs:
      - CO001
      - CO002
      - CO009
      - CO010
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholders
    title: Capitalization, Valuation, and Stakeholder Profile
    body: >-
      Veho established an accelerated capitalization trajectory during the 2021–2022 logistics technology venture boom,
      securing $300 million in total equity financing across five funding rounds. The company reached unicorn status in
      December 2021 upon closing a $125 million Series A round co-led by General Catalyst and Construct Capital at a
      $1.0 billion post-money valuation. Six weeks later, in February 2022, Veho completed a $170 million Series B round
      led by Tiger Global Management with participation from SoftBank Vision Fund 2, establishing a $1.5 billion
      valuation mark (reported at up to $1.6 billion in secondary and podcast references). The round drew participation
      from earlier investors including Bling Capital, Origin Ventures, and Industry Ventures, alongside notable
      direct-to-consumer founders from Warby Parker, Allbirds, and Flexport. However, Veho has announced no subsequent
      primary equity rounds or debt facilities in the more than four years between February 2022 and October 2026.
      Private transaction benchmarks from Tracxn reflect an estimated $1.5 billion valuation as of January 2026, marking
      a 7% contraction from peak 2021 pricing and underscoring valuation plateau risks in high-capital-intensity
      last-mile logistics.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO011
      - CO012
      - CO014
    tableRefs:
      - TO003
  - id: operational-scale-and-milestones
    title: Operational Milestones, Scale Trajectory, and Diligence Gaps
    body: >-
      Veho has expanded from 15 regional metropolitan facilities in early 2022 to a national operating network spanning
      major logistics hubs, including successful recent expansions into dense, complex coastal markets such as New York
      City and Southern California. The company reports having doubled parcel volume flowing through its sorting network
      and tripled new client onboardings during 2025, while maintaining an on-time delivery rate exceeding 99% and
      customer satisfaction ratings averaging 4.9 out of 5 stars across enterprise clients including Macy's, Sephora,
      Lululemon, and HelloFresh. Crucially, leadership has asserted that all regional operating markets are currently
      profitable. Despite these positive operational signals, significant diligence gaps persist. In 2022, Veho publicly
      projected quadrupling its headcount to 2,000 employees by year-end; however, tracked employment stood at
      approximately 1,129 as of August 2026, revealing substantial hiring moderation or organizational consolidation.
      Most critically, because Veho remains closely held, audited GAAP revenue, gross margin profiles, facility lease
      liabilities, unit-level driver acquisition costs, and net cash burn remain entirely undisclosed, creating
      fundamental underwriting blind spots for outside investors.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO012
      - CO013
      - CO014
      - CO015
    figureRefs:
      - FO001
