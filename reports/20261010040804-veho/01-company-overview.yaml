callouts:
  - calloutType: insight
    title: Valuation Mark Stagnation and Headcount Reality
    body: >-
      While Veho raised $170M in February 2022 at a $1.5B–$1.6B valuation with aggressive plans to quadruple headcount
      to 2,000 by year-end 2022, secondary and private market tracker data indicate headcount reached approximately
      1,129 by mid-2026, with no subsequent primary equity rounds announced in over four years.
    claimRefs:
      - CO004
      - CO005
      - CO012
      - CO013
      - CO014
  - calloutType: risk
    title: Financial Opacity and Independent Contractor Model
    body: >-
      Veho claims regional operational profitability and unit economic records, but private company status means audited
      revenue, gross margins, and cash runway remain undisclosed, while delivery operations rely fundamentally on tens
      of thousands of crowdsourced 1099 driver partners.
    claimRefs:
      - CO006
      - CO008
      - CO010
