callouts:
  - calloutType: "insight"
    title: "Multi-Modal Clinicogenomic Data Breadth as a Competitive Moat"
    body: >
      ConcertAI's multi-modal oncology repository spans over 5.5 million clinical patient records from CancerLinQ combined with de-identified genomic profiles from Foundation Medicine, Caris Life Sciences, NeoGenomics, and Guardant Health. By unifying EMR clinical records with radiological imaging and whole-slide pathology images, ConcertAI achieves a differentiated clinicogenomic dataset that allows biopharmaceutical sponsors to model disease progression, resistance mechanisms, and synthetic control arms.
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE010"
  - calloutType: "risk"
    title: "Technical Dependency on Third-Party Compute and Partner Data Assets"
    body: >
      The CARA AI software platform relies extensively on NVIDIA microservices (NIM, CUDA-X, NeMo) for core model training, fine-tuning, and low-latency inference. Furthermore, core data assets are governed by external partnerships including ASCO (CancerLinQ) and diagnostic testing providers (Foundation Medicine). Contractual renegotiations, data governance restrictions, or GPU hardware supply constraints represent material operational and architectural dependencies.
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE010"
      - "CE013"
