company:
  name: ConcertAI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    ConcertAI is a Cambridge-based healthcare intelligence company combining oncology
    real-world data with enterprise AI and workflow software. The strongest disclosed
    scale markers are a $1.9 billion post-investment valuation in March 2022, more than
    $230 million raised through Series C as reported in January 2025, and service to
    more than 2,000 healthcare providers as reported in January 2026; current revenue,
    ARR dollars, headcount, governance, and capitalization remain undisclosed.
sections:
  - id: identity-and-operating-scale
    title: Identity and operating scale
    body: >-
      ConcertAI positions itself as a healthcare intelligence platform that combines
      clinical expertise, real-world data, and applied AI for oncology and other complex
      diseases. Company materials say it was founded in 2018 and is headquartered in
      Cambridge, Massachusetts, with offices in Bangalore, Frankfurt, Philadelphia, and
      Tokyo. The latest allocated release says ConcertAI works with 75% of the top 30
      life-sciences organizations and more than 2,000 healthcare providers and medical
      societies. These are company-issued reach measures, not audited customer counts:
      they mix organizations, providers, and societies, and do not disclose contract
      value, retention, or concentration. The company also reports 321 publications in
      its research library, supporting scientific activity but not commercial adoption.
    claimRefs: [CO001, CO002, CO006, CO007, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership transition and governance visibility
    body: >-
      A January 2026 co-issued announcement identifies Eron Kelly as chief executive,
      whereas ConcertAI's January 2025 results and April 2025 Bayer announcement identify
      Jeff Elton as CEO. The evidence therefore supports a CEO transition by January
      2026, but not its effective date, rationale, employment terms, or board process.
      A March 2022 independent report also identified Romesh Wadhwani as executive
      chairman at that time. The assigned evidence does not establish a current founder
      roster, board composition, ownership voting rights, or succession plan. This
      creates key-person and governance diligence risk even though current executive
      continuity is visible at the CEO level.
    claimRefs: [CO008]
    tableRefs: [TO002]
  - id: capital-and-strategic-stakeholders
    title: Capital base and strategic stakeholders
    body: >-
      ConcertAI's last well-corroborated financing benchmark is the March 2022 Series C:
      SiliconANGLE reported a $150 million round led by Sixth Street at a $1.9 billion
      valuation, while ConcertAI later repeated the valuation and said it had raised more
      than $230 million through Series C. The latter is total funding raised, not cash
      available, and neither source discloses current liquidity, debt, secondaries, or
      dilution. Strategic relationships span capital, data, and workflow distribution.
      Allocated evidence identifies an AB Private Credit investment, a digital-trial
      collaboration with Bristol Myers Squibb, a multi-year Bayer agreement, and a
      Foundation Medicine data collaboration. These relationships validate ecosystem
      access but do not disclose contract economics.
    claimRefs: [CO003, CO004, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-evidence-boundaries
    title: Milestones and evidence boundaries
    body: >-
      The available chronology shows expansion from a 2018 foundation through financing,
      digital clinical-trial software, the CancerLinQ acquisition, enterprise AI products,
      and clinicogenomic partnerships. ConcertAI reported that 72% of FY2024 revenue was
      annually recurring and that it exited FY2024 profitable at a mid-teens unadjusted
      EBITDA margin. That metric is not ARR, and no absolute revenue, audited earnings,
      cash-flow, or balance-sheet figure is available in the allocated sources. The
      company's own publication catalog also includes research explicitly framed around
      pitfalls and challenges in real-world-data analysis. Scientific output is therefore
      a useful proof point, but dataset fitness, representativeness, and validation must
      still be tested use case by use case.
    claimRefs: [CO005, CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
