callouts:
  - calloutType: strength
    title: Cross-workflow data and partnership footprint
    body: >-
      ConcertAI has evidence of product deployment and data collaboration across
      Bristol Myers Squibb, Bayer, Foundation Medicine, and CancerLinQ, giving the
      platform multiple paths into research and care workflows.
    claimRefs: [CO010, CO011, CO012, CO013]
  - calloutType: risk
    title: Disclosure quality trails operating breadth
    body: >-
      Current revenue, ARR dollars, cash, headcount, cap-table ownership, debt,
      board composition, and CEO-transition terms are not supported by the assigned
      evidence, so operating breadth should not be mistaken for financial transparency.
    claimRefs: [CO004, CO005, CO008]
