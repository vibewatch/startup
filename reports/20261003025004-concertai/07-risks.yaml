callouts:
  - calloutType: "risk"
    title: "Clinical AI Liability and Algorithmic Decision-Support Exposure"
    body: "Deploying generative and agentic AI models directly into bedside oncology workflows across 900+ clinical care sites elevates legal liability. Even though ConcertAI markets CARAai and Cara as decision-augmentation tools rather than autonomous diagnostic devices, erroneous trial match recommendations or flawed cohort stratification could expose the enterprise to shared malpractice actions or sponsor protocol invalidation."
    claimRefs:
      - "CR003"
      - "CR005"
  - calloutType: "insight"
    title: "Capital Structure, Governance, and Secondary Market Discount"
    body: "ConcertAI has remained privately held since its March 2022 Series C round led by Sixth Street at a $1.9B valuation. Secondary trading on platforms like Forge Global and EquityZen remains thin, exposing pre-IPO shareholders to illiquidity discounts and valuation uncertainty until an explicit liquidity event or public filing establishes an audited valuation baseline."
    claimRefs:
      - "CR008"
      - "CR009"
