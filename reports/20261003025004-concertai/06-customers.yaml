figures:
  - id: "FU001"
    title: "Enterprise customer journey and expansion loop"
    type: "journey-map"
    summary: "The public evidence describes a high-touch path from an oncology workflow problem to scoped deployment, adoption, measured value, and partnership-led expansion."
    data:
      items:
        - label: "1. Identify a regulated workflow problem"
          detail: "A sponsor or provider targets trial, RWE, commercial, imaging, or care-delivery friction."
          touchpoints:
            - "Clinical development"
            - "Commercial operations"
        - label: "2. Establish a data foundation"
          detail: "ConcertAI scopes longitudinal oncology data, cohort, molecular, imaging, or site-network inputs."
          touchpoints:
            - "Precision360"
            - "CancerLinQ"
        - label: "3. Configure the solution"
          detail: "Product and scientific-service components are matched to the customer's use case."
          touchpoints:
            - "Patient360"
            - "Cadence Suite"
        - label: "4. Deploy and support adoption"
          detail: "Sales, product, delivery, and customer success coordinate implementation in the customer's workflow."
          touchpoints:
            - "Delivery"
            - "Customer success"
        - label: "5. Demonstrate measurable value"
          detail: "The intended proof is a customer-specific operational or clinical outcome, although public denominators remain limited."
          touchpoints:
            - "Adoption"
            - "Outcome measurement"
        - label: "6. Expand through trust networks"
          detail: "Repeatable value stories and partnerships support additional workflows, brands, sites, or data relationships."
          touchpoints:
            - "Platform expansion"
            - "Strategic partnerships"
    approximationNotes: "Conceptual journey synthesized from management descriptions; it is not a measured funnel and does not imply conversion rates."
    claimRefs:
      - "CU011"
      - "CU014"
