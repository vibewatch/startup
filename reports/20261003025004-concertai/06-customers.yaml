chapter:
  number: 6
  title: "Customers"
  summary: "ConcertAI reports broad penetration among large life-sciences companies and healthcare organizations, with product-level adoption signals spanning more than 1,000 Patient360 projects and more than 80 therapeutics under agreement. The evidence remains issuer-heavy: public retention, revenue concentration, contract-duration, and independently validated customer-outcome data are not disclosed in the assigned source set."
sections:
  - id: "customer-footprint"
    title: "Customer footprint spans life sciences and care delivery"
    body: >-
      ConcertAI positions life-sciences companies as the principal enterprise buyer while healthcare
      providers, research sites, medical societies, and imaging teams supply or use workflow-level
      capabilities. The company reports serving 75% of the top 30 life-sciences organizations; a
      January 2025 company update separately described 50 life-sciences companies and 2,000 healthcare
      providers and research sites globally. Those measures use different denominators and should not
      be read as a time series. They nevertheless indicate a two-sided footprint: sponsor demand for
      oncology data, trial, and commercial products, and provider participation in research and
      point-of-care workflows. No public revenue split by segment establishes which group pays most.
    claimRefs:
      - "CU001"
      - "CU002"
    tableRefs:
      - "TU001"
  - id: "adoption-signals"
    title: "Usage signals are meaningful but mostly company-reported"
    body: >-
      Public adoption evidence is strongest at the product and program level rather than at the
      contracted-customer level. ConcertAI reported more than 40 biopharma users and 1,000 completed
      Patient360 projects, alongside more than 80 therapeutics under agreement in its Commercial
      Solutions business. Current clinical-trial marketing also describes weekly curated access to
      more than 13 million de-identified patient records and claims a threefold recruitment uplift and
      a 50% reduction in study amendments. Commercial materials claim reductions in patient churn and
      time-to-therapy plus improved adherence. These are potentially valuable outcomes, but the pages
      do not disclose study design, baseline, sample size, customer identity, or measurement period.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "named-proof-and-durability"
    title: "Named relationships validate access, not retention"
    body: >-
      ConcertAI has identified Dewpoint Therapeutics and AbbVie as multi-year translational partners,
      and it describes molecular-data relationships with Caris, NeoGenomics, and Guardant. The
      NeoGenomics relationship includes a co-developed clinical-trial product, which is stronger proof
      than an unexplained customer logo. Even so, the assigned evidence does not establish whether
      each relationship is a paid production deployment, pilot, data-supply agreement, or co-marketing
      arrangement, and it gives no customer-specific outcome. A low-reputation RFP.wiki comparison
      also notes sparse public buyer reviews and opaque pricing and services dependence. That source
      is a useful adverse procurement signal, not an independent performance benchmark.
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "expansion-loop"
    title: "Expansion depends on repeatable value stories and delivery execution"
    body: >-
      Management frames expansion as a platform motion: demonstrate a measurable value story, embed
      the product in regulated workflows, and extend through trust-based partnerships. In May 2026,
      ConcertAI appointed a Commercial Solutions general manager with an explicit mandate to align
      sales, product, delivery, and customer success around adoption and predictable execution. This
      operating model is consistent with complex enterprise deployment, but it also exposes a
      diligence issue: without NRR, GRR, renewal, contract-length, or top-customer revenue data, public
      evidence cannot distinguish durable product expansion from services-intensive project growth.
      Investor diligence should therefore test the journey with contract cohorts and named references.
    claimRefs:
      - "CU011"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
