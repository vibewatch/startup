evidenceGaps:
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Authoritative current checks for litigation, regulatory actions, sanctions, recalls, outages, breaches, and
      material complaints.
    whyItMatters: >-
      The assigned search returned no retained adverse-event URL, and absence of a retained result cannot establish
      absence of an incident.
    diligencePath: >-
      Run legal and regulatory database checks and obtain management representations, incident logs, security reports,
      and litigation schedules.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: governance-and-capitalization
    missingEvidence: >-
      Current founder and board roster, cap table, voting rights, option pool, debt, secondaries, investor preferences,
      and CEO-transition documentation.
    whyItMatters: >-
      Control, dilution, key-person exposure, and financing seniority cannot be assessed from public partnership and
      funding announcements.
    diligencePath: >-
      Obtain the corporate register, board materials, capitalization table, financing agreements, debt schedule, and
      executive succession documents.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited revenue, ARR dollars, gross margin, cash flow, cash balance, burn, runway, retention, churn,
      concentration, and current headcount.
    whyItMatters: >-
      A recurring-revenue percentage and unadjusted EBITDA-margin claim do not establish revenue scale, cash generation,
      or durability.
    diligencePath: >-
      Request audited statements, quality-of-earnings work, SaaS cohort schedules, customer concentration, bank
      statements, and an HR roster.
  - type: missing-source
    severity: material
    topic: tam-validation
    missingEvidence: >-
      Granular, independent analyst research isolating standalone oncology RWD and trial SaaS SAM from the broader $26B
      life sciences AI TAM estimate.
    whyItMatters: >-
      Broad macro figures aggregate preclinical discovery AI tools with clinical RWD SaaS, obscuring the precise
      addressable spending ceiling for ConcertAI's core portfolio.
    diligencePath: >-
      Acquire licensed equity research or boutique life sciences informatics analyst reports (e.g., Gartner, IDC, Frost
      & Sullivan) detailing market share across RWD vendors.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: diversification-revenue
    missingEvidence: >-
      Audited segment revenue breakdown illustrating the percentage of ARR derived from oncology versus newly targeted
      neurology and imaging workflows.
    whyItMatters: >-
      Validates whether non-oncology therapeutic diversification is generating meaningful commercial traction or remains
      an exploratory product initiative.
    diligencePath: >-
      Request confidential management disclosure on franchise ARR contribution, pipeline ACV by disease area, and
      customer renewal rates by segment.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Audited enterprise contract terms, SaaS tier schedules, and professional services rate cards for ConcertAI and key
      peers (Tempus, Truveta).
    whyItMatters: >-
      Procurement teams and investors cannot precisely benchmark total cost of ownership or gross margin differentials
      without non-public commercial terms.
    diligencePath: Request anonymized customer contracts and vendor RFP rate sheets during formal commercial due diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: unit economics
    missingEvidence: Audited revenue recognition, product-level gross margin, cost-of-revenue detail, and cash conversion.
    whyItMatters: The public recurring-mix and EBITDA claims cannot establish scalable gross profit or free cash flow.
    diligencePath: >-
      Obtain audited FY2022-FY2026 financials, monthly management accounts, revenue-recognition policy, and product
      contribution-margin schedules.
    relatedQuestionRefs:
      - QI005
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital adequacy
    missingEvidence: >-
      Current cash, restricted cash, monthly burn, working capital, debt terms, contractual commitments, and downside
      runway.
    whyItMatters: Historical capital raised and valuation do not measure cash available or financing dependency in 2026.
    diligencePath: >-
      Request current balance sheet, 24-month cash forecast, debt and covenant schedule, cap table, and board-approved
      financing plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: sales efficiency
    missingEvidence: CAC, sales cycle, win rate, pipeline conversion, quota productivity, channel economics, and CAC payback.
    whyItMatters: Customer-penetration and outcome claims do not establish efficient acquisition or expansion.
    diligencePath: Review CRM cohort exports, bookings bridge, sales-capacity plan, commission structure, and channel agreements.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding and revenue definitions
    missingEvidence: >-
      Reconciliation of $230 million, $300 million, and $330 million funding totals and the period and definition behind
