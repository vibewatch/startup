callouts:
  - calloutType: "insight"
    title: "Market Convergence Around Multi-Modal RWD Clouds"
    body: "The life sciences RWD market has fundamentally shifted from single-modality datasets toward integrated clinical, genomic, and imaging clouds. Standalone EMR aggregators face commoditization, whereas multi-modal integration backed by representative provider networks like CancerLinQ commands premium pricing and entrenched enterprise workflows."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM007"
      - "CM013"
  - calloutType: "risk"
    title: "Therapeutic Concentration and Scaling Vulnerability"
    body: "ConcertAI's commanding market share in oncology represents both its greatest commercial strength and a key strategic vulnerability. Scaling beyond oncology into neurology or cardiology requires establishing novel clinical data networks and diagnostic partnerships, where enterprise competitors and incumbents maintain formidable entrenched positions."
    claimRefs:
      - "CM014"
      - "CM015"
      - "CM016"
