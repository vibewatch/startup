        title: Capital base and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              ConcertAI's last well-corroborated financing benchmark is the March 2022 Series C: SiliconANGLE reported a
              $150 million round led by Sixth Street at a $1.9 billion valuation, while ConcertAI later repeated the
