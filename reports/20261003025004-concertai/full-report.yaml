chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scale
        blocks:
          - type: paragraph
            body: >-
              ConcertAI positions itself as a healthcare intelligence platform that combines clinical expertise,
              real-world data, and applied AI for oncology and other complex diseases. Company materials say it was
              founded in 2018 and is headquartered in Cambridge, Massachusetts, with offices in Bangalore, Frankfurt,
              Philadelphia, and Tokyo. The latest allocated release says ConcertAI works with 75% of the top 30
              life-sciences organizations and more than 2,000 healthcare providers and medical societies. These are
              company-issued reach measures, not audited customer counts: they mix organizations, providers, and
              societies, and do not disclose contract value, retention, or concentration. The company also reports 321
              publications in its research library, supporting scientific activity but not commercial adoption.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO014
