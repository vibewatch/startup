      - number: '4.2'
        title: GTM motion and traction proxies
        blocks:
          - type: paragraph
            body: >-
              The public go-to-market evidence points to enterprise selling into large life-science companies and
              healthcare systems. ConcertAI reported serving 50 life-science companies and 2,000 providers and research
              sites in January 2025; its current website instead frames reach as 75% of the top 30 life-science
              companies and about 50% of the top 250 global healthcare systems. These denominators describe penetration,
              not recurring logos, contract values, or concentration. Commercial Solutions marketing claims reduced
              patient churn, higher adherence, faster time-to-fill, and shorter time-to-therapy. Such outcomes can
              support value-based selling, but they are company-issued and lack customer-level sample sizes, measurement
              periods, and independent validation. No public CAC, sales cycle, payback, pipeline conversion, quota
              productivity, or channel take-rate is available, so sales efficiency cannot be underwritten from adoption
              claims alone.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI015
              - CI016
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The operating model combines proprietary clinical data, partner-supplied genomic data, curation, cloud and
              GPU infrastructure, software, and managed-service delivery. The 2026 Foundation Medicine collaboration
              confirms a material external-data input, while ConcertAI separately claims that matching GPU
              infrastructure to workloads improved performance and lowered operating costs. Neither disclosure
              quantifies data rights, cloud cost, labor intensity, implementation expense, partner economics, or
              contribution margin. Historical financing also does not establish present liquidity: independent reporting
              supports a $150 million Series C at a $1.9 billion valuation in 2022, but total-capital records range from
              more than $230 million to $300 million and $330 million. Forge shows no current price and limited market
              activity. Cash on hand, debt, burn, runway, and next-round triggers are therefore unresolved.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
              - CI016
