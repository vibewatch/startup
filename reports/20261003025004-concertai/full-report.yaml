      - number: '1.2'
        title: Leadership transition and governance visibility
        blocks:
          - type: paragraph
            body: >-
              A January 2026 co-issued announcement identifies Eron Kelly as chief executive, whereas ConcertAI's
              January 2025 results and April 2025 Bayer announcement identify Jeff Elton as CEO. The evidence therefore
              supports a CEO transition by January 2026, but not its effective date, rationale, employment terms, or
              board process. A March 2022 independent report also identified Romesh Wadhwani as executive chairman at
              that time. The assigned evidence does not establish a current founder roster, board composition, ownership
              voting rights, or succession plan. This creates key-person and governance diligence risk even though
              current executive continuity is visible at the CEO level.
