        - label: 2. Establish a data foundation
          detail: ConcertAI scopes longitudinal oncology data, cohort, molecular, imaging, or site-network inputs.
          touchpoints:
            - Precision360
            - CancerLinQ
        - label: 3. Configure the solution
          detail: Product and scientific-service components are matched to the customer's use case.
          touchpoints:
            - Patient360
            - Cadence Suite
        - label: 4. Deploy and support adoption
          detail: Sales, product, delivery, and customer success coordinate implementation in the customer's workflow.
          touchpoints:
