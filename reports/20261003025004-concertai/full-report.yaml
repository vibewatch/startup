            body: >-
              ConcertAI presents a portfolio rather than a single homogeneous subscription: data access through DaaS,
              workflow products through AI SaaS, Commercial Solutions delivered as a SaaS managed service, and
              healthcare-provider offerings such as CancerLinQ and enterprise imaging. Management's strongest
