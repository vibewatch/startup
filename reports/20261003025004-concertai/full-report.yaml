              - CI003
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality appears directionally better than a project-only services model because management reports
              a majority recurring mix and positive unadjusted EBITDA at FY2024 exit. However, the public record is not
              sufficient for an investment-grade financial model. Multiples records $200 million as of March 2022 but
              explicitly says its field may represent revenue or ARR and may use run-rate or LTM periods; it is not a
              clean audited revenue denominator. The recurring mix likewise does not reveal retention, gross margin,
              cash conversion, or concentration. A financial close should require audited statements, revenue-by-product
              and top-customer schedules, cohort retention, realized pricing, implementation and data costs,
              CAC/payback, cash and debt schedules, and a monthly runway bridge. Until those are supplied, revenue
              durability, margin scalability, and capital adequacy remain diligence blockers rather than model inputs.
            claimRefs:
              - CI002
              - CI003
              - CI011
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recurring revenue is not disclosed ARR
            body: >-
              The 72% figure describes the share of total revenue called annually recurring; no ARR balance, NRR, GRR,
              or recurring-revenue dollar amount is public in the assigned evidence.
            calloutType: risk
            claimRefs:
              - CI002
              - CI016
          - type: callout
            title: Block model precision until the data room closes the gaps
            body: >-
              Do not estimate pricing, gross margin, CAC/payback, cash burn, or runway from adoption and funding
              headlines; require source financial schedules and contract cohorts.
            calloutType: recommendation
            claimRefs:
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Clinical Workflow Integration
        blocks:
          - type: paragraph
            body: >
              ConcertAI delivers software-as-a-service (SaaS) and data-as-a-service (DaaS) solutions engineered to
              support biopharmaceutical developers, healthcare providers, and clinical research organizations across the
              therapeutic lifecycle. The foundation of its product delivery is CARA AI, a purpose-built enterprise AI
              platform designed to process complex clinical, radiological, and molecular datasets. Operating alongside
              CARA AI is the Precision Suite, which integrates real-world oncology datasets with specialized analytical
              modules for translational medicine, regulatory decision-making, and commercial execution. To address
              workflow friction in life sciences enterprises, ConcertAI packages its technology into functional
              applications including Patient360 for longitudinal cohort curation, Cadence Suite for commercial patient
              journey tracking and adherence optimization, and the Accelerated Clinical Trial and Accelerated Patient
              Actions Suites. Diagnostic imaging workflows are addressed through TeraRecon, an enterprise radiological
              software business delivering advanced visualization and clinical AI decision augmentation for computed
              tomography (CT) and magnetic resonance imaging (MRI).
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE007
      - number: '5.2'
        title: Operating Architecture, Data Ingestion, and Infrastructure Dependencies
        blocks:
          - type: paragraph
            body: >
              The underlying technical architecture of ConcertAI rests upon a multi-tier pipeline spanning heterogeneous
              data aggregation, AI curation, and secure application delivery. Data ingestion relies on the ConcertAI
              Data Foundry, which normalizes electronic medical records (EMR), laboratory results, next-generation
              sequencing panels, and DICOM imaging from more than 2,000 healthcare providers and research sites. In
              December 2023, the acquisition of the American Society of Clinical Oncology (ASCO) CancerLinQ initiative
              integrated over 5.5 million multi-modal oncology records, establishing an independent data repository
              covering community and academic oncology sites across all 50 U.S. states. To process unstructured
              pathology reports and multi-modal records at scale, ConcertAI collaborates with NVIDIA, utilizing NVIDIA
              Inference Microservices (NIM) including Meta Llama 3 NIM, Vision Language Models (VLM), and NVIDIA CUDA-X
              microservices. This infrastructure powers domain-specific oncology foundation models and automated
              clinical entity extraction, enabling automated clinical trial protocol matching and translational
              simulations while reducing GPU computing overhead across enterprise cloud deployments.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
