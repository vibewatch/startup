      - Anti-thesis
      - What would change the view
    rows:
      - - Revenue quality
        - Management says 72% of FY2024 revenue was annually recurring.
        - The disclosure is a revenue-mix percentage, not ARR dollars or retention.
        - Audited recurring revenue by product plus gross and net retention cohorts.
      - - Profitability
        - Management says ConcertAI exited FY2024 profitable at mid-teens unadjusted EBITDA margins.
        - Unadjusted EBITDA does not establish GAAP profit, free cash flow, or cash burn.
        - Audited EBITDA reconciliation, cash-flow statement, and capitalization policy.
      - - Commercial reach
        - >-
          Company disclosures cite 50 life-science companies, 2,000 provider or research sites, and broad top-company
          penetration.
        - Customer counts and penetration do not reveal concentration, contract value, renewal, or churn.
        - Customer-level ARR concentration, renewal cohorts, and independent reference calls.
      - - Valuation and liquidity
        - A $1.9B financing benchmark is corroborated across the investor, company, and independent news sources.
        - The benchmark dates to 2022, while Forge reports limited activity and no available price.
        - A current arm's-length round, qualified secondary trade, or supportable valuation using audited metrics.
    notes: >-
      Company-issued performance claims are shown as claims, not independently verified benchmarks; the financing amount
      and valuation are corroborated by independent reporting.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Probability signal
      - Downside or confirmation trigger
    rows:
      - - Bull
        - Audited growth and retention validate commercial reach; recurring mix expands; profitability converts to cash.
        - >-
          No public range supportable; apply a normalized peer multiple only after audited inputs and net debt are
          known.
        - Unsupported until independent financial and customer evidence is obtained.
        - Confirmation requires current audited metrics, durable renewals, and a clean preference stack.
      - - Base
        - Commercial relationships persist and FY2024 profitability proves durable, but growth moderates.
        - No public range supportable; compare a diligence-derived value with the historical $1.9B benchmark.
        - Plausible operating case, but valuation probability cannot be estimated publicly.
        - Reassess if retention weakens, margin falls, or current pricing cannot clear the historical benchmark.
      - - Bear
        - >-
          Renewals weaken, reported profitability reverses, liquidity remains thin, or new capital prices below the
          historical mark.
        - >-
          Downside cannot be quantified without preferences and debt; common-equity recovery may diverge from enterprise
          value.
        - Material risk because price discovery and capital structure are opaque.
        - >-
          Thesis break on a down-round without offsetting value creation or on structurally senior claims that impair
          returns.
    notes: >-
      No numeric valuation ranges or probabilities are supplied because current price, audited forecasts, net debt,
      dilution, and preference terms are not public in the retained evidence.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV011
      - CV012
      - CV015
      - CV016
