callouts:
  - calloutType: "strength"
    title: "Independent Network Moat Through CancerLinQ Integration"
    body: "ConcertAI's integration of the ASCO CancerLinQ initiative provides an EMR-agnostic data asset spanning nearly 1,000 community and academic oncology sites. Unlike EHR-vendor-tied datasets or single-consortium health systems, this network offers longitudinal multi-modal clinical representation across 50 states, substantially enhancing real-world evidence validity for regulatory submissions."
    claimRefs:
      - "CP008"
      - "CP009"
  - calloutType: "risk"
    title: "High Services Dependency and Commercial Opacity"
    body: "Independent procurement reviews identify enterprise pricing opacity and heavy reliance on professional services as recurring adoption hurdles. Prospective biopharma sponsors face complex TCO forecasting, as complete self-service analytics remains constrained and meaningful cohort insights frequently mandate vendor scientific support."
    claimRefs:
      - "CP007"
      - "CP002"
