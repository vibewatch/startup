company:
  name: "ConcertAI"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    ConcertAI reports a mixed DaaS, AI SaaS, and managed-services model, with 72% of FY2024
    revenue described as annually recurring and a profitable year-end at mid-teens unadjusted
    EBITDA margins. Those company claims are encouraging, but public evidence does not disclose
    pricing, gross margin, retention, sales efficiency, cash, burn, or runway, and historical
    funding and revenue records use conflicting amounts and definitions.
sections:
  - id: "revenue-quality"
    title: "Revenue model and quality"
    body: >-
      ConcertAI presents a portfolio rather than a single homogeneous subscription: data access
      through DaaS, workflow products through AI SaaS, Commercial Solutions delivered as a SaaS
      managed service, and healthcare-provider offerings such as CancerLinQ and enterprise
      imaging. Management's strongest revenue-quality disclosure is that 72% of FY2024 total
      revenue was annually recurring. That is a revenue-mix statement, not an ARR balance, and it
      should not be converted into ARR dollars. The company also said it exited FY2024 profitable
      with mid-teens unadjusted EBITDA margins, but the assigned evidence contains no audited
      reconciliation, segment mix, gross margin, or definition of the adjustment basis. More than
      80 therapeutics under agreement supports commercial activity, but it is neither a customer
      count nor a revenue measure. Public list prices and realized contract economics remain
      undisclosed.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI016"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "gtm-and-traction"
    title: "GTM motion and traction proxies"
    body: >-
      The public go-to-market evidence points to enterprise selling into large life-science
      companies and healthcare systems. ConcertAI reported serving 50 life-science companies and
      2,000 providers and research sites in January 2025; its current website instead frames reach
      as 75% of the top 30 life-science companies and about 50% of the top 250 global healthcare
      systems. These denominators describe penetration, not recurring logos, contract values, or
      concentration. Commercial Solutions marketing claims reduced patient churn, higher
      adherence, faster time-to-fill, and shorter time-to-therapy. Such outcomes can support
      value-based selling, but they are company-issued and lack customer-level sample sizes,
      measurement periods, and independent validation. No public CAC, sales cycle, payback,
      pipeline conversion, quota productivity, or channel take-rate is available, so sales
      efficiency cannot be underwritten from adoption claims alone.
    claimRefs: ["CI004", "CI005", "CI006", "CI015", "CI016"]
  - id: "cost-and-capital"
    title: "Cost structure and capital adequacy"
    body: >-
      The operating model combines proprietary clinical data, partner-supplied genomic data,
      curation, cloud and GPU infrastructure, software, and managed-service delivery. The 2026
      Foundation Medicine collaboration confirms a material external-data input, while ConcertAI
      separately claims that matching GPU infrastructure to workloads improved performance and
      lowered operating costs. Neither disclosure quantifies data rights, cloud cost, labor
      intensity, implementation expense, partner economics, or contribution margin. Historical
      financing also does not establish present liquidity: independent reporting supports a
      $150 million Series C at a $1.9 billion valuation in 2022, but total-capital records range
      from more than $230 million to $300 million and $330 million. Forge shows no current price
      and limited market activity. Cash on hand, debt, burn, runway, and next-round triggers are
      therefore unresolved.
    claimRefs: ["CI007", "CI008", "CI009", "CI010", "CI012", "CI013", "CI014", "CI016"]
    tableRefs: ["TI003"]
  - id: "financial-verdict"
    title: "Financial verdict and underwriting blockers"
    body: >-
      Revenue quality appears directionally better than a project-only services model because
      management reports a majority recurring mix and positive unadjusted EBITDA at FY2024 exit.
      However, the public record is not sufficient for an investment-grade financial model.
      Multiples records $200 million as of March 2022 but explicitly says its field may represent
      revenue or ARR and may use run-rate or LTM periods; it is not a clean audited revenue
      denominator. The recurring mix likewise does not reveal retention, gross margin, cash
      conversion, or concentration. A financial close should require audited statements,
      revenue-by-product and top-customer schedules, cohort retention, realized pricing,
      implementation and data costs, CAC/payback, cash and debt schedules, and a monthly runway
      bridge. Until those are supplied, revenue durability, margin scalability, and capital
      adequacy remain diligence blockers rather than model inputs.
    claimRefs: ["CI002", "CI003", "CI011", "CI016"]
