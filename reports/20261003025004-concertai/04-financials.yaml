    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI013", "CI014"]
callouts:
  - calloutType: "risk"
    title: "Recurring revenue is not disclosed ARR"
    body: "The 72% figure describes the share of total revenue called annually recurring; no ARR balance, NRR, GRR, or recurring-revenue dollar amount is public in the assigned evidence."
    claimRefs: ["CI002", "CI016"]
  - calloutType: "recommendation"
    title: "Block model precision until the data room closes the gaps"
    body: "Do not estimate pricing, gross margin, CAC/payback, cash burn, or runway from adoption and funding headlines; require source financial schedules and contract cohorts."
    claimRefs: ["CI016"]
