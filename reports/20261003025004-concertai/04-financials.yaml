  - id: "TI003"
    title: "Unit economics and capital-adequacy scoreboard"
    columns:
      - "Metric"
      - "Public value"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Annually recurring revenue mix", "72% of FY2024 total revenue, company-claimed", "Medium", "Indicates recurring mix but is not ARR dollars or retention", "Definition, audited revenue bridge, product mix, and contract cohort schedule"]
      - ["Unadjusted EBITDA margin", "Mid-teens at FY2024 exit, company-claimed", "Medium", "Suggests operating leverage but does not establish cash generation", "Monthly P&L, EBITDA reconciliation, stock compensation, capitalization policy, and cash-flow bridge"]
      - ["Recorded revenue benchmark", "$200M as of March 2022 in Multiples; field may be revenue or ARR and run-rate or LTM", "Low", "Period and denominator ambiguity make the number unsuitable for trend modeling", "Audited FY2022-FY2026 revenue with recognized, contracted, and recurring components"]
      - ["Gross margin and contribution margin", null, "Unavailable", "Core test of data, cloud, and managed-service scalability", "Gross margin by DaaS, SaaS, managed service, imaging, and implementation"]
      - ["CAC, sales cycle, and payback", null, "Unavailable", "Required to assess enterprise GTM efficiency", "New and expansion bookings, sales and marketing spend, fully loaded CAC, cycle, win rate, and payback"]
      - ["NRR, GRR, churn, and concentration", null, "Unavailable", "Required to validate recurring revenue durability", "Logo and dollar retention cohorts plus top-10 customer and therapeutic exposure"]
      - ["Cash, burn, runway, debt, and obligations", null, "Unavailable", "Funding raised is not cash available", "Current cash, restricted cash, debt terms, monthly burn, working capital, commitments, and downside runway"]
    notes: "Values preserve source labels and periods. Null means the assigned public evidence does not disclose the metric; historical funding raised is not treated as current liquidity."
    claimRefs: ["CI002", "CI003", "CI007", "CI008", "CI009", "CI010", "CI011", "CI016"]
