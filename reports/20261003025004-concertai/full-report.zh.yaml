    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与业务规模
        blocks:
          - type: paragraph
            body: >-
              ConcertAI 将自身定位为医疗健康智能平台，整合临床专业经验、真实世界数据与应用 AI，服务于肿瘤及其他复杂疾病领域。公司资料称其成立于 2018
              年，总部位于马萨诸塞州剑桥，并在班加罗尔、法兰克福、费城和东京设有办事处。最新下发的新闻稿称，ConcertAI 与前 30 大生命科学机构中的 75% 以及 2,000
              多家医疗机构和医学学会建立了合作。上述指标均属公司单方披露的覆盖范围，而非经审计的客户数：统计中混杂了企业、医疗机构与学会，且未披露合同金额、留存率或客户集中度。公司还披露其研究库收录了 321
              篇学术成果，虽能佐证其科研活跃度，但无法证明商业化落地成效。
