              Private Credit 的投资，与 Bristol Myers Squibb 开展了数字化临床试验合作，与 Bayer 签署了多年期协议，并与 Foundation Medicine
              达成了数据合作。这些合作证实了其生态准入能力，但未披露具体的合同商业条款。
