          - type: paragraph
            body: >-
              公开的市场拓展（GTM）证据表明，其主要采用面向大型生命科学企业和医疗系统的企业级直销模式。ConcertAI 披露其在 2025 年 1 月服务于 50 家生命科学企业以及 2,000
              家医疗服务机构与研究中心；其当前官网则将业务触达表述为前 30 大生命科学企业中的 75% 以及全球前 250 大医疗系统中的约
              50%。这些分母描述的是渗透率，而非持续付费的客户数、合同金额或集中度。Commercial Solutions
              的营销材料宣称其降低了患者流失率、提升了用药依从性、缩短了配药耗时并加快了治疗启动。这些成效固然有助于支撑基于价值的销售，但均属公司单方宣传，缺乏客户层面的样本量、测算周期以及第三方独立验证。未见任何公开的获客成本（CAC）、销售周期、回本周期、商机转化率、人均产能或渠道分成比例数据，因此仅凭采纳率宣传无法对销售效率做出投资研判。
