            - Cadence Suite
        - label: 4. 交付部署并支持系统采用
          detail: 销售、产品、交付与客户成功团队协同配合，推动方案在客户业务流程中落地。
          touchpoints:
            - 交付
            - 客户成功
        - label: 5. 展现可量化价值
          detail: 目标是以客户特定的运营效率或临床结果为依据提供验证，不过公开可查的对照基准仍相对有限。
          touchpoints:
            - 业务采用
            - 成效衡量
        - label: 6. 依托信任网络拓展业务
          detail: 可复制的价值成效案例与伙伴关系支持向更多工作流、品牌、研究中心或数据合作关系延伸。
          touchpoints:
            - 平台拓展
            - 战略合作伙伴
    approximationNotes: 基于管理层陈述归纳的概念性客户旅程；并非经实际测算的漏斗模型，亦不代表真实转化率。
    claimRefs:
      - CU011
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 评估主要监管、运营、合作伙伴及市场风险维度的严重程度与发生概率。
    approximationNotes: 发生概率与影响程度评级综合自尽调披露信息及监管框架要求。
    data:
      columns:
        - 低概率
        - 较低概率
        - 较高概率
        - 高概率
        - 极高概率
        - 必然发生
      rows:
        - label: 重大影响
          values:
            - label: 数据泄露 / 违反 HIPAA 规范
            - label: 未通过 FDA 预期使用环境（COU）监管审查
            - label: 核心诊断合作伙伴解除合作
            - label: 核心肿瘤 EHR 访问权限被撤销
            - label: 临床试验终点系统性失效
            - label: 医疗事故不可控责任溢出
        - label: 高影响
          values:
            - label: TeraRecon QMS / ISO 13485 制裁与处罚
            - label: 床旁临床 AI 法律责任
            - label: 退出时估值倍数压缩
            - label: 前 50 大生物制药核心大客户流失
            - label: 管理层变动导致产品路线图长期停滞
            - label: 高毛利商业分析合同流失
        - label: 中等影响
          values:
            - label: GPU 算力基础设施瓶颈
            - label: C-Suite 治理过渡摩擦
            - label: 老股转让流动性折价
            - label: 临床中心数据接入延迟
            - label: 跨模态数据治理归一化开销
            - label: 亚太地区销售周期拉长
        - label: 低影响
          values:
            - label: 临床试验筛选方案轻微偏差
            - label: 常规临床决策支持人工覆盖
            - label: 云端数据传出成本小幅攀升
            - label: 单中心训练数据集个别异常值
            - label: 数据接入期间临时 API 限流
            - label: 放射科医生常规界面偏好摩擦
        - label: 可忽略影响
          values:
            - label: 非关键合成对照组重新校准
            - label: 营销分析查询短暂延迟
            - label: 内部沙盒环境重新索引
            - label: 常规软件补丁排期冲突
            - label: 回顾性病历记录轻微差异
            - label: Web 门户偶发可视化显示故障
        - label: 信息级影响
          values:
            - label: 学术会议演讲排期调整
            - label: 基准评测方法语法规范对齐
            - label: 新闻稿渠道分发延迟
            - label: 内部标签分类标准统一
            - label: 常规用户培训文档更新
            - label: 季度平台版本号递增
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR008
      - CR010
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 定性门禁推导链将商业成熟度证据与定价投资决策所需的缺失输入项清晰隔开。
    data:
      nodes:
        - id: N1
          label: 商业覆盖
          detail: 公司披露已在生命科学与医疗健康领域获得广泛采用。
        - id: N2
          label: 经营信号
          detail: 公司披露收入以经常性收入为主，且已实现未调整 EBITDA 盈利。
        - id: N3
          label: 历史估值锚点
          detail: 2022 年 3 月完成 $150M Series C 轮融资，估值 $1.9B。
        - id: N4
          label: 价格发现断层
          detail: 据 Forge 报告，交易活跃度有限，当前无可用价格。
        - id: N5
          label: 投资研判缺口
          detail: 经审计财务数据、股权结构表、债务及清算优先权信息均无法获取。
        - id: N6
          label: 投资决策
          detail: 建议继续研究；暂无支撑入场估值或回报目标的定价依据。
      edges:
        - from: N1
          to: N2
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: 仅为定性决策推导链，不构成对估值、发生概率或回报率的测算。
    claimRefs:
      - CV003
      - CV011
      - CV012
      - CV014
      - CV016
