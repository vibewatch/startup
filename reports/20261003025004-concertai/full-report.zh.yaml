      - number: '5.2'
        title: 运行架构、数据摄取与基础设施依赖
        blocks:
          - type: paragraph
            body: >
              ConcertAI 的底层技术架构依托于跨越异构数据聚合、AI 治理与安全应用交付的多层流水线。数据摄取依托 ConcertAI Data Foundry，对来自 2,000
              多家医疗机构和科研中心的电子病历（EMR）、实验室检验结果、二代测序（NGS）panel 以及 DICOM 影像进行归一化处理。2023 年 12 月，通过收购美国临床肿瘤学会（ASCO）的 CancerLinQ
              项目，公司整合了超过 5.5 million 份多模态肿瘤病历记录，构建起覆盖全美 50 个州基层与学术肿瘤中心的独立数据仓库。为了大规模处理非结构化病理报告及多模态病历，ConcertAI 与 NVIDIA
              展开合作，利用包括 Meta Llama 3 NIM、视觉语言模型（VLM）及 NVIDIA CUDA-X 微服务在内的 NVIDIA
              推理微服务（NIM）。该基础设施为特定肿瘤领域的行业基础模型与自动化临床实体抽取提供算力支撑，在降低企业云端部署 GPU 算力开销的同时，实现了自动化临床试验方案匹配与转化模拟。
