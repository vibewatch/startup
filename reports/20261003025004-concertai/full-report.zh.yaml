              ConcertAI 呈现的是多元产品组合，而非单一标准化的订阅模式：通过 DaaS 提供数据访问，通过 AI SaaS 提供工作流产品，以 SaaS 托管服务形式交付 Commercial
              Solutions，并通过 CancerLinQ 和企业级影像等产品面向医疗机构。管理层披露的最具含金量的收入质量数据是：FY2024 总收入中有 72% 属于年度经常性收入。这只是一项收入结构声明，并非 ARR
              余额，绝不能直接折算为具体的 ARR 金额。公司还表示，其在 FY2024 退出时实现盈利，未经调整的 EBITDA 利润率处于中十几位数区间（mid-teens）
