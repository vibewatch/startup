              ConcertAI 最近一次经充分证实的融资基准是 2022 年 3 月的 Series C 轮：据 SiliconANGLE 报道，该轮融资规模为 $150 million，由 Sixth Street
              领投，估值达 $1.9 billion；随后 ConcertAI 再次确认了该估值，并表示截至 Series C 轮累计融资已超过 $230
