  - id: TV003
    title: 乐观、基准与悲观情景分析框架
    columns:
      - 情景
      - 明确假设
      - 估值或回报逻辑
      - 概率信号
      - 下行风险或验证触发条件
    rows:
      - - 乐观
        - 经审计的增速与留存率验证商业覆盖能力；经常性收入占比进一步扩大；账面利润转化为实际现金。
        - 公开数据无法支撑具体估值区间；仅可在获知经审计数据与净负债后应用可比公司常态化倍数估值。
        - 在取得独立的财务与客户证据之前缺乏事实支撑。
        - 最终确认需依赖最新的经审计指标、稳固的续约表现以及清晰透明的优先股堆叠。
      - - 基准
        - 商业合作关系保持稳定，FY2024 盈利能力得到持续印证，但业务增速有所放缓。
        - 公开数据无法支撑具体估值区间；需将尽调推导出的估值与历史 $1.9B 基准进行对比。
        - 属于合理的经营预期，但公开信息无法测算其估值实现的概率。
        - 若客户留存走弱、利润率下滑或当期定价低于历史基准，需重新评估。
      - - 悲观
        - 客户续约走弱、披露的盈利出现逆转、流动性持续匮乏，或新一轮融资定价低于历史估值。
        - 在缺乏清算优先权和负债数据的情况下无法量化下行风险；普通股的可回收价值可能与企业价值大幅脱节。
        - 鉴于价格发现机制与资本结构均不透明，下行风险实质存在。
        - 若发生未能带来新增价值创造的降估值轮融资，或因结构性高级优先受偿主张损害投资回报，将导致投资逻辑破裂。
    notes: 因保留证据中未公开当前价格、经审计财务预测、净负债、稀释及优先权条款，故不提供具体估值区间或概率数字。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV011
      - CV012
      - CV015
      - CV016
