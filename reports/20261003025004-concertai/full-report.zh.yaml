        - 经审计的分产品经常性收入，以及毛留存和净留存同类群组数据。
      - - 盈利能力
        - 管理层称 ConcertAI 在 FY2024 期末实现盈利，未经调整的 EBITDA 利润率处于中十几位数区间（mid-teens）。
        - 未经调整的 EBITDA 无法证明 GAAP 利润、自由现金流或现金消耗速度。
        - 经审计的 EBITDA 调节表、现金流量表及资本化政策。
      - - 商业覆盖
        - 公司披露称覆盖 50 家生命科学企业、2,000 家医疗或研究机构，并在头部药企中实现广泛渗透。
        - 客户数量与渗透率并未揭示客户集中度、合同金额、续约率或流失率。
        - 客户维度的 ARR 集中度、续约同类群组数据及独立的第三方背景调查访谈。
      - - 估值与流动性
        - 投资方、公司及独立新闻信源多方印证了 $1.9B 的融资基准估值。
        - 该基准形成于 2022 年，而 Forge 显示当前二级交易清淡且无可用成交价格。
