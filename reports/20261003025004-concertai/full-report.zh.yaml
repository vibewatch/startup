              数据库记录截至 2022 年 3 月的数据为 $200 million，但明确说明该字段可能代表收入或 ARR，并可能采用运行率或 LTM
              周期；这并非干净、经审计的收入分母。同样，经常性收入占比无法体现留存率、毛利率、现金转化率或客户集中度。要完成严肃的财务评估，必须要求获取经审计的财务报表、分产品及主要客户收入明细表、队列留存率、实际实现价格、实施与数据成本、CAC/回本周期、现金与负债明细表，以及按月度测算的现金跑道桥梁图。在这些数据补齐之前，收入的可持续性、利润率的规模效应以及资本充裕度依然是尽调障碍，而非可直接带入模型的输入变量。
