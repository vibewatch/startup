  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与临床工作流集成
        blocks:
          - type: paragraph
            body: >
              ConcertAI 提供软件即服务（SaaS）与数据即服务（DaaS）解决方案，旨在为生物制药开发商、医疗机构以及临床研究组织提供全治疗周期的支持。其产品交付的底座是 CARA
              AI，这是一个专为处理复杂临床、放射影像和分子数据集而构建的企业级 AI 平台。与 CARA AI 协同运行的是 Precision
              Suite，该套件整合了肿瘤真实世界数据集，并配备面向转化医学、监管决策与商业化执行的专业分析模块。为了化解生命科学企业的工作流摩擦，ConcertAI 将其技术封装为多款功能应用，包括用于纵向队列治理的
              Patient360、用于商业化患者旅程追踪及依从性优化的 Cadence Suite，以及 Accelerated Clinical Trial 和 Accelerated Patient Actions
              Suites。诊断影像工作流则由旗下企业级放射软件业务 TeraRecon 承接，为计算机断层扫描（CT）与磁共振成像（MRI）提供高级可视化及临床 AI 辅助决策。
