  - id: "TV003"
    title: "Bull, Base, and Bear Scenario Framework"
    columns:
      - "Scenario"
      - "Explicit assumptions"
      - "Valuation or return logic"
      - "Probability signal"
      - "Downside or confirmation trigger"
    rows:
      - - "Bull"
        - "Audited growth and retention validate commercial reach; recurring mix expands; profitability converts to cash."
        - "No public range supportable; apply a normalized peer multiple only after audited inputs and net debt are known."
        - "Unsupported until independent financial and customer evidence is obtained."
        - "Confirmation requires current audited metrics, durable renewals, and a clean preference stack."
      - - "Base"
        - "Commercial relationships persist and FY2024 profitability proves durable, but growth moderates."
        - "No public range supportable; compare a diligence-derived value with the historical $1.9B benchmark."
        - "Plausible operating case, but valuation probability cannot be estimated publicly."
        - "Reassess if retention weakens, margin falls, or current pricing cannot clear the historical benchmark."
      - - "Bear"
        - "Renewals weaken, reported profitability reverses, liquidity remains thin, or new capital prices below the historical mark."
        - "Downside cannot be quantified without preferences and debt; common-equity recovery may diverge from enterprise value."
        - "Material risk because price discovery and capital structure are opaque."
        - "Thesis break on a down-round without offsetting value creation or on structurally senior claims that impair returns."
    notes: "No numeric valuation ranges or probabilities are supplied because current price, audited forecasts, net debt, dilution, and preference terms are not public in the retained evidence."
    claimRefs:
      - "CV001"
