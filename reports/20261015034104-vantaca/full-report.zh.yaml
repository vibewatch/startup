  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 生态与分层
        blocks:
          - type: paragraph
            body: >-
              相关替代方案至少分为四类。直接 CAM 平台包括 Vantaca、ManageCasa 和 CINC Systems；相邻的老牌产品或替代方案包括 Buildium、AppFolio 和
              PayHOA；管理公司内部的碎片化电子邮件、电话、短信和门户工作流仍是现状。资料始终将 Vantaca 放在专业管理公司一侧，而非志愿者董事会或最小型 HOA 一侧。ManageCasa 的对比资料将
              Vantaca 描述为企业产品，采用定制定价、无免费试用且工作流自动化更深；Vantaca 自己的小公司指南也承认，Buildium 和 PayHOA
              仍以低入门价和简单性竞争。这个分层很重要，因为买方选择的不只是软件功能，还包括愿意承担多少流程、培训和未来迁移风险。
            claimRefs:
              - CP001
