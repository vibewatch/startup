      - number: '7.2'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              现有证据支持三个具体担忧。第一，Vantaca 自己将控制失效可能造成的隐私、网络和运营中断视为重大后果，而产品处理业主和财务数据。第二，Axela
              集成双向传输催收数据并自动执行每日提交，因此审批或对账薄弱，可能把运营功能变成合规事件。第三，公开证据集无法排除治理风险：规模、融资和 AI
              野心可见，但董事会构成、投资人权利、优先级结构和工作流控制阈值不可见。因此，本章可以对风险排序，但不能在更深入的法律和融资尽调前将其标为已缓释。
