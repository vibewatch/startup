  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应限定为专业社区协会管理公司的运营软件：会计、支付、合规工作流、工单、业主与董事会沟通，以及组合层面的自动化。Vantaca 自称是专为 HOA
              管理公司打造的一体化平台；两份由竞争对手撰写的对比资料也独立地将其放在该品类的企业端。这些对比适合用于分层，但不是独立的市场基准。自管协会属于相邻但通常排除在外的买方群体，因为它们更偏好复杂度较低、价格透明的工具。通用租赁物业平台、点状解决方案、电子表格、电子邮件、纸质支票和额外人工是相关替代方案。这个边界避免把所有物业管理软件或
              HOA 全部支出都视为 Vantaca 可触达的市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: 受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              保留来源提供的是运营规模观察，而不是传统市场预测。Vantaca 报告拥有超过 550 家管理公司客户，在美国代表超过 6.5 million 个门户；其主页另称在北美拥有超过 5 万个协会和超过 6.5
              million 名业主。两个看似相同的 6.5 million 数字使用了不同分母和地理范围，不能相加或视为可互换。2026 年公司发布材料还称，其代理式基础设施已在 250 家管理公司执行超过 500
              万项任务，说明现有客户中已有一部分采用自动化。这些数字能说明品类触达和产品渗透角度，但不是 TAM、SAM、收入或市场份额。
            claimRefs:
              - CM004
              - CM005
