  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开产品叙事以 CAM 工作流核心为底座，叠加面向居民和供应商的界面，并以智能体 AI 和受限 API 作为扩展与自动化层。
    data:
      layers:
        - label: 居民与董事会
          detail: 面向居民的自助服务和董事会可见性界面
          items:
            - label: Vantaca Home
              detail: 居民支付、请求、透明度和面向社区的体验
        - label: 管理工作流
          detail: 用于后台执行的核心 CAM 操作系统
          items:
            - label: 核心 CAM 平台
              detail: 会计、业主账本、沟通、违规、ARC、工单和催收
        - label: AI 编排
          detail: 起草或执行重复工作的自动化层
          items:
            - label: HOAi / Scout / HOAi Fleet
              detail: 为发票、应收款、预算、起草和后台执行提供智能体支持
        - label: 供应商网络
          detail: 支付和服务提供商协调界面
          items:
            - label: Vantaca Vendor
              detail: 支付工作流、付款核验和供应商自助状态可见性
        - label: API 与集成界面
          detail: 面向供应商、对外公开文档化的扩展层
          items:
            - label: 公共 REST API
              detail: SwaggerHub OpenAPI、读 / 写 / AP 组、客户范围凭证和 IP 允许列表
        - label: 信任与控制层
          detail: 公司声称的安全与韧性控制
          items:
            - label: 安全控制
              detail: SOC 2 Type II 和 SecureSky 监控是公开信任信号，但仍属于公司自述
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE008
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 买方采用似乎始于 CAM 运营商的痛点，经过实施和工作流自动化，再扩展到支付与居民界面，从而加深转换成本。
    data:
      items:
        - label: 评估运营商适配度
          actor: CAM 创始人、COO 和会计负责人
          stage: 买方发现
          touchpoints:
            - 专业 CAM 定位，而非自主管理董事会软件
            - ROI 和对比内容
        - label: 实施核心平台
          actor: 客户赋能团队与运营团队
          stage: 初始部署
          touchpoints:
            - 大约 30 天的启动实施
            - 上线后的优化支持
        - label: 自动化后台
          actor: 应付账款、应收账款和服务团队
          stage: 早期扩张
          touchpoints:
            - HOAi 工作流自动化
            - 在管理公司运营中执行任务
        - label: 延伸高信任要求工作流
          actor: 财务负责人和采购相关方
          stage: 更深层模块采用
          touchpoints:
            - SOC 2 Type II 定位
            - 支付、资金管理和具备欺诈意识的供应商工作流
        - label: 改善居民与董事会体验
          actor: 居民、董事会和社区经理
          stage: 终端用户采用
          touchpoints:
            - 面向居民的功能
            - 更快回答业主的常规问题
        - label: 建立转介绍与转换成本循环
          actor: 管理公司领导层
          stage: 留存与扩张
          touchpoints:
            - 运营规模收益
            - 向 AI、支付和居民体验交叉销售
    approximationNotes: 该旅程反映已披露的采用界面和扩张路径，不代表实测转化率或客户群转变。
    claimRefs:
      - CU003
      - CU011
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按可能性、影响、缓解措施成熟度和剩余严重性为各项主要风险评分后，剩余严重性仍集中在工作流自主性、催收合规、合作伙伴依赖和披露不透明度。
    data:
      columns:
        - label: 可能性
          detail: 根据当前运营设计和已披露的工作流范围推断的定性可能性。
        - label: 影响
          detail: 风险兑现后的业务后果。
        - label: 缓解措施成熟度
          detail: 指定证据池中可见的公开缓解措施强度。
        - label: 剩余严重性
          detail: 扣除可见缓解措施后的净严重性。
      rows:
        - label: 工作流自动化失败
          note: HOAi 被营销为能在财务敏感型工作流中自主执行。
          values:
            - 高
            - 严重
            - 中
            - 高
        - label: 催收 / 合规错误
          note: Axela 集成推送和拉取数据，并且每天可以自动提交逾期案件。
          values:
            - 中
            - 严重
            - 中
            - 高
        - label: 网络安全 / 隐私控制缺口
          note: 可以看到安全投入，但这里没有公开独立测试和事件历史。
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 合作伙伴 / 集成集中度
          note: 银行、支付通道和生态集成嵌入产品承诺。
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 治理与融资不透明度
          note: 公开来源未披露董事会权利、优先股堆叠或工作流控制阈值。
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 实施与服务连续性拖累
          note: 客户案例和入职支持有所帮助，但缺少广泛的正常运行时间和回滚数据。
          values:
            - 中
            - 中高
            - 中
            - 中
    approximationNotes: 定性定位来自引用证据，而非已披露的数值风险模型。
    claimRefs:
      - CR002
      - CR005
      - CR007
      - CR008
      - CR009
      - CR013
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开记录支持继续尽调，但不足以在最近披露的估值上给出新的买入判断。
    data:
      nodes:
        - id: proof
          label: 存在规模证明
          note: 保留的 2025-2026 年来源显示有 500+ 至 550+ 家管理公司，以及 600 万至 6.5 million 个门 / 业主。
        - id: product
          label: 产品深度看起来真实
          note: AI 优先工作流、收入捕获、安全控制和合作伙伴集成表明这是一个实质性平台，而非单薄的功能包装。
        - id: anchor
          label: 价格锚点很高但真实
          note: $300M+ 少数股权轮，估值 $1.25B；最佳公开收入锚点隐含约 14.7 倍收入。
        - id: terms
          label: 条款可见度仍然很弱
          note: 公开融资披露仍未说明董事会权利、清算优先权以及新股与老股的构成。
        - id: gaps
          label: 评估缺口仍在
          note: 公开证据仍缺少经审计 ARR、利润率、留存、现金流和详细优先股堆叠披露。
        - id: call
          label: 建议：持续跟踪
          note: 保持接触，但在转为正面建议前，要求更好的披露或更有利的入场价格。
      edges:
        - from: proof
          to: product
          label: 牵引力支持叙事
        - from: product
          to: anchor
          label: 能力可以支撑高溢价兴趣
        - from: anchor
          to: terms
          label: 标题价格不是交易的全部
        - from: terms
          to: gaps
          label: 价格要求更深的证明
        - from: gaps
          to: call
          label: 证据不足使立场保持谨慎
    approximationNotes: 该流程表达分析顺序，不代表量化的转化概率或概率权重。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV013
      - CV016
