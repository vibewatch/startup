    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              本次刷新所用资料始终将 Vantaca 定位为社区协会管理软件平台，而不是泛化的物业管理工具。2026 年官方材料反复强调其 AI 优先、专为 HOA
              和公寓管理打造，并围绕工作流执行而非静态记录管理。面向客户的工单路由、责任追踪和自动交接描述也强化了这一叙事，使核心产品故事前后一致；但本章证据包仍没有定价和经审计财务披露。
            claimRefs:
