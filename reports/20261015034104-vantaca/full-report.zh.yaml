  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 尽调能够验证自动化说法，2026 年规模信号真实，且治理和优先权条款清晰。
        - 若经审计的经济性显示出高质量 SaaS 特征和持久扩张，2025 年独角兽估值或更高估值可以得到辩护。
        - 叙事跑在已实现 ROI 前面；高端定位比预期更早限制 TAM。
        - 需要管理层数据室的证明，不能只依赖公开营销证据。
      - - 基准
        - 规模真实，但利润率、留存和资本表条款的公开披露仍然稀少。
        - 最合适的评估姿态是相对 2025 年估值小幅折价，或在经济性验证前保持观望。
        - 投资人接手了这一价格，却没有足够的下行保护或 KPI 透明度。
        - 这与当前指定证据池最为一致。
      - - 悲观
        - 增长回归正常，自动化 ROI 不及预期，或隐藏的优先权 / 治理负担削弱下一轮融资。
        - 新资金应预期相对 2025 年参考估值有明显折价，且持有期更长。
        - 下轮估值下降风险、倍数压缩，或客户反对高端定价。
        - 利润率、留存或清算优先股堆叠上的任何负面尽调意外，都可能将案例推向这一情景。
    notes: 情景框架把已观察到的融资估值作为唯一明确的公开价格锚点；这组证据无法支持精确的可比估值区间。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV010
      - CV013
      - CV014
      - CV016
