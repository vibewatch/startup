      - number: '4.4'
        title: 2025 年融资后资本充足性看起来改善，但外部投资判断仍缺现金文件
        blocks:
          - type: paragraph
            body: >-
              公开证据中最清晰的资本事实是 2025 年 10 月少数股权成长轮：Vantaca 宣布获得 $300 million-plus 投资，估值 $1.25 billion，并称收入同比增长
              95%。这足以判断融资风险在当时显著下降，公司也能获得成长资本，但不足以判断当前现金续航、现金效率或下一轮融资时点。审阅过的公开来源没有披露现有现金、烧钱、债务义务、契约或董事会批准的运营计划。因此，财务结论在需求和平台广度上偏正面，但核心
              SaaS 质量指标和融资后流动性细节仍是阻碍。
