            body: >-
              核心投资判断风险不是 Vantaca
              有没有产品势头；资料支持其拥有有意义的规模、广泛的工作流覆盖和日益代理化的运营模式。风险在于，这种自动化触及会计、应收款、催收和业主沟通，因此一个错误可能同时造成合规、现金、客户和声誉损害。公开披露也不对称：公司控制的客户成果和
              ROI 证据很多，但董事会权利、控制阈值、补救历史和下行情景少得多。即使 SOC 2 Type II 和 SecureSky 等表面缓释措施已经存在，这种不对称仍使剩余严重性偏高。
