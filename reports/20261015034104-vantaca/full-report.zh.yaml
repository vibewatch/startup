        blocks:
          - type: paragraph
            body: >-
              公开证据始终将 Vantaca 描述为专为社区协会管理公司打造的运营系统，而不是轻量级居民门户。官方站点和公司材料称，一套界面覆盖协会会计、支付、业主台账、沟通，以及违规、ARC
              请求、工单和催收等行动事项工作流。第三方 API 资料列出了相同运营模块；竞争对手撰写的评价则将 HOAi、Scout、仪表盘、自动化和面向居民的工具都列为同一系统的一部分。这很重要，因为 CAM
