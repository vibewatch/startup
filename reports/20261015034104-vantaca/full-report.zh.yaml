      - number: '3.2'
        title: 能力、定价与信任权衡
        blocks:
          - type: paragraph
            body: >-
              资料池中的公开证据表明，当买方更看重运营深度而不是采购便利时，Vantaca 更有胜算。公司发布的 2025—2026 年材料强调代理式 AI
              可处理应付账款、应收账款、预算、上线、居民互动、供应商工作流和基准分析；JMI 的 2023
              年投资说明则将产品描述为更广泛的运营平台，涵盖合作银行、居民和董事会功能。安全方面的信任叙事与这种广度相配：Vantaca 称 SOC 2 Type II 和 SecureSky
              监测是其安全态势的核心。代价是公开记录中的定价仍不透明。ManageCasa 宣传每月 $45 起并主打即时可用，而 Vantaca
              自己的对比资料仍将其描述为计划增长的公司需要更高投入的系统。换句话说，Vantaca 公开最强的差异化在于深度、自动化和生态范围，但采购摩擦依然真实。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP002
