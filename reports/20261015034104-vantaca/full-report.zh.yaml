      - number: '3.3'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              现有证据暗示的护城河是运营集中化，而不是明显不可击败的价格或中立基准领先。一旦 Vantaca
              进入工单路由、董事会审批、居民门户、银行关联流程和合作伙伴工作流，切换很可能需要重新培训员工，并迁移远不止总账的数据。这会让点状方案更难替代，但并未消除核心风险。竞争对手仍可在入门价和上线负担上压价；一份存档的
              G2 评价也显示，即使满意用户仍可能感到培训摩擦很大。更深层风险是证据质量：资料池中许多最强的比较性说法来自供应商、客户或合作伙伴，而非独立输赢研究。因此，尽管当前公开定位明显偏向 Vantaca 在规模化
              CAM 运营中的优势，商品化和老牌企业反击仍未完全解决。
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 差异化来自广度与自动化
            body: 最有力的支持性优势不是低成本，而是 Vantaca 试图通过代理式工作流、供应商工具、居民端界面和信任控制，掌握更多运营系统。
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP013
          - type: callout
            title: 更便宜的替代方案仍决定市场底价
            body: 同一资料池显示，只要买方更看重透明的入门价、更简单的上线或租赁覆盖，而不是企业级流程深度，Buildium、PayHOA 和 ManageCasa 仍是可信替代方案。
            calloutType: risk
