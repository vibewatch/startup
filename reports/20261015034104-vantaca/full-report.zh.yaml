            body: >-
              不应放弃的原因在于，Vantaca 确实显示出真实运营证据。到 2025 年末，融资材料和第三方分析已描述平台拥有超过 500 家管理公司和 600 万户家庭；到 2026 年，Vantaca
              及合作伙伴材料又称拥有 550 多家管理公司和超过 6.5 million 个门户或业主。产品故事也比泛化的物业科技推介更扎实：资料始终将其描述为覆盖会计、工作流、沟通、支付、分析和收入捕获的 AI
              优先运营系统，并有当前合作伙伴集成和客户层面的连续性与工作流改善案例。如果尽调能在供应商撰写的案例之外验证留存、利润率持久性和真实自动化成果，这一组合支持 Vantaca 相比更简单的 HOA
              工具获得估值溢价的投资逻辑。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: 反投资论点、下行与尽调要求
        blocks:
          - type: paragraph
            body: >-
              反投资论点不在于 Vantaca 是否实现了产品市场匹配，而在于外部投资人能否足够精确地判断价格。Vantaca
              自己的对比内容称，该平台投入更高，并不适合最低成本或自管买方，这进一步说明公司卖的是高端工作流系统，而不是广泛的低价产品。高端定位可以成立，但前提是经济性和叙事一样强。当前资料池仍留下核心尽调事项：经审计收入质量、毛利率、净留存、现金消耗、董事会权利、清算优先权，以及原有股东出售与新增发行的融资构成。安全准备度和生态集成是正面因素，但不能填补这些投资判断缺口。因此需要明确下行触发点：一旦出现自动化
              ROI 弱于所称、利润率压缩或不利优先权负担的证据，下一轮融资讨论就可能低于 2025 年参考价。
            claimRefs:
              - CV008
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 当前判断：继续跟踪，不买入
            body: 现有证据足以保持尽调，因为公司看起来拥有真实规模、真实融资锚点和差异化工作流故事。但在缺少经审计经济数据、更清晰的资本表条款和更明确的市场可比框架时，证据不足以支持按 2025 年独角兽估值新建仓位。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV014
              - CV016
