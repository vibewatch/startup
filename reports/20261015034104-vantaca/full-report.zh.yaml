      - number: '4.3'
        title: 利润率故事更多取决于自动化与上线执行，而非已披露的软件利润率
        blocks:
          - type: paragraph
            body: >-
              公开证据中的利润率逻辑主要是运营逻辑，而非会计逻辑。官方 ROI 内容称，在社区协会管理中，人工而非软件许可费是主要支出，并将 HOAi 定位为消除发票、应收款和服务工作量的杠杆。这与面向客户的案例研究以及
              Vantaca
              将支付、供应商工作流和数据迁移嵌入更广泛运营系统的做法一致。抵消因素是，独立评价描述了繁重的设置工作、真实的学习曲线和阶段性的产品可靠性投诉。换句话说，公开上行案例是更好的服务交付杠杆和减少人工，但回本周期仍取决于实施质量以及客户接受变化的意愿。
