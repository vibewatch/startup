      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是专业 CAM 公司的所有者或管理层；会计和运营负责人评估工作流深度，而社区经理、会计人员、董事会、业主和供应商使用系统的不同部分。Vantaca 自己的小公司指南称，平台可支持管理 1 个到超过
              300 个协会，并提供完整总账会计、自动化和多协会架构。同一来源描述了约 30 天的启动实施，之后还有 5
              个月的上线后优化，说明采用它是流程变革，而不是轻量级软件注册。对自管董事会而言，企业级上线、未公开定价和面向专业管理者的工作流深度更多是阻碍，而非优势。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用的核心驱动是人工杠杆。Vantaca 声称软件只占 CAM 公司成本结构的 2% 至 5%，人工约占 80%；它还报告有客户将每月发票编码时间从 40 小时降至约 10
              小时。这些数字由公司发布，需要客户侧验证，但展示了买方需要纳入投资判断的 ROI
              机制。约束同样重要：实施工作量、迁移风险、模糊的报价制定价、对可靠财务自动化的依赖，以及业主和支付数据更高的安全与隐私要求。Vantaca 报告覆盖 SOC 2 Type II 并由 SecureSky
              监测，但保留证据不含审计报告本身。因此，只有在获得留存、定价、实施成本和独立验证的节省人工数据后，估值才应奖励已证明的工作流采用。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 运营足迹不是市场规模
            body: 公司报告的客户、协会、业主、门户和自动化任务使用不同单位和边界。它们能说明部署规模，但若没有外部总体规模和定价证据，就不能换算为 TAM、SAM、SOM、收入或市场份额。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: callout
            title: ROI 证据仍由发行方掌握
            body: 本次资料池中最有力的节省人工和实施指标由 Vantaca 发布。在这些说法能够支撑估值溢价之前，还需要客户合同、客户组留存、实际节省和实施发票。
            calloutType: risk
