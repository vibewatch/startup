        title: 公开增长代理指标足以验证需求，但分母混杂
        blocks:
          - type: paragraph
            body: >-
              公开记录对规模的指向很明确。公司和合作伙伴发布材料称 Vantaca 拥有超过 500 家管理公司客户以及超过 600 万户家庭或门户；GetLatka 则报告 2025 年 12 月年收入 $85
              million、 客户 500 家。这些披露使用的分母不一致，不应强行合成单一 KPI，但合在一起指向有意义的商业牵引力，而非早期项目。案例材料也呈现了效率证据：Vantaca 称 HOAi
              按门户定价，提高了人均管理协会数，并帮助 EJF 大幅缩短发票处理时间，足以让单个部门节省人工成本。这对销售效率代理指标有参考价值，但仍是供应商筛选后的证据。
