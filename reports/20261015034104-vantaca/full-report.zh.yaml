  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - Vantaca
      - ManageCasa / 低阻力替代方案
      - 含义
    rows:
      - - 工作流自动化
        - HOAi / Fleet 被定位为覆盖 AP、AR、预算、上线和违规处理的自主工作流执行
        - ManageCasa 在所有套餐中推广 AI；Buildium / PayHOA 仍是低自动化替代方案；Vantaca 称 CINC 的 AI 仍需人工确认
        - 当去除人力比简单记账更重要时，Vantaca 的优势最明显
      - - 定价透明度
        - 定制报价；未公开定价
        - ManageCasa 起价 $45/月；Buildium 起价 $62/月；PayHOA 被定位为实惠
        - 买方还没法测算 TCO，Vantaca 就先增加了采购阻力
      - - 组合范围
        - 聚焦社区协会，同时覆盖居民、供应商和董事会工作流
        - ManageCasa 支持 HOA 加租赁；AppFolio 被描述为以租赁为先，但居民端功能丰富
        - Vantaca 用横向广度换取 CAM 深度
      - - 上线 / 培训
        - 深度配置和历史用户材料都显示培训负担较重
        - ManageCasa 明确主打快速上线、易于评估；其他替代方案也被定位为更简单
