evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: >-
      Priced funding round history, current valuation, total capital raised, investor syndicate, and any debt or credit
      facilities.
    whyItMatters: These are baseline inputs for stage assessment, dilution risk, and valuation realism.
    diligencePath: Request the latest board deck, financing history, and cap-table summary from management or lead investors.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: A single authoritative founding date plus a reconciled founder roster.
    whyItMatters: >-
      The current refresh pool conflicts on both the year and the named founder, which weakens later governance and
      narrative reuse.
    diligencePath: >-
      Request incorporation records, the canonical company history, and investor materials that identify the founding
      team.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, investor observer rights, and any formal governance committee structure.
    whyItMatters: Leadership names alone do not establish control rights, oversight quality, or sponsor influence.
    diligencePath: Request the current board list, board deck cover pages, and any shareholder-rights summary.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: material
    topic: metric-reconciliation
    missingEvidence: Date-stamped KPI definitions reconciling customers, management companies, homeowners, doors, and headcount.
    whyItMatters: >-
      The current source set points in the same positive direction on scale but does not provide a single comparable
      denominator.
    diligencePath: Request an internal KPI glossary and a dated operating-metrics sheet used for board reporting.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: minor
    topic: headquarters
    missingEvidence: A current primary record explicitly identifying Vantaca's legal or principal headquarters.
    whyItMatters: Headquarters affects jurisdictional diligence and the accuracy of the reusable company identity.
    diligencePath: Request a current formation filing, annual report, lease, or management-certified legal entity profile.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gaps
    missingEvidence: >-
      An independent, methodology-disclosed count of professional CAM companies, managed associations or doors, and
      annual software spend for a defined geography and year.
    whyItMatters: >-
      Without an external universe and spend basis, company footprint cannot be converted into TAM, SAM, SOM,
      penetration, or market share.
    diligencePath: >-
      Obtain current CAI or government industry counts, a methodology-disclosed market study, and triangulate them
      against buyer interviews and contract-level annual spend.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current Vantaca price cards, representative contracts, implementation fees, payment economics, discounts, renewal
      escalators, and pass-through treatment.
    whyItMatters: >-
      Quote-based pricing prevents a reliable budget-owner analysis, bottom-up SAM, or assessment of whether reported
      labor savings translate into customer ROI and Vantaca revenue.
    diligencePath: >-
      Review anonymized contracts across portfolio-size cohorts and interview customers about total first-year and
      renewal cost.
    relatedQuestionRefs:
      - QM004
      - QM008
  - type: conflicting-data
    severity: material
    topic: sizing-denominators
    missingEvidence: >-
      A dated metric dictionary reconciling homeowners, doors, associations, management companies, geographies, and
      duplicate entities across Vantaca's public scale claims.
    whyItMatters: >-
      The same 6.5 million magnitude is reported with two different denominators, creating a risk of overstating reach
      if the measures are combined.
    diligencePath: >-
      Request the underlying customer and association census with metric definitions, reporting date, geographic
      coverage, and deduplication method.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-validation
    missingEvidence: >-
      Customer-controlled time studies, implementation invoices, retention cohorts, realized headcount changes, and
      control-exception rates for automated financial workflows.
    whyItMatters: >-
      Issuer-published case studies and ROI claims do not establish representative savings, durability, implementation
      burden, or financial-control quality.
    diligencePath: >-
      Sample customers by size and tenure, reconcile before-and-after staffing and workflow data, and test reported
      outcomes against contracts and general-ledger controls.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Realized Vantaca contract prices, implementation fees, discounts, and multi-year TCO versus CINC, Buildium,
      AppFolio, and PayHOA.
    whyItMatters: >-
      Competitive positioning on price is still mostly directional because the assigned pool lacks neutral quote or
      contract evidence.
    diligencePath: Request recent proposals, redlined order forms, and replacement-deal pricing from buyers or channel partners.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: Independent migration, churn, multi-homing, or win-loss data across HOA software vendors.
    whyItMatters: >-
      Lock-in is inferred from workflow centralization and ecosystem breadth, but the public pool does not show whether
      buyers actually stay or switch.
    diligencePath: Collect customer reference calls, implementation cohort data, and third-party replacement case studies.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: missing-source
    severity: material
    topic: trust-posture
    missingEvidence: Independent cross-vendor security audits, incident history, or regulator-grade comparisons for Vantaca and peers.
    whyItMatters: >-
      Trust is a real buying criterion in resident-financial workflows, but the pool only documents Vantaca's own
      posture rather than a normalized market comparison.
    diligencePath: >-
      Request external audit summaries, security questionnaires, and documented incident disclosures from Vantaca and
      named competitors.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, debt schedule, covenants, and management runway view after the 2025 minority
      round.
    whyItMatters: >-
      These figures determine whether Vantaca can self-fund growth or needs another financing on an externally set
      timeline.
    diligencePath: >-
      Request monthly management accounts, debt agreements, and the board-approved operating plan used for 2026-2027
      planning.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: ARR bridge, NRR, churn, gross margin by product line, CAC payback, and cohort retention.
    whyItMatters: Revenue quality and durability cannot be underwritten from scale claims or point-in-time revenue figures alone.
    diligencePath: Request the current board metrics pack, cohort model, and audited or board-approved SaaS KPI definitions.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: payments-economics
    missingEvidence: >-
      Payment-processing spreads, reserve requirements, chargeback exposure, and bank-partner contract terms for Vantaca
      Pay.
    whyItMatters: >-
      Payments can improve stickiness and margin, but they can also add operational and credit risk that is invisible in
      top-line software metrics.
    diligencePath: >-
      Request processor agreements, reserve policy, loss history, and product-level gross-margin reporting for payments
      versus software.
  - type: private-evidence-only
    severity: material
    topic: reliability-and-ai-governance
    missingEvidence: >-
      Independent uptime history, formal SLA language, module-level adoption metrics, AI exception and override rates,
      and externally verifiable security-audit detail.
    whyItMatters: >-
      Those data determine whether Vantaca's broad workflow scope and agentic-AI story translate into durable product
      advantage or create operational and trust risk during onboarding and scale-up.
    diligencePath: >-
      Request the SOC 2 report under NDA, incident and uptime history, implementation playbooks, API adoption
      statistics, AI control documentation, and customer-level module usage cohorts.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public GRR, NRR, logo churn, renewal rates, contract-length mix, and cohort retention by customer segment.
    whyItMatters: >-
      Deployment case studies do not show whether value persists across the installed base or whether customer
      relationships are durable.
    diligencePath: >-
      Request cohort retention, renewal, and churn data by customer-size band from management, plus any board-facing NPS
      or support-SLA reporting.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer concentration, revenue exposure by cohort, and attach rates for AI, payments, treasury, and resident
      modules.
    whyItMatters: >-
      Expansion logic is central to the thesis, but public sources do not show how much revenue comes from a small
      number of accounts or modules.
    diligencePath: Ask for top-10 customer concentration, module attach-rate tables, and direct-versus-partner channel mix.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: A broader, independently verifiable set of named customers beyond Vantaca-selected references.
    whyItMatters: >-
      The named-customer table proves production use, but the public roster is too curated to establish breadth of
      referenceability or renewal quality.
    diligencePath: >-
      Collect independent customer references, procurement records, conference talks by named users, or marketplace
      reviews tied to identifiable operators.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: governance-opacity
    missingEvidence: >-
      Board roster, investor rights, liquidation preferences, and primary-versus-secondary split for the 2025 financing
      round.
    whyItMatters: >-
      Governance and preference overhang determine downside protection, control rights, and whether the latest valuation
      is actually underwritable.
    diligencePath: Request financing documents, board materials, and an updated cap table from management and lead investors.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: payments-and-collections-compliance
    missingEvidence: >-
      Bank-partner contracts, reserve or loss practices, exception logs, and complaint history for payments and
      collections workflows.
    whyItMatters: >-
      Automated AP, AR, and collections can create financial, consumer-harm, and regulatory exposure if approvals,
      reversals, or remediation paths are weak.
    diligencePath: >-
      Review payments architecture, partner contracts, complaint logs, exception handling, and any remediation playbooks
      with operations and compliance leaders.
    relatedQuestionRefs:
      - QR004
      - QR005
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: legal-and-regulatory-checks
    missingEvidence: >-
      Regulator, court, and complaint-system checks for litigation, enforcement, sanctions, or privacy complaints
