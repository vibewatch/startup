artifact: financials
slug: vantaca
runDate: 2026-10-15
company:
  name: Vantaca
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a real enterprise-software revenue base, a large 2025 financing event,
    and credible labor-savings narratives around Vantaca's AI and workflow stack. It does not,
    however, disclose the core underwriting inputs that matter most for a late-stage vertical SaaS
    investment: realized pricing, gross margin, retention, CAC payback, or post-raise cash runway.
sections:
  - id: revenue-model-pricing
    title: Revenue model is visible, but monetization is still quote-led and partially opaque
    body: >-
      Public materials make the commercial structure legible without making it fully modelable.
      Independent review coverage says Vantaca does not publish public rate cards, plan tiers, or
      per-unit pricing, and instead routes buyers into a custom-quote process that should break out
      setup, subscription, processing, and contract terms. That fits the product positioning:
      official and partner material consistently frame Vantaca as a management-company operating
      system with adjacent monetization surfaces in implementation, payments, and AI automation,
      rather than as a self-serve SMB tool. The revenue bridge is therefore understandable at a
      category level, but realized pricing, discounting, attach rates, and payment take rates are
      still not public enough to underwrite gross revenue quality from outside the data room.
    claimRefs: [CI001, CI002, CI004, CI010, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-efficiency
    title: Public traction proxies are strong enough to validate demand, but they mix denominators
    body: >-
      The public record is directionally strong on scale. Company- and partner-issued material
      place Vantaca above 500 management-company customers and above six million managed households
      or doors, while GetLatka reports $85 million of annual revenue in December 2025 and 500
      customers. Those disclosures are not identical denominators, so they should not be forced
      into a single KPI, but together they point to meaningful commercial traction rather than an
      early-stage story. Efficiency proof is also visible in case material: Vantaca says HOAi is
      priced per door, expands associations-per-employee, and helped EJF cut invoice processing
      time sharply enough to save labor dollars in a single department. That is useful evidence for
      sales efficiency proxies, even if it remains vendor-selected.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI011]
    tableRefs: [TI003]
  - id: cost-structure-and-margin-path
    title: Margin story depends on automation and onboarding execution more than disclosed software margins
    body: >-
      The margin thesis in public evidence is mostly operational rather than accounting-based.
      Official ROI content argues that labor, not software license cost, is the dominant expense
      in community-association management, and positions HOAi as the lever that removes invoice,
      receivables, and service workload. That is consistent with customer-facing case studies and
      with Vantaca's effort to embed payments, vendor workflows, and data migration into a broader
      operating stack. The offset is that independent reviews describe heavy setup work, a real
      learning curve, and periodic product-reliability complaints. In other words, the public
      upside case is better service-delivery leverage and labor removal, but the payback period is
      still sensitive to implementation quality and customer willingness to absorb change.
    claimRefs: [CI007, CI008, CI009, CI010, CI012, CI013, CI016]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy looks improved after the 2025 raise, but external underwriting still lacks the cash file
    body: >-
      The clearest capital fact in public evidence is the October 2025 minority growth round:
      Vantaca announced a $300 million-plus investment at a $1.25 billion valuation after a stated
      95% revenue increase over the prior year. That is enough to conclude that financing risk was
      materially reduced at the time of the round and that the company had access to growth capital.
      It is not enough to conclude current runway, cash efficiency, or next-round timing. None of
      the reviewed public sources discloses current cash on hand, burn, debt obligations, covenants,
      or a board-approved operating plan. The financial verdict is therefore positive on demand and
      platform breadth, but still blocked on core SaaS quality metrics and post-raise liquidity
      detail.
    claimRefs: [CI003, CI004, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - ["Core platform subscription", "Portfolio software contract for management companies", "Custom portfolio quote", "Publicly quote-led; no rate card or per-unit schedule published", "Medium", "Itemized subscription schedule by doors/associations and module"]
      - ["Implementation and migration", "Onboarding, data migration, workflow setup, post-go-live enablement", "Project / one-time fee", "Operationally explicit in case material, but no public fee schedule", "Medium", "Signed SOW with migration fees, services margin, and implementation staffing assumptions"]
      - ["Payments / Vantaca Pay", "ACH, card, and e-check transaction layer inside the operating stack", "Transaction fees / reserve economics", "Commercially important surface, but public take rates and reserve practices are undisclosed", "Low", "Processor pricing, chargeback policy, reserve requirements, and bank-partner economics"]
      - ["HOAi automation", "AI workflow automation across AP, AR, service, and budgeting", "Per door per month", "$0.54 per door/month is publicly claimed for HOAi, but attach rate and realized pricing are unknown", "Low", "Module attach by cohort, gross margin by AI workload, and renewal data"]
    notes: >-
      Public sources identify revenue surfaces, but only HOAi has a numeric public price signal; all
      other stream economics remain quote-led or undisclosed.
    claimRefs: [CI001, CI002, CI007, CI010, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Vantaca core platform", "Custom quote; portfolio-scoped contract", "No public list price; realized pricing unknown", "Unknown minimums, discounts, and multi-product bundle terms", "Independent review coverage"]
      - ["Implementation and data migration", "One-time services line item", "No public list price; realized pricing unknown", "Unknown setup fee, migration burden, and support scope by customer size", "Official customer-implementation material"]
      - ["Vantaca Pay", "Custom transaction economics", "No public rate card", "Unknown ACH/card spreads, reserve treatment, and contract carve-outs", "Independent comparison + official customer case"]
      - ["HOAi", "$0.54 per door/month (vendor-claimed)", "Only public numeric price signal observed", "Unknown discounts, rollout gating, and workload-based margin", "Official ROI material"]
    notes: >-
      This table separates the lone public numeric module price from broader quote-only pricing so
      readers do not confuse vendor list signals with realized contract economics.
    claimRefs: [CI001, CI002, CI007, CI010, CI012, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Annual revenue", "$85M (Dec 2025, third-party profile citing CEO confirmation)", "Medium", "Anchors scale and revenue-base plausibility", "Confirm audited 2025 revenue, recurring/non-recurring split, and 2026 run rate"]
      - ["Customer / scale base", "500 customers (Latka); 500+ to 550+ management companies and 6.0M to 6.5M households/doors in issuer materials", "Medium", "Shows large installed base but mixed denominators", "Provide customer-count bridge by paying logos, associations, doors, and households"]
      - ["HOAi public price", "$0.54 per door/month", "Low", "Only public module price signal and key input to automation ROI", "Share contract examples, attach rate, and margin by AI module"]
      - ["Public labor-savings proxy", "90% invoice-processing reduction and $10k/month savings at EJF", "Medium", "Supports payback narrative for workflow automation", "Provide cohort-level realized savings, adoption curve, and churn/renewal correlation"]
      - ["ARR / NRR / churn", null, "Low", "Critical to revenue quality and durability", "Board metrics pack with ARR bridge, net retention, gross revenue retention, and logo churn"]
      - ["Gross margin / cash burn / runway", null, "Low", "Required to underwrite capital intensity and financing dependency", "Monthly management accounts with GM by product line, opex, cash balance, burn, and debt schedule"]
    notes: >-
      Null means the reviewed public record did not provide a trustworthy value; mixed denominators
      are preserved rather than normalized into a false precision metric.
    claimRefs: [CI004, CI005, CI006, CI007, CI009, CI014, CI015]
figures:
  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: >-
      Public evidence implies a portfolio-priced software stack that adds implementation, payments,
      and AI automation on top of the core operating-system contract, but only part of that bridge is
      numerically disclosed.
    data:
      nodes:
        - id: contract
          label: Management-company contract
          detail: Buyers are routed into custom quotes rather than a public price card.
        - id: platform
          label: Core software subscription
          detail: Recurring revenue appears scoped by management-company portfolio size and workflow complexity.
        - id: onboarding
          label: Implementation + migration
          detail: Public case material describes ~30-day startup deployments plus months of optimization support.
        - id: payments
          label: Vantaca Pay
          detail: Payments are embedded in the platform, but public take rates and reserve practices are not disclosed.
        - id: automation
          label: HOAi module
          detail: Vendor claims $0.54 per door/month and labor-saving outcomes across AP, AR, and service workflows.
        - id: payback
          label: Gross-profit / payback outcome
          detail: Public upside is labor removal and customer scale, while the unknowns are realized pricing and post-raise cash efficiency.
      edges:
        - from: contract
          to: platform
          label: quote becomes recurring license
        - from: platform
          to: onboarding
          label: deployment activates workflows
        - from: platform
          to: payments
          label: payments sit inside operations
        - from: platform
          to: automation
          label: installed base becomes AI attach surface
        - from: onboarding
          to: payback
          label: services load affects time to ROI
        - from: payments
          to: payback
          label: undisclosed processing economics
        - from: automation
          to: payback
          label: labor savings drive the public ROI story
    claimRefs: [CI008, CI010, CI011, CI016]
callouts:
  - calloutType: insight
    title: Public evidence supports scale, not software-quality precision
    body: >-
      The market will find enough evidence to believe Vantaca is large and commercially relevant;
      it will not find enough to underwrite revenue quality or margin durability without private data.
    claimRefs: [CI004, CI005, CI014, CI015]
  - calloutType: risk
    title: Payback risk sits in implementation friction and undisclosed payments economics
    body: >-
      The strongest adverse signal is not lack of demand but the combination of heavy setup work,
      annual-contract friction, and missing disclosure on realized payment-processing economics.
    claimRefs: [CI012, CI013, CI016]
