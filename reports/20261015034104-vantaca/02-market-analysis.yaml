      - ["Established multi-association CAM company", "CEO, COO, or CFO", "Operations, finance, community managers", "Management company and managed associations", "Increase associations per employee", "Migration risk and workflow redesign"]
      - ["Large portfolio operator", "Executive and finance leadership", "Central operations, accountants, managers", "Management company and client associations", "Automate AP, AR, financial production, and service", "Control assurance, exception handling, data governance"]
