schemaVersion: report-v2
artifact: company-overview
slug: vantaca
runDate: 2026-10-15
company:
  name: Vantaca
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Vantaca presents as a purpose-built, AI-forward vertical SaaS vendor for
    community association management with unusually concrete 2026 product
    launches and security messaging, but the public refresh pool remains thin on
    financing, governance, and even basic founding history. The strongest
    support is around operating model, product breadth, and customer-facing
    scale claims; the weakest support is around valuation, total capital raised,
    and reconciled core KPIs.
sections:
  - id: identity-and-positioning
    title: Identity and positioning
    body: >-
      The assigned refresh pool consistently presents Vantaca as a
      community-association-management software platform rather than a generic
      property-management tool. Official 2026 materials repeatedly frame the
      business as AI-first, purpose-built for HOA and condo management, and
      organized around workflow execution rather than static recordkeeping. That
      narrative is reinforced by customer-facing descriptions of ticket routing,
      accountability, and automated handoffs, which make the core product story
      coherent even though pricing and audited financial disclosure remain
      absent from this chapter's evidence pack.
    claimRefs:
      - CO001
      - CO002
      - CO016
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      Public leadership visibility is serviceable but incomplete. June 2026
      launch materials clearly name Ben Currin as CEO and Trisha Price as Chief
      Product Officer, while Vantaca's own comparison guide credits Dave Sweyer
      and his team with founding the company in 2016. That conflicts with the
      Latka profile, which says Ben Currin founded Vantaca in 2015. The result
      is a workable operating-leadership picture but not a clean governance
      record: the assigned pool does not surface a current board roster,
      investor rights, or a reliable single-source founding timeline.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO014
      - CO015
    tableRefs:
      - TO002
  - id: scale-security-and-milestones
    title: Scale, security, and recent milestones
    body: >-
      The strongest dated evidence in this pool comes from 2026 operating and
      product milestones. Official and syndicated-company materials put Vantaca
      above 550 management companies and separately above 6.5 million homeowners
      or doors, so the denominator is not perfectly reconciled. The same pool
      supports a February
      2026 security posture anchored on SOC 2 Type II and SecureSky, plus a
      June 2026 launch cycle that introduced HOAi Fleet, Vantaca Vendor, and an
      expanded Vantaca Home experience. Latka adds a useful but low-confidence
      revenue and headcount datapoint, while Vantaca's July 2026 startup guide
      gives explicit implementation and small-company fit framing.
    claimRefs:
      - CO003
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO016
    tableRefs:
      - TO003
    figureRefs:
      - FO001
  - id: diligence-gaps
    title: What remains unverified in the refresh
    body: >-
      The biggest weakness in the current refresh pool is capital-structure and
      governance visibility. None of the retained sources substantiate a priced
      funding round, a valuation mark, or total capital raised, and the board
      picture is still opaque. Even the basic scale narrative needs cleanup:
      official sources cite management companies plus homeowners or doors, while
      Latka cites customers and employees using different dates and definitions.
      This means later chapters can reuse the product and milestone baseline
      here, but they should not infer financing quality, investor support, or
      tightly reconciled operating metrics from this overview alone.
    claimRefs:
      - CO003
      - CO010
      - CO011
      - CO012
      - CO015
      - CO016
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date
      - Confidence
      - Gap
    rows:
      - [Headquarters, null, "2026-10-15", low, "Not established in the assigned fetched text."]
      - [Product identity, "AI-first CAM platform; workflow-centric system of action", "2026 refresh sources", medium, null]
      - [Customer reach, ">550 management companies; >6.5 million homeowners/doors (unit varies by source)", "2026 official materials", medium, "Homeowners and doors are not identical denominators."]
      - [Revenue, "$85M annual revenue", "Dec 2025", low, "Single third-party profile; no audited public financials in pool."]
      - [Headcount, "186 employees", "Dec 2024", low, "Third-party profile only."]
      - [Customer count, "500 customers", "Undated profile view updated 2026-10-13", low, "Definition differs from management-company and homeowner counts."]
      - [Funding / valuation, null, "2026 refresh", low, "Assigned pool does not substantiate priced round, total raised, or valuation."]
      - [Board / governance, null, "2026 refresh", low, "No retained source provides a current board roster or governance terms."]
    notes: >-
      Null means the assigned refresh pool does not support a reader-safe value;
      scale rows preserve original source denominators instead of forcing them
      into a single reconciled KPI.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO010
      - CO011
      - CO012
      - CO015
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Evidence-backed background
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Dave Sweyer", Founder (official founding story), "Vantaca's 2026 comparison guide says Sweyer and his team created the company after finding incumbent CAM systems insufficient for growth.", "Strong original market pain signal, but not corroborated by third-party governance materials in this pool.", "Founding narrative is material because it conflicts with a different founder/year claim."]
      - ["Ben Currin", "CEO; also listed as founder by Latka", "June 2026 launch materials quote Currin as CEO, while Latka says he founded Vantaca in 2015.", "Central operator and public spokesperson across launch, revenue, and scale claims.", "High dependency because multiple core metrics and strategy claims route through Currin-linked sources."]
      - ["Trisha Price", "Chief Product Officer", "Named in the June 2026 launch materials as the executive framing the resident-experience roadmap.", "Provides product-leadership coverage around Vantaca Home and roadmap messaging.", "Moderate dependency because public product strategy is concentrated in a small named bench."]
    notes: >-
      Coverage is partial and limited to named leaders that appear in the
      retained refresh pool; no current board roster, investor observer list, or
      independent governance profile is available here.
    enumerationScope:
      coverage: partial
      basis: >-
        Named people appearing in retained 2026 official, partner, and
        third-party profile sources for the refresh.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO014
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Evidence-backed signal
      - Diligence ask
    rows:
      - ["Management companies", Buyer and operating customer, "They are the direct software buyers and operating counterparties across Vantaca's platform, payments, and managed-services workflow.", "Official 2026 materials repeatedly measure scale in management-company counts.", "Request cohort retention, concentration, and ACV by management-company segment."]
      - [Homeowners / residents, End users, "Resident experience is central to Vantaca Home and part of the company's scale narrative.", "Official sources cite either homeowners or doors as the downstream population.", "Request a reconciled definition for homeowners, doors, and active resident accounts."]
      - [Boards, Governance audience, "Boards are the governing bodies whose reporting, approvals, and communication flows shape platform value.", "Official guides repeatedly reference board governance and board-facing reporting.", "Request evidence of board engagement, SLA outcomes, and board-specific modules."]
      - [Vendors / service providers, Payments and workflow counterparty, "Vantaca Vendor is meant to reduce payment friction and fraud risk with third-party service providers.", "June 2026 launch materials make vendor payments a named frontier.", "Request GPV, take-rate, fraud-loss, and vendor-adoption disclosure."]
      - [SecureSky, Security partner, "SecureSky underpins part of the public security and monitoring narrative.", "The February 2026 security post names SecureSky as a strategic partner.", "Request the scope, term, and exclusivity of the security partnership."]
      - ["Grasshopper Bank, N.A.", Banking partner, "Grasshopper is the named banking-services provider in the June 2026 release disclosures.", "The PR disclosure explicitly says Vantaca is not a bank and points to Grasshopper Bank, N.A.", "Request bank-partner economics, operational dependencies, and remediation obligations."]
    notes: >-
      This is a stakeholder map, not a capital table: the assigned pool does
      not disclose equity investors, board rights, or primary-versus-secondary
      ownership details for the current refresh.
    enumerationScope:
      coverage: partial
      basis: >-
        Stakeholders and counterparties explicitly named or directly implied in
        the retained company, partner, customer, and syndicated company sources.
    claimRefs:
      - CO003
      - CO007
      - CO008
      - CO009
      - CO013
