callouts:
  - calloutType: strength
    title: Product and operating-model narrative is concrete
    body: >-
      Relative to many private vertical SaaS companies, Vantaca's retained 2026
      materials are unusually explicit about workflow automation, AI operating
      scope, security posture, and the intended roles of residents, vendors,
      and management companies.
    claimRefs:
      - CO001
      - CO002
      - CO007
      - CO008
      - CO009
  - calloutType: risk
    title: Financing and governance remain under-disclosed
    body: >-
      The assigned refresh pool does not give a reader-safe capital-markets
      picture: no priced round, valuation, total capital raised, or current
      board roster survives into this chapter, and even founding history is not
      fully reconciled.
    claimRefs:
      - CO004
      - CO005
      - CO015
