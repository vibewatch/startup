      - number: '3.2'
        title: Capability, pricing, and trust tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Public evidence in the pool suggests Vantaca wins when a buyer values operational depth more than
              procurement ease. Company-issued 2025-2026 materials emphasize agentic AI that handles AP, AR, budgets,
              onboarding, resident interactions, vendor workflows, and benchmarking, while JMI's 2023 investment note
              described the product as a broader operating platform with partner-bank, resident, and board
              functionality. That breadth is matched by trust messaging: Vantaca says SOC 2 Type II and SecureSky
              monitoring are core to its security posture. The tradeoff is that pricing remains opaque in the public
              record. ManageCasa advertises a $45-per-month starting point and pitches immediate accessibility, whereas
              Vantaca's own comparison still describes Vantaca as a higher-investment system for firms planning to grow.
              In other words, Vantaca's strongest public differentiators are depth, automation, and ecosystem scope, but
              the buying friction is still real.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
              - CP016
      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat implied by the assigned evidence is operational centralization rather than an obviously
              unbeatable price or a neutral benchmark lead. Once Vantaca sits inside ticket routing, board approvals,
              resident portals, banking-linked processes, and partner workflows, switching likely requires retraining
              staff and moving more than a general ledger. That makes displacement harder for point solutions, but it
              does not remove the core risks. A competitor can still undercut on entry price and onboarding burden, and
              an archived G2 review shows that even satisfied users can feel substantial training friction. The deeper
              risk is evidence quality: many of the strongest comparative claims in this pool are vendor-, customer-, or
              partner-issued rather than independent win/loss studies. That leaves commoditization and incumbent
              response partially unresolved even though the current public positioning clearly favors Vantaca in scaled
              CAM operations.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is breadth plus automation
            body: >-
              The strongest supported edge is not low cost; it is Vantaca's attempt to own more of the operating stack
              through agentic workflows, vendor tooling, resident surfaces, and trust controls.
            calloutType: strength
            claimRefs:
