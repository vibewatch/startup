      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is typically the owner or executive team of a professional CAM company; accounting and
              operations leaders evaluate workflow depth, while community managers, accountants, boards, homeowners, and
              vendors use different parts of the system. Vantaca's own small-company guidance says the platform can
              support one to more than 300 associations with full general-ledger accounting, automation, and
              multi-association architecture. The same source describes an approximately 30-day startup implementation
              followed by five months of post-go-live optimization, indicating that adoption is a process change rather
              than a lightweight software signup. For self-managed boards, enterprise onboarding, unpublished pricing,
              and professional-manager workflow depth are disqualifying more often than advantages.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The central adoption driver is labor leverage. Vantaca asserts that software represents only 2% to 5% of a
              CAM company's cost stack while labor is about 80%, and it reports a customer reducing monthly
              invoice-coding time from 40 hours to about 10. Those figures are company-issued and need customer-side
              validation, but they show the ROI mechanism buyers are being asked to underwrite. The constraints are
              equally material: implementation effort, migration risk, opaque quote-based pricing, dependence on
              reliable financial automation, and heightened security and privacy requirements for homeowner and payment
              data. Vantaca reports SOC 2 Type II coverage and SecureSky monitoring, but the retained evidence does not
              include the audit report itself. Valuation should therefore reward demonstrated workflow adoption only
              after retention, pricing, implementation cost, and independently verified labor savings are obtained.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
