      - number: '4.2'
        title: Public traction proxies are strong enough to validate demand, but they mix denominators
        blocks:
          - type: paragraph
            body: >-
              The public record is directionally strong on scale. Company- and partner-issued material place Vantaca
              above 500 management-company customers and above six million managed households or doors, while GetLatka
              reports $85 million of annual revenue in December 2025 and 500 customers. Those disclosures are not
              identical denominators, so they should not be forced into a single KPI, but together they point to
              meaningful commercial traction rather than an early-stage story. Efficiency proof is also visible in case
              material: Vantaca says HOAi is priced per door, expands associations-per-employee, and helped EJF cut
              invoice processing time sharply enough to save labor dollars in a single department. That is useful
              evidence for sales efficiency proxies, even if it remains vendor-selected.
            claimRefs:
