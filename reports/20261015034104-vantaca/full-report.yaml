              - CP005
              - CP009
              - CP013
          - type: callout
            title: Cheaper substitutes still set the market floor
            body: >-
              The same pool shows that Buildium, PayHOA, and ManageCasa remain credible alternatives whenever a buyer
              values transparent entry pricing, simpler onboarding, or rental coverage over enterprise process depth.
            calloutType: risk
            claimRefs:
