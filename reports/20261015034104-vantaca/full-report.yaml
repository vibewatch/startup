  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded as operating software for professional community association
              management companies: accounting, payments, compliance workflows, work orders, homeowner and board
              communication, and portfolio-level automation. Vantaca itself describes the product as a single platform
              built exclusively for HOA management companies, while two competitor-authored comparisons independently
              place it at the enterprise end of the category. Those comparisons are useful for segmentation but are not
              independent market benchmarks. Self-managed associations are an adjacent but generally excluded buyer
              group because they favor lower-complexity, transparently priced tools. General rental-property platforms,
              point solutions, spreadsheets, email, paper checks, and additional labor are the relevant substitutes.
              This boundary avoids treating all property-management software or all HOA spend as addressable to Vantaca.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained sources provide operating-scale observations rather than a conventional market forecast.
              Vantaca reports more than 550 management-company customers representing over 6.5 million doors in the
              United States; its homepage separately reports more than 50,000 associations and more than 6.5 million
              homeowners across North America. The identical-looking 6.5 million figures use different denominators and
              geographic descriptions, so they cannot be summed or treated as interchangeable. A 2026 company release
              also says its agentic infrastructure had executed more than five million tasks across 250 management
              companies, identifying an adopted automation subset within the installed base. These figures establish
              category reach and product penetration lenses, not TAM, SAM, revenue, or market share.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
