  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Buyer adoption appears to start with CAM-operator pain, move through implementation and workflow automation, then
      expand into payments and resident surfaces that deepen switching costs.
    data:
      items:
        - label: Evaluate operator fit
          actor: CAM founders, COOs, and accounting leaders
          stage: Buyer discovery
          touchpoints:
            - Professional-CAM positioning instead of self-managed-board software
            - ROI and comparison content
        - label: Implement core platform
          actor: Client enablement plus operating team
          stage: Initial rollout
          touchpoints:
            - Approximately 30-day startup implementation
            - Post-go-live optimization support
        - label: Automate back office
          actor: AP, AR, and service teams
          stage: Early expansion
          touchpoints:
            - HOAi workflow automation
            - Task execution inside management-company operations
        - label: Extend trust-sensitive workflows
          actor: Finance leaders and procurement stakeholders
          stage: Deeper module adoption
          touchpoints:
            - SOC 2 Type II positioning
            - Payments, treasury, and fraud-aware vendor workflows
        - label: Improve resident and board experience
          actor: Residents, boards, and community managers
          stage: End-user adoption
          touchpoints:
            - Resident-facing features
            - Faster answers to routine homeowner questions
        - label: Create referral and switching-cost loop
          actor: Management-company leadership
          stage: Retention and expansion
          touchpoints:
            - Operational scale gains
            - Cross-sell into AI, payments, and resident experience
    approximationNotes: >-
      The journey reflects disclosed adoption surfaces and expansion paths, not measured conversion rates or cohort
      transitions.
    claimRefs:
      - CU003
      - CU011
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual severity remains concentrated in workflow autonomy, collections compliance, partner dependence, and
      disclosure opacity when each top risk is scored across likelihood, impact, mitigation maturity, and residual
      severity.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative likelihood inferred from current operating design and disclosed workflow scope.
        - label: Impact
          detail: Business consequence if the risk crystallizes.
        - label: Mitigation maturity
          detail: Strength of public mitigants visible in the assigned pool.
        - label: Residual severity
          detail: Net severity after visible mitigants.
      rows:
        - label: Workflow-automation failure
          note: HOAi is marketed as autonomous execution inside financially sensitive workflows.
          values:
            - High
            - Critical
            - Medium
            - High
        - label: Collections/compliance error
          note: Axela integration pushes and pulls data and can auto-submit delinquency cases daily.
          values:
            - Medium
            - Critical
            - Medium
            - High
        - label: Cyber/privacy control gap
          note: Security investment is visible, but independent testing and incident history are not public here.
          values:
            - Medium
            - High
            - Medium
            - High
        - label: Partner/integration concentration
          note: Banks, payment rails, and ecosystem integrations are embedded in the product promise.
          values:
            - High
            - High
            - Medium
            - High
        - label: Governance and financing opacity
          note: Public sources do not disclose board rights, preference stack, or workflow-control thresholds.
          values:
            - Medium
            - High
            - Low
            - High
        - label: Implementation and service-continuity drag
          note: Customer references and onboarding support help, but broad uptime and rollback data is absent.
          values:
            - Medium
            - Medium-High
            - Medium
            - Medium
    approximationNotes: Qualitative placement is derived from the cited evidence, not from a disclosed numerical risk model.
    claimRefs:
      - CR002
      - CR005
      - CR007
      - CR008
      - CR009
      - CR013
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The public record supports continued diligence, but not a fresh buy call at the last disclosed mark.
    data:
      nodes:
        - id: proof
          label: Scale proof exists
          note: >-
            500+ to 550+ management companies and six million to 6.5 million doors/homeowners in retained 2025-2026
            sources.
        - id: product
          label: Product depth looks real
          note: >-
            AI-first workflows, revenue capture, security controls, and partner integrations indicate a substantive
            platform, not a thin feature wrapper.
        - id: anchor
          label: Price anchor is rich but real
          note: $300M+ minority round at $1.25B; the best public revenue anchor implies roughly 14.7x revenue.
        - id: terms
          label: Terms visibility is still weak
          note: >-
            Public financing disclosures still omit board rights, liquidation preferences, and primary-versus-secondary
            mix.
        - id: gaps
          label: Underwriting gaps remain
          note: >-
            Public evidence still lacks audited ARR, margin, retention, cash-flow, and detailed preference-stack
            disclosure.
        - id: call
          label: 'Recommendation: Track'
          note: >-
            Stay engaged, but require better disclosure or a better entry price before moving to a positive
            recommendation.
      edges:
        - from: proof
          to: product
          label: traction supports the narrative
        - from: product
          to: anchor
          label: capability can justify premium interest
        - from: anchor
          to: terms
          label: headline price is not the whole deal
        - from: terms
          to: gaps
          label: price demands deeper proof
        - from: gaps
          to: call
          label: insufficient proof keeps the posture cautious
    approximationNotes: The flow expresses analytical sequencing, not quantified conversion odds or probability weights.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV013
      - CV016
