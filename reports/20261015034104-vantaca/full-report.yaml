        title: Exhibits
        blocks:
          - type: callout
            title: Operational footprint is not market size
            body: >-
              Company-reported customers, associations, homeowners, doors, and automated tasks use different units and
              boundaries. They show deployment scale but cannot be converted into TAM, SAM, SOM, revenue, or market
              share without an external universe and pricing evidence.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: callout
            title: ROI evidence remains issuer-controlled
            body: >-
              The strongest labor-saving and implementation metrics in the assigned pool are published by Vantaca.
              Customer contracts, cohort retention, realized savings, and implementation invoices are required before
              those claims support a valuation premium.
