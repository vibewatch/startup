              - CU011
              - CU016
      - number: '6.2'
        title: Named production proof is strongest in vendor-authored case studies
        blocks:
          - type: paragraph
            body: >-
              Public proof of production use exists, but it is concentrated in company-authored case studies and
              operating examples. Vantaca's startup-buyers and ROI materials cite deployments from startup firms to
              larger operators: Restoration stayed at three employees while growing from seven to 29 associations;
              ManageWorks reached 25 associations and 5,000+ doors with four employees; Alpha reached eight associations
              and 2,700 doors in 16 months; and Ascent went live in 30 days across 84 communities and 9,000 doors.
              Separate 2026 official materials add operating-scale signals such as more than five million AI tasks
              across 250 management companies and an ROI model built on outcomes across 188 customers tracked over more
              than three years. That is enough to support real adoption and land-and-expand potential, but it is not the
              same as an independently verified cohort or audited retention study.
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
      - number: '6.3'
        title: Durability, expansion, and procurement friction remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              Durability evidence is materially weaker than deployment evidence. Vantaca discloses implementation NPS of
              90 and positions SOC 2 Type II compliance as a trust-building signal, but it does not publish GRR, NRR,
              renewal-rate, logo-churn, or concentration data that would show whether customer outcomes persist across
              the installed base. Independent customer sentiment is mixed: Software Finder shows 20 verified-customer
              reviews averaging 3.9 out of 5, and negative November 2024 reviews complain about complexity, insufficient
              training, and slow access to specialist support, with one reviewer alleging an escalating three-year
              contract structure. The chapter therefore supports production use and multi-surface expansion logic, but
              only partial evidence on whether customer relationships are durable, low-friction, and broadly
              referenceable outside Vantaca's own marketing surfaces.
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Installed-base evidence is credible
            body: >-
              Official 2026 materials, a third-party company profile, and public review-marketplace data all point to a
              real and sizable Vantaca customer footprint, even if the exact denominator definitions differ.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU012
          - type: callout
            title: Durability proof is still thinner than adoption proof
            body: >-
              Public reference cases show scale gains, but Vantaca does not publish retention or concentration metrics
              and independent reviews introduce friction signals around complexity, onboarding, and support.
            calloutType: risk
            claimRefs:
              - CU006
              - CU010
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The key underwriting risk is not whether Vantaca has product momentum; the assigned sources support
              meaningful scale, broad workflow coverage, and an increasingly agentic operating model. The risk is that
              this automation touches accounting, receivables, collections, and homeowner communications, so an error
              can create compliance, cash, customer, and reputation damage simultaneously. Public disclosures also stay
              asymmetric: there is abundant company-controlled evidence on customer outcomes and ROI, but much less on
              board rights, control thresholds, remediation histories, or downside scenarios. That asymmetry keeps
              residual severity high even where headline mitigants such as SOC 2 Type II and SecureSky are in place.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR009
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR008
              - CR009
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports three specific concerns. First, Vantaca itself frames privacy, cyber, and
              operational disruption as material consequences if controls fail, which matters because the product
              handles homeowner and financial data. Second, the Axela integration moves collections data
              bi-directionally and automates daily submission, so weak approvals or reconciliation could turn an
              operations feature into a compliance event. Third, the public evidence set does not clear governance risk:
              scale, funding, and AI ambition are visible, but board composition, investor rights, preference stack, and
              workflow-control thresholds are not. That means the chapter can rank the risk but cannot mark it mitigated
              without a deeper legal and financing diligence pass.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR015
      - number: '7.3'
        title: Operational, security, and execution exposure
        blocks:
          - type: paragraph
            body: >-
              Operationally, Vantaca is selling more than a workflow database; it is selling a system that claims to
              execute work on behalf of management teams. That raises the blast radius of bad automation, bad data, or
              weak escalation rules. Customer- and company-controlled evidence shows ticket routing, onboarding support,
              and implementation assistance that can absorb some change-management risk, but the same evidence also
              shows how much daily service continuity depends on the system being available and correctly configured.
              Because the pool lacks public error-rate, outage-history, or rollback metrics, the prudent stance is to
              treat execution reliability as partially mitigated rather than proven.
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR008
              - CR013
              - CR015
      - number: '7.4'
        title: Partner dependencies, model risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Partner dependence is material because Vantaca's platform value proposition includes banks, payment rails,
              and ecosystem integrations, while the public evidence also shows a specific collections workflow leaning
              on Axela. Financially, the business appears scaled enough to matter, but public evidence does not show
              unit economics, reserve practices, or downside sensitivity if automation underdelivers or partner
              relationships break. The chapter's kill criteria should therefore be concrete: any verified security
              incident affecting resident or payment data, evidence of collections-control failure, a major integration
              or bank-partner disruption, or financing/governance terms that subordinate new investors more than
              expected would materially weaken the case. Until those items are diligenced, the right interpretation is
              manageable but still high residual risk.
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR008
              - CR009
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top risk
            body: >-
              The most important residual risk is autonomous workflow execution in financially and legally sensitive
              processes without public control-threshold, rollback, or complaint-history disclosure.
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
              - CR015
          - type: callout
            title: Kill criteria for the investment case
            body: >-
              Treat any verified resident-data incident, collections-control failure, major bank or integration
              disruption, or materially investor-unfriendly 2025 financing terms as thesis-break triggers until
              management proves otherwise.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The newest public valuation anchor is clear: JMI Equity and Vantaca both described the October 2025 round
              as a $300M+ minority investment at a $1.25B valuation, with the founding management team staying in place
              and JMI remaining involved. That anchor matters because it shows a sophisticated lead investor was willing
              to underwrite the story, but it does not by itself prove today's entry price is attractive. The best
              public revenue datapoint in the assigned pool is Latka's $85M December 2025 figure, which would imply
              roughly a 14.7x revenue multiple against the 2025 valuation. That is not automatically wrong for a
              fast-growing vertical SaaS winner, but it is hard to defend aggressively when the same public record still
              does not disclose audited ARR, margin structure, net retention, or cash generation. On public evidence
              alone, the right call is track rather than buy: the business looks investable, while the price still looks
              stretched relative to how little external underwriting detail is available.
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV013
              - CV016
      - number: '8.2'
        title: Proof points that justify staying engaged
        blocks:
          - type: paragraph
            body: >-
              The reason not to walk away is that Vantaca does appear to have real operating proof. By late 2025 the
              financing materials and third-party analysis were already describing more than 500 management companies
              and six million households on the platform, and by 2026 Vantaca and partner materials were citing 550+
              management companies and more than 6.5 million doors or homeowners. The product story is also more
              substantial than a generic proptech pitch: the assigned sources consistently describe an AI-first
              operating system spanning accounting, workflows, communications, payments, analytics, and revenue capture,
              with current partner integrations and customer-specific examples of continuity and workflow gains. That
              combination supports a live thesis that Vantaca could deserve premium valuation treatment versus simpler
              HOA tools if diligence can verify retention, margin durability, and true automation outcomes beyond
              vendor-authored case material.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Anti-thesis, downside, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is less about whether Vantaca has product-market fit and more about whether outside
              investors can underwrite the price with enough precision. Vantaca's own comparison content says the
              platform is a higher-investment option and not the right fit for the lowest-cost or self-managed buyer,
              which reinforces that the company is selling a premium workflow stack rather than a broad low-price
              product. Premium positioning can work, but only if the economics are as strong as the narrative. The
              current assigned pool still leaves open core diligence items: audited revenue quality, gross margin, net
              retention, cash burn, board rights, liquidation preferences, and primary-versus-secondary round mix.
              Security readiness and ecosystem integrations are helpful positives, yet they do not close those
              underwriting gaps. That combination argues for explicit downside triggers: any evidence of
              weaker-than-claimed automation ROI, margin compression, or unfavorable preference overhang would push the
              next financing discussion below the 2025 reference mark.
            claimRefs:
              - CV008
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: track, not buy'
            body: >-
              The assigned evidence is good enough to keep diligence active because the company appears to have real
              scale, a real financing anchor, and a differentiated workflow story. It is not good enough to underwrite a
              fresh entry at the 2025 unicorn mark without audited economics, clearer cap-table terms, and a more
              explicit market comp frame.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV014
              - CV016
