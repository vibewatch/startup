  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visible, but monetization is still quote-led and partially opaque
        blocks:
          - type: paragraph
            body: >-
              Public materials make the commercial structure legible without making it fully modelable. Independent
              review coverage says Vantaca does not publish public rate cards, plan tiers, or per-unit pricing, and
              instead routes buyers into a custom-quote process that should break out setup, subscription, processing,
              and contract terms. That fits the product positioning: official and partner material consistently frame
              Vantaca as a management-company operating system with adjacent monetization surfaces in implementation,
              payments, and AI automation, rather than as a self-serve SMB tool. The revenue bridge is therefore
              understandable at a category level, but realized pricing, discounting, attach rates, and payment take
              rates are still not public enough to underwrite gross revenue quality from outside the data room.
            claimRefs:
              - CI001
