  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: >-
      Public evidence implies a portfolio-priced software stack that adds implementation, payments, and AI automation on
      top of the core operating-system contract, but only part of that bridge is numerically disclosed.
    data:
      nodes:
        - id: contract
          label: Management-company contract
          detail: Buyers are routed into custom quotes rather than a public price card.
        - id: platform
          label: Core software subscription
          detail: Recurring revenue appears scoped by management-company portfolio size and workflow complexity.
        - id: onboarding
          label: Implementation + migration
          detail: Public case material describes ~30-day startup deployments plus months of optimization support.
        - id: payments
          label: Vantaca Pay
          detail: Payments are embedded in the platform, but public take rates and reserve practices are not disclosed.
        - id: automation
          label: HOAi module
          detail: Vendor claims $0.54 per door/month and labor-saving outcomes across AP, AR, and service workflows.
        - id: payback
          label: Gross-profit / payback outcome
          detail: >-
            Public upside is labor removal and customer scale, while the unknowns are realized pricing and post-raise
            cash efficiency.
      edges:
        - from: contract
          to: platform
          label: quote becomes recurring license
        - from: platform
          to: onboarding
          label: deployment activates workflows
        - from: platform
          to: payments
          label: payments sit inside operations
        - from: platform
          to: automation
          label: installed base becomes AI attach surface
        - from: onboarding
          to: payback
          label: services load affects time to ROI
        - from: payments
          to: payback
          label: undisclosed processing economics
        - from: automation
          to: payback
          label: labor savings drive the public ROI story
    claimRefs:
      - CI008
      - CI010
      - CI011
      - CI016
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product story layers resident and vendor surfaces on top of a CAM workflow core, with agentic AI and a
      gated API acting as extensibility and automation layers.
    data:
      layers:
        - label: Residents and boards
          detail: Resident-facing self-service and board-visibility surface
          items:
            - label: Vantaca Home
              detail: Resident payments, requests, transparency, and community-facing experience
        - label: Management workflows
          detail: Core CAM operating system for back-office execution
          items:
            - label: Core CAM platform
              detail: Accounting, homeowner ledgers, communications, violations, ARC, work orders, and collections
        - label: AI orchestration
          detail: Automation layer that drafts or executes repetitive work
          items:
            - label: HOAi / Scout / HOAi Fleet
              detail: Agentic support for invoices, receivables, budgets, drafting, and back-office execution
        - label: Vendor network
          detail: Payment and service-provider coordination surface
          items:
            - label: Vantaca Vendor
              detail: Payment workflows, payout verification, and self-service vendor status visibility
        - label: API and integration surface
          detail: Externally documented extension layer for vendors
          items:
