              - CI015
      - number: '4.3'
        title: Margin story depends on automation and onboarding execution more than disclosed software margins
        blocks:
          - type: paragraph
            body: >-
              The margin thesis in public evidence is mostly operational rather than accounting-based. Official ROI
              content argues that labor, not software license cost, is the dominant expense in community-association
              management, and positions HOAi as the lever that removes invoice, receivables, and service workload. That
              is consistent with customer-facing case studies and with Vantaca's effort to embed payments, vendor
              workflows, and data migration into a broader operating stack. The offset is that independent reviews
              describe heavy setup work, a real learning curve, and periodic product-reliability complaints. In other
              words, the public upside case is better service-delivery leverage and labor removal, but the payback
              period is still sensitive to implementation quality and customer willingness to absorb change.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Capital adequacy looks improved after the 2025 raise, but external underwriting still lacks the cash file
        blocks:
          - type: paragraph
            body: >-
              The clearest capital fact in public evidence is the October 2025 minority growth round: Vantaca announced
              a $300 million-plus investment at a $1.25 billion valuation after a stated 95% revenue increase over the
              prior year. That is enough to conclude that financing risk was materially reduced at the time of the round
              and that the company had access to growth capital. It is not enough to conclude current runway, cash
              efficiency, or next-round timing. None of the reviewed public sources discloses current cash on hand,
              burn, debt obligations, covenants, or a board-approved operating plan. The financial verdict is therefore
              positive on demand and platform breadth, but still blocked on core SaaS quality metrics and post-raise
              liquidity detail.
            claimRefs:
              - CI003
              - CI004
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports scale, not software-quality precision
            body: >-
              The market will find enough evidence to believe Vantaca is large and commercially relevant; it will not
              find enough to underwrite revenue quality or margin durability without private data.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI014
              - CI015
          - type: callout
            title: Payback risk sits in implementation friction and undisclosed payments economics
            body: >-
              The strongest adverse signal is not lack of demand but the combination of heavy setup work,
              annual-contract friction, and missing disclosure on realized payment-processing economics.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is broad and CAM-specific
        blocks:
          - type: paragraph
            body: >
              Public evidence consistently frames Vantaca as a purpose-built operating system for community association
              management companies rather than a lightweight resident portal. The official site and company-authored
              materials describe one surface spanning association accounting, payments, homeowner ledgers,
              communications, and action-item workflows such as violations, ARC requests, work orders, and collections.
              A third-party API profile confirms that scope by listing the same operational modules, while a
              competitor-authored review describes HOAi, Scout, dashboards, automation, and resident-facing tools as
              part of one stack. That combination matters because CAM operators need trust-sensitive accounting and
              service workflows in the same system. The product appears differentiated by category-specific workflow
              depth and automation coverage, but the most ambitious workflow-efficiency claims still come from Vantaca's
              own surfaces rather than neutral benchmarks.
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE013
