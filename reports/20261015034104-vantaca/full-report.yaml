      - number: '5.2'
        title: Architecture combines core workflows, AI, gated integrations, and support-heavy deployment
        blocks:
          - type: paragraph
            body: >
              The publicly visible operating model looks like a layered stack. At the center is a multi-association CAM
              system of record covering accounting, homeowner records, communication, and service workflows. Around that
              core, Vantaca is now productizing role-based AI agents, a vendor-payment network, and a resident-facing
              experience. The clearest external technical proof is the documented public REST API surfaced on
              SwaggerHub: API Evangelist identifies a published OpenAPI 3.0 definition with 75 operations across read,
              write, and accounts-payable groups. That is meaningful developer signal, but it is not a self-serve
              platform motion. The same profile says access is granted only after a Vantaca customer authorizes a
              vendor, with customer-specific credentials and IP whitelisting. Deployment also appears support intensive:
              company-authored onboarding material describes roughly 30-day startup implementation followed by a
              five-month optimization program, which suggests real workflow complexity and meaningful change-management
              requirements.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
