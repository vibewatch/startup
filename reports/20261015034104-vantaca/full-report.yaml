  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and segmentation
        blocks:
          - type: paragraph
            body: >-
              The relevant alternatives split into at least four buckets. Direct CAM platforms include Vantaca itself,
              ManageCasa, and CINC Systems; adjacent incumbents or substitutes include Buildium, AppFolio, and PayHOA;
              and the status quo still includes fragmented email, phone, text, and portal workflows inside management
              firms. The assigned sources consistently place Vantaca on the professional-management-company side of the
              market rather than the volunteer-board or smallest-HOA end. ManageCasa's comparison frames Vantaca as an
              enterprise product with custom pricing, no free trial, and deeper workflow automation, while Vantaca's own
              small-company guide concedes that Buildium and PayHOA still compete on low entry price and simplicity.
              That segmentation matters because buyers are not just choosing software features; they are choosing how
              much process, training, and future migration risk they are willing to absorb.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP012
              - CP014
              - CP015
