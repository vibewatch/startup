              - CE008
              - CE010
              - CE011
      - number: '5.3'
        title: Maturity is improving, but independent proof still lags the product story
        blocks:
          - type: paragraph
            body: >
              Vantaca's public product narrative became materially broader in 2026. The company says HOAi Fleet extends
              automation from isolated tasks into a coordinated team of role-based agents, while Vantaca Vendor and
              Vantaca Home push the stack deeper into vendor disbursements and resident experience. The security posture
              also has at least one concrete public marker: Vantaca says it has SOC 2 Type II compliance and
              SecureSky-backed monitoring and incident-response tooling. Those are useful trust signals for a platform
              handling homeowner data and payments, but they do not substitute for independent validation of uptime,
              error rates, model-governance controls, or implementation outcomes. The main product-tech underwriting
              risk is therefore not absence of a product surface; it is the gap between a credible, category-specific
              architecture and the still-limited public evidence on reliability, AI exception handling, pricing
              mechanics, and module-level adoption.
            claimRefs:
              - CE002
              - CE008
              - CE011
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
