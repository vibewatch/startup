        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              The assigned refresh pool consistently presents Vantaca as a community-association-management software
              platform rather than a generic property-management tool. Official 2026 materials repeatedly frame the
              business as AI-first, purpose-built for HOA and condo management, and organized around workflow execution
              rather than static recordkeeping. That narrative is reinforced by customer-facing descriptions of ticket
              routing, accountability, and automated handoffs, which make the core product story coherent even though
              pricing and audited financial disclosure remain absent from this chapter's evidence pack.
