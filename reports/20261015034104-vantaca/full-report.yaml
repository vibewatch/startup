        title: Target customer and installed-base proof
        blocks:
          - type: paragraph
            body: >-
              Vantaca's disclosed buyer is the professional community association management company rather than
              self-managed boards or generic rental operators. Official 2026 materials repeatedly frame the product as a
              full operating system for third-party CAM firms, with accounting, workflow automation, AI, payments, and
              resident-facing surfaces sold into the same account. Company-authored materials say Vantaca serves more
              than 550 management companies and more than 6.5 million doors, while a third-party Superframeworks profile
              cites over 500 management-company customers, 50,000+ communities, and six million homes. Those figures are
              directionally consistent and support a real installed base, but the definitions vary across sources and
              none of the public materials break customers down by geography, ACV, or segment mix beyond the U.S.
              market.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU011
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
