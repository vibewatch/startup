- id: TE004
  title: Trust / quality / compliance table
  columns:
  - control or quality signal
  - status
  - scope
  - chapter implication
  rows:
  - - Apple privacy disclosure
    - Public and current
    - Lists linked data such as purchases, location, contacts, content, search history, browsing history, usage, and diagnostics
    - Shows the product is data-rich and therefore needs stronger internal controls than a pure media app
  - - Android permission disclosure
    - Public and current
    - Shows camera, storage, calendar, network, and location permissions among others
    - Useful for transparency, but not enough to establish real security posture or least-privilege discipline
  - - Third-party inspection interfaces for used cars
    - Public historical disclosure
    - Inspection-report interoperability and mutual recognition with third-party inspection agencies
    - Raises trust in used-car workflows by reducing single-platform information asymmetry
  - - Testing methodology and expert framing
    - Public but contested
    - ADAS and winter tests are paired with educational framing and expert commentary
    - Good for public education, but controversies show trust can fall when rankings are inferred
  - - Complaint record and fairness criticism
    - Independent and adverse
    - AsiaICT reports complaints about pricing, dealer fulfillment, and harassment plus fairness doubts around tests
    - Trust diligence must include complaint handling, merchant governance, and conflict management rather than product polish
      alone
  notes: The table mixes controls and trust signals because the public record is stronger on visible signals than on formal
    certification artifacts.
