- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - public evidence
  - key dependency
  - risk
  rows:
  - - Structured vehicle database
    - Canonical facts for selection, comparison, and ranking
    - 50M+ structured records and 76k+ model library disclosed in 2025 AI panorama
    - Continuous manufacturer data ingestion and normalization
    - Coverage depth is disclosed, but freshness cadence is not
  - - Real-world test database
    - Empirical evidence for safety and performance journalism
    - 4,000+ tested models and 1M+ data points disclosed in 2025
    - Test-fleet access, scenario design, and data cleaning
    - Methodology disputes can weaken trust even when scale is real
  - - Automotive-domain LLM / multimodal VLM
    - Interpret natural-language queries and combine text, photo, and video context
    - 2025 AI panorama says Dongchedi built vehicle LLM and multimodal VLM on top of general models
    - General-model providers plus domain tuning data
    - No public benchmark quantifies accuracy or hallucination rates by task
  - - Smart Engine and knowledge graph
    - Convert raw data into expert-tuned recommendation logic
    - Knowledge graph, reinforcement engine, and expert platform disclosed in 2025
    - Expert labeling and continuous model tuning
    - The weighting between rules, learned behavior, and editorial override is opaque
  - - Merchant operating stack
    - Distribute leads and manage CPS-driven operations for dealers
    - Judongche conference describes 卖车通, 懂车云店, Buyerhunter, and dual-end operations
    - ByteDance traffic, merchant onboarding, and settlement logic
    - Merchant retention and failure handling are not disclosed
  - - Mobile app and device layer
    - Deliver content, search, camera, map, and commerce experiences to users
    - Apple, Baidu, and Tencent listings plus permission details show a feature-rich mobile implementation
    - iOS and Android platform distribution plus device permissions
    - Broad data collection and permissions require ongoing privacy and security diligence
  notes: This table treats dealer operations as part of the architecture because monetization depends on the merchant-control
    plane as much as on the consumer AI layer.
