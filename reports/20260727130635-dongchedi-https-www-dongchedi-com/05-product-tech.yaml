  title: Workflow / use-case table
  columns:
  - user job
  - starting behavior
  - Dongchedi solution
  - observable benefit
  - limitation
  rows:
  - - Early-stage car discovery
    - Scroll short video, news, and creator clips
    - Content feed plus video-first automotive coverage
    - Keeps top-of-funnel users inside a high-volume automotive media surface
    - Public evidence does not quantify content-to-lead conversion by cohort
  - - Narrowing a shortlist
    - Compare parameters, prices, owner comments, and test content
    - Parameter tools, Dongchefen, owner reviews, and comparison workflows
    - Collapses fragmented third-party research into one surface
    - The weighting of owner-review signals versus editorial tests is not public
  - - Vague intent to concrete car list
    - Ask for a budget-and-style recommendation
    - AI car selection / AI Xiaodong
    - Supports long-tail intent such as budget, gendered styling, or EV preference without exact model names
    - No public benchmark shows how often AI recommendations become transactions
  - - Dealer contact and quote discovery
    - Move from browsing to store or live interaction
    - Dealer leads, live streams, and quote-oriented services
    - Lets merchants capture high-intent users without leaving the ecosystem
    - Merchant-side uptime, support, and lead quality metrics are not public
  - - Trade-in, used-car, and subsidy help
    - Check valuation and transaction support after vehicle choice
    - Used-car channel, valuation flows, and subsidy application support
    - Extends the platform beyond editorial influence into execution support
    - Current finance and insurance-attach depth is not verifiable from public material
