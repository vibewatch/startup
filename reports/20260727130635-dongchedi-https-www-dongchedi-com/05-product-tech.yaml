- id: TE001
  title: Product module / asset matrix
  columns:
  - module / asset
  - primary user
  - customer job
  - status / maturity
  - differentiation
  - diligence gap
  rows:
  - - AI car selection / AI Xiaodong
    - B2C buyers
    - Turn vague needs into a shortlist, comparison set, and transaction entry point
    - Launched and actively marketed in 2025
    - Natural-language car shopping tied to ratings, images, price, and service flows
    - Public evidence does not disclose conversion uplift or close-rate by query type
  - - Content platform
    - Consumers, creators, OEMs, dealers
    - Drive discovery through articles, short video, reviews, and livestreams
    - Core and mature
    - Video-first engagement plus ByteDance distribution and creator supply
    - Revenue mix between advertising reach and commerce contribution is undisclosed
  - - Price, review, and Dongchefen trust tools
    - Consumers comparing models
    - Validate a target car through owner commentary, prices, and comparative tools
    - Mature since 2020
    - Combines owner sentiment, structured data, and comparative workflows in one surface
    - How ratings are weighted and refreshed is not publicly documented
  - - Used-car and trade-in services
    - Consumers and used-car merchants
    - Value a trade-in and move from browsing to used-car transaction
    - Live and expanding since 2021
    - Used-car channel plus inspection-report interoperability and valuation hooks
    - Current take-rate and partner economics are not public
  - - Dealer operating stack (卖车通 / 懂车云店 / CPS)
    - Dealers and dealer groups
    - Acquire, distribute, convert, and settle high-intent leads
    - Scaled and merchant-facing
    - Ties ByteDance traffic to closed-loop merchant operations and CPS accountability
    - Public sources do not disclose retention, SLA, or merchant churn
  - - Real-world testing and safety journalism
    - Consumers, OEMs, industry observers
    - Benchmark vehicles, educate buyers, and create trust or debate around capability
    - Scaled but controversial
    - Large test corpus and repeatable scenario framing create a proprietary content-data asset
    - Editorial safeguards and methodology governance remain an open diligence area
  notes: Rows group Dongchedi by workflow asset rather than by navigation tab, because the same buyer can move across several
    modules in one session.
