      - number: '8.2'
        title: 牛市、基准与熊市估值区间
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 的估值最好用情景拆开看，因为最关键的缺口是变现质量。乐观情景下，公司把用户规模转成强劲的广告主和经销商支出，拿到更多汽车互联网广告份额，并证明与 ByteDance
              相邻的生态能放大分发，而不会推高估值折价风险。这可以支撑 $5 billion 或更高的结果，但前提是收入规模清楚进入足以相对公开可比公司享受倍数溢价的区间。基准情景更保守：Dongchedi 以约 $3-4
              billion 上市，较 2024 年融资轮大致持平到小幅上行，因为投资人认可其增长强于 Autohome，但仍会惩罚不透明和宏观不确定性。悲观情景假设上市延后，或出现接近 $2 billion
              的降估值结果，原因可能是可比公司倍数压缩、ByteDance
              牵连加重，或变现表现不及预期。这个框架刻意不追求精确。真正的问题不是小数点后一位是否正确，而是公司能否赚到足够大的溢价，跑赢收入、结构和治理上的证据缺口。
