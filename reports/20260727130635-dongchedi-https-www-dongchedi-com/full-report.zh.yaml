      - number: '6.2'
        title: 采用证据在经销商运营和公共服务流程中最强，而不是在完全透明的企业账户披露中
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 确实有真实客户证据，但不同分部强弱不一。最干净的具名 B2B 证据来自经销商集团和渠道伙伴，而不是一长串单独披露的 OEM 软件客户。Uxin 是二手车领域清晰的历史具名伙伴。2025 年
              Judongche 伙伴大会提供了更多运营证据：Oulong Group 称 Dongchedi 是覆盖 21 个品牌和 100+ 门店的重要线上运营基地；Hangzhou Lingke Lynk Center
              据报在 2025 年 1 至 10 月 Dongchedi 线索和交易排名第一。更广泛的队列证据也有意义。Baidu Baike 记录了 2022 年经销商数字技能大赛，涉及 30 个 OEM 品牌和
              13,000+ 经销商门店；平台还曾作为全国新能源汽车下乡活动部分环节的独家线上展览界面。这些都是可信信号，说明 Dongchedi
              已嵌入汽车分销工作流；但公开资料仍少披露具名账户的交易规模、合同期限或落地深度。换句话说，现有证据偏运营、不是合同。它显示商家和活动伙伴在真实工作流中使用
              Dongchedi，但还没有披露足以让投资者清晰评估账户质量的经常性经济性。
