            body: >-
              公开证据对 Dongchedi 技术栈可观察的外层异常丰富。2025 年 7 月 AI 全景图列出数据层、系统层、模型层和应用层，并由自有车辆数据、专业公共数据和用户授权数据支撑。同一批披露还描述了汽车领域
              LLM、多模态 VLM、包含知识图谱和强化训练的 Smart Engine，以及可用于产品判断的大规模真实世界测试语料。在这个 AI 核心之外，经销商侧运营层同样关键：卖车通、懂车云店、CPS 结算逻辑和
              ByteDance 流量分发，才把平台从内容 app 变成商业操作系统。因此，架构同时有两个部署表面：iOS 和 Android 上的 B2C 移动使用，以及依托同一条流量和数据主干的 B2B
              商家工具。路线图表解释了为什么这有战略意义：Dongchedi 正从功能堆叠，走向更深的 AI 原生商业闭环。这也意味着商家层不是副业。如果经销商工具、分发逻辑或 CPS 结算机制失灵，消费者 AI
              层仍可能有趣，但商业运营模型会明显变弱，因为线索路由和交易跟进本身就是产品承诺的一部分。
