      - number: '6.3'
        title: 留存、扩张与集中度仍是公开尽调最弱环节
        blocks:
          - type: paragraph
            body: >-
              客户记录中最重要的限制是耐久性。应用商店表面显示用户满意度，车主评价、直播和社区工具也都暗示消费者会重复使用，而不是一次性浏览文章。商家侧也有可信的 先落地再扩张的逻辑，因为内容发现、AI
              选车、经销商路由、补贴支持和 CPS 运营可以相互强化。但这一逻辑仍是推断，并未闭环。公开来源没有披露 NRR、GRR、流失率、合同期限、重复投放率或头部客户集中度。信任风险同样重要。AsiaICT
              明确提到用户投诉，以及对 Dongchedi 专业性和公正性的质疑；36Kr 和其他媒体则认为，抓眼球的测试项目可能模糊消费者教育与感知排名之间的界线。对承销而言，结论是平衡的：Dongchedi
              显然有规模和商业嵌入，但客户质量仍需要直接尽调商家续约、队列 留存、集中度，以及编辑产品影响购买行为时平台信任如何被保护。实际含义是，本章下一次更新应少找一个新客户标识，多拿队列
              证据：商家续约率、重复活动支出、投诉解决速度，以及信任争议是否可衡量地损害转化或留存。这是关键未解尽调任务。
