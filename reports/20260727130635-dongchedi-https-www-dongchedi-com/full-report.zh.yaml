      - number: '2.2'
        title: TAM、SAM 与公开可比公司的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              需要多重规模测算视角，因为已审阅资料没有给出干净、权威的「中国在线汽车平台 TAM」数字。大需求背景毋庸置疑：中国 2024 年销售 31.44 million 辆汽车，其中新能源车 12.866 million
              辆，批发口径占比 40.9%；某些乘用车零售口径的渗透率更高。但这些需求池仍然不是平台收入池。可变现规模更好的锚点，是公开可比公司和邻近市场统计的组合。最接近的公开可比公司 Autohome 在 2024 年实现
              RMB 7.04 billion 收入，即便媒体板块下滑，也说明成熟垂直平台不用持有车辆库存，也能在数十亿元人民币规模上变现。中国互联网广告市场 2025 年上半年为 RMB 359.85
              billion，但其中只有一部分可归入汽车；汽车支出里又只有一部分能被专业平台高效触达。因此，本章把 TAM、SAM 和 Dongchedi 可能的当前 SOM
              表述为推断区间，而不是精确事实。这些区间仍有用：它们显示市场足够大，可以支撑数个规模化玩家，但也没有大到只靠流量就能保证有吸引力的经济性。
