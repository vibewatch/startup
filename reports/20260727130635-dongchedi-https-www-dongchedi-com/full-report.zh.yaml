      - number: '3.2'
        title: 能力、市场打法与变现对比
        blocks:
          - type: paragraph
            body: >-
              最尖锐的对比，在于 Dongchedi 的 ByteDance 原生发现模式，与 Autohome 更传统的垂直媒体和经销商服务栈。Dongchedi 的公开姿态是视频优先、搜索权重高，并越来越多由 AI
              辅助；这应有助于它在购车旅程更早阶段捕获年轻用户意图。Autohome 仍以公开收入、利润和流量规模锚定品类，而且并未停下：公开材料显示，它也在积极推进 AI 产品，并持续投入线下零售。这一点重要，因为
              Dongchedi 的优势在漏斗顶部更强；到了成交层，经销商和 OEM 可以在多个渠道之间分配预算。线上购物研究、汽车营销报道和 app
              对比文章都指向同一结论：能把内容、搜索、线索路由和服务钩子结合起来的平台，最有机会守住变现；但没有任何平台看起来独占了买方注意力或经销商需求。对承销而言，预算份额会流向最能把研究意图转成可衡量经销商价值的平台。视频触达、搜索深度和
              AI 新鲜感重要，但只有在提升闭环线索质量和广告主 ROI 时才真正重要。
