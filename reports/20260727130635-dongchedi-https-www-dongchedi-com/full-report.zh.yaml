  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与受众规模
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 必须同时按两条轴线分层：消费侧终端用户，以及经销商/OEM 侧可变现商业参与者。消费侧，平台不是普通的泛受众媒体资产。2024 和 2025 年公开资料指向数千万月活、超过 10
              million 日活，以及异常高的购车意图：十个深度看车用户中有六个使用该 app，多数购车者到店前已经心里有车型。人口结构上，增长最快的是年轻用户和女性用户，这解释了为什么 AI
              辅助和对话式选车功能具有商业意义。商业侧，Dongchedi
              面对的是广泛经销商和品牌网络，而不是一小串具名大企业名单。这意味着客户数量上分散，但公开记录对触达和流量的证据，仍远强于对付费账户经济性的证据。这对尽调很重要，因为 Dongchedi
              可以在一层增加用户，而另一层的变现强度同时变化。受众规模本身不能证明经销商经济性，但能解释为什么平台对商家、OEM 营销活动和政策联动的汽车消费项目仍具战略相关性。规模在这里显然重要。非常明显。
