        - App 商店页、AI 发布报道和经销商大会行为指标都能看出这一点
        - 正面：产品有多处机会提升单用户变现深度
        - 要求披露从内容曝光到线索、报价、订金和成交的转化漏斗
      - - 经销商工具依赖
        - 商户变现是把用户规模转成收入的核心
        - CPS 模式、卖车通网络和经销商案例都有明确证据
        - 线索质量能持续就是正面因素；商户若快速流失就是风险
        - 要求按获客分群披露续约、流失和商户 ROI
      - - 具名客户不透明
        - 公开证据覆盖面广，但对头部客户和支出集中度披露不足
        - 具名证据偏向经销商集团和分群项目，而不是完整收入披露
        - 风险：收入集中度可能藏在多元化的公开叙事背后
        - 要求披露前 10 大商户 / OEM 集中度和合同条款
      - - 信任与公平性争议
        - 投诉或被认为测试有偏，都会削弱消费者和商户信心
        - AsiaICT 和 36Kr 记录了投诉和公平性争议
        - 风险：争议累积后，平台信任可能拖累转化或续约
        - 要求披露投诉解决指标、商户纠纷率和编辑治理控制
      - - 政策挂钩的补贴服务
        - 政府以旧换新服务能在纯广告需求之外拉动流量和交易
        - 2024 年和 2026 年的补贴平台资料都有明确提及
