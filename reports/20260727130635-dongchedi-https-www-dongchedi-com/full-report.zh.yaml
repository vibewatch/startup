      - number: '7.3'
        title: 运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Dongchedi
              也有实质性运营风险，因为其价值主张取决于它能否在波动的广告漏斗里，保持可信汽车权威的身份。中国汽车市场仍然庞大且增长，尤其是新能源车；但同一证据基础也显示，竞争强度持续、关税和地缘政治压力存在、弱势品牌继续承压。这个背景让广告预算更具周期性，而不是更稳定。ADAS
              争议因此重要，因为它显示 Dongchedi 的编辑和测试层多快会变成声誉与监管问题。公司似乎还暴露于合作伙伴和平台依赖。ByteDance
              关联对发现和品牌叙事仍然重要；OEM、经销商和更广泛的中国汽车周期则决定变现质量。Autohome
              收入下滑不只是竞争对手变弱，也是在提醒：品类龙头即便规模很大，也可能丢收入。这是一门外部依赖足以在管理层尚未有太多反应时间前，就抬高获客成本、削弱广告主需求或压缩利润率的业务。
