      - number: '2.5'
        title: 矛盾口径、出口影响与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              这个市场贯穿着两类矛盾。第一类是统计口径，不是实质矛盾：有些来源使用新能源车批发销量和整车产量，另一些使用乘用车零售数据，因此看似不一致的渗透率，往往是在衡量不同分母。第二类是战略矛盾。市场指标清楚指向数字汽车渠道的持续需求，但同一批数据也解释了为什么纯广告驱动模式脆弱。移动广告集中度有利于
              Douyin 等巨头，OEM 自有线上能力也在提升。公开可比公司的收入仍证明存在大型利润池，但由于广告主结构、价格战和预算归属变化，这些利润池并不会自动扩张。因此，本章故意把 TAM/SAM/SOM
              做成区间框架，而不是单一醒目数字。实际未解问题都与 Dongchedi 自身有关：准确收入、分部结构、经销商留存、OEM
              集中度，以及各交易产品抽佣率。在这些披露之前，市场规模足以支撑投资讨论，但还不足以支撑精确的承销估值。
