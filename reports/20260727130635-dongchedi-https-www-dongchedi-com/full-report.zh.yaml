      - number: '4.3'
        title: 资本充足性、融资依赖与结论
        blocks:
          - type: paragraph
            body: >-
              短期运营的资本充足性看起来扎实，但仍与未来融资选择相连。2024 年 RMB 5.8 billion
              融资在许多烧钱情景下都足以支撑数年发展；但公开证据不披露账上现金、债务或经营性烧钱，因此现金续航仍只能估算。IPO 报道重要，因为它暗示 Dongchedi
              寻求公开股权，可能不只是为了资产负债表安全垫，也为了流动性、估值发现，以及更重的 AI 或服务投资。英文报道中的「最高 $600 million」与中文报道中的 RMB 5.8 billion
              之间的差异也具有财务相关性，因为投资者应以 RMB 数字为锚，对翻译成美元的简写保持谨慎。Autohome 2025 年收入下滑和中国汽车市场激烈竞争带来的负面读穿很直接：Dongchedi
              大概率能为增长融资，但收入质量取决于可衡量的转化提升，而不是单靠流量增长。公开数据支持一家可融资的公司，不支持一份已经完成的公开市场承销。ByteDance
              关联还带来非零的地缘政治和政策叠加，可能影响公开市场投资者解读治理和上市风险，即便 Dongchedi 本身是汽车平台。这不会否定资本故事，但支持用估值区间，而不是点估值。这个谨慎判断是本章结论的核心。
