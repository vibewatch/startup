        title: 身份、产品范围与公司架构
        blocks:
          - type: paragraph
            body: >-
              与其把 Dongchedi
              看作单纯内容网站，不如把它放在汽车媒体、交易转化和经销商软件的交界处。多方资料把它描述为汽车信息、交易和服务平台；公开百科资料与后续市场报道也显示，这套产品涵盖编辑内容、创作者视频、榜单与测试工具、直播、二手车与置换服务，以及面向经销商的转化产品。产品身份很关键，因为后续财务和市场规模测算不能把
              Dongchedi 误当作简单广告发布商或汽车零售商。公司可追溯到 ByteDance 的 Toutiao 汽车频道，但独立 app 在 2017 年 8 月上线，该频道也在 2018 年 1 月更名为
              Dongchedi，由此形成可用的创立时间线。EqualOcean、Longbridge、Baidu Baike 和 BigGo 的报道还指向 2023 年底至 2024 年 1 月的一次重组：运营主体从
              Today's Headlines 中抽离，并由 Xiamen Dongchezu Technology Co., Ltd. 100% 持有。这个动作支持一个判断：即便 ByteDance
              仍然支撑分发和战略语境，Dongchedi 现在已经是一个独立公司资产。
