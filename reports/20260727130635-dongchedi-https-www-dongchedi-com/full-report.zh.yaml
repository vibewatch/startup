      - number: '1.3'
        title: 所有权过渡、融资与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 画像最清晰的跃迁，发生在从 ByteDance 做结构性分离之后。EqualOcean 和后续报道把新的全资子公司架构，与外部融资和未来独立核算联系起来。到 2024
              年中，多篇报道指向首轮外部融资约 USD 600 million；基于中国工商登记的报道则将该事件表述为 RMB 5.8 billion 融资，投后估值约 RMB 21.7 billion。Yahoo
              Finance 引用 Bloomberg 的报道，对投资方和估值区间提供了最强佐证，点名 General Atlantic、HongShan、KKR 和 Gaorong。到 2026
              年，报道重心从融资确认转向公开市场定位：多家媒体称 Dongchedi 正探索香港 IPO，目标募资约 USD 1.0 billion 至 USD 1.5 billion。这些 IPO
              报道都没有正式申报文件或公开具名确认，因此更合适的表述是：Dongchedi 看起来已具备上市准备的财务成熟度，但仍处于申报前阶段，且对传闻敏感。这层细微差别重要，因为融资和 IPO 叙事可信，但尚未落定。
