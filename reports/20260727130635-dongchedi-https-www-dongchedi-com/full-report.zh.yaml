        - 生产环境确定性
        - 结果具体度
        - 留存可见度
      rows:
        - label: Uxin 战略合作
          values:
            - 中
            - 高
            - 低-中
            - 低
        - label: Oulong Group 经销商运营
          values:
            - 高
            - 高
            - 中
            - 低
        - label: Hangzhou Lingke Lynk Center
          values:
            - 高
            - 高
            - 中-高
            - 低
        - label: NEV 下乡 OEM 群体
          values:
            - 中
            - 高
            - 低
            - 低
        - label: 消费者应用商店满意度
          values:
            - 高
            - 高
            - 中
            - 中
    approximationNotes: 评分是对抓取记录中证据质量的定性判断，并非收入贡献或客户价值。
    claimRefs:
      - CU015
      - CU019
      - CU020
      - CU021
      - CU023
      - CU035
  - id: FU004
    title: 留存 / 复用队列
    type: cohort
    layout: standard
    summary: Dongchedi 未披露真正的商家或消费者留存队列，因此该图给公开记录中可见的重复使用信号强度打分。
    data:
      columns:
        - 重复使用可见度
        - 工作流深度
        - 经济耐久性可见度
      rows:
        - label: 消费者应用商店触点
          values:
            - 85
            - 65
            - 20
        - label: 车主口碑与社区循环
          values:
            - 75
            - 70
            - 15
        - label: 直播与内容复用
          values:
            - 70
            - 80
            - 20
        - label: 经销商 CPS 与商家工具
          values:
            - 60
            - 85
            - 10
        - label: 已披露留存 KPI
          values:
            - 0
            - 0
            - 0
    approximationNotes: 数值为 0-100 的可见度评分，并非实际留存率；目的在于显示哪里有证据、哪里没有。
    claimRefs:
      - CU015
      - CU024
      - CU025
      - CU026
      - CU027
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高风险单元集中在监管外溢、收入集中和内容可信度周围。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
      rows:
        - label: 低概率
          values:
            - 轻微治理披露缺口
            - 单一品牌活动流失
            - 局部经销商流失
        - label: 中概率
          values:
            - 管理层不透明
            - IPO 时间延后
            - 流量成本膨胀
        - label: 高概率
          values:
            - ADAS / 内容可信度
            - 中国汽车广告疲软
            - ByteDance / 地缘政治外溢
    approximationNotes: 单元格概括排序后的综合判断，而非统计模型。
    claimRefs:
      - CR018
      - CR023
      - CR025
      - CR027
      - CR029
      - CR037
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 母公司与监管冲击大多通过信任、流量和估值通道传导，而不是直接带来停摆风险。
    data:
      nodes:
        - id: parent
          label: ByteDance 外溢
        - id: reg
          label: 监管负担
        - id: trust
          label: 用户 / 广告主信任
        - id: traffic
          label: 获客效率
        - id: revenue
          label: 广告需求
        - id: ipo
          label: IPO 执行
        - id: valuation
          label: 估值倍数
      edges:
        - from: parent
          to: trust
        - from: parent
          to: ipo
        - from: reg
          to: traffic
        - from: reg
          to: ipo
        - from: trust
          to: revenue
        - from: traffic
          to: revenue
        - from: ipo
          to: valuation
        - from: revenue
          to: valuation
    approximationNotes: 节点把几条相关路径压缩成一张面向投资人的传导图。
    claimRefs:
      - CR009
      - CR010
      - CR026
      - CR027
      - CR029
      - CR034
      - CR036
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Dongchedi 最重要的依赖项位于其直接运营边界之外。
    data:
      nodes:
        - id: dongchedi
          label: Dongchedi
        - id: bytedance
          label: ByteDance
        - id: douyin
          label: Douyin 导流
        - id: oems
          label: OEM 广告预算
        - id: dealers
          label: 经销商生态
        - id: users
          label: 用户信任
        - id: regulators
          label: 中国监管机构
      edges:
        - from: bytedance
          to: dongchedi
        - from: douyin
          to: dongchedi
        - from: oems
          to: dongchedi
        - from: dealers
          to: dongchedi
        - from: users
          to: dongchedi
        - from: regulators
          to: dongchedi
        - from: bytedance
          to: douyin
    approximationNotes: 依赖关系是方向性、定性的，并未加权。
    claimRefs:
      - CR001
      - CR022
      - CR024
      - CR025
      - CR026
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 由于定价支撑滞后于战略兴趣，建议仍为继续研究。
    data:
      nodes:
        - id: scale
          label: 真实规模信号
          detail: 据报道的触达规模和平台重要性足以支持继续尽调
          tone: positive
        - id: comp
          label: 可比公司约束
          detail: Autohome 和公开可比公司压住可辩护的叙事溢价上限
          tone: neutral
        - id: gaps
          label: 证据缺口
          detail: 收入、结构和融资条款仍高度私密
          tone: risk
        - id: price
          label: 价格纪律
          detail: 接近私募轮估值时尚属合理；若 IPO 推向 $5B+，就显得偏高
          tone: risk
        - id: decision
          label: 建议 = 继续研究
          detail: 保持跟进，但前提是价格更紧、披露更充分
          tone: neutral
      edges:
        - from: scale
          to: comp
          label: 但
        - from: comp
          to: gaps
          label: 加上
        - from: gaps
          to: price
          label: 推动
        - from: price
          to: decision
          label: 因此
    approximationNotes: 流程把叙事证据转成投资流程决策，而不是量化评分。
    claimRefs:
      - CV023
      - CV029
      - CV030
      - CV031
      - CV032
      - CV034
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Dongchedi 能否证明收入密度高于公开可比公司基线，将显著左右情景估值。
    data:
      items:
        - label: 悲观
          value: 2
          tone: risk
          unit: $B
        - label: 基准
          value: 3.5
          tone: neutral
          unit: $B
        - label: 乐观
          value: 5
          tone: positive
          unit: $B
    approximationNotes: 柱状条是情景锚点，并非概率模拟。
    claimRefs:
      - CV016
      - CV017
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 回报结果受入场价格和披露质量影响更大，而不是单一市场倍数假设。
    data:
      items:
        - label: 悲观情景
          low: 1.8
          mid: 2
          high: 2.4
          detail: IPO 延迟，或类似估值下调轮的结果
          tone: risk
        - label: 基准情景
          low: 3
          mid: 3.5
          high: 4
          detail: 上市完成，相比上一轮获得适度溢价
          tone: neutral
        - label: 乐观情景
          low: 4.6
          mid: 5
          high: 5.8
          detail: 增长和变现跑通，估值倍数获得溢价
          tone: positive
    approximationNotes: 所有数值均为十亿美元口径，反映情景判断区间。
    claimRefs:
      - CV017
      - CV029
      - CV030
      - CV033
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 公司在战略重要性上得分较高，但披露完整度和风险控制较弱。
    data:
      items:
        - label: 上一轮私募估值
          value: 3
          unit: $B
          detail: 广泛报道的 2024 年估值标记
          tone: neutral
        - label: 乐观 / 基准 / 悲观锚点
          value: 5.0 / 3.5 / 2.0
          unit: $B
          detail: 情景估值标记
          tone: neutral
        - label: Autohome 市值
          value: 2.44
          unit: $B
          detail: 截至 2026 年 7 月前后的最接近中国上市可比锚点
          tone: risk
        - label: 风险评级
          value: High
          detail: 变现不透明叠加母公司外溢，使风险保持高位
          tone: risk
        - label: 投资建议
          value: research-more
          detail: 买入判断前还需要更多披露
          tone: neutral
    approximationNotes: KPI 卡混合数值和分类决策变量，因为建议对证据高度敏感。
    claimRefs:
      - CV005
      - CV022
      - CV029
      - CV031
