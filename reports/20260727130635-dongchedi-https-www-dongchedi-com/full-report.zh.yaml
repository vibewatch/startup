      - number: '7.2'
        title: 监管与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              最严重的非运营风险来自重叠的法律制度，而不是某一条规则。美国针对 ByteDance
              的行动表明，国家安全审查可以围绕所有权、数据访问和算法控制展开；评估关联上市时，这三项都重要。在中国境内，具有约束力的规则体系不同，但同样有分量：《国家情报法》确立配合义务，算法推荐、网络安全和个人信息规则则扩大了所有推荐驱动内容市场的合规面。Dongchedi
              尤其暴露，因为排名、个性化、搜索和安全相邻媒体，都靠近监管者可描述为影响公共利益的领域。公开证据足以排序法律风险，但对 Dongchedi
              特定备案、审计和主动监管沟通仍披露很薄。这种不对称很重要：投资者能清楚看见规则，却无法充分观察公司层面的控制环境。因此，缓释成熟度至多看起来中等；任何 IPO 进程前，剩余敞口仍然偏高。
