  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的概览
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 的风险栈主要由几类因素主导，它们改变公开市场估值的速度，可能快于改变日常运营。第一是母公司外溢。Dongchedi 已在运营上拆分，但市场仍把它视为 ByteDance 支持的资产，因此即便
              Dongchedi 本身不是美国行动的直接目标，投资者也可能把 TikTok 式地缘政治审查映射到这项资产上。第二是商业模式集中。在线汽车信息平台变现的是承压的 OEM
              和经销商营销预算生态；品类同业的公开市场证据显示，当汽车品牌激进打折时，规模不能完全保护收入。第三是内容可信度。2025 年 ADAS
              测试争议显示，当编辑或测试形式被认为与安全有关、披露不足或存在商业争议时，Dongchedi
              会制造自我伤害式风险。实际含义是，下行传导是多步骤的：母公司声誉、内容信任、流量效率和广告预算疲软可能相互叠加；即便管理层执行称职，剩余敞口仍高。
