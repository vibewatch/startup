      - number: '8.3'
        title: 可比公司组与公开市场映射
        blocks:
          - type: paragraph
            body: >-
              Autohome 是最重要的定价锚，因为它是一家大型中国在线汽车信息平台，财务、倍数公开，且近期收入持续下滑。仅这一点，就会限制 Dongchedi 被当作普通高增长消费互联网资产估值。CarGurus 和
              Cars Commerce 拓宽了视角，让投资人看到经销商变现、市场流量和相邻软件在更成熟公开市场中的样子，但它们都不是干净的一一对应可比公司。CarGurus
              受益于更强的美国经销商经济性和更透明的信息披露。Cars Commerce 的业务结构比 Dongchedi 公开叙事更偏软件和经销商工具。中国私有可比公司更弱：Bitauto 或 Yiche
              已不再是新鲜的公开参考，Chehaoduo 数据也稀疏。因此，可比公司组带来的更多是谨慎，而不是信心。它说明，如果增长显著更好，Dongchedi 合理上可以相对 Autohome
              获得一定溢价；但在证据更清楚之前，不足以支撑英雄式倍数。
