      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 所在市场的增长逻辑，根植于中国汽车需求的结构性数字化。新能源车渗透持续快速提升，2025 年上半年乘用新能源车销量增长 33%，渗透率达到
              50.1%。以旧换新补贴、线上购车准备度、用户对智能功能更熟悉，以及 OEM 对更快发布周期的需求，都支撑了对数据密集型数字平台的需要。同时，约束也真实存在。JD Power
              描述行业盈利被压缩、品牌退出；McKinsey 认为竞争正从价格转向创新，但这仍意味着更高支出压力和产品更替；China Skinny 报道 2024 年汽车广告支出大幅下滑；BearingPoint 显示，近半
              OEM 现在允许定制化线上购买，这会削弱基础列表或信息服务的差异化。因而，Dongchedi 受益于市场数字化，但不是线性受益。它必须把创作者密度、测试可信度和 ByteDance
              流量入口，转化成更高收益的经销商与 OEM 变现，同时避开信任问题和渠道替代风险，否则垂直平台会显得可互换。
