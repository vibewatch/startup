  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流与模块地图
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 的产品最好按买家旅程理解，而不是按静态媒体网站理解。消费者可以从短视频或文章发现开始，进入更深入的参数对比和车主评价，借助 AI
              辅助选车缩小范围，联系经销商或进入直播，再继续到二手车置换、补贴申请，或购后车主社区使用。应用商店描述和 2025 年 AI
              发布报道显示，内容、对比、定价和交易支持不是彼此隔离的信息孤岛，而是被缝进一个移动优先工作流。这一点重要，因为平台不仅靠注意力变现，也靠用户向报价请求、经销商线索、直播电商互动和平台辅助服务的高意图移动变现。因此，下方模块矩阵把
              AI、内容、评分、定价、直播电商和二手车服务视为彼此相连的工作流资产，而不是独立 SKU。尽调层面，Dongchedi
              不应太像出版商来评估，而应被看作工作流编排者：它的产品质量取决于用户能否顺畅地从灵感、候选清单走到经销商动作，同时不丢失对价格、评价或推荐的信任。
