      - number: '4.2'
        title: 单位经济、成本结构与利润率路径
        blocks:
          - type: paragraph
            body: >-
              单位经济故事方向上有吸引力，但不完整。经销商订阅和高意图线索路由工具应是质量最高的收入流，因为它们可以重复发生，并直接绑定转化。品牌广告今天可能是最大收入流，但也最具周期性，因为 OEM
              发布节奏、经销商预算和宏观情绪都可能快速变化。AI 选车、搜索驱动的对比、定价和交易服务流程加入后，说明 Dongchedi
              正尝试从媒体注意力转向可变现意图。长期看，这可能改善贡献经济性；但它也抬出了模型训练、数据运营、销售覆盖，以及可能的线下或服务层实验成本问题。Dongchedi 不像纯 SaaS
              公司，更可能混合软件型和市场型成本。公开证据未披露毛利率、CAC 回收期、NRR 或
              GMV，因此最稳妥的判断是：利润率路径理论上在改善，但仅凭公开证据尚无法证明。可见度缺失也意味着投资者无法清晰区分好增长和昂贵增长。更高比例的经销商订阅和转化挂钩工具，会显著改善叙事，但公开来源仍未披露实际收入结构或各收入流贡献利润率。
