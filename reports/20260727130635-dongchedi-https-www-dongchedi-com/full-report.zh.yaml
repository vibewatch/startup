      - number: '2.3'
        title: 买方地图、预算归属与变现路径
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 服务多边市场，因此用户不总是买方，买方也不总是付款方。终端消费者用平台做研究、看测试内容、对比、查榜单、听创作者建议，并获得购车辅助。OEM
              和品牌营销方购买的是注意力、新车发布、区域激活，以及可衡量的线索或交易结果。经销商集团和单店购买线索流、转化工具、价格可见度，以及在到店客流本身已不够用的市场里逐步获得经营杠杆。金融、保险、二手车伙伴等邻近付款方，可以在购车者释放意向后变现漏斗后段。这个区分对尽调很重要，因为预算归属影响韧性。OEM
              品牌预算有周期性，也容易受利润率压力影响；经销商预算更直接绑定销量转化，更偏 ROI；消费者付费意愿通常是间接的。因此，最强的平台不是单纯把流量做大，而是把用户触达转成商家经济性。Autohome
              从纯媒体收入转向更多元结构的过程，在这里很有启发，也说明 Dongchedi 的长期机会取决于更深的交易和经销商工具，而不仅是内容观看量。
