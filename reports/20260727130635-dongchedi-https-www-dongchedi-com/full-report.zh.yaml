  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 的相关市场不是整个中国汽车行业，也不是整个中国互联网广告市场。它是影响车辆发现、考虑、经销商线索生成、在线配置、交易，以及金融转介、二手车流程等可变现点击后服务的数字层。这个区分很重要：中国
              2024 年售出数千万辆汽车，但 Dongchedi 并不捕获这些车辆的制造收入或经销商毛利。它争夺的是围绕汽车需求的营销、线索、转化和交易服务预算。Dongchedi 和 Autohome
              的公开描述指向相近变现栈：OEM 品牌营销、经销商订阅或线索生成工具、交易撮合、数据产品，以及其他增值服务。因此，实际替代品比传统汽车门户更宽，包括 Autohome 和 Bitauto、Douyin
              原生汽车发现与直播电商、OEM 直面消费者电商和代理模式体验，以及经销商线下渠道。市场定义是第一道分析筛选器：它避免把整车销售额夸大成 TAM，同时承认垂直平台可以在购车旅程的多个层级变现。
