  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              现有证据支持继续研究，而不是直接买入。Dongchedi 明显具备规模、品牌认知和可信的 2026
              年流动性路径，但公开记录在收入年化规模、变现密度、流量结构和融资条款上仍过薄，无法支撑对价格不敏感的看多立场。最近一轮约 $3 billion
              私募估值在叙事上可以理解，因为投资者押注的是用户规模、ByteDance
              邻近性和香港上市机会。即便如此，叙事可信不等于估值有支撑。纪律严明的投资者应只有在能用具体收入和变现证据搭桥时，才把上一轮私募估值视为大致合理。因此，入场纪律比抽象的公司质量更重要。如果 IPO
              定价接近私募估值，且带来可信新披露，这个名字仍值得继续做功课。若交易向 $5 billion 名义估值 靠拢，却没有明显更好的财务证据，即便公司本身仍具战略吸引力，建议也应因价格维持负面。
