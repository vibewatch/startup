      - number: '8.4'
        title: 退出准备度、尽调问题与否决触发点
        blocks:
          - type: paragraph
            body: >-
              退出准备度可信，但尚未完全证明。试探性报道和市场环境显示，香港路径可行；同一批信息也提醒投资人，不能把尽调外包给上市窗口本身。信心仍在低到中之间，因为关键变量仍然私有：真实收入运行率、按用户队列拆分的变现、客户集中度、融资偏好，以及实际依赖
              ByteDance
              的程度。这些不是装饰性缺口，而是直接决定私募轮估值会复利、横盘，还是被证明过于乐观。因此，最终尽调清单很直接。投资人需要管理账口径证据、股权结构经济性、渠道归因和广告主留存数据。也需要立即重新确认承销商和时间表，因为香港市场条件变化很快。在这些问题解决前，正确姿态是保持观察、对价格敏感。Dongchedi
              仍可能成为强 IPO 候选；但当前公开记录不支持假装那些艰难的承销问题已经有答案。
