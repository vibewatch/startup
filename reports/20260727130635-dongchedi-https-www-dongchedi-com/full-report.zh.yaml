  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与公开牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 的收入模型没有正式披露，但它的公开运营足迹强烈暗示，这是一套混合模式：OEM 广告、经销商订阅、付费线索或交易服务，以及由数据或工具驱动的追加销售。公司庞大的经销商和品牌网络、高移动端
              DAU，以及一站式信息、交易和服务平台定位，都指向这一点。2024 年融资轮也很重要，因为它把公司定位成不只是一个流量资产：融资规模足以支撑产品扩张、AI 工具和潜在上市路径。最佳外部代理指标仍是
              Autohome。其 2024 年收入和利润证明，中国汽车平台在规模化后可以获得实质性盈利；后续下滑也提醒，规模无法消除周期性。尽调视角下，Dongchedi
              的商业真实度较高，但公开证据仍只能支撑有边界的区间判断，而不是披露完备的收入桥。核心财务问题因此不是 Dongchedi
              能否产生收入，而是足够多的收入是否具备经常性、可衡量，并能抵御平台与市场周期。公开证据有力回答了前半部分，对后半部分只回答了一部分。
