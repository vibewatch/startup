      - number: '3.3'
        title: 护城河耐久性、切换成本与风险清单
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 最有证据支撑的护城河，不是某个秘密功能垄断，而是分发与数据循环：ByteDance 式推荐、大型汽车数据集、活跃站内搜索和 AI
              辅助选车，被串进同一条消费者旅程。这有意义，但不等于硬锁定。消费者仍可跨多个 app 比较，经销商可以多平台投放预算，车企也能通过自有品牌渠道推送线索。Autohome
              的公开收入下滑也是有用警讯：龙头流量可以依旧很大，但变现会在竞争压力下走弱。实践中，耐久性问题不是 Dongchedi
              能否消灭替代品，而是能否把更年轻的用户结构和更快的内容形态，转化成比传统同业更好的付费线索质量。现有证据支持一个有利但不牢不可破的判断：Dongchedi 在算法发现和 AI
              导购上似乎比传统同业位置更好，但公开证据对经销商转化、重复变现，以及线下或服务实验的精确经济性仍然很薄。因此，最能提高信心的缺失指标，是经销商留存、转化和 队列变现。在这些数字披露前，应把 Dongchedi
              视为有竞争优势，但尚未证明拥有硬经济护城河。这让竞争结论保持有利，同时也保持纪律。更多经销商队列 披露会显著锐化这一结论。还需进一步。
