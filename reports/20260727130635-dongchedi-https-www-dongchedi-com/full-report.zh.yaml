  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构与直接同业
        blocks:
          - type: paragraph
            body: >-
              Dongchedi 面对的不是一个同质化竞争对手。直接同业是 Autohome，它是中国市场中有公开披露的流量、经销商变现和汽车媒体盈利基准。Yiche 作为传统 app
              对比对象，在中国消费者报道中仍然重要；Guazi/Chehaoduo 更适合作为相邻的二手车交易专家，而不是新车发现的一对一替代品。更广泛的替代集合还包括 OEM
              自有线索渠道和经销商运营的私域流量，因为最终试驾线索可以在垂直媒体 app 之外被截获。公开报道还显示，Dongchedi 已不只是 ByteDance 内部流量实验：它被拆成独立运营公司，完成大额 Series
              A，并已经被讨论为香港 IPO 候选。这意味着，竞争应被理解为对分发能力、线索质量和最终变现深度的争夺，而不是只比 app 下载量。另一个实际结果是，Dongchedi
              应同时对标内容同业和交易替代品。买家可以从短视频评测开始，最后却在经销商 CRM、品牌小程序或二手车市场完成动作，所以相关战场比经典汽车媒体标签更宽。
