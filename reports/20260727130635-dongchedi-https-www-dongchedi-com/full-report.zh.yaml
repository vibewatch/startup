companyProfile:
  summary: >
    Dongchedi（懂车帝，也称 DCar）是中国头部汽车内容与交易平台。它最早孵化于 ByteDance 旗下 Toutiao 新闻应用的汽车频道，2017 年 8 月作为独立 app 上线。经历多年快速增长后，ByteDance
    于 2023 年底启动正式拆分；2024 年 1 月，Dongchedi 以 Beijing Dongchedi Technology Co., Ltd. 完成独立公司注册，该主体由 Xiamen Dongchezu
    Technology Co., Ltd. 全资持有。2024 年 6 月，公司完成 RMB 5.8 billion（约 $800 million）Series A 融资，投资方包括 HongShan（前 Sequoia
    China）、KKR、General Atlantic 和 Gaorong Capital，平台估值约 $3 billion。截至 2026 年中，Dongchedi 正积极筹备香港 IPO，目标募资 $1.0–1.5
    billion；若成行，它将成为 ByteDance 首个独立上市的业务单元。
  foundedDate: '2017-08-01'
  founders:
    - name: ByteDance commercialization team
      role: 企业内部孵化
      background: 孵化于 ByteDance 的 Toutiao 产品；公开记录中没有具名外部联合创始人
      claimRefs:
        - CO005
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >
    Dongchedi 提供汽车内容（新闻、短视频、专家评测、用户社区）、AI 驱动选车（2025 年 7 月推出）、价格对比、汽车直播销售、经销商线索生成、置换估值、汽车金融转介，以及安全测试新闻。平台覆盖 110+
    汽车品牌、76,000+ 车型，服务 30,000+ 授权经销商，并借助 ByteDance 的推荐算法和 Douyin/Toutiao 流量网络。
  customerFocus: |
    B2C：准车主、现有车主和爱好者——偏年轻（30 岁以下），且女性新能源车买家增长很快。B2B：30,000+ 经销商支付订阅或交易费用，110+ OEM 品牌购买广告和数据分析服务。
  businessModel: |
    四类收入：（1）OEM/品牌广告（最大），（2）经销商订阅和线索生成费用，（3）交易服务费（车辆销售上的 CPS 模式），（4）增值数据分析。汽车贷款、保险等金融服务转介贡献次要收入。所有财务数据均未公开。
  stage: Series A / late private
  fundingStatus: >
    Series A 于 2024 年 6 月完成：HongShan、KKR、General Atlantic 和 Gaorong Capital 投入 RMB 5.8 billion（约 $800 million），投后估值 RMB
    21.7 billion（约 $3 billion）。据报道，截至 2026 年初 IPO 流程已经启动，目标是香港交易所，募资 $1.0–1.5 billion。
