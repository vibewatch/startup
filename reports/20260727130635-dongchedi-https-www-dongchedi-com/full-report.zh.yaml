      - number: '1.2'
        title: 管理层可见度与治理边界
        blocks:
          - type: paragraph
            body: >-
              公开披露的领导层信息明显薄于 Dongchedi 的用户规模和融资体量。公开资料一致显示，业务孵化于
              ByteDance，而不是由资料完备的企业家创立，因此公司概览应把具名创始人历史列为未解问题，而不是自行补全。Baidu Baike 将 He Jian 列为 CEO，并列出几位职能高管；但 2024 年 1
              月独立化报道对治理的描述更间接，只称法定代表人将由业务战略负责人担任。两类信息足以勾勒一个基本运营管理层，却不足以证明董事会、委员会架构或投资者权利框架透明。实际含义是关键人依赖：Dongchedi
              依赖一小层可见管理团队、源自 ByteDance 的产品分发，以及似乎由少数高管推动的资本市场准备。因此，现有证据支持它拥有真实运营组织，但还不足以让外部投资者按上市公司深度尽调治理画像。
