  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: The table includes only public, nameable accounts or programs where fetched sources directly tie Dongchedi to a
      dealer group, strategic partner, or automotive-distribution cohort; many more merchants likely exist but are not individually
      referenceable in public.
