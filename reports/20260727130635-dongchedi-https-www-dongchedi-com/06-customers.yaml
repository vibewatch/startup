- id: proof-and-adoption
  title: Adoption proof is strongest in dealer operations and public-service workflows, not in fully transparent enterprise
    account disclosure
  body: 'Dongchedi does have real customer proof, but the proof is uneven by segment. The cleanest named B2B evidence comes
    from dealer groups and channel partners rather than from a long list of individually disclosed OEM software customers.
    Uxin is a clear historical named partner in used cars. The 2025 Judongche partner conference adds more operational proof:
    Oulong Group described Dongchedi as an important online-operations base across 21 brands and 100-plus stores, while Hangzhou
    Lingke Lynk Center reportedly ranked first in leads and transactions on Dongchedi for January to October 2025. Broader
    cohort evidence is also meaningful. Baidu Baike records a 2022 dealer digital-skills competition involving 30 OEM brands
    and more than 13,000 dealer stores, and the platform also served as the exclusive online exhibition surface for parts
    of the national new-energy-vehicles-to-the-countryside campaign. Those are credible signs that Dongchedi is embedded in
    automotive distribution workflows, even if public references still under-disclose deal size, contract duration, or production
    depth by named account. Put differently, the available proof is operational rather than contractual. It shows that merchants
    and campaign partners use Dongchedi in real workflows, but it stops short of disclosing the recurring economics that would
    let an investor cleanly rank the quality of those accounts.'
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU028
  - CU035
