  - segment
  - deployment or use case
  - production vs pilot
  - observable outcome
  - limitation
  rows:
  - - Uxin Group
    - Used-car strategic partner
    - Exclusive strategic cooperation in used-car ecosystem and distribution
    - Production / formal partnership
    - Shows Dongchedi could win a named commercial partner early in the platform's scale-up
    - Public sources do not disclose GMV, revenue share, or current status of the cooperation
  - - Oulong Group
    - Large dealer group
    - Uses Dongchedi and Douyin for digital operations across 21 brands and 100+ stores under CPS-driven online operations
    - Production / scaled operations
    - Conference case study says Dongchedi became an important base for online operations and conversion management
    - Case-study language is positive but does not disclose spend, contract term, or ROI denominators
  - - Hangzhou Lingke Lynk Center / Zhejiang Jizhi Group
    - Brand-specific dealer operator
    - Uses Dongchedi to drive leads and transactions for the Lynk brand line
    - Production / scaled operations
    - Conference case study says the center ranked first in leads and transactions on Dongchedi from Jan-Oct 2025
    - Single-store / single-brand proof is strong on execution but not enough to prove full network economics
  - - 2022 NEV-to-the-countryside OEM cohort
    - OEM campaign cohort
    - Dongchedi acted as exclusive online exhibition platform for parts of a national NEV promotion campaign
    - Production campaign / cohort
    - Shows the platform could support official large-cohort OEM distribution rather than only consumer content
    - The proof is cohort-level and not a single named recurring software customer
  notes: Table rows deliberately mix named companies with one named cohort program because private-company disclosure is sparse;
