figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Dongchedi's strongest journey begins with content or search discovery and deepens into AI selection, dealer interaction,
    subsidy help, and owner-community reuse.
  data:
    nodes:
    - label: Discovery
      description: User arrives through content feeds, short video, reviews, or social distribution inside Dongchedi and the
        wider ByteDance automotive traffic pool.
    - label: Validation
      description: The shopper checks prices, owner reviews, Dongchefen, and comparison tools to reduce purchase uncertainty
        before talking to a dealer.
    - label: AI narrowing
      description: AI car selection converts vague intent into a short list, often before a user visits a store.
    - label: Dealer or campaign action
      description: User enters dealer lead flow, livestream commerce, or an OEM / subsidy campaign supported by the platform.
    - label: Transaction support
      description: Trade-in, subsidy application, and used-car valuation services help move a decision toward execution.
    - label: Post-purchase loop
      description: Owner reviews, prices, community participation, and livestream or content re-use create repeat engagement
        after the first purchase decision.
  approximationNotes: The journey is synthesized from public product descriptions and dealer-conference behavior statistics;
    it is not a published company funnel.
  claimRefs:
  - CU005
  - CU010
  - CU011
  - CU012
