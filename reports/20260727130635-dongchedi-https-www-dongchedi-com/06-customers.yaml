tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale signal
  - strategic value
  - key gap
  rows:
  - - B2C active shoppers
    - Buyer, user, and payer are usually the same household decision-maker
    - Discover, compare, shortlist, and transact around new or used cars
    - 35.7M MAU in June 2024; 10M+ DAU by 2025 disclosures
    - Largest reach pool and the entry point into every other monetization path
    - No public split between casual content users and transacting users by cohort
  - - Young and female NEV-oriented buyers
    - Users are younger and increasingly female; payers are households or individual buyers
    - Use AI, reviews, and community signals to narrow complex EV choices
    - Under-30 users +16% YoY; female users +101% in 2025 disclosures
    - Supports Dongchedi's move toward conversational, taste-driven selection tools
    - Income, geography, and final-purchase mix are not disclosed
  - - Dealers and dealer groups
    - Buyer is dealer management; users are sales, digital-ops, and store staff; payer is dealership budget
    - Acquire, route, and convert high-intent leads through CPS and dual-end tools
    - 30,600+ connected merchants in 2025 conference coverage
    - Core monetization bridge between traffic and vehicle transactions
    - Retention, renewal, and average merchant spend remain private
  - - OEM brands and campaign partners
    - Buyer is OEM or brand marketing / sales leadership; users are dealer networks and campaign teams; payer is OEM budget
    - Brand campaigns, digital distribution, and event or program collaboration
    - 110+ brands served; 30 OEMs in 2022 dealer competition cohort
    - Provides top-of-funnel budgets and category legitimacy
    - Named account depth is much weaker than aggregate coverage depth
  - - Public-service / subsidy participants
    - User is consumer; payer is policy budget or platform-supported service flow
    - Trade-in subsidy applications and policy-guided purchase conversion
    - 140B RMB vehicle-consumption impact claimed for 2024; 130k applicants served by Oct. 2024
    - Creates transaction-adjacent volume and policy relevance beyond advertising
    - Attach rate to downstream commercial monetization is not disclosed
  notes: The segmentation table separates monetized commercial participants from end-user audiences because Dongchedi monetizes
    both attention and transaction adjacency.
