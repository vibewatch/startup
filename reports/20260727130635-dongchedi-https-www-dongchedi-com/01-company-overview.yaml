company:
  name: Dongchedi
chapter:
  number: 1
  title: Company Overview
  summary: Dongchedi is ByteDance's auto-information, trading, and dealer-services platform that was incubated inside Toutiao, launched as a standalone app in 2017, and structurally separated in 2023-24 ahead of outside funding and a possible IPO. Public reporting supports meaningful scale in audience, creator supply, dealership coverage, and funding, while leaving revenue, board composition, and some leadership details opaque.
sections:
- id: identity-and-scope
  title: Identity, product scope, and corporate setup
  body: Dongchedi sits at the intersection of automotive media, transaction enablement, and dealer software rather than operating as a pure content site. Multiple sources describe it as an automobile information, trading, and services platform, while public encyclopedia material and later market reporting show that the product bundle spans editorial content, creator videos, ranking and testing tools, live streams, used-car and trade-in services, and dealer-facing conversion products. The product identity matters because later financial and market sizing work should not confuse Dongchedi with either a simple ad publisher or a vehicle retailer. The company traces back to ByteDance's Toutiao auto channel, but the standalone app launched in August 2017 and the channel itself was renamed to Dongchedi in January 2018, creating a usable founding timeline. Reporting across EqualOcean, Longbridge, Baidu Baike, and BigGo also points to a late-2023 to January-2024 restructuring in which the operating
    entity was pulled out of Today's Headlines and re-held by Xiamen Dongchezu Technology Co., Ltd. with 100% ownership. That move supports the view that Dongchedi is now a distinct corporate asset even if ByteDance still anchors distribution and strategic context.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  tableRefs:
  - TO001
