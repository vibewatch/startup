chapter:
  number: 2
  title: Market Analysis
  summary: Dongchedi operates inside a very large Chinese auto-demand and digital-distribution market, but its realistic addressable revenue pool is much narrower than total auto sales because value sits in advertising, lead generation, transactions, dealer tools, and adjacent services. Public market, advertising, and NEV adoption data imply a sizeable but competitive market with strong structural tailwinds and clear trust, margin, and channel-substitution constraints.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: 'The relevant market for Dongchedi is not the entire Chinese automotive industry and not the entire Chinese internet advertising market. It is the digital layer that influences car discovery, consideration, dealer lead generation, online configuration, transactions, and monetizable post-click services such as financing referrals or used-car workflows. That distinction matters because China sold tens of millions of vehicles in 2024, but Dongchedi does not capture manufacturing revenue or dealer gross profit on those units. Instead, it competes for the marketing, lead, conversion, and transaction-service budgets that sit around auto demand. Public descriptions of Dongchedi and Autohome converge on a similar monetization stack: OEM brand marketing, dealer subscriptions or lead-generation tools, transaction facilitation, data products, and other value-added services. The practical substitutes are therefore broader than legacy auto portals. They include Autohome and Bitauto, Douyin-native
    auto discovery and live commerce, OEM direct-to-consumer e-commerce and agency-model experiences, and dealer offline channels. Market definition is the first analytical filter because it prevents overclaiming TAM from total vehicle sales while still acknowledging that a vertical platform can monetize several layers of the car-buying journey.'
