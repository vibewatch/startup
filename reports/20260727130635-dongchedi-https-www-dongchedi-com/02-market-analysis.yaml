  title: Market definition table
  columns:
  - Layer
  - Included or excluded
  - What Dongchedi can monetize
  - Main substitutes
  - Why it matters
  rows:
  - - Auto demand and research
    - Included
    - Audience attention, content, comparisons, test content, and purchase intent signals
    - Autohome, Bitauto, Douyin auto content, OEM sites
    - This is Dongchedi's top-of-funnel traffic pool
  - - Dealer lead generation and subscriptions
    - Included
    - Lead flow, dealer tools, CPS / conversion products, merchant services
    - Autohome dealer services, OEM CRM, offline dealership sales teams
    - Dealer budgets are closer to transaction ROI than brand budgets
  - - Transaction enablement
    - Included
    - Live sales, online reservation, trade-in, used-car, finance or referral services
    - OEM direct sales, agency stores, fintech partners
    - This layer determines whether Dongchedi can monetize beyond advertising
  - - Total vehicle manufacturing revenue
    - Excluded
    - None directly
    - OEMs and dealers
    - Counting full vehicle GMV would overstate Dongchedi's TAM
  - - Broad internet advertising market
    - Adjacent
    - Only the auto-relevant slice is realistically addressable
    - Douyin, Taobao, WeChat, RED, Kuaishou and broader media mix
    - Ad-market context matters, but Dongchedi cannot win every digital ad yuan
  notes: Included/excluded boundaries are analytical choices built from platform business-model evidence rather than from a single market-report taxonomy.
