- id: growth-drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: The growth case for Dongchedi's market is rooted in structural digitization of Chinese auto demand. NEV adoption continues to rise quickly, with H1 2025 passenger NEV sales up 33% and penetration reaching 50.1%. Trade-in subsidies, online purchase readiness, growing comfort with smart features, and OEM demand for faster launch cycles all support the need for data-rich digital platforms. At the same time, the constraint set is real. JD Power described compressed industry profitability and brand exits; McKinsey argues that competition is shifting from price to innovation, but that still implies elevated spending pressure and product churn; China Skinny reported sharp declines in automotive ad spending in 2024; and BearingPoint showed that nearly half of OEMs now allow customized online purchase, which reduces differentiation for basic listing or information services. Dongchedi therefore benefits from market digitization, but not in a straight line. It must convert creator density,
    testing credibility, and ByteDance traffic access into higher-yield dealer and OEM monetization while avoiding the trust problems and channel substitution risks that can make vertical platforms look interchangeable.
