- id: sizing-lenses
  title: TAM, SAM, and public-comp sizing lenses
  body: 'Multiple sizing lenses are needed because no reviewed source publishes a clean, authoritative "China online auto-platform TAM" number. The broad demand backdrop is undeniable: China sold 31.44 million vehicles in 2024, including 12.866 million new-energy vehicles at a 40.9% wholesale share, while passenger-car retail penetration was even higher in some lenses. Those demand pools, however, are still not platform revenue pools. The better anchor for monetizable scale is a hybrid of public comparables and adjacent market statistics. Autohome, the closest public comp, generated RMB 7.04 billion of revenue in 2024 even while its media segment declined, which suggests a mature vertical platform can monetize at multi-billion-renminbi scale without owning vehicle inventory. China''s internet advertising market was RMB 359.85 billion in H1 2025, but only a fraction of that is addressable to auto, and only a fraction of auto spend is efficiently reachable by a specialist platform. That is
    why this chapter frames TAM, SAM, and Dongchedi''s probable current SOM as inference ranges rather than precise facts. The ranges are still useful because they show a market large enough to support several scaled players, but not so large that traffic alone guarantees attractive economics.'
