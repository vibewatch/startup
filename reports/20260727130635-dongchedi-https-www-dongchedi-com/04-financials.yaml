- id: section-3
  title: Capital adequacy, financing dependency, and verdict
  body: 'Capital adequacy looks solid for near-term operation but still linked to future financing choices. The 2024 RMB 5.8 billion round is large enough to fund several years of development under many burn scenarios, yet public evidence does not disclose cash on hand, debt, or operating burn, so runway remains an estimate. IPO reporting matters because it implies Dongchedi may want public equity not only for balance-sheet comfort but also for liquidity, valuation discovery, and heavier AI or service investment. The conflict between “up to $600 million” in English-language reporting and RMB 5.8 billion in Chinese reporting is also financially relevant, because investors should anchor on the RMB figure and treat translated U.S.-dollar shorthand with caution. The adverse read-through from Autohome’s 2025 revenue decline and from China’s intensely competitive auto market is straightforward: Dongchedi can likely fund growth, but revenue quality will depend on measurable conversion gains, not
    on traffic growth alone. Public data support a financeable company, not a completed public-market underwrite. ByteDance affiliation also adds a non-zero geopolitical and policy overlay that could affect how public investors interpret governance and listing risk, even if Dongchedi itself is an automotive platform. That does not negate the capital story, but it does argue for a valuation range rather than a point estimate. That caution is central to the chapter verdict.'
