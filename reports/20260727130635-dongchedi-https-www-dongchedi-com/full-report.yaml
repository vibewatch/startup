      - number: '7.3'
        title: Operating and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Dongchedi also carries meaningful operational risk because its value proposition depends on being a
              trusted automotive authority while competing in a volatile advertising funnel. China’s vehicle market is
              still large and growing, especially in NEVs, but the same evidence base shows persistent competitive
              intensity, tariff and geopolitical stress, and continuing pressure on weaker brands. That context makes
              advertising budgets more cyclical, not less. Against that backdrop, the ADAS controversy matters because
              it shows how quickly Dongchedi’s editorial and testing layer can become a reputational and regulatory
              issue. The company also appears exposed to partner and platform dependencies. ByteDance association still
              matters for discovery and brand framing, while OEMs, dealers, and the broader China auto cycle shape
              monetization quality. Autohome’s revenue decline is not just competitor weakness; it is also a warning
              that category leaders can lose revenue even at scale. The result is a business where external dependencies
              can raise acquisition costs, reduce advertiser demand, or compress margins before management has much time
              to react.
