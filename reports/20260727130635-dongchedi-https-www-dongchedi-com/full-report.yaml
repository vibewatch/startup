      - number: '4.2'
        title: Unit economics, cost structure, and margin path
        blocks:
          - type: paragraph
            body: >-
              The unit-economics story is directionally attractive but incomplete. Dealer subscriptions and high-intent
              lead-routing tools should be the highest-quality revenue streams because they can recur and tie directly
              to conversion. Brand advertising is probably the largest stream today, but it is also the most cyclical
              because OEM launch calendars, dealer budgets, and macro sentiment can move quickly. The addition of AI
              selection, search-driven comparison, pricing, and transaction-service flows suggests Dongchedi is trying
              to move from media attention toward monetizable intent. That could improve contribution economics over
              time, yet it also raises cost questions around model training, data operations, sales coverage, and
              possibly offline or service-layer experiments. Unlike a pure SaaS company, Dongchedi likely blends
              software-like and marketplace-like costs. Public evidence does not disclose gross margin, CAC payback,
              NRR, or GMV, so the most defensible read is that margin path is improving in theory but not yet provable
              from public evidence alone. That missing visibility also means investors cannot cleanly separate good
              growth from expensive growth. A higher mix of dealer subscriptions and conversion-linked tools would
              improve the story materially, but public sources still do not disclose the actual mix or contribution
              margin by stream.
