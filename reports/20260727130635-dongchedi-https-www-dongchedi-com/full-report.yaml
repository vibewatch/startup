      - number: '2.5'
        title: Contradictory lenses, export effects, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Two kinds of contradictions run through this market. The first is statistical rather than substantive:
              some sources use wholesale NEV sales and total vehicle output, while others use passenger-car retail
              figures, so penetration rates that look inconsistent are often measuring different denominators. The
              second contradiction is strategic. Market indicators clearly point to continuing demand for digital auto
              channels, but the same data also show why pure ad-driven models are vulnerable. Mobile ad concentration
              benefits giants like Douyin, and OEM direct online capability is improving. Public-comp revenue still
              proves that large profit pools exist, yet those pools are not automatically expanding because advertiser
              mix, price wars, and shifting budget ownership can compress them. That is why the chapter deliberately
              presents TAM/SAM/SOM as a range framework, not as a single headline number. The practical unresolved
              questions are Dongchedi-specific: exact revenue, segment mix, dealer retention, OEM concentration, and
              take-rate by transaction product. Until those are disclosed, the market can be sized convincingly enough
              for investment debate, but not precisely enough for underwritten valuation work.
            claimRefs:
