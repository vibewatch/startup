      - number: '8.3'
        title: Comparable set and public-market readthrough
        blocks:
          - type: paragraph
            body: >-
              Autohome is the most important pricing anchor because it is a large, China-based online auto-information
              platform with public financials, public multiples, and a recent record of revenue decline. That single
              fact keeps Dongchedi from being valued as if it were a generic high-growth consumer internet asset.
              CarGurus and Cars Commerce broaden the lens by showing what dealer monetization, marketplace traffic, and
              adjacent software can look like in more mature public markets, but they are not clean one-to-one
              analogues. CarGurus benefits from stronger U.S. dealer economics and more transparent disclosures. Cars
              Commerce has a business mix tilted further toward software and dealer tools than Dongchedi’s public
              narrative suggests. Private China comparables are weaker still because Bitauto or Yiche is no longer a
              fresh public reference and Chehaoduo data is sparse. As a result, the comparable set supports caution more
              than confidence. It tells us Dongchedi can plausibly deserve some premium to Autohome if growth is
              materially better, but not enough to justify a heroic multiple absent clearer evidence.
