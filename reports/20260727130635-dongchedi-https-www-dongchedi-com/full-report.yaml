  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and audience scale
        blocks:
          - type: paragraph
            body: >-
              Dongchedi has to be segmented on two axes at once: end users on the consumer side and monetized commercial
              participants on the dealer/OEM side. On the consumer side, the platform is not just a generic
              audience-media property. Public 2024 and 2025 sources point to tens of millions of monthly users, more
              than 10 million daily actives, and unusually high purchase intent, with six in ten deep car shoppers using
              the app and most shoppers arriving in-store with a model already in mind. Demographically, the fastest
              expansion is in younger and female users, which helps explain why AI-assisted and conversational selection
              features matter commercially. On the commercial side, Dongchedi operates against a wide dealer and brand
              network rather than a narrow named-enterprise list. That means its customer base is diversified by count,
              but the public record is still much stronger on reach and traffic than on paying-account economics. This
              matters for diligence because Dongchedi can add users at one layer while monetization strength changes at
              another. Audience size alone does not prove dealer economics, but it does explain why the platform remains
              strategically relevant to merchants, OEM campaigns, and policy-linked auto-consumption programs. Scale
              clearly matters here. Very clearly.
