      - number: '1.2'
        title: Leadership visibility and governance limits
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is materially thinner than Dongchedi's user and funding footprint would
              suggest. Open sources consistently show the business was incubated inside ByteDance rather than founded by
              a well-documented entrepreneur, which means the company-overview chapter should treat named founder
              history as unresolved rather than invented. Baidu Baike lists He Jian as CEO and names several functional
              executives, but the January 2024 independence stories frame governance more indirectly by saying the legal
              representative would be the business's strategy head. That combination is enough to map a skeletal
              operating leadership bench, but not enough to claim a transparent board, committee structure, or
              investor-rights framework. The practical implication is key-person dependence: Dongchedi relies on a small
              visible management layer, on ByteDance-origin product distribution, and on capital-market preparation work
              that appears to have been driven by a limited set of executives. The available evidence therefore supports
              a real operating organization, but not a governance profile that outside investors can yet diligence to
              public-company depth.
