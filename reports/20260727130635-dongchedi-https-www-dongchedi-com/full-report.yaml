  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Dongchedi's public stack layers consumer surfaces, merchant tools, domain AI, and data infrastructure rather than
      separating media from commerce.
    data:
      layers:
        - label: B2C App Surfaces
          detail: Buyer-facing experiences are where content, selection, pricing, and community merge.
          items:
            - label: Content feed
              detail: News, short video, reviews, and livestreams
            - label: Selection tools
              detail: AI car selection, parameter comparison, owner reviews, and Dongchefen
            - label: Transaction helpers
              detail: Trade-in, subsidy, dealer contact, and used-car flows
        - label: B2B Tools
          detail: Merchant products convert attention into accountable lead handling and sales operations.
          items:
            - label: 卖车通
              detail: Merchant onboarding and lead operations
            - label: 懂车云店
              detail: Dual-end store and content operations
            - label: CPS and Buyerhunter
              detail: Performance-linked acquisition and audience targeting
        - label: Platform
          detail: Dongchedi's domain AI and content graph sit in the middle of both consumer and merchant surfaces.
          items:
            - label: Vehicle LLM / multimodal VLM
              detail: Domain AI for long-tail selection and multimodal understanding
            - label: Smart Engine
              detail: Knowledge graph, reinforcement, and expert tuning
            - label: Testing and ratings
              detail: Real-world tests, owner reviews, and Dongchefen trust signals
        - label: Infrastructure
          detail: Data supply, device permissions, and ByteDance distribution power the outer layers.
          items:
            - label: Structured databases
              detail: 50M+ records, 76k+ models, 4k+ tested vehicles
            - label: Mobile distribution
              detail: iOS and Android app channels
            - label: ByteDance traffic pool
              detail: Douyin/Toutiao/Xigua integration and distribution scale
    approximationNotes: >-
      This is a conceptual architecture synthesized from public disclosures; Dongchedi does not publish an internal
      systems diagram.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE028
      - CE032
      - CE033
