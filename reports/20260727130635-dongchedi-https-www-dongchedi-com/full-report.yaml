      - number: '2.3'
        title: Buyer map, budget ownership, and monetization path
        blocks:
          - type: paragraph
            body: >-
              Dongchedi serves a multi-sided market, so the user is not always the buyer and the buyer is not always the
              payer. End consumers use the platform for research, testing content, comparison, rankings, creator advice,
              and purchase assistance. OEMs and brand marketers buy attention, launches, regional activation, and
              measurable lead or transaction outcomes. Dealer groups and individual dealerships buy lead flow,
              conversion tools, pricing visibility, and increasingly operating leverage in a market where foot traffic
              is not sufficient on its own. Adjacent payers such as finance, insurance, and used-car partners can
              monetize later stages of the funnel once shoppers signal intent. This distinction is important for
              diligence because budget ownership affects resilience. OEM brand budgets are cyclical and sensitive to
              margin pressure; dealer budgets are more directly tied to sell-through and can be more ROI-driven;
              consumer willingness to pay is usually indirect. The strongest platforms therefore win by turning audience
              reach into merchant economics rather than by maximizing traffic alone. Autohome's mix shift away from pure
              media revenue is instructive here and suggests Dongchedi's long-term opportunity depends on deeper
              transaction and dealer tooling, not just content viewership.
