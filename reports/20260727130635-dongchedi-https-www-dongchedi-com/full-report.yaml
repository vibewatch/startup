            body: >-
              The most important limitation in the customer record is durability. The app-store surface shows
              satisfaction, and owner reviews, livestreaming, and community tools all suggest repeat consumer usage
              rather than one-off article browsing. The merchant side also has a plausible land-and-expand logic because
              content discovery, AI selection, dealer routing, subsidy support, and CPS operations can reinforce one
              another. But that logic is inferential, not closed. Public sources disclose no NRR, GRR, churn, contract
              length, repeat-campaign rates, or top-customer concentration. Trust risk also matters. AsiaICT explicitly
              references user complaints and doubts about Dongchedi's professionalism and fairness, while 36Kr and other
              outlets argue that headline-grabbing test programs can blur the line between consumer education and
              perceived ranking. For underwriting, the conclusion is balanced: Dongchedi clearly has scale and
              commercial embedment, yet customer quality still requires direct diligence on merchant renewals, cohort
              retention, concentration, and how platform trust is protected when editorial products influence buying
              behavior. The practical implication is that a refresh of this chapter should focus less on finding one
              more logo and more on obtaining cohort evidence: merchant renewal rates, repeat campaign spending,
              complaint-resolution velocity, and whether trust controversies measurably impair conversion or retention.
              That is the key open diligence task.
