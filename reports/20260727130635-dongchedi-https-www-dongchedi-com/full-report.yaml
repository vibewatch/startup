      - number: '7.4'
        title: Execution, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Execution risk is amplified by limited public visibility into leadership depth, internal controls, and the
              exact contingency plans behind the expected listing. Public sources identify Ma Jun, but they do not yet
              provide enough detail for investors to judge succession, independence from ByteDance, or management depth
              across content governance, commercialization, and compliance. That does not make the company uninvestable;
              it does mean the burden shifts to diligence. The most credible mitigations would be evidence of
              diversified traffic, diversified revenue, a transparent content-methodology regime, and a documented
              data-governance stack aligned with China’s privacy and algorithm rules. Until that evidence is produced, a
              prudent investor should watch for objective thesis-break signals: IPO slippage, major regulatory review,
              loss of ByteDance support, a renewed content-credibility crisis, or clear advertiser-budget contraction.
              Dongchedi’s risk profile is manageable only if management can prove that the company has become
              operationally independent faster than the market narrative around ByteDance implies.
