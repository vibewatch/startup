      - number: '3.2'
        title: Capability, GTM, and monetization comparison
        blocks:
          - type: paragraph
            body: >-
              The sharpest comparison is between Dongchedi’s ByteDance-native discovery model and Autohome’s more
              traditional vertical-media and dealer-services stack. Dongchedi’s public posture is video-first,
              search-heavy, and increasingly AI-assisted, which should help it capture younger intent earlier in the
              purchase journey. Autohome still anchors the category on disclosed revenue, earnings, and traffic scale,
              and it is not standing still: its public materials show active AI product work and continued offline
              retail investment. That matters because Dongchedi’s advantage is stronger at the top of funnel than at the
              closed-sale layer, where dealers and OEMs can allocate budgets across several channels. Online shopping
              studies, automotive marketing coverage, and app-comparison pieces all point to the same conclusion:
              platforms that combine content, search, lead routing, and service hooks have the best chance of defending
              monetization, but no platform appears to have exclusive ownership of buyer attention or dealer demand. For
              underwriting, that means the platform with the most believable path from research intent to measurable
              dealer value will win budget share. Video reach, search depth, and AI novelty matter, but only insofar as
              they improve closed-loop lead quality and advertiser ROI.
