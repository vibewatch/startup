      - number: '8.4'
        title: Exit readiness, diligence asks, and kill triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is credible but not fully proven. Exploratory reporting and market context indicate a
              workable Hong Kong path, yet the same sources also show why investors should not outsource diligence to
              the listing window itself. Confidence remains low-to-medium because crucial variables are still private:
              the real revenue run-rate, monetization by user cohort, customer concentration, financing preferences, and
              the practical degree of ByteDance dependence. These are not cosmetic omissions. They directly control
              whether the private-round valuation compounds, flat-lines, or proves too optimistic. The final diligence
              list is therefore straightforward. Investors need management-account evidence, cap-table economics,
              channel attribution, and advertiser-retention data. They also need immediate reconfirmation of
              underwriters and timetable because Hong Kong conditions can change quickly. Until those asks are
              satisfied, the correct posture is watchful and price-sensitive. Dongchedi may still become a strong IPO
              candidate; the current public record simply does not support pretending that the hard underwriting
              questions are already answered.
            claimRefs:
