      - number: '1.3'
        title: Ownership transition, funding, and IPO path
        blocks:
          - type: paragraph
            body: >-
              The clearest step-change in Dongchedi's profile came after it was structurally separated from ByteDance.
              EqualOcean and other follow-on reports linked the new wholly owned subsidiary structure to external
              fundraising and eventual independent accounting. By mid-2024, multiple reports converged on a first
              outside round of roughly USD 600 million, while Chinese registry-based reporting translated that event
              into RMB 5.8 billion with a post-money valuation around RMB 21.7 billion. Yahoo Finance's
              Bloomberg-sourced report is the strongest corroboration on the investor set and valuation range, naming
              General Atlantic, HongShan, KKR, and Gaorong. 2026 reporting then shifted from funding confirmation to
              public-market positioning: several outlets said Dongchedi was exploring a Hong Kong IPO that could target
              roughly USD 1.0 billion to USD 1.5 billion. None of those IPO stories included a formal filing or
              on-record confirmation, so the right framing is that Dongchedi appears financially mature enough for
              listing preparation, but still pre-filing and rumor-sensitive. That nuance matters because the fundraising
              and IPO narrative is credible, yet not final.
