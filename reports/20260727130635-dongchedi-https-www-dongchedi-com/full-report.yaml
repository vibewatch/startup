            title: The real competition is for monetization depth, not just traffic share
            body: >-
              China's auto demand and NEV adoption are large enough to support several scaled digital platforms, but
              long-run value will accrue to players that convert audience attention into dealer, OEM, and
              service-partner economics rather than rely on cyclical media budgets alone.
