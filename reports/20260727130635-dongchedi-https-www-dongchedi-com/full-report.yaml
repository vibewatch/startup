        - One session can move from content into AI selection, dealer lead, subsidy help, and owner community
        - Clear in app listings, AI launch coverage, and dealer conference behavior metrics
        - 'Positive: the product has multiple opportunities to deepen monetization per user'
        - Request conversion ladders from content impression to lead, quote, deposit, and completed transaction
      - - Dealer-tool dependence
        - Merchant monetization is central to turning audience scale into revenue
        - CPS model, 卖车通 network, and dealer case studies are explicit
        - Positive if lead quality is durable; risky if merchants can churn quickly
        - Request renewal, churn, and merchant ROI by acquisition cohort
      - - Named-account opacity
        - Public evidence is broad but not rich on top accounts or spend concentration
        - Named proof skews to dealer groups and cohort programs rather than full revenue disclosure
        - 'Risk: revenue concentration could hide behind a diversified public narrative'
        - Ask for top-10 merchant / OEM concentration and contract terms
      - - Trust and fairness controversy
        - Complaints or perceived test bias can weaken both consumer and merchant confidence
        - AsiaICT and 36Kr document complaints and fairness debate
        - 'Risk: platform trust could erode conversion or renewal if controversies compound'
        - Request complaint-resolution metrics, merchant dispute rates, and editorial-governance controls
      - - Policy-linked subsidy services
        - Government-trade-in services can drive traffic and transactions beyond pure advertising demand
        - 2024 and 2026 subsidy-platform references are explicit
        - 'Opportunity: policy funnels can expand user acquisition and close-the-loop services'
        - Measure downstream monetization from subsidy applicants versus ordinary shoppers
    notes: >-
      The expansion/risk table focuses on structural drivers rather than point estimates because public concentration
      data is absent.
