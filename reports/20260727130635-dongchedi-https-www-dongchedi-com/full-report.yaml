  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and public traction proxies
        blocks:
          - type: paragraph
            body: >-
              Dongchedi’s revenue model is not formally disclosed, but its public operating footprint strongly suggests
              a hybrid of OEM advertising, dealer subscriptions, paid lead or transaction services, and data- or
              tooling-driven upsells. The company’s large dealer and brand network, its high mobile DAU, and its
              positioning as a one-stop information, transaction, and service platform all point in that direction. The
              2024 financing round also matters here because it established the company as something more ambitious than
              a traffic property: it raised enough capital to support product expansion, AI tooling, and a possible
              public-listing path. The best outside proxy remains Autohome. Its 2024 revenue and earnings prove that a
              Chinese automotive platform can be materially profitable at scale, while its later declines warn that
              scale does not eliminate cyclicality. For diligence, Dongchedi therefore looks commercially real, but
              public evidence still supports only a bounded range view rather than a disclosed revenue bridge. The core
              financial question is therefore not whether Dongchedi can generate revenue, but whether enough of that
              revenue is recurring, measurable, and defensible against platform and market cyclicality. Public evidence
              answers the first part convincingly and the second only partially.
