            before talking to a dealer.
        - label: AI narrowing
          description: AI car selection converts vague intent into a short list, often before a user visits a store.
        - label: Dealer or campaign action
          description: User enters dealer lead flow, livestream commerce, or an OEM / subsidy campaign supported by the platform.
        - label: Transaction support
          description: Trade-in, subsidy application, and used-car valuation services help move a decision toward execution.
        - label: Post-purchase loop
          description: >-
            Owner reviews, prices, community participation, and livestream or content re-use create repeat engagement
            after the first purchase decision.
