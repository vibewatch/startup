      - number: '1.4'
        title: Operating scale and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Dongchedi's operating scale is easier to observe than its financial output. Funding coverage cited
              QuestMobile at about 35.7 million monthly active users in mid-2024, while multiple later sources described
              mobile daily active users above 10 million by 2025. BigGo and Baidu Baike also converge on a large creator
              and commercial footprint: roughly 7.5 million automotive content creators, more than 500 million
              automotive-interest users across the broader ecosystem, over 30,000 dealerships served, and coverage
              spanning 110-plus car brands. These metrics are directionally important because they show why Dongchedi
              can monetize more than simple display advertising. The business model described across company summaries
              and market reporting includes brand advertising, CPS or transaction-linked monetization, dealer tools,
              transaction service fees, and other value-added services. In other words, scale is not just consumer
              reach; it is also marketplace density. What remains missing is disclosed revenue, gross margin, or
              headcount, so maturity can be observed through platform breadth and investor appetite rather than through
              published financial statements.
