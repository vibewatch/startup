      - number: '3.3'
        title: Moat durability, switching costs, and risk register
        blocks:
          - type: paragraph
            body: >-
              Dongchedi’s best-supported moat is not a secret feature monopoly; it is a distribution-and-data loop that
              ties ByteDance-style recommendation, large automotive data sets, active in-app search, and AI-assisted
              selection into one consumer journey. That is meaningful, but it is not equivalent to hard lock-in.
              Consumers can still compare across multiple apps, dealers can multi-home budgets, and automakers can push
              leads through brand-owned channels. Autohome’s public revenue decline is also a useful warning signal:
              incumbent traffic can remain large while monetization weakens under competitive pressure. In practice, the
              durability question is whether Dongchedi can convert its younger user mix and faster content format into
              better paid lead quality than legacy peers, not whether it can eliminate substitutes. The current evidence
              supports a favorable but not unassailable view: Dongchedi appears better positioned than legacy peers for
              algorithmic discovery and AI-guided shopping, yet public evidence is still thin on dealer conversion,
              repeat monetization, and the exact economics of its offline or service experiments. That is why dealer
              retention, conversion, and cohort monetization are the missing metrics that would most improve confidence.
              Until those numbers are disclosed, Dongchedi should be treated as competitively advantaged but not yet
              proven to possess a hard economic moat. This keeps the competitive verdict favorable but still
              disciplined. More disclosure on dealer cohorts would sharpen this conclusion materially. Further.
            claimRefs:
