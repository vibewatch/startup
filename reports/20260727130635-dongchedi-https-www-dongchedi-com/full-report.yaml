  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked overview
        blocks:
          - type: paragraph
            body: >-
              Dongchedi’s risk stack is dominated by factors that can change public-market valuation faster than they
              change day-to-day operations. The first is parent-company spillover. Dongchedi was spun out operationally,
              but the market still frames it as ByteDance-backed, so investors can map TikTok-style geopolitical
              scrutiny onto the asset even if Dongchedi itself is not the direct target of U.S. action. The second is
              business-model concentration. Online auto-information platforms monetize a stressed ecosystem of OEM and
              dealer marketing budgets, and public market evidence from category peers shows that scale does not fully
              protect revenue when auto brands are discounting aggressively. The third is content credibility. The 2025
              ADAS testing dispute shows that Dongchedi can create self-inflicted risk when editorial or testing formats
              are perceived as safety-relevant, insufficiently disclosed, or commercially contentious. The practical
              implication is that downside transmission is multi-step: parent reputation, content trust, traffic
              efficiency, and ad-budget softness can all compound, leaving residual exposure high even if management
              executes competently.
