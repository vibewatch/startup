  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and module map
        blocks:
          - type: paragraph
            body: >-
              Dongchedi's product is easiest to understand as a buyer journey rather than as a static media site. A
              consumer can begin with short video or article discovery, move into deeper parameter comparison and owner
              reviews, narrow choices through AI-assisted selection, contact dealers or enter a livestream, and then
              continue into used-car trade-in, subsidy application, or post-purchase owner-community usage. The
              app-store descriptions and 2025 AI-launch coverage show that content, comparison, pricing, and transaction
              support are not separate silos; they are stitched together inside one mobile-first workflow. That matters
              because the platform is monetized not only by attention but also by high-intent movement toward quote
              requests, dealer leads, live-commerce interaction, and platform-assisted services. The module matrix below
              therefore treats AI, content, ratings, pricing, live commerce, and used-car services as connected workflow
              assets, not independent SKUs. In diligence terms, that means Dongchedi should be assessed less like a
              publisher and more like a workflow orchestrator whose product quality depends on how smoothly users can
              move from inspiration to shortlist to dealer action without losing trust in prices, reviews, or
              recommendations.
