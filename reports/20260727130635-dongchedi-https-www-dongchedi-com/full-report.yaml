            body: >-
              Public evidence is unusually rich on the observable outer layers of Dongchedi's stack. The July 2025 AI
              panorama lays out a data layer, system layer, model layer, and application layer, supported by proprietary
              vehicle data, professional public data, and user-authorized data. The same disclosures describe an
              automotive-domain LLM, a multimodal VLM, a Smart Engine that includes a knowledge graph and reinforcement
              training, and a large real-world testing corpus that can feed product judgment. Around that AI core, the
              dealer-facing operating layer matters just as much: 卖车通, 懂车云店, CPS settlement logic, and ByteDance traffic
              distribution are what turn the platform from a content app into a commercial operating system. The
              architecture therefore has two deployment surfaces at once: B2C mobile usage on iOS and Android, and B2B
              merchant tooling riding the same traffic and data spine. The roadmap table shows why this matters
              strategically: Dongchedi has been moving from feature accretion toward a deeper AI-native commerce loop.
              It also means the merchant layer is not a side business. If dealer tools, distribution logic, or CPS
              settlement mechanics fail, the consumer AI layer may still be interesting, but the commercial operating
              model would be materially weaker because lead routing and transaction follow-through are part of the
