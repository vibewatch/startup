      - number: '5.3'
        title: Differentiation, safety journalism, and trust controls
        blocks:
          - type: paragraph
            body: >-
              Dongchedi's clearest differentiation is the combination of ByteDance-style distribution, video-native
              engagement, and a proprietary data asset that spans structured vehicle information, owner commentary, and
              real-world testing. That is a different asset mix from a text-heavier auto-portal model. But the same
              willingness to operationalize testing also creates trust risk. Winter tests and the 2025 ADAS program
              generated real debate over methodological rigor, perceived ranking effects, and commercialization
              incentives. The public record does not show a broken platform; it shows a platform whose influence is now
              large enough that its test design can affect brand perception and customer confidence. On the
              consumer-privacy side, the Apple and Tencent disclosures show a data-rich mobile app with broad
              permissions and linked-data categories, which is normal for a feature-heavy commerce app but still
              important for diligence. The chapter conclusion is therefore positive but conditional: the product system
              is broad and technically ambitious, yet its trust layer needs direct diligence on certification scope,
              merchant-tool reliability, and how editorial independence is protected when testing outcomes move markets.
              That trust question is strategically important because Dongchedi increasingly acts as an arbiter of
              product quality in China's car market. The more consumers, merchants, and brands treat its tests and
              recommendation tools as decision infrastructure, the more governance quality matters alongside raw traffic
              and model sophistication. That risk is real.
