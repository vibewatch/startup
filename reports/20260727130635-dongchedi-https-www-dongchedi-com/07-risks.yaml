    "number": 7,
    "title": "Risks",
    "summary": "Dongchedi’s risk profile is high because ByteDance spillover, China platform regulation, content-credibility disputes, and auto-ad cyclicality can cascade into IPO execution and valuation. The company may still scale, but public evidence supports a material risk discount until management proves traffic, governance, and monetization independence."
  },
  "sections": [
    {
      "id": "risk-ranked-overview",
      "title": "Severity-ranked overview",
      "body": "Dongchedi’s risk stack is dominated by factors that can change public-market valuation faster than they change day-to-day operations. The first is parent-company spillover. Dongchedi was spun out operationally, but the market still frames it as ByteDance-backed, so investors can map TikTok-style geopolitical scrutiny onto the asset even if Dongchedi itself is not the direct target of U.S. action. The second is business-model concentration. Online auto-information platforms monetize a stressed ecosystem of OEM and dealer marketing budgets, and public market evidence from category peers shows that scale does not fully protect revenue when auto brands are discounting aggressively. The third is content credibility. The 2025 ADAS testing dispute shows that Dongchedi can create self-inflicted risk when editorial or testing formats are perceived as safety-relevant, insufficiently disclosed, or commercially contentious. The practical implication is that downside transmission is multi-step: parent reputation, content trust, traffic efficiency, and ad-budget softness can all compound, leaving residual exposure high even if management executes competently.",
