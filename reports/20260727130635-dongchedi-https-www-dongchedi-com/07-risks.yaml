    {
      "id": "regulatory-and-geopolitical",
      "title": "Regulatory and geopolitical risk",
      "body": "The most severe non-operating risks come from overlapping legal regimes rather than from a single rule. U.S. action against ByteDance demonstrates that national-security scrutiny can be framed around ownership, data access, and algorithmic control, all of which matter to an investor evaluating an affiliated listing. Inside China, the binding rule set is different but equally meaningful: the National Intelligence Law establishes cooperation duties, while algorithm recommendation, cybersecurity, and personal-information rules expand the compliance surface for any recommendation-led content marketplace. Dongchedi is especially exposed because ranking, personalization, search, and safety-adjacent media all sit close to areas regulators can describe as affecting public interest. Public evidence is strong enough to rank the legal exposures, but still thin on Dongchedi-specific filings, audits, and active regulator dialogue. That asymmetry matters because investors can see the rules clearly while remaining unable to fully observe the company-level control environment. Mitigation maturity therefore appears moderate at best, and residual exposure remains elevated ahead of any IPO process.",
      "claimRefs": [
        "CR004",
