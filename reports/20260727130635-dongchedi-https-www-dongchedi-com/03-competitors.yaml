chapter:
  number: 3
  title: Competitors
  summary: Dongchedi competes most directly with Autohome for Chinese auto-research traffic and dealer monetization, while Yiche remains a legacy peer and Guazi represents a transaction-heavy adjacent. The platform’s ByteDance distribution, younger audience mix, and new AI car-selection workflow are real differentiators, but public evidence still suggests moderate switching costs, high multi-homing, and an incumbent set that can answer with AI, offline retail, and disclosed monetization scale.
sections:
- id: section-1
  title: Landscape structure and direct peer set
  body: 'Dongchedi does not face a single homogeneous rival. The direct peer is Autohome, the disclosed public benchmark for traffic, dealer monetization, and automotive-media profitability in China. Yiche still matters as a legacy app comparator in Chinese consumer coverage, while Guazi/Chehaoduo is better treated as an adjacent used-car transaction specialist than as a one-for-one substitute for new-car discovery. The broader substitute set also includes OEM-owned lead channels and dealer-operated private traffic, because the final test-drive lead can be captured outside a vertical media app. Public reporting also shows that Dongchedi is no longer just a ByteDance internal traffic experiment: it was carved into an independently operated company, raised a large Series A, and is already being discussed as a Hong Kong IPO candidate. That combination means competition should be read as a fight over distribution power, lead quality, and eventual monetization depth rather than over app downloads
    alone. Another practical consequence is that Dongchedi should be benchmarked against both content peers and transaction substitutes. A buyer who starts with a short-video review can still finish inside a dealer CRM, a brand mini-program, or a used-car marketplace, so the relevant field is wider than the classic auto-media label suggests.'
