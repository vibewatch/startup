    - Automakers can collect leads directly outside vertical media apps
    - In-market buyers already leaning to a brand
    - Mini-programs, brand apps, brand media buys
    - Substitute at the bottom of funnel
  - - Dealer-owned private traffic
    - Dealers can route leads through their own CRM and messaging stacks
    - High-intent local shoppers
    - Private traffic, direct outreach, appointment booking
    - Reduces any single app’s lock on conversion
