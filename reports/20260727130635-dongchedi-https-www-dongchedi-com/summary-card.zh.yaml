summary:
  headline: >
    Dongchedi 在中国汽车内容垂直领域已形成压倒性规模，ByteDance 分发也构成可防守的流量护城河；但财务不透明、 对母公司依赖重、可比公司表现承压，使 $3 billion 私有估值在当前透明度下只能算合理。待定香港
    IPO 是关键催化剂； 要显著提高确定性，还需要披露收入。
