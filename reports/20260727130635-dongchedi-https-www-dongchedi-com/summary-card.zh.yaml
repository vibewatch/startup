  topStrengths:
    - ByteDance 算法和 Douyin/Toutiao 流量池让 Dongchedi 相比独立同行拥有结构性获客优势
    - 35.7 million MAU（2024 年 6 月）和 10M+ DAU 表明产品在中国最大汽车市场真正跑通产品-市场匹配
    - 时点有利：2024 年 NEV 渗透率达到 47% 且仍在扩大，推动新的消费者购车研究需求
    - AI 选车（2025 年 7 月）和 76,000+ 车型数据库做出可防守的内容差异化
    - 30,000+ 经销商和 110+ OEM 合作伙伴形成双边网络效应
  topRisks:
    - ByteDance 监管敞口——PAFACA 及全球对母品牌的审查可能压低 IPO 估值，或迫使架构调整
    - 未披露收入或利润率——无法验证单位经济，难以下高确定性仓位
    - Autohome（最佳上市可比公司）市值 $2.44B 且收入下滑，压住了隐含可比估值底部
    - 严重依赖 ByteDance 生态流量；若 IPO 后 Douyin 推荐减少，CAC 可能大幅上升
    - 中国数据安全和算法监管（PIPL、Cybersecurity Law、Algorithm Recommendation Regulation）增加合规成本和披露风险
  unresolvedGaps:
    - 收入运行率和同比增长率未公开披露
    - 毛利率和经营利润率未知；广告收入与交易佣金 mix 未量化
    - Series A 后股权结构表和优先股堆叠未公开
    - 员工数和烧钱速度不可得；$800M 融资带来的现金跑道未证实
    - ByteDance 在拆分后继续持有 Dongchedi 的股权和治理权未披露
