companyProfile:
  summary: >
    Dongchedi (懂车帝, also known as DCar) is China's leading automotive content and transaction platform.
    Originally incubated as the auto channel of ByteDance's Toutiao news app, it launched as a standalone
    app in August 2017. After years of rapid growth, ByteDance began the formal spin-off process in late 2023,
    with Dongchedi completing independent company registration in January 2024 under Beijing Dongchedi
    Technology Co., Ltd., wholly owned by Xiamen Dongchezu Technology Co., Ltd. In June 2024 the company
    closed a Series A round of RMB 5.8 billion (~$800 million) from HongShan (formerly Sequoia China), KKR,
    General Atlantic, and Gaorong Capital, valuing the platform at approximately $3 billion. As of
    mid-2026, Dongchedi is actively planning a Hong Kong IPO seeking $1.0–1.5 billion, which would make it
    the first ByteDance business unit to list independently.
  foundedDate: "2017-08-01"
  founders:
    - name: "ByteDance commercialization team"
      role: "Corporate incubator"
      background: "Incubated inside ByteDance's Toutiao product; no named external co-founders in public records"
      claimRefs: [CO005]
  foundingLocation: "Beijing, China"
  headquarters: "Beijing, China"
  productSummary: >
    Dongchedi offers automotive content (news, short videos, expert reviews, user community), AI-powered
    car selection (launched July 2025), price comparisons, live-streaming car sales, dealer lead generation,
    trade-in valuation, auto financing referrals, and safety testing journalism. The platform covers 110+
    car brands, 76,000+ car models, and serves 30,000+ authorized dealerships. It leverages ByteDance's
    recommendation algorithm and the Douyin/Toutiao traffic network.
  customerFocus: >
    B2C: prospective car buyers, current owners, and enthusiasts — skewing young (under 30) and including
    a fast-growing female NEV-buyer segment. B2B: 30,000+ dealerships paying subscription or transaction
    fees and 110+ OEM brands buying advertising and data analytics services.
  businessModel: >
    Four revenue streams: (1) OEM/brand advertising (largest), (2) dealer subscription and lead-generation
    fees, (3) transaction service fees (CPS model on vehicle sales), and (4) value-added data analytics.
    Secondary revenue from financial-services referrals (auto loans, insurance). All financials are private.
  stage: "Series A / late private"
  fundingStatus: >
    Series A closed June 2024: RMB 5.8 billion (~$800 million) from HongShan, KKR, General Atlantic, and
    Gaorong Capital at a post-money valuation of RMB 21.7 billion (~$3 billion). IPO process reportedly
    underway as of early 2026, targeting Hong Kong exchange with $1.0–1.5 billion raise.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO009, CO011, CO013, CO018]

summary:
  headline: >
    Dongchedi has dominant scale in China's automotive content vertical and a defensible ByteDance
    distribution moat, but opaque financials, heavy parent dependency, and a challenged comparable
    set make the $3 billion private valuation only fair at current transparency. The pending Hong Kong
    IPO is the key catalyst; materially higher conviction requires revenue disclosure.
