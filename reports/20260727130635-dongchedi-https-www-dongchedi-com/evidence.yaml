evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership disclosure
    missingEvidence: Authoritative current executive roster, legal representative confirmation, and formal founder history.
    whyItMatters: Leadership and founder quality is central to assessing execution risk and key-person dependence.
    diligencePath: Pull a current PRC corporate registry extract and any official leadership page or press kit.
    relatedQuestionRefs:
      - QO016
      - QO017
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance disclosure
    missingEvidence: Board composition, shareholder rights, committee structure, and post-round governance documents.
    whyItMatters: These fields determine how much control outside investors gained and whether IPO preparation is substantive.
    diligencePath: Request cap-table, SHA, and board materials from the company or lead investors.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Revenue, headcount, margin, and office-footprint data for Dongchedi as a standalone entity.
    whyItMatters: Without core operating financials, maturity can only be inferred from traffic, funding, and ecosystem breadth.
    diligencePath: Request management accounts, HR snapshot, and segment revenue splits under NDA.
    relatedQuestionRefs:
      - QO023
      - QO024
  - type: conflicting-data
    severity: minor
    topic: traffic metrics
    missingEvidence: A reconciled traffic bridge across MAU, H1 2023 DAU, Q3 2023 DAU, and 2025 DAU snapshots.
    whyItMatters: Different vendors and time windows can be misread as contradictions when they are actually lens differences.
    diligencePath: Obtain one internal traffic dashboard or a single third-party trend series covering 2023-2025.
    relatedQuestionRefs:
      - QO012
      - QO013
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology
    missingEvidence: >-
      Full company chronology with financing, product, partnership, and regulatory events beyond the visible public
      record.
    whyItMatters: The current milestone table is sufficient for diligence orientation but not for a litigation-grade history.
    diligencePath: Cross-check company newsroom, archived app-store history, and registry changes against the public timeline.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: dongchedi-revenue
    missingEvidence: Standalone Dongchedi revenue, segment mix, gross margin, and merchant retention metrics.
    whyItMatters: Without operating metrics, the SOM estimate remains a range exercise rather than a forecast base case.
    diligencePath: Request management revenue bridge and cohort retention data under NDA.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: market-size-authority
    missingEvidence: A single authoritative market report that directly sizes China's online auto-platform revenue pool.
    whyItMatters: Public sources support direction and range construction but not a fully underwritten TAM figure.
    diligencePath: Commission or obtain a sector market study that isolates online auto media, leadgen, and transaction services.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership-splits
    missingEvidence: Customer-level mix showing OEM, dealer, transaction, and partner revenue contributions.
    whyItMatters: Budget-owner concentration drives resilience and valuation quality.
    diligencePath: Request segment revenue splits and top-customer concentration analysis.
    relatedQuestionRefs:
      - QM013
      - QM023
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: nev-penetration-lenses
    missingEvidence: A reconciled note that bridges wholesale, retail, and passenger-only denominators across NEV sources.
    whyItMatters: Readers can otherwise mistake denominator changes for disagreement about market direction.
    diligencePath: Attach a methodology note to future refreshes showing the source basis for each penetration figure.
    relatedQuestionRefs:
      - QM020
  - type: private-evidence-only
    severity: minor
    topic: pricing-power
    missingEvidence: Evidence on dealer ROI, renewal rates, and transaction take-rates for Dongchedi's merchant products.
    whyItMatters: This is the missing link between traffic scale and monetization durability.
    diligencePath: Request cohort LTV/CAC, renewal, and conversion data by product line.
    relatedQuestionRefs:
      - QM023
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: yiche-current-scale
    missingEvidence: Current MAU, dealer count, and strategic direction for Yiche from primary or high-quality independent sources.
    whyItMatters: >-
      Without current peer-scale disclosure, Yiche can only be treated as a recognized comparator, not a fully
      underwritten direct benchmark.
    diligencePath: Add fresh Yiche official or independent coverage with user and monetization metrics.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: dealer-conversion
    missingEvidence: Dealer-level retention, lead conversion, and wallet-share by channel for Dongchedi and Autohome.
    whyItMatters: >-
      These metrics would determine whether distribution advantage actually becomes durable monetization and switching
      cost.
    diligencePath: Request dealer cohort dashboards or channel attribution exports from management.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
      - TP004
  - type: missing-source
    severity: minor
    topic: offline-service-economics
    missingEvidence: Clear public breakout of offline or service experiments versus core media and lead-generation usage.
    whyItMatters: Without this split, the market may over- or understate how close Dongchedi is to true transaction economics.
    diligencePath: Ask management for offline/service revenue share and ROI by experiment.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Current cash balance, monthly burn, and any debt obligations.
    whyItMatters: Without these items, runway and downside risk remain estimated rather than underwritten.
    diligencePath: Request treasury package, monthly cash waterfall, and debt schedule.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Dealer retention, CAC payback, contribution margin, and GMV or closed-service conversion by cohort.
    whyItMatters: These are the core data needed to validate whether Dongchedi monetizes traffic efficiently and durably.
    diligencePath: Request cohort tables for dealer spend, conversion, and gross profit by channel.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: pricing-take-rate
    missingEvidence: Public price cards, dealer package tiers, or take-rate disclosures for transaction and service flows.
    whyItMatters: Without pricing evidence, investors can describe the model but not confidently size revenue mix or elasticity.
    diligencePath: Collect dealer materials, management commentary, or audited segment pricing disclosures.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
