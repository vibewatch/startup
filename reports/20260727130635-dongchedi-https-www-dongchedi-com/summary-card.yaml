  topStrengths:
    - >-
      ByteDance algorithm and Douyin/Toutiao traffic pool gives Dongchedi a structural user-acquisition advantage vs
      standalone peers
    - 35.7 million MAU (June 2024) and 10M+ DAU signal genuine product-market fit in China's largest auto market
    - 'Strong timing: NEV penetration reached 47% in 2024 and is expanding, driving fresh consumer research demand'
    - AI car selection (July 2025) and 76,000+ model database create defensible content differentiation
    - 30,000+ dealer and 110+ OEM partnerships create two-sided network effects
  topRisks:
    - >-
      ByteDance regulatory exposure — PAFACA and global scrutiny of parent brand could depress IPO valuation or force
      structural changes
    - No disclosed revenue or margins — inability to verify unit economics makes high-conviction sizing impossible
    - >-
      Autohome (the best public comparable) is trading at $2.44B with declining revenue, capping the implied comparables
      floor
    - >-
      Heavy traffic dependence on ByteDance ecosystem; if Douyin referrals are reduced post-IPO, CAC could spike
      materially
    - >-
      China data security and algorithm regulation (PIPL, Cybersecurity Law, Algorithm Recommendation Regulation) add
      compliance cost and disclosure risk
  unresolvedGaps:
    - Revenue run-rate and year-over-year growth rate not publicly disclosed
    - Gross and operating margins unknown; advertising mix vs transaction fee mix unquantified
    - Post-Series A ownership table and preference stack not public
    - Headcount and burn rate unavailable; runway from $800M raise unconfirmed
    - ByteDance's continuing stake and governance rights over Dongchedi post-spinoff undisclosed
