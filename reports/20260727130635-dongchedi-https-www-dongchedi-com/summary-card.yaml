summary:
  headline: >
    Dongchedi has dominant scale in China's automotive content vertical and a defensible ByteDance distribution moat,
    but opaque financials, heavy parent dependency, and a challenged comparable set make the $3 billion private
    valuation only fair at current transparency. The pending Hong Kong IPO is the key catalyst; materially higher
    conviction requires revenue disclosure.
