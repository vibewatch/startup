    "number": 8,
    "title": "Valuation",
    "summary": "Dongchedi looks strategically relevant but still under-disclosed, so the right call is research-more with low-to-medium confidence and a high risk rating. The latest private round around $3 billion looks roughly fair, while a $5 billion-plus IPO would require meaningfully stronger revenue and monetization proof than public evidence currently provides."
  },
  "sections": [
    {
      "id": "recommendation-and-entry-discipline",
      "title": "Recommendation and entry discipline",
      "body": "The current evidence supports a research-more recommendation rather than a buy call. Dongchedi clearly has scale, brand recognition, and a plausible 2026 liquidity path, but the public record remains too thin on revenue run-rate, monetization density, traffic composition, and financing terms to justify a price-insensitive bullish stance. The latest private valuation near $3 billion looks understandable in narrative terms because investors were underwriting user scale, ByteDance adjacency, and the chance of a Hong Kong listing. Even so, narrative plausibility is not the same as valuation support. A disciplined investor should treat the last private round as roughly fair only if it can be bridged to concrete revenue and monetization evidence. Entry discipline therefore matters more than abstract company quality. If the IPO prices close to the private mark with credible new disclosure, the name remains investable for further work. If the deal stretches toward a $5 billion headline without materially better financial evidence, the recommendation should stay negative on price even if the company itself remains strategically interesting.",
