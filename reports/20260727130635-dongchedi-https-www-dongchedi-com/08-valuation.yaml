    {
      "id": "scenario-range",
      "title": "Bull, base, and bear valuation range",
      "body": "Dongchedi’s valuation is best handled through scenarios because the core missing variable is monetization quality. In the bull case, the company converts user scale into strong advertiser and dealer spend, captures a larger slice of auto-internet advertising, and proves that ByteDance adjacency helps distribution without amplifying discount risk. That can support a $5 billion or higher outcome, but only if revenue is visibly scaling into a range that justifies a multiple premium over public peers. The base case is more conservative: Dongchedi lists around $3-4 billion, roughly flat to modestly up from the 2024 round, because investors accept stronger growth than Autohome but still penalize opacity and macro uncertainty. The bear case assumes delayed listing or a down-round style outcome near $2 billion, driven by comp compression, worsening ByteDance overhang, or disappointing monetization. This framework intentionally keeps precision low. The right question is not whether one decimal place is correct; it is whether the company can earn a premium large enough to outrun the evidence gap on revenue, mix, and governance.",
