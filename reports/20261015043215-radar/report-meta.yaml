companyProfile:
  summary: >-
    RADAR is a private New York retail-technology company selling overhead RFID sensing, software, and analytics to help
    physical stores operate with e-commerce-like visibility. The public record now shows real scale—more than 1,400
    deployed stores, anchor retailers like American Eagle and Old Navy, and a May 2026 Series B that valued the business
    above $1 billion—but it still leaves the core financial and governance diligence package incomplete.
