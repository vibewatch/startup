  topStrengths:
    - Real operating scale with more than 1,400 deployed stores and named anchor retailers.
    - Clear operational value proposition in inventory visibility, replenishment, and store analytics.
    - Fresh capital and an expanded product roadmap support continued growth.
  topRisks:
    - Public disclosure remains thin on ARR, margins, burn, runway, and customer concentration.
    - Hardware-heavy deployment economics may compress returns if pricing pressure rises.
    - Broader data collection and checkout ambitions increase privacy and execution risk.
  unresolvedGaps:
    - Management KPI pack covering ARR, revenue mix, gross margin by layer, burn, runway, and cash.
    - Customer-concentration, retention, and board/control disclosures needed to judge governance quality.
    - Privacy, security, and rollout controls for expanding shopper-data use and international growth.
