            body: >-
              RADAR 比典型的零售科技项目更可信，因为公开记录显示它已经实现真实规模部署，而不只是试点或概念性 AI 说法。CNBC 和 Teardown 都将平台部署于超过 1,400 家门店，并点名 American
              Eagle 和 Old Navy；多家融资报道也一致确认 $170M Series B 的估值超过 $1B。这些运营证明很重要，但投资判断仍受价格敏感性约束：公开证据没有披露
              ARR、毛利率、净留存或股权结构表中的优先权，因此无法像软件或基础设施投资者通常要求的那样，将上一轮融资连接到持久经济性。基于公开证据，最站得住脚的判断仍是继续研究；高风险下，入场纪律应设为明显更好的价格，或一套补齐缺失
