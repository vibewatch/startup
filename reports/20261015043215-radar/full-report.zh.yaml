      - number: '1.2'
        title: 管理层梯队、融资与关键交易对手
        blocks:
          - type: paragraph
            body: >-
              管理层仍以创始人为中心。CNBC 和 Teardown 都将 RADAR 的起点追溯到 Spencer Hewett 以及受 Thiel Fellowship 影响的 2013 年创办经历；更新后的
              2025—2026 年证据显示，公司正在围绕他补齐更常规的后期管理层。TechStartups 和 Citybiz 将 Series B 公告与聘任 Abi Viswanathan 担任 CFO
              联系起来；Fundz 还记录了更早加入的高管，包括 CTO Zach Little、总法律顾问 Morgan Levine，以及 RFID Center of Excellence 高级副总裁 Jonathan
              Aitken。在本次更新窗口中，融资情况也更清晰：独立报道都指向一轮按独角兽估值完成的 $170 million Series B，而 Teardown 将累计融资额记为约 $233
              million。公开点名的投资人和战略零售关系是有用的尽调锚点，但现有来源仍未披露董事会构成、控制条款或完整股权结构表。
            claimRefs:
              - CO002
