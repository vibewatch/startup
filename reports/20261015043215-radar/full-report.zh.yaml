            body: >-
              本轮融资证明投资者看好软硬件结合的 AI 零售基础设施逻辑，并不证明当前估值已经由披露的财务数据验证。多份来源确认 2026 年 5 月 Series B 条款，Fundz 还记录了此前的 $30M Series
              A 和 2025 年 3 月的一轮风投，说明 RADAR 在达到独角兽地位前，已经为长期硬件铺设获得资本支持。2025 年 6 月发布 RADAR+
              也很重要，因为它将投资逻辑从库存可视化扩展到停留时长、补货和生产力分析，而经常性价值可能正是在这里加深。即便如此，公开来源仍以产品和铺设来描述公司，而非以收入质量来描述，因此这轮融资更多证明了品类热度和客户验证，而不是成熟的类软件变现。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: 情景与可比视角
        blocks:
          - type: paragraph
            body: >-
              最有用的公开可比视角不是零售 SaaS，而是软硬件结合的 AI 基础设施；某篇融资复盘正是以此将 RADAR 与 Anduril、Shield AI
              等公司比较。这一框架有方向性帮助，因为它解释了投资者为什么可能愿意为专有传感器加会复利的数据层付费，但它没有解决投资判断问题：公开记录仍未披露安装收入与经常性分析收入的构成。乐观情景是，门店规模证明、客户工作流
              ROI 和较新的分析层转化为更广泛、利润率更高的平台经济性。悲观情景是，让价、服务密集型部署和专业服装客户集中，使公司看起来更像资本密集型系统集成商，而不是能持续复合增长的软件平台。
            claimRefs:
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: 最终尽调问题与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              缺失的工作明确且重要。在接近上一轮价格出手前，投资者需要管理层材料披露 ARR 或等价的经常性收入、硬件与软件分拆毛利率、客户集中度、续约行为、烧钱速度与现金跑道，以及此前融资形成的确切优先股堆叠。Fundz
              的员工数快照显示，这家声称覆盖 1,400+
              家门店的企业组织仍相对精简，因此部署节奏、服务投入强度和支持经济性值得直接压力测试。如果管理层无法证明分析收入正在成为利润引擎，新部署仍局限于狭窄客户群，或下一轮融资到来时 KPI
              透明度没有实质改善，就应重新审视投资逻辑。
            claimRefs:
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 公开证据判断
            body: 将 RADAR 留在尽调名单中，但不要把上一轮融资视为已验证的合理价值。公开记录支持继续研究这家公司，而不足以支撑一份按该价格通过投资委员会的备忘录。
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
          - type: callout
            title: 估值争议在经济性，不在需求
            body: 需求证明已经存在；未决问题是，硬件主导的部署模式能否在下一轮融资或退出窗口前，将这份证明转化为持久的经常性利润率。
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV016
