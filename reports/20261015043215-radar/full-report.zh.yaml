            body: >-
              保留证据将 RADAR 描述为一款集成式零售库存产品，而不是单点功能。公司和媒体来源对基本工作流的描述一致：顶部传感器追踪贴有 RFID
              标签的商品，软件向店员呈现商品位置，新分析层则把流转数据转化为门店和企业运营信号。产品已不只是“找商品”；RADAR+ 增加了更衣室、补货、错放商品和按小时门店智能等功能，而 American Eagle 和
              Old Navy 的生产部署案例表明，公司已经从试点演示走向服装零售规模化部署。不过，公开证据仍集中于服装用例，因此目前成熟度最高的场景仍是商品已经贴有 RFID
              标签、且全渠道履约能立即体现单品级可视化价值的地方。
