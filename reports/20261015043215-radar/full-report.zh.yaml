  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式明确是混合型，但公开变现披露很薄
        blocks:
          - type: paragraph
            body: >-
              公开来源一致将 RADAR 描述为垂直一体化系统，将顶部 RFID
              传感、软件和分析结合起来，而不是单一功能的点式方案。商业模式的轮廓已经清楚：安装时几乎肯定有硬件和部署收入，门店上线后还会有经常性软件或分析层。缺失的是对投资者至关重要的分层收入。Teardown 明确表示
              RADAR 没有公开费率表，并将模式描述为前置或摊销的传感器经济性加持续订阅；2025 年 RADAR+
              的发布则说明管理层正试图在核心库存追踪之外加深经常性分析层。换句话说，变现机制看得见，但公开资料没有披露标价或实际合同结构。
            claimRefs:
              - CI004
              - CI007
