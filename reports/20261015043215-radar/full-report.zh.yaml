  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              RADAR 的相关市场是将贴有 RFID
              标签的门店库存转化为持续位置与工作流智能的企业系统。其方案结合顶部传感、软件和分析；纳入的价值池包括库存可视化、补货、全渠道履约、防损分流和商品分析。通用数字雷达或防务雷达的市场估算描述的是不同技术和买方，因此排除在外。广义零售
              ERP、仓库管理、RFID 标签制造和通用营销 AI 支出也不纳入，除非 RADAR 能直接拿到这部分预算。现状是定期盘点、手持式或闸机式
              RFID，以及零散的传统硬件和零售商自建分析。按这个边界，可服务切口比“实体零售 AI”更窄，同时将结账和非服装品类的相邻上行空间保留为尚未验证的选项。
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM011
              - CM013
      - number: '2.2'
        title: 避免虚假精确的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有证据支持规模指标，而不是市场价值计算。RADAR 和联合报道称实体门店约占全球商业的 80%，但这个分母是商业价值，不是库存智能系统的支出。超过 1,400
              家部署门店是有用的商业下限指标，但没有合同价值、铺设组合和定价，门店数无法换算成收入或 SOM。保留的相关来源既没有给出品类价值或 CAGR，也没有将专业服装 SAM
              与更广泛零售市场分开。因此，分析采用证据层级，而不是编造 TAM/SAM/SOM 数值：当前部署、适合 RFID 的服装切口、地域扩张，以及标签经济性仍未验证的相邻品类。
            claimRefs:
              - CM003
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM011
              - CM013
              - CM014
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM014
              - CM015
              - CM016
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采购联盟覆盖门店运营、全渠道履约、资产保护、商品管理和企业技术。店员使用商品位置和补货信号，企业团队则获得网络级可用率、停留和追回指标。经济买方尚未披露，因此应逐个账户核实预算归属，而不是笼统归入创新预算。采用路径看起来是从商品贴标和天花板安装开始，经工作流集成，再扩展到多店部署。报道的结果很有吸引力，但样本有限：据报道，一家客户将线上下单到店自提取消率从
              25% 降至 3%，另一家将履约率从约 70% 提升至 98%，还有一家门店据报道将损耗降低 60%。这些并非代表性队列，不能据此假设整个客户组合都能获得同样 ROI。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              全渠道履约、幽灵库存、损耗、更精简的门店用工，以及让实体门店数据更可执行的需求，都在推动采用。如果部署产生的是可复用数据，而非一次性定制集成，RADAR
              报道的事件量和已宣布的国际扩张，只有在部署能产出可复用数据、而不是一次性定制集成时，才说明分析机会会进一步变大。约束同样重大：每件商品都必须可贴标，天花板硬件必须安装，企业系统必须完成集成，连锁规模买方还可能要求让价。公开定价缺失，CNBC
              也未获得独立的整体成效数据。因此，对估值真正关键的市场问题是合同价值、硬件和部署负担、销售周期长度、续约经济性，以及服装切口能否在不侵蚀利润率的情况下扩张。
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 市场规模说法尚不足以纳入投资判断
            body: 没有合格地点数量、合同价值、部署经济性和续约证据，门店数量与全球商业规模都无法换算成 TAM、SAM、SOM 或收入。
            calloutType: risk
            claimRefs:
              - CM003
              - CM014
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：RADAR 面对的更多是替代方案组合，而非单一明显的公开竞品
        blocks:
          - type: paragraph
            body: >-
              现有证据没有列出一份清晰的、产品和规模都与 RADAR 相同的顶部 RFID 公开竞品名单。相反，比较对象分成几类替代方案，从不同角度解决同一个买方问题：现有的手持式或闸机式 RFID
              流程、货架扫描机器人、以视觉为先的无人门店系统，以及已经嵌入零售工作流的传统 RFID 读写器或平台生态。这一点很重要，因为买方无需选择一个看起来与 RADAR
              完全相同的公司，也能解决库存可视化问题。公开来看，RADAR 最有力的证据是超过 1,400 家门店的足迹，以及 American Eagle 和 Old Navy
              这样的核心客户；但这些参考也说明，公司当前竞争姿态有多集中于连锁服装零售。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
      - number: '3.2'
        title: 能力与商业取舍让 RADAR 在刷新深度上占优，但透明度和采购简易性并不占优
        blocks:
          - type: paragraph
            body: >-
              RADAR 的产品范围比定期 RFID
              盘点更广：公司现在将平台定义为门店操作系统，覆盖补货、更衣室分析、停留时长测量和企业仪表盘。买方重视持续刷新和下游分析时，它比人工盘点或更简单的读写器组合更有价值。商业层面的比较则模糊得多。没有公开费率表，现有最佳证据也只能支持一个方向性判断：销售模式正从硬件主导转向经常性分析订阅。对采购委员会而言，产品能力看起来有差异化，但与
              Zebra、Sensormatic 或 Nedap 式存量系统相比，实际总成本仍很难基准化。
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP010
              - CP014
