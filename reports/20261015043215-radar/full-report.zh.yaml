      - number: '1.3'
        title: 2023 年以来的势头与剩余证明责任
        blocks:
          - type: paragraph
            body: >-
              里程碑走势符合一家多年打造硬件、直到最近才加速的公司：2023 年 Series A、2024 年扩充管理层、2025 年向 Old Navy 推出部署并发布 RADAR+ 分析产品，随后是 2026 年 5
              月的独角兽轮融资。这条轨迹很重要，因为 RADAR 现在有了可验证的客户案例和更完整的产品叙事，而不再只是原型故事。需要警惕的是，公开叙事仍高度依赖公司或访谈来源的运营说法。CNBC 提到 RADAR
              拒绝分享整体客户成效数据；Omni Talk 明确表示，报道中的 60% 损耗下降来自零售商，而非 RADAR 自身；Teardown
              则把未决问题归结为：在更低成本的替代方案侵蚀定价之前，顶部传感器经济性和部署服务能否规模化。对后续章节而言，概括结论很简单：商业相关性看起来是真实的，但投资者信心仍取决于私下财务和治理尽调。
