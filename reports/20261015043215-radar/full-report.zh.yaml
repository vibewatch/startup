      - number: '4.3'
        title: 新资金支持扩张，但资本充足性仍不足以纳入投资判断
        blocks:
          - type: paragraph
            body: >-
              最新一轮融资显然给了 RADAR 继续部署、招聘和扩展产品面的资产负债表能力，管理层也已将资金用途与硬件、AI
              分析、自动结账和国际增长挂钩。这是乐观的一面。更难的投资判断问题是：新资金是从容的加速资金，还是硬件比重很高、利润率结构仍不透明的铺设模式所必需的资金。公开证据没有披露现金余额、月度烧钱速度、现金跑道、债务、安装所需营运资金压力，或硬件与软件的毛利率。就连累计融资基础也没有在各来源之间完全调平：Teardown
              称融资额为 $233 million，而 Fundz 列出的各轮合计为 $215 million。叙事报告可以容纳这一差异，但没有管理层支持时，尽调流程不能接受。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              现有证据支持存在可信的收入引擎：零售商正在采用该系统，管理层正在投资分析增购，Series B 也给了公司继续扩张的空间。但证据不足以对收入质量、利润率走势或资本密集度作出明确判断。对于需要据此锚定 $1
              billion 估值的成长型投资者而言，RADAR 在 ARR 构成、软件附着率、队列留存、分层毛利率、获客成本效率和烧钱纪律上，仍是潜力大于验证。在这些数字披露之前，最公平的结论是：RADAR
              可能正在打造一家有价值的混合型零售基础设施公司，但公开记录仍只是尽调线索，而不是投资判断材料。
            claimRefs:
              - CI008
              - CI009
              - CI012
              - CI015
      - number: '4.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 公开商业进展领先于公开财务披露
            body: 现有证据显示真实的门店规模部署和客户 ROI 轶事，但仍缺少判断收入质量所需的指标：ARR、实际定价、留存、毛利率、获客成本效率、烧钱速度和现金跑道。
            calloutType: risk
            claimRefs:
              - CI005
              - CI008
              - CI010
              - CI011
              - CI015
          - type: callout
            title: 核心财务争议是硬件拖累还是分析杠杆
            body: 如果 RADAR 正从安装驱动的收入转向高附着率的分析订阅，当前估值可能更合理；如果部署仍是经济重心，同样的门店数量对长期利润率的说明力就小得多。
            calloutType: insight
            claimRefs:
