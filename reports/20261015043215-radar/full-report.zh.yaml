  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 论点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - American Eagle 和 Old Navy 的 1,400+ 家已部署门店，说明 RADAR 在现实场景中的验证比多数同阶段零售 AI 基础设施公司更充分。
        - 独立披露更广泛的客户结构，以及服装以外的生产落地成果，会强化投资逻辑。
      - - 投资逻辑
        - 公开引用的取消率和库存损耗工作流结果表明，产品解决的是昂贵的零售问题，而不是表面化的分析需求。
        - 多个客户披露全组合 KPI，会让 ROI 逻辑更经得起考验。
      - - 投资逻辑
        - RADAR+ 将故事从传感器扩展到补货、停留时长和商品陈列智能，可能支撑经常性变现。
        - 若披露软件收入占比、毛利率和净留存率，这一层才足以纳入投资判断。
      - - 反向逻辑
        - 没有公开 ARR、增长、毛利率、NRR 或 CAC / 回本周期数据，无法把 $1B 融资轮与基本面连接起来。
        - 董事会层面的 KPI 包，或经审计的贷款方 / 投资者材料，会显著削弱这一质疑。
      - - 反向逻辑
        - Teardown 将资本开支和服务强度，以及连锁规模定价让步，列为长期利润质量的核心风险。
        - 若能证明分析收入增速超过安装和部署服务收入，这一担忧会减轻。
      - - 反向逻辑
        - 已命名的验证点仍集中在少数锚定零售商周围，因此客户多元化和实施规模化仍无定论。
        - 当前锚定客户之外的生产客户，加上集中度数据，会改善判断。
    notes: 论点混合了独立报道的事实与明确的公开数据限制；在管理层披露单位经济性和客户集中度前，反向逻辑各行仍未解决。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - 门店覆盖扩展到服装以外，分析业务占收入的比重提高，留存或利润率披露也更像软件公司。
        - 只有私下尽调证明经常性收入模式足以支撑基础设施平台倍数时，按上一轮估值或更高价格入场才站得住。
        - 前提是部署和服务不会吞掉大部分经济价值。
        - 需要拿下新的行业客户、改善 KPI 披露，并且优先权压顶有限。
      - - 基准情景
        - 客户验证真实存在，但公开披露仍然薄弱，市场对业务的估值更多基于承诺，而不是已披露的财务质量。
        - 在尽调补齐 ARR、利润率、客户集中度和烧钱速度缺口前，稳妥做法是在上一轮价格或更低价格入场。
        - 私募市场倍数持平，加上常见的执行拖延，就可能抹去当前价格对应的上行空间。
        - 与目前公开记录最为一致。
      - - 悲观情景
        - 硬件铺设成本、价格让步或客户集中度，可能让经常性收入模式在下一轮融资前仍无法改善。
        - 公开证据尚不足以支持软件公司式的高溢价投资判断，因此明显的下调轮融资路径变得合理。
        - 利润率承压、扩张延迟或下一轮融资规模偏小，都可能压低普通股的上行空间。
        - 若部署增长停滞、KPI 披露不透明，或在基本面没有改善时获得新融资，就会释放这一信号。
    notes: 情景区间以已披露的 $1B 上一轮融资为参照，因为公开来源没有提供建立精确内在估值模型所需的财务输入。
    claimRefs:
      - CV004
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
