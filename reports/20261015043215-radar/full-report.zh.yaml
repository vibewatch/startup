  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐结论建立在真实部署验证和融资势头之上，但经常性收入模式与资本结构的投资判断缺口仍未解决。
    data:
      nodes:
        - id: priced-round
          label: 上一轮定价融资
          value: $170M Series B at >$1B
          note: 多个公开来源已确认。
        - id: operating-proof
          label: 运营验证
          value: 1,400+ stores
          note: 已点名的核心客户和已报告的工作流结果。
        - id: platform-upside
          label: 平台上行空间
          value: RADAR+ analytics
          note: 路线图增加更高价值的软件和自动化场景。
        - id: org-depth
          label: 扩张深度
          value: ~189 employees
          note: 对照其宣称的覆盖规模，公开组织信息仍显得精简。
        - id: underwriting-gap
          label: 投资判断缺口
          value: No public ARR / margin / NRR / preference data
          note: 仅凭公开来源，无法将价格与持久的经济性对应起来。
        - id: recommendation
          label: 当前结论
          value: Research-more
          note: 需要更好的 KPI 披露，或明显更优的入场价格。
      edges:
