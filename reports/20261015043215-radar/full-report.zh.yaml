chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与运营足迹
        blocks:
          - type: paragraph
            body: >-
              RADAR 将自己定位为面向实体零售的软硬件一体化平台，用顶部 RFID 传感和分析实时追踪商品流转。从公司官网、Business Wire 发布材料和独立融资报道来看，其稳定身份是一家由创始人 Spencer
              Hewett 领导的纽约私营零售科技公司，聚焦库存可视化、补货、履约支持和店内分析。外部证据最充分的规模信号不是披露收入，而是部署广度：多家独立媒体都将已安装门店数放在 1,400 家以上，并点名
              American Eagle 和 Old Navy 为核心客户。因此，RADAR 看起来确实是一家处于成长阶段的 Series B
              基础设施供应商，但还称不上财务透明的软件公司，因为公开记录对门店足迹和准确率的强调远超对经常性收入的披露。
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO007
              - CO009
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
