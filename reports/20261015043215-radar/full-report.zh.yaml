            body: >
              证据支持三项最高级别风险。第一，单位经济性仍未解决：Teardown 认为，核心问题是连锁规模零售商要求从试点价转向组合价并争取让价后，RADAR
              能否守住顶部传感器经济性，以及更轻量的软件叠加层能否压低拥有天花板硬件的成本。第二，商业证明仍集中于核心服装客户，而不是广泛的跨垂直客户基础，尽管 RADAR 现在声称已覆盖超过 1,400 家门店，并以超过
              $1 billion 的估值完成了 $170 million Series
              B。第三，产品面正从库存追踪扩展到购物者行为分析、自动结账和国际扩张，速度快于现有证据中公开合规与治理材料的出现。这三项风险都可监测，也最可能决定当前估值是继续复合增长还是收缩。
