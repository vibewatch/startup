            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP008
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP011
      - number: '3.3'
        title: 护城河能否持久，取决于分析能否比部署负担更快规模化
        blocks:
          - type: paragraph
            body: >-
              证据池中最好的独立反向证据是结构性的，而不是客户投诉：重硬件的零售 AI 历来面临转型、停业和利润率质疑。Teardown 的论点有用，因为它明确提出了真正的投资判断问题。如果 RADAR
              的分析和工作流层成为持久价值来源，天花板改造就可能成为可守住的安装切口；反之，正是天花板所有权带来差异化，也会变成更轻量竞争者可以攻击的成本负担。因此，当前证据下最可信的进入者画像不是另一个完整集成的复制品，而是构建在零售商已有硬件之上的轻量分析层，或在标签条件更好、价值更高的环境中采用类似架构的垂直领域进入者。
            claimRefs:
              - CP007
              - CP009
              - CP011
              - CP012
