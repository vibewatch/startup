        title: 公开运营证据证明买方价值，但不能证明收入质量
        blocks:
          - type: paragraph
            body: >-
              RADAR 的公开证据最强的是运营结果，而不是确认收入。2026 年 5 月的融资公告称，系统当时已部署于超过 1,400 家门店；CNBC 和 Omni Talk
              也都报道了部署后履约改善、取消率下降或损耗减少的案例。这些案例解释了零售商为什么愿意承担安装传感器和推动变革的摩擦成本。但它们无法回答：这些成果能否转化为高毛利、可持续的软件收入，还是主要只为资本密集型部署提供合理性。本章的核心问题正是客户结果轶事与已披露财务质量之间的差距：RADAR
              有公开证据证明客户在乎，但没有公开证据证明投资者可以据此评估经济性。
