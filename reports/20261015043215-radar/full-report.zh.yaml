        - id: sensor-grid
          label: 顶置传感器网格
          detail: 自有的天花板 RFID / 计算机视觉硬件构成已安装基础，也带来部署负担。
        - id: core-platform
          label: 核心库存平台
          detail: 实时位置、每八秒一次的库存快照、补货和履约逻辑。
          value: 99% item-level accuracy
        - id: analytics
          label: RADAR+ 分析
          detail: 每小时门店指标、停留 / 试衣间信号、补货优先级和精益库存规划。
        - id: workflows
          label: 零售运营工作流
          detail: BOPIS、门店发货、防损、商品管理和人员配置决策。
        - id: monetization
          label: 商业化层
          detail: 公开证据暗示收入包括前期或摊销的硬件 / 安装费用，以及持续的软件和分析订阅，但没有公开价目表。
      edges:
        - from: tagged-items
          to: sensor-grid
          label: 带标签商品让门店可观测
        - from: sensor-grid
          to: core-platform
          label: 传感器读取转为库存位置数据
        - from: core-platform
          to: analytics
          label: 核心事件流为分析模块提供输入
        - from: analytics
          to: workflows
          label: 洞察驱动运营动作
        - from: workflows
          to: monetization
          label: 买方 ROI 支撑硬件 + 软件支出
    approximationNotes: 这条链路反映已披露的产品层级和推断出的商业化逻辑，不是已发布的合同收入瀑布图，也不是量化的毛利推导。
    claimRefs:
      - CI004
      - CI006
      - CI007
      - CI009
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，零售技术栈从标记库存和天花板传感器向上延伸到店员工作流和 RADAR+ 分析。
    data:
      layers:
        - label: RFID 标记商品
          detail: 单件门店商品的身份层，让商品级追踪成为可能。
        - label: RS510 天花板传感器
          detail: 自有顶置硬件持续扫描门店环境中的标记库存。
        - label: PoE++ 和门店网络
          detail: 48V PoE++ 以太网供电和网络控制把传感器接入软件层。
        - label: 位置与控制软件
          detail: 传感器控制结合商品位置逻辑，将原始读取转为可执行的库存状态。
        - label: 店员与门店工作流
          detail: 商品查询、补货、错放商品提醒和试衣间工作流消耗实时数据。
        - label: RADAR+ 和总部分析
          detail: 分析层增加 SKU 级门店智能、每小时指标，并计划向更广泛的自动化扩展。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE010
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 可见的客户旅程从企业试点开始，扩展到服装连锁全面铺设，随后检验 RADAR 能否增购分析能力，并走出少数核心零售客户。
    data:
      items:
        - label: 企业试点
          detail: 早期公开验证来自未披露名称的企业零售商，而不是广泛的自助客户群。
          touchpoints:
            - 2019 年，三家未披露名称的企业客户被选定为首批商业部署对象。
            - 两家隐身客户参与了早期融资。
        - label: 核心服装客户铺设
          detail: American Eagle 是最早被点名的连锁客户，至今仍是从试点扩展到连锁铺设的最清晰案例。
          touchpoints:
            - American Eagle 是首家在全门店部署 RADAR 的零售商。
            - 历史铺设证据提到 American Eagle 启动了 500 家门店。
        - label: 连锁规模部署
          detail: 到 2025-26 年，公开来源显示 RADAR 已达到有意义的门店数量规模。
          touchpoints:
            - RADAR 在 2025 年 6 月称已覆盖美国和加拿大超过 650 家门店。
            - 2026 年独立报道称已部署超过 1,400 家门店，其中包括 Old Navy。
        - label: 运营与履约价值
          detail: 公开客户价值案例聚焦库存确定性和订单可靠性改善。
          touchpoints:
            - CNBC 转述 BOPIS 取消率从 25% 降至 3%。
            - Omni Talk 转述履约率从约 70% 提升至 98%。
        - label: 分析能力增购
          detail: 管理层正尝试把客户关系从硬件部署延伸到经常性分析和工作流模块。
          touchpoints:
            - RADAR+ 为总部团队增加每小时指标，以及补货和停留时间分析。
            - AMD 的案例研究称，硬件可以随时间通过远程升级解锁额外能力。
        - label: 扩张检验
          detail: 下一项商业检验是：RADAR 能否在不让利润率压力或客户集中度拖垮模式的情况下，走出核心服装连锁。
          touchpoints:
            - Teardown 认为，护城河取决于服装以外的生产部署和订阅收入组合。
            - 公开来源仍未披露留存或客户集中度指标。
    approximationNotes: 这些阶段将公开客户证据整理为有序的商业路径；不代表各阶段转化率一致，也不代表各阶段收入权重相同。
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
