artifact: market-analysis
slug: radar
runDate: 2026-10-15
company:
  name: RADAR
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    RADAR addresses the narrow enterprise market for continuous, item-level inventory
    intelligence in RFID-tagged physical retail, not the unrelated radar-hardware market.
    Public evidence shows chain-scale deployment and retailer-reported workflow gains, but
    no retained source supplies a defensible TAM, SAM, SOM, price, or portfolio-wide ROI set.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      RADAR's relevant market is the enterprise system that turns RFID-tagged store inventory
      into continuous location and workflow intelligence. The offer combines ceiling-mounted
      sensing, software, and analytics; the included value pools are inventory visibility,
      replenishment, omnichannel fulfillment, loss-prevention triage, and merchandising
      analytics. Generic digital-radar or defense-radar estimates are excluded because they
      describe a different technology and buyer. Broad retail ERP, warehouse-management,
      RFID-tag manufacturing, and generic marketing-AI spend are also excluded unless RADAR
      captures that budget directly. The status quo is periodic counting, handheld or
      portal-based RFID, and fragmented incumbent hardware plus retailer-built analytics.
      This boundary makes the addressable wedge narrower than "physical retail AI," while
      preserving adjacent upside in checkout and non-apparel categories as unproven options.
    claimRefs: [CM001, CM002, CM010, CM011]
    tableRefs: [TM001]
  - id: sizing-without-false-precision
    title: Sizing without false precision
    body: >-
      The available evidence supports scale markers, not a market-value calculation. RADAR
      and syndicated coverage cite physical stores as roughly 80% of global commerce, but
      that denominator is commerce value rather than spend on inventory-intelligence
      systems. More than 1,400 deployed stores is a useful commercial lower-bound marker,
      yet store count cannot be converted into revenue or SOM without contract value,
      rollout mix, and pricing. The retained relevant sources provide neither a category
      value nor CAGR, and no source separates specialty-apparel SAM from broader retail.
      Accordingly, the analysis uses a hierarchy of evidence rather than fabricated
      TAM/SAM/SOM values: current deployments, the RFID-ready apparel wedge, geographic
      expansion, and category adjacencies whose tagging economics remain unproven.
    claimRefs: [CM003, CM013, CM014, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The buying coalition spans store operations, omnichannel fulfillment, asset protection,
      merchandising, and enterprise technology. Associates use item-location and replenishment
      signals, while corporate teams receive network-level availability, dwell, and recovery
      metrics. The economic buyer is not disclosed, so budget ownership should be validated
      account by account rather than assigned to a generic innovation budget. Adoption appears
      to move from tagged merchandise and ceiling installation through workflow integration to
      multi-store rollout. Reported outcomes are promising but selective: one client reportedly
      reduced buy-online-pickup cancellation from 25% to 3%, another improved fulfillment from
      roughly 70% to 98%, and one store reportedly reduced shrink by 60%. These are not a
      representative cohort and therefore cannot support a portfolio-wide ROI assumption.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation-relevance
    title: Drivers, constraints, and valuation relevance
    body: >-
      Adoption is pulled by omnichannel fulfillment, phantom inventory, shrink, leaner store
      labor, and the need to make physical-store data more actionable. RADAR's reported event
      volume and announced international expansion suggest a larger analytics opportunity if
      deployments produce reusable data rather than bespoke integration work. The constraints
      are equally material: every item must be taggable, ceiling hardware must be installed,
      enterprise systems must be integrated, and chain-scale buyers can demand pricing
      concessions. Public pricing is absent, and independent aggregate effectiveness data was
      withheld from CNBC. For valuation, the decisive market questions are therefore contract
      value, hardware and deployment burden, sales-cycle length, renewal economics, and proof
      that the apparel wedge can expand without eroding margins.
    claimRefs: [CM002, CM009, CM010, CM011, CM012, CM013, CM015]
