callouts:
  - calloutType: insight
    title: Anchor-customer proof is unusually strong for a private retail-infrastructure vendor
    body: >-
      American Eagle and Old Navy give RADAR better public reference quality
      than most venture-backed retail-operations startups, which makes the
      deployment footprint more credible than a standalone marketing claim. The
      tradeoff is concentration: the public footprint still centers on a small
      set of named apparel relationships rather than a diversified disclosed
      customer roster.
    claimRefs: [CO009]
  - calloutType: risk
    title: The valuation moved ahead of public financial disclosure
    body: >-
      The Series B established external willingness to fund RADAR at unicorn
      pricing, but the retained sources still do not expose recurring revenue,
      gross margin mix, or governance rights. That leaves the biggest
      investment questions dependent on management diligence rather than on
      public corroboration.
    claimRefs: [CO005, CO013, CO014, CO015]
