artifact: company-overview
slug: radar
runDate: "2026-10-15"
company:
  name: RADAR
chapter:
  number: 1
  title: Company Overview
  summary: >-
    RADAR is a New York retail-infrastructure company selling overhead RFID
    sensing, software, and analytics to help stores behave more like e-commerce
    operations, with unusually strong public proof points in American Eagle and
    Old Navy. The refreshed evidence confirms a May 2026 $170 million Series B
    at a valuation above $1 billion and more than 1,400 deployed stores, but
    key investor-grade disclosures such as ARR, margin profile, customer count,
    and governance rights remain private.
sections:
  - id: identity-and-scale
    title: Identity, stage, and operating footprint
    body: >-
      RADAR presents itself as a vertically integrated hardware-plus-software
      platform for physical retail, using overhead RFID sensing and analytics to
      track item movement in real time. Across the company homepage, Business
      Wire launch material, and independent funding coverage, the stable
      identity is a private New York retail-technology company led by founder
      Spencer Hewett and focused on inventory visibility, replenishment,
      fulfillment support, and in-store analytics. The strongest externally
      corroborated scale signal is deployment breadth rather than disclosed
      revenue: multiple independent outlets place the installed base above 1,400
      stores and specifically name American Eagle and Old Navy as anchor
      accounts. That makes RADAR look like a genuine growth-stage Series B
      infrastructure vendor, but still not like a fully transparent software
      company because the public record emphasizes footprint and accuracy claims
      far more than recurring-revenue disclosure.
    claimRefs: [CO001, CO003, CO005, CO007, CO009, CO015]
    tableRefs: [TO001]
  - id: leadership-capital-and-stakeholders
    title: Leadership bench, financing, and key counterparties
    body: >-
      Leadership remains founder-centric. CNBC and Teardown both trace RADAR
      back to Spencer Hewett and a 2013 founding story shaped by the Thiel
      Fellowship, while the refreshed 2025-2026 evidence shows the company
      adding a more conventional late-stage bench around him. TechStartups and
      Citybiz tie the Series B announcement to the hiring of Abi Viswanathan as
      CFO, and Fundz records earlier executive additions including Zach Little
      as CTO, Morgan Levine as general counsel, and Jonathan Aitken as senior
      vice president of the RFID Center of Excellence. Capital formation also
      became clearer in this refresh window: independent reporting converges on
      a $170 million Series B at unicorn valuation, while Teardown rolls
      cumulative capital to roughly $233 million. Publicly named investors and
      strategic retail relationships are useful diligence anchors, but the
      available sources still do not disclose board composition, control terms,
      or the full cap table.
    claimRefs: [CO002, CO005, CO006, CO008, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: milestones-risks-and-open-questions
    title: Momentum since 2023 and the remaining proof burden
    body: >-
      The milestone pattern is consistent with a company that spent years
      building hardware and only recently accelerated: a 2023 Series A, 2024
      leadership expansion, a 2025 Old Navy rollout and RADAR+ analytics
      launch, and then the May 2026 unicorn round. That trajectory matters
      because RADAR now has visible customer references and a broader product
      story, not just a prototype narrative. The caution is that the public
      story still leans heavily on company or interview-sourced operating
      claims. CNBC notes RADAR declined to share overall customer-effectiveness
      data, Omni Talk explicitly says a reported 60% shrink reduction came from
      a retailer rather than from RADAR itself, and Teardown frames the
      unresolved question as whether overhead-sensor economics and deployment
      services can scale before lower-cost alternatives erode pricing. For later
      chapters, the overview takeaway is simple: commercial relevance looks
      real, but investor confidence still depends on private financial and
      governance diligence.
    claimRefs: [CO004, CO009, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
