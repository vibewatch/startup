  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role in refreshed evidence
      - Background / functional coverage
      - Founder-market fit or dependency
      - Key diligence angle
    rows:
      - - Spencer Hewett
        - Founder & CEO
        - Founder since 2013 and the public product evangelist for the company.
        - Very high key-person dependence because strategy, fundraising, and customer narrative are tightly identified with Hewett.
        - Assess succession depth and whether operating cadence relies excessively on founder selling.
      - - Abi Viswanathan
        - Chief Financial Officer
        - Joined around the Series B after finance leadership roles at Nuro and strategic finance work at Uber.
        - Adds late-stage finance capability ahead of international growth and heavier investor scrutiny.
        - Request first full budgeting and reporting cadence under the new finance leader.
      - - Zach Little
        - Chief Technology Officer
        - Recorded by Fundz as appointed in July 2024.
        - Suggests formalization of product and engineering leadership beyond the founder.
        - Verify tenure, org scope, and delivery ownership for hardware versus analytics roadmaps.
      - - Morgan Levine
        - General Counsel
        - Recorded by Fundz as appointed in July 2024.
        - Useful signal that legal and commercial complexity is rising with scale and strategic investors.
        - Review commercial contracting posture, privacy, and any IP or employment disputes.
      - - Jonathan Aitken
        - SVP, RFID Center of Excellence
        - Recorded by Fundz as appointed in January 2026.
        - Points to deeper domain specialization as deployments scale.
        - Clarify whether this function is customer enablement, field operations, or product standardization.
    notes: Publicly named leaders only; this is not a complete org chart or board roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers executives and functional leaders explicitly named in refreshed
        2024-2026 retained sources, not the full management team or board.
    claimRefs: [CO002, CO010, CO011]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - - Gideon Strategic Partners
        - Series B co-lead investor
        - Lead capital provider in the $170M round and visible sponsor of the unicorn pricing reset.
        - Understand board seat, liquidation terms, and appetite for follow-on support.
      - - Nimble Partners
        - Series B co-lead investor
        - Co-led the May 2026 round and publicly endorsed the category thesis.
        - Confirm ownership, governance rights, and expected pace of commercialization.
      - - Align Ventures
        - Existing investor / Series B participant
        - Bridges the 2023 Series A to the 2026 Series B and may hold institutional memory on execution.
        - Request pro rata behavior and internal marks across rounds.
      - - American Eagle Outfitters / Jay Schottenstein
        - Anchor customer and investor relationship
        - First fleet-wide retailer reference and an investor link that strengthens commercial credibility.
        - Check concentration, pricing concessions, and whether strategic ties distort governance incentives.
      - - Old Navy / Gap Inc.
        - Anchor rollout customer
        - Large-scale deployment reference supporting the 1,400+ store narrative.
        - Validate rollout economics, timeline, and renewal or expansion terms.
    notes: >-
      Maps only stakeholders explicitly named in refreshed public sources;
      control rights, ownership percentages, and the broader cap table are
      undisclosed.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to publicly named investors and strategic counterparties in
        retained 2023-2026 sources rather than a complete cap table or customer
        ledger.
    claimRefs: [CO005, CO008, CO009, CO013]
