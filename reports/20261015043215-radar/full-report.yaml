      - number: '4.2'
        title: Public operating proof points show buyer value, but not revenue quality
        blocks:
          - type: paragraph
            body: |-
              RADAR's public evidence is strongest on operational outcomes rather than on recognized
              revenue. The May 2026 financing announcement says the system was already deployed across
              more than 1,400 stores, and both CNBC and Omni Talk report examples of better fulfillment,
              lower cancellation rates, or reduced shrink after deployment. Those examples matter because
              they explain why a retailer would tolerate the friction of sensor installation and change
              management. They do not, however, answer whether those wins translate into high-margin,
              durable software revenue or whether they mainly justify capital-intensive deployments.
              The gap between customer-outcome anecdotes and disclosed financial quality is the core
              issue in this chapter: RADAR has public proof that customers care, but not public proof
              that investors can underwrite the economics.
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.3'
        title: Fresh capital funds expansion, but capital adequacy is still not underwritable
        blocks:
          - type: paragraph
            body: |-
              The latest round clearly gives RADAR the balance-sheet capacity to keep deploying, hiring,
              and extending the product surface, and management has already tied the proceeds to hardware,
              AI analytics, autonomous checkout, and international growth. That is the positive case.
              The harder underwriting question is whether the new capital is comfortable acceleration
              capital or a requirement of a hardware-heavy rollout model whose margin profile remains
              opaque. Public evidence does not disclose cash on hand, monthly burn, runway, debt,
              installation working-capital strain, or hardware-versus-software gross margin. Even the
              cumulative funding base is not fully reconciled across sources: Teardown cites $233 million
              raised, while Fundz's listed rounds sum to $215 million. That mismatch is manageable in a
              narrative report, but it is unacceptable in a diligence process without management backup.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: |-
              The available evidence supports a credible revenue engine in the sense that retailers are
              adopting the system, management is investing in analytics upsell, and the Series B gives
              the company room to keep scaling. It does not support a clean judgment on revenue quality,
              margin trajectory, or capital intensity. RADAR looks more promising than proven on the
              dimensions a growth investor would need to anchor a $1 billion valuation: ARR composition,
              software attachment, cohort retention, gross margin by layer, CAC efficiency, and burn
              discipline. Until those figures are disclosed, the fairest conclusion is that RADAR may be
              building a valuable hybrid retail-infrastructure company, but the public record is still a
              diligence lead, not an underwriting package.
            claimRefs:
              - CI008
              - CI009
              - CI012
              - CI015
