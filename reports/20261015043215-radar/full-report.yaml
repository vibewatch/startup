  - id: FM001
    title: Evidence-constrained opportunity pyramid
    type: pyramid
    summary: >-
      The opportunity narrows from broad physical-commerce context to deployments that can support a priced and
      independently validated serviceable market.
    data:
      nodes:
        - label: Broad context
          value: Physical stores cited as ~80% of global commerce
          detail: Context only; commerce volume is not TAM.
        - label: Technical eligibility
          value: Item-level RFID-tagged merchandise
          detail: The retained evidence does not quantify the eligible-store universe.
        - label: Initial wedge
          value: Specialty apparel and footwear
          detail: Current proof is concentrated in large apparel chains.
        - label: Current deployment proof
          value: 1,400+ stores
          detail: A footprint marker, not revenue or SOM.
        - label: Data-layer scale
          value: 100B+ item-level events per day, company claim
          detail: Event volume does not establish monetization.
        - label: Validated serviceable market
          value: Undisclosed
          detail: Requires pricing, contract, renewal, and independent cohort data.
    approximationNotes: No arithmetic transformation is applied; qualitative layers preserve unlike source denominators and explicit gaps.
    claimRefs:
      - CM003
      - CM004
      - CM009
      - CM014
      - CM015
      - CM016
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of the current substitute set: RADAR leads on continuous visibility breadth, while lighter
      alternatives usually reduce deployment burden.
    approximationNotes: >-
      Axis values are ordinal judgments from assigned public evidence, not measured market share or benchmark scores.
      Higher x means more continuous item-level visibility and workflow breadth; higher y means heavier deployment
      burden and infrastructure retrofits.
    claimRefs:
      - CP001
      - CP004
      - CP005
      - CP006
      - CP008
      - CP011
      - CP012
    data:
      xAxis: Continuous visibility and workflow breadth (0-10 ordinal)
      yAxis: Deployment burden / retrofit intensity (0-10 ordinal; higher = heavier)
      points:
        - label: RADAR
          x: 9
          'y': 9
          detail: >-
            Continuous ceiling-based item visibility plus analytics, but with proprietary hardware and store-by-store
            deployment.
        - label: Periodic handheld / gate RFID
          x: 3
          'y': 2
          detail: Lower-friction incumbent process, but no source-backed continuous refresh or fitting-room analytics.
        - label: Shelf-scanning robots (Simbe-type)
          x: 6
          'y': 7
          detail: >-
            Targets the same shelf-awareness job with robotics rather than a ceiling retrofit, especially in grocery and
            mass.
        - label: Installed RFID platforms / reader ecosystems
          x: 5
          'y': 4
          detail: >-
            Leverages entrenched reader estates and incumbent vendor relationships, but the assigned evidence does not
            show equivalent end-to-end refresh depth.
        - label: Vision-first autonomous-store entrants
          x: 7
          'y': 8
          detail: >-
            Potentially broad behavioral instrumentation, but public category evidence is dominated by pivots, scrutiny,
            and shutdowns.
        - label: Integrator-built analytics on existing Zebra / Impinj hardware
          x: 6
          'y': 5
          detail: >-
            The clearest undercut path is software that rides hardware retailers already own instead of owning the
            ceiling.
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a hardware-plus-software revenue bridge from RFID-tagged inventory to operational
      workflows and analytics, but not the actual price or margin captured at each step.
    data:
      nodes:
        - id: tagged-items
          label: Tagged store inventory
          detail: >-
            Apparel and other tagged merchandise becomes the observable input that RADAR can monitor continuously
            in-store.
        - id: sensor-grid
          label: Overhead sensor grid
          detail: >-
            Proprietary ceiling-mounted RFID / computer-vision hardware creates the installed base and deployment
            burden.
        - id: core-platform
          label: Core inventory platform
          detail: Real-time location, eight-second inventory snapshots, replenishment, and fulfillment logic.
          value: 99% item-level accuracy
        - id: analytics
          label: RADAR+ analytics
          detail: Hourly store metrics, dwell/fitting-room signals, replenishment prioritization, and lean-inventory planning.
        - id: workflows
          label: Retail operating workflows
          detail: BOPIS, ship-from-store, loss prevention, merchandising, and staffing decisions.
        - id: monetization
          label: Monetization layers
          detail: >-
            Public evidence implies upfront or amortized hardware/install economics plus ongoing software and analytics
            subscriptions, but no public rate card exists.
      edges:
        - from: tagged-items
          to: sensor-grid
          label: Tagged merchandise makes the store observable
        - from: sensor-grid
          to: core-platform
          label: Sensor reads become inventory location data
        - from: core-platform
          to: analytics
          label: Core event stream feeds analytics modules
        - from: analytics
          to: workflows
          label: Insights drive operational actions
        - from: workflows
          to: monetization
          label: Buyer ROI supports hardware + software spending
    approximationNotes: >-
      The bridge reflects disclosed product layers and inferred commercialization logic, not a published contract
      waterfall or quantified gross-profit walk.
    claimRefs:
      - CI004
      - CI006
      - CI007
      - CI009
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a layered retail stack from tagged inventory and ceiling sensors up through associate
      workflows and RADAR+ analytics.
    data:
      layers:
        - label: RFID-tagged merchandise
          detail: Identity layer on individual store items that makes item-level tracking possible.
        - label: RS510 ceiling sensor
          detail: Proprietary overhead hardware continuously scans tagged inventory in the store environment.
        - label: PoE++ and store network
          detail: 48V PoE++ Ethernet power and network control connect sensors to the software layer.
        - label: Location and control software
          detail: Sensor control plus item-location logic turns raw reads into actionable inventory state.
        - label: Associate and store workflows
          detail: Item lookup, replenishment, misplaced-item alerts, and fitting-room workflows consume the live data.
        - label: RADAR+ and corporate analytics
          detail: >-
            The analytics layer adds SKU-level store intelligence, hourly metrics, and roadmap expansion into broader
            automation.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE010
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The visible customer journey starts with enterprise pilots, expands into chainwide apparel rollouts, and then
      tests whether RADAR can upsell analytics and move beyond a narrow set of anchor retail accounts.
    data:
      items:
        - label: Enterprise pilot
          detail: Early public proof came from undisclosed enterprise retailers rather than a broad self-serve customer base.
          touchpoints:
            - Three undisclosed enterprise customers were targeted for first commercial deployment in 2019.
            - Two stealth customers invested in the early financing round.
        - label: Anchor apparel rollout
          detail: >-
            American Eagle is the earliest named chain reference and remains the clearest example of pilot-to-chain
            expansion.
          touchpoints:
            - American Eagle was the first retailer to implement RADAR across its stores.
            - Historical rollout evidence cites a 500-store American Eagle launch.
        - label: Chain-scale deployment
          detail: By 2025-26, public sources show RADAR operating at meaningful store-count scale.
          touchpoints:
            - RADAR cited more than 650 stores in the U.S. and Canada in June 2025.
            - Independent 2026 coverage cited more than 1,400 deployed stores including Old Navy.
        - label: Operations and fulfillment value
          detail: Public customer value stories focus on inventory certainty and order-reliability improvements.
          touchpoints:
            - CNBC relayed BOPIS cancellation improvement from 25% to 3%.
            - Omni Talk relayed fulfillment improvement from roughly 70% to 98%.
        - label: Analytics upsell
          detail: >-
            Management is trying to extend the customer relationship from hardware deployment into recurring analytics
            and workflow modules.
          touchpoints:
            - RADAR+ adds hourly metrics for corporate teams plus replenishment and dwell-time analytics.
            - AMD's case study says the hardware can unlock additional capabilities over the air over time.
        - label: Expansion test
          detail: >-
            The next commercial test is whether RADAR can diversify beyond anchor apparel chains without margin pressure
            or customer concentration overwhelming the model.
          touchpoints:
            - Teardown argues the moat depends on non-apparel production deployments and subscription mix.
            - Public sources still do not disclose retention or customer-concentration metrics.
    approximationNotes: >-
      Stages synthesize the public customer evidence into an ordered commercial path; they do not imply uniform
      conversion rates or equal revenue weight by stage.
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
