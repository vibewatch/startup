      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buying coalition spans store operations, omnichannel fulfillment, asset protection, merchandising, and
              enterprise technology. Associates use item-location and replenishment signals, while corporate teams
              receive network-level availability, dwell, and recovery metrics. The economic buyer is not disclosed, so
              budget ownership should be validated account by account rather than assigned to a generic innovation
              budget. Adoption appears to move from tagged merchandise and ceiling installation through workflow
              integration to multi-store rollout. Reported outcomes are promising but selective: one client reportedly
              reduced buy-online-pickup cancellation from 25% to 3%, another improved fulfillment from roughly 70% to
              98%, and one store reportedly reduced shrink by 60%. These are not a representative cohort and therefore
              cannot support a portfolio-wide ROI assumption.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is pulled by omnichannel fulfillment, phantom inventory, shrink, leaner store labor, and the need
              to make physical-store data more actionable. RADAR's reported event volume and announced international
              expansion suggest a larger analytics opportunity if deployments produce reusable data rather than bespoke
              integration work. The constraints are equally material: every item must be taggable, ceiling hardware must
              be installed, enterprise systems must be integrated, and chain-scale buyers can demand pricing
              concessions. Public pricing is absent, and independent aggregate effectiveness data was withheld from
              CNBC. For valuation, the decisive market questions are therefore contract value, hardware and deployment
              burden, sales-cycle length, renewal economics, and proof that the apparel wedge can expand without eroding
              margins.
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
