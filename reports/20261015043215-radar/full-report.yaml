            body: >-
              The assigned evidence shows real store-scale deployment and customer ROI anecdotes, but it still omits the
              metrics needed to judge revenue quality: ARR, realized pricing, retention, gross margin, CAC efficiency,
              burn, and runway.
            calloutType: risk
            claimRefs:
              - CI005
              - CI008
              - CI010
              - CI011
              - CI015
          - type: callout
            title: The key financial debate is hardware drag versus analytics leverage
            body: >-
              If RADAR is shifting from installation-heavy revenue toward high-attach analytics subscriptions, the
              current valuation can look more reasonable; if deployments remain the economic center of gravity, the same
              store count says much less about long-term margins.
            calloutType: insight
            claimRefs:
