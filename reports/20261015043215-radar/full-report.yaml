  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is concentrated in large enterprise retailers
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not show a broad long-tail customer base. Instead, it consistently points to an
              enterprise-sales motion aimed at Fortune 500 retailers with large physical footprints, especially apparel
              chains where item-level RFID is already economically viable. RADAR's own 2025 launch release says the
              platform already powered more than 650 retail stores in the U.S. and Canada, while the AMD case study says
              the company primarily works with Fortune 500 retailers with more than 500 stores and at least $2 billion
              in revenue. Publicly named accounts are concentrated around American Eagle and Old Navy, which is good
              evidence of real deployment quality but also a warning that the visible customer set remains narrow and
              category-specific rather than diversified across many retail verticals.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU011
              - CU015
              - CU016
      - number: '6.2'
        title: Public adoption proof is real, but outcome evidence is still anecdotal
        blocks:
          - type: paragraph
            body: >-
              There is enough evidence to conclude that RADAR has moved well beyond demo-stage customer proof. American
              Eagle is repeatedly cited as the first retailer to deploy the platform chainwide, Mark Wieman's case-study
              retrospective ties the early rollout to a 500-store launch, and multiple 2026 sources place RADAR above
              1,400 deployed stores including Old Navy. The problem is not whether customers exist; it is how much of
              the performance narrative remains company-shaped. CNBC relays a reported drop in
              buy-online-pick-up-in-store cancellations from 25% to 3%, Omni Talk relays a retailer example of
              fulfillment improving from roughly 70% to 98%, and CNBC also cites a single-store 60% shrink reduction.
              These are directionally positive signals, but they lack denominator, customer identity, and portfolio-wide
              replication data.
