        title: >-
          Capability and commercial tradeoffs favor RADAR on refresh depth, not on transparency or procurement
          simplicity
        blocks:
          - type: paragraph
            body: >-
              RADAR’s product breadth is wider than periodic RFID counting: the company now frames the platform as a
              store operating system spanning replenishment, fitting-room analytics, dwell-time measurement, and
              corporate dashboards. That gives it a stronger value proposition than manual counts or simpler reader
              stacks when buyers care about continuous refresh and downstream analytics. The commercial comparison is
              much murkier. There is no public rate card, and the best available evidence only supports a directional
              shift from hardware-led selling toward recurring analytics subscriptions. For a buying committee, that
              means the product can look differentiated on capability while still being hard to benchmark on realized
