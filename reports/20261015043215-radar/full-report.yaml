      - number: '5.3'
        title: Differentiation, roadmap, and open product risks
        blocks:
          - type: paragraph
            body: >-
              RADAR's differentiation is the end-to-end stack: proprietary sensing, location software, and analytics
              packaged as one system instead of as a thin overlay on existing readers. That creates real commercial
              proof in current apparel deployments and gives the company a plausible data moat if the reported event
              volume is durable. It also concentrates risk in rollout-heavy execution: ceiling installation, item
              tagging, and category fit are still gating assumptions, and the public roadmap pushes into next-generation
              hardware, autonomous checkout, and possible adjacency categories before the assigned evidence shows
              independent validation of security, privacy, uptime, or non-apparel production performance. For diligence,
              the product question is less "does it work in apparel?" and more "how portable and supportable is the
              model when the environment gets messier or the install economics tighten?"
            claimRefs:
