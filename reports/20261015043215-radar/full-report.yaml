        title: Leadership bench, financing, and key counterparties
        blocks:
          - type: paragraph
            body: >-
              Leadership remains founder-centric. CNBC and Teardown both trace RADAR back to Spencer Hewett and a 2013
              founding story shaped by the Thiel Fellowship, while the refreshed 2025-2026 evidence shows the company
              adding a more conventional late-stage bench around him. TechStartups and Citybiz tie the Series B
              announcement to the hiring of Abi Viswanathan as CFO, and Fundz records earlier executive additions
              including Zach Little as CTO, Morgan Levine as general counsel, and Jonathan Aitken as senior vice
              president of the RFID Center of Excellence. Capital formation also became clearer in this refresh window:
              independent reporting converges on a $170 million Series B at unicorn valuation, while Teardown rolls
              cumulative capital to roughly $233 million. Publicly named investors and strategic retail relationships
              are useful diligence anchors, but the available sources still do not disclose board composition, control
              terms, or the full cap table.
