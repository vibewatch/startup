      - number: '1.3'
        title: Momentum since 2023 and the remaining proof burden
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern is consistent with a company that spent years building hardware and only recently
              accelerated: a 2023 Series A, 2024 leadership expansion, a 2025 Old Navy rollout and RADAR+ analytics
              launch, and then the May 2026 unicorn round. That trajectory matters because RADAR now has visible
              customer references and a broader product story, not just a prototype narrative. The caution is that the
              public story still leans heavily on company or interview-sourced operating claims. CNBC notes RADAR
              declined to share overall customer-effectiveness data, Omni Talk explicitly says a reported 60% shrink
              reduction came from a retailer rather than from RADAR itself, and Teardown frames the unresolved question
              as whether overhead-sensor economics and deployment services can scale before lower-cost alternatives
              erode pricing. For later chapters, the overview takeaway is simple: commercial relevance looks real, but
              investor confidence still depends on private financial and governance diligence.
