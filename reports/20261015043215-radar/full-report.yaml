        title: Exhibits
        blocks:
          - type: callout
            title: The market-size claim is not yet underwritten
            body: >-
              Store count and global commerce volume cannot be converted into TAM, SAM, SOM, or revenue without
              eligible-location counts, contract values, deployment economics, and renewal evidence.
            calloutType: risk
            claimRefs:
              - CM003
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: RADAR competes against substitute stacks more than a single obvious public twin'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not surface a clean public list of same-product, same-scale ceiling-RFID
              rivals. Instead, the comparison set breaks into substitute classes that attack the same buyer problem from
              different angles: status-quo handheld or gate RFID processes, shelf-scanning robots, vision-first
              autonomous-store systems, and incumbent RFID reader or platform ecosystems already embedded in retail
              workflows. That matters because buyers can solve the same inventory-visibility job without choosing
              another company that looks exactly like RADAR. Publicly, RADAR’s strongest proof points are its
              >1,400-store footprint and anchor accounts at American Eagle and Old Navy, but those same references also
              show how much the company’s current competitive posture is concentrated in chain-scale apparel retail.
