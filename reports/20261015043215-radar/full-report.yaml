  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Documented product surface and store workflow
        blocks:
          - type: paragraph
            body: >-
              The retained evidence describes RADAR as an integrated retail-inventory product rather than a point
              feature. Company and media sources converge on the same basic workflow: ceiling-mounted sensing tracks
              RFID-tagged items, software exposes item location to associates, and the newer analytics layer turns
              movement data into store and corporate operating signals. The product surface is no longer only "find the
              item"; RADAR+ adds fitting room, replenishment, misplaced-item, and hourly store-intelligence features,
              while production references from American Eagle and Old Navy show the company has moved beyond pilot-stage
              demos into scaled apparel deployments. That said, the public proof is still concentrated in apparel use
              cases, so current maturity looks strongest where merchandise is already RFID-tagged and omnichannel
              fulfillment makes item-level visibility immediately valuable.
            claimRefs:
