  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >
              The evidence supports three top-tier risks. First, the unit-economics question is still open: Teardown
              argues the central issue is whether RADAR can hold overhead-sensor economics once chain-scale retailers
              push for pilot-to-portfolio pricing concessions, and whether lighter software overlays can undercut the
              cost of owning the ceiling. Second, commercial proof still clusters around anchor apparel accounts rather
              than a broad cross-vertical base, even though RADAR now cites more than 1,400 stores and has raised a $170
              million Series B at a valuation above $1 billion. Third, the product surface is widening from inventory
              tracking into shopper-behavior analytics, autonomous checkout, and international expansion faster than
              public compliance and governance materials appear in the assigned evidence. Those three risks are
              monitorable and are the ones most likely to decide whether the current valuation compounds or compresses.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR011
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory and governance exposure
        blocks:
          - type: paragraph
            body: >
              The regulatory and legal risk is less about a known enforcement event and more about an expanding exposure
              surface with incomplete public controls evidence. Y Combinator's company profile says RADAR aims to
              "measure all customer-product interactions," and the 2025 RADAR+ launch adds tracking for fitting-room
              activity, customer dwell behavior, and product movement. Citybiz then reports that the Series B funds
              autonomous checkout work and expansion into Canada, EMEA, and Latin America. That combination means RADAR
              is moving into more jurisdictions and richer operational datasets at the same time. The retained evidence
              also shows that RADAR has added finance and legal leadership, but it does not surface the trust artifacts
              an enterprise diligence process would typically expect, such as data-retention commitments, regional
              privacy mappings, or security attestations. Until those documents are produced, compliance readiness
              should be treated as a diligence path rather than an assumed strength.
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >
              Operational risk follows directly from RADAR's architecture and customer mix. Teardown describes the
              company as an end-to-end vendor that retrofits store ceilings with proprietary sensors, cabling, and
              deployment services; that can be a moat if the analytics layer becomes indispensable, but it can also
              become a margin drag if enterprise buyers treat hardware as negotiable and compare RADAR against
              incumbents that reuse existing RFID estates. ABI Research's 2026 write-up on GreyOrange shows that
              overhead RFID-enabled retail inventory platforms already compete with broader partner ecosystems and
              easier embedding into POS, OMS, ERP, and WMS stacks. Meanwhile, the best public outcome claims remain
              selective: OmniTalk relays retailer-reported shrink and fulfillment gains, and CNBC says RADAR declined to
              share portfolio-wide effectiveness data. That leaves a real proof-quality gap between impressive anecdotes
              and repeatable, audited operating performance.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR013
      - number: '7.4'
        title: Kill criteria and diligence path
        blocks:
          - type: paragraph
            body: >
              The Series B reduces financing risk in the short run, and the CFO appointment suggests the company is
              preparing for a more disciplined scaling phase, but the most important de-riskers are still unproven in
              public. A pass result would require management to show how much of revenue and gross margin now comes from
              recurring software and analytics rather than installs, to disclose whether production usage extends beyond
              the same anchor apparel banners cited publicly today, and to produce privacy, security, and governance
              materials consistent with a business that tracks shopper behavior and wants to expand internationally. A
              fail result would be a next diligence cycle that still cannot show those metrics or artifacts, because
              that would mean the $1 billion valuation is resting on store-count growth and retailer anecdotes before
              the business model, controls, and concentration profile are adequately evidenced.
            claimRefs:
              - CR005
              - CR007
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              If management cannot demonstrate improving software mix or gross margin while also showing non-anchor
              production deployments outside specialty apparel, the strongest public evidence continues to point to a
              hardware-heavy rollout story priced ahead of durable economics.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Fastest de-riskers
            body: >-
              The cleanest diligence wins would be enterprise trust and privacy artifacts, quantified
              customer-concentration and renewal data, and cohort-level outcome reporting that goes beyond one-off
              shrink or fulfillment anecdotes.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              RADAR looks more credible than a typical retail-tech pitch because the public record shows a live scaled
              deployment, not just pilots or conceptual AI claims. CNBC and Teardown both place the platform in more
              than 1,400 stores with named anchors including American Eagle and Old Navy, while round coverage
              consistently confirms a $170M Series B at a valuation above $1B. That operating proof matters, but the
              underwriting problem is still price sensitivity: public evidence does not disclose ARR, gross margin, net
              retention, or cap-table preferences, so the last round cannot be bridged to durable economics the way a
              software or infrastructure investor would normally require. The defensible public-evidence call is
              therefore research-more, with high risk and entry discipline set at either materially better pricing or a
              private diligence pack that closes the missing KPI set.
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Financing context and what the round proves
        blocks:
          - type: paragraph
            body: >-
              The financing round proves investor appetite for a hardware-plus-AI retail infrastructure thesis, not that
              the current valuation is already validated by disclosed financials. Multiple sources confirm the May 2026
              Series B terms, and Fundz records a prior $30M Series A plus a March 2025 venture round, showing that
              RADAR has been capitalized for a long hardware buildout before reaching unicorn status. The June 2025
              RADAR+ launch also matters because it widens the thesis from inventory visibility into analytics around
              dwell time, replenishment, and productivity, which is where recurring value could deepen. Even so, the
              public sources still frame the company in product and rollout terms rather than revenue quality terms, so
              the round demonstrates category excitement and customer proof more than it demonstrates mature,
              software-like monetization.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: Scenarios and comparable lens
        blocks:
          - type: paragraph
            body: >-
              The most useful public comparable lens is not retail SaaS but hardware-plus-AI infrastructure, which is
              exactly how one financing recap framed the round when it compared RADAR to companies such as Anduril and
              Shield AI. That framing is directionally helpful because it explains why investors may pay for proprietary
              sensors plus a compounding data layer, yet it does not solve the underwriting problem because the public
              record still omits the revenue mix between installs and recurring analytics. The bull case is that
              store-scale proof, customer workflow ROI, and the newer analytics layer convert into broader,
              higher-margin platform economics. The bear case is that price concessions, service-heavy deployment, and
              concentration in specialty apparel keep the business looking more like a capital- intensive systems
              integrator than a compounding software platform.
            claimRefs:
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The missing work is straightforward and important. Before paying anywhere near the last round, investors
              need a management packet that discloses ARR or equivalent recurring revenue, gross margin by hardware
              versus software, customer concentration, renewal behavior, burn and runway, and the exact preference stack
              created by prior financings. Fundz's headcount snapshot suggests the organization is still relatively
              compact for a business claiming 1,400+ stores, which makes deployment cadence, services intensity, and
              support economics worth pressure-testing directly. The thesis should be reconsidered if management cannot
              show that analytics revenue is becoming the margin engine, if new deployments remain confined to a narrow
              customer set, or if the next financing arrives without materially better KPI transparency.
            claimRefs:
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence call
            body: >-
              Keep RADAR in diligence, but do not treat the last round as validated fair value. The public record
              supports continued work on the company, not a price-clearing investment memo.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
          - type: callout
            title: The valuation fight is about economics, not demand
            body: >-
              Demand proof exists; the open question is whether a hardware-led deployment model can convert that proof
              into durable recurring margins before the next financing or exit window.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV016
