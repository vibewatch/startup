      - number: '6.3'
        title: Durability and expansion still depend on proof beyond anchor apparel chains
        blocks:
          - type: paragraph
            body: >-
              The durability question is still under-documented in public evidence. None of the retained sources
              discloses NRR, GRR, churn, renewal timing, contract length, or customer-level revenue concentration, so
              the public record cannot distinguish sticky recurring software economics from hardware-heavy rollout
              revenue. Teardown's independent analysis frames the core commercial risk clearly: RADAR has real chain
              references, but the moat still has to survive price pressure, long enterprise sales cycles, and expansion
              beyond apparel into new verticals. That makes the current customer story investable as adoption proof, but
              not yet durable enough to underwrite customer concentration or long-term expansion assumptions without
              management data.
            claimRefs:
              - CU007
              - CU012
              - CU013
              - CU014
