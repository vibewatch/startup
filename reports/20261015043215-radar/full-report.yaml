  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation flows from real deployment proof and financing momentum into a still-unresolved underwriting
      gap on recurring economics and capital structure.
    data:
      nodes:
        - id: priced-round
          label: Last priced round
          value: $170M Series B at >$1B
          note: Confirmed by multiple public sources.
        - id: operating-proof
          label: Operating proof
          value: 1,400+ stores
          note: Named anchor customers and reported workflow outcomes.
        - id: platform-upside
          label: Platform upside
          value: RADAR+ analytics
          note: Roadmap adds higher-value software and automation surfaces.
        - id: org-depth
          label: Scaling depth
          value: ~189 employees
          note: Public org snapshot still looks compact for the claimed footprint.
        - id: underwriting-gap
          label: Underwriting gap
          value: No public ARR / margin / NRR / preference data
          note: Price cannot be bridged to durable economics from public sources alone.
        - id: recommendation
          label: Current call
          value: Research-more
          note: Require better KPI disclosure or a materially better entry price.
      edges:
        - from: priced-round
          to: operating-proof
          label: capital validates demand
        - from: operating-proof
          to: platform-upside
          label: proof supports upside
        - from: platform-upside
          to: org-depth
          label: must scale through team
        - from: org-depth
          to: underwriting-gap
          label: execution capacity still needs proof
        - from: underwriting-gap
          to: recommendation
          label: missing economics block conviction
