      - number: '5.2'
        title: Architecture and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The clearest technical evidence comes from the RS510 user manual and the supporting product descriptions.
              The system depends on tagged inventory, ceiling-mounted proprietary sensors, PoE++ Ethernet power, and
              software control over the store network. Those choices explain why RADAR can claim continuous location
              awareness instead of periodic handheld scans, but they also mean the product is operationally heavier than
              a software-only analytics layer. Installation, RF exposure rules, and commercial-space compliance are
              explicit in the manual, so deployment is not just a SaaS login; it is a hardware retrofit that requires
              store infrastructure, disciplined tagging, and reliable network operations to keep the data layer useful.
            claimRefs:
              - CE001
              - CE002
