      - number: '3.3'
        title: Moat durability depends on whether analytics scale faster than deployment burden
        blocks:
          - type: paragraph
            body: >-
              The best independent adverse evidence in the pool is structural, not a customer complaint: hardware-heavy
              retail AI has a history of pivots, shutdowns, and margin skepticism. Teardown’s argument is useful because
              it makes the real underwriting question explicit. If RADAR’s analytics and workflow layer become the
              enduring source of value, the ceiling retrofit can look like a defensible installation wedge. If not, then
              the same ceiling ownership that differentiates RADAR also becomes the cost burden a lighter competitor can
              attack. That is why the most credible entrant profile in the current evidence is not another fully
              integrated clone, but a thinner analytics layer built on hardware retailers already own, or a
              vertical-specific entrant that applies similar architecture in better-tagged, higher-value environments.
