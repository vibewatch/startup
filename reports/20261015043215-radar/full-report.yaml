chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              RADAR presents itself as a vertically integrated hardware-plus-software platform for physical retail,
              using overhead RFID sensing and analytics to track item movement in real time. Across the company
              homepage, Business Wire launch material, and independent funding coverage, the stable identity is a
              private New York retail-technology company led by founder Spencer Hewett and focused on inventory
              visibility, replenishment, fulfillment support, and in-store analytics. The strongest externally
              corroborated scale signal is deployment breadth rather than disclosed revenue: multiple independent
              outlets place the installed base above 1,400 stores and specifically name American Eagle and Old Navy as
              anchor accounts. That makes RADAR look like a genuine growth-stage Series B infrastructure vendor, but
              still not like a fully transparent software company because the public record emphasizes footprint and
              accuracy claims far more than recurring-revenue disclosure.
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO007
              - CO009
