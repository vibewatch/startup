  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              RADAR's relevant market is the enterprise system that turns RFID-tagged store inventory into continuous
              location and workflow intelligence. The offer combines ceiling-mounted sensing, software, and analytics;
              the included value pools are inventory visibility, replenishment, omnichannel fulfillment, loss-prevention
              triage, and merchandising analytics. Generic digital-radar or defense-radar estimates are excluded because
              they describe a different technology and buyer. Broad retail ERP, warehouse-management, RFID-tag
              manufacturing, and generic marketing-AI spend are also excluded unless RADAR captures that budget
              directly. The status quo is periodic counting, handheld or portal-based RFID, and fragmented incumbent
              hardware plus retailer-built analytics. This boundary makes the addressable wedge narrower than "physical
              retail AI," while preserving adjacent upside in checkout and non-apparel categories as unproven options.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM011
              - CM013
      - number: '2.2'
        title: Sizing without false precision
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports scale markers, not a market-value calculation. RADAR and syndicated
              coverage cite physical stores as roughly 80% of global commerce, but that denominator is commerce value
              rather than spend on inventory-intelligence systems. More than 1,400 deployed stores is a useful
              commercial lower-bound marker, yet store count cannot be converted into revenue or SOM without contract
              value, rollout mix, and pricing. The retained relevant sources provide neither a category value nor CAGR,
              and no source separates specialty-apparel SAM from broader retail. Accordingly, the analysis uses a
              hierarchy of evidence rather than fabricated TAM/SAM/SOM values: current deployments, the RFID-ready
              apparel wedge, geographic expansion, and category adjacencies whose tagging economics remain unproven.
            claimRefs:
              - CM003
              - CM013
              - CM014
              - CM016
