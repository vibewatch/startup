    summary: >-
      The public record shows a long hardware incubation period followed by a tighter cluster of commercialization,
      leadership, and financing milestones from 2023 through 2026.
    data:
      items:
        - date: '2013'
          label: RADAR founded
          detail: >-
            CNBC and Teardown both trace the company to a 2013 founding by Spencer Hewett after the Thiel Fellowship
            period.
          claimRefs:
            - CO002
        - date: 2023-07
          label: Series A closes
          detail: >-
            Fundz records a $30M Series A, marking the first clearly disclosed institutional scale-up round in the
            retained set.
          claimRefs:
            - CO006
        - date: '2024-07-23'
          label: CTO and GC appointments
          detail: >-
            Fundz records Zach Little as CTO and Morgan Levine as general counsel, signaling deeper functional
            specialization.
          claimRefs:
            - CO011
        - date: '2025-03-26'
          label: Old Navy rollout announced
          detail: >-
            Fundz lists the Old Navy partnership announcement, which later becomes a core proof point in third-party
            funding coverage.
          claimRefs:
            - CO009
        - date: '2025-06-30'
          label: RADAR+ launches
          detail: >-
            Business Wire says the analytics layer extends core inventory tracking into store-intelligence workflows and
            corporate visibility.
          claimRefs:
            - CO004
        - date: '2026-01-09'
          label: RFID Center of Excellence leadership added
          detail: >-
            Fundz records Jonathan Aitken joining as senior vice president, reinforcing deployment-oriented depth ahead
            of the Series B.
          claimRefs:
            - CO011
        - date: '2026-05-19'
