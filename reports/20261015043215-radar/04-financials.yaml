schemaVersion: "report-v2"
artifact: financials
slug: radar
runDate: 2026-10-15
company:
  name: RADAR
chapter:
  number: 4
  title: Financials
  summary: >-
    RADAR has real public traction signals—more than 1,400 stores deployed, a May 2026
    $170 million Series B at a $1 billion valuation, and customer outcome anecdotes around
    shrink and fulfillment—but the public package still stops well short of underwriting-grade
    disclosure. The available evidence supports a hybrid hardware-plus-software revenue model
    and clear forward investment needs, while leaving ARR, revenue mix, gross margin, burn,
    runway, and payback materially unresolved.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model is clearly hybrid, but public monetization disclosure is thin
    body: |-
      Public sources consistently describe RADAR as a vertically integrated stack that combines
      ceiling-mounted RFID sensing, software, and analytics rather than a single-feature point
      solution. That makes the commercial model legible at a high level: there is almost
      certainly hardware and deployment revenue at installation, plus a recurring software or
      analytics layer once stores are live. What remains missing is the investor-relevant split
      between those layers. Teardown explicitly says RADAR has no public rate card and frames
      the model as upfront or amortized sensor economics plus an ongoing subscription, while the
      2025 RADAR+ launch suggests management is trying to deepen the recurring analytics layer
      beyond core inventory tracking. In other words, the mechanism of monetization is visible,
      but neither list price nor realized contract structure is publicly disclosed.
    claimRefs: [CI004, CI007, CI008, CI009]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-commercial-efficiency-proxies
    title: Public operating proof points show buyer value, but not revenue quality
    body: |-
      RADAR's public evidence is strongest on operational outcomes rather than on recognized
      revenue. The May 2026 financing announcement says the system was already deployed across
      more than 1,400 stores, and both CNBC and Omni Talk report examples of better fulfillment,
      lower cancellation rates, or reduced shrink after deployment. Those examples matter because
      they explain why a retailer would tolerate the friction of sensor installation and change
      management. They do not, however, answer whether those wins translate into high-margin,
      durable software revenue or whether they mainly justify capital-intensive deployments.
      The gap between customer-outcome anecdotes and disclosed financial quality is the core
      issue in this chapter: RADAR has public proof that customers care, but not public proof
      that investors can underwrite the economics.
    claimRefs: [CI005, CI006, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-needs-and-disclosure-gaps
    title: Fresh capital funds expansion, but capital adequacy is still not underwritable
    body: |-
      The latest round clearly gives RADAR the balance-sheet capacity to keep deploying, hiring,
      and extending the product surface, and management has already tied the proceeds to hardware,
      AI analytics, autonomous checkout, and international growth. That is the positive case.
      The harder underwriting question is whether the new capital is comfortable acceleration
      capital or a requirement of a hardware-heavy rollout model whose margin profile remains
      opaque. Public evidence does not disclose cash on hand, monthly burn, runway, debt,
      installation working-capital strain, or hardware-versus-software gross margin. Even the
      cumulative funding base is not fully reconciled across sources: Teardown cites $233 million
      raised, while Fundz's listed rounds sum to $215 million. That mismatch is manageable in a
      narrative report, but it is unacceptable in a diligence process without management backup.
    claimRefs: [CI001, CI002, CI003, CI013, CI014, CI015]
  - id: financial-verdict
    title: Financial verdict
    body: |-
      The available evidence supports a credible revenue engine in the sense that retailers are
      adopting the system, management is investing in analytics upsell, and the Series B gives
      the company room to keep scaling. It does not support a clean judgment on revenue quality,
      margin trajectory, or capital intensity. RADAR looks more promising than proven on the
      dimensions a growth investor would need to anchor a $1 billion valuation: ARR composition,
      software attachment, cohort retention, gross margin by layer, CAC efficiency, and burn
      discipline. Until those figures are disclosed, the fairest conclusion is that RADAR may be
      building a valuable hybrid retail-infrastructure company, but the public record is still a
      diligence lead, not an underwriting package.
    claimRefs: [CI008, CI009, CI012, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - ["Core inventory platform", "Continuous item-level location and replenishment/fulfillment workflows", "Per deployed store / enterprise contract", "Live in 1,400+ stores; no public revenue split", "Mechanism visible, monetization mix undisclosed", "Provide ARR by product line and store cohort."]
      - ["Sensor hardware + installation", "Ceiling-mounted RFID/computer-vision sensor grid plus deployment services", "Per store install", "Series B proceeds earmark hardware advancement; no public hardware pricing", "Hardware layer clearly exists, but economics are undisclosed", "Provide hardware BOM, install cost, and capitalized-vs-expensed policy."]
      - ["RADAR+ analytics", "Hourly store metrics, fitting-room/dwell analytics, replenishment prioritization", "Likely recurring software add-on", "Launched June 2025; no attach rate or module pricing disclosed", "Supports upsell thesis, but commercial traction is unquantified", "Provide module attach, realized price uplift, and renewal data."]
      - ["Future checkout / AI modules", "Autonomous checkout and expanded AI analytics roadmap", "Roadmap / pilot basis", "Funded priority, not publicly commercialized", "Strategic option value only", "Provide pilot count, target launch timing, and incremental margin expectations."]
    notes: >-
      Public sources show the product layers and funding priorities, but they do not disclose
      revenue mix, contract structure, or realized monetization by layer.
    claimRefs: [CI003, CI004, CI007, CI008, CI009]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / contract element
      - Public evidence
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["List pricing", "Teardown says RADAR has no public rate card.", "No list price disclosed", "No public SKU, store, or enterprise rate card", "SI003"]
      - ["Commercial structure", "Third-party framing points to upfront or amortized hardware/deployment plus ongoing software/analytics subscription.", "Structure inferred; values undisclosed", "No public contract length, minimum-store commitment, or financing terms", "SI003"]
      - ["Analytics monetization", "RADAR+ adds replenishment, dwell, and planning analytics that could support higher recurring fees.", "No module pricing disclosed", "No evidence on attach rate or packaging", "SI001"]
      - ["Outcome-linked ROI proof", "Public case examples show fulfillment/cancellation/shrink improvements, but not what customers paid to achieve them.", "ROI proxies only", "No realized pricing, discounting, or payback disclosure", "SI004 / SI005"]
    notes: >-
      Public evidence describes what buyers may be paying for, not what they actually pay or how
      long contracts run; pricing cells marked unknown are genuine disclosure gaps rather than omissions.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["ARR", null, "Unavailable publicly", "Core test of software quality and valuation support", "Monthly ARR bridge by product/module and gross retention."]
      - ["Gross margin by hardware vs. software", null, "Unavailable publicly", "Determines whether deployments create or dilute software-like economics", "Segment gross margin, installation margin, and services mix."]
      - ["CAC / payback", null, "Unavailable publicly", "Enterprise rollout economics depend on sales cycle and deployment burden", "Fully loaded CAC, sales cycle, and payback by customer cohort."]
      - ["Inventory accuracy / service promise", "99% item-level accuracy; full inventory snapshot every eight seconds", "Company-claimed", "Explains buyer value proposition and workflow automation potential", "Third-party validation of sustained accuracy and labor savings."]
      - ["Deployment footprint", ">1,400 stores; >100 billion item-level events per day", "Corroborated footprint, company-claimed throughput", "Shows scale and data density, but not per-store economics", "Store growth by cohort, same-store retention, and churn."]
      - ["Customer outcome proxy", "BOPIS cancellations 25%→3%; one retailer fulfillment ~70%→98%; one retailer shrink -60%", "Case-study / anecdotal", "Potential ROI signal that could justify enterprise spend", "Portfolio-weighted before/after results and methodology."]
    notes: >-
      Nulls indicate metrics the assigned public evidence does not disclose; case-study rows are
      operational proxies, not substitutes for ARR, margin, or payback.
    claimRefs: [CI005, CI006, CI010, CI011, CI012, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a hardware-plus-software revenue bridge from RFID-tagged inventory
      to operational workflows and analytics, but not the actual price or margin captured at each step.
    data:
      nodes:
        - id: tagged-items
          label: Tagged store inventory
          detail: Apparel and other tagged merchandise becomes the observable input that RADAR can monitor continuously in-store.
        - id: sensor-grid
          label: Overhead sensor grid
          detail: Proprietary ceiling-mounted RFID / computer-vision hardware creates the installed base and deployment burden.
        - id: core-platform
          label: Core inventory platform
          detail: Real-time location, eight-second inventory snapshots, replenishment, and fulfillment logic.
          value: "99% item-level accuracy"
        - id: analytics
          label: RADAR+ analytics
          detail: Hourly store metrics, dwell/fitting-room signals, replenishment prioritization, and lean-inventory planning.
        - id: workflows
          label: Retail operating workflows
          detail: BOPIS, ship-from-store, loss prevention, merchandising, and staffing decisions.
        - id: monetization
          label: Monetization layers
          detail: Public evidence implies upfront or amortized hardware/install economics plus ongoing software and analytics subscriptions, but no public rate card exists.
      edges:
        - from: tagged-items
          to: sensor-grid
          label: Tagged merchandise makes the store observable
        - from: sensor-grid
          to: core-platform
          label: Sensor reads become inventory location data
        - from: core-platform
          to: analytics
          label: Core event stream feeds analytics modules
        - from: analytics
          to: workflows
          label: Insights drive operational actions
        - from: workflows
          to: monetization
          label: Buyer ROI supports hardware + software spending
    approximationNotes: >-
      The bridge reflects disclosed product layers and inferred commercialization logic, not a
      published contract waterfall or quantified gross-profit walk.
    claimRefs: [CI004, CI006, CI007, CI009]
callouts:
  - calloutType: risk
    title: Public traction is ahead of public financial disclosure
    body: >-
      The assigned evidence shows real store-scale deployment and customer ROI anecdotes, but it
      still omits the metrics needed to judge revenue quality: ARR, realized pricing, retention,
      gross margin, CAC efficiency, burn, and runway.
    claimRefs: [CI005, CI008, CI010, CI011, CI015]
  - calloutType: insight
    title: The key financial debate is hardware drag versus analytics leverage
    body: >-
      If RADAR is shifting from installation-heavy revenue toward high-attach analytics
      subscriptions, the current valuation can look more reasonable; if deployments remain the
      economic center of gravity, the same store count says much less about long-term margins.
    claimRefs: [CI007, CI009, CI015]
