  data:
    xAxis: Continuous visibility and workflow breadth (0-10 ordinal)
    yAxis: Deployment burden / retrofit intensity (0-10 ordinal; higher = heavier)
    points:
    - label: RADAR
      x: 9
      y: 9
      detail: Continuous ceiling-based item visibility plus analytics, but with proprietary hardware and store-by-store deployment.
    - label: Periodic handheld / gate RFID
      x: 3
      y: 2
      detail: Lower-friction incumbent process, but no source-backed continuous refresh or fitting-room analytics.
    - label: Shelf-scanning robots (Simbe-type)
      x: 6
      y: 7
      detail: Targets the same shelf-awareness job with robotics rather than a ceiling retrofit, especially in grocery and mass.
    - label: Installed RFID platforms / reader ecosystems
      x: 5
      y: 4
      detail: Leverages entrenched reader estates and incumbent vendor relationships, but the assigned evidence does not show equivalent end-to-end refresh depth.
    - label: Vision-first autonomous-store entrants
      x: 7
      y: 8
      detail: Potentially broad behavioral instrumentation, but public category evidence is dominated by pivots, scrutiny, and shutdowns.
    - label: Integrator-built analytics on existing Zebra / Impinj hardware
      x: 6
      y: 5
      detail: The clearest undercut path is software that rides hardware retailers already own instead of owning the ceiling.
