- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Option
  - Public price / contract signal
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - RADAR
    - No public rate card; commentary implies hardware plus ongoing analytics/subscription economics
    - Ceiling sensors, software platform, analytics, and deployment services
    - Realized per-store pricing, margin mix, and discounting undisclosed
    - Capability-led sale may clear for chains that value continuous refresh, but CFO benchmarking is hard
  - - Periodic handheld / gate RFID
    - Uses existing operating process or familiar hardware refresh cycles
    - Snapshot counts and exception finding
    - No public like-for-like TCO in assigned pool
    - Cheaper-feeling baseline can still win if hourly or daily accuracy is good enough
  - - Shelf-scanning robots
    - No public rate card in assigned pool
    - Automated shelf visibility via robot workflow
    - Commercial structure undisclosed in assigned pool
    - Alternative can frame the problem as robotics rather than ceiling retrofit
  - - Installed RFID platforms / integrator stack
    - Often leverages hardware or software already in estate; exact package undisclosed here
    - Readers, portals, analytics layers, or integrator-built workflows
    - Outcome guarantees and refresh cadence unclear in assigned pool
    - Incumbent estates create a natural underwrite-against baseline for procurement teams
  - - Vision-first entrants
    - Commercial model not supportable from assigned evidence
    - Camera-led store instrumentation and, in some cases, checkout automation
    - Recent pivots and shutdowns make durable package economics unclear
    - Execution risk can narrow the set of credible non-RADAR challengers even if conceptually adjacent
