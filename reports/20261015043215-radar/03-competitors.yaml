figures:
- id: FP001
  title: Competitive positioning map
  type: quadrant
  summary: 'Ordinal map of the current substitute set: RADAR leads on continuous visibility breadth, while lighter alternatives usually reduce deployment burden.'
  approximationNotes: Axis values are ordinal judgments from assigned public evidence, not measured market share or benchmark scores. Higher x means more continuous item-level visibility and workflow breadth; higher y means heavier deployment burden and infrastructure retrofits.
