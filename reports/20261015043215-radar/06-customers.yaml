schemaVersion: report-v2
artifact: customers
slug: radar
runDate: 2026-10-15
company:
  name: RADAR
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof shows RADAR selling into very large North American retailers,
    with American Eagle and Old Navy as the anchor named accounts and store-count
    evidence rising from more than 650 stores in mid-2025 to more than 1,400 stores
    by mid-2026. The strongest outcome anecdotes are meaningful but still sample-based:
    public sources cite better fulfillment, lower shrink, and 500+ location rollouts,
    while leaving retention, customer concentration, and contract economics largely
    undisclosed.
sections:
  - id: customer-segments-and-buyer-profile
    title: Customer base is concentrated in large enterprise retailers
    body: >-
      The assigned evidence does not show a broad long-tail customer base. Instead, it
      consistently points to an enterprise-sales motion aimed at Fortune 500 retailers
      with large physical footprints, especially apparel chains where item-level RFID is
      already economically viable. RADAR's own 2025 launch release says the platform
      already powered more than 650 retail stores in the U.S. and Canada, while the AMD
      case study says the company primarily works with Fortune 500 retailers with more
      than 500 stores and at least $2 billion in revenue. Publicly named accounts are
      concentrated around American Eagle and Old Navy, which is good evidence of real
      deployment quality but also a warning that the visible customer set remains narrow
      and category-specific rather than diversified across many retail verticals.
    claimRefs: [CU001, CU002, CU004, CU016]
    tableRefs: [TU001]
  - id: adoption-proof-and-operating-outcomes
    title: Public adoption proof is real, but outcome evidence is still anecdotal
    body: >-
      There is enough evidence to conclude that RADAR has moved well beyond demo-stage
      customer proof. American Eagle is repeatedly cited as the first retailer to deploy
      the platform chainwide, Mark Wieman's case-study retrospective ties the early
      rollout to a 500-store launch, and multiple 2026 sources place RADAR above 1,400
      deployed stores including Old Navy. The problem is not whether customers exist; it
      is how much of the performance narrative remains company-shaped. CNBC relays a
      reported drop in buy-online-pick-up-in-store cancellations from 25% to 3%, Omni
      Talk relays a retailer example of fulfillment improving from roughly 70% to 98%,
      and CNBC also cites a single-store 60% shrink reduction. These are directionally
      positive signals, but they lack denominator, customer identity, and portfolio-wide
      replication data.
    claimRefs: [CU003, CU005, CU006, CU008, CU009, CU010, CU011, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risk
    title: Durability and expansion still depend on proof beyond anchor apparel chains
    body: >-
      The durability question is still under-documented in public evidence. None of the
      retained sources discloses NRR, GRR, churn, renewal timing, contract length, or
      customer-level revenue concentration, so the public record cannot distinguish
      sticky recurring software economics from hardware-heavy rollout revenue. Teardown's
      independent analysis frames the core commercial risk clearly: RADAR has real chain
      references, but the moat still has to survive price pressure, long enterprise sales
      cycles, and expansion beyond apparel into new verticals. That makes the current
      customer story investable as adoption proof, but not yet durable enough to underwrite
      customer concentration or long-term expansion assumptions without management data.
    claimRefs: [CU007, CU012, CU013, CU014]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Large North American apparel chains
        - Enterprise merchandising, store-operations, and technology leaders; store associates are daily users
        - Inventory visibility, replenishment, BOPIS support, and shrink triage
        - More than 650 stores by 2025 and more than 1,400 stores by 2026 in public sources
        - Anchor deployments create referenceability and data-scale advantages
        - No public customer count, contract value, or revenue mix by chain
      - - Major retailer under partner case study
        - Enterprise retail operations teams
        - Inventory management, curbside pickup, and in-store shopping workflows
        - More than 500 locations at one major retailer
        - Shows RADAR can support a 500+ location estate rather than a boutique pilot
        - Retailer name is withheld in the AMD case study
      - - Early enterprise customers
        - Undisclosed billion-dollar retailers that were willing to test the platform early
        - First commercial inventory automation deployments
        - Three undisclosed enterprise customers targeted in 2019
        - Indicates early enterprise willingness to co-develop and adopt
        - Identities, production status, and renewal history are not public
      - - Corporate retail stakeholders
        - Store staff use the system in-store; corporate teams consume analytics and planning outputs
        - Hourly inventory, dwell-time, and recovery metrics for store and head-office decisions
        - Network-level visibility across deployed stores
        - Supports upsell from hardware deployment into analytics workflows
        - No public adoption data by user role, seat count, or feature attach rate
    notes: >-
      Mixes direct company statements with partner and media corroboration; "scale" reflects
      publicly cited store footprints, not disclosed customer counts or revenue.
    claimRefs: [CU001, CU004, CU011, CU015, CU016]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - First commercial deployment target
        - Three undisclosed enterprise customers
        - 2019
        - VentureBeat
        - medium
        - Earliest public evidence that RADAR was selling into enterprise retail rather than only prototyping
        - Customer names, go-live dates, and retention outcomes were not disclosed
      - - American Eagle rollout
        - 500 stores
        - 2023
        - Mark Wieman; Teardown
        - medium
        - Suggests the earliest visible pilot converted into meaningful chain expansion
        - No public ARR, contract term, or post-rollout expansion data
      - - Installed footprint
        - More than 650 stores in the U.S. and Canada
        - "2025-06-30"
        - RADAR via Business Wire
        - medium
        - Confirms a material production footprint before the 2026 fundraising round
        - Number of paying chains and stores per chain was not disclosed
      - - Installed footprint
        - More than 1,400 stores including American Eagle and Old Navy
        - "2026-05 to 2026-08"
        - CNBC; citybiz; Teardown
        - high
        - Implies substantial growth in deployed stores within roughly one year
        - Share of footprint represented by the top two customers is not public
      - - Fulfillment outcome example
        - BOPIS cancellation rates improved from 25% to 3%
        - "2026-05-19"
        - CNBC
        - medium
        - Ties inventory visibility to omnichannel order reliability
        - Customer identity, sample size, and baseline methodology are not public
      - - Fulfillment outcome example
        - Online order fulfillment improved from roughly 70% to 98%
        - "2026-06-04"
        - Omni Talk
        - medium
        - Supports the value proposition with a second operational outcome anecdote
        - Retailer name and measurement basis are not public
      - - Loss-prevention example
        - 60% shrink reduction at one store
        - "2026-05-19"
        - CNBC
        - low
        - Suggests upside beyond inventory lookup into shrink control
        - Single-store anecdote, not a disclosed portfolio-wide metric
    notes: >-
      Rows combine direct company, customer, media, and partner references; public data
      shows deployment milestones and selected anecdotes, not a complete customer cohort.
    claimRefs: [CU001, CU005, CU006, CU008, CU009, CU010, CU011, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - American Eagle Outfitters
        - Specialty apparel retail
        - Real-time inventory visibility and store-associate workflows across the chain
        - Production / fleetwide implementation
        - Named as the first retailer to implement RADAR across its stores; 500-store launch is corroborated in historical rollout evidence
        - Public sources do not disclose spend, renewal timing, or revenue contribution
      - - Old Navy
        - Large-format apparel retail
        - Multi-year rollout of RFID-powered inventory operations
        - Production / phased rollout
        - Public 2026 sources keep citing Old Navy inside the 1,400+ deployed-store footprint
        - Public evidence does not disclose customer-level KPI improvements or contract duration
      - - Unnamed major retailer / one retailer
        - Large enterprise retail
        - Inventory management, curbside pickup, shrink, and fulfillment use cases
        - Production at 500+ locations plus store-level outcome anecdotes
        - AMD cites a 500+ location deployment; CNBC and Omni Talk relay strong fulfillment and shrink anecdotes
        - Customer identity, replicability, and methodology remain undisclosed
    notes: >-
      Enumeration is intentionally partial because the assigned evidence publicly names only
      a subset of customers while leaving several important deployments anonymous.
    enumerationScope:
      coverage: partial
      basis: >-
        Sample of publicly named or clearly evidenced deployments drawn from the assigned
        2019-2026 source pool; not a complete customer list.
    claimRefs: [CU005, CU006, CU008, CU009, CU010, CU011, CU015, CU016]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The visible customer journey starts with enterprise pilots, expands into chainwide
      apparel rollouts, and then tests whether RADAR can upsell analytics and move beyond
      a narrow set of anchor retail accounts.
    data:
      items:
        - label: Enterprise pilot
          detail: >-
            Early public proof came from undisclosed enterprise retailers rather than a
            broad self-serve customer base.
          touchpoints:
            - Three undisclosed enterprise customers were targeted for first commercial deployment in 2019.
            - Two stealth customers invested in the early financing round.
        - label: Anchor apparel rollout
          detail: >-
            American Eagle is the earliest named chain reference and remains the clearest
            example of pilot-to-chain expansion.
          touchpoints:
            - American Eagle was the first retailer to implement RADAR across its stores.
            - Historical rollout evidence cites a 500-store American Eagle launch.
        - label: Chain-scale deployment
          detail: >-
            By 2025-26, public sources show RADAR operating at meaningful store-count scale.
          touchpoints:
            - RADAR cited more than 650 stores in the U.S. and Canada in June 2025.
            - Independent 2026 coverage cited more than 1,400 deployed stores including Old Navy.
        - label: Operations and fulfillment value
          detail: >-
            Public customer value stories focus on inventory certainty and order-reliability improvements.
          touchpoints:
            - CNBC relayed BOPIS cancellation improvement from 25% to 3%.
            - Omni Talk relayed fulfillment improvement from roughly 70% to 98%.
        - label: Analytics upsell
          detail: >-
            Management is trying to extend the customer relationship from hardware deployment
            into recurring analytics and workflow modules.
          touchpoints:
            - RADAR+ adds hourly metrics for corporate teams plus replenishment and dwell-time analytics.
            - AMD's case study says the hardware can unlock additional capabilities over the air over time.
        - label: Expansion test
          detail: >-
            The next commercial test is whether RADAR can diversify beyond anchor apparel chains
            without margin pressure or customer concentration overwhelming the model.
          touchpoints:
            - Teardown argues the moat depends on non-apparel production deployments and subscription mix.
            - Public sources still do not disclose retention or customer-concentration metrics.
    approximationNotes: >-
      Stages synthesize the public customer evidence into an ordered commercial path; they
      do not imply uniform conversion rates or equal revenue weight by stage.
    claimRefs: [CU001, CU005, CU006, CU011, CU012, CU013, CU014, CU015, CU016]
