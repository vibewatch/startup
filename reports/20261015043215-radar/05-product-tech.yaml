schemaVersion: report-v2
artifact: product-tech
slug: radar
runDate: 2026-10-15
company:
  name: RADAR
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    RADAR's publicly evidenced product is a ceiling-mounted RFID sensing system
    plus store software and analytics, now commercialized across more than
    1,400 apparel-focused stores and extended in 2025 with the RADAR+
    analytics layer. The strongest evidence is around item-level inventory
    visibility, fitting-room and replenishment workflows, and documented sensor
    installation requirements; public evidence remains thin on security/privacy
    architecture, support SLAs, and non-apparel production proof.
sections:
  - id: documented-product-surface
    title: Documented product surface and store workflow
    body: >-
      The retained evidence describes RADAR as an integrated retail-inventory
      product rather than a point feature. Company and media sources converge on
      the same basic workflow: ceiling-mounted sensing tracks RFID-tagged items,
      software exposes item location to associates, and the newer analytics
      layer turns movement data into store and corporate operating signals. The
      product surface is no longer only "find the item"; RADAR+ adds fitting
      room, replenishment, misplaced-item, and hourly store-intelligence
      features, while production references from American Eagle and Old Navy
      show the company has moved beyond pilot-stage demos into scaled apparel
      deployments. That said, the public proof is still concentrated in apparel
      use cases, so current maturity looks strongest where merchandise is
      already RFID-tagged and omnichannel fulfillment makes item-level
      visibility immediately valuable.
    claimRefs: [CE004, CE005, CE006, CE007, CE008, CE009, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operating-dependencies
    title: Architecture and operating dependencies
    body: >-
      The clearest technical evidence comes from the RS510 user manual and the
      supporting product descriptions. The system depends on tagged inventory,
      ceiling-mounted proprietary sensors, PoE++ Ethernet power, and software
      control over the store network. Those choices explain why RADAR can claim
      continuous location awareness instead of periodic handheld scans, but they
      also mean the product is operationally heavier than a software-only
      analytics layer. Installation, RF exposure rules, and commercial-space
      compliance are explicit in the manual, so deployment is not just a SaaS
      login; it is a hardware retrofit that requires store infrastructure,
      disciplined tagging, and reliable network operations to keep the data
      layer useful.
    claimRefs: [CE001, CE002, CE003, CE006, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-roadmap-and-open-risks
    title: Differentiation, roadmap, and open product risks
    body: >-
      RADAR's differentiation is the end-to-end stack: proprietary sensing,
      location software, and analytics packaged as one system instead of as a
      thin overlay on existing readers. That creates real commercial proof in
      current apparel deployments and gives the company a plausible data moat if
      the reported event volume is durable. It also concentrates risk in
      rollout-heavy execution: ceiling installation, item tagging, and category
      fit are still gating assumptions, and the public roadmap pushes into
      next-generation hardware, autonomous checkout, and possible adjacency
      categories before the assigned evidence shows independent validation of
      security, privacy, uptime, or non-apparel production performance. For
      diligence, the product question is less "does it work in apparel?" and
      more "how portable and supportable is the model when the environment gets
      messier or the install economics tighten?"
    claimRefs: [CE008, CE009, CE010, CE011, CE012, CE013]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Publicly evidenced differentiation
      - Diligence gap
    rows:
      - ["RS510 ceiling sensor", "Store operations / deployment team", "Manual-documented deployed hardware", "Ceiling-mounted proprietary RFID sensing instead of handheld periodic reads", "No public field-failure or maintenance-rate disclosure"]
      - ["Core inventory location platform", "Store associates and inventory teams", "Commercially deployed in apparel chains", "Item-level in-store location with real-time associate lookup workflows", "No public uptime SLA or integration implementation timeline"]
      - ["RADAR+", "Store managers and corporate merchandising teams", "Launched 2025-06-30", "SKU-level fitting-room, misplaced-item, replenishment, and hourly store metrics", "No independent benchmark for lift or model accuracy"]
      - ["AI analytics / data layer", "Corporate planning and operations leaders", "Scaling with current deployments", "Uses high-volume item-event data to extend beyond raw inventory counts", "Public proof of repeatable ROI outside named customers is limited"]
      - ["Next-gen sensor / autonomous checkout roadmap", "Innovation / executive buyers", "Roadmap only", "Extends platform from visibility into broader automation", "No public production deployment evidence in the assigned pool"]
    notes: >-
      Row statuses distinguish deployed features from roadmap items; null-like
      diligence gaps mean public evidence was not found in the assigned pool,
      not that the capability is absent.
    claimRefs: [CE001, CE004, CE005, CE008, CE009, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow pressure
      - RADAR solution
      - Publicly cited benefit
      - Limitation
    rows:
      - [Find the right size or item for a shopper, Associates search floor and back room with false inventory positives, Software surfaces exact in-store item location, Faster associate response and fewer missed conversions are the core retail pitch, No broad cross-customer proof of labor savings]
      - [Support BOPIS / ship-from-store accuracy, Orders are cancelled when recorded inventory is wrong, Real-time location data improves store-level item confidence, CNBC says some clients improved order-cancellation rates from 25% to 3%, Client-level metric is not generalized across the base]
      - [Prioritize replenishment and misplaced-item recovery, Manual checks miss fast-moving or abandoned items, RADAR+ recommends restocking and flags products left out of place, Company launch materials tie the workflow to on-floor availability and faster recovery, No public store-level SLA for alert-to-action execution]
      - [Understand fitting-room behavior, Traditional systems do not show what was tried on but not bought, RADAR+ tracks items entering fitting rooms and links them to conversion behavior, Public evidence suggests better sizing and merchandising insight, Independent validation of measured lift is absent]
      - [Investigate shrink and phantom inventory, Net inventory counts hide where loss or mismatch happened, Continuous item-level visibility highlights discrepancies earlier, CNBC and Omni Talk both reference a retailer result showing a 60% shrink reduction, Public evidence does not show how repeatable that result is]
    notes: >-
      Benefits combine company claims and media reporting; the cited metrics are
      directional proof points, not audited cohort averages.
    claimRefs: [CE005, CE007, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["RFID-tagged merchandise", "Carries the identity RADAR reads at item level", "Requires tagged inventory across the tracked assortment", "Category economics weaken where tagging is not already standard"]
      - ["RS510 ceiling sensor", "Interrogates tags from overhead and generates location events", "Needs ceiling mounting plus 48V PoE++ Ethernet power", "Hardware rollout and ongoing maintenance are harder than software-only deployment"]
      - ["Network control software", "Manages sensors and turns data into associate-facing actions", "Depends on store networking and software-control reliability", "Public API, integration, and support details are sparse"]
      - ["RADAR+ analytics layer", "Converts event data into fitting-room, replenishment, and dwell-time insights", "Depends on sustained event capture quality at scale", "Independent evidence does not yet verify analytics lift"]
      - ["Compliance envelope", "Governs safe and legal operation of the hardware", "Requires FCC-approved install parameters and 23 cm person separation", "Store retrofits can fail operationally if compliance and placement are poorly managed"]
    notes: >-
      This is an operating architecture summary from retained product documents
      and media descriptions, not a full internal system design.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE010, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a layered retail stack from tagged inventory and
      ceiling sensors up through associate workflows and RADAR+ analytics.
    data:
      layers:
        - label: RFID-tagged merchandise
          detail: Identity layer on individual store items that makes item-level tracking possible.
        - label: RS510 ceiling sensor
          detail: Proprietary overhead hardware continuously scans tagged inventory in the store environment.
        - label: PoE++ and store network
          detail: 48V PoE++ Ethernet power and network control connect sensors to the software layer.
        - label: Location and control software
          detail: Sensor control plus item-location logic turns raw reads into actionable inventory state.
        - label: Associate and store workflows
          detail: Item lookup, replenishment, misplaced-item alerts, and fitting-room workflows consume the live data.
        - label: RADAR+ and corporate analytics
          detail: The analytics layer adds SKU-level store intelligence, hourly metrics, and roadmap expansion into broader automation.
    claimRefs: [CE001, CE002, CE004, CE005, CE010, CE013]
callouts:
  - calloutType: strength
    title: Scaled product proof exists, but in a narrow retail shape
    body: >-
      The product is past pilot fiction: multiple retained sources place RADAR
      in more than 1,400 stores with named apparel anchors. The evidence is
      strongest for tagged-apparel inventory visibility, not yet for broad
      category portability.
    claimRefs: [CE006, CE008]
  - calloutType: risk
    title: The moat and the burden are the same thing
    body: >-
      RADAR's differentiation comes from owning the ceiling hardware, networked
      sensing, and analytics together. That also means installation, compliance,
      store infrastructure, and tagged-merchandise prerequisites can slow scale
      or compress economics.
    claimRefs: [CE002, CE003, CE013]
  - calloutType: assumption
    title: The AI layer still needs more independent proof than the sensor layer
    body: >-
      Public sources support the existence of RADAR+, the data volume story, and
      the roadmap into adjacent capabilities. They do not independently validate
      the magnitude or repeatability of the promised analytics lift.
    claimRefs: [CE004, CE010, CE011]
