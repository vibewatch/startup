  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-privacy
      missingEvidence: Public trust-center, privacy, and security-architecture documentation for how RADAR handles store, shopper, and employee data.
      whyItMatters: >-
        Product diligence cannot underwrite enterprise rollout risk without
        understanding data handling, customer-segmentation visibility, and
        security control ownership.
      diligencePath: >-
        Request RADAR's trust-center materials, security certifications,
        privacy architecture, and customer security review package.
      relatedQuestionRefs: [QE006, QE009]
    - type: private-evidence-only
      severity: material
      topic: deployment-operations
      missingEvidence: Store-level install timelines, failure rates, support SLAs, and maintenance requirements by rollout cohort.
      whyItMatters: >-
        The architecture is hardware-dependent, so underwriting the product
        requires evidence on rollout friction and ongoing operating burden, not
        just accuracy claims.
      diligencePath: >-
        Ask for deployment playbooks, uptime reports, support commitments, and
        reference calls from current production customers.
      relatedQuestionRefs: [QE004, QE009]
      relatedTableRefs: [TE001, TE003]
