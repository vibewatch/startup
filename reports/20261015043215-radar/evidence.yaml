evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: ARR, revenue run-rate, gross margin mix, NRR, burn, runway, and current cash balance.
    whyItMatters: >-
      The unicorn valuation cannot be pressure-tested without knowing whether RADAR's economics are software-like,
      hardware-like, or still deployment-services heavy.
    diligencePath: >-
      Request monthly recurring revenue, gross margin by product line, cohort retention, and board-approved budget
      materials during management diligence.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: leadership-coverage
    missingEvidence: >-
      Complete management roster, board composition, and decision-rights map beyond the handful of executives named
      publicly.
    whyItMatters: >-
      Founder concentration and governance resilience cannot be judged from a partial executive list and no disclosed
      board structure.
    diligencePath: Obtain an org chart, board roster, committee structure, and key-man contingency plan from the company.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-control
    missingEvidence: >-
      Cap table, ownership percentages, board seats, customer concentration, and commercial terms for strategic
      investors or anchor customers.
    whyItMatters: >-
      Strategic investors who are also major customers can change pricing discipline, renewal incentives, and governance
      dynamics in ways public funding headlines do not reveal.
    diligencePath: >-
      Request the cap table, financing documents, side letters, and top-customer concentration analysis before valuation
      work advances.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A category-specific market denominator, eligible-location count, pricing basis, and transparent methodology for
      TAM, SAM, and SOM.
    whyItMatters: Without these inputs, commerce volume and deployed-store count cannot be converted into addressable revenue.
    diligencePath: >-
      Obtain management's market model, customer contract units, eligible-store segmentation, and an independent
      retail-RFID spending benchmark.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-outcomes
    missingEvidence: >-
      Customer-level cohort data covering baseline, post-deployment outcome, implementation cost, payback period, and
      renewal across the installed base.
    whyItMatters: Selective examples do not establish repeatable ROI, adoption velocity, or retention.
    diligencePath: >-
      Review anonymized customer cohorts and verify results directly with at least three reference customers outside
      investor-affiliated accounts.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Current pricing, contract duration, hardware and installation charges, software subscription mix, gross margin,
      and sales-cycle data.
    whyItMatters: The same deployment scale can imply very different serviceable revenue and capital intensity.
    diligencePath: >-
      Inspect signed contracts, pricing schedules, implementation statements of work, renewal data, and segment-level
      gross margins.
  - type: private-evidence-only
    severity: material
    topic: pricing-model
    missingEvidence: Realized per-store pricing, deployment-services mix, and discounting versus list or pilot terms.
    whyItMatters: >-
      The assigned pool only supports directional packaging logic, so buyer willingness to pay and gross-margin
      durability remain untestable.
    diligencePath: >-
      Request current customer contracts, pricing schedules, and management commentary breaking hardware, services, and
      analytics ARR.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: Win/loss data against incumbent RFID platforms, integrators, or shelf-scanning alternatives.
    whyItMatters: >-
      Without named displacement evidence, the chapter can frame the likely competitor set but cannot prove which
      substitute loses most often in actual procurement.
    diligencePath: >-
      Ask management for named competitive bake-offs, reference calls, and customer selection memos showing the
      alternative stack they replaced.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: non-apparel-expansion
    missingEvidence: Production deployments outside apparel showing the sensor economics work in another tagged vertical.
    whyItMatters: >-
      Category expansion is central to moat durability because apparel concentration is the clearest strategic
      limitation in the assigned evidence.
    diligencePath: >-
      Request signed production references in healthcare, warehouse, rental, or other high-value tagged environments,
      with live-store metrics and deployment economics.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: ARR, total revenue, revenue growth, NRR, and segment revenue split between hardware, deployment, and software.
    whyItMatters: >-
      A $1 billion valuation cannot be underwritten without knowing how much of current revenue is recurring and how
      quickly it is compounding.
    diligencePath: Request monthly ARR and revenue bridge by module, geography, and deployment cohort from the CFO.
  - type: private-evidence-only
    severity: blocking
    topic: margin-structure
    missingEvidence: Gross margin by hardware, deployment services, and software/analytics modules.
    whyItMatters: >-
      The core debate is whether the business scales like infrastructure software or remains constrained by hardware and
      services drag.
    diligencePath: >-
      Request audited segment gross margins, installation cost assumptions, and capitalization policy for hardware
      deployments.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash balance, monthly burn, runway, debt facilities, and any project-finance or lease obligations tied to
      installations.
    whyItMatters: >-
      Fresh funding does not answer whether RADAR is comfortably financed or structurally dependent on continued
      external capital.
    diligencePath: Request current cash, trailing six-month burn, covenant schedule, and 18-month operating plan from finance.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Store-level or enterprise contract pricing, discounting, minimum-store commitments, renewal terms, and module
      attach rates.
    whyItMatters: >-
      Public outcome anecdotes are not enough to judge pricing power or sales efficiency without the actual commercial
      terms.
    diligencePath: Review sample customer contracts, price books, and renewal cohorts with realized ASPs and discounts.
    relatedTableRefs:
      - TI002
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      Reconciled funding chronology explaining the gap between the $233 million cumulative total and the $215 million
      sum of the publicly listed rounds in Fundz.
    whyItMatters: >-
      Even modest inconsistencies in the capital stack undermine confidence in the rest of the public financial
      narrative.
    diligencePath: Reconcile cap table and historical financing schedule against board materials and signed financing documents.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: security-privacy
    missingEvidence: >-
      Public trust-center, privacy, and security-architecture documentation for how RADAR handles store, shopper, and
      employee data.
    whyItMatters: >-
      Product diligence cannot underwrite enterprise rollout risk without understanding data handling,
      customer-segmentation visibility, and security control ownership.
    diligencePath: >-
      Request RADAR's trust-center materials, security certifications, privacy architecture, and customer security
      review package.
    relatedQuestionRefs:
      - QE006
      - QE009
  - type: private-evidence-only
    severity: material
    topic: deployment-operations
    missingEvidence: Store-level install timelines, failure rates, support SLAs, and maintenance requirements by rollout cohort.
    whyItMatters: >-
      The architecture is hardware-dependent, so underwriting the product requires evidence on rollout friction and
      ongoing operating burden, not just accuracy claims.
    diligencePath: >-
      Ask for deployment playbooks, uptime reports, support commitments, and reference calls from current production
      customers.
    relatedQuestionRefs:
      - QE004
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-practitioner-signal
    missingEvidence: >-
      Public developer or practitioner-community signal such as APIs, docs, partner implementation notes, or engineering
      talks.
    whyItMatters: >-
      The assigned pool supports product existence and commercial outcomes, but it does not show how extensible or
      implementation-friendly the platform is for technical buyers and partners.
    diligencePath: >-
      Request API/docs access, integration architecture, partner implementation references, or public engineering
      presentations.
    relatedQuestionRefs:
      - QE004
      - QE009
  - type: missing-source
    severity: material
    topic: retention-disclosure
    missingEvidence: Public NRR, GRR, churn, renewal timing, contract length, and cohort retention data by customer class.
    whyItMatters: >-
      Without durability metrics, the public record cannot distinguish sticky recurring software economics from
      hardware-heavy rollout revenue.
    diligencePath: >-
      Request cohort retention, renewal schedules, NRR/GRR, and standard contract terms from management and customer
      references.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Revenue concentration by top customer, named non-apparel production customers, and share of the store base
      represented by American Eagle and Old Navy.
    whyItMatters: >-
      The current public proof is concentrated in a narrow set of anchor apparel chains, so concentration and expansion
