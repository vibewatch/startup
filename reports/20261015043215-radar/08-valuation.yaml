      whyItMatters: Those metrics determine whether the company deserves infrastructure-platform pricing or is still mostly a hardware and services business.
      diligencePath: Request the latest board deck or financing data room KPI package and reconcile it to booked revenue and gross margin by product line.
      relatedQuestionRefs: [QV003, QV008]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Exact preference stack, liquidation rights, debt or project-finance obligations, and post-Series B ownership dilution.
      whyItMatters: Common-equity upside can look very different from enterprise value if liquidation preferences or senior capital meaningfully absorb exit proceeds.
      diligencePath: Review the current cap table, charter, investor rights agreements, and any debt schedules before underwriting returns.
      relatedQuestionRefs: [QV001, QV008]
    - type: missing-source
      severity: material
      topic: customer-diversification
      missingEvidence: Customer concentration, non-apparel production deployments, and cohort-level renewal or expansion evidence beyond the named anchor retailers.
      whyItMatters: The main downside case is that attractive proof exists only inside a narrow retail wedge and cannot scale into durable portfolio economics.
