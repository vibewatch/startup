schemaVersion: report-v2
artifact: valuation
slug: radar
runDate: 2026-10-15
company:
  name: RADAR
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a real business with unusual store-scale proof, but not a
    publicly underwriteable $1B entry price. The May 2026 $170M Series B, 1,400+
    store footprint, and expanding analytics roadmap justify continued diligence, while
    missing ARR, gross margin, NRR, burn, and preference disclosures keep the call at
    research-more with a stretched valuation stance.
sections:
  - id: recommendation-price-discipline
    title: Recommendation and price discipline
    body: >-
      RADAR looks more credible than a typical retail-tech pitch because the public
      record shows a live scaled deployment, not just pilots or conceptual AI claims.
      CNBC and Teardown both place the platform in more than 1,400 stores with named
      anchors including American Eagle and Old Navy, while round coverage consistently
      confirms a $170M Series B at a valuation above $1B. That operating proof matters,
      but the underwriting problem is still price sensitivity: public evidence does not
      disclose ARR, gross margin, net retention, or cap-table preferences, so the last
      round cannot be bridged to durable economics the way a software or infrastructure
      investor would normally require. The defensible public-evidence call is therefore
      research-more, with high risk and entry discipline set at either materially better
      pricing or a private diligence pack that closes the missing KPI set.
    claimRefs: [CV001, CV004, CV010, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-what-it-proves
    title: Financing context and what the round proves
    body: >-
      The financing round proves investor appetite for a hardware-plus-AI retail
      infrastructure thesis, not that the current valuation is already validated by
      disclosed financials. Multiple sources confirm the May 2026 Series B terms, and
      Fundz records a prior $30M Series A plus a March 2025 venture round, showing that
      RADAR has been capitalized for a long hardware buildout before reaching unicorn
      status. The June 2025 RADAR+ launch also matters because it widens the thesis from
      inventory visibility into analytics around dwell time, replenishment, and
      productivity, which is where recurring value could deepen. Even so, the public
      sources still frame the company in product and rollout terms rather than revenue
      quality terms, so the round demonstrates category excitement and customer proof
      more than it demonstrates mature, software-like monetization.
    claimRefs: [CV001, CV002, CV003, CV008, CV009, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-lens
    title: Scenarios and comparable lens
    body: >-
      The most useful public comparable lens is not retail SaaS but hardware-plus-AI
      infrastructure, which is exactly how one financing recap framed the round when it
      compared RADAR to companies such as Anduril and Shield AI. That framing is
      directionally helpful because it explains why investors may pay for proprietary
      sensors plus a compounding data layer, yet it does not solve the underwriting
      problem because the public record still omits the revenue mix between installs and
      recurring analytics. The bull case is that store-scale proof, customer workflow
      ROI, and the newer analytics layer convert into broader, higher-margin platform
      economics. The bear case is that price concessions, service-heavy deployment, and
      concentration in specialty apparel keep the business looking more like a capital-
      intensive systems integrator than a compounding software platform.
    claimRefs: [CV004, CV007, CV010, CV011, CV012, CV016]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-thesis-breaks
    title: Final diligence asks and thesis-break triggers
    body: >-
      The missing work is straightforward and important. Before paying anywhere near the
      last round, investors need a management packet that discloses ARR or equivalent
      recurring revenue, gross margin by hardware versus software, customer concentration,
      renewal behavior, burn and runway, and the exact preference stack created by prior
      financings. Fundz's headcount snapshot suggests the organization is still relatively
      compact for a business claiming 1,400+ stores, which makes deployment cadence,
      services intensity, and support economics worth pressure-testing directly. The
      thesis should be reconsidered if management cannot show that analytics revenue is
      becoming the margin engine, if new deployments remain confined to a narrow customer
      set, or if the next financing arrives without materially better KPI transparency.
    claimRefs: [CV009, CV011, CV012, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - [research-more, medium, high, stretched, "Do not underwrite the $1B mark without private ARR, gross-margin, NRR, burn, and preference disclosures or a materially better entry price."]
    notes: >-
      Public evidence confirms the financing round and store-scale proof, but not the
      financial disclosures needed for an intrinsic valuation bridge.
    claimRefs: [CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - [Thesis, "1,400+ deployed stores with American Eagle and Old Navy show more real-world proof than most retail AI infrastructure companies have at this stage.", "Independent disclosure of broader customer mix and non-apparel production wins would strengthen the thesis."]
      - [Thesis, "Publicly cited workflow outcomes on cancellations and shrink suggest the product solves expensive retail problems, not cosmetic analytics.", "Portfolio-level KPI disclosure across multiple customers would make the ROI case more durable."]
      - [Thesis, "RADAR+ expands the story from sensors into replenishment, dwell-time, and merchandising intelligence that could support recurring monetization.", "Disclosed software mix, gross margin, and net retention would make this layer underwriteable."]
      - [Anti-thesis, "No public ARR, growth, gross margin, NRR, or CAC/payback disclosure bridges the $1B round to fundamentals.", "A board-level KPI pack or audited lender/investor materials would materially reduce this objection."]
      - [Anti-thesis, "Teardown identifies capex and services intensity plus chain-scale pricing concessions as the central risk to long-run margin quality.", "Proof that analytics revenue is outgrowing install and deployment services would reduce this concern."]
      - [Anti-thesis, "Named proof points are still concentrated around a small set of anchor retailers, so customer diversification and implementation scalability remain open.", "Production customers outside the current anchor set plus concentration data would improve the view."]
    notes: >-
      Arguments mix independently reported facts with explicit public-data limits; the
      anti-thesis rows remain open until management discloses unit economics and customer
      concentration.
    claimRefs: [CV004, CV006, CV007, CV008, CV011, CV012, CV013, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Store footprint expands beyond apparel, analytics becomes a larger share of revenue, and retention or margin disclosure looks software-like.", "At or above the last round could be defensible only if private diligence shows recurring economics strong enough to support infrastructure-platform multiples.", "Requires that deployment and services do not absorb most of the economic value.", "Would require new vertical wins, improving KPI disclosure, and limited preference overhang."]
      - [Base, "Customer proof is real, but public disclosure stays thin and the business is still being valued more on promise than on disclosed financial quality.", "Best practice is disciplined entry at or below the last round until diligence closes ARR, margin, concentration, and burn gaps.", "Flat private-market multiples and ordinary execution slippage can erase upside from the current price.", "Most consistent with the public record today."]
      - [Bear, "Hardware rollout costs, pricing concessions, or concentration keep recurring economics from inflecting before the next financing.", "A clear down-round path becomes plausible because public evidence does not yet support premium software-style underwriting.", "Margin compression, delayed expansion, or a thin next round could subordinate common-equity upside.", "Would be signaled by stalled deployment growth, opaque KPI disclosure, or fresh capital raised without better fundamentals."]
    notes: >-
      Scenario ranges are framed relative to the disclosed $1B last-round reference
      because public sources do not expose the financial inputs needed for a precise
      intrinsic valuation model.
    claimRefs: [CV004, CV010, CV011, CV012, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation flows from real deployment proof and financing momentum into a
      still-unresolved underwriting gap on recurring economics and capital structure.
    data:
      nodes:
        - id: priced-round
          label: "Last priced round"
          value: "$170M Series B at >$1B"
          note: "Confirmed by multiple public sources."
        - id: operating-proof
          label: "Operating proof"
          value: "1,400+ stores"
          note: "Named anchor customers and reported workflow outcomes."
        - id: platform-upside
          label: "Platform upside"
          value: "RADAR+ analytics"
          note: "Roadmap adds higher-value software and automation surfaces."
        - id: org-depth
          label: "Scaling depth"
          value: "~189 employees"
          note: "Public org snapshot still looks compact for the claimed footprint."
        - id: underwriting-gap
          label: "Underwriting gap"
          value: "No public ARR / margin / NRR / preference data"
          note: "Price cannot be bridged to durable economics from public sources alone."
        - id: recommendation
          label: "Current call"
          value: "Research-more"
          note: "Require better KPI disclosure or a materially better entry price."
      edges:
        - from: priced-round
          to: operating-proof
          label: "capital validates demand"
        - from: operating-proof
          to: platform-upside
          label: "proof supports upside"
        - from: platform-upside
          to: org-depth
          label: "must scale through team"
        - from: org-depth
          to: underwriting-gap
          label: "execution capacity still needs proof"
        - from: underwriting-gap
          to: recommendation
          label: "missing economics block conviction"
    approximationNotes: null
    claimRefs: [CV001, CV004, CV009, CV013, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: Public-evidence call
    body: >-
      Keep RADAR in diligence, but do not treat the last round as validated fair value.
      The public record supports continued work on the company, not a price-clearing
      investment memo.
    claimRefs: [CV014, CV015]
  - calloutType: risk
    title: The valuation fight is about economics, not demand
    body: >-
      Demand proof exists; the open question is whether a hardware-led deployment model
      can convert that proof into durable recurring margins before the next financing or
      exit window.
    claimRefs: [CV011, CV012, CV016]
