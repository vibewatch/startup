chapter:
  number: 6
  title: Customers
  summary: "Halcyon serves 500+ organizations protecting over 1.75 million endpoints, with 300% customer growth in 2024\u2013\
    2025 spanning Fortune 500 enterprises, public sector agencies, and mid-market firms across financial services, healthcare,\
    \ manufacturing, and legal verticals, though customer-specific retention metrics and individual account names remain largely\
    \ undisclosed."
sections:
- id: customer-segmentation
  title: Customer Base Segmentation
  body: "Halcyon's customer base spans enterprise, mid-market, and \u2014 through its MSSP channel \u2014 SMB organizations.\
    \ The primary buyer persona is the Chief Information Security Officer (CISO) or VP of Security at organizations with 500+\
    \ endpoints, where ransomware represents an existential operational risk. Vertically, Halcyon's adoption is concentrated\
    \ in financial services, healthcare, manufacturing, retail, and legal sectors, all of which face elevated ransomware targeting\
    \ and carry heavy regulatory compliance obligations. The public sector represents a growing segment, with government agencies\
    \ and defense-adjacent organizations deploying the platform. Geographically, Halcyon's direct sales footprint is North\
    \ America-centric, though international expansion has begun through technology partnerships with Dell and Cisco for the\
    \ Japanese market. The payer structure is predominantly direct enterprise subscription, with a growing share intermediated\
    \ through MSSPs and VARs. As of late 2025, Halcyon's Revolution Partner Program had attracted over 70 channel partners,\
    \ and the October 2025 distribution agreement with Climb Channel Solutions extended reach to thousands of additional resellers\
    \ and MSPs. Halcyon does not publicly disclose customer count granularity by segment, revenue concentration by vertical,\
    \ or average contract value, making precise segmentation reliant on third-party review platforms and partner announcements.\n"
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
- id: adoption-trajectory
  title: Customer Growth and Adoption Trajectory
  body: 'Halcyon achieved 300% customer growth in the period spanning 2024 to early 2025, expanding from an undisclosed base
    to over 500 organizations protecting more than 1.75 million devices. This trajectory was recognized in the 2025 SC Awards,
    where Halcyon won Best Enterprise Security Solution partly on the strength of this deployment scale. The company''s adoption
    model follows a phased deployment pattern: new customers begin in monitor mode for safe integration and policy tuning,
    typically with weekly review calls with Halcyon''s deployment team, before transitioning to full enforcement mode. This
    phased approach reduces friction and false-positive risk during onboarding. The 24/7 Ransomware Operations Center (ROC)
    and Ransomware Intelligence, Support, and Enablement (RISE) team provide ongoing managed support, functioning as a virtual
    SOC extension for customers. Halcyon''s platform is designed to complement existing EDR and backup solutions rather than
    replace them, which lowers procurement friction by avoiding rip-and-replace dynamics. The company reports that 68% of
    customers experienced Halcyon stopping a ransomware threat that would have significantly impacted their business, and
    99% of customers report feeling confident in their ransomware resiliency after deployment. However, key adoption metrics
    such as time-to-value, average deployment duration, and endpoint utilization rates remain undisclosed. The absence of
    publicly reported ARR or customer count time series makes it impossible to independently verify the 300% growth claim
    with precision.

    '
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
