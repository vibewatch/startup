- id: named-customer-proof
  title: Named and Anonymized Customer Evidence
  body: "Halcyon does not publicly name most customers, but anonymized case studies and testimonials provide meaningful evidence\
    \ of production deployment. FeaturedCustomers lists 14 customer references with a composite rating of 4.7 out of 5 from\
    \ 356 reference ratings. Specific anonymized proof points include a large North American law firm that selected Halcyon\
    \ to counter sophisticated low-and-slow ransomware attacks bypassing traditional EDR; a national leading healthcare insurer\
    \ that valued Halcyon's unique encryption key capture capability as a safety net no other vendor offered; and a retail\
    \ distribution company where Halcyon detected and blocked a Sunburst backdoor missed by existing security tools during\
    \ post-incident remediation. Additionally, a partially deployed customer reported that a threat actor disabled their antivirus\
    \ and EDR, but endpoints running Halcyon remained unaffected, forcing attackers to pivot. On Gartner Peer Insights, Halcyon's\
    \ Anti-Ransomware Platform holds a 4.8 out of 5 rating from 19 verified reviews as of mid-2025, with users praising implementation\
    \ ease, phased rollout support, and reliability. PeerSpot reviews cite robust performance, strong analytics, and scalability,\
    \ though users note room for improvement in technical support responsiveness and third-party integrations. The absence\
    \ of named Fortune 500 references is a gap \u2014 while the company claims Fortune 500 customers and public sector deployments\
    \ including defense-adjacent organizations, no specific names are publicly confirmed, limiting reference-check ability\
    \ for prospective buyers or investors.\n"
  claimRefs: []
  tableRefs:
  - TU003
- id: retention-satisfaction
  title: Retention, Satisfaction, and Durability Signals
  body: "Halcyon does not disclose Net Revenue Retention (NRR), Gross Revenue Retention (GRR), logo churn, or contract renewal\
    \ rates. As a private company with no public filings, these metrics are entirely opaque. However, indirect signals suggest\
    \ strong retention. The company's customer satisfaction survey reports 99% of customers feel confident in ransomware resiliency\
    \ post-deployment, up from 7% before Halcyon, and 100% report being less concerned about ransomware as a business risk.\
    \ On review platforms, Gartner Peer Insights ratings of 4.8/5 and FeaturedCustomers ratings of 4.7/5 indicate high satisfaction\
    \ among the subset of customers who submit reviews. Industry benchmarks for enterprise cybersecurity SaaS suggest median\
    \ NRR of 115\u2013130% with top-quartile performers exceeding 120%, driven by seat expansion, module cross-sell, and high\
    \ switching costs. Halcyon's architecture \u2014 complementary to existing EDR rather than competing \u2014 may reduce\
    \ churn risk by lowering rip-and-replace pressure. The ransomware warranty, offering up to $5 million in coverage for\
    \ ransomware incidents that bypass Halcyon's defenses, serves as both a retention mechanism and a confidence signal. Customer\
    \ support receives mixed reviews: generally rated 4.6\u20134.7/5, but with recurring feedback about slower responsiveness\
    \ for complex integration issues and requests for more robust training resources. The absence of cohort-level retention\
    \ data, contract length distribution, or expansion revenue metrics remains a material gap for diligence.\n"
  claimRefs: []
- id: expansion-concentration-risk
  title: Expansion, Concentration, and Channel Risk
  body: 'Halcyon''s land-and-expand motion operates through endpoint seat expansion within existing accounts, cross-selling
    new modules such as Data Exfiltration Protection and Ransomware Detection and Recovery, and upselling from monitor-only
    to full enforcement mode. The company''s channel strategy has evolved rapidly: from 70+ MSSP and VAR partners in late
    2023 to the October 2025 Climb Channel Solutions distribution agreement, which extends access to thousands of resellers
    across North America for SMB, commercial, and enterprise segments. The Revolution Partner Program earned a 5-Star Rating
    in the CRN 2025 Partner Program Guide, indicating strong channel partner satisfaction. International expansion through
    Dell and Cisco partnerships targets Japan, though the geographic revenue concentration appears heavily North American.
    Concentration risk is difficult to assess without revenue-by-customer disclosure. If Halcyon''s 500+ organizations include
    a small number of large enterprise accounts generating a disproportionate share of revenue, the standard top-10-customer
    concentration risk applies. Channel dependence is a growing consideration: as MSSP-intermediated revenue grows, Halcyon
    becomes exposed to partner economics, margin sharing, and channel conflict between direct sales and partner-sourced deals.
    The incident response partner program launched in 2026, which includes Booz Allen Hamilton among its partners, adds a
    new customer acquisition channel through post-breach remediation scenarios. Procurement friction is reportedly low given
    the complementary deployment model, but pricing is cited by some reviewers as relatively high, which may slow mid-market
    penetration absent channel discounting.

    '
  claimRefs: []
