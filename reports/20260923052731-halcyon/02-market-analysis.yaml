callouts:
- calloutType: strength
  title: Regulatory stack creates non-discretionary ransomware protection spending
  body: 'SEC four-day disclosure rules, CISA ransomware guidance, HIPAA breach notification, and PCI-DSS

    requirements collectively create a multi-jurisdiction compliance floor for ransomware protection

    spending. This regulatory overlay makes anti-ransomware investment non-discretionary for public

    companies, healthcare organizations, and critical infrastructure operators, insulating core demand

    from budget cycles and economic downturns.

    '
  claimRefs: []
- calloutType: risk
  title: Platform consolidation compresses standalone anti-ransomware TAM
  body: "CrowdStrike, Microsoft, Palo Alto Networks, and SentinelOne are aggressively bundling ransomware\ndetection features\
    \ into their EDR/XDR platforms. As these incumbents add ransomware-specific\ncapabilities \u2014 including behavioral\
    \ analysis, rollback, and key interception \u2014 the willingness of\nCISOs to pay for a separate anti-ransomware layer\
    \ diminishes. Halcyon must demonstrate measurable\ndetection superiority over bundled alternatives to sustain pricing\
    \ power and prevent TAM compression.\n"
  claimRefs: []
- calloutType: insight
  title: Cyber insurance market functions as indirect demand accelerator
  body: "The $16.3\u201326.25 billion cyber insurance market is tightening underwriting standards, increasingly\nrequiring\
    \ policyholders to demonstrate dedicated ransomware controls beyond baseline EDR. Insurers\nare mandating specific technical\
    \ controls \u2014 endpoint isolation, immutable backups, ransomware-specific\ndetection \u2014 as conditions of coverage.\
    \ This creates an institutional demand channel for anti-ransomware\ntools that is independent of enterprise risk perception,\
    \ driven instead by insurance carrier\nrequirements and premium economics.\n"
  claimRefs: []
- calloutType: assumption
  title: SOM estimate lacks validated bottom-up enterprise count
  body: 'The $500 million SOM estimate assumes approximately 5,000 target enterprises at $100K average ACV.

    Neither the enterprise count nor the ACV assumption has been validated with Halcyon''s sales data.

    Actual SOM may be materially different depending on average deal size, win rates against EDR-bundled

    alternatives, and geographic market penetration beyond North America.

    '
  claimRefs:
  - CM010
