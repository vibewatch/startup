  figureRefs: []
- id: SM002
  title: Market Size and Growth Trajectory
  body: "Multiple analyst firms size the ransomware protection market with overlapping but divergent\nmethodologies. Research\
    \ and Markets estimates the global ransomware protection market at $28.5 billion\nin 2025, growing to $33.4 billion in\
    \ 2026 at a 17.2% CAGR. The Business Research Company projects\na similar trajectory from $32.8 billion in 2025. Mordor\
    \ Intelligence forecasts the market reaching\n$33.15 billion by 2030 with a CAGR exceeding 15%. Fortune Business Insights\
    \ sizes the adjacent\nendpoint security market at $16.25 billion in 2025, growing at 7\u201312% CAGR, representing the\
    \ baseline\nEPP/EDR spend atop which anti-ransomware tools layer.\n\nGrand View Research estimates the global ransomware\
    \ protection market will grow at a 17.5% CAGR\nthrough 2030, driven by endpoint protection demand which accounted for\
    \ 33.15% of market share in\n2024. The anti-ransomware solutions segment specifically \u2014 a narrower cut than the full\
    \ protection\nmarket \u2014 is estimated at $22.15 billion in 2025, projected to reach $38.92 billion by 2032 at a\n10.8%\
    \ CAGR according to Market Growth Reports.\n\nGartner's information security spending forecast provides the broadest frame:\
    \ $213 billion in 2025,\nrising to $240 billion in 2026 (12.5% growth), with security software \u2014 the segment containing\n\
    endpoint protection \u2014 as the fastest-growing category at $105.9 billion in 2025. These figures\nestablish the macroeconomic\
    \ ceiling for Halcyon's market opportunity. Total ransomware damages of\n$57 billion globally in 2025, projected to reach\
    \ $74 billion in 2026, quantify the economic loss\nthat ransomware protection spending aims to reduce.\n"
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
