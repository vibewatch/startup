  evidenceGaps:
  - type: missing-source
    severity: material
    topic: halcyon-specific-market-share
    missingEvidence: No audited data on Halcyon's current market share within the anti-ransomware segment or its win rates
      against EDR-bundled ransomware modules from CrowdStrike, Microsoft, or Palo Alto Networks.
    whyItMatters: Market share data is needed to assess whether Halcyon is gaining traction against platform vendors and to
      validate SOM estimates.
    diligencePath: Request competitive win/loss data, pipeline analysis, and customer count by segment from Halcyon management
      in data room.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: som-validation
    missingEvidence: The $500M SOM estimate is an order-of-magnitude assumption based on 5,000 target enterprises at $100K
      ACV. Neither the enterprise count nor the ACV has been validated with Halcyon's actual sales data or pipeline metrics.
    whyItMatters: SOM credibility directly affects valuation and investment thesis; the estimate may overstate or understate
      actual obtainable market.
    diligencePath: Request Halcyon ACV distribution, customer count, and pipeline data from CRO. Cross-reference with disclosed
      ARR to back-calculate implied market share.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: edr-ransomware-detection-gap-quantification
    missingEvidence: No independent benchmark study quantifies the detection rate differential between purpose-built anti-ransomware
      tools and EDR-bundled ransomware modules for modern attack chains (BYOVD, kernel encryption).
    whyItMatters: Halcyon's value proposition depends on demonstrating that EDR is insufficient for ransomware-specific threats;
      quantified detection gaps would validate the need for a complementary layer.
    diligencePath: Request Halcyon's internal testing results and third-party efficacy testing (e.g., MITRE ATT&CK evaluations)
      comparing detection rates.
    relatedQuestionRefs: []
  - type: conflicting-data
    severity: minor
    topic: market-size-estimate-divergence
    missingEvidence: Analyst estimates for the ransomware protection market in 2025 range from $22.15B (anti-ransomware solutions
      specific) to $32.8B (broad protection), a 48% divergence reflecting different market boundary definitions rather than
      methodology disagreement.
    whyItMatters: The wide sizing range makes it difficult to anchor a single TAM figure for investment valuation, and the
      divergence may cause confusion in management presentations.
    diligencePath: Request management's preferred market definition and sizing methodology; reconcile with at least two analyst
      reports using consistent boundaries.
    relatedQuestionRefs:
    - QM002
    relatedTableRefs:
    - TM002
