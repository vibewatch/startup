chapter:
  number: 2
  title: Market Analysis
  summary: "The ransomware protection market is estimated at $28.5\u201332.8 billion in 2025, growing at a 17.2% CAGR toward\n\
    $33.4 billion in 2026, driven by escalating attack frequency (one every 11 seconds), $57 billion in global\nransomware\
    \ damages, and regulatory mandates including SEC four-day disclosure rules and CISA guidance.\nHalcyon operates in the\
    \ anti-ransomware endpoint security sub-segment, where buyers are CISOs allocating\na rising share of IT budgets (now\
    \ 13.2%, up from 8.6% in 2020) to combat ransomware-as-a-service,\ndouble-extortion, and AI-enabled attack vectors. Key\
    \ market constraints include platform consolidation\nby incumbents, tool fatigue among security teams, and high vendor\
    \ switching costs.\n"
sections:
- id: SM001
  title: Market Boundary and Category Definition
  body: "The ransomware protection market encompasses all products and services designed to prevent, detect,\ncontain, and\
    \ recover from ransomware attacks across endpoints, networks, email gateways, and cloud\nworkloads. This includes endpoint\
    \ protection platforms (EPP), endpoint detection and response (EDR),\nanti-ransomware-specific tools, backup and recovery\
    \ solutions, and managed detection and response (MDR)\nservices. The broader cybersecurity spending envelope \u2014 projected\
    \ at $212 billion in 2025 by Gartner,\ngrowing 15.1% year-over-year \u2014 provides the total addressable ceiling from\
    \ which ransomware-specific\nbudgets are drawn.\n\nHalcyon's addressable segment is narrower: purpose-built anti-ransomware\
    \ platforms that sit alongside\nor on top of existing EPP/EDR stacks to provide ransomware-specific detection, key capture,\
    \ and\nautomated recovery. This positioning excludes general-purpose endpoint security (a $16.25\u201322.8 billion\nmarket)\
    \ and broader network security, focusing instead on the incremental spend enterprises allocate\nspecifically for ransomware\
    \ resilience beyond their baseline endpoint protection. Adjacent categories\ninclude cyber insurance ($16.3\u201326.25\
    \ billion in 2025), which creates indirect demand by requiring\npolicyholders to demonstrate anti-ransomware controls,\
    \ and security operations (SIEM/SOAR), which\nintegrates ransomware detection signals.\n\nThe status-quo substitute for\
    \ dedicated anti-ransomware tooling is reliance on existing EDR/XDR\nplatforms from CrowdStrike, SentinelOne, Microsoft\
    \ Defender, or Palo Alto Cortex XDR. These platforms\ninclude ransomware detection modules but are not purpose-built for\
    \ ransomware-specific attack chains\nsuch as kernel-level encryption, BYOVD (bring your own vulnerable driver) exploitation,\
    \ or data\nexfiltration prior to encryption. Halcyon's value proposition is that general-purpose EDR misses\nransomware\
    \ variants specifically engineered to evade behavioral detection engines.\n"
  claimRefs:
