              - CE015
      - number: '5.2'
        title: 架构与技术实现
        blocks:
          - type: paragraph
            body: >
              Halcyon 的架构采用多层防御模型，各层分别对应勒索软件攻击链的不同阶段。执行前防御层利用 AI
              以及专为真实勒索软件战术、技术与流程（TTPs）训练的专用机器学习微模型，在已知和新型变种运行前完成阻断。漏洞利用缓解层采用地理围栏、沙箱欺骗和凭据幻象等欺骗技术，使终端表现为无吸引力的攻击目标。行为检测层利用聚焦勒索软件的模型，监控提权、横向移动与进程注入等可疑活动。弹性与恢复层能够自主叫停活跃攻击、隔离受害终端，并利用捕获的加密密钥数据恢复受损文件。2025
              年推出的 Kernel Guard Protection 专门应对自带易受攻击驱动（BYOVD）攻击，检测并阻断攻击者用于瘫痪安全控件的已知漏洞签名驱动。EDR Last Gasp
              可感知勒索软件试图终止第三方安全方案（涵盖 CrowdStrike Falcon、SentinelOne Singularity、Microsoft Defender for Endpoint 与 Palo
              Alto Cortex XDR）的动作。Data Exfiltration Protection（DXP）2.0 监控异常数据传输量或可疑传输目的地，一旦跨越预设阈值便自动接入 RDR
              团队，以遏制双重勒索手法。该平台的 AI/ML 引擎仅以勒索软件而非通用恶意软件进行训练；公司声称与通用工具相比，这种做法提高了准确度并减少了误报。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
