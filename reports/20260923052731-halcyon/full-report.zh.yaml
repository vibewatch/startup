      - number: '4.2'
        title: GTM 模式与销售效率
        blocks:
          - type: paragraph
            body: >
              Halcyon 采取大客户直销为主、渠道伙伴合作为辅的市场拓展（GTM）模式。公司已公布与 Dell、Cisco 进军日本市场的战略联合销售协议，并与 Sophos 结盟实现情报共享及防篡改合作。Jeff
              Stclair 出任首席营收官，Kelly Fiedler 担任首席营销官，印证了其在直销管理和品牌推广上的持续下注。截至 2026 年初，公司总人数约 506
              人，但工程、销售与行政职能的人员分布未予拆解。销售周期、平均合同价值（ACV）、获客成本（CAC）及 CAC 回本周期均未公开披露。参考网络安全 SaaS 行业对标数据，企业级安全厂商的 CAC 回本周期通常在
              13–20 个月，LTV:CAC 维持在 3–5x 水平；但由于 Halcyon 走的是插件增效路线（单笔交易 ACV
              低于全功能平台级厂商），行业通用基准未必能精准映射其实际成效。其渠道分成比例、合作伙伴让利及联合销售细节同样未曾公开。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: 成本结构与毛利驱动因素
        blocks:
          - type: paragraph
            body: >
              Halcyon 未披露其成本构成、毛利率或营业费用。作为依托云端交付的 SaaS 端点 Agent，其主营业务成本很可能包含云基础设施托管、托管式 RDR 交付开支（RISE
              团队薪酬）以及日常客户支持。同赛道上市 SaaS 提供了有价值的参考：CrowdStrike 在 2025 财年以 $3.76B 订阅收入交出 78% 的 GAAP 订阅毛利率（Non-GAAP 下为
              80%），SentinelOne 在 2025 财年 $821.5M 营收中实现 74% 毛利率；行业基准通常将网络安全 SaaS 订阅毛利率划定在 75–85% 区间。若 RISE
              托管团队耗费较多编制，Halcyon 的托管 RDR 属性或将其综合毛利率拉低至纯软件同行水准之下。营业支出大概率由研发（平台演进与 AI 模型训练）及销售市场推广（直销团队与渠道建设）大头主导。按约 506
              名员工及 ~$79.5M 估计营收推算，其人均创收约为 $157K，低于成熟 SaaS 企业普遍 $200K+ 的水位，表明公司当前仍在招人铺路，在人员配置上走在收入释放之前。
            claimRefs:
