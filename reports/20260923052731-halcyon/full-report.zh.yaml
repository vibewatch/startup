      - number: '6.2'
        title: 客户增长与采用轨迹
        blocks:
          - type: paragraph
            body: >
              在 2024 年至 2025 年初期间，Halcyon 客户数增长 300%，从未公开的基数扩张至 500+ 家组织，保护设备超过 1.75M 台。这一增长轨迹在 2025 SC Awards
              中获得认可，Halcyon 部分凭借此部署规模斩获最佳企业安全解决方案奖。公司的采用流程遵循分阶段部署模式：新客户初期运行在监控模式以完成安全集成与策略调优，通常每周与 Halcyon
              部署团队通会，随后再切换至全面强制模式。这种分阶段做法降低了接入摩擦与误报风险。24/7 勒索软件运营中心（ROC）与 RISE 团队提供持续的托管支持，相当于客户虚拟 SOC 的延伸。Halcyon
              平台定位于补充而非替代现有 EDR 及备份方案，避免了全面替换带来的采购阻力。公司称 68% 的客户曾由 Halcyon 阻断过本会严重冲击业务的勒索软件威胁，99%
              的客户反馈部署后对自身勒索软件韧性感到放心。然而，价值实现周期（time-to-value）、平均部署耗时与终端利用率等关键指标仍未公开。缺少公开的 ARR 或客户数时间序列，使得外部无法精确独立验证 300%
              这一增长主张。
