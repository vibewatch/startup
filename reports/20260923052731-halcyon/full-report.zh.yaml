      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: >
              CrowdStrike Falcon 是市场主导型 EDR/XDR 平台，其 2025 财年营收达 $3.95 billion，ARR 为 $4.24 billion，市值约为 $119 billion。其
              Falcon 平台依托 Charlotte AI 提供云原生端点保护，维持着 97% 的总留存率（GRR），且已连续六年获评 Gartner 端点保护平台魔力象限领导者。SentinelOne
              Singularity 在 2025 财年实现营收 $821.5 million，ARR 达 $920 million，同比增长 32%；SentinelOne
              凭借自主检测响应和勒索攻击快照回滚能力打出差异化，连续五年入选 Gartner 魔力象限领导者，市值约为 $5.6 billion。Palo Alto Networks 旗下的 Cortex XDR
              平台隶属其大安全产品版图，公司 2025 财年总营收为 $9.22 billion，下一代安全业务 ARR 达 $5.6 billion，市值超 $139 billion。根据 IDC 统计，Microsoft
              Defender for Endpoint 在现代端点安全市场握有 28.6% 份额，连续三年稳居榜首；Defender 与 Windows 及 M365
              深度绑定，坐拥无可匹敌的分发优势，是众多企业的默认端点防护方案。Sophos 连续 16 年位列 Gartner 魔力象限领导者，2020 年被 Thoma Bravo 以 $3.9 billion
              私有化，2025 年初又斥资 $859 million 收购 Secureworks，将其 MDR 客户群拓展至 28,000 余家；值得注意的是，Sophos 于 2025 年 8 月与 Halcyon
              达成合作，实现双向防篡改保护与情报共享，展现出互补共生而非纯粹你死我活的竞争关系。
