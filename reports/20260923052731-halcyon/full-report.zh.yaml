      - number: '1.3'
        title: 融资历程与资本结构
        blocks:
          - type: paragraph
            body: >
              Halcyon 历经 4 轮融资累计融资约 $190M，在大约两年时间内从种子轮一路推进至 Series C 轮。2022 年 10 月，公司完成 $18.7M
              种子轮融资，为早期产品研发和市场拓展提供了启动资金。2023 年 4 月，Halcyon 完成由 SYN Ventures 领投，Dell Technologies Capital 与 Corner
              Ventures 跟投的 $50M Series A 轮融资。仅仅 8 个月后，2023 年 12 月，公司再次斩获超额认购的 $40M Series B 轮融资，由 Bain Capital Ventures
              领投，并吸引 Symantec 前 CEO Enrique Salem 入席董事会。2024 年 11 月 25 日官宣的 Series C 轮规模达 $100M，由 Evolution Equity
              Partners 领投，Bain Capital Ventures、SYN Ventures、Harmony Group、Corner Capital Management、Dropbox Ventures 以及
              ServiceNow Ventures 跟投。该轮融资将 Halcyon 估值推高至 $1B，正式迈入独角兽行列，Evolution Equity Partners 管理合伙人 Richard Seewald
              随交易加入董事会。大约 24 个月内完成 4 轮融资的极快节奏，印证了投资机构对防勒索市场前景以及 Halcyon 差异化技术路线的强烈信心。
