          - type: callout
            title: SOM 测算缺乏经自下而上验证的目标企业基数
            body: >
              $500 million 的 SOM 估算建立在约 5,000 家目标企业、平均客单价（ACV）$100K 的假设前提上。然而无论是企业总数还是客单价预估，均未经 Halcyon 实际销售数据检验。实际 SOM
              极可能受平均客单价、抗衡 EDR 捆绑方案的赢单率以及北美以外市场渗透率的影响而出现显著差异。
            calloutType: assumption
