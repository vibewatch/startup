      - number: '5.3'
        title: 部署、集成与生态
        blocks:
          - type: paragraph
            body: >
              Halcyon 平台以轻量级终端代理形式部署，适配各类自动化软件分发工具，系统性能开销极低，并内置防篡改与健康监控功能。该代理将安全与威胁遥测数据实时推送到 Google SecOps、Microsoft
              Sentinel、Sumo Logic、Splunk 和 Exabeam 等 SIEM 工具。与 EDR/XDR 方案（CrowdStrike、SentinelOne、Microsoft
              Defender、Cortex XDR）的集成，使 Halcyon 能够检测并阻断绕过此类工具的攻击，同时监控针对 EDR 的篡改企图。平台提供已公开文档的 REST API（访问地址为
              api.halcyon.ai 与 api.eu.halcyon.ai），便于与 SOAR 平台、工单系统、身份提供商及定制大屏开展集成、自动化与编排。Enterprise Policy Management
              允许企业和 MSSP 借助 Policy Groups 对指定资产组应用 Detection、Protection 或 Lock Down 策略，达成规模化安全管理。2025 年与 Sophos
              建立的合作带来了双向防篡改保护与威胁情报共享。Halcyon 的部署通常始于监控模式，建立基线并调优策略后再切换至主动阻断。公司还与 Dell 达成涵盖分销与技术集成的合作，Dell
              合作伙伴门户中的技术规格书亦证实了这一点。
            claimRefs: []
      - number: '5.4'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >
              Halcyon 落实了覆盖基础设施、组织流程与产品层面的安全防护措施，包括传输中与静态数据加密、受限访问控制、账户身份验证、持续渗透测试、灾难恢复计划以及数据留存与删除策略。公司遵循标准 SaaS
              安全规范，但公开文件中尚无法独立证实 Halcyon.ai（即这家反勒索软件公司，与无关的 Halcyon Financial Technology 实体并非同一家）已获得 SOC 2 Type II
              等具体认证。Halcyon 的勒索软件质保在防护失效时提供最高达 $5M 或更高的资金保障，充当质量背书并作为传统网络保险的补充。平台包含自动化健康监控与防篡改功能，以确保代理完整性。托管式 RDR
              服务无额外授权费用，提供 24/7 监控、调查、响应与取证分析，由 RISE 团队保障快速调查与指导恢复。2026 年 2 月的 Omdia Technical Validation 报告独立评估了
              Halcyon 的反勒索软件能力，为平台的技术主张提供了第三方验证。
            claimRefs: []
      - number: '5.5'
        title: 产品路线图与开发轨迹
        blocks:
          - type: paragraph
            body: >
              Halcyon 的产品路线图由不断演进的勒索软件手法所驱动，表现出紧随新型攻击手段直接推出防御特性的节奏。2025 年 1 月，公司推出 Kernel Guard Protection 并强化了 DXP
              能力。2025 年全年，支持基于组策略的 Enterprise Policy Management 问世，简化了异构企业环境中的管理流程。RDR 服务被列为所有部署的标配，无需额外费用即可提供 24/7
              勒索软件检测与恢复。DXP 2.0 将防护范围拓宽至 Windows 与 Linux 环境。2026 年，公司亮相 RSAC Conference 2026，展示了增强型 AI
              驱动检测与最新的防数据外发功能。路线图还囊括多项持续推进的用户体验优化，例如简化数据导出、更便捷的防护模式管理、Webhook 配置增强以及更精细的资产筛选。Linux
              支持持续扩展，公司正接入更多发行版，应对勒索软件瞄准 Linux 基础设施的增长威胁。借助 Climb 和 Dell 等分销商建立的以渠道为核心的策略，支撑了重点针对北美市场的 MSSP 拓展。尽管产品自
              2022 年推出以来演进迅速，但在 macOS 支持、独立性能基准测试以及详尽的 API 公开文档等维度仍存空白。
            claimRefs: []
      - number: '5.6'
        title: 展品
        blocks:
          - type: callout
            title: 独有的密钥捕获技术
            body: Halcyon 在勒索软件攻击发生时拦截加密密钥的专有能力，能够在无需支付赎金的情况下自动解密恢复。其他终端安全厂商尚未公开证明自身具备这种规模化能力。
            calloutType: strength
            claimRefs:
              - CE010
              - CE004
          - type: callout
            title: 面向勒索软件的 AI/ML 架构
            body: Halcyon 仅针对勒索软件 TTPs 而非通用恶意软件训练机器学习模型，因而获得了更高的勒索软件检测专一性，有望减少困扰通用 EDR 工具的误报。
            calloutType: strength
            claimRefs:
              - CE008
              - CE009
          - type: callout
            title: 独立验证有限
            body: >-
              尽管营销宣传声称优势显著，Halcyon 仍缺少已公布的独立基准测试结果、误报/漏报率数据以及全面的第三方安全审计。2026 年 2 月的 Omdia Technical Validation
              报告是目前唯一公开的独立评估。
            calloutType: risk
            claimRefs: []
          - type: callout
            title: 平台偏重 Windows 的风险
            body: Halcyon 平台主要面向 Windows，Linux 支持仍在铺开且尚不支持 macOS。鉴于勒索软件日益瞄准 Linux 基础设施，跨平台覆盖成熟度的滞后会带来竞争与客户层面的风险。
            calloutType: risk
            claimRefs:
              - CE016
          - type: callout
            title: SOC 2 认证状态
            body: >-
              公开渠道尚无法独立证实 Halcyon.ai 已获得 SOC 2 Type II 认证。检索结果一致指向无关实体（halcyon.us 的 Halcyon Financial
              Technology）。大型企业买方应直接索要认证证明。
            calloutType: assumption
            claimRefs: []
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              Halcyon 的客户群体覆盖大型企业、中型市场，并借助其 MSSP 渠道触达中小企业（SMB）。核心买方画像为终端规模 500+
              企业的首席信息安全官（CISO）或安全副总裁，在这些组织中勒索软件构成关乎存亡的运营风险。在行业分布上，Halcyon
              的落地主要集中在金融服务、医疗健康、制造业、零售与法律行业，这些领域遭遇勒索软件攻击的频率偏高，且承担着繁重的合规义务。公共部门是增长板块，已有政府机构和国防关联组织部署该平台。在地域分布上，Halcyon
              的直销业务以北美为主，不过已借助与 Dell 和 Cisco 的技术合作启动面向日本市场的海外扩张。付费模式以直销企业订阅为主，经由 MSSP 与 VAR 促成的份额在持续走高。截至 2025
              年底，Halcyon 的 Revolution Partner Program 已吸纳超过 70 家渠道伙伴，2025 年 10 月与 Climb Channel Solutions
              达成的分销协议更将触达面延展至数千家转售商和 MSP。Halcyon 未公开披露分细分市场的客户数细分、分行业的收入集中度或平均客单价（ACV），导致精确分层只能参考第三方评测平台与合作伙伴公告。
