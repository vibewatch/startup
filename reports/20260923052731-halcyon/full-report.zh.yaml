      - number: '6.3'
        title: 实名与匿名客户证据
        blocks:
          - type: paragraph
            body: >
              Halcyon 并未公开披露绝大多数客户名单，但匿名案例研究与用户评价为生产环境的实际部署提供了有力证据。FeaturedCustomers 收录了 14 份客户评价，基于 356 项参考评分给出 4.7/5
              的综合评级。具体的匿名实证包括：一家北美大型律所选用 Halcyon 来对抗绕过传统 EDR 的复杂低速隐蔽（low-and-slow）勒索软件攻击；一家全国性领先医疗保险机构看重 Halcyon
              独有的加密密钥捕获能力，将其视作其他厂商无法提供的安全底线兜底；以及一家零售分销企业在事件后处置中，由 Halcyon 检出并阻断了既有安全工具遗漏的 Sunburst
              后门。此外，某家完成部分部署的客户反映，攻击者曾关停其杀毒软件与 EDR，但运行 Halcyon 的终端未受波及，迫使攻击者不得不改变渗透路径。在 Gartner Peer Insights 上，截至 2025
              年中，Halcyon 反勒索软件平台在 19 条经过验证的评价中维持 4.8/5 的评分，用户对其落地简便度、分阶段推广支持与系统可靠性赞誉有加。PeerSpot
              的评论提及性能扎实、分析能力强与扩展性高，但用户也指出技术支持响应速度与第三方集成仍有改进空间。缺乏具名的 Fortune 500 案例是一项空白——尽管公司声称拥有 Fortune 500
              客户与包括国防关联机构在内的公共部门部署，但没有任何具体名单得到公开确认，这限制了潜在买方或投资人开展背景访谈背书的能力。
            claimRefs: []
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
      - number: '6.4'
        title: 留存、满意度与耐久性信号
        blocks:
          - type: paragraph
            body: >
              Halcyon 未披露净收入留存率（NRR）、总收入留存率（GRR）、客户流失率或合同续约率。作为无公开财报文件的私营公司，这些指标完全不透明。然而，间接信号表明其留存表现稳固。公司的客户满意度调查显示，99%
              的客户在部署后对勒索软件抵御韧性抱有信心（引入 Halcyon 前仅为 7%），且 100% 的客户表示对勒索软件业务风险的担忧有所减轻。评测平台上，Gartner Peer Insights 的 4.8/5 与
              FeaturedCustomers 的 4.7/5 评分印证了在提交评价的客户子群中满意度较高。企业网络安全 SaaS 的行业基准显示，受席位扩容、模块交叉销售及高切换成本驱动，NRR 中位数为
              115–130%，前四分之一厂商超过 120%。Halcyon 与现有 EDR 互补而非竞争的架构特性，降低了推倒重来的替换压力，或有助于削减流失风险。其勒索软件质保为绕过 Halcyon 防线的勒索事件提供高达
              $5 million 的赔付额度，兼具客户留存机制与信心建立作用。客户服务评价褒贬不一：整体评分在
              4.6–4.7/5，但对复杂集成问题响应偏慢的反馈以及对更健全培训资源的需求频频出现。缺少队列级留存数据、合同期限分布或扩增收入指标，仍然构成了实质性的尽调缺口。
            claimRefs: []
      - number: '6.5'
        title: 扩张、集中度与渠道风险
        blocks:
          - type: paragraph
            body: >
              Halcyon 的拓客增购（land-and-expand）机制依托在存量客户中拓展终端席位、交叉销售 Data Exfiltration Protection 与 Ransomware Detection
              and Recovery 等新模块，以及由纯监控模式向全面强制模式增购升级。公司的渠道战略演进迅速：从 2023 年底的 70+ 家 MSSP 与 VAR 伙伴，推进到 2025 年 10 月与 Climb
              Channel Solutions 达成分销协议，将触角伸向北美数千家覆盖中小企业、商业及企业级市场的转售商。Revolution Partner Program 在 CRN 2025 Partner
              Program Guide 中斩获五星评级，反映出渠道合作伙伴的高满意度。借助与 Dell 和 Cisco
              的伙伴关系开展海外扩张，重点针对日本，但从地域上看，收入仍高度集中在北美。在不披露各客户收入占比的情况下，集中度风险难以评判。若 Halcyon 的 500+
              家组织中存在少数大型企业客户贡献了不成比例的巨额收入，便存在常规的前十大客户集中度风险。渠道依赖性正成为愈发突出的考量：随着经由 MSSP 的收入占比上升，Halcyon
              面临伙伴分润机制、利润让渡以及直销团队与伙伴报备交易间的渠道冲突。2026 年启动的事件响应合作伙伴计划（包括 Booz Allen Hamilton
              等伙伴）开辟了一条切入违规事件后处置场景的获客新渠道。得益于互补式部署形态，据称采购阻力较低；但有部分评审者提及定价相对偏高，在没有渠道折扣的情况下可能拖慢中端市场的渗透进度。
            claimRefs: []
