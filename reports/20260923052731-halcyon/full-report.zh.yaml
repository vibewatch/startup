  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户价值
        blocks:
          - type: paragraph
            body: >
              Halcyon 的反勒索软件平台是一套专用终端安全方案，专为预防、检测及应对勒索软件攻击并从中恢复而构建。传统终端检测与响应（EDR）产品将勒索软件视为众多威胁向量之一，而 Halcyon
              的全部技术栈均围绕勒索软件专项防御展开架构。该平台在 Windows（Windows 10/11、Server 2012–2022 包括 Core 版本）与 Linux（RHEL、Ubuntu、AWS
              Linux、SUSE）环境中以轻量级终端代理形态部署，可与现有 EDR、SIEM 及备份方案并存运行，不存在代理冲突。Halcyon 的核心客户价值主张立足于三大支柱：依托执行前 AI
              检测与欺骗技术阻断勒索软件执行；在攻击活跃期捕获加密密钥，无需支付赎金即可自动解密恢复；以及由 RISE（Rapid Incident Support and Engineering）团队提供 24/7
              托管式勒索软件检测与恢复（RDR）服务。平台面向中型市场与大型企业组织（涵盖 Fortune 500 企业与公共部门机构），靠缩短驻留时间、压低恢复成本并辅助合规来提供可量化的 ROI。Halcyon
              还辅以一份勒索软件质保，在防御失效时提供资金赔付，将自身定位为兼具技术与财务双重属性的风险缓解工具。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
