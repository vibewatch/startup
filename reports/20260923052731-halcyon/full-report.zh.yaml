  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争替代与平台整合风险
        blocks:
          - type: paragraph
            body: >
              Halcyon 最主要的战略风险，在于既有网络安全厂商推动平台整合所引发的竞争替代。企业安全市场正在经历迅速的平台化演进；企业平均运行来自 29 家供应商的 83
              款安全工具，但正积极向更少且集成度更高的平台归拢。CrowdStrike、Palo Alto Networks 与 Microsoft
              均在各自的终端检测与响应（EDR）及扩展检测与响应（XDR）平台中增加或强化了专对勒索软件的防护功能。CrowdStrike 的 Falcon 平台已向存量订阅用户免费提供勒索软件预防模块，实际是将
              Halcyon 的核心价值主张打包成了免费功能。Palo Alto Networks 的 Cortex XDR 与 Microsoft Defender for Endpoint
              也将反勒索软件能力内嵌到了平台捆绑包中。平台化趋势仍在加速：2024–2025 年网络安全领域的并购刷新纪录，由于 CISO
              优先考虑整合供应商以求简化运维并降低总体拥有成本（TCO），一体化平台厂商渐成主导。身为单点方案的
              Halcyon，面临着经典的“功能点对决完整产品”风险——公司的整条产品品类可能被吸收为企业已部署大平台内的一个功能模块。Halcyon
              的抗辩在于其针对勒索软件量身定制的防御架构（包括密钥捕获与自主恢复）在勒索软件防护广度上超越了通用 EDR
              平台。然而，随着平台厂商不断改进各自的勒索软件模块，这种技术差异化的对外沟通与商业化变现难度日益加大。该风险在中型市场格外突出，在这一细分领域，采购精简度与供应商整合的优先级高于选用最顶尖的反勒索软件产品。公司与
              EDR 共存而非替换的互补部署形态虽然规避了“全面推翻现有系统”的竞争烈度，但当 CISO 面临削减工具数量和压缩安全预算的压力时，仍无法消除采购预算被挤占的风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
