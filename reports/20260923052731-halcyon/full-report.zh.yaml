      - number: '2.3'
        title: 客户分群与采购模式
        blocks:
          - type: paragraph
            body: >
              防勒索方案的主要采购决策人是首席信息安全官（CISO）或安全运营副总裁，通常任职于年营收超过 $500 million 的大型企业。预算由信息安全专项列支，该预算目前平均占到 IT 总支出的 13.2%（高于
              2020 年的 8.6%），表明企业 IT 预算正稳步向安全板块倾斜。KPMG 2025 年网络安全调查显示，99% 的 CISO 预计将增加安全支出，其中防范勒索攻击位列三大优先级之一。


              勒索风险暴露最严重的行业垂直领域构成了采购主力：金融服务、医疗保健、制造业和关键基础设施。医疗机构面临 HIPAA 泄露通报规定，医疗系统遭加密还会直接危及患者人身安全；金融机构受到 OCC、FFIEC
              严格监管以及 SEC 的披露约束；制造与工业企业往往因业务停摆而沦为攻击靶子，平均停机损失远超 $5.08 million 的勒索事件均摊损失；政府与公共部门既要满足 CISA
              合规门槛，又是国家级黑客组织勒索攻击的重灾区。


              实际使用者与采购决策人角色分离：CISO 负责审批预算，而安全运营中心（SOC）分析师与应急响应团队则是防勒索工具的日常运维人员。买单方通常是企业 IT
              预算，但网络安全保险承保机构日益要求投保企业出示专项防勒索管控证明作为承保前提，使得保险公司借助保费折扣成为变相买单的间接推动者。2025 年体量达 $16.3–26.25 billion
              的网络安全保险市场，因而充当了专用防勒索工具落地的加速器。
