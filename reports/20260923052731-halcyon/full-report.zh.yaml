      - number: '1.5'
        title: 发展里程碑与重大事件
        blocks:
          - type: paragraph
            body: >
              Halcyon 从创立到成为独角兽仅用了约三年极具执行力的时间。公司由 Jon Miller 与 Ryan Smith 于 2021 年依托二人在 Cylance、Boldend 和 Accuvant
              积累的深厚经验联手创立。2022 年 10 月，公司完成 $18.7M 种子轮融资并启动反勒索平台研发。2023 年 4 月完成 $50M Series A 轮融资，正式走出隐身状态；同年 12 月迅速跟进完成
              $40M Series B 轮融资。2024 年全年，Halcyon 持续扩充平台能力与客户群体，并在 2024 年 11 月以 $1B 估值拿下 $100M Series C 轮融资。进入 2025
              年，公司推出防御 BYOVD 攻击的 Kernel Guard Protection，发布 Data Exfiltration Protection
              2.0，并将勒索检测与恢复（RDR）列为每次部署的标准功能。Halcyon 还与 Sophos 达成合作，实现双向防篡改保护与威胁情报互通。2026 年，公司在 RSAC 2026
              大会上展示其平台并进一步丰富产品矩阵。在此期间，公开渠道未见裁员、诉讼或监管处罚等重大负面事件的报道，但公司的超高速扩张以及有限的公开透明度，依然带有典型的非上市公司能见度特征。
