      - number: '3.3'
        title: 相邻领域与潜在竞争者
        blocks:
          - type: paragraph
            body: >
              除直接的 EDR/XDR 竞争对手外，Halcyon 还承受着来自相邻安全领域的竞争分流。Rubrik 深耕数据安全与勒索恢复赛道，在 2024 年 4 月 IPO 后交出 2025 财年营收 $886.5
              million（同比增长 41%）、订阅 ARR $1.09 billion 的成绩单。Rubrik 的防勒索思路聚焦于数据保护、不可变备份和网络恢复，而非端点级阻断，这与 Halcyon
              的检测及解密模式形成互补，但双方仍在争夺企业专设的防勒索预算份额。Zscaler 将零信任架构应用于防勒索，2025 财年营收达 $2.67 billion，ARR 突破 $3 billion，市值约
              $42–44 billion；其 ThreatLabz 2025 勒索报告记录了勒索攻击同比暴增 146% 的严峻态势，进一步刺激了市场需求。Cybereason 曾以运营为核心理念征战 EDR 赛道，2025
              年 3 月刚由 SoftBank 领投完成 $120 million 融资，旋即于同年 10 月被 LevelBlue 收购，成为后者继吞并 Trustwave
              之后整合托管安全服务的又一步棋。Cybereason 并入 LevelBlue 虽使其退出了独立竞争阵营，却印证了 EDR 厂商整合潮的不可逆转，正在深刻重构 Halcyon 面临的外部格局。
            claimRefs: []
      - number: '3.4'
        title: 产品特性与技术实力对比
        blocks:
          - type: paragraph
            body: >
              Halcyon 的核心竞争壁垒建立在通用 EDR 厂商无法提供的三大差异化能力之上：自研加密密钥捕获技术（无需支付赎金即可自动解密）、可在内核层阻断 BYOVD 攻击的 Kernel Guard
              Protection，以及针对双重勒索场景在加密前识别数据窃取的 Data Exfiltration Protection 2.0。相比之下，CrowdStrike 和 SentinelOne
              提供的是快照回滚（借助卷影副本还原受损文件），而非主动提取密钥进行解密。Palo Alto Cortex XDR 善于串联网络与端点的跨域检测，但重度倚赖常规行为分析，缺乏专属内核钩子。Microsoft
              Defender 最大护城河在于预装 Windows 端点的渠道分发壁垒，但其防勒索检测高度依赖云端行为分析，离线时防御力骤减。Rubrik
              聚焦受袭后的数据恢复阶段，通过不可变备份与备份异常检测筑底，却无法提供端点层面的实时告警或密钥抓取。Zscaler
              依托零信任交换平台切断勒索病毒投递链路，却不介入端点执行后的隔离处置。在权威第三方评测中，CrowdStrike 与 SentinelOne 均在 MITRE ATT&CK 评估中斩获近乎满分的检出率，而
              Halcyon 的实测表现主要来自官方声称和 Gartner Peer Insights 用户评价，尚未经过标准化第三方评测机构严格检验。
            claimRefs: []
