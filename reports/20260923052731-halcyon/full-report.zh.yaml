  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >
              勒索软件防护市场涵盖端点、网络、邮件网关及云工作负载等各层面，旨在预防、检测、遏制并恢复勒索攻击的所有产品和服务。这包括端点保护平台（EPP）、端点检测与响应（EDR）、专用反勒索工具、备份与恢复方案以及托管检测与响应（MDR）服务。Gartner
              预测 2025 年全球网络安全支出将达到 $212 billion，同比增长 15.1%，这构成了防勒索专属预算所能抽取的总体空间上限。


              Halcyon 切入的目标细分市场更为聚焦：定位于协同或叠加在既有 EPP/EDR 架构之上的专用防勒索平台，提供勒索专属检测、密钥捕获与自动化恢复。这一市场定位剥离了通用端点安全（规模约 $16.25–22.8
              billion）与更广泛的网络安全，转而锁定企业在基础端点防护之外、专门用于强化勒索防御弹性的增量预算。周边关联品类包括网络安全保险（2025 年规模约 $16.3–26.25
              billion，其强制要求投保人具备防勒索管控能力，从而撬动间接需求），以及接入勒索检测信号的安全运营平台（SIEM/SOAR）。


              目前替代专用防勒索工具的现状，是企业普遍依赖来自 CrowdStrike、SentinelOne、Microsoft Defender 或 Palo Alto Cortex XDR 的现有 EDR/XDR
              平台。这些平台固然内置了勒索检测模块，却并非针对内核层加密、BYOVD（自带脆弱驱动）利用或加密前数据外泄等专属攻击链量身定制。Halcyon 的核心价值主张在于：通用 EDR
              往往会漏掉专门绕过行为检测引擎的新型勒索变种。
