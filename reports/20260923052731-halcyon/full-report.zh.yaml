            title: 缺乏独立第三方权威评测背书
            body: >-
              与 CrowdStrike（100% 检出）、SentinelOne（接近满分）和 Palo Alto Networks（领先梯队）不同，Halcyon 尚未参与 MITRE ATT&CK 评估或 SE Labs
              实测。这一权威第三方数据的缺席，令 CISO 很难在标准评测框架下客观比对 Halcyon 与传统 EDR 巨头的防勒索实效。
            calloutType: risk
            claimRefs: []
          - type: callout
            title: 互补定位的可持续性建立在 EDR 巨头无法补齐盲区的前提下
            body: >-
              Halcyon 的互补路线默认传统 EDR 平台在防勒索攻击链上存在长期盲区。倘若 CrowdStrike、SentinelOne 或 Palo Alto
              通过针对性研发抹平这一差距，独立防勒索软件外挂层的增量价值将大打折扣。
            calloutType: assumption
            claimRefs: []
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入结构与定价模型
        blocks:
          - type: paragraph
            body: >
              Halcyon 全部收入均来自其反勒索端点 Agent 的年度 SaaS 订阅许可。产品按“单端点/年”模式订阅计费，定位为现有 EDR/XDR 平台的互补增效模块而非替代品。得克萨斯州信息资源部（Texas
              DIR）采购合同公示的标准公开报价显示：Windows 端点 1–99 个席位为 $55/端点/年，100 个席位以上降至 $35/端点/年；云工作负载为 $75/端点/年；Mac 端点为
              $75/端点/年；Linux 端点为 $50/端点/年。自 2025 年初起，Halcyon 在每次部署中均默认搭售托管式勒索检测与恢复（RDR）服务，由其内部 RISE 专家团队提供 24/7
              全天候托管检测支持，从而增厚订阅收入。公司未公开直接企业大客户销售、渠道合作伙伴（如面向日本市场的 Dell 与
              Cisco）以及托管安全服务商（MSP）转售之间的收入占比。企业合约通常为多年期，但实际成交折扣价与公开牌价的差距未见披露。此外，公司未曾披露任何专业咨询服务、按用量计费或交易性收入构成。
            claimRefs:
              - CI001
              - CI002
