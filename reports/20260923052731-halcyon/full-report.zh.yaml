      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Halcyon 所处的网络安全环境监管日趋严格，跨多个司法管辖区承担实质性的合规义务。2023 年 12 月生效的 SEC
              网络安全披露规则要求上市公司在四个工作日内披露重大网络安全事件，并在年报中阐述其网络安全风险管理流程（涵盖源自第三方供应商的风险）。鉴于 Halcyon 的客户以受制于 SEC 规则的大型企业为主，Halcyon
              面临合同项下顺流传递的要求，须及时通报安全事件并提交安全文档。欧盟各成员国须在 2024 年 10 月前完成内国法转化的 NIS2
              指令，将强制性的网络安全风险管理与事件通报义务扩展至关键基础设施领域的基本与重要实体，违规罚金最高可达 €10 million 或全球年营业额的 2%。NIS2 明确要求供应链安全评估，这意味着 Halcyon
              在欧洲的拓展需要证明自身符合欧盟特有的网络安全标准。FTC 借助《FTC 法案》第 5 条与扩充版《安全保障规则》（Safeguards
              Rule）加大了对网络安全供应商的执法力度，要求建立全面的信息安全计划、多因素认证、加密和针对服务商的监督管理。2024 年万豪（Marriott）同意令确立了 FTC
              认定“合理”安全做法的具体基准，目前已广泛适用于技术供应商。此外，网络保险公司代位求偿诉讼的兴起构成新兴法律风险：2025 年，Ace American Insurance
              起诉网络安全厂商以追偿勒索软件攻击后支付的赔偿款，指称供应商失职导致了安全入侵。联邦法院数据显示，2021 年至 2023 年间勒索软件相关起诉激增超 600%，网络安全厂商被列为被告的情形日益普遍。具体到
              Halcyon，$5 million 的勒索软件质保在客户遭遇绕过 Halcyon 防御的勒索事件时构成了或有负债敞口。质保条款、索赔历史及精算准备金均未公开披露，外部无法评估该负债风险。此外，Halcyon
              的终端代理在客户系统的内核层运行——这种特权访问权限一旦因软件更新诱发系统不稳定，就会带来急剧升高的责任敞口；2024 年 7 月波及全球 8.5 million 台 Windows 系统的
              CrowdStrike 宕机事件即是明证。Halcyon 未公开披露 SOC 2 Type II 认证状态、GDPR 数据处理协议（DPA）或 HIPAA
              商业伙伴协议（BAA）模板，对受监管客户而言构成了合规文档层面的缺失。
            claimRefs:
