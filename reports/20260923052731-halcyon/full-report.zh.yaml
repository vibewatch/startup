  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争态势全景
        blocks:
          - type: paragraph
            body: >
              Halcyon 在庞大的端点安全市场中占据了一个狭窄但具备防守价值的利基生态位：专属防勒索。不同于将勒索视作普通威胁之一的通用 EDR/XDR 厂商，Halcyon
              的整套平台架构——包括密钥捕获解密、Kernel Guard Protection 以及 Data Exfiltration Protection——完全围绕防范、检测和恢复勒索攻击展开。2025 年
              Gartner 端点保护平台（EPP）魔力象限评选出五大领导者：Microsoft、CrowdStrike、SentinelOne、Palo Alto Networks 和 Sophos，各家均在其广义
              EDR/XDR 产品内整合了勒索防护模块。Halcyon 未进入该魔力象限，主因其将自身定位于与现有 EDR 协同部署的互补层，而非替代者。这种“做加法而非做替换”的生态位，既是 Halcyon
              最核心的差异化卖点，也是其最大的竞争隐患：一旦传统 EDR 巨头补齐防勒索能力短板，CISO 为专属防勒索层单独付费的意愿便会大打折扣。截至 2025 年，端点安全市场总值达 $16.25
              billion，年复合增长率为 7–12%，其中专属防勒索支出构成了基础 EDR 之上的增量预算层。
            claimRefs:
