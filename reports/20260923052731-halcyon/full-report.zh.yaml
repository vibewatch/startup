chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 机构定位与使命
        blocks:
          - type: paragraph
            body: >
              Halcyon 是一家网络安全公司，总部位于得克萨斯州奥斯汀（5900 Balcones Drive, Suite 5464, Austin, TX 78731）。公司成立于 2021
              年，全神贯注于攻克勒索软件威胁，打造了专门的反勒索平台。传统端点检测与响应（EDR）厂商往往将勒索攻击视为众多威胁类型之一，而 Halcyon
              的全部技术栈专为防范、检测和恢复勒索攻击而构建。公司宣称的使命是彻底摧毁勒索软件作为网络犯罪商业模式的可行性，让勒索软件“成为历史”。Halcyon
              为非上市公司，走出隐身状态后仅用约三年时间就快速跃升至独角兽地位。公司研发团队主要采取远程办公，但保留奥斯汀的实体总部。Halcyon
              在端点安全与网络弹性市场展开竞争，其差异化优势在于聚焦勒索软件场景以及自研的密钥捕获解密能力。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: 创始人与管理团队
        blocks:
          - type: paragraph
            body: >
              Halcyon 由 Jon Miller（CEO）与 Ryan Smith（CTO）联合创立，两位均为网络安全界资深人士，兼具攻防两端深厚功底。Jon Miller 曾任 Cylance（现隶属
              BlackBerry）首席研究官、Boldend（新一代国防承包商）联合创始人，且为 Accuvant（现 Optiv）早期员工，期间协助搭建起服务 Fortune 500 强的顶尖安全咨询业务之一；他早年还在
              ISS X-Force（现 IBM）担任渗透测试员。Ryan Smith 拥有逾 25 年网络安全经验，曾任 Boldend 和 Exodus Intelligence 的 CTO、Optiv 及
              Accuvant LABS 首席科学家，以及 Cylance 研究副总裁，业内公认他是早期二进制漏洞与利用技术领域的权威专家。高管团队还包括首席运营官 Aaron Mick、首席品牌官 Ryan
              Golden、总法律顾问 Kevin Furgal、首席营销官 Kelly Fiedler 与首席营收官 Jeff Stclair。董事会成员除两位创始人外，还汇聚了 Bain Capital Ventures
              合伙人兼 Symantec 前 CEO Enrique Salem、Evolution Equity Partners 的 Richard Seewald、Gula Tech Adventures 的 Ron
              Gula，以及 SYN Ventures 的 Jay Leek。
