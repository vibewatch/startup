      - CO022
  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    summary: |
      从最宽泛的全球网络安全 TAM，到 Halcyon 估计的可获取市场，按金字塔视角呈现勒索软件防护市场。每一层按与 Halcyon 反勒索软件定位的相关性逐级收窄。数值综合多家分析师机构数据，均为 2025 年估计值。
    sourceRefs:
      - SM001
      - SM002
      - SM004
      - SM018
    data:
      items:
        - label: 全球网络安全支出
          value: 212
          detail: 2025E Gartner；所有信息安全产品与服务（$B）
        - label: 勒索软件防护市场
          value: 30
          detail: 2025E 市场共识中位数；覆盖预防到恢复的技术栈（$B）
        - label: 反勒索软件解决方案
          value: 22.15
          detail: 2025E Market Growth Reports；专用反勒索软件（$B）
        - label: 端点安全（EPP/EDR）
          value: 16.25
          detail: 2025E Fortune Business Insights；基础端点层（$B）
        - label: Halcyon SOM 估计
          value: 0.5
          detail: 基于企业反勒索软件附加采购估算的近期可获取市场（$B）
        - label: 合规监管底线
          value: 1
          detail: SEC 与 CISA 强制要求驱动的合规反勒索软件底线支出（$B）
          tone: neutral
    approximationNotes: >
      Halcyon SOM（$500M）属于数量级估计，假设约 5,000 家目标企业、平均 ACV 为 $100K。勒索软件防护中位数（$30B）取 Research and Markets（$28.5B）与 The
      Business Research Company（$32.8B）的平均值。各层并非严格嵌套的子集——端点安全与勒索软件防护存在重叠，但并未被后者完全包含。
    claimRefs:
      - CM005
      - CM006
      - CM008
      - CM010
  - id: FP001
    title: 竞争定位地图
    type: quadrant
    summary: 按勒索软件专用能力深度（X 轴）与市场规模及分销触达（Y 轴）绘制竞争格局象限，Halcyon 处于勒索软件深度高、市场规模小的位置。
    data:
      points:
        - label: Halcyon
          x: 9
          'y': 2
          detail: 勒索软件专用深度最高（密钥捕获、Kernel Guard、DXP），但规模最小（估计收入约 $79.5M）
        - label: CrowdStrike
          x: 6
          'y': 9
          detail: 收入 $3.95B，ARR $4.24B；在宽泛的 Falcon 平台内拥有强大的勒索软件模块
        - label: SentinelOne
          x: 5
          'y': 6
          detail: 收入 $821M；具备自主回滚能力；企业市场份额持续增长
        - label: Palo Alto Networks
          x: 5
          'y': 10
          detail: 收入 $9.22B；Cortex XDR 提供跨域威胁关联，覆盖勒索软件
        - label: Microsoft Defender
          x: 4
          'y': 10
          detail: 占据 28.6% 端点市场份额；享有预装分发优势，但勒索软件仅是其众多威胁类型之一
        - label: Sophos
          x: 5
          'y': 7
          detail: 连续 16 年入选 Gartner MQ 领导者象限；拥有 Intercept X 反勒索软件；服务 28K+ MDR 客户；Halcyon 合作伙伴
        - label: Rubrik
          x: 3
          'y': 5
          detail: 收入 $886M；勒索软件恢复聚焦备份与数据保护，而非端点检测
        - label: Zscaler
          x: 3
          'y': 8
          detail: 收入 $2.67B；通过零信任阻止勒索软件投递，但不提供端点级遏制能力
    approximationNotes: |
      X 轴（勒索软件深度，1–10 分）依据勒索软件专用能力数量及架构聚焦度打分。Y 轴（市场规模，1–10 分）依据收入、ARR 以及相对同业的市值规模打分。所有评分均为分析师定性评估。
    claimRefs:
      - CP001
      - CP007
  - id: FI001
    title: 收入模型拆解
    type: flow
    summary: 客户采购如何转化为 Halcyon 收入与估计毛利。
    data:
      nodes:
        - id: customer
          label: 企业客户
          detail: 拥有 Windows、Mac、Linux 及云端点的 Fortune 500 / 中端市场组织
        - id: subscription
          label: 年度订阅
          detail: $35–$75/端点/年；按端点计费的 SaaS 许可证
        - id: rdr
          label: RDR 服务
          detail: 由 RISE 团队提供全天候 24/7 托管勒索软件检测与恢复服务，随订阅捆绑
        - id: channel
          label: 渠道收入
          detail: Dell、Cisco、Sophos 合作伙伴贡献；分成比例未知
        - id: revenue
          label: 总收入
          detail: 约 $79.5M（2025 年估计）；未经官方确认
        - id: cogs
          label: 收入成本
          detail: 云托管、RDR 人员薪酬、技术支持；估计占收入 20–30%
        - id: grossprofit
          label: 毛利
          detail: 参考 SaaS 行业基准，估计毛利率在 70–80%
      edges:
        - from: customer
          to: subscription
          label: 购买
        - from: subscription
          to: revenue
          label: 订阅收入
        - from: rdr
          to: revenue
          label: 捆绑进订阅
        - from: channel
          to: revenue
          label: 渠道贡献
        - from: revenue
          to: cogs
          label: 扣除 COGS
        - from: revenue
          to: grossprofit
          label: 产生
    approximationNotes: 收入、COGS 和毛利均为估算值。Halcyon 未公开实际财务数据。毛利率区间参考 CrowdStrike（78%）与 SentinelOne（74%）的公开财务报表。
    claimRefs:
      - CI001
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Halcyon 从端点到云端管理的多层反勒索软件防御架构。
    data:
      layers:
        - id: cloud-management
          label: 云端管理与 API
          detail: 集中式控制台、REST API（api.halcyon.ai）、策略管理、遥测汇聚
        - id: managed-services
          label: 托管服务（RDR/RISE）
          detail: 全天候 24/7 勒索软件检测与恢复、RISE 团队、取证分析
        - id: integration
          label: 集成层
          detail: SIEM 流式传输（Splunk、Sentinel、SecOps）、EDR 增强、SOAR 编排
        - id: data-protection
          label: 数据保护
          detail: DXP 2.0 外传监控、密钥捕获与解密恢复
        - id: detection-response
          label: 检测与响应
          detail: 行为检测引擎、EDR Last Gasp、自动隔离
        - id: prevention
          label: 预防层
          detail: 执行前 AI/ML 微模型、欺骗防御（地理围栏、沙箱伪装、凭据诱饵）
        - id: kernel-protection
          label: 内核与驱动防护
          detail: Kernel Guard（BYOVD 防护）、防篡改、代理自保护
        - id: endpoint-agent
          label: 端点代理
          detail: 面向 Windows（10/11、Server 2012–2022）和 Linux（RHEL、Ubuntu、AWS Linux、SUSE）的轻量代理
    claimRefs:
      - CE008
      - CE009
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 梳理企业买家旅程：从意识到勒索软件威胁，到评估 Halcyon、上线部署，再到席位扩张。
    data:
      nodes:
        - id: awareness
          label: 认知阶段
          detail: 遭遇勒索软件事件或听取威胁简报后，CISO 意识到现有 EDR 存在防御缺口
        - id: evaluation
          label: 评估阶段
          detail: 在监控模式下开展 Halcyon POC / 试用，对比仅有 EDR 的基线表现
        - id: procurement
          label: 采购阶段
          detail: 直接采购，或通过 MSSP/VAR 渠道订阅
        - id: deployment
          label: 部署阶段
          detail: 分阶段推进：监控模式 → 强制阻断模式；每周组织复盘会
        - id: production
          label: 生产运行
          detail: 全天候 24/7 ROC 监控；自动密钥捕获；勒索软件质保生效
        - id: expansion
          label: 业务扩张
          detail: 扩充许可席位、增购 DXP/RDR 模块、升级质保额度
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按发生可能性与影响严重程度梳理 Halcyon 的核心风险，以识别优先级最高的风险敞口。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 危急影响
      rows:
        - label: 高可能性
          values:
            - null
            - EDR 捆绑带来的定价压力
            - 平台整合替代；SEC 传导合规要求；NIS2 供应链合规
            - null
        - label: 中等可能性
          values:
            - null
            - 渠道利润率受挤压；销售领导层依赖
            - 收入集中度不透明；全天候 24/7 SOC 扩容压力；FTC 执法风险；保险公司代位求偿；勒索软件绕过（假阴性）
            - 勒索软件质保总赔付敞口
        - label: 低可能性
          values:
            - 市场时机转变（勒索软件攻击减少）
            - null
            - 核心人员离职；云服务商宕机
            - 内核级代理崩溃；针对 Halcyon 的供应链攻击；Microsoft 限制内核访问
        - label: 极低可能性
          values:
            - 市场时机转变（勒索软件攻击减少）
            - None
            - 核心人员离职
            - 云服务商宕机
        - label: 极高可能性
          values:
            - 'null'
            - 'null'
            - 内核级代理崩溃
            - 针对 Halcyon 的供应链攻击
        - label: 高严重性
          values:
            - 勒索软件质保赔付敞口
            - SOC 2 / ISO / FedRAMP 认证不透明
            - FTC 执法风险
            - 保险公司代位求偿
    claimRefs:
      - CR001
      - CR003
      - CR008
      - CR010
  - id: FV001
    title: 投资建议逻辑
    type: flow
    description: 从证据支柱到投资建议的决策链条
    data:
      nodes:
        - id: n1
          label: 市场顺风
          detail: 勒索软件市场 CAGR 17%；2034 年达 $117.5B；CISO 头号威胁关切
          group: positive
        - id: n2
          label: 产品护城河
          detail: 自研密钥捕获恢复技术；客户零损失记录；Ransomware Warranty 质保
          group: positive
        - id: n3
          label: 收入轨迹
          detail: 估计收入约 $79.5M；累计融资 $190M；一线投资方阵容
          group: positive
        - id: n4
          label: 平台风险
          detail: CrowdStrike/PANW/S1 可将反勒索软件功能捆绑进现有平台许可
          group: risk
        - id: n5
          label: 财务不透明
          detail: 缺乏经审计财务报表；收入仅为第三方估算；NRR 未知
          group: risk
        - id: n6
          label: 投资建议
          detail: 保持中等置信度观察；待披露经审计财务后再作重估
          group: neutral
      edges:
        - from: n1
          to: n6
          label: 支撑
        - from: n2
          to: n6
          label: 支撑
        - from: n3
          to: n6
          label: 支撑
        - from: n4
          to: n6
          label: 限制
        - from: n5
          to: n6
          label: 制约
