            body: >
              截至 2026 年初，Halcyon 员工规模已扩充至约 506 人，高于 2025 年预估的 435 人，反映出工程、销售与运营部门持续招聘纳新。第三方数据聚合平台显示，截至 2025 年 Halcyon
              年收入约为 $79.5M；该数字未经公司官方证实，应视作外部监测平台测算出的预估数据。客户总数未公开披露，但其客户结构覆盖私营企业与公共部门的大型企业和中端市场机构，包含多家 Fortune 500
              强企业。在国际化布局上，Halcyon 已联手 Dell 和 Cisco 进军日本市场。从创立到达到独角兽估值仅历时约三年，这一成长轨迹使 Halcyon
              跻身近年增速最快的网络安全初创公司之列；不过作为非上市公司，其确切的客户留存率与净留存率（NRR）仍未对外披露。
