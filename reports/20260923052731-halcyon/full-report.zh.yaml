      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >
              多家咨询机构以重叠但各有侧重的方法论评估了勒索防护市场的体量。Research and Markets 估计 2025 年全球勒索软件防护市场规模为 $28.5 billion，到 2026 年将以 17.2%
              的复合年增长率（CAGR）增至 $33.4 billion。The Business Research Company 也给出类似轨迹，测算 2025 年规模为 $32.8 billion。Mordor
              Intelligence 预测到 2030 年该市场将达到 $33.15 billion，复合年增长率超过 15%。Fortune Business Insights 测算相近的端点安全市场 2025 年规模为
              $16.25 billion，以 7–12% 的 CAGR 增长，这代表了防勒索工具赖以叠加的基础 EPP/EDR 支出。


              Grand View Research 估计全球勒索防护市场到 2030 年将以 17.5% 的 CAGR 扩张，其中端点防护需求是主力，其在 2024 年占据了 33.15% 的市场份额。按 Market
              Growth Reports 测算，防勒索专属方案细分赛道（口径窄于广义勒索防护市场）在 2025 年估计为 $22.15 billion，预计到 2032 年将以 10.8% 的 CAGR 达到 $38.92
              billion。


              Gartner 的信息安全支出预测勾勒出最宽泛的宏观天花板：2025 年达 $213 billion，2026 年增至 $240 billion（增幅
              12.5%），其中包含端点防护在内的安全软件是增长最快的品类，2025 年规模为 $105.9 billion。这些宏观数据划定了 Halcyon 市场机遇的理论极限。2025 年全球勒索造成的经济损失总计达
              $57 billion，预计 2026 年将升至 $74 billion，这一巨额损失正是勒索防护支出全力压降的直接目标。
            claimRefs:
