callouts:
- calloutType: strength
  title: Proprietary key-capture technology has no competitive equivalent
  body: "As of mid-2026, no competitor \u2014 including CrowdStrike, SentinelOne, Palo Alto Networks, or Microsoft \u2014\
    \ offers automated ransomware encryption key capture and decryption. This capability, which enables recovery without paying\
    \ ransoms, is Halcyon's most defensible technical moat and the primary reason enterprises deploy it alongside existing\
    \ EDR."
  claimRefs: []
- calloutType: risk
  title: Platform consolidation threatens standalone anti-ransomware TAM
  body: The five Gartner MQ Leaders for EPP are aggressively bundling ransomware-specific detection into their XDR platforms.
    With CrowdStrike generating $1.07B and Palo Alto $3.5B in annual free cash flow, these vendors can invest heavily in replicating
    Halcyon's ransomware-specific capabilities, potentially compressing the market for standalone anti-ransomware tools.
  claimRefs: []
- calloutType: insight
  title: Sophos partnership validates complement-not-replace model
  body: Sophos, a 16-year Gartner MQ Leader with 28,000+ MDR customers, chose to partner with Halcyon for mutual anti-tamper
    protection and intelligence sharing rather than build competing ransomware key-capture technology. This partnership from
    an incumbent validates Halcyon's positioning as a complementary layer and suggests the key-capture capability is non-trivial
    to replicate.
  claimRefs: []
- calloutType: risk
  title: No independent third-party benchmark validation
  body: Halcyon has not undergone MITRE ATT&CK evaluations or SE Labs testing, unlike CrowdStrike (100% detection), SentinelOne
    (near-perfect), and Palo Alto Networks (leader-tier). This gap makes it difficult for CISOs to compare Halcyon's ransomware
    detection efficacy against incumbent EDR vendors using standardized benchmarks.
  claimRefs: []
- calloutType: assumption
  title: Complement positioning sustainability assumes EDR vendors do not close the detection gap
  body: Halcyon's complement-not-replace model assumes existing EDR platforms have a persistent blind spot for ransomware-specific
    attack chains. If CrowdStrike, SentinelOne, or Palo Alto close this gap through targeted R&D, the incremental value of
    a standalone anti-ransomware layer diminishes significantly.
  claimRefs: []
