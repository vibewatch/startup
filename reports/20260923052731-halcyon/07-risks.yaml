  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: compliance certifications
    missingEvidence: SOC 2 Type II, ISO 27001, FedRAMP certification status and audit reports
    whyItMatters: Without verified compliance certifications, regulated enterprise and government customers cannot assess
      Halcyon's security posture, and the company may face procurement disqualification.
    diligencePath: Request SOC 2 Type II report, ISO 27001 certificate, and FedRAMP authorization status directly from Halcyon
      management.
    relatedQuestionRefs:
    - QR008
  - type: private-evidence-only
    severity: blocking
    topic: financial metrics
    missingEvidence: Revenue, ARR, burn rate, gross margin, runway, and unit economics data
    whyItMatters: Cannot assess capital efficiency, path to profitability, or remaining runway to determine if Halcyon can
      reach next financing milestone.
    diligencePath: Request audited financials, monthly burn rate, current ARR, and projected runway from Halcyon CFO.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: warranty liability
    missingEvidence: Ransomware warranty claims history, actuarial reserves, reinsurance arrangements, and warranty terms
    whyItMatters: Cannot assess contingent financial exposure from the $5M per-customer warranty program without claims data
      and reserve adequacy.
    diligencePath: Request warranty terms, claims frequency, loss ratios, and reinsurance details from Halcyon legal/finance.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: succession planning
    missingEvidence: Key-person insurance status, succession plan for CEO/CTO, management team organizational chart
    whyItMatters: Key-person risk cannot be assessed without understanding depth of management team, succession readiness,
      and insurance coverage.
    diligencePath: Request key-person insurance details, succession plan documentation, and organizational chart from Halcyon
      board.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: revenue concentration
    missingEvidence: Top-10 customer revenue concentration, customer segment revenue breakdown, contract length distribution
    whyItMatters: Revenue concentration risk is entirely opaque; if few large accounts dominate revenue, standard concentration
      risk applies.
    diligencePath: Request top-10 customer revenue percentage and customer segment breakdown from Halcyon CFO.
  - type: missing-source
    severity: minor
    topic: DXP effectiveness
    missingEvidence: Independent validation or third-party testing of Halcyon's Data Exfiltration Protection module
    whyItMatters: The DXP module is critical for addressing exfiltration-only ransomware attacks, but has no independent validation.
    diligencePath: Request third-party test results or independent evaluation reports for DXP from Halcyon engineering.
    relatedQuestionRefs: []
  - type: missing-source
    severity: minor
    topic: cyber liability exposure
    missingEvidence: Independent legal analysis of vendor liability after major outages and a current assessment of vendor
      litigation risk.
    whyItMatters: Liability exposure affects downside severity and insurance/reserve assumptions.
    diligencePath: Request outside counsel memo and insurance coverage review for comparable vendor litigation scenarios.
    relatedQuestionRefs:
    - QR005
