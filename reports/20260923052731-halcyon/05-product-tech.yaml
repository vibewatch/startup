- calloutType: risk
  title: Limited Independent Validation
  body: Despite strong marketing claims, Halcyon lacks published independent benchmark results, false-positive/negative rates,
    or comprehensive third-party security audits. The single Omdia Technical Validation (Feb 2026) is the only public independent
    assessment.
  claimRefs: []
- calloutType: risk
  title: Windows-Centric Platform Risk
  body: Halcyon's platform is primarily Windows-focused, with Linux support still expanding and no macOS support. As ransomware
    increasingly targets Linux infrastructure, the maturity gap in cross-platform coverage presents competitive and customer
    risk.
  claimRefs:
  - CE016
