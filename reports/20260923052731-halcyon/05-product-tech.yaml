chapter:
  number: 5
  title: Product & Technology
  summary: Halcyon delivers a purpose-built anti-ransomware platform with proprietary key-capture technology, multi-layer
    behavioral detection, kernel-level driver protection, and data exfiltration prevention. The platform differentiates through
    ransomware-specific AI/ML models, automated decryption recovery, and a 24/7 managed Ransomware Detection and Recovery
    service backed by an industry-leading ransomware warranty.
sections:
- id: product-definition
  title: Product Definition and Customer Value
  body: "Halcyon's Anti-Ransomware Platform is a purpose-built endpoint security solution designed exclusively to prevent,\
    \ detect, and recover from ransomware attacks. Unlike traditional endpoint detection and response (EDR) products that\
    \ treat ransomware as one threat vector among many, Halcyon's entire technology stack is architected for ransomware-specific\
    \ defense. The platform is deployed as a lightweight endpoint agent on Windows (Windows 10/11, Server 2012\u20132022 including\
    \ Core editions) and Linux (RHEL, Ubuntu, AWS Linux, SUSE) environments, operating alongside existing EDR, SIEM, and backup\
    \ solutions without agent conflicts. Halcyon's core customer value proposition centers on three pillars: preventing ransomware\
    \ execution through pre-execution AI detection and deception techniques; capturing encryption keys during active attacks\
    \ to enable automated decryption without paying ransoms; and providing 24/7 managed ransomware detection and recovery\
    \ (RDR) through the RISE (Rapid Incident Support and Engineering) team. The platform targets mid-market and enterprise\
    \ organizations, including Fortune 500 companies and public sector entities, offering measurable ROI through reduced dwell\
    \ time, minimized recovery costs, and compliance support. Halcyon supplements this with a ransomware warranty providing\
    \ financial coverage if protection fails, positioning it as both a technical and financial risk mitigation tool.\n"
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  tableRefs:
  - TE002
- id: architecture-and-technology
  title: Architecture and Technical Implementation
  body: 'Halcyon''s architecture employs a multi-layered defense model where each layer targets a different stage of the ransomware
    attack chain. The pre-execution layer uses AI and purpose-built machine learning micro-models trained exclusively on real-world
    ransomware tactics, techniques, and procedures (TTPs) to block known and emerging strains before they execute. The exploitation
    mitigation layer employs deception techniques including geo-fencing, sandbox spoofing, and credential mirages to make
    endpoints appear as unattractive targets. The behavioral detection layer monitors for suspicious activities such as privilege
    escalation, lateral movement, and process injection using ransomware-focused models. The resilience and recovery layer
    autonomously halts active attacks, isolates impacted endpoints, and recovers affected files using captured encryption
    key material. Kernel Guard Protection, introduced in 2025, addresses Bring Your Own Vulnerable Driver (BYOVD) attacks
    by detecting and blocking malicious usage of known vulnerable signed drivers that attackers exploit to disable security
    controls. EDR Last Gasp detects when ransomware attempts to terminate third-party security solutions including CrowdStrike
    Falcon, SentinelOne Singularity, Microsoft Defender for Endpoint, and Palo Alto Cortex XDR. Data Exfiltration Protection
    (DXP) 2.0 monitors for excessive data transfer volume or suspicious destinations, addressing double-extortion tactics
    by automatically engaging the RDR team when preset thresholds are crossed. The platform''s AI/ML engine is trained only
    on ransomware, not general malware, which the company claims increases accuracy and reduces false positives compared to
    general-purpose tools.

    '
  claimRefs:
