- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer/Component
  - Role
  - Dependency
  - Risk
  rows:
  - - Endpoint Agent (Windows)
    - Primary deployment vehicle; all detection/prevention runs on-endpoint
    - "Windows OS (10/11, Server 2012\u20132022)"
    - Windows-centric; limited cross-platform coverage
  - - Endpoint Agent (Linux)
    - Expanding platform coverage for Linux servers
    - Linux distributions (RHEL, Ubuntu, AWS Linux, SUSE)
    - Newer than Windows agent; maturity gap possible
  - - AI/ML Micro-Models
    - Pre-execution ransomware classification
    - Training data pipeline and ransomware sample corpus
    - Model drift if ransomware TTPs evolve faster than retraining
  - - Behavioral Detection Engine
    - Runtime monitoring for ransomware behaviors
    - Kernel-level visibility and OS API access
    - BYOVD attacks could bypass if not caught by Kernel Guard
  - - Key Capture Module
    - Intercepts encryption keys during active ransomware attacks
    - Access to ransomware process memory and cryptographic APIs
    - Not all ransomware implementations expose keys; coverage varies
  - - Cloud Management Console
    - Centralized policy, telemetry, and alert management
    - Cloud infrastructure (AWS/Azure assumed)
    - Cloud dependency for management; single point of control
  - - SIEM Integration Layer
    - Streams telemetry to Splunk, Sentinel, SecOps, etc.
    - Customer SIEM infrastructure and network connectivity
    - Integration quality varies by SIEM vendor
  - - Kernel Guard
    - Blocks BYOVD attacks via vulnerable driver detection
    - Maintained database of known vulnerable drivers
    - Zero-day vulnerable drivers not in database could bypass
  notes: Architecture inferred from official platform documentation, press releases, and technical deep-dive datasheets. Internal
