- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current Workflow (without Halcyon)
  - Company Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Prevent ransomware execution
    - Rely on EDR/AV signature and heuristic detection
    - Pre-execution AI + behavioral detection + deception
    - Blocks ransomware that bypasses EDR; reduces dwell time
    - Supplements rather than replaces EDR; requires both tools
  - - Recover encrypted data without ransom
    - Restore from backups (hours to days) or pay ransom
    - Automated key capture and decryption recovery
    - Recovery in hours vs. days/weeks; eliminates ransom payment
    - Key capture may not succeed for all ransomware families
  - - Detect EDR tampering by attackers
    - Manual monitoring of security tool health
    - EDR Last Gasp automated detection and alerting
    - Real-time visibility when attackers disable security tools
    - Limited to specific named EDR vendors
  - - Prevent data exfiltration (double extortion)
    - Network DLP tools with broad scope
    - DXP 2.0 ransomware-focused exfiltration monitoring
    - Targeted detection of ransomware-specific exfiltration patterns
    - Threshold-based; may require tuning per environment
  - - 24/7 ransomware incident response
    - Internal SOC or MSSP with general IR capabilities
    - RISE team managed RDR service included at no extra cost
    - Dedicated ransomware expertise; no additional licensing fees
    - Response SLAs and escalation details not publicly documented
  notes: Benefits are based on company marketing claims and third-party reviews. Specific quantitative metrics (e.g., exact
