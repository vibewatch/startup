- id: capability-channel-and-trust-comparison
  title: Capability breadth and channel mix matter as much as brand recognition
  body: |-
    Kry’s product scope is unusually blended. Official materials and partner pages show video consultations, physical clinics, employer and insurer partnerships, diagnostics adjacency, and multilingual AI-enabled support. Many competitors are strong in only one or two of those dimensions. HealthHero is strong in enterprise and NHS support, Push Doctor emphasizes UK GP access, ZAVA is now highly visible in prescription and weight-loss pathways, while Doctolib and Docplanner are strongest as patient-access and workflow ecosystems. Teladoc brings the broadest global virtual-care platform, including mental health and chronic condition management.

    This creates an important comparison lens: some rivals compete on breadth, others on channel, and others on geography. Kry’s multi-market operational footprint gives it more regulatory and deployment complexity than single-country rivals, but also creates a stronger learning curve around channel mix and hybrid-care operations. The annual report and official pages suggest Sweden remains the most mature operating base, while France and the UK are more exposed to competitive channel fights.

    Trust and regulatory posture are also part of the competitive product. Livi UK’s CQC registration and public quality record matter because digital-care competition often hinges on whether patients, partners, and payers believe the service can safely handle ongoing primary-care needs. Competitors with strong consumer brands but weaker local regulatory embedding may be less defensible than they look from brand metrics alone.
