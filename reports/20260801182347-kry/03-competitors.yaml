- id: moat-durability-and-adverse-competitor-evidence
  title: The moat is real but not impregnable, and adverse competitor evidence cuts both ways
  body: |-
    There is clear evidence that the category can scale and also clear evidence that not all models win. Teladoc remains enormous but recently reported year-on-year revenue decline in second-quarter 2026, showing that scale does not remove growth pressure. Doctorlink’s discontinuation as a standalone product under HealthHero suggests consolidation can shift value away from pure consumer-facing brands toward embedded platform or channel models. ZAVA’s weight-loss-heavy messaging suggests focused clinical verticals can also carve out demand that broad primary-care platforms do not automatically own.

    For Kry, the strongest moat elements appear to be hybrid care delivery, public-system familiarity, partner distribution, and country-level operating knowledge. None is invulnerable. Doctolib and Docplanner show that patient access and provider workflow layers can become powerful fronts of competition without owning the full care journey, while Nordic rivals show that hybrid clinic footprints can be reproduced locally. In other words, Kry has a differentiated position, but not one that eliminates commoditization risk.

    The durable question is whether Kry can remain the preferred front door in enough channels at once. If patients multi-home, employers rebid, public rules change, or specialist categories unbundle, the company may still grow but lose pricing power or margin quality. Competitive analysis therefore supports a qualified moat thesis: Kry has meaningful differentiation, but durability depends on execution, channel renewal, and local trust, not on a winner-take-most market structure.
