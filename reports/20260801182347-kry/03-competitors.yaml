  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing and contract economics
    missingEvidence: Like-for-like pricing, contract length, and renewal terms across Kry and direct peers.
    whyItMatters: Competitive intensity is easier to observe than actual pricing power or contract durability.
    diligencePath: Request pricing decks, partner contracts, and renewal data for top competitor overlaps.
    relatedQuestionRefs:
    - QP009
    - QP012
    - QP022
  - type: private-evidence-only
    severity: material
    topic: switching and retention cohorts
    missingEvidence: Cohort data on repeat use, churn, reactivation, and win/loss by competitor channel.
    whyItMatters: Moat durability depends on actual switching behavior, not just product positioning.
    diligencePath: Request cohort retention and competitive win/loss analysis by market.
    relatedQuestionRefs:
    - QP017
    - QP023
    - QP021
    - QP018
