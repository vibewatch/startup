chapter:
  number: 3
  title: Competitors
  summary: Kry competes across several overlapping battlegrounds rather than a single peer set. In the Nordics it faces hybrid digital-care rivals such as Doktor.se, Min Doktor, and Dr.Dropin; in the UK it meets HealthHero, Push Doctor, ZAVA, and NHS-embedded digital access tools; in France it collides indirectly with Doctolib-style patient-access platforms; and at the large-cap global end it overlaps with Teladoc. Kry’s edge is its multi-country hybrid care model, but substitute pressure remains high because patient acquisition, partner channels, and regulated primary-care access are all contestable.
sections:
- id: landscape-and-peer-buckets
  title: The competitive set spans hybrid care, virtual-care brands, marketplaces, and status quo substitutes
  body: |-
    Kry does not compete in one clean category. The most direct competitors are other digital-first care providers that combine app-based intake with employed or affiliated clinicians and, in some cases, physical locations. In Sweden that includes Doktor.se and Min Doktor, while Dr.Dropin shows a broader Nordic hybrid model with dense clinic coverage and video access. In the UK, HealthHero, Push Doctor, and ZAVA attack different parts of digital-primary-care and benefits demand. Teladoc represents the largest global virtual-care analogue, though its U.S.-heavy footprint and broader condition-management stack make it more of a strategic reference than a one-for-one local substitute.

    A second bucket includes patient-access and workflow platforms such as Doctolib and Docplanner. These are not identical to Kry because they do not define themselves purely as care-delivery providers, but they still compete for patient demand, provider relationships, and digital front-door mindshare. They are particularly relevant in France and Europe-wide valuation narratives because they prove that digital healthcare can scale through access, scheduling, and workflow layers rather than only through clinician employment.

    The third bucket is the status quo. Traditional GP practices, local clinics, telephone triage, and national digital-health infrastructure remain powerful substitutes because they already sit inside trusted reimbursement and care pathways. Kry therefore wins not just by offering a better app, but by proving that its combination of access speed, clinical quality, physical follow-through, and partner distribution is better than both local incumbents and digital rivals.
