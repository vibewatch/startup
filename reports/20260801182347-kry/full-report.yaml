  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Kry should not be sized as all of European digital health. The company monetizes a narrower slice:
              digital-first primary care and adjacent telehealth workflows delivered either through public-system
              reimbursement, insurer or employer distribution, or direct patient channels that still depend on regulated
              local care delivery. The annual report, official brand pages, and partner materials show a digiphysical
              model spanning video consultations, care navigation, physical clinics, occupational-health access, and
              selected diagnostics. That makes broad digital-health or telehealth TAM pages useful context, but not
              direct proxies for Kry's capturable market.


              The best way to handle sizing is with multiple lenses. Analyst pages suggest a very large adjacent market
              envelope, while company and annual-report disclosures show Kry's realized footprint is much smaller and
              much more country-specific. Sweden remains the economic core, France has become a scaled teleconsultation
              market with regulatory normalization, the UK depends heavily on NHS and partner distribution mechanics,
              and Norway is strategically relevant but financially small. The practical question is therefore not
              whether digital health is large, but how much reimbursed primary-care access and hybrid care budget in
              these four countries can migrate to Kry's model.


              This chapter keeps broad TAM, country-level monetization evidence, and partner-distribution evidence
              separate on purpose. Published market estimates differ because they use different boundaries, different
              geographies, and different mixes of software, care delivery, and remote-monitoring spend. Preserving those
              contradictions is more useful than forcing a fake-precision SAM.
