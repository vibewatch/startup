      - CV001
      - CV002
      - CV003
      - CV029
  - id: FV002
    title: Valuation anchor ladder
    type: pyramid
    layout: standard
    summary: Hard valuation evidence is much thinner than hard operating evidence.
    data:
      items:
        - label: Current tracker chatter
          detail: Latest narratives and secondary hints are noisy
          tone: warning
        - label: 2021 priced-round anchor
          detail: $2B clean historical reference
          tone: neutral
        - label: 2024 operating scale
          detail: SEK 2,497M revenue and improved margins
          tone: positive
        - label: Primary diligence missing
          detail: Cash, debt, cap table, preferences
          tone: risk
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: FV003
    title: Comparable positioning map
    type: matrix
    layout: wide
    summary: Kry sits between asset-light digital-health platforms and labor-heavy telehealth operators.
    data:
      columns:
        - Care-delivery intensity
        - Workflow / network leverage
        - Public market read-through
        - Implication
      rows:
        - label: Teladoc-like
          values:
            - High
            - Medium
            - Cautious
            - Shows downside of multiple compression
        - label: Doximity-like
          values:
            - Low
            - High
            - Favorable
            - Shows premium for asset-light productivity
        - label: Hims-like
          values:
            - Medium
            - High
            - Momentum-sensitive
            - Shows narrative upside when growth is strong
        - label: Kry
          values:
            - High
            - Medium
            - Mixed
            - Needs blended multiple and discount for opacity
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV028
  - id: FV004
    title: Valuation / return range
    type: range
    layout: standard
    summary: The sensible valuation range is wide because current price and cap-table evidence are incomplete.
    data:
      items:
        - label: Bear valuation
          low: 0.8
          mid: 1
          high: 1.2
          displayValue: $0.8B → $1.0B → $1.2B
          detail: Telehealth compression plus financing overhang
          tone: risk
        - label: Base valuation
          low: 1.3
          mid: 1.5
          high: 1.8
          displayValue: $1.3B → $1.5B → $1.8B
          detail: Improving business, but still discounted to stale peak
          tone: neutral
        - label: Bull valuation
          low: 2
          mid: 2.1
          high: 2.3
          displayValue: $2.0B → $2.1B → $2.3B
          detail: Sustained margin improvement plus better disclosure
          tone: opportunity
    approximationNotes: >-
      Scenario bands are heuristic USD-bn ranges, not observed transaction prices. They exist to show how much value
      depends on evidence unlocks and pricing discipline.
    claimRefs:
