  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: The highest-risk quadrants are reimbursement, regulated execution, and financing opacity.
    data:
      columns:
        - Low impact
        - Medium impact
        - High impact
      rows:
        - label: Low likelihood
          values:
            - Minor legal-link hygiene issues
            - Localized support friction
            - n/a
        - label: Medium likelihood
          values:
            - Customer-comment noise
            - Channel concentration
            - Clinical governance weakness
        - label: High likelihood
          values:
            - n/a
            - Hybrid operational complexity
            - Reimbursement interpretation risk
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR020
  - id: FR002
    title: Regulatory dependency map
    type: flow
    layout: wide
    summary: >-
      Kry depends simultaneously on clinical quality, reimbursement interpretation, privacy compliance, and local legal
      entities.
    data:
      nodes:
        - id: n1
          label: Patient care event
          detail: Consultation or follow-up
          type: input
        - id: n2
          label: Clinical governance
          detail: Documentation, prescribing, continuity
          type: process
        - id: n3
          label: Reimbursement logic
          detail: Billing and scope interpretation
          type: process
        - id: n4
          label: Data / privacy controls
          detail: Sensitive-data handling
          type: process
        - id: n5
          label: Local regulated entity
          detail: Country-specific accountability
          type: process
        - id: n6
          label: Revenue + trust outcome
          detail: Margin, compliance, partner confidence
          type: output
      edges:
        - from: n1
          to: n2
          label: care delivery
        - from: n2
          to: n6
          label: quality outcome
        - from: n1
          to: n3
          label: claimable activity
        - from: n3
          to: n6
          label: revenue outcome
        - from: n1
          to: n4
          label: data created
        - from: n4
          to: n6
          label: trust outcome
        - from: n2
          to: n5
          label: entity responsibility
        - from: n5
          to: n6
          label: regulatory accountability
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
      - CR017
  - id: FR003
    title: Dependency and trigger stack
    type: pyramid
    layout: standard
    summary: Risk compounds when digital operations, partner channels, and reimbursement logic all matter at once.
    data:
      items:
        - label: Technology and support
          detail: Needed to keep service live and usable
          tone: neutral
        - label: Partner / channel renewals
          detail: Needed to sustain efficient distribution
          tone: warning
        - label: Hybrid care operations
          detail: Needed for resolution and quality
          tone: warning
        - label: Reimbursement and regulatory trust
          detail: Most thesis-critical layer
          tone: risk
