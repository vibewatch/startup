      - number: '4.4'
        title: Capital adequacy looks better, but financing transparency is still uneven
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of Kry’s capital story is visible: margin and cash-flow improvements are real,
              management says the group reached positive cash flow in February 2025, and the business is large enough
              that investors are not evaluating a pre-revenue startup. The less encouraging part is that public evidence
              still does not fully resolve the current balance sheet or latest valuation. The annual report discloses
              financing and ownership-structure work in 2024, while third-party trackers disagree on total funding,
              current implied value, and the meaning of recent secondary-market indications.


              Tracxn, WOWLS, Forge, Accumeo, Indexed.vc, GetLatka, and Signalbase all help frame the financing
              narrative, but they do not align cleanly. Tracxn shows $703 million raised over seven rounds with a $2
              billion valuation attached to the 2021 Series D; Indexed.vc and Signalbase add later-round or
              later-funding narratives; Forge and Accumeo indicate an active private-market or secondary-market context;
              WOWLS argues the 2021 valuation may overstate current fundamentals. That set is useful for scenario
              framing, but not strong enough to substitute for direct company disclosure.


              The financial bottom line is therefore nuanced. Kry no longer looks obviously financing-constrained on
              public evidence alone, but it also does not provide enough direct disclosure to eliminate financing
              dependency as a risk. Investors can underwrite improving performance, yet should still ask for cash
              balance, debt terms, covenant detail, preference stack, and planned use of funds before assuming the
              company can self-fund all next-stage growth.
