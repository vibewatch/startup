  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The company thesis is stronger than the current valuation evidence
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Kry is straightforward and supported by earlier chapters. The company has real scale,
              improving financials, a hybrid care model, meaningful customer adoption, and a product that looks more
              operationally serious than many telehealth narratives imply. Europe’s healthcare access problems are
              persistent, and Kry has already shown that it can win demand across Sweden, France, the UK, and Norway.


              The anti-thesis is equally important. Public evidence on current valuation is conflicted, recent financing
              terms are not cleanly disclosed, and the sector has already demonstrated how quickly telehealth multiples
              can collapse when reimbursement or margins disappoint. Kry’s own progress does not erase the lessons from
              Babylon’s collapse, Teladoc’s post-peak re-rating, or broader skepticism about labor-intensive care models
              being valued like software.


              That makes valuation here highly price-sensitive. If an investor can enter meaningfully below the old
              2021-style peak framing, with access to primary diligence on balance sheet, cohort economics, and partner
              concentration, the opportunity is interesting. If the ask still assumes a premium, software-like multiple
              without new disclosure, the prudent stance is to track or research more rather than stretch.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
