      - number: '7.4'
        title: Financial and model risk are improving, but not fully resolved
        blocks:
          - type: paragraph
            body: >-
              The financial model has improved materially, but investors should resist turning improvement into
              immunity. Margin and cash-flow progress reduce risk, yet the business still operates in a sector with
              heavy skepticism about telehealth economics. Public trackers disagree on the current valuation context,
              and the company does not publish enough balance-sheet detail to eliminate financing dependency or
              preference-overhang risk.


              A broader model risk also remains: telehealth can produce high usage without necessarily producing
              software-like margins. Kry’s hybrid model is arguably better positioned than pure-video peers because it
              can route into physical care and partner workflows, but it also carries capital intensity and staffing
              complexity. That means the model can fail either through reimbursement deterioration or through an
              inability to maintain operational efficiency at scale.


              Mitigations are visible. Kry has improved profitability, formal legal and privacy frameworks exist, the UK
              service is regulated and externally reviewed, support and training functions are public, and the company
              has diversified channels beyond one pure app. The residual risk is therefore not that management has
              ignored controls, but that healthcare delivery is a hard business where even well-controlled operators can
              face sudden policy, quality, or funding shocks.
            claimRefs:
              - CR029
              - CR030
