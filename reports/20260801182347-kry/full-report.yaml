      - number: '1.4'
        title: Milestones, recognition, and early adverse file
        blocks:
          - type: paragraph
            body: >-
              Kry's milestone record supports a company that has moved beyond simple video-GP positioning. Over 2024 and
              2025 the group adapted to new French regulation, maintained a Good CQC rating for the UK service, pushed
              deeper into public primary care in Norway, took over Kungsbacka Lättakut in Region Halland, and acquired
              Hermelinen Group in northern Sweden. Product-side milestones include chronic respiratory digital care
              pathways through Mjog and a Microsoft-documented Azure OpenAI deployment to automate administrative work
              and improve patient routing.


              There is also clear external recognition. Time ranked Kry among the world's most innovative healthtech
              companies in 2025, and Microsoft featured the company as a customer story showing more than 200 million
              patient interactions and services delivered in more than 30 spoken languages. These are useful proof
              points for brand reach and platform ambition, though they are still adjacent to, rather than substitutes
              for, hard financial disclosure.


              The adverse file is not empty. Livi UK's 2024 CQC effective report flagged that the service did not always
              inform patients' own GPs when certain prescriptions would affect ongoing care. More materially, Kry's
              annual report disclosed two 2025 regional repayment disputes in Sweden: Region Skåne sought SEK 18.8
              million and Region Stockholm sought SEK 48 million tied to billing and consultation-structure
              disagreements, both of which Kry disputes. These items are not thesis-breaking on their own, but they
              confirm that reimbursement, billing interpretation, and regulated-care execution are live risks rather
              than abstract footnotes.
