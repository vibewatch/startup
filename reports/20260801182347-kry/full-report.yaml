      - number: '2.4'
        title: Contradictory estimates and substitute intensity should stay explicit
        blocks:
          - type: paragraph
            body: >-
              The cleanest analytical mistake would be to treat every digital-health number as a direct Kry market
              number. Mordor's Europe digital-health estimate, MarketsandMarkets' telehealth estimate, and Grand View's
              telehealth framing all describe adjacent opportunity pools, but they do not share the same product
              boundary, payer mix, or geography as Kry's disclosed operations. They are useful for directional context
              and for valuation narrative, not for precise underwriting of Kry's near-term SOM.


              Substitutes also matter more than category pages imply. Kry is displacing traditional GP access, human
              administrative routing, legacy local clinics, and in some markets digital incumbents that already sit
              inside insurer or public-system pathways. The Doctorlink discontinuation under HealthHero shows that not
              every digital-primary-care product survives independently; the category can consolidate or shift from
              branded apps to embedded infrastructure. That makes buyer-channel durability, not just patient demand, a
              key diligence question.


              Investors should therefore keep three unresolved questions open: how much of Kry's future growth comes
              from public reimbursement versus partner distribution, how much additional clinic and specialist capacity
              is needed to preserve service quality as digital demand grows, and whether post-2025 market narratives
              about telehealth scale map to profitable hybrid care rather than gross consultation volume. Those gaps
              affect both market analysis and valuation later in the report.
            claimRefs:
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
