      - number: '6.3'
        title: Durability likely comes from continuity and channels, but concentration risk remains
        blocks:
          - type: paragraph
            body: >-
              There are real reasons to believe customer relationships can be durable. Sweden’s listed-patient model
              creates an ongoing relationship; partner channels can renew over multi-year periods; and hybrid care lets
              Kry follow the patient from digital intake into ongoing or physical care. These features should improve
              repeat use and make the platform more valuable than a single consultation. The app-store descriptions also
              emphasize renewals, referrals, specialist access, and chronic or family use cases that support recurring
              engagement.


              But concentration risk should remain explicit. Sweden is still the economic core; large public or partner
              channels in the UK may be disproportionately important to marginal growth; and France’s teleconsult usage
              could still depend heavily on reimbursement and access conditions outside Kry’s control. Public evidence
              shows expansion potential, but not whether it is balanced across a diversified customer portfolio.


              The practical implication is that customer quality looks favorable, but customer economics are not yet
              fully de-risked. Investors should assume there is meaningful repeat usage and partner durability, while
              still demanding cohort, renewal, and concentration data before treating the customer base as fully sticky
              or diversified.
            claimRefs:
