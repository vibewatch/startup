      - number: '5.4'
        title: Differentiation comes from operating model, local integration, and trust controls
        blocks:
          - type: paragraph
            body: >-
              Kry’s differentiation is stronger in system design and local execution than in publicly documented core
              algorithms. The company claims more than 200 million patient interactions, broad language coverage, 24/7
              clinician access, and a hybrid digital-physical network. Microsoft’s case study adds Azure OpenAI-enabled
              workflow automation, while Mjog materials add workflow automation and communication tools for external
              practices. Those signals collectively support a view that Kry has meaningful product depth, even if the
              public technical surface is not developer-heavy.


              Trust and compliance controls are also central to the product. Legal materials explicitly separate the
              platform company from local care providers, privacy and UK legal pages define responsibilities and
              notices, Livi’s download page links to safeguarding and vulnerability-disclosure materials, and the CQC
              record provides an external regulatory quality anchor. These are not decorative. In healthcare, privacy
              posture, safeguarding, and clinical-accountability structures are product features because they determine
              whether patients, regulators, and channel partners will trust the workflow.


              The limitation is that public evidence does not show deep architecture diagrams, patents, performance
              benchmarks, or a large developer ecosystem. That makes Kry look more like an operationally sophisticated
              healthcare platform than a pure technology moat story. For investors, that is acceptable if adoption and
              outcomes stay strong, but it means diligence should focus on real workflow advantage, support costs, and
              safety controls rather than on assumed software magic.
