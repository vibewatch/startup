      - number: '2.3'
        title: Growth drivers are strong, but regulatory and workflow friction remain structural
        blocks:
          - type: paragraph
            body: >-
              The growth case for Kry is credible. The annual report shows France delivered one million digital
              appointments in 2024 with roughly 35% growth and about 10% share of remote doctor meetings, while company
              disclosures show Sweden remains a scaled primary-care base and the UK keeps broad digital-access
              relevance. IQVIA's 2024 market review likewise argues that digital health is maturing beyond wellness apps
              toward provider-facing care, diagnostics, decision support, and remote management. Kry's hybrid model fits
              that direction better than a narrow video-consult thesis.


              Policy is both tailwind and tax. The European Health Data Space creates a long-run interoperability and
              digital-health single-market push, and UK digital-access requirements emphasize sustained online
              consultation capacity and fast response windows. These shifts help normalized digital care, but they also
              increase implementation burden, integration work, and trust expectations. Public reimbursement systems can
              accelerate adoption once aligned, yet they also expose operators to billing disputes, rule changes, and
              procurement friction.


              The result is a market that can grow without becoming easy. Analyst TAM pages show large spend pools, but
              company history and competitor outcomes show that operational execution matters more than headline
              category growth. Market conversion depends on channel mix, physician workflow, regulation, clinic
              utilization, and proof that hybrid care can scale economically, not just on patient willingness to use
              digital care.
