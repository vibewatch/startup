      - number: '4.3'
        title: Geographic concentration and hybrid go-to-market shape the financial model
        blocks:
          - type: paragraph
            body: >-
              Kry’s disclosed revenue mix confirms that Sweden is still the economic core. The annual report shows 2024
              revenue of SEK 1,788.8 million in Sweden, SEK 417.1 million in France, SEK 247.8 million in the UK, and
              SEK 35.9 million in Norway. That matters because it makes the company less of a balanced four-country
              portfolio than a Swedish anchor with two meaningful expansion markets and one small outpost. Investors
              should read the France and UK stories as important growth vectors, but not yet as co-equal earnings
              engines.


              The go-to-market model is also financially unusual. Kry is not only selling software or only buying app
              traffic. It combines public-system care delivery, digital front-door access, insurer and employer
              distribution, and a clinic network that can absorb in-person demand when needed. The Hermelinen
              acquisition underscores this hybrid logic by adding northern-Sweden capacity and specialty services rather
              than just more digital demand. Financially, that can improve defensibility and care resolution, but it
              also raises integration, utilization, and operating-leverage questions.


              This is why capital intensity cannot be reduced to cloud spend or engineering headcount. Kry appears to be
              improving because its hybrid model is maturing, not because it has transformed into a lightweight software
              marketplace. That is investable if the company can keep utilization and channel economics disciplined, but
              it makes clinic-level and market-level contribution margins critical diligence asks.
