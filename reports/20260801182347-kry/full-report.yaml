      - number: '5.3'
        title: Integration and deployment are central to the product promise
        blocks:
          - type: paragraph
            body: >-
              The public technology story emphasizes usable deployment rather than frontier R&D. Kry’s patient products
              show identity-linked booking, app-based follow-up, and country-specific reimbursement or clinic routing.
              Mjog’s public pages emphasize integration with the clinical system, reminders built around actual slot
              types, video and SMS inside the clinician workflow, and structured patient questionnaires for remote
              monitoring. Norway’s fastlege materials similarly focus on digital reception, cloud journal systems,
              operations support, and day-to-day efficiency.


              This matters because digital healthcare fails less often from missing features than from deployment
              friction and workflow disruption. Kry’s product positioning consistently aims at reducing phone load,
              improving access, and making clinicians easier to reach without forcing them out of their normal operating
              environment. The support and knowledge-base materials also suggest the company treats training, service
              status, and technical support as core parts of the product, not just afterthoughts.


              Reliability evidence is still more operational than technical. CQC quality status, Mjog support materials,
              and patient-facing FAQs provide comfort that the platform is live and actively used, but public sources do
              not disclose uptime, incident frequency, infrastructure topology, or security testing cadence. Reliability
