      - number: '5.2'
        title: Modules and assets span patient app, clinician tooling, partner solutions, and clinic operations
        blocks:
          - type: paragraph
            body: >-
              Kry’s product stack appears to have at least four distinct layers. First is the consumer or patient layer:
              booking, video consultations, digital care follow-up, pricing and payment logic, and localized experiences
              by market. Second is the clinician and operations layer that supports consultations, prescriptions,
              scheduling, routing, and continuation of care. Third is the partner and enterprise layer used by
              NHS-linked, insurer, employer, and other institutional customers. Fourth is the Mjog communication
              platform, which extends beyond the Kry app into practice workflow, messaging, reminders, video, and remote
              monitoring.


              Mjog is particularly important because it shows Kry owns not only a care-delivery brand but also a
              workflow asset with standalone value. Public Mjog materials describe integration with clinical systems,
              appointment reminders, batch messaging, clinician toolbar workflows, remote monitoring questionnaires, and
              practice websites built to NHS guidelines and accessibility rules. Norway’s fastlege-support page points
              in a similar direction by describing digital reception, cloud journals, staffing support, and process
              tooling for local practices.


              The overall asset map therefore looks less like a single product and more like a modular operating stack.
              That can increase defensibility because it widens integration points and use cases, but it also makes
              deployment, support, and product coherence harder to manage across markets.
