      - number: '3.3'
        title: Switching costs are low for many patients but higher once channels and care pathways are embedded
        blocks:
          - type: paragraph
            body: >-
              At the patient level, switching cost in digital care is often modest. A patient can try another app, call
              a local provider, or use a different partner channel if access or quality disappoints. Multi-homing is
              therefore likely common on the demand side. But that does not mean all competitive positions are weak.
              Once an insurer, employer, GP practice, or regional care pathway integrates a provider, the relationship
              can become harder to dislodge because operations, reimbursement logic, communication, and care follow-up
              are already wired in.


              Kry’s partner announcements imply that distribution relationships are meaningful competitive assets.
              Vitality, HA | Wisdom Wellbeing, Klarna, Scan.com, and CloudFit all increase access to cohorts or
              adjacencies that a direct-to-consumer app would need to buy expensively through marketing. HealthHero’s UK
              positioning shows a similar thesis: the most defensible operators are often the ones embedded with
              employers, NHS flows, or local authorities rather than those relying only on app downloads.


              The competitive implication is that Kry’s moat is partly operational and channel-based rather than purely
              technological. That is good news if the company can preserve service quality and renewal economics, but it
              also means competitors can erode the moat by winning the same partners, improving workflow fit, or
              narrowing into profitable specialty niches where Kry looks broader but less focused.
            claimRefs:
