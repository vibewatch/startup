    title: Thesis vs anti-thesis map
    type: matrix
    layout: wide
    summary: Kry’s company quality and evidence quality do not currently sit at the same level.
    data:
      columns:
        - Weak evidence
        - Mixed evidence
        - Strong evidence
      rows:
        - label: Weak company quality
          values:
            - Pass
            - Pass
            - Rare case
        - label: Mixed company quality
          values:
            - Pass
            - Track
            - Selective engage
        - label: Strong company quality
          values:
            - Research more
            - Track / engage if priced right
            - Buy candidate
