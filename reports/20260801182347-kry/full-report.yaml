companyProfile:
  summary: >-
    Kry is a Stockholm-headquartered digital healthcare company founded in 2015 that operates a hybrid care model across
    Sweden, Norway, the UK, and France, using the Livi brand in the UK and France. Public materials show a business that
    has grown beyond simple video consultations into an integrated digiphysical operating model spanning remote
    consultations, physical clinics, public-system pathways, partner distribution, and workflow infrastructure such as
    Mjog. The operating story is increasingly credible: 2024 net sales reached SEK 2,497 million and margins improved
    sharply. The valuation story is less clear because public sources do not cleanly reconcile the latest financing
    amount, total capital raised, or current fair-value mark.
