chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Kry International AB is headquartered in Stockholm and presents itself as Europe's leading digital-first
              healthcare provider. The group delivers healthcare every day of the year in Sweden, Norway, the UK, and
              France, using the Kry brand in Sweden and Norway and the Livi brand in the UK and France. Company legal
              and privacy materials also make clear that the parent company owns the technical platform while local
              operating entities and clinicians deliver regulated care in each market.


              The company's operating model is explicitly digiphysical rather than pure telemedicine. Across its current
              official surfaces, Kry describes a platform that routes patients between video consultations, self-care
              guidance, specialist referrals, physical clinics, occupational health, and urgent-care pathways. The
              annual report describes this as a scalable patient-centred model intended to reduce administrative burden
              on clinicians and push patients to the right care setting at lower system cost.


              Public scale disclosures are large but not perfectly harmonised. The global who-we-are page cites 109
              million patient coverage, 10 million-plus consultations with a healthcare professional, 900-plus
              employees, 3,000-plus clinicians and specialists, and 200 million-plus patient reminders sent annually
              through Mjog. The Swedish about page instead cites 14 million appointments, 4,000-plus healthcare
              professionals, and 60-plus physical clinics, while the UK about page cites 14 million appointments, 5,000
              healthcare professionals, and 54 physical clinics. The 2024 annual report cites almost 11 million
              consultations, nearly 60 physical clinics, and more than 3,000 healthcare employees across four core
              markets. These differences are manageable for a narrative overview, but they mean the exact current
              consultation, clinic, and workforce totals should be treated as range-bound rather than single-source
              ground truth.
