  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product is a hybrid care workflow, not just a telemedicine app
        blocks:
          - type: paragraph
            body: >-
              Kry’s core product is a patient-care journey that begins digitally and can end digitally or physically
              depending on need. Official Kry and Livi pages describe booking, symptom intake, video consultations,
              prescriptions, follow-up, and referral into physical clinics or downstream care. The patient promise is
              speed and convenience, but the deeper product logic is routing: get the patient to the right clinician, at
              the right level of care, with less administrative friction than a traditional phone-first primary-care
              workflow.


              That workflow is more visible on current product surfaces than a traditional feature list. Kry’s English
              site highlights app-based access to doctors, nurses, psychologists, and physiotherapists, 24/7
              availability, and continuity of care through follow-up and clinic visits. Livi France explicitly frames
              reimbursement, e-prescriptions, specialist referrals, and orientation toward in-person care when needed.
              Norway materials show the company also packages digital solutions for fastlege practices, including
              digital reception, video visits, and cloud-based operational support.


              This means the product definition should not be reduced to ‘video GP.’ Kry is building a digital front
              door plus an operating layer for hybrid primary care, with variations by country and channel. The public
              evidence is rich enough to define the workflow clearly even if it is not rich enough to reconstruct deep
              system architecture.
