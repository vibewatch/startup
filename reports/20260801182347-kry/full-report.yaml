      - number: '4.5'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Kry’s financial case has crossed the threshold from narrative-heavy to evidence-bearing. The company has
              meaningful scale, credible year-on-year revenue growth, sharply improved margins, and concrete signs that
              management has become more disciplined about cash. Those are not trivial achievements in a telehealth
              sector where public and private markets have become much more skeptical.


              The remaining problem is not top-line credibility but underwriting completeness. Public data still does
              not explain how much profit durability comes from Sweden versus expansion markets, how profitable partner
              channels are after service costs, how much physical capacity raises returns versus complexity, or what the
              current financing stack really looks like after 2024-2025 changes. The company is therefore financially
              stronger than a generic telehealth bear case implies, but still not fully transparent enough for
              price-insensitive capital.


              Netting the evidence together, the financial verdict is favorable on revenue quality and trajectory,
              positive but cautious on margin path, and incomplete on capital adequacy. A disciplined investor should
              treat 2024-2025 as proof of operational progress while making balance-sheet detail, market-level unit
              economics, and channel profitability the non-negotiable asks before underwriting any new round or
              secondary purchase.
            claimRefs:
              - CI042
              - CI043
              - CI044
              - CI045
              - CI046
