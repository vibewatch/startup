evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: metric-reconciliation
    missingEvidence: >-
      A management-approved reconciliation of consultation, clinic, and workforce metrics across Kry, Kry Sweden, and
      Livi websites.
    whyItMatters: >-
      Current official pages use different definitions and counts, which affects cover metrics and cross-chapter
      consistency.
    diligencePath: >-
      Request a current company fact sheet defining appointments, consultations, clinics, employees, clinicians, and
      patient coverage on a like-for-like basis.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: latest-financing-terms
    missingEvidence: >-
      Primary documentation for the claimed April 2025 financing round, including amount, instrument, investors,
      valuation, and governance rights.
    whyItMatters: >-
      Public third-party sources conflict on total raised, round size, and employee count, limiting confidence in the
      latest valuation context.
    diligencePath: >-
      Obtain board-approved financing materials, term sheets, updated cap table, and any press release or investor memo
      covering the 2025 round.
    relatedQuestionRefs:
      - QO021
      - QO022
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: board-committees
    missingEvidence: >-
      A current public or management-provided board roster with committee memberships and independent-director
      responsibilities.
    whyItMatters: >-
      Governance maturity matters for a regulated multi-market healthcare operator undergoing leadership and ownership
      restructuring.
    diligencePath: Request current board materials, committee charters, and investor-rights summary during management diligence.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: sweden-registered-patient-growth
    missingEvidence: >-
      Reconciliation between the annual report's 11,000 new Swedish registered patients and the later results release's
      close to 16,000 new registered patients.
    whyItMatters: >-
      The difference likely reflects timing or definition, but without reconciliation it weakens precision on Swedish
      growth claims.
    diligencePath: >-
      Ask management to specify measurement dates and whether the later figure includes post-year-end organic additions
      or acquired volumes.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: valuation-markers
    missingEvidence: >-
      A current, date-stamped valuation mark or financing event directly from the company rather than older or
      third-party estimates.
    whyItMatters: >-
      The public $2B valuation marker is legacy enough that recommendation-grade valuation work cannot rely on it
      without triangulation.
    diligencePath: >-
      Request current investor materials or audited financing disclosures, and triangulate with refreshed comparable
      analysis in the valuation chapter.
    relatedQuestionRefs:
      - QO021
      - QO022
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: TO004 milestone chronology after 2024 funding refresh
    missingEvidence: >-
      A primary-source funding or board pack that cleanly dates the 2025 financing events and any additional 2026
      milestone disclosures missing from the public chronology.
    whyItMatters: >-
      The milestone table is intentionally partial because operating and governance milestones are clearer than the
      latest financing chronology in public evidence.
    diligencePath: >-
      Ask management for a dated corporate timeline or press archive that reconciles 2025 financing and 2026 milestone
      events against the annual report baseline.
    relatedQuestionRefs:
      - QO018
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: country-level unit economics
    missingEvidence: Market-by-market gross margin, CAC, retention, and clinic-level profitability data.
    whyItMatters: Broad TAM narratives are less useful than proof that each market can sustain profitable hybrid care.
    diligencePath: Request cohort economics and clinic contribution margins by Sweden, France, UK, and Norway.
    relatedQuestionRefs:
      - QM009
      - QM017
      - QM024
      - QM025
  - type: conflicting-data
    severity: material
    topic: telehealth market sizing comparability
    missingEvidence: >-
      A like-for-like market model separating public reimbursement, software, and care-delivery spend across Kry’s
      countries.
    whyItMatters: Published TAM pages use incompatible boundaries, making precise SAM claims unreliable.
    diligencePath: Build a bottoms-up model from consultation volume, reimbursement rates, partner contracts, and clinic capacity.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
  - type: missing-source
    severity: minor
    topic: partner channel economics
    missingEvidence: >-
      Primary disclosures on revenue share, renewal rates, and utilization for Vitality, HA, Klarna, Scan.com, and
      CloudFit channels.
    whyItMatters: Partner distribution looks important, but public sources prove reach more clearly than economics.
    diligencePath: Request partner dashboards or contract summaries.
    relatedQuestionRefs:
      - QM022
      - QM013
      - QM014
      - QM024
  - type: missing-source
    severity: material
    topic: pricing and contract economics
    missingEvidence: Like-for-like pricing, contract length, and renewal terms across Kry and direct peers.
    whyItMatters: Competitive intensity is easier to observe than actual pricing power or contract durability.
    diligencePath: Request pricing decks, partner contracts, and renewal data for top competitor overlaps.
    relatedQuestionRefs:
      - QP009
      - QP012
      - QP022
  - type: private-evidence-only
    severity: material
    topic: switching and retention cohorts
    missingEvidence: Cohort data on repeat use, churn, reactivation, and win/loss by competitor channel.
    whyItMatters: Moat durability depends on actual switching behavior, not just product positioning.
    diligencePath: Request cohort retention and competitive win/loss analysis by market.
    relatedQuestionRefs:
      - QP017
      - QP023
      - QP021
      - QP018
  - type: missing-source
    severity: minor
    topic: France direct-peer mapping
    missingEvidence: >-
      Primary-source evidence on French peer overlap at the care-delivery level rather than only patient-access or
