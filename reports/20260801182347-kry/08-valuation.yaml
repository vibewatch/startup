company:
  name: Kry
chapter:
  number: 8
  title: Valuation
  summary: 'Kry looks like a real scaled healthcare platform, but valuation support is materially weaker than company-quality support. The cleanest hard anchors are the 2021 $2B round, 2024 revenue of SEK 2,497M (~$190M-$230M depending lens and FX), and sharply improved 2024 margins. The messier anchors are current private-market signals and the 2025 funding narrative, which remain inconsistent across trackers. On that evidence, the right stance is price-sensitive and diligence-heavy: Kry is interesting enough to track or engage, but not transparent enough for a conviction buy at an unverified peak-style valuation.'
sections:
- id: thesis-antithesis-and-price-sensitivity
  title: The company thesis is stronger than the current valuation evidence
  body: |-
    The bullish case for Kry is straightforward and supported by earlier chapters. The company has real scale, improving financials, a hybrid care model, meaningful customer adoption, and a product that looks more operationally serious than many telehealth narratives imply. Europe’s healthcare access problems are persistent, and Kry has already shown that it can win demand across Sweden, France, the UK, and Norway.

    The anti-thesis is equally important. Public evidence on current valuation is conflicted, recent financing terms are not cleanly disclosed, and the sector has already demonstrated how quickly telehealth multiples can collapse when reimbursement or margins disappoint. Kry’s own progress does not erase the lessons from Babylon’s collapse, Teladoc’s post-peak re-rating, or broader skepticism about labor-intensive care models being valued like software.

    That makes valuation here highly price-sensitive. If an investor can enter meaningfully below the old 2021-style peak framing, with access to primary diligence on balance sheet, cohort economics, and partner concentration, the opportunity is interesting. If the ask still assumes a premium, software-like multiple without new disclosure, the prudent stance is to track or research more rather than stretch.
