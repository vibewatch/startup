- id: scenario-range-and-return-logic
  title: Bull/base/bear outcomes should reflect both company quality and evidence quality
  body: |-
    A reasonable scenario framework starts from what is known: 2024 revenue near SEK 2.5 billion, better margins, and a business that appears operationally stronger than generic telehealth skeptics assume. It then discounts for what is not known: current cap table terms, cash balance, contract durability, partner concentration, and the exact price or dilution of any 2025 financing. This naturally leads to a broader range than a mature public comp would need.

    In the bear case, telehealth multiple compression, reimbursement friction, and hidden financing overhangs could pull defensible value materially below the 2021 peak mark. In the base case, improved financial performance and hybrid care quality support a substantial business value, but still not enough to blindly affirm a full peak-era software-style premium. In the bull case, Kry proves sustainable profitability improvements, channel durability, and a credible integrated-care platform advantage, allowing value to hold near or modestly above the old unicorn anchor.

    Return logic therefore depends heavily on entry price and evidence unlocks. If the buyer is paying near a stale headline valuation without receiving new balance-sheet and cohort data, upside is too evidence-light. If the buyer can enter at a discount to legacy marks and secure diligence rights, the asymmetry improves materially.
