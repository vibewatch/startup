- id: recommendation-and-remaining-diligence
  title: 'Recommendation: track / research more unless price and disclosure improve'
  body: |-
    The recommendation here is not a no-quality verdict; it is a no-false-precision verdict. Kry clearly merits serious attention because it has built a scaled European digital-health platform with improving economics, strong customer proof, and a differentiated hybrid model. But the public record still leaves too much uncertainty around current valuation, financing terms, concentration, and true channel economics to justify a confident buy call at an unverified premium price.

    Accordingly, the most defensible stance is research more or track, with a bias to engage if access is possible and pricing is disciplined. A move toward buy would require cleaner evidence on cash and debt, recent primary or secondary pricing, partner-renewal durability, and market-level profitability. A move toward pass would become more likely if the seller insists on a peak-era mark despite limited disclosure or if new reimbursement or quality issues appear.

    In short: the company case is credible, the evidence case is partial, and the price case is unresolved. That combination is exactly where disciplined investors should stay selective.
