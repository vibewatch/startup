- id: valuation-context-and-comparable-frame
  title: Public valuation context is noisy, so comparisons matter more than one tracker number
  body: |-
    The cleanest valuation anchor in the retained evidence is the April 2021 Series D valuation of $2 billion, repeated by Tracxn and reflected indirectly in other trackers. Beyond that, the picture fragments. Indexed.vc and Signalbase point toward later financing narratives; Tracxn shows $703 million raised over seven rounds; Forge and Accumeo indicate private-market or secondary-market context but limited transparency; WOWLS argues the 2021 mark likely overstates current reality; and secondary-estimate sites disagree on revenue, employees, and total funding. None of those should be mistaken for authoritative current fair value on their own.

    Comparable framing is therefore more useful than pretending the latest tracker is truth. Public telehealth and digital-health comparables such as Teladoc, Hims & Hers, Doximity, and workflow-led platforms show a wide spread between labor-heavy virtual care, higher-margin digital health, and clinician productivity tools. Kry sits somewhere between those categories: more operationally complex than software networks, but stronger and more integrated than a pure virtual-consult brand.

    For that reason, the valuation conclusion should be expressed as a range and a discipline, not as a single spurious point estimate. The more Kry proves durable partner economics, clinic contribution margins, and stable reimbursement, the closer it can justify premium healthtech multiples. Without that proof, the older unicorn mark is a ceiling reference, not an automatic fair-value floor.
