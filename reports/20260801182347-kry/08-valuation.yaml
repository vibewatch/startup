  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current pricing and cap table
    missingEvidence: Recent primary or secondary transaction prices, cap table, preference stack, and board-approved valuation marks.
    whyItMatters: A recommendation cannot be price-sensitive without a real current price context.
    diligencePath: Request last 12 months of transactions, cap table, and preference waterfall.
    relatedQuestionRefs:
    - QV024
    - QV010
    - QV009
    - QV015
    - QV025
  - type: missing-source
    severity: material
    topic: channel and cohort economics
    missingEvidence: NRR/GRR, partner renewal rates, clinic contribution margins, and market-level profitability.
    whyItMatters: These variables determine whether Kry deserves blended healthcare multiples or premium healthtech multiples.
    diligencePath: Request cohort retention, renewal dashboards, and market P&Ls.
    relatedQuestionRefs:
    - QV006
    - QV013
    - QV019
    - QV028
    relatedTableRefs:
    - TV003
  - type: conflicting-data
    severity: material
    topic: 2025 funding narrative
    missingEvidence: A primary-source document reconciling the 2025 funding amount, terms, dilution, and valuation.
    whyItMatters: Public tracker disagreement is too large to support a hard current valuation call.
    diligencePath: Request financing docs or board minutes covering the latest financing.
    relatedQuestionRefs:
    - QV011
    - QV014
    - QV023
