      - number: '1.2'
        title: 领导层、董事会与治理交接
        blocks:
          - type: paragraph
            body: >-
              Kry 的创始人主导身份仍然重要，但公司在 2024 年底完成了一次可见的领导层交接。Johannes Schildt 于 2024 年 12 月从 CEO 转任董事会主席；前副 CEO 兼 COO Kalle
              Conneryd Lundgren 出任 CEO，并加入董事会。Kry 和 Livi 都把这次交棒描述为：公司从创始人带队的扩张期管理，转向 Schildt 聚焦长期增长和技术、Lundgren 负责运营的结构。


              公开记录支持 Lundgren 的运营与临床可信度。公司声明称他是外科医生、重建整形外科副教授，曾任 Karolinska University Hospital
              COO，学术训练覆盖理论物理、生物化学和生物物理。年报还显示，Yrjö Närhinen 和 Shrirang Apte 在同一轮交接中成为新董事，Martin Mignot 则退出。


              治理可见度仍不完整。2024 年报披露年末有七名董事，董事会性别构成偏男性，但公开材料没有给出完整委员会图谱、投资者权利表或董事会委员会章程。Livi UK 的 CQC 档案确认 Dr Kalle
              Conneryd-Lundgren 担任英国受监管服务的指定负责人，这让直接运营责任更可验证；但投资者仍需要更清楚看到委员会监督、独立董事职责，以及近期融资附带的任何特殊治理安排。
