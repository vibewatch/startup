  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是一套混合医疗工作流，而不只是远程医疗 app
        blocks:
          - type: paragraph
            body: >-
              Kry 的核心产品是一条患者照护旅程：从数字入口开始，根据需求可以在线上结束，也可以在线下结束。Kry 和 Livi
              官方页面描述了预约、症状采集、视频问诊、处方、随访，以及转入实体诊所或下游照护。患者承诺是速度和便利，但更深的产品逻辑是分流：用比传统电话优先初级医疗工作流更少的行政摩擦，把患者送到合适临床人员和合适医疗层级。


              在当前产品页面上，这条工作流比传统功能清单更可见。Kry 英文站强调通过 app 接触医生、护士、心理学家和物理治疗师，提供 24/7 可用性，并通过随访和诊所就诊保持照护连续性。Livi France
              明确强调报销、电子处方、专科转诊，以及必要时转向线下医疗。挪威材料显示，公司还为 fastlege 诊所打包数字解决方案，包括数字前台、视频就诊和云端运营支持。


              这意味着，产品定义不能被压缩成「视频 GP」。Kry 正在搭建数字前门 + 混合初级医疗运营层，并按国家和渠道变化。公开证据已经足够清楚地定义工作流，即使还不足以重建深层系统架构。
