      - number: '7.3'
        title: 运营和依赖风险来自混合医疗、渠道嵌入和平台依赖
        blocks:
          - type: paragraph
            body: >-
              Kry
              的混合模式提高了医疗问题解决率，但引入了纯软件企业不用承担的运营风险。诊所、急诊护理、诊断交接、本地临床人员配置和跨境流程差异，都增加了失效点。应用目录中关于预约可得性，或数字步骤后被转到线下就诊的投诉，相比整体正面满意度很小，但它们显示，一旦容量或分诊质量下滑，体验很容易变差。


              伙伴依赖是第二大运营风险。尤其在英国，Kry 的增长叙事与伙伴分发和公共体系关系交织在一起。Vitality、HA | Wisdom
              Wellbeing、Klarna、CloudFit、Scan.com、ICS、ICB 和 GP
              诊所渠道扩大触达，但也带来续约、定价和集中度风险。如果嵌入式渠道变弱或重新招标，公司可能保住需求，却失去有利润的分发。


              技术和云依赖同样重要，哪怕公开基础设施细节有限。Microsoft 案例研究和 Mjog 通信栈表明，公司确实依赖基于云的工作流、AI
              工具和集成数字渠道。这对现代医疗平台很正常，但意味着宕机、安全事件或主要供应商依赖可能同时影响医疗交付和伙伴信任。
