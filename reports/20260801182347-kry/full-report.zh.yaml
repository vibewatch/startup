      - number: '4.2'
        title: 利润率路径大幅改善，但成本结构仍像医疗运营商
        blocks:
          - type: paragraph
            body: >-
              Kry 披露的利润率方向在 2024 年大幅改善。EBITDA 利润率从 -19.5% 改善至 -4.4%，EBITA 利润率从 -31.5% 改善至 -12.3%，负现金流从 SEK -495 million
              改善至 SEK -125 million。业绩发布随后给出两个重要前瞻信号：所有市场在 2024 年底均实现盈利，2025 年 2 月现金流转正。对于一家常被远程医疗怀疑论审视的业务，这些表述有分量。


              与此同时，公开记录没有显示 Kry 已摆脱医疗交付的基本成本现实。模式仍依赖临床人员、医疗运营、合规、客户支持和扩张中的实体版图。员工和诊所披露更支持一条纪律改善叙事，而不是纯软件利润率叙事：2024
              年集团平均雇员降至 1,591 人，低于 2023 年的 1,872 人，这可能帮助压低成本基础；但该业务在结构上仍比只做工作流的 SaaS 公司更依赖人力和运营。


              最合适的解读是，Kry
              已显著提升效率，但尚不能被轻松按软件型利润率业务来测算。公开证据支持利润率路径改善，却没有披露毛利率、各市场贡献利润、各渠道临床人员利用率，或近期改善到底多大程度来自降本，而不是持久收入质量。
