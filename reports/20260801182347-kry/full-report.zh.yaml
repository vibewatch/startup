      - number: '7.2'
        title: 监管、法律和质量风险是模式的结构性风险
        blocks:
          - type: paragraph
            body: >-
              Kry 在高度监管的医疗体系中跨市场运营，法律和质量风险因此位于投资案例中心。英国 CQC 记录方向上正面，因为 Livi UK
              总体和管理良好维度均获“良好”评级；但有效性报告仍识别出一个重要照护流程弱点：部分处方并不总是传达给患者自己的 GP。因此，公开证据同时支持信任，也留下质量风险。


              在瑞典，年报披露了地区层面围绕计费和问诊结构的退款索赔。Kry
              对这些索赔提出异议，但关键分析点更宽：模式取决于地区或全国主体如何解释远程医疗计费、范围和流程规则。一旦解释收紧或争议增加，收入质量和利润率改善可能快速逆转。


              隐私、保护和法律实体结构又加了一层。Kry 和 Livi 发布隐私、EULA、cookie
              和本地通知材料，下载页链接还提到安全保护和漏洞披露内容。从控制设计看，这让人安心；但法律界面数量本身也说明业务合规负担很重。在医疗行业，这种负担是长期运营现实，不是一次性搭建成本。
