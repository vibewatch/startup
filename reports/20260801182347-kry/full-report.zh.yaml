      - number: '3.4'
        title: 护城河真实存在但并非攻不破，竞争者负面证据也有两面
        blocks:
          - type: paragraph
            body: >-
              证据清楚显示，这个品类可以规模化；也清楚显示，并非所有模式都会赢。Teladoc 仍然庞大，但最近报告 2026 年第二季度收入同比下降，说明规模不能消除增长压力。Doctorlink 在 HealthHero
              旗下不再作为独立产品存在，说明整合可能把价值从纯消费者品牌转向嵌入式平台或渠道模式。ZAVA 偏重减重的传播重点则说明，聚焦临床垂直也能切走需求，广义初级医疗平台不会自动拥有这些需求。


              对 Kry 而言，最强护城河要素似乎是混合医疗交付、对公共体系的熟悉度、合作伙伴分发和国家层面的运营知识。没有一项坚不可摧。Doctolib 和 Docplanner
              说明，患者准入和提供方工作流层即使不拥有完整照护旅程，也能成为有力竞争前线；北欧对手则说明，混合诊所版图可以在本地复制。换句话说，Kry 位置差异化明确，但无法消除商品化风险。


              长期问题在于 Kry
              能否同时在足够多渠道中保持首选前门。如果患者多栖、雇主重新招标、公共规则变化，或专科类别被拆分出去，公司可能仍会增长，却失去定价能力或利润质量。因此，竞争分析支持一个有条件的护城河判断：Kry
              有实质差异化，但耐久性取决于执行、渠道续约和本地信任，而不是赢家通吃式市场结构。
