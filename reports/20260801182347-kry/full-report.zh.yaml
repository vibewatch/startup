      - number: '6.3'
        title: 耐久度可能来自连续照护和渠道，但集中度风险仍在
        blocks:
          - type: paragraph
            body: >-
              有现实理由相信客户关系可以耐久。瑞典的登记患者模式形成持续关系；合作伙伴渠道可以按多年周期续约；混合医疗让 Kry
              能把患者从数字入口带到持续照护或线下诊疗。这些特征应能提高重复使用，让平台价值超过单次问诊。应用商店描述也强调续方、转诊、专科准入、慢病或家庭场景，支持持续互动。


              但集中度风险必须写清楚。瑞典仍是经济核心；英国的大型公共或合作伙伴渠道，可能对边际增长格外重要；法国远程问诊使用量也可能高度依赖报销和准入条件，而这些条件不在 Kry
              控制之内。公开证据显示扩张潜力，但无法证明客户组合已经足够多元、均衡。


              实际含义是，客户质量看起来有利，但客户经济性尚未完全去风险。投资者可以假设存在有意义的重复使用和伙伴耐久度，但在把客户基础视为完全粘性或多元之前，仍应要求同期群、续约和集中度数据。
