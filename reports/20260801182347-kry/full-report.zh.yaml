            body: >-
              Kry 披露的收入组合确认，瑞典仍是经济核心。年报显示，2024 年收入为：瑞典 SEK 1,788.8 million、法国 SEK 417.1 million、英国 SEK 247.8 million、挪威
              SEK 35.9 million。这意味着公司并不是均衡的四国组合，而是一个瑞典锚点，加上两个有意义的扩张市场和一个小型前哨。投资者应把法国和英国故事视为重要增长向量，但还不能当成同等权重的盈利引擎。


              入市模式在财务上也不寻常。Kry 不只是卖软件，也不只是购买 app 流量。它把公共体系医疗交付、数字前门准入、保险公司和雇主分发，以及需要时承接线下需求的诊所网络组合在一起。Hermelinen
              收购强化了这套混合逻辑：它增加的是瑞典北部产能和专科服务，而不只是更多数字需求。财务上，这能提升防御性和照护解决率，但也带来集成、利用率和经营杠杆问题。


              所以，资本强度不能简化为云支出或工程师人数。Kry
              看起来在改善，是因为混合模式逐步成熟，而不是因为它变成了轻资产软件市场平台。如果公司能守住利用率和渠道经济纪律，这值得投资；但这也让诊所层面和市场层面的贡献利润成为关键尽调问题。
