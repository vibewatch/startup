  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公司投资假设强于当前估值证据
        blocks:
          - type: paragraph
            body: >-
              Kry 的多头逻辑很直接，也得到前文支持。公司有真实规模、财务改善、混合医疗模式、可观客户采用，以及一个比许多远程医疗叙事更严肃的运营型产品。欧洲医疗准入问题长期存在，Kry
              已经证明自己能在瑞典、法国、英国和挪威赢得需求。


              反向逻辑同样重要。当前估值公开证据相互冲突，近期融资条款没有清楚披露；行业也已经证明，一旦报销或利润率令人失望，远程医疗倍数会多快塌下来。Babylon 崩盘、Teladoc
              峰值后的重估，以及市场对劳动密集型医疗模式按软件估值的普遍怀疑，Kry 自身进展都无法抹掉。


              因此，这里的估值对价格高度敏感。如果投资者能以明显低于旧有 2021
              年峰值叙事的价格进入，并拿到资产负债表、同期群经济性和伙伴集中度的一手尽调权限，机会值得关注。如果要价仍假定高溢价、软件式倍数，却没有新披露，审慎立场就是继续跟踪或深入研究，而不是勉强出手。
