      - number: '8.2'
        title: 公开估值背景很嘈杂，因此可比公司比单个追踪器数字更重要
        blocks:
          - type: paragraph
            body: >-
              留存证据中最干净的估值锚，是 Tracxn 重复引用、并被其他追踪器间接反映的 2021 年 4 月 Series D 轮 $2 billion 估值。除此之外，图景变得碎片化。Indexed.vc 和
              Signalbase 指向后续融资叙事；Tracxn 显示七轮共融资 $703 million；Forge 和 Accumeo 给出私营市场或二级市场背景，但透明度有限；WOWLS 认为 2021
              年标记很可能高估当前现实；二级估算网站在收入、员工和总融资上也互相冲突。以上任何一个都不应单独当成权威的当前公允价值。


              因此，可比框架比假装最新追踪器就是真相更有用。Teladoc、Hims & Hers、Doximity
              等上市远程医疗和数字健康可比公司，以及以工作流为主的平台，显示出劳动密集型虚拟医疗、更高利润率的数字健康和临床医生生产力工具之间存在很大估值分化。Kry
              位于这些类别之间：比软件网络运营更复杂，但比纯虚拟问诊品牌更强、更一体化。


              因此，估值结论应表达为区间和纪律，而不是一个虚假的单点估算。Kry 越能证明伙伴经济性耐久、诊所贡献利润率和报销稳定，就越能支撑溢价健康科技倍数。没有这些证明，旧独角兽标记只是上限参照，不是自动的公允价值底线。
