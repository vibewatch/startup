  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Kry 最重要的风险在报销、受监管执行和透明度，而不是单纯产品需求
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，Kry
              最大的风险更像是一家规模化医疗运营商的风险，而不是未成型产品的创业公司风险。需求风险存在，但不是头号问题：数百万次咨询、高应用评分和可见伙伴需求表明客户想要这项服务。更尖锐的问题是：公共报销是否继续支持，跨国受监管医疗执行能否保持干净，伙伴和渠道依赖是否走向集中，以及资产负债表是否足够强、能吸收冲击。


              两个风险在一手来源中立即凸显。第一，年报披露，瑞典地区层面围绕计费和问诊结构分歧提出了退款要求。第二，英国 CQC 的有效性维度报告指出一个照护协同弱点：开出某些处方时，并不总是通知患者自己的
              GP。单看任何一项都不会击穿投资假设，但合在一起说明，收入确认和临床治理风险是真实的，不是假设。


              其余风险顺势展开：敏感数据合规、混合运营复杂度、临床人员容量压力、伙伴集中度和融资不透明。公司在多个方面有可见缓释措施，但剩余敞口仍足够重要，投资者应把风险尽调放在核心位置，而不是边缘事项。
