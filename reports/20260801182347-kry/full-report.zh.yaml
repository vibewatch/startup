chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图与运营模式
        blocks:
          - type: paragraph
            body: >-
              Kry International AB 总部位于 Stockholm，自称欧洲领先的数字优先医疗服务提供商。集团全年每天在瑞典、挪威、英国和法国提供医疗服务，在瑞典和挪威使用 Kry 品牌，在英国和法国使用
              Livi 品牌。公司法律与隐私材料也说明，母公司拥有技术平台，各地运营实体和临床人员则在各市场交付受监管医疗服务。


              公司的运营模式明确是线上线下融合，而不是纯远程医疗。目前官方页面中，Kry
              描述的平台把患者在视频问诊、自助护理指导、专科转诊、实体诊所、职业健康和急诊路径之间分流。年报将其称为可扩展、以患者为中心的模式，意在减轻临床人员行政负担，并以更低系统成本把患者送到合适就医场景。


              公开规模披露很大，但口径并不完全一致。全球 who-we-are 页面称覆盖 109 million 名患者、与医疗专业人员完成 10 million-plus 次问诊、拥有 900-plus
              名员工、3,000-plus 名临床医生和专科医生，并通过 Mjog 每年发送 200 million-plus 条患者提醒。瑞典 about 页面则称 14 million 次预约、4,000-plus
              名医疗专业人员和 60-plus 家实体诊所，英国 about 页面称 14 million 次预约、5,000 名医疗专业人员和 54 家实体诊所。2024 年报列示近 11 million 次问诊、近 60
              家实体诊所，以及四个核心市场超过 3,000 名医疗员工。这些差异不妨碍叙事概览，但意味着当前准确问诊量、诊所数和员工总数应按区间看，而不是当成单一来源事实。
