      - number: '6.4'
        title: 高满意度是真实的，但服务准入投诉和不透明的续约指标仍重要
        blocks:
          - type: paragraph
            body: >-
              客户证据总体正面，但并不均匀。Apple 和 Google 应用商店页面显示评分很高、评论量很大；以 Kry 的规模看，这些信号有意义。AppBrain
              和应用商店摘录也保留了零星投诉，涉及预约可得性、技术问题，或用户在付费 / 花时间完成数字步骤后仍被转到线下就诊。这些评论压不过整体正面信号，但说明一旦运营容量收紧，客户体验会在哪些环节被侵蚀。


              因此，主要尽调缺口不是客户是否存在，或总体是否喜欢产品，而是最强的可见渠道——登记患者、伙伴合同、保险分发和高频应用用户——能否转化为耐久且经济上有吸引力的同期群。没有合同条款、留存曲线、NRR / GRR
              或头部渠道集中度，客户章节可以验证需求，却不足以完全承保价值捕获。


              客户结论是：广度、采用率和背书质量有利；耐久度正面但需谨慎；集中度和续约经济性仍不完整。对后续估值工作来说，客户支持投资假设，但还不能免掉按渠道做严谨尽调的必要。
