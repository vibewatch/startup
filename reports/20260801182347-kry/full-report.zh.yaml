      - number: '2.4'
        title: 矛盾估算和替代强度应保持显性
        blocks:
          - type: paragraph
            body: >-
              最容易犯的分析错误，是把每一个数字健康数字都当成直接的 Kry 市场数字。Mordor 的欧洲数字健康估算、MarketsandMarkets 的远程医疗估算、Grand View
              的远程医疗框架，都描述相邻机会池，却与 Kry 已披露运营在产品边界、支付方组合或地理范围上不一致。它们适合提供方向性背景和估值叙事，不适合精确测算 Kry 近期 SOM。


              替代品也比品类页面暗示的更重要。Kry 正在替代传统 GP 准入、人工行政分流、传统本地诊所，以及某些市场中已经嵌入保险或公共体系路径的既有数字玩家。HealthHero 旗下 Doctorlink
              停止作为独立产品存在，说明并非每个数字初级医疗产品都能独立存活；品类可能整合，也可能从品牌 app 转向嵌入式基础设施。因此，买方渠道耐久性，而不只是患者需求，是关键尽调问题。


              投资者因此应保留三个未解问题：Kry 未来增长中，公共报销与合作伙伴分发各贡献多少；随着数字需求增长，还需要多少额外诊所和专科能力才能守住服务质量；2025
              年后的远程医疗规模叙事，究竟映射到盈利性线上线下融合医疗，还是只映射到总问诊量。这些缺口会同时影响本报告后续的市场分析和估值。
