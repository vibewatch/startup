  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合横跨混合医疗、虚拟医疗品牌、市场平台和现状替代品
        blocks:
          - type: paragraph
            body: >-
              Kry 并不在一个干净品类里竞争。最直接的竞争者，是其他数字优先医疗提供方：它们把 app 入口与雇佣或关联临床人员结合起来，有些还配有实体网点。在瑞典，这包括 Doktor.se 和 Min
              Doktor；Dr.Dropin 则展示了更广的北欧混合模式，拥有密集诊所覆盖和视频准入。在英国，HealthHero、Push Doctor 和 ZAVA
              分别切入数字初级医疗和福利需求的不同部分。Teladoc 是最大的全球虚拟医疗参照，尽管其美国权重高、病种管理栈更宽，更像战略参照，而不是一对一的本地替代品。


              第二类包括 Doctolib 和 Docplanner 这样的患者准入与工作流平台。它们与 Kry
              不完全相同，因为它们并不把自己完全定义为医疗交付提供方；但它们仍在争夺患者需求、提供方关系和数字前门心智。它们在法国和全欧洲估值叙事中特别相关，因为它们证明数字医疗可以通过准入、排班和工作流层扩张，而不只靠雇佣临床人员。


              第三类是现状本身。传统 GP 诊所、本地诊所、电话分诊和国家数字健康基础设施仍是强替代品，因为它们已经嵌在受信任的报销和照护路径里。因此，Kry 取胜不只是靠更好的
              app，而是要证明其准入速度、临床质量、线下承接和合作伙伴分发组合，优于本地既有玩家和数字对手。
