      - - 云与工作流依赖
        - Microsoft 和 Mjog 显示数字工作流处在核心位置
        - 宕机或供应商中断会冲击服务交付
        - 支持和培训功能已有公开披露
        - 提供正常运行时间和第三方依赖清单
      - - 临床人员供给 / 配置
        - 模式依赖本地临床人员和受监管实体
        - 人力瓶颈会压住增长和质量
        - 多市场布局在一定程度上拓宽供给池
        - 要求提供空缺率、利用率和流失率数据
    notes: 运营风险的核心不是软件能不能写出来，而是医疗服务能否在规模化之后稳定交付。
