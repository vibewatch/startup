      - number: '1.3'
        title: 财务画像、市场牵引力与资本图景
        blocks:
          - type: paragraph
            body: >-
              Kry 2024 年报和公司 2025 年 5 月业绩发布提供了最干净的财务证据。2024 年合并净销售额为 SEK 2,497 million，较 2023 年增长 13.3%；EBITDA 利润率从
              -19.5% 大幅改善至 -4.4%，EBITA 利润率从 -31.5% 改善至 -12.3%。集团负现金流从 SEK -495 million 改善至 SEK -125 million，管理层称 2025 年
              2 月现金流已转正。2025 年 5 月业绩发布还称，所有市场在 2024 年底均实现盈利；尽管公开的逐市场利润细节仍少，这仍是一个重要的前瞻信号。


              瑞典运营版图仍是集团锚点。年报显示，Kry 在七个地区 29 家医疗中心拥有 254,000-plus 名注册患者，2024 年集团平均雇员 1,591 人，低于 2023 年的 1,872 人。2024
              年各国收入为：瑞典 SEK 1,788.8 million、法国 SEK 417.1 million、英国 SEK 247.8 million、挪威 SEK 35.9
              million。这支持一个判断：瑞典仍是经济核心，法国和英国是最重要的非瑞典增长市场。


              第一章最难回答的问题是资本结构和当前估值。官方公开材料记录了 2024 年可转换贷款融资、股权重组，以及由 Goldman Sachs 提供建议的所有权简化，但没有披露清晰的当前 post-money
              估值。第三方来源冲突很大：Sacra 引用与 2022 年轮次相关的 $2.0 billion 估值和 €516 million 融资；GetLatka 报告截至 2025 年底约 $232 million
              ARR、$2.0 billion 估值、$627 million 累计融资和 919 名员工；Indexed.vc 报告 2025 年 4 月融资 $500 million、九轮累计融资 $1.4
              billion；Signalbase 发布 €500 million 的 2025 年 4 月融资说法，但来源透明度有限。这些证据足以支撑 Kry
              仍是具备独角兽级规模的后期欧洲医疗科技平台，却不足以在没有管理层数据的情况下厘清最新一轮的确切规模、投资者组合或稀释条款。
