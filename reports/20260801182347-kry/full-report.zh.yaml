      - number: '5.3'
        title: 集成和部署是产品承诺的核心
        blocks:
          - type: paragraph
            body: >-
              公开技术故事强调的是可用部署，而不是前沿 R&D。Kry 的患者产品展示了身份绑定预约、基于 app 的随访，以及按国家定制的报销或诊所分流。Mjog
              公开页面强调与临床系统集成、围绕实际号源类型构建提醒、把视频和 SMS 放进临床人员工作流，以及用于远程监测的结构化患者问卷。挪威 fastlege 材料同样聚焦数字前台、云病历系统、运营支持和日常效率。


              这一点重要，因为数字医疗失败，更多时候不是缺功能，而是卡在部署摩擦和工作流扰动。Kry
              的产品定位一贯瞄准减少电话负载、改善准入、让临床人员更容易被触达，同时不把他们赶出原有运营环境。支持和知识库材料也显示，公司把培训、服务状态和技术支持视为产品核心部分，而不是事后补丁。


              可靠性证据仍更偏运营而非技术。CQC 质量状态、Mjog 支持材料和面向患者的 FAQ
              让人相信平台在线且被活跃使用；但公开来源没有披露正常运行时间、事故频率、基础设施拓扑或安全测试节奏。因此，可靠性方向上可信，但深度透明度不足。
