companyProfile:
  summary: >-
    Kry 是一家总部位于 Stockholm、创立于 2015 年的数字医疗公司，采用线上线下融合医疗模式，覆盖瑞典、挪威、英国和法国；在英国和法国使用 Livi
    品牌。公开材料显示，公司已从简单视频问诊扩展为一套整合的线上线下运营模式，覆盖远程问诊、实体诊所、公共体系路径、合作伙伴分发，以及 Mjog 等工作流基础设施。运营故事越来越站得住脚：2024 年净销售额达到 SEK 2,497
    million，利润率大幅改善。估值故事没那么清楚，因为公开来源尚不能干净对齐最新融资金额、累计资本或当前公允价值标记。
