      - number: '1.4'
        title: 里程碑、外部认可与早期负面档案
        blocks:
          - type: paragraph
            body: >-
              Kry 的里程碑记录显示，公司已不再只是「视频全科医生」定位。2024 和 2025 年，集团适应法国新监管，维持英国服务 CQC 的 Good 评级，更深入进入挪威公共初级医疗，接管 Region
              Halland 的 Kungsbacka Lättakut，并收购瑞典北部的 Hermelinen Group。产品侧里程碑包括：通过 Mjog 建立慢性呼吸疾病数字护理路径，以及 Microsoft 记录的
              Azure OpenAI 部署，用于自动化行政工作并改善患者分流。


              外部认可也明确存在。Time 在 2025 年将 Kry 列入全球最具创新力医疗科技公司，Microsoft 则将其作为客户案例，展示超过 200 million 次患者互动，以及用超过 30
              种口语交付的服务。这些是品牌触达和平台雄心的有用证明点，但仍只是硬财务披露的邻近证据，不能替代财务披露。


              负面档案并非空白。Livi UK 2024 年 CQC 有效性报告指出，在某些处方会影响持续护理时，服务并不总是告知患者自己的 GP。更重要的是，Kry 年报披露了 2025 年瑞典两起地区退款争议：Region
              Skåne 就账单和问诊结构分歧要求 SEK 18.8 million，Region Stockholm 要求 SEK 48 million，Kry
              均提出异议。这些事项本身不至于推翻投资逻辑，但确认报销、计费解释和受监管医疗执行都是现实风险，而非抽象脚注。
