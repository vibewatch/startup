      - number: '8.4'
        title: 建议：除非价格和披露改善，否则跟踪 / 继续研究
        blocks:
          - type: paragraph
            body: >-
              这里的建议不是否定公司质量，而是否定虚假精确。Kry
              显然值得认真关注，因为它搭建了一个规模化的欧洲数字医疗平台，经济性在改善，客户证明强，混合模式也有差异化。但公开记录仍在当前估值、融资条款、集中度和真实渠道经济性上留下太多不确定性，不足以在未经验证的溢价价格上给出坚定买入结论。


              因此，最站得住脚的立场是继续研究或跟踪；如果能获得准入且定价克制，则偏向接触。转向买入需要更清楚的现金和债务证据、近期一级或二级定价、伙伴续约耐久度和市场层面盈利能力。转向放弃的概率会在两种情况下上升：卖方在披露有限时仍坚持峰值时代标记，或新的报销
              / 质量问题出现。


              简言之：公司逻辑可信，证据逻辑不完整，价格逻辑未解决。这样的组合，正是纪律型投资者应保持选择性的地方。
