      - number: '2.3'
        title: 增长驱动强劲，但监管和工作流摩擦仍是结构性约束
        blocks:
          - type: paragraph
            body: >-
              Kry 的增长故事可信。年报显示，法国 2024 年交付 100 万次数字预约，增长约 35%，占远程医生会面约 10%；公司披露显示瑞典仍是有规模的初级医疗基础，英国继续保有广泛数字准入相关性。IQVIA
              2024 年市场回顾同样认为，数字健康正在从健康管理 app 走向面向提供方的医疗、诊断、决策支持和远程管理。相比狭窄的视频问诊命题，Kry 的混合模式更贴合这个方向。


              政策既是顺风，也是额外成本。European Health Data Space
              带来长期互操作和数字健康单一市场推动，英国数字准入要求强调持续在线问诊能力和快速响应窗口。这些变化有助于数字医疗常态化，但也增加落地负担、集成工作和信任预期。公共报销体系一旦对齐，可以加速采用；同时也让运营方暴露在计费争议、规则变化和采购摩擦之下。


              结果是市场会增长，但不会变轻松。分析师 TAM
              页面显示大额支出池；公司历史和竞争者结局则说明，运营执行比标题式品类增长更重要。市场转化取决于渠道组合、医生工作流、监管、诊所利用率，以及线上线下融合医疗能否在经济上扩张；不只是患者愿不愿意使用数字医疗。
