      - number: '2.2'
        title: 买方、用户和支付方机制因渠道和国家而异
        blocks:
          - type: paragraph
            body: >-
              Kry 的用户是患者，但预算归属取决于入市路径。在瑞典和法国部分地区，公共体系实际上为临床行为付费，提供方组织承担运营模式和合规负担。在英国，与 NHS 相连的准入和受监管服务交付很重要；但通过
              Vitality、HA | Wisdom Wellbeing、Klarna、Scan.com 和 CloudFit 等合作，保险公司、雇主和会员渠道似乎也很关键。这让 Kry
              拥有多类买方，却没有一种统一的欧洲销售动作。


              支付方差异具有战略意义。Sacra 称问诊费是主导收入流，并称公共支付方贡献了大部分问诊费收入；官方和合作伙伴材料则显示，Kry 还在这一本底之上叠加了私人分发和转诊式相邻业务。换句话说，Kry 既不是纯
              SaaS 供应商，也不是纯消费者远程医疗 app；它是医疗交付平台，变现取决于公共报销、企业分发和患者准入经济的混合。


              竞争者和替代品证据也强化了同一点。HealthHero、Push Doctor、Doctolib、Docplanner、Teladoc，以及传统电话 +
              诊所工作流，都从不同角度切入同一类准入痛点。有些是医疗交付品牌，有些是工作流或市场平台产品，有些是虚拟医疗基础设施。因此，Kry
              所处的是混合市场，采用往往不只取决于消费者需求，更取决于临床工作流适配、信任和渠道经济。
