      - number: '5.2'
        title: 模块和资产横跨患者 app、临床工具、合作伙伴方案和诊所运营
        blocks:
          - type: paragraph
            body: >-
              Kry
              的产品栈至少有四层。第一层是消费者或患者层：预约、视频问诊、数字照护随访、定价和支付逻辑，以及按市场本地化的体验。第二层是临床人员和运营层，支持问诊、处方、排班、分流和持续照护。第三层是合作伙伴和企业层，服务与
              NHS 相连的客户、保险公司、雇主及其他机构客户。第四层是 Mjog 沟通平台，它从 Kry app 延伸到诊所工作流、消息、提醒、视频和远程监测。


              Mjog 尤其重要，因为它说明 Kry 不只拥有医疗交付品牌，也拥有具备独立价值的工作流资产。公开 Mjog 材料描述了与临床系统的集成、预约提醒、批量消息、临床人员工具栏工作流、远程监测问卷，以及按 NHS
              指南和无障碍规则搭建的诊所网站。挪威 fastlege 支持页面也指向类似方向，描述了数字前台、云病历、人员支持和本地诊所流程工具。


              因此，整体资产图谱不像单一产品，更像模块化运营栈。这能增加防御性，因为集成点和使用场景变多；但也让跨市场部署、支持和产品一致性更难管理。
