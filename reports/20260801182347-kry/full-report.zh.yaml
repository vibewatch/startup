        - Hermelinen 和诊所网络提高医疗问题解决率
        - 索取解决率和交接失败数据
      - - 预约可用性 / 等待时间
        - 部分 App 商店评论提到延迟或号源有限
        - 产能紧张会很快伤害满意度
        - 整体评分高，说明问题并非普遍存在
        - 提供各市场等待时长分布
      - - 合作伙伴与渠道依赖
        - 英国具名合作与公共系统渠道占比显眼
        - 增长可能受续标 / 重新招标牵动
        - 保险公司、雇主和公共系统之间已有渠道分散
