      - number: '4.4'
        title: 资本充足性看起来更好，但融资透明度仍不均衡
        blocks:
          - type: paragraph
            body: >-
              Kry 资本故事令人鼓舞的部分很清楚：利润率和现金流改善真实存在，管理层称集团 2025 年 2
              月达到正现金流，业务规模也足够大，投资者并不是在评估一家收入前初创公司。不那么令人鼓舞的是，公开证据仍没有完全厘清当前资产负债表或最新估值。年报披露了 2024
              年融资和所有权结构工作，第三方追踪则在累计融资、当前隐含价值和近期二级市场指示的含义上互不一致。


              Tracxn、WOWLS、Forge、Accumeo、Indexed.vc、GetLatka 和 Signalbase 都能帮助框定融资叙事，但它们无法干净对齐。Tracxn 显示七轮融资合计 $703
              million，并把 $2 billion 估值挂在 2021 年 Series D 上；Indexed.vc 和 Signalbase 增加了后续轮次或后续融资叙事；Forge 和 Accumeo
              指向活跃的私募市场或二级市场语境；WOWLS 认为 2021 年估值可能高估当前基本面。这组材料适合做情景框架，但不足以替代公司直接披露。


              因此，财务底线是有层次的。仅凭公开证据，Kry
              已不再明显像受融资约束；但它也没有提供足够直接披露来消除融资依赖风险。投资者可以基于改善中的表现做测算，但在假设公司能自筹所有下一阶段增长资金之前，仍应要求现金余额、债务条款、契约细节、优先权堆栈和资金用途计划。
