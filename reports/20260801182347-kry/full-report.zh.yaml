      - number: '5.4'
        title: 差异化来自运营模式、本地集成和信任控制
        blocks:
          - type: paragraph
            body: >-
              Kry 的差异化更多来自系统设计和本地执行，而不是公开记录中的核心算法。公司称拥有超过 200 million 次患者互动、广泛语言覆盖、24/7 临床人员准入，以及线上线下融合网络。Microsoft
              案例研究增加了由 Azure OpenAI 支持的工作流自动化证据；Mjog 材料则补充了面向外部诊所的工作流自动化和沟通工具。这些信号合在一起，支持 Kry 具备实质产品深度，尽管公开技术表面并不偏开发者。


              信任和合规控制也是产品核心。法律材料明确区分平台公司和本地医疗提供方；隐私和英国法律页面界定责任和通知；Livi 下载页链接到安全保护和漏洞披露材料；CQC
              记录提供外部监管质量锚点。这些都不是装饰。在医疗里，隐私姿态、安全保护和临床责任结构就是产品功能，因为它们决定患者、监管者和渠道伙伴是否信任这条工作流。


              局限在于，公开证据没有展示深层架构图、专利、性能基准或大型开发者生态。这让 Kry
              更像一家运营成熟的医疗平台，而不是纯技术护城河故事。对投资者而言，只要采用和结果保持强劲，这可以接受；但尽调应聚焦真实工作流优势、支持成本和安全控制，而不是假设中的软件魔法。
