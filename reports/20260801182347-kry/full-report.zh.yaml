      - number: '8.3'
        title: 牛 / 基准 / 熊情形应同时反映公司质量和证据质量
        blocks:
          - type: paragraph
            body: >-
              合理的情景框架从已知事实出发：2024 年收入接近 SEK 2.5
              billion，利润率改善，业务看起来比普通远程医疗怀疑者假设的更有运营韧性。然后再对未知项打折：当前股权结构条款、现金余额、合同耐久度、伙伴集中度，以及任何 2025
              年融资的确切价格或稀释。这自然会导向比成熟上市可比公司更宽的区间。


              熊市情形下，远程医疗倍数压缩、报销摩擦和隐藏融资悬置，可能把可防御价值拉到显著低于 2021
              年峰值标记。基准情形下，财务表现改善和混合医疗质量支撑可观企业价值，但仍不足以盲目确认完整的峰值时代软件式溢价。牛市情形下，Kry
              证明盈利改善可持续、渠道耐久，并建立可信的一体化医疗平台优势，价值可以守在旧独角兽锚点附近或略高。


              回报逻辑因此高度取决于入场价格和证据解锁。如果买方在没有获得新资产负债表和同期群数据的情况下，按过期头条估值附近付款，上行空间证据太薄。如果买方能以低于历史标记的折扣进入，并取得尽调权，不对称性会明显改善。
