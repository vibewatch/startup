          label: 会员用户
        - from: n5
          to: n6
          label: 患者路径
    claimRefs:
      - CU016
      - CU017
      - CU018
      - CU019
      - CU022
  - id: FU004
    title: 耐久性视角
    type: range
    layout: standard
    summary: 有连续性和合作伙伴嵌入可见时，客户耐久性最强；公开留存数据缺失时，客户耐久性最弱。
    data:
      items:
        - label: 患者连续性证据
          low: 2
          mid: 4
          high: 5
          displayValue: moderate → strong
          detail: 存在登记患者和随访信号
          tone: positive
        - label: 合作伙伴耐久性证据
          low: 2
          mid: 3
          high: 5
          displayValue: mixed → potentially strong
          detail: 有具名证据，但没有续约经济性数据
          tone: neutral
        - label: 留存透明度
          low: 1
          mid: 1
          high: 2
          displayValue: very low
          detail: NRR / GRR / 流失率未公开
          tone: warning
    approximationNotes: 序数区间比较的是证据强度，不是实测留存率。
    claimRefs:
      - CU020
      - CU021
      - CU024
      - CU025
      - CU026
      - CU027
  - id: FU005
    title: 客户结论 KPI
    type: kpi
    layout: standard
    summary: 采用广度清晰；续约经济性不清晰。
    data:
      items:
        - label: Kry App Store 评分
          value: 4.9/5, 277k ratings
          tone: positive
        - label: Livi App Store 评分
          value: 4.9/5, 53k ratings
          tone: positive
        - label: 法国数字预约
          value: 1.0M in 2024
          tone: positive
        - label: 具名大型合作伙伴
          value: Vitality, HA, Klarna, Scan, CloudFit
          tone: positive
        - label: 公开 NRR / GRR
          value: Not disclosed
          tone: warning
        - label: 头部渠道集中度
          value: Not disclosed
          tone: warning
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU022
      - CU033
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高风险象限集中在报销、监管执行和融资不透明。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
      rows:
        - label: 低可能性
          values:
            - 轻微法律链接规范问题
            - 局部支持摩擦
            - n/a
        - label: 中等可能性
          values:
            - 客户评论噪声
            - 渠道集中
            - 临床治理薄弱
        - label: 高可能性
          values:
            - n/a
            - 混合运营复杂度
            - 报销口径解读风险
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR020
  - id: FR002
    title: 监管依赖图
    type: flow
    layout: wide
    summary: Kry 同时依赖临床质量、报销口径解读、隐私合规和本地法律实体。
    data:
      nodes:
        - id: n1
          label: 患者诊疗事件
          detail: 问诊或随访
          type: input
        - id: n2
          label: 临床治理
          detail: 文档、处方、连续照护
          type: process
        - id: n3
          label: 报销逻辑
          detail: 计费与范围解读
          type: process
        - id: n4
          label: 数据 / 隐私控制
          detail: 敏感数据处理
          type: process
        - id: n5
          label: 本地受监管实体
          detail: 按国家划分责任
          type: process
        - id: n6
          label: 收入 + 信任结果
          detail: 利润率、合规、合作伙伴信心
          type: output
      edges:
        - from: n1
          to: n2
          label: 诊疗交付
        - from: n2
          to: n6
          label: 质量结果
        - from: n1
          to: n3
          label: 可报销活动
        - from: n3
          to: n6
          label: 收入结果
        - from: n1
          to: n4
          label: 数据生成
        - from: n4
          to: n6
          label: 信任结果
        - from: n2
          to: n5
          label: 实体责任
        - from: n5
          to: n6
          label: 监管问责
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
      - CR017
  - id: FR003
    title: 依赖与触发堆栈
    type: pyramid
    layout: standard
    summary: 数字化运营、合作伙伴渠道和报销逻辑同时起作用时，风险会叠加。
    data:
      items:
        - label: 技术与支持
          detail: 维持服务在线、可用所必需
          tone: neutral
        - label: 合作伙伴 / 渠道续约
          detail: 维持高效分发所必需
          tone: warning
        - label: 混合照护运营
          detail: 保障问题解决和质量所必需
          tone: warning
        - label: 报销与监管信任
          detail: 最关乎论点成败的一层
          tone: risk
    claimRefs:
      - CR022
      - CR023
      - CR024
      - CR025
      - CR029
      - CR035
  - id: FV001
    title: 正反论点对照图
    type: matrix
    layout: wide
    summary: Kry 的公司质量和证据质量目前并不匹配。
    data:
      columns:
        - 证据薄弱
        - 证据混杂
        - 证据扎实
      rows:
        - label: 公司质量弱
          values:
            - 放弃
            - 放弃
            - 罕见情形
        - label: 公司质量混杂
          values:
            - 放弃
            - 跟踪
            - 选择性接触
        - label: 公司质量强
          values:
            - 继续研究
            - 价格合适再跟踪 / 接触
            - 买入候选标的
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV029
  - id: FV002
    title: 估值锚梯
    type: pyramid
    layout: standard
    summary: 扎实估值证据明显少于扎实经营证据。
    data:
      items:
        - label: 当前追踪信息噪声
          detail: 最新叙事和二级市场线索噪声大
          tone: warning
        - label: 2021 年定价轮锚点
          detail: $2B 干净历史参照
          tone: neutral
        - label: 2024 年经营规模
          detail: SEK 2,497M 收入，利润率改善
          tone: positive
        - label: 缺少一手尽调
          detail: 现金、债务、股权结构、优先权
          tone: risk
    claimRefs:
