      - number: '3.3'
        title: 许多患者转换成本低，但渠道和照护路径嵌入后成本会升高
        blocks:
          - type: paragraph
            body: >-
              在患者层面，数字医疗的转换成本通常不高。若准入或质量令人失望，患者可以尝试另一个
              app、致电本地提供方，或使用不同合作伙伴渠道。因此，需求侧多栖很可能普遍存在。但这并不意味着所有竞争位置都弱。一旦保险公司、雇主、GP
              诊所或地区照护路径集成某个提供方，关系就更难被替换，因为运营、报销逻辑、沟通和照护随访已经接好。


              Kry 的合作伙伴公告意味着，分发关系是有意义的竞争资产。Vitality、HA | Wisdom Wellbeing、Klarna、Scan.com 和 CloudFit
              都增加了对特定人群或相邻场景的触达；直接面向消费者的 app 若要获得这些触达，就得花高价买营销。HealthHero 的英国定位展示了类似命题：最有防御性的运营方往往嵌入雇主、NHS
              流程或地方政府，而不是只依赖 app 下载。


              竞争含义是，Kry 的护城河部分来自运营和渠道，而非纯技术。如果公司能守住服务质量和续约经济性，这是好消息；但这也意味着，竞争者可以通过拿下同样合作伙伴、改善工作流适配，或收窄到 Kry
              更宽却不够聚焦的盈利专科利基，来侵蚀护城河。
