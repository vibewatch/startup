      - number: '7.4'
        title: 财务和模式风险在改善，但尚未完全解决
        blocks:
          - type: paragraph
            body: >-
              财务模型已有实质改善，但投资者不应把改善等同于免疫。利润率和现金流进展降低了风险，但公司仍处在一个对远程医疗经济性高度怀疑的行业。公开追踪器对当前估值背景意见不一，公司也没有披露足够资产负债表细节，无法排除融资依赖或优先权悬置风险。


              更广的模式风险也仍存在：远程医疗可以产生高使用量，却不一定产生软件式利润率。Kry
              的混合模式可能比纯视频同行位置更好，因为它能导向线下医疗和伙伴工作流；但它也背负资本强度和人员配置复杂度。这意味着模式既可能因报销恶化而失败，也可能因无法在规模化后保持运营效率而失败。


              缓释因素看得见。Kry
              提高了盈利能力，正式法律和隐私框架已经存在，英国服务受监管并经过外部审查，支持和培训职能公开，公司也把渠道多元化到不止一个纯应用。剩余风险并不是管理层忽视控制，而是医疗交付本来就是硬生意；即便控制良好的运营商，也可能突然遭遇政策、质量或资金冲击。
