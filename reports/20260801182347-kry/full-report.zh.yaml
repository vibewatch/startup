  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              不能把 Kry
              的市场规模等同于整个欧洲数字健康。公司变现的是更窄一块：数字优先初级医疗及相邻远程医疗工作流，交付路径要么依赖公共体系报销，要么依赖保险公司或雇主分发，要么是仍需本地受监管医疗交付的直接患者渠道。年报、官方品牌页面和合作伙伴材料显示，其线上线下融合模式覆盖视频问诊、就医导航、实体诊所、职业健康准入和部分诊断。因此，宽泛的数字健康或远程医疗
              TAM 页面可以提供背景，却不能直接代理 Kry 可捕获市场。


              处理规模测算，最好使用多重视角。分析师页面给出很大的相邻市场外框，而公司和年报披露显示 Kry 已实现版图小得多，也更受国家影响。瑞典仍是经济核心；法国已成为有规模且监管常态化的远程问诊市场；英国高度依赖 NHS
              和合作伙伴分发机制；挪威具备战略相关性但财务体量小。因此，实际问题不是数字健康是否足够大，而是这四个国家有多少获报销的初级医疗准入和线上线下融合医疗预算能迁移到 Kry 模式。


              本章有意把宽泛 TAM、国家层面变现证据和合作伙伴分发证据分开。已发布市场估算互相不同，是因为边界、地理范围，以及软件、医疗交付和远程监测支出组合都不同。保留这些矛盾，比强行捏出一个虚假精确的 SAM 更有用。
