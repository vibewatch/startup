      - number: '3.2'
        title: 能力宽度和渠道组合与品牌认知同样重要
        blocks:
          - type: paragraph
            body: >-
              Kry 的产品范围混合度很高。官方材料和合作伙伴页面显示，公司覆盖视频问诊、实体诊所、雇主和保险合作、诊断相邻业务，以及多语言 AI 支持。许多竞争者只在其中一两个维度很强。HealthHero 强在企业和
              NHS 支持；Push Doctor 强调英国 GP 准入；ZAVA 现在在处方和减重路径中高度可见；Doctolib 和 Docplanner 最强的是患者准入和工作流生态。Teladoc
              拥有最宽的全球虚拟医疗平台，包括心理健康和慢病管理。


              这形成了一个重要比较视角：有些对手拼宽度，有些拼渠道，有些拼地理。Kry
              的多市场运营版图让它比单一国家对手承担更多监管和部署复杂度，但也围绕渠道组合和混合医疗运营形成更强学习曲线。年报和官方页面显示，瑞典仍是最成熟的运营基地，法国和英国更暴露在竞争性渠道争夺中。


              信任和监管姿态也是竞争产品的一部分。Livi UK 的 CQC
              注册和公开质量记录很重要，因为数字医疗竞争常常取决于患者、合作伙伴和支付方是否相信该服务能安全承接持续初级医疗需求。拥有强消费者品牌但缺乏本地监管嵌入的竞争者，可能没有单看品牌指标那么防御性强。
