  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入质量、增长和牵引力
        blocks:
          - type: paragraph
            body: >-
              Kry 最强公开财务证据，是 2024 年报加上 2025 年 5 月业绩发布。2024 年合并净销售额达到 SEK 2,497 million，同比增长 13.3%；管理层称 2024
              年是迄今最好业绩，并称收入较 2022 年增长 22%。这条收入规模线很重要，因为它把 Kry 与较小的远程医疗叙事区分开，也提供了评估利润率改善、渠道组合和资本需求的真实基础。


              公开来源也显示，收入基础并非完全单一。Sacra 描述了三条主要收入流：问诊费、向医生和诊所销售 SaaS，以及来自药房和实验室等合作伙伴的转诊付款。公司的合作伙伴公告和 Mjog
              版图让这种组合看起来可信，但年报没有公布按收入流拆分的清晰定量数据。因此，投资者可以相信业务不止一个变现杠杆，同时仍应把确切收入组合披露视为不完整。


              牵引力指标支撑收入可信度。瑞典仍是锚点，拥有 250,000-plus 名注册患者和重要初级医疗基础；法国 2024 年交付 100 万次数字预约；Hermelinen 相关收购后材料表明，Kry
              继续把实体服务能力作为商业模式的一部分。由此呈现的，是一家有规模、有实际收入的混合医疗运营商，而不是一个没有可见商业模式、只追求使用率的纯消费者 app。
