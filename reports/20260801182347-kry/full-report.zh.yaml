      - CV011
      - CV012
      - CV013
      - CV014
  - id: FV003
    title: 可比公司定位图
    type: matrix
    layout: wide
    summary: Kry 介于轻资产数字医疗平台和人力密集型远程医疗运营商之间。
    data:
      columns:
        - 诊疗交付强度
        - 工作流 / 网络杠杆
        - 公开市场映射
        - 启示
      rows:
        - label: 类 Teladoc
          values:
            - 高
            - 中
            - 谨慎
            - 说明倍数压缩带来的下行风险
        - label: 类 Doximity
          values:
            - 低
            - 高
            - 有利
            - 说明轻资产生产率可拿到溢价
        - label: 类 Hims
          values:
            - 中
            - 高
            - 对势头敏感
            - 说明增长强劲时叙事有上行空间
        - label: Kry
          values:
            - 高
            - 中
            - 混杂
            - 需要混合倍数，并因不透明度打折
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV028
  - id: FV004
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前价格和股权结构证据不完整，合理估值区间因此很宽。
    data:
      items:
        - label: 悲观估值
          low: 0.8
          mid: 1
          high: 1.2
          displayValue: $0.8B → $1.0B → $1.2B
          detail: 远程医疗估值压缩，加上融资遗留压力
          tone: risk
        - label: 基准估值
          low: 1.3
          mid: 1.5
          high: 1.8
          displayValue: $1.3B → $1.5B → $1.8B
          detail: 业务改善，但相对过时峰值仍需折价
          tone: neutral
        - label: 乐观估值
          low: 2
          mid: 2.1
          high: 2.3
          displayValue: $2.0B → $2.1B → $2.3B
          detail: 利润率持续改善，加上披露更充分
          tone: opportunity
    approximationNotes: 情景区间是以十亿美元计的启发式区间，不是已观察到的交易价格。它们用来展示估值在多大程度上取决于证据解锁和定价纪律。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
