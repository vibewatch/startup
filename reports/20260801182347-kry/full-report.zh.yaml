  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: Kry 直接服务患者，但真实客户地图还包括支付方、雇主、保险公司和公共体系
        blocks:
          - type: paragraph
            body: >-
              Kry 的客户图谱是多边的。患者是终端用户，也往往是最显眼的受益者；但渠道证据显示，公共医疗体系、雇主、保险方和机构伙伴也在塑造准入与价值捕获。在瑞典，登记患者和诊所会员关系说明，Kry
              做的是持续的初级医疗关系，不是一次性远程问诊。在法国，可报销的远程问诊把患者体验嵌在公共体系里。在英国，Livi 的合作伙伴页面明确面向 ICS、ICB、急诊护理服务、PCN、保险方和雇主。


              关键在于，收入耐久度不只取决于患者下载量。一部分使用来自患者主动复诊；另一部分来自合同、路径和合作伙伴关系，把 Kry 嵌进医疗准入基础设施。相比纯 D2C
              医疗应用，这条分发故事更强；但如果一两个渠道主导增长，集中度和采购风险也会抬升。


              因此，最好的公开分层框架是买方 / 用户 / 支付方 / 渠道。患者、家庭、NHS
              相关用户、登记初级医疗患者、保险会员、雇主人群和伙伴转介用户，都出现在留存证据中。本章用这个框架评估采用率和耐久度，而不是假装所有流量都代表同一种客户关系。
