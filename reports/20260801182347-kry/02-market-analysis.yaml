- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Primary-care access shortage and convenience demand
    - Positive
    - Current
    - Supports digital-first front-door demand across public and private channels.
    - Quantify wait-time or access improvement by market.
  - - France teleconsult normalization
    - Positive
    - Current
    - One million digital appointments and 35% growth in 2024 support a scaled French use case.
    - Test whether growth is profitable and repeatable after regulatory changes.
  - - EHDS interoperability push
    - Positive
    - 2025-2031
    - Could widen the market for compliant cross-border digital-health infrastructure.
    - Ask management how EHDS changes product roadmap and compliance spend.
  - - UK digital-access requirements
    - Positive
    - 2025 onward
    - Favors operators that can support sustained online access and rapid response.
    - Measure whether Kry/Livi is directly embedded in these workflows or adjacent to them.
  - - Employer and insurer distribution
    - Positive
    - Current
    - Partnership channels can expand reach without relying only on direct patient acquisition.
    - Request partner economics, renewal rates, and contribution margins.
  - - Workflow and integration burden
    - Negative
    - Current
    - Digital care adoption can stall if provider workflow fit is weak or systems are fragmented.
    - Assess deployment time, utilization, and clinician satisfaction by market.
  - - Reimbursement and billing disputes
    - Negative
    - Current
    - Public-payer dependency exposes operators to claim-rule changes and repayment risk.
    - Review region-by-region reimbursement exposure and dispute history.
  - - Hybrid care capital intensity
    - Negative
    - Current
    - Physical clinic capacity improves defensibility but can make scaling harder than pure software.
    - Request clinic-level contribution margins and utilization data.
  notes: Rows combine broad category growth with the operational frictions most likely to decide whether Kry captures it economically.
