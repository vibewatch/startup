- id: buyer-user-payer-structure
  title: Buyer, user, and payer mechanics differ by channel and country
  body: |-
    Kry's user is the patient, but its budget owner changes by route to market. In Sweden and parts of France, the public system effectively pays for the clinical act while the provider organization bears the operating model and compliance burden. In the UK, NHS-linked access and regulated service delivery matter, but insurer, employer, and membership channels also appear material through partnerships with Vitality, HA | Wisdom Wellbeing, Klarna, Scan.com, and CloudFit. That gives Kry multiple buyer types, but not one uniform European sales motion.

    The payer distinction matters strategically. Sacra describes consultation fees as the dominant revenue stream and says public payers account for most consultation-fee revenue, while official and partner materials show that Kry also layers private distribution and referral-style adjacencies onto that base. In other words, Kry is not purely a SaaS vendor and not purely a consumer telemedicine app; it is a care-delivery platform whose monetization depends on a mix of public reimbursement, enterprise distribution, and patient access economics.

    Competitor and substitute evidence reinforces the same point. HealthHero, Push Doctor, Doctolib, Docplanner, Teladoc, and legacy phone-plus-clinic workflows all attack related access pain from different angles. Some are care-delivery brands, some are workflow or marketplace products, and some are virtual-care infrastructure. Kry therefore competes across a blended market where adoption often depends less on consumer demand than on clinical workflow fit, trust, and channel economics.
