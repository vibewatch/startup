companyProfile:
  summary: 'Kry is a Stockholm-headquartered digital healthcare company founded in 2015 that operates a hybrid care model across Sweden, Norway, the UK, and France, using the Livi brand in the UK and France. Public materials show a business that has grown beyond simple video consultations into an integrated digiphysical operating model spanning remote consultations, physical clinics, public-system pathways, partner distribution, and workflow infrastructure such as Mjog. The operating story is increasingly credible: 2024 net sales reached SEK 2,497 million and margins improved sharply. The valuation story is less clear because public sources do not cleanly reconcile the latest financing amount, total capital raised, or current fair-value mark.'
  foundedDate: null
  foundingLocation: Stockholm, Sweden
  headquarters: Stockholm, Sweden
  productSummary: Hybrid digital-and-physical care platform offering teleconsultations, primary care, specialist routing, physical clinics, partner solutions, and workflow tooling such as Mjog for patient communication and practice operations.
  customerFocus: Patients, public healthcare systems, clinics, insurers, employers, and care partners across Sweden, Norway, the UK, and France.
  businessModel: Care-delivery revenue from consultations and listed primary-care relationships, supplemented by partner-channel distribution and workflow/software infrastructure embedded in the broader hybrid-care platform.
  stage: Late-stage private
  fundingStatus: The clearest retained valuation anchor is the April 2021 $2B Series D. Public trackers later suggest additional 2025 financing and total capital of roughly $703M or more, but the exact 2025 amount, valuation, instrument mix, and dilution remain unresolved in the public record.
