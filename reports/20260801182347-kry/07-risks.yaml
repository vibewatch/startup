  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: incident and audit history
    missingEvidence: Formal incident, complaint, safety-event, and internal-audit data by market.
    whyItMatters: Public sources show selected risk events, but not whether they are isolated or systemic.
    diligencePath: Request internal audit packs, serious-incident logs, and complaint trend reporting.
    relatedQuestionRefs:
    - QR010
    - QR013
    - QR021
    - QR025
  - type: missing-source
    severity: material
    topic: channel and dependency concentration
    missingEvidence: Top partner, payer, cloud, and supplier concentration data.
    whyItMatters: Named dependencies are visible, but actual concentration could change downside materially.
    diligencePath: Request top-10 exposure tables by revenue, users, and critical vendor dependency.
    relatedQuestionRefs:
    - QR016
    - QR018
    - QR022
  - type: missing-source
    severity: minor
    topic: legal-control surface completeness
    missingEvidence: Resolvable public or internal copies of safeguarding, vulnerability, and technology-governance policies.
    whyItMatters: Public link structure suggests control intent, but not full reviewable detail.
    diligencePath: Collect policy documents and ownership/responsibility matrix directly from management.
