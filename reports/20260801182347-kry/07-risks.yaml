- id: regulatory-legal-and-quality-risk
  title: Regulatory, legal, and quality risk are structural to the model
  body: |-
    Kry operates across heavily regulated healthcare systems, so legal and quality risk sit at the center of the investment case. The UK CQC record is directionally positive because Livi UK is rated Good overall and well-led, but the effective report still identified a material care-process weakness: some prescriptions were not always communicated to patients’ own GPs. Public evidence therefore supports both trust and residual quality risk at the same time.

    In Sweden, the annual report discloses region-level claims for repayment tied to billing and consultation structure. Kry disputes those claims, but the key analytical point is broader: the model depends on how regional or national actors interpret remote-care billing, scope, and process rules. If interpretations tighten or disputes multiply, revenue quality and margin progress can reverse quickly.

    Privacy, safeguarding, and legal-entity structure add another layer. Kry and Livi publish privacy, EULA, cookies, and local notice materials, while download-page links reference safeguarding and vulnerability-disclosure content. That is comforting from a control-design perspective, yet the volume of legal surfaces also reflects how compliance-heavy the business is. In healthcare, that burden is a permanent operating reality, not a one-time setup cost.
