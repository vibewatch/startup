- id: operational-partner-and-model-risk
  title: Operational and dependency risks flow from hybrid care, channel embedding, and platform dependence
  body: |-
    Kry’s hybrid model improves care resolution, but it introduces operational risk that pure software businesses do not bear. Clinics, urgent care, diagnostics handoffs, local clinician staffing, and cross-border process variants all create more points of failure. App-directory complaints about appointment availability or being routed to physical care after a digital step are small relative to overall positive satisfaction, but they show how easily experience can degrade if capacity or triage quality slips.

    Partner dependence is the second major operational risk. In the UK especially, Kry’s growth narrative is intertwined with partner distribution and public-system relationships. Vitality, HA | Wisdom Wellbeing, Klarna, CloudFit, Scan.com, ICSs, ICBs, and GP-practice channels expand reach, but they also create renewal, pricing, and concentration risk. If embedded channels weaken or are rebid, the company may retain demand but lose profitable distribution.

    Technology and cloud dependence also matter even if public infrastructure detail is sparse. Microsoft’s case study and Mjog’s communication stack suggest real reliance on cloud-based workflow, AI tooling, and integrated digital channels. That is normal for a modern health platform, but it means outages, security incidents, or major vendor dependence could affect both care delivery and partner trust at once.
