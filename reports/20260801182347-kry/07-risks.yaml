chapter:
  number: 7
  title: Risks
  summary: Kry’s main risks are not abstract startup risks; they are regulated-healthcare operating risks. The annual report and CQC record surface reimbursement disputes, clinical-process weaknesses, financing opacity, partner and public-system dependence, and the complexity of running a hybrid care model across countries. The company also shows mitigations—improving performance, legal and privacy controls, local regulated entities, and embedded support workflows—but public evidence still leaves meaningful residual exposure around reimbursement, quality execution, concentration, and balance-sheet transparency.
sections:
- id: top-ranked-risk-picture
  title: Kry’s most material risks sit in reimbursement, regulated execution, and transparency rather than pure product demand
  body: |-
    The public record suggests that Kry’s biggest risks are those of a scaled healthcare operator, not those of a pre-product startup. Demand risk exists, but it is not the headline issue: millions of consultations, high app ratings, and visible partner demand show that customers want the service. The sharper questions are whether public reimbursement remains supportive, whether cross-country regulated-care execution stays clean, whether partner and channel dependence becomes concentrated, and whether the balance sheet is strong enough to absorb shocks.

    Two risks stand out immediately from primary sources. First, the annual report discloses Swedish regional repayment disputes tied to billing and consultation-structure disagreements. Second, the UK CQC effective report flagged a care-coordination weakness around informing patients’ own GPs when certain prescriptions were issued. Neither item alone breaks the thesis, but together they show that revenue-recognition and clinical-governance risks are real, not hypothetical.

    The rest of the risk picture follows logically: sensitive-data compliance, hybrid operational complexity, clinician-capacity pressure, partner concentration, and financing opacity. The company has visible mitigations on several fronts, but residual exposure remains material enough that investors should treat risk diligence as core, not peripheral.
