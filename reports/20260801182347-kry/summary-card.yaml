summary:
  headline: >-
    Kry has built one of Europe's more credible hybrid-care platforms, but unresolved financing terms, labor-heavy
    economics, and channel opacity keep the stock in track territory rather than buy territory.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
