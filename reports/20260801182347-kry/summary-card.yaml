  topStrengths:
    - >-
      Kry has real operating scale across four European markets, with 2024 net sales of SEK 2,497M and nearly 11M
      consultations anchored in the annual report.
    - >-
      2024 margins and cash flow improved sharply, and management said all markets were profitable at the end of 2024
      with positive cash flow reported for February 2025.
    - >-
      The product is broader than a video-GP app: Kry combines digital intake, clinicians, physical clinics, partner
      pathways, and workflow infrastructure such as Mjog.
    - >-
      Public-system and partner distribution in Sweden, France, the UK, and Norway create stronger channel depth than a
      pure D2C telehealth model.
  topRisks:
    - >-
      The latest financing amount, current valuation, cap-table terms, and any preference overhang are not cleanly
      disclosed and public trackers conflict materially.
    - >-
      Kry remains a labor- and operations-intensive care-delivery business, not a pure software platform, and public
      sources still do not disclose gross margin or clinic-level contribution economics.
    - >-
      Regulatory and reimbursement risk is live, including Swedish repayment disputes and ongoing dependence on
      public-system interpretations and NHS-style pathways.
    - >-
      Channel durability and concentration remain under-disclosed; partner economics, renewals, and market-level
      retention are still not visible enough for high-conviction underwriting.
    - >-
      Official and third-party KPI surfaces use inconsistent counts for appointments, clinics, workforce, and total
      funding, reducing trust in simple headline metrics.
  unresolvedGaps:
    - >-
      Primary documentation for any 2025 financing round, including amount, valuation, investors, liquidation
      preferences, and governance rights.
    - Current cash balance, debt stack, runway, and covenant detail after the 2024-2025 restructuring period.
    - >-
      Market-level and clinic-level contribution margins, clinician utilization, and the profitability of partner versus
      direct channels.
    - Renewal, concentration, and retention data for NHS, insurer, employer, and public-system relationships.
    - >-
      A fully reconciled KPI deck aligning consultations, appointments, clinics, employees, and Mjog-driven workflow
      metrics across the group.
