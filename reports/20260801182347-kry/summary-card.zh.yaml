  topStrengths:
    - Kry 在四个欧洲市场具备真实运营规模，2024 年净销售额 SEK 2,497M、近 11M 次问诊都有年报支撑。
    - 2024 年利润率和现金流大幅改善；管理层称所有市场在 2024 年底已盈利，并报告 2025 年 2 月现金流为正。
    - 产品不只是视频全科医生应用：Kry 把数字分诊、临床医生、实体诊所、合作方路径和 Mjog 等工作流基础设施拼在一起。
    - 在瑞典、法国、英国和挪威，公共系统和合作伙伴分发让 Kry 的渠道深度强于纯 D2C 远程医疗模式。
  topRisks:
    - 最新融资金额、当前估值、股权结构条款和任何优先权包袱都没有清楚披露，公开追踪数据还存在重大冲突。
    - Kry 仍是人力和运营密集的医疗服务交付业务，不是纯软件平台；公开来源仍未披露毛利率或诊所层面的贡献经济性。
    - 监管和报销风险仍在，包括瑞典退款争议，以及对公共系统解释和 NHS 式路径的持续依赖。
    - 渠道耐久性和集中度披露不足；合作伙伴经济性、续约和市场层面留存仍不够透明，难以高置信承销。
    - 官方和第三方 KPI 口径在预约、诊所、员工和总融资额上不一致，削弱了对简单头部指标的信任。
  unresolvedGaps:
    - 任何 2025 年融资轮的原始文件，包括金额、估值、投资人、清算优先权和治理权。
    - 2024–2025 年重组期之后的当前现金余额、债务结构、跑道和契约细节。
    - 市场层面和诊所层面的贡献利润率、临床医生利用率，以及合作伙伴渠道与直销渠道的盈利能力。
    - NHS、保险公司、雇主和公共系统关系的续约、集中度和留存数据。
    - 一套完全对齐的 KPI 材料，能统一集团内的问诊、预约、诊所、员工和 Mjog 驱动工作流指标。
