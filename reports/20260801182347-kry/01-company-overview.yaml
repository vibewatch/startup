- id: financial-scale-and-capital
  title: Financial profile, market traction, and capital picture
  body: |-
    The cleanest financial evidence comes from Kry's 2024 annual report and the company's May 2025 results release. Consolidated 2024 net sales were SEK 2,497 million, up 13.3% from 2023, while EBITDA margin improved sharply to -4.4% from -19.5% and EBITA margin improved to -12.3% from -31.5%. Negative group cash flow improved to SEK -125 million from -495 million, and management said February 2025 cash flow was positive. The May 2025 results release also says all markets returned a profit at the end of 2024, which is an important forward-looking signal even though public market-by-market profit detail remains sparse.

    Operating footprint in Sweden remains the group's anchor. The annual report shows 254,000-plus registered patients at 29 healthcare centres across seven regions and average 2024 employment of 1,591 people group-wide, down from 1,872 in 2023. Country-level revenue in 2024 was SEK 1,788.8 million in Sweden, SEK 417.1 million in France, SEK 247.8 million in the UK, and SEK 35.9 million in Norway. This supports a thesis that Sweden is still the economic core while France and the UK are the most material non-Swedish growth markets.

    The hardest chapter-one question is capital structure and current valuation. Public official materials document 2024 convertible-loan financing, equity restructuring, and Goldman Sachs-advised ownership simplification, but they do not disclose a clean current post-money valuation. Third-party sources conflict materially: Sacra cites $2.0 billion valuation and €516 million funding tied to the 2022 round, GetLatka reports roughly $232 million ARR, $2.0 billion valuation, $627 million total funding, and 919 employees as of late 2025, Indexed.vc reports $500 million raised in April 2025 and $1.4 billion total raised across nine rounds, and Signalbase publishes a €500 million April 2025 funding claim with sparse source transparency. This evidence is enough to sustain the view that Kry remains a late-stage European healthtech platform with unicorn-level scale, but not enough to resolve the exact latest round size, investor mix, or dilution terms without management data.
