- id: leadership-and-governance
  title: Leadership, board, and governance transition
  body: |-
    Kry's founder-led identity remains important, but the company executed a visible leadership transition at the end of 2024. Johannes Schildt moved from CEO to chairman of the board in December 2024, while former deputy CEO and COO Kalle Conneryd Lundgren became CEO and joined the board. Both Kry and Livi described the handover as a shift from founder-led scale-up management toward a structure where Schildt focuses on long-term growth and technology while Lundgren runs operations.

    The public record supports Lundgren's operational and clinical credibility. Company statements describe him as a surgeon, associate professor of reconstructive plastic surgery, and former COO of Karolinska University Hospital, with academic training spanning theoretical physics, biochemistry, and biophysics. The annual report adds that new board members Yrjö Närhinen and Shrirang Apte joined during the same transition while Martin Mignot stepped down.

    Governance visibility is still incomplete. The 2024 annual report discloses seven board members at year-end and a male-heavy board composition, but it does not publish a full committee map, investor rights schedule, or board committee charters in public materials. Livi UK's CQC profile confirms that Dr Kalle Conneryd-Lundgren is the nominated individual for the UK regulated service, which gives comfort on direct operating accountability, but investors still need a clearer read on committee oversight, independent director responsibilities, and any special governance attached to recent financing.
