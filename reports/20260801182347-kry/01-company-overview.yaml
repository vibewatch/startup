  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: metric-reconciliation
    missingEvidence: A management-approved reconciliation of consultation, clinic, and workforce metrics across Kry, Kry Sweden, and Livi websites.
    whyItMatters: Current official pages use different definitions and counts, which affects cover metrics and cross-chapter consistency.
    diligencePath: Request a current company fact sheet defining appointments, consultations, clinics, employees, clinicians, and patient coverage on a like-for-like basis.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: latest-financing-terms
    missingEvidence: Primary documentation for the claimed April 2025 financing round, including amount, instrument, investors, valuation, and governance rights.
    whyItMatters: Public third-party sources conflict on total raised, round size, and employee count, limiting confidence in the latest valuation context.
    diligencePath: Obtain board-approved financing materials, term sheets, updated cap table, and any press release or investor memo covering the 2025 round.
    relatedQuestionRefs:
    - QO021
    - QO022
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: board-committees
    missingEvidence: A current public or management-provided board roster with committee memberships and independent-director responsibilities.
    whyItMatters: Governance maturity matters for a regulated multi-market healthcare operator undergoing leadership and ownership restructuring.
    diligencePath: Request current board materials, committee charters, and investor-rights summary during management diligence.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: sweden-registered-patient-growth
    missingEvidence: Reconciliation between the annual report's 11,000 new Swedish registered patients and the later results release's close to 16,000 new registered patients.
    whyItMatters: The difference likely reflects timing or definition, but without reconciliation it weakens precision on Swedish growth claims.
    diligencePath: Ask management to specify measurement dates and whether the later figure includes post-year-end organic additions or acquired volumes.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO001
  - type: stale
    severity: minor
    topic: valuation-markers
    missingEvidence: A current, date-stamped valuation mark or financing event directly from the company rather than older or third-party estimates.
    whyItMatters: The public $2B valuation marker is legacy enough that recommendation-grade valuation work cannot rely on it without triangulation.
    diligencePath: Request current investor materials or audited financing disclosures, and triangulate with refreshed comparable analysis in the valuation chapter.
