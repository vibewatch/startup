callouts:
- calloutType: strength
  title: Hybrid model has become structurally real rather than aspirational
  body: Kry is no longer only a telemedicine front end. The annual report, official market pages, and partner materials all describe a digiphysical model spanning digital triage, specialist pathways, physical clinics, occupational health, and urgent-care extensions across four core markets.
  claimRefs:
  - CO003
  - CO004
  - CO016
  - CO038
  - CO044
  - CO045
- calloutType: risk
  title: Public metrics and capital claims are not yet cleanly reconcilable
  body: Official pages disagree on clinic, appointment, and workforce totals, while third-party databases disagree on total funding, latest round size, and even current employee counts. Management materials are directionally supportive, but investors should treat the public cap-table and scale picture as provisional until diligence reconciles definitions and instruments.
  claimRefs:
  - CO015
  - CO028
  - CO047
  - CO048
  - CO049
  - CO050
- calloutType: insight
  title: Regulated public-system execution is both the moat and the risk surface
  body: Kry's strongest advantages come from integrating into public systems and payer pathways, but the same exposure creates reimbursement disputes, compliance obligations, and regulator-facing quality expectations. The Livi UK CQC record and Swedish regional disputes show both sides of that trade-off.
  claimRefs:
  - CO024
  - CO032
  - CO033
  - CO034
  - CO041
