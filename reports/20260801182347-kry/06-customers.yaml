- id: adoption-trajectory-and-named-proof
  title: Adoption signals are strong, with better named proof on channels than on net revenue retention
  body: |-
    Kry’s public adoption signals are substantial. Official pages cite 14 million appointments or consultations on some surfaces, 10 million-plus patients treated on app-store surfaces, 250,000-plus listed patients in Sweden, 1 million digital appointments in France in 2024, and 200 million-plus patient interactions in the Microsoft case study. Customer-facing app-store reviews add very large review counts and high average scores. Taken together, that is enough to believe the service has broad real-world usage and repeat demand.

    Named customer proof is strongest in the UK partner channel. Vitality, HA | Wisdom Wellbeing, Klarna, Scan.com, and CloudFit show that employers, insurers, and adjacent health partners trust Kry or Livi enough to distribute services to their users. Livi’s UK partner homepage also positions the company for ICSs, ICBs, urgent care services, GP practices, and insurers, suggesting that institutional adoption is a core part of the expansion playbook.

    The weaker area is classic software-style retention disclosure. Public sources do not provide NRR, GRR, churn, cohort retention, or contract-renewal metrics. Customer proof is therefore strong on breadth and reference quality, but incomplete on economic durability.
  claimRefs:
