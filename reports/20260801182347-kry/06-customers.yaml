company:
  name: Kry
chapter:
  number: 6
  title: Customers
  summary: 'Kry serves a mixed customer base: patients use the app, but care pathways are often funded or distributed through public systems, employers, insurers, and partner networks. Public evidence shows strong adoption signals—millions of appointments, high app-store ratings, scaled listed-patient bases, and visible UK partner relationships—but customer economics remain partially opaque. The main diligence issue is not whether customers use Kry, but how durable usage and renewals are across public, partner, and direct-pay channels.'
sections:
- id: customer-base-and-segmentation
  title: Kry serves patients directly, but the real customer map includes payers, employers, insurers, and public systems
  body: |-
    Kry’s customer picture is multi-sided. The patient is the end user and often the visible beneficiary, but channel evidence shows that public systems, employers, insurers, and institutional partners also shape access and value capture. In Sweden, listed patients and clinic membership indicate an ongoing primary-care relationship rather than one-off teleconsult usage. In France, reimbursable teleconsultation means the patient experience sits inside the public system. In the UK, Livi’s partner pages explicitly target ICSs, ICBs, urgent care services, PCNs, insurers, and employers.

    This matters because revenue durability depends on more than patient downloads. Some usage comes from patients returning voluntarily for care, but some comes from contracts, pathways, and partner relationships that embed Kry into access infrastructure. That is a stronger distribution story than a pure D2C healthcare app, yet it also creates concentration and procurement risk if one or two channels dominate growth.

    The best public segmentation lens is therefore buyer/user/payer/channel. Patients, families, NHS-linked users, listed primary-care patients, insurer members, employer populations, and partner-referred users all appear in the retained evidence. The chapter evaluates adoption and durability through that lens rather than pretending all traffic is the same kind of customer relationship.
