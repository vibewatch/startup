- id: adverse-signals-and-diligence-asks
  title: High satisfaction is real, but service-access complaints and opaque renewal metrics still matter
  body: |-
    Customer evidence is broadly positive, but not uniformly so. Apple and Google app-store pages show very high ratings and large review counts, which are meaningful at Kry’s scale. AppBrain and app-store excerpts also preserve occasional complaints about appointment availability, technical issues, or being routed to physical care after a paid or time-consuming digital step. Those comments do not overpower the overall positive signal, but they do show where customer experience can erode if operational capacity tightens.

    The main diligence gap is therefore not whether customers exist or like the product in general. It is whether the strongest visible channels—listed patients, partner contracts, insurer distribution, and high-frequency app users—translate into durable, economically attractive cohorts. Without contract terms, retention curves, NRR/GRR, or top-channel concentration, a customer chapter can validate demand but not fully underwrite value capture.

    The customer verdict is favorable on breadth, adoption, and reference quality; positive but cautious on durability; and incomplete on concentration and renewal economics. For later valuation work, that means customers support the thesis, but they do not yet remove the need for disciplined channel-level diligence.
