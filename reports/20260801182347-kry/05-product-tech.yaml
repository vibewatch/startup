  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: deep architecture and performance metrics
    missingEvidence: Infrastructure diagrams, uptime history, incident metrics, data residency detail, and measurable AI productivity results.
    whyItMatters: Public pages prove production use but not the depth or efficiency of the technical stack.
    diligencePath: Request architecture review, SRE metrics, security testing summaries, and measured workflow gains.
    relatedQuestionRefs:
    - QE014
    - QE018
    - QE020
    - QE025
  - type: missing-source
    severity: material
    topic: module-level product economics
    missingEvidence: Usage, attach, and support cost by module and by market.
    whyItMatters: A broad operating stack can be powerful but expensive if support or implementation costs are high.
    diligencePath: Request module usage dashboards and support-cost allocation.
    relatedQuestionRefs:
    - QE009
    - QE016
    - QE021
  - type: missing-source
    severity: minor
    topic: standalone Mjog commercial model
    missingEvidence: Clear public pricing or revenue contribution of Mjog inside the wider group.
    whyItMatters: Mjog looks strategically important but financially opaque from public materials.
    diligencePath: Request Mjog ARR, customer count, and external vs internal usage split.
    relatedQuestionRefs:
