chapter:
  number: 4
  title: Financials
  summary: 'Kry’s public financial picture is unusually solid on top-line and margin direction for a private European telehealth company: 2024 revenue reached SEK 2,497 million, EBITDA margin improved to -4.4%, EBITA margin improved to -12.3%, and cash flow improved materially, while management said all markets returned a profit at end-2024 and February 2025 cash flow was positive. The blind spots are still material: public sources do not cleanly disclose gross margin, clinic-level profitability, CAC, retention, debt terms, or the exact economics of the latest financing. Financial quality looks improving and increasingly credible, but capital structure and channel economics remain partially opaque.'
sections:
- id: revenue-quality-and-traction
  title: Revenue quality, growth, and traction
  body: |-
    Kry’s strongest public financial evidence is the 2024 annual report reinforced by the May 2025 results release. Consolidated net sales reached SEK 2,497 million in 2024, up 13.3% year over year, while management described 2024 as its best results to date and said revenue had increased 22% since 2022. That top-line scale matters because it separates Kry from smaller telehealth narratives and gives it a real base from which to evaluate margin improvement, channel mix, and capital needs.

    Public sources also suggest the revenue base is not purely one-dimensional. Sacra describes three primary revenue streams: consultation fees, SaaS sales to doctors and clinics, and referral payments from partners such as pharmacies and labs. The company’s partner announcements and Mjog footprint make that mix plausible, but the annual report does not publish a clean quantitative revenue split by stream. Investors can therefore believe the business has more than one monetization lever while still treating exact mix disclosure as incomplete.

    Traction metrics support revenue credibility. Sweden remains the anchor with 250,000-plus listed patients and a significant primary-care base; France delivered one million digital appointments in 2024; and post-acquisition materials around Hermelinen indicate that Kry continues to add physical-service capacity as part of the commercial model. The resulting picture is of a scaled hybrid healthcare operator with meaningful revenue, not a pure consumer app chasing utilization without a visible business model.
