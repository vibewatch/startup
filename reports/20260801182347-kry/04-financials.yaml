- id: margin-path-cost-structure-and-efficiency
  title: Margin path improved sharply, but cost structure still reflects a healthcare operator
  body: |-
    Kry’s reported margin direction improved dramatically in 2024. EBITDA margin improved to -4.4% from -19.5%, EBITA margin improved to -12.3% from -31.5%, and negative cash flow improved to SEK -125 million from SEK -495 million. The results release then added two important forward signals: all markets returned a profit at the end of 2024, and February 2025 cash flow was positive. Those are meaningful statements for a business often viewed through a telehealth skepticism lens.

    At the same time, nothing in the public record suggests Kry has escaped the basic cost realities of care delivery. The model still depends on clinicians, care operations, compliance, customer support, and a growing physical footprint. Workforce and clinic disclosures support a discipline story more than a pure software-margin story: average group employment fell to 1,591 in 2024 from 1,872 in 2023, which likely helped the cost base, but the business remains structurally more labor- and operations-intensive than a workflow-only SaaS company.

    The best interpretation is that Kry has substantially improved efficiency without yet becoming easy to underwrite as a software-like margin business. Public evidence supports an improving margin path, but it does not reveal gross margin, contribution margin by market, clinician utilization by channel, or the extent to which recent gains came from cost actions versus durable revenue quality.
  claimRefs:
