      xAxis: "Documented distribution evidence (ordinal 1–3)"
      yAxis: "Documented adjacent financial-product scope (ordinal 1–3)"
      points:
        - label: Kredivo
          x: 3
          y: 3
        - label: GoPayLater / GoTo
          x: 2
          y: 2
        - label: Shopee PayLater / Sea
          x: 2
          y: 1
        - label: Akulaku
          x: 2
          y: 1
        - label: Atome
          x: 2
          y: 1
        - label: Indodana
          x: 2
          y: 1
    approximationNotes: >-
      Analyst-coded ordinal scores: distribution 1=provider named only, 2=one platform or partner
      route described, 3=multiple routes described; product scope 1=BNPL only, 2=BNPL plus
      adjacent group fintech lending, 3=BNPL, personal loans, and bank adjacency. Competitor
      placements beyond Kredivo and GoTo rely mainly on a competitor-authored 2025 overview;
      Shopee's BNI route was only reported as planned. Scores describe source coverage, not
      capability, adoption, quality, or comparable benchmarks.
    claimRefs:
