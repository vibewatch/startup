chapter:
  number: 3
  title: Competitors
  summary: Public evidence places Kredivo against ecosystem-led BNPL and digital-credit alternatives, with distribution and adjacent financial products as its clearest disclosed differentiators. Current comparable pricing, customer-level switching costs, and rival scale remain unverified; competitor evidence is uneven and includes company-authored comparisons.
sections:
  - id: competitive-perimeter
    title: Competitive perimeter and identified alternatives
    body: >-
      The assigned evidence identifies competition across standalone BNPL, marketplace-embedded
      pay-later, and broader app-based financial ecosystems rather than a single like-for-like
      lender set. Kredivo's own materials describe BNPL and personal loans, while an independent
      2021 Reuters report also described e-commerce and offline credit; both are evidence of
      product scope, not current market share (CP001). A 2025 Elevate Pay overview names Akulaku,
      Atome, GoPayLater, Indodana, Shopee PayLater, Julo, and Cicil, but that comparison is
      competitor-authored and supplies no independently verified ranking or consistent scale
      data (CP009, CP011, CP012). It is therefore a discovery map, not a market census. The
      profile table separates current-period GoTo disclosure from older or less-verifiable
      competitor descriptions and explicitly leaves missing scale fields open.
    claimRefs:
      - CP001
      - CP009
      - CP011
      - CP012
    tableRefs:
      - TP001
  - id: distribution-and-product-scope
    title: Distribution and adjacent financial products
    body: >-
      Kredivo's public milestones describe partner-led reach across retail, transport, merchant,
      and bank channels, alongside a Krom digital-banking launch in February 2024 (CP002, CP013).
      These disclosures suggest more potential routes to customers and funding than a checkout-only
      BNPL product, but they do not establish active usage, economics, exclusivity, or durable
      customer lock-in. GoTo offers a relevant ecosystem comparison: its company-reported first
      quarter 2026 fintech metrics include a Rp9.893 trillion loan book, Rp1.909 trillion of
      segment net revenue, and 27.5 million fintech monthly transacting users, with the GoPay app
      identified as a driver of loan-book growth (CP005–CP008). These are GoTo segment figures,
      not GoPayLater-only metrics. Detik's July 2024 report described a BNI plan to channel
      financing for Shopee PayLater and integrate credit scoring; it documents a proposed
      distribution arrangement, not proof that it was completed (CP010).
    claimRefs:
      - CP002
      - CP005
      - CP006
      - CP007
      - CP008
      - CP010
      - CP013
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: pricing-and-packaging
    title: Pricing and packaging remain non-comparable
    body: >-
      No retained source provides a same-date, provider-by-provider schedule of realized rates,
      fees, promotional periods, credit limits, repayment terms, or merchant economics. An
      Indonesia.vc profile lists 2.6% monthly installment interest among Kredivo's revenue
      mechanisms, but the profile has no publication date or linked support for the figure; it
      cannot be treated as a verified current price or compared with competitors (CP004). The
      Elevate Pay article makes general statements about promotional periods and competitive
      rates, but it is written by a fintech provider and does not document competitor-specific
      realized pricing (CP012). List price, user-level APR, fees, and partner-funded discounts
      must remain distinct diligence questions. The pricing table preserves the single profile
      assertion with its limitation and marks all unsupported provider cells as unavailable in
      this evidence set rather than filling them by analogy.
    claimRefs:
      - CP004
      - CP012
    tableRefs:
      - TP003
  - id: durability-and-disconfirming-evidence
    title: Distribution is visible; durability is not yet demonstrated
    body: >-
      Kredivo's reported partner network and Krom adjacency could widen distribution and product
      breadth, while GoTo and Sea-linked offerings show that platform reach and external funding
      channels are also available to alternatives (CP002, CP010, CP013). Public evidence here does
      not quantify multi-homing, customer acquisition cost, churn after promotional pricing,
      repeat borrowing, credit performance by channel, or the cost of switching between providers.
      The chapter therefore treats ecosystem breadth as a hypothesis about potential defensibility,
      not a proven moat. Adverse evidence is specific and time-bounded: OJK stated that it lifted
      restrictions on certain BNPL financing activities at PT Akulaku Finance Indonesia on
      5 March 2024 after corrective steps (CP011). That record indicates a past regulatory
      constraint and its removal; it does not establish a current restriction or a present
      compliance failure.
    claimRefs:
      - CP002
      - CP010
      - CP011
      - CP013
