      - [Total capital raised, "Approximately US$500 million", "As stated May 6, 2026", "Company-reported cumulative capital raised; not cash available or a current balance."]
      - [Revenue or revenue run-rate, null, "Not disclosed in assigned sources", "Request consolidated parent financial statements and revenue by business."]
      - [ARR, null, "Not disclosed in assigned sources", "No ARR measure was found; do not treat lending revenue or financing volume as ARR."]
      - [Kredivo Indonesia users, "More than 11 million", "Reported June 17, 2025", "Kompas attributed this to company information; active status, unique-user definition and group scope are unspecified."]
      - [Employees mapped by Dealroom, 653, "Page has no as-of date", "Dealroom's mapped-profile count is not a verified company headcount."]
      - [Cash available, null, "Not disclosed in assigned sources", "Funding raised is not cash on hand; request a dated cash and debt reconciliation."]
    notes: >-
      Values preserve the source's metric labels and periods. Company statements,
      a historical proposed transaction, and third-party profile estimates are
      not interchangeable; null means the assigned current evidence did not
      establish the metric.
    claimRefs: [CO004, CO010, CO014, CO015]
