      - [Umang Rustagi, "Co-founder and President Director, Kredivo Indonesia", "Named on the company profile and in ANTARA's 2025 report.", "Subsidiary authority and reporting line to group leadership require confirmation."]
    notes: >-
      Partial public roster drawn from company and media records; it does not
      enumerate all executives, directors or legal entities.
    enumerationScope:
      coverage: partial
      basis: Publicly named leaders in assigned company pages and reporting; not a complete group roster.
    claimRefs: [CO008, CO011]
