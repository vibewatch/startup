      - [Square Peg Capital, "Named as an existing investor in the 2023 Series D materials and on the company investor list.", "Current stake and liquidation terms are not disclosed.", "Request current cap table and preference stack."]
      - [Jungle Ventures, "Named among investors in the 2023 Series D materials and company investor list.", "Current stake and governance rights are not disclosed.", "Confirm retained ownership and any special rights."]
      - [VPC Impact Acquisition Holdings II, "Counterparty to the 2021 announced SPAC merger proposal.", "The retained sources do not establish closing or resulting economics.", "Confirm whether the proposed transaction was terminated, amended or completed."]
      - [Phoenix Holdings and VinaCapital, "Named by Kredivo as former Timo shareholders retaining a significant minority stake after the announced deal.", "A separate article asserts a 99.99% acquisition; definitive ownership is not verified here.", "Obtain approved closing documents, post-close cap table and board appointment terms."]
    notes: >-
      This is a partial map of parties named in retained sources, not a complete
      cap table. No ownership percentage, control right or cash proceeds are
      inferred where sources do not provide them.
    enumerationScope:
      coverage: partial
      basis: Named investors and transaction parties in the assigned company and reporting sources; not a full cap table.
    claimRefs: [CO004, CO006, CO009, CO010]
