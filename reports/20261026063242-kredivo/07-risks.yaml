company:
  name: Kredivo
chapter:
  number: 7
  title: Risks
  summary: Public evidence identifies credit-loss, acquisition-fraud, regulatory-change, partner-funding, and integration exposures, but does not quantify loss rates, facility utilization, or control effectiveness. The most decision-relevant next steps are to obtain cohort-level credit and fraud data, verify current licensing and compliance status, and test lender and acquisition-channel concentration.
sections:
  - id: credit-and-conduct
    title: Credit, pricing, and conduct exposure
    body: >-
      The clearest directly acknowledged operating risk is repayment: a Kredivo marketing
      executive described approved users who default and said the company uses field
      collections. The interview supplies no delinquency, charge-off, recovery, or vintage
      rates, so it establishes the mechanism of loss rather than its frequency or severity.
      Kredivo's app listing states a maximum APR of 41.51% and installment pricing starting
      at 1.99% per month; these are disclosed terms, not evidence of realized borrower cost
      or misconduct. Request loan-level APR distributions, cohort roll rates, restructurings,
      complaints, and recoveries before concluding whether underwriting and collections
      protect returns or borrowers.
    claimRefs:
      - CR007
      - CR010
      - CR011
  - id: regulatory-and-control-evidence
    title: Regulatory change and control evidence
    body: >-
      In an interview first published in January 2025, a Kredivo executive said Indonesian
      financial institutions had faced many new regulations over the prior two years and
      that the company adapts to each change. This is management's account, not independent
      confirmation of the rules addressed, license scope, examination outcomes, or current
      compliance. The assigned sources do not establish a specific enforcement action or
      security incident; that absence is not evidence that none occurred. The Play listing
      says Kredivo is licensed and regulated by OJK, but this company-submitted statement
      is not a substitute for checking current registrations and the relevant entities'
      obligations. Prioritize an entity-by-entity regulatory and incident review.
    claimRefs:
      - CR006
      - CR016
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: operations-and-expansion
    title: Operational integrity and expansion execution
    body: >-
      The same interview describes install-level fraud across affiliate and advertising
      networks, and says Kredivo uses AppsFlyer tools, tests partner traffic, and stops
      underperforming partners. The executive also attributed roughly 30–40% of user
      acquisition efforts to mobile OEM partnerships. Those are useful descriptions of
      controls and channel mix, but the partner-hosted interview does not independently
      test their efficacy or report fraud losses. Kredivo's company pages report the Timo
      bank acquisition in May 2026 and the GajiGesa acquisition in February 2025; integration
      across products and jurisdictions is therefore a diligence exposure, not a reported
      failure. Validate integration milestones, control ownership, service continuity, and
      post-acquisition risk limits.
    claimRefs:
      - CR008
      - CR009
      - CR012
      - CR013
    tableRefs:
      - TR002
  - id: funding-and-thesis-breaks
    title: Funding dependencies and thesis-break monitoring
    body: >-
      Kontan reports that DBS Indonesia's channeling facility limit rose to IDR 3 trillion
      by the end of 2025; Antara separately reports a BCA Digital channeling partnership
      without a facility amount. Neither disclosure establishes drawn balances, total
      partner funding, or lender concentration. Historical equity announcements—Reuters'
      account of a proposed 2021 SPAC merger, Mizuho's USD 125 million investment, and a
      company-announced approximately USD 270 million Series D in March 2023—demonstrate
      past financing routes, not cash currently available
      or parent runway. Kredivo also reports that Krom had more than one million accounts
      and IDR 10 trillion in deposits as of April 2026; deposits are not parent cash. Treat
      rising credit losses, partner withdrawal, regulatory restrictions, or failed integration
      as thesis-break conditions, and require dated portfolio and liquidity data to set
      measurable thresholds rather than inventing them from public disclosures.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR014
      - CR015
    tableRefs:
      - TR003
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Priority / exposure
      - Evidence and likelihood
      - Potential impact
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - "1. Regulatory change and entity licensing"
        - "Management reported regulatory changes; event likelihood and current status are not independently established."
        - "Potentially high if an entity's authorization or compliance is deficient; no breach is evidenced here."
        - "Management says it adapts to new rules; implementation evidence is not provided."
        - "High uncertainty; verify entity-by-entity OJK permissions, examinations, findings, and remediation."
      - - "2. Consumer pricing and conduct"
        - "The app listing states a maximum APR of 41.51%; actual borrower exposure and complaint frequency are unknown."
        - "Material if pricing, affordability, collections, or disclosures fail applicable requirements."
        - "Pricing terms are disclosed on the listing; borrower-level outcomes and conduct controls are not shown."
        - "Request APR distributions, complaint and collection outcomes, and regulator findings; no misconduct is established."
      - - "3. Cross-border acquisition approvals"
        - "Kredivo reports acquiring Timo in Vietnam; transaction-specific approval and integration conditions are not in the assigned evidence."
        - "Potentially high if approvals, governance, or local controls do not transfer across entities."
        - "The acquisition is reported as completed; post-close control evidence is absent."
        - "Verify approvals, integration sign-offs, and accountable compliance owners in each jurisdiction."
    notes: "Partial register of exposures evidenced in the assigned sources; likelihood and impact are qualitative, not measured incident rates. No row asserts a confirmed breach."
    enumerationScope:
      coverage: partial
      basis: "Selected regulatory and conduct exposures visible in this assigned source pool; not a complete legal or enforcement search."
    claimRefs:
      - CR006
      - CR010
      - CR011
      - CR012
      - CR016
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Priority / failure mode
      - Likelihood evidence
      - Potential severity
      - Mitigation maturity
      - Residual exposure / diligence ask
    rows:
      - - "1. Borrower default and credit loss"
        - "Management acknowledges users defaulting; portfolio frequency and loss rates are not disclosed."
        - "Direct loss of principal and collection expense; magnitude is unquantified."
        - "A field collection team is described by management; effectiveness is unverified."
        - "Obtain vintage-level delinquency, charge-off, recovery, and restructuring data."
      - - "2. Install-level fraud and traffic quality"
        - "Management says fraud occurs in affiliate and advertising networks; incidence is not quantified."
        - "Can waste acquisition spend or introduce poor-quality borrowers."
        - "Management describes AppsFlyer tools, partner testing, and stopping weak channels."
        - "Request fraud-loss rates, channel-level approval and repayment cohorts, and independent control testing."
      - - "3. Acquisition-channel concentration"
        - "Management attributes around 30–40% of acquisition efforts to mobile OEM partnerships."
        - "A channel interruption could reduce eligible-user sourcing; revenue impact is not disclosed."
        - "Partner selection and recurring review are described, but continuity alternatives are not documented."
        - "Verify channel-level spend and originations, contractual termination rights, and replacement capacity."
      - - "4. Data protection and integration execution"
        - "The interview states a security priority; the company also reports acquisitions across banking and earned-wage access."
        - "A control failure could affect users, service continuity, or regulatory standing; no incident is established."
        - "No independent security assurance or post-acquisition control testing appears in the assigned sources."
        - "Review audit reports, incident logs, access controls, migration plans, and integration exceptions."
    notes: "Qualitative prioritization only. Source statements describe risks and asserted controls; no default, fraud, security, or integration rates are available to estimate likelihood."
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR012
      - CR013
      - CR016
  - id: TR003
    title: Partner and capital dependency register
    columns:
      - Dependency
      - Disclosed role / scale
      - Failure scenario
      - Mitigation evidence
      - Residual exposure and diligence path
    rows:
      - - "DBS Indonesia channeling"
        - "Kontan reports a facility limit of IDR 3 trillion by end-2025; limit is not utilization."
        - "Reduced or repriced funding could constrain partner-channelled originations."
        - "The facility expanded over time; no contingency or total-funding denominator is disclosed."
        - "Obtain drawn balances, maturity and termination terms, lender share, and backup capacity."
      - - "BCA Digital channeling"
        - "Antara reports a channeling arrangement targeted at tier 2 and 3 city expansion; amount is not stated."
        - "Partner or program changes could interrupt this source of credit."
        - "The partnership is publicly described; operating and contractual protections are not."
        - "Request facility size, utilization, loss allocation, and concentration across all funding partners."
      - - "Mobile OEM acquisition partners"
        - "A Kredivo executive estimates 30–40% of user acquisition efforts come from OEM partnerships."
        - "Traffic interruption or declining quality could raise acquisition costs or weaken repayment cohorts."
        - "Partner testing, fraud tools, and stopping weak channels are management-described controls."
        - "Validate spend and borrower outcomes by channel and test replacement capacity."
      - - "External equity and current liquidity"
        - "Reuters reported a proposed 2021 SPAC merger; Mizuho announced a USD 125 million investment and Kredivo announced an approximately USD 270 million Series D in 2023."
        - "Historical financing does not establish present parent liquidity, runway, or ability to fund growth."
        - "Past investor participation is documented; current cash and capital commitments are not."
        - "Obtain current parent and subsidiary cash, debt, runway, and financing commitments."
    notes: "Facility amounts are reported limits, not drawn balances. Funding announcements are historical equity transactions, not cash currently available."
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR009
      - CR015
figures:
  - id: FR001
    title: Risk evidence and control-visibility map
    type: matrix
    summary: Public sources identify several risk drivers, but the most important outcome and control measures remain unquantified or company-reported.
    data:
      columns:
        - Exposure
        - Observed risk signal
        - Outcome measure disclosed
        - Control evidence
        - Residual uncertainty
      rows:
        - label: "Borrower credit loss"
          values:
            - "Defaults acknowledged in management interview"
            - "No loss or recovery rate"
            - "Field collections described by management"
            - "High; portfolio performance unquantified"
            - "Evidence limited to a partner-hosted interview"
        - label: "Acquisition integrity"
          values:
            - "Install-level fraud acknowledged"
            - "No fraud incidence or cost"
            - "AppsFlyer and partner screening described by management"
            - "High; efficacy not independently tested"
            - "No channel-level repayment cohorts"
        - label: "Partner funding"
          values:
            - "DBS limit and BCA channel reported"
            - "No utilization or lender-share denominator"
            - "Partnerships are reported; contractual protections are not"
            - "High; concentration unknown"
            - "Facility limits are not drawn balances"
        - label: "Mobile OEM acquisition"
          values:
            - "Management estimates 30–40% of acquisition efforts"
            - "No channel-level loss or interruption data"
            - "Partner testing and channel suspension described"
            - "Medium/high; replacement capacity unknown"
            - "No independent efficacy test"
        - label: "Regulatory change"
          values:
            - "Management reports new rules in prior two years"
            - "No current enforcement record in assigned evidence"
            - "Management says it adapts to rules"
            - "High uncertainty; status unverified"
            - "No entity-level regulator record"
        - label: "Privacy and integration"
          values:
            - "Security priority and acquisitions are company-reported"
            - "No independent audit or incident history in assigned sources"
            - "No independent post-acquisition control testing disclosed"
            - "High; control maturity unverified"
            - "No external assurance evidence"
    claimRefs:
      - CR015
      - CR016
callouts:
  - calloutType: risk
    title: Do not equate facilities with liquidity
    body: DBS and BCA channeling disclosures describe partner facilities, while 2023 equity announcements describe past funding. None establishes current drawn funding, total lender concentration, or parent cash available.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR015
  - calloutType: insight
    title: Loss and control performance remain the key evidence gaps
    body: Management acknowledges borrower defaults and acquisition fraud, but the assigned sources do not quantify their incidence or independently verify the described controls. Request cohort outcomes and assurance evidence before setting numeric risk thresholds.
    claimRefs:
      - CR007
      - CR008
      - CR016
