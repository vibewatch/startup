        - "Kredivo executive statement; no independent validation"
        - "Company-reported use cases include transport, health, and routine shopping"
        - "Survey / transaction basis, time window, user denominator, and repeat use absent"
    notes: >-
      Values are transcribed with their original metric names and periods. These
      observations have different populations and are not a time series; blanks
      in the source are treated as missing evidence rather than zero.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named entity / channel
      - Segment and use case
      - Evidence status
      - Reported outcome
      - Limitation
    rows:
      - - "Tokopedia and Shopee"
        - "E-commerce merchant channels for Kredivo credit"
        - "Multiples.vc names the platforms; Reuters separately reported broad top-merchant coverage in 2021"
        - "Public evidence supports channel reach, not user-level deployment outcomes"
        - "Current availability and merchant-level volume are not independently verified"
      - - "Transjakarta"
        - "Urban transit payments through the Transjakarta app"
        - "Company milestone and November 2025 coverage describe a PayLater partnership"
        - "Kredivo is described as a payment option; no attributable ride or repeat-use outcome is reported"
        - "Announcement and partner-sourced claims do not establish sustained adoption"
      - - "Krom Bank Indonesia"
        - "Digital-bank account and deposit services; related subsidiary, not a third-party Kredivo customer"
        - "Jakarta Post reported the app launch; the company homepage later displayed an account / deposit milestone"
        - "Reported 1 million accounts and Rp10 trillion in deposits"
        - "The homepage does not state the metric date, active-account definition, or economics"
    notes: >-
      Sample of named customer-facing channels and group products found in the
      assigned evidence pool, not an exhaustive customer list. Named availability
      and partnership announcements are not equivalent to independently verified
      production volumes, customer outcomes, or retention.
    enumerationScope:
      coverage: sample
      basis: "Sample of named customer-facing channels and group products in assigned public sources; not an exhaustive customer list."
    claimRefs: [CU002, CU004, CU005, CU006, CU014]
figures:
  - id: FU001
    title: Documented Kredivo customer journey and evidence gaps
    type: journey-map
    summary: Public materials describe eligibility, credit decisioning, merchant use, and repayment options, but do not disclose the conversion or retention between stages.
    data:
      items:
        - label: "Eligibility and application"
          detail: "PayAtlas lists Indonesian residency, age 18–60, and minimum monthly income of IDR 3 million; the profile is undated."
          touchpoints:
            - "Application requirements are publisher-reported, not an independently tested approval policy."
        - label: "Credit decision"
          detail: "Kredivo descriptions refer to real-time credit decisioning; public evidence does not give current approval or funded-loan rates."
          touchpoints:
            - "No current application-to-approval cohort is disclosed."
        - label: "Merchant selection"
          detail: "Multiples.vc names Tokopedia and Shopee as e-commerce platforms using Kredivo."
          touchpoints:
            - "Merchant names in a profile do not show current volume or repeat use."
        - label: "Purchase"
          detail: "Kredivo is described for online and offline purchases, including e-commerce and transit channels."
          touchpoints:
            - "Merchant coverage does not establish transaction frequency or active-user status."
        - label: "Payment confirmation"
          detail: "Antom's integration documentation says buyers manually return to the merchant app after payment."
          touchpoints:
            - "This limitation is specific to the documented integration flow."
        - label: "Repayment and repeat use"
          detail: "Antom documentation lists a manual return to the merchant app and no chargeback / dispute support for that integration."
          touchpoints:
            - "The documentation describes one integration flow, not a company-wide failure."
            - "Current repeat purchase, retention, and cohort expansion are not disclosed."
    claimRefs: [CU003, CU013, CU014]
