company:
  name: Kredivo
chapter:
  number: 6
  title: Customers
  summary: Public evidence confirms several customer-facing products and channel deployments, but reported adoption metrics use different populations and periods. Current Kredivo active-user, retention, and concentration data remain undisclosed in the reviewed evidence.
sections:
  - id: customer-segments
    title: Customer segments and product boundaries
    body: >-
      Kredivo Group serves several distinct customer populations through the
      Kredivo credit product, KrediFazz lending, and Krom Bank; these should not
      be collapsed into a single customer count. The Jakarta Post describes
      Kredivo as BNPL, KrediFazz as a P2P lending platform, and Krom as a digital
      bank. A third-party payment profile says Kredivo is used for online and
      offline purchases and lists an Indonesian consumer base, but gives no
      publication date or methodology. Its approximately five-million-user
      figure is therefore an undated publisher claim, not a current active-user
      measure. The same profile distinguishes nationwide Basic and Starter
      availability from Premium service in selected regions. Krom's reported
      accounts and deposits belong to a bank subsidiary and are not Kredivo BNPL
      borrowers or parent-company revenue. The segmentation table keeps these
      populations separate and makes the missing denominators explicit.
    claimRefs: [CU001, CU003, CU004, CU011, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-metrics
    title: Adoption signals are not a current active-customer series
    body: >-
      The public adoption record is a set of dated, non-comparable indicators.
      Multiples.vc describes nearly two million consumers as credit-scored by
      July 2018; this is not a count of active borrowers. Reuters reported
      nearly four million approved customers in 2021 and presence across eight
      of Indonesia's top ten e-commerce merchants, but approved customers and
      merchant coverage do not establish utilization or repeat purchase.
      Multiples.vc also says the group processed more than USD 2 billion in
      transactions in 2022; transaction volume is not revenue. A 2025 AVOW
      partner case study reports an install-to-loan-application rate and
      year-over-year spending growth, but omits the absolute cohort, baseline,
      and funded-loan conversion. Kredivo's own homepage carries a Krom account
      and deposit milestone without an as-of date. These figures show reported
      reach and channel activity, not a continuous, independently verified
      customer growth or retention curve.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
  - id: proof-and-durability
    title: Named deployments show reach, not customer durability
    body: >-
      Named evidence is stronger for product availability and partnerships
      than for independently verified customer outcomes. The company lists
      Transjakarta among its PayLater partnerships, and a November 2025 Tempo
      article describes Kredivo as a payment method in the transit app; neither
      source reports Kredivo-attributable ride volume, repeat use, or revenue.
      Tempo also quotes a Kredivo executive saying 42 percent of users use
      PayLater for productive needs, without a sampling method or denominator.
      AVOW's case study is a partner-authored account of acquisition performance,
      not an independent benchmark or a retention cohort. The integration
      documentation from Antom identifies a narrower checkout friction: its
      flow does not support chargebacks or disputes and requires a manual return
      to the merchant app after payment. This is a specific integration
      limitation, not evidence of a company-wide incident. The sample of named
      deployments is incomplete; public sources reviewed do not provide current
      NRR, GRR, churn, renewal, cohort retention, or top-customer concentration.
    claimRefs: [CU002, CU009, CU010, CU013, CU014, CU015]
    tableRefs: [TU003]
