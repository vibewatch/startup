        - "Merchant names, transaction share, and current coverage not supplied"
      - - "Transactions processed"
        - "More than USD 2 billion"
        - "2022"
        - "Multiples.vc; low confidence"
        - "Historical gross transaction activity"
        - "Not revenue; source does not define transaction scope or calculation"
