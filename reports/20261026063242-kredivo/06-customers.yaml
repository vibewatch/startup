      - Reported scale or value
      - Diligence gap
    rows:
      - - "Kredivo BNPL consumers"
        - "Individuals are the users and repayment obligors"
        - "Credit for online and offline purchases; company and third-party profiles describe e-commerce and merchant use"
        - "PayAtlas states approximately 5 million Indonesian users, but supplies no date or measurement method"
        - "Confirm current active users, funded accounts, frequency, and geographic mix"
      - - "Krom Bank deposit-account holders"
        - "Bank customers and depositors; distinct from Kredivo BNPL borrowers"
        - "Digital banking app launched by group subsidiary PT Krom Bank Indonesia"
        - "Kredivo's homepage reports 1 million accounts and Rp10 trillion in deposits, with no as-of date"
        - "Verify active accounts, balance distribution, cohort retention, and subsidiary economics"
      - - "Kredivo credit applicants"
        - "Applicants are prospective users; approved customers are not necessarily active borrowers"
        - "PayAtlas lists Basic / Starter and Premium service availability across different geographies"
        - "Reuters reported nearly 4 million approved customers in 2021; this is historical"
        - "Request current application, approval, activation, and funded-loan conversion by cohort"
      - - "Urban transit users"
        - "Transjakarta app users can select Kredivo PayLater as a payment method"
        - "Company and press coverage describe a PayLater partnership for transit payments"
        - "No Kredivo-specific trip, transaction, or repeat-use count is disclosed"
        - "Request partner-level transaction share, repeat use, and unit economics"
    notes: >-
      The sources mix company claims, a dated news report, and undated third-party
      profiles. User, approved-customer, account, deposit, and transaction measures
      are not interchangeable; subsidiary bank metrics are not parent BNPL metrics.
    claimRefs: [CU001, CU002, CU003, CU005, CU011, CU012, CU013, CU014]
