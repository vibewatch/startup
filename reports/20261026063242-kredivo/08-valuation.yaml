company:
  name: Kredivo
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports strategic relevance and access to partner financing, but the visible valuation anchors are a 2021 proposed SPAC transaction and dated or non-priced private-market records. With no current parent-level financials, transaction price, or investor economics in the assigned evidence, the appropriate stance is research-more rather than a numeric fair value or buy recommendation.
sections:
  - id: public-price-evidence
    title: Public price evidence is historical, not an entry mark
    body: >-
      Reuters reported in August 2021 that FinAccel had agreed to a SPAC merger valuing
      Kredivo's parent at about $2.5 billion; the contemporaneous article described a
      proposed transaction, not a current financing mark or a valuation that an investor
      can transact at today (CV001). The article's $430 million gross proceeds, including
      a $120 million PIPE, are transaction financing figures and should not be mistaken
      for enterprise value, equity value, proceeds available to the parent today, or
      cash on hand (CV002). The company later announced a roughly $270 million Series D
      equity round led by Mizuho in March 2023, but the retained announcement does not
      establish a post-money valuation (CV003). In January 2026, DBS announced a
      channeling-financing limit for Kredivo of IDR 3 trillion (CV004); this is a credit
      facility limit, not an equity price or unrestricted parent cash (CV005). The
      historical SPAC headline therefore cannot anchor a present-day return calculation.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV002]
  - id: operating-upside-and-downside
    title: Strategic optionality is real, but scenario valuation is not
    body: >-
      Kredivo's own milestone page records the Mizuho-led Series D and a 2026 Timo
      acquisition, while independent Vietnamese reporting says the acquisition value
      remained undisclosed (CV003, CV006). DBS's expanded channeling line and the
      Timo transaction provide plausible routes to broader credit distribution and
      banking integration, but the assigned sources do not quantify parent-level
      revenue, loss-adjusted earnings, funding costs, or integration returns. A
      scenario framework can identify the evidence that would move the investment
      case; it cannot responsibly translate those strategic possibilities into a
      numeric valuation range or probability. Downside is not abstract: Fintech News
      Indonesia reports new OJK borrower eligibility and repayment-capacity limits,
      alongside sector non-performing financing of 3.44% in May 2026 versus 2.99% in
      April (CV007, CV008). Those figures concern the Indonesian paylater sector, not
      Kredivo's own portfolio, so they are a risk context rather than a company loss
      forecast.
    claimRefs: [CV003, CV006, CV007, CV008, CV014]
    tableRefs: [TV003]
  - id: decision-and-diligence
    title: Research-more until price and unit economics are disclosed
    body: >-
      The private-market evidence does not close the pricing gap. Forge's profile,
      last updated January 22, 2025, shows Kredivo's post-money valuation as not
      available and cautions that its private-company data may rely on limited inputs
      and is not necessarily a market price (CV009). EquityZen explains how existing
      shareholders may offer private-company shares through its funds, but the retained
      Kredivo page gives no executable price, share class, or transaction terms (CV010).
      These dated and non-priced records do not establish a current valuation; the
      retained evidence also contains no completed exit or current executed secondary
      trade (CV011, CV015). Accordingly, use research-more, low confidence, high risk,
      and an unknown valuation stance rather than issuing a buy or manufacturing a
      target price (CV012, CV013). Revisit only after obtaining current parent
      financials and cohort loss data, the fully diluted capitalization and preference
      waterfall, and a dated transaction or independently supported comparable set.
      An observable price should then be tested against earnings after credit losses,
      capital needs, dilution, and downside under the applicable OJK rules.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Current assessment, Evidence boundary, Decision implication]
    rows:
      - ["Recommendation", "Research-more; do not buy on this evidence", "No current transaction price or current parent-level financial and credit-cohort data in the assigned evidence", "Reassess after private-data and price diligence"]
      - ["Confidence", "Low", "Historical price disclosures and undated or non-priced marketplace records do not establish a current entry mark", "No target return can be calculated"]
      - ["Risk rating", "High", "BNPL sector rules and rising sector NPF create downside exposure, but company-specific loss sensitivity is not disclosed here", "Stress portfolio quality, funding, and compliance before underwriting"]
      - ["Valuation stance", "Unknown", "The 2021 SPAC headline is not a current comparable or executable price", "Require a dated, attributable price and capitalization basis"]
      - ["Entry discipline", "No numeric ceiling supportable", "Parent earnings, dilution, preference waterfall, and exit assumptions are missing", "Do not infer cash available from channeling limits or funding raised"]
    notes: "Assessment is an evidence-bounded analyst judgment; no target price, return, or calibrated probability is available from these sources."
    claimRefs: [CV001, CV004, CV005, CV007, CV009, CV011, CV012, CV013]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Thesis: partner financing and banking expansion may extend distribution and product options", "DBS announced an IDR 3 trillion channeling limit; Kredivo records the Timo acquisition and a Mizuho-led Series D", "Evidence of parent-level incremental earnings after credit losses, funding costs, and integration expense"]
      - ["Anti-thesis: historical financing and a proposed SPAC price do not prove current equity value", "The approximately $2.5 billion figure relates to a 2021 proposed transaction; the facility is credit financing, not equity", "A dated current round or secondary transaction with share class, dilution, and preference terms"]
      - ["Anti-thesis: regulatory and portfolio risks could compress growth or returns", "OJK limits and sector NPF trends are adverse industry context, not Kredivo-specific portfolio performance", "Company-level cohort vintages, delinquency and loss curves, funding costs, and compliance impact"]
      - ["Evidence gap: no like-for-like valuation benchmark is retained", "Forge reports no post-money figure in its January 2025 profile; the retained marketplace page shows no executable Kredivo price", "Comparable companies or transactions matched for geography, lending model, growth, profitability, credit risk, and date"]
    notes: "Company and partner announcements establish their stated events, not independently verified unit economics; sector metrics are not Kredivo-specific."
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV014]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns: [Case, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull", "The expanded DBS facility and Timo integration support profitable incremental lending and banking products without a material deterioration in credit quality", "Potential upside is conditional, but a numeric valuation range or return is not calculable without current earnings, capital needs, and entry price", "Contingent upside; no calibrated probability", "Integration costs or credit losses consume the incremental contribution"]
      - ["Base", "Partner funding remains available and integration proceeds, while parent-level profitability and cohort performance remain unverified", "No defensible fair-value range; require a dated price and loss-adjusted earnings basis before estimating return", "Working diligence case only; probability not estimated", "Parent economics fail to demonstrate returns above capital and funding costs"]
      - ["Bear", "OJK constraints and worsening sector credit quality weigh on eligible originations or repayment capacity, while Kredivo-specific losses or funding costs rise", "Material downside is plausible, but neither a numeric downside range nor probability is supported by the assigned evidence", "Downside signal elevated by sector context; not a company forecast", "Kredivo cohorts deteriorate, funding tightens, or compliance limits growth"]
    notes: "These are conditional scenarios, not forecasts. The source set provides no current valuation inputs, company-level credit-loss series, or defensible probability estimates; numeric ranges are intentionally omitted."
    claimRefs: [CV004, CV006, CV007, CV008, CV012, CV014]
