  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Credit, pricing, and conduct exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest directly acknowledged operating risk is repayment: a Kredivo marketing executive described
              approved users who default and said the company uses field collections. The interview supplies no
              delinquency, charge-off, recovery, or vintage rates, so it establishes the mechanism of loss rather than
              its frequency or severity. Kredivo's app listing states a maximum APR of 41.51% and installment pricing
              starting at 1.99% per month; these are disclosed terms, not evidence of realized borrower cost or
              misconduct. Request loan-level APR distributions, cohort roll rates, restructurings, complaints, and
              recoveries before concluding whether underwriting and collections protect returns or borrowers.
            claimRefs:
              - CR007
              - CR010
              - CR011
      - number: '7.2'
        title: Regulatory change and control evidence
        blocks:
          - type: paragraph
            body: >-
              In an interview first published in January 2025, a Kredivo executive said Indonesian financial
              institutions had faced many new regulations over the prior two years and that the company adapts to each
              change. This is management's account, not independent confirmation of the rules addressed, license scope,
              examination outcomes, or current compliance. The assigned sources do not establish a specific enforcement
              action or security incident; that absence is not evidence that none occurred. The Play listing says
              Kredivo is licensed and regulated by OJK, but this company-submitted statement is not a substitute for
              checking current registrations and the relevant entities' obligations. Prioritize an entity-by-entity
              regulatory and incident review.
            claimRefs:
              - CR006
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR012
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR015
              - CR016
      - number: '7.3'
        title: Operational integrity and expansion execution
        blocks:
          - type: paragraph
            body: >-
              The same interview describes install-level fraud across affiliate and advertising networks, and says
              Kredivo uses AppsFlyer tools, tests partner traffic, and stops underperforming partners. The executive
              also attributed roughly 30–40% of user acquisition efforts to mobile OEM partnerships. Those are useful
              descriptions of controls and channel mix, but the partner-hosted interview does not independently test
              their efficacy or report fraud losses. Kredivo's company pages report the Timo bank acquisition in May
              2026 and the GajiGesa acquisition in February 2025; integration across products and jurisdictions is
              therefore a diligence exposure, not a reported failure. Validate integration milestones, control
              ownership, service continuity, and post-acquisition risk limits.
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Funding dependencies and thesis-break monitoring
        blocks:
          - type: paragraph
            body: >-
              Kontan reports that DBS Indonesia's channeling facility limit rose to IDR 3 trillion by the end of 2025;
              Antara separately reports a BCA Digital channeling partnership without a facility amount. Neither
              disclosure establishes drawn balances, total partner funding, or lender concentration. Historical equity
              announcements—Reuters' account of a proposed 2021 SPAC merger, Mizuho's USD 125 million investment, and a
              company-announced approximately USD 270 million Series D in March 2023—demonstrate past financing routes,
              not cash currently available or parent runway. Kredivo also reports that Krom had more than one million
              accounts and IDR 10 trillion in deposits as of April 2026; deposits are not parent cash. Treat rising
              credit losses, partner withdrawal, regulatory restrictions, or failed integration as thesis-break
              conditions, and require dated portfolio and liquidity data to set measurable thresholds rather than
              inventing them from public disclosures.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate facilities with liquidity
            body: >-
              DBS and BCA channeling disclosures describe partner facilities, while 2023 equity announcements describe
              past funding. None establishes current drawn funding, total lender concentration, or parent cash
              available.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR015
          - type: callout
            title: Loss and control performance remain the key evidence gaps
            body: >-
              Management acknowledges borrower defaults and acquisition fraud, but the assigned sources do not quantify
              their incidence or independently verify the described controls. Request cohort outcomes and assurance
              evidence before setting numeric risk thresholds.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public price evidence is historical, not an entry mark
        blocks:
          - type: paragraph
            body: >-
              Reuters reported in August 2021 that FinAccel had agreed to a SPAC merger valuing Kredivo's parent at
              about $2.5 billion; the contemporaneous article described a proposed transaction, not a current financing
              mark or a valuation that an investor can transact at today (CV001). The article's $430 million gross
              proceeds, including a $120 million PIPE, are transaction financing figures and should not be mistaken for
              enterprise value, equity value, proceeds available to the parent today, or cash on hand (CV002). The
              company later announced a roughly $270 million Series D equity round led by Mizuho in March 2023, but the
              retained announcement does not establish a post-money valuation (CV003). In January 2026, DBS announced a
              channeling-financing limit for Kredivo of IDR 3 trillion (CV004); this is a credit facility limit, not an
              equity price or unrestricted parent cash (CV005). The historical SPAC headline therefore cannot anchor a
              present-day return calculation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.2'
        title: Strategic optionality is real, but scenario valuation is not
        blocks:
          - type: paragraph
            body: >-
              Kredivo's own milestone page records the Mizuho-led Series D and a 2026 Timo acquisition, while
              independent Vietnamese reporting says the acquisition value remained undisclosed (CV003, CV006). DBS's
              expanded channeling line and the Timo transaction provide plausible routes to broader credit distribution
              and banking integration, but the assigned sources do not quantify parent-level revenue, loss-adjusted
              earnings, funding costs, or integration returns. A scenario framework can identify the evidence that would
              move the investment case; it cannot responsibly translate those strategic possibilities into a numeric
              valuation range or probability. Downside is not abstract: Fintech News Indonesia reports new OJK borrower
              eligibility and repayment-capacity limits, alongside sector non-performing financing of 3.44% in May 2026
              versus 2.99% in April (CV007, CV008). Those figures concern the Indonesian paylater sector, not Kredivo's
              own portfolio, so they are a risk context rather than a company loss forecast.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
      - number: '8.3'
        title: Research-more until price and unit economics are disclosed
        blocks:
          - type: paragraph
            body: >-
              The private-market evidence does not close the pricing gap. Forge's profile, last updated January 22,
              2025, shows Kredivo's post-money valuation as not available and cautions that its private-company data may
              rely on limited inputs and is not necessarily a market price (CV009). EquityZen explains how existing
              shareholders may offer private-company shares through its funds, but the retained Kredivo page gives no
              executable price, share class, or transaction terms (CV010). These dated and non-priced records do not
              establish a current valuation; the retained evidence also contains no completed exit or current executed
              secondary trade (CV011, CV015). Accordingly, use research-more, low confidence, high risk, and an unknown
              valuation stance rather than issuing a buy or manufacturing a target price (CV012, CV013). Revisit only
              after obtaining current parent financials and cohort loss data, the fully diluted capitalization and
              preference waterfall, and a dated transaction or independently supported comparable set. An observable
              price should then be tested against earnings after credit losses, capital needs, dilution, and downside
              under the applicable OJK rules.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
