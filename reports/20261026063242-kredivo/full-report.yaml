  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and addressable product
        blocks:
          - type: paragraph
            body: >-
              The narrowest defensible core is digital consumer credit used for purchases in Indonesia: BNPL at
              ecommerce and offline merchants. Reuters’ 2021 report and a 2023 transaction release described ecommerce
              and offline purchase financing alongside personal loans; the latter also described cards and the planned
              Krom bank. Those are product-scope statements, not independently measured market shares or proof that
              every product belongs in one spend pool (CM001, CM002). Keep personal loans adjacent to checkout BNPL
              because the repayment purpose and transaction unit differ; keep deposits and banking outside the BNPL
              denominator. Kredivo’s milestone page shows channeling facilities and merchant/transport partnerships,
              which indicate routes to distribution and credit supply, not consumer spend (CM014). The company’s “market
              leader” wording remains a company assertion rather than a benchmark (CM003). A buyer map therefore
              distinguishes household borrowers from merchant acceptance and from the separate bank/deposit
              relationship; available sources do not disclose the budget owner or economics of each transaction.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: What the available sizing lenses do—and do not—measure
        blocks:
          - type: paragraph
            body: >-
              None of the retained sources supplies an inclusive, comparable Indonesia BNPL spend denominator, a
              segment-level SAM, or a Kredivo obtainable-share calculation with a defined population, unit and method.
              The usable quantities are narrower proxies: figures Kredivo attributes to its own social-impact report, an
              OJK-reported BNPL financing total for finance companies, an OJK-reported sector non-performing financing
              rate, and historical company footprint figures in Reuters reporting. They have different denominators and
              periods, so they cannot be added or converted into a market-size estimate (CM006, CM007, CM008, CM009,
              CM012, CM015). Kontan reports OJK data showing Rp 11.24 trillion of BNPL financing by finance companies in
              November 2025, up 68.61% year over year; that channel-specific figure is not an all-provider spend measure
              or Kredivo share (CM015). In the company-reported 2025 usage mix, 54% of Kredivo credit disbursed was used
              for productive needs; the same article reports a fifteenfold increase since 2019 in users accessing credit
              as business capital. Neither is industry-wide growth, and the underlying counts and loan values are not
              supplied in the article (CM006, CM009). Dealroom’s mapped-employee figure is an operator profile measure,
              not a demand or spending measure (CM013). The sizing exhibit preserves these distinctions rather than
              implying a forecast or market share.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM013
              - CM015
      - number: '2.3'
        title: Buyer pathways, adoption signals and constraints
        blocks:
          - type: paragraph
            body: >-
              The direct user and repayment obligation for consumer credit sit with the borrower; merchant checkout is a
              distribution and acceptance point for BNPL, while a bank account or deposit relationship is a distinct
              banking use case. This is an analytical segmentation, not a source-disclosed contract map. Kredivo’s 2021
              SPAC announcement, as reported by Reuters, gave nearly four million approved customers and presence across
              eight of Indonesia’s top ten ecommerce merchants at that historical date; these are not current metrics
              and do not establish active borrowers or current merchant coverage (CM004). For 2025, Kredivo’s report as
              described by Jawawa says 54% of its disbursed credit went to productive needs, and its first-time-credit
              and business-capital figures suggest use beyond checkout, but they are company-specific (CM006, CM007,
              CM009). Constraints are material: Fintech News Indonesia reports OJK eligibility, income-verification and
              exposure rules taking effect in July 2026, alongside a sector NPF rate of 3.44% in May 2026 versus 2.99%
              in April (CM010, CM011, CM012). The rules can constrain eligible borrowers and repayment capacity; whether
              they change Kredivo’s approval, loss or unit economics is not quantified here.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive perimeter and identified alternatives
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies competition across standalone BNPL, marketplace-embedded pay-later, and
              broader app-based financial ecosystems rather than a single like-for-like lender set. Kredivo's own
              materials describe BNPL and personal loans, while an independent 2021 Reuters report also described
              e-commerce and offline credit; both are evidence of product scope, not current market share (CP001). A
              2025 Elevate Pay overview names Akulaku, Atome, GoPayLater, Indodana, Shopee PayLater, Julo, and Cicil,
              but that comparison is competitor-authored and supplies no independently verified ranking or consistent
              scale data (CP009, CP011, CP012). It is therefore a discovery map, not a market census. The profile table
              separates current-period GoTo disclosure from older or less-verifiable competitor descriptions and
              explicitly leaves missing scale fields open.
            claimRefs:
              - CP001
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: Distribution and adjacent financial products
        blocks:
          - type: paragraph
            body: >-
              Kredivo's public milestones describe partner-led reach across retail, transport, merchant, and bank
              channels, alongside a Krom digital-banking launch in February 2024 (CP002, CP013). These disclosures
              suggest more potential routes to customers and funding than a checkout-only BNPL product, but they do not
              establish active usage, economics, exclusivity, or durable customer lock-in. GoTo offers a relevant
              ecosystem comparison: its company-reported first quarter 2026 fintech metrics include a Rp9.893 trillion
              loan book, Rp1.909 trillion of segment net revenue, and 27.5 million fintech monthly transacting users,
              with the GoPay app identified as a driver of loan-book growth (CP005–CP008). These are GoTo segment
              figures, not GoPayLater-only metrics. Detik's July 2024 report described a BNI plan to channel financing
              for Shopee PayLater and integrate credit scoring; it documents a proposed distribution arrangement, not
              proof that it was completed (CP010).
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Pricing and packaging remain non-comparable
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a same-date, provider-by-provider schedule of realized rates, fees,
              promotional periods, credit limits, repayment terms, or merchant economics. An Indonesia.vc profile lists
              2.6% monthly installment interest among Kredivo's revenue mechanisms, but the profile has no publication
              date or linked support for the figure; it cannot be treated as a verified current price or compared with
              competitors (CP004). The Elevate Pay article makes general statements about promotional periods and
              competitive rates, but it is written by a fintech provider and does not document competitor-specific
              realized pricing (CP012). List price, user-level APR, fees, and partner-funded discounts must remain
              distinct diligence questions. The pricing table preserves the single profile assertion with its limitation
              and marks all unsupported provider cells as unavailable in this evidence set rather than filling them by
              analogy.
            claimRefs:
              - CP004
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP012
      - number: '3.4'
        title: Distribution is visible; durability is not yet demonstrated
        blocks:
          - type: paragraph
            body: >-
              Kredivo's reported partner network and Krom adjacency could widen distribution and product breadth, while
              GoTo and Sea-linked offerings show that platform reach and external funding channels are also available to
              alternatives (CP002, CP010, CP013). Public evidence here does not quantify multi-homing, customer
              acquisition cost, churn after promotional pricing, repeat borrowing, credit performance by channel, or the
              cost of switching between providers. The chapter therefore treats ecosystem breadth as a hypothesis about
              potential defensibility, not a proven moat. Adverse evidence is specific and time-bounded: OJK stated that
              it lifted restrictions on certain BNPL financing activities at PT Akulaku Finance Indonesia on 5 March
              2024 after corrective steps (CP011). That record indicates a past regulatory constraint and its removal;
              it does not establish a current restriction or a present compliance failure.
            claimRefs:
              - CP002
              - CP010
              - CP011
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner reach is not proof of lock-in
            body: >-
              Public materials identify product breadth and distribution relationships, but the assigned sources do not
              quantify multi-homing, switching costs, cohort retention, or channel-level credit performance.
            calloutType: risk
            claimRefs:
              - CP002
              - CP007
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and observable monetization
        blocks:
          - type: paragraph
            body: >-
              Fintech News Indonesia describes Kredivo as a BNPL provider, while TechCrunch's 2023 coverage listed
              online and offline BNPL, personal loans, physical and virtual cards, and banking services through Krom
              (CI001, CI002). Kredivo's CEO also told TechCrunch that the company drove 3% to 4% of total GMV for its
              top Indonesian e-commerce merchants, versus 15% to 20% for credit cards (CI016). That dated merchant-level
              proxy indicates distribution presence, not customer-level conversion, acquisition efficiency, current
              scale, or realized revenue. These descriptions establish a lending and digital-banking perimeter, not the
              revenue mix. The assigned public sources do not quantify realized interest, merchant fees, customer
              pricing, revenue recognition, or the share of economics earned by the parent versus its operating
              entities. List pricing and product availability should not be treated as realized revenue or margin. The
              revenue-stream table therefore separates disclosed products from missing commercial terms, and leaves unit
              values unquantified pending contracts and audited financial statements.
            claimRefs:
              - CI001
              - CI002
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
      - number: '4.2'
        title: Channel facilities and historical capital
        blocks:
          - type: paragraph
            body: >-
              The clearest current-scale financial signal in the pool is a DBS Indonesia channeling limit reported at
              IDR 3 trillion at the start of 2026; Kontan describes the facility increasing from IDR 300 billion in 2020
              through IDR 500 billion, IDR 1 trillion in 2021, IDR 2 trillion in 2022, and IDR 3 trillion by end-2025
              (CI003, CI004). Kredivo's milestones also list historical Hana and Shinhan channeling limits, while ANTARA
              reports a BCA Digital channeling arrangement without stating its amount (CI005, CI006). These are
              financing capacity or partnership announcements, not evidence of cash on hand, drawn balances, or
              available parent liquidity. The DBS and BCA announcements associate expansion with tier 2 and 3 cities,
              but the sources do not disclose allocation, tenor, pricing, covenants, recourse, or realized returns.

              Historical capital reporting is similarly non-comparable. TechCrunch reported a roughly US$270 million
              Series D, about US$400 million total equity raised, and almost US$1 billion in committed debt facilities
              in 2023 (CI007-CI009). Reuters described a proposed 2021 SPAC at an expected approximately US$2.5 billion
              equity value and more than US$430 million gross proceeds; the proposed transaction was later abandoned,
              and these figures do not represent current valuation or cash (CI010-CI012). Tracxn's fetched company
              profile separately reports US$660 million total funding and a US$1.6 billion valuation, without enough
              definition or current-date evidence to reconcile those figures to reported equity raised or a present
              valuation (CI013, CI014). The capital table preserves each source's label and vintage rather than
              combining unlike amounts.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
              - CI009
      - number: '4.3'
        title: Unit economics, capital adequacy, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The source pool supports a lending model and bank funding channels, but not an underwritable
              unit-economics bridge. It contains no current company revenue or ARR, realized price or fee take, customer
              acquisition cost, payback period, gross margin, funding cost, cohort loss rate, or parent-level cash,
              burn, and runway. Those are evidence gaps, not zeroes. The conceptual flow figure marks which lending
              inputs are reported and which conversion steps remain unmeasured; it is not a forecast or a claim that
              every product uses identical funding or revenue mechanics.

              Regulation is a relevant underwriting constraint: Fintech News Indonesia reports new OJK eligibility and
              debt-service limits, including a 40% cap on total BNPL payments relative to monthly income for 2027-2028
              and 30% from 2029 (CI015). The report is secondary coverage of a circular, so legal interpretation should
              be checked against the original instrument. No source in this pool establishes Kredivo-specific default
              performance under the new limits. Before underwriting, request audited parent and subsidiary accounts,
              facility agreements and draw schedules, monthly receivable and delinquency cohorts by product and channel,
              realized pricing and fee waterfalls, acquisition and collection costs, and a consolidated cash/debt
              maturity schedule.
            claimRefs:
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding capacity is not liquidity
            body: >-
              The reported DBS channeling limit and historical equity or debt figures cannot establish cash on hand,
              undrawn availability, or parent-level runway. Facility utilization, obligations, and consolidated
              liquidity remain material underwriting gaps.
            calloutType: risk
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kredivo's core proposition is point-of-sale credit: KrASIA described shoppers applying at online checkout
              and repaying over time, while Reuters reported in 2021 that Kredivo offered instant financing for online
              and offline purchases as well as personal loans based on AI-enabled real-time decisioning. Both are
              historical descriptions; this pool does not verify present availability, approval times, or performance.
              The portfolio has expanded beyond checkout credit: the official timeline records Krom digital banking's
              2024 launch, GajiGesa's 2025 acquisition as an entry into earned-wage access, and Timo's 2026 acquisition.
              TechCrunch reported physical and virtual card products in 2023. These milestones map product scope, not
              present-day active availability, usage, or integration across brands.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE007
      - number: '5.2'
        title: What the public technology record supports
        blocks:
          - type: paragraph
            body: >-
              The clearest technology signals are a historical CEO description of AI-powered credit scoring and fraud
              detection, TechCrunch's 2023 account of using telco, e-commerce, and bank-account data to assess
              creditworthiness, and a Kredivo backend-engineering listing that names development, testing, deployment,
              databases, and several technologies as candidate skills. The hiring listing is evidence of requested
              competencies, not proof those tools are deployed in production. Together these disclosures suggest a
              data-led credit workflow, but the assigned evidence does not specify model design, data lineage or
              permissions, service topology, APIs, model validation, or current engineering ownership. The accompanying
              stack graphic groups disclosed functions for diligence; it is not a verified system diagram or a sequence
              of technical layers.
            claimRefs:
              - CE002
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Product maturity, differentiation, and operating proof
        blocks:
          - type: paragraph
            body: >-
              Publicly described differentiation centers on rapid digital credit decisions and access through online and
              offline commerce, with adjacent banking and wage-access capabilities broadening the product surface. The
              evidence is uneven by maturity: the company records Krom's launch, while GajiGesa and Timo are described
              as acquisitions or market-entry moves without detailed integration, usage, or service-level evidence in
              this pool. KrASIA's checkout account is historical, and TechCrunch's product and data descriptions date to
              2023. No assigned source supplies a current integration catalog, independently measured customer benefit,
              reliability or support metrics, certification, security testing, or evidence that these products share a
              unified technical platform. Those gaps constrain any claim that portfolio breadth has translated into a
              differentiated or dependable operating system.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE015
      - number: '5.4'
        title: Trust, safety, and regulatory constraints
        blocks:
          - type: paragraph
            body: >-
              Indonesia's OJK framework limits BNPL provision to commercial banks and financing companies and sets
              expectations for electronic systems, prudent conduct, consumer disclosures, and debtor-data protection. A
              2026 legal analysis describes more specific financing-company requirements, including age and income
              eligibility and repayment-capacity limits; Fintech News Indonesia separately reports the 40% income
              ceiling for 2027–2028 and 30% from 2029. The same outlet reports industry-wide BNPL non-performing
              financing of 3.44% in May 2026, versus 2.99% in April, which is a sector indicator rather than a Kredivo
              loss or delinquency measure. The materials establish the relevant control environment, not Kredivo's
              compliance implementation, underwriting outcomes, security posture, or incident history.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and product boundaries
        blocks:
          - type: paragraph
            body: >-
              Kredivo Group serves several distinct customer populations through the Kredivo credit product, KrediFazz
              lending, and Krom Bank; these should not be collapsed into a single customer count. The Jakarta Post
              describes Kredivo as BNPL, KrediFazz as a P2P lending platform, and Krom as a digital bank. A third-party
              payment profile says Kredivo is used for online and offline purchases and lists an Indonesian consumer
              base, but gives no publication date or methodology. Its approximately five-million-user figure is
              therefore an undated publisher claim, not a current active-user measure. The same profile distinguishes
              nationwide Basic and Starter availability from Premium service in selected regions. Krom's reported
              accounts and deposits belong to a bank subsidiary and are not Kredivo BNPL borrowers or parent-company
              revenue. The segmentation table keeps these populations separate and makes the missing denominators
              explicit.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
