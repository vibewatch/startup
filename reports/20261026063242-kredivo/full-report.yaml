  - id: FU001
    title: Documented Kredivo customer journey and evidence gaps
    type: journey-map
    summary: >-
      Public materials describe eligibility, credit decisioning, merchant use, and repayment options, but do not
      disclose the conversion or retention between stages.
    data:
      items:
        - label: Eligibility and application
          detail: >-
            PayAtlas lists Indonesian residency, age 18–60, and minimum monthly income of IDR 3 million; the profile is
            undated.
          touchpoints:
            - Application requirements are publisher-reported, not an independently tested approval policy.
        - label: Credit decision
          detail: >-
            Kredivo descriptions refer to real-time credit decisioning; public evidence does not give current approval
            or funded-loan rates.
          touchpoints:
            - No current application-to-approval cohort is disclosed.
        - label: Merchant selection
          detail: Multiples.vc names Tokopedia and Shopee as e-commerce platforms using Kredivo.
          touchpoints:
            - Merchant names in a profile do not show current volume or repeat use.
        - label: Purchase
          detail: Kredivo is described for online and offline purchases, including e-commerce and transit channels.
          touchpoints:
            - Merchant coverage does not establish transaction frequency or active-user status.
        - label: Payment confirmation
          detail: Antom's integration documentation says buyers manually return to the merchant app after payment.
          touchpoints:
            - This limitation is specific to the documented integration flow.
        - label: Repayment and repeat use
          detail: >-
            Antom documentation lists a manual return to the merchant app and no chargeback / dispute support for that
            integration.
          touchpoints:
            - The documentation describes one integration flow, not a company-wide failure.
            - Current repeat purchase, retention, and cohort expansion are not disclosed.
    claimRefs:
      - CU003
      - CU013
      - CU014
  - id: FR001
    title: Risk evidence and control-visibility map
    type: matrix
    summary: >-
      Public sources identify several risk drivers, but the most important outcome and control measures remain
      unquantified or company-reported.
    data:
      columns:
        - Exposure
        - Observed risk signal
        - Outcome measure disclosed
        - Control evidence
        - Residual uncertainty
      rows:
        - label: Borrower credit loss
          values:
            - Defaults acknowledged in management interview
            - No loss or recovery rate
            - Field collections described by management
            - High; portfolio performance unquantified
            - Evidence limited to a partner-hosted interview
        - label: Acquisition integrity
          values:
            - Install-level fraud acknowledged
            - No fraud incidence or cost
            - AppsFlyer and partner screening described by management
            - High; efficacy not independently tested
            - No channel-level repayment cohorts
        - label: Partner funding
          values:
            - DBS limit and BCA channel reported
            - No utilization or lender-share denominator
            - Partnerships are reported; contractual protections are not
            - High; concentration unknown
            - Facility limits are not drawn balances
        - label: Mobile OEM acquisition
          values:
            - Management estimates 30–40% of acquisition efforts
            - No channel-level loss or interruption data
            - Partner testing and channel suspension described
            - Medium/high; replacement capacity unknown
            - No independent efficacy test
        - label: Regulatory change
          values:
            - Management reports new rules in prior two years
            - No current enforcement record in assigned evidence
            - Management says it adapts to rules
            - High uncertainty; status unverified
            - No entity-level regulator record
        - label: Privacy and integration
          values:
            - Security priority and acquisitions are company-reported
            - No independent audit or incident history in assigned sources
            - No independent post-acquisition control testing disclosed
            - High; control maturity unverified
            - No external assurance evidence
    claimRefs:
      - CR015
      - CR016
