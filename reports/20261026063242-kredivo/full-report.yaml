              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU015
      - number: '6.3'
        title: Named deployments show reach, not customer durability
        blocks:
          - type: paragraph
            body: >-
              Named evidence is stronger for product availability and partnerships than for independently verified
              customer outcomes. The company lists Transjakarta among its PayLater partnerships, and a November 2025
              Tempo article describes Kredivo as a payment method in the transit app; neither source reports
              Kredivo-attributable ride volume, repeat use, or revenue. Tempo also quotes a Kredivo executive saying 42
              percent of users use PayLater for productive needs, without a sampling method or denominator. AVOW's case
              study is a partner-authored account of acquisition performance, not an independent benchmark or a
              retention cohort. The integration documentation from Antom identifies a narrower checkout friction: its
              flow does not support chargebacks or disputes and requires a manual return to the merchant app after
              payment. This is a specific integration limitation, not evidence of a company-wide incident. The sample of
              named deployments is incomplete; public sources reviewed do not provide current NRR, GRR, churn, renewal,
              cohort retention, or top-customer concentration.
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
