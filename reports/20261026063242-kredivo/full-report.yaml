companyProfile:
  summary: >-
    Kredivo Group is a privately held Southeast Asian digital-finance business whose portfolio includes consumer digital
    credit, buy-now-pay-later products, personal loans, and digital banking through Krom. Public company materials
    describe activity across Indonesia and neighboring markets, while independent and company disclosures document a
    decade of operating history, partnerships, acquisitions, and substantial cumulative fundraising. The public record
    does not establish consolidated parent revenue, profitability, liquidity, current valuation, or investor terms.
