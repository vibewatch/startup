              - CU013
              - CU014
      - number: '6.2'
        title: Adoption signals are not a current active-customer series
        blocks:
          - type: paragraph
            body: >-
              The public adoption record is a set of dated, non-comparable indicators. Multiples.vc describes nearly two
              million consumers as credit-scored by July 2018; this is not a count of active borrowers. Reuters reported
              nearly four million approved customers in 2021 and presence across eight of Indonesia's top ten e-commerce
              merchants, but approved customers and merchant coverage do not establish utilization or repeat purchase.
              Multiples.vc also says the group processed more than USD 2 billion in transactions in 2022; transaction
              volume is not revenue. A 2025 AVOW partner case study reports an install-to-loan-application rate and
              year-over-year spending growth, but omits the absolute cohort, baseline, and funded-loan conversion.
              Kredivo's own homepage carries a Krom account and deposit milestone without an as-of date. These figures
              show reported reach and channel activity, not a continuous, independently verified customer growth or
              retention curve.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
