  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - 'Thesis: partner financing and banking expansion may extend distribution and product options'
        - >-
          DBS announced an IDR 3 trillion channeling limit; Kredivo records the Timo acquisition and a Mizuho-led Series
          D
        - Evidence of parent-level incremental earnings after credit losses, funding costs, and integration expense
      - - 'Anti-thesis: historical financing and a proposed SPAC price do not prove current equity value'
        - >-
          The approximately $2.5 billion figure relates to a 2021 proposed transaction; the facility is credit
          financing, not equity
        - A dated current round or secondary transaction with share class, dilution, and preference terms
      - - 'Anti-thesis: regulatory and portfolio risks could compress growth or returns'
        - OJK limits and sector NPF trends are adverse industry context, not Kredivo-specific portfolio performance
        - Company-level cohort vintages, delinquency and loss curves, funding costs, and compliance impact
      - - 'Evidence gap: no like-for-like valuation benchmark is retained'
        - >-
          Forge reports no post-money figure in its January 2025 profile; the retained marketplace page shows no
          executable Kredivo price
        - >-
          Comparable companies or transactions matched for geography, lending model, growth, profitability, credit risk,
          and date
    notes: >-
      Company and partner announcements establish their stated events, not independently verified unit economics; sector
      metrics are not Kredivo-specific.
