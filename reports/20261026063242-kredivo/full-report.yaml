chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Built In's Kredivo Group profile lists its headquarters as DKI Jakarta, Indonesia (CO001). The company
              describes Kredivo as a digital-credit platform for e-commerce and offline purchases and personal loans
              using real-time decisioning; its stated portfolio includes Kredivo, KrediFazz, Krom, GajiGesa and Timo,
              with activity across Indonesia, Vietnam and Thailand (CO002). These are company descriptions, not
              independently audited segment or geographic revenue disclosures. The company timeline records FinAccel's
              incorporation in December 2015 and its first loan disbursement in April 2016; Reuters separately reported
              Kredivo began Indonesian operations in 2016 (CO003). That chronology establishes an operating history, but
              not current active-user totals, market share or parent-level financial scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Kredivo's company profile names Akshay Garg as group CEO and co-founder and Umang Rustagi as co-founder
              and President Director of Kredivo Indonesia; the profile also lists finance, people, strategy and capital
              leadership roles (CO011). ANTARA identifies Rustagi in the same Indonesia leadership role in its report on
              a BCA Digital channeling facility (CO008). Kompas reported the June 2025 appointment of Andre Rasjid to
              the board of commissioners of PT Kredivo Finance Indonesia, a subsidiary-level governance change rather
              than evidence of a group board seat (CO012). Available sources do not establish board control, voting
              rights, succession arrangements or the extent of any individual executive's operating dependency. The
              named-person table is a partial public roster, not a complete enumeration of group management.
            claimRefs:
              - CO008
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
              - CO011
      - number: '1.3'
        title: Capital, ownership and scale
        blocks:
          - type: paragraph
            body: >-
              Reuters reported that FinAccel's 2021 proposed SPAC merger contemplated a roughly US$2.5 billion valuation
              and US$430 million in gross proceeds, including a US$120 million private investment; these were proposed
              transaction terms, not a current valuation or proof that proceeds were received (CO004). Kredivo Holdings
              announced a roughly US$270 million Series D in March 2023, led by Mizuho, and its company timeline records
              about US$500 million raised to date in May 2026 (CO006, CO010). The cumulative raised figure is not cash
              on hand. Kompas relayed a company statement that Kredivo served more than 11 million users in Indonesia in
              June 2025, while Dealroom labels 653 people as “employees mapped”; neither is a dated, group-wide
              active-customer or verified headcount measure (CO014, CO015). Current valuation, revenue, ARR, cash
              balance and consolidated parent accounts remain evidence gaps, summarized in the KPI table (TO001). The
              stakeholder map identifies disclosed investors and transaction parties without inferring current stakes or
              control rights (TO003).
            claimRefs:
              - CO004
              - CO006
              - CO010
              - CO014
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO010
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO006
              - CO009
              - CO010
      - number: '1.4'
        title: Milestones and current diligence context
        blocks:
          - type: paragraph
            body: >-
              The company timeline records a majority acquisition of Bank Bisnis in 2022, the 2023 Series D, the
              February 2025 GajiGesa acquisition and the December 2025 BCA Digital channeling partnership; the 2026
              release announced an approximately 100% acquisition of Timo (CO005, CO006, CO007, CO008, CO009). A
              separate Asia Pacific Edge article asserts that 99.99% of Timo had completed an acquisition on April 23,
              2026, whereas the company release describes an approximately 100% acquisition announcement on May 6 and
              does not state the legal closing date (CO009). The article's underlying registry filing was not available
              in the retained text, so exact ownership and close remain unverified. A 2026 Fintech News Indonesia report
              describes new OJK BNPL eligibility and repayment-capacity limits and reports sector non-performing
              financing of 3.44% in May 2026, up from 2.99% in April (CO013). These are sector-level risk signals, not
              Kredivo-specific delinquency data. The dated company milestones below therefore distinguish announced
              corporate events from independently verified completion.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO013
          - type: figure
            figureRef: FO001
