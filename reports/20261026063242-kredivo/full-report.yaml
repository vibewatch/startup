  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          The expanded DBS facility and Timo integration support profitable incremental lending and banking products
          without a material deterioration in credit quality
        - >-
          Potential upside is conditional, but a numeric valuation range or return is not calculable without current
          earnings, capital needs, and entry price
        - Contingent upside; no calibrated probability
        - Integration costs or credit losses consume the incremental contribution
      - - Base
        - >-
          Partner funding remains available and integration proceeds, while parent-level profitability and cohort
          performance remain unverified
        - >-
          No defensible fair-value range; require a dated price and loss-adjusted earnings basis before estimating
          return
        - Working diligence case only; probability not estimated
        - Parent economics fail to demonstrate returns above capital and funding costs
      - - Bear
        - >-
          OJK constraints and worsening sector credit quality weigh on eligible originations or repayment capacity,
          while Kredivo-specific losses or funding costs rise
        - >-
          Material downside is plausible, but neither a numeric downside range nor probability is supported by the
          assigned evidence
        - Downside signal elevated by sector context; not a company forecast
        - Kredivo cohorts deteriorate, funding tightens, or compliance limits growth
    notes: >-
      These are conditional scenarios, not forecasts. The source set provides no current valuation inputs, company-level
      credit-loss series, or defensible probability estimates; numeric ranges are intentionally omitted.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV012
      - CV014
