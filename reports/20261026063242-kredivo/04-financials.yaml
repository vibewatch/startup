schemaVersion: "report-v2"
artifact: financials
slug: kredivo
runDate: 2026-10-26
company:
  name: Kredivo
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence describes a lending-led model with meaningful bank channeling
    capacity, including a reported IDR 3 trillion DBS facility, but does not
    establish revenue, realized pricing, portfolio returns, or parent-level
    liquidity. Historical equity, debt, and proposed valuation figures are
    snapshots with different definitions and dates, not current underwriting
    inputs.
sections:
  - id: revenue-model
    title: Revenue model and observable monetization
    body: >-
      Fintech News Indonesia describes Kredivo as a BNPL provider, while
      TechCrunch's 2023 coverage listed online and offline BNPL, personal loans,
      physical and virtual cards, and banking services through Krom (CI001,
      CI002). Kredivo's CEO also told TechCrunch that the company drove 3% to 4%
      of total GMV for its top Indonesian e-commerce merchants, versus 15% to
      20% for credit cards (CI016). That dated merchant-level proxy indicates
      distribution presence, not customer-level conversion, acquisition
      efficiency, current scale, or realized revenue. These descriptions
      establish a lending and digital-banking perimeter, not the revenue mix.
      The assigned public sources do not quantify realized interest, merchant
      fees, customer pricing, revenue recognition, or the share of economics
      earned by the parent versus its operating entities. List pricing and
      product availability should not be treated as realized revenue or margin.
      The revenue-stream table therefore separates disclosed products from
      missing commercial terms, and leaves unit values unquantified pending
      contracts and audited financial statements.
    claimRefs: [CI001, CI002, CI016]
    tableRefs: [TI001]
  - id: capital-and-funding
    title: Channel facilities and historical capital
    body: >-
      The clearest current-scale financial signal in the pool is a DBS Indonesia
      channeling limit reported at IDR 3 trillion at the start of 2026; Kontan
      describes the facility increasing from IDR 300 billion in 2020 through
      IDR 500 billion, IDR 1 trillion in 2021, IDR 2 trillion in 2022, and IDR 3
      trillion by end-2025 (CI003, CI004). Kredivo's milestones also list
      historical Hana and Shinhan channeling limits, while ANTARA reports a
      BCA Digital channeling arrangement without stating its amount (CI005,
      CI006). These are financing capacity or partnership announcements, not
      evidence of cash on hand, drawn balances, or available parent liquidity.
      The DBS and BCA announcements associate expansion with tier 2 and 3
      cities, but the sources do not disclose allocation, tenor, pricing,
      covenants, recourse, or realized returns.

      Historical capital reporting is similarly non-comparable. TechCrunch
      reported a roughly US$270 million Series D, about US$400 million total
      equity raised, and almost US$1 billion in committed debt facilities in
      2023 (CI007-CI009). Reuters described a proposed 2021 SPAC at an expected
      approximately US$2.5 billion equity value and more than US$430 million
      gross proceeds; the proposed transaction was later abandoned, and these
      figures do not represent current valuation or cash (CI010-CI012).
      Tracxn's fetched company profile separately reports US$660 million total
      funding and a US$1.6 billion valuation, without enough definition or
      current-date evidence to reconcile those figures to reported equity
      raised or a present valuation (CI013, CI014). The capital table preserves
      each source's label and vintage rather than combining unlike amounts.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: underwriting-gaps
    title: Unit economics, capital adequacy, and diligence priorities
    body: >-
      The source pool supports a lending model and bank funding channels, but
      not an underwritable unit-economics bridge. It contains no current company
      revenue or ARR, realized price or fee take, customer acquisition cost,
      payback period, gross margin, funding cost, cohort loss rate, or
      parent-level cash, burn, and runway. Those are evidence gaps, not zeroes.
      The conceptual flow figure marks which lending inputs are reported and
      which conversion steps remain unmeasured; it is not a forecast or a
      claim that every product uses identical funding or revenue mechanics.

      Regulation is a relevant underwriting constraint: Fintech News Indonesia
      reports new OJK eligibility and debt-service limits, including a 40% cap
      on total BNPL payments relative to monthly income for 2027-2028 and 30%
      from 2029 (CI015). The report is secondary coverage of a circular, so
      legal interpretation should be checked against the original instrument.
      No source in this pool establishes Kredivo-specific default performance
      under the new limits. Before underwriting, request audited parent and
      subsidiary accounts, facility agreements and draw schedules, monthly
      receivable and delinquency cohorts by product and channel, realized
      pricing and fee waterfalls, acquisition and collection costs, and a
      consolidated cash/debt maturity schedule.
    claimRefs: [CI015]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Publicly described products and monetization evidence
    columns:
      - Product or stream
      - Publicly described mechanism
      - Realized monetization evidence
      - Underwriting status and diligence ask
    rows:
      - - BNPL and purchase credit
        - TechCrunch described online and offline BNPL; Fintech News Indonesia identifies Kredivo as a BNPL provider.
        - Not quantified in assigned sources; no realized customer rate or merchant fee schedule.
        - Obtain merchant contracts, borrower pricing schedules, fee waterfalls, and revenue-recognition policy.
      - - Personal loans
        - TechCrunch included personal loans in the group's 2023 product set.
        - Product availability is described, but loan pricing, average balance, tenor, and net yield are unavailable.
        - Request product-level loan terms, yield, funding cost, and net charge-off cohorts.
      - - Physical and virtual credit cards
        - TechCrunch reported physical and virtual credit-card products in the 2023 product set.
        - No card-level interchange, interest, fee, or utilization economics are provided.
        - Request current product status, card economics, and issuer/partner revenue allocation.
      - - Krom digital banking
        - Kredivo's official description identifies Krom Bank Indonesia as the group's bank entity; TechCrunch described banking services through Krom.
        - Deposits, net interest income, funding costs, and parent/subsidiary contribution are not quantified here.
        - Obtain Krom audited statements, deposit mix and cost, asset yield, capital adequacy, and intercompany balances.
    notes: >-
      Product scope is sourced from company and third-party descriptions; the
      table does not assert that every described product remains active or
      contributes revenue in the same period. "Not quantified" means the
      assigned fetched sources do not provide the metric, not that its value is
      zero.
    claimRefs: [CI001, CI002]
  - id: TI002
    title: Reported capital and financing indicators
    columns:
      - Instrument or indicator
      - Reported value and period
      - Source meaning and limitation
      - Diligence required
    rows:
      - - DBS Indonesia channeling limit
        - IDR 3 trillion at the start of 2026; reported at IDR 3 trillion by end-2025
        - Reported facility limit, not drawn balance, cash, or parent liquidity.
        - Confirm signed limit, undrawn availability, tenor, cost, collateral, recourse, and utilization.
      - - DBS facility history
        - IDR 300 billion in 2020, IDR 500 billion, IDR 1 trillion in 2021, IDR 2 trillion in 2022, IDR 3 trillion by end-2025
        - Kontan's reported progression; the pool does not reconcile amendments, repayments, or outstanding exposure.
        - Obtain dated agreements and monthly utilization/outstanding schedules.
      - - Other bank channeling lines
        - Company milestones list Hana Bank IDR 700 billion (2024) and Shinhan Bank IDR 800 billion (2024); BCA Digital amount not stated
        - Historical company announcements and a BCA partnership report; not proof of present availability.
        - Confirm current status, obligor, amount, utilization, and whether limits overlap.
      - - Series D equity
        - About US$270 million reported in 2023
        - TechCrunch reporting corroborated by a company-issued release; does not establish cash retained today.
        - Review closing documents, use of proceeds, subsequent financing, and current cap table.
      - - Total equity and committed debt
        - About US$400 million total equity raised and almost US$1 billion committed debt facilities, as reported in 2023
        - Historical third-party figures with different instrument definitions; committed facilities are not cash available.
        - Reconcile debt drawdowns, repayments, maturities, covenants, and any guarantees.
      - - Proposed SPAC valuation and proceeds
        - About US$2.5 billion expected equity value and over US$430 million expected gross proceeds in a 2021 proposal
        - Transaction expectations, not a completed financing or current valuation; the proposal was later abandoned.
        - Exclude from current valuation absent a current priced financing or transaction.
      - - Tracxn funding and valuation figures
        - US$660 million total funding and US$1.6 billion valuation on the fetched profile
        - Aggregator figures with unclear definitions and stale publication context; not reconciled to equity-only totals.
        - Request source methodology and verify against company financials and financing documents.
    notes: >-
      Currency and labels follow each cited source. Historical equity, proposed
      proceeds, debt commitments, and channeling limits are distinct measures
      and must not be summed as current cash or current valuation.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]
  - id: TI003
    title: Unit economics and capital adequacy data gaps
    columns:
      - Metric
      - Public value in assigned sources
      - Why it matters
      - Specific diligence request
    rows:
      - - Revenue, ARR, and revenue mix
        - null
        - Revenue quality and growth cannot be assessed from product descriptions or financing announcements.
        - Request audited statements and monthly revenue by entity, product, geography, and fee type.
      - - Realized borrower and merchant pricing
        - null
        - List or promotional pricing would not establish realized yield or net take rate.
        - Request price schedules, waivers, merchant commissions, and recognized fee reconciliation.
      - - CAC, payback, and sales efficiency
        - null
        - Acquisition cost and repeat use determine the sustainability of expansion.
        - Request cohort CAC, channel spend, funded-user conversion, repeat rate, and contribution payback.
      - - Gross margin and funding spread
        - null
        - Credit funding costs and servicing costs can change the economics despite facility growth.
        - Request product-level interest expense, servicing/collection cost, gross profit bridge, and funding terms.
      - - Credit losses and portfolio concentration
        - null
        - Industry regulation is not a substitute for company-specific delinquency, loss, or concentration data.
        - Request vintage-level 30/60/90-day delinquency, charge-offs, recoveries, restructurings, and top-channel exposure.
      - - Cash, burn, and runway
        - null
        - Equity raised and committed facilities do not establish current unrestricted cash or liquidity runway.
        - Request latest consolidated cash, monthly operating cash flow, debt maturities, restricted cash, and base/downside runway.
    notes: >-
      Null indicates that no value is established by the assigned prefetched
      sources; it is not a zero or an estimate. Each metric requires private
      company evidence before underwriting.
    claimRefs: [CI003, CI006, CI007, CI008, CI009, CI015]
figures:
  - id: FI001
    title: "Credit economics: reported inputs and underwriting gaps"
    type: flow
    summary: >-
      An analytical sequence from described lending products to unreported
      portfolio and cash outcomes; it is not a measured conversion or forecast.
    data:
      nodes:
        - id: products
          label: Lending products
          detail: BNPL and purchase credit, personal loans, and related group products are described; current revenue mix is unquantified.
        - id: facilities
          label: Bank funding channels
          detail: DBS channeling limit reported at IDR 3 trillion in early 2026; BCA Digital amount is not stated.
        - id: utilization
          label: Drawn funding and receivables
          detail: Current facility utilization, funded receivables, maturity profile, and unused limits are not reported in the assigned pool.
        - id: repayments
          label: Repayments and credit losses
          detail: Kredivo-specific collection, delinquency, recovery, and charge-off cohorts are unavailable in the assigned pool.
        - id: contribution
          label: Revenue and contribution margin
          detail: Realized pricing, funding cost, servicing cost, and product contribution are not quantified.
        - id: liquidity
          label: Cash conversion and runway
          detail: Parent-level cash, burn, debt maturities, and runway are not established by historical fundraising announcements.
    claimRefs: [CI001, CI002, CI003, CI006, CI009]
callouts:
  - calloutType: risk
    title: Funding capacity is not liquidity
    body: >-
      The reported DBS channeling limit and historical equity or debt figures
      cannot establish cash on hand, undrawn availability, or parent-level
      runway. Facility utilization, obligations, and consolidated liquidity
      remain material underwriting gaps.
    claimRefs: [CI003, CI007, CI008, CI009]
