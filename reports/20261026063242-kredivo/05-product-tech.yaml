    notes: Product and asset status follows company milestones or dated third-party reporting; an acquisition or launch announcement does not establish current availability, integration, adoption, or performance.
    claimRefs: [CE003, CE004, CE005, CE006, CE015]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow described in sources
      - Kredivo solution described
      - Measurable benefit evidence
      - Limitation
    rows:
      - ["Buy an e-commerce item using credit", "Shopper applies during online checkout, according to a historical CEO interview", "Embedded instant credit with repayment over time", "No current, independently verified conversion or time-to-decision outcome in the assigned sources", "Interview is historical; merchant coverage and current checkout integration are not established."]
      - ["Pay for an offline purchase", "Reuters reported online and offline purchase financing in 2021", "Instant credit financing for offline purchases", "No current measured benefit or deployment-level evidence in the assigned sources", "Supported merchant types, point-of-sale integration, and reliability are not documented."]
      - ["Obtain a personal loan", "Reuters identified personal loans as an offering in 2021", "Personal credit based on the reported real-time decisioning", "No current approval, disbursement, or borrower-outcome metric is available here", "Application steps, eligibility, terms, and product-specific performance are not specified."]
      - ["Assess an applicant's creditworthiness", "TechCrunch reports telco, e-commerce-account, and bank-account data as inputs", "Data-led credit assessment beyond reliance solely on traditional bureaus", "No independently validated lift, fairness, or accuracy measurement is reported", "Current data coverage, consent, model validation, and decision explanation remain diligence items."]
    notes: Workflow descriptions combine company statements and historical reporting; no current independent outcome measurement was found in the assigned evidence.
    claimRefs: [CE001, CE003, CE007]
  - id: TE003
    title: Technology and operating dependencies
    columns:
      - Component or process
      - Publicly described role
      - Dependency or exposure
      - Evidence limitation
    rows:
      - ["Alternative-data inputs", "Telco, e-commerce-account, and bank-account data are reported as creditworthiness inputs", "Data access, quality, consent, and coverage affect assessment", "TechCrunch's description dates to 2023 and does not document current lineage or permissions."]
      - ["Merchant and channel interfaces", "Online checkout and offline-purchase financing are described", "Merchant integrations and point-of-sale availability shape reach and continuity", "No current API, merchant catalog, deployment count, or service-level evidence is supplied."]
      - ["BNPL eligibility and capacity controls", "OJK rules and 2026 legal analysis describe eligibility, income verification, and repayment-capacity requirements", "Financing-company operations must align decisioning and servicing with applicable rules", "Sources do not establish Kredivo's implementation, testing, or compliance status."]
      - ["Consumer and data-protection controls", "OJK requires prudent conduct, clear disclosures, and debtor-data protection", "Product design, data handling, billing, and customer communications must support these obligations", "No Kredivo-specific control evidence, audit, certification, or security test is included."]
      - ["Credit-quality monitoring", "Fintech News Indonesia reports rising NPF across the BNPL sector in April–May 2026", "Affordability and portfolio monitoring are material operating dependencies", "Sector NPF is not a Kredivo metric and cannot establish the company's own loss performance."]
    notes: This is a dependency and evidence map, not a verified production-architecture inventory; regulatory requirements do not prove company implementation.
    claimRefs: [CE007, CE009, CE010, CE011, CE012, CE013]
