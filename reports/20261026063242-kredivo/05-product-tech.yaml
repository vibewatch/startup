      - ["Krom digital banking", "Retail banking customers", "Company timeline records Krom digital banking launch in February 2024", "Adds a bank and digital-banking surface to the group", "Current active features, customer usage, and linkage to Kredivo credit are not evidenced."]
      - ["GajiGesa earned-wage access", "Employees seeking wage access", "Company timeline records acquisition in February 2025 and entry into the EWA market", "Extends the stated portfolio beyond consumer credit", "Commercial launch, product integration, and usage are not detailed."]
