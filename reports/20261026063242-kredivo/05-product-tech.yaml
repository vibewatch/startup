company:
  name: Kredivo
chapter:
  number: 5
  title: Product & Technology
  summary: Kredivo's public materials describe embedded digital credit, real-time decisioning, adjacent banking and wage-access products, and a broader regional portfolio. They do not establish a current production architecture, operating performance, or the company's implementation of newly effective BNPL safeguards.
sections:
  - id: product-scope
    title: Product scope and customer workflow
    body: >-
      Kredivo's core proposition is point-of-sale credit: KrASIA described shoppers applying at online checkout and repaying over time, while Reuters reported in 2021 that Kredivo offered instant financing for online and offline purchases as well as personal loans based on AI-enabled real-time decisioning. Both are historical descriptions; this pool does not verify present availability, approval times, or performance. The portfolio has expanded beyond checkout credit: the official timeline records Krom digital banking's 2024 launch, GajiGesa's 2025 acquisition as an entry into earned-wage access, and Timo's 2026 acquisition. TechCrunch reported physical and virtual card products in 2023. These milestones map product scope, not present-day active availability, usage, or integration across brands.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE015]
    tableRefs: [TE001, TE002]
  - id: disclosed-technology
    title: What the public technology record supports
    body: >-
      The clearest technology signals are a historical CEO description of AI-powered credit scoring and fraud detection, TechCrunch's 2023 account of using telco, e-commerce, and bank-account data to assess creditworthiness, and a Kredivo backend-engineering listing that names development, testing, deployment, databases, and several technologies as candidate skills. The hiring listing is evidence of requested competencies, not proof those tools are deployed in production. Together these disclosures suggest a data-led credit workflow, but the assigned evidence does not specify model design, data lineage or permissions, service topology, APIs, model validation, or current engineering ownership. The accompanying stack graphic groups disclosed functions for diligence; it is not a verified system diagram or a sequence of technical layers.
    claimRefs: [CE002, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: product maturity and differentiation
    title: Product maturity, differentiation, and operating proof
    body: >-
      Publicly described differentiation centers on rapid digital credit decisions and access through online and offline commerce, with adjacent banking and wage-access capabilities broadening the product surface. The evidence is uneven by maturity: the company records Krom's launch, while GajiGesa and Timo are described as acquisitions or market-entry moves without detailed integration, usage, or service-level evidence in this pool. KrASIA's checkout account is historical, and TechCrunch's product and data descriptions date to 2023. No assigned source supplies a current integration catalog, independently measured customer benefit, reliability or support metrics, certification, security testing, or evidence that these products share a unified technical platform. Those gaps constrain any claim that portfolio breadth has translated into a differentiated or dependable operating system.
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE015]
  - id: trust-and-control
    title: Trust, safety, and regulatory constraints
    body: >-
      Indonesia's OJK framework limits BNPL provision to commercial banks and financing companies and sets expectations for electronic systems, prudent conduct, consumer disclosures, and debtor-data protection. A 2026 legal analysis describes more specific financing-company requirements, including age and income eligibility and repayment-capacity limits; Fintech News Indonesia separately reports the 40% income ceiling for 2027–2028 and 30% from 2029. The same outlet reports industry-wide BNPL non-performing financing of 3.44% in May 2026, versus 2.99% in April, which is a sector indicator rather than a Kredivo loss or delinquency measure. The materials establish the relevant control environment, not Kredivo's compliance implementation, underwriting outcomes, security posture, or incident history.
    claimRefs: [CE009, CE010, CE011, CE012, CE013]
