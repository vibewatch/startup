  evidenceGaps:
    - type: missing-source
      severity: material
      topic: product-deployment
      missingEvidence: Current product availability by market and channel, merchant or banking integrations, active deployment scope, and service-level or reliability data.
      whyItMatters: Portfolio announcements and product descriptions do not show whether each offering is live, integrated, dependable, or delivering measurable customer value today.
      diligencePath: Request a current product-by-market catalog, integration/API inventory, launch and rollout records, and channel-level availability and uptime metrics.
      relatedQuestionRefs: [QE004]
      relatedTableRefs: [TE001, TE002]
    - type: private-evidence-only
      severity: material
      topic: production-architecture
      missingEvidence: Current production architecture, data lineage and permissions, model design and validation, deployment topology, and technology ownership.
      whyItMatters: Public descriptions and hiring requirements cannot verify the operating design, scalability, model governance, or control effectiveness of the live platform.
      diligencePath: Obtain an architecture walkthrough, system and data-flow diagrams, model-validation materials, deployment documentation, and engineering ownership map.
      relatedQuestionRefs: [QE003, QE004]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: security-and-safety-controls
      missingEvidence: Kredivo-specific evidence of privacy and security controls, penetration or security testing, certifications, incident response, and BNPL rule implementation.
      whyItMatters: OJK requirements and sector-level credit-quality indicators do not establish the company's implementation, security posture, or company-specific borrower outcomes.
      diligencePath: Request the security and privacy control pack, independent assurance reports, incident-response records, compliance mapping, and company-level credit-quality metrics.
      relatedQuestionRefs: [QE006, QE008]
      relatedTableRefs: [TE003]
