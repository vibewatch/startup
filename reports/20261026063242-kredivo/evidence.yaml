evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation-and-cash
    missingEvidence: >-
      Current post-money valuation, transaction completion and terms, liquidation preferences, secondary pricing,
      current cash balance and debt maturities.
    whyItMatters: >-
      The historical SPAC valuation was proposed rather than established as current, and cumulative capital raised does
      not show cash available or investor economics.
    diligencePath: >-
      Request the current cap table, priced-round and secondary documents, transaction closing records, audited parent
      accounts, and a dated cash-and-debt reconciliation.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-parent-scale
    missingEvidence: >-
      Current parent-level revenue, revenue run-rate, ARR where applicable, growth, gross margin, active customer
      definitions and a dated employee count.
    whyItMatters: >-
      Public user and employee figures use different scopes and periods and do not establish audited group scale or
      lending economics.
    diligencePath: >-
      Request consolidated financial statements and segment schedules, definitions and dated cohort exports for users,
      and a current HR roster reconciled to contractors and subsidiaries.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: timo-ownership-and-closing
    missingEvidence: >-
      Definitive Timo closing date, post-close ownership percentages, regulatory approvals and shareholder or board
      rights.
    whyItMatters: >-
      The company announcement says approximately 100% while a low-reputation article asserts 99.99% completion on an
      earlier date; the article's cited registry record was not present in the fetched text.
    diligencePath: >-
      Obtain the approved transaction agreement, regulatory approvals, closing statement, current shareholder register
      and post-close board appointments.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-roster
    missingEvidence: >-
      Complete group and subsidiary management roster, board composition, reporting lines, succession coverage and
      delegated authority.
    whyItMatters: The public names do not establish governance control, operating responsibility or key-person dependence.
    diligencePath: >-
      Request the legal-entity organization chart, current director and officer lists, board committee mandates and
      succession plans.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current, inclusive Indonesia BNPL and digital-consumer-credit market denominator with geography, product
      boundary, metric definition, provider coverage, methodology and segment-level breakdown, plus comparable inputs to
      derive Kredivo SAM and SOM.
    whyItMatters: >-
      Kontan reports an OJK BNPL financing figure for finance companies, but it does not establish a comparable
      all-provider spend base or Kredivo share; without that base and documented eligibility, channel and market-share
      assumptions, TAM, SAM and SOM remain unsupported.
    diligencePath: >-
      Obtain a current Indonesian regulator or reputable market-data series with a transparent BNPL denominator, then
      reconcile product and geography definitions to audited Kredivo originations and the eligible borrower/merchant
      footprint.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-pricing-comparison
    missingEvidence: >-
      Current provider-level price cards and realized APR, fees, repayment periods, credit limits, promotions, and
      merchant economics for Kredivo and named alternatives.
    whyItMatters: >-
      Without same-period terms, the report cannot compare customer value, pricing pressure, or lender take-rate and
      must not infer a price moat from one undated profile assertion.
    diligencePath: >-
      Obtain current dated provider schedules and representative customer contracts for Kredivo, GoPayLater, Shopee
      PayLater, and Akulaku, then reconcile them to realized rates and fees.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-credit-performance
    missingEvidence: >-
      Cohort retention, customer multi-homing, repeat borrowing, channel-level approval and loss performance, and
      switching behavior across BNPL providers.
    whyItMatters: >-
      Distribution partners and product breadth may improve access but do not demonstrate customer lock-in,
      risk-adjusted unit economics, or durable advantage.
    diligencePath: >-
      Request anonymized channel-level cohorts, repeat-use and churn data, multi-homing analysis, and vintage loss
      curves from management and financing partners.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: missing-source
    severity: minor
    topic: rival-scale-and-regulatory-posture
    missingEvidence: >-
      Comparable, current standalone scale and regulatory-status evidence for Sea/Shopee PayLater, GoPayLater, Akulaku,
      and other named providers.
    whyItMatters: >-
      Parent-level GoTo metrics and a competitor-authored provider list do not establish product-level rank or relative
      risk posture.
    diligencePath: >-
      Collect provider-specific filings, regulator records, and dated operating disclosures for each material
      alternative.
    relatedQuestionRefs:
      - QP001
      - QP003
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Current audited revenue by product and entity, realized pricing, recognized fee mix, revenue-recognition policies,
      and current ARR, GMV, user, utilization, or other operating-traction measures.
    whyItMatters: >-
      Without revenue quality and realized pricing, public product descriptions and channel limits cannot support a
      growth or margin underwriting case.
    diligencePath: >-
      Request audited group and subsidiary financial statements plus monthly revenue bridges by product, geography, and
      fee type.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Customer acquisition cost, payback, funding cost, servicing cost, gross margin, and product-level delinquency and
      loss cohorts.
    whyItMatters: >-
      Lending returns depend on realized yield net of funding, acquisition, servicing, and credit losses; none is
      quantified by the assigned pool.
    diligencePath: >-
      Request monthly vintage-level unit economics, channel-level CAC, funding agreements, and
      delinquency/charge-off/recovery schedules.
    relatedQuestionRefs:
      - QI002
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: parent-liquidity
    missingEvidence: >-
      Current consolidated unrestricted cash, operating cash flow, debt maturities, facility utilization, covenants, and
      runway.
    whyItMatters: >-
      Historical fundraising and committed or channeling limits do not establish current liquidity, parent obligations,
