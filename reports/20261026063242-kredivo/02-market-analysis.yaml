tables:
  - id: TM001
    title: Market definition and included/excluded spend
    columns:
      - Segment or category
      - Core boundary treatment
      - User / buyer / payer
      - Budget owner and adoption trigger
      - Evidence and relevance
    rows:
      - - Consumer BNPL at ecommerce checkout
        - Core product category; count consumer credit used to pay for a purchase, not gross retail sales as a proxy for credit revenue.
        - Household consumer is user and borrower; ecommerce merchant is the acceptance/distribution point.
        - Household repayment capacity; adoption at checkout is the relevant trigger. Contract and budget details are not disclosed in the assigned sources.
        - Reuters and Cooley describe ecommerce purchase financing (CM001; SM002, SM003).
      - - Consumer BNPL at offline merchants
        - Core product category, separately tracked from ecommerce because channel coverage and acceptance may differ.
        - Household consumer is user and borrower; offline merchant is the acceptance/distribution point.
        - Household repayment capacity and merchant acceptance; current coverage and conversion are not quantified.
        - Kredivo and Cooley describe offline BNPL; Kredivo’s release calls its network open loop (CM001, CM003; SM002, SM006).
      - - Digital personal loans
        - Adjacent digital-credit category; include in a broader digital-consumer-credit view, not in a BNPL checkout-spend denominator.
        - Borrower uses and repays the loan; no separate merchant checkout is required by the product description.
        - Household credit need and repayment capacity; loan purpose, ticket size and overlap with BNPL are not disclosed.
        - Reuters and Cooley describe personal loans alongside purchase financing (CM001; SM002, SM003).
      - - Productive or business-purpose credit
        - Adjacent use case; do not treat a reported use of credit as an independently sized SME-credit market.
        - Kredivo’s report describes users accessing credit as business capital; the borrower and business budget relationship is not fully specified.
        - Business working-capital need is a plausible trigger; actual borrower counts and loan values are not given in the article.
        - Jawawa reports the 2025 productive-use share and user growth as Kredivo-report figures (CM006, CM009; SM001).
      - - Cards, deposits and digital banking
        - Broader financial-services adjacency; exclude deposits and bank balances from BNPL spend, and avoid combining card credit without aligned product definitions.
        - Cardholder or bank customer differs from a BNPL borrower; separate payer and account relationships require product-level data.
        - Household financial needs, but no comparable budget, penetration or spend data are provided.
        - Cooley described cards and Krom in Kredivo’s 2023 ecosystem; these do not quantify BNPL (CM002; SM002).
    notes: >-
      The boundary is an analytical taxonomy based on the cited product descriptions, not a regulator-defined market or a company-reported TAM. Buyer, payer and budget-owner assignments are analytical; the cited sources do not disclose contract-level economics. No retail sales, deposit balances or loan totals are converted into BNPL spend.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM006
      - CM009
  - id: TM002
    title: Sizing lenses and evidence limits
    columns:
      - Lens / publisher
      - Period and geography
      - Reported metric and denominator
      - What it can indicate
      - Method, confidence and limitation
    rows:
      - - Kredivo usage mix, reported by Jawawa from Kredivo’s impact report
        - 2025; Kredivo platform, Indonesia context
        - 54% of credit disbursed was used for productive needs; denominator is Kredivo credit disbursed in 2025, not Indonesian BNPL industry spend.
        - Company-specific use mix and adjacency to productive borrowing.
        - Company-report figure relayed in a news article; loan count, value, and definition of productive use are not stated here. No market CAGR reported (CM006; SM001).
      - - Kredivo first-time-credit users, reported by Jawawa from the company impact report
        - Since 2019; Kredivo platform
        - Tenfold increase in people gaining first-time credit through the platform; women were 48% of that user group.
        - Company-specific inclusion and user-growth signal, not total market growth.
        - The article gives neither starting nor ending user counts or a market-wide comparison; no CAGR can be derived (CM007, CM008; SM001).
      - - Kredivo business-capital users, reported by Jawawa from the company impact report
        - 2025 compared with 2019; Kredivo platform
        - Fifteenfold increase in users accessing credit as business capital; no absolute user count is reported in the article.
        - Directional evidence of a productive-credit use case.
        - Company-specific user-count comparison, not loan value, MSME market size or industry growth (CM009; SM001).
      - - Indonesia BNPL non-performing financing, reported by Fintech News Indonesia
        - April–May 2026; sector-level Indonesia
        - NPF was 2.99% in April and 3.44% in May 2026; denominator is sector non-performing financing rate as reported.
        - Credit-quality and affordability constraint, not market demand or market value.
        - Secondary report attributing the figures and explanation to OJK; no market CAGR or originations denominator supplied (CM012; SM007).
      - - Indonesia BNPL financing by finance companies, reported by Kontan from OJK data
        - November 2025; Indonesia, finance-company BNPL
        - Rp 11.24 trillion, up 68.61% year over year; the article does not state an all-provider or Kredivo-specific denominator.
        - A segment-specific financing activity indicator, not consumer spend, revenue or Kredivo market share.
        - Kontan attributes the figure to OJK; the article does not provide full-provider coverage or a method for deriving TAM, SAM or SOM (CM015; SM009).
    notes: >-
      These are distinct metrics with different populations, units and periods; they are not additive and do not estimate TAM, SAM or SOM. The finance-company BNPL figure is not an all-provider market denominator. No source in the assigned pool supplies a comparable market-spend denominator, methodology, or CAGR. Dealroom’s 653 mapped employees (CM013; SM008) is a company-profile indicator and is not used as a demand proxy.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM012
      - CM013
      - CM015
