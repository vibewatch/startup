      - - Ecommerce BNPL
        - Consumer / borrower
        - Consumer repays the credit; settlement mechanics are not shown in assigned sources.
        - Credit is selected at ecommerce checkout; household repayment capacity is the relevant budget constraint.
        - Cooley and Reuters describe ecommerce credit; Reuters’ 2021 merchant footprint is historical and not current coverage (CM001, CM004; SM002, SM003).
      - - Offline BNPL
        - Consumer / borrower
        - Consumer repays the credit; merchant settlement terms are not shown.
        - Merchant acceptance connects the purchase to credit; household budget ownership is analytical, not source-disclosed.
        - Product presence is described by Reuters and Cooley, but current merchant counts and conversion are unavailable (CM001; SM002, SM003).
      - - Personal loans
        - Individual borrower
        - Borrower repays lender.
        - Digital loan application and repayment; household credit budget. Use of proceeds is not specified in the product description.
        - Listed as a separate product from checkout BNPL; no segment-level origination data are supplied (CM001; SM002, SM003).
      - - Productive/business-purpose credit
        - User accessing credit as business capital; borrower category is not fully specified.
        - Repayment obligation rests with the borrower; business-versus-household allocation is not disclosed.
        - Working-capital need is the reported use case; the underlying business budget and loan values are absent.
        - Company report figures indicate productive use, but do not isolate an addressable SME market (CM006, CM009; SM001).
      - - Krom bank and deposits
        - Bank customer or depositor, distinct from a BNPL checkout user.
        - Deposit account relationship; not a BNPL repayment payer by definition.
        - Savings/banking needs and bank-product budget are separate from checkout credit.
        - Krom is described as an ecosystem adjacency, but the assigned evidence supplies no deposit or banking market sizing (CM002; SM002).
    notes: >-
      The buyer, user and payer mapping is a diligence framework, not a source-reported segmentation study. It identifies the information needed to isolate budgets and adoption triggers; transaction-level contracts, merchant settlement, customer-level overlap and segment economics remain gaps.
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM006
      - CM009
