chapter:
  number: 2
  title: Market Analysis
  summary: The assigned evidence supports a core boundary around Indonesian digital consumer credit, including BNPL at online and offline checkout and adjacent personal lending. Company-reported usage and current regulatory indicators illuminate adoption and constraints, but the evidence does not establish a defensible market-spend denominator or Kredivo-specific SAM/SOM.
sections:
  - id: market-boundary
    title: Market boundary and addressable product
    body: >-
      The narrowest defensible core is digital consumer credit used for purchases in Indonesia: BNPL at ecommerce and offline merchants. Reuters’ 2021 report and a 2023 transaction release described ecommerce and offline purchase financing alongside personal loans; the latter also described cards and the planned Krom bank. Those are product-scope statements, not independently measured market shares or proof that every product belongs in one spend pool (CM001, CM002). Keep personal loans adjacent to checkout BNPL because the repayment purpose and transaction unit differ; keep deposits and banking outside the BNPL denominator. Kredivo’s milestone page shows channeling facilities and merchant/transport partnerships, which indicate routes to distribution and credit supply, not consumer spend (CM014). The company’s “market leader” wording remains a company assertion rather than a benchmark (CM003). A buyer map therefore distinguishes household borrowers from merchant acceptance and from the separate bank/deposit relationship; available sources do not disclose the budget owner or economics of each transaction.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM014
    tableRefs:
      - TM001
    figureRefs:
      - FM001
  - id: sizing-and-adoption
    title: What the available sizing lenses do—and do not—measure
    body: >-
      None of the retained sources supplies an inclusive, comparable Indonesia BNPL spend denominator, a segment-level SAM, or a Kredivo obtainable-share calculation with a defined population, unit and method. The usable quantities are narrower proxies: figures Kredivo attributes to its own social-impact report, an OJK-reported BNPL financing total for finance companies, an OJK-reported sector non-performing financing rate, and historical company footprint figures in Reuters reporting. They have different denominators and periods, so they cannot be added or converted into a market-size estimate (CM006, CM007, CM008, CM009, CM012, CM015). Kontan reports OJK data showing Rp 11.24 trillion of BNPL financing by finance companies in November 2025, up 68.61% year over year; that channel-specific figure is not an all-provider spend measure or Kredivo share (CM015). In the company-reported 2025 usage mix, 54% of Kredivo credit disbursed was used for productive needs; the same article reports a fifteenfold increase since 2019 in users accessing credit as business capital. Neither is industry-wide growth, and the underlying counts and loan values are not supplied in the article (CM006, CM009). Dealroom’s mapped-employee figure is an operator profile measure, not a demand or spending measure (CM013). The sizing exhibit preserves these distinctions rather than implying a forecast or market share.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM012
      - CM013
      - CM015
    tableRefs:
      - TM002
  - id: buyers-and-constraints
    title: Buyer pathways, adoption signals and constraints
    body: >-
      The direct user and repayment obligation for consumer credit sit with the borrower; merchant checkout is a distribution and acceptance point for BNPL, while a bank account or deposit relationship is a distinct banking use case. This is an analytical segmentation, not a source-disclosed contract map. Kredivo’s 2021 SPAC announcement, as reported by Reuters, gave nearly four million approved customers and presence across eight of Indonesia’s top ten ecommerce merchants at that historical date; these are not current metrics and do not establish active borrowers or current merchant coverage (CM004). For 2025, Kredivo’s report as described by Jawawa says 54% of its disbursed credit went to productive needs, and its first-time-credit and business-capital figures suggest use beyond checkout, but they are company-specific (CM006, CM007, CM009). Constraints are material: Fintech News Indonesia reports OJK eligibility, income-verification and exposure rules taking effect in July 2026, alongside a sector NPF rate of 3.44% in May 2026 versus 2.99% in April (CM010, CM011, CM012). The rules can constrain eligible borrowers and repayment capacity; whether they change Kredivo’s approval, loss or unit economics is not quantified here.
    claimRefs:
      - CM004
      - CM006
      - CM007
      - CM009
      - CM010
      - CM011
      - CM012
    tableRefs:
      - TM003
