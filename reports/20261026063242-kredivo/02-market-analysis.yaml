  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: A current, inclusive Indonesia BNPL and digital-consumer-credit market denominator with geography, product boundary, metric definition, provider coverage, methodology and segment-level breakdown, plus comparable inputs to derive Kredivo SAM and SOM.
      whyItMatters: Kontan reports an OJK BNPL financing figure for finance companies, but it does not establish a comparable all-provider spend base or Kredivo share; without that base and documented eligibility, channel and market-share assumptions, TAM, SAM and SOM remain unsupported.
      diligencePath: Obtain a current Indonesian regulator or reputable market-data series with a transparent BNPL denominator, then reconcile product and geography definitions to audited Kredivo originations and the eligible borrower/merchant footprint.
      relatedQuestionRefs:
        - QM002
      relatedTableRefs:
