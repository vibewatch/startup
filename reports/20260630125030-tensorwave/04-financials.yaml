    {
      "id": "capital-adequacy",
      "title": "Capital adequacy, capacity obligations, and financing dependency",
      "body": "Capital formation is the strongest public part of TensorWave's financial story. The company raised a $43M SAFE in October 2024, a $100M Series A in May 2025, and a $350M Series B in June 2026, bringing disclosed equity capital to about $493M. Public sources also tie the company to large physical commitments: a 1GW TECfusions capacity agreement in October 2024, a January 2026 expansion that added 20MW across Pennsylvania and Arizona, and company claims of more than 2GW of long-term capacity secured by June 2026. Review-Journal further reported that Series B proceeds would fund additional US data centers and equity contributions for GPU financings, which is important because infrastructure-heavy AI clouds often need debt or equipment-backed capital alongside venture equity. The most aggressive public debt signal comes from Futuriom, which reported that TensorWave had completed an $800M delayed-draw term-loan tranche backed by GPU inventories and long-term contracts. That claim fits TechCrunch's earlier reporting that management planned to use GPUs as collateral, but the current source pack does not contain a public filing, lender announcement, or covenant package confirming debt size, draw conditions, pricing, collateral tests, or maturities. Capital adequacy therefore depends less on whether TensorWave can raise headline equity and more on whether it can fund power, GPUs, networking, liquid cooling, and working capital without overextending on opaque debt against demand that may normalize.",
