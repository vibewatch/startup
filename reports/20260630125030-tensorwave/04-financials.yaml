    {
      "id": "unit-economics",
      "title": "Unit economics and sales-efficiency proxies",
      "body": "Public unit-economics evidence is still directional, but it is stronger than a pure marketing-only read. TensorWave publishes accelerator node pricing for MI300X, MI325X, and MI355X, which at least anchors list economics. The product pages also show key hardware inputs \u2014 192GB, 256GB, and 288GB of HBM3E respectively; 3.2Tb/s node interconnects; and direct liquid cooling on the higher-end nodes \u2014 while TensorWave's fine-tuning and ScalarLM pages argue that the same infrastructure can support multiple workload types with shared observability and orchestration. That matters because utilization is likely the dominant gross-margin lever. Modular's TensorWave case study advertises up to 70% total cost savings, and the AMD case study says MI355X plus Modular MAX delivered up to 2x throughput and roughly 40-60% savings versus NVIDIA B200, but AMD explicitly notes that those performance and savings claims were provided by TensorWave and/or Modular and were not independently verified. On the demand side, TechCrunch reported a progression from $3M ARR in October 2024 to management guiding for more than $100M revenue run rate in 2025, but there is still no 2026 revenue update, no gross margin disclosure, and no cohort-level retention data. The best external cost-structure comparators remain public neocloud commentary: CoreWeave's materials argue that storage can reach roughly one-third of total AI-cloud cost and that dedicated GPU-billed economics beat token pricing at 70-90% sustained utilization, while Credo's TensorWave release frames higher cluster utilization and time-to-first-token as economically decisive. The resulting view is that TensorWave probably has a real list-pricing and hardware-efficiency story, but the private metrics needed to prove margin quality remain undisclosed.",
