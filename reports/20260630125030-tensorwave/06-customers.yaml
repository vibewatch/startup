    {
      "id": "customer-segmentation-and-buyer-map",
      "title": "Customer Segmentation and Buyer Map",
      "body": "TensorWave's public customer surface is concentrated in technically sophisticated buyers rather than mass-market, self-serve developers. Its official product and solutions pages emphasize model training, inference, enterprise suite support, managed infrastructure, and expert support, which together imply a sales-led buyer motion oriented toward AI labs, enterprise platform teams, and operators with meaningful workload scale. The named proof set reinforces that pattern. Moreh is an inference-software company serving data centers and enterprise teams. Zyphra is a frontier-model lab and AMD-based cloud platform. Featherless is a serverless LLM-hosting provider. Modular appears as a software ecosystem partner that helps enterprise inference workloads run on TensorWave's AMD stack. AstraZeneca stands out as the clearest regulated-enterprise proof because the buyer is a global life-sciences company migrating research workflows from NVIDIA to TensorWave-hosted AMD infrastructure. AT&T, by contrast, is ecosystem proof through Open Telco AI rather than clean evidence of direct customer revenue. This means TensorWave's public references span multiple buyer types, but they are skewed toward infrastructure-literate adopters who are already motivated to escape NVIDIA lock-in or optimize frontier workloads rather than toward a broad disclosed base of conventional enterprise accounts.",
