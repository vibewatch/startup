    {
      "id": "named-proof-quality-and-limitations",
      "title": "Named Proof Quality and Limitations",
      "body": "The strongest direct proof is AstraZeneca. Both TensorWave and AMD say AstraZeneca moved REINVENT4, SemlaFlow, and SwinUNETR workloads from NVIDIA-based infrastructure onto TensorWave-hosted MI300X GPUs, and AMD published concrete improvements: 49% faster SemlaFlow training, 41% faster REINVENT4 across four configurations, and up to 1.8x faster SwinUNETR training, with no significant code changes. Moreh is the clearest next-generation inference proof: TensorWave says Moreh used MI355X nodes to validate frontier inference workloads, cut model-weight download time to about one quarter of prior environments, and saw material bandwidth and GEMM improvements, while Moreh's own site confirms it is an AMD-focused inference-software vendor. Zyphra adds frontier-training credibility; TensorWave says Zyphra trained ZAYA1-Base on 1,024 MI300X GPUs and uses AMD for VRAM, batch-size, and cost advantages, while Zyphra's own site frames the company as an AMD-based open-model platform. Featherless is helpful but weaker as direct customer proof: it speaks to model-size preferences, reliability thresholds, and an AMD MI300X performance result, yet the public record does not disclose TensorWave contract size or production scope. Modular and AT&T are even more qualified. Modular proves deployability, portability, and partner-led economics around TensorWave, while AT&T/Open Telco AI proves TensorWave is embedded in a serious operator ecosystem. Neither, from public evidence alone, cleanly proves direct end-customer revenue in the way AstraZeneca does. Across the whole set, public proof is strongest on technical workloads and weakest on commercial depth.",
