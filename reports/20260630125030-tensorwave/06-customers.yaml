      "id": "adoption-trajectory-and-proof-surface",
      "title": "Adoption Trajectory and Proof Surface",
      "body": "TensorWave's commercialization trajectory is visible indirectly rather than through disclosed customer-base metrics. TechCrunch reported in October 2024 that the company had started onboarding customers in preview, used hourly pricing with a six-month minimum contract, and would not disclose customer count. By May 2025, TechCrunch reported more than $100 million of run-rate revenue and an 8,192-GPU MI325X dedicated training cluster, suggesting demand formation and a shift toward larger reserved-capacity deployments. In 2026, Credo's partnership release and Review-Journal's Series B coverage continued the same pattern: they point to AI labs and enterprise customers, higher cluster utilization, faster time-to-first-token, production reliability, and expanded customer-success hiring, but still no denominator for active accounts, paid production users, or repeat purchase behavior. The public proof surface retained for this chapter contains six named entities or ecosystems with TensorWave-linked workload evidence, five of which are direct workload stories and four of which disclose quantitative outcomes. That is enough to show that TensorWave is past pure concept-stage marketing. It is not enough to answer the most investor-relevant adoption questions, namely how many customers are active today, how many are in production versus pilot, and how much revenue is concentrated in a small set of accounts or partners.",
