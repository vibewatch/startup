    "number": 6,
    "title": "Customers",
    "summary": "TensorWave's public customer evidence shows real workload adoption across AI-native software vendors, frontier model labs, and at least one regulated enterprise, but the proof set is still narrow and heavily vendor-authored. Moreh, AstraZeneca, Zyphra, Featherless, and the Modular ecosystem provide useful evidence that TensorWave can support production-grade AMD workloads, while AT&T/Open Telco AI is better read as ecosystem validation than direct paying-customer proof. The biggest diligence gap is durability: TensorWave still does not disclose customer count, renewal metrics, or concentration, so public evidence proves technical adoption more clearly than recurring revenue quality."
