    {
      "id": "concentration-risk-and-public-evidence-limits",
      "title": "Concentration Risk and Public Evidence Limits",
      "body": "Concentration risk cannot be underwritten from the public record. TensorWave does not disclose top-customer revenue share, contract-value concentration, partner-sourced versus direct revenue mix, or whether a small set of AI-native accounts drives utilization. That matters because the proof set is narrow and thematically clustered: it leans toward AMD-forward infrastructure partners, frontier-model builders, and benchmark-heavy technical adopters. If a handful of these accounts or ecosystems represent a large share of pipeline or committed spend, the company could look diversified in marketing while remaining concentrated in economics. Public evidence quality is also uneven. Much of the strongest proof is authored by TensorWave itself or by aligned partners such as AMD and Modular. AMD's own case study explicitly says key performance and cost claims were supplied by TensorWave and/or Modular and were not independently verified. Third-party adverse context sharpens the concern. Futuriom argues that neocloud differentiation may commoditize as GPU supply normalizes and price-performance spreads across more providers, while The Next Web says TensorWave is effectively betting that customers want a second source badly enough to switch from entrenched NVIDIA habits. The net result is a credible technical-adoption story with meaningful public evidence limits on concentration, retention, and proof independence.",
