    "number": 7,
    "title": "Risks",
    "summary": "TensorWave's heaviest residual risks are structural rather than cosmetic: the company is underwriting an AMD-only cloud thesis in a market where CUDA remains the production default, public evidence still shows AMD's training software maturity lagging NVIDIA, and the business is scaling capital-intensive campus commitments faster than the public record explains debt, cooling, water, or customer concentration. Public mitigants\u2014managed orchestration, SOC 2 / ISO 27001 posture, HIPAA-oriented controls, trust-center disclosures, and repeated capacity financings\u2014are real, but they do not fully offset supplier dependence, campus execution risk, compliance diligence, or valuation sensitivity to an AMD adoption miss."
  },
  "sections": [
    {
      "id": "ranked-residual-risk-stack",
      "title": "The top residual risks cluster around lock-in, campus execution, and underwriting opacity",
      "body": "TensorWave's risk stack is severe because several independent dependencies reinforce one another. The company is not just renting GPUs; it is asking customers and investors to accept an AMD-only supply chain, an evolving ROCm software stack, and a fast-moving multigigawatt campus buildout all at once. Public evidence supports real mitigants\u2014managed orchestration, liquid-cooled systems, trust-center artifacts, expert support, and repeated investor backing\u2014but those mitigants are still thinner than the underlying obligations they are meant to offset. The hardest residual exposures are the ones that compound: if AMD software remains less production-ready than NVIDIA for important training paths, TensorWave may need more services effort to win customers; if campus execution slips, utilization and financing assumptions worsen; and if customer count stays opaque, outsiders cannot tell whether rising capacity is matched by diversified demand. The investment implication is that TensorWave's downside is less about one bad quarter and more about several interlocking execution assumptions failing together.",
