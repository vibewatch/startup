  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "TensorWave competes in a fast-growing but narrowing slice of AI infrastructure: specialist third-party cloud capacity for training and inference workloads where buyers value AMD compatibility, provisioning speed, compliance, and open-stack economics. The market signal is bullish on demand but mixed on pricing power, because public growth projections for inference and specialist clouds coexist with analyst warnings that GPU rentals are already a buyers\u2019 market with commoditization risk."
  },
  "sections": [
    {
      "id": "section-1",
      "title": "Market boundary and status-quo substitutes",
      "body": "TensorWave is not selling generic cloud compute; it is selling specialist AI infrastructure built around AMD-only training and inference clusters. The relevant market boundary therefore sits inside third-party AI infrastructure spend: dedicated GPU clusters, managed orchestration, high-speed storage, and networking for model training, fine-tuning, and production inference. Included spend is the stack that helps a buyer run its own workloads on rented AI infrastructure. Excluded spend is general-purpose CPU cloud, traditional enterprise SaaS, and closed API model consumption where the buyer does not control the model or cluster. Status-quo substitutes are hyperscaler GPU or custom-silicon stacks, closed-model APIs, and self-hosted clusters. TensorWave\u2019s pitch matters most when buyers want a non-NVIDIA supply lane, more memory-oriented configurations, or an open ROCm-based path without standing up their own data-center operations.",
      "claimRefs": [
        "CM001",
