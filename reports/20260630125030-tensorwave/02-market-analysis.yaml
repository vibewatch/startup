    },
    {
      "id": "section-3",
      "title": "Buyer segmentation and adoption path",
      "body": "The most plausible early buyers are AI-native model builders, inference-heavy application companies, and enterprise platform teams that need dedicated capacity without building their own infrastructure. Official product pages emphasize training, fine-tuning, inference, Kubernetes, Slurm, and compliance rather than pure self-serve experimentation, which implies that TensorWave is optimized for infrastructure buyers, not casual developers. Business Wire says Fireworks AI and Luma AI are already using the platform, while Credo\u2019s partner announcement describes AI labs and enterprise customers as the target cluster buyers. Regulated or cost-sensitive enterprises are a second important segment because SOC 2 Type II, ISO 27001, and HIPAA claims narrow the vendor field. Adoption likely begins with a specific workload pain point\u2014GPU scarcity, memory-heavy inference, or cost pressure\u2014then moves through proof-of-concept, reserved cluster deployment, and finally multi-site expansion once uptime and orchestration prove out.",
      "claimRefs": [
        "CM003",
        "CM004",
        "CM005",
        "CM007",
        "CM029",
        "CM035",
        "CM038"
      ],
      "tableRefs": [
