    {
      "id": "section-2",
      "title": "TAM, SAM, and observable sizing lenses",
      "body": "The broadest public TAM proxy is large and still expanding: CoreWeave, citing Futurum, projects inference semiconductor demand reaching $885 billion by 2030, while specialist providers are expected to grow faster than hyperscalers. That headline figure is too broad for TensorWave, however, because it captures all inference silicon and not the narrower spend pool for third-party AI cloud capacity. A more decision-useful TensorWave lens triangulates from disclosed company scale and category structure: TensorWave reports more than 2 gigawatts of secured capacity and 8,192 MI325X GPUs online, while TechCrunch reported run-rate revenue above $100 million in 2025. Those facts support a constrained 2026 SAM estimate of roughly $5 billion to $15 billion for specialist third-party AI cloud spend where AMD compatibility, faster provisioning, and open-stack economics matter. Public disclosures still do not isolate a clean SOM, so the report preserves that uncertainty rather than inventing precision.",
      "claimRefs": [
        "CM010",
