    "summary": "TensorWave has enough scale proof to warrant serious diligence, but the public record still supports only a research-more recommendation at the June 2026 $1.55B post-money mark. The company’s 8,192-GPU cluster, >2GW capacity claim, and >$100M run-rate proxy make a bull case plausible, yet neocloud commoditization, debt opacity, and a rich implied multiple keep the valuation stance stretched and the risk rating high."
