    {
      "id": "capital-formation-and-infrastructure",
      "title": "Capital formation and infrastructure buildout",
      "body": "TensorWave\u2019s financing cadence is the single biggest reason the company now deserves attention as more than a niche infrastructure startup. The public trail begins with the October 2024 $43 million SAFE, which gave the business a clean first funding milestone and a Nevada-record narrative. By May 2025, TensorWave had raised a $100 million Series A led by Magnetar and AMD Ventures, and contemporaneous TechCrunch reporting paired that round with management\u2019s claim that 2025 revenue run-rate would exceed $100 million. By June 2026, the company had added a $350 million Series B at a $1.55 billion valuation, with Magnetar and AMD Ventures again leading and continued participation from prior investors. That sequence shows not just capital access but repeated investor willingness to double down on the AMD-cloud thesis.\n\nInfrastructure scale claims have grown just as quickly. Public sources support a 1 GW TECfusions capacity commitment in late 2024, an 8,192-GPU MI325X cluster by mid-2025, and a January 2026 expansion that added 10 MW each in Tucson and Pennsylvania. The strongest June 2026 company-backed disclosures say TensorWave has secured more than 2 GW of long-term capacity and is pushing MI355X deployments into additional North American regions. Those are meaningful proof points for speed of execution, but the chapter should still separate verified physical milestones from broader future-capacity language. The balance-sheet story is strong enough to establish scale, yet the exact debt structure, lender economics, and asset-level obligations remain materially under-disclosed in public sources.",
