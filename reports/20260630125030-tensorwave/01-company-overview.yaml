  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "TensorWave is a Las Vegas-founded, AMD-exclusive AI infrastructure startup that publicly positions itself as an open-ecosystem alternative to NVIDIA-centric cloud compute. The public record supports a rapid capital and infrastructure buildout from a $43 million SAFE in October 2024 to a $350 million Series B at a $1.55 billion valuation in June 2026, alongside an 8,192-GPU AMD training cluster and more than 2 GW of claimed long-term data-center capacity. The strongest caveats are governance opacity, incomplete customer-count disclosure, and persistent ecosystem risk from CUDA lock-in and AMD software maturity."
  },
  "sections": [
    {
      "id": "identity-platform-and-geography",
      "title": "Identity, platform, and geographic anchor",
      "body": "TensorWave should be understood first as a specialist AI infrastructure company, not as a generic cloud reseller. Its official materials repeatedly frame the business as an AMD-only cloud built for serious AI training and inference, with an explicit pitch around memory-intensive workloads, open tooling, and lower vendor lock-in. The core commercial story is therefore not simply \u201crent GPUs by the hour,\u201d even though that is part of the delivery model; it is that TensorWave wants to package hardware choice, managed infrastructure, support, and portability into a usable alternative for teams that do not want to remain fully exposed to the NVIDIA stack. The current website, AMD case-study material, and TensorWave\u2019s product pages all reinforce that positioning.\n\nPublic evidence is also unusually clear on geography for a young neocloud. Independent reporting and company materials consistently point to Las Vegas as the operating center, and the June 2026 Review-Journal interview adds a concrete headquarters signal at Town Square while noting continued investment in the local startup community. That local anchor matters because TensorWave is selling a scale-heavy infrastructure narrative from outside the usual Bay Area, Seattle, or Northern Virginia cluster. It helps explain both the company\u2019s fundraising story inside Nevada and why later chapters should treat Las Vegas as the default corporate-home signal unless management provides a different legal-entity map.",
