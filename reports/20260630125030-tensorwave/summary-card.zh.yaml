  topStrengths:
    - 融资和基础设施扩张很快：Series B 估值 $1.55B、8,192-GPU 集群，并声称容量 >2GW。
    - AMD-only 定位清晰，产品栈、公开标价和托管基础设施层可见，不只是转售裸 GPU。
    - 在 AI-native 运营商和 AstraZeneca 受监管生命科学用例中，已有具名工作负载证据。
  topRisks:
    - 债务结构、贷款方条款、契约和股权结构表中的优先权经济账仍高度不透明。
    - 公开客户证据范围窄，且多由合作伙伴撰写；客户数、集中度、续约指标都未披露。
    - 依赖 AMD / ROCm 生态，同时面对 CUDA 锁定风险；在拥挤的 neocloud 市场里，利用率、定价和采用都可能承压。
  unresolvedGaps:
    - 完整债务方案细节，包括贷款方身份、借款基数机制、契约、到期结构和清算影响。
    - 当前客户数、头部客户集中度、试点与生产的比例，以及 NRR、GRR、logo 流失等留存指标。
    - 经审计的 2025-2026 年收入、毛利率、烧钱速度、现金跑道和现金余额披露。
    - 独立证据需要证明，已锁定电力和 >2GW 容量声称正在转化为可持续的合同利用率和 backlog。
    - 当前董事会构成、治理权利和投资人控制结构。
