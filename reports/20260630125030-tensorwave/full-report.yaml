  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              TensorWave is not selling generic cloud compute; it is selling specialist AI infrastructure built around
              AMD-only training and inference clusters. The relevant market boundary therefore sits inside third-party
              AI infrastructure spend: dedicated GPU clusters, managed orchestration, high-speed storage, and networking
              for model training, fine-tuning, and production inference. Included spend is the stack that helps a buyer
              run its own workloads on rented AI infrastructure. Excluded spend is general-purpose CPU cloud,
              traditional enterprise SaaS, and closed API model consumption where the buyer does not control the model
              or cluster. Status-quo substitutes are hyperscaler GPU or custom-silicon stacks, closed-model APIs, and
              self-hosted clusters. TensorWave’s pitch matters most when buyers want a non-NVIDIA supply lane, more
              memory-oriented configurations, or an open ROCm-based path without standing up their own data-center
              operations.
