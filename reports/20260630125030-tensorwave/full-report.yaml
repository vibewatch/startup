      - number: '7.4'
        title: Compliance posture is improving, but legal transparency and organizational scaling are still incomplete
        blocks:
          - type: paragraph
            body: >-
              TensorWave's public compliance surface is better than that of many private infrastructure startups. The
              security page and trust center together show SOC 2 Type II, ISO 27001, HIPAA-oriented safeguards, pentest
              summaries, vulnerability disclosure processes, and a defined response channel. That matters because
              regulated buyers need evidence that infrastructure controls exist before they will even begin
              proof-of-concept work. Still, the public package is not yet sufficient to close diligence. HHS makes clear
              that a cloud provider handling ePHI becomes a business associate with contractual duties, direct
              regulatory liability, and subcontractor-agreement obligations; TensorWave's fetched materials do not
              include a public BAA, SLA, or breach-notification package that would let a healthcare buyer pre-clear the
              risk. The privacy policy is also broad about service-provider sharing, jurisdictional transfers, and
              law-enforcement disclosure, while the public terms are website terms with mandatory arbitration and a $50
              liability cap—not the commercial paper investors would want to review. At the same time, Review-Journal
              says the company plans to roughly double headcount while adding more sites, which raises execution risk
              around leadership depth, compliance ownership, and customer-success capacity.
