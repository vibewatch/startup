  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The top residual risks cluster around lock-in, campus execution, and underwriting opacity
        blocks:
          - type: paragraph
            body: >-
              TensorWave's risk stack is severe because several independent dependencies reinforce one another. The
              company is not just renting GPUs; it is asking customers and investors to accept an AMD-only supply chain,
              an evolving ROCm software stack, and a fast-moving multigigawatt campus buildout all at once. Public
              evidence supports real mitigants—managed orchestration, liquid-cooled systems, trust-center artifacts,
              expert support, and repeated investor backing—but those mitigants are still thinner than the underlying
              obligations they are meant to offset. The hardest residual exposures are the ones that compound: if AMD
              software remains less production-ready than NVIDIA for important training paths, TensorWave may need more
              services effort to win customers; if campus execution slips, utilization and financing assumptions worsen;
              and if customer count stays opaque, outsiders cannot tell whether rising capacity is matched by
              diversified demand. The investment implication is that TensorWave's downside is less about one bad quarter
              and more about several interlocking execution assumptions failing together.
