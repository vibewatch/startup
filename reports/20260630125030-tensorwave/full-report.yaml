      - number: '8.2'
        title: Financing Context, Debt Sensitivity, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record is unusually well publicized for such a young infrastructure company, but the
              important parts are still opaque. Public reporting supports a progression from a $43 million SAFE in
              October 2024 at a $100 million post-money valuation, to a $100 million Series A in May 2025, to a $350
              million Series B in June 2026, for roughly $493 million of disclosed equity capital in under two years.
              Just as important, public sources tie TensorWave to a 1 gigawatt Tecfusions agreement, a later 20 megawatt
              expansion, and more than 2 gigawatts of long-term capacity claims. That is the basic reason the company
              can justify a premium to ordinary software startups: investors are underwriting a rapidly assembled
              physical-compute platform, not merely software adoption.


              But entry discipline must center on what the public record still does not show. Futuriom reports an $800
              million delayed-draw term-loan tranche backed by GPU inventories and long-term contracts, while TechCrunch
              separately reported management's intent to use GPUs as collateral for debt financing. Yet the current
              source pack does not include a lender announcement, covenant package, borrowing-base formula, maturity
              ladder, or liquidation waterfall. Without those details, investors cannot tell whether the $1.55 billion
              post-money sits above a clean common-equity claim or above a growing stack of senior obligations and
              preference rights. A disciplined investor should therefore underwrite TensorWave as price-sensitive: the
              company may be good, but the return case depends on debt terms, cap-table structure, customer
              concentration, and how much future dilution is still needed to convert secured power into monetized
              capacity.
