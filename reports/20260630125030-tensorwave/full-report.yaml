      - number: '8.3'
        title: Comparable Set and Valuation Anchors
        blocks:
          - type: paragraph
            body: >-
              CoreWeave is the most useful public anchor, even if it is not a perfect one. CoreWeave's current
              public-market data show roughly $52.1 billion of market capitalization, about $85.0 billion of enterprise
              value, and around 13.65x EV/revenue on trailing revenue of roughly $6.23 billion. Its own shareholder
              letter also highlights more than $5 billion of annual revenue, $66.8 billion of backlog, 850+ megawatts of
              active power, and $18 billion of debt-and-equity capital raised in 2025. Those numbers matter because they
              frame what the market will pay for a scaled AI cloud that has already demonstrated revenue, backlog, and
              capital-markets access. On that basis, TensorWave's $1.55 billion mark against a >$100 million 2025
              run-rate proxy implies roughly 15.5x revenue, slightly richer than CoreWeave's public multiple despite far
              less disclosure and much less operating proof.


              Nebius is the other public neocloud reference, but it is a much hotter and noisier one. Yahoo Finance
              showed about $66.3 billion of market capitalization and 75.75x EV/revenue on June 29, 2026, while
              independent taxonomy work describes Nebius as a fast-scaling AI cloud with multibillion-dollar strategic
              contracts and up to 800 megawatts to 1 gigawatt of connected capacity expected online by year-end 2026.
              That is useful evidence that public markets can still award extreme AI-infrastructure premiums, but it is
              not a clean underwriting anchor for TensorWave because Nebius reflects a different contract base,
              strategic context, and investor narrative. Private peers such as Lambda, Crusoe, Together AI, and Cerebras
              are useful mainly as relevance checks: they validate that neocloud and inference-specialist categories are
              crowded, but the reviewed pack does not provide enough transparent valuation data to make them primary
              pricing anchors.
