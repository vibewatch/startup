      - number: '3.3'
        title: Capability, Pricing, and Buyer Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              TensorWave's advantage is not just raw GPU access. The company presents a stack that combines bare metal,
              managed Kubernetes, managed Slurm, and a trust posture around SOC 2, ISO 27001, and HIPAA safeguards. That
              package makes TensorWave look more like a full-stack neocloud than an inference API vendor. Together AI
              and Cerebras compete from a different angle: they emphasize managed inference, fine-tuning, research
              optimization, and more explicit packaging or pricing posture. Oracle narrows TensorWave's AMD
              differentiation inside the hyperscaler tier by advertising both NVIDIA and AMD bare-metal GPUs with no
              long-term commitments, while Google and AWS offer their own proprietary chip and software paths via TPUs
              and Trainium. Buyers therefore face a practical trade-off. TensorWave is most appealing when a team wants
              AMD memory economics plus one provider willing to own the operational layer around ROCm and clustered
              training or inference. It is weaker when procurement wants simple public pricing, when the buyer already
              sits inside a hyperscaler ecosystem, or when a workload is better served by a narrower inference
              specialist.
