  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      The public workflow starts with workload selection and SKU fit, then moves through provisioning, orchestration,
      monitoring, and ongoing optimization on AMD clusters.
    data:
      nodes:
        - id: workload
          label: Define workload
          description: Customer decides whether the primary job is training, fine-tuning, inference, or mixed use.
        - id: sku
          label: Pick AMD SKU
          description: TensorWave fits MI300X, MI325X, MI355X, or future MI455X / Helios capacity to the workload.
        - id: provision
          label: Provision bare metal
          description: Dedicated hardware is provisioned with direct access and no virtualization layer.
        - id: orchestrate
          label: Choose orchestration path
          description: Teams run Slurm for research or training, Kubernetes for production inference, or both on the same cluster.
        - id: data
          label: Attach data and telemetry
          description: Storage, observability, and security controls are attached to the cluster as operating primitives.
        - id: portability
          label: Add portability / workflow layer
          description: Customers can use ROCm directly or add Modular, Spectral, ScalarLM, or customer-specific tooling.
        - id: execute
          label: Run training or inference
          description: Workloads execute on AMD clusters with monitoring and support loops.
        - id: optimize
          label: Tune and expand
          description: >-
            Solution engineers, events like Beyond Summit, and partner tooling help optimize ROCm and future hardware
            adoption.
      edges:
        - from: workload
          to: sku
          label: match memory / latency / scale needs
        - from: sku
          to: provision
          label: reserve dedicated capacity
        - from: provision
          to: orchestrate
          label: choose control plane
        - from: orchestrate
          to: data
          label: attach ops services
        - from: data
          to: portability
          label: add runtime / workflow layer
        - from: portability
          to: execute
          label: run workloads
        - from: execute
          to: optimize
          label: monitor, tune, and scale
    approximationNotes: >-
      The flow abstracts TensorWave's public delivery model; actual deployments can skip partner layers and operate
      directly on ROCm or customer-owned software.
