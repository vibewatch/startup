      - number: '1.2'
        title: Founders, leadership coverage, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder story is one of TensorWave’s clearest strengths. Darrick Horton, Piotr Tomasik, and Jeff
              Tatarchuk remain the visible operating core, and the public record ties them to prior startup-building
              experience in cloud, crypto-mining infrastructure, marketing technology, and the Las Vegas venture
              ecosystem. TechCrunch and Futuriom together show that Horton and Tatarchuk previously worked together at
              VMAccel, while Tomasik’s prior company-building background gives the team commercial credibility beyond
              pure hardware procurement. That combination helps explain why TensorWave was willing to make a
              concentrated AMD bet: the founders were not arriving cold to accelerator infrastructure.


              Leadership coverage below the founders also appears more complete than a three-person startup narrative
              would suggest. The homepage publicly lists executives spanning finance, operations, information security,
              engineering, AI infrastructure, product architecture, GTM strategy, design, and partnerships, which is
              enough to show that TensorWave has already built a more functional organization than a simple founder-led
              shell. The missing piece is governance transparency. The reviewed public sources do not surface a current
              board roster, committee map, or investor-control structure with enough precision to treat governance as
              closed. For diligence purposes, chapter 1 can rely on the leadership bench as real, but it should preserve
              governance as an open diligence line rather than silently infer board maturity from fundraising momentum.
            claimRefs:
