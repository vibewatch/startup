      - number: '7.3'
        title: Supplier dependence, campus buildout, and capital intensity transmit directly into downside
        blocks:
          - type: paragraph
            body: >-
              TensorWave's commercial upside is tied to a very specific buildout model: secure AMD supply, raise capital
              quickly, sign large campus commitments, replicate high-density deployments across multiple sites, and fill
              those sites before financing terms tighten. The public record shows meaningful progress on that path.
              TensorWave has 8,192 MI325X GPUs online, says it has secured more than 2GW of long-term capacity, and
              expanded from a 1GW Tecfusions commitment into an additional 20MW Arizona and Pennsylvania rollout. But
              the same evidence also defines the residual risk. AMD is simultaneously a core supplier, ecosystem
              sponsor, and investor; Tecfusions is simultaneously a capacity partner and a concentration point for power
              and schedule delivery; and the company has already signaled GPU-collateralized or equity-backed financing
              as part of the scaling model. Independent industry sources also show that the real economics of dense AI
              infrastructure depend on networking, goodput, cooling, substations, and predictable costs—not just cheap
              accelerators. TensorWave has not yet disclosed enough campus-level detail for outsiders to underwrite
              those layers with confidence.
