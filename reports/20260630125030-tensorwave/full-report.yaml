  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Typical TensorWave buyer path from NVIDIA-avoidance or workload need through AMD validation, reserved-capacity
      commitment, and possible expansion into broader ecosystem programs.
    data:
      items:
        - label: Trigger
          detail: >-
            The buyer usually starts with a specific pain point: GPU scarcity, NVIDIA cost, memory-heavy model needs, or
            a domain workflow that needs more control over training and inference infrastructure.
          touchpoints:
            - Need for cheaper or more available frontier compute
            - Memory-heavy model or long-context workload
            - Enterprise desire to avoid single-vendor lock-in
            - Regulated-industry demand for controllable infrastructure
        - label: Evaluation
          detail: >-
            TensorWave's public proof set suggests buyers test AMD viability through hands-on benchmarking, porting, and
            engineering support rather than by swiping a credit card into a generic self-serve API.
          touchpoints:
            - Benchmarking against NVIDIA baselines
            - ROCm / vLLM / model-porting validation
            - White-glove engineering support
            - Cluster, network, and storage fit assessment
        - label: Commit
          detail: >-
            Once the workload passes validation, the buyer appears to move into reserved or scoped infrastructure
            commitments, historically including at least a six-month minimum in TechCrunch's 2024 reporting.
          touchpoints:
            - Reserved-capacity contract or scoped deployment
            - Managed services and expert support
            - Production-readiness and reliability gating
            - Procurement and security review
        - label: Production
          detail: >-
            The best public proofs show production-like usage in enterprise training, frontier-scale training, or
            large-scale inference, with support around runtime stability, networking, and workload tuning.
          touchpoints:
            - AstraZeneca training migration
            - Moreh MI355X validation
            - Zyphra 1,024-GPU training learnings
            - Modular MAX deployment path
        - label: Expansion / Ecosystem
          detail: >-
            Expansion appears to happen through more models, more cluster scale, or deeper ecosystem participation, but
            the public record does not yet quantify whether those motions translate into durable renewal or
            concentration resilience.
          touchpoints:
            - Follow-on model optimization
            - Distributed or heterogeneous cluster expansion
            - Domain ecosystems such as Open Telco AI
            - Partner-led deployment and portability programs
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU012
      - CU017
      - CU033
