  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Debt package
        - >-
          Delayed-draw term-loan lenders, borrowing-base mechanics, covenants, pricing, maturities, and collateral
          release terms
        - Reported debt can radically change common-equity returns and downside severity.
        - CFO + lender term sheets + legal review of debt documents.
      - - Cap table and preference stack
        - Series A / B terms, SAFE conversion mechanics, liquidation preferences, warrants, and option pool
        - Post-money headline is not the same as common-equity value.
        - Finance team + cap-table export + counsel review.
      - - 2026 revenue quality
        - Current run-rate, realized pricing vs list pricing, gross margin, churn, and customer concentration
        - Needed to test whether $1.55B is a premium on real economics or on infrastructure theater.
        - Management accounts + customer cohort bridge + board deck extracts.
      - - Contracted utilization and backlog
        - Signed capacity commitments, average contract length, prepayment profile, and cancellation terms
        - Power and GPU announcements only matter if they convert into durable cash flows.
        - Sales / finance diligence with sample MSAs and top-customer summaries.
      - - Supplier and ecosystem concentration
        - AMD allocation dependency, ROCm migration burden, and fallback path if customers demand Nvidia compatibility
        - The all-AMD thesis is also a single-vendor dependency thesis.
        - Product / engineering review + customer references + roadmap discussion with AMD partner team.
    notes: These asks focus on the minimum evidence required to move from research-more toward track or buy.
    claimRefs:
      - CV005
      - CV012
