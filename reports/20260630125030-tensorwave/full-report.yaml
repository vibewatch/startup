      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The debt stack is the single biggest hidden valuation variable
            body: >-
              Public sources support the existence of GPU-collateralized financing intent and third-party reporting of a
              large delayed-draw facility, but not the specific lender terms. That means the most important unknown is
              not whether TensorWave can raise capital; it is whether common equity still captures attractive upside
              after senior capital and preferences.
            calloutType: risk
            claimRefs:
              - CV019
              - CV041
              - CV045
          - type: callout
            title: TensorWave is already priced closer to a scaled neocloud than to a raw startup
            body: >-
              Using the public >$100M 2025 run-rate proxy, the $1.55B June 2026 valuation implies roughly 15.5x revenue.
              That is not absurd for hot AI infrastructure, but it is already above CoreWeave’s public EV/revenue and
              leaves less room for execution mistakes than the company’s youth might suggest.
            calloutType: insight
            claimRefs:
              - CV001
              - CV005
              - CV016
              - CV023
              - CV040
          - type: callout
            title: The bull case assumes AMD adoption becomes a durable second-source habit
            body: >-
              The company’s all-AMD wedge works only if customers value openness, memory economics, and ROCm portability
              enough to keep routing production workloads away from Nvidia-centered clouds. If that behavior weakens,
              TensorWave becomes a narrower niche rather than a platform-level comp to larger neoclouds.
            calloutType: assumption
            claimRefs:
              - CV033
              - CV035
              - CV039
          - type: callout
            title: What would upgrade the call
            body: >-
              A move from research-more to track or buy needs three things: verified 2026 revenue quality, full debt and
              preference disclosure, and evidence that contracted utilization is compounding faster than neocloud
              pricing pressure. Without those, the headline scale story is still not enough to clear the current price.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV019
              - CV045
              - CV046
