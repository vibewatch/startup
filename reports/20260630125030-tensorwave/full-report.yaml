  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance to TensorWave
      - Key limitation
    rows:
      - - TensorWave (latest private round)
        - '> $100M 2025 revenue run-rate proxy; 8,192 MI325X online; >2GW capacity claim'
        - $1.55B post-money in June 2026; ~15.5x run-rate using the public proxy
        - Direct pricing reference for the asset being diligenced.
        - Run-rate is management-reported, not audited, and debt/preference structure is undisclosed.
      - - CoreWeave (CRWV)
        - ~$6.23B trailing revenue; 2025 letter cites >$5B annual revenue and $66.8B backlog
        - ~$52.1B market cap; ~13.65x EV/revenue on June 29, 2026
        - Best public neocloud anchor for scaled AI infrastructure with disclosed financing and backlog.
        - Much larger scale, broader customer proof, and far deeper capital-markets access than TensorWave.
      - - Nebius (NBIS)
        - ~$877.9M trailing revenue; fast-scaling public AI cloud with major strategic contracts
        - ~$66.3B market cap; ~75.75x EV/revenue on June 29, 2026
        - Shows how hot public AI-cloud marks can get when strategic demand narratives are strong.
        - An unusually rich and noisy public comp that is not a clean underwriting anchor for a private company.
      - - Lambda
        - Neocloud provider in the same 2026 taxonomy cohort as CoreWeave, Crusoe, and Nebius
        - Private; reviewed pack confirms category relevance, not a transparent current valuation mark
        - Useful direct-peer check on customer alternatives in GPU-native cloud.
        - Current pack does not provide a clean, public valuation or revenue multiple for underwriting.
      - - Together AI / Cerebras
        - Inference-optimized peers rather than full-cluster neocloud twins
        - Private / specialized; valuation not used as a primary anchor here
        - Useful boundary comps for where managed inference diverges from full-stack infrastructure ownership.
        - Business model differs materially from TensorWave’s cluster-led and power-led story.
      - - Crusoe
        - Service-led AI infrastructure peer in the neocloud bucket
        - Private; relevance confirmed by taxonomy and analyst references, but no clean current public valuation in pack
        - Helpful peer for managed AI infrastructure and capital-intensity comparison.
        - Reviewed material is strategically useful but not sufficient for precise pricing work.
