  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              TensorWave has a real investment case, but it is a financing-sensitive one rather than a clean
              quality-at-any-price story. The pro case starts with proof that the company has moved beyond pitch-deck
              status: by June 2026 it had raised a $350 million Series B at a $1.55 billion valuation, reported 8,192
              MI325X GPUs online, and said it had secured more than 2 gigawatts of long-term capacity. Public product
              pages also now expose list pricing for MI300X, MI325X, and MI355X nodes, which lets an investor
              triangulate revenue potential instead of relying purely on marketing copy. Combined with CEO guidance that
              TensorWave was on track to exceed a $100 million revenue run rate in 2025, the company plausibly belongs
              in the serious neocloud cohort rather than the speculative-edge startup bucket.


              The anti-thesis is that the mark already prices in a large part of that future. TNW says the Series B
              valuation is nearly four times the roughly $400 million prior mark, while TechCrunch and Futuriom both
              describe a debt-and-equity-funded infrastructure race where collateralized GPU finance, long-term power
              commitments, and sustained AI demand all need to cooperate. SemiAnalysis meanwhile calls the GPU rental
              market a buyers' market with more than 100 providers competing and falling compute prices over time. That
              makes TensorWave's all-AMD posture both its wedge and its concentration risk: if customers want a second
              source and ROCm portability improves, the company can grow into the mark; if CUDA inertia, pricing
              pressure, or leverage overwhelm that wedge, the current valuation can compress quickly.
