      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is mixed. Positive signals are real: TensorWave has raised large amounts of capital
              quickly, secured AMD-aligned ecosystem support, publicly named enterprise or AI-native users, and backed
              its expansion story with measurable cluster and megawatt announcements. Those signals make it more
              credible than a typical early neocloud. But the negative signals are equally material. SemiAnalysis
              describes a buyers' market for GPU rentals, with more than 100 providers competing and older-card pricing
              falling; TNW argues that neocloud buildouts are fundamentally debt-and-equity-fueled bets on sustained AI
              demand; and Futuriom questions whether neocloud differentiation can hold if the sector commoditizes.
              Against that backdrop, TensorWave still does not disclose realized pricing, revenue recognition, gross
              margin, customer concentration, backlog quality, cash on hand, runway, or signed debt terms. The current
              public record is therefore good enough to support a narrative of scaling and financing momentum, but not
              good enough to underwrite revenue quality or margin durability. Before taking a strong view, diligence
              needs management-level disclosure on customer mix, contract duration, utilization, power and network cost
              per cluster, current cash and burn, and every debt or GPU-financing instrument supporting the buildout.
