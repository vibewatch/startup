chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and geographic anchor
        blocks:
          - type: paragraph
            body: >-
              TensorWave should be understood first as a specialist AI infrastructure company, not as a generic cloud
              reseller. Its official materials repeatedly frame the business as an AMD-only cloud built for serious AI
              training and inference, with an explicit pitch around memory-intensive workloads, open tooling, and lower
              vendor lock-in. The core commercial story is therefore not simply “rent GPUs by the hour,” even though
              that is part of the delivery model; it is that TensorWave wants to package hardware choice, managed
              infrastructure, support, and portability into a usable alternative for teams that do not want to remain
              fully exposed to the NVIDIA stack. The current website, AMD case-study material, and TensorWave’s product
              pages all reinforce that positioning.


              Public evidence is also unusually clear on geography for a young neocloud. Independent reporting and
              company materials consistently point to Las Vegas as the operating center, and the June 2026
              Review-Journal interview adds a concrete headquarters signal at Town Square while noting continued
              investment in the local startup community. That local anchor matters because TensorWave is selling a
              scale-heavy infrastructure narrative from outside the usual Bay Area, Seattle, or Northern Virginia
              cluster. It helps explain both the company’s fundraising story inside Nevada and why later chapters should
              treat Las Vegas as the default corporate-home signal unless management provides a different legal-entity
              map.
