      - number: '7.2'
        title: CUDA lock-in and AMD software maturity remain the most structural technical risks
        blocks:
          - type: paragraph
            body: >-
              The central technical risk is that TensorWave is trying to monetize AMD openness in a market that still
              behaves as if CUDA is the production default. SCALE's 2026 ecosystem work and NVIDIA's own toolkit
              position both point to the same conclusion: developers, libraries, and operating habits remain heavily
              NVIDIA-centered. SemiAnalysis then sharpens the risk from abstract ecosystem theory into concrete
              operational evidence, arguing that AMD's public-release training stack still required too much tuning, too
              many workarounds, and too much direct engineering support to match the smoother NVIDIA experience.
              TensorWave does have a mitigation story here. Its enterprise and training pages promise a software layer
              that unifies training and inference, managed Kubernetes and Slurm, checkpointing, topology-aware
              placement, and monitoring. AMD's case study and ROCm documentation show that portability and open tooling
              are real engineering paths. But the residual risk stays high because the mitigation is still inseparable
              from AMD continuing to close gaps quickly enough for real customer workloads, not just benchmark demos.
