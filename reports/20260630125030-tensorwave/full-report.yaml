  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              TensorWave's public product surface implies a hybrid infrastructure-and-services revenue model rather than
              a clean self-serve API business. Official pages show monetizable surfaces spanning bare-metal GPU rentals,
              managed Slurm and Kubernetes operations, inference infrastructure, training clusters, fine-tuning
              workflows, and hands-on support. The company emphasizes full-machine ownership, cluster-scale inference,
              enterprise support, and utilization optimization, which is consistent with longer-duration enterprise or
              research contracts instead of pure per-token spot spend. Unlike many private AI-cloud peers, TensorWave
              now publishes headline accelerator pricing on several official product pages: MI300X at $1.71 per GPU
              hour, MI325X at $2.25 per GPU hour, and MI355X at $2.95 per GPU hour, each paired with optional managed
              Kubernetes and Slurm. That is useful evidence for top-of-funnel monetization, but it is still not enough
              to model realized revenue because the company does not disclose contract duration, volume discounts,
              managed-service uplifts, or customer-level discounting. A separate TechCrunch report from October 2024
              said TensorWave rented GPU capacity by the hour with a six-month minimum, reinforcing the idea that
              realized revenue may be driven more by reserved-capacity agreements and bespoke cluster design than by
              transparent on-demand catalog pricing alone. Public customer references, such as Fireworks AI, Luma AI,
              Modular, and Credo-backed network design wins, support demand formation, but they do not reveal revenue
              mix, recognition policy, or customer concentration.
