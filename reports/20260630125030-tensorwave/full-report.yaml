      - number: '8.4'
        title: Bull / Base / Bear Cases and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: TensorWave converts its AMD-only wedge into a durable second-source
              position for buyers who want memory-heavy training and inference outside the Nvidia stack, the reported
              debt structure remains manageable, and secured capacity translates into signed utilization rather than
              stranded megawatts. Under that path, current list pricing and demonstrated cluster scale make a $200-250
              million revenue run-rate plausible over the next 12-24 months, and a valuation above the current $1.55
              billion mark can be justified. The main public ingredients that support this case are the 8,192-GPU
              cluster, >2GW capacity claims, productized pricing, and partner claims around reliability and utilization.


              The base and bear cases both revolve around compression. SemiAnalysis's buyers'-market framing,
              CoreWeave's own discussion of full-stack TCO, and TechCrunch's warnings about overcapacity all point the
              same direction: hourly GPU pricing is not the whole story, and the marginal provider can lose pricing
              power quickly. If TensorWave grows but does so into a commoditizing market with opaque debt and preference
              overhang, the fair value range looks closer to $0.9-1.4 billion than to a venture-style markup from the
              latest round. In the bear case, softer utilization, slower AMD adoption, tighter debt covenants, or a
              reset in public neocloud multiples could drag value into a $0.3-0.7 billion range, implying down-round
              risk. The important point is not the precision of any single scenario; it is that current pricing already
              needs multiple operating and financing assumptions to break right.
