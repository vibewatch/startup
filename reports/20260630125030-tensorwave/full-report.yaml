      - number: '1.4'
        title: Customer proof, partner stack, and active risk signals
        blocks:
          - type: paragraph
            body: >-
              The positive version of the TensorWave story is that the company has begun to accumulate real ecosystem
              proof around its AMD-first bet. The June 2026 Series B release named Fireworks AI and Luma AI as active
              adopters, the February 2026 Credo announcement showed TensorWave integrating hardened interconnect
              components into future cluster builds, and AMD and Modular materials both emphasize portability and
              inference economics as part of the company’s value proposition. Trust-center disclosures, the
              model-training page, and the Beyond Summit event page also show that TensorWave is trying to pair hardware
              scale with a public story around security, ROCm enablement, and developer education.


              The risk layer is just as important. TensorWave’s own 2024 TechCrunch profile disclosed minimum six-month
              contracts and a refusal to publish customer count, which leaves meaningful concentration questions
              unanswered. More structurally, SemiAnalysis argued that AMD’s public training stack was still materially
              behind NVIDIA’s in late 2024 and specifically reported that TensorWave gave AMD free GPU time to help
              debug software issues. SCALE’s 2026 market-share analysis reinforces why that matters: even if AMD
              hardware economics improve, CUDA still dominates public developer mindshare. Finally, The Next Web’s
              framing of AMD funding its own customer is a fair diligence challenge, because TensorWave’s supplier
              concentration and investor alignment are both strengths and dependencies at the same time.
