  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              TensorWave is not competing against one clean peer set. The reviewed material separates the market into
              GPU-native neoclouds, incumbent hyperscalers, inference-first specialists, and the status quo of internal
              build. That framing matters because buyers can solve the same workload in multiple ways. A frontier model
              team that cares most about bare-metal control, fast provisioning, and hands-on cluster help will look
              first at neoclouds such as CoreWeave, Lambda, Nebius, and Crusoe. A latency-sensitive product team can
              instead choose Together AI or Cerebras if the priority is managed inference rather than owning the full
              cluster surface. Large enterprises with existing cloud commitments can stay inside AWS, Azure, Google
              Cloud, or Oracle and accept a different trade-off between price, provisioning speed, governance, and
              ecosystem depth. The practical implication is that TensorWave has to beat different competitors on
              different attributes, not just prove that AMD hardware is viable.
            claimRefs:
              - CP009
              - CP010
