      - number: '6.4'
        title: Retention and Durability Gaps
        blocks:
          - type: paragraph
            body: >-
              Durability is where TensorWave's public customer evidence becomes thin. There is still no disclosed NRR,
              GRR, renewal rate, logo churn, average expansion multiple, or cohort table. The best public repeat-usage
              indicators are qualitative. Moreh says it plans to keep validating distributed inference on TensorWave.
              AstraZeneca and AMD describe deeper co-creation opportunities after the initial migration work.
              TensorWave's telco article frames ongoing operator, researcher, and model-developer collaboration. Those
              are useful signals that customers or partners are not treating TensorWave as a one-off benchmark venue,
              but they are not substitutes for renewal data. The historical six-month minimum contract reported by
              TechCrunch suggests TensorWave was always targeting more durable reserved-capacity relationships than
              commodity spot GPU resale, yet that is still only a starting clue, not evidence of churn performance. The
              chapter therefore includes an illustrative cohort figure only as an industry proxy to visualize the
              missing diligence, not as a factual TensorWave operating metric. The underwriter should treat every
              retention conclusion here as provisional until management provides cohort tables, renewal rates, and the
              split between pilot, committed, and expansion revenue.
