      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most plausible early buyers are AI-native model builders, inference-heavy application companies, and
              enterprise platform teams that need dedicated capacity without building their own infrastructure. Official
              product pages emphasize training, fine-tuning, inference, Kubernetes, Slurm, and compliance rather than
              pure self-serve experimentation, which implies that TensorWave is optimized for infrastructure buyers, not
              casual developers. Business Wire says Fireworks AI and Luma AI are already using the platform, while
              Credo’s partner announcement describes AI labs and enterprise customers as the target cluster buyers.
              Regulated or cost-sensitive enterprises are a second important segment because SOC 2 Type II, ISO 27001,
              and HIPAA claims narrow the vendor field. Adoption likely begins with a specific workload pain point—GPU
              scarcity, memory-heavy inference, or cost pressure—then moves through proof-of-concept, reserved cluster
              deployment, and finally multi-site expansion once uptime and orchestration prove out.
