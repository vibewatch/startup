  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round or heavily structured insider-led financing
        - Next institutional round priced below $1.55B post-money or dominated by harsh senior terms
        - Would indicate that public scale signals did not translate into financeable economics.
        - Treat as thesis break until the waterfall and debt interactions are fully rebuilt.
      - - Debt stress emerges
        - Borrowing-base shrink, covenant breach, or forced collateral posting around GPU finance
        - Would subordinate common-equity upside and compress flexibility exactly when pricing softens.
        - Pause investment work and request full debt package plus lender consent mechanics.
      - - Utilization disappoints
        - >-
          Verified revenue or gross-profit trajectory materially below the >$100M run-rate path despite larger installed
          capacity
        - Would show that GPU count and power do not equal monetization quality.
        - Reset valuation range to base/bear case and require cohort / contract disclosure.
      - - AMD ecosystem adoption stalls
        - Customers require Nvidia/CUDA compatibility that TensorWave cannot bridge economically
        - Would weaken the company’s central differentiation thesis and price premium.
        - Re-rate the company as a subscale niche provider rather than a second-source platform.
      - - Public neocloud multiples reset lower
        - CoreWeave / Nebius rerate materially lower on revenue or leverage concerns
        - Would mechanically compress the private comp set supporting TensorWave’s round mark.
        - Re-open entry pricing even if TensorWave-specific execution remains solid.
    notes: Triggers are chosen for transmission into valuation, not just for operational importance.
    claimRefs:
      - CV016
      - CV017
      - CV019
      - CV023
      - CV026
      - CV035
