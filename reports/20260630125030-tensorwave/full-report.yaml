        - AMD demand narrows, utilization softens, debt covenants tighten, or public neocloud multiples reset lower.
        - $0.3B-$0.7B range, creating meaningful down-round risk versus the June 2026 post-money mark.
        - Customer concentration, collateralized debt stress, and rapid compute-price decline.
        - Supported by buyers-market commentary and the sector’s debt-and-equity-fueled structure.
    notes: >-
      Ranges are analytical estimates, not company guidance, and are intended to stress-test the June 2026 post-money
      valuation rather than predict a single fair value.
