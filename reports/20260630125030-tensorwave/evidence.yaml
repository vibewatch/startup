evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, committee map, and investor-control rights documentation.
    whyItMatters: >-
      Series B scale and repeated AMD/Magnetar participation make governance rights material to any diligence view on
      control, follow-on economics, and independence.
    diligencePath: >-
      Request board deck excerpts, a current cap-table summary, and any public or private governance appendix from
      management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: data-center-footprint
    missingEvidence: Named list of current and next planned data-center sites, with timing and capacity by region.
    whyItMatters: >-
      The public record confirms some sites and expansion intent, but not the full regional footprint or whether claimed
      future capacity is already contracted and energizable.
    diligencePath: >-
      Request a site-by-site deployment schedule, power availability summary, and major lease or capacity
      counterparties.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: customer-gap
    missingEvidence: >-
      Current customer count, concentration by top accounts, and contract mix between training, inference, and managed
      services.
    whyItMatters: >-
      Named logos validate some adoption, but without customer count and concentration data it is impossible to judge
      revenue durability or account dependence.
    diligencePath: Request a customer roster summary with ARR concentration, cohort mix, and referenceable design partners.
    relatedQuestionRefs:
      - QO020
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: debt-gap
    missingEvidence: Delayed-draw term-loan lender identity, collateral package, covenants, draw conditions, and maturity schedule.
    whyItMatters: >-
      Infrastructure companies can look well capitalized on the surface while carrying asset-level obligations that
      materially change equity downside and growth flexibility.
    diligencePath: >-
      Request debt documents or a lender summary memo showing tranche size, counterparties, collateral, covenants, and
      amortization profile.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      An independent market model that separates AMD-compatible third-party AI cloud spend from broad inference
      semiconductor or hyperscaler TAM figures.
    whyItMatters: >-
      Without a direct market dataset, SAM must be triangulated from broader category data and company footprint
      proxies, which weakens valuation precision.
    diligencePath: >-
      Request a specialist analyst dataset or build bottoms-up demand estimates from identified buyer segments and
      comparable cloud contracts.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: som-share
    missingEvidence: >-
      Customer count, utilization, pricing sheets, contract duration, renewal, and workload-mix data sufficient to
      quantify TensorWave market share and SOM.
    whyItMatters: >-
      These private operating metrics determine whether disclosed capacity and run-rate translate into durable market
      position or simply into capital-intensive buildout.
    diligencePath: >-
      Ask management for cohort, utilization, and contract-quality data under NDA and reconcile it with cluster
      expansion timelines.
    relatedQuestionRefs:
      - QM021
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: rocm-portability
    missingEvidence: >-
      Independent third-party benchmarks comparing ROCm portability, cost, and uptime on TensorWave against CUDA-first
      or hyperscaler alternatives for the same workloads.
    whyItMatters: >-
      Most available TensorWave cost/performance proof is company- or partner-authored, which is directionally useful
      but not enough for underwrite-grade conviction.
    diligencePath: >-
      Run customer-reference calls and request reproducible benchmark data on identical models across TensorWave, OCI,
      and NVIDIA-centric clouds.
