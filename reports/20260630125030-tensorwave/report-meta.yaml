companyProfile:
  summary: >-
    TensorWave is a Las Vegas-founded AI infrastructure startup building an
    AMD-exclusive cloud for model training and inference. Public materials show
    the company pairing bare-metal GPU capacity with managed Kubernetes, Slurm,
    storage, observability, security controls, and hands-on support to sell a
    more usable open-stack alternative to NVIDIA-centric clouds. By June 2026,
    the company had progressed from a 2024 $43 million SAFE to a $350 million
    Series B at a $1.55 billion valuation, while public workload proof extended
    from AI-native customers such as Moreh and Zyphra to AstraZeneca's regulated
    life-sciences workloads. The caveat is that financing structure, customer
    durability, and governance disclosure still trail the pace of infrastructure
    expansion.
  foundedDate: '2023-01-01'
