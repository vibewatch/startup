  topStrengths:
    - Rapid financing and infrastructure scale-up to a $1.55B Series B, 8,192-GPU cluster, and >2GW claimed capacity.
    - Clear AMD-only positioning with a visible product stack, list pricing, and managed infrastructure layers beyond raw GPU resale.
    - Real named workload proof across AI-native operators and AstraZeneca's regulated life-sciences use cases.
  topRisks:
    - Debt structure, lender terms, covenants, and cap-table preference economics remain materially opaque.
    - Public customer proof is narrow and partner-authored, with no disclosed customer count, concentration, or renewal metrics.
    - AMD / ROCm ecosystem dependence and CUDA lock-in risk could pressure utilization, pricing, and adoption in a crowded neocloud market.
  unresolvedGaps:
    - Full debt package details, including lender identity, borrowing-base mechanics, covenants, maturity profile, and liquidation implications.
    - Current customer count, top-account concentration, pilot-versus-production mix, and retention metrics such as NRR, GRR, and logo churn.
    - Audited 2025-2026 revenue, gross margin, burn, runway, and cash-balance disclosure.
    - Independent evidence that secured power and >2GW capacity claims are translating into durable contracted utilization and backlog.
    - Current board composition, governance rights, and investor-control structure.
disclaimer: >-
  This report-meta artifact synthesizes only the public evidence captured in the
  TensorWave chapter YAMLs as of 2026-06-30. Because TensorWave is a private,
  capital-intensive infrastructure company, the recommendation is highly
  sensitive to undisclosed debt terms, customer concentration, and audited
