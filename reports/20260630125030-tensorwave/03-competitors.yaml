    {
      "id": "switching-costs-moat-and-adverse-evidence",
      "title": "Switching Costs, Moat, and Adverse Evidence",
      "body": "TensorWave does have switching costs, but they are operational rather than absolute. Once a buyer standardizes on a cluster topology, data path, security process, and framework stack, moving clouds is not free. Yet the same source set shows why lock-in is limited. Multi-cloud is now normal, framework compatibility is broad, and hyperscalers plus neoclouds all claim some mix of orchestration, performance, and enterprise support. CoreWeave's material reinforces that real TCO depends on storage, goodput, and retries rather than on a single GPU-hour number, while Semianalysis and Futuriom both point to a buyer's market and to commoditization pressure across neoclouds. The adverse conclusion is that TensorWave's moat is not permanent access to unique hardware. Its moat is the narrower proposition that a buyer who wants AMD, ROCm help, and one provider to operate the full cluster stack will find TensorWave easier to work with than piecing the same outcome together elsewhere. That is a useful wedge, but public evidence does not yet prove it is a durable one.",
