      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景与下行触发器
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：TensorWave 把全 AMD 切入点转化为耐久的第二供应来源地位，服务那些希望在 NVIDIA
              栈之外获得重内存训练和推理的买方；已报道的债务结构保持可控；已锁定容量转化为已签约利用率，而不是闲置 MW。沿这条路径，当前标价和已展示的集群规模，让未来 12-24 个月达到 $200-250 million
              收入运行率具备合理性，高于当前 $1.55 billion 估值的定价也能成立。支撑这个情景的主要公开要素，是 8,192-GPU 集群、>2GW 容量说法、产品化定价，以及伙伴围绕可靠性和利用率的说法。


              基准情景和悲观情景都围绕压缩展开。SemiAnalysis 的买方市场框架、CoreWeave 自己对全栈 TCO 的讨论，以及 TechCrunch 对产能过剩的警告，都指向同一个方向：按小时 GPU
              定价不是全部故事，边际供应商可能很快失去定价权。如果 TensorWave 增长了，但增长发生在一个商品化加速、债务和优先权负担不透明的市场里，合理价值区间更接近 $0.9-1.4
              billion，而不是在最新一轮基础上继续按风险投资逻辑加价。悲观情景下，利用率偏弱、AMD 采用更慢、债务契约更紧，或公开新型 AI 云倍数重置，都可能把价值拖到 $0.3-0.7 billion
              区间，意味着下轮降价风险。重点不在任何单一情景的精确度，而在于当前定价已经要求多项运营和融资假设同时走对。
