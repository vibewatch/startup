  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与加速器阶梯
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的产品界面不只是单个 GPU 实例页面，而是一套分阶段的 AMD-only 基础设施阶梯：从已定价的 MI300X、MI325X、MI355X 节点开始，延伸到尚未发布的 MI455X /
              Helios 机架级路线图。官方界面上的当前商业模式很清楚。MI300X 被描述为更低 TCO、偏推理的节点，配备 192GB HBM3E 和风冷；MI325X 与 MI355X
              沿阶梯上移，内存更高、采用直接液冷、目录价格也更高；MI455X 虽然价格仍列为 TBD、规格明确写着「expected」，但已经作为下一步机架级产品被营销。裸金属是这套栈底层的基础交付模式，这一点重要，因为
              TensorWave 卖的是确定性硬件访问和内存重 AMD 集群，而不是通用多租户云抽象。实际读法是，当下三条已出货产品线的 SKU 阶梯是真实的，但前沿路线图在 MI455X
              产品具备商业可得性、客户引用和非预期规格之前，仍部分由营销驱动。
