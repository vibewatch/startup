  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              TensorWave 卖的不是通用云计算，而是围绕 AMD-only 训练与推理集群搭建的专业 AI 基础设施。因此，相关市场边界落在第三方 AI 基础设施支出内部：用于模型训练、微调和生产推理的专用 GPU
              集群、托管编排、高速存储和网络。纳入范围，是帮助买方在租用 AI 基础设施上运行自有工作负载的那层技术栈。排除范围，是通用 CPU 云、传统企业 SaaS，以及买方不控制模型或集群的封闭 API
              模型消费。现状替代方案包括超大规模云厂商 GPU 或自研芯片栈、封闭模型 API、自托管集群。买方想要非 NVIDIA 供给通道、更偏内存的配置，或无需自建数据中心运营即可使用开放 ROCm
              路径时，TensorWave 的主张最有价值。
