  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 路径
      - 类别
      - 规模或融资信号
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - TensorWave
        - 直接 neocloud 同行
        - $350M Series B，估值 $1.55B；8,192 块 MI325X GPU；>2 GW 产能
        - 想用 AMD 为主的训练或推理、同时需要托管集群支持的买方
        - 全 AMD 定位、ROCm 对齐、裸金属加托管 Kubernetes 和 Slurm
        - 公开定价不透明；护城河取决于 AMD 采用继续有吸引力
      - - CoreWeave
        - 基准直接对手
        - 2025 年 3 月起在 Nasdaq 上市；Platinum ClusterMAX 主张；覆盖企业和实验室客户
        - 需要成熟编排和可靠性的大型 AI 实验室、初创公司和企业
        - 深耕 AI 云，公开可靠性叙事强，编排故事强
        - 在 AMD 开放性上没有差异化；独立引用质量上可能更难对标
      - - Lambda
        - 直接 neocloud 对手
        - 从 1 块 GPU 扩到单租户超级计算机上的数十万块 GPU
        - 想要专用 NVIDIA 集群和托管支持的团队
        - 单租户基础设施、共同工程、硬件隔离
        - 已审材料以 NVIDIA 优先，而不是 AMD 替代定位
      - - Nebius / Crusoe
        - 服务主导的 neocloud 对手
        - Nebius 披露 TCO 和运营指标；Crusoe 宣传 99.98% 正常运行时间和更低成本主张
        - 优先考虑服务水平、托管运营和经济性的企业与 AI 原生团队
        - 支持投入重、托管 Slurm 或 Kubernetes、服务叙事强
        - 买方更在意支持或正常运行时间、而不是 AMD 身份时，TensorWave 会显得没那么独特
      - - Together AI / Cerebras
        - 相邻推理专家
        - Together 可扩到数千块 GPU；Cerebras 可训练最高 24T 参数模型，并披露定价姿态
        - 看重托管服务或简化训练的推理密集型和研究密集型团队
        - 托管推理、微调，以及比 TensorWave 已审页面更清晰的打包
        - 全集群所有权叙事比 TensorWave、Lambda 或 CoreWeave 更窄
      - - 云厂商：AWS / Google Cloud / Oracle / Azure
        - 既有替代者
        - 20,000-GPU UltraClusters、TPU superpods、OCI 裸金属 AMD GPU，以及企业治理生态
        - 既有云企业客户和受监管买方
        - 生态广度、治理、混合支持和专有芯片选项
        - 成本更高、供给更慢，或定位不如 neocloud 替代方案那样围绕 AMD
      - - 自建
        - 现状替代
        - 由开放框架、K8s、Slurm 和既有云底层组件拼成，而不是单一供应商套件
        - 集成能力强的平台团队
        - 灵活性最高，也无需被迫采用套件
        - 集成和运营负担最高
    notes: 这是 2026 年代表性路径，不是完整普查；表中覆盖已审官方和分析师材料反复出现的竞争对手类别。
