  - id: TU005
    title: 扩张和集中风险表
    columns:
      - 扩张驱动因素
      - 集中风险
      - 影响
      - 尽调路径
    rows:
      - - 带迁移支持的纯 AMD 替代方案
        - 如果切换摩擦高于客户预期，首轮基准测试之后的扩张可能停住
        - 会拖慢概念验证向长期承诺支出的转化
        - 索取与 NVIDIA 路线替代方案对比的输赢数据，以及转为多工作负载扩张的概念验证占比
      - - 技术伙伴生态（Modular、AMD、Credo）
        - 如果把生态项目误当成经常性收入，伙伴背书可能夸大直接客户深度
        - 可能让营销覆盖面与实际付费账户广度脱节
        - 按直接客户、伙伴主导交易、生态合作口径核对销售管线和收入
      - - 具名验证集中在少数 2025-2026 年案例
        - 头部客户敞口可能高于公开记录显示
        - 一旦流失旗舰客户，利用率、定价权或投资人认知都可能明显改写
        - 索取前 10 大账户收入占比、GPU-hours 和利用率集中度
      - - 预留容量与白手套支持打法
        - 销售周期长，可能让收入不均匀地集中在少数大单上
        - 增长表面强劲，实则可能依赖少数企业或 AI 实验室合同
        - 获取按阶段加权的销售管线、平均 ACV 和续约假设
      - - Open Telco AI 等垂直生态
        - 战略生态角色未必能顺畅转化为付费生产收入
        - 可能抬高外界对采用度的感知，却不改善留存指标
        - 要求管理层量化生态项目收入与直接算力消耗收入的占比
      - - 新云厂商性价比叙事
