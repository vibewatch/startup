      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的早期买方，是 AI-native 模型构建者、推理负载重的应用公司，以及需要专用容量但不想自建基础设施的企业平台团队。官方产品页强调训练、微调、推理、Kubernetes、Slurm
              和合规，而不是纯自助实验，这意味着 TensorWave 针对的是基础设施买方，不是普通开发者。Business Wire 称 Fireworks AI 和 Luma AI 已经使用该平台；Credo
              的合作公告则把 AI 实验室和企业客户描述为目标集群买方。受监管或成本敏感企业是第二个重要分层，因为 SOC 2 Type II、ISO 27001 和 HIPAA
              声明会缩小供应商池。采用大概率从一个具体工作负载痛点开始——GPU 稀缺、内存重推理或成本压力——随后经过概念验证、预留集群部署，最后在正常运行时间和编排跑通后扩展到多站点。
