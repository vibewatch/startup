      - number: '1.2'
        title: 创始人、领导层覆盖与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事是 TensorWave 最清晰的优势之一。Darrick Horton、Piotr Tomasik 和 Jeff Tatarchuk
              仍是可见的运营核心；公开记录把他们与云、加密挖矿基础设施、营销技术和 Las Vegas 创投生态里的过往创业经验连接起来。TechCrunch 与 Futuriom 共同显示 Horton 和
              Tatarchuk 之前曾在 VMAccel 共事；Tomasik 的过往公司搭建经历则让团队在纯硬件采购之外具备商业可信度。这个组合有助于解释 TensorWave 为什么敢押注
              AMD：创始人并不是冷启动进入加速器基础设施。


              创始人之下的领导层覆盖也比「三人创业公司」叙事更完整。官网公开列出的高管横跨财务、运营、信息安全、工程、AI 基础设施、产品架构、GTM 战略、设计和合作伙伴，足以说明 TensorWave
              已经搭起比创始人主导空壳更能运转的组织。缺口在治理透明度。已审阅的公开来源没有给出足够精确的现任董事会名单、委员会图谱或投资人控制结构，无法把治理视为已关闭的事项。尽调上，第 1
              章可以把领导梯队当作真实能力，但应把治理保留为开放尽调线索，而不是从融资动能默默推断董事会成熟度。
