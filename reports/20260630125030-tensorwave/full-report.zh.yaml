            title: 规模声明有具体建设标记支撑
            body: >-
              TensorWave 的融资故事比典型早期 neocloud 更可信，因为公开来源把它与具体运营标记相连：8,192-GPU MI325X 集群、1GW 和 20MW TECfusions 协议，以及由 AMD
