      - number: '6.3'
        title: 具名验证质量与局限
        blocks:
          - type: paragraph
            body: >-
              最强的直接验证是 AstraZeneca。TensorWave 和 AMD 都称 AstraZeneca 将 REINVENT4、SemlaFlow 和 SwinUNETR 工作负载从基于 NVIDIA
              的基础设施迁移到 TensorWave 托管的 MI300X GPU；AMD 还发布了具体提升：SemlaFlow 训练快 49%，REINVENT4 在四种配置下快 41%，SwinUNETR 训练最高快
              1.8x，且没有重大代码改动。Moreh 是最清晰的下一代推理验证：TensorWave 称 Moreh 使用 MI355X
              节点验证前沿推理工作负载，把模型权重下载时间降至此前环境的约四分之一，并看到实质性带宽和 GEMM 改善；Moreh 自己网站也确认其是聚焦 AMD 的推理软件供应商。Zyphra
              增加前沿训练可信度；TensorWave 称 Zyphra 在 1,024 块 MI300X GPU 上训练 ZAYA1-Base，并利用 AMD 的 VRAM、batch-size 和成本优势；Zyphra
              自身网站则把公司定位为基于 AMD 的开放模型平台。Featherless 有帮助，但作为直接客户验证较弱：它说明了模型尺寸偏好、可靠性阈值和 AMD MI300X 性能结果，但公开记录没有披露
              TensorWave 合同规模或生产范围。Modular 和 AT&T 限定更多。Modular 证明围绕 TensorWave 的可部署性、可移植性和合作伙伴主导经济性；AT&T/Open Telco AI
              证明 TensorWave 嵌入了严肃运营商生态。仅凭公开证据，两者都不像 AstraZeneca 那样干净证明直接终端客户收入。整体看，公开验证在技术工作负载上最强，在商业深度上最弱。
