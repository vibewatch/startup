      - number: '5.2'
        title: 从裸金属到生产运营的工作流架构
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的运营模型围绕掌控从物理节点到工作负载编排的完整 AMD 集群路径设计。裸金属提供整机控制和零虚拟化开销；托管 Kubernetes 覆盖安全生产部署和开放框架推理；托管 Slurm
              覆盖大规模训练和研究；公司还明确表示，两套调度器可以共存于同一集群，使离峰训练容量可复用于峰值推理需求。存储、可观测性和安全没有被当作可选后补，而是平台的联动部分：存储层强调 checkpointing
              和复制数据，可观测性跟踪 GPU、网络和存储健康，安全页面列出网络分段、RBAC、扫描、测试、日志和事件响应。ROCm 是这套栈底下的软件基座；TensorWave 自有文档和 AMD ROCm
              文档都指向一个开放、可调优的环境，配有 AI 教程、MI300X 调优指南、调试工具和源码构建路径。这比普通实例转售商更有主张，但也意味着交付质量取决于编排、运营人员和 GPU 软件成熟度，而不只是硬件。
