companyProfile:
  summary: >-
    TensorWave 是一家创立于 Las Vegas 的 AI 基础设施初创公司，正在打造只使用 AMD 的模型训练与推理云。公开材料显示，公司把裸金属 GPU 容量与托管
    Kubernetes、Slurm、存储、可观测性、安全控制和一线支持打包，向客户出售一个比 NVIDIA 中心云更易用的开放栈替代方案。到 2026 年 6 月，公司已经从 2024 年 $43 million SAFE 推进到估值
    $1.55 billion 的 $350 million Series B；公开工作负载验证也从 Moreh、Zyphra 等 AI-native 客户延伸到 AstraZeneca
    的受监管生命科学工作负载。保留项在于，融资结构、客户耐久度和治理披露仍落后于基础设施扩张速度。
