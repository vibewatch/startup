      - number: '1.3'
        title: 资本形成与基础设施建设
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的融资节奏，是公司如今值得被视为不止一家小众基础设施初创公司的最大原因。公开轨迹始于 2024 年 10 月 $43 million SAFE，这给了公司一个干净的首个融资里程碑，也带来
              Nevada 纪录叙事。到 2025 年 5 月，TensorWave 完成由 Magnetar 和 AMD Ventures 领投的 $100 million Series A；同期 TechCrunch
              报道还把这轮融资与管理层声称 2025 年收入 run-rate 将超过 $100 million 放在一起。到 2026 年 6 月，公司又完成估值 $1.55 billion 的 $350 million
              Series B，Magnetar 和 AMD Ventures 再次领投，既有投资人继续参与。这一序列显示的不只是资本可得性，也显示投资人反复愿意加注 AMD 云 thesis。


              基础设施规模声明同样增长很快。公开来源支撑的里程碑包括：2024 年末与 TECfusions 签下 1 GW 容量承诺，2025 年中上线 8,192 块 MI325X GPU 集群，2026 年 1 月在
              Tucson 和 Pennsylvania 各新增 10 MW。2026 年 6 月最强的公司背书披露称，TensorWave 已锁定超过 2 GW 长期容量，并在更多北美区域推进 MI355X
              部署。这些是执行速度的有意义证据，但本章仍应把已验证的物理里程碑与更宽泛的未来容量表述分开。资产负债表故事已足以证明规模，但具体债务结构、贷款人经济性和资产层义务在公开来源中仍严重披露不足。
