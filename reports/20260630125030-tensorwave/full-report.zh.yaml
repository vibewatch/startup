  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现场景
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的公开产品界面指向一种基础设施加服务的混合收入模式，而不是干净的自助 API 业务。官方页面显示，可变现界面覆盖裸金属 GPU 租赁、托管 Slurm 和 Kubernetes
              运营、推理基础设施、训练集群、微调工作流和一线支持。公司强调整机所有权、集群级推理、企业支持和利用率优化，这更符合较长周期的企业或研究合同，而不是纯按 token 的现货支出。不同于许多私有 AI
              云同业，TensorWave 现在在多个官方产品页公布了头部加速器定价：MI300X 每 GPU-hour $1.71、MI325X 每 GPU-hour $2.25、MI355X 每 GPU-hour
              $2.95，并各自搭配可选的托管 Kubernetes 和 Slurm。这是漏斗顶部变现的有用证据，但仍不足以建模实际收入，因为公司没有披露合同期限、量价折扣、托管服务加价或客户级折扣。TechCrunch
              2024 年 10 月另一篇报道称，TensorWave 按小时出租 GPU 容量，但最低六个月合同；这进一步说明，实际收入可能更多由预留容量协议和定制集群设计驱动，而不只是透明的按需目录定价。Fireworks
              AI、Luma AI、Modular 和 Credo 背书的网络设计中标等公开客户引用，支持需求形成，但没有揭示收入组合、确认政策或客户集中度。
