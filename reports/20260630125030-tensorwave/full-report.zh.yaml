        title: 单位经济性与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开单位经济性证据仍偏方向性，但强于纯营销材料。TensorWave 发布 MI300X、MI325X 和 MI355X 的加速器节点定价，至少锚定了目录经济性。产品页还展示关键硬件输入——分别为
              192GB、256GB 和 288GB HBM3E；3.2Tb/s 节点互连；高端节点采用直接液冷——同时 TensorWave 的微调和 ScalarLM
              页面主张，同一基础设施可借助共享可观测性和编排支持多类工作负载。这一点重要，因为利用率很可能是主导毛利率杠杆。Modular 的 TensorWave 案例研究宣称总成本最高可节省 70%；AMD 案例研究称
              MI355X 加 Modular MAX 相比 NVIDIA B200 最高实现 2x 吞吐量和约 40-60% 节省，但 AMD 明确说明，这些性能和节省声明由 TensorWave 及 / 或 Modular
              提供，未经独立验证。需求侧，TechCrunch 报道公司从 2024 年 10 月 $3M ARR 进展到管理层指引 2025 年收入 run-rate 超过 $100M，但仍没有 2026
              年收入更新、没有毛利率披露，也没有 cohort 级留存数据。最佳外部成本结构参照仍是公开 neocloud 评论：CoreWeave 材料认为存储可达到 AI 云总成本约三分之一，在 70-90%
              持续利用率下，专用 GPU 计费经济性优于 token 定价；Credo 的 TensorWave 新闻稿则把更高集群利用率和 time-to-first-token
              描述为经济性关键。由此得出的看法是，TensorWave 可能确有真实目录定价和硬件效率故事，但证明利润率质量所需的私有指标仍未披露。
