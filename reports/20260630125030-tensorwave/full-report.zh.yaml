        title: 资本充足性、容量义务与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本形成是 TensorWave 财务故事中公开证据最强的一块。公司在 2024 年 10 月完成 $43M SAFE，2025 年 5 月完成 $100M Series A，2026 年 6 月完成 $350M
              Series B，已披露股权资本约 $493M。公开来源还把公司与大型物理承诺相连：2024 年 10 月与 TECfusions 签下 1GW 容量协议，2026 年 1 月在 Pennsylvania 和
              Arizona 新增合计 20MW，且公司声称到 2026 年 6 月已锁定超过 2GW 长期容量。Review-Journal 进一步报道，Series B 资金将用于更多美国数据中心，以及 GPU
              融资的股权出资；这很重要，因为重基础设施 AI 云通常需要债务或设备支持资本，与风险股权并行。最激进的公开债务信号来自 Futuriom：它报道称 TensorWave 已完成一笔 $800M 延迟提款定期贷款
              tranche，以 GPU 库存和长期合同为支持。这个说法符合 TechCrunch 更早关于管理层计划用 GPU 作抵押的报道，但当前来源包没有公开备案、贷款人公告或 covenant
              套件来确认债务规模、提款条件、定价、抵押测试或到期日。因此，资本充足性较少取决于 TensorWave
              能否筹到亮眼股权，更多取决于它能否在需求可能正常化的背景下，为电力、GPU、网络、液冷和营运资本融资，同时不在不透明债务上过度扩张。
