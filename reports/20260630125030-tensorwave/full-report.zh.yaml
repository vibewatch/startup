chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与地理锚点
        blocks:
          - type: paragraph
            body: >-
              首先应把 TensorWave 理解为一家专业 AI 基础设施公司，而不是通用云转售商。官方材料反复把公司定义为面向严肃 AI 训练与推理的 AMD-only
              云，明确主打内存密集型工作负载、开放工具链和更低供应商锁定。因此，核心商业叙事不只是「按小时租 GPU」——尽管交付模式里确实有这部分；TensorWave
              想把硬件选择、托管基础设施、支持和可移植性打包成可用替代方案，服务不想完全暴露在 NVIDIA 栈下的团队。当前网站、AMD 案例研究材料和 TensorWave 产品页都在强化这一定位。


              对一家年轻 neocloud 而言，公开证据在地理位置上也少见地清晰。独立报道和公司材料一致指向 Las Vegas 作为运营中心；2026 年 6 月 Review-Journal 采访进一步给出 Town
              Square 的总部信号，并提到公司继续投入当地初创生态。这个本地锚点重要，因为 TensorWave 从 Bay Area、Seattle 或 Northern Virginia
              等常见集群之外，讲述一个重资产扩张的基础设施故事。它既解释了公司在 Nevada 的融资叙事，也说明后续章节为什么应把 Las Vegas 作为默认公司总部信号，除非管理层给出不同的法律实体图谱。
