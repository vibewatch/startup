          - type: paragraph
            body: >-
              公开资料还不足以支撑对集中度风险的投资测算。TensorWave 没有披露最大客户收入占比、合同金额集中度、合作伙伴来源与直销收入结构，也没有说明是否由少数 AI
              原生客户撑起利用率。这个缺口很关键：现有证明材料样本窄、主题也集中，更多偏向 AMD
              基础设施伙伴、前沿模型开发者和重度看基准测试的技术采用者。如果其中少数客户或生态贡献了大部分管线或已承诺支出，公司在营销口径上看似分散，经济实质仍可能高度集中。公开证据质量也不均衡。最有力的证明很多来自
              TensorWave 自己，或来自 AMD、Modular 等利益一致的伙伴。AMD 自己的案例研究也明确说，关键性能和成本说法由 TensorWave 和 / 或 Modular
              提供，并未独立验证。第三方反向背景让担忧更尖锐。Futuriom 认为，GPU 供应恢复正常后，价格性能优势会扩散到更多供应商，新型 AI 云差异化可能商品化；The Next Web 则说，TensorWave
              实际上是在押注客户足够需要第二供应来源，愿意从根深蒂固的 NVIDIA 习惯中切换出来。合在一起，这是一个可信的技术采用故事，但在集中度、留存和证明独立性上，公开证据仍有明显边界。
