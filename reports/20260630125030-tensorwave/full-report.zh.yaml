      - number: '8.3'
        title: 可比公司与估值锚
        blocks:
          - type: paragraph
            body: >-
              CoreWeave 是最有用的公开锚点，即便并不完美。CoreWeave 当前公开市场数据显示，市值约 $52.1 billion，企业价值约 $85.0 billion，基于约 $6.23 billion
              的过去收入，EV/revenue 约 13.65x。它自己的股东信也强调，年收入超过 $5 billion、积压订单 $66.8 billion、在用电力 850+MW，并在 2025 年募集 $18
              billion 债务和股权资本。这些数字很重要，因为它们框定了市场愿意为一个已经证明收入、积压订单和资本市场通道的规模化 AI 云支付什么价格。在这个基础上，TensorWave 用 2025 年 >$100
              million 收入运行率代理去对应 $1.55 billion 估值，隐含约 15.5x 收入；尽管披露少得多、运营证明也弱得多，倍数却略高于 CoreWeave 的公开市场倍数。


              Nebius 是另一个公开新型 AI 云参照，但热度更高、噪音也更大。Yahoo Finance 显示，2026 年 6 月 29 日 Nebius 市值约 $66.3 billion，EV/revenue 为
              75.75x；独立分类研究则把 Nebius 描述为快速扩张的 AI 云，拥有数十亿美元战略合同，并预计到 2026 年底上线最高 800MW 至 1GW 已接入容量。这说明公开市场仍可能给 AI
              基础设施极端溢价，但它不是 TensorWave 的干净测算锚，因为 Nebius 反映的是不同的合同基础、战略语境和投资人叙事。Lambda、Crusoe、Together AI、Cerebras
              等私有同行主要可用来做存在性校验：它们证明新型 AI 云和推理专业厂商赛道很拥挤，但已审阅材料没有给出足够透明的估值数据，无法把它们作为主要定价锚。
