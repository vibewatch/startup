  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - AMD 采用拓宽，>2GW 管线转为可变现容量，债务条款仍可管理，收入年化规模向 $200-250M 扩张。
        - $2.2B-$3.2B 估值区间，基于显著更高收入和更干净利用率证明，使用高溢价 AI 云倍数。
        - MI355X 推出落地不顺，或合同质量弱于预期。
        - 需要融资透明度，以及现有 GPU 数正在转成粘性合同支出的证据。
      - - 基准
        - TensorWave 继续增长，但价格压缩、披露仍不完整，资本需求保持高位。
        - $0.9B-$1.4B 区间，意味着缺少更好经济性时，当前轮次已接近或高于公允价值。
        - 债务悬顶、稀释，以及实际定价低于标价。
        - 最吻合当前公开证据：确有牵引力，但建设过程仍不透明且资本密集。
      - - 悲观
        - AMD 需求收窄，利用率转弱，债务约束条款收紧，或公开新云厂商倍数下修。
        - $0.3B-$0.7B 区间，相比 2026 年 6 月投后估值，形成有意义的降估值融资风险。
        - 客户集中、抵押债务压力和算力价格快速下跌。
        - 买方市场评论和行业由债务 + 股权驱动的结构提供支撑。
    notes: 区间是分析估计，不是公司指引；目的在于压力测试 2026 年 6 月投后估值，而不是预测单一公允价值。
