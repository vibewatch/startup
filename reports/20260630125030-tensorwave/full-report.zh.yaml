      - number: '2.4'
        title: 增长驱动、采用约束与未解决缺口
        blocks:
          - type: paragraph
            body: >-
              核心增长驱动很清楚：企业 AI 正从实验走向生产，专业云增长快于超大规模云厂商，加速器供给仍是瓶颈，TensorWave 可以为部分工作负载提出更便宜或内存效率更高的路径。官方和合作伙伴撰写的材料也让
              TensorWave 在开放生态、ROCm 可移植性和集群级经济性上有真实叙事。但约束至少同样重要。CUDA 仍是更成熟的软件生态，超大规模云厂商和自研芯片提供商继续改进，分析师评论现在把市场描述为买方市场，超过
              100 家提供商争夺相似需求。这意味着市场增长不保证持久定价权。剩余最大尽调缺口是客户组合、定价透明度、利用率，以及对合作伙伴撰写研究之外 AMD
              可移植性声明的独立验证；这些未解决项应直接流入竞争、财务和估值章节。还有一个细微点：即便市场商品化，TensorWave
              也可能受益于品类学习——买方需要真实基准、可靠编排，并证明集群能按时上线。因此，尽调重点应落在执行质量，而不是只看 TAM 叙事。实践中，本章应被读作一个带明确利润率和验证风险保留的市场机会案例，而不是对每一家
              neocloud 商业模式的笼统背书。
