      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 债务堆叠是最大的隐藏估值变量
            body: >-
              公开来源支持 GPU 抵押融资意图的存在，也有第三方报道大型延迟提款融资安排，但没有具体贷款方条款。因此，最重要的未知数不是 TensorWave
              能否融资，而是优先资本和优先权之后，普通股是否仍能捕获有吸引力的上行。
            calloutType: risk
            claimRefs:
              - CV019
              - CV041
              - CV045
          - type: callout
            title: TensorWave 的定价已更接近规模化新型 AI 云，而不是初创公司
            body: >-
              使用公开的 2025 年 >$100M 收入运行率代理，2026 年 6 月 $1.55B 估值隐含约 15.5x 收入。对热门 AI 基础设施来说，这并不离谱，但已经高于 CoreWeave 的公开
              EV/revenue，也比公司年轻阶段应有的容错空间更小。
            calloutType: insight
            claimRefs:
              - CV001
              - CV005
              - CV016
              - CV023
              - CV040
          - type: callout
            title: 乐观情景假设 AMD 采用会变成耐久的第二供应来源习惯
            body: >-
              公司全 AMD 切入点只有在客户足够看重开放性、内存经济性和 ROCm 可移植性，愿意持续把生产工作负载从 NVIDIA 中心云转出时才成立。如果这种行为弱化，TensorWave
              就会变成更窄的细分玩家，而不是可与更大新型 AI 云厂商对标的平台。
            calloutType: assumption
            claimRefs:
              - CV033
              - CV035
              - CV039
          - type: callout
            title: 什么会让判断上调
            body: 从继续研究上调到观察或买入，需要三件事：经验证的 2026 年收入质量、完整债务和优先权披露，以及已签约利用率增长快于新型 AI 云定价压力的证据。没有这些，头部规模故事仍不足以穿透当前价格。
            calloutType: recommendation
            claimRefs:
