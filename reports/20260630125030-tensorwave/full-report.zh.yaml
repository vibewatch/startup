  - id: TV005
    title: 投资论点破裂和否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 降价轮或内部方主导且结构很重的融资
        - 下一轮机构融资投后估值低于 $1.55B，或由苛刻的高级条款主导
        - 说明公开规模信号没有转化为可融资的经济性。
        - 在完整重建清偿瀑布和债务相互作用前，按论点破裂处理。
      - - 债务压力出现
        - GPU 融资的借款基数收缩、契约违约或被迫追加抵押品
        - 会压低普通股上行空间；定价转软时，灵活性也会被挤压。
        - 暂停投资工作，要求提供完整债务包和贷款人同意机制。
      - - 利用率不及预期
        - 已验证收入或毛利轨迹明显低于 >$100M 年化收入路径，尽管装机容量更大
        - 说明 GPU 数量和电力并不等于变现质量。
        - 将估值区间重置为基准 / 熊市情形，并要求披露分群 / 合同。
      - - AMD 生态采用停滞
        - 客户要求 Nvidia/CUDA 兼容性，而 TensorWave 无法以经济方式打通
        - 会削弱公司的核心差异化论点和估值溢价。
        - 将公司重估为小规模利基提供商，而非第二来源平台。
      - - 公开 neocloud 倍数下修
        - CoreWeave / Nebius 因收入或杠杆担忧明显下修估值
        - 会机械压缩支撑 TensorWave 轮次估值的私有可比集。
        - 即使 TensorWave 自身执行仍稳健，也要重新打开入场定价。
    notes: 这些触发因素按对估值的传导挑选，而不只是看运营重要性。
    claimRefs:
      - CV016
      - CV017
      - CV019
      - CV023
      - CV026
      - CV035
      - CV036
      - CV039
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 债务包
        - 延迟提款定期贷款的贷款人、借款基数机制、契约、定价、到期日和抵押品释放条款
        - 已报告债务可能大幅改变普通股回报和下行情形的严重度。
        - CFO + 贷款人条款清单 + 债务文件法律审阅。
      - - 股权结构表和优先权栈
        - A / B 轮条款、SAFE 转换机制、清算优先权、认股权证和期权池
        - 投后估值标题不等于普通股价值。
        - 财务团队 + 股权结构表导出 + 律师审阅。
      - - 2026 年收入质量
        - 当前年化收入、实际定价相对标价、毛利率、流失率和客户集中度
        - 用于判断 $1.55B 是建立在真实经济性上的溢价，还是基础设施剧场的溢价。
        - 管理账 + 客户分群桥接 + 董事会材料摘录。
      - - 已签约利用率和积压订单
        - 已签容量承诺、平均合同期限、预付款结构和取消条款
        - 电力和 GPU 公告只有转化为耐久现金流才重要。
        - 销售 / 财务尽调，配样本 MSA 和大客户摘要。
      - - 供应商和生态集中度
        - AMD 配额依赖、ROCm 迁移负担，以及客户要求 Nvidia 兼容性时的后备路径
        - 全 AMD 论点也是单一供应商依赖论点。
        - 产品 / 工程审阅 + 客户访谈 + 与 AMD 合作伙伴团队讨论路线图。
    notes: 这些问题聚焦于从继续研究推进到跟踪或买入所需的最低证据。
