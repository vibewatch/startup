      - number: '6.4'
        title: 留存与耐久度缺口
        blocks:
          - type: paragraph
            body: >-
              耐久度是 TensorWave 公开客户证据变薄的地方。公司仍未披露 NRR、GRR、续约率、logo 流失、平均扩张倍数或 cohort 表。最佳公开重复使用指标是定性的。Moreh 称计划继续在
              TensorWave 上验证分布式推理。AstraZeneca 和 AMD 描述初始迁移工作之后更深入的共创机会。TensorWave
              的电信文章则把运营商、研究人员和模型开发者的持续协作放进叙事。这些信号有用，说明客户或合作伙伴并未把 TensorWave 仅当作一次性基准测试场地，但它们无法替代续约数据。TechCrunch
              报道的历史最低六个月合同，暗示 TensorWave 从一开始就瞄准比商品化现货 GPU 转售更耐久的预留容量关系；但这仍只是起始线索，不是流失表现证据。因此，本章只把示例 cohort
              图作为行业代理，用来可视化缺失尽调，而不是作为 TensorWave 事实运营指标。承销方应把这里所有留存结论都视为临时，直到管理层提供 cohort 表、续约率，以及试点、已承诺和扩张收入之间的拆分。
