      - number: '7.3'
        title: 供应商依赖、园区建设和资本强度会直接传导到下行
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的商业上行绑定在一个非常具体的建设模型上：锁定 AMD
              供应、快速融资、签下大型园区承诺、在多个站点复制高密度部署，并在融资条件收紧前填满这些站点。公开资料显示，这条路径已有实质进展。TensorWave 已上线 8,192 块 MI325X GPU，称已锁定超过
              2GW 长期容量，并从 1GW Tecfusions 承诺扩展到 Arizona 和 Pennsylvania 额外 20MW 的上线计划。但同一组证据也定义了残余风险。AMD
              同时是核心供应商、生态赞助方和投资人；Tecfusions 同时是容量伙伴，也是电力和进度交付的集中点；公司也已把 GPU 抵押或股权支持融资列为扩张模型的一部分。独立行业来源还显示，密集 AI
              基础设施的真实经济性取决于网络、有效吞吐、冷却、变电站和可预测成本，而不只是便宜加速器。TensorWave 还没有披露足够的园区级细节，让外部人有信心测算这些层。
