  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 什么会改变判断
    rows:
      - - 正方
        - TensorWave 已有真实规模信号：8,192 块 MI325X GPU 在线、声称 >2GW 容量，并公布清晰标价。
        - 展示持续签约利用率、已签订单积压和实际利润率，而不是只有基础设施公告。
      - - 正方
        - 只押 AMD 的定位为买家提供了相对于以 Nvidia 为中心的云的明确第二供应选择。
        - 如果 ROCm 可迁移性和客户采用改善快于预期，这个切入点会更强。
      - - 正方
        - '>$100M 的 2025 年收入年化目标表明，公司变现速度快于典型基础设施创业公司。'
        - 经审计或审阅的 2026 年收入质量、毛利率和客户集中度，会支撑更高信心判断。
      - - 反方
        - Series B 估值几乎是上一轮估值的 4 倍，按公开年化收入代理指标看，已隐含很高倍数。
        - 若进入价格显著更低，或经过验证的 2026 年收入高得多，当前估值才更容易支撑。
      - - 反方
        - 据称的债务融资和电力承诺，可能把风险提前拉到公开披露之外。
        - 完整债务条款、借款基础机制和清算瀑布披露可降低融资不透明度。
      - - 反方
        - 新云厂商定价正进入买方市场，单靠差异化可得性未必守得住利润率。
        - 若能证明利用率持久、客户锁定和利润率在较软定价环境下仍有韧性，这一担忧会减弱。
    notes: 每行都围绕什么证据会移动投资判断，而不是静态赞美或批评。
