  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 与 TensorWave 的相关性
      - 主要限制
    rows:
      - - TensorWave（最新私募轮）
        - '> $100M 2025 年年化收入代理指标；8,192 张 MI325X 已上线；>2GW 容量主张'
        - 2026 年 6 月投后估值 $1.55B；按公开代理指标计算约 15.5x 年化收入
        - 被尽调资产的直接定价参照。
        - 年化收入口径由管理层披露，未经审计；债务 / 优先权结构未披露。
      - - CoreWeave (CRWV)
        - 过往 12 个月收入约 $6.23B；2025 年信件称年收入 >$5B、积压订单 $66.8B
        - 2026 年 6 月 29 日市值约 $52.1B；EV / 收入约 13.65x
        - 有融资和积压订单披露，是规模化 AI 基础设施最好的公开 neocloud 锚点。
        - 规模、客户证明和资本市场通道都远强于 TensorWave。
      - - Nebius (NBIS)
        - 过往 12 个月收入约 $877.9M；快速扩张的公开 AI 云，拥有重大策略合同
        - 2026 年 6 月 29 日市值约 $66.3B；EV / 收入约 75.75x
        - 说明策略需求叙事够强时，公开 AI 云估值可以被推到多热。
        - 这个公开可比异常昂贵且噪声大，并不适合作为私营公司承销的干净锚点。
      - - Lambda
        - 与 CoreWeave、Crusoe、Nebius 同属 2026 年分类框架中的 neocloud 提供商
        - 私有公司；已审阅材料确认品类相关性，但不给出透明的当前估值标尺
        - 作为 GPU 原生云客户替代选项的直接同业校验很有用。
        - 当前材料没有提供可用于承销的公开估值或收入倍数。
      - - Together AI / Cerebras
        - 更偏推理优化的同业，而不是完整集群 neocloud 双胞胎
        - 私有 / 专业化；本报告不把估值作为主要锚点
        - 可用来界定托管推理与全栈基础设施所有权的分界。
        - 商业模式与 TensorWave 以集群和电力为主线的故事差异很大。
      - - Crusoe
        - neocloud 类别中以服务为主线的 AI 基础设施同业
        - 私有公司；分类和分析师引用确认相关性，但材料中没有干净的当前公开估值
        - 用于对比托管 AI 基础设施和资本强度很有帮助。
        - 已审阅材料具备战略参考价值，但不足以支撑精确定价。
    notes: 公开锚点是 CoreWeave 和 Nebius；私有同业主要用于描出竞争估值邻域，不是为了制造虚假的精确度。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the specific public and private neocloud / inference peers most relevant to TensorWave’s June 2026
        financing context rather than every GPU-cloud startup globally.
