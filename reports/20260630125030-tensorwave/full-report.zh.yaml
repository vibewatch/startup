  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的公开客户界面集中在技术成熟买方，而不是大众市场自助开发者。其官方产品和解决方案页面强调模型训练、推理、企业套件支持、托管基础设施和专家支持；合在一起，这意味着销售主导的买方动作，面向 AI
              实验室、企业平台团队，以及拥有实质工作负载规模的运营商。具名验证集也强化了这一模式。Moreh 是一家服务数据中心和企业团队的推理软件公司。Zyphra 是前沿模型实验室和基于 AMD
              的云平台。Featherless 是 serverless LLM 托管提供商。Modular 作为软件生态合作伙伴出现，帮助企业推理工作负载在 TensorWave 的 AMD 栈上运行。AstraZeneca
              是最清晰的受监管企业验证，因为买方是一家全球生命科学公司，正在把研究工作流从 NVIDIA 迁移到 TensorWave 托管的 AMD 基础设施。相比之下，AT&T 是通过 Open Telco AI
              带来的生态验证，而不是直接客户收入的干净证据。这意味着 TensorWave 的公开引用横跨多种买方类型，但偏向基础设施认知较强、已经有动力摆脱 NVIDIA
              锁定或优化前沿工作负载的采用者，而不是广泛披露的常规企业账户群。
