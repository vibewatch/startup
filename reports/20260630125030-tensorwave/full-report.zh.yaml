      - number: '7.2'
        title: CUDA 锁定效应和 AMD 软件成熟度仍是最结构性的技术风险
        blocks:
          - type: paragraph
            body: >-
              核心技术风险在于，TensorWave 想把 AMD 开放性变现，但市场行为仍把 CUDA 当作生产默认项。SCALE 的 2026 年生态研究和 NVIDIA
              自己的工具包定位指向同一个结论：开发者、库和操作习惯仍高度围绕 NVIDIA。SemiAnalysis 又把这种抽象的生态风险落到具体运营证据上，认为 AMD 的公开发布训练栈要追上更顺滑的 NVIDIA
              体验，仍需要太多调优、太多绕路和太多直接工程支持。TensorWave 在这里确实有缓释叙事。它的企业和训练页面承诺用一层软件统一训练与推理，提供托管 Kubernetes 和
              Slurm、检查点、感知拓扑的调度和监控。AMD 的案例研究与 ROCm 文档也显示，可移植性和开放工具链确实有工程路径。但残余风险仍高，因为这个缓释离不开 AMD
              继续足够快地补齐差距，且必须服务真实客户工作负载，而不只是跑通基准测试演示。
