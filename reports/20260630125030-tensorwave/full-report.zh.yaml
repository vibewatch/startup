      - number: '6.2'
        title: 采用轨迹与验证界面
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的商业化轨迹可间接看见，但不是通过披露的客户基数指标。TechCrunch 在 2024 年 10
              月报道称，公司已开始在预览版中引入客户，采用按小时定价但最低六个月合同，并且不会披露客户数量。到 2025 年 5 月，TechCrunch 报道公司 run-rate 收入超过 $100 million，并拥有
              8,192-GPU MI325X 专用训练集群，暗示需求形成并转向更大的预留容量部署。2026 年，Credo 合作新闻稿和 Review-Journal 的 Series B 报道延续同一模式：它们指向 AI
              实验室和企业客户、更高集群利用率、更快 time-to-first-token、生产可靠性和客户成功招聘扩张，但仍没有活跃账户、付费生产用户或重复购买行为的分母。本章保留的公开验证界面包含六个与
              TensorWave 工作负载证据相关的具名实体或生态，其中五个是直接工作负载故事，四个披露了量化结果。这足以说明 TensorWave
              已经越过纯概念营销阶段。但它不足以回答投资人最关心的采用问题：今天有多少活跃客户，多少在生产而非试点，多少收入集中在少数账户或合作伙伴手里。
