  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: TensorWave 的典型买方路径，从规避 NVIDIA 或工作负载需求出发，经过 AMD 验证、预留容量承诺，并可能扩展到更广的生态项目。
    data:
      items:
        - label: 触发
          detail: 买方通常从一个具体痛点出发：GPU 稀缺、NVIDIA 成本、内存重型模型需求，或需要更强训练和推理基础设施控制权的垂直工作流。
          touchpoints:
            - 需要更便宜或更容易获得的前沿算力
            - 内存重型模型或长上下文工作负载
            - 企业希望避免单一供应商锁定
            - 受监管行业需要可控基础设施
        - label: 评估
          detail: TensorWave 的公开证据集显示，买方会通过亲手基准测试、移植和工程支持来验证 AMD 可行性，而不是刷卡接入一个通用自助 API。
          touchpoints:
            - 对照 NVIDIA 基线做基准测试
            - ROCm / vLLM / 模型移植验证
            - 白手套工程支持
            - 集群、网络和存储适配评估
        - label: 承诺
          detail: 工作负载通过验证后，买方似乎会进入预留或限定范围的基础设施承诺；TechCrunch 2024 年报道显示，历史上至少包含六个月最低期限。
          touchpoints:
            - 预留容量合同或限定范围部署
            - 托管服务和专家支持
            - 生产就绪和可靠性门槛
            - 采购和安全审查
        - label: 生产
          detail: 最好的公开证据显示，它被用于企业训练、前沿规模训练或大规模推理等接近生产的场景，并围绕运行时稳定性、网络和工作负载调优提供支持。
          touchpoints:
            - AstraZeneca 训练迁移
            - Moreh MI355X 验证
            - Zyphra 1,024-GPU 训练经验
            - Modular MAX 部署路径
        - label: 扩展 / 生态
          detail: 扩展似乎通过更多模型、更大集群规模或更深生态参与发生，但公开记录尚未量化这些动作是否会转化为持久续约或抗集中度能力。
          touchpoints:
            - 后续模型优化
            - 分布式或异构集群扩展
            - Open Telco AI 等垂直生态
            - 伙伴主导的部署和可移植性项目
