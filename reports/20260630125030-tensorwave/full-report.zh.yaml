      - number: '8.2'
        title: 融资背景、债务敏感度和入场纪律
        blocks:
          - type: paragraph
            body: >-
              对这么年轻的基础设施公司来说，TensorWave 的融资记录公开程度异常高，但关键部分仍不透明。公开报道支持这样一条路径：2024 年 10 月以 $100 million 投后估值完成 $43 million
              SAFE，2025 年 5 月完成 $100 million Series A，2026 年 6 月完成 $350 million Series B，两年内披露股权资本约 $493
              million。同样重要的是，公开来源把 TensorWave 与 1GW Tecfusions 协议、后续 20MW 扩张，以及超过 2GW
              长期容量说法联系起来。这也是公司能相对普通软件创业公司享受溢价的基本原因：投资人测算的是一个快速拼起来的物理算力平台，而不只是软件采用。


              但入场纪律必须围绕公开资料仍未展示的部分。Futuriom 报道称，公司有一笔由 GPU 库存和长期合同支持的 $800 million 延迟提款定期贷款额度；TechCrunch 另行报道，管理层有意用 GPU
              作为债务融资抵押品。但当前来源包没有贷款方公告、契约包、借款基础公式、到期结构或清算分配顺序。没有这些细节，投资人无法判断 $1.55 billion
              投后估值是站在干净的普通股索取权之上，还是站在不断加高的优先债务和优先权堆叠之上。因此，纪律性投资人应把 TensorWave
              按价格敏感来测算：公司可能不错，但回报逻辑取决于债务条款、股权结构表、客户集中度，以及还需要多少未来稀释，才能把已锁定电力转化为可变现容量。
