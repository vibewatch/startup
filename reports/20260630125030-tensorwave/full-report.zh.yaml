      - number: '2.2'
        title: TAM、SAM 与可观察规模测算视角
        blocks:
          - type: paragraph
            body: >-
              最宽的公开 TAM 代理指标很大且仍在扩张：CoreWeave 援引 Futurum 预测，推理半导体需求到 2030 年将达到 $885
              billion，专业提供商预计会比超大规模云厂商增长更快。但这个头部数字对 TensorWave 太宽，因为它覆盖全部推理芯片，而不是第三方 AI 云容量这一更窄支出池。更适合 TensorWave
              决策的视角，应从已披露公司规模和品类结构三角校准：TensorWave 报告已锁定超过 2 GW 容量、上线 8,192 块 MI325X GPU；TechCrunch 报道其 2025 年 run-rate
              收入超过 $100 million。这些事实支撑一个受约束的 2026 年 SAM 估算：在 AMD 兼容性、更快供应和开放栈经济性重要的专业第三方 AI 云支出中，约 $5 billion 至 $15
              billion。公开披露仍无法隔离干净 SOM，因此报告保留这一不确定性，而不捏造精确度。
