            body: >-
              财务判断是混合的。积极信号真实存在：TensorWave 快速筹到大额资本，获得 AMD 对齐的生态支持，公开点名企业或 AI-native 用户，并用可量化的集群和 MW
              公告支撑扩张故事。这些信号让它比典型早期 neocloud 更可信。但负面信号同样实质。SemiAnalysis 描述 GPU 租赁处于买方市场，超过 100 家提供商竞争，旧卡价格下跌；TNW 认为
              neocloud 建设本质上是靠债务和股权押注持续 AI 需求；Futuriom 则质疑如果行业商品化，neocloud 差异化能否守住。在这一背景下，TensorWave
              仍未披露实际定价、收入确认、毛利率、客户集中度、积压订单质量、账上现金、runway
              或已签署债务条款。因此，当前公开记录足以支持规模化与融资动能叙事，但不足以承销收入质量或利润率耐久度。在形成强观点之前，尽调需要管理层级披露：客户组合、合同期限、利用率、每个集群的电力和网络成本、当前现金与
              burn，以及支持扩张的每一项债务或 GPU 融资工具。
