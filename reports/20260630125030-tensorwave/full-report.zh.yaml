      - number: '7.4'
        title: 合规姿态在改善，但法律透明度和组织扩张仍未补齐
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的公开合规表面强于许多私有基础设施创业公司。安全页面和信任中心合在一起展示了 SOC 2 Type II、ISO 27001、面向 HIPAA
              的保护措施、渗透测试摘要、漏洞披露流程和明确响应渠道。受监管买方在启动概念验证（PoC）之前，需要先看到基础设施控制存在，这一点很重要。不过，公开材料还不足以完成尽调。HHS 明确表示，处理 ePHI
              的云服务商会成为商业伙伴，承担合同义务、直接监管责任和分包商协议义务；TensorWave 抓取到的材料不包括公开 BAA、SLA
              或违规通知包，医疗买方无法据此预先清除风险。隐私政策对服务提供商共享、司法辖区转移和执法披露也写得很宽，而公开条款只是网站条款，带强制仲裁和 $50
              责任上限——这不是投资人想审阅的商业合同文本。与此同时，Review-Journal 称公司计划在增加更多站点的同时，把员工数大致翻倍，这会抬高领导层厚度、合规归属和客户成功容量上的执行风险。
