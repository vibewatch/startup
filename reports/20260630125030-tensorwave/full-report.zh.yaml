        - 询问有多少赢单具体依赖 ROCm 帮助或 AMD 显存经济性，而不是通用 GPU 获取
      - - 托管全栈运营创造粘性
        - 多云和框架可移植性保留退出选项
        - 高
        - 切换成本真实存在，但属于运营摩擦，并非绝对
        - 要求提供迁移数据、续约率，以及迁出或迁入 TensorWave 的工作负载案例
      - - TensorWave 能靠经济性取胜
        - 买方市场和公开定价不透明可能压缩利润率或拖慢采购
        - 高
        - 没有清晰实际价格，买方可以货比三家，并迫使公司与同行或超大云厂商对比
        - 要求提供匿名发票、折扣表和毛利率桥接
      - - TensorWave 能防住直接 neocloud 同行
        - 在已审材料中，CoreWeave 的公开基准测试和可靠性证据最强
        - 高
        - 买方比较运营成熟度时，TensorWave 必须证明的不只是 AMD 理念
        - 要求第三方基准测试和明确对比 TensorWave 与 CoreWeave 的客户引用
      - - neocloud 品类增长会扩大选择
        - DGX Lepton 和生态压力可能削弱独立云利润率
        - 中-高
        - 即使 AMD 替代有帮助，NVIDIA 生态动作仍可能拿走开发者心智或提供商利润
        - 询问管理层：需求中有多少来自 NVIDIA 稀缺，有多少来自持久 AMD 偏好
      - - 推理增长扩大 TAM
        - 推理专家无需销售全集群所有权，也能拿下最高量级的服务工作负载
