  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              TensorWave 确实有投资逻辑，但它对融资条件敏感，并不是一个可以不计价格买质量的故事。正向逻辑从公司已经走出融资演示材料阶段的证据开始：到 2026 年 6 月，公司已按 $1.55 billion
              估值完成 $350 million Series B，披露 8,192 块 MI325X GPU 在线，并称已锁定超过 2GW 长期容量。公开产品页面现在也列出 MI300X、MI325X 和 MI355X
              节点标价，让投资人可以三角测算收入潜力，而不是完全依赖营销文案。再加上 CEO 指引称 TensorWave 有望在 2025 年超过 $100 million 收入运行率，公司有理由进入严肃的新型 AI
              云阵营，而不是被归入投机性的边缘创业公司。


              反向逻辑在于，当前估值已经计入了相当大一部分未来。TNW 称 Series B 估值接近上一轮约 $400 million 估值的四倍；TechCrunch 和 Futuriom
              则都描述了一场靠债务和股权资助的基础设施竞赛，GPU 抵押融资、长期电力承诺和持续 AI 需求都必须配合。与此同时，SemiAnalysis 把 GPU 租赁市场称为买方市场，超过 100
              家供应商竞争，算力价格随时间下行。于是，TensorWave 的全 AMD 路线既是切入点，也是集中度风险：如果客户想要第二供应来源、ROCm 可移植性改善，公司可以用增长消化当前估值；如果 CUDA
              惯性、价格压力或杠杆压过这个切入点，当前估值会很快压缩。
