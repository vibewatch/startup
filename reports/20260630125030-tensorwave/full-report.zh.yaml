      - number: '8.5'
        title: 建议、置信度、退出准备度与最后尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，建议是 **继续研究**，置信度 **中**、风险 **高**、估值立场 **偏高**。TensorWave 已经跨过值得认真尽调的门槛：融资可信、产品定价可见、集群足迹有分量，并围绕开放 AMD
              基础设施形成了差异化商业叙事。但这些优点仍不足以支持在当前公开估值下给出买入建议，因为回报数学还依赖市场尚未拿到的事实：债务条款、客户集中度、已实现利润率、清算优先权，以及容量说法实际转化为已签约现金流的情况。


              退出准备度同样还早。没有公开 IPO 文件，没有经审计的利润率披露，也没有透明证据说明债务和优先股工具之后，普通股能拿到什么结果。最可行的退出，是等收入质量和融资结构得到证明后再
              IPO，或与更大的云、基础设施或半导体生态玩家进行战略交易，前提是对方看重 AMD 对齐容量和客户关系。本章的实际结论是，TensorWave
              可以作为尽调候选来投研，但还不是价格已经清算、可以坚定买入的标的。更低入场价、更干净的资产负债表图景，或披露后的合同经济性，可能把判断上调为观察或买入；缺少这些条件，正确姿态是继续深挖，而不是过度支撑一个溢价估值。
