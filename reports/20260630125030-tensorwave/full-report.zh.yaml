      - number: '1.4'
        title: 客户验证、合作伙伴栈与活跃风险信号
        blocks:
          - type: paragraph
            body: >-
              TensorWave 故事的积极版本是，公司已经围绕 AMD-first 押注积累真实生态验证。2026 年 6 月 Series B 新闻稿点名 Fireworks AI 和 Luma AI
              为活跃采用者；2026 年 2 月 Credo 公告显示 TensorWave 把更强的互连组件纳入未来集群建设；AMD 和 Modular
              材料则都把可移植性和推理经济性写进公司的价值主张。信任中心披露、模型训练页面和 Beyond Summit 活动页也显示，TensorWave 正试图把硬件规模与围绕安全、ROCm
              使能和开发者教育的公开叙事配对。


              风险层同样重要。TensorWave 自己的 2024 年 TechCrunch 画像披露了至少六个月合同，并拒绝公布客户数量，留下实质性的集中度问题。结构上，SemiAnalysis 认为 AMD
              的公开训练栈到 2024 年末仍明显落后于 NVIDIA，并特别报道 TensorWave 向 AMD 免费提供 GPU 时间以帮助调试软件问题。SCALE 的 2026
              年市场份额分析进一步说明这为什么重要：即便 AMD 硬件经济性改善，CUDA 仍主导公开开发者心智。最后，The Next Web 把 AMD 资助自身客户作为切入点，是合理的尽调挑战，因为 TensorWave
              的供应商集中度和投资人一致性同时是优势，也是依赖。
