  - id: TU003
    title: 具名客户证据表
    enumeration: true
    enumerationScope:
      coverage: sample
      basis: >-
        Representative sample of the most decision-useful 2025-2026 named TensorWave customer or ecosystem proofs,
        filtered for stories that disclose workload type, production status, or quantitative outcome.
    columns:
      - 客户
      - 细分
      - 部署用例
      - 生产状态
      - 结果
      - 限制
    rows:
      - - Moreh
        - AI 推理软件 / APAC 企业基础设施
        - >-
          使用 vLLM 在 MI355X 节点上验证前沿 LLM 推理，覆盖 GPT-OSS 120B、DeepSeek-R1 671B、Qwen3 235B A22B、Llama-4-Maverick 17B 和 Llama
          3.3 70B
        - 真实云环境中的生产级验证；客户指标披露仍处早期
        - 模型权重下载时间降至以往环境的约 25%；MI355X 的带宽和 GEMM 性能优于 MI300X；实时支持降低迭代摩擦
        - 结果数据由供应商撰写；Moreh 明确表示客户级指标仍过早，暂不发布；MORI 节点间库当时不可用
      - - AstraZeneca
        - 受监管企业生命科学
        - 将 REINVENT4、SemlaFlow 和 SwinUNETR 训练从基于 NVIDIA 的环境迁移到 TensorWave 托管的 MI300X GPU
        - 生产级 R&D 工作负载 / 企业迁移证据
        - SemlaFlow 训练时间减少 49%；REINVENT4 平均提升 41%；SwinUNETR 最高提升 1.8x；无需重大代码改动
        - 性能数据来自 AMD 和 TensorWave，而不是带合同规模或续约披露的投资人式客户访谈
      - - Zyphra
        - 前沿模型实验室 / 开放模型平台
        - 围绕 1,024 块 MI300X GPU 的大规模 AMD 训练和拓扑优化；Maya OS 在 AMD 上的定位
        - 生产规模训练 / 研究工作负载
        - 证明存在真实的大集群训练需求，也证明 AMD 的内存和成本优势以及软硬件协同设计经验
        - 未披露对 TensorWave 的商业价值；多数细节来自 TensorWave 活动报道，而非独立客户案例研究
      - - Featherless
        - 无服务器 LLM 托管 / 推理平台
        - 面向推理的模型托管，以及围绕开放模型、强调可靠性的部署思路
        - 工作负载证据；未披露在 TensorWave 上的直接付费范围
        - 公开证据强调在 8 块 MI300X GPU 上推理成本降低 1,000x 的说法、24-27B 作为偏好的生产模型尺寸，以及 90-99% 可靠性阈值
        - 保留材料属于会议 / 活动式证据，不是带支出或期限的已签约生产部署披露
      - - Modular
        - 推理软件生态伙伴
        - MAX 推理栈部署在 TensorWave AMD 基础设施上，用于 token 和图像生成工作负载
        - 伙伴辅助的生产部署路径
        - 案例研究称总成本节省约 70%，小时算力成本比 AWS 上 H200 低 58%，每百万 token 成本降低 60-70%，并使用企业级 SLA 表述
        - 这是强生态证据，但不能干净证明 Modular 本身是为大额 TensorWave 用量付费的常规终端客户
      - - 生态项目：AT&T / Open Telco AI
