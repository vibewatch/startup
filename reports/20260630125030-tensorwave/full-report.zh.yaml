  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最主要的残余风险集中在锁定效应、园区交付和投资测算不透明
        blocks:
          - type: paragraph
            body: >-
              TensorWave 的风险栈很重，因为几组独立依赖会相互放大。公司不是单纯出租 GPU；它要求客户和投资人同时接受全 AMD 供应链、仍在演进的 ROCm 软件栈，以及快速推进的多 GW
              园区建设。公开证据显示，公司确实有一些缓释因素——托管编排、液冷系统、信任中心材料、专家支持和投资人反复加码——但这些缓释仍比其要抵消的底层义务更薄。最难处理的是会叠加的残余风险：如果 AMD
              软件在关键训练路径上仍不如 NVIDIA 适合生产，TensorWave
              可能需要投入更多服务才能赢单；如果园区交付延误，利用率和融资假设都会变差；如果客户数继续不透明，外部人无法判断新增容量是否匹配了足够分散的需求。投资含义是，TensorWave
              的下行风险不太像某个季度失手，更像几组相互咬合的执行假设一起失效。
