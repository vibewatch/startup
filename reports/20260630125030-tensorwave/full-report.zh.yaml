        title: 信任控制、设施依赖与路线图现实性
        blocks:
          - type: paragraph
            body: >-
              对早期 neocloud 而言，公开信任证据相对较强。TensorWave 的安全界面点名 ISO 27001、SOC 2 Type II、HIPAA-oriented
              防护、渗透测试、日志、漏洞管理和事件响应；Trust Center 公开具名的 2025 年审计材料和 2026 年渗透测试摘要，而不是只有通用徽章。保留项在范围：已审阅来源集没有展示公开
              BAA、认证边界，也没有给出足够详细证据支撑最宽的受监管工作负载声明。基础设施侧，TensorWave 的路线图还依赖设施执行。TECfusions 把 TensorWave 下一阶段与 Arizona 和
              Pennsylvania 合计 20MW、直接液冷、高机架密度部署和多阶段 1GW 路径绑定，这意味着产品扩张离不开电力、冷却和站点交付。因此，官方路线图信号可信但混合：Beyond Summit 显示 2026
              年 ROCm、MI355X 和框架可移植性使能在活跃推进；MI455X / Helios
              仍以预期规格销售，且没有公开价格。结果是，产品故事今天已有真实运营深度，也有可见扩张路径，但围绕受监管范围、预发布硬件准备度和独立性能验证仍存在实质尽调缺口。
