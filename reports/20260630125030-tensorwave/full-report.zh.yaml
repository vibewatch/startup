  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 路径
      - 公开定价姿态
      - 包含能力
      - 未知项或取舍
      - 买方含义
    rows:
      - - TensorWave
        - 已审页面没有公开标价
        - 围绕 AMD 堆栈提供裸金属、托管 Kubernetes、托管 Slurm 和信任姿态
        - 实际 GPU-hour 价格、存储费、预留产能条款和折扣未披露
        - 没有管理层或客户数据，TCO 难以扎实测算
      - - CoreWeave
        - 已审材料公开围绕 TCO 和推理经济性讲价值，而非明确标价
        - 专为 AI 打造的云，编排、存储和可靠性主张强
        - 客户仍需按工作负载建模，才能把平台主张换算成真实支出
        - 更适合愿意测算全栈经济性、而不只看 GPU 标价的买方
      - - Lambda
        - 销售主导的专用基础设施姿态
        - 单租户 NVIDIA 超级计算机、托管集群和共同工程
        - 已审页面未显示准确公开费率
        - 适合定制集群，但较小买方仍会遇到询价摩擦
      - - Together AI / Cerebras
        - 比 TensorWave 打包更清楚：无服务器、批处理、专用、按小时付费、按模型付费
        - 托管推理、计算、微调和简化云训练
        - 可能无法干净映射到全集群所有权或定制基础设施经济性
        - 更适合想要打包消费、而非定制集群合同的买方
      - - Nebius / Crusoe
        - 经济性更多靠 TCO 和正常运行时间主张传达，而不是公开标价卡
        - 服务投入重的 AI 云，带托管运营和支持
        - 已审材料里可直接横比的标价仍有限
        - 对重视服务水平框架和经过基准验证的 TCO 论证的买方更有吸引力
      - - 超大云厂商
        - Oracle 明确宣传低价格和无承诺；AWS、Google 和 Azure 更强调能力和生态，而非标价简单
        - GPU 集群、专有芯片和更广泛云服务
        - 一旦叠加存储、网络和托管服务，定价会变复杂
        - 既有云买方可能接受更高或更不透明的成本，以换取生态引力
    notes: 本表比较打包姿态，不声称精确实际成本，因为已审 TensorWave 材料没有披露合同费率。
