      - number: '5.3'
        title: 可移植性生态既是主要差异点，也是主要依赖
        blocks:
          - type: paragraph
            body: >-
              TensorWave 最尖锐的产品差异化不来自专有芯片或封闭软件护城河，而来自把 AMD 硬件与可移植性、工作流合作伙伴缝合在一起，降低用户切换 CUDA 的成本。AMD 自有案例研究、Modular 案例材料和
              TensorWave 界面都指向同一方向：公司希望客户快速把工作负载迁到 AMD 上，保持代码路径开放，并把前沿推理经济性与更容易迁移配对。Modular 通过 Mojo、MAX 和 Mammoth
              增加可移植推理层；Spectral 把 SCALE 定位为 CUDA 重编译路径；ScalarLM 在一个 Slurm 加 Kubernetes 部署中统一推理和后训练。这一策略商业上合理，因为 ROCm
              开放性和 AMD 内存优势是真实的，但主要风险也在这里。Spectral 到 2025 年末仍把 PyTorch、vLLM 和 SGLang 覆盖描述为路线图工作；Business Insider
              指出目前只支持部分 AMD 架构；Semianalysis 则显示 AMD 的开箱即用训练栈到 2024 年末仍明显落后于 NVIDIA。换句话说，TensorWave
              的产品边缘有意义，但它依赖合作伙伴和生态，而不是完全内化。
