      - number: '7.5'
        title: 缓释因素只有能对照明确断点监控，才具备可投资性
        blocks:
          - type: paragraph
            body: >-
              TensorWave 不需要让所有风险消失；它需要把最高严重度的风险变成可监控项。公司已经有一些可信的缓释组件：反复跟投的投资人带来资本通道、公开安全材料、用托管编排替代裸 GPU
              租赁，以及至少部分客户以偏生产的方式使用平台的证据。但每个缓释都需要监控指标。可移植性说法必须转化为证据：客户在采用 ROCm
              时不会卡住。园区速度说法必须转化为按时通电和稳定高密度运营。客户需求说法必须转化为比少数具名引用更宽的客户名单。融资能力必须转化为已披露结构，不能在利用率滑坡时让股东暴露在脆弱抵押或稀释动态之下。做投资测算时，正确姿态不是挥手抹掉风险，而是把风险绑定到否决标准：软件对等、交付节奏、已签约需求、受监管客户文档和融资耐久性。
