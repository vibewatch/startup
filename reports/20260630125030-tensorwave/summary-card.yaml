      Public customer proof is narrow and partner-authored, with no disclosed customer count, concentration, or renewal
      metrics.
    - >-
      AMD / ROCm ecosystem dependence and CUDA lock-in risk could pressure utilization, pricing, and adoption in a
      crowded neocloud market.
  unresolvedGaps:
