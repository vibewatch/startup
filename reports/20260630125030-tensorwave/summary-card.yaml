      Current customer count, top-account concentration, pilot-versus-production mix, and retention metrics such as NRR,
      GRR, and logo churn.
    - Audited 2025-2026 revenue, gross margin, burn, runway, and cash-balance disclosure.
    - >-
      Independent evidence that secured power and >2GW capacity claims are translating into durable contracted
      utilization and backlog.
    - Current board composition, governance rights, and investor-control structure.
