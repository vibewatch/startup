    {
      "id": "product-surface-and-skus",
      "title": "Product surface and accelerator staircase",
      "body": "TensorWave's product surface is more than a single GPU instance page: it is a staged AMD-only infrastructure ladder that starts with priced MI300X, MI325X, and MI355X nodes and extends to a prelaunch MI455X / Helios rack-scale roadmap. The current commercial pattern is clear on official surfaces. MI300X is framed as a lower-TCO inference-oriented node with 192GB HBM3E and air cooling; MI325X and MI355X move up the ladder with higher memory, direct liquid cooling, and higher list prices; and MI455X is already being marketed as the next rack-scale step even though pricing is still listed as TBD and the specs are explicitly \"expected.\" Bare metal is the foundational delivery model underneath the stack, which matters because TensorWave is selling deterministic hardware access and memory-heavy AMD clusters rather than a generic multi-tenant cloud abstraction. The practical read is that the SKU staircase is real for today's three shipping families, but the frontier roadmap is still partly marketing-led until the MI455X offer has commercial availability, customer references, and non-expected specifications.",
