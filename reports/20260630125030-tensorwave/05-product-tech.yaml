    {
      "id": "trust-dependencies-and-roadmap",
      "title": "Trust controls, facilities dependencies, and roadmap realism",
      "body": "Public trust evidence is comparatively strong for an early neocloud. TensorWave's security surface names ISO 27001, SOC 2 Type II, HIPAA-oriented safeguards, pentesting, logging, vulnerability management, and incident response, while the Trust Center exposes named 2025 audit artifacts and 2026 pentest summaries rather than just generic badge logos. The caveat is scope: the reviewed source set does not show a public BAA, certification boundary, or detailed evidence for the broadest regulated-workload claims. On the infrastructure side, TensorWave's roadmap also depends on facilities execution. TECfusions ties TensorWave's next phase to 20MW across Arizona and Pennsylvania, direct liquid cooling, high-rack-density deployments, and a multi-phase 1GW path, which means product scaling is inseparable from power, cooling, and site delivery. Official roadmap signals are therefore credible but mixed: Beyond Summit shows active ROCm, MI355X, and framework-portability enablement in 2026, while MI455X / Helios is still sold with expected specs and no public price. The result is a product story with real operational depth today and visible expansion paths, but still with material diligence gaps around regulated scope, prelaunch hardware readiness, and independent performance proof.",
