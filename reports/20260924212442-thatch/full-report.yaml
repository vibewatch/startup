        title: Customer mix and buyer shape
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a buyer mix that starts with employers and their HR or benefits owners, but
              reaches employees, brokers, and payroll administrators. Thatch positions itself as an employer-funded
              ICHRA platform, so the payer is usually the company while the user is the employee who chooses coverage
              and spends the health budget. That is most compelling for smaller employers that want fixed costs and less
              benefits administration, and for mid-market companies that want choice without building an internal
              benefits stack. The same public materials also show that channel partners matter: payroll platforms and
