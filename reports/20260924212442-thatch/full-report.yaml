      - number: '5.3'
        title: Trust, compliance, and open technical questions
        blocks:
          - type: paragraph
            body: >
              Thatch’s legal surface shows a meaningful amount of embedded compliance work: FDIC sweep disclosures, HSA
              eligibility terms, online banking controls, ACH and P2P transfer rules, privacy language, and
              fraud/security restrictions all appear directly in the public docs. That is a strong sign that the company
              is operating with real-money rails and regulated health-benefits logic, not a lightweight SaaS wrapper. It
              also means product reliability is inseparable from regulatory and partner dependency risk.


              The main diligence gap is not whether the concept exists; the public evidence is enough to show that. The
              gap is how much of the internal control stack is formally documented, how much uptime and incident history
              the team is willing to disclose, and how far the technical architecture has been hardened for scale. Those
              are the items that determine whether the product is merely functional or operationally durable.
