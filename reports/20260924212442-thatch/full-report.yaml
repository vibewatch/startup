      - number: '7.2'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: |
              Thatch's public legal documents are the clearest source of downside
              visibility. The deposit-account agreement says Thatch Health, Inc. is not
              an FDIC-insured bank, that Thread Bank provides banking services, and that
              Thatch's account program sits inside a bank-partner and insurance-services
              structure. That means product risk is also regulatory risk: if the bank
              partner, disclosures, or account mechanics are challenged, customers can
              experience frozen flows or forced product redesigns.

              The same agreement also hard-codes arbitration, a class-action waiver, a
              Tennessee forum, and a two-year claim window. Those terms reduce some
              litigation surface but do not remove consumer-protection or complaint risk.
              In parallel, the Render customer story shows that Thatch's team treats
              HIPAA and SOC 2 as operational requirements rather than optional badges.
              That is the right posture, but it also confirms that the company handles
              sensitive healthcare-related data and therefore needs repeatable controls,
              documentation, and incident response.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
      - number: '7.3'
        title: Operational and security exposure
        blocks:
          - type: paragraph
            body: |
              Operational risk is concentrated in the plumbing that makes the product
              usable every day. Render's customer story says Thatch used private
              networking, data encryption, and audit controls to preserve HIPAA and SOC 2
              compliance while the engineering team continued shipping quickly. That is a
              good sign, but it also means the company is depending on a partner-managed
              hosting and deployment layer for core reliability and compliance building
              blocks.

              The same story says the company had only ten engineers, with two focused on
              platform and security-shaped work, and that production deploys moved from a
              commit to live in six to eight minutes. That combination can be a strength
              if it is disciplined; it is a risk if growth outpaces controls. The product
              also spans plan selection, account funding, eligible-expense logic, and AI
              assistance, which raises the chance that a small bug or a model error becomes
              a customer-facing issue. In short, the main operating risk is not lack of
              ambition; it is whether the company can keep quality, security, and uptime
              ahead of product breadth.
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR011
      - number: '7.4'
        title: Partner and financial-model risk
        blocks:
          - type: paragraph
            body: |
              Thatch's growth model depends on a multi-partner distribution and custody
              stack. The company says it has partnerships with Gusto, Justworks, Paychex,
              and ADP RUN, and its legal docs show that Thread Bank and other service
              providers sit underneath the customer experience. That structure should
              expand reach, but it also creates dependency risk: a partner policy change,
              product change, or compliance issue can affect acquisition, funding flows, or
              customer trust all at once.

              The financial model also still appears outcome-sensitive. Thatch says ARR is
              up almost 7x and the business now serves more than 5,000 employers, but the
              public materials do not disclose customer concentration, loss experience, or
              the unit economics behind the growth. The valuation reset to $1B after the
              Series C raises the bar further: if employer adoption, partner distribution,
              or compliance execution slows, the implied multiple compression can happen
              quickly. The risk is not that the market is uninteresting; it is that the
              current valuation assumes a long runway of smooth execution.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR003
