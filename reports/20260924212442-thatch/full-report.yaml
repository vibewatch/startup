      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The category still appears early enough that most direct-peer economics remain hidden, so the strongest
              competitive read is structural rather than SKU-specific. Thatch can plausibly benefit from scale effects
              in plan selection, carrier choice, and payroll distribution, but those same mechanics also make the
              category vulnerable to bundling by payroll vendors, brokers, carriers, or future ICHRA specialists. Not
              Boring's thesis is that more ICHRA adoption improves the underlying market, but that same adoption can
              commoditize the basic workflow if the rails become standardized. In other words, the moat case is real,
              but it depends on Thatch staying ahead in distribution and compliance execution more than on owning a
              permanently unique product.
