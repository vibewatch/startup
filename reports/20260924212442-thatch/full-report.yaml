  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, incumbents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Thatch's own disclosure and the retained press coverage point to a compact direct-peer set: Take Command,
              Remodel Health, and Zorro are the named ICHRA startups in TechCrunch's coverage of the latest round. That
              direct peer bucket is only one slice of the real substitute set. The stronger incumbent alternative
              remains the legacy employer-sponsored group plan, where carriers and brokers still control plan selection,
              renewals, and pricing. Thatch's positioning, as described in its blog and in third-party coverage, is to
              pull employers away from that status quo by turning healthcare into a defined contribution and an
              individual plan-shopping experience. The practical consequence is that competition spans software,
              compliance operations, distribution, and trust infrastructure rather than just a single feature set.
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP010
              - CP011
      - number: '3.2'
        title: What appears to differentiate Thatch
        blocks:
          - type: paragraph
            body: >-
              The strongest visible differentiator is not a unique insurance product; it is the bundle Thatch wraps
              around ICHRA. The retained sources show payroll and benefits distribution through ADP RUN, Gusto,
              Justworks, and Paychex, plus a compliance-heavy operating stack that includes a card, bank partner,
              insurance-services entity, and third-party service providers. That package matters because ICHRA is hard
              to implement manually, and because employers want something that can be activated through existing payroll
              channels rather than another point solution. On the evidence available here, Thatch looks more like an
              infrastructure company for defined-contribution health benefits than a simple marketplace.
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
