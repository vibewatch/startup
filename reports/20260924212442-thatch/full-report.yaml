  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price, traction, and what the mark is really saying
        blocks:
          - type: paragraph
            body: >-
              Thatch is not priced like a sleepy software vendor. Public materials point to a $108M Series C in
              September 2026 at a $1B valuation, a roughly 8.8x step-up from the Series B mark that secondary-market
              pages infer from the company's financing history. The interesting part is that the headline price is not
              standing alone: the company also says ARR has grown nearly 7x over the prior twelve months and that it now
              serves more than 5,000 employers. That combination makes the mark look directionally credible, even if it
              is still a forward-looking judgment rather than a proof of durable earnings power.


              The bull case is that Thatch is building infrastructure for employer health-benefits distribution at
              exactly the moment when employers, brokers, and payroll platforms are looking for simpler ICHRA workflows.
              The counterpoint is just as important: the public record still stops short of the metrics that would let
              an investor underwrite the mark with confidence. There is no disclosed current ARR run rate, no public
              gross margin series, and no retention dashboard, so the current valuation has to be inferred from
              financing, partner mix, and adoption signals rather than from a conventional financial statement.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV012
      - number: '8.2'
        title: Comparable sets and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The cleanest public comp frame is not a single revenue multiple. Multiples and Forge both place Thatch
              around the same $1B neighborhood, but the comparable set itself is heterogeneous: GoodRx, Rightway,
              PayZen, Curative, and Hapvida span public and private healthcare-adjacent software, consumer health, and
              benefits infrastructure profiles. That means a one-line multiple is mostly a shorthand for market
              appetite, not a precise valuation model.


              On that basis, the base case is a valuation that can hold near the current mark if the company sustains
              high growth, keeps channel partners converting employers, and turns the product into a repeatable
              distribution layer. The bull case requires continued ARR acceleration and better proof that employer
              onboarding and benefit administration can scale without proportional operating drag. The bear case is
              straightforward: if growth normalizes, if channel partners slow adoption, or if the company cannot
              disclose enough economics to justify the mark, the current valuation becomes vulnerable to multiple
              compression.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Entry discipline, overhangs, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The entry question is not whether Thatch is interesting; it is whether the market has already paid for the
              easy version of the story. The company has real strategic assets: payroll and insurer relationships, a
              consumer-facing health-budget workflow, and visibility into a large, messy employer-benefits market. But
              the same architecture creates dependency risk. The legal disclosures make clear that Thatch is not a bank,
              that banking services are provided by partner institutions, and that insurance services route through a
              separate licensed entity. Those are normal structures for the category, but they also mean valuation
              depends on partner continuity and regulatory execution, not just product UX.


              For diligence, the key asks are simple: disclose a tighter ARR bridge, a margin trajectory, and evidence
              that employer cohorts retain after implementation; show how partner concentration is trending; and explain
              whether the current $1B mark reflects operational progress or mainly investor enthusiasm for the category.
              Until those questions are closed, the right action is to track the name closely and require a cushion to
              the headline price rather than assume the mark itself is the opportunity.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV012
