      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The most plausible buyer sequence starts with small businesses, moves through mid-market employers, and
              only later reaches large self-funded groups. That path matches the survey evidence: small-business owners
              want more choice, employees want flexibility, and employers say it is hard to find a benefits solution
              that fits diverse workforces. The adoption path depends on brokers, payroll providers, carriers, and other
              channel partners because they reduce setup friction and help normalize ICHRA for buyers. The main
              constraint is not just software; it is regulation, pricing, and risk-pool economics. If ACA-linked rates
              move or if carriers do not deepen the individual-market product set, the market can still grow but stay
              niche.
