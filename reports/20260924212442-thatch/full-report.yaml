  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Implied valuation logic
      - Key trigger
    rows:
      - - Bull
        - ARR keeps compounding, channel partners expand, and public metrics eventually show healthy margins.
        - The current mark can be sustained or re-rated above $1B if growth stays exceptional.
        - Another year of outsized ARR growth with better operating disclosure.
      - - Base
        - Growth normalizes but stays above category average; distribution remains intact.
        - The present mark looks roughly fair if the company keeps scaling but does not overdeliver.
        - Continued employer additions without a major step-up in margin proof.
      - - Bear
        - Growth slows, partner economics worsen, or disclosure stays thin.
        - The valuation compresses because the market stops paying for narrative alone.
        - A visible slowdown in employer growth or a partner/regulatory snag.
      - - Exit-readiness lens
        - The business is interesting enough for follow-up but not yet evidence-complete.
        - A tracked name rather than an immediate buy.
        - A tighter ARR bridge and margin series would justify a different call.
    notes: >-
      Scenario ranges are directional and inferred from the public financing marks and adoption signals; they are not a
      full valuation model.
    claimRefs:
