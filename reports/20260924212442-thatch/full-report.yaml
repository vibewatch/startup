      - number: '4.3'
        title: Underwriting verdict and gaps
        blocks:
          - type: paragraph
            body: >-
              On the evidence available today, Thatch looks like a company with credible demand, fast top-line
              expansion, and a capital base that should support further growth. The problem for underwriting is that the
              public record still does not answer the questions that matter most for margin path and cash consumption:
              there is no disclosed rate card, no published gross margin, no CAC payback, and no runway guidance. The
              mid-year market brief helps explain why the category is attractive, but it also underlines that ICHRA
              adoption is exposed to regulatory and pricing swings. That leaves the investment case directionally
              positive, but still too opaque for a clean financial model.
