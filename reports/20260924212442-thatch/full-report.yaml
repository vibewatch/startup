  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture
        blocks:
          - type: paragraph
            body: |
              Thatch is not a single-regime software business. The company presents itself
              as an ICHRA-based health benefits platform, but the operating model spans
              employer benefits, bank-custody mechanics, and insurance-adjacent flows.
              That design widens the failure surface: a problem in any one layer can show
              up as a customer-service issue, a compliance problem, or a distribution
              slowdown.

              The public evidence is encouraging on growth, but it also shows how much of
              the thesis is still routed through partners. Thatch says ARR has grown
              almost 7x, that it powers benefits for more than 5,000 employers, and that
              it relies on payroll and benefits integrations to keep expanding. Those are
              strong signals, but they are also a warning that momentum depends on a
              tightly managed partner stack and continued employer adoption.

              The matrix below ranks the top risks by likely severity rather than by a
              generic company-quality score. The key question is not whether the product
              is attractive; it is whether compliance, partner concentration, and service
              reliability can keep pace with growth.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR012
              - CR013
          - type: figure
