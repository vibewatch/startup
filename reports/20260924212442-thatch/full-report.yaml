  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >
              Thatch presents a consumer-directed health-benefits workflow rather than a classic group-plan insurer
              workflow. The public product surface is centered on giving employers a health-budget model, letting
              employees choose their own plans, and then extending that budget into eligible health spend across a
              curated marketplace. The most visible external proof points are the homepage, the Series C announcement,
              and the company’s job postings, which together show a product that is already in market, distributed
              through payroll and benefits partners, and being expanded through adjacent health services.


              This chapter reads the product as a bundle of employer administration, member selection, and market access
              layers. That framing matters because the real differentiation is not just the consumer experience; it is
              the orchestration required to make ICHRA, reimbursements, partner rails, and eligibility rules behave like
              a reliable operating system for benefits.
