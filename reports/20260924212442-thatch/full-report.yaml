      - number: '5.2'
        title: Operating model, architecture, and dependencies
        blocks:
          - type: paragraph
            body: >
              The strongest technical signal in the public record is that Thatch’s product is built around funds flows,
              data models, automations, and ledger-like operational control. The company is explicitly hiring for
              systems that integrate with carriers, financial partners, payroll providers, and banks, which suggests
              that the core technology challenge is reliability across many external systems rather than a single
              monolithic software stack. That also explains why the product language keeps returning to observability,
              engineering standards, and operational rigor.


              In other words, Thatch appears to sit between the employee-benefits experience and the regulated financial
              rails that make the experience work. The stack is therefore both product and infrastructure: member choice
              on one side, partner settlement and compliance on the other, with the orchestration core in the middle.
