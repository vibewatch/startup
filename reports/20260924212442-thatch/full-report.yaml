    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product
        blocks:
          - type: paragraph
            body: >-
              Thatch is publicly positioning itself as an all-in-one platform that helps employers offer personalized
              healthcare benefits through ICHRA and employee health budgets. The company's own website and legal
              disclosures frame it as a financial technology company rather than an FDIC-insured depository institution,
              with banking services and insurance functions handled through partners and a separate insurance-services
              LLC. That structure matters because the product is not just software for plan selection; it is
              infrastructure that orchestrates reimbursements, compliance, banking rails, and insurance distribution.
              Reviewed material places the company in San Francisco and dates the business to 2021, but it does not
              expose a public cap table or independently audited financials.
