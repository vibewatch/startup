    type: journey-map
    summary: >-
      Thatch's public customer journey runs from employer need and channel onboarding to employee plan selection,
      marketplace spend, and advocacy-led expansion.
    data:
      items:
        - label: Employer need
          value: A small or mid-market employer wants fixed benefits spend and less administration.
          note: This is the payer-side trigger for ICHRA adoption.
        - label: Channel onboarding
          value: Payroll, broker, or partner routes bring the employer into the platform.
          note: Public materials emphasize Gusto, Justworks, Paychex, and ADP RUN.
        - label: Employee selection
          value: Employees choose coverage and health-spend options that fit their situation.
          note: This is where the user experience becomes visible.
        - label: Reimbursement / wallet use
          value: Remaining budget flows through reimbursements, card spend, or account rails.
          note: The Thread Bank / Thatch account structure shows the operational layer behind the experience.
        - label: Marketplace expansion
          value: Members spend leftover dollars on additional health and wellness services.
          note: This broadens the customer relationship beyond insurance administration.
        - label: Advocacy and references
          value: Satisfied customers feed references, migration stories, and future expansion.
          note: The customer-advocacy role suggests this loop is strategic, not incidental.
