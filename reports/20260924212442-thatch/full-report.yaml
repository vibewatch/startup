      - - ARR and employer count are growing quickly.
        - Growth may not translate into durable margins or retention.
        - A disclosed margin and retention trend with cohort stability.
      - - Strategic investors validate the category.
        - Strategic money can overstate enthusiasm in a hot niche.
        - Independent proof of customer pull outside the investor ecosystem.
      - - The product is infrastructure-like and sticky.
        - Infrastructure models often face integration drag and support costs.
