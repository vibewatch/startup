            body: >-
              The latest public financing data point is the $108 million Series C at a $1 billion valuation, with Forge
              putting total funding at roughly $192.25 million. That capital profile suggests the business has enough
              backing to keep scaling, but the actual adequacy of its balance sheet remains opaque because cash on hand,
