  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Thatch's market is best defined as employer-directed health benefit spend that can be redirected into
              individual coverage and reimbursable health-related purchases through an ICHRA-style workflow. That is
              narrower than the whole U.S. healthcare system, but broader than a pure insurance admin tool because the
              product also routes leftover allowance dollars into approved services. The practical substitutes are
              traditional group plans, self-funded or level-funded arrangements, and direct consumer out-of-pocket
              purchase of care. Those remain outside the addressable market unless the employer funds them through an
              allowance. The boundary matters because it determines whether the company is selling insurance
              administration, benefits software, or a new spending rail for health dollars.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM015
      - number: '2.2'
        title: Sizing lenses and market geometry
        blocks:
          - type: paragraph
            body: >-
              A single TAM estimate is too blunt for this market. The most useful lens starts with the
              employer-sponsored insurance pool and then overlays the adjacent ACA individual market, because ICHRA can
              only work by moving employer dollars into that risk pool. A second lens is the broader healthcare ceiling:
              if the market is treated as the whole $5.6 trillion U.S. spend pool, the number becomes directionally true
              but analytically useless. The third lens is adoption intensity: small-business choice demand, current
              employer traction, and the illustrative effect of a 10% employer-to-ICHRA shift. Together they show that
              the opportunity is large enough to matter, but still constrained by conversion speed and product friction.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
