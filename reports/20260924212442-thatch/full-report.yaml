    title: Company milestone timeline
    type: timeline
    summary: Milestones from founding through the September 2026 Series C and operating-scale expansion.
    data:
      items:
        - label: Founding
          date: '2021'
          detail: Thatch is founded in San Francisco by Adam Stevenson and Chris Ellis.
        - label: Early outside backing
          date: 2022-01
          detail: Not Boring Capital says it invested in Thatch in early 2022.
        - label: Series A
          date: 2024-09
          detail: Thatch announces a $38 million Series A led by Index Ventures and General Catalyst.
        - label: Series B inflection
          date: 2025-04
          detail: The company references a prior Series B fundraise as the growth inflection before the 2026 expansion.
        - label: Venteur migration
          date: '2026-04-01'
          detail: Thatch announces a transition for Venteur employers, employees, and brokers onto its platform.
        - label: Scale milestone
          date: '2026-09-15'
          detail: Thatch says it now powers more than 5,000 employers and its ARR has surged almost 7x.
        - label: Product expansion
          date: '2026-09-15'
          detail: Thatch launches Thatch Market and deepens integrations with Gusto, Justworks, Paychex, and ADP RUN.
        - label: Series C and valuation
