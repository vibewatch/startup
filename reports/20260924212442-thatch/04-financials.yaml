callouts:
  - calloutType: "risk"
    title: "What is still missing for underwriting"
    body: "The public evidence is good enough to believe Thatch is growing, but not good enough to size the margin path with confidence. The missing items are the ones that determine whether growth is capital-efficient: rate card, gross margin, CAC payback, cash burn, and runway."
    claimRefs: [CI008, CI012, CI013]
