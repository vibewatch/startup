company:
  name: "Thatch"
chapter:
  number: 4
  title: "Financials"
  summary: "Thatch is scaling quickly on a defined-contribution ICHRA model, with public evidence pointing to a $1 billion Series C valuation and rapid ARR growth. The public record is still thin on pricing, gross margin, cash burn, and runway, so the company looks more like an early-scale growth story than a fully underwritable financial profile."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue model and monetization"
    body: "Public disclosures frame Thatch as an employer-funded health-benefits platform built around ICHRA budgets rather than a traditional insurance risk taker. The company says it helps employers move from choosing a single group plan to giving employees a health budget they can use across plans and eligible care. That model creates a plausible mix of employer platform revenue, partner-rail economics, and service fees, but the public sources reviewed here do not disclose list pricing or realized revenue mix. The strongest disclosed traction signals are the reported almost 7x ARR increase and the more than 5,000 employers already using the platform, which are meaningful scale indicators even though they do not yet tell us gross margin or unit economics."
    claimRefs: [CI001, CI004, CI005, CI006, CI007, CI008, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: "capital-structure-and-dependencies"
    title: "Capital structure and operating dependencies"
    body: "The latest public financing data point is the $108 million Series C at a $1 billion valuation, with Forge putting total funding at roughly $192.25 million. That capital profile suggests the business has enough backing to keep scaling, but the actual adequacy of its balance sheet remains opaque because cash on hand, burn, runway, and debt obligations are not public. The legal disclosures also show why Thatch is structurally asset-light: it is not an FDIC-insured bank, and its banking and insurance services rely on partner rails and regulated affiliates. That lowers direct balance-sheet risk, but it also means the revenue engine depends on third-party partners and careful operating coordination."
    claimRefs: [CI001, CI002, CI009, CI010, CI011, CI012]
  - id: "underwriting-verdict-and-gaps"
    title: "Underwriting verdict and gaps"
    body: "On the evidence available today, Thatch looks like a company with credible demand, fast top-line expansion, and a capital base that should support further growth. The problem for underwriting is that the public record still does not answer the questions that matter most for margin path and cash consumption: there is no disclosed rate card, no published gross margin, no CAC payback, and no runway guidance. The mid-year market brief helps explain why the category is attractive, but it also underlines that ICHRA adoption is exposed to regulatory and pricing swings. That leaves the investment case directionally positive, but still too opaque for a clean financial model."
    claimRefs: [CI005, CI006, CI012, CI013]
    tableRefs: [TI003]
tables:
  - id: "TI001"
    title: "Revenue streams table"
    columns: ["stream", "mechanism", "unit", "current value/status", "quality", "diligence ask"]
    rows:
      - ["Employer platform / benefits admin", "Employer funds are routed through Thatch's ICHRA workflow and enrollment stack", "per employer or per enrolled employee", "not publicly disclosed", "medium", "Request a customer contract and a current rate card"]
      - ["Partner bank / treasury economics", "Partner-bank sweep and custody rails support the cash-moving part of the product", "basis points or program fee", "not publicly disclosed", "medium", "Request the partner revenue-share schedule"]
      - ["Insurance administration / brokerage", "Insurance services and enrollment support sit alongside the employer-facing platform", "per member or per employer", "not publicly disclosed", "medium", "Request commission and admin-fee detail by line"]
      - ["Marketplace / add-on services", "Thatch Market and related services can monetize usage beyond the core budget workflow", "per transaction or service fee", "launch disclosed; monetization not public", "low", "Request attach-rate and take-rate data"]
    notes: "Public sources describe the operating model but do not disclose realized revenue mix; null or 'not publicly disclosed' means the reviewed sources did not give a verifiable figure."
    claimRefs: [CI004, CI007, CI008, CI011, CI012]
  - id: "TI002"
    title: "Pricing / monetization table"
    columns: ["price item", "list price", "realized price", "discounts / unknowns", "source"]
    rows:
      - ["Employer platform pricing", null, null, "No public rate card or contract pricing was found in the reviewed sources", "Official blog, homepage, and third-party funding pages"]
      - ["Employee plan purchase", null, null, "Plan premiums are set by insurers; Thatch does not publish its realized spread", "Official blog and legal disclosures"]
      - ["Marketplace add-ons", null, null, "No public pricing page for Thatch Market or its service bundles", "Official blog"]
      - ["Banking / insurance service fees", null, null, "Partner contract economics are not public", "Legal disclosures"]
    notes: "List pricing is not publicly disclosed; null means unavailable in the sources reviewed, not zero."
    claimRefs: [CI008, CI009, CI010, CI012]
  - id: "TI003"
    title: "Unit economics table"
    columns: ["metric", "value", "confidence", "why it matters", "diligence ask"]
    rows:
      - ["ARR growth", "almost 7x over the last twelve months", "medium", "Shows rapid scale, but not margin quality", "Request absolute ARR and growth by revenue line"]
      - ["Gross margin", null, "low", "Needed to judge whether the model behaves like software or services", "Request gross margin by product and by partner rail"]
      - ["CAC payback", null, "low", "Tells us how expensive growth is relative to employer lifetime value", "Request blended CAC, payback, and sales cycle"]
      - ["Burn / runway", null, "low", "Determines whether the Series C is enough to fund the next growth phase", "Request current cash, monthly burn, and runway forecast"]
    notes: "All null fields mean the public sources reviewed here did not disclose the metric; this is a diligence gap, not a zero value."
    claimRefs: [CI005, CI006, CI012]
