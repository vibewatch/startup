    title: ICHRA adoption pyramid
    type: pyramid
    summary: "A constrained sizing stack showing the broad healthcare ceiling, the employer-sponsored pool, the adjacent individual-market pool, and the current adoption wedge."
    data:
      nodes:
        - label: "Total U.S. healthcare spend"
          value: 5.6
          unit: "T USD"
        - label: "Employer-sponsored insurance spend"
          value: 1.3
          unit: "T USD"
        - label: "Current ACA individual-market pool"
          value: 24
          unit: "M lives"
        - label: "Illustrative 10% employer shift"
          value: 15
          unit: "M lives"
        - label: "Thatch reported employer base"
          value: 5000
          unit: "employers"
        - label: "Proposed CHOICE tax credit"
          value: 1200
          unit: "USD per employee per year"
    approximationNotes: >-
      Mixed-unit layers are deliberate: this is a conceptual market stack, not an arithmetic model.
      Numeric values are directional lenses drawn from the cited sources and should not be summed.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM013]
