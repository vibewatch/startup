chapter:
  number: 2
  title: Market Analysis
  summary: Thatch sits in the ICHRA wedge of employer-sponsored health benefits, not the full U.S. healthcare economy. The evidence points to a small-business-led adoption path, meaningful upside from carrier and payroll integration, and real constraints from ACA dependence, switching costs, and adverse selection.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Thatch's market is best defined as employer-directed health benefit spend that can be
      redirected into individual coverage and reimbursable health-related purchases through an
      ICHRA-style workflow. That is narrower than the whole U.S. healthcare system, but broader
      than a pure insurance admin tool because the product also routes leftover allowance dollars
      into approved services. The practical substitutes are traditional group plans, self-funded
      or level-funded arrangements, and direct consumer out-of-pocket purchase of care. Those
      remain outside the addressable market unless the employer funds them through an allowance.
      The boundary matters because it determines whether the company is selling insurance
      administration, benefits software, or a new spending rail for health dollars.
    claimRefs: [CM001, CM002, CM003, CM015]
    tableRefs: [TM001]
  - id: sizing-lens
    title: Sizing lenses and market geometry
    body: >-
      A single TAM estimate is too blunt for this market. The most useful lens starts with the
      employer-sponsored insurance pool and then overlays the adjacent ACA individual market,
      because ICHRA can only work by moving employer dollars into that risk pool. A second lens is
      the broader healthcare ceiling: if the market is treated as the whole $5.6 trillion U.S.
      spend pool, the number becomes directionally true but analytically useless. The third lens is
      adoption intensity: small-business choice demand, current employer traction, and the
      illustrative effect of a 10% employer-to-ICHRA shift. Together they show that the opportunity
      is large enough to matter, but still constrained by conversion speed and product friction.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption path, and constraints
    body: >-
      The most plausible buyer sequence starts with small businesses, moves through mid-market
      employers, and only later reaches large self-funded groups. That path matches the survey
      evidence: small-business owners want more choice, employees want flexibility, and employers
      say it is hard to find a benefits solution that fits diverse workforces. The adoption path
      depends on brokers, payroll providers, carriers, and other channel partners because they
      reduce setup friction and help normalize ICHRA for buyers. The main constraint is not just
      software; it is regulation, pricing, and risk-pool economics. If ACA-linked rates move or
      if carriers do not deepen the individual-market product set, the market can still grow but
      stay niche.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition table
    columns: [segment_or_category, included_spend, excluded_spend, buyer_payer, relevance]
    rows:
      - ["ICHRA employer allowance", "Tax-free employer dollars used to buy individual coverage", "Traditional group-plan premiums", "Employer / HR; employee chooses plan", "Core spend Thatch can redirect"]
      - ["Qualified reimbursable benefits", "Leftover allowance spent on eligible health services and products", "Unreimbursed consumer health spend", "Employer funds; employee spends", "Expands wallet share beyond premiums"]
      - ["Benefits workflow software", "Enrollment, reimbursement, compliance, and plan-selection rails", "Pure consulting without productization", "Employer benefits team; brokers influence", "Operating layer required for adoption"]
      - ["Status-quo group insurance", "None unless converted into an allowance", "Employer-sponsored group premiums", "Employer / benefits team", "Main substitute and switching benchmark"]
      - ["Direct consumer out-of-pocket care", "Only when reimbursed through employer allowance", "Standalone consumer healthcare purchases", "Individual consumer", "Adjacent spend, not core boundary"]
    notes: >-
      Boundary is defined as employer-directed spend that can move into ICHRA or Thatch-reimbursed
      benefits; status-quo and unfunded consumer spend are substitutes or adjacencies rather than
      core revenue.
    claimRefs: [CM001, CM003, CM011, CM015]
  - id: TM002
    title: TAM/SAM/SOM and sizing lenses
    columns: [publisher, year, geography, value, CAGR, methodology, confidence, limitation]
    rows:
      - ["Not Boring", 2025, "US", "$1.3T annual employer-sponsored insurance spend; 154M covered lives", "n/a", "Top-down synthesis citing KFF and related sources", "medium", "Broad pool, not ICHRA-eligible spend only"]
      - ["Not Boring", 2025, "US", "$5.6T projected healthcare spend in 2025", "n/a", "CMS projection cited in the essay", "medium", "Overall ceiling, not an addressable wedge"]
      - ["Not Boring", 2025, "US", "24M ACA marketplace enrollees", "n/a", "Enrollment-based adjacent market lens", "medium", "People, not spend; constrained risk pool"]
      - ["Justworks + Harris Poll", 2026, "US small business", "89% of owners want more choice; 86% of employees value flexibility; 80% say it is hard to find a good benefits solution", "n/a", "Survey signal for willingness to adopt", "medium", "Intent signal, not revenue"]
      - ["Thatch", 2026, "US", "5,000+ employers and almost 7x ARR growth", "n/a", "Company-reported traction", "medium", "Company-claimed and not independently audited here"]
      - ["Not Boring", 2025, "US", "Illustrative 10% employer shift implies ~15M additional individual-market lives", "n/a", "Scenario model built from the employer and individual pools", "low", "Directional only; not a forecast"]
    notes: >-
      Mixed-unit sizing lenses; the figures are directional and not additive. They are intended to
      show scale, conversion geometry, and adoption intensity rather than a single revenue-grade TAM.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM010]
  - id: TM003
    title: Segment / buyer map
    columns: [segment, buyer, user, payer, workflow, budget_owner, adoption_trigger]
    rows:
      - ["Small businesses", "Founder, owner, CFO, or HR generalist", "Employees", "Employer", "Set allowance, choose plans, reimburse", "Owner or CFO", "Premium inflation, poor fit, desire for choice"]
      - ["Mid-market growth companies", "CFO or benefits leader", "Employees", "Employer", "Shift from group or level-funded plan to defined contribution", "CFO and HR", "Rising costs, multi-location workforce, recruiting pressure"]
      - ["Large enterprises", "Benefits team", "Employees", "Employer", "Selective carve-outs or supplemental benefit design", "Benefits and finance", "Need for customization or retention leverage"]
      - ["Brokers and consultants", "Broker / advisor", "Employer buyer", "Employer", "Recommend, implement, and service the plan design", "Broker plus employer", "Need a complete menu of options and commissions continuity"]
      - ["Payroll and platform partners", "Integration team", "Employer admin", "Employer", "Embedded onboarding, payroll, and compliance flows", "Platform team", "Demand for bundled workflow and lower admin burden"]
    notes: >-
      The map is an adoption model inferred from the cited market and partnership evidence, not a
      census of the market. Budget owners and adoption triggers are directional planning inputs.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014]
figures:
