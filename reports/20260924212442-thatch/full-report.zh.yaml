        title: 运营模式、技术架构与外部依赖
        blocks:
          - type: paragraph
            body: >
              公开材料中最明显的技术信号，是 Thatch
              的产品围绕资金流、数据模型、自动化和账本式运营管控构建。公司正在招聘负责对接保险公司、金融伙伴、薪酬服务商和银行系统的人才；可见核心技术难题是让多个外部系统可靠协同，而不是搭建一个单体软件栈。这也解释了产品叙述为何反复提到可观测性（observability）、工程规范和运营严谨度。


              换句话说，Thatch 位于员工福利体验与其背后的合规金融通道之间。它既是产品，也是基础设施：一端供员工选择计划，另一端连接合作方结算与合规流程，中间由编排引擎调度。
