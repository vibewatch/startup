      - number: '2.3'
        title: 买方画像、采纳路径与制约因素
        blocks:
          - type: paragraph
            body: >-
              最符合逻辑的买方拓展顺序始于小企业，逐步延伸至中端市场雇主，最后才触达大型自保群体。这一路径契合问卷调研的证据：小企业主希望拥有更多选择，员工看重灵活性，而雇主普遍反映难以找到契合多元化员工结构的福利方案。采纳路径高度依赖经纪人、薪酬服务商、承保机构及其他渠道伙伴，这些角色能降低初始配置摩擦，并推动买方把
              ICHRA 视为常规方案。              主要制约不只是软件本身，更在于监管、定价与风险池的经济账。一旦 ACA
              挂钩费率出现波动，或承保机构未能扩充个人市场的产品供给，该市场虽能继续增长，却可能长期局限于利基状态。
