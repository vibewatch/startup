    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与产品
        blocks:
          - type: paragraph
            body: >-
              Thatch 将自己定位为一站式福利平台，帮助雇主借助 ICHRA 和员工健康预算提供个性化医疗福利。官网和法律文件称其是一家金融科技公司，并非受 FDIC
              保险保障的存款机构；银行服务和保险业务分别由合作伙伴与一家独立的保险服务 LLC 承担。因此，产品不只是选保软件，还要打通报销、合规、银行通道和保险分销。已审阅资料显示，公司位于旧金山，业务始于 2021
              年，但未披露公开股权结构表，也没有独立审计的财务数据。
