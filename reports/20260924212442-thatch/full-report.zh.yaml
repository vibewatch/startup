  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Thatch 面向的市场，是雇主可通过 ICHRA
              将健康福利预算用于个人保险和符合报销条件的医疗消费。这个范围小于整个美国医疗体系，却比纯保险管理工具更广，因为结余津贴还能用于合规的健康服务。现实替代方案包括传统团体险、自保（self-funded）或阶段自保（level-funded）方案，以及消费者个人自费医疗；除非雇主通过津贴出资，否则这些支出不属于目标市场。划清边界很重要：这决定了
              Thatch 卖的是保险管理软件、福利软件，还是一条新的医疗支出通道。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM015
      - number: '2.2'
        title: 测算视角与市场结构
        blocks:
          - type: paragraph
            body: >-
              单一的 TAM 测算对该市场过于粗糙。最有效的测算视角是从雇主赞助的团体险资金池切入，并叠加相邻的 ACA 个人保险市场，因为 ICHRA
              的核心机制正是将雇主资金注入该风险池。第二个视角是更广阔的医疗支出天花板：若将市场等同于全美 $5.6T
              的医疗资金池，这一数字在方向上成立，但在分析上毫无意义。第三个视角是渗透强度：小企业的自主选择需求、当前雇主增长势头，以及雇主向 ICHRA 转移 10%
              带来的测算效应。三者综合表明，该市场空间足够大且值得关注，但仍受制于转化速度与产品落地摩擦。
