      - number: '4.3'
        title: 投资研判与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              基于现有公开证据，Thatch 展现出了可信的市场需求、迅猛的营收扩张，以及足以支撑持续增长的资本储备。投资研判的痛点在于，公开记录仍未回答关乎利润率走势与现金消耗的关键问题：没有披露收费标准（rate
              card），没有公布毛利率，未提供 CAC 回本周期，亦无现金跑道指引。年中行业简报解释了该赛道的吸引力所在，但同样强调了 ICHRA
              的普及容易受到政策变化和定价波动影响。投资逻辑整体偏正面，但现有信息仍不足以建立可靠的财务模型。
