              $192.25M。这些融资为公司继续扩张提供了支持，但账面现金、烧钱速度、现金跑道和债务情况均未公开，资产负债表是否稳健仍不清楚。法律披露文件也解释了 Thatch 为何采用轻资产结构：它并非受 FDIC
