      - number: '7.2'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >
              Thatch 的公开法律文件是透视下行风险最清晰的窗口。其存款账户协议明确规定，Thatch Health, Inc. 并非受 FDIC 保障的银行，银行服务由 Thread Bank 提供，且 Thatch
              的账户计划嵌套在合作银行与保险服务架构之内。产品风险也随之带上监管属性：如果合作银行、相关披露或账户机制受到质疑，客户可能面临资金流冻结或产品被迫重新设计。


              该协议还规定了强制仲裁、集体诉讼豁免、田纳西州法院管辖权以及两年的索赔窗口（claim window）。这些条款能缩小部分诉讼风险敞口，却无法消除消费者保护和投诉风险。与此同时，Render
              的客户案例表明，Thatch 团队将 HIPAA 和 SOC 2 视为底线运营要求而非可有可无的合规标签。这一做法值得肯定，但也佐证了公司涉及高度敏感的医疗数据，亟须建立标准化的内控流程、文档记录与应急响应机制。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
      - number: '7.3'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >
              运营风险集中在保障产品日常稳定运行的基础架构上。根据 Render 的客户案例，Thatch 借助专有网络、数据加密及审计控制，在保障研发团队敏捷迭代的同时满足了 HIPAA 和 SOC 2
              合规要求。这固然是积极信号，但也意味着公司将核心系统的可用性与合规基石深度押注在第三方托管与部署层之上。


              案例还称，公司只有 10 名工程师，其中 2 人负责平台和安全相关工作；代码从提交到上线只需 6 至 8
              分钟。纪律到位时，这种速度是优势；若增长快过控制能力，风险就会上升。产品又横跨计划选择、账户注资、合规费用判定和 AI 辅助，哪怕小 bug
              或模型出错，都可能直接影响客户。关键不在于公司是否有野心，而在于质量、安全和可用性是否跟得上产品扩张。
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR011
      - number: '7.4'
        title: 合作伙伴与财务模型风险
        blocks:
          - type: paragraph
            body: >
              Thatch 的增长模型建立在多方合作的分发生态与资金存管链路之上。公司称已与 Gusto、Justworks、Paychex 及 ADP RUN 建立合作，法律文件亦显示底层用户体验由 Thread Bank
              等外部机构承托。这种架构虽能撬动更广阔的市场，但也埋下了依赖隐患：合作伙伴的政策变动、产品调整或合规问题，都可能瞬间波及获客流程、资金结算乃至客户信任。


              财务模型也容易受经营结果影响。Thatch 称 ARR 增长近 7 倍、服务超过 5,000 家雇主，但公开资料没有披露客户集中度、赔付表现或增长背后的单位经济性。C 轮后估值升至
              $1B，门槛也随之提高：雇主采纳、渠道分发或合规执行一旦放慢，估值倍数可能迅速压缩。风险不在于市场缺乏吸引力，而在于当前估值隐含公司未来很长一段时间都能顺利执行。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR012
              - CR013
