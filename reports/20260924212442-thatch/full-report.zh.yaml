      - number: '5.3'
        title: 合规信任与待解技术问题
        blocks:
          - type: paragraph
            body: >
              Thatch 的法律文本反映出大量的内嵌合规工作：FDIC 资金归集披露、HSA 资质条款、在线银行风控规则、ACH 与 P2P
              转账规则、隐私条款以及反欺诈和安全限制都写在公开文件中。由此可见，公司确实在处理真实资金，并运行受监管约束的健康福利业务，而不是轻量 SaaS 外壳；产品可靠性也因此离不开监管合规和合作伙伴。


              尽调的重点已不是概念是否存在——公开材料足以说明产品在运行。真正未知的是内部控制有多少形成正式文档，团队愿意披露多少可用性（uptime）和事故记录，以及技术架构是否经得起规模扩张。这些才决定产品是能用，还是能长期稳定运营。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户结构与买方画像
        blocks:
          - type: paragraph
            body: >-
              公开证据显示的买方群体以雇主及其 HR 或福利负责人为核心，同时覆盖员工、经纪人及薪酬管理员。Thatch 将自身定位为雇主出资的 ICHRA
              平台，因此付款方通常是企业，使用者则是选品并消费健康预算的员工。这对希望锁定支出上限并减少行政负担的小微雇主，以及既想要多元选择又无力自建福利团队的中端企业最具吸引力。相关公开资料还表明，渠道合作伙伴举足轻重：薪酬平台与经纪人已直接切入采购流程，而非单纯的辅助通道。
            claimRefs:
              - CU003
              - CU004
              - CU010
              - CU013
