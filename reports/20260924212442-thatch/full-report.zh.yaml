  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Thatch 的市场最好界定为：能借助 ICHRA
              机制分流至个人医保与可报销健康消费的雇主端医疗福利支出。这一范畴小于整个美国医疗健康体系，但大于单纯的保险管理工具，因为该产品还会将结余津贴资金导入合规服务。现实中的替代品包括传统团体险、自保或阶梯式自保（level-funded）方案，以及消费者个人自付医疗。除非雇主通过津贴提供资金，否则这些都不属于可触达市场。界定这一边界至关重要，它决定了公司卖的究竟是保险管理、福利软件，还是一条全新的健康资金支付通道。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM015
      - number: '2.2'
        title: 测算视角与市场空间格局
        blocks:
          - type: paragraph
            body: >-
              单一的 TAM 估算对该市场而言过于粗糙。最有效的视角应始于雇主资助型保险资金池，再叠加相邻的 ACA 个人医保市场，因为 ICHRA
              唯有将雇主资金导入该风险池才能运转。第二重视角是更广义的医疗总支出天花板：若将全美 $5.6T
              医疗支出均算作市场空间，数字在方向上成立，但在分析上毫无价值。第三重视角是渗透烈度：小企业的自主选保需求、当前的雇主拓展势头，以及 10% 雇主向 ICHRA
              转移的推演效应。综合来看，这一市场机遇规模足够可观，但仍受制于转化速度与产品摩擦力。
