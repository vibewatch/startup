  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 梳理自创立至 2026 年 9 月 Series C 轮融资及运营规模扩张的关键里程碑。
    data:
      items:
        - label: 创立
          date: '2021'
          detail: Adam Stevenson 与 Chris Ellis 在旧金山创立 Thatch。
        - label: 早期外部注资
          date: 2022-01
          detail: Not Boring Capital 表示其于 2022 年初投资了 Thatch。
        - label: Series A
          date: 2024-09
          detail: Thatch 宣布完成由 Index Ventures 与 General Catalyst 领投的 $38M Series A 融资。
        - label: Series B 拐点
          date: 2025-04
          detail: 公司将此前完成的 Series B 融资视为 2026 年业务扩张前的增长拐点。
        - label: Venteur 客户迁移
          date: '2026-04-01'
          detail: Thatch 宣布推动 Venteur 旗下的雇主、雇员及经纪人整体迁移至自身平台。
        - label: 规模里程碑
          date: '2026-09-15'
          detail: Thatch 表示平台现已服务超过 5,000 家雇主，ARR 激增近 7 倍。
        - label: 产品矩阵拓展
          date: '2026-09-15'
          detail: Thatch 推出 Thatch Market，并深化与 Gusto、Justworks、Paychex 及 ADP RUN 的系统集成。
        - label: Series C 轮融资与估值
          date: '2026-09-15'
          detail: Thatch 宣布以 $1B 估值完成 $108M Series C 融资。
    approximationNotes: 日期按原始表述归一化；2022 年初和 2025 年 4 月的里程碑只精确到月份，不是确切交割日。
