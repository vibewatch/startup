  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 整体风险态势
        blocks:
          - type: paragraph
            body: >
              Thatch 并非只受单一监管规则约束的纯软件公司。公司将自己定位为基于 ICHRA
              的健康福利平台，但实际运营横跨雇主福利、银行托管机制和与保险相关的流程。这种架构扩大了潜在故障面：任何一环出错，都可能引发客户服务问题、合规处罚或分发受阻。


              公开证据显示增长势头不错，也说明投资逻辑在很大程度上仍依赖外部伙伴。Thatch 称 ARR 增长近 7 倍，为超过 5,000
              家雇主提供福利支持，且依赖薪酬与福利系统的整合以维系扩张。这些信号相当强劲，但同样敲响了警钟：增长势头完全系于能否严密把控合作伙伴底座，以及雇主能否持续买单。


              下文矩阵按潜在严重程度对核心风险进行排序，而非给出泛泛的企业质量评分。核心考量不在于产品是否诱人，而在于合规管控、伙伴集中度与服务稳定性能否跟上业务扩张的步伐。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
