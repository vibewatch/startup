      - number: '8.3'
        title: 入场纪律、潜在风险与尽调清单
        blocks:
          - type: paragraph
            body: >-
              入场考量的核心不在于 Thatch 是否引人注目，而在于市场是否已提前为这个故事最理想的版本买单。公司确有战略资产：薪酬平台与承保机构关系、直面 C
              端的健康预算工作流，以及对庞大且繁杂的雇主福利市场的洞察。但同样的架构也催生了依赖隐忧。法律披露明确指出 Thatch
              并非银行，银行服务由合作机构提供，保险业务则通过独立的持牌实体流转。这些在同类赛道中虽属常见架构，却也意味着其估值高度维系于合作伙伴的稳定性与监管落地的合规性，绝非仅靠产品体验支撑。


              尽调的核心要求很明确：披露更详实的 ARR 变动拆解、利润率轨迹和雇主落地后的留存证据；说明合作伙伴集中度如何变化；并厘清当前 $1B
              估值究竟反映了业务进展，还是主要来自投资者对该赛道的热情。在这些问题得到解答前，审慎做法是持续跟踪，并相较当前标价留出安全边际，而不是把估值本身当作投资机会。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV012
