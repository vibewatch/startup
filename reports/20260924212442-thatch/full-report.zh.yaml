      - number: '3.2'
        title: Thatch 的潜在差异化优势
        blocks:
          - type: paragraph
            body: >-
              Thatch 最明显的差异化并非某款独特保险产品，而是围绕 ICHRA 打包提供的一整套服务。留存的来源显示，Thatch 借助 ADP RUN、Gusto、Justworks 与 Paychex
              分发薪酬和福利，并搭起一套以合规为核心的运营体系，涵盖支付卡、合作银行、保险服务实体及第三方服务商。这套组合之所以关键，在于 ICHRA
              手工落地极其繁琐，且雇主渴望通过现有薪酬渠道直接开通，而非再采购一套单点工具。基于现有公开证据，Thatch 更像是一家面向固定缴款医疗福利的基础设施公司，而非单纯的信息撮合平台。
            claimRefs:
