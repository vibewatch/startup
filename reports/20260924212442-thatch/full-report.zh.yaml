      - number: '5.3'
        title: 信任机制、合规把控与待解技术疑问
        blocks:
          - type: paragraph
            body: >
              Thatch 的公开法律文件显露了大量内置合规细节：FDIC 资金归集（sweep）披露、HSA 资格条款、网络银行风控、ACH 与 P2P 转账规则、隐私政策以及反欺诈 /
              安全限制均直接见诸公开文档。这有力地表明，公司运作依托真实的资金通道与强监管医疗福利逻辑，绝非一层轻薄的 SaaS 外壳。这也意味着，产品可靠性与其监管及合作伙伴依赖风险完全绑定。


              尽调面临的核心缺口不在于概念是否成立，公开证据已足以佐证这一点；核心缺口在于其内控体系有多少沉淀为正式规范、团队愿意披露多少可用率与故障历史，以及技术架构在应对规模化时做了多深度的加固。正是这些维度决定了该产品仅仅是能跑通业务，还是具备长期的运营韧性。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户结构与买方画像
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，其买方群体始于雇主及其 HR 或福利负责人，同时触达员工、经纪人与薪酬管理员。Thatch 将自身定位为雇主出资型 ICHRA
              平台，因此付款方通常是企业，使用者则是选保并消费健康预算的员工。渴望锁定成本并精简福利管理的小企业，以及既想要选保灵活度又不想自建福利团队的中端企业，最容易被打动。同样，公开材料表明渠道伙伴地位举足轻重：薪酬平台与经纪人已直接切入采购决策主流程，而非边缘渠道。
            claimRefs:
              - CU003
              - CU004
              - CU010
              - CU013
