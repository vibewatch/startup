  - id: FE001
    title: 产品架构分层图
    type: stack
    summary: 对产品架构的分层梳理，涵盖雇主配置、成员体验、核心调度、合作方通路与合规底座。
    data:
      layers:
        - label: 雇主配置
          detail: HR 团队设定预算、参保资格与参保规则。
          modules:
