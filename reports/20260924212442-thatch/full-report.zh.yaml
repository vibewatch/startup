        - 若增速持续超常，当前估值能够得以维持，甚至有望重估至 $1B 以上。
        - ARR 再迎一年超常增长，同时提供更充分的运营数据披露。
      - - 基准
        - 增长趋于常态化但仍高于行业均值；分销体系保持稳固。
        - 若公司持续扩张但未超预期交付，当前估值大体处于合理区间。
        - 雇主数量持续增加，但利润率未见显著的突破性佐证。
      - - 悲观
        - 增速放缓、渠道经济模型恶化，或数据披露持续单薄。
        - 市场不再单纯为故事买单，估值因此承压并收缩。
        - 雇主增长明显放缓，或遭遇合作渠道与监管卡点。
      - - 退出成熟度视角
