  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 核心假设
      - 隐含估值逻辑
      - 核心触发条件
    rows:
      - - 乐观情景
        - ARR 持续复利增长，渠道合作方不断拓展，公开指标最终印证健康的利润率水平。
        - 若增速持续超预期，当前估值有望维持，甚至向上重估至 $1B 以上。
        - ARR 再录得一年超额增长，且经营数据披露更加充分。
      - - 基准情景
        - 增速回归常态但仍高于赛道均值；分销体系保持稳固。
        - 若公司持续扩充规模但未有超常表现，当前估值大致合理。
        - 雇主数量持续增加，但利润率成色未见大幅改观。
      - - 悲观情景
        - 增长放缓、合作方分成恶化，或数据披露依然单薄。
        - 市场不再只为叙事付费，估值倍数可能收缩。
        - 雇主扩张明显失速，或遭遇合作方及监管阻碍。
      - - 退出成熟度视角
        - 业务值得持续跟进，但证据链尚未完全闭环。
        - 适合列入重点观察名单，而非立即买入。
        - 更扎实的 ARR 拆解与利润率序列数据，方能支撑不同判断。
    notes: 各情景区间属方向性推演，基于公开融资定价与市场接纳信号推导，并非完整估值模型。
