    title: 产品架构图
    type: stack
    summary: 分层展示产品技术栈：涵盖雇主端配置、员工端体验、核心编排、伙伴网络及合规风控。
    data:
      layers:
        - label: 雇主端配置
          detail: HR 团队设定福利预算、资格条件和参保规则。
          modules:
