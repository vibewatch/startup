figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 涵盖自创立起，历经 2026 年 9 月 C 轮融资及运营规模扩张的各个关键里程碑。
    data:
      items:
        - label: 创立
          date: '2021'
          detail: Adam Stevenson 与 Chris Ellis 在旧金山创立 Thatch。
        - label: 早期外部注资
          date: 2022-01
          detail: Not Boring Capital 称其于 2022 年初投资了 Thatch。
        - label: A 轮融资
          date: 2024-09
          detail: Thatch 宣布完成由 Index Ventures 与 General Catalyst 领投的 $38M A 轮融资。
        - label: B 轮转折点
          date: 2025-04
          detail: 公司提及此前的 B 轮融资是 2026 年扩张前的增长拐点。
        - label: Venteur 迁移
          date: '2026-04-01'
          detail: Thatch 宣布安排 Venteur 的雇主、员工及经纪人转入自身平台。
        - label: 规模里程碑
          date: '2026-09-15'
          detail: Thatch 称其目前已服务超过 5,000 家雇主，ARR 激增近 7x。
        - label: 产品扩充
          date: '2026-09-15'
          detail: Thatch 推出 Thatch Market，并深化与 Gusto、Justworks、Paychex 及 ADP RUN 的集成。
        - label: C 轮融资与估值
