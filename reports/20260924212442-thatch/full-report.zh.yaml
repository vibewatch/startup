      - number: '6.2'
        title: 采纳信号与渠道势头
        blocks:
          - type: paragraph
            body: >-
              最明确的业务采纳信号来自扩张规模，而非留存率披露。Thatch 称目前已为超过 5,000 家雇主提供福利支持，过去 12 个月 ARR 增长近 7 倍。上线之初的爆发势头便已显现，公司在数月内签约超过 100
              家付费企业。渠道逻辑同样关键：Thatch 称能依托 Gusto、Justworks 与 Paychex 触达数百万家小企业，而 ADP RUN
              则进一步强化了这一分发策略。综合来看，该公司不像单点直销软件，更像是一条借助嵌入式分发实现规模扩张的雇主福利底座通道。
            claimRefs:
              - CU001
