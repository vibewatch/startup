  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 整体风险态势
        blocks:
          - type: paragraph
            body: >
              Thatch 不是单一业务线的软件公司。公司对外定位为基于 ICHRA 的健康福利平台，实际运营却横跨雇主福利、银行存管和保险相关流程。任一环节出问题，都可能变成客户服务问题、合规问题或分发放缓，风险面因此更广。


              增长数据令人振奋，但公开材料也暴露出其底层逻辑对合作伙伴的高度依赖。Thatch 称 ARR 增长近 7x，服务超过 5,000
              家雇主，并依托薪酬与福利对接持续扩张。这些是强劲的业务信号，但也意味着发展势头取决于合作伙伴体系的稳定执行及雇主端的持续渗透。


              下表按潜在严重程度对核心风险进行排序，而非套用通用的公司评级。核心考量不在于产品本身是否具备吸引力，而在于合规风控、渠道集中度与服务可用性能否跟上高速增长的步伐。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR012
              - CR013
