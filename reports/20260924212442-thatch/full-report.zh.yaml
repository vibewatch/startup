      - number: '6.2'
        title: 采用信号与渠道势能
        blocks:
          - type: paragraph
            body: >-
              最清晰的采用信号是业务规模，而不是留存数据。Thatch 称目前为超过 5,000 家雇主提供福利，过去 12 个月 ARR 增长近 7x。产品上线后不久就显出势头：几个月内接入了 100
              多家付费企业。渠道同样重要：Thatch 称可通过 Gusto、Justworks 和 Paychex 触达数百万家小微企业，而与 ADP RUN
              的合作进一步夯实了这一分发策略。综合来看，公司不像单点直销软件，而更像是一条依托内嵌分发实现规模化的雇主福利底层网络。
