      - number: '6.3'
        title: 业务持久度、集中度与扩张飞轮
        blocks:
          - type: paragraph
            body: >-
              公开材料谈增长多于留存，因此客户扩张目前可能仍靠客户推荐、口碑和更丰富的产品线推动。              Thatch
              正从零设立客户倡导经理岗位，说明公司预计客户案例和同行背书会影响销售。公司也依赖保险公司和薪酬伙伴；公开评论则指出，经纪人教育和落地摩擦仍是现实约束。同时，已有具名的大型客户，说明其客户并不局限于最小型
              SMB。客户增长能否持续，取决于渠道伙伴、客户支持和口碑能否共同积累。
