      - number: '5.2'
        title: 运营模型、技术架构与外部依赖
        blocks:
          - type: paragraph
            body: >
              公开资料中最明显的技术信号，是 Thatch
              的产品围绕资金流、数据模型、自动化和类似账本的运营管控搭建。公司招聘负责对接承保机构、金融伙伴、薪酬服务商及银行的系统工程师，说明核心技术难题是让多个外部系统稳定协同，而非开发单体软件。这也解释了产品介绍为何反复强调可观测性、工程规范和运营纪律。


              换言之，Thatch 介于员工福利体验与支撑该体验运转的受监管金融通道之间。因此，这套技术栈既是产品也是基础设施：一端承接员工自主选保，另一端对接伙伴清结算与合规审查，核心枢纽则是中枢编排层。
            claimRefs:
