  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品功能界面与客户工作流
        blocks:
          - type: paragraph
            body: >
              Thatch 提供的是由消费者自主选择的医疗福利流程，而非传统团体险模式。公开产品以雇主健康预算为核心：员工自行选保，也可将预算用于精选市集里的合规医疗消费。官网首页、C
              轮公告和招聘信息共同表明，产品已进入市场，通过薪酬和福利伙伴分发，并向相邻健康服务扩展。


              本章将该产品拆解为雇主管理、员工选保与市场准入三个层次。这一视角十分关键，因为真正的壁垒不仅在于 C 端体验，更在于背后的系统性编排能力——唯有如此，才能将
              ICHRA、报销清算、合作方通道与资格审核规则整合为一套稳定可靠的福利操作系统。
