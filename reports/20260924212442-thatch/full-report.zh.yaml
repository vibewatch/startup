  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品、既有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              Thatch 自身披露材料和相关媒体报道指出了一组规模不大的直接竞品：TechCrunch 在报道其最新一轮融资时，点名了 Take Command、Remodel Health 和 Zorro 这几家
              ICHRA 初创公司。它们只是实际替代方案的一部分。更强势的传统替代方案仍是雇主资助型团体险，承保机构与经纪人掌握着选保、续保和定价权。按照公司博客及第三方报道的描述，Thatch
              的定位是将医疗福利转化为固定缴款（defined contribution）和个人选保体验，吸引雇主摆脱现有做法。由此，竞争不再局限于单一功能，而是延伸到软件、合规运营、渠道分发和信任基础设施。
