        title: 资本结构与运营依赖
        blocks:
          - type: paragraph
            body: >-
              最新的公开融资数据为估值 10 亿美元（$1B）的 1.08 亿美元（$108M）C 轮融资，Forge 估算其累计融资金额约为 1.9225
              亿美元（$192.25M）。这笔融资和累计资金表明公司可能有资源继续扩张，但账面现金、烧钱速度（burn）、现金跑道（runway）及债务均未公开，资产负债表是否充足仍不清楚。法律披露文件还揭示了 Thatch
              在结构上保持轻资产的原因：它并非受 FDIC 保障的银行，其银行业务与保险服务均依托外部通道及持牌关联机构完成。这固然降低了资产负债表的直接风险，但也意味着其变现引擎高度依赖第三方伙伴与精细的运营协同。
