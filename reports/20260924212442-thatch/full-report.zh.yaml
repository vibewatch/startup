      - number: '3.3'
        title: 护城河持久度与被替代风险
        blocks:
          - type: paragraph
            body: >-
              该赛道仍处早期，多数直接竞品的经济模型不公开，因此更值得看行业结构，而非具体 SKU。Thatch 有望在方案选择、保险公司选择和薪酬渠道分发上形成规模效应；但薪酬厂商、经纪人、保险公司或未来的 ICHRA
              专业玩家也可能把相关服务打包，挤压其空间。Not Boring 的投资逻辑认为，ICHRA
              普及度提高将改善底层市场环境；然而一旦底层通道实现标准化，这种普及也会促使基础工作流迅速同质化。换言之，护城河逻辑确实存在，但它更依赖 Thatch
              在渠道分发和合规执行力上的持续领跑，而非源于产品本身具备永久的独特性。
