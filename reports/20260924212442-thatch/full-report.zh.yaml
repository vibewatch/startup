      - number: '3.2'
        title: Thatch 的显性差异化优势
        blocks:
          - type: paragraph
            body: >-
              Thatch 最明显的差异化不在于拥有独有的保险产品，而在于围绕 ICHRA 整合了一套服务。现有材料显示，它通过 ADP RUN、Gusto、Justworks 和 Paychex
              触达薪酬与福利渠道；产品还整合了卡片、合作银行、保险服务实体和第三方服务商，运营环节也离不开合规管理。ICHRA
              靠人工落地并不容易，雇主也更愿意从现有薪酬渠道启用方案，而不是再买一个孤立工具。就现有证据看，Thatch 更像固定缴费型健康福利的基础设施，而非单纯的选品市场。
