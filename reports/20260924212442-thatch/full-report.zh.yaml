  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品、既有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              Thatch 的披露和媒体报道显示，直接竞品范围不大：TechCrunch 在最新一轮融资报道中点名 Take Command、Remodel Health 和 Zorro 这几家 ICHRA
              初创公司。但它们只占替代方案的一部分。更有力的既有替代品仍是传统雇主团体险，保险公司和经纪人掌握着方案选择、续保和定价。Thatch 在博客和第三方报道中的定位，是把医疗福利改造成固定缴费（defined
              contribution）模式，让员工自行选计划。由此，竞争不只是比单项功能，还涉及软件、合规运营、渠道分发和信任基础设施。
            claimRefs:
