  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与产品
        blocks:
          - type: paragraph
            body: >-
              Thatch 对外将自己定位为一站式平台，帮助雇主借助 ICHRA 和员工健康预算提供个性化医疗福利。公司官网和法律文件将其界定为金融科技公司，而非受 FDIC
              保障的存款机构；银行服务和保险职能由合作伙伴及一家独立的保险服务有限责任公司（LLC）承接。因此，Thatch
              不只是供员工选择计划的软件，也要统筹报销、合规、银行通道和保险分销。已审阅材料显示，公司位于旧金山、成立于 2021 年，但没有公开股权结构表（cap table）或独立审计的财务数据。
