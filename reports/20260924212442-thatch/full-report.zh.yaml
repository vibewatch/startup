      - number: '8.3'
        title: 入场纪律、潜在风险与尽调清单
        blocks:
          - type: paragraph
            body: >-
              入场考量的核心不在于 Thatch 是否有吸引力，而在于市场是否已经为这个容易讲述的故事付了溢价。公司拥有重要的战略资产：薪酬及保险公司合作关系、面向 C
              端的健康预算工作流，以及对庞大而杂乱的雇主福利市场的洞察。但同一架构也埋下了依赖隐患。法律披露明确指出，Thatch
              本身并非银行，银行服务由合作机构承办，保险业务则由独立的持牌主体开展。这在该赛道固然属于标准架构，但也意味着估值不仅取决于前端产品体验，更取决于外部伙伴合作的持续性与监管执行力。


              尽调时，核心诉求十分直接：提供更细化的 ARR 构成桥接、利润率演变路径，以及雇主群组在方案落地后的留存证据；展示合作伙伴集中度的变化趋势；阐明当前 $1B
              的估值究竟反映了实质性的运营突破，还是主要源于投资人对该赛道的情绪追捧。在上述疑问得到正面解答前，审慎的决策是密切跟踪该标的并要求在估值上留出安全边际，而非将这一估值数字本身视为投资机会。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV012
