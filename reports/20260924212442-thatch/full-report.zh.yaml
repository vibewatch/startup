            - 明确的福利额度
          tone: neutral
        - label: 员工自主选品
          detail: 员工自由挑选医疗保险方案与合规医疗消费项目。
          modules:
            - 保单选购
            - 消费选品
          outputs:
            - 个性化保障方案
          tone: positive
        - label: 核心编排引擎
          detail: 数据模型、资金流转、自动化规则与账本运作。
          modules:
