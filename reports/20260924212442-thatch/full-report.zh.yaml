      - number: '2.3'
        title: 买方画像、渗透路径与制约因素
        blocks:
          - type: paragraph
            body: >-
              更可能的买方路径是先从小企业切入，再扩展到中端市场雇主，之后才触及大型自保企业。这与调研信号相符：小企业主想要更多选择，员工看重灵活性，雇主则难以找到适合不同员工群体的福利方案。经纪人、薪酬服务商、保险公司及其他渠道伙伴能降低配置摩擦，帮助买方接受
              ICHRA。制约市场的不只是软件，还有监管、定价和风险池经济性。若 ACA 相关费率波动，或保险公司没有扩充个人市场的产品供给，市场仍可能增长，但会继续停留在小众范围。
