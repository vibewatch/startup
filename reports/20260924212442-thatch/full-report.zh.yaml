            - 参保资格
            - 参保流程
          outputs:
            - 既定补贴额度
          tone: neutral
        - label: 成员自主选品
          detail: 雇员挑选医保方案与合规医疗健康支出。
          modules:
            - 选购方案
            - 支出筛选
          outputs:
            - 个性化保障方案
          tone: positive
        - label: 核心调度引擎
          detail: 数据模型、资金流转、自动化机制与账本逻辑。
          modules:
