      - number: '3.3'
        title: 护城河韧性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              该赛道整体仍处早期，多数直接竞品的经济数据尚未公开，因此最有说服力的竞争研判应着眼于结构机制，而非具体功能细节。Thatch
              理论上可在选保覆盖、承保机构选择和薪酬分发上形成规模效应；但同一套机制也让该品类容易被薪酬厂商、经纪人、承保机构或未来的 ICHRA 专业公司捆绑替代。Not Boring 的核心观点是，ICHRA
              普及会扩大底层市场；但当通道标准化后，基础工作流也可能迅速商品化。护城河因此有其道理，但它更依赖 Thatch 持续领先于渠道分发和合规落地，而非拥有某种不可替代的产品。
