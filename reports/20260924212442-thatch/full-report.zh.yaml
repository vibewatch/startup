      - number: '7.2'
        title: 法律与监管风险敞口
        blocks:
          - type: paragraph
            body: >
              Thatch 公开的法律文件最直观地暴露了潜在下行风险。其存款账户协议载明，Thatch Health, Inc. 并非受 FDIC 保障的银行，银行服务由 Thread Bank 提供，Thatch
              的账户体系建立在合作银行与保险服务的架构之内。因此，产品风险本质上也是监管风险：一旦合作银行、信息披露或账户运转机制受到质疑，客户资金流可能面临冻结，或被迫推倒重构产品流程。


              该协议还明确写入强制仲裁、放弃集体诉讼、指定田纳西州管辖地以及两年的权利主张与索赔时效窗口。这些条款虽压降了部分诉讼风险敞口，却并未消除消费者权益保护或监管投诉风险。与此同时，Render
              的客户案例表明，Thatch 团队将 HIPAA 与 SOC 2
              视为日常运营规范，而非可有可无的资质背书。这种态度值得肯定，但也印证了公司处理着高度敏感的医疗健康数据，亟需建立可复现的风控机制、留痕文档与应急响应流程。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
      - number: '7.3'
        title: 运营与安全风险敞口
        blocks:
          - type: paragraph
            body: >
              运营风险集中于保障产品日常运转的底层管线之中。Render 的客户案例提到，Thatch 在工程团队快速迭代的同时，借助专用内网、数据加密与审计追踪来维持 HIPAA 及 SOC 2
              合规。这固然是积极信号，但同时也意味着公司在核心稳定性与合规基础设施上，高度依赖第三方托管与部署平台。


              该案例同时披露，公司当时仅有 10 名工程师，其中只有 2 名专注于平台与安全方向，生产环境从代码提交到上线仅需 6 至 8
              分钟。这种敏捷度若有严格纪律约束则是优势；一旦业务扩张跑赢内控建设，就会演变成风险。产品功能横跨选保、账户充值、合规支出校验与 AI
              辅助，这也放大了细微代码缺陷或模型偏差演变为直接客诉问题的概率。简言之，核心运营风险不在于雄心不足，而在于质量管控、安全水位与系统高可用能否跑在产品功能盲目铺开的前面。
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR010
              - CR011
      - number: '7.4'
        title: 合作伙伴与财务模型风险
        blocks:
          - type: paragraph
            body: >
              Thatch 的增长模型依赖多方合作的分发与资金托管架构。公司称与 Gusto、Justworks、Paychex 及 ADP RUN 建立了合作关系，法律文件亦显示 Thread Bank
              等服务商在底层支撑其客户体验。该架构固然拓宽了业务触达，却也埋下了依赖隐患：合作伙伴的政策变动、产品调整或合规问题，都可能瞬间波及获客效率、资金流转或客户信任。


              其财务模型也对经营结果高度敏感。Thatch 称 ARR 增长近 7 倍，服务逾 5,000 家雇主；但公开资料未披露客户集中度、历史理赔情况或增长背后的单体经济模型。C 轮后估值重新定在
              $1B，进一步抬高了市场对公司的要求：一旦雇主采纳、渠道拓展或合规执行放缓，估值倍数可能迅速压缩。核心风险并非市场缺乏吸引力，而是当前估值隐含了公司未来多年都能顺利执行的预期。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
