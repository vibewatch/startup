      - number: '6.3'
        title: 客户黏性、集中度与扩张飞轮
        blocks:
          - type: paragraph
            body: >-
              公开资料对增长的论述远多于留存韧性，由此可推断其客户扩张仍在依赖标杆背书、客户推荐以及更广的产品覆盖面来逐步建立。              Thatch 从零开始招聘客户口碑经理（Customer
              Advocacy
              Manager），表明公司预期客户推荐和同行案例会成为销售的关键助力。公司同时依赖承保机构与薪酬伙伴，公开评论指出经纪人教育和落地交付摩擦确实构成制约。与此同时，已披露的知名大客户表明，公司并未局限于极小规模的
              SMB 客群中。因此，其客户飞轮能否持久，取决于渠道伙伴、售后支持与客户口碑能否持续形成合力。
