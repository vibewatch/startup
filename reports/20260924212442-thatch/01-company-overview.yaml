company:
  name: Thatch
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Thatch is a San Francisco-based, founder-led ICHRA platform that has moved from
    early venture backing to a $1B Series C by September 2026. The company now
    publicly claims more than 5,000 employer customers, nearly 7x ARR growth over
    the prior twelve months, and a broader distribution footprint through payroll and
    benefits integrations, but governance, headcount, and exact run-rate remain opaque.
sections:
  - id: identity-and-product
    title: Identity and product
    body: >-
      Thatch is publicly positioning itself as an all-in-one platform that helps
      employers offer personalized healthcare benefits through ICHRA and employee
      health budgets. The company's own website and legal disclosures frame it as a
      financial technology company rather than an FDIC-insured depository institution,
      with banking services and insurance functions handled through partners and a
      separate insurance-services LLC. That structure matters because the product is
      not just software for plan selection; it is infrastructure that orchestrates
      reimbursements, compliance, banking rails, and insurance distribution. Reviewed
      material places the company in San Francisco and dates the business to 2021, but
      it does not expose a public cap table or independently audited financials.
    claimRefs:
      - CO001
      - CO002
      - CO003
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The company is founder-led. Public materials identify Chris Ellis as CEO and
      co-founder and Adam Stevenson as President and co-founder, while secondary
      coverage adds that Ellis came from cancer-research and biotech sales and
      Stevenson was an early Stripe employee and former founder. Those backgrounds
      explain the mix of regulated-industry empathy, fintech infrastructure, and
      product execution in the company story. The same sources suggest key-person
      dependence is real: the public narrative, fundraising, and customer migrations
      are tightly associated with the two founders, while board composition and voting
      control remain opaque in the reviewed materials. That governance opacity is a
      diligence gap rather than a negative signal by itself.
    claimRefs:
      - CO004
      - CO005
      - CO016
    tableRefs:
      - TO002
  - id: funding-scale-and-timeline
    title: Funding, scale, and milestones
    body: >-
      Thatch's capital story moved from early venture backing to a September 2026
      Series C at a $1B valuation, with Forge estimating total funding at roughly
      $192M. The company claims ARR has grown almost 7x over the prior twelve months
      and that it now powers more than 5,000 employers, while also citing a series of
      channel partnerships and the launch of Thatch Market. The material growth claims
      are company-asserted, but they are directionally consistent with the breadth of
      investors, the Venteur migration, and the company's continuing expansion into
      payroll and broker workflows. The open questions are less about direction than
      about the precise shape of the business: exact headcount, exact run-rate, and
      margins are not publicly disclosed.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    tableRefs:
      - TO003
    figureRefs:
      - FO001
