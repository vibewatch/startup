    - type: missing-source
      severity: material
      topic: headcount
      missingEvidence: Current employee count and function breakdown
      whyItMatters: Scale and execution capacity are still uncertain without a current headcount.
      diligencePath: Verify against current management reporting, LinkedIn, or a direct company response.
      relatedQuestionRefs:
        - QO009
    - type: missing-source
      severity: material
      topic: revenue-run-rate
      missingEvidence: Exact ARR or revenue run-rate, plus gross margin / unit economics
