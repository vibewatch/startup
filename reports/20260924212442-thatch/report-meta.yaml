companyProfile:
  summary: >-
    Thatch is a San Francisco-based ICHRA platform founded in 2021 that helps
    employers move from one-size-fits-all group benefits to individualized health
    budgets and employee plan choice. The company now publicly claims more than
    5,000 employers, almost 7x ARR growth over the prior twelve months, and a
    September 2026 Series C that valued the business at $1 billion, but it still
    does not disclose exact headcount, revenue run-rate, gross margin, or board
    control details.
