evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Public board roster, voting rights, and shareholder-control summary
    whyItMatters: Key-person and control risk remain hard to quantify without board and ownership disclosure.
    diligencePath: Request the cap table, board roster, and governance summary from management or a data room.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Current employee count and function breakdown
    whyItMatters: Scale and execution capacity are still uncertain without a current headcount.
    diligencePath: Verify against current management reporting, LinkedIn, or a direct company response.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: revenue-run-rate
    missingEvidence: Exact ARR or revenue run-rate, plus gross margin / unit economics
    whyItMatters: Valuation support and operating leverage remain unquantified without current financial metrics.
    diligencePath: Request the latest management financials or audited statements.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: investor-map
    missingEvidence: Complete legal cap table and full investor-control schedule
    whyItMatters: The investor map is intentionally a public-signal sample, not a full ownership picture.
    diligencePath: Request the legal cap table and investor schedule from management.
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: ICHRA addressable spend segmentation
    missingEvidence: >-
      No public source in the assigned pool cleanly splits employer-sponsored spend into ICHRA-eligible, self-funded,
      level-funded, and small-group subsegments.
    whyItMatters: It keeps the SAM and SOM directional rather than revenue-grade.
    diligencePath: >-
      Pull plan-level carrier, broker, or benefits-admin segmentation data in a future refresh to isolate eligible spend
      by employer size and funding model.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: peer-opacity
    missingEvidence: Source-backed pricing, packaging, and customer-scale data for Take Command, Remodel Health, and Zorro.
    whyItMatters: >-
      Without peer price sheets or public customer metrics, the chapter can compare category position but not benchmark
      monetization or win/loss pressure.
    diligencePath: Pull official pricing pages, proposal decks, customer references, or filings for the named peers.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      A public rate card, executed customer order form, or other disclosed fee schedule that shows list pricing and
      realized monetization by revenue stream
    whyItMatters: Without pricing and realized economics, gross margin and revenue quality stay speculative.
    diligencePath: Request a sample customer agreement or pricing exhibit from management.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: blocking
    topic: capital
    missingEvidence: Cash on hand, monthly burn, runway, and any debt or credit facility terms
    whyItMatters: Capital adequacy is the main missing underwriting input for a private company at this stage.
    diligencePath: Request the latest balance sheet, board cash forecast, and financing covenant summary.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      A public security package with named certifications, uptime/SLA commitments, incident handling, and a diagram of
      the internal control stack.
    whyItMatters: >-
      Product reliability and control maturity are central to underwriting a benefits platform that moves money and
      touches regulated health data.
    diligencePath: >-
      Request the vendor security questionnaire, SOC 2 or equivalent attestation, incident summary, and a current
      architecture or data-flow diagram.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-disclosure
    missingEvidence: Published NRR, GRR, churn, renewal, or cohort-retention data by customer segment.
    whyItMatters: Customer count alone does not show whether the base is durable or simply growing through new sales.
    diligencePath: Request cohort retention, renewal, and expansion metrics from management or a broker/customer reference set.
  - type: missing-source
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-customer, top-broker, and top-channel revenue concentration data.
    whyItMatters: A channel-led motion can hide concentration risk even when overall customer count is rising.
    diligencePath: Ask for customer and channel concentration by revenue and by active employer accounts.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      A partner-by-partner concentration schedule, customer cohort data, and any renewal/churn evidence that would show
      how much revenue or distribution sits with each payroll, bank, or channel partner.
    whyItMatters: >-
      Without concentration data, the partner-dependency risk register cannot distinguish manageable distribution
      leverage from a brittle sales model.
    diligencePath: Request management's channel concentration memo and a counterparty exposure table.
    relatedQuestionRefs:
      - QR003
      - QR007
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: incident-and-unit-economics
    missingEvidence: >-
      A recent incident log, uptime/SLA summary, SOC 2 scope, and any unit-economics or claims-loss proxy that would
      quantify the operational and financial-model risk.
    whyItMatters: >-
      The chapter can rank the risks qualitatively, but it cannot calibrate whether the current control set is adequate
      relative to growth or valuation.
    diligencePath: >-
      Ask for a security/compliance summary and a unit economics or loss-ratio memo before underwriting the next leg of
      growth.
    relatedQuestionRefs:
      - QR002
      - QR005
      - QR008
    relatedTableRefs:
      - TR002
      - TR001
  - type: missing-source
    severity: material
    topic: disclosure-gap
    missingEvidence: A public ARR bridge, gross margin trajectory, and retention/cohort disclosure.
    whyItMatters: Without those metrics, the valuation case can only be triangulated from funding and adoption signals.
    diligencePath: Ask management for a current operating summary and the latest board pack metrics before underwriting a new entry.
    relatedQuestionRefs:
      - QV003
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
