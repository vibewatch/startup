  - id: TV002
    title: "Thesis / anti-thesis table"
    columns: ["Thesis", "Anti-thesis", "What would change the view"]
    rows:
      - ["Thatch is winning distribution through payroll and benefits channels.", "Channel partners could slow adoption or tighten economics.", "Sustained partner-led employer conversion and better partner concentration data."]
      - ["ARR and employer count are growing quickly.", "Growth may not translate into durable margins or retention.", "A disclosed margin and retention trend with cohort stability."]
      - ["Strategic investors validate the category.", "Strategic money can overstate enthusiasm in a hot niche.", "Independent proof of customer pull outside the investor ecosystem."]
      - ["The product is infrastructure-like and sticky.", "Infrastructure models often face integration drag and support costs.", "Evidence that onboarding and support cost per employer is falling."]
    notes: "This table frames the current view rather than enumerating every diligence concern; the rows are deliberately paired to show what would move the thesis."
    claimRefs: [CV005, CV006, CV009, CV010, CV011]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Implied valuation logic", "Key trigger"]
    rows:
      - ["Bull", "ARR keeps compounding, channel partners expand, and public metrics eventually show healthy margins.", "The current mark can be sustained or re-rated above $1B if growth stays exceptional.", "Another year of outsized ARR growth with better operating disclosure."]
      - ["Base", "Growth normalizes but stays above category average; distribution remains intact.", "The present mark looks roughly fair if the company keeps scaling but does not overdeliver.", "Continued employer additions without a major step-up in margin proof."]
      - ["Bear", "Growth slows, partner economics worsen, or disclosure stays thin.", "The valuation compresses because the market stops paying for narrative alone.", "A visible slowdown in employer growth or a partner/regulatory snag."]
      - ["Exit-readiness lens", "The business is interesting enough for follow-up but not yet evidence-complete.", "A tracked name rather than an immediate buy.", "A tighter ARR bridge and margin series would justify a different call."]
    notes: "Scenario ranges are directional and inferred from the public financing marks and adoption signals; they are not a full valuation model."
    claimRefs: [CV002, CV003, CV004, CV007, CV008, CV011, CV012]
