chapter:
  number: 5
  title: "Product & Technology"
  summary: "Thatch is best understood as an ICHRA-based benefits automation layer: employers set budgets, employees choose coverage and eligible spend, and the company orchestrates the payment, carrier, payroll, and compliance rails behind the experience."
sections:
  - id: "product-surface"
    title: "Product surface and customer workflow"
    body: |
      Thatch presents a consumer-directed health-benefits workflow rather than a classic group-plan insurer workflow. The public product surface is centered on giving employers a health-budget model, letting employees choose their own plans, and then extending that budget into eligible health spend across a curated marketplace. The most visible external proof points are the homepage, the Series C announcement, and the company’s job postings, which together show a product that is already in market, distributed through payroll and benefits partners, and being expanded through adjacent health services.

      This chapter reads the product as a bundle of employer administration, member selection, and market access layers. That framing matters because the real differentiation is not just the consumer experience; it is the orchestration required to make ICHRA, reimbursements, partner rails, and eligibility rules behave like a reliable operating system for benefits.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE012, CE014, CE015]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-dependencies"
    title: "Operating model, architecture, and dependencies"
    body: |
      The strongest technical signal in the public record is that Thatch’s product is built around funds flows, data models, automations, and ledger-like operational control. The company is explicitly hiring for systems that integrate with carriers, financial partners, payroll providers, and banks, which suggests that the core technology challenge is reliability across many external systems rather than a single monolithic software stack. That also explains why the product language keeps returning to observability, engineering standards, and operational rigor.

      In other words, Thatch appears to sit between the employee-benefits experience and the regulated financial rails that make the experience work. The stack is therefore both product and infrastructure: member choice on one side, partner settlement and compliance on the other, with the orchestration core in the middle.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "trust-and-risk"
    title: "Trust, compliance, and open technical questions"
    body: |
      Thatch’s legal surface shows a meaningful amount of embedded compliance work: FDIC sweep disclosures, HSA eligibility terms, online banking controls, ACH and P2P transfer rules, privacy language, and fraud/security restrictions all appear directly in the public docs. That is a strong sign that the company is operating with real-money rails and regulated health-benefits logic, not a lightweight SaaS wrapper. It also means product reliability is inseparable from regulatory and partner dependency risk.

      The main diligence gap is not whether the concept exists; the public evidence is enough to show that. The gap is how much of the internal control stack is formally documented, how much uptime and incident history the team is willing to disclose, and how far the technical architecture has been hardened for scale. Those are the items that determine whether the product is merely functional or operationally durable.
    claimRefs: [CE008, CE009, CE010, CE011, CE013]
    tableRefs: []
tables:
  - id: "TE001"
    title: "Product module / asset matrix"
    columns: ["module / asset", "primary user", "status / maturity", "differentiation", "diligence gap"]
    rows:
      - ["Employer ICHRA budget setup", "HR / benefits admin", "Live", "Lets employers move from group-plan selection to a defined health budget.", "Need the rule engine for eligibility, exceptions, and employer controls."]
      - ["Member plan selection and spend", "Employees / members", "Live", "Employees pick plans and spend tax-free dollars on eligible needs.", "Need clearer documentation of the member UX and approval flow."]
      - ["Thatch Market", "Employees / members", "Launched", "Curated add-on services extend the budget model beyond insurance.", "Need the vendor selection criteria and scope of covered services."]
      - ["Carrier, payroll, and bank integrations", "Ops / engineering", "Expanding", "Connects benefits administration to real settlement and coverage rails.", "Need the dependency map, outage handling, and partner SLAs."]
    notes: "Public-surface snapshot built from the homepage, Series C post, legal terms, and hiring materials; maturity labels are inferred from source language, and 'Live' or 'Expanding' means publicly described as already in use or actively being built."
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE007, CE008, CE009, CE010, CE012, CE014]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns: ["user job", "current workflow", "Thatch workflow", "measurable benefit", "limitation"]
    rows:
      - ["Employer benefits admin", "Choose and administer a standard group plan.", "Define a budget and let members choose coverage within it.", "More individualized benefits and less one-plan-fits-all friction.", "Public docs do not quantify admin savings or implementation time."]
      - ["Employee member", "Accept the employer-selected plan and stay inside the group contract.", "Select a personal plan and use the allowance on eligible spend.", "Greater fit and portability across jobs.", "No public retention or satisfaction metrics were found here."]
      - ["Broker / channel partner", "Re-sell or manage traditional benefits administration.", "Originate or support Thatch through partner distribution surfaces.", "Potentially simpler ICHRA adoption path.", "The public record does not describe broker economics in detail."]
      - ["Operations team", "Handle manual reimbursements, reconciliation, and partner exceptions.", "Run automations, observability, and partner integrations around funds flows.", "Higher control over transactions and auditability.", "The public record does not disclose SLA or incident performance."]
    notes: "Workflow table based on the public product narrative and engineering hiring post; benefit claims are directional rather than quantified, and the limitation column marks what the reviewed sources do not prove."
    claimRefs: [CE001, CE002, CE003, CE005, CE007, CE009, CE010, CE012, CE013]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns: ["layer / component", "role", "dependency", "risk"]
    rows:
      - ["Member experience", "Plan shopping, spending, and service access", "Carrier networks and marketplace vendors", "If partner content or eligibility rules change, the member experience degrades."]
      - ["Orchestration core", "Data models, funds flows, automation, and ledger behavior", "Internal engineering quality and transaction tooling", "Reconciliation or automation defects would hit trust quickly."]
      - ["Partner rails", "Payroll, bank, and carrier integration layer", "Gusto, Justworks, Paychex, ADP, Thread / bank partners", "External API downtime or contract changes create platform fragility."]
      - ["Compliance envelope", "Eligibility, privacy, fraud, and regulatory controls", "HSA rules and federal privacy/security requirements", "Regulatory changes or weak control disclosure can become a diligence issue."]
    notes: "Architecture table is a synthesis of public legal terms, the hiring post, and the company’s own product announcements; all risk statements are inference-based and should be read as diligence prompts rather than incident reports."
    claimRefs: [CE005, CE007, CE008, CE009, CE010, CE011, CE012, CE013]
