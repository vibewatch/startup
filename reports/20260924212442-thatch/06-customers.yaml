chapter:
  number: 6
  title: "Customers"
  summary: >-
    Thatch's public customer base is still most visible in small and mid-sized employers, but the
    company is also showing up-market reach through named larger customers and broker/payroll
    distribution. The strongest public signals are the jump to 5,000+ employers, the Venteur
    migration, and the channel routes that can expose millions of SMBs to the product.
sections:
  - id: "customer-mix"
    title: "Customer mix and buyer shape"
    body: >-
      Public evidence points to a buyer mix that starts with employers and their HR or benefits
      owners, but reaches employees, brokers, and payroll administrators. Thatch positions itself
      as an employer-funded ICHRA platform, so the payer is usually the company while the user is
      the employee who chooses coverage and spends the health budget. That is most compelling for
      smaller employers that want fixed costs and less benefits administration, and for mid-market
      companies that want choice without building an internal benefits stack. The same public
      materials also show that channel partners matter: payroll platforms and brokers appear to be
      part of the buying motion rather than a side channel.
    claimRefs:
      - CU003
      - CU004
      - CU010
      - CU013
    tableRefs:
      - TU001
  - id: "adoption-signals"
    title: "Adoption signals and channel momentum"
    body: >-
      The clearest adoption signal is scale, not retention disclosure. Thatch says it now powers
      benefits for more than 5,000 employers and that ARR has surged almost 7x over the last twelve
      months. Earlier momentum was visible after launch, when the company onboarded more than 100
      paying companies within a few months. The channel story is equally important: Thatch says it
      can reach millions of small businesses through Gusto, Justworks, and Paychex, while ADP RUN
      deepens the same distribution strategy. Taken together, the company looks less like a one-off
      direct-sales tool and more like an employer-benefits rail that can scale through embedded
      distribution.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU011
    tableRefs:
      - TU002
      - TU003
  - id: "durability-loop"
    title: "Durability, concentration, and the expansion loop"
    body: >-
      The public record says a lot more about growth than about durability, so the main inference
      is that customer expansion is still being built through references, advocacy, and broader
      product surface area. Thatch is hiring a customer advocacy manager from the ground up, which
      suggests it expects customer references and peer proof to matter in the sales motion. The
      company also depends on carrier and payroll partners, and public commentary flags broker
      education and rollout friction as real constraints. At the same time, the company has enough
      named larger-customer visibility to show that it is not trapped in only the smallest SMB
      segment. The result is a customer motion that looks durable only if channel partners, support,
      and customer advocacy keep compounding together.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU012
    figureRefs:
      - FU001
