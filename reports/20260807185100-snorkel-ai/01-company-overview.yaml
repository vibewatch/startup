callouts:
- calloutType: strength
  title: Research-origin moat is still commercially relevant
  body: Snorkel is one of the few AI infrastructure companies whose commercial narrative still maps directly onto an independently documented research program. That makes the company easier to underwrite than vendors whose differentiation is primarily branding or labor scale.
  claimRefs:
  - CO002
  - CO005
  - CO009
  - CO011
- calloutType: risk
  title: Key operating metrics remain secondary-source estimates
  body: The company's latest valuation, ARR, and headcount can be triangulated publicly, but not through audited disclosures. That raises diligence risk around revenue quality, cash efficiency, and the precise structure of the 2025 financing.
  claimRefs:
  - CO020
  - CO021
  - CO022
- calloutType: insight
  title: Post-Scale fragmentation can help Snorkel—but only if GTM keeps up
  body: External market commentary suggests neutral and specialized AI-data vendors gained a stronger opening after Meta's Scale investment, but the same environment also intensifies rivalry and puts pressure on sales execution, packaging, and partner leverage.
  claimRefs:
  - CO036
  - CO037
  - CO038
  - CO039
  - CO040
