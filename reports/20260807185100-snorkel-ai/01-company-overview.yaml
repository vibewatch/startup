  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current board roster with director names, affiliations, and independence status.
    whyItMatters: Board composition affects governance quality, control rights, and investor protections after multiple growth rounds.
    diligencePath: Request an up-to-date board list, observer rights, and committee structure directly from the company or lead investors.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: material
    topic: series-d-structure
    missingEvidence: A breakdown of primary versus secondary proceeds in the May 2025 Series D and any associated tender mechanics.
    whyItMatters: The financing structure determines how much new cash actually strengthened the balance sheet versus provided shareholder liquidity.
    diligencePath: Request the board financing memo, closing schedule, and cap-table bridge for the Series D from management or the lead investor.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: arr-quality
    missingEvidence: Audited or management-certified ARR, gross retention, net retention, and revenue concentration metrics.
    whyItMatters: Secondary ARR estimates are directionally useful but insufficient for valuation underwriting or quality-of-revenue analysis.
    diligencePath: Request the latest board package or investor update containing ARR bridge, churn, expansion, and top-customer concentration.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
  - type: stale
    severity: minor
    topic: current-headcount
    missingEvidence: A current 2026 employee count by function and geography.
    whyItMatters: Headcount is a useful but fast-moving proxy for burn, delivery capacity, and GTM build-out, and the public estimate trails current date by at least a year.
    diligencePath: Request a current org chart or HR snapshot with total headcount, open reqs, and contractor mix.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: executive-roster
    missingEvidence: A comprehensive, current executive roster with role scope and biographies.
    whyItMatters: Without a full public executive list it is difficult to assess functional depth beyond research-led founders and selected GTM hires.
    diligencePath: Request the current leadership deck or executive org chart from company counsel or investor relations.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: A fuller dated chronology of internal product launches, board changes, and any undisclosed adverse events between 2022 and 2024.
    whyItMatters: The public milestone record is good enough to anchor the company history, but it is still incomplete for understanding execution cadence between financing events.
    diligencePath: Request an internal company timeline or board materials covering product releases, major hires, and material setbacks that were not publicly announced.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO004
