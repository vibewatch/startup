company:
  name: Snorkel AI
chapter:
  number: 1
  title: Company Overview
  summary: Snorkel AI is a 2019 Stanford AI Lab spinout that now positions itself as a frontier AI data lab for specialized training data, evaluation systems, and custom agents. Public evidence supports an August 2021 $85 million Series C at a $1 billion valuation and a May 2025 $100 million Series D that lifted disclosed funding to roughly $235 million, but current ARR and headcount remain secondary-source estimates rather than audited disclosures.
sections:
- id: identity-and-origin
  title: Identity, Origin, and Positioning
  body: 'Snorkel AI frames itself less as a generic labeling tool and more as a frontier AI data lab. The company says it was founded out of the Stanford AI Lab in 2019, building on the earlier Snorkel research project that started in 2015 and popularized programmatic labeling, weak supervision, and data-centric AI. That history matters because Snorkel still sells the research thesis directly: instead of scaling human annotation linearly, it tries to turn expert knowledge, evaluation design, and programmatic checks into reusable data-development systems. Its public website now emphasizes specialized training data, research-grade benchmarks, evaluation environments, and custom agents for frontier labs and enterprise AI teams, while the Stanford DAWN project remains the clearest independent description of the original technical primitives—labeling, transforming, and slicing data programmatically.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO006
  - CO008
  - CO009
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: founders-and-governance
  title: Founders, Leadership, and Governance Transparency
  body: 'Founder-market fit is one of Snorkel''s strongest visible assets. Alexander Ratner''s Stanford thesis work explicitly targeted the labeling bottleneck that later became Snorkel''s commercial product, while Christopher Ré remains a Stanford professor embedded in SAIL and CRFM, giving the company academic credibility in data-centric AI and systems research. Public materials and secondary profiles also name Braden Hancock as a co-founder. The public record is thinner on current governance than on founding pedigree: reviewed materials clearly identify the founders and selected leadership hires, but they do not publish a full board roster or a comprehensive executive page with current roles, committees, or outside directorships. That is manageable for a private company, but it limits diligence on decision rights, succession planning, and board-level independence after multiple growth rounds.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  tableRefs:
  - TO002
- id: capital-and-scale
  title: Funding History, Valuation, and Reported Scale
  body: Snorkel's capital story is straightforward at the round level and fuzzier at the operating-metric level. Multiple sources corroborate an August 2021 $85 million Series C at a $1 billion valuation, co-led by Addition and BlackRock, and a May 2025 $100 million Series D led by Addition. Secondary sources converge on roughly $235 million of total disclosed funding and a latest reported valuation of about $1.3 billion after the Series D. The harder diligence questions are current ARR, headcount, and financing structure. FNEX reports about $148 million of ARR and roughly 776 employees in 2025, but those figures are secondary and not tied to audited statements or a company filing. Likewise, public sources name investors in the 2025 round but do not disclose the exact primary-versus-secondary split or the governance rights attached to the raise.
  claimRefs:
  - CO004
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
