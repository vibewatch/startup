- id: people-execution-and-financial-model-risk
  title: People, Execution, and Financial-Model Risk
  body: The open public question is whether Snorkel scales like a software platform with high-value services attached, or like a services-enabled AI company with software economics still forming. Its strongest references all involve expert knowledge capture, workflow customization, and difficult enterprise deployments. That is excellent for customer relevance, but it can translate into long sales cycles, slower onboarding, and higher implementation dependence. SWOT-style external analysis and customer cases both suggest that the company still has to simplify its message, reduce platform complexity, and accelerate time to value. Financially, earlier chapters already established that gross margin, retention, concentration, cash, and runway are undisclosed. Those missing metrics turn execution risks into underwriting risks because investors cannot tell how much operating leverage exists behind the product story. The key execution risk is therefore not simply hiring or competition for AI talent.
    It is failing to make a complex, expert-led platform easier to buy, deploy, and renew before larger ecosystems normalize enough of the workflow to narrow the value gap.
  claimRefs:
  - CR014
  - CR015
  - CR021
  - CR024
  - CR025
  - CR026
  - CR027
  - CR032
  - CR039
  tableRefs:
  - TR004
- id: mitigations-kill-triggers-and-diligence-priority
  title: Mitigations, Kill Triggers, and Diligence Priority
  body: 'Publicly, Snorkel does show credible mitigations. It leans into provenance, human review, custom evaluation, deployment flexibility, and partner leverage instead of pretending that enterprise AI can be de-risked by model choice alone. Those are sensible defenses. But every mitigation still needs measurement. Investors should treat the following as thesis-break triggers until management proves otherwise: inability to produce renewal and concentration data; evidence that partner platforms are winning the workflow layer directly; delays in satisfying regulated-buyer requirements; failure of benchmark gains to hold in production; or deterioration in expert-supply quality and onboarding speed. The practical diligence order is clear. First, verify customer durability and concentration. Second, verify compliance posture and certification depth. Third, verify implementation repeatability and services mix. Fourth, verify whether evaluation-led products are materially improving revenue quality.
    If those checks fail, Snorkel''s visible strengths could still coexist with an unattractive risk-adjusted investment profile.'
  claimRefs:
  - CR032
  - CR033
  - CR038
  - CR039
  - CR040
