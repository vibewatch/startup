callouts:
- calloutType: risk
  title: The central risk is not whether Snorkel has technology, but whether it can operationalize trust at software scale
  body: Snorkel's public strengths are real, yet its hardest problems all sit at the point where governance, expert labor, regulated deployment, and revenue quality intersect.
  claimRefs:
  - CR001
  - CR014
  - CR025
  - CR040
- calloutType: insight
  title: Platform substitution is the cleanest external thesis-break
  body: If large ecosystems bundle enough evaluation, governance, and agent tooling, Snorkel will need to prove deeper vertical or regulated-workflow advantage to preserve pricing power.
  claimRefs:
  - CR017
  - CR018
  - CR027
  - CR028
- calloutType: recommendation
  title: Prioritize diligence on durability and compliance before product enthusiasm
  body: Customer concentration, renewal quality, certification depth, and implementation repeatability are the fastest ways to determine whether the risk-adjusted story matches the technical promise.
  claimRefs:
  - CR022
  - CR024
  - CR032
  - CR039
