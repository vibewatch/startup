- id: market-sizing-and-contradictions
  title: Sizing the Core Market and Preserving the Contradictions
  body: 'The cleanest market numbers available are still for the narrow AI data-labeling core, and they point to a real but not massive market in 2026. Mordor estimates $2.32 billion in 2026 revenue and Precedence estimates $2.83 billion, with both studies pointing to roughly 23% growth. Those figures are important because they anchor the lower bound of what clearly belongs inside the category. They also expose the core contradiction in Snorkel''s story: the company is valued like a scaled AI infrastructure platform, but the directly measured labeling market is only a few billion dollars today. The only way to reconcile that gap is to believe the monetizable surface is larger than labeling alone and that Snorkel can capture a premium slice of enterprise, government, and frontier-lab spend where evaluation quality, domain expertise, and governance matter. That supports using multiple lenses rather than one TAM number. A reasonable working view is that Snorkel''s practical SAM is only a fraction
    of the generic labeling market, and its near-term SOM is smaller still, because only a subset of buyers need high-assurance expert data and evaluation systems badly enough to pay premium economics.'
