chapter:
  number: 2
  title: Market Analysis
  summary: Snorkel AI participates in a broadened AI data infrastructure market that now spans annotation, programmatic data curation, evaluation, red teaming, and post-training customization workflows. The best accessible 2026 market studies still size the narrow AI data-labeling core at only about $2.3-$2.8 billion globally, which supports a meaningful market but also shows why Snorkel's valuation depends on capturing higher-value enterprise, government, and frontier-lab workloads rather than commodity annotation volume alone.
sections:
- id: market-boundary-and-spend-definition
  title: Market Boundary, Adjacencies, and Included Spend
  body: 'Snorkel''s relevant market is broader than legacy annotation but narrower than the full generative-AI stack. Official Snorkel materials frame the company around specialized training data, expert review, evaluation environments, and model refinement, while OpenAI, Scale, Labelbox, Mercor, Arize, and Humane Intelligence all show that customers increasingly buy workflows that combine data creation with evaluation, monitoring, red teaming, and post-training improvement. That broadening matters because it changes what should count as included spend: enterprise budgets for domain-specific data creation, human-in-the-loop quality control, benchmark design, red teaming, and model-specific refinement all sit inside Snorkel''s orbit, while generic cloud inference, foundational model pretraining, and commodity software seats mostly sit outside it. The status quo is also fragmented. Buyers can still use internal data teams, open-source tools such as CVAT, or workforce-heavy vendors like Appen
    and Toloka. As a result, Snorkel is not selling into one clean category; it is selling into a contested boundary where the most valuable deals mix software, expert services, governance, and workflow integration.'
