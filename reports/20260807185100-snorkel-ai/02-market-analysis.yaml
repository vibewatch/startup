  title: Directly measured TAM is still modest
  body: Accessible 2026 analyst studies still size the narrow labeling core at only about $2.3-$2.8 billion globally, so Snorkel's growth case depends on premium share capture and category expansion rather than generic market volume alone.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM040
- calloutType: insight
  title: Bundling and open source can compress pricing
  body: Open-source tools, workforce-heavy vendors, and model-platform providers are all expanding adjacent capabilities, which means Snorkel must prove premium ROI in the segments where governance and domain expertise matter most.
