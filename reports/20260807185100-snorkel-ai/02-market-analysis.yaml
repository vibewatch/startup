tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Snorkel
  rows:
  - - Core AI data labeling
    - Image, text, audio, video, and document annotation services or software
    - Generic cloud compute and model inference
    - ML teams, data ops, product teams
    - Baseline category where analyst market sizes are clearest
  - - Programmatic data curation
    - Weak supervision, rule-based labeling, expert review, and QA workflows
    - One-off manual micro-tasking without reusable logic
    - AI platform teams and domain-expert workflows
    - Matches Snorkel's core thesis of replacing linear labeling labor
  - - Model evaluation and red teaming
    - Benchmarks, test sets, adversarial probes, human evaluation, safety review
    - Pure observability with no evaluation or human review loop
    - Model developers, risk teams, safety teams
    - Increasingly central to frontier and regulated deployments
  - - Post-training customization
    - Fine-tuning support, domain-specific data pipelines, reward or preference data, assisted customization
    - Foundation-model pretraining and generic API usage
    - Product engineering and applied AI leaders
    - Important because custom model work increases demand for proprietary data systems
  - - Agent observability / improvement
    - Tracing, eval dashboards, experimentation, continual learning workflows
    - Unrelated DevOps or APM tools
    - AI engineering and platform owners
    - Adjacent spend pool that can either complement or compete with Snorkel
  - - Open-source or internal substitutes
    - Self-hosted tooling, internal reviewers, custom scripts, internal QA operations
    - Third-party premium service bundles
    - Cost-sensitive teams or data-sovereign organizations
    - Caps low-end pricing and lengthens evaluation cycles
  notes: Included-versus-excluded spend is based on the language used by official vendor pages and adjacent-market material rather than a single analyst taxonomy.
