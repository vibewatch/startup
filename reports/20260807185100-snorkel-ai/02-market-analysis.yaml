- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Enterprise AI adoption scaling into production
    - Driver
    - Near-term
    - More production use cases create more need for domain-specific data and evaluation
    - What percentage of Snorkel pipeline is tied to production expansion versus experimentation?
  - - Agentic AI and custom-model workflows
    - Driver
    - Near-term
    - Raises demand for benchmark design, human feedback, and domain-specific evaluation loops
    - How much revenue already comes from agent or post-training workloads?
  - - Governance and auditable oversight requirements
    - Driver
    - Near-term
    - Favors vendors that can document quality, provenance, and human review
    - Which compliance requirements most directly accelerate deal closure?
  - - Regulated-industry adoption
    - Driver
    - Mid-term
    - Healthcare, finance, and government can support premium pricing if value is proven
    - What share of ARR comes from regulated verticals and how concentrated is it?
  - - Open-source substitution (e.g., CVAT)
    - Constraint
    - Current
    - Compresses low-end software pricing and supports internal build strategies
    - Where does Snorkel win decisively over self-hosted tools?
  - - Workforce-scale vendors (Appen, Toloka)
    - Constraint
    - Current
    - Can win on flexible labor capacity and commoditized volume work
    - Does Snorkel intentionally avoid low-margin, labor-led projects?
  - - Cloud/model-provider bundling and adjacent-platform expansion
    - Constraint
    - Near-term
    - Could absorb parts of the workflow into broader AI stacks
    - How differentiated is Snorkel when hyperscalers add eval and customization features?
  - - Synthetic data and stronger base models
    - Constraint
    - Mid-term
    - May reduce some labeling demand even while increasing evaluation demand
    - Which Snorkel workloads expand as labeling shrinks, and what margin profile do they carry?
  notes: Timing labels are judgmental but trace back to recent survey evidence, official platform positioning, and adverse commentary on market structure.
