  title: Category drift favors Snorkel’s thesis
  body: The market is moving away from pure box-drawing annotation toward evaluation, red teaming, and domain-specific refinement loops, which is materially closer to Snorkel's programmatic data thesis than to a commodity labor marketplace.
  claimRefs:
  - CM001
  - CM004
  - CM020
  - CM038
