  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-precision
    missingEvidence: A management-quality segmentation of current demand between commodity labeling spend and premium data-plus-evaluation workflows.
    whyItMatters: Without a company- or buyer-level spend breakdown, any Snorkel-specific SAM remains an analyst estimate rather than a directly observed market fact.
    diligencePath: Request Snorkel pipeline segmentation by buyer type, workload, ACV band, and attach rate for evaluation or services modules.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: public-pricing
    missingEvidence: Public price lists, contract sizes, or benchmark ACVs for Snorkel and its closest competitors across buyer segments.
    whyItMatters: Buyer map quality improves materially if contract values and packaging can be compared across enterprise, frontier-lab, and government segments.
    diligencePath: Collect sales materials, procurement records, or customer interviews that disclose pricing, seats, services mix, or minimum contract size.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: evaluation-vs-labeling-spend-share
    missingEvidence: A public market study that isolates how much category spend is already flowing specifically to evaluation, red teaming, and observability rather than to labeling.
    whyItMatters: This would sharpen the bridge between the narrow labeling TAM and Snorkel's broader product positioning.
    diligencePath: Look for future analyst reports or public-company disclosures that split data, evaluation, and post-training budgets into separate categories.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM001
    - TM004
