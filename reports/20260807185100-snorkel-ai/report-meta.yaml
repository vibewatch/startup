companyProfile:
  summary: Snorkel AI is a Redwood City–based enterprise AI company spun out of the Stanford AI Lab in 2019. It began with programmatic data labeling and weak supervision, then expanded into a broader platform for research-led data development, custom evaluation, fine-tuning, RAG optimization, and specialized-agent workflows. Public materials show Snorkel serving frontier-model teams, Fortune 500 enterprises, regulated institutions, and government programs where domain-specific data, expert judgment, and measurable evaluation matter.
  foundedDate: '2019-01-01'
  founders:
    - name: Alexander Ratner
      role: Co-founder and CEO
      background: Stanford researcher whose weak-supervision thesis work became the commercial foundation for Snorkel.
      claimRefs: [CO010]
    - name: Christopher Ré
      role: Co-founder and Stanford professor
      background: SAIL and CRFM research leader who helped shape Snorkel's founding data-centric AI thesis.
      claimRefs: [CO011]
    - name: Braden Hancock
      role: Co-founder
      background: Named as a co-founder in secondary company profiles and investor summaries.
      claimRefs: [CO012]
  foundingLocation: Stanford AI Lab / Bay Area, California, USA
  headquarters: Redwood City, California, USA
  productSummary: Snorkel sells an enterprise AI data-development and evaluation stack spanning custom datasets, benchmarks, custom evaluation, fine-tuning and alignment, RAG optimization, and specialized agents. The platform is designed to help organizations encode domain expertise into measurable AI workflows rather than rely only on generic foundation-model behavior.
  customerFocus: Frontier-model teams, Fortune 500 enterprises, regulated industries, and government agencies that need trustworthy, domain-specific AI systems.
  businessModel: Enterprise software and workflow contracts with expert-enabled data development, evaluation, and implementation services layered around the platform.
  stage: growth
  fundingStatus: Series D completed in May 2025 at a reported $1.3B valuation with $100M raised; total disclosed funding is roughly $235M-$237M, with a later strategic investment from Accenture on undisclosed terms.
  claimRefs: [CO001, CO003, CO010, CO011, CO012, CI017, CI018, CV027]
