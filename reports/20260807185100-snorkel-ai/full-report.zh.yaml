      - number: '1.4'
        title: 产品体系、客户验证与分销模式
        blocks:
          - type: paragraph
            body: >-
              Snorkel 的公开材料显示，公司同时销售软件和紧密耦合的专家服务。产品体系从 Snorkel Flow 和「评测—策展—精炼」工作流起步，再延伸到专项数据集、评测环境和专家在环交付。对一家私营 AI
              基础设施公司来说，官方客户案例给出的验证点异常具体：Google 记录了数百万个程序化标注数据点，分类器平均提升 52%；Wayfair 报告品类胜率 98.97%、点击率提升 7 个点；MSKCC 报告
              HER-2 患者识别准确率 93%。DIU 和 Army 项目也显示政府侧牵引力。分销正越来越依赖伙伴：公开集成页面显示 Snorkel 围绕 Google Cloud、Microsoft
              Azure、Databricks 和 AWS 构建能力。这很重要，因为这些渠道能降低部署摩擦，并帮助公司卖进受监管或基础设施负担较重的买方。
