  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 增长超出公开估算，收入结构转向经常性评估 / agent 工作流
        - $180M-$200M+ ARR 上的低双位数收入倍数，可支撑高于上一轮估值的上行空间
        - 捆绑风险受抑；续约和集中度表现强
        - 需要管理层证明持久性和软件经济性
      - - 基准
        - 公开 ARR 估算方向正确，业务质量扎实但不完全透明
        - 在约 $148M ARR 上给 ~7x-9x 倍数，可支撑大致接近上一轮的估值
        - 没有更好披露，上行空间有限
        - 最符合目前可得的公开证据
      - - 悲观
        - ARR 质量不及预期，服务占比偏重，或集中度与平台风险浮现
        - 在 $110M-$130M ARR 上给 ~5x-6x 倍数，意味着相对上一轮估值有明显下行
        - 下轮降价或平轮风险上升
        - 如果尽调无法确认持久性，该情景会浮现
    notes: 上述情景只具方向性，因为公开信息缺少利润率、留存和优先权堆栈输入，无法精确建模。
