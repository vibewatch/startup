            body: >-
              Snorkel 的资本故事在轮次层面很清楚，但到经营指标就变得模糊。多方资料相互印证：2021 年 8 月，公司完成 $85 million Series C，估值 $1 billion，由 Addition 和
              BlackRock 共同领投；2025 年 5 月，公司完成 $100 million Series D，由 Addition 领投。二手资料大体指向约 $235 million 的已披露总融资，以及
              Series D 后约 $1.3 billion 的最新报告估值。更难的尽调问题在于当前 ARR、员工数和融资结构。FNEX 报告 2025 年 ARR 约 $148 million、员工约 776
              人，但这些数字来自二手来源，未与经审计报表或公司备案挂钩。同样，公开来源列出了 2025 年轮次的投资方，却没有披露一级与二级交易的准确拆分，也没有披露本轮附带的治理权利。
