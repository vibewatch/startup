            body: >-
              Snorkel 的资本位置容易描述，却难以精确量化。多方来源印证，公司 2025 年 5 月以报告估值 $1.3 billion 完成 $100 million Series D；之后，公司又获得
              Accenture Ventures 一笔未披露金额的战略投资，与企业 GTM
              合作绑定。这个组合不支持「短期融资承压」的判断，尤其是公司卖入的市场看起来仍吸引战略伙伴和风险投资人。但公开资本充足性仍未被证明，因为已审阅来源没有披露现金余额、月度烧钱、跑道或债务安排。因此，资本强度问题取决于业务组合：如果评测驱动的软件和经常性平台使用占比越来越高，Snorkel
              可能比劳动力驱动的数据厂商更少依赖外部资本；如果专家数据服务仍占较大份额，扩张可能继续依赖人力，也更消耗营运资金。下一轮融资触发点因此不太取决于表面需求，而更取决于当前「平台 +
              专家数据」策略能否带来持久经常性收入，并维持可接受的利润率和客户集中度风险。
