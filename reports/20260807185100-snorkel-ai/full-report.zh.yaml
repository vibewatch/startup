  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据支持谨慎而非激进的估值立场。Snorkel 确实具备投资人愿意付费的属性：可信的技术根基、蓝筹客户、新近 $100M 融资，以及与后训练、评测和智能体 AI
              对齐的产品叙事。相对地，公司仍未披露最能约束定价纪律的变量：留存、集中度、毛利率画像、服务占比、现金续航和优先权压力。结果是一家公司可能具备战略吸引力，但按最后报告的估值还不一定容易投资。若采用被广泛引用的
              $148M ARR 估算，隐含约 8.8x 的倍数相较许多私营 AI 基础设施叙事并不显得紧绷；但它完全取决于 ARR 估算和背后的收入质量假设。因此，基于公开证据的合适建议是继续研究或按当前价格跟踪；如果
              Snorkel 能证明类软件的持续性和收入质量，再愿意正向重估。
