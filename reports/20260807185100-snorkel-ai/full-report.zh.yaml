  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 整体风险图景与排序
        blocks:
          - type: paragraph
            body: >-
              Snorkel 的公开风险图景少见地跨越多职能。公司站在企业数据治理、模型评测、专家劳动力、云平台和受监管客户工作流的交叉点，比典型的窄 SaaS
              厂商面对更多风险类别。公开可见的头部风险不是市场消失，也不是技术虚假；而是合规预期比产品成熟更快上升，大型伙伴把部分价值主张打包带走，服务较重的交付模型比预期更难扩张，客户质量过于不透明、难以支撑高置信投资判断。这些风险彼此相连。监管变化会抬高实施成本；更重的实施会拖慢销售、压缩毛利；部署变慢会让大型平台替代方案更有吸引力；披露薄弱又会让投资人难以区分暂时摩擦和结构性弱点。因此，最重要的尽调问题不是哪一个风险最重要，而是
              Snorkel 是否有足够运营杠杆和治理深度，同时处理多项风险。
