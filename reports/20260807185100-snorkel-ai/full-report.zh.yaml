            body: >-
              Snorkel 的头条融资背景很直接：多方来源称，2025 年 5 月公司完成 $100M Series D，估值 $1.3B，总融资约
              $235M-$237M。更难的是把这一估值放进有用的可比集合。作为私募市场参照，Scale AI 明显更大、流动性更强，公开估值为 $29B，收入估计在 $1.5B-$2.0B 区间。Labelbox
              上一次披露的主要估值来自 2022 年 Series D，约 $1B；Latka 类二级来源估算 ARR 约 $50M。Weights & Biases 2023 年宣布以 $1.25B 估值融资
              $50M，在业务性质上更接近软件和 ML 工具可比项，尽管商业模式不同于 Snorkel 的数据开发焦点。与此同时，Appen
              是最有用的上市下行合理性校验可比项，因为它展示了当收入质量、利润率和公开市场纪律发挥作用时，AI 数据业务可能长什么样。没有一个对比是干净的。合在一起，它们说明 Snorkel
              的最后估值合理，但吸引力取决于它能否证明自己配得上相对数据服务可比公司的质量溢价，同时不被更宽的平台叙事吸收。
