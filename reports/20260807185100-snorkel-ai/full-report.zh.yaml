companyProfile:
  summary: >-
    Snorkel AI 是一家位于 Redwood City 的企业 AI 公司，2019 年从 Stanford AI Lab
    孵化出来。公司从程序化数据标注和弱监督起步，后来扩展为更宽的平台，覆盖研究驱动的数据开发、定制评测、微调、RAG 优化和专用智能体工作流。公开材料显示，Snorkel 服务前沿模型团队、Fortune 500
    企业、受监管机构和政府项目；这些场景都需要领域数据、专家判断和可量化评测。
