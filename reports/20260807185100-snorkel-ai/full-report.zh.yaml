  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 论点传导
      - 行动含义
    rows:
      - - ARR 质量不及预期
        - 经核实 ARR 明显低于公开估算，或软件占比低
        - 8.8x 倍数不再显得保守
        - 下调目标价格或放弃
      - - 留存 / 集中度偏弱
        - NRR/GRR 低，或头部客户占比过高
        - 客户质量论点破裂
        - 只有大幅折价才定价，否则放弃
      - - 平台替代加速
        - 主要合作伙伴吞并评估 / 治理层
        - 护城河收窄，倍数压缩
        - 下调可比组和下行情景
      - - 合规深度被证明不足
        - 受监管买方要求 Snorkel 缺少的控制措施
        - 销售周期和 TAM 质量走弱
        - 推迟或避免投资
      - - 服务强度持续偏高
        - 实施仍依赖人力且速度慢
        - 利润率扩张论点破裂
        - 使用更低倍数和更长持有期假设
    notes: 上述触发项变化最快，足以把一个看似合理的估值变成缺乏吸引力的估值。
    claimRefs:
      - CV023
      - CV024
      - CV028
      - CV032
      - CV033
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经常性收入质量
        - GRR、NRR、续约分组、服务组合
        - 决定上一轮估值是否配得上软件型倍数
        - 管理层财务资料包 / 董事会材料
      - - 客户集中度
        - Top-10 集中度和最大客户占比
        - 决定议价权和下行风险
        - 收入集中度分析
      - - 毛利率和实施经济性
        - 综合 GM、分部 GM、每次部署人员配置
        - 决定经营杠杆和退出倍数支撑
        - 财务 + 服务运营审阅
      - - 股权结构表和优先权
        - 投后股数、清算优先权堆栈、二级交易组合
        - 决定真实进入经济性和退出回报
        - 法务 / 公司尽调
      - - 合规和信任深度
        - 安全认证、历史事故、受监管控制映射
        - 决定是否适合向金融、医疗和政府扩张
        - 信任中心审阅和客户访谈
    notes: 缺少上述项目，估值精度就是虚假的信心。
    claimRefs:
      - CV013
      - CV017
      - CV025
      - CV026
      - CV037
      - CV038
      - CV039
