            body: >-
              公开牵引力证据方向上积极，但经营层面并不完整。已审阅来源中最常被引用的私营公司指标，是 FNEX 对 2025 年约 $148 million ARR 和约 776 名员工的估计；公开轮次报道则锚定 $1.3
              billion 估值和 $100 million Series D。客户和伙伴材料显示，公司活跃于大型企业和政府买方；Accenture
              公告又增加了具名金融服务渠道价值。然而，承销最需要的指标仍未披露：毛利率、服务组合、净留存与总留存、积压订单、头部客户集中度、递延收入、现金转化和当前现金余额。即便总融资数字，在可访问来源之间也有轻微差异；有些来源约为
              $235 million，Coverager 列为 $237 million。这些并不让 Snorkel
              看起来弱，只说明公司仍呈现私营风投支持平台的披露模式，而不是已准备接受公开市场式财务分析的业务。正确的尽调姿态，是把需求验证和收入质量验证分开，并直接向管理层索取后一类缺失数据。
