      - number: '8.5'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              Snorkel
              更像一家可能具备战略重要性的公司，而不是一家仅凭公开资料就能被顺畅定价的公司。融资历史、客户标识和伙伴生态都支持其对大型软件、云或数据平台买家的潜在退出吸引力。但公开退出准备度受缺失信息约束。没有公开股权结构明细，没有披露优先权堆栈，没有可靠集中度图景，也没有能让投资人建模下行的毛利或现金画像。这些不是表面遗漏。它们决定最后估值在私募二级交易、未来一级融资或战略出售场景下是否站得住。最终尽调议程因此很简单：验证经常性收入质量，验证部署可复制性，验证受监管行业控制深度，并验证当前估值在计入稀释和执行风险后是否还留下足够上行。
            claimRefs:
