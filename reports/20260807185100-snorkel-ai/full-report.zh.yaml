  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻接领域与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Snorkel 所在市场比传统标注更宽，但比完整生成式 AI 技术栈更窄。Snorkel
              官方材料把公司放在专项训练数据、专家审阅、评测环境和模型精炼周围；OpenAI、Scale、Labelbox、Mercor、Arize 和 Humane Intelligence
              则共同说明，客户越来越多购买把数据创建、评测、监控、红队和训练后改进绑在一起的工作流。这种外延扩张很重要，因为它改变了哪些支出应该被纳入：企业为领域专用数据创建、人类在环质量控制、基准设计、红队和特定模型精炼支付的预算，都在
              Snorkel 的轨道内；通用云推理、基础模型预训练和商品化软件席位大多在轨道外。现状同样碎片化。买方仍可使用内部数据团队、CVAT 等开源工具，或 Appen、Toloka
              这类劳动力密集型厂商。因此，Snorkel 卖入的不是一个干净品类，而是一条争夺中的边界；最有价值的交易往往混合软件、专家服务、治理和工作流集成。
