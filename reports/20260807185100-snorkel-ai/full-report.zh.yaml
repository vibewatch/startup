      - number: '2.2'
        title: 核心市场规模与矛盾保留
        blocks:
          - type: paragraph
            body: >-
              目前最干净的市场数字仍来自狭义 AI 数据标注核心，指向的是一个真实但不算巨大的 2026 年市场。Mordor 估计 2026 年收入为 $2.32 billion，Precedence 估计为 $2.83
              billion，两项研究都指向约 23% 的增长。这些数字重要，因为它们锚定了明确属于该品类的下限。它们也暴露了 Snorkel 叙事中的核心矛盾：公司的估值像一家已有规模的 AI
              基础设施平台，但直接测量的标注市场今天只有数十亿美元。弥合这条差距，唯一办法是相信可变现范围大于标注本身，并且 Snorkel
              能在企业、政府和前沿实验室支出中拿到高溢价份额；这些支出看重评测质量、领域专知和治理。由此也应使用多重视角，而不是单一 TAM 数字。一个合理的工作假设是，Snorkel 的实际 SAM
              只是通用标注市场的一部分，近期 SOM 更小；只有一部分买方迫切需要高保障专家数据和评测系统，愿意为此支付溢价经济性。
