            body: >-
              公开情景框架最好从 ARR、收入质量和倍数支撑搭建，而不是从盈利出发，因为驱动毛利模型所需输入都未披露。牛市情景下，Snorkel
              证明评测驱动和智能体工作流具备经常性、续约良好，并提高软件收入占比，即便没有超高增长，也可能支撑低双位数收入倍数。基准情景下，报告的 ARR
              估算方向正确，当前估值已经捕捉大部分上行，只有投资人对质量更有信心时，才留下有限进入空间。熊市情景下，ARR
              或毛利质量不及预期，伙伴平台压窄差异化，或集中度风险浮现——其中任何一项都可能让上一轮看起来偏贵。因此，敏感性最高的不是故事质量，而是证据质量：真实
              ARR、续约、毛利率、服务占比和客户集中度。披露这些之前，精确测算只会制造虚假信心。
            claimRefs:
