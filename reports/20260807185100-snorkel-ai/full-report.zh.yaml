      - number: '2.3'
        title: 买方分层、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >-
              对 Snorkel
              真正重要的买方，不是按模型类型划分，而是按出错成本划分。前沿实验室和先进模型构建者购买数据、基准和评测循环，用来提升模型能力与安全；大型企业购买领域专用训练和评测，是因为内部数据、合规义务和工作流复杂度很难只靠公开模型解决；公共部门或防务项目购买可审计的人类在环系统，是因为它们需要监督和任务适配。Snorkel
              自己的案例已经显示这种分布：Google 代表大规模模型改进，Wayfair 和 MSKCC 代表企业与受监管行业工作流，DIU 代表政府采用。预算负责人通常是 AI
              平台负责人、产品或转型高管；在受监管场景中，则是必须批准部署的风险、合规或项目办公室。采用通常从某个工作流的具体验证点开始；只有当供应商能证明准确率、安全性或吞吐量可量化提升，并能接入客户既有技术栈时，才会扩张。
