      - number: '1.2'
        title: 创始人、领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配度，是 Snorkel 最强的可见资产之一。Alexander Ratner 在斯坦福的论文工作明确瞄准标注瓶颈，后来演化成 Snorkel 的商业产品；Christopher Ré
              仍是斯坦福教授，并深度参与 SAIL 和 CRFM，给公司在以数据为中心的 AI 和系统研究上提供学术信用。公开材料和二手资料也将 Braden Hancock
              列为联合创始人。相比创始履历，当前治理的公开记录更薄：已审阅材料能清楚识别创始人和部分领导层任命，但没有发布完整董事会名单，也没有给出包含现任角色、委员会或外部董事席位的完整高管页面。作为私营公司，这种披露不足可以理解，但会限制对决策权、接班规划，以及多轮成长融资后董事会独立性的尽调。
