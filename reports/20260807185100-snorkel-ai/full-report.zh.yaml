        title: 人员、执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              公开问题在于，Snorkel 会像一个附带高价值服务的软件平台那样扩张，还是像一家由服务使能、软件经济性仍在形成的 AI
              公司。它最强的引用都涉及专家知识捕捉、工作流定制和困难的企业部署。这对客户价值极好，但也可能转化为长销售周期、较慢上线和更高实施依赖。SWOT
              风格的外部分析和客户案例都显示，公司仍需简化信息传达、降低平台复杂度、缩短价值兑现时间。财务上，前文已说明毛利率、留存、集中度、现金余额和续航期均未披露。这些缺失指标把执行风险变成投资判断风险，因为投资人无法判断产品故事背后有多少运营杠杆。核心执行风险因此不只是招聘或
              AI 人才竞争，而是在大型生态把足够多工作流标准化、压窄价值差之前，未能让一个复杂、专家主导的平台更容易购买、部署和续约。
