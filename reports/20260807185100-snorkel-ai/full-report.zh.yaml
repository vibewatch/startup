  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现范围
        blocks:
          - type: paragraph
            body: >-
              Snorkel 公开材料描绘的变现模式，比纯标注软件更宽，也比通用劳动力市场更像软件。公司销售 Snorkel Enterprise AI 和 AI
              数据开发平台，也明确推广专家数据、评测与调优工作流；这些工作流依赖领域专家和定制数据集。这至少指向三层收入：软件订阅或平台访问、服务或托管数据项目，以及面向具体工作流的评测或调优项目。Accenture 2025
              年战略投资公告也强化了这种判断：公告描述了把企业数据转成 AI 就绪训练与评测资产的联合行业解决方案，听起来更像解决方案销售，而不是简单按席位收费的 SaaS。公开弱点是定价透明度。Snorkel
              页面没有披露标价、用量价格或实际成交价，因此仅凭公开证据，不能把公司建模成干净的自助式 SaaS。更现实的看法是，收入混合了经常性软件、实施和专家服务项目；不同客户细分和用例下，组合很可能不同。
