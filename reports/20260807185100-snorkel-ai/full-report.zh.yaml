  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代解法
        blocks:
          - type: paragraph
            body: >-
              Snorkel 面对的是分层竞争，而不是单一同业集合。直接的高端平台对手是 Scale AI 和 Labelbox，两者如今销售的是训练数据、评测和企业级部署，而不只是基础标注。Appen 和 Toloka
              代表劳动力密集的托管服务竞争者，能在规模、人员供给和领域覆盖上交付广度；CVAT
              则是愿意自托管标注和质量工作流的团队在低端最强的替代品。另一条独立但越来越重要的侧翼，是评测优先工具：Arize、W&B、Humane Intelligence，以及此前的
              Humanloop，都说明一些买方可以把评测、追踪、红队或持续改进预算从数据创建预算中拆出来。Mercor 又增加一种混合威胁，因为它把专家市场、基准和智能体部署合成同一套叙事。因此，Snorkel
              的竞争问题不只是还有谁在标注数据，而是谁能先于 Snorkel 占住买方工作流，并让 Snorkel 的程序化数据层显得可有可无。
