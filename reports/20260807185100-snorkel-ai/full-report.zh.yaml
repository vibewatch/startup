        blocks:
          - type: paragraph
            body: >-
              在已审阅集合中，Scale 是披露规模最大的直接可比公司，估值 $29 billion，员工超过 1,000 人，并明确提供面向企业和政府 AI 的全栈平台。Labelbox
              披露规模看起来更小，但前沿实验室定位更尖锐，围绕定制评测和面向顶级 AI 实验室的专家智能体开发做营销。Appen 是传统规模型广度竞争者：它强调 30 年 AI 数据经验、100 万贡献者、170
              多个国家，产品线如今已延伸到 RLHF、评分标准设计和托管评测。Toloka 同样从劳动力根基扩展到智能体训练、红队和评测。CVAT
              与这一组不同，它提供开源和自托管企业选项，而不是不透明的企业专属合同。Arize 和 W&B 仍是相邻玩家，不是完整替代品；但只要评测、追踪和迭代改进成为第一预算线，它们就会争夺买方注意力。Mercor
              更年轻，但具备战略重要性，因为它把专家人才、基准和企业智能体部署揉进同一个叙事，同时触达前沿实验室和企业团队。
