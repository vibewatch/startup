      - number: '4.6'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开财务结论是：需求质量谨慎正面，可承销性仍为负面。Snorkel
              似乎具备可信的市场需求、蓝筹买方，以及投资人对专家评测和训练后工作流迁移的融资意愿。这些都是有意义的正面因素。公开证据没有建立的是收入质量：没有经验证的毛利率、留存、客户集中度、实际成交价、现金消耗或跑道数据。结果是，公司看起来战略位置很好，但财务披露不足。如果
              FNEX 的 ARR 估计方向正确，对一家企业 AI
              基础设施公司来说，私有估值并不极端；如果该数字被高估，承销图景会实质改变。因此，眼前尽调议程应围绕经常性收入与服务收入组合、总留存和净留存、头部客户集中度、专家劳动力利用率，以及当前现金跑道桥接。除非这些数据点被披露，否则
              Snorkel 的财务吸引力仍是由产品和融资信号支撑的论点，而不是已完全验证的投资案例。
            claimRefs:
              - CI025
              - CI031
              - CI036
              - CI037
              - CI038
