        - 商业模式不同，轮次也较早
      - - Appen
        - 2025 年公开收入 $230.8M
        - 公共市场可比公司的合理性校验，而不是私有市场估值锚
        - 可用于校验 AI 数据经济性的下行现实
        - 公共市场的增长和情绪不同
    notes: 可比组混合了私有轮次、二级市场数据和一家上市可比公司，因为没有任何单一同行能干净匹配 Snorkel。
    enumerationScope:
      coverage: sample
      basis: Representative sample spanning private AI data, ML tooling, and public AI-data comparables relevant to Snorkel.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV020
