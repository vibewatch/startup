      - number: '8.7'
        title: 证据摘要
        blocks:
          - type: callout
            title: Snorkel 可能定价合理，但尚未明显低估
            body: 报告的 8.8x ARR 倍数对一家强劲的私营 AI 基础设施资产来说并不明显紧绷，但也没有低到足以原谅缺失的持续性和毛利数据。
            calloutType: insight
