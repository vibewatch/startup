      - number: '2.5'
        title: 约束、替代品与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Snorkel 市场的主要约束不在于 AI 是否增长，而在于技术栈碎片化时，差异化数据与评测厂商能否守住溢价经济性。Mordor 和 Precedence
              都显示，外包和人工工作流今天仍重要；但竞争对手官方页面解释了为什么利润率压力在上升。Appen 和 Toloka 靠规模与劳动力覆盖竞争，CVAT
              用开源自托管压缩低端价格，Scale、Labelbox、Arize、W&B、Mercor
              和模型提供商都在切入相邻的评测与改进层。反向观点是，云厂商和基础模型厂商可能随时间吸收更多工作流；同时，合成数据和更强基础模型会降低部分传统标注任务的需求。Humanloop 并入 Anthropic
              并停止独立运营，也说明这一层的平台独立性并无保障。尽调上，最大未解问题是精确 SAM/SOM 测量：公开市场研究量化了宽泛品类需求，却没有披露像 Snorkel
              这样高端、企业级、程序化数据与评测平台能拿到多少专项支出。
