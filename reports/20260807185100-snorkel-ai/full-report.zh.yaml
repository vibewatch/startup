      - number: '2.4'
        title: 增长驱动、时点，以及市场为何仍能扩张
        blocks:
          - type: paragraph
            body: >-
              未来两年，Snorkel 这类系统的需求应会扩大，但需求结构比单纯 AI 热度更重要。Deloitte 和 Stanford AI Index 都显示，2024-2025 年企业 AI 采用明显加速；OpenAI
              的定制化项目则说明，即使基础模型改进，许多组织仍需要专有数据管线和评测系统。这种组合利好 Snorkel，因为智能体
              AI、定制领域行为和受监管部署都会增加对基准设计、专家审阅和可审计精炼循环的需求。治理是另一项重要驱动。Deloitte 报告称，只有五分之一组织拥有成熟的自主智能体治理；Humane Intelligence
              明确把情境评测和红队作为付费服务销售，这意味着更多支出应流向能记录质量与风险的系统。不过，时点收益并不均匀。企业先看到生产力收益，再看到收入收益；因此采购团队在资助大型多年平台铺开前，可能仍会要求工作流层面的
              ROI 证明。增长因此可能最集中在高风险用例：错误输出的业务成本即时且可见。
