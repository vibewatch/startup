            body: >-
              公开证据暗示，Snorkel 的成本结构比硬件或制造业务更轻，但比纯自助软件更重。Snorkel
              的产品需要程序化工作流、企业集成，并且越来越需要领域专家创建数据和参与评测。这意味着毛利率很可能由三个变量塑造：云或平台成本、员工工程与支持成本，以及可变专家劳动力或托管服务交付成本。公司认为，程序化标注和评测能减少线性人工投入，相比蛮力标注厂商应有利于利润率；但它没有按产品线披露仍有多少工作是劳动力密集型。Appen
              的公开可比证据在这里有用。Appen 2025 年年报和投资者材料显示，其业务仍围绕 AI 数据、模型评测和智能体工作流，但由于劳动力组合和执行很重要，公司单独披露经营收入、现金和盈利能力指标。这不能直接揭示
              Snorkel 的利润率，却强化了一个基本判断：人类数据业务可以盈利，但利润率质量高度取决于交付组合和成本纪律。
