      - number: '8.6'
        title: 估值结论
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，最公平的判断是，Snorkel 大概率没有在任一方向错估一个数量级，但披露不足以至于价格纪律应压过热情。报告的 8.8x ARR 倍数与一家不错的私营 AI
              基础设施公司匹配；但这个倍数还不低，无法单独抵消不确定性。能够获得高质量内部尽调的投资人，如果看到续约、集中度和毛利率强劲，仍可能认为当前估值有吸引力。主要依赖公开证据的投资人，应避免只为叙事付高价。换句话说，今天的
              Snorkel 更像一个高质量的继续研究 / 跟踪候选，而不是一个仅凭公开数据就能确信买入的标的。
