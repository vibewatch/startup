      - number: '1.5'
        title: 里程碑、认可与新兴风险
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年既是加速期，也是压力期。Snorkel 新增 $100 million Series D、Accenture 在金融服务方向的战略投资、DIU 挑战完成记录，以及 Army xTech AI
              Grand Challenge 第三名；随后又在 2026 年获得 Forbes 和 Fast Company
              认可。品牌和公共部门信用都因此受益。与此同时，外部分析师描绘的是一个经济性快速变化的市场。SWOTAnalysis 提醒，企业销售周期长、买方教育负担重、产品复杂，并且面临云厂商和开源工具威胁。AInvest
              认为 Meta-Scale 交易让数据供给生态碎片化，给 Snorkel 这类专业厂商打开窗口，但也加剧竞争，倒逼更快的 GTM 执行。概览层面的结论是：Snorkel
              具备清晰的研究信用和客户信用，但能否把这种信用转成持久的品类领导力，仍是尽调的核心问题。
