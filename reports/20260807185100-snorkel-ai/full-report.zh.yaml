    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与定位
        blocks:
          - type: paragraph
            body: >-
              Snorkel AI 不把自己定位成通用标注工具，而更像前沿 AI 数据实验室。公司称其 2019 年从 Stanford AI Lab 创立，承接的是 2015 年启动的 Snorkel
              研究项目；该项目让程序化标注、弱监督和以数据为中心的 AI 得到普及。这段历史很关键，因为 Snorkel
              现在仍在直接销售这套研究论点：公司不想线性扩大人工标注，而是把专家知识、评测设计和程序化检查转成可复用的数据开发系统。官网如今强调专项训练数据、研究级基准、评测环境，以及面向前沿实验室和企业 AI
              团队的定制智能体；Stanford DAWN 项目仍是外部资料中最清楚解释其原始技术基元的来源，即用程序化方式标注、转换和切片数据。
