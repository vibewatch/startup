      - number: '3.4'
        title: 切换成本、分销权力与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              切换成本有意义，但不是绝对壁垒。一旦买方把领域专用数据管线、质量评分标准、评测数据集和人工审阅操作嵌入工作流，替换既有供应商并不轻松。这利好 Snorkel
              在成熟、高风险部署中的位置。与此同时，已审阅市场在结构上允许多供应商并用，因为厂商常常解决同一工作的相邻部分。团队可以用 CVAT 或内部工具做原始标注，用 Arize 或 W&B 做评测，再用托管服务厂商做专家
              RLHF 或红队。不同竞争者类别的分销权力也差异很大。Scale 强调跨云企业部署和全栈运营，Appen 强调全球贡献者规模，CVAT 强调基础设施控制，Snorkel
              强调集成优先的企业部署和程序化工作流。Mercor 则从另一方向切入，把工作流视为企业智能体部署加人工基准测试。结果是，Snorkel
              面对的不是一场单一的赢家通吃之战，而是反复发生的模块级选择压力；产品附加率和工作流广度因此成为其护城河核心。
