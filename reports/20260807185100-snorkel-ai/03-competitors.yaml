- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim / risk
  - Why it matters
  - Severity
  - Threat
  - Diligence ask
  rows:
  - - Programmatic data-development workflow
    - Snorkel abstracts domain expertise into reusable supervision and evaluation loops
    - High
    - Scale and Labelbox are adding more workflow and eval depth
    - What win rates does Snorkel achieve specifically against Scale and Labelbox?
  - - Enterprise integration posture
    - Integration-first deployment can deepen switching costs after adoption
    - Medium
    - Scale GenAI Platform and self-composed eval stacks narrow the gap
    - How long are production integrations and what is the attach rate for services?
  - - Governed human-in-the-loop quality
    - High-stakes buyers need auditable review and benchmark design
    - Medium
    - Appen, Scale, Mercor, and Humane all market structured oversight
    - Which governance features actually decide deals?
  - - Cost transparency risk
    - Opaque pricing hurts small-team adoption and comparison shopping
    - Medium
    - CVAT and internal build options establish a visible low-end benchmark
    - What is Snorkel's minimum ACV and how often is price the primary objection?
  - - Open-source substitution
    - Self-hosted alternatives can win sovereignty-sensitive or budget-constrained teams
    - High
    - CVAT enterprise and community editions keep improving
    - Where does Snorkel beat CVAT on total cost of ownership?
  - - Category fragmentation
    - Buyers can assemble tooling from multiple layers instead of one platform
    - High
    - Arize, W&B, Mercor, model providers, and internal stacks
    - What percentage of accounts use Snorkel alongside another evaluation or labeling vendor?
  - - Cloud / model-provider bundling
    - Broader platforms can absorb point features into larger AI budgets
    - High
    - OpenAI, hyperscalers, and full-stack rivals
    - Which features stay unique when model providers add evaluation and customization tooling?
  - - Independent-tool consolidation
    - Adjacent vendors can disappear into model providers or become complements rather than competitors
    - Medium
    - Humanloop's Anthropic outcome shows this path clearly
    - How resilient is Snorkel if evaluation budgets consolidate upstream?
