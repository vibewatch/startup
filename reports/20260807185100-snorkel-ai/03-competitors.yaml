- id: competitor-profiles
  title: Direct, Managed-Service, Open-Source, and Adjacent Competitor Profiles
  body: 'Scale is the biggest disclosed direct comparable in the reviewed set, with a $29 billion valuation, 1,000-plus employees, and an explicit full-stack platform for enterprise and government AI. Labelbox appears smaller in disclosed scale but sharper in frontier-lab positioning, marketing itself around custom evaluations and specialist agent development for top AI labs. Appen is the legacy-scale breadth competitor: it emphasizes 30 years of AI data work, one million contributors, 170-plus countries, and product lines that now extend into RLHF, rubric design, and managed evaluations. Toloka similarly expanded from workforce roots into agent training, red teaming, and evaluation. CVAT splits from this group by offering open-source and self-hosted enterprise options instead of opaque enterprise-only contracts. Arize and W&B remain adjacent rather than full substitutes, but they compete for buyer attention wherever evaluation, tracing, and iterative improvement are the first budget line.
    Mercor is newer but strategically important because it blends expert talent, benchmarks, and enterprise agent deployment into one narrative that reaches both frontier labs and enterprise teams.'
