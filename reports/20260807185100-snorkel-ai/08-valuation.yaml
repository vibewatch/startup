chapter:
  number: 8
  title: Valuation
  summary: At the reported May 2025 $1.3 billion valuation and roughly $148 million ARR estimate, Snorkel AI screens at about 8.8x ARR—an arguably reasonable multiple for a differentiated enterprise AI infrastructure asset, but not an obviously cheap one given missing retention, concentration, margin, and cap-table disclosure. The public evidence supports a view that Snorkel is strategically real and possibly fairly priced, yet still too under-disclosed for a high-conviction “buy at any price” recommendation.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and Price Discipline
  body: 'The public evidence supports a cautious rather than aggressive valuation stance. Snorkel clearly has attributes investors pay for: credible technical roots, blue-chip customers, a fresh $100 million round, and a product narrative aligned with post-training, evaluation, and agentic AI. Against that, the company still withholds the variables that matter most for pricing discipline: retention, concentration, margin profile, services mix, cash runway, and preference overhang. The result is a company that may be strategically attractive without yet being straightforwardly investable at the last reported mark. Using the widely cited $148 million ARR estimate, the implied multiple of roughly 8.8x does not look stretched relative to many private AI infrastructure narratives, but it is only as good as the ARR estimate and revenue-quality assumptions behind it. The appropriate public-evidence recommendation is therefore research more or track at the current price, with a willingness to revisit
    positively if Snorkel can prove software-like durability and quality of revenue.'
  claimRefs:
