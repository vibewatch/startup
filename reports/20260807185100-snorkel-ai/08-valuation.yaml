- id: thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The long case for Snorkel is that it sits on the right side of enterprise AI complexity. As frontier models commoditize, enterprises still need domain-specific data, evaluation, and governance to make those models useful in production. Snorkel''s customer, product, and partner evidence all point in that direction. The anti-thesis is equally clear: large platforms are moving deeper into evaluation and agent workflows, open-source concepts are widely understood, and investors do not yet know whether Snorkel''s strongest deployments renew and expand like software or consume resources like expert-enabled services. That means the investment case is price-sensitive and evidence-sensitive. Snorkel could become a clear buy if durability and margin quality prove strong. It could just as easily be fully priced or expensive if ARR is overstated, concentration is high, or services intensity remains heavy. The key insight is that Snorkel''s company quality and Snorkel''s investability at a given
    price are not the same question.'
  claimRefs:
  - CV005
  - CV006
  - CV012
  - CV014
  - CV015
  - CV024
  - CV028
  - CV029
  - CV030
  - CV035
