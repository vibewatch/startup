  - TV006
- id: valuation-verdict
  title: Valuation Verdict
  body: The fairest public-evidence verdict is that Snorkel is probably not mispriced by an order of magnitude in either direction, but it is under-disclosed enough that price discipline should dominate enthusiasm. A reported 8.8x ARR multiple is compatible with a good private AI infrastructure company; it is not low enough to neutralize uncertainty on its own. Investors who can gain high-quality inside diligence may still find the current mark attractive if renewal, concentration, and gross margin are strong. Investors relying mainly on public evidence should resist paying up for narrative alone. In other words, Snorkel today looks more like a high-quality research-more/track candidate than a clean public-data conviction buy.
