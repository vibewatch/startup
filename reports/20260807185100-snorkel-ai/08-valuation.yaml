- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Recurring revenue quality
    - GRR, NRR, renewal cohorts, services mix
    - Determines whether last mark deserves software-like multiple
    - Management finance pack / board materials
  - - Customer concentration
    - Top-10 concentration and largest-account share
    - Determines bargaining-power and downside risk
    - Revenue concentration analysis
  - - Gross margin and implementation economics
    - Blended GM, segment GM, staffing per deployment
    - Determines operating leverage and exit multiple support
    - Finance + services ops review
  - - Cap table and preferences
    - Post-money share count, liquidation stack, secondary mix
    - Determines true entry economics and exit returns
    - Legal / corporate diligence
  - - Compliance and trust depth
    - Security attestations, incident history, regulated control mapping
    - Determines suitability for finance, healthcare, and government expansion
    - Trust-center review and customer references
  notes: Without these items, valuation precision would be false confidence.
