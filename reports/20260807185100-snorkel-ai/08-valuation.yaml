- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR quality disappoints
    - Verified ARR materially below public estimate or low software mix
    - 8.8x multiple ceases to look conservative
    - Lower price target or pass
  - - Retention / concentration are weak
    - Low NRR/GRR or top-customer share too high
    - Customer quality thesis breaks
    - Price only with major discount or pass
  - - Platform substitution accelerates
    - Major partners subsume evaluation/governance layer
    - Moat narrows and multiple compresses
    - Lower comp set and downside case
  - - Compliance depth proves insufficient
    - Regulated buyers require controls Snorkel lacks
    - Sales cycle and TAM quality weaken
    - Delay or avoid investment
  - - Services intensity stays high
    - Implementation remains labor-heavy and slow
    - Margin expansion thesis breaks
    - Use lower multiple and longer hold assumptions
  notes: These are the fastest-moving events that would turn a plausible valuation into an unattractive one.
