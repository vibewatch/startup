chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Positioning
        blocks:
          - type: paragraph
            body: >-
              Snorkel AI frames itself less as a generic labeling tool and more as a frontier AI data lab. The company
              says it was founded out of the Stanford AI Lab in 2019, building on the earlier Snorkel research project
              that started in 2015 and popularized programmatic labeling, weak supervision, and data-centric AI. That
              history matters because Snorkel still sells the research thesis directly: instead of scaling human
              annotation linearly, it tries to turn expert knowledge, evaluation design, and programmatic checks into
              reusable data-development systems. Its public website now emphasizes specialized training data,
              research-grade benchmarks, evaluation environments, and custom agents for frontier labs and enterprise AI
              teams, while the Stanford DAWN project remains the clearest independent description of the original
              technical primitives—labeling, transforming, and slicing data programmatically.
