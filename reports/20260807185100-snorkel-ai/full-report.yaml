  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a cautious rather than aggressive valuation stance. Snorkel clearly has
              attributes investors pay for: credible technical roots, blue-chip customers, a fresh $100 million round,
              and a product narrative aligned with post-training, evaluation, and agentic AI. Against that, the company
              still withholds the variables that matter most for pricing discipline: retention, concentration, margin
              profile, services mix, cash runway, and preference overhang. The result is a company that may be
              strategically attractive without yet being straightforwardly investable at the last reported mark. Using
              the widely cited $148 million ARR estimate, the implied multiple of roughly 8.8x does not look stretched
              relative to many private AI infrastructure narratives, but it is only as good as the ARR estimate and
              revenue-quality assumptions behind it. The appropriate public-evidence recommendation is therefore
              research more or track at the current price, with a willingness to revisit positively if Snorkel can prove
              software-like durability and quality of revenue.
            claimRefs:
