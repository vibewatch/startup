  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Ways to Solve the Job
        blocks:
          - type: paragraph
            body: >-
              Snorkel competes in a layered landscape rather than a single peer set. The direct premium-platform rivals
              are Scale AI and Labelbox, both of which now market training data, evaluation, and enterprise-grade
              deployment rather than basic annotation alone. Appen and Toloka represent workforce-heavy managed-service
              competitors that can deliver breadth, human supply, and domain coverage at scale, while CVAT represents
              the strongest low-end substitute for teams willing to self-host annotation and quality workflows. A
              separate but increasingly relevant flank is evaluation-first tooling: Arize, W&B, Humane Intelligence,
              and, previously, Humanloop all show that some buyers can separate evaluation, tracing, red teaming, or
              continual-improvement budgets from data-creation budgets. Mercor adds another hybrid threat because it
              combines expert marketplaces, benchmarks, and agent deployment. The competitive question for Snorkel is
              therefore not only who else labels data, but which vendors can occupy the buyer's workflow before Snorkel
              does and make its programmatic data layer feel optional.
            claimRefs:
