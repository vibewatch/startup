            body: >-
              The public financial verdict is cautiously positive on demand quality and still negative on
              underwriteability. Snorkel seems to have credible market demand, blue-chip buyers, and investor
              willingness to fund the shift toward expert evaluation and post-training workflows. Those are meaningful
              positives. What public evidence does not establish is revenue quality: there is no verified gross margin,
              retention, concentration, realized pricing, cash burn, or runway data. The result is a company that looks
              strategically well-positioned but financially under-disclosed. If FNEX's ARR estimate is directionally
              right, the private valuation does not look extreme for an enterprise AI infrastructure business; if that
              figure is overstated, the underwriting picture changes materially. The immediate diligence agenda should
              therefore center on recurring-versus-services mix, gross and net retention, top-customer concentration,
              expert-labor utilization, and a current cash runway bridge. Until those data points are disclosed,
