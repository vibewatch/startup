      - number: '1.3'
        title: Funding History, Valuation, and Reported Scale
        blocks:
          - type: paragraph
            body: >-
              Snorkel's capital story is straightforward at the round level and fuzzier at the operating-metric level.
              Multiple sources corroborate an August 2021 $85 million Series C at a $1 billion valuation, co-led by
              Addition and BlackRock, and a May 2025 $100 million Series D led by Addition. Secondary sources converge
              on roughly $235 million of total disclosed funding and a latest reported valuation of about $1.3 billion
              after the Series D. The harder diligence questions are current ARR, headcount, and financing structure.
              FNEX reports about $148 million of ARR and roughly 776 employees in 2025, but those figures are secondary
              and not tied to audited statements or a company filing. Likewise, public sources name investors in the
              2025 round but do not disclose the exact primary-versus-secondary split or the governance rights attached
              to the raise.
