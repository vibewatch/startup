      - number: '8.5'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Snorkel looks closer to a company that could be strategically important than to one that is publicly ready
              for frictionless underwriting. The round history, customer logos, and partner ecosystem all support
              potential exit relevance to large software, cloud, or data-platform buyers. But public exit readiness is
              constrained by missing information. There is no public cap-table detail, no disclosed preference stack, no
              reliable concentration picture, and no margin or cash profile that lets investors model downside. Those
              are not cosmetic omissions. They decide whether the last valuation is defensible in a private secondary, a
              future primary round, or a strategic-sale context. The final diligence agenda is therefore simple:
              validate recurring revenue quality, validate deployment repeatability, validate regulated-industry control
              depth, and validate whether the current mark leaves enough upside after accounting for dilution and
