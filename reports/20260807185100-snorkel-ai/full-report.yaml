  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Overall Risk Landscape and Ranking
        blocks:
          - type: paragraph
            body: >-
              Snorkel's public risk picture is unusually cross-functional. The company operates at the intersection of
              enterprise data governance, model evaluation, expert labor, cloud platforms, and regulated customer
              workflows. That creates more categories of risk than a typical narrow SaaS vendor faces. The top public
              risks are not that the market disappears or that the technology is fake. Instead, they are that compliance
              expectations rise faster than product maturity, that large partners bundle away parts of the value
              proposition, that a services-heavy delivery model proves harder to scale than expected, and that customer
              quality remains too opaque to underwrite confidently. These risks are interconnected. A shift in
              regulation can raise implementation cost; heavier implementation can slow sales and compress margins;
              slower deployments can make large-platform alternatives more attractive; and weak disclosure can keep
              investors from distinguishing temporary friction from structural weakness. For that reason the most
              important diligence question is not which one risk matters most, but whether Snorkel has enough
              operational leverage and governance depth to manage several at once.
            claimRefs:
