      - number: '1.4'
        title: Product System, Customer Proof, and Distribution Model
        blocks:
          - type: paragraph
            body: >-
              Snorkel's public materials show a company selling both software and tightly coupled expert services. The
              product system starts with Snorkel Flow and the evaluate-curate-refine workflow, then extends into
              specialized datasets, evaluation environments, and expert-in-the-loop delivery. Official customer stories
              give unusually concrete proof points for a private AI infrastructure company: Google documents millions of
              programmatically labeled data points and a 52% average classifier improvement, Wayfair reports a 98.97%
              category win rate and seven-point clickthrough lift, and MSKCC reports 93% accuracy for HER-2 patient
              identification. Government traction is also visible through DIU and Army programs. Distribution appears
              increasingly partner-led: public integration pages show Snorkel building around Google Cloud, Microsoft
              Azure, Databricks, and AWS, which matters because these channels can shorten deployment friction and help
              the company sell into regulated or infrastructure-heavy buyers.
