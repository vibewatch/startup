companyProfile:
  summary: >-
    Snorkel AI is a Redwood City–based enterprise AI company spun out of the Stanford AI Lab in 2019. It began with
    programmatic data labeling and weak supervision, then expanded into a broader platform for research-led data
    development, custom evaluation, fine-tuning, RAG optimization, and specialized-agent workflows. Public materials
    show Snorkel serving frontier-model teams, Fortune 500 enterprises, regulated institutions, and government programs
    where domain-specific data, expert judgment, and measurable evaluation matter.
  foundedDate: '2019-01-01'
  founders:
    - name: Alexander Ratner
      role: Co-founder and CEO
      background: Stanford researcher whose weak-supervision thesis work became the commercial foundation for Snorkel.
      claimRefs:
        - CO010
    - name: Christopher Ré
      role: Co-founder and Stanford professor
      background: SAIL and CRFM research leader who helped shape Snorkel's founding data-centric AI thesis.
      claimRefs:
