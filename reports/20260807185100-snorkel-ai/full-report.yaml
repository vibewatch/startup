        title: Financing Context and Comparable Set
        blocks:
          - type: paragraph
            body: >-
              Snorkel's headline financing context is straightforward: multiple sources report a $100 million Series D
              in May 2025 at a $1.3 billion valuation, taking total funding to roughly $235-$237 million. The harder
              task is placing that mark into a useful comparable set. Scale AI is clearly much larger and more liquid as
              a private market reference, with a publicized $29 billion valuation and revenue estimates in the $1.5-$2.0
              billion range. Labelbox's last major disclosed valuation sits around $1 billion from its 2022 Series D,
              while Latka-type secondary sources estimate around $50 million ARR. Weights & Biases announced a $50
              million round at a $1.25 billion valuation in 2023, representing a closer software-and-ML-tools comp in
              spirit even though its business model differs from Snorkel's data-development focus. Appen, meanwhile, is
              the most useful public downside sanity comp because it shows what AI-data businesses can look like when
              revenue quality, margins, and public-market discipline matter. No one comparison is clean. Together they
              say Snorkel's last mark is plausible, but its attractiveness depends on proving it deserves a quality
              premium over data-services comps while not getting absorbed into broader platform narratives.
