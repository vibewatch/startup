      - number: '7.2'
        title: Regulatory, Legal, and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              Snorkel's product is increasingly aimed at the kinds of environments where regulators and enterprise-risk
              teams care deeply about data provenance, human oversight, deployment controls, and formal accountability.
              The EU AI Act introduces a risk-based framework for AI systems, with high-risk obligations around
              governance and controls that can matter for financial, healthcare, and public-sector deployments. NIST's
              AI RMF and its emerging critical-infrastructure profile raise the standard of what sophisticated buyers
              will expect even when obligations are voluntary. HIPAA creates a sector-specific overlay when clinical or
              health-record workflows are involved. Snorkel's own privacy, subscription, and SLA documents show it
              already operates under formal enterprise legal structures, which is positive, but they also reveal how
              much of the trust burden sits in contracts and process controls rather than publicly visible certification
              depth. The main public legal risk is therefore not an identified enforcement action. It is the possibility
              that regulated buyers demand more documented controls, certifications, localization, or audit evidence
              than the public surface currently proves.
