      - number: '2.5'
        title: Constraints, Substitutes, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The main constraint on Snorkel's market is not whether AI is growing; it is whether differentiated data
              and evaluation vendors can hold premium economics as the stack fragments. Mordor and Precedence both show
              that outsourced and manual workflows still matter today, but official competitor pages show why margin
              pressure is rising. Appen and Toloka compete on scale and workforce coverage, CVAT compresses the low end
              through open-source self-hosting, and Scale, Labelbox, Arize, W&B, Mercor, and model providers are all
              pushing into adjacent evaluation and improvement layers. The adverse view is that clouds and
              foundation-model vendors may absorb more of the workflow over time, while synthetic data and stronger base
              models reduce demand for some traditional labeling tasks. Humanloop's sunset into Anthropic underscores
              that platform independence in this layer is not guaranteed. For diligence, the biggest unresolved issue is
              precise SAM/SOM measurement: public market studies quantify broad category demand, but they do not
              disclose how much spend is specifically available to a premium, enterprise-grade, programmatic
              data-and-evaluation platform like Snorkel.
            claimRefs:
