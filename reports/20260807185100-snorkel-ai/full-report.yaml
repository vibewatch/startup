              source disclosed Snorkel's customer count, net revenue retention, gross retention, churn, contract length,
              cohort behavior, or top-customer concentration. Yet several signals point to how the expansion model
              likely works. Cases in banking, healthcare, defense, and large-enterprise operations imply sticky
              post-deployment workflows where customer-specific data, expert judgment, and evaluation harnesses create
              switching costs. Accenture's investment and initial focus on financial services also suggest that Snorkel
              sees land-and-expand potential through vertical solution partnerships. Still, the public evidence cannot
              show whether those workflows renew at attractive rates or whether revenue is concentrated in a handful of
