      - number: '8.4'
        title: Bull / Base / Bear Scenarios and Sensitivity
        blocks:
          - type: paragraph
            body: >-
              The public scenario framework is best built from ARR, revenue quality, and multiple support rather than
              from earnings, because none of the inputs needed for a margin-driven model are disclosed. In a bull case,
              Snorkel proves that evaluation-led and agent workflows are recurring, renew well, and grow the software
              share of revenue, which could justify a low-double-digit revenue multiple even without hypergrowth. In a
              base case, the reported ARR estimate is directionally right and the current valuation already captures
              most of that upside, leaving modest room for entry only if investors gain more confidence in quality. In a
              bear case, ARR or margin quality disappoints, partner platforms narrow differentiation, or concentration
              risk emerges—any of which could make the last round look rich. Sensitivity is therefore highest not to
              story quality, but to evidence quality: actual ARR, renewal, gross margin, services mix, and customer
              concentration. Until those are disclosed, precision would be false confidence.
