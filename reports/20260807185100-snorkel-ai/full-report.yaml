  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Surface
        blocks:
          - type: paragraph
            body: >-
              Snorkel's public materials describe a monetization model that is broader than pure annotation software and
              more software-like than a generic labor marketplace. The company sells Snorkel Enterprise AI and an AI
              data development platform, but it also explicitly markets expert data, evaluation, and tuning workflows
              that depend on domain experts and bespoke datasets. That points to at least three revenue layers: software
              subscriptions or platform access, services or managed-data programs, and workflow-specific evaluation or
              tuning engagements. Accenture's 2025 strategic-investment release reinforces this interpretation by
              describing joint industry solutions that turn enterprise data into AI-ready training and evaluation
              assets, which sounds more like a solution sale than a simple seat-based SaaS motion. The public weakness
              is pricing transparency. Snorkel's pages do not disclose list prices, usage prices, or realized pricing,
              so the company cannot be modeled as a clean self-serve SaaS business from public evidence alone. A
              realistic view is that revenue is a hybrid of recurring software, implementation, and expert-service
              programs whose mix likely varies by customer segment and use case.
