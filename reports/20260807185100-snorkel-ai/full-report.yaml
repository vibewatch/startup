        title: Partner Dependency and Customer-Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Snorkel's ecosystem strategy is both a growth engine and a major risk vector. The company is tied visibly
              to OpenAI, Google Cloud, AWS, Databricks, Carahsoft, and Accenture, and those relationships help with
              distribution, model access, infrastructure efficiency, and government reach. But they also create
              dependency. If model providers or cloud platforms bundle similar evaluation and governance capabilities
              more aggressively, Snorkel may have to defend its position on depth rather than breadth. Databricks is a
              particularly clear example of a platform vendor moving deeper into AI-app building, querying, evaluation,
              and monitoring. On the customer side, public references skew toward large enterprises, regulated
              industries, and possibly frontier-model accounts, but no public source discloses concentration, renewal,
              or customer-count metrics. That means investors can see blue-chip demand without knowing whether a small
              number of accounts dominate revenue. This concentration ambiguity matters because the very accounts that
              validate Snorkel are also likely to have the strongest bargaining power and the most internal
              alternatives.
