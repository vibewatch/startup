      - number: '7.5'
        title: People, Execution, and Financial-Model Risk
        blocks:
          - type: paragraph
            body: >-
              The open public question is whether Snorkel scales like a software platform with high-value services
              attached, or like a services-enabled AI company with software economics still forming. Its strongest
              references all involve expert knowledge capture, workflow customization, and difficult enterprise
              deployments. That is excellent for customer relevance, but it can translate into long sales cycles, slower
              onboarding, and higher implementation dependence. SWOT-style external analysis and customer cases both
              suggest that the company still has to simplify its message, reduce platform complexity, and accelerate
              time to value. Financially, earlier chapters already established that gross margin, retention,
              concentration, cash, and runway are undisclosed. Those missing metrics turn execution risks into
              underwriting risks because investors cannot tell how much operating leverage exists behind the product
              story. The key execution risk is therefore not simply hiring or competition for AI talent. It is failing
              to make a complex, expert-led platform easier to buy, deploy, and renew before larger ecosystems normalize
              enough of the workflow to narrow the value gap.
