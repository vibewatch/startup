      - number: '7.3'
        title: Operational, Quality, and Model Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Snorkel faces the difficult problem of selling trust. Customer stories, documentation, and
              benchmark pages all emphasize faster iteration, custom evaluation, and measurable improvements, but the
              newest evaluation surfaces are still partly marked beta and public materials do not disclose
              benchmark-to-production conversion rates or failure-frequency baselines. That leaves a gap between
              technical promise and operating certainty. The benchmark-design research itself acknowledges that static
              benchmarks saturate quickly, which means Snorkel has to keep evaluation assets relevant as models improve.
              Customer stories also show a recurring dependence on subject matter experts, rubric design, and manual
              adjudication. Those are strengths when quality matters, but they are operational risks if expert labor
              becomes a bottleneck, costs rise, or output consistency slips across accounts. The strongest mitigation
              visible publicly is that Snorkel is explicit about provenance, human review, and iterative evaluation. The
              missing mitigation is hard evidence that these controls scale predictably across a growing customer base.
