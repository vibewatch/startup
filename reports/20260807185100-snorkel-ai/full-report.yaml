            body: >-
              The public evidence implies a cost structure that is lighter than a hardware or manufacturing business but
              heavier than pure self-serve software. Snorkel's offering requires programmatic workflows, enterprise
              integration, and, increasingly, domain-expert data creation and evaluation. That means gross margin is
              likely shaped by three moving pieces: cloud or platform costs, employee engineering and support, and
              variable expert labor or managed-service delivery. The company argues that programmatic labeling and
              evaluation reduce linear human effort, which should help margins relative to brute-force annotation
              vendors, but it does not disclose how much work is still labor-intensive by product line. Public
              comparable evidence from Appen is useful here. Appen's 2025 annual report and investor materials show a
              business still centered on AI data, model evaluation, and agentic workflows, yet one that reports
              operating revenue, cash, and profitability metrics separately because labor mix and execution matter. That
              does not reveal Snorkel's margins directly, but it does reinforce the basic point: human-data businesses
