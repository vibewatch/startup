      - number: '1.2'
        title: Founders, Leadership, and Governance Transparency
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is one of Snorkel's strongest visible assets. Alexander Ratner's Stanford thesis work
              explicitly targeted the labeling bottleneck that later became Snorkel's commercial product, while
              Christopher Ré remains a Stanford professor embedded in SAIL and CRFM, giving the company academic
              credibility in data-centric AI and systems research. Public materials and secondary profiles also name
              Braden Hancock as a co-founder. The public record is thinner on current governance than on founding
              pedigree: reviewed materials clearly identify the founders and selected leadership hires, but they do not
              publish a full board roster or a comprehensive executive page with current roles, committees, or outside
              directorships. That is manageable for a private company, but it limits diligence on decision rights,
              succession planning, and board-level independence after multiple growth rounds.
