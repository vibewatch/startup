  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Snorkel's relevant market is broader than legacy annotation but narrower than the full generative-AI
              stack. Official Snorkel materials frame the company around specialized training data, expert review,
              evaluation environments, and model refinement, while OpenAI, Scale, Labelbox, Mercor, Arize, and Humane
              Intelligence all show that customers increasingly buy workflows that combine data creation with
              evaluation, monitoring, red teaming, and post-training improvement. That broadening matters because it
              changes what should count as included spend: enterprise budgets for domain-specific data creation,
              human-in-the-loop quality control, benchmark design, red teaming, and model-specific refinement all sit
              inside Snorkel's orbit, while generic cloud inference, foundational model pretraining, and commodity
              software seats mostly sit outside it. The status quo is also fragmented. Buyers can still use internal
              data teams, open-source tools such as CVAT, or workforce-heavy vendors like Appen and Toloka. As a result,
              Snorkel is not selling into one clean category; it is selling into a contested boundary where the most
              valuable deals mix software, expert services, governance, and workflow integration.
