      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              The buyer base that matters to Snorkel is segmented less by model type than by the cost of being wrong.
              Frontier labs and advanced model builders buy data, benchmarks, and evaluation loops to improve model
              capability and safety; large enterprises buy domain-specific training and evaluation because their
              internal data, compliance obligations, and workflow complexity are hard to solve with public models alone;
              and public-sector or defense programs buy auditable human-in-the-loop systems because they need oversight
              and mission fit. Snorkel's own case studies show this spread already: Google represents high-scale model
              improvement, Wayfair and MSKCC represent enterprise and regulated-industry workflows, and DIU represents
              government adoption. Budget ownership usually lives with AI platform leaders, product or transformation
              executives, and in regulated contexts the risk, compliance, or program office that has to approve
              deployment. Adoption normally starts with a workflow-specific proof point, then expands only if the vendor
              can show measurable accuracy, safety, or throughput improvements and integrate with the customer's
              existing stack.
