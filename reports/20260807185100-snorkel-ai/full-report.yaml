      - number: '3.4'
        title: Switching Cost, Distribution Power, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Switching costs are meaningful but not absolute. Once a buyer has embedded domain-specific data pipelines,
              quality rubrics, evaluation datasets, and human review operations into a workflow, replacing the incumbent
              is non-trivial. That favors Snorkel in mature, high-stakes deployments. At the same time, the reviewed
              market is structurally multi-homed because vendors often solve adjacent pieces of the same job. A team can
              use CVAT or internal tooling for raw annotation, Arize or W&B for evaluation, and a managed-service vendor
              for specialist RLHF or red teaming. Distribution power also differs sharply by competitor class. Scale
              stresses cross-cloud enterprise deployment and full-stack operations, Appen stresses global contributor
              scale, CVAT stresses infrastructure control, and Snorkel stresses integration-first enterprise deployment
              with programmatic workflows. Mercor enters from another direction by treating the workflow as enterprise
              agent deployment plus human benchmarking. The consequence is that Snorkel does not face a single
              winner-take-all battle; it faces repeated module-by-module selection pressure, which makes product attach
              rates and workflow breadth central to its moat.
