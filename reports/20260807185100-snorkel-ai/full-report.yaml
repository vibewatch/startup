      - number: '7.6'
        title: Mitigations, Kill Triggers, and Diligence Priority
        blocks:
          - type: paragraph
            body: >-
              Publicly, Snorkel does show credible mitigations. It leans into provenance, human review, custom
              evaluation, deployment flexibility, and partner leverage instead of pretending that enterprise AI can be
              de-risked by model choice alone. Those are sensible defenses. But every mitigation still needs
              measurement. Investors should treat the following as thesis-break triggers until management proves
              otherwise: inability to produce renewal and concentration data; evidence that partner platforms are
              winning the workflow layer directly; delays in satisfying regulated-buyer requirements; failure of
              benchmark gains to hold in production; or deterioration in expert-supply quality and onboarding speed. The
              practical diligence order is clear. First, verify customer durability and concentration. Second, verify
              compliance posture and certification depth. Third, verify implementation repeatability and services mix.
              Fourth, verify whether evaluation-led products are materially improving revenue quality. If those checks
              fail, Snorkel's visible strengths could still coexist with an unattractive risk-adjusted investment
              profile.
