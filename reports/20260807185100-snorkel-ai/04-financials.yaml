- id: public-traction-and-metric-gaps
  title: Public Traction Versus the Missing Underwriting Metrics
  body: 'Public traction evidence is directionally positive but operationally incomplete. The most-cited private-company metric in reviewed sources is FNEX''s 2025 estimate of roughly $148 million ARR and about 776 employees, while public round coverage anchors a $1.3 billion valuation and $100 million Series D. Customer and partner materials show the company is active with large enterprises and government buyers, and Accenture''s release adds named financial-services channel relevance. However, the metrics that matter most for underwriting remain undisclosed: gross margin, services mix, net and gross retention, backlog, top-customer concentration, deferred revenue, cash conversion, and current cash balance. Even the total funding number varies slightly across accessible sources, with some rounding to roughly $235 million and Coverager listing $237 million. None of this makes Snorkel look weak; it simply means the company still has the disclosure pattern of a private venture-backed platform
    rather than a business ready for public-market style financial analysis. The right diligence posture is to separate proof of demand from proof of revenue quality and ask management for the missing second category directly.'
