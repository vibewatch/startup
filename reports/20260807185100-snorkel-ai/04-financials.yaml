- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: 'Snorkel''s capital position is easier to describe than to size precisely. Multiple sources corroborate a $100 million Series D in May 2025 at a reported $1.3 billion valuation, and the company later added an undisclosed strategic investment from Accenture Ventures tied to enterprise go-to-market collaboration. That combination argues against any immediate financing stress, especially because the company is selling into a market that still appears attractive to strategic partners and venture investors. But public capital adequacy remains unproven because there is no disclosed cash balance, monthly burn, runway, or debt schedule in the reviewed sources. The capital-intensity question therefore turns on business mix: if evaluation-led software and recurring platform usage are increasingly dominant, Snorkel may need less external capital than a labor-led data vendor; if expert data services remain a large share, scaling could stay people-intensive and working-capital-hungry. The next-round
    trigger is therefore less about headline demand and more about whether the current platform-plus-expert-data strategy generates durable recurring revenue with acceptable margins and concentration risk.'
  claimRefs:
  - CI017
  - CI018
  - CI022
  - CI023
  - CI024
