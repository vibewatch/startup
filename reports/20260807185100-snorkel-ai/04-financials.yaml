company:
  name: Snorkel AI
chapter:
  number: 4
  title: Financials
  summary: Snorkel AI appears to run a hybrid software-plus-services model built around enterprise platform subscriptions, expert data programs, and evaluation or tuning workflows, but the public record remains too thin for full underwriting. The clearest public financial signals are the May 2025 $100 million Series D at a reported $1.3 billion valuation, secondary ARR estimates near $148 million, and a lack of disclosed gross margin, burn, cash, retention, or concentration metrics, which keeps any verdict on revenue quality and capital adequacy provisional.
sections:
- id: revenue-model-and-monetization
  title: Revenue Model and Monetization Surface
  body: 'Snorkel''s public materials describe a monetization model that is broader than pure annotation software and more software-like than a generic labor marketplace. The company sells Snorkel Enterprise AI and an AI data development platform, but it also explicitly markets expert data, evaluation, and tuning workflows that depend on domain experts and bespoke datasets. That points to at least three revenue layers: software subscriptions or platform access, services or managed-data programs, and workflow-specific evaluation or tuning engagements. Accenture''s 2025 strategic-investment release reinforces this interpretation by describing joint industry solutions that turn enterprise data into AI-ready training and evaluation assets, which sounds more like a solution sale than a simple seat-based SaaS motion. The public weakness is pricing transparency. Snorkel''s pages do not disclose list prices, usage prices, or realized pricing, so the company cannot be modeled as a clean self-serve
    SaaS business from public evidence alone. A realistic view is that revenue is a hybrid of recurring software, implementation, and expert-service programs whose mix likely varies by customer segment and use case.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI013
  - CI014
  - CI026
  tableRefs:
  - TI001
