- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration Visibility
  body: The biggest customer diligence gap is not proof of value but proof of durability. No reviewed public source disclosed Snorkel's customer count, net revenue retention, gross retention, churn, contract length, cohort behavior, or top-customer concentration. Yet several signals point to how the expansion model likely works. Cases in banking, healthcare, defense, and large-enterprise operations imply sticky post-deployment workflows where customer-specific data, expert judgment, and evaluation harnesses create switching costs. Accenture's investment and initial focus on financial services also suggest that Snorkel sees land-and-expand potential through vertical solution partnerships. Still, the public evidence cannot show whether those workflows renew at attractive rates or whether revenue is concentrated in a handful of very large accounts such as Google or other frontier-model builders. The prudent view is that Snorkel's deployments may be sticky, but that stickiness is still a thesis
    rather than a disclosed metric.
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU034
  - CU035
  tableRefs:
  - TU004
  - TU005
- id: channel-partners-and-government-dependence
  title: Channel, Partner, and Government Dependence
  body: 'Snorkel''s customer-access model appears to rely partly on ecosystem leverage. Accenture is now an investor and vertical go-to-market partner in financial services, Carahsoft amplifies federal reach, OpenAI''s directory places Snorkel in multiple regulated industries, and Google Cloud and AWS surface the company inside larger cloud workflows. This is a positive because the most valuable customers often want integrators, cloud standards, and procurement shortcuts. It is also a dependency risk because partner-led expansion can narrow gross margins, slow direct customer ownership, or increase exposure to changes in partner strategy. Government exposure adds another wrinkle: DIU and federal positioning demonstrate credibility, but public procurement timelines can be slow and episodic. Taken together, the customer-acquisition story looks enterprise-native and strategically advantaged, but not fully independent of channel and ecosystem relationships.'
  claimRefs:
  - CU023
  - CU024
  - CU031
  - CU033
  - CU035
  - CU037
  tableRefs:
  - TU006
- id: customer-verdict
  title: Customer Verdict
  body: 'Public customer evidence supports a favorable verdict on relevance and deployment quality. Snorkel has named proof across blue-chip and regulated customers, and many of those cases show specific operational gains instead of vague testimonials. That is hard to fake and meaningful for diligence. The unresolved question is durability: the company has not publicly shown how many customers it has, how concentrated revenue is, how often pilots become multi-year programs, or how frequently those programs expand. Investors should therefore separate two conclusions that are both true today. First, Snorkel clearly solves real customer problems in difficult environments. Second, the public record is still too thin to underwrite customer quality with the same confidence one might have in the product itself.'
  claimRefs:
  - CU001
  - CU002
  - CU028
  - CU029
