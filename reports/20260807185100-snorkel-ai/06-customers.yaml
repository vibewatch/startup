chapter:
  number: 6
  title: Customers
  summary: Snorkel AI has unusually rich named-customer proof for a private enterprise AI vendor, with case studies spanning Google, Wayfair, MSKCC, DIU, Experian, Rox, major banks, telecom, media, and SLB. The adoption story is strongest in large enterprise and regulated workflows, but the public record is still weak on customer counts, retention, expansion rates, and concentration, so deployment quality is clearer than durability.
sections:
- id: customer-segments-and-buyer-map
  title: Customer Segments, Buyers, and Use-Case Map
  body: 'Snorkel''s customer evidence points to a clear pattern: the company is selling primarily to large enterprises, regulated institutions, frontier-model builders, and government teams rather than to self-serve developers or small businesses. The named deployments cut across retail, internet platforms, healthcare, defense, banking, telecommunications, media, and energy, while partner pages and the OpenAI directory add financial services, government, and healthcare as explicit target verticals. The implied buyer is usually a central AI, data science, innovation, operations, or domain-analytics team that has proprietary data and high error costs. That matters because it suggests Snorkel is winning where data quality, evaluation rigor, and domain expertise justify enterprise buying behavior. It also implies a narrower but potentially higher-value customer base than commodity labeling vendors. The downside is that this customer map almost certainly comes with longer sales cycles, heavier
    implementation demands, and higher concentration risk if a few large accounts dominate revenue.'
  claimRefs:
  - CU001
  - CU002
  - CU023
  - CU024
  - CU025
  - CU033
  - CU034
  - CU036
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-outcome-signals
  title: Adoption Trajectory and Outcome Signals
  body: The public adoption evidence is outcome-rich even if it is not denominator-rich. Across the reviewed case studies, Snorkel customers report measurable improvements in model performance, speed, workflow throughput, and quality control. Google cites large-scale classifier development with millions of labels created in minutes and a 52% average performance improvement. Wayfair describes material ecommerce gains from data-centric tagging. Experian claims automated support responses in one to three seconds and higher customer satisfaction. Rox, MSKCC, SLB, banking, telecom, media, and custodial-bank stories all provide concrete before-and-after metrics around accuracy, governance, processing time, or analyst productivity. These are meaningful proof points because they show Snorkel's value is not limited to one industry or one model type. The caveat is that adoption trajectory remains incomplete without customer-count, renewal, and cohort disclosure. Publicly, Snorkel looks like a company
    with strong deployment wins and uneven visibility into how often those wins expand, renew, or concentrate.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
