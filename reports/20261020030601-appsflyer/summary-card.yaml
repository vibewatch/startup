    - >-
      Reconcile the Series E primary and secondary allocation, fully diluted capitalization, liquidation preferences,
      governance rights, fees, and use of proceeds.
    - >-
      Review the final Web SDK forensic report, affected-customer scope, losses, regulator or litigation exposure,
      insurance recovery, remediation testing, and retention cohorts.
    - >-
