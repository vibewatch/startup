company:
  name: AppsFlyer
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    AppsFlyer addresses the measurement and signal-integrity layer between digital
    marketing spend and business outcomes, with a core in mobile attribution and
    adjacencies across web, CTV, gaming, deep linking, fraud protection, and
    governed AI inputs. Available evidence shows broad adoption and very large
    measured-event datasets, but it does not disclose category spend, pricing, or
    customer-level revenue, so no defensible TAM, SAM, or SOM can be isolated.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable category is narrower than digital advertising and broader
      than install attribution alone. At its core, AppsFlyer links campaigns,
      partners, and channels to app installs and post-install events so marketers
      can assess user-acquisition and retargeting performance. The company now
      positions that measurement layer across mobile, web, CTV, PC, and console,
      with deep linking, fraud filtering, data collaboration, and governed signal
      infrastructure as adjacent workflows. Included spend is therefore software
      and data infrastructure used to measure, route, validate, and optimize
      marketing outcomes; ad inventory, creative production, general-purpose
      cybersecurity, CRM, and cloud compute remain outside the boundary. Native
      ad-platform dashboards, internal analytics, and manual reconciliation are
      status-quo substitutes rather than additional market segments. This boundary
      matters because counting media spend or the full martech stack as AppsFlyer's
      addressable market would materially overstate its commercial opportunity.
    claimRefs: [CM001, CM002, CM015]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The assigned evidence provides scale proxies, not a spend-denominated market
      size. AppsFlyer says it is trusted by 15,000 brands, while a secondary
      synthesis reports an ecosystem of more than 10,000 technology partners. Its
      2025 Performance Index reportedly covered 16.2 billion installs from more
      than 39,000 apps, 9.6 billion remarketing conversions, and 88 media sources.
      A separate company fraud study analyzed more than 100 billion installs
      across more than 246,000 apps. These figures demonstrate a large observable
      activity surface, but the populations, periods, and denominators differ and
      cannot be stacked into TAM, SAM, or SOM. None of the retained sources
      discloses category revenue, customer ACV distribution, eligible advertiser
      spend, penetration, or a consistent CAGR. The sizing conclusion is therefore
      deliberately constrained: demand appears broad and data-intensive, while
      the monetary opportunity remains an underwriting gap.
    claimRefs: [CM003, CM004, CM005, CM006, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The economic buyer is most plausibly the leader accountable for growth,
      performance marketing, or marketing analytics; daily users include
      acquisition managers, analysts, lifecycle teams, and agency operators, while
      the advertiser generally pays. This role mapping is an inference from the
      documented workflow rather than disclosed procurement data. WMTips' archived
      detected-site sample indicates use across online shopping, finance and
      banking, business, marketing and merchandising, travel, and software and
      hardware, with the United States representing 31% of observed sites. Adoption
      should begin when multi-channel spend makes campaign-to-outcome reconciliation
      valuable, then deepen through SDK or API integration, postbacks, deep links,
      fraud controls, and cross-platform reporting. Agencies and multi-brand
      enterprises add account governance requirements. Security, privacy, finance,
      and procurement stakeholders can veto deployment even when marketing owns
      the budget, especially where third-party JavaScript reaches transaction or
      authentication flows.
    claimRefs: [CM008, CM009, CM011, CM012]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      The durable demand driver is measurement complexity: more channels, privacy
      constraints, fraud, and AI-based optimization increase the value of
      standardized and auditable signals. AppsFlyer's 2025 fraud study says fraud
      rates were broadly flat while absolute fraudulent-install volume rose as
      marketing investment grew, illustrating why clean measurement can remain
      valuable even without a rising fraud rate. The counterweight is trust and
      switching risk. Independent security vendors reported that the AppsFlyer Web
      SDK was compromised from March 9 to March 11, 2026, allowing malicious code
      to propagate through a trusted dependency. That event does not establish
      customer losses or churn, but it makes vendor-risk review, script integrity,
      remediation evidence, and contractual assurance more important in adoption
      timing. Valuation should therefore reward data scale and workflow breadth
      only after diligence establishes monetization, retention, security recovery,
      and the portion of observed activity that converts into addressable recurring
      software revenue.
    claimRefs: [CM007, CM013, CM014, CM016]
tables:
  - id: TM001
    title: Market definition and boundary
    columns:
      - Segment or category
      - Included spend or workflow
      - Excluded spend or substitute
      - Buyer or payer
      - Relevance to AppsFlyer
    rows:
      - - Mobile app attribution
        - Campaign-to-install and post-install measurement for acquisition and retargeting
        - Media inventory, creative production, and app-store fees
        - Growth or performance-marketing leader; advertiser pays
        - Core category and clearest budget anchor
      - - Cross-platform measurement
        - Measurement and postbacks across mobile, web, CTV, PC, and console
        - Full CRM, CDP, ad buying, and general business intelligence
        - Marketing analytics or digital-growth leader
        - Expands wallet share beyond mobile without equaling the whole martech stack
      - - Deep linking
        - Routing users from web, email, social, QR, referral, or SMS into relevant app content
        - Website or app development and messaging transport
        - Lifecycle, product-growth, or engagement team
        - Adjacent conversion workflow that can reinforce measurement adoption
      - - Fraud and signal integrity
        - Filtering suspicious installs and activity before optimization
        - Enterprise cybersecurity, endpoint protection, and broad vendor-risk platforms
        - Marketing operations with security and finance oversight
        - Protects the quality of measured outcomes and marketing ROI
      - - Data collaboration and AI signal governance
        - Standardized, consent-aware, traceable marketing signals for analytics and optimization
        - General-purpose AI models, cloud compute, and enterprise data warehouses
        - Marketing-data or analytics leader
        - New adjacency whose monetization is not disclosed
      - - Status quo and internal build
        - Native platform dashboards, internal pipelines, spreadsheets, and manual reconciliation
        - Not an additional spend pool
        - Marketing, finance, or data-engineering owner
        - Substitute set that can delay purchase or limit expansion
    notes: >-
      Boundary is based on AppsFlyer's documented workflows; substitute categories
      and budget ownership are analyst inferences because retained sources do not
      disclose procurement records or category-level spend.
    claimRefs: [CM001, CM002, CM011, CM015]
