callouts:
  - calloutType: risk
    title: Scale is visible; monetizable market size is not
    body: >-
      Event volume, app coverage, brand count, and detected-site mix demonstrate
      activity but cannot substitute for market revenue, pricing, retention, or
      customer-level spend. Underwriting should keep TAM/SAM/SOM open until those
      denominators are obtained.
    claimRefs: [CM003, CM005, CM006, CM016]
  - calloutType: insight
    title: Trust is part of the buying path
    body: >-
      The March 2026 Web SDK compromise makes security remediation and third-party
      script controls part of procurement diligence, particularly for finance,
      commerce, and other workflows that handle sensitive transactions.
    claimRefs: [CM013, CM014]
