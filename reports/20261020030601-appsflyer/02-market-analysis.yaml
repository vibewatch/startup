  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Economic buyer
      - Primary user
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - App-led consumer businesses
        - VP Growth or performance-marketing leader
        - User-acquisition and analytics teams
        - Advertiser
        - Attribute installs and post-install events; optimize acquisition and retargeting
        - Growth or performance marketing
        - Multi-channel spend and need for campaign-level ROI
      - - Online shopping and retail
        - E-commerce or digital-growth leader
        - Lifecycle and marketing analysts
        - Retailer or marketplace
        - Connect web-to-app journeys, deep links, purchases, and campaign outcomes
        - Digital commerce or growth
        - Cross-device journeys and conversion leakage
      - - Finance and banking
        - Digital-acquisition or marketing leader
        - Growth analysts with risk and compliance reviewers
        - Financial institution
        - Measure acquisition while filtering invalid activity
        - Marketing, subject to risk approval
        - High acquisition cost, fraud exposure, and auditability needs
      - - Gaming and cross-platform media
        - Studio growth or publishing leader
        - User-acquisition and monetization teams
        - Developer or publisher
        - Compare media sources across app, PC, console, and remarketing
        - User acquisition
        - High-volume paid installs and cross-platform player journeys
      - - Agencies and multi-brand operators
        - Agency analytics or client-services leader
        - Account teams and analysts
        - Client advertiser or agency under contract
        - Switch among advertiser accounts and standardize reporting
        - Client marketing budgets
        - Need for role, account, and measurement governance
      - - Security and compliance gatekeepers
        - CISO, privacy, procurement, or vendor-risk owner
        - Security and compliance teams
        - Enterprise as approval stakeholder
        - Review SDK reach, script integrity, consent, and remediation controls
        - Security or compliance review rather than core product budget
        - Third-party code exposure or a material trust event
