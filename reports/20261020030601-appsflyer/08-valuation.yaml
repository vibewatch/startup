    title: "Price-sensitive conclusion"
    body: >-
      Track AppsFlyer and seek private diligence. A conditional investment case
      may exist at or below the reported $2.7 billion post-money reference, but
      public evidence does not yet support a buy recommendation, target return,
      or premium valuation.
    claimRefs:
