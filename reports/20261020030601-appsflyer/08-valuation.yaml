slug: "appsflyer"
runDate: "2026-10-20"
company:
  name: "AppsFlyer"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    AppsFlyer's reported June 2026 financing establishes a $2.7 billion
    post-money reference, but public evidence does not disclose audited
    financials, round structure, preference terms, or enough independent
    comparables to validate that price. The resulting recommendation is to
    track and underwrite further rather than buy on headline scale alone.
sections:
  - id: "investment-view"
    title: "Investment view: scale is credible, price support is incomplete"
    body: >-
      The investable case rests on a large operating footprint and a product
      positioned at the measurement layer between advertisers and major
      platforms. AppsFlyer says 15,000 brands use its platform, while Forbes
      reported the same brand count and more than 100,000 apps in September
      2025. That scale, plus strategic minority investment from Moloco, Google,
      Meta, and Unity, supports the view that the asset is relevant
      infrastructure. The anti-thesis is equally material: financial
      disclosure is unaudited and sparse, approximately 100 layoffs preceded
      the latest financing, and the March 2026 Web SDK compromise creates a
      trust and retention risk that public sources do not quantify. The
      recommendation is therefore track/research-more, with medium-low
      confidence and high risk, not a price-independent endorsement.
    claimRefs:
      - "CV003"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV001"
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "financing-and-entry"
    title: "Financing reference and entry discipline"
    body: >-
      Crunchbase reported more than $1 billion of Series E financing at a $2.7
      billion post-money valuation, and also reported $1.3 billion of known
      funding since inception. Those figures establish a market-clearing
      headline, not cash available to the company: the assigned evidence does
      not disclose how much was primary versus secondary, debt, fees, or
      preference overhang. GetLatka's $500 million ARR indication would imply
      a 5.4x post-money valuation-to-ARR ratio, but its page attributes that ARR
      to another publisher while saying the underlying source was not recorded.
      The multiple is consequently a screening reference rather than an
      underwriting conclusion. Entry above $2.7 billion is unsupported without
      audited ARR, growth, retention, margin, cash, and security-remediation
      evidence; even entry at that benchmark should remain conditional.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV008"
  - id: "scenarios-and-comparables"
    title: "Scenario framing and comparable evidence"
    body: >-
      The available comparable set is directionally useful but insufficient
      for a precise valuation range. GetLatka identifies Branch, Singular,
      Kochava, Tenjin, and Flurry Analytics as competitors and reports
      AppsFlyer as the largest by revenue, while Forbes supplied a prior $2
      billion company-value marker from September 2025. Neither source provides
      audited peer growth, margins, retention, enterprise values, transaction
      terms, or a public-company bridge. Accordingly, the scenarios use $2.7
      billion as the latest reported financing reference and make the premium
      or discount conditional on observable evidence. No numeric probability,
      target IRR, or defensible exit range can be assigned from the public
      inputs; doing so would turn missing private-company data into false
      precision.
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV015"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit readiness, diligence asks, and thesis breakers"
    body: >-
      Management has signaled public-market intent: Oren Kaniel told Axios,
      according to Crunchbase, that AppsFlyer was eyeing public markets and
      called the financing a step on that path. Strategic platform investors
      could improve commercial alignment, but they also sharpen the diligence
      question around independence from advertising counterparties. Before an
      investment, request audited financial statements, ARR and revenue
      bridges, NRR and GRR, customer concentration, cap-table and preference
      waterfalls, primary/secondary allocation, cash and debt, and a
      board-reviewed incident report. Thesis breakers are verified material
      churn after the SDK event, unresolved control deficiencies, ARR
      materially below the reported $500 million indication, or financing
      terms that place new money behind a preference stack inconsistent with
      the target return. A hold period and exit return should be set only after
      these private inputs are obtained.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV015"
      - "CV016"
