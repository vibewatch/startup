    title: "Recommendation summary"
    columns:
      - "Decision item"
      - "Assessment"
      - "Decision implication"
    rows:
      - ["Recommendation", "Track / research more", "Do not make a buy decision from the reported financing headline alone."]
      - ["Confidence", "Medium-low", "The financing reference is recent, but core financial and transaction inputs are not audited or disclosed."]
      - ["Risk rating", "High", "Security trust, platform dependence, disclosure opacity, and private-market liquidity all require a larger evidence margin."]
      - ["Valuation stance", "Fair-to-full only if the $500M ARR indication is verified", "Treat the implied 5.4x valuation-to-ARR ratio as a screening reference, not an enterprise-value multiple."]
      - ["Entry discipline", "At or below the $2.7B post-money reference, subject to diligence", "Require audited operating metrics, round terms, and incident closure before setting return or exit targets."]
    notes: >-
      Assessments use the reported June 2026 post-money valuation and a
      third-party ARR indication; cash, debt, primary/secondary mix, and
      preference terms are unavailable.
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV015"
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns:
      - "Side"
      - "Argument"
      - "What would change the view"
    rows:
      - ["Thesis", "A 15,000-brand footprint and broad cross-channel product surface suggest durable measurement relevance.", "Audited retention, cohort expansion, and customer concentration would determine whether footprint converts into durable economics."]
      - ["Thesis", "A strategic Series E involving major advertising platforms and a stated public-market path create financing and exit optionality.", "Governance rights, commercial commitments, and a credible IPO-readiness plan would strengthen this signal."]
      - ["Anti-thesis", "The public ARR input is second-hand, and layoffs framed around AI investment leave profitability and organic growth unclear.", "Audited revenue, ARR bridge, margins, cash flow, and hiring plan could resolve the ambiguity."]
      - ["Anti-thesis", "The March 2026 Web SDK compromise may create trust, remediation, liability, or retention costs not visible in public metrics.", "Independent forensic closure, customer-retention evidence, insurance coverage, and control testing would narrow the risk."]
    notes: >-
      This is a selective thesis test, not an exhaustive risk register; company
      scale claims are separated from independent financing and incident
      reporting.
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV015"
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns:
      - "Case"
      - "Operating assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Audited ARR meets or exceeds the $500M indication, growth and retention are durable, margins support IPO readiness, and the SDK investigation closes without material churn.", "A premium to $2.7B could become supportable only after audited growth, cash-flow, and governance evidence; no numeric upper bound is supportable today.", "Platform shifts, competitive pricing, and security-control execution.", "Audited filings or investor materials showing sustained growth, NRR, margins, and completed remediation."]
      - ["Base", "The 15,000-brand footprint holds, ARR is near the third-party indication, and the company remains private while disclosure gaps persist.", "Cap entry near or below the reported $2.7B post-money reference; the 5.4x headline valuation-to-ARR ratio is provisional and not an enterprise-value multiple.", "Opaque round structure, slower growth, concentration, and an extended exit window.", "Consistent audited ARR plus stable post-incident retention, but no near-term public filing."]
      - ["Bear", "ARR is materially below or less durable than indicated, security fallout causes churn or liability, or financing preferences impair common-equity value.", "Require a material discount to $2.7B or pass; downside cannot be quantified without the preference waterfall and audited balance sheet.", "Down round, delayed IPO, customer loss, regulatory action, and preference overhang.", "Churn, unresolved forensic findings, weak cash conversion, or a financing structure dominated by secondary liquidity."]
    notes: >-
      Scenarios are conditional frameworks rather than forecasts; no numeric
      probabilities, target returns, or exit values are assigned because
      audited operating data and transaction terms are unavailable.
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV011"
      - "CV015"
figures:
  - id: "FV001"
    title: "Recommendation logic from scale to entry decision"
    type: "flow"
    summary: >-
      An ordered decision chain separates the latest financing reference from
      the evidence still required for an investment.
    data:
      nodes:
        - id: "scale"
          label: "Scale proof"
          detail: "15,000 brands claimed by AppsFlyer and reported by Forbes."
        - id: "financing"
          label: "Market reference"
          detail: "More than $1B Series E at a reported $2.7B post-money valuation."
        - id: "multiple"
          label: "Screening multiple"
          detail: "5.4x valuation-to-ARR using a $500M third-party ARR indication."
        - id: "risk"
          label: "Risk adjustment"
          detail: "March 2026 Web SDK compromise and unquantified customer impact."
        - id: "gaps"
          label: "Evidence gap"
          detail: "No audited financials, round allocation, debt, or preference waterfall."
        - id: "decision"
          label: "Decision"
          detail: "Track; invest only after private diligence and disciplined pricing."
    approximationNotes: >-
      The 5.4x figure divides reported post-money valuation by an unaudited
      third-party ARR indication and is not an enterprise-value multiple.
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV011"
      - "CV015"
      - "CV016"
callouts:
