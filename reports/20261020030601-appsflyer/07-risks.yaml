callouts:
  - calloutType: "risk"
    title: "Primary thesis-break trigger"
    body: >-
      A repeat compromise of customer-delivered code, evidence that material customer losses were
      concealed, or regulatory action restricting core attribution data flows would break the
      trust and platform-access assumptions supporting the investment case.
    claimRefs: ["CR001", "CR002", "CR005", "CR006"]
  - calloutType: "recommendation"
    title: "Required pre-investment evidence"
    body: >-
      Require the final forensic report, affected-customer and claim enumeration, independent
      control testing, audited financials, cyber-insurance details, and revenue sensitivity to
      Apple and Google measurement changes before treating residual exposure as bounded.
    claimRefs: ["CR002", "CR003", "CR006", "CR007", "CR008", "CR014"]
