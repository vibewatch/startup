company:
  name: "AppsFlyer"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    AppsFlyer's highest-evidence risk is the March 2026 Web SDK supply-chain compromise, which
    created direct downstream exposure and left the public forensic, customer-impact, and
    regulatory close-out incomplete. Structural dependence on Apple, Google, ad networks, and
    privacy rules compounds the incident risk, while private-company financial disclosure limits
    the ability to price residual exposure.
sections:
  - id: "incident-and-legal-exposure"
    title: "Incident and legal exposure"
    body: >-
      The clearest high-impact risk is the March 9-11, 2026 compromise of the AppsFlyer Web SDK.
      Rescana reports that malicious JavaScript was injected through the trusted distribution
      path and targeted cryptocurrency wallet addresses on downstream sites; it also reports that
      AppsFlyer remediated the issue and began an ongoing forensic investigation. Rescana found no
      evidence that the Mobile SDK or backend customer data was affected, but that statement is
      not equivalent to a completed forensic attestation or proof that no customer suffered loss.
      The residual legal and regulatory risk therefore turns on evidence not present in the public
      pool: affected-customer enumeration, regulator notices, claims or litigation, root-cause
      closure, and independent validation of remediation. Privacy and consent exposure is broader
      than this incident because device-ID matching on iOS requires ATT consent and the underlying
      ecosystem applies different attribution rules. The register treats severity as an analyst
      assessment tied to those facts, not as a disclosed probability.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR005"]
    tableRefs: ["TR001"]
  - id: "operational-and-model-risk"
    title: "Operational, security, and model risk"
    body: >-
      AppsFlyer's operating model places trusted measurement code and attribution logic inside a
      complex chain spanning customer properties, AppsFlyer infrastructure, app stores, operating
      systems, ad networks, and consent controls. The 2026 incident demonstrates that a compromise
      in one distribution dependency can preserve normal analytics behavior while introducing a
      harmful payload, making detection and blast-radius assessment difficult. Separately,
      AppsFlyer's own documentation says ecosystem participants count installs and events
      differently; customers therefore face reconciliation risk even without a security failure.
      Official claims of traceable lineage, fraud filtering, auditability, and optional
      administrator-configured 2FA are relevant controls, but the pool does not establish that
      browser integrity protections, self-hosting, or comparable controls were universally
      implemented after the incident. The heatmap ranks residual exposure qualitatively; public
      evidence does not provide incident-frequency or loss-probability data.
    claimRefs: ["CR001", "CR004", "CR010", "CR011", "CR013", "CR014", "CR016"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "platform-partner-and-financial-dependencies"
    title: "Platform, partner, and financial dependencies"
    body: >-
      Apple and Google are both indispensable inputs and potential substitutes. Sacra identifies
      privacy restrictions and platform-native attribution as risks that can reduce observability
      or disintermediate third-party measurement, while AppsFlyer's documentation confirms that
      attribution relies on app stores, self-reporting networks, identifiers, referrers, and
      platform-defined methods. The company is also broadening across mobile, web, CTV, PC, and
      console, increasing the number of frameworks and integration surfaces that must remain
      reliable. Execution risk is visible in Forbes' report that roughly 100 employees were laid
      off in February 2025 while investment shifted toward AI. Financial resilience cannot be
      independently stress-tested from this pool: FirmSuggest notes that detailed disclosures are
      limited because AppsFlyer is private, and Sacra's 2025 revenue figure is a model rather than
      audited company reporting. These constraints make concentration, gross-margin sensitivity,
      contractual liability, and insurance coverage priority diligence items.
    claimRefs: ["CR004", "CR005", "CR006", "CR007", "CR008", "CR009", "CR013"]
    tableRefs: ["TR003"]
  - id: "mitigations-monitors-and-kill-criteria"
    title: "Mitigations, monitors, and thesis-break criteria"
    body: >-
      The immediate mitigation standard should be evidence-based rather than policy-based.
      Rescana recommends reviewing logs from the incident window, using known-good or self-hosted
      SDK builds where feasible, applying Subresource Integrity, and monitoring third-party asset
      changes. AppsFlyer publicly describes governed signals and publishes DMA and Privacy Sandbox
      resources, while UpGuard says it continuously runs more than 330 external checks; however,
      the fetched public UpGuard page withholds the underlying rating and findings. Investors
      should require the final forensic report, customer-notification scope, control test results,
      cyber-insurance limits, and evidence that critical browser-delivered assets are integrity
      controlled. Monitor regulator or court activity, recurrence of unauthorized SDK changes,
      attribution accuracy by method, platform API restrictions, support complaints, and gross
      retention after the incident. Thesis-break triggers are a material recurrence, evidence of
      concealed customer losses, regulatory action that restricts core data flows, or platform
      changes that make independent attribution uneconomic.
    claimRefs: ["CR002", "CR011", "CR012", "CR014", "CR015", "CR016"]
