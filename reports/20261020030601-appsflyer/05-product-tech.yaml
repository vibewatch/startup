    title: Product module / asset matrix
    columns:
      - Module or product surface
      - Primary user
      - Public maturity signal
      - Differentiation indicated by evidence
      - Diligence gap
    rows:
      - ["Measurement and attribution", "Growth and user-acquisition teams", "Documented across installs, re-engagement, and post-install events", "Multiple deterministic and probabilistic attribution methods", "No independent accuracy or latency benchmark"]
      - ["Analytics and raw data / APIs", "Marketing analysts and data teams", "Included in external platform description and current company positioning", "Connects measured signals to downstream analysis", "No public data-volume, retention, or API-SLA disclosure"]
      - ["Deep linking and engagement", "Lifecycle and product marketers", "Company describes routing from web, email, social, QR, referral, and SMS", "Links campaign context to specific in-app destinations", "No independent conversion-lift study in the assigned evidence"]
      - ["Fraud protection", "Performance marketing and risk teams", "Company describes real-time blocking and fraud-filtered signals", "Clean-signal claim is integrated with measurement workflows", "Detection efficacy, false-positive rate, and audit results are undisclosed"]
      - ["Partner, data-collaboration, and AI surfaces", "Marketing operations and ecosystem partners", "Partner marketplace is described externally; MCP launch was reported by Forbes", "Broadens the platform beyond dashboard attribution", "Attach rates, production usage, and roadmap commitments are undisclosed"]
    notes: "Statuses reflect public documentation and third-party descriptions through the access date; they do not establish module adoption, performance, or availability under customer contracts."
    claimRefs: [CE001, CE006, CE008, CE009, CE014, CE016]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Prior workflow problem
      - AppsFlyer solution
      - Measurable benefit disclosed
      - Limitation
    rows:
      - ["Attribute app acquisition", "Campaign touchpoints and app-store activity use different clocks and rules", "Apply documented attribution methods and lookback windows", "No independently verified improvement was disclosed", "Results depend on platform, network, consent, and configured rules"]
      - ["Optimize retargeting", "Re-engagement and reinstall behavior can be separated from initial acquisition", "Record re-engagement and re-attribution within defined windows", "No public incremental-lift denominator was disclosed", "Single-source attribution does not make every assist causal"]
      - ["Route users into relevant app content", "Campaign links can break across channels, devices, or install states", "Use deep links from email, web, social, QR, referral, or SMS", "Company claims contextual routing, not a quantified independent outcome", "Implementation quality and platform policy remain dependencies"]
      - ["Protect optimization signals", "Bots and fake installs can corrupt campaign decisions", "Filter suspicious activity and standardize signals before analysis", "Company cites customer outcome examples, but no common benchmark", "Public evidence omits false-positive and false-negative rates"]
    notes: "The benefit column distinguishes disclosed mechanism from independently measured impact; absence of a number is an evidence gap, not a zero."
    claimRefs: [CE002, CE003, CE007, CE008, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer or process
      - Role
      - Key dependency
      - Technical risk
    rows:
      - ["Touchpoint and signal collection", "Capture clicks, impressions, referrers, IDs, deep links, and app events", "SDKs, links, ad networks, app stores, device identifiers, and consent", "Platform-policy change or integration error can remove or distort signals"]
      - ["Attribution decision engine", "Select the credited source under method priority and lookback rules", "Consistent timestamps, partner metadata, and configuration", "Different ecosystem participants count installs and events differently"]
      - ["Privacy-preserving aggregate path", "Estimate campaign performance without unique IDs", "Statistical inputs and model governance", "No public validation, error bounds, or drift metrics in retained evidence"]
      - ["Reporting and optimization outputs", "Provide reports, raw data, APIs, and network postbacks", "Data pipelines and partner interfaces", "No public latency, uptime, RPO, RTO, or API service-level evidence"]
      - ["Identity and account controls", "Gate account access and switching", "SSO, 2FA, role design, and email verification", "Control presence does not prove effective configuration or independent assurance"]
      - ["Web SDK delivery", "Load measurement code into customer web properties", "Trusted distribution domain and downstream script loading", "The March 2026 compromise demonstrates supply-chain blast-radius risk"]
    notes: "Architecture is a logical reconstruction from public product documentation, not a representation of AppsFlyer's undisclosed internal infrastructure."
    claimRefs: [CE003, CE004, CE005, CE007, CE010, CE012]
