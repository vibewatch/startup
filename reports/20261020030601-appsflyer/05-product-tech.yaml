    approximationNotes: "The ordering is inferred from documented interfaces and attribution behavior; internal services, data stores, and control boundaries are not public."
    claimRefs: [CE006, CE011]
callouts:
  - calloutType: strength
    title: Inspectable attribution rules
    body: >-
      AppsFlyer's public documentation explains method priority, lookback logic, supported
      signal paths, and the boundary between deterministic and probabilistic approaches,
      giving diligence a more concrete starting point than generic product marketing.
    claimRefs: [CE003, CE004, CE005]
  - calloutType: risk
    title: Web SDK distribution is a material trust dependency
    body: >-
      The reported March 2026 compromise shows that a trusted client-side delivery path can
      become an attack vector even while legitimate analytics functionality appears normal.
      Independent forensic closure and customer-impact evidence remain necessary.
    claimRefs: [CE012, CE013]
