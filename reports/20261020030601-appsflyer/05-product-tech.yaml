schemaVersion: "report-v2"
artifact: product-tech
slug: appsflyer
runDate: 2026-10-20
company:
  name: AppsFlyer
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    AppsFlyer presents a broad measurement platform spanning attribution, deep linking,
    fraud controls, analytics, APIs, and cross-platform signal governance, with unusually
    detailed public documentation of attribution logic. The public record is much thinner
    on internal architecture, service levels, independent technical benchmarks, and the
    forensic close-out of the March 2026 Web SDK compromise.
sections:
  - id: product-surface-and-workflow
    title: Product surface and customer workflow
    body: >-
      AppsFlyer sits between marketing touchpoints, digital properties, advertising
      networks, and a marketer's decision process. Its core job is to determine which
      campaign, partner, or channel preceded an install or post-install event, then expose
      the result for acquisition and retargeting optimization. Public product descriptions
      extend that foundation into analytics, deep linking, fraud protection, raw data and
      APIs, audience tooling, and a partner marketplace. The resulting suite is broader
      than a single mobile attribution dashboard: the company now positions it across app,
      web, CTV, PC, and console. However, the evidence establishes available surfaces, not
      adoption or performance for every module, and no public source in the assigned pool
      discloses module-level usage, attach rates, or realized customer outcomes.
    claimRefs: [CE001, CE002, CE006, CE008, CE014]
    tableRefs: [TE001, TE002]
  - id: attribution-and-operating-architecture
    title: Attribution and operating architecture
    body: >-
      The strongest technical evidence is AppsFlyer's own attribution documentation. It
      describes deterministic inputs such as install referrers, device-ID matching, preload
      records, platform frameworks, and deep links alongside probabilistic modeling. The
      decision rules prioritize clicks over impressions and deterministic evidence over
      probabilistic evidence when valid engagements overlap. Device-ID matching depends on
      identifiers supplied through networks and the SDK and, on iOS, ATT consent. The
      probabilistic path is described as aggregate reporting that does not identify an
      individual device or user. These disclosures make the logical measurement pipeline
      inspectable, but they do not disclose the underlying storage topology, model
      validation, latency, regional processing boundaries, capacity, or failover design.
    claimRefs: [CE003, CE004, CE005, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-integration-and-differentiation
    title: Maturity, integration, and differentiation
    body: >-
      Product maturity is visible through a substantial support surface and coverage of
      multiple attribution methods, platforms, account modes, and marketing use cases.
      Forbes reported that the platform worked with more than 100,000 apps from 15,000
      brands as of September 2025 and that AppsFlyer had launched an MCP connection between
      its APIs and large language models. The company also publishes topical guidance
      spanning privacy regulation, gaming, app marketing, app-store optimization, and CTV.
      Differentiation therefore appears to rest on breadth of integrations and signals,
      explicit attribution rules, fraud filtering, and workflow reach rather than a
      publicly benchmarked algorithmic advantage. No retained source provides SDK release
      cadence, public repository activity, uptime history, comparative accuracy, or a
      committed roadmap, so those dimensions remain diligence asks rather than verified
      strengths.
    claimRefs: [CE003, CE006, CE009, CE015, CE016]
  - id: trust-security-and-technical-risk
    title: Trust, security, and technical risk
    body: >-
      AppsFlyer's trust proposition combines privacy-aware measurement, signal lineage,
      fraud filtering, auditability, and account controls such as SSO, 2FA, roles, and
      verification when switching advertiser accounts. Those are useful control-plane
      indicators, but they are company descriptions rather than independent control tests.
      The principal contrary evidence is Rescana's report that the Web SDK distribution was
      compromised from March 9 to March 11, 2026 and served crypto-stealing JavaScript
      through a trusted delivery path. Rescana also stated that no evidence had emerged, at
      the time of its report, that the Mobile SDK or backend customer data was affected;
      that statement is bounded and is not proof of absence. The incident turns software
      supply-chain integrity, customer notification, forensic closure, SRI support, and
      third-party assurance into material diligence items.
    claimRefs: [CE007, CE010, CE012, CE013]
tables:
