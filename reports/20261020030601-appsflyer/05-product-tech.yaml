  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: platform-reliability
      missingEvidence: "Customer-contract SLAs, uptime history, incident metrics, latency percentiles, capacity limits, regional failover design, RPO, and RTO."
      whyItMatters: "Public feature breadth cannot establish production reliability or the operational cost of depending on AppsFlyer for measurement."
      diligencePath: "Request twelve months of status history, SLA attainment, severity-one postmortems, architecture diagrams, and regional resilience test results."
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: "Public SDK repository activity, signed release cadence, package-download metrics, contributor history, or an equivalent practitioner-community signal."
      whyItMatters: "The assigned evidence does not independently show integration health, release discipline, or developer adoption."
      diligencePath: "Review official SDK repositories and package registries, reconcile release tags to supported versions, and interview integration partners."
    - type: private-evidence-only
      severity: material
      topic: web-sdk-incident
      missingEvidence: "Final independent forensic report, confirmed blast radius, customer notification record, remediation validation, and post-incident retention or claims data."
      whyItMatters: "The incident directly tests the integrity of a trusted distribution path, while the retained adverse source describes an investigation that was still ongoing."
      diligencePath: "Obtain the final forensic report, affected-customer list, insurer and legal notices, corrective-action evidence, and independent retest."
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: "Current certification scope, penetration-test summary, secure-SDLC evidence, key-management design, data-residency map, and independent control exceptions."
      whyItMatters: "Company-described privacy and security controls do not establish operating effectiveness or scope."
      diligencePath: "Review current SOC and ISO reports under NDA, map sub-processors and regions, and sample control exceptions through remediation."
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: minor
      topic: product-roadmap
      missingEvidence: "A committed roadmap with target dates, availability status, deprecation policy, and customer adoption by module."
      whyItMatters: "Public support and launch material does not distinguish experiments, generally available products, and durable roadmap commitments."
      diligencePath: "Request the product roadmap, release calendar, deprecation log, module-level usage, and design-partner conversion data."
