  topStrengths:
    - 据报道，AppsFlyer 覆盖 15,000 个品牌，产品横跨多个渠道，足以支撑其作为营销测量基础设施的行业地位。
    - Moloco、Google、Meta 和 Unity 的少数股权投资验证了市场对其战略价值的兴趣；AppsFlyer 表示，这些安排仍不构成控制权，也不具排他性。
    - 产品覆盖归因、深度链接、反欺诈、分析和数据协作，为未来扩张留下了多个潜在切入口。
  topRisks:
    - 2026 年 3 月 Web SDK 供应链遭入侵后，尚无公开的独立取证结论、量化客户影响或事件后留存证据。
    - Apple、Google、隐私规则、网络 API 以及平台原生归因都可能减少信号可用性，或让独立测量被平台绕开。
    - 经审计的收入、ARR、增长、利润率、留存、现金、客户集中度和融资优先权条款均不可得。
  unresolvedGaps:
    - 获取经审计的财务报表、ARR 和收入桥接表、毛利率、NRR、GRR、流失率、现金流、现金、债务及客户集中度明细。
    - 核对 E 轮融资的原始发行与老股转让分配、完全摊薄后的资本结构、清算优先权、治理权利、费用及资金用途。
    - 审阅 Web SDK 最终取证报告、受影响客户范围、损失、监管或诉讼风险、保险赔付、补救测试及留存 cohort。
    - 建立标准化可比公司集合，并在把据报道的 $2.7 billion 估值作为入场基准前，核实二手来源所称的 $500 million ARR。
