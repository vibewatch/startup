company:
  name: "AppsFlyer"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    AppsFlyer competes in a dense attribution market, but its company-claimed
    cross-platform breadth, a Forbes-reported 60% market share as of September
    2025, and substantially greater disclosed funding than named private peers
    indicate a scale advantage. The moat is not absolute: Adjust overlaps in
    attribution and anti-fraud, Branch specializes in deep linking, internal
    build remains possible, and comparable competitor pricing and verified
    switching outcomes are not public in the assigned evidence.
sections:
  - id: "landscape-and-scale"
    title: "Landscape and scale"
    body: >-
      The competitive set is broader than a two-vendor mobile-attribution
      comparison. Tracxn classifies 452 active competitors, including 30 funded
      companies, and names Singular, Branch, and InMarket as leading peers; its
      ranked list also includes acquired incumbent Adjust and smaller specialist
      Tenjin. Toolradar reports that visitors most often compare AppsFlyer with
      Adjust, supporting Adjust as the clearest direct buying alternative in the
      available evidence. AppsFlyer nevertheless appears unusually well
      resourced: Tracxn reports $1.3 billion of total funding, versus $667
      million for Branch, $256 million for Adjust, $50 million for Singular, and
      $2.5 million for Tenjin. Forbes separately reported a 60% market share as
      of September 2025. Those figures indicate scale, not current win rates,
      retention, or product superiority, and the market-share estimate has not
      been independently refreshed for the October 2026 run date.
    claimRefs: ["CP004", "CP005", "CP006", "CP008", "CP015"]
    tableRefs: ["TP001"]
  - id: "capability-and-distribution"
    title: "Capability breadth and distribution"
    body: >-
      AppsFlyer's differentiation is breadth around the attribution system
      rather than exclusive ownership of attribution itself. Its official
      surface markets measurement across app, web, connected TV, PC, and
      console, while its support documentation defines the core job as linking
      campaigns, partners, and channels to installs and post-install events.
      Toolradar and Metacto describe overlapping core attribution among
      AppsFlyer and Adjust, while Metacto characterizes Adjust around robust
      anti-fraud and Branch around deep-linking expertise. AppsFlyer's owned
      publishing also spans privacy regulation, gaming, app-store optimization,
      programmatic advertising, app metrics, and CTV, showing an effort to own a
      broader marketer workflow. However, the assigned evidence does not support
      comparable claims for every competitor or establish that breadth produces
      better measurement accuracy, so unsupported matrix cells remain unknown.
    claimRefs: ["CP001", "CP003", "CP009", "CP014"]
    tableRefs: ["TP002"]
  - id: "pricing-and-switching"
    title: "Pricing, switching cost, and substitutes"
    body: >-
      AppsFlyer's public entry architecture lowers initial adoption friction but
      makes cost rise with paid activity. Toolradar and Metacto both report a
      $0.07-per-conversion Growth tier after a 12,000-conversion welcome
      allowance, while enterprise pricing is negotiated and premium modules can
      add undisclosed expense. Comparable current pricing for Adjust, Branch,
      Singular, and Tenjin was not present in the assigned source pool, so a
      defensible price ranking is not possible. Once deployed, replacement
      requires more than changing a dashboard: SDK event definitions, partner
      integrations, reporting, and raw-data pipelines must be remapped. That
      creates technical switching cost, but no independent churn, migration
      duration, multi-homing, or contract-termination data was available. The
      status-quo substitute is fragmented network reporting and manual
      reconciliation; internal build can customize measurement, but it assumes
      the engineering and maintenance burden that a managed platform absorbs.
    claimRefs: ["CP010", "CP011", "CP012", "CP013"]
    tableRefs: ["TP003"]
  - id: "moat-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      AppsFlyer's scale, broad channel coverage, installed SDK and data
      workflows, and brand footprint form a meaningful distribution and
      switching moat. The official 15,000-brand claim and Forbes' dated
      market-share estimate reinforce reach, while Toolradar's 917-review
      aggregate indicates substantial user feedback volume. Yet the same
      evidence shows no monopoly on the core job: Adjust is a frequent direct
      comparison, Branch has a focused deep-linking position, and Singular and
      Tenjin offer attribution alternatives at smaller disclosed funding scale.
      Toolradar flags expense, pricing complexity, learning curve, privacy
      changes, and enterprise focus; these pressures create openings for
      lower-cost specialists and internal stacks. Forbes' September 2025 profile
      also reported an approximately 100-person layoff tied to prioritizing AI
      and higher-value initiatives. That may improve focus, but it also makes
      execution against AI-led platform expansion a diligence item rather than a
      proven new moat.
    claimRefs: ["CP002", "CP007", "CP008", "CP015", "CP016"]
    figureRefs: ["FP001"]
