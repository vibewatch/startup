callouts:
  - calloutType: "risk"
    title: "A scale moat, not an exclusive capability moat"
    body: >-
      AppsFlyer's reach and integration footprint can raise switching costs, but
      direct competitors cover the core attribution job and specialists can
      attack fraud, linking, or price. Underwrite durability against verified
      retention and migration data, not market position alone.
    claimRefs: ["CP008", "CP009", "CP012", "CP015"]
