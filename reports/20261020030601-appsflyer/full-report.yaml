    columns:
      - Case
      - Operating assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited ARR meets or exceeds the $500M indication, growth and retention are durable, margins support IPO
          readiness, and the SDK investigation closes without material churn.
        - >-
          A premium to $2.7B could become supportable only after audited growth, cash-flow, and governance evidence; no
          numeric upper bound is supportable today.
        - Platform shifts, competitive pricing, and security-control execution.
        - Audited filings or investor materials showing sustained growth, NRR, margins, and completed remediation.
      - - Base
        - >-
          The 15,000-brand footprint holds, ARR is near the third-party indication, and the company remains private
          while disclosure gaps persist.
        - >-
          Cap entry near or below the reported $2.7B post-money reference; the 5.4x headline valuation-to-ARR ratio is
          provisional and not an enterprise-value multiple.
        - Opaque round structure, slower growth, concentration, and an extended exit window.
        - Consistent audited ARR plus stable post-incident retention, but no near-term public filing.
      - - Bear
        - >-
          ARR is materially below or less durable than indicated, security fallout causes churn or liability, or
          financing preferences impair common-equity value.
        - >-
          Require a material discount to $2.7B or pass; downside cannot be quantified without the preference waterfall
          and audited balance sheet.
        - Down round, delayed IPO, customer loss, regulatory action, and preference overhang.
        - >-
          Churn, unresolved forensic findings, weak cash conversion, or a financing structure dominated by secondary
          liquidity.
    notes: >-
      Scenarios are conditional frameworks rather than forecasts; no numeric probabilities, target returns, or exit
      values are assigned because audited operating data and transaction terms are unavailable.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV011
      - CV015
