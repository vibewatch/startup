            - Deterministic and aggregate methods
        - label: Signal governance
          detail: >-
            Consent-aware processing, standardization, fraud filtering, lineage, and auditability as company-described
            controls.
          items:
            - Privacy and consent context
            - Fraud-filtered signals
        - label: Reporting and data access
          detail: Campaign reports, analytics, raw data, APIs, and account-controlled access.
          items:
            - Dashboards and reports
            - Raw data and APIs
        - label: Decision and activation loop
          detail: Optimization postbacks, campaign decisions, audience workflows, and contextual journeys.
          items:
            - Network optimization
            - Marketer decisions
    approximationNotes: >-
      The ordering is inferred from documented interfaces and attribution behavior; internal services, data stores, and
      control boundaries are not public.
    claimRefs:
      - CE006
      - CE011
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The customer path moves from campaign measurement into data operations, optimization, re-engagement, and broader
      channel or account coverage.
    data:
      items:
        - stage: '1'
          label: Acquire traffic
          detail: Marketing teams run acquisition and retargeting across campaigns, partners, and channels.
          touchpoints:
            - Ad networks
            - Campaign links
            - Mobile and web
        - stage: '2'
          label: Attribute outcomes
          detail: AppsFlyer links installs and post-install events to campaigns, partners, and channels.
          touchpoints:
            - SDK or developer tools
            - Attribution reports
            - Post-install events
        - stage: '3'
          label: Operationalize data
          detail: Teams move attribution and user data into dashboards and data warehouses.
          touchpoints:
            - API integration
            - Data warehouse
            - KPI dashboards
        - stage: '4'
          label: Optimize spend
          detail: Customers use analytics and fraud controls to improve campaign decisions.
          touchpoints:
            - Analytics
            - Fraud protection
            - Campaign optimization
        - stage: '5'
          label: Re-engage users
          detail: Deep linking and audience tools support personalized journeys and reactivation.
          touchpoints:
            - OneLink
            - Audiences
            - Retargeting
        - stage: '6'
          label: Expand scope
          detail: Adoption can extend across channels, applications, agencies, and managed client accounts.
          touchpoints:
            - CTV, PC, and console
            - Additional applications
            - Agency or reseller route
    approximationNotes: >-
      The ordering synthesizes documented workflows and public customer examples; it does not represent measured
      conversion rates or a common customer cohort.
    claimRefs:
      - CU004
      - CU007
      - CU012
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative residual-risk placement emphasizes impact, likelihood, and evidence gaps rather than unsupported
      numeric probabilities.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative recurrence or persistence assessment.
        - label: Impact
          detail: Potential effect on trust, data access, economics, or customers.
        - label: Mitigation maturity
          detail: Publicly evidenced control or response maturity.
      rows:
        - label: Web SDK supply chain
          note: Observed March 2026 compromise of a trusted distribution path.
          values:
            - label: Medium
              tone: medium
              detail: One incident is known; no public frequency estimate exists.
            - label: Critical
              tone: critical
              detail: Malicious code reached downstream properties.
            - label: In progress
              tone: warning
              detail: Remediation was reported; forensic close-out remains unavailable.
        - label: Platform disintermediation
          note: Apple and Google control critical identifiers and native measurement.
          values:
            - label: High
              tone: high
              detail: Restrictions and native methods are structural.
            - label: Critical
              tone: critical
              detail: Core observability and differentiation could erode.
            - label: Adaptive
              tone: medium
              detail: Multiple privacy-preserving methods are documented.
        - label: Attribution-model divergence
          note: Ecosystem participants count installs and events differently.
          values:
            - label: High
              tone: high
              detail: The divergence is an ongoing design condition.
            - label: High
              tone: high
              detail: Reconciliation failures can impair customer trust and decisions.
            - label: Documented
              tone: medium
              detail: Methods and priority rules are published.
        - label: Financial disclosure gap
          note: AppsFlyer is private and the retained revenue figure is modeled.
          values:
            - label: High
              tone: high
              detail: The disclosure limitation is current.
            - label: High
              tone: high
              detail: Loss absorption and concentration cannot be stress-tested.
            - label: Not public
              tone: risk
              detail: Audited resilience evidence is unavailable in the pool.
        - label: Execution reprioritization
          note: A reported workforce reduction accompanied increased AI investment.
          values:
            - label: Medium
              tone: medium
              detail: The operating effect is not publicly quantified.
            - label: Medium-high
              tone: high
              detail: Support or roadmap slippage could affect retention.
            - label: Unclear
              tone: warning
              detail: No current staffing or service-level evidence is available.
        - label: Control verification gap
          note: Public claims and external monitoring do not expose control-test results.
          values:
            - label: Medium
              tone: medium
              detail: The evidence gap persists until private testing is reviewed.
            - label: High
              tone: high
              detail: Weak controls could permit recurrence or delayed detection.
            - label: Incomplete evidence
              tone: warning
              detail: UpGuard withholds findings and post-incident tests are unavailable.
    approximationNotes: >-
      Placement is a qualitative analyst assessment based only on the assigned sources; it is not a statistical loss
      model or incident-frequency estimate.
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR008
      - CR009
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic from scale to entry decision
    type: flow
    summary: >-
      An ordered decision chain separates the latest financing reference from the evidence still required for an
      investment.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: 15,000 brands claimed by AppsFlyer and reported by Forbes.
        - id: financing
          label: Market reference
          detail: More than $1B Series E at a reported $2.7B post-money valuation.
        - id: multiple
          label: Screening multiple
          detail: 5.4x valuation-to-ARR using a $500M third-party ARR indication.
        - id: risk
          label: Risk adjustment
          detail: March 2026 Web SDK compromise and unquantified customer impact.
        - id: gaps
          label: Evidence gap
          detail: No audited financials, round allocation, debt, or preference waterfall.
        - id: decision
          label: Decision
          detail: Track; invest only after private diligence and disciplined pricing.
    approximationNotes: >-
      The 5.4x figure divides reported post-money valuation by an unaudited third-party ARR indication and is not an
      enterprise-value multiple.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV011
      - CV015
      - CV016
