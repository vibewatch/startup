  - id: FE001
    title: Publicly evidenced product architecture
    type: stack
    summary: A logical, not physical, view of the customer-to-optimization path supported by retained public evidence.
    data:
      layers:
        - label: Customer journeys and marketing touchpoints
          detail: Ads, impressions, clicks, email, web, social, QR, referral, SMS, and app activity.
          items:
            - Paid and owned media
            - Cross-device customer activity
        - label: Collection and routing surfaces
          detail: SDKs, install referrers, device identifiers, platform frameworks, and deep links.
          items:
