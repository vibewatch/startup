      - [Scale proxy, "$370.8M annual revenue estimate from CompWorth", "Third-party estimate, not audited revenue", "Period, recognition policy, recurring mix, and methodology", "Audited revenue bridge by product, geography, and customer cohort"]
    notes: "No retained official source publishes list pricing; the revenue figure is an unaudited third-party estimate with an unspecified period."
    claimRefs: [CI002, CI004, CI013]
  - id: TI003
