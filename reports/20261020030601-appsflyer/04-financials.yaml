    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annual revenue, "$370.8M estimate", Low, "Directional scale only; period and method are undisclosed", "Audited revenue and ARR reconciliation"]
      - [Revenue per employee, "$200.2K estimate", Low, "Potential efficiency proxy is distorted by conflicting headcount vintages", "Monthly headcount and recognized-revenue basis"]
      - [Gross margin, null, Unavailable, "Tests infrastructure and service-delivery leverage", "Gross margin by product and hosting/support cost bridge"]
      - [CAC and payback, null, Unavailable, "Tests whether sales-led growth creates value", "CAC by segment, fully loaded S&M, and cohort payback"]
      - ["NRR, GRR, and churn", null, Unavailable, "Tests recurring revenue quality and expansion", "Logo and revenue retention cohorts by size and region"]
      - ["Cash, burn, and runway", null, Unavailable, "Determines financing dependency after the reported round", "Closing statement, primary/secondary split, cash, debt, burn, and board plan"]
    notes: "Values are third-party estimates or unavailable; null means the retained public evidence does not disclose the metric."
    claimRefs: [CI004, CI005, CI006, CI007, CI009, CI010, CI014]
