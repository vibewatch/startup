artifact: financials
slug: appsflyer
runDate: 2026-10-20
company:
  name: AppsFlyer
chapter:
  number: 4
  title: Financials
  summary: >-
    AppsFlyer presents as a scaled enterprise software platform, but the public record does not expose
    audited revenue, realized pricing, revenue mix, gross margin, retention, cash burn, or runway.
    Third-party estimates and a reported 2026 financing indicate scale and access to capital, while
    layoffs and the March 2026 Web SDK incident make cost discipline and trust-related liabilities
    important underwriting questions rather than quantified conclusions.
sections:
  - id: revenue-model
    title: Revenue model and value delivery
    body: >-
      AppsFlyer's public product surfaces describe a broad enterprise platform rather than a single
      transaction product. The customer value chain begins with campaign, partner, install, and
      post-install event data; AppsFlyer then attributes outcomes, standardizes and fraud-filters
      signals, and supports optimization or deep-linked customer journeys. This supports a recurring
      software or platform-access interpretation, but the retained evidence does not establish contract
      units, minimum commitments, usage tiers, or whether measurement, fraud protection, deep linking,
      data collaboration, and AI are separately priced. Those capabilities should therefore be treated
      as commercialization areas, not verified revenue streams. Their infrastructure, data-processing,
      governance, fraud-detection, and support requirements are also plausible gross-margin drivers,
      but the sources provide no cost allocation with which to quantify the effect.
    claimRefs: [CI001, CI003, CI011, CI012]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-gtm
    title: Pricing, go-to-market, and traction proxies
    body: >-
      The official experience is sales-led: the homepage asks prospects to request a demo, while the
      knowledge base directs users into an account-based product workflow. No list price, contract
      length, discount schedule, or realized price appears in the retained official material. Public
      outcome examples and AppsFlyer's claim of 15,000 brands indicate reach, but neither proves average
      contract value, paid-customer count, expansion, or sales efficiency. A third-party estimate of
      $370.8 million in annual revenue and $200,200 of revenue per employee offers a directional scale
      proxy only; its methodology, period, and audit status are not disclosed. Forbes' report of roughly
      100 layoffs in 2025, framed around AI investment and prioritizing high-value initiatives, is a
      useful cost-discipline signal but does not reveal CAC, payback, quota attainment, or channel
      economics.
    claimRefs: [CI002, CI004, CI005, CI008, CI013]
    tableRefs: [TI002]
  - id: capital-and-economics
    title: Unit economics and capital adequacy
    body: >-
      A low-reputation third-party signal reports a $1 billion financing announced on June 22, 2026.
      If accurate and substantially primary capital, it would reduce near-term financing pressure;
      however, funding raised is not cash available, and the retained source does not disclose the
      primary-versus-secondary split, closing terms, cash balance, debt, burn, or use of proceeds.
      Workforce figures also conflict by vintage and methodology: Forbes reported 1,400 employees as of
      September 2025, while CompWorth presents more than 1,800 without a clear measurement date. Public
      evidence therefore cannot support a reliable revenue-per-employee trend, much less gross margin,
      CAC payback, NRR, free cash flow, or runway. The unit-economics table records these nulls as
      diligence requests rather than converting financing or headcount estimates into false precision.
    claimRefs: [CI006, CI007, CI009, CI010, CI014]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      Revenue quality is not publicly underwritable. The product breadth, customer-reach claim, and
      third-party revenue estimate are compatible with a scaled recurring software franchise, but they
      do not establish recurring revenue, renewal quality, concentration, or margin durability. The
      March 2026 Web SDK compromise adds a separate adverse consideration: Rescana reports malicious
      code distribution through the trusted SDK and an ongoing forensic investigation. That event could
      create remediation, support, insurance, legal, or retention costs, but no retained source
      quantifies any financial impact. UpGuard's external monitoring page provides a continuing
      diligence route, although the actual rating is gated. Investment underwriting should remain
      conditional on audited financials, cohort retention, customer concentration, incident-related
      costs, and a fully reconciled post-financing cash and capitalization schedule.
    claimRefs: [CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The reported $1 billion round cannot be translated into cash availability or runway without the
      primary-versus-secondary split, closing evidence, cash balance, debt schedule, and burn.
    claimRefs: [CI006, CI007, CI014]
  - calloutType: recommendation
    title: Require a financial data room before underwriting
    body: >-
      Treat public scale indicators as directional only and require audited statements, ARR and revenue
      bridges, retention cohorts, gross-margin detail, CAC payback, concentration, and incident costs.
    claimRefs: [CI004, CI005, CI014, CI015]
