      - number: '4.2'
        title: 定价、市场进入与业务进展代理指标
        blocks:
          - type: paragraph
            body: >-
              官方产品体验由销售驱动：首页邀请潜在客户预约演示，知识库则将用户引导至基于账户的产品工作流。保留的官方材料没有出现标价、合同期限、折扣安排或实际成交价。公开案例和 AppsFlyer 关于服务 15,000
              个品牌的说法说明其触达范围，但都不能证明平均合同金额、付费客户数、扩张或销售效率。第三方估计其年收入为 $370.8M、每名员工收入为
              $200,200，只能作为方向性的规模代理指标；其方法、期间和审计状态均未披露。Forbes 报道 2025 年裁员约 100 人，并将其置于加大 AI
              投资、优先推进高价值项目的背景下；这可作为成本纪律信号，但无法说明 CAC、回收期、配额完成率或渠道经济性。
            claimRefs:
