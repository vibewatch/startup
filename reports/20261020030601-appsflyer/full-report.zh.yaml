      - number: '1.3'
        title: 资本结构与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 22 日，AppsFlyer 宣布与 Moloco、Google、Meta 和 Unity 达成最终投资协议。公司称，每笔投资均为少数股权、非控制性、非排他性投资，投资方不会优先获得
              API、测量信号、归因逻辑或商业条款的访问权。公司还称，该交易同时提供股东流动性和新的长期战略股权参与。由于投资方包括平台和广告经济与测量业务相交的大型生态参与者，这些保护条款很重要。但现有公告未披露交易规模、证券条款、原始发行与老股转让所得、持股比例、估值或治理权利，因此不能据此得出新的累计融资额或可用现金金额。
            claimRefs:
