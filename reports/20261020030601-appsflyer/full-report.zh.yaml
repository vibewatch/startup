        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 的信任主张结合了隐私感知测量、信号溯源、反欺诈过滤、可审计性，以及
              SSO、2FA、角色权限和切换广告主账户时的验证等账户控制。这些是有用的控制面指标，但只是公司描述，不是独立控制测试。主要相反证据来自 Rescana：其报告称 Web SDK 分发在 2026 年 3 月 9
              日至 3 月 11 日期间遭到入侵，并通过受信任的交付路径提供窃取加密货币的 JavaScript。Rescana 还表示，截至报告发布时，没有证据显示 Mobile SDK
              或后端客户数据受到影响；这一说法有明确边界，不能证明影响不存在。该事件使软件供应链完整性、客户通知、取证闭环、SRI 支持和第三方保证成为重要尽调事项。
