  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 事件与法律敞口
        blocks:
          - type: paragraph
            body: >-
              最明确且影响最大的风险，是 AppsFlyer Web SDK 在 2026 年 3 月 9 日至 11 日期间遭到入侵。Rescana 报告称，恶意 JavaScript
              通过受信任的分发路径注入，并在下游网站上针对加密货币钱包地址；该机构还称 AppsFlyer 已补救问题，并启动持续的取证调查。Rescana 没有发现 Mobile SDK
              或后端客户数据受到影响的证据，但这不等于已完成取证鉴证，也不能证明没有客户遭受损失。因此，剩余法律和监管风险取决于公共来源中没有的证据：受影响客户清单、监管机构通知、索赔或诉讼、根因闭环，以及对补救措施的独立验证。隐私和授权敞口不止于本次事件，因为
              iOS 上的设备 ID 匹配需要 ATT 授权，底层生态也采用不同的归因规则。风险登记表将严重性视为与这些事实挂钩的分析师评估，而不是已披露的概率。
