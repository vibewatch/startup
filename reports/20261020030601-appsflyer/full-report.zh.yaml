      - number: '6.3'
        title: 持续性、续约与集中度
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以判断留存质量。指定来源中没有公开 NRR、GRR、客户标志流失、续约率、合同期限分布、cohort 或客户集中度指标。标准 MSA 只提供合同机制：除非在期限结束前至少 30
              天发出通知，订阅通常会自动续约；续约费用上涨超过 7%
              时则触发提前通知。这些条款可能支持商业连续性，但不能证明客户自愿留存或扩张。同样，免费套餐可以被更改或停止，支持也由公司酌情提供，既形成转化路径，也可能增加上手和采购摩擦。因此，在判断持续扩张前，必须取得私有的
              cohort 和集中度数据。
