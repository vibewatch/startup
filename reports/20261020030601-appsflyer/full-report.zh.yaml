  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 经营假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计 ARR 达到或超过 $500M 指示，增长和留存具有持久性，利润率足以支持 IPO 准备，且 SDK 调查结案时没有造成重大流失。
        - 只有在增长、现金流和治理证据经过审计后，$2.7B 之上的溢价才可能站得住；目前无法支持任何数值上限。
        - 平台变化、竞争性定价和安全控制执行。
        - 显示持续增长、NRR、利润率和修复完成情况的经审计文件或投资者材料。
      - - 基准
        - 15,000 个品牌的覆盖面保持不变，ARR 接近第三方指示，公司在披露缺口持续存在的情况下仍保持非上市状态。
        - 将入场估值控制在报道中的 $2.7B 投后估值参考附近或以下；5.4x 的标题式估值 / ARR 比率仍是暂定值，不是企业价值倍数。
        - 轮次结构不透明、增长放缓、集中度风险和退出窗口拉长。
        - 经审计 ARR 保持一致，事件后留存稳定，但近期不会公开提交文件。
      - - 悲观
        - ARR 显著低于所示水平，或持久性不及预期；安全事件后果导致流失或责任，或融资优先权损害普通股权益价值。
        - 要求相对于 $2.7B 有较大折扣，或直接放弃；没有优先权瀑布和经审计资产负债表，无法量化下行空间。
        - 下轮融资、IPO 延迟、客户流失、监管行动和优先权悬垂。
        - 流失、未解决的取证发现、现金转化疲弱，或融资结构主要由老股流动性主导。
    notes: 这些情景是有条件的分析框架，不是预测；由于经审计的经营数据和交易条款不可得，未赋予数值概率、目标回报或退出价值。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV011
      - CV015
