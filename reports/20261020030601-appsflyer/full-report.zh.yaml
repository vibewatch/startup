      - number: '1.4'
        title: 里程碑与风险信号
        blocks:
          - type: paragraph
            body: >-
              公司的经营历史既有增长标志，也出现了两个不利信号。Forbes 报道称，AppsFlyer 裁员约 100 人，并将此举与加大 AI 投资、优先推进更高价值的项目联系起来。另据 Reflectiz 报道，2026
              年 3 月 9 日至 3 月 11 日期间，AppsFlyer 的 CDN 上的 Web SDK 被注入恶意 JavaScript；在合法分析功能继续运行的同时，代码替换了加密货币钱包地址。UpGuard
              2026 年 10 月 20 日的供应商风险页面确认其仍在五个风险类别中持续进行外部监测，但可访问文本没有显示评分，也不能证明事件已经闭环。因此，客户影响、补救完整性、监管后续行动和留存影响仍未解决。
