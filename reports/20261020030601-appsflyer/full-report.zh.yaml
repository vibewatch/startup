            body: >-
              AppsFlyer
              位于营销触点、数字资产、广告网络和营销人员决策流程之间。其核心工作是确定某次安装或安装后事件之前发生的是哪项广告活动、哪个合作伙伴或哪个渠道，然后把结果呈现出来，用于优化获客和再营销。公开产品描述在此基础上扩展出分析、深度链接、反欺诈、原始数据与
              API、受众工具和合作伙伴市场。由此形成的套件不再只是移动归因仪表盘：公司如今将其定位覆盖应用、网页、CTV、PC
              和主机。但现有证据只能证明这些产品面可用，无法证明每个模块的采用或表现；来源池中没有公开来源披露模块级使用量、附加率或实际客户结果。
