      - number: '4.4'
        title: 财务结论与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              收入质量无法根据公开信息作出投资判断。产品广度、客户触达规模和第三方收入估计与一家规模化经常性软件公司相符，但不能证明经常性收入、续约质量、客户集中度或利润率韧性。2026 年 3 月的 Web SDK
              入侵构成另一项不利因素：Rescana 报告称恶意代码通过受信任的 SDK 分发，且取证调查仍在进行。该事件可能带来补救、支持、保险、法律或留存成本，但保留的来源没有量化任何财务影响。UpGuard
              的外部监测页面提供了持续尽调路径，但实际评级受到访问限制。投资判断应继续以经审计财务报表、分 cohort 留存、客户集中度、事件相关成本，以及融资后现金和资本结构的完整对账为前提。
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 融资不等于 runway
            body: 没有原始发行与老股转让的分配、交割证据、现金余额、债务计划和烧钱速度，就不能把报道中的 $1B 轮融资换算成可用现金或现金续航。
