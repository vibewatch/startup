      - number: '4.3'
        title: 单位经济性与资本充足性
        blocks:
          - type: paragraph
            body: >-
              一个信誉较低的第三方信号称，2026 年 6 月 22 日宣布了一笔 $1B
              融资。若该消息属实且主要为原始资本，将缓解近期融资压力；但已募集资金不等于可用现金，现有来源也未披露原始发行与老股转让的分配、交割条款、现金余额、债务、烧钱速度或资金用途。员工数据也因时间点和方法不同而冲突：Forbes
              称截至 2025 年 9 月有 1,400 名员工，而 CompWorth 给出超过 1,800 人，但没有清晰的测量日期。因此，公开证据无法支持可靠的每员工收入趋势，更无法支持毛利率、CAC
              回收期、NRR、自由现金流或现金续航。单位经济性表将这些空缺记录为尽调请求，而不是把融资或员工数估计伪装成精确数字。
