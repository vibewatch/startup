      - 论点
      - 哪些信息会改变判断
    rows:
      - - 正向论点
        - 15,000 个品牌的覆盖面和广泛的跨渠道产品版图，说明其测量业务可能具备持久相关性。
        - 经审计的留存、群组扩张和客户集中度，将决定这批覆盖面能否转化为持久的经济效益。
      - - 正向论点
        - 由主要广告平台参与的战略 Series E，以及明确提出的公开市场路径，为融资和退出提供了更多选择。
        - 治理权利、商业承诺和可信的 IPO 准备计划，会强化这一信号。
      - - 反向论点
        - 公开 ARR 输入来自二手信息，而因加大 AI 投资而进行的裁员，使盈利能力和有机增长仍不清晰。
        - 经审计的收入、ARR 桥接表、利润率、现金流和招聘计划可以消除这一不确定性。
      - - 反向论点
        - 2026 年 3 月的 Web SDK 入侵，可能带来公开指标看不出的信任、修复、责任或留存成本。
        - 独立取证结案、客户留存证据、保险覆盖和控制测试，可以收窄这项风险。
    notes: 这是选择性论点检验，不是完整的风险登记表；公司规模声明与独立融资及事件报道分开处理。
