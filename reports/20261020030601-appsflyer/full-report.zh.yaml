  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资品类比数字广告窄，但比单纯的安装归因宽。AppsFlyer
              的核心作用，是把广告活动、合作伙伴和渠道连接到应用安装及安装后事件，让营销人员评估获客和再营销效果。公司如今将这一测量层覆盖到移动端、网页、CTV、PC
              和主机，并把深度链接、反欺诈、数据协作和受治理的信号基础设施作为相邻工作流。因此，边界内的支出是用于测量、路由、验证和优化营销结果的软件与数据基础设施；广告库存、创意制作、通用网络安全、CRM
              和云计算不在边界内。原生广告平台仪表盘、内部分析和手工对账属于现状替代方案，不是额外的市场细分。这个边界很重要：若把媒体支出或完整的营销技术栈都算作 AppsFlyer 的可服务市场，就会严重高估其商业机会。
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              现有证据提供的是规模代理指标，而不是按支出计价的市场规模。AppsFlyer 称有 15,000 个品牌信任其平台；一份二手汇总则称其生态中有超过 10,000 家技术合作伙伴。据报道，其 2025 年
              Performance Index 覆盖了超过 39,000 个应用的 16.2B 次安装、9.6B 次再营销转化和 88 个媒体来源。公司另一项反欺诈研究分析了超过 246,000 个应用的 100B
              次以上安装。这些数字说明可观测的活动面很大，但样本、期间和分母不同，不能简单相加成 TAM、SAM 或 SOM。保留的来源均未披露品类收入、客户 ACV 分布、符合条件的广告主支出、渗透率或一致的
              CAGR。因此，规模结论有意保持克制：需求看起来广泛且数据密集，但货币化机会仍是投资判断中的信息缺口。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM010
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的经济买方，是对增长、效果营销或营销分析负责的负责人；日常用户包括获客经理、分析师、生命周期团队和代理商运营人员，通常由广告主付款。这一角色划分来自已记录的工作流推断，而非已披露的采购数据。WMTips
              的历史探测网站样本显示，产品覆盖线上购物、金融与银行、商业、营销与商品管理、旅游，以及软件和硬件等行业，其中美国占观测网站的 31%。多渠道支出使活动到结果的对账变得有价值后，客户可能开始采用；随后再通过 SDK
              或 API 集成、回传、深度链接、反欺诈控制和跨平台报告深化使用。代理商和多品牌企业会增加账户治理要求。即使预算归营销部门掌握，安全、隐私、财务和采购利益相关方也可能否决部署，尤其当第三方 JavaScript
              会触及交易或身份验证流程时。
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              持续需求来自测量复杂度：渠道增多、隐私约束、欺诈和 AI 优化都会提升标准化、可审计信号的价值。AppsFlyer 的 2025
              年反欺诈研究称，欺诈率总体持平，但随着营销投入增长，欺诈安装的绝对数量上升；这说明即使欺诈率不再上升，干净的测量仍可能有价值。相应的制约因素是信任和切换风险。独立安全供应商报告称，AppsFlyer Web
              SDK 在 2026 年 3 月 9 日至 3 月 11
              日期间遭到入侵，恶意代码得以通过受信任的依赖链传播。该事件不能证明客户损失或流失，但会让供应商风险审查、脚本完整性、补救证据和合同保障对采用时点更加重要。因此，只有在尽调确认货币化、留存、安全恢复，以及可观测活动中有多少能转化为可服务的经常性软件收入后，估值才应为数据规模和工作流广度给予溢价。
            claimRefs:
              - CM007
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 规模可见，但可货币化的市场规模不可见
            body: 事件量、应用覆盖、品牌数量和探测网站构成都能说明活动规模，但不能替代市场收入、定价、留存或客户层面的支出数据。在取得这些分母前，TAM、SAM 和 SOM 应在投资判断中保持开放。
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM016
          - type: callout
            title: 信任是采购路径的一部分
            body: 2026 年 3 月的 Web SDK 入侵使安全补救和第三方脚本控制成为采购尽调的一部分，尤其适用于处理敏感交易的金融、商业及其他工作流。
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与规模
        blocks:
          - type: paragraph
            body: >-
              竞争集合比两家移动归因供应商的比较更广。Tracxn 将 452 家公司列为活跃竞争者，其中 30 家获得过融资，并将 Singular、Branch 和 InMarket
              列为主要同业；其排名还包括已被收购的老牌公司 Adjust，以及规模较小的专业厂商 Tenjin。Toolradar 报告称，访客最常将 AppsFlyer 与 Adjust 比较，因此在现有证据中，Adjust
              是最明确的直接采购替代方案。AppsFlyer 的资源配置仍显著更强：Tracxn 报告其累计融资额为 $1.3B，而 Branch、Adjust、Singular 和 Tenjin 分别为
              $667M、$256M、$50M 和 $2.5M。Forbes 另称，截至 2025 年 9 月其市场份额为 60%。这些数字说明的是规模，而不是当前赢单率、留存或产品优越性；截至本次 2026 年 10
              月运行日期，该市场份额估计也未经过独立更新。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP013
              - CP015
      - number: '3.2'
        title: 能力广度与分发
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 的差异化在于围绕归因系统的广度，而不是独占归因本身。其官方产品覆盖应用、网页、联网电视、PC
              和主机测量；支持文档则将核心工作定义为把广告活动、合作伙伴和渠道连接到安装及安装后事件。Toolradar 和 Metacto 认为 AppsFlyer 与 Adjust 的核心归因能力存在重叠；Metacto
              则将 Adjust 的特点概括为强大的反欺诈能力，将 Branch 的特点概括为深度链接专长。AppsFlyer 自有内容还覆盖隐私监管、游戏、应用营销、应用商店优化、程序化广告、应用指标和
              CTV，显示其希望占据更广泛的营销工作流。但现有证据并不支持对每个竞争对手作出可比主张，也无法证明更广的覆盖带来更高的测量准确性，因此未获支持的矩阵单元仍为未知。
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP012
              - CP013
      - number: '3.3'
        title: 定价、切换成本与替代方案
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 的公开入门架构降低了初始采用门槛，但成本会随付费活动增加。Toolradar 和 Metacto 均称，Growth 套餐在 12,000 次转化的欢迎额度用完后按每次转化 $0.07
              计费；企业定价需协商，高级模块还可能增加未披露的费用。现有来源池没有 Adjust、Branch、Singular 和 Tenjin
              的可比当前定价，因此无法做出可信的价格排名。部署后，替换产品不只是更换仪表盘：SDK
              事件定义、合作伙伴集成、报告和原始数据管道都要重新映射。这会形成技术切换成本，但没有独立的流失、迁移时长、多平台并用或合同终止数据。现状替代方案是分散的网络报告和手工对账；内部自建可以定制测量，但也要承担托管平台原本吸收的工程和维护负担。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
      - number: '3.4'
        title: 护城河韧性与替代风险
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 的规模、广泛的渠道覆盖、已部署的 SDK 与数据工作流，以及品牌覆盖，构成了有意义的分发和切换护城河。官方宣称服务 15,000 个品牌，Forbes
              的带日期市场份额估计也强化了其触达能力；Toolradar 汇总的 917 条评论则说明用户反馈量可观。但同一组证据也显示，公司并未垄断核心工作：Adjust 经常被拿来直接比较，Branch
              在深度链接上有明确定位，而 Singular 和 Tenjin 以更小的已披露融资规模提供归因替代方案。Toolradar
              指出费用、定价复杂度、学习曲线、隐私变化和企业导向等问题，这些压力给低成本专业厂商和内部技术栈留下了空间。Forbes 2025 年 9 月的简介还称，公司裁员约 100 人，原因与优先推进 AI
              和高价值项目有关。这可能有助于聚焦，但也意味着 AI 驱动的平台扩张能否执行到位，仍是尽调事项，而不是已验证的新护城河。
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 这是规模护城河，不是独占能力护城河
            body: AppsFlyer 的触达和集成足迹可以抬高切换成本，但直接竞争对手覆盖核心归因工作，专业厂商也能从反欺诈、链接或价格切入。评估护城河韧性时，应看经验证的留存和迁移数据，而不是只看市场地位。
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与价值交付
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 的公开产品页面把它描述成企业级综合平台，而非单一交易产品。客户价值链从广告活动、合作伙伴、安装和安装后事件数据开始；AppsFlyer
              随后归因结果、标准化并过滤欺诈信号，并支持优化或深度链接的客户旅程。这支持将其理解为经常性软件或平台接入业务，但现有证据无法确认合同计费单位、最低承诺、使用量级别，或测量、反欺诈、深度链接、数据协作和 AI
              是否分别定价。因此，这些能力应视为商业化方向，而不是已验证的收入流。其基础设施、数据处理、治理、欺诈检测和支持需求也可能影响毛利率，但来源没有成本分摊数据，无法量化影响。
            claimRefs:
              - CI001
              - CI003
              - CI011
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI011
