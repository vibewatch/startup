              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: 融资参考与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Crunchbase 报道 E 轮融资超过 $1B，投后估值为 $2.7B，并称成立以来已知融资额为
              $1.3B。这些数字提供了市场成交价的标题参考，但不是公司可用现金：现有证据未披露原始发行与老股转让的金额、债务、费用或优先权悬置。GetLatka 给出的 $500M ARR 指示值意味着投后估值 / ARR
              为 5.4x，但其页面将该 ARR 归给另一家发布者，同时称没有记录底层来源。因此，这一倍数只能作为筛选参考，而非投资判断结论。没有经审计 ARR、增长、留存、利润率、现金和安全补救证据，就不支持以高于
              $2.7B 的价格入场；即便以该基准入场，也应保持有条件。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
      - number: '8.3'
        title: 情景框架与可比证据
        blocks:
          - type: paragraph
            body: >-
              现有可比公司集合具有方向性参考价值，但不足以给出精确估值区间。GetLatka 将 Branch、Singular、Kochava、Tenjin 和 Flurry Analytics 列为竞争对手，并称
              AppsFlyer 按收入计算规模最大；Forbes 则提供了 2025 年 9 月约 $2B 的公司价值标记。两者都没有提供经审计的同业增长、利润率、留存、企业价值、交易条款或上市公司桥接。因此，情景分析使用
              $2.7B 作为最新已报道融资参考，并让溢价或折价取决于可观测证据。仅凭公开输入无法赋予数值概率、目标 IRR 或可信的退出区间；这样做会把私营公司数据缺失伪装成精确结论。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV011
              - CV015
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效因素
        blocks:
          - type: paragraph
            body: >-
              管理层已释放进入公开市场的意图：据 Crunchbase，Oren Kaniel 告诉 Axios，AppsFlyer
              正在考虑公开市场，并称这笔融资是通往该目标的一步。战略平台投资人可能改善商业协同，但也让公司是否独立于广告交易对手成为更尖锐的尽调问题。投资前，应要求经审计财务报表、ARR 和收入桥接、NRR 和
              GRR、客户集中度、股权结构表及优先股堆叠、原始发行 / 老股转让分配、现金与债务，以及董事会审阅过的事件报告。论点失效因素包括 SDK 事件后的经验证重大流失、未解决的控制缺陷、ARR 明显低于已报道的
              $500M 指示值，或使新资金排在与目标回报不一致的优先股堆叠之后的融资条款。只有取得这些私有输入后，才能设定持有期和退出回报。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 跟踪 AppsFlyer，并寻求私有尽调。在已报道的 $2.7B 投后估值基准或更低价格下，可能存在有条件的投资论点；但公开证据尚不足以支持买入建议、目标回报或溢价估值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV015
