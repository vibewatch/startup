chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              根据 Forbes 2025 年 9 月的公司简介，AppsFlyer 于 2011
              年成立，总部位于旧金山。其核心产品回答一个对营销投入回报至关重要的问题：哪些广告活动、合作伙伴和渠道带来了应用安装或安装后事件。AppsFlyer 自有材料称，公司已从移动归因这一出发点扩展为 Modern
              Marketing Cloud，覆盖深度链接、反欺诈、高级分析、数据协作和 AI 辅助工作流。现有材料支持其作为软件测量与分析公司的定位，但没有披露当前定价架构、合同期限，或订阅收入与按使用量计费收入的构成。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
