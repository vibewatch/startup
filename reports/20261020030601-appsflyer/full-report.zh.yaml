          - type: paragraph
            body: >-
              Apple 和 Google 既是不可或缺的输入，也可能成为替代方案。Sacra 将隐私限制和平台原生归因列为风险：它们可能降低可观测性，或让第三方测量失去中间环节。AppsFlyer
              的文档也确认，归因依赖应用商店、自报网络、标识符、来源信息和平台定义的方法。公司还在移动端、网页、CTV、PC 和主机之间扩展，因此必须保持可靠的框架和集成面更多。Forbes 报道称，2025 年 2 月约有
              100 名员工被裁，投资重点转向 AI，执行能力因此面临考验。现有来源池无法独立压力测试财务韧性：FirmSuggest 指出，AppsFlyer 是私营公司，因此详细披露有限；Sacra 的 2025
              年收入数字也是模型估计，而非经审计的公司报告。这些约束使客户集中度、毛利率敏感性、合同责任和保险覆盖成为优先尽调事项。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 缓解措施、监测与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              眼下的缓解标准应以证据为基础，而不是只看政策。Rescana 建议审查事件窗口内的日志，在可行时使用已知安全或自托管的 SDK 构建版本，启用 Subresource
              Integrity，并监测第三方资产变化。AppsFlyer 公开介绍了受治理信号，也发布 DMA 和 Privacy Sandbox 资源；UpGuard 则称持续运行超过 330 项外部检查。但抓取到的公开
              UpGuard 页面没有披露底层评级和发现。投资人应要求最终取证报告、客户通知范围、控制测试结果、网络保险限额，以及关键浏览器交付资产受完整性控制的证据。还应监测监管机构或法院动态、未经授权的 SDK
              变更是否重现、各方法的归因准确性、平台 API 限制、支持投诉，以及事件后的毛留存。论点失效触发因素包括重大事件重演、隐瞒客户重大损失的证据、限制核心数据流的监管行动，或使独立归因失去经济性的​​平台变化。
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 首要论点失效触发因素
            body: 客户交付代码再次遭到入侵、出现隐瞒客户重大损失的证据，或监管行动限制核心归因数据流，都会击穿支撑投资论点的信任和平台接入假设。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
          - type: callout
            title: 投资前必须取得的证据
            body: 在将剩余敞口视为受控前，应要求最终取证报告、受影响客户及索赔主张清单、独立控制测试、经审计财务报表、网络保险详情，以及收入对 Apple 和 Google 测量变化的敏感性分析。
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资观点：规模可信，但价格支撑不完整
        blocks:
          - type: paragraph
            body: >-
              可投资论点建立在庞大的经营覆盖和产品定位之上：AppsFlyer 位于广告主与大型平台之间的测量层。AppsFlyer 称有 15,000 个品牌使用其平台；Forbes 2025 年 9
              月也报道了相同的品牌数量和超过 100,000 个应用。这一规模，加上 Moloco、Google、Meta 和 Unity
              的战略少数股权投资，支持将其视为重要基础设施。但反方论点同样重大：财务披露未经审计且十分有限，最近一轮融资前曾裁员约 100 人，2026 年 3 月的 Web SDK
              入侵又带来公开来源无法量化的信任和留存风险。因此，建议是跟踪 / 继续研究，信心中低、风险高，而不是不考虑价格的背书。
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
