            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: 规模、领导层与组织透明度
        blocks:
          - type: paragraph
            body: >-
              AppsFlyer 和 Forbes 均将 Oren Kaniel 认定为 CEO 兼联合创始人，这为其最高经营职位提供了较强证据。规模指标较为可观，但日期并不一致：AppsFlyer 2026 年 6
              月的公告称公司服务超过 15,000 个品牌；Forbes 2025 年 9 月的简介则称公司覆盖超过 100,000 个应用、拥有 1,400 名员工，公司价值约 $2B，市场份额为
              60%。这些指标不可互换，也不应混合用于推算当前估值或收入。现有证据无法确认当前高管名单、董事会构成、治理权利或继任计划，因此关键人员和监督机制仍需尽调。
            claimRefs:
              - CO005
