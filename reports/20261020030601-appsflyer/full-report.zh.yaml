    type: quadrant
    summary: 分析师按序数评分将 AppsFlyer 定位为证据覆盖面最广的平台，同时显示直接竞争和替代压力；坐标不是市场份额或业绩基准。
    data:
      xAxis:
        label: 有证据支持的渠道广度
        min: 1
        max: 5
        lowLabel: Narrow / custom
        highLabel: Broad
        description: Ordinal score from the channel scope explicitly supported in assigned sources.
      yAxis:
        label: 有证据支持的产品化差异化
        min: 1
        max: 5
        lowLabel: Single-focus / unverified
        highLabel: Multi-capability
        description: Ordinal score from supported attribution, linking, fraud, data, and workflow claims.
      points:
        - name: AppsFlyer
          label: AppsFlyer
          x: 5
          'y': 5
          note: 官方证据覆盖应用、网页、CTV、PC、主机、深度链接、反欺诈和数据协作。
        - name: Adjust
          label: Adjust
          x: 3
          'y': 3
          note: 有证据支持直接归因重叠和反欺诈能力；更广泛的范围尚未得到证实。
        - name: Branch
          label: Branch
          x: 2
          'y': 3
          note: 有证据支持深度链接专业化；完整的测量广度尚未得到证实。
        - name: Singular
          label: Singular
          x: 3
          'y': 2
          note: 有证据支持营销分析和归因定位；其他能力未知。
        - name: Tenjin
          label: Tenjin
          x: 2
          'y': 2
          note: 在披露融资规模较小的情况下，有证据支持其移动归因定位。
        - name: Internal build
          label: 内部构建
          x: 1
          'y': 1
          note: 可以定制，但广度、准确性和运营成本尚未验证。
    approximationNotes: 评分是分析师根据现有证据定义的 1 至 5 序数位置；未知能力没有被视为不存在，间距也不代表价值比例。
    claimRefs:
      - CP001
      - CP002
      - CP007
      - CP008
      - CP009
      - CP012
      - CP013
      - CP016
  - id: FI001
    title: 可公开观察的价值到收入桥接
    type: flow
    summary: 公开来源确立了经营价值链，但合同计费单位、实现收入、直接成本和毛利仍未披露。
    data:
      nodes:
        - id: activity
          label: 活动与渠道运营
          detail: 广告主在合作伙伴和渠道上的活动，构成测量输入。
        - id: events
          label: 安装与安装后事件
          detail: 官方文档将应用内购买列为测量事件的示例。
        - id: attribution
          label: 跨平台归因
          detail: AppsFlyer 将结果关联到活动、合作伙伴和渠道。
        - id: signals
          label: 标准化、经过欺诈过滤的信号
          detail: 公司称信号经过验证、治理并完成欺诈过滤。
        - id: action
          label: 优化与客户旅程
          detail: 测量结果为优化提供信息，深度链接则支持上下文相关的旅程。
        - id: economics
          label: 合同化平台经济
          detail: 定价单位、确认收入、直接成本和毛利均无公开信息。
    approximationNotes: 仅为有序的概念流程；不量化转化、收入或毛利。
    claimRefs:
      - CI003
      - CI011
      - CI013
  - id: FE001
    title: 有公开证据支持的产品架构
    type: stack
    summary: 这是客户到优化路径的逻辑视图，不是物理架构，依据保留的公开证据整理。
    data:
      layers:
        - label: 客户旅程与营销触点
          detail: 广告、曝光、点击、电子邮件、网页、社交、QR、推荐、SMS 和应用活动。
          items:
            - 付费与自有媒体
            - 跨设备客户活动
        - label: 采集与路由入口
          detail: SDK、安装 referrer、设备标识符、平台框架和深度链接。
          items:
            - 移动端与 Web SDK 路径
            - OneLink 式深度链接路由
        - label: 归因方法
          detail: 确定性匹配、平台归因、预加载证据和概率建模。
          items:
            - 点击与曝光规则
            - 确定性与聚合方法
        - label: 信号治理
          detail: 结合用户同意的处理、标准化、欺诈过滤、数据溯源和可审计性，均为公司描述的控制措施。
          items:
            - 隐私与同意上下文
            - 经过欺诈过滤的信号
        - label: 报告与数据访问
          detail: 活动报告、分析、原始数据、API 和由账户控制的访问权限。
          items:
            - 仪表板与报告
            - 原始数据与 API
        - label: 决策与激活闭环
          detail: 优化回传、活动决策、受众工作流和上下文相关的旅程。
          items:
            - 网络优化
            - 营销人员决策
    approximationNotes: 排序根据有记录的接口和归因行为推断；内部服务、数据存储和控制边界没有公开信息。
    claimRefs:
      - CE006
      - CE011
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 客户路径从活动测量延伸至数据运营、优化、重新触达，以及更广泛的渠道或账户覆盖。
    data:
      items:
        - stage: '1'
          label: 获取流量
          detail: 营销团队在多个活动、合作伙伴和渠道上开展获客与再营销。
          touchpoints:
            - 广告网络
            - 活动链接
            - 移动端与网页
        - stage: '2'
          label: 归因结果
          detail: AppsFlyer 将安装和安装后事件关联到活动、合作伙伴和渠道。
          touchpoints:
            - SDK 或开发者工具
            - 归因报告
            - 安装后事件
        - stage: '3'
          label: 让数据进入运营
          detail: 团队将归因和用户数据接入仪表板与数据仓库。
          touchpoints:
            - API 集成
            - 数据仓库
            - KPI 仪表板
        - stage: '4'
          label: 优化支出
          detail: 客户使用分析和欺诈控制来改善活动决策。
          touchpoints:
            - 分析
            - 欺诈防护
            - 活动优化
        - stage: '5'
          label: 重新触达用户
          detail: 深度链接和受众工具支持个性化旅程与重新激活。
          touchpoints:
            - OneLink
            - 受众
            - 再营销
        - stage: '6'
          label: 扩大范围
          detail: 采用范围可以扩展至多个渠道、应用、代理商和代运营客户账户。
          touchpoints:
            - CTV、PC 和主机
            - 其他应用
            - 代理商或经销商路径
    approximationNotes: 排序综合了有记录的工作流和公开客户案例；不代表测得的转化率或共同客户群组。
    claimRefs:
      - CU004
      - CU007
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险的定性定位强调影响、可能性和证据缺口，而不是没有依据的数值概率。
    data:
      columns:
        - label: 可能性
          detail: 对复发或持续性的定性评估。
        - label: 影响
          detail: 对信任、数据访问、经济效益或客户的潜在影响。
        - label: 缓解成熟度
          detail: 有公开证据支持的控制或响应成熟度。
      rows:
        - label: Web SDK 供应链
          note: 2026 年 3 月观察到可信分发路径遭入侵。
          values:
            - label: 中
              tone: medium
              detail: 已知发生过一次事件；没有公开的频率估计。
            - label: 严重
              tone: critical
              detail: 恶意代码已抵达下游资产。
            - label: 进行中
              tone: warning
              detail: 已报告修复；取证结案仍不可得。
        - label: 平台去中介化
          note: Apple 和 Google 控制关键标识符和原生测量。
          values:
            - label: 高
              tone: high
              detail: 限制和原生方法具有结构性。
            - label: 严重
              tone: critical
              detail: 核心可观测性和差异化可能被削弱。
            - label: 适应中
              tone: medium
              detail: 已记录多种保护隐私的方法。
        - label: 归因模型分歧
          note: 生态参与者对安装和事件的计数方式不同。
          values:
            - label: 高
              tone: high
              detail: 这种分歧是持续存在的设计条件。
            - label: 高
              tone: high
              detail: 核对失败可能损害客户信任和决策。
            - label: 已记录
              tone: medium
              detail: 方法和优先级规则已公开。
        - label: 财务披露缺口
          note: AppsFlyer 是非上市公司，保留的收入数字来自模型。
          values:
            - label: 高
              tone: high
              detail: 披露限制目前仍存在。
            - label: 高
              tone: high
              detail: 无法对损失吸收能力和集中度进行压力测试。
            - label: 未公开
              tone: risk
              detail: 当前证据池中没有经审计的韧性证据。
        - label: 执行重点重新排序
          note: 据报道，员工规模缩减伴随着 AI 投资增加。
          values:
            - label: 中
              tone: medium
              detail: 对运营的影响尚无公开量化结果。
            - label: 中高
              tone: high
              detail: 支持或路线图延期可能影响留存。
            - label: 不清晰
              tone: warning
              detail: 没有当前人员配置或服务水平证据。
        - label: 控制验证缺口
          note: 公开声明和外部监测没有披露控制测试结果。
          values:
            - label: 中
              tone: medium
              detail: 在审阅私下测试之前，证据缺口仍将存在。
            - label: 高
              tone: high
              detail: 控制薄弱可能导致事件再次发生或延迟发现。
            - label: 证据不完整
              tone: warning
              detail: UpGuard 未披露调查结果，事后测试也无法获得。
    approximationNotes: 该定位仅是基于指定来源的定性分析判断，不是统计损失模型，也不是事件频率估计。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR008
      - CR009
      - CR015
      - CR016
  - id: FV001
    title: 从规模到进入决策的推荐逻辑
    type: flow
    summary: 这条有序决策链将最新融资参考与投资仍需补足的证据区分开来。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: AppsFlyer 声称拥有 15,000 个品牌客户，Forbes 也作此报道。
        - id: financing
          label: 市场参照
          detail: 超过 $1B 的 E 轮融资，报道的投后估值为 $2.7B。
        - id: multiple
          label: 筛选倍数
          detail: 按第三方给出的 $500M ARR 指示值计算，估值 / ARR 为 5.4x。
        - id: risk
          label: 风险调整
          detail: 2026 年 3 月 Web SDK 遭入侵，客户影响尚未量化。
        - id: gaps
          label: 证据缺口
          detail: 没有经审计的财务数据、轮次资金分配、债务或优先权瀑布表。
        - id: decision
          label: 决策
          detail: 持续跟踪；只有完成非公开尽调并采用审慎定价后才投资。
    approximationNotes: 5.4x 是用报道的投后估值除以未经审计的第三方 ARR 指示值所得，不是企业价值倍数。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV011
      - CV015
      - CV016
