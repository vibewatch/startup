      - ["Cross-channel brands", "Marketing and growth teams; economic buyer not disclosed", "Unify measurement across app, web, CTV, PC, and console", "Company states 15,000 brands overall", "Expands wallet beyond mobile attribution", "No channel-level adoption or revenue mix"]
      - ["Enterprise, mid-market, and small business", "Marketing teams across all three size bands", "Attribution, analytics, fraud protection, and deep linking", "All size bands appear in Cuspera's usage taxonomy", "Broadens the addressable customer base", "Directory popularity is not a measured customer distribution"]
      - ["Internet, IT services, and financial services", "Digital marketing and analytics teams", "Performance measurement and customer-journey optimization", "Cuspera identifies these as popular industries", "Demonstrates vertical breadth", "No geography, vertical revenue, or retention split"]
      - ["Agencies and managed-service users", "Agency account teams managing client applications", "Operate attribution for third-party applications", "Supported subject to notice and an appropriate package", "Adds a channel and multi-account route", "No reseller or agency contribution disclosed"]
    notes: >-
      Segmentation combines official workflow descriptions, the standard MSA,
      and Cuspera taxonomy; observed scale is not a revenue mix and null private
      metrics remain diligence gaps.
    claimRefs: ["CU001", "CU004", "CU005", "CU012"]
  - id: "TU002"
    title: "Public customer-scale and adoption indicators"
    columns:
      - "Metric"
      - "Value"
      - "As-of / source"
      - "Confidence"
      - "Implication"
      - "Missing denominator or limitation"
    rows:
      - ["Brands", "15,000", "Current company homepage; corroborated by Forbes as of September 2025", "High", "Large stated commercial footprint", "No active, paying, or retained-customer definition"]
      - ["Apps", "More than 100,000", "Forbes, September 2025", "Medium", "Broad application coverage", "No active-app or paid-account denominator"]
      - ["Case-study directory", "324 case studies in directory title", "FeaturedCustomers, accessed 2026-10-20", "Low", "Large body of public reference material", "Directory entries are not a count of current customers or independently verified deployments"]
      - ["Cuspera assessment sample", "26 buyers; 3,129 insights", "Cuspera, accessed 2026-10-20", "Medium", "Provides a review and testimonial sample", "Insights combine peer reviews, case studies, expert blogs, and vendor-provided data"]
      - ["Homepage outcome tiles", "113% app traffic; 12% MAU; 17% marketing ROI; 1.2M monthly events; 32% revenue uplift; 4x ROAS", "AppsFlyer homepage, accessed 2026-10-20", "Low", "Shows the range of outcomes marketed to buyers", "Fetched text does not map every metric to a named customer, baseline, or measurement period"]
    notes: >-
      Values retain each source's metric name and vintage; directory and homepage
      figures are promotional indicators, not a time series or verified active
      customer count.
    claimRefs: ["CU001", "CU002", "CU006", "CU009"]
  - id: "TU003"
    title: "Named customer proof table"
    columns:
      - "Customer"
      - "Segment"
      - "Deployment / use case"
      - "Production vs. pilot"
      - "Reported outcome"
      - "Limitation"
    rows:
      - ["Fondeadora", "Financial services", "API integration and attribution data in a data warehouse", "Appears operational; production status not explicitly labeled", "Real-time dashboards and organization-wide KPI visibility", "Customer testimonial carried by Cuspera; no date or independent verification"]
      - ["Pixonic", "Gaming", "Attribution and performance optimization", "Not stated", "More than $1 million reportedly saved", "Directory headline omits baseline, period, and verification method"]
      - ["Telefónica", "Telecommunications", "Real-time campaign testing and weekly performance insight", "Not stated", "Operational cadence described; no quantified uplift", "Directory entry provides no deployment date or contract scope"]
      - ["Letgo", "Marketplace", "Streamlined user journeys and acquisition", "Not stated", "35% lift in user acquisition", "Baseline, period, and attribution method are not disclosed in fetched text"]
      - ["Hotstar", "Media / OTT", "Audiences feature for retention and reactivation", "Not stated", "27% lift in reactivation", "No cohort definition, time period, or independent verification"]
      - ["Albertsons", "Retail", "Deep links and QR codes", "Not stated", "113% increase in marketing-driven mobile app traffic", "No baseline or measurement period in the directory excerpt"]
    notes: >-
      Sample is limited to named entries visible in the assigned prefetched
      Cuspera and FeaturedCustomers pages; it is not exhaustive, and production
      status, outcome periods, and independent verification are often absent.
    enumerationScope:
      coverage: "sample"
      basis: >-
        Named customer examples visible in the two assigned customer-proof
        directories as fetched on 2026-10-20.
    claimRefs: ["CU003", "CU007", "CU008", "CU009"]
figures:
  - id: "FU001"
    title: "Customer adoption and expansion journey"
    type: "journey-map"
    summary: >-
      The customer path moves from campaign measurement into data operations,
      optimization, re-engagement, and broader channel or account coverage.
    data:
      items:
        - stage: "1"
          label: "Acquire traffic"
          detail: "Marketing teams run acquisition and retargeting across campaigns, partners, and channels."
          touchpoints: ["Ad networks", "Campaign links", "Mobile and web"]
        - stage: "2"
          label: "Attribute outcomes"
          detail: "AppsFlyer links installs and post-install events to campaigns, partners, and channels."
          touchpoints: ["SDK or developer tools", "Attribution reports", "Post-install events"]
        - stage: "3"
          label: "Operationalize data"
          detail: "Teams move attribution and user data into dashboards and data warehouses."
          touchpoints: ["API integration", "Data warehouse", "KPI dashboards"]
        - stage: "4"
          label: "Optimize spend"
          detail: "Customers use analytics and fraud controls to improve campaign decisions."
          touchpoints: ["Analytics", "Fraud protection", "Campaign optimization"]
        - stage: "5"
          label: "Re-engage users"
          detail: "Deep linking and audience tools support personalized journeys and reactivation."
          touchpoints: ["OneLink", "Audiences", "Retargeting"]
        - stage: "6"
          label: "Expand scope"
          detail: "Adoption can extend across channels, applications, agencies, and managed client accounts."
          touchpoints: ["CTV, PC, and console", "Additional applications", "Agency or reseller route"]
    approximationNotes: >-
      The ordering synthesizes documented workflows and public customer examples;
      it does not represent measured conversion rates or a common customer cohort.
    claimRefs: ["CU004", "CU007", "CU012", "CU014"]
callouts:
  - calloutType: "risk"
    title: "Retention quality remains a private-data question"
    body: >-
      Auto-renewal mechanics and a large reference catalog cannot substitute for
      NRR, GRR, churn, cohort, contract-length, and top-customer concentration
      data. Request a customer-level retention and expansion bridge before
      underwriting durability.
    claimRefs: ["CU013", "CU016"]
