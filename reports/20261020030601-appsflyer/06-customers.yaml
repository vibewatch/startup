schemaVersion: "report-v2"
artifact: "customers"
slug: "appsflyer"
runDate: "2026-10-20"
company:
  name: "AppsFlyer"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    AppsFlyer presents a broad customer franchise spanning 15,000 brands and
    multiple channels, company sizes, and verticals, with directories surfacing
    many named outcome stories. The public evidence is much weaker on durability:
    no NRR, GRR, churn, contract-length distribution, or top-customer
    concentration is disclosed, while standard contract terms introduce
    renewal and procurement considerations.
sections:
  - id: "customer-base"
    title: "Customer base and buying center"
    body: >-
      AppsFlyer's customer proposition is built for marketing and growth teams
      that need to attribute installs and post-install events across campaigns,
      partners, and channels. The company says it is trusted by 15,000 brands,
      a scale point corroborated by Forbes in September 2025, while Forbes also
      reported coverage of more than 100,000 apps and named CNN, Louis Vuitton,
      State Farm, and Whataburger as customers. Cuspera's taxonomy indicates
      reach across enterprise, mid-market, and small-business users and highlights
      Internet, information technology and services, and financial services.
      These are evidence of breadth, not a revenue mix: the assigned sources do
      not disclose customer counts, ACV, or revenue by segment, geography, or
      vertical.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005"]
    tableRefs: ["TU001"]
  - id: "adoption-proof"
    title: "Adoption and named-customer proof"
    body: >-
      Public proof is abundant but uneven. FeaturedCustomers lists a large
      case-study catalog and surfaces outcome claims for Pixonic, Telefónica,
      Letgo, Hotstar, and Albertsons; Cuspera carries testimonials and outcome
      summaries for Fondeadora and other brands. These examples indicate that
      AppsFlyer can sit inside production marketing workflows, including data
      warehouse reporting, attribution, deep linking, and reactivation. However,
      the directories do not consistently identify deployment dates, baselines,
      denominators, paid-plan status, or whether each result was independently
      verified. AppsFlyer's own homepage also presents several outcome metrics
      without enough adjacent text to map every number to a named customer and
      period, so those figures should be treated as promotional proof rather
      than a comparable adoption series.
    claimRefs: ["CU006", "CU007", "CU008", "CU009", "CU010"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-and-commercial-friction"
    title: "Durability, renewal, and concentration"
    body: >-
      The evidence set does not permit a retention-quality conclusion. No public
      NRR, GRR, logo churn, renewal rate, contract-length distribution, cohort,
      or customer-concentration metric appears in the assigned sources. The
      standard MSA instead provides only contractual mechanics: subscriptions
      generally auto-renew absent notice at least 30 days before term end, and a
      renewal fee increase above 7% triggers advance notice. Those terms may
      support commercial continuity, but they are not proof of voluntary product
      retention or expansion. Likewise, the free package can be changed or
      discontinued and its support is discretionary, creating a conversion path
      but also possible onboarding and procurement friction. Diligence therefore
      requires private cohort and concentration data before underwriting durable
      expansion.
    claimRefs: ["CU013", "CU014", "CU016"]
  - id: "journey-and-channels"
    title: "Customer journey and channel dependencies"
    body: >-
      The customer journey runs from campaign acquisition through attribution,
      reporting, optimization, deep linking, and cross-channel expansion.
      Official documentation places campaign, partner, and channel attribution
      at the entry point, while customer evidence shows data flowing into
      warehouses and dashboards. The MSA also supports authorized-reseller and
      agency routes, but agency use requires prior notice and an appropriate
      subscription package, making channel execution contractually managed rather
      than frictionless. A LinkedIn recommendation describes responsive
      cross-functional technical support over a two-year engagement, but the
      fetched excerpt does not identify the recommender's organization and is
      weak evidence of representative service quality. UpGuard's continuous
      vendor-risk monitoring further indicates that enterprise adoption carries
      a security-review surface, although the assigned text discloses no actual
      rating.
    claimRefs: ["CU004", "CU007", "CU011", "CU012", "CU015"]
    figureRefs: ["FU001"]
tables:
