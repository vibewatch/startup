  topStrengths:
    - >-
      A reported 15,000-brand footprint and broad cross-channel product surface support AppsFlyer's relevance as
      marketing-measurement infrastructure.
    - >-
      Minority investment from Moloco, Google, Meta, and Unity validates strategic interest while AppsFlyer says the
      arrangements remain non-controlling and non-exclusive.
    - >-
      Product breadth across attribution, deep linking, fraud protection, analytics, and data collaboration creates
      multiple potential expansion surfaces.
  topRisks:
    - >-
      The March 2026 Web SDK supply-chain compromise lacks public independent forensic close-out, quantified customer
      impact, and post-incident retention evidence.
    - >-
      Apple, Google, privacy rules, network APIs, and platform-native attribution can reduce signal availability or
      disintermediate independent measurement.
    - >-
      Audited revenue, ARR, growth, margins, retention, cash, customer concentration, and financing preference terms are
      unavailable.
  unresolvedGaps:
    - >-
      Obtain audited financial statements, ARR and revenue bridges, gross margin, NRR, GRR, churn, cash flow, cash,
      debt, and customer-concentration schedules.
    - >-
      Reconcile the Series E primary and secondary allocation, fully diluted capitalization, liquidation preferences,
      governance rights, fees, and use of proceeds.
    - >-
      Review the final Web SDK forensic report, affected-customer scope, losses, regulator or litigation exposure,
      insurance recovery, remediation testing, and retention cohorts.
    - >-
      Build a normalized comparable set and verify the second-hand $500 million ARR indication before using the reported
      $2.7 billion valuation as an entry benchmark.
