companyProfile:
  summary: >-
    Founded in 2011, AppsFlyer is a private marketing-measurement company led by co-founder and CEO Oren Kaniel. It has
    expanded from mobile attribution into a broader cross-channel platform and reports serving more than 15,000 brands,
    but its current economics and the commercial impact of the March 2026 Web SDK compromise are not publicly
    established.
