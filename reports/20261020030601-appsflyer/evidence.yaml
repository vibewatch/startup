    diligencePath: >-
      Request twelve months of status history, SLA attainment, severity-one postmortems, architecture diagrams, and
      regional resilience test results.
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public SDK repository activity, signed release cadence, package-download metrics, contributor history, or an
      equivalent practitioner-community signal.
    whyItMatters: The assigned evidence does not independently show integration health, release discipline, or developer adoption.
    diligencePath: >-
      Review official SDK repositories and package registries, reconcile release tags to supported versions, and
      interview integration partners.
  - type: private-evidence-only
    severity: material
    topic: web-sdk-incident
    missingEvidence: >-
      Final independent forensic report, confirmed blast radius, customer notification record, remediation validation,
      and post-incident retention or claims data.
    whyItMatters: >-
      The incident directly tests the integrity of a trusted distribution path, while the retained adverse source
      describes an investigation that was still ongoing.
    diligencePath: >-
      Obtain the final forensic report, affected-customer list, insurer and legal notices, corrective-action evidence,
      and independent retest.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current certification scope, penetration-test summary, secure-SDLC evidence, key-management design, data-residency
      map, and independent control exceptions.
    whyItMatters: Company-described privacy and security controls do not establish operating effectiveness or scope.
    diligencePath: >-
      Review current SOC and ISO reports under NDA, map sub-processors and regions, and sample control exceptions
      through remediation.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: product-roadmap
    missingEvidence: A committed roadmap with target dates, availability status, deprecation policy, and customer adoption by module.
    whyItMatters: >-
      Public support and launch material does not distinguish experiments, generally available products, and durable
      roadmap commitments.
    diligencePath: >-
      Request the product roadmap, release calendar, deprecation log, module-level usage, and design-partner conversion
      data.
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, logo and revenue churn, renewal rates, contract-length distribution, and customer cohorts by segment.
    whyItMatters: >-
      Durability and land-and-expand economics cannot be distinguished from auto-renewal mechanics or promotional
      references.
    diligencePath: >-
      Request monthly customer-level ARR cohorts for at least three years, including new, expansion, contraction, churn,
      reactivation, and renewal terms.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 customer revenue concentration and revenue mix by vertical, geography, channel, and
      product.
    whyItMatters: A broad brand count does not reveal exposure to a small number of large accounts or correlated vertical demand.
