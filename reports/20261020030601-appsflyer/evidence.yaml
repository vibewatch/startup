evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current executive roster, board list, observer rights, voting arrangements, and documented succession plan.
    whyItMatters: Leadership depth, investor influence, and key-person dependence cannot be assessed from the chief executive alone.
    diligencePath: >-
      Request the current organization chart, board minutes and composition, charter documents, investor-rights
      agreements, and succession materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Current audited revenue, ARR, growth, gross margin, retention, cash, debt, burn, and runway.
    whyItMatters: Customer and app counts do not establish revenue quality, profitability, or cash durability.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, cohort retention, revenue concentration, debt schedules,
      and bank statements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Transaction size, primary and secondary split, post-money valuation, security terms, ownership percentages, and
      governance rights for the June 2026 agreement.
    whyItMatters: Funding raised is not cash available, and the public announcement cannot establish valuation or dilution.
    diligencePath: >-
      Review executed financing documents, capitalization tables before and after closing, funds-flow statements, side
      letters, and regulatory closing records.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-history
    missingEvidence: An authoritative dated chronology for early financing, product, partnership, and governance milestones.
    whyItMatters: >-
      The assigned pool supports seven defensible date or reporting-period markers rather than a complete
      eight-plus-item company history.
    diligencePath: >-
      Request the corporate chronology and verify each milestone against original announcements, filings, and investor
      records.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: security-incident
    missingEvidence: >-
      First-party forensic closure, affected-customer counts, confirmed loss data, remediation validation, regulatory
      follow-through, and post-incident retention.
    whyItMatters: >-
      A third-party incident account and external monitoring page do not prove technical closure or quantify commercial
      impact.
    diligencePath: >-
      Obtain the final incident report, independent forensic attestation, regulator correspondence, customer notices,
      remediation testing, and post-incident churn analysis.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Category revenue, pricing and ACV distribution, paying-customer count, target-account universe, penetration, and a
      consistent growth series.
    whyItMatters: >-
      Activity volumes and brand counts cannot establish monetary TAM, SAM, SOM, market share, or the growth rate that
      should inform valuation.
    diligencePath: >-
      Obtain management's market model and customer-level ARR export, reconcile accounts to pricing tiers and
      geographies, and benchmark the resulting spend pool against an independent martech market study.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-map
    missingEvidence: >-
      Customer procurement records showing economic buyer, budget center, pricing unit, approval path, implementation
      time, and contract threshold.
    whyItMatters: >-
      The inferred buyer map cannot establish sales-cycle length, budget resilience, expansion mechanics, or switching
      friction.
    diligencePath: >-
      Sample recent wins, expansions, competitive replacements, and losses by segment; review order forms and interview
      buyer, user, finance, security, and procurement stakeholders.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: independent-market-size
    missingEvidence: >-
      An independent market-sizing source with explicit category definition, geography, base year, forecast period,
      revenue denominator, and CAGR.
    whyItMatters: >-
      Company activity metrics and an undocumented detected-site sample do not provide an independent check on market
      size or growth.
    diligencePath: >-
      Commission or obtain a full analyst market dataset and normalize its category boundary to AppsFlyer's attributable
      product and customer scope.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current competitor quotes, minimum commitments, volume tiers, add-on prices, discount schedules, overage terms,
      and realized customer pricing.
    whyItMatters: >-
      Without comparable contract economics, the analysis cannot determine whether AppsFlyer's breadth offsets a price
      premium or whether specialists can undercut it.
    diligencePath: >-
      Run an identical-volume request for proposal with AppsFlyer, Adjust, Branch, Singular, and Tenjin and normalize
      all mandatory add-ons and implementation costs.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Independent customer retention, churn, multi-homing, migration duration, implementation staffing,
      data-portability, and contract-termination evidence.
    whyItMatters: >-
      The moat thesis depends on whether integration complexity causes durable retention or merely temporary migration
      friction.
    diligencePath: >-
      Interview at least five recent renewals and three former customers, then inspect anonymized cohort retention and
      completed migration plans.
    relatedQuestionRefs:
      - QP009
  - type: stale
    severity: material
    topic: market-share
    missingEvidence: An independently sourced 2026 market-share estimate with a defined market denominator and methodology.
    whyItMatters: >-
      The available 60% figure is dated September 2025 and does not disclose a denominator, so it cannot establish
      current competitive share.
    diligencePath: >-
      Obtain a current MMP market-share study or triangulate audited customer spend, measured app volume, and
      major-account win-loss data.
    relatedQuestionRefs:
      - QP002
      - QP008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, ARR bridge, revenue mix, gross margin, operating expenses, free cash flow, and cash balance.
    whyItMatters: These inputs determine revenue quality, operating leverage, burn, and valuation support.
    diligencePath: Obtain audited statements, monthly management accounts, and a CFO-signed metric dictionary.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current price book, contract units, minimum commitments, discounting, and realized price by cohort.
    whyItMatters: Public product breadth cannot establish monetization quality or pricing power.
    diligencePath: Review anonymized order forms, pricing approvals, discount waterfalls, and renewal cohorts.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Dated monthly headcount reconciled across employees, contractors, regions, and functions.
    whyItMatters: Conflicting public figures make revenue-per-employee and cost trends unreliable.
    diligencePath: Obtain HRIS exports and reconcile them to payroll and management reporting.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Financing close documents, primary-versus-secondary split, use of funds, cash, debt, burn, and board-approved
      runway plan.
    whyItMatters: A headline financing amount cannot establish capital available to the business or the timing of another raise.
    diligencePath: Review the capitalization table, bank statements, debt schedule, financing documents, and 24-month cash forecast.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-incident
    missingEvidence: >-
      Final forensic report, customer impact, remediation completion, insurance recovery, retention effect, and legal or
      regulatory costs.
    whyItMatters: Trust-related costs and churn could alter margin, cash needs, and recurring revenue quality.
    diligencePath: >-
      Obtain the final incident report, board updates, insurer correspondence, customer concessions, and post-incident
      retention cohorts.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: platform-reliability
    missingEvidence: >-
      Customer-contract SLAs, uptime history, incident metrics, latency percentiles, capacity limits, regional failover
