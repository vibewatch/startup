company:
  name: AppsFlyer
chapter:
  number: 1
  title: Company Overview
  summary: >-
    AppsFlyer is a 2011-founded marketing measurement company that describes its evolution from
    mobile attribution into a broader Modern Marketing Cloud. Public evidence shows meaningful
    scale and new strategic backing, while current valuation, financing proceeds, governance,
    private-company financials, and the business impact of a March 2026 Web SDK compromise remain
    material diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      AppsFlyer was founded in 2011 and is headquartered in San Francisco according to Forbes'
      September 2025 company profile. Its core product answers an economically important marketing
      question: which campaigns, partners, and channels drove an app install or post-install event.
      AppsFlyer's own materials frame the company as having expanded beyond that mobile-attribution
      starting point into a Modern Marketing Cloud that also covers deep linking, fraud protection,
      advanced analytics, data collaboration, and AI-supported workflows. The retained materials
      support a software measurement and analytics identity, but they do not disclose current
      pricing architecture, contract duration, or the mix of subscription and usage-based revenue.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: scale-and-leadership
    title: Scale, leadership, and organizational visibility
    body: >-
      Oren Kaniel is identified as chief executive and co-founder by both AppsFlyer and Forbes,
      providing strong evidence for the top operating role. Scale indicators are substantial but
      unevenly dated: AppsFlyer's June 2026 announcement says the company serves more than 15,000
      brands, while Forbes' September 2025 profile reports more than 100,000 apps, 1,400 employees,
      an approximately $2 billion company value, and 60% market share. These are not interchangeable
      measures and should not be blended into a current valuation or revenue estimate. The assigned
      evidence does not establish a current executive roster, board composition, governance rights,
      or succession plan, leaving key-person and oversight diligence open.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital structure and strategic stakeholders
    body: >-
      On June 22, 2026, AppsFlyer announced a definitive investment agreement with Moloco, Google,
      Meta, and Unity. The company says each investment is minority, non-controlling, non-exclusive,
      and without preferential access to APIs, measurement signals, attribution logic, or commercial
      terms. It also says the transaction combines shareholder liquidity with new long-term strategic
      equity participation. Those protections matter because the investors include major ecosystem
      participants whose platforms and advertising economics intersect with measurement. However,
      the retained announcement does not disclose transaction size, security terms, primary versus
      secondary proceeds, ownership percentages, valuation, or governance rights, so it cannot support
      a new total-raised or cash-available figure.
    claimRefs: [CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-risk-signals
    title: Milestones and risk signals
    body: >-
      The operating history combines growth markers with two adverse signals. Forbes reported that
      AppsFlyer had laid off approximately 100 employees and linked the action to increased AI
      investment and prioritization of higher-value initiatives. Separately, Reflectiz reported that
      malicious JavaScript was injected into the AppsFlyer Web SDK on AppsFlyer's CDN between March 9
      and March 11, 2026, replacing cryptocurrency wallet addresses while the legitimate analytics
      functions continued. UpGuard's October 20, 2026 vendor-risk page confirms continuing external
      monitoring across five risk categories, but the accessible text does not expose a score or
      prove incident closure. Customer impact, remediation completeness, regulatory follow-through,
      and retention effects therefore remain unresolved.
    claimRefs: [CO011, CO012, CO015, CO016]
    figureRefs: [FO001]
