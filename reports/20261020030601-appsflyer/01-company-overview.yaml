          tone: neutral
          claimRefs: [CO016]
    approximationNotes: >-
      Two 2025 milestones are shown by the reporting period because the fetched Forbes excerpt names
      February and July without explicitly repeating a year; no date is inferred beyond that context.
    claimRefs: [CO001, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
callouts:
  - calloutType: risk
    title: Strategic capital does not establish independence
    body: >-
      AppsFlyer says the four investments are minority, non-controlling, and non-exclusive, but the
      assigned evidence does not disclose ownership, governance, side-letter, or information rights.
    claimRefs: [CO013, CO014]
  - calloutType: risk
    title: Incident closure is not demonstrated
    body: >-
      The retained adverse source describes a 48-hour Web SDK compromise; external monitoring is
      visible, but customer impact, remediation completion, and post-incident retention are not.
    claimRefs: [CO015, CO016]
