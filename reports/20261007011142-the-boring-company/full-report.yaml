chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Formation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              The Boring Company is a private U.S. infrastructure, tunnel-construction, and equipment business founded
              by Elon Musk on January 11, 2017. It began inside SpaceX and became a separate corporation in 2018;
              current profile sources place its headquarters in Bastrop, Texas. The operating model is vertically
              integrated rather than a pure equipment sale: the company says it designs and manufactures tunnel-boring
              machines and liners, designs and builds Loop systems, and operates those systems. Its official product
              surface also distinguishes transportation, utility, and freight tunnels. This integration may compress
              handoffs between machine iteration, construction, and operations, but public sources do not isolate
              revenue or margins by equipment, construction, fares, or other commercial activity.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
              - CO009
              - CO016
      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Publicly named leadership is unusually narrow. Elon Musk is identified as founder and owner, while Steve
              Davis is identified as chief executive officer and president. The sources describe Davis as an early
              SpaceX hire who had led work for Musk before becoming TBC president, providing a continuity link between
              the company's origin and current operations. However, the assigned evidence does not disclose a current
              board roster, voting rights, delegated authorities, succession plan, or ownership percentages. The
              diligence conclusion is therefore not that Musk has a particular current percentage or formal title beyond
              those reported, but that founder and executive continuity is visible while institutional governance is
              not. That asymmetry creates key-person and decision-rights questions that require private documents rather
              than inference.
            claimRefs:
              - CO003
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
      - number: '1.3'
        title: Capitalization and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Three independent sources report a September 10, 2026 Series D of $3 billion at a $23 billion valuation,
              led by the United Arab Emirates and joined by a broad investor syndicate. The phrasing is retained as "at
              a $23 billion valuation" because the reviewed pages do not consistently specify pre-money versus
              post-money treatment. A separate historical benchmark is the April 2022 Series C: Wikipedia reports $675
              million at approximately $5.675 billion, while Inc. rounds the valuation to $5.7 billion. Those figures
              establish disclosed rounds, not a complete cash bridge. Total capital raised, debt, grants, secondaries,
              proceeds already deployed, and cash currently available cannot be reconstructed reliably from the assigned
              evidence and remain explicit diligence gaps.
            claimRefs:
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
