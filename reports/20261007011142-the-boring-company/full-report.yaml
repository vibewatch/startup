  - id: FV001
    title: Recommendation Logic
    type: flow
    summary: >-
      The reported financing mark passes through operating-proof, execution-risk, and term-disclosure gates before it
      can support an investment recommendation.
    data:
      nodes:
        - id: financing
          label: $3B at $23B reported
          detail: Current financing scale is corroborated by independent reports, with minor variance in other databases.
        - id: historical-mark
          label: About 4x the 2022 mark
          detail: The valuation step-up raises the proof burden for operating economics.
        - id: technical-proof
          label: Company technical targets
          detail: Prufrock cost and speed targets require independent project-level verification.
        - id: commercial-proof
          label: Limited live network proof
          detail: Las Vegas was the only public-use Loop identified in the adverse reporting.
        - id: missing-terms
          label: Economics and terms missing
          detail: Revenue, margins, cash flow, current capitalization, and Series D preferences are not publicly established.
        - id: decision
          label: Research more
          detail: No defensible entry range or target return is supportable from the assigned evidence.
    approximationNotes: The flow is qualitative and ordered; it does not assign probabilities, implied values, or conversion rates.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV013
      - CV016
