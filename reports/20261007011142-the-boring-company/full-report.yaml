  - id: FM001
    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: >-
      The available evidence narrows from broad use cases to project scope, but stops before a defensible revenue-based
      SOM.
    data:
      items:
        - label: Use-case universe
          value: 3 named families
          detail: Transportation, utility, and freight tunnels are company-described categories, not quantified markets.
        - label: Institutional buyer filter
          value: Project-specific
          detail: Municipal, authority, sovereign, utility, and freight budgets require separate qualification.
        - label: Operating proof
          value: ~4 miles
          unit: Las Vegas tunnel footprint
          detail: Business Insider-reported current scale; not a market-size denominator.
        - label: Near-term disclosed projects
          value: 10 miles and >150 km
          detail: >-
            Nashville project length and planned UAE infrastructure have different status and cannot be summed as
            revenue.
        - label: Unit-cost thesis
          value: <$5M/mile
          unit: issuer target
          detail: Company target for a Loop transportation tunnel, not disclosed realized economics.
        - label: Auditable SOM
          value: Unknown
          detail: >-
            Contract values, win rates, comparable pipeline stages, project margins, and realization timing are not
            public.
    approximationNotes: >-
      No widths or conversion rates should be inferred; the ladder mixes categorical filters and separately qualified
      metrics rather than a common numeric population.
    claimRefs:
      - CM004
      - CM006
      - CM007
      - CM011
      - CM015
