  - id: FE001
    title: The Boring Company Subsurface Transit Technology Stack
    type: stack
    summary: >-
      Six-tier architectural hierarchy illustrating the operational layers from deep excavation to dispatch and
      ride-hailing services.
    data:
      layers:
        - label: Passenger Application & Dispatch Layer
          detail: Mobile ride-hailing interface, station queue dispatch, passenger routing algorithms
        - label: Vehicle Fleet & Guiding Infrastructure
          detail: Tesla electric passenger vehicles, closed-loop roadway paving, automated charging portals
        - label: Station Transit Hubs & Surface Portals
          detail: Surface escalator banks, subsurface passenger loading berths, turnstiles, and fire life safety egress
        - label: Tunnel MEP & Safety Infrastructure
          detail: Active thermal ventilation, emergency egress, CCTV networks, fiber telemetry, wastewater handling
        - label: Structural Liner & Civil Shell Layer
          detail: Precision precast concrete ring segments, high-strength annular grout, continuous drainage channels
        - label: Subsurface Excavation & Spoil Transport Layer
          detail: Prufrock TBM cutterhead, continuous muck conveyor systems, Zero-People-In-Tunnel Bastrop telemetry
    approximationNotes: >-
      Architectural decomposition synthesized from engineering disclosures, supply-chain analysis, and regulatory
      records.
    claimRefs:
      - CE004
      - CE009
      - CE010
  - id: FU001
    title: Observed customer-development path and evidence breaks
    type: journey-map
    summary: >-
      The path from municipal interest to durable operations contains separate commercial, approval, construction, and
      retention gates.
    data:
      items:
        - label: Interest
          summary: Authorities or project sponsors express interest through direct negotiations or a challenge submission.
          touchpoints:
            - Municipal proposal
            - Challenge submission
        - label: Commercial framing
          summary: >-
            The parties determine whether the project is paid, privately funded by The Boring Company, sovereign-backed,
            or a free demonstration.
          touchpoints:
            - Funding allocation
            - Contract or award
        - label: Approvals
          summary: Easements, permits, geotechnical review, and regulator coordination gate progress.
          touchpoints:
            - Right-of-way
            - Permits
        - label: Construction
          summary: Tunneling alone is insufficient; stations and operational approvals must also be completed.
          touchpoints:
            - Tunnel boring
            - Station readiness
        - label: Operations
          summary: Passenger trips or industrial movements provide production evidence only after commissioning.
          touchpoints:
            - Commissioning
            - Measured usage
        - label: Durability and expansion
          summary: >-
            Renewals, contract length, recurring economics, and customer concentration remain undisclosed in the
            assigned evidence.
          touchpoints:
            - Renewal
            - Expansion decision
    approximationNotes: >-
      Qualitative sequence synthesized from the retained project evidence; it is not a measured conversion funnel and
      implies no conversion rate.
    claimRefs:
      - CU012
      - CU016
