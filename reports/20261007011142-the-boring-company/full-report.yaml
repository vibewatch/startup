      - number: '1.4'
        title: Scale, Milestones, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Las Vegas is the only Loop operation described by CNBC as live for public use, despite a much wider
              history of announced projects. The LVCC Loop opened in 2021 as a 1.7-mile, three-station system; later
              extensions and entitlements should not be conflated with that original operating footprint. Nashville
              provides the clearest current construction sequence: the company announced Music City Loop in July 2025,
              reported tunneling underway by April 2026, and reported two machines actively tunneling by August, with a
              third launch site targeted for late October. These are company-issued progress statements. Independent
              reporting also records abandoned or unrealized city proposals and environmental or workplace violations in
              Nevada and Texas, so financing scale and active tunneling do not by themselves resolve delivery,
