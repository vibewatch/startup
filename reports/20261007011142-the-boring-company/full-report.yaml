              - CI013
              - CI014
      - number: '4.3'
        title: Unit Economics, Capital Intensity, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Underwriting The Boring Company requires evaluating whether proprietary tunneling technology can overcome
              structural civil engineering capital intensity. The company's core economic hypothesis rests on its
              proprietary Prufrock series of tunnel boring machines, manufactured and remotely operated from its
              Bastrop, Texas headquarters. Prufrock is engineered for continuous mining, porpoising surface launch
              without excavation pits, and Zero-People-In-Tunnel operations, targeting an operational speed of one mile
              per week and an all-in tunneling cost under $5 million per mile. In soft soil conditions at Westgate Las
              Vegas, Prufrock-2 proved mechanical endurance with a continuous drive record of 2.28 miles.


              However, realized unit economics across diverse geologies remain unverified by independent engineering
              audits. The company faces significant cost headwinds in rock formations, prompting deployment of the
              Prufrock-MB hard-rock variant for Nashville limestone. Furthermore, regulatory and operational risks
              impose recurring balance-sheet drag: the company has been cited for approximately 800 environmental and
              workplace violations by Nevada regulators, including worker chemical burns. At an implied valuation of $23
              billion against an operating revenue base under $50 million, the implied price-to-sales multiple exceeds
              460x, rendering traditional multiple underwriting inapplicable and isolating investment return purely on
              the execution of unproven global capital expenditure backlogs.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Extreme Valuation Multiple Decoupled from Realized Farebox Cash Flow
            body: >-
              At a post-money valuation of $23 billion and an estimated current operational revenue run-rate below $50
              million, The Boring Company trades at an implied revenue multiple between 460x and 2,300x. The company
              cannot be underwritten on conventional enterprise cash flows, relying entirely on the successful
              multi-billion dollar project execution of international infrastructure agreements in the UAE and private
              toll concessions in Nashville. Historical municipal tunnel initiatives in cities such as Chicago and Los
              Angeles failed to progress beyond initial planning.
            calloutType: risk
            claimRefs:
              - CI001
              - CI012
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Service Definition
        blocks:
          - type: paragraph
            body: >-
              The Boring Company approaches civil infrastructure as a standardized product line rather than a bespoke
              public works contracting service. Its commercial portfolio centers on Loop, an all-electric underground
              point-to-point passenger transportation network designed to eliminate intermediate station stops and
              bypass surface traffic congestion. While public transit projects historically require cavernous
              underground subway excavations, Loop tunnels utilize a standardized narrow-diameter bore of approximately
              twelve feet, engineered specifically to accommodate passenger cars and light fleet vehicles. Beyond
              passenger mobility, the company defines four utility and freight tunnel variations: Utility tunnels for
              municipal and industrial conduit routing, Freight tunnels engineered to accommodate standard intermodal
              shipping containers, Pedestrian pathways for grade-separated walking and cycling corridors, and Bare
              tunnels delivered as structural shells for third-party fit-out. Across all offerings, the core delivery
              unit is not merely excavation contracting but a turnkey subsurface conduit system.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Prufrock TBM Architecture and Excavation Mechanics
        blocks:
          - type: paragraph
            body: >-
              The core technological asset underpinning The Boring Company's cost-reduction model is its proprietary
              Prufrock family of tunnel boring machines (TBMs), engineered and manufactured internally at the company's
              Bastrop, Texas headquarters. Traditional soft-soil TBMs operate on discontinuous stop-start excavation
              cycles, advancing roughly five feet before halting to manually erect precast concrete lining rings. In
              contrast, Prufrock integrates continuous mining and simultaneous lining erection, placing precast concrete
              segments without interrupting forward cutterhead advance. To eliminate costly, high-disruption launch pits
              and crane setups that burden dense urban areas, Prufrock employs a porpoising capability: arriving on a
              transport trailer, tilting downward, and launching directly from the surface within 24 hours, followed by
              surfacing onto a recovery trailer upon project completion. Furthermore, the machine is designed for
              Zero-People-In-Tunnel (ZPIT) operation, managed remotely from the Bastrop Operations Control Center. To
              handle varied ground conditions, the company developed Prufrock-MB, a specialized hard-rock variant
              designed for self-supporting formations such as the limestone formations encountered on the Music City
              Loop project.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE009
              - CE010
      - number: '5.3'
        title: Operating Model, Fleet Dependencies, and Environmental Compliance
        blocks:
          - type: paragraph
            body: >-
              The Boring Company's operating model relies on a tightly coupled four-part supply chain consisting of
              in-house machine manufacturing, external precast concrete lining procurement, surface and station MEP
              (mechanical, electrical, and plumbing) contracting, and fleet vehicle sourcing from sister company Tesla.
              Every active passenger trip on the Las Vegas Loop relies on human-driven Tesla vehicles operating in
              closed tunnel segments. While this closed subterranean environment theoretically provides an ideal proving
              ground for autonomous transit, actual system throughput remains strictly bounded by human driver staffing,
              station staging capacity, and vehicle dwell times until unsupervised autonomy is validated and licensed.
              Simultaneously, rapid underground deployment has encountered material environmental and workplace safety
              friction. State regulatory inspections in Nevada resulted in seventeen complaints and eight proposed
              citations between 2020 and 2026, encompassing worker chemical burns from accelerants, lack of emergency
              decontamination showers, and roughly $600,000 in regulatory fines primarily associated with untreated
              wastewater discharge. These incidents demonstrate that automated tunneling speed cannot bypass surface
              environmental oversight or industrial hygiene mandates.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Industrialization of Subsurface Excavation
            body: >-
              The Boring Company's most consequential engineering achievement is treating tunnel construction as an
              industrialized manufacturing assembly line rather than a bespoke civil construction project. By
              standardizing on a single 12-foot tunnel diameter, building reusable electric TBMs in-house, and
              synchronizing segment placement with continuous excavation, the company structurally attacks the largest
              cost and schedule drivers in underground tunneling.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: callout
            title: The Fleet Autonomy and Municipal Permitting Bottleneck
            body: >-
              Despite rapid tunneling engineering progress, the commercial throughput of the Loop system remains
              strictly throttled by external dependencies. Driver wages and vehicle availability currently bound network
              economics until Tesla delivers unsupervised autonomous driving. Furthermore, with only approximately 100
              of the 600 required permits secured in Las Vegas by early 2026, administrative approvals and surface
              station delivery represent a greater barrier to scale than machine advance rates.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports an infrastructure-customer model rather than a conventional account-based
              software model. Public or quasi-public authorities approve and procure urban transit projects; convention
              attendees and other travelers are the end users; venue and property partners host stations; and The Boring
              Company can itself fund construction where it is trying to seed a market. Dubai introduces a sovereign
              transit counterparty, while Tesla's Giga Texas tunnel is a related-party industrial logistics deployment
              rather than arm's-length passenger-transit proof. The company also says it designs, builds, and operates
              Loop, so the customer relationship spans construction and ongoing operations. Public sources do not
              consistently identify who bears construction cost, operating cost, or fare risk for each project, and they
              do not disclose customer-level revenue.
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
      - number: '6.2'
        title: Operating Adoption Versus Approved Scale
        blocks:
          - type: paragraph
            body: >-
              Las Vegas supplies the only substantial operating adoption evidence in the assigned pool. Tesorb reports
              more than 4 million passengers across 11 stations, and both Tesorb and MeHandA report roughly 82,000
              riders during five days of CONEXPO-CON/AGG 2026. Those are cumulative-trip and event-throughput measures,
              not unique-customer, repeat-use, paid-ride, or retention measures. Business Insider describes the
              operating system as roughly four miles of tunnels, while secondary sources cite approvals for a much
              larger 68-mile, 104-station buildout. Approved miles and stations therefore measure regulatory or
              development runway, not active adoption. Likewise, 487 Tunnel Vision Challenge submissions indicate
              municipal interest, but free-build awards and pre-feasibility work should not be counted as paying
              customers or production deployments.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
              - CU010
      - number: '6.3'
        title: Named Proof and Stage Quality
        blocks:
          - type: paragraph
            body: >-
              Named relationships differ materially in evidence quality. Las Vegas is operating and has passenger-volume
              evidence. Tesla's Cybertunnel is also described as operational, but it is a related-party
              factory-logistics use case whose economics are not disclosed. Nashville is a construction and replication
              test rather than a demonstrated customer outcome. Dubai is reported as a signed international contract in
              design or pre-construction, and the broader UAE relationship covers planned infrastructure rather than
              delivered kilometers. Dallas and New Orleans are free demonstration awards still described as
              feasibility-stage opportunities. The assigned sources therefore support a pipeline of counterparties and
              use cases, but only Las Vegas provides public passenger adoption at meaningful scale.
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
      - number: '6.4'
        title: Durability, Concentration, and Expansion Risk
        blocks:
          - type: paragraph
            body: >-
              Customer durability cannot be established from the assigned public evidence. None of the retained sources
              reports renewal rates, NRR, GRR, churn, contract length, customer-level revenue, or the share of economics
              attributable to Las Vegas, Tesla, Nashville, Dubai, or the UAE. The clearest concentration signal is
              operational: Business Insider calls Vegas Loop the company's main project, while Nashville, Dubai, and
              challenge awards remain construction-stage, planned, or pre-feasibility. Older Los Angeles, Washington,
              DC, and Chicago plans were reportedly shelved or canceled, showing that announced municipal interest does
              not guarantee conversion. Permitting and station readiness are also reported bottlenecks. Expansion should
              therefore be underwritten as a gated conversion process, not as an automatic land-and-expand loop.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU012
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Trip counts are not retention evidence
            body: >-
              More than 4 million cumulative Vegas Loop trips and approximately 82,000 CONEXPO trips show usage, but the
              sources do not disclose unique riders, repeat frequency, renewal behavior, fare mix, or customer-level
              revenue. These totals should not be converted into retention, recurring-revenue, or customer-count claims.
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
              - CU013
          - type: callout
            title: The pipeline mixes customers, counterparties, and subsidized leads
            body: >-
              An operating authority, a sovereign project sponsor, a related-party industrial user, and a free
              demonstration winner are not equivalent commercial proof. The evidence is strongest for Las Vegas
              operations, narrower for Tesla's related-party use, and prospective for Nashville, Dubai, the wider UAE
              relationship, Dallas, and New Orleans.
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Oversight, Occupational Safety, and Environmental Non-Compliance
        blocks:
          - type: paragraph
            body: >-
              The Boring Company encounters intense regulatory scrutiny and administrative enforcement across its civil
              excavation projects. In Nevada, workplace safety inspections revealed repeated hazardous chemical burns
              suffered by employees in the tunnels, leading Nevada OSHA to issue citations and propose monetary fines
              totaling over $112,000 in 2023 [CR001]. Ongoing investigations have examined contested citations regarding
              chemical burns, alongside severe incidents including an employee shocked on the job and another crushed,
              while state legislative leadership has formally demanded an independent review into structural failures
              and public record alteration within state safety oversight [CR002]. Environmental non-compliance presents
              an equally disruptive exposure: state and local environmental regulators documented repeated unpermitted
              groundwater and untreated wastewater discharges into municipal storm drains and sanitary sewers in Clark
              County, prompting multiple cease-and-desist enforcement orders and administrative settlement penalties
              [CR003]. These compliance failures demonstrate that accelerated tunneling speeds risk recurring
              operational suspensions and permit revocations when industrial hygiene and municipal environmental rules
              are bypassed [CR004].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Throughput, Autonomous Transition, and Geology Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The operational durability of the Loop transit concept is tightly bounded by machine performance and
              vehicle throughput limitations. The Boring Company has targeted an excavation velocity of one mile per
              week and an all-in cost below $5 million per mile via its proprietary Prufrock machine architecture,
              featuring Zero-People-In-Tunnel continuous mining and trailer-based surface porpoising [CR005]. However,
              the Las Vegas Loop system remains far below its fully entitled 68-mile and 104-station municipal scope
              after multiple years of active development, leaving the vast majority of planned urban network capacity
              unbuilt [CR006]. Furthermore, passenger operations remain heavily reliant on human-driven Tesla vehicles
              traveling at moderate operational speeds of 35 to 45 mph, constraining real-world system throughput far
              below the 90,000 passengers per hour theoretical peak claimed for future autonomous vehicle platooning
              [CR007]. Technical scaling also faces substantial geological hurdles, requiring the deployment of
              specialized hard-rock variants such as Prufrock-MB to tackle high-strength limestone in Nashville, where
              unproven cutting head wear rates could escalate civil engineering costs [CR008].
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.3'
        title: Counterparty Dependence, Single-Source Fleet Risks, and Sovereign Exposure
        blocks:
          - type: paragraph
            body: >-
              The company's commercial architecture exhibits extreme counterparty concentration across governance,
              vehicle supply, and international project capitalization. TBC's operational transit systems depend
              entirely on Tesla passenger electric vehicles, creating a single-source fleet bottleneck where vehicle
              supply, mechanical maintenance, software integration, and vehicle pricing remain tied to an affiliated
              entity [CR009]. At the governance level, strategic authority and municipal negotiations are concentrated
              around founder Elon Musk, creating material key-person dependence that amplifies political friction and
              public scrutiny during municipal right-of-way approvals [CR010]. In municipal business development,
              initial proposals in major cities including Chicago and Los Angeles were abandoned or failed to advance
              beyond early exploratory stages following regulatory and public resistance [CR011]. Simultaneously, the
              company's $3.0B Series D round at a $23.0B valuation establishes heavy geographic and capital
              concentration in the United Arab Emirates, where commitments to build over 150 kilometers of underground
              infrastructure link future valuation marks to foreign project execution [CR012].
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Mitigation Roadmap, Thesis-Break Triggers, and Diligence Criteria
        blocks:
          - type: paragraph
            body: >-
              Evaluating investment risk requires establishing concrete, monitorable kill criteria tied to measurable
              operating, regulatory, and financial milestones. TBC's mitigation efforts center on remote machine
              operation from its Bastrop Operations Center, third-party structural and environmental audits, and
              crowdsourced project pipelines such as the Tunnel Vision Challenge, which drew 487 global tunneling
              proposals to source viable private and utility corridors [CR013]. Nonetheless, a critical thesis-break
              trigger would be the revocation of municipal franchise or tunneling permits in Clark County or Nashville
              following repeat environmental or safety violations [CR014]. An additional thesis break would occur if
              passenger transit capacity fails to transition from human drivers to certified, driverless autonomous
              operation, permanently stranding Loop passenger throughput below that of standard bus rapid transit or
              municipal rail lines [CR015]. Lastly, failure to deliver early construction milestones across the
              150-kilometer UAE infrastructure program would invalidate the $23.0B private valuation and threaten the
              viability of sovereign-backed turnkey expansion [CR016].
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Enforcement and Public Record Integrity Concerns
            body: >-
              The Boring Company faces acute regulatory exposure from overlapping workplace safety and environmental
              investigations in Nevada. With eight contested citations regarding chemical burns and public records
              inquiries into withdrawn citations and altered files, administrative delays in the OSHA Review Board have
              prompted state legislative leaders to demand an executive investigation, heightening the risk of stricter
              oversight and operational pauses [CR001, CR002, CR003].
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: The Autonomy Dependency Conundrum
            body: >-
              While TBC pitches Loop systems as high-capacity mass transit capable of moving up to 90,000 passengers per
              hour, current commercial operations remain dependent on human drivers in Tesla sedans traveling at 35 to
              45 mph. Without regulatory certification and commercial rollout of fully driverless autonomous vehicle
              fleets, real-world system capacity cannot rival traditional urban rail transit, capping long-term
              infrastructure value [CR007, CR015].
            calloutType: insight
            claimRefs:
              - CR007
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a research-more recommendation rather than a buy at the reported $23
              billion financing mark. CNBC and Blockonomi report that The Boring Company raised $3 billion in September
              2026 at that valuation, while Tracxn records a $3.2 billion Series D and a separate $20 billion valuation
              data point. The variance is not large enough to change the decision, but it shows that private-round
              figures require primary closing documents before use in a return model. More importantly, none of the
              reviewed sources supplies audited revenue, project gross margin, free cash flow, cash available after the
              round, or a current fully diluted capitalization table. A large funding round is therefore evidence of
              financing capacity, not evidence that the quoted equity value is supported by operating cash generation.
              Entry discipline should remain conditional on verified economics and security terms rather than on company
              quality alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV011
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV013
              - CV016
      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is that fresh capital can fund a much larger operating test. Independent reports connect
              the round to projects in Las Vegas, Nashville, Dubai, and more than 150 kilometers of planned UAE
              infrastructure. The company also claims Prufrock targets one mile per week and less than $5 million per
              mile, using continuous mining, remote operation, and a vertically integrated design-build-operate model.
              If those claims are independently demonstrated across different geologies and converted into contracted,
              profitable backlog, the company could justify a strategic premium over ordinary contractors. The
              anti-thesis is equally material: CNBC reports that Las Vegas remained the only live public-use Loop, that
              several announced projects had fizzled, and that the company had accumulated environmental and
              workplace-safety issues. Financing scale therefore runs ahead of demonstrated network scale. The core
              diligence question is whether capital accelerates repeatable economics or merely funds a larger set of
              bespoke civil projects.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Financing Context and Scenarios
        blocks:
          - type: paragraph
            body: >-
              The reported valuation has risen approximately fourfold from the roughly $5.7 billion Series C mark in
              April 2022 to $23 billion in September 2026. That step-up is directionally consistent with a much larger
              funding round and international expansion ambition, but it is not a substitute for a model-appropriate
              valuation bridge. The public record also moved quickly: in July, The Wall Street Journal described talks
              for roughly $4 billion at around $20 billion and emphasized that the round had not closed; later reports
              described a completed $3 billion round at $23 billion. Bull, base, and bear cases should therefore be
              framed as evidence gates rather than invented point estimates. The bull case needs verified tunnel
              economics and contracted project conversion. The base case assumes capital supports execution while the
              valuation remains unprovable from public financials. The bear case is project slippage, regulatory
              friction, or financing-term pressure that exposes downside toward earlier private marks.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Liquidity, Exit Readiness, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Public exit readiness is weak. Forge states that The Boring Company has not endorsed an IPO plan and
              labels market activity limited; its detailed preference data describes the 2022 Series C, not the 2026
              financing. Consequently, the current dilution, liquidation preference, participation, governance, and
              secondary-transfer overhang remain unknown. A final decision requires the Series D capitalization table
              and financing documents, audited project-level economics, cash-use and runway data, evidence that
              announced projects are binding rather than preliminary, and an independent reconciliation of safety and
              environmental obligations. Thesis-break triggers should be explicit: inability to substantiate the claimed
              tunneling cost and speed, material cancellations or delays in funded projects, restrictions caused by
              enforcement, or financing terms that transfer most downside protection to preferred investors. Until those
              items are resolved, neither a numerical target return nor a credible hold period can be calculated from
              the assigned public evidence.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment Committee Decision
            body: >-
              Research more. Reopen pricing only after audited operating economics, current financing terms, contracted
              project conversion, and an actionable liquidity path are available.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV015
              - CV016
