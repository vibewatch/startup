      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The likely economic buyer is institutional rather than an individual rider. AskCyborg characterizes the
              go-to-market motion as direct sales to municipalities and government entities, supplemented by
              public-private partnerships; its AI-synthesized methodology makes that directional rather than definitive.
              Convention and tourism authorities, sovereign urban-development sponsors, transport agencies, and utility
              or freight owners may each own different budgets even when end users experience the same tunnel. Adoption
              therefore depends on a sponsor assembling permits, rights-of-way, financing, and operating authority
              before construction begins. The $3 billion financing round provides company capital, but it is not
              customer demand, contracted backlog, buyer budget, or cash available for any single project.
            claimRefs:
              - CM005
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM009
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The core adoption thesis is that standardized geometry, continuous mining, remote operation, and vertical
              integration can lower cost and shorten schedules enough to unlock projects that conventional delivery
              cannot justify. The evidence is still asymmetric: the cost and speed figures are company targets, while
              independent reporting records that proposed Los Angeles, Washington, and Chicago tunnels were shelved or
              canceled. Procurement is also long-cycle, capital-intensive, jurisdiction-specific, and exposed to
              permitting and geological execution. The UAE scope could demonstrate repeatability at a materially larger
              footprint, but until realized costs, utilization, contract values, and project-level returns are
              disclosed, valuation rests more on future market penetration than on an auditable captured-market base.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM012
              - CM014
              - CM015
