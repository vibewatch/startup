      Technical cost and speed figures are company targets, while operating footprint and adverse history are attributed
      to independent reporting; neither is treated as audited economics.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: Bull, Base, and Bear Scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - >-
          UAE and domestic plans become binding, Prufrock targets are independently verified, and projects show
          repeatable positive margins
        - >-
          A premium could become supportable, but no numerical range is defensible without audited economics and current
          security terms
        - 'Signal: contracted backlog and audited margin evidence; trigger: failure to reproduce cost or speed claims'
      - - Base
        - Fresh capital funds execution, but public financial disclosure and broad network proof remain limited
        - >-
          The reported $23B mark remains a financing reference rather than a fair-value conclusion; target return is not
          calculable
        - >-
          Signal: milestone delivery without enough economics for valuation; trigger: prolonged disclosure or
          project-conversion gaps
      - - Bear
        - >-
          Project delays, enforcement constraints, weak utilization, or investor protections absorb the apparent
          financing cushion
        - >-
          Downside could revisit earlier private marks or impair capital, but assigning a precise floor would be false
          precision
        - >-
          Signal: cancellations, sanctions, or adverse financing terms; trigger: material project slippage or preference
          overhang
    notes: >-
      No calibrated probabilities or invented valuation ranges are shown because assigned public sources omit audited
      operating forecasts, current cap-table data, and complete Series D terms.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV013
      - CV015
      - CV016
