  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: integrated small-diameter tunnel delivery'
        blocks:
          - type: paragraph
            body: >-
              The investable market is not all underground construction, public transit, or urban mobility. The
              company's own product boundary covers transportation, utility, and freight tunnels, while its delivery
              model combines tunnel-boring-machine and liner manufacturing with Loop design, construction, and
              operation. That vertical integration points to project revenue and potentially operating revenue rather
              than a pure equipment market. The relevant spend pool is therefore the subset of municipal, authority,
              sovereign-development, utility, and freight budgets that can use standardized tunnels. Conventional
              surface roads, rail, buses, traditional tunnel contractors, and doing nothing remain substitutes, but
              their total spending should not be counted as addressable revenue without project-level conversion
              evidence.
