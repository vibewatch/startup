    body: "An operating authority, a sovereign project sponsor, a related-party industrial user, and a free demonstration winner are not equivalent commercial proof. The evidence is strongest for Las Vegas operations, narrower for Tesla's related-party use, and prospective for Nashville, Dubai, the wider UAE relationship, Dallas, and New Orleans."
