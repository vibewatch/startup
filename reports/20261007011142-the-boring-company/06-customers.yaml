    body: "More than 4 million cumulative Vegas Loop trips and approximately 82,000 CONEXPO trips show usage, but the sources do not disclose unique riders, repeat frequency, renewal behavior, fare mix, or customer-level revenue. These totals should not be converted into retention, recurring-revenue, or customer-count claims."
