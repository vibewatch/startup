company:
  name: "The Boring Company"
chapter:
  number: 6
  title: "Customers"
  summary: "The strongest customer proof is concentrated in the operating Las Vegas network, where secondary sources report more than 4 million cumulative passenger trips and an 82,000-rider convention surge. Nashville, Dubai, UAE-wide infrastructure, and free demonstration tunnels broaden the pipeline, but most are not yet operating and the assigned evidence does not disclose retention, customer-level revenue, contract duration, or concentration."
sections:
  - id: "buyer-user-payer-segmentation"
    title: "Buyer, User, and Payer Segmentation"
    body: >-
      The retained evidence supports an infrastructure-customer model rather than a conventional account-based software model. Public or quasi-public authorities approve and procure urban transit projects; convention attendees and other travelers are the end users; venue and property partners host stations; and The Boring Company can itself fund construction where it is trying to seed a market. Dubai introduces a sovereign transit counterparty, while Tesla's Giga Texas tunnel is a related-party industrial logistics deployment rather than arm's-length passenger-transit proof. The company also says it designs, builds, and operates Loop, so the customer relationship spans construction and ongoing operations. Public sources do not consistently identify who bears construction cost, operating cost, or fare risk for each project, and they do not disclose customer-level revenue.
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU013"
    tableRefs:
      - "TU001"
  - id: "operating-adoption-versus-approved-scale"
    title: "Operating Adoption Versus Approved Scale"
    body: >-
      Las Vegas supplies the only substantial operating adoption evidence in the assigned pool. Tesorb reports more than 4 million passengers across 11 stations, and both Tesorb and MeHandA report roughly 82,000 riders during five days of CONEXPO-CON/AGG 2026. Those are cumulative-trip and event-throughput measures, not unique-customer, repeat-use, paid-ride, or retention measures. Business Insider describes the operating system as roughly four miles of tunnels, while secondary sources cite approvals for a much larger 68-mile, 104-station buildout. Approved miles and stations therefore measure regulatory or development runway, not active adoption. Likewise, 487 Tunnel Vision Challenge submissions indicate municipal interest, but free-build awards and pre-feasibility work should not be counted as paying customers or production deployments.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU010"
      - "CU015"
    tableRefs:
      - "TU002"
  - id: "named-proof-and-stage-quality"
    title: "Named Proof and Stage Quality"
    body: >-
      Named relationships differ materially in evidence quality. Las Vegas is operating and has passenger-volume evidence. Tesla's Cybertunnel is also described as operational, but it is a related-party factory-logistics use case whose economics are not disclosed. Nashville is a construction and replication test rather than a demonstrated customer outcome. Dubai is reported as a signed international contract in design or pre-construction, and the broader UAE relationship covers planned infrastructure rather than delivered kilometers. Dallas and New Orleans are free demonstration awards still described as feasibility-stage opportunities. The assigned sources therefore support a pipeline of counterparties and use cases, but only Las Vegas provides public passenger adoption at meaningful scale.
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "durability-concentration-and-expansion"
    title: "Durability, Concentration, and Expansion Risk"
    body: >-
      Customer durability cannot be established from the assigned public evidence. None of the retained sources reports renewal rates, NRR, GRR, churn, contract length, customer-level revenue, or the share of economics attributable to Las Vegas, Tesla, Nashville, Dubai, or the UAE. The clearest concentration signal is operational: Business Insider calls Vegas Loop the company's main project, while Nashville, Dubai, and challenge awards remain construction-stage, planned, or pre-feasibility. Older Los Angeles, Washington, DC, and Chicago plans were reportedly shelved or canceled, showing that announced municipal interest does not guarantee conversion. Permitting and station readiness are also reported bottlenecks. Expansion should therefore be underwritten as a gated conversion process, not as an automatic land-and-expand loop.
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU016"
    figureRefs:
      - "FU001"
