  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-and-economics-gap"
      missingEvidence: "Customer-level revenue, contract duration, renewal terms, NRR, GRR, churn, repeat-purchase behavior, and fare or operating-revenue splits."
      whyItMatters: "Without recurring economics or renewal data, cumulative passenger trips cannot establish durable customer value or repeatable revenue."
      diligencePath: "Request signed customer contracts, renewal schedules, customer-level revenue cohorts, fare settlement reports, and board-approved operating budgets in the diligence data room."
      relatedQuestionRefs:
        - "QU004"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Revenue, backlog, capital commitments, and operating obligations by Las Vegas, Tesla, Nashville, Dubai, the UAE, and other counterparties."
      whyItMatters: "The public evidence shows operating concentration in Las Vegas but cannot quantify economic concentration or exposure to any single payer."
      diligencePath: "Obtain a customer and project concentration schedule reconciling signed backlog, recognized revenue, committed capex, cancellation rights, and counterparty credit support."
      relatedQuestionRefs:
        - "QU005"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customer-proof"
      missingEvidence: "An exhaustive, contract-backed list of every operating, signed, awarded, canceled, and inactive customer project."
      whyItMatters: "The public pipeline mixes operating customers, contracts, approvals, free awards, and proposals, which can overstate conversion and diversification."
      diligencePath: "Reconcile management's project roster against executed contracts, authority minutes, permit records, cancellation notices, and commissioning certificates."
      relatedQuestionRefs:
        - "QU005"
      relatedTableRefs:
        - "TU003"
    - type: "missing-source"
      severity: "material"
      topic: "independent-operating-audit"
      missingEvidence: "Audited station-level ridership, unique-rider counts, paid-versus-free trip mix, uptime, wait time, safety incidents, and repeat-use cohorts."
      whyItMatters: "Secondary cumulative and event totals do not show everyday utilization, service quality, monetization, or retention."
      diligencePath: "Request operator logs and authority audit reports, then reconcile them to fare records and independent station-level traffic counts."
      relatedQuestionRefs:
        - "QU004"
