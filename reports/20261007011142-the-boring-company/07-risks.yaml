callouts:
  - calloutType: "risk"
    title: "Regulatory Enforcement and Public Record Integrity Concerns"
    body: "The Boring Company faces acute regulatory exposure from overlapping workplace safety and environmental investigations in Nevada. With eight contested citations regarding chemical burns and public records inquiries into withdrawn citations and altered files, administrative delays in the OSHA Review Board have prompted state legislative leaders to demand an executive investigation, heightening the risk of stricter oversight and operational pauses [CR001, CR002, CR003]."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "The Autonomy Dependency Conundrum"
    body: "While TBC pitches Loop systems as high-capacity mass transit capable of moving up to 90,000 passengers per hour, current commercial operations remain dependent on human drivers in Tesla sedans traveling at 35 to 45 mph. Without regulatory certification and commercial rollout of fully driverless autonomous vehicle fleets, real-world system capacity cannot rival traditional urban rail transit, capping long-term infrastructure value [CR007, CR015]."
    claimRefs:
      - "CR007"
      - "CR015"
