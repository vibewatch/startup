callouts:
  - calloutType: "insight"
    title: "The Industrialization of Subsurface Excavation"
    body: "The Boring Company's most consequential engineering achievement is treating tunnel construction as an industrialized manufacturing assembly line rather than a bespoke civil construction project. By standardizing on a single 12-foot tunnel diameter, building reusable electric TBMs in-house, and synchronizing segment placement with continuous excavation, the company structurally attacks the largest cost and schedule drivers in underground tunneling."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
  - calloutType: "risk"
    title: "The Fleet Autonomy and Municipal Permitting Bottleneck"
    body: "Despite rapid tunneling engineering progress, the commercial throughput of the Loop system remains strictly throttled by external dependencies. Driver wages and vehicle availability currently bound network economics until Tesla delivers unsupervised autonomous driving. Furthermore, with only approximately 100 of the 600 required permits secured in Las Vegas by early 2026, administrative approvals and surface station delivery represent a greater barrier to scale than machine advance rates."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
