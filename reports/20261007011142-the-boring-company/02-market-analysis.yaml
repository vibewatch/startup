      - ["Convention and tourism connector", "Convention or tourism authority", "Visitors, workers, and venue operators", "Authority or public-private project vehicle", "Venue network design followed by staged expansion", "Venue infrastructure and mobility budget", "Congestion relief around concentrated destinations"]
      - ["Sovereign urban network", "Government or sovereign development sponsor", "Residents, visitors, and businesses", "Government-backed project entity and financing partners", "Multi-jurisdiction program procurement and phased delivery", "National or emirate infrastructure program", "Successful scale-up beyond a demonstration footprint"]
      - ["Utility or freight tunnel", "Utility, logistics operator, or public infrastructure owner", "Network operators and their customers", "Asset owner or contracted project sponsor", "Use-case engineering, rights-of-way, permits, build, and operation", "Utility or logistics capital budget", "Lower total cost or schedule risk than surface and conventional alternatives"]
    notes: "Buyer roles are directional because public sources do not disclose a complete customer pipeline, procurement authority, payer split, or contract structure by project."
    claimRefs: ["CM001", "CM004", "CM009", "CM012", "CM013"]
figures:
  - id: "FM001"
    title: "Evidence-constrained market sizing ladder"
    type: "pyramid"
    summary: "The available evidence narrows from broad use cases to project scope, but stops before a defensible revenue-based SOM."
    data:
      items:
        - label: "Use-case universe"
          value: "3 named families"
          detail: "Transportation, utility, and freight tunnels are company-described categories, not quantified markets."
        - label: "Institutional buyer filter"
          value: "Project-specific"
          detail: "Municipal, authority, sovereign, utility, and freight budgets require separate qualification."
        - label: "Operating proof"
          value: "~4 miles"
          unit: "Las Vegas tunnel footprint"
          detail: "Business Insider-reported current scale; not a market-size denominator."
        - label: "Near-term disclosed projects"
          value: "10 miles and >150 km"
          detail: "Nashville project length and planned UAE infrastructure have different status and cannot be summed as revenue."
        - label: "Unit-cost thesis"
          value: "<$5M/mile"
          unit: "issuer target"
          detail: "Company target for a Loop transportation tunnel, not disclosed realized economics."
        - label: "Auditable SOM"
          value: "Unknown"
          detail: "Contract values, win rates, comparable pipeline stages, project margins, and realization timing are not public."
    approximationNotes: "No widths or conversion rates should be inferred; the ladder mixes categorical filters and separately qualified metrics rather than a common numeric population."
    claimRefs: ["CM004", "CM006", "CM007", "CM011", "CM015"]
callouts:
  - calloutType: "risk"
    title: "Mileage is not market size"
    body: "Operating, planned, approved, and announced tunnel lengths have different realization probabilities and no common disclosed price basis; adding them would create false precision."
    claimRefs: ["CM004", "CM006", "CM007", "CM011"]
  - calloutType: "insight"
    title: "The adoption wedge is standardization, not category breadth"
    body: "The economic thesis depends on repeatable tunnel design and integrated delivery converting company cost and speed targets into realized project outcomes."
    claimRefs: ["CM002", "CM003", "CM013", "CM014"]
