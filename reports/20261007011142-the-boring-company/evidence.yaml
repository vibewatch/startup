evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, voting rights, ownership percentages, delegated authorities, related-party controls, and
      succession plans.
    whyItMatters: >-
      Named founder and executive roles do not establish who can approve financing, projects, related-party
      transactions, or leadership succession.
    diligencePath: >-
      Request the charter, bylaws, cap table, voting agreements, board minutes, delegation matrix, and executive
      succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue, run-rate, margins, current headcount, customer definition and count, contract backlog, cash
      balance, and project-level economics.
    whyItMatters: >-
      Valuation and financing cannot be translated into operating traction, capital efficiency, or runway without
      period-consistent financial and operating denominators.
    diligencePath: >-
      Request audited financial statements, management accounts, payroll census, customer and contract schedules,
      backlog reconciliation, and project contribution-margin reporting.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      Complete financing history, funded versus committed proceeds, debt and grant schedules, secondaries, liquidation
      preferences, ownership percentages, and cash deployment.
    whyItMatters: >-
      Selected round announcements do not establish total funding raised, dilution, control, preference overhang, or
      cash currently available.
    diligencePath: >-
      Reconcile the cap table, stock purchase agreements, debt and grant documents, bank statements, secondary
      transfers, and use-of-proceeds schedules.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Comparable project contract values, qualified pipeline by stage, win rates, addressable buyer budgets, and
      timing-adjusted revenue potential.
    whyItMatters: >-
      Without a common monetary denominator, disclosed project lengths cannot be converted into defensible TAM, SAM, or
      SOM.
    diligencePath: >-
      Request the board pipeline, signed contracts, backlog schedule, bid history, buyer budget sources, and
      project-level revenue recognition assumptions.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: realized-unit-economics
    missingEvidence: >-
      Actual cost per completed mile, boring speed distribution, station and systems cost, utilization, gross margin,
      and lifecycle operating cost by project.
    whyItMatters: >-
      Company targets do not establish whether the claimed cost advantage survives different geologies, jurisdictions,
      station designs, and operating requirements.
    diligencePath: >-
      Review project cost ledgers, machine telemetry, change orders, completion certificates, uptime, and independently
      verified cost benchmarks.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: material
    topic: buyers-and-payers
    missingEvidence: >-
      A complete customer and project list with procurement authority, payer structure, budget owner, contract status,
      and cancellation reasons.
    whyItMatters: The buyer map is directional and cannot quantify sales-cycle length, concentration, conversion, or repeatability.
    diligencePath: >-
      Obtain the CRM export, procurement documents, public budgets, contract amendments, project cancellations, and
      sponsor references.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: >-
      Audited financial statements detailing gross revenue, segment revenue breakdown, construction gross margin,
      passenger farebox operating margin, cash burn, and project capex.
    whyItMatters: >-
      Without audited financial statements, underwriting cannot substantiate whether the Vegas Loop operates at a
      positive unit contribution margin or if civil construction losses are being subsidized by Series D equity
      injections.
    diligencePath: >-
      Obtain confidential information memorandum (CIM) or audited financial statements through formal diligence access
      from secondary platforms or authorized company financing representatives.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: project-debt-obligations
    missingEvidence: >-
      Disclosure of debt facilities, project bonds, equipment lease financing, or municipal guarantee obligations tied
      to Nashville Music City Loop and Vegas Loop expansions.
    whyItMatters: >-
      Privately financed concession models like Nashville create contingent project liabilities and senior claimholder
      priority ahead of common equity holders.
    diligencePath: >-
      Examine municipal filings, public-private partnership agreements, and county bond registries in Clark County,
      Nevada and Davidson County, Tennessee.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: tbm-performance-benchmarking
    missingEvidence: >-
      Third-party civil engineering telemetry independently corroborating sustained one mile per week advance rates
      across varied geologies.
    whyItMatters: >-
      Boring speed claims represent the central thesis for the company's 90% capital cost reduction model over
      traditional civil transit projects.
    diligencePath: Request unredacted daily shift logs and TBM advance reports from municipal clients in Las Vegas and Nashville.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-and-economics-gap
    missingEvidence: >-
      Customer-level revenue, contract duration, renewal terms, NRR, GRR, churn, repeat-purchase behavior, and fare or
      operating-revenue splits.
    whyItMatters: >-
      Without recurring economics or renewal data, cumulative passenger trips cannot establish durable customer value or
      repeatable revenue.
    diligencePath: >-
      Request signed customer contracts, renewal schedules, customer-level revenue cohorts, fare settlement reports, and
      board-approved operating budgets in the diligence data room.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue, backlog, capital commitments, and operating obligations by Las Vegas, Tesla, Nashville, Dubai, the UAE,
      and other counterparties.
    whyItMatters: >-
      The public evidence shows operating concentration in Las Vegas but cannot quantify economic concentration or
      exposure to any single payer.
    diligencePath: >-
      Obtain a customer and project concentration schedule reconciling signed backlog, recognized revenue, committed
      capex, cancellation rights, and counterparty credit support.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: An exhaustive, contract-backed list of every operating, signed, awarded, canceled, and inactive customer project.
    whyItMatters: >-
      The public pipeline mixes operating customers, contracts, approvals, free awards, and proposals, which can
      overstate conversion and diversification.
    diligencePath: >-
      Reconcile management's project roster against executed contracts, authority minutes, permit records, cancellation
      notices, and commissioning certificates.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: independent-operating-audit
    missingEvidence: >-
      Audited station-level ridership, unique-rider counts, paid-versus-free trip mix, uptime, wait time, safety
      incidents, and repeat-use cohorts.
    whyItMatters: >-
      Secondary cumulative and event totals do not show everyday utilization, service quality, monetization, or
      retention.
    diligencePath: >-
      Request operator logs and authority audit reports, then reconcile them to fare records and independent
      station-level traffic counts.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: regulatory-oversight
    missingEvidence: >-
      Complete unredacted settlement filings and ongoing hearing transcripts for contested Nevada OSHA chemical burn
      citations.
    whyItMatters: >-
      Contested administrative dockets obscure whether safety protocols have resolved chemical burn risks in active
      tunneling.
    diligencePath: >-
      Obtain Nevada OSHA Review Board hearing docket records and state public records requests for recent inspection
      audits.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: fleet-autonomy
    missingEvidence: >-
      Third-party validation or safety certification data for driverless autonomous vehicle operations in 12-foot
      single-lane tunnels.
    whyItMatters: >-
      Autonomous platooning is required to achieve high-throughput claims of 90,000 passengers per hour; current
      operations remain human-driven.
    diligencePath: >-
      Review autonomous vehicle testing permit applications and Nevada DMV regulatory filings for automated transit
      operations.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: minor
    topic: international-contract-terms
    missingEvidence: >-
      Detailed contract specifications, milestone disbursement schedules, and penalty clauses for the UAE 150-kilometer
      tunneling agreement.
    whyItMatters: >-
      A substantial portion of the $23.0B valuation rests on the UAE commitment, but commercial terms and construction
      deadlines remain undisclosed.
    diligencePath: >-
      Review sovereign infrastructure procurement announcements and official bilateral infrastructure partnership
      disclosures in the UAE.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: Audited revenue, project gross margin, cash flow, cash balance, cash use, and runway after the Series D.
    whyItMatters: >-
      Without operating economics, the reported financing valuation cannot be converted into a defensible entry price or
      target return.
    diligencePath: >-
      Obtain audited financial statements, project-level cost and margin schedules, the 2026 budget, and a
      post-financing cash bridge from management.
    relatedQuestionRefs:
      - QV005
      - QV006
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      The current fully diluted capitalization table, Series D security terms, liquidation preferences, participation,
      anti-dilution, governance rights, and transfer restrictions.
    whyItMatters: >-
      Headline post-money valuation does not reveal ownership, downside protection, dilution, or common-equity proceeds
      in an exit.
    diligencePath: >-
      Review the executed Series D purchase agreement, amended charter, investor-rights agreement, voting agreement, and
      current capitalization table.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: project-economics
    missingEvidence: >-
      Independent project-level verification of tunnel speed, all-in cost per mile, utilization, maintenance,
      remediation costs, contract status, and customer payments.
    whyItMatters: >-
      The premium case requires company technical targets to become repeatable, profitable contracted performance across
      multiple projects and geologies.
    diligencePath: >-
      Commission engineering review and reconcile completed-mile costs, machine logs, contracts, milestone invoices, and
      customer acceptance records.
    relatedQuestionRefs:
      - QV003
      - QV004
      - QV006
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      A board-approved liquidity plan, realistic secondary-market depth, IPO-readiness work, and likely exit
