    whyItMatters: Target return and hold period cannot be underwritten without an actionable path to liquidity.
    diligencePath: >-
      Interview the board and financing advisers; review secondary transfer history, IPO readiness materials, and
      strategic-buyer analysis.
    relatedQuestionRefs:
      - QV009
