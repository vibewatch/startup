        title: 展示
        blocks:
          - type: callout
            title: 里程不是市场规模
            body: 运营中、规划中、已获批和已宣布的隧道长度，落地概率各不相同，也没有共同的公开价格基础；把它们相加会制造虚假的精确感。
            calloutType: risk
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM011
          - type: callout
            title: 采用切入口是标准化，而不是品类宽度
            body: 经济论点依赖可复制的隧道设计和一体化交付，把公司的成本和速度目标转化为实际项目成果。
            calloutType: insight
            claimRefs:
