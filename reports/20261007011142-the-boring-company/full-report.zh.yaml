            title: 融资规模大，但流动性图景不完整
            body: 2026 年 9 月融资显著扩大了已披露的融资规模，但募集资金不等于可用现金。现有来源没有提供完整资本化历史、债务表、 募集资金用途或当前现金余额。
            calloutType: insight
