      - number: '4.3'
        title: 单位经济性、资本强度与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              评估 The Boring Company，需要判断其专有隧道技术能否克服土木工程的结构性资本强度。公司的核心经济假设建立在 Prufrock 系列隧道掘进机上，这些机器在得州 Bastrop
              总部制造并远程运营。Prufrock 可连续掘进、无需开挖始发井便从地面俯冲启动， 并支持 Zero-People-In-Tunnel 作业，目标速度为每周一英里、每英里全包隧道成本低于 $5
              million。在拉斯维加斯 Westgate 的软土条件下，Prufrock-2 以连续掘进 2.28 英里的纪录证明了机械耐久性。


              但不同地质条件下的实际单位经济性仍未获独立工程审计验证。岩层会带来显著成本阻力，因此公司为纳什维尔石灰岩部署 Prufrock-MB 硬岩版本。此外，监管和运营风险持续拖累资产负债表：内华达监管部门曾就约 800
              起环境和职场违规提出处罚， 包括工人化学烧伤。按 $23 billion 隐含估值、低于 $50 million 的收入运行率计算，隐含市销率超过 460x，使传统倍数
              评估失效，投资回报只能押注尚未证明的全球资本支出积压项目执行。
