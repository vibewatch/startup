  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与服务定义
        blocks:
          - type: paragraph
            body: >-
              The Boring Company 把土木基础设施当作标准化产品线，而不是定制公共工程承包服务。商业组合以 Loop 为核心：这是全电动
              地下点对点客运网络，设计目标是取消中间站停靠并绕开地面拥堵。传统公共交通往往需要开挖巨大的地下地铁空间，而 Loop 隧道采用约 12
              英尺的标准化小直径断面，专门容纳乘用车和轻型车队。除乘客出行外，公司还定义四种公用事业和货运隧道： 用于市政和工业管线铺设的公用事业隧道、容纳标准联运集装箱的货运隧道、用于立体分离步行和骑行走廊的人行通道，以及
              以结构壳体交付、供第三方内部改造的裸隧道。所有产品的核心交付单位都不只是开挖承包，而是交钥匙地下通道系统。
