  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 报道中的融资估值要先通过运营证明、执行风险和条款披露几道关，才能支撑投资建议。
    data:
      nodes:
        - id: financing
          label: 报道融资 $3B、估值 $23B
          detail: 当前融资规模得到独立报道印证，其他数据库的数值略有差异。
        - id: historical-mark
          label: 约为 2022 年估值的 4 倍
          detail: 估值跃升提高了对运营经济性的证明要求。
        - id: technical-proof
          label: 公司技术目标
          detail: Prufrock 的成本和速度目标需要独立的项目级验证。
        - id: commercial-proof
          label: 运营网络实证有限
          detail: 不利报道中识别出的公共使用 Loop 只有 Las Vegas。
        - id: missing-terms
          label: 经济性与条款缺失
          detail: 收入、利润率、现金流、当前资本化和 Series D 优先权均未得到公开确立。
        - id: decision
          label: 需要进一步研究
          detail: 根据指定证据，无法支持有依据的进入区间或目标回报。
    approximationNotes: 流程是定性且有序的；不分配概率、不推算隐含价值，也不计算转化率。
