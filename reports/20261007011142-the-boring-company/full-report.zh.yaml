chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、成立过程与商业模式
        blocks:
          - type: paragraph
            body: >-
              The Boring Company 是 Elon Musk 于 2017 年 1 月 11 日创立的美国私营基础设施、隧道建设和设备企业。公司最初位于 SpaceX 内部，2018
              年成为独立公司；当前公司资料显示总部在得州 Bastrop。其运营模式是垂直整合，而非单纯出售设备： 公司称自己设计并制造隧道掘进机和衬砌，设计并建设 Loop
              系统，再负责运营。官方产品还区分交通、公用事业和货运隧道。 这种整合可能减少机器迭代、施工和运营之间的交接，但公开来源无法按设备、施工、票价或其他商业活动拆分收入和利润率。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
              - CO009
              - CO016
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开点名的领导层异常精简。Elon Musk 被列为创始人和所有者，Steve Davis 则是首席执行官兼总裁。来源称 Davis 是 SpaceX 的早期员工，在出任 TBC 总裁前曾为 Musk
              负责工作，因此把公司起源与当前运营连接起来。但现有证据没有披露当前 董事会名单、投票权、授权范围、继任计划或持股比例。因此，尽调结论不是认定 Musk 当前拥有某个具体比例或除上述职务外的
              正式头衔，而是能看到创始人与管理层的连续性，却看不到制度化治理。这种不对称带来关键人物和决策权问题，必须靠私有文件， 不能靠推断解决。
            claimRefs:
              - CO003
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
      - number: '1.3'
        title: 资本结构与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              三个独立来源报道，2026 年 9 月 10 日公司完成 $3 billion 的 D 轮融资，估值为 $23 billion，由阿联酋牵头并有广泛投资者 联合参与。这里保留“估值为 $23
              billion”的表述，因为审阅页面没有一致说明这是投前还是投后估值。另一个历史基准是 2022 年 4 月的 C 轮：Wikipedia 报道融资 $675 million、估值约 $5.675
              billion，Inc. 则将估值四舍五入为 $5.7 billion。 这些数字只能确认已披露轮次，不能构成完整现金桥接。根据现有证据，无法可靠重建累计融资、债务、补助、老股转让、已用募集资金
              和当前可用现金，这些仍是明确的尽调缺口。
            claimRefs:
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
      - number: '1.4'
        title: 规模、里程碑与执行风险
        blocks:
          - type: paragraph
            body: >-
              尽管公司曾宣布过更多项目，CNBC 描述的唯一正在向公众开放的 Loop 仍在拉斯维加斯。LVCC Loop 于 2021 年开通，是一套 1.7
              英里、三站的系统；后续延伸和获批范围不能与最初的运营足迹混为一谈。纳什维尔提供了最清晰的当前施工进展： 公司于 2025 年 7 月宣布 Music City Loop，称截至 2026 年 4
              月已经开始掘进，并称截至 8 月有两台机器正在作业， 计划 10 月下旬启动第三个工地。这些都是公司发布的进展说法。独立报道还记录了内华达州和得州被放弃或未实现的城市提案，
              以及环境和职场违规，因此融资规模和正在掘进本身并不能消除交付、许可、安全或社区接受度风险。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
