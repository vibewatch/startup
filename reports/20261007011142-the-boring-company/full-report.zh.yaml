              - CM011
              - CM015
      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              可能的经济买方是机构，而非个人乘客。AskCyborg 将其市场进入方式描述为直接向市政机构和政府实体销售，并辅以公私合作； 但其 AI
              综合方法决定了这只是方向性判断，而非定论。即使终端用户使用同一条隧道，会展和旅游主管部门、主权城市开发出资方、
              交通机构、公用事业或货运所有者也可能分别掌握不同预算。因此，采用取决于出资方在开工前整合许可、路权、融资和运营授权。 $3 billion
              融资为公司提供资本，但不等于客户需求、签约积压、买方预算或任何单个项目的可用现金。
            claimRefs:
              - CM005
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM009
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              核心采用论点是：标准化几何、连续掘进、远程运营和垂直整合能够降低成本、缩短工期，足以释放传统交付模式无法证明
              合理性的项目。证据仍不对称：成本和速度是公司目标，而独立报道显示洛杉矶、华盛顿和芝加哥的拟议隧道已搁置或取消。
              采购周期长、资本密集、受辖区影响，也暴露于许可和地质执行风险。阿联酋项目范围可能在更大规模上证明可复制性，但在披露
              实际成本、利用率、合同金额和项目层面回报前，估值更多依赖未来市场渗透，而非可审计的已获取市场基础。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM012
              - CM014
              - CM015
