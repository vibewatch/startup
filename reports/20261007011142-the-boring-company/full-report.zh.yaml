  - id: FE001
    title: The Boring Company 地下交通技术栈
    type: stack
    summary: 六层架构展示从深层开挖到调度和网约车服务的运营层。
    data:
      layers:
        - label: 乘客应用与调度层
          detail: 移动网约车界面、站点排队调度、乘客路径算法
        - label: 车队与导向基础设施
          detail: Tesla 电动乘用车、封闭环道路铺装、自动充电门户
        - label: 站点交通枢纽与地面门户
          detail: 地面扶梯组、地下乘客上下客泊位、闸机和消防生命安全疏散通道
        - label: 隧道机电与安全基础设施
          detail: 主动热通风、紧急疏散通道、CCTV 网络、光纤遥测、废水处理
        - label: 结构衬砌与土建壳层
          detail: 精密预制混凝土环片、高强度环形灌浆、连续排水沟
        - label: 地下开挖与弃土运输层
          detail: Prufrock TBM 刀盘、连续渣土输送系统、Bastrop 的 Zero-People-In-Tunnel 遥测
    approximationNotes: 架构拆解综合工程披露、供应链分析和监管记录。
    claimRefs:
      - CE004
      - CE009
      - CE010
  - id: FU001
    title: 观察到的客户开发路径与证据断点
    type: journey-map
    summary: 从市政兴趣走到稳定运营，要依次过商业定位、审批、建设和留存几道关。
    data:
      items:
        - label: 兴趣
          summary: Authorities or project sponsors express interest through direct negotiations or a challenge submission.
          touchpoints:
            - 市政提案
            - 挑战赛提交
        - label: 商业定位
          summary: >-
            The parties determine whether the project is paid, privately funded by The Boring Company, sovereign-backed,
            or a free demonstration.
          touchpoints:
            - 资金拨付
            - 合同或授标
        - label: 审批
          summary: Easements, permits, geotechnical review, and regulator coordination gate progress.
          touchpoints:
            - 通行权
            - 许可
        - label: 建设
          summary: Tunneling alone is insufficient; stations and operational approvals must also be completed.
          touchpoints:
            - 隧道掘进
            - 站点准备
        - label: 运营
          summary: Passenger trips or industrial movements provide production evidence only after commissioning.
          touchpoints:
            - 投运
            - 使用量测量
        - label: 持续性与扩张
          summary: >-
            Renewals, contract length, recurring economics, and customer concentration remain undisclosed in the
            assigned evidence.
          touchpoints:
            - 续约
            - 扩张决策
    approximationNotes: 定性顺序综合保留的项目证据；这不是经测量的转化漏斗，也不暗示任何转化率。
    claimRefs:
      - CU012
      - CU016
