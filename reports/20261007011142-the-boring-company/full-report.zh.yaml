        blocks:
          - type: paragraph
            body: >-
              The Boring Company 的运营模式依赖四段紧密衔接的供应链：内部制造机器、外部采购预制混凝土衬砌、承包地面和车站 MEP （机械、电气、管道）工程，以及从姊妹公司 Tesla 采购车队。拉斯维加斯
              Loop 的每次载客运营，都依赖封闭隧道内由人类 驾驶的 Tesla 车辆。在无人监督自动驾驶完成验证并取得许可前，实际系统吞吐量始终受司机配置、车站调度能力和车辆停站时间
              严格限制。与此同时，快速地下部署也遭遇环境和职场安全摩擦。2020 至 2026 年间，内华达州监管检查产生 17 起投诉和 8 项 拟议处罚，包括加速剂导致工人化学烧伤、缺少紧急去污淋浴，以及约
              $600,000 监管罚款，主要与未经处理的废水排放有关。 这些事件说明，自动化掘进速度无法绕过地面环境监管或工业卫生要求。
