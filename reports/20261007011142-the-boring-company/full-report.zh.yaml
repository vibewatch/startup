      - 证据
      - 哪些变化会改变判断
    rows:
      - - 论点
        - 一轮规模较大的 2026 年融资可为多个城市的项目及超过 150 km 的阿联酋规划基础设施提供资金
        - 已签署合同、里程碑回款和项目层面的利润率证据，能够把雄心转化为已签项目积压的证明
      - - 论点
        - 公司为 Prufrock 设定的目标是每周一英里、每英里低于 $5M
        - 必须用软土和硬岩项目的独立结果验证成本、速度、设备运行时间和修复成本
      - - 反论点
        - CNBC 报道称，尽管约有十多个城市项目已宣布，Las Vegas 仍是唯一投入公共使用的 Loop
        - 多个已完工网络按合同约定的服务水平运营并实现经济性，将降低商业化风险
      - - 反论点
        - 过往项目不了了之，环境或工作场所安全问题仍留在记录中
        - 已结案的执法事项、干净的运营数据和可重复的许可流程将降低执行风险
    notes: 技术成本和速度数据是公司目标，运营足迹和不利历史则归因于独立报道；两者都不被视为经审计的经济性。
