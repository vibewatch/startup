      - number: '7.3'
        title: 交易对手依赖、单一来源车队风险与主权敞口
        blocks:
          - type: paragraph
            body: >-
              公司商业架构在治理、车辆供应和国际项目资本化上存在极端交易对手集中。TBC 运营交通系统完全依赖 Tesla 乘用电动车， 车辆供应、机械维护、软件集成和定价都绑定关联方，形成单一来源车队瓶颈
              [CR009]。治理层面，战略权力和市政谈判集中于 创始人 Elon Musk，造成关键人物依赖，并在市政路权审批期间放大政治摩擦和公众审查 [CR010]。芝加哥、洛杉矶等大城市的
              初始提案在监管和公众反对后被放弃，或未超过早期探索阶段 [CR011]。同时，$3.0B D 轮按 $23.0B 估值完成，使地理和资本 高度集中于阿联酋；公司承诺建设超过 150
              公里地下基础设施，未来估值因此绑定海外项目执行 [CR012]。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: 缓解路线图、论点失效触发器与尽调标准
        blocks:
          - type: paragraph
            body: >-
              评估投资风险，需要设定与可量化运营、监管和财务里程碑绑定的具体、可监测失效标准。TBC 的缓解措施包括从 Bastrop 运营中心远程操作机器、第三方结构和环境审计，以及 Tunnel Vision
              Challenge 等众包项目管线；后者收到 487 份全球掘进 提案，用于寻找可行的私人和公用事业走廊 [CR013]。若重复环境或安全违规后 Clark County 或纳什维尔撤销市政特许或掘进
              许可，将是关键论点失效触发器 [CR014]。若客运能力无法从人类驾驶转向获认证的无人驾驶自动运营，Loop 吞吐量将永久低于 快速公交或市政铁路，也构成论点失效 [CR015]。最后，若 150
              公里阿联酋基础设施项目无法交付早期施工里程碑，将使 $23.0B 私人估值失去依据，并威胁主权支持的交钥匙扩张可行性 [CR016]。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 监管执法与公共记录完整性风险
            body: >-
              The Boring Company 面临内华达职场安全和环境调查重叠带来的严重监管敞口。八项涉及化学烧伤的争议处罚，以及对撤回处罚和 被修改文件的公共记录调查，使 OSHA Review Board
              行政拖延，促使州议会领导要求行政调查，增加更严格监督和停运风险 [CR001, CR002, CR003]。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 自动驾驶依赖困局
            body: >-
              TBC 将 Loop 系统宣传为每小时可运送最多 90,000 名乘客的高容量大众交通，但当前商业运营仍依赖驾驶 Tesla 轿车、 速度为 35 至 45 mph
              的人类司机。若没有监管认证和全无人自动驾驶车队的商业部署，现实系统运力无法匹敌传统城市铁路， 长期基础设施价值也会被封顶 [CR007, CR015]。
            calloutType: insight
            claimRefs:
              - CR007
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              现有证据支持“继续研究”，而不是按报道的 $23 billion 融资估值买入。CNBC 和 Blockonomi 报道公司于 2026 年 9 月按该估值 融资 $3 billion；Tracxn 则记录
              $3.2 billion D 轮和另一条 $20 billion 估值数据。差异不足以改变决定，但说明私募轮次数字
              在用于回报模型前需要主要交割文件。更重要的是，审阅来源没有提供经审计收入、项目毛利率、自由现金流、轮后可用现金或当前
              完全摊薄资本化表。因此，大额融资只能证明融资能力，不能证明报价股权价值由运营现金创造支撑。入场纪律应取决于已验证的 经济性和证券条款，而不是公司质量本身。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV011
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV013
              - CV016
      - number: '8.2'
        title: 正论点与反论点
        blocks:
          - type: paragraph
            body: >-
              正面情景是，新资本可以资助更大规模的运营测试。独立报道把本轮融资与拉斯维加斯、纳什维尔、Dubai 以及超过 150 公里的 阿联酋规划基础设施联系起来。公司还称 Prufrock
              以连续掘进、远程运营和垂直整合的设计—建设—运营模式，目标为每周一英里、 每英里低于 $5 million。若这些说法能在不同地质条件下独立验证，并转化为已签约且盈利的积压项目，公司或可相对普通承包商
              获得战略溢价。反论点同样重要：CNBC 报道拉斯维加斯仍是唯一向公众开放的 Loop，多个已宣布项目已无疾而终，公司还积累了
              环境和职场安全问题。因此融资规模领先于已证明的网络规模。核心尽调问题是，资本究竟在加速可复制的经济性，还是只是在资助 更多定制土木项目。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: 融资背景与情景
        blocks:
          - type: paragraph
            body: >-
              报道估值从 2022 年 4 月约 $5.7 billion 的 C 轮水平，到 2026 年 9 月的 $23 billion，约增长四倍。这个跃升与更大规模融资
              和国际扩张雄心方向一致，但不能替代适合模型的估值桥接。公开记录变化很快：7 月 The Wall Street Journal 描述约 $4 billion、 约 $20 billion
              估值的谈判，并强调轮次尚未交割；之后报道完成了 $3 billion、$23 billion 估值的融资。因此，乐观情景、基准情景和
              悲观情景应设为证据门槛，而非编造点估计。乐观情景需要验证隧道经济性和签约项目转化；基准情景假设资本支持执行，但公开财务 仍无法证明估值；悲观情景则是项目延误、监管摩擦或融资条款压力，使下行接近早期私募估值。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 流动性、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开退出准备度较弱。Forge 称 The Boring Company 尚未认可 IPO 计划，并将市场活动标为有限；其详细优先权数据描述的是 2022 年 C 轮，而非 2026
              年融资。因此，当前稀释、清算优先权、参与权、治理和老股转让压力仍未知。最终决策需要 D 轮 资本化表和融资文件、经审计的项目层面经济性、现金使用和 runway 数据、已宣布项目具有约束力而非仅属初步阶段的证据，
              以及对安全和环境义务的独立核对。论点失效触发器应明确：无法证实声称的掘进成本和速度、已融资项目重大取消或延迟、执法
              带来的限制，或把大部分下行保护转给优先股投资者的融资条款。在这些事项解决前，无法根据现有公开证据计算数值目标回报或 可信持有期。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 投委会决策
            body: 继续研究。只有在取得经审计的运营经济性、当前融资条款、已签约项目转化情况和可执行的流动性路径后，才重新评估价格。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV015
              - CV016
