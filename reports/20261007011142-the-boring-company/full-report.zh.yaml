  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管监督、职业安全与环境不合规
        blocks:
          - type: paragraph
            body: >-
              The Boring Company 的土木开挖项目面临强监管和行政执法。内华达职安检查发现隧道员工多次遭受危险化学烧伤，Nevada OSHA 因此在 2023 年开具处罚并拟罚款合计超过 $112,000
              [CR001]。调查还涉及化学烧伤争议处罚、员工触电和被压伤事故；州议会 领导层正式要求独立审查安全监管中的结构性失误和公共记录篡改 [CR002]。环境不合规同样扰乱运营：州和地方监管部门记录 Clark
              County 多次未经许可排放地下水和未经处理的废水至市政雨水管和污水管，并发出多项停止并终止执法令及行政和解罚金
              [CR003]。这些合规失败说明，若绕过工业卫生和市政环境规则，加快掘进可能反复导致停运和许可证撤销 [CR004]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
