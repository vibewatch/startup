      - number: '4.2'
        title: 商业变现机制与交通合同经济性
        blocks:
          - type: paragraph
            body: >-
              商业运营收入来自两条结构性渠道：运营中 Loop 系统的客运票价，以及基础设施工程合同。实际商业交通变现仍局限于一个运营 地理区域：内华达州拉斯维加斯的 Vegas Loop。连接 Las Vegas
              Convention Center、Westgate、Encore、Fontainebleau 和 Sahara 的 8 个运营车站，累计客运次数超过 3.3 million、最高达 4.0
              million。商业票箱收入仍有限，预计年度票价总收入为 $10 million 至 $50 million，取决于活动使用排期和 Las Vegas Convention and Visitors
              Authority 的合作方补贴。


              除拉斯维加斯客运票价外，商业增长还依赖两种分化的项目融资交付模式。在纳什维尔，公司已在全私营基础设施特许经营下 启动 Music City
              Loop，承担全部资产负债表施工风险，资本成本回收取决于长期收取乘客票价。相反，阿联酋国际扩张包括超过 150 公里隧道的规划基础设施框架，并配合市政 Dubai Loop
              项目。但公司尚未公布经审计财务报表、分部报告或实际收入拆分， 因此实际施工利润率和票箱回收率仍是私有指标缺口。
