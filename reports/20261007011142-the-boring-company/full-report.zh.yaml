      - number: '7.2'
        title: 运营吞吐量、自动驾驶转型与地质瓶颈
        blocks:
          - type: paragraph
            body: >-
              Loop 交通概念的运营持久性受机器性能和车辆吞吐量限制。The Boring Company 通过 Prufrock 架构，目标是每周掘进一英里、 每英里全包成本低于 $5 million，并采用
              Zero-People-In-Tunnel 连续掘进和拖车地面俯冲 [CR005]。但拉斯维加斯 Loop 经过 多年开发，仍远低于获批的 68 英里、104 站市政范围，绝大部分规划网络能力尚未建成
              [CR006]。客运仍高度依赖人类驾驶的 Tesla 车辆，运营速度为 35 至 45 mph，使现实吞吐量远低于未来自动驾驶车队理论宣称的每小时 90,000 名乘客 [CR007]。
              技术扩张还遇到地质障碍，需要 Prufrock-MB 等硬岩版本应对纳什维尔高强度石灰岩；未经验证的刀头磨损率可能推高土木成本 [CR008]。
            claimRefs:
              - CR005
