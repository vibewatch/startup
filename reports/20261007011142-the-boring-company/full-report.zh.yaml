      - number: '5.2'
        title: Prufrock TBM 架构与掘进机制
        blocks:
          - type: paragraph
            body: >-
              支撑 The Boring Company 降本模式的核心技术资产，是在得州 Bastrop 总部内部设计制造的 Prufrock 系列隧道掘进机（TBM）。 传统软土 TBM
              采用走走停停的开挖周期，推进约五英尺后停机，人工安装预制混凝土衬砌环。Prufrock 则把连续掘进和同步
              衬砌结合起来，刀盘前进无需中断即可安装预制混凝土节段。为取消密集城区昂贵且扰动大的始发井和吊装作业，Prufrock 可 “俯冲”：搭运输拖车到场后向下倾斜，在 24
              小时内直接从地面启动，项目结束后再浮出地面登上回收拖车。机器还设计为 Zero-People-In-Tunnel（ZPIT）运营，由 Bastrop 运营控制中心远程管理。为应对不同地质，公司开发
              Prufrock-MB 硬岩版本， 用于 Music City Loop 遇到的石灰岩等自支撑地层。
