  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：一体化小直径隧道交付
        blocks:
          - type: paragraph
            body: >-
              可投资市场并不是全部地下建设、公共交通或城市出行。公司的产品边界覆盖交通、公用事业和货运隧道，交付模式则把隧道 掘进机和衬砌制造，与 Loop
              设计、建设和运营结合起来。这种垂直整合指向项目收入以及潜在运营收入，而非纯设备市场。 因此，相关支出池只是那些能够采用标准化隧道的市政、主管部门、主权开发、公用事业和货运预算。地面道路、铁路、公交、
              传统隧道承包商和不采取行动仍是替代方案，但没有项目层面的转化证据，不能把它们的总支出计作可触达收入。
            claimRefs:
              - CM001
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM013
      - number: '2.2'
        title: 受证据约束的规模测算，而非泛化 TAM
        blocks:
          - type: paragraph
            body: >-
              公开披露提供了项目长度和公司目标，却没有市场分母。Prufrock 的目标是每周掘进一英里，Loop 交通隧道全包成本低于 每英里 $5
              million；但公司没有披露这些目标已经转化为全车队经济性。独立报道提到拉斯维加斯约四英里的运营隧道、 约 68 英里的规划扩建、纳什维尔 10 英里项目，以及阿联酋规划超过 150
              公里的隧道。这些数字不能直接加总为收入或 SOM， 因为其中混合了运营资产、获批规划、在建工程和合作公告，且没有可比合同金额。IncFact 给出的 2025 年 $10 million-$100 million
              收入区间明确是对私营公司的统计估计，不是经审计收入，也不是可触达需求。
            claimRefs:
              - CM002
