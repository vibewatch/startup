        - 信号：已签约积压和经审计的利润率证据；触发因素：成本或速度声称无法复现
      - - 基准
        - 新资本为执行提供资金，但公开财务披露和广泛网络验证仍有限
        - 报道中的 $23B 估值仍是融资参考，而非公允价值结论；无法计算目标回报
