          value: 3 named families
          detail: 交通、公用事业和货运隧道是公司描述的类别，不是已量化的市场。
        - label: 机构买方筛选
          value: Project-specific
          detail: 市政、主管机构、主权方、公用事业和货运预算都要分别核实。
        - label: 运营证明
          value: ~4 miles
          unit: Las Vegas tunnel footprint
          detail: Business Insider 报道的是当前规模，不是市场规模的分母。
        - label: 近期披露项目
          value: 10 miles and >150 km
          detail: Nashville 项目长度与规划中的阿联酋基础设施项目状态不同，不能相加当作收入。
        - label: 单位成本论点
          value: <$5M/mile
          unit: issuer target
          detail: 这是公司针对 Loop 交通隧道提出的目标，不是已披露的实际经济性。
        - label: 可审计 SOM
          value: Unknown
          detail: 合同价值、赢单率、可比项目管线阶段、项目利润率和兑现时点均未公开。
    approximationNotes: 不应推断阶梯宽度或转化率；它混合了分类筛选项与各自有限定的指标，并不代表共同的数值总体。
    claimRefs:
      - CM004
      - CM006
      - CM007
      - CM011
      - CM015
