callouts:
  - calloutType: "risk"
    title: "Extreme Valuation Multiple Decoupled from Realized Farebox Cash Flow"
    body: "At a post-money valuation of $23 billion and an estimated current operational revenue run-rate below $50 million, The Boring Company trades at an implied revenue multiple between 460x and 2,300x. The company cannot be underwritten on conventional enterprise cash flows, relying entirely on the successful multi-billion dollar project execution of international infrastructure agreements in the UAE and private toll concessions in Nashville. Historical municipal tunnel initiatives in cities such as Chicago and Los Angeles failed to progress beyond initial planning."
    claimRefs:
      - "CI001"
      - "CI012"
      - "CI016"
