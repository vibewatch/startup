  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: supplier-audits
    missingEvidence: Latest supplier-audit outcomes, corrective-action closure rates, and the share of production volume covered by those audits.
    whyItMatters: These records determine whether SHEIN's public supplier-code posture is operating proof or only a policy statement.
    diligencePath: Request the current factory concentration table, social-audit pack, unresolved corrective-action log, and any forced-labor import-compliance reviews.
    relatedQuestionRefs:
    - QR002
    - QR006
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: privacy-remediation
    missingEvidence: Primary regulator notices, cookie-remediation evidence, and a current map of how European user data moves into or through China-linked systems.
    whyItMatters: Without primary materials, investors cannot determine whether the reported CNIL and DPC matters are contained, escalating, or symptomatic of broader control gaps.
    diligencePath: Request the CNIL order, Ireland DPC response package, consent-logging evidence, and data-transfer governance approvals.
    relatedQuestionRefs:
    - QR004
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: ipo-correspondence
    missingEvidence: Direct CSRC, HKEX, and underwriter correspondence plus the live timetable, valuation guardrails, and unresolved disclosure comments.
    whyItMatters: Liquidity timing and pricing still depend on regulatory counterparties, so second-hand reports are not enough to underwrite exit risk.
    diligencePath: Request the latest draft prospectus, comment log, board-approved fallback plans, and the current valuation bridge for Hong Kong listing scenarios.
    relatedQuestionRefs:
    - QR001
    - QR007
    relatedTableRefs:
    - TR001
    - TR003
  - type: missing-source
    severity: material
    topic: marketplace-incidents
    missingEvidence: Marketplace-specific seller-screening metrics, IP takedown volume, restricted-item incident data, and customer complaint rates.
    whyItMatters: The 3P marketplace can diversify supply, but without seller-quality metrics it may be adding risk surface faster than it adds resilient growth.
    diligencePath: Request marketplace trust-and-safety dashboards, seller rejection rates, incident-response SLAs, and product-safety escalation logs.
