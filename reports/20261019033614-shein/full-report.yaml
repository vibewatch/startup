  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Tariff drag stabilizes, compliance scrutiny does not intensify, and public investors reward SHEIN's global
          customer scale and on-demand model.
        - >-
          $30B-$40B becomes re-openable because that was the pre-launch ask and would require evidence that the current
          reset was overly punitive rather than necessary.
        - Any new regulatory sanction or renewed margin pressure breaks the case.
        - Would require post-IPO execution materially better than the weak first-quarter read.
      - - Base
        - >-
          Growth stays modest, margins remain pressured but manageable, and the market continues to treat SHEIN as a
          mature cross-border retailer rather than a hyper-growth platform.
        - >-
          The filed $26.8B-$27B equity-value context is the supportable anchor; return cannot be quantified without
          final pricing, trading, and normalized cash-flow evidence.
        - Limited upside if governance/control concerns or compliance questions stay unresolved.
        - Most consistent with filed-range pricing and mixed operating signals.
      - - Bear
        - >-
          Trade-rule tightening persists, compliance scrutiny escalates, and investors discount founder control plus
          capital-structure obligations.
        - >-
          A value below the filed $26.8B-$27B context is directionally supportable, but the retained evidence does not
          establish a precise floor; Zalando's 0.4x sales multiple is a benchmark, not a price target.
        - Down-round optics in public markets, weaker U.S. demand, or forced changes to the cross-border model.
        - Most likely if policy friction keeps eroding the low-price advantage.
    notes: >-
      Scenario ranges are analytical judgments anchored to public marks already discussed in the retained evidence, not
      management guidance or a DCF with audited inputs.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV012
      - CV013
