  - id: FE001
    title: Product architecture map
    type: stack
    summary: SHEIN's public product stack centers on a data-to-merchandising loop wrapped in logistics and compliance layers.
    data:
      layers:
        - label: Customer demand inputs
          detail: Mobile, social, and on-site behavior
          items:
            - Mobile-first browsing and shopping activity
            - Social-media and search trend signals
          outputs:
            - Trend hypotheses and candidate SKUs
        - label: Merchandising decision loop
          detail: Small-batch test-and-repeat engine
          modules:
            - Launch initial batches as small as 100-200 items
            - Watch demand in real time
            - Scale only styles that work
          outputs:
            - Fast SKU refresh with lower initial inventory risk
        - label: Supplier orchestration
          detail: Sales tracking and factory communication
          modules:
            - Proprietary sales-tracking software
            - Real-time communication with factories
            - Distributed manufacturing partners
          outputs:
            - Short design-to-delivery cycle
        - label: Fulfillment and assortment expansion
          detail: Cross-border core plus local nodes and marketplace
          modules:
            - Direct shipping from the China supply base
            - Warehouses and distribution centers
            - Third-party marketplace sellers
          outputs:
            - Broader catalog and localized delivery options
        - label: Compliance and circularity overlay
          detail: Marketplace governance and sustainability operations
          modules:
            - 120+ EPR schemes
            - Seller compliance support
            - CIGM and Aloqia-enabled sourcing improvements
          outputs:
            - Higher control overhead but better adaptation to regulation
        - label: Post-purchase feedback loop
          detail: Scale generates more data and more control requirements
          modules:
            - Order-volume feedback into category expansion
            - Regional privacy and marketplace investigations
          outputs:
            - Continuous operating-model tuning under heavier scrutiny
