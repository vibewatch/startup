chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              SHEIN is a Singapore-headquartered online fashion and lifestyle retailer whose current holding company is
              incorporated in the Cayman Islands and whose operating footprint remains materially tied to China. The
              2026 prospectus defines the group as a direct-to-consumer and marketplace business using a proprietary
              Large-scale Automated Test and Reorder model to test small batches, read demand, and replenish winners.
              Founding chronology requires care: several secondary sources trace a Chris Xu-led predecessor to 2008,
              while the prospectus and Reuters identify the present company's launch with four co-founders in 2012. The
              distinction is best treated as predecessor origin versus current-group commencement, not collapsed into
              one unqualified founding date.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO015
      - number: '1.2'
        title: Scale, earnings, and capital history
        blocks:
          - type: paragraph
            body: >-
              The filing supplies the strongest current scale baseline: US$41.847 billion of net revenue and US$2.064
              billion of net income in 2025, 273 million active customers across approximately 160 markets, and 17,751
              employees at 31 March 2026. These are not interchangeable metrics: active customers are accounts that
              placed at least one order, net income is not cash generation, and financing proceeds are not cash
              available today. Momentum also softened at the latest reported quarter, when SHEIN recorded a US$99
              million accounting loss versus US$395 million of net income a year earlier. The offering range implied a
              conditional HK$202.1-HK$210.2 billion market capitalization, but this pool does not confirm the
              transaction's completion.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.3'
        title: Leadership, board, and control
        blocks:
          - type: paragraph
            body: >-
              The prospectus identifies four co-founders in operating roles: Yangtian (Sky) Xu as founder, chair, and
              chief executive; Miao Miao as chief operating officer; Xiaoqing Gu as chief product officer; and Xiaoqing
              Ren as the executive director responsible for public affairs and corporate responsibility after serving as
              chief supply chain officer. Three proposed independent non-executive directors bring the disclosed board
              to seven members. Economic ownership and voting power diverge sharply: Reuters reports that the four
              founders own 65% of the holding company, while Class A shares carry ten votes each and the prospectus
              allocates about 90% of post-offering voting rights to the four founder beneficiaries. Founder continuity
              is therefore a strategic asset and a material governance dependency.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              SHEIN progressed from an early cross-border apparel operation into a scaled platform through brand
              formation, mobile distribution, customer growth, and a marketplace launch. The 2026 offering was the first
              assigned primary source to make management, financial, and voting-control details broadly visible. It also
              exposes diligence priorities rather than closing them: the final listing status, fully diluted cap table,
              preference conversion, secondary sellers, and exact facility footprint remain unresolved from the assigned
              evidence. Independent reporting also keeps labor and environmental allegations in view. Any investment
              case should therefore distinguish prospectus-grade operating metrics from company claims, third-party
              historical estimates, and facts that require direct post-listing verification.
            claimRefs:
              - CO001
              - CO002
