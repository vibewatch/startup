          values:
            - label: High
              detail: Controversy and legal scrutiny remain live
            - label: Severe
              detail: Can affect import access, brand trust, and listing quality
            - label: Low-medium
              detail: Public claims exist, but audit-outcome proof is incomplete
        - label: De minimis / customs-margin squeeze
          values:
            - label: High
              detail: Regulatory change is already eroding the historical advantage
            - label: High
              detail: Lower shipping advantage can force price or margin resets
            - label: Medium
              detail: Management has some network and pricing levers, but public evidence is thin
        - label: EU privacy / data-transfer enforcement
          values:
            - label: Medium-high
              detail: The reported actions imply active regulator attention
            - label: Severe
              detail: Privacy sanctions can escalate beyond one-time fines
            - label: Low-medium
              detail: The pool does not prove remediation effectiveness
        - label: IPO venue / disclosure slippage
          values:
            - label: Medium-high
              detail: Two prior venue paths did not complete
            - label: High
              detail: Delay or repricing hits exit timing and valuation directly
            - label: Medium
              detail: Hong Kong progress is real, but not equivalent to zero risk
