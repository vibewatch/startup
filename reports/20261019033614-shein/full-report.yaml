  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - Thesis
        - >-
          Scale proof is unusual for a newly listed retailer: 281 million active customers, over one billion orders, and
          a valuation already reset far below the 2022 peak.
        - >-
          Sustained post-IPO trading above range with cleaner margin and cash-conversion disclosure would strengthen a
          buy case.
      - - Anti-thesis
        - >-
          Tariff changes already hit U.S. revenue, growth is near-flat, and the business remains exposed to compliance
          and sourcing controversies that can cap multiples.
        - A durable rebound in U.S. growth without further margin damage would weaken the anti-thesis.
      - - Key swing factor
        - >-
          Governance and financing terms matter because founders retain 90% of voting rights and SHEIN agreed to pay up
          to about $3.5 billion to certain holders of special shares.
        - >-
          Primary prospectus detail on conversion, payment timing, lockups, and surviving investor protections would
          materially improve underwriting.
    notes: >-
      Snapshot of the strongest pro/con arguments from the retained evidence; the third row highlights the diligence
      item most likely to move the call.
