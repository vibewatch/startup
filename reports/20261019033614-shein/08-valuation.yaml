    title: Recommendation summary table
    columns:
      - Decision axis
      - Current read
      - Evidence
      - Decision implication
    rows:
      - [Recommendation, track, "IPO range reset helps, but growth/margin and compliance risk still dominate.", "Do not force an entry before better disclosure or a better price."]
      - [Confidence, medium, "Public sources converge on the valuation reset and on operating/regulatory pressure, but cap-table and post-listing detail remain incomplete.", "Keep underwriting flexible and diligence-led."]
      - [Risk rating, high, "Trade policy, supply-chain scrutiny, concentrated voting control, a reported special-share cash obligation, and unresolved legal/regulatory matters can still move the equity materially.", "Model downside before sizing any position."]
      - [Valuation stance, fair, "About 0.7x forecast sales is far below the 2022 private peak but not clearly cheap versus listed apparel peers given the risk stack.", "Reasonable only with strong risk appetite and tighter proof on margins/compliance."]
    notes: Public-source snapshot as of the filed Hong Kong IPO range; assessments synthesize the cited claims rather than reproduce management guidance.
    claimRefs: [CV001, CV003, CV004, CV006, CV007, CV008, CV009, CV012, CV013, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - [Thesis, "Scale proof is unusual for a newly listed retailer: 281 million active customers, over one billion orders, and a valuation already reset far below the 2022 peak.", "Sustained post-IPO trading above range with cleaner margin and cash-conversion disclosure would strengthen a buy case."]
      - [Anti-thesis, "Tariff changes already hit U.S. revenue, growth is near-flat, and the business remains exposed to compliance and sourcing controversies that can cap multiples.", "A durable rebound in U.S. growth without further margin damage would weaken the anti-thesis."]
      - [Key swing factor, "Governance and financing terms matter because founders retain 90% of voting rights and SHEIN agreed to pay up to about $3.5 billion to certain holders of special shares.", "Primary prospectus detail on conversion, payment timing, lockups, and surviving investor protections would materially improve underwriting."]
    notes: Snapshot of the strongest pro/con arguments from the retained evidence; the third row highlights the diligence item most likely to move the call.
    claimRefs: [CV001, CV004, CV006, CV008, CV009, CV010, CV012, CV013, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Tariff drag stabilizes, compliance scrutiny does not intensify, and public investors reward SHEIN's global customer scale and on-demand model.", "$30B-$40B becomes re-openable because that was the pre-launch ask and would require evidence that the current reset was overly punitive rather than necessary.", "Any new regulatory sanction or renewed margin pressure breaks the case.", "Would require post-IPO execution materially better than the weak first-quarter read."]
      - [Base, "Growth stays modest, margins remain pressured but manageable, and the market continues to treat SHEIN as a mature cross-border retailer rather than a hyper-growth platform.", "The filed $26.8B-$27B equity-value context is the supportable anchor; return cannot be quantified without final pricing, trading, and normalized cash-flow evidence.", "Limited upside if governance/control concerns or compliance questions stay unresolved.", "Most consistent with filed-range pricing and mixed operating signals."]
      - [Bear, "Trade-rule tightening persists, compliance scrutiny escalates, and investors discount founder control plus capital-structure obligations.", "A value below the filed $26.8B-$27B context is directionally supportable, but the retained evidence does not establish a precise floor; Zalando's 0.4x sales multiple is a benchmark, not a price target.", "Down-round optics in public markets, weaker U.S. demand, or forced changes to the cross-border model.", "Most likely if policy friction keeps eroding the low-price advantage."]
    notes: Scenario ranges are analytical judgments anchored to public marks already discussed in the retained evidence, not management guidance or a DCF with audited inputs.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV007, CV012, CV013, CV015]
