callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: The valuation reset is meaningful, but it has not yet turned SHEIN into an obviously mispriced opportunity relative to the policy, governance, and compliance risk still visible in public evidence.
    claimRefs: [CV001, CV003, CV004, CV006, CV007, CV008, CV009, CV012, CV013, CV016]
  - calloutType: risk
    title: The key underwriting variable is durability of the low-price model
    body: If higher duties, import-rule tightening, or labor/compliance findings continue to narrow SHEIN's cost advantage, the remaining valuation floor can still move lower even after the 2026 reset.
    claimRefs: [CV006, CV012, CV013, CV014]
