      - ["Sequoia Capital China / HongShan", "Long-standing institutional investor", "Reported participant across private rounds", "Confirm current entity names, stake, liquidity rights, and any distributions."]
      - ["Tiger Global", "Late-stage institutional investor", "Prospectus identifies Tiger-affiliated pre-IPO vehicles", "Confirm aggregate look-through stake and lock-up treatment."]
      - ["General Atlantic", "Growth investor and existing shareholder", "Prospectus identifies an existing holder that also intended to subscribe in the offering", "Confirm post-offering stake and any governance or information rights."]
      - ["Mubadala", "Sovereign wealth investor", "Reported backer of the 2023 private round", "Confirm holding entity, stake, preference terms, and liquidity plan."]
      - ["JAFCO Asia", "Series A investor", "Associated with the initial US$5m financing", "Confirm whether any stake remains after reorganizations and dilution."]
      - ["Hong Kong public investors", "Prospective Class B shareholders", "Offered one-vote shares while Class A founder shares carry ten votes", "Confirm final allocation, free float, cornerstone concentration, and post-listing liquidity."]
    notes: >-
      Partial public map based on the prospectus, Reuters, Revenue Memo, and BaiduWiki;
