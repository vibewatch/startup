callouts:
  - calloutType: "risk"
    title: "Control remains concentrated after the offering"
    body: >-
      A ten-to-one Class A voting ratio gives the four founder beneficiaries about 90%
      of disclosed voting rights under the prospectus assumptions, limiting ordinary
      Class B shareholders' influence despite the addition of independent directors.
    claimRefs: [CO011, CO012, CO013]
  - calloutType: "insight"
    title: "Use two dates for origin, not one"
    body: >-
      The evidence supports a 2008 predecessor origin and a 2012 launch of the current
      company with four founders. Keeping both conventions visible avoids false precision
      in downstream analysis.
    claimRefs: [CO001, CO002]
