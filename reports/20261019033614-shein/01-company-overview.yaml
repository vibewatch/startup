      - ["Miao Miao", "Co-founder, executive director, COO", "Operations, global expansion, localization, and social-media marketing", "Long operating tenure and execution across approximately 160 markets", "High: core operating execution and founder voting rights."]
      - ["Xiaoqing Gu", "Co-founder, executive director, chief product officer", "Product selection, analytics-led trend identification, and market adaptation", "Direct ownership of product breadth and localization", "High: product engine and founder voting rights."]
      - ["Xiaoqing Ren", "Co-founder, executive director", "Public affairs and corporate responsibility; formerly chief supply chain officer", "Built supplier software adoption, logistics, and supply-chain coordination", "High: regulatory interface, supply-chain history, and founder voting rights."]
