    notes: "Values preserve Sheng Lu's Euromonitor attribution and Statista's stated period; they are sales or download indicators, not audited customer counts, retention, or profitability."
    claimRefs: [CU005, CU006, CU007, CU008, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or cohort
      - Segment
      - Purchase or use evidence
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - [Michaela, "17-year-old value-fashion shopper", "Reported a GBP 150 order of more than 16 items", "Real consumer purchase", "Affordability and influencer discount codes encouraged more buying", "Single BBC interview; no frequency or lifetime value"]
      - [Jess Gavin, "21-year-old former shopper", "Bought tops and swimwear during the pandemic", "Real former consumer use", "Stopped purchasing as ethical concerns became more important", "Single BBC interview; no representative churn rate"]
      - ["Global female customer cohort", "Women shoppers worldwide", "Statista reports roughly nine in ten SHEIN customers are women", "Observed market-data cohort, not a pilot", "Shows strong demographic concentration", "No named individuals, sampling detail, conversion, or retention"]
    notes: "Sample coverage includes two named BBC interviewees and one Statista demographic cohort; it is illustrative rather than exhaustive or representative."
