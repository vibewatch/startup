      coverage: sample
      basis: "Publicly accessible named BBC consumer interviews and one 2025 global demographic cohort in the assigned evidence pool."
    claimRefs: [CU003, CU009, CU010]
figures:
  - id: FU001
    title: Customer journey and expansion loop
    type: journey-map
    summary: "Observed acquisition and engagement mechanics form a repeatable loop, but no sourced conversion or retention rates are available."
    data:
      nodes:
        - label: Social discovery
          detail: "Influencers, TikTok, Instagram, and user-generated haul content introduce the assortment."
          value: "Acquisition surface"
        - label: Low-price browse
          detail: "A broad, frequently refreshed catalog lets price-sensitive shoppers explore many categories."
          value: "Consideration"
        - label: Trial purchase
          detail: "Low item prices and discounts reduce the initial basket threshold."
          value: "First order"
        - label: In-app engagement
          detail: "Daily logins, reviews, sharing, live streams, and other tasks can earn points or discounts."
          value: "Return visit"
        - label: Repeat purchase prompt
          detail: "Rewards and continuous assortment refresh create another reason to revisit and buy."
          value: "Expansion mechanism"
        - label: Social amplification
          detail: "Hauls, reviews, and referrals can return customer activity to the discovery stage."
          value: "Advocacy loop"
    approximationNotes: "Ordered stages synthesize reported mechanics; no conversion rate, cohort retention, or value-proportional sizing is inferred."
    claimRefs: [CU011, CU012, CU013]
callouts:
  - calloutType: strength
    title: Geographic demand is broader than the U.S.
    body: >-
      Selected European markets and Brazil grew in 2025, and their reported combined apparel sales
      exceeded U.S. sales, reducing dependence on a single demand geography without proving equal
      profitability.
    claimRefs: [CU007, CU008, CU015]
  - calloutType: risk
    title: Engagement is not verified retention
    body: >-
      Reward mechanics, app rank, and customer anecdotes demonstrate reach and reasons to revisit,
      but they cannot substitute for cohort repeat rates, churn, NRR, GRR, or concentration data.
    claimRefs: [CU005, CU011, CU014]
