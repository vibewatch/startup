  topStrengths:
    - Unusually large confirmed scale, with 2025 net revenue above US$41.8 billion and 273 million active customers.
    - >-
      A differentiated demand-sensing and small-batch supply chain still gives the business speed and assortment
      flexibility.
    - >-
      The IPO filing improves visibility into governance, scale, and founder control versus earlier private-market
      opacity.
  topRisks:
    - >-
      Regulatory and trade-rule dependence remains a central structural risk, especially as de minimis and tariff
      settings change.
    - Labor, compliance, and reputational scrutiny over sourcing and working practices continue to overhang the listing.
    - Disclosure gaps remain around cash conversion, segment margins, and post-IPO ownership and capital structure.
  unresolvedGaps:
    - Final listing completion, secondary sales, and the exact post-offering ownership mix remain unresolved.
    - Audited cash conversion, working-capital intensity, and free cash flow are still not publicly underwritten.
    - Segment-level profitability by geography and channel remains unclear.
