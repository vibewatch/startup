companyProfile:
  summary: >-
    SHEIN is a Singapore-headquartered, China-centered online fashion and lifestyle retailer that combines direct-to-
    consumer sales, a marketplace layer, and a test-and-reorder supply chain model. Its current evidence set shows
    unusually large scale, concentrated founder control, and a still-live Hong Kong IPO process, but it also leaves
    important questions open around final listing completion, post-offering ownership, and cash-conversion quality.
