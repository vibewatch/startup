  - id: TV002
    title: 正 / 反论点表
    columns:
      - 论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - 正论点
        - 对刚上市的零售商而言，这种规模证明并不常见：281 million 活跃客户、超过 10 亿笔订单，且估值已大幅低于 2022 年峰值。
        - 如果上市后股价持续高于区间，同时利润率和现金转化披露更清晰，将强化买入逻辑。
      - - 反论点
        - 关税变化已经冲击美国收入，增长接近停滞；合规和采购争议仍可能压低估值倍数。
        - 如果美国增长持久反弹且利润率不再受损，反论点就会减弱。
      - - 关键摆动因素
        - 治理和融资条款很关键：创始人保留 90% 的投票权，SHEIN 同意向部分特别股份持有人支付最多约 $3.5B。
        - 如果正式招股书补充转换、付款时间、锁定期和存续投资者保护的细节，投资判断将明显改善。
    notes: 基于留存证据中最有力的正反论点快照；第三行突出最可能改变投资结论的尽调事项。
