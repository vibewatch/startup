        title: 管理层、董事会与控制权
        blocks:
          - type: paragraph
            body: >-
              招股书确认四位联合创始人均在经营层任职：Yangtian (Sky) Xu 为创始人、董事长兼 CEO；Miao Miao 为 COO；Xiaoqing Gu 为首席产品官；Xiaoqing Ren
              为负责公共事务和企业责任的执行董事，此前担任首席供应链官。三位拟任独立非执行董事将披露的董事会规模扩至七人。经济持股与投票权明显分离：Reuters 报道四位创始人持有控股公司 65% 的股份；A
              类股每股有十票，招股书则按发行后假设将约 90% 的投票权分配给四位创始人受益人。因此，创始人团队的延续既是战略资产，也是重大的治理依赖。
