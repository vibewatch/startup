  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是线上快时尚，而非泛零售
        blocks:
          - type: paragraph
            body: >-
              对 SHEIN 最稳妥的市场定义是数字优先的快时尚零售：通过移动 App
              和网站，直接向对价格敏感的消费者销售服装及相邻生活方式商品；这些消费者通过社交媒体而非门店发现产品。这个边界比广义电商更窄，因为公司的优势在于趋势响应速度、购物篮可负担性和跨境包裹经济性；但又比单一服装细分更宽，因为目录已覆盖女装、男装、童装、美妆和配饰。因此，市场应围绕线上时尚需求、社交电商获客和直接进口履约来界定，而不是传统门店驱动的服装零售。
            claimRefs:
              - CM001
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM010
              - CM014
      - number: '2.2'
        title: 公开市场规模更适合作为多重透镜，而不是干净的 TAM-SAM-SOM
        blocks:
          - type: paragraph
            body: >-
              公开来源确实证明 SHEIN 已经捕获了巨大的消费者支出和注意力，但使用的是不同口径：公司电商净销售额、公司收入、App 下载排名、品牌知名度以及私募市场或 IPO
              估值。这些指标有助于交叉判断规模和估值相关性，却不是干净的品类 TAM，因为它们把公司业绩、市场代理指标和投资者情绪混在一起。实际尽调应把 SHEIN
              视为已达到全球时尚规模的公司，同时仍要求管理层或承销商材料拆分细分市场 SAM 和各国贡献利润率。
