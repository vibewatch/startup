      - number: '1.2'
        title: 规模、盈利与资本历程
        blocks:
          - type: paragraph
            body: >-
              招股文件提供了目前最强的规模基线：2025 年净收入 US$41.847 billion、净利润 US$2.064 billion，约 160 个市场有 273 million 名活跃客户，截至 2026 年 3
              月 31 日员工 17,751 人。这些指标不能混为一谈：活跃客户是至少下过一单的账户，净利润不等于现金创造，融资所得也不等于今天可用的现金。最近一个报告季度的动能也有所转弱：SHEIN 录得 US$99
              million 会计亏损，而上年同期净利润为 US$395 million。发行区间对应的市值为有条件的 HK$202.1-HK$210.2 billion，但现有资料无法确认交易已经完成。
