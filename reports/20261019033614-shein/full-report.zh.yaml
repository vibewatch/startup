          - type: callout
            title: 缓释成熟度更多是声称，而非证明
            body: 治理、隐私、安全和供应商准则页面都已公开可见，但指定资料没有足够的结果证据来实质性降低剩余风险敞口。
            calloutType: assumption
            claimRefs:
              - CR002
              - CR015
          - type: callout
            title: 用客观止损标准，而不是泛泛的 ESG 安慰
            body: 新的强迫劳动或隐私行动、再次上市受阻，或由海关推动的明确利润率重置，都比单纯的管理层叙事更能说明投资逻辑正在破裂。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格重置，但并非完全去风险
        blocks:
          - type: paragraph
            body: >
              当前证据中最清晰的估值事实是：与投资者曾在私募轮讨论的价格相比，SHEIN 必须接受低得多的公开市场定价框架。香港 IPO 发行 280 million 股，定价 HK$47.60-HK$49.50，对应约
              $26.8 billion 股权价值，最高发行价下的募资约为 $1.77 billion。该区间远低于接近 $100 billion 的 2022 年高点，也低于 2026 年 8 月启动前仍在讨论的
              $30-$40 billion
              区间，说明价格发现已经明显转向不利于公司。重置并不意味着股票自动便宜：公开市场投资者要给一家规模庞大、成熟的跨境零售平台做投资判断，而其最新披露的经营信号包括第一季度亏损、上半年增长大致持平以及美国受关税推动的压力。换句话说，市场已经承认
              SHEIN 不再是纯粹的超高速增长故事，但当前区间仍要求相信规模、供应链响应和客户需求能够跑赢不断上升的贸易摩擦与合规成本。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
      - number: '8.2'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >
              证据平衡支持中等信心、较高风险评级下的“跟踪”立场。积极的一面是，SHEIN 对一家 IPO 阶段零售商而言规模异常：BBC 报道截至 2026 年 3 月底有 281 million 名活跃客户、订单超过 10
              亿笔；独立评论仍将其视为少数真正触达全球消费者的互联网零售公司之一。问题在于，当前价格需要消化的风险组合已经不同于投资者在 2022 年愿意承受的组合。第一季度亏损、贸易规则变化后美国收入下降
              14.3%，以及明确警告上半年增长应跟随疲弱的第一季度，都反对支付高增长倍数。FashionNetwork 将其约 0.7x 预测销售额与 Zalando 的 0.4x、H&M 的 1.1x 和 Inditex
              的 4.0x
              比较，说明申报区间不再极端，但考虑到创始人投票控制集中、据报道存在特别股现金义务，以及持续的监管和劳工审查，当前价格也谈不上明显慷慨。因此，合理做法是等风险更低再入场，或等披露改善，而不是在证据不完整时强行买入。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
