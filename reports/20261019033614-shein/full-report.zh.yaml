      - number: '4.2'
        title: 单位经济与利润率路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开信号是，规模并没有让 SHEIN 免受利润压力。CNBC 称，2025 年收入增长仅 8%，低于前一年的 20.7%；美国结束小包裹 de minimis 豁免且公司计入一次性会计费用后，2026
              年第一季度转为 $99 million 亏损。Sacra 提供了不同但方向一致的视角：2026 年第一季度经营利润同比下降 26% 至 $258 million，营销和履约费用上升使经营利润率从 3.9% 收窄至
              2.9%。运营模式仍具备速度、低客单价和小批量库存纪律，但公开证据没有量化实际 CAC、回收期、退货、折价销售或按地区划分的贡献利润率。
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI006
              - CI009
              - CI010
