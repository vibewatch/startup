      - number: '2.3'
        title: 价格、社交发现和供应响应驱动采用
        blocks:
          - type: paragraph
            body: >-
              核心需求引擎很直接：消费者想要极低价格和持续上新的商品，SHEIN
              则通过达人驱动的发现机制，加上能够快速测试小批量并补单畅销品的供应链来满足需求。这样缩短了从注意到购买的路径，尤其适合本来就在线购买服装、并在社交平台浏览穿搭灵感的年轻消费者。最终形成的模式具备较高的漏斗上游效率、快速
              SKU 试验和鼓励高频购买而非谨慎规划衣橱的购物体验。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
      - number: '2.4'
        title: 监管与关税摩擦如今和需求一样影响估值
        blocks:
          - type: paragraph
            body: >-
              SHEIN 的市场机会仍然巨大，但其以低成本、全球化方式开发机会的权利正承受压力。美国 de minimis
              低值包裹待遇曾帮助公司保持到岸价格竞争力，而公开报道如今称，这一顺风消失、成本上升以及美国和欧洲的监管审查正在挤压利润率和市场情绪。这解释了为什么规模指标仍然亮眼而估值却在压缩：市场折价的不是时尚品类的大小，而是进口政策、消费者保护、平台设计和供应链信任方面的执行风险。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 需求强劲，因为购物循环被设计成高频
            body: SHEIN 的优势不只是“便宜时尚”，而是低客单价、社交证明和补货模式的组合：它能足够快地把趋势信号变成可购买库存，从而培养用户使用 App 的习惯。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM008
          - type: callout
            title: 估值如今对政策和信任的敏感度高于单纯触达
            body: 公开市场投资者似乎把进口政策、消费者保护审查和供应链可信度视为一阶变量，因此巨大的收入和知名度不会自动转化为更高的估值倍数。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 相关竞争环境远不止快时尚 App
        blocks:
          - type: paragraph
            body: >-
              这组资料中的公开竞争者名单一贯把 SHEIN 与 ASOS、Boohoo 和 PrettyLittleThing 等线上快时尚同行，Zara、H&M 和 Forever 21 等传统品牌，以及
              Amazon、AliExpress 和 Temu 等平台放在一起。这很重要，因为买家并不只是在两个类似 SHEIN 的 App
              之间选择；他们也可以通过趋势时尚专业商家、全渠道传统品牌，或靠流量和品类而非单纯精选取胜的低价综合平台，完成同样的穿衣需求。替代方案还包括强调伦理或耐用性的品牌，但这些来源将其与核心低价快时尚群体分开，而没有视为等价选项。

              竞争重叠正在扩大，因为 SHEIN 已不再只是狭窄的女装店。该资料中的独立描述将公司定义为覆盖男装、童装、配饰、鞋履、美妆、家居及其他生活方式商品的多品类线上零售商。因此竞争压力是双向的：SHEIN
              以价格和速度攻击传统品牌，而平台和综合零售商则以品类广度、履约冗余和既有流量反攻 SHEIN。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP010
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.2'
        title: SHEIN 的优势是流程优势，而不是受保护的用户群
        blocks:
          - type: paragraph
            body: >-
              证据中最清晰的差异化来自运营。两家独立的 2026 年来源描述了同一核心循环：SHEIN
              以极小的首批数量推出产品，实时读取需求，并在约五天内为畅销品补货。这种节奏由远大于小型同行通常能调动的供应商网络支撑；2025 年有 7,500 家活跃供应商，且没有单一供应商占采购额超过
              10%。实际上，SHEIN 依靠的不是排他性品牌偏好，而是购物需求、供应商分配和目录更新之间异常快速的反馈回路。

              但这并不意味着其地位不可攻破。资料中的公开评论反复将 Zara 和 H&M 描述为速度较慢但仍可信的趋势零售商；ASOS、Boohoo 和 PrettyLittleThing
              则是面向同一趋势敏感型消费者的更直接线上同行。其运营护城河看起来真实，但本质是速度、工作流整合和目录试验，而不是合同锁定或对终端客户拥有专有分销权。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP011
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP011
      - number: '3.3'
        title: 持久性取决于速度能否跑赢监管和轻易多平台购物
        blocks:
          - type: paragraph
            body: >-
              描述 SHEIN 优势的同一批来源，也指出竞争者最可能缩小差距的方式。Sheng Lu 的 2026 年分析称，2025 年存放在中国大陆仓库的商品仍占净收入的 90% 以上，而美国取消 de minimis
              待遇已经减少美国销售、放缓收入增长并提高履约费用。标题所说的低价优势部分依赖以中国为中心的物流和贸易体系，而不是持久的客户锁定。如果关税、海关摩擦或本地履约规则持续恶化，拥有更多元履约基地的传统品牌和平台就会获得竞争空间。

              买方侧也显得结构性松散。替代方案和商业模式资料描述的是社交驱动浏览、持续促销和庞大替代集，而不是深层转换壁垒。消费者可以在 SHEIN、ASOS、Boohoo、Temu、Amazon 或 Zara
              之间浏览，无需签订合同或实施迁移项目，因此应假设用户会多平台购物。运营引擎能带来发现速度上的持久优势，但客户关系本身比背后的供应链循环更容易受到竞争者挑战。
            claimRefs:
