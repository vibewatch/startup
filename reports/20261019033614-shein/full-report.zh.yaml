      - CO015
  - id: FM001
    title: 市场规模与采用度视角堆栈
    type: pyramid
    summary: 最有力的公开证据构成一套视角堆栈：从可触达的数字需求，到公司规模的消费支出捕获，再到计入风险折价的估值视角。
    data:
      items:
        - label: 广泛的线上服装需求
          value: 92% of U.S. consumers shopped clothing online
          note: Mintel 美国视角；过去 12 个月的线上服装参与度
          tone: opportunity
          claimRefs:
            - CM005
        - label: 对价格敏感的女性核心客群
          value: ~90% women; price is the top purchase consideration
          note: Statista 对 SHEIN 买家的客户画像
          tone: opportunity
          claimRefs:
            - CM002
            - CM003
        - label: 社交发现引擎
          value: Influencer, TikTok, Instagram, and haul content drive awareness
          note: 获客视角，未披露单一转化率
          tone: neutral
          claimRefs:
            - CM004
        - label: 应用与品牌触达
          value: '#2 shopping app worldwide in 2025; U.S. awareness above 70%'
          note: 采用度代理指标，而非支出分母
          tone: opportunity
          claimRefs:
            - CM007
        - label: 大额支出捕获
          value: E-commerce net sales surpassed $50B in 2025
          note: 公司规模的电商视角，不是品类 TAM
          tone: opportunity
          claimRefs:
            - CM006
        - label: 风险折价估值
          value: Early-2026 ~$66B private valuation vs. ~$27B IPO valuation
          note: 监管、关税和信任摩擦压缩公开市场视角
          tone: risk
          claimRefs:
            - CM012
            - CM013
    approximationNotes: 这是按决策顺序排列的堆栈，而非数学嵌套的 TAM-SAM-SOM 层级；逐层收窄体现分析范围缩小，不代表单位可比。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于现有来源对流程和商品组合的公开描述，绘制重叠度与广度的序数图。
    data:
      xAxis:
        label: 与 SHEIN 的商业模式重叠度
        min: 1
        max: 5
        low: 零售逻辑不同
        high: 零售逻辑非常相似
        description: Ordinal score from public channel, merchandising, and operating-model descriptions
        scale: ordinal
      yAxis:
        label: 核心服装之外的商品组合广度
        min: 1
        max: 5
        low: 主要是服装
        high: 广泛的多品类 Marketplace
        description: Ordinal score from public category descriptions
        scale: ordinal
      points:
        - label: SHEIN
          x: 5
          'y': 4
          tone: opportunity
          note: 锚点：超快时尚核心业务，加上 Marketplace 和非服装品类扩张。
          claimRefs:
            - CP002
            - CP003
            - CP011
        - label: Zara
          x: 4
          'y': 2
          tone: neutral
          note: 趋势重叠度高，但现有公开来源将其描述为品类广度较低、速度慢于 SHEIN。
          claimRefs:
            - CP007
        - label: H&M
          x: 4
          'y': 2
          tone: neutral
          note: 现有快时尚基准，在高性价比服装上重叠，而非 Marketplace 广度上重叠。
          claimRefs:
            - CP007
        - label: ASOS / Boohoo / PLT
          x: 5
          'y': 2
          tone: neutral
          note: 公开替代名单中最接近的数字优先快时尚同业集合。
          claimRefs:
            - CP001
            - CP008
        - label: Temu / AliExpress
          x: 3
          'y': 5
          tone: risk
          note: 与直接同业的时尚模式重叠较低，但低价 Marketplace 品类广度很高。
          claimRefs:
            - CP001
            - CP009
        - label: Amazon
          x: 2
          'y': 5
          tone: risk
          note: 流量和品类广度比时尚专业化更重要。
          claimRefs:
            - CP001
            - CP009
    approximationNotes: 坐标轴是对公开描述的序数综合，不是实测基准或隐含的市场份额排名。
    claimRefs:
      - CP001
      - CP002
      - CP007
      - CP008
      - CP009
      - CP011
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: SHEIN 通过应用转化、小批量供应响应，以及不断扩大的自营销售与平台变现组合，把创作者驱动的需求转化为收入；关税、履约和营销成本则压缩毛利。
    data:
      nodes:
        - id: discovery
          label: 社交与创作者发现
          detail: 网红试穿、联盟链接和折扣码把消费者导入 SHEIN 应用和网站。
        - id: session
          label: 应用会话与转化
          detail: 积分、签到、闪购和低标价把浏览转成订单。
        - id: test
          label: 小批量需求测试
          detail: 新款以小批量上线，只有经需求验证的赢家款才扩大规模。
        - id: supply
          label: 供应商扩产与发货
          detail: 供应商加快生产，并通过对关税敏感的物流模式跨境发货。
        - id: first-party
          label: 自营商品收入
          detail: 自有品牌服装和相邻生活方式品类看起来仍贡献了大部分已报告收入。
        - id: platform
          label: Marketplace 与 Xcelerator 费用
          detail: 第三方佣金和外部品牌的工厂接入，增加了更轻资产的变现层。
        - id: gross-profit
          label: 摩擦后的毛利
          detail: 营销、履约、海关、合规和退货决定规模有多少能转化为利润。
      edges:
        - from: discovery
          to: session
        - from: session
          to: test
        - from: test
          to: supply
        - from: supply
          to: first-party
        - from: first-party
          to: platform
        - from: platform
          to: gross-profit
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
  - id: FE001
    title: 产品架构图
    type: stack
    summary: SHEIN 的公开产品栈以数据驱动的商品运营闭环为核心，外层包裹物流和合规层。
    data:
      layers:
        - label: 客户需求输入
          detail: 移动端、社交媒体和站内行为
          items:
            - 移动优先的浏览和购物活动
            - 社交媒体与搜索趋势信号
          outputs:
            - 趋势假设与候选 SKU
        - label: 商品运营决策闭环
          detail: 小批量测试与复购引擎
          modules:
            - 首批发售量低至 100-200 件
            - 实时观察需求
            - 只扩大有效款式
          outputs:
            - 快速刷新 SKU，降低初始库存风险
        - label: 供应商协同
          detail: 销售跟踪与工厂沟通
          modules:
            - 专有销售跟踪软件
            - 与工厂实时沟通
            - 分布式制造合作伙伴
          outputs:
            - 缩短从设计到交付的周期
        - label: 履约与商品组合扩张
          detail: 跨境核心业务，加上本地节点和 Marketplace
          modules:
            - 从中国供应基地直接发货
            - 仓库和配送中心
            - 第三方 Marketplace 卖家
          outputs:
            - 更广的目录和本地化配送选项
        - label: 合规与循环经济覆盖层
          detail: Marketplace 治理与可持续运营
          modules:
            - 120+ 个 EPR 计划
            - 卖家合规支持
            - 由 CIGM 和 Aloqia 支持的采购改进
          outputs:
            - 控制成本更高，但更能适应监管
        - label: 购后反馈闭环
          detail: 规模带来更多数据，也带来更高的控制要求
          modules:
            - 订单量反馈推动品类扩张
            - 区域隐私和 Marketplace 调查
          outputs:
            - 在更严格审查下持续调整运营模式
    approximationNotes: 架构综合自公开描述，而非内部系统图。
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程与扩张闭环
    type: journey-map
    summary: 观察到的获客与参与机制形成可重复闭环，但没有来源支持的转化率或留存率。
    data:
      nodes:
        - label: 社交发现
          detail: 网红、TikTok、Instagram 和用户生成的试穿内容带来商品组合。
          value: Acquisition surface
        - label: 低价浏览
          detail: 广泛且频繁更新的目录，让价格敏感的消费者探索多个品类。
          value: Consideration
        - label: 试购
          detail: 低价商品和折扣降低首次购物门槛。
          value: First order
        - label: 应用内参与
          detail: 每日登录、评价、分享、直播和其他任务可赚取积分或折扣。
          value: Return visit
        - label: 复购触发
          detail: 奖励和持续更新的商品组合，给消费者再次访问和购买的理由。
          value: Expansion mechanism
        - label: 社交放大
          detail: 试穿、评价和推荐可将客户活动带回发现阶段。
          value: Advocacy loop
    approximationNotes: 阶段顺序综合了已报道的机制；未推断转化率、群组留存或按价值比例的规模。
    claimRefs:
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 六项风险矩阵显示，劳工审查、海关经济性、隐私执法和 IPO 执行仍是最重大的剩余风险敞口。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
      rows:
        - label: 供应商劳工 / 强迫劳动审查
          values:
            - label: 高
              detail: 争议和法律审查仍在持续
            - label: 严重
              detail: 可能影响进口准入、品牌信任和上市质量
            - label: 中低
              detail: 存在公开论据，但审计结果证据不完整
        - label: De minimis / 海关利润率挤压
          values:
            - label: 高
              detail: 监管变化已经侵蚀历史优势
            - label: 高
              detail: 运输优势下降可能迫使价格或利润率重置
            - label: 中
              detail: 管理层拥有一些网络和定价杠杆，但公开证据有限
        - label: 欧盟隐私 / 数据传输执法
          values:
            - label: 中高
              detail: 已报道的行动表明监管机构正在积极关注
            - label: 严重
              detail: 隐私制裁可能升级，不止一次性罚款
            - label: 中低
              detail: 现有来源无法证明整改有效
        - label: IPO 上市地点 / 披露延误
          values:
            - label: 中高
              detail: 此前两个上市地点路径均未完成
            - label: 高
              detail: 延误或重新定价会直接影响退出时点和估值
            - label: 中
              detail: 香港进展确实存在，但不等于零风险
        - label: Marketplace 卖家质量 / IP 外溢
          values:
            - label: 中
              detail: 风险随 3P 占比和卖家入驻规模上升
            - label: 高
              detail: 仿冒品、受限商品和产品安全问题扩大风险边界
            - label: 中
              detail: 政策看似合理，但现有来源未公开卖家质量指标
        - label: 政策到执行的落差
          values:
            - label: 中
              detail: 公开控制页面减少了不确定性，但本身不能降低结果风险
            - label: 中高
              detail: 如果控制薄弱，多类风险可能同时叠加
            - label: 中低
              detail: 已分配的证据比实测结果更清楚地揭示了风险姿态
    approximationNotes: 各单元格是根据有证据支撑的主张综合出的序数评估，不是统计概率，也不是精算损失估计。
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR007
      - CR009
      - CR010
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 规模仍支撑上市可行性，但从关税和合规压力到利润率不确定性的因果链，最终仍只能给出继续观察的判断。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 截至 2026 年 3 月底，活跃客户数为 281M，订单数超过 1B。
          claimRefs:
            - CV010
        - id: reset
          label: 估值重置
          detail: 申报区间对应约 $26.8B，低于 2022 年接近 $100B 的峰值。
          claimRefs:
            - CV001
            - CV003
        - id: growth
          label: 增长放缓
          detail: 2026 年 Q1 转为亏损，上半年增长指引仍接近 Q1 水平。
          claimRefs:
            - CV004
            - CV005
        - id: policy
          label: 贸易规则敞口
          detail: 低值免税规则变化和更高关税已经削减美国收入。
          claimRefs:
            - CV006
            - CV012
        - id: governance
          label: 治理悬置
          detail: 创始人保留 90% 的投票控制权，而特殊股份持有人可能获得最高约 $3.5B 现金。
          claimRefs:
            - CV008
            - CV009
        - id: call
          label: 建议
          detail: 在价格或披露改善前继续跟踪。
          claimRefs:
            - CV016
      edges:
        - from: scale
          to: reset
          label: 庞大需求基础保住了 IPO 机会
          claimRefs:
            - CV001
            - CV010
        - from: reset
          to: growth
          label: 公开市场投资者重新评估了较弱的经营势头
          claimRefs:
            - CV003
            - CV004
            - CV005
        - from: growth
          to: policy
          label: 利润率和需求压力都可追溯至贸易摩擦
          claimRefs:
            - CV005
            - CV006
            - CV012
        - from: policy
          to: governance
          label: 外部风险放大了控制权条款的重要性
          claimRefs:
            - CV009
            - CV012
            - CV013
            - CV014
        - from: governance
          to: call
          label: 入场纪律仍然严格
          claimRefs:
            - CV009
            - CV016
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV016
