  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              SHEIN 的公开财务图景仍以极低价、App 驱动的跨境零售自营商品为起点，但保留的来源也显示管理层正在拓宽核心业务之外的变现。CNBC 和 The Business Times 都报道 2025 年净收入为
              $41.8 billion；Sacra 和公开参考页面则指出另外两层变现：第三方平台佣金，以及面向外部品牌的 Xcelerator 供应链服务。投资判断的重点已不再是 SHEIN
              是否有可观收入，而是其中有多少仍来自占用库存的自有品牌服装，又有多少来自潜在营运资本强度更低的新平台业务。公开来源没有披露当前收入结构、当前抽佣率或分部毛利率，因此收入多元化在方向上可见，但无法精确到分部层面进行投资判断。
