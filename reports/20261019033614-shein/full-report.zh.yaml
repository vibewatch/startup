      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              香港 IPO 改善了流动性，却没有解决核心资本充足性问题。CNBC 报道投资者正推动 SHEIN 接受约 $30 billion 估值，而 Sacra 称发行目标约为 $27 billion 隐含估值、最多
              $1.8 billion 募资，远低于接近 $100 billion 的私募高点。这个重置很重要：市场如今更像在给一家承压的全球零售商估值，而不是一家超高速增长平台。公司仍在供应链和技术上投入大笔资金：CNBC
              报道 Sky Xu 承诺向广东智能供应链系统投入超过 10 billion yuan；The Business Times 称上市所得将用于技术、营销和环保项目。但公开证据仍未说明当前现金、债务、契约负担或
              IPO 后资金续航。
            claimRefs:
              - CI011
              - CI012
              - CI014
      - number: '4.4'
        title: 尽调阻塞点与财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，SHEIN 的公开投资逻辑在商业规模上最强，在披露质量上最弱。Statista
              明确指出公司没有披露正式财务报表；保留资料中的关键投资判断输入要么是推断出来的，要么完全缺失，包括经审计的收入确认、现金转换、当前营运资本强度、品类和国家利润池、当前平台收入占比、获客效率及留存质量。结论因此是混合的。SHEIN
              似乎拥有出色的需求捕获能力、差异化的速度引擎以及日益多元的变现选择，但公开证据也显示增长放缓、到岸经济性对关税敏感、执行复杂度上升。与其假设 IPO 解决了这些问题，不如继续跟踪收入质量和资本强度。
            claimRefs:
              - CI001
