      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 跟踪，而非买入
            body: 估值重置意义重大，但相对于公开证据仍显示的政策、治理和合规风险，它尚未让 SHEIN 成为一个显然定价错误的机会。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV016
          - type: callout
            title: 最关键的投资判断变量是低价模式的持久性
            body: 如果更高关税、进口规则收紧或劳工与合规调查继续压缩 SHEIN 的成本优势，即使经历 2026 年重置，剩余估值底部仍可能进一步下移。
            calloutType: risk
            claimRefs:
              - CV006
              - CV012
              - CV013
              - CV014
