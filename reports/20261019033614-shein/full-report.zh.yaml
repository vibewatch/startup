chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              SHEIN 是一家总部位于新加坡的线上时尚与生活方式零售商，当前控股公司注册于开曼群岛，运营足迹仍与中国有实质联系。2026
              年招股书将集团定义为直面消费者与平台型业务，使用自有的大规模自动化测试与补单（Large-scale Automated Test and
              Reorder）模式，以小批量测试需求、读取销售信号并补充畅销品。创立时间需要谨慎处理：多家二手资料将 Chris Xu 主导的前身追溯至 2008 年，而招股书和 Reuters 将现公司的成立认定为 2012
              年由四位联合创始人启动。更准确的做法是区分前身起源与现集团成立，而不是把两者合并成一个未经限定的创立年份。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
