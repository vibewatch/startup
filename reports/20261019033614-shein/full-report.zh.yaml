          detail: SHEIN 正式推出面向其他品牌商品的 Marketplace。
          tone: positive
          claimRefs:
            - CO003
        - date: '2024'
          label: 2 亿活跃客户
          detail: 招股书里程碑表记录了 2 亿年度活跃客户。
          tone: positive
          claimRefs:
            - CO007
        - date: '2025'
          label: Xcelerator 与 US$41.847 billion 收入
          detail: 公司将 SHEIN X 扩展为 Xcelerator，并报告 US$41.847 billion 净收入。
          tone: positive
          claimRefs:
