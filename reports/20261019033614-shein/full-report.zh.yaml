      - number: '8.3'
        title: 情景框架、尽调要求与投资逻辑破坏点
        blocks:
          - type: paragraph
            body: >
              乐观、基准和悲观情景之间的差距异常大，因为剩余未知数与其说是消费者需求，不如说是政策和治理摩擦如何影响利润率、流动性与退出灵活性。乐观情景要求当前估值重置被证明足够，跨境物流趋于稳定，合规审查仍可控，投资者愿意奖励
              SHEIN
              仍然庞大的客户基础和响应迅速的制造模式。基准情景假设申报区间大致公平，但在管理层披露更清晰的股权结构表条款、可持续利润结构和上市后执行数据前，估值倍数上升空间有限。若关税、进口规则，或劳工与采购争议继续侵蚀建立该品牌的低价优势，悲观情景就是进一步下修。在评级从“跟踪”上调前，投资者需要直接尽调剩余的优先股堆叠、锁定期、投票控制的持久性，以及
              IPO 附带的监管和解或契约。如果贸易规则变化继续压缩美国经济性，合规调查升级为实质制裁或分销限制，或公开市场交易迫使估值跌破已降低的区间，投资逻辑就会破裂。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
