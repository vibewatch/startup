  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 关税拖累趋稳，合规审查不再加剧，公开市场投资者认可 SHEIN 的全球客户规模和按需模式。
        - $30B-$40B 的估值可以重新打开讨论，因为这曾是上市前的要价；但前提是证明当前重置过度惩罚，而非必要调整。
        - 任何新的监管制裁或利润率压力再起，都会破坏这一逻辑。
        - 需要上市后执行表现明显好于疲弱的第一季度表现。
      - - 基准
        - 增长保持温和，利润率持续承压但仍可管理；市场继续把 SHEIN 看作成熟的跨境零售商，而非超高速增长平台。
        - 申报文件中的 $26.8B-$27B 股权价值区间是可支撑的锚点；在缺少最终定价、交易表现和正常化现金流证据前，无法量化回报。
        - 如果治理 / 控制权担忧或合规问题仍未解决，上行空间有限。
        - 与申报区间定价和喜忧参半的运营信号最为一致。
      - - 悲观
        - 贸易规则持续收紧，合规审查升级，投资者下调对创始人控制权及资本结构义务的估值。
        - 低于申报文件 $26.8B-$27B 区间的估值在方向上可以成立，但留存证据无法确定精确底部；Zalando 的 0.4 倍销售额倍数是基准，不是目标价。
        - 公开市场出现下轮融资观感、美国需求走弱，或跨境模式被迫改变。
        - 如果政策摩擦继续侵蚀低价优势，这一情景最可能出现。
    notes: 情景区间是锚定留存证据中已讨论公开估值标记的分析判断，不是管理层指引，也不是基于经审计输入的 DCF。
