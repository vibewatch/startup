evidenceGaps:
  - type: missing-source
    severity: material
    topic: IPO-status
    missingEvidence: >-
      A successful post-offering exchange notice or current trading record confirming listing completion, final offer
      price, proceeds, and free float.
    whyItMatters: >-
      The company's current stage and valuation cannot be finalized from an offering prospectus that described
      completion as conditional.
    diligencePath: Obtain the HKEX allotment-results notice, listing announcement, and current issuer profile for stock code 00625.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      A current fully diluted cap table showing beneficial owners, converted preferences, secondary sellers, lock-ups,
      and board or information rights.
    whyItMatters: >-
      Economic ownership, voting control, and investor liquidity determine governance risk and realized financing
      dilution.
    diligencePath: >-
      Request the post-offering register, preference-conversion schedule, shareholder agreements, and
      beneficial-ownership certifications.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: physical-locations
    missingEvidence: >-
      An exhaustive current list of offices, warehouses, fulfillment centers, and material operating subsidiaries by
      geography.
    whyItMatters: >-
      Markets served cannot substitute for physical footprint when assessing fixed costs, operational concentration, and
      jurisdictional exposure.
    diligencePath: >-
      Request the fixed-asset and lease schedules and reconcile them to material subsidiaries and logistics-provider
      contracts.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: tam-sam-som-gap
    missingEvidence: A management or banker view that separates TAM, SAM, and SOM on consistent definitions and geographies.
    whyItMatters: >-
      Public sources mix company net sales, revenue, app rank, brand awareness, and valuation, which are all useful but
      not directly comparable market-size denominators.
    diligencePath: >-
      Request investor deck or internal planning materials that define category, geography, and penetration assumptions
      consistently.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cohort-and-profitability
    missingEvidence: Region-level profitability, repeat-purchase concentration, and cohort-retention detail.
    whyItMatters: >-
      Without cohort and contribution-margin visibility, public adoption signals may overstate the durability of demand
      or understate customer-acquisition risk.
    diligencePath: Request cohort retention, repeat-order frequency, and country contribution-margin cuts from management.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: supplier-compliance-depth
    missingEvidence: Audit-grade disclosure on supplier concentration, remediation outcomes, and current compliance pass rates.
    whyItMatters: >-
      Supply-chain scrutiny is one of the clearest adoption and valuation constraints, but the public pool does not
      quantify current compliance depth well enough.
    diligencePath: Request supplier audit summaries, concentration tables, and regulator correspondence covering sourcing controls.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: pricing-signals
    missingEvidence: A same-SKU or same-basket public price study across SHEIN, Zara, H&M, ASOS, Boohoo, Temu, and Amazon.
    whyItMatters: >-
      Without a normalized basket, the chapter can only describe public price positioning directionally rather than
      prove the magnitude of SHEIN's pricing edge.
    diligencePath: >-
      Collect timestamped SKU-level carts across peer sites by product archetype, geography, shipping, and promotion
      status.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Customer cohort retention, app overlap, and repeat-purchase migration data versus Zara, Temu, Amazon, and other
      peers.
    whyItMatters: >-
      Moat durability depends on whether shoppers truly stick with SHEIN or simply browse multiple low-cost fashion
      destinations.
    diligencePath: >-
      Request internal cohort retention, paid-acquisition overlap, and survey-based substitution data by geography and
      age cohort.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: marketplace-expansion
    missingEvidence: Marketplace GMV mix, merchant count, category penetration, and take-rate by geography.
    whyItMatters: >-
      The marketplace thesis changes who SHEIN competes with and whether general marketplaces become the more relevant
      peer set.
    diligencePath: >-
      Review IPO filing exhibits or management disclosures that split first-party sales from marketplace services and
      category mix.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: >-
      Current cash balance, post-IPO net proceeds actually received, debt facilities, covenants, and cash burn or
      free-cash-flow trend.
    whyItMatters: Without current liquidity and burn data, public investors cannot underwrite runway or financing dependence.
    diligencePath: >-
      Request the IPO proceeds bridge, latest cash balance, debt schedule, and monthly cash-flow summary through
      management diligence.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CAC, payback period, repeat-purchase cohorts, return rates, markdown rates, and contribution margin by region and
      category.
    whyItMatters: >-
      Margin durability depends on whether marketing and logistics inflation is offset by repeat behavior and
      merchandising efficiency.
    diligencePath: >-
      Request cohort retention tables, channel CAC, payback by region, and category-level contribution margin for the
      past eight quarters.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Current split of revenue and gross profit among first-party retail, marketplace commissions, Xcelerator services,
      and ancillary platform fees.
    whyItMatters: >-
      Revenue quality and working-capital intensity depend on how much of growth is still inventory-bearing merchandise
      versus platform fees.
    diligencePath: >-
      Request a segment bridge for 2024, 2025, and year-to-date 2026 with GMV, revenue, gross margin, and returns by
      monetization stream.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: minor
    topic: denominator-consistency
    missingEvidence: >-
      A management reconciliation among company-level net revenue, shein.com e-commerce net sales, marketplace GMV, and
      operating profit definitions.
    whyItMatters: >-
      Public sources use different denominators, which can make growth and valuation comparisons look more precise than
      they are.
    diligencePath: >-
      Request a definitions appendix tying each public metric to audited accounting lines and to marketplace GMV
      treatment.
    relatedQuestionRefs:
      - QI001
      - QI005
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer-signal or practitioner-community proxy such as API usage, package adoption, engineering talks,
      integration-partner implementation detail, or public practitioner discussion.
    whyItMatters: >-
      Without an external practitioner signal, technical maturity is inferred mostly from company pages and business
      commentary rather than from observable builder adoption or implementation depth.
    diligencePath: >-
      Request public or diligence-room evidence on APIs, internal tooling maturity, partner integrations, engineering
      talks, or community usage metrics; if none exist, document why a consumer-retail model lacks a credible proxy.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: architecture-observability
    missingEvidence: >-
      Detailed internal systems architecture, uptime history, incident metrics, recommendation-model governance, and
      fulfillment SLA dashboards.
    whyItMatters: >-
      Public narratives show how the operating model is supposed to work, but not whether the software and operational
      controls consistently perform at the quality level implied by the scale of the business.
    diligencePath: >-
      Ask management for systems diagrams, uptime and latency history, forecast-accuracy metrics, return-rate
      dashboards, and incident postmortems for logistics, seller controls, and data governance.
  - type: missing-source
    severity: material
    topic: supplier-controls
    missingEvidence: >-
      Independent audit-grade evidence on supplier concentration, compliance outcomes, illegal-goods controls, and
