      - 擅长解决什么
      - 相较聚变的短板
      - 预算负责人反应
      - 对 Inertia 的含义
    rows:
      - - 燃气发电
        - 许多市场中便宜的稳定容量
        - 碳暴露与燃料价格波动
        - 在受限电网中仍是默认后备
        - 长期看，聚变必须在可靠性调整后的成本上打败燃气
      - - 传统核电 / 先进裂变
        - 稳定清洁电力与成熟公用事业模式
        - 许可、公众接受度与漫长建设周期
        - 被视为最接近的清洁稳定电力参照
        - 聚变争夺的是类似长期资本
      - - 地热
        - 资源禀赋合适时可提供稳定清洁电力
        - 地理约束与钻井风险
        - 地质条件合适时有吸引力
        - 若能规模化，聚变提供地理灵活性
      - - 可再生能源加储能
        - 边际排放低、部署快
        - 在多日或基荷级稳定供电上可能吃力
        - 通常是脱碳第一步
        - 可再生能源饱和、稳定供电痛点出现后，聚变才更可能进入
      - - 需求管理与输电
        - 可以推迟新增发电
        - 单独使用不会创造新的全天候供应
        - 通常与发电选择搭配
        - 只有能补上更大系统升级，聚变才会赢
