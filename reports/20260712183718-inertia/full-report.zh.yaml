      - number: '8.4'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              正确投资姿态是继续研究，并明确价格纪律。支持性案例是真实的：顶级创始人、LLNL
              相关战略优势、巨大市场潜力，以及非常大的首轮融资。限制性案例也同样真实：没有公开估值条款，没有公开客户证明，通往收入的路径漫长且资本密集。这些事实支持中等置信度、高风险的立场；估值姿态最好描述为仅凭公开证据无法精确评估。下一步尽调不是再做一张类比表，而是拿到实际条款、客户管线和融资路线图。在这些证据到手之前，战略吸引力和可投资价格应被视为相关但独立的问题。公司最终也许配得上溢价结果，但这个结论应由证据赢得，而不是只从创始人声望或轮次规模推断。可选性最高时，这种纪律最重要。
