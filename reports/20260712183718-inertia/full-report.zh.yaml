        - 继续研究
        - 战略叙事强，定价透明度弱
      - - 确信度
        - 中
        - 同业样本有帮助，但缺少公司自身条款
      - - 风险评级
        - 高
        - 尚无收入、资本开支重、融资条款不透明
      - - 估值立场
        - 无法精确评估
        - 没有公开投后估值或清算条款
      - - 入场纪律
        - 没有条款或客户验证，不要按溢价估值承销
        - 证据缺口具有决定性
    notes: 本表把不完整的定价证据转化为可执行立场。
