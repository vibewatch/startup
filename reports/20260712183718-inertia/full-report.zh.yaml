        title: 已完成里程碑与仍不透明之处
        blocks:
          - type: paragraph
            body: >-
              目前的里程碑节奏令人鼓舞，但仍然偏窄。Inertia 可以拿出一条有说服力的序列：NIF 靶增益确立科学起点；公司在 2024 年成立；2026 年 2 月融资支持第一次主要运营推进；2026 年 4 月
              LLNL 合作把推进嵌入国家实验室商业化路径；2026 年 6 月顾问委员会加入独立审视；2026 年 7
              月总部开业证明实体建设已经启动。与此同时，公开记录在投资人通常需要的估值信心指标上仍很薄。抓取到的来源没有披露投后估值、员工数、收入、客户合同、债务或制造吞吐目标，也没有化解行业层面的谨慎：即使融资充足的聚变初创公司，也仍要从实验室证明走很长的路，才能到经济性电站运营。因此，公司概览章的正确读法是平衡的：对一家
              2024 年成立的公司，Inertia 具备异常强的科学谱系、资本和机构杠杆；但仅凭概览证据，还不能在没有更多私下尽调的情况下承销商业牵引或财务质量。
