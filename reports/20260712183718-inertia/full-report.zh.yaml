  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与工程风险
        blocks:
          - type: paragraph
            body: >-
              Inertia
              最硬的风险是工业化。科学谱系是真实的，但公司自己也承认，从一次有名的实验发射到一座有用的电站，中间隔着沉重的工程负担：增益、靶丸、发射频率、壁面存活性和燃料处理。这些不是小的优化任务。它们就是产品本身。由于这些子系统彼此耦合，单点进展仍可能让整座电站论点暴露。今天的公开证据支持的是对问题框架的信心，不是对集成答案已经得到验证的信心。实际承销要点是，公司没有隐藏难题；它只是距离证明这些难题能在商业时间表上一起解决还很远。一个关键含义是，投资人不应把任何单一实验室标题成果
              当作足够的去风险信号。聚变电站成败取决于系统，而系统风险通常比早期物理成功更晚浮现。
