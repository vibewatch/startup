appendices:
  - id: A
    title: 覆盖说明和方法论
    blocks:
      - type: paragraph
        body: >-
          本报告仅基于 2026-07-12 尽调运行期间抓取并通过 startup-research 工作流验证的来源。Inertia
          是一家尚未产生收入的私营深科技公司，传统经营和估值指标要么稀少，要么受管理层控制。因此，本报告重点放在可核验的融资、合作、技术、市场和风险证据上，而不是猜测性的收入模型。
        claimRefs: []
      - type: paragraph
        body: 估值分析刻意保守：公开来源能确认融资规模，但不能确认价格、客户合同，也不能确认通往商业化的融资衔接。因此，本报告把战略吸引力和估值可论证性拆开判断；二者相关，但不等同。
        claimRefs: []
