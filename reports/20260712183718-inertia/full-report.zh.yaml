      - number: '7.3'
        title: 资本、竞争与时点风险
        blocks:
          - type: paragraph
            body: >-
              在聚变领域，资本风险和竞争风险无法分开。FIA 及相关报道仍显示，整个行业有巨大的商业化资金需求。同行项目也在推进：Helion 公开谈监管和部署，CFS 公开谈时间表和供应链。这意味着 Inertia
              不只是在和物理难题竞争，也在和表面证据更充分的对手叙事竞争；后者可能先赢走资本、客户和人才。因此，时点风险有两层：Inertia
              必须跑得足够快以保持相关性，但深科技能源基础设施很少奖励仓促。融资时点失误或长时间里程碑空窗，可能造成不成比例的伤害。投资人应把同行进展视为竞争倒逼，而不是证明这条路对所有人都容易的安慰剂。这一点重要，因为重大公告之间的长间隔，即便内部工作仍在继续，也会看起来像停滞。前沿能源领域里，一旦公开里程碑时钟停摆，市场认知和资本入口可能比底层科学恶化得更快。
