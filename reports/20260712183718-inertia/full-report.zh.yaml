      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据暗示的买方地图相对清楚。超大规模云厂商有吸引力，因为用电需求增长快，采购团队已经会签长期清洁电力合同，AI
              路线图又让可靠容量出现溢价。公用事业公司重要则是另一套原因：如果聚变最终能规模化，它必须进入资源充足性规划、选址、并网和监管框架，而这些正是公用事业公司日常处理的事情。大型工业用户是合理的第三类，因为它们同样重视全天候清洁电力，且常常运营集中式超大负荷场址。但这些群体都不会像今天采购大宗电力一样购买第一座聚变电站。更可能的采用路径，是少数定制化、里程碑很重的锚定合同，绑定场址开发、融资和工程可信度。因此，Inertia
              的首批客户与其说是广义「标杆客户名单」，不如说是证明：成熟付款方愿意为稀缺清洁稳定供给承担进度和技术风险。这也是 CFS 和 Helion 的先例很重要的原因，尽管它们并不是 Inertia 牵引力的直接证据。
