chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、总部，以及公司自称要建什么
        blocks:
          - type: paragraph
            body: >-
              描述 Inertia，最准确的说法不是泛泛的聚变研究机构，而是一个商业化载体：它押注 Lawrence Livermore National Laboratory 的 National Ignition
              Facility
              已验证的间接驱动惯性约束聚变路线。官网和创始人信写得很直白。公司不是声称要发明新的物理机制，而是要把「已验证的聚变科学」工业化，做成能在公用事业规模连续运行的硬件。官方材料里的四步计划前后一致：从 NIF
              已验证科学出发，建超高平均功率激光器，批量制造低成本燃料靶丸，再把这些模块整合成电网级电站。公司现在也有了匹配这一叙事的实体场地。2026 年 7 月材料称，Inertia 在 Livermore 开设了
              50,000 平方英尺总部，围绕靶丸工厂和高能激光项目建设；福利文件还列出了 Livermore 街道地址。这不能证明公司已具备商业就绪度，但足以把 Inertia
              和仍主要停留在幻灯片或研究叙事里的更早期聚变概念区分开。
