        title: 依赖、人员与论点击穿条件
        blocks:
          - type: paragraph
            body: >-
              依赖地图很窄。Inertia 高度依赖 LLNL
              相关诀窍、专业化招聘、耐心资本，以及最终的锚定客户，而这些客户还没有公开出现。对一家前沿硬件公司来说，这种集中度正常，但也意味着扰动会快速传导。击穿论点的条件很具体：关键合作关系无法维持，制造进展长期沉默，无法走出可信的许可路径，或者外部证明点出现前就需要更多资本。公司的公开法律界面很基础，并不会实质改变这些风险结论。总体看，尽管底层愿景质量很高，风险画像仍然很高。即使创始人和投资人都很强，如果外部依赖迟迟不能转化为可衡量的商业去风险，也无法无限期弥补。投资人还应看到，突破中创造上行的同一种集中度，也会在执行中制造脆弱性。狭窄依赖地图能加速学习，但当时间表滑动或关系变化时，也会减少冗余。
