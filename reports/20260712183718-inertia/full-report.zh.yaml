            body: >-
              公开材料把 Inertia
              描述成未来的电力生产商，而不是当前的产品供应商。公司解释了聚变热如何转成电力，也反复把成功定义为电网级电站。这意味着收入模型更可能基于远期售电，而不是近期软件订阅、市场抽成或服务合同。挑战在于时点和确认。只有电站存在、底层发射频率跑通，并且买方或并网路径就位之后，收入才会出现。公开来源没有披露目标电价、PPA
