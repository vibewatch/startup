      - number: '2.2'
        title: 规模测算视角：广义需求巨大，但可用于决策的需求更窄
        blocks:
          - type: paragraph
            body: >-
              公开证据强烈支持这样一个判断：电力需求增长是真实的，清洁稳定电力的价值也在上升，尤其是在数据中心和 AI 周边。本章审阅的 IEA 相关摘要指向几个数字：当前全球数据中心用电量为 485 TWh，到 2030
              年约 950 TWh，其中 AI 相关子集到那时为 465 TWh。相对任何一家聚变初创公司，这些数字都很大。即便是一座 Inertia 规模的 1.5 GW
              电站，只要按公用事业级可用率运行，在广义需求池中也只占很小一部分。但单靠广义需求视角还不够。更好的中间视角，是买方是否愿意在技术完全商业化之前签下清洁稳定电力承购，因为这才是理论需求通往可融资收入的桥。按这个标准，Google
              的 200 MW CFS 协议和 Microsoft 的 50 MW Helion
              协议，比泛泛的市场规模报告更有参考意义。它们说明有些买家愿意提前承销未来的清洁稳定供给，也说明第一批采用者集合仍然很窄。正确结论是，TAM 无疑很大，但 SAM 和 SOM
              更适合用受约束的采购路径表达，而不是用单一美元数字表达。
