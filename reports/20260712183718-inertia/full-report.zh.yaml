  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值证据
        blocks:
          - type: paragraph
            body: >-
              Inertia 有一个重大的公开定价事件，也有一个重大遗漏。定价事件是 2026 年 2 月 $450 million Series
              A。遗漏的是实际估值。公开报道确认这一轮发生，也确认严肃投资人愿意在启动规模上资助公司，但抓取到的来源没有提供投后数字、优先权结构或股价信号。这意味着这一轮证明了市场胃口和叙事强度，却没有证明隐含估值是保守、公允还是激进。投资人可以承认一个真实融资里程碑，同时拒绝承销一个看不见的价格。估值条款缺席在前沿领域尤其重要，因为结构化保护会实质改变名义
              融资规模的经济含义。在风险投资市场，轮次规模大到足以暗示预期已经很高时，缺失条款最关键。披露金额越大，投资人越需要知道背后坐着什么保护或假设。价格不透明仍是主导因素。
            claimRefs:
              - CV001
