      - number: '6.3'
        title: 采用、留存与集中度动态
        blocks:
          - type: paragraph
            body: >-
              采用指标几乎完全缺席。没有披露已签约
              MW、管线价值、账户数量或留存指标。对一家商业化前聚变公司来说，这并不意外，但仍让客户论点主要停留在叙事层面。公开来源支持的少数事项是结构性的：首批买家可能少而大，且战略意义高；采购摩擦会很高；第一个具名客户可能大幅改变融资和市场认知。因此，即便集中度以后可能变成优势，Inertia
              在起步阶段也会面对极端集中度风险。即便第一个客户成功，也可能形成对一两个信用主体、一个场址和一条交付时间线的偏重依赖，所以早年应把集中度同时视为机会和风险。换句话说，缺少经典留存指标可以理解，但连早期商业漏斗指标都没有，仍是实质性尽调问题。
