  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：清洁稳定电力，而不是泛泛的「聚变行业」支出
        blocks:
          - type: paragraph
            body: >-
              Inertia
              的市场定义应当比标题党窄，也更有用。公司真正销售的不是抽象意义上的「聚变」，而是由聚变电站产生的大块清洁、可调度、全天候电力，以及让这种电力成为可能的底层硬件栈。这意味着相关预算不是全球能源总支出，甚至也不是总电力需求，而是公用事业、超大规模云厂商和工业能源预算里分给稳定低碳供给的部分。这个框架立刻厘清了机会和替代品集合。Inertia
              的实际竞争对手不只是其他聚变公司，还包括燃气调峰和联合循环电厂、先进裂变、地热，以及仍需要储能或备用电源来满足全天候负荷的可再生能源组合。市场边界也解释了为什么首批买家更可能是采购集中、能接受长周期的成熟交易方，而不是零售客户或资本较薄的中端市场用户。在尽调中，这是优点，不是缺陷：它把「能源市场很大」的空泛故事，压缩成一个具体问题——Inertia
              能否赢下少数几个规模很大的清洁稳定电力合同。
