      - number: '3.2'
        title: 资本规模、客户证明和公开信号
        blocks:
          - type: paragraph
            body: >-
              今天最大的竞争分叉在资本规模和商业信号。对一家 2024 年成立的公司来说，Inertia
              的启动融资规模巨大，显然领先较小的新进入者。但商业化叙事最容易讲清楚的类别领导者，是那些把资本和具名交易方绑定在一起的公司。CFS 可以指向 Google。Helion 可以指向
              Microsoft。Focused Energy 可以指向 RWE，后者既是投资方，也是与场址相关的公用事业伙伴。TAE 有一条面向公开市场的估值路径。Inertia 与 LLNL
              的关系有战略价值，但它不是客户合同，也没有回答谁会购买第一批电子。这个区别很重要，因为聚变竞争有一部分是在争夺信念：买方、监管机构和未来融资方都在寻找证据，证明一个项目正从前沿科学走向可融资基础设施。Inertia
              在资本上的差距缩小得更快，在公开需求证明上的差距缩小得更慢。
