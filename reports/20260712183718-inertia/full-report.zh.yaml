  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局——直接惯性聚变同行与更广义的聚变头部玩家
        blocks:
          - type: paragraph
            body: >-
              Inertia 所在的聚变赛道拥挤，但分层很明显。最接近的直接竞争并不是所有核能或清洁能源公司，而是一小批试图把聚变变成电网级清洁稳定电力的开发商。在这组公司里，最相关的直接同行是其他惯性聚变项目，尤其是
              Focused Energy 和 Pacific Fusion，因为它们也在追求高能脉冲架构，必须解决类似的制造、靶丸和设施集成问题。更外圈的竞争者包括 Commonwealth Fusion
              Systems、Helion 和 TAE；它们采用不同的等离子体路径，但资本、客户和时间表主张会影响投资人和买方如何给整个类别定标。公开证据显示，Inertia 已经进入头部讨论：$450 million 的
              Series A 异常大，公司又通过正式合作和专利入口故事绑定 LLNL。但进入类别讨论不等于类别领导。在已披露客户证明和时间表可见度上，后期同行目前仍比 Inertia 给出更利于买方判断的证据。
