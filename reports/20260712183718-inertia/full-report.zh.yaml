      - number: '6.4'
        title: 客户结论与尽调路径
        blocks:
          - type: paragraph
            body: >-
              正确结论不是市场弱。市场拉力正越来越清楚。问题在于，Inertia 特定转化仍未被证明。公开同行证据可作为类比，CFS 和 Helion
              的页面也展示了更强公开客户证明长什么样：具名买方、可见场址和更清楚的部署叙事。Inertia
              还没有跨过这个门槛。因此，下一步尽调很直接——拿到真实管线、任何买方意向书、计划中的合同结构，以及从第一个锚定客户到更广泛扩张的顺序。在此之前，客户章节仍是继续研究的故事，而不是商业证明的故事。换句话说，类别证据回答的是「会不会有人买？」；缺失的
              Inertia 证据仍让「谁会向 Inertia 买、按什么条款、什么时候买？」悬而未决。这个转化缺口是核心商业未知。
