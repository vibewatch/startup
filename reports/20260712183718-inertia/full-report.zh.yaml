      - number: '1.2'
        title: 创始人、治理，以及为什么管理层厚度重要
        blocks:
          - type: paragraph
            body: >-
              Inertia 概览中最强的资产，是创始人与市场的匹配。Jeff Lawson 带来 Twilio 时代积累的规模化和资本市场信用；Annie Kritcher
              带来这个细分领域最接近一手的证据，证明底层实验路径可行；Mike Dunne 则带来 LLNL、SLAC 和英国激光生态中的电站设计与大型设施执行经验。聚变初创公司很少同时拥有科学履历和商业领导力，Inertia
              不必在二者之间取舍。顾问架构又叠了一层可信度。2026 年 6 月，Inertia 成立科学技术顾问委员会，由 Marv Adams
              担任主席，成员包括惯性聚变、靶丸、激光和核材料领域的资深专家。公告措辞值得注意：管理层说，委员会的职责是挑刺并做外部评审，而不只是把名字挂到网站上。开放问题不是公司有没有科学火力——显然有。真正的问题是，这套班底能否在风投式时间表下，把一次性的实验室成功转成制造纪律、电站集成和可重复的商业执行。
