      - number: '8.3'
        title: 情景区间与决策规则
        blocks:
          - type: paragraph
            body: >-
              用情景框架比给点估值更诚实，因为未知数集中在通常驱动估值的那些输入上。牛市情形假设轮次条款干净、客户牵引强、里程碑推进，并且有可信融资桥。熊市情形假设长时间延误、重度稀释，并持续缺少交易方。今天的公开证据无法有信心地支持任何一个极端。因此，进入纪律很重要。投资人可以定义哪些证据足以支持提高出价，但不应假装今天能用电子表格精确知道公允价格。情景思维还能避免聚变领域常见错误：在商业证据出现之前，就把战略敬佩转成估值确定性。它也让情景纪律比修辞确定性更有价值。谨慎投资人应提前决定，哪些缺失事实会让公司在某个具体价格上从有意思变成可投资。这样能防止可选性伪装成精确性。
