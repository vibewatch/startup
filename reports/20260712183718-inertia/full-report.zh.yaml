      - - 项目集成领导力
        - 牵动多个子系统
        - 中
        - 关键
        - 创始人与合作伙伴可信度
        - 要求系统集成治理安排
      - - 监管项目管理
        - 电站阶段前很早就需要
        - 中
        - 高
        - 有政策顺风
        - 要求许可负责人和时间线
    notes: 技术项目铺得很宽，公开可见的团队纵深仍然很窄，因此执行风险放大。
