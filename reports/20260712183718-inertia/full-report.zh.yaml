  - id: TV002
    title: 正反论点表
    columns:
      - 视角
      - 多头论点
      - 反向论点
      - 决定因素
    rows:
      - - 轮次质量
        - $450M 融资显示顶级投资者有信心
        - 没有条款，质量就无法验证
        - 披露实际条款清单或股权结构表
      - - 战略资产
        - LLNL 连接稀缺且有价值
        - 战略价值不等于可兑现需求
        - 展示从里程碑到商业化的桥
      - - 品类需求
        - 巨大能源需求可能让早期赢家受益
        - 需求验证仍在同行手里，不在 Inertia 手里
        - 拿出具名买家证据
      - - 资本获取
        - 大额首轮可能降低未来融资难度
        - 行业仍面临巨大资本缺口
        - 展示 Series A 之后的融资路线图
    notes: 反向论点主要来自价格和需求证据缺失，而不是否认战略潜力。
