      - number: '6.2'
        title: 具名证明与市场先例
        blocks:
          - type: paragraph
            body: >-
              本章最清楚的区别，是 Inertia 特定证明与类别层面证明。Inertia 最强的具名关系是 LLNL，这是有力的合作伙伴信号，但不是付费能源客户。相比之下，CFS 可以指向 Google，Helion
              可以指向 Microsoft 和 Nucor。这些先例重要，因为它们说明成熟买方愿意在商业化完成前预订未来聚变电力。但它们不会自动转移到
              Inertia。公司在公开记录中仍缺少具名商业交易方。这也是本章如此强调证明质量的原因：LLNL 提高可信度，但只有买方愿意把自己的名字、容量或合同结构绑定到 Inertia
              身上，客户证明才真正开始。实际含义是，Inertia 仍要跨过两道独立关口：先证明这个类别有可信需求；再证明这家公司能在这组需求中赢下交易方。
