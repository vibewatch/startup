companyProfile:
  summary: >-
    Inertia 是一家美国私营聚变初创公司，由 Jeff Lawson、Annie Kritcher 和 Mike Dunne 于 2024 年创立，目标是把 National Ignition Facility
    点火路线上的惯性约束聚变商业化。公司同时拿到少见的科学履历和少见的启动期资本：2026 年 2 月宣布 $450 million Series A，2026 年 4 月又与 LLNL 达成合作，覆盖近 200
    项专利和多条协作工作流。公开证据能撑起一套连贯的产品与市场叙事，但公司仍处于收入前阶段，公开披露中的客户证据很轻，估值条款和长期融资需求也不透明。
