  - id: TV004
    title: 多头 / 基准 / 空头情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 关键风险 / 触发项
    rows:
      - - 多头
        - 条款清晰、客户验证、里程碑推进、可信融资桥
        - 支撑溢价期权价值； >$1B 可能站得住
        - 需要目前未公开的证据
      - - 基准
        - 融资真实，战略叙事仍强，客户验证仍缺席
        - 中间区间很宽，但必须严格打折
        - 取决于未来条款和里程碑
      - - 空头
        - 条款保护投资者、里程碑延后、验证前下一轮融资先到
        - 大幅打折，并担忧稀释
        - 沉默或桥接融资触发
    notes: 公共输入不足以支撑精确 DCF 或倍数，情景区间因此只能定性。
