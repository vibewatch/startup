      - number: '1.3'
        title: 资本基础、投资方质量和机构杠杆
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月融资让 Inertia 立刻脱离「有意思但缺钱」的聚变初创公司队列。$450 million 的 Series A
              按普通初创公司标准已经巨大，放在聚变领域也很大，更不用说它发生在公司启动时。投资方名单的质量至少和金额同样重要：Bessemer 和 GV
              是有辨识度的机构背书，更多辛迪加成员也说明公司能吸引科技、前沿和使命驱动型资本。比融资本身更重要的是后续动作。2026 年 4 月，Inertia 宣布与 LLNL 合作，结构包括两个 Strategic
              Partnership Projects、一个 CRADA，以及近 200 项专利许可权。这套组合给公司的价值超过一个普通「战略伙伴」标签：它能接触靶丸设计代码、激光组件
              R&D、制造工艺开发，以及最接近原始点火项目的人和基础设施。融资与合作放在一起看，说明 Inertia
              有资本和机构入口，能跑得很快。但它们仍没有回答投资人给一轮融资定价时最关键的问题：估值、优先权结构、所有权集中度，以及第一步之后还需要多少项目资本。
