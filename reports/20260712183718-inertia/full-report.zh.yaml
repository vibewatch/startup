        - 尽调开放后仍无定价质量证据
        - 无法承销估值公允性
        - 仅保持研究
      - - 无客户验证
        - 同行继续推进，Inertia 仍沉默
        - 可迁移性折扣扩大
        - 降低确信度
      - - 资本桥弱
        - 可见降险前就启动下一轮融资
        - 稀释和轮次质量风险上升
        - 要求更高折扣
      - - 技术 / 许可滞后
