      - number: '2.4'
        title: 增长驱动、约束，以及市场证据对时点的提示
        blocks:
          - type: paragraph
            body: >-
              最强的市场驱动已经可见：快速增长的电力需求、超大规模云厂商对新型清洁稳定供给的兴趣、DOE
              支持的商业化框架，以及加州等地的州级聚变倡议。最强的约束也同样可见：聚变仍必须跨过从靶增益到设施经济性的鸿沟，资本强度仍然极高，监管清晰度还在形成。LLNL
              点火路径文章尤其有用，因为它把已经验证的科学结果，与围绕重复频率、靶丸制造、氚增殖、材料耐久性和驱动器效率的未解工程议程区分开。市场时点取决于买方热情能否跑在这些工程和融资瓶颈前面。FIA 和 World
              Nuclear News 的报道显示，即便整个行业资金更充足，资本压力仍在；这一点很关键，因为首座电站需要的钱会远超一轮巨大的 Series A。实际结论是，Inertia
              进入的是一个有真实需求拉动、也有真实政策支持的市场；但采购环境只会奖励最可信的项目，且项目必须能把技术里程碑清楚接到已签约兆瓦。
