      - number: '3.3'
        title: 替代品、现有电力方案，以及为什么竞争框架要宽于聚变
        blocks:
          - type: paragraph
            body: >-
              即便最显眼的竞争发生在聚变初创公司之间，真正争夺预算的范围要宽得多。任何未来的 Inertia
              电站，都要与燃气、购网电、先进裂变以及可再生能源加储能组合争夺同一批客户采购资金。这会改变对竞争的理解。早期客户对聚变感兴趣，不是因为今天没有电力选择，而是因为一些买方在寻找长时段清洁稳定电力，现有方案无法完全满足。抓取到的证据还显示，整个类别的定价仍不成熟。本来源集中，没有公司公布已经商业兑现的聚变供电电价。因此，2026
              年做竞争分析，应少看价格表，多看哪些公司正在赢下稀缺要素：资本、客户注意力、高质量场址、制造伙伴，以及监管机构信任。这个更宽的框架可以避免把聚变内部竞争过度解读成成熟大宗商品市场。
