      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              理解成本结构，最好从公司自己强调的工程任务入手：高增益靶丸、低成本靶丸制造、高平均功率激光器，以及考虑氚约束的燃料循环设计。每个要素都带来资本支出、运营支出和良率风险。靶丸制造很关键，因为如果每个弹丸都停留在手工艺品状态，商业聚变经济性就会崩塌。10
              Hz 重复频率很关键，因为电站经济性需要持续吞吐，而不是科学实验式的单次声望。氚很关键，因为燃料采购、处理和增殖都有成本和监管影响。公开可比案例只能在边缘上提供帮助。NuScale
              的申报文件和行业融资评论说明，首个同类核基础设施可以多么饥渴资本，但不能为 Inertia 的具体架构提供直接成本桥。结论很清楚，即便具体金额未知：$450 million
              很可观，但在电站规模部署之前，它不太可能是最后一轮重大融资。
