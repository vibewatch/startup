      - number: '8.2'
        title: 同行基准与可迁移性
        blocks:
          - type: paragraph
            body: >-
              同行集合能提供尺度，不能提供精度。Helion 是明显的上层私营可比公司，因为它披露了 $15.5 billion 投后估值和客户证明。CFS 是另一个天花板参考，因为它把大额资本、Google
              背书的需求证据和更丰富的公开商业化界面放在一起。TAE 增加了少见的基于申报文件的市场信号。Focused Energy 和 Pacific Fusion
              在阶段和路径上更有用，但各自也有严重的精度限制。使用这些参考的正确方式，是做大幅可迁移性折扣，而不是简单复制倍数。因此，投资人应思考方向性锚点和折扣逻辑，而不是从披露质量完全不同的公司搬来虚假的数字精确度。聚变领域尤其如此：客户证明、监管进展和工程细节，都会彻底改变一美元融资在不同公司里实际意味着什么。
