figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: 公开记录从 NIF 的科学突破一路延伸到公司成立、融资、机构合作，以及 Livermore 的实体建设。
    data:
      items:
        - label: NIF 点火
          detail: LLNL 首次实现靶增益实验，后来成为 Inertia 的起点。
          date: 2022-12
          tone: positive
        - label: 重复点火实验
          detail: 到 2024 年初，多次重复实验把增益推高，也让物理基础不再只靠单次结果。
          date: 2023-07
          tone: positive
        - label: 2024 年成立
          detail: Inertia 成立，商业化基于 NIF 成果的惯性聚变。
          date: '2024'
          tone: positive
        - label: 公司公开亮相
          detail: 发布材料把 Inertia 定位为商业聚变能源公司。
          date: 2026-02
          tone: positive
        - label: Series A 完成
          detail: 公司宣布完成一笔 $450M 的里程碑制融资。
          date: '2026-02-11'
          tone: positive
        - label: 投资财团披露
          detail: Bessemer、GV、Modern、Threshold 等支持公司启动。
          date: '2026-02-11'
          tone: positive
        - label: LLNL 合作
          detail: 公司宣布两项 SPP、一项 CRADA 和广泛专利授权。
          date: '2026-04-14'
          tone: positive
        - label: 获得专利访问权
          detail: 近 200 项惯性聚变专利纳入商业化工具箱。
          date: '2026-04-14'
          tone: positive
        - label: 成立顾问委员会
          detail: 独立 STAB 启动，用于挑战假设并审查项目。
          date: '2026-06-18'
          tone: positive
        - label: 总部启用
          detail: Inertia 在 Livermore 启用 50,000 平方英尺总部。
          date: '2026-07-10'
          tone: positive
        - label: 工厂和实验室投用
          detail: 靶丸制造、计量、光学和二极管工作已在该场地推进。
          date: '2026-07-10'
          tone: positive
        - label: 商业化风险仍在
          detail: 尽管进展叙事已经展开，公开披露仍缺少估值、收入、客户和员工人数。
          date: '2026-07-12'
          tone: warning
    claimRefs:
      - CO022
      - CO018
      - CO019
      - CO023
      - CO024
      - CO015
      - CO027
      - CO029
      - CO033
      - CO034
