  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户格局与分层
        blocks:
          - type: paragraph
            body: >-
              Inertia
              的潜在客户基础在概念上很清楚，尽管实际客户名单并不清楚。公司瞄准的是重视大块清洁稳定电力的大买家：超大规模云厂商、公用事业公司和某些工业负荷。这个框架合理，因为聚变承诺的不是边际效率，而是可靠、可扩展的能源。来自数据中心能耗增长的公开需求背景，也强化了这些买方类别的重要性。但分层仍主要从产品和市场问题推断而来，而不是由已披露合同证明。关键提醒是，这种分层来自问题-解决方案匹配和类别行为，不来自可观察的
              Inertia
              订单结构。在交易方被点名前，分层仍是严谨假设，而不是证明。这些细分买家的采购风格也明显不同：超大规模云厂商围绕长期清洁能源采购锚定；公用事业公司围绕并网和可靠性；工业客户围绕集中场址需求。因此，一套通吃的销售动作不太可能成立。
