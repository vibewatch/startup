      - 阈值 / 事件
      - 行动含义
    rows:
      - - 制造风险
        - 无公开靶标 / 激光里程碑
        - '>18 个月无可见进展'
        - 上调担忧
      - - 监管风险
        - 未披露许可路径
        - 大额融资期后仍缺失
        - 降低确信度
      - - 资本风险
        - 外部验证前启动下一轮融资
        - 未达新里程碑就桥接融资
        - 视为论点受损
      - - 合作风险
        - LLNL 范围显著收窄
        - 合作变化或许可流失
        - 立即重估护城河
      - - 商业风险
        - 同行推进时，具名客户进展仍为零
        - 同行交易继续推进；Inertia 保持沉默
        - 下调商业论点
    notes: 上述标准是实用的投资监测阈值，不是公司指引。
