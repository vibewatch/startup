        title: Inertia 的差异化、护城河耐久性和反向情形
        blocks:
          - type: paragraph
            body: >-
              Inertia 最有辨识度的主张，是它在商业化唯一一个背后已有著名科学里程碑的惯性聚变路径：NIF 点火。LLNL
              合作与专利入口叙事，让这一点不只是营销。不过，护城河不能被夸大。其他惯性聚变新进入者仍能招募相邻人才、融资，并追求自己的硬件突破。与此同时，资本更厚或客户更可见的同行，如 CFS、Helion 和
              TAE，即便不采用 Inertia 的同一路径，也能塑造市场预期。最困难的反向情形很简单：Inertia
              可能仍是聚变领域融资最充足的科学故事之一，却在客户开发和公开里程碑的心智份额上输给披露更清楚商业证据的项目。因此，证据的平衡读法是细致的：在履历和机构入口上差异化很强，但在公司把这些资产转成可见部署、承购或系统集成里程碑之前，耐久性只能算中等。
