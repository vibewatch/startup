      - number: '7.2'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              监管图景比几年前更好，但仍没有完全定型。美国聚变监管正通过 NRC 规则制定、法律评论，以及 Helion 等公司提出的差异化处理主张演进。加州和联邦创新政策提供支持，但支持不等于项目特定许可。Inertia
              的实际风险不只是理论上是否存在法律框架，而是它能否按与商业化雄心一致的时间表穿过这个框架。同行关于监管里程碑的披露让这个缺口更明显，而不是更小。这意味着监管风险应同时作为进度风险和融资风险建模，而不是单独的法律脚注。法律环境方向上令人鼓舞，但运营层面仍不完整。在公司公布具体场址和许可顺序之前，监管故事仍是风险输入，而不是值得全额计分的缓释项。
