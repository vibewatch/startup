    {
      "id": "substitutes-and-budget-competition",
      "title": "Substitutes, status quo power, and why competitive framing is wider than fusion",
      "body": "Even if the most visible rivalry is among fusion startups, the real budget competition is much wider. Any future Inertia plant would compete against gas, grid purchases, advanced fission, and renewable-plus-storage portfolios for the same customer procurement dollars. That changes how rivalry should be interpreted. Early customer interest in fusion does not arise because buyers lack electricity options today; it arises because some buyers are searching for long-duration clean firm power that existing options do not fully satisfy. The fetched evidence also shows that pricing is still immature across the category. No company in this source set publishes a commercially realized electricity tariff for delivered fusion power. For that reason, competitive analysis in 2026 should focus less on price sheets and more on which companies are winning scarce ingredients: capital, customer attention, high-quality sites, manufacturing partners, and credibility with regulators. That wider frame prevents over-reading intra-fusion rivalry as if it were already a mature commodity market.",
      "claimRefs": [
