    {
      "id": "capital-scale-and-commercial-signaling",
      "title": "Capital scale, customer proof, and public signaling",
      "body": "The biggest competitive splits today are capital scale and commercial signaling. Inertia's launch financing is massive for a company founded in 2024 and clearly puts it ahead of smaller entrants. Yet the category leaders with the easiest commercialization narrative are the ones that pair capital with named counterparties. CFS can point to Google. Helion can point to Microsoft. Focused Energy can point to RWE as both investor and site-aligned utility partner. TAE has a public-market valuation path. Inertia's LLNL relationship is strategically valuable, but it is not a customer contract and does not answer who will buy the first electrons. That distinction matters because in fusion the competition is partly for belief: buyers, regulators, and future financiers are looking for proof that a program is moving from frontier science toward bankable infrastructure. Inertia has closed the gap on capital faster than it has closed the gap on public demand proof.",
