  topStrengths:
    - 创始团队既有一线创业运营信用，也亲历 NIF 点火和聚变电站设计。
    - $450M 创始阶段 Series A 让 Inertia 起步资本超过大多数直接惯性聚变同行。
    - LLNL 合作和专利访问权带来真实的机构与技术护城河，相比纯叙事阶段创业公司更扎实。
    - 产品逻辑接在已验证的科学谱系上，而不是押注完全未经验证的物理路线。
    - Google/CFS、Microsoft/Helion 等品类级客户先例证明，清洁、稳定的聚变电力长期有真实市场拉力。
  topRisks:
    - 没有公开的投后估值、优先股堆叠或融资路线图，无法给出稳固定价判断。
    - Inertia 尚无公开客户合同、LOI 或 PPA，同业先例能否迁移为需求仍未验证。
    - 商业化仍要打通靶丸制造、10 Hz 激光重复频率、第一壁耐久性以及氚 / 燃料循环等难题。
    - 聚变电站开发很可能需要远超本轮的资本，未来稀释或项目融资依赖会很重。
    - Helion、CFS、Focused Energy、Pacific Fusion 等同行在若干关键领域公开了更多里程碑或客户信号。
  unresolvedGaps:
    - Series A 投后估值、清算优先权、持股比例和投资人经济条款均未披露。
    - 没有公开的客户管线、买方意向函或商业合同结构。
    - 没有公开的烧钱速度、现金跑道、靶丸成本曲线或电站经济模型，无法支撑精确财务或估值模型。
    - 与已有公开监管里程碑的后期同行相比，许可审批和电站选址路径披露仍不足。
    - 公开证据尚未显示靶丸、激光、材料和燃料系统已跑出商业节奏下的一体化表现。
