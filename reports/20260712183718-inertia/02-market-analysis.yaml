    {
      "id": "sizing-lenses",
      "title": "Sizing lenses: broad demand is huge, but decision-useful demand is narrower",
      "body": "Public evidence strongly supports a view that electricity demand growth is real and that clean firm power has become more valuable, especially around data centres and AI. The IEA-linked summaries reviewed for this chapter point to 485 TWh of global data-centre electricity consumption today, roughly 950 TWh by 2030, and a 465 TWh AI-focused subset by that point. Those are enormous numbers relative to any one fusion startup. Even one Inertia-scale 1.5 GW plant would represent only a small fraction of the broad demand pool if it operated at utility-scale availability. But the broad-demand lens alone is not enough. A better intermediate lens is willingness to sign clean-firm offtakes before the technology is fully commercial, because that is the real bridge between theoretical demand and bankable revenue. On that score, Google’s 200 MW CFS agreement and Microsoft’s 50 MW Helion agreement are more instructive than generic market-size reports. They show that some buyers will underwrite future clean-firm supply early, but they also show how narrow the first-adopter set still is. The right conclusion is that the TAM is undeniably large, while SAM and SOM remain better expressed through constrained procurement pathways than through a single dollar figure.",
