  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Inertia is not competing for all energy demand; it is competing for clean-firm-power budgets where buyers need round-the-clock electricity and are already showing willingness to pre-contract novel supply. Public evidence points to a large and fast-growing demand backdrop—especially data centres and AI infrastructure—but the most decision-useful near-term lens is not a generic TAM number; it is the narrow set of utilities, hyperscalers, and industrial buyers willing to sign first-of-a-kind clean-firm contracts. The market is therefore large enough to matter and selective enough that early adoption will likely hinge on a handful of anchor counterparties rather than broad penetration."
  },
  "sections": [
    {
      "id": "market-boundary-and-substitutes",
      "title": "Market boundary: clean firm power, not generic “fusion industry” spend",
      "body": "The right market definition for Inertia is narrower and more useful than the headlines suggest. The company is not really selling “fusion” as an abstract category; it is trying to sell large blocks of clean, dispatchable, always-on electricity generated by a fusion plant and the enabling hardware stack required to make that possible. That means the relevant budget is not total global energy spend, nor even total electricity demand. It is the portion of utility, hyperscaler, and industrial energy budgets allocated to firm low-carbon supply. This framing immediately clarifies both the opportunity and the substitute set. Inertia’s practical competitors are not only other fusion companies, but also gas peakers and combined-cycle plants, advanced fission, geothermal, and renewable portfolios that still need storage or backup to satisfy round-the-clock load. The market boundary also explains why first buyers are likely to be sophisticated counterparties with centralized procurement and a tolerance for long timelines, not retail customers or lightly capitalized mid-market users. For diligence, that is a feature rather than a flaw: it turns a hand-wavy “energy is huge” story into a concrete question of whether Inertia can win a small number of very large clean-firm contracts.",
