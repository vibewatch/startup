companyProfile:
  summary: >-
    Inertia is a private U.S. fusion startup founded in 2024 by Jeff Lawson, Annie Kritcher, and Mike Dunne to
    commercialize inertial fusion built on the National Ignition Facility ignition lineage. The company pairs unusual
    scientific pedigree with unusual launch-stage capitalization: a $450 million Series A announced in February 2026 and
    an April 2026 LLNL partnership covering nearly 200 patents and multiple collaborative workstreams. Public evidence
    supports a coherent product and market story, but the company remains pre-revenue, customer-light in public
    disclosures, and opaque on valuation terms and long-run financing needs.
