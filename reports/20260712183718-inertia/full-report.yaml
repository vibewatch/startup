  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape — direct inertial-fusion peers and broader fusion leaders
        blocks:
          - type: paragraph
            body: >-
              Inertia sits inside a crowded but highly stratified fusion field. The closest direct rivalry is not with
              every nuclear or clean-energy company but with a small set of developers trying to turn fusion into
              grid-scale clean firm power. Inside that set, the most relevant direct peers are other inertial-fusion
              programs, especially Focused Energy and Pacific Fusion, because they pursue high-energy-pulse
              architectures that must solve similar manufacturing, target, and facility-integration problems. A broader
              competitive ring includes Commonwealth Fusion Systems, Helion, and TAE, whose plasma approaches differ but
              whose capital, customers, and timeline claims influence how investors and buyers benchmark the category.
              The public evidence suggests Inertia already belongs in that top discussion because its $450 million
              Series A is unusually large and because the company tied itself to LLNL through a formal partnership and
              patent-access story. But category membership is not category leadership. On disclosed customer proof and
              timeline visibility, later-stage peers still present more buyer-friendly evidence than Inertia does today.
            claimRefs:
