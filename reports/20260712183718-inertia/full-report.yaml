chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and what the company says it is building
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to describe Inertia is not as a general fusion research outfit but as a commercialization
              vehicle for one very specific scientific lineage: indirect-drive inertial fusion proven at Lawrence
              Livermore National Laboratory’s National Ignition Facility. Its homepage and founders’ message are
              unusually explicit about that positioning. Rather than claiming to invent a new physics regime, the
              company says it wants to take “proven fusion science” and industrialize it into hardware that can operate
              continuously at utility scale. The four-step plan is consistent across the official materials: start from
              NIF-proven science, build an ultra-high-average-power laser, mass-manufacture low-cost fuel targets, and
              then combine those pieces into a grid-scale power plant. The company now has a physical footprint to match
              that story. July 2026 materials say Inertia opened a 50,000-square-foot Livermore headquarters built
              around a target factory and high-energy laser program, while the benefits document names a Livermore
              street address. That does not prove commercial readiness, but it does separate Inertia from earlier-stage
              fusion concepts that still exist mostly as slide decks or research narratives.
