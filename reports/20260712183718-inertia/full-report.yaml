  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer landscape and segmentation
        blocks:
          - type: paragraph
            body: >-
              Inertia's likely customer base is conceptually clear even though the actual customer list is not. The
              company is building toward large buyers that value clean firm power in big blocks: hyperscalers,
              utilities, and certain industrial loads. That framing is plausible because fusion's promise is not
              marginal efficiency but dependable, scalable energy. Public demand context from data-center energy growth
              reinforces why these buyer classes matter. But segmentation is still mostly inferred from the product and
              market problem rather than proven by disclosed contracts. The important caution is that this segmentation
              comes from problem-solution fit and category behavior, not from an observable Inertia bookings mix. Until
              counterparties are named, segmentation remains a disciplined hypothesis rather than proof. Buyers in these
              segments also differ meaningfully in procurement style: hyperscalers can anchor around long-dated
              clean-energy sourcing, utilities around interconnection and reliability, and industrials around
              concentrated site demand. That heterogeneity makes a one-size-fits-all sales motion unlikely.
