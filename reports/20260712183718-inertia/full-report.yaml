  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation logic
      - Key risk / trigger
    rows:
      - - Bull
        - Clean terms, customer proof, milestone progress, credible financing bridge
        - Supports premium optionality; >$1B could be defensible
        - Requires evidence not public today
      - - Base
        - Round is real, strategic story remains strong, customer proof still absent
        - Wide middle range with strict haircut discipline
        - Depends on future terms and milestones
      - - Bear
        - Terms are investor-protective, milestones slip, next raise arrives before proof
        - Heavy haircut and dilution concern
        - Triggered by silence or bridge financing
