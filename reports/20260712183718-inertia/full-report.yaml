  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital base and what the Series A does — and does not — prove
        blocks:
          - type: paragraph
            body: >-
              Inertia's February 2026 launch financing is the central financial fact in the public record. At $450
              million, it is large enough to move the company out of curiosity status and into the top tier of
              fusion-funded programs. It also tells investors something important about market appetite: sophisticated
              capital was willing to back the commercialization thesis before any public revenue, customer contract, or
              plant-level operating metric existed. But the financing event is only a partial financial signal. The
              public sources confirm the headline amount and the investor quality; they do not disclose the post-money
              valuation, share-class economics, preference stack, or the exact use-of-proceeds split between facilities,
              hiring, supplier development, and long-lead hardware. In other words, the round proves enthusiasm and
              capability to raise, not underwriting clarity.
