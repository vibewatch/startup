  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: clean firm power, not generic “fusion industry” spend'
        blocks:
          - type: paragraph
            body: >-
              The right market definition for Inertia is narrower and more useful than the headlines suggest. The
              company is not really selling “fusion” as an abstract category; it is trying to sell large blocks of
              clean, dispatchable, always-on electricity generated by a fusion plant and the enabling hardware stack
              required to make that possible. That means the relevant budget is not total global energy spend, nor even
              total electricity demand. It is the portion of utility, hyperscaler, and industrial energy budgets
              allocated to firm low-carbon supply. This framing immediately clarifies both the opportunity and the
              substitute set. Inertia’s practical competitors are not only other fusion companies, but also gas peakers
              and combined-cycle plants, advanced fission, geothermal, and renewable portfolios that still need storage
              or backup to satisfy round-the-clock load. The market boundary also explains why first buyers are likely
              to be sophisticated counterparties with centralized procurement and a tolerance for long timelines, not
              retail customers or lightly capitalized mid-market users. For diligence, that is a feature rather than a
              flaw: it turns a hand-wavy “energy is huge” story into a concrete question of whether Inertia can win a
              small number of very large clean-firm contracts.
