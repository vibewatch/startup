      - number: '1.3'
        title: Capital base, investor quality, and institutional leverage
        blocks:
          - type: paragraph
            body: >-
              The February 2026 financing instantly moved Inertia out of the category of “interesting but
              undercapitalized” fusion startups. A $450 million Series A is enormous by ordinary startup standards and
              still very large by fusion standards, even before considering that it arrived at company launch. The
              quality of the investor list matters at least as much as the amount: Bessemer and GV are recognizable
              institutional validators, while the broader syndicate shows the company can attract technology, frontier,
              and mission-driven backers. Even more important than the financing itself is what followed. In April 2026
              Inertia announced an LLNL partnership built around two Strategic Partnership Projects, one CRADA, and
              licensing rights to nearly 200 patents. That package gives the company something more valuable than a
              generic “strategic partner” label: access to target design codes, laser-component R&D, manufacturing
              process development, and the people and infrastructure closest to the original ignition program. Taken
              together, the financing and partnership suggest Inertia has the capital and institutional access to move
              quickly. They do not, however, answer the investor questions that matter most for pricing a round:
              valuation, preference stack, ownership concentration, and what additional project capital will be needed
              after this first step.
