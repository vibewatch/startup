      - number: '1.4'
        title: Milestones achieved so far and what remains opaque
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern so far is encouraging but still narrow. Inertia can point to a convincing sequence:
              NIF target gain established the scientific starting point; the company was founded in 2024; the February
              2026 financing funded a first major operating push; the April 2026 LLNL partnership embedded that push in
              a national-lab commercialization pathway; the June 2026 advisory board added independent scrutiny; and the
              July 2026 headquarters opening demonstrated real physical buildout. At the same time, the public record
              remains thin on the metrics an investor would normally want before anchoring conviction around a
              private-company valuation. The fetched sources do not disclose a post-money valuation, headcount, revenue,
              customer contracts, debt, or manufacturing throughput targets. Nor do they resolve the broader sector
              caution that even a heavily funded fusion startup still faces a long road from laboratory proof to
              economic plant operation. The right reading of the company-overview chapter is therefore balanced: Inertia
              has unusually strong scientific lineage, capital, and institutional leverage for a 2024-founded company,
              but the overview evidence still does not support underwriting commercial traction or financial quality
              without additional private diligence.
