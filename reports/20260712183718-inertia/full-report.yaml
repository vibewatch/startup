      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map implied by public evidence is relatively clear. Hyperscalers are attractive because their
              electricity demand is growing quickly, their procurement teams already sign long-dated clean-power
              contracts, and their AI roadmaps create a premium for reliable capacity. Utilities matter for a different
              reason: if fusion ever works at scale, it will have to fit inside resource-adequacy planning, siting,
              interconnection, and regulatory frameworks that utilities already navigate. Large industrial users are a
              plausible third bucket because they also value round-the-clock clean power and often operate concentrated
              mega-load sites. What none of these groups will do, however, is buy a first fusion plant the way they buy
              commodity electricity today. The likely adoption path is a small number of bespoke, milestone-heavy anchor
              contracts tied to site development, financing, and engineering credibility. Inertia’s first customers
              therefore matter less as a broad “logo list” and more as proof that a sophisticated payer is willing to
              shoulder schedule and technology risk in exchange for scarce clean-firm supply. That is why precedents at
              CFS and Helion are so important even though they are not direct evidence of Inertia traction.
            claimRefs:
              - CM010
              - CM012
