        - Best private-market ceiling for fusion appetite
        - Has disclosed valuation and customer proof that Inertia lacks
      - - CFS
        - Large capital base plus Google strategic partnership
        - Ceiling reference for strategic fusion narratives
        - No simple price multiple disclosed in fetched sources
      - - TAE
        - Public-market valuation signal via 8-K
        - Rare filing-based fusion pricing anchor
        - Different modality and maturity
      - - Focused Energy
        - $240M Series A; valuation undisclosed
        - Closest inertial-fusion stage reference
        - No public post-money disclosed
      - - Pacific Fusion
        - Large funding and prototype publicity
        - Useful inertial-fusion appetite marker
        - Public pricing still thin
      - - Inertia
        - $450M Series A; valuation undisclosed
        - Current company baseline
        - Underwriting limited by missing terms
