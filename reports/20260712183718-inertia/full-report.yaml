appendices:
  - id: A
    title: Coverage Notes and Methodology
    blocks:
      - type: paragraph
        body: >-
          This report is based only on sources fetched during the 2026-07-12 diligence run and validated through the
          startup-research workflow. Inertia is a private pre-revenue deep-tech company, so conventional operating and
          valuation metrics are sparse or management-controlled. The report therefore emphasizes verifiable financing,
          partnership, technical, market, and risk evidence rather than speculative revenue models.
        claimRefs: []
      - type: paragraph
        body: >-
          Valuation analysis is intentionally conservative because public sources confirm the round size but not the
          price, customer contracts, or financing bridge to commercialization. Strategic attractiveness and valuation
          underwritability are therefore treated as related but separate judgments.
        claimRefs: []
