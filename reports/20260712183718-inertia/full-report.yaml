        title: Public valuation evidence
        blocks:
          - type: paragraph
            body: >-
              Inertia has one major public pricing event and one major omission. The pricing event is the February 2026
              $450 million Series A. The omission is the actual valuation. Public reporting confirms that the round
              happened and that serious investors were willing to fund the company at launch scale, but none of the
              fetched sources provides a post-money number, preference stack, or share-price signal. That means the
              round proves appetite and narrative strength without proving whether the implied valuation was
              conservative, fair, or aggressive. Investors can recognize a real financing milestone while still refusing
              to underwrite an invisible price. The absence of valuation terms is especially important in a frontier
              sector where structured protections can materially change the economic meaning of a headline round size.
              In venture markets, missing terms matter most when round size is large enough to imply that expectations
              may already be ambitious. The bigger the headline, the more investors need to know what protections or
              assumptions sit behind it. Price opacity still dominates.
