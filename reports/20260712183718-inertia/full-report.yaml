  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Inertia's current product is best understood as a staged industrialization program rather than a shipped
              energy product. The company repeatedly describes a future fusion power plant that converts repeated
              inertial-fusion events into grid electricity. That makes the customer workflow conceptually clear even
              though no commercial deployment exists yet: generate fusion energy, turn that heat into electricity, and
              deliver clean firm power at utility scale. What exists today is the technical and manufacturing stack
              needed to reach that endpoint. This distinction matters for diligence because it means value creation is
              still tied to subsystem progress and engineering proof rather than operational customer usage. It also
              means buyers cannot yet evaluate uptime, service, or procurement friction from operating evidence because
              the workflow is still aspirational rather than deployed.
