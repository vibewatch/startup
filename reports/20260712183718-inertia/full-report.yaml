        title: Financial verdict and next-round logic
        blocks:
          - type: paragraph
            body: >-
              The best public-information verdict is balanced. Inertia is unusually well funded for a 2024-founded
              fusion startup and clearly has the investor quality to keep attracting attention. Yet the company remains
              pre-revenue, capital-intensive, and opaque on the core variables that determine whether a launch round is
