      - number: '8.4'
        title: Recommendation and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right investment posture is research-more with explicit price discipline. The supportive case is real:
              elite founders, LLNL-linked strategic advantage, enormous market potential, and a very large first round.
              The limiting case is equally real: no public valuation terms, no public customer proof, and a long
              capital-intensive path to revenue. Those facts support a medium-confidence, high-risk stance and a
              valuation posture best described as cannot-assess precisely from public evidence. The next diligence step
              is not another analogy table; it is the actual terms, customer pipeline, and financing roadmap. Until that
              evidence is in hand, strategic attractiveness and investable pricing should be treated as related but
              separate questions. The company may ultimately deserve a premium outcome, but that conclusion should be
              earned by evidence, not inferred only from the prestige of the founders or the round size. That discipline
              matters most when optionality is highest.
            claimRefs:
