              capital, and eventual anchor customers who do not yet appear publicly. This kind of concentration is
              normal for a frontier hardware company, but it means disruptions transmit quickly. The thesis-breaking
              conditions are therefore concrete: failure to maintain critical partnerships, prolonged silence on
              manufacturing progress, inability to navigate a credible permitting path, or the need for additional
              capital before external proof points appear. The company’s public legal surface is basic and does not
              materially change those risk conclusions. Overall, the risk profile remains very high despite the quality
              of the underlying ambition. Even strong founders and strong investors cannot compensate indefinitely if
              those external dependencies fail to convert into measurable commercial de-risking. Investors should also
