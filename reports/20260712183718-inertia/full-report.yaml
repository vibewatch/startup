      - number: '2.4'
        title: Growth drivers, constraints, and what the market evidence says about timing
        blocks:
          - type: paragraph
            body: >-
              The strongest market drivers are visible now: fast-growing power demand, hyperscaler interest in novel
              clean-firm supply, DOE-backed commercialization frameworks, and state-level fusion initiatives in places
              like California. The strongest constraints are equally visible: fusion still must cross the gap from
              target gain to facility economics, capital intensity remains extreme, and regulatory clarity is still
              developing. The LLNL ignition-path article is especially useful because it separates the proven scientific
              result from the unresolved engineering agenda around repetition rate, target manufacturing, tritium
              breeding, materials durability, and driver efficiency. Market timing therefore depends on whether buyer
              enthusiasm can stay ahead of those engineering and financing bottlenecks. FIA and World Nuclear News
              reporting suggest that even a well-funded sector continues to feel capital pressure, which matters because
              first plants will require much more money than a large Series A. The practical takeaway is that Inertia is
              entering a market with real demand pull and real policy support, but also a procurement environment that
              will reward only the most credible programs with a clear path from technical milestones to contracted
              megawatts.
