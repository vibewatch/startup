      - number: '3.3'
        title: Substitutes, status quo power, and why competitive framing is wider than fusion
        blocks:
          - type: paragraph
            body: >-
              Even if the most visible rivalry is among fusion startups, the real budget competition is much wider. Any
              future Inertia plant would compete against gas, grid purchases, advanced fission, and
              renewable-plus-storage portfolios for the same customer procurement dollars. That changes how rivalry
              should be interpreted. Early customer interest in fusion does not arise because buyers lack electricity
              options today; it arises because some buyers are searching for long-duration clean firm power that
              existing options do not fully satisfy. The fetched evidence also shows that pricing is still immature
              across the category. No company in this source set publishes a commercially realized electricity tariff
              for delivered fusion power. For that reason, competitive analysis in 2026 should focus less on price
              sheets and more on which companies are winning scarce ingredients: capital, customer attention,
              high-quality sites, manufacturing partners, and credibility with regulators. That wider frame prevents
              over-reading intra-fusion rivalry as if it were already a mature commodity market.
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP030
      - number: '3.4'
        title: Inertia differentiation, moat durability, and the adverse case
        blocks:
          - type: paragraph
            body: >-
              Inertia's distinctive claim is that it is commercializing the only inertial-fusion pathway with an already
              famous scientific milestone behind it: NIF ignition. The LLNL partnership and patent-access narrative make
              that more than pure marketing. That said, the moat should not be overstated. Other inertial-fusion
              entrants can still recruit adjacent talent, raise capital, and pursue their own hardware breakthroughs.
              Meanwhile, better-capitalized or more customer-visible peers such as CFS, Helion, and TAE can shape market
              expectations even without sharing Inertia's exact modality. The hardest adverse case is simple: Inertia
              could remain one of the best-financed science stories in fusion while losing mindshare in customer
              development and public milestones to programs that disclose clearer commercial proof. The balance of
              evidence therefore supports a nuanced read—strong differentiation on pedigree and institutional access,
              but only moderate durability until the company converts those assets into visible deployment, offtake, or
              systems-integration milestones.
