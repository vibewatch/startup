figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: standard
    summary: >-
      The public record runs from NIF’s scientific breakthrough through company formation, financing, institutional
      partnership, and physical buildout in Livermore.
    data:
      items:
        - label: NIF ignition
          detail: LLNL achieves first target-gain shot that later becomes Inertia’s starting point.
          date: 2022-12
          tone: positive
        - label: Repeat ignition shots
          detail: Multiple repeat shots through early 2024 push gain higher and make the physics base less singular.
          date: 2023-07
          tone: positive
        - label: 2024 founding
          detail: Inertia is formed to commercialize inertial fusion built on NIF results.
          date: '2024'
          tone: positive
        - label: Company emerges publicly
          detail: Launch materials frame Inertia as the commercial fusion energy company.
          date: 2026-02
          tone: positive
        - label: Series A closes
          detail: Company announces a $450M milestone-based financing.
          date: '2026-02-11'
          tone: positive
        - label: Investor syndicate named
          detail: Bessemer, GV, Modern, Threshold and others back the launch.
          date: '2026-02-11'
          tone: positive
        - label: LLNL partnership
          detail: Two SPPs, one CRADA, and broad patent licensing are announced.
          date: '2026-04-14'
          tone: positive
        - label: Patent access secured
          detail: Nearly 200 inertial-fusion patents become part of the commercialization toolkit.
          date: '2026-04-14'
          tone: positive
        - label: Advisory board formed
          detail: Independent STAB is launched to challenge assumptions and review programs.
          date: '2026-06-18'
          tone: positive
        - label: HQ opens
          detail: Inertia opens a 50,000-square-foot Livermore headquarters.
          date: '2026-07-10'
          tone: positive
        - label: Factory and labs active
          detail: Target manufacturing, metrology, optics, and diode work are underway at the site.
          date: '2026-07-10'
          tone: positive
        - label: Commercialization risk remains
          detail: Public disclosures still omit valuation, revenue, customers, and headcount despite the progress narrative.
          date: '2026-07-12'
          tone: warning
