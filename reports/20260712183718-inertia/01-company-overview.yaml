  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Inertia is a Livermore-based fusion startup founded in 2024 by Jeff Lawson, Annie Kritcher, and Mike Dunne to commercialize inertial fusion built on LLNL’s NIF ignition work. Publicly fetched sources strongly support the $450 million February 2026 Series A, the April 2026 LLNL partnership with nearly 200 licensed patents, and the July 2026 opening of a 50,000-square-foot headquarters with target and laser buildout underway. The main overview-stage gaps are valuation, headcount, customer commitments, and any audited financial disclosure, which keeps the company squarely in research-more territory despite unusually strong scientific pedigree and capitalization."
  },
  "sections": [
    {
      "id": "identity-and-footprint",
      "title": "Identity, headquarters, and what the company says it is building",
      "body": "The cleanest way to describe Inertia is not as a general fusion research outfit but as a commercialization vehicle for one very specific scientific lineage: indirect-drive inertial fusion proven at Lawrence Livermore National Laboratory’s National Ignition Facility. Its homepage and founders’ message are unusually explicit about that positioning. Rather than claiming to invent a new physics regime, the company says it wants to take “proven fusion science” and industrialize it into hardware that can operate continuously at utility scale. The four-step plan is consistent across the official materials: start from NIF-proven science, build an ultra-high-average-power laser, mass-manufacture low-cost fuel targets, and then combine those pieces into a grid-scale power plant. The company now has a physical footprint to match that story. July 2026 materials say Inertia opened a 50,000-square-foot Livermore headquarters built around a target factory and high-energy laser program, while the benefits document names a Livermore street address. That does not prove commercial readiness, but it does separate Inertia from earlier-stage fusion concepts that still exist mostly as slide decks or research narratives.",
