    {
      "id": "founders-and-governance",
      "title": "Founders, governance, and why the leadership bench matters",
      "body": "Inertia’s strongest overview asset is founder-market fit. Jeff Lawson supplies scale-up and capital-markets credibility from Twilio; Annie Kritcher supplies the closest thing this subsector has to first-hand proof that the underlying experimental approach can work; and Mike Dunne brings power-plant-design and large-facility execution experience from LLNL, SLAC, and the UK laser ecosystem. That is a rare combination for a fusion startup because the company is not forced to choose between scientific pedigree and commercial leadership. The advisory structure adds a second layer of credibility. In June 2026, Inertia formed a Science and Technology Advisory Board chaired by Marv Adams and populated with senior inertial-fusion, target, laser, and nuclear-materials experts. The language of that announcement matters: management says the board’s role is to poke holes in the approach and conduct external reviews, not simply to lend names to a website. The open question is not whether the company has scientific firepower; it clearly does. The open question is whether this bench can convert one-of-a-kind laboratory success into manufacturing discipline, plant integration, and repeatable commercial execution under venture-style timelines.",
