    {
      "id": "peer-benchmarks-and-transferability",
      "title": "Peer benchmarks and transferability",
      "body": "The peer set gives scale but not precision. Helion is the obvious upper-tier private comp because it discloses a $15.5 billion post-money valuation and customer proof. CFS is another ceiling reference because it pairs large capital with Google-backed demand evidence and a richer public commercialization surface. TAE adds a rare filing-based market signal. Focused Energy and Pacific Fusion are more useful on stage and modality, but each still comes with serious precision limits. The right way to use all of these references is with large transferability haircuts, not with simple multiple copying. Investors therefore should think in terms of directional anchors and haircut logic, not false numerical precision imported from companies with very different disclosure quality. That is particularly true in fusion, where customer proof, regulatory progress, and engineering detail can radically change what one dollar of funding actually means from company to company.",
