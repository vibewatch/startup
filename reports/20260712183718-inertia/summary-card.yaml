  topStrengths:
    - >-
      The founding team combines top-tier startup operating credibility with first-hand NIF ignition and fusion-plant
      design experience.
    - The $450M launch-stage Series A gives Inertia more capital than most direct inertial-fusion peers at formation.
    - >-
      The LLNL partnership and patent access create a real institutional and technical moat relative to purely
      narrative-stage startups.
    - The product thesis is anchored to a proven scientific lineage rather than an entirely unvalidated physics regime.
    - >-
      Category-level customer precedents from Google/CFS and Microsoft/Helion support real long-run market pull for
      clean firm fusion power.
  topRisks:
    - >-
      No public post-money valuation, preference stack, or financing-roadmap disclosure supports a firm pricing
      judgment.
    - No public Inertia customer contract, LOI, or PPA exists, so demand transfer from peer precedents remains unproven.
    - >-
      Commercialization still depends on solving target manufacturing, 10 Hz laser repetition, first-wall durability,
      and tritium/fuel-cycle challenges.
    - >-
      Fusion plant development will likely require far more capital than the current round, creating meaningful future
      dilution or project-finance dependence.
    - >-
      Peers such as Helion, CFS, Focused Energy, and Pacific Fusion expose more public milestone or customer surfaces in
      some critical areas.
  unresolvedGaps:
    - Series A post-money valuation, liquidation preferences, ownership splits, and investor economics are undisclosed.
    - No public customer pipeline, buyer letters, or commercial-contract structure is available.
    - >-
      No public burn, cash runway, target-cost curve, or plant-economics model supports a precise financial or valuation
      model.
    - >-
      The exact permitting and plant-siting path remains underdisclosed relative to later-stage peers with public
      regulatory milestones.
    - >-
      Public evidence does not yet show integrated commercial-cadence performance across targets, lasers, materials, and
      fuel systems.
