    {
      "id": "financial-verdict-and-next-round-logic",
      "title": "Financial verdict and next-round logic",
      "body": "The best public-information verdict is balanced. Inertia is unusually well funded for a 2024-founded fusion startup and clearly has the investor quality to keep attracting attention. Yet the company remains pre-revenue, capital-intensive, and opaque on the core variables that determine whether a launch round is truly enough. Sector evidence from FIA, DOE, and fusion-finance commentary suggests the entire field still faces a multi-billion-dollar commercialization gap. That makes future dilution or project-finance dependence highly likely unless public-sector support, strategic counterparties, or customer-backed structures emerge. The next round is not merely a possibility; it is a central part of the thesis, even if the exact timing is still unknowable from public sources.",
