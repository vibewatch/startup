    {
      "id": "disclosure-gaps-and-underwriting-blockers",
      "title": "Disclosure gaps and underwriting blockers",
      "body": "What is missing from the public record matters as much as what is present. There is no published cash balance, no burn figure, no runway estimate, no debt stack, and no revenue guidance. There is also no cap-table transparency for the Series A and no disclosed customer-side economics that would let an investor model eventual gross margin. Public comparables underscore the opacity. NuScale, as a listed advanced-nuclear company, files audited numbers and risk factors. TAE's 8-K provides a formal market-clearing reference point. Inertia offers neither level of disclosure. That does not mean the business is weak; it means the public underwrite is incomplete and management-controlled. A serious diligence process would need private documents before taking any view on valuation fairness or capital sufficiency.",
      "claimRefs": [
        "CI013",
        "CI015",
