  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Inertia is a pre-revenue, capital-intensive fusion company whose public financial story is dominated by a $450 million February 2026 Series A and by what remains undisclosed. The company\u2019s eventual revenue model appears to be electricity sales from a future fusion plant, but public sources do not disclose pricing, unit economics, burn, runway, or project-finance plans. The right conclusion is that Inertia is unusually well financed for its age yet still impossible to underwrite conventionally without private cap-table, budget, and commercialization materials."
  },
  "sections": [
    {
      "id": "capital-base-and-round-signals",
      "title": "Capital base and what the Series A does \u2014 and does not \u2014 prove",
      "body": "Inertia's February 2026 launch financing is the central financial fact in the public record. At $450 million, it is large enough to move the company out of curiosity status and into the top tier of fusion-funded programs. It also tells investors something important about market appetite: sophisticated capital was willing to back the commercialization thesis before any public revenue, customer contract, or plant-level operating metric existed. But the financing event is only a partial financial signal. The public sources confirm the headline amount and the investor quality; they do not disclose the post-money valuation, share-class economics, preference stack, or the exact use-of-proceeds split between facilities, hiring, supplier development, and long-lead hardware. In other words, the round proves enthusiasm and capability to raise, not underwriting clarity.",
      "claimRefs": [
        "CI005",
