    {
      "id": "cost-structure-and-capital-intensity",
      "title": "Cost structure and capital intensity",
      "body": "The cost structure is best understood through the engineering tasks the company itself emphasizes: high-gain targets, low-cost target manufacturing, high-average-power lasers, and tritium-aware fuel-cycle design. Each of those elements carries capex, opex, and yield risk. Target manufacturing matters because commercial fusion economics fail if every pellet remains artisanal. Ten-hertz repetition matters because plant economics require relentless throughput rather than scientific-shot prestige. Tritium matters because fuel procurement, handling, and breeding have cost and regulatory implications. Public comparisons help only at the edges. NuScale's filings and sector financing commentary show how capital-hungry first-of-a-kind nuclear infrastructure can be, but they do not provide a direct cost bridge for Inertia's specific architecture. The conclusion is clear even if the exact dollars are not: $450 million is substantial, but it is unlikely to be the last major financing event before plant-scale deployment.",
      "claimRefs": [
        "CI009",
