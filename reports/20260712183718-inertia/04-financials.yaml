    {
      "id": "revenue-model-and-monetization-logic",
      "title": "Revenue model and monetization logic",
      "body": "Public materials portray Inertia as a future electricity producer, not as a current product vendor. The company describes how fusion heat would be converted to electricity and repeatedly frames success as a grid-scale plant. That implies a long-dated revenue model based on sold power rather than near-term software subscriptions, marketplace take rates, or service contracts. The challenge is timing and recognition. No revenue can appear until a plant exists, the underlying shot cadence works, and a buyer or grid pathway is in place. Public sources do not disclose a target tariff, a draft PPA structure, or any intermediate licensing business with real contract value. That means public investors can understand the eventual economic destination while still lacking the tools to model when or how cash generation actually begins.",
      "claimRefs": [
        "CI001",
