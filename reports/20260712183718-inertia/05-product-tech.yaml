      ]
    },
    {
      "id": "architecture-and-physics-choice",
      "title": "Architecture and physics choice",
      "body": "Inertia's public materials are unusually explicit about why they chose this architecture. The company anchors itself to NIF ignition, defends indirect drive, explains why D-T fuel is the practical starting point, and emphasizes that commercial performance requires meaningful target gain rather than a one-off scientific win. It also goes out of its way to differentiate itself from LIFE, implying that manufacturability and plant design\u2014not just the underlying plasma physics\u2014are part of the technology thesis. The architecture therefore combines physics choices with industrial choices. Investors should read these pages as a coherent system argument, not as disconnected FAQs. That coherence is a strength, but it also means any weakness in one core assumption\u2014gain, driver durability, or manufacturability\u2014can propagate through the whole product stack.",
      "claimRefs": [
        "CE003",
        "CE004",
        "CE005",
