    {
      "id": "roadmap-differentiation-and-signals",
      "title": "Roadmap, differentiation, and practitioner signals",
      "body": "The differentiating strength in Inertia's product stack is the LLNL connection. The public-private partnership and patent access are not the same thing as commercial proof, but they do strengthen the technical supply chain around lasers, targets, and design know-how. LIFT broadens that ecosystem. Hiring data add another useful signal: the company is actively recruiting in exactly the specialties its architecture requires, particularly laser-diode and optical engineering. Against peers like Helion and CFS, the current gap is not that Inertia lacks a coherent technical story; it is that peer public surfaces often provide more milestone-specific detail about machines, campuses, or deployments. Inertia still reads as earlier on integrated public proof. That mismatch between compelling theory and thinner public milestone granularity is the main reason the chapter stays constructive but not high-conviction.",
      "claimRefs": [
        "CE014",
        "CE015",
        "CE017",
