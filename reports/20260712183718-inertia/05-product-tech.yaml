  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Inertia\u2019s product story is a coherent commercialization stack built on NIF-linked inertial fusion, indirect-drive targets, high-gain target design, cheap target manufacturing, high-repetition diode-pumped lasers, and conventional power conversion. The strongest evidence is around scientific lineage and architecture coherence; the weakest evidence is around manufacturing-scale repetition, first-wall durability, and integrated plant proof. Public job postings and the LLNL/LIFT ecosystem strengthen the case that real hardware work is underway, but the company remains far from a publicly demonstrated commercial system."
  },
  "sections": [
    {
      "id": "product-definition-and-workflow",
      "title": "Product definition and customer workflow",
      "body": "Inertia's current product is best understood as a staged industrialization program rather than a shipped energy product. The company repeatedly describes a future fusion power plant that converts repeated inertial-fusion events into grid electricity. That makes the customer workflow conceptually clear even though no commercial deployment exists yet: generate fusion energy, turn that heat into electricity, and deliver clean firm power at utility scale. What exists today is the technical and manufacturing stack needed to reach that endpoint. This distinction matters for diligence because it means value creation is still tied to subsystem progress and engineering proof rather than operational customer usage. It also means buyers cannot yet evaluate uptime, service, or procurement friction from operating evidence because the workflow is still aspirational rather than deployed.",
      "claimRefs": [
        "CE001",
        "CE002",
        "CE027",
        "CE028",
        "CE030"
      ],
      "tableRefs": [
        "TE001",
        "TE002"
      ],
      "figureRefs": [
