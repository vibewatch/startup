    {
      "id": "manufacturing-fuel-cycle-and-dependencies",
      "title": "Manufacturing, fuel cycle, and dependency stack",
      "body": "Commercialization depends on much more than the target physics itself. Inertia says it must manufacture cheap targets, run at 10 Hz, use a diode-pumped solid-state laser architecture, manage first-wall damage, and secure or breed tritium. Those are precisely the kinds of interlocking constraints that determine whether a fusion concept becomes a product. They also define the dependency map. Targets, lasers, materials, fuel cycle, and power conversion all have to work together at industrial cadence. The public record is encouraging in that the company is naming the hard problems openly; it is less encouraging in that none of those elements appears publicly solved at plant scale. Investors should therefore treat manufacturability as a first-order product question, not as a late-stage operations detail that can be solved after physics closure.",
      "claimRefs": [
        "CE008",
