    {
      "id": "named-proof-and-market-precedents",
      "title": "Named proof and market precedents",
      "body": "The sharpest distinction in this chapter is between Inertia-specific proof and category-level proof. Inertia's best named relationship is LLNL, which is a powerful partner signal but not a paying energy customer. By contrast, CFS can point to Google, while Helion can point to Microsoft and Nucor. Those precedents matter because they show sophisticated buyers are willing to reserve future fusion power before commercialization is complete. They do not, however, automatically transfer to Inertia. The company still lacks a named commercial counterparty in the public record. That is why the chapter leans so heavily on proof quality: LLNL improves credibility, but customer proof only begins when a buyer is willing to attach its name, volume, or contract structure to Inertia specifically. The practical implication is that Inertia still has to clear two separate gates: first, showing that the category has believable demand; second, proving that this specific company can win a counterparty within that demand set.",
