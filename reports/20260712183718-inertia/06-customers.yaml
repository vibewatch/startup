    {
      "id": "adoption-retention-and-concentration",
      "title": "Adoption, retention, and concentration dynamics",
      "body": "Adoption metrics are almost entirely absent. There is no disclosed MW under contract, no pipeline value, no account count, and no retention metric. That is not surprising for a pre-commercial fusion company, but it still leaves the customer case largely narrative-driven. The few things public sources do support are structural: first buyers are likely to be few, large, and strategically important; procurement friction will be high; and the first named customer could dramatically change financing and perception. Inertia therefore faces extreme concentration risk at the beginning even if concentration later becomes a strength. Even a successful first customer could create lopsided dependence on one or two credits, one site, and one delivery timeline, so concentration should be treated as both an opportunity and a risk in the early years. In other words, the absence of classic retention metrics is understandable, but the absence of even early commercial funnel metrics is still a real diligence problem.",
      "claimRefs": [
        "CU016",
