  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Inertia\u2019s customer story is compelling in theory but thin in direct proof. Public sources support the idea that hyperscalers, utilities, and some industrial buyers could become first customers for fusion, and peer precedents from Google/CFS, Microsoft/Helion, and Nucor/Helion show that sophisticated buyers will sign pre-commercial agreements. What remains missing is decisive: no named Inertia customer, no public PPA or LOI, no adoption metrics, and no retention data. The result is a research-more customer profile anchored more by analogy than by Inertia-specific commercial evidence."
  },
  "sections": [
    {
      "id": "customer-landscape-and-segmentation",
      "title": "Customer landscape and segmentation",
      "body": "Inertia's likely customer base is conceptually clear even though the actual customer list is not. The company is building toward large buyers that value clean firm power in big blocks: hyperscalers, utilities, and certain industrial loads. That framing is plausible because fusion's promise is not marginal efficiency but dependable, scalable energy. Public demand context from data-center energy growth reinforces why these buyer classes matter. But segmentation is still mostly inferred from the product and market problem rather than proven by disclosed contracts. The important caution is that this segmentation comes from problem-solution fit and category behavior, not from an observable Inertia bookings mix. Until counterparties are named, segmentation remains a disciplined hypothesis rather than proof. Buyers in these segments also differ meaningfully in procurement style: hyperscalers can anchor around long-dated clean-energy sourcing, utilities around interconnection and reliability, and industrials around concentrated site demand. That heterogeneity makes a one-size-fits-all sales motion unlikely.",
      "claimRefs": [
