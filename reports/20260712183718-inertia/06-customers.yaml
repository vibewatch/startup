    {
      "id": "customer-verdict-and-diligence-path",
      "title": "Customer verdict and diligence path",
      "body": "The right verdict is not that the market is weak. The market pull is increasingly visible. The problem is that Inertia-specific conversion remains unproved. Public peer evidence is useful as an analogy set, and pages from CFS and Helion show what stronger public customer proof looks like: named buyers, visible sites, and clearer deployment narratives. Inertia has not crossed that threshold yet. The next diligence step is therefore straightforward\u2014get the actual pipeline, any buyer letters, intended contract structures, and the sequence from first anchor customer to broader expansion. Until then, the customer chapter remains a research-more story rather than a commercial-proof story. Put differently, the category evidence answers \u201ccould someone buy this?\u201d while the missing Inertia evidence still leaves \u201cwho will buy it from Inertia, on what terms, and when?\u201d unresolved. That conversion gap is the central commercial unknown.",
