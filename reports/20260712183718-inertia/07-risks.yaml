    {
      "id": "regulatory-legal-and-policy-risk",
      "title": "Regulatory, legal, and policy risk",
      "body": "The regulatory picture is better than it was a few years ago, but still not fully settled. U.S. fusion regulation is evolving through NRC rulemaking, legal commentary, and differentiated treatment arguments from companies like Helion. California and federal innovation policy are supportive, yet support is not the same as a project-specific license. The practical risk for Inertia is not just whether a legal framework exists in theory, but whether it can move through it on a schedule consistent with its commercialization ambitions. Peer disclosures on regulatory milestones make this gap more visible, not less. That means regulatory risk should be modeled as schedule risk and financing risk at the same time, not as a separate legal footnote. The legal environment is therefore directionally encouraging but still operationally incomplete. Until the company publishes a concrete site and permitting sequence, the regulatory story remains an input to risk rather than a mitigation that deserves full credit.",
      "claimRefs": [
        "CR009",
