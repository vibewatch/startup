    {
      "id": "dependency-people-and-thesis-breakers",
      "title": "Dependency, people, and thesis-breakers",
      "body": "The dependency map is narrow. Inertia relies heavily on LLNL-linked know-how, specialized hires, patient capital, and eventual anchor customers who do not yet appear publicly. This kind of concentration is normal for a frontier hardware company, but it means disruptions transmit quickly. The thesis-breaking conditions are therefore concrete: failure to maintain critical partnerships, prolonged silence on manufacturing progress, inability to navigate a credible permitting path, or the need for additional capital before external proof points appear. The company\u2019s public legal surface is basic and does not materially change those risk conclusions. Overall, the risk profile remains very high despite the quality of the underlying ambition. Even strong founders and strong investors cannot compensate indefinitely if those external dependencies fail to convert into measurable commercial de-risking. Investors should also notice that the same concentration that creates upside in a breakthrough can create fragility in execution. A narrow dependency map can accelerate learning, but it also reduces redundancy when timelines slip or relationships change.",
