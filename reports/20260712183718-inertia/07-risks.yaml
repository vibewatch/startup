  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Inertia combines a high-pedigree scientific story with a very high-risk commercialization profile. The hardest risks are technical integration, regulatory path definition, follow-on capital sufficiency, and dependence on a small set of external chokepoints such as LLNL-linked credibility, specialist talent, and future anchor customers. Supportive policy and peer progress help frame the opportunity, but they do not substantially reduce Inertia\u2019s own execution burden."
  },
  "sections": [
    {
      "id": "technology-and-engineering-risk",
      "title": "Technology and engineering risk",
      "body": "Inertia\u2019s hardest risk is industrialization. The scientific lineage is real, but the company itself acknowledges the engineering burdens that sit between a notable shot and a useful power plant: gain, targets, shot cadence, wall survivability, and fuel handling. Those are not minor optimization tasks. They are the product. Because these subsystems are coupled, partial progress in one area may still leave the whole plant thesis exposed. Public evidence today supports confidence in the problem framing, not confidence that the integrated answer has been demonstrated. The practical underwriting point is that the company is not hiding the hard problems; it is simply far from proving that the hard problems are jointly solved on a commercial timeline. A key implication is that investors should resist treating any single laboratory headline as sufficient de-risking. Fusion plants fail or succeed as systems, and systems risk usually emerges later than early physics success.",
      "claimRefs": [
        "CR001",
        "CR002",
