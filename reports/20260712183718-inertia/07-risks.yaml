    {
      "id": "capital-competition-and-timing-risk",
      "title": "Capital, competition, and timing risk",
      "body": "Capital risk and competitive risk are inseparable in fusion. FIA and related reporting still indicate large commercialization funding needs across the sector. Peer programs are also advancing: Helion is public about regulation and deployment, while CFS is public about timelines and supply chain. That means Inertia is competing not only against physics, but against better-surfaced rival narratives that may win capital, customers, and talent first. The timing risk is therefore two-layered: Inertia must move fast enough to stay relevant, yet deep-tech energy infrastructure rarely rewards haste. A mistimed financing or long milestone gap could therefore be disproportionately damaging. Investors should treat peer progress as a competitive forcing function rather than as comforting proof that the path will be easy for everyone. This matters because a long gap between major announcements can look like stasis even when internal work continues. In frontier energy, perception and capital access can deteriorate faster than underlying science if the public milestone clock stalls.",
      "claimRefs": [
        "CR013",
