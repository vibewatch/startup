      - number: '8.2'
        title: 为什么它有吸引力——以及为什么高价买入危险
        blocks:
          - type: paragraph
            body: >-
              Gatik
              的投资逻辑并不隐晦。它有真实运营、具名客户、异常清晰的用例聚焦、商业在手订单，以及高质量投资财团。在一个充满「有愿景但没收入」项目的行业里，这一点很重要。反向逻辑同样清楚。签约收入不是确认收入；客户集中度看起来显著；合作伙伴依赖高；公开财务披露远远达不到投资人研究一家上市出行公司时可获得的水平。估值时，故事的两半都重要。


              可比公司也必须谨慎处理。Aurora 可作为上市自动驾驶货运期权性标的参考，但不能当作干净的定价模板。J.B. Hunt 可作为成熟货运基准，但不是自动驾驶可比公司。Applied Intuition
              可作为自动驾驶工具 / 平台上限参考，但业务太宽，无法直接映射到 Gatik。Waabi 显示私募资本对雄心勃勃的自动驾驶平台仍有胃口。Embark 和 TuSimple
              说明，当商业化或治理令人失望时，自动驾驶卡车估值可以多快地反转。正因为 Gatik 其他方面看起来很强，这些警示性可比公司才重要。
