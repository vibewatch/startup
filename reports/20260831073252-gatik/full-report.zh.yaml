        - Isuzu / NVIDIA 条款、或有事项和备用方案
        - 单一伙伴脆弱性会大幅压低乐观情景概率
        - 审阅商业协议和应急方案。
      - - 规模化资本计划
        - 车队融资需求、现金跑道和下一轮融资假设
        - 上千辆卡车的目标，所需资本可能超过积压订单暗示的规模
        - 要求提供董事会计划，以及基准和悲观情景下的融资模型。
    notes: 这些问题是把仅基于公开信息的估值视角转成可定价投资决策所需的最低证据集。
    claimRefs:
      - CV020
      - CV032
      - CV038
      - CV041
