      - CI007
      - CI008
      - CI011
      - CI031
      - CI032
  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: wide
    summary: 只有当沉重的服务交付成本能被密集重复路线吸收时，利用率优势才会变成有吸引力的贡献利润率。
