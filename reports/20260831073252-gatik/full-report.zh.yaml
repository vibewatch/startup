  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品到底是什么
        blocks:
          - type: paragraph
            body: >-
              Gatik 的产品不只是自动驾驶栈，也不只是货运服务。公开材料显示，它是一套集成系统，至少包含五类资产：Gatik Driver
              自动驾驶栈、中型车辆平台、路线运营层、安全与诊断层，以及支持验证和发布信心的仿真与数据层。放到客户流程里，产品在重复区域网络中把货物从配送中心、仓库和门店之间运来运去，覆盖常温、冷藏和冷冻货运。因此，自动驾驶本身和服务设计不可分割。买方买的不是单纯感知软件，而是一个通过卡车、操作流程和商业问责交付的无人驾驶中段货运操作系统。


              这种集成是真正的差异化，也解释了为什么 Gatik 比许多更宽的 AV
              同行更早商业化。公司没有试图一次性解决所有道路场景，而是聚焦结构化中段路线、中型卡车和重复运营环境。Walmart、Loblaw、PepsiCo 和 Tyson
              的公开客户验证表明，这套系统可以支持多种货运流程，同时仍留在刻意划定的运营设计域内。结论是，应把 Gatik
              产品看作服务和技术栈紧耦合的架构来承销。它让公司对客户结果有更强控制力，但也意味着产品成熟度取决于物流执行、安全流程和车辆工业化，而不只取决于软件质量。
