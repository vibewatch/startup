    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: 真正有意义的视角，会从美国卡车运输总支出迅速收窄到 Gatik 的重复路线中间里程切口。
    data:
      items:
        - label: 美国卡车运输总 TAM
          detail: ATA 估计，2024 年卡车货运收入为 $906B，按重量计占货运量的 72.7%。
          tone: neutral
        - label: 更广义自动驾驶卡车市场
          detail: Mordor 估计，2026 年全球自动驾驶卡车收入池为 $42.63B，北美是最大区域。
          tone: neutral
        - label: 中间里程自动配送
          detail: FMI 估计，2026 年狭义 B2B 中间里程品类收入仅 $490M。
          tone: positive
        - label: 零售补货切口
          detail: 零售门店补货在 FMI 品类结构中占比 38%，与 Gatik 最强的公开用例高度贴合。
          tone: positive
        - label: 类 Gatik 重复路线 SAM
          detail: 可投资切口是拥有密集区域路线、受控装卸月台，以及责任归属清晰的服务水平需求的那一部分。
          tone: warning
    approximationNotes: 这是一个范围收窄视角，不是字面发布的 TAM/SAM/SOM 堆栈。每一层使用不同的、有来源支持的市场口径，说明为什么广义卡车运输数字会夸大当前可服务范围。
