      - number: '3.4'
        title: 护城河耐久性、反向证据与承销结论
        blocks:
          - type: paragraph
            body: >-
              Gatik 的护城河在泛化 AV 玩家最弱的地方最强：特定路线商业验证、具名发货方信任、中段货运运营模式，以及中型车 OEM 对齐。公司披露的无人驾驶订单量、99% 准时主张、具名客户、经 TÜV SÜD
              评审的安全方法，以及 Isuzu
              量产路径，共同拼出一个比许多自动驾驶公司更具体的运营故事。客户评估货运自动化时，关心服务问责不亚于技术新鲜感，所以这些事实有意义。在窄楔子里，这些证据可以压过更宽但商业化不足的平台主张。


              但耐久性远未解决。Waabi 2026 年融资信号显示，一些相邻竞品可以比 Gatik 更能砸钱。只要中段货运经济性足够有吸引力，Aurora、Torc、Kodiak 和 Einride
              都能向重叠地带移动。物流既有企业可以用超大规模提供运力、租赁和托管服务替代品，削弱客户采用的紧迫感。并且 AV 信任在社会和监管层面具有关联性；即便 Gatik 自己执行良好，自动驾驶其他地方的破坏性事件也会拖慢
              Gatik。关键反向洞察是：Gatik 的商业可信度还不等于已验证的定价权或排他性。因此，最好的承销视角应保持平衡：Gatik
              在所选楔子里异常可信，但只有在资本更充足的通才或既有企业追上之前，把可信度变成路线级锁定效应，护城河才会真正变硬。
