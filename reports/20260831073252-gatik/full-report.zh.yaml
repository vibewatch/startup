      - number: '5.3'
        title: 信任、质量、合规与部署控制
        blocks:
          - type: paragraph
            body: >-
              以一家私营自动驾驶汽车公司看，Gatik 的信任架构搭得格外细。公司公开把安全分成五大支柱，描述了一个覆盖 700 多项组合的 Safety Assessment Framework，提到围绕 UL4600
              的工作，并称已邀请 Edge Case Research 和 TÜV SÜD 审查其系统与安全论证的部分内容。在此之上，公司还组建了 Safety Advisory Council，成员包括前
              NHTSA、FMCSA、卡车运输和汽车行业负责人；同时设立专门的一线应急响应职能，配套 First Responder Interaction Protocol
              和基于场景的培训材料。诊断、验证、顾问监督和社区准备计划叠在一起，让 Gatik 更像一家部署运营商，而不是实验室项目。


              但公开记录的边界同样重要。上述材料没有给出清晰的公开等价物，无法替代经审计的脱离接管基准、标准化网络安全证明，或可与同行直接比较的路线级安全记分卡。多数信任证据仍偏流程化，且由公司撰写；这比沉默更好，但仍不同于外部绩效证明。较强的解读是，Gatik
              似乎足够重视信任和部署准备，并把它们作为产品的一部分来工具化。谨慎的解读是，公开可比性仍弱，外部人士更容易评估流程的严肃性，而不是评估真实结果差距。
