      - number: '7.3'
        title: 规模受合作伙伴和许可卡住
        blocks:
          - type: paragraph
            body: >-
              Gatik 的依赖图谱异常清晰。Isuzu 是关键车辆平台和工业化伙伴。NVIDIA
              是关键车载计算和软件栈伙伴。州和省级主管机关决定路线能否启动并持续。旗舰客户既提供收入，也提供让结构化自动驾驶一开始有吸引力的重复路线密度。这些都不是可选项。因此，合作伙伴风险不是旁支问题——它就是运营模型本身。


              这让公司更容易理解，也更脆。量产就绪车辆延迟、平台路线图变化、核心地理区域授权问题，或某个大客户放缓，都可能传导到运营、利用率和融资观感。尽调中的实际问题是，Gatik
              是否围绕最关键依赖，拿到了足够的合同保护并准备了应急方案。公开记录无法清楚回答。
