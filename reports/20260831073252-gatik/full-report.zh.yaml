      - number: '2.2'
        title: TAM、SAM 与市场规模口径
        blocks:
          - type: paragraph
            body: >-
              最宽的 TAM 锚点仍是美国整体卡车经济。ATA 估计，2024 年卡车按重量承运全国 72.7% 的货物，并产生 $906 billion 总货运收入。这个标题数字有用，因为它说明物流底座有多大，但它会大幅夸大
              Gatik 这类公司的近期机会。更好的读法是一组逐层收窄的口径。在最宽一端，Mordor 估计整体自动驾驶卡车市场 2026 年为 $42.63 billion，到 2031 年达到 $74.23
              billion。这个数字包含更广泛的卡车类别、自动驾驶等级和区域应用。


              对 Gatik 来说，更相关的口径是 FMI 的中段自动驾驶配送品类：2026 年规模 $490 million，预计到 2036 年达到 $14.173 billion。在这个更窄的细分里，FMI 称 L4
              厢式货车以 44% 份额领先，零售门店补货以 38% 份额领先，运输即服务在商业模式组合中以 46% 领先。Mordor 的更宽市场仍有意义，因为它显示 North America
              是当前最大的商业化竞技场，中型和 Level 4 配置也属于增长最快的子细分。但 $490 million 的当前小众估计和 $42.63 billion 的更宽 AV
              卡车估计同时存在，正说明投资人应保留相互冲突的规模口径，而不是强行压成一个虚假的精确数字。
