      - number: '2.3'
        title: 买方、用户、付款方与采用契合度
        blocks:
          - type: paragraph
            body: >-
              Gatik 这类服务的买方图谱是运营型，不是消费者型，也不是纯数字型。买方通常是有密集区域货运需求的零售商、杂货商或 CPG
              发货方。用户是网络运营人员或运输规划人员，他们要让产品按已知月台、收货窗口和设施排程持续流动。付款方更靠近供应链、运输或自有车队预算，尤其在企业购买的不是软件许可证，而是可问责货运运力时。公开客户验证清楚呈现了这个模式：PepsiCo
              描述强化 North America 最大自有车队之一，Loblaw 描述提高对 300 多家门店的频次和响应速度，Tyson 则突出 Arkansas 设施之间更灵活的冷藏流转。


              这些客户购买自动驾驶，不是因为它新奇。它们买的是一项服务：在人手难招的区域网络里，带来更好可靠性、更多运力和更容易的规模扩张。固定收货窗口和受控装载点很关键，因为它们减少路线变化，简化恢复预案，也让服务水平可以被衡量。这就是为什么
              Gatik 在零售、杂货、食品或 CPG 线路里契合度最强，而不是泛泛的卡车运输细分。公司未来扩张或许会延伸到其他重复路线货运品类，但当下核心买方逻辑仍是区域补货，而不是开放式道路自动驾驶。
