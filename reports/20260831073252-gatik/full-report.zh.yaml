      - number: '4.5'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              Gatik
              的公开财务案例足以支持认真尽调，但还不完整，无法支撑有把握的承销判断。积极一面，公司有真实路线级商业活动、服务型变现模式、有分量的积压订单、具名企业客户，以及由资本和制造伙伴支撑的规模化计划。这个起点远强于一家只谈未来试点的收入前自动驾驶公司。如果
              $600 million 已签约收入足够持久，说明企业客户愿意在这项服务上押下可观商业赌注。


              但数据集里的空白同样重要。公开材料仍没有确认收入数字、路线级贡献利润率、队列扩张数据、流失或续约披露、现金余额、债务图景，以及单车部署成本披露。因此，投资人必须把“可信商业牵引”和“已验证财务效率”分开。Gatik
              明显有前者。后者在公开材料中仍未得到证明。最终判断是，Gatik
              看起来像一家真实且正在规模化的自动驾驶货运运营商，需求有分量；但在任何人把当前积压订单和融资叙事视为持久经济性的充分证明前，公司仍需要围绕收入转化、定价、毛利率和资本需求做私有尽调。
