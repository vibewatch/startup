      - number: '7.4'
        title: 人员、执行和财务模型风险相互叠加
        blocks:
          - type: paragraph
            body: >-
              扩张一家自动驾驶货运业务，要求多个组织能力同时成熟：软件开发、车队运营、商业化、监管事务、安全治理和资本配置。Gatik
              似乎意识到了这个问题。公司补充了商业化、财务、法务和一线应急沟通方面的领导层，招聘姿态也显示仍需要专业人才。这些动作显著缓释风险，因为它们降低了公司一边试图扩张、一边仍围绕创始人运转的概率。


              但公开财务模型仍只能知道一部分。签约收入不等于确认收入，新融资也不能证明单位经济性高效。如果客户集中度显著，而车队增长仍然资本密集，执行错误就会被迅速放大。一家公司可以商业上真实，同时也会在授权、客户爬坡和资产部署没有保持同步时撞上融资墙。
