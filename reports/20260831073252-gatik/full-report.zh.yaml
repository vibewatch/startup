  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private reference points for Gatik in 2026: public AV trucking
        optionality, mature freight operators, broad vehicle-intelligence platforms, and cautionary failed AV-trucking
        precedents. It is not an exhaustive mobility comp set.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Aurora Innovation
        - 公开市值和公开文件
        - 2026 年 8 月市值约 $11.68B；2025 年收入仍很小
        - 显示公开市场如何给长期自动驾驶货运期权定价
        - 资本化程度远高于 Gatik，业务范围也不同。
      - - J.B. Hunt
        - 公开市值和低个位数 P/S 语境
        - 2026 年 8 月市值约 $24.51B；货运倍数语境远低于自动驾驶叙事
        - 可作为物流经济模型的成熟货运下限参照
        - 不是自动驾驶或风险投资成长型可比公司。
      - - Applied Intuition
        - 私有市场估值
        - 2026 年 Series F 轮估值 $15B
        - 可作为广义车辆智能和工具链野心的上限参考
        - 范围太宽，且偏软件平台，不能直接映射到 Gatik。
      - - Waabi
        - 私有融资事件
        - 2026 年融资最高 $1B；估值未披露
        - 显示资本对自动驾驶卡车平台的胃口仍强
        - 没有披露估值，产品宽度也不同。
      - - Embark Trucks
        - 历史公开估值 / 失败结果
        - 2021 年 SPAC 估值 $5.2B；到 2023 年探索清算
        - 是自动驾驶卡车热潮的重要下行提醒
        - 商业验证远弱于 Gatik。
      - - TuSimple
        - 历史公开估值 / 失败结果
        - 2021 年 $1.1B IPO；之后退市并私有化
        - 说明早期技术里程碑不保证长期公开市场价值
        - 地理区域、治理结构和长途战略不同。
    notes: 这张表有意把公开市场市值、私人融资轮估值和失败的历史先例放在一起，因为没有任何单一可比公司族群能干净套到 Gatik 身上。
