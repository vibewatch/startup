  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Gatik 的相关市场不是整个自动驾驶汽车市场，甚至也不是整个卡车自动驾驶市场。公司的证据点落在更窄的品类里：配送中心、仓库、仓储点和门店之间，沿重复路线运行的中段 B2B 公路配送。Future Market
              Insights 明确把这个品类定义为设施之间的重复货运流转，装载点受控、发车窗口有计划；这和 Gatik 及其客户对服务的描述高度吻合。PepsiCo 强调产品每天在站点之间流动的区域运输网络，Loblaw
              描述通往数百家门店的密集 GTA 配送流，Tyson 则突出生产、仓储和配送设施之间的冷藏转运。


              因此，真正的现状替代品仍是人工驾驶货运运力，无论来自自有车队、专属承运商还是标准区域卡车网络。它不是另一个软件产品。这个边界也排除了最后一英里消费者配送、绝大多数 Robotaxi 式 AV
              系统，以及主导更宽市场报告和竞品叙事的长途重型自动驾驶故事。Gatik 的市场起点是这样的场景：路线重复、设施可控、服务水平敏感度足够高，托管式自动驾驶卡车可以像工业基础设施一样运行，而不是泛化 AV 实验。
