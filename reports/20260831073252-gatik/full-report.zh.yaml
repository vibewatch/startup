      - number: '6.3'
        title: 耐久性在定性上可见，但缺少指标化
        blocks:
          - type: paragraph
            body: >-
              Gatik 的公开客户叙事，在定性耐久性上强得多，在标准化留存指标上弱得多。没有公开的
              NRR、GRR、流失率、客户数留存率、队列满意度或续约披露。这是一个真实缺口。不过，可见的具名账户显示出跨多年延续的迹象。Walmart 可追溯到发布期关系，后来又进入无人驾驶运营。Loblaw
              从加拿大首个无人驾驶部署推进到多年 50 辆卡车计划。PepsiCo 的 2026 年合作明确建立在更早的运营经验上。Tyson 在 2023 年发布后，又出现在 2026
              年报道中。这不能替代队列数据，但仍是有意义的证据，说明 Gatik 的旗舰关系并没有在拍照发布后消失。


              最合理的解读是：在路线经济性和运营模型匹配的地方，Gatik 可能确实有账户粘性，但外部人士还无法量化这种粘性。因此，投资人应把耐久性视为有支撑但测量不足。
