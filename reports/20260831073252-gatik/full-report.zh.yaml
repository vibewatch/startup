  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Gatik
        - 直接中程运输自动驾驶
        - 85k+ 全无人驾驶订单；$200M D 轮；声称 $600M+ 已签约收入
        - 零售、杂货、CPG 区域货运
        - 在中型车中程运输上有具名托运人的商业验证
        - 线路范围较窄，公开价格透明度有限。
      - - Aurora
        - 长途自动驾驶司机平台
        - 目前已承运客户货物；叙事覆盖广泛车队集成
        - 承运商和车队高速货运
        - 以无人货运定位，承诺 24/7 利用率
        - 与 Gatik 的门店补货工作流匹配度没那么明显。
      - - Torc Robotics
        - OEM 集成式长途 AV 平台
        - Daimler / Freightliner 集成
        - 使用重型平台的货运运营商
        - 深度嵌入 OEM，再叠加监督技术栈
        - 比 Gatik 核心楔子更偏长途和重型。
      - - Kodiak AI
        - 宽口径地面自动驾驶平台
        - 2026 年许可和无人化部署势头
        - 卡车运输、工业、国防物流
        - 平台跨度大，可跨领域延展
        - 公开证据不如 Gatik 那样聚焦零售中程运输。
      - - Waabi
        - 通用 AV / Physical AI 平台
        - 2026 年首页宣布 $1B 融资；Volvo 合作伙伴信号
        - 自动驾驶卡车运输和无人出租车
        - 资本底盘大，平台野心强
        - 在这组来源里，中程运输商业验证显得没那么具体。
      - - Einride
        - 自动驾驶 + 电动货运一体化服务
        - 已在欧洲和美国道路运营
        - 工业托运商、零售商、港口、物流枢纽
        - 打包范围更宽，覆盖自动驾驶、EV 和软件
        - 产品组合不同，会削弱与 Gatik 的直接可比性。
      - - Outrider
        - 邻近的堆场自动化
        - 运营效率叙事，不是道路自动驾驶规模
        - 配送堆场和物流设施
        - 自动化堆场安全、周转时间和资产跟踪
        - 不替代公共道路上的中程运输里程。
      - - Ryder / Penske / J.B. Hunt 等既有方
        - 现状下的既有替代方
        - 庞大的车队、网点、员工和托管物流规模
        - 任何需要可靠货运运力的托运商
        - 服务确定性、维护、租赁和采购信任
        - 在这组证据里，没有公共道路自动驾驶中程运输产品。
      - - 内部自建 / 自有车队
        - 替代路径
        - 由客户自有资产和运营团队支撑
        - 拥有专用网络的大型托运商
        - 可保留服务设计控制权
        - AV 技术栈、安全和保险负担通常不在托运商核心能力内。
    notes: 各行比较的是产品家族，而不是假装每个参与方都卖完全相同的单位经济性。
