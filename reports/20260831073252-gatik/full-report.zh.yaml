      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Gatik 的融资故事强于许多私营自动驾驶公司，但透明度还不足以消除资产负债表风险。2026 年 8 月 Series D 增加 $200 million，使 2019 年以来据报道累计融资达到约 $500
              million。Isuzu 2024 年的 $30 million 投资不只是资本：它加深了 2027
              年生产计划背后的工业关系。管理层还称，当前融资支持公司从数十辆卡车扩到数千辆，招聘工程和运营人员，并进入新市场或加密现有市场。这在战略上很有吸引力，但也正是那种资本消耗会快于标题式积压订单暗示的计划。


              主要挑战在于，Gatik 没有披露投资人直接检验现金跑道所需的数字。没有披露现金余额、月度烧钱、单车部署资本开支（capex）、债务或租赁排期，也没有为车队增长披露明确的项目融资结构。2026 年 1
              月，Gautam Narang 告诉 Transport Topics，公司有足够现金支撑未来几年，并且在可预见未来资本充足。这可能是真的，但它仍是管理层指引，不是经审计的资产负债表证据。Aurora
              文件提供了一个行业提醒：即便一家拥有超过 $1 billion 短期投资的公司，也仍表示规模化时可能择机融资。Gatik 可能比 Aurora
              更聚焦、更扎根商业，但这个对比凸显同一课：真实收入降低生存风险，却不会抹掉工业规模自动驾驶货运的资本强度。
