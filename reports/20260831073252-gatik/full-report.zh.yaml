companyProfile:
  summary: >-
    Gatik 是一家总部位于 Santa Clara 的自动驾驶货运公司，成立于 2017 年，聚焦配送中心、仓库和门店之间的中段物流。它把 Gatik Driver
    自动驾驶栈、中型卡车、路线运营，以及面向重复区域货运流程调校的安全与仿真系统绑在一起。公司不追逐长途半挂卡车或 Robotaxi，而是盯住边界清晰、已经产生收入的厢式货车路线，因此成为商业可信度最高的自动驾驶卡车创业公司之一。
