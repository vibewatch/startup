  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律敞口在收紧，而不是消失
        blocks:
          - type: paragraph
            body: >-
              最重要的法律洞察是，Gatik 所在类别的许可正在变得更明确。Texas 现在已经有面向商业自动驾驶汽车运营的真实授权制度。Ontario 有正式试点计划，包含路线批准、最低保险要求和事故报告。Arizona
              仍相对开放，但也要求遵守州法规和联邦规则。联邦层面，FMCSA 仍在推进 ADS 装备商用车框架，USDOT 继续强调监管现代化，NHTSA 的事故报告令则带来直接执法敞口。这套组合意味着 Gatik
              的监管风险是动态的：公司今天可以合规，明天也可能面对实质上更严格的要求，尤其是在发生广泛报道的事故之后。


              NTSB 的材料进一步强化了这一点。材料显示，公共道路自动驾驶测试仍缺少统一的联邦安全风险管理要求，自愿安全自评的作用有限。因此，法律风险并非假设。框架仍在书写时，Gatik
              已经在运营。这可能成为早期进入者的战略优势，但也意味着公司正在帮助探明未来执法的边界。
