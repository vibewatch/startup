      - number: '8.4'
        title: 退出准备度，以及决定价格的最后几个问题
        blocks:
          - type: paragraph
            body: >-
              只看公开证据，Gatik 还不是一个可以承销 IPO 的故事。它可能会变成，但前提是把在手订单和运营里程碑转成经审计的财务表现、更好的客户披露，以及面向公开市场更清楚的安全叙事。战略退出也有可能，尤其是
              OEM、物流巨头或自动驾驶平台想获得商业中间里程敞口时；但今天的公开记录里看不到明显买家。


              因此，合理结论只有一个：先解决最关键问题，再给公司定价。收入确认、贡献利润率、集中度、保险经济性、合作伙伴条款和资本化需求，将决定 Gatik
              是一笔有纪律的买入，还是仅仅一个动人的故事。在那之前，估值工作应被视为有边界的判断，而不是精密工程。投资人应假设，更好的私有数据可能让区间向任一方向实质移动。
