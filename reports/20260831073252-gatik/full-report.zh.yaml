      - number: '1.4'
        title: 里程碑、客户验证与战略依赖
        blocks:
          - type: paragraph
            body: >-
              里程碑历史显示，公司不是走宽泛自动驾驶汽车平台路线，而是围绕特定客户的区域网络扩张。2019 年，Walmart 在 Bentonville 支撑了首次商业发布；2020 年，Gatik 与 Loblaw 推出
              Canada 首支自动驾驶配送车队；2021 年，又与 Walmart 达成广被引用的无司机里程碑。到 2023 年，公开客户名单扩展到 Kroger 和 Tyson，Gatik 历史材料还提到
              Georgia-Pacific、KBX 和 Pitney Bowes。2025 年 9 月，Loblaw 与 Gatik 签署五年扩张协议，计划在 Greater Toronto Area 部署 50
              辆自动驾驶卡车；2026 年 6 月，PepsiCo 宣布北美多年期部署。TechCrunch 随后报道，仅 PepsiCo 一家就涉及 41 辆无人驾驶厢式货车，覆盖 Dallas、Phoenix 和
              Northwest Arkansas，使其成为公司披露过的最大合作关系。


              规模化仍依赖少数战略对手方。Isuzu 是车辆项目核心，并在 2024 年 5 月协议中投资 $30 million，双方共同开发可量产的 Level 4 中型卡车和一条面向 2027
              年的专用生产线。安全可信度同样取决于公司能否持续把流程主张转化为外部保证：Gatik 公开安全材料描述了受限运营设计域、可重复验证、TÜV SÜD 第三方评审，以及与 UL4600 风格符合性工作相连、包含
              700 多项组合的 Safety Assessment Framework。聚焦中段货运的策略显然让 Gatik
              比几家长途干线对手更早商业化，但未来增长也会被放到同一问题下检验：高度集中的客户和伙伴基础，能否扩成持久的多市场密度。
