  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引
        blocks:
          - type: paragraph
            body: >-
              最清楚的财务结论是，Gatik
              已经跨过仍困扰许多自动驾驶公司的试点时代模糊性。公开材料始终把它描述为自动驾驶运输即服务业务，而不是卖给开发者的工具，也不是投机性的未来授权故事。收入机制看起来绑定在大型发货方重复中段路线上的商业货运流转。这一定义很关键，因为它意味着收入来自运营结果——按时把货物从配送中心运到门店——而不是来自软件席位采用或一次性卡车销售。公开客户验证也支持这种读法。PepsiCo
              2026 年 6 月公告描述了覆盖约 250 个零售点的 41 辆卡车部署，Gatik 自家材料和投资方背书公告也反复提到零售、杂货和 CPG 用例，并有跨多个区域的活跃路线。


              牵引数字足够强，值得重视，但还不足以回答所有财务问题。2026 年公开材料称 Gatik 有超过 $600 million 已签约收入、超过 85,000 个完全无人驾驶订单，以及 99%
              准时表现。Transport Topics 报道称，公司在 2025 年下半年新增 $400 million 照付不议合同，最新发货方交易又把五年已签约收入翻倍至 $600
              million。这很重要，因为它说明存在一定收入可见性和并非无足轻重的合同质量，而不是松散试点备忘录。但已签约收入不是确认收入。公开来源仍没有显示收入确认节奏、积压订单有多少前置或后置，以及已签约价值有多少依赖服务水平、爬坡排程或合同选择权。因此，正确解读不是“Gatik
              已解决财务披露”，而是“Gatik 已证明真实商业需求，但尚未具备公开市场级财务透明度。”
