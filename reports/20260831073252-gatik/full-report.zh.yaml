      - number: '3.3'
        title: 定价不透明、包装模式与路线级锁定
        blocks:
          - type: paragraph
            body: >-
              自动驾驶卡车领域的公开定价透明度仍然很弱。这组证据里的核心竞品，没有一家发布可让外部分析师比较每英里费率、正常运行时间保证、服务水平折扣或利润分成的标价。这迫使我们问一个更好的问题：客户究竟在买什么？Gatik
              看起来销售的是和客户网络对齐的托管式自动驾驶货运运力。Aurora 更接近把自动驾驶司机集成进现有车队的模式。Torc 像是在 OEM 关联交付中，把自动驾驶司机与指挥和监督层结合。Einride
              销售更宽的组合，混合自动驾驶车队、软件、监督和人工驾驶电动资产。Outrider 和物流既有企业卖的是生产率、运力和运营确定性，而不是无人驾驶中段货运里程。


              这种包装差异有战略意义，因为它塑造切换成本。一条路线一旦接入月台排程、安全审批、异常处理手册、远程支持流程和车辆计划，更换供应商就不再是简单的价目表练习。锁定效应并非绝对：大型发货方可以在组合层面多家并用，尤其按地理或用例拆分。但单条路线替换应该比许多外部人想象得更难，因为保险方、监管方、急救人员和设施运营方都会成为运营系统的一部分。OEM
              入口会加深这种效应。Gatik 的 Isuzu 路径、Torc 的 Freightliner 集成，以及 Waabi 与 Volvo
              的对齐都说明，这个市场里的分销力部分取决于谁能把车辆和服务栈工业化，而不只是训练出更好的模型。
            claimRefs:
