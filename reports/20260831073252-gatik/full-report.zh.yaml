      - number: '3.2'
        title: 竞品画像与能力重叠
        blocks:
          - type: paragraph
            body: >-
              如果不看原始 AI 口号，而按路线范围、客户承诺和商业包装描述每个竞品，Gatik 的直接差异最清楚。Aurora 销售的是一套可嵌入现有车队运营的自动驾驶货运系统，并强调 24/7
              利用率；这使它在宽泛货运走廊上很强，但和严格托管的中型门店补货网络不是同一个产品。Torc 走类似的宽泛货运逻辑，只是通过 Freightliner 和 Daimler 绑定更重的 OEM 集成。Kodiak
              把自己呈现为覆盖卡车、工业和国防应用的多环境自动驾驶平台，意味着广度和可选性更强，但对 Gatik 具体零售中段流程的聚焦没有那么可见。Waabi 的野心更宽：一个同时服务卡车和 Robotaxi 的
              Physical AI 平台，再叠加大量资本和 Volvo Autonomous Solutions 合作信号。


              相比之下，Einride 和 Outrider 说明了相邻市场为什么重要。Einride 把自动驾驶、电动货运运营、软件和监督式服务打包，哪怕产品组合不同，也在商业问责上和 Gatik 重叠。Outrider
              自动化堆场运营，可以拿到物流自动化预算，却不替代公路段本身。在非自动驾驶一侧，Ryder、Penske 和 J.B. Hunt 拥有 Gatik
              还无法匹配的东西：庞大服务规模、密集维修和物流网络，以及受信任的采购关系。PepsiCo、Loblaw、Tyson 和 Kroger 的公开客户验证仍让 Gatik
              在所选楔子里有实质优势，但这个优势是有场景边界的，不是普遍适用。
