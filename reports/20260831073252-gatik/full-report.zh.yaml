      - number: '6.2'
        title: 采用轨迹与背书质量
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Gatik
              已经越过「试点剧场」，进入重复运营使用。最强证据不是单一指标，而是多种指标的累积：数万单完全无人驾驶订单、较高准点交付声明、具名上线部署、客户侧背书，以及如果服务没有真正嵌入物流运营就很难伪造的路线级描述。PepsiCo
              和 Loblaw 是当前最强的规模化企业采用证明。PepsiCo 的 2026 年公告把这次合作定义为北美大型食品饮料网络中的重大商业部署。Loblaw 的 2025
              年扩张更具体，给出了车辆数、门店数和五年承诺。Tyson 和 Kroger 在冷链和杂货履约上补充了工作流深度，Walmart 则仍是最早的历史证明点。


              关键细节是，不同账户的证据质量并不一致。有些部署有客户直接发布和量化扩张细节，另一些主要靠 Gatik 或二级报道确认。这意味着背书质量不均匀。即便如此，客户章节仍是整个 Gatik
              尽调包中最强的部分之一，因为它包含真实具名客户和工作流细节，而不是匿名的「企业合作伙伴」或实验室级试点。
