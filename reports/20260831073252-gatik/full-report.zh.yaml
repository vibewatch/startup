          to: valuation
          label: 重新定价
        - from: regulators
          to: valuation
          label: 规模化概率下降
    approximationNotes: DAG 聚焦投资者在意的因果传导，而不是详细事故管理流程。
    claimRefs:
      - CR013
      - CR017
      - CR026
      - CR027
      - CR028
      - CR037
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Gatik 的规模化野心取决于 OEM、计算、监管方、客户和内部安全职能同步兑现。
    data:
      nodes:
        - id: isuzu
          label: Isuzu
          detail: 车辆平台和制造路径
        - id: nvidia
          label: NVIDIA
          detail: 计算、OS 和安全栈依赖
        - id: regulatory
          label: Texas / Ontario / Arizona
          detail: 授权和试点连续性
        - id: customers
          label: 旗舰客户
          detail: 路线密度、验证和扩张
        - id: safety
          label: 内部安全体系
          detail: 诊断、FRIP、委员会、安全框架
        - id: scale
          label: 规模化无人驾驶货运
          detail: 收入、利用率和估值上行
      edges:
        - from: isuzu
          to: scale
          label: 工业化
        - from: nvidia
          to: scale
          label: 计算栈
        - from: regulatory
          to: scale
          label: 授权许可
        - from: customers
          to: scale
          label: 需求密度
        - from: safety
          to: scale
          label: 信任 / 可靠性
        - from: safety
          to: regulatory
          label: 审批证据
        - from: safety
          to: customers
          label: 服务信心
    approximationNotes: 本图把依赖关系建模为规模化的闸门条件，而不是所有权关系。
    claimRefs:
      - CR015
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR035
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议来自强商业验证、定价不透明和剩余风险的连锁权衡，而不是怀疑 Gatik 是否真实。
    data:
      nodes:
        - id: proof
          label: 商业验证
          detail: 积压订单、无人驾驶订单、具名客户和投资者质量
          type: input
        - id: quality
          label: 公司质量
          detail: 聚焦 ODD、客户扩张和实时运营提升可信度
          type: process
        - id: opacity
          label: 定价与财务不透明
          detail: 估值未披露；已确认收入和利润率仍未公开
          type: process
        - id: risk
          label: 剩余风险负担
          detail: 安全、集中度、伙伴和资本强度仍然偏高
          type: process
        - id: decision
          label: 有条件建议
          detail: 只有在估值纪律和验证性尽调都成立时才推进
          type: output
      edges:
        - from: proof
          to: quality
          label: 支撑
        - from: quality
          to: opacity
          label: 但不消除
        - from: opacity
          to: risk
          label: 放大
        - from: risk
          to: decision
          label: 要求纪律
    approximationNotes: 这条流程是分析逻辑，不是事实时间线；它解释投资结论如何从公开记录推导出来。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV032
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 少数未解变量对估值区间的影响远大于品牌或叙事本身。
    data:
      items:
        - label: 积压订单向已确认收入转化
          value: 30
          unit: impact score
        - label: 路线层面利润率验证
          value: 28
          unit: impact score
        - label: 客户集中度 / 扩张耐久性
          value: 25
          unit: impact score
        - label: 工业化与伙伴执行
          value: 23
          unit: impact score
        - label: 监管与安全连续性
          value: 22
          unit: impact score
    approximationNotes: 影响分数是序数，用来排序哪些公开证据最能推动估值变化。
    claimRefs:
      - CV006
      - CV024
      - CV036
      - CV037
      - CV041
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支撑一个较宽但仍有边界的估值区间，吸引力对入场价格高度敏感。
    data:
      items:
        - label: 悲观
          low: 0.8
          mid: 1.1
          high: 1.4
          unit: USD B
          claimRefs:
            - CV027
        - label: 基准
          low: 1.8
          mid: 2.3
          high: 2.8
          unit: USD B
          claimRefs:
            - CV024
            - CV025
        - label: 乐观
          low: 3.5
          mid: 4.2
          high: 5
          unit: USD B
          claimRefs:
            - CV026
    approximationNotes: 区间是仅基于公开资料的情景估计，使用可比参照和里程碑逻辑，不是谈判形成的私募市场出清价。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV031
      - CV032
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 一张紧凑的 IC 视图，说明在价格未披露时，哪些因素支撑或限制对 Gatik 的信念。
    data:
      items:
        - label: 商业验证
          value: High
          claimRefs:
            - CV003
            - CV004
            - CV022
        - label: 护城河清晰度
          value: Medium-High
          claimRefs:
            - CV005
            - CV029
        - label: 经济可见度
          value: Low
          claimRefs:
            - CV006
            - CV007
            - CV041
        - label: 风险负担
          value: High
          claimRefs:
            - CV021
            - CV030
            - CV037
            - CV042
        - label: 证据质量
          value: Medium
          claimRefs:
            - CV028
            - CV043
    approximationNotes: null
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV021
      - CV028
      - CV043
