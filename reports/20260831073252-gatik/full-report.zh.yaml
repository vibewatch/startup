      - number: '8.3'
        title: 仅基于公开信息的估值区间与入场纪律
        blocks:
          - type: paragraph
            body: >-
              由于缺少精确财务输入，情景分析比单点估值更站得住。基准情景假设 Gatik 继续凭 PepsiCo 和 Loblaw 式证明扩张，维持安全与监管表现，并推进工业化，但尚未证明公开路线级利润率。这个情景支撑低到中段
              $2 billion
              区间。乐观情景要求高得多：在手订单强力转化、车队快速扩张、客户明显多元化，并有证据表明服务经济性会在密度提升后显著改善。悲观情景不需要灾难。只要出现一种常见自动驾驶货运失败模式就够了：扩张变慢、监管摩擦、客户收缩，或资本强度压过信心。


              实际含义是，价格极其重要。公开证据可以支持投资 Gatik，但不能支持任何价格都投。因此，入场纪律应放在建议的中心，而不是脚注里。
