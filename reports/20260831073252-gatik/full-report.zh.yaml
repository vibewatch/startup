      - number: '7.2'
        title: 运营风险集中在可靠性、安全事件和证明质量
        blocks:
          - type: paragraph
            body: >-
              相比许多私营自动驾驶公司，Gatik
              有更好的公开缓释基础设施，但这并不能消除运营脆弱性。公司现在声称在多州持续提供商业无人驾驶货运服务，几乎全天候运行，且包括冷藏和冷冻货物。这带来典型的运营敞口：在线率、维护、事故响应、安全员切换、边缘场景处理、误报诊断，以及出问题时的客户恢复。公开材料强烈表明
              Gatik 严肃对待这些问题。五大安全支柱、诊断系统、700 多项组合框架、TÜV 审查、Safety Advisory Council 和一线应急职能都重要。


              剩下的问题是证据质量。多数缓释证明停留在流程层面，且由公司撰写。公开结果指标仍然很薄。这意味着投资人可以看到 Gatik
              已经搭建了严肃的安全管理装置，但还不能充分检验它在更大规模压力下能否扛住。换句话说，主要运营风险不再是「他们在乎安全吗？」而是「安全和可靠性系统能否跟部署野心一样快地扩张？」
