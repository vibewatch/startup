chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、运营模式与当前规模叙事
        blocks:
          - type: paragraph
            body: >-
              Gatik 把自己定位为自动驾驶货运公司，而不是单纯的自动驾驶软件实验室。官网、2026 年 1 月的无人驾驶规模化发布，以及 2026 年 8
              月融资材料都把产品描述为无人驾驶中段货运服务：厢式货车在高频区域路线中往返配送中心、仓库和门店。这个定义很关键，因为它把 Gatik 和仍围绕 Class 8
              高速公路自动驾驶展开的长途自动驾驶卡车开发商区分开来。公司的用例更窄，但运营结构也更清楚：密集、重复的零售和 CPG 网络里，路线可预测性、服务可靠性和门店补货频率都比跨海岸续航更重要。


              公开材料里的地点表述随时间变过。较早的 2024-2025 年 Gatik 新闻稿使用 Mountain View 电头，而 2026 年 8 月 Series D 材料和同期媒体报道称公司总部位于 Santa
              Clara。这个变化看不出公司离开 Silicon Valley 另起炉灶，但说明连基础资料字段也要按日期锚定。2026 年的规模叙事更清楚：Gatik 称其无人驾驶卡车每天在
              Texas、Arizona、Arkansas 和 Canada 运行，Nebraska、Ontario、Michigan 和 Iowa 也有更广的组织足迹信号。TechCrunch
              还报道，公司运营已从少数试点项目转入多个城市的商业无人驾驶服务，进一步支持 Gatik 现在运营的是产生收入的网络，而不是单条展示路线。
