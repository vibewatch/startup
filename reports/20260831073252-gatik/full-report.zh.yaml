      - number: '5.4'
        title: 依赖、路线图和 2026 年产品判断
        blocks:
          - type: paragraph
            body: >-
              产品已经具备商业现实性，但扩张取决于一组很窄的放大器。NVIDIA 通过 DRIVE AGX、DriveOS、DRIVE Thor 和 Halos 计划提供车载计算以及面向安全的系统背景。Isuzu
              提供中型车底盘和走向量产工业化的路径。监管方、一线应急人员和地方利益相关方，把一个技术上已验证的系统变成可部署的路线。客户提供密集网络和高重复使用场景，这是结构化自动驾驶一开始能成立的前提。换句话说，Gatik
              的产品扩张上限，取决于其依赖图谱能否足够耐用。


              路线图把这张依赖图具体化。公开资料显示，公司从 2019 年商业发布，到 2021 年 Bentonville 无人驾驶里程碑，再到 2022 年加拿大部署、2024 年安全框架与一线应急体系建设、2025 年
              NVIDIA 和 Arena 仿真里程碑，并继续推进到 2027 年量产目标。这个顺序支撑一个明确的 2026 年判断：在受限但日益动态的中间里程 ODD 内，Gatik
              看起来技术成熟，工业化计划可信，安全流程披露也异常明确。未解决的问题在扩张深度，而不在基础能力。具体说，投资人仍需要看到更好的证据：组件级架构、可靠性指标、网络安全结果，以及量产就绪路径能否真正把商业验证转成可高规模复制的卡车项目。
