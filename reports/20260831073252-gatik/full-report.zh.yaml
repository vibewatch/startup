      - number: '2.4'
        title: 增长驱动、约束与路线经济性
        blocks:
          - type: paragraph
            body: >-
              最强采用驱动来自劳动力压力、路线经济性，以及在不改变底层物流任务下提高利用率的能力。FMCSA 和 BLS 说明了为什么这很重要：人工司机仍受 11 小时驾驶上限、14 小时工作窗口，以及每周 60 或 70
              小时限制约束。在一个有 3.58 million 名司机且招聘摩擦持续存在的市场里，结构化自动驾驶提供了一条路径：增加可靠区域运力，同时不完全依赖边际劳动力供给。Gatik
              自己的客户材料反复强调的是运力和可靠性逻辑，而不只是替代司机。PepsiCo 谈韧性和客户服务，Loblaw 谈频次和响应速度，Tyson 谈更灵活的网络，Gatik 则谈高速公路和地面道路上的近 24
              小时运营。


              约束同样真实。车辆和传感器成本仍有分量，尤其 FMI 仍把组件组合中超过一半归给车辆，而落地计划又强调下一代传感器套件。EPA Phase 3 制度从 2027
              车型年起增加动力总成和合规压力，这可能帮助结构化中型车辆部署，也会让车队更新决策更复杂。最重要的是，责任、保险和路线审批仍未解决。NHTSA 明确表示，ADS 成熟之前这些问题仍开放；更广泛的 AV
              审查也意味着，即便 Gatik 的路线更受限、更有商业理性，自动驾驶其他地方的一起高曝光事故也可能外溢到货运。
