      - number: '1.2'
        title: 创始人、领导层升级与治理信号
        blocks:
          - type: paragraph
            body: >-
              Gatik 的起点仍和创始团队紧紧绑定。公司称 Gautam Narang、Arjun Narang 和 Apeksha Kumavat 在 2017
              年创办了这家公司，官网关于页面也仍把当下企业叙事锚在这支创始团队上。Gautam 仍是融资和商业规模化的公开代表，Arjun 以 CTO
              身份维持技术连续性。创始人延续性有利于战略一致，但外部可信度也更集中在小规模领导核心上。可访问的 2026 年材料没有完整公开董事会名单，外部投资人对正式董事会构成和委员会深度仍看得有限。


              可见的是，公司在更大规模纯货运部署前有意补治理能力。2024 年 4 月，Gatik 聘请 Philip Reinckens 担任商业化与运营高级副总裁，以强化运营扩张。2025 年 5 月，公司引入首任 CFO
              Patrick Archambault，并把 Judi Otteson 提升为首席法务官，明确把这些任命包装为新增长阶段的准备。同月，Gatik 成立 Safety Advisory Council，成员包括前
              NHTSA 和 FMCSA 领导，以及卡车和汽车行业资深人士。该委员会不能替代正式董事会治理，但增加了一层独立安全评审，而多数私营自动驾驶卡车创业公司仍缺这一层。财务、法务、商业化和安全岗位补齐之后，2026
              年的 Gatik 明显比早期 Walmart 阶段更像一家机构化公司。
