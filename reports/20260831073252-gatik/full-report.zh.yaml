      - number: '1.3'
        title: 融资路径、牵引指标与披露边界
        blocks:
          - type: paragraph
            body: >-
              Gatik 的资本故事不是一轮头条融资就能概括。2026 年 8 月的 Series D 融入 $200 million，由 QIA 和 Koch Disruptive Technologies
              领投，Millennium Management、ARK Invest 和 Intact Private Capital 也参与。这是公司史上已披露的最大一轮融资。按公开宣布的轮次重建，披露下限约为 $344.5
              million：2019 年 6 月走出隐身前的 $4.5 million 种子资金、2020 年 $25 million Series A、2021 年 $85 million Series B、2024 年
              Isuzu 的 $30 million 投资，以及 2026 年 $200 million Series D。不过 TechCrunch 报道称 Series D 后累计融资约 $500
              million，意味着还有其他工具或战略投资没有完全进入公开轮次年表。


              牵引叙事很强，但口径没有完全对齐。Gatik 2026 年 1 月的无人驾驶规模化发布提到超过 $600 million 已签约收入、60,000 个完全无人驾驶订单、超过 2,000 小时无人驾驶时长，以及超过
              10,000 英里无人驾驶里程。到 2026 年 8 月，Gatik 和 Yahoo 重复了 85,000 个完全无人驾驶订单和 99% 准时交付，而 QIA 同日的共同领投方帖子又提到超过 100,000
              个完全无人驾驶订单。这一不一致不推翻 Gatik 已有实质现实牵引的主线，但在公司发布可勾稽的运营台账前，投资人应把规模指标视为近似值。另一个重大缺口是估值：公开报道称 Series D
              估值未披露，可访问来源中最好的轮前点估计，是 Forbes 2026 年 1 月提到的超过 $800 million 估值。
