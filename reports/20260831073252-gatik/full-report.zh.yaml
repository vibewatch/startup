  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: 这条经济链条从合同路线承诺开始，走到已执行订单，再进入确认收入和毛利。
    data:
      nodes:
        - id: master-contract
          label: 主客户协议
          detail: 与大型托运方的多年关系和路线范围
          type: input
        - id: committed-capacity
          label: 已承诺路线 / 卡车运力
          detail: 照付不议或最低服务承诺提升可见度
          type: process
        - id: executed-orders
          label: 已执行路线里程和订单
          detail: 只有活跃路线承运真实货物时，收入才会兑现
          type: process
        - id: recognized-revenue
          label: 已确认服务收入
          detail: 经济价值必须从积压订单转成可开票运输服务
          type: process
        - id: gross-profit
          label: 扣除服务交付成本后的毛利
          detail: 利润率取决于利用率、服务成本和合同结构
          type: output
      edges:
        - from: master-contract
          to: committed-capacity
          label: 合同框架
        - from: committed-capacity
          to: executed-orders
          label: 部署与爬坡
        - from: executed-orders
          to: recognized-revenue
          label: 服务表现
        - from: recognized-revenue
          to: gross-profit
          label: 成本吸收
    approximationNotes: Aurora 的监管文件提供了最清晰的公开类比，可参考按履约进度确认收入；但 Gatik 尚未发布自己的 GAAP 政策。因此，这张流程图把有依据的商业逻辑和未经验证的会计细节拆开。
    claimRefs:
