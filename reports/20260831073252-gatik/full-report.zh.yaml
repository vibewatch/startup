  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Gatik 的影响
      - 尽调要求
    rows:
      - - 工时限制
        - 正向
        - 当前
        - 与人类司机工时上限相比，自动驾驶可提高重复线路的利用率。
        - 要求提供转为无人驾驶前后的线路级利用率。
      - - 司机短缺
        - 正向
        - 当前
        - 难招人的区域网络会更优先成为自动化候选。
        - 按市场和客户验证真实劳动力缺口。
      - - 零售补货密度
        - 正向
        - 当前
        - 固定收货窗口和门店日程让履约表现可量化。
        - 要求按车道提供客户 SLA 和准时数据。
      - - 托管服务偏好
        - 正向
        - 当前
        - 客户把自动驾驶当作货运运力而非软件采购时，采用速度可能更快。
        - 询问合同结构和续约条款。
      - - 车辆 / 传感器成本
        - 负向
        - 当前
        - 硬件很重的铺开方式限制小车队采用，也推迟回本。
        - 要求提供单车部署资本和传感器更新假设。
      - - EPA Phase 3 与车队更新压力
        - 混合
        - 2027+
        - 可支撑中型车替换周期，但会增加规划复杂度。
        - 询问 OEM 和客户车辆计划如何匹配排放规则。
      - - 责任和保险不确定性
        - 负向
        - 当前
        - 即使技术验证已经存在，也会放慢线路扩张。
        - 要求提供保险公司态度和事故责任分配框架。
      - - 审批碎片化和 AV 审查
        - 负向
        - 当前
        - 每条走廊可能都要分别完成州、地方和一线应急方的准备工作。
        - 要求按地域提供市场进入清单。
    notes: 若干约束来自监管和经济性，而不只是技术。因此，公开的自动驾驶里程证明本身还不能完全消除商业化风险。
