      - number: '4.2'
        title: 定价不透明与 GTM 经济性
        blocks:
          - type: paragraph
            body: >-
              Gatik
              的公开材料更多说明客户能得到什么，而不是客户要付多少钱。纳入证据的来源没有披露每英里价目表、每路线价格、标价、折扣做法或已实现贡献利润率。这让定价成为整份报告最重要的尽调缺口之一。即便如此，包装逻辑仍可见。Gatik
              看起来在企业合同下销售可问责路线运力，且往往带有多年期或照付不议特征。这和企业 SaaS 的商业动作很不一样，也不同于纯自动驾驶司机授权策略。买方不是寻找软件席位的
              CIO，而是寻求可靠货运执行的供应链或运输组织。


              这直接影响销售效率。GTM 动作几乎肯定是高接触、强运营定制，且按软件标准看很慢。2024 年商业化负责人入职本身就是信号：Gatik 明确表示希望安全扩大 ATaaS 业务，并为 Fortune 500
              客户部署纯货运运营，这意味着复杂扩张规划，而不是自助式增长。PepsiCo、Loblaw、Tyson 和 Kroger
              式部署需要网络设计、安全评审、利益相关方协调和路线加密，规模经济才会改善。因此，积压订单质量比好看的销售管线更重要。如果 Gatik
              的合同包含真实最低量和持久扩张，获客成本可以在大型路线项目上摊销。否则，公司仍可能背着一台极昂贵的企业销售和部署机器，却没有公开证据证明回本。今天，公开记录对这个故事前半段的支持明显强于后半段。
