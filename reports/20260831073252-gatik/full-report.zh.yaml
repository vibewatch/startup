      - number: '6.4'
        title: 扩张逻辑有吸引力，但集中度是真风险
        blocks:
          - type: paragraph
            body: >-
              客户拓展动作有吸引力，因为它能在现有账户内复利。一旦 Gatik 在一条走廊获得信任，同一客户就可以增加更多路线、更多门店、更多车辆、更多品类，并最终扩到更多地理区域。Loblaw、PepsiCo
              身上能看到这一点，更广泛地看，也体现在从早期固定路线零售商项目，转向更大型区域物流网络。这样的落地后扩张动态，可以让高触达商业推进动作变得值得。


              但同一模型也带来集中度风险。公开证据集中在少数超大型客户周围，Gatik 又没有披露客户级收入结构，也没有给出足够完整的客户名单，外部人士无法有把握地估计敞口。TechCrunch
              提到公司不愿披露所有客户，这一点在这里尤其重要。如果一两个企业账户占了签约量的大头，客户风险就可能直接传导到利用率、利润率和估值。承销视角因此要分开两件事：Gatik
              显然有很强的客户证明，但还没有披露足够信息，证明客户基础已经广泛多元化。
