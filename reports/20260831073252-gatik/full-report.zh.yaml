  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Gatik 的相关性
    rows:
      - - 中间里程 B2B 公路配送
        - 仓库、配送中心、仓储点和门店之间的重复货运
        - 消费者最后一公里投递和乘用自动驾驶
        - 零售商、杂货商、CPG 托运人、托管车队
        - Gatik 的核心目标类别。
      - - 区域零售补货
        - 门店补货、杂货、常温与冷链转运
        - 全国长途整车运输和包裹末端配送
        - 供应链和运输组织
        - 最匹配垂直领域，因为排班和收货窗口可控。
      - - 托管式自动驾驶货运运力
        - 车辆、远程运营、服务责任、线路管理
        - 独立按席位收费的软件预算
        - 运输和自有车队预算
        - 比纯软件授权更贴近 Gatik 的商业定位。
      - - 长途自动驾驶卡车运输
        - 重型半挂卡车的高速走廊自动驾驶
        - 密集、多站点的区域门店线路
        - 承运商、OEM 集成式 AV 技术栈
        - 这是重要邻近赛道，但不是 Gatik 当前最清晰的切入点。
      - - 现状替代方案
        - 人类驾驶的自有车队、专用承运商和区域货运网络
        - 其他 AV 产品作为主要替代
        - 既有物流预算
        - 成本和可靠性上，真正的替代基准是这一类。
      - - 排除的 AV 邻近领域
        - 无人出租车、施工 AV、矿区自动驾驶、通用 ADAS 收入
        - 非货运自动驾驶类别
        - 买方和经济性不同
        - 可作背景，但不是 Gatik 的直接市场收入。
    notes: 这张表有意把 Gatik 当前的市场边界，与本章其他位置使用的更宽泛自动驾驶卡车和整体卡车运输 TAM 区分开。
