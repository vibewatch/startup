  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、重叠与替代品边界
        blocks:
          - type: paragraph
            body: >-
              分析 Gatik 竞争时，最大的错误是把所有自动驾驶卡车公司都定义成同等直接竞争者。Gatik 实际出售的工作，是在受管理设施之间提供可靠的中段货运流转，尤其是零售、杂货和 CPG
              网络里，装载点、收货窗口和路线重复性都很关键。因此，格局比直接 AV 同行更宽，却又比泛化自动驾驶评论更分层。这个市场可拆成四组。第一组是直接的中段货运或服务运营商类比公司，Gatik
              的公开客户验证在这里最相关。第二组是 Aurora、Torc、Kodiak 和 Waabi 这类长途自动驾驶司机供应商，它们追求更宽的自动驾驶平台，车辆类别或运营设计域也常常不同。第三组是 Einride 和
              Outrider 这类相邻自动化供应商，能自动化重叠的物流流程，但产品形态并不完全对上 Gatik。第四组是现状替代品：自有车队、专属合同承运商，以及 Ryder、Penske、J.B. Hunt
              等物流既有企业。


              这种分层很重要，因为客户并不是抽象地购买“自动驾驶”。它们买的是运力、可靠性和运营问责。有些情况下，Gatik 在和另一套 AV 技术栈竞争；另一些情况下，它面对的是 3PL
              合同、租赁车队，或发货方现有自有车队打法。Waymo 从另一面说明了这一点：它仍是严肃的技术标杆和人才磁铁，但在这组证据里，公开可见足迹是网约车和 AV
              研究，而不是具名中段货运运营。因此，竞争边界必须围绕客户的物流任务来画，而不能只按技术品牌来画。
            claimRefs:
              - CP001
              - CP010
