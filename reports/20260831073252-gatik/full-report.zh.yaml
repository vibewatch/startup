            title: Arena 可能是整个技术栈里最被低估的一环
            body: 如果公开描述方向上准确，Arena 会把 Gatik 从一家软件不错的路线运营商，推向一家拥有可扩展验证引擎的公司。长期看，这件事对防御性的意义可能超过任何单一具名客户。
