  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁在购买 Gatik，以及他们雇它完成什么任务
        blocks:
          - type: paragraph
            body: >-
              Gatik 的客户数量看起来不宽，但质量很强。保留来源一致指向大型企业——有密集区域配送需求的零售商、杂货商和 CPG 运营商——而不是一大批中小托运人。这也正是这类产品应该吸引的对象。Gatik
              卖的不是自助式软件席位，而是在高要求供应链里承担货运责任。因此，买方看起来是运输、供应链或配送高管；用户则是客户的运营网络：履约中心、配送中心、仓储节点，以及需要高频、可重复补货的门店。


              细分证据也比一个简单的「零售」标签更丰富。Walmart 和 Kroger 证明了零售与杂货补货价值。Loblaw 显示，这套模式可以跑进加拿大最大的杂货和药房网络之一。PepsiCo 证明其适合大型 CPG
              自有车队环境。Tyson 展示了冷藏蛋白和工厂到仓储的工作流。合在一起，这些账户说明产品是按网络形态专业化，而不是绑定某一种商品。限制在透明度。旗舰客户可信，但 Gatik
              对完整客户名单、账户结构或客户收入集中度披露得远少于公开投资人想要的水平。
