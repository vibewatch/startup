      - number: '2.5'
        title: 市场对 Gatik 承销判断的含义
        blocks:
          - type: paragraph
            body: >-
              从估值角度看，最重要的结论不是卡车运输市场巨大，而是这个巨大市场里已经出现一个可商业化的楔子。Gatik 并不试图拿下所有货运支出，甚至也不是所有自动驾驶支出；它想统治的是一个可重复切片，在这里，中型车辆、L4
              自动驾驶、区域密度和托管服务问责可以对齐。按 2026 年收入看，这个楔子不大；但它可能比宏大的长途干线愿景更值得投资，因为客户已经可以把结果和交付频次、路线覆盖、门店或设施表现挂钩。


              未解决的问题是，这个楔子有多少能转化为持久定价和利润率，而不只是技术可信度。公开研究给出了预测、份额和方向性需求驱动，但没有给出 2026 年路线定价、每站经济性或客户层面 ROI 的可靠台账。同样，要缩小
              Gatik 在美国的精确 SAM，还需要私有路线密度、合同结构和逐市场运营数据。因此，投资人应把这个市场视为窄但真实、增长很快且扎根运营，同时也承认，相比标题式 TAM
              幻灯片暗示的空间，商业品类收入和实际回本仍远不够可见。
            claimRefs:
