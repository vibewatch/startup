  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景与建议立场
        blocks:
          - type: paragraph
            body: >-
              Gatik
              正是那类容易诱使投资人偷懒估值的公司。轮次大，客户可信，技术有真实商业验证，投资人名单也漂亮。这是好消息。坏消息是，关键数字——估值本身——没有披露。公开市场投资人因此无法锚定一个谈判后的市场出清价格；他们必须在看到投资条款清单前先决定什么区间合理。这要求罕见的纪律。


              只看公开信息，正确立场应是建设性但有条件。Gatik
              看起来是一家严肃公司，客户需求真实，商业证据也强于多数自动驾驶货运创业公司。但它仍是安全关键、依赖合作伙伴、资本密集的业务，利润率不透明，收入披露也不完整。这意味着投资逻辑可以很强，但可接受价格区间仍相对窄。换句话说，判断公司质量比判断价格更容易。
