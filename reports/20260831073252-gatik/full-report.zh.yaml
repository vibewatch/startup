      - number: '4.3'
        title: 成本结构与单位经济性逻辑
        blocks:
          - type: paragraph
            body: >-
              理解 Gatik 成本结构，最合理的方式是把它看成一家内嵌大量自动驾驶成本的货运服务企业。公开来源没有披露 Gatik 自己的损益表（P&L），因此最干净的可用类比是 Aurora 的 SEC 报告。Aurora
              文件显示，一家已启动商业化的 AV 货运公司，即使开始确认运输服务收入，仍会背负大额 R&D、SG&A
              和商业化成本。文件也列出了相关服务成本类别：自动驾驶系统硬件、卡车折旧和维护、保险、电信、场站成本和人员。这不能证明 Gatik 的精确成本组合与 Aurora 一致，但比假装 Gatik
              像纯软件或普通卡车经纪商更接近现实。


              也有理由认为，Gatik 的单位经济性故事可能比宽泛长途玩家改善更快。Gatik
              在重复区域路线运营，有些几乎昼夜不停，而人工司机仍受工时规则约束。如果路线密度高、路线恢复纪律强、公司能把卡车停机时间压低，就会产生可信的利用率优势。PepsiCo、Loblaw 和 Tyson
              都强化了一个判断：这项服务部署在频次和时点很重要的网络里，应有助于利用率和路线级吸收。但抵消项也存在。硬件和维护仍是真成本。Gatik
              卖的是货运结果，保险和理赔仍然重要。公司还必须承担普通承运商没有的商业化、安全、支持和政府关系职能。结论是一条可信但未验证的逻辑：密集路线上的贡献利润率可能变得有吸引力，但在部署资本和运营开销被更好吸收之前，近期毛利率不太可能像软件。
