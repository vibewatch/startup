  title: Texas and Ontario moved risk from gray zone to explicit permissioning
  body: That is good for serious operators and bad for anyone who assumes route expansion is purely a technical problem. Authorizations, pilot conditions, insurance, and incident reporting can now change the pace of growth directly.
  claimRefs:
  - CR002
  - CR004
  - CR005
  - CR034
- calloutType: strength
  title: Gatik’s public mitigation stack is unusually serious
  body: Diagnostics, a 700-plus-portfolio framework, TÜV review, a Safety Advisory Council, and first-responder programs are real mitigations, not just buzzwords.
  claimRefs:
  - CR015
  - CR021
  - CR031
- calloutType: risk
  title: Outcome transparency still lags process transparency
  body: Investors can inspect governance and intent more easily than reliability, cyber resilience, or incident-frequency outcomes. That gap matters most at larger fleet scale.
