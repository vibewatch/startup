company:
  name: Gatik
chapter:
  number: 7
  title: Risks
  summary: 'Gatik’s risk profile is meaningfully better than that of a speculative pre-commercial AV startup, but it is still high by normal industrial-software standards. The company faces tightening jurisdiction-specific rules in Texas and Ontario, evolving federal commercial-AV oversight, direct NHTSA crash-reporting exposure, and broad sector scrutiny whenever autonomous-vehicle incidents occur. Operational risk now centers on scaling a safety-critical freight service—reliability, uptime, incident response, and ODD discipline—rather than simply proving the core technology works once. Partner concentration is also structural: Isuzu, NVIDIA, regulators, and a small number of flagship customers all function as essential dependencies. Gatik has credible mitigations, especially on safety process and governance, but public evidence remains stronger on process than on independent outcome metrics, leaving high residual risk around scale execution.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal exposure is tightening, not disappearing
  body: >-
    The most important legal insight is that Gatik operates in a category where permissioning is becoming more explicit. Texas now has a real authorization regime for commercial automated-vehicle operations. Ontario has a formal pilot program with route approvals, insurance minimums, and incident reporting. Arizona remains relatively open, but still expects compliance with its statutes and federal rules. At the federal level, FMCSA is still working toward a framework for ADS-equipped commercial vehicles, USDOT continues to emphasize regulatory modernization, and NHTSA’s crash-reporting order creates direct enforcement exposure. This combination means Gatik’s regulatory risk is dynamic: the company can be compliant today and face materially stricter expectations tomorrow, especially after a widely publicized incident.


    NTSB’s materials reinforce the point. They suggest that public-road AV testing still lacks uniform federal safety risk-management requirements and that voluntary safety self-assessments have limited benefit. So the legal risk is not hypothetical. The framework is still being written while Gatik is already operating. That can be a strategic advantage for an early mover, but it also means the company is helping discover the boundaries of future enforcement.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
