  evidenceGaps:
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: No public route-level incident history, intervention data, uptime data, or regulator-filed event summaries for Gatik’s live fleet.
    whyItMatters: Without incident and reliability outcomes, risk remains underwritten from process artifacts rather than service-level performance.
    diligencePath: Request incident log, downtime metrics, intervention records, and any regulator submissions by market.
    relatedQuestionRefs:
    - QR006
    - QR011
    - QR023
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: insurance-economics
    missingEvidence: Public sources describe insurance requirements but not premiums, deductibles, claims history, exclusions, or reserve burden.
    whyItMatters: Insurance can become a major margin and scaling constraint after even minor adverse experience.
    diligencePath: Review policies, broker commentary, claims history, and loss-development assumptions.
    relatedQuestionRefs:
    - QR004
    - QR018
    - QR023
    relatedTableRefs:
