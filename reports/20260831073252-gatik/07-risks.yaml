  - - Ontario ACMV pilot-program compliance
    - Ontario
    - active pilot 2025-2035
    - medium
    - high
    - Approved testing approach, route approvals, signage, insurance, 24-hour incident notification
    - Program changes or incident findings could constrain Canadian expansion
    - Request pilot approval package, conditions, and communications with MTO.
  - - NHTSA crash-reporting and defect-investigation exposure
    - United States
    - active federal oversight
    - medium-high
    - high
    - Crash telemetry, reporting processes, safety-case documentation
    - Reportable incidents can create penalties, investigations, and negative publicity
    - Request incident-reporting SOPs, telemetry readiness, and any filed reports.
  - - FMCSA federal-rule evolution for ADS-equipped CMVs
    - United States
    - framework still evolving
    - medium
    - medium-high
    - Policy engagement, compliance function, operational documentation
    - Future rules could add equipment, staffing, or operating constraints
    - Track FMCSA notices and compare planned ops with likely rule directions.
  - - Liability / litigation after a safety event
    - U.S. and Canada
    - latent / event-driven
    - low-frequency high-impact
    - high
    - Insurance, safety governance, route discipline, first-responder plans
    - One severe event can create outsized legal and valuation damage
    - Request insurance tower, exclusions, claims history, and litigation preparedness.
  notes: Rows are ranked by practical severity to current operations rather than by abstract legal complexity.
