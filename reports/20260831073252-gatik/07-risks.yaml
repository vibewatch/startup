  figureRefs:
  - FR002
- id: partner-and-dependency-risk
  title: Scale is gated by partners and permissions
  body: >-
    Gatik’s dependency graph is unusually legible. Isuzu is the key vehicle-platform and industrialization partner. NVIDIA is the key in-vehicle compute and software-stack partner. State and provincial authorities determine whether routes can launch and continue. Flagship customers provide both revenue and the repeated-route density that makes structured autonomy attractive in the first place. None of these are optional. As a result, partner risk is not a side issue—it is the operating model.


    This makes the company more understandable but also more brittle. A delay in production-ready vehicles, a change in platform roadmap, an authorization issue in a core geography, or a slowdown in one major customer can all transmit into operations, utilization, and fundraising optics. The practical question for diligence is whether Gatik has enough contractual protection and contingency planning around its most critical dependencies. The public record does not answer that cleanly.
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR027
  - CR035
