- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Safety incident risk
    - Reportable crash or injury event
    - Any public incident triggering NHTSA/TxDMV/MTO escalation
    - Pause underwriting until root cause, regulator response, and customer impact are clear.
  - - Authorization risk
    - Restriction, suspension, or delayed approval
    - Loss or material limitation of Texas or Ontario operating permissions
    - Mark thesis impaired because route scale depends on jurisdictional continuity.
  - - Industrialization risk
    - Isuzu or NVIDIA timeline slippage
    - Meaningful delay to production-ready truck roadmap beyond 2027 plan
    - Reduce scale assumptions and valuation multiple tolerance.
  - - Customer concentration risk
    - Flagship account slowdown
    - Public rollback, non-renewal, or materially slower expansion from a top account
    - Rework revenue and utilization assumptions; test downside runway.
  - - Capital-intensity risk
    - Funding at weak terms or rising insurance burden
    - Down round, punitive structure, or unexpectedly high insurance costs
    - Require stronger evidence of unit economics before new capital.
  - - Execution risk
    - Ops growth outpaces process maturity
    - Service reliability slips while fleet count or geographies expand
    - Treat as early warning that commercial scale is outrunning controls.
  notes: Kill criteria are written for investors, not operators; they specify when diligence should stop, reset, or reprice.
