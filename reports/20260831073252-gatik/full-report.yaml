            body: >-
              Gatik’s dependency graph is unusually legible. Isuzu is the key vehicle-platform and industrialization
              partner. NVIDIA is the key in-vehicle compute and software-stack partner. State and provincial authorities
              determine whether routes can launch and continue. Flagship customers provide both revenue and the
