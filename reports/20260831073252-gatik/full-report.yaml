      - number: '7.2'
        title: Operational risk centers on reliability, safety events, and proof quality
        blocks:
          - type: paragraph
            body: >-
              Gatik has better public mitigation infrastructure than many private autonomy companies, but that does not
              eliminate operational fragility. The company is now claiming sustained commercial driverless freight
              service across multiple states, nearly around the clock, including refrigerated and frozen goods. That
              creates classic operational exposure: uptime, maintenance, incident response, safety-driver transitions,
              edge-case handling, false-positive diagnostics, and customer recovery when something goes wrong. Public
              materials strongly suggest that Gatik takes these problems seriously. The five safety pillars, diagnostics
              system, 700-plus-portfolio framework, TÜV review, Safety Advisory Council, and first-responder function
              all matter.


              The remaining issue is evidence quality. Most mitigation proof is process-level and company-authored.
              Public outcome metrics remain thin. That means investors can see that Gatik has built a serious
              safety-management apparatus, but cannot yet fully test whether it will hold under larger-scale stress. In
              other words, the main operational risk is no longer “do they care about safety?” It is “will the safety
              and reliability system scale as fast as the deployment ambition?”
