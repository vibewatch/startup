chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, and current scale narrative
        blocks:
          - type: paragraph
            body: >-
              Gatik positions itself as an autonomous freight company rather than a pure autonomy software lab. Across
              its homepage, January 2026 driverless-scale release, and August 2026 financing materials, the company
              describes the product as driverless middle-mile freight service using box trucks that shuttle goods
              between distribution centers, warehouses, and stores on high-frequency regional routes. That framing
              matters because it distinguishes Gatik from long-haul autonomous-truck developers that still center on
              Class 8 highway autonomy. The company’s use case is narrower but also more operationally structured:
              dense, repetitive retail and CPG networks where route predictability, service-level reliability, and store
              replenishment frequency all matter more than coast-to-coast range.


              Public location language shifted over time. Older 2024-2025 Gatik releases used Mountain View datelines,
              while the August 2026 Series D materials and contemporaneous press coverage described the business as
              Santa Clara-based. The shift does not appear to imply a new geography outside Silicon Valley, but it does
              show that even basic profile fields require date anchoring. The company’s 2026 scale narrative is clearer:
              Gatik says it runs driverless trucks daily across Texas, Arizona, Arkansas, and Canada, with broader
              organizational footprint signals in Nebraska, Ontario, Michigan, and Iowa. TechCrunch also reported that
              the company’s operations had moved from a few pilot programs into commercial driverless service across
              several cities, reinforcing the claim that Gatik now operates a revenue-generating network rather than a
              single showcase lane.
