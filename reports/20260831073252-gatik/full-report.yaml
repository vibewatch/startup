  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current financing context and recommendation stance
        blocks:
          - type: paragraph
            body: >-
              Gatik is exactly the kind of company that can tempt investors into lazy valuation thinking. The round is
              large, the customers are credible, the technology has live commercial proof, and the investor list is
              impressive. That is the good news. The bad news is that the key number—the valuation itself—was not
              disclosed. Public investors therefore cannot anchor on a negotiated market-clearing price; they have to
              decide what range would make sense before seeing the term sheet. That forces unusual discipline.


              The right public-only stance is constructive but conditional. Gatik looks like a serious company with real
              customer demand and better commercial evidence than most autonomous-freight startups. But it is still a
              safety-critical, partner-dependent, capital-intensive business with opaque margins and incomplete revenue
              disclosure. That means the investment case can be strong while the acceptable price range remains
              relatively narrow. Put differently, the company-quality answer is easier than the pricing answer.
