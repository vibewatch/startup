  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Gatik’s highest residual risks sit at the intersection of regulatory dependence, partner concentration, and
      safety-critical service execution.
    data:
      columns:
        - likelihood
        - impact
        - mitigation maturity
        - residual severity
      rows:
        - label: Safety incident / ODD overrun
          values:
            - label: medium
