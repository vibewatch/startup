  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who buys Gatik and what jobs they hire it to do
        blocks:
          - type: paragraph
            body: >-
              Gatik’s customer base looks narrow by count but strong by quality. The retained source set consistently
              points to very large enterprises—retailers, grocers, and CPG operators with dense regional distribution
              needs—rather than to a broad base of small or mid-sized shippers. That is exactly what the product should
              attract. Gatik is not selling a self-serve software seat; it is taking responsibility for moving freight
              inside demanding supply chains. The buyer therefore appears to be a transportation, supply-chain, or
              distribution executive. The user is the customer’s operating network: fulfillment centers, distribution
              centers, storage nodes, and stores that need frequent, repeatable replenishment.


              The segmentation evidence is also richer than a simple “retail” label suggests. Walmart and Kroger prove
              retailer and grocery replenishment value. Loblaw shows the model works inside one of Canada’s largest
              grocery and pharmacy networks. PepsiCo proves fit for a large CPG private-fleet environment. Tyson
              demonstrates refrigerated protein and plant-to-storage workflows. Together, those accounts show the
              product is specialized by network shape, not by one single commodity. The limitation is transparency.
              While the flagship logos are credible, Gatik discloses far less about the full roster, account mix, or
              customer revenue concentration than a public investor would want.
