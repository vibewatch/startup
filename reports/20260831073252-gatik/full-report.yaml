        - Long-haul AV-driver platform
        - Customer freight hauled today; broad fleet-integration narrative
        - Carrier and fleet highway freight
        - Driverless-freight positioning with 24/7 utilization promise
        - Less obviously tailored to Gatik’s store-replenishment workflow.
