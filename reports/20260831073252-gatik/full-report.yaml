        title: People, execution, and financial-model risks compound
        blocks:
          - type: paragraph
            body: >-
              Scaling an AV freight business requires multiple institutions to mature at once: software development,
              fleet operations, commercialization, regulatory affairs, safety governance, and capital allocation. Gatik
              appears aware of that problem. The company has added leadership in commercialization, finance, legal, and
              first-responder engagement, and its hiring posture suggests continued demand for specialized talent. Those
              steps mitigate risk meaningfully because they reduce the chance that the company remains founder-centric
              while trying to scale.


              But the public financial model is still only partly knowable. Contracted revenue does not equal recognized
              revenue, and fresh funding does not prove efficient unit economics. If customer concentration is
              meaningful and fleet growth remains capital intensive, execution errors can amplify quickly. A company can
              be commercially real and still hit a financing wall if authorization, customer scale-up, and asset
