      - number: '2.5'
        title: What the market means for underwriting Gatik
        blocks:
          - type: paragraph
            body: >-
              For valuation purposes, the most important conclusion is not that trucking is a gigantic market. It is
              that a commercially usable wedge already appears to exist inside that giant market. Gatik is not trying to
              capture all freight spend or even all autonomy spend; it is trying to dominate a repeatable slice where
              medium-duty vehicles, L4 autonomy, regional density, and managed-service accountability line up. That
              wedge looks small on a 2026 revenue basis, but it may be far more investable than the much larger
              long-haul vision because customers can already tie outcomes to delivery frequency, route coverage, and
              store or facility performance.


              The unresolved issue is how much of that wedge converts into durable pricing and margin rather than simply
              technical credibility. Public research gives forecasts, shares, and directional demand drivers, but it
              does not give a reliable ledger for 2026 route pricing, per-stop economics, or customer-level ROI.
              Likewise, narrowing Gatik’s exact U.S. SAM still requires private route density, contract structure, and
              market-by-market operational data. Investors should therefore treat the market as narrow-but-real, rapidly
              growing, and operationally grounded, while still acknowledging that commercial category revenue and
              realized payback remain much less observable than the headline TAM slides imply.
            claimRefs:
              - CM014
              - CM018
              - CM019
              - CM031
              - CM038
              - CM044
              - CM045
