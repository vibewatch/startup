      - number: '4.3'
        title: Cost structure and unit-economics logic
        blocks:
          - type: paragraph
            body: >-
              The most reasonable way to think about Gatik’s cost structure is as a freight-service business with
              substantial embedded autonomy cost. Public sources do not disclose Gatik’s own P&L, so the cleanest
              available analog is Aurora’s SEC reporting. Aurora’s filings show a post-launch AV-freight company that
              still carries large R&D, SG&A, and commercialization costs even after starting to recognize
              transportation-service revenue. They also show the relevant service-cost categories: autonomous-system
              hardware, truck depreciation and maintenance, insurance, telecommunications, terminal costs, and
              personnel. That is not proof that Gatik’s exact mix matches Aurora’s, but it is a better model than
              pretending Gatik looks like pure software or like a generic truck broker.


              There are also reasons to think Gatik’s unit-economics story could improve faster than a broad long-haul
              player’s. Gatik’s operations run on repeated regional routes, some nearly around the clock, while human
              drivers remain constrained by hours-of-service rules. That creates a plausible utilization advantage if
              route density is high, route recovery is disciplined, and the company can keep truck downtime low.
              PepsiCo, Loblaw, and Tyson all reinforce the idea that the service is being deployed in networks where
              frequency and timing matter, which should help utilization and route-level absorption. But there are
              offsetting burdens. Hardware and maintenance remain real. Insurance and claims still matter because Gatik
              is selling freight outcomes. And the company must carry commercialization, safety, support, and
              government-relations functions that a normal carrier does not. The result is a credible but unproven
              thesis: contribution margins could become attractive on dense routes, but near-term gross margins are
              unlikely to resemble software until deployment capital and operational overhead are better absorbed.
