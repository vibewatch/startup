      - number: '3.2'
        title: Competitor profiles and capability overlap
        blocks:
          - type: paragraph
            body: >-
              Gatik’s direct differentiation shows up most clearly when each competitor is described in terms of route
              scope, customer promise, and commercial packaging rather than in terms of raw AI claims. Aurora markets a
              self-driving freight system that drops into existing fleet operations and emphasizes 24/7 utilization,
              which makes it a strong competitor for broad freight corridors but not the same product as a tightly
              managed medium-duty store-replenishment network. Torc follows a similarly broad freight logic but with
              heavier OEM integration through Freightliner and Daimler. Kodiak presents itself as a multi-environment
              autonomy platform spanning trucking, industrial, and defense applications, which suggests breadth and
              optionality but less visible focus on Gatik’s exact retail middle-mile workflow. Waabi’s ambition is
              broader still: one Physical AI platform for both trucks and robotaxis, paired with significant capital and
              Volvo Autonomous Solutions partnership signaling.


              By contrast, Einride and Outrider show why adjacency matters. Einride bundles autonomy with electric
              freight operations, software, and supervised service, which overlaps with Gatik on commercial
              accountability even if the product mix is different. Outrider automates yard operations and can capture
              logistics-automation budget without replacing the road leg itself. On the non-autonomous side, Ryder,
              Penske, and J.B. Hunt bring something Gatik cannot yet match: enormous service scale, dense maintenance
              and logistics networks, and trusted procurement relationships. Public customer proof from PepsiCo, Loblaw,
              Tyson, and Kroger still gives Gatik a meaningful edge in its chosen wedge, but that edge is contextual
              rather than universal.
