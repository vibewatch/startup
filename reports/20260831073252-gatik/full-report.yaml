  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, overlap, and substitute boundary
        blocks:
          - type: paragraph
            body: >-
              The biggest competitive mistake with Gatik is to define every self-driving truck company as equally direct
              competition. The job Gatik is actually selling is reliable middle-mile freight movement between managed
              facilities, especially in retail, grocery, and CPG networks where loading points, receiving windows, and
              route repetition matter. That makes the landscape broader than direct AV peers but more segmented than
              generic autonomy commentary suggests. The field breaks into four groups. First are direct middle-mile or
              service-operator analogs, where Gatik’s public customer proof is most relevant. Second are long-haul
              AV-driver providers such as Aurora, Torc, Kodiak, and Waabi, which pursue broader autonomy platforms and
              often different vehicle classes or operating domains. Third are adjacent automation vendors such as
              Einride and Outrider that automate overlapping logistics workflows without matching Gatik’s exact product
              shape. Fourth are the status-quo substitutes: private fleets, dedicated contract carriers, and logistics
              incumbents like Ryder, Penske, and J.B. Hunt.


              That segmentation matters because customers do not buy “autonomy” in the abstract. They buy capacity,
              reliability, and operational accountability. In some cases that means Gatik is competing against another
              AV stack; in others it is competing against a 3PL contract, a leased fleet, or a shipper’s existing
              private-fleet playbook. Waymo illustrates the point from the other side: it remains a serious technology
              benchmark and talent magnet, but its visible public footprint in this evidence set is ride-hail and AV
              research rather than named middle-mile freight operations. So the competitive boundary has to be drawn
              around the customer’s logistics job, not around technical branding alone.
            claimRefs:
              - CP001
              - CP010
              - CP014
              - CP018
              - CP019
              - CP041
          - type: table
            tableRef: TP001
            claimRefs:
