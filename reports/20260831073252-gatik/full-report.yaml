            body: >-
              Gatik’s public customer story is much stronger on qualitative durability than on standardized retention
              metrics. There is no public NRR, GRR, churn, logo-retention, cohort-satisfaction, or renewal disclosure.
              That is a real gap. However, the named accounts that are visible show signs of continuity over multi-year
              periods. Walmart goes back to the launch-era relationship and later driverless operations. Loblaw
              progressed from Canada’s first driverless deployment to a multi-year 50-truck plan. PepsiCo’s 2026
              partnership explicitly builds on earlier operating experience. Tyson appears again in 2026 coverage after
              its 2023 launch. This is not a substitute for cohort data, but it is still meaningful evidence that
              Gatik’s flagship relationships are not vanishing after a photo-op.


              The best way to interpret the evidence is that Gatik likely has real account stickiness where the route
              economics and operating model fit, but outsiders cannot yet quantify that stickiness. Investors should
              therefore treat durability as supported but under-measured.
