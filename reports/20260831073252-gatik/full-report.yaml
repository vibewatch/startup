      - number: '2.2'
        title: TAM, SAM, and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The broadest TAM anchor remains the overall U.S. trucking economy. ATA estimates that trucks moved 72.7%
              of national freight by weight in 2024 and generated $906 billion in gross freight revenue. That headline
              is useful because it shows how large the logistics substrate is, but it dramatically overstates the
              near-term opportunity for a company like Gatik. The better interpretation is a ladder of progressively
              narrower lenses. At the broad end, Mordor estimates the overall autonomous truck market at $42.63 billion
              in 2026 and $74.23 billion by 2031. That figure includes a much wider set of truck classes, autonomy
              tiers, and regional applications.


              For Gatik, the more relevant lens is FMI’s middle-mile autonomous delivery category, sized at $490 million
              in 2026 and projected to reach $14.173 billion by 2036. Within that narrower segment, FMI says L4 box
              trucks lead with 44% share, retail store replenishment leads with 38% share, and transport-as-a-service
              leads the business-model mix at 46% share. Mordor’s broader market still matters because it shows that
              North America is the largest current commercialization arena and that medium-duty and Level 4
              configurations are among the fastest-growing subsegments. But the coexistence of a $490 million current
              niche estimate and a $42.63 billion broader AV-truck estimate is precisely why investors should preserve
              contradictory sizing lenses rather than force them into one false precision number.
