  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Serious safety event
        - Public injury event, major regulator inquiry, or sustained route pause
        - Turns commercialization proof into trust deficit
        - Pause or pass until root cause and exposure are clear.
      - - Customer concentration shock
        - Flagship customer rollback or non-renewal
        - Cuts growth, proof quality, and utilization assumptions simultaneously
        - Rebuild the model from the bear case.
      - - Industrialization delay
        - Meaningful slip to production-ready truck roadmap or scaling program
        - Pushes out revenue conversion and keeps capex burden high
        - Lower valuation range and require stronger terms.
      - - Financing weakness
        - New capital at materially weaker terms or unexpectedly urgent raise
        - Signals economics and confidence are weaker than hoped
        - Avoid marking to optimistic scenario ranges.
      - - Economic opacity persists
        - No meaningful margin or recognized-revenue disclosure despite more capital
        - Prevents migration to public-market-quality underwriting
        - Treat rich pricing as unjustified.
      - - Regulatory friction
        - Loss, restriction, or delay in core operating jurisdiction
        - Reduces probability-weighted scale outcome
        - Move to a wait-or-pass stance immediately.
    notes: Triggers are designed as decision rules for investment committees rather than company operating milestones.
    claimRefs:
      - CV030
      - CV032
      - CV037
      - CV038
      - CV041
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Recognized revenue and backlog conversion
        - Annualized recognized revenue, backlog burn-down, and revenue timing
        - Determines whether backlog is converting into real value on schedule
        - Request finance-room revenue bridge and cohort history.
      - - Mature-route contribution margin
        - Route-level economics after stabilization
        - Separates scalable service from expensive proof-of-concept operations
        - Request mature vs ramping route P&Ls.
      - - Customer concentration
        - Top-account revenue, contracted volume, and renewal exposure
        - A few logos could dominate the business more than public sources reveal
        - Request top-1, top-3, and top-5 concentration tables.
      - - Insurance and claims burden
        - Premiums, deductibles, exclusions, and incident-cost history
        - Insurance can erase equity upside in safety-critical logistics models
        - Review carrier tower, claims logs, and broker commentary.
      - - Partner-contract durability
        - Isuzu/NVIDIA terms, contingencies, and fallbacks
        - Single-partner fragility can sharply reduce the bull-case probability
        - Review commercial agreements and contingency plans.
      - - Capital plan to scale
        - Fleet-financing needs, cash runway, and next-round assumptions
        - Thousands-of-trucks ambition may require more capital than backlog implies
        - Request board plan and financing model under base and bear cases.
    notes: These asks are the minimum set needed to convert the public-only valuation view into a priced investment decision.
    claimRefs:
      - CV020
      - CV032
      - CV038
