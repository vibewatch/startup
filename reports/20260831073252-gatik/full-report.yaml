      - number: '8.3'
        title: Public-only valuation ranges and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Because precise financial inputs are missing, scenario work is more defensible than single-point
              valuation. The base case assumes Gatik continues to expand with PepsiCo and Loblaw-style proof, keeps
              safety and regulatory performance intact, and advances industrialization without proving public
              route-level margins yet. That supports a low-to-mid $2 billion range. The bull case requires much more:
              strong backlog conversion, fast fleet scaling, clear customer diversification, and evidence that the
              service economics improve meaningfully at density. The bear case does not require disaster. It only
              requires one of the common AV-freight failure modes: slower scale-up, regulatory friction, customer
              pullback, or capital intensity overwhelming confidence.


              The practical implication is that price matters enormously. Public evidence can support investing in
              Gatik. It cannot support investing at any price. That is why entry discipline belongs at the center of the
              recommendation rather than in the footnotes.
