  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: A safety or authorization problem can travel rapidly through customer confidence, capital access, and valuation.
    data:
      nodes:
        - id: incident
          label: Safety / operational incident
          detail: Crash, ODD exceedance, or reliability failure
        - id: regulators
          label: Regulatory response
          detail: Reporting, investigation, route restrictions, or approval delays
        - id: customers
          label: Customer confidence
          detail: Expansion slows, procurement tightens, or accounts pause
        - id: economics
          label: Economics and insurance
          detail: Utilization drops, support cost rises, insurance tightens
        - id: capital
          label: Capital market narrative
          detail: Financing becomes harder or more dilutive
        - id: valuation
          label: Valuation compression
          detail: Lower probability-weighted scale and weaker exit confidence
      edges:
        - from: incident
          to: regulators
          label: mandatory reporting / review
        - from: incident
          to: customers
          label: trust shock
        - from: regulators
          to: customers
          label: deployment friction
        - from: customers
          to: economics
          label: lower utilization
        - from: economics
          to: capital
          label: worse financing optics
        - from: capital
          to: valuation
          label: repricing
        - from: regulators
          to: valuation
          label: probability of scale falls
    approximationNotes: >-
      The DAG focuses on causal transmission relevant to investors rather than on detailed incident-management
      procedures.
    claimRefs:
      - CR013
      - CR017
      - CR026
      - CR027
      - CR028
      - CR037
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Gatik’s scale ambition depends on synchronized performance from OEM, compute, regulators, customers, and internal
      safety functions.
    data:
      nodes:
        - id: isuzu
          label: Isuzu
          detail: Vehicle platform and manufacturing path
        - id: nvidia
          label: NVIDIA
          detail: Compute, OS, and safety-stack dependency
        - id: regulatory
          label: Texas / Ontario / Arizona
          detail: Authorization and pilot continuity
        - id: customers
          label: Flagship customers
          detail: Route density, proof, and expansions
        - id: safety
          label: Internal safety system
          detail: Diagnostics, FRIP, council, safety framework
        - id: scale
          label: Scaled driverless freight
          detail: Revenue, utilization, and valuation upside
      edges:
        - from: isuzu
          to: scale
          label: industrialization
        - from: nvidia
          to: scale
          label: compute stack
        - from: regulatory
          to: scale
          label: permissioning
        - from: customers
          to: scale
          label: demand density
        - from: safety
          to: scale
          label: trust / reliability
        - from: safety
          to: regulatory
          label: evidence for approvals
        - from: safety
          to: customers
          label: service confidence
    approximationNotes: Dependencies are modeled as gating conditions to scale rather than as ownership relationships.
    claimRefs:
      - CR015
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR035
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from strong commercial proof through pricing opacity and residual risk, not from
      skepticism about whether Gatik is real.
    data:
      nodes:
        - id: proof
          label: Commercial proof
          detail: Backlog, driverless orders, named customers, and investor quality
          type: input
        - id: quality
          label: Company quality
          detail: Focused ODD, customer expansion, and live operations improve credibility
          type: process
        - id: opacity
          label: Pricing and financial opacity
          detail: Valuation undisclosed; recognized revenue and margins still not public
          type: process
        - id: risk
          label: Residual risk burden
          detail: Safety, concentration, partner, and capital intensity remain high
          type: process
        - id: decision
          label: Conditional recommendation
          detail: Proceed only with valuation discipline and confirmatory diligence
          type: output
      edges:
        - from: proof
          to: quality
          label: supports
        - from: quality
          to: opacity
          label: but does not remove
        - from: opacity
          to: risk
          label: amplifies
        - from: risk
          to: decision
          label: requires discipline
    approximationNotes: >-
      This flow is analytic rather than factual chronology; it explains how the investment conclusion is derived from
      the public record.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV032
      - CV043
