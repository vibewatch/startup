              - CV027
              - CV031
              - CV032
      - number: '8.4'
        title: Exit readiness and the last questions that decide price
        blocks:
          - type: paragraph
            body: >-
              Gatik is not yet an IPO-ready underwriting story from public evidence alone. It may become one, but only
              if it converts backlog and operational milestones into audited financial performance, better customer
              disclosure, and a cleaner safety narrative for public markets. A strategic outcome is plausible,
              especially if OEMs, logistics incumbents, or autonomy platforms want commercial middle-mile exposure, but
              no obvious buyer is visible in the public record today.


              That leaves one sensible conclusion: price the company only after resolving the questions that matter
              most. Revenue recognition, contribution margin, concentration, insurance economics, partner terms, and
              capitalization needs will decide whether Gatik is a disciplined buy or simply a compelling story. Until
              then, the valuation work should be treated as bounded judgment rather than precision engineering.
              Investors should assume that better private data can move the range materially in either direction.
            claimRefs:
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
          - type: table
            tableRef: TV006
            claimRefs:
              - CV020
              - CV032
              - CV038
              - CV041
              - CV043
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a real company, not a concept-stock in disguise
            body: >-
              The core valuation support comes from genuine commercial proof—backlog, named customers, driverless
              orders, and live operations—not just from a broad autonomy narrative.
            calloutType: strength
            claimRefs:
              - CV003
              - CV004
              - CV022
          - type: callout
            title: The undisclosed price is the center of gravity
            body: >-
              Because the round valuation was not disclosed, investors must set their acceptable range first. That makes
              discipline more important than enthusiasm.
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV032
              - CV043
          - type: callout
            title: Failed AV-trucking precedents still matter
            body: >-
              Embark and TuSimple show how quickly valuation can unravel when capital, safety, commercialization, or
              governance drift apart. Gatik looks better, but it is not exempt from the lesson.
            calloutType: risk
            claimRefs:
              - CV019
              - CV020
              - CV021
          - type: callout
            title: Constructive, but only at the right price
            body: >-
              The public record supports a conditional yes: attractive at disciplined entry, structure-dependent in the
              mid-range, and too thin to support a rich premium above roughly $3B without private-data upside.
            calloutType: recommendation
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
