      - number: '2.4'
        title: Growth drivers, constraints, and route economics
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers are labor pressure, route economics, and the ability to increase
              utilization without changing the underlying logistics job. FMCSA and BLS show why this matters: human
              drivers remain constrained by 11-hour driving caps, 14-hour work windows, and 60 or 70 hour weekly limits.
              In a market with 3.58 million drivers and persistent hiring friction, structured autonomy offers a way to
              add dependable regional capacity without depending entirely on marginal labor availability. Gatik’s own
              customer materials repeatedly stress this capacity and reliability logic rather than only labor
              elimination. PepsiCo talks about resilience and customer service, Loblaw about frequency and
              responsiveness, Tyson about a more flexible network, and Gatik about nearly 24-hour operations across
              highways and surface streets.


              The constraints are equally real. Vehicle and sensor costs remain meaningful, especially in a market where
              FMI still assigns more than half the component mix to vehicles and where rollout plans emphasize
              next-generation sensor suites. EPA’s Phase 3 regime adds powertrain and compliance pressure from model
              year 2027 onward, which can help structured medium-duty deployment but also complicates fleet-refresh
              decisions. Most importantly, liability, insurance, and route approval remain unresolved. NHTSA explicitly
              says those questions are still open before ADS maturity, while broader AV scrutiny means a high-profile
              incident elsewhere in autonomy can spill over into freight even when the routes are more constrained and
              commercially rational.
            claimRefs:
