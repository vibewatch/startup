      - number: '6.4'
        title: Expansion logic is attractive, but concentration is a real risk
        blocks:
          - type: paragraph
            body: >-
              The customer motion appears attractive because it compounds inside existing accounts. Once Gatik is
              trusted on one corridor, the same customer can add more routes, more stores, more vehicles, more product
              classes, and eventually more geographies. That is visible in Loblaw, PepsiCo, and likely in the broader
              shift from early fixed-route retailer work toward larger regional logistics networks. This kind of
              land-and-expand dynamic can make a high-touch go-to-market motion worthwhile.


              But the same model creates concentration risk. The public evidence clusters around a handful of very large
              logos, and Gatik does not reveal customer-level revenue mix or enough of the broader roster to let
              outsiders estimate exposure with confidence. TechCrunch’s note that the company would not name all
              customers is especially relevant here. If one or two enterprise accounts make up a large share of booked
              volume, customer risk could transmit directly into utilization, margins, and valuation. The underwriting
              view should therefore separate two ideas: Gatik clearly has strong customer proof, but it has not yet
              provided enough disclosure to prove that the customer base is broadly diversified.
