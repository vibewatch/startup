    rows:
      - - Gatik
        - Direct middle-mile autonomy
        - 85k+ fully driverless orders; $200M Series D; $600M+ contracted revenue claims
        - Retail, grocery, CPG regional freight
        - Commercial proof on medium-duty middle-mile with named shippers
