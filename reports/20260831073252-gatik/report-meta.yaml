companyProfile:
  summary: Gatik is a Santa Clara-based autonomous freight company founded in 2017 that focuses on middle-mile logistics between distribution centers, warehouses, and stores. Its product couples the Gatik Driver autonomy stack with medium-duty trucks, route operations, and a safety and simulation system tuned for repeated regional freight workflows. The company has emerged as one of the most commercially credible autonomous-trucking startups by focusing on constrained, revenue-generating box-truck routes rather than long-haul semis or passenger robotaxis.
