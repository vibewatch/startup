  topStrengths:
    - Gatik has real commercial traction with $600M+ contracted revenue, 85,000+ driverless deliveries, and flagship customers such as PepsiCo and Loblaw.
    - The company’s constrained middle-mile strategy makes commercialization more credible than broader AV approaches that have not yet proven repeatable freight deployments.
    - Public safety, simulation, and industrialization disclosures are unusually detailed for a private autonomous-vehicle company.
  topRisks:
    - The Series D valuation and terms were not disclosed, while recognized revenue, gross margin, and route-level contribution economics remain private.
    - Gatik remains highly dependent on a small number of flagship customers, regulators, and partners such as Isuzu and NVIDIA.
    - Safety, regulatory, and operational execution risk stays high as the company tries to scale from dozens of trucks toward hundreds and eventually thousands.
  unresolvedGaps:
    - The actual Series D post-money valuation, liquidation preferences, and downside protections are not public.
    - Recognized revenue, mature-route contribution margin, and insurance burden remain undisclosed.
    - Customer concentration, renewal dynamics, and partner-contract durability still require private diligence.
