- id: dependencies-roadmap-and-verdict
  title: Dependencies, roadmap, and 2026 product verdict
  body: >-
    The product is commercially real, but it is dependent on a narrow set of scaling enablers. NVIDIA provides the in-vehicle compute and safety-oriented systems context through DRIVE AGX, DriveOS, DRIVE Thor, and the Halos program. Isuzu provides the medium-duty vehicle base and the path to production-ready industrialization. Regulators, first responders, and local stakeholders help turn a technically validated system into a deployable route. Customers provide the dense networks and repetitive use cases that make structured autonomy viable in the first place. Put differently, Gatik’s product is only as scalable as its dependency graph is durable.


    The roadmap makes that dependency picture concrete. Public sources show a progression from 2019 commercial launch, to the 2021 Bentonville driverless milestone, to the 2022 Canada deployment, to 2024 safety-framework and first-responder buildout, to 2025 NVIDIA and Arena simulation milestones, and onward to a 2027 production target. That sequence supports a strong 2026 verdict: Gatik looks technologically mature inside a constrained and increasingly dynamic middle-mile ODD, with credible industrialization plans and unusually explicit safety-process disclosure. The unresolved questions are about scaling depth, not basic capability. Specifically, investors still need better evidence on component-level architecture, reliability metrics, cybersecurity outcomes, and whether the production-ready path truly converts commercial proof into a repeatable truck program at high volume.
