callouts:
- calloutType: strength
  title: Arena may be the most underappreciated part of the stack
  body: If the public description is directionally accurate, Arena turns Gatik from a route operator with good software into a company with a scalable validation engine. That could matter more for long-term defensibility than any single customer logo.
  claimRefs:
  - CE016
  - CE017
  - CE018
  - CE019
- calloutType: strength
  title: Trust is instrumented as part of the product
  body: Gatik’s diagnostics, FRIP, Safety Advisory Council, and third-party safety-process work suggest deployment trust is being built into the operating system rather than bolted on after the fact.
  claimRefs:
  - CE009
  - CE011
  - CE012
  - CE036
- calloutType: risk
  title: Public technical transparency still lags public safety rhetoric
  body: The company discloses a lot about process but little about component-level architecture, release cadence, public reliability metrics, or cybersecurity outcomes. That makes diligence on actual technical performance harder than diligence on intent.
  claimRefs:
  - CE025
  - CE026
  - CE033
  - CE034
- calloutType: risk
  title: Industrialization, not basic autonomy, is the next hard step
  body: The product already looks commercially real in constrained operations. The bigger question is whether NVIDIA and Isuzu partnerships plus Gatik’s own operations discipline can turn that proof into thousands of production-ready trucks without losing reliability or trust.
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE024
  - CE035
