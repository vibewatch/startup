- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Retail store replenishment
    - Move goods from DCs to stores on fixed windows
    - Driverless medium-duty middle-mile routes
    - Higher frequency and more predictable shelf support
    - Best evidenced in dense regional networks, not broad national freight.
  - - Cold-chain facility transfers
    - Move refrigerated or frozen freight between production, storage, and DC facilities
    - Autonomous box-truck transfers with route regularity
    - Can extend hours and responsiveness in sensitive freight
    - Public outcome metrics beyond named pilots remain limited.
  - - Private-fleet reinforcement
    - Augment a shipper’s existing transportation network
    - ATaaS layer tied to shipper operations and schedules
    - Adds capacity and utilization without hiring more drivers for each lane
    - Complex rollout requires stakeholder coordination and site readiness.
  - - Dynamic regional routing
    - Adjust pickups and drops within dense regional demand patterns
    - Operational layer handles demand-shifted route execution
    - Increases network flexibility beyond a single fixed loop
    - Public detail on algorithmic routing performance is limited.
  - - Driverless frequency expansion
    - Increase trips per day on repeatable routes
    - Structured autonomy plus nearly round-the-clock operations
    - Improves asset utilization relative to driver-limited duty cycles
    - Requires high confidence in uptime, safety, and incident response.
  notes: Benefits are drawn from customer and company deployment language; they do not imply publicly disclosed ROI for each workflow.
