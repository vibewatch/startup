  evidenceGaps:
  - type: missing-source
    severity: material
    topic: component-architecture
    missingEvidence: No public sensor bill of materials, redundancy schematic, compute failover design, or release-cadence data for the live product.
    whyItMatters: Component-level detail is needed to compare true technical defensibility and reliability against peers.
    diligencePath: Request detailed system architecture, sensor suite, redundancy diagrams, and release-management materials.
    relatedQuestionRefs:
    - QE017
    - QE023
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: benchmark-transparency
    missingEvidence: No public disengagement, MTBF, intervention-rate, or standardized safety benchmark dataset for Gatik’s deployed fleet.
    whyItMatters: Without outcome metrics, outsiders can judge process seriousness more easily than actual product reliability.
    diligencePath: Request route-level safety KPIs, intervention data, downtime, and benchmark methodology.
    relatedQuestionRefs:
    - QE017
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: cybersecurity-assurance
    missingEvidence: Public materials mention cybersecurity inside the safety framework but do not provide independent audit details, penetration-test results, or formal control attestations.
    whyItMatters: Cyber assurance is central for public-road AV systems and can become a gating issue for enterprise customers and regulators.
    diligencePath: Request security architecture, red-team findings, incident-response playbooks, and external assessments.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: partner-dependency-terms
    missingEvidence: The public record confirms NVIDIA and Isuzu dependencies but not exclusivity, allocation priority, fallbacks, or failure contingencies.
    whyItMatters: Scale could stall if key partners reprioritize, delay deliverables, or support multiple rival programs with similar terms.
    diligencePath: Review partner agreements, sourcing plans, and contingency strategies.
    relatedQuestionRefs:
    - QE007
    - QE022
    relatedFigureRefs:
    - FE003
  - type: stale
    severity: minor
    topic: developer-signal-depth
    missingEvidence: Developer signal is currently limited to recruiting and company-authored materials rather than public code, package, or community telemetry.
    whyItMatters: Thin developer signal makes it harder to evaluate technical hiring momentum and external ecosystem pull.
    diligencePath: Collect role-level hiring data, conference talks, patent cadence, or other practitioner signals if no public repo exists.
    relatedQuestionRefs:
    - QE019
    - QE020
    relatedFigureRefs:
    - FE004
