- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Vehicle platform
    - Hosts the autonomy system and freight payload
    - Isuzu manufacturing and vehicle engineering
    - OEM timing or platform changes can slow deployment.
  - - In-vehicle compute and OS
    - Runs the autonomy workload and safety-oriented software environment
    - NVIDIA DRIVE AGX, DRIVE Thor, DriveOS
    - Compute roadmap or integration issues can delay next-gen scaling.
  - - Autonomy stack
    - Perception, reasoning, planning, and control for middle-mile routes
    - Gatik Driver software and sensor integration
    - Public architecture detail remains limited for external verification.
  - - Diagnostics and fail-safe layer
    - Detects and isolates hardware, software, and vehicle issues
    - Tiered diagnostics and redundant systems
    - External observers cannot fully verify false-positive/false-negative behavior.
  - - Simulation and synthetic data loop
    - Generates edge cases, validation scenarios, and training data
    - Arena plus NVIDIA Cosmos collaboration
    - Marketing risk if real-world transfer quality underperforms.
  - - Operations and deployment layer
    - Connects technology to customer sites, stakeholders, and freight schedules
    - Commercialization teams, first responders, local authorities
    - Scaling can stall if operational complexity outruns technical maturity.
  notes: This architecture table is intentionally specific to the public evidence set; unsupported lower-level component claims are left as diligence gaps rather than guessed.
