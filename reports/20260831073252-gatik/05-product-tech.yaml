company:
  name: Gatik
chapter:
  number: 5
  title: Product & Technology
  summary: 'Gatik’s product is best understood as an integrated autonomous-freight system rather than a single software artifact. It combines the Gatik Driver, medium-duty vehicle platforms, route operations, a simulation-and-safety stack, and customer deployment processes tuned to repeated middle-mile freight. The strongest public evidence lies in structured autonomy, diagnostics, simulation-first validation, third-party safety-process review, and industrial partners including Isuzu and NVIDIA. The main technical risks are not proof-of-concept ones; they are scaling risks: dependency on compute and OEM partners, limited public disclosure on component-level architecture and reliability metrics, and the challenge of industrializing a commercially proven but still constrained ODD into thousands of production-ready trucks.'
sections:
- id: product-definition-and-assets
  title: What the product actually is
  body: >-
    Gatik’s product is not just an autonomous driving stack and not just a freight service. Public materials show an integrated system with at least five distinct assets: the Gatik Driver autonomy stack, a medium-duty vehicle platform, a route-operations layer, a safety and diagnostics layer, and a simulation-and-data layer that supports validation and release confidence. In customer workflow terms, the product moves goods between distribution centers, warehouses, and stores across repeated regional networks, including ambient, refrigerated, and frozen freight. The autonomy itself is therefore inseparable from the service design. A buyer is not merely purchasing perception software; it is purchasing a driverless middle-mile operating system delivered through trucks, operating procedures, and commercial accountability.


    That integration is a real differentiator because it explains why Gatik commercialized earlier than many broader AV peers. The company focused on structured middle-mile routes, medium-duty trucks, and repeated operating environments instead of trying to solve every road context at once. Public customer proofs from Walmart, Loblaw, PepsiCo, and Tyson suggest the system can support multiple freight workflows while still remaining inside a deliberately bounded operating domain. The takeaway is that Gatik’s product should be underwritten as a tightly coupled service-plus-stack architecture. This gives it more control over customer outcomes, but it also means product maturity depends on logistics execution, safety processes, and vehicle industrialization—not software quality alone.
