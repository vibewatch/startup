- id: founders-governance
  title: Founders, leadership upgrades, and governance signals
  body: >-
    Gatik’s origin story remains tightly linked to its founders. The company says Gautam Narang, Arjun Narang, and Apeksha Kumavat launched the business in 2017, and the about page still anchors the current enterprise to that founding team. Gautam remains the public face of capital raising and commercial scaling, while Arjun continues to embody technical continuity as CTO. That founder continuity is a strength for strategic coherence, but it also concentrates external credibility around a small leadership core. There is no full public board roster in the accessible 2026 materials, so outside investors still have limited line of sight into formal board composition and committee depth.


    What is visible is a deliberate governance buildout ahead of larger-scale freight-only deployment. In April 2024, Gatik hired Philip Reinckens as Senior Vice President of Commercialization and Operations to sharpen operational scaling. In May 2025, the company added Patrick Archambault as its first CFO and elevated Judi Otteson to Chief Legal Officer, explicitly framing those appointments as preparation for a new growth phase. That same month, Gatik created a Safety Advisory Council populated by former NHTSA and FMCSA leaders plus trucking and automotive veterans. The council does not replace formal board governance, but it does add an independent safety-review layer that most private autonomous-trucking startups still lack. Together, the finance, legal, commercialization, and safety hires make the company look materially more institutional in 2026 than it did in the early Walmart era.
  claimRefs:
  - CO001
  - CO029
  - CO030
  - CO031
  - CO038
