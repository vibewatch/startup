- calloutType: risk
  title: Core scale metrics are strong but not fully reconciled
  body: The gap between the 85,000 fully driverless orders in Gatik’s own August 2026 release and the 100,000-plus figure in QIA’s same-day post is small relative to the overall story, but it is still an avoidable disclosure inconsistency for a company asking investors to underwrite commercial maturity.
  claimRefs:
  - CO023
  - CO024
- calloutType: risk
  title: Valuation and concentration remain partially opaque
  body: Public materials still omit the exact Series D valuation, precise fleet size, complete customer list, and full board roster. Those omissions matter because they limit independent judgment on customer concentration, governance depth, and whether the step-up in capital reflects durable economics or enthusiasm around category leadership.
  claimRefs:
  - CO013
  - CO014
  - CO038
- calloutType: insight
  title: Institutional maturity improved materially in 2024-2025
  body: The additions of a first CFO, a strengthened legal function, a commercialization leader, and an externally credible Safety Advisory Council make Gatik look more like a company preparing for scaled industrial deployment than a small autonomy startup running showcase pilots.
