company:
  name: Gatik
chapter:
  number: 1
  title: Company Overview
  summary: Gatik is a Santa Clara, California-based autonomous middle-mile trucking company founded in 2017 that has progressed from Walmart pilot routes to daily fully driverless commercial operations for major retailers and CPG shippers. Its Aug. 25, 2026 Series D brought in $200 million from QIA and Koch Disruptive Technologies after the company publicly cited more than $600 million in contracted revenue, 85,000 fully driverless orders, and 99% on-time delivery, though some public metrics remain inconsistent across sources. Governance additions in 2024-2025 and a third-party-reviewed safety program suggest increasing institutional maturity, but valuation, exact fleet size, and full customer concentration remain undisclosed.
sections:
- id: identity-and-model
  title: Identity, operating model, and current scale narrative
  body: >-
    Gatik positions itself as an autonomous freight company rather than a pure autonomy software lab. Across its homepage, January 2026 driverless-scale release, and August 2026 financing materials, the company describes the product as driverless middle-mile freight service using box trucks that shuttle goods between distribution centers, warehouses, and stores on high-frequency regional routes. That framing matters because it distinguishes Gatik from long-haul autonomous-truck developers that still center on Class 8 highway autonomy. The company’s use case is narrower but also more operationally structured: dense, repetitive retail and CPG networks where route predictability, service-level reliability, and store replenishment frequency all matter more than coast-to-coast range.


    Public location language shifted over time. Older 2024-2025 Gatik releases used Mountain View datelines, while the August 2026 Series D materials and contemporaneous press coverage described the business as Santa Clara-based. The shift does not appear to imply a new geography outside Silicon Valley, but it does show that even basic profile fields require date anchoring. The company’s 2026 scale narrative is clearer: Gatik says it runs driverless trucks daily across Texas, Arizona, Arkansas, and Canada, with broader organizational footprint signals in Nebraska, Ontario, Michigan, and Iowa. TechCrunch also reported that the company’s operations had moved from a few pilot programs into commercial driverless service across several cities, reinforcing the claim that Gatik now operates a revenue-generating network rather than a single showcase lane.
