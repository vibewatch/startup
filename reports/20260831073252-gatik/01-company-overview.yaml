  title: Focused niche produced real commercial operations before many long-haul rivals
  body: Gatik’s narrower middle-mile strategy appears to have accelerated commercialization. By January 2026 it was publicly claiming scaled fully driverless revenue-generating operations, while many larger Class 8 autonomy peers were still defining launch timelines or limited corridors.
