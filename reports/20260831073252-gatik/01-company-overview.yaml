- id: milestones-and-strategic-dependencies
  title: Milestones, customer proof, and strategic dependencies
  body: >-
    The milestone history shows a company that expanded through customer-specific regional networks instead of a broad autonomous-vehicle platform strategy. Walmart anchored the first commercial launch in Bentonville in 2019, followed by Canada’s first autonomous delivery fleet with Loblaw in 2020 and the widely cited 2021 driver-out milestone with Walmart. By 2023, the customer set had broadened publicly to include Kroger and Tyson, while Gatik’s historical materials also named Georgia-Pacific, KBX, and Pitney Bowes. In September 2025, Loblaw and Gatik signed a five-year expansion agreement that called for 50 autonomous trucks across the Greater Toronto Area, and in June 2026 PepsiCo announced a multi-year North America deployment. TechCrunch subsequently reported that PepsiCo alone involved 41 driverless box trucks across Dallas, Phoenix, and Northwest Arkansas, making it the company’s largest disclosed partnership.


    Scale still depends on a small set of strategic counterparties. Isuzu is central to the vehicle program and invested $30 million as part of a May 2024 agreement to co-develop production-ready Level 4 medium-duty trucks and a dedicated production line targeted for 2027. Safety credibility similarly rests on the company’s ability to keep converting process claims into external assurance: Gatik’s public safety materials describe constrained operating domains, repeatable validation, third-party review by TÜV SÜD, and a 700-plus-portfolio Safety Assessment Framework tied to UL4600-style conformity work. The focused middle-mile strategy clearly allowed Gatik to commercialize earlier than several long-haul rivals, but it also means future growth will be judged on whether a concentrated customer-and-partner base can scale into durable multi-market density.
