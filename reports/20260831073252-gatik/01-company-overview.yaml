- id: capital-and-traction
  title: Funding path, traction metrics, and disclosure limits
  body: >-
    Gatik’s capital story is more nuanced than a single headline round suggests. The August 2026 Series D brought in $200 million led by QIA and Koch Disruptive Technologies, with Millennium Management, ARK Invest, and Intact Private Capital also participating. That round was the largest disclosed financing in company history. Reconstructing announced rounds yields a disclosed minimum of roughly $344.5 million: $4.5 million of seed capital before the June 2019 stealth exit, a $25 million Series A in 2020, an $85 million Series B in 2021, a $30 million Isuzu investment in 2024, and the $200 million Series D in 2026. TechCrunch, however, reported lifetime funding of about $500 million after the Series D, implying that either additional instruments or strategic investments were not fully itemized in the public round chronology.


    Traction claims are strong but not perfectly reconciled. Gatik’s January 2026 driverless-scale release cited more than $600 million in contracted revenue, 60,000 fully driverless orders, over 2,000 driverless hours, and more than 10,000 driverless miles. By August 2026, Gatik and Yahoo repeated 85,000 fully driverless orders and 99% on-time delivery, while QIA’s co-lead investor post referenced more than 100,000 fully driverless orders on the same day. That inconsistency does not invalidate the broader thesis that Gatik has meaningful real-world traction, but it does mean investors should treat scale metrics as approximate until the company publishes a reconciled operating ledger. The other major omission is valuation: public coverage said the Series D valuation was undisclosed, and the best pre-round point estimate visible in accessible sources was Forbes’ January 2026 reference to a valuation above $800 million.
