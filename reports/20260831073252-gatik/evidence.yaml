evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: traction-metrics
    missingEvidence: >-
      A reconciled company operating ledger showing exactly how fully driverless orders are counted across Jan.-Aug.
      2026 disclosures.
    whyItMatters: >-
      The company uses order count as a proof-of-scale metric, so inconsistent same-day numbers weaken confidence in the
      precision of the commercial narrative.
    diligencePath: >-
      Request monthly operating KPI exports or board materials reconciling orders, miles, hours, and service-level
      performance by market.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact Series D pre-money, post-money, ownership, liquidation preference, and any side-letter economics.
    whyItMatters: >-
      Without exact pricing and preference terms, investors cannot determine whether Gatik crossed the unicorn threshold
      cleanly or assess dilution and downside protection.
    diligencePath: Obtain the Series D term sheet, cap table, and updated board materials from management or existing investors.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: fleet-scale
    missingEvidence: Current fleet count, customer-by-customer deployed truck counts, and the revenue contribution of top customers.
    whyItMatters: >-
      The absence of exact fleet and concentration data makes it difficult to evaluate operating leverage, customer
      concentration risk, and how much of the growth story rests on one or two accounts.
    diligencePath: >-
      Request an active-fleet schedule by market and customer, plus booked revenue and gross-margin contribution by top
      account.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: A complete current board roster and committee structure tied to the 2026 financing.
    whyItMatters: >-
      Governance depth matters as the company scales into a more regulated industrial operating profile and raises
      larger institutional rounds.
    diligencePath: Request the post-Series-D board observer and committee list directly from management.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: An official current employee count and hiring plan by function rather than a press-reported approximation.
    whyItMatters: Headcount growth is a proxy for execution capacity and burn; press estimates are too imprecise for underwriting.
    diligencePath: Request the latest org chart, budgeted hiring plan, and monthly headcount report.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      A complete internal chronology of private customer launches, board changes, and unpublicized financing events not
      disclosed in the public record.
    whyItMatters: >-
      The public milestone table is sufficient for external orientation but may omit material private inflection points
      that matter for underwriting execution quality.
    diligencePath: >-
      Request a board-ready company timeline with all financings, launches, governance changes, and market entries since
      founding.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      Route-level density, stop count, pricing, and margin data needed to convert broad market shells into Gatik’s exact
      U.S. SAM and SOM.
    whyItMatters: Public TAM slides do not reveal which lanes are actually monetizable at attractive economics for Gatik.
    diligencePath: >-
      Request a lane-level market model by geography showing active and target routes, average revenue per route, and
      unit margin assumptions.
    relatedQuestionRefs:
      - QM017
  - type: private-evidence-only
    severity: material
    topic: route-economics
    missingEvidence: >-
      Actual customer contract pricing, savings realized versus human-driven alternatives, and renewal behavior for
      deployed autonomous routes.
    whyItMatters: >-
      Underwriting depends on whether autonomy improves margins or merely wins attention; public sources do not disclose
      realized ROI.
    diligencePath: Request signed customer case studies with before/after route economics and renewal status.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: insurance-liability
    missingEvidence: Insurer terms, deductibles, and fault-allocation frameworks for driverless freight operations at scale.
    whyItMatters: Liability structure is a core gating factor for adoption speed and could materially change route economics.
    diligencePath: Request insurance binders, carrier feedback, and legal views by operating state.
    relatedQuestionRefs:
      - QM014
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: budget-owner
    missingEvidence: >-
      A direct public source naming the exact internal budget owner for autonomous middle-mile programs at PepsiCo,
      Loblaw, or Tyson.
    whyItMatters: >-
      Budget ownership influences sales cycles and expansion probability, and current chapter conclusions are inferred
      from operations language.
    diligencePath: Interview customer transportation or supply-chain leaders and review procurement org charts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: realized-category-revenue
    missingEvidence: >-
