- id: exit-readiness-and-final-diligence
  title: Exit readiness and the last questions that decide price
  body: >-
    Gatik is not yet an IPO-ready underwriting story from public evidence alone. It may become one, but only if it converts backlog and operational milestones into audited financial performance, better customer disclosure, and a cleaner safety narrative for public markets. A strategic outcome is plausible, especially if OEMs, logistics incumbents, or autonomy platforms want commercial middle-mile exposure, but no obvious buyer is visible in the public record today.


    That leaves one sensible conclusion: price the company only after resolving the questions that matter most. Revenue recognition, contribution margin, concentration, insurance economics, partner terms, and capitalization needs will decide whether Gatik is a disciplined buy or simply a compelling story. Until then, the valuation work should be treated as bounded judgment rather than precision engineering. Investors should assume that better private data can move the range materially in either direction.
