- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: 'Covers the most decision-useful public and private reference points for Gatik in 2026: public AV trucking optionality, mature freight operators, broad vehicle-intelligence platforms, and cautionary failed AV-trucking precedents. It is not an exhaustive mobility comp set.'
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Aurora Innovation
    - Public market cap plus public filings
    - ~$11.68B market cap in Aug. 2026; 2025 revenue still minimal
    - Shows how public markets price long-dated AV freight optionality
    - Far more capitalized and differently scoped than Gatik.
  - - J.B. Hunt
    - Public market cap and low-single-digit P/S context
    - ~$24.51B market cap in Aug. 2026; freight multiple context much lower than autonomy narratives
    - Useful mature-freight floor for logistics economics
    - Not an autonomy or venture-growth comp.
  - - Applied Intuition
    - Private valuation
    - $15B valuation in 2026 Series F
    - Useful upper-bound reference for broad vehicle-intelligence and tooling ambition
    - Too broad and software-platform oriented to map directly to Gatik.
  - - Waabi
    - Private funding event
    - Up to $1B financing in 2026; valuation undisclosed
    - Shows that capital appetite for autonomous-trucking platforms remains strong
    - No disclosed valuation and different product breadth.
  - - Embark Trucks
    - Historical public valuation / failure outcome
    - $5.2B SPAC valuation in 2021; exploring liquidation by 2023
    - Important downside reminder about AV-trucking exuberance
    - Commercial proof was much weaker than Gatik’s.
  - - TuSimple
    - Historical public valuation / failure outcome
    - $1.1B IPO in 2021; later delisted and went private
    - Shows early technical milestones do not guarantee durable public value
    - Different geography, governance, and long-haul strategy.
  notes: This table deliberately mixes public market caps, private round marks, and failed historical precedents because no single comp family cleanly fits Gatik.
