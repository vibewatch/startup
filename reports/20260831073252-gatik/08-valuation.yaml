company:
  name: Gatik
chapter:
  number: 8
  title: Valuation
  summary: 'Gatik is one of the more compelling autonomous-freight assets in the 2026 market, but the valuation question is harder than the company-quality question. Public evidence supports a real commercial business with $600M+ contracted revenue, 85,000+ driverless deliveries, major enterprise customers, and a top-tier investor syndicate. Yet the company did not disclose its valuation, and key underwriting inputs—recognized revenue, gross margin, customer concentration, and capital needs—remain private. The right conclusion is therefore conditional, not maximalist: Gatik merits serious investment consideration, but only with price discipline. A public-only base case points to roughly $1.8B-$2.8B, with upside to $3.5B-$5.0B if execution compounds cleanly and downside to $0.8B-$1.4B if the common AV-trucking failure modes reappear. Above roughly $3B post-money, the public record is too thin to justify a new investment without strong structural protection or much better private data.'
sections:
- id: valuation-context-and-recommendation
  title: Current financing context and recommendation stance
  body: >-
    Gatik is exactly the kind of company that can tempt investors into lazy valuation thinking. The round is large, the customers are credible, the technology has live commercial proof, and the investor list is impressive. That is the good news. The bad news is that the key number—the valuation itself—was not disclosed. Public investors therefore cannot anchor on a negotiated market-clearing price; they have to decide what range would make sense before seeing the term sheet. That forces unusual discipline.


    The right public-only stance is constructive but conditional. Gatik looks like a serious company with real customer demand and better commercial evidence than most autonomous-freight startups. But it is still a safety-critical, partner-dependent, capital-intensive business with opaque margins and incomplete revenue disclosure. That means the investment case can be strong while the acceptable price range remains relatively narrow. Put differently, the company-quality answer is easier than the pricing answer.
  claimRefs:
