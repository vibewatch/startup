- id: thesis-antithesis-and-comp-set
  title: Why this is attractive — and why it is dangerous to overpay
  body: >-
    The thesis for Gatik is not subtle. It has real operations, named customers, unusually clear use-case focus, commercial backlog, and investor syndicate quality. In a sector littered with vision without revenue, that matters a lot. The anti-thesis is equally clear. Contracted revenue is not recognized revenue; customer concentration looks meaningful; partner dependencies are high; and public financial disclosure is nowhere near what investors would have for a public mobility company. In valuation work, both halves of the story matter.


    The comparable set also has to be handled carefully. Aurora is useful as a public AV-freight optionality comp, but not as a clean pricing template. J.B. Hunt is useful as a mature freight baseline, but not as an autonomy comp. Applied Intuition is useful as an upper-bound autonomy tooling/platform reference, but far too broad to map directly to Gatik. Waabi shows private capital appetite for ambitious autonomy platforms. Embark and TuSimple show how violently AV-trucking valuations can unwind when commercialization or governance disappoints. Those cautionary comps matter precisely because Gatik otherwise looks strong.
