- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Gatik has stronger commercial proof than most private AV freight startups.
    - A major safety or customer setback would sharply weaken this advantage.
  - - Flagship customers and backlog suggest real demand exists now, not just future optionality.
    - Recognized revenue conversion or margin data that disappoint materially would cut conviction.
  - - Constrained middle-mile focus improves commercialization credibility.
    - Evidence that growth is trapped in a narrow ODD with poor expansion economics would weaken the thesis.
  - - The valuation can still be too high even if the company is good.
    - Disclosure of audited revenue, route-level margins, and broad diversification could justify a higher mark.
  - - Failed AV trucking precedents prove the need for valuation discipline.
    - A multi-year safety and margin record that clearly separates Gatik from those precedents would reduce this concern.
  - - Broad vehicle-intelligence platform comps are directionally useful but not directly transferable.
    - If Gatik proves repeatable platform monetization beyond ATaaS, its comp set could widen upward.
  notes: Arguments are phrased as investment-thesis statements rather than factual claims of certainty.
