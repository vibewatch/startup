tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Gatik
  rows:
  - - Middle-mile B2B road delivery
    - Repeated freight between warehouses, DCs, storage sites, and stores
    - Consumer last-mile drop-off and passenger autonomy
    - Retailers, grocers, CPG shippers, managed fleets
    - Core target category for Gatik.
  - - Regional retail replenishment
    - Store restocking, grocery, ambient and cold-chain transfers
    - National over-the-road truckload and parcel final-mile
    - Supply-chain and transportation organizations
    - Best-fit vertical because schedules and receiving windows are controlled.
  - - Managed autonomous freight capacity
    - Vehicles, remote operations, service accountability, route management
    - Standalone seat-based software budgets
    - Transportation and private-fleet budgets
    - Fits Gatik’s commercial positioning better than pure software licensing.
  - - Long-haul autonomous trucking
    - Highway corridor autonomy with heavy-duty semis
    - Dense multi-stop regional store routes
    - Carriers, OEM-integrated AV stacks
    - Important adjacency but not the clearest current fit for Gatik.
  - - Status-quo substitute
    - Human-driven private fleets, dedicated carriers, and regional freight networks
    - Other AV products as a primary substitute
    - Existing logistics budgets
    - This is the real replacement benchmark on cost and reliability.
  - - Excluded AV adjacencies
    - Robotaxis, construction AVs, mining autonomy, generic ADAS revenue
    - Non-freight autonomy categories
    - Different buyers and economics
    - Useful context but not direct market revenue for Gatik.
  notes: The table intentionally distinguishes Gatik’s current market boundary from the much broader autonomous truck and total trucking TAM figures used elsewhere in the chapter.
