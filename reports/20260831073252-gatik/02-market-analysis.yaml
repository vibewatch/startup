- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  rows:
  - - Large grocery chains
    - Supply-chain and transportation leadership
    - Distribution planners and store-replenishment teams
    - Private-fleet or logistics operating budget
    - DC-to-store replenishment
    - Need more frequent, reliable deliveries with fixed receiving windows.
  - - Large CPG networks
    - Regional logistics leaders
    - Site-to-site transportation planners
    - Transportation / network budget
    - Plant/DC/store transfers
    - Capacity addition and service consistency inside complex networks.
  - - Retailers with dense regional footprints
    - Network operations leaders
    - Dock and inventory operations teams
    - Transportation budget or outsourced capacity contract
    - Hub-and-spoke store replenishment
    - Route density and ability to measure on-time shelf support.
  - - Cold-chain / refrigerated flows
    - Operations and distribution leadership
    - Temperature-sensitive route managers
    - Specialized logistics budget
    - Refrigerated DC/storage transfers
    - Need to reduce complexity while preserving reliability.
  - - Managed autonomous capacity customer
    - Operations executive, not a software buyer
    - Local logistics teams plus central planning
    - Service contract rather than SaaS seat budget
    - Recurring regional freight movement
    - Prefers one accountable freight contract over building an AV team internally.
