  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: Route-level density, stop count, pricing, and margin data needed to convert broad market shells into Gatik’s exact U.S. SAM and SOM.
    whyItMatters: Public TAM slides do not reveal which lanes are actually monetizable at attractive economics for Gatik.
    diligencePath: Request a lane-level market model by geography showing active and target routes, average revenue per route, and unit margin assumptions.
    relatedQuestionRefs:
    - QM017
  - type: private-evidence-only
    severity: material
    topic: route-economics
    missingEvidence: Actual customer contract pricing, savings realized versus human-driven alternatives, and renewal behavior for deployed autonomous routes.
    whyItMatters: Underwriting depends on whether autonomy improves margins or merely wins attention; public sources do not disclose realized ROI.
    diligencePath: Request signed customer case studies with before/after route economics and renewal status.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: insurance-liability
    missingEvidence: Insurer terms, deductibles, and fault-allocation frameworks for driverless freight operations at scale.
    whyItMatters: Liability structure is a core gating factor for adoption speed and could materially change route economics.
    diligencePath: Request insurance binders, carrier feedback, and legal views by operating state.
    relatedQuestionRefs:
    - QM014
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: budget-owner
    missingEvidence: A direct public source naming the exact internal budget owner for autonomous middle-mile programs at PepsiCo, Loblaw, or Tyson.
    whyItMatters: Budget ownership influences sales cycles and expansion probability, and current chapter conclusions are inferred from operations language.
    diligencePath: Interview customer transportation or supply-chain leaders and review procurement org charts.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM003
  - type: stale
    severity: minor
    topic: realized-category-revenue
    missingEvidence: Independent 2026 market-share or revenue ledgers for the narrow middle-mile autonomous delivery category rather than long-dated forecast models.
    whyItMatters: Forecasts are directionally useful but do not prove how much commercial revenue already exists in the category today.
    diligencePath: Look for 2026 filings, survey data, or large-customer disclosures that quantify autonomous freight spend directly.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
