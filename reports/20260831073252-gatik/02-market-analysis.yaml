company:
  name: Gatik
chapter:
  number: 2
  title: Market Analysis
  summary: 'Gatik operates inside a narrow but fast-accelerating slice of freight automation: autonomous middle-mile B2B road delivery between managed facilities. The broad U.S. trucking TAM remains enormous at $906 billion of 2024 freight revenue, but the more relevant current-category lens is much smaller: Future Market Insights sizes middle-mile autonomous delivery at $490 million in 2026, growing to $14.173 billion by 2036 at a 40% CAGR, with L4 box trucks, retail replenishment, and transport-as-a-service leading the mix. Public customer proof from PepsiCo, Loblaw, Tyson, and Kroger supports the view that Gatik’s best market is dense retail and CPG replenishment rather than generic long-haul autonomy, though liability, insurance, route-approval, and pricing opacity still constrain underwriting.'
sections:
- id: market-boundary
  title: Market boundary and status-quo substitute
  body: >-
    Gatik’s relevant market is not the full universe of autonomous vehicles and not even the full universe of trucking autonomy. The company’s proof points sit inside a narrower category: middle-mile B2B road delivery on repeated routes between distribution centers, warehouses, storage sites, and stores. Future Market Insights explicitly frames the category around repeated freight movements between facilities with controlled loading points and planned departure windows, which maps closely to how Gatik and its customers describe the service. PepsiCo emphasizes regional transportation networks where products move daily from site to site, while Loblaw describes dense GTA distribution flows to hundreds of stores and Tyson highlights refrigerated transfers between production, storage, and distribution facilities.


    That means the true status-quo substitute is still human-driven freight capacity, whether delivered via a private fleet, a dedicated carrier, or a standard regional trucking network. It is not another software product. The boundary also excludes last-mile consumer delivery, most robotaxi-style AV systems, and much of the long-haul heavy-duty autonomy narrative that dominates broader market reports and competitor messaging. Gatik’s market begins where route repetition, facility control, and service-level sensitivity are high enough that a managed autonomous truck can behave like industrial infrastructure rather than a generalized AV experiment.
