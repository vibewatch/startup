- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Gatik
  - Diligence ask
  rows:
  - - Hours-of-service limits
    - positive
    - current
    - Autonomy can improve utilization on repeated routes versus human duty-cycle caps.
    - Request route-level utilization before and after driverless conversion.
  - - Driver scarcity
    - positive
    - current
    - Regional networks that are hard to staff become higher-priority automation candidates.
    - Validate actual labor gap by market and customer.
  - - Retail replenishment density
    - positive
    - current
    - Fixed receiving windows and store schedules make performance measurable.
    - Request customer SLA and on-time data by lane.
  - - Managed-service preference
    - positive
    - current
    - Customers may adopt faster when autonomy is bought as freight capacity rather than software.
    - Ask for contract structure and renewal terms.
  - - Vehicle / sensor cost
    - negative
    - current
    - Hardware-heavy rollout constrains small-fleet adoption and delays payback.
    - Request per-truck deployed capital and sensor refresh assumptions.
  - - EPA Phase 3 and fleet refresh pressure
    - mixed
    - 2027+
    - Can support medium-duty replacement cycles but raises planning complexity.
    - Ask how OEM and customer vehicle plans line up with emissions rules.
  - - Liability and insurance uncertainty
    - negative
    - current
    - Can slow route expansion even after technical proof exists.
    - Request insurer posture and incident-allocation framework.
  - - Patchwork approvals and AV scrutiny
    - negative
    - current
    - Each corridor may need separate state, local, and first-responder readiness work.
    - Request market-entry checklist by geography.
  notes: Several constraints are regulatory and economic rather than purely technical, which is why public proof of autonomous miles alone does not fully clear commercialization risk.
