- id: buyer-user-payer
  title: Buyer, user, payer, and adoption fit
  body: >-
    The buyer map for Gatik-like service is operational, not consumer and not purely digital. The buyer is usually a retailer, grocer, or CPG shipper with dense regional freight needs. The user is the network operator or transportation planner who has to keep product flowing through known docks, receiving windows, and facility schedules. The payer sits closest to supply-chain, transportation, or private-fleet budgets, especially when autonomy is bought as accountable freight capacity rather than as a software license. That pattern shows up clearly in the public customer proofs: PepsiCo describes strengthening one of North America’s largest private fleets, Loblaw describes improving frequency and responsiveness to more than 300 stores, and Tyson highlights flexible refrigerated movement through Arkansas facilities.


    These customers are not buying autonomy because it is novel. They are buying a service that promises better reliability, more capacity, and easier scaling in difficult-to-staff regional networks. Fixed receiving windows and controlled loading points are critical because they reduce route variation, simplify recovery planning, and make service-level measurement possible. That is why Gatik’s market fit is strongest in retail, grocery, and food or CPG lanes instead of generic trucking segments. The company’s eventual expansion may stretch into additional repeated-route freight categories, but the core buyer logic today is still regional replenishment rather than open-ended road autonomy.
