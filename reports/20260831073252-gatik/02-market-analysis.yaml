callouts:
- calloutType: strength
  title: The fastest-growing slice aligns unusually well with Gatik’s product shape
  body: 'FMI and Mordor do not agree on category size, but they do agree on the characteristics that matter: Gatik’s niche sits inside the faster-growing Level 4, medium-duty, repeat-route wedge rather than the slower, heavier, or less-structured parts of freight autonomy.'
  claimRefs:
  - CM010
  - CM016
  - CM017
  - CM019
- calloutType: insight
  title: This is an operations budget sale, not a software budget sale
  body: Customer proof points consistently describe supply-chain resilience, delivery frequency, and network capacity. That means underwriting should focus on transportation budgets, SLA pain, and route density rather than generic enterprise-AI procurement patterns.
  claimRefs:
  - CM020
  - CM022
  - CM023
  - CM024
  - CM047
  - CM048
- calloutType: risk
  title: Market-size headlines can mislead by almost two orders of magnitude
  body: A $906B trucking TAM and a $42.63B broader autonomous-truck estimate are both factually supportable, but neither is the same thing as the currently monetizable middle-mile niche. The $490M narrow-category estimate is probably closer to today’s commercial reality, even if it feels smaller than investors want.
  claimRefs:
  - CM002
  - CM009
  - CM014
  - CM045
  - CM046
- calloutType: risk
  title: Route economics matter more than autonomous-mile bragging rights
  body: Liability, insurer acceptance, hardware cost, and corridor-by-corridor permissions can delay adoption even when the technical system works. Public evidence still says more about category promise than about realized pricing or ROI.
