tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Recurring autonomous freight service
    - Route execution for middle-mile deliveries between managed facilities
    - Contracted route capacity / freight service
    - Clearly live and commercial across named customers
    - High relevance; core business
    - Request recognized revenue by customer and by route cohort.
  - - Multi-year take-or-pay commitments
    - Contracted minimum service commitments for route programs
    - Multi-year contract value
    - Publicly cited as part of $600M backlog
    - Promising but underdocumented
    - Request contract minimums, termination rights, and SLA penalties.
  - - Driverless freight-on-road operations
    - Revenue from no-driver commercial trucks on active routes
    - Revenue-generating truck / order / mile
    - 10 driverless revenue trucks cited in Jan 2026; scaling to 60 and then hundreds
    - Medium confidence because ramp timing may shift
    - Request active-truck count, utilization, and revenue per truck.
  - - Customer expansion within existing accounts
    - Add routes, stores, regions, or cold-chain lanes to existing shippers
    - Expansion contract / route addition
    - Visible in PepsiCo, Loblaw, Tyson, and Kroger-type deployments
    - High strategic value but sparse financial disclosure
    - Request net revenue retention and expansion revenue mix.
  - - Potential future software / licensing revenue
    - Possible future monetization of AV stack or platform services
    - Unknown
    - Not evidenced as a material current stream in retained sources
    - Low confidence / speculative
    - Confirm whether any licensing, data, or platform-service revenue exists today.
  notes: The table distinguishes visible recurring freight-service revenue from hypothetical future software or licensing monetization that is not yet supported by public evidence.
