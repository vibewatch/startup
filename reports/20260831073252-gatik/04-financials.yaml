  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue-and-margin
    missingEvidence: No public disclosure of recognized revenue, gross margin, contribution margin, EBITDA, or route-level unit economics.
    whyItMatters: These are the core inputs required to determine whether Gatik’s contracted backlog converts into profitable operations.
    diligencePath: Request audited historical financials plus route-level P&Ls by customer and maturity cohort.
    relatedQuestionRefs:
    - QI019
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Public sources do not provide cash on hand, monthly burn, or detailed runway calculations.
    whyItMatters: Management says the company is funded for the foreseeable future, but investors cannot verify that claim without balance-sheet data.
    diligencePath: Request current cash, restricted cash, debt, monthly burn, and board runway materials.
    relatedQuestionRefs:
    - QI013
    - QI014
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: pricing-and-contract-terms
    missingEvidence: No public rate card, per-mile price, SLA penalty schedule, renewal economics, or cancellation rights for core freight contracts.
    whyItMatters: Without pricing and contract detail, backlog quality and margin durability remain partially unknowable.
    diligencePath: Review top customer contracts, amendment history, and pricing schedules.
    relatedQuestionRefs:
    - QI004
    - QI005
    - QI008
    - QI024
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: material
    topic: fleet-financing-structure
    missingEvidence: The capital stack for truck deployment—owned, leased, financed, or partner-supported—is not visible in public sources.
    whyItMatters: Per-truck deployment economics and financing structure determine how quickly backlog can be converted into scaled service.
    diligencePath: Request fleet financing model, lease schedules, and OEM commercial terms.
    relatedQuestionRefs:
    - QI012
    - QI023
    relatedTableRefs:
    - TI004
  - type: stale
    severity: minor
    topic: customer-concentration-precision
    missingEvidence: Named customers are public, but exact revenue concentration percentages and renewal history are not.
    whyItMatters: A few large shippers likely dominate revenue, but investors cannot quantify the concentration risk from public material alone.
    diligencePath: Request top-10 customer concentration, backlog concentration, and cohort expansion data.
