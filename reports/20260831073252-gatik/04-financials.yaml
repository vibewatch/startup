- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Gatik’s financing story is stronger than that of many private autonomy companies, but it is not yet transparent enough to remove balance-sheet risk. The August 2026 Series D added $200 million and brought reported cumulative capital raised since 2019 to roughly $500 million. Isuzu’s 2024 $30 million investment added more than capital: it deepened the industrial relationship behind a 2027 production plan. Management also says the current fundraise supports scaling from dozens of trucks to thousands, hiring engineers and operations personnel, and expanding to new or denser markets. That is strategically compelling, but it is also exactly the sort of plan that consumes capital faster than headline backlog implies.


    The main challenge is that Gatik does not publish the numbers an investor would need to test runway directly. There is no disclosed cash balance, no monthly burn, no capex per deployed truck, no debt or lease schedule, and no explicit project-finance structure for fleet growth. In January 2026, Gautam Narang told Transport Topics that the company had enough cash for the next few years and was well capitalized for the foreseeable future. That may be true, but it remains management guidance, not audited balance-sheet evidence. Aurora’s filings are helpful as a sector reminder: even a company with over $1 billion of short-term investments still says it may raise capital opportunistically while scaling. Gatik may be more focused and commercially grounded than Aurora, but the comparison underscores the same lesson. Real revenue reduces existential risk; it does not erase the capital intensity of autonomous freight at industrial scale.'
