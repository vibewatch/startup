callouts:
- calloutType: strength
  title: This is real service revenue logic, not speculative platform theater
  body: The combination of ATaaS positioning, named shippers, large route deployments, and $600M of contracted revenue claims means Gatik should be analyzed as an operating freight business with autonomy leverage—not as a pre-revenue AI promise.
  claimRefs:
  - CI001
  - CI003
  - CI006
  - CI007
- calloutType: risk
  title: Backlog is meaningful, but it is not the same thing as revenue or margin
  body: The strongest public number in the dataset is contracted revenue. It supports demand, but without recognized revenue and route-level margin disclosure, it cannot answer the core underwriting question of whether Gatik is building a profitable network or an expensive one.
  claimRefs:
  - CI011
  - CI031
  - CI032
  - CI040
- calloutType: risk
  title: Capital intensity remains structurally high
  body: Scaling from dozens to thousands of trucks while hiring engineers and operators and coordinating with an OEM partner is a capital-intensive path. Real revenue reduces risk, but it does not remove financing dependency.
  claimRefs:
  - CI013
  - CI015
  - CI016
  - CI033
  - CI035
- calloutType: insight
  title: Utilization is probably the single most important hidden metric
  body: Near-24-hour operations on dense repeat routes could make the economics work—but only if downtime, maintenance, and insurance do not absorb the advantage. That makes route-level utilization and contribution margin the two most important undisclosed metrics.
  claimRefs:
  - CI023
  - CI024
  - CI039
