company:
  name: Gatik
chapter:
  number: 4
  title: Financials
  summary: 'Gatik’s financial story is more substantial than a typical AV startup’s but still far from fully underwritten in public. The company clearly monetizes a service—autonomous transportation-as-a-service on recurring middle-mile routes—and public materials support meaningful traction: more than $600 million in contracted revenue, 85,000+ fully driverless orders, 99% on-time performance, and major enterprise deployments such as PepsiCo’s 41-truck program. Yet the core underwriting problem remains unresolved because public sources do not disclose recognized GAAP revenue, gross margin, cash balance, burn, or route-level contribution economics. Capital intensity is also real: scaling from dozens to thousands of trucks, hiring staff, and supporting an Isuzu-linked production path all imply that Gatik is building a logistics business with software leverage, not a pure software company.'
sections:
- id: revenue-model-and-traction
  title: Revenue model and public traction
  body: 'The clearest financial conclusion is that Gatik has moved beyond the pilot-era ambiguity that still clouds much of autonomy. Public materials consistently describe an autonomous transportation-as-a-service business, not a tool sold to developers and not a speculative future licensing story. The revenue mechanism appears tied to commercial freight movement on recurring middle-mile routes for large shippers. That framing matters because it implies revenue is earned from operating outcomes—moving goods between distribution centers and stores on time—rather than from software-seat adoption or one-time truck sales. Public customer proof reinforces that reading. PepsiCo’s June 2026 announcement described a 41-truck deployment spanning about 250 retail locations, while Gatik’s own materials and investor-backed announcements repeatedly cite retail, grocery, and CPG use cases with active routes across multiple regions.


    The traction numbers are strong enough to be notable but not strong enough to answer every financial question. Public 2026 materials say Gatik has more than $600 million in contracted revenue, more than 85,000 fully driverless orders, and 99% on-time performance. Transport Topics reported that the company added $400 million of take-or-pay contracts in the second half of 2025 and that a latest shipper deal doubled contracted revenue to $600 million over five years. That is important because it suggests some revenue visibility and non-trivial contract quality rather than loose pilot memoranda. But contracted revenue is not recognized revenue. Public sources still do not show the timing of revenue recognition, how much backlog is front- versus back-loaded, or how much of the booked value depends on service levels, ramp schedules, or contract options. So the right interpretation is not “Gatik has solved financial disclosure”; it is “Gatik has demonstrated real commercial demand but not yet
    public-grade financial transparency.”'
