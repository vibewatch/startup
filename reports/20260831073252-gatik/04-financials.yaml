- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Recognized revenue
    - 'null'
    - low
    - Backlog does not reveal actual revenue timing or scale.
    - Request monthly and annual recognized revenue since commercial launch.
  - - Gross margin / contribution margin
    - 'null'
    - low
    - Determines whether route density and autonomy actually create economic value.
    - Request gross margin and contribution margin by mature vs ramping route.
  - - Revenue per truck / per mile / per route
    - 'null'
    - low
    - Needed to compare Gatik against incumbent carriers and AV peers.
    - Request billing unit, realized price, and invoice yield by customer.
  - - Utilization / truck-hours productive
    - near-24-hour operations claimed, but quantified fleet utilization unavailable
    - medium
    - Utilization is the main bridge from autonomy to margin expansion.
    - Request dispatched hours, downtime, and loaded vs empty utilization by route.
  - - Hardware + maintenance cost burden
    - 'null'
    - low
    - Determines whether autonomy adds durable margin or simply shifts cost mix.
    - Request depreciation, maintenance, sensor refresh, and spare-parts cost per truck.
  - - Insurance / incident cost burden
    - 'null'
    - low
    - Insurance can erase route margin if loss rates remain high or uncertain.
    - Request premiums, retentions, and incident-cost history by operating state.
  - - Commercialization / customer-acquisition payback
    - 'null'
    - low
    - Enterprise deployments can look attractive on backlog but remain slow to pay back.
    - Request CAC proxy, deployment cost, and payback by customer cohort.
  notes: Nulls are deliberate. The absence of core unit-economics disclosure is one of the chapter’s principal diligence findings.
