- id: financial-verdict-and-blockers
  title: Financial verdict and diligence blockers
  body: 'The public financial case for Gatik is good enough to justify serious diligence and incomplete enough to prevent confident underwriting. On the positive side, the company has real route-level commercial activity, a service-based monetization model, meaningful backlog, named enterprise customers, and a scaling plan backed by capital and manufacturing partners. That is a much stronger starting point than a pre-revenue autonomy company talking only about future pilots. The $600 million contracted-revenue figure, if durable, suggests enterprise customers are willing to place sizable commercial bets on the service.


    But the negative space in the dataset is just as important. There is still no public recognized revenue figure, no route-level contribution margin, no cohort expansion data, no churn or renewal disclosure, no cash balance, no debt picture, and no disclosed per-truck deployment cost. Investors therefore have to separate “credible commercial traction” from “verified financial efficiency.” Gatik clearly has the first. The second is still unproven in public. The bottom-line view is that Gatik looks like a real, scaling autonomous-freight operator with meaningful demand, but also like a company that still needs private diligence on revenue conversion, pricing, gross margin, and capital needs before anyone can treat the current backlog and funding narrative as sufficient proof of durable economics.'
