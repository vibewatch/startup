figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: standard
  summary: The economic bridge runs from contracted route commitments to executed orders and only then to recognized revenue and gross profit.
  data:
    nodes:
    - id: master-contract
      label: Master customer agreement
      detail: Multi-year relationship and route scope with a large shipper
      type: input
    - id: committed-capacity
      label: Committed route / truck capacity
      detail: Take-or-pay or minimum-service commitments improve visibility
      type: process
    - id: executed-orders
      label: Executed route miles and orders
      detail: Revenue only materializes when live freight moves occur on active routes
      type: process
    - id: recognized-revenue
      label: Recognized service revenue
      detail: Economic value must convert from backlog into invoiced transportation service
      type: process
    - id: gross-profit
      label: Gross profit after service delivery costs
      detail: Margin depends on utilization, service cost, and contract structure
      type: output
    edges:
    - from: master-contract
      to: committed-capacity
      label: contract framework
    - from: committed-capacity
      to: executed-orders
      label: deployment and ramp
    - from: executed-orders
      to: recognized-revenue
      label: service performance
    - from: recognized-revenue
      to: gross-profit
      label: cost absorption
  approximationNotes: Aurora’s filings provide the clearest public analog for over-time revenue recognition, but Gatik has not published its own GAAP policy. The flow therefore separates supported commercial logic from unverified accounting detail.
