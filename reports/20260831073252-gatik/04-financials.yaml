- id: pricing-and-gtm-economics
  title: Pricing opacity and GTM economics
  body: 'Gatik’s public materials say much more about what customers get than about what they pay. No retained source publishes a per-mile rate card, per-route price, list price, discounting practice, or realized contribution margin. That makes pricing one of the most important diligence gaps in the entire report. Even so, the packaging logic is visible. Gatik appears to sell accountable route capacity under enterprise contracts, often with multi-year or take-or-pay characteristics. That is a very different commercial motion from enterprise SaaS and also different from a pure AV-driver licensing strategy. The buyer is not a CIO seeking software seats; it is a supply-chain or transportation organization seeking dependable freight execution.


    This has direct implications for sales efficiency. The GTM motion is almost certainly high-touch, operationally specific, and slow by software standards. The 2024 commercialization hire is itself a signal: Gatik explicitly said it wanted to safely scale its ATaaS business and deploy Freight-Only operations for Fortune 500 customers, which implies complex expansion planning rather than self-serve growth. PepsiCo, Loblaw, Tyson, and Kroger-style deployments require network design, safety review, stakeholder coordination, and route densification before scale economics improve. That is why backlog quality matters more than vanity pipeline. If Gatik’s contracts include real minimums and durable expansions, customer acquisition costs can be amortized over large route programs. If not, the company could still be carrying a very expensive enterprise-sales and deployment machine without public proof of payback. Today, the public record supports the first half of that story more strongly than
    the second.'
