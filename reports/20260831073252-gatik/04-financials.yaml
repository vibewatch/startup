- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  - Implication
  rows:
  - - Managed route-capacity contract
    - Realized pricing unknown; no public rate card
    - Per-mile, per-route, and minimum-volume terms undisclosed
    - Gatik / customer public announcements
    - Economics must be inferred from backlog and operating scale rather than price sheets.
  - - Take-or-pay commitment structure
    - Visible in reported contract language, not quantified by individual deal
    - Minimums, cancellation rights, and ramp schedules unknown
    - Transport Topics interview reporting
    - Suggests better revenue quality than pilots, but exact downside protection is unproven.
  - - PepsiCo-scale enterprise deployment
    - Deployment scope public; commercial pricing not public
    - Discounting, exclusivity, and SLA terms unknown
    - PepsiCo + TechCrunch
    - Shows customer willingness to deploy at scale without revealing route economics.
  - - 'Aurora DaaS proxy: fee per mile or similar'
    - Public long-term model stated in filings
    - Aurora is only a proxy, not Gatik’s contract template
    - Aurora 10-K / 10-Q
    - Supports the idea that AV freight may monetize more like a service subscription than a software license.
  - - Fuel / surcharge pass-through mechanics
    - No public evidence for Gatik-specific pass-through
    - Carrier-style pass-through may exist but is not disclosed
    - J.B. Hunt proxy filings
    - Margin sensitivity to fuel could still matter if Gatik owns service outcome.
  notes: Public pricing opacity is itself a conclusion. Realized pricing quality cannot be inferred from backlog figures alone.
