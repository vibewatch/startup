- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Recognized revenue by quarter and by customer
    - Cannot map backlog to actual revenue conversion
    - Request audited revenue history and backlog waterfall.
  - - Gross margin and contribution margin by mature route
    - Cannot test whether autonomy beats incumbent service economics
    - Request route-level P&Ls split by launch, mature, and expansion phases.
  - - Cash balance, burn, and runway case
    - Cannot verify capital adequacy claims
    - Request monthly cash-flow model and board runway materials.
  - - Deployed capital per truck and sensor refresh cost
    - Cannot estimate scale-up financing burden
    - Request capex / lease / retrofit costs per truck generation.
  - - Customer concentration and renewal detail
    - Cannot judge fragility of commercial traction
    - Request customer revenue concentration, churn, and expansion metrics.
  - - Insurance, claims, and incident reserve structure
    - Cannot quantify downside risk to route economics
    - Request policy terms, historical claims, and reserve methodology.
  notes: Each missing metric directly blocks a different part of the underwriting process; these are not generic “nice to have” requests.
