  - - Grocery / food retail
    - Distribution, fulfillment, and merchandising operations
    - Store replenishment, e-commerce fulfillment, pharmacy/grocery flow
    - Supported by Kroger and Loblaw
    - Strong strategic value because route density matches Gatik’s ODD
    - Direct customer-side proof for Kroger is weaker than for Loblaw.
  - - CPG / beverage
    - Private-fleet and transportation teams
    - Regional food and beverage site-to-site movement
    - Large 2026 PepsiCo partnership
    - Very high strategic value as a scaled enterprise deployment
    - Truck count and account economics are still only partly public.
  - - Protein / refrigerated foods
    - Transportation and cold-chain logistics teams
    - Plant-to-storage and storage-to-DC transfers
    - Tyson runs multiple trucks 18 hours/day in Arkansas
    - Shows cold-chain and class-7 extension beyond dry retail
    - No public route-level margin or expansion history.
