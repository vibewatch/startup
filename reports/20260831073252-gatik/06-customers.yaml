    - Short-haul B2B logistics
    - Pitney Bowes, Georgia-Pacific, KBX named historically
    - Suggests broader experimentation beyond current flagship logos
    - Current production status for these names is unclear.
  - - Cross-border / Canadian retail and pharmacy
    - Regional distribution and regulatory stakeholders
    - Dense GTA replenishment across grocery and pharmacy stores
    - Loblaw to 300+ stores via 50-truck plan
    - Important proof of geographic portability and regulatory collaboration
    - Still one customer dominating the visible Canadian proof set.
