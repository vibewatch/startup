  evidenceGaps:
  - type: partial-enumeration
    severity: material
    topic: full-customer-roster
    missingEvidence: The named-customer proof table covers only the publicly disclosed flagship accounts, not the full active customer base.
    whyItMatters: A small visible set can overstate diversification and understate account attrition or stalled pilots.
    diligencePath: 'Request the full customer roster by status: pilot, commercial, driverless, paused, and churned.'
    relatedQuestionRefs:
    - QU006
    - QU011
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: No public NRR, GRR, churn, renewal, or cohort satisfaction metrics are disclosed.
    whyItMatters: Without retention metrics, visible continuity among a few logos cannot be converted into portfolio-level durability.
    diligencePath: Request retention and renewal metrics by cohort, plus expansion revenue versus new-logo revenue.
    relatedQuestionRefs:
    - QU010
    - QU021
    - QU022
    relatedTableRefs:
    - TU004
    relatedFigureRefs:
    - FU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: No public top-customer revenue mix, route-volume mix, or account-level backlog data.
    whyItMatters: Concentration risk could materially affect utilization, margin, and valuation if one flagship account slows or exits.
    diligencePath: Request revenue and contracted-volume concentration by top 1, 3, and 5 accounts.
    relatedQuestionRefs:
    - QU012
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: conversion-funnel
    missingEvidence: Public sources do not disclose how many prospects convert to pilots, how many pilots reach commercial launch, or how many launches expand.
    whyItMatters: It is hard to estimate sales efficiency and future customer growth without funnel conversion data.
    diligencePath: Request stage-conversion metrics, sales-cycle length, and implementation timelines by cohort.
    relatedQuestionRefs:
    - QU013
    relatedFigureRefs:
    - FU002
  - type: missing-source
    severity: minor
    topic: customer-level-economics
    missingEvidence: No public per-account revenue, margin, SLA penalty, or pricing realization data.
    whyItMatters: A customer base can be strategically impressive while still being uneconomic to serve at scale.
    diligencePath: Request customer P&Ls for mature vs ramping programs.
    relatedQuestionRefs:
    - QU021
    - QU024
    relatedTableRefs:
