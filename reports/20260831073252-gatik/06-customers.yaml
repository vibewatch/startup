- id: adoption-and-customer-proof
  title: Adoption trajectory and reference quality
  body: >-
    Public evidence suggests Gatik has crossed the line from pilot theater into repeat operational use. The strongest proof is not a single metric but the accumulation of different ones: tens of thousands of fully driverless orders, high on-time-delivery claims, named live deployments, customer-side endorsements, and route-specific descriptions that would be hard to fake if the service were not actually embedded in logistics operations. PepsiCo and Loblaw stand out as the best current proof of scaled enterprise adoption. PepsiCo’s 2026 announcement frames the partnership as a major commercial deployment inside a large North American food and beverage network. Loblaw’s 2025 expansion is even more specific, with truck counts, store counts, and a five-year commitment. Tyson and Kroger add workflow depth in cold chain and grocery fulfillment, while Walmart remains the earliest historical proof point.


    The important nuance is that proof quality varies by account. Some deployments have direct customer releases and quantified expansion detail. Others are confirmed mostly through Gatik or secondary coverage. That means reference quality is not uniform. Still, the customer chapter is one of the strongest parts of the whole Gatik diligence package because it contains genuine named logos with workflow detail, not anonymous “enterprise partners” or lab-grade pilots.
