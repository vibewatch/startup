- id: expansion-concentration-and-procurement
  title: Expansion logic is attractive, but concentration is a real risk
  body: >-
    The customer motion appears attractive because it compounds inside existing accounts. Once Gatik is trusted on one corridor, the same customer can add more routes, more stores, more vehicles, more product classes, and eventually more geographies. That is visible in Loblaw, PepsiCo, and likely in the broader shift from early fixed-route retailer work toward larger regional logistics networks. This kind of land-and-expand dynamic can make a high-touch go-to-market motion worthwhile.


    But the same model creates concentration risk. The public evidence clusters around a handful of very large logos, and Gatik does not reveal customer-level revenue mix or enough of the broader roster to let outsiders estimate exposure with confidence. TechCrunch’s note that the company would not name all customers is especially relevant here. If one or two enterprise accounts make up a large share of booked volume, customer risk could transmit directly into utilization, margins, and valuation. The underwriting view should therefore separate two ideas: Gatik clearly has strong customer proof, but it has not yet provided enough disclosure to prove that the customer base is broadly diversified.
  claimRefs:
  - CU015
  - CU016
  - CU027
  - CU028
  - CU031
  - CU032
  - CU037
  - CU038
  tableRefs:
  - TU005
- id: customer-verdict
  title: 2026 customer verdict
  body: >-
    Gatik’s customer base is one of the company’s strongest diligence areas. The logos are credible, the workflows are real, and the evidence of repeat expansion is stronger than what is usually available for private autonomy companies. The company appears to have solved for a buyer that has urgent pain and enough network density to benefit from autonomous middle-mile freight now, not someday.


    The caution is that this is still a flagship-account story. The retained public record does not reveal full roster breadth, revenue concentration, net retention, or customer-level economics. So the conclusion is not “customer risk is solved.” It is “customer demand appears real and valuable, but customer diversification still needs private-data confirmation.”
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU038
