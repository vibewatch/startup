- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Add more routes within one customer network
    - A small number of large logos may dominate revenue
    - High impact on utilization and visibility if one program stalls
    - Request revenue concentration by top 1, 3, and 5 accounts.
  - - Add more stores / sites served
    - Expansion may depend on customer site readiness and regulatory comfort
    - Medium-high impact on deployment timing
    - Request account-level rollout schedules and dependencies.
  - - Add more trucks per account
    - Fleet growth could outpace customer demand or vice versa
    - High impact on capital efficiency
    - Request truck-allocation plans by customer and market.
  - - Expand from pilot corridor to regional network
    - Some logos may scale while others remain narrow
    - Medium impact on sales efficiency and proof quality
    - Request cohort conversion from first route to multi-route expansion.
  - - Broaden to more verticals
    - Current public proof clusters in retail/grocery/CPG
    - Medium impact on TAM realization and concentration narrative
    - Request current active accounts by vertical and status.
  notes: The risk table focuses on concentration and expansion mechanics rather than generic enterprise sales risk.
