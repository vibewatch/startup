company:
  name: Gatik
chapter:
  number: 6
  title: Customers
  summary: Gatik’s customer evidence is unusually strong for a private autonomous-freight company. The retained source set supports a concentrated but high-quality base of large retailers, grocers, and CPG operators, with substantive named proof from Walmart, Kroger, PepsiCo, Tyson Foods, and Loblaw. Public adoption metrics—60,000 fully driverless orders by January 2026, 85,000+ by August 2026, and high on-time-delivery claims—suggest the company has moved beyond pilot-stage ambiguity. The best public account-quality signals come from PepsiCo and Loblaw, both of which validate the relationship from the customer side and frame it as multi-year or expansionary. The main underwriting gap is not demand credibility; it is disclosure. Gatik does not publish NRR, churn, revenue concentration, or a full customer roster, so investors must assume meaningful flagship-account concentration until private diligence proves otherwise.
sections:
- id: customer-base-and-segmentation
  title: Who buys Gatik and what jobs they hire it to do
  body: >-
    Gatik’s customer base looks narrow by count but strong by quality. The retained source set consistently points to very large enterprises—retailers, grocers, and CPG operators with dense regional distribution needs—rather than to a broad base of small or mid-sized shippers. That is exactly what the product should attract. Gatik is not selling a self-serve software seat; it is taking responsibility for moving freight inside demanding supply chains. The buyer therefore appears to be a transportation, supply-chain, or distribution executive. The user is the customer’s operating network: fulfillment centers, distribution centers, storage nodes, and stores that need frequent, repeatable replenishment.


    The segmentation evidence is also richer than a simple “retail” label suggests. Walmart and Kroger prove retailer and grocery replenishment value. Loblaw shows the model works inside one of Canada’s largest grocery and pharmacy networks. PepsiCo proves fit for a large CPG private-fleet environment. Tyson demonstrates refrigerated protein and plant-to-storage workflows. Together, those accounts show the product is specialized by network shape, not by one single commodity. The limitation is transparency. While the flagship logos are credible, Gatik discloses far less about the full roster, account mix, or customer revenue concentration than a public investor would want.
  claimRefs:
