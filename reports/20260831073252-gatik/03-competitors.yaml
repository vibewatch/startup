- id: pricing-lockin-and-distribution
  title: Pricing opacity, packaging models, and route-level lock-in
  body: >-
    Public pricing transparency across autonomous trucking remains weak. None of the core competitors in this evidence set publish list pricing that would let an outside analyst compare per-mile rates, uptime guarantees, service-level discounts, or margin sharing. That forces a better question: what are customers actually buying? Gatik appears to sell managed autonomous freight capacity aligned to customer networks. Aurora appears closer to an autonomous-driver integration model inside existing fleets. Torc appears to combine an autonomous driver with command and oversight layers through OEM-linked delivery. Einride sells a broader bundle that mixes autonomous fleets, software, oversight, and human-driven electric assets. Outrider and logistics incumbents sell productivity, capacity, and operational certainty rather than driverless middle-mile miles.


    This packaging difference is strategically important because it shapes switching cost. Once a route is integrated into dock schedules, safety approvals, exception playbooks, remote support procedures, and vehicle planning, replacing the provider is no longer a simple rate-card exercise. The lock-in is not absolute: a large shipper could multi-home across providers at a portfolio level, especially by geography or use case. But single-route replacement should be harder than many outsiders assume because insurers, regulators, first responders, and facility operators all become part of the operating system. OEM access deepens that effect. Gatik’s Isuzu path, Torc’s Freightliner integration, and Waabi’s Volvo alignment all show that distribution power in this market is partly about who can industrialize the vehicle and service stack, not just who can train the better model.
