  - - Kodiak
    - Public price unknown; platform-style commercialization not publicly detailed here
    - AI autonomy platform across multiple domains
    - Retail-middle-mile commercial terms unknown
    - Broad platform optionality may support multiple monetization paths.
  - - Waabi
    - Public price unknown; business model not explicitly detailed in retained source
    - Physical AI platform and trucking partnerships
    - Commercial packaging in trucking remains an evidence gap
