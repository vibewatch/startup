company:
  name: Gatik
chapter:
  number: 3
  title: Competitors
  summary: 'Gatik competes in a fragmented landscape where the real alternatives range from direct middle-mile autonomy specialists to long-haul AV-driver platforms, adjacent automation vendors, and giant human-driven logistics incumbents. Its clearest differentiation is not broad autonomy ambition but commercially proven medium-duty middle-mile service for named shippers, reinforced by public safety-process disclosure and an Isuzu manufacturing path. The vulnerabilities are equally clear: pricing remains opaque, better-capitalized generalists like Waabi and broad incumbents like Ryder, Penske, and J.B. Hunt can attack from adjacent positions, and sector-wide AV trust shocks could weaken the whole category before Gatik converts commercial proof into route-level lock-in.'
sections:
- id: landscape-and-boundaries
  title: Landscape, overlap, and substitute boundary
  body: >-
    The biggest competitive mistake with Gatik is to define every self-driving truck company as equally direct competition. The job Gatik is actually selling is reliable middle-mile freight movement between managed facilities, especially in retail, grocery, and CPG networks where loading points, receiving windows, and route repetition matter. That makes the landscape broader than direct AV peers but more segmented than generic autonomy commentary suggests. The field breaks into four groups. First are direct middle-mile or service-operator analogs, where Gatik’s public customer proof is most relevant. Second are long-haul AV-driver providers such as Aurora, Torc, Kodiak, and Waabi, which pursue broader autonomy platforms and often different vehicle classes or operating domains. Third are adjacent automation vendors such as Einride and Outrider that automate overlapping logistics workflows without matching Gatik’s exact product shape. Fourth are the status-quo substitutes: private fleets,
    dedicated contract carriers, and logistics incumbents like Ryder, Penske, and J.B. Hunt.


    That segmentation matters because customers do not buy “autonomy” in the abstract. They buy capacity, reliability, and operational accountability. In some cases that means Gatik is competing against another AV stack; in others it is competing against a 3PL contract, a leased fleet, or a shipper’s existing private-fleet playbook. Waymo illustrates the point from the other side: it remains a serious technology benchmark and talent magnet, but its visible public footprint in this evidence set is ride-hail and AV research rather than named middle-mile freight operations. So the competitive boundary has to be drawn around the customer’s logistics job, not around technical branding alone.
