- id: moat-durability-and-underwriting
  title: Moat durability, adverse evidence, and underwriting conclusion
  body: >-
    Gatik’s moat is strongest where generic AV players are weakest: route-specific commercial proof, named shipper trust, a middle-mile operating model, and medium-duty OEM alignment. Its published driverless-order volume, 99% on-time claim, named customers, TÜV SÜD-reviewed safety methodology, and Isuzu production path collectively create a more concrete operating story than many autonomy companies provide. That is meaningful because customers evaluating freight automation care about service accountability as much as technical novelty. In a narrow wedge, those facts can outweigh broader but less commercialized platform claims.


    Still, durability is far from solved. Waabi’s 2026 funding signal shows that some adjacent competitors can outspend Gatik. Aurora, Torc, Kodiak, and Einride can all move toward overlapping territory if middle-mile economics prove compelling enough. Logistics incumbents can blunt adoption urgency by offering capacity, leasing, and managed-service substitutes at enormous scale. And because AV trust is socially and regulatorily correlated, a damaging event elsewhere in autonomy can slow Gatik even if Gatik itself executes well. The key adverse insight is that Gatik’s commercial credibility does not yet equal proven pricing power or exclusivity. The best underwriting view is therefore a balanced one: Gatik is unusually credible for its chosen wedge, but the moat only hardens if that credibility becomes route-level lock-in before better-capitalized generalists or incumbents close the gap.
