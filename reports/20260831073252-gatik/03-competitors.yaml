  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-and-margin
    missingEvidence: No public contract pricing, realized per-mile economics, gross margin, or discounting terms for Gatik or most direct peers.
    whyItMatters: Without realized pricing, analysts cannot tell whether competitive advantage comes from technology, financing, safety trust, or price concessions.
    diligencePath: Request signed customer contracts, pricing schedules, and margin contribution by route cohort.
    relatedQuestionRefs:
    - QP008
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: route-level-lock-in
    missingEvidence: Public evidence does not show contract duration, exclusivity, or actual switching behavior for autonomous middle-mile routes.
    whyItMatters: Moat durability depends on whether a deployed route becomes sticky or can be rebid quickly to another provider or incumbent carrier.
    diligencePath: Request route-level contract terms, renewal history, and any exclusivity or right-of-first-refusal clauses.
    relatedQuestionRefs:
    - QP011
    - QP012
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: oem-partner-terms
    missingEvidence: The public record confirms OEM relationships, but not allocation priority, volume commitments, or exclusivity terms across Gatik and peers.
    whyItMatters: Vehicle-platform access could become a decisive moat or a weak non-exclusive partnership depending on the commercial terms.
    diligencePath: Review OEM agreements for volumes, milestones, exclusivity, and termination rights.
    relatedQuestionRefs:
    - QP010
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: peer-safety-comparability
    missingEvidence: Competitors differ widely in what they disclose publicly about safety process, safety cases, or incident readiness.
    whyItMatters: Public trust comparisons may over-favor the companies that disclose more rather than the companies that are objectively safer.
    diligencePath: Request standardized safety-diligence packets from each serious competitor or benchmark.
    relatedQuestionRefs:
    - QP009
    relatedTableRefs:
    - TP002
  - type: stale
    severity: minor
    topic: waymo-freight-status
    missingEvidence: The retained public Waymo sources are sufficient to classify Waymo as an adjacent benchmark, but not enough to rule out a future freight re-entry decisively.
    whyItMatters: A re-entry by a large-cap AV player could change the competitive picture quickly.
    diligencePath: Monitor 2026–2027 Waymo partner, fleet, or freight announcements for re-entry signals.
    relatedQuestionRefs:
