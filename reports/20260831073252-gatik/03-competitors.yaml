  rows:
  - - Gatik
    - Public price unknown; appears service-contracted freight capacity
    - Autonomous vehicle, route operations, service accountability
    - Per-mile, per-route, and SLA economics undisclosed
    - Competes on operational outcome, but outside analysts cannot verify margin quality.
  - - Aurora
    - Public price unknown; appears AV-driver integration model
    - Self-driving system added to fleet operations
    - No public rate card or contract template in source set
    - Could appeal to fleets wanting to keep asset/control layer in-house.
  - - Torc
    - Public price unknown; appears OEM-integrated AV plus oversight tooling
    - Autonomous driver, command layer, operational support
    - Commercial contract shape not publicly clear
