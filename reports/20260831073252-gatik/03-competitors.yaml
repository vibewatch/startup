callouts:
- calloutType: strength
  title: Gatik’s moat is operational proof, not maximal AV ambition
  body: Among public competitors, Gatik stands out less for the broadest autonomy roadmap than for shipping a narrower middle-mile product with named customers, public safety-process detail, and route-specific proof. In this market, those facts matter more than generic AI breadth.
  claimRefs:
  - CP020
  - CP021
  - CP031
  - CP039
- calloutType: risk
  title: Pricing opacity is a real competitive blind spot
  body: Neither Gatik nor most peers publish contract economics, so outside analysts cannot tell whether future competition will be won on uptime, financing, safety trust, or simple per-mile price concessions. Commercial proof alone does not solve that underwriting gap.
  claimRefs:
  - CP022
  - CP023
  - CP024
  - CP026
  - CP034
- calloutType: risk
  title: The most dangerous substitute may still be a boring human-driven contract
  body: Ryder, Penske, J.B. Hunt, and private fleets already deliver the core job—reliable freight movement—at huge scale. Gatik must prove not just technical viability but enough utilization or service advantage to overcome incumbent comfort.
  claimRefs:
  - CP018
  - CP037
  - CP042
- calloutType: risk
  title: Category trust is correlated across autonomy companies
  body: A bad event or policy shock affecting another AV player can still slow Gatik’s adoption, because insurers, policymakers, and customers often react at the category level before they react at the company level.
  claimRefs:
  - CP035
  - CP042
