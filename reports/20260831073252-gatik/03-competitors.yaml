tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / substitute
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Gatik
    - Direct middle-mile autonomy
    - 85k+ fully driverless orders; $200M Series D; $600M+ contracted revenue claims
    - Retail, grocery, CPG regional freight
    - Commercial proof on medium-duty middle-mile with named shippers
    - Narrower route scope and limited public pricing transparency.
  - - Aurora
    - Long-haul AV-driver platform
    - Customer freight hauled today; broad fleet-integration narrative
    - Carrier and fleet highway freight
    - Driverless-freight positioning with 24/7 utilization promise
    - Less obviously tailored to Gatik’s store-replenishment workflow.
  - - Torc Robotics
    - Long-haul OEM-integrated AV platform
    - Daimler / Freightliner integration
    - Freight operators using heavy-duty platforms
    - Deep OEM embedding plus oversight stack
    - More long-haul and heavy-duty than Gatik’s core wedge.
  - - Kodiak AI
    - Broad ground-autonomy platform
    - 2026 permit and driverless deployment momentum
    - Trucking, industrial, defense logistics
    - Platform breadth and optionality across domains
    - Public evidence is less retail-middle-mile specific than Gatik’s.
  - - Waabi
    - Generalist AV / Physical AI platform
    - $1B funding announcement on homepage in 2026; Volvo partner signal
    - Autonomous trucking and robotaxis
    - Large capital base and platform ambition
    - Commercial middle-mile proof appears less concrete in this source set.
  - - Einride
    - Integrated autonomous + electric freight service
    - Operational on roads in Europe and the U.S.
    - Industrial shippers, retailers, ports, logistics hubs
    - Broader bundle across autonomy, EVs, and software
    - Different product mix can dilute direct comparability to Gatik.
  - - Outrider
    - Adjacent yard automation
    - Operational productivity story, not road-autonomy scale
    - Distribution yards and logistics facilities
    - Automates yard safety, turn time, and asset tracking
    - Does not replace public-road middle-mile miles.
  - - Ryder / Penske / J.B. Hunt
    - Status-quo incumbent substitute
    - Massive fleets, locations, employees, and managed-logistics scale
    - Any shipper needing dependable freight capacity
    - Service certainty, maintenance, leasing, and procurement trust
    - No public-road autonomous middle-mile offer in this evidence set.
  - - Internal build / private fleet
    - Substitute path
    - Backed by customer-owned assets and ops teams
    - Large shippers with dedicated networks
    - Can preserve control over service design
    - AV-stack, safety, and insurance burden is usually outside shipper core competence.
  notes: Rows compare product families rather than pretending every participant sells the exact same unit economics.
