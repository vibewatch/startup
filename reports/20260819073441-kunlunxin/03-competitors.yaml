  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - moat claim
      - threat
      - severity
      - mitigation/diligence ask
    rows:
      - - Baidu-ecosystem DeepSeek integration (P800 trained Wenxin 4.5/5.1 on an all-domestic stack)
        - >-
          DeepSeek-model compatibility has become table stakes: Huawei, Cambricon, Moore Threads, and others all
          matched same-day DeepSeek-V4 adaptation in April 2026.
        - high
        - Assess what differentiates Kunlunxin's DeepSeek integration beyond same-day compatibility (e.g., cost,
          latency, cluster efficiency at scale).
      - - Cross-rival customer validation (Tencent sourcing P800 chips in 2026)
        - >-
          A single marquee customer win does not by itself establish durable share versus Huawei's much larger
          shipment base.
        - medium
        - Track whether Tencent's order becomes a recurring, scaling relationship or remains a one-off validation
          purchase.
      - - Full-stack CUDA-alternative software (XTCL/XBLAS/XDNN)
        - >-
          Huawei's CANN and Moore Threads' MUSA are more mature, more publicly documented software ecosystems with
          dedicated migration tooling (Musify).
        - medium
        - Request independent developer-adoption data (contributors, migration case studies) for Kunlunxin's stack
          versus CANN/MUSA.
      - - Manufacturing access via SMIC
        - >-
          SMIC reportedly prioritizes Huawei's wafer allocation over other domestic customers including Cambricon
          and Kunlunxin, a structural disadvantage smaller vendors cannot easily replicate.
        - high
        - Confirm Kunlunxin's specific wafer-allocation priority and any long-term supply agreement with SMIC.
      - - Scale (shipment volume)
        - >-
          Kunlunxin's ~116,000-unit 2025 shipment volume is a distant third behind Huawei (~812,000) and Alibaba
          T-Head (~265,000), the weakest scale position among the top domestic vendors.
        - high
        - Track 2026 shipment data to see whether Kunlunxin's external-customer wins translate into share gains.
      - - Direct US export-control exposure
        - >-
          Biren Technology's 2023 Entity List designation shows precedent for a Chinese AI chipmaker facing direct
          US restriction as its profile and export-relevant capability grow.
        - medium
        - Monitor BIS Entity List updates specifically for Kunlunxin, distinct from broader sector-wide China
          semiconductor restrictions.
    notes: >-
      Severity ratings are this report's own qualitative assessment based on the evidence cited; rows are ordered
      by descending severity as required for this table type.
