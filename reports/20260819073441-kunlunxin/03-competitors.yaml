  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - vendor
      - price/unit or contract model
      - included capabilities
      - discount or unknowns
      - implication
    rows:
      - - Kunlunxin P800
        - No public list price; sold via direct enterprise/cloud contracts (e.g., China Mobile centralized tender)
        - Chip plus XTCL/XBLAS software stack plus cluster integration support
        - No disclosed unit pricing or discount structure
        - Pricing opacity is standard across all domestic vendors; comparisons must rely on BOM-cost proxies.
      - - Alibaba T-Head PPU
        - Not sold standalone; embedded in Alibaba Cloud instances
        - Cloud-instance-level access; Alibaba Cloud reportedly plans ~50% inference price cuts using domestic chips
        - Underlying chip unit economics not disclosed
        - Suggests aggressive cloud-price competition once domestic chips reach cost parity with Nvidia.
      - - Moore Threads MTT S80 (consumer-grade reference point)
        - Consumer GPU pricing, roughly comparable tier to Nvidia RTX 3060
        - Graphics plus AI compute in one card
        - Enterprise/datacenter-card pricing not disclosed
        - Only domestic vendor with a public consumer-price reference point for rough BOM/positioning comparison.
      - - Huawei Ascend
        - No public list price; large-scale government/enterprise procurement contracts
        - Chip plus CANN stack plus systems integration
        - No disclosed unit pricing
        - SMIC production-priority status may give Huawei a structural cost advantage not visible in list pricing.
      - - Nvidia H20 (status quo reference)
        - Historically export-licensed sales; intermittent availability in China
        - Full CUDA ecosystem access
        - Subject to a reported 15% US Treasury fee on licensed sales
        - Sets the performance/ecosystem bar every domestic vendor is priced and marketed against.
    notes: >-
      No vendor in this table (including Kunlunxin) publishes standalone unit list pricing; figures are proxies
