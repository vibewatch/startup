company:
  name: Kunlunxin
chapter:
  number: 3
  title: Competitors
  summary: >-
    Kunlunxin competes in a crowded field of Chinese domestic AI chip vendors -- led at scale by Huawei Ascend and
    at valuation by the newly public Cambricon and Moore Threads -- while Nvidia's export-restricted hardware
    remains the status-quo benchmark every domestic chip is measured against. Kunlunxin's differentiation rests on
    Baidu's internal DeepSeek-class workload and a widening external customer list, but it trails Huawei by roughly
    7x on 2025 shipment volume and lacks Huawei's SMIC production priority, Cambricon's public listing, or Moore
    Threads' full-stack graphics-plus-AI positioning.
sections:
  - id: competitive-landscape
    title: Competitive landscape overview
    body: >-
      Kunlunxin's competitive set spans direct domestic peers, the dominant incumbent, and the export-restricted
      status quo. Huawei's Ascend line (910B/910C, and the newer Atlas 350) is the domestic incumbent, backed by
      Huawei's own CANN software stack and SMIC's production priority. Cambricon and Moore Threads are the two
      domestic peers that have already gone public (Cambricon on Shanghai's STAR Market historically, Moore Threads
      via a December 2025 STAR Market debut), each reaching valuations far above Kunlunxin's private mark. Biren
      Technology and Iluvatar CoreX both completed Hong Kong listings in the same December 2025-January 2026 window
      Kunlunxin is targeting, while Enflame Technology and Alibaba's in-house unit T-Head (Pingtouge) remain in
      pre-IPO or internal-only stages. Beyond these direct peers, the status quo alternative for any Chinese buyer
      is simply continuing to source Nvidia (and to a lesser extent AMD) chips where export licenses or offshore
      cloud rental permit it, or building chips fully in-house rather than buying from any of the above vendors.
      Collectively, at least six AI chip companies either listed or advanced a public listing process between
      December 2025 and June 2026, and the combined market value of the "domestic GPU legion" (Cambricon, Moore
      Threads, Biren, Enflame, Hygon, and others) was approaching RMB 2 trillion by mid-2026 -- a valuation wave
      Kunlunxin's own IPO is explicitly riding.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
    tableRefs:
      - TP001
  - id: capability-pricing
    title: Capability, pricing, and go-to-market comparison
    body: >-
      On raw capability, Huawei's Ascend 910C delivers roughly 60-80% of Nvidia H100 inference performance according
      to independent comparisons, and Huawei's newer Atlas 350 was claimed by Huawei's own Ascend Computing Business
      president to reach 2.87x the performance of Nvidia's China-specific H20 chip -- a claim that, if it holds,
      would reframe domestic-chip competitiveness away from a pure "percent of Nvidia's best" framing. Kunlunxin's
      P800 was independently estimated by Morgan Stanley at roughly 1,521 tokens/second on DeepSeek R1 inference,
      positioning it between Nvidia's H20 and A100 -- broadly comparable to Huawei's positioning but based on a
      single analyst estimate rather than a standardized benchmark. On software, every major domestic vendor has
      built (or is building) a CUDA-alternative stack: Huawei's CANN, Moore Threads' MUSA (with a "Musify" code
      migration tool), and Kunlunxin's own XTCL/XBLAS/XDNN stack. Pricing is largely opaque across all vendors since
      none publish list prices; the closest public reference points are Alibaba T-Head's claim of a bill-of-materials
      roughly 40% below Nvidia's H20 and Moore Threads' consumer-grade MTT S80 GPU pricing near Nvidia's RTX 3060
      tier. On go-to-market, Moore Threads and Biren both operate fabless models with full-stack ambitions (hardware
      plus software plus systems), while Kunlunxin's commercial motion still leans heavily on Baidu's own cloud and
      enterprise sales relationships rather than an independent channel.
    claimRefs:
      - CP007
      - CP008
      - CP009
