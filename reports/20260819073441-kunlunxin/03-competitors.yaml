    rows:
      - - Huawei Ascend (HiSilicon)
        - Direct domestic peer / incumbent leader
        - "~$12B AI chip revenue (2026 est.); Huawei subsidiary, not separately valued"
        - Hyperscalers, government, enterprise (broadest domestic segment)
        - "SMIC production priority; CANN software stack; largest domestic shipment volume (~812,000 units, 2025)"
        - Not independently listed; still trails Nvidia on absolute compute per CFR analysis.
      - - Cambricon (寒武纪)
        - Direct domestic peer, publicly listed
        - "RMB 630B-1T (~$88-140B) market cap (2026); RMB6.5B 2025 revenue, first annual profit"
        - Cloud AI inference, hyperscaler customers (ByteDance, Alibaba)
        - First domestic pure-play AI chipmaker to turn profitable and cross RMB1T market cap.
        - Trades at 200-373x trailing PE, an extreme valuation multiple versus global semiconductor peers.
      - - Moore Threads (摩尔线程)
        - Direct domestic peer, publicly listed
        - "RMB 282-310B (~$39-43B) market cap post-IPO (Dec 2025); ~RMB6B raised in IPO"
        - Full-stack GPU (AI + graphics + video), consumer and enterprise
        - Full-stack MUSA software ecosystem with Musify CUDA-migration tool; founder is ex-Nvidia VP.
        - Nearly RMB6B in accumulated losses over three years; heavily dependent on external financing.
      - - Biren Technology (壁仞科技)
        - Direct domestic peer, HKEX-listed (Jan 2026)
        - "~$2.2-2.9B pre-IPO valuation; ~RMB5B+ raised across rounds"
        - High-performance cloud AI training/inference (BR100/BR106 series)
        - First Chinese GPU with Chiplet, PCIe 5.0, and CXL support (BR100, 2022); DeepSeek-V3 full-stack support.
        - On the US Entity List since October 2023, constraining supply-chain access.
      - - Iluvatar CoreX (天数智芯)
        - Direct domestic peer, HKEX-listed (Jan 2026)
        - "~$5.2B post-IPO market cap; RMB1.03B 2025 revenue (+91.6% YoY)"
        - Cloud AI inference (ByteDance chatbot workloads)
        - ByteDance ordered 50,000+ units for inference; ~54% gross margin, among the highest of domestic peers.
        - Smaller scale than Huawei/Cambricon; concentrated exposure to a single large customer (ByteDance).
      - - Enflame Technology (燧原科技)
        - Direct domestic peer, pre-IPO (STAR Market review passed mid-2026)
        - "~$2.8B pre-IPO valuation (Dec 2024 Series E); targeting ~RMB6B STAR Market raise"
        - Cloud AI training/inference for hyperscaler and enterprise customers
        - Software-hardware co-design R&D investment; multi-generation chip roadmap (5th/6th-gen R&D funded by IPO.
        - Not yet independently profitable or listed as of the report run date.
      - - Alibaba T-Head / Pingtouge (平头哥)
        - Captive hyperscaler chip unit, IPO-track
        - Undisclosed standalone valuation; hundreds of thousands of PPU chips shipped cumulatively
        - Alibaba Cloud's own AI infrastructure, secondarily external cloud customers
        - PPU spec claims ~40% lower bill-of-materials cost than Nvidia H20; deep captive-cloud integration.
        - Financials not independently disclosed; success tied tightly to Alibaba Cloud's own AI roadmap.
      - - Nvidia (status quo / incumbent benchmark)
        - Status-quo substitute, not a domestic competitor
        - "~$3T+ global market cap; China AI accelerator share ~55% in 2025 (declining)"
        - Global hyperscalers and any China buyer able to obtain export-licensed or offshore-rented chips
        - CUDA ecosystem remains the software benchmark every domestic vendor is built to migrate away from.
        - Directly export-restricted in China; H20 access has been intermittent and politically contingent.
    notes: >-
      Scale/funding figures mix market capitalization, private valuation, and revenue depending on what each
      company discloses; treat cross-row comparisons as directional, not like-for-like multiples.
