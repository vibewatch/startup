schemaVersion: report-v2
artifact: market-analysis
slug: kunlunxin
runDate: '2026-08-19'
company:
  name: Kunlunxin
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Kunlunxin competes in China's fast-growing but policy-driven AI accelerator market, where domestic chipmakers'
    share of local shipments has already crossed 41% amid US export controls, and Huawei alone is projected to
    approach half of that domestic segment by 2026. Kunlunxin holds a small (~3%) shipment share behind Huawei and
    Alibaba, and durable growth depends on continued state "buy China" procurement, DeepSeek-driven inference demand,
    and constrained SMIC/HBM manufacturing capacity that caps how fast any domestic vendor can scale.
sections:
  - id: market-boundary
    title: Market boundary and adjacencies
    body: >-
      This chapter treats "the market" as China's domestic AI accelerator (training and inference chip) market --
      the segment of compute spend covering GPU/ASIC-class chips purchased by Chinese hyperscalers, state-owned
      enterprises, and government-linked data-center operators for AI workloads. It excludes general-purpose CPU
      servers, non-AI networking equipment, and non-China chip demand (Kunlunxin has no disclosed sales outside
      China). Adjacent but distinct markets include high-bandwidth memory (HBM) supply, advanced-node foundry
      capacity (SMIC, TSMC), and AI software/tooling ecosystems (CUDA and its domestic alternatives), all of which
      constrain rather than constitute accelerator demand. The status-quo substitute for any Chinese buyer is
      importing or renting Nvidia/AMD compute (directly, via the diminished H20 channel, or via offshore cloud
      rental in jurisdictions such as Southeast Asia); a second, policy-driven substitute is simply not adopting new
      AI infrastructure. IDC data reviewed by Reuters shows total 2025 China AI accelerator card shipments of
      roughly 4 million units split 55% Nvidia, 4% AMD, and 41% domestic Chinese vendors -- a market boundary that
      captures Kunlunxin's addressable opportunity without inflating it to "all of China AI spend."
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001
  - id: market-sizing
    title: Market sizing across multiple lenses
    body: >-
      No single TAM figure is reliable here, so this chapter preserves several sizing lenses rather than picking one.
      Bernstein modeling (via AI Gazine) puts China's AI accelerator market at $37 billion in 2025, growing to $55
      billion in 2026 and $69 billion in 2027, with domestic chip production rising from $16 billion (2025) toward
      $91 billion by 2028 against $88 billion of total national demand -- implying China could become a net exporter
      of AI accelerators within two to three years if the forecast holds. A second, unit-shipment-based lens (IDC via
      Reuters) shows roughly 4 million total accelerator cards shipped in China in 2025, of which domestic vendors
      shipped 1.65 million (41%); Huawei alone shipped about 812,000 units (roughly half of all domestic shipments,
      about 20% of the total market), Alibaba's T-Head shipped about 265,000, and Kunlunxin and Cambricon each shipped
      about 116,000 units -- placing Kunlunxin at only around 3% of total China accelerator shipments and a distant
      joint-third among domestic vendors. A third lens, TrendForce's qualitative tracking, expects domestic chips to
      exceed 50% of Chinese AI server deployments by the end of 2026. These lenses agree directionally (domestic
      share rising fast) but disagree by billions of dollars on absolute size, and none of them isolate a
      Kunlunxin-specific serviceable addressable market -- a gap this chapter carries forward as an explicit
      diligence ask rather than a manufactured SAM/SOM split.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyers-drivers
    title: Buyer segments, growth drivers, and adoption constraints
    body: >-
      Buyers of Chinese domestic AI accelerators fall into four groups with different budget owners and adoption
      triggers. Hyperscalers (Baidu, Alibaba, Tencent, ByteDance) are the largest and most sophisticated buyers,
      typically running a deliberate multi-vendor strategy -- ByteDance, for example, reportedly spends roughly
      $12.1 billion on AI chips in 2025 (rising toward $14.3 billion in 2026) split across Huawei for heavy training,
      Cambricon for mid-range inference, and Iluvatar CoreX (with Kunlunxin under evaluation) for chatbot inference,
      explicitly to hedge supply risk and optimize cost per workload. State-owned enterprises and government-linked
      buyers (China Mobile, State Grid entities, China Merchants Bank) form a second, policy-driven segment whose
      procurement is shaped by "Xinchuang" (信创) domestic-substitution mandates and centralized tender processes,
      exemplified by Kunlunxin's own RMB1 billion-plus China Mobile win. Automotive OEMs (BYD, Geely) form a smaller
      but strategically important third segment buying compute for ADAS and in-vehicle AI. National "East Data West
      Computing" (东数西算) infrastructure hubs and sovereign-compute-focused ministries are a fourth, subsidy-heavy
      buyer class. The dominant growth driver is US export control: the 2025 H20 ban (partially reversed with a 15%
      Treasury fee) and subsequent Entity List actions have repeatedly transferred addressable demand from Nvidia to
      domestic vendors, reinforced by a "Buy China" procurement preference and roughly $47.5 billion in Big Fund III
      state semiconductor financing. DeepSeek-class open models have created a second, demand-side driver by giving
      every domestic chip vendor a concrete, high-profile inference/training workload to court. The principal
      constraints are supply-side: SMIC's most advanced available domestic node (7nm, DUV-based) runs at an
      estimated 25-50% higher cost and meaningfully lower yield than TSMC's EUV equivalent, and it is capacity-
      constrained across Huawei, Cambricon, Biren, and other national-champion customers competing for the same
      wafers; HBM supply from CXMT remains immature versus Samsung/SK Hynix; and the CUDA software ecosystem still
      requires meaningfully more migration engineering for domestic chips even where hardware specifications are
      competitive on paper.
    claimRefs:
      - CM013
