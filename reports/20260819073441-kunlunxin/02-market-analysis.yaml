            - ADAS/autonomous-driving milestones
            - National compute self-sufficiency policy
        - label: Kunlunxin traction evidence
          values:
            - Baidu internal use; Tencent P800 procurement (2026)
            - China Mobile RMB1B+ win (Aug 2025)
            - BYD equity investor; direct chip-purchase unconfirmed
            - Not separately confirmed in sources reviewed
