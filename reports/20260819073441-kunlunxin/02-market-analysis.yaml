  - id: FM004
    title: Adoption funnel or value-chain map
    type: funnel
    layout: standard
    summary: >-
      A Chinese AI buyer's path from evaluating domestic chips to standing up production AI infrastructure moves
      through policy screening, procurement, integration, and scale-out stages.
    data:
      items:
        - label: Policy/compliance screening
          value: 100
          detail: Xinchuang and export-control status determine whether domestic chips are even considered.
        - label: Vendor evaluation (multi-vendor bake-off)
          value: 70
          detail: Buyers like ByteDance run parallel evaluations across Huawei, Cambricon, Kunlunxin, and others.
        - label: Procurement / centralized tender award
          value: 45
          detail: SOE and government buyers award via centralized tenders (e.g., China Mobile's package process).
        - label: Cluster integration and software migration
          value: 30
          detail: CUDA-to-domestic-stack migration is the most cited friction point at this stage.
        - label: Production-scale deployment
          value: 20
          detail: Full-cluster, revenue-generating deployment (e.g., Baidu's 30,000-chip P800 cluster).
    approximationNotes: >-
      Stage values are illustrative relative weights based on qualitative evidence (bake-off, tender, migration,
      and scale commentary across sources), not a measured conversion-rate funnel from a single dataset.
    claimRefs:
      - CM015
      - CM019
      - CM021
      - CM022
