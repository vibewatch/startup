    figureRefs: []
tables:
  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance to Kunlunxin
    rows:
      - - AI training accelerators (China)
        - Chips for large-model pre-training clusters
        - Non-AI CPU/server compute; training spend outside China
        - Hyperscalers, state AI-infrastructure programs
        - Core Kunlunxin P800/M300 addressable segment.
      - - AI inference accelerators (China)
        - Chips for model serving/inference at scale
        - Edge/consumer inference chips outside data centers
        - Hyperscalers, enterprises, SOEs
        - Core Kunlunxin P800/M100 addressable segment.
      - - HBM memory supply
        - High-bandwidth memory attached to AI accelerators
        - Standard DDR/GDDR memory for non-AI workloads
        - Chip vendors (as a cost input, not a buyer-facing market)
        - Upstream constraint on Kunlunxin's cluster scale-up, not a market Kunlunxin sells into.
      - - Advanced-node foundry capacity
        - 7nm-and-below wafer fabrication for AI chips
        - Mature-node fabrication for non-AI chips
        - Chip vendors (SMIC customers)
        - Upstream constraint shared with Huawei, Cambricon, Biren, and other SMIC customers.
      - - AI software/tooling ecosystem
        - Compilers, runtimes, frameworks for AI chips (CUDA and domestic alternatives)
        - General-purpose software unrelated to AI acceleration
        - Developers, hyperscalers
        - Determines how easily Kunlunxin's XTCL/XBLAS stack can win workloads locked into CUDA.
      - - 'Status-quo substitute: imported/rented Nvidia-AMD compute'
        - Direct Nvidia/AMD chip purchases; offshore cloud GPU rental
        - Chips already excluded by export control from China-bound sale
        - Chinese AI labs and enterprises
        - Primary competitive alternative Kunlunxin must displace, not a segment it can currently serve.
    notes: >-
      "Relevance to Kunlunxin" is this report's own classification based on the chapter's evidence, not a
      company-published market map.
