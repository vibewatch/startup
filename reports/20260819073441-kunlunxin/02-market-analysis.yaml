  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - driver/constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - US export controls on advanced Nvidia/AMD chips
        - driver (for domestic vendors)
        - Ongoing since 2022, intensified 2024-2025
        - Structurally shifts addressable demand toward domestic chipmakers, including Kunlunxin.
        - Track BIS rule changes and any partial reversals (e.g., H20 licensing) that could soften the tailwind.
      - - '"Buy China" / Xinchuang domestic-substitution policy'
        - driver (for domestic vendors)
        - Ongoing, reinforced 2024-2026
        - Creates policy-driven procurement floors for SOEs and government buyers.
        - Confirm whether Kunlunxin qualifies for the same procurement preferences as Huawei/Cambricon.
      - - DeepSeek-class open-model demand
        - driver (for all vendors with compatible chips)
        - Accelerating since early 2025
        - Gives every domestic chip vendor a concrete, high-profile workload to court, including Kunlunxin's P800.
        - Assess durability of DeepSeek-linked demand versus one-time compatibility announcements.
      - - State semiconductor financing (Big Fund III, ~$47.5B)
        - driver (for the domestic ecosystem broadly)
        - Deployed since 2024
        - Subsidizes higher-cost domestic manufacturing, partially offsetting SMIC's cost/yield disadvantage.
        - Confirm what share, if any, of Big Fund III capital reaches Kunlunxin specifically versus SMIC/Huawei.
      - - SMIC advanced-node capacity constraint
        - constraint
        - Ongoing through at least 2026
        - Caps how fast any SMIC customer, including Kunlunxin, can scale chip output.
        - Determine Kunlunxin's specific wafer allocation priority relative to Huawei and Cambricon.
      - - HBM supply constraint (CXMT immaturity vs. Samsung/SK Hynix)
        - constraint
        - Ongoing
        - Limits memory bandwidth scaling for domestic AI chips, including Kunlunxin's P800/M-series.
        - Confirm Kunlunxin's current HBM sourcing (domestic CXMT vs. imported).
      - - CUDA ecosystem lock-in / migration cost
        - constraint
        - Ongoing; documented as late as August 2026
        - Slows adoption of domestic chips for training workloads even where hardware specs are competitive.
        - Assess real-world migration time/cost data for Kunlunxin's XTCL stack versus Huawei's CANN.
    notes: >-
      Direction and timing reflect this report's synthesis of the growth-driver and constraint evidence reviewed for
      this chapter; drivers and constraints are not mutually exclusive and can affect different vendors differently.
