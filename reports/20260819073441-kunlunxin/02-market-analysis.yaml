  - id: contradictions-gaps
    title: Contradictory estimates and sizing diligence gaps
    body: >-
      Several widely cited figures conflict or cannot be independently reconciled from the sources reviewed. Bernstein's
      forecast that China becomes a net AI-chip exporter by 2028 sits uneasily next to the Council on Foreign
      Relations' assessment that the best US chips remained roughly 5x more powerful than China's best in 2025, a gap
      CFR expects to widen to as much as 17x by 2027 -- meaning unit-shipment share and raw compute share can move in
      opposite directions at the same time. Separately, an August 2026 report found many Chinese AI developers still
      renting Nvidia compute through offshore cloud arrangements in Southeast Asia specifically to avoid the CUDA
      migration cost, which complicates any reading of the 41% domestic-shipment figure as equivalent to 41% of
      actual AI compute consumed. No source reviewed isolates Kunlunxin's addressable market independent of Baidu's
      own internal demand, nor does any source provide an independently verified benchmark of P800 performance
      against Nvidia's H100/H200 -- Morgan Stanley's cited estimate of roughly 1,521 tokens/second on DeepSeek R1
      inference (positioning P800 between H20 and A100) is the most credible third-party data point available, but it
      is a single estimate rather than a reproducible benchmark suite. These gaps matter because they mean Kunlunxin's
      market-share and margin trajectory cannot yet be modeled with the same confidence as Huawei's or Cambricon's.
    claimRefs:
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
