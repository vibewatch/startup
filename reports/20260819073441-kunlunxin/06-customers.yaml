figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Kunlunxin's customer journey runs from Baidu-internal validation through competitive SOE procurement to,
      most recently, direct cross-rival hyperscaler adoption.
    data:
      nodes:
        - id: internal-proof
          label: Internal Baidu validation
          detail: Chips proven first inside Baidu's own search, cloud, and Apollo workloads since 2018.
          tone: positive
        - id: soe-tender
          label: Competitive SOE tender wins
          detail: China Mobile and China Merchants Bank wins via centralized procurement processes.
          tone: positive
        - id: sector-diversification
          label: Cross-sector diversification
          detail: China Southern Power Grid (energy) and Geely (automotive) add sector breadth.
          tone: neutral
        - id: rival-adoption
          label: Cross-rival hyperscaler adoption
          detail: Tencent begins sourcing P800 chips in 2026, the strongest available validation signal.
          tone: positive
        - id: ipo-linked-demand
          label: IPO-linked cornerstone chip-purchase commitments
          detail: Prospective investors reportedly required to buy chips worth 3-7x their equity stake.
          tone: warning
    approximationNotes: >-
      This journey represents the chronological sequence of customer-adoption evidence identified across sources
      reviewed, not a company-published customer-lifecycle model.
    claimRefs:
      - CU001
      - CU007
      - CU009
      - CU011
      - CU017
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      A prospective Kunlunxin customer's path from evaluation to production deployment narrows sharply at the
      competitive-tender and cluster-integration stages.
    data:
      items:
        - label: Vendor evaluation (multi-vendor bake-off)
          value: 100
          detail: Buyers such as hyperscalers and SOEs evaluate Kunlunxin alongside Huawei, Cambricon, and others.
        - label: Competitive tender / procurement award
          value: 55
          detail: China Mobile's centralized tender process is the clearest documented example.
        - label: Cluster integration and software migration
          value: 35
          detail: XTCL/PaddlePaddle migration required before production use.
        - label: Production-scale deployment
          value: 20
          detail: Confirmed for Baidu, China Mobile, China Merchants Bank, Tencent, Geely, China Southern Power Grid.
        - label: Recurring/expanding relationship (confirmed)
          value: 10
          detail: Only Baidu's multi-generation purchasing is clearly documented as recurring; other accounts'
            renewal status is undisclosed.
    approximationNotes: >-
      Stage values are illustrative relative weights based on qualitative evidence across named customer wins, not
      a measured conversion-rate funnel from a single dataset.
    claimRefs:
      - CU007
      - CU008
      - CU013
      - CU014
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Evidence quality varies significantly across named Kunlunxin customers, from Baidu's deep but related-party
      evidence to Tencent's high-validation-value but single-source disclosure.
    data:
      columns:
        - Baidu
        - China Mobile
        - Tencent
        - China Merchants Bank
      rows:
        - label: Evidence independence
          values:
            - Low (related party)
            - High (independent procurement press)
            - Medium (single-source, The Information via China Biz Insider)
            - Medium (BigGo Finance secondary reporting)
        - label: Outcome specificity
          values:
            - "High (named models trained: Wenxin 4.5 Turbo, 5.1)"
            - Medium (contract value disclosed; outcome not detailed)
            - Low (cluster size disclosed; outcome not detailed)
            - Low (contract win only, no outcome detail)
        - label: Production maturity
          values:
            - Confirmed production, multi-generation
            - Confirmed production (single tender cycle)
            - Confirmed production (2026, newly disclosed)
            - Confirmed production (contract win, March 2025)
    approximationNotes: null
    claimRefs:
      - CU007
      - CU009
      - CU011
      - CU012
      - CU022
