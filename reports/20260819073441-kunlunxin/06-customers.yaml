company:
  name: Kunlunxin
chapter:
  number: 6
  title: Customers
  summary: >-
    Kunlunxin's customer base has expanded from purely internal Baidu use to a named roster spanning telecom
    (China Mobile), finance (China Merchants Bank), energy (China Southern Power Grid), automotive (Geely, BYD as
    investor), and, since 2026, a direct hyperscaler rival (Tencent). External revenue reportedly rose from about
    40% (2024) to over 50% (2025) of the total, but no source discloses retention, renewal, or repeat-purchase
    data, and customer concentration (Baidu as both owner and largest counterparty) remains the chapter's central
    unresolved risk.
sections:
  - id: customer-segmentation
    title: Customer segmentation and adoption trajectory
    body: >-
      Kunlunxin's customer base splits into five segments with distinct buyer/user/payer structures. Baidu itself
      is simultaneously owner, largest customer, and technology co-developer, consuming P800 chips for its own
      Wenxin/Ernie model training and Apollo autonomous-driving stack. Telecom and financial SOEs (China Mobile,
      China Merchants Bank) buy through centralized procurement tenders, exemplified by Kunlunxin's RMB1 billion-plus
      China Mobile win in August 2025 across all three general-computing bid packages. Energy and industrial SOEs
      (China Southern Power Grid) and automotive OEMs (Geely, with BYD confirmed only as an equity investor rather
      than a confirmed chip customer) form smaller but strategically visible segments. The newest and most
      significant segment is cross-rival hyperscaler procurement: Tencent began sourcing P800 chips at scale in
      2026, a relationship multiple outlets frame as the strongest available market-validation signal precisely
      because Tencent has every incentive to find fault with a competitor's product rather than validate it.
      Adoption trajectory data is thin: external (non-Baidu) revenue reportedly rose from about 40% of the total in
      2024 to more than 50% in 2025, and Kunlunxin's overall 2025 AI-chip shipment volume (roughly 116,000 units,
      tied with Cambricon per IDC data) sits well behind Huawei's roughly 812,000 units, but no source reviewed
      breaks down unit shipments, active deployments, or utilization by individual named customer.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
    tableRefs:
      - TU001
      - TU002
  - id: named-customer-proof
    title: Named customer proof and deployment evidence
    body: >-
      The strongest customer-proof evidence available is the China Mobile procurement win: Chinese-language
      procurement coverage (ZhiDongXi, Tencent News, Zhihu) confirms Kunlunxin secured a leading position across a
      roughly RMB5 billion China Mobile AI-computing tender, winning all three general-computing bid packages worth
      more than RMB1 billion, with chips supplied through system integrators H3C and ZTE -- a production deployment,
      not a pilot. Yicai Global's November 2025 reporting separately names China Merchants Bank (won an AI-chip
      resource project bid in March 2025), China Southern Power Grid, Geely Automobile Holdings, and Vivo as
      external P800 deployers, alongside "hundreds of real-world users" across internet, finance, energy,
      transportation, and education sectors -- though only the named accounts are independently verifiable; the
      "hundreds" figure is a company-sourced aggregate. Kunlunxin's own case-study material describes an industrial
      quality-inspection deployment achieving a 65% cost reduction and 9% performance improvement versus a prior
      GPU-based pipeline, a company-sourced but concretely quantified outcome. China Biz Insider's July 2026
      reporting adds Tencent as a named 2026 customer running P800 chips in 10,000-card clusters, explicitly framed
      as evidence Kunlunxin has "cleared the most demanding real-world stress tests" from an adversarial buyer.
      Every named deployment in this chapter reflects production use rather than a pilot or proof-of-concept,
      though none of the press coverage reviewed discloses deployment scale, contract duration, or outcome metrics
      with the same granularity as Kunlunxin's own single case study.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
    figureRefs:
      - FU001
      - FU003
  - id: retention-expansion-concentration
    title: Retention, expansion, and concentration risk
    body: >-
      No source reviewed discloses a retention metric, renewal rate, churn figure, net revenue retention, or
      contract-length data for any Kunlunxin customer -- a complete disclosure gap this chapter treats as a null
      field rather than an assumed value. The closest available retention proxy is repeat-generation purchasing:
      Baidu has bought every Kunlun chip generation since 2018 (Kunlun I, II, P800, and the coming M100/M300), and
      Geely's relationship with Kunlun chips traces back to the Kunlun II/Apollo era, suggesting some multi-year
      continuity for at least two accounts, though this is inferred from product-generation history rather than a
      disclosed renewal metric. On expansion, the clearest signal is the external revenue share rising from about
      40% to over 50% between 2024 and 2025, and the addition of a first hyperscaler-rival customer (Tencent) in
      2026. On concentration, the central risk is structural rather than incidental: Baidu is simultaneously
      Kunlunxin's ~59.45% controlling shareholder and its largest customer, meaning the revenue-quality assessment
      for the IPO depends heavily on how related-party pricing is treated, and the reported IPO chip-purchase
      commitment (cornerstone investors buying 3-7x their equity stake in chips) adds a second concentration risk
      by pre-loading revenue from investor-customers rather than organically sourced accounts. Procurement friction
      is visible in one direction only: named SOE wins came through formal, multi-package centralized tenders (China
      Mobile) that Kunlunxin had to win competitively against other bidders, evidence of a real procurement gate
      rather than a captive-only sales motion.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
    tableRefs:
      - TU004
      - TU005
      - TU006
    figureRefs:
