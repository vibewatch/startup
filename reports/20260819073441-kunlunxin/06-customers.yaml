  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - expansion driver
      - concentration risk
      - impact
      - diligence path
    rows:
      - - Rising external revenue share (40% to 50%+, 2024-2025)
        - Baidu-internal revenue remains the largest single component even as external share grows
        - Determines how much of Kunlunxin's IPO growth narrative is genuinely external versus captive-parent demand
        - Request an audited customer-concentration breakdown (top-5 or top-10 customer revenue share).
      - - New cross-rival hyperscaler customer (Tencent, 2026)
        - Single-customer dependence risk if the Tencent relationship does not recur or scale
        - A one-off validation purchase would overstate durable external demand
        - Track whether Tencent's order becomes a recurring, scaling relationship in subsequent disclosures.
      - - IPO-linked cornerstone chip-purchase commitments (3-7x equity investment)
        - Revenue sourced from IPO-investor relationships rather than organic commercial demand
        - Raises circular-financing concerns about the durability and independence of reported external revenue
        - Obtain finalized cornerstone-investor chip-purchase agreements once the prospectus is public.
      - - Government/SOE centralized-tender wins (China Mobile, China Merchants Bank)
        - Dependence on periodic, competitively bid tenders rather than continuous commercial relationships
        - Revenue from these accounts could be lumpy and tender-cycle-dependent rather than recurring
        - Confirm tender renewal cycles and Kunlunxin's win rate across historical tender rounds.
      - - Baidu's dual role as controller and largest customer
        - Structural related-party concentration that cannot be diversified away by adding more external customers
        - Complicates any independent assessment of Kunlunxin's true external commercial traction
        - Request related-party transaction disclosure and pricing methodology from the HKEX prospectus.
    notes: >-
      Concentration risks are ranked by this report's own qualitative assessment of the evidence reviewed, not a
      company-disclosed risk register.
