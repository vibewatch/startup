  - id: trust-quality-gaps
    title: Trust, quality, compliance, and evidence gaps
    body: >-
      Kunlunxin discloses no independent security certifications, safety-testing standards, or formal quality
      metrics for its chips or cluster products in any source reviewed, in contrast to how cloud software companies
      typically publish SOC 2 or ISO certifications. The most relevant "trust" signal available is indirect:
      Kunlunxin's chips are deployed in centralized-tender-won infrastructure for regulated buyers (China Mobile,
      China Merchants Bank, China Southern Power Grid), which implies the products cleared some level of
      state-enterprise procurement due diligence, though the specific technical or security criteria used in those
      tenders are not public. On export-control compliance, no source reviewed confirms Kunlunxin is currently on
      the US Entity List, but broader 2025 export-control actions targeting indigenous Chinese semiconductor
      production create latent compliance risk that is not addressed in any Kunlunxin-published trust or compliance
      material reviewed. On manufacturing quality, no source reviewed discloses Kunlunxin-specific chip yield rates;
      the closest available proxy is Huawei's disclosed yield improvement (from about 20% to nearly 40%) at SMIC,
      which Kunlunxin, as a smaller SMIC customer with reportedly lower production priority than Huawei, may not be
      able to match. Every claim in this chapter sourced from Kunlunxin's own website, technical salons, or GitHub
      repositories is marked company-claimed rather than independently verified, and unresolved items (yield,
      Entity List status, formal certifications, independent benchmarks) are carried forward as explicit evidence
      gaps rather than assumed to be favorable or unfavorable.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
