  - id: deployment-differentiation
    title: Deployment, roadmap, and differentiation
    body: >-
      Kunlunxin's clearest deployment proof point is Baidu's own April 2025 activation of a 30,000-P800-chip
      cluster, pitched as capable of training "DeepSeek-like" models with hundreds of billions of parameters while
      simultaneously supporting fine-tuning workloads for up to 1,000 enterprise customers; Baidu separately
      announced plans to scale a single Kunlun cluster to a million cards by 2030 and to cluster P800 chips into
      "Tianchi256" (first half of 2026) and "Tianchi512" (second half of 2026) configurations, each targeting a
      further 50%+ performance gain over the prior cluster generation. Kunlunxin's own February 2025 announcement
      claims full DeepSeek R1/V3 training and inference compatibility, with a single 8-card P800 server able to run
      the full 671-billion-parameter DeepSeek R1 model at 8-bit precision and 32 servers (256 P800s) sufficient for
      full-parameter training -- claims corroborated only by a single third-party estimate (Morgan Stanley, ~1,521
      tokens/second on DeepSeek R1 inference) rather than a reproducible benchmark. On differentiation, Kunlunxin's
      most durable technical moats are (1) the XTCL/XBLAS/XDNN software stack's multi-year PaddlePaddle integration
      history, which most rival domestic chips cannot match in ecosystem depth, and (2) direct architectural tuning
      to Baidu's own production workloads (Wenxin/Ernie models, Apollo autonomous-driving stack). Its most exposed
      differentiation gap is manufacturing: Kunlunxin's earlier Kunlun I chip used Samsung's 14nm process and Kunlun
      II used TSMC's 7nm process, but post-2021 export-control tightening makes it highly likely (though not
      officially confirmed) that P800 is manufactured on SMIC's 7nm DUV-based process, which runs at an estimated
      25-50% higher cost and lower yield than TSMC's EUV-based equivalent.
    claimRefs:
      - CE014
      - CE015
