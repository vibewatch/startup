  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer/component
      - role
      - dependency
      - risk
    rows:
      - - XPU-R compute block (SDNN + Cluster units)
        - Executes tensor operations (SDNN) and general-purpose parallel compute (Cluster units)
        - Kunlunxin's own architecture design team
        - Performance claims (128 TFLOPS FP16 for the documented generation) are company-disclosed, not independently
          benchmarked.
      - - Memory hierarchy (local/shared memory, L3 SRAM, GDDR6/HBM3)
        - Provides hierarchical, lower-latency on-chip memory plus higher-capacity external memory
        - HBM3/GDDR6 memory suppliers (Samsung/SK Hynix historically; CXMT domestically, unconfirmed for Kunlunxin)
        - HBM supply is a sector-wide bottleneck; Kunlunxin's specific memory sourcing is not confirmed.
      - - Interconnect (chip-to-chip links)
        - Enables large-scale distributed training across many chips in a cluster
        - Cluster-level networking design (proprietary; specifics not fully disclosed)
        - Independent verification of claimed 90%+ scaling efficiency at 5,000+ chip clusters is not available.
      - - PCIe interface
        - Host-device data transfer for training/inference workloads
        - Industry-standard PCIe specification (4.0, backward-compatible with 3.0, per company technical material)
        - Standard interface; lower differentiation/risk than the compute or memory layers.
      - - LLVM-based compiler toolchain
        - Custom Clang front-end and XPU back-end; AOT/JIT compilation; device/host separation
        - LLVM open-source project as the underlying compiler infrastructure
        - Toolchain maturity relative to Nvidia's decades-old CUDA toolchain is not independently benchmarked.
      - - XTCL graph compiler (TVM-based)
        - Imports and optimizes models from PaddlePaddle, TensorFlow, and PyTorch for XPU hardware
        - Apache TVM open-source compiler framework as the underlying graph-compilation engine
        - Framework coverage/optimization quality versus Nvidia's mature graph-compilation tooling is unverified.
      - - Runtime and driver layer
        - Low-level drivers, user-mode APIs, monitoring/debugging/profiling tools; multi-stream and SR-IOV support
        - x86-64 and Arm64 host platforms
        - Virtualization (SR-IOV) and multi-tenancy maturity are company-described, not independently tested.
    notes: >-
      Architecture detail is drawn primarily from a Baidu-hosted technical salon writeup and independent
      die-level analysis (TechInsights); risk assessments reflect the degree of independent corroboration available
      for each layer, not confirmed defects.
