    rows:
      - - Train a large language model at hyperscale
        - Provision Nvidia (or another vendor's) GPU cluster; write CUDA-targeted training code
        - P800 cluster (e.g., 30,000-chip deployment) plus XTCL/PaddlePaddle training pipeline
        - Baidu's cluster reportedly trained Wenxin 4.5 Turbo and later Wenxin 5.1 on an all-domestic chip stack
        - Migration from a CUDA-based codebase requires meaningful engineering time, per independent reporting.
      - - Serve inference for a DeepSeek-class open model
        - Deploy on Nvidia H20/A100/H100 or a domestic alternative depending on availability and cost
        - Single 8-card P800 server running the full 671B-parameter DeepSeek R1 model at 8-bit (company claim)
        - Morgan Stanley estimate of ~1,521 tokens/second, positioning P800 between Nvidia H20 and A100
        - Only one third-party performance estimate located; not a reproducible, standardized benchmark.
      - - Perceive and plan for autonomous driving (Apollo platform)
        - Run perception/planning models on in-vehicle or cloud-simulation compute
        - Kunlun II integrated into Baidu's Apollo autonomous-driving software platform
        - Company-described performance parity claims for Kunlun II vs. contemporary Nvidia chips
        - No independent automotive-grade certification or safety-testing data located.
