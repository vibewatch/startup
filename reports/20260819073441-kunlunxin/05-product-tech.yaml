company:
  name: Kunlunxin
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Kunlunxin's product line has progressed from a 2018 search-inference chip (Kunlun I) through a 2021
    A100-class training/inference chip (Kunlun II) to the current P800 (Kunlun III) cluster-scale flagship, with
    inference-focused M100 (2026) and training-focused M300 (2027) next in the roadmap. The XPU-R architecture and
    its XTCL/XBLAS/XDNN software stack give Kunlunxin a CUDA-like programming model and PaddlePaddle-native
    integration, but independent verification of P800's real-world performance, manufacturing foundry, and
    reliability/compliance posture remains thin relative to the volume of company-sourced technical claims.
sections:
  - id: product-definition
    title: Product definition and customer workflow fit
    body: >-
      In customer workflow terms, Kunlunxin sells AI accelerator hardware (the Kunlun chip family) plus a
      CUDA-alternative software stack that lets model developers train and serve large models without rewriting
      their code for a new hardware target. For a model-training customer, the workflow is: write or port a model in
      PaddlePaddle, TensorFlow, or PyTorch; compile it through Kunlunxin's XTCL graph-compilation library (built on
      TVM); run it on XPU-R hardware via a CUDA-like kernel/launch programming model with explicit host-device
      memory transfers over PCIe. For an inference customer, Kunlunxin's own case-study material describes replacing
      a GPU-based PyTorch pipeline with a Kunlun-Paddle solution in an industrial quality-inspection use case,
      reporting a 65% cost reduction and a 9% performance improvement -- a company-sourced but concretely quantified
      benefit. At cluster scale, Kunlunxin's P800-based "Super-Node" products (32/64-card single-cabinet
      configurations) target internet, finance, energy, transportation, and education customers who need multi-card
      training or high-throughput inference without building bespoke cluster infrastructure themselves. Since 2018,
      Kunlun chip integration with PaddlePaddle has progressed from Paddle Lite inference-only support to full
      training support in PaddlePaddle 2.0 and later, with switching to the XPU backend requiring what Kunlunxin
      describes as a single code-line change -- a claim this chapter treats as company-sourced rather than
      independently benchmarked.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    tableRefs:
      - TE001
      - TE002
  - id: architecture-operating-model
    title: Architecture and operating model
    body: >-
      Kunlunxin's XPU-R architecture separates compute, storage, interconnect, and interface into four hardware
      blocks. The compute block combines SDNN (a software-defined neural-network engine for tensor operations) with
      general-purpose Cluster units; the second-generation design documented by Baidu's own technical salon
      specifies 8 Cluster units and 6 SDNN units delivering up to 128 TFLOPS at FP16, with each Cluster containing 64
      cores and a hierarchical memory system (local memory, shared memory, 64MB on-chip L3 SRAM, then external
      GDDR6 at 512GB/s). The current P800 (Kunlun III) generation moves to a 7nm process node with 96GB of HBM3
      memory and 2.4-4 TB/s of bandwidth per independent spec aggregation, and TechInsights' independent die-level
      floorplan analysis confirms a 7nm process with over 50 billion transistors and a physical separation of matrix
      computation from communication units -- an architectural choice Kunlunxin says improves cluster scaling
      efficiency. The software stack layers a runtime (drivers, monitors, debuggers, profilers), an LLVM-based
      compiler toolchain (custom Clang front-end, XPU back-end, AOT/JIT compilation), high-performance math
      libraries (XBLAS/XDNN, Kunlunxin's cuBLAS/cuDNN analogues), a collective-communication library (XCCL), and the
      TVM-based XTCL graph compiler that imports models from PaddlePaddle, TensorFlow, and PyTorch. Deployment runs
      through container images and Python wheels (via the FastDeploy XPU backend) and a community-maintained
      vLLM-Kunlun plugin that maps PyTorch operations onto XBLAS/XDNN for large-model inference -- both distributed
      as open-source repositories on GitHub, giving Kunlunxin a public developer-signal footprint that most Chinese
      hardware-only competitors lack.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
