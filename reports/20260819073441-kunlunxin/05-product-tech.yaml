figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Kunlunxin's XPU-R chip architecture layers compute, memory, interconnect, and interface hardware beneath a
      multi-layer software stack that gives developers a CUDA-like programming model.
    data:
      layers:
        - label: Software - XTCL graph compiler / XBLAS / XDNN / XCCL
          detail: TVM-based graph compilation; math and collective-communication libraries; CUDA-like kernel model.
          tone: positive
        - label: Software - LLVM-based compiler toolchain and runtime
          detail: Custom Clang front-end, XPU back-end, AOT/JIT compilation, drivers, monitors, debuggers, profilers.
          tone: neutral
        - label: Interface - PCIe 4.0 (backward-compatible PCIe 3.0)
          detail: Host-device data transfer for training/inference workloads.
          tone: neutral
        - label: Interconnect - chip-to-chip links
          detail: Enables large-scale distributed training across cluster deployments.
          tone: neutral
        - label: Memory - L3 SRAM (64MB) / GDDR6 (512GB/s) / HBM3 (P800, 96GB)
          detail: Hierarchical on-chip and external memory; HBM3 specific to the current P800 generation.
          tone: neutral
        - label: Compute - SDNN (tensor ops) + Cluster units (general compute)
          detail: 8 Cluster units and 6 SDNN units in the documented generation, up to 128 TFLOPS FP16.
          tone: positive
    approximationNotes: >-
      Layer specifications combine a Baidu technical-salon writeup (documented XPU-R generation) with independently
      aggregated P800 specs (flopper.io) and TechInsights' independent die analysis; the two generations' exact
      specifications are not identical and are shown together only to illustrate the architectural layering.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      A Kunlunxin customer's workflow runs from model development in a standard framework through Kunlunxin's
      compiler stack to cluster-scale training or inference deployment.
    data:
      nodes:
        - id: model-dev
          label: Model development (PaddlePaddle/PyTorch/TensorFlow)
          detail: Developers write or port models in a standard framework, often with minimal code changes.
          tone: positive
        - id: xtcl-compile
          label: XTCL graph compilation
          detail: TVM-based compiler imports and optimizes the model graph for XPU hardware.
          tone: neutral
        - id: xpu-runtime
          label: XPU runtime and driver layer
          detail: Low-level execution, multi-stream support, virtualization (SR-IOV).
          tone: neutral
        - id: cluster-deploy
          label: Cluster deployment (Super-Node, Tianchi clusters)
          detail: Multi-card cabinet or large-scale (e.g., 30,000-chip) cluster deployment.
          tone: positive
        - id: workload-output
          label: Training or inference output
          detail: Trained model checkpoints or served inference results (e.g., DeepSeek R1 responses).
          tone: positive
      edges:
        - from: model-dev
          to: xtcl-compile
        - from: xtcl-compile
          to: xpu-runtime
        - from: xpu-runtime
          to: cluster-deploy
        - from: cluster-deploy
          to: workload-output
    approximationNotes: null
