  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Kunlunxin's implied price-to-sales multiple at the reported $50 billion IPO target is highly sensitive to
      which 2025 revenue estimate is used.
    data:
      items:
        - label: "P/S at $500M revenue (CNBC low estimate)"
          value: 100
        - label: "P/S at ~$1.2B revenue (J.P. Morgan-consistent base case)"
          value: 42
        - label: "P/S at $2.9B revenue (Tencent Tech/BigGo high estimate)"
          value: 17
        - label: "Cambricon comparable P/S range (low bound)"
          value: 55
        - label: "Cambricon comparable P/S range (high bound)"
          value: 85
    approximationNotes: >-
      P/S values are calculated by dividing the reported ~$50B IPO target by each revenue estimate; the base-case
      figure uses a $1.2B revenue estimate consistent with a currency-adjusted reading of J.P. Morgan's RMB
      projections. None of these figures are confirmed in a public prospectus.
    claimRefs:
      - CV009
      - CV014
      - CV024
