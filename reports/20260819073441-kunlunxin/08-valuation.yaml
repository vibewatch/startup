  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument
      - what would change the view
    rows:
      - - "Bull: Kunlunxin rides China's fastest-growing chip segment (41%+ domestic shipment share, rising)"
        - Slower-than-expected domestic share growth or a reversal of US export-control-driven demand tailwinds.
      - - "Bull: Tencent's 2026 procurement is the strongest available third-party product validation"
        - Confirmation that the Tencent relationship recurs and scales rather than remaining a single order.
      - - "Bull: External revenue share rose from ~40% (2024) to >50% (2025), suggesting real commercial traction"
        - Publication of audited, reconciled revenue figures confirming the trend in Kunlunxin's HKEX prospectus.
      - - "Anti-thesis: IPO target is ~16x the Series D valuation in under 12 months"
        - A more moderate final IPO pricing (e.g., near the earlier ~$13B STAR Market guidance) would ease this
          concern.
      - - "Anti-thesis: Chip-purchase-linked cornerstone structure raises circular-financing concerns"
        - Regulatory clarification or prospectus disclosure showing the structure does not inflate reported demand.
      - - "Anti-thesis: 2025 revenue estimates diverge 5-6x across sources ($500M to $2.9B)"
        - Publication of a single, audited revenue figure in the HKEX prospectus.
      - - "Anti-thesis: SMIC foundry dependency is capacity-constrained and reportedly subordinated to Huawei"
        - Confirmation of a specific, adequate wafer-allocation agreement, or a disclosed dual-foundry strategy.
      - - "Anti-thesis: Baidu's dual role as controller and largest customer limits independent verification"
        - Disclosure of related-party transaction terms and independent audit confirmation in the prospectus.
    notes: >-
      Arguments are drawn directly from evidence in this and prior chapters; "what would change the view" columns
      are this report's own diligence framing, not company-published risk factors.
