  - id: TV004
    title: Comparable valuation table
    columns:
      - comparable
      - metric
      - multiple/valuation/status
      - relevance
      - limitation
    rows:
      - - Cambricon (寒武纪, 688256.SH)
        - Market cap / trailing PE
        - "RMB630B-1T (~$88-140B); 200-373x trailing PE; FY2025 revenue RMB6.5B (+453%), first annual profit"
        - Highest-valued listed pure-play Chinese AI chipmaker; closest public-market multiple reference
        - Already profitable and listed; Kunlunxin is pre-IPO and not yet profitable on a reconciled basis.
      - - Moore Threads (摩尔线程, STAR Market)
        - Market cap / P/S
        - "RMB282-306B (~$39-43B) post-IPO (Dec 2025); ~RMB6B accumulated losses over three years"
        - Recently listed domestic GPU peer with a comparable IPO-fever debut pattern
        - Full-stack graphics-plus-AI positioning differs from Kunlunxin's AI-only focus.
      - - Biren Technology (壁仞科技, HKEX)
        - Pre-IPO valuation / post-IPO market cap
        - "~$2.2-2.9B pre-IPO (2025); ~$12.3B post-IPO (Jan 2026, +72.86% debut pop)"
        - Comparable HKEX listing at a similar revenue scale (~$81.8M H1 2025) to Kunlunxin's low-end estimate
        - Operates under a US Entity List designation since 2023, a risk factor not confirmed for Kunlunxin.
      - - Iluvatar CoreX (天数智芯, HKEX)
        - Post-IPO market cap
        - "~$5.2B post-IPO (Jan 2026); FY2025 revenue RMB1.03B (+91.6%), ~54% gross margin"
        - Comparable HKEX-listed domestic GPU peer with audited financials, useful as a margin-structure proxy
        - Concentrated ByteDance customer exposure differs from Kunlunxin's more diversified customer base.
      - - Nvidia (NASDAQ:NVDA)
        - Market cap / revenue multiple
        - "~$3T+ global market cap; ~16-25x revenue multiple (2026)"
        - Global benchmark for AI-chip valuation multiples and the status-quo competitive standard
        - Not a domestic-China comparable; scale and ecosystem maturity differ by orders of magnitude.
    notes: >-
      Valuation figures mix market capitalization (listed peers), pre/post-IPO valuation (recently listed peers),
      and global benchmark multiples (Nvidia); treat cross-row comparisons as directional, not like-for-like.
    enumerationScope:
      coverage: sample
      basis: >-
        Covers the domestic Chinese AI chip comparables and one global benchmark identified across sources
        reviewed through the 2026-08-19 run date; smaller or less-covered peers (Enflame, Alibaba T-Head, Hygon,
        MetaX) are referenced in the Competitors chapter but not repeated here.
