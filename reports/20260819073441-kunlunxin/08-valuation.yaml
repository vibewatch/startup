  - id: exit-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness for existing private investors runs directly through the IPO itself: Kunlunxin's confidential
      HKEX Form A1 filing (January 2026) and parallel STAR Market tutoring process (May 2026) are the mechanism by
      which Series A-D investors would realize liquidity, with Jefferies analysts (per BigGo Finance) expecting the
      Hong Kong listing in the third quarter of 2026. No source reviewed discloses lock-up terms, secondary-sale
      provisions, or existing-investor exit mechanics beyond the IPO process itself. This chapter's final diligence
      asks consolidate the most consequential open questions from earlier chapters into a single prioritized list:
      reconcile the 2025 revenue estimate; confirm the manufacturing foundry and yield rate; obtain independent
      benchmark data; confirm the underwriter syndicate and final offering terms; and clarify how the
      chip-purchase-commitment structure will be treated in the public prospectus. Each of these is a thesis-break
      trigger in its own right, and together they explain why this report treats Kunlunxin as a name to track
      closely through its prospectus filing rather than one to underwrite today.
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
