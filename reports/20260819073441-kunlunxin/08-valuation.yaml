  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Confirmed US Entity List designation naming Kunlunxin directly
        - Any official BIS Federal Register entry naming Kunlunxin (Beijing) Technology Co., Ltd.
        - Immediately undermines foundry access, investor appetite, and the IPO process itself
        - Move recommendation to avoid; reassess supply-chain and capital-markets viability entirely.
      - - Revenue reconciliation falls at or below the ~$500M CNBC estimate
        - Audited HKEX prospectus revenue figure at or below the low end of the estimated range
        - Implies a P/S multiple near 100x at the $50B target, difficult to defend on any comparable basis
        - Move valuation stance to expensive/unjustified; downgrade recommendation toward avoid.
      - - Tencent relationship does not recur within 12 months of initial disclosure
        - No confirmed repeat or expanded order in subsequent press or prospectus disclosure
        - Weakens the strongest available third-party customer-validation signal
        - Downgrade confidence in the external-demand growth narrative.
      - - IPO withdrawn, indefinitely delayed, or priced materially below the ~$50B target
        - Formal HKEX/STAR Market filing status change or confirmed pricing below roadshow guidance
        - Signals capital markets do not support the reported valuation
        - Reassess Kunlunxin's private-market valuation and the credibility of prior roadshow guidance.
      - - SMIC wafer-allocation or yield shortfall confirmed
        - Disclosed shipment volume growth materially below the M100/Tianchi roadmap pace
        - Constrains Kunlunxin's ability to scale and compete with Huawei/Cambricon
        - Downgrade confidence in Kunlunxin's ability to close the shipment-share gap with Huawei.
    notes: >-
      Triggers are this report's own synthesis of monitorable events tied to risks and thesis elements identified
      across this report; none are company-published kill criteria.
