  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner/diligence path
    rows:
      - - Reconciled 2025/2026 revenue
        - Audited revenue figure reconciling the ~$500M-$2.9B estimate range
        - Anchors every valuation-multiple calculation in this chapter
        - HKEX prospectus once public; direct company confirmation in the interim.
      - - Manufacturing foundry and yield rate
        - Official confirmation of P800's foundry (SMIC vs. any residual TSMC exposure) and yield rate
        - Determines cost structure, supply reliability, and export-control exposure
        - HKEX prospectus; direct company confirmation.
      - - Independent, reproducible benchmark data
        - A standardized benchmark suite comparing Kunlunxin's chips against Huawei, Cambricon, and Nvidia
        - Validates competitive-positioning claims currently resting on a single analyst estimate
        - Independent benchmark commissioning once hardware access is available.
      - - IPO underwriter syndicate and final offering terms
        - Complete list of bookrunners, final share allocation, and pricing terms
        - Signals deal credibility and pricing discipline
        - HKEX/CSRC filings once the prospectus becomes public.
      - - Chip-purchase-commitment structure disclosure treatment
        - Regulatory guidance or prospectus language on how the cornerstone chip-purchase terms are disclosed
        - Determines whether circular-financing concerns are addressed or persist post-listing
        - HKEX/SFC and CSRC public guidance; the eventual prospectus.
      - - Employee headcount and debt/project-finance obligations
        - Basic scale and balance-sheet metrics disclosed by every listed peer in this comparable set
        - Enables standard scale and capital-adequacy comparison with Cambricon, Moore Threads, Biren, Iluvatar CoreX
        - HKEX prospectus once public.
    notes: >-
      Topics are ranked informally by this report's own assessment of how much each gap constrains confident
      valuation, not a company-disclosed priority order.
