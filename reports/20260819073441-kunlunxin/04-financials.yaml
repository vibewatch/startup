  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: Kunlunxin's HKEX prospectus (audited financials) remains confidential as of the report run date
      missingEvidence: >-
        The public HKEX prospectus, including audited FY2024/FY2025 revenue, gross margin, R&D expense, headcount,
        and cash-flow statements.
      whyItMatters: >-
        Nearly every quantified financial figure in this chapter is a press estimate or peer proxy pending this
        document; without it, revenue quality, margin path, and capital adequacy cannot be independently verified.
      diligencePath: >-
        Track HKEX filings for the public listing document once Kunlunxin converts from confidential to public
        filing status.
      relatedQuestionRefs:
        - QI004
        - QI005
        - QI008
      relatedTableRefs:
        - TI003
        - TI004
    - type: conflicting-data
      severity: material
      topic: Kunlunxin 2025 revenue estimates conflict by roughly 5-6x across independent press reports
      missingEvidence: >-
        A single, source-reconciled 2025 revenue figure for Kunlunxin; current press estimates range from ~$500M
        (CNBC) to ~$2.9B (Tencent Tech/BigGo Finance).
      whyItMatters: >-
        Revenue is the anchor for any price-to-sales analysis of the reported ~$50B IPO target; an unresolved 5-6x
        spread makes any multiple-based valuation conclusion highly uncertain.
      diligencePath: >-
        Obtain Kunlunxin's HKEX prospectus once public, or request audited management accounts directly, to
        reconcile the conflicting revenue figures.
      relatedQuestionRefs:
        - QI003
        - QI019
      relatedTableRefs:
        - TI001
    - type: missing-source
      severity: material
      topic: Kunlunxin's employee headcount is not disclosed in any source reviewed
      missingEvidence: A specific, current employee headcount figure for Kunlunxin.
      whyItMatters: >-
        Headcount is a standard scale and cost-structure indicator; its absence limits comparison with listed peers
        that disclose headcount in regulatory filings.
      diligencePath: Request headcount directly from Kunlunxin/Baidu investor relations or the HKEX prospectus.
      relatedQuestionRefs:
        - QI017
      relatedTableRefs:
        - TI005
    - type: access-blocked
      severity: material
      topic: Kunlunxin's specific manufacturing foundry (SMIC vs. residual TSMC exposure) is not officially confirmed
      missingEvidence: >-
        Official confirmation of which foundry manufactures the P800 (Kunlun III) chip, and at what node.
      whyItMatters: >-
        Foundry choice materially affects cost structure, yield, and export-control exposure; the current SMIC
        attribution is an industry-consensus inference, not a company confirmation.
      diligencePath: >-
        Request foundry and supply-agreement disclosure from the HKEX prospectus or direct company confirmation.
      relatedQuestionRefs:
        - QI006
        - QI025
      relatedTableRefs:
        - TI003
    - type: missing-source
      severity: minor
      topic: Kunlunxin's IPO underwriter syndicate is only partially confirmed
      missingEvidence: >-
        A complete list of confirmed underwriters/bookrunners for both the Hong Kong and STAR Market listings;
        only CICC's STAR Market role is confirmed via a CSRC filing reference in press coverage.
      whyItMatters: >-
        The underwriter syndicate signals deal credibility and pricing discipline; an incomplete syndicate list
        limits assessment of the IPO's execution risk.
      diligencePath: >-
        Track HKEX and CSRC filings for the complete underwriter syndicate once the prospectus is public.
      relatedQuestionRefs:
        - QI015
      relatedTableRefs:
        - TI004
    - type: missing-source
      severity: material
      topic: How much of China's Big Fund III state semiconductor financing reaches Kunlunxin specifically is undisclosed
      missingEvidence: >-
        A quantified breakdown of any Big Fund III (or other state semiconductor fund) capital allocated directly
        or indirectly to Kunlunxin, as distinct from SMIC or the broader domestic chip ecosystem.
      whyItMatters: >-
        Without this figure, it is unclear whether Kunlunxin benefits materially from state financing or relies
        primarily on private capital and its own commercial revenue.
      diligencePath: >-
        Request disclosure of any state-fund participation or subsidy arrangements from Kunlunxin's HKEX prospectus
        or investor relations.
      relatedQuestionRefs:
