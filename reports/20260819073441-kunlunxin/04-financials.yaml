  - id: TI005
    title: Public financial gaps table
    columns:
      - missing private metric
      - impact
      - exact diligence path
    rows:
      - - Reconciled 2025 revenue figure
        - >-
          Blocks any confident price-to-sales or growth-rate analysis; current estimates span roughly $500M to
          $2.9B, a 5-6x unreconciled range
        - Obtain audited FY2025 revenue from the HKEX prospectus once public; treat all press figures as estimates
          until then.
      - - Gross margin and cost structure
        - Prevents assessment of whether growth is margin-accretive; peer proxies suggest a 50%+ band but Kunlunxin's
          own figure is undisclosed
        - Request FY2024/FY2025 gross margin and cost-of-goods breakdown from the prospectus.
      - - Employee headcount
        - Limits scale and cost-structure comparison with listed peers (Cambricon, Moore Threads, Biren, Iluvatar
          CoreX all disclose headcount in filings)
        - Request headcount directly from Kunlunxin/Baidu investor relations or the HKEX prospectus.
      - - Cash position, burn rate, and runway
        - Prevents any independent assessment of capital adequacy ahead of the IPO
        - Request balance-sheet and cash-flow detail from the HKEX prospectus.
      - - Manufacturing foundry confirmation (SMIC vs. residual TSMC exposure)
        - Affects cost-structure and supply-chain-risk assessment; industry consensus assumes SMIC 7nm DUV but this
          is not company-confirmed
        - Request foundry and supply-agreement disclosure from the prospectus or direct company confirmation.
      - - IPO underwriter syndicate and final offering terms
        - Prevents assessment of deal credibility, pricing discipline, and allocation structure
        - Track HKEX filings for the public listing document once Kunlunxin converts from confidential to public
          filing status.
    notes: >-
      Each row reflects a genuine public-disclosure gap identified across the sources reviewed for this chapter,
      not an assumed zero or negative finding; entries will be superseded once Kunlunxin's HKEX prospectus is public.
