        - label: Iluvatar CoreX (peer proxy)
          values:
            - GPGPU products; foundry not detailed in the annual result reviewed
            - "Loss-making (RMB437.7M adjusted, FY2025); disclosed via audited HKEX filing"
            - Already listed (HKEX, Jan 2026)
    approximationNotes: null
    claimRefs:
