figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: standard
    summary: >-
      Kunlunxin's revenue mechanism runs from chip/cluster production through Baidu-internal and external customer
      channels into a still-unreconciled top-line figure.
    data:
      nodes:
        - id: production
          label: Chip/cluster production (SMIC-believed foundry)
          detail: P800/Kunlun III chips manufactured on an inferred SMIC 7nm DUV process.
          tone: neutral
        - id: baidu-internal
          label: Baidu-internal sales
          detail: Largest single revenue stream; related-party pricing undisclosed.
          tone: neutral
        - id: external-sales
          label: External enterprise/SOE/hyperscaler sales
          detail: China Mobile, Tencent, China Merchants Bank, China Southern Power Grid, Geely.
          tone: positive
        - id: reported-revenue
          label: Reported 2025 revenue (unreconciled)
          detail: "Ranges from ~$500M (CNBC) to ~$2.9B (Tencent Tech/BigGo) depending on source."
          tone: warning
        - id: gross-profit
          label: Gross profit (undisclosed)
          detail: No Kunlunxin-specific gross margin disclosed; peer proxies suggest a 50%+ band.
          tone: warning
      edges:
        - from: production
          to: baidu-internal
        - from: production
          to: external-sales
        - from: baidu-internal
          to: reported-revenue
        - from: external-sales
          to: reported-revenue
        - from: reported-revenue
          to: gross-profit
    approximationNotes: >-
      This bridge is qualitative; no source reviewed provides a quantified revenue-to-gross-profit waterfall
      specific to Kunlunxin.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI021
      - CI022
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: >-
      Because Kunlunxin discloses no unit-economics inputs, this bridge uses qualitative nodes annotated with the
      closest available peer proxies (Biren Technology, Iluvatar CoreX).
    data:
      nodes:
        - id: chip-cost
          label: Manufacturing cost (SMIC 7nm DUV, inferred)
          detail: "Estimated 25-50% higher cost than TSMC EUV equivalent due to DUV multi-patterning."
          tone: warning
        - id: gross-margin
          label: Gross margin (undisclosed; peer proxy ~50-54%)
          detail: Biren Technology FY2025 gross margin 53.8%; Iluvatar CoreX FY2025 gross margin ~54%.
          tone: neutral
        - id: rd-spend
          label: R&D spend (undisclosed; peer proxy RMB1.5B, Biren FY2025)
          detail: Capital-intensity proxy only; Kunlunxin's own R&D spend is not disclosed.
          tone: warning
        - id: net-result
          label: Net result (undisclosed; peer proxy remains loss-making)
          detail: Both Biren and Iluvatar CoreX remained loss-making on an adjusted basis in FY2025 despite 50%+ margins.
          tone: warning
      edges:
        - from: chip-cost
          to: gross-margin
        - from: gross-margin
          to: rd-spend
        - from: rd-spend
          to: net-result
    approximationNotes: >-
      Every quantified value in this figure is a peer proxy (Biren Technology or Iluvatar CoreX audited FY2025
      results), not a Kunlunxin-specific disclosure; treat this bridge as illustrative of the sector pattern, not a
      Kunlunxin-specific model.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI012
  - id: FI003
    title: Financial estimate range
    type: range
    layout: standard
    summary: >-
      Kunlunxin's 2025 revenue and implied IPO price-to-sales multiple both span very wide ranges given
      unreconciled press estimates.
    data:
      items:
        - label: 2025 revenue (USD millions)
          low: 500
          base: 1200
          high: 2900
          unit: USD millions
        - label: Implied P/S multiple at ~$50B IPO target
          low: 17
          base: 40
          high: 100
          unit: "x revenue"
    approximationNotes: >-
      The 2025 revenue range uses CNBC's ~$500M figure as the low bound and the Tencent Tech/BigGo Finance
      "far exceeding RMB20B" (~$2.9B) figure as the high bound, with a $1.2B base case reflecting the J.P. Morgan
      RMB13B (~$1.8B) 2025 estimate discounted for currency/estimate uncertainty; the P/S range divides the reported
      ~$50B IPO target by each revenue bound. None of these figures are confirmed in a public prospectus.
    claimRefs:
      - CI002
      - CI003
      - CI021
      - CI024
