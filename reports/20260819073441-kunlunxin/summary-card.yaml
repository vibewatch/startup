summary:
  headline: >-
    Kunlunxin has real, independently corroborated commercial traction (China Mobile, Tencent) inside a booming domestic
    chip market, but its reported ~$50B IPO target rests on unreconciled revenue, an unconfirmed manufacturing foundry,
    and a chip-purchase-linked structure flagged by analysts for circular-financing risk.
