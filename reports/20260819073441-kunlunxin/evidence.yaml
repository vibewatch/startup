evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: Kunlunxin 2025 revenue estimates conflict by roughly 5-6x across independent press reports
    missingEvidence: >-
      A single, source-reconciled 2025 revenue figure for Kunlunxin; current press estimates range from ~RMB3.5B
      (~$500M) to ~RMB20B+ (~$2.9B).
    whyItMatters: >-
      Revenue is the anchor for any valuation-multiple analysis of the reported ~$50B IPO target; an unresolved 5-6x
      spread makes any price-to-sales conclusion highly uncertain.
    diligencePath: >-
      Obtain Kunlunxin's HKEX prospectus once public, or request audited management accounts directly, to reconcile the
      CNBC and Tencent Tech-sourced revenue figures.
    relatedQuestionRefs:
      - QO012
      - QO027
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: Kunlunxin employee headcount is not disclosed in any source reviewed
    missingEvidence: A specific, current employee headcount figure for Kunlunxin.
    whyItMatters: >-
      Headcount is a standard scale and cost-structure indicator; its absence limits comparison with listed peers such
      as Cambricon and Moore Threads.
    diligencePath: Request headcount directly from Kunlunxin/Baidu investor relations or from the HKEX prospectus.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: Kunlunxin's direct exposure to US export controls or Entity List designation is unconfirmed
    missingEvidence: >-
      A definitive, current statement of whether Kunlunxin (as distinct from Baidu or other Chinese chipmakers) is
      subject to any specific US export-control or Entity List action.
    whyItMatters: >-
      Direct designation would materially affect access to foundry capacity, EDA tools, and international investor
      appetite ahead of the IPO.
    diligencePath: >-
      Monitor BIS Entity List updates and request legal/compliance confirmation from Kunlunxin as part of IPO due
      diligence.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs: []
  - type: access-blocked
    severity: blocking
    topic: Kunlunxin's HKEX Form A1 prospectus remains confidential as of the report run date
    missingEvidence: The public HKEX prospectus, including audited financials, underwriter syndicate, and final offering terms.
    whyItMatters: >-
      Nearly every valuation, revenue, and capital-structure figure in this chapter is a press estimate pending this
      document; the underwriter syndicate is also not yet confirmed in any source reviewed.
    diligencePath: >-
      Track HKEX filings for the public listing document once Kunlunxin converts from confidential to public filing
      status.
    relatedQuestionRefs:
      - QO007
      - QO028
    relatedTableRefs:
