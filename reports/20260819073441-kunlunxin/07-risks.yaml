  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold/event
      - action implication
    rows:
      - - US export-control / Entity List designation
        - BIS Entity List update naming Kunlunxin directly
        - Any official BIS Federal Register entry naming Kunlunxin (Beijing) Technology Co., Ltd.
        - Immediate reassessment of supply-chain access, investor appetite, and thesis viability.
      - - Unreconciled revenue estimates
        - HKEX prospectus publication of audited FY2024/FY2025 revenue
        - Confirmed revenue figure falling materially outside the ~$500M-$2.9B estimated range
        - Recalibrate valuation-multiple analysis using the confirmed figure.
      - - SMIC manufacturing capacity/yield shortfall
        - Disclosed shipment volume growth rate versus roadmap commitments (M100 ramp, Tianchi clusters)
        - Shipment volume materially below the pace implied by the M100/Tianchi roadmap
        - Downgrade confidence in Kunlunxin's ability to scale to compete with Huawei/Cambricon.
      - - Tencent relationship non-recurrence
        - Subsequent disclosure (press or prospectus) of Tencent order size/renewal
        - No confirmed repeat or expanded Tencent order within 12 months of the initial 2026 disclosure
        - Downgrade the strength of Kunlunxin's cross-rival customer-validation narrative.
      - - IPO withdrawal, delay, or material repricing
        - HKEX/STAR Market filing status updates
        - IPO withdrawn, indefinitely delayed, or priced materially below the ~$50B roadshow target
        - Reassess Kunlunxin's capital-markets credibility and the durability of its private-market valuation.
      - - Chip-purchase-commitment structure regulatory pushback
        - HKEX/SFC or CSRC public guidance on the cornerstone chip-purchase structure
        - Regulatory requirement to materially restructure or unwind the chip-purchase-linked cornerstone terms
        - Reassess whether reported external revenue commitments are durable post-restructuring.
