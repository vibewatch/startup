company:
  name: Kunlunxin
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Kunlunxin (Beijing) Technology Co., Ltd. is Baidu's AI-chip subsidiary, spun off in 2021 from a chip-design team
    that began inside Baidu in 2011. Public evidence supports a fast-escalating capital story -- from a ~$1.9 billion
    spin-off valuation to a ~$3.0 billion Series D and now a Hong Kong IPO reportedly targeted near $50 billion -- but
    headcount, an audited revenue figure, and final listing terms remain unresolved ahead of a still-confidential HKEX
    prospectus.
sections:
  - id: identity-product-structure
    title: Identity, product, and corporate structure
    body: >-
      Kunlunxin (Beijing) Technology Co., Ltd. (昆仑芯) is the semiconductor design subsidiary of Baidu, Inc., building
      AI training and inference accelerators under the Kunlun brand. The lineage traces to 2011, when Baidu's
      Intelligent Chip and Architecture Department began researching a many-small-core "XPU" microarchitecture, first
      emulated on FPGAs and then taped out as dedicated silicon. Baidu unveiled the first Kunlun chip (K200 / Kunlun I)
      in July 2018 on Samsung's 14nm process with 16GB of HBM2 memory, and in April 2021 spun the chip team into the
      independent entity now called Kunlunxin, which closed its first outside funding round the same year. Kunlun II
      followed in August 2021 on a TSMC 7nm process, pitched publicly as a rival to Nvidia's A100. The current
      flagship, P800 (Kunlun III), launched in 2025 for large-cluster training and inference and gained full DeepSeek
      R1/V3 compatibility in February 2025; Baidu activated a 30,000-chip P800 cluster in April 2025 to train
      "DeepSeek-like" models and support simultaneous enterprise fine-tuning. Baidu has already disclosed a two-chip
      roadmap beyond P800: the inference-optimized M100 (targeted 2026, in commercial ramp-up since January 2026, with
      its physical product surfacing on Chinese state television in July 2026) and the training-focused M300 (targeted
      2027). Kunlunxin's own website now describes the entity using the Chinese "股份有限公司" (joint-stock company)
      designation rather than the "有限公司" (limited company) form used in earlier public records, consistent with the
      corporate-form conversion Chinese companies typically complete ahead of a public listing.
