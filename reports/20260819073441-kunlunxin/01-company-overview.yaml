  - id: funding-valuation
    title: Funding history, valuation, and capital structure
    body: >-
      Kunlunxin's capital history shows a steep and increasingly compressed valuation curve. The April 2021 spin-off
      round, led by CPE with IDG Capital, Legend Capital, and Yuanhe Puhua participating, valued the new company at
      roughly RMB13 billion (~$1.9 billion). A Series D round closed in July 2025, raising about $283 million (~RMB2.1
      billion) from investors including BYD, CICC Guanbo, China Mobile's Zhongyi Hechuang investment vehicle, and a
      state-backed High-Level Talent Fund under China Reform Holdings, lifting the post-money valuation to
      approximately RMB21 billion (~$3.0 billion). On January 1, 2026, Kunlunxin confidentially submitted a Form A1
      listing application to the Hong Kong Stock Exchange main board; Baidu's Hong Kong shares rose as much as 9.35% on
      the disclosure. From there the reported number moved fast: an intermediate ~$14.7 billion figure circulated in
      the weeks before Kunlunxin launched a parallel Shanghai STAR Market "tutoring" process in May 2026 (guidance then
      near HK$100 billion, ~$13 billion), and by a June 29, 2026 investor-roadshow report the Hong Kong target had
      reached roughly $50 billion, with Baidu ADRs and Hong Kong shares both jumping on the news. At that level,
      Kunlunxin's implied valuation (about 1.32x) exceeded Baidu's own roughly $38 billion market capitalization on the
      same trading day -- a striking "subsidiary out-valuing parent" dynamic flagged by multiple outlets. None of these
      IPO-era figures are yet locked into a public prospectus; Kunlunxin remained a private company as of this report's
      August 2026 run date, with final Hong Kong and STAR Market pricing, share allocation, and underwriter syndicate
      still undisclosed.
