callouts:
  - calloutType: strength
    title: DeepSeek-class cluster proof and annual chip cadence
    body: >-
      Kunlunxin's P800 cluster has already demonstrated 30,000-chip-scale training runs pitched as DeepSeek-class, and
      Baidu has committed publicly to an annual chip-iteration cadence (M100 in 2026, M300 in 2027), giving the
      product roadmap more third-party visibility than most private Chinese chip startups disclose.
    claimRefs:
      - CO006
      - CO007
      - CO008
  - calloutType: risk
    title: Chip-purchase-linked IPO structure invites circular-financing scrutiny
    body: >-
      Reports that cornerstone investors must commit to buying chips worth three to seven times their equity stake,
      combined with a roughly 16x valuation jump in under twelve months, have drawn explicit analyst concern that
      reported external demand may partly reflect the IPO structure itself rather than organic commercial pull.
    claimRefs:
      - CO028
      - CO043
      - CO044
      - CO045
  - calloutType: insight
    title: Baidu is simultaneously controller, customer, and IPO sponsor
    body: >-
      Baidu's ~59.45% equity stake, its role as Kunlunxin's largest customer, and its sponsorship of the spin-off
      listing all run through the same relationship, which concentrates governance, commercial, and capital-markets
      leverage in one counterparty and warrants close related-party scrutiny in later chapters.
    claimRefs:
      - CO015
      - CO018
      - CO040
