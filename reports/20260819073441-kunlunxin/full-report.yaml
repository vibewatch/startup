        title: Revenue streams, monetization, and go-to-market
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin's core revenue mechanism is direct chip and cluster sales -- AI accelerator hardware plus its
              XTCL/ XBLAS/XDNN software stack -- sold both to Baidu's own internal AI infrastructure and to external
              enterprise and government customers via centralized tenders (e.g., the China Mobile win) or direct
              contracts (Tencent, China Merchants Bank, China Southern Power Grid, Geely, Vivo). No public price list
              exists for any Kunlunxin chip; the closest public monetization signals come from Baidu's own framing that
              Kunlunxin's revenue "far exceeds" prior years as external customers scale, and from J.P. Morgan's November
              2025 estimate that chip-related revenue could grow more than sixfold from about RMB13 billion in 2025 to
              RMB83 billion in 2026. Go-to-market still runs substantially through Baidu's own cloud and enterprise
              sales relationships rather than an independently built channel, which is consistent with Kunlunxin's
              origin as an internal Baidu chip program before its 2021 spin-off. External (non-Baidu) revenue reportedly
              rose from about 40% of the total in 2024 to more than 50% in 2025, the clearest available proxy for
              revenue-mix quality, though it remains a press estimate rather than an audited segment disclosure.
