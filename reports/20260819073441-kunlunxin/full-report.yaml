      - number: '7.4'
        title: People, execution risk, and mitigation triggers
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin's leadership shows meaningful key-person and governance concentration rather than a classic
              venture-backed founder-team profile. Ouyang Jian, the sole named Kunlunxin-specific executive (CEO since
              the 2021 spin-off), is the only person in the public record with a dedicated Kunlunxin operating title;
              every other named leader (Robin Li, Shen Dou, Haijian He) is a Baidu corporate officer whose Kunlunxin
              responsibilities are secondary to their Baidu roles, meaning Kunlunxin does not have full-time,
              independent C-suite depth in the public record. Execution risk is elevated by the scale of the current
              program: Kunlunxin must simultaneously execute a dual Hong Kong/STAR Market listing process, scale
              external commercial revenue from roughly 40% to over 50% of the total in a single year, ship the M100 chip
              through commercial ramp-up, and prepare the M300 chip for a 2027 release, all while its overall shipment
              share (~3% of the China market) trails Huawei's (~20%) by a wide margin. This chapter's mitigation and
              kill-criteria table converts the risks above into monitorable triggers -- an Entity List designation, a
              failure to reconcile the 5-6x revenue estimate gap in the HKEX prospectus, confirmed SMIC allocation
              shortfalls, non-recurrence of the Tencent relationship, or a withdrawn/repriced IPO -- any of which would
              materially change this report's investment thesis.
