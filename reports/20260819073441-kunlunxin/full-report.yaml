  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow fit
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Kunlunxin sells AI accelerator hardware (the Kunlun chip family) plus a
              CUDA-alternative software stack that lets model developers train and serve large models without rewriting
              their code for a new hardware target. For a model-training customer, the workflow is: write or port a
              model in PaddlePaddle, TensorFlow, or PyTorch; compile it through Kunlunxin's XTCL graph-compilation
              library (built on TVM); run it on XPU-R hardware via a CUDA-like kernel/launch programming model with
              explicit host-device memory transfers over PCIe. For an inference customer, Kunlunxin's own case-study
              material describes replacing a GPU-based PyTorch pipeline with a Kunlun-Paddle solution in an industrial
              quality-inspection use case, reporting a 65% cost reduction and a 9% performance improvement -- a
              company-sourced but concretely quantified benefit. At cluster scale, Kunlunxin's P800-based "Super-Node"
              products (32/64-card single-cabinet configurations) target internet, finance, energy, transportation, and
              education customers who need multi-card training or high-throughput inference without building bespoke
              cluster infrastructure themselves. Since 2018, Kunlun chip integration with PaddlePaddle has progressed
              from Paddle Lite inference-only support to full training support in PaddlePaddle 2.0 and later, with
              switching to the XPU backend requiring what Kunlunxin describes as a single code-line change -- a claim
              this chapter treats as company-sourced rather than independently benchmarked.
