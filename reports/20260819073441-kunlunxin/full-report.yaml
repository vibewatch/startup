      - number: '2.4'
        title: Contradictory estimates and sizing diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Several widely cited figures conflict or cannot be independently reconciled from the sources reviewed.
              Bernstein's forecast that China becomes a net AI-chip exporter by 2028 sits uneasily next to the Council
              on Foreign Relations' assessment that the best US chips remained roughly 5x more powerful than China's
              best in 2025, a gap CFR expects to widen to as much as 17x by 2027 -- meaning unit-shipment share and raw
              compute share can move in opposite directions at the same time. Separately, an August 2026 report found
              many Chinese AI developers still renting Nvidia compute through offshore cloud arrangements in Southeast
              Asia specifically to avoid the CUDA migration cost, which complicates any reading of the 41%
              domestic-shipment figure as equivalent to 41% of actual AI compute consumed. No source reviewed isolates
              Kunlunxin's addressable market independent of Baidu's own internal demand, nor does any source provide an
              independently verified benchmark of P800 performance against Nvidia's H100/H200 -- Morgan Stanley's cited
              estimate of roughly 1,521 tokens/second on DeepSeek R1 inference (positioning P800 between H20 and A100)
              is the most credible third-party data point available, but it is a single estimate rather than a
              reproducible benchmark suite. These gaps matter because they mean Kunlunxin's market-share and margin
              trajectory cannot yet be modeled with the same confidence as Huawei's or Cambricon's.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin's competitive set spans direct domestic peers, the dominant incumbent, and the export-restricted
              status quo. Huawei's Ascend line (910B/910C, and the newer Atlas 350) is the domestic incumbent, backed by
              Huawei's own CANN software stack and SMIC's production priority. Cambricon and Moore Threads are the two
              domestic peers that have already gone public (Cambricon on Shanghai's STAR Market historically, Moore
              Threads via a December 2025 STAR Market debut), each reaching valuations far above Kunlunxin's private
              mark. Biren Technology and Iluvatar CoreX both completed Hong Kong listings in the same December
              2025-January 2026 window Kunlunxin is targeting, while Enflame Technology and Alibaba's in-house unit
              T-Head (Pingtouge) remain in pre-IPO or internal-only stages. Beyond these direct peers, the status quo
              alternative for any Chinese buyer is simply continuing to source Nvidia (and to a lesser extent AMD) chips
              where export licenses or offshore cloud rental permit it, or building chips fully in-house rather than
              buying from any of the above vendors. Collectively, at least six AI chip companies either listed or
              advanced a public listing process between December 2025 and June 2026, and the combined market value of
              the "domestic GPU legion" (Cambricon, Moore Threads, Biren, Enflame, Hygon, and others) was approaching
              RMB 2 trillion by mid-2026 -- a valuation wave Kunlunxin's own IPO is explicitly riding.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
