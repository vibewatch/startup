      - number: '7.3'
        title: Partner and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin's most consequential dependency risk is structural: Baidu is simultaneously its ~59.45%
              controlling shareholder, its largest customer, and the sponsor of its IPO, concentrating governance,
              commercial, and capital-markets leverage in a single counterparty that cannot be diversified away simply
              by adding more external customers. A second dependency risk sits with SMIC as sole (believed) foundry,
              which is itself capacity-constrained and reportedly deprioritizes Kunlunxin's orders behind Huawei's. A
              third dependency runs through Kunlunxin's open-source software ecosystem (PaddlePaddle, the TVM-based XTCL
              compiler, and LLVM), which gives Kunlunxin credible developer tooling but also ties its competitive
              position to the health and pace of external open-source projects it does not fully control. A fourth
              dependency is customer concentration among Kunlunxin's largest named external accounts: the China Mobile
              centralized-tender win (RMB1B+) and the 2026 Tencent relationship are each individually large enough that
              non-renewal or non-recurrence of either would materially affect Kunlunxin's external-revenue growth
              narrative, and neither relationship's duration or renewal terms are disclosed. Finally, the IPO itself
              introduces a financing dependency: Kunlunxin's own reported IPO structure ties investor capital to
              chip-purchase commitments, meaning execution risk in the IPO process (pricing, investor demand, or
              regulatory delay) could simultaneously threaten both the capital raise and the revenue pipeline it is
              designed to pre-load.
            claimRefs:
              - CR014
              - CR015
