            body: >-
              Kunlunxin's customer base splits into five segments with distinct buyer/user/payer structures. Baidu
              itself is simultaneously owner, largest customer, and technology co-developer, consuming P800 chips for
              its own Wenxin/Ernie model training and Apollo autonomous-driving stack. Telecom and financial SOEs (China
              Mobile, China Merchants Bank) buy through centralized procurement tenders, exemplified by Kunlunxin's RMB1
              billion-plus China Mobile win in August 2025 across all three general-computing bid packages. Energy and
              industrial SOEs (China Southern Power Grid) and automotive OEMs (Geely, with BYD confirmed only as an
