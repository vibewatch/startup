  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case rests on four pillars: (1) Kunlunxin sits inside China's fastest-growing chip segment, with
              domestic AI accelerator vendors' collective China shipment share crossing 41% in 2025 and continuing to
              rise under sustained US export controls and "Buy China" policy support; (2) Kunlunxin's P800 chip has
              cleared a real, adversarial market test -- Tencent, a direct Baidu rival, began sourcing P800 chips at
              scale in 2026, which multiple outlets treat as the strongest available third-party validation; (3)
              external revenue share has risen from roughly 40% (2024) to over 50% (2025), suggesting genuine commercial
              traction beyond captive Baidu demand; and (4) Kunlunxin's decade-long R&D history (since 2011) and
              PaddlePaddle-native software stack give it a maturity edge over several newer domestic chip startups. The
              anti-thesis is at least as strong: Kunlunxin's ~$50 billion IPO target is roughly 16x its Series D
              valuation from twelve months earlier, and its unusual requirement that cornerstone investors buy chips
              worth three to seven times their equity stake raises a credible circular-financing concern about whether
              reported external demand is organic; its 2025 revenue is estimated anywhere from ~$500 million to ~$2.9
              billion depending on the source, a 5-6x unreconciled gap that undermines any confident multiple-based
              valuation; its manufacturing foundry (believed SMIC, unconfirmed) is both capacity-constrained and
              reportedly subordinated to Huawei's own priority allocation; and Baidu's dual role as ~59.45% controlling
              shareholder and largest customer creates a related-party structure that limits how independently
              Kunlunxin's growth story can be verified. What would change this view: a public HKEX prospectus
              reconciling the revenue estimates, confirmation of Kunlunxin's foundry and yield rate, and evidence that
              the Tencent relationship recurs or scales rather than remaining a single disclosed order.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.2'
        title: Financing context, entry discipline, and recommendation
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin's private financing history shows valuations of roughly $1.9 billion (April 2021 spin-off), $3.0
              billion (July 2025 Series D), then a rapid escalation through IPO-era guidance: ~$14.7 billion (May 2026),
              ~HK$100 billion (~$12.8-13 billion, STAR Market guidance, May 2026), and ~$50 billion (June 2026 roadshow
              reporting). No source reviewed discloses preference-stack, liquidation-preference, or dilution terms for
              any private round, and the IPO's final pricing, share allocation, and underwriter syndicate remain
              undisclosed pending a public prospectus (only CICC's role advising the STAR Market track is confirmed, via
              a CSRC filing cited by GuruFocus). Entry discipline at the private-market level would require confirming
              which revenue figure (the ~$500 million CNBC estimate or the ~$2.9 billion Tencent Tech/BigGo Finance
              estimate) the market is actually pricing, since the implied price-to-sales ratio at $50 billion ranges
              from roughly 17x to 100x -- a range that spans "aggressive but within the sector's frothy norms"
              (Cambricon trades at a comparable 55-85x range) to "difficult to justify on any comparable basis." Given
              the unresolved revenue gap, the unconfirmed foundry/yield picture, the absence of independent benchmarks,
              and the circular-financing question mark over the IPO structure itself, this report's recommendation is
              research-more: neither a buy (valuation and revenue-quality evidence are too incomplete) nor an outright
              avoid (the underlying commercial traction -- China Mobile, Tencent, and a rising external-revenue share --
              is real and independently corroborated). Risk rating is high; valuation stance is stretched-to-expensive;
              confidence in this recommendation is medium, reflecting genuine uncertainty rather than a weak evidence
              base.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV013
              - CV002
      - number: '8.3'
        title: Bull, base, and bear scenarios with comparables
        blocks:
          - type: paragraph
            body: >-
              In a bull scenario, Kunlunxin's 2025 revenue reconciles toward the higher ~$2.9 billion estimate, external
              revenue share continues rising past 50%, the Tencent relationship scales into a recurring multi-year
              contract, SMIC capacity/yield improves enough to support the M100 ramp and M300 launch on schedule, and
              the IPO prices near or above the $50 billion roadshow target -- implying a price-to-sales multiple around
              17x, broadly defensible against Cambricon's comparable range. In a base scenario, revenue settles nearer a
              J.P. Morgan-consistent ~$1.2-1.8 billion for 2025-2026, external share stabilizes in the 50-60% range, and
              the IPO prices closer to the earlier HK$100 billion (~$13 billion) STAR Market guidance rather than the
              escalated $50 billion figure -- a valuation this report views as better supported by the evidence
              reviewed. In a bear scenario, revenue reconciles toward the lower ~$500 million CNBC estimate, the Tencent
              order proves to be a one-off validation purchase rather than a recurring relationship, SMIC allocation
              shortfalls constrain shipment growth, and the IPO is delayed, repriced materially downward, or draws
              regulatory scrutiny over the chip-purchase-commitment structure -- a combination that would make the
              reported $50 billion target difficult to defend under any comparable methodology. The relevant comparable
              set spans four already-public or newly-public Chinese AI chip companies (Cambricon, Moore Threads, Biren
              Technology, Iluvatar CoreX) plus Nvidia as the global multiple benchmark, none of which is a perfect match
              for Kunlunxin's Baidu-affiliated, still-private structure, but together they bound a defensible valuation
              range.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
