      - number: '7.2'
        title: Operational, manufacturing, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin's most concrete operational risk is manufacturing dependency on a capacity-constrained, likely
              cost-disadvantaged foundry. Industry consensus (not company-confirmed) places P800 production on SMIC's
              7nm DUV-based process, which runs an estimated 25-50% higher cost and meaningfully lower yield than TSMC's
              EUV-based equivalent, and SMIC reportedly prioritizes Huawei's wafer allocation over other domestic
              customers including Cambricon and Kunlunxin -- a structural disadvantage smaller vendors cannot easily
              replicate. HBM memory supply is a second capacity bottleneck: domestic HBM producer CXMT remains immature
              relative to Samsung/SK Hynix, and Kunlunxin's specific memory-sourcing arrangement is not disclosed. On
              product quality, no source reviewed discloses a Kunlunxin-specific chip yield rate, independent
              safety/reliability certification, or formal quality-control metric; the closest available proxy is
              Huawei's own disclosed yield improvement (from about 20% to nearly 40% at SMIC), which is not transferable
              to Kunlunxin given Huawei's reported production-priority status. No independently reproducible benchmark
              (e.g., an MLPerf-style test) comparing Kunlunxin's chips against Huawei Ascend, Cambricon, or Nvidia chips
              on identical workloads was located in any source reviewed, leaving competitive and reliability claims
              resting on a single third-party estimate (Morgan Stanley, ~1,521 tokens/second on DeepSeek R1) and
              company-sourced material.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
