          value: 10
          detail: >-
            Only Baidu's multi-generation purchasing is clearly documented as recurring; other accounts' renewal status
            is undisclosed.
    approximationNotes: >-
      Stage values are illustrative relative weights based on qualitative evidence across named customer wins, not a
      measured conversion-rate funnel from a single dataset.
    claimRefs:
      - CU007
      - CU008
      - CU013
      - CU014
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Evidence quality varies significantly across named Kunlunxin customers, from Baidu's deep but related-party
      evidence to Tencent's high-validation-value but single-source disclosure.
    data:
      columns:
        - Baidu
        - China Mobile
        - Tencent
        - China Merchants Bank
      rows:
        - label: Evidence independence
          values:
            - Low (related party)
            - High (independent procurement press)
            - Medium (single-source, The Information via China Biz Insider)
            - Medium (BigGo Finance secondary reporting)
        - label: Outcome specificity
          values:
            - 'High (named models trained: Wenxin 4.5 Turbo, 5.1)'
            - Medium (contract value disclosed; outcome not detailed)
            - Low (cluster size disclosed; outcome not detailed)
            - Low (contract win only, no outcome detail)
        - label: Production maturity
          values:
            - Confirmed production, multi-generation
            - Confirmed production (single tender cycle)
            - Confirmed production (2026, newly disclosed)
            - Confirmed production (contract win, March 2025)
    approximationNotes: null
    claimRefs:
      - CU007
      - CU009
      - CU011
      - CU012
      - CU022
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Kunlunxin's highest-severity risks cluster around export-control exposure, SMIC manufacturing dependency, and the
      Baidu governance/customer overlap, while people/execution risks are comparatively more moderate.
    data:
      columns:
        - Likelihood
        - Severity
        - Mitigation maturity
      rows:
        - label: US export-control / Entity List risk
          values:
            - Medium
            - Critical
            - Low
        - label: SMIC foundry / wafer-allocation risk
          values:
            - High
            - Critical
            - Low
        - label: Baidu controller/customer concentration
          values:
            - High
            - Critical
            - Low
        - label: IPO chip-purchase-commitment structure
          values:
            - Medium
            - High
            - Low
        - label: Customer concentration (China Mobile, Tencent)
          values:
            - Medium
            - High
            - Low
        - label: Key-person / executive-depth risk
          values:
            - Medium
            - High
            - Low
        - label: Manufacturing yield / benchmark opacity
          values:
            - High
            - Medium
            - Low
        - label: Dual-listing execution risk
          values:
            - Medium
            - Medium
            - Medium
    approximationNotes: >-
      Likelihood, severity, and mitigation-maturity values are this report's own qualitative ordinal assessment based on
      the evidence cited across this chapter; Kunlunxin has not published a comparable risk matrix.
    claimRefs:
      - CR001
      - CR009
      - CR014
      - CR020
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Kunlunxin's key risks transmit into revenue, financing, and valuation through a small number of shared choke
      points: SMIC manufacturing capacity, Baidu's dual controller/customer role, and the IPO process itself.
    data:
      nodes:
        - id: smic-risk
          label: SMIC capacity / wafer-allocation risk
          tone: warning
        - id: export-control-risk
          label: US export-control / Entity List risk
          tone: warning
        - id: baidu-concentration
          label: Baidu controller/customer concentration
          tone: warning
        - id: customer-concentration
          label: External customer concentration (China Mobile, Tencent)
          tone: warning
        - id: shipment-scale
          label: Shipment volume / production scale
          tone: neutral
        - id: revenue
          label: Reported revenue (unreconciled)
          tone: warning
        - id: ipo-structure
          label: IPO chip-purchase-linked financing
          tone: warning
        - id: valuation
          label: Reported IPO valuation target (~$50B)
          tone: warning
      edges:
        - from: smic-risk
          to: shipment-scale
        - from: export-control-risk
          to: shipment-scale
        - from: shipment-scale
          to: revenue
        - from: baidu-concentration
          to: revenue
        - from: customer-concentration
          to: revenue
        - from: revenue
          to: ipo-structure
        - from: ipo-structure
          to: valuation
    approximationNotes: null
    claimRefs:
      - CR009
      - CR014
      - CR017
      - CR018
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Kunlunxin's critical dependencies run through a single foundry, a single controlling/customer relationship, and an
      external open-source software ecosystem, with no disclosed dual-sourcing or diversification strategy for any of
      them.
    data:
      nodes:
        - id: smic-foundry
          label: SMIC (sole believed foundry)
          tone: warning
        - id: hbm-supply
          label: HBM memory supply (CXMT vs. Samsung/SK Hynix, unconfirmed)
          tone: warning
        - id: baidu-parent
          label: Baidu (controller + largest customer)
          tone: warning
        - id: opensource-stack
          label: PaddlePaddle / TVM / LLVM open-source ecosystem
          tone: neutral
        - id: cicc-underwriter
          label: CICC (confirmed STAR Market advisor)
          tone: neutral
        - id: p800-product
          label: P800 (Kunlun III) chip product
          tone: positive
      edges:
        - from: smic-foundry
          to: p800-product
        - from: hbm-supply
          to: p800-product
        - from: opensource-stack
          to: p800-product
        - from: baidu-parent
          to: p800-product
        - from: cicc-underwriter
          to: baidu-parent
    approximationNotes: >-
      SMIC and HBM-supplier nodes are marked "warning" because Kunlunxin's specific foundry and memory-sourcing
      arrangements are inferred from sector-wide reporting, not officially confirmed by the company.
    claimRefs:
      - CR009
      - CR010
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Kunlunxin's recommendation chain runs from real but partial commercial proof, through unresolved financial and
      manufacturing evidence gaps, to a research-more call rather than a buy or avoid.
    data:
      nodes:
        - id: market-scale
          label: Fast-growing, policy-supported market (41%+ domestic share)
          detail: China's domestic AI chip market is growing quickly with policy tailwinds.
          tone: positive
        - id: customer-proof
          label: Real but partial customer proof (China Mobile, Tencent)
          detail: Named, dated commercial wins exist but customer-level detail is thin.
          tone: positive
        - id: financial-gaps
          label: Unresolved financial evidence (5-6x revenue gap, no audited figures)
          detail: Revenue estimates diverge sharply and no audited financials are public yet.
          tone: warning
        - id: manufacturing-risk
          label: Unconfirmed foundry and manufacturing risk (SMIC dependency)
          detail: Foundry attribution is inferred, not confirmed, and SMIC capacity is constrained.
          tone: warning
        - id: ipo-structure-risk
          label: Circular-financing-flagged IPO structure
          detail: Chip-purchase-linked cornerstone commitments raise analyst concern.
          tone: warning
        - id: recommendation
          label: Recommendation - research-more
          detail: Evidence supports neither a confident buy nor an outright avoid at this time.
          tone: neutral
      edges:
        - from: market-scale
          to: recommendation
        - from: customer-proof
          to: recommendation
        - from: financial-gaps
          to: recommendation
        - from: manufacturing-risk
          to: recommendation
        - from: ipo-structure-risk
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV008
      - CV009
      - CV011
      - CV013
      - CV002
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Kunlunxin's implied price-to-sales multiple at the reported $50 billion IPO target is highly sensitive to which
      2025 revenue estimate is used.
    data:
      items:
        - label: P/S at $500M revenue (CNBC low estimate)
          value: 100
        - label: P/S at ~$1.2B revenue (J.P. Morgan-consistent base case)
          value: 42
        - label: P/S at $2.9B revenue (Tencent Tech/BigGo high estimate)
          value: 17
        - label: Cambricon comparable P/S range (low bound)
          value: 55
        - label: Cambricon comparable P/S range (high bound)
          value: 85
    approximationNotes: >-
      P/S values are calculated by dividing the reported ~$50B IPO target by each revenue estimate; the base-case figure
      uses a $1.2B revenue estimate consistent with a currency-adjusted reading of J.P. Morgan's RMB projections. None
      of these figures are confirmed in a public prospectus.
    claimRefs:
      - CV009
      - CV014
      - CV024
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Kunlunxin's reported valuation guidance spans a wide range across 2025-2026, from its last confirmed private round
      to the escalated mid-2026 IPO roadshow target.
    data:
      items:
        - label: Valuation progression (USD billions)
          low: 3
          base: 13
          high: 50
          unit: USD billions
        - label: Implied P/S multiple range (x revenue)
          low: 17
          base: 42
          high: 100
          unit: x revenue
    approximationNotes: >-
      The valuation-progression range uses the July 2025 Series D level (low), the May 2026 STAR Market/HK$100B guidance
      (base, ~$13B), and the June 2026 roadshow target (high, ~$50B); the P/S range corresponds to the
      revenue-sensitivity figure above.
    claimRefs:
      - CV010
      - CV011
      - CV014
      - CV016
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Kunlunxin combines strong top-line growth signals and real customer validation with unresolved financial,
      manufacturing, and structural evidence gaps.
    data:
      items:
        - label: Recommendation
          value: Research-more
          detail: Neither a confident buy nor an outright avoid given the evidence gaps identified.
          tone: neutral
        - label: Risk rating
          value: High
          detail: Export-control, manufacturing-dependency, and governance-concentration risks are all elevated.
          tone: warning
        - label: Valuation stance
          value: Stretched-to-expensive
          detail: Implied P/S ranges from 17x to 100x depending on which revenue estimate is used.
          tone: warning
        - label: Reported IPO target
          value: ~$50B
          detail: Roughly 16x the July 2025 Series D valuation in under 12 months.
          tone: warning
        - label: External revenue share (2025, reported)
          value: '>50%'
          detail: Up from ~40% in 2024, the strongest available growth-quality signal.
          tone: positive
        - label: Confirmed cross-rival customer
          value: Tencent (2026)
          detail: The single strongest third-party validation event identified in this report.
          tone: positive
    approximationNotes: null
    claimRefs:
      - CV008
      - CV009
      - CV011
      - CV013
