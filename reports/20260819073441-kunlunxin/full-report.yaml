      - number: '1.4'
        title: Milestones, commercial traction, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin's commercial record moved from a Baidu-only chip supplier to a company with named external
              customers inside a few years. In August 2025 its AI servers won a centralized procurement bid from China
              Mobile worth more than RMB1 billion (~$139 million) across all three general-computing bid packages, and
              Baidu has separately named China Merchants Bank, China Southern Power Grid, Geely Automobile Holdings, and
              Vivo as external P800 deployers alongside its own internal use. BYD appears twice in the record: as a
              small early investor tied to autonomous-vehicle chip planning per a 2023 DigiTimes report, and again as a
              Series D equity investor in 2025. External (non-Baidu) revenue reportedly rose from about 40% of the total
              in 2024 to more than half in 2025, and Tencent -- a direct Baidu rival -- began procuring P800 chips at
              scale in 2026, which multiple outlets treat as a market-validation signal distinct from captive Baidu
              demand. Reported revenue figures for Kunlunxin conflict sharply across sources: CNBC cites roughly RMB2
              billion for 2024 (with an ~RMB200 million loss) rising to more than RMB3.5 billion (~$500 million,
              breakeven) in 2025, while a Tencent Tech-sourced figure carried by BigGo Finance puts 2024 revenue above
              RMB10 billion (~$1.4 billion) and 2025 revenue "far exceeding" RMB20 billion (~$2.9 billion) -- an
              unreconciled gap of roughly 5-6x that this report treats as an open conflict rather than a single number.
              Kunlunxin's Hong Kong IPO structure also reportedly asks cornerstone investors to commit to buying chips
              worth three to seven times their equity investment, a condition analysts have flagged as raising
              circular-financing concerns about whether external demand is organic. Public evidence does not establish
              Kunlunxin's employee headcount, a reconciled 2025 revenue figure, its manufacturing foundry for P800 (SMIC
              versus TSMC), or whether it faces any direct US export-control designation -- gaps this report carries
              forward as explicit diligence asks rather than invented figures.
