      - number: '2.3'
        title: Buyer segments, growth drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Buyers of Chinese domestic AI accelerators fall into four groups with different budget owners and adoption
              triggers. Hyperscalers (Baidu, Alibaba, Tencent, ByteDance) are the largest and most sophisticated buyers,
              typically running a deliberate multi-vendor strategy -- ByteDance, for example, reportedly spends roughly
              $12.1 billion on AI chips in 2025 (rising toward $14.3 billion in 2026) split across Huawei for heavy
              training, Cambricon for mid-range inference, and Iluvatar CoreX (with Kunlunxin under evaluation) for
              chatbot inference, explicitly to hedge supply risk and optimize cost per workload. State-owned enterprises
              and government-linked buyers (China Mobile, State Grid entities, China Merchants Bank) form a second,
              policy-driven segment whose procurement is shaped by "Xinchuang" (信创) domestic-substitution mandates and
              centralized tender processes, exemplified by Kunlunxin's own RMB1 billion-plus China Mobile win.
              Automotive OEMs (BYD, Geely) form a smaller but strategically important third segment buying compute for
              ADAS and in-vehicle AI. National "East Data West Computing" (东数西算) infrastructure hubs and
              sovereign-compute-focused ministries are a fourth, subsidy-heavy buyer class. The dominant growth driver
              is US export control: the 2025 H20 ban (partially reversed with a 15% Treasury fee) and subsequent Entity
              List actions have repeatedly transferred addressable demand from Nvidia to domestic vendors, reinforced by
              a "Buy China" procurement preference and roughly $47.5 billion in Big Fund III state semiconductor
              financing. DeepSeek-class open models have created a second, demand-side driver by giving every domestic
              chip vendor a concrete, high-profile inference/training workload to court. The principal constraints are
              supply-side: SMIC's most advanced available domestic node (7nm, DUV-based) runs at an estimated 25-50%
              higher cost and meaningfully lower yield than TSMC's EUV equivalent, and it is capacity- constrained
              across Huawei, Cambricon, Biren, and other national-champion customers competing for the same wafers; HBM
              supply from CXMT remains immature versus Samsung/SK Hynix; and the CUDA software ecosystem still requires
              meaningfully more migration engineering for domestic chips even where hardware specifications are
              competitive on paper.
