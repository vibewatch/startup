            title: DeepSeek-class cluster proof and annual chip cadence
            body: >-
              Kunlunxin's P800 cluster has already demonstrated 30,000-chip-scale training runs pitched as
              DeepSeek-class, and Baidu has committed publicly to an annual chip-iteration cadence (M100 in 2026, M300
              in 2027), giving the product roadmap more third-party visibility than most private Chinese chip startups
