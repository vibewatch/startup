      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin's XPU-R architecture separates compute, storage, interconnect, and interface into four hardware
              blocks. The compute block combines SDNN (a software-defined neural-network engine for tensor operations)
              with general-purpose Cluster units; the second-generation design documented by Baidu's own technical salon
              specifies 8 Cluster units and 6 SDNN units delivering up to 128 TFLOPS at FP16, with each Cluster
              containing 64 cores and a hierarchical memory system (local memory, shared memory, 64MB on-chip L3 SRAM,
              then external GDDR6 at 512GB/s). The current P800 (Kunlun III) generation moves to a 7nm process node with
              96GB of HBM3 memory and 2.4-4 TB/s of bandwidth per independent spec aggregation, and TechInsights'
              independent die-level floorplan analysis confirms a 7nm process with over 50 billion transistors and a
              physical separation of matrix computation from communication units -- an architectural choice Kunlunxin
              says improves cluster scaling efficiency. The software stack layers a runtime (drivers, monitors,
              debuggers, profilers), an LLVM-based compiler toolchain (custom Clang front-end, XPU back-end, AOT/JIT
              compilation), high-performance math libraries (XBLAS/XDNN, Kunlunxin's cuBLAS/cuDNN analogues), a
              collective-communication library (XCCL), and the TVM-based XTCL graph compiler that imports models from
              PaddlePaddle, TensorFlow, and PyTorch. Deployment runs through container images and Python wheels (via the
              FastDeploy XPU backend) and a community-maintained vLLM-Kunlun plugin that maps PyTorch operations onto
              XBLAS/XDNN for large-model inference -- both distributed as open-source repositories on GitHub, giving
              Kunlunxin a public developer-signal footprint that most Chinese hardware-only competitors lack.
            claimRefs:
