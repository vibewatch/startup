  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Kunlunxin's XPU-R chip architecture layers compute, memory, interconnect, and interface hardware beneath a
      multi-layer software stack that gives developers a CUDA-like programming model.
    data:
      layers:
        - label: Software - XTCL graph compiler / XBLAS / XDNN / XCCL
          detail: TVM-based graph compilation; math and collective-communication libraries; CUDA-like kernel model.
          tone: positive
        - label: Software - LLVM-based compiler toolchain and runtime
          detail: Custom Clang front-end, XPU back-end, AOT/JIT compilation, drivers, monitors, debuggers, profilers.
          tone: neutral
        - label: Interface - PCIe 4.0 (backward-compatible PCIe 3.0)
          detail: Host-device data transfer for training/inference workloads.
          tone: neutral
        - label: Interconnect - chip-to-chip links
          detail: Enables large-scale distributed training across cluster deployments.
          tone: neutral
        - label: Memory - L3 SRAM (64MB) / GDDR6 (512GB/s) / HBM3 (P800, 96GB)
          detail: Hierarchical on-chip and external memory; HBM3 specific to the current P800 generation.
          tone: neutral
        - label: Compute - SDNN (tensor ops) + Cluster units (general compute)
          detail: 8 Cluster units and 6 SDNN units in the documented generation, up to 128 TFLOPS FP16.
          tone: positive
    approximationNotes: >-
      Layer specifications combine a Baidu technical-salon writeup (documented XPU-R generation) with independently
      aggregated P800 specs (flopper.io) and TechInsights' independent die analysis; the two generations' exact
      specifications are not identical and are shown together only to illustrate the architectural layering.
    claimRefs:
