      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin does not have an independent founder-led executive team in the way many venture-backed startups
              do; instead, its leadership blends a dedicated chip-operating executive with Baidu's own corporate
              officers. Ouyang Jian, Baidu's chief chip architect, became Kunlunxin's CEO at the April 2021 spin-off and
              has run day-to-day chip strategy since. Above him, Baidu Chairman and CEO Robin Li (Li Yanhong) has
              publicly framed the Kunlun program as a 14-year strategic bet and personally confirmed the M100 chip's
              2026 release timeline in a January 2026 interview. Shen Dou, an executive vice-president of Baidu and
              president of its AI Cloud Group, is the company's designated spokesperson for the chip roadmap, having
              announced the M100/M300 timeline and the Tianchi256/512 cluster plans at Baidu World in November 2025.
              Baidu's CFO, Haijian He, tied the Kunlunxin spin-off directly to unlocking shareholder value in Baidu's
              own Q4 2025 earnings release. Governance and control run through Baidu: the parent held roughly a 70.87%
              stake as of a 2023 DigiTimes report, a share diluted to about 59.45% by Kunlunxin's January 2026
              confidential HKEX filing as external investors joined across roughly one funding round per year since
              2021; the same filing shows the shareholder register had broadened to 44 distinct entities. This structure
              creates a key-person dependence anchored less in a classic founder narrative than in continued Baidu
              management sponsorship, and it leaves Baidu simultaneously Kunlunxin's controlling shareholder and its
              single largest customer -- a related-party dynamic later chapters should probe in more financial detail.
