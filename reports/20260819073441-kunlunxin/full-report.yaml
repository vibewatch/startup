              The newest and most significant segment is cross-rival hyperscaler procurement: Tencent began sourcing
              P800 chips at scale in 2026, a relationship multiple outlets frame as the strongest available
              market-validation signal precisely because Tencent has every incentive to find fault with a competitor's
              product rather than validate it. Adoption trajectory data is thin: external (non-Baidu) revenue reportedly
              rose from about 40% of the total in 2024 to more than 50% in 2025, and Kunlunxin's overall 2025 AI-chip
