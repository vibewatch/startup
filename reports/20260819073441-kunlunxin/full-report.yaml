  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacencies
        blocks:
          - type: paragraph
            body: >-
              This chapter treats "the market" as China's domestic AI accelerator (training and inference chip) market
              -- the segment of compute spend covering GPU/ASIC-class chips purchased by Chinese hyperscalers,
              state-owned enterprises, and government-linked data-center operators for AI workloads. It excludes
              general-purpose CPU servers, non-AI networking equipment, and non-China chip demand (Kunlunxin has no
              disclosed sales outside China). Adjacent but distinct markets include high-bandwidth memory (HBM) supply,
              advanced-node foundry capacity (SMIC, TSMC), and AI software/tooling ecosystems (CUDA and its domestic
              alternatives), all of which constrain rather than constitute accelerator demand. The status-quo substitute
              for any Chinese buyer is importing or renting Nvidia/AMD compute (directly, via the diminished H20
              channel, or via offshore cloud rental in jurisdictions such as Southeast Asia); a second, policy-driven
              substitute is simply not adopting new AI infrastructure. IDC data reviewed by Reuters shows total 2025
              China AI accelerator card shipments of roughly 4 million units split 55% Nvidia, 4% AMD, and 41% domestic
              Chinese vendors -- a market boundary that captures Kunlunxin's addressable opportunity without inflating
              it to "all of China AI spend."
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
