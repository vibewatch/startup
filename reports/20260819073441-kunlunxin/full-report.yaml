  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The single largest unresolved regulatory question is whether Kunlunxin itself, as distinct from Baidu or
              the broader Chinese AI-chip sector, could face a direct US Entity List or export-control designation. No
              source reviewed confirms such a designation exists as of the report run date, but the risk is non-trivial:
              Biren Technology, a close domestic peer at a comparable stage, has operated under an Entity List
              designation since October 2023, and BIS issued rules in January 2025 explicitly tightening foundry
              due-diligence requirements and adding PRC/Singapore entities to the Entity List, part of a pattern of
              controls building on October 2022, October 2023, and December 2024 actions. A GAO review confirms Commerce
              implemented the 2022-2023 advanced semiconductor export-control rules through coordination with six other
              federal agencies, while a 2025 year-end legal review (Mondaq/AlixPartners) documents that a proposed
              "Affiliates Rule" -- which would have extended controls to entities 50%-or-more owned by
              already-restricted parties -- was introduced then suspended for one year starting November 2025, and that
              more than 120 new Chinese entities were added to the Entity List during 2025 broadly. Separately, Taiwan
              imposed new export restrictions on Huawei and SMIC in June 2025, tightening access to advanced packaging,
              EDA tools, and materials for any SMIC customer, including Kunlunxin if the SMIC foundry attribution is
              correct. On the corporate/listing side, Kunlunxin's dual Hong Kong/STAR Market listing process itself
              creates regulatory-process risk: it requires simultaneous compliance with HKEX and CSRC disclosure
              regimes, and its unusual IPO chip-purchase-commitment structure (cornerstone investors reportedly required
              to buy chips worth 3-7x their equity stake) has no clear precedent for how Hong Kong's SFC or CSRC would
              require it to be disclosed in a prospectus.
