      - number: '3.2'
        title: Capability, pricing, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On raw capability, Huawei's Ascend 910C delivers roughly 60-80% of Nvidia H100 inference performance
              according to independent comparisons, and Huawei's newer Atlas 350 was claimed by Huawei's own Ascend
              Computing Business president to reach 2.87x the performance of Nvidia's China-specific H20 chip -- a claim
              that, if it holds, would reframe domestic-chip competitiveness away from a pure "percent of Nvidia's best"
              framing. Kunlunxin's P800 was independently estimated by Morgan Stanley at roughly 1,521 tokens/second on
              DeepSeek R1 inference, positioning it between Nvidia's H20 and A100 -- broadly comparable to Huawei's
              positioning but based on a single analyst estimate rather than a standardized benchmark. On software,
              every major domestic vendor has built (or is building) a CUDA-alternative stack: Huawei's CANN, Moore
              Threads' MUSA (with a "Musify" code migration tool), and Kunlunxin's own XTCL/XBLAS/XDNN stack. Pricing is
              largely opaque across all vendors since none publish list prices; the closest public reference points are
