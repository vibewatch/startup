      - number: '2.2'
        title: Market sizing across multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No single TAM figure is reliable here, so this chapter preserves several sizing lenses rather than picking
              one. Bernstein modeling (via AI Gazine) puts China's AI accelerator market at $37 billion in 2025, growing
              to $55 billion in 2026 and $69 billion in 2027, with domestic chip production rising from $16 billion
              (2025) toward $91 billion by 2028 against $88 billion of total national demand -- implying China could
              become a net exporter of AI accelerators within two to three years if the forecast holds. A second,
              unit-shipment-based lens (IDC via Reuters) shows roughly 4 million total accelerator cards shipped in
              China in 2025, of which domestic vendors shipped 1.65 million (41%); Huawei alone shipped about 812,000
              units (roughly half of all domestic shipments, about 20% of the total market), Alibaba's T-Head shipped
              about 265,000, and Kunlunxin and Cambricon each shipped about 116,000 units -- placing Kunlunxin at only
              around 3% of total China accelerator shipments and a distant joint-third among domestic vendors. A third
              lens, TrendForce's qualitative tracking, expects domestic chips to exceed 50% of Chinese AI server
              deployments by the end of 2026. These lenses agree directionally (domestic share rising fast) but disagree
              by billions of dollars on absolute size, and none of them isolate a Kunlunxin-specific serviceable
              addressable market -- a gap this chapter carries forward as an explicit diligence ask rather than a
              manufactured SAM/SOM split.
            claimRefs:
