companyProfile:
  summary: >-
    Kunlunxin (Beijing) Technology Co., Ltd. is the semiconductor design subsidiary of Baidu, Inc., building AI
    training and inference chips (the Kunlun line) plus a CUDA-alternative software stack. Its lineage traces to
    2011 as an internal Baidu chip program, formally spun off as an independent company in April 2021. Baidu
    retains a controlling ~59.45% equity stake and is simultaneously Kunlunxin's largest customer, while external
    revenue has grown from roughly 40% of the total (2024) to more than 50% (2025) on the strength of named wins
    with China Mobile, China Merchants Bank, China Southern Power Grid, Geely, and, since 2026, direct Baidu rival
    Tencent. Kunlunxin is pursuing a dual Hong Kong / Shanghai STAR Market listing, with a confidential HKEX Form A1
    filed January 2026 and reported roadshow guidance escalating from roughly $14.7 billion to roughly $50 billion
    by mid-2026 -- a valuation move this report treats with significant caution given unresolved revenue,
    manufacturing, and IPO-structure evidence gaps.
  foundedDate: '2021-04-01'
  founders:
    - name: Ouyang Jian
      role: CEO
      background: >-
        Baidu's chief chip architect prior to the April 2021 spin-off; became Kunlunxin's CEO at that time and is
        the only named Kunlunxin-specific executive in the public record.
      claimRefs: [CO011]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    AI training and inference accelerator chips (Kunlun I, Kunlun II, P800/Kunlun III, with M100 and M300 announced
    for 2026-2027) sold as hardware plus a CUDA-alternative software stack (XTCL/XBLAS/XDNN), deployed both inside
    Baidu's own AI infrastructure and to external enterprise, telecom, financial, energy, automotive, and
    hyperscaler-rival customers.
  customerFocus: >-
    Baidu's own internal AI/cloud infrastructure as the largest customer, plus telecom and financial SOEs, energy
    and automotive enterprises, government/sovereign-compute procurement channels, and, since 2026, a direct
    hyperscaler rival (Tencent).
  businessModel: >-
    Direct chip and cluster hardware sales (plus bundled software stack) to Baidu-internal and external customers,
    largely through centralized procurement tenders (SOE/government buyers) and direct enterprise contracts.
  stage: late-stage private, pre-IPO (confidential HKEX filing plus STAR Market tutoring)
  fundingStatus: >-
    Last confirmed private round: ~$283M Series D (July 2025) at a ~$3.0B post-money valuation. Pursuing a dual
    Hong Kong / Shanghai STAR Market IPO, with reported roadshow guidance reaching ~$50B by June 2026 -- unconfirmed
    in any public prospectus as of the report run date.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO015, CO019, CO020, CO021, CO024, CO028, CI002, CI003, CU003, CU004]
summary:
  headline: >-
    Kunlunxin has real, independently corroborated commercial traction (China Mobile, Tencent) inside a booming
    domestic chip market, but its reported ~$50B IPO target rests on unreconciled revenue, an unconfirmed
    manufacturing foundry, and a chip-purchase-linked structure flagged by analysts for circular-financing risk.
  overallScore: 5.5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 3000
