          tone: positive
        - id: xtcl-compile
          label: XTCL 图编译
          detail: 基于 TVM 的编译器导入模型图，并针对 XPU 硬件优化。
          tone: neutral
        - id: xpu-runtime
          label: XPU 运行时与驱动层
          detail: 底层执行、多流支持、虚拟化（SR-IOV）。
          tone: neutral
        - id: cluster-deploy
          label: 集群部署（Super-Node、Tianchi 集群）
          detail: 多卡机柜或大规模（例如 30,000 芯片）集群部署。
          tone: positive
        - id: workload-output
          label: 训练或推理输出
          detail: 训练后的模型 checkpoint 或服务化推理结果（例如 DeepSeek R1 响应）。
          tone: positive
      edges:
        - from: model-dev
          to: xtcl-compile
        - from: xtcl-compile
          to: xpu-runtime
        - from: xpu-runtime
          to: cluster-deploy
        - from: cluster-deploy
