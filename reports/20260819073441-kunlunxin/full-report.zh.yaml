      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              现有私募投资者的退出准备度，直接取决于 IPO 本身：Kunlunxin 的保密 HKEX Form A1 申请（2026 年 1 月）和并行 STAR Market 辅导流程（2026 年 5 月），就是
              Series A-D 投资者实现流动性的机制；据 BigGo Finance，Jefferies 分析师预计香港上市会在 2026 年第三季度完成。除 IPO
              流程本身外，已审阅来源没有披露锁定期条款、老股交易安排或现有投资者退出机制。本章最终尽调问题把前文最关键的开放问题合并成一张优先级清单：调和 2025
              年收入估计；确认制造代工厂和良率；取得独立基准测试数据；确认承销团和最终发行条款；澄清芯片购买承诺结构将在公开招股书中如何处理。每一项本身都是足以打破投资逻辑的触发点；合在一起，也解释了为什么本报告把
              Kunlunxin 视为一个应在招股书提交过程中密切跟踪的标的，而不是今天就下注的标的。
