      basis: >-
        Covers the domestic Chinese AI chip comparables and one global benchmark identified across sources reviewed
        through the 2026-08-19 run date; smaller or less-covered peers (Enflame, Alibaba T-Head, Hygon, MetaX) are
        referenced in the Competitors chapter but not repeated here.
