      - 排除支出
      - 买方 / 付款方
      - 对 Kunlunxin 的意义
    rows:
      - - AI 训练加速器（中国）
        - 大模型预训练集群芯片
        - 非 AI CPU / 服务器算力；中国以外训练支出
        - 超大规模云厂商、国家 AI 基础设施项目
        - Kunlunxin P800/M300 的核心可服务细分。
      - - AI 推理加速器（中国）
        - 规模化模型服务 / 推理芯片
        - 数据中心外的边缘 / 消费级推理芯片
        - 超大规模云厂商、企业、国企
        - Kunlunxin P800/M100 的核心可服务细分。
      - - HBM 内存供应
        - 连接 AI 加速器的高带宽内存
        - 非 AI 工作负载使用的标准 DDR/GDDR 内存
        - 芯片厂商（作为成本输入，而非面向买方的市场）
        - 限制 Kunlunxin 集群扩张的上游约束，不是 Kunlunxin 销售进入的市场。
      - - 先进制程代工产能
        - AI 芯片 7nm 及以下晶圆制造
        - 非 AI 芯片成熟制程制造
        - 芯片厂商（SMIC 客户）
        - Kunlunxin 与 Huawei、Cambricon、Biren 及其他 SMIC 客户共同面对的上游约束。
      - - AI 软件 / 工具生态
        - AI 芯片编译器、运行时、框架（CUDA 及国产替代）
        - 与 AI 加速无关的通用软件
        - 开发者、超大规模云厂商
        - 决定 Kunlunxin 的 XTCL/XBLAS 栈能多容易赢下已锁定在 CUDA 上的工作负载。
      - - 现状替代：进口 / 租用 Nvidia-AMD 算力
        - 直接购买 Nvidia/AMD 芯片；离岸云 GPU 租赁
        - 已被出口管制排除、无法销往中国的芯片
        - 中国 AI 实验室和企业
        - Kunlunxin 必须替代的主要竞争选项，不是其目前能服务的细分。
    notes: 「对 Kunlunxin 的意义」是本报告基于本章证据作出的分类，不是公司发布的市场地图。
