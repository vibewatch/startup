  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻领域
        blocks:
          - type: paragraph
            body: >-
              本章把“市场”定义为中国本土 AI 加速器（训练和推理芯片）市场——即中国超大规模云厂商、国企和政府关联数据中心运营方为 AI 工作负载采购 GPU/ASIC 级芯片的计算支出部分。它不包括通用 CPU
              服务器、非 AI 网络设备和非中国芯片需求（Kunlunxin 未披露中国以外销售）。相邻但不同的市场包括高带宽内存（HBM）供应、先进制程代工产能（SMIC、TSMC）和 AI 软件 / 工具体系（CUDA
              及国产替代），这些因素约束加速器需求，但不构成加速器需求本身。中国买方的现状替代方案，是进口或租用 Nvidia/AMD 算力（直接采购、通过缩小后的 H20 渠道，或在 Southeast Asia
              等司法辖区租用离岸云）；第二个由政策驱动的替代方案，是干脆不采用新的 AI 基础设施。Reuters 查阅的 IDC 数据显示，2025 年中国 AI 加速卡总出货量约 4 million 块，其中 Nvidia
              55%、AMD 4%、中国本土厂商 41%——这个市场边界能覆盖 Kunlunxin 的可触达机会，而不会膨胀成“全部中国 AI 支出”。
