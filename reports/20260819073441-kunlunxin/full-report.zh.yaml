  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 客户基础分为五类，买方 / 用户 / 付款方结构各不相同。Baidu 本身同时是所有者、最大客户和技术共同开发者，为自家 Wenxin/Ernie 模型训练和 Apollo 自动驾驶栈消耗
              P800 芯片。电信和金融国企（China Mobile、China Merchants Bank）通过集中采购招标采购，代表案例是 Kunlunxin 2025 年 8 月在 China Mobile
              三个通用计算标包中赢得超过 RMB1 billion 的订单。能源和工业国企（China Southern Power Grid）以及汽车 OEM（Geely；BYD
              仅确认是股权投资者，而非已确认芯片客户）构成规模更小但战略可见的分层。最新且最重要的分层，是跨竞争对手的超大规模云采购：Tencent 2026 年开始规模采购 P800
              芯片，多家媒体将该关系定义为最强可用市场验证信号，原因正是 Tencent 有充分动机挑出竞争对手产品的问题，而不是替它背书。采用轨迹数据很薄：据报道外部（非 Baidu）收入从 2024 年约 40% 升至
              2025 年超过 50%；Kunlunxin 2025 年 AI 芯片总出货约 116,000 块（按 IDC 数据与 Cambricon 持平），明显落后于 Huawei 约 812,000
              块；但已审阅来源没有按具名客户拆分出货量、活跃部署或利用率。
