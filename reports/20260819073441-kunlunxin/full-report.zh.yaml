  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: Kunlunxin 的建议链条从真实但不完整的商业验证出发，穿过尚未解决的财务和制造证据缺口，最后指向继续研究，而不是买入或回避。
    data:
      nodes:
        - id: market-scale
          label: 快速增长、政策支持的市场（国产份额 41%+）
          detail: 中国国产 AI 芯片市场增长很快，且有政策顺风。
          tone: positive
        - id: customer-proof
          label: 真实但不完整的客户验证（China Mobile、Tencent）
          detail: 已有具名、带日期的商业订单，但客户层面细节偏薄。
          tone: positive
        - id: financial-gaps
          label: 未解决的财务证据（5-6x 收入差距，无审计数字）
          detail: 收入估计严重分歧，且尚无公开经审计财务。
          tone: warning
        - id: manufacturing-risk
          label: 未确认代工厂与制造风险（依赖 SMIC）
          detail: 代工厂归属来自推断而非确认，SMIC 产能又受限。
          tone: warning
        - id: ipo-structure-risk
          label: IPO 结构带循环融资警示
          detail: 与芯片采购挂钩的基石认购承诺引发分析师担忧。
          tone: warning
        - id: recommendation
          label: 建议 - 继续研究
          detail: 现有证据还不足以支持坚定买入，也不足以支持直接回避。
          tone: neutral
      edges:
        - from: market-scale
          to: recommendation
        - from: customer-proof
          to: recommendation
        - from: financial-gaps
          to: recommendation
        - from: manufacturing-risk
          to: recommendation
        - from: ipo-structure-risk
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV008
      - CV009
      - CV011
      - CV013
      - CV002
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在据报道的 $50 billion IPO 目标估值下，Kunlunxin 的隐含市销率（P/S）高度取决于采用哪项 2025 年收入估计。
    data:
      items:
        - label: 按 $500M 收入计算的 P/S（CNBC 低位估计）
          value: 100
        - label: 按 ~$1.2B 收入计算的 P/S（贴合 J.P. Morgan 口径的基准情景）
          value: 42
        - label: 按 $2.9B 收入计算的 P/S（Tencent Tech / BigGo 高位估计）
          value: 17
        - label: Cambricon 可比 P/S 区间（下限）
          value: 55
        - label: Cambricon 可比 P/S 区间（上限）
          value: 85
    approximationNotes: P/S 值按据报道的 ~$50B IPO 目标估值除以各收入估计计算；基准情景采用 $1.2B 收入估计，口径贴合 J.P. Morgan 人民币预测经汇率调整后的读数。这些数字均未得到公开招股书确认。
    claimRefs:
      - CV009
      - CV014
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 2025-2026 年间，Kunlunxin 据报道的估值指引跨度很大：从最后一轮已确认的私募融资估值，到 2026 年中上调后的 IPO 路演目标。
    data:
      items:
        - label: 估值变化（USD billions）
          low: 3
          base: 13
          high: 50
          unit: USD billions
        - label: 隐含 P/S 倍数区间（收入倍数）
          low: 17
          base: 42
          high: 100
          unit: x revenue
    approximationNotes: >-
      估值变化区间采用 2025 年 7 月 Series D 轮水平（低位）、2026 年 5 月 STAR Market / HK$100B 指引（基准，~$13B），以及 2026 年 6 月路演目标（高位，~$50B）；P/S
      区间取自上方的收入敏感性图。
    claimRefs:
      - CV010
      - CV011
      - CV014
      - CV016
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Kunlunxin 一边有强劲收入增长信号和真实客户验证，一边仍留下财务、制造和结构层面的证据缺口。
    data:
      items:
        - label: 建议
          value: Research-more
          detail: 鉴于已识别的证据缺口，既不足以坚定买入，也不足以直接回避。
          tone: neutral
        - label: 风险评级
          value: High
          detail: 出口管制、制造依赖和治理集中风险都偏高。
          tone: warning
        - label: 估值判断
          value: Stretched-to-expensive
          detail: 取决于采用哪项收入估计，隐含 P/S 介于 17x 至 100x。
          tone: warning
        - label: 据报道的 IPO 目标估值
          value: ~$50B
          detail: 不到 12 个月，约为 2025 年 7 月 Series D 轮估值的 16x。
          tone: warning
        - label: 外部收入占比（2025，据报道）
          value: '>50%'
          detail: 从 2024 年的 ~40% 提升，是目前最强的增长质量信号。
          tone: positive
        - label: 已确认的跨竞争阵营客户
          value: Tencent (2026)
          detail: 本报告识别出的最强单一第三方验证事件。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CV008
      - CV009
      - CV011
      - CV013
