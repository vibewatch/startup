      - number: '7.4'
        title: 团队、执行风险与缓释触发点
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 的领导层风险更像关键人和治理集中，而不是典型风险投资支持的创始团队画像。Ouyang Jian 是唯一具名的 Kunlunxin 专属高管（2021 年分拆以来任
              CEO），也是公开记录中唯一拥有 Kunlunxin 运营头衔的人；其他具名领导（Robin Li、Shen Dou、Haijian He）都是 Baidu 公司高管，Kunlunxin 职责从属于其 Baidu
              本职，这意味着公开记录中看不到全职、独立的高管层深度。当前项目规模抬高了执行风险：Kunlunxin 必须同时推进香港 / STAR Market 双重上市，把外部商业收入占比在一年内从约 40% 拉到超过
              50%，推动 M100 芯片商业爬坡，并为 2027 年发布 M300 芯片做准备；与此同时，其总体出货份额（在中国市场约 3%）仍大幅落后于
              Huawei（~20%）。本章的缓释与否决标准表，把上述风险转化为可监控触发点——被列入 Entity List、HKEX 招股书未能调和 5-6x 收入估计差、确认出现 SMIC 分配短缺、Tencent
              关系未复现，或 IPO 撤回 / 重新定价——任何一项都会实质改变本报告的投资逻辑。
