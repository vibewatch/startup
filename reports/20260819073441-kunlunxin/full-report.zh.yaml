  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 美国对先进 Nvidia / AMD 芯片的出口管制
        - 驱动因素（利好国内厂商）
        - 2022 年以来持续，2024-2025 年加码
        - 结构性地把可触达需求推向包括 Kunlunxin 在内的国产芯片厂商。
        - 跟踪 BIS 规则变化以及任何可能削弱顺风的部分回撤（如 H20 许可）。
      - - '"买中国" / 信创国产替代政策'
        - 驱动因素（利好国内厂商）
        - 持续推进，2024-2026 年强化
        - 为国企和政府买家设定由政策托底的采购下限。
        - 确认 Kunlunxin 是否享有与 Huawei / Cambricon 相同的采购偏好。
      - - DeepSeek 级开放模型需求
        - 驱动因素（利好所有拥有兼容芯片的厂商）
        - 2025 年初以来加速
        - 让每家国产芯片厂商都有一个具体且高曝光的工作负载可争取，包括 Kunlunxin 的 P800。
        - 评估 DeepSeek 相关需求的持久性，而非只看一次性兼容公告。
      - - 国家半导体融资（大基金三期，~$47.5B）
        - 驱动因素（整体利好国内生态）
        - 2024 年以来投放
        - 补贴成本更高的国内制造，部分抵消 SMIC 的成本 / 良率劣势。
        - 确认大基金三期资本中有多少（如有）具体流向 Kunlunxin，而不是 SMIC / Huawei。
      - - SMIC 先进制程产能约束
        - 约束
        - 至少持续到 2026 年
        - 限制包括 Kunlunxin 在内的任何 SMIC 客户扩大芯片产出的速度。
        - 厘清 Kunlunxin 相对 Huawei 和 Cambricon 的具体晶圆分配优先级。
      - - HBM 供应约束（CXMT 尚不成熟，落后 Samsung / SK Hynix）
        - 约束
        - 持续存在
        - 限制包括 Kunlunxin P800 / M 系列在内的国产 AI 芯片扩展内存带宽。
        - 确认 Kunlunxin 当前 HBM 来源（国产 CXMT 还是进口）。
      - - CUDA 生态锁定 / 迁移成本
        - 约束
        - 持续存在；最晚至 2026 年 8 月仍有记录
        - 即便硬件规格具备竞争力，也会拖慢训练工作负载采用国产芯片。
        - 评估 Kunlunxin XTCL 栈相对 Huawei CANN 的真实迁移时间 / 成本数据。
    notes: 方向和时间来自本报告对本章增长驱动因素和约束证据的综合判断；驱动因素和约束并不互斥，也可能以不同方式影响不同厂商。
