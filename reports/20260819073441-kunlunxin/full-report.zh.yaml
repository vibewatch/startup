        - 用标准化基准测试套件，将 Kunlunxin 芯片与 Huawei、Cambricon 和 Nvidia 对比
        - 验证当前仅靠单一分析师估计支撑的竞争定位说法
        - 拿到硬件后委托独立基准测试。
      - - IPO 承销团与最终发行条款
        - 完整账簿管理人名单、最终股份分配和定价条款
