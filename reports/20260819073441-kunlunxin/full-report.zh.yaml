        - 立即重新评估供应链接入、投资者胃口和投资逻辑可行性。
      - - 未调和的收入估计
        - HKEX 招股书披露经审计 FY2024/FY2025 收入
        - 确认收入明显落在 ~$500M-$2.9B 估计区间之外
        - 用确认数值重新校准估值倍数分析。
      - - SMIC 制造产能 / 良率短缺
        - 已披露出货量增速相对路线图承诺（M100 爬坡、Tianchi 集群）的表现
        - 出货量明显低于 M100/Tianchi 路线图隐含节奏
        - 下调对 Kunlunxin 扩规模以竞争 Huawei / Cambricon 的信心。
      - - Tencent 关系未复现
        - 后续披露（媒体或招股书）说明 Tencent 订单规模 / 续单情况
        - 首次 2026 年披露后 12 个月内，未确认 Tencent 订单重复或扩大
        - 下调 Kunlunxin 跨竞争对手客户验证叙事的强度。
      - - IPO 撤回、延迟或大幅重新定价
        - HKEX / 科创板申报状态更新
        - IPO 被撤回、无限期延迟，或定价明显低于 ~$50B 路演目标
        - 重新评估 Kunlunxin 的资本市场可信度及其私人市场估值的韧性。
      - - 购芯承诺结构遭监管反推
        - HKEX / SFC 或 CSRC 就基石投资者购芯结构发布公开指引
        - 监管要求实质性重组或撤销与购芯挂钩的基石投资者条款
        - 重新评估重组后已报道外部收入承诺是否仍然稳固。
    notes: 触发因素是本报告围绕本章已识别风险自行综合出的可监控事件；没有任何一项是公司发布的终止标准。
