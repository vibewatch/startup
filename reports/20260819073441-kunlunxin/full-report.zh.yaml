      - number: '2.4'
        title: 相互矛盾的估计与规模尽调缺口
        blocks:
          - type: paragraph
            body: >-
              多项被广泛引用的数字彼此冲突，或无法从已审阅来源独立调和。Bernstein 预测中国到 2028 年成为 AI 芯片净出口国；Council on Foreign Relations
              的评估却给出另一面：2025 年美国最强芯片仍比中国最强芯片约强 5x，且 CFR 预计到 2027 年差距可能扩大到 17x——也就是说，出货量份额和原始算力份额可能同时朝相反方向移动。另有 2026 年 8
              月报告发现，许多中国 AI 开发者仍通过 Southeast Asia 离岸云安排租用 Nvidia 算力，专门绕开 CUDA 迁移成本，这让将 41% 国产出货份额解读为实际消耗 AI 算力的 41%
              变得复杂。已审阅来源没有一个能在 Baidu 自身内部需求之外单独拆出 Kunlunxin 的可触达市场，也没有来源提供 P800 对 Nvidia H100/H200 性能的独立验证基准——Morgan
              Stanley 引用的 DeepSeek R1 推理约 1,521 tokens/second 估计（将 P800 定位在 H20 和 A100
              之间）是目前最可信的第三方数据点，但它只是单一估计，不是可复现实测套件。这些缺口很重要，因为它们意味着 Kunlunxin 市占率和利润率轨迹尚不能像 Huawei 或 Cambricon 那样有同等信心建模。
