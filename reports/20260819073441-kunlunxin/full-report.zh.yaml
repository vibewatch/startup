      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 最关键的依赖风险是结构性的：Baidu 同时是其约 59.45% 的控股股东、最大客户和 IPO
              发起方，治理、商业、资本市场杠杆都集中在同一个交易对手手里；仅靠增加外部客户，无法分散这种集中度。第二层依赖是 SMIC 作为唯一（据信）代工厂，本身产能受限，且据报道把 Kunlunxin 订单排在
              Huawei 之后。第三层依赖来自 Kunlunxin 的开源软件生态（PaddlePaddle、基于 TVM 的 XTCL 编译器和 LLVM）：这些工具让 Kunlunxin
              具备可信的开发者工具链，但也把竞争位置系在其无法完全控制的外部开源项目健康度和迭代速度上。第四层依赖是大客户集中：China Mobile 集采中标（RMB1B+）和 2026 年 Tencent
              关系单项规模都足够大，若其中任一关系不续约或不复现，都会实质影响 Kunlunxin 外部收入增长叙事；两项关系的期限和续约条款均未披露。最后，IPO 本身带来融资依赖：据报道，Kunlunxin 的 IPO
              结构把投资者资本和芯片购买承诺绑在一起，意味着 IPO 流程中的执行风险（定价、投资者需求或监管延迟）可能同时威胁融资和其试图提前锁入的收入管线。
