      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 的资本历史呈现陡峭且越来越压缩的估值曲线。2021 年 4 月拆分轮由 CPE 领投，IDG Capital、Legend Capital 和 Yuanhe Puhua 参与，给新公司估值约
              RMB13 billion (~$1.9 billion)。2025 年 7 月 Series D 完成，融资约 $283 million (~RMB2.1 billion)，投资方包括 BYD、CICC
              Guanbo、China Mobile 旗下 Zhongyi Hechuang 投资平台，以及 China Reform Holdings 旗下国资背景 High-Level Talent
              Fund，投后估值升至约 RMB21 billion (~$3.0 billion)。2026 年 1 月 1 日，Kunlunxin 向 Hong Kong Stock Exchange 主板保密提交 Form
              A1 上市申请；披露后 Baidu 港股最高上涨 9.35%。此后市场流传数字快速上移：在 Kunlunxin 2026 年 5 月启动并行 Shanghai STAR Market
              “辅导”流程前几周，曾有中间值 ~$14.7 billion 传出（当时指引接近 HK$100 billion，~$13 billion）；到 2026 年 6 月 29 日投资者路演报道，香港目标已达约 $50
              billion，消息推动 Baidu ADR 和港股双双上涨。按该水平，Kunlunxin 隐含估值（约 1.32x）超过 Baidu 同一交易日约 $38 billion
              市值——多个媒体标记出醒目的“子公司估值高过母公司”动态。这些 IPO 阶段数字尚未写入公开招股书；截至本报告 2026 年 8 月生成日，Kunlunxin 仍是私营公司，最终香港和 STAR Market
              定价、股份分配和承销团仍未披露。
