  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Huawei Ascend (HiSilicon)
        - 国内直接竞品 / 现任龙头
        - ~$12B AI 芯片收入（2026 估计）；Huawei 子公司，未单独估值
        - 超大规模云厂商、政府、企业（国内覆盖最广）
        - SMIC 产能优先级；CANN 软件栈；国内出货量最大（2025 年 ~812,000 颗）
        - 未独立上市；按 CFR 分析，绝对算力仍落后 Nvidia。
      - - Cambricon (寒武纪)
        - 国内直接竞品，已上市
        - RMB 630B-1T (~$88-140B) 市值（2026）；2025 年收入 RMB6.5B，首次实现年度盈利
        - 云端 AI 推理，超大规模云客户（ByteDance、Alibaba）
        - 首家实现盈利并突破 RMB1T 市值的国内纯 AI 芯片厂商。
        - 按过去 12 个月 PE 200-373x 交易，相比全球半导体同行估值倍数极端。
      - - Moore Threads (摩尔线程)
        - 国内直接竞品，已上市
        - IPO 后市值 RMB 282-310B (~$39-43B)（2025 年 12 月）；IPO 融资 ~RMB6B
        - 全栈 GPU（AI + 图形 + 视频），面向消费者和企业
        - MUSA 全栈软件生态，配 Musify CUDA 迁移工具；创始人曾任 Nvidia VP。
        - 三年累计亏损近 RMB6B；高度依赖外部融资。
      - - Biren Technology (壁仞科技)
        - 国内直接竞品，HKEX 上市（2026 年 1 月）
        - ~$2.2-2.9B IPO 前估值；多轮累计融资 ~RMB5B+
        - 高性能云端 AI 训练 / 推理（BR100/BR106 系列）
        - 首款支持 Chiplet、PCIe 5.0 和 CXL 的中国 GPU（BR100，2022）；完整支持 DeepSeek-V3 全栈。
        - 自 2023 年 10 月起被列入美国实体清单，供应链访问受限。
      - - Iluvatar CoreX (天数智芯)
        - 国内直接竞品，HKEX 上市（2026 年 1 月）
        - ~$5.2B IPO 后市值；2025 年收入 RMB1.03B（同比 +91.6%）
        - 云端 AI 推理（ByteDance 聊天机器人工作负载）
        - ByteDance 订购 50,000+ 颗用于推理；~54% 毛利率，在国内同行中位居前列。
        - 规模小于 Huawei / Cambricon；对单一大客户（ByteDance）敞口集中。
      - - Enflame Technology (燧原科技)
        - 国内直接竞品，IPO 前（2026 年中科创板审核通过）
        - ~$2.8B IPO 前估值（2024 年 12 月 Series E）；目标科创板融资 ~RMB6B
        - 面向超大规模云和企业客户的云端 AI 训练 / 推理
        - 软硬件协同设计研发投入；多代芯片路线图（IPO 融资支持第 5 / 第 6 代研发）。
        - 截至报告运行日期，尚未独立盈利或上市。
      - - Alibaba T-Head / Pingtouge (平头哥)
        - 自用型超大规模云芯片部门，IPO 路线
        - 未披露独立估值；累计出货数十万颗 PPU 芯片
