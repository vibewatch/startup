      - number: '2.3'
        title: 买方分层、增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              中国本土 AI 加速器买方分为四类，预算负责人和采用触发点不同。超大规模云厂商（Baidu、Alibaba、Tencent、ByteDance）是最大且最成熟的买方，通常有意采用多供应商策略——例如，据报道
              ByteDance 2025 年在 AI 芯片上花费约 $12.1 billion（2026 年升向 $14.3 billion），在 Huawei（重训练）、Cambricon（中端推理）和 Iluvatar
              CoreX（Kunlunxin 仍在评估）之间分配聊天机器人推理，明确用来对冲供应风险并优化每个工作负载的成本。国企和政府关联买方（China Mobile、State Grid 系统实体、China
              Merchants Bank）构成第二个政策驱动分层，采购受“Xinchuang”（信创）国产替代要求和集中招标流程塑造，Kunlunxin 自身超过 RMB1 billion 的 China Mobile
              中标就是例子。汽车 OEM（BYD、Geely）构成规模更小但战略可见度高的第三类，为 ADAS 和车内 AI 采购算力。全国“East Data West
              Computing”（东数西算）基础设施枢纽和聚焦主权计算的部委，是第四类补贴浓度高的买方。主导增长驱动是美国出口管制：2025 年 H20 禁令（后来以 15% Treasury fee 部分逆转）和后续
              Entity List 行动，反复把可触达需求从 Nvidia 转向国产厂商，并由“Buy China”采购偏好和约 $47.5 billion Big Fund III 国家半导体融资强化。DeepSeek
              级开源模型形成第二个需求侧驱动，给每家国产芯片厂商一个具体、高关注度的推理 / 训练工作负载可争取。主要约束在供给侧：SMIC 可用的最先进国产节点（7nm，基于 DUV）成本估计比 TSMC EUV 等效节点高
              25-50%，良率也明显更低，而且产能受限，Huawei、Cambricon、Biren 等国家冠军客户争抢同一批晶圆；CXMT 的 HBM 供应相较 Samsung/SK Hynix
              仍不成熟；即便硬件规格纸面有竞争力，CUDA 软件生态迁移到国产芯片仍需要显著更多工程投入。
