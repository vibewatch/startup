  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Kunlunxin 的客户旅程从 Baidu 内部验证出发，经过国企竞争性采购，最近走到跨阵营超大规模云厂商直接采用。
    data:
      nodes:
        - id: internal-proof
          label: Baidu 内部验证
          detail: 自 2018 年以来，芯片先在 Baidu 自身搜索、云和 Apollo 工作负载中得到验证。
          tone: positive
        - id: soe-tender
          label: 国企竞争性招标中标
          detail: 通过集中采购流程拿下 China Mobile 和 China Merchants Bank。
          tone: positive
        - id: sector-diversification
          label: 跨行业多元化
          detail: China Southern Power Grid（能源）和 Geely（汽车）增加行业覆盖。
          tone: neutral
        - id: rival-adoption
          label: 跨阵营超大规模云厂商采用
          detail: Tencent 在 2026 年开始采购 P800 芯片，这是现有最强验证信号。
          tone: positive
        - id: ipo-linked-demand
          label: 与 IPO 挂钩的基石芯片采购承诺
          detail: 据报道，潜在投资者被要求购买价值为其股权投资 3-7 倍的芯片。
          tone: warning
