      - number: '7.2'
        title: 运营、制造与质量风险
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 最具体的运营风险，是制造端依赖一家产能受限、成本大概率处于劣势的代工厂。行业共识（公司未确认）认为 P800 使用 SMIC 基于 DUV 的 7nm 工艺生产；相比 TSMC 基于 EUV
              的同类工艺，该路线估计成本高出 25-50%，良率也明显更低。据报道，SMIC 在晶圆分配上优先满足 Huawei，Cambricon、Kunlunxin
              等其他国内客户排在其后；小厂商很难复制或对冲这个结构性劣势。HBM 内存供应是第二个产能瓶颈：国内 HBM 厂商 CXMT 相比 Samsung/SK Hynix 仍不成熟，Kunlunxin
              的具体内存采购安排也未披露。产品质量层面，已审阅来源没有披露 Kunlunxin 自身芯片良率、独立安全 / 可靠性认证或正式质量控制指标；最接近的代理指标是 Huawei 自己披露的良率改善（在 SMIC 从约
              20% 升至接近 40%），但考虑到 Huawei 据报道享有生产优先权，这个指标不能外推到 Kunlunxin。已审阅来源也没有找到可独立复现的基准测试（例如 MLPerf 风格测试），在相同工作负载下比较
              Kunlunxin 芯片与 Huawei Ascend、Cambricon 或 Nvidia 芯片；因此，竞争力和可靠性主张主要压在一个第三方估计（Morgan Stanley，DeepSeek R1 上
              ~1,521 tokens/second）和公司来源材料上。
