  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 乐观：Kunlunxin 搭上中国增长最快的芯片细分市场（国内出货份额 41%+ 且仍在上升）
        - 国内份额增长慢于预期，或美国出口管制带来的需求顺风逆转。
      - - 乐观：Tencent 2026 年采购是目前最强的第三方产品验证
        - 确认 Tencent 关系会复现并扩大，而不是停留在单笔订单。
      - - 乐观：外部收入占比从 ~40%（2024）升至 >50%（2025），显示真实商业牵引力
        - Kunlunxin 的 HKEX 招股书披露经审计、已调和的收入数据，确认这一趋势。
      - - 反向逻辑：不到 12 个月，IPO 目标估值约为 Series D 轮的 16 倍
        - 更温和的最终 IPO 定价（例如接近早前约 $13B 的科创板指引）会缓解这一担忧。
      - - 反向逻辑：与购芯挂钩的基石投资者结构引发循环融资担忧
        - 监管澄清或招股书披露显示该结构不会抬高已报道需求。
      - - 反向逻辑：各来源的 2025 年收入估计相差 5-6x（$500M 至 $2.9B）
        - HKEX 招股书披露单一、经审计的收入数字。
      - - 反向逻辑：依赖 SMIC 代工，产能受限且据报道排序低于 Huawei
        - 确认具体且充足的晶圆分配协议，或披露双代工厂策略。
      - - 反向逻辑：Baidu 既是控制方又是最大客户，限制独立验证
        - 招股书披露关联交易条款，并由独立审计确认。
    notes: 论点直接来自本章及前文证据；“什么会改变判断”列是本报告自己的尽调框架，不是公司发布的风险因素。
