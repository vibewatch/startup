      - number: '5.4'
        title: 信任、质量、合规与证据缺口
        blocks:
          - type: paragraph
            body: >-
              已审阅来源没有披露 Kunlunxin 的独立安全认证、安全测试标准，或芯片和集群产品的正式质量指标；这与云软件公司通常发布 SOC 2 或 ISO
              认证形成对比。现有最相关“信任”信号是间接的：Kunlunxin 芯片部署在通过集中招标赢得的受监管买方基础设施中（China Mobile、China Merchants Bank、China Southern
              Power Grid），意味着产品通过了某种国企采购尽调，但这些招标采用的具体技术或安全标准并不公开。出口管制合规方面，已审阅来源没有确认 Kunlunxin 当前在美国 Entity List 上；但 2025
              年更广泛、针对中国本土半导体生产的出口管制行动，制造了潜在合规风险，而已审阅的 Kunlunxin 信任或合规材料没有回应这一点。制造质量上，已审阅来源没有披露 Kunlunxin 具体芯片良率；最接近的代理是
              Huawei 披露其在 SMIC 的良率改善（从约 20% 到接近 40%），而 Kunlunxin 作为规模较小且据称生产优先级低于 Huawei 的 SMIC 客户，未必能复制。凡本章来自 Kunlunxin
              官网、技术沙龙或 GitHub 仓库的说法，均标注为公司声称而非独立验证；未解决事项（良率、Entity List 状态、正式认证、独立基准）则作为明确证据缺口带入后续，而非假定有利或不利。
