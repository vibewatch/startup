      - number: '6.3'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              已审阅来源没有披露任何 Kunlunxin 客户的留存指标、续约率、流失率、净收入留存或合同期限数据——这是完整披露缺口，本章将其作为 null 字段处理，而不是假定值。最接近的留存代理是跨代重复购买：Baidu
              自 2018 年起购买每一代 Kunlun 芯片（Kunlun I、II、P800，以及即将到来的 M100/M300），Geely 与 Kunlun 芯片的关系也可追溯到 Kunlun II/Apollo
              时代，说明至少两个账户存在多年延续性，尽管这是从产品代际历史推断，而非披露的续约指标。扩张方面，最清晰信号是外部收入占比在 2024 至 2025 年从约 40% 升至超过 50%，以及 2026
              年新增首个超大规模云竞争对手客户（Tencent）。集中度方面，核心风险是结构性的，而非偶发：Baidu 同时是 Kunlunxin 约 59.45% 控股股东和最大客户，意味着 IPO
              的收入质量评估高度取决于关联方定价如何处理；据报道 IPO 芯片采购承诺（基石投资者购买其股权投资额 3-7x
              的芯片）又加入第二层集中度风险，即从投资者客户提前装入收入，而不是有机获取账户。采购摩擦只在一个方向可见：具名国企中标来自正式、多标包集中招标（China Mobile），Kunlunxin
              必须在与其他投标方竞争中胜出，这证明存在真实采购门槛，而不是只靠内部需求的销售模式。
