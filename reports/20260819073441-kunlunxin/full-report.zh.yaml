    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、变现与商业化路径
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 的核心收入机制是直接销售芯片和集群——AI 加速器硬件加 XTCL/XBLAS/XDNN 软件栈——既卖给 Baidu 自身内部 AI 基础设施，也通过集中招标（如 China Mobile
              中标）或直接合同（Tencent、China Merchants Bank、China Southern Power Grid、Geely、Vivo）卖给外部企业和政府客户。任何 Kunlunxin
              芯片都没有公开价格表；最接近的公开变现信号，来自 Baidu 自身说法：随着外部客户放量，Kunlunxin 收入“远超”往年；以及 J.P. Morgan 2025 年 11 月估计，芯片相关收入可能从
              2025 年约 RMB13 billion 增长六倍以上至 2026 年 RMB83 billion。商业化仍主要走 Baidu 自身云和企业销售关系，而非独立搭建渠道，这与 Kunlunxin 在 2021
              年拆分前作为 Baidu 内部芯片项目的起点一致。据报道，外部（非 Baidu）收入从 2024 年约占总收入 40% 升至 2025 年超过
              50%，这是现有最清晰的收入结构质量代理指标，但仍只是媒体估计，不是经审计分部披露。
