      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 并不像许多风险投资支持的初创公司那样由独立创始人团队主导；它的领导层是专职芯片运营高管与 Baidu 公司高管的混合。Ouyang Jian 作为 Baidu 首席芯片架构师，在 2021 年
              4 月拆分时出任 Kunlunxin CEO，并一直负责日常芯片战略。在他之上，Baidu 董事长兼 CEO Robin Li (Li Yanhong) 公开把 Kunlun 项目称作 14 年战略押注，并在
              2026 年 1 月采访中亲自确认 M100 芯片的 2026 年发布时间。Baidu 执行副总裁、AI Cloud Group 总裁 Shen Dou 是公司芯片路线图的指定发言人，2025 年 11 月在
              Baidu World 发布 M100/M300 时间表和 Tianchi256/512 集群计划。Baidu CFO Haijian He 在 Baidu 自身 2025 年 Q4 业绩稿中，把
              Kunlunxin 拆分直接与释放股东价值挂钩。治理和控制权由 Baidu 贯穿：据 2023 年 DigiTimes 报道，母公司当时持股约 70.87%；随着外部投资者自 2021 年以来约每年一轮进入，到
              Kunlunxin 2026 年 1 月保密 HKEX 申报时，持股被稀释至约 59.45%；同一申报显示股东名册已扩至 44 个不同主体。该结构带来的关键人物依赖，不是经典创始人叙事，而是持续 Baidu
              管理层支持；同时也让 Baidu 既是 Kunlunxin 控股股东，又是单一最大客户——这一关联方动态需要后续章节进一步做财务穿透。
