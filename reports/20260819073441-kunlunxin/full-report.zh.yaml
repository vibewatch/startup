  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              最大未解监管问题，不是 Baidu 或中国 AI 芯片板块整体，而是 Kunlunxin 本身是否会被美国直接列入 Entity List
              或纳入出口管制指定。到本报告运行日，已审阅来源没有确认这种指定已经存在，但风险并不轻：阶段相近的国内同业 Biren Technology 自 2023 年 10 月起就在 Entity List 下运营；BIS
              2025 年 1 月出台规则，明确收紧晶圆代工尽调要求，并把中国 / 新加坡实体加入 Entity List。这延续了 2022 年 10 月、2023 年 10 月和 2024 年 12
              月以来不断加码的管制脉络。GAO 审查确认，Commerce 曾协调另外六个联邦机构落地 2022-2023 年先进半导体出口管制规则；2025
              年年终法律回顾（Mondaq/AlixPartners）还记录，一项拟议的「Affiliates Rule」曾被提出，原本会把管制延伸至由已受限主体持股 50% 或以上的实体，但该规则自 2025 年 11
              月起暂停一年；2025 年全年另有超过 120 家中国实体被加入 Entity List。另一个口径来自台湾：2025 年 6 月，台湾对 Huawei 和 SMIC 实施新的出口限制，收紧任何 SMIC
              客户获取先进封装、EDA 工具和材料的通道；如果 SMIC 代工归因属实，Kunlunxin 也在其中。公司与上市层面，Kunlunxin 同时推进香港 / STAR Market
              上市，本身就带来监管流程风险：公司必须同时满足 HKEX 和 CSRC 披露制度；其少见的 IPO 芯片购买承诺结构（据报道，基石投资者需购买相当于其股权投资额 3-7x 的芯片），香港 SFC 或 CSRC
              会要求如何写入招股书，目前没有清晰先例。
