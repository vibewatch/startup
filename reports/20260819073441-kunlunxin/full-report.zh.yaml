      - number: '3.2'
        title: 能力、定价与商业化路径对比
        blocks:
          - type: paragraph
            body: >-
              看原始能力，据独立对比，Huawei Ascend 910C 提供约 Nvidia H100 推理性能的 60-80%；Huawei 更新的 Atlas 350 则由 Huawei Ascend
              Computing Business 总裁声称可达到 Nvidia 中国特供 H20 芯片 2.87x 性能——若该说法成立，国产芯片竞争力就不再只是“达到 Nvidia 最强产品百分之多少”的框架。Morgan
              Stanley 独立估计 Kunlunxin P800 在 DeepSeek R1 推理上约 1,521 tokens/second，定位在 Nvidia H20 与 A100 之间——大体接近 Huawei
              的定位，但依据是单一分析师估计，而非标准化基准。软件上，所有主要国产厂商都已构建（或正在构建）CUDA 替代栈：Huawei CANN、Moore Threads MUSA（带 “Musify”
              代码迁移工具），以及 Kunlunxin 自身 XTCL/XBLAS/XDNN 栈。各厂商定价基本不透明，因为没有一家公布标价；最接近的公开参照点是 Alibaba T-Head 声称其 BOM 比 Nvidia
              H20 低约 40%，以及 Moore Threads 消费级 MTT S80 GPU 定价接近 Nvidia RTX 3060 档位。商业化路径上，Moore Threads 和 Biren 都采用
              fabless 模式并有全栈野心（硬件 + 软件 + 系统），而 Kunlunxin 的商业动作仍高度依赖 Baidu 自身云和企业销售关系，独立渠道较弱。
