  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 的竞争集合横跨直接国产同行、主导性在位者和受出口限制的现状方案。Huawei Ascend 系列（910B/910C，以及更新的 Atlas 350）是国产在位者，背后有 Huawei 自身
              CANN 软件栈和 SMIC 生产优先级。Cambricon 和 Moore Threads 是已上市的两家国产同行（Cambricon 历史上在 Shanghai STAR Market，Moore
              Threads 通过 2025 年 12 月 STAR Market 首秀上市），估值均远高于 Kunlunxin 私募标记。Biren Technology 和 Iluvatar CoreX 都在
              Kunlunxin 瞄准的同一 2025 年 12 月至 2026 年 1 月窗口完成香港上市；Enflame Technology 和 Alibaba 内部团队 T-Head（Pingtouge）仍处于
              pre-IPO 或仅内部阶段。在这些直接同行之外，任何中国买方的现状替代方案，是在出口许可或离岸云租赁允许时继续采购 Nvidia（以及较小程度
              AMD）芯片，或完全自研芯片，而不是从上述任何厂商采购。合计看，至少六家 AI 芯片公司在 2025 年 12 月至 2026 年 6 月之间上市或推进上市流程；到 2026 年中，“国产 GPU
              军团”（Cambricon、Moore Threads、Biren、Enflame、Hygon 等）的合计市值已接近 RMB 2 trillion——Kunlunxin 自身 IPO 正是在乘这波估值潮。
