  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2025 年收入调和后接近 ~$2.9B；外部占比继续高于 50%；Tencent 关系复现并扩大；SMIC 产能 / 良率支持 M100/M300 路线图按期推进
        - $50B 目标对应隐含 P/S 约 17x，在更小收入基数上大体可比 Cambricon 的 55-85x 区间
        - 需要收入、制造和客户持续性不确定性同时朝 Kunlunxin 有利方向落地
        - 低至中；需要多个当前未解决缺口同时有利化解。
      - - 基准
        - 2025-2026 年收入接近 J.P. Morgan 推算的 ~$1.2-1.8B 区间；外部占比稳定在 50-60%；IPO 定价更接近早前 ~$13B 科创板指引，而不是被抬高后的 $50B 数字
        - 更保守定价下，可比公司倍数对估值的支撑更强
        - 仍取决于收入估计缺口能否解决，以及制造产能能否确认
        - 中；与本报告审阅的证据范围最一致。
      - - 悲观
        - 2025 年收入调和后接近 CNBC 较低的 ~$500M 估计；Tencent 订单被证明是一次性；SMIC 分配短缺持续；IPO 延迟、下调定价，或因购芯结构受到监管审视
        - 在 ~$500M 收入基数上，$50B 对应隐含 P/S 将接近 100x，无论参考哪类可比公司都难以辩护
        - 循环融资担忧成为市场 / 监管焦点，广泛损害投资者信心
        - 低至中；需要几个当前开放问题都朝负面方向落地。
    notes: 概率信号是本报告基于所审阅证据权衡后的定性评估，不是量化统计模型。
