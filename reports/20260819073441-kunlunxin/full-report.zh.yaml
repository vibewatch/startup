        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 的资本状况最好通过公司概况章节确立的融资时间线来读，而不是在此重复：2021 年 4 月拆分轮估值约 $1.9 billion，2025 年 7 月 Series D 融资约 $283
              million、投后估值约 $3.0 billion。对前瞻资本充足性真正重要的是，Kunlunxin 下一次重大资本事件是自身 IPO——2026 年 1 月保密 HKEX Form A1 申报，同时 2026
              年 5 月启动并行 Shanghai STAR Market “辅导”流程——据报道路演指引从 2026 年 5 月约 $14.7 billion 升至 2026 年 6 月下旬约 $50
              billion。不同寻常的是，Kunlunxin IPO 结构据报道要求基石投资者承诺购买其股权投资额 3 到 7
              倍的芯片，等于在定价前提前塞入多年订单簿——这一结构同时充当融资和收入机制，分析师已提示潜在循环融资疑虑。Kunlunxin 也与 SMIC 和其他国产厂商一道，受益于中国 2024 年启动的约 $47.5
              billion “Big Fund III” 国家半导体融资工具，但已审阅来源没有量化其中多少资本具体流向 Kunlunxin。已审阅来源没有披露 Kunlunxin 账面现金、月度烧钱速度、现金跑道，或任何债务
              / 项目融资义务；在公开招股书出现前，前瞻资本充足性仍是本章最大尽调缺口之一。
