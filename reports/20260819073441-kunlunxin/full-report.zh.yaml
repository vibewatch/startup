    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与公司结构
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin (Beijing) Technology Co., Ltd.（昆仑芯）是 Baidu, Inc. 的半导体设计子公司，以 Kunlun 品牌开发 AI 训练和推理加速器。脉络始于 2011
              年：Baidu 智能芯片与架构部开始研究多小核 “XPU” 微架构，先用 FPGA 仿真，再流片为专用硅。Baidu 2018 年 7 月发布第一代 Kunlun 芯片（K200 / Kunlun I），采用
              Samsung 14nm 制程、16GB HBM2 内存；2021 年 4 月将芯片团队拆分为如今名为 Kunlunxin 的独立主体，同年完成第一轮外部融资。Kunlun II 于 2021 年 8
              月跟进，采用 TSMC 7nm 制程，对外定位为 Nvidia A100 的竞争者。当前旗舰 P800（Kunlun III）2025 年面向大集群训练和推理推出，2025 年 2 月获得 DeepSeek
              R1/V3 全兼容；Baidu 2025 年 4 月启用 30,000 颗 P800 集群，用于训练 “DeepSeek-like” 模型并支持企业客户并行微调。Baidu 已披露 P800
              之后的两颗芯片路线图：推理优化的 M100（目标 2026 年，2026 年 1 月起商业爬坡，实物产品 2026 年 7 月亮相中国央视）和训练导向的 M300（目标 2027 年）。Kunlunxin
              官网现在以中文 “股份有限公司”（joint-stock company）而非早期公开记录中的 “有限公司”（limited company）称呼该主体，符合中国公司上市前通常完成的企业形式转换。
