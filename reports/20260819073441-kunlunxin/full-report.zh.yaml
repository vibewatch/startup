  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Kunlunxin 的 XPU-R 芯片架构把计算、内存、互联和接口硬件置于多层软件栈之下，开发者获得类似 CUDA 的编程模型。
    data:
      layers:
        - label: 软件 - XTCL 图编译器 / XBLAS / XDNN / XCCL
          detail: 基于 TVM 的图编译；数学与集合通信库；类似 CUDA 的 kernel 模型。
          tone: positive
        - label: 软件 - 基于 LLVM 的编译器工具链和运行时
          detail: 自定义 Clang 前端、XPU 后端、AOT/JIT 编译、驱动、监控器、调试器、分析器。
          tone: neutral
        - label: 接口 - PCIe 4.0（向后兼容 PCIe 3.0）
          detail: 面向训练 / 推理工作负载的主机 - 设备数据传输。
          tone: neutral
        - label: 互联 - 芯片间链路
          detail: 支撑集群部署中的大规模分布式训练。
          tone: neutral
        - label: 内存 - L3 SRAM（64MB）/ GDDR6（512GB/s）/ HBM3（P800，96GB）
          detail: 分层片上与外部内存；HBM3 是当前 P800 一代特有配置。
          tone: neutral
        - label: 计算 - SDNN（张量运算）+ Cluster 单元（通用计算）
          detail: 文档所载一代包含 8 个 Cluster 单元和 6 个 SDNN 单元，最高 128 TFLOPS FP16。
          tone: positive
    approximationNotes: 层级规格结合 Baidu 技术沙龙文章（记录 XPU-R 一代）与独立汇总的 P800 规格（flopper.io）和 TechInsights 独立芯片裸片分析；两代的精确规格并不相同，此处并列只是为了展示架构层次。
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: Kunlunxin 客户的工作流从标准框架中的模型开发出发，经 Kunlunxin 编译器栈，到集群规模训练或推理部署。
