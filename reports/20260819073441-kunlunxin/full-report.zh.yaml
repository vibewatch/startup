  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景靠四根支柱撑着：（1）Kunlunxin 位于中国增长最快的芯片细分赛道，国内 AI 加速器厂商在中国出货份额于 2025 年突破 41%，并在持续美国出口管制和「Buy
              China」政策支持下继续上升；（2）Kunlunxin 的 P800 芯片已经通过真实且带对抗性的市场检验——Tencent 作为 Baidu 的直接竞争对手，2026 年开始规模采购 P800
              芯片，多家媒体将其视为目前最强的第三方验证；（3）外部收入占比从约 40%（2024 年）升至超过 50%（2025 年），说明非 Baidu 自用需求之外确有商业牵引；（4）Kunlunxin 自 2011
              年起积累十余年 R&D 历史，且拥有 PaddlePaddle 原生软件栈，相比若干更新的国内芯片创业公司更成熟。反向逻辑至少同样强：Kunlunxin 约 $50 billion 的 IPO 目标大约是 12
              个月前 Series D 估值的 16x；其要求基石投资者购买相当于股权投资额三到七倍芯片的少见安排，也让外部需求是否有机产生这一循环融资疑虑具备可信度；其 2025 年收入估计因来源不同从约 ~$500
              million 到 ~$2.9 billion 不等，差距达 5-6x 且未调和，削弱了任何基于倍数估值的信心；其制造代工方（据信为 SMIC，未确认）既产能受限，又据报道从属于 Huawei
              的优先分配；Baidu 同时作为约 59.45% 控股股东和最大客户，形成关联方结构，限制了 Kunlunxin 增长故事可被独立验证的程度。若要改变这一判断，需要看到：公开 HKEX 招股书调和收入估计，确认
              Kunlunxin 的代工厂和良率，并有证据证明 Tencent 关系会复现或扩大，而不是停留在一笔已披露订单。
            claimRefs:
              - CV001
