      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              这里没有单一 TAM 数字可靠，因此本章保留几组测算视角，而不强行选一个。Bernstein 模型（经 AI Gazine）将中国 AI 加速器市场估为 2025 年 $37 billion、2026 年 $55
              billion、2027 年 $69 billion；国产芯片产值从 2025 年 $16 billion 升至 2028 年 $91 billion，而全国总需求为 $88
              billion——若预测成立，中国可能在两到三年内成为 AI 加速器净出口国。第二个按出货量看的视角（IDC 经 Reuters）显示，2025 年中国约出货 4 million 块加速卡，其中国产厂商 1.65
              million 块（41%）；Huawei 单独出货约 812,000 块（约占全部国产出货一半、总市场约 20%），Alibaba T-Head 约 265,000 块，Kunlunxin 和
              Cambricon 各约 116,000 块——Kunlunxin 仅占中国加速器总出货约 3%，在国产厂商中并列第三且距离第一梯队较远。第三个视角来自 TrendForce 的定性跟踪，预计到 2026
              年底国产芯片将超过中国 AI 服务器部署的 50%。这些视角方向一致（国产份额快速上升），但绝对规模相差数十亿美元，也没有一个单独拆出 Kunlunxin
              可服务的可触达市场——本章将该缺口作为明确尽调问题，而不是制造 SAM/SOM 拆分。
