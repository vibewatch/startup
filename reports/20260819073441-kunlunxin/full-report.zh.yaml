  summary: >-
    Kunlunxin (Beijing) Technology Co., Ltd. 是 Baidu, Inc. 旗下半导体设计子公司，开发 AI 训练和推理芯片（Kunlun 系列）以及 CUDA 替代软件栈。它的脉络可追溯到
    2011 年 Baidu 内部芯片项目，2021 年 4 月正式拆分为独立公司。Baidu 仍持有约 59.45% 控股权益，同时也是 Kunlunxin 最大客户；借助 China Mobile、China Merchants
    Bank、China Southern Power Grid、Geely，以及 2026 年以来 Baidu 直接竞争对手 Tencent 等具名客户，外部收入占比从总收入约 40%（2024）升至超过
