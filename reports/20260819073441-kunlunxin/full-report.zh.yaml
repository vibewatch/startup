      - number: '1.4'
        title: 里程碑、商业进展与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 的商业记录在几年内从只供 Baidu 的芯片供应商，转为拥有具名外部客户的公司。2025 年 8 月，其 AI 服务器在 China Mobile
              集中采购中标，三个通用计算标包合计中标金额超过 RMB1 billion (~$139 million)；Baidu 另行点名 China Merchants Bank、China Southern Power
              Grid、Geely Automobile Holdings、Vivo 与自用场景一起部署外部 P800。BYD 在记录中出现两次：据 2023 年 DigiTimes
              报道，它是与自动驾驶芯片规划相关的小额早期投资者；2025 年又作为 Series D 股权投资者进入。据报道，外部（非 Baidu）收入从 2024 年约占总收入 40% 升至 2025
              年超过一半；Tencent——Baidu 的直接竞争对手——2026 年开始规模采购 P800 芯片，多家媒体将其视为有别于 Baidu 内部需求的市场验证信号。各来源对 Kunlunxin
              收入数字冲突很大：CNBC 称 2024 年约 RMB2 billion（亏损约 RMB200 million），2025 年升至超过 RMB3.5 billion（~$500 million，盈亏平衡）；而
              BigGo Finance 援引 Tencent Tech 的数字称 2024 年收入超过 RMB10 billion (~$1.4 billion)，2025 年收入“远超” RMB20 billion
              (~$2.9 billion)——二者相差约 5-6x，尚未调和，本报告将其视为未解决冲突，而非选取单一数字。Kunlunxin 香港 IPO 结构据报道还要求基石投资者承诺购买其股权投资额 3 到 7
              倍的芯片，分析师已指出，这会引发关于外部需求是否有机的循环融资疑虑。公开证据尚不能确认 Kunlunxin 员工数、经调和的 2025 年收入数字、P800 制造代工方（SMIC 还是
              TSMC），或其是否面临任何直接美国出口管制清单指定——本报告将这些缺口作为明确尽调问题带入后续，而不是编造数字。
