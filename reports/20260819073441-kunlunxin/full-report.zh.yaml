      - number: '5.2'
        title: 架构与运行模型
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 的 XPU-R 架构把计算、存储、互连和接口拆成四个硬件模块。计算模块结合 SDNN（用于张量运算的软件定义神经网络引擎）和通用 Cluster 单元；Baidu
              自身技术沙龙披露的第二代设计写明，8 个 Cluster 单元和 6 个 SDNN 单元可在 FP16 下提供最高 128 TFLOPS，每个 Cluster 含 64
              个核心和分层内存系统（本地内存、共享内存、64MB 片上 L3 SRAM，再到 512GB/s 外部 GDDR6）。当前 P800（Kunlun III）一代转向 7nm 制程，按独立规格汇总配备 96GB
              HBM3 内存和 2.4-4 TB/s 带宽；TechInsights 独立芯片级 floorplan 分析确认其为 7nm 制程、超过 50 billion
              个晶体管，并将矩阵计算与通信单元物理分离——Kunlunxin 称这一架构选择提高了集群扩展效率。软件栈分层包括 runtime（驱动、监控、调试器、profiler）、基于 LLVM 的编译工具链（自定义
              Clang 前端、XPU 后端、AOT/JIT 编译）、高性能数学库（XBLAS/XDNN，Kunlunxin 对应 cuBLAS/cuDNN 的库）、集合通信库（XCCL），以及基于 TVM 的 XTCL
              图编译器，可从 PaddlePaddle、TensorFlow 和 PyTorch 导入模型。部署通过容器镜像和 Python wheels（经 FastDeploy XPU 后端）以及社区维护的
              vLLM-Kunlun 插件实现，后者把 PyTorch 操作映射到 XBLAS/XDNN 用于大模型推理——二者都以 GitHub 开源仓库分发，给 Kunlunxin
              带来多数中国纯硬件竞争者没有的公开开发者信号。
