      - number: '8.2'
        title: 融资背景、入场纪律与建议
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 的私募融资历史显示，估值从约 $1.9 billion（2021 年 4 月分拆）到 $3.0 billion（2025 年 7 月 Series D），随后在 IPO
              阶段指引中快速抬升：~$14.7 billion（2026 年 5 月）、约 HK$100 billion（~$12.8-13 billion，STAR Market 指引，2026 年 5 月），以及 ~$50
              billion（2026 年 6 月路演报道）。已审阅来源没有披露任何私募轮的优先股堆叠、清算优先权或稀释条款；在公开招股书发布前，IPO 最终定价、股份分配和承销团仍未披露（仅通过 GuruFocus 引用的
              CSRC 文件确认，CICC 为 STAR Market 路线提供辅导 / 顾问角色）。私募市场入场纪律，首先要确认市场到底在给哪一个收入数字定价——CNBC 估计的 ~$500 million，还是
              Tencent Tech/BigGo Finance 估计的 ~$2.9 billion。因为在 $50 billion 估值下，隐含市销率从约 17x 到 100x
              不等；这个区间一端是「激进但仍在该赛道泡沫化常态内」（Cambricon 可比区间约 55-85x），另一端则是「按任何可比口径都难以自洽」。收入差距未解、代工厂 / 良率图景未确认、缺少独立基准测试，再加上
              IPO 结构本身存在循环融资问号，本报告建议为继续研究（research-more）：既不是买入（估值和收入质量证据过于不完整），也不是直接回避（China Mobile、Tencent
              以及不断上升的外部收入占比说明底层商业牵引真实且有独立佐证）。风险评级为高；估值立场为偏高到昂贵；本建议置信度为中，反映的是真实不确定性，而不是证据基础薄弱。
            claimRefs:
              - CV008
              - CV009
