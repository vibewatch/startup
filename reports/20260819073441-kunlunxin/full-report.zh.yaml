        - HKEX 招股书经审计收入数字位于估计区间低端或更低
        - 意味着 $50B 目标对应 P/S 接近 100x，无论参考哪类可比公司都难以辩护
        - 将估值立场调整为昂贵 / 缺乏依据；把建议下调至接近回避。
      - - Tencent 关系在首次披露后 12 个月内未复现
        - 后续媒体或招股书披露中没有确认重复或扩大订单
