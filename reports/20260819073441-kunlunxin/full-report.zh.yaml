            body: >-
              现有最强客户验证证据是 China Mobile 采购中标：中文采购报道（ZhiDongXi、Tencent News、Zhihu）确认，Kunlunxin 在约 RMB5 billion 的 China
              Mobile AI 计算招标中取得领先位置，三个通用计算标包全数中标，金额超过 RMB1 billion，芯片通过系统集成商 H3C 和 ZTE 供应——这是生产部署，不是试点。Yicai Global 2025
              年 11 月报道另行点名 China Merchants Bank（2025 年 3 月中标 AI 芯片资源项目）、China Southern Power Grid、Geely Automobile
              Holdings 和 Vivo 是外部 P800 部署方，并称其覆盖互联网、金融、能源、交通和教育等领域的“数百个真实用户”——不过只有具名账户可独立核验，“数百个”是公司来源汇总。Kunlunxin
              自身案例材料描述了一个工业质检部署，相较此前 GPU 流水线实现 65% 成本下降和 9% 性能提升，这是公司来源但结果量化具体。China Biz Insider 2026 年 7 月报道补充 Tencent
