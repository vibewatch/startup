  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流契合度
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Kunlunxin 销售 AI 加速器硬件（Kunlun 芯片家族）加 CUDA 替代软件栈，让模型开发者无需为新硬件目标重写代码，就能训练和服务大模型。模型训练客户的工作流是：在
              PaddlePaddle、TensorFlow 或 PyTorch 中编写或移植模型；通过 Kunlunxin 的 XTCL 图编译库（基于 TVM）编译；再借助类似 CUDA 的 kernel/launch
              编程模型和 PCIe 上显式 host-device 内存传输，在 XPU-R 硬件上运行。推理客户场景中，Kunlunxin 自身案例材料描述了一个工业质检场景：用 Kunlun-Paddle 方案替换基于
              GPU 的 PyTorch 流水线，报告成本下降 65%、性能提升 9%——这是公司来源，但收益量化具体。集群规模上，Kunlunxin 基于 P800 的 “Super-Node” 产品（32/64
              卡单柜配置）面向互联网、金融、能源、交通和教育客户，这些客户需要多卡训练或高吞吐推理，但不想自己搭定制集群基础设施。自 2018 年以来，Kunlun 芯片与 PaddlePaddle 的集成从 Paddle
              Lite 仅推理支持，推进到 PaddlePaddle 2.0 及后续版本的完整训练支持；切换到 XPU 后端据 Kunlunxin 称只需改一行代码——本章将这一说法视为公司来源，而非独立基准验证。
