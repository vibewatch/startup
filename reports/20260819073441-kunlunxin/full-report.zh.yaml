    rows:
      - - '2011'
        - Baidu 设立智能芯片与架构部，启动内部 Kunlun 芯片 R&D
        - 创立
        - 内部 R&D 项目（FPGA 前、流片前）
        - Baidu
        - 奠定 Kunlunxin 芯片项目历史长于多数 2019 年后成立的中国 AI 芯片竞品。
      - - 2018-07
        - Kunlun I（K200）芯片发布，并部署于 Baidu 搜索引擎
        - 产品
        - Samsung 14nm，16GB HBM2，512GB/s 带宽
        - Baidu、Samsung Foundry
        - 多年 FPGA 仿真后，第一个专用硅片验证点。
      - - 2021-04
        - 芯片团队分拆为独立公司 Kunlunxin；首轮外部融资完成
        - 创立
        - ~RMB13B（~$1.9B）估值
        - 投资方：CPE、IDG Capital、Legend Capital、Yuanhe Puhua
        - 首次把 Baidu 内部项目转成可融资的独立实体。
      - - 2021-08
        - Kunlun II 芯片进入量产
        - 产品
        - TSMC 7nm；定位为 Nvidia A100 级性能
        - Kunlunxin、TSMC
        - 让 Kunlunxin 成为可信的训练 / 推理芯片供应商，而不只是搜索推理 ASIC 厂商。
      - - 2025-02
        - P800（Kunlun III）获得 DeepSeek R1/V3 训练和推理全兼容
        - 产品
        - 一键部署；单台 8 卡服务器以 8-bit 运行完整 671B 参数 DeepSeek R1
        - Kunlunxin
        - 把 Kunlunxin 旗舰芯片直接绑定到中国最受关注的开源模型家族。
      - - 2025-04
        - Baidu 在开发者大会启用 30,000 颗芯片的 P800 集群
        - 规模化
        - 集群支持「DeepSeek-like」模型训练和 1,000+ 企业微调工作负载
        - Baidu、Kunlunxin
        - 展示集群级部署，而不只是单芯片基准测试。
      - - 2025-07
        - Series D 融资完成
        - 融资
        - ~$283M 融资，投后估值 ~RMB21B（~$3.0B）
        - BYD、CICC Guanbo、China Mobile（Zhongyi Hechuang）、China Reform Holdings 基金
        - 在四年内使 Kunlunxin 估值较 2021 年分拆水平约翻倍。
      - - 2025-08
        - 中标 China Mobile AI 算力集采
        - 合作
        - 覆盖全部三个标包的 RMB1B+（~$139M）订单
        - Kunlunxin、China Mobile
        - 最大已披露外部商业订单；证明非 Baidu 需求的关键证据。
      - - 2025-11
        - M100/M300 路线图和 Tianchi256/512 集群计划在 Baidu World 发布
        - 产品
        - M100（2026，推理）；M300（2027，训练）
        - Baidu、Kunlunxin（Shen Dou）
        - 传递至少五年年度芯片迭代节奏的信号。
      - - '2026-01-01'
        - 向 HKEX 主板提交保密 Form A1 上市申请
        - 监管
        - IPO 申请保密；披露后 Baidu 股价 +9.35%
        - Kunlunxin、Baidu、HKEX
        - 迈向独立上市的第一个正式、市场可见步骤。
      - - 2026-01
        - M100 芯片进入商业爬坡
        - 规模化
        - 商业爬坡开始；实物产品后于 CCTV 展示（2026 年 7 月）
        - Kunlunxin
        - 标志路线图从发布转向硬件出货。
      - - '2026-05-08'
        - 上海 STAR Market IPO「辅导」流程启动
        - 监管
        - 双重上市策略确认；香港指引随后接近 HK$100B（~$13B）
        - Kunlunxin、STAR Market 监管机构
        - 在香港申请之外建立第二条境内上市路径。
      - - '2026-06-29'
        - 香港 IPO 估值目标据报接近 $50B；与芯片购买挂钩的投资者结构披露
        - 反向
        - 据报道，基石投资者需购买相当于其股权承诺 3-7x 的芯片
        - Kunlunxin、潜在基石投资者
        - 估值在不到 12 个月内较 2025 年 Series D 水平约抬升 16x，少见的购买条件也引发分析师对循环融资的质疑。
    notes: 这是第 1 章的唯一记录时间线；后续章节应引用这些带日期事件，而不是重新推导一条单独时间线。本章其他位置引用的收入数字被有意排除在本表之外，因为不同来源之间存在冲突。
