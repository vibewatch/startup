      - number: '3.3'
        title: 护城河耐久度、切换成本与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 最常被引用的护城河，是与 Baidu 自身 DeepSeek 级工作负载直接集成（P800 集群用全国产芯片栈训练 Baidu Wenxin 4.5 Turbo，后续又训练 Wenxin
              5.1 模型），以及正在扩大的外部客户名单，其中已包括竞争性超大规模云厂商 Tencent——多家媒体将其视为最高等级市场验证，可类比 Apple 从竞争对手 Samsung 采购 OLED
              面板。但这条护城河并不独特：2026 年 4 月 DeepSeek-V4 发布当天，Huawei Ascend、Cambricon、Hygon、Moore Threads、Alibaba
              T-Head、Kunlunxin 等都完成了当天适配，说明 DeepSeek 兼容性本身已经是入场券，而非持久差异化。对 Kunlunxin 地位更严肃的威胁是制造准入：据报道，SMIC 在晶圆分配上优先
              Huawei，排在 Cambricon 和 Kunlunxin 等其他国产客户之前；Huawei 已将芯片良率约翻倍至接近 40%，形成小厂难以复制的结构性生产优势。Biren Technology 在 2023
              年美国 Entity List 指定下仍继续运营，加上 2025 年美国出口管制扩大覆盖中国本土半导体生产，说明随着 Kunlunxin 商业存在感提升，它本身也可能面临类似指定，尽管已审阅来源未确认
              Kunlunxin 当前在清单上。Kunlunxin 2025 年约 116,000 块出货量（按 IDC 数据与 Cambricon 持平）远远落后于 Huawei 约 812,000 块和 Alibaba
              T-Head 265,000 块，意味着 Kunlunxin 当前基于规模的护城河在头部国产厂商中最弱，而不是最强。
