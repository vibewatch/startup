              Kunlunxin 的财务画像目前还不足以支撑对收入质量、利润率路径或资本密集度的高信心判断。最大问题是 2025 年收入估计无法调和：CNBC 数字为约 RMB3.5 billion（~$500
              million，盈亏平衡），而 BigGo Finance 引述 Tencent Tech 的数字为“远超” RMB20 billion（~$2.9 billion）——相差约
              5-6x，本报告不尝试向任何一边强行调和。取决于采用哪个数字，Kunlunxin 在 ~$50 billion IPO 目标下的隐含市销率约 17x 到 100x，从激进但仍可辩护（参照 Cambricon 自身
