      - CV015
      - CV016
      - CV017
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Cambricon（寒武纪，688256.SH）
        - 市值 / 往绩 PE
        - RMB630B-1T (~$88-140B)；200-373x 往绩 PE；FY2025 收入 RMB6.5B（+453%），首次实现年度盈利
        - 估值最高的已上市中国纯 AI 芯片公司；最接近的公开市场倍数参照
        - 已盈利且已上市；Kunlunxin 仍处 IPO 前阶段，按调和口径尚未盈利。
      - - Moore Threads（摩尔线程，科创板）
        - 市值 / P/S
        - IPO 后 RMB282-306B（~$39-43B，2025 年 12 月）；三年累计亏损约 RMB6B
        - 新近上市的国产 GPU 可比公司，首日交易同样带有 IPO 热炒模式
        - 全栈图形加 AI 定位不同于 Kunlunxin 的纯 AI 聚焦。
      - - Biren Technology（壁仞科技，HKEX）
        - IPO 前估值 / IPO 后市值
        - IPO 前 ~$2.2-2.9B（2025）；IPO 后 ~$12.3B（2026 年 1 月，上市首日上涨 +72.86%）
        - HKEX 可比上市公司，收入规模（2025 H1 约 $81.8M）与 Kunlunxin 低端估计相近
        - 2023 年以来被列入美国 Entity List，这一风险因素尚未在 Kunlunxin 身上确认。
      - - Iluvatar CoreX（天数智芯，HKEX）
        - IPO 后市值
        - IPO 后 ~$5.2B（2026 年 1 月）；FY2025 收入 RMB1.03B（+91.6%），毛利率约 54%
        - HKEX 上市国产 GPU 可比公司，已有经审计财务，可用作利润率结构代理
        - ByteDance 客户敞口集中，不同于 Kunlunxin 更分散的客户基础。
      - - Nvidia（NASDAQ:NVDA）
        - 市值 / 收入倍数
        - 全球市值 ~$3T+；收入倍数约 16-25x（2026）
        - AI 芯片估值倍数的全球基准，也是现状竞争标准
        - 不是中国本土可比对象；规模和生态成熟度差了数个数量级。
    notes: 估值数字混合了市值（已上市同行）、IPO 前 / 后估值（新近上市同行）和全球基准倍数（Nvidia）；跨行比较只能看方向，不能视为完全可比。
