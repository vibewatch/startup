        - HBM 供应是全行业瓶颈；Kunlunxin 具体内存来源未确认。
      - - 互连（芯片间链路）
        - 支持集群内多芯片大规模分布式训练
        - 集群级网络设计（自研；细节未充分披露）
        - 未看到对 5,000+ 颗芯片集群 90%+ 扩展效率说法的独立验证。
      - - PCIe 接口
        - 承载训练 / 推理工作负载的主机-设备数据传输
        - 行业标准 PCIe 规范（公司技术材料称为 4.0，向后兼容 3.0）
        - 标准接口；差异化和风险低于计算层或内存层。
      - - 基于 LLVM 的编译器工具链
        - 自定义 Clang 前端和 XPU 后端；AOT/JIT 编译；设备 / 主机分离
        - LLVM 开源项目作为底层编译器基础设施
        - 相较 Nvidia 数十年 CUDA 工具链，工具链成熟度尚无独立基准测试。
      - - XTCL 图编译器（基于 TVM）
        - 导入并优化 PaddlePaddle、TensorFlow、PyTorch 模型，以适配 XPU 硬件
        - Apache TVM 开源编译器框架作为底层图编译引擎
        - 相较 Nvidia 成熟图编译工具，框架覆盖度和优化质量未验证。
      - - 运行时和驱动层
        - 底层驱动、用户态 API、监控 / 调试 / 性能分析工具；支持多流和 SR-IOV
        - x86-64 和 Arm64 主机平台
        - 虚拟化（SR-IOV）和多租户成熟度来自公司描述，未独立测试。
    notes: 架构细节主要来自 Baidu 托管的技术沙龙文章和独立芯片裸片级分析（TechInsights）；风险评估反映每一层可获得独立佐证的程度， 而非已确认缺陷。
