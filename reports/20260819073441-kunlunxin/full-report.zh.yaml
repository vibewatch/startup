      - number: '8.3'
        title: 乐观、基准、悲观情景及可比公司
        blocks:
          - type: paragraph
            body: >-
              乐观情景下，Kunlunxin 的 2025 年收入向较高的 ~$2.9 billion 估计靠拢，外部收入占比继续升破 50%，Tencent 关系扩大为可复现的多年合同，SMIC 产能 / 良率改善到足以支撑
              M100 爬坡和 M300 按期发布，IPO 定价接近或高于 $50 billion 路演目标——这意味着市销率约 17x，对照 Cambricon 的可比区间大体说得通。基准情景下，2025-2026
              年收入更接近与 J.P. Morgan 口径一致的 ~$1.2-1.8 billion，外部占比稳定在 50-60% 区间，IPO 定价也更接近此前 HK$100 billion（~$13 billion）的
              STAR Market 指引，而不是抬升后的 $50 billion；本报告认为这一估值更有已审阅证据支撑。悲观情景下，收入向 CNBC 较低的 ~$500 million 估计靠拢，Tencent
              订单被证明只是一次性验证采购而非持续关系，SMIC 分配短缺限制出货增长，IPO 延期、实质下调定价，或因芯片购买承诺结构受到监管审查；这些因素叠加，会让所报道的 $50 billion
              目标在任何可比方法下都难以站住脚。相关可比集合包括四家已上市或新上市的中国 AI 芯片公司（Cambricon、Moore Threads、Biren Technology、Iluvatar
              CoreX）以及作为全球倍数基准的 Nvidia；没有一家能完美匹配 Kunlunxin 这种 Baidu 关联、仍未上市的结构，但合在一起可以约束一个可辩护的估值区间。
            claimRefs:
