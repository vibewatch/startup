      - number: '5.3'
        title: 部署、路线图与差异化
        blocks:
          - type: paragraph
            body: >-
              Kunlunxin 最清晰的部署证据，是 Baidu 2025 年 4 月启用自有 30,000 颗 P800 芯片集群；该集群被描述为可训练数千亿参数的 “DeepSeek-like” 模型，同时支持最多
              1,000 家企业客户微调工作负载。Baidu 还宣布计划到 2030 年把单个 Kunlun 集群扩展到百万卡，并把 P800 芯片组为 “Tianchi256”（2026 年上半年）和
              “Tianchi512”（2026 年下半年）配置，每一代目标都比上一代集群再提升 50%+ 性能。Kunlunxin 2025 年 2 月公告称已完全兼容 DeepSeek R1/V3 训练和推理，单台 8 卡
              P800 服务器可用 8-bit 精度运行完整 671-billion-parameter DeepSeek R1 模型，32 台服务器（256 颗
              P800）足以做全参数训练——这些说法只有一个第三方估计（Morgan Stanley，DeepSeek R1 推理约 1,521
              tokens/second）佐证，而不是可复现基准。差异化方面，Kunlunxin 最耐久的技术护城河是：（1）XTCL/XBLAS/XDNN 软件栈多年融入
              PaddlePaddle，生态深度多数国产竞争芯片难以匹配；（2）直接针对 Baidu 自身生产工作负载（Wenxin/Ernie 模型、Apollo 自动驾驶栈）做架构调优。最暴露的差异化缺口是制造：早期
              Kunlun I 芯片采用 Samsung 14nm 制程，Kunlun II 采用 TSMC 7nm 制程，但 2021 年后出口管制收紧，使 P800 很可能（虽未获官方确认）由 SMIC 7nm DUV
              制程制造，该制程成本估计比 TSMC EUV 等效制程高 25-50%，良率也更低。
