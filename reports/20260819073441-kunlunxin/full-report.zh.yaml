      - number: '4.2'
        title: 成本结构、利润率驱动与资本密集度代理
        blocks:
          - type: paragraph
            body: >-
              已审阅来源没有披露 Kunlunxin 毛利率、R&D 支出或制造成本拆分。最直接代理来自两家阶段相近、刚上市的国产 GPU 同行，它们在 2026 年 3 月提交了经审计 HKEX 年度业绩：Iluvatar
              CoreX 报告 FY2025 收入 RMB1,033.6 million（+91.6% YoY）、毛利 RMB558.0 million、调整后净亏损 RMB437.7 million；Biren
              Technology 报告 FY2025 收入 RMB1,034.6 million（+207.2% YoY）、毛利率 53.8%、R&D 费用 RMB1,476.1 million、法定亏损
              RMB16,493.0 million（调整后 non-IFRS 口径为 RMB873.8 million，剔除上市和股权激励费用）。Biren 自身招股书另行披露，其毛利率从 2022 年
              100%（早期销量接近零）降至 2025 年上半年的 31.9%；公司转向商业规模部署后，毛利率随之下行——本章将这一路径视为 Kunlunxin 最相关的利润率路径代理，因为 Kunlunxin
              收入规模大体可比，却没有披露自身利润率。制造上，鉴于 2021 年后出口管制限制 TSMC 访问，市场普遍认为 Kunlunxin P800（Kunlun III）采用 SMIC 7nm DUV
              制程生产，但已审阅来源没有正式确认 Kunlunxin 具体代工方；SMIC 7nm 节点估计比 TSMC EUV 等效节点成本高 25-50%，良率也明显更低，这是每个依赖 SMIC
              的国产厂商共同承受的结构性成本逆风。
