callouts:
  - calloutType: "risk"
    title: "Do not underwrite the public $208M label"
    body: "One retained source calls $208 million Dragos revenue and elsewhere calls approximately the same amount combined Dragos, runZero, and NetRise ARR. Until management reconciles metric, period, legal-entity perimeter, and acquisition timing, neither the number nor the associated 20.1x multiple is suitable for standalone underwriting."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
  - calloutType: "recommendation"
    title: "Private financial package is the gating diligence item"
    body: "Require audited statements, an ARR and revenue bridge, cohort retention, segment gross margins, CAC and payback, cash, burn, debt, working capital, capex, and transaction consideration allocation before reaching a capital-adequacy or valuation conclusion."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI011"
      - "CI012"
      - "CI016"
