evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials-and-customer-metrics
    missingEvidence: >-
      Standalone Dragos ARR, gross margin percentage, net dollar retention, and verified enterprise customer logo
      counts.
    whyItMatters: >-
      Accenture discloses only the bundled $208M ARR figure covering Dragos, runZero, and NetRise together, preventing
      standalone unit economic valuation.
    diligencePath: >-
      Obtain pre-acquisition audited financial statements or confidential investor presentation decks via formal data
      room access.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: minor
    topic: board-and-governance
    missingEvidence: >-
      Full board of directors roster, voting control allocation, and liquidation preference schedule under Accenture
      majority ownership.
    whyItMatters: >-
      Determines the extent of operational independence retained by executive leadership and potential drag-along rights
      governing minority holders.
    diligencePath: >-
      Review definitive merger agreement disclosures, SEC Form 8-K filings by Accenture plc, or Delaware certificate of
      incorporation amendments.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: arr-and-unit-economics
    missingEvidence: >-
      Audited GAAP annual recurring revenue (ARR), net revenue retention (NRR), and software vs services gross margin
      breakdown.
    whyItMatters: Without audited ARR, valuation multiples cannot be reliably compared to public cybersecurity comps.
    diligencePath: Request confidential investor data room materials detailing subscription ARR cohorts and service gross margins.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current Dragos and named-peer price sheets or customer contracts showing list price, realized ACV, term,
      discounting, implementation fees, and renewal economics.
    whyItMatters: >-
      Capability breadth cannot establish price competitiveness, switching economics, or expansion quality without
      comparable commercial terms.
    diligencePath: >-
      Request anonymized recent proposals and renewal cohorts from Dragos, then obtain matched bids for at least two
      named purpose-built OT-platform peers.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: direct-peer-gap
    missingEvidence: >-
      Independent current benchmark, procurement record, or customer evaluation naming direct OT-platform peers and
      comparing detection quality, deployment burden, support, and win rates.
    whyItMatters: >-
      The assigned evidence supports capability classes but cannot validate relative leadership or place named direct
      peers on the positioning map.
    diligencePath: >-
      Collect recent competitive RFP scorecards, reference calls, displacement data, and an independent hands-on
      benchmark using the same industrial network and threat scenarios.
    relatedQuestionRefs:
      - QP002
      - QP006
    relatedTableRefs:
      - TP001
      - TP002
  - type: conflicting-data
    severity: material
    topic: top-line-denominator
    missingEvidence: >-
      A management reconciliation of the public $208 million labels across revenue versus ARR and Dragos-only versus
      combined Dragos, runZero, and NetRise scope.
    whyItMatters: >-
      Without the metric definition and company perimeter, the top-line figure and derived acquisition multiple cannot
      support standalone underwriting.
    diligencePath: >-
      Obtain the transaction financial model and audited legal-entity revenue bridge, including acquisition close dates
      and eliminations.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Pricing, revenue mix, gross margin, NRR, GRR, ACV, CAC, payback, service utilization, and partner economics.
    whyItMatters: >-
      These inputs determine whether the subscription-and-services model produces durable recurring revenue and scalable
      gross profit.
    diligencePath: >-
      Request audited segment reporting, customer cohorts, contract samples, renewal schedules, and fully loaded
      sales-efficiency calculations.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, burn, runway, working capital, capex, debt obligations, acquisition consideration allocation, and
      post-transaction financing plan.
    whyItMatters: >-
      Historical funding and headline transaction value do not establish liquidity, cash ownership, financing
      dependency, or obligations.
    diligencePath: >-
      Obtain the latest balance sheet, cash-flow statement, debt schedule, monthly operating plan, and definitive
      transaction documents.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: serial-bus-level0-visibility
    missingEvidence: >-
      Documented benchmarks on Dragos sensor packet capture rates and asset identification fidelity for legacy serial
      bus protocols (Modbus RTU, Profibus) lacking Ethernet gateway encapsulation.
    whyItMatters: >-
      Air-gapped and legacy field devices at Level 0 and Level 1 represent critical safety components that may evade
      passive network monitoring without expensive gateway upgrades.
    diligencePath: >-
      Request customer deployment architecture blueprints and lab benchmark reports evaluating Level 0/1 sensor
      visibility across serial-to-Ethernet topologies.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Audited figures for gross revenue retention (GRR), net revenue retention (NRR), customer logo churn rate, and
      contract renewal rates.
    whyItMatters: >-
      Without retention benchmarks, long-term customer lifetime value (LTV) and platform stickiness cannot be
      mathematically verified.
    diligencePath: Request confidential SaaS retention cohort data and renewal logs during formal management due diligence.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: Breakdown of revenue concentration among the top 10 enterprise accounts.
    whyItMatters: >-
      High revenue concentration among large utility or energy customers could expose the business to major contract
      renegotiation risks.
    diligencePath: Review customer revenue concentration schedules in confidential financial disclosures.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
