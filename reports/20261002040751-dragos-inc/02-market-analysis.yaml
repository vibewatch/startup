callouts:
  - calloutType: "insight"
    title: "Divergence Between Operational Plant Priority and Enterprise IT Security Strategy"
    body: "A central structural challenge in the OT cybersecurity market is the operational divide between plant operators and enterprise IT security teams. Plant managers prioritize uninterrupted physical operations, determinism, and safety, viewing active IT scanning tools as direct operational hazards. Successful vendors must prove passive, non-intrusive network visibility before security teams can gain plant approval for broader deployments."
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM008"
  - calloutType: "risk"
    title: "Market Opacity Around Pure-Play Software ARR and Conversion Efficiency"
    body: "While market sizing reports cite double-digit growth and multi-billion-dollar market aggregates, available vendor scale data remains largely opaque. With Dragos's valuation pegged at $1.7 billion in 2021 and third-party estimated revenue hovering near $96.6 million in 2026, diligence requires verifying actual software ARR versus bundled professional services and incident response retainers."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM005"
      - "CM012"
