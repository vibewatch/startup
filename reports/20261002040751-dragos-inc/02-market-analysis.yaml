company:
  name: "Dragos, Inc."
chapter:
  number: 2
  title: "Market Analysis"
  summary: "The operational technology (OT) and cyber-physical systems (CPS) cybersecurity market is expanding rapidly from traditional passive visibility into active risk-based posture management, incident response, and unified IT/OT convergence. Industrial threat activity—particularly double-extortion ransomware and targeted infrastructure intrusions—drives high demand across electric, oil & gas, and manufacturing sectors, but customer adoption remains constrained by operational uptime requirements, lengthy procurement cycles, and legacy asset fragility."
sections:
  - id: "market-boundary-scope"
    title: "Market Boundary, Taxonomy, and Included Spend"
    body: "Operational technology (OT) cybersecurity encompasses purpose-built hardware, software, and professional incident response services designed to protect industrial control systems (ICS), supervisory control and data acquisition (SCADA) networks, and cyber-physical systems (CPS) against unauthorized access and operational disruption (CM001). The addressable perimeter covers Level 0 through Level 3 of the Purdue Enterprise Reference Architecture, including programmable logic controllers (PLCs), distributed control systems (DCS), remote terminal units (RTUs), and industrial human-machine interfaces (HMIs) (CM001, CM008). Traditional enterprise IT cybersecurity tools—such as active endpoint detection and response (EDR) scanners, routine patch orchestration agents, and corporate vulnerability assessment scanners—are explicitly excluded from safe deployment on native OT networks because active network probing can destabilize fragile industrial automation controllers and trigger catastrophic physical process halts (CM001, CM006). The core spend comprises passive network traffic inspection, specialized industrial protocol parsing (e.g., Modbus, DNP3, Ethernet/IP, PROFINET), OT-specific vulnerability prioritization, and continuous threat intelligence (CM001, CM008). Status quo substitutes remain heavily reliant on basic network air-gapping, manual spreadsheet-based asset inventories, static industrial firewalls, and general IT security platforms relabeled with basic operational marketing stickers (CM001, CM008). Enterprise IT security giants increasingly serve as distribution partners or SIEM/SOC integration hubs rather than direct physical process visibility replacements (CM001, CM007)."
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM007"
      - "CM008"
    tableRefs:
      - "TM001"
  - id: "market-sizing-dynamics"
    title: "Market Sizing, Growth Trajectory, and TAM/SAM/SOM Lenses"
    body: "Evaluating the industrial cybersecurity market requires distinguishing between broad industrial digital security estimates and the serviceable market for specialized critical infrastructure OT platforms (CM002). Independent market research from Frost & Sullivan projected the global industrial cybersecurity market to expand from $3.3 billion in 2020 to $10.2 billion by 2025, reflecting a compound annual growth rate (CAGR) of 25.3% driven by accelerating infrastructure threat actor activity (CM002). Concurrently, Gartner established the cyber-physical systems (CPS) protection platform category to classify vendors capable of discovery, categorization, mapping, and protection of production and mission-critical environments outside enterprise IT (CM001). Dragos addresses this sector through the Dragos Platform, threat intelligence feeds, and incident response services, recording estimated annual revenue of approximately $96.6 million in 2026 with an estimated workforce of 529 to 877 employees (CM003, CM004). The overall funding environment for pure-play industrial security reached historic peaks following Dragos's $200 million Series D funding round at a $1.7 billion valuation in October 2021, supplemented by a $74 million Series D extension in September 2023, bringing cumulative financing to approximately $438 million to $440 million (CM002, CM005, CM011). However, market sizing disclosures exhibit variance across intelligence providers, and private market ARR transparency remains limited, necessitating structured sizing layers across total addressable spend, serviceable focus segments, and obtainable vendor capture (CM002, CM003, CM012)."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM011"
      - "CM012"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-segmentation-path"
    title: "Buyer Segmentation, Budget Ownership, and Procurement Path"
    body: "Adoption of OT cybersecurity solutions operates across distinct organizational hierarchies spanning operational engineering teams, plant managers, corporate CISOs, and enterprise risk committees (CM006, CM007). In traditional infrastructure operators, operational technology is managed by VP of Operations, plant engineers, or SCADA directors whose core operational priority is uninterrupted system uptime and physical human safety (CM006, CM009). Conversely, cybersecurity budget ownership is increasingly shifting to corporate Chief Information Security Officers (CISOs) and Chief Information Officers (CIOs) tasked with mitigating corporate-wide cyber catastrophe risk and maintaining board-level governance (CM006, CM007). In municipal utilities and co-ops, supervising engineers and utility operations directors frequently initiate evaluations to resolve critical blind spots in regional grid or water infrastructure (CM007). In large-scale industrial conglomerates and brewing or manufacturing giants, corporate CISOs sponsor standardized platform procurements to eliminate operational blind spots across distributed plant facilities (CM007). Enterprise procurement workflows typically begin with passive architecture assessments or network visibility pilot deployments to establish baseline asset inventories without interrupting active controls (CM008, CM009). Full enterprise rollouts typically span 12 to 18 months, often utilizing IT/OT cloud marketplaces such as Microsoft Azure Sentinel integrations or systems integrator channels like Accenture and World Wide Technology for contract vehicle execution (CM001, CM007, CM009)."
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-adoption"
    title: "Adoption Drivers, Operational Constraints, and Diligence Gaps"
    body: "Adoption of specialized industrial cyber protection is accelerated by compounding adversary pressure and strict compliance mandates, but counterbalanced by structural plant constraints (CM006, CM009, CM010). In the first quarter of 2026, Dragos tracked 1,020 ransomware incidents affecting industrial organizations worldwide, with manufacturing accounting for 62% (633 incidents), ICS-related supply chain organizations accounting for 139 incidents, and transportation accounting for 87 incidents (CM010). Modern extortion campaigns systematically weaponize virtualization infrastructure, compromised administrative credentials, and enterprise IT pivots to force operational shutdowns even without executing specialized ICS payload code (CM010). Regulatory requirements—including NERC CIP standards in electric power, IEC 62443 industrial control standards, and national directives such as the U.S. National Cybersecurity Strategy—further compel operators to implement verifiable cyber controls (CM002, CM009). Despite strong demand tailwinds, significant adoption bottlenecks persist (CM009, CM012). Plant operations teams display resistance toward introducing network tooling near legacy controllers, citing potential disruption risks and scarce scheduled maintenance outage windows (CM009). Furthermore, public market sizing data exhibits substantial variance regarding exact pure-play OT software spend versus bundled integration services, while detailed customer count, churn rates, and contractual net revenue retention remain private, representing material diligence gaps (CM003, CM012)."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM006"
      - "CM009"
      - "CM010"
      - "CM012"
