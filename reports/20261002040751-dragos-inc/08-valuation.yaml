company:
  name: "Dragos, Inc."
chapter:
  number: 8
  title: "Valuation"
  summary: "The public record supports a research-more recommendation rather than a price call: Dragos has a documented $1.7 billion 2021 valuation and approximately $440 million raised by 2023, but current operating metrics and transaction terms are not publicly auditable. Conflicting 2026 transaction descriptions make both current fair value and target return indeterminate."
sections:
  - id: "investment-call"
    title: "Price-sensitive investment call"
    body: >-
      The appropriate recommendation is research-more, with low confidence in any current
      valuation and a high underwriting risk rating. This is not a negative judgment on
      Dragos's product or market; it is a refusal to convert sparse, definition-mismatched
      public data into false precision. A current entry price, security class, ownership
      percentage, liquidation stack, audited revenue, ARR, retention, margins, burn, and
      cash balance are all absent from the reviewed evidence. The retrieved Nasdaq Private
      Market text contains general platform disclosures but no auditable Dragos quote or
      trade record, while third-party transaction sources disagree on status and value.
      Without those inputs, neither a target return nor a defensible standalone valuation
      range can be calculated. Capital should remain uncommitted until a data room
      reconciles the price, instrument, financial baseline, and exit economics.
    claimRefs:
      - "CV001"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-and-valuation-evidence"
    title: "Financing history is not current fair value"
    body: >-
      The cleanest financing anchor is Dragos's September 2023 announcement: a $74 million
      Series D extension increased the round to $274 million and cumulative funds raised
      to approximately $440 million. An independent 2021 report separately recorded a
      $1.7 billion valuation for the original $200 million Series D. Both are historical
      transaction facts, not evidence of today's cash available or common-equity value.
      Growjo currently displays estimated annual revenue of $154.4 million and a $1.7
      billion valuation; dividing those two directory figures gives roughly 11.0x
      estimated revenue. That calculation is explicitly not an ARR multiple, and neither
      input is audited or dated in the retrieved page. It therefore illustrates why the
      public evidence cannot support a current pricing decision rather than supplying one.
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV014"
    tableRefs: []
    figureRefs: []
  - id: "thesis-and-scenarios"
    title: "Thesis, anti-thesis, and bounded scenarios"
    body: >-
      The thesis rests on durable industrial-cybersecurity need, product specialization,
      and international expansion signals. Dragos reported 1,020 ransomware incidents
      affecting industrial organizations in Q1 2026, and its product page says its
      prioritization model directs immediate action to only 3-6% of OT vulnerabilities.
      The April 2026 appointment of a Japan country manager and a third-party 501-1,000
      employee band indicate operating scale, but both growth and scale signals lack
      audited economics. The anti-thesis is therefore financial rather than categorical:
      the company may have a strong strategic position while still offering an unattractive
      security at the wrong price or preference terms. Bull, base, and bear cases below
      are decision conditions, not point forecasts; all retain an indeterminate value
      until standalone financials and transaction consideration are reconciled.
    claimRefs:
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV002"
      - "TV003"
    figureRefs: []
  - id: "exit-readiness-and-diligence"
    title: "Exit evidence and final diligence asks"
    body: >-
      Public evidence signals strategic buyer interest but does not establish a completed,
      priced exit for a new investor. YesPress describes Accenture's June 2026 agreement
      for a majority stake in Dragos as subject to closing conditions and states that a
      $4.175 billion enterprise value covers three transactions, including full
      acquisitions of runZero and NetRise, rather than Dragos alone. Preqin's preview,
      by contrast, labels Dragos acquired and attributes $3.25 billion to the transaction.
      The issuer, instrument, enterprise-versus-equity bridge, ownership purchased,
      proceeds allocation, rollover, and closing evidence are not in the assigned record.
      Final diligence must obtain the signed transaction documents, current cap table and
      preference waterfall, audited financials, ARR reconciliation, cohort retention,
      gross margin by software and services, burn, cash, debt, and management's post-deal
      operating plan. A failed closing, weak retention, or preference-heavy proceeds
      allocation would break the investable thesis.
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs: []
    figureRefs: []
