figures:
  - id: FP001
    title: Evidence-constrained positioning by OT specialization and owned workflow breadth
    type: quadrant
    summary: >-
      Ordinal positions distinguish a documented specialist platform from adjacent tools, internal
      teams, and channel-led combinations without implying independently measured market leadership.
    data:
      points:
        - label: "Dragos"
          x: 5
          y: 5
          detail: "High OT specialization and broad owned workflow claims across visibility, intelligence, response, AI, and hybrid delivery."
        - label: "NetRise capability"
          x: 3
          y: 2
          detail: "Focused software and firmware transparency now reported within Dragos."
        - label: "CAI / Alias Robotics"
          x: 3
          y: 2
          detail: "OT-specific task automation with demonstrated CTF velocity but limited sustained-operation evidence."
        - label: "Enterprise EDR / XDR"
          x: 1
          y: 4
          detail: "Broad adjacent security workflow, with legacy-OT fit not supported by the assigned evidence."
        - label: "Internal OT team"
          x: 4
          y: 2
          detail: "High local process knowledge but capacity and tooling vary by operator."
        - label: "Integrator / cloud channel"
          x: 2
          y: 4
          detail: "Broad delivery and governance reach through Accenture, Microsoft, or WWT, but not a directly evidenced standalone OT product."
    approximationNotes: >-
      Scores are a 1-5 ordinal analytical synthesis of retained scope evidence, not market share,
      product-quality, win-rate, or independently benchmarked performance; unknown direct peers are
      omitted because the assigned evidence cannot place them.
    claimRefs: [CP004, CP006, CP007, CP010, CP011, CP012, CP015]
callouts:
  - calloutType: strength
    title: Industrial context is the clearest differentiator
    body: >-
      The retained evidence supports a workflow moat around legacy-OT constraints, threat context,
      and response expertise, but it does not prove higher detection accuracy or better economics
      than named peers.
    claimRefs: [CP002, CP003, CP007]
  - calloutType: risk
    title: Automation and channel power can compress the moat
    body: >-
      Open-source AI can automate meaningful analyst tasks, while integrators and cloud platforms
      control important routes to market; Dragos must own the integrated customer experience without
      assuming that product breadth guarantees pricing power.
    claimRefs: [CP004, CP010, CP011, CP012, CP014]
