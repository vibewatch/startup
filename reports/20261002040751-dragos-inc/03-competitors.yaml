company:
  name: "Dragos, Inc."
chapter:
  number: 3
  title: Competitors
  summary: >-
    Dragos presents a broad xOT platform that combines visibility, prioritization, threat
    intelligence, response expertise, hybrid delivery, and channel integrations, while recent
    product-role evidence points toward further platform consolidation. The retained evidence does
    not independently benchmark named direct OT-security peers or disclose comparable pricing, so
    differentiation is supportable at the capability-class level but not as a vendor ranking.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant competitive set is wider than purpose-built OT monitoring vendors. Dragos
      officially presents an xOT platform for asset inventory and network monitoring, while the
      reported addition of NetRise extends the scope toward software and firmware transparency.
      Those surfaces compete for a consolidated platform decision, but buyers can also assemble
      adjacent IT detection products, services partners, specialist tools, and internal response
      teams. An open-source cybersecurity AI framework placed sixth in Dragos's 2025 OT CTF after
      solving 32 of 34 challenges, demonstrating that task-level automation is becoming a credible
      substitute for part of the analyst workflow rather than a complete platform substitute.
      Company product roles spanning MDR, XDR, threat intelligence, cloud delivery, and AI also
      signal that category boundaries are expanding. Crucially, none of the eight retained sources
      independently names and benchmarks Dragos against a direct purpose-built OT peer, so the
      direct-peer row remains an explicit evidence gap rather than a guessed comparison.
    claimRefs: [CP001, CP006, CP010, CP015, CP016]
    tableRefs: [TP001]
  - id: capability-differentiation
    title: Capability differentiation and delivery posture
    body: >-
      The strongest documented differentiation is workflow context around industrial environments,
      not a verified superiority score. Dragos says its prioritization model narrows action to the
      3-6% of vulnerabilities that matter and pairs identified threats with response playbooks and
      expert xOT insight. Its incident-response paper explains why generic enterprise playbooks can
      fail in legacy OT: unsupported systems, fragile processes, missing backups, and limited
      endpoint telemetry make ordinary remediation unsafe. A company-issued job repost describes a
      planned unified customer experience with a central API serving SaaS, on-premises, and machine
      integrations, which could reduce fragmentation across intelligence, services, AI, and
      documentation. These are meaningful product-design signals, but they remain company-issued
      claims rather than independent performance evidence. Dragos's Q1 2026 ransomware analysis
      further supports the need for IT-to-OT context, although its 1,020-incident count is based on
      public victim disclosures and data-leak-site posts rather than a complete market census.
    claimRefs: [CP002, CP003, CP005, CP007, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-switching-and-distribution
    title: Pricing, switching costs, and distribution power
    body: >-
      No retained source discloses current Dragos list pricing, realized contract value, discounting,
      or directly comparable peer pricing. The resulting underwriting gap is material because
      platform breadth does not establish price competitiveness or expansion economics. Switching
      costs are more visible qualitatively: the planned unified portal, central API, fleet
      management, entitlements, and hybrid interfaces would concentrate customer workflows and
      subscriptions in one control plane. At the same time, Dragos markets distribution through
      Accenture governance and integration, Microsoft Azure Marketplace and Sentinel, and World
      Wide Technology services. These routes can lower adoption friction and let customers layer
      Dragos into existing estates rather than replace every control, but they also give powerful
      partners influence over implementation, account access, and the surrounding architecture.
      Dragos's historical $364.2 million funding total and $1.7 billion 2021 valuation indicate
      substantial prior scale, but neither metric measures current competitive traction.
    claimRefs: [CP004, CP005, CP013, CP014, CP015]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      Dragos's defensibility appears strongest where industrial context, threat research, response
      expertise, and deployment knowledge reinforce one another. Legacy OT conditions make generic
      IT remediation risky, while ransomware-driven IT failures can still cascade into operations;
      that combination rewards vendors able to interpret both environments. The durability risk is
      that parts of the workflow are becoming automatable. In the Dragos CTF, CAI showed a 37%
      early-phase velocity advantage over the top-five human average, yet the same research found
      that extended judgment and cognitive endurance remained human advantages and warned that a
      CTF does not reproduce ambiguous, continuously adapting production incidents. The likely
      outcome is hybrid substitution: AI and adjacent MDR/XDR tools compress routine analysis while
      specialists retain higher-consequence decisions. Dragos must therefore convert intelligence
      and services into a cohesive product experience faster than adjacent platforms and channel
      partners can absorb those functions. Without independent named-peer testing, customer
      switching data, or comparable pricing, the evidence supports a plausible moat but not a
      durable winner-take-most conclusion.
    claimRefs: [CP007, CP009, CP010, CP011, CP012, CP015, CP016]
