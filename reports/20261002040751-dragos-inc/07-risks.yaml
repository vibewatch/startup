company:
  name: "Dragos, Inc."
chapter:
  number: 7
  title: Risks
  summary: >-
    Dragos operates against a severe and current industrial-ransomware backdrop, but the investment risk is less
    about whether demand exists than whether the company can execute specialized incident response, sustain
    partner-dependent delivery, and demonstrate current financial and legal resilience. The public evidence supports
    high residual execution risk while leaving company-specific incidents, litigation, burn, runway, and margins
    unresolved.
sections:
  - id: threat-pressure-and-risk-ranking
    title: Threat pressure and residual risk ranking
    body: >-
      Dragos reported 1,020 industrial ransomware incidents in Q1 2026, including 633 manufacturing victims, or
      62% of its observed total. That dataset is company-issued and derives from public victim disclosures and
      ransomware-group leak sites, so it measures observed claims rather than a complete incident population.
      Nevertheless, NCC Group separately reported that industrials represented 30% of ransomware attacks in its Q3
      threat-intelligence data. The combined evidence supports a high-likelihood threat environment for Dragos
      customers, while Dragos's own finding that ordinary enterprise-system loss can cascade into OT disruption
      makes response quality a high-impact operating and reputation risk. The heatmap therefore uses categorical
      placement tied to cited frequency, consequence, and evidence gaps rather than unsupported numerical
      probabilities.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR016]
    figureRefs: [FR001]
  - id: operational-and-technical-execution
    title: Operational and technical execution risk
    body: >-
      The central execution risk is that OT incident response cannot simply inherit enterprise IT processes. Dragos
      warns that conventional IT response tools can be ineffective or dangerous in industrial environments, while
      specialist staffing, operator control, legacy assets, proprietary data sources, and vendor-specific logs
      complicate investigations. Historical Dragos service engagements reinforce the problem: the 2021 review
      reported limited OT visibility, external connections, shared credentials, and improper segmentation across
      substantial shares of engagements. Dragos's 2025 financial-risk report models incident-response planning,
      architecture, monitoring, remote access, and vulnerability management as complementary controls, not a single
      cure. Investment diligence should therefore test time-to-triage, time-to-containment, false-positive burden,
      specialist coverage, and post-incident customer outcomes rather than infer resilience from market demand.
    claimRefs: [CR003, CR004, CR008, CR009, CR010, CR011, CR016]
    tableRefs: [TR002]
  - id: regulatory-legal-and-assurance
    title: Regulatory, legal, and assurance exposure
    body: >-
      The assigned evidence establishes rising customer compliance obligations, not Dragos-specific compliance.
      NCC Group identifies NIS2 and the EU Cyber Resilience Act among frameworks relevant to critical-infrastructure
      customers and notes potentially significant sanctions for noncompliance. Dragos also serves environments where
      availability, integrity, safety, and forensic traceability can matter more than ordinary data recovery. Those
      conditions create consequential product-assurance, contracting, notification, and professional-services
      exposure, but the pool contains no regulator filing, court record, audit opinion, certification register, or
      verified Dragos incident notice. The legal register is therefore a partial risk map rather than evidence of an
      existing violation. Closing that gap requires counsel-confirmed litigation and enforcement schedules,
      jurisdictional product-compliance mapping, insurance terms, and incident-notification history.
    claimRefs: [CR003, CR006, CR008, CR015, CR016]
    tableRefs: [TR001]
  - id: dependencies-finance-and-kill-criteria
    title: Dependencies, financial opacity, and thesis-break triggers
    body: >-
      Delivery is visibly ecosystem-dependent. The NCC retainer combines NCC's digital forensics with Dragos's OT
      technology and expertise; Dragos also presents Accenture, Microsoft, and World Wide Technology as governance,
      marketplace, telemetry, and integration partners. These relationships can expand coverage, but they introduce
      integration, service-quality, platform, and channel dependencies that must be tested contractually. Financial
      evidence is weaker: independent reporting verifies a $200 million Series D and $1.7 billion valuation in 2021,
      but that historical funding is neither current revenue nor cash available. The same report noted that the
      announcement did not allocate a stated amount to product and services development. A material customer-impacting
      outage, sustained response-SLA deterioration, loss of a major platform or response partner, or inability to
      evidence adequate runway should break the operating thesis pending remediation.
    claimRefs: [CR007, CR009, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
