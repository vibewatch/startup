company:
  name: "Dragos, Inc."
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2016 by former NSA cyber operators Robert M. Lee, Justin Cavinee, and Jon Lavender, Dragos established the category-defining industrial control systems (ICS) and operational technology (OT) cybersecurity platform. Headquartered in Hanover, Maryland, the company reached a $1.7B valuation at its Series D round in 2021 before entering into a definitive June 2026 transaction where Accenture agreed to acquire a majority stake alongside runZero and NetRise at a combined $4.175B enterprise valuation."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Operating Footprint, and Strategic Mission"
    body: "Dragos, Inc. is a specialized operational technology (OT) and industrial control systems (ICS) cybersecurity software and services provider founded in 2016 and headquartered in Hanover, Maryland. The company's corporate identity is anchored in a dedicated industrial defense mission: protecting physical infrastructure—including electricity transmission, oil and gas pipelines, water distribution, and discrete manufacturing facilities—from state-sponsored adversaries and criminal extortion groups. Unlike traditional IT security platforms that rely primarily on endpoint agents or enterprise event logging, Dragos provides specialized network monitoring, passive protocol inspection, asset discovery, vulnerability prioritization via its Now-Next-Never model, and codified threat intelligence specifically engineered for cyber-physical systems. As of 2026, Dragos operates globally across North America, EMEA, and APAC, employing approximately 580 personnel from its Hanover headquarters alongside regional presences in the United Kingdom, Australia, New Zealand, the Middle East, and Japan."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "founders-leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance Architecture"
    body: "Dragos was co-founded by ex-National Security Agency (NSA) cyber operators Robert M. Lee, Justin Cavinee, and Jon Lavender, who established the firm following high-profile industrial incident investigations, notably the cyberattacks on the Ukrainian electric grid. Robert M. Lee serves as Chief Executive Officer, leading executive strategy, product vision, and government relations, while maintaining a high public profile across national critical infrastructure policy forums. The executive bench combines commercial enterprise scaling with specialized industrial intelligence capabilities, supported by regional leaders such as Hayley Turner (Vice President for Asia-Pacific) and Kaori Nieda (Country Manager for Japan). Under the pending June 2026 Accenture majority acquisition structure, Dragos will continue operating as an independent business unit led by Lee, while absorbing runZero and NetRise under its operating umbrella to integrate attack-surface intelligence and firmware software-bill-of-materials capabilities into a unified extended operational technology (xOT) defense platform."
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-strategic-transaction"
    title: "Capitalization History, Investor Base, and Majority Acquisition"
    body: "Dragos's balance sheet development reflects substantial strategic and institutional backing across energy, defense, and industrial automation sectors. The company raised a landmark $200M Series D round in October 2021 co-led by Koch Disruptive Technologies and funds managed by BlackRock, establishing a $1.7B private market valuation. Total venture funding across nine rounds reached between $364M and $438M, supported by institutional venture firms including Canaan Partners, AllegisCyber Capital, Energy Impact Partners, and DataTribe, alongside strategic corporate investors such as Emerson, Rockwell Automation, Hewlett Packard Enterprise, National Grid Partners, Schweitzer Engineering Laboratories, and Aramco Ventures. In June 2026, Accenture entered into definitive agreements to acquire a majority stake in Dragos alongside 100% of runZero and NetRise for an aggregate enterprise value of approximately $4.175B, representing an estimated $3.25B standalone transaction value for Dragos and validating the high strategic premium commanded by specialized industrial cybersecurity assets."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "industrial-threat-environment-and-operational-risks"
    title: "Operational Environment, Ransomware Headwinds, and Threat Exposure"
    body: "Dragos operates in an increasingly volatile industrial threat landscape characterized by aggressive double-extortion ransomware and nation-state reconnaissance against critical infrastructure supply chains. In its Q1 2026 industrial ransomware analysis, Dragos recorded 1,020 ransomware incidents worldwide impacting manufacturing (633 incidents), ICS engineering and equipment suppliers (139 incidents), and transportation logistics (87 incidents), led by RaaS syndicates including Qilin, Akira, and The Gentleman. While adversaries rarely manipulate industrial control protocols directly, enterprise IT compromises routinely cascade into operational shutdowns, production halts, and data extortion. For Dragos, this climate creates powerful procurement tailwinds but also imposes severe operational risks: client deployments carry zero-tolerance availability requirements, and any failure to detect lateral movement across converged IT/OT boundaries or third-party engineering access poses reputational exposure to the firm."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
