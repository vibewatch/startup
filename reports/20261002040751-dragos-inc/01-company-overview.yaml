    body: "The June 2026 transaction where Accenture agreed to acquire a majority stake in Dragos while absorbing runZero and NetRise represents a pivotal consolidation in operational technology cybersecurity. By combining Dragos's deep OT threat intelligence and passive inspection platform with runZero's attack-surface discovery and NetRise's firmware SBOM analysis under Robert M. Lee's leadership, the entity creates a comprehensive $208M ARR extended OT (xOT) defense provider backed by Accenture's global systems integration scale."
