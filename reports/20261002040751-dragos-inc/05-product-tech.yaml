  - id: "product-modules-and-threat-intelligence"
    title: "Core Platform Capabilities, Threat Behavior Analytics, and Vulnerability Triage"
    body: "The Dragos Platform operationalizes industrial cyber defense through four core functional capabilities: continuous asset identification, threat behavior detection, risk-based vulnerability management, and guided incident investigation. Unlike conventional IT intrusion detection systems that rely primarily on generic anomaly detection—which frequently triggers massive alert fatigue in industrial environments when batch manufacturing runs shift or operational setpoints change—Dragos prioritizes threat behavior analytics as its primary detection methodology. These analytics characterize specific adversary tactics, techniques, and procedures (TTPs) observed in real-world critical infrastructure intrusions.\n\nDragos encodes threat intelligence directly into executable platform logic through regularly distributed Knowledge Packs. Researched and compiled by Dragos threat intelligence analysts, Knowledge Packs enrich the platform with detection rules, protocol dissectors, asset characterization algorithms, and step-by-step investigation playbooks specifically aligned to tracked industrial threat activity groups such as CHERNOVITE and ELECTRUM. When an alert triggers, the platform provides security analysts with operational context, affected control system asset roles, and scripted response workflows designed to minimize mean time to recovery (MTTR).\n\nFor industrial vulnerability management, Dragos departs from raw Common Vulnerability Scoring System (CVSS) metrics—which routinely overstate severity in air-gapped or segmented OT networks—by employing its proprietary Now, Next, Never triage model. Platform analysis indicates that only 3% to 6% of disclosed industrial vulnerabilities represent actionable, weaponizable operational threats requiring immediate remediation ('Now'), while the vast majority lack network reachability or operational impact and can be addressed during scheduled maintenance ('Next') or safely deprioritized ('Never'). This prioritization prevents industrial operators from taking critical production equipment offline for non-critical software patches."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE001"
  - id: "deployment-ecosystem-and-technical-risks"
    title: "Integration Ecosystem, Enterprise SOC Convergence, and Diligence Risks"
    body: "Operational technology security cannot function in isolation from enterprise security operations. Dragos addresses IT/OT convergence through certified API-driven integrations with major enterprise security providers, including Fortinet, Sophos, Microsoft Sentinel, and Splunk. In joint deployments with Fortinet, the Dragos Platform synchronizes dynamically generated asset profiles and threat notifications directly into FortiGate next-generation firewalls and FortiSIEM. Firewalls consume Dragos asset sync profiles to populate dynamic address groups and enforce microsegmentation policies, while enterprise security operations center (SOC) analysts monitor industrial threat events within standard SIEM interfaces without requiring specialized OT engineering console access.\n\nDespite these integrations, technical diligence highlights meaningful operational dependencies and architectural limitations. The hardware appliance portfolio spans ruggedized substation-ready DIN-rail units (NS-25-DR certified to IEC 61850-3 and IEEE 1613) to enterprise rackmount units (NS-2050-E processing up to 10 Gbps and 300,000 flows). However, low-power rugged sensors support sustained bandwidth of only 25 Mbps and up to 1,000 monitored assets, requiring substantial hardware replication in sprawling industrial facilities. Furthermore, virtual appliances demand high server compute and storage commitments—requiring up to 48 virtual CPU cores and 192 GB RAM for virtual CentralStore instances—which creates implementation friction in brownfield industrial plants lacking modern hypervisor clusters.\n\nFrom a threat landscape perspective, Dragos intelligence confirms that while ransomware adversaries such as Qilin, Akira, and The Gentleman frequently disrupt manufacturing and energy organizations (accounting for 1,020 industrial ransomware incidents globally in Q1 2026, with manufacturing representing 62%), attackers overwhelmingly gain access via compromised IT enterprise systems, remote access VPNs, and virtualization infrastructure rather than native ICS protocol manipulation. This dynamic places intense commercial pressure on Dragos to expand beyond traditional OT into extended operational technology (xOT), including IoT, IIoT, and enterprise edge devices. Finally, developer and practitioner engagement remains heavily proprietary: the company's public open-source surface is strictly limited to legacy indicators of compromise (such as CRASHOVERRIDE malware IOCs) and minimal customer portal SDK wrappers, reflecting an enterprise-closed ecosystem heavily dependent on proprietary vendor threat feeds."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
