callouts:
  - calloutType: "insight"
    title: "Architectural Compromise: The Passive Monitoring Boundary"
    body: "Dragos's foundational design commitment to passive, non-intrusive network monitoring is its greatest operational asset in mission-critical environments, ensuring zero risk of tripping fragile industrial processes. However, this same design represents an inherent visibility ceiling: passive sensors cannot observe unmonitored switch ports, low-traffic serial buses (RS-232/485), or air-gapped Level 0/1 actuators unless physical tap infrastructure or specialized active collection agents are present."
    claimRefs:
      - "CE002"
      - "CE004"
  - calloutType: "risk"
    title: "Enterprise Convergence vs. Specialized OT Detection"
    body: "As ransomware adversaries increasingly weaponize commodity IT access vectors (such as remote access VPNs, compromised administrative credentials, and hypervisor exploits) to indirectly cripple industrial operations without manipulating native OT protocols, Dragos faces intense pressure to defend broader IT/OT boundary surfaces. While integration with Fortinet and Microsoft bridges this gap, enterprise IT security suites increasingly view OT as a feature rather than an independent category."
    claimRefs:
      - "CE013"
      - "CE014"
