companyProfile:
  summary: >-
    Dragos is a purpose-built operational technology and industrial control systems cybersecurity company that protects
    critical infrastructure with passive sensing, threat intelligence, vulnerability prioritization, and incident
    response services. Founded in 2016 by former NSA cyber operators Robert M. Lee, Justin Cavinee, and Jon Lavender,
    the company is headquartered in Hanover, Maryland and operates across North America, EMEA, and APAC. Public evidence
    indicates a large enterprise customer base, strong strategic partners, and a June 2026 Accenture
    majority-acquisition agreement, but the standalone economics needed to underwrite current value remain opaque.
