figures:
  - id: "FU001"
    title: "Dragos customer journey and expansion loop architecture"
    type: "journey-map"
    summary: "Multi-stage customer progression from initial asset visibility to co-managed threat defense and cloud-integrated enterprise operations."
    data:
      items:
        - label: "Phase 1: Initial Discovery & Passive Sensing"
          touchpoints:
            - "Passive network sensors deployed to identify unmapped OT/ICS assets"
            - "Architecture assessment and baseline industrial protocol inspection"
            - "Identification of critical vulnerabilities using Now, Next, Never framework"
          duration: "1 to 3 months"
          objective: "Establish operational network visibility without plant disruption"
          milestone: "Comprehensive OT asset map and prioritized vulnerability register"
        - label: "Phase 2: Platform Operationalization & SOC Integration"
          touchpoints:
            - "Dragos Platform integration into security operations center (SOC)"
            - "Staff onboarding via Dragos Academy on-demand and live training"
            - "Telemetry flow established into Microsoft Sentinel or enterprise SIEM"
          duration: "3 to 6 months"
          objective: "Embed OT threat detection into daily security monitoring"
          milestone: "Active alert triage and playbook execution by internal analysts"
        - label: "Phase 3: Managed Defense & OT Watch Activation"
          touchpoints:
            - "OT Watch managed service engagement for continuous expert hunting"
            - "Opt-in to Neighborhood Keeper for anonymized threat intelligence sharing"
            - "Dragos Threat Intelligence feed integration for adversary tracking"
          duration: "6 to 12 months"
          objective: "Expand defense bandwidth and participate in industry collective defense"
          milestone: "24/7 proactive hunting coverage and peer threat benchmarking"
        - label: "Phase 4: Cloud Integration & Marketplace Procurement"
          touchpoints:
            - "Procurement alignment via Microsoft Marketplace using Azure MACC commitments"
            - "Hybrid and Azure SaaS deployment expansion across global operating facilities"
            - "System integration partnerships with Accenture and World Wide Technology"
          duration: "12+ months renewal"
          objective: "Scale enterprise-wide OT cyber resilience with predictable cloud spend"
          milestone: "Multi-facility standardized deployment and multi-year subscription renewal"
        - label: "Phase 5: Global Multi-Site Standardization"
          touchpoints:
            - "Standardization across international fleet and regional business units"
            - "Local support and distribution via regional partners such as Macnica"
            - "Incident response retainer coverage across all primary production sites"
          duration: "18 to 24 months"
          objective: "Establish unified global OT cybersecurity baseline and SLA guarantees"
          milestone: "Full enterprise fleet visibility and consolidated executive reporting"
        - label: "Phase 6: Continuous Resilience & Community Threat Collaboration"
          touchpoints:
            - "Ongoing participation in Dragos OT-CERT resource sharing and CTF benchmarking"
            - "Continuous threat intelligence updates reflecting active ransomware and nation-state campaigns"
            - "Annual architecture reviews and tabletop exercises for plant operations"
          duration: "Ongoing subscription"
          objective: "Sustain adaptive posture against evolving cyber-physical attack techniques"
          milestone: "Zero unplanned OT downtime from preventable cyber-physical compromises"
    approximationNotes: "Journey phases represent the operational customer adoption and expansion lifecycle synthesized from Dragos product documentation, training curricula, and partner agreements."
    claimRefs:
