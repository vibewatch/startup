chapter:
  number: 6
  title: "Customers"
  summary: "Dragos secures operational technology (OT) infrastructure across electric utilities, oil and gas, manufacturing, transportation, water, and government entities. Customer adoption is anchored by marquee critical infrastructure operators, a strategic Microsoft enterprise cloud channel, and managed OT Watch threat operations, while retention and unit economics remain undisclosed private metrics."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Target Customer Segmentation and Buyer Dynamics"
    body: "Dragos focuses specifically on asset-intensive, operationally dependent critical infrastructure sectors where cyber downtime risks catastrophic safety, environmental, or economic harm. The primary vertical segments comprise electric utilities, oil and gas production and transport, heavy manufacturing, municipal and regional water systems, transportation networks, and defense or government installations (CU001, CU002, CU006). Within these enterprise accounts, buying authority typically bridges Chief Information Security Officers (CISOs) and Vice Presidents of Operational Technology, Engineering, or Plant Operations (CU003). Procurement dynamics historically required specialized justification due to the friction of deploying passive hardware network sensors across proprietary industrial control systems. However, Dragos has mitigated procurement barriers through strategic channel partnerships—most notably an expanded enterprise collaboration with Microsoft enabling platform procurement via Microsoft Marketplace against Azure consumption commitments (MACC), alongside native telemetry ingestion into Microsoft Sentinel (CU004, CU005). Regional expansion is supported by specialized domestic distribution partners, including Macnica in Japan (CU008)."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU008"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "production-deployments-and-customer-proof"
    title: "Named Customer Proof and Operational Outcomes"
    body: "Publicly referenced customers validate production deployments across public power utilities, energy conglomerates, regional water authorities, and industrial manufacturers. Littleton Electric Light and Water Department (LELWD) utilizes the Dragos Platform for real-time asset visibility, network monitoring, and accelerated incident response across municipal power and water systems (CU009). Orlando Utilities Commission (OUC) relies on Dragos to harden municipal electric and water infrastructure security posture (CU010). Koch Industries operationalizes the Dragos Platform to detect ICS threats and filter false-positive alerts across diversified global manufacturing facilities (CU011). Similarly, Trinity River Authority of Texas leverages the Dragos OT Watch managed threat-hunting team to supplement in-house security bandwidth across municipal water treatment infrastructure (CU012). The Boston Beer Company deployed Dragos to secure distributed commercial brewing and packaging plants (CU013). Beyond commercial enterprise accounts, Dragos engages over 1,000 practitioner teams globally via community cyber competitions, including the annual Dragos OT Capture The Flag (CTF) (CU015)."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "adoption-trajectory-and-durability-risks"
    title: "Adoption Trajectory, Expansion Surfaces, and Concentration Risks"
    body: "Dragos's commercial trajectory reflects steady platform expansion within the cybersecurity sector for operational environments, with private-market tracking services estimating 2024 revenue at $154.4M ARR alongside an estimated 566 employees (CU007, CU014). The expansion trajectory is driven by land-and-expand mechanics: customers initially adopt the Dragos Platform for passive asset discovery and vulnerability triage under the 'Now, Next, Never' framework, then expand into Dragos Threat Intelligence, the Neighborhood Keeper collective defense network, on-demand training via Dragos Academy, and professional incident response retainers (CU002, CU003, CU016). Nevertheless, significant diligence gaps persist: contract duration, gross retention rate (GRR), net revenue retention (NRR), and exact customer logo counts remain closely held private figures without third-party audit. Furthermore, while the expanded Microsoft partnership and systems integration alliances with Accenture and World Wide Technology provide scalable distribution, they introduce counterparty channel concentration risks and margin exposure if hyperscalers enhance native OT security monitoring (CU004, CU005, CU006)."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU014"
      - "CU016"
    tableRefs:
      - "TU002"
