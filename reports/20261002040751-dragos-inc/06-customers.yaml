    body: "The expanded partnership with Microsoft significantly lowers procurement hurdles for asset-intensive enterprises by allowing organizations to deploy the Dragos Platform on Azure, ingest OT telemetry directly into Microsoft Sentinel, and apply Microsoft Azure Consumption Commitments (MACC) to Dragos software purchases."
    claimRefs:
