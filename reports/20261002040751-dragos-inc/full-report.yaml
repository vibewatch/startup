      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Dragos was co-founded by ex-National Security Agency (NSA) cyber operators Robert M. Lee, Justin Cavinee,
              and Jon Lavender, who established the firm following high-profile industrial incident investigations,
              notably the cyberattacks on the Ukrainian electric grid. Robert M. Lee serves as Chief Executive Officer,
              leading executive strategy, product vision, and government relations, while maintaining a high public
              profile across national critical infrastructure policy forums. The executive bench combines commercial
              enterprise scaling with specialized industrial intelligence capabilities, supported by regional leaders
              such as Hayley Turner (Vice President for Asia-Pacific) and Kaori Nieda (Country Manager for Japan). Under
              the pending June 2026 Accenture majority acquisition structure, Dragos will continue operating as an
              independent business unit led by Lee, while absorbing runZero and NetRise under its operating umbrella to
              integrate attack-surface intelligence and firmware software-bill-of-materials capabilities into a unified
              extended operational technology (xOT) defense platform.
            claimRefs:
