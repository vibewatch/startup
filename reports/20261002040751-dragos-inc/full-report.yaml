      - number: '8.2'
        title: Financing history is not current fair value
        blocks:
          - type: paragraph
            body: >-
              The cleanest financing anchor is Dragos's September 2023 announcement: a $74 million Series D extension
              increased the round to $274 million and cumulative funds raised to approximately $440 million. An
              independent 2021 report separately recorded a $1.7 billion valuation for the original $200 million Series
              D. Both are historical transaction facts, not evidence of today's cash available or common-equity value.
              Growjo currently displays estimated annual revenue of $154.4 million and a $1.7 billion valuation;
              dividing those two directory figures gives roughly 11.0x estimated revenue. That calculation is explicitly
              not an ARR multiple, and neither input is audited or dated in the retrieved page. It therefore illustrates
              why the public evidence cannot support a current pricing decision rather than supplying one.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
      - number: '8.3'
        title: Thesis, anti-thesis, and bounded scenarios
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on durable industrial-cybersecurity need, product specialization, and international
              expansion signals. Dragos reported 1,020 ransomware incidents affecting industrial organizations in Q1
              2026, and its product page says its prioritization model directs immediate action to only 3-6% of OT
              vulnerabilities. The April 2026 appointment of a Japan country manager and a third-party 501-1,000
              employee band indicate operating scale, but both growth and scale signals lack audited economics. The
              anti-thesis is therefore financial rather than categorical: the company may have a strong strategic
              position while still offering an unattractive security at the wrong price or preference terms. Bull, base,
              and bear cases below are decision conditions, not point forecasts; all retain an indeterminate value until
              standalone financials and transaction consideration are reconciled.
