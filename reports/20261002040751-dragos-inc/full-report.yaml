  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Threat pressure and residual risk ranking
        blocks:
          - type: paragraph
            body: >-
              Dragos reported 1,020 industrial ransomware incidents in Q1 2026, including 633 manufacturing victims, or
              62% of its observed total. That dataset is company-issued and derives from public victim disclosures and
              ransomware-group leak sites, so it measures observed claims rather than a complete incident population.
              Nevertheless, NCC Group separately reported that industrials represented 30% of ransomware attacks in its
              Q3 threat-intelligence data. The combined evidence supports a high-likelihood threat environment for
              Dragos customers, while Dragos's own finding that ordinary enterprise-system loss can cascade into OT
              disruption makes response quality a high-impact operating and reputation risk. The heatmap therefore uses
              categorical placement tied to cited frequency, consequence, and evidence gaps rather than unsupported
              numerical probabilities.
            claimRefs:
