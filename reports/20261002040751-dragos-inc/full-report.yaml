      - number: '4.2'
        title: Top-line signals are unusable without denominator reconciliation
        blocks:
          - type: paragraph
            body: >-
              Multiples displays $208 million as June 2026 Dragos revenue and uses it to calculate a 20.1x acquisition
              multiple, yet the same page describes approximately $208 million of ARR for the combined Dragos, runZero,
              and NetRise entity. Revenue and ARR are different metrics, and Dragos-only and combined-company
              denominators are different populations; the source does not reconcile either difference. The page's
              reported $4.2 billion acquisition price is therefore a transaction marker rather than proof of standalone
              recurring revenue quality. Dragos's own 2026 threat reporting documents persistent industrial cyber risk,
              which supports market need, but demand conditions do not establish company revenue, growth, retention, or
              profitability.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI016
      - number: '4.3'
        title: GTM breadth creates opportunity and an unquantified cost base
        blocks:
          - type: paragraph
            body: >-
              Dragos publicly names Accenture, Microsoft, and World Wide Technology as delivery or integration partners,
              while a 2021 financing report said proceeds would support geographic expansion and practitioner programs.
              That suggests a direct-and-partner enterprise motion, but the retained evidence contains no channel fees,
              partner-sourced pipeline share, sales-cycle data, quota productivity, CAC, or payback period. LeadIQ's
              broad 501-1,000 employee classification and description of a global office presence indicate a meaningful
              operating footprint, not its cost or efficiency. Service delivery, international coverage, and partner
              enablement may raise customer value while also adding labor and support costs. Without revenue mix and
              cost-of-revenue detail, gross-margin quality cannot be inferred from the subscription label.
            claimRefs:
              - CI003
              - CI010
              - CI011
              - CI015
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI016
      - number: '4.4'
        title: Historical financing does not establish current capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Funding databases disagree on cumulative capitalization: Tracxn reports $439 million across eight rounds,
              whereas Multiples reports $432 million across six rounds. Enterprise Times independently documented the
              $200 million 2021 Series D, a then-total of $364.2 million, and a $1.7 billion valuation, but historical
              funding raised is not cash available in October 2026. The accessible Nasdaq Private Market text supplies
              only general investor and legal disclaimers, not issuer transaction data that could resolve current
              liquidity. No retained source discloses cash, debt, burn, runway, working capital, capex, profitability,
              or the allocation of acquisition consideration. The financial verdict is therefore evidence-constrained:
