      - number: '7.2'
        title: Operational and technical execution risk
        blocks:
          - type: paragraph
            body: >-
              The central execution risk is that OT incident response cannot simply inherit enterprise IT processes.
              Dragos warns that conventional IT response tools can be ineffective or dangerous in industrial
              environments, while specialist staffing, operator control, legacy assets, proprietary data sources, and
              vendor-specific logs complicate investigations. Historical Dragos service engagements reinforce the
              problem: the 2021 review reported limited OT visibility, external connections, shared credentials, and
              improper segmentation across substantial shares of engagements. Dragos's 2025 financial-risk report models
              incident-response planning, architecture, monitoring, remote access, and vulnerability management as
              complementary controls, not a single cure. Investment diligence should therefore test time-to-triage,
              time-to-containment, false-positive burden, specialist coverage, and post-incident customer outcomes
              rather than infer resilience from market demand.
            claimRefs:
