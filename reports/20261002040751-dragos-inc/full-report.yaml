      - number: '3.3'
        title: Pricing, switching costs, and distribution power
        blocks:
          - type: paragraph
            body: >-
              No retained source discloses current Dragos list pricing, realized contract value, discounting, or
              directly comparable peer pricing. The resulting underwriting gap is material because platform breadth does
              not establish price competitiveness or expansion economics. Switching costs are more visible
              qualitatively: the planned unified portal, central API, fleet management, entitlements, and hybrid
              interfaces would concentrate customer workflows and subscriptions in one control plane. At the same time,
              Dragos markets distribution through Accenture governance and integration, Microsoft Azure Marketplace and
              Sentinel, and World Wide Technology services. These routes can lower adoption friction and let customers
              layer Dragos into existing estates rather than replace every control, but they also give powerful partners
              influence over implementation, account access, and the surrounding architecture. Dragos's historical
              $364.2 million funding total and $1.7 billion 2021 valuation indicate substantial prior scale, but neither
              metric measures current competitive traction.
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Dragos's defensibility appears strongest where industrial context, threat research, response expertise,
              and deployment knowledge reinforce one another. Legacy OT conditions make generic IT remediation risky,
              while ransomware-driven IT failures can still cascade into operations; that combination rewards vendors
              able to interpret both environments. The durability risk is that parts of the workflow are becoming
              automatable. In the Dragos CTF, CAI showed a 37% early-phase velocity advantage over the top-five human
              average, yet the same research found that extended judgment and cognitive endurance remained human
              advantages and warned that a CTF does not reproduce ambiguous, continuously adapting production incidents.
              The likely outcome is hybrid substitution: AI and adjacent MDR/XDR tools compress routine analysis while
              specialists retain higher-consequence decisions. Dragos must therefore convert intelligence and services
              into a cohesive product experience faster than adjacent platforms and channel partners can absorb those
              functions. Without independent named-peer testing, customer switching data, or comparable pricing, the
              evidence supports a plausible moat but not a durable winner-take-most conclusion.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Industrial context is the clearest differentiator
            body: >-
              The retained evidence supports a workflow moat around legacy-OT constraints, threat context, and response
              expertise, but it does not prove higher detection accuracy or better economics than named peers.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP007
          - type: callout
            title: Automation and channel power can compress the moat
            body: >-
              Open-source AI can automate meaningful analyst tasks, while integrators and cloud platforms control
              important routes to market; Dragos must own the integrated customer experience without assuming that
              product breadth guarantees pricing power.
            calloutType: risk
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visible; monetization detail is not
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports two commercial pathways: subscription access to an OT cybersecurity
              platform and specialized services around assessments, incident response, and threat hunting. Multiples
              labels the revenue model as subscription, while Tracxn describes both the platform and services; Dragos's
              own site presents platform capabilities and partner-enabled delivery. None of those sources provides list
              prices, realized prices, contract duration, billing units, revenue recognition policy, or revenue mix.
              Threat intelligence is clearly part of the offer, but the public material does not establish whether it is
              sold separately, bundled into platform subscriptions, or used primarily to support services. The resulting
              model is plausible recurring software plus labor-based delivery, not a quantified SaaS mix.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
