              - CP007
              - CP010
              - CP013
              - CP015
              - CP016
      - number: '3.2'
        title: Capability differentiation and delivery posture
        blocks:
          - type: paragraph
            body: >-
              The strongest documented differentiation is workflow context around industrial environments, not a
              verified superiority score. Dragos says its prioritization model narrows action to the 3-6% of
              vulnerabilities that matter and pairs identified threats with response playbooks and expert xOT insight.
              Its incident-response paper explains why generic enterprise playbooks can fail in legacy OT: unsupported
              systems, fragile processes, missing backups, and limited endpoint telemetry make ordinary remediation
              unsafe. A company-issued job repost describes a planned unified customer experience with a central API
              serving SaaS, on-premises, and machine integrations, which could reduce fragmentation across intelligence,
              services, AI, and documentation. These are meaningful product-design signals, but they remain
              company-issued claims rather than independent performance evidence. Dragos's Q1 2026 ransomware analysis
              further supports the need for IT-to-OT context, although its 1,020-incident count is based on public
              victim disclosures and data-leak-site posts rather than a complete market census.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
