chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Strategic Mission
        blocks:
          - type: paragraph
            body: >-
              Dragos, Inc. is a specialized operational technology (OT) and industrial control systems (ICS)
              cybersecurity software and services provider founded in 2016 and headquartered in Hanover, Maryland. The
              company's corporate identity is anchored in a dedicated industrial defense mission: protecting physical
              infrastructure—including electricity transmission, oil and gas pipelines, water distribution, and discrete
              manufacturing facilities—from state-sponsored adversaries and criminal extortion groups. Unlike
              traditional IT security platforms that rely primarily on endpoint agents or enterprise event logging,
              Dragos provides specialized network monitoring, passive protocol inspection, asset discovery,
              vulnerability prioritization via its Now-Next-Never model, and codified threat intelligence specifically
              engineered for cyber-physical systems. As of 2026, Dragos operates globally across North America, EMEA,
              and APAC, employing approximately 580 personnel from its Hanover headquarters alongside regional presences
              in the United Kingdom, Australia, New Zealand, the Middle East, and Japan.
