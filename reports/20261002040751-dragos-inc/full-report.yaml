      - number: '1.3'
        title: Capitalization History, Investor Base, and Majority Acquisition
        blocks:
          - type: paragraph
            body: >-
              Dragos's balance sheet development reflects substantial strategic and institutional backing across energy,
              defense, and industrial automation sectors. The company raised a landmark $200M Series D round in October
              2021 co-led by Koch Disruptive Technologies and funds managed by BlackRock, establishing a $1.7B private
              market valuation. Total venture funding across nine rounds reached between $364M and $438M, supported by
              institutional venture firms including Canaan Partners, AllegisCyber Capital, Energy Impact Partners, and
              DataTribe, alongside strategic corporate investors such as Emerson, Rockwell Automation, Hewlett Packard
              Enterprise, National Grid Partners, Schweitzer Engineering Laboratories, and Aramco Ventures. In June
              2026, Accenture entered into definitive agreements to acquire a majority stake in Dragos alongside 100% of
              runZero and NetRise for an aggregate enterprise value of approximately $4.175B, representing an estimated
              $3.25B standalone transaction value for Dragos and validating the high strategic premium commanded by
              specialized industrial cybersecurity assets.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
