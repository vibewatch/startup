        title: Adoption Trajectory, Expansion Surfaces, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Dragos's commercial trajectory reflects steady platform expansion within the cybersecurity sector for
              operational environments, with private-market tracking services estimating 2024 revenue at $154.4M ARR
              alongside an estimated 566 employees (CU007, CU014). The expansion trajectory is driven by land-and-expand
              mechanics: customers initially adopt the Dragos Platform for passive asset discovery and vulnerability
              triage under the 'Now, Next, Never' framework, then expand into Dragos Threat Intelligence, the
              Neighborhood Keeper collective defense network, on-demand training via Dragos Academy, and professional
              incident response retainers (CU002, CU003, CU016). Nevertheless, significant diligence gaps persist:
              contract duration, gross retention rate (GRR), net revenue retention (NRR), and exact customer logo counts
              remain closely held private figures without third-party audit. Furthermore, while the expanded Microsoft
              partnership and systems integration alliances with Accenture and World Wide Technology provide scalable
              distribution, they introduce counterparty channel concentration risks and margin exposure if hyperscalers
              enhance native OT security monitoring (CU004, CU005, CU006).
