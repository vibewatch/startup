  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Operating Model, Data Collection Modalities, and Scaled Architecture
        blocks:
          - type: paragraph
            body: >-
              The core architectural philosophy of the Dragos Platform rests on safe, deterministic visibility across
              industrial control systems and operational technology (ICS/OT) networks without disrupting sensitive
              physical automation processes. Industrial operating environments—spanning electric power substations, oil
              refineries, water treatment plants, and discrete manufacturing facilities—contain sensitive programmable
              logic controllers (PLCs), remote terminal units (RTUs), and safety instrumented systems (SIS) that cannot
              tolerate conventional IT vulnerability scanners or high-frequency active polling. To address this
              operational constraint, Dragos implements a tiered multi-source telemetry architecture comprising
              distributed passive network monitoring sensors, targeted host-based active collection agents, engineering
              project file data importers, and localized data aggregation nodes (SiteStores and CentralStores).


              Passive monitoring operates non-intrusively via network tap or switch SPAN/mirror ports. Dragos hardware
              and virtual sensors inspect operational network communications in real time using deep packet inspection
              (DPI) capable of parsing and decoding over 600 proprietary and open industrial protocols, including
              Modbus, DNP3, EtherNet/IP, IEC 61850, and PROFINET. Because passive monitoring cannot observe endpoints
              residing on unmonitored network segments or devices that communicate infrequently, Dragos complements
              passive listening with a safe active collection executable. Deployed directly on Windows-based
              human-machine interfaces (HMIs) and engineering workstations, the lightweight Dragos Agent interrogates
              local host configuration, installed patches, firmware revisions, and peripheral connections without
              injecting disruptive probe packets into operational control loops. Project file imports further ingest
              logic files from vendor-specific control software to map controller I/O racks and logic configurations
              offline.


              Telemetry collected by local sensors flows upstream into Dragos SiteStores (STS-550-E hardware or virtual
              STS appliances), which aggregate asset inventory, vulnerability mappings, and detection telemetry across
              connected sensors. A single hardware SiteStore can ingest telemetry from connected sensors monitoring up
              to 20 Gbps of aggregate industrial network traffic and track up to 500,000 industrial assets. For
              enterprise-wide critical infrastructure operators managing geographically distributed utilities or
              multi-facility manufacturing footprints, Dragos CentralStore instances aggregate up to 50 distinct
              SiteStores, providing a centralized operational console for global querying, multi-site dashboarding, and
              coordinated incident investigation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
