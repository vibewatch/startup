  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive investment call
        blocks:
          - type: paragraph
            body: >-
              The appropriate recommendation is research-more, with low confidence in any current valuation and a high
              underwriting risk rating. This is not a negative judgment on Dragos's product or market; it is a refusal
              to convert sparse, definition-mismatched public data into false precision. A current entry price, security
              class, ownership percentage, liquidation stack, audited revenue, ARR, retention, margins, burn, and cash
              balance are all absent from the reviewed evidence. The retrieved Nasdaq Private Market text contains
              general platform disclosures but no auditable Dragos quote or trade record, while third-party transaction
              sources disagree on status and value. Without those inputs, neither a target return nor a defensible
              standalone valuation range can be calculated. Capital should remain uncommitted until a data room
              reconciles the price, instrument, financial baseline, and exit economics.
            claimRefs:
              - CV001
              - CV007
