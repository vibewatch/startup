              Publicly referenced customers validate production deployments across public power utilities, energy
              conglomerates, regional water authorities, and industrial manufacturers. Littleton Electric Light and
              Water Department (LELWD) utilizes the Dragos Platform for real-time asset visibility, network monitoring,
              and accelerated incident response across municipal power and water systems (CU009). Orlando Utilities
              Commission (OUC) relies on Dragos to harden municipal electric and water infrastructure security posture
              (CU010). Koch Industries operationalizes the Dragos Platform to detect ICS threats and filter
              false-positive alerts across diversified global manufacturing facilities (CU011). Similarly, Trinity River
              Authority of Texas leverages the Dragos OT Watch managed threat-hunting team to supplement in-house
              security bandwidth across municipal water treatment infrastructure (CU012). The Boston Beer Company
              deployed Dragos to secure distributed commercial brewing and packaging plants (CU013). Beyond commercial
              enterprise accounts, Dragos engages over 1,000 practitioner teams globally via community cyber
