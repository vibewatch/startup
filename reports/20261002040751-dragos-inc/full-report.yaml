      - number: '7.4'
        title: Dependencies, financial opacity, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Delivery is visibly ecosystem-dependent. The NCC retainer combines NCC's digital forensics with Dragos's
              OT technology and expertise; Dragos also presents Accenture, Microsoft, and World Wide Technology as
              governance, marketplace, telemetry, and integration partners. These relationships can expand coverage, but
              they introduce integration, service-quality, platform, and channel dependencies that must be tested
              contractually. Financial evidence is weaker: independent reporting verifies a $200 million Series D and
              $1.7 billion valuation in 2021, but that historical funding is neither current revenue nor cash available.
              The same report noted that the announcement did not allocate a stated amount to product and services
              development. A material customer-impacting outage, sustained response-SLA deterioration, loss of a major
              platform or response partner, or inability to evidence adequate runway should break the operating thesis
              pending remediation.
