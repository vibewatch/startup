      - number: '7.3'
        title: Regulatory, legal, and assurance exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence establishes rising customer compliance obligations, not Dragos-specific compliance.
              NCC Group identifies NIS2 and the EU Cyber Resilience Act among frameworks relevant to
              critical-infrastructure customers and notes potentially significant sanctions for noncompliance. Dragos
              also serves environments where availability, integrity, safety, and forensic traceability can matter more
              than ordinary data recovery. Those conditions create consequential product-assurance, contracting,
              notification, and professional-services exposure, but the pool contains no regulator filing, court record,
              audit opinion, certification register, or verified Dragos incident notice. The legal register is therefore
              a partial risk map rather than evidence of an existing violation. Closing that gap requires
              counsel-confirmed litigation and enforcement schedules, jurisdictional product-compliance mapping,
              insurance terms, and incident-notification history.
