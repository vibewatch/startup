      - number: '8.4'
        title: Exit evidence and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public evidence signals strategic buyer interest but does not establish a completed, priced exit for a new
              investor. YesPress describes Accenture's June 2026 agreement for a majority stake in Dragos as subject to
              closing conditions and states that a $4.175 billion enterprise value covers three transactions, including
              full acquisitions of runZero and NetRise, rather than Dragos alone. Preqin's preview, by contrast, labels
              Dragos acquired and attributes $3.25 billion to the transaction. The issuer, instrument,
              enterprise-versus-equity bridge, ownership purchased, proceeds allocation, rollover, and closing evidence
              are not in the assigned record. Final diligence must obtain the signed transaction documents, current cap
              table and preference waterfall, audited financials, ARR reconciliation, cohort retention, gross margin by
              software and services, burn, cash, debt, and management's post-deal operating plan. A failed closing, weak
              retention, or preference-heavy proceeds allocation would break the investable thesis.
