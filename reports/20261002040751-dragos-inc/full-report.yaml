              - CO016
      - number: '1.4'
        title: Operational Environment, Ransomware Headwinds, and Threat Exposure
        blocks:
          - type: paragraph
            body: >-
              Dragos operates in an increasingly volatile industrial threat landscape characterized by aggressive
              double-extortion ransomware and nation-state reconnaissance against critical infrastructure supply chains.
              In its Q1 2026 industrial ransomware analysis, Dragos recorded 1,020 ransomware incidents worldwide
              impacting manufacturing (633 incidents), ICS engineering and equipment suppliers (139 incidents), and
              transportation logistics (87 incidents), led by RaaS syndicates including Qilin, Akira, and The Gentleman.
              While adversaries rarely manipulate industrial control protocols directly, enterprise IT compromises
              routinely cascade into operational shutdowns, production halts, and data extortion. For Dragos, this
              climate creates powerful procurement tailwinds but also imposes severe operational risks: client
              deployments carry zero-tolerance availability requirements, and any failure to detect lateral movement
              across converged IT/OT boundaries or third-party engineering access poses reputational exposure to the
              firm.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Significance of the 2026 Accenture Majority Acquisition
            body: >-
              The June 2026 transaction where Accenture agreed to acquire a majority stake in Dragos while absorbing
              runZero and NetRise represents a pivotal consolidation in operational technology cybersecurity. By
              combining Dragos's deep OT threat intelligence and passive inspection platform with runZero's
              attack-surface discovery and NetRise's firmware SBOM analysis under Robert M. Lee's leadership, the entity
              creates a comprehensive $208M ARR extended OT (xOT) defense provider backed by Accenture's global systems
              integration scale.
            calloutType: insight
            claimRefs:
              - CO010
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Operational technology (OT) cybersecurity encompasses purpose-built hardware, software, and professional
              incident response services designed to protect industrial control systems (ICS), supervisory control and
              data acquisition (SCADA) networks, and cyber-physical systems (CPS) against unauthorized access and
              operational disruption (CM001). The addressable perimeter covers Level 0 through Level 3 of the Purdue
              Enterprise Reference Architecture, including programmable logic controllers (PLCs), distributed control
              systems (DCS), remote terminal units (RTUs), and industrial human-machine interfaces (HMIs) (CM001,
              CM008). Traditional enterprise IT cybersecurity tools—such as active endpoint detection and response (EDR)
              scanners, routine patch orchestration agents, and corporate vulnerability assessment scanners—are
              explicitly excluded from safe deployment on native OT networks because active network probing can
              destabilize fragile industrial automation controllers and trigger catastrophic physical process halts
              (CM001, CM006). The core spend comprises passive network traffic inspection, specialized industrial
              protocol parsing (e.g., Modbus, DNP3, Ethernet/IP, PROFINET), OT-specific vulnerability prioritization,
              and continuous threat intelligence (CM001, CM008). Status quo substitutes remain heavily reliant on basic
              network air-gapping, manual spreadsheet-based asset inventories, static industrial firewalls, and general
              IT security platforms relabeled with basic operational marketing stickers (CM001, CM008). Enterprise IT
              security giants increasingly serve as distribution partners or SIEM/SOC integration hubs rather than
              direct physical process visibility replacements (CM001, CM007).
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
      - number: '2.2'
        title: Market Sizing, Growth Trajectory, and TAM/SAM/SOM Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the industrial cybersecurity market requires distinguishing between broad industrial digital
              security estimates and the serviceable market for specialized critical infrastructure OT platforms
              (CM002). Independent market research from Frost & Sullivan projected the global industrial cybersecurity
              market to expand from $3.3 billion in 2020 to $10.2 billion by 2025, reflecting a compound annual growth
              rate (CAGR) of 25.3% driven by accelerating infrastructure threat actor activity (CM002). Concurrently,
              Gartner established the cyber-physical systems (CPS) protection platform category to classify vendors
              capable of discovery, categorization, mapping, and protection of production and mission-critical
              environments outside enterprise IT (CM001). Dragos addresses this sector through the Dragos Platform,
              threat intelligence feeds, and incident response services, recording estimated annual revenue of
              approximately $96.6 million in 2026 with an estimated workforce of 529 to 877 employees (CM003, CM004).
              The overall funding environment for pure-play industrial security reached historic peaks following
              Dragos's $200 million Series D funding round at a $1.7 billion valuation in October 2021, supplemented by
              a $74 million Series D extension in September 2023, bringing cumulative financing to approximately $438
              million to $440 million (CM002, CM005, CM011). However, market sizing disclosures exhibit variance across
              intelligence providers, and private market ARR transparency remains limited, necessitating structured
              sizing layers across total addressable spend, serviceable focus segments, and obtainable vendor capture
              (CM002, CM003, CM012).
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Path
        blocks:
          - type: paragraph
            body: >-
              Adoption of OT cybersecurity solutions operates across distinct organizational hierarchies spanning
              operational engineering teams, plant managers, corporate CISOs, and enterprise risk committees (CM006,
              CM007). In traditional infrastructure operators, operational technology is managed by VP of Operations,
              plant engineers, or SCADA directors whose core operational priority is uninterrupted system uptime and
              physical human safety (CM006, CM009). Conversely, cybersecurity budget ownership is increasingly shifting
              to corporate Chief Information Security Officers (CISOs) and Chief Information Officers (CIOs) tasked with
              mitigating corporate-wide cyber catastrophe risk and maintaining board-level governance (CM006, CM007). In
              municipal utilities and co-ops, supervising engineers and utility operations directors frequently initiate
              evaluations to resolve critical blind spots in regional grid or water infrastructure (CM007). In
              large-scale industrial conglomerates and brewing or manufacturing giants, corporate CISOs sponsor
              standardized platform procurements to eliminate operational blind spots across distributed plant
              facilities (CM007). Enterprise procurement workflows typically begin with passive architecture assessments
              or network visibility pilot deployments to establish baseline asset inventories without interrupting
              active controls (CM008, CM009). Full enterprise rollouts typically span 12 to 18 months, often utilizing
              IT/OT cloud marketplaces such as Microsoft Azure Sentinel integrations or systems integrator channels like
              Accenture and World Wide Technology for contract vehicle execution (CM001, CM007, CM009).
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Adoption Drivers, Operational Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption of specialized industrial cyber protection is accelerated by compounding adversary pressure and
              strict compliance mandates, but counterbalanced by structural plant constraints (CM006, CM009, CM010). In
              the first quarter of 2026, Dragos tracked 1,020 ransomware incidents affecting industrial organizations
              worldwide, with manufacturing accounting for 62% (633 incidents), ICS-related supply chain organizations
              accounting for 139 incidents, and transportation accounting for 87 incidents (CM010). Modern extortion
              campaigns systematically weaponize virtualization infrastructure, compromised administrative credentials,
              and enterprise IT pivots to force operational shutdowns even without executing specialized ICS payload
              code (CM010). Regulatory requirements—including NERC CIP standards in electric power, IEC 62443 industrial
              control standards, and national directives such as the U.S. National Cybersecurity Strategy—further compel
              operators to implement verifiable cyber controls (CM002, CM009). Despite strong demand tailwinds,
              significant adoption bottlenecks persist (CM009, CM012). Plant operations teams display resistance toward
              introducing network tooling near legacy controllers, citing potential disruption risks and scarce
              scheduled maintenance outage windows (CM009). Furthermore, public market sizing data exhibits substantial
              variance regarding exact pure-play OT software spend versus bundled integration services, while detailed
              customer count, churn rates, and contractual net revenue retention remain private, representing material
              diligence gaps (CM003, CM012).
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM009
              - CM010
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Divergence Between Operational Plant Priority and Enterprise IT Security Strategy
            body: >-
              A central structural challenge in the OT cybersecurity market is the operational divide between plant
              operators and enterprise IT security teams. Plant managers prioritize uninterrupted physical operations,
              determinism, and safety, viewing active IT scanning tools as direct operational hazards. Successful
              vendors must prove passive, non-intrusive network visibility before security teams can gain plant approval
              for broader deployments.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM008
          - type: callout
            title: Market Opacity Around Pure-Play Software ARR and Conversion Efficiency
            body: >-
              While market sizing reports cite double-digit growth and multi-billion-dollar market aggregates, available
              vendor scale data remains largely opaque. With Dragos's valuation pegged at $1.7 billion in 2021 and
              third-party estimated revenue hovering near $96.6 million in 2026, diligence requires verifying actual
              software ARR versus bundled professional services and incident response retainers.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is wider than purpose-built OT monitoring vendors. Dragos officially presents
              an xOT platform for asset inventory and network monitoring, while the reported addition of NetRise extends
              the scope toward software and firmware transparency. Those surfaces compete for a consolidated platform
              decision, but buyers can also assemble adjacent IT detection products, services partners, specialist
              tools, and internal response teams. An open-source cybersecurity AI framework placed sixth in Dragos's
              2025 OT CTF after solving 32 of 34 challenges, demonstrating that task-level automation is becoming a
              credible substitute for part of the analyst workflow rather than a complete platform substitute. Company
              product roles spanning MDR, XDR, threat intelligence, cloud delivery, and AI also signal that category
              boundaries are expanding. Crucially, none of the eight retained sources independently names and benchmarks
              Dragos against a direct purpose-built OT peer, so the direct-peer row remains an explicit evidence gap
              rather than a guessed comparison.
            claimRefs:
              - CP001
              - CP006
              - CP010
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
