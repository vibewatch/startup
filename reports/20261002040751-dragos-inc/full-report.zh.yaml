  - id: FE001
    title: Dragos 多层级 OT 网络安全平台架构
    type: stack
    summary: Dragos Platform 的结构层级，涵盖分布式采集、站点汇聚、集中管理及企业安全集成。
    data:
      layers:
        - label: 企业安全集成层
          detail: 与 FortiSIEM、FortiGate NGFW、Microsoft Sentinel 及企业 SOC 工具开展 API 驱动的遥测转发与策略编排。
        - label: 集中管理与情报层
          detail: Dragos CentralStore（硬件、虚拟化或云端 SaaS）最多可管理 50 个 SiteStore；分发包含威胁行为分析与排查手册的 Knowledge Pack。
        - label: 站点汇聚与分析层
          detail: Dragos SiteStore 设备（STS-550-E / 虚拟化 / 云端）可汇聚高达 20 Gbps 流量并监控 500,000 个资产；内置历史上下文数据库与本地控制台。
        - label: 分布式遥测与采集层
          detail: >-
            被动式 Dragos Sensor（从加固型 DIN 导轨 NS-25-DR 到 10 Gbps 的 NS-2050-E）通过 DPI 解码 600+ 种协议，在 Windows 终端上部署安全的 Dragos
            Agent，并支持离线工程项目文件导入器。
        - label: 工业物理与网络工艺层
          detail: 运营技术终端，涵盖 0/1 级现场控制器、RTU、PLC、安全仪表系统（SIS）以及 2/3 级监控控制环路。
        - label: 外部威胁情报与攻击者追踪
          detail: Dragos 威胁分析师开展持续研究，追踪对手活动组织（CHERNOVITE、ELECTRUM）及工业勒索软件攻击活动。
    approximationNotes: 反映了厂商技术规格书中所述的功能架构拓扑与通信层级。
