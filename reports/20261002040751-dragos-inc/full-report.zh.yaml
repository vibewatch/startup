    title: 公司发展里程碑时间线
    type: timeline
    summary: Dragos, Inc. 发展历程中的核心公司治理、融资、运营及战略里程碑。
    data:
      items:
        - date: '2016-01-01'
          label: Dragos, Inc. 成立
          detail: 由前 NSA 网络战专家 Robert M. Lee、Justin Cavinee 和 Jon Lavender 在马里兰州创立，旨在保护工业控制系统。
          tone: neutral
        - date: '2021-09-30'
          label: 平台经常性收入里程碑
          detail: 截至 2021 年底，平台经常性收入实现超过 100% 的同比增长。
          tone: positive
        - date: '2021-10-28'
          label: Series D 融资（$200M，估值 $1.7B）
