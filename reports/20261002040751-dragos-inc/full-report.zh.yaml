  - id: TE003
    title: 运行架构与部署硬件规格
    columns:
      - 架构组件
      - 硬件形态与运行模式
      - 定位与吞吐量规格
      - 上下游依赖
      - 运维与可靠性风险
    rows:
      - - 加固型传感器（NS-25-DR）
        - DIN 导轨 / 壁挂式硬件设备；无风扇设计；工作温度 -40°C 至 70°C
        - 最多监控 1,000 处资产、1,250 条流、25 Mbps 带宽；通过 IEC 61850-3 与 IEEE 1613 认证
        - 需物理网络分路器（TAP）或镜像端口（SPAN）；向本地 SiteStore 输送遥测数据
        - 持续带宽吞吐受限（25 Mbps），仅适合部署在低吞吐量的变电站间隔单元
      - - 高容量传感器（NS-2050-E）
        - 2U 机架式硬件设备；双 1400W 热插拔冗余电源
        - 最多监控 1,000,000 处资产、300,000 条并发流、10 Gbps 持续带宽
        - 高速 10GbE 网络 TAP 流量聚合；向上一级 SiteStore 集群输送数据
        - 功耗较高（峰值 742W，发热量 2531 BTU/hr），且需要恒温恒湿的数据中心机房环境
      - - 虚拟传感器（NS-VM 系列）
        - 支持 VMware ESXi、vSphere、Proxmox VE、KVM/QEMU、Hyper-V、Nutanix 等虚拟化平台
        - 弹性支持从 250 处资产 / 25 Mbps（4 vCPU、8GB 内存）到 10,000 处资产 / 1 Gbps（12 vCPU、22GB 内存）
        - 虚拟化工业宿主机；虚拟交换机端口镜像
        - 需配置虚拟交换机混杂模式；宿主机 CPU 抢占时存在丢包风险
      - - Dragos Agent（主动采集）
        - 轻量级可执行软件，运行于 Windows（LTSC、7 SP2+、10、11）；1 vCPU、512MB 内存
        - 安全的主动终端查询，采集操作系统、固件、补丁与本地外设详情
        - 本地部署于 Windows HMI 与工程师站；向 SiteStore 上报数据
        - 仅限 Windows 系统终端；无法在嵌入式 Linux、RTOS 或专有固件设备上运行
      - - SiteStore 设备（STS-550-E）
        - 1U 机架式硬件设备；双 1100W 热插拔冗余电源
        - 聚合高达 20 Gbps 的传感器流量，最多监控 500,000 处资产
        - 聚合分布式传感器；向企业级 CentralStore 输送数据
        - 若未部署双机冗余集群，会成为区域级单点故障源
      - - CentralStore 管理节点
