        title: 对价格敏感的投资决策
        blocks:
          - type: paragraph
            body: >-
              适宜的投资建议为继续研究（research-more），对当前任何估值的信心度均为低，投资判断风险评级为高。这并非对 Dragos
              的产品或市场持否定态度，而是拒绝将稀疏且统计口径不一的公开数据转化为虚假精度。现有审阅证据中完全缺少当前入场价格、证券类别、持股比例、清算优先权堆叠、经审计收入、ARR、留存率、利润率、烧钱速度及现金余额。所检索到的
              Nasdaq Private Market 文本仅包含通用平台披露，没有可审计的 Dragos
              报价或交易记录，而第三方交易数据源针对其交易状态与价值的评估也存在分歧。缺少这些输入，既无法测算目标回报率，也无法给出站得住脚的独立估值区间。在虚拟数据室（data
              room）明确价格、投资工具、财务基线与退出收益测算之前，不应投入资金。
