  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类体系与支出范畴
        blocks:
          - type: paragraph
            body: >-
              运营技术（OT）网络安全涵盖专用硬件、软件以及专业应急响应服务，旨在保护工业控制系统（ICS）、数据采集与监视控制（SCADA）网络以及信息物理系统（CPS）免遭未授权访问和业务中断（CM001）。其有效覆盖边界涵盖普渡企业参考架构（Purdue
              Model）的 Level 0 至 Level 3，包括可编程逻辑控制器（PLC）、分布式控制系统（DCS）、远程终端单元（RTU）与工业人机界面（HMI）（CM001，CM008）。传统企业 IT
              网络安全工具——例如主动端点检测与响应（EDR）扫描器、例行补丁编排代理以及企业级漏洞评估扫描工具——被明确排除在原生 OT
              网络的安全部署之外，原因在于主动网络探测会破坏脆弱工业自动化控制器的稳定性，诱发灾难性的物理生产停摆（CM001，CM006）。核心支出由被动网络流量监测、专用工业协议解析（如
              Modbus、DNP3、Ethernet/IP、PROFINET）、专用于 OT
              的漏洞优先级排序以及持续威胁情报构成（CM001，CM008）。现状替代方案仍高度依赖基础网络物理隔离、手工电子表格资产台账、静态工业防火墙以及贴有基础运营营销标签的通用 IT
              安全平台（CM001，CM008）。大型企业 IT 安全巨头日益倾向于扮演分销合作伙伴或 SIEM/SOC 集成中枢，而非直接提供物理生产流程可见性的替代方案（CM001，CM007）。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
      - number: '2.2'
        title: 市场规模测算、增长轨迹与 TAM/SAM/SOM 视角
        blocks:
          - type: paragraph
            body: >-
              评估工业网络安全市场需要区分宽口径的工业数字化安全预估，与关键基础设施专业 OT 平台的可服务市场（CM002）。独立研究机构 Frost & Sullivan
              预测，受基础设施威胁主体活动加剧驱动，全球工业网络安全市场规模将从 2020 年的 $3.3 billion 扩张至 2025 年的 $10.2 billion，复合年均增长率（CAGR）达到
              25.3%（CM002）。与此同时，Gartner 设立了信息物理系统（CPS）保护平台品类，界定能够在企业传统 IT 之外发现、分类、映射并防护生产及关键任务环境的厂商（CM001）。Dragos 依托
              Dragos Platform、威胁情报源和应急响应服务切入该赛道，2026 年预估年收入约为 $96.6 million，预估员工规模为 529 至 877 人（CM003，CM004）。2021 年 10 月
              Dragos 按 $1.7 billion 估值完成 $200 million 的 D 轮融资，并在 2023 年 9 月完成 $74 million 的 D 轮追加融资，使累计融资金额达到约 $438
              million 至 $440 million，推动纯工业安全领域的整体融资环境触及历史峰值（CM002，CM005，CM011）。然而，各家调研机构披露的市场规模数据存在差异，且一级市场的 ARR
              透明度依然有限，因此需要从总可用支出、可服务细分领域以及厂商可获取份额建立结构化测算分层（CM002，CM003，CM012）。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
