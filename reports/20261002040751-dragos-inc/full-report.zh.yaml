        title: 附录图表
        blocks:
          - type: callout
            title: 无定价不予入场
            body: >-
              Dragos
              或许具备战略价值，但新投资者若不掌握当前价格、证券类别、经审计的运营底数、优先权清算分配以及确切的交易对价，便无法进行回报判断。在上述事项完成核对前，维持继续研究（research-more）的投资建议。
            calloutType: recommendation
