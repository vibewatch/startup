  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 运营模式、数据采集方式与规模化架构
        blocks:
          - type: paragraph
            body: >-
              Dragos Platform
              的核心架构设计哲学，立足于在不干扰脆弱物理自动化流程的前提下，实现对工业控制系统与运营技术（ICS/OT）网络安全、确定性的全量可见。工业生产环境——涵盖变电站、炼油厂、水处理厂以及离散制造设施——充斥着脆弱的可编程逻辑控制器（PLC）、远程终端单元（RTU）与安全仪表系统（SIS），这些设备根本无法承受常规
              IT 漏洞扫描工具或高频主动轮询的冲击。针对这一现实约束，Dragos
              构建了分层多源遥测架构，涵盖分布式被动网络监控传感器、基于主机的定向主动采集代理、工程项目文件导入工具，以及本地数据汇聚节点（SiteStore 与 CentralStore）。


              被动监测依托网络分流器（TAP）或交换机镜像端口（SPAN/mirror）实现无干扰运行。Dragos 硬件与虚拟传感器利用深度数据包检测（DPI）实时分析生产网络通信，能够解析并解码超过 600
              种专有及开放工业协议，包括 Modbus、DNP3、EtherNet/IP、IEC 61850 与 PROFINET。鉴于被动监测无法察觉未监测网段上的终端或通信频次极低的设备，Dragos
              引入轻量安全的主动采集程序作为补充。轻量级 Dragos Agent 直接部署在基于 Windows
              的人机界面（HMI）和工程师工作站上，负责采集本地主机配置、已安装补丁、固件版本与外设连接信息，全程不会向工控回路注入任何破坏性探测数据包。工程项目文件导入功能则进一步摄取特定控制厂商的逻辑文件，离线解析控制器
              I/O 机架排布与逻辑组态。


              本地传感器采集的遥测数据向上汇总至 Dragos SiteStore（STS-550-E 硬件或虚拟 STS 设备），实现跨传感器资产台账、漏洞映射与检测遥测数据的汇聚。单台硬件 SiteStore
              能够承载传感器回传的遥测数据，监控总计高达 20 Gbps 的工业网络流量，并追踪多达 500,000 个工业资产。面向管理跨地域公用设施或多厂区制造资产的企业级关键基础设施运营商，Dragos
              CentralStore 实例可聚合多达 50 个独立的 SiteStore，提供集中式运维控制台，用于全网统一查询、多厂区综合看板展示以及协同事件调查。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
