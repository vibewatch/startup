            body: >-
              既有证据表明客户面临的合规义务正在增加，而非 Dragos 自身的特定合规情况。NCC Group 指出 NIS2 与欧盟《网络弹性法案》（EU Cyber Resilience
              Act）属于关键基础设施客户相关的监管框架，并指出违规可能招致重大处罚。Dragos
              所服务的业务环境对可用性、完整性、安全性及取证溯源能力的要求往往高于普通数据恢复。这些条件带来了重大的产品保障、合同约定、通报义务及专业服务风险敞口，但证据池中没有监管申报文件、诉讼记录、审计意见、认证名录或经核实的
              Dragos 安全事件通告。因此，现有法律记录只是一张局部风险图谱，不能证明存在既有违规。弥补该缺口需要获取经律师确认的诉讼与执法事项清单、各司法管辖区的产品合规梳理、保险条款以及历史事件通报记录。
