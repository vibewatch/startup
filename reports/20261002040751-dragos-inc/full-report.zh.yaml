      - number: '8.4'
        title: 退出证据与最终尽调诉求
        blocks:
          - type: paragraph
            body: >-
              公开证据表明存在战略买方兴趣，但无法证明新投资者能够实现已完成且明确定价的退出。据 YesPress 报道，Accenture 于 2026 年 6 月达成的收购 Dragos
              多数股权协议仍须满足交割条件，并指出 $4.175 billion 的企业价值涵盖了三笔交易（包括全资收购 runZero 和 NetRise），而非仅针对 Dragos 单家公司。相比之下，Preqin
              的预览数据将 Dragos 标记为已收购，并将 $3.25 billion
              归于该笔交易。既有记录中未包含发行主体、证券工具、企业价值至股权价值调节表、收购股权比例、收益分配方案、股权滚存以及交割证明。最终尽调必须获取已签署的交易文件、当前股权结构表与优先权清算分配表、经审计财务报表、ARR
              勾稽核对表、客户队列留存率、软件与服务的分类毛利率、烧钱速度、现金、负债以及管理层在交易完成后的运营规划。交割失败、客户留存疲软或收益分配过度向优先股倾斜，均将打破可投资逻辑。
