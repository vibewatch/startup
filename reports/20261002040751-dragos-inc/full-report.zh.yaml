      - number: '1.3'
        title: 融资历史、投资人阵容与控股收购
        blocks:
          - type: paragraph
            body: >-
              Dragos 的资产负债表扩张历程展现了能源、国防与工业自动化领域雄厚的战略及机构资本背书。2021 年 10 月，公司完成标志性的 $200M 的 D 轮融资，由 Koch Disruptive
              Technologies 与 BlackRock 旗下基金联合领投，确立了 $1.7B 的一级市场估值。公司历经 9 轮融资，风险投资总额达到 $364M 至 $438M，投资方涵盖 Canaan
              Partners、AllegisCyber Capital、Energy Impact Partners 和 DataTribe 等机构风投，以及 Emerson、Rockwell
              Automation、Hewlett Packard Enterprise、National Grid Partners、Schweitzer Engineering Laboratories 与 Aramco
              Ventures 等战略产业投资方。2026 年 6 月，Accenture 签署最终协议，收购 Dragos 的控股权以及 runZero 和 NetRise 的 100% 股权，总企业价值约为
              $4.175B，其中 Dragos 的独立交易价值预计为 $3.25B，印证了专业工业网络安全资产所享有的高额战略溢价。
            claimRefs:
