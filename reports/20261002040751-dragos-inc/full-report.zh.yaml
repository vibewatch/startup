      - number: '7.2'
        title: 运营与技术执行风险
        blocks:
          - type: paragraph
            body: >-
              核心执行风险在于，OT 应急响应绝不能简单照搬企业 IT 流程。Dragos 警告称，传统 IT
              响应工具在工业环境中可能收效甚微甚至极其危险，而专业人手不足、运营商控制权限制、老旧资产、专有数据源以及各厂商专有日志，都显著增加了调查难度。Dragos 过往的服务交付经验印证了这一难题：其 2021
              年的回顾报告指出，在相当大比例的交付案例中，均存在 OT 可见性受限、外部网络连接、共用凭证以及网络划分不当等问题。Dragos 在 2025
              年财务风险报告中指出，应急响应预案、架构设计、日常监控、远程访问与漏洞管理属于相辅相成的组合防御控制，而非单一万灵药。因此，投资尽调应当重点验证初筛排查时间、事件遏制时间、误报负担、专家团队覆盖率以及事后客户恢复成效，绝不可仅凭市场需求强劲就推断其韧性无虞。
