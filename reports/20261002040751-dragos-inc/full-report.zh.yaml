  - id: TV003
    title: 乐观、基准与悲观决策情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发条件或确认信号
    rows:
      - - 乐观
        - 报道的交易顺利交割；独立对价、清晰的清算优先权条款、经审计的经常性收入、留存率和利润率足以支撑估值溢价
        - 在将 $3.25B 的报道金额与所购股权、负债、现金及优先股条款完全核对一致前，无法给出具体量化的回报区间
        - 公开交易描述存在冲突，因此上行信号置信度较低
        - 确认已签署的交割文件及经审计的运营指标
      - - 基准
        - 战略买家的兴趣确实存在，但当前对价与独立经营财务数据依然未公开
        - 将 2021 年 $1.7B 估值及约 11.0x 预估收入倍数视作背景参考，而非当前公允价值
        - 与现有证据最为契合；投资建议维持继续研究
        - 通过数据室明确交易范围、证券类别及财务基线
      - - 悲观
        - 交割延迟或失败，报道的交易价值不能归属于 Dragos 普通股，或经营业绩低于企业黄页预估
        - 因累计融资额未揭示实际现金且优先股分配瀑布流未知，下行风险无法确定底线
        - 在核心条款与经审计指标缺失的情况下，存在重大下行信号
        - 交易流产、现金跑道过短、客户留存疲软，或优先股瓜分普通股退出收益
    notes: 此类情景属于条件化尽调推演而非预测；所分配的公开证据不足以支撑概率百分比、当前公允价值区间或目标回报率。
    claimRefs:
      - CV003
      - CV006
