      - number: '2.4'
        title: 采纳驱动力、运营约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              外部威胁压力叠加与严格合规要求加速了专业工业网络安全防护的落地，但同时也受到厂区结构性约束的制约（CM006，CM009，CM010）。2026 年第一季度，Dragos 追踪到全球波及工业组织的 1,020
              起勒索软件事件，其中制造业占比达 62%（633 起），ICS 相关供应链组织发生 139 起，交通运输领域发生 87 起（CM010）。现代勒索攻击已能够系统性利用虚拟化基础设施、被盗管理员凭证以及企业 IT
              跳板，即使不执行专门针对 ICS 的有效载荷代码，也能迫使工业生产陷入停顿（CM010）。电力行业的 NERC CIP 标准、工控领域的 IEC 62443
              标准，以及《美国国家网络安全战略》等国家级指令，进一步促使运营商落实可验证的网络安全控制措施（CM002，CM009）。尽管需求端顺风强劲，但严重的落地瓶颈依然存在（CM009，CM012）。由于担忧潜在干扰风险且计划内检修停工窗口极度稀缺，厂区运维团队对在老旧控制器附近引入网络工具抱有抵触情绪（CM009）。此外，针对纯
              OT 软件支出与打包集成服务的具体切分，公开市场规模测算数据分歧显著；详细客户数、流失率以及合同净留存率（NRR）仍属非公开信息，构成了实质性的尽调缺口（CM003，CM012）。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM009
              - CM010
              - CM012
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 厂区运营优先级与企业 IT 安全战略的分歧
            body: >-
              OT 网络安全市场的核心结构性挑战，在于厂区运维人员与企业 IT 安全团队之间的运营分歧。厂区经理优先保证物理生产不中断、系统确定性与人身安全，将主动式 IT
              扫描工具视作直接的运营隐患。厂商唯有证明自身具备被动且无干扰的网络可见性能力，安全团队才可能获得厂区审批，进而推进更广泛的部署。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM008
          - type: callout
            title: 纯软件 ARR 与转化效率的市场不透明性
            body: >-
              尽管市场规模测算报告指出了双位数增长和数十亿美元的市场总量，但各厂商的实际业务体量在很大程度上仍不透明。Dragos 估值在 2021 年达到 $1.7 billion，第三方预估 2026 年收入徘徊在
              $96.6 million 附近，尽调必须核实纯软件 ARR 与打包专业服务及应急响应常年服务费之间的具体构成。
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关的竞争范畴并不局限于专用的 OT 监控厂商。Dragos 官方将自身定位于涵盖资产台账与网络监控的 xOT 平台，而据报道纳入 NetRise
              则进一步将防护范围拓展至软件与固件透明度。这些能力共同争夺客户的统一平台采购决策，但买方同样可以选择拼凑相邻的 IT 检测产品、服务合作伙伴、专业点工具以及内部响应团队。在 Dragos 举办的 2025 年
              OT CTF 攻防赛中，某开源网络安全 AI 框架解出 34 道题中的 32 道并位列第六，说明任务级自动化已经能替代分析师工作流中的一部分，但还替代不了完整平台。公司覆盖 MDR、XDR、威胁情报、云端交付与
              AI 的产品角色也显示品类边界正在扩张。关键在于，所收录的 8 份来源中，没有任何一家独立点名并将 Dragos 与专用 OT 直接竞品横向对标，因此直接竞品行仍属于明确的证据缺口，而非随意揣测的对比。
