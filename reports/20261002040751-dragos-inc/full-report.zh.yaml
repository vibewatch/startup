      - number: '1.4'
        title: 运营环境、勒索软件逆风与威胁暴露面
        blocks:
          - type: paragraph
            body: >-
              Dragos 所处的工业威胁环境动荡加剧，其特征是针对关键基础设施供应链的激进双重勒索与国家级侦察行动。在 2026 年 Q1 的工业勒索软件分析中，Dragos 记录了全球 1,020
              起勒索软件事件，受波及领域包括制造业（633 起）、ICS 工程与设备供应商（139 起）以及交通物流（87 起），主要由 Qilin、Akira 和 The Gentleman 等 RaaS
              团伙发起。虽然攻击者极少直接篡改工业控制协议，但企业级 IT 系统沦陷往往会级联引发业务停摆、产线停工与数据勒索。对 Dragos
              而言，这一局面既带来了强劲的采购催化剂，也构成了严峻的运营挑战：客户对部署环境的可用性实行零容忍，一旦未能检测出跨越 IT/OT 融合边界的横向移动或第三方工程访问，公司都将承受巨大的声誉风险。
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 2026 年 Accenture 控股收购的战略意义
            body: >-
              2026 年 6 月，Accenture 达成收购 Dragos 多数股权并同时吸纳 runZero 与 NetRise 的交易，标志着运营技术网络安全领域的一次关键整合。在 Robert M. Lee
              的领导下，新主体将 Dragos 深厚的 OT 威胁情报及被动监测平台，与 runZero 的攻击面发现能力、NetRise 的固件 SBOM 分析能力深度融合，并依托 Accenture
              全球系统集成的业务规模，打造了一家年经常性收入达到 $208M ARR 的综合性扩展运营技术（xOT）防御厂商。
