      - number: '3.3'
        title: 定价、切换成本与渠道话语权
        blocks:
          - type: paragraph
            body: >-
              所收录的资料均未披露 Dragos
              当前的公开目录价格、实际合同金额、折扣幅度或可直接比对的竞品定价。由此产生的投资判断缺口十分关键，因为产品平台宽度并不能证明价格竞争力或业务扩张经济性。从定性维度看，切换成本相对更明确：规划中的统一门户、中央
              API、设备群管理、权限体系以及混合接口，将把客户工作流与订阅集中在单一控制平面内。与此同时，Dragos 借助 Accenture 的治理与集成、Microsoft Azure Marketplace 与
              Sentinel，以及 World Wide Technology 的专业服务来拓展分销渠道。这些路径能够降低采纳摩擦，让客户在保留既有设施的基础上叠置
              Dragos，而非全盘替换控制系统；但这也让强势合作伙伴在实施交付、客户触达及周边架构上掌握了主导权。Dragos 历史上 $364.2 million 的融资总额与 2021 年 $1.7 billion
