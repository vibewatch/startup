      - number: '5.2'
        title: 平台核心能力、威胁行为分析与漏洞分级治理
        blocks:
          - type: paragraph
            body: >-
              Dragos Platform 依托四大核心功能落地工业网络防御：持续资产识别、威胁行为检测、基于风险的漏洞管理以及引导式安全事件调查。传统 IT
              入侵检测系统主要依赖通用异常检测，当批量生产批次切换或工艺运行参数调整时，在工业环境中极易引发大面积告警疲劳；Dragos
              则截然不同，将威胁行为分析确立为核心检测方法。该分析方法能够刻画在真实关键基础设施攻击中观察到的攻击者具体战术、技术与流程（TTP）。


              Dragos 定期分发 Knowledge Packs，直接将威胁情报固化为可执行的平台检测逻辑。Knowledge Packs 由 Dragos
              威胁情报分析师研究编译，为平台注入检测规则、协议解包解析器、资产特征识别算法，以及专门针对 CHERNOVITE、ELECTRUM
              等重点工控威胁组织的逐步排查处置手册。告警触发时，平台向安全分析师提供详尽的工控生产上下文、受影响控制系统资产角色以及预编排的处置工作流，旨在最大程度压缩平均恢复时间（MTTR）。


              在工业漏洞管理维度，Dragos 摒弃了直接套用通用漏洞评分系统（CVSS）的做法——后者在物理隔离或严格分区的 OT 网络中往往会虚高危险等级——转而采用独创的 Now, Next, Never
              分级模型。平台分析显示，披露的工业漏洞中仅有 3% 至 6%
              构成具备网络可达性、可被武器化且需立即处置的实际生产威胁（“Now”），而绝大多数漏洞缺乏网络可达性或生产冲击，可在计划停机维护时修复（“Next”）或安全放宽优先级（“Never”）。这种优先级排序有效避免了工业企业为了非关键软件补丁而盲目停摆核心生产设备的风险。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE001
