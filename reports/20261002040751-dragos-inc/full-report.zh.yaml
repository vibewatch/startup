            body: >-
              Dragos 报告称其在 2026 年 Q1 监测到 1,020 起工业勒索软件事件，包括 633 家制造业受害者，占其观察总数的
              62%。该数据集为公司单方口径，源自受害者公开披露以及勒索软件团伙的泄密网站，因此统计的是已观察到的公开案例，而非全部事件总量。尽管如此，NCC Group 在其 Q3
              威胁情报数据中同样指出，工业企业占到了勒索攻击事件的 30%。综合来看，Dragos 客户面对的威胁环境发生概率很高；而 Dragos 自身指出的“普通企业系统沦陷可级联引发 OT
              瘫痪”这一结论，使得响应处置质量成为影响巨大的运营与声誉风险。因此，热力图根据引述的发生频次、后果严重程度以及证据缺口做定性分类归位，而非给出缺乏依据的数字概率。
