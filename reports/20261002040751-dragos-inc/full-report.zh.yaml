      - number: '3.2'
        title: 能力差异化与交付姿态
        blocks:
          - type: paragraph
            body: >-
              目前最有证据支持的差异化来自工业环境工作流，而不是已验证的技术领先评分。Dragos 声称，其优先级模型会把处置范围收窄到最关键的 3-6% 漏洞，并把已识别威胁接上响应剧本和专家级 xOT 见解。Dragos
              的应急响应白皮书解释了通用企业剧本为何可能不适用于传统老旧 OT：系统缺少技术支持、流程脆弱、备份缺失且端点遥测有限，常规修复因此变得极不安全。公司发布的招聘信息还描述了一套统一客户体验规划，拟用中央 API
              连接 SaaS、本地部署和机器集成，减少情报、服务、AI 与文档之间的割裂。这些是有意义的产品设计信号，但仍是公司口径，不是独立第三方的性能证据。Dragos 发布的 2026 年 Q1 勒索软件分析进一步说明
              IT 到 OT 的上下文打通很重要，但其 1,020 起事件来自受害者公开披露和数据泄露网站发帖，并非完整市场普查。
