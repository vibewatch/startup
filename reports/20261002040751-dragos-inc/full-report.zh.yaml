      - number: '2.3'
        title: 买方画像、预算归属与采购链路
        blocks:
          - type: paragraph
            body: >-
              OT 网络安全解决方案的采纳涉及跨越多个组织层级的决策，涵盖运营工程团队、厂区负责人、集团 CISO 以及企业风险委员会（CM006，CM007）。在传统基础设施运营商中，运营技术通常由运营副总裁、厂区工程师或
              SCADA
              总监主管，其核心考量是系统连续运行与人身安全（CM006，CM009）。与此相对，网络安全预算的掌控权正加速向企业首席信息安全官（CISO）与首席信息官（CIO）集中，后者的职责在于化解全集团范围的灾难性网络风险并落实董事会层面的治理合规（CM006，CM007）。在市政公用事业及公用合作社中，主管工程师与公用事业运营总监通常会主动发起技术评估，以消除区域电网或供水设施中的重大盲区（CM007）。在大型工业集团、酿酒或制造巨头中，集团
              CISO
              则主导标准化平台采购，消除分布于各厂区间的运营盲点（CM007）。大型企业采购流程通常始于被动架构评估或网络可见性试点部署，在不干扰现行控制系统的前提下建立基础资产台账（CM008，CM009）。企业级全面推广通常耗时
              12 至 18 个月，往往借助 IT/OT 云市场（例如 Microsoft Azure Sentinel 集成）或 Accenture、World Wide Technology
              等系统集成商渠道签订合同并推进落地（CM001，CM007，CM009）。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
