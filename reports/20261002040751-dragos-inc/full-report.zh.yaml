        blocks:
          - type: paragraph
            body: >-
              最明确的融资锚点是 Dragos 于 2023 年 9 月发布的公告：一笔 $74 million 的 D 轮追加融资使该轮总额增至 $274 million，累计融资金额达到约 $440
              million。另据独立报道记载，2021 年最初的 $200 million D 轮融资对应估值为 $1.7 billion。两者皆为历史交易事实，不能证明当下的可用现金或普通股股权价值。Growjo
              当前显示其估计年收入为 $154.4 million，估值为 $1.7 billion；将这两项目录数据相除得出约 11.0x 估计收入倍数。该测算明确不属于 ARR
              倍数，且所检索页面中两项数据均未经审计亦无明确日期。这恰恰说明了公开证据为何无法支撑当前的定价决策，更谈不上提供有效定价。
