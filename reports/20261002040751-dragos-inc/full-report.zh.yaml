      - number: '1.2'
        title: 创始人团队、高管阵容与治理架构
        blocks:
          - type: paragraph
            body: >-
              Dragos 由前美国国家安全局（NSA）网络行动人员 Robert M. Lee、Justin Cavinee 与 Jon Lavender
              联合创立。几位创始人在调查多起重大工业安全事件（尤其是乌克兰电网遭遇的网络攻击）后创立了该公司。Robert M. Lee
              出任首席执行官，主导管理层战略、产品愿景与政府关系，并在国家级关键基础设施政策论坛上保持着极高的公开影响力。高管团队兼具商业化规模扩张经验与专业工业情报能力，并由亚太区副总裁 Hayley
              Turner、日本区总经理 Kaori Nieda 等区域负责人提供支持。根据正在推进中的 2026 年 6 月 Accenture 控股收购架构，Dragos 将继续作为由 Lee
              领导的独立业务单元运营，同时将 runZero 和 NetRise 纳入麾下，整合攻击面情报与固件软件物料清单（SBOM）能力，构建统一的扩展运营技术（xOT）防御平台。
            claimRefs:
