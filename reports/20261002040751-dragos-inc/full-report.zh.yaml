chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、运营版图与战略使命
        blocks:
          - type: paragraph
            body: >-
              Dragos, Inc. 是一家专注于运营技术（OT）与工业控制系统（ICS）的网络安全软件及服务提供商，于 2016
              年成立，总部设在马里兰州汉诺威。公司的核心定位聚焦于工业防御使命：保护物理基础设施——涵盖输电网络、油气管线、供水管网与离散制造设施——抵御国家级黑客组织与网络勒索团伙。传统 IT
              安全平台主要依赖终端代理或企业事件日志，Dragos 则截然不同，提供专为信息物理系统打造的专业网络监控、被动协议检测、资产发现、基于 Now-Next-Never 模型的漏洞优先级排序以及体系化威胁情报。截至
              2026 年，Dragos 业务遍及北美、EMEA 与亚太地区，在全球拥有约 580 名员工，除汉诺威总部外，还在英国、澳大利亚、新西兰、中东与日本设有区域办事处。
