      - number: '5.4'
        title: 图表
        blocks:
          - type: callout
            title: 架构取舍：被动监测的可见性边界
            body: >-
              Dragos
              坚持被动无干扰网络监控的底层设计理念，是在关键任务生产环境中的最大立足之本，确保了绝不扰动脆弱工控流程的零风险底线。但这一设计本身也构成了天然的可见性天花板：除非部署了物理分流器（TAP）或专用的主动采集代理，否则被动传感器无法察觉未监测的交换机端口、低流量串行总线（RS-232/485）或物理隔离的
              Level 0/1 执行机构。
            calloutType: insight
            claimRefs:
              - CE002
              - CE004
          - type: callout
            title: 企业 IT 融合与专业 OT 检测的博弈
            body: >-
              随着勒索组织越来越频繁地利用通用 IT 突破口（如远程访问 VPN、泄露的管理员凭证及虚拟机管理平台漏洞），在不直接篡改原生 OT 协议的情况下间接瘫痪工业生产，Dragos 面临着捍卫更广泛 IT/OT
              边界暴露面的巨大压力。尽管与 Fortinet 及 Microsoft 的集成弥合了这一断层，但企业级 IT 安全套件正日益将 OT 视作一项功能模块，而非独立的采购品类。
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
