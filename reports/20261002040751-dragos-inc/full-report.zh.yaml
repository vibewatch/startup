      - number: '5.3'
        title: 集成生态、企业 SOC 协同与技术尽调风险
        blocks:
          - type: paragraph
            body: >-
              运营技术安全无法脱离企业级安全运营而孤立存在。              针对 IT/OT 融合需求，Dragos 依托认证的 API 集成方案，全面对接 Fortinet、Sophos、Microsoft
              Sentinel 以及 Splunk 等主流企业安全厂商。在与 Fortinet 的联合部署中，Dragos Platform 可将动态生成的资产画像与威胁告警直接同步至 FortiGate 下一代防火墙与
              FortiSIEM。防火墙读取 Dragos 的资产同步数据以填充动态地址组并执行微隔离策略，而企业安全运营中心（SOC）分析师无需登录专用的 OT 工程师控制台，即可在标准 SIEM 界面内监控工业威胁事件。


              尽管具备上述集成能力，技术尽调仍揭示了不可忽视的运维依赖与架构瓶颈。其硬件产品线涵盖符合变电站级加固标准的 DIN 导轨设备（通过 IEC 61850-3 与 IEEE 1613 认证的
              NS-25-DR），以及企业级机架式设备（处理能力高达 10 Gbps 与 300,000 流的 NS-2050-E）。然而，低功耗加固型传感器仅支持 25 Mbps 的持续带宽和最多 1,000
              个被监控资产，在占地庞大的工业园区中往往需要铺设大量硬件。此外，虚拟化部署对服务器计算和存储资源要求严苛——虚拟 CentralStore 实例最高需要 48 个虚拟 CPU 核心与 192 GB
              内存，这在缺乏现代化虚拟化集群的老旧工业厂区（brownfield）容易引发落地阻碍。


              从威胁格局审视，Dragos 的情报表明，虽然 Qilin、Akira 与 The Gentleman 等勒索组织频繁冲击制造和能源行业（2026 年 Q1 全球录得 1,020 起工业勒索事件，其中制造业占
              62%），但攻击者绝大多数经由沦陷的企业 IT 系统、远程访问 VPN 以及虚拟化基础设施渗透，而非直接篡改原生 ICS 协议。这一现实给 Dragos 带来了巨大的商业压力，迫使其跳出传统 OT 范畴，向包含
              IoT、IIoT 与企业边缘设备的扩展运营技术（xOT）延伸。最后，其在开发者与技术实务人员生态的开放度依然高度封闭：公司公开的开源资产严格局限于历史威胁指标（如 CRASHOVERRIDE 恶意软件
              IOC）以及极少数客户门户 SDK 封装包，本质上属于高度依赖自研专有威胁情报的封闭企业级生态。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
