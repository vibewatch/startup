        title: 采纳路径、增购空间与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Dragos 的商业化路径展现了在工业环境网络安全领域的稳步平台化扩张。一级市场追踪机构预计其 2024 年收入达到 $154.4M ARR，预估员工数为 566
              人（CU007，CU014）。其业务扩张遵循典型的“低门槛切入再增购（land-and-expand）”机制：客户最初采购 Dragos Platform，用于被动资产发现与基于“Now, Next,
              Never”框架的漏洞分级处置，随后逐步增购 Dragos Threat Intelligence、Neighborhood Keeper 协同防御网络、Dragos Academy
              按需培训以及专业应急响应常年服务（CU002，CU003，CU016）。然而，显著的尽调缺口依然存在：合同期限、总留存率（GRR）、净留存率（NRR）以及确切的成交客户数量仍属高度保密的企业内部数据，缺乏第三方审计。此外，尽管深化与
              Microsoft 的合作以及联合 Accenture、World Wide Technology 等系统集成商构建了可规模化推广的分销渠道，但也带来了渠道交易方集中度风险；一旦超大规模云厂商自研并强化原生 OT
              安全监控能力，公司的利润率将直接承压（CU004，CU005，CU006）。
