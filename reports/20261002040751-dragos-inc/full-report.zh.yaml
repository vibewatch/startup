            body: >-
              Dragos
              重点聚焦资产密集、生产运营依赖度高的关键基础设施行业，这些领域遭遇网络故障停机将面临灾难性的人身安全、环境或经济损失。核心垂直行业涵盖电力公用事业、石油与天然气开采及运输、重工制造、市政与区域供水系统、交通运输网络以及国防与政府设施（CU001，CU002，CU006）。在这些大型企业客户中，采购决策权通常横跨首席信息安全官（CISO）与运营技术副总裁、工程副总裁或厂区运营负责人（CU003）。历史上，在专有工业控制系统上铺设被动硬件网络传感器存在较大阻力，因而采购立项往往需要专门论证。不过，Dragos
