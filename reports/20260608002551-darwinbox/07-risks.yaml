  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: privacy-control-matrix
      missingEvidence: Country-by-country data-flow map, DPA template, sub-processor list, transfer mechanism, and breach-handling playbook for Darwinbox.
      whyItMatters: Public policy disclosure alone does not show whether Darwinbox can operationalize DPDPA, PDPA, and GDPR obligations across its actual footprint.
      diligencePath: Request privacy control matrix, customer DPA, sub-processor inventory, data-residency policy, and any regulator correspondence log.
      relatedQuestionRefs:
        - QR006
        - QR010
      relatedTableRefs:
        - TR001
    - type: access-blocked
      severity: material
      topic: uae-payroll-localization
      missingEvidence: Direct UAE WPS and labour-law texts plus Darwinbox's own country payroll design for Gulf markets.
      whyItMatters: The Gulf is part of Darwinbox's stated international footprint, but this run could not directly verify the primary statutory pages most relevant to payroll localization.
      diligencePath: Re-pull official UAE sources, obtain local counsel memo, and review Darwinbox country configuration and statutory-update ownership for the Gulf.
      relatedQuestionRefs:
        - QR011
      relatedTableRefs:
        - TR001
        - TR003
    - type: private-evidence-only
      severity: material
      topic: ai-governance-evidence
      missingEvidence: Model inventory, bias or validity test results, human-override design, security review, and incident history for Darwinbox AI features.
      whyItMatters: AI upside cannot be underwritten safely in HR workflows without direct evidence that model risk, bias, and safety are monitored in production.
      diligencePath: Request responsible-AI policy, model register, evaluation records, red-team outputs, and governance committee materials.
      relatedQuestionRefs:
        - QR014
        - QR015
        - QR016
      relatedTableRefs:
        - TR002
        - TR004
    - type: private-evidence-only
      severity: material
      topic: implementation-cohort-metrics
      missingEvidence: Planned-versus-actual implementation duration, migration defect rates, integration breakage frequency, and churn or renewal outcomes by deployment cohort.
      whyItMatters: Independent analogs show implementation failure can destroy value, but public evidence does not yet show whether Darwinbox's actual cohorts are outperforming or underperforming the market baseline.
      diligencePath: Request implementation dashboard, cohort-level deployment timelines, major rework incidents, reference calls, and support-ticket trend by account segment.
      relatedQuestionRefs:
        - QR018
        - QR019
        - QR022
      relatedTableRefs:
        - TR002
        - TR004
    - type: private-evidence-only
      severity: material
      topic: valuation-and-capital-allocation
      missingEvidence: Audited FY25 revenue or ARR evidence, cash-burn bridge, board rationale for the ESOP buyback, and explicit policy on secondary liquidity versus primary funding.
      whyItMatters: Capital access appears solid, but clean governance underwriting still requires seeing how cash reserves, employee liquidity, valuation signaling, and growth investment are balanced in practice.
      diligencePath: Request audited FY25 financials, board materials on buyback approval, runway model, and financing policy memo.
      relatedQuestionRefs:
        - QR026
        - QR027
        - QR028
        - QR029
      relatedTableRefs:
        - TR004
        - TR005
