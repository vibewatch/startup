callouts:
- calloutType: strength
  title: Subscription ARR trajectory is credible and approaching institutional scale
  body: Multiple independent sources corroborate the $100M ARR target for H2 2025, FY24 58% growth is well above public HCM comps, and international revenue now drives more than 60% of net new ARR. The multi-year enterprise SaaS model provides durable recurring revenue.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI006
- calloutType: risk
  title: Widening losses and undisclosed gross margin are the most critical diligence gaps
  body: Net losses widened to Rs 191.8 crore in FY24 with R&D at 45% of revenue and profitability explicitly deprioritized. Without audited gross margin data, the valuation multiple on the $950M secondary blended price cannot be independently justified.
  claimRefs:
  - CI011
  - CI013
  - CI015
  - CI016
- calloutType: recommendation
  title: Gross margin and primary-secondary split must be resolved before any capital allocation decision
  body: The five material diligence blockers — gross margin, primary-secondary split of 2025 rounds, full cost breakdown, NRR, and US market CAC/payback — are all resolvable through management data room access. None can be estimated reliably enough from public sources to underwrite the investment.
  claimRefs:
  - CI016
  - CI019
  - CI028
  - CI033
  - CI040
