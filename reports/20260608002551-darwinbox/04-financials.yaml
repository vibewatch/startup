  title: Financials
  summary: Darwinbox is a fast-growing HCM SaaS company with publicly confirmed FY24 revenue of Rs 392 crore (~$47M USD) and a target of $100M ARR by H2 2025. Revenue is predominantly subscription-based and shifting toward international markets. The company spent 45% of revenue on R&D in FY24, carries widening net losses (Rs 191.8 crore in FY24), and completed $180M in new equity in 2025. Capital appears adequate in the near term, but audited financial depth, gross margin, CAC/payback, and free cash flow remain private, creating material diligence gaps.
