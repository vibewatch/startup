- id: revenue-traction-and-arr-trajectory
  title: Revenue traction and ARR trajectory
  body: |
    Darwinbox's reported FY24 total revenue of Rs 392 crore (~$47M USD) represents 58% year-on-year growth and a 3.2x increase over two years [CI001]. A gap exists between ET and Entrackr figures: ET and Economic Times cite Rs 392 crore total revenue, while Entrackr reports Rs 333 crore in operating revenue (48% increase), suggesting the gap is likely non-operating income rather than a discrepancy in the underlying subscription business [CI014]. For FY25, Tracxn's MCA-sourced data shows Rs 534 crore (~$63M USD), implying approximately 36% growth for the fiscal year ending March 2025 [CI002]. GetLatka reports $100M revenue for calendar 2025, broadly consistent with the co-founder's $100M ARR target for H2 2025 [CI004].

    International markets are the primary driver of incremental growth. Management states that over 60% of new revenue now comes from international markets, international revenue grew 87% in FY24, and the company has achieved fivefold international revenue growth over two years [CI006]. North America has grown 3X year-on-year since market entry in 2023, and MENA grew 9X over three years, though both regions are starting from a smaller base than India and Southeast Asia [CI029]. Darwinbox targets enterprises with 3,000 or more employees and has stated revenue predictability and US scale are preconditions for an India-listed IPO [CI027][CI038].

    Darwinbox serves over 1,000 enterprises and 4 million employees across 130 countries as of mid-2025 [CI003]. The company's 3.6x headcount growth from 2021 to late 2025 is roughly consistent with its revenue growth rate, which suggests broadly stable revenue-per-employee productivity rather than deterioration [CI035]. The $100M ARR milestone, if confirmed for H2 2025, would represent a significant inflection from a revenue-quality perspective, as it crosses a common institutional threshold for SaaS capital markets readiness [CI003][CI038].
