  - Darwinbox approach
  - Available evidence
  - Competitor reference
  - Implication
  rows:
  - - Published list price
    - No public list price; quote-only for all tiers
    - SoftwareFinder and ITQlick confirm quote-only model
    - Deel publishes $599 EOR / $125 PEO; Rippling discloses PEPM logic; greytHR lists INR pricing
    - Quote-only increases sales friction but enables pricing flexibility for large accounts
  - - Estimated PEPM (standard enterprise)
    - ~$8–$10 PEPM per SoftwareFinder estimate
    - Third-party benchmark from SoftwareFinder; ITQlick rates cost as average
    - 'Workday: $34 PEPM published; Darwinbox implies 60–75% discount'
    - Significant upfront price advantage; must demonstrate comparable depth for buyer to switch
  - - Pricing basis
    - Per employee per month × active seats; contract covers all entitled modules
    - Consistent across review sources and company descriptions
    - All major HCM vendors use PEPM or similar structure
    - Predictable ARR growth tracks employee count increases automatically
  - - Multi-year discount
    - Likely 10–20% multi-year commitment discount; not disclosed
    - Standard enterprise SaaS practice; inferred from modular deal structure
    - SAP, Oracle, Workday all offer multi-year discounts but do not publish them
    - Multi-year lock-in improves NRR but also makes mid-contract cancellation expensive
  - - Enterprise vs SMB fit
    - Explicitly positioned for 3,000+ employee enterprises; smaller deployments are higher-cost on a per-unit basis
    - SoftwareFinder notes Darwinbox is best suited to mid-sized and large enterprise
    - BambooHR and greytHR serve SMB below 500 employees; Zoho People addresses global SMB
    - SMB fit is limited; pricing model and implementation complexity favor large enterprise
  - - Implementation / professional services fee
    - Not disclosed; estimated at 10–20% of first-year ACV
    - ITQlick notes customization, integration, and training add to TCO
    - Industry norm for enterprise HCM
    - Adds to total upfront cost; may reduce win rate against transparent-pricing competitors at initial pricing stage
  notes: Pricing figures are third-party estimates or public list prices from competitor sources; realized Darwinbox enterprise pricing is not disclosed and may differ materially from benchmarks.
