  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics-disclosure
    missingEvidence: Darwinbox does not publicly disclose gross margin, implementation/service mix, or module-level contribution margin. That leaves the public record unable to distinguish software-like economics from delivery-heavy economics.
    whyItMatters: Gross margin is one of the main variables separating a 6x forward multiple from a 10x forward multiple in HCM SaaS.
    diligencePath: Request audited FY25/FY26 gross margin split by platform, payroll, implementation, and support plus cohort-level contribution margin by geography.
    relatedTableRefs:
    - TV005
    - TV006
    relatedQuestionRefs:
    - QV012
    - QV029
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohort-quality
    missingEvidence: No public source in this chapter discloses NRR, GRR, logo churn, or cohort expansion by geography or customer size.
    whyItMatters: Retention quality determines whether Darwinbox deserves a premium to public trailing-revenue comps and whether a $100M ARR target is sticky or acquisition-led.
    diligencePath: Request NRR/GRR by year, logo churn, expansion/contraction waterfalls, and top-customer concentration by region and segment.
    relatedTableRefs:
    - TV005
    - TV006
    relatedQuestionRefs:
    - QV013
    - QV029
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: The public record does not reveal the full post-2025 cap table, preference stack, option pool, or the exact primary-secondary split in the March and August 2025 transactions.
    whyItMatters: Late-stage secondaries can mask common-equity economics and materially change effective investor entry value even if the headline valuation appears unchanged.
    diligencePath: Request full capitalization table, liquidation preference schedule, option pool details, and a precise primary vs secondary allocation by 2025 round.
    relatedTableRefs:
    - TV001
    - TV006
    - TV003
    relatedQuestionRefs:
    - QV029
    - QV030
    - QV031
  - type: private-evidence-only
    severity: material
    topic: audited-fy25-financials
    missingEvidence: The chapter-8 evidence set does not include full audited FY25 financial statements, cash balance, cash flow, or management guidance that reconciles rupee revenue with third-party USD database normalization.
    whyItMatters: Without audited FY25 statements, the fair-value range remains heavily assumption-driven and exit readiness cannot be judged confidently.
    diligencePath: Request audited FY25 and FY26 YTD statements, management bridge from local currency to USD reporting, and a board-approved budget/range for FY26 ARR and burn.
    relatedTableRefs:
    - TV002
    - TV004
    - TV006
    relatedQuestionRefs:
    - QV029
    - QV030
    - QV031
    - QV032
contentRequirements:
- Investment thesis and anti-thesis tied to financing history, revenue profile, market context, comparables, and risks.
- Recommendation, confidence, risk rating, valuation stance, and the current fair-value judgment.
- Current financing / valuation context, entry discipline, dilution or preference overhang, and whether public evidence supports the price.
- Bull / base / bear cases with explicit assumptions, valuation ranges, and downside triggers.
- Comparable set — public HCM companies and adjacent milestone or pricing references appropriate for Darwinbox.
- Exit readiness, unresolved evidence gaps, and final diligence asks plus thesis-break triggers.
