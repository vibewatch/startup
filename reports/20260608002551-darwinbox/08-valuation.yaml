company:
  name: Darwinbox
chapter:
  number: 8
  title: Valuation
summary: Darwinbox’s latest public valuation anchors cluster around the high-hundreds of millions to roughly $1.0B, but the March 2025 financing is not a perfectly clean primary round and the August 2025 follow-on did not publicly reset price. Public HCM comparables Workday, Paylocity, and Paycom trade near 3.1x-3.6x trailing revenue with materially stronger disclosure, margins, and profitability than Darwinbox. A forward underwriting case around $100M ARR can justify a broad $600M-$1.0B range, with a fair current base-case zone around $800M-$950M and a final stance of TRACK / stretched rather than clearly cheap. The core blockers are audited FY25 financials, gross margin, NRR/churn, and cap-table / preference-stack transparency.
callouts: []
sections:
- id: financing-anchors-history
  title: Financing Anchors and Valuation History
  body: 'Darwinbox enters valuation analysis with an unusually noisy but still useful financing record. The first durable anchor was the 2022 unicorn round, later reinforced by Microsoft’s strategic investment in early 2023. The next major price discovery came in March 2025, when Darwinbox announced a $140M financing led by Partners Group, KKR, and Gravity Holdings. That event matters, but not as a perfectly clean primary marker: the public record indicates a mixture of primary and secondary activity, and database reporting shows both a Series E and a same-day secondary event. In practical terms, the market is telling investors that Darwinbox can still attract large-scale institutional capital near unicorn value, but it is not yet proving that new investors will pay far above that mark on a pure-primary basis. The later $40M Teachers’ Venture Growth round and the employee ESOP buyback add more liquidity signals, yet they still leave today’s price band clustered around the high-hundreds of
    millions rather than clearly reset higher.'
  claimRefs:
