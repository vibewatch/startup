  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-certifications
      missingEvidence: >-
        ISO 27001 certificate, SOC 2 Type II audit report, and GDPR Data Processing Agreement
        template from Darwinbox.
      whyItMatters: >-
        Absence of publicly confirmed ISO 27001 and SOC 2 certifications is a procurement blocker
        for regulated-industry customers in the US and EU, materially limiting addressable market
        and enterprise sales velocity in those geographies.
      diligencePath: >-
        Request current ISO 27001 certificate with scope and surveillance audit date, latest SOC 2
        Type II report with any scope carve-outs noted, and a standard DPA template from Darwinbox
        directly.
      relatedQuestionRefs: [QE003, QE015]

    - type: missing-source
      severity: material
      topic: MCP-beta-status
      missingEvidence: >-
        MCP Server GA date, production uptime SLA, beta customer count, and incident history since
        May 2025 beta launch.
      whyItMatters: >-
        The MCP Server is Darwinbox's primary technical differentiator but remains in beta with no
        disclosed GA timeline or reliability commitment, creating uncertainty about its enterprise
        readiness for production AI agent workloads.
      diligencePath: >-
        Request committed GA roadmap, current beta customer deployment count, uptime data since
        May 2025, and any beta SLA commitments from the product team.
      relatedQuestionRefs: [QE017]

    - type: missing-source
      severity: material
      topic: payroll-countries-roadmap
      missingEvidence: >-
        List of the 11 countries with native payroll engines, most recent country added, and
        next planned country expansion roadmap beyond general Southeast Asia and Middle East signals.
      whyItMatters: >-
        Native payroll country count is a key competitive differentiator versus Workday, ADP, and
        Rippling; without the exact list and roadmap, the depth of competitive moat in specific
        geographies cannot be assessed.
      diligencePath: >-
        Request the full list of native payroll countries, the year each was added, and the
        committed or planned next additions from the product team.
      relatedQuestionRefs: [QE018]

    - type: private-evidence-only
      severity: minor
      topic: AI-benchmarks
      missingEvidence: >-
        Independent benchmarks comparing Darwinbox AI feature depth, model accuracy, and output
        quality against Workday, SAP SuccessFactors, and Oracle HCM AI capabilities.
