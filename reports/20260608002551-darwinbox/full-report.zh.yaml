      - number: '5.4'
        title: 可靠性、安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 的安全模型锚定 API 级 ACL 和基于角色的访问控制，覆盖所有平台入口，包括 MCP Server 工具调用。RIVeR
              薪资框架内置详尽审计轨迹、更严格数据控制和完整审批追踪，强化薪资处理的合规姿态。平台支持 40 多种语言，并设计为满足其运营司法辖区的数据本地化要求， 包括 APAC 和中东监管环境。

              可靠性方面，用户反馈反复提到高峰时段加载变慢，尤其是访问分析仪表盘或导出大数据集时。G2 评价者还指出移动端 App 通知不一致。 这些来自多条独立用户评论、时间集中在 2025
              年中，说明平台尚未在所有工作负载上达到企业级性能一致性。本次研究未能核实公开状态页、 正常运行时间 SLA 承诺或事故历史。

              合规覆盖方面，Darwinbox 在 11 个国家提供原生薪资合规，并通过合作伙伴网络覆盖 100 多个国家的法定要求。本次研究未能通过官方文档或第三方认证登记库公开确认 ISO 27001 和 SOC 2
              认证。缺少公开认证证据，对美国和欧盟受监管行业客户是实质采购阻碍，因为认证通常是合同要求。 尽调必须直接索取最新认证函、SOC 2 Type II 报告和子处理方清单。
