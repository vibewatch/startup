      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Darwinbox 的公开财务画像，是一家高信念成长阶段 SaaS 公司：收入线速度强（FY24 同比 58%，并朝 $100M ARR 前进），国际收入切换清晰（60%+
              新增收入来自印度以外），产品投入姿态（45% 收入用于 R&D）也符合一家试图跨越传统既有厂商、而不是优化短期利润率的公司 [CI001][CI006][CI011]。


              收入质量有积极信号：订阅模式、多年期企业合同，以及增长中的国际组合，都支撑更耐久的 ARR 基础。不过 FY24 净亏损扩大至约 Rs 191.8
              crore，确认公司远未盈利；联合创始人也明确在可预见未来把盈利能力降级 [CI013][CI015]。The Morning Context
              的反向报道，加上公开毛利率数据缺失，强化了一个判断：在做出资本配置决定前，这家公司仍需要大量承销工作 [CI033]。


              重大尽调阻断项包括：（1）按收入线拆分的毛利率，否则无法验证 SaaS 估值倍数；（2）2025
              年融资中新股与老股交易的比例，这决定实际现金跑道；（3）完整成本拆分（S&M、G&A、COGS），用于建模盈亏平衡路径；（4）NRR 和 Logo 流失率，它们是判断增长来自健康落地后扩张，还是靠持续新增
              Logo、在高 CAC 下烧钱的关键；（5）美国市场单位经济——按细分市场拆分的 CAC、爬坡时间和平均合同价值 [CI040][CI024][CI026][CI028]。考虑到 2025 年 9 月 AGM
              日期和印度 MCA 典型申报时间线，经审计 FY25 账目预计会在 2026 年下半年提交 [CI030]。


              竞争对手 Rippling 和 Deel 的估值是 Darwinbox $950M 混合估值的 12–14x，这意味着投资者必须相信 Darwinbox 能从约 $100M ARR 扩展到 $300–500M
              ARR，才能支撑类似倍数；国际收入组合和北美 3X 增长率提供了合理叙事，但支撑它的底层经济性仍未公开 [CI022][CI037]。
