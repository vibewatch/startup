      - number: '7.4'
        title: 实施与执行风险
        blocks:
          - type: paragraph
            body: >-
              实施是最可能把强演示变成弱投资结果的运营风险。独立 HRIS 基准持续给出警示：供应商承诺的两到三个月部署经常变成六到十二个月项目， 大型数据迁移频繁出现质量问题，API
              或相邻系统变化时，集成工作会带来直接成本和故障风险。历史失败案例强调了下行空间。CIO 的 ERP 案例显示， 上线错误可能复合成九位数超支和长期控制失败；Red Pill Labs 的 HCM
              案例研究显示，薪资和 HR 项目可能耗费数年，最后仍被放弃或大幅超预算。 这一点重要，因为 Darwinbox 面向大型企业，数据量、薪资本地化和审批工作流都更难回滚。G2 提供了独立证据：上线后的体验仍然重要，
              用户评价是采用信号，不只是销售信号。再叠加 Morning Context 关于公司遇到 rough patch 的付费墙负面标题，公开证据支持把实施质量和集成韧性视为一阶承销风险。
