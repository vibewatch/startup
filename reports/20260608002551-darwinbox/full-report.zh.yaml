chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立逻辑与平台范围
        blocks:
          - type: paragraph
            body: >
              Darwinbox 于 2015 年在 Hyderabad 由 Jayant Paleti、Rohit Chennamaneni 和 Chaitanya Peddi 创立，CTO Vineet Singh
              后来被提升为第四位联合创始人，公司由此正式形成四人创始阵容 [CO001][CO002]。创始人访谈和回顾性报道显示，公司源于团队对大型企业使用的碎片化、传统 HR
              系统的共同不满，亚洲市场尤其明显：西方既有厂商本地化往往慢且粗糙 [CO003][CO004][CO005][CO007]。这个起点很关键：Darwinbox 不是轻量级 HR 单点工具，而是一套端到端 HCM
              套件，目标是在需要移动优先工作流、可配置本地合规和更快产品迭代的市场里，直接与 SAP、Oracle，后来也与 Workday 竞争 [CO007][CO008][CO039]。


              公司当前产品定位已远超最初考勤和薪资的切入点。官方、合作伙伴和独立评测来源现在都指向同一结论：Darwinbox 在一个云平台内覆盖招聘、入职、核心 HR、劳动力管理、薪资、绩效、敬业度和分析
              [CO008][CO009]。公司的自我描述也从一家亚洲新锐，转向 AI 原生全球平台；近期信息重点放在智能体 AI、Model Context Protocol 支持，以及与 Microsoft Azure
              等企业技术栈的互操作性上 [CO014][CO026][CO043]。即便如此，本章仍把这些主张视为更大转型叙事的一部分，而不是单独证明其品类领导地位，因为若干后期指标仍为自报或存在部分争议
              [CO031][CO041]。
