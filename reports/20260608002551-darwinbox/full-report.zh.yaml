      - number: '3.3'
        title: 定价、打包与分销能力
        blocks:
          - type: paragraph
            body: >
              定价透明度本身就是这个市场的竞争武器。Oracle、SAP、Dayforce 和多数其他企业套件基本采用询价定价，这让它们可以定制打包，却让买方侧比较变得困难 [CP024][CP027]。相比之下，Deel
              公开 EOR、承包商和 PEO 定价；Rippling 解释其在必选平台之上的模块化每员工每月定价；greytHR 发布以印度薪资为核心的公开价目；BambooHR 展示分层打包，尽管最终企业级价格仍需联系销售
              [CP010][CP011][CP012][CP014][CP025]。


              分销能力和标价同样重要。Oracle 和 SAP 可以把 HCM 捆入更广的 ERP、财务和供应链关系；如果买方已经活在它们的生态中，切换摩擦就会降低 [CP018][CP019][CP036]。ADP
              即使在另一套 HCM 仍然存在时，也能靠薪资信任拿单 [CP020][CP041]。Rippling、Deel 和低价区域工具则让部分替代比整套切换更可行，从而施加压力
              [CP011][CP037][CP039][CP041]。Darwinbox 的回应，是主张更好的 TCO 和更灵活的打包，尤其通过独立招聘模块和移动优先采用来切入；但公开数据仍难以证明实际折扣和真实实施经济性
              [CP029][CP030][CP042]。
