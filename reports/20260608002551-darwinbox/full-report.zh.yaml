      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              Darwinbox 在 2025 年完成两轮独立股权融资：3 月由 KKR 和 Partners Group 共同领投 $140M（Partners Group 持有 $75M 股权，Gravity
              Holdings 参与），8 月又从 Ontario Teachers 的 TVG 部门融资 $40M
              [CI017][CI018]。两轮都由新股和老股交易混合构成；确切新股比例未公开，但联合创始人曾表示，由于公司现金储备充足，新股部分有意保持有限 [CI019]。


              自创立以来，公开披露股权融资总额按 Inc42 超过 $296M（按 Entrackr 为 $290M），历史轮次包括 2022 年以 $1B+ 独角兽估值完成的 $72M Series D
              [CI020]。基于老股定价的 2025 年 3 月混合估值约为 $950M——相对二级市场是上行轮，但略低于 2022 年新股估值 [CI022]。公开记录中没有已披露债务、可转债或项目融资义务
              [CI025]；Darwinbox 在 MCA 注册的实缴资本仅 Rs 3.24 crore，符合一家股权由外部持有的初创公司特征 [CI032]。


              2025 年 6 月的 Rs 86 crore（约 $10M）ESOP 回购是四年内第三次，相对于公司 2025 年融资水平，消耗现金规模可观但可管理 [CI023]。Entrackr 称 ESOP 池价值 Rs
              756 crore（约 $86M），代表重大股权悬置，未来融资或 IPO 时会以稀释形式显现 [CI024]。审计师 Walker Chandiok & Co LLP 提供机构级审计覆盖，尽管 FY25
              经审计账目尚未公开 [CI030]。


              考虑到亏损扩大轨迹和增长投入姿态，Darwinbox 的资本充足性取决于 2025 年融资中新股部分的规模、R&D 与 S&M
              支出升级速度，以及美国市场贡献能否足够快地爬坡以抵消这些成本。公开证据支持近期偿付能力，但 The Morning Context 提到“困难阶段”的独立反向信号，仍要求尽调核实精确现金跑道测算
              [CI033][CI040]。
