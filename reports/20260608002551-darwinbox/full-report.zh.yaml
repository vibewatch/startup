      - number: '6.3'
        title: 评测平台满意度与负面信号
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 在多个评测平台保持强评分。HR.software 在 2025 年 7 月汇总显示，平台在 G2 为 4.4/5、Capterra 为 4.6/5、Gartner Peer Insights
              为 4.7/5、TrustRadius 为 8.5/10。SoftwareAdvice 在 41 条评论中为 4.3/5， 其中 5 星和 4 星评论合计约 37 条。GetApp 确认 41
              条经验证评论，整体情绪偏正面。这些分数在 HCM 类别内有竞争力， 但绝对评论量相比 Workday 或 ADP 等拥有数千条评论的在位者仍偏小。

              G2、GetApp、TrustRadius 和 SoftwareAdvice 的正面评价反复出现几个主题：移动优先设计（随时打卡、休假管理、查看工资单）、 工作流定制，以及覆盖从招聘到退休生命周期的模块广度。一位
              G2 企业评价者（首席培训经理，1,000 人以上企业）称赞平台能把休假管理、 绩效评估和员工敬业度集中到一处。来自 5,000–10,000 人公司的 GetApp 评价者描述了 2 年以上的长期每日使用。

              负面信号集中在三个持续主题：（1）高峰负载下性能下降——这一抱怨出现在多数评论来源（G2、SoftwareAdvice、GetApp、TrustRadius）中，
              企业和中端市场用户都提到高峰时段或访问大型数据集时速度变慢；（2）API 和第三方集成缺口——PeerSpot 评价者明确提到 SAP 集成有问题， API
              需要改进；（3）企业高端稳定性和可扩展性存疑——PeerSpot 用户引用「DarwinBox is not a stable solution」和 「DarwinBox is not a scalable
              solution」，但在其他 PeerSpot 受访者总体正面的稳定性评论背景下，这些更像离群观点。 The Morning Context 发表过题为「Once full of promise, HR tech
              startup Darwinbox hits a rough patch」的文章（付费墙）， 暗示公司历史上遇到挑战，但内容无法独立核验。
