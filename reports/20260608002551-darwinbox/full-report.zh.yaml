      - number: '1.4'
        title: 动能信号与开放尽调风险
        blocks:
          - type: paragraph
            body: >
              Darwinbox 有可信的动能信号。Gartner 认可从 2021 年首次进入象限，推进到 2024 年和 2025 年的挑战者地位；独立媒体持续把公司描述为少数真正具备全球牵引力的亚洲出身 HCM
              平台之一；Starbucks、Nivea、AXA、Cigna、WeWork、Adidas、Zara 等标杆客户 Logo 也反复出现在投资者和媒体报道中
              [CO012][CO013][CO014][CO028][CO040][CO045]。公司的产品演进也更像有意为之，而非机会主义：官方和合作伙伴披露把薪资扩展、语义人才搜索、MCP 支持和 AI
              智能体工作流放进一条互操作路线图里，而不是彼此孤立的功能发布 [CO014][CO019][CO040][CO043]。


              但这还不是一个风险已经充分出清的公司画像。Reworked 关于北美的报道显示，Darwinbox 正进入一个拥挤市场，对手包括 Workday、Oracle、SAP、Deel、Rippling、BambooHR
              以及多家招聘专长厂商；hr.software 的评测也指出，Darwinbox 对大型企业仍最强，在 EOR 和财务管理等相邻品类里还不够完整
              [CO030][CO031][CO044]。更重要的是，公开证据仍无法清晰回答公司 2025 年入场估值、经审计 FY25
              收入或当前员工数。这些缺口并不否定增长故事，但意味着后续估值工作应依赖情景分析，而不是一个单一的“独角兽以上”数字 [CO018][CO034][CO041][CO046]。
