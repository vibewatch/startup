            title: 可信企业客户标识与 BFSI 深度
            body: >-
              Darwinbox 在东南亚为六家或更多大型 BFSI 机构发布过经验证上线新闻稿（2023–2025），包括菲律宾的 BPI（18,000 名员工）、 Chinabank（11,000 名）和 Security
              Bank Corporation，以及印度尼西亚的 Bank BTPN 和 FKS Group。这些是生产部署， 不是营销引用；BFSI 客户结构上转换成本高，是强留存信号。
            calloutType: strength
            claimRefs:
