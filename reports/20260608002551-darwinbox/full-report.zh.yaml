  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 外部风险中置信度最高的是多司法辖区数据保护。印度 DPDPA 在 2025 年 11 月规则最终确定后，从已颁布法律进入分阶段运营时间表： 数据保护委员会设立立即生效，同意管理器注册按 12
              个月计时，其余部分按 18 个月计时。Darwinbox 作为持有员工记录、 薪资数据，以及可能在福利或休假流程中处理儿童数据的 HR 平台，合规工作有明确时限，不是可选项。新加坡重要，因为 Darwinbox
              将总部迁至那里， PDPA 制度和 PDPC 执法历史直接相关。欧洲重要，因为 GDPR 第 4 条和 EDPB 持续指南对控制者和处理者角色作宽泛定义，而 EU AI Act 已通过立法阶段。Darwinbox
              发布了隐私政策，这是基本披露信号，但本资料包仍缺少数据映射、子处理方、转移机制或泄露响应运营的直接证据。 即便尚未考虑进入海湾或北美，仍留下真实残余敞口。
