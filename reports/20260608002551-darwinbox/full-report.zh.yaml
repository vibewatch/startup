            body: 对 Darwinbox 来说，真正可投资的问题不是全球 HR 软件市场是否足够大，而是大型企业、云优先、多国 HCM 支出里，有多少能被一个 APAC / MENA 根基强、选择性扩张美国的挑战者拿下。
