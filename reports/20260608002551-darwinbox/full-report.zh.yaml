  - id: FE001
    title: Darwinbox 平台架构栈
    type: stack
    layout: standard
    summary: 平台架构分五层：面向用户的展示层、应用模块、AI 与智能体层、集成接口，以及统一数据基础。
    data:
      layers:
        - label: 展示层
          modules:
            - 移动 App（iOS / Android — 移动优先，弱网可用）
            - Web 门户（员工和经理自助）
            - 管理后台（HR、薪资、分析）
        - label: 应用模块
          modules:
            - 招聘与入职（ATS、电子签、数字化旅程）
            - 核心 HRIS 与劳动力管理
            - 薪资（RIVeR — 多国，11 个原生覆盖国家）
            - 工时与考勤（地理围栏 / 移动端）
            - 绩效与人才（OKR、360、AI 辅导）
            - 学习与发展
            - 员工敬业度与脉搏调查
        - label: AI 与智能体层
          modules:
            - Darwinbox Sense（分析、流失 AI、异常检测）
            - Super Agent（12+ 个嵌入式智能体 — 人才、薪资、支持）
            - MCP Server（20+ 个 HR 工具；Beta；Node.js / npm）
