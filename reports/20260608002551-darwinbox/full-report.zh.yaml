            title: 所有评测平台都持续出现高峰负载性能抱怨
            body: >-
              高峰负载下性能下降，以及访问大型报告时速度变慢，是 G2、SoftwareAdvice、GetApp、PeerSpot 和 TrustRadius 上最反复出现的单一抱怨。
              跨平台一致性说明这更像产品可扩展性限制，而非孤立配置问题。若不解决，可能限制 Darwinbox 赢下并留住最大型企业账户的能力。
