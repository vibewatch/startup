      - number: '4.2'
        title: 收入牵引与 ARR 轨迹
        blocks:
          - type: paragraph
            body: >
              Darwinbox 披露的 FY24 总收入为 Rs 392 crore（约 $47M USD），同比增长 58%，两年增长 3.2x [CI001]。ET 与 Entrackr 数据之间存在差距：ET 和
              Economic Times 引用 Rs 392 crore 总收入，而 Entrackr 报告经营收入为 Rs 333 crore（增长 48%），说明差距很可能是非经营性收入，而不是底层订阅业务出现分歧
              [CI014]。FY25 方面，Tracxn 的 MCA 来源数据为 Rs 534 crore（约 $63M USD），意味着截至 2025 年 3 月财年约增长 36% [CI002]。GetLatka 报告
              2025 日历年收入 $100M，与联合创始人提出的 2025 年 H2 $100M ARR 目标大体一致 [CI004]。


              国际市场是增量增长的主要驱动。管理层称，超过 60% 的新增收入现在来自国际市场，FY24 国际收入增长 87%，两年内国际收入增长五倍 [CI006]。自 2023 年进入市场以来，北美同比增长 3X；MENA
              三年增长 9X，尽管两个地区起点都小于印度和东南亚 [CI029]。Darwinbox 目标客户是 3,000 名或更多员工的企业，并表示收入可预测性和美国规模，是在印度上市 IPO 的前置条件
              [CI027][CI038]。


              截至 2025 年中，Darwinbox 服务超过 1,000 家企业，在 130 个国家覆盖 4 million 名员工 [CI003]。公司从 2021 年到 2025 年末员工数增长
              3.6x，大致与收入增长率一致，说明每员工收入生产率总体稳定，而非恶化 [CI035]。如果 2025 年 H2 的 $100M ARR 里程碑得到确认，从收入质量角度看将是重要拐点，因为它跨过了 SaaS
              资本市场准备度常用的机构门槛 [CI003][CI038]。
