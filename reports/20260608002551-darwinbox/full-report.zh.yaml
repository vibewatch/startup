      - number: '7.2'
        title: 薪资与劳动合规风险
        blocks:
          - type: paragraph
            body: >-
              薪资和劳动合规风险不同于一般隐私风险，因为 Darwinbox 每支持一个新国家，其价值主张就扩大一层。TechCrunch 和 Reworked 将公司定位为国际化企业， 收入 60% 来自印度以外，拥有
              1,000 多家企业客户，并声称足迹覆盖最多 130 个国家。这样的规模意味着错误不会局限于一部法规或一个监管方： 各国薪资日历、工资规则、休假定义、解雇规则和汇缴义务都必须保持最新。本次研究的问题在于，最明显的
              UAE 直接来源——WPS 页面和 Labour Law PDF——无法访问，因此海湾本地化故事无法在这里用一手文件直接验证。印度则给出相反教训：官方劳动和网络安全机构很容易识别，
              说明薪资平台增长时会触碰多少监管表面。结论不是证明 Darwinbox 不合规，而是明确尽调结论：需要直接审查逐国薪资设计、责任归属和外部律师覆盖。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
      - number: '7.3'
        title: AI 与算法偏见风险
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 正把 AI 纳入增长叙事，因此 AI 风险应被视为现实的运营和合规议题，而不是未来的假想章节。最强公开证据并非来自 Darwinbox 本身， 而是来自独立框架。GAO 的 2026
              年竞争力框架把治理和监管提升为 AI 核心支柱。NIST 的 ARIA 试点显示，现实世界模型评估可以在实际规模下完成； AJIM/NIOSH 评论则梳理了与 HR
              场景高度相关的危害：安全失败、编码错误、侵入式监控、偏见放大、虚假信息和直接人身伤害。EU AI Act 的立法流程已经完成，欧洲就业相关 AI 功能现在有明确的合规轨迹。美国图景不完整，因为资料包中的 EEOC
              和 NTIA 页面未能直接抓取；而 Darwinbox 正在推进北美，这让部分公共政策验证留下缺口。关键结论是，负责任 AI 证据——模型清单、评估例程、人工覆盖和偏见测试——应作为尽调要求， 而不是营销加分项。
            claimRefs:
              - CR018
              - CR019
