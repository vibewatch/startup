      - number: '2.3'
        title: 买方地图、需求驱动与采购逻辑
        blocks:
          - type: paragraph
            body: >
              企业 HCM 采购现在是多利益相关方流程。Nucleus 和 ISG 都描述了这样的买方：他们不仅看功能深度，也看供应商匹配度、支持、产品可扩展性和实施成功率
              [CM015][CM017][CM018]。落到实际操作，CHRO 很少单独购买。HR 运营、薪资、IT、财务、安全和一线管理者都会影响决策，因为 HCM 软件位于合规、劳动力规划、员工体验和运营报表的交叉点
              [CM014][CM015][CM017]。


              需求同时被四股力量拉动。第一，组织想把碎片化数据和工作流整合进一个记录系统 [CM015][CM016][CM019]。第二，员工和经理体验需要提升，覆盖移动、自助、远程和一线场景
              [CM021][CM024]。第三，AI 正把 HCM 从静态记录系统，变成技能、决策支持和流程自动化层
              [CM022][CM025]。第四，即便员工队伍全球化，薪资和劳动法复杂性仍顽固地本地化，这有利于既有套件宽度、又能提供合规配置和本地适配的供应商 [CM023][CM026][CM027]。四股力量正好为
              Darwinbox 的集成式、移动优先叙事创造空间——前提是公司能化解买方对实施和本地化风险的焦虑 [CM038][CM040]。
