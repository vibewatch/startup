        blocks:
          - type: paragraph
            body: >-
              Darwinbox 的估值争论由快速增长和不完整经营披露之间的尖锐张力驱动。本章背景将 FY24 收入锚定在 ₹392 crore；根据所用公开来源不同， FY25 走向约 ₹534 crore，或约
              $60.7M。这一速度足以支撑前瞻性风险投资倍数，但公司 FY24 仍处于实质亏损， 且 R&D 支出异常高，占收入 45%。成熟上市 HCM 公司也大量投入产品，但核心可比公司同时披露约 69% 到 87%
              的毛利率， 并具备可见盈利能力。Darwinbox 未发布可比的毛利率、NRR 或队列质量指标，因此投资者只能依赖方向性证据，而非干净的单位经济模型证明。
              结果是一家公司标题增长强于上市同行，但要把增长转化为可投资的公开市场式盈利画像，路径嘈杂得多。
