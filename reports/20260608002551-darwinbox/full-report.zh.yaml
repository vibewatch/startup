  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 厂商
      - 价格 / 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 含义
    rows:
      - - Oracle Fusion Cloud HCM
        - $15 PEPM 为 Forbes 参考价；薪资附加模块需要 1,000 名员工
        - 覆盖广泛的企业级 HCM，包含分析和 AI
        - 企业实际成交价按询价确定，合同负担重
        - 企业买家需要采购议价能力，也要接受长决策周期
      - - SAP SuccessFactors
        - 仅询价
        - 核心 HR、薪资、人才、分析、全球能力
        - 合作伙伴费用和定制实施可能显著抬高 TCO
        - 适合 SAP 客户，但随手对比时不够透明
      - - Dayforce
        - 仅询价
        - HR、薪资、工时、人才、分析
        - 标价不公开，销售以演示牵引
        - 适合愿意走企业级流程的薪资和一线员工买家
      - - Rippling
        - 按员工 / 月收费，且需购买核心平台
        - HR、IT、财务模块可单独购买
        - 最终报价取决于所选模块和平台捆绑
        - 模块化提高透明度，降低初始承诺
      - - Deel
        - 已公开 $599 EOR / $125 美国 PEO / $49 承包商每月价格
        - 全球雇佣、薪资、合规、承包商管理
        - 全套 HRIS 经济性随服务组合而变
        - 透明定价是强买家获取优势
      - - BambooHR
        - Core / Pro / Elite 分层套餐；最终价格联系销售
        - SMB HRIS、ATS、合规、员工体验
        - 没有简单的企业级标价；ATS 容量上限可见
        - 套餐比套件更清晰，但经济性不能等同企业级套件
      - - greytHR
        - Essential 套餐 50 名员工 ₹2,495/month，另加 ₹45/employee
        - 薪资、休假、自助服务、附加模块
        - Premium 为定制价；附加模块会扩大最终 TCO
        - 对印度薪资驱动买家是强区域价格锚
      - - Darwinbox
        - 公开的是 TCO 主张，而非标价
        - 全套 HCM，覆盖招聘、薪资、AI 和移动优先 UX
        - 实际成交价不公开；TCO 低 40% 的说法未获独立验证
        - 可作为竞争销售工具，但尽调仍需真实合同
    notes: 该表混合了标价、编辑部基准价和仅询价信号，因为企业合同的实际条款大多不公开。
    enumerationScope:
      coverage: partial
      basis: Partial comparison limited to vendors with enough public product or price signals to compare packaging at all.
