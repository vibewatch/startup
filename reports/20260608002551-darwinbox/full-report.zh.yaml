      - number: '2.2'
        title: 规模口径、区域组合与 Darwinbox 相关机会
        blocks:
          - type: paragraph
            body: >
              HCM 的公开市场规模口径差异很大，因为品类边界不同。Mordor 估计较窄的云 HCM 平台市场在 2026 年为 USD 11.82 billion [CM005]。Verified 把更宽的 HCM
              加薪资市场放在 USD 21.93 billion [CM006]；Global Growth Insights、The Business Research Company 和 MarkWide 则把更广义
              HCM 软件或 HCM SaaS 的 2026 年估算放在大约 USD 27 billion 到 USD 31 billion 的区间
              [CM007][CM008][CM009]。正确结论不是某一个数字“正确”、其他数字错误；而是 Darwinbox 投资者必须先选分类口径，再去测算机会 [CM010]。


              区域上，即便市场规模数字不同，数据方向仍然一致。多份报告中，北美是当前最大的 HCM 区域，但 Asia-Pacific 反复被标记为增长最快的地域 [CM011]。大型企业仍是最大支出群体，而 SMEs
              和中型市场客户从更小基数上增长更快 [CM012]。对 Darwinbox 来说，宽口径 TAM 的帮助不如过滤后的 SAM：聚焦大型企业云 HCM，尤其是 APAC 和
              MENA。在这些市场，本地化、移动工作流和多国合规是核心采购标准，Darwinbox 也已经有可见牵引力 [CM037][CM038][CM039]。
