      - number: '6.2'
        title: 具名客户证明与部署模式
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 的投资者材料持续列出 Starbucks、Nivea、AXA、Cigna、WeWork、Crisil（一家 S&P 公司）和 T-Systems 作为锚定客户标识；这份名单至少自 2025 年
              3 月 KKR 投资新闻稿和 2025 年 8 月 UNLEASH 融资公告以来保持稳定。
              这些名字发挥品牌背书作用，但这些特定客户标识的部署范围、模块宽度或成果指标缺少独立公开确认。其生产状态来自投资者材料中的反复引用， 而非独立案例研究。

              相比之下，Darwinbox 新闻室披露了大量具名 BFSI 和大型企业部署，包含明确上线里程碑和员工数。最新案例是 Chinabank （菲律宾第四大私营全能银行），它在 2025 年 6
              月完成全平台迁移，覆盖 11,000 多名员工，从 2024 年 12 月签约到上线耗时五个半月。 平台在内部品牌名为「SyncHROne」，显示采用深度较高。Bank of the Philippine
              Islands（BPI，18,000 名员工，菲律宾首家银行） 于 2023 年 11 月上线。Security Bank Corporation（菲律宾）在 2024 年 8 月转型其 HCM 运营。Bank
              BTPN（印度尼西亚） 和 PT ASDP Indonesia Ferry 分别在 2023 年 8 月和 9 月采用 Darwinbox。FKS Group 这家东南亚食品和饲料平台在 2023 年 8 月将
              Darwinbox 上线为集团 HCM。

              FeaturedCustomers 平台列出 75 个 Darwinbox 案例研究和 1,576 条客户引用（包括一条 Workday 对比列表），提供广泛社会证明，
              但单条记录的质量和时效性不一。客户故事门户按行业（BFSI、消费品、IT 服务、零售等）和地区（东南亚、南非、UAE、美国、英国）分段， 确认多区域部署。

              G2 的「Time to Implement」在企业客户中的平均值约两个月，说明实施周期可控；Chinabank 案例也支撑这一点（复杂的 11,000 人全套部署耗时 5.5 个月）。PwC Middle
              East（2024 年 1 月）和 PwC UK（2023 年 10 月）现已成为战略实施伙伴， 为这些地区的企业部署加速和可引用性提供渠道。
