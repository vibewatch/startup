      - number: '1.3'
        title: 资本形成、运营规模与里程碑路径
        blocks:
          - type: paragraph
            body: >
              公司的资本故事可以清楚分成三章。第一，2022 年初 TCV 领投 $72 million Series D，Darwinbox 成为独角兽，这既验证了产品在区域市场的成功，也为更大的国际野心提供资金
              [CO026][CO027]。第二，2023 年初 Microsoft 进行了战略投资，并加深 Azure 与产品集成关系，强化 Darwinbox 的互操作叙事，也在纯风险资本背书之外提供了可信的企业分销信号
              [CO026]。第三，公司 2025 年 3 月从 Partners Group 和 KKR 融资 $140 million，8 月又从 Teachers’ Venture Growth 获得 $40
              million，把股权结构表变成战略软件支持者、跨界成长投资者和全球养老金资本的组合 [CO015][CO019][CO037]。


              2024–2025 年，规模看起来也有实质加速。公司和合作伙伴的公开沟通，从 2024 年约 900+ 家企业、3 million 名员工，推进到 2025 年 1,000+ 家企业、4 million
              名员工；KKR 和 TechCrunch 都强调，近期增长的多数来自印度以外 [CO020][CO021][CO022][CO024][CO045]。但这一强势也伴随本章最重要的两个尽调提醒。第一，2025 年
              3 月估值报道不一致：TechCrunch 称该融资为上行轮，Economic Times 后来则称这是一笔以老股交易为主、混合估值 $950 million 的交易
              [CO016][CO017][CO018][CO041]。第二，外部可见运营指标仍分歧很大：员工数估计约 1,150 到 1,400，收入估计从 Rs 333 crore 经营收入到 $100 million
              运行率代理指标不等 [CO033][CO034][CO035][CO036][CO046]。
