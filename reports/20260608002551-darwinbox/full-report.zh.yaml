      - number: '7.6'
        title: 融资与治理风险
        blocks:
          - type: paragraph
            body: >-
              公开融资证据强于公开经营证据，但仍留下治理问题。Darwinbox 在 2025 年 3 月引入 $140M，年内又引入 $40M，
              两笔交易都混合了一手和二手资本。这对资本可得性是正面信号，但也意味着股权结构表同时服务两个目的：资助扩张和提供流动性。 Moneycontrol 又增加两个张力点：报道称公司目标是在 2025 年底达到
              $100M ARR，R&D 支出等于收入的 45%；Economic Times 则报道称 FY24 收入为 Rs 392 crore、增长 58%，并由公司出资为 350 多名员工完成 Rs 86 crore
              ESOP 回购。TechCrunch 的「估值上调轮」表述有帮助，但它也提到本地媒体在公告前流传约 $950M 估值，因此 2025 年确切定价仍模糊。实际风险不是明显的近期现金紧张，
              而是治理必须在增长、产品投入、员工流动性和估值信号之间取得平衡，同时不给投资者提供关于取舍的干净公开披露。
