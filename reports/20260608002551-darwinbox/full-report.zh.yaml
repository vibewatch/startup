      - number: '2.4'
        title: 约束、切换成本与尽调含义
        blocks:
          - type: paragraph
            body: >
              HCM 市场有吸引力，部分原因在于它足够痛。与传统 ERP 技术栈集成通常很贵、重定制，也比供应商营销暗示的更慢 [CM028][CM029][CM030][CM031]。数据驻留、AI
              可审计性和网络安全顾虑会抬高跨司法辖区运营成本，尤其是对承诺全球薪资或 AI 招聘工作流的供应商
              [CM026][CM034][CM036]。这些摩擦在部署后形成保护既有厂商的切换成本，但也拉长销售周期，并给挑战者带来风险：它们必须证明实施质量，而不只是产品宽度 [CM028][CM032][CM038]。


              失败案例证据说明下行风险有多严肃。CIO、Red Pill Labs 和 GAO 都记录过项目：需求不清、治理薄弱、测试不足或薪资复杂性，最终导致成本超支、进度延误或员工薪资错误 [CM032][CM033]。对
              Darwinbox
              来说，含义很清楚：市场足够大、战略重要性足够高，能够支撑多个赢家；但实际价值创造取决于窄而硬的执行纪律——本地合规、安全迁移、数据完整性和客户成功。公开证据可以框定机会，却还无法在没有公司数据的情况下，构建精确的
              Darwinbox SAM / SOM 或可信的实施风险基准 [CM040][CM041]。
