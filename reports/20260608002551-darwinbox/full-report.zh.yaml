              是当前最可用的锚点，因为抓取到的市场数据快照同时提供市值和收入线。按这些快照， 该组交易价格仅约为收入的 3.1x 到 3.6x，尽管利润率稳健，反映品类已进入低增长、更受公开市场纪律约束的阶段。
