      - number: '7.7'
        title: 风险结论
        blocks:
          - type: paragraph
            body: >-
              总体看，Darwinbox 的风险画像实质存在，但默认不打破投资论点。公司融资状况似乎好于许多私有 SaaS 同行，也没有强公开证据指向即时偿付问题。 更重的风险在别处：跨司法辖区的隐私和薪资合规、AI
              治理准备度、企业级实施质量，以及北美扩张撞上拥挤市场时的利润率压力。这些风险彼此相连。 隐私或 AI
              控制失误会卡住受监管交易；缓慢实施会把折扣定价变成负贡献；如果增长目标同时下修、员工流动性预期上升，模糊的估值信号会更重要。
              对投资者而言，正确姿态不是一概回避，而是纪律性监控。承销应继续以数据控制、逐国薪资覆盖、实施队列指标和 AI 风险治理的直接证据为条件。
              如果这些事项仍不透明，同时增长目标下修或定价压力上升，本章当前「可管理但有条件」的结论应明显转负。
