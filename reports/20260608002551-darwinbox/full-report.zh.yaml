  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 通过三个主要维度服务企业：地理、垂直行业和规模。地理上，公司装机基础高度集中在亚太——印度、东南亚（菲律宾、印度尼西亚、
              马来西亚、新加坡、泰国）以及海湾合作委员会地区。北美和欧洲部署仍处早期；截至 2025 年 3 月 KKR 投资公告，北美被描述为主要扩张目标。 超过 60%
              的新增收入已经来自国际（非印度）市场，公司过去两年国际收入增长五倍，说明地理多元化正在推进。

              按垂直行业看，公开披露客户赢单中占比最高的是银行、金融服务与保险（BFSI）、零售和消费品（Starbucks、Nivea、Lulu）、 制造与物流、IT 和技术服务、媒体 / 电信。官方客户故事页按
              BFSI、消费品、教育、医疗健康、IT 服务、制造、酒店、物流、零售及其他分类， 显示行业覆盖较广；但 BFSI 在具名新闻稿中的占比明显偏高。AppsRunTheWorld 分析师数据库确认 Darwinbox
              覆盖航空航天、汽车、BFSI、 教育、政府、医疗健康、保险以及二十多个其他垂直行业，但非 BFSI 领域渗透深度未被独立量化。

              按买方规模看，Darwinbox 将 1,000 人以上企业作为主要客群，平台为规模化而设计（每月处理 120 万张工资单）。HR.software 的功能评测确认「Darwinbox
              主要服务大型企业（1,000 人以上）和亚太高增长组织」。中端市场账户（51–1,000 人）出现在评测平台基础中 （多位 G2 和 GetApp 评价者来自 51–500
              人公司），但旗舰案例研究和投资者材料持续指向企业级部署。
