      - number: '1.2'
        title: 创始人、领导力匹配与国际足迹
        blocks:
          - type: paragraph
            body: >
              在企业软件里，Darwinbox 的创始人—市场匹配度少见地一致。Jayant Paleti 带来投资银行和交易执行经验，在 M&A 尽调中看清员工数据质量问题；Rohit Chennamaneni 有咨询和
              Google 产品经历，强化了企业 HR 也需要消费级 UX 的判断；Chaitanya Peddi 则提供 HR 咨询深度，也更现实地理解替代 SAP 和 Oracle 有多难
              [CO003][CO004][CO005]。People Matters 2026 年回顾又补上一层有用的定性描述：团队是“乐观主义者、科学家、平衡者和建设者”的组合。由此可判断，Darwinbox
              的运营节奏仍高度依赖创始人互补，而不是一个外界高度可见的独立高管梯队 [CO006][CO038]。


              从地域看，这家公司如今比 Hyderabad 起点暗示的更全球化。独立报道和公司资料显示，Darwinbox 已将总部迁至 Singapore，同时把商业存在扩展到美国、中东、东南亚和英国
              [CO010][CO011][CO025][CO047]。TechCrunch 报道称，公司加码美国扩张后，Jayant Paleti 搬到了 Texas；KKR 和合作伙伴公告也把北美描述为增长最快的增量机会
              [CO023][CO025]。版图真实存在，但也带来协同挑战：公开来源支持其办公室布局广、海外收入贡献存在，但当前员工数估计仍有明显区间，确切组织规模仍未解决
              [CO022][CO024][CO046][CO047]。
