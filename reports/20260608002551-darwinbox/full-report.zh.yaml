          - type: paragraph
            body: >-
              实用的承销框架从 Darwinbox 所称通往约 $100M ARR 的路径出发，再框定合理前瞻倍数区间。按 6x 前瞻 ARR，估值降至约 $600M， 反映 ARR
              未达标、美国执行放缓或交付强度阻碍软件式利润率的熊市情形。按 8x，公司达到约 $800M；若增长保持强劲但披露缺口仍未解决， 这是更平衡的基准情形。按 10x，Darwinbox 回到 $1.0B
              附近；只有在公司清晰证明 ARR 达成、利润率质量以及历史基本盘之外的可持续扩张时才合理。 因此当前立场是跟踪 /
              偏紧，而不是绝对便宜或明显高估：业务动能足以支撑数亿美元高位估值，但公开证据还不足以让显著更高的入场价格显得审慎。 在承销 2025 年 3 月锚点前，投资者应要求经审计 FY25 财务、毛利率披露、按队列划分的
              NRR、完整股权结构表和清算优先权结构表， 以及 2025 年资本中一手与二手各占多少的清晰说明。
