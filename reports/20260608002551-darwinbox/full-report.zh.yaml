      - number: '3.4'
        title: Darwinbox 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              公开证据显示，Darwinbox 的护城河真实但有边界。公司出现在 ISG 的正式套件评估、Gartner 相关媒体报道和独立评论中，定位已不只是印度本地 HR 工具
              [CP001][CP002][CP031][CP032][CP033][CP034]。Outsail 和 Reworked 都强调了帮助 Darwinbox 脱颖而出的特征：移动优先员工
              UX、平台优先架构、独立招聘模块，以及直指既有套件的成本叙事 [CP029][CP030][CP031]。当买方更看重采用、本地需求配置和更容易部署招聘，而不是一整套巨大 ERP 关系时，这些差异化最有用。


              结构性风险同样清晰。Reworked 显示北美市场有多拥挤，尤其要面对 Workday、Oracle、SAP、Deel 和 Rippling [CP028]。G2
              评论显示，即使满意客户仍会抱怨报表深度和偶发慢速，而这正是既有厂商在企业选型比拼中会利用的问题 [CP035]。既有厂商保留分销能力，薪资专长厂商保留合规杠杆，模块化挑战者保留简单性。Darwinbox
              可以赢，但举证负担仍更高，因为它没有 Oracle 或 SAP 的嵌入式生态能力，也没有 ADP 和 Deel 的纯薪资出身 [CP036][CP037][CP038][CP040]。
