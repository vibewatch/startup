        title: 融资锚点与估值历史
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 进入估值分析时，融资记录异常嘈杂，但仍有用。第一个耐用锚点是 2022 年独角兽轮，随后由 Microsoft 在 2023 年初的战略投资进一步强化。下一次主要价格发现发生在 2025 年
              3 月，Darwinbox 宣布由 Partners Group、KKR 和 Gravity Holdings 领投 $140M
              融资。这件事重要，但不能当成完全干净的一手定价标记：公开记录显示交易混合了一手和二手活动， 数据库报告也显示同日既有 Series E，也有二手交易。实际含义是，市场告诉投资者 Darwinbox
              仍能在接近独角兽价值处吸引大规模机构资本， 但尚未证明新投资者愿意在纯一手基础上远高于这一标记付费。之后的 $40M Teachers’ Venture Growth 轮和员工 ESOP
              回购增加了更多流动性信号， 但仍让当前价格带聚集在数亿美元高位，而不是明确重估到更高。
