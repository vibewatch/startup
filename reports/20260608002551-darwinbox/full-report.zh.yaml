      - number: '5.5'
        title: 产品结论：差异化、风险与技术尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 的差异化耐久性靠三项相互强化的结构性优势支撑：统一平台优先的数据架构、移动优先与新兴市场本地化深度，以及借助 MCP Server 在 HCM 原生 AI
              互操作上的先发位置。这些优势确实很难快速复制。传统 HCM 厂商背着收购拼装架构留下的技术债，美国优先的新进入者又缺少 Darwinbox 在亚太和中东累积的地理本地化薪资合规深度。MCP Server 仍处于
              beta，但已经显示 Darwinbox 把平台做成 AI 集成枢纽的架构押注； 如果企业加速采用智能体式 AI，这个位置具备防御性。

              实施风险真实存在，但可管理。4–6 个月部署窗口、必需的数据准备阶段，以及复杂技术栈集成所需的技术资源，都会形成有意义的客户转换成本和部署摩擦。
              这些门槛保护现有客户，也会在竞争激烈的企业销售周期中拖慢新增客户获取。The Morning Context 在 2024 年报道了运营挑战，显示公司激进地理扩张阶段存在执行压力。

              截至 2026 年 6 月，关键技术尽调阻碍包括：（1）缺少可公开验证的 ISO 27001 和 SOC 2 认证；（2）没有公开 SLA 或正常运行时间承诺； （3）MCP Server 仍处 beta，未披露
              GA 日期；（4）独立分析师认为财务管理模块能力有限；（5）没有原生 EOR 能力；（6）没有公开 GraphQL 或开发者 CLI 文档。这些缺口不会让 Darwinbox 在其主要服务的 APAC
              企业市场失去资格，但在美国和欧盟受监管行业中会实质限制其可服务市场， 因为认证是采购阻断性要求。
