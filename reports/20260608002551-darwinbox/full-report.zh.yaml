  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与分层
        blocks:
          - type: paragraph
            body: >
              Darwinbox 面对的不是一个单一竞争对手集合。ISG 在正式 HCM 套件评估中，把它与 Oracle、SAP、Dayforce、Rippling、UKG、Workday
              及其他厂商放在一起，这说明企业买方至少愿意把公司列入与大型既有厂商竞争的候选名单 [CP001][CP002]。但市场仍会分层。GrowthScribe 的分层在方向上有用：Oracle、SAP 和 ADP
              位于最难撼动的企业级层；UKG、Dayforce 和 Rippling 给高端中型市场施压；BambooHR 和 Zoho People 主要锚定 SMB 市场末端 [CP003][CP023]。


              因此，Darwinbox
              同时向两个方向竞争。往上，它必须证明一家更年轻、亚洲出身的供应商能匹配既有套件的信任、覆盖和集成深度。往下，它必须防守透明、模块化或低成本替代方案；这些方案可能只解决买方一部分问题，却不需要完整套件迁移
              [CP004][CP027][CP038][CP039]。实际结果是，Darwinbox 既不是纯企业级既有厂商，也不是简单 SMB 颠覆者。它是一个挑战者，在移动优先 UX、本地化和招聘灵活性比 ERP
              捆绑能力更重要的场景里，竞争位置最强 [CP004][CP029][CP040]。
