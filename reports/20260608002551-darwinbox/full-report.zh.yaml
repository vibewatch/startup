        - label: 集成与开发者层
          modules:
            - Darwinbox Studio（300+ 个低代码连接器 — 可通过 MCP 调用）
            - REST API 与 Webhook 事件总线
            - OAuth 2.0 与 SSO（Azure AD、社交登录）
            - Marketplace（60+ 个预构建应用集成）
        - label: 统一数据基础
