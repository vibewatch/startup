      - number: '4.3'
        title: 成本结构、利润率与 R&D 强度
        blocks:
          - type: paragraph
            body: >
              Darwinbox 明确确认，其 45% 收入投向 R&D；管理层把这定义为对 AI 驱动 HCM 能力的有意投入 [CI011]。这一比例显著高于成熟企业 SaaS 公司常见的 20–25% R&D /
              收入区间；作为参照，公开 HCM 可比公司达到规模后通常 R&D 强度更低，尽管 Rippling 和 Gusto 这样的高增长玩家也会重投产品。持续的 R&D 强度解释了净亏损的相当一部分
              [CI013][CI015]。


              根据 Entrackr 分析，FY24 净亏损为 Rs 191.8 crore（约 $23M），较之前年度扩大 [CI013]。联合创始人已明确把盈利能力排在 AI 能力投入之后 [CI015]。仅 R&D
              就消耗 45% 收入，再叠加约 88 名背负配额销售代表所需的美国市场竞争性薪酬 [CI026]，全成本结构几乎肯定超过收入的 100%，与亏损扩大轨迹一致。对成长阶段 SaaS
              企业来说这并不罕见，但会让公司对资本市场条件更敏感。


              毛利率是最关键但未披露的财务指标。企业 SaaS HCM 基准显示毛利率为 65–80%，但 Darwinbox 的专业服务、实施和薪资处理活动，可能把实际利润率压向该区间低端 [CI016]。Apps Run
              The World 将 Darwinbox 全部收入归类为 SaaS（无硬件或许可证），方向上与软件主导商业模式一致 [CI039]。若由 FY24 亏损推算出的每月约 Rs 16 crore（约
              $1.9M/month）隐含烧钱速度持续，公司就需要继续注资——不过管理层 2025 年融资活动表明，他们已走在资本事件前面 [CI040]。


              Darwinbox 员工数从 2025 年 8 月的 1,046（MCA 数据）增长到 2025 年 11 月约 1,400（GetLatka），意味着下半年招聘激进，可能集中在美国和工程团队，并会在短期内加速
              S&M 和 G&A 成本 [CI012][CI035]。
