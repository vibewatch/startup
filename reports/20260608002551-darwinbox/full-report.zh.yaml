  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价结构
        blocks:
          - type: paragraph
            body: >
              Darwinbox 的收入几乎全部来自其云端 HCM 平台的 SaaS 订阅，并按每员工每月计费 [CI007]。公司不公布价目表，而是采用基于报价的模块化模型，客户围绕所需 HR 能力组包——核心
              HR、薪资、人才管理、劳动力管理、分析、AI 功能和集成 [CI009]。SoftwareFinder 估计标准企业部署的 PEPM 基准约为 $8–$10，显著低于 Workday 公开起价 $34
              PEPM；但 Darwinbox 实际定价会随模块数量、员工规模和地域大幅变化 [CI008][CI010]。


              企业合同通常为多年期，Darwinbox 也明确把自己的模型描述为：组织可以随时间添加模块，而不必迁移到新系统——这一设计支持现有客户群内的增购经济性
              [CI007]。专业服务（实施、配置和培训）很可能是次级收入线，但公司没有公开拆分服务与订阅收入 [CI016]。不公开价目表会给早期采购比较带来结构性摩擦，不过模块化方式让 Darwinbox
              能以低于完整套件既有厂商的初始承诺参与竞争 [CI008][CI034]。


              竞争对手 Deel 和 greytHR 把透明定价当作销售武器：Deel 公布按 EOR、承包商和 PEO 的费率，greytHR 提供以印度薪资为核心的价目表，50 名员工起价 ₹2,495/month
              [CI009]。Rippling 披露模块化按员工定价逻辑。Darwinbox 的定价不透明符合大型企业销售文化，但在自助或数字优先的中型市场中，竞争对手已经投入透明定价，这可能让 Darwinbox 处于
              CAC 劣势 [CI010]。


              MENA 策略新增了一项计划中的泛 GCC 多国薪资产品，并提供完整阿拉伯语支持，这会扩大海湾市场的单客户 ACV
              [CI031]。多元素安排（订阅与实施捆绑）的收入确认可能造成现金回收与确认收入之间的时间差，这是任何审计复核都应追问的尽调问题 [CI016]。
            claimRefs:
