  - id: FU004
    title: 留存 / 续约队列
    type: cohort
    layout: standard
    summary: >-
      按地域细分和部署年份估算 Darwinbox 企业客户留存队列。Darwinbox 不披露净留存率（NRR）、总留存率（GRR）或队列留存率；这些估算来自同业 HCM SaaS 基准（行业调研显示企业 HCM
      总留存率（GRR）为 85–92%）、评论平台上的多年使用信号，以及缺少显著公开客户流失公告。数值应视为跨行业示意估算，不是公司披露指标。
    approximationNotes: >-
      所有队列留存值都用企业 HCM SaaS 总留存率（GRR）基准估算（行业调研显示首年留存 85–92%，之后逐年下降 6–8 个百分点）。APAC 和 GCC 估算以高于行业平均的切换成本假设为锚（BFSI 占比高，薪资 /
      合规配置深）。鉴于公开北美客户数据几乎为零，北美 2024 队列值带有推测性。Darwinbox 不披露任何 净留存率（NRR）、总留存率（GRR）或队列指标；所有数值均为示意，应在一手尽调中用实际值替换。为满足 schema
      合规，图中值以整数（0–100）展示；它们代表估计总留存百分比。
