      - number: '5.2'
        title: AI 原生差异化与技术创新
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 在 2025 年最重要的产品里程碑，是 2025 年 5 月推出 Model Context Protocol（MCP）Server——全球首个由 HCM 平台推出的 MCP
              Server。MCP Server 把 HR 功能暴露成任何兼容 MCP 的 AI agent 都能发现的工具，首批上线 20 个核心 HR 工具，另有 100 多个工具在开发中。借助这套架构，基于
              Anthropic、OpenAI、Google Gemini 或 Microsoft 基础设施构建的第三方 AI agent 可以发起请假申请、检索员工记录、管理员工出勤、处理审批，并实时编排横跨 HCM、CRM
              和财务系统的工作流，无需定制点对点集成。MCP Server 基于 Node.js 18+ 构建，并以 MIT License 下的开源 npm 包（darwinbox-mcp）分发，使用 OAuth 2.0
              客户端凭据认证。所有工具调用都受 API 级 ACL 和基于角色的访问控制约束。

              作为 MCP Server 的配套，Darwinbox Studio 是一个低代码 iPaaS，内置 300 多个第三方应用连接器。Studio 的自定义集成配方会自动通过 MCP Server
              变成可调用工具，企业 AI agent 可按需触发组织特定集成，无需开发者额外投入。 Super Agent 已向试点客户交付，由覆盖人才、分析、薪资和员工支持的 12 多个嵌入式 AI agent 驱动。AI
              Studio 则让企业在同一 MCP 基础设施上构建并注册自定义 agent。全平台已有 45 多项嵌入式 AI 能力覆盖员工生命周期，包括对话式分析、 薪资异常检测、离职风险预测和语义相似度候选人排序。

              2024 年 RIVeR（Review, Initiate, Verify and e-approve, Release and Report）薪资框架首次把印度薪资处理做到 100%
              数字化，去掉手工对账步骤，并让全线上电子验证和审批可规模化落地。公司已释放计划，要把 RIVeR 框架扩展到东南亚和中东市场。 这些发布说明 Darwinbox 的发布节奏同时锚定全球 AI
              趋势（MCP、智能体式工作流）和区域合规需求（APAC 薪资数字化）。
