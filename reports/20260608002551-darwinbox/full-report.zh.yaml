  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代路径
        blocks:
          - type: paragraph
            body: >
              Darwinbox 进入的不是“HR tech”的全部宇宙，而是更窄但仍然很大的集成式 HCM 软件品类。相关市场包括核心 HR
              管理、薪资、劳动力管理、人才招聘、绩效、学习和敬业度模块，以套件或深度集成平台形式交付 [CM001][CM002]。Verified Market Reports 尤其有用，因为它明确排除了手工 HR
              流程，以及未连接更广泛 HR 系统的独立薪资工具，这有助于界定哪些机会应纳入，哪些应排除 [CM003]。


              这个边界很重要，因为公开市场规模估算否则会显得不一致。买方在比较 Darwinbox 与 Workday、SAP、Oracle、Dayforce、Rippling 或 UKG
              时，比较的不是劳务外包支出、通用咨询或一次性 HR 工具；他们比较的是集成的记录系统和工作流层 [CM004][CM010]。因此，现状替代方案很宽：彼此断开的本地薪资引擎、电子表格、传统 ERP HR
              模块，以及多年拼接起来的同类最佳单点工具 [CM016][CM020]。对 Darwinbox 来说，关键边界是云优先、套件导向的细分市场：组织希望统一员工数据、工作流、分析和多国合规，而不是继续管理碎片化 HR
              技术栈 [CM015][CM019]。
