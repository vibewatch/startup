      - number: '6.5'
        title: 客户质量结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 的客户质量评估为中高：具名企业客户标识广度、多条带有员工数细节的近期上线新闻稿、跨平台强评分，以及多年客户使用年限证据， 都让人对其大规模真实采用有合理信心。1,000
              多家企业客户数得到多个独立来源（KKR 新闻稿、UNLEASH、Reworked）相互印证， 代表可验证下限，而非上限。新增收入 60% 以上来自印度以外的国际收入结构变化，说明多元化动能真实存在。

              不过，本章有三个尽调阻碍。第一，NRR/GRR 未披露——经常性收入 HCM 平台最重要的客户质量指标，在公开材料中完全缺失。第二，
              最大具名客户标识（Starbucks、Nivea、AXA、Cigna）缺少部署范围、成果指标或续约历史的独立确认；它们是品牌关联，不是已验证引用。
              第三，五个独立评测平台持续出现高峰负载性能抱怨，暗示产品可扩展性挑战，在企业规模最高端可能演变为留存风险。进入后续投资阶段前， 一级尽调应处理这些阻碍。
