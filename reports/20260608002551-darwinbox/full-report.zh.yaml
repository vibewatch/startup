companyProfile:
  summary: >-
    Darwinbox 是一家 2015 年创立的 HCM 软件公司，最初面向亚洲市场打造，如今向全球销售更完整的企业 HR 平台。公开证据支持其已有可观规模——1,000+
    家企业、数百万名员工由平台管理，并且正在北美扩张；但也显示公司仍处投入期，R&D 强度高、利润率披露不完整，估值支撑更依赖未来 ARR 执行，而不是历史财务证明。
