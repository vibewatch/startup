  - id: TI002
    title: 定价与变现表
    columns:
      - 定价维度
      - Darwinbox 做法
      - 可用证据
      - 竞品参考
      - 含义
    rows:
      - - 公开标价
        - 无公开标价；所有层级均仅询价
        - SoftwareFinder 和 ITQlick 确认仅询价模式
        - Deel 公开 $599 EOR / $125 PEO；Rippling 披露 PEPM 逻辑；greytHR 列出 INR 定价
        - 仅询价增加销售摩擦，但让大客户定价更灵活
      - - 估计 PEPM（标准企业）
        - ~$8–$10 PEPM，来自 SoftwareFinder 估计
        - SoftwareFinder 第三方基准；ITQlick 将成本评为平均
        - Workday：公开 $34 PEPM；Darwinbox 暗示折扣 60–75%
        - 显著前期价格优势；要让买家切换，仍须证明深度可比
      - - 定价基础
        - 按员工 / 月 × 活跃席位；合同覆盖所有授权模块
        - 与评论来源和公司描述一致
        - 所有主要 HCM 厂商都采用 PEPM 或类似结构
        - 可预测的 ARR 增长会随员工数增加自动跟进
      - - 多年期折扣
        - 可能有 10–20% 多年承诺折扣；未披露
        - 标准企业 SaaS 做法；由模块化交易结构推断
        - SAP、Oracle、Workday 都提供多年期折扣，但不公开
        - 多年期锁定提升 NRR，但也使合同期内取消成本更高
      - - 企业 vs SMB 适配
        - 明确定位 3,000+ 员工企业；较小部署的单位成本更高
        - SoftwareFinder 称 Darwinbox 最适合中型和大型企业
        - BambooHR 和 greytHR 服务 500 员工以下 SMB；Zoho People 面向全球 SMB
        - SMB 适配有限；定价模式和实施复杂度更偏向大型企业
      - - 实施 / 专业服务费
        - 未披露；估计为首年 ACV 的 10–20%
        - ITQlick 指出定制、集成和培训会增加 TCO
        - 企业级 HCM 行业惯例
        - 增加前期总成本；在初始定价阶段，面对透明定价竞品时可能降低胜率
    notes: 定价数字来自第三方估计或竞品公开标价；Darwinbox 企业实际成交价未披露，可能与基准明显不同。
