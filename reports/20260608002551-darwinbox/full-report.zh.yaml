      - number: '5.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 平台优先架构是持久的结构性优势
            body: >-
              Darwinbox 在 2015 年选择构建统一平台，而不是收购并缝合点状解决方案，这让它在数据模型和 AI 集成上相对 SAP SuccessFactors、Workday 以及背负收购债的传统 HCM
              玩家形成真实优势。这一架构选择会复利：每项新 AI 能力都能干净访问完整员工数据模型，从而实现多模块 AI 编排； 竞争对手若不投入高成本重构，结构上更难复制。分析师 Josh Bersin 所说的「next
              Workday」以及 OutSail 对「compound startup」 架构的分析，都指向这是最主要的长期护城河。
            calloutType: strength
