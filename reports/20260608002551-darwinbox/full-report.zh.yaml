      - number: '5.3'
        title: 部署、集成与开发者生态
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 面向 1,000 人以上企业，最适合需要多国 HR 管理、强本地合规和移动优先采用的组织。中型公司（200–500 人） 的实施周期为 4–6 个月，快于传统企业级 HRMS 平台常见的
              9–12 个月。实施开始前需要一个 2 天到 2 个月不等的 「Week Zero」数据准备阶段，覆盖组织数据收集、工作流配置和集成映射。现有技术栈复杂的组织可能需要定制开发才能实现无缝连接，
              周期和成本都会增加。

              平台通过 Darwinbox Marketplace 暴露 60 多个预构建集成，并支持 Webhooks 做实时事件驱动集成。API 栈包括 OAuth 2.0 认证、SSO 和社交登录，以及 Webhook
              管理 API。不过 APITracker 的 Darwinbox 资料显示，平台缺少公开记录的 GraphQL 端点、CLI、已发布的限流文档和沙盒环境——这些缺口关系到面向开发者的技术尽调，也可能拖慢企业
              API 采用。位于 github.com/darwinbox/darwinbox-mcp 的公开 MCP Server GitHub 仓库提供了参考实现，也在 MIT License 下提供开源贡献入口。

              hr.software 的分析师评测给 Darwinbox 的集成深度打 8/10、实施速度打 7/10，略低于平台整体 8.2/10 的加权得分。 最适配的客户画像是 APAC、中东或全球市场中 500
              人以上的中大型企业，且拥有内部技术资源或供应商伙伴资源来管理配置和定制。 HR 需求简单、偏好开箱即用的较小公司被明确标注为不适合 Darwinbox 这套企业导向打法。
