          - type: callout
            title: 跨平台评测分数稳定高于 4.3/5
            body: >-
              五大主要评测平台（G2、Gartner Peer Insights、Capterra、SoftwareAdvice、GetApp）上，Darwinbox 评分维持在 4.3–4.7/5
              区间，没有低分离群平台，说明满意度广泛存在，而不是挑选引用。TrustRadius 8.5/10 进一步印证。
