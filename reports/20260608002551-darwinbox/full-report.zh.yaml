      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 未公开披露 NRR、GRR 或明确的队列留存率。这是客户章节中最重大的单一尽调缺口：对一家价值主张依赖深度员工数据集成和多年期承诺的 B2B SaaS HCM
              平台而言，缺少任何留存指标会阻止外部独立判断耐久性。最接近的代理指标包括：（1）新闻稿活动——公司在 2024 年和 2025 年继续发布具名客户上线公告，包括最初在 2022–2023
              年签约的客户，暗示续约在发生；（2）评测平台使用年限数据—— G2、GetApp 和 TrustRadius 多位评价者描述 2 年以上使用期；（3）每月 120
              万张工资单处理规模，只有在庞大且稳定的客户基础下才可持续。

              部署模式中能看到「先落地、再扩张」：客户通常先用 Darwinbox 的核心 HRIS 或出勤模块，信心建立后再扩展到薪资和绩效管理。 Chinabank
              案例说明这一点——第一阶段实施在压缩的五个月窗口内覆盖绩效管理、招聘、入职、员工敬业度和问题解决，后续模块大概率继续跟进。 hr.software 的评测分析确认，买方经常从一个模块起步，并在平台证明自身后扩展。

              集中度风险体现在两个维度。第一，APAC——尤其是菲律宾、印度尼西亚、印度和 GCC——占公开客户标识的绝大多数，北美仍处早期牵引阶段。 第二，BFSI 垂直行业在具名新闻稿中占比过高，使客户质量评估部分依赖
              Darwinbox 的 BFSI 行业关系。正面看，BFSI 客户通常转换成本高、 配置广、HR 合同多年期，结构上支持留存。由 $140M + $40M 融资支持的北美扩张，以及 PwC UK/EU
              伙伴关系，旨在降低地理集中度， 但公开来源还无法衡量进展。Reworked 文章提到 Darwinbox 声称 TCO 比「Workdays of the world」低 40%，这是北美市场最核心的销售话术，
              但这一说法来自公司，未经独立审计。
