  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与产品范围
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 提供一套 AI 原生人力资本管理套件，设计目标是在单一云平台上覆盖从招聘到退休的完整员工生命周期。不同于通过收购单点方案拼装功能的 HCM 供应商，Darwinbox 从 2015
              年创立起就按统一平台架构搭建。这种平台优先设计意味着核心组织数据模型——组织架构、员工记录、薪资规则和工作流配置——在所有模块间共享，而不是被收购历史切成孤岛。OutSail
              的分析师评论把它称为“复合型初创公司”架构，认为这种架构在数据质量、报表、AI 集成和创新速度上带来结构性优势，靠拼接单点方案很难复制。

              平台覆盖九个主要功能领域：招聘与 ATS、入职、核心 HRIS、薪资、工时与考勤、绩效管理、学习与发展、人员分析（Darwinbox Sense）和员工敬业度。薪资处理每月覆盖多个地域超过 1.2 million
              张工资单，具备 11 个国家的原生薪资引擎，并通过合作伙伴网络覆盖 100+ 个国家的合规。考勤模块支持移动打卡，带地理围栏和地理标记，服务一线和外勤员工——这种设计根植于 Darwinbox 的
              Asia-Pacific 和新兴市场出身。

              截至 2025 年末，平台服务超过 1,000 家企业，在 130 个国家覆盖超过 4 million 名员工。Darwinbox 连续第二年在 2025 Gartner Magic Quadrant for
              Cloud HCM Suites for 1,000+ Employee Enterprises 中被评为挑战者，并在配套 Gartner Critical Capabilities
              报告的入职前人才管理维度中，在所有供应商里获得第二高分（4.38/5）。公司称自己是 Gartner 象限中达到挑战者地位的最年轻、且唯一亚洲出身 HCM 平台。
