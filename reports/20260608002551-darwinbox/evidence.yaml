evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Exact March and August 2025 primary and secondary pricing by share class remains undisclosed publicly.
    whyItMatters: >-
      A precise entry valuation is required to judge whether Darwinbox sustained, regained, or slipped below unicorn
      pricing in 2025.
    diligencePath: >-
      Request the financing deck, cap table, and transaction summary distinguishing primary capital from secondary
      liquidity.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited FY25 revenue, ARR, gross margin, and segment mix are not publicly disclosed in a consistent format.
    whyItMatters: >-
      Revenue quality and margin structure are essential inputs for the financials and valuation chapters and cannot be
      inferred safely from media snippets alone.
    diligencePath: >-
      Request audited FY24-FY25 financial statements, board packs, and a recurring-revenue bridge by geography and
      product.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: No official current employee count is published and third-party estimates range from roughly 1,150 to 1,400+.
    whyItMatters: >-
      Headcount affects burn-rate, productivity-per-employee, and operating-leverage assumptions used later in the
      report.
    diligencePath: >-
      Request an as-of-date employee census split by geography and function, then reconcile it with payroll and HRIS
      exports.
