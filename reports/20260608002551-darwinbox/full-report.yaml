        title: Exhibits
        blocks:
          - type: callout
            title: The broad TAM is less useful than the filtered SAM
            body: >-
              For Darwinbox, the real investable question is not whether global HR software is a large market; it is how
              much large-enterprise, cloud-first, multi-country HCM spend can be won by a challenger with strong
              APAC/MENA roots and selective U.S. expansion.
            calloutType: insight
            claimRefs:
