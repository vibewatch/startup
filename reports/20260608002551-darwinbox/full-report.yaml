        title: Review Platform Satisfaction and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              Darwinbox maintains strong cross-platform review scores. As aggregated by HR.software in July 2025, the
              platform scores G2 4.4/5, Capterra 4.6/5, Gartner Peer Insights 4.7/5, and TrustRadius 8.5/10.
              SoftwareAdvice shows 4.3/5 across 41 reviews, with 5-star and 4-star reviews together accounting for
              approximately 37 of the 41 responses. GetApp confirms 41 verified reviews with broadly positive sentiment.
              These scores are competitive within the HCM category, though absolute review volumes are modest compared
              to incumbents such as Workday or ADP which carry thousands of reviews.

              Consistent themes across positive reviews on G2, GetApp, TrustRadius, and SoftwareAdvice include
              mobile-first design (attendance marking, leave management, payslip access on the go), workflow
              customization, and breadth of modules covering the hire-to-retire lifecycle. One G2 enterprise reviewer
              (Chief Training Manager, enterprise 1,000+ employees) praised the platform's ability to centralize leave
              management, performance reviews, and employee engagement in one place. GetApp reviewers from 5,000–10,000
              employee companies describe long (2+ year) tenures using the platform daily.

              Adverse signals are concentrated around three persistent themes: (1) performance degradation at peak load
              — this complaint appears in a majority of review sources (G2, SoftwareAdvice, GetApp, TrustRadius), with
              users across enterprise and mid-market segments noting slowness during peak usage hours or when accessing
              large datasets; (2) API and third-party integration gaps — PeerSpot reviewers explicitly cite problematic
              SAP integration and an API needing improvement; (3) stability and scalability doubts at the high end of
              the enterprise — PeerSpot users quote "DarwinBox is not a stable solution" and "DarwinBox is not a
              scalable solution," though these appear to be outlier views against a backdrop of otherwise positive
              stability comments from other PeerSpot respondents. The Morning Context published an article titled "Once
              full of promise, HR tech startup Darwinbox hits a rough patch" (paywalled), suggesting some historical
              challenges, though the content is inaccessible for independent verification.
