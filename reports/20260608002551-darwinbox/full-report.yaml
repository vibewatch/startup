      - number: '4.5'
        title: GTM motion and sales efficiency
        blocks:
          - type: paragraph
            body: >
              Darwinbox uses a direct enterprise sales motion anchored around mid-to-large enterprises with 3,000 or
              more employees [CI027]. The company's co-founders have built out a global sales organization with
              approximately 88 quota-carrying sales reps as of late 2025, according to GetLatka [CI026]. If the $100M
              ARR target is achieved, the implied revenue per sales rep is approximately $1.1M ARR, which is within the
              range for early-expansion enterprise SaaS but not exceptional — suggesting the company may benefit from
              improved rep productivity or channel leverage over time.


              The GTM motion increasingly relies on regional product-market fit: North America is led by Paleti (who has
              relocated to Texas), APAC and India are the legacy strongholds, MENA is a high-growth region, and UK and
              continental Europe are early-stage [CI006][CI029]. Partners such as Microsoft (strategic investor) and
              Salesforce Ventures provide credibility and potential distribution adjacency, though neither partnership
              is described as a formal reseller channel in public sources. Avendus Capital served as financial advisor
              on both 2025 capital raises, indicating a structured investment banking relationship rather than organic
              self-distribution [CI017][CI018].


              CAC, payback periods, and sales cycle length are not publicly disclosed [CI028]. Enterprise HCM sales
              cycles typically run 6–18 months for mid-to-large accounts; the US market likely extends this due to
              higher competition and procurement rigor compared with APAC. The 45% R&D spend plus high US market cost of
              entry creates a structural tension: growth investment must convert to revenue fast enough to justify the
              burn profile. Darwinbox's 3X North America YoY growth rate for the first two years is encouraging but
              still early-stage [CI029].
