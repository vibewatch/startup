      - number: '7.6'
        title: Financing and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is better than public operating evidence, but it still leaves governance
              questions. Darwinbox brought in $140 million in March 2025 and another $40 million later in the year, with
              both transactions mixing primary and secondary capital. That is a positive signal for capital access, yet
              it also means the cap table is serving two purposes at once: funding expansion and providing liquidity.
              Moneycontrol adds two more tension points by reporting a target of $100 million ARR by end-2025 and R&D
              spend equal to 45% of revenue, while Economic Times reports FY24 revenue of Rs 392 crore, 58% growth, and
              an Rs 86 crore company-funded ESOP buyback for more than 350 employees. TechCrunch's "up-round" framing
              helps, but it also noted local press circulating a roughly $950 million valuation before announcement, so
              exact 2025 pricing remains ambiguous. The practical risk is not an obvious near-term cash crunch; it is
              that governance must balance growth, product investment, employee liquidity, and valuation signaling
              without giving investors clean public disclosure on the trade-offs.
