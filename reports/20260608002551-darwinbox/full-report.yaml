      - number: '3.2'
        title: Competitor profile clusters
        blocks:
          - type: paragraph
            body: >
              The enterprise incumbents win in different ways. Oracle competes on breadth: one data model, embedded AI,
              analytics, workforce planning, and global payroll inside a broader cloud ecosystem [CP005][CP019]. SAP
              competes on global compliance, deep localization, and the advantage of already sitting inside many
              multinational ERP estates [CP006][CP018][CP036]. ADP is payroll-first by design and remains structurally
              strong wherever tax and pay execution are the buyer's top concern [CP008][CP020]. Dayforce and UKG are
              especially strong for operational and frontline environments where payroll, scheduling, labor forecasting,
              and compliance sit close to the core problem [CP007][CP009][CP021].


              The newer challengers compete on simplicity or adjacency. Rippling tries to collapse HR, IT, and finance
              automation into a single operating layer with modular purchases and faster switching [CP010][CP022]. Deel
              competes where global hiring, contractor management, and EOR or PEO execution are more urgent than an
              all-in-one HCM suite [CP011][CP037]. BambooHR, Zoho People, and greytHR show how lower-complexity or
              lower-price platforms can shape buyer expectations, especially outside the large-enterprise tier
              [CP012][CP013][CP014][CP039]. These are not always Darwinbox's direct peers, but they matter because they
              reset what buyers think should be easy, fast, or transparent.
