              - CV012
      - number: '8.3'
        title: Comparable Company Set and Multiple Analysis
        blocks:
          - type: paragraph
            body: >-
              The cleanest public comp set for Darwinbox is not generic SaaS; it is large HCM and payroll software
              vendors with meaningful recurring revenue, compliance depth, and enterprise workflow scope. Workday,
              Paylocity, and Paycom are the most usable current anchors because the fetched market-data snapshots
              provide both market caps and revenue lines. On those snapshots, the group trades at only about 3.1x to
              3.6x revenue despite solid margins, reflecting a lower-growth and more public-market-disciplined phase of
              the category. Darwinbox is much smaller but growing materially faster, so a direct application of the
              public median to trailing revenue would understate what late-stage private investors are really
              underwriting. Even so, a premium multiple cannot be unlimited. Illiquidity, pre-profit status, and missing
              gross-margin and retention data all justify a meaningful discount versus the valuation one might assign to
              a fully disclosed public company growing at the same headline rate.
            claimRefs:
              - CV021
