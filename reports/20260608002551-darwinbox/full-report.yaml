      - number: '8.4'
        title: Scenario Ranges, Final Stance, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              A practical underwriting frame starts with Darwinbox’s stated path toward roughly $100M ARR and then
              brackets the range of justified forward multiples. At 6x forward ARR, valuation falls to about $600M and
              captures the bear case where ARR misses, U.S. execution slows, or delivery intensity prevents
              software-like margins. At 8x, the company reaches about $800M, which is a more balanced base case if
              growth remains strong but disclosure gaps stay unresolved. At 10x, Darwinbox returns to the $1.0B
              neighborhood, which is plausible only if it cleanly proves ARR attainment, margin quality, and durable
              expansion outside its historical base. That makes the current stance TRACK / stretched rather than
              outright cheap or clearly overpriced: the business has enough momentum to defend a
              high-hundreds-of-millions valuation, but not enough public proof yet to make a materially higher entry
              price look prudent. Before underwriting the March 2025 anchor, investors should demand audited FY25
              financials, gross-margin disclosure, NRR by cohort, a full cap-table and preference-stack schedule, and a
              clear accounting of how much of the 2025 capital was primary versus secondary.
            claimRefs:
