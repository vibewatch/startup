  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Anchors and Valuation History
        blocks:
          - type: paragraph
            body: >-
              Darwinbox enters valuation analysis with an unusually noisy but still useful financing record. The first
              durable anchor was the 2022 unicorn round, later reinforced by Microsoft’s strategic investment in early
              2023. The next major price discovery came in March 2025, when Darwinbox announced a $140M financing led by
              Partners Group, KKR, and Gravity Holdings. That event matters, but not as a perfectly clean primary
              marker: the public record indicates a mixture of primary and secondary activity, and database reporting
              shows both a Series E and a same-day secondary event. In practical terms, the market is telling investors
              that Darwinbox can still attract large-scale institutional capital near unicorn value, but it is not yet
              proving that new investors will pay far above that mark on a pure-primary basis. The later $40M Teachers’
              Venture Growth round and the employee ESOP buyback add more liquidity signals, yet they still leave
              today’s price band clustered around the high-hundreds of millions rather than clearly reset higher.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV044
