      - number: '3.3'
        title: Pricing, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >
              Pricing transparency is itself a competitive weapon in this market. Oracle, SAP, Dayforce, and most other
              enterprise suites largely keep pricing quote-only, which lets them tailor packaging but makes buyer-side
              comparison difficult [CP024][CP027]. In contrast, Deel advertises clear EOR, contractor, and PEO pricing;
              Rippling explains modular per-employee-per-month pricing atop a required platform; greytHR publishes
              payroll-led Indian list pricing; and BambooHR shows tiered packaging even when final enterprise pricing
              still requires contact with sales [CP010][CP011][CP012][CP014][CP025].


              Distribution power matters just as much as list price. Oracle and SAP can bundle HCM into broader ERP,
              finance, and supply chain relationships, reducing switching friction when the buyer already lives in their
              ecosystems [CP018][CP019][CP036]. ADP can win on payroll trust even when another HCM suite stays in place
              [CP020][CP041]. Rippling, Deel, and lower-price regional tools apply pressure by making partial
              replacement more viable than a full-suite switch [CP011][CP037][CP039][CP041]. Darwinbox's answer is to
              argue for better TCO and more flexible packaging, especially via stand-alone recruiting and mobile-first
              adoption, but public data is still thin on realized discounts and true implementation economics
              [CP029][CP030][CP042].
