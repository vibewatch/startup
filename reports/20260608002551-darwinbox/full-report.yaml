      - number: '8.2'
        title: Revenue Trajectory and Financial Profile vs. Public Comparables
        blocks:
          - type: paragraph
            body: >-
              Darwinbox’s valuation debate is driven by a sharp tension between fast growth and incomplete operating
              disclosure. The chapter context anchors FY24 revenue at ₹392 crore, with FY25 moving toward roughly ₹534
              crore or about $60.7M depending the public source used. That is fast enough to justify a forward-looking
              venture multiple, but the company was still materially loss-making in FY24 and spent an unusually high 45%
              of revenue on R&D. Mature public HCM companies do spend heavily on product, yet the core comp set pairs
              that spending with disclosed gross margins near 69% to 87% and with visible profitability. Darwinbox has
              not published comparable gross-margin, NRR, or cohort-quality metrics, so investors must rely on
              directional evidence instead of clean unit-economics proof. The result is a company with stronger headline
              growth than public peers, but a much noisier path to translating that growth into an investable
              public-market-style earnings profile.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
