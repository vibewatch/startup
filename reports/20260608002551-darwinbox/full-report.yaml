      - number: '1.2'
        title: Founders, leadership fit, and international footprint
        blocks:
          - type: paragraph
            body: >
              Darwinbox’s founder-market fit is unusually coherent for enterprise software. Jayant Paleti brought
              investment-banking and deal-execution experience that made people data quality visible during M&A
              diligence; Rohit Chennamaneni contributed consulting and Google product exposure that sharpened the case
              for consumer-grade UX in enterprise HR; and Chaitanya Peddi supplied HR consulting depth and a realistic
              view of how hard it would be to displace SAP and Oracle [CO003][CO004][CO005]. People Matters’ 2026
              retrospective adds a useful qualitative layer by describing the team as an “optimist, scientist, balancer,
              and builder” combination, which supports the argument that Darwinbox’s operating cadence still rests
              heavily on founder complementarity rather than a highly visible independent executive bench
              [CO006][CO038].


              Geographically, the business now looks more global than its Hyderabad origin suggests. Independent
              reporting and company profile sources indicate that Darwinbox moved its headquarters to Singapore while
              expanding commercial presence into the U.S., the Middle East, Southeast Asia, and the U.K.
              [CO010][CO011][CO025][CO047]. TechCrunch reported that Jayant Paleti relocated to Texas as the company
              leaned into U.S. expansion, while KKR and partner announcements frame North America as the fastest-growing
              incremental opportunity [CO023][CO025]. The footprint is real, but it also creates a coordination
              challenge: public sources support widespread office presence and overseas revenue contribution, yet
              current employee-count estimates still range meaningfully, leaving the exact organizational scale
              unresolved [CO022][CO024][CO046][CO047].
