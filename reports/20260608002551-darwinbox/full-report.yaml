chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding thesis, and platform scope
        blocks:
          - type: paragraph
            body: >
              Darwinbox was founded in 2015 in Hyderabad by Jayant Paleti, Rohit Chennamaneni, and Chaitanya Peddi, with
              CTO Vineet Singh later elevated as the fourth co-founder as the company formalized its founding quartet
              [CO001][CO002]. Founder interviews and retrospective profiles show that the company emerged from a shared
              frustration with fragmented, legacy HR systems used by large enterprises, especially in Asia, where
              western incumbents often localized slowly and poorly [CO003][CO004][CO005][CO007]. That origin matters:
              Darwinbox was not built as a lightweight HR point solution, but as an end-to-end HCM suite intended to
              compete directly with SAP, Oracle, and later Workday in markets that needed mobile-first workflows,
              configurable local compliance, and faster product iteration [CO007][CO008][CO039].


              The current product positioning is much broader than the company’s original attendance-and-payroll entry
              wedge. Official, partner, and independent review sources now converge on Darwinbox spanning recruitment,
              onboarding, core HR, workforce management, payroll, performance, engagement, and analytics inside one
              cloud platform [CO008][CO009]. The company’s self-description has also shifted from an Asia-based upstart
              to an AI-native global platform, with recent messaging centered on agentic AI, Model Context Protocol
              support, and interoperability with enterprise stacks such as Microsoft Azure [CO014][CO026][CO043]. Even
              so, this chapter treats those claims as part of a broader transition story rather than proof of category
              leadership on their own, because several later-stage metrics remain self-reported or partially disputed
              [CO031][CO041].
