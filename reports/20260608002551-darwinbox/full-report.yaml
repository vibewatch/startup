              - CR014
              - CR015
              - CR016
              - CR017
      - number: '7.3'
        title: AI and Algorithmic Bias Risk
        blocks:
          - type: paragraph
            body: >-
              Darwinbox is leaning into AI as part of its growth narrative, so AI risk should be treated as a live
              operating and compliance issue rather than a speculative future chapter. The strongest public evidence
              does not come from Darwinbox itself but from independent frameworks. GAO's 2026 competitiveness framework
              elevates governance and regulation as a core AI pillar. NIST's ARIA pilot shows that real-world model
              evaluation is feasible at practical scale, while the AJIM/NIOSH commentary catalogs harms that are highly
              relevant in HR contexts: security failures, coding errors, intrusive surveillance, bias amplification,
              disinformation, and direct human harm. The EU AI Act's legislative process is completed, so
              employment-related AI functionality in Europe now carries a defined compliance trajectory. The U.S.
              picture is less complete because the EEOC and NTIA pages in the source pack failed to fetch directly,
              leaving some public-policy verification incomplete just as Darwinbox is pushing into North America. The
              important takeaway is that responsible-AI evidence—model inventory, evaluation routines, human override,
              and bias testing— should be treated as a diligence requirement, not a marketing bonus.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
