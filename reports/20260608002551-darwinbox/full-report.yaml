  - id: FV002
    slug: valuation-scenario-waterfall
    title: Valuation Scenario Waterfall
    type: waterfall
    claimRefs:
      - CV010
      - CV035
      - CV036
      - CV037
    data:
      items:
        - label: March 2025 blended anchor ($B)
          value: 0.95
        - label: Disclosure / quality discount
          value: -0.1
        - label: Growth support
          value: 0.05
        - label: Base-case fair value ($B)
          value: 0.9
    approximationNotes: >-
      This is an analytical bridge rather than a mechanical market model. Figures are in billions USD and summarize how
      growth support and disclosure discounts can still leave the fair-value zone below a clean $1B premium case.
  - id: FV003
    slug: revenue-multiple-comparison
    title: Revenue Multiple Comparison vs Public Comps
    type: bar
    claimRefs:
      - CV021
      - CV023
      - CV025
      - CV027
      - CV032
    data:
      items:
        - label: Workday
          value: 3.6
        - label: Paylocity
          value: 3.5
        - label: Paycom
          value: 3.1
        - label: Public comp median
          value: 3.5
        - label: Darwinbox base forward ARR
          value: 8
    approximationNotes: >-
      Darwinbox is shown on a forward ARR basis because a direct trailing-revenue comparison would not capture what
      late-stage investors are underwriting.
  - id: FV004
    slug: valuation-sensitivity-matrix
    title: Valuation Sensitivity Matrix
    type: matrix
    layout: standard
    summary: Sensitivity of implied valuation to forward ARR and multiple assumptions.
    claimRefs:
      - CV032
      - CV033
      - CV038
      - CV039
    data:
      columns:
        - 6x multiple
        - 8x multiple
        - 10x multiple
      rows:
        - label: $90M ARR
          values:
            - $540M
            - $720M
            - $900M
        - label: $100M ARR
          values:
            - $600M
            - $800M
            - $1.0B
        - label: $110M ARR
          values:
            - $660M
            - $880M
            - $1.1B
        - label: $120M ARR
          values:
            - $720M
            - $960M
            - $1.2B
    approximationNotes: >-
      The matrix highlights that both execution on ARR and proof on quality metrics must move together for Darwinbox to
      defend or exceed the unicorn mark.
