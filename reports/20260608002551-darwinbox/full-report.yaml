      - number: '4.6'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >
              Darwinbox's public financial profile is that of a high-conviction growth-stage SaaS company: strong
              top-line velocity (58% YoY in FY24 and heading toward $100M ARR), a clear international revenue shift
              (60%+ of new revenue outside India), and a product investment posture (45% of revenue in R&D) that is
              consistent with a company trying to leapfrog legacy incumbents rather than optimize for near-term margins
              [CI001][CI006][CI011].


              Revenue quality has positive signals: subscription-based, multi-year enterprise contracts, and growing
              international mix all support a durable ARR base. However, widening net losses of ~Rs 191.8 crore in FY24
              confirm the business is far from profitable, and the co-founder has explicitly deprioritized profitability
              for the foreseeable future [CI013][CI015]. The Morning Context's adverse coverage and the absence of
              public gross margin data reinforce that this is a company that still requires significant underwriting
              work before a capital allocation decision can be made [CI033].


              Material diligence blockers include: (1) gross margin by revenue line, without which the SaaS valuation
              multiple cannot be validated; (2) the primary vs secondary split of the 2025 capital raises, which
              determines actual cash runway; (3) full cost breakdown (S&M, G&A, COGS) to model the breakeven path; (4)
              NRR and logo churn, which are critical for understanding whether growth is driven by healthy
              land-and-expand or by constant new-logo acquisition burning against high CAC; and (5) US market unit
              economics — CAC, ramp time, and average contract value by segment [CI040][CI024][CI026][CI028]. The
              audited FY25 accounts are expected to be filed in the second half of 2026 given the September 2025 AGM
              date and typical Indian MCA filing timelines [CI030].


              Competitors Rippling and Deel are valued at 12–14x Darwinbox's blended $950M valuation, implying that
              investors must believe Darwinbox can scale from ~$100M ARR toward $300–500M ARR to justify a comparable
              multiple; the international revenue mix and the North America 3X growth rate provide a plausible
              narrative, but the underlying economics to support it remain private [CI022][CI037].
