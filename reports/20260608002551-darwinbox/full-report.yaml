          - type: callout
            title: Implementation is the main market tax
            body: >-
              HCM demand is robust, but value leaks out in migration, integration, testing, localization, and
              change-management work that buyers often underestimate and vendors tend to understate during the sale.
            calloutType: risk
            claimRefs:
              - CM028
              - CM029
              - CM030
