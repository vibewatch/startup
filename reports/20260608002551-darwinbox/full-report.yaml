      - number: '7.7'
        title: Risk Verdict
        blocks:
          - type: paragraph
            body: >-
              On balance, Darwinbox's risk profile is material but not thesis-breaking by default. The company appears
              better financed than many private SaaS peers, and there is no strong public evidence of an immediate
              solvency issue. The heavier risks sit elsewhere: privacy and payroll compliance across jurisdictions,
              AI-governance readiness, implementation quality at enterprise scale, and margin pressure as North America
              expansion collides with a crowded field. Those risks are interconnected. A privacy or AI-control miss can
              stall regulated deals; a slow implementation can turn discounted pricing into negative contribution; and
              ambiguous valuation signaling can matter more if growth targets slip at the same time that
              employee-liquidity expectations rise. For an investor, the right posture is not blanket avoidance but
              disciplined monitoring. Underwriting should stay contingent on direct evidence for data controls, country
              payroll coverage, implementation cohort metrics, and AI-risk governance. If those items remain opaque
              while growth targets are revised down or pricing pressure rises, the chapter's current "manageable but
              conditional" verdict should move materially more negative.
            claimRefs:
