  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Darwinbox delivers an AI-native Human Capital Management suite designed to cover the entire employee
              lifecycle from hire to retire on a single cloud platform. Unlike HCM vendors that assembled functionality
              through acquisitions of point solutions, Darwinbox was architected as a unified platform from its 2015
              founding. This platform-first design means the core organizational data model — org chart, employee
              records, payroll rules, and workflow configuration — is shared across all modules rather than siloed by
              acquisition history. Analyst commentary from OutSail describes this as a "compound startup" architecture
              that bestows structural advantages in data quality, reporting, AI integration, and innovation velocity
              that are hard to replicate by stitching together point solutions.

              The platform spans nine primary functional areas: recruitment and ATS, onboarding, core HRIS, payroll,
              time and attendance, performance management, learning and development, people analytics (Darwinbox Sense),
              and employee engagement. Payroll processing reaches over 1.2 million payslips monthly across multiple
              geographies, with native payroll engines for 11 countries and compliance coverage across 100+ countries
              via partner networks. The attendance module supports mobile clock-in/out with geofencing and geo-tagging
              for frontline and field workforces — a design choice rooted in Darwinbox's Asia-Pacific and
              emerging-market origins.

              As of late 2025, the platform served more than 1,000 enterprises with over 4 million employees across 130
              countries. Darwinbox was recognized as a Challenger in the 2025 Gartner Magic Quadrant for Cloud HCM
              Suites for 1,000+ Employee Enterprises for the second consecutive year, and scored second-highest among
              all vendors in pre-hire talent management (4.38/5) in the accompanying Gartner Critical Capabilities
              report. The company describes itself as the youngest and only Asian-origin HCM platform to have reached
              Challenger status in the Gartner quadrant.
