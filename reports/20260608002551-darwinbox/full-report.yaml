            title: Darwinbox is pointed at the right buyer segment
            body: >-
              Analyst and procurement sources place Darwinbox inside the same HCM-suite and AI-HCM evaluation set as
              Workday, Oracle, SAP, Dayforce, and Rippling, which means it is showing up where enterprise buyers are
              actually screening global platforms.
            calloutType: strength
            claimRefs:
