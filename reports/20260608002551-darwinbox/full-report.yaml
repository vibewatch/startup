    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              Darwinbox serves enterprises across three primary vectors: geography, vertical, and size. Geographically,
              the company's installed base is heavily concentrated in Asia-Pacific — India, Southeast Asia (Philippines,
              Indonesia, Malaysia, Singapore, Thailand), and the Gulf Cooperation Council region. North American and
              European deployments are nascent, with North America described as the primary expansion target as of the
              March 2025 KKR investment announcement. Over 60% of new revenue already originates from international
              (non-India) markets, and the company has achieved a fivefold growth in international revenue over the two
              prior years, suggesting active geographic diversification.

              By vertical, the most heavily represented sectors in publicly disclosed customer wins are Banking,
              Financial Services, and Insurance (BFSI), retail and consumer goods (Starbucks, Nivea, Lulu),
              manufacturing and logistics, IT and technology services, and media/telecom. The official customer stories
              page segments by BFSI, Consumer Goods, Education, Healthcare, IT Services, Manufacturing, Hospitality,
              Logistics, Retail, and others, indicating broad sector coverage, though BFSI accounts for a
              disproportionate share of named press releases. The AppsRunTheWorld analyst database confirms coverage
              across Aerospace, Automotive, BFSI, Education, Government, Healthcare, Insurance, and twenty-plus other
              verticals, though the depth of penetration in non-BFSI segments is not independently quantified.

              By buyer size, Darwinbox targets enterprises with 1,000+ employees as its primary segment, with the
              platform designed for scale (payroll processing of 1.2 million payslips monthly). HR.software's feature
              review confirms that "Darwinbox primarily serves large enterprises (1,000+ employees) and high-growth
              organizations across Asia-Pacific." Mid-market accounts (51–1,000 employees) appear in the review platform
              base (multiple G2 and GetApp reviewers are from companies of 51–500 employees), but the flagship case
              studies and investor materials consistently reference enterprise-scale deployments.
