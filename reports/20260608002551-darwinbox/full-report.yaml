        - AI model dependency for semantic candidate ranking and screening
        - AI explainability and hiring bias risk in regulated jurisdictions
      - - People Analytics (Darwinbox Sense)
        - AI-powered workforce insights, attrition prediction, and dashboards
        - Reporting API; embeddable dashboards
        - Data freshness tied to CoreHR sync cadence
        - Performance degradation under large dataset queries (user-reported)
      - - MCP Server
        - AI agent integration hub exposing HR tools as discoverable actions
