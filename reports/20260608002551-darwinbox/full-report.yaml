      - number: '2.2'
        title: Sizing lenses, regional mix, and Darwinbox-relevant opportunity
        blocks:
          - type: paragraph
            body: >
              Public sizing lenses for HCM vary materially because category boundaries vary. Mordor estimates the
              narrower cloud HCM platform market at USD 11.82 billion in 2026 [CM005]. Verified puts the broader
              HCM-plus-payroll market at USD 21.93 billion [CM006], while Global Growth Insights, The Business Research
              Company, and MarkWide place broader HCM software or HCM SaaS estimates in a band from roughly USD 27
              billion to USD 31 billion for 2026 [CM007][CM008][CM009]. The right takeaway is not that one number is
              “correct” and the others are wrong; it is that a Darwinbox investor needs to choose the taxonomy first and
              only then size the opportunity [CM010].


              Regionally, the data is directionally consistent even when the market sizes are not. North America is the
              largest current HCM region in multiple reports, but Asia-Pacific is repeatedly flagged as the
              fastest-growing geography [CM011]. Large enterprises remain the largest spending cohort, while SMEs and
              midmarket customers grow faster from a smaller base [CM012]. For Darwinbox, that means the broadest TAM is
              less helpful than a filtered SAM focused on large-enterprise cloud HCM, especially in APAC and MENA where
              localization, mobile workflows, and multi-country compliance are core buying criteria and where Darwinbox
              already has visible traction [CM037][CM038][CM039].
