      - number: '7.5'
        title: Competitive and Distribution Risk
        blocks:
          - type: paragraph
            body: >-
              Darwinbox's expansion story is attractive precisely because it is hard. Reworked frames North America as a
              crowded field dominated by entrenched suites and aggressive challengers, while TechCrunch says Darwinbox
              is focused on larger enterprises around the 3,000-employee mark. That segment can deliver higher contract
              value, but it also raises the cost of failure because procurement teams expect deep integrations, local
              compliance coverage, and credible referenceability. Reworked's roughly 40% lower-TCO positioning helps
              Darwinbox open doors, yet it also suggests a price-led competitive motion that can squeeze margin if
              implementation or support costs remain high. The company's geographic spread increases partner and
              dependency risk alongside pure competition: country payroll advisors, systems integrators, customer IT
              teams, and regulator-facing workflows all become part of successful delivery. In other words, Darwinbox is
              not just selling software; it is assembling a multi-country operating system whose weakest external
              dependency can still slow deployments, renewals, or international expansion.
            claimRefs:
