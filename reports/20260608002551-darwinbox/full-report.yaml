  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              Darwinbox's highest-confidence external risk is multi-jurisdiction data protection. India's DPDPA moved
              from enacted law to a staged operational timeline once rules were finalized in November 2025: Data
              Protection Board setup took effect immediately, consent-manager registration runs on a 12-month clock, and
              the remainder on an 18-month clock. For an HR platform holding employee records, payroll data, and
              potentially children's data in benefit or leave workflows, that means compliance work is time-bound rather
              than optional. Singapore matters because Darwinbox relocated headquarters there, so the PDPA regime and
              PDPC enforcement history are directly relevant. Europe matters because GDPR Article 4 and continuing EDPB
              guidance define controller and processor roles broadly, while the EU AI Act is already past the
              legislative stage. Darwinbox does publish a privacy policy, which is a baseline disclosure signal, but
              this source pack still lacks direct evidence on data mapping, sub-processors, transfer mechanisms, or
              breach response operations. That leaves a real residual exposure even before considering expansion into
              the Gulf or North America.
