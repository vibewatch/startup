      - number: '7.2'
        title: Payroll and Labor Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Payroll and labor compliance risk is distinct from general privacy risk because Darwinbox's value
              proposition expands with every new country it supports. TechCrunch and Reworked position the company as
              international, with 60% of revenue outside India, 1,000+ enterprise customers, and footprint claims up to
              130 countries. That scale means errors are not limited to one statute or one regulator: country payroll
              calendars, wage rules, leave definitions, termination rules, and remittance obligations must all stay
              current. The problem in this run is that the most obvious direct UAE sources—the WPS page and the Labour
              Law PDF—were inaccessible, so the Gulf localization story cannot be directly verified from primary
              documents here. India offers the opposite lesson: official labor and cyber-security institutions are easy
              to identify, which shows how many regulatory surfaces a payroll platform touches when it grows. The result
              is not proof that Darwinbox is non-compliant, but a clear diligence conclusion that country-by-country
              payroll design, ownership, and external counsel coverage need direct review.
            claimRefs:
              - CR011
