  - type: private-evidence-only
    severity: material
    topic: realized-enterprise-pricing
    missingEvidence: Most enterprise HCM vendors do not publish realized contract pricing, implementation fees, or renewal economics.
    whyItMatters: Without realized pricing it is difficult to compare Darwinbox's actual TCO advantage against Oracle, SAP, Workday, and Dayforce.
    diligencePath: Request anonymized customer proposals, implementation SOWs, discount schedules, and renewal benchmarks by employee band.
    relatedQuestionRefs:
    - QP014
    - QP025
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Public sources do not show Darwinbox's win rates, pipeline share, or deal-size mix against Oracle, SAP, Workday, Deel, or Rippling.
    whyItMatters: Competitive positioning depends on actual buyer conversion and displacement behavior, not just vendor marketing or analyst inclusion.
    diligencePath: Request CRM win-loss reports by region, competitor, and product module over at least the last eight quarters.
    relatedQuestionRefs:
    - QP021
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: local-compliance-depth
    missingEvidence: Public competitor pages do not provide enough granular country-by-country payroll and labor-law depth to score every vendor precisely.
    whyItMatters: Local compliance is a core reason buyers choose or reject HCM vendors, especially in APAC and MENA where Darwinbox claims strength.
    diligencePath: Request country coverage matrices, statutory update logs, and customer references for payroll-heavy deployments by vendor.
    relatedQuestionRefs:
    - QP019
    - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: pricing-comparison
    missingEvidence: Some competitors publish only partial list pricing or quote-only signals, so the public pricing table cannot be exhaustive on realized bundle economics.
    whyItMatters: Price transparency is itself a competitive attribute, but it is not the same as actual contract comparability.
    diligencePath: Supplement public pricing with customer and reseller interviews or enterprise procurement benchmarks.
    relatedQuestionRefs:
    - QP014
    - QP025
    relatedTableRefs:
