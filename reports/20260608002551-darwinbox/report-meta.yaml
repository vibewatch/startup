companyProfile:
  summary: >-
    Darwinbox is a 2015-founded HCM software company built first for Asia but now selling a
    broader enterprise HR platform globally. Public evidence supports meaningful scale — 1,000+
    enterprises, millions of employees managed, and active expansion into North America — while
    also showing a business still in investment mode, with high R&D intensity, incomplete margin
    disclosure, and valuation support that depends more on forward ARR execution than trailing
    financial proof.
  foundedDate: '2015-01-01'
  founders:
    - name: Jayant Paleti
      role: Co-founder & CEO
      background: >-
        Co-founder with investment-banking and transaction experience who helped frame the original
        Darwinbox thesis around poor people-data visibility in legacy enterprise systems.
      claimRefs:
        - CO001
        - CO003
    - name: Rohit Chennamaneni
      role: Co-founder & COO / President
      background: >-
        Former McKinsey and Google operator who helped shape Darwinbox's product and go-to-market
        push toward consumer-grade UX for enterprise HR software.
      claimRefs:
        - CO001
        - CO004
    - name: Chaitanya Peddi
      role: Co-founder
      background: >-
        Founder with HR consulting depth and direct exposure to enterprise HR workflows, grounding
        the product in real-world buyer requirements.
      claimRefs:
        - CO001
        - CO005
    - name: Vineet Singh
      role: Co-founder & CTO since 2024
      background: >-
        Long-time technology leader and platform builder who was elevated to co-founder status in
        2024 after serving as CTO.
      claimRefs:
        - CO002
  foundingLocation: Hyderabad, India
