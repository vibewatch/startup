  - id: retention-expansion-concentration
    title: Retention, Expansion, and Concentration Risk
    body: >-
      No NRR, GRR, or explicit cohort retention rate has been publicly disclosed by Darwinbox.
      This is the single most significant diligence gap in the customer chapter: for a B2B SaaS
      HCM platform whose value proposition depends on deep employee-data integration and
      multi-year commitments, the absence of any retention metric prevents independent judgment
      on durability. The closest proxies are (1) press release activity — the company continues
      to publish named customer go-live announcements in 2024 and 2025, including for
      customers originally contracted in 2022–2023, implying renewals are occurring; (2) review
      platform tenure data — multiple reviewers across G2, GetApp, and TrustRadius describe
      2+ year usage periods; (3) the payroll processing scale of 1.2 million payslips monthly,
      which is only sustainable with a large, stable customer base.

      Land-and-expand is visible in the deployment patterns: customers typically engage Darwinbox
      on core HRIS or attendance modules first, then expand to payroll and performance management
      as confidence builds. The Chinabank case illustrates this — phase 1 implementation covered
      performance management, recruitment, onboarding, engagement, and issue resolution in a
      compressed five-month window, with further modules presumably following. The hr.software
      review analysis confirms that buyers frequently start with one module and expand as the
      platform proves itself.

      Concentration risk is material on two dimensions. First, APAC — and particularly the Philippines,
      Indonesia, India, and GCC — accounts for the vast majority of public logos, with North America
      still in an early-traction phase. Second, the BFSI vertical is disproportionately represented
      in named press releases, making the customer quality assessment partially dependent on Darwinbox's
      BFSI-sector relationships. Positive: BFSI customers tend to have high switching costs, extensive
      configurations, and multi-year HR contracts, which structurally supports retention. The North
      America expansion (funded by the $140M + $40M capital rounds) and PwC UK/EU partnerships
      are designed to reduce geographic concentration, but progress is not yet measurable from public
      sources. The Reworked article notes Darwinbox's 40% lower TCO claim vs. "Workdays of the world,"
      which is the primary go-to-market pitch in North America, though this is company-claimed and
      not independently audited.
    claimRefs:
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU025
      - CU036
      - CU044
      - CU024
