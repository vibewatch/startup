      - TU005
    figureRefs:
      - FU004

  - id: verdict
    title: Customer Quality Verdict and Diligence Blockers
    body: >-
      Darwinbox's customer quality is assessed as medium-high: the breadth of named enterprise
      logos, multiple recent go-live press releases with headcount specificity, strong cross-platform
      review scores, and evidence of multi-year customer tenure give reasonable confidence in real
      adoption at scale. The 1,000+ enterprise customer count corroborated by multiple independent
      sources (KKR press release, UNLEASH, Reworked) represents a verified floor, not a ceiling.
      International revenue concentration shift (60%+ of new revenue from outside India) indicates
      genuine diversification momentum.

      However, the chapter carries three diligence blockers. First, NRR/GRR is undisclosed —
      the single most important customer quality metric for a recurring-revenue HCM platform is
      completely absent from public materials. Second, the largest named logos (Starbucks, Nivea,
      AXA, Cigna) lack independent confirmation of deployment scope, outcome metrics, or renewal
      history; they function as brand associations, not validated references. Third, persistent
      peak-load performance complaints across five independent review platforms suggest a product
      scalability challenge that could become a retention risk at the highest end of enterprise scale.
      These blockers should be addressed in primary diligence before advancing to later investment stages.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU028
      - CU004
      - CU012
      - CU015

