callouts:
  - calloutType: strength
    title: Credible Enterprise Logos with BFSI Depth
    body: >-
      Darwinbox has verified go-live press releases for six or more large BFSI institutions in
      Southeast Asia (2023–2025), including BPI (18,000 employees), Chinabank (11,000), and
      Security Bank Corporation in the Philippines, plus Bank BTPN and FKS Group in Indonesia.
      These are production deployments, not marketing references, and BFSI customers have
      structurally high switching costs — a strong retention signal.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU020
      - CU022

  - calloutType: strength
    title: Consistent Cross-Platform Review Scores Above 4.3/5
    body: >-
      Across five major review platforms (G2, Gartner Peer Insights, Capterra, SoftwareAdvice,
      GetApp), Darwinbox maintains ratings in the 4.3–4.7/5 range with no outlier low-score
      platform, suggesting broad satisfaction rather than cherry-picked references. TrustRadius
      8.5/10 further corroborates this.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011

  - calloutType: risk
    title: Persistent Peak-Load Performance Complaints Across All Review Platforms
    body: >-
      Performance degradation at peak load and slowness when accessing large reports is the
      single most recurring complaint across G2, SoftwareAdvice, GetApp, PeerSpot, and TrustRadius.
      This cross-platform consistency suggests a product scalability limitation, not an isolated
      configuration issue. If unresolved, this could limit Darwinbox's ability to win and retain
      the largest enterprise accounts.
    claimRefs:
      - CU012
      - CU015
      - CU034

  - calloutType: risk
    title: NRR/GRR Undisclosed — Critical Diligence Gap
    body: >-
      Darwinbox has disclosed no NRR, GRR, or cohort retention rate in any public document reviewed.
      For a recurring-revenue HCM SaaS platform at Series D+/unicorn stage, this opacity prevents
      independent valuation and is a prerequisite disclosure for institutional investors.
    claimRefs:
      - CU028
      - CU044

