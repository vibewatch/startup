  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: >-
      Estimated enterprise customer retention cohort for Darwinbox by geographic segment and
      deployment year. Darwinbox does not disclose NRR, GRR, or cohort retention rates; these
      estimates are derived from peer-group HCM SaaS benchmarks (enterprise HCM GRR 85–92% per
      industry surveys), multi-year review-platform tenure signals, and the absence of prominent
      public customer-departure announcements. Values should be treated as cross-industry
      illustrative estimates, not as company-disclosed metrics.
    approximationNotes: >-
      All cohort retention values are estimated using enterprise HCM SaaS GRR benchmarks
      (85–92% first-year retention per industry surveys, with year-on-year decline of 6–8pp
      thereafter). APAC and GCC estimates are anchored to higher switching-cost assumption
      (BFSI heavy, deep payroll/compliance config) vs. industry average. NA 2024 cohort
      values are speculative given near-zero public NA customer data. Darwinbox does not
      disclose any NRR, GRR, or cohort metrics; all values are illustrative and should be
      replaced with actuals in primary diligence. Values shown as integers (0–100) for
      schema compliance; they represent estimated gross retention percentages.
