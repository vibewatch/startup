  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-metrics
      missingEvidence: NRR, GRR, and enterprise churn rate for Darwinbox's customer base
      whyItMatters: >-
        These are the primary metrics for assessing the durability and quality of a recurring-revenue
        SaaS customer base. Without them, investment-stage valuation cannot be independently modeled
        and customer quality relies entirely on logo count and review scores.
      diligencePath: >-
        Request NRR and GRR trends for the last 3–4 annual periods in the data room; ask for
        cohort-level retention broken down by geography and vertical.
      relatedQuestionRefs:
        - QU011
        - QU026

    - type: private-evidence-only
      severity: material
      topic: named-customers
      missingEvidence: >-
        Independent case studies, deployment scope, and outcome metrics for largest anchor logos
        (Starbucks, Nivea, Cigna, T-Systems)
      whyItMatters: >-
        These logos drive the most investor confidence but are only company-claimed. Without independent
        corroboration of deployment scope and outcomes, the named-logo quality is overstated.
      diligencePath: >-
        Request reference calls with at least 3 of the anchor logos; ask for contract tenure and
        module breadth for each.
      relatedQuestionRefs:
        - QU004
        - QU022
        - QU013
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: north-america
      missingEvidence: >-
        Named North American or European enterprise customer go-lives or press releases from
        2024–2026
      whyItMatters: >-
        North America is the stated primary expansion target for the $180M capital raise, but no
        named NA customer has been publicly announced. The absence of NA press releases makes
        expansion claims unverifiable.
      diligencePath: >-
        Ask management for NA ARR and logo count in the data room; request an investor call with
        at least one NA reference customer.
      relatedQuestionRefs:
        - QU007
        - QU017

    - type: missing-source
      severity: material
      topic: adverse
      missingEvidence: >-
        Full text of Morning Context "Darwinbox hits a rough patch" article; independent
        corroboration of any significant operational or customer-related challenges
      whyItMatters: >-
        The Morning Context article title implies material business challenges, but paywall access
        prevents verification. No other independent adverse source has detailed specific customer
        failures or departures.
      diligencePath: >-
        Purchase or request a copy of the Morning Context article; search for employee reviews on
        Glassdoor or Blind for operational signal; conduct reference checks with 2–3 customers.
      relatedQuestionRefs:
        - QU007
        - QU023

    - type: private-evidence-only
      severity: material
      topic: geographic-concentration
      missingEvidence: >-
        Revenue or ARR breakdown by geography (India vs. other APAC vs. GCC vs. North America / Europe)
        and by vertical
      whyItMatters: >-
        The stated 60% international revenue share is company-claimed with no audit or breakdown.
        Without this, concentration risk in APAC and BFSI cannot be quantified.
      diligencePath: >-
        Request segmented ARR data by region and vertical in the data room; verify the international
        revenue growth claim with actual MCA filing cross-check where possible.
      relatedQuestionRefs:
        - QU014
        - QU017

