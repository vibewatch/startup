  - id: named-customer-proof
    title: Named Customer Proof and Deployment Patterns
    body: >-
      Darwinbox's investor materials consistently name Starbucks, Nivea, AXA, Cigna, WeWork,
      Crisil (an S&P company), and T-Systems as anchor logos, a list that has been stable since at
      least the March 2025 KKR investment press release and the August 2025 UNLEASH funding
      announcement. These names function as brand validators, but independent confirmation of
      deployment scope, module breadth, or outcome metrics for these specific logos is not publicly
      available. Their production status is inferred from repeated citation in investor materials,
      not from standalone case studies.

      By contrast, Darwinbox's newsroom contains a rich set of named BFSI and large-enterprise
      deployments with explicit go-live milestones and employee headcount. The most current is
      Chinabank (Philippines, fourth-largest private universal bank), which completed its full
      platform migration in June 2025, covering 11,000+ employees in five and a half months from
      contract signing in December 2024. The platform was internally branded "SyncHROne," indicating
      deep adoption. Bank of the Philippine Islands (BPI, 18,000 employees, first bank in the
      Philippines) went live in November 2023. Security Bank Corporation (Philippines) transformed
      its HCM operations in August 2024. Bank BTPN (Indonesia) and PT ASDP Indonesia Ferry
      adopted Darwinbox in August and September 2023, respectively. FKS Group, a Southeast Asian
      food and feed platform, launched Darwinbox as its group HCM in August 2023.

      The FeaturedCustomers platform lists 75 Darwinbox case studies and 1,576 total customer
      references (including a Workday comparison listing), providing broad social proof though
      the quality and recency of individual entries vary. The customer stories portal segments
      by industry (BFSI, Consumer Goods, IT Services, Retail, etc.) and by region (Southeast
      Asia, South Africa, UAE, US, UK), confirming multi-region deployment.

      G2's "Time to Implement" average of approximately two months across enterprise customers
      suggests a manageable implementation cycle, supported by the Chinabank case (5.5 months
      for a complex 11,000-employee full-suite deployment). PwC Middle East (January 2024)
      and PwC UK (October 2023) are now strategic implementation partners, which provides a
      channel for enterprise deployment acceleration and referenceability in those regions.
