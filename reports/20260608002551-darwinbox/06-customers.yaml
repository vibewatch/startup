  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver / concentration risk
      - Type
      - Impact
      - Current evidence
      - Diligence path
    rows:
      - - Module land-and-expand (core HRIS → payroll → performance → AI)
        - Expansion driver
        - High — each module expansion deepens stickiness and grows ACV
        - Chinabank phase-1 covers 5 modules; multiple G2/GetApp reviewers note multi-module use
        - Confirm average ACV uplift per additional module with management
      - - "Geographic expansion — India to APAC to GCC to UK/EU to North America"
        - Expansion driver
        - High — 5× international revenue growth in 2 years; TVG $40M targets NA
        - KKR and UNLEASH press releases; Reworked notes 40% lower TCO claim as NA pitch
        - Verify US customer names and ARR contribution; current NA logos are not public
      - - PwC ME and PwC UK system-integrator channel
        - Expansion driver
        - Medium — SI partnerships accelerate enterprise land in regions without direct sales
        - Darwinbox newsroom press releases confirming PwC ME (Jan 2024) and PwC UK (Oct 2023)
        - Verify pipeline and go-live count attributed to PwC channel
      - - APAC / BFSI concentration
        - Concentration risk
        - High — majority of named logos are Philippine / Indonesian / Indian banks or APAC enterprises
        - Darwinbox newsroom shows 6+ Philippine BFSI wins; investor materials highlight APAC base
        - Ask for revenue split by region and vertical in data room
      - - Top-customer concentration
        - Concentration risk
        - Medium — no single customer appears dominant but anchor logos (Starbucks, Nivea) are not revenue-quantified
        - No revenue-by-customer data publicly available
        - Request top-10 customer revenue concentration in diligence
      - - North America competitive risk
        - Concentration risk
        - High — Workday, Oracle, Rippling, Deel, BambooHR are entrenched in NA market
        - Reworked notes head-to-head competition with Workday, Oracle, Rippling, and others
        - Track NA ARR and logo-win rate quarterly; Gartner MQ "limited NA presence" is a known risk
      - - NRR opaqueness
        - Concentration risk
        - Critical — cannot model expansion economics without disclosed retention rate
        - No NRR disclosed in any public source; multiple investor press releases omit this
        - NRR / GRR disclosure is a prerequisite for investment-stage diligence
    notes: >-
      "Concentration risk" rows identify structural vulnerabilities in the customer base; "Expansion
      driver" rows identify mechanisms that could reduce concentration over time. Impact ratings are
      qualitative. All financial metrics (ACV, ARR, NRR) cited as null because they are not publicly
      disclosed.
    claimRefs:
