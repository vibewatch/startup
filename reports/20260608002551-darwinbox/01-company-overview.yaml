  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Exact March and August 2025 primary and secondary pricing by share class remains undisclosed publicly.
    whyItMatters: A precise entry valuation is required to judge whether Darwinbox sustained, regained, or slipped below unicorn pricing in 2025.
    diligencePath: Request the financing deck, cap table, and transaction summary distinguishing primary capital from secondary liquidity.
    relatedQuestionRefs:
    - QO008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited FY25 revenue, ARR, gross margin, and segment mix are not publicly disclosed in a consistent format.
    whyItMatters: Revenue quality and margin structure are essential inputs for the financials and valuation chapters and cannot be inferred safely from media snippets alone.
    diligencePath: Request audited FY24-FY25 financial statements, board packs, and a recurring-revenue bridge by geography and product.
    relatedQuestionRefs:
    - QO025
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: No official current employee count is published and third-party estimates range from roughly 1,150 to 1,400+.
    whyItMatters: Headcount affects burn-rate, productivity-per-employee, and operating-leverage assumptions used later in the report.
    diligencePath: Request an as-of-date employee census split by geography and function, then reconcile it with payroll and HRIS exports.
    relatedQuestionRefs:
    - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: Public sources name major investors but do not disclose full ownership percentages, board seats, or seller identities in secondary rounds.
    whyItMatters: Without a current cap table it is hard to assess governance control, liquidation preferences, or investor concentration risk.
    diligencePath: Request the latest cap table, shareholder agreement summary, and board / observer list.
    relatedQuestionRefs:
    - QO009
    - QO025
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: Some intermediate product and partnership milestones are referenced in secondary coverage but not disclosed in enough detail to build a fully exhaustive chronology.
    whyItMatters: A fuller chronology would help separate genuine product inflection points from marketing beats when assessing execution quality.
    diligencePath: Request a board-approved company timeline covering product launches, country launches, and governance events by quarter.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
sections:
- id: identity-and-positioning
  title: Identity, founding thesis, and platform scope
  body: |
    Darwinbox was founded in 2015 in Hyderabad by Jayant Paleti, Rohit Chennamaneni, and Chaitanya Peddi, with CTO Vineet Singh later elevated as the fourth co-founder as the company formalized its founding quartet [CO001][CO002]. Founder interviews and retrospective profiles show that the company emerged from a shared frustration with fragmented, legacy HR systems used by large enterprises, especially in Asia, where western incumbents often localized slowly and poorly [CO003][CO004][CO005][CO007]. That origin matters: Darwinbox was not built as a lightweight HR point solution, but as an end-to-end HCM suite intended to compete directly with SAP, Oracle, and later Workday in markets that needed mobile-first workflows, configurable local compliance, and faster product iteration [CO007][CO008][CO039].

    The current product positioning is much broader than the company’s original attendance-and-payroll entry wedge. Official, partner, and independent review sources now converge on Darwinbox spanning recruitment, onboarding, core HR, workforce management, payroll, performance, engagement, and analytics inside one cloud platform [CO008][CO009]. The company’s self-description has also shifted from an Asia-based upstart to an AI-native global platform, with recent messaging centered on agentic AI, Model Context Protocol support, and interoperability with enterprise stacks such as Microsoft Azure [CO014][CO026][CO043]. Even so, this chapter treats those claims as part of a broader transition story rather than proof of category leadership on their own, because several later-stage metrics remain self-reported or partially disputed [CO031][CO041].
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
