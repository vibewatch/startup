- id: TO005
  title: Open diligence issues and adverse signals
  columns:
  - Issue
  - Evidence observed
  - Why it matters
  - Current status
  rows:
  - - 2025 valuation opacity
    - TechCrunch called March 2025 an up-round while ET later cited a $950M blended valuation
    - Determines whether new investors truly paid above the 2022 unicorn price
    - Unresolved publicly
  - - Secondary-heavy transaction structure
    - March and August 2025 rounds both included secondary components
    - May imply partial liquidity rather than pure growth capital demand
    - Confirmed, exact mix undisclosed
  - - Revenue-definition conflict
    - ET cited Rs 392 crore FY24 total revenue; Entrackr cited Rs 333 crore operating revenue
    - Affects multiple-based valuation work and margin quality assessment
    - Unresolved publicly
  - - Headcount range
    - External estimates span roughly 1,150 to 1,400+
    - Impacts burn, productivity, and operating leverage assumptions
    - Unresolved publicly
  - - North America competition
    - Independent coverage lists Workday, Oracle, SAP, Deel, Rippling and others as live challengers
    - Tests Darwinbox’s ability to sustain US expansion without pricing pressure
    - Active risk
  - - Product scope edges
    - Review coverage flags weaker EOR and finance-management adjacency
    - Could limit category expansion outside core HCM
    - Active risk
  notes: This table intentionally isolates non-trivial caveats rather than repeating all strengths; each item should be revisited in later financials, product, and valuation chapters.
