- id: capital-scale-and-milestones
  title: Capital formation, operating scale, and milestone path
  body: |
    The company’s capital story breaks cleanly into three chapters. First, Darwinbox became a unicorn in early 2022 when TCV led a $72 million Series D that validated the product’s regional success and financed broader international ambition [CO026][CO027]. Second, Microsoft added a strategic investment in early 2023 alongside a deeper Azure and product-integration relationship, reinforcing Darwinbox’s interoperability narrative and offering a credible enterprise-distribution signal beyond pure venture backing [CO026]. Third, the company raised $140 million in March 2025 from Partners Group and KKR, then added another $40 million from Teachers’ Venture Growth in August 2025, turning the cap table into a mix of strategic software backers, crossover growth investors, and global pension capital [CO015][CO019][CO037].

    Scale also appears to have accelerated materially through 2024–2025. Public company and partner communications moved from roughly 900+ enterprises and 3 million employees in 2024 to 1,000+ enterprises and 4 million employees in 2025, while KKR and TechCrunch both emphasized that a majority of recent growth is coming from outside India [CO020][CO021][CO022][CO024][CO045]. Yet this strength is paired with the two most important diligence caveats in the chapter. First, March 2025 valuation reporting is inconsistent: TechCrunch described the financing as an up-round while Economic Times later described a largely secondary transaction at a blended $950 million valuation [CO016][CO017][CO018][CO041]. Second, externally visible operating metrics still vary sharply, with employee estimates ranging from about 1,150 to 1,400 and revenue estimates ranging from Rs 333 crore operating revenue to $100 million run-rate proxies [CO033][CO034][CO035][CO036][CO046].
