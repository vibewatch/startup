sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitute approaches
  body: |
    Darwinbox does not sell into the whole universe of “HR tech”; it participates in the narrower but still broad category of integrated HCM software. The relevant market includes core HR administration, payroll, workforce management, talent acquisition, performance, learning, and engagement modules delivered through suites or deeply integrated platforms [CM001][CM002]. Verified Market Reports is especially useful because it explicitly excludes manual HR processes and standalone payroll tools that are not connected to a broader HR system, which helps define what belongs inside the opportunity and what should stay outside it [CM003].

    That distinction matters because public market estimates otherwise look inconsistent. A buyer comparing Darwinbox with Workday, SAP, Oracle, Dayforce, Rippling, or UKG is not comparing labor outsourcing spend, generic consulting, or one-off HR tools; they are comparing integrated systems of record and workflow layers [CM004][CM010]. The status quo substitute set is therefore broad: disconnected local payroll engines, spreadsheets, legacy ERP HR modules, and best-of-breed point tools stitched together over time [CM016][CM020]. For Darwinbox, the important boundary is the cloud-first, suite-oriented segment where organizations want to unify employee data, workflows, analytics, and multi-country compliance rather than continue managing fragmented HR stacks [CM015][CM019].
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM010
  - CM015
