- id: constraints-and-diligence-implications
  title: Constraints, switching costs, and diligence implications
  body: |
    The HCM market is attractive partly because it is painful. Integration with legacy ERP stacks is frequently expensive, customization-heavy, and slower than vendor marketing suggests [CM028][CM029][CM030][CM031]. Data residency, AI auditability, and cybersecurity concerns increase the cost of operating across jurisdictions, especially for vendors that promise global payroll or AI-enabled hiring workflows [CM026][CM034][CM036]. These same frictions create switching costs that protect incumbents after deployment, but they also lengthen sales cycles and create risk for challengers that must prove implementation quality, not just product breadth [CM028][CM032][CM038].

    Failure case evidence underscores how serious the downside can be. CIO, Red Pill Labs, and GAO all document projects where unclear requirements, weak governance, poor testing, or payroll complexity led to cost blowouts, schedule slips, or employee pay errors [CM032][CM033]. For Darwinbox, the implication is clear: the market is large enough and strategically important enough to support multiple winners, but actual value creation depends on narrow execution disciplines—local compliance, safe migration, data integrity, and customer success. Public evidence can bound the opportunity, but it cannot yet build a precise Darwinbox SAM/SOM or a credible implementation-risk benchmark without company data [CM040][CM041].
