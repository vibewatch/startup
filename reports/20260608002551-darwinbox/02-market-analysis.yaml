callouts:
- calloutType: insight
  title: The broad TAM is less useful than the filtered SAM
  body: For Darwinbox, the real investable question is not whether global HR software is a large market; it is how much large-enterprise, cloud-first, multi-country HCM spend can be won by a challenger with strong APAC/MENA roots and selective U.S. expansion.
  claimRefs:
  - CM010
  - CM038
  - CM039
  - CM041
- calloutType: risk
  title: Implementation is the main market tax
  body: HCM demand is robust, but value leaks out in migration, integration, testing, localization, and change-management work that buyers often underestimate and vendors tend to understate during the sale.
  claimRefs:
  - CM028
  - CM029
  - CM030
  - CM031
  - CM032
- calloutType: strength
  title: Darwinbox is pointed at the right buyer segment
  body: Analyst and procurement sources place Darwinbox inside the same HCM-suite and AI-HCM evaluation set as Workday, Oracle, SAP, Dayforce, and Rippling, which means it is showing up where enterprise buyers are actually screening global platforms.
