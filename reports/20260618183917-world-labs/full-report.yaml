      - - API platform with partner integrations (OpenArt, Magnific, Rosebud, VIVERSE, Lightcraft)
        - 'Multi-homing: partners on standard API terms can redirect to NVIDIA Cosmos or Luma AI with low switching cost'
        - High
        - >-
          Request contract terms, minimum volume commitments, and exclusivity clauses; assess integration depth
          (feature-level vs. workflow-level)
