      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              World Labs' market is not monolithic: each of the four identified buyer segments has a distinct buyer
              persona, budget owner, adoption trigger, and sales motion. Understanding this heterogeneity is critical
              for assessing whether World Labs' current product (subscription SaaS + API) can serve all four
              simultaneously or requires segment-specific go-to-market.


              The media and creative production segment consists of independent filmmakers, digital artists, VFX
              studios, and AI-native creative teams. These buyers access Marble primarily as individual subscribers or
              through small studio subscriptions; the Pro tier ($35/month) is the relevant price point. The use case, as
              documented in the creative film case study, is using Marble as a persistent virtual backlot that
              eliminates per-shot scene rebuilding and maintains spatial consistency across AI-generated video takes.
              The adoption trigger is the consistency problem in generative video — a widely reported limitation that
              spatial anchoring from world models directly solves.


              The robotics and embodied AI segment consists of university research labs, robotics startups, and R&D
              teams at hardware OEMs. Budget typically flows from R&D grants, venture capital, or internal lab
              allocations. The adoption trigger is a data bottleneck: the World Labs robotics case study explicitly
              characterizes "high-quality, diverse simulation data" as "one of the biggest limiting factors in robotics
              research," and demonstrates Marble generating thousands of physically accurate scenes exportable as
              MuJoCo- and Isaac Sim-compatible environments. DeepMind's Genie 2 and SIMA, and NVIDIA's Cosmos platform,
              all validate the demand for scalable, diverse 3D training environments, even though they address slightly
              different parts of the embodied AI workflow. The bottom-up SAM for this segment is estimated at $0.5B–$2B,
              but evidence is sparse.


              The architecture and design (AEC) segment uses Marble for concept-to-3D immersive visualization —
              compressing the sketching and rendering phases into a single explorable spatial world. Early partners
              Fenestra and Interior AI provide customer-proof for this workflow. The relevant budget owner is the design
              firm principal or tool vendor integrating Marble via API; the Autodesk partnership ($200M investment)
              signals this vertical's strategic importance. The payer is typically a B2B SaaS seat or API integration
              budget.


              The developer and API segment is the most expansive but least penetrated: any software product requiring
              on-demand 3D environment generation can integrate the World API. The adoption trigger is the technical
              availability of a programmable world generation endpoint, analogous to how OpenAI's API expanded LLM use
              into thousands of applications. This segment has the highest long-run potential but requires a developer
              ecosystem, documentation maturity, and latency/cost performance that World Labs is still building.


              Luma AI's interactive 3D scenes (embeddable, universally shareable 3D at 8–20 MB and 30 FPS) demonstrate
              that the developer/creative segment is responsive to spatial 3D products with good web delivery
              performance, setting a benchmark World Labs must meet on the Spark 2.0 streaming platform.
