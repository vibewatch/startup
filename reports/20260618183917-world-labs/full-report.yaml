        - label: Base scenario (2028 estimate)
          low: 750
          mid: 1600
          high: 2400
          unit: $M
          note: $30–80M ARR at 25–30x; controlled commercial growth
        - label: Bull scenario (2028 estimate)
          low: 3000
          mid: 7000
          high: 12000
          unit: $M
          note: $100–300M ARR at 30–40x; Autodesk channel + API scale
        - label: Current implied (Bloomberg, unconfirmed)
          low: 5000
          mid: 5000
          high: 5000
          unit: $M
          note: Bloomberg-reported ~$5B; World Labs declined to confirm
    approximationNotes: >-
      All scenario values are analytical estimates. World Labs has disclosed no revenue. The Bloomberg-reported $5B is a
