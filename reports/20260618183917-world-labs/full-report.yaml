      - number: '7.2'
        title: Operational and Technical Risk
        blocks:
          - type: paragraph
            body: >
              World Labs' core product, Marble, is a compute-intensive generative pipeline that converts text, image,
              video, or multi-view inputs into 3D Gaussian splat environments through an asynchronous processing
              architecture. Each World API call triggers a full 3D world generation job — substantially more
              resource-intensive than text or image inference. At scale, inference demand creates an operational risk:
              if GPU supply is constrained, World Labs faces service degradation or rate-limiting that directly caps
              developer adoption. No service-level agreement (SLA) or uptime guarantee has been disclosed publicly.


              On security, World Labs maintains a responsible disclosure programme via security@worldlabs.ai but
              operates no public bug bounty, meaning external researchers have limited financial incentive to
              proactively surface vulnerabilities. The absence of published third-party penetration testing, SOC 2
              attestation, or ISO 27001 certification leaves enterprise buyers reliant on trust rather than
              independently audited assurance. This gap is operationally material because the World API processes
              customer-uploaded images, video, and 3D assets — including potentially sensitive proprietary scenes for
              architecture, defence, and industrial simulation workflows.


              The 3D generation field faces a persistent sim-to-real fidelity challenge for robotics and embodied-AI
              applications. The ArXiv survey on 3D generation for embodied AI (arXiv:2604.26509) identifies limited
              physical annotations, geometry-realism gaps, fragmented evaluation, and the persistent sim-to-real divide
              as primary bottlenecks. For World Labs' robotics use cases, this is not hypothetical: if Marble-generated
              environments lack physical accuracy sufficient for robot policy training, the high-value enterprise use
              cases face a fidelity ceiling that competitors with physics-native simulation platforms (NVIDIA Isaac Sim
              with Cosmos) may reach first. Deloitte's 2025/2026 AI adoption survey identifies regulatory compliance and
              workforce readiness as the leading barriers to enterprise AI adoption — both directly relevant to World
              Labs' target customers.
