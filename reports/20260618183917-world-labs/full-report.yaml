  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              World Labs operates at the intersection of three converging regulatory fronts: AI-specific legislation (EU
              AI Act, California SB 1001), intellectual property law (copyright in AI training data and outputs), and
              export control (US Export Administration Regulations). The EU AI Act, adopted by the European Parliament
              in March 2024 with 523 votes in favour, establishes a risk-based framework that classifies general-purpose
              AI (GPAI) models above defined computational thresholds as subject to enhanced transparency and safety
              obligations. World Labs' Marble constitutes a GPAI model under this definition; its AUP explicitly
              acknowledges this exposure by categorising regulated uses under the EU AI Act as "High-Risk Uses."
              Conformity assessments, technical documentation requirements, and third-party audit obligations may apply
              to the World API once it reaches scale in European markets, adding compliance overhead and potential
              deployment delays.


              On intellectual property, the US Copyright Office released Part 3 of its AI report in pre-publication form
              in May 2025, examining the legality of training data scraping and the copyrightability of AI-generated
              outputs. Part 2 (January 2025) already established that outputs lacking human authorship cannot be
              copyrighted in the US. World Labs has not disclosed the licensing basis for its Marble training data,
              which likely includes web-scraped images, 3D scans, and video — all subject to competing ownership claims.
              Enterprise customers require clean IP chains to incorporate generated 3D environments into commercial
              workflows; any downstream infringement claim against Marble-generated content would affect customer
              confidence and create indemnification liability under the Terms of Service.


              The Bureau of Industry and Security Export Administration Regulations (EAR, 15 CFR 730-774) apply to AI
              model weights and related technology classified as dual-use. Cross-border API access to the World API
              creates possible export control exposure. NIST's AI Risk Management Framework provides voluntary guidance
              but does not carry force of law, meaning enterprise customers must rely on World Labs' own compliance
              posture — which has not been publicly disclosed. World Labs has not announced any third-party security
              certification (SOC 2, ISO 27001) or regulatory pre-approval for enterprise deployment as of June 2026.
            claimRefs:
