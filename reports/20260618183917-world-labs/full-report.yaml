      - number: '4.2'
        title: GTM Motion and Enterprise Developer Proxies
        blocks:
          - type: paragraph
            body: >-
              World Labs is running a hybrid go-to-market that combines a product-led self-serve motion for individual
              creators with a targeted enterprise and developer-partner channel. The two motions are complementary: the
              self-serve tier generates adoption signals, creator content, and social proof that supports the enterprise
              pitch, while enterprise partnerships like Autodesk provide access to large installed customer bases that
              the direct self-serve channel cannot reach efficiently at World Labs' current team scale.


              The self-serve subscription funnel is the most legible GTM motion. Marble is available at worldlabs.ai
              with no sales-assisted onboarding required for the consumer and prosumer tiers. Case studies published on
              the World Labs website document how individual filmmakers, game creators, architects, and designers
              adopted Marble without enterprise contracts: Joshua Kerr (filmmaker) used Marble with Lightcraft Jetset
              for virtual production; Tim Simmons and Henrik Vasquez (Theoretically Media) used Marble as a virtual film
              set to maintain shot consistency across AI-generated scenes; architects via Fenestra and Interior AI used
              Marble for immersive design visualization. These use cases land in the Standard to Pro tier price range.


              The developer and API channel is represented by the World API and by six named third-party platform
              integrations: OpenArt (launched "OpenArt Worlds" as a persistent 3D environment feature for its creator
              platform), Magnific (integrated Marble for precise product-placement control), Rosebud AI (embedded Marble
              world generation in its game-building pipeline), VIVERSE (used Marble to generate interactive
              browser-playable 3D worlds), and Escape (gamification and interactive experience platform). A seventh
              integration — NVIDIA Isaac Sim researchers using Marble for robotics simulation data generation — spans
              into the enterprise and research segment, demonstrating that the API has technical credibility in
              high-stakes robotics and embodied AI contexts.


              Sales efficiency proxies are not publicly available. There is no evidence of disclosed customer
              acquisition cost, average contract value, payback period, or net revenue retention for any tier. The
              absence of these metrics, combined with the Autodesk partnership focus on "exploration" and the joint
              research-and-model collaboration framing, suggests the enterprise sales motion is still in early-stage
              commercial development rather than a scaled repeatable cycle. Deloitte's analysis of enterprise AI
              adoption identifies compliance complexity, workforce readiness, and regulatory uncertainty as primary
              friction points that extend sales cycles for AI platform companies broadly — this applies directly to
              World Labs' longer-term enterprise go-to-market ambitions.
