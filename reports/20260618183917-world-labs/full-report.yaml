              rendering on any device with a web browser—a capability not visible in Luma AI's or NVIDIA Cosmos's public
              documentation. Luma AI's interactive scenes embed at 8 MB (objects) and 20 MB (scenes) at 30 FPS across
              iOS, Android, and web; Luma has also released RAY3.2 for directed video and UNI-1 for brand-specific model
