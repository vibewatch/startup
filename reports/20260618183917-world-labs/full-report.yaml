      - number: '1.2'
        title: Leadership and Founders
        blocks:
          - type: paragraph
            body: >
              World Labs was co-founded by four researchers whose combined output spans the most influential advances in
              computer vision, neural rendering, and 3D graphics of the past decade.


              Fei-Fei Li is CEO and co-founder. She holds the Sequoia Professorship in Computer Science at Stanford
              University and is Founding Co-Director of Stanford's Human-Centered AI Institute (HAI). From 2017 to 2018
              she served as VP and Chief Scientist of AI/ML at Google Cloud. Li is the architect of ImageNet, the
              large-scale visual dataset that catalyzed the deep learning revolution in computer vision and is widely
              credited as one of the foundational elements of modern AI. She has been named to Time Magazine's 100 Most
              Influential People in AI and was appointed to the UN Secretary-General's Scientific Advisory Board. Li's
              concurrent Sequoia Professorship at Stanford creates a dual-role arrangement she described as continuing
              "some of her work at Stanford while building the startup," representing material key-person concentration
              risk.


              Ben Mildenhall is co-founder and the primary inventor of Neural Radiance Fields (NeRF, arXiv:2003.08934),
              the technique that transformed 3D scene reconstruction from multi-view images and became one of the most
              cited AI papers of the 2020s. NeRF is foundational to the rendering pipeline that underlies Marble's world
              generation capabilities.


              Christoph Lassner is co-founder and previously led research teams at Meta Reality Labs Research and Epic
              Games. He completed his PhD at the Max Planck Institute for Intelligent Systems in Tübingen. He is the
              author of Pulsar (arXiv:2004.07484), a differentiable sphere-based renderer now integrated as the
              sphere-based backend of PyTorch3D, and has published extensively on human pose estimation and neural scene
              rendering.


              Justin Johnson is co-founder and is now an assistant professor at the University of Michigan (EECS),
              having previously collaborated with Li at Stanford's AI Lab. Board composition, investor board seats, and
              governance structure are not publicly disclosed, representing a material gap for governance diligence.
