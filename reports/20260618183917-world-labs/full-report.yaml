      - - Capital depth ($1.23 B raised; NVIDIA + AMD + Autodesk as strategics)
        - >-
          Capital concentration in foundational AI giants dwarfs World Labs' capital base; Crunchbase data shows $188 B
          raised by OpenAI/Anthropic/xAI/Waymo in Q1 2026 alone
        - High
        - >-
          Assess runway, burn rate, and next funding trigger; evaluate whether NVIDIA strategic investment restricts
          product roadmap flexibility
      - - NVIDIA as strategic investor and ecosystem partner (Isaac Sim integration)
        - >-
          NVIDIA's Cosmos product directly overlaps the robotics simulation use case; investor alignment may not prevent
          competitive product moves
        - High
        - >-
          Obtain independent legal review of strategic investment agreement; assess whether rights-of-first-refusal,
          board seat, or roadmap influence terms exist
    notes: >
      Severity ratings (High / Medium / Low) are editorial assessments based on available public evidence; they are not
      derived from a formal risk model. Mitigations are diligence actions, not confirmed company practices. The table
      covers moat dimensions with publicly supportable evidence; additional proprietary moat factors may exist but are
      not assessable from public sources.
