  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Surfaces
        blocks:
          - type: paragraph
            body: >-
              World Labs currently monetizes through two primary product surfaces: a direct subscription service for the
              Marble world-generation platform and a programmatic API that exposes the same capabilities to developers
              and enterprise teams. A third surface — strategic partnership revenue via Autodesk — is present but its
              commercial terms have not been made public beyond the $200 million investment disclosure.


              The Marble subscription spans four tiers. Free access allows limited world generations with no commercial
              rights. Standard at $20 per month expands the generation budget. Pro at $35 per month adds explicit
              commercial usage rights, which is the first tier that permits creators to embed Marble outputs in paid
              deliverables. Max at $95 per month provides all features including the highest-fidelity outputs. This
              pricing arc is positioned between prosumer creative tools and professional 3D software: cheaper than seat
              licenses for high-end DCC software such as Cinema4D or Houdini, but meaningfully above commodity
              image-generation tools. Realized revenue mix across tiers is not disclosed; the relative weighting of
              Free, Standard, Pro, and Max users is unknown.


              The World API, launched January 21, 2026, enables developers to call Marble world generation
              programmatically from text, images, panoramas, or video inputs. The API produces an asynchronous job that
              delivers a fully navigable 3D world. No public pricing schedule for the API has been observed as of June
              2026, which is typical for early enterprise API products where pricing is negotiated per customer or gated
              behind an application process. The API's design — submit request, receive navigable world — is
              architecturally consistent with usage-based token or credit pricing, but this is inferred rather than
              confirmed by any public disclosure.


              The Autodesk partnership is the most visible enterprise monetization signal. Autodesk invested $200
              million and will serve as a strategic adviser with an initial focus on media and entertainment use cases.
              No contract value, revenue-share terms, or product integration roadmap beyond the initial entertainment
              focus has been disclosed. The partnership could develop into a reseller or embedded-API arrangement as
              Autodesk integrates Marble capabilities into its design and construction toolchain, but this remains
              prospective rather than evidenced.


              Commercial usage rights — the monetization dividing line between hobbyist and professional use — are
              included starting at the Pro tier at $35 per month. This structural feature is important for financial
              modeling: it means any subscriber seeking to use Marble outputs in client work, media production, or
              embedded products must be on Pro or Max, concentrating commercial-intent subscribers in the two higher
              tiers that represent the most durable and defensible revenue. Whether the Free and Standard tiers serve
              primarily as conversion funnels or generate meaningful churn remains unknown.
