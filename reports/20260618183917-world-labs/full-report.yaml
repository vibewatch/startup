  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              World Labs' Marble competes across four distinct competitive layers. First, direct world-model peers:
              Google DeepMind's Genie 2 (December 2024) is a foundation world model that generates action-controllable,
              playable 3D environments from a single prompt image, primarily targeting AI agent training rather than
              commercial content workflows. Luma AI, headquartered in Palo Alto, declares its mission as building
              "unified general intelligence that can generate, understand, and operate in the physical world" and offers
              interactive 3D scenes at 30 FPS on web browsers—competing directly for the creative generation market
              World Labs targets. Second, infrastructure incumbents: NVIDIA Cosmos (version 3) is an open physical AI
              foundation model freely available on GitHub and a hosted catalog, covering vision AI reasoning, robot
              policy training, world simulation, and synthetic video data generation. NVIDIA Isaac Sim, an open-source
              simulation framework built on Omniverse, integrates Cosmos world foundation models for robotic synthetic
              data augmentation and competes directly with Marble in the robotics simulation use case. Third, adjacent
              creative-AI platforms: Magnific (formerly Freepik), OpenArt, and Stability AI's Stable Zero123 share
              overlapping capability territory at the object-generation and 2D-to-3D level, though none have shipped a
              scene-scale generative world model API equivalent to Marble. Fourth, distribution partners that are
              simultaneously substitutes: OpenArt, Magnific, Rosebud AI, VIVERSE (HTC), and Lightcraft currently
              distribute Marble through integrations, but each could reduce reliance on World Labs if an alternative or
              in-house world model became available. The status quo—manual 3D creation in Blender, Autodesk Maya, or
              game engine asset workflows—remains a cost-effective alternative for buyers unwilling to adapt pipelines
              to generative AI tools, and internal build (custom world simulation code, open-source academic models like
              Magic123) is feasible for well-resourced teams. Google DeepMind's SIMA agent framework adds a
              complementary research layer that, if commercialized, would extend DeepMind's footprint into the agentic
              use cases World Labs targets through its API.
