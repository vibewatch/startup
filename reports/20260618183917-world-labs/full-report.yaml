      - number: '2.2'
        title: Evidence-Constrained Market Sizing
        blocks:
          - type: paragraph
            body: >
              No analyst report reviewed for this chapter isolates "spatial intelligence" or "3D generative AI" as a
              standalone market category. Sizing must therefore be assembled from three proximate lenses: (1) the broad
              generative AI market as an upper bound, (2) the digital twin and simulation infrastructure market as a
              functional proxy for spatial AI's simulation segment, and (3) bottom-up estimates derived from vertical
              buyer penetration analysis.


              Global Market Insights (January 2026) values the global generative AI market at USD 53.7 billion in 2025,
              rising to USD 83.3 billion in 2026, with a 2035 forecast of USD 988.4 billion at a CAGR of 31.6%. This
              figure covers all generative AI products — text, image, audio, video, and multimodal — and is far too
              broad to serve as a practical addressable market for World Labs. It does, however, confirm the investor
              and buyer context: all generative AI categories are experiencing rapid deployment and spending growth.


              MarketsandMarkets (2024, updated through mid-2025 data) forecasts the global digital twin market at USD
              21.14 billion in 2025 growing to USD 149.81 billion in 2030 at a CAGR of 47.9%. The digital twin market is
              arguably the closest functional analog to World Labs' infrastructure positioning, as digital twins require
              the same class of spatial representation and simulation capability that Marble provides. The full digital
              twin market includes hardware, IoT integration, and sector-specific applications not addressable by World
              Labs, but even a 10–15% software/AI sub-segment implies a several-billion-dollar opportunity by 2030.


              A bottom-up lens using buyer penetration produces rougher estimates: the robotics and embodied AI training
              data segment is estimated in the literature at roughly $0.5B–$2B in addressable simulation infrastructure
              spend globally; the architecture and design visualization AI segment is estimated at $0.3B–$1B; the
              developer API and creative segments are early-stage with no reliable floor or ceiling. These bottom-up
              ranges are highly uncertain — they depend on assumptions about what share of robotics R&D budget is
              allocated to simulation environment creation versus other research costs — but they confirm that World
              Labs' realistic near-term SAM is likely sub-$5B.


              The range figure in this section (FM002) shows the spread of estimates for the digital twin market (the
              best-available proxy) across analyst sources and scenarios. Contradictory estimates are preserved, not
              averaged; the uncertainty is itself a material analytic finding. The pyramid figure (FM001) shows the
              three-layer TAM/SAM/SOM structure for market addressability.
