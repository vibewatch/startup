    title: Valuation / Return Range — Bull, Base, Bear (2028 Horizon, All Estimates)
    type: range
    layout: wide
    summary: >-
      Scenario valuation ranges for World Labs under bull, base, and bear assumptions with the Bloomberg-reported
      implied valuation shown for reference. All figures are estimates.
    data:
      items:
        - label: Bear scenario (2028 estimate)
          low: 50
          mid: 150
          high: 225
