      - number: '1.4'
        title: Milestones, Scale, and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              World Labs' operational history from founding to June 2026 spans approximately 30 months. The company has
              proceeded on a compressed timeline from founding, through stealth operations, to first product launch, API
              availability, and a major strategic financing round.


              The company was founded in 2023; the exact incorporation date is not publicly disclosed, but Fei-Fei Li
              wrote in November 2025 that cofounders had created World Labs "more than one year ago," anchoring founding
              to no later than late 2023. The team operated in stealth through mid-2024, numbering approximately 20
              employees by the time of stealth exit in September 2024. Marble limited beta launched alongside a
              "Generating Worlds" research preview in late 2024, followed by the general availability of Marble on
              November 12, 2025, roughly 14 months after the seed announcement. The World API launched January 21, 2026,
              and the $1 billion Series B closed February 18, 2026. A functional taxonomy of world models was published
              June 3, 2026.


              Partnership and integration signals: Autodesk is the primary disclosed enterprise partner. The company has
              published case studies with creative-workflow integrators including OpenArt, Lightcraft, Magnific, Rosebud
              AI, Viverse, and Escape in gaming, VFX, and film domains, though these are not disclosed as paid
              commercial contracts.


              Adverse and gap signals: World Labs carries substantial key-person concentration risk in Fei-Fei Li's dual
              role at the company and Stanford. No board composition, no independent director names, and no governance
              documentation are publicly available. The company has raised $1.23 billion without disclosing any revenue,
              positioning investors entirely on thesis and team rather than commercial traction.


              The EU AI Act (adopted March 2024, entering application in phases from August 2024) creates compliance
              obligations for general-purpose AI model developers in EU markets, including transparency and copyright
              due-diligence requirements relevant to World Labs' training data practices and API outputs. U.S. Bureau of
              Industry and Security export control regulations (EAR, 15 CFR Parts 730-774) may also apply to World Labs'
              AI technology with dual-use potential. World Labs' Terms of Service and Acceptable Use Policy explicitly
              restrict uses involving bioweapons development, deceptive deepfakes, and interference with critical
              infrastructure, signaling awareness of these regulatory vectors.
