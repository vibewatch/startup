  - id: FV002
    title: Valuation Sensitivity to Assumed ARR (Base Revenue Multiple 25x, All Estimates)
    type: bar
    layout: wide
    summary: >-
      Estimated implied valuation under a fixed 25x revenue multiple assumption at varying ARR levels for 2028 horizon.
      All values are scenario estimates, not forecasts.
    data:
      items:
        - label: 'Bear: $5M ARR × 25x'
          value: 125
        - label: 'Bear-mid: $15M ARR × 25x'
          value: 375
        - label: 'Base-low: $30M ARR × 25x'
          value: 750
        - label: 'Base: $80M ARR × 25x'
          value: 2000
        - label: 'Bull-low: $150M ARR × 25x'
          value: 3750
        - label: 'Bull: $300M ARR × 25x'
          value: 7500
    approximationNotes: >-
      All ARR figures are scenario assumptions, not forecasts. World Labs has not disclosed revenue. 25x is an
      illustrative multiple drawn from comparable high-growth private AI companies; actual market multiples at exit will
      vary. Bloomberg-reported implied valuation of ~$5B aligns roughly with $200M ARR at 25x — a commercial target that
      would require substantial enterprise distribution. Values shown in USD millions.
    claimRefs:
      - CV019
      - CV026
      - CV027
      - CV028
