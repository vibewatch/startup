      - number: '5.2'
        title: Architecture and Technology Stack
        blocks:
          - type: paragraph
            body: >-
              World Labs' technical architecture consists of four tightly coupled layers: the Marble generative world
              model, the Spark 2.0 web renderer, the World API delivery surface, and the export and integration
              pipeline. Each layer builds on prior research conducted by the founding team, giving World Labs an
              unusually direct path from published academic IP to deployed product.

              The Marble world model is described by the company as a multimodal architecture that lifts whatever input
              signals are available — text, image, video, spatial layout — into a unified 3D world representation. The
              model supports full iterative editing, including element-level modifications, expansions, and combination
              of independently generated worlds. Marble exports collider meshes alongside visual splat data, which is
              essential for physics-based simulation integration. The company published a taxonomy blog in June 2026
              classifying world models into renderers, simulators, and planners operating within a perception-action
              loop, indicating a deliberate architectural roadmap toward agentic and simulation capabilities.

              Spark 2.0 is World Labs' web renderer, built using THREE.js and WebGL2 and supporting desktop, iOS,
              Android, and VR devices including Meta Quest 3. Spark was developed internally because existing web-based
              3DGS renderers could render only one 3DGS object at a time, lacked dynamic animation ("4DGS"), and did not
              run reliably across devices. Spark 2.0 introduced a Level-of-Detail streaming system that adaptively
              adjusts 3DGS detail to the user's viewpoint and streams data in real time, enabling kilometer-scale
              environments to run on mobile devices and low-bandwidth connections. The renderer supports real-time
              editing, relighting, and a shader graph for dynamic splat-based effects.

              3D Gaussian Splatting (3DGS), the core scene representation used by Marble and Spark, represents scenes as
              millions of semi-transparent colored ellipsoids ("splats") sorted and rendered via alpha compositing. The
              technique, published in ACM TOG 2023, achieves real-time rendering at 30+ fps at 1080p resolution, a
              critical threshold for interactive browser and VR delivery. Co-founder Ben Mildenhall authored the
              original NeRF paper at ECCV 2020, establishing the neural radiance field representation that underpins
              modern neural rendering. Co-founder Christoph Lassner authored Pulsar (arXiv 2004.07484), a sphere-based
              differentiable renderer orders of magnitude faster than competing methods. These foundational works are
              directly instantiated in Marble and Spark, giving the product a first-principles IP advantage over teams
              building on top of published implementations.
