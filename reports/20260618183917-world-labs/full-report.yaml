      - number: '5.5'
        title: Trust, Safety, Security, and Compliance
        blocks:
          - type: paragraph
            body: >-
              World Labs has published three public-facing policy documents that define its trust and compliance
              posture: a Terms of Service (effective January 21, 2026), a Privacy Policy (effective November 12, 2025),
              and an Acceptable Use Policy (AUP, last modified November 12, 2025). The AUP is the most operationally
              relevant for enterprise diligence: it explicitly prohibits generating child sexual abuse material,
              designing or facilitating weapons of mass destruction, developing tools for unauthorized surveillance or
              critical infrastructure attacks, and creating deceptive synthetic media that harms individuals without
              consent. These prohibitions are enforceable under the TOS and can result in account termination.

              The security posture is notably limited relative to enterprise software norms. The security page at
              worldlabs.ai/security describes a responsible disclosure program directing reports to
              security@worldlabs.ai, but explicitly states that World Labs does not currently operate a public bug
              bounty program and does not guarantee compensation for vulnerability reports. No mention of penetration
              testing cadence, infrastructure security architecture, data encryption standards, or access control
              policies appears in the public-facing documentation. No SOC 2 Type II, ISO 27001, or AI-specific
              certification (such as conformance with the NIST AI RMF or EU AI Act provisions) was identified on the
              company website as of June 2026.

              The Privacy Policy identifies collection of account information, usage data, prompt inputs, generated
              content interactions, and data from third-party integrations. The policy does not specify data retention
              periods or describe whether user-submitted images or prompts are used for model training, which is a key
              question for enterprise customers whose proprietary design or simulation inputs may inform the model.

              From a regulatory perspective, no enforcement actions, regulatory inquiries, or litigation related to
              World Labs' products were identified during research. NIST's AI Risk Management Framework (AI RMF)
              represents the reference standard for responsible AI deployment, and World Labs' current documentation
              does not claim conformance with or describe mapping to the AI RMF. As the company moves into enterprise
              verticals — particularly robotics and architecture — enterprise procurement processes will require more
              structured security and compliance documentation than currently exists.
