      - number: '3.3'
        title: Moat, Switching Cost, and Distribution Power
        blocks:
          - type: paragraph
            body: >
              World Labs' structural moat rests on three pillars: founder credibility and talent magnetism, capital
              depth, and API embedding in downstream platforms. The co-founder lineup—Fei-Fei Li (ImageNet, computer
              vision), Ben Mildenhall (NeRF), Christoph Lassner, and Justin Johnson (3D representations)—creates a
              recruiting and credibility advantage that manifests in research velocity and enterprise trust-building.
              The $1.23 B total raise (announced seed plus February 2026 round backed by NVIDIA, AMD, and Autodesk)
              provides a multi-year runway to invest in model scale, data infrastructure, and developer ecosystem. The
              API embedding strategy—where partners like OpenArt, Magnific, Rosebud AI, and VIVERSE build Marble-powered
              features into their own products—creates switching costs at the partner level once their end-users engage
              with and rely on Marble-generated 3D environments. However, contractual lock-in terms are not publicly
              disclosed, and multi-homing risk is real: a partner operating on standard API terms can redirect traffic
              to an alternative provider within weeks. The Marble Labs showcase catalogue (over 20 public demos: VR
              Gaussian splats, collider builders, avatar tools, architectural spatial blueprints, and others) is
              building developer ecosystem breadth, but individual demo commercial traction is unknown. NVIDIA's
              simultaneous role as a strategic investor and as the developer of the Cosmos competitor creates an
              inherent tension: NVIDIA could influence Cosmos's roadmap to absorb World Labs' robotic simulation use
              case, potentially using its Omniverse and Isaac Sim distribution network to commoditize the space.
              Switching costs for developers building directly on the World API are moderate: the API interface is
              novel, and downstream integrations (partner product features, simulation pipelines) would require
              engineering rework to migrate, but there are no disclosed data-portability restrictions or non-compete
              clauses.
