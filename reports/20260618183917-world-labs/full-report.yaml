            title: All Scenario Valuations Are Estimates — Not Forecasts
            body: >-
              The bull, base, and bear scenario valuations in this chapter are explicitly analytical estimates
              constructed from assumed revenue levels and illustrative revenue multiples drawn from comparable
              high-growth private AI companies. World Labs has not provided revenue guidance, and no revenue has been
              disclosed. Readers should treat all scenario numbers as directional inputs to investment decision framing,
              not as price targets or revenue forecasts. The Bloomberg-reported $5 billion implied valuation is
              reproduced as a market reference point; World Labs has declined to confirm this figure.
            calloutType: assumption
