              developers with open-source model weights, covering text, image, video, and ambient-sound inputs for world
              generation, and specializes in robotics and autonomous driving synthetic data generation. Magic123's
              academic work (2023) demonstrates that single-image-to-3D-object generation using combined 2D and 3D
              diffusion priors is achievable in an open-source academic context, confirming that the underlying
              techniques are not locked to proprietary systems. Pricing is a material unknown: World Labs has not
              published World API pricing and operates on a gated early-access model; NVIDIA Cosmos is open-source (no
              explicit licensing cost, though infrastructure costs remain); Stability AI's Stable Zero123 is available
              for non-commercial and research use with a commercial membership required for business use (pricing
              undisclosed); and OpenArt's platform offers free-tier image and video tools with the OpenArt Worlds 3D
