      - number: '6.4'
        title: Retention, Durability, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Retention and durability evidence for World Labs' customer relationships is entirely absent from public
              sources. No NRR, GRR, churn rate, contract renewal data, cohort analysis, or customer satisfaction scores
              have been disclosed for any subscription tier, API customer, or named integration. The absence of these
              metrics is consistent with a company in early-commercial mode — Marble has been publicly available for
              only seven months as of June 2026 — but it means that the durability of named integrations (whether
              OpenArt, Magnific, or Rosebud are still active users rather than one-time experimental adopters) cannot be
              assessed from public evidence.


              The closest available retention proxies are: (1) the May 8, 2026 OpenArt case study, published
              approximately six months after Marble's November 2025 GA, suggests at minimum continued engagement through
              that date; (2) the World API, launched January 2026, was immediately integrated by named partners
              documented in the announcement, suggesting pre-launch commitment rather than post-launch churn; and (3)
              the Marble Labs showcase continued to receive new projects through the observable period. None of these
              are substitutes for retention metrics.


              Expansion signals are present but early. The World API represents the key expansion mechanism: platform
              integrators that build on the API expose World Labs' world-generation to their own user bases, creating
              multiplier-effect growth without proportionate World Labs direct acquisition cost. OpenArt and Magnific,
              with their large stated user bases, represent the highest-potential expansion accounts if their
              integrations gain traction with their own users. Geographic expansion and vertical expansion into AEC,
              defense simulation, or digital twin applications remain future-state rather than evidenced.


              Concentration risk is material. The named customer base as of June 2026 is concentrated in the
              creative/media sector (six of eight named integrations are gaming, film, or creative platform companies).
              The robotics and simulation segment is represented by research collaborations rather than commercial
              enterprise accounts. The AEC segment is represented primarily by early-stage adopters and a single quoted
              architect. If creative media demand softens or competing tools (Luma AI, NVIDIA Cosmos) capture a larger
              share of the creator market, World Labs' short-term customer concentration poses significant revenue risk.


              Enterprise procurement friction is a documented structural risk for AI platform companies broadly.
              Deloitte's analysis of enterprise AI adoption identifies compliance complexity, workforce readiness, and
              regulatory uncertainty as barriers that extend sales cycles and increase acquisition costs. For World
              Labs' target enterprise verticals — AEC, robotics, media — these barriers are particularly salient:
              architecture firms must evaluate data ownership and IP in generated environments; robotics teams must
              validate simulation fidelity for safety-critical use; media studios must ensure copyright and content
              provenance compliance. World Labs' AUP and Terms of Service establish the legal framework but do not
              reduce enterprise procurement friction inherent to AI tools at this stage.
