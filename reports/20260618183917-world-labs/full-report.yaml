    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring of World Labs across market, proof, moat, economics, risk, and valuation dimensions as of June
      2026, with evidence quality indicators.
    data:
      items:
        - label: Market size potential
          value: 8 / 10
          status: positive
          note: Gen AI $83B (2026) growing 31.6% CAGR; digital twin $21B growing 47.9% CAGR
        - label: Founding team quality
          value: 10 / 10
          status: positive
          note: Li (ImageNet), Mildenhall (NeRF), Johnson (Pulsar), Lassner — world-class
        - label: Product proof
          value: 5 / 10
          status: neutral
          note: Marble GA + World API shipped; 6+ named integrations; zero revenue disclosed
        - label: Revenue evidence
          value: 2 / 10
          status: negative
          note: No ARR, revenue, customer count, or unit economics disclosed as of Jun 2026
        - label: Technology moat
          value: 7 / 10
          status: positive
          note: NeRF/Gaussian Splatting expertise; but NVIDIA Cosmos and open-source compete
        - label: Competitive position
          value: 5 / 10
          status: neutral
          note: Marble differentiated at quality; but NVIDIA, Google, Luma AI all in market
        - label: Valuation discipline
          value: 3 / 10
          status: negative
          note: Implied $5B (unconfirmed) is aggressive pre-revenue; no anchoring revenue multiple
    approximationNotes: >-
      Scores are qualitative analyst judgements based on publicly available evidence. Each score reflects evidence
      quality and commercial proof, not company potential alone. Scores may improve materially upon revenue disclosure
      or confirmed commercial milestones.
