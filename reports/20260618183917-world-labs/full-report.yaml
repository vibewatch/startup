          - type: callout
            title: Capital Concentration and Hype Cycle Risk Are Structural Headwinds
            body: >-
              Crunchbase data shows that 65% of Q1 2026 global venture investment was absorbed by just three companies
              (OpenAI, Anthropic, xAI), and Gartner maintains a Hype Cycle for Generative AI 2026 that documents where
              technologies sit on the expectation curve. Spatial AI and world models are an emerging category that may
              currently be near the Peak of Inflated Expectations. If the market moves into the trough of
              disillusionment before World Labs has established commercial revenue, the company could face a challenging
              fundraising environment and a compressed valuation in its next round. Investors pricing in a 3-5 year
              holding period should explicitly model the trough as a base-case scenario, not a tail risk.
            calloutType: risk
