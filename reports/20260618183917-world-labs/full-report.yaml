  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Chain of reasoning from scale evidence, commercial proof, competition, and valuation to the current TRACK
      recommendation for World Labs.
    data:
      nodes:
        - id: founders
          label: Exceptional founding team
          detail: Li (ImageNet/Stanford), Mildenhall (NeRF), Johnson (Pulsar) — unique convergence
        - id: capital
          label: $1.23B raised; strategic investors
          detail: AMD, NVIDIA, Autodesk ($200M anchor), a16z, Fidelity — validates thesis
        - id: product
          label: Marble GA + World API shipped
          detail: 6+ named integrations; Spark 2.0 streaming renderer; multimodal inputs
        - id: market
          label: Large addressable market
          detail: Gen AI $83B (2026) → $988B (2035); digital twin $21B → $150B (2030)
        - id: antithesis
          label: Pre-revenue; competition; hype risk
          detail: No ARR disclosed; NVIDIA Cosmos free; Gartner hype cycle risk; Deloitte barriers
        - id: valuation
          label: Implied $5B (unconfirmed)
          detail: Bloomberg-reported; World Labs declined to confirm; undefined revenue multiple
        - id: recommendation
          label: TRACK
          detail: Revisit at ARR >$20M, Autodesk commercial conversion, or confirmed valuation
      edges:
        - from: founders
          to: recommendation
          label: supports conviction
        - from: capital
          to: recommendation
          label: signals investor belief
        - from: product
          to: recommendation
          label: early traction demonstrated
        - from: market
          to: recommendation
          label: large upside if thesis holds
        - from: antithesis
          to: recommendation
          label: moderates conviction
        - from: valuation
          to: recommendation
          label: requires commercial proof to justify
    approximationNotes: >-
      Node weights and edge directionality are illustrative; this is a qualitative logic diagram, not a quantitative
      scoring model.
