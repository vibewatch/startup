      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The Company Overview chapter (Chapter 1) documents the full funding chronology; this section focuses on
              forward capital adequacy and financing dependency. World Labs closed two rounds of financing: a $230
              million seed in September 2024 and a $1 billion Series B in February 2026, totaling approximately $1.23
              billion. The seed was led by Andreessen Horowitz, New Enterprise Associates, and Radical Ventures, with
              AMD Ventures, Intel Capital, and NVIDIA NVentures as additional participants. The Series B brought in AMD,
              Autodesk ($200 million as the anchor), Emerson Collective, Fidelity Management and Research Company,
              NVIDIA, and Sea. Intel Capital did not appear in Series B investor lists.


              The investor composition carries specific financial signals. Autodesk's $200 million as the single largest
              check is a strategic investment from a potential distribution partner and customer, not merely financial
              capital; it aligns incentives for eventual product integration into Autodesk's design and construction
              tools. AMD and NVIDIA as strategic co-investors reduce the likelihood that World Labs faces compute supply
              constraints, as both chip vendors have direct interest in its compute consumption growing. Fidelity
              Management and Research's participation is consistent with growth-equity positioning oriented toward a
              public-market liquidity event on a multi-year horizon.


              Bloomberg's January 2026 reporting placed the Series B valuation discussions at approximately $5 billion —
              a fivefold step-up from the $1 billion valuation at seed. World Labs did not publicly confirm or deny this
              figure, and no term-sheet or definitive valuation certificate has been disclosed in any reviewed source.


              No monthly burn rate, cash position, or runway estimate is publicly available. Typical compute-heavy AI
              companies of comparable stage and team size run monthly cash consumption in the range of a few million to
              tens of millions of dollars depending on training intensity. At a $5 million per month midpoint burn
              (illustrative; not a company disclosure), $1.23 billion represents roughly twenty years of runway — an
              implausible figure suggesting actual burn is considerably higher or the capital will be deployed into more
              aggressive model training and infrastructure buildout. At $20 million per month, runway would be
              approximately five years. At $50 million per month, approximately two years. None of these scenarios can
              be verified from public evidence; they are presented to bound the space, not as estimates. No debt
              facility or project-finance obligation has been disclosed.
