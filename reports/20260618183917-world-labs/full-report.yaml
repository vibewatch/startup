      - number: '7.3'
        title: Partner, Dependency, and Capital Risk
        blocks:
          - type: paragraph
            body: >
              World Labs' partner ecosystem creates an unusual dependency structure in which its two primary hardware
              suppliers — NVIDIA and AMD — are also equity investors. Both participated in the February 2026 $1 billion
              round, alongside Autodesk, which invested $200 million and assumed an advisory role. This constellation of
              strategic investors is commercially advantageous — it signals credibility and secures supply relationships
              — but also concentrates leverage. In competitive tension (NVIDIA Cosmos directly competes with Marble in
              robotics simulation), NVIDIA could use supply leverage or advisory access to steer World Labs toward
              outcomes that benefit its own platforms. TechCrunch reporting confirmed that Autodesk's Chief Scientist
              described the partnership as "early days" with the commercial product form "not yet determined," and
              explicitly noted that data sharing is not part of the agreement. If the Autodesk collaboration does not
              produce a joint commercial workflow or integrated product by 2027, the strategic rationale for Autodesk's
              $200 million commitment will weaken.


              World Labs has not disclosed whether it operates proprietary GPU data-centre infrastructure or relies on
              hyperscale cloud providers for training and inference compute. NVIDIA Cosmos, as a competing world
              foundation model developed by a company with vastly larger compute access and an existing robotics
              simulation ecosystem, represents a direct displacement threat in the enterprise-simulation segment.
              DeepMind's Genie 2 further illustrates that World Labs competes against organisations with effectively
              unlimited compute budgets.


              At the capital level, Crunchbase's Q1 2026 data shows that global AI venture investment reached $300
              billion, but 65% was captured by four companies. Follow-on capital for mid-tier frontier AI startups will
              face tightening conditions if spatial AI fails to demonstrate tangible revenue in 2026–2027. The Gartner
              Generative AI Hype Cycle 2026 suggests that some generative AI categories are approaching the peak of
              inflated expectations, and a subsequent trough could compress valuation multiples and constrain future
              fundraising windows for World Labs — which has not confirmed its $5 billion rumoured valuation.
