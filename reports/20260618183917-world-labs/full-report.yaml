      - number: '8.2'
        title: Financing Context and Valuation Anchors
        blocks:
          - type: paragraph
            body: >-
              World Labs' financing history is well-documented: $230 million closed in September 2024 at a post-money
              valuation of $1 billion, led by Andreessen Horowitz, NEA, and Radical Ventures, with AMD Ventures, Intel
              Capital, and NVIDIA NVentures participating. A second close of $1 billion was announced on February 18,
              2026, anchored by Autodesk at $200 million in a strategic advisory capacity, and joined by AMD, NVIDIA,
              Emerson Collective, Fidelity Management and Research, and Sea Group. Total capital raised across both
              rounds stands at $1.23 billion, a figure reported consistently across Reuters, TechCrunch, SiliconANGLE,
              and StartupHub AI.

              The implied valuation is more ambiguous. Bloomberg News reported in January 2026 that World Labs was in
              fundraising discussions at approximately $5 billion — a fivefold increase from the seed mark in roughly 16
              months. World Labs declined to confirm this figure when the Reuters February 2026 story reported it, but
              the company also did not contest the Bloomberg reporting. The $5 billion figure therefore has
              medium-confidence status: it is third-party-reported with multiple corroborating citations but without
              company confirmation. At the implied $5 billion mark and with no revenue disclosed, the revenue multiple
              is undefined — this is a vision multiple predicated entirely on market belief in the spatial intelligence
              thesis.

              The comparable set for World Labs is constrained. The company is private, pre-revenue, and at a stage
              where most historical precedent involves companies that have shipped significant commercial proof.
              Anthropic, the closest analog in terms of frontier-AI funding profile, closed a $30 billion Series G at a
              $380 billion post-money valuation in February 2026 — but Anthropic has substantial disclosed ARR. Among 3D
              AI companies, Luma AI is private with no publicly reported valuation at scale. Stability AI has faced
              financial difficulty. The most relevant reference points are therefore: (1) World Labs' own seed-round
              multiple ($1B post / $230M raised), (2) the Bloomberg-reported Series B implied price, and (3) the broader
              Q1 2026 venture market where AI companies raised $242 billion in a single quarter, creating an unusually
              supportive pricing environment.
