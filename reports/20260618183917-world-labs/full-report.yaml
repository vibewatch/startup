      - number: '5.3'
        title: Deployment, Integration, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Marble is deployed as a browser-native product requiring no proprietary desktop client. Users access the
              product at marble.worldlabs.ai; no special setup or tooling installation is needed. World generation runs
              asynchronously via the World API, which accepts standard HTTP requests and returns navigable 3D world
              objects. This design choice makes integration into modern web applications, game frontends, and simulation
              pipelines straightforward: world creation becomes a programmable API call rather than a 3D pipeline
              engineering task.

              Third-party integrations documented in showcase and case study materials cover a broad range of downstream
              environments. Unreal Engine integration is demonstrated via the Volinga plugin, which imports
              Marble-generated Gaussian splat environments for real-time rendering and scene refinement. Unity
              integration is documented in the Splat World and Splat Raycasting case studies, where custom C# tooling
              manipulates splats for VR gameplay and robot locomotion. Integration with NVIDIA Isaac Sim is documented
              in a robotics case study where Marble-generated scenes, including collider mesh exports, were used as
              training environments for robot learning. The AI-native 3D pipelines showcase demonstrates Marble feeding
              into a multi-system orchestration pipeline combining fal, mesh generation, sound synthesis, and Unreal
              Engine.

              Developer tooling is being built by the community within Marble Labs. The open-source Third-Person
              Character Controller template demonstrates Marble + Spark 2.0 + Rapier3D physics integration in a
              fork-ready GitHub package. The Collider Builder tool enables users to draw collision geometry directly in
              the browser over splat scenes and export as .glb. The STARSPEED browser game demonstrates
              production-quality delivery of environments composed of over 100 million Gaussian splats, with multiplayer
              networking via Colyseus.

              The Marble roadmap is partially legible from the Marble Labs showcase pipeline: the progression from
              standalone world generation to physics-enabled interaction, avatar embodiment, multiplayer environments,
              and robotics simulation suggests a platform expansion toward interactive and agentic use cases. The June
              2026 taxonomy blog specifically discusses the path from renderers to simulators to planners, signaling the
              company's intent to extend world models toward active agents operating within generated environments.
              However, no specific forward-looking feature timeline or release schedule has been publicly committed.
