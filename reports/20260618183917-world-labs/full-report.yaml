            body: >
              World Labs' Marble differentiates on multimodal input breadth: text, images, video, coarse 3D layouts, and
              panoramas are all accepted as generation inputs, a breadth that World Labs describes as a first-in-class
              capability. Spark 2.0, the company's web-based 3DGS renderer, offers a Level-of-Detail streaming system
