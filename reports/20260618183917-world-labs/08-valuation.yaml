- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round
    - World Labs raises next capital at valuation below implied $5B Series B mark
    - Investor confidence deterioration; thesis on commercial trajectory weakened
    - Immediate reassessment; likely exit if valuation declines more than 30%
  - - Founder departure
    - Fei-Fei Li, Ben Mildenhall, or Justin Johnson leaves the company
    - Core technical and reputational moat undermined; recruiting pipeline at risk
    - Reassess immediately; leadership continuity is a primary conviction driver
  - - Strategic partnership dissolution
    - Autodesk publicly withdraws advisory role or AMD/NVIDIA reduce strategic engagement
    - Enterprise distribution pathway eliminated; strategic premium in valuation removed
    - Re-examine entire commercial thesis; likely downgrade to exit watch
  - - Regulatory block
    - U.S. or EU regulators prohibit commercial AI-generated 3D content or impose substantial copyright liability
    - Pro/Max subscription tiers lose commercial rights basis; entire SaaS model at risk
    - Evaluate regulatory exposure; may require material product redesign or market exit
  - - Commoditisation acceleration
    - Open-source or NVIDIA Cosmos achieves Marble-quality output within 12 months; pricing collapses below $20/month equivalent
    - Revenue model undermined; competitive moat insufficient
    - Evaluate differentiation path; if no credible moat response, exit watch
  notes: Triggers and thresholds are analytical constructs based on publicly available evidence. They represent conditions that would materially change the current TRACK recommendation.
