- id: TV006
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue and ARR
    - No revenue, ARR, or subscription count disclosed
    - Required to anchor any valuation; defines whether $5B mark is defensible
    - Management data room; standard for any growth-stage investment
  - - Unit economics
    - No gross margin, CAC, or payback period disclosed
    - Compute-intensive inference; gross margin could be sub-50% at current scale
    - Management; model P&L request in due diligence
  - - Autodesk commercial terms
    - Partnership described as 'research and model level'; no revenue-share or reseller agreement confirmed
    - A commercial distribution agreement with Autodesk is the primary bull-case catalyst
    - Direct request to World Labs and Autodesk in due diligence; press announcement if converted
  - - Cap table and preference stack
    - Investor share, liquidation preferences, and anti-dilution provisions not disclosed
    - Material for calculating actual return at various exit scenarios, especially at below-$5B outcomes
    - Legal due diligence; cap table request
  - - IP ownership and training data provenance
    - No disclosure of training data licensing or synthetic-data policy for Marble models
    - U.S. Copyright Office active review of AI-generated content; IP risk could affect commercial rights at Pro/Max tiers
    - IP due diligence; request training data provenance and licensing disclosures
  notes: These are the minimum evidence items required to move the recommendation from TRACK to a conditional buy. All are standard growth-stage diligence items that World Labs has not publicly disclosed.
