- id: exit-readiness-triggers-and-diligence
  title: Exit Readiness, Thesis-Break Triggers, and Final Diligence
  body: 'World Labs'' most probable exit pathway at current stage is a strategic acquisition by one of its existing investors. Autodesk is the most obvious acquirer: its $200 million investment and research-level partnership creates option value to acquire the full platform once commercial proof is established. NVIDIA and AMD have strategic interest in ensuring world models run on their hardware at scale. An IPO is possible but would require substantially more commercial development — historical pre-IPO benchmarks for AI companies suggest at least $50 million ARR with consistent quarter-over-quarter growth and clear unit economics before public markets would price the company at scale. On current evidence, World Labs is not IPO-ready.

    The recommendation is TRACK, with a specific set of thesis-break triggers that would move the call to buy or exit. The buy trigger is revenue evidence: if World Labs discloses or an authoritative third party reports ARR above $20 million with evidence of enterprise multi-year contract structure, or if the Autodesk partnership converts from research to commercial distribution, the base and bull case scenarios become more credible at or near the current implied price. The exit trigger is the inverse: a down-round, a dissolution of key strategic partnerships, a loss of key founders, or regulatory action blocking generative 3D content in commercial applications would all constitute thesis-break events.

    The capital efficiency profile at this stage is notable: approximately 11-50 employees with $1.23 billion raised is very lean, implying either extreme compute-for-headcount spending or careful hiring discipline. The Gartner Hype Cycle for Generative AI 2026 notes that many generative AI categories are at or near the Peak of Inflated Expectations — a structural risk that affects the entire spatial AI market, not just World Labs. Investors entering at current implied prices should price in the trough of disillusionment as a scenario, with a recovery horizon of 3-5 years if the technology ultimately delivers on its promise.'
