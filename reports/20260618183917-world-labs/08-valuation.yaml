- id: scenario-analysis-and-valuation-ranges
  title: Scenario Analysis and Valuation Ranges
  body: 'Because World Labs has disclosed no revenue, all scenario valuations in this chapter are explicitly labeled as estimates based on assumed revenue outcomes and comparable market multiples for high-growth AI infrastructure companies. These are scenario inputs for analytical framing only; they are not offered as precise forecasts and are clearly labeled as assumptions throughout.

    The bull case assumes that spatial intelligence becomes a broadly adopted AI paradigm within 24 months — that Autodesk''s $200 million investment converts into a large distribution agreement unlocking its installed base of millions of professional users, that the World API generates meaningful API revenue from robotics, gaming, and enterprise simulation, and that World Labs achieves an estimated $100-$300 million ARR by 2028. At growth-stage AI multiples of 30-40x forward revenue, this would imply an estimated valuation of $3-12 billion, bracketing the current implied price in the middle of the range. The bull case depends on commercial proof that does not yet exist: the Autodesk partnership would need to move from research to distribution, and the API would need to acquire substantial paying enterprise developers.

    The base case assumes controlled commercial growth with the Autodesk relationship remaining advisory, direct subscription revenue from creative and prosumer markets, and API revenue from developer integrations. An estimated $30-80 million ARR by 2028 at 25-30x forward revenue would imply an estimated $750 million to $2.4 billion valuation — meaningfully below the implied $5 billion entry price. The base case underlines that the current price is difficult to justify without the bull-case commercial acceleration.

    The bear case assumes material commoditization: NVIDIA Cosmos''s open model expands its supported use cases, open-source community models close the quality gap, and World Labs struggles to differentiate at scale. In this scenario, estimated $5-15 million ARR by 2028 at 10-15x multiples implies an estimated valuation of $50-225 million, well below any invested capital. The bear case is further exacerbated by capital concentration risk: Q1 2026 venture funding saw OpenAI, Anthropic, and xAI collectively absorb 65% of global venture investment, compressing available capital for mid-tier spatial AI players.'
