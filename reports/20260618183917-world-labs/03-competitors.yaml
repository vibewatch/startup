  - id: entrant-pressure-and-adverse-evidence
    title: Entrant Pressure and Adverse Evidence
    body: >
      The competitive capital environment for foundational AI in 2026 creates a structural headwind for World Labs. Crunchbase data shows that Q1 2026 venture funding to foundational AI startups reached $178 billion across just 24 deals, with OpenAI, Anthropic, xAI, and Waymo together capturing $188 billion (65%) of all global VC in the quarter. This concentration means World Labs competes against organizations whose research and product budgets dwarf its own: Google DeepMind can fund world model research indefinitely through Genie 2 and SIMA without charging for access, and NVIDIA can give away Cosmos model weights at zero licensing cost as a strategy to deepen Omniverse ecosystem lock-in. The open-source academic trajectory also introduces entrant pressure from below: Magic123 and similar academic 3D generation models demonstrate that the underlying 3D diffusion techniques are accessible without proprietary licensing, and the gap between research-quality and production-quality output is narrowing each year. Stability AI represents an adverse data point for the independent AI model company archetype: despite being an early leader in generative image and 3D generation (Stable Zero123), its restrictive non-commercial release posture, commercial membership requirements, and disclosed financial difficulties signal the fragility of capital-constrained AI infrastructure companies. NVIDIA Cosmos's open-source availability explicitly accelerates adoption among robotics developers who would otherwise evaluate World Labs' commercial World API, directly undercutting World Labs' pricing power in that vertical. The most adverse scenario is a two-front squeeze: NVIDIA commoditizes the robotics simulation market through free Cosmos models, while Google DeepMind commercializes Genie 2 into a creative API, leaving World Labs competing with neither incumbents' distribution nor their capital depth in either anchor market.
    claimRefs:
      - CP039
      - CP040
      - CP041
