callouts:
  - calloutType: risk
    title: "Open-Source Commoditization Threat from NVIDIA Cosmos"
    body: >
      NVIDIA Cosmos's open-source, zero-licensing-cost model creates a structural pricing ceiling on World Labs' World API in the robotics and physical AI simulation segment. Developers who can meet their needs with Cosmos (the majority of robotics simulation and synthetic data generation use cases) have little incentive to pay for a commercial API that covers the same workflow. World Labs' only durable defense in this vertical is qualitative superiority of Marble's generative output, integration depth with NVIDIA's own Isaac Sim (already demonstrated via case study), and the creative film and architectural visualization segments that Cosmos does not explicitly serve. If World Labs cannot demonstrate measurably superior world quality for robotics training data, NVIDIA Cosmos is likely to dominate that vertical by default.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
      - CP026
      - CP027
      - CP038

  - calloutType: risk
    title: "Capital Asymmetry and Adverse Entrant Pressure"
    body: >
      The 2026 capital concentration data is a structural adverse signal. Crunchbase reports that OpenAI, Anthropic, xAI, and Waymo collectively captured $188 billion in Q1 2026—roughly 153 times World Labs' disclosed total raise—enabling their research labs to outspend World Labs on model training, data, and talent indefinitely. Google DeepMind holds Genie 2 as a research-stage asset today, but its commercialization risk is material: any decision by Google to offer Genie 2 as a commercial API would introduce a free or low-cost competitor with Alphabet distribution. Investors should treat the absence of a Genie 2 commercial product as a temporary rather than permanent barrier. World Labs' best hedge is vertical integration depth (domain-specific workflows, partner integrations, the Spark renderer) rather than trying to outcompete on raw model capability alone.
    claimRefs:
      - CP034
      - CP035
      - CP039
      - CP040
      - CP041
      - CP043
      - CP044

