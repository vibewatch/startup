  - id: capability-and-pricing-comparison
    title: Capability and Pricing Comparison
    body: >
      World Labs' Marble differentiates on multimodal input breadth: text, images, video, coarse 3D layouts, and panoramas are all accepted as generation inputs, a breadth that World Labs describes as a first-in-class capability. Spark 2.0, the company's web-based 3DGS renderer, offers a Level-of-Detail streaming system that optimizes Gaussian splatting world detail for viewpoint as users navigate, enabling large-world rendering on any device with a web browser—a capability not visible in Luma AI's or NVIDIA Cosmos's public documentation. Luma AI's interactive scenes embed at 8 MB (objects) and 20 MB (scenes) at 30 FPS across iOS, Android, and web; Luma has also released RAY3.2 for directed video and UNI-1 for brand-specific model training, extending its competitive surface beyond 3D capture. NVIDIA Cosmos targets physical AI developers with open-source model weights, covering text, image, video, and ambient-sound inputs for world generation, and specializes in robotics and autonomous driving synthetic data generation. Magic123's academic work (2023) demonstrates that single-image-to-3D-object generation using combined 2D and 3D diffusion priors is achievable in an open-source academic context, confirming that the underlying techniques are not locked to proprietary systems. Pricing is a material unknown: World Labs has not published World API pricing and operates on a gated early-access model; NVIDIA Cosmos is open-source (no explicit licensing cost, though infrastructure costs remain); Stability AI's Stable Zero123 is available for non-commercial and research use with a commercial membership required for business use (pricing undisclosed); and OpenArt's platform offers free-tier image and video tools with the OpenArt Worlds 3D tier pricing not separately disclosed.
