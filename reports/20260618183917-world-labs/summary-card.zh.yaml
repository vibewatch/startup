  topStrengths:
    - 创始团队覆盖 ImageNet、NeRF、前沿计算机视觉和图形学研究，让公司在空间 AI 上具备稀缺的技术公信力。
    - Marble 和 World API 已跳出研究叙事，成为公开可用的产品入口，并在创作者、设计流程和机器人仿真中出现具名集成。
    - Autodesk、NVIDIA、AMD、a16z 等顶级投资方的战略支持，提高了资本获取能力，也留下潜在分发选项。
  topRisks:
    - 公开资料没有收入、ARR、留存、单位经济或已确认估值披露，因此 2026 年 2 月隐含价格仍是愿景倍数，不是经营倍数。
    - 商业验证仍早：许多公开引用是展示、合作或偏研究的集成，不是已披露合同金额的规模化企业部署。
    - 大型科技公司和开源阵营在世界模型、3D 生成和物理 AI 上竞争，可能在 World Labs 建立稳固 GTM 优势前压缩定价或收窄差异化。
  unresolvedGaps:
    - Marble 订阅和 World API 的收入、ARR、毛利率与烧钱速度数据，需要经审计或由管理层确认
    - Autodesk 的 $200 million 战略投资若附带商业条款和分发承诺，需披露具体内容
    - 2026 年 2 月融资的已确认投后估值、优先股堆叠和稀释影响
