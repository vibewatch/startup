  - id: mitigations-kill-criteria
    title: Mitigations and Thesis-Break Triggers
    body: >
      The primary mitigation against regulatory risk is World Labs' AUP architecture, which
      explicitly restricts High-Risk Uses referencing the EU AI Act, California SB 1001, and
      comparable regulations. This limits direct liability exposure but does not remove the
      compliance burden from institutional customers who must assess whether Marble outputs meet
      their own regulatory obligations. The responsible disclosure programme covers the basic
      security baseline, but the absence of formal third-party security attestation creates a
      ceiling on regulated-industry enterprise adoption until SOC 2 or equivalent certification
      is achieved.


      Against compute dependency, World Labs' dual-investor relationships with NVIDIA and AMD
      provide preferential access to GPU allocations — but pricing leverage resides with suppliers
      who hold board observer rights. The company's best mitigation is to accelerate revenue to a
      level that reduces dependence on additional equity raises. The Autodesk partnership, if it
      matures into an integrated product workflow, could accelerate enterprise distribution, but
      TechCrunch's Q1 2026 interview suggests the commercial product shape remains undefined.


      Thesis-break triggers that should end or fundamentally reprice an investment include:
      EU AI Act classification of Marble as high-risk GPAI with mandatory third-party audit
      requirements the company cannot meet in time; confirmed departure of Fei-Fei Li as CEO;
      failure to close any enterprise contract with disclosed revenue by Q4 2026; loss of
      NVIDIA or AMD as infrastructure suppliers without alternative GPU access; and a finding by
      the US Copyright Office or a court that Marble's training data constitutes systematic
      copyright infringement requiring model withdrawal or retraining.


      Investors should define explicit thresholds and monitoring cadences for each trigger rather
      than relying on periodic management reporting alone. The dependency risk map (FR003) shows
      that all material risks ultimately transmit through compute access or Fei-Fei Li's continued
      leadership into the company's operational continuity.
    claimRefs:
      - CR043
      - CR044
      - CR045
      - CR046
    tableRefs:
      - TR005
    figureRefs:
      - FR003

