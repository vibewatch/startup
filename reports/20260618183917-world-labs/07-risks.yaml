callouts:
  - calloutType: risk
    title: "Key-Person Concentration — CEO Split-Role Is the Largest Execution Risk"
    body: >
      Fei-Fei Li's simultaneous Sequoia Professorship at Stanford and CEO role at World Labs
      is the most consequential key-person risk in this company's profile. Li is not merely
      the public face of World Labs — she is the primary fundraiser, the principal relationship
      owner with Autodesk, and the architect of the spatial intelligence scientific thesis that
      underpins the entire venture. Her departure or material reduction in engagement would
      likely trigger investor concern and could accelerate loss of strategic partnerships. No
      succession plan has been publicly disclosed. Diligence must confirm her full-time status
      and clarify the Stanford leave arrangement before any capital commitment is made.
    claimRefs:
      - CR027
      - CR028
      - CR033

  - calloutType: risk
    title: "Investor-Supplier Conflict — NVIDIA and AMD Hold Asymmetric Leverage"
    body: >
      The participation of NVIDIA and AMD as both equity investors and primary GPU hardware
      suppliers to World Labs creates a structural conflict of interest with no disclosed
      resolution mechanism. In a tightening GPU market or in competitive tension — NVIDIA Cosmos
      directly competes with Marble in robotics simulation — NVIDIA or AMD could use supply
      leverage or advisory access to steer World Labs toward outcomes that benefit their own
      platforms. World Labs has no disclosed alternative compute strategy, making this leverage
      asymmetric. Investors should require a written compute-procurement independence plan
      before treating this risk as mitigated.
    claimRefs:
      - CR020
      - CR022
      - CR024
      - CR031

