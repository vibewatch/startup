  - id: people-execution-financial-risk
    title: People, Execution, and Financial Risk
    body: >
      World Labs' key-person concentration is extreme relative to its stage. Fei-Fei Li holds a
      concurrent Sequoia Professorship at Stanford University alongside her CEO role, a dual
      arrangement she described at founding as continuing "some of her work at Stanford while
      building the startup." Co-founder Justin Johnson retains an appointment at the University
      of Michigan. These split-time arrangements create execution risk during the current critical
      product-market-fit phase: the company must close enterprise contracts, scale API
      infrastructure, and complete Autodesk integration simultaneously. Li's profile — Wired
      cover subject, congressional witness, UN Scientific Advisory Board member — amplifies
      reputational consequences of any misstep.


      Financial transparency is effectively absent. World Labs has not disclosed headcount, burn
      rate, or any revenue metric. The $1.23 billion raised across two rounds positions the company
      as a capital-intensive frontier AI lab, but the consumer subscription pricing (Free through
      $95/month Max) is structurally unable to generate revenue sufficient to offset frontier model
      training costs without substantial enterprise contract volume. StartupHub analysis notes that
      World Labs' cumulative raise exceeds Google's 2014 acquisition price of DeepMind, yet arrived
      before any disclosed revenue — underlining the bet on long-duration capital-to-value
      conversion.


      Talent acquisition represents a structural risk. World Labs competes for ML engineering and
      3D graphics talent against NVIDIA, Google DeepMind, Meta Reality Labs, and well-capitalised
      peers including Luma AI. Deloitte's survey evidence shows that workforce readiness is the top
      barrier to enterprise AI adoption, meaning World Labs' enterprise customers face parallel
      talent constraints that could slow integration timelines and reduce the effective addressable
      market for complex world-model deployments in 2026.
