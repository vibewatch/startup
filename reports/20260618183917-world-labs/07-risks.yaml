  - id: operational-security-risk
    title: Operational and Technical Risk
    body: >
      World Labs' core product, Marble, is a compute-intensive generative pipeline that converts
      text, image, video, or multi-view inputs into 3D Gaussian splat environments through an
      asynchronous processing architecture. Each World API call triggers a full 3D world
      generation job — substantially more resource-intensive than text or image inference. At
      scale, inference demand creates an operational risk: if GPU supply is constrained,
      World Labs faces service degradation or rate-limiting that directly caps developer adoption.
      No service-level agreement (SLA) or uptime guarantee has been disclosed publicly.


      On security, World Labs maintains a responsible disclosure programme via
      security@worldlabs.ai but operates no public bug bounty, meaning external researchers
      have limited financial incentive to proactively surface vulnerabilities. The absence
      of published third-party penetration testing, SOC 2 attestation, or ISO 27001 certification
      leaves enterprise buyers reliant on trust rather than independently audited assurance. This
      gap is operationally material because the World API processes customer-uploaded images,
      video, and 3D assets — including potentially sensitive proprietary scenes for architecture,
      defence, and industrial simulation workflows.


      The 3D generation field faces a persistent sim-to-real fidelity challenge for robotics and
      embodied-AI applications. The ArXiv survey on 3D generation for embodied AI (arXiv:2604.26509)
      identifies limited physical annotations, geometry-realism gaps, fragmented evaluation, and
      the persistent sim-to-real divide as primary bottlenecks. For World Labs' robotics use cases,
      this is not hypothetical: if Marble-generated environments lack physical accuracy sufficient
      for robot policy training, the high-value enterprise use cases face a fidelity ceiling that
      competitors with physics-native simulation platforms (NVIDIA Isaac Sim with Cosmos) may reach
      first. Deloitte's 2025/2026 AI adoption survey identifies regulatory compliance and workforce
      readiness as the leading barriers to enterprise AI adoption — both directly relevant to
      World Labs' target customers.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
    tableRefs:
      - TR002

  - id: partner-dependency-risk
    title: Partner, Dependency, and Capital Risk
    body: >
      World Labs' partner ecosystem creates an unusual dependency structure in which its two
      primary hardware suppliers — NVIDIA and AMD — are also equity investors. Both participated
      in the February 2026 $1 billion round, alongside Autodesk, which invested $200 million
      and assumed an advisory role. This constellation of strategic investors is commercially
      advantageous — it signals credibility and secures supply relationships — but also
      concentrates leverage. In competitive tension (NVIDIA Cosmos directly competes with Marble
      in robotics simulation), NVIDIA could use supply leverage or advisory access to steer
      World Labs toward outcomes that benefit its own platforms. TechCrunch reporting confirmed
      that Autodesk's Chief Scientist described the partnership as "early days" with the commercial
      product form "not yet determined," and explicitly noted that data sharing is not part of the
      agreement. If the Autodesk collaboration does not produce a joint commercial workflow or
      integrated product by 2027, the strategic rationale for Autodesk's $200 million commitment
      will weaken.


      World Labs has not disclosed whether it operates proprietary GPU data-centre infrastructure
      or relies on hyperscale cloud providers for training and inference compute. NVIDIA Cosmos,
      as a competing world foundation model developed by a company with vastly larger compute
      access and an existing robotics simulation ecosystem, represents a direct displacement
      threat in the enterprise-simulation segment. DeepMind's Genie 2 further illustrates that
      World Labs competes against organisations with effectively unlimited compute budgets.


      At the capital level, Crunchbase's Q1 2026 data shows that global AI venture investment
      reached $300 billion, but 65% was captured by four companies. Follow-on capital for
      mid-tier frontier AI startups will face tightening conditions if spatial AI fails to
      demonstrate tangible revenue in 2026–2027. The Gartner Generative AI Hype Cycle 2026
      suggests that some generative AI categories are approaching the peak of inflated expectations,
      and a subsequent trough could compress valuation multiples and constrain future fundraising
      windows for World Labs — which has not confirmed its $5 billion rumoured valuation.
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
