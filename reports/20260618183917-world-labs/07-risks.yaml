  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity-risk
      missingEvidence: >
        World Labs' burn rate, headcount, revenue, ARR, and gross margin figures have not
        been disclosed publicly.
      whyItMatters: >
        Without revenue or burn data, runway and capital efficiency cannot be independently
        assessed; this blocks any discounted cash-flow or unit-economics analysis.
      diligencePath: >
        Request management accounts, board financial package, and cap table from World Labs
        in diligence; benchmark burn against peer frontier AI labs at comparable stage.
      relatedQuestionRefs:
        - QR010
    - type: missing-source
      severity: material
      topic: IP-copyright-risk
      missingEvidence: >
        World Labs' training data provenance, licensing agreements for 3D content, and any
        indemnification policy for AI-generated output are not publicly disclosed.
      whyItMatters: >
        Enterprise customers require clean IP chains; a future adverse copyright ruling or
        training-data suit could require model retraining or suspension of Marble.
      diligencePath: >
        Request training data inventory and licensing documentation; seek legal opinion on
        whether Marble training qualifies as transformative fair use; confirm whether TOS
        indemnifies or disclaims IP liability to customers.
      relatedQuestionRefs:
        - QR017
    - type: missing-source
      severity: material
      topic: export-control-risk
      missingEvidence: >
        World Labs has not disclosed whether its World API implements geographic restrictions
        for EAR-controlled jurisdictions or whether model weights have been reviewed for
        dual-use export control classification.
      whyItMatters: >
        Uncontrolled export of large dual-use AI models to sanctioned or embargoed countries
        carries civil and criminal penalties; institutional investors may face secondary exposure.
      diligencePath: >
        Request export counsel opinion on EAR classification of Marble model weights; confirm
        API geo-blocking implementation for restricted jurisdictions.
      relatedQuestionRefs:
        - QR016
        - QR027
    - type: missing-source
      severity: material
      topic: security-certification-gap
      missingEvidence: >
        No third-party security certification (SOC 2 Type II, ISO 27001) has been disclosed
        for World Labs' platform or API infrastructure.
      whyItMatters: >
        Enterprise procurement in regulated industries requires security attestation;
        absence blocks deal closure for high-value segments.
      diligencePath: >
        Request SOC 2 Type II report or equivalent security attestation; confirm penetration
        testing cadence and results; review cloud provider security inheritance documentation.
      relatedQuestionRefs:
        - QR012
    - type: missing-source
      severity: material
      topic: cloud-infrastructure-dependency
      missingEvidence: >
        World Labs has not disclosed its compute infrastructure provider, GPU procurement
        volumes, contract terms, or cost structure.
      whyItMatters: >
        Infrastructure provider concentration and cost structure directly determine unit
        economics, margin potential, and vulnerability to supply disruption.
      diligencePath: >
        Request infrastructure architecture diagram and cloud/GPU contract terms; assess
        whether GPU access is via NVIDIA NVentures or AMD Ventures advisory channels.
      relatedQuestionRefs:
        - QR013

