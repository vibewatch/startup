companyProfile:
  summary: 'World Labs is a San Francisco-based spatial intelligence startup founded in 2024 by Fei-Fei Li, Ben Mildenhall, Christoph Lassner, and Justin Johnson. The company’s commercial surface centers on Marble, a multimodal world model for creating persistent 3D environments from text, images, video, and layouts, plus the World API for programmatic generation and downstream integrations. Public evidence supports extraordinary investor conviction — roughly $1.23 billion raised by February 2026 — but not yet a filing-grade view of revenue, retention, margins, or confirmed valuation.

    '
  founders:
  - name: Fei-Fei Li
    role: Co-founder and CEO
    background: Stanford computer science professor, former Stanford AI Lab director, former Google Cloud chief scientist, and creator of ImageNet.
  - name: Ben Mildenhall
    role: Co-founder
    background: Computer vision researcher best known as a lead author of NeRF and related neural-rendering work.
  - name: Christoph Lassner
    role: Co-founder
    background: Computer graphics and vision researcher with prior roles at Meta Reality Labs and Epic Games.
  - name: Justin Johnson
    role: Co-founder
    background: Computer vision and deep learning researcher with prior academic leadership roles and widely cited vision papers.
  foundingLocation: San Francisco, California, USA
