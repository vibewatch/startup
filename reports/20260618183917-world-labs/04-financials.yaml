  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Revenue run rate, ARR, monthly subscription MRR, paid subscriber count by tier, API revenue, and total platform GMV for World Labs as of June 2026.
    whyItMatters: Without any revenue metric, it is impossible to assess whether the subscription model is monetizing at a level commensurate with the $1.23 billion raised, or to project a return scenario.
    diligencePath: Request management accounts or audited financials; triangulate MRR from payment processor data or App Store / web analytics; ask management for subscriber count and tier mix in the due diligence process.
    relatedQuestionRefs:
    - QI002
    - QI012
    - QI018
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Monthly cash burn rate, gross margin by tier, per-generation GPU inference cost, customer acquisition cost, and net revenue retention for World Labs as of 2026.
    whyItMatters: Unit economics are the foundation of any valuation or DCF model; without burn rate, runway cannot be calculated; without gross margin, pricing sustainability cannot be assessed.
    diligencePath: Request monthly P&L with COGS broken out by compute and personnel; request retention cohort data for Pro and Max subscribers; benchmark GPU inference cost against comparable 3D diffusion model providers.
    relatedQuestionRefs:
    - QI004
    - QI015
    - QI016
  - type: missing-source
    severity: material
    topic: World-API-pricing
    missingEvidence: A public API pricing schedule, rate-limit documentation, or usage-tier specification for the World API as of June 2026.
    whyItMatters: Without a published API price card, developer and enterprise API revenue cannot be projected, and it is unclear whether the API is free during a beta period or commercially priced at launch.
    diligencePath: Monitor worldlabs.ai/docs and developer.worldlabs.ai for any pricing page; request the API pricing schedule and current enterprise API customer count from management.
  - type: missing-source
    severity: material
    topic: Autodesk-commercial-terms
    missingEvidence: Commercial revenue-share terms, product integration milestones, or minimum commitment structure for the Autodesk-World Labs partnership beyond the $200 million investment.
    whyItMatters: The Autodesk partnership could represent a material revenue contract or merely a strategic collaboration with no near-term revenue; distinguishing between these scenarios materially affects the financial model.
    diligencePath: Request the Autodesk partnership agreement from management; review any Autodesk SEC filings (10-K, 10-Q) or investor-day materials disclosing the investment rationale and any embedded product commitments.
