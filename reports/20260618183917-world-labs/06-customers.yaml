  - id: adoption-trajectory
    title: Adoption Trajectory and Deployment Status Proxies
    body: >-
      World Labs has not disclosed any quantitative adoption metrics — subscriber counts,
      API call volumes, monthly active users, accounts, or utilization rates — as of
      June 2026. The following proxies are the available indirect signals.


      Case study publication velocity serves as an adoption proxy. Nine case studies were
      published between November 12, 2025 (Marble GA) and May 8, 2026 — a rate of
      approximately 1.3 per month. This pace suggests an active customer success or
      partnership function identifying and narrating integration stories, consistent with
      a company in early-commercial mode focused on social proof accumulation.


      The World API launched January 21, 2026, approximately ten weeks after Marble's
      GA. The announcement documents three verticals already in use at API launch —
      gaming/immersive media (Escape), architecture/design (Fenestra, xFigura, Preview),
      and robotics/simulation (Lightwheel) — implying pre-launch alpha or beta API access
      was granted to select partners prior to public release. This is consistent with a
      controlled ramp rather than an open-beta launch.


      The Marble Labs showcase has grown to at least 18 projects by June 2026. These
      are explicitly framed as experimental ("blueprints for building") rather than
      production deployments, but their diversity — spanning virtual production pipelines,
      VR engines, game engines, real estate visualization, and physics-interactive art —
      constitutes a meaningful developer-community signal.


      Autodesk's $200 million strategic investment (February 18, 2026) is the single
      most significant external adoption signal: a major 3D software incumbent made a
      large strategic bet on World Labs' world-generation capability being commercially
      relevant to its enterprise design and entertainment customer base. Adoption within
      Autodesk's actual product suite remains prospective rather than evidenced.


      No independent third-party reviews, ratings, or analyst reports on Marble's
      production deployment quality or customer satisfaction are available as of
      June 2026.
