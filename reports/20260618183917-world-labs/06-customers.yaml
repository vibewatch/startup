  - id: FU001
    title: Customer Journey Map — Segments, Surfaces, and Expansion Loops
    type: journey-map
    layout: wide
    summary: >-
      World Labs customer journey across three principal segments from initial awareness through
      trial, adoption, and expansion, highlighting divergent paths for creators, API integrators,
      and robotics researchers.
    data:
      nodes:
        - id: awareness
          label: Awareness
          detail: >-
            Exposure via Fei-Fei Li's public profile and TED/media coverage; $1B Series B press;
            World Labs blog; partner announcements; Marble Labs showcase
        - id: trial
          label: Trial
          detail: >-
            Free tier world generation; World API developer access; research download; Marble
            Labs showcase experiment
        - id: adoption
          label: Adoption
          detail: >-
            Pro/Max subscription for commercial rights; World API integration in partner product;
            Marble embedded in robotics simulation pipeline
