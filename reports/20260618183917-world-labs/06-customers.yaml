  - id: named-customer-proof
    title: Named Customer Proof — Integration, Collaboration, and Showcase Evidence
    body: >-
      World Labs has published nine case studies and documented multiple developer showcase
      projects between November 2025 and May 2026, providing a body of named collaboration
      evidence. The quality of this evidence varies by integration: a handful are
      characterized as launched product features within an integrator's product (OpenArt
      Worlds, Magnific 3D Scenes), while others are explicitly framed as creative
      experiments, showcases, or research collaborations rather than production deployments
      at scale. None of the case studies include quantitative outcome metrics such as
      daily active users, API call volumes, error rates, or customer satisfaction scores;
      all are qualitative narratives produced by World Labs.


      OpenArt, described as "one of the world's leading AI creative platforms," launched
      OpenArt Worlds using World Labs' generative 3D world models as a named feature
      available to its creator base. The case study (dated May 8, 2026) describes
      integration as producing a persistent, explorable 3D environment from a single image.
      This is the highest-quality evidence of a live production integration from the
      corpus, supported by OpenArt's own product presence at openart.ai.


      Magnific, which its own case study describes as serving "millions" of daily users
      including designers, marketers, and content teams, integrated Marble for its "3D
      Scenes" product. The case study explicitly identifies the customer problem (AI
      generators lack spatial control for product placement) and describes the solution
      as a 3D scene composition tool. The Magnific homepage at magnific.com confirms the
      platform's scale as a creative tool. The combination of a clear problem statement,
      named product, and large existing user base makes this among the stronger
      integration proof points.


      Lightcraft's collaboration with Joshua Kerr and Beeble produced a virtual production
      use case: an iPhone-based workflow combining Marble-generated 3DGS environments
      with Lightcraft Jetset's Emmy-winning Previzion-based AR compositing. This is a
      named filmmaker showcase rather than a platform deployment but evidences the viability
      of Marble in real production settings with professional tooling.


      Rosebud AI (game creation via natural language), VIVERSE (HTC browser-based 3D
      worlds), and Escape (2D-to-3D interactive media) are documented as research
      collaborations and early-production experiments. Rosebud's case study describes a
      prototype game; VIVERSE's describes experimental worldbuilding; Escape is referenced
      in the World API announcement as already using the API to turn films into navigable
      3D environments. These range from showcase to early production.


      The robotics segment collaboration involves named researchers (Hang Yin and Abhishek
      Joshi) and documents integration with NVIDIA Isaac Sim, MuJoCo, and RoboSuite.
      The World Labs case study on "2-simulate" describes how Marble accelerates
      robot training environment generation. These are research collaborations, not
      commercial contracts.


      SHoP Architects is the sole enterprise-class named customer in the architecture
      segment, quoted in the World API announcement with a testimonial about reducing
      the communication gap between designers and clients. No contract or deployment
      scale is described.


      The Marble Labs showcase (worldlabs.ai/labs) lists at least 18 developer and
      artist projects, including an AI-native 3D pipeline by Matt Workman (with fal
      and the open-source IMAGE-BLASTER toolkit), a real estate visualization project,
      and a Volinga/Unreal Engine integration. These showcase entries constitute
      developer-signal evidence of platform adoption beyond formal case studies but
      do not represent commercial relationships.
