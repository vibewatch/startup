    reason: >-
      Figure FU004 uses matrix type instead of the planned cohort type because World Labs has
      disclosed no numeric NRR, GRR, churn, or retention percentages as of June 2026; a cohort
      figure requiring 0–100 values would force the invention of unsupported retention metrics.
      The matrix format presents qualitative integration-activity signals across time periods
      honestly, representing the evidence gap rather than fabricating retention percentages.

callouts:
  - calloutType: strength
    title: World API Multiplier — Six Named Integrations Extend Reach to Potentially Millions of End Users
    body: >-
      World Labs' World API model enables a structurally efficient customer acquisition mechanism:
      each platform integrator that ships an API-powered feature (OpenArt Worlds, Magnific 3D Scenes)
      exposes Marble world generation to its own existing user base without World Labs bearing the
      full acquisition cost of those end users. OpenArt describes itself as "one of the world's
      leading AI creative platforms" and Magnific's case study references "millions" of daily users.
      If even a modest fraction of these integrators' users engage with Marble-powered features, the
      effective reach of World Labs' technology could far exceed its direct subscription count.
      This is a genuine structural advantage over a pure direct-sales model at this stage of
      company scale (≤50 employees).
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU009
      - CU016

  - calloutType: risk
    title: Retention and Concentration Blind Spots — Zero Public Metrics and Creative-Sector Concentration
    body: >-
      Two investor-risk blind spots dominate the customer chapter. First, World Labs has disclosed
      no retention metrics — no NRR, GRR, churn, or customer counts — making it impossible to
      assess whether named integrations are durable commercial relationships or one-time experiments.
      The May 2026 OpenArt case study is the sole evidence suggesting continued engagement beyond
      initial launch. Second, the named customer base is heavily concentrated in creative and media
      applications (six of eight integrations); robotics and AEC are represented by research
      collaborations rather than commercial contracts. Deloitte's research specifically identifies
      compliance complexity, regulatory uncertainty, and workforce readiness as AI adoption barriers
      that extend enterprise sales cycles — factors World Labs must overcome to diversify beyond
      creative media. Both blind spots are addressable only through private data access.
    claimRefs:
      - CU020
      - CU021
      - CU026
      - CU027
      - CU028
      - CU039

