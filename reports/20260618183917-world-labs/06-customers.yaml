chapter:
  number: 6
  title: Customers
  summary: >-
    World Labs' named customer base as of June 2026 spans three principal segments: individual
    creators on self-serve subscriptions, AI-native platforms embedding the World API into their
    own products, and robotics/embodied-AI researchers generating synthetic training environments.
    Published case studies document at least six named platform integrations — OpenArt, Magnific,
    Rosebud AI, VIVERSE, Lightcraft, and Escape — plus a NVIDIA Isaac Sim robotics use case and
    multiple developer showcases, but no customer counts, NRR, churn, or revenue metrics have
    been disclosed; retention and expansion dynamics remain unobservable from public evidence.

sections:
  - id: customer-segmentation
    title: Customer Segmentation and Buyer Profiles
    body: >-
      World Labs' addressable customer population divides into three segments defined by
      how buyers interact with the product, what they pay, and what value they extract.


      The individual creator segment encompasses filmmakers, digital artists, architects,
      interior designers, game creators, and VR/XR developers who access Marble through
      self-serve subscription tiers ranging from Free through Standard ($20/month), Pro
      ($35/month), and Max ($95/month). These customers are simultaneously the buyer, user,
      and payer. Published case studies document filmmakers such as Tim Simmons (Theoretically
      Media, 170,000+ YouTube subscribers) and Joshua Kerr using Marble as a virtual film
      set or virtual production tool; architects and interior designers using Marble to
      step inside concepts before formal modeling; and VR developers like Daniel Skaale
      building interactive Unity experiences with Marble-generated Gaussian splat environments.
      Commercial usage rights begin at the Pro tier, concentrating defensible recurring revenue
      in the higher tiers. Total subscriber count across tiers is not publicly disclosed.


      The AI-native platform and API integrator segment comprises companies that embed
      World Labs' world-generation capability via the World API into their own products,
      becoming an intermediate buyer whose end users access Marble indirectly. This segment
      offers the highest revenue-multiplier potential because each integration extends
      World Labs' effective reach to the integrator's existing user base without proportionate
      direct acquisition cost. Named integrators include OpenArt (launched OpenArt Worlds
      as a persistent 3D environment product feature), Magnific (integrated Marble for a
      3D Scenes tool serving its large creative platform user base), Rosebud AI (game creation
      pipeline), VIVERSE (browser-based 3D interactive worlds), Lightcraft/Beeble (virtual
      production), and Escape (2D-to-3D interactive media). API pricing is not publicly
      disclosed; contract values and revenue split are unknown.


      The robotics and embodied-AI research segment consists of academic researchers and
      engineering teams using Marble-generated environments as synthetic training data for
      robot learning pipelines. Documented examples include researchers Hang Yin
      (BEHAVIOR-1K/OmniGibson) and Abhishek Joshi (RoboSuite/Infinigen-Articulated) who
      used Marble alongside NVIDIA Isaac Sim, MuJoCo, and RoboSuite. This segment is
      high-value technically but is populated primarily by research groups rather than
      commercial operators at this stage; conversion to paid enterprise contracts is
      unconfirmed.


      A fourth emerging segment is the strategic enterprise partner tier, anchored by
      Autodesk's $200 million investment and a stated focus on media and entertainment
      workflow collaboration. Architecture firms (Fenestra, xFigura, SHoP Architects) and
      virtual production tools (Preview) round out this segment, but commercial terms for
      all enterprise relationships are undisclosed.
