  topStrengths:
    - >-
      World-class founding team spanning ImageNet, NeRF, frontier computer vision, and graphics research gives the
      company rare technical credibility in spatial AI.
    - >-
      Marble and the World API have moved beyond research framing into generally available product surfaces with named
      integrations across creators, design workflows, and robotics simulation.
    - >-
      Strategic backing from Autodesk, NVIDIA, AMD, a16z, and other top-tier investors increases capital access and
      potential distribution optionality.
  topRisks:
    - >-
      No public revenue, ARR, retention, unit economics, or confirmed valuation disclosure exists, so the implied
      February 2026 price remains a vision multiple rather than an operating multiple.
    - >-
      Commercial proof is still early: many public references are showcases, collaborations, or research-oriented
      integrations rather than scaled enterprise deployments with disclosed contract values.
    - >-
      Big-tech and open-source competitors in world models, 3D generation, and physical AI could compress pricing or
      narrow differentiation before World Labs establishes durable go-to-market advantages.
  unresolvedGaps:
    - >-
      Audited or management-confirmed revenue, ARR, gross margin, and burn-rate data for Marble subscriptions and the
      World API
    - Commercial terms and distribution commitments, if any, attached to Autodesk's $200 million strategic investment
    - Confirmed post-money valuation, preference stack, and dilution implications for the February 2026 round
    - >-
      Named production customers with contract scope, renewal evidence, and separation of pilot activity from scaled
      deployments
