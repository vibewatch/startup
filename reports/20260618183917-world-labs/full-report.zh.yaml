            body: >-
              本章中的乐观、基准和悲观情景估值，均为分析性估计，来自假设收入水平，以及可比高增长私营 AI 公司提供的示例收入倍数。World Labs
              没有提供收入指引，也未披露任何收入。读者应把所有情景数字视为投资决策框架中的方向性输入，而不是价格目标或收入预测。Bloomberg 报道的 $5 billion 隐含估值在此作为市场参考点复现；World
