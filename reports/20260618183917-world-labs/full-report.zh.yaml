        - 没有直接相机元数据或镜头模拟；视觉保真度与实体 VFX 舞台的对比未评估
      - - 机器人：仿真训练环境
        - 手工整理环境（仓库、厨房、办公室）——慢、贵，规模化后一致性差
        - 生成带深度、光照、几何和碰撞体网格的多样化照片级场景
        - 研究者 Yin 和 Joshi 用 Marble 做域随机化；导出物理准确的碰撞体用于交互
        - 相对专用仿真器（Isaac Sim、MuJoCo）的物理保真度上限未量化
      - - 建筑 / 设计：概念可视化
        - 草图 → 静态渲染 → 动画；空间体验推迟到项目后期
        - 将概念图输入 Marble；几分钟内得到可行走的 3D 环境
        - Fenestra 和 Interior AI 案例显示，可生成可探索的 3D 概念用于客户评审
        - 无 BIM 数据导出；无结构保真度；户外 / 城市场景处理记录有限
      - - 游戏 / 浏览器游戏：环境创建
        - 手工环境美术 + 关卡设计；单资产制作成本高
        - 生成环境、提取碰撞体，并以少量手工工作接入 Unreal Engine 或 Unity
        - STARSPEED：浏览器中的 100M-splat 科幻环境；Unity 中的 Splat World VR 体验
        - 不生成程序化游戏逻辑或 AI NPC 行为；仅限静态环境
      - - VR / AR：沉浸式空间体验
        - 手工建模或扫描环境；空间概念迭代慢
        - 生成世界、导出 splat，通过 Spark 导入 Meta Quest 3 或 WebXR 会话
        - Splat World VR 体验已在 Meta Quest 3 测试；基于 splat 数据构建了自定义 C# 物理工具
        - 未基准测试低端头显上的独立 VR 性能；蜂窝网络延迟未记录
    notes: 已记录收益基于公司发布的案例和开发者展示材料；与既有工作流的可衡量性能对比来自公司主张或作者报告，未经独立审计。限制由观察到的范围缺口推断。
