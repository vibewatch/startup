      - number: '3.2'
        title: 能力与价格对比
        blocks:
          - type: paragraph
            body: >
              World Labs 的 Marble 以多模态输入广度做差异化：文本、图像、视频、粗略 3D 布局和全景图都可作为生成输入，World Labs 称这是同类首创能力。公司的 web 端 3DGS 渲染器
              Spark 2.0 提供 Level-of-Detail 流式系统，可在用户导航时按视角优化 Gaussian splatting 世界细节，让任何带 web 浏览器的设备都能渲染大世界——这一能力在 Luma
              AI 或 NVIDIA Cosmos 的公开文档中不可见。Luma AI 的交互式场景可在 iOS、Android 和 web 上以 8 MB（物体）和 20 MB（场景）、30 FPS 嵌入；Luma
              还发布了用于定向视频的 RAY3.2 和用于品牌特定模型训练的 UNI-1，把竞争面扩展到 3D 捕捉之外。NVIDIA Cosmos 面向 physical AI
              开发者，提供开源模型权重，覆盖文本、图像、视频和环境声音输入的世界生成，并专攻机器人与自动驾驶合成数据生成。Magic123 的学术工作（2023）证明，在开源学术语境下，结合 2D 和 3D diffusion
              priors 可以实现单图到 3D 物体生成，说明底层技术并不锁定在专有系统中。价格是一个实质未知数：World Labs 尚未公布 World API 价格，并采用 gated early-access
              模式；NVIDIA Cosmos 开源（无明确许可成本，但基础设施成本仍然存在）；Stability AI 的 Stable Zero123 可用于非商业和研究用途，商业用途需要会员（价格未披露）；OpenArt
              平台提供免费层图像和视频工具，但 OpenArt Worlds 3D 层价格未单独披露。
