      - number: '4.5'
        title: 公开牵引力缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              World Labs 于 2025 年 11 月实现产品 GA，并在 2026 年 1 月推出开发者 API。截至 2026 年 6 月——GA
              后七个月、种子轮后十七个月——公司未披露收入、ARR、客户数、毛利、月度 burn，或任何单位经济指标。投资规模（$1.23 billion）与财务透明度之间的落差，是同阶段私营 AI
              公司中最宽的一类；这符合更广泛的空间 AI 投资逻辑：资金押注创始人履历和技术差异化，而不是已被证明的商业牵引力。


              财务画像的正面叙事建立在三根支柱上。第一，$1.23 billion 资本由 Autodesk 的战略支票锚定，给公司提供多年运营弹性，不必短期内优化收入。第二，六个具名 API
              集成落地在运营平台上（OpenArt、Magnific、Rosebud、VIVERSE、Lightcraft、Escape），再加上 NVIDIA Isaac Sim
              机器人仿真用例，说明产品已经商业部署，而不只是实验室测试。第三，订阅定价架构——Pro（$35/mo）作为商业使用权入口——形成天然升级漏斗，即使企业合同尚未放量，也应从创作者和专业消费者群体产生一些近期收入。


              风险叙事有两个主要财务维度。第一是采用门槛：Deloitte 的企业 AI 采用研究指出，合规复杂度、员工准备度和监管不确定性会拉长企业销售周期并提高获客成本；这些因素同样作用于 World Labs 的企业
              GTM 目标。第二是资本集中：Crunchbase 数据显示，基础 AI 融资在 2026 年 Q1 翻倍以上，但越来越集中到少数前沿巨头。对 World Labs
              这样的非最前沿玩家而言，这种集中格局意味着，如果企业收入轨迹未能足够快地显现，在当前资本基础被大幅消耗时，一个假设中的第三轮融资可能面临更高稀释或不利市场条件，这不是小风险。


              财务结论是：公开证据能可信地支撑资本承诺、团队质量，以及已越过原型阶段的产品化动作。它不能支撑收入质量承保。仅凭公开证据，任何投资者都无法确定仓位规模或建模回报情景。最低尽调要求包括：管理账或审计财报、API
              定价表和当前企业合同管线、月度现金 burn 与 runway 预测，以及 Autodesk 合作中除已披露投资之外的财务条款。
