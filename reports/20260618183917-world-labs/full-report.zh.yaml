      - number: '2.5'
        title: 规模测算矛盾、估算缺口与开放问题
        blocks:
          - type: paragraph
            body: >
              本章的规模测算分析保留而不是消解了几个重要缺口。最根本的缺口是品类层面：没有第三方分析师把「空间智能基础设施」或「3D generative
              AI」定义为独立市场品类。因此，规模测算完全依赖代理，而这些代理——广义生成式 AI 和数字孪生——在范围上相差约两个数量级（数字孪生：2025 年 $21B；广义生成式 AI：2025 年
              $53B）。两者都不是 World Labs 的「正确」市场；公司的实际可服务市场是二者的子集。


              第二个缺口是分析师估算相互冲突。MarketsandMarkets 预测数字孪生市场到 2030 年 CAGR 为
              47.9%；其他来源根据品类边界纳入内容不同，暗示更低增长。这些预测背后的方法是自上而下、基于调查的估算，并未得到独立验证。任何单一分析师数字的不确定区间都应至少按 ±50% 看待。


              第三个缺口是私有证据：World Labs 未披露收入、ARR、客户数或 API 调用量，因此无法用实际变现数据推导自下而上的 SAM。公司已融资 $1.23 billion，并有 $5 billion
              报道估值目标，意味着投资人期待其最终取得市场领导地位；但支撑这些期待的具体收入模型仍未公开。


              第四，机器人与具身 AI 的 SAM 对一个假设高度敏感：机器人 R&D 支出中有多少用于仿真环境创建，而不是硬件、软件和运营——公开资料没有拆分。$0.5B–$2B
              的自下而上估算来自一般机器人市场数据推断，而不是仿真基础设施支出的直接证据。


              最后，关于空间 AI 采用放缓或市场怀疑的独立证据有限。已有来源主要呈现正面信号（Autodesk 投资、客户案例研究、学术验证）。不应把缺少负面证据视为市场热情一致的确认；考虑到 Deloitte
              等机构记录的整体 AI hype cycle 动态，这更应被视为研究缺口。
