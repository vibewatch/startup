  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现界面
        blocks:
          - type: paragraph
            body: >-
              World Labs 目前通过两个主要产品界面变现：面向 Marble 世界生成平台的直接订阅服务，以及把同样能力开放给开发者和企业团队的程序化 API。第三个界面——通过 Autodesk
              获得的战略合作收入——已经存在，但除 $200 million 投资披露外，商业条款尚未公开。


              Marble 订阅分为四档。Free 允许有限世界生成，不含商业权利。Standard 每月 $20，扩大生成预算。Pro 每月 $35，加入明确的商业使用权，是创作者可将 Marble
              输出嵌入付费交付物的第一档。Max 每月 $95，提供包括最高保真输出在内的全部功能。这个价格曲线位于 prosumer 创意工具与专业 3D 软件之间：比 Cinema4D 或 Houdini 等高端 DCC
              软件席位许可便宜，但明显高于商品化图像生成工具。各档实际收入结构未披露；Free、Standard、Pro 和 Max 用户的相对权重未知。


              World API 于 2026 年 1 月 21 日发布，使开发者可以用文本、图像、全景图或视频输入，以程序化方式调用 Marble 世界生成。API 产生一个异步任务，并交付完整可导航的 3D 世界。截至
              2026 年 6 月，未观察到 API 的公开价格表；这符合早期企业 API 产品的常见形态，即按客户谈判定价，或置于申请流程之后。API 的设计——提交请求、接收可导航世界——在架构上与按使用量的 token
              或 credit 定价一致，但这是推断，并未得到任何公开披露确认。


              Autodesk 合作是最显眼的企业变现信号。Autodesk 投资 $200
              million，并将担任战略顾问，初始重点放在媒体和娱乐用例。除最初娱乐焦点外，双方未披露合同金额、收入分成条款或产品集成路线图。随着 Autodesk 将 Marble
              能力接入其设计与施工工具链，该合作可能发展为经销或嵌入式 API 安排，但目前这仍是前瞻可能性，而非已验证事实。


              商业使用权——区分 hobbyist 与专业用途的变现分界线——从每月 $35 的 Pro 档开始提供。这个结构特征对财务建模很重要：任何希望把 Marble
              输出用于客户项目、媒体制作或嵌入式产品的订阅者，都必须使用 Pro 或 Max，这会把有商业意图的订阅者集中到两个更高档位，也就是最持久、最可防守的收入。Free 和 Standard
              档主要是转化漏斗，还是会产生有意义的流失，仍未知。
