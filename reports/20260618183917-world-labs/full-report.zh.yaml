  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              World Labs 的 Marble 在四个不同竞争层面展开竞争。第一层是直接的世界模型同行：Google DeepMind 的 Genie 2（2024 年 12
              月）是一个基础世界模型，可从单张提示图生成动作可控、可玩的 3D 环境，主要面向 AI agent 训练，而不是商业内容工作流。总部位于 Palo Alto 的 Luma AI 称其使命是打造「unified
              general intelligence that can generate, understand, and operate in the physical world」，并提供 web 浏览器上 30 FPS
              的交互式 3D 场景——直接争夺 World Labs 瞄准的创意生成市场。第二层是基础设施 incumbent：NVIDIA Cosmos（version 3）是开放的 physical AI 基础模型，在
              GitHub 和托管目录中免费提供，覆盖视觉 AI 推理、机器人策略训练、世界仿真和合成视频数据生成。NVIDIA Isaac Sim 是建立在 Omniverse 上的开源仿真框架，集成 Cosmos
              世界基础模型，用于机器人合成数据增强，并在机器人仿真用例上直接与 Marble 竞争。第三层是相邻创意 AI 平台：Magnific（前 Freepik）、OpenArt 和 Stability AI 的
              Stable Zero123，在物体生成和 2D-to-3D 层面有重叠能力，尽管它们都尚未推出与 Marble 等价的场景级生成式世界模型
              API。第四层是同时构成替代品的分发伙伴：OpenArt、Magnific、Rosebud AI、VIVERSE（HTC）和 Lightcraft 目前通过集成分发
              Marble；但一旦替代或自研世界模型可用，它们都可能降低对 World Labs 的依赖。现状方案——在 Blender、Autodesk Maya 或游戏引擎资产工作流中手工创建
              3D——仍是成本有效的替代品，适合不愿把流水线改造为生成式 AI 工具的买家；对资源充足团队而言，内部自建（定制世界仿真代码、Magic123 等开源学术模型）也可行。Google DeepMind 的 SIMA
              agent 框架增加了互补研究层；如果商业化，它会把 DeepMind 的版图延伸到 World Labs 通过 API 瞄准的 agentic 用例。
