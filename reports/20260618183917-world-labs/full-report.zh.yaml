      - number: '5.4'
        title: 差异化、IP 与数据策略
        blocks:
          - type: paragraph
            body: >-
              World Labs 的主要技术差异化建立在两根支柱上：创始团队直接参与了产品内嵌神经渲染技术的原创工作，以及内部构建了一个没有直接开源等价物的网页渲染器。两者叠加，形成一个难以被「把公开 baseline
              拼起来」的团队复制的产品，因为最关键的优化——Spark 的多对象渲染、LoD 流式传输和动态 shader graph——都是为解决 World Labs 自身部署约束而开发，并未开源。

              创始团队的学术发表记录与核心产品直接相关：Ben Mildenhall（NeRF、Mip-NeRF 360）、Christoph Lassner（Pulsar）和 Justin
              Johnson（PyTorch3D、3D 场景理解研究）共同创作了 Marble 和 Spark 所用神经渲染管线的基础技术。这些不是背景专利或防御性申请；它们正是其他 3D AI
              公司赖以构建的论文。原作者亲自开发下一代，在模型架构和优化上形成有意义的阶段性优势。

              Marble Labs 开发者社区充当分销与数据飞轮。每个公开 showcase 都展示一个新集成表面（Unreal Engine、Unity、NVIDIA Isaac
              Sim、VR、机器人），进而吸引更多开发者，并产生更多真实世界使用数据，可反哺模型训练和能力路线图。这种有机生态发展符合平台策略：World Labs 投入核心模型和渲染器，社区扩展集成表面。

              一个不确定领域是训练数据策略。World Labs 未披露 Marble 使用哪些 3D 数据集训练，训练数据获取受何种数据许可策略约束，或存在哪些专有数据积累优势。Objaverse-XL（来自 Allen
              AI 的 10M+ 对象）和 Infinigen 程序化生成器这类大规模 3D 数据集，代表了世界级 3D 生成所需的训练基础设施类型；但 Marble 的具体数据管线仍未披露。研究中未发现独立基准把
              Marble 输出保真度与竞争系统比较，因此现阶段无法进行第三方质量评估。
