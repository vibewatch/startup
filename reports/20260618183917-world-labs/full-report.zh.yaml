            body: >-
              World Labs 当前的信任文档——负责任披露页面（无漏洞赏金）、AUP、ToS 和隐私政策——适合消费者产品，但低于企业采购通常要求。缺少 SOC 2 Type II、ISO 27001 或 AI RMF
              符合性文件，再加上数据保留和训练数据使用政策未披露，会给国防、建筑、医疗或政府承包等受监管行业客户制造摩擦。World Labs
              正积极瞄准的机器人和建筑垂直领域，客户多半有供应商安全问卷要求；按当前姿态，如果没有额外披露，很难满足这些要求。
            calloutType: risk
            claimRefs:
              - CE045
              - CE049
              - CE050
          - type: callout
            title: Marble Labs 生态作为低成本集成扩张策略
            body: >-
              Marble Labs showcase 库展示了一种由开发者牵引的集成扩张，World Labs 不需要直接配人或出资。每个新 showcase（Unity VR、Unreal Engine、NVIDIA
              Isaac Sim、Rapier3D 物理、Colyseus 多人）实际上都扩展了 API 的集成表面，并产生真实世界使用证据，补充 World Labs
              自己的案例材料。如果社区飞轮能持续，它会降低生态开发的边际成本，同时为企业销售生成有机证明点。风险在于，缺少支持的社区集成可能在版本边界处失效；如果没有正式 SDK 维护承诺，开发者体验会碎片化。
