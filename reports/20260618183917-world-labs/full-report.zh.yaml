      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              World Labs 的市场不是单一整体：四个已识别买方细分各自拥有不同买方画像、预算所有者、采用触发点和销售动作。要判断 World Labs 当前产品（订阅 SaaS +
              API）能否同时服务四类客户，还是需要按细分市场分别设计 go-to-market，必须先理解这种异质性。


              媒体与创意制作细分包括独立电影人、数字艺术家、VFX 工作室和 AI-native 创意团队。这些买家主要以个人订阅或小型工作室订阅方式使用 Marble；相关价格点是 Pro
              档（$35/month）。创意电影案例研究记录的用例，是把 Marble 当作持久虚拟外景地，省去每个镜头重建场景，并在 AI
              生成视频镜头之间保持空间一致性。采用触发点是生成式视频的一致性问题——这是一个被广泛报道的限制，而世界模型提供的空间锚定正好直接解决它。


              机器人与具身 AI 细分包括大学研究实验室、机器人创业公司和硬件 OEM 的 R&D 团队。预算通常来自 R&D grant、风险投资或内部实验室分配。采用触发点是数据瓶颈：World Labs
              机器人案例研究明确把「high-quality, diverse simulation data」称为机器人研究中「one of the biggest limiting factors」，并展示 Marble
              生成数千个物理准确场景，可导出为兼容 MuJoCo 和 Isaac Sim 的环境。DeepMind 的 Genie 2 和 SIMA，以及 NVIDIA 的 Cosmos 平台，都验证了市场对可扩展、多样化
              3D 训练环境的需求，尽管它们覆盖具身 AI 工作流的环节略有不同。该细分的自下而上 SAM 估计为 $0.5B–$2B，但证据稀疏。


              建筑与设计（AEC）细分使用 Marble 做从概念到 3D 的沉浸式可视化——把草图和渲染阶段压缩成一个可探索的空间世界。早期合作伙伴 Fenestra 和 Interior AI
              为该工作流提供客户证明。相关预算所有者是设计公司负责人，或通过 API 集成 Marble 的工具供应商；Autodesk 合作（$200M 投资）显示该垂直领域的战略重要性。付款方通常是 B2B SaaS
              席位预算或 API 集成预算。


              开发者与 API 细分最广，但渗透最低：任何需要按需生成 3D 环境的软件产品都可以集成 World API。采用触发点是可编程世界生成端点的技术可用性，类似 OpenAI 的 API 如何把 LLM
              用例扩展到数千个应用。该细分长期潜力最高，但需要开发者生态、文档成熟度，以及 World Labs 仍在建设中的延迟 / 成本表现。


              Luma AI 的交互式 3D 场景（可嵌入、通用可分享，3D 文件 8–20 MB、30 FPS）显示，只要 web 交付性能足够好，开发者 / 创意细分会响应空间 3D 产品；这也为 World Labs 的
              Spark 2.0 流式平台设定了基准。
