          items:
            - 文本提示词
            - 单张图像
            - 多图像组
            - 视频片段
            - 360 度全景
            - 粗略 3D 布局
        - label: 世界模型核心（Marble）
          detail: 生成式世界模型，把输入信号提升为统一、持久、可导航的 3D 世界表示
          items:
            - 多模态编码器
            - 生成式 3D 世界合成（NeRF / 3DGS 路线）
            - 交互式编辑与扩展
            - 碰撞体网格生成
            - 多世界组合
        - label: 渲染引擎（Spark 2.0）
          detail: World Labs 自研的网页端 3DGS 渲染器；可在任何 WebGL2 设备上运行，包括移动设备和 VR 头显
          items:
