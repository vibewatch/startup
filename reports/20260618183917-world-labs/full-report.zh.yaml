      - number: '5.5'
        title: 信任、安全、安保与合规
        blocks:
          - type: paragraph
            body: >-
              World Labs 发布了三份面向公众的政策文件，定义其信任与合规姿态：服务条款（2026 年 1 月 21 日生效）、隐私政策（2025 年 11 月 12 日生效）和可接受使用政策（AUP，最后修改于
              2025 年 11 月 12 日）。AUP
              对企业尽调最具操作相关性：它明确禁止生成儿童性虐待材料、设计或协助大规模杀伤性武器、开发用于未授权监控或关键基础设施攻击的工具，以及在未经同意情况下制造伤害个人的欺骗性合成媒体。这些禁令可按 TOS
              执行，并可能导致账户终止。

              相对企业软件规范，安全姿态明显有限。worldlabs.ai/security 上的安全页面描述了一个负责任披露计划，要求报告发送至 security@worldlabs.ai，但明确表示 World Labs
              目前没有公开漏洞赏金计划，也不保证对漏洞报告提供补偿。公开文档没有提到渗透测试频率、基础设施安全架构、数据加密标准或访问控制政策。截至 2026 年 6 月，公司网站上未发现 SOC 2 Type II、ISO
              27001 或 AI 专项认证（例如符合 NIST AI RMF 或 EU AI Act 条款）。

              隐私政策确认会收集账户信息、使用数据、提示输入、生成内容互动，以及来自第三方集成的数据。该政策没有说明数据保留期限，也没有说明用户提交的图片或提示是否用于模型训练；对企业客户而言，这是关键问题，因为他们的专有设计或仿真输入可能会影响模型。

              从监管角度看，研究中未发现与 World Labs 产品相关的执法行动、监管问询或诉讼。NIST 的 AI Risk Management Framework（AI RMF）是负责任 AI 部署的参考标准，而
              World Labs 当前文档没有声称符合 AI RMF，也没有描述如何映射到该框架。随着公司进入企业垂直领域——尤其是机器人和建筑——企业采购流程会要求比当前更结构化的安全与合规文档。
