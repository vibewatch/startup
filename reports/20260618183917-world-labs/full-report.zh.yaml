      - number: '7.3'
        title: 合作伙伴、依赖与资本风险
        blocks:
          - type: paragraph
            body: >
              World Labs 的合作伙伴生态形成了一种不寻常的依赖结构：两家主要硬件供应商 NVIDIA 和 AMD 同时也是股权投资者。两家公司都参与了 2026 年 2 月的 $1 billion
              融资；Autodesk 也参与其中，投资 $200 million，并承担顾问角色。这组战略投资者在商业上有利——既传递可信度，也锁定供应关系——但也集中化了议价权。在竞争张力下（NVIDIA Cosmos
              在机器人仿真中直接竞争 Marble），NVIDIA 可能利用供应杠杆或顾问接触，把 World Labs 推向有利于自有平台的结果。TechCrunch 报道确认，Autodesk
              首席科学家把这项合作描述为「early days」，商业产品形态「尚未确定」，并明确指出数据共享不属于协议内容。如果 Autodesk 合作到 2027 年仍未产出联合商业工作流或集成产品，Autodesk
              $200 million 承诺背后的战略理由会变弱。


              World Labs 尚未披露其是否运营自有 GPU 数据中心基础设施，还是依赖超大规模云服务商提供训练和推理算力。NVIDIA Cosmos
              是一家拥有大得多算力访问权、且已有机器人仿真生态的公司开发的竞争性世界基础模型，在企业仿真细分市场构成直接替代威胁。DeepMind 的 Genie 2 进一步说明，World Labs
              正在与算力预算几乎没有上限的组织竞争。


              资本层面，Crunchbase 2026 年 Q1 数据显示，全球 AI 风险投资达到 $300 billion，但其中 65% 被四家公司拿走。如果空间 AI 无法在 2026–2027
              年证明可触达收入，中型前沿 AI 初创公司的后续融资会收紧。Gartner Generative AI Hype Cycle 2026 暗示，一些生成式 AI
              类别正接近膨胀预期峰值，随后的低谷可能压缩估值倍数，并限制 World Labs 未来融资窗口——公司尚未确认传闻中的 $5 billion 估值。
