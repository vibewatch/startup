            title: World API 乘数——六个具名集成把触达扩展到潜在数百万终端用户
            body: >-
              World Labs 的 World API 模型带来结构上高效的获客机制：每个平台集成商只要发布一个 API 驱动功能（OpenArt Worlds、Magnific 3D Scenes），就能把 Marble
              世界生成暴露给自身既有用户群，而 World Labs 不必承担这些终端用户的全部获客成本。OpenArt 称自己是「全球领先的 AI 创意平台之一」，Magnific
              案例提到其拥有「数百万」日活用户。即便这些集成商用户中只有一小部分使用 Marble 驱动功能，World Labs 技术的有效触达也可能远超其直接订阅用户数。以公司当前规模（≤50
              名员工）看，这相对纯直销模式是真正的结构性优势。
