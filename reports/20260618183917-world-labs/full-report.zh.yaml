      - number: '5.3'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              Marble 以浏览器原生产品形态部署，不需要专有桌面客户端。用户在 marble.worldlabs.ai 访问产品；无需特殊设置或安装工具。世界生成通过 World API 异步运行，API 接受标准
              HTTP 请求并返回可导航的 3D 世界对象。这个设计让它很容易接入现代 Web 应用、游戏前端和仿真管线：创建世界变成一次可编程 API 调用，而不是一项 3D 管线工程任务。

              展示和案例材料记录的第三方集成覆盖了广泛的下游环境。Volinga 插件演示了 Unreal Engine 集成，可导入 Marble 生成的 Gaussian splat
              环境，用于实时渲染和场景精修。Splat World 和 Splat Raycasting 案例记录了 Unity 集成，其中自定义 C# 工具操控 splats，用于 VR 游戏玩法和机器人移动。NVIDIA
              Isaac Sim 集成记录在一个机器人案例中，Marble 生成的场景——包括碰撞体 mesh 导出——被用作机器人学习训练环境。AI 原生 3D 管线展示演示了 Marble 输入一个多系统编排管线，结合
              fal、mesh 生成、声音合成和 Unreal Engine。

              开发者工具正在 Marble Labs 社区中形成。开源 Third-Person Character Controller 模板展示了 Marble + Spark 2.0 + Rapier3D
              物理集成，并以可 fork 的 GitHub 包提供。Collider Builder 工具让用户能在浏览器中直接在 splat 场景上绘制碰撞几何，并导出为 .glb。STARSPEED 浏览器游戏展示了由超过
              100 million 个 Gaussian splats 组成的环境也能达到生产级交付，并通过 Colyseus 实现多人网络。

              Marble 路线图可从 Marble Labs 展示管线中部分读出：从独立世界生成，推进到支持物理的交互、虚拟化身承载、多人环境和机器人仿真，暗示平台正向交互式和智能体用例扩张。2026 年 6
              月的分类法博客专门讨论从渲染器到仿真器再到规划器的路径，释放出公司有意把世界模型延伸到在生成环境中行动的主动智能体。不过，公司没有公开承诺任何具体的前瞻功能时间线或发布计划。
