      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >
              本章审阅的分析师报告中，没有任何一份把「空间智能」或「3D generative AI」作为独立市场品类切分。规模测算只能从三个相邻视角拼出：（1）广义生成式 AI
              市场，作为上限；（2）数字孪生和仿真基础设施市场，作为空间 AI 仿真细分的功能代理；（3）基于垂直买方渗透分析的自下而上估算。


              Global Market Insights（2026 年 1 月）估算，全球生成式 AI 市场 2025 年为 USD 53.7 billion，2026 年升至 USD 83.3 billion，2035
              年预测为 USD 988.4 billion，CAGR 31.6%。该数字覆盖所有生成式 AI 产品——文本、图像、音频、视频和多模态——范围太宽，无法作为 World Labs
              的实用可服务市场。但它确认了投资人与买方语境：所有生成式 AI 品类都在快速部署并增加支出。


              MarketsandMarkets（2024 年，更新至 2025 年中数据）预测，全球数字孪生市场将从 2025 年的 USD 21.14 billion 增长至 2030 年的 USD 149.81
              billion，CAGR 47.9%。数字孪生市场可能是 World Labs 基础设施定位最接近的功能类比，因为数字孪生需要与 Marble 提供的同类空间表征和仿真能力。完整数字孪生市场包含硬件、IoT
              集成和行业特定应用，并非全部可由 World Labs 触达；但即便 10–15% 的软件 / AI 子细分，也意味着到 2030 年存在数十亿美元机会。


              自下而上的买方渗透视角给出的估计更粗：文献估计，机器人和具身 AI 训练数据细分的全球可服务仿真基础设施支出约 $0.5B–$2B；建筑与设计可视化 AI 细分约 $0.3B–$1B；开发者 API
              和创意细分仍处早期，没有可靠下限或上限。这些自下而上区间高度不确定——它们取决于机器人 R&D 预算中有多大份额分配给仿真环境创建，而不是其他研究成本——但它们确认 World Labs 现实的近期 SAM
              可能低于 $5B。


              本节的区间图（FM002）展示了数字孪生市场（目前最佳可用代理）在不同分析师来源和情景下的估算分布。相互矛盾的估算被保留，而不是平均；不确定性本身就是重要分析结论。金字塔图（FM001）展示了市场可触达性的三层
              TAM/SAM/SOM 结构。
