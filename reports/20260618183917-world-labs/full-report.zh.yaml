      - number: '6.2'
        title: 具名客户证明——集成、协作与 Showcase 证据
        blocks:
          - type: paragraph
            body: >-
              2025 年 11 月至 2026 年 5 月，World Labs 发布了九个案例研究，并记录了多个开发者 showcase
              项目，形成一组具名协作证据。证据质量因集成而异：少数被描述为集成商产品中的已上线产品功能（OpenArt Worlds、Magnific 3D Scenes），其他则明确定位为创意实验、showcase
              或研究协作，而不是规模化生产部署。所有案例都没有包含日活用户、API 调用量、错误率或客户满意度分数等量化结果指标；它们都是 World Labs 产出的定性叙事。


              OpenArt 被描述为「全球领先的 AI 创意平台之一」，它使用 World Labs 的生成式 3D 世界模型推出 OpenArt Worlds，作为面向创作者群体的具名功能。该案例（日期为 2026 年 5
              月 8 日）把集成描述为从单张图像生成持久、可探索的 3D 环境。这是证据集中质量最高的在线生产集成证据，并由 OpenArt 在 openart.ai 上的自有产品存在支撑。


              Magnific 在自己的案例中称其服务「数百万」日活用户，包括设计师、营销人员和内容团队；它为其「3D Scenes」产品集成了 Marble。案例明确指出客户问题（AI
              生成器缺少产品放置的空间控制），并把解决方案描述为一个 3D 场景构图工具。Magnific 在 magnific.com
              的首页确认了该平台作为创意工具的规模。清晰问题陈述、具名产品和庞大既有用户群三者叠加，使其成为较强的集成证明点之一。


              Lightcraft 与 Joshua Kerr、Beeble 的合作产出了一个虚拟制作用例：基于 iPhone 的工作流，把 Marble 生成的 3DGS 环境与 Lightcraft Jetset 基于
              Emmy 获奖 Previzion 技术的 AR 合成结合起来。这是具名电影人 showcase，而不是平台部署；但它证明 Marble 能与专业工具一起用于真实制作场景。


              Rosebud AI（通过自然语言创建游戏）、VIVERSE（HTC 基于浏览器的 3D 世界）和 Escape（2D 到 3D 交互媒体）被记录为研究协作和早期生产实验。Rosebud
              案例描述了一个原型游戏；VIVERSE 案例描述实验性世界构建；Escape 在 World API 公告中被提及，称其已经使用该 API 把电影转成可导航 3D 环境。这些从 showcase 到早期生产不等。


              机器人细分市场协作涉及具名研究人员（Hang Yin 和 Abhishek Joshi），并记录了与 NVIDIA Isaac Sim、MuJoCo 和 RoboSuite 的集成。World Labs
              关于「2-simulate」的案例描述了 Marble 如何加速机器人训练环境生成。这些是研究协作，不是商业合同。


              SHoP Architects 是建筑细分市场中唯一具备企业级别的具名客户；World API 公告引用了其 testimonial，内容是缩小设计师与客户之间的沟通差距。公告没有描述合同或部署规模。


              Marble Labs showcase（worldlabs.ai/labs）列出至少 18 个开发者和艺术家项目，包括 Matt Workman 的 AI 原生 3D 管线（结合 fal 和开源
              IMAGE-BLASTER 工具包）、一个房地产可视化项目，以及 Volinga/Unreal Engine 集成。这些 showcase 条目构成了正式案例研究之外的平台采用开发者信号证据，但不代表商业关系。
