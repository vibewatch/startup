      - number: '7.4'
        title: 人员、执行与财务风险
        blocks:
          - type: paragraph
            body: >
              相对于所处阶段，World Labs 的关键人物集中度极高。Fei-Fei Li 在担任 CEO 的同时，仍持有 Stanford University 的 Sequoia
              Professorship；她在创立公司时把这种双重安排描述为，在打造初创公司的同时继续「some of her work at Stanford」。联合创始人 Justin Johnson 仍在
              University of Michigan 任职。这些分时安排会在当前关键的产品市场契合阶段带来执行风险：公司必须同时拿下企业合同、扩展 API 基础设施，并完成 Autodesk 集成。Li
              的公众形象——Wired 封面人物、国会证人、UN Scientific Advisory Board 成员——会放大任何失误的声誉后果。


              财务透明度几乎不存在。World Labs 尚未披露员工人数、烧钱速度或任何收入指标。公司两轮合计融资 $1.23 billion，定位为资本密集型前沿 AI 实验室；但消费者订阅定价（免费到 $95/month
              Max）在结构上无法产生足够收入来抵消前沿模型训练成本，除非企业合同量足够大。StartupHub 分析指出，World Labs 累计融资额已经超过 Google 2014 年收购 DeepMind
              的价格，却发生在任何披露收入之前——这凸显了市场押注的是长周期资本向价值转化。


              人才获取是结构性风险。World Labs 要与 NVIDIA、Google DeepMind、Meta Reality Labs，以及包括 Luma AI 在内的资金充裕同行争夺机器学习工程和 3D
              图形人才。Deloitte 的调查证据显示，劳动力准备度是企业采用 AI 的首要障碍，意味着 World Labs 的企业客户也面临并行的人才约束，可能拖慢集成时间线，并在 2026
              年缩小复杂世界模型部署的有效可触达市场。
