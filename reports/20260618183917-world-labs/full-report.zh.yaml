      - number: '4.3'
        title: 成本结构与资本密集度
        blocks:
          - type: paragraph
            body: >-
              World Labs 的成本结构符合前沿 AI 研究和云端推理公司的特征：模型训练和实时推理的 GPU 算力占主导，薪酬盘子相对较小，没有硬件制造或库存 COGS。原则上，这是高毛利的软件结构；但生成高保真、持久
              3D 世界的算力强度明显高于可比的 2D 图像生成负载。因此，在披露前，其毛利形态更像 GPU 密集型推理服务，而不是轻量 SaaS 部署。


              员工规模仍小。The Org 的资料显示，截至 2026 年 6 月，World Labs 有 11 至 50 名员工。Ashby
              平台上的研究、工程和产品岗位招聘显示公司仍在扩招，但总员工数和月度薪酬未披露。按区间低端估算，薪酬可能是每月低个位数百万美元；即便按上限，薪酬线相对 $1.23 billion 融资额也很小。


              最大成本驱动项是算力基础设施。Marble 能从单张图片或文本提示生成空间连贯、高保真、持久的 3D 环境。每次生成都涉及神经渲染、Gaussian splat 重建和交互环境封装——每个环节都吃
              GPU。World Labs 创始人包括 NeRF 发明者和 Pulsar 作者；两人的技术背景合在一起，指向一种训练模型和单次请求推理都需要高端 GPU
              集群的渲染基础设施。最可能的算力基础设施来自云服务商或本地 GPU 伙伴，但公司未披露任何合同。


              毛利动态：Global Market Insights 的生成式 AI
              市场基准把「高基础设施和算力成本」列为该行业的主要挑战；与此同时，随着模型效率提高和算力成本下降，单次生成的边际成本预计会下滑（Stanford HAI 2026 AI Index 也提到这一模式）。World
              Labs 的长期毛利轨迹高度取决于推理效率提升，以及公司能在多大程度上靠规模拿到更好的算力经济性。公司没有公开任何自身毛利数据。


              纯软件交付模式限制了营运资本和资本开支需求。公开资料没有库存、硬件制造扩建或实体基础设施。主要资本投向预计是研发（模型训练运行）和产品基础设施（推理服务），两者都属于经营支出，固定资产强度有限。公司未披露任何债务工具或项目融资义务。
