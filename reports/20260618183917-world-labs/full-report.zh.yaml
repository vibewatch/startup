              World Labs 四位联合创始人中有三位是构成 Marble 和 Spark 神经渲染基础的学术论文主要作者：Mildenhall（NeRF，ECCV 2020 oral；Mip-NeRF
              360）、Lassner（Pulsar，arXiv 2004.07484）和 Johnson（PyTorch3D 与 3D
              场景理解研究）。这些不是外部许可技术，也不是重新包装的开源组件；它们代表如今打造产品的同一批人作出的原创架构选择。这让 World Labs
              在模型优化、训练效率和架构演进上拥有阶跃式优势，任何没有创作基础工作的团队都很难快速复制。
