      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              World Labs 的核心产品 Marble 是一条算力密集型生成管线，借助异步处理架构，把文本、图像、视频或多视角输入转换为 3D Gaussian splat 环境。每一次 World API
              调用都会触发一次完整的 3D 世界生成任务，资源消耗显著高于文本或图像推理。规模化之后，推理需求会变成运营风险：如果 GPU 供应受限，World Labs
              可能出现服务降级或限流，直接压住开发者采用。公司尚未公开披露服务级别协议（SLA）或正常运行时间保证。


              安全方面，World Labs 通过 security@worldlabs.ai 维护负责任披露计划，但没有公开漏洞赏金，因此外部研究人员主动挖掘漏洞的经济激励有限。缺少已发布的第三方渗透测试、SOC 2 证明或
              ISO 27001 认证，企业买家只能依赖信任，而不是独立审计过的保证。这个缺口在运营上很关键，因为 World API 会处理客户上传的图像、视频和 3D
              资产，其中可能包括建筑、国防和工业仿真工作流中的敏感专有场景。


              面向机器人和具身 AI 应用时，3D 生成领域长期卡在仿真到现实的保真度问题上。关于具身 AI 3D 生成的 ArXiv
              综述（arXiv:2604.26509）把物理标注有限、几何真实感缺口、评估碎片化，以及持续存在的 sim-to-real 鸿沟列为主要瓶颈。对 World Labs 的机器人用例来说，这不是假设：如果
              Marble 生成环境的物理精度不足以训练机器人策略，高价值企业用例就会碰到保真度天花板，而拥有物理原生仿真平台的竞争对手（带 Cosmos 的 NVIDIA Isaac Sim）可能先到达。Deloitte 的
              2025/2026 AI 采用调查显示，监管合规和劳动力准备度是企业采用 AI 的主要障碍——两者都直接关系到 World Labs 的目标客户。
