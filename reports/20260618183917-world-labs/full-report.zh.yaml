      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公司概览章节（第 1 章）记录了完整融资时间线；本节聚焦未来资本充足性和融资依赖。World Labs 完成了两轮融资：2024 年 9 月 $230 million 种子轮，以及 2026 年 2 月 $1
              billion Series B，合计约 $1.23 billion。种子轮由 Andreessen Horowitz、New Enterprise Associates 和 Radical Ventures
              领投，AMD Ventures、Intel Capital 和 NVIDIA NVentures 也参与。Series B 引入 AMD、Autodesk（以 $200 million
              作为锚定方）、Emerson Collective、Fidelity Management and Research Company、NVIDIA 和 Sea。Series B 投资者名单中没有 Intel
              Capital。


              投资者构成释放了明确的财务信号。Autodesk 作为单一最大支票方投入 $200 million，这是来自潜在分销伙伴和客户的战略投资，不只是财务资本；它让未来产品集成进 Autodesk
              的设计和建筑工具具备激励一致性。AMD 和 NVIDIA 作为战略共同投资者，降低了 World Labs 面临算力供应约束的可能性，因为两家芯片厂商都直接受益于其算力消耗增长。Fidelity
              Management and Research 的参与，则符合面向多年后公开市场流动性事件的成长股定位。


              Bloomberg 2026 年 1 月报道称，Series B 估值讨论约为 $5 billion——较种子轮 $1 billion 估值提高五倍。World Labs
              未公开确认或否认该数字，所审阅来源中也没有披露任何条款清单或最终估值证明。


              公开资料没有月度 burn rate、现金头寸或 runway 估算。类似阶段和团队规模的算力密集型 AI 公司，月度现金消耗通常从几百万美元到数千万美元不等，取决于训练强度。若以每月 $5 million
              的中点 burn（仅作示例；非公司披露）计算，$1.23 billion 约等于二十年 runway——这个数字并不现实，说明实际 burn 明显更高，或资本会投入更激进的模型训练和基础设施扩建。若每月 $20
              million，runway 约五年。若每月 $50 million，约两年。这些情景都无法从公开证据验证；列出它们只是为了界定范围，不是估算。公司未披露任何债务额度或项目融资义务。
