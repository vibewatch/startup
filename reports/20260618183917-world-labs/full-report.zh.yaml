      - number: '8.2'
        title: 融资背景与估值锚
        blocks:
          - type: paragraph
            body: >-
              World Labs 的融资历史记录清晰：2024 年 9 月完成 $230 million 融资，投后估值 $1 billion，由 Andreessen Horowitz、NEA 和 Radical
              Ventures 领投，AMD Ventures、Intel Capital 和 NVIDIA NVentures 参投。第二次 $1 billion 融资于 2026 年 2 月 18 日宣布，由
              Autodesk 以 $200 million 投资并以战略顾问身份锚定，AMD、NVIDIA、Emerson Collective、Fidelity Management and Research 和 Sea
              Group 加入。两轮合计融资 $1.23 billion；Reuters、TechCrunch、SiliconANGLE 和 StartupHub AI 的报道口径一致。

              隐含估值更模糊。Bloomberg News 在 2026 年 1 月报道称，World Labs 正在以约 $5 billion 估值洽谈融资——较约 16 个月前的种子轮标记上涨 5 倍。Reuters
              2026 年 2 月报道这一数字时，World Labs 拒绝确认，但公司也没有反驳 Bloomberg 报道。因此，$5 billion 数字处于中等置信度：第三方报道，且有多处引用佐证，但没有公司确认。在隐含
              $5 billion 估值且未披露收入的情况下，收入倍数无法定义——这是一个完全建立在市场相信空间智能论点之上的愿景倍数。

              World Labs 的可比公司集合有限。公司仍为私营、收入前阶段，而大多数历史先例都是已经交付显著商业证明的公司。按前沿 AI 融资画像看，最接近的类比是 Anthropic；它在 2026 年 2 月以
              $380 billion 投后估值完成 $30 billion Series G——但 Anthropic 已披露可观 ARR。3D AI 公司中，Luma AI
              仍为私营，未公开披露规模化估值。Stability AI 曾遭遇财务困难。因此，最相关的参照点是：（1）World Labs 自身种子轮倍数（$1B 投后 / $230M 融资），（2）Bloomberg 报道的
              Series B 隐含价格，以及（3）2026 年 Q1 更广泛的风险投资市场：AI 公司单季融资 $242 billion，形成异常有利的定价环境。
