    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >
              World Labs（法律实体：World Labs Technologies, Inc.）是一家位于加州旧金山的前沿 AI 研究与产品公司。公司由四位在学术计算机视觉和 3D 图形学领域积累深厚的联合创始人于
              2023 年创立，围绕一个科学命题组织起来：空间智能——AI 系统感知、生成、推理并与三维世界交互的能力——将成为大语言模型革命之后，生成式 AI 的下一个主要前沿。公司把自身使命描述为打造「Large
              World Models」（LWMs），即一类能理解并生成持久、可导航 3D 世界的基础模型，而不是生成扁平图像或文本。


              截至 2026 年 6 月，World Labs 的首个、也是主要商业产品是 Marble。Marble 是一个多模态世界模型，可从单张图像、视频片段、360 度全景图、粗略 3D
              布局或文本提示生成空间一致、高保真且持久的 3D 环境。Marble 先以限量 beta 发布，并于 2025 年 11 月 12 日在扩展功能集后正式 GA。输出包括 Gaussian
              splats、多边形网格和视频导出，可接入下游创意、设计和仿真流水线。2026 年 1 月 21 日，公司发布 World API，把 Marble
              的世界生成能力以程序化接口开放给开发者，用于嵌入第三方应用、交互系统和仿真工作流。


              商业模式以订阅为主，分为四档：Free（有限生成）、Standard（$20/month）、Pro（$35/month，含商业使用权）和 Max（$95/month，开放全部功能）。这个价格带把产品放在
              prosumer 创意工具与专业 3D 设计软件之间。公司瞄准创作者、VFX 与游戏工作室、机器人开发者和企业设计工作流。截至 2026 年 6 月，公司处在 late-seed/early-growth
              阶段：商业产品已上线、API 已发布、与 Autodesk 的企业合作在推进、累计融资 $1.23 billion，但尚未披露收入、ARR 或客户数。
