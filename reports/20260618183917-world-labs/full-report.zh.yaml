            title: 留存与集中盲点——零公开指标且集中于创意行业
            body: >-
              客户章节有两个主导投资者风险盲点。第一，World Labs 未披露任何留存指标——没有 NRR、GRR、流失率或客户数——因此无法评估具名集成是耐久商业关系，还是一次性实验。2026 年 5 月 OpenArt
              案例是唯一显示初次上线后仍持续互动的证据。第二，具名客户基础高度集中在创意和媒体应用（八个集成中有六个）；机器人和 AEC 由研究协作而非商业合同代表。Deloitte
              研究明确指出，合规复杂度、监管不确定性和员工准备度是会拉长企业销售周期的 AI 采用障碍——World Labs 必须跨过这些障碍，才能走出创意媒体。两个盲点都只能通过私有数据访问解决。
