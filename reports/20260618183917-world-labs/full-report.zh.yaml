            - THREE.js 集成
            - 细节层级流式传输
            - 多对象场景支持
            - VR / 移动端交付（Meta Quest 3）
        - label: 交付与导出
          detail: 生成世界触达客户的界面：网页产品、API，以及按格式下载
          items:
