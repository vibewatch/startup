      - number: '1.2'
        title: 领导层与创始人
        blocks:
          - type: paragraph
            body: >
              World Labs 由四位研究者共同创立，他们的合计成果覆盖了过去十年计算机视觉、神经渲染和 3D 图形学中最有影响力的一批进展。


              Fei-Fei Li 是 CEO 兼联合创始人。她担任 Stanford University 计算机科学 Sequoia Professor，也是 Stanford Human-Centered AI
              Institute（HAI）创始联席主任。2017 至 2018 年，她曾任 Google Cloud AI/ML 副总裁兼首席科学家。Li 是 ImageNet
              的设计者；这个大规模视觉数据集催化了计算机视觉的深度学习革命，并被广泛视为现代 AI 的基础要素之一。她入选 Time Magazine「100 Most Influential People in
              AI」，并获任 UN Secretary-General's Scientific Advisory Board。Li 同时保留 Stanford 的 Sequoia
              Professorship，形成双重角色安排；她称自己会在创办公司时继续「some of her work at Stanford」，这带来实质性的关键人物集中风险。


              Ben Mildenhall 是联合创始人，也是 Neural Radiance Fields（NeRF，arXiv:2003.08934）的主要发明者。NeRF 改写了从多视角图像重建 3D 场景的路径，成为
              2020 年代引用最高的 AI 论文之一。NeRF 是 Marble 世界生成能力底层渲染流水线的基础。


              Christoph Lassner 是联合创始人，曾在 Meta Reality Labs Research 和 Epic Games 领导研究团队。他在 Tübingen 的 Max Planck
              Institute for Intelligent Systems 完成博士学位。他是 Pulsar（arXiv:2004.07484）的作者；Pulsar 是一个可微分的基于球体的渲染器，现已作为
              PyTorch3D 的球体后端集成。他还在人类姿态估计和神经场景渲染领域发表了大量论文。


              Justin Johnson 是联合创始人，现任 University of Michigan（EECS）助理教授，此前曾在 Stanford AI Lab 与 Li
              合作。董事会构成、投资人董事席位和治理结构未公开披露，构成治理尽调的实质缺口。
