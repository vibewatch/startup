      - number: '6.4'
        title: 留存、耐久性、扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              公开来源完全缺少 World Labs 客户关系的留存和耐久性证据。任何订阅层级、API 客户或具名集成都没有披露 NRR、GRR、流失率、合同续约数据、cohort
              分析或客户满意度分数。缺少这些指标，符合一家早期商业化公司的状态——截至 2026 年 6 月，Marble 公开可用仅七个月——但这意味着具名集成的耐久性无法从公开证据评估：OpenArt、Magnific 或
              Rosebud 究竟仍是活跃用户，还是一次性实验性采用者，外部看不清。


              最接近的留存代理指标是：（1）2026 年 5 月 8 日 OpenArt 案例，发布于 Marble 2025 年 11 月 GA 约六个月后，至少显示截至该日期仍在持续互动；（2）World API 于
              2026 年 1 月上线时，公告中记录的具名伙伴已经立即集成，说明是发布前承诺，而不是发布后流失；（3）Marble Labs showcase 在可观察期间继续收到新项目。这些都不能替代留存指标。


              扩张信号存在，但仍早。World API 是关键扩张机制：基于 API 构建的平台集成商，会把 World Labs 的世界生成能力暴露给自身用户群，形成乘数效应增长，而不需要 World Labs
              成比例付出直接获客成本。如果 OpenArt 和 Magnific 的集成能在各自用户中获得牵引力，凭借其公开宣称的大用户基数，它们将是扩张潜力最高的账户。地理扩张，以及进入
              AEC、国防仿真或数字孪生应用的垂直扩张，仍是未来状态而非已被证实。


              集中风险实质存在。截至 2026 年 6 月，具名客户基础集中在创意 / 媒体行业（八个具名集成中有六个是游戏、电影或创意平台公司）。机器人和仿真细分市场由研究协作代表，而不是商业企业账户。AEC
              细分市场主要由早期采用者和一位被引用的建筑师代表。如果创意媒体需求走弱，或竞争工具（Luma AI、NVIDIA Cosmos）在创作者市场拿到更大份额，World Labs 的短期客户集中会带来显著收入风险。


              企业采购摩擦是 AI 平台公司普遍存在且已有记录的结构性风险。Deloitte 的企业 AI 采用分析指出，合规复杂度、员工准备度和监管不确定性会阻碍采用、拉长销售周期并提高获客成本。对 World Labs
              的目标企业垂直领域——AEC、机器人、媒体——这些障碍尤其突出：建筑事务所必须评估生成环境中的数据所有权和 IP；机器人团队必须验证用于安全关键用途的仿真保真度；媒体工作室必须确保版权和内容来源合规。World
              Labs 的 AUP 和服务条款建立了法律框架，但无法降低这一阶段 AI 工具固有的企业采购摩擦。
