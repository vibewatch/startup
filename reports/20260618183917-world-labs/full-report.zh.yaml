      - number: '4.2'
        title: GTM 路径与企业开发者代理指标
        blocks:
          - type: paragraph
            body: >-
              World Labs 的 GTM
              走的是混合路线：面向个人创作者，用产品驱动的自助购买；面向企业和开发者伙伴，走定向渠道。两条线互相补位：自助层贡献采用信号、创作者内容和社会证明，反过来支撑企业销售；Autodesk
              这类企业合作则打开大规模存量客户池，以 World Labs 当前团队规模，单靠直销自助渠道很难高效触达。


              自助订阅漏斗是最清晰的 GTM 动作。Marble 已在 worldlabs.ai 上线，消费者和专业消费者层级不需要销售辅助入门。World Labs
              官网案例记录了个人电影创作者、游戏创作者、建筑师和设计师如何在没有企业合同的情况下采用 Marble：电影人 Joshua Kerr 把 Marble 与 Lightcraft Jetset
              结合做虚拟制作；Tim Simmons 和 Henrik Vasquez（Theoretically Media）把 Marble 当作虚拟片场，让 AI 生成场景之间的镜头保持一致；Fenestra 和
              Interior AI 的建筑师用 Marble 做沉浸式设计可视化。这些用例落在 Standard 到 Pro 的价格带。


              开发者和 API 渠道由 World API 以及六个具名第三方平台集成体现：OpenArt（推出「OpenArt Worlds」，作为其创作者平台的持久 3D 环境功能）、Magnific（集成
              Marble，用于精准控制产品放置）、Rosebud AI（把 Marble 的世界生成嵌入游戏构建流程）、VIVERSE（用 Marble 生成可在浏览器中交互游玩的 3D 世界），以及
              Escape（游戏化和交互体验平台）。第七个集成——NVIDIA Isaac Sim 研究人员用 Marble 生成机器人仿真数据——延伸到企业和研究场景，说明该 API 在高风险机器人和具身 AI
              场景中具备技术可信度。


              公开资料没有销售效率代理指标。各层级均未披露获客成本、平均合同金额、回本周期或净收入留存。缺少这些指标，再叠加 Autodesk
              合作强调「探索」、联合研究与模型协作的表述，说明企业销售动作仍处在早期商业开发阶段，而不是已经规模化、可复制的销售循环。Deloitte 对企业 AI
              采用的分析指出，合规复杂度、员工准备度和监管不确定性是普遍拉长 AI 平台公司销售周期的主要阻力——这直接作用于 World Labs 更长期的企业 GTM 目标。
