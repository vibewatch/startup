  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方画像
        blocks:
          - type: paragraph
            body: >-
              World Labs 的可触达客户群可分为三个细分市场，差异在于买方如何与产品交互、支付什么，以及提取什么价值。


              个人创作者细分市场包括电影人、数字艺术家、建筑师、室内设计师、游戏创作者和 VR/XR 开发者。他们通过自助订阅层级使用 Marble，价格从 Free 到
              Standard（$20/month）、Pro（$35/month）和 Max（$95/month）不等。这些客户同时是买方、用户和付款方。已发布案例记录了 Tim Simmons（Theoretically
              Media，170,000+ YouTube 订阅者）和 Joshua Kerr 等电影人把 Marble 当作虚拟片场或虚拟制作工具；建筑师和室内设计师用 Marble 在正式建模前走进概念；Daniel
              Skaale 这样的 VR 开发者用 Marble 生成的 Gaussian splat 环境构建交互式 Unity 体验。商业使用权从 Pro
              层级开始，把可防御的经常性收入集中到更高层级。各层级总订阅用户数未公开披露。


              AI 原生平台和 API 集成商细分市场由一类公司组成：它们通过 World API 把 World Labs 的世界生成能力嵌入自身产品，成为中间买方，终端用户则间接使用
              Marble。该细分市场的收入乘数潜力最高，因为每个集成都把 World Labs 的有效触达扩展到集成商既有用户群，而不需要成比例增加直接获客成本。具名集成商包括 OpenArt（推出 OpenArt
              Worlds，作为持久 3D 环境产品功能）、Magnific（为服务其大型创意平台用户群的 3D Scenes 工具集成 Marble）、Rosebud AI（游戏创建管线）、VIVERSE（基于浏览器的 3D
              交互世界）、Lightcraft/Beeble（虚拟制作）和 Escape（2D 到 3D 交互媒体）。API 定价未公开披露；合同金额和收入分成未知。


              机器人和具身 AI 研究细分市场由学术研究人员和工程团队组成，他们把 Marble 生成环境用作机器人学习管线的合成训练数据。记录中的例子包括研究人员 Hang
              Yin（BEHAVIOR-1K/OmniGibson）和 Abhishek Joshi（RoboSuite/Infinigen-Articulated），他们将 Marble 与 NVIDIA Isaac
              Sim、MuJoCo 和 RoboSuite 搭配使用。该细分市场技术价值高，但现阶段主要由研究小组构成，而不是商业运营方；能否转化为付费企业合同尚未确认。


              第四个新兴细分市场是战略企业伙伴层级，由 Autodesk 的 $200 million 投资以及其明确聚焦媒体和娱乐工作流协作来锚定。建筑事务所（Fenestra、xFigura、SHoP
              Architects）和虚拟制作工具（Preview）补足该细分市场，但所有企业关系的商业条款均未披露。
