      - number: '3.4'
        title: 进入者压力与负面证据
        blocks:
          - type: paragraph
            body: >
              2026 年基础 AI 的竞争资本环境，给 World Labs 构成结构性逆风。Crunchbase 数据显示，2026 年 Q1 基础 AI 创业公司仅 24 笔交易就获得 $178 billion
              风险投资；OpenAI、Anthropic、xAI 和 Waymo 合计拿走当季全球 VC 的 $188 billion（65%）。这种集中意味着 World Labs
              需要与研究和产品预算远超自身的组织竞争：Google DeepMind 可以通过 Genie 2 和 SIMA 长期资助世界模型研究且无需收费；NVIDIA 可以以零许可成本免费提供 Cosmos
              模型权重，借此深化 Omniverse 生态锁定。开源学术轨迹也从下方带来进入者压力：Magic123 和类似学术 3D 生成模型说明，不依赖专有许可也能获得底层 3D diffusion
              技术，研究质量与生产质量输出之间的差距每年都在缩小。Stability AI 是独立 AI 模型公司这一原型的负面样本：它曾是生成式图像和 3D 生成（Stable
              Zero123）的早期领导者，但限制性的非商业发布姿态、商业会员要求和已披露财务困难，显示资本受限的 AI 基础设施公司有多脆弱。NVIDIA Cosmos
              的开源可用性明确加速机器人开发者采用；这些开发者本来可能评估 World Labs 的商业 World API，因此 Cosmos 直接削弱 World Labs
              在该垂直领域的定价权。最不利情景是双线挤压：NVIDIA 通过免费 Cosmos 模型把机器人仿真市场商品化，同时 Google DeepMind 将 Genie 2 商业化为创意 API，使 World
              Labs 在两个锚定市场都无法匹配 incumbent 的分发或资本深度。
            claimRefs:
