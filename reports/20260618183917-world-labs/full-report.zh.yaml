  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与结构定义
        blocks:
          - type: paragraph
            body: >
              World Labs 以一个称为「空间智能」的概念来定义市场：AI 系统感知、生成、推理并与三维环境交互的能力。这个框架把公司的产品——Marble（生成式世界模型）和 World
              API（程序化接口）——定位为基础设施，而不是单纯的 3D 美术工具或仿真平台；它让任何下游系统能够理解并生成可导航的空间世界。


              该市场的核心纳入支出包括能够生成 3D 环境或基于 3D 环境推理的 AI-native 服务：用于程序化世界创建的 API 调用、云端世界生成平台的订阅访问，以及把空间智能嵌入其他应用的集成工具。排除支出包括
              Maya、Blender 或 Houdini 等不使用 AI 生成的传统 3D digital content creation（DCC）工具；传统 CAD/BIM
              许可（AutoCAD、Revit），除非嵌入生成式 AI 能力；以及 MuJoCo 或 NVIDIA Isaac Sim 等在没有 AI 生成内容输入时单独使用的物理引擎。边界划在 AI
              生成式输出这一点：如果工具靠参数化或艺术家驱动流水线创建 3D 内容，它就是替代品，而不是同一市场的一部分。


              与其显著重叠的相邻市场包括机器人仿真基础设施（训练规模下对 sim-ready 3D 环境的需求）、数字孪生平台（AI 生成的世界表征进入镜像与监控工作流）、沉浸式设计可视化（空间 AI 替代静态渲染），以及
              AI-native 应用的开发者基础设施（World API 与云 AI API 竞争或互补）。这些相邻市场都可能成为 World Labs 扩大 SAM 的渠道，但也各自带有不同的 incumbent
              平台和买方工作流。


              各细分市场的现状替代品都很成熟：机器人研究者使用程序化生成器（Infinigen、Isaac Sim
              的资产库）、仿真框架（MuJoCo、RoboSuite）和定制环境创作；建筑师使用静态渲染和实时游戏引擎；电影制作人使用实体布景和虚拟制片棚；开发者使用独立 3D
              资产库或手工流水线。这些替代品在很多情况下免费或低成本（MuJoCo 开源；Infinigen 以 BSD-3 开源），这给 World Labs 要证明的价值设下很高门槛，才能赢得预算。


              World Labs 自己在 2026 年 6 月的分类法文章中指出，「world model」是 AI
              中最被过度使用的术语之一，同时覆盖计算机视觉、机器人、游戏研究和神经科学用例。语义范围过宽带来市场分层难题：各垂直领域买家对世界模型能提供什么有不同预期，使现阶段的一致定位和线索筛选变得困难。
