        - 到 2026 年 Q4 仍没有披露收入的企业合同
        - 未完成第三轮融资且跑道降至 12 个月以下；或到 2026 年 Q4 仍未披露 ARR
        - 重新定价以反映烧钱换价值风险；任何后续投资承诺前要求披露收入
      - - CEO 关键人物离职（Fei-Fei Li）
        - Li 宣布减少职责、休假，或辞去 CEO 职务
        - Li 全职 CEO 状态发生任何变化
        - 触发即时复核；投资论点依赖她的技术愿景和投资者 / 合作伙伴关系
      - - EU AI Act 高风险 GPAI 分类
        - European Commission 发布覆盖 Marble 算力规模的 GPAI 分类指引
        - Marble 被归为高风险；强制第三方审计要求落地
        - 加快合规计划；测算欧盟时间线对收入的影响；考虑推迟欧盟发布
      - - 算力供应中断（NVIDIA / AMD）
        - NVIDIA 或 AMD 限制 API 或云访问；或价格同比上涨 >50%
        - 供应限制被确认，或单次推理成本翻倍且没有收入抵消
        - 若 90 天内无法以同等成本锁定替代 GPU 算力，投资论点失效
      - - 训练数据被认定侵犯版权
        - 法院裁定或 Copyright Office 最终规则认定 Marble 训练数据抓取构成侵权
        - 最终不利裁定要求模型下架、重新训练或支付重大损害赔偿
        - 退出或寻求人才收购式并购；重新训练成本会吃掉大部分剩余资本
      - - Autodesk 集成失败
        - Autodesk 披露退出顾问安排，或转向内部 3D AI 自研
        - 到 2027 年 Q3 仍未宣布联合商业产品；或 Autodesk 宣布竞争产品
        - 重新评估分发论点；失去 $200M 战略伙伴会实质削弱企业叙事
    notes: |
      触发项用于监测；阈值应由法律顾问确认，并在每次董事会复核时更新。 行动含义反映投资者决策标准，不是管理层指令。
