      - number: '8.4'
        title: 退出准备度、论点失效触发器与最终尽调
        blocks:
          - type: paragraph
            body: >-
              以当前阶段看，World Labs 最可能的退出路径，是由现有投资者之一进行战略收购。Autodesk 是最明显的收购方：其 $200 million
              投资和研究层面的合作创造了期权价值，一旦商业证明成立，就可收购完整平台。NVIDIA 和 AMD 也有战略兴趣，确保世界模型在其硬件上规模化运行。IPO 有可能，但需要更充分的商业发展——AI 公司历史上的
              IPO 前基准表明，至少需要 $50 million ARR、持续环比增长和清晰单位经济，公开市场才会按规模给公司定价。基于现有证据，World Labs 尚不具备 IPO 准备度。

              建议是跟踪，并设置一组具体的论点失效触发器，让投资判断转向买入或退出。买入触发器是收入证据：如果 World Labs 披露或权威第三方报道 ARR 超过 $20 million，并有企业多年合同结构证据，或
              Autodesk 合作从研究转为商业分销，基准与乐观情景在当前隐含价格附近会更可信。退出触发器则相反：降价轮、关键战略合作瓦解、关键创始人流失，或监管行动阻断生成式 3D
              内容在商业应用中的使用，都构成论点失效事件。

              这个阶段的资本效率画像值得注意：约 11-50 名员工，却已融资 $1.23 billion，组织非常精简，意味着要么人均算力支出极高，要么招聘纪律很强。Gartner Hype Cycle for
              Generative AI 2026 指出，许多生成式 AI 类别处于或接近膨胀预期峰值——这是影响整个空间 AI 市场的结构性风险，不只针对 World
              Labs。按当前隐含价格进入的投资者，应把幻灭低谷计入定价情景；如果技术最终兑现承诺，复苏周期可能需要 3-5 年。
