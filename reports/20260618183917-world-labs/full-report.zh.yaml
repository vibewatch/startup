              Crunchbase 数据显示，2026 年 Q1 全球风险投资的 65% 仅被三家公司（OpenAI、Anthropic、xAI）吸收；Gartner 维护的 Hype Cycle for Generative
              AI 2026 则记录了各项技术在预期曲线上的位置。空间 AI 和世界模型仍是新兴类别，目前可能接近膨胀预期峰值。如果市场在 World Labs
              建立商业收入之前进入幻灭低谷，公司下一轮融资可能面临艰难环境，估值也会被压缩。按 3-5 年持有期定价的投资者，应明确把低谷建模为基准情景，而不是尾部风险。
