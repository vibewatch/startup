      - number: '1.3'
        title: 融资历史与投资人基础
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 2 月，World Labs 在不到 18 个月内完成两轮融资，合计融资 $1.23 billion。


              第一轮为 $230 million，于 2024 年 9 月 13 日宣布，时间与公司结束隐身状态同步；该轮由 Andreessen Horowitz（a16z）、New Enterprise
              Associates（NEA）和 Radical Ventures 共同领投。参投方包括 AMD Ventures、Intel Capital 和 NVIDIA NVentures。World Labs
              在公告时拒绝确认估值；Bloomberg 2026 年 1 月的报道援引消息人士称，公司种子轮估值为 $1 billion。


              第二轮为 $1 billion，于 2026 年 2 月 18 日宣布，由 Autodesk 以 $200 million 承诺出资锚定。Autodesk 同时担任正式战略顾问，并与 World Labs
              签署研究和产品层面的合作协议，把世界模型能力接入 3D 设计工作流，先从媒体与娱乐用例切入；协议明确排除了数据共享。该轮其他投资人包括 AMD、NVIDIA、Emerson Collective、Fidelity
              Management and Research Company、Sea Group，以及再次参投的 Andreessen Horowitz。种子轮投资人 Intel Capital 未出现在 Series B
              投资人名单中。


              Bloomberg 2026 年 1 月报道称，World Labs 正在讨论以 $5 billion
              估值融资，意味着较种子轮提升五倍。公司未反驳该报道，但融资关闭后也未公开确认该数字，因此估值仍未验证。股权表构成具有战略上的不寻常之处：Autodesk（设计软件）、NVIDIA 和 AMD（AI
              计算硬件）、Sea Group（东南亚数字商业）与一线财务投资人同席，显示公司可能借 Autodesk 既有用户基础进入企业分发，并在推理规模上做深硬件集成。公司未披露收入、ARR 或任何商业牵引指标。
