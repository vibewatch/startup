  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从规模证据、商业证明、竞争和估值出发，推导 World Labs 当前“跟踪”建议的推理链。
    data:
      nodes:
        - id: founders
          label: 创始团队异常强
          detail: Li（ImageNet / Stanford）、Mildenhall（NeRF）、Johnson（Pulsar）——独特汇合
        - id: capital
          label: 已融资 $1.23B；战略投资方
          detail: AMD、NVIDIA、Autodesk（$200M 锚定）、a16z、Fidelity——验证投资假设
        - id: product
          label: Marble GA + World API 已发布
          detail: 6 个以上具名集成；Spark 2.0 流式渲染器；多模态输入
        - id: market
          label: 可触达市场大
          detail: 生成式 AI $83B（2026）→ $988B（2035）；数字孪生 $21B → $150B（2030）
        - id: antithesis
          label: 收入前；竞争；炒作风险
          detail: 未披露 ARR；NVIDIA Cosmos 免费；Gartner 炒作周期风险；Deloitte 障碍
        - id: valuation
          label: 隐含 $5B（未确认）
          detail: Bloomberg 报道；World Labs 拒绝确认；收入倍数未定义
        - id: recommendation
          label: 跟踪
          detail: ARR >$20M、Autodesk 商业转化或估值确认后重新评估
      edges:
        - from: founders
          to: recommendation
          label: 支撑信心
        - from: capital
          to: recommendation
          label: 传递投资人信念
        - from: product
          to: recommendation
          label: 已显现早期牵引力
        - from: market
          to: recommendation
          label: 若论点成立，上行空间很大
        - from: antithesis
          to: recommendation
          label: 压低信心
        - from: valuation
          to: recommendation
          label: 需要商业化证据支撑
    approximationNotes: 节点权重和边的方向仅作示意；这是一张定性逻辑图，不是量化评分模型。
    claimRefs:
      - CV001
      - CV006
      - CV011
      - CV019
      - CV022
      - CV029
      - CV037
  - id: FV002
    title: 假设 ARR 下的估值敏感性（基准收入倍数 25x，均为估算）
    type: bar
    layout: wide
    summary: 以 2028 年为视角，在固定 25x 收入倍数假设下，估算不同 ARR 水平对应的隐含估值。所有数值都是情景估算，不是预测。
    data:
      items:
        - label: 悲观：$5M ARR × 25x
          value: 125
        - label: 悲观中位：$15M ARR × 25x
          value: 375
        - label: 基准低位：$30M ARR × 25x
          value: 750
        - label: 基准：$80M ARR × 25x
          value: 2000
        - label: 乐观低位：$150M ARR × 25x
          value: 3750
        - label: 乐观：$300M ARR × 25x
          value: 7500
    approximationNotes: >-
      所有 ARR 数字都是情景假设，不是预测。World Labs 尚未披露收入。25x 是参考可比的高增长私有 AI 公司得出的示意倍数；退出时的实际市场倍数会变化。Bloomberg 报道的约 $5B 隐含估值，大致对应 25x
      下的 $200M ARR——这意味着公司需要铺开相当规模的企业分销。图中数值以百万美元计。
    claimRefs:
      - CV019
      - CV026
      - CV027
      - CV028
  - id: FV003
    title: 估值 / 回报区间——乐观、基准、悲观（2028 年视角，均为估算）
    type: range
    layout: wide
    summary: World Labs 在乐观、基准、悲观假设下的情景估值区间，并列出 Bloomberg 报道的隐含估值供参考。所有数字均为估算。
    data:
      items:
        - label: 悲观情景（2028 年估算）
          low: 50
          mid: 150
          high: 225
          unit: $M
          note: $5–15M ARR，10–15x；空间 AI 商品化
        - label: 基准情景（2028 年估算）
          low: 750
          mid: 1600
          high: 2400
          unit: $M
          note: $30–80M ARR，25–30x；商业化受控增长
        - label: 乐观情景（2028 年估算）
          low: 3000
          mid: 7000
          high: 12000
          unit: $M
          note: $100–300M ARR，30–40x；Autodesk 渠道 + API 规模化
        - label: 当前隐含估值（Bloomberg，未确认）
          low: 5000
          mid: 5000
          high: 5000
          unit: $M
          note: Bloomberg 报道约 $5B；World Labs 拒绝确认
    approximationNotes: 所有情景值都是分析估算。World Labs 未披露任何收入。Bloomberg 报道的 $5B 是第三方数字，公司未确认。区间宽度反映收入轨迹和退出倍数的不确定性，并非统计分布。
    claimRefs:
      - CV004
      - CV005
      - CV014
      - CV026
      - CV027
      - CV028
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 截至 2026 年 6 月，从市场、验证、护城河、经济性、风险和估值维度给 World Labs 做投委会可用评分，并标注证据质量。
    data:
      items:
        - label: 市场规模潜力
          value: 8 / 10
          status: positive
          note: 生成式 AI $83B（2026 年），CAGR 31.6%；数字孪生 $21B，CAGR 47.9%
        - label: 创始团队质量
          value: 10 / 10
          status: positive
          note: Li（ImageNet）、Mildenhall（NeRF）、Johnson（Pulsar）、Lassner——世界级
        - label: 产品验证
          value: 5 / 10
          status: neutral
          note: Marble GA + World API 已发布；6+ 个具名集成；未披露收入
        - label: 收入证据
          value: 2 / 10
          status: negative
          note: 截至 2026 年 6 月，未披露 ARR、收入、客户数或单位经济性
        - label: 技术护城河
          value: 7 / 10
          status: positive
          note: NeRF / Gaussian Splatting 专长；但 NVIDIA Cosmos 和开源方案也在竞争
        - label: 竞争位置
          value: 5 / 10
          status: neutral
          note: Marble 以质量做出差异；但 NVIDIA、Google、Luma AI 都已入场
        - label: 估值纪律
          value: 3 / 10
          status: negative
          note: 隐含 $5B（未确认），对收入前公司偏激进；没有收入倍数锚点
    approximationNotes: 评分是基于公开证据的定性分析判断。每项评分反映证据质量和商业化验证，不只看公司潜力。若公司披露收入或确认商业里程碑，评分可能大幅改善。
    claimRefs:
      - CV011
      - CV019
      - CV022
      - CV023
      - CV029
      - CV037
      - CV040
