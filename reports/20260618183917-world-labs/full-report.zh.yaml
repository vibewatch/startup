      - number: '3.3'
        title: 护城河、切换成本与分发力量
        blocks:
          - type: paragraph
            body: >
              World Labs 的结构性护城河建立在三根支柱上：创始人可信度和人才吸引力、资本深度，以及 API 嵌入下游平台。联合创始人阵容——Fei-Fei Li（ImageNet、计算机视觉）、Ben
              Mildenhall（NeRF）、Christoph Lassner 和 Justin Johnson（3D representations）——带来招聘和可信度优势，并体现在研究速度和企业信任建立上。$1.23
              B 总融资（已公告种子轮加上 2026 年 2 月由 NVIDIA、AMD 和 Autodesk 支持的融资）提供多年 runway，可投入模型规模、数据基础设施和开发者生态。API
              嵌入策略——OpenArt、Magnific、Rosebud AI 和 VIVERSE 等伙伴把 Marble 驱动的功能做进自有产品——会在其终端用户开始使用并依赖 Marble 生成的 3D
              环境后，在伙伴层面创造切换成本。但合同锁定条款未公开，多宿主风险真实存在：按标准 API 条款运营的伙伴，可以在数周内把流量转向替代供应商。Marble Labs 展示目录（20 多个公开 demo：VR
              Gaussian splats、collider builders、avatar tools、建筑空间蓝图等）正在拓宽开发者生态，但单个 demo 的商业牵引未知。NVIDIA 同时是战略投资人和 Cosmos
              竞争产品的开发者，这形成内在张力：NVIDIA 可能影响 Cosmos 路线图，吸收 World Labs 的机器人仿真用例，并借 Omniverse 和 Isaac Sim 分发网络把该空间商品化。直接基于
              World API 开发的开发者切换成本中等：API 接口新颖，下游集成（伙伴产品功能、仿真流水线）迁移需要工程返工，但目前未披露数据可携带限制或竞业条款。
