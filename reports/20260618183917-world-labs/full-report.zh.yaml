      - number: '8.3'
        title: 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >-
              由于 World Labs 未披露收入，本章所有情景估值都明确标注为估计值，基于假设收入结果，以及高增长 AI 基础设施公司的可比市场倍数。这些数字只作为分析框架的情景输入，并非精确预测；全文均明确标注为假设。

              乐观情景假设，空间智能在 24 个月内成为广泛采用的 AI 范式；Autodesk 的 $200 million 投资转化为大型分销协议，打开其数百万专业用户装机基础；World API
              从机器人、游戏和企业仿真中产生有意义的 API 收入；World Labs 到 2028 年实现估计 $100-$300 million ARR。按成长期 AI 公司 30-40x 远期收入倍数计算，隐含估值约为
              $3-12 billion，当前隐含价格位于区间中部。乐观情景依赖尚不存在的商业证明：Autodesk 合作需要从研究走向分销，API 也需要获得大量付费企业开发者。

              基准情景假设商业增长受控，Autodesk 关系仍为顾问性质，收入来自创意和产消者市场的直接订阅，以及开发者集成带来的 API 收入。到 2028 年估计 $30-80 million ARR，按 25-30x
              远期收入倍数计算，隐含估值约为 $750 million 至 $2.4 billion——明显低于 $5 billion 的隐含入场价。基准情景凸显，如果没有乐观情景中的商业加速，当前价格很难证明合理。

              悲观情景假设出现实质性商品化：NVIDIA Cosmos 的开放模型扩大支持用例，开源社区模型缩小质量差距，World Labs 难以在规模化时形成差异化。在该情景下，到 2028 年估计 $5-15
              million ARR，按 10-15x 倍数计算，隐含估值约为 $50-225 million，远低于任何已投入资本。资本集中风险进一步放大悲观情景：2026 年 Q1
              风险融资中，OpenAI、Anthropic 和 xAI 合计吸收了全球风险投资的 65%，挤压中型空间 AI 玩家可获得的资本。
