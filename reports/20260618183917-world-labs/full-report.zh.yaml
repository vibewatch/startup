    title: Marble 客户工作流
    type: flow
    layout: standard
    summary: 端到端客户旅程，从初始输入到世界生成、交互式探索、编辑循环，再到导出至下游用例。
    data:
      nodes:
        - id: input
          label: 客户提供输入
          detail: 通过 UI 或 World API 提交文本、图像、视频、全景或粗略 3D 布局
        - id: marble_gen
          label: Marble 生成 3D 世界
          detail: 多模态世界模型合成可导航、持久的 3D 环境（异步）
        - id: spark_render
          label: Spark 2.0 在浏览器中渲染
