      数据。该图展示留存证据缺口，而不是实际留存表现。之所以使用矩阵类型，是因为没有可公开获知的数值留存数据；原计划的 cohort 类型需要 0–100 的留存百分比。
    claimRefs:
      - CU020
      - CU021
      - CU039
  - id: FR001
    title: 风险严重度热力图——World Labs（2026 年 6 月）
    type: matrix
    layout: wide
    summary: |
      按可能性和影响定位 World Labs 识别出的十项主要风险，并按披露缓释措施后的剩余暴露着色。行是影响等级（顶部 = 关键）；列是可能性等级。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - 关键人物离职（Fei-Fei Li）
            - 收入延迟 / 资本耗尽；GPU 供应中断
            - EU AI Act GPAI 分类
        - label: 高影响
          values:
            - —
            - Autodesk 集成失败；API 可靠性；竞品替代（NVIDIA Cosmos）；出口管制（EAR）
            - 版权 / IP 责任；仿真到现实保真度缺口；安全认证缺口
        - label: 中等影响
          values:
            - —
            - 炒作周期市场修正；美国监管碎片化
            - 企业采用障碍（员工准备度）
    approximationNotes: |
      可能性和影响是截至 2026 年 6 月基于公开证据做出的定性分析师判断。没有可用的公司内部数据。
