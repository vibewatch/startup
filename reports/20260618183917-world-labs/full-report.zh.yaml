      - number: '6.3'
        title: 采用轨迹与部署状态代理指标
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，World Labs 未披露任何量化采用指标——订阅用户数、API 调用量、月活用户、账户数或使用率。以下是可用的间接信号。


              案例研究发布速度可作为采用代理指标。2025 年 11 月 12 日（Marble GA）至 2026 年 5 月 8 日之间，公司发布了九个案例研究——约每月 1.3
              个。这个速度显示，公司有活跃的客户成功或合作伙伴职能在识别并讲述集成故事，符合一家早期商业化公司专注积累社会证明的状态。


              World API 于 2026 年 1 月 21 日上线，约在 Marble GA 后十周。公告记录了 API 上线时已经投入使用的三个垂直场景——游戏 / 沉浸式媒体（Escape）、建筑 /
              设计（Fenestra、xFigura、Preview）和机器人 / 仿真（Lightwheel）——这意味着公开发布前，精选伙伴已获得预发布 alpha 或 beta API 访问权。这更像受控爬坡，而不是开放
              beta 发布。


              到 2026 年 6 月，Marble Labs showcase 已增长到至少 18 个项目。这些项目被明确表述为实验性（「blueprints for
              building」），而不是生产部署；但它们覆盖虚拟制作管线、VR 引擎、游戏引擎、房地产可视化和物理交互艺术，构成有意义的开发者社区信号。


              Autodesk 的 $200 million 战略投资（2026 年 2 月 18 日）是最重要的外部采用信号：一家大型 3D 软件既有玩家，对 World Labs
              的世界生成能力与其企业设计和娱乐客户群的商业相关性下了大额战略赌注。World Labs 在 Autodesk 实际产品套件中的采用仍是未来可能，而非已有证据。


              截至 2026 年 6 月，外部没有关于 Marble 生产部署质量或客户满意度的独立第三方评测、评分或分析师报告。
