      - number: '1.4'
        title: 里程碑、规模与负面信号
        blocks:
          - type: paragraph
            body: >
              从创立到 2026 年 6 月，World Labs 的运营历史约 30 个月。公司以压缩节奏推进：创立、隐身运营、首个产品发布、API 可用，再到一轮重大战略融资。


              公司成立于 2023 年；确切注册日期未公开披露，但 Fei-Fei Li 在 2025 年 11 月写道，联合创始人「more than one year ago」创立了 World
              Labs，因此创立时间不晚于 2023 年末。团队隐身运营到 2024 年中，2024 年 9 月结束隐身时约有 20 名员工。Marble 限量 beta 与「Generating Worlds」研究预览在
              2024 年末同步推出；2025 年 11 月 12 日，Marble 正式 GA，距种子轮公告约 14 个月。World API 于 2026 年 1 月 21 日发布，$1 billion Series B
              于 2026 年 2 月 18 日完成。公司在 2026 年 6 月 3 日发布了世界模型的功能分类法。


              合作与集成信号：Autodesk 是主要公开披露的企业合作伙伴。公司发布了与 OpenArt、Lightcraft、Magnific、Rosebud AI、Viverse 和 Escape
              等创意工作流集成方的案例研究，覆盖游戏、VFX 和电影领域，但这些案例未被披露为付费商业合同。


              负面与缺口信号：Fei-Fei Li 同时在公司和 Stanford 任职，使 World Labs 面临显著关键人物集中风险。董事会构成、独立董事姓名和治理文件均未公开。公司已融资 $1.23
              billion，却未披露任何收入，把投资人的判断完全压在技术命题和团队上，而不是商业牵引上。


              EU AI Act（2024 年 3 月通过，2024 年 8 月起分阶段适用）为欧盟市场的通用 AI 模型开发者设定合规义务，包括透明度和版权尽调要求；这些要求与 World Labs 的训练数据实践和 API
              输出相关。美国 Bureau of Industry and Security 的出口管制法规（EAR，15 CFR Parts 730-774）也可能适用于 World Labs 具备双用途潜力的 AI
              技术。World Labs 的 Terms of Service 和 Acceptable Use Policy 明确限制涉及生物武器开发、欺骗性 deepfakes
              和干扰关键基础设施的用途，显示公司已意识到这些监管向量。
