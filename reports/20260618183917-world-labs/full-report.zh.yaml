      - number: '5.2'
        title: 架构与技术栈
        blocks:
          - type: paragraph
            body: >-
              World Labs 的技术架构由四个紧密耦合的层组成：Marble 生成式世界模型、Spark 2.0 网页渲染器、World API 交付表面，以及导出与集成管线。每一层都建立在创始团队此前研究之上，让
              World Labs 从已发表学术 IP 到已部署产品之间拥有异常直接的路径。

              公司称 Marble 世界模型是一种多模态架构，能把可用输入信号——文本、图像、视频、空间布局——提升到统一的 3D
              世界表征中。模型支持完整迭代编辑，包括元素级修改、扩展，以及把独立生成的世界组合起来。Marble 在导出视觉 splat 数据的同时导出碰撞体 mesh，这对集成基于物理的仿真至关重要。公司在 2026 年 6
              月发布分类法博客，把世界模型分为在感知—行动循环中运行的渲染器、仿真器和规划器，显示其有意把架构路线图推进到智能体和仿真能力。

              Spark 2.0 是 World Labs 的网页渲染器，使用 THREE.js 和 WebGL2 构建，支持桌面、iOS、Android 和包括 Meta Quest 3 在内的 VR 设备。World
              Labs 内部开发 Spark，是因为现有基于网页的 3DGS 渲染器一次只能渲染一个 3DGS 对象，缺少动态动画（「4DGS」），且无法在多设备上可靠运行。Spark 2.0 引入
              Level-of-Detail 流式系统，会根据用户视角自适应调整 3DGS 细节并实时流式传输数据，让公里级环境能在移动设备和低带宽连接上运行。该渲染器支持实时编辑、重新布光，以及用于动态 splat 效果的
              shader graph。

              3D Gaussian Splatting（3DGS）是 Marble 和 Spark 使用的核心场景表征，它把场景表示为数百万个半透明彩色椭球体（「splats」），并通过 alpha compositing
              排序渲染。该技术发表于 ACM TOG 2023，可在 1080p 分辨率下达到 30+ fps 的实时渲染，这是交互式浏览器和 VR 交付的关键门槛。联合创始人 Ben Mildenhall 在 ECCV
              2020 发表原始 NeRF 论文，奠定了支撑现代神经渲染的神经辐射场表征。联合创始人 Christoph Lassner 发表 Pulsar（arXiv
              2004.07484），这是一种基于球体的可微渲染器，速度比竞争方法快数个数量级。这些基础工作直接落在 Marble 和 Spark 中，让产品相对基于公开实现搭建的团队拥有第一性原理 IP 优势。
