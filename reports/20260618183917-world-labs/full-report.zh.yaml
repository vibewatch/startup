      - number: '7.5'
        title: 缓释措施与投资论点失效触发器
        blocks:
          - type: paragraph
            body: >
              应对监管风险的主要缓释措施是 World Labs 的 AUP 架构，其中明确限制引用 EU AI Act、California SB 1001
              及可比法规的高风险用途。这会限制直接责任敞口，但不能替机构客户卸下合规负担；客户仍必须评估 Marble 输出是否满足自身监管义务。负责任披露计划覆盖了基础安全底线，但在取得 SOC 2
              或同等认证之前，缺少正式第三方安全证明会限制受监管行业的企业采用上限。


              面对算力依赖，World Labs 与 NVIDIA 和 AMD 的双重投资者关系可带来优先 GPU
              配额——但定价权仍在拥有董事会观察员权利的供应商手中。公司的最佳缓释办法，是把收入加速到足以降低对额外股权融资依赖的水平。如果 Autodesk 合作成熟为集成产品工作流，可能加快企业分发；但
              TechCrunch 2026 年 Q1 访谈显示，商业产品形态仍未定义。


              应结束投资或从根本上重估价格的论点失效触发器包括：EU AI Act 将 Marble 归类为高风险 GPAI，并强制要求公司无法及时满足的第三方审计；Fei-Fei Li 确认离任 CEO；到 2026 年
              Q4 仍未签下任何披露收入的企业合同；失去 NVIDIA 或 AMD 作为基础设施供应商且没有替代 GPU 访问；以及 US Copyright Office 或法院认定 Marble
              训练数据构成系统性版权侵权，要求撤回模型或重新训练。


              投资者应为每个触发器定义明确阈值和监控节奏，而不是只依赖定期管理层报告。依赖风险图（FR003）显示，所有重大风险最终都会通过算力访问或 Fei-Fei Li 持续领导，传导到公司的运营连续性。
