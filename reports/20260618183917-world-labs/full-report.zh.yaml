  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              World Labs 正站在三条监管战线的交汇处：AI 专项立法（EU AI Act、California SB 1001）、知识产权法（AI 训练数据与输出的版权），以及出口管制（US Export
              Administration Regulations）。欧洲议会于 2024 年 3 月以 523 票赞成通过 EU AI Act，建立了按风险分层的框架：超过既定算力门槛的通用
              AI（GPAI）模型，需要承担更高的透明度和安全义务。按这一定义，World Labs 的 Marble 构成 GPAI 模型；其 AUP 已明确承认这一风险敞口，把 EU AI Act
              下的受监管用途列为「高风险用途」。World API 一旦在欧洲市场放量，可能需要做合规评估、技术文档和第三方审计，带来合规成本，也可能拖慢部署。


              知识产权方面，US Copyright Office 于 2025 年 5 月以预发布形式公布其 AI 报告第 3 部分，审查训练数据抓取的合法性，以及 AI 生成输出能否获得版权。第 2 部分（2025 年 1
              月）已确认，缺乏人类作者身份的输出在美国不能获得版权。World Labs 尚未披露 Marble 训练数据的授权基础；这些数据很可能包括网页抓取图像、3D
              扫描和视频，均可能面临相互竞争的权属主张。企业客户要把生成的 3D 环境纳入商业工作流，需要干净的 IP 链条；任何针对 Marble 生成内容的下游侵权索赔，都会影响客户信心，并按服务条款带来赔偿责任。


              Bureau of Industry and Security 的 Export Administration Regulations（EAR，15 CFR 730-774）适用于被归类为军民两用的 AI
              模型权重和相关技术。World API 的跨境 API 访问可能带来出口管制风险。NIST 的 AI Risk Management Framework 提供自愿性指引，但没有法律强制力，意味着企业客户只能依赖
              World Labs 自身的合规姿态——而该姿态尚未公开披露。截至 2026 年 6 月，World Labs 尚未宣布任何第三方安全认证（SOC 2、ISO 27001），也未宣布面向企业部署的监管预批准。
