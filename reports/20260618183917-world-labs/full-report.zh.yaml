      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              2026 年，几股结构性力量正在加速空间智能基础设施需求。最强驱动是机器人与具身 AI 的训练数据瓶颈。领先实验室已经开始从手工创作环境转向用于仿真的生成式世界模型；限制因素不再是 AI
              生成环境是否有用，而是它们是否足够物理准确，能迁移到真实机器人。World Labs 必须证明 Marble 生成的场景不只是视觉上可信，还能在物理层面 ready for simulation。2026
              年一篇关于具身 AI 3D 生成的综述（arXiv:2604.26509）确认了这种需求迁移，同时也记录了技术缺口。


              第二个驱动是史无前例的 AI 投资潮。2026 年 Q1，全球有 $242 billion 流向 AI 公司——占当季全部风险投资的 80%——说明资本环境对 AI 基础设施公司极为有利，也包括空间
              AI。四个细分市场的买方都面临采用 AI 工具的压力；像 World Labs 这样拥有可信产品（Marble 和 World API）的供应商，可以在市场整合前抢占早期份额。


              API 经济是第三个结构性驱动。文本 AI API（OpenAI、Anthropic）已经证明，把基础 AI 能力嵌入第三方产品，会创造复合型生态效应。World Labs 于 2026 年 1 月发布
              World API，就是要在空间 AI 中复制这一动态：一旦开发者把世界生成嵌入自己的产品，由此形成的数据飞轮和切换成本将创造可防守的市场位置。


              与这些驱动相对的，是三项实质约束。sim-to-real gap 是最尖锐的技术约束：2026 年 arXiv 综述指出，生成的 3D
              内容必须满足远超视觉真实感的要求——包括运动学结构、材料属性和交互支持——而持续存在的 sim-to-real 分裂仍是未解决瓶颈。这把 Marble
              在机器人训练中的近期价值限制在视觉随机化用例，而不是完整的物理准确仿真。第二项约束是企业集成复杂度：Deloitte 2025 年 AI 领导者调查发现，约 60% 的受访者把遗留系统集成和风险 / 合规担忧列为
              physical AI 采用的主要障碍，这与 World Labs 的企业销售动作直接相关。第三项约束是市场早期和买方教育：任何垂直领域都还没有「world models」的成熟采购路径，没有公开 ROI
              基准，也没有标准集成模式——这些都会拉长销售周期，并限制企业收入速度。


              EU AI Act 和各国 AI 监管框架扩散，也加入了合规维度。美国 NIST 的 AI Risk Management Framework 提供了企业正在采用的自愿治理标准；World Labs 已发布的
              AUP 和内容政策，是面向企业合规姿态的早期步骤。但随着空间 AI 进入受监管行业（医疗仿真、自动驾驶），合规负担会继续上升。
