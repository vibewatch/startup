  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              World Labs 的旗舰产品 Marble，把自己定位为生成式空间智能引擎，能把多模态输入直接转成可探索的 3D
              世界。从客户视角看，工作流始于用户提供一个创意或信息信号——短文本描述、参考图、视频片段、360 度全景图，或粗略 3D 布局——然后获得一个持久、可导航的 3D
              环境。用户可以在网页浏览器中探索、交互式编辑、扩展成更大场景，并导出给下游使用。公司把这描述为「把看见转成行动、把理解转成推理、把想象转成创造」，等于把过去需要专职 3D
              艺术家、摄影测量设备或手工场景建模的流程压缩成一个概念化工作流。

              Marble 既以 marble.worldlabs.ai 上的直接消费者 / 专业消费者订阅形式提供，也通过 World API 作为可编程服务提供。该 API 于 2026 年 1 月 21
              日上线，允许开发者把世界生成嵌入产品和流程，而无需维护 3D 生产栈。API 异步处理请求，并返回一个可完整导航的 3D 世界对象；该对象可在浏览器中渲染，可导出为 Gaussian splat（.spz 或
              .rad 格式）、mesh（.glb）或视频，也可直接传入仿真框架。

              已记录用例覆盖四个主要垂直场景：（1）电影和 VFX，电影人把 Marble 当作稳定虚拟片场，让场景和镜头之间保持空间一致性；（2）游戏和 AR/VR，开发者从生成环境构建交互式浏览器体验；（3）机器人和具身
              AI 仿真，研究人员生成可扩展训练环境，用于域随机化；（4）建筑和设计，Marble 让设计师在绘制平面图前先走进概念，从而加速概念可视化。World Labs 自己也用 Marble
              制作发布营销视频，过程中生成了数百个 3D 世界。

              产品层级包括 Marble（生成式世界模型）、World API（可编程访问层）、Spark 2.0（渲染引擎）和 Marble Labs（开发者门户与案例中心）。每一层面向不同客户群：Marble
              面向个人创作者和专业人士；World API 面向平台开发者和企业团队；Spark 支持第三方运行时渲染；Marble Labs 推动生态采用和开发者赋能。
