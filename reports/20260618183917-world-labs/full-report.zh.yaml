  - id: FE001
    title: World Labs 产品架构栈
    type: stack
    layout: wide
    summary: 五层软件栈，从多模态客户输入开始，经 Marble 世界模型、Spark 2.0 渲染器、交付界面，延伸到下游集成环境。
    data:
      layers:
