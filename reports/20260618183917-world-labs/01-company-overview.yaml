callouts:
  - calloutType: strength
    title: Exceptional Founding Team and Research Pedigree
    body: >
      World Labs assembled one of the strongest founding teams in AI: Fei-Fei Li (ImageNet creator,
      Stanford HAI, former Google Cloud Chief AI Scientist), Ben Mildenhall (NeRF inventor),
      Christoph Lassner (Meta Reality Labs, Pulsar renderer), and Justin Johnson (Stanford AI Lab).
      The team's publication record and prior industry experience are directly foundational to the
      spatial intelligence thesis — a uniquely tight founder-market fit that justified a $230 million
      seed round before any product was shipped and secured participation from NVIDIA, AMD, Autodesk,
      and a16z across two rounds totaling $1.23 billion.
    claimRefs:
      - CO006
      - CO008
      - CO009
      - CO010
      - CO016

  - calloutType: risk
    title: Key-Person Concentration, Governance Opacity, and Pre-Revenue Valuation Risk
    body: >
      Fei-Fei Li's dual role as CEO of World Labs and Sequoia Professor at Stanford creates material
      key-person concentration risk. The company's entire public narrative, investor credibility, and
      thought-leadership position are anchored to her personally. No board or governance structure is
      publicly disclosed, meaning diligence cannot assess whether independent oversight exists.
      Revenue and customer data are withheld; the reported $5 billion valuation (Bloomberg, unconfirmed)
      rests entirely on thesis and team credentials rather than demonstrated commercial traction.
    claimRefs:
      - CO006
      - CO023
      - CO026
      - CO048

