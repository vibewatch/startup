chapter:
  number: 1
  title: Company Overview
  summary: >
    World Labs is a San Francisco-based frontier AI company founded in 2023 by Fei-Fei Li,
    Justin Johnson, Christoph Lassner, and Ben Mildenhall to advance spatial intelligence —
    the capacity for AI to perceive, generate, reason, and interact with 3D environments.
    The company emerged from stealth in September 2024 with a $230 million seed round and
    closed a $1 billion Series B in February 2026, bringing total capital raised to
    approximately $1.23 billion; revenue and customer metrics remain undisclosed.

sections:
  - id: identity-and-product
    title: Identity, Product, and Business Model
    body: >
      World Labs (legal entity: World Labs Technologies, Inc.) is a San Francisco, California-based
      frontier AI research and product company. Founded in 2023 by four co-founders with deep roots
      in academic computer vision and 3D graphics, the company is organized around a single scientific
      thesis: spatial intelligence — the ability of AI systems to perceive, generate, reason, and
      interact with the three-dimensional world — represents the next major frontier of generative AI
      after the large language model revolution. The company describes its mission as building
      "Large World Models" (LWMs), a class of foundation models that understand and generate
      persistent, navigable 3D worlds rather than flat images or text.


      World Labs' first and, as of June 2026, primary commercial product is Marble, a multimodal world
      model that generates spatially cohesive, high-fidelity, and persistent 3D environments from a
      single image, video clip, 360-degree panorama, coarse 3D layout, or text prompt. Marble launched
      in limited beta and was made generally available on November 12, 2025, with an expanded feature
      set. Outputs include Gaussian splats, polygon meshes, and video exports, enabling integration
      into downstream creative, design, and simulation pipelines. On January 21, 2026, the company
      launched the World API, a programmatic interface that exposes Marble's world-generation
      capabilities to developers for embedding in third-party applications, interactive systems,
      and simulation workflows.


      The commercial model is subscription-based, spanning four tiers: Free (limited generations),
      Standard ($20/month), Pro ($35/month including commercial usage rights), and Max ($95/month
      with all features). This pricing range positions the product between prosumer creative tools
      and professional 3D design software. The company targets creators, VFX and gaming studios,
      robotics developers, and enterprise design workflows. Its stage as of June 2026 is
      late-seed/early-growth: a shipped commercial product, a launched API, a growing enterprise
      partnership with Autodesk, and $1.23 billion in cumulative capital, with no disclosed revenue,
      ARR, or customer counts.
