  - id: funding-and-investors
    title: Funding History and Investor Base
    body: >
      World Labs has completed two funding rounds in under 18 months, raising a combined
      $1.23 billion as of February 2026.


      The first round — $230 million — was announced September 13, 2024, concurrent with the
      company's exit from stealth, led jointly by Andreessen Horowitz (a16z), New Enterprise
      Associates (NEA), and Radical Ventures. Participating investors included AMD Ventures,
      Intel Capital, and NVIDIA NVentures. World Labs declined to confirm a valuation at
      announcement; Bloomberg's January 2026 reporting cited sources valuing the company at
      $1 billion at seed.


      The second round — $1 billion, announced February 18, 2026 — was anchored by Autodesk
      with a $200 million commitment. Autodesk simultaneously took on a formal advisory role
      and entered a research and product-level collaboration agreement with World Labs to integrate
      world-model capabilities into 3D design workflows, starting with media and entertainment use
      cases; data sharing was explicitly excluded from the agreement. Other investors in the round
      included AMD, NVIDIA, Emerson Collective, Fidelity Management and Research Company, Sea Group,
      and a return participation from Andreessen Horowitz. Intel Capital, a seed participant, is
      not listed among Series B investors.


      Bloomberg reported in January 2026 that World Labs was in discussions to raise at a $5 billion
      valuation, implying a five-fold increase from seed. The company did not contest this reporting
      but also declined to confirm the figure publicly following the close, so the valuation remains
      unverified. The composition of the cap table is strategically unusual: the presence of Autodesk
      (design software), NVIDIA and AMD (AI compute hardware), and Sea Group (Southeast Asian digital
      commerce) alongside tier-1 financial sponsors suggests positioning for enterprise distribution
      through Autodesk's existing user base and deep hardware integration at inference scale.
      No revenue, ARR, or commercial traction metric has been disclosed.
