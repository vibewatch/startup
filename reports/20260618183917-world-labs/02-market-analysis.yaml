  - id: growth-drivers
    title: Growth Drivers and Adoption Constraints
    body: >
      Several structural forces are accelerating demand for spatial intelligence infrastructure in
      2026. The most powerful driver is the robotics and embodied AI training data bottleneck. The
      shift from manual environment authoring to generative world models for simulation is already
      underway in leading labs; the limiting factor is no longer whether AI-generated environments
      are useful, but whether they are physically accurate enough to transfer to real robots. World
      Labs must demonstrate that Marble-generated scenes are not just visually plausible but
      simulation-ready at the physics level. A 2026 survey of 3D generation for embodied AI
      (arXiv:2604.26509) confirms this demand shift while also documenting the technical gap.


      The second driver is the unprecedented AI investment surge. Q1 2026 saw $242 billion flow
      to AI companies globally — 80% of all venture capital in the quarter — signaling that the
      capital environment is highly favorable for AI infrastructure plays, including spatial AI.
      Buyers in all four segments are under pressure to adopt AI tools, and vendors with credible
      products (as World Labs has with Marble and the World API) can capture early market share
      before the market consolidates.


      The API economy is a third structural driver. Text-based AI APIs (OpenAI, Anthropic) have
      demonstrated that embedding foundational AI capabilities into third-party products creates
      compounding ecosystem effects. World Labs' World API launch in January 2026 is designed to
      replicate this dynamic in spatial AI: if developers embed world generation into their
      products, the resulting data flywheel and switching costs create defensible market position.


      Against these drivers stand three material constraints. The sim-to-real gap is the most
      technically acute: the 2026 arXiv survey identifies that generated 3D content must satisfy
      requirements far beyond visual realism — including kinematic structure, material properties,
      and interaction support — and that the persistent sim-to-real divide remains an unsolved
      bottleneck. This limits the near-term value of Marble for robotics training to visual
      randomization use cases, not full physics-accurate simulation. The second constraint is
      enterprise integration complexity: Deloitte's 2025 survey of AI leaders found ~60% cite
      legacy system integration and risk/compliance concerns as primary barriers to physical AI
      adoption, directly relevant to World Labs' enterprise sales motion. The third constraint is
      market nascency and buyer education: there is no established procurement path for "world
      models" in any vertical, no published ROI benchmarks, and no standard integration patterns
      — all of which extend sales cycles and limit the velocity of enterprise revenue.


      The EU AI Act and spreading national AI regulatory frameworks add a compliance dimension.
      NIST's AI Risk Management Framework in the US provides a voluntary governance standard that
      enterprises are adopting; World Labs' published AUP and content policies represent early steps
      toward enterprise compliance posture, but the burden grows as spatial AI enters regulated
      industries (healthcare simulation, autonomous driving).
