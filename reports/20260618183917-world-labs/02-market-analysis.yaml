callouts:
  - calloutType: strength
    title: "Spatial AI Positioned at Convergence of Three High-Growth Markets"
    body: >
      World Labs' spatial intelligence positioning sits at the intersection of generative AI
      ($83B in 2026, CAGR 31.6%), digital twin/simulation infrastructure ($21B in 2025, CAGR
      47.9%), and the emerging developer API economy for AI-native applications. Even capturing
      a small fraction of two of these markets produces a multi-billion-dollar addressable
      opportunity. The structural demand signals — robotics training data bottleneck, Autodesk
      partnership, DeepMind and NVIDIA validating the world model category — are all consistent
      with meaningful market formation over 2–5 years.
    claimRefs:
      - CM005
      - CM006
      - CM012
      - CM013
      - CM035

  - calloutType: risk
    title: "Pre-Category Market: No Standalone Spatial AI Sizing Exists"
    body: >
      No analyst firm has defined "spatial intelligence" or "3D generative AI" as a standalone
      market category. All sizing in this chapter is proxy-based, with the nearest analogs
      (digital twin, broad generative AI) differing in scope by over two orders of magnitude.
      The bottom-up vertical estimates ($0.5B–$2B for robotics, $0.3B–$1B for AEC) are highly
      uncertain inferences. World Labs' own market framing — comparing 3D to text as the universal
      interface, implying a TAM as large as LLMs — conflicts with the more bounded near-term
      evidence from analyst data and product pricing. Investors should treat any precise market
      sizing for spatial AI with significant skepticism until independent analyst coverage
      produces a defensible category boundary.
    claimRefs:
      - CM030
      - CM032
      - CM047
      - CM048

