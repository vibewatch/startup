chapter:
  number: 2
  title: Market Analysis
  summary: >
    World Labs operates at the intersection of three high-growth but loosely bounded markets:
    broad generative AI ($83B in 2026, per GMI), digital twin and simulation infrastructure
    ($21B in 2025 growing to $150B by 2030, per MarketsandMarkets), and a nascent spatial
    intelligence layer with no standalone analyst category. Four buyer segments — media/creative
    production, robotics and embodied AI research, architecture and design (AEC), and API
    developers — each approach world generation from distinct budget lines and adoption triggers.
    Growth is driven by the robotics training-data bottleneck, the generative AI investment surge,
    and the emerging API economy; adoption is constrained by the sim-to-real gap, enterprise
    integration complexity, and the absence of an established procurement path for spatial AI tools.

sections:
  - id: market-boundary
    title: Market Boundary and Structural Definition
    body: >
      World Labs defines its market around a concept it calls spatial intelligence: the capacity
      for AI systems to perceive, generate, reason, and interact with three-dimensional environments.
      This framing positions the company's products — Marble (the generative world model) and the
      World API (the programmatic interface) — not as a 3D art tool or a simulation platform per se,
      but as foundational infrastructure enabling any downstream system to understand and produce
      navigable spatial worlds.


      The core included spend in this market comprises AI-native services that generate or reason
      over 3D environments: API calls for programmatic world creation, subscription access to cloud
      world-generation platforms, and integration tooling that embeds spatial intelligence into
      other applications. Excluded spend includes conventional 3D digital content creation (DCC)
      tools such as Maya, Blender, or Houdini that operate without AI generation, traditional
      CAD/BIM licenses (AutoCAD, Revit) unless embedded with a generative AI capability, and
      physics engines such as MuJoCo or NVIDIA Isaac Sim used in isolation without AI-generated
      content inputs. The boundary is drawn at the point of AI-generative output: if a tool creates
      3D content through parametric or artist-driven pipelines, it is a substitute, not part of the
      same market.


      Adjacent markets that overlap meaningfully include robotics simulation infrastructure (the
      demand for sim-ready 3D environments at training scale), digital twin platforms (where
      AI-generated world representations feed into mirroring and monitoring workflows), immersive
      design visualization (where spatial AI replaces static renders), and developer infrastructure
      for AI-native applications (where the World API competes with or complements cloud AI APIs).
      Each of these adjacencies represents a potential channel for World Labs' SAM expansion, but
      each also carries distinct incumbent platforms and buyer workflows.


      Status-quo substitutes in each segment are well-established: robotics researchers use
      procedural generators (Infinigen, Isaac Sim's asset library), simulation frameworks (MuJoCo,
      RoboSuite), and bespoke environment authoring; architects use static renders and real-time
      game engines; filmmakers use physical sets and virtual production volumes; developers use
      standalone 3D asset libraries or manual pipelines. These substitutes are free or low-cost
      in many cases (MuJoCo is open-source; Infinigen is open-source under BSD-3), which sets a
      high bar for the value World Labs must demonstrate to win budget.


      World Labs' own taxonomy essay (June 2026) identifies "world model" as one of the most
      overloaded terms in AI, encompassing computer vision, robotics, game research, and
      neuroscience use cases simultaneously. This semantic breadth creates market segmentation
      challenges: buyers in each vertical have different expectations of what a world model
      provides, making consistent positioning and lead qualification difficult at this stage.
