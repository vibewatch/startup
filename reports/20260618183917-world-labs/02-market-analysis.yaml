  - id: sizing-gaps
    title: Sizing Contradictions, Estimation Gaps, and Open Questions
    body: >
      This chapter's sizing analysis surfaces several significant gaps that are preserved rather
      than resolved. The most fundamental gap is categorical: no third-party analyst has defined
      "spatial intelligence infrastructure" or "3D generative AI" as a standalone market category.
      Sizing is therefore entirely proxy-based, and the proxies — broad generative AI and digital
      twin — differ in scope by roughly two orders of magnitude (digital twin: $21B vs. broad
      generative AI: $53B in 2025). Neither bound is the "right" market for World Labs; the
      company's actual serviceable market is a subset of both.


      A second gap is conflicting analyst estimates. MarketsandMarkets forecasts the digital twin
      market at 47.9% CAGR through 2030; other sources imply lower growth depending on what is
      included in the category boundary. The methodology underlying these forecasts is top-down
      survey-based estimation that is not independently verified. The uncertainty band on any
      single analyst number should be treated as at least ±50%.


      A third gap is private evidence: World Labs has not disclosed revenue, ARR, customer count,
      or API call volumes, making it impossible to derive a bottom-up SAM from actual monetization
      data. The company's $1.23 billion in raised capital and $5 billion reported valuation target
      imply investor expectations of eventual market leadership, but the specific revenue model
      supporting those expectations remains private.


      Fourth, the robotics and embodied AI SAM is highly sensitive to assumptions about how much
      of robotics R&D spending goes to simulation environment creation versus hardware, software,
      and operations — and there is no public breakdown. The bottom-up estimate of $0.5B–$2B is
      an inference from general robotics market data rather than direct evidence of simulation
      infrastructure spend.


      Finally, there is limited independent evidence of spatial AI adoption slowdown or market
      skepticism. The sourced evidence shows primarily positive signals (Autodesk investment,
      customer case studies, academic validation). The absence of adverse evidence should be
      treated as a research gap rather than confirmation of uniform market enthusiasm, particularly
      given the general AI hype cycle dynamics documented by Deloitte and others.
