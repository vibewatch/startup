callouts:
  - calloutType: strength
    title: Founding Team IP Directly Embedded in Core Product
    body: >-
      Three of four World Labs co-founders are lead authors of the academic
      papers that constitute Marble's and Spark's neural rendering foundation:
      Mildenhall (NeRF, ECCV 2020 oral; Mip-NeRF 360), Lassner (Pulsar,
      arXiv 2004.07484), and Johnson (PyTorch3D and 3D scene understanding
      research). These are not licensed-in techniques or repackaged open-source
      components; they represent original architectural choices made by the
      same people now building the product. This gives World Labs a step
      function advantage in model optimization, training efficiency, and
      architectural evolution that is difficult for any team that did not
      author the foundational work to replicate quickly.
    claimRefs:
      - CE017
      - CE018
      - CE037
      - CE038
      - CE039
      - CE040

  - calloutType: risk
    title: Security and Compliance Posture Below Enterprise Expectations
    body: >-
      World Labs' current trust documentation — responsible disclosure page
      (no bug bounty), AUP, ToS, and Privacy Policy — is appropriate for a
      consumer product but falls short of what enterprise procurement typically
      requires. The absence of SOC 2 Type II, ISO 27001, or AI RMF conformance
      documentation, combined with an undisclosed data retention and
      training-data usage policy, creates friction for customers in regulated
      industries such as defense, architecture, healthcare, or government
      contracting. The robotics and architecture verticals World Labs is
      actively targeting are populated by organizations with vendor security
      questionnaire requirements that this current posture will not satisfy
      without additional disclosure.
    claimRefs:
      - CE045
      - CE049
      - CE050

  - calloutType: insight
    title: Marble Labs Ecosystem as a Low-Cost Integration Expansion Strategy
    body: >-
      The Marble Labs showcase library demonstrates a developer-led integration
      expansion that World Labs does not need to staff or fund directly. Each
      new showcase (Unity VR, Unreal Engine, NVIDIA Isaac Sim, Rapier3D physics,
      Colyseus multiplayer) effectively extends the API's integration surface and
      generates real-world usage evidence that supplements World Labs' own
      case study materials. This community flywheel, if sustained, reduces the
      marginal cost of ecosystem development while generating organic proof
      points for enterprise sales. The risk is that unsupported community
      integrations can break at version boundaries and create a fragmented
      developer experience without a formal SDK maintenance commitment.
    claimRefs:
      - CE028
      - CE029
      - CE030
      - CE032
      - CE034
      - CE035
      - CE041

