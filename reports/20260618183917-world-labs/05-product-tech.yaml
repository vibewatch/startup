chapter:
  number: 5
  title: Product & Technology
  summary: >-
    World Labs delivers spatial intelligence through two customer-facing product
    surfaces: Marble, a multimodal generative world model in general availability
    since approximately November 2025 that produces navigable 3D environments
    from text, images, video, and panoramas; and the World API, launched
    January 21, 2026, which exposes Marble programmatically to developers and
    enterprise integrators. Web delivery is powered by Spark 2.0, an internally
    built Level-of-Detail 3D Gaussian Splatting renderer running in any browser
    via WebGL2. The founding team's direct authorship of NeRF, Pulsar, and
    Mip-NeRF 360 embeds foundational neural rendering IP in the product stack.
    Integrations span robotics simulation (NVIDIA Isaac Sim), game engines
    (Unreal Engine, Unity), and creative toolchains. Trust posture is defined
    by a published AUP, Terms of Service, and Privacy Policy but lacks
    independent security certification or a public bug bounty program as of
    June 2026.

sections:
  - id: product-overview
    title: Product Definition and Customer Workflow
    body: >-
      World Labs' flagship product, Marble, positions itself as a generative
      spatial intelligence engine that converts multimodal inputs directly into
      explorable 3D worlds. From a customer perspective, the workflow begins
      with the user supplying a creative or informational signal — a short text
      description, a reference image, a video clip, a 360-degree panorama, or a
      coarse 3D layout — and receiving in return a persistent, navigable 3D
      environment they can explore in a web browser, edit interactively, expand
      into larger scenes, and export for downstream use. The company describes
      this as "transforming seeing into doing, understanding into reasoning, and
      imagining into creating," positioning the workflow as a conceptual
      compression of what previously required dedicated 3D artists, photogrammetry
      rigs, or manual scene modeling.

      Marble is offered both as a direct consumer/prosumer subscription at
      marble.worldlabs.ai and as a programmatic service through the World API.
      The API, launched January 21, 2026, allows developers to embed world
      generation into products and pipelines without maintaining a 3D production
      stack. The API processes requests asynchronously and returns a fully
      navigable 3D world object that can be rendered in the browser, exported
      as a Gaussian splat (.spz or .rad format), mesh (.glb), or video, or
      passed directly to simulation frameworks.

      Documented use cases span four primary verticals: (1) film and VFX, where
      filmmakers use Marble as a stable virtual set that holds spatial
      consistency across scenes and shots; (2) gaming and AR/VR, where developers
      build interactive browser experiences from generated environments; (3)
      robotics and embodied AI simulation, where researchers generate scalable
      training environments for domain randomization; and (4) architecture and
      design, where Marble accelerates concept visualization by letting designers
      walk through ideas before drafting floor plans. World Labs itself used
      Marble to produce its own launch marketing video, generating hundreds of
      3D worlds in the process.

      The product hierarchy includes Marble (the generative world model), the
      World API (programmatic access layer), Spark 2.0 (the rendering engine),
      and Marble Labs (the developer portal and case study hub). Each layer
      addresses a distinct customer segment: Marble targets individual creators
      and professionals; the World API targets platform developers and
      enterprise teams; Spark enables third-party runtime rendering; and Marble
      Labs drives ecosystem adoption and developer enablement.
