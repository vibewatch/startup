  topStrengths:
    - Millimeter-wave drilling offers unusually large strategic upside if Quaise can reach superhot rock economically.
    - Project Obsidian and Nevada Gold Mines provide real commercial surfaces, not just lab narratives.
    - >-
      Strategic backers including Prelude, JERA, and Idemitsu validate the company as more than a speculative science
      project.
    - >-
      The market backdrop for firm geothermal power is improving, with growing PPAs, private capital, and interest in
      24/7 clean energy.
    - >-
      The company appears to be building real execution depth in project management, geothermal development, and field
      integration.
  topRisks:
    - No public valuation mark, cap-table waterfall, tariff data, or revenue base makes pricing discipline difficult.
    - >-
      Project Obsidian remains the central risk concentrator across permitting, financing, customer proof, and
      valuation.
    - Commercial proof is still meaningfully weaker than better-proven peers such as Fervo and Eavor.
    - >-
      Public reporting suggests the first 50 MW phase still needs large additional financing beyond disclosed equity
      capital.
    - Specialized engineering, partner, and customer concentration increase execution fragility at this stage.
  unresolvedGaps:
    - Latest priced valuation mark and any secondary references
    - Cap-table waterfall, preferences, and true entry economics
    - Project-level sources and uses for the first 50 MW phase
    - Named offtakers, tariff ranges, and contract structure for Obsidian
    - Commercial flow-test, depth-progression, and reliability data
    - Full permit matrix and issuance status across federal and Oregon pathways
