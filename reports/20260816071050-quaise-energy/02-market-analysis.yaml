    {
      "id": "constraints-and-what-is-still-missing",
      "title": "Constraints, contradictions, and what still blocks a hard SAM/SOM",
      "body": "The market story is large, but the bottlenecks are just as visible. Canary shows that even a 50 MW first-phase project still needs substantial additional financing beyond equity already raised. Latitude frames the core underwriting problem correctly: cheap, abundant heat underground does not matter unless the wells can be drilled, completed, activated, and operated at a cost that beats alternatives. NREL’s market report reinforces the capital intensity point, while Quaise’s own materials acknowledge that new materials, high-temperature electronics, thermal cycling, subsurface characterization, and longer deployment cycles are still important constraints. The biggest analytical gap is pricing. Public sources do not disclose what power buyers would pay for Project Obsidian, what industrial-heat customers would pay per thermal unit, or how much of geological potential can realistically be converted into bankable contracted revenue. That is why a rigorous company-level SAM or SOM is still out of reach. The right conclusion is not that the market is small; it is that the retained public evidence supports a promising multi-lens category, but not a finished underwriting model.",
