    "number": 2,
    "title": "Market Analysis",
    "summary": "Quaise’s market is large in theory but narrower in the evidence than a generic “global geothermal” narrative implies. The strongest public wedge is clean firm power and industrial heat in high-gradient regions, especially where buyers can reuse fossil or industrial infrastructure and value 24/7 output. Installed geothermal today is still modest — NREL reports 3.969 GWe across 99 U.S. plants in 2024 — but policy support, next-generation PPAs, industrial heat demand, and Quaise’s tiered geography thesis show why investors care. What the public record still does not provide is a rigorous company-level TAM/SAM/SOM bridge with real customer pricing."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary: a superhot firm-energy wedge, not generic geothermal TAM",
      "body": "Quaise should not be valued against an undifferentiated “all geothermal everywhere” story. The public evidence points to a narrower but more defensible market: firm clean power, high-temperature industrial heat, and fossil-asset repowering that benefit from geothermal’s ability to operate 24/7 with a small surface footprint. That boundary matters because it separates Quaise from categories it is not actually serving today, such as residential ground-source heat pumps, shallow direct-use heating retrofits, or generic renewable procurement with no geothermal-specific buyer intent. EIA’s description of the current hydrothermal market reinforces the distinction. Today’s installed geothermal base relies on naturally favorable hydrothermal resources, temperatures in the hundreds of Fahrenheit, and wells that may only extend a couple of miles. Quaise’s thesis is different: unlock much hotter rock, serve harder-to-decarbonize energy jobs, and make geothermal geography less restrictive over time. The result is a market that is broader than “conventional geothermal plants” but much narrower than “all electricity and heat.” It is best described as a next-generation infrastructure market for buyers who need firm, high-density, high-capacity-factor energy, especially where fossil infrastructure or industrial thermal demand already exists.",
