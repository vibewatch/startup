      "id": "buyers-and-adoption-workflow",
      "title": "Buyer segmentation and the adoption workflow",
      "body": "The buyer map for Quaise differs meaningfully by use case. Utilities and grid planners care about capacity factor, reliability, and long-term clean-firm power contracts. Large corporates and data-center ecosystems care about firm clean energy that can hedge both carbon pressure and power-supply volatility. Industrial operators care about process heat and onsite energy resilience. Mining customers, as Nevada Gold Mines demonstrates, can also treat deep geothermal as a site-level decarbonization tool rather than a grid-scale merchant opportunity. These are not impulse purchases; they are infrastructure programs. A project usually has to clear resource screening, a confirmation well, permitting, financing, offtake, drilling, and then surface-plant construction before revenue is visible. That is why offtake proof matters so much. NREL’s review of next-generation PPAs and Google’s continued geothermal engagement through Fervo show that buyer appetite for clean firm geothermal is real. But it also means market conversion is slow, capital intensive, and gated by counterparties rather than by simple top-of-funnel customer acquisition. For Quaise specifically, the most evidence-backed early wedges are industrial and grid-facing infrastructure buyers rather than retail or mass-market geothermal users.",
