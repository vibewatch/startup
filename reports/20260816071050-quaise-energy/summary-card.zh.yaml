  topStrengths:
    - 如果 Quaise 能以经济方式钻到超热岩层，毫米波钻探带来的战略上行空间异常大。
    - Project Obsidian 和 Nevada Gold Mines 提供了真实商业切面，不只是实验室叙事。
    - Prelude、JERA、Idemitsu 等战略投资方验证了公司不只是投机性科学项目。
    - 稳定地热电力的市场背景在改善，PPA、私人资本和 24/7 清洁能源兴趣都在上升。
    - 公司似乎正在补强项目管理、地热开发和现场集成的真实执行深度。
  topRisks:
    - 没有公开估值标记、股权结构瀑布、上网电价数据或收入基础，定价纪律很难把握。
    - Project Obsidian 仍是核心风险集中点，横跨许可、融资、客户验证和估值。
    - 商业验证仍明显弱于 Fervo、Eavor 等证据更充分的同行。
    - 公开报道显示，首期 50 MW 仍需要在已披露股权资金之外筹集大量额外融资。
    - 专门工程能力、合作伙伴和客户集中度，在这个阶段都会放大执行脆弱性。
  unresolvedGaps:
    - 最新定价估值标记和任何老股交易参考
    - 股权结构瀑布、优先权和真实进入经济性
