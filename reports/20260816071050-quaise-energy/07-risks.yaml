  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Quaise’s upside remains real, but the current underwriting case is dominated by stacked execution risk rather than a single binary question. The top risks are regulatory and legal timing risk around Project Obsidian’s federal-land pathway; frontier-technology risk as the company moves from 100-meter field drilling proof toward kilometer-scale and then full superhot power production; financing risk because public reporting indicates the first 50 MW Oregon phase still needs substantial additional capital beyond disclosed venture funding; partner concentration around Nabors, strategic investors, and a small set of specialized engineers; and customer concentration because the visible commercial story still rests on one flagship Oregon project and one named mining pilot. The risk verdict is high but monitorable: none of the major risks are obviously fatal today, but multiple thesis-break triggers could cascade through schedule, financing, customers, and valuation at once."
  },
  "sections": [
    {
      "id": "regulatory-legal-stack",
      "title": "Regulatory and legal stack: the main issue is not hostility, but unfinished path dependence",
      "body": "The most important nontechnical risk is that Quaise’s flagship commercial path still appears to sit inside a multi-step public permitting sequence rather than behind it. Project Obsidian is visibly real, and public evidence places it on the BLM’s National Environmental Policy Act register while the company simultaneously describes the Oregon site as well underway and still tied to a first confirmation well. That combination matters. It suggests the project is no longer conceptual, but it also suggests the public record does not yet show a fully cleared permitting stack, completed environmental review, or fully de-risked development path. Supportive federal policy toward geothermal helps at the category level, yet it does not shorten the site-specific steps around land use, environmental review, drilling permissions, and later plant development. The legal posture is similar: there is no retained public evidence of active litigation or enforcement against Quaise, but there is also no basis to conclude that legal exposure is trivial. A company whose core value rests on proprietary drilling know-how, infrastructure partnerships, and a first commercial project on federal land necessarily carries legal, permitting, and contracting sensitivity well before any lawsuit becomes visible.",
