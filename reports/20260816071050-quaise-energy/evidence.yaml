evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: 2026 Series B post-money valuation, share-price equivalent, and preference stack terms.
    whyItMatters: >-
      A capital-raised number without price information prevents any clean judgment on whether the current round is
      conservative, fair, or stretched.
    diligencePath: >-
      Request the Series B term sheet or a management-approved cap-table summary with valuation, liquidation
      preferences, and pro-rata structure.
    relatedQuestionRefs:
      - QO011
      - QO025
  - type: missing-source
    severity: material
    topic: offtake
    missingEvidence: >-
      Names, tenor, pricing, and milestones of the undisclosed Project Obsidian offtake agreements that supposedly
      support first revenues.
    whyItMatters: >-
      Without counterparties and contract terms, investors cannot judge revenue quality, bankability, or how much of the
      project risk has actually transferred.
    diligencePath: Request executed offtake term sheets or redacted commercial contracts for first-phase Obsidian customers.
    relatedQuestionRefs:
      - QO021
      - QO025
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current total employee count and key function breakdown.
    whyItMatters: >-
      Team scale is a useful execution proxy for a project developer moving from field tests to a federal-lease power
      project, and public leadership bios do not reveal organizational depth.
    diligencePath: Request a current organizational chart or simple full-time employee count by function.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO002
  - type: access-blocked
    severity: minor
    topic: 2022-businesswire-archive
    missingEvidence: >-
      Readable copies of the original Business Wire versions of the 2022 and 2026 financing releases, which were blocked
      during fetch.
    whyItMatters: >-
      The retained official Quaise pages and independent reports already preserve the core financing facts, so the
      blocker does not stop judgment, but it limits direct comparison of original release wording.
    diligencePath: Obtain direct PDF copies from company IR or a media archive if exact release language becomes important.
    relatedQuestionRefs:
      - QO007
      - QO009
  - type: missing-source
    severity: material
    topic: sam-som-pricing
    missingEvidence: >-
      Project-level power-price assumptions, industrial-heat tariffs, and revenue-conversion rates that would turn macro
      market potential into a Quaise-specific SAM or SOM.
    whyItMatters: >-
      Without price and conversion assumptions, investors can only rely on proxy sizing lenses rather than a directly
      underwritten company market model.
    diligencePath: >-
      Request Obsidian power-price assumptions, industrial-heat pricing assumptions, and any internal SAM/SOM model used
      for fundraising.
    relatedQuestionRefs:
      - QM021
      - QM025
  - type: missing-source
    severity: material
    topic: buyer-proof
    missingEvidence: Named Project Obsidian offtakers and signed commercial terms for first-phase power sales.
    whyItMatters: Demand visibility is central to distinguishing a large theoretical market from an actually contracted first wedge.
    diligencePath: Obtain redacted power offtake agreements or management-confirmed counterparty names and milestone structure.
    relatedQuestionRefs:
      - QM012
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: quaise-market-model
    missingEvidence: >-
      Management’s internal market model connecting Tier I / II / III geography to drilling cost, power output, and
      expected buyer adoption.
    whyItMatters: Public materials show the qualitative framework but not the quantitative bridge from geology to revenue.
    diligencePath: Review the latest fundraising deck or board materials used to support market expansion assumptions.
    relatedQuestionRefs:
      - QM010
      - QM025
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized power tariffs, heat pricing, and margin data across Quaise and direct peers.
    whyItMatters: >-
      Without standardized commercial terms, capability comparisons overstate certainty on who has the better business
      model.
    diligencePath: Request signed or redacted contract economics for Project Obsidian and benchmark peer PPAs where available.
    relatedQuestionRefs:
      - QP013
      - QP019
  - type: missing-source
    severity: material
    topic: exclusive-partner-terms
    missingEvidence: Exclusivity or priority-access terms in Quaise’s rig, drilling, or OEM partner agreements.
    whyItMatters: Moat durability is hard to judge if key execution layers are non-exclusive and portable to rivals.
    diligencePath: >-
