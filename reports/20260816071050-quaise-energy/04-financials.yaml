  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Quaise’s public financial profile is defined by capital raising and project ambition, not by visible operating revenue. The company has disclosed $230 million raised to date, with a $134 million Series B in 2026 and strategic backing from JERA and Idemitsu, but public sources still show significant additional financing need for the first 50 MW Project Obsidian phase and provide no usable disclosure on cash, burn, tariffs, margins, or well-level economics. The likely monetization path is power and industrial-energy sales from owned or developed geothermal projects, potentially complemented by brownfield repowering economics, but all key pricing and unit-economics variables remain private. The financial verdict is therefore category-positive but company-underdisclosed: Quaise looks financeable enough to keep advancing, yet still cannot be underwritten with conventional revenue or cash-flow precision."
  },
  "sections": [
    {
      "id": "revenue-model",
      "title": "Revenue model: visible future streams exist, but current revenue does not",
      "body": "Public evidence does not show a meaningful operating revenue base at Quaise today. The financial story is still about what the company is building toward rather than what it has already monetized. The most credible future revenue stream is electricity sold from company-developed geothermal plants such as Project Obsidian. A second potential line comes from industrial and site-level projects, with Nevada Gold Mines as the strongest named example of a non-utility use case. Brownfield repowering could become another monetization path, but public sources do not clarify whether that would be captured through asset ownership, energy sales, project-development fees, or some combination. What is clear is that Quaise does not look like a product company with list pricing. It looks like a project company whose revenues will come through a small number of long-dated contracts or owned assets. That structure can eventually produce durable, high-quality revenue if geothermal performs as promised, but it also means early revenue will likely be concentrated, milestone-driven, and difficult to benchmark from public information alone.",
      "claimRefs": [
