    {
      "id": "traction-comps-and-verdict",
      "title": "Traction, comps, and verdict: promising category, underdisclosed company",
      "body": "The public traction evidence is real but indirect. Quaise has funding, strategic investors, an active first commercial project, a named industrial pilot, and a category that is clearly attracting customers and capital elsewhere. Fervo’s large round, Google’s geothermal offtake activity, and public geothermal PPAs summarized by NREL all show that the market for firm geothermal power is not theoretical. Mature public operators such as Ormat also demonstrate that geothermal can become a large revenue business over time. But those facts do not solve Quaise’s underwriting problem. There is still no public revenue base, no cash runway, no project-level tariff disclosure, no well-level output data, and no margin model. This makes conventional multiple-based valuation or tight revenue forecasting inappropriate. The financial conclusion is therefore straightforward: Quaise is credible enough to merit serious diligence, but not transparent enough to underwrite on standard revenue or cash-flow metrics today.",
