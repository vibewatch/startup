    {
      "id": "capital-adequacy",
      "title": "Capital adequacy: well funded by venture standards, still finance hungry by project standards",
      "body": "On disclosed venture funding alone, Quaise looks impressive. The company’s public trajectory runs from a $52 million Series A expansion in 2022, through a partial 2023 raise reported by TechCrunch, to a $134 million Series B in 2026 that brought total capital raised to $230 million. Strategic investors such as JERA and Idemitsu add genuine credibility because both explicitly tie their investments to future commercialization and international deployment opportunities. But the same public record also shows why this is not enough. Canary reported that the first 50 MW Oregon plant still needed another $100 million of financing and another $100 million of grants and debt, while ThinkGeo said additional capital was already being raised concurrently. That means the capital stack required for a first commercial project is closer to infrastructure finance than to classic venture runway. Public sources do not disclose cash on hand or burn, so it is impossible to say whether Quaise is comfortable or constrained in the near term. What can be said is that the company remains meaningfully financing dependent even after a large Series B.",
