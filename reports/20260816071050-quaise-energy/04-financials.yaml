    {
      "id": "economics-and-unit-drivers",
      "title": "Economics and unit drivers: the underwriting variables are visible, the values are not",
      "body": "Even though current revenue is absent, the economics framework is already visible. Quaise’s model will turn on a handful of critical variables: whether the company can drill to sufficient depth at acceptable cost, how much energy each well produces, what capacity factor it sustains, what tariff or heat price the project earns, and how much capital is required per megawatt of capacity. Latitude’s reporting is instructive here because it shows that drilling is only one part of the cost equation; the model works financially only if extreme heat translates into unusually high energy output per well. That is why simple venture-style KPI analysis fails. Quaise is not trying to optimize user acquisition or gross software margins; it is trying to prove that a first-of-a-kind infrastructure system can achieve a project-level cost and output profile that beats alternatives. Public evidence does not disclose the actual capex per well, capex per megawatt, opex per well, or realized prices needed to solve that equation. As a result, the relevant unit-economics table is mostly a map of what matters and what still has to be requested in diligence.",
