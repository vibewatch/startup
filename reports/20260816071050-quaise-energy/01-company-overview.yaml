    {
      "id": "capital-history-and-strategics",
      "title": "Funding history, strategic investors, and capital structure",
      "body": "Quaise’s financing arc shows meaningful progress, but it also shows how capital-intensive the thesis has become. The company moved from a $52 million expanded Series A in 2022, to a $21 million Series A1 in 2024 that pushed cumulative capital above $95 million, to a $134 million Series B initial close in July 2026 that lifted disclosed total funding to $230 million. Prelude Ventures and Safar Partners have persisted through multiple rounds, which is a positive signal for investor conviction, while Mitsubishi, JERA, and Idemitsu show that industrial capital is increasingly willing to back the platform. The 2026 round is especially important because it is not framed as ordinary venture runway; it is the first equity component of a broader capital program meant to fund Project Obsidian itself, alongside project-level equity and debt. That means dilution, financing complexity, and construction-risk transfer all remain active parts of the story. Just as important, there is no high-quality retained public evidence for the 2026 post-money valuation. The practical takeaway is that investors can verify capital raised and syndicate quality, but not the price at which the market is currently clearing the risk.",
