    "number": 1,
    "title": "Company Overview",
    "summary": "Quaise Energy is a 2018 MIT spinout now operating as a Houston-based late-venture superhot-geothermal developer rather than merely a drilling-tool lab. Its public evidence set is strongest on technical origin, leadership depth, capital raised, and the existence of Project Obsidian in Oregon, where the company says construction is underway toward a 50 MW first phase and 2030 first power. Funding momentum is real — a $134 million Series B initial close in July 2026 lifted disclosed funding to $230 million and brought in JERA and Idemitsu — but the company still does not publicly disclose valuation, headcount, or named Obsidian offtakers, leaving the investability picture meaningfully incomplete."
  },
  "sections": [
    {
      "id": "identity-model-stage",
      "title": "Identity, operating model, and present stage",
      "body": "Quaise Energy is no longer just an MIT-origin science project. The 2026 official materials describe a Houston-based company that both commercializes a distinctive drilling technology and develops its own geothermal projects, with Project Obsidian in Oregon now serving as the flagship proof point. That matters because it changes how the business should be underwritten: the company is taking direct project-development, permitting, and offtake risk in addition to hardware and subsurface technology risk. Its public narrative is consistent across the homepage, company page, and Series B materials: millimeter-wave drilling is the enabling technology, but the product the company intends to sell is high-density, always-on geothermal heat and power that can compete with fossil-fired infrastructure. The company still leans heavily on the fossil-fuel retrofit story, especially for coal and gas assets, and it still cites geography-flexible deployment as the long-run reason the opportunity can be terawatt-scale. Even so, the current public evidence supports a more precise stage label than the prompt’s “unicorn” framing: Quaise looks like a late venture, project-precommercial Series B company with no disclosed public valuation and with first revenues tied to yet-undisclosed Project Obsidian offtake partners.",
