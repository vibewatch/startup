  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Quaise’s product is an integrated geothermal-asset delivery stack built around one key innovation: millimeter-wave drilling that aims to reach superhot rock too deep and harsh for conventional bits. The architecture is hybrid rather than wholly novel, combining standard drilling where it works with a surface gyrotron, waveguide, and purge-gas drilling process where conventional methods fail. The product-tech case is stronger today on staged field proof and engineering progress than on commercial operating proof: by mid-2026 the company had demonstrated 100 meters of field drilling, full-scale rig integration, and growing research support around fractures, materials, and plant design, but it still had not shown public evidence of a superhot well delivering stable commercial power. The verdict is frontier-industrial: technically differentiated, increasingly concrete, but still dependent on deeper test data, supplier execution, and first-project reliability evidence."
  },
  "sections": [
    {
      "id": "product-definition",
      "title": "Product definition: Quaise is building an energy-delivery stack, not a niche drill tool",
      "body": "Quaise should be understood as an integrated geothermal developer whose proprietary component happens to be a new drilling method. Public sources repeatedly make that clear: Project Obsidian is a commercial project, Nevada Gold Mines is a deployment use case, and independent coverage quotes management saying the product is not a drill bit but abundant heat and energy. In customer workflow terms, Quaise sells the ability to convert deeply buried superhot rock into usable power or industrial energy by combining project development, site selection, drilling, subsurface design, and surface-plant configuration. That framing matters for diligence because it means Quaise’s technology cannot be underwritten in isolation. The product only exists if the drilling subsystem, well design, permitting, land position, surface plant, and offtake all connect. A demo rig or a promising lab result helps, but it is not itself the delivered product. The delivered product is a geothermal asset capable of replacing or hybridizing legacy fossil power and industrial energy systems.",
