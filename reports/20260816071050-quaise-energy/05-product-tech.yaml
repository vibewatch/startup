    {
      "id": "architecture-and-operating-model",
      "title": "Architecture and operating model: hybrid drilling first, then superhot surface conversion",
      "body": "The architecture in retained public sources is specific enough to evaluate. Quaise begins with conventional drilling through upper formations, then switches to millimeter-wave drilling once rock becomes too hard, hot, or expensive for ordinary mechanical systems. A surface gyrotron sends energy down a waveguide to the rock face. At the bottom of the hole, the beam melts or vaporizes rock rather than mechanically crushing it. Instead of depending only on drilling mud, the system uses purge gas to move small cuttings out of the drilling zone. This is why the company describes the system as hybrid rather than wholly novel: it reuses much of the oil-and-gas rig stack while replacing the depth-limited portion of the process. On the production side, Quaise’s plant-design work suggests the surface system may not need to keep water supercritical all the way to the surface to capture most of the economic benefit. If true, that could let Quaise pair superhot reservoirs with more mature steam-turbine supply chains than lower-temperature geothermal systems often use today. The operating model is therefore a coupled stack: drilling access, well integrity, reservoir behavior, and surface conversion all have to work together.",
