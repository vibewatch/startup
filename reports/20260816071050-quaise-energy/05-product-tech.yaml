    {
      "id": "maturity-roadmap-and-dependencies",
      "title": "Maturity, roadmap, and dependency chain",
      "body": "Quaise has clearly moved beyond lab-only science. MITEI and company sources show a progression from early centimeter-scale work to granite-quarry field tests, full-scale Nabors integration, and the first 100-meter field milestone in 2026. At the same time, the company remains pre-commercial in the most important sense: public evidence still does not show a superhot Quaise well producing electricity or process heat in sustained operations. That gap defines the maturity rating. The roadmap now runs through Project Obsidian and western U.S. pilot development toward first commercial operations by the end of the decade. To reach that point, the company depends on a broad chain of collaborators and infrastructure: Nabors for rig integration and drilling execution, university and research partners for rock-fluid and materials understanding, regulatory pathways for land and NEPA work, gyrotron and equipment vendors for power scaling, and eventually turbine and plant contractors for the surface system. This chain is a strength because it reuses existing industrial capacity, but it is also a risk because each handoff can slow or break commercialization.",
