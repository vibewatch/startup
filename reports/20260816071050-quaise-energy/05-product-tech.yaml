    {
      "id": "trust-safety-and-remaining-underwriting-gaps",
      "title": "Trust, safety, and the remaining underwriting gaps",
      "body": "For a hardware-heavy geothermal company, “trust” is less about data privacy and more about safety, field control, regulatory progression, and durability under extreme conditions. The public evidence is encouraging on staged discipline: controlled quarry testing, incremental scaling, monitored demos, Project Obsidian’s regulatory presence, and external research into fractures, clogging, and vitrified liner behavior all suggest a serious engineering program. But public evidence is still thin on formalized quality systems and commercial operating reliability. There is no retained public catalog of ISO-type certifications, commercial uptime, failure rates, or well-life statistics. OSU-supported materials work underscores why this matters: clogging, mineral growth, glassy liners, and component behavior at 400–500°C are not footnotes; they are central to system durability. The consequence is that Quaise’s product-tech case is compelling but still underwritten more like a frontier industrial system than a proven equipment platform. The highest-value diligence will therefore be engineering data, not more visionary framing.",
