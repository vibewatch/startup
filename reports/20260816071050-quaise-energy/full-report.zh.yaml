      - number: '5.2'
        title: 架构与运营模式：先混合钻井，再做超热地表转换
        blocks:
          - type: paragraph
            body: >-
              留存公开来源中的架构足够具体，可以评估。Quaise
              先用常规钻井穿过上部地层；一旦岩石对普通机械系统来说太硬、太热或太贵，再切换到毫米波钻井。地表回旋管把能量沿波导送到岩面。孔底处，波束不是机械破碎岩石，而是熔化或汽化岩石。系统也不只依赖钻井泥浆，而是用吹扫气体把小岩屑带出钻进区。这就是公司称系统为混合式、而非全新式的原因：它复用了大量油气钻机栈，同时替换流程中受深度限制的部分。在生产侧，Quaise
              的电站设计工作暗示，地表系统也许不必让水一路以超临界状态到达地表，就能捕捉大部分经济收益。如果属实，Quaise
              就能把超热储层与比低温地热系统今天常用方案更成熟的蒸汽涡轮供应链配在一起。因此，运营模式是一套耦合栈：钻井进入、井完整性、储层行为和地表转换都必须协同工作。
