chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、运营模式与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Quaise Energy 已经不只是一个源自 MIT 的科学项目。2026 年官方材料描述的是一家总部位于 Houston 的公司：它既把一项差异化钻井技术商业化，也开发自己的地热项目，Oregon 的
              Project Obsidian 现在就是旗舰证据。关键在于，业务评估口径随之改变：除硬件和地下技术风险外，公司还直接承担项目开发、许可和购电风险。公司在官网、公司页面和 Series B
              材料中的叙事一致：毫米波钻井是使能技术，但公司真正想卖的是可与化石燃料基础设施竞争的高密度、全天候地热热力和电力。公司仍高度依赖化石燃料资产改造故事，尤其是煤电和燃气资产，也仍把部署不受地理严格限制视为机会最终可达太瓦级的原因。即便如此，现有公开证据支持的阶段标签比原问题里的“独角兽”框架更精确：Quaise
              更像是一家后期风险投资阶段、项目尚未商业化的 Series B 公司，没有披露公开估值，首批收入也取决于尚未披露的 Project Obsidian 购电伙伴。
