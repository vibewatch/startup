      - number: '2.5'
        title: 约束、矛盾以及硬 SAM/SOM 仍卡在哪里
        blocks:
          - type: paragraph
            body: >-
              市场故事很大，但瓶颈同样清楚。Canary 显示，即使只是 50 MW 一期项目，在已筹股权之外仍需要大量额外融资。Latitude
              准确抓住了核心评估问题：地下热便宜又充足没有意义，除非井能以优于替代方案的成本钻成、完井、激活并运营。NREL 市场报告强化了资本密集这一点；Quaise
              自己的材料也承认，新材料、高温电子、热循环、地下表征和更长部署周期仍是重要约束。最大的分析缺口是价格。公开来源没有披露电力买方会为 Project Obsidian
              支付什么价格，工业热客户会为每单位热量支付多少，或有多少地质潜力能现实转化成可融资的合同收入。因此，严格的公司级 SAM 或 SOM
              仍然够不到。正确结论不是市场小，而是留存公开证据支持一个有前景的多视角类别，但还不支持完整承保模型。
