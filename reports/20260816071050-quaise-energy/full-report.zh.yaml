            body: >-
              在直接同业中，Fervo 是当前最清晰的商业基准。其留存材料显示 500 MW Cape Station 建设计划、一轮大型 Series E，以及通过 Google 形成的具名交易对手证据。Eavor
              可见兆瓦规模小于 Fervo，但它比 Quaise 更有证据表明下一代替代路线已经能进入商业运营；其闭环设计也回应了不同于依赖渗透率系统的买方担忧。Sage
              是架构替代而非当前规模基准，但仍然重要，因为它说明一旦资本和客户开始重视，这一类别可以沿很多路径演化。Quaise 的公开位置更不对称：如果超深钻井跑通，它可能拥有最大的跃迁式上行空间；但目前商业证明少于
              Fervo 或 Eavor。其留存证据集中在钻井里程碑、混合钻机集成，以及建模或电站设计进展，而不是实际出电。因此，能力比较必不可少。Quaise
              最强的是温度雄心和化石电厂再供能契合度，最弱的是已验证兆瓦数和具名购电方。
