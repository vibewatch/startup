              Quaise
              自有材料展示了正确类型的早期商业信号：公司称正在锁定购电协议、钻确认井，并准备首次商业流动测试。这些里程碑很重要，因为基础设施项目的交易对手通常希望地下和执行风险收窄后才签约。不过，公开证明仍有限。Nevada
              Gold Mines 是最清楚的具名直接交易对手，即便如此，它也明确是试点路径，而不是生产收入关系。Obsidian 购电方没有公开具名。因此，Canary 和 Latitude
              等独立来源仍然重要，因为它们显示公司还处在转化前阶段，融资、流动测试和客户身份都还是开放问题。今天最合适的采用描述，是可信管线动能加上狭窄直接证明。换句话说，Quaise
