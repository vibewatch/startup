      - number: '1.5'
        title: 技术证明、时间线进展与 2022 年以来的变化
        blocks:
          - type: paragraph
            body: >-
              自 Quaise 早期 MIT 报道以来，最可信的正面变化是钻井系统已明确走出台架级概念。MIT 2025 年文章称，公司钻出了一个 118-meter 野外孔，并展示了显著快于常规钻井的花岗岩钻进速度；2026
              年 7 月 Series B 新闻稿则称，公司 2025 年穿透花岗岩超过 100 meters，正在 Central Texas 接近一公里野外里程碑。Nabors
              集成工作和混合钻机演示进一步说明，系统是在实际油田语境中开发，而不是停留在实验室真空里。不过，公司自身时间线的变化也最清楚地表明，这仍是前沿能源项目，不是已去风险的基础设施铺开。2022 年，MIT 报道描述过到
              2026 年开始从试点井采能的目标。到 2026 年，公司自己的旗舰项目指引已变成 2030
              年首度出电。这并不推翻底层投资逻辑，但确实说明商业化路径比早期叙事更长、更资本密集，也更充满不确定性。公司已有足够真实世界证据值得认真看待，但还不足以抹掉进度和执行风险。
