      - number: '1.2'
        title: 创始人、管理层梯队与治理
        blocks:
          - type: paragraph
            body: >-
              创始人与市场匹配度的故事异常强，也异常集中。Carlos Araque 把 Schlumberger 钻井经验与 The Engine 带来的 MIT 商业化经历接在一起；Matt Houde
              则把地热商业化工作和 DOE 关联钻井项目执行经验结合起来。Paul Woskov 仍是核心人物，作为 MIT 原始研究者，他的回旋管概念支撑了科学叙事，尽管 Quaise
              本身才是商业化载体。公开可见的管理层梯队也明显深于一个小型实验室分拆公司。Kevin Bonebrake 在 CFO 层面带来能源行业资本市场经验，Franck Monmont 和 Henry Phan
              覆盖建模与工程系统放大，Trenton Cladouhos 与 Geoffrey Garrison 又补上公司早年缺少的成熟地热田开发深度。Ali Azad
              以独立董事身份加入，是少数公开可见的治理信号之一；这表明管理层知道首个同类电力项目执行和资本形成需要独立监督。最大的保留是，公开披露仍没有给出总员工数，外部只能看到高管名单，却看不完整组织规模。
