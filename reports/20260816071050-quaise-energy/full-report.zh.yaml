              的报道很有启发，因为它说明钻井只是成本方程的一部分；只有极端热量转化为异常高的单井能量产出，模型在财务上才成立。这就是简单风投式 KPI 分析失效的原因。Quaise
              不是在优化用户获取或软件毛利率，而是在证明一个首个同类基础设施系统能实现优于替代方案的项目级成本和产出曲线。公开证据没有披露解这个方程所需的实际单井资本开支、每兆瓦资本开支、单井运营开支或实现价格。因此，这张单位经济表大多只是列出什么重要，以及尽调中还必须索取什么。
