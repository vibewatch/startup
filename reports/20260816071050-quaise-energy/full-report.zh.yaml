  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: 理解 Quaise 市场，最清晰的方式是把它拆成分阶段的地理与需求堆叠：从现有装机基础出发，经过可见的已签约需求，最后才走到公司主张的全球分层逻辑。
    data:
      nodes:
        - label: 当前美国地热基础：3.969 GWe / 99 座电站
          note: 装机市场现实校验。
        - label: 全球地热市场：~15 GWe 发电 / 38 GWth 直接供热
          note: 更广的地热存量，但相对总体能源仍不大。
        - label: 下一代已签约需求：截至 2025 年 6 月 PPA 达 984 MWe
          note: 品类需求正在变得可签约。
        - label: 工业热楔子：全球能源使用有一半是热
          note: 热力脱碳扩大买方池。
        - label: Tier II 可达性：接近全球 40%
          note: 公司用来衡量毫米波钻井扩大覆盖面的视角。
        - label: Tier III 可达性：覆盖 >90% 人口
          note: 公司对全球超热潜力的长期主张。
    approximationNotes: 这座金字塔混合了当前装机容量、已签约需求、宏观终端用能负荷和公司的地理视角，因为公开电价数据不足，无法搭出单一 SAM 桥。
