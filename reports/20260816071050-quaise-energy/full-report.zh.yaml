      - number: '8.3'
        title: 情景与入场纪律：承销里程碑，不承销神话
        blocks:
          - type: paragraph
            body: >-
              Quaise 的纪律性情景框架应围绕里程碑，而不是假装存在的收入倍数。悲观情景假设许可或融资摩擦持续、流量测试和延深证据继续推迟，且同行商业化速度仍更快。在这种情况下，Quaise
              仍有技术期权价值和高质量投资者背书，但估值区间会压缩到高数亿美元。基准情景假设 Obsidian
              和配套现场里程碑继续推进，首个项目资本结构更可信，并且至少出现一个具名交易对手或承购结构；可支撑低个位数十亿美元的估值区间。乐观情景需要更具体的一揽子证据：可见的流量测试成功、更清晰的许可、融资闭合，以及能让首座商业电站看起来可融资而非只是愿景的客户或电价证据。即便如此，上行情景也不是无限的。公开证据仍支持分阶段重估，而不是立刻接受缺乏支撑的标题估值。
