      - number: '2.4'
        title: 采用驱动因素：稳定电力稀缺、工业热与油田杠杆
        blocks:
          - type: paragraph
            body: >-
              留存来源里能看到几个强劲顺风。第一，地热的电网价值异常清楚：DOE Office of Geothermal 强调约 90% 容量因子，Quaise
              和竞争对手材料也反复把地热定义为清洁基荷或可调度能源。第二，政策组合有利。DOE 明确试图把 EGS 在 2035 年推到 $45/MWh，NREL 市场报告显示，下一代 PPA
              和项目承诺已经是实质事件，而不是假设。第三，工业热是一个真实相邻需求池，许多其他低碳技术很难直接触达。超热地热的 300–500°C
              叙事，比间歇式可再生能源更自然地贴合氨、水泥、炼油等工艺需求。第四，Quaise
              的商业叙事受益于油气劳动力和基础设施复用。这种杠杆不只是成本故事，也是速度故事，因为它给这一类别提供了现成承包商基础、钻机和开发工作流。如果 Quaise 证明钻井和项目配方成立，这些驱动因素会在技术达到完全全球
              Tier III 部署之前，就先打开一个大切口。
