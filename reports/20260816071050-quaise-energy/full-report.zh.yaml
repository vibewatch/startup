      - number: '7.3'
        title: 合作伙伴、融资与团队风险：依赖既是特点，也是软肋
        blocks:
          - type: paragraph
            body: >-
              Quaise 的商业化模型由广泛产业联盟支撑；联盟既是优势之一，也是最清晰的脆弱点之一。Nabors 降低钻机集成风险，JERA 和 Idemitsu
              增加战略可信度，近期招聘显示公司正试图在首次商业交付前补上项目和运营深度。但依赖风险仍高，因为每一段关系都在关键路径上。若 Nabors
              执行滑坡、战略投资者不再支持后续资本形成，或专业工程人才在错误时点流失，影响不会被关在单一职能里，而会直接传导到进度、融资和客户信心。财务风险又放大这种依赖。公开资料支持公司迄今融资 $230
              million，但公开报道也称，Obsidian 首期 50 MW 仍需要另外 $100 million 融资，以及 $100 million
              赠款或债务。这足以证明可信度，却不足以说明资本结构已经拼好。早期客户可见度也很集中，Nevada Gold Mines 仍是最清晰的具名部署证据。
