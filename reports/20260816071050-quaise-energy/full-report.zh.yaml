      - number: '2.3'
        title: 买方分层与采用流程
        blocks:
          - type: paragraph
            body: >-
              Quaise
              的买方地图因使用场景而明显不同。公用事业和电网规划者看重容量因子、可靠性和长期清洁稳定电力合同。大型企业和数据中心生态看重稳定清洁能源，因为它能同时对冲碳压力和电力供应波动。工业运营商关心工艺热和现场能源韧性。Nevada
              Gold Mines
              也说明，采矿客户可以把深层地热视为场站级脱碳工具，而不是电网级市场化售电机会。这些不是冲动购买，而是基础设施项目。一个项目通常要先通过资源筛选、确认井、许可、融资、购电、钻井，再完成地表电站建设，收入才会显现。因此，购电证据极其重要。NREL
              对下一代 PPA 的回顾，以及 Google 通过 Fervo 持续参与地热，都说明买方确实有清洁稳定地热需求。但这也意味着市场转化缓慢、资本密集，并由交易对手把关，而不是靠简单漏斗顶部获客推动。具体到
              Quaise，证据最充分的早期切口是工业和面向电网的基础设施买方，不是零售或大众市场地热用户。
