  - id: TV005
    title: 投资逻辑破裂和终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动指向
    rows:
      - - 流量测试 / 确认井进度滑坡
        - 出现重大可见延误，或无法转化为与商业化相关的数据
        - 拉长验证缺口，削弱任何溢价论据
        - 观望，或退出溢价定价
      - - 资本结构搭建失败
        - 剩余 50 MW 融资无法以可行条款完成交割
        - 抬高稀释和项目延期风险
        - 重评至悲观情景
      - - 许可拖累
        - 可见的 BLM / 州级路径明显放慢或恶化
        - 把首笔收入时点向后推
        - 将估值视为期权价值，而不是开发商价值
      - - 同业跑赢
        - Fervo / Eavor 拉大商业化差距，而 Quaise 仍处于验证前
        - 压缩战略溢价和稀缺性叙事
        - 要求更大折价，或推迟
      - - 客户不透明持续
        - 没有具名承购方或电价证据出现
        - 阻断收入测算信心
        - 建议维持继续研究 / 观察
    notes: 这些终止触发项被选中，是因为它们可通过公开证据或标准尽调询问从外部监控。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 估值标记
        - 最新定价轮估值、老股参考和任何内部标记
        - 没有估值标记，价格纪律只能靠猜
        - 直接询问管理层或领投方
      - - 股权结构表 / 优先权
        - 清算堆叠、按比例跟投权和优先权结构
        - 即便名义估值看似公平，这些条款也决定真实进入经济性
        - 要求提供股权结构瀑布表和条款清单
      - - 项目融资
        - 50 MW 阶段的资金来源与用途、债务 / 补助状态、契约敏感性
        - 这是从科学故事走向可融资资产的桥
        - 要求提供项目融资模型和贷款方状态
      - - 客户 / 电价验证
        - 具名承购方、条款清单或预期电价区间
        - 这把需求叙事转成收入可信度
        - 要求提供客户管线摘要和合同状态
      - - 技术验证包
        - 流量测试、深度推进和可靠性数据
        - 这是收窄情景区间最快的方法
        - 要求提供工程里程碑包和独立评审
    notes: 这些要求是最低材料包，用来把公开观察名单决策推进到真正的投资承销决策。
    claimRefs:
      - CV039
      - CV040
      - CV041
