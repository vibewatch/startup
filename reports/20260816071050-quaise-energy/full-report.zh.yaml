      - number: '3.3'
        title: 定价、上市路径与切换动态：证据胜过营销
        blocks:
          - type: paragraph
            body: >-
              这个行业的定价异常不透明。多数同业发布愿景声明、项目时间线和选择性 LCOE
              或成本曲线主张，却不发布标准化价目表或实际利润率。实际操作中，买方评估的是证据、交易对手、场址质量和风险转移，而不是在透明产品价格之间做选择。对公用事业和大型工业客户来说，竞争在资产建成前就开始了：它们可以在谈合同、融资和许可时，把不同地热开发商互相比，也与非地热稳定电力替代方案比较。一旦项目被选中并建成，切换成本会很高，但到那时胜出的开发商已经确定。正因如此，具名购电协议和可信伙伴生态比宽泛市场口号更重要。Fervo
              和 Eavor 目前在这里占优，因为其留存公开材料展示了更可见的客户或伙伴验证。Quaise 与 Nabors 的关系有助于工业化，但公开记录还不能证明独家渠道权力或合同锁定。
