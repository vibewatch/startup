              的总结，都说明当项目真实存在时，公用事业、企业和能源巨头愿意购买地热成果。这很重要，因为如果 Quaise 的技术和首批项目跑通，公司最终转化的概率会提高。但这些仍是代理信号。它们更能说明市场开放度，而不是
