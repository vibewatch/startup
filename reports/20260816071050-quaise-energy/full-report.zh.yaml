  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：对手不只是“其他超热初创公司”
        blocks:
          - type: paragraph
            body: >-
              Quaise 并不在一个狭窄的新奇类别里竞争。真实竞争框架包括 Fervo、Eavor、Sage 等直接下一代地热开发商；Ormat、Calpine
              等水热型在位者；能够承接地热工作的油田服务和钻井公司；在买方层面，还包括满足同一任务的其他清洁稳定电力或存量资产再供能方案。这很重要，因为不同对手会挤压投资逻辑的不同部分。Fervo
              在近期执行和客户证据上竞争。Eavor 在地质灵活性和闭环风险姿态上竞争。Sage 在替代地热系统架构上竞争。Ormat 和其他在位者则在运营可信度和买方熟悉度上竞争。同时，Nabors 和 SLB
              提醒投资人，大量地热执行最终可能通过油田生态由伙伴中介完成。结果是，Quaise 最新颖的差异化——靠毫米波进入超热深度——被放在一场围绕资本、签约和商业证明的更大竞争中。
