    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 意义
    rows:
      - - 稳定清洁电力
        - 公用事业 PPA、有容量支撑的清洁稳定电力合同、现场基荷发电
        - 没有地热属性或可调度需求的市场化可再生能源容量
        - 公用事业、电网规划方、大企业
        - 契合 Quaise 24/7 电力叙事和竞争品类成形
      - - 工业过程热
        - 现场热力供应、热电集成、工业脱碳项目
        - 住宅供暖改造和仅限低温 HVAC 的项目
        - 工业能源经理、工厂运营方
        - 最契合 Quaise 300–500°C 温度定位
      - - 化石能源资产再供能
        - 煤电或燃气电厂复用、涡轮和并网复用、棕地地热转换
        - 不复用热资产的纯绿地可再生能源项目
        - 电厂业主、IPP、项目开发商
        - 是 Quaise 公开商业化叙事的核心
      - - 采矿和重工业脱碳
        - 矿山和偏远工业场址的场址级电力与热力替代
        - 通用可持续发展咨询或 REC 购买
        - 矿业运营商和工业资产所有者
        - Nevada Gold Mines 是目前最强的具名证据点
      - - 现状地热与相邻替代方案
        - 传统地热、EGS、核能、燃气、太阳能+储能、能效措施
        - 非能源相邻软件或服务
        - 同上买方群体
        - 重要性在于 Quaise 面对的是既有厂商和相邻方案，而不只是初创公司
    notes: 这一定义边界有意排除浅层地热和通用可再生能源预算，因为它们并不直接购买地热稳定电力或高温热力属性。
