        - 当前
        - 相比间歇性可再生能源，支撑清洁稳定电力溢价
        - 测算目标市场中高容量因子能源的价值
      - - DOE Earthshot 与 EGS 公共资金
        - 利好
        - 当前至 2035 年
        - 提高品类合法性，并可能改善成本曲线
        - 跟踪 Quaise 能否获得或受益于公共项目
      - - 工业热脱碳需求
        - 利好
        - 当前
        - 把买方范围扩到公用事业公司之外
        - 识别首批项目场址的具体行业和温度区间
      - - 复用油气劳动力和供应链
        - 利好
        - 当前
        - 可降低部署摩擦，缩短学习曲线
        - 核验与 Nabors 及其他油田合作伙伴的真实合同条款
      - - 项目资本强度高，需要赠款 / 债务
        - 阻力
        - 当前
        - 融资瓶颈可能拖慢技术上可行的项目
        - 索取 Obsidian 完整资本计划和剩余融资里程碑
      - - 高温材料、套管和电子设备约束
        - 阻力
        - 当前
        - 即便钻井准入改善，商业化也可能放慢
        - 审查供应商就绪度和认证数据
      - - 缺少公开定价 / 电价数据
        - 阻力
        - 当前
        - 卡住严谨的可服务市场（SAM）和可获取市场（SOM）测算，也卡住估值桥接
        - 索取预期电价、热价和容量因子假设
      - - 基础设施采用流程长
        - 阻力
        - 持续
        - 销售周期更像项目融资，而不是常规 B2B 市场进入
        - 绘制从选址到首笔收入的平均周期
    notes: 驱动与约束交织在一起：同一个市场可以在战略上很有吸引力，同时在运营上很难打穿。
