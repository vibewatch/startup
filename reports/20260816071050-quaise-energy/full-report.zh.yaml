      - number: '1.4'
        title: Project Obsidian、交易对手与里程碑漂移
        blocks:
          - type: paragraph
            body: >-
              Project Obsidian 是如今整个公司围绕展开的核心事实。项目位于 Central Oregon 的 Newberry 附近，Quaise
              称当地地温梯度足够高，按这一类别的标准，可以在相对较浅深度达到超热条件。公开项目材料持续描述分期建设路径：先 50 MW，再 250 MW；如果早期系统跑通，最终目标是吉瓦级。BLM
              记录确认项目已通过一个重要中间步骤——最终类别排除和决定记录——但也明确显示，钻井许可和后续杂项通知仍在前方。这个细节很关键，因为项目比简单宣传公告更真实，也比公告暗示的完成度更低。商业验证同样只是部分成立。目前具名公开交易对手大多属于试点、基础设施和战略方：Nevada
              Gold Mines 对应工业脱碳试点，Nabors 对应全尺寸钻机集成，Oregon State University 对应科学去风险，JERA 和 Idemitsu
              对应战略市场扩张。公司还称首批收入绑定了未披露的购电伙伴，但没有名称或合同条款，市场仍缺少通常支撑首个商业电力项目的清晰客户证据。
