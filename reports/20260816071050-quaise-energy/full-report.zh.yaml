      - number: '5.3'
        title: 成熟度、路线图与依赖链
        blocks:
          - type: paragraph
            body: >-
              Quaise 显然已经走出纯实验室科学阶段。MITEI 和公司来源显示，项目从早期厘米级工作，推进到花岗岩采石场野外测试、全尺寸 Nabors 集成，以及 2026 年首个 100-meter
              野外里程碑。与此同时，公司在最重要意义上仍处于商业化前：公开证据还没有显示 Quaise 超热井在持续运营中发电或产出工艺热。这个缺口定义了成熟度评级。路线图现在经过 Project Obsidian
              和美国西部试点开发，目标是在本十年末实现首次商业运营。要走到那里，公司依赖一条很长的合作者和基础设施链：Nabors 负责钻机集成和钻井执行，大学和研究伙伴负责岩石-流体与材料理解，土地和 NEPA
              工作需要监管路径，回旋管和设备供应商负责功率放大，最终还需要涡轮机和电站承包商建设地表系统。这条链是优势，因为它复用了现有工业能力；它也是风险，因为每一次交接都可能拖慢或打断商业化。
