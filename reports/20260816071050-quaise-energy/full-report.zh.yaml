      - number: '1.3'
        title: 融资历史、战略投资者与资本结构
        blocks:
          - type: paragraph
            body: >-
              Quaise 的融资轨迹证明了实质进展，也说明这套投资逻辑已经变得高度资本密集。公司从 2022 年 $52 million 扩展 Series A，走到 2024 年 $21 million Series
              A1，将累计资本推高到 $95 million 以上，再到 2026 年 7 月 $134 million Series B 首次交割，把已披露累计融资提高到 $230 million。Prelude
              Ventures 和 Safar Partners 连续多轮跟投，这是投资人信心的正面信号；Mitsubishi、JERA 和 Idemitsu 则说明工业资本越来越愿意支持这一平台。2026
              年这一轮尤其重要，因为它不是普通风险投资跑道，而是更大资本计划中的第一笔股权资金，用来支持 Project Obsidian
              本身，并与项目层面股权和债务并行。这意味着稀释、融资复杂度和施工风险转移仍是故事的活跃组成部分。同样重要的是，没有高质量留存公开证据能证明 2026
              年投后估值。实际结论是，投资人可以核验融资金额和财团质量，却无法确认市场当前用什么价格承接这类风险。
