              Quaise
              已经明显走出纯实验室科学阶段，这确实降低了一部分风险。公司展示了现场钻井、混合钻机架构，以及从常规钻井切换到毫米波破岩的一套具体流程。但运营风险的核心问题，远不止能否在采石场把岩石汽化。公开资料仍指向若干未解的系统级问题：井筒耐久性、流体行为、结垢和堵塞、电子设备、热循环，以及如何把一次钻井里程碑变成可复制的地热发电资产。Quaise
