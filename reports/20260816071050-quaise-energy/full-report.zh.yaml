        - 具名客户合同和电价可见度会显著强化这一判断
      - - 战略投资者和多轮融资验证了公司质量和执行意愿
        - 披露估值或老股交易标记，有助于把质量判断转成价格纪律
      - - 公开证据仍缺估值、股权结构表、收入和电价可见度
        - 完整数据室或监管文件级披露会大幅收窄不确定性
      - - Fervo、Eavor 等同业今天拥有更强的可见运营验证
        - Quaise 可用流量测试、许可和融资里程碑补上部分差距
      - - 没有这些里程碑，就很难证明溢价私募标记合理
        - 如果进入价格显著更低，风险回报仍可能有吸引力
    notes: 投资逻辑看战略市场潜力；反向逻辑看今天缺少可定价证据。
    claimRefs:
      - CV011
      - CV017
      - CV024
      - CV025
      - CV034
      - CV038
      - CV042
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值区间
      - 概率信号
      - 主要风险
    rows:
      - - 乐观
        - 流量测试成功，许可清晰度提高，50 MW 融资完成交割，且至少一个具名交易对手浮出水面
        - $1.6B-$2.4B
        - 25% —— 需要多个里程碑连续落地
        - 相较成熟上市可比公司，商业验证仍有限
      - - 基准
        - 里程碑继续推进，资本支持仍然可信，但商业运营仍未可见
        - $0.9B-$1.4B
        - 50% —— 最符合当前公开证据
        - 没有电价披露，也没有带价格的估值锚点
      - - 悲观
        - 许可或融资滑坡，同业验证差距拉大，客户可见度仍薄弱
        - $0.4B-$0.8B
        - 25% —— 如果时间表右移，则该情景合理
        - 资本稀释和商业化放慢
      - - 解读
        - 区间很宽，因为价格支撑更多取决于未来验证包，而不是当前财务报表
        - 按当前证据加权，中点大约落在低个位数十亿美元，而不是高确定性的溢价标记
        - 跟踪流量测试、融资和具名交易对手
        - 证据单薄时，缺少支撑的名义估值会迅速压缩
    notes: 区间是按证据加权的判断带，不是精确公允价值。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Ormat Technologies
        - 有投资者级披露的上市地热运营商
        - GSR 报告市值 $7.1B；IR 网站显示 1.8 GW 组合
        - 规模和披露层面的最佳上市地热基准
        - 比 Quaise 多元化得多，也更偏运营
      - - Fervo Energy
        - 后期下一代地热开发商
        - $462M Series E；官方公告称 Cape Station 规划 500 MW
        - 显示私募资本愿意支持验证程度更高的地热开发商
        - 仍是私营公司，技术路径也不能直接对比
      - - Eavor / Geretsried
        - 已有商业进展的先进地热同业
        - 公开来源显示首次并网发电和部分商业运营
        - 可作为先进地热执行的验证基准
        - 闭环架构不同，地理位置也不同
      - - Calpine / Constellation 交易
        - 大型基荷平台 M&A 可比交易
        - $26.6B 净购买价；2026 年 EV/EBITDA 为 7.9x
        - 说明多元化可靠电力资产组合可变得多有价值
        - 不是创业公司或前沿技术定价可比对象
      - - Quaise Energy
        - 前沿超热地热开发商
        - 本次保留的公开证据没有披露当前估值
        - 说明里程碑估值是唯一诚实的公开方法
        - 没有公开价格锚点或监管文件级披露
    notes: 这张表用于方向性校准，不要制造虚假的精确感。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-relevant public comparables and reference transactions for Quaise as of
        2026-08-16: a mature public geothermal operator, better-proven advanced-geothermal peers, a large
        baseload-platform M&A reference, and Quaise’s own disclosed financing context. It does not attempt to be
        exhaustive across every global geothermal operator or private climate-tech round because many are not directly
        comparable.
    claimRefs:
