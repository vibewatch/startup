      - number: '7.4'
        title: 监控与终止标准：只有里程碑迅速变成证据，风险才可控
        blocks:
          - type: paragraph
            body: >-
              当前风险图景中积极的一面是，几个最大的未知数都能在未来一到两年内跟踪。投资者不必等十年才知道部分投资逻辑是否跑通。确认井计划、承诺的商业流量测试推进、钻井深度能否大幅超过当前现场里程碑、Obsidian
              公开许可路径的状态，以及公司能否补齐首个项目剩余资本结构，都是可观察检查点。若这些指标按正确顺序推进，Quaise
              的风险画像会迅速改善，因为同一组里程碑会同时压低技术、融资、客户和估值不确定性。若它们停滞，情况相反：每个未解依赖都会开始放大其他依赖。因此，正确的尽调姿态不是要求零风险——那会误解前沿地热的性质——而是坚持明确的终止标准。Quaise
              的投资案中，进度滑坡、资本缺口或许可摩擦都会直接打进投资逻辑，而不是停留在普通运营波动。
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
