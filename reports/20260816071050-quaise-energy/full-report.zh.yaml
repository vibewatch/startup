  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层：今天相关买方很窄，且绑定具体项目
        blocks:
          - type: paragraph
            body: >-
              Quaise
              理论上的潜在客户很广，但当前证据中的客户范围很窄。近期最相关的细分包括需要清洁稳定电力的公用事业或面向电网的实体、能使用现场地热热力或电力的工业运营商，以及可能为现有基础设施再供能的化石资产业主。JERA 和
              Idemitsu 等战略能源公司也重要，因为它们未来可能成为新地理市场中的部署伙伴或准客户。公开记录不支持的是一个多元、广泛的客户基础。Obsidian 暗示 Oregon 面向电网的电力模式，Nevada
              Gold Mines 暗示重工业脱碳路径，再供能叙事则暗示存量资产业主切口。这些细分逻辑一致，但仍是投资逻辑，不是已规模化的装机基础。一个有用的实际筛选标准是：买方是否已经拥有或管理硬基础设施；如果能插入
              24/7 地热热源，而不必新建一个高度依赖输电的完整系统，其经济性是否会显著改善。
