companyProfile:
  summary: >-
    Quaise Energy 是一家总部位于 Houston 的超热地热开发商，2018 年从 MIT 研究中孵化，试图把面向超深井的毫米波钻井商业化。公司并不只卖单一钻具，而是想做可融资的地热电力资产，先从 Oregon 的
    Project Obsidian 和 Nevada Gold Mines 的采矿场景试点切入。它的战略承诺异常大：如果公司能稳定打到 10–20 km
    深度并利用超热岩体，就可能在传统地热地理边界之外，打开高密度稳定清洁电力和存量化石资产再供能机会。公开证据在技术差异化、融资动能和合作伙伴质量上最强；在价格、客户合同、电价和 Quaise 超热地热资产的运营实证上最弱。
  foundedDate: '2018-01-01'
  founders:
    - name: Carlos Araque
      role: 联合创始人兼 CEO
      background: 曾任 Schlumberger 钻井工程师，也在 MIT The Engine 负责商业化，把原始研究推向商业落地。
    - name: Matt Houde
      role: 联合创始人
      background: 曾参与 ARPA-E 与 AltaRock 项目的地热商业化运营，帮助把 MIT 概念变成公司。
  foundingLocation: Cambridge, MA
  headquarters: Houston, TX
  productSummary: Quaise 的产品是一套围绕混合钻井搭建的地热资产交付栈：上部地层用常规钻井，更热、更硬、更深的岩层用毫米波钻井。公司计划靠自持或自开发的地热电力和工业能源项目变现，而不是走简单设备销售模式。
  customerFocus: 公用事业、工业能源用户、存量热资产业主，以及需要稳定无碳电力或热力的偏远场站和矿区。
  businessModel: B2B 基础设施开发商 / 未来独立电力生产商。公开证据中最可信的收入路径，是公司自开发地热项目的长期售电或售热，之后可能叠加存量化石资产再供能和工业场站能源合同。
  stage: Late venture / Series B
  fundingStatus: Quaise 在 2026 年 7 月披露 Series B 首次交割 $134M，至今累计融资 $230M。公开报道还显示，Obsidian 一期 50 MW 仍需要大量额外融资、补助或债务。
