              公开证据没有显示 Quaise 目前有实质经营收入基础。财务故事仍关乎公司要把业务建成什么，而不是已经变现了什么。最可信的未来收入流，是来自 Project Obsidian
              这类公司自开发地热电站的售电。第二条潜在收入线来自工业和场站级项目，Nevada Gold Mines
              是最强的具名非公用事业使用场景。存量资产再供能可能成为另一条变现路径，但公开来源没有说明公司会通过资产所有权、能源销售、项目开发费，还是某种组合来获取价值。清楚的是，Quaise
              不像一家有公开标价的产品公司，更像一家项目公司，收入将来自少数长期合同或自有资产。如果地热表现符合承诺，这种结构最终可以产出耐久、高质量收入；但它也意味着早期收入很可能集中、受里程碑驱动，并且只靠公开信息很难对标。
