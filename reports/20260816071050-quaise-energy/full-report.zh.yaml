      - number: '8.4'
        title: 最终尽调与终止触发条件
        blocks:
          - type: paragraph
            body: >-
              因此，估值工作应以尽调闸门收尾，而不是一个亮眼的单一数字。严肃投资者应索取股权结构瀑布表、最近一次已定价估值标记、任何清算或优先权结构、首期 50 MW
              项目层面的资金来源与用途、当前融资谈判、具名购电方或条款清单、预期电价区间，以及把钻井进展与商业产出连接起来的工程数据。这些请求不是可选项，而是决定 Quaise
              究竟只是前沿科学故事，还是可定价基础设施开发商的缺失证据。主要投资逻辑破裂触发条件也同样具体：流量测试或确认井进展严重滑坡、无法补齐剩余资本结构、可见许可拖累，或相对于 Fervo、Eavor
              等资本更充足同行出现更大的证据缺口。在上述问题清除前，最适合公开发表的判断，是把 Quaise 留在主动观察名单上，并拒绝仅凭公开证据承销溢价估值。
