      - number: '5.4'
        title: 信任、安全与剩余评估缺口
        blocks:
          - type: paragraph
            body: >-
              对一家硬件很重的地热公司来说，“信任”不太关乎数据隐私，更关乎安全、现场控制、监管推进和极端条件下的耐久性。公开证据对分阶段纪律给出正面信号：受控采石场测试、逐步放大、受监测演示、Project Obsidian
              的监管存在，以及外部关于裂缝、堵塞和玻璃化衬层行为的研究，都指向一个严肃工程项目。但公开证据在正式质量体系和商业运营可靠性上仍然偏薄。没有留存公开目录列出 ISO
              类认证、商业正常运行时间、故障率或井寿命统计。OSU 支持的材料工作凸显了这一点：堵塞、矿物生长、玻璃状衬层以及 400–500°C 下的部件行为不是脚注，而是系统耐久性的核心。因此，Quaise
              的产品技术案例很有吸引力，但评估方式仍更像前沿工业系统，而不是已证明的设备平台。最高价值的尽调材料会是工程数据，而不是更多愿景叙事。
