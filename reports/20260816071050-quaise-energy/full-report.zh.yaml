  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：超热稳定能源切口，不是泛地热 TAM
        blocks:
          - type: paragraph
            body: >-
              不应按一个无差别的“所有地热、所有地点”故事给 Quaise 估值。公开证据指向的是一个更窄但更站得住的市场：稳定清洁电力、高温工业热，以及受益于地热 24/7
              小占地运行能力的化石资产再供能。这个边界很重要，因为它把 Quaise 与今天并未真正服务的类别区分开，例如住宅地源热泵、浅层直接供热改造，或没有地热特定买方意图的泛可再生能源采购。EIA
              对现有水热型市场的描述强化了这一区别。今天的地热装机基础依赖天然有利的水热资源、数百华氏度的温度，以及可能只延伸几英里的井。Quaise
              的投资逻辑不同：打开更热岩体，服务更难脱碳的能源任务，并随着时间推移降低地热对地理的束缚。结果是一个比“传统地热电站”更宽、但远比“所有电力和热力”更窄的市场。最合适的描述，是面向需要稳定、高密度、高容量因子能源买方的下一代基础设施市场，尤其适用于已有化石基础设施或工业热需求的地方。
