        blocks:
          - type: paragraph
            body: >-
              核心护城河问题不在于 Quaise
              的物理学是否有趣，而在于地热类别放大后，公司能否守住一个有商业价值的位置。有些环节看起来是自研的：毫米波钻井流程、建模栈，以及让超深岩层去除可重复所需的井下经验诀窍。但交付链的大部分依赖伙伴：钻机、涡轮机、现场执行、电站建设、融资、许可和客户签约。这种依赖限制了赢者通吃。如果地热经济性变得显而易见，油田在位者和资本雄厚的开发商可以进攻周边许多层。Quaise
              的存量资产再供能故事和超高温雄心仍然重要，因为它们可能创造别人无法匹配的差异化买方切口。不过，Canary 和 Latitude
              当前的反向证据也显示，这套逻辑仍高度依赖融资、时间表和缺失的购电数据。正确结论是，Quaise 可能有真实护城河，但今天还没有证明护城河足够耐久。投资人应把它看作差异化竞争者，而不是已经确立的类别赢家。
