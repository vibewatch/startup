      - number: '2.2'
        title: 规模测算视角：已装机市场、政策托底上行空间与工业热需求
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以支撑精确的 Quaise 总可用市场（TAM）、可服务市场（SAM）或可获取市场（SOM），因此本章改用多重规模测算视角。第一重是当前地热基础：NREL 称美国 2024 年有 99 座电站、合计
              3.969 GWe，更广义的全球地热市场包括约 15 GWe 电力，以及可观的直接供热和热泵容量。这说明地热是真实市场，但相对整体能源系统仍然很小。第二重是政策与技术上行空间：DOE 的 Earthshot
              材料把增强型地热定义为战略基础设施，目标是在 2035 年达到 $45/MWh；如果能接入一小部分资源，其供电潜力可覆盖数千万户家庭。第三重是工业热，这是 Quaise
              温度故事最差异化的地方。公司认为，热是全球最大的能源终端用途，工业消耗其中一半，而且大量工业需求位于传统地热难以舒适覆盖的温度带之上。这些视角不能产出一个单一公司收入数字，但能解释为什么投资人会认真看待下一代地热这个大型未来市场。
