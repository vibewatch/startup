      - number: '8.2'
        title: 市场与可比公司背景：品类顺风真实存在，但同行证据在别处更强
        blocks:
          - type: paragraph
            body: >-
              Quaise 最强的正向案例来自目标市场，而不是已经验证的财务画像。DOE 2025 市场报告显示，地热 PPA 在加速，2021 年以来下一代地热吸引了 $1.5 billion
              以上私人资本，企业对稳定清洁电力的需求也在增长。背景解释了为什么严肃投资者持续给地热开发商出资。但同行比较也说明 Quaise 为什么还不能按领导者定价。Ormat
              是成熟上市运营商，拥有多元化地热和储能组合，市值达数十亿美元。Fervo 已完成更大规模后期轮次，并且在 Cape Station 更接近商业交付。Eavor 和 Chubu 能指向 Geretsried
              的部分商业运营和首次上网电，SLB 案例研究则记录了多公里深度的执行。若超热钻井按预期跑通，Quaise
              的上行可能更大；但它的证据堆栈仍比这些同行更薄。可比公司的结论很清楚：上行真实存在，但证据缺口带来的折价也应真实存在。
