  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 价格 / 单位 / 合同模式
      - 包含能力
      - 折扣或未知项
      - 含义
    rows:
      - - Quaise：项目级电力 / 热力 / 承购合同；定价未披露
        - 钻井 + 地热开发 + 再供能主张
        - 没有公开电价或已实现 LCOE 披露
        - 估值不能依赖透明的商业价格证明
      - - Fervo：公用事业 / 企业长期购电协议；项目融资绑定具体场址
        - 储层开发、钻井、电力交付、运营数据叙事
        - 已发布的合同经济性很少
        - 可作为证明维度的同业基准，不适合作为公开价格透明度基准
      - - Eavor：电力和区域供热项目开发
        - 闭环地热系统 + 热力 / 电力输出
        - 区域供热和电力费率条款大多未披露
        - 买方吸引力可能强于公开单位经济透明度
      - - Sage：项目 / 部署模式似乎是定制化
        - 压力地热系统和储能相邻定位
        - 公开包装和价格细节薄
        - 商业可比性仍低
      - - 在位者：公用事业 PPA / 商业售电 / 签约地热输出
        - 已验证运营资产
        - 电价因项目而异，且只部分可见
        - 在位者赢在熟悉度，而不是公开定价
    notes: 缺少价格透明度本身就是竞争事实：公开市场投资人只能比较证明和对手方，而不是价目表。
