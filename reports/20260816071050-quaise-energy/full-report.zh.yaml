  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律链条：主要问题不是敌意，而是路径依赖尚未跑完
        blocks:
          - type: paragraph
            body: >-
              最重要的非技术风险，在于 Quaise 的旗舰商业化路径看起来仍处在多步公共许可流程之中，而不是已经走完流程。Project Obsidian 确实有可见进展；公开证据显示，它已出现在 BLM 的
              National Environmental Policy Act 登记中，同时公司又把 Oregon
              场址描述为进展顺利、但仍与第一口确认井绑定。这一组合很关键：项目不再停留在概念层面，但公开记录还没有显示许可堆栈已经完全放行、环境审查已经完成，或开发路径已经充分去风险。联邦层面对地热的支持能抬升品类势能，却不会缩短土地使用、环境审查、钻井许可和后续电站开发这些场址级步骤。法律态势类似：目前没有保留下来的公开证据显示
              Quaise 面临活跃诉讼或执法，但也没有依据断言其法律敞口很轻。公司核心价值押在自研钻井专有技术、基础设施合作和位于联邦土地的首个商业项目上；在任何诉讼浮出水面之前，法律、许可和合同敏感性就已经存在。
