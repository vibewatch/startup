  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议框架：公开证据能证明公司认真推进，不能证明价格确定
        blocks:
          - type: paragraph
            body: >-
              Quaise
              的估值起点不应是用户提供的“可能已经是独角兽”的标题，而应是现有公开证据。证据确认其融资能力强、有战略投资者、品类势能真实，但没有披露当前估值、已定价老股交易、公开股权结构表，甚至也没有收入、电价、利润率结构或现金跑道这类最基本的承销输入。换句话说，Quaise
              足够有价值，能吸引大额轮次；但透明度不足，无法用后期投资的信心定价。因此，正确建议不是泛泛说公司令人兴奋，而是给出有估值纪律的条件性立场：在公司披露一个能容纳执行风险的价格，或交出足以支撑溢价的里程碑包之前，继续观察或深入研究。最重要原则是，不能把品类稀缺性和技术野心误当成已验证的估值标记。
