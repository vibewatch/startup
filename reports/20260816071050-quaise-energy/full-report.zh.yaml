            body: >-
              应把 Quaise 理解为一家集成型地热开发商，其自研环节恰好是一种新钻井方法。公开来源反复说明这一点：Project Obsidian 是商业项目，Nevada Gold Mines
              是部署使用场景，独立报道还引用管理层说法称，产品不是钻头，而是充足热量和能源。放在客户工作流里，Quaise
              卖的是一种能力：把深埋地下的超热岩体转化为可用电力或工业能源，靠的是项目开发、选址、钻井、地下设计和地表电站配置的组合。这个框架对尽调很重要，因为 Quaise
              的技术不能孤立评估。只有钻井子系统、井设计、许可、土地位置、地表电站和购电全部接上，产品才存在。演示钻机或有前景的实验室结果有帮助，但它本身不是交付产品。交付产品是一项地热资产，能够替代或混合改造传统化石电力和工业能源系统。
