  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Public evidence supports Quaise as a serious late-stage frontier-energy company, but it does not support pricing the company with confidence at an undisclosed unicorn-plus valuation today. The company has disclosed a $134 million 2026 Series B first close and $230 million total funding to date, and the market backdrop for firm geothermal power is strengthening, yet public sources still lack the key inputs needed to defend a precise price: no disclosed valuation mark, no revenue base, no project-level tariffs, no cap-table waterfall, and no commercial operating proof from a Quaise superhot asset. The valuation conclusion is therefore price-sensitive and milestone-sensitive. A disciplined public-market style framework suggests a current evidence-weighted range roughly around the high-hundreds-of-millions to low-billions, with meaningful upside only if Quaise converts its technical milestones into named commercial counterparties, financing closure, and flow-test proof. The recommendation is research-more / track, not buy."
  },
  "sections": [
    {
      "id": "recommendation-framework",
      "title": "Recommendation framework: public evidence supports seriousness, not pricing certainty",
      "body": "The correct valuation starting point for Quaise is not the user-supplied headline that it may already be a unicorn. It is the public evidence that actually exists. That evidence confirms strong fundraising, strategic investors, and real category momentum, but it does not disclose the current valuation, a priced secondary, a public cap table, or even the simplest underwriting inputs such as revenue, tariffs, margin structure, or cash runway. In other words, Quaise is valuable enough to attract large rounds, but not transparent enough to price with late-stage confidence. That is why the right recommendation is not a generic statement that the company is exciting. It is a conditional, valuation-aware stance: track or research more until the company either discloses a price that leaves room for execution risk or produces the milestone package that would justify paying up. The most important principle is to avoid mistaking category scarcity and technical ambition for a validated mark.",
