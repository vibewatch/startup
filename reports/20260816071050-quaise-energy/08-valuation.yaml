    {
      "id": "final-diligence-and-kill-triggers",
      "title": "Final diligence and kill triggers",
      "body": "The valuation work therefore ends with diligence gates, not with a flashy single number. A serious investor should ask for the cap-table waterfall, the most recent priced valuation mark, any liquidation or preference structure, project-level sources and uses for the first 50 MW phase, current financing conversations, named offtakers or term sheets, expected tariff ranges, and the engineering data that link drilling progress to commercial output. Those requests are not optional extras; they are the missing evidence that determines whether Quaise is merely a frontier-science story or a priceable infrastructure developer. The main thesis-break triggers are equally concrete: major slippage in flow-test or confirmation-well progress, failure to close the remaining capital stack, visible permitting drag, or the emergence of a large proof gap relative to better-capitalized peers such as Fervo and Eavor. Until those issues clear, the most publication-ready call is to keep Quaise on the active watchlist and decline to underwrite a premium valuation from public evidence alone.",
