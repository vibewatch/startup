    {
      "id": "scenario-and-entry-discipline",
      "title": "Scenario and entry discipline: underwrite milestones, not mythology",
      "body": "A disciplined scenario framework for Quaise should be built around milestones, not around pretend revenue multiples. The bear case assumes that permitting or financing friction persists, that flow-test and depth-extension evidence stays delayed, and that peers continue to commercialize faster. In that world, Quaise still has technology option value and investor-quality backers, but the range compresses toward the high-hundreds-of-millions. The base case assumes that Obsidian and related field milestones continue progressing, that the first-project capital stack becomes more credible, and that at least one named counterparty or offtake structure becomes visible; that supports a valuation range around the low-billions. The bull case requires a more specific package: visible flow-test success, better permitting clarity, financing closure, and customer or tariff proof that makes the first commercial plant look financeable rather than merely aspirational. Even then, the upside case is not infinite. Public evidence still argues for staged re-rating, not immediate acceptance of an unsupported headline mark.",
