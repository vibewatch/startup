    },
    {
      "id": "durability-and-concentration",
      "title": "Durability, expansion, and concentration: high theoretical stickiness, high present concentration",
      "body": "If Quaise reaches operations, customer durability could be excellent. Utility-scale power plants, industrial retrofits, and long-dated energy contracts are sticky assets, and switching after buildout is difficult. But public evidence does not yet justify claiming actual retention. There are no disclosed renewal rates, satisfaction metrics, expansion rates, or even signed-book counts. What is visible instead is concentration. The public customer story depends on one flagship power project, one named mining pilot, and a small number of strategic energy-company relationships that may or may not convert into deployments. That concentration is not fatal at this stage, but it sharply increases the significance of the first few wins. Japan looks like the clearest future expansion geography, while additional brownfield and industrial sites appear to be the most plausible domestic expansion path.",
      "claimRefs": [
        "CU018",
