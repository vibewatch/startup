    {
      "id": "adoption-trajectory",
      "title": "Adoption trajectory: pipeline signals are real, disclosed customer proof is still sparse",
      "body": "Quaise’s own materials show the right kinds of early commercial signals: the company says it is securing offtake agreements, drilling confirmation wells, and preparing for first commercial flow tests. Those milestones matter because counterparties in infrastructure projects usually want subsurface and execution risk narrowed before signing. Still, public proof remains limited. Nevada Gold Mines is the clearest named direct counterparty, and even that is explicitly a pilot path rather than a production revenue relationship. Obsidian offtakers are not publicly named. Independent sources such as Canary and Latitude therefore remain important because they show the company is still in a pre-conversion stage where financing, flow testing, and customer identity remain open questions. The best description of adoption today is credible pipeline momentum with narrow direct proof. In other words, Quaise is already past the stage of pure abstract interest, but not yet at the stage where investors can point to a signed, diversified book of customers and say commercialization risk has largely cleared.",
      "claimRefs": [
        "CU001",
        "CU002",
