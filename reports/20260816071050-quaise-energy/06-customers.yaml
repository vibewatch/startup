    {
      "id": "proxy-demand-and-final-verdict",
      "title": "Proxy demand is strong enough to matter, but it is still proxy demand",
      "body": "One reason Quaise’s customer story remains investable despite weak direct proof is that the broader geothermal category is visibly winning counterparties. Google’s relationship with Fervo, Chubu’s work with Eavor, and NREL’s summary of next-generation PPAs all show that utilities, corporates, and energy majors are willing to buy geothermal outcomes when projects are real. That matters because it raises the odds that Quaise can eventually convert if its technology and first projects work. But these are still proxy signals. They say more about market openness than about Quaise’s own contract book. For now, customer traction should be scored as weak to moderate: enough to support continued diligence, not enough to declare commercial validation. The next decisive proof would be named Obsidian offtakers, a signed industrial contract beyond pilot stage, or delivered power tied to a paying counterparty. Until that happens, buyers are better viewed as interested but not yet fully converted. Publicly, that matters.",
