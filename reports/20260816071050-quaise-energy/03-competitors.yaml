    {
      "id": "pricing-go-to-market-and-switching-dynamics",
      "title": "Pricing, GTM, and switching dynamics favor proof over marketing",
      "body": "The sector is strikingly opaque on pricing. Most peers publish vision statements, project timelines, and selective LCOE or cost-curve claims, but not standardized rate cards or realized margins. In practice, that means buyers are underwriting proof, counterparties, site quality, and risk transfer rather than choosing among transparent product prices. For utilities and large industrials, competition starts before assets are built: they can compare geothermal developers against one another and against non-geothermal firm-power alternatives while negotiating contracts, financing, and permits. Once a project is selected and built, switching costs become very high, but by then the winning developer has already been chosen. This is why named offtakes and credible partner ecosystems matter more than broad market slogans. Fervo and Eavor currently hold an advantage here because their retained public materials show more visible customer or partner validation. Quaise’s Nabors relationship helps with industrialization, but the public record does not yet prove exclusive channel power or contractual lock-in.",
