  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Quaise’s real competition is the broader next-generation geothermal field plus incumbent geothermal operators and alternative clean-firm solutions, not just “other superhot startups.” Fervo currently leads the retained peer set on commercial proof and disclosed capital, Eavor leads on closed-loop differentiation with partial commercial operation, and Sage offers a credible alternate architecture. Quaise remains the highest-upside technical outlier because millimeter-wave drilling could unlock deeper, hotter resources and fossil-plant repowering, but it still trails the best-funded peers on named counterparties, delivered megawatts, and proof of price. The competitive verdict is therefore asymmetric rather than dominant: unusually differentiated, not yet durably winning."
  },
  "sections": [
    {
      "id": "competitive-landscape",
      "title": "Landscape: the rival set is broader than “other superhot startups”",
      "body": "Quaise is not competing in a narrow novelty category. The real competitive frame includes direct next-generation geothermal developers such as Fervo, Eavor, and Sage; hydrothermal incumbents such as Ormat and Calpine; oilfield-service and drilling companies that can absorb geothermal work; and, at the buyer level, other clean-firm or brownfield-repowering options that satisfy the same job. This matters because different rivals pressure different parts of the thesis. Fervo competes on near-term execution and customer proof. Eavor competes on geologic flexibility and closed-loop risk posture. Sage competes on alternative geothermal-system architecture. Ormat and other incumbents compete on operational credibility and buyer familiarity. Meanwhile, Nabors and SLB remind investors that a large portion of geothermal execution may ultimately be partner-mediated through the oilfield ecosystem. The result is a market where Quaise’s most novel differentiator — millimeter-wave access to superhot depths — sits inside a broader competitive fight over capital, contracting, and commercial proof.",
