      - number: '7.3'
        title: 'Partner, financing, and people risk: dependency is a feature and a vulnerability'
        blocks:
          - type: paragraph
            body: >-
              Quaise’s commercialization model depends on a broad industrial coalition, and that is both one of its
              strengths and one of its clearest vulnerabilities. Nabors lowers rig-integration risk, JERA and Idemitsu
              add strategic credibility, and recent hiring shows that the company is trying to add project and
              operations depth before first commercial delivery. But dependency risk remains high because each of those
              relationships sits on a critical path. If Nabors execution slips, if strategic investors do not continue
              to support future capital formation, or if specialized engineering talent turns over at the wrong moment,
              the impact would not stay isolated inside one function. It would move directly into schedule, financing,
              and customer confidence. Financial risk compounds this dependency. Public sources support $230 million
              raised to date, yet public reporting also says the first 50 MW Obsidian phase still needs another $100
              million of financing and another $100 million of grants or debt. That is enough to show credibility, but
              not enough to say the capital stack is solved. Early customer visibility is also concentrated, with Nevada
              Gold Mines still the clearest named deployment proof.
