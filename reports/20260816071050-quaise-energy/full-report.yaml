      - number: '1.2'
        title: Founders, leadership bench, and governance
        blocks:
          - type: paragraph
            body: >-
              The founder-market-fit story is unusually strong and unusually concentrated. Carlos Araque bridges
              Schlumberger drilling experience with MIT commercialization exposure through The Engine, while Matt Houde
              combines geothermal commercialization work with DOE-linked drilling-program execution. Paul Woskov remains
              central as the originating MIT research figure whose gyrotron concept anchors the scientific narrative,
              even though Quaise itself is the commercialization vehicle. The public leadership bench is also materially
              deeper than a small lab spinout. Kevin Bonebrake gives the company energy-sector capital-markets
              experience at CFO level, Franck Monmont and Henry Phan cover modeling and engineered-system scale-up, and
              Trenton Cladouhos plus Geoffrey Garrison add established geothermal field-development depth that the
              company did not have in its earliest years. Ali Azad’s addition as an independent board director is one of
              the few explicit governance signals available publicly; it suggests management knows first-of-a-kind
              power-project execution and capital formation need independent oversight. The biggest caveat is that
              public disclosures still do not provide a total headcount, leaving outsiders with a visible executive
              roster but an incomplete picture of organizational scale.
