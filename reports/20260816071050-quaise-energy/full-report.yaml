      - number: '3.4'
        title: Moat durability depends on depth access, but pressure will come from capital and partners
        blocks:
          - type: paragraph
            body: >-
              The central moat question is not whether Quaise’s physics are interesting; it is whether the company can
              defend a commercially valuable position once the geothermal category scales. Some pieces look proprietary:
              the millimeter-wave drilling process, the modeling stack, and whatever downhole know-how is required to
              make ultra-deep rock removal repeatable. But much of the delivery chain is partner-dependent: rigs,
              turbines, field execution, power-plant construction, financing, permitting, and customer contracting. That
              dependence limits winner-take-all outcomes. If geothermal economics become obvious, oilfield incumbents
              and well-capitalized developers can attack many of the surrounding layers. Quaise’s brownfield repowering
              story and ultra-high-temperature ambition still matter, because they could create a differentiated buyer
              wedge that others do not match. Yet the current adverse evidence from Canary and Latitude shows how much
              the thesis still depends on financing, timing, and missing offtake data. The right conclusion is that
              Quaise has a potentially real moat, but not a proven durable moat today. Investors should treat it as a
