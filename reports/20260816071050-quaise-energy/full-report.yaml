        title: >-
          Peer profiles: Fervo leads on execution proof, Eavor on closed-loop differentiation, Quaise on upside
          asymmetry
        blocks:
          - type: paragraph
            body: >-
              Among the direct peers, Fervo is the clearest current commercial benchmark. Its retained materials show a
              500 MW Cape Station buildout plan, a large Series E, and named counterparty proof through Google. Eavor
              has less visible megawatt scale than Fervo but stronger evidence than Quaise that a next-generation
              alternative can already cross into commercial operation, and its closed-loop design addresses a different
              buyer concern set from permeability-dependent systems. Sage is an architecture alternative rather than the
              current scale benchmark, but it still matters because it illustrates how many ways the category can evolve
              once capital and customers care. Quaise’s public position is more asymmetric: it may have the largest
              step-change upside if ultra-deep drilling works, but it currently has less commercial proof than Fervo or
              Eavor. Its retained evidence centers on drilling milestones, hybrid-rig integration, and modeling or
              plant-design advances rather than produced power. That makes capability comparisons essential. Quaise is
              strongest on temperature ambition and fossil-plant repowering fit, yet weakest on demonstrated megawatts
              and named offtakers.
