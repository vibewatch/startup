  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: the rival set is broader than “other superhot startups”'
        blocks:
          - type: paragraph
            body: >-
              Quaise is not competing in a narrow novelty category. The real competitive frame includes direct
              next-generation geothermal developers such as Fervo, Eavor, and Sage; hydrothermal incumbents such as
              Ormat and Calpine; oilfield-service and drilling companies that can absorb geothermal work; and, at the
              buyer level, other clean-firm or brownfield-repowering options that satisfy the same job. This matters
              because different rivals pressure different parts of the thesis. Fervo competes on near-term execution and
              customer proof. Eavor competes on geologic flexibility and closed-loop risk posture. Sage competes on
              alternative geothermal-system architecture. Ormat and other incumbents compete on operational credibility
              and buyer familiarity. Meanwhile, Nabors and SLB remind investors that a large portion of geothermal
              execution may ultimately be partner-mediated through the oilfield ecosystem. The result is a market where
              Quaise’s most novel differentiator — millimeter-wave access to superhot depths — sits inside a broader
              competitive fight over capital, contracting, and commercial proof.
            claimRefs:
