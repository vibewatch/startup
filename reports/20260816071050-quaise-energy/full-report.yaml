      - number: '2.5'
        title: Constraints, contradictions, and what still blocks a hard SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              The market story is large, but the bottlenecks are just as visible. Canary shows that even a 50 MW
              first-phase project still needs substantial additional financing beyond equity already raised. Latitude
              frames the core underwriting problem correctly: cheap, abundant heat underground does not matter unless
              the wells can be drilled, completed, activated, and operated at a cost that beats alternatives. NREL’s
              market report reinforces the capital intensity point, while Quaise’s own materials acknowledge that new
              materials, high-temperature electronics, thermal cycling, subsurface characterization, and longer
              deployment cycles are still important constraints. The biggest analytical gap is pricing. Public sources
              do not disclose what power buyers would pay for Project Obsidian, what industrial-heat customers would pay
              per thermal unit, or how much of geological potential can realistically be converted into bankable
              contracted revenue. That is why a rigorous company-level SAM or SOM is still out of reach. The right
              conclusion is not that the market is small; it is that the retained public evidence supports a promising
              multi-lens category, but not a finished underwriting model.
            claimRefs:
              - CM021
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM033
              - CM034
              - CM035
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The best market lens is not one big TAM number
            body: >-
              Public evidence is strongest when the market is triangulated through installed geothermal scale, DOE
              policy support, industrial-heat demand, and emerging next-generation PPAs. A single Quaise TAM would
              overstate what public pricing data can support today.
            calloutType: insight
            claimRefs:
              - CM003
              - CM008
              - CM020
              - CM035
          - type: callout
            title: Market size is not the gating variable
            body: >-
              The bottleneck is commercialization physics and project finance. Even if the addressable heat resource is
              huge, Quaise still must prove it can drill, complete, contract, and finance projects economically enough
              for buyers to adopt at scale.
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
              - CM033
