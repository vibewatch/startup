      - number: '2.4'
        title: 'Adoption drivers: firm-power scarcity, industrial heat, and oilfield leverage'
        blocks:
          - type: paragraph
            body: >-
              Several strong tailwinds are visible in the retained sources. First, geothermal’s grid value is unusually
              clear: DOE’s Office of Geothermal emphasizes around 90% capacity factor, and both Quaise and competitor
              materials repeatedly frame geothermal as clean baseload or dispatchable energy. Second, the policy stack
              is constructive. DOE is explicitly trying to push EGS to $45/MWh by 2035, and NREL’s market report shows
              next-generation PPAs and project commitments are already material rather than hypothetical. Third,
              industrial heat is a genuine adjacent demand pool that many other low-carbon technologies struggle to
              reach directly. Superhot geothermal’s 300–500°C framing aligns more naturally with ammonia, cement,
              refining, and similar process needs than intermittent renewables do. Fourth, Quaise’s commercial framing
              benefits from oil-and-gas workforce and infrastructure reuse. That leverage is not just a cost story; it
              is a speed story, because it gives the category a ready-made contractor base, rigs, and development
              workflows. If Quaise proves the drilling and project recipe, those drivers create a large wedge before the
              technology ever reaches fully global Tier III deployment.
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM012
              - CM019
              - CM023
              - CM024
              - CM025
              - CM032
