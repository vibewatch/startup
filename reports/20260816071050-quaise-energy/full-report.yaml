companyProfile:
  summary: >-
    Quaise Energy is a Houston-based superhot geothermal developer that spun out of MIT research in 2018 to
    commercialize millimeter-wave drilling for ultra-deep wells. Rather than selling a narrow drill tool, the company is
    trying to build financeable geothermal power assets, starting with Project Obsidian in Oregon and a mining-focused
    pilot with Nevada Gold Mines. Its strategic promise is unusually large: if the company can reliably reach 10–20 km
    depths and exploit superhot rock, it could unlock dense firm clean power and brownfield repowering opportunities
    well beyond conventional geothermal’s geographic limits. The public evidence set is strongest on technical
    differentiation, fundraising momentum, and partner quality; it is weakest on price, customer contracts, tariffs, and
    operating proof.
  foundedDate: '2018-01-01'
  founders:
    - name: Carlos Araque
      role: Co-Founder & CEO
      background: >-
        Former Schlumberger drilling engineer and MIT The Engine operator who led commercialization of the original
        research.
    - name: Matt Houde
      role: Co-Founder
      background: >-
        Geothermal commercialization operator tied to ARPA-E and AltaRock programs who helped turn the MIT concept into
        a company.
  foundingLocation: Cambridge, MA
  headquarters: Houston, TX
  productSummary: >-
    Quaise’s product is an integrated geothermal-asset delivery stack built around hybrid drilling: conventional
    drilling for upper formations and millimeter-wave drilling for hotter, harder, deeper rock. The company aims to
    monetize through owned or developed geothermal power and industrial-energy projects rather than through a simple
    equipment-sales model.
  customerFocus: >-
    Utilities, industrial energy users, brownfield thermal-asset owners, and remote or mining sites that need firm
    carbon-free power or heat.
  businessModel: >-
    B2B infrastructure developer / future independent power producer. The most credible public revenue path is long-term
    electricity or heat sales from company-developed geothermal projects, potentially supplemented by brownfield
    repowering and industrial site energy contracts.
  stage: Late venture / Series B
  fundingStatus: >-
    Quaise disclosed a $134M first close of its Series B in July 2026 and $230M total funding to date. Public reporting
    also indicates the first 50 MW Obsidian phase still needs substantial additional financing, grants, or debt.
  disclosureProfile: private-undisclosed
