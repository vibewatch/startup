      - number: '1.4'
        title: Project Obsidian, counterparties, and milestone drift
        blocks:
          - type: paragraph
            body: >-
              Project Obsidian is the central fact around which the whole company now revolves. The project is located
              near Newberry in Central Oregon, where Quaise says the thermal gradient is high enough to reach superhot
              conditions at relatively shallow depths by the standards of the category. Public project materials
              consistently describe a phased buildout: 50 MW first, then 250 MW, with eventual gigawatt ambition if the
              early systems work. The BLM record confirms that the project has already cleared an important interim
              step—a final categorical exclusion and decision record—but also makes clear that drilling permits and
              sundry notices still remain ahead. That nuance matters because the project is both more real and less
              complete than a simple promotional announcement implies. Commercial validation is similarly partial. Named
              public counterparties today are mostly pilots, infrastructure, and strategics: Nevada Gold Mines for an
              industrial decarbonization pilot, Nabors for full-scale rig integration, Oregon State University for
              scientific de-risking, and JERA and Idemitsu for strategic market expansion. The company also says it has
              undisclosed offtake partners tied to first revenues, but the absence of names or contract terms means the
              market still lacks the clean customer proof that would normally anchor a first commercial power project.
