  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation framework: public evidence supports seriousness, not pricing certainty'
        blocks:
          - type: paragraph
            body: >-
              The correct valuation starting point for Quaise is not the user-supplied headline that it may already be a
              unicorn. It is the public evidence that actually exists. That evidence confirms strong fundraising,
              strategic investors, and real category momentum, but it does not disclose the current valuation, a priced
              secondary, a public cap table, or even the simplest underwriting inputs such as revenue, tariffs, margin
              structure, or cash runway. In other words, Quaise is valuable enough to attract large rounds, but not
              transparent enough to price with late-stage confidence. That is why the right recommendation is not a
              generic statement that the company is exciting. It is a conditional, valuation-aware stance: track or
              research more until the company either discloses a price that leaves room for execution risk or produces
              the milestone package that would justify paying up. The most important principle is to avoid mistaking
              category scarcity and technical ambition for a validated mark.
            claimRefs:
