      - number: '1.5'
        title: Technology proof, timeline progress, and what changed since 2022
        blocks:
          - type: paragraph
            body: >-
              The most credible positive shift since Quaise’s early MIT coverage is that the drilling system has
              unmistakably moved beyond a bench-scale concept. MIT’s 2025 write-up says the company drilled a 118-meter
              field hole and demonstrated substantially faster granite-penetration rates than conventional drilling,
              while the July 2026 Series B release says the company drilled more than 100 meters through granite in 2025
              and is approaching a one-kilometer field milestone in Central Texas. The Nabors integration work and
              hybrid-rig demonstration reinforce that the system is being developed in a practical oilfield context
              rather than a laboratory vacuum. Yet the company’s own timeline evolution is the clearest sign that this
              is still a frontier-energy program rather than a de-risked infrastructure rollout. In 2022, MIT coverage
              described ambitions to begin harvesting energy from a pilot well by 2026. By 2026, the company’s own
              flagship-project guidance had shifted to first electrons by 2030. That does not invalidate the underlying
              thesis, but it does show that the commercialization path is longer, more capital-intensive, and more
              uncertainty-laden than the earlier narrative suggested. The company now has enough real-world proof to
              matter, but not yet enough to erase schedule and execution risk.
