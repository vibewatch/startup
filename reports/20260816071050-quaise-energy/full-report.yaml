      - number: '8.2'
        title: 'Market and comparable context: the category tailwind is real, but peer proof is stronger elsewhere'
        blocks:
          - type: paragraph
            body: >-
              The strongest positive case for Quaise comes from the market it is targeting rather than the financial
              profile it has already proven. DOE’s 2025 market report points to accelerating geothermal PPAs, more than
              $1.5 billion of private capital for next-generation geothermal since 2021, and growing corporate demand
              for firm clean power. That backdrop explains why serious investors keep funding geothermal developers. But
              peer comparisons also show why Quaise cannot yet be valued like the leaders. Ormat is a mature public
              operator with a diversified geothermal and storage portfolio and a multi-billion-dollar market
              capitalization. Fervo has raised a much larger late-stage round and is closer to commercial delivery at
              Cape Station. Eavor and Chubu can point to partial commercial operation and first grid power from
              Geretsried, while SLB’s case study documents execution at multi-kilometer depth. Quaise may have more
              upside if superhot drilling works as hoped, but the proof stack is still thinner than those peers. The
              comp lesson is clear: upside is real, but the discount for proof gap should also be real.
            claimRefs:
