  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: a superhot firm-energy wedge, not generic geothermal TAM'
        blocks:
          - type: paragraph
            body: >-
              Quaise should not be valued against an undifferentiated “all geothermal everywhere” story. The public
              evidence points to a narrower but more defensible market: firm clean power, high-temperature industrial
              heat, and fossil-asset repowering that benefit from geothermal’s ability to operate 24/7 with a small
              surface footprint. That boundary matters because it separates Quaise from categories it is not actually
              serving today, such as residential ground-source heat pumps, shallow direct-use heating retrofits, or
              generic renewable procurement with no geothermal-specific buyer intent. EIA’s description of the current
              hydrothermal market reinforces the distinction. Today’s installed geothermal base relies on naturally
              favorable hydrothermal resources, temperatures in the hundreds of Fahrenheit, and wells that may only
              extend a couple of miles. Quaise’s thesis is different: unlock much hotter rock, serve
              harder-to-decarbonize energy jobs, and make geothermal geography less restrictive over time. The result is
              a market that is broader than “conventional geothermal plants” but much narrower than “all electricity and
              heat.” It is best described as a next-generation infrastructure market for buyers who need firm,
              high-density, high-capacity-factor energy, especially where fossil infrastructure or industrial thermal
              demand already exists.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM010
