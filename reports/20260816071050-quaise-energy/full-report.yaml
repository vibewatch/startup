      - number: '7.4'
        title: 'Monitoring and kill criteria: the risks are manageable only if milestones convert into evidence quickly'
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the current risk picture is that several of the biggest unknowns are monitorable
              in the next one to two years. Investors do not need to wait a decade to learn whether parts of the thesis
              are working. The confirmation-well program, the promised commercial flow-test progression, the ability to
              extend drilling depth materially beyond the current field milestone, the status of Obsidian’s public
              permitting path, and the company’s success in closing the remaining first-project capital stack are all
              observable checkpoints. If those indicators move in the right order, Quaise’s risk profile can improve
              sharply because the same milestones would simultaneously reduce technical, financing, customer, and
              valuation uncertainty. If they stall, the opposite happens: each unresolved dependency starts to reinforce
              the others. The right diligence stance is therefore not to demand zero risk, which would miss the nature
              of frontier geothermal, but to insist on explicit kill criteria. This is a company where schedule
              slippage, capital shortfall, or permitting friction would transmit directly into the investment case
              rather than remain a routine operating hiccup.
