      - number: '2.2'
        title: 'Sizing lenses: installed market, policy-backed upside, and industrial-heat need'
        blocks:
          - type: paragraph
            body: >-
              A precise Quaise TAM, SAM, or SOM is not supportable from public evidence, so this chapter uses multiple
              sizing lenses instead. The first lens is the current geothermal base: NREL says the U.S. had 3.969 GWe
              across 99 plants in 2024, and the broader global geothermal market included roughly 15 GWe of electricity
              plus sizable direct-heat and heat-pump capacity. This establishes that geothermal is real but still small
              relative to the broader energy system. The second lens is policy and technical upside: DOE’s Earthshot
              materials frame enhanced geothermal as strategic infrastructure, with a $45/MWh target by 2035 and
              home-powering potential measured in tens of millions if a small fraction of the resource is accessed. The
              third lens is industrial heat, where Quaise’s temperature story is most differentiated. The company argues
              that heat is the largest energy end use globally, that industry consumes half of it, and that a large
              share of industrial demand sits above temperature bands served comfortably by conventional geothermal.
              These lenses do not produce a single company revenue number, but they do show why investors take
              next-generation geothermal seriously as a large future market.
            claimRefs:
              - CM003
              - CM004
