        title: 'Customer segmentation: today’s relevant buyers are narrow and project-specific'
        blocks:
          - type: paragraph
            body: >-
              Quaise’s likely customer universe is broad in theory but narrow in present evidence. The most relevant
              near-term segments are utilities or grid-facing entities that need clean firm power, industrial operators
              that can use on-site geothermal heat or power, and fossil-asset owners that could repower existing
              infrastructure. Strategic energy companies such as JERA and Idemitsu also matter because they may become
              future deployment partners or quasi-customers in new geographies. What the public record does not support
              is a diversified, broad-based customer base today. Obsidian implies a grid-facing power model in Oregon,
              Nevada Gold Mines implies a heavy-industry decarbonization path, and the repowering narrative implies a
              brownfield owner wedge. These segments are coherent, but they remain a thesis rather than a scaled
              installed base. A useful practical filter is whether the buyer already owns or manages hard infrastructure
              whose economics improve materially if a 24/7 geothermal heat source can be inserted without building an
              entirely new transmission-heavy system.
