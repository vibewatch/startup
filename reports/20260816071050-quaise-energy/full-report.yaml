        title: 'Revenue model: visible future streams exist, but current revenue does not'
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not show a meaningful operating revenue base at Quaise today. The financial story is
              still about what the company is building toward rather than what it has already monetized. The most
              credible future revenue stream is electricity sold from company-developed geothermal plants such as
              Project Obsidian. A second potential line comes from industrial and site-level projects, with Nevada Gold
              Mines as the strongest named example of a non-utility use case. Brownfield repowering could become another
              monetization path, but public sources do not clarify whether that would be captured through asset
              ownership, energy sales, project-development fees, or some combination. What is clear is that Quaise does
              not look like a product company with list pricing. It looks like a project company whose revenues will
              come through a small number of long-dated contracts or owned assets. That structure can eventually produce
              durable, high-quality revenue if geothermal performs as promised, but it also means early revenue will
