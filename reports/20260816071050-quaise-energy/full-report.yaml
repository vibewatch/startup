  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product definition: Quaise is building an energy-delivery stack, not a niche drill tool'
        blocks:
          - type: paragraph
            body: >-
              Quaise should be understood as an integrated geothermal developer whose proprietary component happens to
              be a new drilling method. Public sources repeatedly make that clear: Project Obsidian is a commercial
              project, Nevada Gold Mines is a deployment use case, and independent coverage quotes management saying the
              product is not a drill bit but abundant heat and energy. In customer workflow terms, Quaise sells the
              ability to convert deeply buried superhot rock into usable power or industrial energy by combining project
              development, site selection, drilling, subsurface design, and surface-plant configuration. That framing
              matters for diligence because it means Quaise’s technology cannot be underwritten in isolation. The
              product only exists if the drilling subsystem, well design, permitting, land position, surface plant, and
              offtake all connect. A demo rig or a promising lab result helps, but it is not itself the delivered
              product. The delivered product is a geothermal asset capable of replacing or hybridizing legacy fossil
              power and industrial energy systems.
