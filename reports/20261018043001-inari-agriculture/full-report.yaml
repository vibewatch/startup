      - number: '3.3'
        title: Public packaging evidence is thinner than the product and partner narrative
        blocks:
          - type: paragraph
            body: |-
              Public evidence in the assigned pool is much stronger on Inari's platform
              narrative than on transparent commercial packaging. The historical Inari
              press release explains that the company partners with independent seed
              producers, and third-party summaries describe those seed companies as the
              farmer-facing channel, but the retained chapter pool does not provide
              current public list pricing, standard contract structure, or side-by-side
              package detail for Inari versus named rivals. Even the retained
              third-party Crayon case-study URLs now resolve to stale notices rather
              than current implementation detail. For diligence, that means the
              strongest buyer-level comparison today is capability, partner access, and
              distribution structure, not pricing precision or proven multi-homing
              economics.
            claimRefs:
              - CP004
              - CP005
