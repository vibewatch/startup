      - number: '5.2'
        title: Deployment, user workflow, and commercialization path
        blocks:
          - type: paragraph
            body: >-
              Inari's delivery model appears to depend on channel and breeding partners more than on direct farmer
              software adoption. The 2019 Series C announcement said proceeds would expand computational and genomic
              tools while accelerating U.S. commercial introduction of corn and soybean seeds, and the same release said
              Inari works through independent seed producers to introduce varieties tailored to local farming
              challenges. Third-party product summaries extend that picture by describing the farmer-side workflow as
              standard seed use rather than a new operating system: adoption is framed around better seeds, normal
              planting equipment, and no special training. That channel logic is strategically attractive because it
              lowers farm change-management friction, but it also means underwriting depends on partner economics,
              seed-company incentives, and the company's ability to convert breeding progress into tangible field
              outcomes. The independent practitioner signal in the pool reinforces that commercialization is the
              bottleneck: category experts say gene editing is technically faster than legacy breeding, but still
              requires multi-season validation, regional testing, and commercial-scale proof before market adoption
              becomes durable.
            claimRefs:
