        blocks:
          - type: paragraph
            body: >-
              The assigned pool gives only a partial but still useful view of the leadership bench. A third-party August
              2026 company profile lists Lisa Nunez Safarian as CEO and director, Catherine Feuillet as chief scientific
              officer, Rob Dunlop as chief commercial officer, and Ignacio Martinez as board chair and co-founder, while
              founders Rodolphe Barrangou and George Church remain named in the same profile. The same profile also
              points to Ryan Rapp joining the board in May 2026, which suggests active governance refresh. Key-person
              concentration remains material around the CEO, scientific leadership, and partner-led commercialization
              because the assigned public evidence does not provide a complete current org chart or succession detail.
