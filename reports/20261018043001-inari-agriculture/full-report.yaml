      - number: '4.2'
        title: Development cycle implies heavy R&D and working-capital needs
        blocks:
          - type: paragraph
            body: >-
              Inari's operating model looks research-heavy and time-extended. Its platform description says designs are
              generated from genomics and AI, then tested from lab to greenhouse to field before advancing to a
              commercial ready design solution, and the 2019 Series C use-of-funds statement emphasized more investment
              in computational and genomic tools plus crop commercialization. That profile implies continuing spend on
              scientific talent, data, field trials, and partner enablement before the company can recognize enough
              mature product revenue to validate margin structure. Public financing visibility is materially better than
              public operating visibility: the retained tear sheet lists $768M+ raised across nine rounds and a $2.17B
              latest valuation, while the Indiana WARN notice shows a permanent 64-person layoff at the West Lafayette
              facility in early 2026. The layoff may indicate cost discipline or portfolio reprioritization, but the
              public record still does not expose cash on hand, burn, restructuring cost, or runway.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI008
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Valuation history is visible; revenue quality is not yet underwritable
        blocks:
          - type: paragraph
            body: >-
              The current problem is not absence of any financial signal; it is the imbalance between financing signal
              and operating signal. A third-party tear sheet offers a January 2025 post-money valuation and even a
              Latka-sourced 2024 revenue estimate, but it also says EV/Rev is not disclosed for any round and that
              dilution figures are estimated from public round data rather than a public cap table. Inari's own website
              warns that actual financial results may differ materially from projections, and the formerly public Crayon
              case-study URL for Inari now says the page is no longer updated, leaving public customer-economics proof
              stale. Taken together, the evidence supports a verdict of commercialization progress plus ample historical
              financing, but not a clean read on revenue quality, realized pricing, gross margin, customer
              concentration, or near-term capital adequacy.
            claimRefs:
              - CI003
              - CI004
              - CI012
              - CI013
              - CI014
              - CI015
