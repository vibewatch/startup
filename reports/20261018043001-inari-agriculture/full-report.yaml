      - number: '2.3'
        title: Sizing lenses remain evidence-constrained despite investor support
        blocks:
          - type: paragraph
            body: >-
              This pool supports several sizing lenses but not a public dollar TAM/SAM/SOM. One lens is crop scope:
              soybean, corn, and wheat are the only crops consistently disclosed across official and compiled sources. A
              second lens is geography and route to market: Inari said it would accelerate U.S. corn and soybean
              commercialization, while the InterGrain partnership shows a wheat beachhead in Australia through breeder
              field testing. A third lens is investor underwriting: Silicon Valley Invest Club compiles a Jan. 2025
              $2.17 billion valuation and $768 million-plus cumulative funding, which signals large market expectations
              but does not prove present commercial revenue or reachable share. Because no retained source discloses
              pricing, customer count, acreage, or segment-level revenue, the chapter can frame market logic but cannot
              defend a bottoms-up SOM.
            claimRefs:
              - CM004
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM007
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: Adoption drivers are real, but concentration, IP access, and capacity risk slow timing
        blocks:
          - type: paragraph
            body: >-
              The demand-side story is clear in company language: better yield, lower water and nitrogen use, and more
              predictable plant performance are meaningful economic and sustainability hooks for seed channels and
              growers. The supply-side and regulatory frictions are just as important. The Justice Department says the
              U.S. seed industry is highly concentrated and has high barriers to entry, and it links reasonable access
              to patented seeds with the ability of small businesses and new entrants to compete. That is an independent
              reminder that commercialization in seeds depends not only on trait performance but also on IP
              interpretation, channel access, and incumbent structure. The January 2026 WARN notice for 64 permanent
              layoffs in West Lafayette adds execution risk because the retained pool does not show whether those cuts
              reduced technical or commercial capacity in the crops now being field-tested.
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel economics matter more than generic farmer demand
            body: >-
              The strongest adoption evidence sits with seed producers and breeding collaborators, so partner
              concentration, germplasm access, and trial-to-launch conversion deserve more weight than broad agtech
              market rhetoric.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM015
          - type: callout
            title: Industry structure can slow commercialization even if the science works
            body: >-
              Seed-industry concentration, litigation over access to patented seeds, and a 2026 West Lafayette layoff
              all point to execution and access friction that can delay revenue realization even when agronomic claims
              are promising.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
          - type: callout
            title: Underwrite the market with channel metrics, not headline valuation
            body: >-
              Before using the $2.17 billion valuation as a signal of market size, request crop-by-crop pricing, acreage
              under contract, partner concentration, and conversion from field trials to commercial seed volumes.
            calloutType: recommendation
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape mixes seed incumbents, specialty ag-biotech, and status-quo breeding
        blocks:
          - type: paragraph
            body: |-
              Inari is not competing against a single direct software or seed peer; it
              is competing against every path a breeder or grower can use to improve
              corn, soybean, and wheat performance. The retained competitive set spans
              global incumbents with established seed and crop-protection reach,
              specialty ag-biotech companies focused on crop genetics, and the status
              quo of conventional breeding plus internal trait-development workflows
              inside existing seed organizations. That mix matters because Inari's
              differentiation is strongest when the buyer wants crop-specific
              gene-editing depth, but weaker when the buyer values owned distribution, a
              broad catalog, or integrated commercial relationships more than platform
              novelty. The public/private split in the retained evidence also shows an
              asymmetry: Inari remains the specialized private entrant, while several
              named alternatives already operate with public-market scale or
              long-established seed portfolios.
            claimRefs:
              - CP001
              - CP006
              - CP014
