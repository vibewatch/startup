  - id: FM001
    title: Evidence-constrained market narrowing
    type: pyramid
    summary: >-
      The reachable market narrows from broad food-system rhetoric to specific crops, channel partners, and proof gates,
      with no public SOM denominator retained.
    data:
      items:
        - label: Global food-security and sustainability problem
          detail: Top-of-funnel rationale for better seed performance, not a quantified company market.
          note: No retained dollar TAM in the assigned pool.
        - label: Row-crop breeding and seed economics
          detail: Seed-industry consolidation and limited grower choice create the disruption thesis.
          note: Status quo is incumbent breeding and trait-development.
        - label: 'Disclosed crop focus: soybean, corn, wheat'
          detail: Only crops consistently named across retained official and compiled sources.
        - label: 'Immediate counterparties: breeders and seed producers'
          detail: Commercialization runs through independent seed producers and crop-specific collaborators.
        - label: 'Proof gate: field-tested Editing Designs'
          detail: InterGrain is evaluating initial Editing Designs in field testing before broader rollout.
        - label: Unproven public SOM
          detail: No retained pricing, acreage, customer-count, or segment-revenue evidence to quantify reachable share.
    approximationNotes: >-
      This pyramid is qualitative because the assigned pool does not support public TAM/SAM/SOM values; it visualizes
      narrowing market logic rather than inventing quantities.
    claimRefs:
      - CM001
      - CM005
      - CM006
      - CM007
      - CM015
  - id: FP001
    title: 'Competitive positioning: specialization versus distribution control'
    type: quadrant
    summary: |-
      Inari sits in the high-specialization / mid-distribution quadrant: more
      crop gene-editing focused than diversified incumbents, but with less
      owned channel control.
    data:
      xAxis:
        label: Distribution control and farmer-channel reach
        min: 1
        max: 5
        low: Indirect or tooling-led access
        high: Owned seed / distributor reach
        description: Ordinal score synthesized from retained evidence about commercialization ownership and channel breadth.
        scale: 1-5 ordinal
      yAxis:
        label: Genome-editing seed specialization
        min: 1
        max: 5
        low: Adjacent or diversified portfolio
        high: Core crop gene-editing focus
        description: Ordinal score synthesized from retained evidence about how central gene-edited seed design is to each company.
        scale: 1-5 ordinal
      points:
        - label: Inari
          x: 3
          'y': 5
          tone: positive
          note: >-
            Specialized multiplex gene-editing platform with breeder-partner route to market rather than an owned grower
            channel.
          claimRefs:
            - CP001
            - CP003
            - CP005
            - CP008
        - label: Corteva Agriscience
          x: 5
          'y': 4
