  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is partner-led, but public monetization detail is thin
        blocks:
          - type: paragraph
            body: >-
              The public record describes Inari less like a self-serve seed vendor and more like a platform company that
              has to convert scientific progress into partner commercialization. Inari's own 2019 financing announcement
              said the company partners directly with independent seed producers and used the Series C proceeds to
              accelerate U.S. commercialization of corn and soybean seeds, while its 2022 news archive shows repeated
              genetics-access and breeding collaborations rather than disclosed list-priced products. Current platform
              language keeps the same structure: crop designs move through validation and partner field testing before
              they become commercial-ready design solutions, and a current strategy/business-development posting
              explicitly references licensing, joint development agreements, commercial partnerships, revenue
              opportunity, and margin profile. That is enough to say monetization likely flows through bespoke partner
              contracts and downstream seed-channel economics, but not enough to quantify realized pricing, take rates,
              or sales efficiency.
