  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: seed design for broadacre crops, not all agtech spend'
        blocks:
          - type: paragraph
            body: >-
              The strongest market-boundary evidence is narrower than a generic agtech or food-system thesis. Across
              Flagship, Inari, and third-party compiled profiles, the repeatable product focus is soybean, corn, and
              wheat seed design using genomics, AI, and multiplex gene editing. That means the included spend is seed
              genetics, breeding, germplasm access, and commercialization workflows tied to those row-crop programs, not
              the full universe of crop inputs, farm software, biologicals, or downstream grain merchandising.
              Status-quo substitutes are incumbent seed-company breeding programs and conventional trait-development
              cycles. That narrower boundary matters because it makes the market structurally important but prevents an
              unsupported leap from climate or food-security rhetoric to a quantified company-specific TAM.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM007
              - CM009
      - number: '2.2'
        title: Buyer chain runs through breeders and seed partners before growers
        blocks:
          - type: paragraph
            body: >-
              The assigned pool points to a channel-first adoption path. Inari's 2019 financing announcement said the
              company directly partners with independent seed producers, while the current platform page and archive
              snippets show crop-specific collaborations such as InterGrain in wheat and Eden in corn genetics.
              Together, that suggests the immediate buyer and user are breeding organizations, seed producers, and
              genetics-access partners that can move edited designs into local germplasm and field programs. Growers
              appear in the value proposition as end beneficiaries through yield, water, and input-efficiency claims,
              but the retained sources do not show a disclosed direct-to-farmer pricing model. For diligence, this makes
              partner economics, channel concentration, and proof-of-performance milestones more decision-critical than
              headline farmer demand alone.
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM015
