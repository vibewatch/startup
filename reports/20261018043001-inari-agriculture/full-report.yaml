            title: Specialized platform, borrowed channel
            body: |-
              Inari's strongest public differentiation is crop-specific multiplex
              editing across major row crops, but the same sources show it
              commercializes through breeder and seed-company partners instead of a
              fully owned farmer channel.
            calloutType: insight
            claimRefs:
