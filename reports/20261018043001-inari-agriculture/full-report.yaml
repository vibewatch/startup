        title: Exhibits
        blocks:
          - type: callout
            title: Partner-first monetization
            body: >-
              The available evidence suggests Inari monetizes through collaborations, licensing-type structures, and
              seed-channel partners rather than a public list-price model. That can widen distribution without a large
              direct sales footprint, but it also pushes realized pricing and gross-profit visibility into bespoke
              contracts.
            calloutType: insight
            claimRefs:
              - CI007
              - CI010
              - CI016
          - type: callout
            title: Financing signal outpaces operating transparency
            body: >-
              Public materials provide a funding and valuation chronology, but they still do not expose EV/Rev, realized
              pricing, gross margin, burn, runway, or customer concentration. That leaves capital adequacy and revenue
              quality materially underdetermined despite a large historical funding base.
            calloutType: risk
            claimRefs:
