  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a bridge from platform R&D to partner commercialization, but not the contract economics that
      determine realized revenue or gross profit.
    data:
      nodes:
        - id: platform-rd
          label: Platform R&D
          summary: Series C proceeds funded computational and genomic tools
        - id: editing-designs
          label: Editing designs
          summary: Predictive design and multiplex editing generate candidate crop traits
        - id: validation
          label: Lab / greenhouse / field validation
          summary: Data is collected from sequence to phenotype to field
        - id: partner-testing
          label: Partner field testing
          summary: InterGrain is evaluating initial Editing Designs in field testing
        - id: commercial-ready
          label: Commercial-ready design solution
          summary: Designs advance only after validation criteria are met
        - id: monetization
          label: Partner commercialization / revenue
          note: Realized pricing, royalty splits, gross margin, CAC, and payback are not publicly disclosed
      edges:
        - from: platform-rd
          to: editing-designs
          label: Funds scientific tooling
        - from: editing-designs
          to: validation
          label: Generates candidate traits
        - from: validation
          to: partner-testing
          label: Moves into partner programs
        - from: partner-testing
          to: commercial-ready
          label: Must clear field results
        - from: commercial-ready
          to: monetization
          label: Monetizes through contracts and channels
    approximationNotes: >-
      Sequence is sourced from company descriptions of the development/commercialization path; the figure does not imply
      any undisclosed conversion rate or profit level.
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI009
      - CI010
      - CI016
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Inari's public materials describe a six-layer path from biological data inputs to partner-led commercialization.
    data:
      layers:
        - label: Germplasm and crop data inputs
          detail: Sequence, phenotype, and crop-context data start the design loop.
          modules:
            - Genomic data
            - Phenotype observations
            - Crop and variety context
          outputs:
            - Candidate biological targets
        - label: Predictive Design Engine
          detail: Official product page says the platform analyzes data from sequence to phenotype to field and back again.
          modules:
            - Editing Designs
            - Target selection logic
          outputs:
            - What, where, and how to edit
        - label: Gene Editing Toolbox
          detail: Inari says scientists can turn genes on or off, fine-tune expression, and make targeted replacements.
          modules:
            - Multiplex gene edits
            - Expression tuning
            - Targeted replacements
          outputs:
            - Executed crop edits
        - label: Design Blueprints
          detail: Blueprints test edits across crop genetics before a commercial-ready Design Solution advances.
          modules:
            - Crop-variety blueprints
            - Optimization feedback
          outputs:
            - Candidate design solutions
        - label: Validation loop
          detail: Data is collected from labs, greenhouses, and fields and fed back into the platform.
          modules:
            - Lab validation
            - Greenhouse validation
            - Field validation
          outputs:
            - Updated performance evidence
        - label: Partner-led commercialization
          detail: The go-to-market path relies on independent seed producers and standard farm workflows.
          modules:
            - Seed-producer channel
            - Field-testing partners
            - Grower deployment
          outputs:
            - Prospective commercial seed deployment
    approximationNotes: >-
      This is an authored process map based on public descriptions; the company does not publish module-level throughput
      or conversion metrics.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE008
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Inari's visible path runs from internal R&D adoption into partner-led field testing and seed-channel
      commercialization, with key proof gaps at scale and retention.
    data:
      items:
        - label: Internal R&D users onboard
          actor: Inari scientists and engineers
          touchpoints:
            - Researchers across breeding, genetics, data science, and ML use the platform.
            - SoftwareOne says three internal projects ran on the production system.
        - label: Production research platform established
          actor: Inari engineering with SoftwareOne
          touchpoints: From earliest conversations to production, the platform took no more than nine months.
        - label: Named breeding-partner validation
          actor: InterGrain
          touchpoints: InterGrain is evaluating initial Editing Designs in field testing as part of an ongoing partnership.
        - label: Germplasm and channel access broadened
          actor: Eden Enterprise, Stine, Mertec, and M.S. Technologies
          touchpoints: Archived official news snippets show partner-led access to corn and soybean genetics.
        - label: Seed-company customer evaluation
          actor: Seed company customers
          touchpoints: AgFunder says Inari was working with seed company customers in demonstration plots in Jan 2025.
        - label: Scale and durability still unproven
          actor: Commercial and legal stakeholders
          touchpoints:
            - Public sources do not disclose customer counts, renewals, or concentration.
            - The 2026 WARN layoff and the Corteva suit add execution friction around commercialization.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU010
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Commercial conversion and capital access rank as the most acute public-evidence risks because milestones remain
      earlier than the reported valuation implies.
    data:
      columns:
        - label: Likelihood
          note: Public probability based on current milestones and industry conditions.
        - label: Impact
          note: Consequence for commercialization timing, capital access, or valuation support.
        - label: Mitigation maturity
          note: Quality of mitigants already visible in public evidence.
        - label: Residual exposure
          note: Remaining risk after current disclosed mitigants.
      rows:
        - label: Regulatory fragmentation
          note: Multi-jurisdiction oversight across U.S., EU, and China.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: High
              tone: high
        - label: Commercial conversion gap
          note: Public milestones still show trial and field-validation language.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: High
              tone: high
        - label: Partner and channel dependence
          note: Asset-light model depends on outside seed-company and field-testing relationships.
          values:
            - label: Medium-High
              tone: high
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: Medium-High
              tone: high
        - label: Capital access versus valuation support
          note: Funding base is large, but public EV-revenue support is still absent.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Low-Medium
              tone: medium
            - label: High
              tone: high
        - label: Customer ROI pressure
          note: Tight grower economics can slow uptake of novel seed designs.
          values:
            - label: High
              tone: high
            - label: Medium-High
              tone: high
            - label: Medium
              tone: medium
            - label: Medium-High
              tone: high
        - label: Milestone credibility
          note: Forward-looking statements and long validation loops widen execution variance.
          values:
            - label: Medium
              tone: medium
            - label: Medium-High
              tone: high
            - label: Low
              tone: low
            - label: Medium-High
              tone: high
    approximationNotes: >-
      The matrix is an ordinal synthesis from cited public evidence, not a probabilistic model; it ranks relative
      exposure rather than estimating failure odds.
    claimRefs:
      - CR003
      - CR004
      - CR008
      - CR010
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Historical financing and platform ambition are visible, but present-day underwriting still runs through disclosure
      and legal uncertainty.
    data:
      nodes:
        - id: platform-proof
          label: Platform and partner proof
          tone: positive
          summary: Official evidence still emphasizes the AI-enabled platform and crop-specific field validation.
          claimRefs:
