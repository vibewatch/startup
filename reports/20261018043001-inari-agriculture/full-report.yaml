              - CP014
      - number: '3.4'
        title: Incumbent response and regulation remain the main durability checks
        blocks:
          - type: paragraph
            body: |-
              The retained independent and official-refresh sources point to two
              durability checks that matter more than feature checklist competition
              alone. First, regulatory heterogeneity still creates commercialization
              friction for genome-edited crops, especially outside the more
              product-based U.S. path, and that burden falls harder on smaller
              specialists than on diversified incumbents with larger compliance
              capacity. Second, competitor response is not hypothetical: retained
              third-party sources show Corteva pursuing patent and seed-access claims
              against Inari before the dispute later moved to a 2026 settlement
              headline. Together those signals argue that Inari's moat is real in
              technical specialization, but its durability still depends on partner
              execution, freedom to operate, and whether public proof of commercial
              adoption catches up with the technology narrative.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
