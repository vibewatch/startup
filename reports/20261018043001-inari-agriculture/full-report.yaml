      - number: '1.3'
        title: Funding history, partner dependencies, and public scale signals
        blocks:
          - type: paragraph
            body: >-
              The funding record visible in the assigned pool shows a progression from the $89 million Series C
              announced in August 2019 to a third-party compiled January 2025 Series G reference at a $2.17 billion
              valuation and $768 million total capital raised. That supports a well-funded but still private profile,
              not a proven commercial-economics profile. Public scale signals remain materially incomplete: the
              low-reputation August 2026 profile cites a headcount above 300 and references a separate estimate of
              roughly 590 employees, while the January 2026 layoff reporting only sizes the affected West Lafayette
              workforce and explicitly says the company did not disclose total employment. Revenue, ARR, customer count,
              pricing, and gross margin remain unsupported in the assigned evidence and should be treated as diligence
              gaps rather than interpolated metrics.
