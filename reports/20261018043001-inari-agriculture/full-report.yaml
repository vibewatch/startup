            - CV005
        - from: financing-support
          to: terms-opacity
          label: The last round is visible, but the capital-stack detail behind it is not.
          claimRefs:
            - CV007
            - CV008
        - from: financing-support
          to: market-structure
          label: Premium financing still has to survive concentrated-seed-market economics.
          claimRefs:
            - CV004
            - CV009
        - from: terms-opacity
          to: underwriting-gaps
          label: Historic fundraising does not itself prove today's entry price is attractive.
          claimRefs:
            - CV006
            - CV008
            - CV011
        - from: market-structure
          to: underwriting-gaps
          label: Exit and scaling risk stay high when public comparable economics remain thin.
          claimRefs:
