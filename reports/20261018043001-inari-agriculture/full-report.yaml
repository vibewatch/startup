          - type: callout
            title: Incumbent response can come through IP and channel power
            body: |-
              The retained pool shows that large incumbents are not just abstract
              comparables; Corteva already used patent and seed-access litigation, and
              incumbent-owned distribution remains broader than Inari's partner-led
              model.
            calloutType: risk
