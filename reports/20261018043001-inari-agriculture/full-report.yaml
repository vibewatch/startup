  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and architecture
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a concrete platform description rather than a vague agtech brand story.
              Inari's current SEEDesign page says the platform unites machine learning and genomic science across crop
              design, development, and validation, then breaks the workflow into a Predictive Design Engine, a Gene
              Editing Toolbox, and Design Blueprints. That matters because the platform is presented as a closed-loop
              operating system: data moves from sequence to phenotype to field and back again, which is more specific
              than a generic claim that Inari "uses AI." The same official surface also says scientists can turn genes
              on or off, tune expression, and make targeted replacements, while the blueprint layer captures results
              from labs, greenhouses, and fields before a design becomes commercial ready. Public product surfaces and
              third-party company summaries consistently anchor today's crop scope in soybean, corn, and wheat, so the
              company appears to be specializing in a small set of broadacre programs rather than marketing a horizontal
              platform across many crops at once. Field-testing proof is still narrow: the clearest current example is
              wheat, where InterGrain is evaluating initial Editing Designs in field testing.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
