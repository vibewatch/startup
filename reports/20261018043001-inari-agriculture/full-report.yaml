    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Inari presents itself as the SEEDesign company, founded in 2016 and headquartered in Cambridge,
              Massachusetts with additional operations in West Lafayette and Ghent. Across its current materials, the
              company consistently describes a crop-design stack that combines predictive design, genomics, and
              multiplex gene editing rather than a single-point seed trait business. The operating model is also
              partner-led: Inari says collaboration with independent seed companies is core to product design through
              seed sale, and its current solutions page still positions seed-company partners as the route to market for
              the first soybean product.
