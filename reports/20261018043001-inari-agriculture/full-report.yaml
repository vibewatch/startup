      - number: '5.3'
        title: Controls, dependencies, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The main technical-risk signal in the assigned pool is freedom to operate rather than disclosed product
              reliability. Public governance evidence is thin but not absent: Inari's site footer exposes privacy
              notices, a supplier code of conduct, and a data-subject access request route. The pool does not, however,
              disclose crop-trial quality systems, off-target validation, regulatory determinations, seed stewardship,
              recall history, or data-governance controls for genomic and machine-learning inputs. The Department of
              Justice entered the Corteva dispute to stress that access to patented biological material matters for
              follow-on innovation in seeds, while an independent legal analysis says the court denied Inari's motion to
              dismiss and did not treat public repository access as a blanket commercial license. The fetched
              CourtListener snapshot records an April 2024 schedule with deadlines extending into 2025; it does not
              establish the case's status on the 2026 run date. Separately, a January 2026 restructuring permanently cut
              64 employees, about one-third of the West Lafayette workforce tied to product development and
              commercialization, raising a live question about whether validation, regulatory, or partner-support
              capacity changed materially.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Specific architecture, not just agtech branding
            body: >-
              The best evidence in the pool is that Inari can describe its platform in discrete technical layers, with a
              feedback loop from field results back into design work. That supports a real product/technology story even
              though commercialization evidence is thinner than the architecture narrative.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
          - type: callout
            title: Commercial readiness depends on more than faster gene edits
            body: >-
              The evidence suggests Inari's technical cycle may be faster than traditional breeding, but the gating
              factors now look like freedom to operate, multi-season validation, partner adoption, current legal
              disposition, and whether the 2026 restructuring reduced execution capacity in product-development
              functions.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Channel-led commercial model
        blocks:
          - type: paragraph
            body: >-
              The source pool points to a customer model built around seed-industry intermediaries rather than direct
              farmer subscriptions or disclosed retail accounts. Inari said in 2019 that it partnered with independent
              seed producers to introduce locally relevant plant varieties, and AgFunder later reported that the company
              was entering commercialization with seed company customers already using demonstration plots. That
              combination implies a route to market where growers are the end beneficiaries, but seed companies,
              breeders, and channel partners are the near-term commercial counterparties. What is still missing is basic
              scale disclosure: no source in this pool gives customer count, acreage under contract, revenue by partner,
              or which seed companies have moved from evaluation to recurring commercial orders.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU010
              - CU011
      - number: '6.2'
        title: Named proof exists, but mostly at pilot or field-test stage
        blocks:
          - type: paragraph
            body: >-
              The cleanest named proof is InterGrain. Inari's own platform page calls it out in a customer spotlight and
              says InterGrain is evaluating initial Editing Designs in field testing, which is stronger than a logo but
              still below a disclosed scaled production rollout. Older official news listings add channel-development
              evidence through collaborations with Eden Enterprise, Stine-linked corn genetics access, and Mertec/MS
              Technologies for soybeans. Independent reporting adds a second commercialization proof point by stating
              that seed company customers were in demonstration plots in early 2025. Internal adoption is also real: a
              SoftwareOne case study says Inari put a research platform into production within nine months and had
              already run three internal projects through it. That helps explain product readiness and scientist usage,
              but it is not the same thing as external revenue durability.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU012
      - number: '6.3'
        title: Durability and concentration remain the main blind spots
        blocks:
          - type: paragraph
            body: >-
              The chapter's core diligence problem is not whether Inari has any customer activity; it is whether that
              activity is durable, expanding, and diversified enough to underwrite the business. The retained sources do
              not disclose NRR, GRR, churn, renewal timing, contract length, or top-customer concentration, and even a
              third-party company profile compiled in August 2026 focuses on funding and headcount rather than customer
              metrics. Two negative signals raise execution risk around the still-light commercial proof set. First, the
              Indiana WARN filing says 64 West Lafayette employees were part of a permanent mass layoff in early 2026.
              Second, AGDaily's summary of Corteva's lawsuit describes allegations tied to protected seed technology and
              commercial use. Neither event proves customer loss, but both can slow partner trust, product rollout, or
              field-scale adoption until the company shows stronger named production wins and retention evidence.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Best external proof is a named, ongoing field-testing relationship
            body: >-
              InterGrain is the strongest retained customer-proof signal because the current platform page ties the
              partner to live field testing rather than a passive logo or historical announcement.
            calloutType: strength
            claimRefs:
              - CU004
          - type: callout
            title: Durability is still mostly an evidence gap, not a disclosed KPI set
            body: >-
              The retained sources support channel activity and named partnerships, but they do not disclose renewal,
              churn, concentration, or paid deployment depth, so the investment question remains durability rather than
              existence.
            calloutType: risk
            claimRefs:
              - CU009
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The risk stack starts with commercialization conversion and capital dependence. Inari closed a large
              January 2025 round and public compilers cite a $2.17 billion post-money valuation, but the same public
              record still lacks a revenue benchmark and the company's own product timeline describes soy as first
              commercial-ready trials and wheat as partner field testing. That combination means the thesis can still
              work, but only if Inari can move from funded R&D and demonstrations into repeatable seed-company launches
              with measurable customer economics before the next financing cycle forces price discovery. Public evidence
              today still supports patience, not complacency, on that transition.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR010
              - CR012
      - number: '7.2'
        title: Regulatory and operational risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory complexity is meaningful because Inari's crop programs sit inside multiple gene-editing regimes
              rather than one harmonized pathway. MoFo describes U.S. oversight as split across EPA, FDA, and USDA,
              flags Europe's framework as still under active review, and notes China's continued testing and biosafety
              requirements. Operationally, Inari's own platform description shows a long sequence from edit design to
              field validation to a commercial-ready design solution, and its legal disclaimer explicitly warns that
              forecasts and development progress can differ materially from current expectations. The right conclusion
              is not that commercialization fails, but that public evidence still leaves permit timing, attrition, and
              milestone reliability under-documented.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR011
              - CR013
      - number: '7.3'
        title: Dependency and financing risk
        blocks:
          - type: paragraph
            body: >-
              Inari's asset-light model lowers owned-manufacturing burden but shifts risk into outside relationships.
              Company materials say commercialization runs through independent seed producers and seed-company partners,
              while historical pages show recurring germplasm and collaboration announcements and the current wheat
              program still names InterGrain as the field-testing counterparty. At the same time, Seed World describes
              an industry backdrop where growers scrutinize every input decision and seed has to prove value more
              clearly than ever. If partner programs slip or customer ROI is not compelling in tight farm margins, Inari
              could be pushed back toward external financing before public evidence shows durable revenue conversion.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              The risk posture turns materially worse if Inari reaches another financing need before disclosing credible
              revenue conversion, if wheat or soy programs remain in partner-led field validation without signed launch
              evidence, or if management cannot show a crop-by-crop regulatory path across priority jurisdictions.
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR012
          - type: callout
            title: Best visible mitigants are still indirect
            body: >-
              The clearest public mitigants are the January 2025 $144 million round, the asset-light partnership model,
              and continuing InterGrain field work, but each is still a proxy for resilience rather than proof of
              durable customer demand or regulatory clearance.
            calloutType: insight
            claimRefs:
              - CR001
              - CR005
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The investable question is not whether Inari is technically interesting; it is whether the current public
              record justifies paying close to the January 2025 Series G mark today. The retained evidence says the
              company still has a credible technical story and meaningful prior investor support, but it does not yet
              provide the current operating disclosure needed for a buy-style underwriting case. Official pages
              emphasize an AI-enabled SEEDesign platform and active crop programs, while the strongest new adverse item
              in the pool is the September 2026 Corteva settlement, which required Inari to destroy accessed depository
              material, assign IP related to edited Corteva events, and negotiate certain licensing arrangements.
              Against that backdrop, the prudent call is research-more with medium confidence and a stretched valuation
              stance: this is a price-sensitive opportunity that needs updated commercialization evidence, not a
              company-quality score that can be separated from entry terms.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.2'
        title: Financing context versus public price support
        blocks:
          - type: paragraph
            body: >-
              Financing support is easier to verify than price support. The retained August 2026 profile says Inari's
              latest disclosed financing was a $144 million Series G in January 2025 at a $2.17 billion post-money
              valuation, and it compiles total capital raised at $768 million including a $45 million debt round in
              2020. That history shows repeated access to capital and suggests the cap table has already absorbed
              meaningful dilution, but the same profile also says EV/Rev is not disclosed for any round and notes that
              the full shareholder register is not public. In other words, the public record provides round chronology
              and some rough dilution markers, but it does not provide enough on liquidation preferences, ownership
              concentration, secondary activity, or present-day financial performance to prove that a new investor would
              still be buying at an attractive risk-adjusted price.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV011
      - number: '8.3'
        title: Scenarios, comparables, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward to articulate: Inari has continued to present a differentiated
              gene-editing platform, it still highlights crop-specific work in soybean, corn, and wheat, and it can
              point to a long financing history that let it keep building through a difficult agtech cycle. The harder
              part is proving that this technical momentum has already crossed into durable commercial economics.
              Official historical disclosures still frame commercialization around accelerating product introduction and
              partner-led field validation, while the retained public-comp signal from Cibus shows how thin-revenue,
              heavy-loss crop-biotech businesses can remain even in public markets. Combined with the Department of
              Justice's description of the seed industry as highly concentrated with high barriers to entry, that makes
              exit timing and multiple support sensitive to a small set of facts the current public record does not yet
              provide.
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The final diligence burden is therefore concrete. Before upgrading the call, an investor should obtain
              current revenue or acreage conversion data, gross-margin and burn context, customer or channel
              concentration, and the exact economic rights embedded in the January 2025 financing. The same package
              should clarify whether the Corteva settlement has become a manageable licensing cost or a recurring drag
              on product freedom and economics. The thesis breaks if current commercialization turns out to be
              pilot-heavy and revenue-light, if preference overhang leaves little upside for a new entry at or near the
              last round, or if legal and market-structure constraints keep the company from translating platform
              progress into scalable seed-company or farmer demand. A price reset, a structured round with stronger
              downside protection, or hard evidence of recurring commercial conversion could all improve the
              underwriting case materially.
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why the call is not buy
            body: >-
              Inari still looks financable and technically differentiated, but the retained public evidence does not yet
              show enough current commercialization, financing-term, or downside-protection detail to justify
              underwriting a new entry at or near the last disclosed valuation.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV013
