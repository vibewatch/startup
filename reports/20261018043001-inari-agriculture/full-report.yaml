          claimRefs:
            - CP006
            - CP012
            - CP014
        - label: Bayer Crop Science
          x: 5
          'y': 3
          tone: neutral
          note: >-
            Diversified global seed incumbent with broad channel control but less evidence here of single-platform
            gene-editing focus.
          claimRefs:
            - CP006
            - CP014
        - label: Advanta Seeds
          x: 4
          'y': 2
          tone: neutral
          note: >-
            Established seed-breeding footprint from the retained tear sheet, but no retained proof of comparable
            gene-editing specialization.
          claimRefs:
