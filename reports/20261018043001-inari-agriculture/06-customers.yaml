  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: NRR, GRR, churn, renewal timing, contract duration, and satisfaction evidence for seed-company channels.
      whyItMatters: Without durability metrics, the report can show channel activity but cannot judge recurring value or account stickiness.
      diligencePath: Request cohort data, renewal schedules, and customer references from current seed-company counterparties under diligence NDA.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: customer-scale
      missingEvidence: Named production customers, customer count, acreage or bag-volume under contract, and paid deployment milestones by crop.
      whyItMatters: The difference between demo plots and repeat commercial demand drives the underwriting of revenue quality and timing.
      diligencePath: Ask management for a crop-by-crop commercialization dashboard covering customers, plots, acres, launch stage, and booked revenue.
      relatedQuestionRefs: [QU002, QU003]
      relatedTableRefs: [TU002, TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Top-customer exposure, partner dependence by crop, and economics of the independent-seed-producer channel.
      whyItMatters: A channel-led model can look diversified while remaining dependent on a small number of counterparties or geographies.
      diligencePath: Obtain the top-10 customer and partner list with revenue share, contract stage, geography, and cancellation rights.
      relatedQuestionRefs: [QU005]
