slug: inari-agriculture
runDate: 2026-10-18
company:
  name: Inari Agriculture
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Inari Agriculture is a Cambridge-based seed gene-editing company founded in
    2016 that still frames its business around an AI/genomics/multiplex-editing
    platform commercialized through seed-company partners. Public evidence
    supports its January 2025 Series G pricing reference and a multi-crop
    partnership timeline, but current commercialization economics remain
    undisclosed while 2026 layoffs and ongoing Corteva litigation add execution
    and IP risk.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      Inari presents itself as the SEEDesign company, founded in 2016 and
      headquartered in Cambridge, Massachusetts with additional operations in
      West Lafayette and Ghent. Across its current materials, the company
      consistently describes a crop-design stack that combines predictive
      design, genomics, and multiplex gene editing rather than a single-point
      seed trait business. The operating model is also partner-led: Inari says
      collaboration with independent seed companies is core to product design
      through seed sale, and its current solutions page still positions
      seed-company partners as the route to market for the first soybean
      product.
    claimRefs: [CO001, CO002, CO003, CO004, CO009, CO010]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      The assigned pool gives only a partial but still useful view of the
      leadership bench. A third-party August 2026 company profile lists Lisa
      Nunez Safarian as CEO and director, Catherine Feuillet as chief
      scientific officer, Rob Dunlop as chief commercial officer, and Ignacio
      Martinez as board chair and co-founder, while founders Rodolphe Barrangou
      and George Church remain named in the same profile. The same profile also
      points to Ryan Rapp joining the board in May 2026, which suggests active
      governance refresh. Key-person concentration remains material around the
      CEO, scientific leadership, and partner-led commercialization because the
      assigned public evidence does not provide a complete current org chart or
      succession detail.
    claimRefs: [CO007, CO008]
    tableRefs: [TO002]
  - id: capital-partners-and-scale
    title: Funding history, partner dependencies, and public scale signals
    body: >-
      The funding record visible in the assigned pool shows a progression from
      the $89 million Series C announced in August 2019 to a third-party
      compiled January 2025 Series G reference at a $2.17 billion valuation and
      $768 million total capital raised. That supports a well-funded but still
      private profile, not a proven commercial-economics profile. Public scale
      signals remain materially incomplete: the low-reputation August 2026
      profile cites a headcount above 300 and references a separate estimate of
      roughly 590 employees, while the January 2026 layoff reporting only sizes
      the affected West Lafayette workforce and explicitly says the company did
      not disclose total employment. Revenue, ARR, customer count, pricing, and
      gross margin remain unsupported in the assigned evidence and should be
      treated as diligence gaps rather than interpolated metrics.
    claimRefs: [CO005, CO006, CO010, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-current-watchpoints
    title: Milestones and current watchpoints
    body: >-
      The dated record is strong enough to show a real company arc even without
      private operating metrics. Inari moved from formation and 2019 financing
      into 2021-2022 partner milestones that anchor soybean and wheat channel
      development, then reached a larger Series G pricing point in January 2025.
      The refresh evidence also surfaces two current watchpoints that later
      chapters should carry forward: a January 2026 restructuring that hit the
      West Lafayette operation and an active Corteva dispute that was still in
      discovery and motion practice during 2026. Those items do not disprove the
      technical platform, but they do raise questions about execution bandwidth,
      IP freedom to operate, and commercialization timing.
    claimRefs: [CO001, CO005, CO006, CO010, CO011, CO012, CO014, CO015]
    figureRefs: [FO001]
