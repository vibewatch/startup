callouts:
  - calloutType: insight
    title: Partner-led commercialization is core to the story
    body: >-
      Inari's public materials still frame independent seed-company
      collaboration as the route from platform science to farmer delivery,
      which means channel economics and partner concentration are central
      diligence items for the next refresh.
    claimRefs: [CO004, CO009, CO010, CO011]
  - calloutType: risk
    title: The biggest public unknown is still economics, not the science pitch
    body: >-
      The assigned evidence shows repeated funding access and concrete partner
      milestones, but it still does not disclose current revenue, ARR, gross
      margin, pricing, or customer count, and 2026 restructuring plus active
      litigation raise the bar for underwriting execution.
    claimRefs: [CO006, CO012, CO013, CO014, CO015]
