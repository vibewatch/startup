evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-economics
    missingEvidence: Current revenue, ARR, gross margin, pricing, customer count, acreage, and renewal data.
    whyItMatters: >-
      These metrics are necessary to distinguish technical traction from repeatable commercial traction and to benchmark
      the January 2025 pricing reference.
    diligencePath: >-
      Request a current board deck or monthly operating package with booked revenue, ARR, customer/channel
      concentration, and margin detail.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-enumeration
    missingEvidence: Complete current org chart, officer biographies, board roster, committee structure, and succession coverage.
    whyItMatters: >-
      A partial leadership view is enough for orientation but not enough to underwrite execution depth or key-person
      redundancy after restructuring.
    diligencePath: >-
      Request the latest org chart, board materials, and executive biographies, then reconcile them to current public
      disclosures.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: Full cap table, ownership by class, investor rights, debt terms, and complete channel-partner economics.
    whyItMatters: >-
      The visible public record shows who matters but not who controls economics, liquidation outcomes, or commercial
      dependence.
    diligencePath: >-
      Request the cap table, financing documents, debt schedule, and partner-commercial agreements for M.S.
      Technologies, Mertec, and InterGrain.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current company-verified global headcount and site-by-site breakdown after the January 2026 restructuring.
    whyItMatters: >-
      Public sources conflict on workforce scale, and staffing depth is a leading indicator for platform throughput and
      commercialization capacity.
    diligencePath: Request current HR headcount by site and function, plus the before/after impact of the 2026 restructuring.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: tamsam-som
    missingEvidence: >-
      Public TAM, SAM, or SOM estimates tied specifically to soybean, corn, and wheat seed programs reachable through
      Inari's disclosed channels.
    whyItMatters: >-
      Without a real denominator, the market chapter can explain relevance and structure but cannot defend an
      addressable-share underwriting case.
    diligencePath: >-
      Request management's crop-by-crop market model with geography, pricing assumptions, acreage, partner coverage, and
      conversion logic from trials to commercial volumes.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-economics
    missingEvidence: >-
      Named customer counts, acreage under contract, pricing per seed program, revenue by crop or partner, and renewal
      or reorder evidence.
    whyItMatters: >-
      Those metrics determine whether the buyer chain in public sources is translating into scalable commercial demand
      or remains mostly developmental.
    diligencePath: >-
      Obtain partner pipeline, customer cohort, acreage, bag-volume, and pricing data from the data room or management
      interviews.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: capacity-risk
    missingEvidence: >-
      Direct explanation of whether the January 2026 West Lafayette layoff changed Inari's breeding, field-testing, or
      partner-support capacity.
    whyItMatters: >-
      The WARN notice is fresh and adverse, but the retained pool does not show whether the cut was efficiency-driven or
      whether it slowed commercialization for current crop programs.
    diligencePath: >-
      Ask management for post-layoff org charts, site-level headcount by function, and milestones that slipped or stayed
      on schedule after the reduction.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current price sheets, contract structure, revenue-share terms, and grower-facing unit economics for Inari and
      comparable alternatives.
    whyItMatters: Packaging and switching-cost comparisons remain strategic rather than financial without real commercial terms.
    diligencePath: >-
      Request current seed-company agreements, example grower offers, and any public or customer-shared pricing
      schedules.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: stale
    severity: material
    topic: third-party-proof
    missingEvidence: >-
      Current independent case studies, benchmark results, or customer deployment evidence that describe Inari's
      platform in active commercial use.
    whyItMatters: Durable differentiation is harder to underwrite when retained third-party implementation proof has gone stale.
    diligencePath: >-
      Obtain recent partner or customer references, acreage results, or independent technical validation newer than the
      retired Crayon pages.
  - type: private-evidence-only
    severity: material
    topic: litigation
    missingEvidence: >-
      Settlement terms, field-of-use restrictions, licensing obligations, or operational concessions tied to the Corteva
      dispute.
    whyItMatters: >-
      Competitive durability depends on whether the settlement narrowed Inari's freedom to operate or weakened partner
      economics.
    diligencePath: >-
      Request settlement summary materials, board-level legal briefing notes, or counsel-confirmed operating
      constraints.
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Current price cards, royalty schedules, rebate terms, and revenue-recognition rules for seed-partner and licensing
      contracts.
    whyItMatters: >-
      Without contract economics, public commercialization activity cannot be translated into recognized revenue quality
      or gross-profit expectations.
    diligencePath: >-
      Obtain current customer and partner agreements, plus finance policy on milestone, royalty, and seed-sale
      recognition.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway-gross-margin
    missingEvidence: Current cash balance, monthly burn, runway, gross margin by crop or partner program, and working-capital bridge.
    whyItMatters: >-
      Capital adequacy and margin path are central to the investment case but are not disclosed in the retained public
      evidence.
    diligencePath: Request board or lender package, monthly cash bridge, gross-margin build, and 12-month operating plan.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: stale
    severity: material
    topic: customer-proof
