        title: 里程碑与当前观察点
        blocks:
          - type: paragraph
            body: >-
              即使缺少私有运营指标，按日期整理的记录也足以展现一家真实公司的发展轨迹。Inari 从成立和 2019 年融资起步，进入 2021—2022 年由合作伙伴推动的大豆和小麦渠道里程碑，随后在 2025 年 1
              月达到更高的 Series G 定价水平。更新后的证据还凸显出两个后续章节应持续跟踪的当前观察点：2026 年 1 月波及 West Lafayette 业务的重组，以及 2026 年仍处于证据开示和动议程序中的
              Corteva 纠纷。这些事项并不能否定技术平台，但会加大对执行带宽、IP 自由实施权和商业化时点的疑问。
