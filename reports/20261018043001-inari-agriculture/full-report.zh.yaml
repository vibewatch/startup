      - number: '4.2'
        title: 开发周期意味着高研发和营运资金需求
        blocks:
          - type: paragraph
            body: >-
              Inari 的运营模式研发密集、周期较长。平台描述称，设计由基因组学和 AI 生成，然后从实验室到温室再到田间测试，之后才能推进为可商业化的设计解决方案；2019 年 Series C
              资金用途声明也强调继续投入计算和基因组工具及作物商业化。在公司获得足够成熟的产品收入以验证利润结构之前，仍需持续投入科研人才、数据、田间试验和合作伙伴赋能。公开融资信息明显多于公开运营信息：保留的资料表列出九轮融资累计超过
              $768M，最新估值 $2.17B；而 Indiana WARN 通知显示，West Lafayette 设施在 2026 年初永久裁员 64
              人。裁员可能代表成本纪律或产品组合重新排序，但公开记录仍未披露现金储备、烧钱速度、重组成本或资金可支撑期限。
