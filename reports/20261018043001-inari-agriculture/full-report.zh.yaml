  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据展示了从平台研发到合作伙伴商业化的路径，但没有展示决定实际收入或毛利的合同经济性。
    data:
      nodes:
        - id: platform-rd
          label: 平台研发
          summary: Series C proceeds funded computational and genomic tools
        - id: editing-designs
          label: Editing designs
          summary: Predictive design and multiplex editing generate candidate crop traits
        - id: validation
          label: 实验室 / 温室 / 田间验证
          summary: Data is collected from sequence to phenotype to field
        - id: partner-testing
          label: 合作伙伴田间测试
          summary: InterGrain is evaluating initial Editing Designs in field testing
        - id: commercial-ready
          label: 可商业化的设计方案
          summary: Designs advance only after validation criteria are met
        - id: monetization
          label: 合作伙伴商业化 / 收入
          note: 实际定价、版税分成、毛利率、CAC 和回收期均未公开披露
      edges:
        - from: platform-rd
          to: editing-designs
          label: 为科学工具提供资金
        - from: editing-designs
          to: validation
          label: 生成候选性状
        - from: validation
          to: partner-testing
          label: 进入合作伙伴项目
        - from: partner-testing
          to: commercial-ready
          label: 必须通过田间结果验证
        - from: commercial-ready
          to: monetization
          label: 通过合同和渠道变现
    approximationNotes: 该顺序来自公司对开发 / 商业化路径的描述；图示不代表任何未披露的转化率或利润水平。
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI009
      - CI010
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Inari 的公开材料描述了一条从生物数据输入到合作伙伴主导商业化的六层路径。
    data:
      layers:
        - label: 种质与作物数据输入
          detail: 序列、表型和作物背景数据启动设计循环。
          modules:
            - 基因组数据
            - 表型观测
            - 作物与品种背景
          outputs:
            - 候选生物靶点
        - label: 预测设计引擎
          detail: 官方产品页面称，该平台分析从序列到表型、再到田间并返回的数据。
          modules:
            - Editing Designs
            - 靶点选择逻辑
          outputs:
            - 编辑什么、在哪里编辑、如何编辑
        - label: 基因编辑工具箱
          detail: Inari 称，科学家可以打开或关闭基因、微调表达，并进行定向替换。
          modules:
            - 多重基因编辑
            - 表达调控
            - 定向替换
          outputs:
            - 已执行的作物编辑
        - label: 设计蓝图
          detail: 在推进可商业化的 Design Solution 之前，蓝图会在不同作物遗传背景中测试编辑效果。
          modules:
            - 作物品种蓝图
            - 优化反馈
          outputs:
            - 候选设计方案
        - label: 验证循环
          detail: 数据从实验室、温室和田间采集，再反馈回平台。
          modules:
            - 实验室验证
            - 温室验证
            - 田间验证
          outputs:
            - 更新后的表现证据
        - label: 合作伙伴主导的商业化
          detail: 市场进入路径依托独立种子生产商和标准农场工作流。
          modules:
            - 种子生产商渠道
            - 田间测试合作伙伴
            - 种植者部署
          outputs:
            - 潜在的商业种子部署
    approximationNotes: 这是依据公开描述编制的流程图；公司没有发布模块级吞吐量或转化指标。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Inari 的可见路径从内部研发采用，延伸至合作伙伴主导的田间测试和种子渠道商业化；规模与留存方面仍存在关键验证缺口。
    data:
      items:
        - label: 内部研发用户上线
          actor: Inari 科学家和工程师
          touchpoints:
            - 育种、遗传学、数据科学和 ML 团队的研究人员使用该平台。
            - SoftwareOne 称，三个内部项目已在生产系统上运行。
        - label: 生产研究平台建立
          actor: Inari 工程团队与 SoftwareOne
          touchpoints: From earliest conversations to production, the platform took no more than nine months.
        - label: 指定育种合作伙伴验证
          actor: InterGrain
          touchpoints: InterGrain is evaluating initial Editing Designs in field testing as part of an ongoing partnership.
        - label: 种质与渠道触达扩大
          actor: Eden Enterprise、Stine、Mertec 和 M.S. Technologies
          touchpoints: Archived official news snippets show partner-led access to corn and soybean genetics.
        - label: 种子公司客户评估
          actor: 种子公司客户
          touchpoints: AgFunder says Inari was working with seed company customers in demonstration plots in Jan 2025.
        - label: 规模与持久性仍未验证
          actor: 商业与法律利益相关方
          touchpoints:
            - 公开来源未披露客户数量、续约情况或集中度。
            - 2026 年 WARN 裁员和 Corteva 诉讼，为商业化执行增加了阻力。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 商业转化和资本获取是最尖锐的公开证据风险，因为里程碑仍早于报告估值所隐含的阶段。
    data:
      columns:
        - label: 可能性
          note: 根据当前里程碑和行业状况判断的公开概率。
        - label: 影响
          note: 对商业化时间、资本获取或估值支撑的影响。
        - label: 缓释成熟度
          note: 公开证据中已经可见的缓释措施质量。
        - label: 剩余暴露
          note: 当前已披露缓释措施之后的剩余风险。
      rows:
        - label: 监管碎片化
          note: 美国、欧盟和中国的多法域监管。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 商业转化缺口
          note: 公开里程碑仍使用试验和田间验证表述。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 合作伙伴与渠道依赖
          note: 轻资产模式依赖外部种子公司和田间测试关系。
          values:
            - label: 中高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 中高
              tone: high
        - label: 资本获取与估值支撑
          note: 融资基础规模较大，但仍没有公开 EV-收入支撑。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中低
              tone: medium
            - label: 高
              tone: high
        - label: 客户 ROI 压力
          note: 种植者经济性紧张，可能放缓对新型种子设计的采用。
          values:
            - label: 高
              tone: high
            - label: 中高
              tone: high
            - label: 中
              tone: medium
            - label: 中高
              tone: high
        - label: 里程碑可信度
          note: 前瞻性陈述和漫长的验证周期扩大了执行偏差。
          values:
