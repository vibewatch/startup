            - label: 中高
              tone: high
            - label: 低
              tone: low
            - label: 中高
              tone: high
    approximationNotes: 该矩阵是对所引公开证据的序数综合，不是概率模型；它排列相对风险暴露，而非估算失败概率。
    claimRefs:
      - CR003
      - CR004
      - CR008
      - CR010
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 历史融资和平台雄心清晰可见，但当前投资判断仍受披露和法律不确定性制约。
    data:
      nodes:
        - id: platform-proof
          label: 平台与合作伙伴验证
          tone: positive
          summary: Official evidence still emphasizes the AI-enabled platform and crop-specific field validation.
          claimRefs:
            - CV001
            - CV002
            - CV010
        - id: financing-support
          label: 融资支撑
          tone: positive
          summary: The company has raised substantial capital and reached a disclosed $2.17B post-money mark.
          claimRefs:
            - CV005
            - CV006
            - CV007
        - id: terms-opacity
          label: 条款不透明
          tone: risk
          summary: >-
            Public evidence provides only partial visibility into preferences, ownership concentration, and secondary
            activity.
          claimRefs:
            - CV007
            - CV008
            - CV012
        - id: market-structure
          label: 市场结构摩擦
          tone: risk
          summary: Seed-industry concentration and weak public-comp economics raise the bar for commercial proof and exits.
          claimRefs:
            - CV004
            - CV009
        - id: underwriting-gaps
          label: 投资判断缺口
          tone: risk
          summary: Public evidence does not disclose current unit economics, full terms, or enough downside containment.
          claimRefs:
            - CV008
            - CV011
            - CV012
        - id: recommendation
          label: 继续研究 / 估值偏高
          tone: risk
          summary: The call improves only if current commercialization and financing terms become materially clearer.
          claimRefs:
            - CV013
            - CV014
      edges:
        - from: platform-proof
          to: financing-support
          label: 技术潜力有助于解释高溢价融资为何可能实现。
          claimRefs:
            - CV001
            - CV005
        - from: financing-support
          to: terms-opacity
          label: 上一轮融资可见，但其背后的资本结构细节不可见。
          claimRefs:
            - CV007
            - CV008
        - from: financing-support
          to: market-structure
          label: 高溢价融资仍须经受种子市场集中结构经济性的检验。
          claimRefs:
            - CV004
            - CV009
        - from: terms-opacity
          to: underwriting-gaps
          label: 历史融资本身不能证明今天的入场价格有吸引力。
          claimRefs:
            - CV006
            - CV008
            - CV011
        - from: market-structure
          to: underwriting-gaps
          label: 公开可比公司经济性仍薄弱时，退出和规模化风险依然较高。
          claimRefs:
            - CV004
            - CV009
        - from: underwriting-gaps
          to: recommendation
          label: 披露和法律不确定性使投资逻辑仍须通过尽调验证。
          claimRefs:
            - CV003
            - CV004
            - CV012
            - CV013
