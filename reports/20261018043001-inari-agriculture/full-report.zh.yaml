  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：面向大田作物的种子设计，而非全部农业科技支出
        blocks:
          - type: paragraph
            body: >-
              最有力的市场边界证据，比笼统的农业科技或食品体系叙事更窄。在 Flagship、Inari 及第三方汇编的简介中，反复出现的产品重点是运用基因组学、AI
              和多重基因编辑进行大豆、玉米和小麦种子设计。因此，纳入的支出包括与这些行作物项目相关的种子遗传学、育种、种质资源获取和商业化流程，而不是全部作物投入品、农场软件、生物制剂或下游粮食贸易。现状替代方案是现有种子公司的育种项目和传统性状开发周期。这个更窄的边界很重要：它说明市场具有结构性重要性，但也阻止我们从气候或粮食安全叙事直接跳到未经支持的公司特定
              TAM。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM007
              - CM009
      - number: '2.2'
        title: 买方链先经过育种者和种子合作伙伴，再触达种植者
        blocks:
          - type: paragraph
            body: >-
              现有资料指向一条以渠道为先的采用路径。Inari 在 2019 年融资公告中表示，公司直接与独立种子生产商合作；当前平台页面及存档片段还展示了 InterGrain（小麦）和
              Eden（玉米遗传学）等按作物划分的合作。综合来看，直接买方和使用者是育种组织、种子生产商及遗传资源合作伙伴，它们能够把编辑后的设计导入当地种质资源和田间项目。种植者作为最终受益者出现在价值主张中，收益包括产量、水资源和投入效率，但保留下来的来源没有显示直接面向农户的定价模式。因此，尽调应优先看合作伙伴经济性、渠道集中度和性能验证里程碑，而不是只讲农户需求。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM015
      - number: '2.3'
        title: 尽管投资者支持强，规模测算仍受证据限制
        blocks:
          - type: paragraph
            body: >-
              现有资料支持几种规模测算视角，但不支持公开的美元 TAM/SAM/SOM。第一种视角是作物范围：官方及汇编来源持续披露的作物只有大豆、玉米和小麦。第二种视角是地域和上市路径：Inari
              表示将加速美国玉米和大豆商业化，而 InterGrain 合作则通过育种者田间测试，显示出澳大利亚小麦的切入口。第三种视角是投资判断：Silicon Valley Invest Club 汇编了 2025 年 1
              月 $2.17 billion 的估值和超过 $768 million
              的累计融资，这说明市场预期较高，但不能证明当前商业收入或可触达份额。由于没有保留的来源披露定价、客户数、种植面积或分部收入，本章可以描述市场逻辑，却无法支撑自下而上的 SOM。
            claimRefs:
              - CM004
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM007
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: 采用驱动因素真实存在，但集中度、IP 获取和产能风险拖慢时点
        blocks:
          - type: paragraph
            body: >-
              公司语言清楚呈现了需求端逻辑：更高产量、更少用水和氮肥、更可预测的植株表现，对种子渠道和种植者都是有意义的经济及可持续性卖点。供给端和监管摩擦同样重要。美国司法部称美国种子行业高度集中、进入壁垒很高，并将合理获取专利种子与小企业和新进入者的竞争能力联系起来。这一独立提醒说明，种子商业化不仅取决于性状表现，还取决于
              IP 解读、渠道获取和在位者结构。2026 年 1 月 West Lafayette 的 WARN 通知显示永久裁员 64
              人；现有资料没有说明这些削减是否削弱了当前正在田间测试作物的技术或商业能力，因此执行风险上升。
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 渠道经济性比笼统的农户需求更重要
            body: 最强的采用证据来自种子生产商和育种合作方，因此合作伙伴集中度、种质资源获取以及从试验到上市的转化，应比泛泛的农业科技市场叙事获得更高权重。
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM015
          - type: callout
            title: 即使科学有效，行业结构也可能拖慢商业化
            body: 种子行业集中、围绕专利种子获取的诉讼，以及 2026 年 West Lafayette 裁员，都说明执行和获取存在摩擦；即使农艺主张有吸引力，也可能延迟收入兑现。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
          - type: callout
            title: 用渠道指标评估市场，不要只看估值标题
            body: 在把 $2.17 billion 估值当作市场规模信号之前，应要求提供按作物拆分的定价、合同覆盖面积、合作伙伴集中度，以及从田间试验到商业种子销量的转化数据。
            calloutType: recommendation
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局涵盖种子巨头、专业农业生物科技公司和传统育种
        blocks:
          - type: paragraph
            body: >-
              Inari
              面对的不是某一家直接的软件或种子同行，而是育种者或种植者改善玉米、大豆和小麦表现时可以选择的所有路径。现有竞争集合包括拥有成熟种子和作物保护渠道的全球巨头、专注作物遗传学的专业农业生物科技公司，以及现有种子组织内部的传统育种和性状开发流程。这种组合很重要：当买方需要针对具体作物的基因编辑深度时，Inari
              的差异化最强；但当买方更看重自有分销、广泛目录或一体化商业关系，而不是平台新颖性时，其优势就会减弱。现有证据中的公有企业与私有企业分化也呈现出一种不对称：Inari
              仍是专业化的私有新进入者，而多家被点名的替代者已经具备公开市场规模或长期积累的种子产品组合。
            claimRefs:
              - CP001
              - CP006
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
