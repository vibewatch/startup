      - number: '4.3'
        title: 估值历史可见，但收入质量尚不足以纳入投资判断
        blocks:
          - type: paragraph
            body: >-
              当前问题不是完全没有财务信号，而是融资信号与运营信号之间失衡。第三方资料表提供了 2025 年 1 月投后估值，甚至给出 Latka 来源的 2024 年收入估算；但它同时称任何一轮融资都未披露
              EV/Rev，稀释数据也是根据公开融资数据估算，而非来自公开股权结构表。Inari 自己的网站警告，实际财务结果可能与预测存在重大差异；此前公开的 Crayon Inari
              案例研究链接现在也称页面不再更新，使公开客户经济性证据停留在过时状态。综合来看，证据支持“商业化有所推进且历史融资充足”的判断，但无法清晰判断收入质量、实际定价、毛利率、客户集中度或近期资本充足性。
            claimRefs:
              - CI003
              - CI004
              - CI012
              - CI013
              - CI014
              - CI015
