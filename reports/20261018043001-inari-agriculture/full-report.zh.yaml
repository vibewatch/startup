            body: 现有证据表明，Inari 通过合作、类似许可的结构和种子渠道合作伙伴变现，而不是采用公开标价模式。这能在不建立庞大直销团队的情况下扩大分销，但也会让实际定价和毛利透明度隐藏在定制合同中。
