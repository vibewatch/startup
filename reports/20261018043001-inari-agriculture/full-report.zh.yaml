chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Inari 将自己定位为 SEEDesign 公司，2016 年成立，总部位于 Massachusetts 州 Cambridge，并在 West Lafayette 和 Ghent
              设有其他运营点。在现有材料中，公司始终将自身描述为一个结合预测设计、基因组学和多重基因编辑的作物设计平台，而非只做单一种子性状的业务。运营模式同样由合作伙伴主导：Inari
              表示，与独立种子公司的合作贯穿从产品设计到种子销售的全过程；其当前解决方案页面仍把种子公司合作伙伴定位为首个大豆产品的上市渠道。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO012
              - CO013
      - number: '1.2'
        title: 管理层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              现有资料只能勾勒出一幅不完整、但仍有参考价值的管理层图景。第三方 2026 年 8 月公司简介列出 Lisa Nunez Safarian 为 CEO 兼董事、Catherine Feuillet
              为首席科学官、Rob Dunlop 为首席商务官、Ignacio Martinez 为董事长兼联合创始人；创始人 Rodolphe Barrangou 和 George Church
              也出现在同一简介中。该简介还提到 Ryan Rapp 于 2026 年 5
              月加入董事会，显示治理层正在调整。由于现有公开证据没有提供完整的当前组织架构或继任安排，CEO、科学负责人和合作伙伴主导的商业化仍存在明显的关键人物集中风险。
            claimRefs:
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO007
              - CO008
      - number: '1.3'
        title: 融资历史、合作伙伴依赖与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              现有资料中的融资记录显示，公司从 2019 年 8 月宣布的 $89 million Series C，发展到第三方汇编的 2025 年 1 月 Series G 参考数据：估值 $2.17
              billion，累计融资 $768 million。这说明公司资金充足但仍是私有企业，并不等于商业经济性已经得到验证。公开规模信号仍明显不完整：低信誉度的 2026 年 8 月简介称员工数超过 300
              人，并引用另一份约 590 人的估算；而 2026 年 1 月的裁员报道只说明 West Lafayette
              受影响员工规模，并明确称公司未披露总员工数。现有证据不支持收入、ARR、客户数、定价和毛利率，应将其视为尽调缺口，而不是自行插值。
            claimRefs:
              - CO005
