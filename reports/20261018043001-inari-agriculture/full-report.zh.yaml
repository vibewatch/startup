  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与架构
        blocks:
          - type: paragraph
            body: >-
              现有证据支持一套具体的平台描述，而不是笼统的农业科技品牌故事。Inari 当前的 SEEDesign
              页面称，平台将机器学习与基因组科学结合，覆盖作物设计、开发和验证，并把流程拆成预测设计引擎、基因编辑工具箱和设计蓝图。这很关键，因为平台呈现的是一个闭环操作系统：数据从序列流向表型，再到田间并返回，而不只是泛泛声称
              Inari“使用
              AI”。同一官方页面还称，科学家可以打开或关闭基因、调整表达并进行定向替换；蓝图层则在设计成为可商业化方案前，记录实验室、温室和田间结果。公开产品页面和第三方公司摘要都将当前作物范围锁定在大豆、玉米和小麦，因此公司似乎是在专注一小组大田作物项目，而不是同时面向多种作物营销横向平台。田间测试证据仍然有限：最清晰的当前案例是小麦，InterGrain
              正在对初始 Editing Designs 进行田间测试。
