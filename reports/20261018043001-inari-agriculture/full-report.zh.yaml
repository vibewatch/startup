  - id: TV003
    title: 乐观情景 / 基准情景 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 平台验证转化为可见的商业采用，许可后果仍可控，且下一轮融资或退出证明 2025 年 1 月的价格只是阶段性节点，而非峰值。
        - 上行空间来自证明：高端农业生物科技平台可以取得优于低收入上市可比公司的经济性。
        - 需要披露商业化指标，而不只是技术里程碑。
        - 若无法展示客户转化或种植面积规模，乐观情景就会沦为空想。
      - - 基准
        - Inari 继续推进平台和合作伙伴项目，但公开运营披露仍然有限，融资条款也不透明。
        - 公司值得继续关注，但价格逻辑仍然偏紧，因为投资判断更多依赖过往融资，而不是当前经济性。
        - 与当前留存证据最匹配。
        - 平价或由内部人主导的后续融资会进一步巩固这一停滞状态。
      - - 悲观
        - 商业化仍以试点为主，和解或许可路径拖累经济性，种子市场的集中结构也限制退出选择。
        - 在有意义的收入规模出现前，接近上一轮价格入场的新投资人面临估值倍数压缩或优先权劣后的风险。
        - 法律环境不利、披露存在缺口，以及不完美上市可比公司的疲弱收入表现，共同支撑这一判断。
        - 任何下调轮、结构化重组或合作伙伴转化停滞的证据，都会验证下行情景。
    notes: 仅为定性情景；留存来源池未披露当前收入、ARR 或利润率输入，无法建立精确模型。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV011
      - CV013
      - CV014
