          - type: callout
            title: 当前可见的最佳缓释因素仍是间接证据
            body: 最清晰的公开缓释因素是 2025 年 1 月的 $144 million 融资、轻资产合作伙伴模式和持续进行的 InterGrain 田间工作，但每一项都只是韧性的代理信号，并不能证明持久的客户需求或监管批准。
            calloutType: insight
            claimRefs:
              - CR001
              - CR005
              - CR006
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              可投资问题不是 Inari 是否在技术上有吸引力，而是当前公开记录是否足以支持今天接近 2025 年 1 月 Series G
              价格水平买入。保留的证据表明，公司仍有可信的技术故事，也获得过重要的投资者支持，但尚未提供买入式投资判断所需的当前运营披露。官方页面强调 AI 驱动的 SEEDesign
              平台和活跃的作物项目，而资料池中最新、最不利的事项是 2026 年 9 月的 Corteva 和解：该和解要求 Inari 销毁获取的存储库材料、转让与编辑后 Corteva 事件有关的
              IP，并协商某些许可安排。在这一背景下，谨慎判断是继续研究，信心中等，估值偏高：这是一个对价格敏感的机会，需要更新后的商业化证据，而不是可以脱离入场条款单独评分的公司质量。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.2'
        title: 融资背景与公开价格支撑
        blocks:
          - type: paragraph
            body: >-
              融资支持比价格支撑更容易验证。保留的 2026 年 8 月简介称，Inari 最近一次披露的融资是 2025 年 1 月 $144 million 的 Series G，投后估值 $2.17
              billion；该简介汇总的累计融资为 $768 million，其中包括 2020 年 $45 million
              的债务轮。这段历史说明公司反复获得资本，也暗示股权结构表已经吸收了相当程度的稀释；但同一简介还称任何一轮融资都没有披露
              EV/Rev，完整股东名册也不公开。换言之，公开记录提供了融资轮次时间线和一些粗略稀释线索，却不足以通过清算优先权、所有权集中度、二级交易活动或当前财务表现，证明新投资者仍能以具有吸引力的风险调整价格买入。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV011
      - number: '8.3'
        title: 情景、可比公司与退出准备度
        blocks:
          - type: paragraph
            body: >-
              乐观情景很容易概括：Inari
              持续展示差异化的基因编辑平台，仍突出大豆、玉米和小麦的作物专项工作，也可以依靠长期融资历史说明自己得以在艰难的农业科技周期中继续建设。更难的是证明，这股技术动能已经转化为持久的商业经济性。官方历史披露仍将商业化描述为加速产品推出和合作伙伴主导的田间验证，而保留的公开市场信号（以
              Cibus 为例）则显示，低收入、高亏损的作物生物科技企业即使进入公开市场也可能长期存在。再加上司法部称种子行业高度集中且进入壁垒很高，退出时点和估值倍数支撑就会对少数几个当前公开记录尚未提供的事实高度敏感。
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              因此，最后的尽调负担很具体。在上调判断之前，投资者应取得当前收入或面积转化数据、毛利率和烧钱背景、客户或渠道集中度，以及 2025 年 1 月融资中包含的确切经济权利。同一资料包还应说明 Corteva
              和解究竟会成为可管理的许可成本，还是持续拖累产品自由度和经济性。如果当前商业化结果以试点为主、收入很少，如果优先权悬置使得在上一轮或接近上一轮价格进入的上行空间所剩无几，或者如果法律和市场结构约束使公司无法把平台进展转化为可扩张的种子公司或农户需求，投资逻辑就会失效。价格重置、带有更强下行保护的结构化融资，或关于持续商业转化的硬证据，都可能显著改善投资判断。
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 为什么不是买入
            body: Inari 看起来仍有融资能力且技术差异化明显，但保留的公开证据尚未提供足够的当前商业化、融资条款或下行保护细节，不足以支持在最近一次披露估值附近为新投资建仓。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV013
