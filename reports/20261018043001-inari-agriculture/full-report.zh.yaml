      - number: '3.2'
        title: 差异化来自技术深度和种质资源获取，而非自有渠道控制
        blocks:
          - type: paragraph
            body: >-
              保留下来的官方材料支持一条清晰的技术叙事：Inari
              将预测设计、多重编辑工具箱和覆盖玉米、大豆及小麦的规模化田间验证闭环结合起来。这使公司比多元化巨头或相邻生物学平台更专业。但同一批来源也显示，商业化是有意间接进行的。Inari
              的上市路径依赖育种者和种子公司合作伙伴，包括小麦领域的 InterGrain，以及早期与 Stine
              相关的玉米和大豆遗传资源获取安排，而不是自有的种植者销售团队。种质资源获取重要时，这种合作伙伴模式可能形成护城河；但它也意味着转换成本和分销持久性由交易对手共同承担，而非完全由 Inari 控制。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP007
              - CP008
              - CP013
              - CP014
      - number: '3.3'
        title: 公开包装证据弱于产品和合作伙伴叙事
        blocks:
          - type: paragraph
            body: >-
              现有资料对 Inari 平台叙事的支持，远强于对透明商业包装的支持。Inari 的历史新闻稿解释，公司与独立种子生产商合作；第三方摘要则将这些种子公司描述为面向农户的渠道，但保留的章节资料没有提供 Inari
              与指定竞争者的当前公开价目表、标准合同结构或并列产品包装细节。即使是保留的第三方 Crayon
              案例研究链接，如今也只指向过时通知，不再提供当前实施细节。因此，在尽调中，当前最有价值的买方层面比较是能力、合作伙伴获取和分销结构，而不是精确的定价或已验证的多平台使用经济性。
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP014
      - number: '3.4'
        title: 在位者反应和监管仍是持久性的主要检验
        blocks:
          - type: paragraph
            body: >-
              保留的独立来源和官方更新来源指出，两项持久性检验比单纯的功能清单竞争更重要。第一，基因编辑作物的监管异质性仍会造成商业化摩擦，尤其是在产品监管路径更复杂的美国以外地区；相比拥有更强合规能力的多元化巨头，这种负担对小型专业公司更重。第二，竞争者反应并非假设：保留的第三方来源显示，Corteva
              曾在争议后来进入 2026 年和解消息之前，就专利和种子获取向 Inari 提出主张。综合这些信号，Inari
              在技术专业化上确有护城河，但其持久性仍取决于合作伙伴执行、自由实施权，以及商业采用的公开证明能否赶上技术叙事。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 专业化平台，借用的渠道
            body: Inari 最强的公开差异化，是覆盖主要行作物的按作物划分的多重编辑能力；但同一批来源也显示，公司通过育种者和种子公司合作伙伴商业化，而非拥有完整的农户渠道。
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP008
          - type: callout
            title: 在位者可以通过 IP 和渠道力量反击
            body: 现有资料表明，大型在位者并不只是抽象的可比对象；Corteva 已经使用专利和种子获取诉讼，而在位者自有的分销网络仍比 Inari 的合作伙伴模式更广。
            calloutType: risk
            claimRefs:
              - CP012
