        title: 展示项
        blocks:
          - type: callout
            title: 合作伙伴主导的商业化是核心逻辑
            body: Inari 的公开材料仍把与独立种子公司的合作描述为从平台科学走向农户交付的路径，因此渠道经济性和合作伙伴集中度是下一轮更新的核心尽调项目。
            calloutType: insight
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO011
          - type: callout
            title: 最大的公开未知数仍是经济性，而不是科学叙事
            body: 现有证据显示公司持续获得融资并取得具体合作伙伴里程碑，但仍未披露当前收入、ARR、毛利率、定价或客户数；2026 年重组和持续诉讼也提高了评估执行力的门槛。
            calloutType: risk
            claimRefs:
              - CO006
