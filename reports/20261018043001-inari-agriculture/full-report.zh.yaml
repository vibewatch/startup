  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式由合作伙伴主导，但公开变现细节有限
        blocks:
          - type: paragraph
            body: >-
              公开记录将 Inari 描述得不像自助式种子供应商，更像一家必须把科学进展转化为合作伙伴商业化的平台代理公司。Inari 自己在 2019 年融资公告中表示，公司直接与独立种子生产商合作，并用 Series C
              资金加速美国玉米和大豆种子的商业化；其 2022
              年新闻存档也展示了反复出现的遗传资源获取和育种合作，而不是公开标价的产品。当前平台表述仍保持同一结构：作物设计先经过验证和合作伙伴田间测试，再成为可商业化的设计解决方案；一则当前战略/业务开发招聘信息还明确提到许可、联合开发协议、商业合作、收入机会和利润率。这足以说明变现很可能来自定制化合作伙伴合同和下游种子渠道经济性，但不足以量化实际定价、抽成率或销售效率。
