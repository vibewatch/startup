      - number: '5.3'
        title: 控制、依赖与技术风险
        blocks:
          - type: paragraph
            body: >-
              现有资料中的主要技术风险信号，是自由实施权，而不是已披露的产品可靠性。公开治理证据有限但并非不存在：Inari
              网站页脚列出隐私通知、供应商行为准则以及数据主体访问请求渠道。然而，资料没有披露作物试验质量体系、脱靶验证、监管认定、种子 stewardship、召回历史，或基因组和机器学习输入的数据治理控制。司法部介入
              Corteva 纠纷时强调，获取专利生物材料对种子领域后续创新很重要；独立法律分析则称，法院驳回了 Inari 的驳回动议，并未把公开存储库访问视为一项普遍的商业许可。抓取的 CourtListener
              快照记录了 2024 年 4 月的时间表，截止日期延伸至 2025 年，但不能证明该案件在 2026 年运行日的状态。除此之外，2026 年 1 月的重组永久削减 64 个岗位，约占与产品开发和商业化相关的
              West Lafayette 员工的三分之一，这使验证、监管或合作伙伴支持能力是否发生重大变化成为一个现实问题。
