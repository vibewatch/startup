callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      The risk posture turns materially worse if Inari reaches another financing need before disclosing credible revenue conversion,
      if wheat or soy programs remain in partner-led field validation without signed launch evidence, or if management cannot show a
      crop-by-crop regulatory path across priority jurisdictions.
    claimRefs: [CR003, CR005, CR008, CR012]
  - calloutType: insight
    title: Best visible mitigants are still indirect
    body: >-
      The clearest public mitigants are the January 2025 $144 million round, the asset-light partnership model, and continuing
      InterGrain field work, but each is still a proxy for resilience rather than proof of durable customer demand or regulatory clearance.
    claimRefs: [CR001, CR005, CR006]
