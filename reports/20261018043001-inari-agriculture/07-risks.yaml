    title: Regulatory / legal risk register
    columns:
      - Rule / case
      - Jurisdiction
      - Current public status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Coordinated Framework oversight
        - United States
        - MoFo says oversight remains split across EPA, FDA, and USDA based on product characteristics and use.
        - Medium
        - High
        - Existing U.S. agencies already handle gene-edited crops, so the path is knowable even if multi-agency.
        - High
        - Request program-by-program APHIS, FDA, and EPA consultation and permit history.
      - - New genomic techniques proposal
        - European Union
        - MoFo says the proposed regime is still moving toward the European Parliament rather than already settled law.
        - Medium
        - High
        - Inari already has a Ghent R&D site that can support regional regulatory preparation.
        - High
        - Obtain EU market-entry plan, regulatory opinions, and any crop-specific commercialization sequencing.
      - - Testing and biosafety certificate requirements
        - China
        - MoFo says some gene-edited crops without foreign DNA still require testing and a biosafety certificate.
        - Medium
        - Medium
        - China offers a defined, if not frictionless, pathway for some gene-edited crops.
        - Medium-High
        - Ask management which crops, if any, target China and who owns local filing responsibility.
      - - Plant variety versus patent protection boundary
        - China / global IP
        - MoFo says China clarified that plant varieties are not patentable and may need plant variety rights protection instead.
        - Low-Medium
        - Medium
        - Layer patent, plant variety rights, and contract protections by crop and geography.
        - Medium
        - Review freedom-to-operate and variety-right coverage for soy, corn, and wheat programs.
    notes: >-
      Public sources show framework-level obligations, not crop-by-crop permit files or litigation dockets; severity ranks
      reflect commercialization exposure rather than proof of a current enforcement action.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial enumeration of the public regulatory and legal frameworks explicitly surfaced in the assigned risk pool for
        Inari's gene-edited crop programs and international market-entry path.
    claimRefs: [CR008, CR009, CR011]
