    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Field-to-commercial conversion
        - About page says the first commercial-ready soy design solution was trialed in summer 2025 while the platform page says wheat designs remain in field testing.
        - High
        - High
        - Medium
        - High
        - Public evidence still lacks signed launch volumes, repeat orders, or recurring revenue conversion by crop.
      - - Multi-stage validation reliability
        - Platform description depends on data flowing from sequence to phenotype to field and back again before a design becomes commercial ready.
        - Medium
        - High
        - Medium
        - Medium-High
        - Need stage-gate attrition, cycle-time, and failed-design statistics to quantify the bottleneck.
      - - Forecast slippage
        - Inari's own website disclaimer says projections involve known and unknown risks and actual results may differ materially.
        - Medium
        - Medium-High
        - Low
        - Medium-High
        - Need planned-versus-actual milestone history for funding, launch, and partner timelines.
      - - Customer ROI pressure
        - Seed World says growers are scrutinizing every input decision and seed has to prove value more clearly than ever.
        - High
        - Medium-High
        - Medium
        - Medium-High
        - Need pricing, yield uplift, and payback data versus incumbent seed alternatives.
    notes: >-
      This register ranks operational exposure from public milestones and industry conditions; it does not imply a disclosed cyber,
      safety, or product-failure incident.
    claimRefs: [CR004, CR005, CR010, CR011, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / market
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Seed-company distribution route
        - Independent seed producers / seed companies
        - Commercial introduction and farmer reach
        - Company says it partners with independent seed producers, but public sources do not disclose channel concentration.
        - A major partner delays launch, deprioritizes Inari designs, or limits acreage rollout.
        - High
        - Asset-light structure reduces owned distribution capex and leaves room for multiple partners.
        - High
      - - Germplasm access collaborations
        - Eden Enterprise and prior germplasm collaborators
        - Access to corn genetics and breeding inputs
        - Historical company pages show repeated collaboration and access announcements rather than owned, disclosed germplasm control.
        - Access narrows or expires, slowing trait deployment or making economics less attractive.
        - High
        - Inari has shown an ability to sign multiple collaboration agreements over time.
        - Medium-High
      - - Wheat field-validation partner
        - InterGrain
        - Regional field testing and agronomic validation
        - Current public evidence still names InterGrain as the active evaluator of wheat editing designs.
        - Delayed or weak trial outcomes push wheat commercialization further right.
        - Medium-High
        - Active field testing is underway, so the relationship is operational rather than purely prospective.
        - Medium-High
      - - Capital providers
        - Existing and future investors
        - Financing for scale before public revenue proof
        - Public evidence shows repeated large private rounds while EV/revenue support is still undisclosed.
        - Capital markets weaken or milestones slip, forcing a slower rollout or a weaker round.
        - High
        - January 2025 financing suggests continued investor access and syndicate support.
        - High
    notes: >-
      Public evidence establishes dependency categories and counterparties, but not contract terms, exclusivity, or concentration by partner or customer.
    claimRefs: [CR001, CR003, CR006, CR007, CR012]
