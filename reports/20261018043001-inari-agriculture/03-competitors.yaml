    title: "Competitive positioning: specialization versus distribution control"
    type: quadrant
    summary: |-
      Inari sits in the high-specialization / mid-distribution quadrant: more
      crop gene-editing focused than diversified incumbents, but with less
      owned channel control.
    data:
      xAxis:
        label: Distribution control and farmer-channel reach
        min: 1
        max: 5
        low: Indirect or tooling-led access
        high: Owned seed / distributor reach
        description: Ordinal score synthesized from retained evidence about commercialization ownership and channel breadth.
        scale: 1-5 ordinal
      yAxis:
        label: Genome-editing seed specialization
        min: 1
        max: 5
        low: Adjacent or diversified portfolio
        high: Core crop gene-editing focus
        description: Ordinal score synthesized from retained evidence about how central gene-edited seed design is to each company.
        scale: 1-5 ordinal
      points:
        - label: Inari
          x: 3
          y: 5
          tone: positive
          note: Specialized multiplex gene-editing platform with breeder-partner route to market rather than an owned grower channel.
          claimRefs: [CP001, CP003, CP005, CP008]
        - label: Corteva Agriscience
          x: 5
          y: 4
          tone: risk
          note: Broad incumbent seed and trait reach plus active IP posture against Inari.
          claimRefs: [CP006, CP012, CP014]
        - label: Bayer Crop Science
          x: 5
          y: 3
          tone: neutral
          note: Diversified global seed incumbent with broad channel control but less evidence here of single-platform gene-editing focus.
          claimRefs: [CP006, CP014]
        - label: Advanta Seeds
          x: 4
          y: 2
          tone: neutral
          note: Established seed-breeding footprint from the retained tear sheet, but no retained proof of comparable gene-editing specialization.
          claimRefs: [CP006]
        - label: Benson Hill
          x: 3
          y: 3
          tone: medium
          note: Public crop-innovation peer with biotechnology overlap, but retained evidence places it as a broader peer rather than a direct like-for-like Inari substitute.
          claimRefs: [CP006]
        - label: Ginkgo Bioworks
          x: 2
          y: 1
          tone: medium
          note: Synthetic-biology adjacency overlaps in genetic tooling, but retained evidence does not show a comparable seed-company channel model.
          claimRefs: [CP006]
    approximationNotes: The coordinates are evidence-backed ordinal scores, not measured market shares or benchmark-normalized rankings.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP008
      - CP012
      - CP014
callouts:
  - calloutType: insight
    title: Specialized platform, borrowed channel
    body: |-
      Inari's strongest public differentiation is crop-specific multiplex
      editing across major row crops, but the same sources show it
      commercializes through breeder and seed-company partners instead of a
      fully owned farmer channel.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP008
  - calloutType: risk
    title: Incumbent response can come through IP and channel power
    body: |-
      The retained pool shows that large incumbents are not just abstract
      comparables; Corteva already used patent and seed-access litigation, and
      incumbent-owned distribution remains broader than Inari's partner-led
      model.
    claimRefs:
      - CP012
      - CP014
