      - [Large seed incumbents, "Seed and trait portfolio sale through established channels", "Not publicly listed in retained pool", "Broad breeding, traits, and channel reach", "Scale advantage is visible; direct package parity with Inari is not"]
      - [Specialist ag-biotech peers, "Varies by company; retained pool does not show a standard model", "Not publicly listed in retained pool", "Tooling, crop biology, or adjacent platform strengths", "Commercial comparability remains weak without current package detail"]
