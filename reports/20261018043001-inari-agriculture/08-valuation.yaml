  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Technical platform remains differentiated.
        - >-
          Inari still describes an AI-enabled SEEDesign platform and active crop programs; InterGrain is field
          testing initial wheat Editing Designs.
        - Named commercial conversions, repeat purchase data, or disclosed seed-volume economics would strengthen it.
      - - Financing history shows investor appetite.
        - >-
          The retained profile compiles $768 million raised to date and a $2.17 billion Series G post-money valuation
          in January 2025.
        - Current terms, ownership concentration, and preference details are needed to know how much upside remains.
      - - Legal/IP overhang remains real.
        - >-
          The September 2026 settlement required destruction of accessed Corteva material, IP assignment for edited
          Corteva events, and talks on licensing arrangements.
        - Clear disclosure that licensing is bounded and non-thesis-breaking would reduce the discount.
      - - Public price support is still weaker than financing support.
        - >-
          The same profile says EV/Rev is not disclosed for any round, while official sources focus on platform,
          partnership, and legal updates rather than current unit economics.
        - Current revenue, margin, burn, and customer concentration data could move the call toward buy.
    notes: "Pairs the strongest support with the specific diligence item needed to re-underwrite the entry price."
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV008
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Platform proof converts into visible commercial adoption, licensing consequences remain manageable, and the
          next financing or exit shows that the January 2025 price was a waypoint rather than a peak.
        - >-
          Upside comes from proving that a premium ag-biotech platform can command better economics than thin-revenue
          public peers.
        - Requires disclosed commercialization metrics, not just technical milestones.
        - Failure to show customer conversion or acreage scale turns the upside case into aspiration.
      - - Base
        - >-
          Inari continues advancing platform and partner programs, but public operating disclosure remains limited and
          financing terms stay opaque.
        - >-
          The company may deserve ongoing attention, but the price case remains stretched because underwriting still
          relies more on prior capital formation than on current economics.
        - Best fit for the current retained evidence.
        - A flat or insider-led follow-on round would reinforce this holding pattern.
      - - Bear
        - >-
          Commercialization stays pilot-heavy, the settlement or licensing path weighs on economics, and concentrated
          seed-market structure limits exit optionality.
        - >-
          A new investor near the last round risks multiple compression or preference subordination before meaningful
          revenue scale appears.
        - Supported by adverse legal context, disclosure gaps, and the weak revenue profile of an imperfect public
          peer.
        - Any down round, structured recap, or evidence of stalled partner conversion would validate the downside.
    notes: "Qualitative scenarios only; the retained source pool does not disclose current revenue, ARR, or margin inputs for a precise model."
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV011
      - CV013
      - CV014
