company:
  name: Inari Agriculture
chapter:
  number: 8
  title: Valuation
  summary: >-
    The retained public evidence supports a research-more recommendation with a stretched valuation stance. Inari
    can point to substantial historical fundraising and a technically ambitious platform, but the current public
    record still discloses far more about platform intent and legal developments than about present-day revenue,
    margins, preference overhang, or repeatable commercial scale.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The investable question is not whether Inari is technically interesting; it is whether the current public
      record justifies paying close to the January 2025 Series G mark today. The retained evidence says the company
      still has a credible technical story and meaningful prior investor support, but it does not yet provide the
      current operating disclosure needed for a buy-style underwriting case. Official pages emphasize an AI-enabled
      SEEDesign platform and active crop programs, while the strongest new adverse item in the pool is the September
      2026 Corteva settlement, which required Inari to destroy accessed depository material, assign IP related to
      edited Corteva events, and negotiate certain licensing arrangements. Against that backdrop, the prudent call is
      research-more with medium confidence and a stretched valuation stance: this is a price-sensitive opportunity
      that needs updated commercialization evidence, not a company-quality score that can be separated from entry
      terms.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV011
      - CV013
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-vs-public-price-support
    title: Financing context versus public price support
    body: >-
      Financing support is easier to verify than price support. The retained August 2026 profile says Inari's latest
      disclosed financing was a $144 million Series G in January 2025 at a $2.17 billion post-money valuation, and
      it compiles total capital raised at $768 million including a $45 million debt round in 2020. That history
      shows repeated access to capital and suggests the cap table has already absorbed meaningful dilution, but the
      same profile also says EV/Rev is not disclosed for any round and notes that the full shareholder register is
      not public. In other words, the public record provides round chronology and some rough dilution markers, but it
      does not provide enough on liquidation preferences, ownership concentration, secondary activity, or present-day
      financial performance to prove that a new investor would still be buying at an attractive risk-adjusted price.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
    tableRefs:
      - TV002
  - id: scenarios-comparables-and-exit-readiness
    title: Scenarios, comparables, and exit readiness
    body: >-
      The bull case is straightforward to articulate: Inari has continued to present a differentiated gene-editing
      platform, it still highlights crop-specific work in soybean, corn, and wheat, and it can point to a long
      financing history that let it keep building through a difficult agtech cycle. The harder part is proving that
      this technical momentum has already crossed into durable commercial economics. Official historical disclosures
      still frame commercialization around accelerating product introduction and partner-led field validation, while
      the retained public-comp signal from Cibus shows how thin-revenue, heavy-loss crop-biotech businesses can
      remain even in public markets. Combined with the Department of Justice's description of the seed industry as
      highly concentrated with high barriers to entry, that makes exit timing and multiple support sensitive to a
      small set of facts the current public record does not yet provide.
    claimRefs:
      - CV002
      - CV004
      - CV009
      - CV010
      - CV011
    tableRefs:
      - TV003
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: >-
      The final diligence burden is therefore concrete. Before upgrading the call, an investor should obtain current
      revenue or acreage conversion data, gross-margin and burn context, customer or channel concentration, and the
      exact economic rights embedded in the January 2025 financing. The same package should clarify whether the
      Corteva settlement has become a manageable licensing cost or a recurring drag on product freedom and economics.
      The thesis breaks if current commercialization turns out to be pilot-heavy and revenue-light, if preference
      overhang leaves little upside for a new entry at or near the last round, or if legal and market-structure
      constraints keep the company from translating platform progress into scalable seed-company or farmer demand. A
      price reset, a structured round with stronger downside protection, or hard evidence of recurring commercial
      conversion could all improve the underwriting case materially.
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV012
      - CV013
      - CV014
