  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: Exact Series G terms, liquidation preferences, ownership concentration, any seniority stack, and any secondary activity since January 2025.
      whyItMatters: A new investor cannot judge whether the last disclosed valuation leaves enough upside without knowing where a fresh entry would sit in the capital stack.
      diligencePath: Request the latest cap table, financing documents, investor rights summary, and any board materials describing post-Series G ownership changes.
      relatedQuestionRefs:
        - QV002
    - type: missing-source
      severity: material
      topic: current-commercial-economics
      missingEvidence: Current revenue, contracted acreage or seed-volume data, gross margin, burn, runway, and concentration by customer or channel partner.
      whyItMatters: These metrics determine whether the January 2025 mark is still defensible or whether the company remains valued mainly on platform promise and prior financing momentum.
      diligencePath: Obtain current management reporting, customer cohort data, channel-partner pipeline conversion, and any lender or board packages used for internal planning.
