- calloutType: risk
  title: Industry structure can slow commercialization even if the science works
  body: Seed-industry concentration, litigation over access to patented seeds, and a 2026 West Lafayette layoff all point to execution and access friction that can delay revenue realization even when agronomic claims are promising.
  claimRefs:
  - CM010
  - CM011
  - CM012
- calloutType: recommendation
  title: Underwrite the market with channel metrics, not headline valuation
  body: Before using the $2.17 billion valuation as a signal of market size, request crop-by-crop pricing, acreage under contract, partner concentration, and conversion from field trials to commercial seed volumes.
  claimRefs:
  - CM013
  - CM014
