  - id: section-differentiation
    title: 'Capability comparison, pricing, and GTM differentiation'
    body: >-
      The capability matrix reveals a clear hierarchy around the chargeback-guarantee dimension. Signifyd is the only vendor
      that explicitly guarantees all chargeback types including first-party fraud and non-fraud chargebacks; Riskified and
      Forter both offer guarantees with scope conditions that require direct contract review. Sift, Kount/Equifax, and
      Stripe Radar offer no financial guarantee. On network data, Sift's 1T+ annual events and Forter's $350B GMV-network
      are both credible but differently structured: Sift's network spans broader industries (gaming, fintech, marketplaces)
      while Forter's consortium is more concentrated in high-ticket commerce. Signifyd's Commerce Network covers an
      estimated 98% of ecommerce shoppers in major markets per its 2021 financing release. On pricing, Riskified and Forter
      both require custom enterprise quotes with no published rate card; Sift has tiered platform pricing; Stripe Radar is
      included in Stripe's per-transaction fee; and Signifyd charges a percentage of approved GMV. The percentage-of-GMV
      model directly aligns Signifyd's revenue incentive with merchant approval volume but creates margin sensitivity to
      any increase in fraud rates across the Commerce Network. GTM differentiation is also material: Riskified has a
      smaller European footprint than Signifyd; Forter competes strongly in North America but has limited documented
      European presence; and Sift operates primarily in North America. ClearSale's moat is Latin American depth and
      human-review capacity. Signifyd's explicit European operations and SCA compliance differentiate it meaningfully in
      the European enterprise market.
