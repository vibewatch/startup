callouts:
  - calloutType: strength
    title: Full-liability guarantee on all chargeback types is Signifyd's clearest moat
    body: >-
      No other vendor in the competitive set guarantees both fraud chargebacks and non-fraud chargebacks (first-party fraud,
      item-not-received, significantly-not-as-described). This breadth is the strongest documented differentiation and the
      main reason Aite Group ranked Signifyd first in its seven-vendor head-to-head analysis.
    claimRefs:
      - CP029
      - CP030
      - CP031
  - calloutType: risk
    title: Riskified's public-company disclosure is an enterprise trust asymmetry Signifyd cannot currently match
    body: >-
      Riskified's NYSE listing, SEC filings, and June 2026 share buyback signal financial maturity and governance
      transparency that sophisticated enterprise procurement teams increasingly require. Signifyd's private status creates
      a credibility gap that may lengthen sales cycles with large retailers and publicly-traded enterprise buyers.
    claimRefs:
      - CP004
      - CP040
      - CP043

