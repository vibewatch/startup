  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Riskified pricing model and gross margin
      missingEvidence: Riskified does not publish a rate card or gross margin data; 20-F filings exist but were not retrieved in this run.
      whyItMatters: Pricing model and margin structure determines whether Riskified's competitive positioning is economically sustainable at current scale.
      diligencePath: Review Riskified 20-F annual report on EDGAR (CIK 0001861635) for revenue by segment, cost of revenue, and chargeback expense line items.
      relatedQuestionRefs:
        - QP005
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: Head-to-head approval rate benchmarks across guarantee-tier vendors
      missingEvidence: No published independent benchmark comparing Signifyd, Riskified, and Forter approval rates and false-decline rates under controlled conditions.
      whyItMatters: Approval rate and false-decline metrics are the primary purchase criteria for enterprise merchants evaluating guarantee-tier vendors; without benchmark data the competitive hierarchy rests on vendor-authored claims.
      diligencePath: Commission or obtain an independent analyst study benchmarking approval rates using merchant reference data or RFP outcomes.
      relatedQuestionRefs:
        - QP024
      relatedTableRefs:
        - TP002
    - type: private-evidence-only
      severity: material
      topic: Forter geographic revenue split and European competitive presence
      missingEvidence: Forter does not disclose geographic revenue breakdown; limits precision on head-to-head European battleground analysis.
      whyItMatters: If Forter is growing rapidly in European enterprise, it would represent a more direct competitive threat to Signifyd's European expansion.
      diligencePath: Request geographic revenue breakdown from Forter management or seek investor-level data room access.
      relatedQuestionRefs:
        - QP018
      relatedTableRefs:
        - TP001
    - type: private-evidence-only
      severity: moderate
      topic: Documented multi-homing behavior among enterprise merchants
      missingEvidence: No public case studies or analyst data document the rate at which large merchants use Signifyd alongside a backup guarantee vendor.
      whyItMatters: Multi-homing would reduce effective per-merchant yield and weaken concentration-of-wallet pricing leverage.
      diligencePath: Review Signifyd merchant contract terms for exclusivity clauses; ask management for multi-homing rate in enterprise cohort.
      relatedQuestionRefs:
        - QP017
      relatedTableRefs:
        - TP004
    - type: private-evidence-only
      severity: moderate
      topic: Published win-loss evidence — major merchant switching between Signifyd and competitors
      missingEvidence: No public case studies document a major retailer publicly switching from Signifyd to Riskified or Forter or vice versa.
      whyItMatters: Win-loss data is the most direct test of competitive moat; absence of public evidence does not imply absence of switching activity.
      diligencePath: Request win-loss analysis from Signifyd sales management; cross-reference with Riskified and Forter publicly listed customer references.
      relatedQuestionRefs:
        - QP020
      relatedTableRefs:
        - TP004
    - type: private-evidence-only
      severity: moderate
      topic: Incumbent vendor market share evolution — Accertify, Cybersource, Featurespace
      missingEvidence: No third-party data available on Accertify (American Express subsidiary), Cybersource/Visa, or Featurespace market share trends since the 2021 Aite matrix.
      whyItMatters: Incumbent displacement is a key competitive dynamic; if incumbents are losing share faster than expected, the guarantee-tier addressable market may be larger.
      diligencePath: Commission Aite/Javelin/Forrester update on the chargeback guarantee and fraud-platform market since the 2021 matrix.
      relatedQuestionRefs:
        - QP014
      relatedTableRefs:
        - TP001
