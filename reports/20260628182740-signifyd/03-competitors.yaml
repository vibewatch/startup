  - id: section-moat
    title: 'Moat durability, switching costs, and competitive risk'
    body: >-
      Signifyd's competitive moat rests on four reinforcing elements: the Commerce Network data advantage (cross-merchant
      identity resolution), the guarantee model's alignment mechanics (revenue only on approved orders), the chargeback-
      management infrastructure that handles dispute adjudication on behalf of merchants, and integration depth and workflow
      lock-in through OMS, ERP, and payment system connectivity. Each element creates switching cost: a merchant running
      Signifyd's guarantee for 18+ months builds forecast trust in the model's loss economics and would need to rebuild
      that trust with a replacement vendor. The most serious competitive risk is Riskified's NYSE listing, which gives
      enterprise buyers the comfort of audited financials, a stable cap table, and regulatory-level disclosure — advantages
      Signifyd cannot match as a private company. Riskified's June 2026 $75M buyback further signals financial maturity.
      The second-most serious risk is payment-embedding displacement: if Stripe or PayPal deepens their guarantee
      offerings, the addressable market for standalone guarantee vendors could shrink materially. Some vendors have already
      retreated from the guarantee model — moving to performance-SLA frameworks — because sustaining the loss economics
      requires continuous ML improvement and sufficient network scale. This retreat validates the network moat: only
      vendors with sufficient transaction intelligence can sustain a financially guaranteed model without adverse selection
      destroying margins. Commoditization risk is moderately elevated in the scoring-only tier but low in the full-guarantee
      tier because the model requires underwriting discipline that is difficult to replicate quickly.
