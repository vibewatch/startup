chapter:
  number: 3
  title: Competitors
  summary: >-
    Signifyd operates in a segmented competitive landscape where the chargeback-guarantee segment is dominated by three
    serious players: Signifyd itself (Aite Group #1, ~$293M est. ARR), Riskified (NYSE:RSKD, ~$318M revenue, the only
    public peer), and Forter ($3B valuation, $525M raised, ~$103M ARR). A broader tier of best-effort-only tools includes
    Sift ($1B valuation, $35M ARR, Forrester Leader), Kount (Equifax subsidiary since 2021), ClearSale, and payment-embedded
    substitutes such as Stripe Radar (free for Stripe merchants, 32% average fraud reduction). Signifyd's principal moat is
    its full-liability chargeback guarantee covering both fraud and first-party chargebacks — a model Riskified and Forter
    also offer but that Sift, Kount, and Stripe Radar explicitly do not. Riskified's public-company status and June 2026
    $75M share buyback create an enterprise-credibility asymmetry Signifyd cannot currently match. Stripe Radar's
    zero-integration-cost advantage is a meaningful displacement risk for mid-market merchants on Stripe. The guarantee
    model itself carries underwriting risk: some vendors have already retreated from it to performance-SLA frameworks, which
    validates the network moat but also shows the margin fragility.
sections:
  - id: section-landscape
    title: 'Competitive landscape: direct peers, substitutes, and status-quo alternatives'
    body: >-
      Signifyd's competitive map divides into four distinct categories. First, and most directly relevant to valuation, are
      the chargeback-guarantee peers — Riskified and Forter — that compete for the same enterprise merchant dollar on nearly
      identical buying criteria: approval rate, guarantee breadth, network size, and per-basis-point loss economics. Second
      are best-effort fraud-scoring platforms (Sift, Kount/Equifax) that win where merchants prefer operating their own risk
      teams or buying from an established financial-data incumbent. Third are payment-embedded fraud tools — primarily Stripe
      Radar and PayPal Fraud Protection — that turn fraud prevention into a zero-marginal-cost feature of the payment stack,
      undercutting standalone vendors for merchants already committed to the relevant payments processor. Fourth is the
      status-quo alternative: legacy rules engines, in-house fraud teams, and manual review queues that remain the de-facto
      baseline for smaller or cost-sensitive merchants. Aite Group's 2021 chargeback-guarantee matrix ranked Signifyd first
      among seven vendors evaluated — ahead of Riskified, Accertify, Bolt, ClearSale, Vesta, and Apruvd — citing
      machine-learning leadership, high approval rates, chargeback-management services, and consortium network depth.
      The competitive implication is that Signifyd is strongest where the merchant's primary criterion is transferring
      financial liability rather than simply scoring transactions. That positioning is defensible but concentrated in the
      enterprise-and-large-mid-market segment; below roughly $50M in GMV, merchants increasingly choose embedded tools or
      manual processes rather than paying a guarantee premium.
