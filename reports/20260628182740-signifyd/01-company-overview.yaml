  - TO003
  figureRefs: []
- id: scale-traction-and-milestones
  title: Scale, Traction, and Milestones
  body: 'Signifyd shows real operating scale, but public metrics mix official directional claims with third-party estimates. The strongest official signals are platform and customer evidence: Signifyd says its Commerce Network observes transactions from thousands of merchants and millions of consumers worldwide; its 2021 financing release said the platform exceeded 98 percent coverage of ecommerce shoppers in major markets; and public customer-facing proof includes Samsung, Lenovo, Walmart Mexico, Mango, Philips, and Hot Topic. The latest official milestone in the reviewed set is the September 2025 launch of Intelligent Returns in the UK and Europe, showing that the company is still extending beyond card-not-present fraud into post-purchase economics. Independent datasets add helpful but lower-confidence scale markers: GetLatka estimates $292.8 million of 2024 revenue and about 512 employees, while Revelio describes a multi-office footprint across North America, Europe, and Mexico. Reviews
    remain mostly positive, but the Trustpilot snapshot is materially weaker than enterprise-software review surfaces, a reminder that guarantee businesses can still create edge-case merchant dissatisfaction.'
