callouts:
- calloutType: strength
  title: Signifyd built a genuine underwriting wedge, not just a fraud dashboard
  body: The company’s defining product promise is assuming approved fraud and non-fraud chargeback exposure for merchants. That is structurally stronger than selling merchants a risk score alone because it ties product value directly to conversion lift and liability transfer.
  claimRefs:
  - CO004
  - CO005
  - CO017
- calloutType: risk
  title: The biggest open question is not demand, but the economics behind the guarantee
  body: Public evidence shows strong product breadth and real merchant relevance, but it does not reveal reserve ratios, loss trends, current merchant count, or board oversight of underwriting. Those missing economics matter more here than in a pure-SaaS company.
  claimRefs:
  - CO014
  - CO015
  - CO018
  - CO035
- calloutType: assumption
  title: Treat current scale metrics as directional until management opens the books
  body: Latka and Revelio are useful orientation aids for revenue and headcount, but they are not substitutes for audited financial statements, reserve disclosures, or an internal operating dashboard. The report therefore uses them to frame scale without upgrading them to decision-grade facts.
  claimRefs:
  - CO014
  - CO015
  - CO016
