  figureRefs: []
- id: funding-investors-and-capital-history
  title: Funding, Investors, and Capital History
  body: 'Signifyd''s capital history is well enough documented to establish scale even if the latest internal mark is private. The clearest anchor is the April 2021 Series E: $205 million at a $1.34 billion valuation, led by Owl Rock Capital with FIS, CPP Investments, and Neuberger Berman joining. Official pages and multiple independent outlets corroborate that round and show it followed a 2018 Series D of $100 million led by Premji Invest after a 2017 Series C of $56 million led by Andreessen Horowitz. Signifyd''s own about page also lists Bain Capital Ventures, Menlo Ventures, American Express Ventures, IA Ventures, Allegis Cyber, and Resolute Ventures among its backers. Third-party datasets such as Latka estimate lifetime funding around $390 million, which matches the public round arithmetic across seed through Series E. What remains missing is more recent valuation evidence: there is no public 2024 or 2025 priced round, tender, or internal mark that supersedes the 2021 unicorn valuation.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO027
  - CO028
  - CO036
