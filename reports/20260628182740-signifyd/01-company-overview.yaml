company:
  name: Signifyd
chapter:
  number: 1
  title: Company Overview
  summary: Signifyd is a private growth-stage commerce-protection company founded in 2011 by Raj Ramanand and Mike Liberty to shift fraud liability away from ecommerce merchants. Public evidence strongly supports the company's chargeback-guarantee model, blue-chip merchant footprint, and roughly $390 million lifetime funding history, but leaves exact current ARR, merchant count, board control, and post-2021 valuation marks private; those omissions matter because the business underwrites fraud losses rather than selling pure workflow software.
sections:
- id: identity-and-business-model
  title: Identity and Business Model
  body: Signifyd's core identity is unusually clear for a private company. The company says it was founded in 2011 after co-founders Mike Liberty and Raj Ramanand left PayPal, started in a Palo Alto coworking space, and pivoted from simple order scoring to guaranteed fraud protection for online merchants. That founding story still explains the current product mix. Signifyd is not merely a rules engine or checkout widget; it is an underwriting and decisioning platform that approves ecommerce orders, absorbs approved fraud and non-fraud chargebacks, and increasingly extends into payment optimization, shopper identity, returns, and consumer-abuse prevention. The key implication is that revenue quality depends on both software adoption and disciplined loss management. Official product pages and independent reviews consistently frame the company as a Commerce Protection Platform for large retailers, with guaranteed approvals and automated workflows as its differentiation rather than standalone
    analytics alone.
  claimRefs:
  - CO001
  - CO002
  - CO004
  - CO005
  - CO006
  - CO017
  - CO018
  - CO026
  - CO033
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance
  body: The public leadership picture is founder-led but only partially transparent. Ramanand remains CEO and the most visible external executive, while Liberty is still acknowledged as co-founder in official storytelling even though current operating responsibilities are not publicly spelled out. Recent product and customer-facing announcements identify J. Bennett on customer strategy and Nikhita Hyett as a general manager driving the Europe-focused returns product launch, which suggests a bench beyond the founders but not a fully disclosed executive roster. Governance transparency is the weak point. Signifyd's official pages do not enumerate board seats, committee structure, or voting control by the investor syndicate. Because the business combines SaaS economics with guarantee exposure, missing board and risk-committee information is more material than for a typical pure-software vendor. The practical read is that Signifyd has founder continuity and public customer-facing leaders, but
    outside investors still need a direct governance package before underwriting control, reserve-setting, and expansion discipline.
  claimRefs:
  - CO001
  - CO002
  - CO010
  - CO016
  - CO022
  - CO023
  - CO035
