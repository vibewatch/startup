  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Expansion Driver
      - Concentration Risk
      - Impact
      - Diligence Path
    rows:
      - - Multi-product stack (Fraud Protection → Chargeback Recovery → SCA → Returns)
        - Single-vendor dependency deepens with each added module
        - High switching cost after full-stack deployment; sticky ARR
        - Map total platform spend and number of active modules per top-20 account
      - - Deep platform integrations (Salesforce CC, SAP Hybris, Shopify, BigCommerce)
        - Channel and platform partner concentration
        - Partner delistings or API changes disrupt distribution and deployment
        - Review integration partner agreements; assess exclusivity terms
      - - Commerce Network data flywheel
        - Top-merchant data contribution risk
        - Loss of major accounts degrades network signal quality for all merchants
        - Quantify contribution of top-10 merchants to transaction-level training data
      - - Product Advisory Board retention (Samsung, Lenovo, Walmart Mexico)
        - Named accounts with uncertain current status (404 pages)
        - Potential undisclosed churn at top of customer roster
        - Conduct direct reference interviews with PAB member companies; confirm active billing
      - - European expansion via Intelligent Returns / SCA
        - Regulatory risk (PSD2; EU consumer rights legislation)
        - Compliance burden and local regulatory exposure could cap European growth
        - Review PSD2 compliance audits and EU consumer returns law exposure in due diligence
    notes: "Concentration percentages are not publicly disclosed. Risk ratings are qualitative assessments based on product architecture, official announcements, and observable website signals as of June 2026."
    claimRefs:
