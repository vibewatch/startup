  - id: named-customer-proof
    title: Named Customer Proof and Documented Outcomes
    body: "Signifyd's strongest evidence of customer value is a set of named case studies with quantified outcomes across fashion, consumer electronics, leisure, and specialty retail. Mango, the Barcelona-based fashion retailer, routes previously declined orders to Signifyd as a second-opinion engine; published results show Signifyd approving over 60% of those contested orders, yielding a 6% uplift in approved GMV with zero incremental chargeback risk on guarantee-backed approvals. Philips deployed Signifyd on its Hybris commerce platform for consumer electronics fraud prevention, publicly reporting a chargeback rate reduction from 5% to below 1% and a conversion rate increase from 40% to over 75%. Hot Topic, the specialty retailer operating on Salesforce Commerce Cloud, replaced manual order review with Signifyd's Commerce Protection Platform and now achieves over 99% order approval rates with 100% order automation; CEO Steve Vrane documented a multimillion-dollar annual revenue uplift. Emma — The Sleep Company recovered between 6% and 7% in additional revenue from Signifyd's Seamless SCA product in European markets. Build-A-Bear uses Signifyd for both fraud management and reseller abuse prevention, protecting its brand experience from bot-driven purchasing. Groupe Dynamite, independently reported by FeaturedCustomers, raised its approval rate from 95% to 99.8% with Signifyd. The Aite Group independently evaluated Signifyd against six competitors in November 2020 and ranked it first in the chargeback guarantee market, citing client feedback describing 'high approval rates, strong partnership, great to work with' and one client reducing fraud chargebacks from over 100 basis points to 10 basis points within a month of deployment."
