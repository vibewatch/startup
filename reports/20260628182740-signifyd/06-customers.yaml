callouts:
  - calloutType: strength
    title: Chargeback Guarantee Creates Deep Merchant Stickiness
    body: "Named case studies across Mango, Philips, and Hot Topic demonstrate that Signifyd's financial guarantee creates immediate, measurable ROI — 6% GMV uplift for Mango, elimination of a 5% chargeback burden for Philips, and a multimillion-dollar annual uplift for Hot Topic. This ROI proof, combined with platform integrations and Commerce Network switching costs, makes Signifyd a difficult vendor to remove once embedded at scale."
    claimRefs:
      - CU005
      - CU006
      - CU010

  - calloutType: risk
    title: Enterprise Customer Status Pages Returning 404 Require Direct Verification
    body: "As of June 2026, the dedicated case study pages for Samsung, Lenovo, and Walmart Mexico — all prominently cited in Signifyd's 2021 Series E press release and 2023 Product Advisory Board announcement — return 404 errors on signifyd.com. Whether this reflects account churn, a deliberate logo de-listing, or a website restructuring is unconfirmed and must be resolved through direct customer reference checks before any investment decision."
    claimRefs:
      - CU039
      - CU016

  - calloutType: recommendation
    title: Require Direct Reference Calls with Active Enterprise Customers Before Close
    body: "The combination of undisclosed NRR, sparse Trustpilot and TrustRadius review panels, and the disappearance of three prominent customer pages creates a retention verification gap. Investors should require at least three direct reference calls with currently active named enterprise customers as a condition of proceeding. Reference checks should specifically probe annual renewal terms, pricing trajectory, and alternative solutions evaluated."
    claimRefs:
      - CU029
      - CU030
      - CU039

