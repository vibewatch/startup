  - id: retention-and-satisfaction
    title: Retention, Satisfaction, and Adverse Signals
    body: "Signifyd exhibits strong retention signals from multi-year customer testimonials but lacks officially disclosed quantitative retention metrics. On the Shopify App Store, merchants with 5+ year relationships are documented, including a 7-year tenure from the Drag Cartel CEO and Rainbow Shops confirming nearly 5 years of continuous use. TrustRadius reviews from Thule Group's Director of Customer Service Operations praise high approval rates and responsive escalations with no cons stated. SoftwareAdvice aggregates 64 reviews with broadly positive sentiment anchored in fraud reduction and operational efficiency; however, reviewers raise consistent concerns about pricing being 'a bit pricey,' a 7-day chargeback claim submission window considered too short, and occasional difficulty obtaining overrides for flagged legitimate orders. The most adverse public signal is Signifyd's Trustpilot profile: only 2 reviews with a 2.9/5 average. An April 2025 reviewer described Signifyd as blocking thousands of legitimate orders from loyal customers without explanation, resulting in significant lost sales and customer trust damage — a scenario consistent with over-aggressive fraud decisioning. Signifyd has not publicly replied to these Trustpilot reviews. PeerSpot's June 2026 category analysis shows Signifyd's mindshare in fraud detection at 1.7%, down from 1.9% year-over-year, indicating modest erosion in platform visibility relative to competing solutions. The overall picture is of strong enterprise retention among documented accounts but a thin public review footprint that limits independent verification of satisfaction at scale."
