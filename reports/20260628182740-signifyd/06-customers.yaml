  - id: adoption-trajectory
    title: Adoption Trajectory and Platform Scale
    body: "Signifyd's adoption trajectory is partially visible through official platform metrics and independent third-party data. The 2021 Series E press release disclosed that the platform exceeded 98% ecommerce shopper coverage in major markets, with merchant clients achieving conversion rate increases of up to 20%. GetLatka estimated Signifyd's 2024 revenue at $292.8 million with approximately 512 employees, indicating substantial merchant monetization even though customer-level adoption data is not publicly disclosed. On Shopify's app marketplace, the Signifyd listing shows 84 reviews with a 4.6-star average (79% five-star), and multiple reviewers cite 5–7 year ongoing relationships — including a Drag Cartel CEO noting over 7 years of use as of June 2026. TrustRadius via HG Insights records 1,453 Signifyd installations across verticals led by retail trade (12.5% of installs) and manufacturing (9.2%). The Intelligent Returns product launch in September 2025 for UK and Europe merchants represents the most recent publicly confirmed adoption milestone, with Signifyd research showing that 77% of shoppers say return policies influence where they shop and 94% rate ease of return as essential. This expansion into post-purchase workflows signals active growth of the installed base beyond fraud prevention into adjacent commerce economics."
