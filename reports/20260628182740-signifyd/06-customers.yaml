  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-metrics
      missingEvidence: Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer churn rates, and cohort-level retention data for Signifyd's merchant base
      whyItMatters: Without NRR, it is impossible to independently assess whether the chargeback-guarantee model builds durable customer relationships or masks elevated churn; critical for valuation modeling given the underwriting loss exposure embedded in the revenue base
      diligencePath: Request NRR, GRR, and cohort retention data in the management information package; cross-validate against contract renewal records and customer billing ledger
      relatedQuestionRefs:
        - QU009

    - type: stale
      severity: material
      topic: enterprise-customer-status
      missingEvidence: Confirmation that Samsung, Lenovo, and Walmart Mexico remain active paying Signifyd customers as of June 2026; their customer pages return 404
      whyItMatters: These three accounts were prominently cited in the 2021 Series E press release and 2023 Product Advisory Board announcement; their apparent removal from the website raises the risk of undisclosed churn at the top of the customer roster
      diligencePath: Request current active customer list with billing status; conduct direct reference interviews with Samsung, Lenovo, and Walmart Mexico fraud/payments teams
      relatedQuestionRefs:
        - QU017
        - QU020

    - type: enumeration-incomplete
      severity: material
      topic: customer-base-enumeration
      missingEvidence: Complete roster of active Signifyd customers with contract status, annual spend, and module adoption profile
      whyItMatters: Without a full customer list, concentration risk cannot be quantified and the 10,000+ merchant Commerce Network claim cannot be independently verified or linked to paying ARR
      diligencePath: Request anonymized ARR breakdown by merchant tier; cross-reference against HG Insights installation data and Shopify marketplace metrics
      relatedQuestionRefs:
        - QU007
        - QU011
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: competitive-benchmarks-retention
      missingEvidence: Publicly available NRR and satisfaction benchmarks from direct competitors (Forter, Riskified) to contextualize Signifyd's undisclosed metrics
      whyItMatters: Riskified is publicly traded and discloses NRR; without Signifyd's equivalent metric, competitive position and relative retention health cannot be independently assessed
      diligencePath: Reference Riskified 20-F annual filings for NRR benchmarks; commission primary research with customer references if data room is insufficient
      relatedQuestionRefs:
        - QU025

    - type: missing-source
      severity: minor
      topic: case-study-production-status
      missingEvidence: Independent verification of production deployment status for named customers beyond Signifyd's own case study claims; pilot vs. live production confirmation for Samsung, Lenovo, Walmart Mexico
      whyItMatters: Case studies are company-published; without independent confirmation, the production vs. pilot distinction cannot be validated for accounts with no third-party corroboration
      diligencePath: Conduct direct reference interviews with named customer contacts; request deployment scope and contract value confirmation from each named account
      relatedQuestionRefs:
        - QU004

    - type: stale
      severity: minor
      topic: analyst-ranking-recency
      missingEvidence: A current (2024-2026) independent analyst evaluation of Signifyd's market position in guaranteed fraud protection relative to updated competitive landscape including Forter and Riskified
      whyItMatters: The Aite Group #1 ranking is from November 2020; the competitive landscape has shifted with Forter's $300M raise, Riskified's IPO, and Kount's Equifax acquisition since that evaluation
      diligencePath: Commission or obtain a current Forrester Wave, Gartner Magic Quadrant, or equivalent evaluation; request whether any analyst has conducted a head-to-head since 2022
      relatedQuestionRefs:
        - QU018

