company:
  name: Signifyd
chapter:
  number: 6
  title: Customers
  summary: Signifyd serves a broad enterprise and mid-market ecommerce merchant base anchored by named Fortune 1000 accounts including Philips, Mango, Hot Topic, Build-A-Bear, Samsung, Lenovo, Walmart Mexico, Lowe's, and Abercrombie, with published case studies documenting significant fraud reduction and revenue recovery. The Commerce Protection Platform claims 10,000+ merchants in its Commerce Network and FeaturedCustomers aggregates 191 references with a 4.7/5 rating, but independent NRR, GRR, and churn metrics remain undisclosed. Adverse signals include a 2.9/5 Trustpilot score with only 2 reviews and the disappearance of Samsung, Lenovo, and Walmart Mexico customer pages, requiring direct diligence on retention durability.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Scale
    body: "Signifyd's documented customer base spans enterprise and mid-market ecommerce merchants across multiple verticals and geographies, with official platform pages listing dedicated vertical tracks for fashion, consumer electronics, home goods, sporting goods, grocery, auto parts, airline, and quick-service restaurants. Geographic reach covers North America, Europe — explicitly including the UK, Germany, Spain, France, and Italy — and Latin America through its Mexico City office. The April 2021 Series E press release disclosed coverage exceeding 98% of ecommerce shoppers in major markets. The company describes its Commerce Network as encompassing more than 10,000 merchants and over 250 million consumer identities, though these figures are company-claimed and likely reflect data-footprint breadth rather than discrete paying customer counts. Named landmark accounts confirmed by official Signifyd sources include Samsung, Lenovo, Walmart Mexico, Lowe's, Abercrombie & Fitch, Mango, Arbonne, and eShopworld as members of the July 2023 inaugural Product Advisory Board. Official sources and TrustRadius report customers on the Fortune 1000 and Internet Retailer Top 500 lists. FeaturedCustomers independently aggregates 191 Signifyd customer references and 85 published case studies, rating the platform 4.7/5 from 3,605 submissions, with a Spring 2026 Market Leader designation — independently corroborating Signifyd's enterprise customer depth beyond its own marketing."
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU016
