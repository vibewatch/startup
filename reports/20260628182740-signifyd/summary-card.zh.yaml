  topStrengths:
    - 担保背书的 chargeback 保护，比单纯欺诈评分挖出更深护城河。
    - 蓝筹商户证明和跨商户网络数据，支撑它在企业市场的真实相关性。
    - 产品扩到支付优化、消费者滥用和退货，提升钱包份额潜力。
  topRisks:
