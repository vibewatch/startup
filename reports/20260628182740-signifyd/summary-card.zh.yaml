  unresolvedGaps:
    - 经审计的当前收入、ARR 和按产品线拆分的毛利率未公开。
    - Chargeback 损失率、准备金方法，以及已批准订单担保的盈利性仍未披露。
    - 2021 年 4 月以来，没有公开估值刷新、老股交易或 409A 式估值标记浮现。
    - 确切商户数量、头部客户集中度和净收入留存率，在公开材料中不可得。
