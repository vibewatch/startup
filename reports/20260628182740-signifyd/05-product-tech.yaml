  - TE005
  figureRefs: []
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Target Buyer
  - Maturity
  - Key Differentiation
  - Diligence Gap
  rows:
  - - Guaranteed Fraud Protection
    - Enterprise and mid-market merchants
    - Mature core
    - Approves orders with financial guarantee on covered fraud chargebacks
    - Approval-rate, false-positive, and loss-ratio metrics not publicly disclosed
  - - Complete Chargeback Protection
    - Merchants with broad dispute exposure
    - Mature expansion
    - Extends coverage beyond fraud into non-fraud chargeback categories
    - Public terms do not quantify claim win/loss economics by cohort
  - - Chargeback Recovery
    - Merchants disputing out-of-guarantee chargebacks
    - Growth-stage add-on
    - Recover revenue from disputes Signifyd does not guarantee directly
    - Public recovery win rate not disclosed
  - - Account Protection
    - Merchants with login and loyalty-account risk
    - Active expansion area
    - Combines account, identity, device, behavior, and order signals for ATO defense
    - No public model-accuracy or takeover-catch-rate benchmarks
  - - Authorization Rate Optimization
    - Checkout, payments, and ecommerce leaders
    - Active expansion area
    - Uses issuer and identity signals to reduce false declines and lift approvals
    - Issuer-coverage depth and measurable lift by region are not public
  - - Intelligent Returns / Return Insights
    - Retailers with high return rates
    - Newer launch
    - Data-driven returns authorization and revenue-protection workflow
    - Public adoption and ROI data are still limited
  - - Instant Refunds
    - Merchants focused on CX and loyalty
    - Available but lightly documented
    - Guarantee-backed rapid refunds to shoppers
    - Public operational terms and attach rate are limited
  - - Consumer Abuse Prevention
    - Merchants facing friendly fraud and policy abuse
    - Active expansion area
    - Addresses abuse outside classic payment fraud, including return and policy misuse
    - Public breakdown of covered abuse vectors remains incomplete
  notes: Rows reflect the major modules clearly evidenced in reviewed public materials rather than every
    console feature or underwriting rule.
  enumerationScope:
    coverage: partial
    basis: The table captures the main commercially visible modules under the platform and omits undocumented
      sub-features, internal workflows, and merchant-specific customizations.
