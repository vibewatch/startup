callouts:
- calloutType: risk
  title: Integration complexity is the main merchant-side product risk
  body: Signifyd has strong ecosystem coverage, but review platforms and the Shopify one-star tail show
    that implementation, tuning, and support expectations can still break the buyer experience. Merchants
    should diligence connector maintenance, onboarding timelines, and dispute-workflow ownership rather
    than assume the guarantee eliminates operational effort.
  claimRefs:
  - CE020
  - CE037
  - CE039
- calloutType: strength
  title: The Commerce Network plus guarantee model is the core differentiator
  body: Signifyd is differentiated not only by predictive scoring but by combining cross-merchant data,
    workflow automation, and direct financial liability absorption. That blend is harder for point solutions
    to replicate and helps explain the company's expansion into authorization, returns, and abuse prevention
    rather than remaining a single-purpose fraud filter.
  claimRefs:
  - CE003
  - CE010
  - CE036
  - CE038
