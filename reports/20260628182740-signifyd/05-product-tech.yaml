- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current Workflow
  - Signifyd Solution
  - Measurable Benefit
  - Key Limitation
  rows:
  - - Fraud and checkout team
    - Screen orders, accept chargeback loss risk, and review disputes manually
    - Guaranteed Fraud Protection plus Complete Chargeback Protection
    - Higher approved-order confidence and outsourced liability on covered disputes
    - Economic performance depends on opaque approval and false-positive rates
  - - Customer account security owner
    - Monitor login, device, and behavior signals in separate tools
    - Account Protection unifies account, identity, device, behavioral, and order signals
    - Detect ATO patterns earlier and reduce account-compromise losses
    - Public evidence does not disclose detection precision or recall
  - - Payments leader
    - Rely on issuer routing and bank decisions with limited optimization
    - Authorization Rate Optimization and Fearless Payments signals
    - Lift authorization rates and reduce false declines at checkout
    - Public issuer integration depth and measured lift are not quantified
  - - Returns and CX manager
    - Handle returns and refund workflows after purchase with little risk segmentation
    - Intelligent Returns, Return Insights, and Instant Refunds
    - Faster shopper resolution and data-driven returns policy enforcement
    - Newest module; public proof is narrower than core guarantee products
  - - Dispute operations team
    - Contest uncovered chargebacks manually or write them off
    - Chargeback Recovery workflow and Consumer Abuse Prevention
    - Recover some disputed revenue and improve policy-abuse enforcement
    - Recovery success-rate disclosure is absent and implementation complexity varies
  notes: The workflows are framed in buyer job-to-be-done terms so that module value can be evaluated
    against existing merchant operations.
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE041
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer/Component
  - Role
  - Dependency
  - Risk
  rows:
  - - Commerce Network data layer
    - Aggregates cross-merchant identity, device, order, and behavioral data
    - Scale and quality of merchant participation
    - If network breadth or freshness deteriorates, model quality and differentiation weaken
  - - Machine-learning decisioning layer
    - Scores transactions and automates order or workflow decisions
    - Private model training, features, and calibration pipeline
    - No public detail on model architecture, drift controls, or benchmark accuracy
  - - Order Review API
    - Real-time merchant decision surface for approval and guarantee workflows
    - API uptime, latency, and peak-event capacity
    - Throughput and SLA terms are not publicly disclosed
  - - Case Retrieval API and webhooks
    - Sync downstream dispute, reporting, and workflow events back to merchants
    - Reliable event delivery and merchant-side implementation
    - Webhook failures or lag can break downstream operations
  - - Platform integrations
    - Connect Signifyd to Shopify, BigCommerce, Magento, Salesforce Commerce Cloud, and partner ecosystems
    - Third-party platforms and extension maintenance
    - Connector drift or version lag can create merchant deployment risk
  - - Console and reporting layer
    - Gives merchants workflow visibility, analytics, and case management
    - Console availability and internal reporting completeness
    - Public materials describe the surface but not feature depth or export limits
  notes: This table focuses on the operating layers visible from public materials and avoids inventing
    unpublished internals.
  claimRefs:
  - CE010
  - CE011
  - CE013
  - CE015
  - CE017
  - CE018
  - CE033
  - CE036
