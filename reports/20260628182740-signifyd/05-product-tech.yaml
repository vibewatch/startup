  figureRefs: []
- id: trust-security-and-compliance-controls
  title: Trust, Security, and Compliance Controls
  body: >-
    Trust evidence is present but incomplete. Signifyd's public website footer links to a Security & compliance
    surface, and the status page exposes live operational health for critical services, both of which
    are useful trust signals for enterprise buyers. The company also markets products directly tied to
    sensitive identity and payment workflows, including Account Protection, Seamless SCA, and Payments
    Optimization, which implies meaningful internal controls around risk, privacy, and payment data handling
    even if those controls are not fully documented in public artifacts. The SCA materials are particularly
    relevant for European merchants because they position Signifyd as part of PSD2 compliance workflows
    rather than only a fraud vendor.


    The main diligence weakness is certification transparency. In the reviewed public set, there is no
    confirmed public SOC 2 Type II report summary, ISO 27001 certificate, or PCI DSS attestation available
    for inspection. That does not prove the controls are absent, but it does mean buyers cannot verify
    them from public evidence alone. For merchants passing identity, order, and dispute data through Signifyd,
    the absence of downloadable certification proof is a material diligence gap even though the trust
    surface itself appears intentionally maintained.
  claimRefs:
  - CE027
  - CE034
  - CE017
  - CE018
  tableRefs:
  - TE004
  figureRefs: []
- id: product-roadmap-maturity-and-differentiators
  title: Product Roadmap, Maturity, and Differentiators
  body: >-
    The product roadmap visible from public materials shows a company still expanding its platform rather
    than defending only a legacy fraud-guarantee niche. The clearest dated milestones are the July 2023
    Product Advisory Board launch, which signaled customer input from major retailers; the later commercialization
    of Chargeback Recovery and broader abuse-prevention messaging; and the September 2025 Intelligent
    Returns launch for the UK and Europe. Together, those milestones point to a strategy of moving outward
    from fraud underwriting into adjacent conversion, returns, and post-purchase revenue-protection workflows.
    Public materials do not provide a detailed 2026-2027 roadmap beyond that direction of travel.


    The main differentiator remains Signifyd's Commerce Network plus financial guarantee combination.
    Competitors may offer fraud models or payment tools, but Signifyd pairs network-scale data, merchant
    workflow automation, and explicit liability absorption. That positioning compares favorably with narrower
    point solutions such as Stripe Radar and helps explain why the company is cited as a market leader
    by Aite and by vendor-reported G2 rankings. The remaining question is whether the newer modules have
    the same maturity and measurable outcomes as the flagship guarantee products.
  claimRefs:
  - CE008
  - CE010
  - CE024
  - CE028
  - CE029
  - CE036
  - CE038
  - CE041
