- id: technology-architecture-and-commerce-network
  title: Technology Architecture and Commerce Network
  body: >-
    Signifyd does not publish deep model internals, but the public architecture picture is still directionally
    strong. The developer portal says the platform brings together big data, machine learning, zero fraud
    liability, and workflow automation, while the technology pages describe a Commerce Network spanning
    thousands of merchants and millions of shopper identities. That network is the core technical moat
    signal: Signifyd is not just scoring one merchant's orders in isolation, but training decisions from
    cross-merchant identity, device, behavioral, and order data accumulated across a large commerce graph.
    The 2021 financing release went further, saying the network covered 98% of ecommerce shoppers in major
    markets.


    Developer-signal sources reinforce that the platform is real software, not only marketing copy. Signifyd
    maintains public repositories for a Magento 2 PHP extension, a PHP library, Salesforce Commerce Cloud
    integration code, and API Blueprint documentation. Those assets indicate an operating model built
    around APIs, connectors, and merchant-platform integrations. The gap is that Signifyd does not publicly
    disclose feature engineering, training pipelines, false-positive rates, or throughput SLAs, so the
    decision engine's internal mechanics remain materially opaque despite the strong surface-level architecture
    story.
  claimRefs:
  - CE006
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE036
  - CE044
