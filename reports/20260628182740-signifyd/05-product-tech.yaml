  - TE003
  figureRefs:
  - FE001
  - FE003
- id: platform-integration-deployment-and-reliability
  title: Platform Integration, Deployment, and Reliability
  body: >-
    Deployment evidence is strongest around ecommerce ecosystem integrations rather than raw infrastructure
    documentation. Signifyd has a live Shopify app listing, a BigCommerce marketplace listing, a Magento
    2 extension in GitHub, and a Salesforce Commerce Cloud integration repository, which together show
    that the company supports both mainstream SMB platforms and more customizable enterprise commerce
    stacks. The partner page extends that picture through systems integrators, agencies, and payment companies
    such as Worldpay, Valtech, CQL, Wunderman Thompson, Lazer Technologies, and Domaine. This is important
    because for a merchant buyer, implementation risk is driven as much by the surrounding integration
    ecosystem as by the fraud model itself.


    Reliability evidence is mixed but useful. The public status page reports 100.0% uptime for the Order
    Review API over the most recent 90 days and tracks seven relevant components, including APIs, webhooks,
    console/reporting, Shopify, BigCommerce, and support systems. At the same time, the status history
    shows that incidents do occur, including a resolved partial outage in mid-June 2026. Review surfaces
    add another caution: the Shopify ratings are strong overall, but the 14% one-star share and independent
    review commentary suggest onboarding, tuning, and merchant-specific complexity can still create implementation
    pain.
  claimRefs:
  - CE013
  - CE015
  - CE017
  - CE018
  - CE019
  - CE020
  - CE022
  - CE023
  - CE037
  - CE039
  - CE040
