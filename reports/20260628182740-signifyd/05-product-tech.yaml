company:
  name: Signifyd
chapter:
  number: 5
  title: Product & Technology
  summary: Signifyd's product stack has evolved from guaranteed fraud protection into a broader commerce-risk
    platform spanning chargebacks, account takeover, authorization optimization, returns, refunds, and
    consumer-abuse prevention. Public evidence strongly supports the platform's breadth, integration footprint,
    and Commerce Network positioning, but leaves machine-learning internals, throughput SLAs, false-positive
    rates, and security-certification proof materially opaque. The result is a credible, differentiated
    product surface with real ecosystem depth and still-important diligence gaps around transparency and
    operational detail.
sections:
- id: commerce-protection-platform-definition
  title: 'Commerce Protection Platform: Definition and Customer Workflow'
  body: >-
    Signifyd's product is best understood in merchant workflow terms, not as a stand-alone fraud model.
    The Commerce Protection Platform sits in the order, payment, post-purchase, and dispute lifecycle
    for ecommerce merchants. At checkout, Signifyd evaluates an order and either approves, declines, or
    routes it for review; if an approved order later turns out to be fraudulent, the company contractually
    absorbs the covered chargeback loss. That guarantee model changes the buyer's workflow because the
    merchant is outsourcing both decisioning and part of the economic risk, not merely buying analytics.


    The workflow has broadened beyond card-not-present fraud. Signifyd now markets Complete Chargeback
    Protection for non-fraud disputes, Chargeback Recovery for disputes outside guarantee coverage, Account
    Protection for account-takeover defense, Authorization Rate Optimization for checkout approvals, Instant
    Refunds for faster post-purchase service, and Consumer Abuse Prevention plus Returns capabilities
    for policy abuse. The result is a single platform spanning pre-transaction screening, checkout conversion,
    post-purchase returns, and dispute operations. For merchants, that breadth makes Signifyd closer to
    a commerce-risk operating layer than a narrow fraud API.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE007
  - CE009
  - CE032
  - CE038
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: product-module-map
  title: 'Product Module Map: From Fraud to Returns'
  body: >-
    Public evidence supports a product map with at least eight major modules. The merchant-side pillar,
    Fearless Conversions, includes Guaranteed Fraud Protection, Complete Chargeback Protection, Chargeback
    Recovery, Account Protection, Authorization Rate Optimization, Return Insights or Intelligent Returns,
    Instant Refunds, and Consumer Abuse Prevention. The payment-provider-side pillar, Fearless Payments,
    centers on Payments Optimization for issuers and processors that want Signifyd's identity and risk
    signals in payment flows. This architecture matters because it shows the company has expanded from
    one guarantee SKU into adjacent decisioning and workflow surfaces that can raise wallet share per
    merchant.


    The module map also clarifies maturity differences. Fraud guarantees and chargeback coverage appear
    to be the oldest and most battle-tested surfaces. Account takeover, authorization optimization, and
    policy-abuse tooling represent newer but strategically important adjacencies, while Intelligent Returns
    is visibly the freshest launch with a September 2025 Europe and UK rollout. That combination creates
    a stronger platform story than many point solutions, but it also means diligence should separate mature
    guarantee modules from newer post-purchase and abuse-prevention features when underwriting product
    readiness.
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE006
  - CE008
  - CE009
  - CE024
  - CE032
  - CE041
