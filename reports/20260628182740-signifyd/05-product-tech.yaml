  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ml-architecture
    missingEvidence: Technical whitepaper or engineering blog describing model feature selection, training
      pipeline, and accuracy benchmarks.
    whyItMatters: Without ML architecture validation, the quality of fraud scores and the risk of model
      drift are opaque to buyers.
    diligencePath: Request a technical architecture briefing and sample model-accuracy reports from Signifyd;
      review any published conference presentations by Signifyd data scientists.
    relatedQuestionRefs:
    - QE004
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: Publicly available SOC 2 Type II report summary, ISO 27001 certificate, or PCI DSS
      attestation.
    whyItMatters: Merchants transmitting payment and identity data need validated security posture evidence.
    diligencePath: Request the SOC 2 Type II report directly from Signifyd and confirm PCI DSS scope plus
      compliance level.
    relatedQuestionRefs:
    - QE008
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: api-throughput
    missingEvidence: Published API throughput benchmarks, P99 response-time SLAs, and uptime guarantee
      levels.
    whyItMatters: Merchants with peak-traffic events need documented API capacity and reliability commitments.
    diligencePath: Review enterprise contract SLA terms and request API throughput benchmarks from the
      sales team.
    relatedQuestionRefs:
    - QE011
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: false-positive-rate
    missingEvidence: Independently verified false-positive rate on approved transactions versus industry
      baseline.
    whyItMatters: A high false-positive rate means lost revenue from good customers; this is a critical
      performance metric for the guarantee model.
    diligencePath: Request internal false-positive and approval-rate benchmarks, then compare them against
      public competitor disclosures such as Riskified metrics.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: minor
    topic: chargeback-recovery-rate
    missingEvidence: Published or customer-shared win rate for Chargeback Recovery disputes filed through
      Signifyd.
    whyItMatters: Win rate determines the revenue-recovery value of the Chargeback Recovery add-on product.
    diligencePath: Request case-study data or aggregate win-rate statistics from Signifyd's sales team.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
    - TE002
