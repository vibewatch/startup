  topStrengths:
    - Guarantee-backed chargeback protection creates a deeper moat than fraud scoring alone.
    - Blue-chip merchant proof and cross-merchant network data support real enterprise relevance.
    - Product expansion into payments optimization, consumer abuse, and returns increases wallet share potential.
  topRisks:
