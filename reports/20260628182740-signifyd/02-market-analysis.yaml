  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-share
      missingEvidence: >-
        Signifyd's specific market share within the ecommerce fraud detection market; the company
        does not disclose revenue, customer count, or market penetration publicly.
      whyItMatters: >-
        Market share determines whether Signifyd's growth is driven by expanding market or competitive
        displacement, which affects long-term margin and growth thesis.
      diligencePath: >-
        Request Signifyd's internal market sizing, win/loss data, and share-of-wallet estimates
        from customer account managers; cross-reference with competitive intelligence.
      relatedQuestionRefs:
        - QM004

    - type: private-evidence-only
      severity: minor
      topic: market-sizing-SAM
      missingEvidence: >-
        A credible methodology to isolate Signifyd's serviceable addressable market from public data;
        the SAM estimate requires proprietary merchant-count data broken down by revenue tier,
        vertical, and geography.
      whyItMatters: >-
        The difference between $5B and $15B SAM range represents a 3× valuation implication for
        Signifyd's long-term growth potential and required market penetration to justify current valuation.
      diligencePath: >-
        Commission a custom analyst study segmenting ecommerce merchants by revenue tier and CNP fraud
        exposure; alternatively, request Signifyd's internal SAM analysis.
      relatedQuestionRefs:
        - QM007

    - type: missing-source
      severity: minor
      topic: buyer-segment-count
      missingEvidence: >-
        A credible public estimate of the number of mid-to-large ecommerce merchants globally that
        fall within Signifyd's core addressable profile (>$10M annual ecommerce revenue, English-language
        primary markets).
      whyItMatters: >-
        Enterprise merchant count determines the theoretical limit of Signifyd's logo-expansion
        opportunity and the ceiling for customer acquisition without moving downmarket.
      diligencePath: >-
        Obtain merchant count estimates from Shopify Plus, Salesforce Commerce Cloud, or Magento
        data on active enterprise merchant accounts; cross-reference with Internet Retailer 500
        and similar lists.
      relatedQuestionRefs:
        - QM009

    - type: stale
      severity: minor
      topic: fraud-sophistication-evolution
      missingEvidence: >-
        Independent research on AI-assisted fraud sophistication evolution in 2025–2026 that
        quantifies how generative AI tools are changing fraud attack patterns and evasion rates.
      whyItMatters: >-
        AI-assisted fraud could accelerate the arms race faster than fraud prevention tools can adapt,
        increasing loss rates for guarantee providers like Signifyd if detection accuracy lags.
      diligencePath: >-
        Review published threat intelligence reports from Chainalysis, Recorded Future, or IBM
        X-Force for 2025–2026; request Signifyd's internal data on AI-driven fraud type evolution.
      relatedQuestionRefs:
        - QM022

