  title: Market Analysis
  summary: |
    Signifyd competes in the global ecommerce fraud detection and prevention market, which BRCO sizes
    at $73.5 billion in 2025 (broad definition) while Reportprime's narrower software-only estimate
    stands at $3.46 billion; the gap reflects definitional scope rather than market maturity.
    Primary growth drivers are expanding ecommerce volume, the friendly-fraud epidemic affecting 62–72%
    of merchants, and PSD2/SCA regulatory enforcement in Europe — with the key constraint being modestly
    declining overall fraud rates and strong competition from Riskified, Forter, and Kount.
    Signifyd's enterprise merchant footprint (Samsung, Lenovo, Mango, Philips, Hot Topic) and Aite
    Group's #1 ranking in the chargeback-guarantee segment position the company well, but its serviceable
    obtainable market is implied at well below $1 billion based on estimated ARR of approximately $292
    million.
sections:
  - id: market-boundary-and-definition
    title: Market Boundary and Definition
    body: |
      Signifyd operates at the intersection of three overlapping but distinct spend categories within the
      broader ecommerce risk ecosystem. The first is card-not-present (CNP) fraud detection and prevention
      — automated decisioning systems that approve or reject online orders, typically backed by a financial
      guarantee that shifts chargeback liability from the merchant to the provider. The second is chargeback
      management and recovery, which addresses post-transaction disputes across both fraud-coded and
      non-fraud categories including friendly fraud, policy abuse, and consumer abuse. The third is
      payments optimization, including Strong Customer Authentication (SCA) compliance under Europe's
      PSD2 directive. Signifyd's Commerce Protection Platform spans all three, making its total addressable
      market broader than a pure fraud-detection software comparison would suggest.

      The status-quo substitute for all three categories is either manual review (expensive, slow, and
      error-prone), rule-based decisioning engines (brittle, with high false-positive rates), or simply
      absorbing chargeback losses as a cost of doing business. Adjacent markets include broader identity
      verification and KYC/AML platforms and payment fraud analytics that primarily serve financial
      institutions rather than merchants. These adjacencies inflate the total addressable market when
      included and should be excluded when sizing the core Signifyd opportunity. The boundary distinction
      matters directly: BRCO's $73.5 billion market estimate includes fraud analytics and identity
      services for banks, while Reportprime's $3.46 billion estimate covers only merchant-facing
      fraud prevention software — a 21-fold difference that is definitional, not competitive.
