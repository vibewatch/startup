callouts:
  - calloutType: insight
    title: The 21× Gap Between BRCO and Reportprime Reflects Scope, Not Market Disagreement
    body: >-
      Analysts citing the $73.5 billion "ecommerce fraud market" typically include fraud analytics and
      identity verification services that primarily serve financial institutions. Reportprime's narrower
      $3.46 billion software-only estimate is more relevant for sizing Signifyd's competitive landscape,
      though even this understates Signifyd's total addressable revenue by excluding its financial-guarantee
      and managed-service revenue streams. Investors should anchor TAM discussions on the $3.46 billion
      software segment as a floor and recognize that Signifyd's guarantee model blurs the boundary between
      software and insurance, making it economically closer to a specialty underwriter than a pure SaaS vendor.
    claimRefs:
      - CM001
      - CM003
      - CM005
      - CM012
  - calloutType: risk
    title: Declining Fraud Rates May Dampen Adoption Urgency Among Margin-Stable Merchants
    body: >-
      The MRC's 2025 survey shows the fraud rate by revenue declined to 2.8% from 3.6%, reversing
      a multi-year trend. For merchants who are not near card network chargeback thresholds and have
      not experienced a significant fraud event, this improvement may reduce the urgency for adopting a
      guaranteed protection platform. Signifyd's ability to frame its product as a revenue enabler
      (higher approval rates, lower false declines) rather than a pure cost-reduction play is essential
      to overcome this procurement headwind.
    claimRefs:
      - CM016
      - CM017
      - CM020

