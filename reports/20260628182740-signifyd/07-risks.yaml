  - id: operational-cybersecurity-technology-risk
    title: Operational, Cybersecurity, and Technology Risk
    body: >-
      Signifyd's Commerce Protection Platform operates in real-time inside the merchant checkout flow.
      Latency or unavailability of the decisioning API does not merely degrade the fraud-prevention function—
      it directly blocks order completion and merchant revenue, creating contractual SLA exposure and
      reputational harm. The public status page at status.signifyd.com records incident history for the
      platform, and while specific incidents are not described in detail in public filings, the status page's
      existence and format confirms that the company has experienced service-level events that required
      public disclosure. Signifyd does not publish SLA thresholds, uptime guarantees, or false-positive
      rates, limiting external validation of its operational posture.

      The Commerce Network's data architecture—aggregating identity, device, and behavioural signals across
      thousands of merchant deployments and millions of shopper identities—creates a concentrated data asset
      with high adversarial value. A successful breach would expose cross-merchant purchase histories,
      device fingerprints, and identity correlations for a large fraction of US and European ecommerce
      shoppers. AWS's own data-privacy FAQ confirms that customers (i.e., tenants like Signifyd) control
      the geographic region, encryption state, and access controls for their data, and that AWS does not
      access customer content; however, the adequacy of Signifyd's own controls over this data has not been
      independently verified through any publicly disclosed security audit or PCI certification. PCI DSS
      requires merchants and service providers to protect cardholder data, and the PCI Security Standards
      Council identifies ransomware and phishing as the fastest-growing attack vectors. A breach affecting
      the Commerce Network would trigger breach-notification obligations under GDPR, UK GDPR, US state laws,
      and potentially FTC enforcement, and would severely damage Signifyd's data-sharing relationships.

      ML model drift is a structural risk for any network-effect decisioning system. As fraud patterns
      evolve—shifting towards first-party fraud, account-takeover, and policy abuse—the model must be
      continuously retrained to maintain accuracy. If retraining cycles lag behind fraud evolution, false-
      negative rates (fraudulent orders approved) rise, increasing guarantee losses, while false-positive
      rates (legitimate orders declined) rise, damaging merchant revenue and customer trust. Merchant
      complaints on Trustpilot document recurring issues with false declines of legitimate orders, which
      is consistent with model miscalibration during demand spikes or fraud-pattern transitions.
