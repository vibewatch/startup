  - id: partner-platform-dependency-risk
    title: Partner, Platform, and Market Dependency Risk
    body: >-
      Signifyd's business model depends on a web of platform integrations, financial-institution partners,
      card-network rule stability, and merchant concentration that each represent potential failure points.
      The company integrates deeply with Salesforce Commerce Cloud, Magento/Adobe Commerce, Shopify, and
      BigCommerce, among others; a material API change or policy decision by any of these platforms could
      break integrations for entire merchant cohorts simultaneously and require costly re-certification.
      Amazon Pay's own fraud-prevention and dispute capabilities represent a latent competitive and
      displacement risk: as Amazon expands its payments infrastructure, its in-house fraud decisioning
      could reduce merchant appetite for third-party middleware like Signifyd in Amazon-adjacent checkout
      flows.

      Card-network rules are not static. Visa's CE 3.0 compelling-evidence update already shifted the
      legal standard for chargeback disputes, requiring Signifyd to update its dispute-management workflows
      and guarantee logic. Future rule changes—affecting SCA exemption thresholds, chargeback reason codes,
      or dispute representment procedures—could shift liability between issuers and merchants in ways that
      alter Signifyd's guarantee scope and cost base without warning. A small number of large merchants
      likely account for a disproportionate share of Signifyd's guaranteed GMV; the documented PAB
      (Preferred Advocate Board) structure suggests key account concentration. The exit of a single large
      merchant would cause a step-change revenue decline and simultaneously shrink the Commerce Network's
      cross-merchant signal pool, degrading model accuracy for remaining merchants—a network-effect
      feedback loop in reverse. The company's Fearless Payments product relies on financial-institution
      partners willing to share risk signals; a reduction in financial-institution participation would
      directly degrade the accuracy of the network for payment-flow decisioning.
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
