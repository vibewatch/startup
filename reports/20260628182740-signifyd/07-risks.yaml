  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: guarantee-financial-exposure
      missingEvidence: >-
        Audited guarantee loss rates, net chargeback payout amounts as a percentage of guaranteed GMV,
        reserve or reinsurance details, and unit economics for the chargeback protection model.
      whyItMatters: >-
        Without disclosed loss rates or reserves, investors cannot assess whether the guarantee model
        is profitably priced or whether rising first-party fraud could trigger a loss spiral that
        impairs Signifyd's balance sheet and its ability to honour guarantee commitments.
      diligencePath: >-
        Request audited financial statements, actuarial reserve analysis, and reinsurance or capital
        arrangement details under NDA; verify with third-party fraud-analytics benchmarks.
      relatedQuestionRefs:
        - QR005
        - QR010
    - type: missing-source
      severity: material
      topic: regulatory-legal-enforcement-status
      missingEvidence: >-
        Any confirmed regulatory enforcement actions, consent orders, civil litigation filings,
        or agency investigations involving Signifyd available in public records as of June 2026.
      whyItMatters: >-
        The absence of identified enforcement actions does not rule out unreported investigations
        given Signifyd's scale of consumer data processing and automated decision-making scope;
        undisclosed regulatory exposure is a material risk for any commercial due-diligence process.
      diligencePath: >-
        Search PACER, state AG databases, ICO enforcement register, CNIL action log, FTC case
        database; request rep-and-warranty disclosure from Signifyd's legal counsel.
      relatedQuestionRefs:
        - QR012
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: PCI-security-certification-status
      missingEvidence: >-
