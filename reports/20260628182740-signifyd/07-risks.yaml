  - id: chargeback-guarantee-financial-model-risk
    title: Chargeback Guarantee and Financial Model Risk
    body: >-
      Signifyd's commercial core—the chargeback guarantee—is simultaneously its strongest differentiator and
      its most consequential financial risk. When Signifyd approves an order that subsequently results in a
      covered chargeback, the company pays the merchant the disputed amount from its own balance sheet. The
      guarantee creates an asymmetric exposure: revenue comes in as a percentage of guaranteed GMV, but
      losses arrive episodically and can spike rapidly if fraud patterns shift faster than the model retrains.
      Signifyd has never disclosed reserve levels, guarantee loss rates, or unit-economics detail, making it
      impossible for outside investors to size the tail risk.

      The environment that Signifyd's guarantee model must navigate has grown structurally more challenging.
      First-party fraud—where the legitimate cardholder commits the fraud using their own identity—rose 8%
      in the first half of 2025 according to Signifyd's own Commerce Network data, and company research
      indicates that up to one in five consumers admit to some form of first-party fraud or abuse. Because
      the authorised cardholder initiated the transaction, the fraud is extremely difficult to detect and
      defeat at approval time, and it passes through the guarantee window to become a guaranteed loss.
      Traditional methods of fighting chargebacks yield only a 17% win rate according to Signifyd's own
      published research, reinforcing how structurally difficult recovery is.

      Card-network chargeback monitoring programs create an additional exposure layer. Visa's programme
      begins flagging merchants at a 0.65% chargeback rate and imposes fines at 0.9% (Standard tier) and
      1.8%+ (Excessive tier). Mastercard's Excessive Chargeback Programme begins monitoring at 1% and
      assesses fines at 1.5%+ for two consecutive months. These thresholds constrain Signifyd's approval
      strategy: if the model becomes too aggressive in approving borderline orders to maximise merchant
      revenue, aggregate merchant chargeback rates can breach these thresholds, triggering penalties that
      damage merchant relationships. A pricing model tied to GMV percentages also creates adverse-selection
      risk: merchants may route only high-risk orders to Signifyd's guarantee while self-approving low-risk
      orders, worsening the quality of the guaranteed pool and compressing guarantee economics over time.
      The magnitude of this exposure is not publicly disclosed, constituting a material evidence gap.
    claimRefs:
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
