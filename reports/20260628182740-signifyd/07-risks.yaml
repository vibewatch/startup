callouts:
  - calloutType: risk
    title: Guarantee Loss Spiral — Primary Thesis-Break Trigger
    body: >-
      The most dangerous risk for investors is a feedback loop in which rising first-party fraud
      increases guarantee losses, prompting repricing that angers merchants, triggering churn, which
      degrades the Commerce Network's training data, worsening model accuracy, and further elevating
      losses. This spiral has no publicly disclosed circuit-breaker, and Signifyd has not confirmed any
      reserve or reinsurance mechanism that would absorb a sudden guarantee loss event.
    claimRefs:
      - CR012
      - CR013
      - CR019
      - CR025
      - CR030
      - CR031
  - calloutType: recommendation
    title: Priority Diligence — Guarantee Economics and Regulatory Compliance
    body: >-
      Two diligence workstreams are non-negotiable before any investment decision: (1) obtain audited
      guarantee loss rates, net chargeback exposure, and reserve or reinsurance detail; and (2) commission
      independent legal analysis of GDPR Article 22, EU AI Act applicability, and PCI QSA certification
      status. Both workstreams require access to non-public information that cannot be sourced from the
      public record.
    claimRefs:
      - CR001
      - CR006
      - CR011
      - CR012
      - CR018
      - CR042

