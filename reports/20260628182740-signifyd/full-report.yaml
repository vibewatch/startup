companyProfile:
  summary: >-
    Signifyd is a founder-led commerce-protection platform built for large ecommerce merchants that want to approve more
    good orders while shifting fraud and non-fraud chargeback risk off the merchant balance sheet. The company combines
    machine-learning decisioning, a cross-merchant Commerce Network, payment optimization, PSD2/SCA support,
    consumer-abuse prevention, and newer returns capabilities. The strategic attraction is a genuine underwriting wedge
    plus enterprise merchant proof; the key diligence problem is that public disclosure does not reveal the net
    economics of the guarantee model.
