      - number: '3.2'
        title: 'Chargeback-guarantee direct peers: Riskified and Forter'
        blocks:
          - type: paragraph
            body: >-
              Riskified and Forter are Signifyd's closest direct competitors. Riskified (NYSE:RSKD, listed July 2021) is
              the only peer with audited public financials; its SEC filings are accessible via EDGAR and its
              investor-relations portal shows that Q1 2026 results prompted raised full-year revenue and adjusted EBITDA
              guidance, alongside a $75M share buyback authorized in June 2026. GetLatka/PitchBook data place
              Riskified's 2024 revenue at approximately $318M, roughly at parity with Signifyd's estimated $293M,
              suggesting neither has opened a decisive revenue gap. Riskified says its AI models reduce merchants' total
              cost of fraud by as much as 50%, improve approval rates by up to 20%, and deliver 2–3x stronger fraud and
              abuse detection. The company focuses on luxury, fashion, and high-ticket ecommerce and has a partner
              network including Appriss Retail, commercetools, IXOPAY, and CellPoint Digital. Customer testimonials cite
              authorization rates near 95% and elimination of nearly all chargebacks within six months of deployment.
              Forter raised $300M Series F in April 2021 at a $3B valuation, bringing total funding to $525M. Its 2024
              estimated ARR of $103.1M (Latka) trails Signifyd and Riskified by a significant margin, though its growth
              from $36M in 2020 to $103M in 2024 is notable. The Forter Trust Platform processes $350B in GMV annually
              from over 200,000 businesses, delivering 72% average chargeback-rate reduction and 46% false-decline
              reduction. Its Decision Engine delivers 99% of decisions in under 400ms, and its customer logos — Wayfair,
              Instacart, Adidas — demonstrate enterprise reach. Forter has raised more total capital than Signifyd while
              generating less revenue, signaling higher investor expectations relative to current revenue scale.
