      - number: '3.3'
        title: 'Best-effort fraud platforms: Sift, Kount/Equifax, and ClearSale'
        blocks:
          - type: paragraph
            body: >-
              Sift, Kount/Equifax, and ClearSale occupy a distinct tier where the value proposition is risk-scoring and
              decisioning rather than financial guarantee transfer. Sift raised $50M at a $1B valuation in 2021 and
              reported an estimated $35M ARR in 2025, with approximately 318 employees. Its platform processes over one
              trillion annual events from 34,000+ sites and apps, has recognized over 1.6 billion unique digital
              footprints, and Forrester recognized it as a Leader in digital fraud management. Sift's median
              per-customer fraud-loss prevention is $4.2M annually, a meaningful ROI metric for mid-market merchants.
              Sift does not offer a financial chargeback guarantee; merchants bear residual loss. Kount was acquired by
              Equifax in February 2021 and rebranded under Equifax's Identity & Fraud Services suite, giving it access
              to Equifax's credit-bureau data and KYC compliance infrastructure. Kount's strength lies in this incumbent
              data advantage and enterprise credibility rather than a guarantee model; its resources library includes
              white papers targeting credit risk, verification, and AI-powered identity trust. ClearSale, a Brazilian
              company with North American operations, appeared in the Aite Group 2021 matrix alongside Signifyd and
              Riskified; Aite ranked it below Signifyd in that head-to-head. ClearSale is best known for human-review
              depth in Latin American and apparel markets but has materially smaller global enterprise presence than the
              guarantee-led top tier. The adverse finding for this tier is that none of these vendors offers the
              full-liability guarantee large enterprise merchants increasingly require.
