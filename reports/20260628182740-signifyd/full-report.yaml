  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              Signifyd operates across the United States, the European Union, and the United Kingdom, each of which
              imposes distinct and demanding data-protection and payment-regulation frameworks. In the United States,
              the Federal Trade Commission's Safeguards Rule (implemented under the Gramm-Leach-Bliley Act) requires
              financial-services companies handling consumer financial data to maintain a documented information
              security program with administrative, technical, and physical safeguards. Separately, the FTC Act's
              Section 5 prohibition on unfair or deceptive acts grants the FTC broad investigative and enforcement
              authority over companies whose business affects commerce, including data-driven decisioning platforms. The
              CFPB's Regulation E governs electronic fund transfer dispute rights and creates a structural environment
              for chargebacks, while Regulation Z (Truth in Lending) governs credit-card billing disputes. The Federal
              Reserve's Regulation II permits fraud-prevention adjustments to debit interchange fees, making Signifyd's
              transaction-signal quality a regulatory variable for its financial-institution partners. California's CCPA
              (amended by CPRA) grants consumers rights to know, delete, correct, and limit the use of sensitive
              personal information, covering Signifyd's large-scale processing of California consumer transaction data.

              In the EU and UK, GDPR and UK GDPR impose strict requirements including data protection by design and by
              default, lawful basis for processing, data minimisation, purpose limitation, and—critically for Signifyd's
              automated approval/denial workflow—the Article 22 right not to be subject to solely automated decisions
              with legal or similarly significant effects. The ICO's guidance on data protection by design and by
              default requires that privacy-respecting settings be the default for all processing, directly constraining
              how Signifyd's network can aggregate cross-merchant shopper data. PSD2 (Directive EU 2015/2366) mandates
              Strong Customer Authentication for most electronic payment flows in the EEA, fundamentally shaping the
              checkout environments that Signifyd's decisioning sits inside. A Signifyd-assisted SCA exemption that
              fails to meet the fraud-rate thresholds embedded in PSD2 creates bank-side liability exposure for
              financial institution partners. PCI-DSS standards imposed by the card networks require rigorous controls
              for any entity that stores, processes, or transmits cardholder data; phishing and ransomware are
              identified by the PCI Security Standards Council as the fastest-growing threat vectors. An emerging layer
              of AI regulation—including the EU AI Act's risk-tiering of automated decisioning systems used in financial
              services—could require Signifyd to demonstrate explainability, auditability, and human-override capability
              for its approval/denial models, raising compliance costs and potentially constraining the model
              architectures the company can deploy.
