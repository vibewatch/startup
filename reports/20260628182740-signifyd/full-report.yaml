  - id: FV001
    title: Recommendation Logic — From Evidence to TRACK
    type: flow
    layout: standard
    summary: >-
      Traces the evidence chain from market scale through product proof, competitive moat, and financial opacity to the
      TRACK recommendation.
    data:
      nodes:
        - id: market
          label: 'Market: $34B+ fraud losses; ecommerce non-cash volumes growing (Capgemini 2025)'
        - id: product
          label: 'Product: Chargeback guarantee + Commerce Network + returning products = deep embedding'
        - id: moat
          label: 'Moat: Cross-merchant signal advantage; FIS distribution; 5–7% revenue-lift proof'
        - id: financial
          label: 'Financials: $293M est. revenue but guarantee economics opaque; 5-yr mark stale'
        - id: comp
          label: 'Public Comp: Riskified EV/Revenue 1.32x vs. Signifyd implied 4.6x at 2021 mark'
        - id: recommendation
          label: 'Recommendation: TRACK — real business, expensive 2021 mark; re-engage on repricing'
      edges:
        - from: market
          label: validates TAM
          to: product
        - from: product
          label: embeds in checkout
          to: moat
