      - number: '8.4'
        title: Financing Context, Entry Discipline, and Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              Signifyd's last disclosed financing event was the April 2021 Series E: $205 million at a $1.34 billion
              post-money valuation, led by Owl Rock Capital with FIS, CPP Investments, and Neuberger Berman. Cumulative
              disclosed funding stands at approximately $390 million across six rounds. The cap-table profile is heavily
              institutional with prior-round investors including Andreessen Horowitz (Series C, 2017), Premji Invest
              (Series D, 2018), and FIS as a strategic investor. No public evidence exists of a financing event,
              secondary transaction, or 409A valuation update between April 2021 and June 2026 — a five-year gap that is
              unusual for a company at this scale.

              Entry discipline is critical for new investors. The $1.34 billion 2021 mark was set at the peak of the
              2021 fintech/SaaS multiple expansion when companies of Signifyd's profile were trading at 7–10x forward
              revenue. Current market conditions — anchored by Riskified's 1.32x EV/Revenue — imply that a new investor
              paying the 2021 price would be buying at roughly 4.6x estimated 2024 revenue, a 350% premium to the public
              comparable multiple. That premium is difficult to justify without evidence of (a) meaningfully higher
              revenue growth, (b) demonstrated profitability, or (c) strategic acquisition optionality at a control
              premium.

              Preference overhang is a secondary concern. With $390 million of cumulative funding and a Series E at
              $1.34 billion, the Series E investors likely hold participating preferred shares with liquidation
              preferences. If the company exits at $400–$600 million in the base case, Series E investors may recover
              their principal but common shareholders would receive little residual value, creating misaligned
              incentives around exit timing. The post-2021 absence of new financing also raises the question of whether
              existing investors have written down the position internally (consistent with broad 2022–2024 private
              market repricing) or are holding at cost, which would affect the negotiated exit price in any M&A or
              secondary process.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
