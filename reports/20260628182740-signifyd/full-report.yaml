      - number: '8.2'
        title: Comparable Valuation and Public Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Riskified is the canonical anchor for Signifyd's valuation analysis because it is the only publicly
              traded, audited, standalone chargeback-guarantee fraud-prevention company at comparable revenue scale.
              Riskified's FY2025 20-F (filed March 2026) reports revenue of $344.6 million, up 5.2% from $327.5 million
              in FY2024, with a net loss of $27.6 million and positive free cash flow of $33.1 million. As of late June
              2026, Riskified trades at approximately $4.41 per share, implying a market capitalization of $728.8
              million and, after subtracting net cash of $272.6 million, an enterprise value of approximately $456
              million. The resulting EV/FY2025 Revenue multiple is 1.32x, and against the FY2026 revenue guidance
              midpoint of $380 million it is 1.20x. Five sell-side analysts cover the stock with a "Moderate Buy"
              consensus and an average 12-month price target of $5.69 (29% upside from the June 2026 price); the bear
              case is $4.50, implying an EV/Revenue multiple of approximately 1.0x.

              Applying the 1.32x Riskified public proxy to Signifyd's estimated $292.8 million 2024 revenue produces an
              implied EV of $387 million. Private companies typically trade at a premium to public comps due to
              scarcity, control, and exit-option value; a 1.5x premium produces $580 million, a 2.0x premium $774
              million. None of these scenarios supports the $1.34 billion 2021 unicorn mark under current market
              conditions without materially higher revenue or profitability evidence.

              The broader private-comparable picture is incomplete. Forter raised $300 million at a $3 billion valuation
              in April 2021, but GetLatka estimates Forter's 2024 revenue at approximately $103 million — far below
              Signifyd's scale — meaning Forter's 2021 mark is even more stretched than Signifyd's on a revenue-multiple
              basis. Equifax's 2021 acquisition of Kount set a strategic M&A benchmark but the purchase price was
              undisclosed, limiting its use as a precise reference. Sift, the mid-market peer, remains private with no
              disclosed valuation. In aggregate, the public comp set (Riskified only) and the private-comp set (Forter,
              Sift, Kount/Equifax — all at 2021-era marks) suggest that $400–$750 million is the defensible valuation
              range under current market conditions, with a bull-case ceiling near $900 million contingent on
              demonstrated profitability progress.
            claimRefs:
