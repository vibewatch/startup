            body: >-
              The public leadership picture is founder-led but only partially transparent. Ramanand remains CEO and the
              most visible external executive, while Liberty is still acknowledged as co-founder in official
              storytelling even though current operating responsibilities are not publicly spelled out. Recent product
              and customer-facing announcements identify J. Bennett on customer strategy and Nikhita Hyett as a general
              manager driving the Europe-focused returns product launch, which suggests a bench beyond the founders but
              not a fully disclosed executive roster. Governance transparency is the weak point. Signifyd's official
              pages do not enumerate board seats, committee structure, or voting control by the investor syndicate.
              Because the business combines SaaS economics with guarantee exposure, missing board and risk-committee
              information is more material than for a typical pure-software vendor. The practical read is that Signifyd
              has founder continuity and public customer-facing leaders, but outside investors still need a direct
              governance package before underwriting control, reserve-setting, and expansion discipline.
