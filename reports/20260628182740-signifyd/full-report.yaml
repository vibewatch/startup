      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: |
              Signifyd's customer base is clearly concentrated in mid-to-large enterprise ecommerce retailers.
              By vertical sector, 43.4% of merchants equipped with Signifyd technology operate in online shopping,
              18.2% in fashion and beauty, and 11.5% in marketing and merchandising. Geographically, 52.5% of
              Signifyd-equipped merchants are US-based, with Canada at 7.7% and the UK at 6.6% — confirming the
              company's English-language market orientation. Named enterprise customers including Samsung, Lenovo,
              Mango, Philips, and Hot Topic represent the upper tier of the merchant size distribution, validating
              Signifyd's focus on accounts where chargeback exposure is large enough to justify custom pricing and
              full-platform deployment.

              Budget ownership in this segment typically spans the ecommerce or digital director, the VP of
              payments, and the CFO. Signifyd's pricing is custom and usage-based with no published rate card; all
              plans include a 100% financial guarantee on approved orders, making the ROI calculation direct.
              Adoption triggers fall into three categories: (1) chargeback rates approaching card network
              thresholds; (2) false decline losses discovered during revenue analysis; and (3) regulatory catalysts
              such as PSD2/SCA in Europe, which forces merchants to upgrade their payment authentication stack.
              The full adoption path typically begins with a pilot covering one product category or geography,
              followed by full deployment once approval rate uplift and chargeback reduction are demonstrated.
              Signifyd's 100% financial guarantee means the merchant bears no residual fraud risk on approved
              orders, transforming fraud management from a cost center into a revenue enablement function.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
