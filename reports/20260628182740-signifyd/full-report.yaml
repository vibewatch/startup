      - number: '4.4'
        title: Capital Adequacy, Funding Runway, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Signifyd's capital history is documented in the Company Overview chapter. For capital-adequacy assessment,
              the operative facts are that the last publicly disclosed financing event was the April 2021 Series E
              ($205M at $1.34B valuation, led by Owl Rock Capital with FIS, CPP Investments, and Neuberger Berman), and
              that no follow-on round has been announced in the 2022–2026 window. GetLatka estimates total lifetime
              funding at $390M across six rounds from the 2012 seed through the 2021 Series E. Headcount data provides
              an indirect burn signal: the same source shows employment declining from approximately 553–558 in
              mid-to-late 2023 to roughly 512 in November 2025, a roughly 8% reduction. That trajectory is consistent
              with either deliberate cost optimization ahead of a profitable inflection or a measured response to
              slowing growth — without cash flow data, both interpretations are plausible. The financing model's
              dependency risk is concentrated in the guarantee underwriting itself. If Signifyd were to experience a
              large-scale loss event — a systemic fraud wave, a high-concentration customer experiencing outsized
              chargebacks, or an adverse change in card-network chargeback rules — the resulting claims could strain
              operating cash. Whether reserves are externally funded, held on the balance sheet, or backed by credit
              facilities is entirely private. The BusinessWire Series E announcement cited Owl Rock Capital as lead
              investor — a credit-oriented alternative asset manager — which may imply that the financing structure
              included structured debt or credit components alongside equity, but no details were disclosed. For
              comparison, Forter raised $525M in total capital at a $3B valuation (Series F, April 2021) to fund a
              similar trajectory. Equifax's $640M acquisition of Kount in 2021 set a benchmark for incumbent
              consolidation multiples in the sector, suggesting that strategic exit optionality exists for
              guarantee-model vendors at Signifyd's scale if organic capital needs arise. The key diligence gap is
              straightforward: cash on hand, monthly burn, credit facility terms, and reserve balance must be disclosed
              before capital adequacy can be underwritten.
