      - number: '8.5'
        title: Exit Readiness and Strategic Paths
        blocks:
          - type: paragraph
            body: >-
              Signifyd's most likely exit paths are strategic acquisition, secondary market transaction, or IPO, roughly
              in that order of probability given current market conditions. A strategic acquirer with genuine
              distribution synergies — most plausibly FIS (already an investor), Visa, Mastercard, Adyen, or a large
              digital commerce platform — could justify a premium to public comps because the Commerce Network data
              would be additive rather than purely financial. FIS's existing investment creates both a preferential
              access advantage and a potential conflict if Signifyd's executive team views FIS as a strategic partner
              versus a buyer. A Visa/Mastercard acquisition would be the highest synergy scenario given the
              card-network's interest in reducing chargeback dispute volumes system-wide, but also faces the greatest
              regulatory antitrust scrutiny.

              An IPO at sub-$1 billion valuation would require demonstrating profitability progress not yet visible in
              public data. Riskified's experience — trading at 0.6x revenue at its 2022 trough before recovering to 1.3x
              — suggests that a fraud-prevention IPO in the current market requires a credible path to Adjusted EBITDA
              profitability within 12–18 months of listing. Signifyd would need to disclose guarantee loss rates,
              reserve methodology, and unit economics that have never been made public, creating material S-1
              preparation risk. A secondary market transaction (tender offer, secondary block, or structured liquidity
              event) is the most realistic near-term liquidity option for existing investors, but would reprice the
              company well below the 2021 mark and require investor alignment.

              Exit readiness gaps are material: no audited public financials, no disclosed ARR or NRR, no board
              composition disclosure, and no guidance on guarantee loss ratios. These gaps would need to be closed six
              to twelve months before any IPO or controlled auction process. The Capgemini World Payments Report 2025
              confirms that the global non-cash transaction market continues to grow, validating the underlying market
              opportunity, but market growth does not guarantee Signifyd's ability to capture value at the 2021 mark.
            claimRefs:
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
      - number: '8.6'
        title: Thesis-Break Triggers and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The TRACK recommendation converts to INVEST only if the following conditions are met: (1) Management
              provides audited or reviewed financials showing 2025 revenue ≥$320 million, gross margin ≥50% net of
              guarantee losses, and Adjusted EBITDA margin improvement year-on-year. (2) Guarantee loss rate on approved
              portfolio is disclosed and confirmed below 0.3% of approved GMV. (3) Net Revenue Retention is confirmed
              ≥100% across the existing merchant cohort. (4) Entry price is ≤2x forward revenue — approximately
              $640–$700 million on $320–$350 million 2025E revenue. (5) An IPO or M&A process has been publicly
              initiated within 18 months with a credible acquirer or banker mandate.

              Kill criteria that would trigger AVOID: (a) A disclosed or leaked chargeback-loss spike causing net margin
              deterioration of >5 percentage points from the current estimate. (b) Loss of a top-3 merchant relationship
              representing >10% of estimated revenue. (c) A capital raise priced below the 2021 $1.34 billion mark
              without commensurate operational improvement — a signal that insiders are acknowledging mark-to-market
              deterioration. (d) Any EU AI Act enforcement action or GDPR fine requiring material changes to the
              automated decisioning architecture. (e) FIS (an investor) making a competing fraud-prevention acquisition
              that would structurally disadvantage Signifyd's distribution access.

              Final diligence asks are concentrated on the guarantee model: (1) Audited P&L including chargeback losses
              as a line item. (2) Rolling 12-month cohort-level guarantee loss rate by merchant vertical. (3) Reserve
              balance and methodology. (4) Net Revenue Retention by cohort vintage. (5) Board composition, investor
              voting control, and preference stack by series. (6) EMEA revenue contribution and SCA exemption approval
              rate. (7) 2026 pipeline and guidance narrative from CFO. Without these seven data points, the TRACK stance
              cannot be upgraded; all valuation scenarios remain wide-range estimates that may be materially off from
              the company's actual economic position.
            claimRefs:
              - CV046
              - CV047
              - CV048
              - CV049
              - CV050
