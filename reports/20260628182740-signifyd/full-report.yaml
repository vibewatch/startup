      - number: '7.2'
        title: Chargeback Guarantee and Financial Model Risk
        blocks:
          - type: paragraph
            body: >-
              Signifyd's commercial core—the chargeback guarantee—is simultaneously its strongest differentiator and its
              most consequential financial risk. When Signifyd approves an order that subsequently results in a covered
              chargeback, the company pays the merchant the disputed amount from its own balance sheet. The guarantee
              creates an asymmetric exposure: revenue comes in as a percentage of guaranteed GMV, but losses arrive
              episodically and can spike rapidly if fraud patterns shift faster than the model retrains. Signifyd has
              never disclosed reserve levels, guarantee loss rates, or unit-economics detail, making it impossible for
              outside investors to size the tail risk.

              The environment that Signifyd's guarantee model must navigate has grown structurally more challenging.
              First-party fraud—where the legitimate cardholder commits the fraud using their own identity—rose 8% in
              the first half of 2025 according to Signifyd's own Commerce Network data, and company research indicates
              that up to one in five consumers admit to some form of first-party fraud or abuse. Because the authorised
              cardholder initiated the transaction, the fraud is extremely difficult to detect and defeat at approval
              time, and it passes through the guarantee window to become a guaranteed loss. Traditional methods of
              fighting chargebacks yield only a 17% win rate according to Signifyd's own published research, reinforcing
              how structurally difficult recovery is.

              Card-network chargeback monitoring programs create an additional exposure layer. Visa's programme begins
              flagging merchants at a 0.65% chargeback rate and imposes fines at 0.9% (Standard tier) and 1.8%+
              (Excessive tier). Mastercard's Excessive Chargeback Programme begins monitoring at 1% and assesses fines
              at 1.5%+ for two consecutive months. These thresholds constrain Signifyd's approval strategy: if the model
              becomes too aggressive in approving borderline orders to maximise merchant revenue, aggregate merchant
              chargeback rates can breach these thresholds, triggering penalties that damage merchant relationships. A
              pricing model tied to GMV percentages also creates adverse-selection risk: merchants may route only
              high-risk orders to Signifyd's guarantee while self-approving low-risk orders, worsening the quality of
              the guaranteed pool and compressing guarantee economics over time. The magnitude of this exposure is not
              publicly disclosed, constituting a material evidence gap.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR040
              - CR043
          - type: table
            tableRef: TR005
            claimRefs: []
      - number: '7.3'
        title: Operational, Cybersecurity, and Technology Risk
        blocks:
          - type: paragraph
            body: >-
              Signifyd's Commerce Protection Platform operates in real-time inside the merchant checkout flow. Latency
              or unavailability of the decisioning API does not merely degrade the fraud-prevention function— it
              directly blocks order completion and merchant revenue, creating contractual SLA exposure and reputational
              harm. The public status page at status.signifyd.com records incident history for the platform, and while
              specific incidents are not described in detail in public filings, the status page's existence and format
              confirms that the company has experienced service-level events that required public disclosure. Signifyd
              does not publish SLA thresholds, uptime guarantees, or false-positive rates, limiting external validation
              of its operational posture.

              The Commerce Network's data architecture—aggregating identity, device, and behavioural signals across
              thousands of merchant deployments and millions of shopper identities—creates a concentrated data asset
              with high adversarial value. A successful breach would expose cross-merchant purchase histories, device
              fingerprints, and identity correlations for a large fraction of US and European ecommerce shoppers. AWS's
              own data-privacy FAQ confirms that customers (i.e., tenants like Signifyd) control the geographic region,
              encryption state, and access controls for their data, and that AWS does not access customer content;
              however, the adequacy of Signifyd's own controls over this data has not been independently verified
              through any publicly disclosed security audit or PCI certification. PCI DSS requires merchants and service
              providers to protect cardholder data, and the PCI Security Standards Council identifies ransomware and
              phishing as the fastest-growing attack vectors. A breach affecting the Commerce Network would trigger
              breach-notification obligations under GDPR, UK GDPR, US state laws, and potentially FTC enforcement, and
              would severely damage Signifyd's data-sharing relationships.

              ML model drift is a structural risk for any network-effect decisioning system. As fraud patterns
              evolve—shifting towards first-party fraud, account-takeover, and policy abuse—the model must be
              continuously retrained to maintain accuracy. If retraining cycles lag behind fraud evolution, false-
              negative rates (fraudulent orders approved) rise, increasing guarantee losses, while false-positive rates
              (legitimate orders declined) rise, damaging merchant revenue and customer trust. Merchant complaints on
              Trustpilot document recurring issues with false declines of legitimate orders, which is consistent with
              model miscalibration during demand spikes or fraud-pattern transitions.
            claimRefs:
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR041
