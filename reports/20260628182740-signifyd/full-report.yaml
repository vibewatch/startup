  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Commerce Protection Platform: Definition and Customer Workflow'
        blocks:
          - type: paragraph
            body: >-
              Signifyd's product is best understood in merchant workflow terms, not as a stand-alone fraud model. The
              Commerce Protection Platform sits in the order, payment, post-purchase, and dispute lifecycle for
              ecommerce merchants. At checkout, Signifyd evaluates an order and either approves, declines, or routes it
              for review; if an approved order later turns out to be fraudulent, the company contractually absorbs the
              covered chargeback loss. That guarantee model changes the buyer's workflow because the merchant is
              outsourcing both decisioning and part of the economic risk, not merely buying analytics.


              The workflow has broadened beyond card-not-present fraud. Signifyd now markets Complete Chargeback
              Protection for non-fraud disputes, Chargeback Recovery for disputes outside guarantee coverage, Account
              Protection for account-takeover defense, Authorization Rate Optimization for checkout approvals, Instant
              Refunds for faster post-purchase service, and Consumer Abuse Prevention plus Returns capabilities for
              policy abuse. The result is a single platform spanning pre-transaction screening, checkout conversion,
              post-purchase returns, and dispute operations. For merchants, that breadth makes Signifyd closer to a
              commerce-risk operating layer than a narrow fraud API.
