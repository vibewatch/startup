  - id: FV004
    title: Investment KPIs — Scoring Across Seven Dimensions
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring of Signifyd across market, product proof, moat, economics, risk, valuation, and evidence quality
      dimensions (1–10 scale).
    data:
      items:
        - label: Market Opportunity
          value: 8
          note: $34B+ fraud losses; non-cash ecommerce growing; global TAM expanding
        - label: Product and Proof
          value: 7
          note: Blue-chip logos; 5–7% revenue lift case studies; returns and payments products live
        - label: Competitive Moat
          value: 7
          note: Commerce Network data advantage; switching costs; FIS distribution access
        - label: Unit Economics
          value: 3
          note: Guarantee model opaque; no disclosed loss rates, NRR, or net margin
        - label: Risk Profile
          value: 3
          note: Guarantee tail-risk; five-year mark staleness; regulatory and first-party fraud exposure
        - label: Valuation
          value: 2
          note: 2021 mark ~4.6x estimated 2024 revenue vs. Riskified public comp at 1.32x EV/Revenue
        - label: Evidence Quality
          value: 4
          note: Revenue scale directionally confirmed; economics and cap table entirely private
    approximationNotes: >-
      Scores are analytic judgements on a 1–10 scale. Scores of 1–3 indicate material concern; 4–6 indicate incomplete
      evidence with mixed signals; 7–9 indicate strong public evidence.
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV011
      - CV014
      - CV025
      - CV039
