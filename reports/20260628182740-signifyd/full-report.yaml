      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Bull case (probability: 20%): Signifyd demonstrates 2025 revenue of $330–$350 million (12–16% YoY growth
              from the $293M estimate), improving Adjusted EBITDA margins, and initiates an IPO or strategic sale
              process by mid-2027. In this scenario, a 2.5–3x EV/Revenue multiple (premium over Riskified's public print
              reflecting private-company scarcity and higher growth) yields a valuation range of $825 million to $1.05
              billion — below the 2021 mark but arguably reflective of residual enterprise value. The bull case depends
              on: (a) verified profitability improvement in the guarantee model, (b) EMEA payment optimization reaching
              $20M+ revenue contribution, and (c) Intelligent Returns generating meaningful merchant adoption. Key
              enabling trigger: management opening the books with a forward-looking ARR and EBITDA projection.

              Base case (probability: 55%): Revenue growth approximates Riskified's pace (5–10% YoY), producing 2025E
              revenue of $307–$322 million. Applying a 1.5–2x private premium over Riskified's 1.32x EV/Revenue multiple
              yields a valuation range of $610–$850 million at 2025E revenue, or roughly $460–$640 million at the lower
              end of Riskified-parity. A secondary transaction or SPAC-style event would likely clear at the midpoint,
              approximately $550–$680 million. This is a meaningful haircut from the $1.34 billion 2021 mark and would
              represent a flat-to-down round for investors who entered at Series E. The base case assumes no material
              deterioration in guarantee economics and continued merchant base stability.

              Bear case (probability: 25%): Guarantee model economics deteriorate from elevated first-party fraud and
              adverse-selection dynamics, reducing net margin materially and forcing a capital raise or sale at or below
              Riskified's public EV/Revenue multiple. At 1.0–1.3x 2025E revenue of $307–$322 million, the enterprise
              value range is $307–$419 million — a 69–77% decline from the 2021 mark. This bear case is triggered by:
              (a) a disclosed chargeback-loss spike, (b) large-merchant churn (e.g., loss of a top-5 merchant), or (c) a
              regulatory action requiring material product redesign. There is no publicly disclosed data that confirms
              or rules out this scenario; guarantee economics are entirely opaque.
