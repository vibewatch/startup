      - number: '4.2'
        title: Pricing, GTM Motion, and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Signifyd's go-to-market model combines direct enterprise sales with a platform-partnership channel that
              lowers the cost of mid-market penetration. The pricing page explicitly describes integration plugins for
              Shopify, BigCommerce, Adobe Commerce, and Salesforce Commerce Cloud as a rapid-deployment path, allowing
              smaller merchants to activate without a dedicated API integration. Enterprise accounts — Samsung, Lenovo,
              Walmart Mexico, Mango, Philips, Hot Topic — are served through direct relationships with named customer
              success teams. This dual-channel structure is consistent with how fraud-guarantee vendors typically
              segment their books: high-AoV, high-complexity enterprise accounts that justify consultative selling and
              custom contract terms, alongside a long tail of mid-market merchants acquired through platform
              marketplaces at lower CAC. The commercial outcome evidence is strong at the customer level. Hot Topic's
              deployment produced a $10M annual revenue uplift and 99%+ approval rates. Cymbiotika achieved $1.2M in
              annual savings and 93% fewer chargebacks. Ferguson Home reached 98.5% approval with zero fraud loss.
              Lenovo's VP of Americas Ecommerce explicitly credits Signifyd with opening the sales funnel for high-AoV
              transactions that were previously blocked by over-conservative fraud controls. Mango's payments director
              notes cross-merchant shopping behavior as the key differentiator. These customer-level ROI figures are
              material to the sales cycle but do not translate directly into contract sizes or realized average revenue
              per merchant. Without cohort data, churn rate, or customer count, standard SaaS efficiency metrics (CAC,
              LTV, payback period) cannot be calculated from public sources. Revenue per employee — approximately $572K
              on the GetLatka estimate against 512 employees — is consistent with a high-leverage software business,
              though the estimate carries meaningful uncertainty and the guarantee exposure makes this metric less
              directly comparable to pure-SaaS benchmarks.
            claimRefs:
              - CI009
              - CI010
              - CI011
