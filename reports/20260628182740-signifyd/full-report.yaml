    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Signifyd's core identity is unusually clear for a private company. The company says it was founded in 2011
              after co-founders Mike Liberty and Raj Ramanand left PayPal, started in a Palo Alto coworking space, and
              pivoted from simple order scoring to guaranteed fraud protection for online merchants. That founding story
              still explains the current product mix. Signifyd is not merely a rules engine or checkout widget; it is an
              underwriting and decisioning platform that approves ecommerce orders, absorbs approved fraud and non-fraud
              chargebacks, and increasingly extends into payment optimization, shopper identity, returns, and
              consumer-abuse prevention. The key implication is that revenue quality depends on both software adoption
              and disciplined loss management. Official product pages and independent reviews consistently frame the
              company as a Commerce Protection Platform for large retailers, with guaranteed approvals and automated
              workflows as its differentiation rather than standalone analytics alone.
