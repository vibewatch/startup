  - id: FI001
    title: Revenue Model Bridge — From Merchant Transaction to Signifyd Revenue
    type: flow
    layout: standard
    summary: >-
      End-to-end flow showing how a merchant transaction converts into Signifyd's revenue and creates the underlying
      guarantee liability. All node labels are based on verified product descriptions.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI008
      - CI012
      - CI028
    data:
      nodes:
        - id: order-submission
          label: Merchant receives online order
          detail: >-
            Customer submits order on merchant's ecommerce platform; order data transmitted to Signifyd API in real
            time.
          tone: neutral
        - id: network-scoring
          label: Commerce Network scoring (real-time)
          detail: >-
            Signifyd's AI cross-references the order against its Commerce Network covering 98%+ of shoppers in major
            markets. Decision delivered in milliseconds with approval or decline recommendation.
          tone: positive
        - id: guarantee-decision
          label: Signifyd issues guaranteed approval or decline
          detail: >-
            Approved orders carry 100% financial protection: Signifyd absorbs fraud and non-fraud chargebacks under
            Complete Chargeback Protection. Declined orders create no liability.
          tone: positive
        - id: order-fulfillment
          label: Merchant fulfills approved order
          detail: Merchant ships or delivers; revenue recognized. Signifyd's guarantee covers approved order from this point.
          tone: positive
        - id: chargeback-event
          label: Chargeback filed (if any)
          detail: >-
            If fraud or first-party dispute arises, Signifyd absorbs the loss including chargeback amount, shipping
            fees, and processor fees. This is Signifyd's direct cost of revenue.
          tone: negative
        - id: fee-income
          label: Signifyd charges basis-point fee on approved GMV
          detail: >-
            Usage-based fee assessed on approved gross merchandise value. Custom rate per merchant; no published rack
            rate. This is Signifyd's gross revenue line.
          tone: positive
    approximationNotes: >-
      Revenue mechanism and product terms are drawn from official Signifyd product pages and press releases. Specific
      basis-point rates are not publicly disclosed; the flow represents the structural mechanism only. Chargeback
      absorption shown as a cost node reflects Signifyd's own description of its guarantee obligation.
  - id: FI002
    title: Unit Economics Bridge — Guarantee Fee vs. Loss Exposure
    type: flow
    layout: standard
    summary: >-
      Qualitative unit economics bridge showing the path from approved GMV to gross profit for a guarantee-model fraud
      vendor. Numeric inputs are unavailable; nodes are labeled with available industry benchmarks as proxies.
    claimRefs:
      - CI013
      - CI015
      - CI016
      - CI017
      - CI024
      - CI037
    data:
      nodes:
        - id: approved-gmv
          label: Approved GMV (merchant portfolio)
          detail: >-
            Total gross merchandise value of orders approved by Signifyd. Basis for fee revenue. Public GMV not
            disclosed.
          tone: neutral
        - id: gross-fee-revenue
          label: Gross fee revenue (basis points on approved GMV)
          detail: Custom rate per merchant, not published. Drives $292.8M estimated ARR (GetLatka). No rack rate available.
          tone: positive
        - id: fraud-loss-absorption
          label: Less — fraud and chargeback loss absorption
          detail: >-
            Approved orders that generate fraud chargebacks are absorbed by Signifyd. Industry average: ~50bps
            unrecovered chargebacks per Signifyd data. Total fraud cost = $4.61 per $1 lost (Chargebacks911 2025).
          tone: negative
        - id: gross-profit
          label: Gross profit (fee revenue minus loss absorption)
          detail: >-
            Net of chargeback losses. Gross margin is entirely private; cannot be derived from public sources.
            Riskified's public filings are the only comparable; pull 20-F for proxy range.
          tone: neutral
        - id: opex
          label: Less — operating expenses (R&D, sales, G&A)
          detail: >-
            ~512 employees at estimated average fully-loaded cost. R&D for AI/ML and network infrastructure is the
            primary expense category.
          tone: negative
        - id: ebitda
          label: EBITDA (estimated range — private)
          detail: >-
            Not publicly available. Riskified's Q1 2026 raised EBITDA guidance and $75M buyback signal that the
            guarantee model can be EBITDA-positive at ~$300M revenue. Signifyd requires validation.
          tone: neutral
    approximationNotes: >-
      Signifyd's gross margin, loss absorption rate, and operating expenses are private and unavailable from public
      sources. Numeric values for the guarantee loss node are drawn from Signifyd's own published research (50bps
      average unrecovered chargebacks) and Chargebacks911's 2025 industry data ($4.61/$1 fraud cost). These are industry
      references, not company-specific actuals. The Riskified proxy is directional only. All nodes lacking
      company-specific data are labeled private/unavailable.
