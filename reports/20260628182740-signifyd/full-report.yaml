      - number: '4.6'
        title: Financial Verdict and Key Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Signifyd's revenue quality is among the highest available for a private growth-stage company. The
              chargeback guarantee model creates deep product embeddedness: the cost of switching vendors mid-flight is
              high, customer ROI is directly measurable, and the platform value compounds as the Commerce Network
              ingests more merchant data. Publicly verifiable customer outcomes (Hot Topic, Lenovo, Mango, Cymbiotika)
              indicate that the commercial proposition is real and defensible. The strategic logic of a $300M-scale
              fraud guarantee platform in a market growing at high single to low double digits annually is coherent and
              supported by Riskified's trajectory as a listed peer. Three financial risks are material and unresolvable
              without management access. First, gross margin and loss ratio: the guarantee model's economics hinge on
              how accurately Signifyd prices and reserves against chargeback exposure. No public data exists on what
              share of approved GMV converts to fraud claims, what the reserve methodology is, or what the actual gross
              margin is after loss absorption. Second, capital runway: the five-year gap since the last disclosed
              financing event is unusual for a company at this scale. Employee headcount decline from ~558 to ~512
              provides a weak positive burn signal but does not resolve the cash question. Third, customer
              concentration: Samsung, Lenovo, and Walmart Mexico represent visible marquee accounts but their individual
              revenue contribution is unknown; high concentration in a few large accounts would amplify churn risk in
              the guarantee book. The public financial comparison with Riskified is structurally encouraging — the
              NYSE-listed peer's Q1 2026 guidance raise and $75M buyback suggest the guarantee model can be
              cash-generative at scale — but the read-through to Signifyd requires validation. Underwriting the current
              $1.34B+ implied valuation requires, at minimum, audited revenue, gross margin, chargeback loss history,
              reserve balance, and current cash runway from the company's own financial statements.
            claimRefs:
              - CI003
              - CI005
              - CI008
              - CI009
              - CI012
              - CI013
              - CI018
              - CI019
