  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Signifyd's revenue architecture is built around a financial guarantee rather than a pure software
              subscription. The core mechanism is a usage-based fee — expressed in basis points on approved gross
              merchandise value — charged to merchants in exchange for 100% liability coverage on fraud-related
              chargebacks and, at the Complete Chargeback Protection tier, on all chargeback types including first-party
              and policy-abuse disputes. This model is structurally different from traditional SaaS because the revenue
              line is inseparable from an underwriting exposure: every approved order that later generates a chargeback
              becomes a claims event that Signifyd absorbs. The company's pricing page confirms a "transparent,
              usage-based pricing" construct with custom quotes for each merchant, calibrated to order volume, vertical,
              and performance goals. No rack rate, tier threshold, or example basis-point range is published publicly.
              Signifyd's product mix extends beyond the flagship guarantee into three adjacent revenue streams: Payments
              Optimization (SCA/PSD2 exemption routing for European merchants, also guaranteed), Consumer Abuse
              Prevention (post-purchase policy-abuse and returns management), and Chargeback Recovery (non-fraud dispute
              representment). Each product line augments the per-merchant revenue relationship and deepens switching
              costs, but their individual revenue contribution and margin profiles remain private. The company's own
              Series E press release stated the platform provides merchants with an average 5%–7% revenue lift, a key
              commercial argument that frames Signifyd's fee as self-funding from approval-rate improvement rather than
              a net cost. Third-party estimates (GetLatka, November 2024) place 2024 revenue at approximately $292.8M, a
              figure that would represent meaningful scale if corroborated. Riskified, the only audited public
              comparable in the chargeback-guarantee segment, reported approximately $318M in 2024 revenue per the same
              data source, implying the two leaders are at rough parity. Neither company discloses gross margin, making
              the economics of the guarantee exposure itself the central private underwriting variable.
            claimRefs:
