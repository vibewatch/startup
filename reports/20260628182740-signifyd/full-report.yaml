      - number: '3.4'
        title: 'Payment-ecosystem substitutes: Stripe Radar and embedded fraud tools'
        blocks:
          - type: paragraph
            body: >-
              Stripe Radar represents the most structurally disruptive competitive force for Signifyd in the mid-market,
              because it turns fraud prevention into a zero-marginal-cost feature of the payment stack. Stripe processes
              payments from 197 countries with over $1.9 trillion annually; its network assigns a 92% probability that
              any card has been seen previously on the Stripe ecosystem. Radar reduces fraud by 32% on average and
              requires zero integration for existing Stripe merchants — a decisive go-to-market advantage versus
              Signifyd's separate API integration. Radar's technical capabilities extend beyond simple ML scoring: its
              guide describes TC40, SAFE, and early-dispute-notification pipelines from Visa, Mastercard, American
              Express, and leading banks, plus device fingerprinting, IP-spoofing detection, and multi-year historical
              pattern recognition. Radar for Fraud Teams adds customizable rule sets, manual-review queues, and deep
              analytics for more sophisticated buyers. Importantly, Stripe Radar is not a chargeback-guarantee product;
              merchants using Radar alone still bear the financial liability for chargebacks. This structural gap means
              that for high-value, high-velocity merchants requiring financial liability transfer, Radar is a complement
              rather than a full substitute. However, for Stripe merchants below a GMV threshold where a guarantee
              premium does not pencil out in ROI terms, Radar is a compelling reason never to evaluate Signifyd. The
              combined displacement risk from payment-embedded tools is material for Signifyd's expansion into the
              mid-market and supports a concentration risk in the enterprise segment as a countervailing diligence ask.
