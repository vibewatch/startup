      - number: '2.5'
        title: Market Position and Signifyd's Addressable Opportunity
        blocks:
          - type: paragraph
            body: |
              Within the guaranteed fraud protection niche for enterprise ecommerce, Signifyd has independently
              achieved market leadership recognition. Aite Group ranked Signifyd first among global chargeback
              guarantee vendors in its published matrix, ahead of Riskified, Accertify, Bolt, ClearSale, Vesta,
              and Apruvd, citing machine-learning approach, high approval rates, and the Commerce Network's
              consortium data. The Commerce Network — which the company describes as covering over 10,000
              merchants and 250 million shoppers worldwide — is Signifyd's primary platform differentiator:
              collective intelligence means each new merchant improves accuracy for all others, compounding
              the network effect.

              Consumer abuse and friendly fraud cost merchants more than $15 billion in annual chargeback losses
              per Signifyd's own data, validating the commercial rationale for the platform's expansion beyond
              CNP fraud into policy abuse, returns optimization, and payment compliance. North America remains
              the largest regional market in 2025 while Europe's faster growth trajectory reflects the
              PSD2/SCA regulatory tailwind. Asia-Pacific is expected to emerge as a significant growth region
              driven by expanding ecommerce volumes. Cloud-based delivery dominates over on-premise for real-time
              fraud decisioning, aligning with Signifyd's SaaS economics. Signifyd's serviceable opportunity
              remains large relative to current estimated revenue, but the market is contested by
              well-capitalized peers, and headline TAM figures significantly overstate the opportunity when
              filtered to mid-to-large merchants in English-language markets.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The 21× Gap Between BRCO and Reportprime Reflects Scope, Not Market Disagreement
            body: >-
              Analysts citing the $73.5 billion "ecommerce fraud market" typically include fraud analytics and identity
              verification services that primarily serve financial institutions. Reportprime's narrower $3.46 billion
              software-only estimate is more relevant for sizing Signifyd's competitive landscape, though even this
              understates Signifyd's total addressable revenue by excluding its financial-guarantee and managed-service
              revenue streams. Investors should anchor TAM discussions on the $3.46 billion software segment as a floor
              and recognize that Signifyd's guarantee model blurs the boundary between software and insurance, making it
              economically closer to a specialty underwriter than a pure SaaS vendor.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM012
          - type: callout
            title: Declining Fraud Rates May Dampen Adoption Urgency Among Margin-Stable Merchants
            body: >-
              The MRC's 2025 survey shows the fraud rate by revenue declined to 2.8% from 3.6%, reversing a multi-year
              trend. For merchants who are not near card network chargeback thresholds and have not experienced a
              significant fraud event, this improvement may reduce the urgency for adopting a guaranteed protection
              platform. Signifyd's ability to frame its product as a revenue enabler (higher approval rates, lower false
              declines) rather than a pure cost-reduction play is essential to overcome this procurement headwind.
            calloutType: risk
            claimRefs:
              - CM016
              - CM017
              - CM020
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct peers, substitutes, and status-quo alternatives'
        blocks:
          - type: paragraph
            body: >-
              Signifyd's competitive map divides into four distinct categories. First, and most directly relevant to
              valuation, are the chargeback-guarantee peers — Riskified and Forter — that compete for the same
              enterprise merchant dollar on nearly identical buying criteria: approval rate, guarantee breadth, network
              size, and per-basis-point loss economics. Second are best-effort fraud-scoring platforms (Sift,
              Kount/Equifax) that win where merchants prefer operating their own risk teams or buying from an
              established financial-data incumbent. Third are payment-embedded fraud tools — primarily Stripe Radar and
              PayPal Fraud Protection — that turn fraud prevention into a zero-marginal-cost feature of the payment
              stack, undercutting standalone vendors for merchants already committed to the relevant payments processor.
              Fourth is the status-quo alternative: legacy rules engines, in-house fraud teams, and manual review queues
              that remain the de-facto baseline for smaller or cost-sensitive merchants. Aite Group's 2021
              chargeback-guarantee matrix ranked Signifyd first among seven vendors evaluated — ahead of Riskified,
              Accertify, Bolt, ClearSale, Vesta, and Apruvd — citing machine-learning leadership, high approval rates,
              chargeback-management services, and consortium network depth. The competitive implication is that Signifyd
              is strongest where the merchant's primary criterion is transferring financial liability rather than simply
              scoring transactions. That positioning is defensible but concentrated in the
              enterprise-and-large-mid-market segment; below roughly $50M in GMV, merchants increasingly choose embedded
              tools or manual processes rather than paying a guarantee premium.
            claimRefs:
