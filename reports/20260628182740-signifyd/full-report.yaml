      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              The structural growth driver for ecommerce fraud prevention is the expanding attack surface created
              by rising online transaction volume. The US ecommerce market alone represents $1.234 trillion in
              annual sales. The 2025 Merchant Risk Council survey found that 98% of merchants experienced at
              least one form of fraud in the past 12 months, and global chargeback volumes are forecast to reach
              337 million events by 2026 — a 41% increase from 2023. The cost burden is severe: in 2025, every
              dollar lost to US merchant fraud costs $4.61 in total costs, a 37% increase from 2020, reflecting
              the cascading fees, operational overhead, and dispute management expenses beyond the direct loss.

              Two categories of fraud are accelerating adoption particularly quickly. First, friendly fraud: 62%
              of merchants report an increase since the prior year, and 72% specifically reported higher friendly
              fraud chargebacks in 2024. Total retail returns reached $890 billion in 2024, with approximately
              $101 billion — 13.5% — attributed to return fraud, giving Signifyd a large and growing market for
              its Intelligent Returns and abuse prevention capabilities. Second, PSD2/SCA enforcement in Europe
              creates a regulatory adoption trigger: failure to implement 3DS 2.2 leads to checkout abandonment
              rates of 25% or more versus single-digit rates before SCA enforcement. Signifyd estimates that 46%
              of UK consumers will abandon transactions that require two-factor authentication, making
              low-friction SCA compliance commercially urgent.

              Key constraints include modestly declining overall fraud rates — the MRC reports the fraud rate by
              revenue fell from 3.6% to 2.8% in 2025 — which may reduce urgency among some lower-exposure
              merchants. Switching costs, multi-quarter implementation timelines, and competition from
              Riskified, Forter, and Kount for large enterprise accounts create pricing pressure and slow
              net-new acquisition.
            claimRefs:
