      - number: '4.3'
        title: Unit Economics, Cost Structure, and Guarantee Exposure
        blocks:
          - type: paragraph
            body: >-
              Signifyd's cost structure blends a software delivery layer with an underwriting exposure that is invisible
              to outside investors. On the software side, the company operates a machine-learning platform with a
              commerce data network, API infrastructure, and analyst team — a profile with meaningful gross margin
              potential. On the underwriting side, every approved order carries a contingent liability: if the order
              generates a fraud chargeback, Signifyd absorbs the cost, including the chargeback amount, shipping fees,
              and processor fees per its Complete Chargeback Protection terms. The financial severity of that exposure
              is significant. Chargebacks911 estimates that in 2025, every $1 of fraud costs US merchants $4.61 in total
              — a figure that includes product loss, fulfillment, fees, and administrative recovery costs. Annual
              merchant losses from chargeback fraud are projected at $28.1B by 2026, up 40% from 2023. Signifyd's own
              research found that merchants lost approximately 50 basis points of revenue on average to unrecovered
              chargebacks in 2022, and that the total cost of a $100 fraudulent purchase is approximately $196 after all
              fees and taxes are included. Chargeback dispute fees alone run $15–$100 per contested transaction
              regardless of outcome, and even professional representment produces only a 45% win rate and an 18% net
              recovery rate. For a guarantee provider, these economics mean that the fee income must comfortably exceed
              the expected loss rate across the approved portfolio, with additional reserves held against tail risk. The
              actual gross margin at Signifyd is private and cannot be derived from public sources. Riskified, as the
              only listed comparable in this segment, reported a $75M share buyback authorization in June 2026 — a
              signal of free cash flow generation that implies the guarantee model can be economically sustainable at
              scale. The Merchant Risk Council's 2025 survey of over 1,000 merchants found that 72% reported an increase
              in friendly fraud in 2024, indicating that loss pressure on guarantee providers is rising, not easing.
              Signifyd's AI-driven approval accuracy and Commerce Network breadth are the primary mitigants: better
              identification of genuine shoppers across 98%+ of ecommerce shoppers in major markets reduces false
              positive losses and improves the loss ratio on the approved portfolio. Without access to cohort-level loss
              tables, reserve balances, or GAAP income statements, outside underwriting of the guarantee model's
              economics is impossible.
