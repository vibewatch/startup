      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: |
              Sizing the ecommerce fraud prevention market requires reconciling substantially different analyst
              estimates that reflect different scope boundaries. The Business Research Company (BRCO) places the
              global market at $73.5 billion in 2025, growing to $188.62 billion by 2030 at a 20.7% compound
              annual growth rate. Reportprime, using a narrower software-only definition, estimates the same market
              at $3.46 billion in 2025, growing to $9.32 billion by 2032 at a 15.2% CAGR. ResearchAndMarkets
              independently corroborates the BRCO figure. The gap between the two reflects definitional scope:
              BRCO includes fraud analytics, identity verification, managed services, and guarantee programs;
              Reportprime captures only licensed software tools. Both figures are meaningful: BRCO defines the
              total problem space; Reportprime captures the software segment in which Signifyd's platform
              directly competes.

              Demand context is provided by merchant fraud losses themselves: Juniper Research projected
              ecommerce merchant fraud losses would exceed $25 billion in 2024, validating that the market
              addresses a real and large financial burden even under narrow definitions. The US ecommerce market
              — Signifyd's largest geography — reached $1.234 trillion in 2025, growing 5.4% year-over-year
              and representing 23.1% of total US retail sales. By 2030, total global payment card fraud losses
              across all channels are estimated at $49.32 billion. Signifyd's serviceable addressable market
              (SAM), restricted to mid-to-large merchants in the US and Europe with meaningful CNP exposure,
              is estimated at $5 to $15 billion. The serviceable obtainable market (SOM) is implied at roughly
              $0.3 to $0.9 billion based on Signifyd's estimated revenue run rate and current penetration of
              the SAM — a sub-1% share of the broad TAM and consistent with its growth-stage positioning.
            claimRefs:
