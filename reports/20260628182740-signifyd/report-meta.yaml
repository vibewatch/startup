  topStrengths:
    - Guarantee-backed chargeback protection creates a deeper moat than fraud scoring alone.
    - Blue-chip merchant proof and cross-merchant network data support real enterprise relevance.
    - Product expansion into payments optimization, consumer abuse, and returns increases wallet share potential.
  topRisks:
    - The $1.34B 2021 valuation mark appears disconnected from current public comparable multiples.
    - Public evidence does not disclose guarantee loss rates, reserve policy, or gross margin net of claims.
    - Board rights, cap-table preferences, and exact merchant concentration remain opaque for a risk-bearing model.
  unresolvedGaps:
    - Audited current revenue, ARR, and gross margin by product line are not public.
    - Chargeback loss rates, reserve methodology, and profitability of approved-order guarantees remain undisclosed.
    - No public valuation refresh, secondary transaction, or 409A-style mark has surfaced since April 2021.
    - Exact merchant count, top-customer concentration, and net revenue retention are unavailable in public materials.
