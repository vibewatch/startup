companyProfile:
  summary: >-
    Signifyd is a founder-led commerce-protection platform built for large ecommerce merchants that
    want to approve more good orders while shifting fraud and non-fraud chargeback risk off the
    merchant balance sheet. The company combines machine-learning decisioning, a cross-merchant
    Commerce Network, payment optimization, PSD2/SCA support, consumer-abuse prevention, and newer
    returns capabilities. The strategic attraction is a genuine underwriting wedge plus enterprise
    merchant proof; the key diligence problem is that public disclosure does not reveal the net
    economics of the guarantee model.
  foundedDate: '2011-01-01'
  founders:
    - name: Rajesh Ramanand
      role: Co-founder and CEO
      background: Former PayPal risk leader who helped build Signifyd around shifting online fraud liability away from merchants.
      claimRefs: [CO001, CO002]
    - name: Mike Liberty
      role: Co-founder
      background: Former PayPal operator who co-founded Signifyd and helped shape its original guaranteed fraud-protection thesis.
      claimRefs: [CO001, CO002]
  foundingLocation: Palo Alto, California, United States
  headquarters: San Jose, California, United States
  productSummary: >-
    Commerce Protection Platform spanning chargeback guarantees, fraud prevention, payment
    optimization, PSD2/SCA support, consumer-abuse prevention, returns intelligence, and identity-
    linked decisioning for online merchants.
  customerFocus: >-
    Mid-market and enterprise ecommerce merchants, especially retailers with meaningful cross-border,
    high-AOV, or high-chargeback exposure.
  businessModel: >-
    Usage- and guarantee-based commerce protection sold as software plus underwriting, where
    merchants pay for automated decisioning and Signifyd reimburses approved fraud and non-fraud
    chargebacks subject to program rules.
  stage: Growth-stage private company
  fundingStatus: Series E ($205M, April 2021), total public funding history roughly $390M
