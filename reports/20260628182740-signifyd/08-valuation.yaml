- id: thesis-break-triggers-and-final-diligence-asks
  title: Thesis-Break Triggers and Final Diligence Asks
  body: 'The TRACK recommendation converts to INVEST only if the following conditions are met: (1) Management provides audited or reviewed financials showing 2025 revenue ≥$320 million, gross margin ≥50% net of guarantee losses, and Adjusted EBITDA margin improvement year-on-year. (2) Guarantee loss rate on approved portfolio is disclosed and confirmed below 0.3% of approved GMV. (3) Net Revenue Retention is confirmed ≥100% across the existing merchant cohort. (4) Entry price is ≤2x forward revenue — approximately $640–$700 million on $320–$350 million 2025E revenue. (5) An IPO or M&A process has been publicly initiated within 18 months with a credible acquirer or banker mandate.

    Kill criteria that would trigger AVOID: (a) A disclosed or leaked chargeback-loss spike causing net margin deterioration of >5 percentage points from the current estimate. (b) Loss of a top-3 merchant relationship representing >10% of estimated revenue. (c) A capital raise priced below the 2021 $1.34 billion mark without commensurate operational improvement — a signal that insiders are acknowledging mark-to-market deterioration. (d) Any EU AI Act enforcement action or GDPR fine requiring material changes to the automated decisioning architecture. (e) FIS (an investor) making a competing fraud-prevention acquisition that would structurally disadvantage Signifyd''s distribution access.

    Final diligence asks are concentrated on the guarantee model: (1) Audited P&L including chargeback losses as a line item. (2) Rolling 12-month cohort-level guarantee loss rate by merchant vertical. (3) Reserve balance and methodology. (4) Net Revenue Retention by cohort vintage. (5) Board composition, investor voting control, and preference stack by series. (6) EMEA revenue contribution and SCA exemption approval rate. (7) 2026 pipeline and guidance narrative from CFO. Without these seven data points, the TRACK stance cannot be upgraded; all valuation scenarios remain wide-range estimates that may be materially off from the company''s actual economic position.'
