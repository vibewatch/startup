callouts:
- calloutType: strength
  title: Commerce Network moat is real and durable
  body: The cross-merchant transaction signal Signifyd has aggregated over 15 years represents a genuine structural advantage. A fraud signal built from millions of shoppers' cross-merchant behaviour is materially harder to replicate than any single-merchant ML model, and it gets more accurate with density — a defensible moat even as individual model accuracy converges.
  claimRefs:
  - CV003
  - CV004
- calloutType: risk
  title: Five-year mark staleness is the dominant adverse signal
  body: No public evidence exists of any financing or valuation event between April 2021 and June 2026. The current Riskified public proxy implies a 71% discount to the 2021 mark. Any investor or acquirer relying on the 2021 price as fair value faces a material discovery risk that is unresolvable without direct access to management financials.
  claimRefs:
  - CV033
  - CV036
  - CV037
- calloutType: recommendation
  title: TRACK with conditional upgrade path
  body: 'The recommendation is TRACK. Upgrade to INVEST requires: (1) entry price ≤2x forward revenue (~$640–700M on $320–350M 2025E), (2) disclosed guarantee economics confirming loss rate <0.3% of GMV, and (3) confirmed NRR ≥100%. Absent these three conditions, the evidence is insufficient to underwrite the 2021 mark and a TRACK posture is appropriate.'
  claimRefs:
  - CV001
  - CV046
  - CV047
