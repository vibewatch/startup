figures:
  - id: FI001
    title: Revenue Model Bridge — From Merchant Transaction to Signifyd Revenue
    type: flow
    layout: standard
    summary: >-
      End-to-end flow showing how a merchant transaction converts into Signifyd's revenue and creates the
      underlying guarantee liability. All node labels are based on verified product descriptions.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI008
      - CI012
      - CI028
    data:
      nodes:
        - id: order-submission
          label: Merchant receives online order
          detail: Customer submits order on merchant's ecommerce platform; order data transmitted to Signifyd API in real time.
          tone: neutral
        - id: network-scoring
          label: Commerce Network scoring (real-time)
          detail: >-
            Signifyd's AI cross-references the order against its Commerce Network covering 98%+ of shoppers in major
            markets. Decision delivered in milliseconds with approval or decline recommendation.
          tone: positive
        - id: guarantee-decision
          label: Signifyd issues guaranteed approval or decline
          detail: >-
            Approved orders carry 100% financial protection: Signifyd absorbs fraud and non-fraud chargebacks under
            Complete Chargeback Protection. Declined orders create no liability.
          tone: positive
        - id: order-fulfillment
          label: Merchant fulfills approved order
          detail: Merchant ships or delivers; revenue recognized. Signifyd's guarantee covers approved order from this point.
          tone: positive
        - id: chargeback-event
          label: Chargeback filed (if any)
          detail: >-
            If fraud or first-party dispute arises, Signifyd absorbs the loss including chargeback amount,
            shipping fees, and processor fees. This is Signifyd's direct cost of revenue.
          tone: negative
        - id: fee-income
          label: Signifyd charges basis-point fee on approved GMV
          detail: >-
            Usage-based fee assessed on approved gross merchandise value. Custom rate per merchant;
            no published rack rate. This is Signifyd's gross revenue line.
          tone: positive
    approximationNotes: >-
      Revenue mechanism and product terms are drawn from official Signifyd product pages and press releases.
      Specific basis-point rates are not publicly disclosed; the flow represents the structural mechanism
      only. Chargeback absorption shown as a cost node reflects Signifyd's own description of its guarantee
      obligation.

