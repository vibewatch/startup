  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross margin and chargeback loss ratio
      missingEvidence: >-
        No public disclosure of gross margin, chargeback loss rate on approved portfolio, reserve methodology,
        or reserve balance. The guarantee model's economics are entirely opaque from outside.
      whyItMatters: >-
        Revenue quality is unknowable without the net-of-losses margin. A high gross revenue line with poor
        loss ratios would imply negative or thin gross margin, making the $1.34B+ implied valuation unsupportable.
      diligencePath: >-
        Request audited P&L by product line, rolling 12-month chargeback loss tables by merchant cohort,
        reserve policy documentation, and current reserve balance.
      relatedQuestionRefs:
        - QI005
        - QI016
        - QI022
      relatedTableRefs:
        - TI003
        - TI005

    - type: private-evidence-only
      severity: material
      topic: cash position, burn rate, and runway
      missingEvidence: >-
        No public balance sheet, cash flow statement, or burn rate data available. Last disclosed capital event
        was April 2021; five-year absence of public financing activity is unusual.
      whyItMatters: >-
        Capital adequacy cannot be underwritten without current cash position and burn. A company generating
        $290M+ revenue could be highly profitable or could be burning cash depending on the guarantee loss ratio.
      diligencePath: >-
        Request current balance sheet, most recent 12-month cash flow summary, and management's runway estimate.
      relatedQuestionRefs:
        - QI008
        - QI017
      relatedTableRefs:
        - TI004
        - TI005

    - type: private-evidence-only
      severity: material
      topic: customer count and revenue concentration
      missingEvidence: >-
        Exact merchant count, customer churn rate, and individual revenue contribution of named accounts
        (Samsung, Lenovo, Walmart Mexico) are not public.
      whyItMatters: >-
        In a guarantee-model business, a small number of high-GMV merchants generate most revenue AND most
        loss exposure. Concentration risk in both dimensions is a primary underwriting concern.
      diligencePath: >-
        Request top-10 customer revenue share, churn rate for the trailing 12 months, and total merchant count.
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI005

    - type: missing-source
      severity: minor
      topic: Riskified GAAP gross margin proxy
      missingEvidence: >-
        Riskified's actual gross margin from its 20-F annual reports was not retrieved during this research run.
        The IR pages were not accessible via fetch-url due to Cloudflare restrictions.
      whyItMatters: >-
        Riskified's audited gross margin is the best publicly available proxy for understanding Signifyd's
        margin potential. The proxy comparison in TI003 references the 20-F but the specific margin number
        was not confirmed in this research cycle.
      diligencePath: >-
        Pull Riskified's most recent 20-F from SEC EDGAR (CIK 0001861635) and extract GAAP gross margin
        for fiscal years 2022–2024 to establish the peer proxy range.
      relatedQuestionRefs:
        - QI013
      relatedTableRefs:
        - TI003
