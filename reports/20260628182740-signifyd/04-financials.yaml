  - id: peer-benchmarks
    title: Public Comparables and Peer Financial Benchmarks
    body: >-
      Riskified is the only audited public comparable for the chargeback-guarantee ecommerce fraud segment, providing
      the most reliable external reference for margin structure, scale economics, and capital return capacity. The
      company went public on the NYSE in July 2021 at a valuation anchored to the same market thesis as Signifyd.
      Its annual 20-F filings are accessible via the SEC EDGAR system (CIK 0001861635) and constitute the only
      source of GAAP-audited financials in the guarantee-model fraud vertical. In Q1 2026, Riskified raised its
      full-year revenue and Adjusted EBITDA guidance at the midpoint, and in June 2026 authorized a $75M share
      repurchase — both signals of positive free cash flow generation and operational confidence. GetLatka estimated
      Riskified's 2024 revenue at $318M, making it the closest revenue-scale peer to Signifyd's estimated $292.8M.
      The gap between the two companies is material for financial benchmarking: Riskified's public reporting provides
      a structural reference for how the guarantee model performs at approximately $300M+ revenue scale in terms of
      gross margin, EBITDA, and cash generation. Forter's $103.1M ARR estimate (GetLatka, 2024) at $525M raised and
      a $3B valuation implies a substantially more aggressive revenue-multiple bet than either Signifyd or Riskified
      at equivalent funding stages. The Equifax-Kount deal provides a third data point: the $640M acquisition price
      in February 2021 for a fraud-prevention platform embedded in a large incumbent's data stack suggests that
      strategic acquirers value fraud-prevention scale at meaningful multiples even before guarantee-model dynamics.
      These comparables argue that Signifyd's estimated $292.8M revenue base, if corroborated by audited financials,
      would place the company in a range of $1.5B–$4B in enterprise value depending on the margin profile and growth
      rate — a range that encompasses the stale $1.34B 2021 unicorn mark but could exceed it substantially if
      Riskified's margin quality and free cash flow profile is a reliable guide.
