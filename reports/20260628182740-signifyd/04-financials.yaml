callouts:
  - calloutType: strength
    title: Usage-based guarantee fee creates revenue quality above pure SaaS
    body: >-
      Signifyd's basis-point fee on approved GMV grows automatically as the merchant's transaction volume grows,
      without separate contract renegotiation. This makes the revenue model highly expansionary within existing
      accounts — analogous to usage-based SaaS but with switching friction amplified by the guarantee liability.
    claimRefs:
      - CI001
      - CI002
      - CI008
  - calloutType: risk
    title: Guarantee exposure is a hidden margin risk not visible in revenue estimates
    body: >-
      The $292.8M estimated ARR is a gross revenue figure. Net of chargeback losses and guarantee reserves,
      the actual gross margin is unknown. In a rising-fraud environment — friendly fraud up 72% among merchants
      surveyed in 2025 — the loss absorption line could deteriorate faster than fee revenue grows.
    claimRefs:
      - CI013
      - CI014
      - CI026
  - calloutType: risk
    title: Five-year financing gap since Series E is unusual at this scale
    body: >-
      No capital event has been disclosed since April 2021. At $290M+ estimated revenue and ~512 employees,
      the absence of a publicly disclosed 2022–2026 round is atypical for a venture-backed company at this
      growth stage and warrants a specific diligence question about cash position, burn trajectory, and
      any undisclosed secondary or debt activity.
    claimRefs:
      - CI004
      - CI006
      - CI007

