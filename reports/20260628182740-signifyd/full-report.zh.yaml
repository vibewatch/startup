              公开可见的领导层画像是创始人主导，但透明度有限。Ramanand 仍担任 CEO，也是最常露面的外部高管；Liberty 仍在官方叙事中被认可为联合创始人，但当前运营职责没有公开写明。近期产品和客户公告提到 J.
              Bennett 负责客户战略、Nikhita Hyett 作为总经理推动面向欧洲的退货产品发布，说明公司在创始人之外已有管理梯队，但完整高管名单并未披露。治理透明度是短板。Signifyd
              官方页面没有列出董事席位、委员会架构或投资人财团的投票控制权。该业务同时具备 SaaS 经济性和担保敞口，缺失董事会和风险委员会信息，比典型纯软件供应商更重要。务实判断是：Signifyd
