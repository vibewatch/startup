  - id: FI001
    title: 收入模型桥 — 从商户交易到 Signifyd 收入
    type: flow
    layout: standard
    summary: 端到端流程展示一笔商户交易如何转化为 Signifyd 收入，并产生底层担保责任。所有节点标签均基于已验证的产品描述。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI008
      - CI012
      - CI028
    data:
      nodes:
        - id: order-submission
          label: 商户收到线上订单
          detail: 客户在商户电商平台提交订单；订单数据实时传输到 Signifyd API。
          tone: neutral
        - id: network-scoring
          label: Commerce Network 实时评分
          detail: Signifyd 的 AI 将订单与其 Commerce Network 交叉比对，该网络覆盖主要市场 98%+ 的购物者。系统在毫秒级返回批准或拒绝建议。
          tone: positive
        - id: guarantee-decision
          label: Signifyd 给出担保批准或拒绝
          detail: 获批订单带有 100% 财务保护：Signifyd 根据 Complete Chargeback Protection 吸收欺诈和非欺诈拒付。被拒订单不产生责任。
          tone: positive
        - id: order-fulfillment
          label: 商户履约获批订单
          detail: 商户发货或交付；收入确认。从这一刻起，Signifyd 的担保覆盖该获批订单。
          tone: positive
        - id: chargeback-event
          label: 拒付提交（如发生）
          detail: 一旦发生欺诈或第一方争议，Signifyd 吸收损失，包括拒付金额、运费和处理商费用。这是 Signifyd 的直接收入成本。
          tone: negative
        - id: fee-income
          label: Signifyd 按获批 GMV 收取基点费用
          detail: 按获批商品交易总额计收用量费。每个商户定制费率；没有公开标价。这是 Signifyd 的总收入线。
          tone: positive
    approximationNotes: 收入机制和产品条款来自 Signifyd 官方产品页面和新闻稿。具体基点费率未公开披露；该流程只呈现结构性机制。将拒付吸收显示为成本节点，反映 Signifyd 对其担保义务的自身描述。
  - id: FI002
    title: 单位经济桥 — 担保费与损失暴露
    type: flow
    layout: standard
    summary: 定性单位经济桥展示担保模型欺诈供应商从获批 GMV 到毛利润的路径。数值输入不可得；节点以可获得的行业基准作为代理标注。
    claimRefs:
      - CI013
      - CI015
      - CI016
      - CI017
      - CI024
      - CI037
    data:
      nodes:
        - id: approved-gmv
          label: 获批 GMV（商户组合）
          detail: Signifyd 批准订单的商品交易总额。费用收入以此为基础。公开 GMV 未披露。
          tone: neutral
        - id: gross-fee-revenue
          label: 总费用收入（按获批 GMV 收基点）
          detail: 每个商户定制费率，未公开。支撑 $292.8M 估算 ARR（GetLatka）。无公开标价。
          tone: positive
        - id: fraud-loss-absorption
          label: 减 — 欺诈与拒付损失吸收
          detail: 获批订单产生欺诈拒付后由 Signifyd 吸收。行业平均：Signifyd 数据显示未追回拒付约 50bps。总欺诈成本 = 每损失 $1 对应 $4.61（Chargebacks911 2025）。
          tone: negative
        - id: gross-profit
          label: 毛利润（费用收入减损失吸收）
          detail: 扣除拒付损失后的净额。毛利率完全不公开；无法从公开来源推导。Riskified 的公开申报是唯一可比项；需调取 20-F 作为代理区间。
          tone: neutral
        - id: opex
          label: 减 — 运营费用（研发、销售、G&A）
          detail: 约 512 名员工，按估算平均全负荷成本计算。AI/ML 和网络基础设施研发是主要费用项。
          tone: negative
        - id: ebitda
          label: EBITDA（估算区间 — 私营）
          detail: 未公开。Riskified 在 2026 年 Q1 上调 EBITDA 指引并释放 $75M 回购信号，说明担保模型在约 $300M 收入规模可实现 EBITDA 转正。Signifyd 仍需验证。
          tone: neutral
    approximationNotes: >-
      Signifyd 的毛利率、损失吸收率和运营费用均为私有信息，公开来源不可得。担保损失节点的数值来自 Signifyd 自身发布的研究（平均未追回拒付 50bps）和 Chargebacks911 的 2025 年行业数据（每
      $1 欺诈成本对应 $4.61）。这些是行业参考，不是公司实际值。Riskified 代理值仅具方向性。所有缺少公司特定数据的节点均标注为私有 / 不可得。
