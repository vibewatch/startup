    rows:
      - - Guaranteed Fraud Protection (GFP)
        - 按获批 GMV 收取基点费用；Signifyd 吸收欺诈拒付
        - 按订单；随交易量和垂直品类变化
        - 活跃——旗舰产品；有 Samsung、Lenovo、Hot Topic、Philips 案例证据
        - 高——需求挂钩、深度嵌入；担保制造切换摩擦
        - 索取费率表、损失率和准备金方法
      - - Complete Chargeback Protection (CCP)
        - 将 GFP 扩展至覆盖第一方和非欺诈拒付；同样按获批 GMV 收费
        - 按订单；在 GFP 基线之上分层或打包
        - 活跃——单独营销；有 Cymbiotika 节省 $1.2M 的案例证据
        - 高——扩大责任覆盖；提升单商户收入
        - 确认商户基础中 CCP 相对仅 GFP 的渗透率
      - - Payments Optimization / SCA
        - PSD2/SCA 豁免路由和 3DS 2.2 认证收费；对获批交易提供 100% 担保
        - 欧洲商户；按获批交易
        - 活跃——有 Emma Sleep、Mango 欧洲证据；在 SCA 执行前推出
        - 中——受地理限制；需求由监管驱动
        - 索取欧洲 ARR 贡献和 SCA 豁免批准率
      - - Consumer Abuse Prevention
        - 对购后退货和政策滥用检测收费
        - 按案件或打包
        - 活跃——单独营销的产品
        - 中——将平台价值从欺诈延伸到利润漏损场景
        - 索取案例研究收入数据和商户采用率
      - - Chargeback Recovery
        - 对非欺诈拒付争议抗辩收取服务费或按追回结果收费
        - 按争议或按追回额百分比
        - 活跃——按 CPP 产品公告，已普遍可用
        - 低-中——抗辩平均胜率 45%（行业数据）；Signifyd 声称高于平均水平
        - 索取胜率、收入贡献和商户采用统计
