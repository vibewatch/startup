      - number: '4.2'
        title: 定价、GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Signifyd 的 GTM 模型把企业直销与平台合作渠道结合起来，降低中端市场渗透成本。定价页明确描述 Shopify、BigCommerce、Adobe Commerce 和 Salesforce
              Commerce Cloud 的集成插件是快速部署路径，让较小商户无需专门 API 集成即可启用。企业账户——Samsung、Lenovo、Walmart Mexico、Mango、Philips、Hot
              Topic——由具名客户成功团队通过直接关系服务。这种双渠道结构符合欺诈担保供应商通常的账本分层：高 AOV、高复杂度企业账户支撑顾问式销售和定制合同条款，同时通过平台市场以更低 CAC
              获取中端长尾商户。商业结果证据在客户层面很强。Hot Topic 部署后带来 $10M 年收入提升和 99%+ 批准率。Cymbiotika 实现 $1.2M 年节省和 93% 更少拒付。Ferguson
              Home 达到 98.5% 批准率且欺诈损失为零。Lenovo 美洲电商 VP 明确称，Signifyd 为此前被过度保守欺诈控制拦住的高 AOV 交易打开了销售漏斗。Mango
              支付负责人把跨商户购物行为称为关键差异化。这些客户层面的 ROI 数字对销售周期重要，但不能直接转化为合同规模或实际单商户平均收入。没有 cohort 数据、流失率或客户数，标准 SaaS
              效率指标（CAC、LTV、回本周期）无法从公开来源计算。按 GetLatka 对 512 名员工的估算，单员工收入约 $572K，与高杠杆软件业务一致；不过该估算不确定性较高，担保敞口也让这一指标不如纯 SaaS
              基准可比。
