      - number: '6.3'
        title: 具名客户证明与已记录结果
        blocks:
          - type: paragraph
            body: >-
              Signifyd 最强的客户价值证据，是一组覆盖时尚、消费电子、休闲和专业零售的具名案例研究，并包含量化结果。巴塞罗那时尚零售商 Mango 把此前被拒订单路由给 Signifyd
              作为第二意见引擎；已发布结果显示，Signifyd 批准了超过 60% 的争议订单，在担保支持批准上没有增量拒付风险的同时，让获批 GMV 提升 6%。Philips 在其 Hybris 商业平台上部署
              Signifyd 用于消费电子欺诈预防，公开报告拒付率从 5% 降至低于 1%，转化率从 40% 提升至超过 75%。运行在 Salesforce Commerce Cloud 上的专业零售商 Hot
              Topic，用 Signifyd 的 Commerce Protection Platform 取代人工订单审核，现在实现超过 99% 的订单批准率和 100% 订单自动化；CEO Steve Vrane
              记录了每年数百万美元的收入提升。Emma — The Sleep Company 在欧洲市场通过 Signifyd 的 Seamless SCA 产品追回 6% 到 7% 的额外收入。Build-A-Bear
              同时用 Signifyd 做欺诈管理和黄牛滥用预防，保护品牌体验免受机器人驱动购买影响。FeaturedCustomers 独立报道的 Groupe Dynamite 通过 Signifyd 把批准率从 95%
              提升到 99.8%。Aite Group 在 2020 年 11 月独立评估 Signifyd
              与六家竞争对手，并将其列为拒付担保市场第一，引用客户反馈称其「批准率高、合作关系强、合作体验好」，且有客户在部署后一个月内把欺诈拒付从超过 100 个基点降至 10 个基点。
