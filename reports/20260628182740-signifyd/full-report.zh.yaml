      - number: '4.3'
        title: 单位经济性、成本结构与担保敞口
        blocks:
          - type: paragraph
            body: >-
              Signifyd 的成本结构把软件交付层与外部投资人看不到的承保敞口混在一起。软件侧，公司运营机器学习平台、商务数据网络、API
              基础设施和分析师团队，具备可观毛利率潜力。承保侧，每一笔已批准订单都带有或有负债：如果订单产生欺诈拒付，Signifyd 按其 Complete Chargeback Protection
              条款吸收成本，包括拒付金额、配送费和处理商费用。这一敞口的财务严重性很高。Chargebacks911 估计，2025 年美国商户每 $1 欺诈损失会带来 $4.61
              总成本——包括商品损失、履约、费用和行政追回成本。商户每年来自拒付欺诈的损失预计到 2026 年达到 $28.1B，较 2023 年增长 40%。Signifyd 自身研究发现，2022 年商户平均损失约 50
              个基点收入于未追回拒付；一笔 $100 欺诈购买在计入所有费用和税后，总成本约 $196。无论结果如何，单笔被争议交易的拒付争议费用就达 $15–$100；即便专业再申诉，胜诉率也只有 45%，净追回率为
              18%。对担保提供商而言，这些经济性意味着费用收入必须稳稳超过已批准组合的预期损失率，还要为尾部风险留出额外准备金。Signifyd 的实际毛利率是私有信息，无法从公开来源推导。Riskified
              是该细分中唯一上市可比公司，2026 年 6 月报告 $75M 股票回购授权——这是自由现金流生成的信号，意味着担保模型在规模化后可以具备经济可持续性。Merchant Risk Council 2025
              年对超过 1,000 家商户的调查发现，72% 报告 2024 年友好欺诈增加，说明担保提供商承受的损失压力在上升，而不是缓解。Signifyd 的 AI 驱动批准准确性和 Commerce Network
              宽度是主要缓释因素：在主要市场覆盖 98%+ 电商购物者后，更好识别真实购物者可降低误拒损失，并改善已批准组合的损失率。拿不到 cohort 级损失表、准备金余额或 GAAP
              利润表，外部就无法承保判断担保模型的经济性。
