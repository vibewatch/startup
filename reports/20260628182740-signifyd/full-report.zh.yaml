            title: BRCO 与 Reportprime 的 21× 差距反映范围，而非市场分歧
            body: >-
              引用 $73.5B“电商欺诈市场”的分析师，通常把主要服务金融机构的欺诈分析和身份验证服务也算进去。Reportprime 更窄的 $3.46B 纯软件估算，更适合衡量 Signifyd
              的竞争版图；但即便这个数字，也因排除金融担保和托管服务收入流而低估 Signifyd 的总可寻址收入。投资人讨论 TAM 时应把 $3.46B 软件细分作为底线，同时认识到 Signifyd
              的担保模型模糊了软件与保险的边界，使其经济形态更接近专业承保人，而不是纯 SaaS 供应商。
