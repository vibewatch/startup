  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Commerce Protection Platform：定义和客户工作流
        blocks:
          - type: paragraph
            body: >-
              理解 Signifyd 的产品，最好从商户工作流切入，而不是把它看成独立欺诈模型。Commerce Protection Platform 嵌在电商商户的订单、支付、购后和争议生命周期里。结账时，Signifyd
              评估订单，并选择批准、拒绝或转入审核；如果获批订单后来被确认欺诈，公司按合同吸收覆盖范围内的拒付损失。该担保模式改变了买方工作流，因为商户外包的不只是决策，还包括一部分经济风险，而不只是购买分析工具。


              工作流已从无卡交易欺诈扩展出去。Signifyd 现在营销 Complete Chargeback Protection 处理非欺诈争议，Chargeback Recovery 处理担保覆盖外争议，Account
              Protection 防御账户接管，Authorization Rate Optimization 提升结账批准率，Instant Refunds 加快购后服务，Consumer Abuse Prevention
              加 Returns 能力应对政策滥用。结果是一套横跨交易前筛查、结账转化、购后退货和争议运营的单一平台。对商户来说，这种广度让 Signifyd 更像商业风险运营层，而不是狭义欺诈 API。
