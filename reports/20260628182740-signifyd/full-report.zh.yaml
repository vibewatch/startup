            body: >-
              对投资者最危险的风险，是一个反馈环：第一方欺诈上升推高担保损失，促使重新定价并激怒商户，引发流失，进而削弱 Commerce Network
              训练数据，使模型准确率恶化，并进一步推高损失。该螺旋没有公开披露的断路器，Signifyd 也没有确认任何能吸收突发担保损失事件的准备金或再保险机制。
