      - number: '5.5'
        title: 信任、安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              信任证据存在，但不完整。Signifyd 官网页脚链接到 Security & compliance
              页面，状态页也公开关键服务实时运营健康，这两项都是企业买家有用的信任信号。公司还直接营销与敏感身份和支付工作流绑定的产品，包括 Account Protection、Seamless SCA 和 Payments
              Optimization，这暗示其在风险、隐私和支付数据处理上有实质内部控制，即使这些控制没有在公开材料中完整记录。SCA 材料对欧洲商户尤其相关，因为它把 Signifyd 定位为 PSD2
              合规工作流的一部分，而不只是欺诈供应商。


              主要尽调弱点是认证透明度。在已审阅的公开资料中，没有可供检查的已确认公开 SOC 2 Type II 报告摘要、ISO 27001 证书或 PCI DSS
              证明。这不能证明控制不存在，但意味着买家无法仅凭公开证据验证这些控制。商户把身份、订单和争议数据经由 Signifyd 处理时，缺少可下载认证证明就是一个重大尽调缺口，尽管信任页面本身看起来被有意维护。
