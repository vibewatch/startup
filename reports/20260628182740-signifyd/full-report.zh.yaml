  - id: FM003
    title: 买方分层矩阵 — 商户规模与主要采用驱动因素
    type: matrix
    layout: wide
    summary: >-
      这张双轴矩阵按电商收入规模（x 轴）和主要欺诈采用驱动因素（y 轴）映射 Signifyd 可触达的买方分层。Signifyd 的核心企业客户落在大规模和高 CNP 欺诈暴露的交叉点；欧洲监管分层横跨不同规模；退货 /
      政策滥用是在中端市场和企业客户中冒出的机会。
