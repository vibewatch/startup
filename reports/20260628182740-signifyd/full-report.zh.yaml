      - number: '3.3'
        title: 尽力而为的欺诈平台：Sift、Kount/Equifax 与 ClearSale
        blocks:
          - type: paragraph
            body: >-
              Sift、Kount/Equifax 和 ClearSale 处在不同层级，价值主张是风险打分和决策，而不是转移金融担保。Sift 2021 年以 $1B 估值融资 $50M，并报告 2025 年估算 ARR 为
              $35M、员工约 318 人。其平台每年处理来自 34,000+ 网站和应用的超过一万亿个事件，识别出超过 16 亿个独特数字足迹，并被 Forrester 认定为数字欺诈管理 Leader。Sift
              单客户欺诈损失防护中位数为每年 $4.2M，对中端商户是有意义的 ROI 指标。Sift 不提供金融拒付担保；商户承担残余损失。Kount 于 2021 年 2 月被 Equifax 收购，并并入 Equifax
              Identity & Fraud Services 套件，使其能使用 Equifax 的征信局数据和 KYC 合规基础设施。Kount
              的强项在于这一既有数据优势和企业可信度，而不是担保模型；其资源库包含面向信用风险、验证和 AI 驱动身份信任的白皮书。ClearSale 是一家在北美运营的巴西公司，曾与 Signifyd、Riskified
              一同出现在 Aite Group 2021 年矩阵中；Aite 在正面对比中把 ClearSale 排在 Signifyd 之后。ClearSale
              最知名的是拉美和服装市场的人审深度，但全球企业级存在感明显小于担保主导的头部层。对这一层级的不利发现是，这些供应商都不提供大型企业商户越来越需要的全责任担保。
