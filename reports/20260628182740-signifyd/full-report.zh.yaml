              MRC 2025 年调查显示，按收入计的欺诈率从 3.6% 降至 2.8%，扭转了多年上升趋势。若商户尚未接近卡组织拒付阈值，也没有经历重大欺诈事件，这种改善可能降低其采用担保式保护平台的紧迫性。Signifyd
