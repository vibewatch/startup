  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Signifyd 在美国、欧盟和英国运营，各地都有不同且严格的数据保护和支付监管框架。在美国，Federal Trade Commission 的 Safeguards Rule（依据
              Gramm-Leach-Bliley Act 实施）要求处理消费者金融数据的金融服务公司维护成文信息安全计划，包含管理、技术和物理保障。另行看，FTC Act 第 5 条禁止不公平或欺骗行为，赋予 FTC
              对影响商业活动公司的广泛调查和执法权，包括数据驱动决策平台。CFPB 的 Regulation E 约束电子资金转账争议权利，并为拒付创造结构性环境；Regulation Z（Truth in
              Lending）约束信用卡账单争议。Federal Reserve 的 Regulation II 允许对借记卡 interchange fee 做欺诈预防调整，使 Signifyd
              的交易信号质量成为其金融机构伙伴的监管变量。California 的 CCPA（经 CPRA 修订）赋予消费者知情、删除、更正和限制使用敏感个人信息的权利，覆盖 Signifyd
              对加州消费者交易数据的大规模处理。

              在欧盟和英国，GDPR 与 UK GDPR 施加严格要求，包括默认和设计中的数据保护、处理的合法依据、数据最小化、目的限制，以及——对 Signifyd 的自动批准 / 拒绝工作流尤其关键——第 22
              条规定，不受具有法律或类似重大影响的纯自动化决策约束的权利。ICO 关于设计和默认数据保护的指南要求所有处理默认采用尊重隐私的设置，直接约束 Signifyd
              网络聚合跨商户购物者数据的方式。PSD2（Directive EU 2015/2366）要求 EEA 内大多数电子支付流程采用 Strong Customer Authentication，根本塑造了
              Signifyd 决策所在的结账环境。如果 Signifyd 辅助的 SCA 豁免未达到 PSD2 中嵌入的欺诈率阈值，会给金融机构伙伴带来银行侧责任敞口。卡网络施加的 PCI-DSS
              标准要求任何存储、处理或传输持卡人数据的实体执行严格控制；PCI Security Standards Council 将钓鱼和勒索软件列为增长最快的威胁向量。新兴 AI 监管层——包括 EU AI Act
              对金融服务中自动化决策系统的风险分层——可能要求 Signifyd 为其批准 / 拒绝模型证明可解释性、可审计性和人工 override 能力，从而抬高合规成本，并可能约束公司可部署的模型架构。
