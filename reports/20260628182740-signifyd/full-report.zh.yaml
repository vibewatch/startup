          - type: paragraph
            body: >-
              Signifyd 没有公开深层模型内部机制，但公开架构图景仍然方向性较强。开发者门户称平台结合大数据、机器学习、零欺诈责任和工作流自动化，技术页面则描述了一个覆盖数千商户和数百万购物者身份的 Commerce
              Network。该网络是核心技术护城河信号：Signifyd 不是孤立地给单个商户订单打分，而是利用大型商业图谱中跨商户积累的身份、设备、行为和订单数据训练决策。2021
              年融资新闻稿说得更进一步，称该网络覆盖主要市场 98% 的电商购物者。


              开发者信号进一步证明平台是真软件，而不只是营销文案。Signifyd 维护 Magento 2 PHP 扩展、PHP 库、Salesforce Commerce Cloud 集成代码和 API Blueprint
              文档等公共仓库。这些资产说明其运营模型围绕 API、连接器和商户平台集成搭建。缺口在于，Signifyd 没有公开披露特征工程、训练管线、误杀率或吞吐
              SLA；因此，尽管表层架构故事较强，决策引擎内部机制仍然实质性不透明。
