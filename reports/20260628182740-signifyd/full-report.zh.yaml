      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              测算电商欺诈防护市场，需要调和范围边界不同、差异很大的分析师估算。The Business Research Company（BRCO）把 2025 年全球市场定为 $73.5B，并预计到 2030 年增长到
              $188.62B，复合年增长率 20.7%。Reportprime 采用更窄的软件定义，估算同一市场 2025 年为 $3.46B，到 2032 年增长到 $9.32B，CAGR 为
              15.2%。ResearchAndMarkets 独立印证了 BRCO 的数字。两者差距来自定义范围：BRCO 纳入欺诈分析、身份验证、托管服务和担保项目；Reportprime
              只捕捉授权软件工具。两个数字都有意义：BRCO 定义总问题空间；Reportprime 捕捉 Signifyd 平台直接竞争的软件细分。


              需求背景来自商户自身的欺诈损失：Juniper Research 预计 2024 年电商商户欺诈损失将超过 $25B，证明即便按窄口径，市场也在解决真实且巨大的财务负担。美国电商市场——Signifyd
              最大地理区域——2025 年达到 $1.234T，同比增长 5.4%，占美国零售总额 23.1%。到 2030 年，所有渠道的全球支付卡欺诈损失估计为 $49.32B。Signifyd
              的可服务可寻址市场（SAM）限定在美国和欧洲、具有显著 CNP 敞口的中大型商户，估计为 $5B 至 $15B。基于 Signifyd 的估算收入运行率和当前 SAM 渗透率，可服务可获得市场（SOM）约为
              $0.3B 至 $0.9B——占广义 TAM 不到 1%，也符合其成长阶段定位。
