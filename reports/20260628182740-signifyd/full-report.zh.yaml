      - number: '8.2'
        title: 可比估值与公开基准
        blocks:
          - type: paragraph
            body: >-
              Riskified 是 Signifyd 估值分析的标准锚点，因为它是唯一一家公开交易、经审计、独立的拒付担保欺诈预防公司，且收入规模可比。Riskified FY2025 20-F（2026 年 3
              月提交）报告收入 $344.6 million，较 FY2024 的 $327.5 million 增长 5.2%，净亏损 $27.6 million，自由现金流为正 $33.1 million。截至 2026
              年 6 月下旬，Riskified 股价约 $4.41，隐含市值 $728.8 million；扣除净现金 $272.6 million 后，企业价值约 $456 million。由此得到 EV/FY2025
              Revenue 倍数为 1.32x，相对 FY2026 收入指引中点 $380 million 为 1.20x。五名卖方分析师覆盖该股，共识为「适度买入」，12 个月平均目标价 $5.69（较 2026 年 6
              月价格上行 29%）；熊市情景为 $4.50，隐含 EV/Revenue 倍数约 1.0x。

              将 Riskified 1.32x 公开代理倍数应用于 Signifyd 估算的 2024 年收入 $292.8 million，得到隐含 EV $387
              million。私营公司通常因稀缺性、控制权和退出期权价值而相对公开可比公司溢价交易；1.5x 溢价对应 $580 million，2.0x 溢价对应 $774
              million。在当前市场条件下，如果没有显著更高的收入或盈利证据，这些情景都无法支撑 2021 年 $1.34 billion 独角兽标记。

              更广泛的私营可比图景并不完整。Forter 2021 年 4 月以 $3 billion 估值融资 $300 million，但 GetLatka 估算 Forter 2024 年收入约 $103
              million——远低于 Signifyd 规模——意味着 Forter 2021 年标记按收入倍数看比 Signifyd 更拉伸。Equifax 2021 年收购 Kount 设立了战略 M&A
              基准，但收购价未披露，限制了其作为精确参考的用途。中端市场同业 Sift 仍为私营，未披露估值。综合来看，公开可比集（仅
              Riskified）和私营可比集（Forter、Sift、Kount/Equifax——均为 2021 年时代标记）表明，在当前市场条件下，$400–$750 million 是可防守估值区间；牛市情景上限接近
              $900 million，但取决于能否证明盈利进展。
