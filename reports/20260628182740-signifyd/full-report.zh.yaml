  - id: FM001
    title: 市场规模金字塔 — TAM、SAM 和 SOM
    type: pyramid
    layout: standard
    summary: >-
      Signifyd 欺诈防护市场可分三层测算。广义 TAM 为 $73.5B（BRCO 2025，包含面向银行的分析）。美国和欧洲具备 CNP 敞口的中大型电商商户对应 SAM 估算为 $5–15B。按 Signifyd 估算
      ARR 推导的 SOM 低于 $1B，占广义 TAM 不到 1%。
    data:
      items:
        - label: TAM — 广义欺诈检测与防护
          value: 73.5
          unit: $B
          description: 全球欺诈检测、防护、分析和身份服务（BRCO 2025）；包括面向银行的支出
        - label: SAM — CNP 欺诈 + 拒付保证（美国 + 欧洲）
          value: 10
          unit: $B
          description: 英语核心市场中具备显著 CNP 敞口的中大型电商商户（作者估算）
        - label: SOM — Signifyd 近期可获取市场
          value: 0.6
          unit: $B
          description: 由约 $292M ARR 估算推导（GetLatka）；占广义 TAM 不到 1%（作者估算）
    approximationNotes: >-
      TAM 采用 BRCO 2025 数据；SAM 和 SOM 为作者估算。SAM 基于美国 + 欧洲中大型商户细分分析；SOM 以 GetLatka ARR 估算作代理。图中显示 SAM 区间中点（$10B）；实际区间为
      $5–15B。
    claimRefs:
      - CM001
      - CM007
      - CM008
      - CM009
