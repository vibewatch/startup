      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司而言，Signifyd 的核心身份异常清楚。公司称，Mike Liberty 和 Raj Ramanand 离开 PayPal 后，于 2011 年创立 Signifyd，早期在 Palo Alto
              的联合办公空间起步，并从简单订单打分转向为线上商户提供担保式欺诈防护。这段创立故事仍能解释今天的产品组合。Signifyd
              不只是规则引擎或结账插件；它是承保和决策平台，负责批准电商订单、吸收已批准订单产生的欺诈和非欺诈拒付，并逐步延伸到支付优化、购物者身份、退货和消费者滥用防护。关键含义是，收入质量同时取决于软件采用和有纪律的损失管理。官方产品页面和独立评测都一致把公司定义为面向大型零售商的
              Commerce Protection Platform；差异化来自担保式批准和自动化工作流，而不只是独立分析能力。
