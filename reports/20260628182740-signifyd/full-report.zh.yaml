  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Signifyd
              处在更广义电商风险生态中三个相互重叠但不同的支出类别交汇处。第一类是无卡交易（CNP）欺诈检测与防护——自动化决策系统批准或拒绝线上订单，通常由金融担保支撑，把拒付责任从商户转给服务商。第二类是拒付管理与追回，处理交易后的争议，覆盖欺诈编码和非欺诈类别，包括友好欺诈、政策滥用和消费者滥用。第三类是支付优化，包括欧洲
              PSD2 指令下的强客户认证（SCA）合规。Signifyd 的 Commerce Protection Platform 覆盖这三类，因此其总可服务市场比纯欺诈检测软件对比所暗示的更宽。


              这三类的现状替代方案，要么是人工审核（昂贵、缓慢且容易出错），要么是基于规则的决策引擎（脆弱且误拒率高），要么是把拒付损失直接作为经营成本吸收。相邻市场包括更宽泛的身份验证、KYC/AML
              平台，以及主要服务金融机构而非商户的支付欺诈分析。若把这些相邻市场纳入，总可寻址市场会被放大；测算 Signifyd 核心机会时应排除。边界差异直接重要：BRCO 的 $73.5B
              市场估算包括面向银行的欺诈分析和身份服务，而 Reportprime 的 $3.46B 估算只覆盖面向商户的欺诈防护软件——21 倍差异来自定义，而不是竞争格局。
