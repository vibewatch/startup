            - 中等 — Signifyd 核心中端市场分层；拒付率触发采用
            - 高 — Signifyd 核心企业分层（Samsung、Lenovo、Philips、Hot Topic）
        - label: 友好欺诈 / 消费者滥用
          values:
            - 相关性低 — 滥用案例量低
            - 相关性上升 — 时尚 / 美妆商户的友好欺诈增加（安装基础的 18.2%）
