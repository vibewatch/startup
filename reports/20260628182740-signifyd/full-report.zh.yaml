  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、替代品与现状方案
        blocks:
          - type: paragraph
            body: >-
              Signifyd 的竞争地图分为四类。第一类，也是与估值最直接相关的，是拒付担保同行——Riskified 和
              Forter——它们争夺同一笔企业商户预算，购买标准几乎相同：批准率、担保宽度、网络规模，以及每个基点损失经济性。第二类是尽力而为的欺诈打分平台（Sift、Kount/Equifax），它们赢在商户偏好自建风险团队，或从既有金融数据巨头采购。第三类是嵌入支付的欺诈工具——主要是
              Stripe Radar 和 PayPal Fraud
              Protection——把欺诈防护变成支付栈的零边际成本功能，对已经绑定相关支付处理商的商户压低独立供应商空间。第四类是现状替代方案：传统规则引擎、内部欺诈团队和人工审核队列，仍是小型或成本敏感商户事实上的基线。Aite
              Group 2021 年拒付担保矩阵在评估的七家供应商中把 Signifyd 排名第一，领先 Riskified、Accertify、Bolt、ClearSale、Vesta 和
              Apruvd，理由包括机器学习领先、高批准率、拒付管理服务和联盟网络深度。竞争含义是，当商户首要标准是转移财务责任，而不只是给交易打分时，Signifyd 最强。这一定位可防守，但集中在企业和大型中端市场；在
              GMV 约 $50M 以下，商户越来越倾向于选择嵌入式工具或人工流程，而不是支付担保溢价。
