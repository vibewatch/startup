      - number: '6.5'
        title: 扩张、集中度风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Signifyd 的落地扩张模型可从 Commerce Protection Platform 产品栈中看到结构：商户通常从 Guaranteed Fraud Protection 开始，再依次增加
              Complete Chargeback Protection、Payments Optimization（包括面向欧洲商户的 Seamless SCA）、Account Protection、Chargeback
              Recovery，以及现在的 Intelligent Returns。这种多产品节奏让它与 Salesforce Commerce Cloud、SAP Hybris、Shopify 和 BigCommerce
              等商业平台深度集成，每增加一个模块，切换成本就显著抬高。Commerce Network 数据飞轮带来额外粘性：加入的高质量商户越多，欺诈信号越好，离开 Signifyd
              也意味着放弃联盟数据增强收益。集中度风险没有公开量化；Signifyd 不披露头部商户收入贡献或分层客户数量。Samsung、Lenovo 和 Walmart Mexico 的专门客户页面消失，是截至 2026
              年 6 月的重大尽调警示；三者都曾在 2021 年 Series E 新闻稿和 2023 年 Product Advisory Board
              公告中被引用。它们代表账户流失、页面重构，还是有意下架特定品牌标识，目前未确认。Signifyd 关于 Intelligent Returns 的研究称，获得即时退款的购物者在 30 天内再次购买的可能性高
              23%，为退货产品采用提供了商业理由；如果转化追踪得到验证，它可能加速扩张收入。
