  - id: FV001
    title: 推荐逻辑——从证据到 TRACK
    type: flow
    layout: standard
    summary: 追踪证据链如何从市场规模、产品证明、竞争护城河和财务不透明度，推导到 TRACK 建议。
    data:
      nodes:
        - id: market
          label: 市场：$34B+ 欺诈损失；电商非现金交易量增长（Capgemini 2025）
        - id: product
          label: 产品：拒付保证 + Commerce Network + 退货产品 = 深度嵌入
        - id: moat
          label: 护城河：跨商户信号优势；FIS 分发；5–7% 收入提升证明
        - id: financial
          label: 财务：估算收入 $293M，但保证经济性不透明；5 年估值标记陈旧
        - id: comp
          label: 公开可比：Riskified EV/Revenue 1.32x；Signifyd 2021 年标记隐含 4.6x
        - id: recommendation
          label: 建议：TRACK——业务真实，2021 年估值标记偏贵；等重新定价时再接触
      edges:
        - from: market
          label: 验证 TAM
          to: product
        - from: product
          label: 嵌入结账
          to: moat
        - from: moat
          label: 但经济性未披露
          to: financial
        - from: financial
          label: 叠加公开可比压缩
          to: comp
        - from: comp
          label: 共同推动
          to: recommendation
    approximationNotes: 逻辑链反映分析师判断；保证经济性来自未披露这一事实的推断，而非已确认数据。
    claimRefs:
      - CV001
      - CV002
      - CV014
      - CV015
      - CV025
  - id: FV002
    title: 估值敏感性——EV/Revenue 倍数 vs. Signifyd 隐含 EV
    type: bar
    layout: standard
    summary: 展示将 EV/Revenue 倍数应用于估算的 $293M 2024 年收入后，Signifyd 隐含企业价值如何变化，并以 Riskified 公开市场 1.32x 可比倍数作为锚点。
    data:
      items:
        - label: 困境（1.0x）——熊市底部
          value: 293
        - label: Riskified 平价（1.32x）——基础底部
          value: 387
        - label: 1.5x 私募溢价——基础中点
          value: 440
        - label: 2.0x 溢价——基础上限
          value: 586
        - label: 2.5x 增长溢价——牛市底部
          value: 733
        - label: 3.0x 增长溢价——牛市上限
          value: 879
        - label: 4.6x 隐含 2021 年标记
          value: 1347
    approximationNotes: >-
      收入基数为 GetLatka 对 2024 年 $292.8M 的估算；实际收入为私有数据。倍数来自 2026 年 6 月下旬 Riskified EV/Revenue 可比。2021 年标记柱使用实际 $1.34B
      Series E 投后估值。所有数值单位均为百万美元。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV025
      - CV026
