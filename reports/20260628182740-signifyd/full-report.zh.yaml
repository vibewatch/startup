      - number: '3.4'
        title: 支付生态替代品：Stripe Radar 与嵌入式欺诈工具
        blocks:
          - type: paragraph
            body: >-
              在中端市场，Stripe Radar 是对 Signifyd 结构性冲击最大的竞争力量，因为它把欺诈防护变成支付栈的零边际成本功能。Stripe 处理来自 197 个国家的支付，年处理额超过
              $1.9T；其网络会给任意一张卡分配 92% 的概率，判断该卡此前是否已在 Stripe 生态中出现。Radar 平均降低欺诈 32%，现有 Stripe 商户无需任何集成——相较 Signifyd 的独立
              API 集成，这是决定性的 GTM 优势。Radar 的技术能力不止简单 ML 打分：其指南描述了来自 Visa、Mastercard、American Express 和领先银行的 TC40、SAFE
              与早期争议通知管线，加上设备指纹、IP 欺骗检测和多年历史模式识别。Radar for Fraud Teams 增加可定制规则集、人工审核队列和面向更成熟买家的深度分析。重要的是，Stripe Radar
              不是拒付担保产品；只使用 Radar 的商户仍承担拒付的财务责任。这一结构性缺口意味着，对于需要转移财务责任的高价值、高速度商户，Radar 是补充，而不是完整替代。但对 GMV 低于某个阈值、担保溢价在 ROI
              上算不过来的 Stripe 商户，Radar 是一个足够强的理由，使其根本不评估 Signifyd。支付嵌入式工具带来的综合替代风险，对 Signifyd
              向中端市场扩张具有实质性影响；这也支撑了一个反向尽调问题：公司是否过度集中在企业细分。
