      - number: '5.4'
        title: 平台集成、部署与可靠性
        blocks:
          - type: paragraph
            body: >-
              部署证据最强的是电商生态集成，而不是底层基础设施文档。Signifyd 有运行中的 Shopify 应用列表、BigCommerce 市场列表、GitHub 上的 Magento 2 扩展，以及
              Salesforce Commerce Cloud 集成仓库，合在一起说明公司同时支持主流 SMB 平台和更可定制的企业级商业技术栈。合作伙伴页面通过系统集成商、代理商和
              Worldpay、Valtech、CQL、Wunderman Thompson、Lazer Technologies、Domaine
              等支付公司延展了这幅图景。这一点重要，因为对商户买家来说，实施风险不仅来自欺诈模型本身，也同样来自周边集成生态。


              可靠性证据有好有坏，但仍有用。公开状态页显示，Order Review API 最近 90 天正常运行时间为 100.0%，并跟踪七个相关组件，包括 API、webhook、控制台 /
              报告、Shopify、BigCommerce 和支持系统。与此同时，状态历史显示事件确实会发生，包括 2026 年 6 月中旬已解决的一次部分中断。评论平台还给出另一层提醒：Shopify 总体评分较强，但
              14% 的一星占比和独立评论说明，上线、调优和商户特定复杂度仍可能造成实施痛点。
