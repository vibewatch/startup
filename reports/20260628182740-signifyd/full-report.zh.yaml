      - number: '3.2'
        title: 拒付担保直接同行：Riskified 与 Forter
        blocks:
          - type: paragraph
            body: >-
              Riskified 和 Forter 是 Signifyd 最接近的直接竞争对手。Riskified（NYSE:RSKD，2021 年 7 月上市）是唯一拥有经审计公开财务的同行；其 SEC 文件可通过
              EDGAR 获取，投资者关系门户显示，2026 年 Q1 业绩促使公司上调全年收入和调整后 EBITDA 指引，同时在 2026 年 6 月授权 $75M 股票回购。GetLatka/PitchBook
              数据显示，Riskified 2024 年收入约 $318M，与 Signifyd 估算的 $293M 大致相当，说明两者都没有拉开决定性收入差距。Riskified 称，其 AI 模型最多可降低商户总欺诈成本
              50%，最高可提升批准率 20%，并带来 2–3x 更强的欺诈和滥用检测。公司聚焦奢侈品、时尚和高客单价电商，合作伙伴网络包括 Appriss Retail、commercetools、IXOPAY 和
              CellPoint Digital。客户证言提到接近 95% 的授权率，以及部署六个月内几乎消除所有拒付。Forter 2021 年 4 月完成 $300M Series F，估值 $3B，累计融资达
              $525M。其 2024 年估算 ARR 为 $103.1M（Latka），明显落后于 Signifyd 和 Riskified，尽管从 2020 年 $36M 增至 2024 年 $103M
              仍值得注意。Forter Trust Platform 每年处理来自超过 200,000 家企业的 $350B GMV，平均降低拒付率 72%、降低误拒率 46%。其 Decision Engine 在
              400ms 内完成 99% 的决策，Wayfair、Instacart、Adidas 等客户标识证明其企业触达。Forter 累计融资超过 Signifyd，但收入更少，显示相较当前收入规模，投资人预期更高。
