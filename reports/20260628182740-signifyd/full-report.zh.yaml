    title: 论点破裂与否决触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 保证损失飙升
        - 披露拒付损失率 >0.5% 已批准 GMV，或净利润率恶化 >5pp
        - 摧毁经济性论证；熊市情形转向困境资产定价
        - 立即规避；索取准备金余额和损失历史
      - - 大型商户流失
        - 流失任何一家贡献估算收入 >10% 的前三大商户
        - 网络密度下降；收入增长停滞；触发逆向选择螺旋
        - 规避；两季后在替代证据出现时重新评估
      - - 下轮融资
        - 融资定价低于 $1.34B，且没有运营改善抵消
        - 证实内部人承认按市值计价恶化；削弱谈判位置
        - 按新一轮标记重新定价；在入场估值 ≤2x 前瞻收入时重新评估
      - - EU AI Act 执法
        - 监管行动要求实质性重构自动决策架构
        - EMEA 增长停滞；法律成本上升；可能出现市场准入风险
        - 跟踪；监控执法时间线和合规整改支出
      - - FIS 战略性收购竞争对手
        - FIS 在保留 Signifyd 股权的同时收购 Riskified、Forter 或另一家欺诈平台同业
        - 分销优势被抵消；FIS 收购竞争对手会抹去战略溢价
        - 重新评估战略可选性；若 FIS 竞争性兴趣确认，考虑规避
    sourceRefs:
      - SV001
      - SV004
      - SV010
      - SV025
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
    notes: 否决触发项是作者定义的监控阈值，来自公开可比公司倍数压缩、监管风险和不透明的保证经济性，而非 Signifyd 披露的合同约束。
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 保证经济性
        - 已批准组合中经审计的拒付损失率；准备金余额和方法
        - 没有扣除损失后的利润率，就无法判断收入质量；熊市情形需要这项数据来证伪
        - 管理层材料；通过投资人或银行家索取
      - - 净收入留存
        - 按商户年份和垂直行业划分的 NRR/GRR；队列级扩张数据
        - 基准 / 牛市情形的收入增长假设需要 NRR ≥100% 支撑
        - 数据室或管理层直接披露
      - - 股权结构和优先权堆栈
        - 优先权条款（参与 vs. 非参与）、清算瀑布、董事会投票权
        - 若退出估值低于 $800M，Series E 投资人优先权可能清空普通股价值
        - 法律顾问审查股东协议
      - - EMEA 收入贡献
        - 截至 2026 年 Q2 的 EMEA ARR 和 Intelligent Returns 商户采用率
        - 牛市情形依赖 EMEA 达到 $20M+；否则 TAM 扩张论点更弱
        - 管理层报告材料；向投资者关系或银行家索取
    sourceRefs:
      - SV010
      - SV013
      - SV022
      - SV029
    claimRefs:
      - CV011
      - CV039
      - CV049
      - CV050
    notes: 每项尽调要求都对应一个缺失的公开输入，正是这些缺口阻碍精确承销；在管理层提供这些材料之前，估值只能是区间，而不是点估计。
