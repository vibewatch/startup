  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与规模
        blocks:
          - type: paragraph
            body: >-
              Signifyd
              有记录的客户基础横跨多个垂直和地区的企业级及中端电商商户，官方平台页面列出面向时尚、消费电子、家居用品、体育用品、杂货、汽车零件、航空公司和快餐餐厅的专门垂直赛道。地域覆盖北美、欧洲——明确包括英国、德国、西班牙、法国和意大利——并通过墨西哥城办公室覆盖拉丁美洲。2021
              年 4 月 Series E 新闻稿披露，其覆盖主要市场超过 98% 的电商购物者。公司称 Commerce Network 包含超过 10,000 家商户和超过 2.5
              亿个消费者身份，但这些数字为公司自称，可能反映数据足迹广度，而非独立付费客户数量。Signifyd 官方来源确认的具名标志性账户包括 Samsung、Lenovo、Walmart
              Mexico、Lowe's、Abercrombie & Fitch、Mango、Arbonne 和 eShopworld，它们是 2023 年 7 月首届 Product Advisory Board
              成员。官方来源和 TrustRadius 报告客户来自 Fortune 1000 和 Internet Retailer Top 500 榜单。FeaturedCustomers 独立汇总了 191 条
              Signifyd 客户推荐和 85 个已发布案例研究，平台基于 3,605 份提交获评 4.7/5，并获得 Spring 2026 Market Leader 称号——这独立印证了 Signifyd
              在自身营销之外的企业客户深度。
