      - number: '6.4'
        title: 留存、满意度与负面信号
        blocks:
          - type: paragraph
            body: >-
              多年客户证言显示 Signifyd 留存信号强，但公司没有正式披露量化留存指标。Shopify App Store 记录了合作 5 年以上的商户，包括 Drag Cartel CEO 的 7 年使用期，以及
              Rainbow Shops 确认近 5 年连续使用。TrustRadius 上 Thule Group 客户服务运营总监的评论称赞其高批准率和响应迅速的升级处理，并表示没有缺点。SoftwareAdvice 汇总
              64 条评论，总体情绪偏正面，核心是欺诈减少和运营效率；但评论者持续提出价格「有点贵」、7 天拒付索赔提交窗口过短，以及偶尔难以为被标记的合法订单获得人工改判。最负面的公开信号是 Signifyd 的
              Trustpilot 资料：仅 2 条评论，平均 2.9/5。2025 年 4 月一名评论者称 Signifyd
              无解释地阻止了忠诚客户数千笔合法订单，导致显著销售损失和客户信任受损——这与过度激进的欺诈决策情景一致。Signifyd 没有公开回复这些 Trustpilot 评论。PeerSpot 2026 年 6
              月品类分析显示，Signifyd 在欺诈检测中的心智份额为 1.7%，同比从 1.9%
              下降，说明相对竞争方案的平台可见度小幅侵蚀。整体图景是：有记录账户中的企业留存强，但公开评论样本薄，限制了对规模化满意度的独立验证。
