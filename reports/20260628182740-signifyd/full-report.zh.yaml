        - 出现卡组织原生保证替代方案（如 Visa 或 Mastercard 协议）
      - - 论点
        - FIS 投资人关系带来战略分销，也保留溢价买方可选项
        - FIS 转而收购 Riskified 或另一家欺诈平台同业
      - - 论点
        - 产品扩张（退货、消费者滥用防护、支付优化）拓宽 TAM
        - 退货产品未能起量；EMEA 收入贡献仍不重要
      - - 论点
        - Riskified 轨迹（FY2025 FCF 转正、FY2026 EBITDA 指引上调）证明保证模型在规模化后经济性可成立
        - Riskified 倍数压缩至低于 1.0x EV/Revenue，进一步压窄基准情形区间
      - - 反论点
        - 距离上一轮定价已五年，意味着市场不会支撑 $1.34B 标记
        - 以 $1.34B 或更高估值融资或二级交易，并引入可信新投资人
      - - 反论点
        - 保证经济性完全不透明；损失率、准备金和净利润率均未公开
        - 完整披露经审计财务，且将保证损失列为单独项目
      - - 反论点
        - Riskified 公开可比公司的 1.32x EV/Revenue 不到 Signifyd 2021 年隐含倍数的三分之一
        - 盈利改善叠加利率压缩，推动板块重估至 3–4x EV/Revenue
