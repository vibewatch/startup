      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: Commerce Network 护城河真实且耐久
            body: >-
              Signifyd 用 15 年聚合的跨商户交易信号，构成了真正的结构性优势。基于数百万购物者跨商户行为建立的欺诈信号，复制难度远高于任何单一商户 ML
              模型；网络密度越高，准确率越高——即使单个模型准确率趋同，这仍是一条可防守的护城河。
            calloutType: strength
            claimRefs:
              - CV003
              - CV004
          - type: callout
            title: 五年估值标记陈旧是最主要的负面信号
            body: >-
              2021 年 4 月至 2026 年 6 月之间，没有公开证据显示任何融资或估值事件。当前 Riskified 公开市场代理值意味着较 2021 年标记折价 71%。任何投资者或收购方若把 2021
              年价格当作公允价值，都面对重大价格发现风险；没有管理层财务数据的直接访问权，这一风险无法消除。
            calloutType: risk
            claimRefs:
              - CV033
              - CV036
              - CV037
          - type: callout
            title: TRACK，并保留有条件上调路径
            body: >-
              建议为 TRACK。上调至 INVEST 需要：（1）入场价格 ≤2x 远期收入（按 $320–350M 2025E 约 $640–700M），（2）披露担保经济性并确认损失率 <GMV 的
              0.3%，以及（3）确认 NRR ≥100%。若缺少这三个条件，证据不足以承销 2021 年标记，保持 TRACK 更合适。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV046
              - CV047
