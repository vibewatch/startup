          description: 欧洲商户部署 Seamless SCA；达到 3DS 2.2 合规；释放授权率优化空间
        - id: account-returns
          label: 账户保护与退货
          description: Account Protection 保护购物者身份；Intelligent Returns 于 2025 年 9 月在英国 / 欧盟推出；处理购买后的经济账
        - id: advisory
          label: 顾问委员会与背书
          description: >-
            头部客户加入 Product Advisory Board（Samsung、Lenovo、Walmart
            Mexico、Lowe's、Mango、Abercrombie、Arbonne、eShopworld）；形成多年锚定关系
    approximationNotes: 旅程阶段根据官方产品描述和客户案例研究推断；实际客户推进路径会因垂直行业和地区而异。
    claimRefs:
      - CU001
      - CU016
      - CU035
  - id: FU002
    title: 采用与部署漏斗
    type: funnel
    layout: standard
    summary: 从商户初始认知到全平台背书的各阶段，并列出每个阶段的大致流失信号
    data:
      items:
        - label: 市场认知
          value: 500000
          description: 分析师排名（Aite Group 拒付保证第 1 名）、Shopify App Store 列表（84 条评价，4.6★）、FeaturedCustomers 市场领导者（2026 年春季）
        - label: 评估与演示
          value: 50000
          description: 与 Forter、Riskified、Kount 正面 RFP 竞争；通过 signifyd.com 演示；买家指南在 G2、TrustRadius、PeerSpot 上评估
        - label: 集成与上线
          value: 20000
          description: 部署 API 或平台插件（Shopify、Salesforce CC、Hybris）；灌入 Commerce Network 身份数据；校准欺诈模型
        - label: 核心部署
          value: 15000
          description: Guaranteed Fraud Protection 上线；误拒下降有文档证明；批准率恢复正常；拒付保证覆盖生效
        - label: 平台扩展
          value: 5000
          description: 添加 Chargeback Recovery、Seamless SCA、Account Protection、Intelligent Returns；更深地接入商务平台
        - label: 背书与续约
          value: 500
          description: 多年合同续约；参与 Product Advisory Board；发布案例研究；5–7 年使用年限证言
    approximationNotes: 任何漏斗阶段都没有公开转化率数据；阶段描述根据官方来源和评价平台数据推断。
