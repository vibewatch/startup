      - number: '3.5'
        title: 能力对比、定价与 GTM 差异化
        blocks:
          - type: paragraph
            body: >-
              能力矩阵围绕拒付担保维度呈现清晰层级。Signifyd 是唯一明确担保所有拒付类型的供应商，包括第一方欺诈和非欺诈拒付；Riskified 和 Forter
              都提供担保，但范围条件需要直接审查合同。Sift、Kount/Equifax 和 Stripe Radar 不提供金融担保。网络数据方面，Sift 的 1T+ 年事件数和 Forter 的 $350B GMV
              网络都可信，但结构不同：Sift 网络横跨更广行业（游戏、金融科技、市场平台），Forter 联盟则更集中在高客单价商务。按 2021 年融资新闻稿，Signifyd 的 Commerce Network
              覆盖主要市场估计 98% 的电商购物者。定价方面，Riskified 和 Forter 都要求定制企业报价，没有公开费率卡；Sift 有分层平台定价；Stripe Radar 包含在 Stripe
              的单笔交易费用中；Signifyd 按已批准 GMV 的百分比收费。按 GMV 百分比收费，直接把 Signifyd 的收入激励与商户批准量对齐，但也让利润率对 Commerce Network
              上任何欺诈率上升更敏感。GTM 差异化同样重要：Riskified 的欧洲足迹小于 Signifyd；Forter 在北美竞争力强，但有记录的欧洲存在有限；Sift 主要在北美运营。ClearSale
              的护城河是拉美深度和人工审核能力。Signifyd 明确的欧洲运营和 SCA 合规能力，使其在欧洲企业市场具有显著差异化。
