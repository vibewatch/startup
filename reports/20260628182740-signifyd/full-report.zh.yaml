        - label: 产品与证明
          value: 7
          note: 蓝筹客户标识；5–7% 收入提升案例研究；退货和支付产品已上线
        - label: 竞争护城河
          value: 7
          note: Commerce Network 数据优势；切换成本；FIS 分发入口
        - label: 单位经济性
          value: 3
          note: 保证模型不透明；未披露损失率、NRR 或净利润率
        - label: 风险画像
          value: 3
          note: 保证尾部风险；五年前估值标记陈旧；监管和第一方欺诈暴露
        - label: 估值
          value: 2
          note: 2021 年标记约为估算 2024 年收入的 4.6x，而 Riskified 公开可比为 1.32x EV/Revenue
        - label: 证据质量
          value: 4
          note: 收入规模方向上得到确认；经济性和股权结构完全私有
    approximationNotes: 评分为分析师按 1–10 分制给出的判断。1–3 分表示重大担忧；4–6 分表示证据不完整且信号混杂；7–9 分表示公开证据较强。
