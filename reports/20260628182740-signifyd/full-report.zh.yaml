      - number: '7.4'
        title: 合作伙伴、平台与市场依赖风险
        blocks:
          - type: paragraph
            body: >-
              Signifyd 的商业模式依赖平台集成、金融机构伙伴、卡网络规则稳定性和商户集中度组成的网络，每一项都可能成为失败点。公司与 Salesforce Commerce Cloud、Magento/Adobe
              Commerce、Shopify、BigCommerce 等深度集成；其中任何平台的重大 API 变更或政策决定，都可能同时破坏整批商户的集成，并要求昂贵的重新认证。Amazon Pay
              自身的欺诈预防和争议能力代表潜在竞争和替代风险：随着 Amazon 扩展支付基础设施，其内部欺诈决策可能降低商户在 Amazon 邻近结账流程中使用 Signifyd 这类第三方中间件的意愿。

              卡网络规则不是静态的。Visa 的 CE 3.0 有力证据更新已经改变拒付争议的法律标准，要求 Signifyd 更新争议管理工作流和担保逻辑。未来规则变化——影响 SCA
              豁免阈值、拒付原因代码或争议再提交程序——可能在毫无预警下改变发卡方与商户之间的责任分配，从而改变 Signifyd 的担保范围和成本基础。少数大型商户很可能贡献 Signifyd 担保 GMV
              的不成比例份额；有记录的 PAB（Preferred Advocate Board）结构暗示关键账户集中。单一大型商户退出会造成阶跃式收入下滑，同时缩小 Commerce Network
              的跨商户信号池，降低剩余商户的模型准确率——这是反向网络效应反馈环。公司的 Fearless Payments 产品依赖愿意共享风险信号的金融机构伙伴；金融机构参与减少会直接削弱网络在支付流程决策中的准确度。
