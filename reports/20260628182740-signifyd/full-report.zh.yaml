  - id: FR001
    title: 风险热力图——可能性 vs. 影响
    type: matrix
    layout: standard
    summary: 按可能性和影响定位 Signifyd 的主要风险，并区分剩余严重度与原始严重度。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - null
            - Commerce Network 数据泄露；AI Act 高风险分类
            - 卡组织规则变化使保证失效
        - label: 高影响
          values:
            - EMEA 执行失败
            - ML 模型漂移；平台宕机；保证损失激增
            - GDPR / UK GDPR 执法；PSD2 SCA 豁免违规
        - label: 中影响
          values:
            - 关键人物离职；CFPB Reg E / Reg Z 暴露
            - 商户集中度；误拒升级；Reg II 变化
            - 第一方欺诈上升；拒付阈值突破
        - label: 低影响
          values:
            - 边缘隐私法（非 CA/EU）
            - 平台 API 变化；竞争对手功能追平
            - Trustpilot 负面评价累积
    approximationNotes: 可能性和影响是分析师基于公开证据作出的判断；没有可用的内部风险评分数据。单元格位置反映相对严重度，而非绝对概率。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR012
      - CR013
      - CR015
      - CR020
      - CR021
      - CR025
      - CR029
