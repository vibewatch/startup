      - number: '3.6'
        title: 护城河耐久性、转换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Signifyd 的竞争护城河建立在四个相互强化的要素上：Commerce Network
              数据优势（跨商户身份解析）、担保模型的对齐机制（只对已批准订单获得收入）、代表商户处理争议裁决的拒付管理基础设施，以及通过 OMS、ERP
              和支付系统连接形成的集成深度与工作流锁定。每个要素都会制造转换成本：商户运行 Signifyd 担保 18 个月以上后，会对模型损失经济性形成预测信任；更换供应商就要重建这种信任。最严重的竞争风险是
              Riskified 在 NYSE 上市，这给企业买家带来经审计财务、稳定股权结构和监管级披露的安心感——这些优势 Signifyd 作为私营公司无法匹配。Riskified 2026 年 6 月 $75M
              回购进一步释放财务成熟信号。第二大风险是支付嵌入式替代：如果 Stripe 或 PayPal 加深其担保能力，独立担保供应商的可寻址市场可能实质收缩。一些供应商已经从担保模型后撤，转向绩效 SLA
              框架，因为维持损失经济性需要持续 ML
              改进和足够网络规模。这种后撤反而验证了网络护城河：只有拥有足够交易智能的供应商，才能在不被逆向选择摧毁利润率的情况下维持金融担保模型。打分层的商品化风险中等偏高，但全担保层较低，因为该模型需要承保纪律，难以快速复制。
