      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              电商欺诈防护的结构性增长驱动，是线上交易量上升带来的攻击面扩张。仅美国电商市场一年销售额就达 $1.234T。2025 年 Merchant Risk Council 调查发现，98% 的商户在过去 12
              个月至少遭遇过一种欺诈；全球拒付量预计到 2026 年达到 3.37 亿起，比 2023 年增加 41%。成本负担很重：2025 年，美国商户每损失 $1 的欺诈金额，总成本达到 $4.61，较 2020 年增加
              37%，反映直接损失之外层层叠加的费用、运营开销和争议管理成本。


              两类欺诈正在特别快地推动采用。第一是友好欺诈：62% 的商户称较上一年有所增加，72% 明确报告 2024 年友好欺诈拒付上升。2024 年零售退货总额达到 $890B，其中约
              $101B——13.5%——归因于退货欺诈，为 Signifyd 的 Intelligent Returns 和滥用防护能力提供了巨大且增长中的市场。第二，欧洲 PSD2/SCA 执行形成监管采用触发器：未实施
              3DS 2.2 会导致结账放弃率达到 25% 或更高，而 SCA 执行前为个位数。Signifyd 估计，46% 的英国消费者会放弃需要双因素认证的交易，使低摩擦 SCA 合规具备商业紧迫性。


              主要约束包括整体欺诈率温和下降——MRC 报告按收入计的欺诈率从 3.6% 降至 2025 年的 2.8%——这可能降低部分低敞口商户的紧迫感。转换成本、多季度实施周期，以及
              Riskified、Forter、Kount 对大型企业账户的竞争，会带来定价压力并拖慢新增获客。
