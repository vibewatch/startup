      - number: '4.5'
        title: 公开可比公司与同行财务基准
        blocks:
          - type: paragraph
            body: >-
              Riskified 是拒付担保电商欺诈细分唯一经审计的公开可比公司，为利润率结构、规模经济性和资本回报能力提供最可靠的外部参照。公司 2021 年 7 月在 NYSE 上市，估值锚定的市场论点与 Signifyd
              相同。其年度 20-F 文件可通过 SEC EDGAR 系统获取（CIK 0001861635），也是担保模型欺诈垂直中唯一的 GAAP 审计财务来源。2026 年 Q1，Riskified 上调全年收入和
              Adjusted EBITDA 中点指引，并在 2026 年 6 月授权 $75M 股票回购——这两个信号都指向正向自由现金流生成和运营信心。GetLatka 估算 Riskified 2024 年收入为
              $318M，使其成为最接近 Signifyd 估算 $292.8M 的收入规模同行。两家公司之间的差异对财务基准很重要：Riskified 的公开报告提供了结构性参照，可观察担保模型在约 $300M+
              收入规模下的毛利率、EBITDA 和现金生成表现。Forter 的 $103.1M ARR 估算（GetLatka，2024 年）、$525M 融资和 $3B 估值，意味着相较 Signifyd 或
              Riskified 在相似融资阶段，其收入倍数赌注激进得多。Equifax-Kount 交易提供第三个数据点：2021 年 2 月以 $640M
              收购嵌入大型现有数据栈的欺诈防护平台，说明即便不考虑担保模型动态，战略收购方也会以有意义的倍数给欺诈防护规模定价。这些可比公司说明，如果 Signifyd 估算的 $292.8M
              收入基础得到审计财务印证，公司企业价值可能落在 $1.5B–$4B 区间，具体取决于利润率画像和增长率——这个区间覆盖已过时的 2021 年 $1.34B 独角兽标记；若 Riskified
              的利润率质量和自由现金流画像可作为可靠指南，Signifyd 也可能显著超过该估值。
