              Signifyd 的采用轨迹可通过官方平台指标和独立第三方数据看到一部分。2021 年 Series E 新闻稿披露，平台在主要市场覆盖超过 98% 的电商购物者，商户客户实现最高 20%
              的转化率提升。GetLatka 估算 Signifyd 2024 年收入为 $292.8 million，员工约 512 人，说明商户货币化已具规模，即使客户级采用数据没有公开披露。在 Shopify
