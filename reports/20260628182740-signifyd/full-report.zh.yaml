      - number: '7.2'
        title: 拒付担保与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Signifyd 的商业核心——拒付担保——同时是最强差异化和最重大的财务风险。当 Signifyd
              批准一笔订单，而该订单随后产生覆盖范围内的拒付时，公司会用自身资产负债表向商户支付争议金额。担保创造了不对称敞口：收入按担保 GMV
              百分比进入，但损失间歇发生；如果欺诈模式变化快于模型再训练，损失可能快速飙升。Signifyd 从未披露准备金水平、担保损失率或单位经济细节，外部投资者无法衡量尾部风险。

              Signifyd 担保模式必须应对的环境已变得结构性更难。根据 Signifyd 自身 Commerce Network 数据，第一方欺诈——合法持卡人用自身身份实施欺诈——在 2025 年上半年增长
              8%；公司研究显示，最多五分之一消费者承认存在某种形式的第一方欺诈或滥用。由于授权持卡人发起交易，这类欺诈在批准时极难识别和击败，并会穿过担保窗口成为担保损失。Signifyd
              自己发布的研究称，传统拒付抗辩方法胜率只有 17%，进一步说明追回在结构上有多难。

              卡网络拒付监控计划又增加了一层敞口。Visa 的计划在 0.65% 拒付率开始标记商户，并在 0.9%（标准档）和 1.8%+（超额档）处施加罚款。Mastercard 的 Excessive
              Chargeback Programme 在 1% 开始监控，并在连续两个月 1.5%+ 时评估罚款。这些阈值约束 Signifyd
              的批准策略：如果模型为最大化商户收入而过度激进地批准边缘订单，商户总拒付率可能突破这些阈值，触发罚款并损害商户关系。与 GMV 百分比绑定的定价模型还会带来逆向选择风险：商户可能只把高风险订单路由给
              Signifyd 担保，自行批准低风险订单，导致担保池质量恶化，并随着时间压缩担保经济性。该敞口规模没有公开披露，构成重大证据缺口。
