      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              Signifyd 客户群明显集中在中大型企业级电商零售商。按垂直行业看，配备 Signifyd 技术的商户中，43.4% 属于线上购物，18.2% 属于时尚与美妆，11.5%
              属于营销和商品推广。按地域看，52.5% 的 Signifyd 装备商户位于美国，加拿大为 7.7%，英国为 6.6%——印证公司以英语市场为导向。Samsung、Lenovo、Mango、Philips 和
              Hot Topic 等具名企业客户代表商户规模分布的上层，验证了 Signifyd 聚焦这类账户：拒付敞口足够大，足以支撑定制定价和全平台部署。


              这一细分市场的预算所有权通常横跨电商或数字负责人、支付 VP 和 CFO。Signifyd 定价为定制化、按用量收费，没有公开费率卡；所有套餐都对已批准订单提供 100% 金融担保，使 ROI
              计算更直接。采用触发器分三类：（1）拒付率接近卡组织阈值；（2）收入分析发现误拒损失；（3）欧洲 PSD2/SCA
              等监管催化，迫使商户升级支付认证栈。完整采用路径通常从覆盖单一产品类别或地理区域的试点开始；一旦证明批准率提升和拒付下降，再进入全面部署。Signifyd 的 100%
              金融担保意味着商户对已批准订单不再承担残余欺诈风险，把欺诈管理从成本中心转成收入赋能功能。
