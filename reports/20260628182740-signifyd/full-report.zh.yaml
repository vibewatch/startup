      - number: '7.3'
        title: 运营、网络安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              Signifyd 的 Commerce Protection Platform 实时运行在商户结账流程里。决策 API 延迟或不可用不只是削弱欺诈预防功能——它会直接阻断订单完成和商户收入，带来合同 SLA
              敞口和声誉损害。status.signifyd.com 公共状态页记录平台事件历史，尽管公开文件没有详细描述具体事件，状态页的存在和格式确认公司经历过需要公开披露的服务级事件。Signifyd 不公开 SLA
              阈值、正常运行时间保证或误杀率，限制了外部对其运营状态的验证。

              Commerce Network
              的数据架构——跨数千个商户部署和数百万购物者身份聚合身份、设备和行为信号——形成了一个对攻击者价值很高的集中数据资产。一旦成功入侵，将暴露大量美国和欧洲电商购物者的跨商户购买历史、设备指纹和身份关联。AWS
              自身数据隐私 FAQ 确认，客户（即 Signifyd 这类租户）控制其数据的地理区域、加密状态和访问控制，AWS 不访问客户内容；但 Signifyd
              对这些数据的自身控制是否充分，尚未通过任何公开披露的安全审计或 PCI 认证获得独立验证。PCI DSS 要求商户和服务提供商保护持卡人数据，PCI Security Standards Council
              将勒索软件和钓鱼列为增长最快的攻击向量。影响 Commerce Network 的数据泄露会触发 GDPR、UK GDPR、美国州法以及潜在 FTC 执法下的泄露通知义务，并严重破坏 Signifyd
              的数据共享关系。

              对任何网络效应决策系统来说，ML
              模型漂移都是结构性风险。欺诈模式向第一方欺诈、账户接管和政策滥用演进时，模型必须持续再训练以维持准确率。如果再训练周期落后于欺诈演进，假阴性率（批准欺诈订单）会上升，增加担保损失；假阳性率（拒绝合法订单）也会上升，损害商户收入和客户信任。Trustpilot
              上的商户投诉记录了合法订单被误拒的反复问题，这与需求峰值或欺诈模式过渡期中的模型校准失准相一致。
