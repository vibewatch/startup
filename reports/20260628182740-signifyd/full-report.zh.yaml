      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情形（概率：20%）：Signifyd 证明 2025 年收入达到 $330–$350 million（较 $293M 估算增长 12–16%），Adjusted EBITDA 利润率改善，并在 2027
              年中前启动 IPO 或战略出售流程。在这一情形下，2.5–3x EV/Revenue 倍数（较 Riskified 的公开市场定价有溢价，反映私有公司稀缺性和更高增长）对应估值区间 $825 million 至
              $1.05 billion——低于 2021 年标记，但可以说仍反映残余企业价值。牛市情形取决于：（a）担保模型的盈利改善得到验证，（b）EMEA 支付优化贡献超过 $20M 收入，（c）Intelligent
              Returns 带来有意义的商户采用。关键触发条件：管理层打开账本，给出前瞻 ARR 和 EBITDA 预测。

              基准情形（概率：55%）：收入增长接近 Riskified 的速度（同比 5–10%），2025E 收入为 $307–$322 million。在 Riskified 1.32x EV/Revenue
              倍数基础上给予 1.5–2x 私有公司溢价，按 2025E 收入计算，对应估值区间 $610–$850 million；若按 Riskified 平价的低端，则约为 $460–$640 million。二级交易或
              SPAC 式事件大概率会在中点成交，约 $550–$680 million。这较 2021 年 $1.34 billion 标记明显折价，对 Series E
              进入的投资者来说会是一轮持平到下行的融资。基准情形假设担保经济性没有实质恶化，商户基础继续稳定。

              熊市情形（概率：25%）：第一方欺诈抬升、逆向选择加剧，拖累担保模型经济性，净利润率显著下降，迫使公司按 Riskified 公开 EV/Revenue 倍数或更低价格融资或出售。按 2025E 收入
              $307–$322 million 的 1.0–1.3x 计算，企业价值区间为 $307–$419 million——较 2021 年标记下降
              69–77%。触发这一熊市情形的因素包括：（a）披露的拒付损失激增，（b）大商户流失（例如失去前五大商户之一），或（c）监管行动要求产品做重大重构。没有公开披露的数据能够证实或排除这一情形；担保经济性完全不透明。
            claimRefs:
