  topStrengths:
    - Yann LeCun 的 2018 年图灵奖、12 年 FAIR 领导经历和 JEPA 作者身份，让 AMI 在世界模型 AI 上拥有思想权威。
    - $1.03B 种子资金估计能为重算力研究提供 2–3 年现金跑道，短期没有融资压力。
    - 战略投资人组合（NVIDIA、Temasek、Samsung、Toyota Ventures）释放出工业部署意图，也可能带来 Nabla 之外的合作伙伴管线。
    - 主权 AI 与巴黎定位，让公司更容易触达欧盟受监管行业采购、Bpifrance 公共资金，以及偏好非美国超大规模云厂商的买家。
    - CEO LeBrun 曾创办 Nabla，使团队与 AMI 的主要商业垂直有直接领域重叠，也拥有一个运行中的临床 AI 试验场。
  topRisks:
    - 对 Yann LeCun 的关键人物依赖是最大生存风险；他是执行董事长而非全职 CEO，一旦离开，会显著打击投资人信心和招聘。
    - JEPA 的架构押注未必能跑赢 Meta、Google DeepMind 等多模态 LLM 的进展；这些对手的资源量级远高于 AMI。
    - 年度算力成本升高 4–5×，意味着商业收入验证投资逻辑之前，公司需要连续融资。
    - 多年研究周期带来融资缺口风险：若 2028 年前无法以不低于 $3.5B 的投前估值完成 Series A，就会进入承压情景。
    - Goldman Sachs / Sequoia 所称 $600B 资本开支与收入缺口，是宏观层面的反向风险，可能削弱企业买家为未产生收入的 AI 研究大规模付费的意愿。
  unresolvedGaps:
    - 独立 JEPA 基准结果，需要证明其在物理世界任务上优于多模态 LLM；这是最主要的投资逻辑破裂触发点。
    - Series A 时间表和定价条件（预计 2027–2028；目标投前估值 $5B+）；若无法从 $3.5B 抬升，将释放估值压缩信号。
    - 当前员工数，以及 2026 年 3 月种子轮完成时估计约 12 人之外的团队建设情况。
    - Nabla 合作的商业条款、排他条件和收入分成结构。
    - 董事会构成、治理节奏和完整顾问名单；这些尚未公开。
    - 当 AMI 模型接近发布或部署门槛时，对 EU AI Act GPAI 系统性风险要求的合规姿态。
