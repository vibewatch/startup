company:
  name: AMI Labs

chapter:
  number: 4
  title: Financials
  summary: >
    AMI Labs closed a $1.03 billion seed round in March 2026 at a $3.5 billion pre-money valuation —
    Europe's largest seed round on record — with capital explicitly earmarked for two cost centers:
    compute and talent. The company has no revenue, no product, and a self-described multi-year
    research-first timeline. All unit-economics and margin metrics are null; the only financial
    analysis possible from public sources is the capital structure, estimated burn analogues from
    frontier AI peers, and a range of runway scenarios. Skeptical macro analysts (Goldman Sachs,
    Sequoia) have flagged material risk that large AI research investments may not pay back within
    conventional venture timelines, and AMI's open-source commitment creates additional tension
    with its eventual licensing model.

sections:
  - id: capital-structure
    title: Capital Structure and Round Mechanics
    body: |
      AMI Labs raised $1.03 billion USD (approximately €890 million) in a seed round announced
      March 10, 2026. The round was set at a $3.5 billion pre-money valuation, implying a
      post-money of approximately $4.53 billion. PitchBook confirmed it as Europe's largest seed
      round ever recorded. AMI had initially been seeking approximately €500 million as recently
      as December 2025; the final close was nearly double that target, indicating the syndicate
      was oversubscribed.

      The round was co-led by five venture investors: Cathay Innovation, Greycroft, Hiro Capital,
      HV Capital, and Bezos Expeditions. Strategic corporate investors include NVIDIA, Samsung,
      Temasek, Toyota Ventures, and Sea. French institutional and industrial backers include
      Association Familiale Mulliez, Groupe Industriel Marcel Dassault, Publicis Groupe, and
      Bpifrance Digital Venture. Notable angels include Eric Schmidt, Mark Cuban, Jim Breyer,
      Tim and Rosemary Berners-Lee, Xavier Niel, and Mark Leslie.

      A US Securities and Exchange Commission Form D filing dated April 3, 2026 shows that US
      investment vehicles "Advanced Machine Intelligence I, L.P." and "Advanced Machine Intelligence
      II, L.P." — managed by Model I, L.P. of San Francisco — aggregated approximately $16.9 million
      for investment in AMI. This structure is consistent with small US LP tranches pooled into
      larger international syndicates. AMI itself is a private French company with no public
      financial filings or balance-sheet disclosures.

      Strategic investors' rationale appears bifurcated: financial VCs (Cathay, Greycroft, Hiro,
      HV) accepted a multi-year research timeline priced at premium to comparable-stage startups,
      while corporate strategics (NVIDIA, Samsung, Toyota, Temasek) likely receive early access
      to world model research relevant to their compute, semiconductor, automotive, and sovereign
      AI priorities. The oversubscription suggests both categories of investor accepted the $3.5B
      pre-money as fair given LeCun's technical credibility and the world model narrative.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI016, CI031, CI033, CI035]
    tableRefs: [TI001]
    figureRefs: []

  - id: revenue-model-gtm
    title: Revenue Model and GTM Timeline
    body: |
      AMI Labs has no revenue, no commercial product, and has explicitly stated it does not plan
      to generate revenue in the near term. CEO Alexandre LeBrun described the company as "a very
      ambitious project, because it starts with fundamental research. It's not your typical applied
      AI startup that can release a product in three months, have revenue in six months, and make
      $10 million in ARR in 12 months." He indicated it could take "years for world models to go
      from theory to commercial applications."

      The intended monetization pathway — when it arrives — is technology licensing: selling
      domain-specific world model capabilities to industrial partners rather than selling consumer
      or enterprise software. Yann LeCun projected that discussions with corporate partners could
      begin within 6-12 months of the March 2026 seed announcement, with a 3-5 year timeline to
      "quasi-universal intelligent systems." Nabla, LeBrun's prior healthcare AI company, is AMI's
      first and only publicly disclosed commercial partner, with access to early-stage research
      output under non-revenue terms.

      AMI's GTM motion is therefore research-to-partner rather than product-to-customer. There
      are no list prices, no transaction history, no customer pipeline, and no ARR to evaluate.
      Sales efficiency metrics (CAC, payback period, NRR) are structurally inapplicable at this
      stage. The Nabla partnership serves as a pilot context and early proof-of-concept validation
      in healthcare, not as a revenue-generating commercial agreement. A parallel open-source
      and academic publication commitment positions AMI as a research platform rather than a
      product company, which may attract follow-on partnerships but delays traditional IP moat
      formation that would support premium licensing.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI027, CI039]
    tableRefs: [TI002]
    figureRefs: [FI001]

  - id: cost-structure-burn
    title: Cost Structure, Burn Analogues, and Runway Estimates
    body: |
      LeBrun explicitly identified compute and talent as AMI's two main cost centers. All burn
      figures in this chapter are inferred estimates benchmarked against frontier AI lab analogues;
      no AMI-specific financial data has been disclosed.

      On compute: Epoch AI data shows training compute for frontier models has grown 4-5x per year
      since 2020, and the largest known AI data center requires approximately $24 billion in capital
      cost to operate 800,000 H100-equivalent chips. However, AMI's architectural thesis — JEPA
      world models requiring hundreds of millions rather than hundreds of billions of parameters —
      suggests substantially lower per-training-run compute than frontier LLMs. AI chip performance
      per dollar has improved approximately 37% per year (Epoch AI), meaning compute costs are
      declining in real terms. Sequoia Capital's analysis estimates GPUs represent roughly 50% of
      total AI data center cost-of-ownership, with energy, buildings, and networking comprising
      the remainder.

      On talent: AMI launched with an estimated team of approximately 12 people (Futurum Group
      analysis, March 2026), with active hiring underway across Paris, New York, Montreal, and
      Singapore. LeBrun stated AMI would "prioritize quality over quantity." Frontier AI research
      salaries at comparable labs (OpenAI, Anthropic, DeepMind) are publicly documented in the
      range of several hundred thousand to over one million USD in total annual compensation
      for senior researchers. If AMI scales to 100 researchers and staff at an average fully-loaded
      cost of $400,000-600,000, annual talent spend would reach $40-60 million — not accounting
      for equity dilution from the founding team.

      Combining conservative compute spend ($50-150M/year at early research scale) with talent
      ($40-80M/year at 80-150 headcount), and allowing for infrastructure and overhead, an annual
      burn rate of $150-300 million per year is a plausible range for years 1-3. Goldman Sachs has
      questioned whether AI infrastructure spending — estimated at $1 trillion globally — will
      ever generate commensurate revenue returns. Sequoia flagged that speculative AI infrastructure
      investment frenzies historically lead to capital incineration, GPU compute pricing power
      erosion, and faster-than-expected hardware depreciation. These macro risks apply to AMI's
      investors, not directly to AMI's near-term operations, but create a more challenging
      fundraising environment for the Series A.

      At a $150M/year burn, AMI's $1.03B provides roughly 6.9 years of runway. At $300M/year,
      runway falls to approximately 3.4 years. These are indicative ranges; actual burn trajectory
      depends heavily on whether AMI scales to large-compute training runs within years 2-3.
    claimRefs: [CI009, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI026, CI030, CI034, CI037, CI038, CI040]
    tableRefs: [TI004]
    figureRefs: [FI003, FI004]

  - id: traction-and-gaps
    title: Public Traction and Financial Data Gaps
    body: |
      AMI's financial profile is nearly opaque from public sources. It is a private French company
      (société par actions simplifiée) with no obligation to publish accounts, no SEC reporting,
      no public ARR, and no disclosed revenue. The only financial fact observable from external
      sources is the seed round size and valuation, confirmed by multiple independent outlets and
      the company's own announcement. A Form D SEC filing (April 2026) for US investment vehicles
      aggregating approximately $16.9 million provides a partial window into US investor tranche
      structure, but nothing about AMI's internal finances.

      Headcount data is sparse: Futurum Group estimated approximately 12 employees at the seed
      announcement. AMI's Ashby job board (archived May 2026) was accessible but yielded limited
      structured data. No LinkedIn headcount figure, no Glassdoor salary data, and no independent
      count of AMI staff have been published by credible third parties. Given the March 2026 seed
      close and LeBrun's explicit hiring mandate, current headcount is almost certainly higher
      than 12, but no precise figure is available.

      Compute access terms with NVIDIA (strategic investor) have not been disclosed. NVIDIA's
      strategic investments in AI labs typically include compute allocation agreements, which
      could materially offset AMI's hardware spend. Samsung and Toyota partnerships similarly
      may provide data or hardware access not reflected in burn-rate analogues drawn from pure
      financial investors. These in-kind arrangements, if present, would extend effective runway
      beyond the cash-only estimates in the prior section.

      The Nabla partnership terms are undisclosed: whether AMI receives any revenue, in-kind
      data access, or healthcare domain expertise from Nabla — and on what timeline — is unknown.
      LeBrun described it as "early access to AMI's research," not a commercial license, suggesting
      the relationship is primarily a data and validation pipeline for AMI, not a revenue source.
    claimRefs: [CI029, CI032, CI034, CI036]
    tableRefs: [TI003, TI005]
    figureRefs: [FI002]

  - id: financial-verdict
    title: Financial Verdict and Diligence Blockers
    body: |
      AMI's financial position is straightforward in structure but opaque in execution. The company
      holds approximately $1.03 billion in seed capital earmarked entirely for compute and talent,
      with zero revenue and a multi-year pre-revenue timeline. Capital adequacy appears sufficient
      for the stated research mandate at conservative burn rates; at $150-200M/year, the $1.03B
      seed gives AMI roughly five to seven years before a Series A is required. However, if compute
      demands accelerate in years 2-3 — as they did at comparable labs that scaled from small
      research to large training runs — runway could compress rapidly.

      Revenue quality is not ratable because there is no revenue. Margin path is entirely
      theoretical (the licensing model implies high gross margins, but there is no product to
      price). Capital intensity is high by research-lab standards: two cost centers of comparable
      size (compute and talent) with no revenue offset over the research phase. Financing
      dependency is complete: AMI cannot operate without external capital for at least 3-5 years.

      The two most material financial risks are: (1) burn acceleration if training runs need to
      scale beyond initial projections, potentially shortening runway and forcing a Series A
      under less favorable conditions than the oversubscribed seed; (2) time-to-revenue risk,
      where world models require longer research cycles than projected, forcing additional rounds
      at potentially lower valuations. A third risk is the tension between AMI's open-source
      commitment — which serves the research community and may attract talent and partners — and
      the IP protection required to enforce a premium licensing model. Goldman Sachs and Sequoia
      have both raised systematic questions about whether AI infrastructure investments will
      generate payback in venture timelines at all.

      The Futurum Group noted that AMI's Series A will be "the first real market test" of
      whether research output translates to commercial credibility. Key financial due diligence
      items outstanding include: (a) actual cash burn rate and draw-down schedule; (b) any
      in-kind compute arrangements with NVIDIA; (c) Nabla partnership commercial terms;
      (d) headcount ramp plan and total compensation budget; (e) Series A timeline and
      valuation targets; and (f) AMI's specific compute architecture requirements — a JEPA
      training run at frontier scale costs far less than a frontier LLM, but the exact order
      of magnitude remains private.
    claimRefs: [CI028, CI029, CI039, CI040]
    tableRefs: []
    figureRefs: []

