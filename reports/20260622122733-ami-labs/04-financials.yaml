callouts:
  - calloutType: risk
    title: No Revenue for At Least 3–5 Years
    body: >
      AMI Labs has explicitly committed to a multi-year research-first timeline. LeBrun stated
      that unlike a typical applied AI startup, it "could take years" for world models to
      transition to commercial applications. This creates a financing dependency cliff: AMI
      must raise a Series A before its seed capital is exhausted — likely without revenue proof
      — and must do so in a market where Goldman Sachs and Sequoia have both raised questions
      about the return profile of large AI research investments.
    claimRefs: [CI011, CI021, CI038, CI040]

  - calloutType: strength
    title: Oversubscribed Seed at Premium Valuation Validates Investor Conviction
    body: >
      AMI's round doubled from its initial target of €500 million to €890 million, confirming
      strong investor demand at the $3.5 billion pre-money. A diverse syndicate spanning financial
      VCs, sovereign wealth (Temasek), semiconductor (NVIDIA, Samsung), automotive (Toyota),
      and French industrial incumbents reduces single-investor dependency and signals broad
      strategic alignment with AMI's world model vision across multiple potential licensing markets.
    claimRefs: [CI004, CI033, CI031]

  - calloutType: risk
    title: Macro AI Capex Skepticism Is a Series A Risk
    body: >
      Both Goldman Sachs and Sequoia Capital have published skeptical analyses of large-scale
      AI infrastructure spending, noting a persistent gap between investment and demonstrable
      return. AMI's Series A will occur in this environment. If world model benchmarks or
      publications do not demonstrate clear superiority to LLMs for physical-world tasks by
      the time capital runs low, the Series A may be harder to price than the oversubscribed seed.
    claimRefs: [CI020, CI021, CI028, CI038]

  - calloutType: assumption
    title: JEPA Compute Thesis Reduces Cost but Remains Unverified
    body: >
      AMI's core financial efficiency thesis is that JEPA world models require far less compute
      than frontier LLMs because domain-specific world models work in representation space and
      use hundreds of millions rather than hundreds of billions of parameters. If this thesis
      holds, AMI's burn rate will be structurally below frontier LLM labs. If world model
      training turns out to require frontier-LLM-scale compute, AMI's runway could compress
      significantly and the capital raise may prove insufficient.
    claimRefs: [CI017, CI026, CI040, CI012]

