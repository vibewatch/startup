companyProfile:
  summary: >-
    AMI Labs (Advanced Machine Intelligence Labs) is a Paris-headquartered frontier AI research
    company co-founded in late 2025 by Turing Award winner Yann LeCun (Executive Chairman) and
    serial entrepreneur Alexandre LeBrun (CEO). The company is developing world models grounded
    in LeCun's Joint Embedding Predictive Architecture (JEPA) — a non-generative architecture
    that predicts future world states in abstract representation space rather than pixel or token
    space, intended to deliver persistent memory, planning, and controllability. Target application
    domains are industrial process control, healthcare diagnostics, clinical workflows, robotics,
    and wearable devices. AMI operates from four hubs: Paris, New York, Montreal, and Singapore.
    The company raised a $1.03B seed round in March 2026 at a $3.5B pre-money valuation, committing
    the capital to compute and talent rather than near-term revenue. No product has shipped and no
    commercial revenue has been generated as of the run date.
  foundedDate: "2025-12-15"
  founders:
    - name: Yann LeCun
      role: Executive Chairman (co-founder)
      background: >-
        2018 ACM Turing Award laureate; VP and Chief AI Scientist at Meta FAIR for 12+ years;
        NYU professor; originator of the JEPA architecture.
      claimRefs: [CO016, CO017, CO018, CO019]
    - name: Alexandre LeBrun
      role: CEO (co-founder)
      background: >-
        Co-founded Wit.ai (sold to Facebook 2015) and Nabla (healthcare AI, $120M raised,
        3× ARR growth); former Meta FAIR executive under LeCun.
      claimRefs: [CO020, CO021, CO022]
    - name: Saining Xie
      role: Chief Science Officer (co-founder)
      background: >-
        Former Google DeepMind and Meta FAIR researcher; co-creator of Diffusion Transformers
        (DiT); NYU faculty; 90,000+ research citations.
      claimRefs: [CO024, CO025]
  foundingLocation: Paris, France
  headquarters: Paris, France
  productSummary: >-
    Action-conditioned world models built on JEPA that predict environment transitions in
    abstract representation space; designed for industrial process control, healthcare diagnostics,
    robotics, and wearable devices. No product has shipped as of June 2026; the company is in
    extended research phase. Planned commercialization path is technology licensing to industry
    partners; open-source publications are a parallel track.
  customerFocus: >-
    Industrial enterprise buyers in manufacturing, healthcare, and robotics seeking reliable,
    controllable AI alternatives to LLMs; sovereign and regulated-market buyers in Europe
    and Asia-Pacific.
  businessModel: >-
    Technology licensing of world model infrastructure to industry partners; no current revenue.
    Open-source research publication as a parallel positioning track. Near-term monetization
    is explicitly not planned.
  stage: "Seed (post-$1.03B round)"
  fundingStatus: >-
    $1.03B seed round closed March 10, 2026; $3.5B pre-money valuation; co-led by Cathay
    Innovation, Greycroft, Hiro Capital, HV Capital, and Bezos Expeditions. Strategic
    participants include NVIDIA, Temasek, Samsung, and Toyota Ventures. French institutional
    backers include Bpifrance Digital Venture, Association Familiale Mulliez, and Publicis Groupe.
    Capital earmarked for compute and talent; no revenue generation planned in the near term.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO006, CO007, CO016, CO020, CO029, CO030]

summary:
  headline: >-
    AMI Labs is a scientifically credible but commercially unproven world-model research bet —
    track at the $3.5B seed valuation pending JEPA benchmark evidence and a commercial anchor
    beyond Nabla.
