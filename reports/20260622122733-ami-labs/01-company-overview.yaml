company:
  name: AMI Labs

chapter:
  number: 1
  title: Company Overview
  summary: >
    AMI Labs (Advanced Machine Intelligence Labs) is a Paris-headquartered frontier AI research company
    co-founded in late 2025 by Turing Award winner Yann LeCun and serial entrepreneur Alexandre LeBrun
    after LeCun departed Meta. The company is building world models based on LeCun's Joint Embedding
    Predictive Architecture (JEPA) — an alternative to generative LLMs that learns abstract
    representations of real-world sensor data. In March 2026 AMI closed a $1.03B seed round at a
    $3.5B pre-money valuation — Europe's largest seed round on record — backed by Cathay Innovation,
    Greycroft, Hiro Capital, HV Capital, Bezos Expeditions, NVIDIA, Temasek, Samsung, and 15+
    additional investors. The company has no product or revenue and has committed to a multi-year
    research-first timeline before commercial applications.

sections:
  - id: company-identity
    title: Identity, Headquarters, and Business Model
    body: |
      Advanced Machine Intelligence Labs — trading as AMI Labs — is a frontier AI research company
      incorporated and headquartered in Paris, France. From its founding in late 2025, the company
      has operated across four international hubs: Paris (headquarters), New York, Montreal, and
      Singapore. The Paris address anchors AMI within France's growing AI ecosystem alongside Mistral
      AI and Meta's FAIR lab; LeCun has stated the choice reflects his belief that frontier AI
      should not be an exclusively American or Chinese endeavor.

      AMI's full name, Advanced Machine Intelligence, signals its ambition: to build AI systems that
      transcend language-centric models and directly understand the physical world. The company's
      current stage is pre-revenue research; it has no commercial product and no plans to generate
      revenue in the near term. When monetization arrives, AMI intends to license world model
      technology to industry partners rather than selling consumer or enterprise software directly.
      The company has publicly committed to open-source code releases and open academic publications,
      positioning itself as a research platform for a broader community. French President Emmanuel
      Macron publicly welcomed AMI's Paris headquarters, calling it a milestone for French AI.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO041]
    tableRefs: [TO001]
    figureRefs: [FO003]

  - id: technology-vision
    title: Technology Vision — World Models and JEPA
    body: |
      AMI Labs' entire technology thesis rests on LeCun's Joint Embedding Predictive Architecture
      (JEPA), introduced in a 2022 position paper and refined through subsequent publications
      including I-JEPA (2023). JEPA's central insight is that generative approaches — which predict
      the future state of the world in high-dimensional pixel or token space — are fundamentally
      ill-suited for the continuous, noisy, high-dimensional sensor data that physical-world AI must
      process. Instead, JEPA trains models to predict in abstract representation space: learning what
      matters about how the world changes rather than attempting to reconstruct its surface appearance.

      AMI is developing action-conditioned world models: systems that predict the consequences of
      an agent's actions and plan multi-step action sequences under real-world constraints and safety
      guardrails. These world models, AMI argues, will exhibit persistent memory, the ability to
      reason and plan, and controllability — properties that current LLMs structurally cannot provide.
      Target application domains include industrial process control, factory automation, healthcare
      diagnostics and clinical workflows, robotics, and wearable devices. All are domains where
      LLM hallucinations carry real costs and where reliability and controllability are non-negotiable.
      The Nabla partnership — AMI's first commercial alliance — is specifically designed to test
      world model reliability in high-stakes clinical environments.

      AMI's thesis also has a structural economic dimension: smaller, domain-specific world models
      trained on relevant sensor data should require far less compute than trillion-parameter LLMs,
      potentially making frontier AI deployable on-device or in industrial settings with a fraction
      of today's infrastructure cost.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO049]
    figureRefs: [FO002]

  - id: founding-team
    title: Founding Team and Leadership
    body: |
      AMI Labs was built around Yann LeCun's scientific reputation and Alexandre LeBrun's operational
      track record, with supporting executives drawn largely from Meta's AI research organization.

      Yann LeCun holds the 2018 ACM A.M. Turing Award — computing's Nobel Prize — shared with
      Yoshua Bengio and Geoffrey Hinton for foundational work on deep neural networks. He spent more
      than a decade as VP and Chief AI Scientist at Meta's FAIR lab before departing in November 2025
      over reported disagreements with Mark Zuckerberg on AI strategy. LeCun retains his NYU
      professorship and serves as AMI's Executive Chairman; he is explicitly not the CEO. His
      decision to headquarter AMI in Paris while maintaining his New York base underscores the
      company's global, multi-continent structure.

      Alexandre LeBrun brings operational depth as CEO. He co-founded Wit.ai (sold to Facebook in
      2015) and then co-founded Nabla, a Paris-based healthcare AI company that had raised $120M
      and tripled ARR before LeBrun transitioned to AMI. LeBrun also worked under LeCun at Meta FAIR.
      Chief Science Officer Saining Xie joined from Google DeepMind, brings more than 90,000
      research citations, and co-created Diffusion Transformers (DiT) — the architecture underlying
      many leading generative systems. Chief Research and Innovation Officer Pascale Fung is a
      professor at HKUST and a pioneer in human-centered AI. Michael Rabbat (VP World Models) and
      Laurent Solly (COO, former Meta VP Europe) complete the executive team. Key-person dependency
      on LeCun is the most material single-person risk: his credibility is central to both investor
      confidence and hiring.
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO038, CO050]
    tableRefs: [TO002]

  - id: funding-investors
    title: Funding, Valuation, and Investor Syndicate
    body: |
      On March 10, 2026, AMI Labs announced a seed round of $1.03 billion USD (approximately €890M),
      setting a $3.5 billion pre-money valuation. PitchBook data cited by multiple outlets confirmed
      this as Europe's largest seed round on record. The raise significantly exceeded the €500M
      initial target reported by the Financial Times in December 2025.

      The round was co-led by five investors: Cathay Innovation (which had backed LeBrun at Nabla),
      Greycroft, Hiro Capital, HV Capital, and Jeff Bezos's Bezos Expeditions. Strategic investors
      included NVIDIA (signaling GPU infrastructure alignment), Toyota Ventures (industrial/auto
      applications), Temasek (Singapore hub and sovereign wealth), Samsung (device/consumer
      electronics), and Sea. French institutional backers included Bpifrance Digital Venture,
      Association Familiale Mulliez, Groupe Industriel Marcel Dassault, and Publicis Groupe.
      Notable angel investors include Eric Schmidt, Mark Cuban, Jim Breyer, Tim and Rosemary
      Berners-Lee, Xavier Niel, and Mark Leslie.

      LeBrun has been explicit that this capital is earmarked for two cost centers: compute and
      talent — not revenue generation. The company will prioritize quality over quantity in hiring
      across its four locations. The strategic investor composition (NVIDIA, Toyota, Samsung,
      Temasek) reflects deliberate positioning for industrial and sovereign AI markets where
      government and enterprise buyers seek non-US-hyperscaler AI alternatives.
    claimRefs: [CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037]
    tableRefs: [TO003]

  - id: milestones-trajectory
    title: Milestones, Partnerships, and Trajectory
    body: |
      AMI Labs' founding arc is unusually compressed: from LeCun's departure from Meta in November
      2025 to a $1.03B seed close in March 2026 covers just four months. The Nabla partnership
      — disclosed simultaneously with the funding announcement — represents the company's only
      publicly confirmed commercial alliance. Nabla will receive privileged early access to AMI's
      world models to test them in high-stakes clinical environments. LeBrun retains his role as
      Nabla's chairman and chief AI scientist, maintaining the strategic bridge between the two
      entities.

      As of the June 2026 run date, AMI remains in an extended research phase. No papers, benchmarks,
      or prototype demonstrations have been publicly released. LeBrun confirmed during the funding
      announcement that meaningful commercial products could take years to materialize. The company's
      immediate priorities are research infrastructure, compute procurement, and building the team
      across Paris, New York, Montreal, and Singapore. The world model sector is already attracting
      competitive interest: World Labs (Fei-Fei Li) closed a $1B round in February 2026, and General
      Intuition raised $134M in October 2025. LeBrun himself predicted that "world model" would
      become the next AI buzzword, with many companies rebranding to claim the term.
    claimRefs: [CO039, CO040, CO041, CO042, CO043, CO044, CO045, CO046, CO047, CO048]
    tableRefs: [TO004]
    figureRefs: [FO001]

