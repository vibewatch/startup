callouts:
  - calloutType: strength
    title: "Unmatched Scientific Founder Credentials"
    body: >
      Yann LeCun's Turing Award, 12-year FAIR leadership, and origination of the JEPA architecture
      position AMI as the de facto intellectual authority in the world model paradigm. Combined
      with LeBrun's operational AI track record at Nabla and Wit.ai, and Saining Xie's top-tier
      research credentials, the founding team is arguably the strongest assembled in a world model
      startup to date. This credibility is the primary asset justifying the $3.5B pre-money valuation
      at a pre-product, pre-revenue stage.
    claimRefs: [CO016, CO017, CO018, CO023, CO025]

  - calloutType: risk
    title: "Multi-Year Pre-Revenue Timeline Against Billion-Dollar Expectations"
    body: >
      LeBrun explicitly stated that AMI is not a typical applied AI startup expecting product and
      revenue within 12 months. Futurum Group's independent analysis flags structural tension: a
      $1.03B raise creates significant follow-on financing pressure when the next round will require
      evidence of commercial progress. Research labs at comparable scale — including DeepMind before
      Google's acquisition — have historically needed either a deep-pocketed patron or a defined
      revenue path. The Nabla partnership is a sensible anchor but healthcare AI regulatory timelines
      (FDA pathway) are long and uncertain.
    claimRefs: [CO007, CO042, CO046, CO048]

  - calloutType: insight
    title: "Sovereign AI Positioning Differentiates the Capital Stack"
    body: >
      The investor syndicate reads as deliberate sovereign AI positioning rather than a momentum-driven
      pile-on. French state investor Bpifrance, Singapore sovereign fund Temasek, Japanese industrial
      Toyota Ventures, French conglomerates Mulliez and Dassault, and Korean Samsung create a
      non-US-hyperscaler capital base that aligns with European AI Act compliance, government procurement,
      and regulated-market enterprise buyers. This may extend AMI's runway via non-dilutive grants
      and create preferential enterprise access in markets seeking alternatives to US or Chinese AI.
    claimRefs: [CO033, CO034, CO035, CO041]

