company:
  name: AMI Labs
chapter:
  number: 8
  title: Valuation
  summary: >-
    AMI Labs closed a $1.03B seed round in March 2026 at a $3.5B pre-money valuation — Europe's largest
    seed round on record — pricing in Yann LeCun's scientific brand, JEPA differentiation, and first-mover
    positioning in world models. Against frontier AI comparables (World Labs at $1B/seed and reportedly
    discussing $5B, Thinking Machines Lab at ~$12B, DeepSeek at $50B+), the entry valuation is high but
    not irrational given the sovereign-AI premium and strategic-investor composition. No revenue, a
    self-described multi-year research timeline, compute-cost escalation at 4–5× per year, and direct
    competition from Big Labs (Meta, Google DeepMind) make the stance "track" rather than "buy" at current
    pricing. Bull/base/bear scenarios span $2B–$50B on exit, with the base case implying a hyperscaler
    acquisition in the 2030–2033 window or a long-dated IPO contingent on demonstrated enterprise traction.

sections:
  - id: valuation-context
    title: "Valuation Context and the Comparable Set"
    body: >-
      AMI Labs priced its March 2026 seed round at $3.5 billion pre-money, yielding a $4.53 billion
      post-money on $1.03 billion raised. PitchBook confirmed this as Europe's largest seed round on
      record. The company had roughly a dozen employees at close, no product, and a self-stated timeline
      measured in years rather than quarters — making the valuation a near-pure bet on scientific
      credibility and strategic option value rather than on revenue or near-term cash flow.

      The closest structural comparables are elite-founder frontier AI laboratories valued before
      commercial scale. Fei-Fei Li's World Labs raised $230 million at a $1 billion valuation in
      August 2024 — itself considered large for a pre-product raise at the time — and was reportedly
      in discussions to raise at a $5 billion valuation by early 2026 following the launch of its
      Marble 3D world model product. Andreessen Horowitz led World Labs' Series A with a manifesto
      framing spatial intelligence as the next AI frontier, providing a direct intellectual parallel
      to AMI's JEPA positioning. Mira Murati's Thinking Machines Lab was valued at approximately
      $12 billion in its seed round, reflecting the premium the market applied to the former OpenAI
      CTO's pedigree. DeepSeek reportedly raised $7.4 billion at a $50 billion-plus valuation in
      June 2026, but DeepSeek has released production models and generated measurable usage — a
      materially different profile than AMI at seed stage. Odyssey, the world-model startup, led
      the week of June 18, 2026 with a $310 million raise, according to Crunchbase's weekly deals
      summary, confirming that capital continued to flow into the world-model sub-sector at scale
      through mid-2026.

      For a public market anchor, C3.ai reported $389.1 million in total revenue for fiscal year 2025
      (April 30, 2025 period end), representing 25.3% year-over-year growth, with $327.6 million in
      subscription revenue — a useful SaaS-comparable for benchmarking what an AI software platform
      looks like when it achieves commercial maturity, and a reminder of the long distance between
      AMI's current research stage and that level of monetisation. NVIDIA's cumulative AI startup
      investments, cited by PitchBook at approximately $53 billion across 170 deals, underscore the
      scale of strategic capital entering the sector — including NVIDIA's own participation in the
      AMI round.

      The pricing logic investors applied to AMI is consistent with a "sovereign AI" premium and a
      talent-scarcity premium. AMI's syndicate — co-led by Cathay Innovation, Greycroft, Hiro Capital,
      HV Capital, and Bezos Expeditions, with strategic participants including NVIDIA, Samsung,
      Temasek, and Toyota Ventures — spans US, European, and Asian sovereigns and strategics. The
      $3.5B pre-money compares favourably to World Labs' initial $1B valuation but is modest relative
      to Thinking Machines Lab's $12B seed, suggesting the market applied a calibrated discount for
      AMI's longer technology horizon and the specific risks of the JEPA architectural bet rather than
      LLM-adjacent approaches.
