callouts:
  - calloutType: risk
    title: No Commercial Product While Competitors Ship
    body: >
      AMI's multi-year research commitment is its most acute near-term competitive risk. World Labs
      has a deployed product API, Physical Intelligence has commercial partner deployments, and NVIDIA
      Cosmos is openly downloadable. Each additional quarter without an AMI product or pilot deployment
      allows competitors to build data flywheels, developer ecosystems, and customer relationships
      that compound as structural advantages. AMI's $1.03B seed round extends runway but does not
      accelerate product deployment if the research timeline is the binding constraint.
    claimRefs: [CP003, CP024, CP028, CP037]

  - calloutType: strength
    title: JEPA Architecture Occupies Unclaimed Commercial Territory
    body: >
      No commercially deployed competitor as of June 2026 combines a non-generative JEPA-style
      architecture with industrial or healthcare application targeting. AMI's differentiated positioning
      on controllability, compute efficiency, and reliability in safety-critical environments is
      substantiated by LeCun's foundational research and has no direct product-market competition
      in its stated verticals. The discontinuation of OpenAI Sora removed a major generative-architecture
      competitor from the world-simulator space.
    claimRefs: [CP026, CP035, CP036, CP040]

  - calloutType: risk
    title: Open-Source JEPA Commoditizes Core Architectural Moat
    body: >
      Meta FAIR's I-JEPA and V-JEPA codebases are publicly available on GitHub and HuggingFace
      under open licenses. Any well-resourced lab — including Google DeepMind, NVIDIA, or a future
      startup — can train a JEPA-based physical-world model without AMI's IP. AMI's durable
      competitive advantage must rest on something beyond the architectural principle: proprietary
      training data, domain-specific safety evaluation methods, exclusive partner relationships,
      and accumulated clinical or industrial evidence that cannot be reproduced from open-source
      starting points alone.
    claimRefs: [CP017, CP019, CP038, CP039]

