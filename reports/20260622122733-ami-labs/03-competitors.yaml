  - id: moat-durability-and-differentiation
    title: Moat Durability, Differentiation, and Competitive Risks
    body: |
      AMI Labs' primary architectural differentiation is its JEPA-based non-generative approach: by
      predicting in abstract representation space rather than reconstructing pixels or voxels, AMI's
      world models are designed to be more compute-efficient, more controllable, and more reliable in
      environments where hallucinations carry physical costs. No current commercially deployed competitor
      claims this combination of non-generative architecture and safety-critical physical-world targeting.
      AMI's founding team (LeCun, Xie, Rabbat, Fung) and their explicit healthcare and industrial domain
      focus — validated by the Nabla clinical partnership — represent credible initial moat components.

      However, four competitive risk vectors must be assessed. First, open-source commoditization:
      Meta FAIR's I-JEPA and V-JEPA are publicly available on GitHub, and the HuggingFace LeRobot
      ecosystem continuously lowers the cost of building embodied AI policies. The JEPA architecture
      itself is prior art, and a well-resourced competitor could train a JEPA-based industrial model
      without AMI's involvement. Second, deployment velocity: World Labs, Physical Intelligence,
      and NVIDIA Cosmos all have active products and developer communities; AMI's multi-year research
      commitment means competitors accumulate distribution, data, and customer feedback that compounds
      over time. Third, hyperscaler absorption: Google DeepMind and NVIDIA have unlimited compute and
      a path to incorporating any AMI-style world model advance into their own platforms. Fourth,
      architecture arbitrage: the world-model field is moving fast — if generative or hybrid architectures
      achieve comparable reliability at lower cost, AMI's non-generative differentiation narrows.

      The most durable AMI advantage is the combination of LeCun's credibility (which cannot be
      replicated) and the specific focus on controllability and safety properties for regulated industries.
      Healthcare and industrial enterprises face regulatory, liability, and safety requirements that
      consumer or developer-facing world-model products are not designed to satisfy. If AMI executes
      on the Nabla use-case and publishes results, it can establish proof-of-concept in a vertical
      no competitor has yet credibly claimed.
