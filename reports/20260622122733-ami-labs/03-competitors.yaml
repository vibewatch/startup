  - id: embodied-ai-physical-robotics
    title: "Embodied AI and Physical Robotics: Physical Intelligence and Wayve"
    body: |
      Physical Intelligence (π) is the closest analog to AMI in commercial ambition for physical-world
      AI, despite a different architectural strategy. Where AMI plans to license world models as
      infrastructure to industry partners, Physical Intelligence builds and deploys vision-language-
      action (VLA) models that directly control robot hardware. π0 (October 2024) was the first
      generalist robot policy trained on cross-embodiment data from eight distinct robot types, using
      internet-scale vision-language pretraining combined with robot sensorimotor data. π0.7 (April 2026)
      represents a step-change in generalization: it achieves compositional task generalization,
      successfully completing tasks never seen in training by composing skills from diverse training
      data, and transfers across substantially different robot embodiments without additional data.
      Physical Intelligence has an active partner program and named commercial relationships with
      robotics OEMs — the commercial traction benchmark AMI has yet to achieve.

      Notably, π0.7 uses a world model for generating visual subgoals: given a language command, a
      lightweight world model produces an image of what the next sub-step should look like, which is
      then provided to the policy model. This integration confirms that even robotics foundation-model
      companies now incorporate world model components — AMI's core product direction — into their
      pipelines. This indicates that AMI could either compete with Physical Intelligence or serve as
      an infrastructure layer beneath it.

      Wayve occupies the autonomous driving vertical with an end-to-end embodied AI approach it calls
      AV2.0: a single neural network converting raw sensor data into driving commands, without HD maps
      and without domain-specific labeled data. Wayve's approach uses self-supervised learning at
      scale — sharing philosophical DNA with AMI's unsupervised world model thesis — but the product
      application is driving-specific and Wayve is not competing for the industrial or healthcare
      markets AMI is targeting. Wayve is UK-based with investor backing from major automotive OEMs
      and technology companies.

      HuggingFace's LeRobot open-source framework deserves mention as a structural force: it provides
      hardware-agnostic, Python-native robot control with datasets and pretrained policies on the
      Hugging Face Hub, actively democratizing physical AI for developers and researchers. LeRobot
      reduces the proprietary advantage of any single company's robotic foundation model over time.
