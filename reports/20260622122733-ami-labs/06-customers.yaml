  - id: expansion-concentration-evidence-gaps
    title: Expansion, Concentration Risk, and Evidence Gaps
    body: >
      AMI's entire disclosed customer surface is a single non-paying design partner (Nabla),
      creating extreme concentration risk at the current stage. Because no commercial revenue
      exists, conventional concentration metrics (top-customer share of ARR, NRR, GRR) are
      undefined. The meaningful concentration risks are structural: if the Nabla partnership
      fails to produce a working world model integration, AMI loses its only real-world
      healthcare feedback loop. If Nabla's FDA certification journey stalls—which is
      structurally likely given the novelty of agentic clinical AI—the healthcare vertical entry
      point is delayed indefinitely.

      The fund-raising structure itself creates an expansion pressure: investors paying $3.5
      billion pre-money for a research-stage lab will expect evidence of commercial traction
      when the next financing round is raised. LeBrun's "years, not quarters" framing
      is honest but creates a difficult dynamic at Series A, which will likely come 18–24 months
      from the seed close (circa mid-2027 to late 2027). By that point, AMI will need to
      demonstrate at minimum: (a) working world model architecture with published benchmarks;
      (b) at least one active design-partner pilot generating real-domain data; (c) a credible
      regulatory filing strategy with Nabla or another healthcare partner.

      The land-and-expand model AMI envisions—licensing world model technology to one vertical
      or partner and expanding to adjacent buyers—requires a successful first anchor. Nabla's
      190+ health organization deployment footprint would provide genuine breadth if any AMI
      world model technology were integrated, but this is currently hypothetical. In industrial
      and robotic verticals, no named anchor exists.

      No customer count, ARR, NRR, or GRR data can be reported; all are undefined due to
      pre-revenue status. This chapter cannot distinguish between "zero customers" and
      "undisclosed early customers" because AMI has not filed a Form D or SEC disclosure
      requiring revenue disclosure, and all evidence of commercial status is from management
      public statements.
