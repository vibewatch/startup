  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: commercial-stage
      missingEvidence: >
        Any disclosed commercial contracts, design-partner agreements beyond Nabla, or
        indication of a qualified customer pipeline (number of active discussions, vertical
        breakdown, expected close dates).
      whyItMatters: >
        Without a visible customer pipeline, investors cannot assess whether AMI's
        research-to-product timeline is commercially viable or whether the design-partner
        model is generating traction.
      diligencePath: >
        Request CEO pipeline update at Series A; ask for number of active design-partner
        discussions and verticals being pursued; request sample term sheet for design-partner
        agreement structure.
      relatedQuestionRefs:
        - QU001
        - QU019
        - QU025

    - type: missing-source
      severity: material
      topic: nabla-partnership
      missingEvidence: >
        The full text or term sheet of the AMI-Nabla design-partner agreement, specifically:
        exclusivity scope, data-access terms, milestone schedule, and any revenue-sharing or
        future-licensing provisions.
      whyItMatters: >
        The relationship's commercial value to AMI is entirely dependent on the contract's
        terms. "Exclusive partnership" and "first access" may imply either a deep co-development
        commitment or a light MOU with no binding milestones.
      diligencePath: >
        Request disclosure of the Nabla partnership agreement's key commercial terms; at
        minimum ask for Nabla's milestone obligations and AMI's deliverables under the arrangement.
      relatedQuestionRefs:
        - QU014
        - QU020

    - type: missing-source
      severity: material
      topic: regulatory-path
      missingEvidence: >
        Nabla's specific regulatory strategy for FDA certification of agentic clinical AI:
        whether the path is 510(k), De Novo, or PMA; which device type code applies; and
        whether Nabla has engaged FDA through a Q-submission or pre-submission meeting.
      whyItMatters: >
        The FDA pathway determines the commercial timeline for the Nabla channel. A PMA or
        novel De Novo pathway could push first commercial deployment to 2030+, fundamentally
        changing AMI's near-term revenue outlook.
      diligencePath: >
        Request Nabla's pre-submission FDA engagement history; review FDA's emerging guidance
        on predetermined change control plans for adaptive AI (issued 2024–2025).
      relatedQuestionRefs:
        - QU017
        - QU008
        - QU005

    - type: private-evidence-only
      severity: material
      topic: investor-partners
      missingEvidence: >
        Whether any strategic investor (Toyota Ventures, Dassault, Samsung, ZEBOX) has entered
        into a design-partner or data-access agreement with AMI beyond their equity investment.
      whyItMatters: >
        Equity investment is not a commercial relationship. Confirming or ruling out design-partner
        agreements with strategic investors would materially change the assessment of AMI's
        near-term customer traction.
      diligencePath: >
        Ask AMI CEO directly whether any strategic investor has entered a co-development agreement;
        request reference calls with Toyota Ventures or Dassault contacts who can speak to
        commercial alignment.
