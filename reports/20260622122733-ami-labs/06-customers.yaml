chapter:
  number: 6
  title: Customers
  summary: >
    AMI Labs is pre-revenue with no commercial customers as of June 2026. The company's sole
    publicly disclosed partner is Nabla, a healthcare AI startup serving 190+ health organizations,
    which holds design-partner access—not a paying contract—to future AMI world model
    technology. Strategic investors including Toyota Ventures, Groupe Industriel Marcel
    Dassault, Samsung, and ZEBOX Ventures are likely early design-partner prospects, but
    no commercial engagements have been announced. CEO Alexandre LeBrun has explicitly
    stated that AMI is not a typical applied AI startup expecting revenue in 6–12 months,
    and LeCun indicated corporate partner discussions could begin six to twelve months from
    the March 2026 funding close. Healthcare regulatory barriers (FDA-certifiable autonomous AI),
    industrial procurement complexity, and the requirement for customers to adopt a new AI
    paradigm create compounding adoption friction that extends the pre-revenue phase.

sections:
  - id: commercial-stage-overview
    title: Pre-Commercial Stage and Customer Landscape
    body: >
      AMI Labs has no paying customers, no disclosed revenue, and no production deployments as of
      June 2026. The company launched in late 2025 with a $1.03 billion seed round, and its CEO
      Alexandre LeBrun was explicit in public statements: "AMI Labs is not your typical applied
      AI startup that can release a product in three months, have revenue in six months, and make
      $10 million in ARR in 12 months." This is a deliberate and stated strategic choice, not an
      oversight. AMI is funding a multi-year fundamental research agenda before pursuing
      commercial licensing.

      The company's customer strategy follows what practitioners call a design-partner model—
      engaging early users or partner organizations to co-develop and validate technology before
      formal commercial launch. AMI's mission statement targets "industrial process control,
      automation, wearable devices, robotics, healthcare, and beyond" as the eventual verticals,
      and Yann LeCun stated in a March 2026 interview with AFP that discussions with corporate
      partners "could be held within six to 12 months" of the funding announcement. That window
      spans roughly September 2026 to March 2027 but does not imply signed commercial contracts.

      The investor base itself is a proxy for early commercial interest. Strategic investors such
      as Toyota Ventures (robotics/automotive), Groupe Industriel Marcel Dassault
      (aerospace/industrial), NVIDIA (hardware and inference infrastructure), Samsung (devices),
      ZEBOX Ventures (CMA CGM logistics), and Publicis Groupe (creative/media) each signal
      sectors where AMI might find first design-partner traction. However, there is no public
      disclosure of contractual design-partner agreements with any of these parties.
