callouts:
  - calloutType: risk
    title: No Customers, No Revenue — AMI Is a Pre-Commercial Research Lab
    body: >
      As of June 2026, AMI Labs has zero paying customers and zero revenue. The company's CEO
      explicitly stated that AMI is not a typical applied AI startup expecting revenue within
      12 months. The sole public design partner (Nabla) holds access to future research, not a
      commercial product. Any analysis of customer quality, retention, or expansion must be
      framed against this pre-commercial baseline.
    claimRefs:
      - CU001
      - CU002
      - CU041
      - CU044

  - calloutType: risk
    title: FDA Certification Path for Autonomous Clinical AI Is Multi-Year
    body: >
      Nabla's stated goal of "FDA-certifiable agentic AI systems" is the most concrete near-term
      commercial pathway for AMI. However, the FDA clearance process for autonomous agentic
      clinical AI—beyond today's narrow diagnostic tools—has no established precedent and is
      likely to require a novel regulatory pathway spanning 3–7 years from substantive
      submission. This makes the Nabla channel the most structurally challenged path to early
      revenue.
    claimRefs:
      - CU013
      - CU032
      - CU033
      - CU038

  - calloutType: insight
    title: Strategic Investors Signal Vertical Breadth but Impose No Customer Obligation
    body: >
      The investor syndicate includes Toyota Ventures, Groupe Industriel Marcel Dassault,
      Samsung, ZEBOX Ventures, and Publicis Groupe—each signalling a target vertical.
      However, equity investment does not create any obligation to become a customer or design
      partner. The presence of these investors is valuable for market access and credibility,
      but investors should not be counted as customers or pipeline.
    claimRefs:
      - CU008
      - CU009
      - CU025
      - CU026
      - CU028

