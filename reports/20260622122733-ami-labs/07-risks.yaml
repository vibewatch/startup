  - id: geopolitical-sovereignty-risks
    title: Geopolitical and Sovereignty Risks
    body: >
      AMI Labs is explicitly constructed around a geopolitical narrative: a "third-path"
      sovereign European AI alternative to US-dominated and Chinese-dominated models. LeCun
      articulated this vision in the MIT Technology Review January 2026 interview, noting
      that many countries want sovereign control over AI and that an open-source European
      champion would address that demand. French President Macron publicly endorsed AMI's
      Paris headquarters. This narrative creates a specific risk profile: the company's
      strategic positioning depends on sustained EU political will, capital, and regulatory
      favorability—all of which could shift.

      US export controls on advanced AI chips (administered by BIS under the Export
      Administration Regulations) create a structural supply-chain risk: if chip export
      restrictions to EU entities tighten—or if EU-US trade relations deteriorate—AMI's
      training compute supply could be interrupted. Multi-jurisdictional operations (Paris,
      New York, Montreal, Singapore) create complex regulatory exposure and potential
      conflicts between GDPR obligations, US data localisation preferences, and Singaporean
      data governance rules. The OECD AI Principles and the EU AI Act together create a
      patchwork of compliance obligations that a pre-revenue company must navigate. The
      sovereign-AI narrative also creates a concentration risk: if AMI fails to demonstrate
      technical superiority or European AI funding dries up, the narrative collapses and
      the company loses its primary strategic differentiator.
    claimRefs:
      - CR041
      - CR044
