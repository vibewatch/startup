  - id: regulatory-legal-risks
    title: Regulatory and Legal Risks
    body: >
      AMI Labs is exposed to a layered, multi-jurisdictional regulatory stack. As a
      general-purpose AI (GPAI) model developer incorporated and headquartered in France
      (EU member state), AMI falls squarely within the scope of the EU AI Act (Regulation 2024/1689),
      which was adopted by the European Parliament on 13 March 2024 with 523 votes in favour.
      GPAI model providers must comply with transparency obligations—including publishing detailed
      training data summaries, complying with EU copyright law, and implementing model documentation—
      that came into force 12 months after the Act's entry into force (August 2025). Under
      Article 51, a GPAI model is presumed to have systemic risk if trained with cumulative
      computation exceeding 10^25 FLOPs, triggering additional obligations including mandatory
      model evaluation, systemic risk mitigation plans, and incident reporting.

      AMI's planned applications in healthcare and robotics fall under the EU AI Act's
      high-risk AI category, requiring conformity assessments, quality management systems,
      and post-market surveillance. In the US, AI-enabled medical devices require FDA clearance
      (510(k)) or premarket approval (PMA); the FDA released its AI/ML Action Plan in January
      2021 and has continued to develop a regulatory framework for adaptive AI medical software.
      US export controls administered by the Bureau of Industry and Security (BIS) restrict
      transfers of advanced AI chips and related technology to certain countries, creating
      supply-chain risk for AMI's European compute infrastructure if geopolitical conditions
      deteriorate. AMI has no disclosed pending litigation or IP disputes as of June 2026,
      but the absence of a public non-compete or IP assignment agreement between LeCun and
      Meta creates latent IP ownership ambiguity around JEPA architecture, which was developed
      under Meta FAIR funding.
