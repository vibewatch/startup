callouts:
  - calloutType: risk
    title: "Key-Person Risk: LeCun Is Not the CEO"
    body: >
      The single most underappreciated governance risk at AMI Labs is that Yann LeCun—whose
      name, scientific reputation, and network justify the $3.5B valuation—is executive chairman,
      not CEO, and explicitly not hands-on operationally. He retains his NYU professorship and
      is based in New York while the company is headquartered in Paris under a CEO who
      simultaneously chairs and serves as chief AI scientist of AMI's anchor clinical partner.
      This governance structure is fragile: LeCun could reduce involvement at any point without
      breaching a disclosed employment agreement, and the CEO's bandwidth is structurally divided.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR014

  - calloutType: risk
    title: "EU AI Act GPAI Obligations: AMI Is Directly in Scope"
    body: >
      AMI Labs, as a Paris-headquartered GPAI model provider, is unambiguously within the scope
      of the EU AI Act. GPAI transparency obligations apply from August 2025; systemic-risk
      obligations (for models above 10^25 FLOPs) apply from August 2026. AMI's planned frontier
      world-model training runs will almost certainly breach the 10^25 FLOP threshold, making
      systemic-risk compliance mandatory. There is no public evidence that AMI has engaged the
      EU AI Office or established a GPAI compliance programme as of June 2026.
    claimRefs:
      - CR025
      - CR026
      - CR032
      - CR033

