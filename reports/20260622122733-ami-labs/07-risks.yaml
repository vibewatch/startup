  - id: keyperson-governance-financing-risks
    title: Key-Person, Governance, and Financing Risks
    body: >
      The governance structure at AMI Labs creates two distinct key-person risk vectors. LeCun serves
      as executive chairman—not CEO—and explicitly describes his role as strategic rather than
      operational, retaining his NYU professorship and remaining based in New York. The company is
      headquartered in Paris under CEO Alex LeBrun, who simultaneously holds the role of chairman and
      chief AI scientist at Nabla (AMI's anchor clinical partner). This dual-role arrangement means
      the most recognized scientific authority is part-time, while the operational lead carries
      concurrent responsibilities to a separate entity. LeCun's departure from Meta in November 2025
      after 12 years—triggered by disagreements with Zuckerberg over AI strategy—demonstrates that
      high-profile AI scientists can disengage from institutional commitments when philosophical
      misalignments arise, which represents a non-trivial recurrence risk at AMI.

      Financing risk is material. The $1.03B seed round at a $3.5B pre-money valuation is predicated
      on a research timeline with no near-term revenue milestones. Peer frontier AI labs (Anthropic,
      Mistral, Cohere) have raised additional rounds at 18–24 month intervals to sustain comparable
      compute-intensive research programs. AMI will almost certainly need post-seed capital within
      its 2-year research horizon. Sequoia's analysis identifies compute as a commodity with
      collapsing pricing power, which means each subsequent training run AMI undertakes faces
      both rising absolute cost (4–5× annual growth) and compressed returns. Goldman Sachs
      independently identified the ROI deficit in frontier AI spending.
