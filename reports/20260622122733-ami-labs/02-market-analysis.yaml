callouts:
  - calloutType: strength
    title: Physical AI Market Timing — Structural Tailwinds Are Real
    body: >
      Three converging structural forces create genuine market tailwinds for AMI's thesis:
      China's 15th Five-Year Plan designating robotics as an economic priority accelerates
      Western competitive pressure; NVIDIA's GTC 2026 commitment to Physical AI infrastructure
      validates the market category at hyperscaler scale; and European AI sovereignty demand
      creates structural preference for a Paris-headquartered frontier lab. These forces are
      independent of whether JEPA is the winning architecture — they create demand for the
      category AMI is targeting regardless.
    claimRefs: [CM027, CM028, CM014]

  - calloutType: risk
    title: No Published SAM for World Model Licensing — All Sizing Is Speculative
    body: >
      The most material market analysis risk is structural: no analyst has independently sized
      the world model infrastructure licensing market as a distinct commercial category. The
      $13–26B SAM estimate in this chapter is entirely analyst-inferred from infrastructure
      capture rate assumptions applied to adjacent market estimates. Investors pricing AMI at
      $3.5B pre-money should recognize that the market size justifying that valuation rests on
      unverified and unpublished segmentation logic.
    claimRefs: [CM038, CM041]

  - calloutType: insight
    title: Investor Composition as Segment Proxy — The Syndicate Defines the Market Map
    body: >
      AMI's strategic investor composition provides the clearest independently verifiable
      market segmentation signal. NVIDIA (physical AI infrastructure), Toyota Ventures
      (automotive and industrial robotics), Samsung (devices and wearables), Temasek
      (Asia-Pacific sovereign), and Bpifrance (European sovereign) are not passive
      financial investors. Their participation implies pre-commercial due diligence on
      specific segment fit — making the investor syndicate a de facto market validation
      signal more reliable than any published analyst estimate for an undefined category.
    claimRefs: [CM021, CM029]

  - calloutType: assumption
    title: Infrastructure Capture Rate of 5–10% Is Unvalidated
    body: >
      The SAM estimate of $13–26B rests on an assumed 5–10% infrastructure capture rate
      applied to physical AI application sub-markets. This rate is based on analogies to
      other AI infrastructure layers (database, middleware, ML platforms) and has not been
      validated for world model licensing specifically. If the correct capture rate is
      2–3% (as it is for some low-level infrastructure), the SAM falls to $5–10B; if
      AMI achieves higher vertical integration (15–20%), the SAM could reach $40–60B.
      The range of outcomes is wide and not currently constrainable with available evidence.
    claimRefs: [CM038, CM041]

