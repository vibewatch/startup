chapter:
  number: 2
  title: Market Analysis
  summary: >
    AMI Labs addresses the nascent physical-world AI infrastructure market — spanning industrial
    process control, healthcare diagnostics, robotics, and wearable devices — where LLM
    architectures fail due to continuous, high-dimensional sensor environments. The global AI
    market stood at ~$391B in 2025 (CAGR 30.6%) while healthcare AI and robotics AI sub-segments
    each carry 19–40% CAGR through the early 2030s; AMI's SAM is constrained by its research
    timeline and absent product. European AI sovereignty demand and labor-driven automation tailwinds
    support long-term adoption, but world-model commercial readiness, FDA pathways, and industrial
    enterprise conservatism are structural near-term constraints. No analyst has independently sized
    the world model licensing market, making all SAM estimates speculative.

sections:
  - id: market-boundary
    title: Market Boundary — Physical-World AI Infrastructure
    body: |
      AMI Labs operates at the foundation layer of a market that has no canonical analyst
      definition: physical-world AI infrastructure, alternatively described as embodied
      intelligence, physical AI, or world-model-based AI. The defining characteristic of
      this market is the requirement for AI systems that can understand, predict, and act
      within continuous, noisy, high-dimensional real-world environments — industrial plants,
      clinical settings, robotic systems, and wearable devices — rather than manipulating
      discrete text or language tokens.

      LeCun explicitly frames the market boundary around the Moravec Paradox: what is
      trivially easy for humans (perception, navigation, physical manipulation) remains
      computationally intractable for current AI. Large language models, architecturally
      constrained to discrete token sequences, cannot reliably predict the consequences of
      physical actions or maintain consistent world-state representations across multi-step
      operational sequences. In a January 2026 MIT Technology Review interview, LeCun
      identified the four concrete application domains: industrial process control (jet
      engines, steel mills, chemical factories), factory automation and robotics, healthcare
      diagnostics and clinical workflows, and smart or wearable devices.

      AMI's company website, investor communications from Cathay Innovation, and press
      coverage consistently confirm these four segments as the declared market boundary.
      NVIDIA's parallel positioning of "Physical AI" as a distinct infrastructure category
      — investing in Isaac simulation, Cosmos world model training, and robotics inference
      infrastructure — provides external corroboration that the market boundary is coherent
      and recognized by capital-intensive players.

      Excluded from AMI's core market are: pure text and language-centric applications
      (LLMs, chatbots, document summarization), generative image and video creation
      (diffusion models), and traditional ML classification on structured tabular data.
      The boundary is not geographic: AMI's Paris headquarters and multi-hub structure
      (New York, Montreal, Singapore), together with its European and Asian investor
      syndicate, signal a global market aspiration with particular sensitivity to
      European AI sovereignty requirements.

      Status-quo substitutes for AMI's intended technology include conventional SCADA and
      PLC industrial control systems, rule-based clinical decision support software,
      teleoperation-based robotic systems, specialized computer vision models, and
      LLM-based agentic frameworks that bolt action-planning onto language models. Each
      substitute carries documented limitations in generalizable physical reasoning —
      the gap world models are designed to close. The Moravec Paradox framing is LeCun's
      own explanatory lens and represents company-claimed market logic, not independently
      validated market boundary research.
    claimRefs: [CM001, CM002, CM003, CM004, CM015, CM016, CM030]
    tableRefs: [TM001]
    figureRefs: []

  - id: market-sizing
    title: Market Sizing — TAM, SAM, and Evidence-Constrained Lenses
    body: |
      No analyst has defined a specific market for "world models" or "physical-world AI
      infrastructure" as a standalone commercial category, making TAM sizing an exercise
      in bounding adjacent markets and applying a relevance filter.

      Broad TAM — Physical-World AI Addressable (~$258–610B, 2026 estimates): Three
      independent analyst anchors frame the upper limit. Grand View Research sizes the
      total AI market at $390.9B in 2025, projected to $3,497.3B by 2033 at CAGR 30.6%.
      MarketsandMarkets sizes the market at $601.9B in 2026, projected $3,638.1B by 2033
      at CAGR 29.3%. Both figures encompass all AI verticals including text and generative
      AI; AMI's addressable portion is a subset. The three sub-segments most relevant to
      AMI's stated domains are: (1) Healthcare AI — $36.7B in 2026 projected to $194.8B
      by 2031 at CAGR 39.7% (MarketsandMarkets); (2) Industrial automation — $206.3B in
      2024 projected to $378.6B by 2030 at CAGR 10.8% (Grand View Research); and
      (3) Robotics AI Software — $21.0B in 2025 projected to $70.8B by 2032 at CAGR
      19.0% (MarketsandMarkets).

      SAM — World Model Infrastructure Licensing (not independently sized): AMI's
      stated revenue model is technology licensing to industry partners, not direct
      vertical deployment. An infrastructure-layer licensing business would capture a
      fraction of the vertical markets above — infrastructure layers historically capture
      approximately 3–15% of the application-layer value they enable. Applying a 5–10%
      capture rate to the $258B combined physical AI sub-segment (healthcare AI +
      robotics AI software, mid-2026 estimates) yields a rough 2031-horizon SAM of
      $13–26B, with wide uncertainty given AMI's research-first timeline and the absence
      of any deployable product. This is analyst-inferred; no published source independently
      validates the capture rate or the sub-segment composition.

      SOM — Serviceable Obtainable 2026–2028 (effectively zero): AMI is a research-first
      company with no current product. CEO LeBrun indicated in January 2026 that commercial
      rollouts could begin "in about a year," implying earliest commercial revenue in 2027
      at the optimistic end. Near-term SOM is bounded by the Nabla healthcare partnership
      as a single channel client, not a mass market. The $3.5B pre-money seed valuation
      implies investors are paying primarily for scientific credibility and long-term option
      value in the physical-world AI category, not near-term revenue.

      A material contradictory sizing signal: industrial automation — the largest
      physical-world segment by value — shows a 10.8% CAGR, substantially below the
      29–40% CAGR range for AI-specific market segments. This divergence reflects the
      capital-intensive, conservative-adoption nature of industrial deployment. Investors
      extrapolating from headline AI growth rates to AMI's physical-world markets are
      likely overstating near-term addressable demand.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM038, CM039]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]

  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: |
      AMI's licensing model means the company's direct buyer is an enterprise that builds
      or deploys AI-enabled systems — not the end user of those systems. This B2B
      infrastructure dynamic creates a two-tier market structure: AMI must win technical
      credibility with system builders and commercial adoption from operations-oriented
      enterprise buyers simultaneously.

      Industrial Automation (Largest addressable segment by 2030): Buyers are
      manufacturing CTOs, plant operations directors, and automation engineers at large
      industrial companies in chemicals, automotive, energy, and aerospace. The payer
      is the capital expenditure budget, which cycles every 3–5 years. Adoption is
      triggered by a combination of rising labor costs, plant modernization initiatives,
      and competitive pressure from Chinese manufacturers whose robot density advantage
      is accelerating. IFR data confirms US robot installations rose 11% in 2025 to
      38,000 units, with food industry adoption surging 30% — signaling broadening
      automation demand beyond traditional automotive. China's annual installations
      reached approximately 295,000 units in 2024 (54% global share), reinforcing
      competitive pressure on Western manufacturers to accelerate AI-enabled automation.

      Healthcare (Highest near-term signal given Nabla partnership): Buyers are healthcare
      system CIOs and clinical informatics teams. Payers are hospital operating budgets and,
      ultimately, health insurance reimbursement frameworks. Forbes reported that LeBrun
      specifically cited the limits of current AI in clinical settings as AMI's entry point —
      world models enabling more reliable clinical decision support beyond what LLMs can
      safely provide. FDA and EMA clearance gates patient-facing applications; the Nabla
      partnership appears positioned as a workflow tool (AI scribing) rather than an
      FDA-regulated clinical device, which may accelerate the initial commercial timeline.

      Robotics OEMs (Platform / channel buyer): AMI could license world model APIs to
      robotics hardware manufacturers. Toyota Ventures' participation in the seed round
      signals automotive and industrial robotics interest. LeCun's explicit framing is
      that current robots are task-specific and cannot generalize — precisely the gap world
      models would fill. The strategic buyer in this segment is the VP of AI/Software at
      a robotics OEM, with a product development budget and multi-year hardware cycle.
      LeCun acknowledged that current humanoid robots are trained through teleoperation
      and fail to generalize across environments — a statement that simultaneously describes
      the market problem and raises uncertainty about the speed of commercial readiness.

      Wearable / Device OEMs (Longest lead time): Samsung's strategic investment signals
      wearable devices and smart glasses as a potential application domain. LeCun described
      smart glasses that could "watch what you're doing, identify your actions, and predict
      what you're going to do next" as a world model use case. Budget ownership falls to
      R&D departments at consumer electronics OEMs with 2–3 year hardware design cycles.

      Investor composition provides the clearest segmentation signal: NVIDIA (physical AI
      infrastructure), Toyota Ventures (automotive and industrial robotics), Samsung
      (devices and wearables), and Temasek (Asia-Pacific sovereign and enterprise capital)
      are all strategic rather than financial investors, each signaling a segment where
      world model technology could be embedded.
    claimRefs: [CM019, CM020, CM021, CM022, CM023, CM024, CM025]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: |
      Growth Drivers:

      Labor arbitrage and automation demand: Global labor shortages across manufacturing,
      healthcare, and logistics are a structural driver. IFR confirms US robot installations
      rose 11% in 2025, with food industry adoption surging 30%. China's 15th Five-Year Plan
      (2026–2030) places robotics at the heart of its modern industrial system, explicitly
      focusing AI research on physical applications and designating robots as the main driver
      of economic growth. This creates urgency for Western manufacturers and governments to
      invest in physical AI infrastructure that can match China's deployment scale.

      Physical AI infrastructure investment: NVIDIA has validated "Physical AI" as a
      distinct infrastructure category at GTC 2026. NVIDIA's Isaac simulation platform,
      Cosmos world model training infrastructure, and robotics inference stack represent
      hyperscaler-scale investment in the enabling infrastructure for AMI's target market.
      The Futurum Group analyst notes that NVIDIA's investor role in AMI signals alignment
      rather than competition — AMI's foundation model layer could complement rather than
      compete with NVIDIA's compute infrastructure.

      European AI sovereignty demand: European governments, sovereign wealth funds, and
      enterprise buyers are actively seeking AI infrastructure that does not route through
      US hyperscaler supply chains or expose sensitive data to US cloud jurisdiction.
      Bpifrance's participation in AMI's seed round reflects French state investment in
      domestic AI capability. LeCun's explicit framing of AMI as "neither American nor
      Chinese" speaks directly to sovereign AI demand, creating structural market preference
      beyond pure technical merit. France's national AI ecosystem and EU AI Act compliance
      requirements add further structural tailwinds for a European-headquartered frontier
      AI lab.

      LLM failure-mode awareness: The documented failure modes of LLMs in high-stakes
      physical environments — hallucination, inability to model action consequences, and
      unreliable temporal reasoning — are generating growing enterprise demand for more
      reliable AI architectures. SiliconAngle coverage and the Futurum Group analysis both
      note that industrial and healthcare buyers are acutely aware of LLM reliability limits.

      Adoption Constraints:

      World model technology unproven commercially: World models as a commercial product
      category do not exist. The Futurum Group explicitly flags "the structural tension
      between a research-first mandate and investor expectations calibrated to a billion-
      dollar raise." AMI is betting JEPA-based architectures will achieve commercial-grade
      performance on physical tasks faster than alternative approaches, but no external
      validation of that timeline exists.

      Regulatory pathways: FDA and EMA clearance for patient-facing clinical AI involves
      pre-market review measured in years. Industrial safety certifications (IEC 61511,
      ISO 13849) for autonomous systems require extensive validation. EU AI Act compliance
      for high-risk applications in healthcare and industrial control adds regulatory
      complexity specifically in AMI's primary European target markets.

      Enterprise adoption conservatism: Industrial and healthcare enterprise buyers have
      capital-intensive, multi-year planning cycles and high switching costs from incumbent
      platforms (Siemens, GE, Honeywell in industrial; Epic, Cerner in healthcare). Grand
      View Research's industrial automation data confirms that even with AI integration,
      the sector grows at 10.8% CAGR — far below headline AI growth — reflecting this
      conservatism. Capital expenditure cycles average 3–5 years.

      Competing physical AI architectures: Google DeepMind, Meta Superintelligence Labs,
      Physical Intelligence, and 1X are all developing adjacent physical AI capabilities.
      LLM providers are investing in reasoning and action capabilities that could converge
      on world model use cases. LeCun acknowledges that if major LLM providers accelerate
      work on world models and spatial learning, AMI's architectural window of
      distinctiveness narrows. No published benchmark independently compares JEPA-based
      world models against competing approaches on physical-world tasks.

      Generalization gap in robotics: LeCun publicly stated in January 2026 that "nobody,
      absolutely nobody, knows how to make those robots smart enough to be useful,"
      attributing this to teleoperation-dependent training data that fails to generalize
      across environments. This candid acknowledgment, while framing the market opportunity
      for world models, also signals the technical distance from commercial deployment.
    claimRefs: [CM026, CM027, CM028, CM029, CM031, CM032, CM033, CM034, CM035, CM036, CM037]
    tableRefs: [TM004]
    figureRefs: [FM004]

  - id: contradictions-gaps
    title: Sizing Contradictions, Evidence Gaps, and Diligence Priorities
    body: |
      The chapter preserves three material contradictions that remain unresolved.

      Contradiction 1 — AI growth rate vs. physical-world deployment speed: Headline AI
      market CAGRs of 29–31% (MarketsandMarkets, Grand View Research) substantially
      exceed the industrial automation market's 10.8% CAGR — the largest single segment
      in AMI's physical-world scope. The divergence reflects the dominance of text, language,
      and generative AI in aggregate AI market sizing. Investors who priced AMI at $3.5B
      pre-money on day one of research may be extrapolating from headline AI growth rates
      that are not representative of physical-world AI adoption speed, particularly given
      the capital expenditure conservatism of industrial and healthcare buyers.

      Contradiction 2 — Robotics commercial readiness claims: LeCun's January 2026
      statement that "nobody, absolutely nobody, knows how to make those robots smart
      enough to be useful" directly contradicts commercial deployment claims from Agility
      Robotics, Figure AI, 1X, and Boston Dynamics, all of which describe near-term
      general-purpose humanoid robot commercialization. Both positions cannot simultaneously
      be accurate about current-state robot generalization. The contradiction remains
      unresolved and represents a significant market timing uncertainty for any physical AI
      infrastructure provider.

      Contradiction 3 — World model distinctiveness vs. LLM convergence: AMI's thesis
      requires that LLMs structurally cannot capture the physical-world AI market. However,
      Google DeepMind's Gemini Robotics, NVIDIA's Project GR00T, and OpenAI's physical
      agent work all attempt to use multimodal foundation models for similar physical-world
      tasks. Whether JEPA-based world models are architecturally superior in physical-world
      tasks or whether the approaches converge is a key empirical question with no published
      benchmark resolution.

      Critical Evidence Gap — No analyst SAM for world model licensing: No published
      analyst report independently sizes the world model infrastructure licensing market as
      a distinct category. All market estimates are for broader categories that include
      non-world-model applications. The SAM of $13–26B cited in this chapter is
      analyst-inferred using infrastructure capture rates and is not sourced from any
      published research. This is the most material sizing gap for investment diligence.
    claimRefs: [CM038, CM039, CM040, CM041]
    tableRefs: []
    figureRefs: []

