      - number: '6.2'
        title: 'Nabla as First Design Partner: Healthcare Entry Point'
        blocks:
          - type: paragraph
            body: >
              Nabla is AMI's only publicly named partner and serves as the company's earliest evidence of real-world
              orientation, albeit not of commercial revenue. The December 2025 press release described the arrangement
              as "exclusive strategic partnership," with Nabla gaining "first access" to AMI's emerging world model
              technologies. Nabla's stated goal is to become "the first to bring FDA-certifiable agentic AI systems to
              healthcare"—a positioning that depends entirely on AMI successfully building certifiable world model
              technology, an outcome years away.

              Nabla's scale provides meaningful context for how AMI's technology would eventually touch the healthcare
              market. As of June 2026, Nabla serves over 190 health organizations and 150+ health systems and provider
              groups across 35+ languages, with more than 100,000 clinicians using its ambient documentation platform.
              These customers belong to Nabla, not AMI. No revenue flows to AMI from Nabla's clinical deployments, and
              the current AMI-Nabla arrangement is characterized by co-development access, not licensing fees.

              The Nabla partnership carries significant structural ties: LeBrun was Nabla's co-founder and CEO before
              becoming AMI's CEO, and LeCun has been a Nabla investor and advisor since the company's founding. LeBrun
              retains the role of Chairman and Chief AI Scientist at Nabla. This depth of relationship provides AMI with
              genuine early-stage intelligence about healthcare buyer needs and LLM limitations in clinical settings,
              but it also means the relationship is not arm's-length and cannot serve as an independent commercial proof
              point.

