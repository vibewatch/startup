            title: Sovereign AI Positioning Differentiates the Capital Stack
            body: >
              The investor syndicate reads as deliberate sovereign AI positioning rather than a momentum-driven pile-on.
              French state investor Bpifrance, Singapore sovereign fund Temasek, Japanese industrial Toyota Ventures,
              French conglomerates Mulliez and Dassault, and Korean Samsung create a non-US-hyperscaler capital base
              that aligns with European AI Act compliance, government procurement, and regulated-market enterprise
              buyers. This may extend AMI's runway via non-dilutive grants and create preferential enterprise access in
              markets seeking alternatives to US or Chinese AI.
