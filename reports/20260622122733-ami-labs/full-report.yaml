      - number: '6.3'
        title: Target Buyer Segments and Procurement Pathway
        blocks:
          - type: paragraph
            body: >
              AMI's target customer profile is the enterprise buyer in data-rich, safety-critical environments where LLM
              hallucinations carry meaningful operational or regulatory risk. LeCun described the archetypal use case as
              an aircraft engine manufacturer wanting a holistic model of thousands of sensors to optimize efficiency
              and predict failure—a buyer in the industrial-manufacturing vertical with multi-decade equipment life
              cycles and multi-year vendor evaluation processes. Healthcare buyers (hospital systems, medical device
              manufacturers, health AI platforms like Nabla) share the safety-critical profile but operate under even
              more stringent procurement governance driven by FDA clearance requirements, clinician workflow
              integration, and liability exposure.

              For robotics, the relevant buyer role is the automation or engineering leader at a manufacturing or
              logistics company seeking reliable action-prediction capabilities for physical robots—buyers currently
              supplied by NVIDIA's Isaac robotics platform or companies like Physical Intelligence and 1X Technologies.
              For wearable devices, the buyer is likely a device OEM (Samsung, Garmin, Oura) seeking persistent-memory
              ambient intelligence that the device hardware layer can run efficiently.

              In all cases, the procurement pathway for AMI world models will require: (1) a design partner agreement
              that gives the customer access to early model checkpoints in exchange for domain data and evaluation
              feedback; (2) a pilot phase, likely 6–18 months, during which the world model is tested against the
              customer's sensor environment; (3) a commercial license negotiation based on pilot outcomes. This
              multi-step process means even the earliest engaged partner today (Nabla, engaged December 2025) is years
              away from a signed commercial license.

              No public evidence of formal design-partner agreements beyond Nabla has been disclosed. The presence of
              Toyota Ventures, Dassault, ZEBOX, Samsung, and SEA in the investor syndicate is consistent with commercial
              alignment, but equity investment does not obligate any party to become a customer or design partner.
