              its π0.7 steerable robot foundation model in April 2026. OpenAI's Sora video generation model was
              discontinued in April 2026, demonstrating that generative video world models face commercial headwinds
              that validate AMI's non-generative bet — but also showing that even a well-funded generative approach
              failed to achieve broad commercial uptake. AMI's specific execution gaps are material: (1) No product or
