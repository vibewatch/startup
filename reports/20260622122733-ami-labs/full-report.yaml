      - number: '8.2'
        title: Investment Thesis and Anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The affirmative thesis rests on four pillars: scientific credibility, architectural distinctiveness,
              strategic optionality, and sovereign premium. LeCun's Turing Award pedigree and decade leading Meta FAIR
              constitute a uniquely de-risked scientific leadership profile. JEPA's abstract representation-space
              predictions, as opposed to generative pixel- or token-level prediction, are a testable differentiation
              hypothesis with a published research track record. The syndicate's strategic composition — particularly
              NVIDIA, Temasek, Samsung, and Toyota Ventures — signals that industrial buyers with long planning horizons
              believe world model AI will be applicable in their supply chains and products within AMI's operating
              window. The sovereign AI dimension (European headquarters, multi-continent investor mix, Bpifrance
              participation) provides access to public funding flows and regulated-sector procurement pipelines
              unavailable to US-only peers.

              The adversarial thesis is equally compelling. AMI's CEO LeBrun was explicit at announcement: this is not a
              typical applied AI startup with revenue in six months. The company will run research for years before
              commercialising. Goldman Sachs' analysis of AI capex estimated that approximately $1 trillion in planned
              AI infrastructure investment has "little to show" in revenue or measurable productivity benefit so far.
              Sequoia's updated analysis expanded its "$200B question" to a "$600B question" — the gap between
              infrastructure CapEx and revenue needed to sustain it — without reaching a resolution. If that structural
              capex-to-revenue gap is the risk for LLM-adjacent AI, it is compounded for world models, which face an
              additional architectural bet: that JEPA's approach will outperform multimodal LLMs in the application
              verticals AMI targets, before the same Big Labs that outresource AMI by orders of magnitude converge on
              similar architectures.

              The CB Insights AI 100 for 2026 highlights that the vertical AI companies with durable businesses are
              those whose data is the moat — either non-textual, rare, or embedded deeply in regulated workflows. AMI's
              intended verticals (manufacturing, healthcare, robotics) fit this thesis, but AMI does not yet have that
              data, those workflows, or those customers. The pathway from research lab to data-moat enterprise incumbent
              is long and historically requires either a hyperscaler patron or a very long runway.
