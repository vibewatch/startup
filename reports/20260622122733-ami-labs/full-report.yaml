      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Unmatched Scientific Founder Credentials
            body: >
              Yann LeCun's Turing Award, 12-year FAIR leadership, and origination of the JEPA architecture position AMI
              as the de facto intellectual authority in the world model paradigm. Combined with LeBrun's operational AI
              track record at Nabla and Wit.ai, and Saining Xie's top-tier research credentials, the founding team is
              arguably the strongest assembled in a world model startup to date. This credibility is the primary asset
              justifying the $3.5B pre-money valuation at a pre-product, pre-revenue stage.
            calloutType: strength
            claimRefs:
