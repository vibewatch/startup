              conditioned planning module exists only as a design concept in LeCun's 2022 paper; (4) No AMI-authored
              research papers have been published under the AMI Labs banner as of the run date, relying on prior Meta
              FAIR publications; (5) No public benchmarks comparing AMI's approach to NVIDIA Cosmos, Genie 2, or
