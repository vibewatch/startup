      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Cases'
        blocks:
          - type: paragraph
            body: >-
              The three scenarios differ primarily on three variables: the pace of JEPA's commercial readiness, the
              competitive response from Big Labs, and the availability of follow-on capital at or above the $3.5B
              pre-money floor. All three scenarios assume AMI requires additional capital beyond the $1.03B seed given
              the estimated peer-lab annual burn of $300–500M for compute and talent at frontier scale, and the 4–5×
              annual compute growth documented by Epoch AI that makes any fixed compute budget inadequate over a
              multi-year research horizon.

              In the bull case, JEPA achieves a demonstrable real-world benchmark by 2028 — for instance, a reproducible
              advantage over multimodal LLMs in industrial process control or autonomous robotics — and AMI executes a
              Series A at $10–15 billion. Strategic partnerships with two or more of its industrial investors (Toyota
              Ventures, Samsung, NVIDIA) translate to deployed use cases by 2029–2030. An IPO becomes viable in
              2031–2033 at $30–50 billion, conditional on revenue of $200M+ ARR, implying a 20–25× revenue multiple
              consistent with the premium end of the 2025–2026 frontier AI company cohort.

              In the base case, AMI produces high-quality open research for 2–3 years, raises a $500M– $1B Series A at
              roughly flat-to-modest valuation uplift ($5–8B), and narrows its application focus to one or two verticals
              where it can show defensible early customers. Commercial products arrive in 2029–2031. Exit is most likely
              through a hyperscaler acquisition at $8–15 billion — plausible for a company with a unique architecture, a
              sovereign-aligned investor base, and 50–100 employees in the $40–60M ARR range by that point.

              In the bear case, the JEPA architectural bet does not differentiate in practice: Big Labs release
              competitive world model systems, open-source alternatives proliferate, and enterprise buyers do not see a
              purchasing case. Capital markets tighten for pre-revenue AI research by 2028. AMI struggles to raise at
              its seed valuation and is forced to either dramatically narrow scope, take a strategic investment that
              dilutes the sovereign-aligned architecture, or sell at distressed terms. A distressed exit at $1–2 billion
              or wind-down is the adverse outcome.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
