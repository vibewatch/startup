  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: standard
    summary: >
      AMI's JEPA cognitive architecture from raw sensors (bottom) to action-conditioned planning (top), illustrating the
      non-generative prediction flow.
    data:
      layers:
        - label: Sensors & Raw Input
          detail: >-
            Cameras, microphones, vitals monitors, lidar, and other continuous sensor modalities; hardware-agnostic —
            AMI does not manufacture hardware
        - label: Context Encoder (ViT backbone)
          detail: >-
            Vision Transformer encoding partial observations into high-dimensional latent vectors; trained on unlabeled
            data via self-supervised masking (I-JEPA / V-JEPA methodology)
        - label: JEPA Predictor / World Model Core
          detail: >-
            Predicts abstract target-region representations from context encodings; operates in representation space,
            not pixels; non-generative — ignores unpredictable details; V-JEPA validated to ~10 s
        - label: Action-Conditioned Planner (Planned)
          detail: >-
            Generates candidate action sequences, simulates predicted consequences via world model, selects optimal
            action under safety guardrail constraints; design concept only — not yet built
        - label: Application API / Partner Integration (Planned)
          detail: >-
            Licensing interface exposing world model capabilities to healthcare, industrial, robotics, wearable
            partners; no public API as of June 2026; Nabla pilot is earliest disclosed pathway
    approximationNotes: >
      Architecture reconstructed from LeCun's 2022 position paper, I-JEPA, and V-JEPA publications. Unbuilt layers
      labelled (Planned). Actual AMI implementation details are not public.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE027
