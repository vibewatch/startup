chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: |
              Advanced Machine Intelligence Labs — trading as AMI Labs — is a frontier AI research company
              incorporated and headquartered in Paris, France. From its founding in late 2025, the company
              has operated across four international hubs: Paris (headquarters), New York, Montreal, and
              Singapore. The Paris address anchors AMI within France's growing AI ecosystem alongside Mistral
              AI and Meta's FAIR lab; LeCun has stated the choice reflects his belief that frontier AI
              should not be an exclusively American or Chinese endeavor.

              AMI's full name, Advanced Machine Intelligence, signals its ambition: to build AI systems that
              transcend language-centric models and directly understand the physical world. The company's
              current stage is pre-revenue research; it has no commercial product and no plans to generate
              revenue in the near term. When monetization arrives, AMI intends to license world model
              technology to industry partners rather than selling consumer or enterprise software directly.
              The company has publicly committed to open-source code releases and open academic publications,
              positioning itself as a research platform for a broader community. French President Emmanuel
              Macron publicly welcomed AMI's Paris headquarters, calling it a milestone for French AI.
