      - number: '6.4'
        title: Procurement Friction, Regulatory Barriers, and Adoption Timeline
        blocks:
          - type: paragraph
            body: >
              Multiple structural forces compound AMI's go-to-market timeline beyond the standard frontier AI
              commercialization cycle.

              In healthcare, even the most progressive buyers now process AI procurement decisions in 6.6 months on
              average (down from 8 months for traditional IT), according to Menlo Ventures' 2025 State of AI in
              Healthcare survey. However, this acceleration applies to production-ready ambient scribing and billing
              automation tools—not to research-stage world models requiring FDA clearance. The FDA's existing cleared
              AI/ML medical devices (over 900 as of early 2026) are predominantly narrow diagnostic detection tools
              cleared under 510(k) or De Novo pathways. An autonomous agentic clinical AI of the type Nabla envisions
              would require a substantially more complex regulatory engagement—most likely a PMA (pre-market approval)
              or a novel De Novo pathway, timelines typically spanning 2–5 years from substantive submission.

              Menlo Ventures also documented that healthcare buyers explicitly prioritize "maturity of technology" and
              "production-ready solutions that perform reliably at scale"—a standard AMI cannot yet meet. The prior
              era's "death by pilot" dynamic, while easing for proven AI tools, will persist for unvalidated
              architectures such as world models. Goldman Sachs research flagged $1 trillion in cumulative AI capex with
              limited deployed-AI revenue to show for it; Sequoia Capital's updated "AI's $600B question" analysis
              quantified the gap between GPU infrastructure spending and actual end-user value delivered as of 2024.
              These structural observations apply to the broader AI market but bear directly on customer willingness to
              adopt an unproven architecture.

              In industrial/manufacturing markets, enterprise software sales cycles for complex process control systems
              routinely span 12–24 months even for established vendors. AMI faces an additional barrier: it requires
              customers to share proprietary operational data (jet engine telemetry, factory sensor streams) to train
              the world model, raising data sovereignty and IP ownership concerns that Futurum Group and independent
              analysts have flagged as "among the first issues examined in AI-driven transactions." This data-sharing
              prerequisite creates a chicken-and-egg dynamic: AMI needs domain data to build a useful model, but
              customers will not share data without proven ROI.

              The BMJ's TRIPOD+AI framework for clinical AI reporting highlights rigorous external validation,
              pre-specified calibration, and bias assessment requirements that any clinical prediction model must meet
              before health system deployment—standards AMI's pre-publication world models cannot yet address.
