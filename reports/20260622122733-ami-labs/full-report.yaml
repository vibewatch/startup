          No public benchmark comparing JEPA to multimodal LLMs on industrial tasks (robotics, process control,
          wearables)
        - Determines whether the architectural bet is empirically validated or speculative
        - Request access to technical demos; track publications; compare vs World Labs/Odyssey releases
      - - Compute spend and burn breakdown
        - No public use-of-proceeds detail beyond 'compute and talent'; no cost structure disclosure
        - Critical for runway modelling; $300–500M/yr peer estimate is extrapolated, not confirmed
        - Request from CFO; validate against NVIDIA compute commitments in the round
      - - Nabla partnership commercial terms
        - AMI-Nabla partnership structure (equity, IP, exclusivity, fee) not publicly disclosed
        - Determines whether first commercial anchor is real revenue optionality or a related-party arrangement
        - Request term sheet or letter of intent; verify independence of relationship
      - - Series A investor conversations
        - No signal on who is expected to lead Series A or at what valuation expectation
        - Determines whether the base-case valuation floor ($5–8B) is achievable
        - Track investor sentiment; benchmark against Thinking Machines Lab Series A timeline
      - - Headcount plan and talent pipeline
        - Only 'roughly a dozen' employees publicly confirmed at seed close; no headcount target disclosed
        - Research lab quality degrades without a critical mass of world-model researchers
        - Request hiring plan; validate LinkedIn growth; benchmark to World Labs headcount trajectory
