      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: |
              AMI's licensing model means the company's direct buyer is an enterprise that builds
              or deploys AI-enabled systems — not the end user of those systems. This B2B
              infrastructure dynamic creates a two-tier market structure: AMI must win technical
              credibility with system builders and commercial adoption from operations-oriented
              enterprise buyers simultaneously.

              Industrial Automation (Largest addressable segment by 2030): Buyers are
              manufacturing CTOs, plant operations directors, and automation engineers at large
              industrial companies in chemicals, automotive, energy, and aerospace. The payer
              is the capital expenditure budget, which cycles every 3–5 years. Adoption is
              triggered by a combination of rising labor costs, plant modernization initiatives,
              and competitive pressure from Chinese manufacturers whose robot density advantage
              is accelerating. IFR data confirms US robot installations rose 11% in 2025 to
              38,000 units, with food industry adoption surging 30% — signaling broadening
              automation demand beyond traditional automotive. China's annual installations
              reached approximately 295,000 units in 2024 (54% global share), reinforcing
              competitive pressure on Western manufacturers to accelerate AI-enabled automation.

              Healthcare (Highest near-term signal given Nabla partnership): Buyers are healthcare
              system CIOs and clinical informatics teams. Payers are hospital operating budgets and,
              ultimately, health insurance reimbursement frameworks. Forbes reported that LeBrun
              specifically cited the limits of current AI in clinical settings as AMI's entry point —
              world models enabling more reliable clinical decision support beyond what LLMs can
              safely provide. FDA and EMA clearance gates patient-facing applications; the Nabla
              partnership appears positioned as a workflow tool (AI scribing) rather than an
              FDA-regulated clinical device, which may accelerate the initial commercial timeline.

              Robotics OEMs (Platform / channel buyer): AMI could license world model APIs to
              robotics hardware manufacturers. Toyota Ventures' participation in the seed round
              signals automotive and industrial robotics interest. LeCun's explicit framing is
              that current robots are task-specific and cannot generalize — precisely the gap world
              models would fill. The strategic buyer in this segment is the VP of AI/Software at
              a robotics OEM, with a product development budget and multi-year hardware cycle.
              LeCun acknowledged that current humanoid robots are trained through teleoperation
              and fail to generalize across environments — a statement that simultaneously describes
              the market problem and raises uncertainty about the speed of commercial readiness.

              Wearable / Device OEMs (Longest lead time): Samsung's strategic investment signals
              wearable devices and smart glasses as a potential application domain. LeCun described
              smart glasses that could "watch what you're doing, identify your actions, and predict
              what you're going to do next" as a world model use case. Budget ownership falls to
              R&D departments at consumer electronics OEMs with 2–3 year hardware design cycles.

              Investor composition provides the clearest segmentation signal: NVIDIA (physical AI
              infrastructure), Toyota Ventures (automotive and industrial robotics), Samsung
              (devices and wearables), and Temasek (Asia-Pacific sovereign and enterprise capital)
              are all strategic rather than financial investors, each signaling a segment where
              world model technology could be embedded.
