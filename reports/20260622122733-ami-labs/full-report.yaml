      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              Growth Drivers:

              Labor arbitrage and automation demand: Global labor shortages across manufacturing,
              healthcare, and logistics are a structural driver. IFR confirms US robot installations
              rose 11% in 2025, with food industry adoption surging 30%. China's 15th Five-Year Plan
              (2026–2030) places robotics at the heart of its modern industrial system, explicitly
              focusing AI research on physical applications and designating robots as the main driver
              of economic growth. This creates urgency for Western manufacturers and governments to
              invest in physical AI infrastructure that can match China's deployment scale.

              Physical AI infrastructure investment: NVIDIA has validated "Physical AI" as a
              distinct infrastructure category at GTC 2026. NVIDIA's Isaac simulation platform,
              Cosmos world model training infrastructure, and robotics inference stack represent
              hyperscaler-scale investment in the enabling infrastructure for AMI's target market.
              The Futurum Group analyst notes that NVIDIA's investor role in AMI signals alignment
              rather than competition — AMI's foundation model layer could complement rather than
              compete with NVIDIA's compute infrastructure.

              European AI sovereignty demand: European governments, sovereign wealth funds, and
              enterprise buyers are actively seeking AI infrastructure that does not route through
              US hyperscaler supply chains or expose sensitive data to US cloud jurisdiction.
              Bpifrance's participation in AMI's seed round reflects French state investment in
              domestic AI capability. LeCun's explicit framing of AMI as "neither American nor
              Chinese" speaks directly to sovereign AI demand, creating structural market preference
              beyond pure technical merit. France's national AI ecosystem and EU AI Act compliance
              requirements add further structural tailwinds for a European-headquartered frontier
              AI lab.

              LLM failure-mode awareness: The documented failure modes of LLMs in high-stakes
              physical environments — hallucination, inability to model action consequences, and
              unreliable temporal reasoning — are generating growing enterprise demand for more
              reliable AI architectures. SiliconAngle coverage and the Futurum Group analysis both
              note that industrial and healthcare buyers are acutely aware of LLM reliability limits.

              Adoption Constraints:

              World model technology unproven commercially: World models as a commercial product
              category do not exist. The Futurum Group explicitly flags "the structural tension
              between a research-first mandate and investor expectations calibrated to a billion-
              dollar raise." AMI is betting JEPA-based architectures will achieve commercial-grade
              performance on physical tasks faster than alternative approaches, but no external
              validation of that timeline exists.

              Regulatory pathways: FDA and EMA clearance for patient-facing clinical AI involves
              pre-market review measured in years. Industrial safety certifications (IEC 61511,
              ISO 13849) for autonomous systems require extensive validation. EU AI Act compliance
              for high-risk applications in healthcare and industrial control adds regulatory
              complexity specifically in AMI's primary European target markets.

              Enterprise adoption conservatism: Industrial and healthcare enterprise buyers have
              capital-intensive, multi-year planning cycles and high switching costs from incumbent
              platforms (Siemens, GE, Honeywell in industrial; Epic, Cerner in healthcare). Grand
              View Research's industrial automation data confirms that even with AI integration,
              the sector grows at 10.8% CAGR — far below headline AI growth — reflecting this
              conservatism. Capital expenditure cycles average 3–5 years.

              Competing physical AI architectures: Google DeepMind, Meta Superintelligence Labs,
              Physical Intelligence, and 1X are all developing adjacent physical AI capabilities.
              LLM providers are investing in reasoning and action capabilities that could converge
              on world model use cases. LeCun acknowledges that if major LLM providers accelerate
              work on world models and spatial learning, AMI's architectural window of
              distinctiveness narrows. No published benchmark independently compares JEPA-based
              world models against competing approaches on physical-world tasks.

              Generalization gap in robotics: LeCun publicly stated in January 2026 that "nobody,
              absolutely nobody, knows how to make those robots smart enough to be useful,"
              attributing this to teleoperation-dependent training data that fails to generalize
              across environments. This candid acknowledgment, while framing the market opportunity
              for world models, also signals the technical distance from commercial deployment.
