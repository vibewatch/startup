  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital Structure and Round Mechanics
        blocks:
          - type: paragraph
            body: |
              AMI Labs raised $1.03 billion USD (approximately €890 million) in a seed round announced
              March 10, 2026. The round was set at a $3.5 billion pre-money valuation, implying a
              post-money of approximately $4.53 billion. PitchBook confirmed it as Europe's largest seed
              round ever recorded. AMI had initially been seeking approximately €500 million as recently
              as December 2025; the final close was nearly double that target, indicating the syndicate
              was oversubscribed.

              The round was co-led by five venture investors: Cathay Innovation, Greycroft, Hiro Capital,
              HV Capital, and Bezos Expeditions. Strategic corporate investors include NVIDIA, Samsung,
              Temasek, Toyota Ventures, and Sea. French institutional and industrial backers include
              Association Familiale Mulliez, Groupe Industriel Marcel Dassault, Publicis Groupe, and
              Bpifrance Digital Venture. Notable angels include Eric Schmidt, Mark Cuban, Jim Breyer,
              Tim and Rosemary Berners-Lee, Xavier Niel, and Mark Leslie.

              A US Securities and Exchange Commission Form D filing dated April 3, 2026 shows that US
              investment vehicles "Advanced Machine Intelligence I, L.P." and "Advanced Machine Intelligence
              II, L.P." — managed by Model I, L.P. of San Francisco — aggregated approximately $16.9 million
              for investment in AMI. This structure is consistent with small US LP tranches pooled into
              larger international syndicates. AMI itself is a private French company with no public
              financial filings or balance-sheet disclosures.

              Strategic investors' rationale appears bifurcated: financial VCs (Cathay, Greycroft, Hiro,
              HV) accepted a multi-year research timeline priced at premium to comparable-stage startups,
              while corporate strategics (NVIDIA, Samsung, Toyota, Temasek) likely receive early access
              to world model research relevant to their compute, semiconductor, automotive, and sovereign
              AI priorities. The oversubscription suggests both categories of investor accepted the $3.5B
              pre-money as fair given LeCun's technical credibility and the world model narrative.
