              months, have revenue in six months, and make $10 million in ARR in 12 months." This is a deliberate and
              stated strategic choice, not an oversight. AMI is funding a multi-year fundamental research agenda before
              pursuing commercial licensing.

              The company's customer strategy follows what practitioners call a design-partner model— engaging early
              users or partner organizations to co-develop and validate technology before formal commercial launch.
              AMI's mission statement targets "industrial process control, automation, wearable devices, robotics,
              healthcare, and beyond" as the eventual verticals, and Yann LeCun stated in a March 2026 interview with
              AFP that discussions with corporate partners "could be held within six to 12 months" of the funding
              announcement. That window spans roughly September 2026 to March 2027 but does not imply signed commercial
              contracts.

              The investor base itself is a proxy for early commercial interest. Strategic investors such as Toyota
              Ventures (robotics/automotive), Groupe Industriel Marcel Dassault (aerospace/industrial), NVIDIA (hardware
