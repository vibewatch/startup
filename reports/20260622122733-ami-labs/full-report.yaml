              - CV036
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Goldman Sachs and Sequoia: $600B CapEx Gap Threatens Pre-Revenue AI Valuations'
            body: >-
              Goldman Sachs estimates approximately $1 trillion in planned AI infrastructure capex has generated little
              measurable revenue or productivity improvement so far. Sequoia Capital has updated its "$200B question" to
              a "$600B question" — the structural gap between AI infrastructure spending and the revenue needed to
              justify it. For pre-revenue world-model labs like AMI, this capex-to-revenue gap is an existential macro
              risk: if enterprise buyers do not show willingness to pay for AI that understands the physical world, the
              multi-year research timeline becomes a funding gap rather than a deliberate strategy.
            calloutType: risk
            claimRefs:
              - CV014
              - CV015
          - type: callout
            title: 'Sovereign AI Premium: Real but Limited'
            body: >-
              AMI's positioning as neither American nor Chinese frontier AI is a genuine structural advantage for
              European regulated-market access, public funding relationships, and strategic buyer alignment. The Futurum
              Group analyst assessment characterises this as 'strategic autonomy' rather than true independence — AMI
              runs on NVIDIA silicon, uses US-rooted compute cloud, and competes for global talent against labs that
              outspend it by orders of magnitude. The sovereign premium is a pricing input, not a moat. It is
              sustainable only if AMI can demonstrate technical differentiation that EU enterprise buyers will pay for.
            calloutType: insight
            claimRefs:
              - CV013
              - CV016
              - CV017
          - type: callout
            title: 'Valuation Stance: Stretched — Track at Current Price, JEPA Benchmarks as Gate'
            body: >-
              At $3.5B pre-money with no revenue, no product, and a CEO who says commercial products will take years to
              materialise, AMI's valuation is stretched relative to fundamental value today. The valuation is defensible
              as an option on scientific credibility and world-model architectural leadership — but that option has a
              short exercise window before Big Labs close the architecture gap. The appropriate investor action at this
              stage is TRACK: monitor JEPA publication velocity and benchmark results; do not commit to Series A
              co-investment until AMI can demonstrate empirical superiority over multimodal LLMs on at least one
              industrial-use-case benchmark.
            calloutType: recommendation
            claimRefs:
              - CV025
              - CV026
              - CV029
              - CV031
