          - type: callout
            title: Multi-Year Pre-Revenue Timeline Against Billion-Dollar Expectations
            body: >
              LeBrun explicitly stated that AMI is not a typical applied AI startup expecting product and revenue within
              12 months. Futurum Group's independent analysis flags structural tension: a $1.03B raise creates
              significant follow-on financing pressure when the next round will require evidence of commercial progress.
              Research labs at comparable scale — including DeepMind before Google's acquisition — have historically
              needed either a deep-pocketed patron or a defined revenue path. The Nabla partnership is a sensible anchor
              but healthcare AI regulatory timelines (FDA pathway) are long and uncertain.
            calloutType: risk
            claimRefs:
              - CO007
              - CO042
