      - number: '2.5'
        title: Sizing Contradictions, Evidence Gaps, and Diligence Priorities
        blocks:
          - type: paragraph
            body: |
              The chapter preserves three material contradictions that remain unresolved.

              Contradiction 1 — AI growth rate vs. physical-world deployment speed: Headline AI
              market CAGRs of 29–31% (MarketsandMarkets, Grand View Research) substantially
              exceed the industrial automation market's 10.8% CAGR — the largest single segment
              in AMI's physical-world scope. The divergence reflects the dominance of text, language,
              and generative AI in aggregate AI market sizing. Investors who priced AMI at $3.5B
              pre-money on day one of research may be extrapolating from headline AI growth rates
              that are not representative of physical-world AI adoption speed, particularly given
              the capital expenditure conservatism of industrial and healthcare buyers.

              Contradiction 2 — Robotics commercial readiness claims: LeCun's January 2026
              statement that "nobody, absolutely nobody, knows how to make those robots smart
              enough to be useful" directly contradicts commercial deployment claims from Agility
              Robotics, Figure AI, 1X, and Boston Dynamics, all of which describe near-term
              general-purpose humanoid robot commercialization. Both positions cannot simultaneously
              be accurate about current-state robot generalization. The contradiction remains
              unresolved and represents a significant market timing uncertainty for any physical AI
              infrastructure provider.

              Contradiction 3 — World model distinctiveness vs. LLM convergence: AMI's thesis
              requires that LLMs structurally cannot capture the physical-world AI market. However,
              Google DeepMind's Gemini Robotics, NVIDIA's Project GR00T, and OpenAI's physical
              agent work all attempt to use multimodal foundation models for similar physical-world
              tasks. Whether JEPA-based world models are architecturally superior in physical-world
              tasks or whether the approaches converge is a key empirical question with no published
              benchmark resolution.

              Critical Evidence Gap — No analyst SAM for world model licensing: No published
              analyst report independently sizes the world model infrastructure licensing market as
              a distinct category. All market estimates are for broader categories that include
              non-world-model applications. The SAM of $13–26B cited in this chapter is
              analyst-inferred using infrastructure capture rates and is not sourced from any
              published research. This is the most material sizing gap for investment diligence.
            claimRefs:
              - CM038
              - CM039
              - CM040
              - CM041
