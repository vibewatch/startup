      - number: '4.3'
        title: Cost Structure, Burn Analogues, and Runway Estimates
        blocks:
          - type: paragraph
            body: |
              LeBrun explicitly identified compute and talent as AMI's two main cost centers. All burn
              figures in this chapter are inferred estimates benchmarked against frontier AI lab analogues;
              no AMI-specific financial data has been disclosed.

              On compute: Epoch AI data shows training compute for frontier models has grown 4-5x per year
              since 2020, and the largest known AI data center requires approximately $24 billion in capital
              cost to operate 800,000 H100-equivalent chips. However, AMI's architectural thesis — JEPA
              world models requiring hundreds of millions rather than hundreds of billions of parameters —
              suggests substantially lower per-training-run compute than frontier LLMs. AI chip performance
              per dollar has improved approximately 37% per year (Epoch AI), meaning compute costs are
              declining in real terms. Sequoia Capital's analysis estimates GPUs represent roughly 50% of
              total AI data center cost-of-ownership, with energy, buildings, and networking comprising
              the remainder.

              On talent: AMI launched with an estimated team of approximately 12 people (Futurum Group
              analysis, March 2026), with active hiring underway across Paris, New York, Montreal, and
              Singapore. LeBrun stated AMI would "prioritize quality over quantity." Frontier AI research
              salaries at comparable labs (OpenAI, Anthropic, DeepMind) are publicly documented in the
              range of several hundred thousand to over one million USD in total annual compensation
              for senior researchers. If AMI scales to 100 researchers and staff at an average fully-loaded
              cost of $400,000-600,000, annual talent spend would reach $40-60 million — not accounting
              for equity dilution from the founding team.

              Combining conservative compute spend ($50-150M/year at early research scale) with talent
              ($40-80M/year at 80-150 headcount), and allowing for infrastructure and overhead, an annual
              burn rate of $150-300 million per year is a plausible range for years 1-3. Goldman Sachs has
              questioned whether AI infrastructure spending — estimated at $1 trillion globally — will
              ever generate commensurate revenue returns. Sequoia flagged that speculative AI infrastructure
              investment frenzies historically lead to capital incineration, GPU compute pricing power
              erosion, and faster-than-expected hardware depreciation. These macro risks apply to AMI's
              investors, not directly to AMI's near-term operations, but create a more challenging
              fundraising environment for the Series A.

              At a $150M/year burn, AMI's $1.03B provides roughly 6.9 years of runway. At $300M/year,
              runway falls to approximately 3.4 years. These are indicative ranges; actual burn trajectory
              depends heavily on whether AMI scales to large-compute training runs within years 2-3.
