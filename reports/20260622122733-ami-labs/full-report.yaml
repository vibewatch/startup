      - number: '8.4'
        title: Recommendation and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              The recommended stance is TRACK at current pricing, with RESEARCH-MORE on specific gate-clearing
              milestones before upgrading. The valuation stance is STRETCHED: the $3.5B pre-money is justifiable as an
              option on LeCun's scientific program and Europe's sovereign AI positioning, but it prices in significant
              optimism relative to what is publicly verifiable (no product, no revenue, no commercial partnerships
              beyond Nabla, no JEPA benchmark results).

              Confidence in the recommendation is LOW due to the near-total absence of commercial evidence and the high
              uncertainty on the JEPA technology hypothesis. The risk rating is HIGH: the combination of research-first
              timeline, key-person concentration on LeCun (executive chairman, not full-time CEO), compute-cost
              escalation, and Big Lab competitive pressure creates intersecting risks that are difficult to hedge.

              The KPI scoring framework below summarises the investment committee positioning across seven dimensions:
              market, technology proof, competitive moat, unit economics, risk composite, valuation, and evidence
              quality. No dimension other than market opportunity scores above "moderate" on current evidence.

              Thesis-break triggers (detailed in the Exhibits section) include any evidence that JEPA fails to
              outperform multimodal LLMs on the application types AMI targets, any loss of Yann LeCun as executive
              chairman, failure to close a Series A at or above $5B pre-money within 24 months of the seed close, or any
              Nabla partnership dissolution without replacement.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
          - type: figure
            figureRef: FV004
            claimRefs:
