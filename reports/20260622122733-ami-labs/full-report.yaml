      - number: '3.2'
        title: 'Direct World-Model Startup Peers: World Labs, Odyssey, SpAItial'
        blocks:
          - type: paragraph
            body: |
              World Labs, founded by Fei-Fei Li, is AMI's most prominent direct startup competitor. Its
              thesis — "spatial intelligence" as the next frontier of generative AI — mirrors AMI's physical-
              world AI ambition but diverges sharply in architecture and application. World Labs' Marble product
              generates spatially consistent, persistent 3D worlds from text, images, video, and 360 panoramas.
              The World API, launched in January 2026, provides programmatic access for developers building
              simulations, creative tools, and spatial applications. World Labs published a functional taxonomy
              of world models in June 2026, categorizing models as Renderers, Simulators, and Planners — a
              framing that implicitly positions AMI as a Simulator/Planner type while World Labs leads in the
              Renderer segment. World Labs has a deployed commercial product and developer adoption, giving it
              a first-mover advantage AMI does not have as of mid-2026.

              Odyssey is a smaller world-model lab with a broader ambition: its Odyssey-2 model targets general-
              purpose physical accuracy, Starchild-1 extends learning from visual observation to richer
              multimodal interaction, Agora-1 enables multi-agent shared worlds, and the PROWL framework uses
              adversarial RL to improve world model performance. Odyssey's product suite is more research-
              adjacent than World Labs' consumer-accessible Marble, but its RL-driven approach to improving
              physical accuracy overlaps significantly with AMI's accuracy-first positioning.

              SpAItial, founded in May 2025, is the youngest and smallest of the direct peers. Its Echo model
              family generates persistent 3D Gaussian Splat worlds from images, text, or panoramas through a
              developer API. Echo-2 has been announced. SpAItial's developer-first positioning (API + 3D format
              exports in SPZ, PLY, SOG) and narrow focus on 3D world generation represent a different
              commercialization strategy than AMI's planned industrial licensing model.

              The critical architectural divide between all three peers and AMI: World Labs, Odyssey, and
              SpAItial are generative systems — they reconstruct pixel- or voxel-level content, trading
              compute efficiency for photorealistic output. AMI's JEPA approach predicts in abstract
              representation space, which its founders argue delivers controllability and reliability properties
              that generative systems structurally cannot match in safety-critical environments.
