  - id: FV001
    title: 'Recommendation Logic Chain: From Evidence to Stance'
    type: flow
    layout: standard
    summary: >-
      Decision chain from AMI's evidential profile through risk and valuation factors to the final 'Track'
      recommendation.
    data:
      nodes:
        - id: scientific-credibility
          label: 'Scientific Credibility: High (LeCun Turing Award, JEPA track record)'
        - id: technology-risk
          label: 'Technology Risk: High (JEPA unproven at commercial scale)'
        - id: revenue-evidence
          label: 'Revenue Evidence: None (pre-product, pre-revenue)'
        - id: competitor-threat
          label: 'Competitive Threat: High (Meta, Google DeepMind converging on world models)'
        - id: valuation-anchor
          label: 'Valuation: Stretched ($3.5B pre-money, no revenue)'
        - id: sovereign-premium
          label: 'Sovereign AI Premium: Present (European positioning, Bpifrance, multi-continent syndicate)'
        - id: risk-rating
          label: 'Risk Rating: High'
        - id: recommendation
          label: 'Recommendation: TRACK — Watch JEPA benchmarks and Series A for entry upgrade'
      edges:
        - from: scientific-credibility
          to: risk-rating
        - from: technology-risk
          to: risk-rating
        - from: revenue-evidence
          to: valuation-anchor
        - from: competitor-threat
          to: risk-rating
        - from: valuation-anchor
          to: recommendation
        - from: sovereign-premium
          to: recommendation
        - from: risk-rating
          to: recommendation
    approximationNotes: Logic chain is an interpretive synthesis; edge weights are qualitative.
    claimRefs:
