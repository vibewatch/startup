      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: |
              AMI's financial position is straightforward in structure but opaque in execution. The company
              holds approximately $1.03 billion in seed capital earmarked entirely for compute and talent,
              with zero revenue and a multi-year pre-revenue timeline. Capital adequacy appears sufficient
              for the stated research mandate at conservative burn rates; at $150-200M/year, the $1.03B
              seed gives AMI roughly five to seven years before a Series A is required. However, if compute
              demands accelerate in years 2-3 — as they did at comparable labs that scaled from small
              research to large training runs — runway could compress rapidly.

              Revenue quality is not ratable because there is no revenue. Margin path is entirely
              theoretical (the licensing model implies high gross margins, but there is no product to
              price). Capital intensity is high by research-lab standards: two cost centers of comparable
              size (compute and talent) with no revenue offset over the research phase. Financing
              dependency is complete: AMI cannot operate without external capital for at least 3-5 years.

              The two most material financial risks are: (1) burn acceleration if training runs need to
              scale beyond initial projections, potentially shortening runway and forcing a Series A
              under less favorable conditions than the oversubscribed seed; (2) time-to-revenue risk,
              where world models require longer research cycles than projected, forcing additional rounds
              at potentially lower valuations. A third risk is the tension between AMI's open-source
              commitment — which serves the research community and may attract talent and partners — and
              the IP protection required to enforce a premium licensing model. Goldman Sachs and Sequoia
              have both raised systematic questions about whether AI infrastructure investments will
              generate payback in venture timelines at all.

              The Futurum Group noted that AMI's Series A will be "the first real market test" of
              whether research output translates to commercial credibility. Key financial due diligence
              items outstanding include: (a) actual cash burn rate and draw-down schedule; (b) any
              in-kind compute arrangements with NVIDIA; (c) Nabla partnership commercial terms;
              (d) headcount ramp plan and total compensation budget; (e) Series A timeline and
              valuation targets; and (f) AMI's specific compute architecture requirements — a JEPA
              training run at frontier scale costs far less than a frontier LLM, but the exact order
              of magnitude remains private.
