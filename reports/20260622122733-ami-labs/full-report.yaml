      - number: '3.3'
        title: 'Frontier Labs and Hyperscalers: DeepMind, Meta FAIR, OpenAI, and NVIDIA'
        blocks:
          - type: paragraph
            body: |
              Google DeepMind's world model portfolio is the most comprehensive among frontier labs. Genie 1
              (February 2024) was the first unsupervised foundation world model trained on internet videos,
              at 11 billion parameters. Genie 2 (December 2024) extended this to action-controllable 3D
              environments for training and evaluating embodied agents, capable of generating consistent
              worlds for up to a minute from a single prompt image. Genie 3 is listed as DeepMind's current
              world model, though the full technical disclosure has not been publicly detailed. Separately,
              Gemini Robotics applies language-conditioned reasoning to robot hardware across multiple
              embodiments including ALOHA, Bi-arm Franka, and Apptronik Apollo. DeepMind's scale — compute,
              data, researcher talent, and Google ecosystem integration — makes it a long-term competitive
              threat even though its objective (advancing AI research) differs from AMI's commercial roadmap.

              Meta FAIR's V-JEPA (2024), the Video Joint Embedding Predictive Architecture, is the most
              architecturally similar published system to AMI's approach: non-generative, self-supervised,
              predicting in abstract representation space. LeCun co-designed JEPA at Meta and has now taken
              the architecture to AMI. With LeCun's departure in late 2025, Meta's AI research headline as
              of June 2026 shifted to "Muse Spark," indicating a strategic redirect away from JEPA-centric
              world models. Meta FAIR's I-JEPA and V-JEPA remain open-source on GitHub under a Creative
              Commons NonCommercial license — creating public prior art that any lab can build upon, and
              raising a commoditization question for AMI.

              OpenAI's Sora was explicitly positioned as "a foundation for models that can understand and
              simulate the real world" in its technical paper, making it a direct world-model competitor. That
              strategic bet was reversed: OpenAI discontinued the Sora web and app experience on April 26,
              2026, with the API to follow on September 24, 2026. This retreat substantially reduces one
              major competitor in the world-simulator space, validating LeCun's argument that diffusion-based
              generative systems are ill-suited for reliable physical-world applications.

              NVIDIA stands apart as an infrastructure-layer player rather than an end-market competitor.
              Cosmos, launched at CES 2025 and now at version 3, is a family of world foundation models
              trained on 9,000 trillion tokens from 20 million hours of real-world data, available under an
              open commercial license. Cosmos enables vision reasoning, robotic policy training, and physics-
              grounded simulation in a single platform. NVIDIA's developer ecosystem is vast: Cosmos partners
              include 1X, Agility Robotics, XPENG, Uber, and Waabi. Its Isaac platform provides the full
              robotics software stack. NVIDIA's world model ambition and its GPU market dominance mean it
              will set the compute infrastructure standard against which every world model company benchmarks.
