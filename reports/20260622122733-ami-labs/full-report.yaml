  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: |
              The competitive landscape for AMI Labs spans four distinct competitive clusters: (1) direct
              world-model startups targeting 3D spatial and simulation outputs; (2) frontier research labs
              with world-model programs embedded in larger corporate platforms; (3) embodied AI and robotics
              startups commercializing physical-world AI for robot hardware; and (4) infrastructure players
              providing world foundation models as a platform layer.

              AMI's clearest direct competitors are World Labs (Fei-Fei Li's spatial intelligence startup),
              Odyssey (general world model lab), and SpAItial (3D Gaussian Splat world models). All three
              are privately funded startups pursuing world model architectures for generative 3D environments.
              Unlike AMI, all three use generative architectures — predicting pixel-level or voxel-level
              content rather than abstract representations — and have deployed public products or APIs.

              The frontier lab cluster includes Google DeepMind (Genie 1/2/3, Gemini Robotics), Meta FAIR
              (V-JEPA, now post-LeCun), and OpenAI (Sora, which was discontinued in April 2026). NVIDIA
              occupies a special position: its Cosmos world foundation model platform is openly licensed and
              already embedded in the physical-AI developer ecosystem with robotics and AV partners. Physical
              Intelligence and Wayve represent the embodied-AI commercialization cluster, deploying world
              models and foundation policies directly into robot hardware and autonomous vehicles.

              AMI's JEPA-based approach occupies a technically distinct lane — non-generative, controllable,
              reliability-first — with no current commercially deployed competitor targeting its stated verticals
              of industrial process control and healthcare. The strategic risk is execution velocity: AMI has
              committed to a multi-year pre-product timeline while competitors are shipping.
