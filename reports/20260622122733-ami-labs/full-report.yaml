              - CV029
      - number: '8.5'
        title: Exit Readiness, Diligence Asks, and Financing Optionality
        blocks:
          - type: paragraph
            body: >-
              AMI is not exit-ready as of June 2026. An IPO requires, at minimum, demonstrated revenue and a repeatable
              go-to-market; neither exists. Based on the Futurum analyst assessment, the company's own public framing,
              and peer lab precedents (DeepMind's acquisition by Google in 2014, rather than an IPO), the most plausible
              near-to-medium-term liquidity path is a hyperscaler strategic acquisition, most likely in the 2029–2033
              window.

              Potential acquirers are differentiated by strategic fit: Samsung and Toyota Ventures (existing investors,
              device/industrial alignment), Apple (spatial intelligence is central to Vision Pro and robotics strategy),
              Microsoft (sovereign-AI computing infrastructure), or a French/European national champion acquisition to
              preserve the sovereignty dimension. Meta remains a natural technical collaborator but a conflicted
              acquirer given LeCun's departure friction.

              The $1.03B seed provides an estimated 2–3 years of runway at frontier-lab burn rates ($300–500M/year),
              meaning AMI will need to return to market for Series A capital in late 2027 or 2028. That round will
              function as the real market-clearing valuation test: whether the research output justifies a step-up from
              $3.5B, or whether the multiple compresses. Investors entering at the seed should monitor research
              publication velocity and JEPA benchmark results as the primary leading indicators of Series A pricing.

              The diligence asks listed in the Exhibits below represent the minimum evidential standards before a Series
              A co-investment could be recommended. The most critical ask is independent verification of JEPA's
              performance advantage on a standardised physical-world benchmark versus state-of-the-art multimodal LLMs —
              a question that cannot be answered from public sources as of June 2026.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
