      - CV026
      - CV027
  - id: FV002
    title: 'Valuation Sensitivity: Key Drivers and Implied AMI Value Range'
    type: bar
    layout: standard
    summary: >-
      Illustrative impact of key valuation drivers on AMI's implied enterprise value; each driver shows a low-to-high
      range under differing assumption sets.
    data:
      items:
        - label: Revenue multiple at exit (10× vs 25× ARR)
          value: 15000
        - label: Time-to-revenue (3 yr vs 8 yr discounted)
          value: 8000
        - label: Compute cost trend (4× vs 2× annual growth, 5 yr)
          value: 5000
        - label: Competitor world-model advancement (low vs high competition)
          value: 4000
        - label: Milestone probability (JEPA benchmark success 40% vs 80%)
          value: 6000
    approximationNotes: >-
      Values are illustrative USD millions for implied exit enterprise value under varying assumptions; not financial
      model outputs. Base case implied value ≈ $8–15B on acquisition; bull case ≈ $30–50B on IPO. Sensitivity bars
      represent the estimated spread between low and high assumption in each dimension.
    claimRefs:
      - CV019
      - CV020
      - CV021
  - id: FV003
    title: 'Valuation / Return Range: Bear, Base, and Bull Cases'
    type: range
    layout: standard
    summary: >-
      Exit enterprise value range under three scenarios, anchored at the $3.5B pre-money seed entry. Bear assumes
      distressed outcome; base assumes hyperscaler acquisition; bull assumes IPO at scale.
    data:
      items:
        - label: Bear (distressed sale or wind-down 2028–2030)
          value: 1500
          low: 500
          high: 2000
        - label: Base (hyperscaler acquisition 2030–2032)
          value: 11000
          low: 8000
          high: 15000
        - label: Bull (IPO 2031–2033 at $200M+ ARR)
          value: 40000
          low: 30000
          high: 50000
        - label: Seed entry valuation (March 2026)
          value: 3500
          low: 3500
          high: 3500
    approximationNotes: >-
      All values in USD millions. Bear: $1–2B range; Base: $8–15B range; Bull: $30–50B range. Entry $3.5B is the March
      2026 pre-money. These are analyst-constructed scenario bounds, not financial model outputs.
    claimRefs:
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 'Investment KPIs: IC-Ready Scoring Framework'
    type: kpi
    layout: standard
    summary: >-
      Composite investment committee scoring across seven dimensions on a 0–10 scale. No dimension exceeds 6/10 on
      current public evidence.
    data:
      items:
        - label: Market Opportunity
          value: 8
        - label: Technology Proof
          value: 3
        - label: Competitive Moat
          value: 4
        - label: Unit Economics
          value: 1
        - label: Risk Composite
          value: 2
        - label: Valuation Attractiveness
          value: 3
        - label: Evidence Quality
          value: 2
    approximationNotes: >-
      Scores are qualitative judgements on a 0–10 scale (10 = best). Market opportunity scores high on addressable TAM
      and policy tailwind. Technology Proof, Unit Economics, and Evidence Quality score low due to pre-product status
      and absence of published JEPA benchmarks.
    claimRefs:
      - CV025
      - CV026
      - CV028
      - CV029
