              action-conditioned planning with safety guardrails, and multimodal sensor data handling beyond vision
              alone. This contrasts with NVIDIA Cosmos — which is generative (diffusion and autoregressive) and targets
              simulation data generation for robotics and AV developers — and with DeepMind Genie 2, which is also
              generative and targets training environments for embodied agents. Neither competitor directly addresses
              the action-conditioned non-generative architecture that AMI is building. Competitor SpAItial (Echo world
              model for 3D Gaussian Splatting), World Labs (spatial 3D world generation), and Physical Intelligence
              (robot foundation models) all take generative or narrow robotics approaches. AMI's JEPA lineage, anchored
