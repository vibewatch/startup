      - number: '7.2'
        title: Technical, Research, and Competitive Risks
        blocks:
          - type: paragraph
            body: >
              AMI's bet on JEPA (Joint Embedding Predictive Architecture) as the successor to LLMs is scientifically
              credible—LeCun's position papers and the I-JEPA/V-JEPA publications demonstrate strong research
              foundations—but the commercialisation pathway is substantially longer than for LLM-based products. Compute
              training costs are growing at 4–5× per year (Epoch AI, 2024), and frontier world-model training is
              expected to require exascale compute runs exceeding 10^25 floating-point operations, the exact threshold
              at which the EU AI Act presumes systemic risk. NVIDIA's near-monopoly on AI training silicon means AMI is
              operationally dependent on NVIDIA's pricing and allocation decisions, as evidenced by NVIDIA's co-investor
              status in AMI's seed round—a relationship that confers supply access but also alignment risk.

              Competitive pressure is extreme: Google DeepMind Genie 2, NVIDIA Cosmos, Meta FAIR's continuation,
              Physical Intelligence (π), and World Labs all target overlapping technical ground with larger balance
              sheets and faster iteration loops. Open-source Chinese models such as DeepSeek demonstrate that
              world-model-adjacent capabilities can be commoditised rapidly. Sequoia's "$600B question" analysis applies
              directly to AMI: hyperscaler GPU capex is increasingly commoditised, eroding pricing power for any
              compute-dependent AI product. Goldman Sachs similarly noted that $1 trillion in projected AI capex has
