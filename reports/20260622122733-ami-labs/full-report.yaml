companyProfile:
  summary: >-
    AMI Labs (Advanced Machine Intelligence Labs) is a Paris-headquartered frontier AI research company co-founded in
    late 2025 by Turing Award winner Yann LeCun (Executive Chairman) and serial entrepreneur Alexandre LeBrun (CEO). The
    company is developing world models grounded in LeCun's Joint Embedding Predictive Architecture (JEPA) — a
    non-generative architecture that predicts future world states in abstract representation space rather than pixel or
    token space, intended to deliver persistent memory, planning, and controllability. Target application domains are
    industrial process control, healthcare diagnostics, clinical workflows, robotics, and wearable devices. AMI operates
    from four hubs: Paris, New York, Montreal, and Singapore. The company raised a $1.03B seed round in March 2026 at a
    $3.5B pre-money valuation, committing the capital to compute and talent rather than near-term revenue. No product
    has shipped and no commercial revenue has been generated as of the run date.
