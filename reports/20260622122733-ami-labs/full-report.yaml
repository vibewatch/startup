              repeatedly—creates additional tension with its eventual licensing model. Preemptively publishing core
              architectural insights means that better-resourced competitors (Meta FAIR, Google DeepMind, NVIDIA) can
              absorb and implement AMI's research faster than AMI can commercialise it. Gary Marcus, in his Substack
              analysis, argues that the absence of concrete commercial evidence in alternative-to-LLM AI approaches is a
