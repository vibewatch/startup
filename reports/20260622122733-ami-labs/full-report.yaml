  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary — Physical-World AI Infrastructure
        blocks:
          - type: paragraph
            body: |
              AMI Labs operates at the foundation layer of a market that has no canonical analyst
              definition: physical-world AI infrastructure, alternatively described as embodied
              intelligence, physical AI, or world-model-based AI. The defining characteristic of
              this market is the requirement for AI systems that can understand, predict, and act
              within continuous, noisy, high-dimensional real-world environments — industrial plants,
              clinical settings, robotic systems, and wearable devices — rather than manipulating
              discrete text or language tokens.

              LeCun explicitly frames the market boundary around the Moravec Paradox: what is
              trivially easy for humans (perception, navigation, physical manipulation) remains
              computationally intractable for current AI. Large language models, architecturally
              constrained to discrete token sequences, cannot reliably predict the consequences of
              physical actions or maintain consistent world-state representations across multi-step
              operational sequences. In a January 2026 MIT Technology Review interview, LeCun
              identified the four concrete application domains: industrial process control (jet
              engines, steel mills, chemical factories), factory automation and robotics, healthcare
              diagnostics and clinical workflows, and smart or wearable devices.

              AMI's company website, investor communications from Cathay Innovation, and press
              coverage consistently confirm these four segments as the declared market boundary.
              NVIDIA's parallel positioning of "Physical AI" as a distinct infrastructure category
              — investing in Isaac simulation, Cosmos world model training, and robotics inference
              infrastructure — provides external corroboration that the market boundary is coherent
              and recognized by capital-intensive players.

              Excluded from AMI's core market are: pure text and language-centric applications
              (LLMs, chatbots, document summarization), generative image and video creation
              (diffusion models), and traditional ML classification on structured tabular data.
              The boundary is not geographic: AMI's Paris headquarters and multi-hub structure
              (New York, Montreal, Singapore), together with its European and Asian investor
              syndicate, signal a global market aspiration with particular sensitivity to
              European AI sovereignty requirements.

              Status-quo substitutes for AMI's intended technology include conventional SCADA and
              PLC industrial control systems, rule-based clinical decision support software,
              teleoperation-based robotic systems, specialized computer vision models, and
              LLM-based agentic frameworks that bolt action-planning onto language models. Each
              substitute carries documented limitations in generalizable physical reasoning —
              the gap world models are designed to close. The Moravec Paradox framing is LeCun's
              own explanatory lens and represents company-claimed market logic, not independently
              validated market boundary research.
