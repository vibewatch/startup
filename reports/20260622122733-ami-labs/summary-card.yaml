  topStrengths:
    - >-
      Yann LeCun's 2018 Turing Award, 12-year FAIR leadership, and JEPA authorship establish AMI as the intellectual
      authority in world model AI.
    - >-
      $1.03B seed capital provides an estimated 2–3 years of runway for compute-intensive research without near-term
      fundraising pressure.
    - >-
      Strategic investor composition (NVIDIA, Temasek, Samsung, Toyota Ventures) signals industrial deployment intent
      and a potential partnership pipeline beyond Nabla.
    - >-
      Sovereign-AI Paris positioning creates privileged access to EU regulated-sector procurement, Bpifrance public
      funding, and non-US-hyperscaler buyer preference.
    - >-
      CEO LeBrun's prior founding of Nabla gives the team direct domain-overlap with AMI's primary commercial vertical
      and a live clinical AI testbed.
  topRisks:
    - >-
      Key-person concentration on Yann LeCun (executive chairman, not full-time CEO) is the single largest existential
      risk; his departure would materially impair investor confidence and hiring.
    - >-
      JEPA's architectural bet may not outperform multimodal LLM advances from Meta, Google DeepMind, and others that
      outresource AMI by orders of magnitude.
    - >-
      4–5× annual compute cost escalation requires serial fundraising rounds before commercial revenue validates the
      investment thesis.
    - >-
      Multi-year research timeline creates a funding-gap risk: failure to close a Series A at or above $3.5B pre-money
      by 2028 leads to distressed scenarios.
    - >-
      Goldman Sachs / Sequoia $600B capex-to-revenue gap macro risk threatens enterprise buyer willingness to pay for
      pre-revenue AI research at scale.
  unresolvedGaps:
    - >-
      Independent JEPA benchmark results demonstrating a performance advantage over multimodal LLMs on physical-world
      tasks — the primary thesis-break trigger.
    - >-
      Series A timeline and pricing conditions (expected 2027–2028; target $5B+ pre-money); failure to step up from
      $3.5B would signal valuation compression.
    - Current headcount and team build beyond the ~12 estimated at seed close in March 2026.
    - Nabla partnership commercial terms, exclusivity conditions, and revenue-sharing structure.
    - Board composition, governance schedule, and full advisor roster — not publicly disclosed.
    - EU AI Act GPAI systemic-risk compliance posture once AMI's models approach publication or deployment thresholds.
