      - number: '1.3'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: >
              AMI Labs 围绕 Yann LeCun 的科学声誉和 Alexandre LeBrun 的运营履历搭建，支撑高管大多来自 Meta 的 AI 研究组织。


              Yann LeCun 获得 2018 年 ACM A.M. 图灵奖——计算领域的诺贝尔奖——并与 Yoshua Bengio、Geoffrey Hinton 共同因深度神经网络奠基性工作获奖。在 2025 年
              11 月离开前，他在 Meta 的 FAIR 实验室担任 VP 和首席 AI 科学家超过十年；据报道，离职源于与 Mark Zuckerberg 在 AI 战略上的分歧。LeCun 保留 NYU 教职，并担任
              AMI 执行董事长；他明确不是 CEO。他把 AMI 总部设在巴黎，同时保留纽约基地，凸显公司横跨多洲的全球结构。


              Alexandre LeBrun 以 CEO 身份带来运营深度。他共同创立 Wit.ai（2015 年出售给 Facebook），随后共同创立总部位于巴黎的医疗 AI 公司 Nabla；在转入 AMI
              前，Nabla 已融资 $120M，ARR 增长三倍。LeBrun 也曾在 Meta FAIR 为 LeCun 工作。首席科学官 Saining Xie 来自 Google DeepMind，拥有超过
              90,000 次研究引用，并共同创造 Diffusion Transformers（DiT）——许多领先生成系统背后的架构。首席研究与创新官 Pascale Fung 是 HKUST 教授，也是以人为中心 AI
              的先驱。Michael Rabbat（世界模型 VP）和 Laurent Solly（COO，前 Meta 欧洲 VP）补齐高管团队。对 LeCun
              的关键人物依赖是最重大的单人风险：他的可信度支撑投资者信心和招聘。
