      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: Goldman Sachs 与 Sequoia：$600B CapEx 缺口威胁收入前 AI 估值
            body: >-
              Goldman Sachs 估计，约 $1 trillion 计划中的 AI 基础设施资本开支迄今几乎没有带来可衡量收入或生产率提升。Sequoia Capital 已把其 「$200B
              question」更新为「$600B question」——AI 基础设施支出与证明其合理性所需收入之间的结构性缺口。对 AMI 这样的收入前世界模型实验室而言， 这种 CapEx
              到收入缺口是生死级宏观风险：如果企业买家不愿为理解物理世界的 AI 付费，多年研究时间线就不再是深思熟虑的战略，而会变成资金缺口。
            calloutType: risk
            claimRefs:
              - CV014
              - CV015
          - type: callout
            title: 主权 AI 溢价：真实但有限
            body: >-
              AMI 将自己定位为既非美国、也非中国的前沿 AI，这对进入欧洲受监管市场、公共资金关系和战略买家对齐，确实是结构性优势。 Futurum Group 分析师评估把它称为「战略自主」而非真正独立——AMI 运行在
              NVIDIA 芯片上，使用源自美国的计算云，并与支出规模高出数个数量级的实验室争夺全球人才。 主权溢价是定价输入，不是护城河。只有当 AMI 能证明 EU 企业买家愿意为其技术差异化付费时，这份溢价才可持续。
            calloutType: insight
            claimRefs:
              - CV013
              - CV016
              - CV017
          - type: callout
            title: 估值立场：偏高——当前价格跟踪，JEPA benchmark 作为闸门
            body: >-
              在 $3.5B 投前估值、无收入、无产品且 CEO 表示商业产品还需要多年才能落地的情况下，AMI 估值相对于今天的基本面偏高。 这一定价可以被辩护为对科学可信度和世界模型架构领导力的一份期权——但在 Big
              Labs 缩小架构差距前，这份期权的行权窗口很短。 当前阶段合适的投资人动作是 TRACK：跟踪 JEPA 论文发表速度和 benchmark 结果；在 AMI 能证明其相对多模态 LLM 在至少一个工业用例
              benchmark 上具备经验性优势前， 不承诺参与 Series A 共同投资。
            calloutType: recommendation
            claimRefs:
              - CV025
              - CV026
              - CV029
              - CV031
