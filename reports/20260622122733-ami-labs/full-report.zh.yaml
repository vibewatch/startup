      - - 医疗 / 工业垂直聚焦（当前无竞争者）
        - Physical Intelligence 和 NVIDIA Cosmos 正在扩展到工业垂直领域；Gemini Robotics 有企业试点
        - 中
        - Nabla 合作是否排他，是否能产出可复现证据？更多医疗或工业部署的时间表是什么？
      - - 算力效率（用于端侧部署的小模型）
        - NVIDIA 开放 Cosmos 生态让大规模生成式模型几乎以零边际成本可用
        - 中
        - 是否有已确认的基准，在同等准确率下比较 AMI 模型算力与生成式竞争对手？边缘部署规格是否已定义？
      - - 研究发表速度与人才留存
        - 前沿实验室（DeepMind、Meta FAIR）争夺同一批研究人才；Meta 和 HuggingFace 的开源文化抬高外部机会成本
        - 中
        - AMI 的薪酬和股权结构竞争力如何？是否有已确认离职？
      - - 与竞争对手相比的商业部署缺口
        - World Labs、Physical Intelligence 和 NVIDIA 都已有部署产品或开放模型，带来开发者采用和数据飞轮；AMI 尚无产品，并承诺多年研究
        - 高
        - AMI 的首个外部部署里程碑是什么？除 Nabla 外，首批商业被许可方是谁？
      - - HuggingFace LeRobot 生态带来的开源商品化
        - LeRobot 提供硬件无关策略和开放数据集，持续降低具身 AI 门槛；AMI 必须靠专有训练数据和工业领域专长做出差异
        - 中
        - AMI 是否拥有无法从开放数据集复制的特定领域专有数据资产？
    notes: >
      严重性评级（高 / 中 / 低）是基于截至 2026 年 6 月收集到的竞争证据作出的定性判断；它们反映风险落地后的商业影响幅度，而非发生概率。“尽调问题” 是投资人尽调中的开放问题，并非指控当前失败。AMI 尚未公开披露 IP
