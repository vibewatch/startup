        blocks:
          - type: paragraph
            body: >
              AMI Labs 的创立弧线异常压缩：从 LeCun 2025 年 11 月离开 Meta，到 2026 年 3 月完成 $1.03B 种子轮，只用了四个月。Nabla
              合作与融资公告同步披露，是公司唯一公开确认的商业联盟。Nabla 将获得 AMI 世界模型的特权早期访问权，用于在高风险临床环境中测试。LeBrun 保留 Nabla 董事长兼首席 AI
              科学家职务，维持两家公司之间的战略桥梁。


              截至 2026 年 6 月运行日，AMI 仍处于延长研究阶段。公司尚未公开发布论文、基准测试或原型演示。LeBrun
              在融资公告期间确认，有意义的商业产品可能需要数年才能出现。公司眼下的优先事项是研究基础设施、算力采购，以及在巴黎、纽约、蒙特利尔和新加坡组建团队。世界模型赛道已经吸引竞争者：World Labs（Fei-Fei
              Li）在 2026 年 2 月完成 $1B 融资，General Intuition 在 2025 年 10 月融资 $134M。LeBrun 自己预测，“world model”会成为下一个 AI
              热词，许多公司会改名贴上这个标签。
