  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行与商业化风险
        blocks:
          - type: paragraph
            body: >
              AMI Labs 在 2026 年 3 月按 $3.5 billion 投前估值完成 $1.03 billion 种子轮；当时没有收入、没有已部署产品，并自称采用多年研究优先路线图。LeCun 本人在 2026
              年 1 月 MIT Technology Review 采访中表示，实现人类水平 AI
              需要“重大概念突破”，而且“明年或后年不会发生”。公司智识旗手的这句坦白，把执行风险框定得很清楚：全部价值主张押在一次科学范式转移上，而按创始人自己的说法，时间点无法确定。即便条件有利，从世界模型研究到可商业部署的许可产品之间的产品化缺口，行业分析师和历史先例估计也需要三到七年。

              AMI 的开源发表承诺——写在使命陈述中，也被 LeCun 反复强调——与其未来许可模型形成额外张力。提前发表核心架构洞见，意味着资源更充足的竞争者（Meta FAIR、Google
              DeepMind、NVIDIA）可以比 AMI 更快吸收并实现 AMI 的研究。Gary Marcus 在 Substack 分析中认为，alternative-to-LLM AI
              路线缺乏具体商业证据是一种模式，不是异常；这类投机性估值带有实质 dud risk。
