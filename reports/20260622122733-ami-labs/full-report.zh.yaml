  - id: TV005
    title: 推翻投资假设的触发条件
    columns:
      - 触发条件
      - 阈值
      - 对投资假设的传导
      - 行动含义
    rows:
      - - JEPA 基准失败
        - 多模态 LLM 在目标应用基准（机器人 / 工业控制）上追平或超过 JEPA
        - 架构差异化消失；AMI 只能靠团队竞争
        - 下调信心；暂停 Series A 跟投
      - - Yann LeCun 离职
        - LeCun 退出执行董事长角色，或实质性减少参与
        - 关键人物风险兑现；品牌溢价坍塌
        - Series A 硬性止步；按替代团队质量重新评估
      - - Series A 定价低于 $3.5B
        - 下一轮机构融资低于当前投后估值（$4.53B）
        - 市场给出信号：AMI 未能证明进展；新投资人出现逆向选择
        - 按可得条款退出；不要继续持有并承受后续稀释
      - - 2028 年前除 Nabla 外无商业伙伴
        - 到 2028 年底，AMI 未能宣布第二个付费或正式研究合作伙伴
        - 表明工业买家尚未被说服；AMI 声称的垂直场景没有转化
        - 降低敞口；重新评估基准情景
      - - 主权 AI 资金收缩
        - 法国政府或欧盟 AI 资助项目大幅削减；Bpifrance 退出；欧盟 AI 战略转向
        - AMI 的主权 AI 溢价缩水；监管顺风转为逆风
        - 监测政策信号；调整退出时间表
    notes: 触发条件基于分析师风险分析（Futurum、Goldman Sachs、Sequoia）和前文风险评估。AMI 披露有限，目前没有公开的正式监测触发条件。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - JEPA 基准结果
        - 没有公开基准比较 JEPA 与多模态 LLM 在工业任务（机器人、过程控制、可穿戴设备）上的表现
        - 决定架构押注是已有实证验证，还是仍属投机
        - 申请查看技术演示；跟踪论文发表；对比 World Labs / Odyssey 发布节奏
      - - 算力支出和烧钱拆分
        - 除“算力和人才”外，没有公开募资用途细节；成本结构未披露
        - 跑道建模的关键；每年 $300–500M 的同类估计是外推值，并未确认
        - 向 CFO 索取；对照本轮 NVIDIA 算力承诺验证
      - - Nabla 合作商业条款
        - AMI-Nabla 合作结构（股权、IP、排他性、费用）未公开披露
        - 决定首个商业锚点是真实收入期权，还是关联方安排
        - 索取条款清单或意向书；核验关系独立性
      - - Series A 投资人沟通
        - 尚无信号显示谁预计领投 Series A，或预期估值是多少
        - 决定基准情景估值底线（$5–8B）是否可达
        - 跟踪投资人情绪；对照 Thinking Machines Lab 的 Series A 时间线
      - - 人员计划和人才管线
        - 种子轮完成时仅公开确认“约十几名”员工；未披露人员目标
        - 没有临界规模的世界模型研究员，研究实验室质量会下滑
        - 索取招聘计划；验证 LinkedIn 增长；对标 World Labs 人员扩张轨迹
    notes: 尽调问题是给出中等信心的 Series A 共同投资建议前所需的最低证据集。所有项目均来自分析师评论和公开报道缺口。
    claimRefs:
      - CV034
      - CV035
      - CV036
