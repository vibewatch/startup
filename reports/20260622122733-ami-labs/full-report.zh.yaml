      - number: '3.2'
        title: 直接世界模型创业同业：World Labs、Odyssey、SpAItial
        blocks:
          - type: paragraph
            body: >
              Fei-Fei Li 创立的 World Labs，是 AMI 最突出的直接创业竞争对手。它的论点——“空间智能” 是生成式 AI 的下一前沿——与 AMI 的物理世界 AI
              野心相互映照，但在架构和应用上明显分化。World Labs 的 Marble 产品可从文本、图像、视频和 360 全景生成空间一致、持久的 3D 世界。2026 年 1 月推出的 World API
              为开发者构建仿真、创意工具和空间应用提供程序化访问。World Labs 于 2026 年 6 月发布世界模型功能分类，把模型分为 Renderers、Simulators 和
              Planners——这个框架隐含地把 AMI 定位为 Simulator / Planner 类型，而 World Labs 领先 Renderer 细分。World Labs 已有商业产品和开发者采纳，截至
              2026 年中拥有 AMI 尚不具备的先发优势。


              Odyssey 是规模较小的世界模型实验室，但野心更宽：Odyssey-2 模型瞄准通用物理准确性，Starchild-1 把从视觉观察中学习扩展到更丰富的多模态交互，Agora-1
              支持多智能体共享世界，PROWL 框架用对抗式 RL 改善世界模型表现。Odyssey 的产品套件比 World Labs 面向消费者的 Marble 更贴近研究，但其以 RL 驱动提升物理准确性的路径，与
              AMI 的准确性优先定位高度重叠。


              SpAItial 成立于 2025 年 5 月，是直接同业中最年轻、规模最小的一家。其 Echo 模型家族通过开发者 API 从图像、文本或全景生成持久 3D Gaussian Splat 世界。Echo-2
              已公布。SpAItial 的开发者优先定位（API + SPZ、PLY、SOG 等 3D 格式导出）以及对 3D 世界生成的窄聚焦，代表了不同于 AMI 计划工业授权模式的商业化策略。


              三家同业与 AMI 之间的关键架构分野在于：World Labs、Odyssey 和 SpAItial 都是生成式系统——它们重建像素级或体素级内容，用算力效率换取照片级真实输出。AMI 的 JEPA
              路径在抽象表征空间中预测，创始人认为这能带来可控性和可靠性，而这些特性是生成式系统在安全关键环境中结构上无法匹配的。
