        title: 商业化前阶段与客户格局
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，AMI Labs 没有付费客户，没有披露收入，也没有生产部署。公司在 2025 年底启动，完成 $1.03 billion 种子轮；CEO Alexandre LeBrun
              在公开表态中说得很清楚：“AMI Labs 不是典型的应用 AI 创业公司，不是三个月发产品、六个月有收入、十二个月做到 $10 million ARR。” 这是有意且明示的战略选择，不是疏忽。AMI
              在商业许可前，先资助一项多年基础研究议程。

              公司的客户策略遵循业内所说的 design-partner model——让早期用户或伙伴组织参与共同开发，在正式商业发布前验证技术。AMI
              的使命陈述把“工业流程控制、自动化、可穿戴设备、机器人、医疗及更多领域”列为最终垂直领域；Yann LeCun 在 2026 年 3 月接受 AFP
              采访时表示，融资公告后“六到十二个月内可能展开”与企业伙伴的讨论。这个窗口大约覆盖 2026 年 9 月到 2027 年 3 月，但不意味着已经签署商业合同。

              投资者基础本身就是早期商业兴趣的 proxy。Toyota Ventures（robotics/automotive）、Groupe Industriel Marcel
