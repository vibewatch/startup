      - number: '3.3'
        title: 前沿实验室与 Hyperscaler：DeepMind、Meta FAIR、OpenAI 和 NVIDIA
        blocks:
          - type: paragraph
            body: >
              在前沿实验室中，Google DeepMind 的世界模型组合最完整。Genie 1（2024 年 2 月）是第一个基于互联网视频训练的无监督基础世界模型，参数量 110 亿。Genie 2（2024 年 12
              月）把能力扩展到可由行动控制的 3D 环境，用于训练和评估具身智能体；它能从单张提示图生成最多持续一分钟的一致世界。Genie 3 被列为 DeepMind
              当前世界模型，但完整技术披露尚未公开。另一路线中，Gemini Robotics 把语言条件推理应用到多种机器人硬件形态，包括 ALOHA、Bi-arm Franka 和 Apptronik
              Apollo。DeepMind 的规模——算力、数据、研究人才和 Google 生态整合——使其成为长期竞争威胁，尽管其目标（推进 AI 研究）不同于 AMI 的商业路线图。


              Meta FAIR 的 V-JEPA（2024），即 Video Joint Embedding Predictive Architecture，是与 AMI
              路径最相似的已发表系统：非生成式、自监督，在抽象表征空间中预测。LeCun 在 Meta 共同设计 JEPA，如今把该架构带到 AMI。随着 LeCun 于 2025 年底离开，Meta 截至 2026 年 6
              月的 AI 研究头条转向 “Muse Spark”，显示战略重心离开以 JEPA 为中心的世界模型。Meta FAIR 的 I-JEPA 和 V-JEPA 仍以 Creative Commons
              NonCommercial 许可证在 GitHub 开源——这构成任何实验室都可继续利用的公开先例，也给 AMI 带来商品化问题。


              OpenAI 的 Sora 在技术论文中被明确定位为 “能理解并模拟真实世界的模型基础”，因此是直接世界模型竞争者。但这项战略押注被逆转：OpenAI 于 2026 年 4 月 26 日停用 Sora
              网页和应用体验，API 将于 2026 年 9 月 24 日随后停止。此次退却大幅削弱了世界仿真器空间的一大竞争者，也验证了 LeCun 的论点：基于扩散的生成式系统不适合可靠的物理世界应用。


              NVIDIA 与众不同，它是基础设施层玩家，而不是终端市场竞争者。Cosmos 于 CES 2025 发布，目前为第 3 版，是一组世界基础模型，基于来自真实世界数据的 20,000,000 小时、9,000
              万亿 token 训练，并以开放商业许可证提供。Cosmos 在单一平台中支持视觉推理、机器人策略训练和基于物理的仿真。NVIDIA 的开发者生态庞大：Cosmos 伙伴包括 1X、Agility
              Robotics、XPENG、Uber 和 Waabi。其 Isaac 平台提供完整机器人软件栈。NVIDIA 的世界模型野心和 GPU 市场主导地位意味着，它将设定每一家世界模型公司用来对标的算力基础设施标准。
