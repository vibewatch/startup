  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 技术架构与 JEPA 脉络
        blocks:
          - type: paragraph
            body: >
              AMI Labs 的整个技术身份，都可追溯到 Yann LeCun 在 2022 年 6 月立场论文 “A Path Towards Autonomous Machine Intelligence” 中提出的
              Joint Embedding Predictive Architecture（JEPA）。核心洞见是：世界模型应该在抽象表征空间，而不是原始像素或 token
              空间里预测。这条非生成式路线让系统可以有意忽略不可预测的细节——树叶移动、表面噪声、随机传感器伪影——同时保留高层语义结构。LeCun
              架构提出五个相互作用的模块：perceptor（多模态感知编码器）、world model（JEPA 预测器）、actor（行动规划器）、configurator（目标和策略设定器），以及双记忆系统（短期和长期
              episodic）。没有任何单一模块构成 AMI 的产品；完整认知架构才是公司声明的终点。JEPA 脉络已有两个公开实现。I-JEPA（CVPR 2023）只用未标注数据，训练 Vision
              Transformer 在潜空间预测被遮蔽的图像区域；一个 ViT-Huge/14 在 16 张 A100 GPU 上不到 72 小时完成 ImageNet
              训练。V-JEPA（Meta，2024）把方法扩展到视频：遮蔽大块时空区域，要求预测器在表征空间而非像素中补全。相对既有视频表征学习 baseline，V-JEPA 训练和样本效率提升 1.5× 到
              6×，并擅长“冻结评估”——编码器预训练一次后保持冻结，轻量 probes 处理下游任务。V-JEPA 以 Creative Commons NonCommercial licence 发布。AMI
              计划的下一步，是 action-conditioned world models：能够模拟拟议动作的后果，并在安全 guardrails 约束下选择行动序列——这种能力尚未公开展示。
