      - number: '4.3'
        title: 成本结构、burn 对标与 runway 估算
        blocks:
          - type: paragraph
            body: >
              LeBrun 明确把算力和人才列为 AMI 两大成本中心。本章所有 burn 数字都是参照 frontier AI lab 对标推导的估算；AMI 未披露任何公司自身财务数据。


              算力方面：Epoch AI 数据显示，自 2020 年以来，前沿模型训练算力每年增长 4–5 倍；已知最大的 AI data center 需要约 $24 billion 资本成本，才能运行 800,000 张
              H100-equivalent 芯片。不过，AMI 的架构论点——JEPA 世界模型需要数亿而不是数千亿参数——意味着单次训练所需算力应显著低于 frontier LLM。AI 芯片单位美元性能约每年提升
              37%（Epoch AI），也就是说算力成本按实际口径在下降。Sequoia Capital 的分析估计，GPU 约占 AI data center 总持有成本的 50%，其余为能源、建筑和网络。


              人才方面：AMI 启动时团队估计约 12 人（Futurum Group analysis，2026 年 3 月），并正在巴黎、纽约、蒙特利尔和新加坡招聘。LeBrun 表示 AMI
              会“重质量胜过重数量”。可比实验室（OpenAI、Anthropic、DeepMind）的 frontier AI research 薪酬公开记录显示，高级研究人员的年度总薪酬从数十万美元到超过 $1
              million 不等。如果 AMI 扩张到 100 名研究人员和员工，平均 fully-loaded cost 为 $400,000–600,000，则年度人才支出会达到 $40–60
              million——还未计入创始团队股权稀释。


              把保守算力支出（早期研究规模下 $50–150M/year）与人才成本（80–150 人规模下 $40–80M/year）合并，再加上基础设施和 overhead，未来 1–3 年每年 $150–300
              million 的 burn rate 属于合理区间。Goldman Sachs 质疑，全球估计 $1 trillion 的 AI 基础设施支出最终能否产生相称收入回报。Sequoia 警示，投机性 AI
              基础设施投资狂热在历史上会导致资本焚烧、GPU 算力定价能力侵蚀，以及快于预期的硬件折旧。这些宏观风险不直接作用于 AMI 近期运营，但会让 Series A 融资环境更困难。


              按 $150M/year 的 burn，AMI 的 $1.03B 约可支撑 6.9 年资金续航。按 $300M/year，资金续航降至约 3.4 年。这些只是指示性区间；实际 burn 轨迹高度取决于 AMI
              是否会在第 2–3 年扩大到大算力训练。
