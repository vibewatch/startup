      - number: '6.3'
        title: 目标买方群体与采购路径
        blocks:
          - type: paragraph
            body: >
              AMI 的目标客户画像，是处在数据密集、安全关键环境中的企业买方；在这些环境里，LLM 幻觉会带来实质运营或监管风险。LeCun
              描述的典型用例，是一家飞机发动机制造商希望建立覆盖数千个传感器的整体模型，以优化效率并预测故障——这是工业制造垂直领域的买方，其设备生命周期长达数十年，供应商评估流程也常跨多年。医疗买方（医院系统、医疗器械制造商、Nabla
              这类 health AI platforms）同样具备安全关键特征，但采购治理更严格，受 FDA clearance 要求、临床工作流整合和责任风险驱动。

              机器人领域中，相关买方角色是制造或物流公司的自动化或工程负责人，他们需要可靠的实体机器人 action-prediction 能力——目前这类买方由 NVIDIA Isaac robotics
              platform，或 Physical Intelligence、1X Technologies 等公司服务。可穿戴设备领域中，买方很可能是 device
              OEM（Samsung、Garmin、Oura），希望获得设备硬件层可高效运行的 persistent-memory ambient intelligence。

              无论哪种情况，AMI 世界模型的采购路径都需要：（1）design partner agreement，让客户以提供领域数据和评估反馈为交换，访问早期 model checkpoints；（2）pilot
              phase，可能持续 6–18 个月，在客户传感器环境中测试世界模型；（3）基于试点结果进行商业许可谈判。这个多步骤流程意味着，即便今天最早介入的伙伴（Nabla，2025 年 12
              月参与），距离签署商业许可也还有数年。

              除 Nabla 外，没有公开证据显示正式 design-partner agreements 已披露。Toyota Ventures、Dassault、ZEBOX、Samsung 和 SEA 出现在投资
              syndicate 中，与商业协同一致，但股权投资并不迫使任何一方成为客户或设计伙伴。
