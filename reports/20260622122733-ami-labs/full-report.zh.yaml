      - number: '7.2'
        title: 技术、研究与竞争风险
        blocks:
          - type: paragraph
            body: >
              AMI 押注 JEPA（Joint Embedding Predictive Architecture）会接替 LLM，这在科学上站得住脚——LeCun 的立场论文以及 I-JEPA/V-JEPA
              论文都说明其研究根基很强——但商业化路径明显比基于 LLM 的产品更长。训练算力成本每年增长 4–5×（Epoch AI，2024），前沿世界模型训练预计需要超过 10^25 浮点运算的 exascale
              级算力运行，而这正是 EU AI Act 推定系统性风险的门槛。NVIDIA 在 AI 训练芯片上的近乎垄断，意味着 AMI 在运营上依赖 NVIDIA 的定价和配额决策； NVIDIA 参与 AMI
              种子轮投资就是证据——这层关系带来供给通道，也带来利益绑定风险。

              竞争压力极端：Google DeepMind Genie 2、NVIDIA Cosmos、Meta FAIR 后续项目、Physical Intelligence（π）和 World Labs
              都在争夺重叠技术地带，而且资产负债表更厚、迭代循环更快。DeepSeek 等中国开源模型说明，接近世界模型的能力可能很快商品化。 Sequoia 的「$600B question」分析直接适用于
              AMI：hyperscaler 的 GPU 资本开支越来越商品化，任何依赖算力的 AI 产品定价权都会被侵蚀。 Goldman Sachs 也指出，预计 $1 trillion 的 AI
              资本开支迄今几乎没有产生可衡量 ROI。
