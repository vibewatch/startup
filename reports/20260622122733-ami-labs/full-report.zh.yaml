      - number: '4.2'
        title: 收入模型与 GTM 时间线
        blocks:
          - type: paragraph
            body: >
              AMI Labs 没有收入，没有商业产品，并已明确表示近期不计划创收。CEO Alexandre LeBrun 把公司描述为“一个非常有雄心的项目，因为它从基础研究开始。它不是那种典型的应用 AI
              创业公司：三个月发产品、六个月有收入、十二个月做到 $10 million ARR。” 他表示，世界模型从理论走向商业应用可能需要“数年”。


              预期的变现路径——一旦到来——是技术许可：向工业伙伴出售特定领域的世界模型能力，而不是销售消费级或企业软件。Yann LeCun 预计，2026 年 3 月种子轮宣布后 6–12
              个月内，可能开始与企业伙伴讨论；而通向“准通用智能系统”的时间线是 3–5 年。Nabla 是 LeBrun 之前创办的医疗 AI 公司，也是 AMI
              首个且唯一公开披露的商业伙伴；它在非收入条款下获得早期研究产出的访问权。


              因此，AMI 的 GTM 动作是从研究走向伙伴，而不是从产品走向客户。没有标价、没有交易历史、没有客户 pipeline，也没有可评估的
              ARR。销售效率指标（CAC、回本期、NRR）在这个阶段结构性不适用。Nabla 合作是医疗场景中的试点环境和早期概念验证，不是创收型商业协议。并行的开源和学术发表承诺，把 AMI
              定位成研究平台而不是产品公司；这可能吸引后续合作，但会推迟支撑高价许可所需的传统 IP 护城河形成。
