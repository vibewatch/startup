      - number: '2.2'
        title: 市场规模——TAM、SAM 与证据受限视角
        blocks:
          - type: paragraph
            body: >
              还没有分析师把 “world models” 或 “physical-world AI infrastructure” 定义为独立商业类别，因此 TAM 测算只能框定相邻市场，再施加相关性筛选。


              广义 TAM——物理世界 AI 可触达市场（约 $258–610B，2026 年估计）：三个独立分析师锚点勾勒上限。Grand View Research 将 2025 年总 AI 市场估为 $390.9B，预计
              2033 年达到 $3,497.3B，CAGR 为 30.6%。MarketsandMarkets 将 2026 年市场估为 $601.9B，预计 2033 年达到 $3,638.1B，CAGR 为
              29.3%。两组数字都涵盖包括文本和生成式 AI 在内的所有 AI 垂直领域；AMI 可触达部分只是其中子集。与 AMI 声明领域最相关的三个子细分是：（1）医疗 AI——2026 年 $36.7B，预计
              2031 年达到 $194.8B，CAGR 39.7%（MarketsandMarkets）；（2）工业自动化——2024 年 $206.3B，预计 2030 年达到 $378.6B，CAGR
              10.8%（Grand View Research）；以及（3）机器人 AI 软件——2025 年 $21.0B，预计 2032 年达到 $70.8B，CAGR 19.0%（MarketsandMarkets）。


              SAM——世界模型基础设施授权（无独立规模测算）：AMI
              声明的收入模式是向行业伙伴授权技术，而不是直接做垂直部署。基础设施层授权业务会从上述垂直市场中抽取一部分价值——历史上，基础设施层通常捕获其赋能应用层价值的约 3–15%。对 $258B 的合并物理 AI
              子细分（医疗 AI + 机器人 AI 软件，2026 年中估计）施加 5–10% 捕获率，得到 2031 年视角下粗略 SAM 为 $13–26B。鉴于 AMI
              研究优先的时间线且没有任何可部署产品，不确定性很宽。这是分析师推导；没有公开来源独立验证捕获率或子细分构成。


              SOM——2026–2028 可服务可获得市场（实际为零）：AMI 是研究优先公司，当前没有产品。CEO LeBrun 在 2026 年 1 月表示，商业推出可能 “约一年后”
              开始，乐观情况下意味着最早商业收入在 2027 年。短期 SOM 受 Nabla 医疗合作约束，只是单一渠道客户，而非大众市场。$3.5B 投前种子轮估值说明，投资者主要是在为科学可信度和物理世界 AI
              类别的长期期权价值付费，而不是近期收入。


              一个重要的相反规模信号：工业自动化——按价值计最大的物理世界细分——CAGR 为 10.8%，显著低于 AI 特定市场细分 29–40% 的 CAGR
              区间。这种分化反映了工业部署资本密集、采纳保守的性质。投资者如果把头部 AI 增长率外推到 AMI 的物理世界市场，很可能高估近期可触达需求。
