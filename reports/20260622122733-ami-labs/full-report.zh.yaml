      - number: '2.5'
        title: 规模矛盾、证据缺口与尽调优先级
        blocks:
          - type: paragraph
            body: >
              本章保留三个仍未解决的重大矛盾。


              矛盾 1——AI 增速与物理世界部署速度：头部 AI 市场 CAGR 为 29–31%（MarketsandMarkets、Grand View Research），显著高于工业自动化市场 10.8% 的
              CAGR；后者是 AMI 物理世界范围内最大的单一细分。差异源于文本、语言和生成式 AI 在整体 AI 市场规模测算中占主导。投资者在研究第一天就给 AMI $3.5B 投前估值，可能是在外推头部 AI
              增速；但这些增速并不代表物理世界 AI 采纳速度，尤其考虑工业和医疗买家的资本开支保守性。


              矛盾 2——机器人商业就绪说法：LeCun 2026 年 1 月称 “没人，绝对没人，知道怎样让这些机器人聪明到真正有用”，这与 Agility Robotics、Figure AI、1X 和 Boston
              Dynamics 的商业部署说法直接冲突；这些公司都描述了近期通用人形机器人商业化。关于当前机器人泛化能力，这两种判断不可能同时准确。矛盾仍未解决，也给任何物理 AI 基础设施提供商带来显著市场时机不确定性。


              矛盾 3——世界模型差异性与 LLM 收敛：AMI 的论点要求 LLM 在结构上无法拿下物理世界 AI 市场。然而，Google DeepMind 的 Gemini Robotics、NVIDIA 的
              Project GR00T，以及 OpenAI 的物理智能体工作，都试图用多模态基础模型处理类似物理世界任务。基于 JEPA
              的世界模型是否在物理世界任务上架构更优，还是各路径最终收敛，是一个关键经验问题，目前没有公开基准测试给出答案。


              关键证据缺口——没有世界模型授权的分析师 SAM：没有公开分析师报告把世界模型基础设施授权市场作为独立类别测算规模。所有市场估计都针对更宽类别，里面包含非世界模型应用。本章引用的 $13–26B SAM
              是基于基础设施捕获率推导，并非来自任何公开研究。这是投资尽调中最重大的规模缺口。
            claimRefs:
              - CM038
              - CM039
              - CM040
              - CM041
      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 物理 AI 市场时机——结构性顺风真实存在
            body: >
              三股汇合的结构性力量，为 AMI 的论点创造了真实市场顺风：中国第十五个五年规划把机器人列为经济优先事项，加速西方竞争压力；NVIDIA 在 GTC 2026 对 Physical AI 基础设施的承诺，以
              hyperscaler 规模验证了市场类别；欧洲 AI 主权需求则对总部位于巴黎的前沿实验室形成结构性偏好。这些力量不依赖 JEPA 是否成为胜出架构——无论如何，它们都会为 AMI 瞄准的类别创造需求。
            calloutType: strength
            claimRefs:
              - CM027
              - CM028
              - CM014
          - type: callout
            title: 世界模型授权没有公开 SAM——所有规模测算都带推测
            body: >
              最重大的市场分析风险是结构性的：没有分析师独立测算世界模型基础设施授权市场这一独立商业类别。本章 $13–26B 的 SAM 估计，完全是把基础设施捕获率假设套用到相邻市场估计后由分析师推导。投资者以 $3.5B
              投前估值为 AMI 定价时，应认识到支撑该估值的市场规模建立在未经验证、未公开发表的细分逻辑上。
            calloutType: risk
            claimRefs:
              - CM038
              - CM041
          - type: callout
            title: 投资者构成作为细分代理——投资方联盟定义市场地图
            body: >
              AMI 的战略投资者构成提供了最清晰、可独立验证的市场分层信号。NVIDIA（物理 AI 基础设施）、Toyota
              Ventures（汽车和工业机器人）、Samsung（设备和可穿戴）、Temasek（亚太主权）和
              Bpifrance（欧洲主权）并非被动财务投资者。它们的参与意味着在特定细分适配上做过商业化前尽调——因此，投资方联盟是事实上的市场验证信号，比任何针对未定义类别的公开分析师估计更可靠。
            calloutType: insight
            claimRefs:
              - CM021
              - CM029
          - type: callout
            title: 5–10% 的基础设施捕获率未经验证
            body: >
              $13–26B 的 SAM 估计建立在一个假设上：物理 AI 应用子市场中，基础设施层可捕获 5–10%。这一比例来自对其他 AI 基础设施层（数据库、中间件、ML
              平台）的类比，并未针对世界模型授权验证。如果正确捕获率是 2–3%（一些底层基础设施确实如此），SAM 会降至 $5–10B；如果 AMI 实现更高垂直整合（15–20%），SAM 可能达到
              $40–60B。结果区间很宽，目前无法用现有证据收束。
            calloutType: assumption
            claimRefs:
              - CM038
              - CM041
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              AMI Labs 的竞争格局横跨四个不同竞争簇：（1）瞄准 3D 空间和仿真输出的直接世界模型创业公司；（2）在大型企业平台中嵌入世界模型项目的前沿研究实验室；（3）把物理世界 AI 商业化到机器人硬件上的具身
              AI 和机器人创业公司；以及（4）把世界基础模型作为平台层提供的基础设施玩家。


              AMI 最清晰的直接竞争对手是 World Labs（Fei-Fei Li 的空间智能创业公司）、Odyssey（通用世界模型实验室）和 SpAItial（3D Gaussian Splat
              世界模型）。三家公司都是私营融资创业公司，追求用于生成式 3D 环境的世界模型架构。不同于 AMI，三者都采用生成式架构——预测像素级或体素级内容，而不是抽象表征——且已经部署公开产品或 API。


              前沿实验室簇包括 Google DeepMind（Genie 1/2/3、Gemini Robotics）、Meta FAIR（V-JEPA，LeCun 离开后）和 OpenAI（Sora，已于 2026 年 4
              月停用）。NVIDIA 位置特殊：其 Cosmos 世界基础模型平台采用开放授权，已通过机器人和 AV 伙伴嵌入物理 AI 开发者生态。Physical Intelligence 和 Wayve 代表具身 AI
              商业化簇，把世界模型和基础策略直接部署到机器人硬件和自动驾驶车辆中。


              AMI 基于 JEPA 的路径占据一条技术上不同的赛道——非生成式、可控、可靠性优先——当前没有已商业部署的竞争对手直接瞄准其声明的工业流程控制和医疗垂直领域。战略风险在执行速度：AMI
              承诺多年产品前时间线，而竞争者已经在交付。
