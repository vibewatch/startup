        - 驱动因素
        - 正向
        - 当前 / 2–5 年
        - 为通用 AI 自动化形成结构性拉力；利好工业和机器人论点
        - 量化 AMI 具体目标行业的劳动力成本与自动化 ROI；与既有自动化成本比较
      - - 中国“十五五”规划——机器人优先
        - 驱动因素
        - 正向（对西方形成竞争压力）
        - 2026–2030
        - 加速全球机器人部署，也倒逼西方加大物理 AI 投资
        - 判断竞争压力究竟转化为 AMI 合作需求，还是只会加快中国侧竞争者的物理 AI 开发
      - - 欧洲 AI 主权需求
        - 驱动因素
        - 正向
        - 当前 / 3–7 年
        - AMI 的欧洲总部和投资方组合，使其在符合欧盟要求、非美国 / 非中国 AI 基础设施上具备结构性偏好
        - 验证买方意向：有多少欧洲企业潜在客户明确偏好非美国 AI 基础设施？
      - - NVIDIA 物理 AI 基础设施投资
        - 驱动因素
        - 正向
        - 当前 / 2–4 年
        - 在超大规模云厂商量级验证物理 AI 类别；NVIDIA 的 Cosmos 平台可能与 AMI 互补
        - 厘清 AMI 与 NVIDIA 自身世界模型工作的关系；确认合作条款与潜在竞争重叠
      - - 企业对 LLM 失效模式的认知
        - 驱动因素
        - 正向
        - 当前
        - 企业越来越清楚 LLM 会幻觉、在物理世界不可靠，从而拉动对更可靠架构的需求
        - 调研工业和医疗 CIO 对 LLM 可靠性的看法，以及尝试替代 AI 路径的意愿
      - - 世界模型技术商业化尚未验证
        - 约束
        - 负向
        - 近期（2–4 年）
        - 尚无可部署产品；多年研究时间线让 $1.03B 融资对应的执行风险更高
        - 跟踪 JEPA 基准论文；确认首批商业试点时间线和试点转化率
      - - FDA 与 EMA 监管路径
        - 约束
        - 负向
        - 中期（3–7 年）
        - 面向患者的临床 AI 需要以年计的审批流程，限制近期医疗收入
        - 确认 Nabla 合作范围：AI 工作流工具还是受 FDA 监管的临床设备；厘清监管策略
      - - EU AI Act 高风险分类
        - 约束
        - 负向
        - 中期（2–5 年）
        - EU AI Act 将工业控制和医疗 AI 归入高风险类别；合规成本不可忽视
        - 评估 AMI 的监管事务能力；确认主要欧洲市场的合规路线图
      - - 工业 CapEx 保守（3–5 年周期）
        - 约束
        - 负向
        - 持续
        - 规划周期长，销售难以快速推进；AMI 早期收入不能依赖企业快速采用
        - 跟踪工业客户中的概念验证管线规模，以及企业转试点的时间线
      - - 竞争性物理 AI 架构
        - 约束
        - 负向
        - 近期至中期
        - Google DeepMind、Physical Intelligence、1X 以及 NVIDIA 自身世界模型，可能收敛到 AMI 的目标用例
        - 监控 LLM 供应商的物理 AI 路线图；获取 JEPA 与竞争架构的独立基准
    notes: 时间估计基于行业周期和监管基准，属指示性判断，不是 AMI 的具体预测。尽调问题是下一步研究问题，不是已验证发现。EU AI Act 高风险分类适用于关键基础设施、医疗健康和自主设备中的 AI 系统。
