      - number: '7.4'
        title: 关键人物、治理与融资风险
        blocks:
          - type: paragraph
            body: >
              AMI Labs 的治理结构形成两条不同的关键人物风险。LeCun 担任执行董事长，而非 CEO；他明确把自己的角色定义为战略性而非运营性， 保留 NYU 教职并继续常驻纽约。公司总部在巴黎，CEO Alex
              LeBrun 同时担任 Nabla（AMI 锚定临床合作伙伴）的董事长兼首席 AI 科学家。 这种双重角色安排意味着，最具知名度的科学权威是兼职，运营负责人又同时向另一家实体承担职责。LeCun 2025 年
              11 月在 Meta 任职 12 年后离开，原因是与 Zuckerberg 在 AI 战略上存在分歧；这说明高知名度 AI 科学家一旦出现理念错位，可能脱离机构承诺， AMI 面临不小的复发风险。

              融资风险很实质。$1.03B 种子轮、$3.5B 投前估值建立在一条短期没有收入里程碑的研究时间线上。Anthropic、Mistral、Cohere 等前沿 AI 实验室为维持类似的重算力研究项目，通常每
              18–24 个月再融资一轮。AMI 在 2 年研究期内几乎肯定需要种子轮后的资本。 Sequoia 的分析把算力定义为定价权坍塌的商品，这意味着 AMI 后续每一次训练运行都会同时面对绝对成本上升（每年增长
              4–5×） 和回报压缩。Goldman Sachs 也独立指出前沿 AI 支出存在 ROI 缺口。
