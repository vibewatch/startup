      - number: '7.3'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              AMI Labs 面对一套分层、跨司法辖区的监管栈。作为在法国（EU 成员国）注册并设总部的通用 AI（GPAI）模型开发商， AMI 明确落在 EU AI Act（Regulation
              2024/1689）范围内；该法案于 2024 年 3 月 13 日由欧洲议会以 523 票赞成通过。 GPAI 模型提供商必须履行透明度义务，包括发布详细训练数据摘要、遵守 EU
              版权法、落实模型文档要求；这些义务在该法案生效后 12 个月（2025 年 8 月）开始适用。根据第 51 条，若 GPAI 模型训练累计计算量超过 10^25 FLOPs，即被推定存在系统性风险，
              进而触发模型评估、系统性风险缓释计划和事件报告等额外义务。

              AMI 规划中的医疗和机器人应用属于 EU AI Act 的高风险 AI 类别，需要合格评定、质量管理体系和上市后监测。在美国， AI 赋能医疗器械需要 FDA 510(k) 许可或上市前批准（PMA）；FDA
              于 2021 年 1 月发布 AI/ML Action Plan，并持续搭建自适应 AI 医疗软件监管框架。美国 Bureau of Industry and
              Security（BIS）负责的出口管制限制向特定国家转让先进 AI 芯片和相关技术； 若地缘政治恶化，AMI 的欧洲算力基础设施会承受供应链风险。截至 2026 年 6 月，AMI 未披露未决诉讼或 IP
              纠纷，但 LeCun 与 Meta 之间没有公开的竞业限制或 IP 转让协议，这让 Meta FAIR 资助下发展出的 JEPA 架构存在潜在 IP 归属模糊。
