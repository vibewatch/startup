      - number: '2.4'
        title: 增长驱动因素与采纳约束
        blocks:
          - type: paragraph
            body: >
              增长驱动因素：


              劳动力套利与自动化需求：制造、医疗和物流的全球劳动力短缺构成结构性驱动。IFR 确认，2025 年美国机器人安装量增长 11%，食品行业采纳激增
              30%。中国第十五个五年规划（2026–2030）把机器人置于现代工业体系核心，明确将 AI 研究聚焦在物理应用，并把机器人指定为经济增长的主要驱动力。这迫使西方制造商和政府投资物理 AI
              基础设施，以匹配中国的部署规模。


              物理 AI 基础设施投资：NVIDIA 已在 GTC 2026 验证 “Physical AI” 是一个独立基础设施类别。NVIDIA 的 Isaac 仿真平台、Cosmos
              世界模型训练基础设施和机器人推理栈，代表着 hyperscaler 级别的投入，建设 AMI 目标市场所需的赋能基础设施。Futurum Group 分析师指出，NVIDIA 在 AMI
              的投资方身份传递的是协同，而非竞争——AMI 的基础模型层可能补充 NVIDIA 的算力基础设施，而不是与之竞争。


              欧洲 AI 主权需求：欧洲政府、主权财富基金和企业买家正在积极寻找不经由美国 hyperscaler 供应链、也不把敏感数据暴露在美国云管辖下的 AI 基础设施。Bpifrance 参与 AMI
              种子轮，反映了法国国家资本对本土 AI 能力的投入。LeCun 明确把 AMI 描述为 “既不是美国，也不是中国”，直接回应主权 AI 需求，并创造出超越纯技术优劣的结构性市场偏好。法国国家 AI 生态和 EU
              AI Act 合规要求，也为一家总部位于欧洲的前沿 AI 实验室提供进一步顺风。


              LLM 失败模式意识：在高风险物理环境中，LLM 的失败模式已有记录——幻觉、无法建模行动后果、时间推理不可靠——这些问题正在催生企业对更可靠 AI 架构的需求。SiliconAngle 报道和 Futurum
              Group 分析都指出，工业和医疗买家非常清楚 LLM 可靠性边界。


              采纳约束：


              世界模型技术尚未商业验证：作为商业产品类别，世界模型还不存在。Futurum Group 明确指出 “研究优先使命与按十亿美元融资校准的投资者预期之间存在结构性张力”。AMI 押注基于 JEPA
              的架构会比替代路径更快在物理任务上达到商业级性能，但没有外部验证支持这一时间线。


              监管路径：面向患者的临床 AI 需要 FDA 和 EMA 审批，上市前审查以年计。自主系统的工业安全认证（IEC 61511、ISO 13849）需要大量验证。医疗和工业控制高风险应用的 EU AI Act
              合规要求，在 AMI 主要欧洲目标市场进一步增加监管复杂度。


              企业采纳保守：工业和医疗企业买家资本密集，规划周期多年，从既有平台切换成本高（工业领域 Siemens、GE、Honeywell；医疗领域 Epic、Cerner）。Grand View Research
              的工业自动化数据确认，即便纳入 AI 集成，该行业 CAGR 仍为 10.8%——远低于头部 AI 增速——反映了这种保守性。资本开支周期平均为 3–5 年。


              竞争性物理 AI 架构：Google DeepMind、Meta Superintelligence Labs、Physical Intelligence 和 1X 都在开发相邻物理 AI 能力。LLM
              提供商正在投入推理和行动能力，可能向世界模型用例收敛。LeCun 承认，如果主要 LLM 提供商加快世界模型和空间学习工作，AMI 的架构差异窗口会变窄。没有公开基准测试独立比较基于 JEPA
              的世界模型与竞争路径在物理世界任务上的表现。


              机器人泛化缺口：LeCun 在 2026 年 1
              月公开表示，“没人，绝对没人，知道怎样让这些机器人聪明到真正有用”，并把原因归结为依赖遥操作的训练数据无法跨环境泛化。这个坦率承认一方面勾勒了世界模型的市场机会，另一方面也显示距离商业部署仍有很长技术距离。
