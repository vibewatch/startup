      - number: '6.4'
        title: 采购摩擦、监管壁垒与采用时间线
        blocks:
          - type: paragraph
            body: >
              多重结构性力量会把 AMI 的 go-to-market 时间线拉长到标准 frontier AI 商业化周期之外。

              医疗领域中，根据 Menlo Ventures 2025 State of AI in Healthcare survey，即便最激进的买方，现在处理 AI 采购决策也平均需要 6.6 个月（低于传统 IT 的
              8 个月）。但这种加速适用于 production-ready ambient scribing 和 billing automation tools，不适用于需要 FDA clearance
              的研究阶段世界模型。FDA 已 cleared 的 AI/ML medical devices（截至 2026 年初超过 900 个）主要是 narrow diagnostic detection
              tools，通过 510(k) 或 De Novo pathways 获批。Nabla 设想的自主 agentic clinical AI，很可能需要复杂得多的监管接触——最可能是 PMA（pre-market
              approval）或新的 De Novo pathway，从实质提交起，时间线通常跨 2–5 年。

              Menlo Ventures 还记录到，医疗买方明确优先考虑“技术成熟度”和“能在规模化环境中可靠运行、可直接投产的解决方案”——AMI 目前达不到这个标准。上一阶段的“试点致死”动态虽然对已验证 AI
              工具有所缓解，但会继续困住 world models 这类未经验证的架构。Goldman Sachs research 指出，累计 AI capex 已达 $1 trillion，但部署型 AI
              收入有限；Sequoia Capital 更新版 “AI's $600B question” 分析量化了截至 2024 年 GPU 基础设施支出与实际终端用户价值之间的缺口。这些结构性观察适用于更广泛的 AI
              市场，但也直接影响客户采用未经验证架构的意愿。

              工业 / 制造市场中，复杂 process control systems 的企业软件销售周期，即便是成熟供应商也常常需要 12–24 个月。AMI
              还面对额外障碍：它需要客户共享专有运营数据（喷气发动机遥测、工厂传感器流）来训练世界模型，由此引发数据主权和 IP ownership 担忧；Futurum Group 和独立分析师都把这些问题标记为“AI
              驱动交易中最先被审查的问题之一”。这种数据共享前提制造了鸡生蛋动态：AMI 需要领域数据来构建有用模型，但客户没有经验证的 ROI 就不会共享数据。

              BMJ 的 TRIPOD+AI 临床 AI 报告框架强调，任何临床预测模型在进入 health system 部署前，都必须满足严格的外部验证、预先指定 calibration 和 bias assessment
              要求——AMI 尚未发表的世界模型还无法回应这些标准。
