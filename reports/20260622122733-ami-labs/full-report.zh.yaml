companyProfile:
  summary: >-
    AMI Labs（Advanced Machine Intelligence Labs）是一家总部位于巴黎的前沿 AI 研究公司，由图灵奖得主 Yann LeCun（执行董事长）和连续创业者 Alexandre
    LeBrun（CEO）于 2025 年底共同创立。公司正在基于 LeCun 的 Joint Embedding Predictive Architecture（JEPA）开发世界模型——这是一种非生成式架构，不在像素或 token
    空间预测未来世界状态，而是在抽象表征空间中预测，目标是带来持久记忆、规划能力和可控性。目标应用领域包括工业流程控制、医疗诊断、临床工作流、机器人和可穿戴设备。AMI 在四个枢纽运营：巴黎、纽约、蒙特利尔和新加坡。公司于 2026 年
    3 月以 $3.5B 投前估值完成 $1.03B 种子轮，并将资金投向算力和人才，而非短期收入。截至运行日，公司尚未发布产品，也未产生商业收入。
