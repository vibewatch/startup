  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界——物理世界 AI 基础设施
        blocks:
          - type: paragraph
            body: >
              AMI Labs 位于一个尚无标准分析师定义市场的基础层：物理世界 AI 基础设施，也被称作具身智能、物理 AI，或基于世界模型的 AI。这个市场的核心特征，是要求 AI
              系统能在连续、嘈杂、高维的真实环境中理解、预测并行动——工业厂房、临床场景、机器人系统和可穿戴设备——而不是处理离散文本或语言 token。


              LeCun 明确用 Moravec Paradox 来界定市场边界：对人类来说轻而易举的事情（感知、导航、物理操控），对当前 AI 仍然难以计算。大型语言模型在架构上受限于离散 token
              序列，无法可靠预测物理行动后果，也无法在多步操作序列中维持一致的世界状态表征。在 2026 年 1 月接受 MIT Technology Review 采访时，LeCun
              点出了四个具体应用领域：工业流程控制（喷气发动机、钢厂、化工厂）、工厂自动化和机器人、医疗诊断与临床工作流，以及智能或可穿戴设备。


              AMI 公司网站、Cathay Innovation 的投资者沟通，以及媒体报道，都持续确认这四个细分市场就是公司声明的市场边界。NVIDIA 也把 “Physical AI”
              并行定位成一个独立基础设施类别——投资 Isaac 仿真、Cosmos 世界模型训练和机器人推理基础设施——这从外部佐证了该市场边界的连贯性，也说明资本密集型玩家认可这一类别。


              AMI 核心市场不包括：纯文本和以语言为中心的应用（LLM、聊天机器人、文档摘要）、生成式图像和视频创作（扩散模型），以及基于结构化表格数据的传统 ML 分类。边界不是地理性的：AMI
              的巴黎总部和多枢纽结构（纽约、蒙特利尔、新加坡），叠加欧洲和亚洲投资方联盟，传递的是全球市场野心，并对欧洲 AI 主权要求特别敏感。


              AMI 目标技术的现状替代品包括传统 SCADA 和 PLC 工业控制系统、基于规则的临床决策支持软件、基于遥操作的机器人系统、专用计算机视觉模型，以及把行动规划外挂到语言模型上的 LLM agent
              框架。每类替代品在可泛化物理推理上都有记录在案的限制——世界模型正是为弥合这一缺口而设计。Moravec Paradox 框架是 LeCun
              自己的解释镜头，代表公司声称的市场逻辑，而不是独立验证过的市场边界研究。
