      - number: '5.4'
        title: 安全、可控性与监管路径
        blocks:
          - type: paragraph
            body: >
              AMI Labs 把安全和可控性放在架构层，而不是事后 guardrail。非生成式 JEPA 方法旨在从结构上消除幻觉：因为预测器在抽象表征空间工作，并丢弃不可预测的像素级细节，它不能像 LLM token
              sampler 那样编造具体事实内容。AMI 官网写道：“Action-conditioned world models 让 agentic systems 能预测自身行动的后果，并在 safety
              guardrails 约束下规划完成任务的行动序列。” Nabla 合作公告强化了这一框架：世界模型支持“确定性、可审计决策”和“基于模拟的推理与‘假设’分析”——这些属性是任何自主临床 AI 提交 FDA
              监管申请的核心。Nabla 的既定目标，是成为首个用 AMI 技术把可获 FDA 认证的 agentic AI systems 带入医疗的公司。但截至 2026 年 6
              月，还没有监管申报，没有获得安全认证，也没有公开呈现针对世界模型系统的正式安全评估。架构安全论证——非生成式等于无幻觉——尚未被独立验证，也未在临床场景中与 LLM 错误率做 benchmark。AI Snake
              Oil / AI as Normal Technology 的批评者质疑，学术 JEPA 演示与生产级临床 AI
