        - 高
        - AMI 是否拥有超出 JEPA 架构本身的 IP？训练数据筛选、领域适配或安全评估里是否有商业秘密？
      - - LeCun 品牌与人才吸引力
        - 关键人物风险：单一创始人的信誉支撑投资人与合作伙伴信心
