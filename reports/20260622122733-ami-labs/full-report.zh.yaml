      - number: '2.3'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              AMI 的授权模式意味着，公司的直接买家是构建或部署 AI 赋能系统的企业，而不是这些系统的终端用户。这种 B2B 基础设施动态形成两层市场结构：AMI
              必须同时赢得系统构建者的技术信任，以及运营导向企业买家的商业采纳。


              工业自动化（到 2030 年最大的可触达细分）：买家是化工、汽车、能源和航空航天等大型工业企业的制造 CTO、工厂运营总监和自动化工程师。付款方是资本开支预算，周期为每 3–5
              年。采纳由劳动力成本上升、工厂现代化计划，以及中国制造商机器人密度优势加速带来的竞争压力共同触发。IFR 数据确认，2025 年美国机器人安装量增长 11%，达到 38,000 台，其中食品行业采纳激增
              30%——说明自动化需求正在从传统汽车行业向外扩散。2024 年中国年度安装量约 295,000 台（全球份额 54%），进一步加大西方制造商加速 AI 赋能自动化的竞争压力。


              医疗（考虑 Nabla 合作，近期信号最强）：买家是医疗系统 CIO 和临床信息学团队。付款方是医院运营预算，并最终取决于医保报销框架。Forbes 报道称，LeBrun 特别提到当前 AI
              在临床场景的限制，将其作为 AMI 的切入点——世界模型能够提供比 LLM 更安全、更可靠的临床决策支持。FDA 和 EMA 审批限制面向患者的应用；Nabla 合作看起来被定位为工作流工具（AI
              病历记录），而不是 FDA 监管的临床设备，这可能加快初始商业时间线。


              机器人 OEM（平台 / 渠道买家）：AMI 可以把世界模型 API 授权给机器人硬件制造商。Toyota Ventures 参与种子轮，传递了汽车和工业机器人兴趣。LeCun
              的明确表述是，当前机器人只适用于特定任务，无法泛化——这正是世界模型要填补的缺口。该细分的战略买家是机器人 OEM 的 AI / 软件 VP，拥有产品开发预算和多年硬件周期。LeCun
              承认，当前人形机器人通过遥操作训练，无法跨环境泛化——这一说法既描述了市场问题，也抬高了商业就绪速度的不确定性。


              可穿戴 / 设备 OEM（最长前置期）：Samsung 的战略投资显示，可穿戴设备和智能眼镜是潜在应用领域。LeCun 曾把能够 “观察你在做什么、识别你的动作，并预测你接下来要做什么”
              的智能眼镜描述为世界模型用例。预算归属消费电子 OEM 的 R&D 部门，硬件设计周期为 2–3 年。


              投资者构成提供了最清晰的分层信号：NVIDIA（物理 AI 基础设施）、Toyota
              Ventures（汽车和工业机器人）、Samsung（设备和可穿戴）、Temasek（亚太主权与企业资本）都是战略投资者，而不是财务投资者；每家都指向一个世界模型技术可能嵌入的细分市场。
