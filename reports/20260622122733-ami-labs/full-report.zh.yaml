      - number: '5.5'
        title: 竞争格局与执行缺口
        blocks:
          - type: paragraph
            body: >
              世界模型领域竞争激烈、资金充足，并在快速分化。NVIDIA Cosmos（CES 2025 发布）是已完全部署的生成式世界基础模型平台，基于 20 million 小时真实世界数据和 9 trillion
              tokens 训练，已被 1X、Agility Robotics、Waabi 等机器人和 AV 公司采用。DeepMind Genie 2（2024 年 12 月）是 action-controllable
              generative world model，可生成多样 3D 环境，用于训练 embodied agents。Physical Intelligence 在 2026 年 4 月推出 π0.7
              steerable robot foundation model。OpenAI 的 Sora 视频生成模型在 2026 年 4 月停用，说明生成式视频世界模型面对商业逆风，验证了 AMI
              的非生成式押注——但也说明，即便资金充足的生成式路线，也未能获得广泛商业采用。AMI 的具体执行缺口很实质：（1）AMI Labs 自身尚未公开发布任何产品或模型；（2）V-JEPA 仅限约 10
              秒视频片段，更长时域推理仍是开放研究问题；（3）action-conditioned planning module 只存在于 LeCun 2022 年论文的设计概念中；（4）截至 run date，尚无 AMI
              Labs 署名论文发表，仍依赖此前 Meta FAIR 论文；（5）没有公开分享任何把 AMI 方法与 NVIDIA Cosmos、Genie 2 或 Physical Intelligence
              在任一任务上比较的 benchmarks；（6）视觉之外的多模态传感器整合仍是愿景，未被展示；（7）技术许可模型需要大型工业伙伴愿意试点未经验证的研究阶段 AI，这可能限制早期签约速度。Epoch AI
              数据显示，frontier AI 训练算力每年增长 5×——意味着 AMI 必须持续扩张，才能与资源充足的 incumbents 竞争。公司 $1.03 billion 融资提供了可观
              runway，但商业可行性仍完全未经证明。
