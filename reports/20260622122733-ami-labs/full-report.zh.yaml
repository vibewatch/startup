      - number: '3.4'
        title: 具身 AI 与物理机器人：Physical Intelligence 和 Wayve
        blocks:
          - type: paragraph
            body: >
              尽管架构策略不同，Physical Intelligence（π）是商业野心上最接近 AMI 的物理世界 AI 类比对象。AMI 计划把世界模型作为基础设施授权给行业伙伴，Physical
              Intelligence 则构建并部署直接控制机器人硬件的 vision-language-action（VLA）模型。π0（2024 年 10
              月）是第一个使用八种不同机器人形态的跨形态数据训练的通用机器人策略，结合了互联网规模视觉语言预训练和机器人传感运动数据。π0.7（2026 年 4
              月）在泛化上实现跃迁：它通过组合多样训练数据中的技能，完成训练中从未见过的任务，实现组合式任务泛化，并能在差异很大的机器人形态间迁移而无需额外数据。Physical Intelligence
              已有活跃伙伴计划，并与机器人 OEM 建立具名商业关系——这是 AMI 尚未达到的商业牵引力基准。


              值得注意的是，π0.7 使用世界模型生成视觉子目标：给定语言命令后，一个轻量世界模型会生成下一子步骤应呈现的图像，再把它提供给策略模型。这种集成确认，即便机器人基础模型公司也开始把世界模型组件——AMI
              的核心产品方向——纳入流水线。它说明 AMI 既可能与 Physical Intelligence 竞争，也可能成为其下方的基础设施层。


              Wayve 位于自动驾驶垂直领域，采用它称为 AV2.0 的端到端具身 AI 路径：一个神经网络把原始传感器数据转化为驾驶命令，不依赖 HD 地图，也不依赖特定领域标注数据。Wayve
              的路径使用大规模自监督学习——与 AMI 的无监督世界模型论点有哲学血缘——但产品应用专注驾驶，Wayve 并不争夺 AMI 瞄准的工业或医疗市场。Wayve 总部在英国，投资方包括主要汽车 OEM 和科技公司。


              HuggingFace 的 LeRobot 开源框架值得一提，它是一股结构性力量：该框架提供硬件无关、Python 原生的机器人控制，配套 Hugging Face Hub 上的数据集和预训练策略，正在主动把物理
              AI 普及给开发者和研究者。随着时间推移，LeRobot 会削弱任何单家公司机器人基础模型的专有优势。
