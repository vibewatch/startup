      - number: '6.2'
        title: Nabla 作为首个设计伙伴：医疗入口
        blocks:
          - type: paragraph
            body: >
              Nabla 是 AMI 唯一公开点名的伙伴，也是公司最早的真实世界导向证据；但它不是商业收入证据。2025 年 12 月的新闻稿把该安排描述为“排他性战略合作”，Nabla 获得 AMI
              新兴世界模型技术的“首批访问权”。Nabla 的既定目标，是成为“第一家把可获 FDA 认证的 agentic AI systems 带入医疗的公司”——这一定位完全依赖 AMI
              成功构建可认证的世界模型技术，而结果还在多年之后。

              Nabla 的规模为 AMI 技术未来触达医疗市场提供了重要背景。截至 2026 年 6 月，Nabla 服务超过 190 家医疗组织和 150+ 个 health systems and provider
              groups，覆盖 35+ languages，超过 100,000 名临床医生使用其 ambient documentation platform。这些客户属于 Nabla，不属于 AMI。Nabla
              的临床部署没有收入流向 AMI；当前 AMI-Nabla 安排的性质是共同开发访问权，而非许可费。

              Nabla 合作带有显著结构性纽带：LeBrun 在成为 AMI CEO 前，是 Nabla 的联合创始人和 CEO；LeCun 自 Nabla 创立以来就是投资人和顾问。LeBrun 仍担任 Nabla 的
              Chairman and Chief AI Scientist。这种深层关系让 AMI 真正获得早期医疗买方需求和临床场景 LLM 局限的情报，但也意味着关系不是 arm's-length，不能作为独立商业
              proof point。

              关键是，Nabla 当前的 AI 系统完全基于 LLM。AMI 的世界模型技术仍处于研究阶段，没有 production-ready API 或产品。AMI 世界模型实际整合进 Nabla
              临床平台的时间线未披露；而医疗中自主 agentic AI 的 FDA 监管路径，远比现有 narrow diagnostic AI tools 的 510(k) 路径复杂且缓慢。
