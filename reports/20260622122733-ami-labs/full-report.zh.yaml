      - number: '5.3'
        title: 开放研究策略、开发者社区与 IP 差异化
        blocks:
          - type: paragraph
            body: >
              AMI Labs 已公开承诺开放论文和开源代码，把自己定位为研究社区建设者，而非封闭 incumbent。CEO LeBrun 明确表示“我们也会开源大量代码”，并称“开放时事情推进得更快”。I-JEPA
              代码库已经在 GitHub 的 facebookresearch（Meta repository）下公开，V-JEPA 则以 Creative Commons NonCommercial licence
              发布。AMI 维护一个 Medium blog，但渠道还处于早期。Yann LeCun 保留 NYU 教职，并继续指导博士和博士后研究，形成直接的学术到商业 pipeline。公司的差异化 IP
              论点有三根支柱：JEPA 架构族（表征空间中的非生成式世界建模）、带安全 guardrails 的 action-conditioned planning，以及超越纯视觉的多模态传感器数据处理。这不同于
              NVIDIA Cosmos——后者是生成式（diffusion 和 autoregressive），面向机器人和 AV 开发者生成模拟数据——也不同于 DeepMind Genie 2，后者同样是生成式，面向
              embodied agents 的训练环境。两者都没有直接处理 AMI 正在构建的 action-conditioned non-generative architecture。竞争者 SpAItial（面向
              3D Gaussian Splatting 的 Echo world model）、World Labs（spatial 3D world generation）和 Physical
              Intelligence（robot foundation models）都走生成式或窄机器人路线。AMI 的 JEPA 脉络由 LeCun 的 Turing Award 声望和已发表的 CVPR /
              开源记录锚定，提供了竞争者不易复制的可信 prior art 和学术合法性。
