  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              AMI Labs 2026 年 3 月种子轮按 $3.5 billion 投前估值定价，融资 $1.03 billion 后投后估值为 $4.53 billion。PitchBook
              确认这是欧洲有记录以来最大种子轮。交割时公司约有十几名员工，没有产品，且自己给出的时间线按年而非季度计算——这让估值几乎纯粹押注于科学可信度和战略期权价值， 而不是收入或近期现金流。

              最接近的结构性可比，是商业规模形成前就被定价的精英创始人前沿 AI 实验室。Fei-Fei Li 的 World Labs 于 2024 年 8 月以 $1 billion 估值融资 $230
              million；这在当时已被视为产品前融资中的大额交易；到 2026 年初，随着 Marble 3D 世界模型产品发布， World Labs 据称正讨论按 $5 billion 估值融资。Andreessen
              Horowitz 领投 World Labs Series A，并用一份宣言把空间智能定义为下一代 AI 前沿，这与 AMI 的 JEPA 定位形成直接智识平行。Mira Murati 的 Thinking
              Machines Lab 种子轮估值约 $12 billion， 体现市场给予前 OpenAI CTO 履历的溢价。DeepSeek 据称在 2026 年 6 月以 $50 billion-plus 估值融资
              $7.4 billion， 但 DeepSeek 已发布生产模型并产生可衡量使用量，与种子阶段的 AMI 截然不同。世界模型初创公司 Odyssey 在 2026 年 6 月 18 日当周完成 $310
              million 融资，Crunchbase 周度交易摘要将其列为当周领跑交易，说明到 2026 年中，资本仍在大规模流向世界模型子赛道。

              作为公开市场锚点，C3.ai 报告 2025 财年（截至 2025 年 4 月 30 日）总收入 $389.1 million，同比增长 25.3%，其中订阅收入 $327.6 million；这为判断 AI
              软件平台达到商业成熟时的样子提供了有用的 SaaS 可比，也提醒我们 AMI 当前研究阶段距离这种变现水平还有很长距离。 PitchBook 引述 NVIDIA 对 AI 初创公司的累计投资约 $53
              billion、覆盖 170 笔交易，这凸显战略资本涌入该领域的规模——也包括 NVIDIA 自己参与 AMI 这一轮。

              投资人给 AMI 定价的逻辑，与「主权 AI」溢价和人才稀缺溢价一致。AMI 的投资财团由 Cathay Innovation、Greycroft、Hiro Capital、 HV Capital 和 Bezos
              Expeditions 联合领投，NVIDIA、Samsung、Temasek、Toyota Ventures 等战略方参与，横跨美国、欧洲、亚洲主权资本和战略资本。 $3.5B 投前估值高于 World
              Labs 初始 $1B 估值，但明显低于 Thinking Machines Lab 的 $12B 种子轮；这说明市场对 AMI 更长技术周期、 以及押注 JEPA 架构而非 LLM
              邻近路径的特定风险，给出了校准后的折价。
