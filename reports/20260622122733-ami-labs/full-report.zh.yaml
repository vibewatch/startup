      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              AMI 的财务位置结构简单，但执行不透明。公司持有约 $1.03 billion 种子资本，全部用于算力和人才；收入为零，且处于多年 pre-revenue 时间线。按保守 burn
              rate，资本充足性似乎可以支撑其声明的研究任务；若每年 burn 为 $150–200M，$1.03B 种子资金大约能让 AMI 在需要 Series A 之前支撑五到七年。但如果第 2–3
              年算力需求像可比实验室从小规模研究扩张到大训练一样加速，资金续航可能迅速压缩。


              没有收入，因此 revenue quality
              无法评级。利润率路径完全停留在理论上（许可模型意味着高毛利，但还没有可定价产品）。按研究实验室标准，资本强度很高：算力和人才两个成本中心规模相近，研究阶段没有收入抵消。融资依赖是完全的：未来至少 3–5
              年，AMI 离不开外部资本。


              两个最重大的财务风险是：（1）如果训练需要扩张到高于初始预测的规模，burn 会加速，可能缩短 runway，并迫使公司在不如超额认购种子轮有利的条件下融资 Series A；（2）time-to-revenue
              风险，即世界模型研究周期长于预期，迫使公司以可能更低估值追加融资。第三个风险，是 AMI 的开源承诺与高价许可模型所需 IP
              保护之间的张力：开源服务研究社区，也可能吸引人才和伙伴，但会削弱高价许可的可执行性。Goldman Sachs 和 Sequoia 都系统性追问过，AI 基础设施投资能否在 venture timeline
              内产生回本。


              Futurum Group 指出，AMI 的 Series A 将是研究产出能否转化为商业可信度的 “the first real market test”。尚未完成的关键财务尽调事项包括：（a）实际 cash
              burn rate 和 draw-down schedule；（b）与 NVIDIA 的任何 in-kind compute 安排；（c）Nabla 合作的商业条款；（d）headcount ramp plan
              和总薪酬预算；（e）Series A 时间线和估值目标；（f）AMI 的具体算力架构要求——frontier scale 的 JEPA 训练成本远低于 frontier LLM，但精确数量级仍是私密信息。
