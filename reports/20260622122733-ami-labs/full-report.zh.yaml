      - number: '1.4'
        title: 融资、估值与投资方联盟
        blocks:
          - type: paragraph
            body: >
              2026 年 3 月 10 日，AMI Labs 宣布完成 $1.03B 美元（约 €890M）种子轮，投前估值 $3.5B。多家媒体引用的 PitchBook
              数据确认，这是欧洲有记录以来最大种子轮。该轮融资显著超过 Financial Times 在 2025 年 12 月报道的 €500M 初始目标。


              本轮由五家投资方共同领投：Cathay Innovation（曾在 Nabla 支持 LeBrun）、Greycroft、Hiro Capital、HV Capital，以及 Jeff Bezos 的 Bezos
              Expeditions。战略投资者包括 NVIDIA（显示 GPU 基础设施协同）、Toyota Ventures（工业 / 汽车应用）、Temasek（新加坡枢纽和主权财富）、Samsung（设备 /
              消费电子）和 Sea。法国机构支持者包括 Bpifrance Digital Venture、Association Familiale Mulliez、Groupe Industriel Marcel
              Dassault 和 Publicis Groupe。知名天使投资人包括 Eric Schmidt、Mark Cuban、Jim Breyer、Tim 和 Rosemary Berners-Lee、Xavier
              Niel 以及 Mark Leslie。


              LeBrun
              明确表示，这笔资金投向两个成本中心：算力和人才，而不是收入生成。公司将在四个地点招聘时优先质量，而非数量。战略投资方构成（NVIDIA、Toyota、Samsung、Temasek）反映了公司有意押注工业和主权
              AI 市场；这些市场里的政府和企业买家正在寻找非美国 hyperscaler 的 AI 替代方案。
