      - number: '8.3'
        title: 情景分析：牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >-
              三种情景主要区别在三个变量：JEPA 商业可用性的推进速度、Big Labs 的竞争反应、以及能否以不低于 $3.5B 投前底价拿到后续资本。 三种情景都假设 AMI 需要 $1.03B
              种子轮之外的追加资本；原因是同类实验室在前沿规模下每年算力和人才 burn 估计为 $300–500M， 而 Epoch AI 记录的算力每年 4–5× 增长，会让任何固定算力预算在多年研究周期内不够用。

              牛市情景下，JEPA 到 2028 年实现可展示的真实世界 benchmark，例如在工业过程控制或自主机器人中，相比多模态 LLM 形成可复现优势； AMI 随后按 $10–15 billion 估值完成
              Series A。与两家或更多产业投资人（Toyota Ventures、Samsung、NVIDIA）的战略合作在 2029–2030 年转化为已部署用例。IPO 在 2031–2033
              年具备可行性，前提是收入达到 $200M+ ARR；这意味着 20–25× 收入倍数， 与 2025–2026 年前沿 AI 公司群体的高端溢价一致。

              基准情景下，AMI 用 2–3 年产出高质量开放研究，以基本持平到小幅上修的估值（$5–8B）融资 $500M– $1B Series A， 并把应用焦点收窄到一两个能证明早期客户防御性的垂直领域。商业产品在
              2029–2031 年到来。退出最可能通过 hyperscaler 以 $8–15 billion 战略收购实现——若届时公司拥有独特架构、主权叙事一致的投资人基础，并以 50–100 名员工做到 $40–60M
              ARR， 这一结果具备可信度。

              熊市情景下，JEPA 架构赌注在实践中没有形成差异化：Big Labs 发布有竞争力的世界模型系统，开源替代品扩散，企业买家看不到购买理由。 到 2028 年，资本市场对收入前 AI 研究收紧。AMI
              难以按种子轮估值融资，被迫大幅收窄范围、接受会稀释主权叙事架构的战略投资， 或以困境条件出售。$1–2 billion 困境退出或关闭，是不利结果。
