      - number: '6.5'
        title: 扩张、集中度风险与证据缺口
        blocks:
          - type: paragraph
            body: >
              AMI 已披露的全部客户接触面，是单一非付费设计伙伴（Nabla），在当前阶段形成极端集中度风险。由于没有商业收入，传统集中度指标（top-customer share of
              ARR、NRR、GRR）均未定义。真正有意义的集中度风险是结构性的：如果 Nabla 合作未能产出可运行的世界模型整合，AMI 就失去唯一真实世界医疗反馈回路。如果 Nabla 的 FDA 认证之路停滞——考虑到
              agentic clinical AI 的新颖性，这在结构上很可能发生——医疗垂直入口会无限期推迟。

              融资本身也制造扩张压力：投资者以 $3.5 billion 投前估值为一家研究阶段实验室付费，下一轮融资时就会期待商业 traction 证据。LeBrun “years, not quarters”
              的表述诚实，但会在 Series A 时制造困难动态；Series A 很可能在种子轮交割后 18–24 个月到来（约 2027 年中到 2027 年底）。到那时，AMI
              至少需要证明：（a）可运行的世界模型架构和已发表 benchmarks；（b）至少一个活跃 design-partner pilot，能生成真实领域数据；（c）围绕 Nabla 或另一家医疗伙伴的可信
              regulatory filing strategy。

              AMI 设想的 land-and-expand model——把世界模型技术许可给一个垂直领域或伙伴，再扩展到相邻买方——需要一个成功的首个锚点。如果任何 AMI 世界模型技术整合进 Nabla，Nabla 的
              190+ health organization 部署足迹会提供真实广度，但目前这仍是假设。工业和机器人垂直领域则没有已点名锚点。

              无法报告 customer count、ARR、NRR 或 GRR；由于 pre-revenue 状态，这些指标都未定义。本章无法区分 “zero customers” 与 “undisclosed early
              customers”，因为 AMI 没有提交需要披露收入的 Form D 或 SEC disclosure，全部商业状态证据都来自管理层公开表态。
