  - id: FV001
    title: 推荐逻辑链：从证据到立场
    type: flow
    layout: standard
    summary: 决策链从 AMI 的证据画像出发，穿过风险和估值因素，落到最终的“Track”建议。
    data:
      nodes:
        - id: scientific-credibility
          label: 科学可信度：高（LeCun 图灵奖，JEPA 过往记录）
        - id: technology-risk
          label: 技术风险：高（JEPA 尚未在商业规模验证）
        - id: revenue-evidence
          label: 收入证据：无（产品前、收入前）
        - id: competitor-threat
          label: 竞争威胁：高（Meta、Google DeepMind 正向世界模型收敛）
        - id: valuation-anchor
          label: 估值：偏高（$3.5B 投前，无收入）
        - id: sovereign-premium
          label: 主权 AI 溢价：存在（欧洲定位、Bpifrance、多大洲财团）
        - id: risk-rating
          label: 风险评级：高
        - id: recommendation
          label: 建议：TRACK — 关注 JEPA 基准和 Series A，作为上调入场评级的依据
      edges:
        - from: scientific-credibility
          to: risk-rating
        - from: technology-risk
          to: risk-rating
        - from: revenue-evidence
