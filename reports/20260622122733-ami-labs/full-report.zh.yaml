chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Advanced Machine Intelligence Labs——以 AMI Labs 名义运营——是一家在法国巴黎注册并设总部的前沿 AI 研究公司。自 2025
              年底成立以来，公司就在四个国际枢纽运营：巴黎（总部）、纽约、蒙特利尔和新加坡。巴黎地址把 AMI 锚定在法国日渐成形的 AI 生态中，与 Mistral AI 和 Meta 的 FAIR 实验室并列；LeCun
              表示，这一选择反映了他的判断：前沿 AI 不应只是美国或中国的事业。


              AMI 的全名 Advanced Machine Intelligence 直接写出了野心：构建超越以语言为中心的模型、能直接理解物理世界的 AI
              系统。公司当前处于收入前研究阶段；没有商业产品，也没有近期产生收入的计划。未来启动变现时，AMI
              打算向行业伙伴授权世界模型技术，而不是直接销售消费者或企业软件。公司公开承诺发布开源代码和开放学术论文，把自己定位为服务更广泛社区的研究平台。法国总统 Emmanuel Macron 公开欢迎 AMI
              将总部设在巴黎，并称其为法国 AI 的里程碑。
