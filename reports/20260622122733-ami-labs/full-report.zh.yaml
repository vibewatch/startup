  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本结构与轮次机制
        blocks:
          - type: paragraph
            body: >
              AMI Labs 在 2026 年 3 月 10 日宣布完成 $1.03 billion USD（约 €890 million）种子轮融资。该轮按 $3.5 billion 投前估值定价，隐含投后估值约
              $4.53 billion。PitchBook 确认这是欧洲有记录以来最大的一笔种子轮。AMI 直到 2025 年 12 月前后最初还在寻求约 €500
              million；最终交割金额接近目标两倍，说明投资团获得超额认购。


              本轮由五家 venture investors 共同领投：Cathay Innovation、Greycroft、Hiro Capital、HV Capital 和 Bezos
              Expeditions。战略企业投资者包括 NVIDIA、Samsung、Temasek、Toyota Ventures 和 Sea。法国机构和产业支持方包括 Association Familiale
              Mulliez、Groupe Industriel Marcel Dassault、Publicis Groupe 和 Bpifrance Digital Venture。知名天使包括 Eric
              Schmidt、Mark Cuban、Jim Breyer、Tim and Rosemary Berners-Lee、Xavier Niel 和 Mark Leslie。


              2026 年 4 月 3 日提交给 US Securities and Exchange Commission 的 Form D 显示，美国投资载体 “Advanced Machine Intelligence
              I, L.P.” 和 “Advanced Machine Intelligence II, L.P.”——由旧金山的 Model I, L.P. 管理——合计募集约 $16.9 million，用于投资
              AMI。这种结构符合把小额美国 LP 份额汇入更大国际投资团的安排。AMI 本身是一家法国私营公司，没有公开财务申报或资产负债表披露。


              战略投资者的逻辑看起来分成两条线：财务
              VC（Cathay、Greycroft、Hiro、HV）接受了多年研究时间线，并以高于同阶段创业公司的溢价定价；企业战略方（NVIDIA、Samsung、Toyota、Temasek）则可能获得世界模型研究的早期接触权，这些研究与其算力、半导体、汽车和主权
              AI 优先事项相关。超额认购说明两类投资者都认为，考虑到 LeCun 的技术信誉和世界模型叙事，$3.5B 投前估值是合理价格。
