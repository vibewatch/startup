      - number: '1.2'
        title: 技术愿景——世界模型与 JEPA
        blocks:
          - type: paragraph
            body: >
              AMI Labs 的整个技术论点建立在 LeCun 的 Joint Embedding Predictive Architecture（JEPA）之上。JEPA 最早出现在 2022
              年一篇立场论文中，随后通过包括 I-JEPA（2023）在内的论文继续完善。JEPA 的核心洞察是：生成式方法在高维像素或 token 空间中预测世界未来状态，但物理世界 AI
              必须处理连续、嘈杂、高维的传感器数据，这种路径从根上不适配。JEPA 转而训练模型在抽象表征空间中预测：学习世界如何变化的关键因素，而不是试图重建表面外观。


              AMI 正在开发行动条件世界模型：系统预测智能体行动的后果，并在真实世界约束和安全护栏下规划多步行动序列。AMI 认为，这类世界模型会表现出持久记忆、推理和规划能力，以及可控性——这些特性是当前 LLM
              在结构上无法提供的。目标应用领域包括工业流程控制、工厂自动化、医疗诊断和临床工作流、机器人以及可穿戴设备。这些场景里，LLM 幻觉会带来真实成本，可靠性和可控性不能让步。Nabla 合作是 AMI
              的第一个商业联盟，专门用来在高风险临床环境中测试世界模型的可靠性。


              AMI 的论点还带有结构性经济含义：更小、特定领域的世界模型如果用相关传感器数据训练，应当比万亿参数 LLM 需要少得多的算力，从而有可能以当前基础设施成本的一小部分，把前沿 AI 部署到设备端或工业现场。
