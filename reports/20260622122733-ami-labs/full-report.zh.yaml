      - number: '4.4'
        title: 公开 traction 与财务数据缺口
        blocks:
          - type: paragraph
            body: >
              从公开来源看，AMI 的财务画像几乎不透明。它是一家法国私营公司（société par actions simplifiée），无义务公布账目，没有 SEC reporting，没有公开
              ARR，也没有披露收入。外部来源能观察到的唯一财务事实，是种子轮规模和估值；多家独立媒体和公司自有公告都确认了这些信息。美国投资载体 2026 年 4 月的 SEC Form D filing 显示，其合计募集约
              $16.9 million，为美国投资者 tranche 结构打开了一扇小窗口，但不涉及 AMI 内部财务。


              员工数数据稀少：Futurum Group 估计种子轮宣布时约 12 名员工。AMI 的 Ashby job board（2026 年 5 月归档）可访问，但只提供有限结构化数据。可信第三方没有发布
              LinkedIn 员工数、Glassdoor 薪资数据，或 AMI 员工的独立统计。考虑到 2026 年 3 月种子轮交割和 LeBrun 明确的招聘指令，当前员工数几乎肯定高于 12 人，但没有精确数字。


              与 NVIDIA（战略投资者）的算力访问条款未披露。NVIDIA 对 AI lab 的战略投资通常包括算力分配协议，这可能实质性抵消 AMI 的硬件支出。Samsung 和 Toyota
              合作也可能提供数据或硬件访问，而这些不反映在基于纯财务投资者得出的 burn-rate analogues 中。如果存在这些 in-kind 安排，AMI 的有效 runway 会长于仅按现金估算的结果。


              Nabla 合作条款未披露：AMI 是否从 Nabla 获得任何收入、in-kind 数据访问或医疗领域 expertise，以及时间线如何，都不得而知。LeBrun 将其描述为“对 AMI
              研究的早期访问”，不是商业许可，说明这段关系主要是 AMI 的数据和验证 pipeline，而非收入来源。
