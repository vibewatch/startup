      - number: '8.4'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              当前价格下建议立场是 TRACK；在上调前，应对具体过关里程碑继续 RESEARCH-MORE。估值立场是 STRETCHED：$3.5B 投前估值可以被解释为对 LeCun 科学项目和欧洲主权 AI
              定位的一份期权，但相对于公开可核验信息（无产品、无收入、除 Nabla 外无商业合作、无 JEPA benchmark 结果）， 其中计入了大量乐观预期。

              由于商业证据几乎完全缺席，且 JEPA 技术假设高度不确定，本建议的信心为 LOW。风险评级为 HIGH：研究优先的时间线、LeCun 关键人物集中（执行董事长而非全职 CEO）、 算力成本升级、Big Lab
              竞争压力交织在一起，形成难以对冲的风险。

              下方 KPI 评分框架概括了投委会在七个维度上的定位：市场、技术证明、竞争护城河、单位经济、风险组合、估值和证据质量。 在现有证据下，除市场机会外，没有任何维度得分高于「中等」。

              破题触发项（详见附录）包括：任何证据显示 JEPA 在 AMI 目标应用类型上无法跑赢多模态 LLM；Yann LeCun 不再担任执行董事长； 种子轮交割后 24 个月内未能以不低于 $5B 投前估值完成
              Series A；或 Nabla 合作关系解散且没有替代方。
            claimRefs:
