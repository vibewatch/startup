        - label: 传感器与原始输入
          detail: 摄像头、麦克风、生命体征监测器、激光雷达和其他连续传感器模态；硬件无关——AMI 不制造硬件
        - label: 上下文编码器（ViT 骨干）
          detail: Vision Transformer 将局部观测编码为高维潜在向量；通过自监督掩码在未标注数据上训练（I-JEPA / V-JEPA 方法）
        - label: JEPA 预测器 / 世界模型核心
          detail: 根据上下文编码预测抽象目标区域表征；在表征空间而非像素空间运行；非生成式——忽略不可预测细节；V-JEPA 已验证到约 10 s
        - label: 行动条件规划器（计划中）
          detail: 生成候选行动序列，通过世界模型模拟预测后果，在安全护栏约束下选择最优行动；仅为设计概念——尚未构建
        - label: 应用 API / 合作伙伴集成（计划中）
          detail: 授权接口把世界模型能力开放给医疗、工业、机器人、可穿戴设备合作伙伴；截至 2026 年 6 月没有公开 API；Nabla 试点是最早披露的路径
    approximationNotes: |
      架构根据 LeCun 2022 年立场论文、I-JEPA 和 V-JEPA 论文重建。未构建层标注为（计划中）。AMI 实际实现细节尚未公开。
