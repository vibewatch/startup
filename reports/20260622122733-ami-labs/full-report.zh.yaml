            body: >
              AMI Labs 短期内明确不是一家产品公司。公司官网和 CEO 表态确认，它是一家 pre-revenue 研究实验室，追求技术许可模型：开发世界模型，并提供给构建垂直应用的行业伙伴。Nabla
              是首个披露的伙伴；这家医疗 AI 公司由 Alexandre LeBrun 共同创办，如今 LeBrun 领导 AMI。2025 年 12 月宣布的 Nabla 合作，给予 Nabla 对 AMI
              新兴世界模型技术的优先且特权访问权，目标是为临床护理构建可获 FDA 认证的 agentic AI systems——具体是对音频、生命体征、影像等连续医疗信号进行确定性、可审计决策。医疗之外，AMI
              官网列出五个目标垂直领域：工业流程控制、自动化、可穿戴设备、机器人，以及兜底的“其他”。这些领域的共同点是安全关键：LLM 幻觉不可接受，可靠性、可控性和安全是一级要求。许可模型尚未披露类似 SaaS 或按
              token API 计费的机制；实际商业安排预计要等世界模型成熟到足以进入伙伴试点之后才会出现。CEO LeBrun
              明确表示，公司可能需要“数年”才能让世界模型从理论进入商业应用；早期伙伴参与会围绕真实世界数据和联合评估，而不是离散产品发布。
