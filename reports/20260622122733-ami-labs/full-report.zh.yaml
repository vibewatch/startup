      - number: '7.5'
        title: 地缘政治与主权风险
        blocks:
          - type: paragraph
            body: >
              AMI Labs 明确围绕地缘政治叙事搭建：成为有别于美国主导和中国主导模型的「第三条路径」欧洲主权 AI 替代方案。LeCun 在 MIT Technology Review 2026 年 1
              月访谈中阐述了这一愿景，称许多国家希望掌握 AI 主权控制权，而一家开源欧洲冠军会回应这种需求。 法国总统 Macron 也公开背书 AMI 的巴黎总部。这一叙事带来特定风险：公司的战略定位依赖 EU
              政治意愿、资本和监管友好度持续存在， 而这些条件都可能变化。

              美国对先进 AI 芯片的出口管制（由 BIS 依据 Export Administration Regulations 执行）形成结构性供应链风险：如果对 EU 实体的芯片出口限制收紧， 或 EU-US
              贸易关系恶化，AMI 的训练算力供给可能中断。多司法辖区运营（巴黎、纽约、蒙特利尔、新加坡）带来复杂监管敞口， GDPR 义务、美国数据本地化偏好和新加坡数据治理规则之间可能冲突。OECD AI
              Principles 与 EU AI Act 叠加，形成一张合规义务拼图， 一家尚未有收入的公司也必须穿过去。主权 AI 叙事还带来集中风险：如果 AMI 无法证明技术优势，或欧洲 AI 资金枯竭，
              叙事就会坍塌，公司也会失去主要战略差异化。
