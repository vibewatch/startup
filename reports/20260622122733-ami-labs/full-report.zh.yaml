              Yann LeCun 的图灵奖、12 年 FAIR 领导经历，以及 JEPA 架构源头身份，使 AMI 成为世界模型范式中事实上的思想权威。再加上 LeBrun 在 Nabla 和 Wit.ai 的 AI
