      - number: '8.5'
        title: 退出成熟度、尽调问题与融资可选性
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，AMI 尚未具备退出条件。IPO 至少需要已验证收入和可复制 go-to-market；两者都不存在。结合 Futurum 分析师评估、
              公司自己的公开表述，以及同类实验室先例（DeepMind 2014 年被 Google 收购，而非 IPO），近期到中期最可信的流动性路径是被 hyperscaler 战略收购， 最可能发生在 2029–2033
              年窗口。

              潜在收购方因战略契合而区分：Samsung 和 Toyota Ventures（现有投资人，设备 / 工业契合）、Apple（空间智能是 Vision Pro 和机器人战略核心）、 Microsoft（主权 AI
              计算基础设施），或由法国 / 欧洲国家冠军出手收购以保留主权维度。Meta 仍是自然的技术合作方，但鉴于 LeCun 离开时的摩擦， 作为收购方存在冲突。

              $1.03B 种子轮按前沿实验室 burn 率（$300–500M/年）估计可支撑 2–3 年 runway，这意味着 AMI 需要在 2027 年末或 2028 年回到市场融资 Series A。
              这一轮会成为真正的市场出清估值测试：研究产出能否支撑从 $3.5B 上调，还是倍数压缩。种子轮进入的投资人应把研究发表速度和 JEPA benchmark 结果， 作为 Series A 定价的主要领先指标。

              下方附录列出的尽调问题，是建议参与 Series A 共同投资前的最低证据标准。最关键的问题，是独立验证 JEPA 在标准化物理世界 benchmark 上相对 state-of-the-art 多模态 LLM
              的性能优势；截至 2026 年 6 月，公开资料无法回答这个问题。
            claimRefs:
              - CV030
