      - number: '8.2'
        title: 投资论点与反方论点
        blocks:
          - type: paragraph
            body: >-
              正向论点靠四根柱子支撑：科学可信度、架构差异化、战略可选性和主权溢价。LeCun 的 Turing Award 履历和十年执掌 Meta FAIR 的经历， 构成一个罕见、已大幅去风险的科学领导画像。JEPA
              在抽象表示空间做预测，而不是生成像素或 token 层级预测；这是一条可测试的差异化假设， 且已有公开研究记录。投资财团的战略构成——尤其是 NVIDIA、Temasek、Samsung、Toyota
              Ventures——表明具备长期规划周期的产业买家相信， 世界模型 AI 会在 AMI 的运营窗口内进入其供应链和产品。主权 AI 维度（欧洲总部、跨大陆投资人组合、Bpifrance 参与）让 AMI
              能接触公共资金流和受监管行业采购管道， 这些是仅在美国运营的同行拿不到的。

              反方论点同样有力。AMI CEO LeBrun 在发布时说得很清楚：这不是一家 6 个月内有收入的典型应用 AI 初创公司。公司会先做多年研究， 再进入商业化。Goldman Sachs 对 AI
              资本开支的分析估计，约 $1 trillion 的计划中 AI 基础设施投资迄今在收入或可衡量生产率收益上「little to show」。 Sequoia 更新后的分析把「$200B
              question」扩大为「$600B question」——也就是 AI 基础设施 CapEx 与支撑这些支出所需收入之间的缺口——但尚未给出答案。 如果这种资本开支到收入的结构性缺口是 LLM 邻近 AI
              的风险，那么世界模型的风险更重，因为它还多了一层架构赌注：JEPA 路线必须在 AMI 目标应用垂直领域跑赢多模态 LLM，而且要赶在那些资源多 AMI 数个数量级的 Big Labs 收敛到类似架构之前。

              CB Insights 2026 年 AI 100 显示，能建立持久业务的垂直 AI 公司，护城河来自数据——要么是非文本数据、稀缺数据，要么深度嵌入受监管工作流的数据。 AMI
              设想的垂直领域（制造、医疗、机器人）符合这一论点，但 AMI 还没有这些数据、工作流或客户。从研究实验室走到拥有数据护城河的企业级在位者， 路很长，历史上通常需要 hyperscaler 赞助者或非常长的
              runway。
