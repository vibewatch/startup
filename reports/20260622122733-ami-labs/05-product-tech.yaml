  - id: product-definition
    title: Product Definition, Use Cases, and Licensing Model
    body: >
      AMI Labs is explicitly not a product company in the near term. The company's official
      website and CEO statements confirm it is a pre-revenue research lab pursuing a
      technology-licensing model: it will develop world models and make them available to
      industry partners who build vertical applications. Nabla, the healthcare AI company whose
      co-founder Alexandre LeBrun now leads AMI, is the first disclosed partner. The Nabla
      partnership announced December 2025 grants Nabla first and privileged access to AMI's
      emerging world model technologies with the goal of building FDA-certifiable agentic AI
      systems for clinical care — specifically deterministic, auditable decision-making over
      continuous medical signals such as audio, vitals, and imaging. Beyond healthcare, AMI's
      homepage names five target verticals: industrial process control, automation, wearable
      devices, robotics, and a catch-all "beyond." These were chosen because they are
      safety-critical domains where LLM hallucinations are unacceptable and where reliability,
      controllability, and safety are first-class requirements. The licensing model has no
      analogue to SaaS or API-per-token pricing disclosed yet; actual commercial arrangements
      are expected only once the world model is mature enough for partner pilots. CEO LeBrun
      explicitly stated the company could take "years" before world models move from theory to
      commercial applications, and that early partner engagement will involve real-world data
      and joint evaluation rather than discrete product launches.
    claimRefs:
