callouts:
  - calloutType: risk
    title: No AMI-Branded Product or Published Research
    body: >
      As of June 2026, AMI Labs has shipped no product, API, or model under its own brand name.
      The company's technical credibility rests entirely on LeCun's Meta FAIR publications
      (I-JEPA, V-JEPA, the 2022 position paper) — research conducted before AMI's founding.
      Any investor or partner assuming near-term product revenue should note LeBrun's explicit
      statement that "it could take years" to reach commercial applications.
    claimRefs:
      - CE021
      - CE022
      - CE040

  - calloutType: strength
    title: Non-Generative Architecture as Structural Differentiator
    body: >
      AMI's JEPA-based approach is the only publicly described world model architecture that
      is inherently non-generative and operates in abstract representation space. OpenAI Sora's
      April 2026 discontinuation and the general commercial struggle of pixel-generative world
      models validate the AMI thesis that generative approaches are insufficient for
      safety-critical, sensor-rich physical environments. If the JEPA approach proves scalable
      and AMI successfully extends it to action-conditioned planning, it would own a
      distinctive and defensible technical position.
    claimRefs:
      - CE002
      - CE003
      - CE018
      - CE020

  - calloutType: insight
    title: Healthcare Is the Highest-Risk and Highest-Reward First Vertical
    body: >
      Healthcare is simultaneously AMI's most credible early market (via Nabla, LeBrun's
      domain expertise, and the clear LLM hallucination problem) and its most demanding
      (FDA-certification, HIPAA compliance, clinical validation). Success in healthcare would
      validate the entire AMI regulatory thesis and open industrial AI markets. Failure or
      delay in the Nabla pilot would leave AMI without a commercial anchor for multiple years.
    claimRefs:
      - CE015
      - CE016
      - CE023
      - CE032

