chapter:
  number: 5
  title: Product & Technology
  summary: >
    AMI Labs has no shipped product as of June 2026; it is a frontier AI research lab building
    world models grounded in Yann LeCun's Joint Embedding Predictive Architecture (JEPA) lineage —
    I-JEPA (2023), V-JEPA (2024) — and advancing toward action-conditioned planning. The technical
    thesis is non-generative prediction in abstract representation space, contrasting sharply with
    NVIDIA Cosmos and DeepMind Genie generative approaches. Healthcare is the first declared
    vertical via the Nabla exclusive partnership. Material execution gaps include the absence of
    any deployed model, the known V-JEPA temporal ceiling (~10 s), and no published AMI-authored
    benchmarks or external validation of the full agentic architecture.

sections:
  - id: jepa-foundations
    title: Technical Architecture and JEPA Lineage
    body: >
      AMI Labs' entire technical identity traces to the Joint Embedding Predictive Architecture
      (JEPA) that Yann LeCun outlined in his June 2022 position paper "A Path Towards Autonomous
      Machine Intelligence." The core insight is that a world model should predict in abstract
      representation space rather than in raw pixel or token space. This non-generative approach
      allows the system to deliberately ignore unpredictable details — leaf movement, surface
      noise, stochastic sensor artifacts — while retaining high-level semantic structure. The
      LeCun architecture proposes five interacting modules: a perceptor (multimodal sensory
      encoder), a world model (the JEPA predictor), an actor (action planner), a configurator
      (goal and policy setter), and dual memory systems (short-term and long-term episodic). No
      single module constitutes AMI's product; the full cognitive architecture is the stated
      destination. The JEPA lineage has two published instantiations. I-JEPA (CVPR 2023) trains
      a Vision Transformer to predict masked image regions in latent space using only unlabeled
      data; a ViT-Huge/14 is trained on ImageNet in under 72 hours on 16 A100 GPUs. V-JEPA
      (Meta, 2024) extends the approach to video: it masks large spatio-temporal regions and
      asks the predictor to fill them in the representation space, not in pixels. V-JEPA
      achieves 1.5× to 6× training and sample efficiency gains relative to prior video
      representation learning baselines, and excels at "frozen evaluation" — the encoder is
      pretrained once and stays frozen while lightweight probes handle downstream tasks. V-JEPA
      was released under a Creative Commons NonCommercial licence. AMI's planned next step is
      action-conditioned world models that can simulate consequences of proposed actions and
      select action sequences subject to safety guardrails — a capability not yet demonstrated
      publicly.
    claimRefs:
