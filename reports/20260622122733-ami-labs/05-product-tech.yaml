  - id: execution-gaps
    title: Competitive Landscape and Execution Gaps
    body: >
      The world model space is intensely competitive, well-funded, and diversifying rapidly.
      NVIDIA Cosmos (launched CES 2025) is a fully deployed generative world foundation model
      platform trained on 20 million hours of real-world data and 9 trillion tokens, already
      adopted by robotics and AV companies including 1X, Agility Robotics, and Waabi. DeepMind
      Genie 2 (December 2024) is an action-controllable generative world model that generates
      diverse 3D environments for training embodied agents. Physical Intelligence shipped its
      π0.7 steerable robot foundation model in April 2026. OpenAI's Sora video generation
      model was discontinued in April 2026, demonstrating that generative video world models
      face commercial headwinds that validate AMI's non-generative bet — but also showing that
      even a well-funded generative approach failed to achieve broad commercial uptake. AMI's
      specific execution gaps are material: (1) No product or model has been released publicly
      by AMI Labs itself; (2) V-JEPA is limited to video clips of approximately 10 seconds,
      and longer-horizon temporal reasoning remains an open research problem; (3) The action-
      conditioned planning module exists only as a design concept in LeCun's 2022 paper; (4)
      No AMI-authored research papers have been published under the AMI Labs banner as of the
      run date, relying on prior Meta FAIR publications; (5) No public benchmarks comparing
      AMI's approach to NVIDIA Cosmos, Genie 2, or Physical Intelligence on any task have been
      shared; (6) Multimodal sensor integration beyond vision is aspirational, not demonstrated;
      (7) The technology-licensing model requires large industrial partners willing to pilot
      unproven research-stage AI, which may limit early deal velocity. Epoch AI data shows
      frontier AI training compute growing at 5× per year — meaning AMI must continue scaling
      to remain competitive with well-resourced incumbents. The company's $1.03 billion funding
      provides significant runway but commercial viability remains entirely unproven.
