  - id: safety-controllability
    title: Safety, Controllability, and Regulatory Pathway
    body: >
      AMI Labs places safety and controllability at the architectural level, not as a post-hoc
      guardrail. The non-generative JEPA approach is designed to eliminate hallucinations
      structurally: because the predictor works in abstract representation space and discards
      unpredictable pixel-level details, it cannot fabricate specific factual content in the
      way that LLM token samplers do. The AMI website states: "Action-conditioned world models
      allow agentic systems to predict the consequences of their actions, and to plan action
      sequences to accomplish a task, subject to safety guardrails." The Nabla partnership
      announcement reinforces this framing: world models enable "deterministic, auditable
      decision-making" and "simulation-based reasoning and 'what-if' analysis" — properties
      central to any FDA regulatory submission for autonomous clinical AI. Nabla's stated goal
      is to become the first to bring FDA-certifiable agentic AI systems to healthcare using
      AMI's technology. However, as of June 2026, no regulatory filing has been made, no
      safety certification has been earned, and no formal safety evaluation has been publicly
      presented for the world model system. The architectural safety argument — non-generative
      equals hallucination-free — has not been independently validated or benchmarked against
      LLM error rates in clinical settings. AI Snake Oil / AI as Normal Technology critics
      have questioned whether the gap between academic JEPA demonstrations and production-grade
      clinical AI can be bridged without substantial domain-specific training data, regulatory
      engineering, and clinical validation that cannot be inferred from current public evidence.
    claimRefs:
