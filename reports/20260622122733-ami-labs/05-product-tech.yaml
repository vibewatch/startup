  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: action-conditioned-planning
      missingEvidence: >
        A published paper, preprint, or technical demo of AMI Labs' action-conditioned world
        model — distinguishing AMI's implementation from the LeCun 2022 design concept.
      whyItMatters: >
        The action-conditioned planning module is the core commercial differentiator. Without
        evidence it exists beyond the position paper, the entire agentic AI thesis is
        aspirational. Investors and partners cannot assess technical readiness.
      diligencePath: >
        Monitor AMI Labs arXiv submissions, GitHub repositories, and conference proceedings
        (NeurIPS, ICLR, CVPR) for any paper describing action-conditioned JEPA systems.
      relatedQuestionRefs:
        - QE008
        - QE024
    - type: private-evidence-only
      severity: material
      topic: nabla-partnership-progress
      missingEvidence: >
        Disclosed milestones, timeline, and clinical use cases for the Nabla pilot deployment
        of AMI's world models in healthcare environments.
      whyItMatters: >
        Nabla is AMI's only disclosed commercial partner. The absence of any progress update
        since December 2025 makes it impossible to assess whether the healthcare vertical
        is on track or stalled.
      diligencePath: >
        Request Nabla pilot status, prototype scope, and regulatory timeline in due diligence;
        monitor Nabla press releases for FDA pre-submission meeting announcements.
      relatedQuestionRefs:
        - QE010
        - QE014
        - QE025

    - type: missing-source
      severity: material
      topic: multimodal-sensor-integration
      missingEvidence: >
        Any published paper or demo showing JEPA or AMI's architecture applied to non-visual
        sensor modalities (audio, vitals, lidar, industrial telemetry).
      whyItMatters: >
        Industrial and healthcare verticals require processing non-visual continuous sensor
        data. V-JEPA is vision-only; the V-JEPA paper mentions audio as "obvious next step"
        but AMI has published no evidence of multimodal progress.
      diligencePath: >
        Track Meta FAIR and AMI preprints for multimodal JEPA variants; evaluate whether
        the technical team's background (Xie, Rabbat) includes multimodal fusion expertise.
      relatedQuestionRefs:
        - QE001
        - QE015
        - QE026

    - type: missing-source
      severity: material
      topic: ami-published-benchmarks
      missingEvidence: >
        Any head-to-head benchmark comparison between AMI's world model approach and NVIDIA
        Cosmos, DeepMind Genie 2, or Physical Intelligence on a common task.
      whyItMatters: >
        Without external benchmarks, the claim that AMI's non-generative approach is
        superior to generative alternatives cannot be independently verified. Investors
        are relying entirely on architectural argument, not empirical evidence.
      diligencePath: >
        Monitor arXiv, CVPR, NeurIPS, and ICLR for AMI-authored evaluation papers;
        request internal benchmark data from AMI in due diligence.
      relatedQuestionRefs:
        - QE019
        - QE022

    - type: missing-source
      severity: material
      topic: licensing-model-details
      missingEvidence: >
        Specific terms of AMI's technology-licensing model: what deliverables partners receive,
        pricing structure, integration support, exclusivity terms, and update cadence.
      whyItMatters: >
        Revenue model viability cannot be assessed without understanding licensing terms.
        The technology-licensing model requires industrial partners to pilot unproven
        research-stage AI, and without clarity on terms, deal velocity is unknowable.
      diligencePath: >
        Request AMI's partner term sheet or licensing framework in due diligence; review
        Nabla's disclosed commercial terms if available; benchmark against comparable
        AI platform licensing arrangements in healthcare and industrial markets.
      relatedQuestionRefs:
        - QE021

    - type: missing-source
      severity: material
      topic: compute-and-data-requirements
      missingEvidence: >
        Quantified compute and dataset scale required to pretrain and fine-tune an
        AMI-style JEPA world model for a new industry vertical application.
      whyItMatters: >
        Infrastructure cost drives partner adoption feasibility. If domain fine-tuning
        requires hundreds of GPU-years and petabytes of proprietary sensor data,
        AMI's licensing model becomes viable only for large enterprises.
      diligencePath: >
        Request AMI's training cost estimates from prior JEPA training runs; benchmark
        against published I-JEPA and V-JEPA compute requirements; model scaling
        using Epoch AI compute trend data.
      relatedQuestionRefs:
        - QE020

    - type: missing-source
      severity: material
      topic: fda-regulatory-pathway
      missingEvidence: >
        Any evidence of FDA pre-submission meetings, de novo requests, or 510(k) planning
        for Nabla's FDA-certifiable agentic AI system built on AMI's world models.
      whyItMatters: >
        "FDA-certifiable" is a high bar. Without regulatory pathway evidence, the healthcare
        strategy cannot be assessed for feasibility or timeline.
      diligencePath: >
        Review Nabla's FDA correspondence filings (via FOIA requests); track FDA public
        databases for de novo requests mentioning agentic clinical AI; interview Nabla CMO.
      relatedQuestionRefs:
        - QE010
        - QE023

    - type: enumeration-incomplete
      severity: minor
      topic: ami-developer-signal
      missingEvidence: >
        Star counts, contributor numbers, fork counts, and activity metrics for any
        AMI-branded open-source repositories (distinct from Meta FAIR's ijepa repo).
      whyItMatters: >
        Developer traction is a leading indicator of ecosystem momentum. AMI's
        community-building claim is unverifiable without AMI-branded repository metrics.
      diligencePath: >
        Monitor GitHub for new AMI Labs repositories and track star growth; evaluate the
        AMI Medium blog and any developer forums for community activity.
      relatedQuestionRefs:
