  - id: open-research-differentiation
    title: Open Research Strategy, Developer Community, and IP Differentiation
    body: >
      AMI Labs has committed publicly to open publications and open-source code, positioning
      itself as a research community builder rather than a closed incumbent. CEO LeBrun
      explicitly stated "We will also make a lot of code open source" and that "things move
      faster when they're open." The I-JEPA codebase is already publicly available on GitHub
      under facebookresearch (a Meta repository), and V-JEPA was released under a Creative
      Commons NonCommercial licence. AMI maintains a Medium blog presence, though the channel
      is nascent. Yann LeCun retains his NYU professorship and continues to supervise PhD and
      postdoctoral research, creating a direct academic-to-commercial pipeline. The company's
      differentiated IP thesis rests on three pillars: the JEPA architecture family (non-generative
      world modelling in representation space), action-conditioned planning with safety
      guardrails, and multimodal sensor data handling beyond vision alone. This contrasts with
      NVIDIA Cosmos — which is generative (diffusion and autoregressive) and targets simulation
      data generation for robotics and AV developers — and with DeepMind Genie 2, which is
      also generative and targets training environments for embodied agents. Neither competitor
      directly addresses the action-conditioned non-generative architecture that AMI is building.
      Competitor SpAItial (Echo world model for 3D Gaussian Splatting), World Labs (spatial
      3D world generation), and Physical Intelligence (robot foundation models) all take
      generative or narrow robotics approaches. AMI's JEPA lineage, anchored by LeCun's Turing
      Award stature and the published CVPR/open-source record, provides credible prior art and
      academic legitimacy that competitors cannot easily replicate.
