- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric / evidence
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue by source
    - Separates DOE reimbursements, engineering fees, and customer payments
    - Request audited revenue schedule and revenue-recognition memo
  - - Cash balance and monthly burn
    - Determines runway after Series D
    - Request cash, restricted cash, monthly opex, capex, and committed spend
  - - Backlog conversion and contract terms
    - Options can look like backlog but may not be financeable
    - Classify signed contracts, options, LOIs, cancellation rights, deposits, and conditions precedent
  - - Reactor ASP / EPC margin
    - Core driver of project revenue and risk transfer
    - Review EPC, technology license, warranty, LD, and escalation terms
  - - Fuel ASP and gross margin
    - Determines recurring revenue quality
    - Obtain TRISO-X cost model, HALEU contracts, reload pricing, utilization ramp
  - - DOE reimbursement mechanics
    - Budget cuts or delayed reimbursements could create funding gaps
    - Review cooperative agreement, draw schedule, allowable costs, matching-source plan
  - - Debt/project-finance commitments
    - Needed to move from design to financed plants
    - Request lender term sheets, tax-credit assumptions, sponsor-equity requirements
  - - CAC / sales-cycle proxies
    - Utility and industrial sales efficiency cannot be assessed from public sources
    - Obtain pipeline by stage, bid costs, cycle time, win/loss, customer concentration
  notes: Each row is a public-data gap; none can be closed from press releases alone.
