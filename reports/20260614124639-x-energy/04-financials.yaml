- id: unit-economics-and-project-finance
  title: Unit economics and project finance
  body: The relevant unit of analysis is not a software seat or even a single hardware shipment; it is a financed nuclear
    project. A four-pack Xe-100 configuration produces 320 MWe and can also deliver industrial steam, so project economics
    depend on construction cost per kilowatt, financing cost during construction, capacity factor, fuel cost, O&M, licensing
    schedule, contingency, and the customer’s value for reliable clean heat. X-energy’s materials point to modular fabrication,
    road-deliverable components, online refueling, and TRISO-X fuel as economic levers, but they do not quantify realized
    learning curves or gross margin. External benchmarks are therefore essential. Lazard and EIA support a diligence range
    for advanced-nuclear LCOE and capital cost, while a simple sensitivity shows that every $1,000/kW of overnight capex implies
    about $320 million for a 320 MWe four-pack before owner and financing costs. This is why small changes in FOAK capex,
    interest rates, or schedule delay can overwhelm reactor-level margin claims.
  claimRefs:
  - CI011
  - CI017
  - CI023
  - CI024
  - CI025
