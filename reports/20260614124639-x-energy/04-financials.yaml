- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / range
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Xe-100 module output
    - 80 MWe or 200 MW thermal; four-pack 320 MWe
    - High
    - Defines revenue and capex denominator
    - Confirm net output, auxiliary load, and capacity factor in customer model
  - - Illustrative LCOE benchmark
    - $65-$90/MWh advanced-nuclear diligence range
    - Medium
    - Sets market-clearing bar versus utility alternatives
    - Request X-energy project LCOE bridge by capex, fuel, O&M, WACC, schedule
  - - Four-pack capex sensitivity
    - $320M per $1,000/kW before owner/financing costs
    - Medium
    - Shows leverage of overnight-cost variance
    - Obtain EPC estimate, contingency, owner costs, IDC, and first-of-a-kind premium
  - - Illustrative four-pack overnight cost
    - $2.1B-$2.6B at $6,500-$8,000/kW
    - Medium
    - Frames project-finance scale per deployment
    - Validate vendor quote, construction schedule, and debt sizing
  - - TX-1 fuel capacity
    - About 700,000 pebbles/year, enough for 11 Xe-100 SMRs
    - High
    - Constrains recurring fuel revenue ramp
    - Get fuel yield, cost per pebble, qualification scrap, inventory working capital
  - - Fuel gross margin
    - Not disclosed
    - Low
    - Core recurring-margin driver
    - Request TRISO-X COGS, HALEU pass-through, reload ASP, and utilization curve
  - - Commercial reactor revenue
    - No operating Xe-100 commercial revenue visible
    - Medium
    - Determines current revenue quality
    - Review audited revenue by source and DOE reimbursement accounting
  notes: Ranges are estimates or external benchmarks unless marked high confidence; missing values require private diligence.
