- id: public-gaps-and-adverse-signals
  title: Public gaps and adverse signals
  body: 'The financial diligence blocker is disclosure, not lack of ambition. Public sources do not provide cash on hand,
    burn rate, runway, debt, restricted cash, committed capex by project, customer prepayments, backlog conversion probabilities,
    reactor ASP, EPC margin, fuel ASP, fuel gross margin, or service attach rates. For a project-financed nuclear company,
    these omissions are material because an attractive order book can still be uneconomic if FOAK capex, schedule, interest
    cost, or fuel-cycle working capital are worse than assumed. The failed Ares SPAC is the clearest adverse financing datapoint:
    the parties terminated the transaction in October 2023 amid challenging market conditions, and SPACInsider reported valuation
    resets before liquidation. That event does not prove technical failure, but it does show public-market financing sensitivity.
    The correct verdict is research-more: X-energy has credible strategic demand and unusually deep financing support, yet
    investors need private budgets, signed commercial terms, DOE reimbursement mechanics, project-finance commitments, and
    unit-cost evidence before underwriting revenue or margin.'
