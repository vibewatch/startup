- id: capital-adequacy-and-dependency
  title: Capital adequacy and financing dependency
  body: 'The financing story is strong by private nuclear-startup standards but still dependency-heavy. X-energy closed an
    approximately $700 million Series D in November 2025 after a $500 million Amazon-anchored Series C-1 in 2024 and a $235
    million Series C in 2023; independent coverage reported about $1.8 billion raised to date. Those rounds are large enough
    to fund design, licensing, fuel-facility buildout, supply-chain expansion, and first-project support, but they are not
    equivalent to a fully financed reactor fleet. DOE ARDP materially lowers the burden through cost share and appropriations,
    including the initial $80 million award and later appropriations cited by X-energy, yet DOE support requires industry
    matching and remains exposed to appropriations, progress gates, and policy changes. The TX-1 facility illustrates the
    cash profile: site development, vertical construction, licensing, and production readiness happen before recurring fuel
    revenue. The next financing trigger is project conversion—licensed, customer-backed, bankable deployments with transparent
    EPC, fuel, O&M, and power/steam contract terms.'
