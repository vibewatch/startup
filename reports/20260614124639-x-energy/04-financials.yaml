  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross margin
    missingEvidence: Reactor, EPC, TRISO-X fuel, and lifecycle-service gross margin by revenue stream.
    whyItMatters: Margin quality determines whether the order book can support venture-scale returns after FOAK costs.
    diligencePath: Request product-line P&L, COGS bridge, HALEU pass-through terms, and project-margin waterfall.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash runway
    missingEvidence: Cash on hand, monthly burn, committed capex, restricted cash, debt facilities, and minimum cash covenants.
    whyItMatters: The Series D is large, but licensing, fuel facility, and project-support obligations can absorb capital
      before revenue.
    diligencePath: Review board budget, treasury report, capex plan, and 24-month runway model.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer contract economics
    missingEvidence: Signed contracts, options, termination rights, prepayments, PPA/steam prices, fuel ASPs, and backlog
      conversion probabilities.
    whyItMatters: Publicly reported GW and module counts are not equivalent to financeable revenue.
    diligencePath: Review executed customer agreements for Dow, Amazon, Energy Northwest, and Centrica with legal summaries.
