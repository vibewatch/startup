- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / contract item
  - Public evidence
  - List vs realized pricing
  - Unknowns
  - Source-backed implication
  rows:
  - - Reactor / project ASP
    - No public reactor sale price found
    - Undisclosed
    - FOAK discounting, escalation clauses, EPC margin, warranty exposure
    - Cannot underwrite revenue per module from public data
  - - Power / steam price
    - Dow and Amazon deployments describe output but not tariffs
    - Undisclosed
    - PPA or steam contract price, indexation, capacity payments
    - Customer value proposition is visible; monetization is not
  - - DOE cost share
    - ARDP is cost-shared with industry and up to 50% for project/fuel facility work
    - Reimbursement / cost-share, not commercial price
    - Allowable costs, timing, budget caps, match requirements
    - Improves capital adequacy but creates government-funding dependency
  - - TRISO-X fuel price
    - Fuel technology and facility capacity disclosed; no price disclosed
    - Undisclosed
    - Fuel ASP, reload cadence, HALEU pass-through, gross margin
    - Recurring revenue thesis is plausible but unpriced
  - - Engineering/services/licensing
    - Use-of-funds and deployment-platform language indicates services work
    - Custom / undisclosed
    - Scope, service attach, IP royalty, cancellation rights
    - Potential margin support but needs contract review
  notes: Pricing table deliberately separates monetization logic from realized terms because public sources do not disclose
    contract economics.
