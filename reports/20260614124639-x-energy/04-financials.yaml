tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value/status
  - Revenue quality
  - Diligence ask
  rows:
  - - DOE ARDP reimbursement
    - Cost-shared public funding for demonstration work
    - Milestone / reimbursable project cost
    - Initial $80M award plus larger appropriations; subject to DOE and budget gates
    - Non-dilutive but conditional
    - Obtain cooperative-agreement budget, reimbursement timing, match obligations
  - - Xe-100 reactor project delivery
    - Design, licensing, EPC support, and technology delivery into customer projects
    - Four-pack / site / module
    - Dow Seadrift and Energy Northwest pathways not yet operating
    - Future project revenue; not current recurring revenue
    - Review signed EPC scope, milestone payments, warranties, LDs, and revenue recognition
  - - TRISO-X fuel supply
    - Proprietary HALEU TRISO fuel for Xe-100 fleet
    - Fuel pebbles / kgU / reload cycle
    - TX-1 under construction/licensing; planned 700,000 pebbles/year
    - Strategically recurring but pre-scale
    - Get fuel ASP, reload schedule, margin, inventory and HALEU supply terms
  - - Lifecycle services and licensing
    - Engineering, maintenance, fuel services, IP or deployment support
    - Service contract / license / O&M scope
    - Referenced in strategy but not priced publicly
    - Potential high-margin tail; unproven
    - Request master services terms and attach-rate assumptions
  - - Strategic deployment options
    - Amazon/Centrica/Energy Northwest options and partnerships
    - GW or module option
    - More than 5 GW U.S. option with Amazon; 11 GW/144-SMR order-book reports
    - Demand signal, not booked revenue
    - Separate binding contracted backlog from options and MOUs
  notes: Public sources support mechanisms and status; no public source discloses realized revenue, ASP, or margin.
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
