- id: capability-and-packaging
  title: Capability and packaging comparison
  body: 'The public evidence does not support a precise price-per-MWh ranking; most SMR vendors sell negotiated projects rather
    than posted packages. A more useful comparison is capability packaging: unit size, heat temperature, fuel, licensing precedent,
    offtake validation and project-finance path. X-energy''s 80 MWe module and 320 MWe four-pack are smaller than Rolls-Royce''s
    larger LWR design but can address industrial heat at steam temperatures up to 565°C. TerraPower and Kairos can claim advanced-temperature
    or storage advantages, while GE Hitachi and Westinghouse stress familiar LWR lineage. Pricing diligence should treat every
    public ''deal'' as an offtake or development signal, not realized economics. Amazon-X-energy, Google-Kairos and Constellation-Microsoft/Meta
    each validate demand, but they also show that large buyers can multi-home across vendors and technologies. The chapter
    therefore treats unknown price cells as a diligence finding rather than filling them with speculative estimates. In nuclear
    projects, headline MW, vendor marketing and announced memoranda can be much less important than escalation clauses, completion
    guarantees, fuel-index exposure, interconnection rights and who bears delay risk.'
  claimRefs:
  - CP021
  - CP022
  - CP023
  - CP024
  - CP026
  - CP031
  - CP034
  - CP035
