- id: moat-durability
  title: Moat durability and risk register
  body: 'The moat is durable only where several advantages combine. High-temperature steam alone is a feature; high-temperature
    steam plus TRISO-X fuel integration, DOE ARDP support, Amazon-backed financing signals and industrial/customer partnerships
    is a more defensible bundle. Even then, the moat is exposed on three fronts. First, fuel supply is a shared bottleneck
    for many advanced reactors, so TRISO-X matters only if it reaches qualified, scalable production. Second, regulatory and
    construction readiness currently favors incumbents with operating fleets, utility brownfield sites, or LWR reference designs.
    Third, hyperscaler clean-electricity demand is commoditizing: Microsoft, Google, Meta and Amazon can sign with multiple
    nuclear suppliers. Adverse evidence from NuScale''s cancelled CFPP and USNC''s Chapter 11 shows that credible technology
    can still fail the financing and customer-commitment test. The adverse cases should be read as base-rate evidence, not
    as one-for-one analogues. NuScale, USNC and Oklo have different designs and sponsors, but they show recurring failure
    modes around licensing sequence, customer commitment, capital intensity and the gap between technical milestones and financeable
    commercial deployment.'
  claimRefs:
  - CP003
  - CP006
  - CP017
  - CP025
  - CP027
  - CP028
  - CP033
  - CP037
  - CP038
  - CP039
