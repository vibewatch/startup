- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - 565°C industrial steam
    - LWR SMRs and incumbent PPAs satisfy electricity-only buyers
    - Medium
    - Steam is valuable only when buyer needs process heat
    - Require site-specific steam integration and avoided-fuel economics
  - - TRISO-X vertical fuel integration
    - HALEU supply and fuel qualification bottlenecks
    - High
    - Fuel can be moat or schedule blocker
    - Verify TRISO-X capacity, qualification, HALEU contracts and contingency supply
  - - Amazon hyperscaler validation
    - Google-Kairos and incumbent Microsoft/Meta deals prove multi-homing
    - High
    - Hyperscaler demand is not exclusive to X-energy
    - Confirm binding offtake, exclusivity and project-finance terms
  - - DOE ARDP support
    - DOE support also backs other advanced-reactor paths
    - Medium
    - Policy sponsorship is not unique
    - Compare remaining cost-share, milestones and termination rights
  - - Advanced HTGR safety narrative
    - Regulators and utilities may prefer familiar LWR designs
    - Medium
    - Licensing familiarity can beat technical novelty
    - Benchmark NRC/CNSC milestones against BWRX/AP300/SMR-300
  - - FOAK commercialization
    - NuScale cancellation and USNC distress
    - High
    - Evidence that SMR demand can evaporate under cost and funding stress
    - Stress-test capex, subscription levels, contingencies and sponsor depth
  - - Industrial buyer relationships
    - Incumbents can bundle power, grid services and balance-sheet support
    - Medium
    - Distribution power may sit with utilities and nuclear operators
    - Assess partner control, project-company governance and credit support
  - - Large-campus scale
    - Microreactors can cherry-pick smaller loads
    - Low-medium
    - X-energy may be over-scaled for some campuses
    - Segment pipeline by thermal/electric load size and site constraints
  notes: Severity is an evidence-backed diligence prioritization, not a probability-weighted risk model.
