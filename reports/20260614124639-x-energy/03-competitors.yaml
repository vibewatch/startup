  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing opacity
    missingEvidence: Comparable delivered $/MWh, EPC cost, fuel cost and escalation terms for X-energy and each named peer.
    whyItMatters: Without realized pricing, competitive risk cannot be converted into project returns or valuation support.
    diligencePath: Request redacted offtake term sheets, EPC estimates, fuel supply quotes and sensitivity cases from X-energy
      and project partners.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: licensing milestones
    missingEvidence: Current detailed NRC/CNSC milestone schedules by competitor and design beyond public overview pages.
    whyItMatters: Readiness scoring depends on regulator-specific path and accepted topical reports rather than marketing
      milestones.
    diligencePath: Obtain correspondence logs, accepted topical reports, pre-application meeting notes and licensing project
      plans from each vendor.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: competitor funding scale
    missingEvidence: Audited or cap-table-confirmed total funding for private competitors including Last Energy, Kairos and
      TerraPower.
    whyItMatters: Private funding claims are often stale or press-release based and can distort perceived staying power.
    diligencePath: Use data-room financing schedules, investor consents and project-company capitalization records to refresh
      competitor funding comparisons.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
