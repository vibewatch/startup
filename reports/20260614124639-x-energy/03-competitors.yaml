  - - Oklo
    - Public microreactor adjacent
    - 'Public NYSE: OKLO; SEC disclosure'
    - Aurora microreactor concept, smaller site loads
    - Data centers, industrial campuses, remote power
    - Microreactor and fuel-recycling narrative
    - Regulatory and scale fit differ from Xe-100
  - - Last Energy
    - Private micro-SMR adjacent
    - Private PWR-20 commercialization claims
    - PWR-20 small pressurized-water reactor
    - Smaller industrial/data-center loads
    - Standardized small nuclear plant packaging
