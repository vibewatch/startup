  - TP004
  figureRefs:
  - FP003
- id: diligence-verdict
  title: Diligence verdict on competitive positioning
  body: 'X-energy should not be underwritten as a generic SMR winner. The competitive thesis is narrower and more attractive:
    X-energy is a differentiated industrial-heat and large-campus clean-firm-power vendor if it converts TRISO-X, licensing,
    and first projects into bankable delivery. The buyer should test that thesis against specific alternatives, not against
    a broad nuclear TAM. For a data-center-only electricity buyer, Kairos, NuScale, Oklo, Constellation restarts, utility
    PPAs and even large nuclear supply can be credible alternatives. For a chemical, refining or industrial steam buyer, the
    peer set narrows because LWR SMRs and incumbent PPAs do not naturally deliver the same high-temperature steam package.
    The diligence focus should therefore be less on headline MW announcements and more on site-specific integration cost,
    fuel qualification, construction schedule, and whether Amazon/Dow-style commitments become financeable contracts.'
