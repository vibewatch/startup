              - CV031
              - CV032
              - CV033
      - number: '8.5'
        title: 情景估值、DCF 纪律与放弃标准
        blocks:
          - type: paragraph
            body: >-
              X-energy 的 DCF 必须按概率加权，并以里程碑设闸。确定性现金流会高估精确度，因为首批商业项目仍需要监管批准、建设执行、燃料爬坡、客户最终投资决策和融资结构。如果 Dow 许可明显滑期、Cascade
              仍停留在开工前、成本估计膨胀，或公开 SMR 倍数压缩，低于 $1.5 billion 的悲观情景并不过分。若 Series D 需求、Amazon/Dow/Cascade 里程碑以及 20
              个以上模块管线可信度延续，约 $2.5 billion 至 $4.0 billion 的基准情景可以辩护，但仍依赖未披露的烧钱速度和优先权条款。高于 $5.0 billion
              的乐观情景需要多个已融资项目，以及可持续的反应堆 / 燃料 / 服务利润率。IEEFA 和 UCS 的反向证据把反向逻辑说清楚：SMR
              可能太慢、太贵或太复杂，无法在基金期限内赚到风险投资式回报。最终尽调应优先查看投资条款清单、客户合同、NRC 时间表、FOAK 成本估计、现金消耗和清算优先权。
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV035
              - CV036
              - CV037
              - CV038
              - CV041
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
              - CV025
              - CV029
          - type: table
            tableRef: TV007
            claimRefs:
              - CV007
              - CV029
              - CV032
              - CV035
              - CV041
              - CV042
      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 估值立场
            body: 可以观察 X-energy，但在没有披露投后条款、有约束力客户经济性和 FOAK 成本证据之前，不应承销 $5B+ 入场价。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV041
              - CV042
          - type: callout
            title: 反向 SMR 批评很重要
            body: IEEFA 和 UCS 的批评不能证伪 X-energy，但在真实项目解决成本、进度、安全和废料担忧之前，它们足以支持高折现率。
            calloutType: risk
            claimRefs:
              - CV027
              - CV028
              - CV029
