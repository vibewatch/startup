      - number: '2.2'
        title: 规模测算视角与预测区间
        blocks:
          - type: paragraph
            body: >-
              最干净的自上而下视角来自 DOE：美国到 2050 年可能需要约 200 GW 额外先进核能，总核电规模从约 100 GW 扩至约 300 GW。这个视角对 X-energy 比全球 SMR
              收入报告的标题数字更有用，因为它捕捉项目资本和电力市场需求，而不只是供应商收入。分析师页面仍可帮助框定市场情绪：2026 年前后的 SMR 收入估计，从 Research and Markets 2026 年
              $0.99B，到 Fortune 2026 年 $6.13B，再到 Precedence 2035 年 $17.37B，Grand View 则显示到 2030 年较慢增长至
              $7.69B。这些估计不应相加；其口径看起来不一致。务实的规模栈是：TAM = 美国 200 GW 先进核能目标；SAM = 能通过许可与燃料约束的美国 SMR 和工艺热部署；SOM = X-energy
              已披露的 320 MW 首个项目，加上对 2039 年超过 5 GW 商业目标的概率加权份额。
