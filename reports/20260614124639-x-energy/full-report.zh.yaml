      - number: '3.4'
        title: 竞争定位尽调结论
        blocks:
          - type: paragraph
            body: >-
              不应把 X-energy 按通用 SMR 胜者来承销。更窄、也更有吸引力的竞争论点是：如果 X-energy 能把
              TRISO-X、许可和首批项目转化为可融资交付，它就是差异化的工业热和大型园区清洁稳定电力供应商。买方应把这个论点拿去对比具体替代方案，而不是对比宽泛核能
              TAM。对只买数据中心电力的客户，Kairos、NuScale、Oklo、Constellation 重启、公共事业 PPA，甚至大型核电供应都可能是可信替代。对化工、炼化或工业蒸汽买家，同业范围会收窄，因为
              LWR SMR 和既有 PPA 不天然提供相同高温蒸汽包。尽调重点因此不应是 headline MW 公告，而是特定场址集成成本、燃料合格、建设进度，以及 Amazon/Dow 式承诺能否变成可融资合同。
