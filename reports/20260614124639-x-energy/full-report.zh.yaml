            body: >-
              主要技术承销风险是一串依赖链：Xe-100 部署需要最终设计、建设许可证、场址集成、燃料合格、HALEU 原料、可运行的 TRISO-X 燃料厂、石墨和氦供应，以及有能力为核建设融资的已承诺客户。HALEU
              是最可见瓶颈，因为 DOE、ORNL 和独立核供应评论都描述了一个需求在大规模本土供应被证明前就已上升的市场。X-energy 自己的申报还补充，石墨和氦的供应商基础有限，俄罗斯或中国以外的 HALEU
              供应可能对其业务产生重大影响。UCS 的反向视角不是 Xe-100 不能工作，而是在证据被证明前，先进非轻水堆不应享有安全性预设。尽调因此应要求燃料合格收口包、HALEU
              分配证据、材料供应商承诺、独立可靠性建模和特定场址集成风险清单，再承销全规模部署。
