  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付产品与客户工作流
        blocks:
          - type: paragraph
            body: >-
              X-energy 销售的是核热与电力平台，不是软件服务，也不是单个工厂部件。交付产品围绕 Xe-100 反应堆模块展开，每台营销口径为 80 MWe 和 200 MWt，并配套 TRISO-X
              燃料和支持许可、建设、装料、运营与维护的生命周期服务层。在客户工作流中，Dow Long Mott
              这类工业场址会从购买或自供化石蒸汽和电网电力，转向托管一个受监管的核岛，由它供应电力和高温蒸汽。因此，产品承诺不只是无碳
              MWh，而是靠近负荷的稳定工业热，并用标准化模块从四台扩展到十二台。成熟度警示同样核心：X-energy 披露尚未向客户交付 Xe-100 或任何反应堆，所以当前部署证据是项目开发证据，而不是运营机队证据。
