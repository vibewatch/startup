        - 核电运营商 / 制造商可信度
        - 主要供电，不是 565°C 蒸汽
      - - GE Hitachi BWRX-300
        - 既有 LWR-SMR 厂商
        - OPG Darlington 参考路径
        - 300 MWe 沸水 SMR
        - 公用事业和受监管项目
        - 公用事业牵头的首个项目与 BWR 血统
        - 工业工艺热差异化较弱
