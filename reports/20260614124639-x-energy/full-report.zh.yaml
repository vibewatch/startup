            body: >-
              X-energy 的差异化在于把反应堆、自有球形燃料、燃料制造设施和部署服务垂直耦合。技术并非从零发明：S-1 把 HTGR 传承追溯到 Peach Bottom、Dragon 和中国；World Nuclear
              News 提供外部从业者报道，称中国 HTR-PM 双堆球床 HTGR 电站已达到满功率运行。这个传承重要，因为它降低了纯物理新颖性，但不消除 Xe-100 FOAK
              执行风险。中国拥有运行中的球床参考电站；X-energy 拥有美国监管互动、客户项目和本土燃料设施许可。因此，对这种受硬件监管产品来说，最接近公开开发者信号的不是 GitHub 活跃度，而是 NRC
              专题报告、技术合格更新、专业核能报道和监管 VDR 文档的密度。
