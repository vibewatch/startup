        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强驱动来自负荷增长、脱碳、可靠性和政策。McKinsey 与 Goldman 把 AI 数据中心描述为结构性电力需求冲击：负荷增长足够大，买家开始寻找 24/7
              清洁基荷，而不只是间歇性可再生能源信用。工业蒸汽是高温反应堆的另一个切入口，因为它能覆盖仅靠可再生能源更难脱碳的排放。DOE 目标、核能三倍增长倡议、贷款和示范基础设施，以及 ADVANCE Act/Part
              53 方向，都在边际上降低市场摩擦。约束同样关键。HALEU 可得性可能延误先进反应堆燃料供应；即便有 Part 53，NRC 审查仍是多步骤过程；电网互联可能卡住数据中心项目；FOAK
