  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与上市公司阶段
        blocks:
          - type: paragraph
            body: >-
              X-energy 是 X-Energy Reactor Company / X-Energy, Inc. 的运营品牌，一家位于马里兰州 Rockville
              的先进核反应堆与核燃料公司。它在核能创业公司中产品叙事少见地一体化：Xe-100 反应堆是 80 MWe 高温气冷 SMR，通常按 320 MWe 四机组电站描述，并与自有 TRISO-X 燃料和 Oak
              Ridge 燃料制造扩建绑定。截至 2026 年 6 月报告日，公司已不只是后期私营公司；它在 2026 年 4 月启动并定价 IPO，以 XE 在 Nasdaq 交易，随后披露 2026
              年一季度上市公司指标。因此，最强的封面事实应把公开资本市场身份、ARDP 支持的部署进展和仍不成熟的商业收入放在一起。概览不应把 X-energy 描述成今天已经有规模收入的公用事业基础设施公司：2026
              年一季度收入与补助收入为 $43.4 million，经营费用为 $109.5 million，更像 FOAK 反应堆开发，而不是常态化项目经济性。
