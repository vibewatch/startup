      - number: '1.4'
        title: 部署、监管与反向里程碑
        blocks:
          - type: paragraph
            body: >-
              对先进核能公司来说，X-energy 的里程碑记录异常密集，后续章节应复用这条时间线，而不是重新编造。ARDP 最初指向 Energy Northwest 示范项目；当前 DOE ARDP
              项目页面和公司披露则把首个拟建电站锚定在 Dow UCC Seadrift：四台机组、320 MWe 净出力的 Xe-100 项目，正在 NRC 建设许可证审查中。Amazon 通过支持华盛顿州 Energy
              Northwest 部署，增加了第二个平台；OPG 和加拿大相关监管工作则支撑国际选择权。TRISO-X 是独立但关键的赋能资产，2022 年在 Oak Ridge 破土，2026 年获得 Part 70
              HALEU 许可证。反向事实也必须放进同一时间线：Ares SPAC 失败不是脚注，上市公司 2026 年一季度业绩显示费用基底沉重。在 X-energy
              把许可证、燃料供应和客户选择权转化为运行中的反应堆之前，公司仍是高资本、高政策支持、高执行风险的故事。这个顺序很重要。
