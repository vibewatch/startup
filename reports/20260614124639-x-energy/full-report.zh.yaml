        - 监管和规模适配不同于 Xe-100
      - - Last Energy
        - 私有微型 SMR 相邻标的
        - 私有 PWR-20 商业化主张
        - PWR-20 小型压水堆
        - 较小工业 / 数据中心负荷
        - 标准化小型核电站封装
