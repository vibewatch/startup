        title: 监管与许可风险
        blocks:
          - type: paragraph
            body: >-
              X-energy 近期最重要的风险，不在于 Xe-100 能不能和监管方展开可信对话；它显然已经做到。更难回答的是，从预申请沟通到拿到可许可、可建造、可运行的电站，中间还要耗掉多少时间和资本。NRC
              记录显示，双方自 2018 年开始沟通，Long Mott 建设施工许可申请于 2025 年 3 月提交，Dow 场址在 2026 年 5 月获得
              FONSI。这些都是有分量的里程碑，但安全论证仍要面对受理审查、补充信息请求、石墨和燃料鉴定，以及刚刚定稿的 Part 53 下首条 HTGR 许可路径。2024 年 2
              月的就绪评估是最有用的反向一手来源：它明确指出，正式安全记录完整之前仍存在信息缺口。监管成功应按分阶段概率来评估，而不是二元审批事件。
