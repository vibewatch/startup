  productSummary: >
    X-energy 销售、联合开发并授权 Xe-100 高温气冷球床小型模块化反应堆——单机 80 MWe / 200 MWth，通常以 320 MWe 四机组部署，具备在线换料、氦一次冷却剂和约 565°C
    蒸汽，可同时服务发电与工业工艺热——并配套自有 TRISO-X HALEU 涂层颗粒燃料。该燃料计划在田纳西州 Oak Ridge 的 TX-1 制造设施生产，设计年产约 700,000 颗 TRISO 燃料球，足够约 11 台
    Xe-100 使用。公司还向工业、公用事业和政府客户销售开工前工程、许可支持与项目开发服务，并已获得 DOE Advanced Reactor Demonstration Program 成本分担，用于 Dow 德州
    Seadrift 场址的首个 Xe-100 示范项目。
  customerFocus: >
    三类主要买方：（1）重工业工艺热和表后电力，以 Dow（德州 Seadrift）及其他工业 MOU 为锚；（2）部署多模块 Xe-100 电站的受监管公用事业和公共电力机构，以华盛顿州中部的 Energy Northwest
    和加拿大 OPG 为锚；（3）由 hyperscaler 支撑的数据中心购电需求，以 Amazon 为主导——Amazon 既是 Climate Pledge Fund 投资者，也为首个 Energy Northwest
    项目提供购电支持，并推动 Dominion 锚定的弗吉尼亚 MOU。国际扩张目标包括英国（Cavendish、Centrica）和韩国（KHNP、Doosan）。
  businessModel: >
    商业化围绕长周期资本项目生命周期展开，收入来源多元：短期靠 DOE ARDP 成本分担报销、工程与许可服务、TRISO-X 燃料项目资金；中期随着首批 Xe-100 电站进入建设，来自反应堆设计、EPC 支持和燃料销售；长期则来自
    TRISO-X 燃料制造、电站服务，以及 JV 项目中潜在的所有权收益。单台 Xe-100 定价、反应堆 ASP、EPC 利润率、TRISO-X 燃料球价格和客户级 PPA 经济性均未公开披露。
