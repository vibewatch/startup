        title: 能力与打包方式比较
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持精确的每 MWh 价格排名；多数 SMR 供应商销售的是谈判项目，而非公开标价产品包。更有用的比较是能力打包：机组规模、热温度、燃料、许可先例、购电/购能验证和项目融资路径。X-energy 的
              80 MWe 模块和 320 MWe 四机组小于 Rolls-Royce 更大的 LWR 设计，但能覆盖最高 565°C 蒸汽温度的工业热。TerraPower 和 Kairos 可以主张先进温度或储能优势，GE
              Hitachi 和 Westinghouse 则强调熟悉的 LWR 血统。价格尽调应把每一笔公开“交易”都视为购电/购能或开发信号，而不是已实现经济性。Amazon-X-energy、Google-Kairos
              和 Constellation-Microsoft/Meta 都验证了需求，但也说明大买家可以在多个供应商和技术之间多栖。因而，本章把未知价格单元格视为尽调发现，而不是用猜测估计填充。在核项目中，标题
              MW、供应商营销和已宣布备忘录，可能远不如价格调整条款、完工保证、燃料指数敞口、互联权利和谁承担延误风险重要。
