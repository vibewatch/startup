      - number: '3.3'
        title: 护城河耐久性与风险清单
        blocks:
          - type: paragraph
            body: >-
              护城河只有在多项优势叠加时才耐久。高温蒸汽本身只是一个功能；高温蒸汽加上 TRISO-X 燃料一体化、DOE ARDP 支持、Amazon
              背书的融资信号和工业/客户伙伴关系，才是更可防守的组合。即便如此，护城河仍暴露在三条战线。第一，燃料供应是许多先进反应堆共同瓶颈，TRISO-X
              只有达到合格、可扩产生产后才真正有意义。第二，监管和建设准备度目前更偏向拥有运营机组、公共事业棕地场址或 LWR 参考设计的既有玩家。第三，hyperscaler
              清洁电力需求正在商品化：Microsoft、Google、Meta 和 Amazon 都能与多家核供应商签约。NuScale 取消 CFPP 和 USNC Chapter 11
              的反向证据说明，可信技术仍可能输在融资和客户承诺测试上。这些反向案例应被视为基准率证据，而不是一一对应的类比。NuScale、USNC 和 Oklo
              设计与发起方不同，但它们揭示了许可顺序、客户承诺、资本强度，以及技术里程碑与可融资商业部署之间缺口的反复失效模式。
