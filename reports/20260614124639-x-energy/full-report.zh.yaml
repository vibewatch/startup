      - number: '5.2'
        title: 架构、燃料与运营模型
        blocks:
          - type: paragraph
            body: >-
              Xe-100 架构是高温气冷球床设计，结合氦冷却剂、石墨慢化和 TRISO-X 燃料。X-energy 称反应堆出口温度为 750°C，可产生约 565°C
              蒸汽；这些条件解释了为什么产品面向化工、炼化、区域供热、氢能和数据中心相邻客户，因为这些客户看重热品质，而不只是电力输出。其运营模型不同于传统轻水堆：燃料位于石墨球中，可连续循环，不像长燃料棒那样需要周期性批量换料停堆。TRISO-X
              是 X-energy 安全叙事的赋能要素：每颗燃料球含有许多涂层铀氧碳化物颗粒，设计目标是在颗粒层面滞留裂变产物。最强的公开技术证明来自围绕燃料合格的监管和测试项目文件，而不是商业 Xe-100 运行记录。
