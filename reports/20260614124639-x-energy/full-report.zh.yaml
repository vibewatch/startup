      - number: '7.6'
        title: 治理、地缘政治与供应链风险
        blocks:
          - type: paragraph
            body: >-
              治理和地缘政治风险属于二阶问题，但会影响投资判断。X-energy 受益于能穿透联邦政策的管理层和投资人网络，包括 CEO Clay Sell 的政策背景，以及来自 Amazon
              相关需求的战略资本。同一组事实也要求尽调董事会控制权、利益冲突、关联方敞口，以及一个资本密集型核电项目能否在多年许可过程中守住高管注意力。供应链风险部分带有地缘政治属性：在美中先进反应堆竞争中，国内
              HALEU、石墨、专用核制造和合格燃料制造都是政策优先事项，但政策优先不等于可执行库存。投资人应把 X-energy 当作项目融资和供应链公司来承销，而不只是反应堆 IP
              公司，并要求燃料、长周期部件和交易对手承诺都拿出里程碑级证据。
