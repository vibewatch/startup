        title: 融资形成与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              X-energy 的资本故事分三段。第一，ARDP 下的政府成本分担提供可信度：DOE 于 2020 年给 X-energy $80 million 初始奖励，合作协议描述 DOE 将在七年内投入约 $1.23
              billion，用于约 $2.5 billion 的示范项目。第二，私募融资迅速放大，但夹杂一次失败的公开市场尝试。2022 年 12 月 Ares SPAC 公告瞄准约 $2 billion 投前股权价值；双方
              2023 年 10 月终止交易，并明确提到市场环境和同业公司交易表现。第三，Amazon 和其他战略投资者改变了融资轨迹：2024 年 10 月宣布的 $500 million Series C-1 在 2025
              年 2 月扩大并完成为 $700 million C-1，随后是 2025 年 11 月的 $700 million Series D 和 2026 年 4 月净募资 $1.1 billion 的
              IPO。利益相关方尽调不应只看表面融资额，更要看 Amazon、Dow、Energy Northwest、DOE、Jane Street/Ares/其他财务投资者、OPG 以及燃料/供应链伙伴之间的依赖是否对齐。
