      - number: '4.4'
        title: 公开缺口与反向信号
        blocks:
          - type: paragraph
            body: >-
              财务尽调的堵点是披露，而不是雄心不足。公开来源没有给出现金余额、烧钱速度、跑道、债务、受限现金、按项目承诺 capex、客户预付款、积压订单转化概率、反应堆 ASP、EPC 利润率、燃料
              ASP、燃料毛利率或服务附加率。对项目融资型核能公司来说，这些缺口很重要，因为即便订单簿诱人，只要 FOAK capex、进度、利息成本或燃料循环营运资本差于假设，项目仍可能不经济。Ares SPAC
              失败是最清晰的反向融资数据点：双方在 2023 年 10 月因市场环境艰难终止交易，SPACInsider
              在清算前报道过估值重置。这一事件不能证明技术失败，但说明公开市场融资敏感。正确结论是继续研究：X-energy 有可信的战略需求和少见的深厚融资支持，但投资人需要私有预算、已签商业条款、DOE
              报销机制、项目融资承诺和单位成本证据，才能承销收入或利润率。
