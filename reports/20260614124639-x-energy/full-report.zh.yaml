            body: >-
              最强的估值视角应按管线调整，而不是套收入倍数。DOE 成本分担和 ARDP 参与降低早期示范风险；Dow、Amazon/Energy Northwest、Centrica、Dominion/Amazon
              可选性、Doosan 和 KHNP 又让这家收入前反应堆公司的客户与供应链故事异常宽。问题在于转化：到 2035 年承销 20 至 40 个模块，按每模块 80 MWe 计算就是 1.6 至 3.2 GWe；若
              EPC 强度大致为每 GWe $5 billion 至 $10 billion，总项目 capex 可能达到 $8 billion 至 $32 billion。X-energy
              不会拥有全部收入；在宽松敏感性下，反应堆供应、燃料、工程和服务或许能捕获 10% 至
              25%，但实际合同拆分未披露。因此得到的是范围极宽的公司可触达累计收入包络，而不是精确企业价值。当前估值应锚定于按概率加权的项目转化和现金跑道，而不是新闻标题里的管线吉瓦数。
