  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              X-energy 的财务模型仍主要是开发阶段桥接，而不是传统收入表。公司没有公开证据显示 Xe-100 已产生商业运营收入，因为 Dow Seadrift 场址首个拟建四机组项目仍处在许可阶段，并受 DOE
              ARDP 支持。近期现金流入因此更应理解为私募融资、DOE 成本分担报销、工程与许可工作、伙伴资助开发活动的组合。规划中的客户变现模型分几层：面向公用事业或工业业主的反应堆技术与项目交付，自有 TRISO-X
              燃料供应，全生命周期工程与服务，以及伙伴规模化部署时潜在的许可或 IP 经济性。Amazon、Dow、Energy Northwest 和 Centrica 的公开公告显示需求信号，但未披露有约束力的反应堆
              ASP、燃料价格、PPA、蒸汽费率、照付不议合同或收入确认条款。因此，虽然期权价值很大，今天的收入质量仍低：多数已报告需求是订单簿或部署选择权叙事，不是已确认收入。
