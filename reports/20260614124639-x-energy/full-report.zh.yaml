              公开可比公司可以框定股票市场愿意为先进核电可选性支付什么价格，但并不完美。NuScale 和 Oklo 说明，在大规模商业部署之前，公开市场投资人也会给 SMR 或先进反应堆开发商数十亿美元市值；BWXT
              则展示了成熟核供应商的估值轮廓，它已有收入、利润以及国防 / 核服务敞口。按每 MWe
              估值看方向有用，但风险很高：已披露项目管线可能没有约束力，概率不均，且会因反应堆设计、客户融资、燃料模型和监管状态而不同。私营可比公司更不透明。TerraPower、Kairos、Holtec 和 Last
              Energy 可用于判断里程碑顺序和投资人胃口，但抓取到的公开语料没有给出这些公司一致的投后估值。相关结论不是 X-energy 今天就应获得公开同业倍数，而是：只有在大幅折扣里程碑概率和经济性之后，通向数
              GWe 的可信路径才可能支撑风险投资式期权价值。
