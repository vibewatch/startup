  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              承销 X-energy 时，应把它放在先进核能部署市场中，并更窄地聚焦于能销售稳定电力和高温工艺热的 SMR。边界不是泛泛的发电市场：它包括反应堆岛、模块化建设与 EPC
              包、燃料制造与供应、许可和业主工程、长期运营，以及客户可以买到的合同电力或蒸汽输出。它不包括仅可再生能源
              PPA、燃气备用、电池储能、数据中心内部电网设备，以及不具备模块化工厂学习路径的传统大型反应堆项目。现状替代方案同样重要：超大规模云厂商可以购买可再生能源并用燃气兜底；工业场址可以电气化锅炉、用氢，或继续使用化石蒸汽；公用事业可以延寿既有反应堆、建燃气电站或采购储能。因此，市场很大，但闸门是可融资项目，不是自上而下的电力
              TAM。
