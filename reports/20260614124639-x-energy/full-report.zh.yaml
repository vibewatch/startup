  - id: TM004
    title: 增长驱动因素与约束
    columns:
      - 驱动因素或约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - AI 数据中心电力增长
        - 驱动因素
        - 2026–2030
        - 把超大规模云拉向 24/7 清洁稳定电力
        - 核实项目层面的购电量和交付点
      - - 蒸汽的工业脱碳
        - 驱动因素
        - 2020 年代末以后
        - 为高温反应堆打开非电热需求
        - 要求提供场址能源平衡和蒸汽价格基准
      - - DOE 200 GW 先进核能路径
        - 驱动因素
        - 2030–2050
        - 支撑自上而下的大 TAM 和供应链动员
        - 跟踪 DOE 目标更新和拨款
      - - 企业核能背书
        - 驱动因素
        - 当前
        - Amazon 和 Google 降低科技买方对该品类的污名
        - 检查公告是否转化为有约束力的 PPA
      - - Part 53 / NRC 现代化
        - 驱动因素和约束
        - 2026 年以后
        - 增加选择空间，但不能消除审查风险
        - 将 X-energy 里程碑映射到 NRC 受理 / 审查日期
      - - HALEU 燃料可得性
        - 约束
        - 当前至首批部署
        - 可能拖慢非轻水堆商业化
        - 审计燃料合同、浓缩来源和库存
      - - 首台套成本超支
        - 约束
        - 重复部署前持续存在
        - 可能取消项目，或重设 PPA 价格预期
        - 要求 EPC 保证，并评估 $/MWh 敏感性
      - - 电网互联和交付
        - 约束
        - 当前
        - 即使反应堆获证，也可能拖慢数据中心项目
        - 确认排队状态和输电计划
      - - 公众认知和本地选址
        - 约束
        - 持续存在
        - 可能拖慢许可，并抬高融资风险
        - 审查社区沟通和州 / 地方审批
    notes: 驱动因素和约束按时点拆开：有些会推迟收入，另一些则可能永久压低实际 SOM。
