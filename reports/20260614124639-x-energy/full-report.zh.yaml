            body: >-
              风险章节应承载本报告的怀疑性来源基础，因为公众接受度足以击穿原本可融资的核电项目。UCS 认为，先进反应堆必须证明安全、安保和环境收益，而不能只是声称具备这些收益。NPEC 对先进反应堆和新燃料提出扩散担忧，使
              HALEU 保障措施成为现实议题。本次审阅的公开记录没有闭合乏 TRISO 处置、长期废料处理或 Seadrift 社区接受度。即使 X-energy
              电站按设计运行，行业层面的事件也可能污染许可和政治环境，因为先进反应堆争夺的是公众信任和监管带宽。尽调口径应要求看到保障措施方案、废料处置路径、应急规划叙事和社区接受证据，再承销低剩余风险。
            claimRefs:
