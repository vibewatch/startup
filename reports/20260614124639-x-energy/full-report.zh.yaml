            body: >-
              长尾关系显示了广度，但证明质量不如 Dow 和 Energy Northwest。OPG 是有价值的加拿大公用事业关系，但其 Darlington 新建路径采用 GE Hitachi BWRX-300，因此
              X-energy 的 OPG 证据更应理解为工业机会开发，而不是首建项目胜利。Cavendish 带来英国 HTGR 和供应商开发选择；Centrica 增加英国公用事业 JDA；TransAlta 和 ENEC
              增加 Alberta 与 UAE 研究路径；Talen 增加美国发电商潜在客户；Doosan/KHNP 提供韩国制造和 AI 基础设施伙伴信号。DOE 实验室关系有助于技术可信度，尤其是 INL
              的燃料合格工作，但不能证明商业客户留存。因此，尽调任务是区分能验证采购承诺的客户访谈，和主要保留战略可选性的伙伴公告。
