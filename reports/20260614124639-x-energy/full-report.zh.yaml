        - Dow 验证从锚点降级为选择权价值
      - - HALEU 供应
        - 供应商配额和去转化证据
        - 没有已签约的首炉芯路径
        - 要求政府担保，或下调估值
      - - 资本强度
        - 下一轮规模和条款
        - 下行轮、结构化优先资本，或项目债缺口
        - 建模稀释和优先权悬置
      - - 公众接受度
