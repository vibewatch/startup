      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              按私营核能创业公司标准，融资故事很强，但仍高度依赖外部条件。X-energy 在 2024 年 Amazon 锚定的 $500 million Series C-1 和 2023 年 $235 million
              Series C 后，于 2025 年 11 月完成约 $700 million Series D；独立报道称累计融资约 $1.8
              billion。这些轮次足以资助设计、许可、燃料设施建设、供应链扩张和首个项目支持，但不等于一支反应堆舰队已完全融资。DOE ARDP 通过成本分担和拨款显著降低负担，包括初始 $80 million 奖励和
              X-energy 提到的后续拨款；但 DOE 支持要求行业匹配，且暴露于拨款、进度关口和政策变化。TX-1
              设施体现了现金曲线：场址开发、垂直建设、许可和生产准备都发生在经常性燃料收入之前。下一个融资触发点是项目转化——获得许可、客户背书、可融资的部署，并具备透明的 EPC、燃料、O&M 与电力/蒸汽合同条款。
