              产品成熟度更应定义为先进工程加监管执行，而不是商业运行。NRC 自 2018 年起与 X-energy 就 Xe-100 预申请活动互动，Long Mott 建设许可证申请为首个 Dow
              部署提供了具体路径。CNSC 的供应商设计审查是有建设性的独立信号，因为工作人员没有发现加拿大许可的根本障碍；TRISO-X Part 70
              许可证则是具体的燃料循环里程碑。但这些控制并不等于标准设计批准或运营许可证。X-energy 自己的 SEC 风险措辞很有约束力：最终设计成熟度、特定场址许可、燃料生产和最终投资决定都必须在 2030
              年代初首次商业运营前落地。因此，质量控制应通过监管通信、燃料合格收口、设施检查和客户场址集成计划来尽调验证。
