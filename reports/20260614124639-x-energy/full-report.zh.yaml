              稳健性的上行叙事，但尽调问题不是泛泛讨论 TRISO 物理，而是 X-energy 能否按商业质量和进度制造、鉴定、获批并装载自己的特定燃料。NRC
              石墨沟通材料显示，石墨鉴定是被点名的审查议题，不是已经解决的脚注。HALEU 既是设计得以成立的选择，也是供应链卡点。任何一层薄弱——燃料包覆 QA、石墨方法论、燃料球处理或 HALEU
