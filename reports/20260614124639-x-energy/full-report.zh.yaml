  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局分层：同业、既有玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              X-energy 处在拥挤的清洁稳定电力竞赛中，但真正相关的替代方案并不能互换。直接先进反应堆同业包括 NuScale、TerraPower、Kairos、Holtec、GE
              Hitachi、Westinghouse、Rolls-Royce、Oklo 和 Last Energy；每家公司都有不同的机组规模、燃料循环和买方打法。既有替代方案同样重要：Constellation
              可以为超大规模云厂商重启或延寿既有核资产，Southern 的 Vogtle AP1000 机组证明大型反应堆基荷供给，公用事业也可以在 SMR
              项目成熟前继续购买电网电力或燃气备用。最重要的分层因此是买方要完成的任务。工业蒸汽和大型园区表后清洁稳定电力重要时，X-energy 最强；公用事业想要熟悉的水堆许可路径时，LWR-SMR
              更强；偏远或较小负荷更适合微反应堆；超大规模云厂商若需要近期无碳电力且不承担 FOAK 建设风险，既有 PPA 更合适。这很关键，因为采购团队买的不是抽象的反应堆类别，而是可靠
              MW、蒸汽条件、场址确定性、信用良好的交易对手和进度信心。即使技术上看起来很远的竞争者，只要用更低的监管、建设或融资不确定性解决买方任务，也能赢。
