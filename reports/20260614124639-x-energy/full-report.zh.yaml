companyProfile:
  summary: >
    X-energy 是一家位于马里兰州 Rockville 的先进核反应堆与核燃料公司，2009 年由 Kam Ghaffarian 创立，CEO 为美国前副能源部长 J. Clay Sell。公司的核心产品平台把 Xe-100
    与自有 TRISO-X 涂层颗粒 HALEU 燃料绑定在一起：Xe-100 是 80 MWe 高温气冷球床小型模块化反应堆，通常按 320 MWe 四机组部署，可向工业客户输出约 565°C 工艺蒸汽；TRISO-X
    燃料则在公司位于田纳西州 Oak Ridge 的 TX-1 工厂生产。2020 年，X-energy 入选美国能源部 Advanced Reactor Demonstration Program（ARDP），先获 $80M
    初始奖励，成本分担最高约 ~$1.2B。2022–2023 年 Ares Acquisition Corp II SPAC 失败后，公司又在 2023 年 12 月完成 $235M Series C，2024 年 10 月宣布
    Amazon 领投的约 ~$500M Series C-1（后扩大至约 ~$700M，并于 2025 年 2 月完成），2025 年 11 月获得 Jane Street 领投的 $700M Series D，并在 2026 年 4
    月以 XE 为代码完成 Nasdaq IPO，净募资约 ~$1.1B。核心商业关系包括 Dow（德州 Seadrift 四台 Xe-100，Long Mott Energy JV 于 2025 年 3 月提交 NRC
    建设许可证申请）、Energy Northwest（在华盛顿州中部最多十二台 Xe-100 模块 / 约 960 MW 的 JDA）、Amazon（Climate Pledge Fund 投资者，并为首个 Energy
    Northwest 项目提供购电支持，另有 Dominion 锚定的弗吉尼亚 MOU），以及加拿大（OPG）、英国（Cavendish、Centrica）和韩国（KHNP、Doosan）的国际 MOU。
