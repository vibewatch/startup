      - number: '4.2'
        title: 单位经济性与项目融资
        blocks:
          - type: paragraph
            body: >-
              分析单位不是一个软件席位，甚至不是一次硬件交付，而是一个已融资核项目。四机组 Xe-100 配置产出 320
              MWe，也能供应工业蒸汽，因此项目经济性取决于每千瓦建设成本、建设期融资成本、容量因子、燃料成本、O&M、许可进度、预备费，以及客户对可靠清洁热的价值。X-energy
              材料把模块化制造、公路可运输部件、在线换料和 TRISO-X 燃料作为经济杠杆，但没有量化已实现学习曲线或毛利率。因此必须使用外部基准。Lazard 和 EIA 支撑先进核电 LCOE
              与资本成本的尽调区间；简单敏感性显示，每增加 $1,000/kW 隔夜 capex，320 MWe 四机组在业主成本和融资成本前就增加约 $320 million。这就是为什么 FOAK
              capex、利率或进度延误的小变化，可能压倒反应堆层面的利润率主张。
