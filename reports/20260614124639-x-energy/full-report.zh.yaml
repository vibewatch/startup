            body: >-
              创始人事实的核心是 Kam Ghaffarian：X-energy 自己的 Ares 交易材料引用他说其于 2009 年创立公司，当前管理层页面也列其为 Founder & Chairman。J. Clay
              Sell 继续担任 CEO，在 2020 年 ARDP
              授奖阶段和当前管理层名单中都可见。现任高管班子已不只是创始人型组织——公开姓名覆盖燃料、法务/行政、财务、运营、商业、会计、政府事务、增长战略、科学、全球开发、技术、核能、人力资本、供应链、IT、捕获/提案和合同等职能。董事会披露还把
              Gregory Goff、Christopher Ginther 和 Kathleen Hyle 纳入治理记录。尽调警示在于关键人物和项目依赖风险：Ghaffarian 与 Sell
              仍是最主要的公开面孔，而完整董事会委员会、投票控制权和 IPO 后治理机制尚未在已抓取章节来源中建立。
