  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              X-energy 更适合采取观察 / 继续研究的估值立场，而不是买入建议，因为战略验证异常强，但已定价轮次的证据仍不完整。公司拥有可信的非稀释和战略支持：入选 DOE ARDP，Amazon
              既是战略投资人又是潜在买方，Dow 作为工业路径开拓者，Energy Northwest/Cascade 提供公用事业规模部署路径，供应链网络也扩展到 Doosan 和 KHNP。即使还没有 Xe-100
              商业收入，这些信号也足以支撑数十亿美元级私营公司估值讨论。约束在于价格纪律：已抓取的公开记录验证了 $1.8 billion 的 SPAC 锚点、Amazon 锚定的 C-1 轮和 $700 million 的
              Series D，但没有披露 Series C-1 或 Series D 的投后估值、清算优先权、烧钱速度或反应堆层面经济性。因此，我把传闻中的 $2.0 billion 至 $2.5 billion C-1
              区间、$3.0 billion 至 $5.0 billion Series D 区间视为估计，而不是事实。可辩护的入场价格必须承销里程碑转化，而不是简单跟随上一轮新闻标题。
