            body: >-
              公开留存证据基本缺失。X-energy 未披露
              NRR、GRR、流失率、满意度得分、合同期限、照付不议经济性、头部客户收入占比或活跃客户数。对反应堆开发商来说这不意外，但它改变了尽调标准：投资人必须通过合同、成本分担协议、公用事业董事会批准、PPA
              条款和监管里程碑来验证客户耐久性，而不是靠分组指标。集中风险很高，因为 Dow、Energy Northwest/Amazon，以及仍处于探索阶段的 Dominion
