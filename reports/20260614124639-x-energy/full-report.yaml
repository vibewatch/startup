      - number: '7.3'
        title: Cost, Schedule, and Capital-Intensity Risk
        blocks:
          - type: paragraph
            body: >-
              The investment anti-thesis is a cumulative-delay problem. X-energy has raised large private rounds,
              including the Amazon-anchored Series C-1 and an announced $700 million Series D, but first commercial
              revenue still requires licensing, construction, fuel, customer FID, and commissioning. Comparable nuclear
              evidence is adverse. NuScale’s CFPP cancellation followed cost and price escalation; IEEFA uses that and
              broader SMR evidence to argue the category is too expensive, too slow, and too risky; Vogtle shows that
              even mature light-water projects can overrun original cost and schedule by years. X-energy is not Vogtle
              and not NuScale, but those cases define the investor’s prior: FOAK nuclear capital needs tend to rise
              before revenue proof arrives. DOE ARDP cost-share helps but also creates milestone and policy dependency.
