  productSummary: >
    X-energy sells, jointly develops, and licenses the Xe-100 high-temperature gas-cooled pebble-bed small modular
    reactor — 80 MWe / 200 MWth per unit, typically deployed as a 320 MWe four-pack with online refueling, helium
    primary coolant, and ~565°C steam suitable for both electricity and industrial process heat — together with
    proprietary TRISO-X HALEU coated-particle fuel produced at a planned TX-1 fabrication facility in Oak Ridge,
    Tennessee, designed to manufacture roughly 700,000 TRISO pebbles per year (enough for ~11 Xe-100 reactors). The
    company also sells pre-construction engineering, licensing support, and project-development services to industrial,
    utility, and government customers, and has been awarded DOE Advanced Reactor Demonstration Program cost-share for
    the first Xe-100 demonstration at Dow's Seadrift, Texas site.
  customerFocus: >
    Three primary buyer segments: (1) heavy-industrial process heat and behind-the-meter power, anchored by Dow
    (Seadrift, Texas) and additional industrial MOUs; (2) regulated utilities and public power deploying multi-module
    Xe-100 plants, anchored by Energy Northwest in central Washington and OPG in Canada; and (3) hyperscaler-backed
    data-center offtake led by Amazon (Climate Pledge Fund investor plus offtake support for the first Energy Northwest
    project and a Dominion-anchored Virginia MOU). International expansion targets include the UK (Cavendish, Centrica)
    and Korea (KHNP, Doosan).
  businessModel: >
    Multi-stream commercialization built around a long-duration capital project lifecycle: short-term revenue from DOE
    ARDP cost-share reimbursements, engineering and licensing services, and TRISO-X fuel-program funding; medium-term
    revenue from reactor design, EPC support and fuel sales as the first Xe-100 plants reach construction; and long-term
    recurring revenue from TRISO-X fuel fabrication, plant services, and potential ownership stakes in JV projects.
    Pricing per Xe-100, reactor ASP, EPC margin, TRISO-X pebble price and customer-level PPA economics are not publicly
    disclosed.
  stage: 'Public (Nasdaq: XE, IPO April 2026)'
  fundingStatus: >
    Pre-revenue from commercial reactor sales but well-capitalized. Major financing chronology: 2020 DOE ARDP initial
    $80M award (cost-share up to ~$1.2B over multiple years); $235M Series C closed December 2023; Amazon Climate Pledge
    Fund-anchored ~$500M Series C-1 announced October 2024 (later described as upsized to ~$700M and closed in February
    2025); ~$700M Series D led by Jane Street in November 2025 with new investors including ARK Invest, Point72, Hood
    River, Reaves, Galvanize and XTX Ventures; and an April 2026 Nasdaq IPO under ticker XE (~44.3M Class A shares at
    $23, ~$1.1B net proceeds). Cumulative pre-IPO private equity raised is widely reported at ~$1.8B; the December 2022
    Ares Acquisition Corp II SPAC combination announced at a ~$2.0B pre-money equity value was mutually terminated
    October 31, 2023. Q1 2026 disclosures show $43.4M revenue and grant income, $109.5M operating expenses, $67.3M net
    cash used in operating activities, and $944M of liquidity at March 31, 2026 before the IPO proceeds settled.
