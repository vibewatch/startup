    - name: Kam Ghaffarian
      role: Founder and Executive Chairman
      background: >-
        Serial deep-tech entrepreneur. Founded X-energy in 2009 (per the Ares SPAC announcement and the current
        leadership page); founder of Intuitive Machines (lunar landers) and Axiom Space (commercial space stations) and
