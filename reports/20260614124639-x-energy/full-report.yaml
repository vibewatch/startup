        title: Customer, Market, and Partner Risk
        blocks:
          - type: paragraph
            body: >-
              Dow, Amazon, and Energy Northwest materially improve X-energy’s customer narrative, but they do not yet
              remove market risk. Dow’s FONSI is an environmental milestone for the Seadrift project, not a public final
              investment decision or proof that the customer will accept all cost and schedule outcomes. Amazon’s role
              is strategically important because it links X-energy to hyperscaler load growth and a claimed
              multi-gigawatt deployment opportunity; however, public evidence does not disclose binding PPA economics,
              delivery penalties, site-level interconnection status, or price floors. Energy Northwest’s joint
              development agreement is useful partner proof, but a JDA is weaker than operating-plant revenue. The key
              diligence ask is to separate customer enthusiasm from bankable offtake commitments with milestone
