  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Licensing Risk
        blocks:
          - type: paragraph
            body: >-
              X-energy’s most important near-term risk is not whether the Xe-100 has a credible regulatory conversation;
              it plainly does. The harder question is how much time and capital sit between pre-application engagement
              and a licenseable, constructible, operating plant. NRC records show engagement beginning in 2018, a Long
              Mott construction-permit application submitted in March 2025, and a May 2026 FONSI for the Dow site. Those
              are meaningful milestones, but the safety case remains exposed to acceptance review, requests for
              additional information, graphite and fuel qualification, and a first HTGR licensing path under newly
              finalized Part 53. The February 2024 readiness assessment is the most useful adverse primary source: it
              explicitly identified information gaps before the formal safety record could be complete. Treat regulatory
              success as staged probability, not a binary approval event.
            claimRefs:
