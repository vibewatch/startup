            body: >-
              The round chronology shows a valuation reset rather than a clean markup ladder. The December 2022 Ares
              transaction proposed a public listing at roughly $1.8 billion pre-money, but the agreement was terminated
              in October 2023; that anchor is useful as a market-clearing attempt under SPAC conditions, not a live
              mark. The October 2024 Amazon-led Series C-1 announcement verified approximately $500 million of new
