      - number: '7.5'
        title: Public Perception, Waste, Proliferation, and Adverse-Event Risk
        blocks:
          - type: paragraph
            body: >-
              The risks chapter should carry the report’s skeptical source base because public acceptance can break
              otherwise financeable nuclear projects. UCS argues advanced reactors must demonstrate safety, security,
              and environmental benefits rather than simply claim them. NPEC raises proliferation concerns around
              advanced reactors and new fuels, making HALEU safeguards a live issue. The public record reviewed here
              does not close spent TRISO disposal, long-term waste handling, or Seadrift community acceptance. Even if
              X-energy’s plant performs as designed, sector-wide events can contaminate the licensing and political
              environment because advanced reactors compete for public trust and regulator bandwidth. The diligence
              posture should require a safeguards plan, waste disposition path, emergency-planning narrative, and
              community acceptance evidence before underwriting low residual risk.
            claimRefs:
              - CR013
              - CR028
              - CR029
              - CR041
              - CR042
      - number: '7.6'
        title: Governance, Geopolitical, and Supply-Chain Risk
        blocks:
          - type: paragraph
            body: >-
              Governance and geopolitical risks are second-order but investable. X-energy benefits from management and
              investor networks that can navigate federal policy, including CEO Clay Sell’s policy background and
              strategic capital from Amazon-linked demand. The same fact pattern requires diligence into board control,
              conflicts, related-party exposure, and whether a capital-intensive nuclear program can keep executive
              focus through years of licensing. Supply-chain risk is partly geopolitical: domestic HALEU, graphite,
              specialized nuclear manufacturing, and qualified fuel fabrication are policy priorities in the U.S.-China
              advanced-reactor race, but policy priority is not executable inventory. Investors should underwrite
              X-energy as a project-finance and supply-chain company, not just a reactor-IP company, and demand
              milestone-level evidence for fuel, long-lead components, and counterparty commitments.
            claimRefs:
