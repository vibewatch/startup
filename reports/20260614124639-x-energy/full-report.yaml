      - number: '7.2'
        title: Technical, FOAK, Fuel, and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              The Xe-100 concentrates multiple first-of-a-kind risks in one program: pebble-bed HTGR architecture,
              TRISO-X fuel, HALEU supply, graphite structural performance, helium-boundary assumptions, and
              industrial-scale fuel manufacturing QA. Company and DOE sources support the upside case for TRISO
              robustness, but the diligence issue is not generic TRISO physics; it is whether X-energy can manufacture,
              qualify, license, and load its specific fuel at commercial quality and schedule. NRC graphite engagement
              materials show that graphite qualification is a named review topic, not a solved footnote. HALEU is both
              an enabling design choice and a supply-chain chokepoint. A single weak layer—fuel coating QA, graphite
              methodology, pebble handling, or HALEU delivery—can cascade into licensing delay, customer delay, and
              additional financing need.
