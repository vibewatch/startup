  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              X-energy merits a track / research-more valuation stance rather than a buy recommendation because the
              strategic proof is unusually strong while the priced-round evidence remains incomplete. The company has
              credible non-dilutive and strategic support: DOE ARDP selection, Amazon as a strategic investor and
              prospective buyer, Dow as an industrial pathfinder, Energy Northwest/Cascade as a utility-scale deployment
              path, and a broadening supply-chain network that now includes Doosan and KHNP. Those signals justify a
              multi-billion-dollar private-company discussion despite the absence of commercial Xe-100 revenue. The
              constraint is price discipline: the fetched public record verifies the $1.8 billion SPAC anchor, an
              Amazon-anchored C-1 round, and a $700 million Series D, but it does not disclose Series C-1 or Series D
              post-money valuations, liquidation preferences, burn, or reactor-level economics. I therefore treat the
              rumored $2.0 billion to $2.5 billion C-1 and $3.0 billion to $5.0 billion Series D ranges as estimates,
              not facts. A defensible entry must underwrite milestone conversion, not simply follow the last headline
              round.
            claimRefs:
