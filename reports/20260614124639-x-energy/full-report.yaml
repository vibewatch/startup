  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape segmentation: peers, incumbents and substitutes'
        blocks:
          - type: paragraph
            body: >-
              X-energy sits in a crowded clean-firm-power race, but the relevant alternatives are not interchangeable.
              Direct advanced-reactor peers include NuScale, TerraPower, Kairos, Holtec, GE Hitachi, Westinghouse,
              Rolls-Royce, Oklo and Last Energy; each offers a different unit size, fuel cycle and buyer motion.
              Incumbent substitutes are equally important: Constellation can restart or extend existing nuclear assets
              for hyperscalers, Southern's Vogtle AP1000 units demonstrate large-reactor baseload supply, and utilities
              can keep buying grid power or gas-fired backup while SMR projects mature. The most important segmentation
              is therefore by buyer job. X-energy is strongest where industrial steam and large behind-the-meter clean
              firm power matter; LWR-SMRs are stronger where utilities want familiar water-reactor licensing;
              microreactors fit remote or smaller loads; incumbent PPAs fit hyperscalers that need near-term carbon-free
              electricity without FOAK construction risk. This matters because procurement teams do not buy reactor
              categories in the abstract; they buy dependable megawatts, steam conditions, site certainty, creditworthy
              counterparties and schedule confidence. A competitor that looks technologically distant can still win if
              it solves the buyer job with lower regulatory, construction or financing uncertainty.
