      - number: '2.5'
        title: Sizing Gaps and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The chapter’s largest uncertainty is not whether the addressable market is large; it is how quickly
              bankable, repeatable projects can convert policy need into signed orders. Public sources do not disclose
              the price, tenor, take-or-pay structure, termination rights, or cost-overrun sharing in the Amazon/Energy
              Northwest and Dow arrangements. Analyst reports expose headline market values but not enough methodology
              to separate reactor-vendor revenue from total project capex, replacement generation, or legacy categories.
              The core diligence asks are therefore commercial rather than rhetorical: request executed offtake terms,
