      - number: '2.2'
        title: Sizing Lenses and Forecast Range
        blocks:
          - type: paragraph
            body: >-
              The cleanest top-down lens is DOE’s view that the United States may need about 200 GW of additional
              advanced nuclear by 2050, scaling total nuclear from roughly 100 GW to roughly 300 GW. That lens is more
              useful for X-energy than headline global SMR revenue reports, because it captures project capital and
              power-market demand rather than only vendor revenue. Analyst pages still help bracket market sentiment:
              2026-era SMR revenue estimates range from Research and Markets’ $0.99B in 2026 to Fortune’s $6.13B in 2026
              and Precedence’s $17.37B by 2035, with Grand View showing slower growth to $7.69B by 2030. These estimates
              should not be summed; their scopes appear inconsistent. A pragmatic sizing stack is TAM = 200 GW U.S.
              advanced nuclear target, SAM = U.S. SMR and process-heat deployments that can clear licensing and fuel
              constraints, and SOM = X-energy’s disclosed 320 MW first project plus a probability-weighted share of the
              more-than-5 GW 2039 commercial target.
