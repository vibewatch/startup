        title: Cost-share, customer pipeline and company capture
        blocks:
          - type: paragraph
            body: >-
              The strongest valuation lens is pipeline-adjusted rather than revenue-multiple-based. DOE cost-share and
              ARDP participation reduce early demonstration risk, while Dow, Amazon/Energy Northwest, Centrica,
              Dominion/Amazon optionality, Doosan and KHNP make the customer and supply-chain story unusually broad for
              a pre-revenue reactor company. The problem is conversion: a 20-to-40-module by 2035 underwriting case
              equals 1.6 to 3.2 GWe at 80 MWe per module, and at broad $5 billion to $10 billion per GWe EPC intensity,
              gross project capex could be $8 billion to $32 billion. X-energy will not own all of that; reactor supply,
              fuel, engineering and services might capture 10% to 25% in a generous sensitivity, but the actual contract
              split is undisclosed. That yields a very wide cumulative company-addressable revenue envelope, not a
              precise enterprise value. The current valuation should therefore be anchored to probability-weighted
              project conversion and cash runway rather than headline pipeline gigawatts.
