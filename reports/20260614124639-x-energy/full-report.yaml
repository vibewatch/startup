      - number: '6.5'
        title: Retention, concentration risk, and adverse view
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is effectively absent. X-energy has disclosed no NRR, GRR, churn, satisfaction
              score, contract term, take-or-pay economics, top-customer revenue share, or active customer count. For a
              reactor developer this is not surprising, but it changes the diligence standard: investors must validate
              customer durability through contracts, cost-sharing agreements, utility board approvals, PPA terms, and
              regulatory milestones rather than cohort metrics. Concentration risk is high because Dow, Energy
              Northwest/Amazon, and the still-exploratory Dominion pathway carry disproportionate narrative and pipeline
              weight. The adverse case is not that customers dislike X-energy; it is that customers may not wait through
              first-of-a-kind nuclear timelines. IEEFA’s critique that SMRs are too expensive, too slow, and too risky
              is directly relevant to procurement committees comparing Xe-100 projects with renewables, storage,
