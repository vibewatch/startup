        title: Critical Dependencies and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              The main technical underwriting risk is a chain dependency: Xe-100 deployment needs final design,
              construction permits, site integration, fuel qualification, HALEU feedstock, a functioning TRISO-X fuel
              plant, graphite and helium supply, and committed customers able to finance nuclear construction. HALEU is
              the most visible bottleneck because DOE, ORNL and independent nuclear-supply commentary all describe a
              market in which demand is rising before large-scale domestic supply is proven. X-energy's own filing adds
              that graphite and helium have limited vendor bases and that HALEU supply outside Russia or China may
              materially affect its business. The adverse lens from UCS is not that Xe-100 cannot work; it is that
              advanced non-light-water reactors should not receive a safety presumption before evidence is demonstrated.
              Diligence should therefore require a fuel-qualification closeout pack, HALEU allocation evidence, material
              supplier commitments, independent reliability modeling and a site-specific integration risk register
