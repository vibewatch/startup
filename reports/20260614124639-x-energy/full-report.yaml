      - number: '8.3'
        title: Comparable public and private nuclear marks
        blocks:
          - type: paragraph
            body: >-
              Public comparables frame what equity markets can pay for advanced nuclear optionality, but they are
              imperfect. NuScale and Oklo demonstrate that public investors can assign multi-billion-dollar market
              capitalizations to SMR or advanced-reactor developers ahead of broad commercial deployment, while BWXT
              shows the valuation profile of a mature nuclear supplier with revenue, earnings and
              defense/nuclear-services exposure. The per-MWe lens is directionally useful but dangerous: disclosed
              project pipelines may be non-binding, have uneven probabilities, and differ by reactor design, customer
              financing, fuel model and regulatory status. Private comparables are even less transparent. TerraPower,
              Kairos, Holtec and Last Energy can inform milestone sequencing and investor appetite, but the fetched
              public corpus does not provide consistent post-money valuations for those companies. The relevant
              conclusion is not that X-energy deserves a public-peer multiple today; it is that a credible path to
              several GWe can support a venture-style option value only if milestone probability and economics are
              haircut aggressively.
