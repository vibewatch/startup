      - number: '5.2'
        title: Architecture, Fuel and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The Xe-100 architecture is a high-temperature gas-cooled pebble-bed design that combines helium coolant,
              graphite moderation and TRISO-X fuel. X-energy states that the reactor operates with a 750°C outlet
              temperature and can produce approximately 565°C steam; those conditions explain why the product is
              positioned for chemical, refining, district-heating, hydrogen and data-center-adjacent customers that
              value heat quality rather than only electric output. The operating model differs from conventional
              light-water reactors because fuel is in graphite pebbles that are cycled continuously, not in long rods
              that require periodic batch refueling outages. TRISO-X is the enabling element of X-energy's safety
              narrative: each pebble contains many coated uranium oxycarbide particles intended to retain fission
              products at the particle level. The strongest public technical proof is regulatory and test-program
              documentation around fuel qualification, not a commercial Xe-100 operating record.
