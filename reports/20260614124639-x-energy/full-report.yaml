  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              X-energy should be underwritten against the advanced-nuclear deployment market, with a narrower focus on
              SMRs that can sell firm electricity and high-temperature process heat. The boundary is not generic
              electricity generation: it includes the reactor island, modular construction and EPC package, fuel
              fabrication and supply, licensing and owner’s-engineering work, long-term operations, and contracted power
              or steam output that a customer can buy. It excludes renewables-only PPAs, gas-fired backup, battery
              storage, grid equipment inside a data center, and conventional large-reactor projects that do not share
              the modular factory-learning path. Status-quo substitutes are also material: hyperscalers can buy
              renewables plus gas-backed firming; industrial sites can electrify boilers, use hydrogen, or keep fossil
              steam; utilities can extend existing reactors, build gas, or procure storage. The market is therefore
              large but gated by bankable projects, not by a top-down electricity TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
