  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered Product and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              X-energy is selling a nuclear heat-and-power platform rather than a software service or a single factory
              widget. The delivered product is centered on Xe-100 reactor modules, each marketed at 80 MWe and 200 MWt,
              plus TRISO-X fuel and a life-cycle services layer that supports licensing, construction, fueling,
              operations and maintenance. In the customer workflow, an industrial site such as Dow Long Mott would move
              from buying or self-producing fossil steam and grid electricity to hosting a regulated nuclear island that
              can supply electricity and high-temperature steam. The product promise is therefore not merely carbon-free
              megawatt-hours; it is firm industrial heat near the load, with standardized modules that can scale from
              four to twelve units. The maturity caveat is equally central: X-energy discloses that it has not delivered
              Xe-100 or any reactor to customers, so deployment evidence is currently project-development evidence
              rather than operating-fleet evidence.
