            body: >-
              X-energy’s financial model is still mostly a development-stage bridge rather than a conventional revenue
              statement. The company has no public evidence of commercial Xe-100 operating revenue because the first
              proposed four-unit project at Dow’s Seadrift site remains in permitting and under DOE ARDP support.
              Near-term receipts are therefore best understood as a mix of private financings, DOE cost-share
              reimbursements, engineering and licensing work, and partner-funded development activity. The planned
              customer monetization model has several layers: reactor technology and project delivery for utilities or
              industrial hosts, proprietary TRISO-X fuel supply, lifecycle engineering and services, and potential
              licensing or IP economics where partners deploy at scale. Public announcements with Amazon, Dow, Energy
              Northwest, and Centrica demonstrate demand signals, but they do not disclose binding reactor ASPs, fuel
              prices, PPAs, steam tariffs, take-or-pay contracts, or revenue-recognition terms. That makes revenue
