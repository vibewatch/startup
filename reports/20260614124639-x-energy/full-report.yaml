              and industrial/customer partnerships is a more defensible bundle. Even then, the moat is exposed on three
              fronts. First, fuel supply is a shared bottleneck for many advanced reactors, so TRISO-X matters only if
              it reaches qualified, scalable production. Second, regulatory and construction readiness currently favors
              incumbents with operating fleets, utility brownfield sites, or LWR reference designs. Third, hyperscaler
