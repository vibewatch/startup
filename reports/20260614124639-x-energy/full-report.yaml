      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest drivers are load growth, decarbonization, reliability, and policy. McKinsey and Goldman
              frame AI data centers as a structural power-demand shock: load growth is large enough that buyers are
              searching for 24/7 clean baseload rather than only intermittent renewable credits. Industrial steam is an
              additional wedge for high-temperature reactors because it reaches emissions that are harder to decarbonize
              with renewables alone. DOE targets, the nuclear tripling push, loan and demonstration infrastructure, and
              the ADVANCE Act/Part 53 direction all lower market-friction at the margin. The constraints are equally
              important. HALEU availability can delay advanced reactor fuel supply; NRC review remains a multi-step
              process even with Part 53; grid interconnection can bottleneck data-center projects; and first-of-a-kind
              construction cost can destroy economics. IEEFA’s NuScale critique and EIA’s Vogtle chronology are
              reminders that buyers may wait for demonstrated cost curves before committing at scale.
