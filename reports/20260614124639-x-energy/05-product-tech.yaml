- id: differentiation-and-heritage
  title: Differentiation, Heritage and Practitioner Signal
  body: 'X-energy''s differentiation is the vertical coupling of reactor, proprietary pebble fuel, fuel-fabrication facility
    and deployment services. The technology is not invented from scratch: the S-1 traces HTGR heritage to Peach Bottom, Dragon
    and China; World Nuclear News provides external practitioner coverage that China''s HTR-PM reached full-power operation
    with a two-reactor pebble-bed HTGR plant. That heritage matters because it lowers pure physics novelty, but it does not
    eliminate Xe-100 FOAK execution risk. China has the operating pebble-bed reference plant; X-energy has U.S. regulatory
    engagement, customer projects and domestic fuel-facility licensing. The closest public developer-signal proxy for this
    hardware-regulated product is therefore not GitHub activity but the density of NRC topical reports, technical qualification
    updates, professional nuclear coverage and regulator VDR artifacts.'
  claimRefs:
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE044
  figureRefs:
  - FE003
- id: dependencies-and-risks
  title: Critical Dependencies and Technical Risks
  body: 'The main technical underwriting risk is a chain dependency: Xe-100 deployment needs final design, construction permits,
    site integration, fuel qualification, HALEU feedstock, a functioning TRISO-X fuel plant, graphite and helium supply, and
    committed customers able to finance nuclear construction. HALEU is the most visible bottleneck because DOE, ORNL and independent
    nuclear-supply commentary all describe a market in which demand is rising before large-scale domestic supply is proven.
    X-energy''s own filing adds that graphite and helium have limited vendor bases and that HALEU supply outside Russia or
    China may materially affect its business. The adverse lens from UCS is not that Xe-100 cannot work; it is that advanced
    non-light-water reactors should not receive a safety presumption before evidence is demonstrated. Diligence should therefore
    require a fuel-qualification closeout pack, HALEU allocation evidence, material supplier commitments, independent reliability
    modeling and a site-specific integration risk register before underwriting full-scale deployment.'
  claimRefs:
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
