- id: maturity-regulatory-quality
  title: Maturity, Regulatory and Quality Controls
  body: 'Product maturity is best characterized as advanced engineering plus regulatory execution, not commercial operation.
    NRC has engaged with X-energy on Xe-100 pre-application activities since 2018, and the Long Mott construction permit application
    creates a concrete path for the first Dow deployment. CNSC''s vendor design review is a constructive independent signal
    because staff did not identify fundamental barriers to licensing in Canada, while the TRISO-X Part 70 license is a concrete
    fuel-cycle milestone. Still, these controls do not equal a standard design approval or an operating license. X-energy''s
    own SEC risk language is useful discipline: final design maturity, site-specific permits, fuel production and final investment
    decisions must all land before first commercial operations in the early 2030s. Quality controls should therefore be diligence-tested
    through regulator correspondence, fuel qualification closure, facility inspections and customer-site integration plans.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
