  evidenceGaps:
  - type: missing-source
    severity: material
    topic: operating-reliability
    missingEvidence: Independent reliability, availability and maintainability model or operating data for a Xe-100 module.
    whyItMatters: The company page gives a target reliability, but underwriting needs evidence that target availability is
      credible before COD.
    diligencePath: Request RAM model, third-party review, component failure assumptions and comparison to HTR-PM operating
      history.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
    - TE006
  - type: missing-source
    severity: material
    topic: fuel-qualification
    missingEvidence: Final NRC-accepted TRISO-X qualification package after confirmatory irradiation and post-irradiation
      examination.
    whyItMatters: Fuel performance is central to the safety case and must close before reactor deployment can be de-risked.
    diligencePath: Obtain final qualification report, NRC staff safety evaluation updates and INL irradiation/post-irradiation
      results.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE004
    - TE006
  - type: private-evidence-only
    severity: material
    topic: HALEU-supply
    missingEvidence: Binding HALEU feedstock allocations, enrichment contracts and contingency supply plan for first cores
      and reloads.
    whyItMatters: Public sources identify HALEU as a market bottleneck and X-energy discloses material supply risk.
    diligencePath: Review DOE allocation letters, supplier contracts, delivery milestones and fallback procurement options.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE006
  - type: private-evidence-only
    severity: minor
    topic: services-contracts
    missingEvidence: Customer service, warranty, O&M, liability and SLA terms for deployment services.
    whyItMatters: Services are part of the delivered product but economics and risk allocation are not public.
    diligencePath: Request redacted term sheets or model services agreement for Dow/Energy Northwest-style projects.
    relatedQuestionRefs:
    - QE001
    - QE019
    - QE024
    - QE025
