- id: TV007
  title: Thesis-break and final diligence asks
  columns:
  - Topic
  - Missing evidence / trigger
  - Why it matters
  - Diligence path
  rows:
  - - Post-money and preferences
    - Series D price, liquidation stack and warrants
    - Determines true entry value and downside preference overhang
    - Request full financing documents and cap table
  - - Cash burn and runway
    - Monthly burn, committed project spend, runway after Series D
    - Determines dilution risk before first commercial revenue
    - Review board budget and treasury plan
  - - Customer contracts
    - Binding status and economics for Dow, Cascade, Centrica and Amazon-linked projects
    - Separates pipeline from backlog
    - Inspect executed PPAs, JDAs, EPC scopes and termination rights
  - - FOAK cost estimate
    - Long Mott and Cascade EPC budgets, contingency and cost-share mechanics
    - Drives capital need and customer affordability
    - Review project cost books and independent engineer reports
  - - Regulatory schedule
    - NRC construction permit and operating-license timelines
    - Controls revenue timing and valuation discount rate
    - Map NRC RAIs, safety review dates and critical path
  - - Unit economics
    - X-energy share of reactor, fuel and services revenue and gross margin
    - Needed for DCF rather than project-capex proxy
    - Request customer pricing, fuel contracts and margin bridge
  notes: These are thesis-break diligence requests; failure to obtain them should cap valuation appetite.
