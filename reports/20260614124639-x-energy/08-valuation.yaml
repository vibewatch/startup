- id: round-implied-valuation
  title: Round-implied private valuation chronology
  body: 'The round chronology shows a valuation reset rather than a clean markup ladder. The December 2022 Ares transaction
    proposed a public listing at roughly $1.8 billion pre-money, but the agreement was terminated in October 2023; that anchor
    is useful as a market-clearing attempt under SPAC conditions, not a live mark. The October 2024 Amazon-led Series C-1
    announcement verified approximately $500 million of new capital, with later X-energy language describing the C-1 as upsized
    to $700 million. Legal and partner sources corroborate the financing but do not provide a public post-money valuation.
    The November 2025 Series D is cleaner on size and syndicate: $700 million, led by Jane Street, with a broad public-equity-style
    investor roster. It is not clean on price. Because neither official releases nor fetched third-party coverage disclose
    post-money valuation, the valuation chapter records the $3 billion to $5 billion post-money range as an unverified estimate
    and carries it as a material evidence gap.'
