- id: scenario-dcf-and-kill-criteria
  title: Scenario valuation, DCF discipline and kill criteria
  body: 'A DCF for X-energy must be probability-weighted and milestone-gated. Deterministic cash flows would overstate precision
    because the first commercial projects still require regulatory approvals, construction execution, fuel scale-up, final
    customer investment decisions and financing structures. A bear case below $1.5 billion is not punitive if the Dow permit
    slips materially, if Cascade remains pre-construction, if cost estimates inflate, or if public SMR multiples compress.
    A base case of roughly $2.5 billion to $4.0 billion can be defended if Series D demand, Amazon/Dow/Cascade milestones
    and 20-plus-module pipeline credibility continue, but it remains dependent on undisclosed burn and preference terms. A
    bull case above $5.0 billion requires multiple financed projects and durable reactor/fuel/service margins. The adverse
    evidence from IEEFA and UCS makes the anti-thesis explicit: SMRs may prove too slow, too costly or too complex to earn
    venture-style returns within a fund life. Final diligence should therefore prioritize term sheets, customer contracts,
    NRC schedules, FOAK cost estimates, cash burn and liquidation preferences.'
