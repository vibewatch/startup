    severity: minor
    topic: Private comparable valuations
    missingEvidence: PitchBook, Crunchbase, Tracxn or data-room comparable valuation marks for TerraPower, Kairos, Holtec
      and Last Energy.
    whyItMatters: Private SMR valuation comps are likely paywalled or undisclosed, limiting triangulation.
    diligencePath: Use subscribed market-data tools or banker materials to benchmark private nuclear rounds.
