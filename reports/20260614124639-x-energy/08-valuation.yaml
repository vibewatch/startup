  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Series C-1 valuation
    missingEvidence: Primary or high-reputation source disclosing Series C-1 post-money valuation and preferences.
    whyItMatters: Without the actual post-money and liquidation stack, the $2.0B-$2.5B mark cannot be treated as verified.
    diligencePath: Request Series C-1 term sheet, cap table and board financing materials from the company.
    relatedQuestionRefs:
    - QV003
    - QV005
  - type: private-evidence-only
    severity: material
    topic: Series D valuation
    missingEvidence: Series D post-money valuation, share price, liquidation preference and investor rights.
    whyItMatters: The assignment’s $3B-$5B range is not publicly verified and drives entry-price discipline.
    diligencePath: Request Series D financing documents and investor presentation; corroborate against lead investor confirmation.
    relatedQuestionRefs:
    - QV006
    - QV009
    - QV030
  - type: missing-source
    severity: material
    topic: Customer contract economics
    missingEvidence: Binding customer order value, PPA/steam pricing, reactor supply margins and fuel-service economics.
    whyItMatters: Pipeline gigawatts cannot be converted to enterprise value without X-energy revenue capture and margin.
    diligencePath: Review Dow, Energy Northwest, Amazon-linked, Centrica and Doosan agreements under NDA.
    relatedQuestionRefs:
    - QV020
    - QV023
    - QV024
    - QV026
    relatedTableRefs:
