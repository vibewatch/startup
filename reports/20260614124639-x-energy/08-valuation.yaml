    severity: minor
    topic: Series C-1 size chronology
    missingEvidence: Clear reconciliation of the October 2024 approximately $500M initial Series C-1 and later upsized $700M
      C-1 close.
    whyItMatters: Round size affects cash runway and investor-demand interpretation, though not the undisclosed valuation.
    diligencePath: Ask company counsel for closing timeline, tranche dates and capitalization table by close.
    relatedQuestionRefs:
    - QV001
    - QV004
