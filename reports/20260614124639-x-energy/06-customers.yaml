- id: dow-industrial-reference
  title: 'Dow Seadrift: strongest named customer proof'
  body: 'Dow Seadrift is the diligence anchor because it has progressed through multiple commitment levels: 2022 collaboration, 2023 site selection and joint development agreement, 2024 construction-permit filing, and NRC project tracking. The buyer economics are unusually legible for an advanced reactor: Dow needs both high-temperature steam and electricity, and public releases describe roughly 800,000 pounds per hour of steam plus about 320 MWe from a four-unit Xe-100 plant. That dual-output profile matters because it gives X-energy a differentiated industrial wedge versus light-water SMRs built primarily for grid electricity. The limitation is timing and execution: the project is still pre-construction and its early-2030s operations target means customer reference value depends on licensing, site work, fuel readiness, and Dow’s continued willingness to underwrite a first-of-a-kind industrial nuclear project.'
  claimRefs:
