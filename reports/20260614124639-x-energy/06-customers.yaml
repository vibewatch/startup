chapter:
  number: 6
  title: Customers
  summary: 'X-energy customer proof is unusually concrete for an advanced nuclear startup but remains pre-commercial: Dow Seadrift and Energy Northwest/Amazon are the anchor pathways, while Dominion, OPG, Cavendish, Centrica, TransAlta, ENEC, Talen, and Doosan/KHNP are mostly option-creating relationships. The diligence burden is to verify contract durability, economics, and conversion through NRC and construction milestones.'
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation and buyer map
  body: 'X-energy does not yet show the broad, repeating customer base of a deployed industrial vendor; it shows a concentrated portfolio of anchor counterparties whose needs map cleanly to high-temperature heat, firm carbon-free power, and regional utility planning. Dow is the most concrete industrial buyer because the Seadrift project identifies a site, a process-steam use case, a four-module configuration, and a regulatory applicant. Energy Northwest and Amazon form the clearest utility-hyperscaler channel: the utility would own and operate reactors while Amazon supplies demand pull and capital. Dominion is a Virginia exploration path around North Anna rather than a committed plant. OPG, Cavendish, ENEC, TransAlta, Talen, Centrica, Doosan, KHNP, and DOE labs broaden the relationship map, but most are partner/prospect references rather than paying operating customers.'
