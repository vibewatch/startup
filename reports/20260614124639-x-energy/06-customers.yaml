- id: prospects-partners-and-reference-quality
  title: Prospects, partners, and reference quality
  body: The long tail of relationships shows breadth but not the same proof quality as Dow and Energy Northwest. OPG is a valuable Canadian utility relationship, yet its Darlington new-build path uses GE Hitachi BWRX-300, so X-energy’s OPG evidence is best read as industrial opportunity development rather than a first-build win. Cavendish creates UK HTGR and supplier-development options; Centrica adds a UK utility JDA; TransAlta and ENEC add Alberta and UAE study paths; Talen adds a U.S. power-producer prospect; and Doosan/KHNP provide Korean manufacturing and AI-infrastructure partnership signals. DOE lab relationships help technical credibility, especially fuel qualification at INL, but they do not prove commercial customer retention. The diligence task is therefore to separate reference calls that can verify procurement commitment from partner announcements that mainly preserve strategic optionality.
  claimRefs:
  - CU020
