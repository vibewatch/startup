- id: utility-hyperscaler-channel
  title: Utility and hyperscaler channel
  body: 'Energy Northwest plus Amazon is the most important expansion architecture. Energy Northwest’s original JDA contemplated up to twelve Xe-100 modules, and the 2024 Amazon package reframed the first phase as four advanced SMRs producing roughly 320 MW with a path to 960 MW total. Amazon also led X-energy financing, making the relationship more strategic than a simple electricity purchase. The structure is still indirect: Energy Northwest would construct, own, and operate the Washington reactors, while Amazon’s demand and power agreement support the project. Dominion adds a second hyperscaler-linked geography, but Amazon’s own release describes it as exploration near North Anna, so it should be valued as option value rather than committed backlog. Compared with Microsoft-Constellation and Google-Kairos, Amazon’s X-energy deal is earlier-stage but more vertically coupled to new SMR manufacturing scale-up.'
  claimRefs:
