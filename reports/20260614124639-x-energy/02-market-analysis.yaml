- id: TM004
  title: Growth Drivers and Constraints
  columns:
  - Driver or constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI data-center power growth
    - Driver
    - 2026–2030
    - Pulls hyperscalers toward firm 24/7 clean power
    - Verify project-level offtake volumes and delivery points
  - - Industrial decarbonization of steam
    - Driver
    - Late 2020s onward
    - Creates non-electric heat wedge for high-temperature reactors
    - Request site energy balance and steam-price benchmark
  - - DOE 200 GW advanced nuclear pathway
    - Driver
    - 2030–2050
    - Supports large top-down TAM and supply-chain mobilization
    - Track DOE target updates and appropriations
  - - Corporate nuclear validation
    - Driver
    - Current
    - Amazon and Google reduce category stigma for tech buyers
    - Check whether announcements become binding PPAs
  - - Part 53 / NRC modernization
    - Driver and constraint
    - 2026 onward
    - Improves optionality but does not eliminate review risk
    - Map X-energy milestones to NRC acceptance/review dates
  - - HALEU fuel availability
    - Constraint
    - Current through first deployments
    - Can delay non-light-water reactor commercialization
    - Audit fuel contracts, enrichment source, and inventory
  - - First-of-a-kind cost overruns
    - Constraint
    - Persistent until repeats
    - Can cancel projects or reset PPA price expectations
    - Demand EPC guarantees and sensitivity to $/MWh
  - - Grid interconnection and delivery
    - Constraint
    - Current
    - May slow data-center projects even if reactor is licensed
    - Confirm queue status and transmission plan
  - - Public perception and local siting
    - Constraint
    - Persistent
    - Can delay permits and raise financing risk
    - Review community engagement and state/local approvals
  notes: Drivers and constraints are separated by timing because some delay revenue while others can permanently reduce realized
    SOM.
