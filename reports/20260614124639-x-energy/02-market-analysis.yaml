tables:
- id: TM001
  title: Market Definition and Boundary
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance to X-energy
  rows:
  - - SMR firm electricity
    - Reactor modules, EPC, O&M, fuel, contracted MWh
    - Generic renewables PPAs, grid-only equipment
    - Utilities, hyperscalers, public power
    - Core Xe-100 electricity market
  - - Industrial process heat
    - High-temperature steam/heat integration, site permitting, operations
    - Fossil boilers, hydrogen/electrification equipment outside nuclear scope
    - Chemical/refining/steel site owner
    - Differentiates high-temperature gas reactor versus light-water SMRs
  - - Fuel supply and fabrication
    - TRISO/HALEU-adjacent fuel services and inventory
    - Uranium mining not tied to deployment contracts
    - Reactor owner or project company
    - Critical gating input for non-light-water advanced reactors
  - - Licensing and owner engineering
    - NRC pre-application, permit support, safety analysis
    - Customer generic permitting unrelated to reactor
    - Project company and utility sponsor
    - Determines time to revenue and milestone financing
  - - Status-quo substitutes
    - None; used as competitive benchmark
    - Gas turbines, renewables plus storage, life extensions
    - Same buyer budgets as nuclear projects
    - Caps willingness to pay and adoption pace
  notes: Boundary separates reactor/project revenue from adjacent power-market and customer-infrastructure spend; substitutes
    are listed to avoid overstating TAM.
