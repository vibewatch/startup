- id: buyer-segments
  title: Buyer, User, Payer Segmentation
  body: 'Four buyer pools matter most. Hyperscalers and data-center operators are the most visible new source of urgency:
    Amazon has linked X-energy to an initial 320 MW Energy Northwest project, while Google’s Kairos agreement validates the
    broader pattern of corporate buyers contracting for future nuclear output. In that segment the user is the data-center
    load, the buyer is the energy or sustainability organization, and the payer is the corporate power-procurement budget.
    Industrial heat buyers such as Dow are different: the user is the plant, the buyer is operations or energy management,
    and the payer ultimately depends on site-level decarbonization economics. Regulated utilities and public-power agencies
    own reliability and cost-recovery decisions, while DOE-funded demonstrations and national labs can de-risk first units
    without representing repeat commercial demand. This segmentation matters because each segment has a different adoption
    trigger and diligence ask.'
  claimRefs:
