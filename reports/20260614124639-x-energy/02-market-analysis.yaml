company:
  name: X-energy
chapter:
  number: 2
  title: Market Analysis
  summary: 'X-energy addresses a large but highly gated advanced-nuclear market: DOE’s 200 GW U.S. 2050 advanced-nuclear need
    and AI/data-center load growth support a large TAM, while the investable SAM/SOM depends on SMR projects that clear licensing,
    HALEU fuel, interconnection, construction-cost, and offtake hurdles.'
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Substitutes
  body: 'X-energy should be underwritten against the advanced-nuclear deployment market, with a narrower focus on SMRs that
    can sell firm electricity and high-temperature process heat. The boundary is not generic electricity generation: it includes
    the reactor island, modular construction and EPC package, fuel fabrication and supply, licensing and owner’s-engineering
    work, long-term operations, and contracted power or steam output that a customer can buy. It excludes renewables-only
    PPAs, gas-fired backup, battery storage, grid equipment inside a data center, and conventional large-reactor projects
    that do not share the modular factory-learning path. Status-quo substitutes are also material: hyperscalers can buy renewables
    plus gas-backed firming; industrial sites can electrify boilers, use hydrogen, or keep fossil steam; utilities can extend
    existing reactors, build gas, or procure storage. The market is therefore large but gated by bankable projects, not by
    a top-down electricity TAM.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
  figureRefs: []
- id: sizing-lenses
  title: Sizing Lenses and Forecast Range
  body: 'The cleanest top-down lens is DOE’s view that the United States may need about 200 GW of additional advanced nuclear
    by 2050, scaling total nuclear from roughly 100 GW to roughly 300 GW. That lens is more useful for X-energy than headline
    global SMR revenue reports, because it captures project capital and power-market demand rather than only vendor revenue.
    Analyst pages still help bracket market sentiment: 2026-era SMR revenue estimates range from Research and Markets’ $0.99B
    in 2026 to Fortune’s $6.13B in 2026 and Precedence’s $17.37B by 2035, with Grand View showing slower growth to $7.69B
    by 2030. These estimates should not be summed; their scopes appear inconsistent. A pragmatic sizing stack is TAM = 200
    GW U.S. advanced nuclear target, SAM = U.S. SMR and process-heat deployments that can clear licensing and fuel constraints,
    and SOM = X-energy’s disclosed 320 MW first project plus a probability-weighted share of the more-than-5 GW 2039 commercial
    target.'
