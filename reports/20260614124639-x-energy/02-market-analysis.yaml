- id: diligence-gaps
  title: Sizing Gaps and Diligence Asks
  body: 'The chapter’s largest uncertainty is not whether the addressable market is large; it is how quickly bankable, repeatable
    projects can convert policy need into signed orders. Public sources do not disclose the price, tenor, take-or-pay structure,
    termination rights, or cost-overrun sharing in the Amazon/Energy Northwest and Dow arrangements. Analyst reports expose
    headline market values but not enough methodology to separate reactor-vendor revenue from total project capex, replacement
    generation, or legacy categories. The core diligence asks are therefore commercial rather than rhetorical: request executed
    offtake terms, cost-recovery treatment, EPC guarantee structure, fuel-supply plan, interconnection status, NRC milestone
    schedule, and customer pipeline by segment. Until those documents are available, X-energy’s market should be valued with
    a wide range: very large TAM, credible SAM, and highly milestone-dependent SOM.'
  claimRefs:
  - CM012
  - CM038
  - CM039
  - CM040
  - CM041
