companyProfile:
  summary: >
    X-energy is a Rockville, Maryland advanced nuclear reactor and fuel company founded in 2009 by Kam
    Ghaffarian and led by CEO J. Clay Sell, the former U.S. Deputy Secretary of Energy. Its core product
    platform pairs the Xe-100, an 80 MWe high-temperature gas-cooled pebble-bed small modular reactor
    typically deployed as a 320 MWe four-pack capable of delivering ~565°C process steam to industrial
    customers, with proprietary TRISO-X coated-particle HALEU fuel manufactured at the company's TX-1
    facility in Oak Ridge, Tennessee. Selected for a $80M initial U.S. Department of Energy Advanced
    Reactor Demonstration Program (ARDP) award in 2020 with up to ~$1.2B in cost-share, X-energy survived
    a failed Ares Acquisition Corp II SPAC in 2022–2023, then raised a $235M Series C (Dec 2023), an
    Amazon-led ~$500M Series C-1 (Oct 2024, later upsized to ~$700M and closed Feb 2025), and a $700M
    Series D led by Jane Street in November 2025, before pricing an April 2026 Nasdaq IPO under ticker
    XE (~$1.1B in net proceeds). Anchor commercial relationships include Dow (a four-unit Xe-100 at
    Seadrift, Texas, with an NRC construction permit application filed by the Long Mott Energy JV in
    March 2025), Energy Northwest (a JDA for up to twelve Xe-100 modules / ~960 MW in central
    Washington), Amazon (Climate Pledge Fund investor and offtake support for the first Energy Northwest
    project plus a Dominion-anchored Virginia MOU), and international MOUs in Canada (OPG), the UK
    (Cavendish, Centrica), and Korea (KHNP, Doosan).
