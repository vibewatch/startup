  productSummary: >
    X-energy sells, jointly develops, and licenses the Xe-100 high-temperature gas-cooled pebble-bed
    small modular reactor — 80 MWe / 200 MWth per unit, typically deployed as a 320 MWe four-pack with
    online refueling, helium primary coolant, and ~565°C steam suitable for both electricity and
    industrial process heat — together with proprietary TRISO-X HALEU coated-particle fuel produced at
    a planned TX-1 fabrication facility in Oak Ridge, Tennessee, designed to manufacture roughly
    700,000 TRISO pebbles per year (enough for ~11 Xe-100 reactors). The company also sells
    pre-construction engineering, licensing support, and project-development services to industrial,
    utility, and government customers, and has been awarded DOE Advanced Reactor Demonstration Program
    cost-share for the first Xe-100 demonstration at Dow's Seadrift, Texas site.
  customerFocus: >
    Three primary buyer segments: (1) heavy-industrial process heat and behind-the-meter power, anchored
    by Dow (Seadrift, Texas) and additional industrial MOUs; (2) regulated utilities and public power
    deploying multi-module Xe-100 plants, anchored by Energy Northwest in central Washington and OPG in
    Canada; and (3) hyperscaler-backed data-center offtake led by Amazon (Climate Pledge Fund investor
    plus offtake support for the first Energy Northwest project and a Dominion-anchored Virginia MOU).
    International expansion targets include the UK (Cavendish, Centrica) and Korea (KHNP, Doosan).
  businessModel: >
    Multi-stream commercialization built around a long-duration capital project lifecycle: short-term
    revenue from DOE ARDP cost-share reimbursements, engineering and licensing services, and TRISO-X
    fuel-program funding; medium-term revenue from reactor design, EPC support and fuel sales as the
    first Xe-100 plants reach construction; and long-term recurring revenue from TRISO-X fuel
    fabrication, plant services, and potential ownership stakes in JV projects. Pricing per Xe-100,
    reactor ASP, EPC margin, TRISO-X pebble price and customer-level PPA economics are not publicly
    disclosed.
  stage: "Public (Nasdaq: XE, IPO April 2026)"
  fundingStatus: >
    Pre-revenue from commercial reactor sales but well-capitalized. Major financing chronology: 2020 DOE
    ARDP initial $80M award (cost-share up to ~$1.2B over multiple years); $235M Series C closed
