summary:
  headline: >
    X-energy has assembled a uniquely deep advanced-nuclear package — Xe-100 HTGR plus TRISO-X fuel,
    DOE ARDP cost-share, Dow + Energy Northwest + Amazon offtake, an 11 GW orderbook narrative, and a
    fresh Nasdaq listing — but with no Xe-100 reactor yet built, Q1 2026 opex running ~2.5x revenue,
    undisclosed reactor economics, and a long licensing and FOAK construction path ahead, current
    valuation is a probability-weighted strategic option rather than a defensible cash-flow story, and
    the appropriate stance is research-more with attractive optionality and high execution risk.
