  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation and ownership
    missingEvidence: Post-IPO market capitalization history, fully diluted ownership, lockups, and voting-control details were not fully analyzed in this chapter source pack.
    whyItMatters: The overview can state public-company status and IPO proceeds, but valuation stance and control risk require securities-filing and market-data work.
    diligencePath: Review X-energy S-1/prospectus, 10-Q, current capitalization table, lockup agreements, and market data as a dedicated financial chapter task.
    relatedQuestionRefs:
    - QO014
    - QO022
    relatedTableRefs:
