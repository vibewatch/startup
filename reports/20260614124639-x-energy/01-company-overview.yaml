company:
  name: X-energy
chapter:
  number: 1
  title: Company Overview
  summary: 'X-energy is a Rockville, Maryland advanced nuclear reactor and fuel company founded by Kam Ghaffarian in 2009, now public on Nasdaq as XE after an April 2026 IPO. Its ground-truth overview is a high-capital, policy-supported commercialization story: Xe-100 and TRISO-X have DOE ARDP, Dow, Amazon/Energy Northwest, and OPG validation, but the failed Ares SPAC and Q1 2026 expense base underscore substantial execution and economics risk.'
sections:
- id: identity-product-current-stage
  title: Identity, product, and public-company stage
  body: 'X-energy is the operating brand for X-Energy Reactor Company / X-Energy, Inc., a Rockville, Maryland advanced nuclear reactor and nuclear fuel company. The product narrative is unusually integrated for a nuclear startup: the Xe-100 reactor, an 80 MWe high-temperature gas-cooled SMR usually described in 320 MWe four-unit plants, is paired with proprietary TRISO-X fuel and a fuel-fabrication buildout in Oak Ridge. As of the June 2026 run date, the company is no longer merely a late-stage private venture; it launched and priced an April 2026 IPO, began Nasdaq trading as XE, and then reported first-quarter 2026 public-company metrics. The strongest cover facts therefore combine public capital-market status, ARDP-backed deployment progress, and still-immature commercial revenues. The overview should not present X-energy as revenue-scale utility infrastructure today: Q1 2026 revenue and grant income were $43.4 million while operating expense was $109.5 million, a profile consistent with
    FOAK reactor development rather than normalized project economics.'
