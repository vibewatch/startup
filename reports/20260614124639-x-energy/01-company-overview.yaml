  figureRefs: []
- id: capitalization-investor-stakeholders
  title: Capital formation and stakeholder map
  body: 'X-energy’s capital story has three phases. First, government cost-share under ARDP supplied credibility: DOE selected X-energy for an $80 million initial award in 2020 and the cooperative agreement described approximately $1.23 billion of DOE investment over seven years for a roughly $2.5 billion demonstration. Second, private-market financings scaled rapidly but included a failed public-market attempt. The December 2022 Ares SPAC announcement targeted a roughly $2 billion pre-money equity value; the parties terminated the deal in October 2023, explicitly citing market conditions and peer-company trading performance. Third, Amazon and other strategic investors changed the financing trajectory: a $500 million Series C-1 announcement in October 2024 was upsized to a $700 million C-1 close in February 2025, followed by a $700 million Series D in November 2025 and the $1.1 billion net-proceeds IPO in April 2026. Stakeholder diligence should focus less on headline capital and more on
    dependency alignment among Amazon, Dow, Energy Northwest, DOE, Jane Street/Ares/other financial investors, OPG, and fuel/supply-chain partners.'
  claimRefs:
