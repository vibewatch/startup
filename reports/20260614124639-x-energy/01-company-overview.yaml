  - type: missing-source
    severity: material
    topic: headcount and customer count
    missingEvidence: No authoritative current headcount or count of paying customers was found in the fetched sources.
    whyItMatters: Headcount and customer count are cover metrics that would improve stage and operating-scale calibration.
    diligencePath: Use public filings, investor-relations materials, LinkedIn only as triangulation, and management Q&A to verify current employee and customer counts.
    relatedQuestionRefs:
    - QO014
    - QO022
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: Series C-1 naming
    missingEvidence: October 2024 sources describe an approximately $500M Series C-1, while February 2025 sources describe the same round as upsized to $700M.
    whyItMatters: Later chapters must not double count the $500M announcement and $700M close as separate rounds.
    diligencePath: Treat October 2024 as announcement/anchor and February 2025 as final upsized close unless securities filings indicate separate tranches.
    relatedQuestionRefs:
    - QO007
    - QO008
    relatedTableRefs:
