- id: deployment-regulatory-milestones
  title: Deployment, regulatory, and adverse milestones
  body: 'The milestone record is unusually dense for an advanced nuclear company, and later chapters should reuse this chronology rather than re-invent it. ARDP originally pointed to an Energy Northwest demonstration, while the current DOE ARDP project page and company disclosures anchor the first proposed plant at Dow UCC Seadrift: a four-unit, 320 MWe-net Xe-100 project under NRC construction-permit review. Amazon adds a second platform by backing Energy Northwest deployments in Washington, while OPG and Canada-related regulatory work support the international option set. TRISO-X is a separate but critical enabling asset, with groundbreaking in Oak Ridge in 2022 and a 2026 Part 70 HALEU license. The adverse facts belong in the same chronology: the Ares SPAC failure is not a footnote, and public-company Q1 2026 results show a heavy expense base. Until X-energy converts permits, fuel supply, and customer options into operating reactors, the overview remains a high-capital, high-policy-support,
    high-execution-risk story. This sequencing matters.'
