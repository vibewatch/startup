- id: leadership-governance
  title: Founders, leadership, and governance
  body: 'The canonical founder fact is Kam Ghaffarian: X-energy’s own Ares transaction materials quote him saying he founded the company in 2009, and the current leadership page lists him as Founder & Chairman. J. Clay Sell is the continuing CEO, visible both at the 2020 ARDP award stage and on the current leadership roster. The current executive bench is broader than a founder-only organization—public names cover fuel, legal/administration, finance, operations, commercial, accounting, government affairs, growth strategy, science, global development, technology, nuclear, human capital, supply chain, IT, capture/proposals, and contracts. Board disclosures add Gregory Goff, Christopher Ginther, and Kathleen Hyle to the governance record. The diligence caveat is key-person and program-dependency risk: Ghaffarian and Sell remain the dominant public faces, while full board committees, voting control, and post-IPO governance mechanics are not established in the fetched chapter sources.'
