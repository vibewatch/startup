    severity: material
    topic: project economics
    missingEvidence: No source in this chapter provides final EPC cost, levelized cost, signed PPA price, or customer tariff for the first Xe-100 projects.
    whyItMatters: Commercial viability cannot be established from capital raised and regulatory milestones alone.
