  rows:
  - - Base case
    - Domestic HALEU and TRISO-X qualification align with first core need
    - No critical path slip beyond licensing review
    - No incremental bridge beyond planned project finance
    - Fuel procurement lead, DOE awards, NRC fuel topical milestones
  - - Constrained case
    - HALEU allocation lags or deconversion capacity is tight
    - 6-18 month slip to fuel readiness
    - Bridge financing and customer schedule renegotiation likely
    - DOE HALEU notices, supplier contract enforceability
