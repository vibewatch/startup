slug: x-energy
runDate: '2026-06-14'
company:
  name: X-energy
chapter:
  number: 7
  title: Risks
  summary: X-energy’s risk profile is dominated by staged NRC/CNSC licensing, FOAK HTGR fuel-and-graphite qualification, HALEU
    supply, and capital/customer timing before first commercial revenue. Adverse sources from UCS, IEEFA, NPEC, the Ares termination,
    NuScale cancellation, and megaproject comparables argue for treating the company as credible but still materially un-de-risked.
sections:
- id: regulatory-licensing-risk
  title: Regulatory and Licensing Risk
  body: 'X-energy’s most important near-term risk is not whether the Xe-100 has a credible regulatory conversation; it plainly
    does. The harder question is how much time and capital sit between pre-application engagement and a licenseable, constructible,
    operating plant. NRC records show engagement beginning in 2018, a Long Mott construction-permit application submitted
    in March 2025, and a May 2026 FONSI for the Dow site. Those are meaningful milestones, but the safety case remains exposed
    to acceptance review, requests for additional information, graphite and fuel qualification, and a first HTGR licensing
    path under newly finalized Part 53. The February 2024 readiness assessment is the most useful adverse primary source:
    it explicitly identified information gaps before the formal safety record could be complete. Treat regulatory success
    as staged probability, not a binary approval event.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR027
  - CR030
  - CR034
