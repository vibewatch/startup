- id: customer-market-and-partner-risk
  title: Customer, Market, and Partner Risk
  body: Dow, Amazon, and Energy Northwest materially improve X-energy’s customer narrative, but they do not yet remove market
    risk. Dow’s FONSI is an environmental milestone for the Seadrift project, not a public final investment decision or proof
    that the customer will accept all cost and schedule outcomes. Amazon’s role is strategically important because it links
    X-energy to hyperscaler load growth and a claimed multi-gigawatt deployment opportunity; however, public evidence does
    not disclose binding PPA economics, delivery penalties, site-level interconnection status, or price floors. Energy Northwest’s
    joint development agreement is useful partner proof, but a JDA is weaker than operating-plant revenue. The key diligence
    ask is to separate customer enthusiasm from bankable offtake commitments with milestone remedies.
  claimRefs:
  - CR024
  - CR025
  - CR026
  - CR036
  - CR043
  tableRefs:
  - TR005
  figureRefs: []
- id: public-perception-waste-proliferation-risk
  title: Public Perception, Waste, Proliferation, and Adverse-Event Risk
  body: The risks chapter should carry the report’s skeptical source base because public acceptance can break otherwise financeable
    nuclear projects. UCS argues advanced reactors must demonstrate safety, security, and environmental benefits rather than
    simply claim them. NPEC raises proliferation concerns around advanced reactors and new fuels, making HALEU safeguards
    a live issue. The public record reviewed here does not close spent TRISO disposal, long-term waste handling, or Seadrift
    community acceptance. Even if X-energy’s plant performs as designed, sector-wide events can contaminate the licensing
    and political environment because advanced reactors compete for public trust and regulator bandwidth. The diligence posture
    should require a safeguards plan, waste disposition path, emergency-planning narrative, and community acceptance evidence
    before underwriting low residual risk.
  claimRefs:
  - CR013
  - CR028
  - CR029
  - CR041
  - CR042
  tableRefs: []
  figureRefs: []
- id: governance-geopolitical-supply-chain-risk
  title: Governance, Geopolitical, and Supply-Chain Risk
  body: 'Governance and geopolitical risks are second-order but investable. X-energy benefits from management and investor
    networks that can navigate federal policy, including CEO Clay Sell’s policy background and strategic capital from Amazon-linked
    demand. The same fact pattern requires diligence into board control, conflicts, related-party exposure, and whether a
    capital-intensive nuclear program can keep executive focus through years of licensing. Supply-chain risk is partly geopolitical:
    domestic HALEU, graphite, specialized nuclear manufacturing, and qualified fuel fabrication are policy priorities in the
    U.S.-China advanced-reactor race, but policy priority is not executable inventory. Investors should underwrite X-energy
    as a project-finance and supply-chain company, not just a reactor-IP company, and demand milestone-level evidence for
    fuel, long-lead components, and counterparty commitments.'
  claimRefs:
  - CR038
  - CR039
  - CR040
  - CR031
  - CR032
