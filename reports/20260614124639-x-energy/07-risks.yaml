  - FR004
- id: technical-foak-risk
  title: Technical, FOAK, Fuel, and Quality Risk
  body: 'The Xe-100 concentrates multiple first-of-a-kind risks in one program: pebble-bed HTGR architecture, TRISO-X fuel,
    HALEU supply, graphite structural performance, helium-boundary assumptions, and industrial-scale fuel manufacturing QA.
    Company and DOE sources support the upside case for TRISO robustness, but the diligence issue is not generic TRISO physics;
    it is whether X-energy can manufacture, qualify, license, and load its specific fuel at commercial quality and schedule.
    NRC graphite engagement materials show that graphite qualification is a named review topic, not a solved footnote. HALEU
    is both an enabling design choice and a supply-chain chokepoint. A single weak layer—fuel coating QA, graphite methodology,
    pebble handling, or HALEU delivery—can cascade into licensing delay, customer delay, and additional financing need.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR031
  - CR032
  - CR033
  tableRefs:
  - TR002
  - TR003
  figureRefs:
  - FR001
- id: cost-schedule-capital-risk
  title: Cost, Schedule, and Capital-Intensity Risk
  body: 'The investment anti-thesis is a cumulative-delay problem. X-energy has raised large private rounds, including the
    Amazon-anchored Series C-1 and an announced $700 million Series D, but first commercial revenue still requires licensing,
    construction, fuel, customer FID, and commissioning. Comparable nuclear evidence is adverse. NuScale’s CFPP cancellation
    followed cost and price escalation; IEEFA uses that and broader SMR evidence to argue the category is too expensive, too
    slow, and too risky; Vogtle shows that even mature light-water projects can overrun original cost and schedule by years.
    X-energy is not Vogtle and not NuScale, but those cases define the investor’s prior: FOAK nuclear capital needs tend to
    rise before revenue proof arrives. DOE ARDP cost-share helps but also creates milestone and policy dependency.'
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR017
