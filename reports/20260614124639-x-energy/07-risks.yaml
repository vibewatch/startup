    - Fuel qualification or HALEU supply misses initial core window
    - Project construction may be ready before fuel is loadable
    - Major dilution or government support required
    - Board-level contingency plan and alternate supplier evidence
  - - Policy shock
    - Safeguards/proliferation controversy restricts HALEU movement
    - Licensing and public-acceptance friction increases
    - Higher compliance and security cost
    - NPEC/UCS critique response, safeguards plan, transport approvals
  notes: Scenarios are estimates from public fuel and policy evidence; private supplier contracts were not available.
