  shortDescription: >
    X-energy (legal entity X-Energy Reactor Company / X-Energy, Inc.) is a Rockville, Maryland advanced nuclear company
    developing the Xe-100 high-temperature gas-cooled small modular reactor (80 MWe per unit, typically deployed as a
    320 MWe four-pack) and the TRISO-X HALEU coated-particle fuel. Founded in 2009 by Kam Ghaffarian and led by CEO Clay
    Sell, the company has anchor customers in industrial heat (Dow at Seadrift, Texas), utility-scale generation (Energy
    Northwest in central Washington), hyperscaler-backed offtake (Amazon for AWS), and Canadian and UK partners (OPG,
    Cavendish, Centrica), backed by a DOE Advanced Reactor Demonstration Program cost-share, an Amazon-anchored Series
    C-1, a Jane Street-led Series D, and an April 2026 Nasdaq IPO under ticker XE.
