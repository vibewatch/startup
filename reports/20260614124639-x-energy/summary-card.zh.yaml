  topStrengths:
    - >-
      反应堆 + 燃料纵向一体化平台（Xe-100 HTGR + TRISO-X HALEU 燃料，Oak Ridge 的 TX-1 生产）在 SMR 同行中罕见， 让 X-energy 抓住最关键的供应链瓶颈——HALEU
      TRISO 燃料；几乎所有先进反应堆设计都卡在这里。
    - >-
      作为尚未产生反应堆收入的 SMR 开发商，商业验证组合几乎无人可比：Dow 在 Seadrift 的四台 Xe-100（Long Mott NRC 施工许可证申请已于 2025 年 3 月提交）、 Energy
      Northwest 在 Washington 最高 12 个模块 / 约 960 MW 的 JDA、Amazon Climate Pledge Fund 股权与购电支持，以及由 Dominion 锚定的 Virginia
      MOU。
    - 非稀释性公共支持很深：约 $1.2B DOE ARDP 成本分担、国会拨款、NRC–CNSC 联合监管推进，以及 2026 年 2 月 Part 70 HALEU 燃料制造许可证。 相比缺资金的同行，技术开发阶段风险明显降低。
    - >-
      资本位置显著好于其他私营 SMR 开发商：IPO 前股权融资约 $1.8B，加上 2026 年 4 月 IPO 净募资约 $1.1B，2026 年 3 月 31 日流动性为 $944M， 足以支撑首台 Xe-100 FOAK
      建设的多年现金跑道。
    - >-
      鹅卵石床 HTGR 产出约 565°C 高温蒸汽，能切入工业热脱碳（化工、炼化、氢能）；基于 LWR 的 SMR（NuScale、Holtec、BWRX-300、AP300）物理上难以覆盖。 这让 X-energy
      在拥挤的纯发电 SMR 战场之外，守住一个可防守的技术细分位。
    - >-
      投资人阵容广度和下注强度都突出：Series C-1、Series D 和 IPO 账簿覆盖 Amazon、Ken Griffin、Ares affiliates、NGP、University of Michigan
      endowment、 Segra、Jane Street、ARK Invest、Point72、Hood River、Galvanize、Reaves 和 XTX Ventures。
  topRisks:
    - >-
      Xe-100 反应堆尚未建成，也未获商业运营许可；首堆（FOAK）执行风险很重。相关先例都偏警示：NuScale 的 CFPP 在价格从 $89/MWh 涨到 $119/MWh 后于 2023 年 11 月取消， Vogtle
      3/4 超支超过 $17B，德国 THTR-300 鹅卵石床项目停运。
    - Q1 2026 披露收入和补助收入 $43.4M，运营支出 $109.5M（经营活动净现金流出 $67.3M）；公司结构性烧钱。 要在本十年末拿到商业反应堆收入，仍需要 ARDP 持续拨款、客户里程碑付款，或继续融资。
    - 反应堆 ASP、EPC 利润率、TRISO-X 鹅卵石燃料价格、客户级 PPA 电价、IPO 后市值，以及 Series C-1 / Series D 投后估值，或未公开披露，或只能估计； 因此无法防守任何具体股权价值倍数。
    - >-
      已披露约 11 GW / 144 台 SMR 的订单叙事，几乎全部由 MOU、LOI 和 JDA 构成（Dow、Energy
      Northwest、Amazon、Dominion、OPG、Cavendish、Centrica、KHNP、Doosan）； 尚无已签署的照付不议 PPA，转化率和时间表都未验证。
    - >-
      即便 TX-1 已获许可（Part 70，2026 年 2 月），HALEU 燃料供应仍是全行业瓶颈；美国浓缩产能扩张（Centrus、Urenco USA、Orano）需要多年， 而 TRISO-X 每年 700,000
      颗鹅卵石燃料的设计产能，远低于 144 台 SMR 订单所需。
    - >-
      HTGR 在美国没有运营许可先例；Part 53 尚未最终定稿，Long Mott 施工许可证和任何 Standard Design Approval 路径仍在推进中。 哪怕延误 12–24 个月，也会明显压缩客户 FID
      窗口和股权回报。
    - >-
      Ares Acquisition Corp II SPAC 交易失败（2022 年 12 月宣布，Pre-money 约 $2.0B；2023 年 10 月 31 日终止），叠加 Series C-1 / Series D
      投后估值未披露， 让估值标记历史断裂，当前公开市场估值更难承销。
    - >-
      Union of Concerned Scientists（Edwin Lyman）、IEEFA 和 NPEC 的反向专家意见，质疑 X-energy 计划中的安全、成本、HALEU 扩散和时间表假设。
      一旦美国核事件、HALEU 转移担忧或 DOE 预算收缩发生，声誉和政策风险都很实质。
  unresolvedGaps:
    - Series C-1 和 Series D 投后估值未公开披露；广泛报道的 $2.0–2.5B（C-1）和 $3–5B（D）估值来自第三方，未获确认； 2026-06-14 运行日的 IPO 后市值不在已抓取语料中。
    - Xe-100 反应堆 ASP、EPC 利润率、TRISO-X 鹅卵石燃料单价、项目级 PPA 电价，以及 Dow、Energy Northwest、Amazon、Dominion 采购价格均未披露； 无法承销单位经济性。
    - 员工数、薪酬费用拆分、R&D 与 SG&A 拆分，以及除 GW 等价表述外的反应堆项目积压订单金额，均未公开披露。
    - Long Mott（Dow Seadrift）和首个 Energy Northwest 项目尚无最终投资决策、已签 EPC 合同和项目融资结构； 公开记录中的商业运营日期（2029–2032）更像目标，不是合同承诺。
    - TX-1 燃料设施除 Geiger Brothers $40.8M 场地开发阶段之外的 capex 和投产时间表，以及 TRISO 原型生产爬坡至每年 700,000 颗鹅卵石燃料，仍是关键执行缺口。
    - IPO 后完整董事会构成和治理权利（委员会章程、投票协议、内部人锁定、创始人 / CEO 投票权）未在已抓取公开记录中汇总。
    - 已披露约 11 GW / 144 台 SMR 订单如何转化为带取消条款的合同积压订单，其经济性未披露；订单簿仍属定性表述。
