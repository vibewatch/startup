summary:
  headline: >
    X-energy 已拼出罕见完整的先进核能组合：Xe-100 HTGR、TRISO-X 燃料、DOE ARDP 成本分担、Dow + Energy Northwest + Amazon 的购电 / 采购支持、11 GW
    订单叙事，以及最新 Nasdaq 上市；但 Xe-100 尚未建成，Q1 2026 运营支出约为收入 2.5x，反应堆经济性未披露，许可和首堆建设还很长。
    现估值更像按概率折现的战略期权，而不是可防守的现金流故事；合适立场是继续研究：期权价值有吸引力，执行风险也高。
