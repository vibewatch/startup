chapter:
  number: 7
  title: Risks
  summary: Vantaca’s public risk profile is execution-heavy rather than existential. The company has real scale and capital, but the retained evidence shows meaningful exposure to hard migrations, support and training bottlenecks, sensitive resident and payment data, quasi-financial-regulatory obligations inside Vendor Pay, and an AI rollout whose ambition is broader than today’s disclosed production coverage. Competition and HOA reserve or delinquency stress add pressure, while governance disclosure remains thin for a $1.25B private company.
sections:
- id: risk-ranking-and-transmission
  title: 'The highest-severity risks are connected: AI rollout, customer implementation, and payments-compliance pressure'
  body: 'The biggest underwriting mistake would be to treat Vantaca as a simple vertical SaaS company with generic software risks. Public evidence supports a more complicated picture. Vantaca is well capitalized and clearly has real market presence, yet its most ambitious differentiation claim is now agentic AI operating across the back office of community-management firms, not merely accounting or workflow record-keeping. That matters because the disclosed numbers show both momentum and incompleteness: Vantaca serves more than 550 management companies and 6.5 million doors, but it separately disclosed only 250 management companies on its agentic-AI infrastructure. At the same time, the company says Fleet should expand AI coverage of human work from roughly 30% to 90% by the end of 2026. That combination creates the central transmission risk for this chapter. If implementation, support, or AI-quality issues slow rollout, the company can miss the operating leverage that helps justify a unicorn
    valuation; if payments or compliance issues surface at the same time, trust and expansion can deteriorate together rather than independently.'
