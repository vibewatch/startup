- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Failure mode
  - Why it matters
  - Likelihood
  - Impact
  - Current mitigation
  - Residual exposure
  - Diligence ask
  rows:
  - - Migration and board-change friction
    - A flawed cutover can threaten the management company’s own client relationships, not just software satisfaction.
    - High
    - High
    - Vantaca publishes migration playbooks and board-communication advice.
    - Switch risk remains existential because buyer trust is mediated through volunteer boards and resident experience.
    - Request migration timeline data, churn after go-live, and post-implementation board satisfaction by cohort.
  - - Support bottlenecks and ticket-only escalation
    - Slow responses can stall accounting, owner communication, and board-service workflows across many associations at once.
    - High
    - High
    - The company is hiring leadership and some review evidence is positive.
    - Rapid growth can still outrun specialist support depth and response quality.
    - Request first-response SLA, backlog by severity, support staffing ratio, and escalation coverage outside tickets.
  - - Bugs, module inconsistency, and weak end-user intuitiveness
    - Recurring glitches or confusing workflows suppress utilization and raise renewal friction for boards, homeowners, and service providers.
    - Medium-High
    - Medium-High
    - Vantaca continues to add features and some reviewers praise usability.
    - Public review evidence still shows recurring workarounds and homeowner/board usability complaints.
    - Request defect backlog trends, release regression rates, and portal-specific satisfaction metrics.
  - - Autonomous-AI quality and judgment-boundary risk
    - AI touching AP, AR, onboarding, and financial production can create high-consequence errors if workflow autonomy outruns controls.
    - High
    - High
    - Managed Services keeps humans on judgment-heavy tasks and the company openly distinguishes autonomy from simple assistance.
    - Public evidence does not disclose override rates, error rates, or exception volumes.
    - Request AI audit trails, exception handling, override frequency, customer incident examples, and reference calls.
  - - Cybersecurity and sensitive-data exposure
    - Vantaca handles payment data, homeowner information, operational history, bank details, and some SSNs.
    - Medium-High
    - High
    - SOC 2, Azure redundancy, encryption, SecureSky, and backup claims are public.
    - A breach could create fraud, legal, and uptime consequences simultaneously.
    - Request SOC 2 report, last penetration test, MFA adoption, privileged-access review cadence, and incident log.
  - - Third-party payment or network outage
    - Vendor Pay terms explicitly disclaim outages or delays caused solely by banking service providers or payment networks.
    - Medium
    - High
    - Multiple payment methods and partner infrastructure exist.
    - Outages outside Vantaca’s direct control can still block vendor payments and reconciliations for customers.
    - Request dependency-specific outage history, recovery playbooks, and customer compensation or make-good policy.
  notes: This register focuses on customer-visible failure modes that can slow rollout, damage trust, or weaken expansion even if top-line demand stays healthy.
