tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / obligation
  - Jurisdiction / counterparty
  - Current public status
  - Likelihood
  - Severity
  - Visible mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Vendor Pay BSA/AML, OFAC, NACHA, and KYB requirements
    - Grasshopper / Increase / payment rails / U.S. financial rules
    - Vendor Pay terms impose identity verification, sanctions compliance, transaction monitoring, and ACH return-rate thresholds.
    - High
    - High
    - Bank partners, monitoring, and written terms exist.
    - Payments can be suspended, funds held, or customers offboarded if controls fail or return rates spike.
    - Request ACH return-rate history, sanctions/escalation procedures, reserve methodology, and any bank remediation notices.
  - - HOA assessment collections and FDCPA handoff risk
    - Federal FDCPA plus state/community-association collection rules
    - CAI says high delinquencies damage reserves and financing; KSN says third-party collection mistakes can create fines, penalties, and reputational harm.
    - Medium-High
    - High
    - Collection policies, board votes, and legal review are standard mitigants.
    - Vantaca customers can face legal and trust costs exactly where the platform handles payments, ledgers, and owner communications.
    - Request standard collection-policy templates, outside-counsel workflow, and claim history tied to customer collections.
  - - FBO structure and pass-through insurance limitations
    - Grasshopper Bank FBO account architecture
    - Vendor Pay says funds sit in a Grasshopper-titled FBO account and default pass-through FDIC insurance is unavailable unless separately agreed.
    - Medium
    - Medium-High
    - Terms disclose the structure and bank partner explicitly.
    - Treasury misunderstandings or client cash stress can still become trust and operational issues.
    - Request product-by-product account architecture, customer disclosures, and any bespoke pass-through arrangements.
  - - Privacy, processor, and subprocessor obligations
    - U.S. state privacy laws plus GDPR/UK where applicable
    - Privacy policy and DPA define data categories, sharing, controller-processor roles, subprocessors, audits, and breach-notice duties.
    - Medium-High
    - High
    - SOC 2, DPA terms, and stated subprocessor protections provide a control baseline.
    - Sensitive resident, payment, and usage data plus AI-service sharing keep breach and compliance exposure material.
    - Request subprocessor list, SCC usage, retention schedule, pen-test summary, and recent privacy-impact assessments.
  - - Governance and disclosure opacity
    - Private-company disclosure posture / SEC visibility
    - SEC search shows only a 2022 Form D, and public materials do not disclose a board roster or post-round control map.
    - Medium
    - Medium-High
    - High-quality sponsors and advisor validation reduce pure credibility risk.
    - Investors still cannot judge downside governance protections or investor-control dynamics from public evidence.
    - Request board roster, board-observer rights, primary-versus-secondary split, preferences, vetoes, and information rights.
  notes: Rows are ordered by the ability of legal or compliance issues to disrupt customer trust, payment flows, or underwriting confidence rather than by abstract statutory importance.
  enumerationScope:
    coverage: partial
    basis: Rows cover the main public legal and compliance exposures visible in retained 2025-2026 materials; customer-specific contracts, bank exams, and private claim files remain unavailable.
