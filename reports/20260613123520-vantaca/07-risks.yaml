- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty / system
  - Role
  - Failure scenario
  - Severity
  - Visible mitigation
  - Residual exposure
  rows:
  - - Vendor Pay banking stack
    - Grasshopper Bank, Increase, NACHA, payment networks
    - Moves and reconciles money for customer vendor payments.
    - Bank, network, or compliance problems delay or suspend payment flows.
    - High
    - Disclosed partners, monitoring, and legal terms exist.
    - The dependency reaches directly into trust-sensitive customer cash operations.
  - - Cloud and security stack
    - Azure hosting plus SecureSky monitoring
    - Provides hosting, failover, backup, visibility, and threat detection.
    - A cloud or security control failure creates downtime or data loss at the system-of-record layer.
    - High
    - Redundancy, geo-replication, encryption, and SOC 2 claims are public.
    - Customers still depend on Vantaca proving those controls work under stress.
  - - Professional CAM buyer base
    - Management-company executives, finance teams, and volunteer boards
    - Controls software purchase, migration approval, and expansion.
    - A small number of large CAM relationships or skeptical boards slow rollout or expansion.
    - High
    - Vantaca has broad scale and references.
    - The company still monetizes through a finite set of B2B buyers, not direct household subscriptions.
  - - AI proof across the installed base
    - HOAi / Fleet deployment across customers
    - Supports the premium AI-native growth narrative.
    - AI adoption stalls at a subset of accounts and never becomes installed-base behavior.
    - High
    - 250 management companies already use the infrastructure and Managed Services narrows some risk.
    - The newest AI stack remains less than fully deployed across the disclosed customer base.
  - - Substitute CAM platforms
    - AppFolio, CINC, Enumerate, Buildium
    - Offer overlapping workflow, payments, self-service, security, or AI narratives.
    - Customers decide Vantaca is not differentiated enough to justify migration or premium spend.
    - Medium-High
    - Vantaca’s workflow depth and agentic narrative remain differentiated in marketing.
    - Rivals are not feature-static, and a public-market peer already warns that CAM can monetize more slowly.
  - - HOA cash-flow health
    - Association assessments, reserve budgets, and owner payment behavior
    - Funds the operational environment in which Vantaca’s customers sell service and payments workflows.
    - Reserve stress or high delinquencies force customers to focus on collections and cost containment rather than expansion.
    - Medium-High
    - Software can help process work faster and support transparency.
    - Macro stress can still hit software budgets, payment volume, and board patience at the same time.
  notes: Dependencies are ranked by how quickly a failure can propagate into customer trust, payment continuity, expansion, or the valuation narrative.
