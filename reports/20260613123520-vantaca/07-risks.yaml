  - Observed signal
  - Likelihood
  - Impact
  - Mitigation evidence
  - Residual exposure
  - Diligence path
  rows:
  - - AI product governance and model operations
    - Vantaca is pushing Fleet toward 90% work coverage while public proof today points to 250 management companies on the infrastructure.
    - High
    - High
    - Managed Services keeps humans on judgment-heavy tasks, and the company publishes a stricter proof standard than generic AI marketing.
    - Rollout speed can still outrun QA, exception handling, and customer change readiness.
    - Request AI governance owner, release gates, exception-rate dashboard, and customer escalation process.
  - - Customer success and implementation depth
    - Review evidence repeatedly cites thin training, long learning curves, and slow support.
    - High
    - High
    - Leadership hiring and customer-playbook content show the company is investing in scale.
    - If support depth lags growth, the company can win logos while damaging references.
    - Request customer-success org chart, migration success rate, and support tenure by segment.
  - - Payments and compliance operations
    - Vendor Pay introduces KYB, sanctions, return-rate, reserve, and outage-management work that normal SaaS does not carry.
    - High
    - High
    - Bank partners and contractual rules exist.
    - The operating model now includes quasi-financial-risk disciplines that may be easy to underestimate internally.
    - Request compliance staffing, bank audit findings, and payment-ops incident history.
  - - Leadership scaling and headcount absorption
    - Public markers moved from about 275 employees in January 2026 to 335 by spring 2026, alongside new CRO/CPO hires.
    - Medium-High
    - Medium-High
    - The October 2025 round gives the company resources to hire.
    - Rapid scaling can create coordination noise, uneven manager quality, or back-office strain.
    - Request attrition, span-of-control, and hiring-plan attainment versus roadmap dependencies.
  - - Governance visibility after the unicorn round
    - Public materials verify the round but not the current board roster, board rights, or control map.
    - Medium
    - High
    - Blue-chip investors and advisors lower pure fraud or credibility risk.
    - Opacity makes downside protections and decision rights hard to assess from outside.
    - Request board roster, consent matters, information rights, and any founder-vs-investor control summary.
  notes: Execution risk here is less about founder charisma and more about whether Vantaca can operationalize AI, payments, support, and hiring in parallel without service slippage.
