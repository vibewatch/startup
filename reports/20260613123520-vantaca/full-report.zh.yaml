      - number: '2.2'
        title: 受证据约束的规模测算与渗透信号
        blocks:
          - type: paragraph
            body: >-
              本章证据支持几个有用的规模观察角度，但不足以给出精确的 HOA 软件 TAM。广义需求侧，Foundation for Community Association Research 称 2024 年新增住房中
              67% 位于协会内，约 300 万户家庭的公寓或 HOA 月费超过 USD 500。Fact Book 仪表盘保留了按州划分的协会和人口数据；Massachusetts 一页纸给出一个具体州样本：超过
              11,500 个协会覆盖 657,800 套住宅，年度摊派接近 USD 3.3B。软件侧，Mordor 估计全球物业管理软件 2026 年为 USD 6.53B，到 2031 年增至 USD
              9.93B，其中住宅物业和物业经理占最大切片。因此，Vantaca 自身 500 多家管理公司和 600 万户家庭足迹，作为渗透信号有意义；但这里的公开来源没有给出买方总体分母，无法把这一装机规模换算成专业
              CAM 市场份额。正确的承保姿态，是同时保留这些视角，而不是硬凑一个缺乏支撑的 HOA 软件 TAM 数字。
