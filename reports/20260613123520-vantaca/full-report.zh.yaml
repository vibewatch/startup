  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 多头逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 融资信号
        - Cove Hill 在独角兽规模上支付了真实的少数股权成长价格，JMI 也继续留在交易中。
        - 少数股权轮新闻没有披露支撑该价格的经济条款或保护机制。
        - 提供完整股权结构变化、持股比例、董事会权利和清算优先权堆叠。
      - - 增长证明
        - 官方 2025 年材料引用了 95% 同比增长和 500+ 家管理公司。
        - 增长说法来自公司，尚未与经审计收入或 ARR 对齐。
        - 提供董事会批准的月度收入桥、外部审计或贷款人级别证据。
      - - AI / 产品深度
        - HOAi、Fleet，以及支付 / 工作流扩张显示出真实平台宽度，而不是一层薄功能。
        - 使用指标无法证明变现、留存或毛利率耐久性。
        - 按 AI 和支付模块展示附加率、定价、毛利率和扩张情况。
      - - 品类领导力
        - 最新官方指标和 CINC 规模说明，社区管理软件可以支撑大型平台。
        - AppFolio 的 10-K 显示，社区协会采用难度可能高于更宽泛的住宅物业管理。
        - 提供 CAM 客户专属的队列留存、实施成功率和采用数据。
      - - 相对估值
        - 增速更快、AI 优先的私有垂直 SaaS 公司，可以相对公开可比公司享有溢价。
        - 如果收入更接近 $25M-$50M 区间，而不是 $85M 代理值，溢价就会变得极端。
        - 对齐各类收入代理值，并证明哪种视角最接近当前现实。
      - - 客户体验
        - Vantaca 对外强调强导入、可迁移性和自动化 ROI。
        - 反向评论提到复杂度、支持响应偏弱，以及僵硬的三年合同。
        - 分享按客户年限划分的流失、NPS、支持 SLA，以及覆盖失败和成功迁移的客户背调。
    notes: 反向逻辑主要取决于披露质量和经营耐久性，而不是否认 Vantaca 已经具备真实产品和市场动能。
