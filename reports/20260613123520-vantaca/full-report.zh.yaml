      - number: '7.2'
        title: 实施、支持和 AI 治理风险，是最清晰可见的客户侧失败模式
        blocks:
          - type: paragraph
            body: >-
              Vantaca 自己的材料也承认，这一品类里的软件切换对客户生死攸关。公司的迁移文章称，管理公司担心切换做砸会导致业委会换掉服务商；Vantaca
              关于可迁移性的表述，也直接把糟糕的可迁移性定义为锁定风险。独立评论证据解释了为什么这件事重要。Software Advice、Software Finder、SelectHub，甚至一条归档的 G2
              评论，都指向反复出现的复杂度、漫长培训曲线、工单式支持响应慢，以及 bug 或模块问题。对一个高速增长的企业级产品来说，这些抱怨本身未必致命；但 Vantaca 眼下的 AI
              逻辑，是让系统在会计、导入、沟通等运营闭环里自主执行，问题就更严重。Vantaca 自己的 AI
              防伪文章也隐含承认了风险：买方应区分真正的端到端自动化与功能演示，并要求具名客户参考和可衡量的工作流结果。因此，承销关注点不只是软件好不好用，而是产品宽度、实施深度和 AI
              治理能否跟上商业叙事的扩张速度。NIST 的 AI Risk Management Framework playbook 也支持这一框架：生产级 AI 系统必须把治理、监控和可信控制作为核心要求。
