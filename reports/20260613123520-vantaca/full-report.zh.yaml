  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 真实收入低于更高代理值
        - 管理层证据显示当前收入显著低于 $85M 代理值，或低于支撑上一轮倍数所需水平。
        - “2025 年价格只是高溢价成长型软件估值”的论点会坍塌。
        - 重置到悲观区间，并要求相对公开可比倍数有更大折价。
      - - 留存 / 支持质量不及预期
        - 队列数据或客户背调显示 NRR 偏弱、流失升高，或围绕支持和导入的反复投诉。
        - AI 优先增长会变成耐久性更弱、质量更低的收入故事。
        - 将支持和实施视为影响估值的因素，而不只是运营噪音。
      - - 支付 / AI 变现滞后于使用
        - 高任务量或供应商采用未能转化为付费附加、抽成率或利润率扩张。
        - 支付高于公开可比倍数的主要理由被拿掉。
        - 下调乐观情景权重，并把产品使用视为功能证明，而不是经济性证明。
      - - 轮次条款证明投资人受保护
        - 优先股堆叠、下行保护，或大额老股部分严重影响了披露的新闻价格。
        - 轮次新闻对普通股内在价值的穿透解读会变弱。
        - 按非普通股经济性调整承销，并扩大所需回报。
      - - 新融资重置估值标记
        - 任何后续融资或二级交易以等于或低于 2025 年估值成交。
        - 说明随着经营证据成熟，2025 年 10 月价格并不耐久。
        - 用更新价格作为锚，并重新审视所有上行假设。
    notes: 每个触发项都可监测，并直接决定当前观察 / 偏高立场是否应改变。
