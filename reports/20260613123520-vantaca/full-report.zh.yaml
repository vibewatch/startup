        title: 融资锚点与价格发现质量
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的估值事实不是模型输出，而是一笔真实融资。2025 年 10 月，Vantaca、JMI Equity、William Blair、PR
              Newswire、WilmingtonBiz、Business North Carolina 和 Hypepotamus 都指向同一个核心数据点：Cove Hill Partners 领投超过 $300M
              的少数股权成长投资，投后估值 $1.25B，JMI 继续持股，管理层保留控制权。这比传闻或过期数据库标记强得多。问题在于，同一组来源没有披露判断该轮价格能否作为内在价值沿用所需的输入项。95%
              的同比增长来自公司披露，并非审计数据。收入、毛利率、NRR 和现金生成仍未披露。即便独立收入代理也互相冲突：Inc. 资料指向 $25M-$50M 的收入区间，而 GetLatka 声称 2025 年收入为
              $85M，却仍显示过期的 $69M 估值和 $0 融资。因此，最新一轮融资是真实的价格信号，但仍不完整。
