  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入和 ARR
        - 2024-2026 年月度收入桥、ARR，以及 $85M 代理值与 Inc. 收入区间的对账。
        - 单这一项就决定上一轮隐含倍数究竟是偏高但可辩护，还是极端。
        - 管理层 CFO 材料包；经审计报表；董事会材料对账。
      - - 收入结构和毛利率
        - 软件、服务、支付和 AI 收入拆分，以及各收入流毛利率。
        - 决定 Vantaca 是否配得上软件式倍数，还是应因低质量收入组合而折价。
        - 产品线 P&L 和支付毛利润桥。
      - - 留存和集中度
        - 总留存、NRR、流失、头部客户集中度，以及按管理公司规模划分的客户组合。
        - 需要用来检验品类领导力是耐久还是脆弱。
        - 队列文件、客户集中度明细和客户背调。
      - - 轮次经济性
        - Cove Hill 交易的新股与老股拆分、持股比例、董事会权利、优先权和保留事项。
        - 决定新闻估值对普通股承销到底有多少信息量。
        - 股权结构表、股份购买协议、投资人权利协议和董事会会议纪要。
      - - 支付和 AI 变现
        - TPV、抽成率、供应商支付经济性、AI 附加率、定价，以及基础设施成本负担。
        - 支付和 AI 变现是公司维持溢价倍数最可信的理由。
        - 支付仪表盘、单位经济性备忘录和 AI 产品定价文件。
      - - 实施和支持质量
        - 上线周期、迁移成功率、SLA 达成率、工单解决情况和流失原因。
        - 反向评论证据显示，执行质量对估值的影响可能超过营销口径承认的程度。
        - 支持 KPI 仪表盘、迁移队列，以及丢单 / 流失复盘。
    notes: 要求有意写得具体，因为公开记录不足以让投资人有信心地承销上一轮价格。
