            - label: AP / AR / 关账团队
              tone: positive
              detail: 工作流密度高，ROI 可量化。
            - label: AppFolio 与 Vantaca 的工作流证据
              tone: positive
              detail: 支付、预算和审批自动化的证据扎实。
            - label: 高
              tone: positive
              detail: 预算归属清楚，月度痛点反复出现。
        - label: 董事会与房主
          values:
            - label: 协会发起方
