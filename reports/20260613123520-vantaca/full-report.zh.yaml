      - - 信心
        - 中
        - 轮次质量很强，但背后的经营披露仍太薄，无法形成高确信度估值。
      - - 风险评级
        - 高
        - 收入质量不透明、轮次条款未披露，再加上一些实施 / 支持端反向信号，下行风险仍不小。
      - - 估值立场
        - 偏高
        - 只有在更高收入代理值、强留存和 AI 变现假设成立时，$1.25B 价格才说得通。
      - - 最新硬价格锚
        - 2025 年 10 月少数股权轮估值 $1.25B
        - 将其视为真实第三方价格发现，而不是证明同一价格在 2026 年 6 月仍具备内在合理性。
      - - 最有用的承销视角
        - 基于区间的 EV / 收入框架，而不是 DCF
        - 公开证据在利润率和现金流上过于不完整，无法支撑严肃的 DCF 或 40 法则式结论。
      - - 上调触发项
        - 私有证据显示收入接近 $85M，且留存强、支付 / 毛利率经济性健康
        - 会让本轮倍数更接近高溢价但可解释的成长型软件结果。
      - - 主要下行触发项
        - 收入更接近 $25M-$50M 区间，或有证据显示留存 / 支持质量偏弱
        - 会让上一轮相对公开可比公司和先例交易显得激进得多。
    notes: 建议对价格和证据敏感，而不是泛泛的公司质量评分。
