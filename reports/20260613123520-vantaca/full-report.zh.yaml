      - number: '8.3'
        title: 2025 年独角兽价格为什么可能站得住，也可能偏高
        blocks:
          - type: paragraph
            body: >-
              乐观情景确实存在。Vantaca 的投资人财团可信，公司显然在 HOA / 社区管理市场拥有有意义的份额，官方 2026 年材料也显示产品使用深度超出普通 SaaS 仪表盘故事：超过 500 万个 AI
              任务、已有 250 家管理公司使用该基础设施，并提出到 2026 年底把 AI 覆盖率从 30% 提高到 90%。CINC 的规模也说明，这一品类可以支撑大型平台；Mordor
              的市场研究则支持软件和支付继续数字化。这些事实解释了为什么较高的私募标记能够达成。但悲观情景同样真实。AppFolio 的 10-K
              明确称，社区协会的采用率通常低于住宅客户，意味着该细分市场在运营上可能比更广义的物业管理市场更难。Vantaca
              仍未披露当前收入、收入结构、支付经济性、留存或利润率。负面评论证据也带来了产品复杂度、支持响应和合同刚性方面的执行风险。正确结论不是 $1.25B
              为假，而是公开记录今天无法验证足够强的收入假设；只有在更强收入假设下，证据才支撑这个价格。
