  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图与加权压力
        blocks:
          - type: paragraph
            body: >-
              Vantaca 已不再像一个小众 HOA 点状方案那样竞争。2025 年 10 月融资和 HOAi 收购，推动公司把自己推向市场，成为 AI
              优先的社区协会操作系统；但买方真正的决策集合，比一张供应商对供应商的功能清单更宽。CINC、FRONTSTEPS、Enumerate、Condo Control 等直接 HOA /
              社区协会操作系统，争夺同一笔管理公司预算，也常常销售同一个承诺：集成会计、居民或房主体验、董事会可见性和运营效率。AppFolio、Buildium、Propertyware
              等相邻物业管理套件扩大了竞争场，因为很多运营方管理混合组合，即便 HOA 工作流不是平台原生重心，也可能偏好更宽的栈。因此，公开证据支持按直接 HOA
              重叠、公开规模证明和迁移摩擦给竞争对手加权，而不是只数客户标识。按这个标准，CINC 是最干净的直接既有厂商基准，FRONTSTEPS 和 Enumerate 仍是严肃的 HOA 原生替代，Condo
              Control 正凭更深会计能力上探市场；AppFolio 加 Buildium 也重要，因为它们能赢下更广泛的组合型平台授权。
