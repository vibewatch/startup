        - 直接 HOA / 社区管理平台
        - $300M+ 少数股权轮，估值 $1.25B；500+ 家管理公司；Oct-2025 为 6M 户家庭；当前网站为 50K+ 个协会和 6.5M+ 名业主
        - 协会管理公司、董事会、业主、供应商
