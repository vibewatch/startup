        - 响应时间恶化，或有重要客户迁移后流失。
        - 说明产品宽度压过了服务深度。
        - 要求更深入的客户背调，并把服务投入视为利润率压力。
      - - 支付合规事件
        - NACHA 退回率、银行整改、服务暂停、资金冻结
        - 出现重大银行警告、阈值突破，或客户资金被冻结。
        - 支付会从变现上行空间，变成放大信任和流动性风险的因素。
        - 隔离支付敞口，或削减任何由支付驱动的上行假设。
      - - 安全或隐私事故
        - 事故日志、SOC 2 状态、监管方 / 客户通知
        - 出现重大泄露、客户通知延迟，或审计 / 合规资质丧失。
        - 会伤害续约、引发法律成本，并让 AI / 数据治理受到质疑。
        - 暂停承销，直到整改情况和客户留存影响清楚。
      - - 客户端宏观拖欠和储备金压力
        - 头部账户的欠缴评估费水平、储备金缺口、专项评估频率
        - 客户组合出现拖欠上升或储备金压力，进而改变软件支出和支付行为。
        - CAM 买家可能更关注催收、预算更受限，也更难容忍平台摩擦。
        - 压测留存和支付量假设，并重新评估集中度风险。
      - - 治理披露仍不透明
        - 董事会图谱、控制权、主次交易拆分、优先权细节
        - 管理层在尽调中无法提供清晰的董事会 / 控制权摘要。
        - 按当前价格，下行保护和决策权仍无法判断。
        - 视为仍在进行的尽调阻断项，或要求价格纪律和更强信息权。
    notes: 这些触发项可由尽调团队监测，并直接对应投资、重新定价或暂停决定，而不是抽象风险分类。
