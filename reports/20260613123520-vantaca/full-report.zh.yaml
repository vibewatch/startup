        title: 收入模型、定价不透明与销售动作
        blocks:
          - type: paragraph
            body: >-
              公开证据支持把 Vantaca 看作一家面向企业、顾问式销售的垂直 SaaS 平台，带有服务和金融科技邻接，而不是简单的自助 HOA
              app。官方页面推动买方申请演示，而不是在线购买；网站还明确宣传实施和上线、会计服务、战略客户管理和客户成功。这指向一种收入模型：核心软件订阅叠加服务较重的部署和支持。公司和投资方材料也强调集成支付、商业智能、HOAi、Vantaca
              Vendor 和 Vantaca Home，暗示交叉销售和生态变现。问题在于透明度：Vantaca
              不公布价格表、标准合同条款或任何收入结构。第三方目录用弱信号补空白——报价制、按用户定价、估计起始区间，以及关于长合同的用户轶事——但这些不足以建模实际
              ACV、服务挂载或支付抽成率。承保时应把定价视为企业协商，把收入结构视为未披露，直到管理层提供合同、价目表和按产品线拆分的订单额。
