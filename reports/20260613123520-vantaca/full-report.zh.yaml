  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Vantaca
              的产品最好理解为面向社区协会管理公司的、按角色组织的工作流平台，而不是泛物业管理账本。买方通常是管理公司，但产品界面至少横跨四类用户：内部会计和运营团队、协会董事会、房主和服务供应商。公开模块集合在这些角色之间是连贯的。核心平台处理运营骨干；Home
              为居民和董事会提供自助访问；Vendor 数字化付款和供应商状态；Pay 管理居民收款；HOAi
              作为自动化层横跨整个栈。这一点重要，因为公司的工作流主张不只是让一个办公室内部数据移动更快，而是用互联动作替代电话、邮件、手工报表准备、支付状态追踪、离线现场记录和董事会材料包组装，并让这些动作留在记录系统中。连
              Vantaca 的迁移内容也支撑这种工作流框架：董事会调查、按角色设置模块推动者，以及自动化报表输出，都被呈现为不丢账户完成切换的路径。
