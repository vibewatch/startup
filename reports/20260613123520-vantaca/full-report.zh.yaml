      - number: '7.3'
        title: 敏感数据、Vendor Pay 和 HOA 催收，让 Vantaca 面临比核心 SaaS 更严的合规体系
        blocks:
          - type: paragraph
            body: >-
              保留下来的来源显示，最严重的非产品风险扩张来自安全、隐私和支付。Vantaca 自己的材料强调，平台处理财务数据、业主沟通和运营工作流；其支持文章称，银行账号、SSN
              等高度敏感字段存放在加密数据库中。隐私政策进一步扩大了暴露面：支付、交易、设备、使用数据都被列入范围，并会与 AI 服务、支付处理商、支持工具和专业顾问共享。DPA 通过明确控制者 /
              处理者角色、子处理方义务和违约通知责任，部分缓释了这一点。但 Vendor Pay 实质上改变了风险画像。其法律条款引入 Grasshopper Bank 和 Increase 作为关键依赖、客户不能直接控制的
              FBO 账户结构、默认不穿透享受 FDIC 保障、KYB 和受益所有人核查、BSA/AML 与 OFAC 义务、NACHA 退票率阈值，以及暂停服务或冻结资金的权利。在这一背景下，CAI 和 KSN
              把下游市场风险说得很清楚：高欠费率会削弱储备金和融资资格；催收一旦交给第三方法律顾问，FDCPA 错误可能带来罚款和声誉损害。因此，Vantaca 不只是在卖工作流软件，而是在脆弱的 HOA
              现金流环境中，把自己接入受监管的支付和催收工作流。
