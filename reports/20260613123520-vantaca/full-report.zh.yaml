  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 可比价值
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful public, precedent, and direct-category reference points for valuing Vantaca
        as of 2026-06-13; they are not an exhaustive universe of property-tech or vertical-SaaS companies.
    rows:
      - - AppFolio
        - 公开 EV / 销售额和 FY2026 展望
        - 约 $5.59B EV；5.61x EV / 销售额；FY2026 收入指引 $1.110B-$1.125B
        - 最接近的已披露公开可比公司，具备社区协会敞口和真实盈利披露。
        - 比 Vantaca 宽泛且成熟得多，有完整上市公司报告和更大装机基础。
      - - ServiceTitan
        - 公开 EV / 销售额
        - 约 $6.00B EV；5.92x EV / 销售额
        - 可作为高溢价垂直 SaaS 成长可比，观察公开市场如何给有工作流深度的品类软件定价。
        - 不是物业管理软件，与 HOA / 社区协会运营的关系也没那么直接。
      - - RealPage 私有化
        - 交易收入倍数
        - 含净债务约 $10.2B 价值；约 8.9x 2020 TTM 收入
        - 物业管理软件并购先例，倍数高于当前公开可比公司。
        - 交易于 2021 年完成，早于后续软件倍数重置，且收入基数更大、披露更充分。
      - - CINC Systems
        - 直接品类规模参照
        - 1,000+ 家管理公司；55,000+ 个协会；6M+ 户；2025 年支付 $25B；无公开估值
        - 说明 HOA / CAM 品类可以支撑大规模平台和强支付量。
        - 公司为私有，收入、利润率和估值均未披露，因此它是战略规模可比，而不是定价可比。
      - - Vantaca 上一轮
        - 私有融资锚
        - 2025 年 10 月估值 $1.25B，少数股权投资 $300M+
        - 最直接的价格信号，因为这是公司自身最新公开融资事件。
        - 新闻价格省略了持股比例、主次交易混合、优先权和董事会权利细节。
      - - Vantaca 收入代理视角
        - 上一轮隐含 EV / 收入
        - 基于 $85M 代理值约 14.7x；基于 $25M-$50M 区间约 25x-50x
        - 清楚说明估值争论为什么取决于哪种收入视角最接近现实。
        - 两种收入视角都属间接且未经审计，因此隐含倍数仍是估计，不是已定事实。
    notes: Vantaca 隐含倍数明确来自公开代理值估计，不应作为经审计估值输入使用。
