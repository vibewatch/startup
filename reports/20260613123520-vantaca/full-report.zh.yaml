  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高严重度风险是相互连接的：AI 推出、客户实施和支付合规压力
        blocks:
          - type: paragraph
            body: >-
              最大的承保错误，是把 Vantaca 当作一家只有通用软件风险的简单垂直 SaaS 公司。公开证据支持一个更复杂的图景。Vantaca 资本充足，且明显拥有真实市场存在；但它现在最雄心勃勃的差异化主张，是智能体
              AI 运行在社区管理公司的后台，而不只是会计或工作流记录保存。这一点重要，因为已披露数字同时显示动能和不完整：Vantaca 服务超过 550 家管理公司和 650 万户，但它另行披露其智能体 AI
              基础设施上只有 250 家管理公司。与此同时，公司称 Fleet 应在 2026 年底前把 AI 对人类工作的覆盖从约 30% 扩到 90%。这一组合构成本章的核心传导风险。如果实施、支持或 AI
              质量问题拖慢推出，公司可能错失支撑独角兽估值的运营杠杆；如果支付或合规问题同期浮现，信任和扩张可能一起恶化，而不是各自独立。
            claimRefs:
