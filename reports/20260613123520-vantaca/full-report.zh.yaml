        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Vantaca 在品类位置和融资可得性上有吸引力，但几乎所有决定 SaaS 经济性持久度的指标都披露不足。最强证据支持企业客户规模、工作流渗透、AI
              使用和财务赞助方胃口。最弱证据在收入质量：被广泛重复的 95%
              增长数字，是公司供应的说法，经官方和付费发布渠道传播，却没有经审计基数、期间定义或已调节收入数字。定价透明度同样差：官方只提供演示入口，第三方为报价制估计，还有一条负面评论指称多年合同和递增涨价。冲突数据库进一步说明需要尽调而不是自信：GetLatka
              仍显示 $69M 估值且无外部融资，明显滞后于 2025 年轮次。实际结论是，Vantaca
              可能有足够资本继续扩张；但在管理层提供按来源拆分收入、支付经济性、支持和服务成本负担、合同条款以及当前现金跑道桥之前，投资者不应按利润率、留存或现金流假设承保。
