      - number: '7.4'
        title: 竞争、HOA 宏观压力和披露稀疏，使 2025 轮融资后残余风险仍然偏高
        blocks:
          - type: paragraph
            body: >-
              Vantaca 的品类叙事很强，但公开证据不足以证明公司具备独一无二的抗冲击能力。AppFolio 的 2025 年 10-K 明确称，社区协会对订阅和增值服务的采用率通常低于住宅客户；这直接提示，CAM
              客户的深度变现可能比更广义的物业管理客户更难。与此同时，AppFolio、CINC、Enumerate 和 Buildium 都在公开营销自助服务、支付、业委会工作流、数据安全、合规工具或 AI
              的组合。单个页面都不能证明竞争对手已达到同等水平，但合在一起说明周边市场并没有睡着。宏观条件也并非中性。CAI 的基础设施研究称，意外资本项目很常见；CAI 的催收政策称，高欠费会损害储备金和融资。这会让 CAM
              买方更看重成本、更关注催收，也更难容忍有缺陷的软件切换。最后，对一家达到这一估值的公司而言，治理可见度仍然异常薄。公开标题和文件能验证该轮融资，但保留材料仍看不到当前董事会名单、控制权地图或详细下行情景保护条款。这不能证明存在治理问题；但意味着投资人被要求在缺口周围做承销判断。
