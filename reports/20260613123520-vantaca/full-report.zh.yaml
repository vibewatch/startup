              持久性是公开记录明显变弱的地方。单个案例研究提供了部分续约代理：RedBrick 报告增长同时保持 93% 留存，Desert Vista 报告自创立以来客户留存 99%，Eclipse 被引用为 170
              个协会迁移且零客户流失。这些信息有用，但不能替代公司层面的 NRR、GRR、logo 流失、队列曲线或按细分市场划分的
              NPS。保留公开来源包中没有出现这些指标。独立评论聚合器也给公司撰写的成功故事降温。SelectHub 总结了有关终端用户体验有限、巡检模块问题和 bug 的投诉。Software Finder
