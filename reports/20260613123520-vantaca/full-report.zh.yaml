  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Vantaca 时，不能假设它能变现所有房主协会经济。可辩护的边界更窄：专业社区协会管理公司和董事会用来运行会计、审批、支付、房主沟通、董事会材料包、文档、服务工作流，以及更新的 AI
              原生自动化的操作系统。Massachusetts CAI 一页纸说明了为什么这一点重要。协会摊派覆盖维护、维修、基础服务、保险、法律合规、园林和储备金，这意味着多数协会资金不是软件支出。AppFolio 和
              CINC 都把该品类定位在统一记录、财务监督、沟通、董事会参与、合规和自助服务，而不是实体维护预算。因此，正确的替代方案不只是 CAM
              竞争平台，还包括传统点状系统、电子表格、依赖邮件的手工协调、外包服务层，以及推迟软件标准化的自管理工作流。这个区别很关键：Vantaca
              的价值主张，是捕获嵌在社区管理里的工作流和交易支出，而不是捕获社区协会的整个经济底座。
