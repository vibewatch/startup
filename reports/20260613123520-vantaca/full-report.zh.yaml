              本章时间线显示，公司迅速从社区管理工作流软件转向由智能体 AI 带动的自动化。2024 年收购 HOAi 是跃迁事件：它形成两层 AI 策略，Scout 嵌入平台内，HOAi 作为独立产品运行。到 2025
