      - number: '5.2'
        title: 架构、集成与运营模型
        blocks:
          - type: paragraph
            body: >-
              可见架构有五层。第一层是用户界面：办公室用户使用核心平台，居民和董事会使用 Home，供应商使用 Vendor，现场团队使用移动 app。第二层是工作流和数据层，Vantaca
              反复强调统一行动项、银行余额、发票审批、工单和沟通历史，而不是割裂模块。第三层是自动化层，HOAi 和 AskIQ/IQ
              被定位为决策支持和执行工具，而不只是报告型插件。第四层是集成层。公开证据比开发者平台会暴露的更薄，但足以显示真实 API 和合作伙伴活动：AvidXchange Strongroom
              数据共享、Compliance View 360 巡检同步、银行和支付伙伴，以及 Vendor Pay 对 Grasshopper Bank 和 Increase 的依赖。第五层是基础设施 / 信任层：支持文档称
              Vantaca 运行在 Microsoft Azure 上并具备冗余；法律文件澄清了客户数据的处理方 / 控制方角色。最大的架构限制是披露深度。公开材料没有暴露端点目录、事件模型、租户设计或可靠性
              SLO，因此外界主要通过工作流结果和合作触点看到这套栈，而不是通过深入技术文档。
