      - number: '5.3'
        title: AI、自动化与实施成熟度
        blocks:
          - type: paragraph
            body: >-
              Vantaca 最强的差异化主张，不是它有 AI 功能，而是它把智能体劳动力嵌入 CAM 工作流。公司自身材料对目标任务异常具体：发票编码、预算创建、月结、董事会材料包、工单、支付处理、AP、AR
              和协会上线。2024 年收购公告也澄清，AI 策略不是一次性推出单体功能：Scout 是嵌入式助手，HOAi 仍是独立的转型产品，之后 Fleet 又把这套栈变成按角色组织的智能体。实施故事也比许多泛 AI
              上线更具体。公开 FAQ 称标准部署需要 6 到 12 周；迁移文章描述董事会网络研讨会和模块推动者；移动 app 与居民门户发布显示，产品演进早于 2025–2026 年 AI
              叙事。尽管如此，成熟度证明并不均衡。标题数字——500 万个任务、30% 到 90% 工作覆盖、12 到 15 分钟上线、近乎即时预算——都由公司撰写。这不等于它们为假，但意味着买方不应只根据营销文案承保 AI
              层，而应要求实时工作流演示和客户推荐。
