      - - CINC Systems
        - 直接在位 HOA / COA 平台
        - 1,000+ 家管理公司；51K+ 个协会；6M+ 户门；每年处理 $11B+ 支付
        - 协会管理公司、董事会、业主
        - 披露的大型 HOA 规模足迹，叠加 AI、财务、合规和业主工具
        - 公开证据在规模上很强，但定价和已实现迁移结果偏薄
      - - FRONTSTEPS
        - 直接 HOA / 社区管理平台
        - G2 4.0/5；官方平台覆盖社区运营、支付、会计、安全
        - 社区协会、CAM 团队、业主、董事会
        - 一个应用里整合居民应用、支付和安全定位
        - 公开差异化更偏社区生活和运营，而非可量化的工作流自主化
      - - Enumerate
        - 直接 HOA / 社区管理平台
        - G2 4.5/5，来自 131 条评价；官网强调互联会计和审批
        - 社区管理团队、董事会、居民、财务运营
        - 端到端会计、董事会 / 居民互动、现场运营、AP/AR、供应商集成
        - 与 CINC 或 Vantaca 相比，官网披露的硬规模更少
      - - Condo Control
        - 直接 HOA / 共管公寓管理平台
        - 3.5M+ 名居民；官网目前营销完整会计套件
        - 物业管理公司、自主管理共管公寓和 HOA、董事会、居民
        - 居民自助服务，加上正在加深的会计和组合报告
        - 公开定位很宽，但公开规模以居民为中心，而非以管理公司为中心
      - - AppFolio
        - 相邻在位物业管理套件
        - G2 4.6/5，来自 1,209 条评价；社区协会经理纳入目标市场
        - 覆盖公寓、住宅、商业、学生住房和社区协会场景的物业经理
        - 大型跨物业生态，拥有统一数据和智能体 AI 信息
        - 并非 HOA 专属，因此董事会 / 合规深度必须逐个工作流证明
      - - Buildium
        - 相邻物业管理套件
        - 包含社区协会；混合组合最高 15,000+ 单元；G2 4.4/5，来自 265 条评价
        - 住宅物业经理、房东、混合组合、社区协会
        - 宽口径住宅运营套件，社区协会相邻性清晰
        - 更像组合宽度故事，而非 HOA 原生工作流深度故事
      - - Propertyware
        - 聚焦租赁的相邻产品
        - Open API、多地点管理、面向独栋租赁运营商的组合级报告
        - 需要定制化的独栋租赁运营商和经理
        - 定制化能力和开放平台姿态
        - 公开材料以租赁为中心，而非 HOA 原生
    notes: 各行偏重证据最充分的直接和相邻替代方案，并不声称穷尽 HOA 软件长尾。
