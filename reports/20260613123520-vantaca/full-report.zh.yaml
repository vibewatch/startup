      - number: '2.5'
        title: 约束、摩擦与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              采用故事为正，但并不无摩擦。最干净的约束证据来自 AppFolio 2025 Form 10-K：订阅和增值服务在住宅中的采用率，通常高于社区协会或商业物业。这说明 CAM
              细分可能比更广泛住宅物业管理采用更慢，或购买更少模块。安全和合规是另一道门槛：Vantaca 自身安全材料强调金融数据、居民沟通和运营流程相关风险；社区协会还面对各州法规、董事会实践和文档要求的高度异质性。CAI
              的老化基础设施报告增加了另一类约束。协会及其管理方同时要处理储备金压力和计划外资本项目，即便行政痛点真实，也可能推迟或复杂化软件购买优先级。最大的承保缺口仍未解决：公开来源没有拆出专门的 HOA 软件
              TAM，没有给出全国专业 CAM 公司分母，也没有披露定价、挂载率或自管理协会采用数据。这些遗漏不否定市场，但会限制对精确公开 SAM 或 SOM 的信心。
