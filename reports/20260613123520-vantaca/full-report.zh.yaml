      - number: '2.3'
        title: 买方、用户、付款方与工作流地图
        blocks:
          - type: paragraph
            body: >-
              这个市场里最清晰的买方，是专业社区协会管理公司，而不是房主本人。AppFolio 文件称其主要客户是物业管理公司；CINC 明确拆分高管和社区经理使用场景；Vantaca
              自身买方指南也区分经理、会计、董事会成员和房主。这个模式指向一套分层买方栈：高管和财务负责人通常掌握平台和支付预算；社区经理和共享服务会计团队是高频日常用户；董事会成员和房主是次级用户，但他们对自助和透明度的期待仍会影响产品选择；协会最终通过由摊派供资的运营预算付款。工作流同样是多边的。平台越来越多把会计、维护或服务运营、沟通、董事会材料包、居民自助和集成支付放进一个记录系统。Vantaca
              的装机基础和客户故事说明，最直接可服务市场是专业管理组合，尤其是正在增长、整合，或在多个社区之间标准化共享服务的公司。
