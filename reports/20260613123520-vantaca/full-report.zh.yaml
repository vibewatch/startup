      - number: '5.4'
        title: 信任、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              信任信号存在，但不完整。正面看，Vantaca 现在公开提到 SOC 2 Type II、SecureSky、Azure 托管、加密预期、基于角色的访问控制、MFA 预期、控制方 /
              处理方角色，以及供应商支付交易对手。相比许多垂直 SaaS 产品，这些公开信任细节更多。支付界面也显示围绕 NACHA 和 PCI Level 1 认证处理方存在真实合规栈，Vendor Pay
              条款则明确了银行服务依赖。公开弱点在证据深度，而不是完全没有控制。已取回材料不包括公开审计报告、正常运行时间承诺或丰富事故历史界面；支持 /
              培训库也主要通过摘要可见，而不是开放的完整文档。独立评论强化了第二个风险：工作流宽度可能变成可用性负担。评论者反复称赞报告、银行可见性和中心化，但也描述复杂性、bug、搜索 /
              文档摩擦和支持缓慢。简言之，Vantaca 在工作流宽度和信任姿态上方向性较强；但买方仍应尽调 AI 自主性、管理端易用性、发布质量和运营支持的证据，再假设平台像营销中那样开箱即用。
