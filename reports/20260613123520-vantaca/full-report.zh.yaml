              专业人员、从 100 万到 500 万个自动化 AI 任务，以及为客户团队返还 100,000+ 小时。官方案例研究指向 30,000+ 户迁移、组合容量提升 53%、节省 800+
              小时。这些都是采用、产品价值和潜在增购面的可信指标。但它们没有披露确认收入、毛利率、净留存、CAC 或回本周期。第三方数据库提供的是噪声代理，而不是闭环：GetLatka 列出 2025 年收入 $85M 和
