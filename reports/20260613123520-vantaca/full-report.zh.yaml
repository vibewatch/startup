            body: >-
              应把 Vantaca 看作一家位于 Wilmington 的私营垂直 SaaS
              公司，聚焦社区协会管理的运营核心，而不是泛地产科技供应商。从官网首页、关于页面、招聘页面到存档评论档案，公司一直在描述一套完整运营栈：会计、工作流、沟通、巡检、居民体验，以及越来越多的智能体
              AI。保留资料包显示，Vantaca 想成为管理公司的记录系统，同时延伸到董事会、居民和供应商。这一定位会影响后续章节：Vantaca
              是带有嵌入式切换成本的重工作流软件平台，不只是一个功能层。公开记录在当前定位上最强，在历史身份上最弱：公司现在公开把自己定位为 AI 优先，但确切创立年份在官方和第三方来源之间仍有争议。独立总部引用也继续把
              Wilmington 置于公司身份中心。
