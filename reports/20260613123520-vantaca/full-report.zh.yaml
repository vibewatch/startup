      - number: '8.2'
        title: 公开可比公司与隐含倍数桥
        blocks:
          - type: paragraph
            body: >-
              相对估值不给出干净答案，但能显示 Vantaca 故事需要承担多大证明负担。AppFolio 是最相关的公开基准，因为它明确服务社区协会，披露当前收入和利润率指引，并在 2026 年 6 月 12 日前后以约
              5.6x EV/sales 交易。ServiceTitan 的品类针对性弱一些，但仍是有用的高增长垂直 SaaS 标尺，约为 5.9x EV/sales。RealPage 提供的不是实时公开可比，而是交易先例：其
              2021 年私有化对公司的估值约为尾随收入的 8.9x。对照这些标尺，Vantaca 上一轮融资在不同收入口径下隐含的私募倍数差异很大。按 GetLatka 的 $85M 2025 年收入，该轮约为 14.7x
              收入。按 WilmingtonBiz/Inc. 资料中的 $25M-$50M 区间，同一轮融资约为 25x-50x 收入。这个区间就是核心估值问题。更快的私有公司增长、财务赞助方信心和嵌入式 AI
              期权，可以支撑相对公开可比公司的溢价；但 2.5x-8.9x 的溢价，需要比当前公开披露强得多的证明。
