      - number: '1.3'
        title: 融资、规模与客户足迹
        blocks:
          - type: paragraph
            body: >-
              Vantaca 最经得起交叉印证的公开事实，是 2025 年 10 月融资。官方、投资方、本地新闻、顾问和独立新闻来源都指向同一结论：Cove Hill Partners 领投一笔 $300M+
              少数股权成长投资，估值 $1.25B，JMI Equity 继续支持公司。同一批来源也把该轮融资描述为对 AI 主导运营模型的验证，并与近期强劲增长相连，包括公司声称收入同比增长
              95%。规模说法在本次运行窗口内也继续上修。2025 年 10 月，Vantaca 称服务超过 500 家管理公司和 600 万户家庭；到 2026 年 6 月，公司和 WilmingtonBiz 引用超过
              550 家管理公司和 650 万户，官网另称服务 50,000+ 个协会和 650 万+ 房主。员工数更难钉牢，不同 2025-2026 年快照给出 270+、约 275 和 335
              名员工。综合来看，Vantaca 仍呈现后期私营 SaaS 姿态，但没有形成干净的公开人员运营基线。
