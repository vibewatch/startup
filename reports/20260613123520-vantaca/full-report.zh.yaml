  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 估值区间
      - 关键假设
      - 主要失效模式
    rows:
      - - 悲观
        - 30%
        - $0.7B-$0.95B
        - 收入更接近较低的独立区间，95% 增长说法无法干净复现，公开市场可比倍数主导结果。
        - 留存、支持质量或实施摩擦削弱扩张，并迫使倍数压缩。
      - - 基准
        - 50%
        - $0.95B-$1.25B
        - 收入高于 Inc. 档案区间，但缺少私有数据室证据时，公开证据仍不足以完全支撑高于上一轮的定价。
        - 公司无法对齐收入代理值，或无法证明健康的利润率和 NRR。
      - - 乐观
        - 20%
        - $1.25B-$1.7B
        - 更高收入代理值方向正确，AI 和支付扩张抬升变现，留存强到足以支撑私有市场溢价倍数。
        - AI 叙事在使用上成立，但在变现或客户耐久性上偏弱。
      - - 概率加权中心估计
        - 100%
        - 约 $1.03B-$1.18B
        - 权重偏向基准情景，因为轮次信号真实，但证据缺口仍太大，不能把该估值完全顺延。
        - 若没有私有指标却支付高于中心区间的价格，估值缓冲很薄。
    notes: 区间是保留不确定性的分析师估计，不应读作精确的按模型定价结果。
