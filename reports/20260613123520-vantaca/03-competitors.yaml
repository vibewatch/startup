  rows:
  - - Vantaca
    - Direct HOA/community-management platform
    - $300M+ minority round at $1.25B valuation; 500+ management companies; 6M households in Oct-2025; 50K+ associations and 6.5M+ homeowners on current site
    - Association management companies, boards, homeowners, vendors
    - HOAi-driven autonomous-workflow narrative plus integrated CAM workflows
    - Public scale figures vary across recent company pages and public pricing is opaque
  - - CINC Systems
    - Direct incumbent HOA/COA platform
    - 1,000+ management companies; 51K+ associations; 6M+ doors; $11B+ payments processed annually
    - Association management companies, boards, homeowners
    - Large disclosed HOA-scale footprint with AI, finance, compliance, and homeowner tools
    - Public proof is strong on scale but thin on pricing and realized migration outcomes
  - - FRONTSTEPS
    - Direct HOA/community-management platform
    - G2 4.0/5; official platform spans community ops, payments, accounting, security
    - Community associations, CAM teams, homeowners, boards
    - Strong resident app, payments, and security positioning in one app
    - Public differentiation leans more toward community living and operations than measured workflow autonomy
  - - Enumerate
    - Direct HOA/community-management platform
    - G2 4.5/5 from 131 reviews; official site emphasizes connected accounting and approvals
    - Community management teams, boards, residents, finance operations
    - End-to-end accounting, board/resident engagement, field ops, AP/AR, vendor integration
    - Public site exposes less hard scale disclosure than CINC or Vantaca
  - - Condo Control
    - Direct HOA/condo management platform
    - 3.5M+ residents; official site now markets full accounting suite
    - Property-management companies, self-managed condos and HOAs, boards, residents
    - Resident self-service plus deepening accounting and portfolio reporting
    - Public positioning is broad, but public scale is resident-centric rather than management-company-centric
  - - AppFolio
    - Adjacent incumbent property-management suite
    - G2 4.6/5 from 1,209 reviews; community association managers included in target market
    - Property managers across apartment, residential, commercial, student-housing, and community-association use cases
    - Large cross-property ecosystem with unified data and agentic-AI messaging
    - Not HOA-only, so board/compliance depth must be proven workflow by workflow
  - - Buildium
    - Adjacent property-management suite
    - Community associations included; mixed portfolios up to 15,000+ units; G2 4.4/5 from 265 reviews
    - Residential property managers, landlords, mixed portfolios, community associations
    - Broad residential operating suite with clear association adjacency
    - More portfolio-breadth story than HOA-native workflow-depth story
  - - Propertyware
    - Rental-focused adjacency
    - Open API, multi-location management, portfolio-level reporting for single-family operators
    - Single-family rental operators and managers needing customization
    - Customization and open platform posture
    - Public materials are rental-centric rather than HOA-native
  notes: Rows weight the most evidenced direct and adjacent alternatives rather than claiming to exhaust the full HOA software long tail.
