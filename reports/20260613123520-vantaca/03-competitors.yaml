- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - AI-first positioning
    - Category-wide AI claim inflation
    - High
    - Vantaca, CINC, FRONTSTEPS, AppFolio, and Condo Control all market AI or automation themes publicly.
    - Demand live end-to-end workflow demos and named reference customers
  - - Direct HOA specialization
    - CINC incumbent scale
    - High
    - CINC discloses the strongest direct-incumbent management-company and association scale in this pack.
    - Request win-loss data versus CINC by segment and geography
  - - Workflow depth
    - Metric inconsistency on Vantaca surfaces
    - Medium
    - Recent Vantaca materials cite inconsistent association and home counts, which weakens marketing-signal clarity.
    - Ask for a dated metric bridge and one canonical installed-base definition
  - - Migration advantage
    - Data-portability and board-risk friction
    - High
    - Vantaca itself frames exports, historical access, and board communication as core switching risks.
    - Review migration SLAs, export samples, and board-communication playbooks
  - - Broad portfolio appeal
    - Property-management adjacencies with bigger mindshare
    - Medium
    - AppFolio and Buildium have materially larger public review footprints than Vantaca or most direct HOA peers.
    - Quantify when mixed-portfolio buyers choose breadth over HOA-native depth
  - - Pricing power
    - Opaque package economics across peers
    - Medium
    - Most competitors expose scope but not sticker pricing, making price-based moat claims hard to validate.
    - Collect comparable quotes and implementation proposals before underwriting margin durability
  notes: Severity is an underwriting judgment based on current public evidence, not a forecast of share loss.
