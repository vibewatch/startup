  evidenceGaps:
  - type: missing-source
    severity: material
    topic: caliber-visibility
    missingEvidence: A reliable current public product or company page showing how Caliber competes in HOA/community-association management today.
    whyItMatters: Caliber is often named in legacy competitor sets, but this chapter could not verify current scale, scope, or product posture from fetched public evidence.
    diligencePath: Ask management for recent Caliber win-loss notes, current website URLs, or live customer references; if Caliber remains active, fetch those current URLs in the next refresh.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: peer-pricing
    missingEvidence: Comparable quotes, implementation fees, door-based pricing, and module attach for Vantaca, CINC, FRONTSTEPS, Enumerate, Condo Control, AppFolio, Buildium, and Propertyware.
    whyItMatters: Public pages reveal scope but not true contract economics, which limits underwriting of pricing power and switching savings.
    diligencePath: Collect current proposals or invoices from at least three direct HOA platforms and two property-management adjacencies for the same sample portfolio.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-proof
    missingEvidence: Vantaca win-loss data by rival, implementation churn during migrations, repeat-customer evidence, and realized staffing savings versus incumbent alternatives.
    whyItMatters: The moat claim depends on execution outcomes, not on marketing language alone, and those outcomes are mostly private.
    diligencePath: Request cohort-level win-loss analysis, implementation-retention data, and named reference calls segmented by competitor and portfolio size.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-competitors
    missingEvidence: Current public proof for lower-visibility or legacy competitors beyond the weighted set, including Caliber and other regional CAM platforms.
    whyItMatters: The weighted table is directionally complete for underwriting, but not a census of every market participant.
    diligencePath: In the next refresh, run a broader market-map pass across association-industry directories and customer migration histories.
    relatedQuestionRefs:
    - QP007
    - QP026
    relatedTableRefs:
    - TP001
