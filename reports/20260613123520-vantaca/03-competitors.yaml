- id: switching-friction-and-durability
  title: Switching friction and durability
  body: 'The strongest evidence-backed competitive question is not whether Vantaca has rivals; it is whether its claimed autonomous-AI edge creates enough measurable operating gain to overcome migration risk. Vantaca''s own content is revealing here. Its migration and data-portability materials describe the real frictions buyers worry about: board dissatisfaction, account-loss anxiety, export quality, historical-data access, fees, timelines, training burden, and implementation failure. Its AI-diligence content also undercuts simplistic positioning by warning buyers that many vendors use AI language without proving end-to-end workflow automation. That caution cuts both ways because Vantaca''s own public surfaces are not perfectly clean: the January 2026 comparison page uses inconsistent association and homes-served figures, which weakens confidence in marketing metrics unless the company provides a dated metric definition. Put together, the moat looks less like a pure branding or feature
    moat and more like an execution moat that must be proven with win-loss data, reference calls, live workflow demos, and concrete labor-savings evidence. If Vantaca can show that proof, the 2025 capital injection gives it room to widen the gap; if not, CINC and the broader platform adjacencies can compress the story quickly.'
