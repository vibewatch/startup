- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue reality misses the higher proxy
    - Management evidence shows current revenue materially below the $85M proxy or below the level needed to justify the last round multiple.
    - Collapses the argument that the 2025 price was simply a premium growth-software mark.
    - Rebase to the bear range and demand a sharper discount to public comp multiples.
  - - Retention / support quality disappoints
    - Cohort data or reference calls show weak NRR, elevated churn, or repeat complaints around support and onboarding.
    - Turns AI-first growth into a lower-quality revenue story with weaker durability.
    - Treat support and implementation as valuation-relevant, not merely operational noise.
  - - Payments / AI monetization lags usage
    - High task volume or vendor adoption fails to translate into paid attach, take rate, or margin expansion.
    - Removes the main reason to pay above public comp multiples.
    - Lower bull-case weight and treat product usage as feature proof, not economic proof.
  - - Round terms prove investor-protected
    - Preference stack, downside protections, or a large secondary component heavily shape the reported headline price.
    - Weakens the read-through from round headline to common-equity intrinsic value.
    - Adjust underwriting for non-common economics and widen required return.
  - - Fresh financing resets the mark
    - Any later financing or secondary trade clears at or below the 2025 valuation.
    - Shows the October 2025 price was not durable as operating evidence matured.
    - Use the newer price as the anchor and revisit all upside assumptions.
  notes: Each trigger is monitorable and tied directly to whether the current track / stretched stance should change.
