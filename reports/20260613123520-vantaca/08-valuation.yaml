- id: public-comps-and-implied-multiple-bridges
  title: Public comps and implied multiple bridges
  body: 'Relative valuation does not provide a clean answer, but it does show how much work the Vantaca story must do. AppFolio is the most relevant public benchmark because it explicitly serves community associations, discloses current revenue and margin guidance, and trades around 5.6x EV/sales as of June 12, 2026. ServiceTitan is less category-specific but still a useful high-growth vertical-SaaS yardstick at roughly 5.9x EV/sales. RealPage offers a transaction precedent rather than a live public comp: its 2021 take-private valued the company at about 8.9x trailing revenue. Against those markers, Vantaca’s last round implies a very wide range of private multiples depending on which revenue lens is true. On GetLatka’s $85M 2025 revenue figure, the round implies about 14.7x revenue. On the WilmingtonBiz/Inc. profile band of $25M-$50M, the same round implies roughly 25x-50x revenue. That spread is the core valuation problem. A premium to public comps is plausible for faster private growth,
    sponsor conviction, and embedded AI optionality, but a 2.5x-8.9x premium requires much stronger proof than current public disclosure provides.'
