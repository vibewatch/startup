tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Continue diligence, but do not underwrite a fresh entry as a clean buy at or above the last public mark.
  - - Confidence
    - Medium
    - The round quality is strong, but the operating disclosure behind it is still too thin for high-conviction valuation.
  - - Risk rating
    - High
    - Opaque revenue quality, undisclosed round terms, and some adverse implementation/support signals keep downside meaningful.
  - - Valuation stance
    - Stretched
    - The $1.25B price can be defended only under the higher revenue proxy and strong retention/AI monetization assumptions.
  - - Latest hard price anchor
    - $1.25B valuation in Oct. 2025 minority round
    - Treat as real third-party price discovery, not as proof that the same price remains intrinsically justified in June 2026.
  - - Most useful underwriting lens
    - Range-based EV/revenue framing, not DCF
    - Public evidence is too incomplete on margin and cash flow for a serious DCF or rule-of-40 style conclusion.
  - - Upgrade trigger
    - Private evidence that revenue is nearer $85M with strong retention and healthy payments/gross-margin economics
    - Would move the round multiple closer to a premium but explainable growth-software outcome.
  - - Primary downside trigger
    - Revenue closer to the $25M-$50M band or evidence of weak retention/support quality
    - Would make the last round look materially more aggressive than public comps and precedent transactions.
  notes: This recommendation is price-sensitive and evidence-sensitive rather than a generic company-quality score.
