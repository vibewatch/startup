- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Valuation range
  - Key assumptions
  - Main failure mode
  rows:
  - - Bear
    - 30%
    - $0.7B-$0.95B
    - Revenue is closer to the lower independent band, the 95% growth claim does not repeat cleanly, and public-like comp multiples dominate the outcome.
    - Retention, support quality, or implementation friction weakens expansion and forces multiple compression.
  - - Base
    - 50%
    - $0.95B-$1.25B
    - Revenue is above the Inc. profile band but public evidence still cannot fully support paying above the last round without private data-room evidence.
    - The company cannot reconcile revenue proxies or prove healthy margin and NRR.
  - - Bull
    - 20%
    - $1.25B-$1.7B
    - The higher revenue proxy is directionally right, AI and payments expansion lift monetization, and retention is strong enough to justify a premium private multiple.
    - The AI narrative proves real on usage but weak on monetization or customer durability.
  - - Probability-weighted central estimate
    - 100%
    - approx. $1.03B-$1.18B
    - Weighted toward the base because the round signal is real, but the evidence gap is still too large for a full carry-forward of the mark.
    - Paying above the central range without private metrics leaves little valuation cushion.
  notes: Ranges are analyst estimates that preserve uncertainty and should not be read as a precise mark-to-model output.
