- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue and ARR
    - Monthly 2024-2026 revenue bridge, ARR, and reconciliation of the $85M proxy versus the Inc. revenue band.
    - This single issue drives whether the last round implies a high-but-defensible multiple or an extreme one.
    - Management CFO pack; audited statements; board deck reconciliation.
  - - Revenue mix and gross margin
    - Software, services, payments, and AI revenue split plus gross margin by stream.
    - Determines whether Vantaca deserves software-like multiples or should be discounted for lower-quality mix.
    - Product-line P&L and payments gross-profit bridge.
  - - Retention and concentration
    - Gross retention, NRR, churn, top-customer concentration, and logo mix by management-company size.
    - Needed to test whether category leadership is durable or fragile.
    - Cohort file, customer-concentration schedule, and reference calls.
  - - Round economics
    - Primary versus secondary split, ownership %, board rights, preferences, and reserved matters from the Cove Hill transaction.
    - Determines how much of the headline valuation is informative for common-equity underwriting.
    - Cap table, stock purchase agreement, investor rights agreement, and board minutes.
  - - Payments and AI monetization
    - TPV, take rate, vendor-payment economics, AI attach rates, pricing, and infrastructure-cost burden.
    - These are the most credible reasons the company could sustain a premium multiple.
    - Payments dashboard, unit economics memo, and AI product pricing file.
  - - Implementation and support quality
    - Time-to-go-live, migration success, SLA attainment, ticket resolution, and churn reasons.
    - Adverse review evidence suggests execution quality could affect valuation more than marketing admits.
    - Support KPI dashboard, migration cohorts, and lost-deal / churn postmortems.
  notes: These asks are intentionally concrete because the public record is insufficient to underwrite the last round price with confidence.
