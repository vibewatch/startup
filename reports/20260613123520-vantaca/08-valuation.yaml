- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Rows cover the most decision-useful public, precedent, and direct-category reference points for valuing Vantaca as of 2026-06-13; they are not an exhaustive universe of property-tech or vertical-SaaS companies.
  rows:
  - - AppFolio
    - Public EV/sales and FY2026 outlook
    - ~$5.59B EV; 5.61x EV/sales; FY2026 revenue guide $1.110B-$1.125B
    - Closest disclosed public comp with community-association exposure and real profitability disclosure.
    - Much broader and more mature than Vantaca, with full public-company reporting and a larger installed base.
  - - ServiceTitan
    - Public EV/sales
    - ~$6.00B EV; 5.92x EV/sales
    - Useful premium vertical-SaaS growth comp for how public markets price category software with workflow depth.
    - Not property-management software and less directly tied to HOA/community-association operations.
  - - RealPage take-private
    - Transaction revenue multiple
    - ~$10.2B value including net debt; ~8.9x 2020 TTM revenue
    - Relevant property-management software M&A precedent that sits above current public comp multiples.
    - Deal closed in 2021, before the later software-multiple reset and with a much larger, disclosed revenue base.
  - - CINC Systems
    - Direct-category scale reference
    - 1,000+ management companies; 55,000+ associations; 6M+ doors; $25B payments in 2025; no public valuation
    - Shows the HOA/CAM category can support large-scale platforms and strong payments volume.
    - Private and undisclosed on revenue, margins, and valuation, so it is a strategic scale comp rather than a pricing comp.
  - - Vantaca last round
    - Private financing anchor
    - $1.25B valuation in Oct. 2025 on $300M+ minority investment
    - Best direct price signal because it is the company’s own latest public financing event.
    - Headline price omits ownership %, primary/secondary mix, preferences, and board-rights detail.
  - - Vantaca revenue-proxy lens
    - Implied EV/revenue at last round
    - ~14.7x on $85M proxy; ~25x-50x on $25M-$50M band
    - Shows exactly why the valuation debate turns on which revenue lens is closest to reality.
    - Both revenue lenses are indirect and non-audited, so the implied multiples remain estimates rather than settled facts.
  notes: The Vantaca-implied multiples are explicitly estimated from public proxies and should not be used as audited valuation inputs.
