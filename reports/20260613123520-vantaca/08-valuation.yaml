  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-financials
    missingEvidence: Current ARR, monthly revenue bridge, revenue mix, gross margin, and cash-burn data for 2024-2026.
    whyItMatters: Without these, the public record cannot determine whether the last round implied a premium but rational multiple or a stretched one.
    diligencePath: Obtain management financial package, audited statements, and board-approved operating plan.
    relatedQuestionRefs:
    - QV022
    - QV032
  - type: private-evidence-only
    severity: blocking
    topic: round-terms
    missingEvidence: Primary-secondary split, ownership %, board rights, preference stack, and any investor downside protections in the Cove Hill transaction.
    whyItMatters: Headline valuation alone may not reflect common-equity economics or clean intrinsic-value read-through.
    diligencePath: Review stock purchase agreement, cap table, investor rights agreement, and board minutes.
    relatedQuestionRefs:
    - QV033
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: Current NRR, gross retention, logo churn, customer concentration, and cohort-level migration outcomes.
    whyItMatters: These metrics determine whether Vantaca merits a premium multiple for durability rather than only for narrative growth.
    diligencePath: Request cohort file, churn analysis, and customer concentration schedule; cross-check with reference calls.
    relatedQuestionRefs:
    - QV034
  - type: conflicting-data
    severity: material
    topic: revenue-proxies
    missingEvidence: A reconciled explanation for why GetLatka reports $85M revenue and a stale $69M valuation while other public sources point to a lower revenue band and a much newer round.
    whyItMatters: The valuation debate hinges on which revenue lens is closer to reality and whether stale databases can be safely ignored.
    diligencePath: Reconcile external database records against company-provided financials and updated third-party profiles.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV032
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable valuation table coverage
    missingEvidence: Additional public or private valuation references for other direct HOA software peers such as Enumerate, FRONTSTEPS, or Condo Control.
    whyItMatters: The comparable table is intentionally partial because most direct peers do not disclose both revenue and valuation, which limits direct private-market triangulation.
    diligencePath: Seek private market databases, management references, or transaction comps that disclose revenue and valuation for direct HOA software peers.
    relatedQuestionRefs:
    - QV011
    - QV012
    - QV013
    - QV014
    relatedTableRefs:
    - TV004
