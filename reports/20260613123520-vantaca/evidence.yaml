evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: >-
      An authoritative incorporation or launch record that reconciles the 2015 official origin story, the 2017
      WilmingtonBiz spinout date, and the prompt's 2018 founding assertion.
    whyItMatters: Later chapters should not rely on a specific company age or founder timeline if the public record is inconsistent.
    diligencePath: >-
      Pull state formation filings, archived early product pages, and data-room corporate history materials to lock the
      canonical founding date and founder list.
    relatedQuestionRefs:
      - QO002
      - QO026
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current public board roster, board-seat map, or control-rights summary tied to the post-Cove Hill cap table.
    whyItMatters: >-
      Leadership quality is visible, but ownership control and governance rights are not, which limits diligence on
      key-person dependence and investor influence.
    diligencePath: >-
      Request board materials, shareholder agreements, and post-round governance documents from the company or
      investors.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: >-
      A current authoritative employee count that reconciles the 270+, 275, and 335 public markers reported between
      October 2025 and June 2026.
    whyItMatters: >-
      Headcount is a core maturity signal for a vertical SaaS platform, but the retained public record offers only
      point-in-time local media estimates.
    diligencePath: >-
      Ask management for current payroll headcount, Wilmington-vs-remote split, and the as-of dates behind each external
      statement.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: access-blocked
    severity: minor
    topic: customer-feedback
    missingEvidence: >-
      Direct access to current independent review detail from review portals such as G2 to test for repeat complaints on
      support, bugs, or usability.
    whyItMatters: >-
      The retained pack is otherwise dominated by company or favorable coverage, so blocked review detail limits
      independent checking of customer pain points.
    diligencePath: >-
      Re-run review-site retrieval with a browser session or collect exported customer-reference and churn data directly
      from management.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: >-
      A direct public dataset or analyst report dedicated to HOA or community-association management software revenue,
      buyer count, and module penetration.
    whyItMatters: >-
      Without a category-specific dataset, TAM and SAM must rely on adjacent property-management-software and housing
      proxies.
    diligencePath: >-
      Request category sizing from specialist industry consultants, large competitors, or investor materials that break
      out CAM software revenue separately from broader property management.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-universe-gap
    missingEvidence: >-
      A current public census of professional community association management companies nationwide and their
      portfolio-size distribution.
    whyItMatters: >-
      Vantaca's 500-plus customer count cannot be translated into buyer share without a denominator for the professional
      CAM universe.
    diligencePath: >-
      Request management-company universe estimates from CAI, CAMICB, major lenders, or industry M&A advisors that track
      CAM firm consolidation.
    relatedQuestionRefs:
      - QM021
      - QM026
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-penetration
    missingEvidence: >-
      Customer pricing, payments attach rates, AI module adoption, cohort retention, and revenue mix by company size for
      Vantaca and peers.
    whyItMatters: >-
      These variables determine whether Vantaca's installed scale translates into a large remaining SAM and strong
      monetization per household.
    diligencePath: >-
      Request cohort data, customer spend by module, implementation timelines, and attach-rate data in management
      presentations or data room exports.
    relatedQuestionRefs:
      - QM020
      - QM026
    relatedTableRefs:
      - TM002
      - TM005
  - type: enumeration-incomplete
    severity: minor
    topic: self-managed-gap
    missingEvidence: >-
      Public benchmarks on software adoption among self-managed associations and volunteer-run boards versus
      professionally managed portfolios.
    whyItMatters: >-
      The current buyer map is strongest for professional CAM companies and weaker for self-managed associations, which
      may have different budget and workflow constraints.
    diligencePath: >-
      Pull survey or vendor cohort data that segment self-managed associations separately from third-party managed
      communities.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
      - TM005
  - type: missing-source
    severity: material
    topic: caliber-visibility
    missingEvidence: >-
