- id: capital-history-valuation-and-adequacy
  title: Capital history, valuation signals, and adequacy
  body: Public capital history is clearer than public operating metrics, but it is still incomplete. Vantaca filed a February 2022 Form D for an indefinite equity offering, with $5M sold, a $50,000 minimum investment, and 16 investors at filing. In September 2022, Vantaca publicly announced a strategic growth investment from JMI and said existing ownership and leadership would remain in place. The major step-change came on October 15, 2025, when Vantaca announced a $300M+ minority growth investment led by Cove Hill at a $1.25B valuation, with JMI continuing as investor and the founding team remaining in control. Official materials say the proceeds will deepen AI, expand go-to-market, and broaden the ecosystem; WilmingtonBiz separately reported the capital would be used primarily to hire. That is enough to infer meaningful near-term capital availability. It is not enough to underwrite fully, because public sources still do not disclose cash on hand, burn, runway, primary-versus-secondary
    split, board terms, liquidation preferences, or debt obligations.
