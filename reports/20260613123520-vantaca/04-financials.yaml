- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue growth claim
    - 95% YoY over the last year (company claimed)
    - medium
    - Important growth signal, but only if the base, period, and accounting treatment are clear
    - Provide monthly recurring revenue bridge, period definition, and audited or board-approved revenue support
  - - Revenue scale
    - $85M revenue in 2025 appears in GetLatka only
    - low
    - Helps size valuation multiple and operating leverage, but source quality is weak and conflicts exist elsewhere
    - Provide FY2024-FY2026 GAAP revenue and ARR by product and services stream
  - - Customer footprint
    - 500-550 management companies; 6.0-6.5M doors/households; 50k+ associations; 16k+ CAM professionals
    - medium
    - Shows addressable operating scale and potential platform breadth
    - Disclose paying logos, communities live, managed units under contract, and revenue concentration by customer
  - - Public headcount range
    - 186-275 employees across public sources
    - low
    - Best public proxy for cost base and operating leverage, but the range is too wide for underwriting
    - Provide current headcount, fully loaded compensation, and hiring plan by function
  - - Estimated revenue per employee
    - $309k-$457k based on $85M revenue and the 186-275 employee range
    - low
    - Directional capital-efficiency proxy for a late-stage vertical SaaS business
    - Replace with company-reported revenue, gross profit, and headcount by month
  - - Customer ROI proofs
    - 30k+ doors migrated; 800+ hours saved; 53% portfolio-capacity increase; 20k homes across 175 associations
    - medium
    - Supports renewal and expansion potential if those case studies are representative
    - Show cohort-level adoption, expansion, churn, and time-to-value across the broader base
  - - Gross margin / CAC / payback / NRR
    - null
    - low
    - Without these, there is no clean view on revenue quality or sustainability of growth
    - Provide gross margin by stream, CAC by channel, payback, NRR, logo churn, and support-load trends
  notes: Nulls are deliberate where the reviewed source pack does not support a defensible run-date metric. Derived values should not be used as audited operating KPIs.
