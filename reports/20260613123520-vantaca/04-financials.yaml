  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix-disclosure
    missingEvidence: Revenue and ARR by product line, services, payments, AI attach, and resident/vendor modules.
    whyItMatters: Without stream-level revenue, it is impossible to separate durable recurring software economics from services or payments volume.
    diligencePath: Request monthly revenue bridge, deferred revenue movement, and management bookings deck by product family.
    relatedQuestionRefs:
    - QI001
    - QI006
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-efficiency
    missingEvidence: Gross margin by stream plus CAC, payback, NRR, and churn cohorts.
    whyItMatters: These metrics determine whether Vantaca behaves like a high-quality vertical SaaS business or a service-heavy platform with weaker economics.
    diligencePath: Request board materials or KPI pack with unit economics, cohort retention, and margin bridges.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, and downside runway assumptions.
    whyItMatters: The 2025 raise looks large, but investors still cannot tell how long capital lasts or when another round might be required.
    diligencePath: Request monthly cash bridge, forecast model, board-approved budget, and financing trigger scenarios.
    relatedQuestionRefs:
    - QI019
    - QI021
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: payments-economics
    missingEvidence: TPV, take rate, reserve requirements, and gross profit from integrated payments and vendor flows.
    whyItMatters: Embedded-fintech economics may be a major part of the value story, but public materials only prove product scope, not margin contribution.
    diligencePath: Request payments KPI sheet with TPV, active accounts, take rate, loss/reserve history, and gross-profit waterfall.
    relatedQuestionRefs:
    - QI001
    - QI014
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: contract-terms-and-pricing
    missingEvidence: Standard order forms, implementation fees, renewal terms, and price-escalation clauses.
    whyItMatters: Revenue quality depends on whether pricing is sticky and service economics are positive, not on directory estimates or isolated reviews.
    diligencePath: Review current MSA, order forms, price books, and renewal/escalation history for top customer cohorts.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI023
    - QI024
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: round-terms-and-governance
    missingEvidence: Primary-versus-secondary split, preference stack, board rights, and investor protections for the 2025 round and 2022 JMI investment.
    whyItMatters: Capital adequacy cannot be fully judged without understanding dilution, governance, and downside protections.
    diligencePath: Request cap-table history, financing docs, and board minutes summarizing major round terms.
    relatedQuestionRefs:
    - QI009
    - QI010
    - QI011
    - QI019
