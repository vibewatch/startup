- id: traction-and-unit-economics-proxies
  title: Traction signals and unit-economics proxies
  body: 'Traction signals are abundant, but they are mostly operational rather than financial. Official 2025 and 2026 materials cite 500 to 550 management-company customers, 6.0 to 6.5 million doors or households, 50,000+ associations, 16,000+ CAM professionals, one million then five million automated AI tasks, and 100,000+ hours returned to customer teams. Official case studies point to 30,000+ door migrations, 53% portfolio-capacity improvement, and 800+ hours saved. Those are credible indicators of adoption, product value, and potential upsell surface. They do not, however, reveal recognized revenue, gross margin, net retention, CAC, or payback. Third-party databases add noisy proxies rather than closure: GetLatka lists $85M 2025 revenue and 186 employees, while WilmingtonBiz reported about 275 employees in late 2025. That range implies roughly $309k to $457k revenue per employee, but the estimate rests on unaudited outside data and should be treated only as a directional capital-efficiency
    proxy.'
