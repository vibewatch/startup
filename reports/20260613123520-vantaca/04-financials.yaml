company:
  name: Vantaca
chapter:
  number: 4
  title: Financials
  summary: Vantaca presents as a fast-scaling, enterprise-style vertical SaaS platform with services and payments adjacencies, but public financial disclosure remains thin. Official and independent sources corroborate a $300M+ October 2025 minority growth investment led by Cove Hill Partners at a $1.25B valuation, following a 2022 JMI strategic investment and an earlier 2022 Form D showing $5M sold in an indefinite equity offering. The positive signals are customer scale, AI adoption, and sponsor appetite; the core underwriting blockers are still undisclosed revenue mix, gross margin, cash burn, runway, and realized contract economics, while the widely repeated 95% growth claim remains company-supplied rather than audited.
sections:
- id: revenue-model-pricing-and-gtm-motion
  title: Revenue model, pricing opacity, and go-to-market motion
  body: 'Public evidence supports Vantaca as an enterprise, consultative vertical SaaS platform with service and fintech adjacency rather than a simple self-serve HOA app. Official pages push buyers to request a demo, not to buy online, and the site explicitly advertises implementation and onboarding, accounting services, strategic account management, and customer success. That points to a revenue model mixing core software subscriptions with service-heavy deployment and support. Company and investor materials also emphasize integrated payments, business intelligence, HOAi, Vantaca Vendor, and Vantaca Home, implying cross-sell and ecosystem monetization. The problem is transparency: Vantaca does not publish a price list, standard contract terms, or any revenue mix. Third-party directories fill the gap with weak signals—quote-based, per-user pricing, estimated starting ranges, and user anecdotes of long contracts—but those are not enough to model realized ACV, services attach, or payments
    take rate. Underwriting should therefore treat pricing as enterprise negotiated and revenue mix as undisclosed until management shares contracts, price books, and bookings by product line.'
