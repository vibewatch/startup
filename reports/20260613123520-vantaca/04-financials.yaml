callouts:
- calloutType: risk
  title: Growth claim quality is weaker than growth narrative quality
  body: The 95% revenue-growth figure appears consistently in official and syndicated materials, but the reviewed source pack does not provide an audited base, period definition, or stream-by-stream revenue bridge. Treat it as company-supplied momentum evidence, not as diligence-complete financial proof.
  claimRefs:
  - CI004
  - CI049
  - CI050
- calloutType: insight
  title: Capital appears ample, but economics remain hidden
  body: The 2025 Cove Hill round makes Vantaca look well-funded for near-term expansion, yet public disclosure still does not reveal cash, burn, margin, or contract economics. The funding story is therefore easier to verify than the underlying revenue quality story.
  claimRefs:
  - CI001
  - CI033
  - CI038
