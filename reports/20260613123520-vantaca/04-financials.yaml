tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Public evidence
  - Unit / pricing basis
  - Current status
  - Revenue quality
  - Diligence ask
  rows:
  - - Core community-management software
    - Official site and investor materials position Vantaca as the operating platform for management companies.
    - Custom quote; no public price sheet
    - Clearly active, but no disclosed ARR split by module
    - Potentially high recurring quality, but realized ACV and retention are undisclosed
    - Provide bookings, ARR, gross retention, and expansion revenue by core software module
  - - Implementation, onboarding, and customer-facing services
    - Official site lists implementation & onboarding, accounting services, strategic account management, and customer success.
    - Service fees not publicly listed
    - Active service stack tied to enterprise deployment
    - Useful for adoption, but likely lower-margin than software if labor-intensive
    - Disclose implementation fees, services revenue, service gross margin, and support headcount load
  - - Integrated payments and financial workflows
    - Official materials describe integrated payments and financial-management workflows; reviews highlight AP/AR and bank reconciliations.
    - Take rate / transaction economics undisclosed
    - Strategically important, but monetization mechanics are not public
    - Could be attractive if embedded-fintech economics scale; currently opaque
    - Provide TPV, take rate, gross profit, float/interchange assumptions, and vendor-payment economics
  - - AI modules and workflow automation
    - HOAi, HOAi Fleet, and agentic AI are promoted as core differentiators with large task-volume claims.
    - Appears bundled or upsold; no public standalone price
    - Rapidly expanding, but standalone revenue attribution is undisclosed
    - Could drive higher expansion and stickiness, but attach rate is unknown
    - Disclose AI attach rates, pricing, expansion lift, and infrastructure-cost burden
  - - Resident and vendor ecosystem modules
    - Vantaca Home and Vantaca Vendor extend the platform beyond the management company seat.
    - No public list price or take rate
    - Commercially visible in product launch materials
    - Potential network effects, but standalone monetization is not public
    - Show paid-adoption rates, ARPU by stakeholder type, and economics of vendor/resident modules
  notes: Rows distinguish software, service, embedded-finance, and ecosystem monetization surfaces. Public sources establish product scope, not recognized revenue mix or realization.
