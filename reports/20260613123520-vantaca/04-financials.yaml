- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Current public status
  - Exact diligence path
  rows:
  - - Revenue / ARR by stream
    - Prevents modeling of software versus services versus payments quality
    - Not publicly disclosed in the reviewed source pack
    - Request monthly revenue bridge split by core software, services, payments, AI attach, and ecosystem products
  - - Gross margin by stream
    - Blocks understanding of software economics versus service burden
    - Not publicly disclosed
    - Provide gross margin and gross-profit dollars for software, services, payments, and AI modules
  - - NRR, logo churn, and expansion
    - Blocks assessment of durability and upsell economics
    - Not publicly disclosed
    - Provide cohort retention, expansion, churn, and contraction by vintage and segment
  - - CAC, payback, and sales cycle
    - Blocks underwriting of the enterprise GTM model and sales-efficiency sustainability
    - Not publicly disclosed
    - Provide pipeline conversion, CAC by channel, payback, and average implementation duration by customer size
  - - Cash balance, burn, and runway
    - Blocks liquidity and financing-dependency analysis
    - Not publicly disclosed
    - Provide current cash, monthly burn, quarterly cash bridge, and base/downside runway scenarios
  - - Payments TPV and take rate
    - Blocks valuation of embedded-fintech contribution and margin path
    - Integrated payments are public, economics are not
    - Provide TPV, active payment accounts, effective take rate, reserves, and payment-related gross profit
  - - Standard contract length, escalators, and implementation fees
    - Blocks conversion of anecdotal review signals into real pricing quality
    - Only indirect third-party and review evidence exists
    - Provide standard MSA/order form, price book, renewal terms, and implementation fee schedule
  - - Round terms and governance
    - Blocks dilution, downside protection, and control analysis
    - Headline funding facts are public; term details are not
    - Provide cap-table history, board composition changes, preference stack, and primary-versus-secondary split for the 2025 round
  notes: Every row is a genuine underwriting blocker or material data hole rather than a nice-to-have metric. Public operating signals are much richer than public financial disclosures.
