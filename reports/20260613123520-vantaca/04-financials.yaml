- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - February 2022 SEC Form D
    - Indefinite equity offering; $5M sold; first sale 2022-02-11; $50k minimum; 16 investors
    - high
    - Establishes that outside capital was being raised before the later public JMI announcement
    - Provide round memo, investor list, security type, price per unit, and whether this was part of the later JMI financing
  - - September 2022 JMI strategic investment
    - Officially announced; amount undisclosed; ownership and leadership said to remain in place
    - medium
    - Marks first clearly disclosed institutional growth investment, but size and terms are not public
    - Disclose primary capital raised, board rights, liquidation preferences, and any secondary component
  - - October 2025 minority growth round
    - $300M+ led by Cove Hill at a $1.25B valuation; JMI also participated
    - high
    - Provides the current public valuation anchor and major capital injection
    - Break out primary vs secondary proceeds, final close size, investor rights, and any structured terms
  - - Stated use of funds
    - AI expansion, go-to-market scale-up, ecosystem expansion, and hiring
    - medium
    - Shows the capital is being deployed into product, sales, and operating capacity rather than a narrow balance-sheet repair message
    - Provide 24-month capital-allocation plan by product, sales, support, and M&A buckets
  - - Cash on hand / burn / runway
    - null
    - low
    - Core liquidity variables remain undisclosed publicly
    - Provide current cash, monthly burn, scenario runway, and covenant or board trigger points
  - - Debt or financing obligations
    - null
    - low
    - Hidden debt or preferred structures could materially change dilution and risk
    - Disclose debt, venture debt, guarantees, indemnities, and any payment-processing reserve requirements
  - - Public data consistency
    - Independent databases disagree with the 2025 round on valuation and outside funding history
    - medium
    - Data inconsistency raises diligence burden and weakens confidence in lazy triangulation
    - Provide a management-approved financing chronology and revenue history for data-room use
  notes: This table focuses on forward adequacy, not a full historical cap-table reconstruction. Public funding headlines are much clearer than public liquidity or term-sheet detail.
