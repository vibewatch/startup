company:
  name: Vantaca
chapter:
  number: 6
  title: Customers
  summary: 'Vantaca''s customer evidence points to a clear ICP—professional HOA and community-association management companies—backed by public scale claims of 550+ management companies and 6.5M+ doors by June 2026 plus a broad, mostly company-authored case-study library. The strongest proof is quantified operational ROI at named customers such as HOA Strategies, HOALiving, Communitas, Resource Property Management, RedBrick, Desert Vista, and Trestle, alongside public migration claims covering 170 associations and 30,000+ doors. The main customer-side blind spots are durability and concentration: public sources do not disclose NRR, churn, NPS, cohorts, or top-customer mix, while independent review sites still surface complexity, support, and contract-friction complaints.'
sections:
- id: ideal-customer-profile-and-public-scale
  title: Ideal customer profile and public scale
  body: 'Vantaca''s public materials make the economic buyer unusually clear. The company sells first to community association management firms that need a system of record and system of action for accounting, workflows, communications, boards, residents, and vendors. Boards, homeowners, and service providers are important daily users, but they are downstream beneficiaries or network participants rather than the primary software buyer. Public scale claims are also directionally strong even if they remain marketing-sourced: the June 2026 CAI launch and WilmingtonBiz coverage both say Vantaca serves more than 550 management companies and more than 6.5 million doors, while the homepage separately advertises 50,000-plus associations and 6.5 million-plus homeowners. October 2025 investment coverage gave an earlier checkpoint of 500-plus management companies and six million households. That progression, combined with a $300M+ minority growth investment at a $1.25B valuation, supports real adoption
    breadth even though customer mix by size, geography, and revenue band is not public.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
