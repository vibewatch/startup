- id: expansion-resident-reach-and-concentration-risk
  title: Expansion paths, resident reach, and concentration risk
  body: 'Vantaca''s expansion narrative now reaches beyond back-office CAM software into resident experience, vendor payments, and AI-enabled managed services. Vantaca Home is positioned as the resident and board engagement layer, while Vantaca Vendor turns service providers into tracked network participants with self-service payment visibility and compliance checks. Customer stories from Trestle and Around the Clock show why that matters: call-volume reduction, better homeowner or board visibility, and less payment friction are framed as customer outcomes rather than just product features. The CAI 2026 launch adds one more scale signal by saying Vendor already processes payments for dozens of management companies. Even so, concentration risk remains unresolved. The public proof set is dominated by company-authored case studies, not independent contract records, and management has not disclosed top-customer exposure, revenue concentration, or segment mix. That means investors can underwrite
    a broad CAM footprint and meaningful resident reach, but not yet the durability of revenue within that footprint.'
