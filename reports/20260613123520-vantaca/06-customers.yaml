  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: contract-terms
    missingEvidence: Current standard contract length, renewal mechanics, price escalators, and termination clauses across customer cohorts.
    whyItMatters: Independent review complaints about long contracts and support friction could materially affect sales velocity, retention, and customer sentiment if they reflect current practice.
    diligencePath: Request a current MSA, recent order forms, and win/loss notes that discuss contract objections.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer ARR concentration, top-10 customer mix, and revenue exposure by customer size or channel.
    whyItMatters: Public case studies prove adoption breadth but do not show whether a small set of large management companies drives a disproportionate share of revenue.
    diligencePath: Request cohort ARR by customer size band plus top-10 customer concentration for the last eight quarters.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Company-level NRR, GRR, logo churn, cohort retention, and NPS by product and customer segment.
    whyItMatters: Customer stickiness is central to a workflow-heavy vertical SaaS thesis, and public case-study proxies cannot substitute for cohort-level durability data.
    diligencePath: Request board-level KPI packs or cohort tables broken out by core platform, HOAi, Home, Vendor, and payments attach.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU018
    - QU026
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: reference-customers
    missingEvidence: A full list of current named customers with deployment status, start dates, and whether each story remains active.
    whyItMatters: The public case-study hub shows broad logo breadth, but the chapter validates only the most quantified examples and cannot verify how representative they are of the active base.
    diligencePath: Request an export of current referenceable customers with segment, live date, and reference-call availability.
    relatedQuestionRefs:
    - QU007
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: resident-engagement
    missingEvidence: Board and homeowner activation, MAU, payment adoption, support deflection, and satisfaction metrics for Home or payments products.
    whyItMatters: Vantaca's resident-reach narrative is large, but without usage and satisfaction metrics it is hard to judge how much of the 6.5M-door footprint actually interacts with the platform.
    diligencePath: Request dashboard screenshots for Home and payments adoption plus resident ticket-response and NPS metrics.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU006
