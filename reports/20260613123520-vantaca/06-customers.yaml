  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Public proof
  - Use case
  - Scale signal
  - Gap / caveat
  rows:
  - - Core CAM software customers
    - Management company is buyer and payer; accounting, ops, and service teams are daily users
    - Implementation, Communitas, Resource PM, RedBrick
    - Back-office workflows, accounting, compliance, communications
    - 550+ management companies by Jun. 2026
    - Revenue mix by management-company size is not public
  - - Startup / emerging managers
    - Founders and lean operator teams buy; boards and homeowners use the outputs
    - ManageWorks, Desert Vista
    - Launch from zero, win first boards, automate lean operations
    - 10 simultaneous client onboardings; ~6,000 doors in under three years
    - Evidence is case-study based rather than audited cohort data
  - - Scaled regional / multi-office operators
    - Platform or tech leaders buy centrally; local offices use shared workflows
    - Communitas, Trestle
    - Standardize operations across offices and regions
    - 5 offices / 300+ accounts; 310 communities / 60,000+ homes
    - No public disclosure of revenue concentration by enterprise account
  - - Boards and homeowners as served users
    - Boards and residents are users, not the primary software payer
    - Vantaca Home, Trestle, Around the Clock
    - Approvals, visibility, payments, self-service, community engagement
    - 6.5M+ homeowners / 6.5M+ doors claimed
    - No public MAU, activation, or homeowner-NPS data
  - - Vendors as network participants
    - Management company pays; vendors use the portal to get paid and manage compliance
    - Vantaca Vendor and CAI 2026 launch
    - Payments, payment tracking, compliance workflows
    - Dozens of management companies on Vendor
    - Vendor GMV and attach rate are not public
  notes: Rows separate the economic buyer from boards, homeowners, and vendors so the chapter does not mistake end-user reach for direct software-customer count.
