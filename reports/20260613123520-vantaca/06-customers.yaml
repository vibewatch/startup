- id: named-customer-proof-and-onboarding-evidence
  title: Named customer proof and onboarding evidence
  body: 'The best customer proof is not a single marquee logo but the width of named, quantified operator stories on Vantaca''s own case-study surface. The retained pack shows multi-office operators such as Communitas, startups such as ManageWorks and Desert Vista, and scaled regional players such as Trestle, HOALiving, Resource Property Management, HOA Strategies, and RedBrick. Several of those stories include operational metrics that go beyond generic praise: HOALiving reports 1,400+ hours saved in 90 days and 95% A/P automation; HOA Strategies says budgeting moved from one-to-two weeks to minutes; Resource Property Management says close time fell 50%; Desert Vista says it reached nearly 6,000 doors in under three years. On onboarding mechanics, Vantaca says it has completed 500+ implementations, follows a day-60 launch model, and assigns specialists for data migration and role-specific training. Migration claims on the homepage and implementation page—170 associations at Eclipse and 30,000+
    doors at Kai—suggest the platform can support large conversions, though those claims are company-authored rather than independently audited.'
