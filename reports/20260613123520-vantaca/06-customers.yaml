- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Public evidence
  - Why it matters
  - Current limitation
  - Diligence path
  rows:
  - - AI upsell into installed base
    - 250 management companies already on HOAi; 5M+ tasks executed
    - Suggests wallet-share expansion inside existing customers
    - No attach rate by customer cohort or price uplift disclosed
    - Request product-by-product penetration and AI upsell ARR
  - - Resident-experience expansion
    - 6.5M+ homeowners / doors plus Home positioning
    - Creates a broader end-user moat than back-office software alone
    - No MAU, resident NPS, or conversion data
    - Request portal activation and repeat-use metrics
  - - Vendor / payments network
    - Vendor product live at dozens of management companies; vendors activate in under 2 minutes
    - Could deepen switching costs via payment rails and vendor compliance workflows
    - No GMV, take rate, or vendor density disclosure
    - Request TPV, attach rate, and vendor adoption by customer cohort
  - - Scaled-operator channel
    - Communitas and Trestle show multi-office or scaled operators
    - Large operators can become powerful references and large accounts
    - Top-customer concentration is not public
    - Request top-10 customers by ARR and churn exposure
  - - Startup / challenger channel
    - ManageWorks and Desert Vista show new or lean operators can adopt early
    - Broadens TAM beyond incumbent mega-managers
    - Early stories are still case-study sourced
    - Request CAC and retention by customer size band
  - - Case-study concentration
    - Most public proof is company-authored case-study content
    - May overstate breadth or omit failed rollouts
    - Few independent contract or procurement records in pack
    - Request raw customer logos, active customers, and recent churned logos
  - - Retention-disclosure gap
    - No public NRR, churn, NPS, or cohort tables
    - Blocks durable-revenue underwriting
    - Proxy metrics can mislead if cherry-picked
    - Request board-approved KPI pack for the last 8 quarters
  - - Support / contract friction
    - Independent reviews complain about complexity, support, and contract terms
    - Could slow expansion or hurt advocacy
    - Review sample is noisy and partially gated on some platforms
    - Request recent win/loss and support-satisfaction data
  notes: This table separates true expansion levers from the disclosure gaps that still prevent clean underwriting of customer concentration and revenue durability.
