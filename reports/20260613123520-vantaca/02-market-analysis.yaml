- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Administrative labor burden in CAM firms
    - Growth driver
    - Current / structural
    - High manual workload creates demand for workflow automation and shared-service leverage
    - Request baseline labor mix, task volumes, and headcount leverage from customers
  - - Integrated payments and accounting automation
    - Growth driver
    - Current / medium term
    - Payment and reconciliation workflows can increase ROI and vendor revenue per community
    - Request payments attach rates and margin contribution by module
  - - AI-native workflow compression
    - Growth driver
    - Current / medium term
    - Faster invoices, budgets, and document handling can raise throughput without proportional hiring
    - Verify customer-level before/after metrics beyond marketing examples
  - - Industry consolidation among management companies
    - Growth driver
    - Current / medium term
    - Acquirers may prefer one system of record across acquired portfolios
    - Map how often software standardization is part of CAM M&A playbooks
  - - Board and homeowner self-service expectations
    - Growth driver
    - Current
    - Resident and board experience can justify modernization even when manager demand starts the sale
    - Request portal engagement and service-response benchmarks
  - - Community-association adoption lag vs residential
    - Constraint
    - Current / structural
    - Public-market peer evidence suggests CAM can adopt software modules more slowly than broader residential property management
    - Benchmark attach rates and module usage against multifamily peers
  - - Cybersecurity and compliance requirements
    - Constraint
    - Current / structural
    - Sensitive financial and resident data increase security, trust, and audit requirements for vendors
    - Review SOC 2 scope, incident history, privacy controls, and customer security diligence
  - - Aging infrastructure and reserve stress
    - Constraint
    - Current / structural
    - Capital-project and repair pressure can crowd out software budgets or lengthen board approval cycles
    - Ask whether software wins correlate with reserve health or major-project exposure
  notes: The key timing issue is that modernization demand is real, but adoption still depends on security posture, board approvals, budget constraints, and whether CAM buyers adopt modules at residential-software rates.
