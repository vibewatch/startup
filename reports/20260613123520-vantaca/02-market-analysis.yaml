- id: evidence-constrained-sizing
  title: Evidence-constrained sizing and penetration signals
  body: The chapter evidence supports several useful sizing lenses, but not a precise HOA-software TAM. On the broad-demand side, Foundation for Community Association Research says 67 percent of new housing in 2024 was in an association and that condo or HOA fees topped USD 500 monthly for about three million households. The Fact Book dashboards preserve state-by-state association and population counts, and the Massachusetts one-pager gives a concrete state example with 657,800 homes across more than 11,500 associations and nearly USD 3.3 billion of annual assessments. On the software side, Mordor estimates global property-management software at USD 6.53 billion in 2026, growing to USD 9.93 billion by 2031, with residential properties and property managers representing the largest slices. Vantaca's own 500-plus management-company and six-million-household footprint is therefore meaningful as a penetration signal, but public sources here do not provide the buyer-universe denominator needed
    to turn that installed scale into share of the professional CAM market. The right underwriting stance is to preserve these lenses together rather than to force one unsupported HOA-software TAM number.
