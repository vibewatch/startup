company:
  name: Vantaca
chapter:
  number: 2
  title: Market Analysis
  summary: 'Vantaca''s relevant market is narrower than total HOA economics: it is the software, payments, data, communications, and AI workflow stack sold to professional community-association managers and their boards. Public evidence supports real demand—community associations still absorb much of new housing supply, some households face large HOA fee burdens, and adjacent property-management software reached a USD 6.53 billion 2026 market in Mordor''s model—but public sources still do not isolate a clean HOA-software TAM or a national count of professional management companies. Adoption drivers include consolidation, administrative labor pressure, integrated payments, and AI-enabled workflow automation, while constraints include cybersecurity and compliance demands, aging-infrastructure stress, and evidence from a public-market peer that community-association adoption can lag broader residential property management.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: 'Vantaca should not be analyzed as if it monetizes all homeowner-association economics. The defensible boundary is narrower: the operating system used by professional community-association management firms and boards to run accounting, approvals, payments, homeowner communications, board packets, documents, service workflows, and newer AI-native automation. The Massachusetts CAI one-pager shows why this matters. Association assessments cover maintenance, repairs, essential services, insurance, legal compliance, landscaping, and reserves, which means most association dollars are not software spend. AppFolio and CINC both position the category around unified records, financial oversight, communication, board engagement, compliance, and self-service rather than around physical maintenance budgets. The right substitutes are therefore not only rival CAM platforms, but also legacy point systems, spreadsheets, email-heavy manual coordination, outsourced service layers, and self-managed
    workflows that postpone software standardization. This distinction matters because Vantaca''s value proposition is to capture workflow and transaction spend embedded in community management, not to capture the entire economic base of community associations.'
  claimRefs:
  - CM001
  - CM002
  - CM021
  - CM022
