  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: A direct public dataset or analyst report dedicated to HOA or community-association management software revenue, buyer count, and module penetration.
    whyItMatters: Without a category-specific dataset, TAM and SAM must rely on adjacent property-management-software and housing proxies.
    diligencePath: Request category sizing from specialist industry consultants, large competitors, or investor materials that break out CAM software revenue separately from broader property management.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: buyer-universe-gap
    missingEvidence: A current public census of professional community association management companies nationwide and their portfolio-size distribution.
    whyItMatters: Vantaca's 500-plus customer count cannot be translated into buyer share without a denominator for the professional CAM universe.
    diligencePath: Request management-company universe estimates from CAI, CAMICB, major lenders, or industry M&A advisors that track CAM firm consolidation.
    relatedQuestionRefs:
    - QM021
    - QM026
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-penetration
    missingEvidence: Customer pricing, payments attach rates, AI module adoption, cohort retention, and revenue mix by company size for Vantaca and peers.
    whyItMatters: These variables determine whether Vantaca's installed scale translates into a large remaining SAM and strong monetization per household.
    diligencePath: Request cohort data, customer spend by module, implementation timelines, and attach-rate data in management presentations or data room exports.
    relatedQuestionRefs:
    - QM020
    - QM026
    relatedTableRefs:
    - TM002
    - TM005
  - type: enumeration-incomplete
    severity: minor
    topic: self-managed-gap
    missingEvidence: Public benchmarks on software adoption among self-managed associations and volunteer-run boards versus professionally managed portfolios.
    whyItMatters: The current buyer map is strongest for professional CAM companies and weaker for self-managed associations, which may have different budget and workflow constraints.
    diligencePath: Pull survey or vendor cohort data that segment self-managed associations separately from third-party managed communities.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
    - TM005
