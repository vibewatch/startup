tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Vantaca
  rows:
  - - Core CAM operating system
    - General ledger, AP/AR, approvals, task workflows, documents, board packets, homeowner communication, reporting
    - Physical maintenance, insurance premiums, utilities, reserve-funded capex
    - Professional management company; association operating budget
    - Direct category fit for Vantaca, AppFolio, CINC, and similar platforms
  - - Integrated payments and banking workflows
    - Receivables, payables, bank-feed automation, payment portals, payment reconciliation
    - Association assessment principal itself, reserve balances, unrelated treasury products
    - CFO or controller function inside CAM; association operating budget
    - Material because payment automation expands software revenue and switching cost
  - - Board and homeowner self-service
    - Resident portals, board portals, service requests, statements, announcements, approvals
    - Offline community events or amenities that do not require software
    - Board members, homeowners, and support teams; funded through operating budget
    - Important adoption wedge because it shapes service quality and transparency
  - - AI workflow automation
    - Invoice coding, budget preparation, document research, call handling, community setup, exception routing
    - General-purpose AI spend outside CAM workflows
    - Operations leaders or executives inside CAM firms
    - Strategic differentiation area for Vantaca after HOAi acquisition
  - - Adjacent ecosystem and data services
    - Business intelligence, compliance tracking, vendor coordination, integrations, audit trail
    - Major construction projects, reserve studies, lending, legal representation
    - CAM executive team and shared services
    - Relevant because larger firms prefer a single system of record
  - - Broader HOA economic base
    - Association assessments funding repairs, landscaping, insurance, legal compliance, reserves, and amenities
    - N/A
    - Homeowners paying assessments; associations allocating budgets
    - Useful context for economic importance, but it overstates what any software vendor can monetize
  notes: This table separates software and workflow spend from the much larger economic activity inside community associations so the market boundary does not drift into total HOA assessments.
