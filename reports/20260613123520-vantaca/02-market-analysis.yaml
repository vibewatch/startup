- id: constraints-and-underwriting-gaps
  title: Constraints, friction, and remaining diligence gaps
  body: 'The adoption story is positive but not frictionless. The cleanest constraining evidence comes from AppFolio''s 2025 Form 10-K, which says adoption of subscription and value-added services is typically higher in residential than in community-association or commercial properties. That suggests the CAM segment can adopt more slowly or buy fewer modules than broader residential property management. Security and compliance are another gating factor: Vantaca''s own security materials emphasize risk around financial data, resident communications, and operational processes, while community associations face heterogeneous state statutes, board practices, and document requirements. CAI''s aging-infrastructure report adds a different constraint. Associations and their managers are simultaneously dealing with reserve pressure and unplanned capital projects, which can delay or complicate software-buying priorities even when administrative pain is real. The largest underwriting gaps remain unresolved:
    public sources here do not isolate a dedicated HOA-software TAM, do not provide a national denominator for professional CAM companies, and do not reveal pricing, attach-rate, or self-managed-association adoption data. Those omissions do not invalidate the market, but they limit confidence in a precise public SAM or SOM.'
