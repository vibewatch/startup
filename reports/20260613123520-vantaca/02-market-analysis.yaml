callouts:
- calloutType: insight
  title: The real market is workflow spend, not total HOA assessments
  body: Community associations move large amounts of money, but only a narrow slice is directly monetizable by software vendors. The right lens is the operating stack used to manage accounting, payments, approvals, documents, and resident service across many communities.
  claimRefs:
  - CM001
  - CM002
  - CM027
- calloutType: strength
  title: Installed scale suggests Vantaca is already meaningful inside its niche
  body: Even without a clean public denominator for all professional management companies, 500-plus CAM customers and six million households is large enough to indicate material segment penetration and to make Vantaca a relevant category reference point.
  claimRefs:
  - CM012
  - CM015
  - CM016
  - CM050
- calloutType: risk
  title: Public data still cannot prove a clean HOA-software TAM or module-adoption curve
  body: The most credible adverse signal is not market absence but market opacity. Public sources do not reveal total professional CAM buyer count, pricing, attach rates, or whether the community-association segment adopts software modules as readily as broader residential property management.
  claimRefs:
  - CM026
  - CM048
  - CM049
  - CM051
