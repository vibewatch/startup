- id: buyer-user-payer-map
  title: Buyer, user, payer, and workflow map
  body: 'The most visible buyer in this market is the professional community-association management company rather than the homeowner directly. AppFolio''s filing says its primary customers are property management companies, while CINC explicitly separates executive and community-manager use cases and Vantaca''s own buyer guide distinguishes managers, accountants, board members, and homeowners. That pattern suggests a layered buyer stack: executives and finance leaders typically own platform and payments budgets; community managers and shared-service accounting teams are the heavy daily users; board members and homeowners are secondary users whose self-service and transparency expectations still shape product choice; and associations ultimately pay through operating budgets funded by assessments. The workflow is similarly multi-sided. Platforms increasingly combine accounting, maintenance or service operations, communications, board packets, resident self-service, and integrated payments
    in a single record system. Vantaca''s installed base and customer stories suggest the most immediate serviceable market is professionally managed portfolios, especially firms that are growing, consolidating, or standardizing shared services across many communities.'
