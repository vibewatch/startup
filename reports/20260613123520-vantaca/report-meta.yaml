companyProfile:
  summary: >-
    Vantaca is a Wilmington, North Carolina-based vertical SaaS company focused on community
    association management. Its platform combines core accounting and workflow operations with resident
    and board portals, vendor and payments tooling, business intelligence, and the HOAi automation
    stack. Public evidence supports real scale in U.S. HOA/community-management software and confirms a
    $300M+ October 2025 minority growth investment at a $1.25B valuation, but disclosure on revenue
    quality, governance, and contract economics remains limited.
