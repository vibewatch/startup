- id: TO003
  title: Stakeholder or investor map
  columns:
  - Stakeholder
  - Role
  - Public signal
  - Control or economic importance
  - Diligence ask
  enumerationScope:
    coverage: partial
    basis: Major investors, advisors, ecosystem counterparties, and customer constituencies explicitly named in retained 2025-2026 financing and launch materials; not a full cap table.
  rows:
  - - Cove Hill Partners
    - Lead growth investor
    - Led the $300M+ October 2025 minority growth investment at a $1.25B valuation
    - Likely the single most important new financial stakeholder post-unicorn round
    - Request ownership %, board rights, reserved matters, and liquidation preferences
  - - JMI Equity
    - Existing minority investor
    - Stayed invested and publicly endorsed the 2025 transaction
    - Represents continuity capital and likely governance influence spanning pre- and post-Cove Hill periods
    - Clarify original entry date, current ownership, board representation, and pro rata rights
  - - Founding management team
    - Operating leadership continuity
    - Pulse 2.0 said the founding management team continued to lead after the round
    - Shows capital was raised without a visible management turnover event
    - Confirm which founders or early executives still hold voting power or board seats
  - - William Blair
    - Transaction advisor
    - William Blair disclosed exclusive financial-advisor status on the 2025 round
    - Signals a professionally run process and may indicate future capital-markets optionality
    - Ask whether other banks were considered and whether a formal process memo exists
  - - Grasshopper Bank, N.A.
    - Banking-services partner
    - CAI 2026 disclosures said banking products and services are offered by Grasshopper Bank
    - Matters because payments and vendor workflows depend on a regulated banking counterparty
    - Review economics, compliance obligations, and concentration risk of the bank relationship
  - - Management-company customers
    - Economic demand base
    - Vantaca disclosed 500+ management companies in Oct. 2025 and 550+ by Jun. 2026
    - These customers drive subscription, payments, and future ecosystem monetization
    - Request cohort retention, top-customer concentration, and gross-to-net revenue decomposition
  - - HOAi
    - Acquired AI asset / product brand
    - HOAi remained a standalone product after the November 2024 acquisition
    - Critical to Vantaca's AI differentiation and automation roadmap
    - Inspect acquisition terms, integration milestones, and cross-sell penetration
  notes: This map mixes investors, advisors, ecosystem partners, and customer stakeholders because public sources do not provide a complete cap table or board map.
