company:
  name: Vantaca
chapter:
  number: 1
  title: Company Overview
  summary: Vantaca is a Wilmington-based AI-first software platform for community association management that publicly crossed unicorn status in October 2025 through a $300M+ Cove Hill-led minority growth investment at a $1.25 billion valuation with JMI Equity continuing as an investor. By June 2026 the company said it served more than 550 management companies and 6.5 million doors, while expanding its HOAi roadmap through the 2024 acquisition of HOAi and the 2026 launch of HOAi Fleet. The main unresolved issues are the precise founding date, incomplete public governance disclosure, varying public headcount markers, and limited direct access to independent review detail.
sections:
- id: identity-product-stage
  title: Identity, Product Stack, and Stage
  body: 'Vantaca should be treated as a private, Wilmington-based vertical SaaS company focused on the operational core of community association management rather than as a generic property-tech vendor. Across its homepage, about page, careers page, and archived review profile, the company consistently describes a full operating stack that combines accounting, workflows, communications, inspections, resident experience, and increasingly agentic AI. The retained pack shows a business that wants to be the system of record for management companies while also extending into boards, residents, and vendors. That positioning matters for later chapters because it frames Vantaca as a workflow-heavy software platform with embedded switching costs, not just a feature layer. The public record is strongest on current positioning and weakest on historical identity: the company now openly brands itself as AI-first, but the exact founding year remains contested across official and third-party sources. Independent
    headquarters references also keep Wilmington central to the company identity.'
  claimRefs:
  - CO001
