      - number: '5.3'
        title: AI, automation, and implementation maturity
        blocks:
          - type: paragraph
            body: >-
              Vantaca’s strongest differentiation claim is not that it has AI features, but that it has agentic labor
              embedded inside CAM workflows. The company’s own materials are unusually specific about the intended jobs:
              invoice coding, budget creation, month-end close, board packages, work orders, payment processing, AP, AR,
              and association onboarding. The 2024 acquisition post also clarifies that the AI strategy was not one
              monolithic feature launch: Scout was the embedded assistant, HOAi remained a standalone transformational
              product, and later Fleet turned that stack into role-based agents. The implementation story also looks
              more concrete than many generic AI rollouts. Public FAQs say standard deployments take 6 to 12 weeks,
              migration posts describe board webinars and module champions, and the mobile app plus resident portal
              releases show that product evolution predated the 2025–2026 AI narrative. Still, maturity proof is uneven.
              The headline numbers—five million tasks, 30%-to-90% work coverage, 12-to-15-minute go-live, and
              near-instant budgeting—are all company-authored. That does not make them false, but it does mean buyers
              should demand live workflow demonstrations and customer references instead of underwriting the AI layer on
              marketing copy alone.
