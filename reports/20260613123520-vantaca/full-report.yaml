      - number: '3.3'
        title: Adjacent property-management suites
        blocks:
          - type: paragraph
            body: >-
              AppFolio, Buildium, and Propertyware broaden the competitive set because management companies do not
              always buy software one workflow at a time; they often buy the platform that best fits a mixed portfolio,
              a reporting model, or a long-term operating architecture. AppFolio is the most important adjacency because
              it combines large review footprint, agentic-AI messaging, and explicit G2 coverage of community
              association managers alongside apartment, residential, commercial, and student-housing operators. Buildium
              matters for a different reason: both Buildium's own site and G2 describe community associations as part of
              its target set, which makes it more than a pure rental product even though it is clearly broader than
              HOA-only software. Propertyware is a weaker direct substitute for HOA-first buyers because its public
              materials focus on single-family rental operators, customization, open API access, and multi-location
