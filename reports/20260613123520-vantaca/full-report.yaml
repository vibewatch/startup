  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Vantaca’s product is best understood as a role-based workflow platform for community association
              management companies rather than as a generic property-management ledger. The buyer is usually the
              management company, but the product surface spans at least four user groups: internal accounting and
              operations teams, association boards, homeowners, and service vendors. The public module set is coherent
              across those roles. The core platform handles the operating backbone; Home gives residents and boards
              self-service access; Vendor digitizes payouts and vendor status; Pay manages resident collections; and
              HOAi sits across the stack as the automation layer. That matters because the company’s workflow claims are
              not just about moving data faster inside one office. They are about replacing phone calls, emails, manual
              statement prep, payment-status chasing, offline field notes, and board packet assembly with connected
              actions that stay tied to the record system. Even Vantaca’s migration content supports that workflow
              framing: board surveys, role-based module champions, and automated statement output are presented as the
              path to switching without account loss.
