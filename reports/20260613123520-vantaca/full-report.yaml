  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Vantaca should not be analyzed as if it monetizes all homeowner-association economics. The defensible
              boundary is narrower: the operating system used by professional community-association management firms and
              boards to run accounting, approvals, payments, homeowner communications, board packets, documents, service
              workflows, and newer AI-native automation. The Massachusetts CAI one-pager shows why this matters.
              Association assessments cover maintenance, repairs, essential services, insurance, legal compliance,
              landscaping, and reserves, which means most association dollars are not software spend. AppFolio and CINC
              both position the category around unified records, financial oversight, communication, board engagement,
              compliance, and self-service rather than around physical maintenance budgets. The right substitutes are
              therefore not only rival CAM platforms, but also legacy point systems, spreadsheets, email-heavy manual
              coordination, outsourced service layers, and self-managed workflows that postpone software
              standardization. This distinction matters because Vantaca's value proposition is to capture workflow and
              transaction spend embedded in community management, not to capture the entire economic base of community
              associations.
            claimRefs:
              - CM001
              - CM002
              - CM021
              - CM022
              - CM023
              - CM024
              - CM027
