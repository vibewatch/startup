    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Stack, and Stage
        blocks:
          - type: paragraph
            body: >-
              Vantaca should be treated as a private, Wilmington-based vertical SaaS company focused on the operational
              core of community association management rather than as a generic property-tech vendor. Across its
              homepage, about page, careers page, and archived review profile, the company consistently describes a full
              operating stack that combines accounting, workflows, communications, inspections, resident experience, and
              increasingly agentic AI. The retained pack shows a business that wants to be the system of record for
              management companies while also extending into boards, residents, and vendors. That positioning matters
              for later chapters because it frames Vantaca as a workflow-heavy software platform with embedded switching
              costs, not just a feature layer. The public record is strongest on current positioning and weakest on
              historical identity: the company now openly brands itself as AI-first, but the exact founding year remains
              contested across official and third-party sources. Independent headquarters references also keep
              Wilmington central to the company identity.
