    type: kpi
    layout: standard
    summary: IC-style scoring on a 1-5 scale using only public evidence available at the run date.
    data:
      items:
        - label: Market opportunity
          score: 4
          detail: The category is real and still digitizing, with software and payments growth tailwinds.
        - label: Scale proof
          score: 4
          detail: 500+ to 550+ management companies and multi-million-door claims indicate meaningful installed scale.
        - label: AI / product depth
          score: 4
          detail: HOAi acquisition, Fleet rollout, and multi-million task counts support real product ambition.
        - label: Revenue quality visibility
          score: 1
          detail: Public sources still do not disclose ARR, revenue mix, gross margin, or NRR.
        - label: Customer durability
          score: 2
          detail: Category fit is strong, but adverse support and contract reviews keep durability only partially proven.
        - label: Valuation support
          score: 2
          detail: The last round is real, but public comps imply the price needs stronger revenue proof than is available.
        - label: Evidence quality
          score: 2
          detail: Primary and independent sources support the round headline, but not the underlying underwriting math.
