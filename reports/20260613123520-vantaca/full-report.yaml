          stay high.
        - Would show the AI narrative is ahead of reliable production behavior.
        - Underwrite AI upside as optional and reduce growth-multiple confidence.
      - - Support and implementation strain
        - Support backlog, SLA attainment, and migration-linked account loss
        - Response times worsen or meaningful customers churn after migrations.
        - Would indicate product breadth is overwhelming service depth.
        - Require deeper reference calls and treat service investment as margin pressure.
      - - Payment-compliance event
        - NACHA return rates, bank remediation, service suspensions, held funds
        - A material bank warning, threshold breach, or customer-fund hold becomes visible.
        - Would convert payments from monetization upside into a trust and liquidity risk amplifier.
        - Ring-fence payments exposure or haircut any payments-driven upside case.
      - - Security or privacy breakdown
        - Incident log, SOC 2 status, regulator/customer notices
        - Material breach, delayed customer notice, or loss of audit/compliance standing.
        - Would damage renewals, trigger legal cost, and call AI/data governance into question.
        - Pause underwriting until remediation and customer-retention impact are known.
      - - Macro delinquency and reserve stress at customers
        - Delinquent-assessment levels, reserve deficits, special-assessment frequency in top accounts
        - >-
          Customer portfolios show rising delinquencies or reserve stress that changes software-spend and payment
          behavior.
        - CAM buyers can become more collections-focused, budget constrained, and less tolerant of platform friction.
        - Stress-test retention and payment-volume assumptions and revisit concentration risk.
      - - Governance disclosure remains opaque
        - Board map, control rights, primary-secondary split, preference details
        - Management cannot supply a clean board/control summary during diligence.
        - Leaves downside protections and decision rights unknowable at the current price.
        - Treat as a live diligence blocker or demand price discipline and stronger information rights.
    notes: >-
