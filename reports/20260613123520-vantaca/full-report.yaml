  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Financing signal
        - Cove Hill paid a real minority-growth price at unicorn scale, with JMI staying in the deal.
        - Minority-round headlines do not disclose the economics or protections that mattered to that price.
        - Share the full cap-table change, ownership %, board rights, and liquidation preference stack.
      - - Growth proof
        - Official 2025 materials cited 95% YoY growth and 500+ management companies.
        - That growth claim is company-supplied and unreconciled to audited revenue or ARR.
        - Provide a board-approved monthly revenue bridge and external audit or lender-quality evidence.
      - - AI/product depth
        - HOAi, Fleet, and payments/workflow expansion suggest real platform breadth rather than a thin feature layer.
        - Usage metrics do not prove monetization, retention, or gross-margin durability.
        - Show attach rates, pricing, gross margin, and expansion by AI and payments modules.
      - - Category leadership
        - Latest official metrics and CINC’s scale show community-management software can support large platforms.
        - >-
          AppFolio’s 10-K shows community-association adoption can be harder than broader residential property
          management.
        - Provide cohort retention, implementation success, and adoption data specific to CAM customers.
      - - Relative valuation
        - A faster-growing private AI-first vertical SaaS company can deserve a premium to public comps.
        - The premium becomes extreme if revenue is nearer the $25M-$50M band than the $85M proxy.
        - Reconcile revenue proxies and prove which lens is closest to current reality.
      - - Customer experience
        - Vantaca markets strong onboarding, portability, and automation ROI.
        - Adverse reviews cite complexity, weak support responsiveness, and rigid three-year contracts.
        - Share churn, NPS by tenure, support SLAs, and reference calls covering failed and successful migrations.
    notes: >-
      The anti-thesis turns mainly on disclosure quality and operating durability, not on denial that Vantaca has real
      product and market momentum.
