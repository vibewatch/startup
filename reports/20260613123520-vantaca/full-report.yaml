  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing opacity, and go-to-market motion
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports Vantaca as an enterprise, consultative vertical SaaS platform with service and
              fintech adjacency rather than a simple self-serve HOA app. Official pages push buyers to request a demo,
              not to buy online, and the site explicitly advertises implementation and onboarding, accounting services,
              strategic account management, and customer success. That points to a revenue model mixing core software
              subscriptions with service-heavy deployment and support. Company and investor materials also emphasize
              integrated payments, business intelligence, HOAi, Vantaca Vendor, and Vantaca Home, implying cross-sell
              and ecosystem monetization. The problem is transparency: Vantaca does not publish a price list, standard
              contract terms, or any revenue mix. Third-party directories fill the gap with weak signals—quote-based,
              per-user pricing, estimated starting ranges, and user anecdotes of long contracts—but those are not enough
              to model realized ACV, services attach, or payments take rate. Underwriting should therefore treat pricing
              as enterprise negotiated and revenue mix as undisclosed until management shares contracts, price books,
              and bookings by product line.
