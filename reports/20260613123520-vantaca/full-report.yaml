  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing anchor and quality of price discovery
        blocks:
          - type: paragraph
            body: >-
              The strongest valuation fact in the public record is not a model output but an actual financing event. In
              October 2025, Vantaca, JMI Equity, William Blair, PR Newswire, WilmingtonBiz, Business North Carolina, and
              Hypepotamus all converged on the same core datapoint: a $300M+ minority growth investment led by Cove Hill
              Partners at a $1.25B valuation, with JMI remaining invested and management retaining control. That is
              materially better evidence than rumor or a stale database mark. The problem is that the same source
              cluster does not disclose the inputs needed to decide whether the round price should be carried forward as
              intrinsic value. The 95% year-over-year growth figure is company-supplied, not audited. Revenue, gross
              margin, NRR, and cash generation remain undisclosed. Even independent revenue proxies conflict: Inc.
              profile reporting points to a $25M-$50M revenue band, while GetLatka claims $85M of 2025 revenue yet still
              shows a stale $69M valuation and $0 raised. The latest round is therefore a real price signal, but still
              an incomplete one.
