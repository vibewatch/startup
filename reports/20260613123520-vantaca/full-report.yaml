  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and weighted pressure
        blocks:
          - type: paragraph
            body: >-
              Vantaca is no longer competing as a niche HOA point solution. The October 2025 financing round and the
              HOAi acquisition pushed the company to market itself as an AI-first community-association operating
              system, but the buyer's real decision set is broader than one vendor-versus-vendor feature checklist.
              Direct HOA/community-association operating systems such as CINC, FRONTSTEPS, Enumerate, and Condo Control
              compete for the same management-company budget and often sell the same promise: integrated accounting,
              resident or homeowner experience, board visibility, and operational efficiency. Adjacent
              property-management suites such as AppFolio, Buildium, and Propertyware widen the field because many
              operators run mixed portfolios and may prefer a broader stack even if HOA workflows are not the platform's
              native center of gravity. Public evidence therefore supports weighting rivals by direct HOA overlap,
              public scale proof, and migration friction rather than by logo count alone. On that basis CINC is the
              cleanest direct incumbent benchmark, FRONTSTEPS and Enumerate remain serious HOA-native alternatives,
              Condo Control is moving up-market with deeper accounting, and AppFolio plus Buildium matter because they
              can win broader portfolio mandates.
            claimRefs:
