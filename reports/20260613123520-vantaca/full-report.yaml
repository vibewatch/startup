              Durability is where the public record gets materially weaker. Individual case studies provide partial
              renewal proxies: RedBrick reports 93% retention while growing, Desert Vista reports 99% client retention
              since founding, and Eclipse is cited as a 170-association migration with zero client loss. Those are
              useful, but they are not substitutes for company-level NRR, GRR, logo churn, cohort curves, or NPS by
              segment. None of those metrics appears in the retained public source pack. Independent review aggregators
              also temper the company-authored success stories. SelectHub summarizes complaints about limited end-user
              experience, inspection-module issues, and bugs. Software Finder includes harsher recent reviews that call
              the product excessively complex, describe support as ticket-based, and allege three-year contracts with
              escalating price increases. The practical read is that Vantaca appears sticky once deeply embedded in
              operations, but public evidence proves workflow dependence better than it proves clean SaaS retention
              economics.
