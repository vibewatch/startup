      - number: '7.2'
        title: Implementation, support, and AI-governance risk are the most visible customer-facing failure modes
        blocks:
          - type: paragraph
            body: >-
              Vantaca’s own materials concede that software change in this category is existentially sensitive for
              customers. The company’s migration article says management firms worry that a flawed cutover can cause
              boards to replace them, and Vantaca’s portability messaging openly frames bad portability as lock-in risk.
              Independent review evidence then shows why this matters. Software Advice, Software Finder, SelectHub, and
              even an archived G2 review all point to recurring complexity, long training curves, slow ticket-based
              support, and bugs or module issues. Those complaints are not fatal on their own for a fast-growing
              enterprise product, but they become more serious because Vantaca’s current AI thesis is about autonomous
              execution inside accounting, onboarding, communications, and other operational loops. Vantaca’s own
              AI-proof article implicitly acknowledges the risk by insisting that buyers should distinguish true
              end-to-end automation from feature tours and should require named references and measurable workflow
              outcomes. The underwriting concern is therefore not just software usability; it is whether product
              breadth, implementation depth, and AI governance can scale as quickly as the commercial story requires.
              That framing is consistent with NIST's AI Risk Management Framework playbook, which treats governance,
              monitoring, and trustworthiness controls as core requirements for production AI systems.
