            body: >-
              The leadership picture is clearer than the governance picture. Public sources show Dave Sweyer at the
              center of Vantaca's origin story, with the official about page also naming David Gunn as a co-founder.
              Superframeworks adds that Ben Currin joined in early 2018, and by 2025-2026 Currin is clearly the public
              CEO across financing, launch, and hiring announcements. January 2026 marked an explicit leadership
              expansion with Will Cameron as CRO, Trisha Price as CPO, Lauren Godwin moving into Head of AI Enablement,
              and Will Davy shifting into chief strategy work. That set of moves supports the idea that Vantaca is
              professionalizing around go-to-market, product, and AI operations as it scales after the Cove Hill
              investment. What remains notably thin is board and control disclosure: the retained public pack confirms
              founding-team continuity and investor support, but it does not provide a full board roster, board-seat
              map, or a public description of post-round control rights.
