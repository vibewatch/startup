      - number: '1.4'
        title: Milestones, AI Roadmap, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              The chapter's chronology shows a company that shifted rapidly from community-management workflow software
              into agentic-AI-led automation. The 2024 HOAi acquisition was the step-change event: it created a two-tier
              AI strategy with Scout embedded in-platform and HOAi operating as a standalone product. By the 2025
              financing announcement, Vantaca and JMI were already citing more than one million automated tasks and over
              100,000 hours returned to customers. The June 2026 CAI launch then moved the company further toward an
              AI-native operating model through HOAi Fleet, broader rollout of Vantaca Vendor, continued investment in
              Vantaca Home, and a banking-services disclosure tied to Grasshopper Bank. The main caution flags are not a
              public lawsuit or enforcement action in the retained pack; instead, they are diligence frictions:
              conflicting founding-year narratives, sparse public governance detail, headcount inconsistency,
              acknowledged switching-cost dynamics in the market, and blocked access to fresh independent review detail
              on G2.
