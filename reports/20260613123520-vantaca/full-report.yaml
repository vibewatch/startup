      - number: '8.3'
        title: Why the 2025 unicorn price could be supported or stretched
        blocks:
          - type: paragraph
            body: >-
              There is a genuine bull case. Vantaca’s investor syndicate is credible, the company clearly owns
              meaningful HOA/community-management share, and its official 2026 materials show product usage depth beyond
              a generic SaaS dashboard story: more than five million AI tasks, 250 management companies already using
              that infrastructure, and a stated goal of moving from 30% to 90% AI coverage by the end of 2026. CINC’s
              scale also shows that this category can support large platforms, while Mordor’s market work supports
              continued software and payments digitization. Those facts explain why a premium private mark was
              achievable. But the bear case is equally real. AppFolio’s 10-K explicitly says community-association
              adoption is typically lower than residential, meaning the segment can be operationally harder than the
              broader property-management market. Vantaca still does not disclose current revenue, revenue mix, payments
              economics, retention, or margin. Adverse review evidence also introduces execution risk around product
              complexity, support responsiveness, and contract rigidity. The right conclusion is not that $1.25B is
              false; it is that the evidence can support the price only under stronger revenue assumptions than the
              public record can verify today.
