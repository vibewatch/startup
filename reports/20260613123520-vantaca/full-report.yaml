      - number: '3.2'
        title: Direct HOA platform peers
        blocks:
          - type: paragraph
            body: >-
              Among the direct peers, CINC shows the strongest combination of category specificity and disclosed scale.
              Its site claims more than 1,000 association management companies, 51,000-plus associations, and six
              million doors, while also marketing AI-driven reporting, compliance, and homeowner support. That makes
              CINC the most obvious incumbent benchmark against Vantaca on management-company relevance rather than on
              generic real-estate breadth. FRONTSTEPS is also clearly direct, but its current public story leans more
              toward resident app convenience, community operations, payments, and safety or security than toward a
              Vantaca-style autonomous workflow narrative. Enumerate and Condo Control both sit in the same direct buyer
              set as well. Enumerate's public positioning focuses on reducing busywork by connecting accounting,
              payments, approvals, resident engagement, and vendor workflows. Condo Control now goes even further into
              financial depth by marketing a full accounting suite with general ledger, AP, AR, reconciliation,
              budgeting, portfolio reporting, and AI-backed resident self-service. The practical conclusion is that
              Vantaca does not face an empty field on HOA specificity; its differentiation has to come from better
              workflow execution and migration outcomes, not from being the only purpose-built vendor.
