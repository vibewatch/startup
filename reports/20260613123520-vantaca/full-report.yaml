        blocks:
          - type: paragraph
            body: >-
              Financially, Vantaca looks attractive on category position and financing access, but underdisclosed on
              almost every metric that determines durability of SaaS economics. The strongest evidence supports
              enterprise customer scale, workflow penetration, AI usage, and sponsor appetite. The weakest evidence is
              on revenue quality: the widely repeated 95% growth figure is a company-supplied claim carried in official
              and paid-release channels without an audited base, period definition, or reconciled revenue figure.
              Pricing transparency is similarly poor, with official demo-only sales entry, third-party quote-based
              estimates, and an adverse review alleging multi-year escalators. Conflicting databases reinforce the need
              for diligence rather than confidence: GetLatka still shows a $69M valuation and no outside funding,
              obviously lagging the 2025 round. The practical verdict is that Vantaca likely has enough capital to keep
              scaling, but investors should not underwrite to margin, retention, or cash-flow assumptions until
              management provides revenue by stream, payments economics, support and service cost load, contract terms,
