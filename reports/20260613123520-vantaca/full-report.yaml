        title: Trust, compliance, and product risks
        blocks:
          - type: paragraph
            body: >-
              Trust signals are present but incomplete. On the positive side, Vantaca now publicly names SOC 2 Type II,
              SecureSky, Azure hosting, encryption expectations, role-based access controls, MFA expectations,
              controller/processor roles, and vendor-payment counterparties. That is more public trust detail than many
              vertical SaaS products expose. The payments surfaces also show a real compliance stack around NACHA and a
              PCI Level 1-certified processor, while Vendor Pay terms make the banking-service dependency explicit. The
              public weakness is evidence depth rather than total absence of controls. Retrieved materials do not
              include a public audit report, uptime commitment, or rich incident-history surface, and the
              support/training library is mostly visible through summaries rather than broad open documentation.
              Independent reviews reinforce a second risk: workflow breadth can become usability burden. Reviewers
              repeatedly praise reporting, banking visibility, and centralization, but they also describe complexity,
              bugs, search/document friction, and slow support. In short, Vantaca looks directionally strong on workflow
              breadth and trust posture, but buyers should still diligence proof of AI autonomy, admin ergonomics,
              release quality, and operational support before assuming the platform is as turnkey as the marketing
              implies.
