      - number: '8.4'
        title: Recommendation, diligence blockers, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The most defensible call is track with medium confidence, high risk, and a stretched valuation stance at
              the last public price. That is not a dismissal of the company. It reflects a mismatch between the quality
              of the round signal and the quality of the operating disclosure behind it. Vantaca has enough evidence to
              justify continued diligence: sponsor quality, category leadership, expanding AI functionality, integrated
              payments ambitions, and credible customer-scale markers. It does not have enough evidence to justify a
              bullish underwrite at any price near or above the 2025 round without private materials. The critical
              missing pieces are straightforward: a monthly revenue/ARR bridge, revenue mix across
              software/services/payments, gross margin and NRR, customer concentration and churn, and the exact
              primary-secondary, ownership, board-rights, and preference terms of the Cove Hill transaction. If
              management can show revenue nearer the higher proxy and public-like or better retention with healthy
              embedded-fintech economics, the price could hold. If not, the same price leaves little margin of safety
              versus public and precedent multiples.
