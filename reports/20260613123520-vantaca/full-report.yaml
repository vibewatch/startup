      - number: '5.2'
        title: Architecture, integrations, and operating model
        blocks:
          - type: paragraph
            body: >-
              The visible architecture has five layers. First are the user surfaces: office users in the core platform,
              residents and boards in Home, vendors in Vendor, and field teams in the mobile app. Second is the
              workflow-and-data layer, where Vantaca repeatedly emphasizes unified action items, bank balances, invoice
              approvals, work orders, and communication history rather than disconnected modules. Third is the
              automation layer, where HOAi and AskIQ/IQ are positioned as decision support and execution tools rather
              than reporting-only add-ons. Fourth is the integration layer. Public evidence is thinner than a developer
              platform would expose, but it is sufficient to show real API and partner activity: AvidXchange Strongroom
              data sharing, Compliance View 360 inspection sync, banking and payment partners, and Vendor Pay’s
              dependence on Grasshopper Bank and Increase. Fifth is the infrastructure/trust layer: support
              documentation says Vantaca runs on Microsoft Azure with redundancy, while legal documents clarify
              processor/controller roles for customer data. The biggest architecture limitation is disclosure depth.
              Public materials do not expose endpoint catalogs, event models, tenancy design, or reliability SLOs, so
              the stack is visible mainly through workflow outcomes and partner touchpoints rather than through deep
              technical docs.
