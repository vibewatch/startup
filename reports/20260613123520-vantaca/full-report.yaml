      - number: '1.3'
        title: Funding, Scale, and Customer Footprint
        blocks:
          - type: paragraph
            body: >-
              Vantaca's best-corroborated public fact pattern is its October 2025 financing. Official, investor,
              local-news, advisor, and independent news sources all converge on a $300M+ minority growth investment led
              by Cove Hill Partners at a $1.25 billion valuation, with JMI Equity continuing to back the company. Those
              same sources also frame the round as validation of an AI-led operating model and tie it to strong recent
              growth, including a claimed 95% year-over-year revenue increase. Scale claims also advanced during the run
              window. In October 2025, Vantaca said it served more than 500 management companies and six million
              households; by June 2026, the company and WilmingtonBiz were citing more than 550 management companies and
              6.5 million doors, while the homepage separately advertised 50,000+ associations and 6.5M+ homeowners
              served. Headcount is less cleanly pinned down, with public markers at 270+, about 275, and 335 employees
              across different 2025-2026 snapshots. That mix still supports a late-stage private SaaS posture, but not a
              clean public operating baseline on staffing.
