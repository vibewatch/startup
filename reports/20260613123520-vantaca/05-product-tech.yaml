tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Core CAM operating platform
    - Management company ops + accounting teams
    - Production-mature core
    - Positions itself as a workflow system of record rather than a standalone accounting tool
    - No public module-by-module architecture or tenant model
  - - HOAi Fleet / automation layer
    - Accounting, ops, onboarding, service teams
    - In market with aggressive 2026 expansion claims
    - Role-based AI agents claim to execute multi-step workflows, not just answer prompts
    - Independent benchmark evidence for time savings and autonomy depth is still thin
  - - Vantaca IQ / AskIQ
    - Executives, supervisors, ops leads
    - Active, with AskIQ launched from 2024 roadmap
    - Turns work queues, invoice flow, and response performance into real-time operational visibility
    - No public schema, query model, or analytics-security detail
  - - Vantaca Home
    - Residents + boards
    - Live and visibly expanding
    - Combines resident portal, content, benefits, voice/text/chat access, and board transparency in one surface
    - Adoption, MAU, and board usage metrics are not public
  - - Vantaca Vendor
    - AP teams + service providers
    - Moved from beta to broader market by 2026
    - Payout tracking, banking-detail verification, vendor visibility, and future procurement/compliance in one workflow
    - Vendor quality scoring and procurement were still roadmap items after launch
  - - Vantaca Pay / payment stack
    - Residents + finance teams
    - Production surface with compliance claims
    - Resident payment methods, real-time remittance posting, and fee controls tied to CAM workflows
    - Processor economics, dispute rates, and settlement performance are undisclosed
  - - Mobile field app
    - Managers + inspectors
    - Live
    - Offline inspections, violations, work orders, geotags, and fewer taps support field execution
    - No public release cadence, crash-rate, or offline-sync reliability metrics
  - - Integration ecosystem
    - Admins + implementation teams
    - Real but partner-mediated
    - API-linked banking, AP, and inspection integrations extend the suite without forcing all functionality in-house
    - Public API docs and connector coverage remain shallow
  notes: |-
    This matrix separates the visible buyer-facing surfaces from the automation and integration layers underneath them. It is not a revenue decomposition.
