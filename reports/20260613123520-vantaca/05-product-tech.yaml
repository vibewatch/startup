  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ai-scale
    missingEvidence: Independent benchmark data or customer-level before/after metrics for HOAi task volume, minutes-to-go-live, budget generation, and 30%-to-90% coverage claims.
    whyItMatters: The core technical differentiation rests on workflow autonomy and labor savings, so unverified performance claims could materially overstate moat and ROI.
    diligencePath: Request live product demos using current customer data, named references for Fleet, and exported KPI reports showing baseline vs post-HOAi results.
    relatedQuestionRefs:
    - QE008
    - QE009
  - type: missing-source
    severity: material
    topic: trust-gap
    missingEvidence: Public uptime commitments, incident history, trust-center artifacts, and a downloadable audit or control matrix.
    whyItMatters: Enterprise buyers evaluating an AI-first operational system need more than marketing-level trust copy to underwrite reliability and control scope.
    diligencePath: Request SOC 2 report, uptime/SLA terms, subprocessor list, incident-history disclosures, and customer-facing trust-center access.
    relatedQuestionRefs:
    - QE019
  - type: private-evidence-only
    severity: material
    topic: api-strategy
    missingEvidence: Open API documentation or implementation references that show endpoint breadth, auth patterns, webhook/event support, and partner-maintenance ownership.
    whyItMatters: Integration depth is central to deployment effort, vendor lock-in risk, and whether Vantaca can remain a system of record while customers add adjacent tools.
    diligencePath: Obtain API docs, sample integration architecture, and a supported-connector inventory with maintenance and support commitments.
    relatedQuestionRefs:
    - QE012
    - QE013
  - type: private-evidence-only
    severity: minor
    topic: resident-adoption
    missingEvidence: Active-user, adoption, or channel-deflection metrics for Home, voice, chat, and vendor-portal workflows.
    whyItMatters: Resident and vendor surfaces help justify platform breadth, but without usage metrics it is hard to tell whether they are differentiating engagement engines or mainly check-box features.
    diligencePath: Request module-by-module adoption dashboards, MAU/WAU, ticket-deflection rates, and vendor activation metrics by cohort.
    relatedQuestionRefs:
    - QE004
    - QE006
    - QE026
