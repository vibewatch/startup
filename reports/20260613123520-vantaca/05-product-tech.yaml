- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - User surfaces
    - Core admin UI, Home, Vendor, Pay, and mobile workflows for different personas
    - Unified identity, workflow state, and role access across surfaces
    - Public docs do not expose tenancy, RBAC granularity, or surface-specific SLA detail
  - - Workflow system of record
    - Captures action items, payments, work orders, communication history, and approvals in one operating model
    - Underlying data model and workflow engine
    - Architecture is described conceptually, not via public schema or event docs
  - - AI execution layer
    - HOAi Fleet, Scout, and AskIQ automate or summarize multi-step work
    - Good workflow context, data quality, human approvals, and exception handling
    - Most autonomy and performance evidence is company-authored
  - - Analytics / business intelligence layer
    - Turns operational queues and financial process visibility into live dashboards and AI query surfaces
    - Access to workflow and financial data plus metric definitions
    - No public semantic model, permissioning detail, or export limitations
  - - Integration layer
    - Connects AP, inspections, banking, and partner services via APIs and synced workflows
    - AvidXchange, Compliance View 360, banks, payment providers, and other partners
    - Partner health and connector ownership can affect rollout quality
  - - Payment and vendor services layer
    - Processes homeowner payments and vendor payouts with reconciliation support
    - Grasshopper Bank, Increase Technologies, processor/compliance stack
    - Banking or processor dependencies introduce regulatory and service-layer risk
  - - Hosting and trust layer
    - Runs application and data services in Azure with redundancy and stated security controls
    - Microsoft Azure, SecureSky, internal security operations
    - Public evidence stops short of a full trust-center artifact set or detailed uptime proof
  notes: |-
    This table covers only architecture elements made legible by public pages, support articles, legal terms, and integration announcements.
