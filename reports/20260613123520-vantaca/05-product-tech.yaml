- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Vantaca solution
  - Measurable benefit
  - Limitation
  rows:
  - - Board packet and month-end prep
    - Staff compile spreadsheets, check balances, and assemble packages manually
    - HOAi board-ready packages plus Home board access to balances, reports, and invoice approvals
    - Company claims board packages and close tasks can be prepared before staff arrive
    - No independent close-speed or board-prep benchmark
  - - Resident questions and self-service
    - Residents call or email for status, documents, or payments
    - Home offers announcements, documents, voice, text, chat, and self-service access
    - Public materials position 24/7 access and fewer support calls
    - No public deflection-rate or CSAT by channel
  - - Vendor payment status and onboarding
    - Vendors phone AP teams and submit banking changes manually
    - Vendor portal exposes payment status and self-service verification of identity/banking details
    - Cuts phone/email chasing and adds fraud-control workflow around payout changes
    - Actual fraud-loss reduction and vendor-adoption rates are not disclosed
  - - Field inspections, violations, and work orders
    - Managers capture notes later or rely on connectivity in the field
    - Manage app supports offline inspections, geotags, violations, and work-order tracking
    - Faster field capture and fewer missed updates
    - No public proof on sync reliability or mobile uptime
  - - Portfolio reporting and queue supervision
    - Supervisors pull static reports after the fact
    - Vantaca IQ and AskIQ surface live queues, KPI context, invoice approvals, and response performance
    - Improves operational visibility and earlier intervention
    - Public evidence is testimonial-heavy rather than technically deep
  - - Software migration and go-live
    - Boards fear churn while staff fear disruption and retraining
    - Dedicated onboarding, board webinars, module champions, and structured implementation program
    - Public migration stories claim faster statement workflows and no account loss
    - Independent reviews still cite training and support friction during ramp
  notes: |-
    Benefit statements reflect public workflow claims and customer anecdotes, not audited ROI studies.
