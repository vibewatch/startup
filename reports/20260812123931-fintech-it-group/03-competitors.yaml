callouts:
  - calloutType: strength
    title: App Rating Durability Signals Structural UX Advantage
    body: >-
      monobank's 4.9-star rating across 1.13 million Google Play reviews and 910,000 App Store
      ratings—versus Privat24's 4.8 stars with 1.67 million reviews—demonstrates that monobank
      sustains higher per-user satisfaction at scale than Ukraine's dominant incumbent. The
      fractional gap (0.1 stars) across a population fraction of PrivatBank's user base suggests
      significantly higher per-user UX investment and product coherence. This rating advantage
      is not easily replicable by branch-first incumbents whose product complexity and legacy
      architecture dilute app cohesion.
    claimRefs:
      - CP016
      - CP017
      - CP018
  - calloutType: risk
    title: State-Bank Deposit Scale Is a Structural Ceiling on monobank's Deposit Gathering
    body: >-
      Oschadbank's UAH 210 billion individual deposit base reflects trust dynamics that monobank
      cannot replicate without a sovereign backstop. For risk-averse Ukrainians—particularly
      older cohorts and those in conflict-affected regions—state-bank custody remains a default
      preference. PrivatBank's 19 million active clients also represent salary routing dominance
      that creates a deposit acquisition headstart at the point of income inflow. monobank's
      deposit ceiling is behaviorally constrained, not just operationally limited.
    claimRefs:
      - CP002
      - CP013
      - CP024
      - CP035
  - calloutType: risk
    title: Adverse — Raiffeisen Parent Exit Risk Could Disrupt Private-Bank Competitive Dynamics
    body: >-
      Raiffeisen Bank International has publicly flagged consideration of a strategic withdrawal
      from Ukraine amid restructuring of its Russian and CIS exposure. If RBI exits, Raiffeisen
      Bank Ukraine's approximately UAH 265 billion in assets and substantial urban professional
      client base would require restructuring or sale. This is an adverse scenario for banking
      sector confidence but could create material client acquisition opportunity for monobank if
      service continuity degrades. Investors should monitor RBI quarterly disclosures on Ukrainian
      subsidiary strategy through 2026.
    claimRefs:
      - CP003
      - CP009
      - CP040
  - calloutType: insight
    title: Multi-Homing Means Share-of-Wallet Is the Real Competitive Metric
    body: >-
      Ukrainian retail banking customers commonly hold accounts at multiple banks (monobank plus
      PrivatBank is the most prevalent combination). In this multi-homing environment, client
      count understates competitive intensity; the relevant metric is share-of-wallet. PrivatBank's
      salary routing dominance remains the single most durable lock-in mechanism in the market;
      monobank's superior UX on discretionary spending is a wedge play, not a complete replacement.
    claimRefs:
      - CP013
      - CP014
      - CP035

