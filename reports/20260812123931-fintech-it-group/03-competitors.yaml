  - id: moat-durability-risk
    title: Moat Durability, Lock-In, and Competitive Risk
    body: >-
      monobank's competitive moat rests on three reinforcing advantages: (1) mobile-native UX
      and brand loyalty among the digital-first generation, reflected in 4.9-star app ratings
      and 10.3 million registered clients; (2) a zero-branch cost structure that enables it to
      offer higher cashback, fee-free transfers, and better deposit rates than branch-intensive
      peers; and (3) the Banka fundraising platform, which has processed over UAH 100 billion
      in donations and connects 1.6 million monthly donors to 1,300+ charities—creating a
      social-mission identity that PrivatBank's state Charity service cannot fully replicate.

      The moat faces four material threats. First, PrivatBank's client scale and state backing
      create an implicit deposit-safety advantage for risk-averse Ukrainians: state-bank deposits
      carry sovereign guarantee connotations beyond the formal Deposit Guarantee Fund (DGF)
      which covers all banks up to UAH 600,000. Second, Oschadbank's 1,150-branch physical
      network serves the population in frontline and rural areas who cannot reliably access
      digital banking—a segment monobank structurally cannot serve without branches. Third,
      Raiffeisen Bank International has publicly flagged strategic uncertainty over its Ukrainian
      operations; if it exits, client base disruption could benefit monobank through share-of-
      wallet gain but could also trigger broader confidence concerns in the private banking sector.
      Fourth, wartime power outages and internet disruptions periodically interrupt digital-only
      banking access.

      Switching costs are moderate: monobank's Diia-integrated KYC, linked FOP account, Banka
      jar history, and recurring payment automations create meaningful retention friction, but
      PrivatBank's payroll routing dominance (many Ukrainian employers route salaries to Privat24
      accounts) provides PrivatBank with a symmetric lock-in at the income inflow stage. Multi-
      homing is prevalent—many Ukrainians hold both a PrivatBank and a monobank card, making
      share-of-wallet rather than client count the relevant competitive metric.

      Ukraine's banking sector demonstrated exceptional resilience during the war: no bank runs
      occurred and deposit growth remained positive in nominal terms since February 2023. This
      stability is a sector-level moat against new entrant disruption but does not differentiate
      monobank from incumbents.
