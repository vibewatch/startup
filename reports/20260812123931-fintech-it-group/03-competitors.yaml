  - id: product-ux-comparison
    title: Mobile UX and Product Capability Comparison
    body: >-
      Mobile user experience is the axis where monobank most clearly leads. Its 4.9-star rating
      on both the Apple App Store (910,000+ ratings) and Google Play (1.13 million reviews) as of
      June 2026 stands above Privat24's 4.8 on Google Play and reflects a more enthusiastic per-
      user engagement among a client base that is smaller but more concentrated in digital-first
      Ukrainians. The Privat24 app serves a larger population (19+ million clients) at a
      marginally lower rating, suggesting PrivatBank's sheer scale and product complexity
      dilutes per-user UX coherence.

      Product breadth is where PrivatBank and Oschadbank compete on structural advantages.
      PrivatBank offers LiqPay, PrivatMoney domestic and international transfers, "Envelopes"
      goal savings at 5% per annum, consumer and mortgage loans, junior accounts (from age 6),
      and SWIFT. Oschadbank excels in physical cash access, savings-protected deposits, and
      government-backed mortgage (eOselia at 40% program share). monobank differentiates on
      UX details: one-tap FOP registration, Shake2Pay, 10-second payment cancellation, the
      Banka fundraising platform (UAH 100 billion processed), group expense splitting, eSIM,
      and QES digital signature via Diia. These features accelerate onboarding velocity (record
      99 seconds to card) and cultivate loyalty without requiring branches.

      On credit, monobank's installment market (buy-now-pay-later partnerships with KTC, Citrus,
      MOYO, Foxtrot), "Until Tomorrow" micro-loans, and credit limits up to UAH 200,000 compete
      directly with PrivatBank's "Payment by Parts" and cash loans up to UAH 500,000. PrivatBank's
      higher credit ceiling (UAH 500k versus monobank's UAH 200k) is an advantage for larger
      individual credit needs.

      monobank removed all SWIFT commission fees for both sending and receiving in June 2026—a
      product parity move directly reducing PrivatBank's cross-border service advantage. The
      Apple App Store version notes explicitly announce "ПРИБРАЛИ SWIFT-КОМІСІЇ" (SWIFT fees
      removed) as a recent update. App-store data for Raiffeisen and OTP apps were not accessible
      (HTTP 404) from the Ukrainian App Store URLs in June 2026, limiting direct rating comparison;
      NBU profiles confirm both remain solvent and systemically important but provide no UX metrics.
