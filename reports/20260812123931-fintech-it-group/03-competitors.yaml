  - id: competitor-profiles
    title: Competitor Profiles — Scale, Assets, and Customer Reach
    body: >-
      PrivatBank is the defining competitive reference point for monobank. As Ukraine's largest
      bank by assets (UAH 916,892 million per NBU, June 2026), PrivatBank serves over 19 million
      active clients—nearly double monobank's 10.3 million registered users. It is state-owned
      (100% Ministry of Finance since December 2016 nationalization), systemically important,
      and classified by the NBU as solvent. Its Privat24 mobile app recorded 4.8 stars across
      1.67 million reviews and 10 million+ downloads on Google Play as of June 2026. PrivatBank's
      physical infrastructure—1,200+ branches, 7,000+ ATMs, and 250,000+ POS terminals—creates
      a distribution moat that monobank cannot replicate. PrivatBank's 2024 annual net profit
      reached UAH 40.1 billion, generating substantial retained capital for continued investment.

      Oschadbank is the second state bank and deposit market leader. With UAH 510,545 million in
      assets and 1,150+ branches (the largest network among all Ukrainian banks), Oschadbank held
      the largest individual deposit base at UAH 210 billion at end-2024. In 2024, it led the
      eOselia state mortgage program with a 40% market share and the car lending market with a
      38% share, and achieved record pre-tax profit of UAH 18.6 billion. Oschadbank operates
      5 mobile armored banking units in frontline regions (Donetsk, Sumy, Kherson, Kharkiv,
      Chernihiv), the only bank with such a network—demonstrating wartime resilience monobank
      structurally cannot match.

      Raiffeisen Bank Ukraine (UAH 265,488 million in assets, equity UAH 41,649 million, profit
      UAH 2,038 million) and OTP Bank Ukraine (UAH 136,070 million assets, equity UAH 27,446
      million, profit UAH 1,327 million) are the dominant foreign-bank competitors. Both are NBU
      systemically important banks owned by European banking groups (Raiffeisen Bank International,
      Austria; OTP Group, Hungary). The strategic uncertainty of foreign bank owners—particularly
      RBI's publicly flagged consideration of a Ukrainian exit—represents a latent risk for their
      subsidiaries and a potential client-acquisition opportunity for monobank.

      Universal Bank's UAH 215,582 million asset base and UAH 2,590 million profit place it in
      the upper-mid tier—larger than OTP and Sense Bank but roughly a quarter of PrivatBank.
