  - id: market-sizing
    title: Market Sizing — TAM, SAM, and SOM
    body: >-
      No independently published TAM/SAM/SOM estimate for Ukraine's retail digital banking or
      neobank segment exists in open-access sources as of June 2026. All sizing must be derived
      from structural indicators: demographic scope, payment volume, and competitive penetration.
      This section presents three constrained lenses rather than one top-down estimate and
      explicitly preserves uncertainty caused by wartime population displacement, inflation,
      and private-bank opaqueness.

      TAM (Total Addressable Market) — adult banking population lens: Ukraine's pre-war resident
      population was approximately 44 million (2021 census-based estimates). Russia's full-scale
      invasion displaced an estimated 6–8 million Ukrainians abroad (UNHCR) while internal
      displacement affected millions more. The World Bank's February 2026 Rapid Damage and
      Needs Assessment (RDNA5) estimates reconstruction costs at approximately $588 billion over
      the next decade—roughly three times Ukraine's estimated 2025 nominal GDP—implying a GDP
      of approximately $196 billion. From this demographic and macro-anchor, the total adult
      banking population (the universe for any retail bank) is estimated at 22–28 million
      persons remaining in or connected to the Ukrainian economy, with significant uncertainty
      on the lower bound due to emigration and the upper bound due to displaced workers still
      holding UAH accounts.

      SAM (Serviceable Addressable Market) — smartphone and digital-intent lens: Ukraine had
      smartphone penetration of approximately 75–80% among adults before the full-scale invasion.
      The non-cash shift—94.6% of payment card transactions by number in 2024 and 8.65 billion
      total card transactions—indicates near-universal card adoption among the economically
      active population. Combining these signals, the SAM for a mobile-only bank is estimated at
      13–18 million adults who have smartphones, active payment cards, and willingness to bank
      without a branch. The NBU BankID system recorded 87.7 million identifications in 2024
      (more than doubled from 42.9 million in 2023), confirming explosive growth in digital
      identity verification as a pre-condition for remote banking.

      SOM (Serviceable Obtainable Market) — monobank competitive position: As of June 2026,
      monobank held 10.3 million registered clients, representing approximately 37–47% of the
      estimated SAM. Universal Bank's 2026 target of 10.7 million retail clients and 450,000
      FOPs represents a conservative near-term ceiling given the high existing penetration.
      Transaction intensity—UAH 8.5 trillion in the first nine months of 2025—suggests strong
      activation among the registered base, though the ratio of active to registered clients
      is not publicly disclosed.

      Statista's Ukraine banking market methodology covers net interest income across retail and
      SME banking but does not publish a neobank-specific sub-segment estimate. No analyst
      has published a CAGR for the Ukrainian neobank segment separately from the broader
      banking market, reflecting the extraordinary uncertainty of wartime sizing. Consumer
      inflation of 7.6% year-on-year in February 2026 and an NBU key policy rate of 15.0%
      further complicate revenue-based TAM projections.
