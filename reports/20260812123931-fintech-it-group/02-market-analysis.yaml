  - id: buyer-segments
    title: Buyer and User Segmentation
    body: >-
      monobank serves five primary buyer/user segments within the Ukrainian retail digital banking
      market. These segments are distinct in their workflows, budget ownership, adoption triggers,
      and revenue contribution to Universal Bank and Fintech-IT Group.

      Mass retail (salaried workers and urban consumers): This is monobank's largest and
      foundational segment—individuals who previously used branch banks and switched to mobile
      banking for fee-free payment cards, cashback programs, and peer-to-peer transfers. The
      primary adoption trigger is friend or colleague referral combined with employer salary
      routing. monobank consistently maintains the highest Net Promoter Score in Ukraine's
      banking sector, confirming strong retention in this segment.

      Freelancers and individual entrepreneurs (FOPs): Ukraine has a large self-employed
      class that registers as physical entrepreneurs (Fізична особа-підприємець / FOP) for tax
      purposes. FOPs can manage both their personal and business accounts within the monobank
      app, pay FOP social contributions to the pension fund with no commission, and access
      the business web cabinet for tax reporting. Universal Bank's 2026 FOP target of 450,000
      represents the upper bound of this segment's near-term contribution to registered users.

      SMEs using ACDC acquiring: The Fintech-IT Group subsidiary ACDC Processing enables tens
      of thousands of Ukrainian SMEs to accept digital payments via Visa and Mastercard rails
      and PCI DSS-certified infrastructure. Shake2Pay enables QR-code payment at HoReCa
      merchants via monobank. These SMEs are buyers of the technology infrastructure, not
      directly of the monobank app, but their transactions generate interchange and acquiring
      revenue within the Fintech-IT Group ecosystem.

      Donors and charity/military-support users (Banka): The Banka fundraising platform had
      over 1.6 million monthly active donors and had processed over UAH 100 billion in cumulative
      donations as of the monobank home page reporting in June 2026. This segment has no banking
      revenue function (donations are not deposits) but drives app engagement, NPS, and
      charitable brand equity that is exceptionally strong in wartime Ukraine.

      Diaspora and displaced Ukrainians: Wartime displacement of an estimated 6–8 million
      Ukrainians abroad has created demand for cross-border payment and remittance features.
      monobank's announcement of free SWIFT transfers (incoming and outgoing) in June 2026
      directly addresses this segment's cost friction. Diaspora users often retain Ukrainian
      accounts and use monobank for remittances, family support payments, and VAT refund
      routing.
