  evidenceGaps:
    - type: missing-source
      severity: material
      topic: No published Ukrainian neobank TAM/SAM from independent analyst
      missingEvidence: >-
        An independently commissioned or published market sizing report specifically for
        Ukraine's retail digital banking or neobank segment, separating neobank from aggregate
        banking NII, with CAGR estimates.
      whyItMatters: >-
        Without a published estimate, all sizing in this chapter relies on structural derivation.
        Investors conducting due diligence will not accept derived estimates as investment-grade
        market sizing and will require primary analyst data for valuation comps.
      diligencePath: >-
        Commission a bespoke market sizing from a Ukrainian financial consultancy
        (e.g., ICU, Dragon Capital Research, or Foyil Securities) or obtain any Statista
        or GlobalData sub-segment data that exists behind paywall.
      relatedQuestionRefs:
        - QM001
        - QM019
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: monobank active user ratio and credit utilisation breakdown
      missingEvidence: >-
        The ratio of monthly active users to registered clients; breakdown of credit-product
        users (instalment, revolving credit, "Until Tomorrow") as a share of the registered base;
        and net interest margin trend for Universal Bank's retail credit book.
      whyItMatters: >-
        Without activation and monetisation data, the 10.3 million registered clients cannot
        be converted into a revenue model. A high registered-to-inactive ratio would materially
        reduce ARPU estimates and valuation multiples.
      diligencePath: >-
        Request Universal Bank's management accounts or investor presentation with MAU, DAU,
        credit utilisation, and NIM segmented by product line.
      relatedQuestionRefs:
        - QM002

    - type: missing-source
      severity: material
      topic: Ukraine FOP population count and digital banking penetration among FOPs
      missingEvidence: >-
        Current count of registered FOPs in Ukraine from SSSU or NBU, combined with an
        estimate of the share that use digital banking for business account management
        vs cash/branch.
      whyItMatters: >-
        monobank's 450,000 FOP target represents a meaningful growth segment; without knowing
        the total FOP population and current digital penetration, this target cannot be
        assessed for ambition or achievability.
      diligencePath: >-
        Access State Statistics Service of Ukraine (SSSU) business registry data or
        NBU annual entrepreneurship banking report; cross-reference with monobank's
        claimed FOP account count.
      relatedQuestionRefs:
        - QM005
      relatedTableRefs:
        - TM003

    - type: stale
      severity: material
      topic: Ukraine adult population post-emigration estimates for TAM calculation
      missingEvidence: >-
        A current (2025-2026) authoritative estimate of Ukraine's resident adult population
        accounting for wartime emigration and internal displacement from UNHCR, IOM, or SSSU.
      whyItMatters: >-
