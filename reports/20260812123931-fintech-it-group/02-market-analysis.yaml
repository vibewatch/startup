callouts:
  - calloutType: insight
    title: Non-Cash Shift Is Irreversible and Structural
    body: >-
      Ukraine's 94.6% non-cash share of payment card transactions in 2024 is not a wartime
      anomaly—it is the result of a decade-long transition accelerated by COVID-19 and cemented
      by wartime necessity. For monobank, this shift means the total market of daily-payment
      banking customers is now effectively synonymous with smartphone card users, not cash
      holders. Any credit recovery will layer on top of a already-digital payment base, not
      compete with cash.
    claimRefs:
      - CM010
      - CM016
      - CM028

  - calloutType: risk
    title: Lending Suppression Limits Revenue Beyond Interchange
    body: >-
      Ukraine's bank loan portfolio declined approximately 30% in real terms versus pre-war
      levels. The sector's liquidity coverage ratio exceeds the regulatory requirement by 330%—
      a high-liquidity, low-lending paradox that reflects elevated NPL uncertainty and high
      policy rates (15% as of June 2026). Until lending recovers, monobank's revenue model
      is disproportionately dependent on interchange and fee income rather than the NII-driven
      model of a mature consumer credit bank.
    claimRefs:
      - CM034
      - CM035
      - CM039
      - CM044

  - calloutType: assumption
    title: Market Size Estimates Are Subject to Extreme Wartime Uncertainty
    body: >-
      All TAM/SAM/SOM figures in this chapter are derived estimates, not published analyst
      reports. Ukraine's population, GDP, and banking sector metrics are subject to revision
      as the war continues. Investors should treat the 22–28M TAM and 13–18M SAM as
      illustrative boundaries, not investment-grade forecasts. The only hard anchor is
      monobank's 10.3 million registered clients as of June 2026.
    claimRefs:
      - CM040
      - CM041
      - CM042
      - CM043

