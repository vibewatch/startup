      - number: '3.4'
        title: SME and FOP Business Banking
        blocks:
          - type: paragraph
            body: >-
              Small-business (FOP/SME) banking is an emerging competitive dimension where monobank is catching up to
              branch-dependent incumbents. monobank introduced one-tap FOP registration, a private web accounting
              cabinet, ACDC processing for merchant acquiring (holding Visa, Mastercard, and PCI DSS certifications),
              and social payment support (pension fund, salary withdrawals), making it a credible alternative to
              traditional business accounts.

              PrivatBank, as Ukraine's dominant corporate and merchant bank, processes the majority of POS payments
              through its 250,000+ POS terminal network and offers SWIFT, payroll, and trade finance to SMEs. Its
              Privat24 for Business product integrates into Ukrainian payroll infrastructure and salary-card schemes.
              Oschadbank disbursed UAH 14.5 billion in new business loans in 2024 with 30% issued under partnership
              programs at rates starting from 0.01% per annum, and actively participates in state-subsidized Affordable
              Loans 5-7-9% program—which directed over UAH 62 billion to entrepreneurs in 2024. Oschadbank also holds a
              30% market share in energy project financing for large businesses.

              Raiffeisen Bank Ukraine and OTP Bank Ukraine are mid-tier SME lenders with strong trade finance and SWIFT
              capabilities, useful for Ukrainian exporters or businesses with European counterparties.

              The competitive gap for monobank in SME is structural: state-subsidized lending programs (5-7-9%, eOselia)
              and the Affordable Loans guarantee scheme are administered primarily through PrivatBank and Oschadbank
              under Ministry of Finance arrangements. monobank does not appear in public disclosures as a significant
              participant in these subsidized state lending programs, limiting its ability to compete on rate for
              credit-seeking SME clients. Precise SME loan market shares at the bank level are not publicly disclosed by
              the NBU; this is a material evidence gap for assessing monobank's FOP penetration depth.
