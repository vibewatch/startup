      - number: '4.6'
        title: Financial Disclosure Gaps and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              monobank's dual-entity structure, combined with neither entity's status as a public company or
              EU-supervised institution required to publish full IFRS accounts in English, creates a comprehensive
              information asymmetry that limits investor underwriting from public sources.

              First, no consolidated monobank or Fintech-IT Group P&L exists publicly. Universal Bank's NBU-reported
              financials cover the entire banking entity, not the monobank product line. Fintech Band's statutory
              accounts are available in Ukrainian business registries (YouControl, OpenDataUA) as raw Ukrainian-language
              filings but have not been audited in English-language IFRS format. The FY2024 revenue and profit figures
              cited throughout this chapter derive from Ukrainian media reporting on registry data — not from
              management-confirmed audited accounts.

              Second, key bank-level unit economics are entirely absent from the English-language supervisory profile:
              net interest margin, loan-to-deposit ratio, NPL ratio specific to Universal Bank, cost-to-income ratio,
              and provision coverage ratio. The NBU supervisory profile publishes only assets, liabilities, equity, and
              profit/loss in English. All detailed breakdown pages are in Ukrainian only.

              Third, the FY2024 revenue and profit decline for Fintech Band (–33% revenue, –63% net profit) is a
              significant adverse signal with no public management explanation. UMAEF's investor communications
              reference "strong fundamentals and high growth profile" without addressing the year-over-year decline.

              Fourth, no FY2025 full-year results for either Universal Bank or Fintech Band have been publicly released
              as of the June 2026 run date, leaving the most recent public financial data at FY2024. The gap between the
              October 2025 UMAEF investment thesis and the public financial record creates a risk that management's
              growth narrative relies on unpublished FY2025 data not available to outside investors.
