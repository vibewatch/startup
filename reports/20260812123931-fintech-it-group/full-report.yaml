  - id: FM001
    title: Market Sizing Lens (Pyramid)
    type: pyramid
    layout: standard
    summary: >-
      Three-tier market sizing lens for Ukrainian retail digital banking: TAM bounded by war-adjusted adult population,
      SAM by smartphone and digital-intent adoption, SOM by monobank's current registered base.
    data:
      nodes:
        - id: tam
          label: TAM — Total Adult Banking Population (22–28M)
          detail: >-
            Ukraine's adult population available for any retail bank, adjusted for wartime emigration (estimated 6–8M
            displaced abroad). Range: 22–28 million persons. Derived from pre-war adult population (~33M) minus
            emigration estimate.
        - id: sam
          label: SAM — Smartphone-Enabled Digital Banking Users (13–18M)
          detail: >-
            Adults with smartphones and willingness to bank mobile-only. Constrained by smartphone penetration (~75–80%
            pre-war), non-cash card adoption (94.6%), and digital identity access (Diia/BankID). 87.7M BankID IDs in
            2024.
        - id: som
          label: SOM — monobank Obtainable Clients (10.3M current / 11M+ target)
          detail: >-
            monobank's realistic client capture given competitive intensity (PrivatBank, Oschadbank, Raiffeisen) and
            brand penetration. Current: 10.3M registered (June 2026); 2026 target: 10.7M retail + 450K FOPs per
            Universal Bank.
    approximationNotes: >-
      TAM is estimated from Ukraine's 2021 census-based adult population (~33M) minus emigration/displacement estimate
      (~5–11M depending on source) rather than a published banking-specific TAM figure. SAM applies smartphone
      penetration (~75–80%) and non-cash adoption rate (94.6%) as proxies for digital-banking willingness. SOM is the
      only anchor point supported by primary source data (Google Play and Apple App Store self-reported, June 2026). No
      independent analyst publishes a Ukrainian neobank TAM.
    claimRefs:
      - CM008
      - CM010
      - CM011
      - CM020
      - CM041
