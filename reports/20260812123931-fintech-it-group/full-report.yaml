      - number: '6.5'
        title: App Store Ratings, UX Reviews, and Service Experience
        blocks:
          - type: paragraph
            body: >-
              monobank's App Store rating of 4.9 stars from 910,000 ratings makes it the highest-rated banking
              application in Ukraine by review volume. The Google Play listing as of June 2026 also shows 4.9 stars from
              1.13 million reviews—indicating consistent cross-platform sentiment and a user base that actively engages
              with the review mechanism. Version 8.16, published on June 15, 2026 (six days before the research date),
              removed SWIFT fees for both sending and receiving international payments for all user types, demonstrating
              active product iteration. The developer (Universal Bank | Monobank) actively responds to user reviews in
              Google Play, a visible community engagement signal.

              Adverse customer signals in the top reviews are specific and meaningful for diligence purposes. Reviewer
              John Smith (Google Play, June 5, 2026) explicitly downgraded monobank from a 5-star to a 3-star rating
              because of: (1) the absence of proper two-factor authentication using authenticator apps (only SMS/in-app
              2FA is available), and (2) the absence of a session-visibility feature showing recent logins. This review
              was marked helpful by other users and reflects a security UX gap that security-conscious
              users—particularly IT professionals and FOP users handling business transactions— would identify as a
              meaningful deficiency. Reviewer Sergey Surazhskyi (January 2026) also gave 3 stars, criticizing the forced
              migration to the monobank 2.0 UI design with no option to retain the old interface, while noting that
              monobank's transfer limits and fees remain "acceptable" compared to competitors—including a pointed
              reference to CEO Gorokhovskyi's public position against Revolut.

              Customer support is available 24/7 via messenger and phone, which the company describes as its "customer
              care team." The NBU banking sector review notes Ukraine's banking sector maintained digital service
              continuity throughout the wartime period, corroborating monobank's claimed service availability. No
