companyProfile:
  summary: >-
    Fintech-IT Group (formerly Fintech Band) is the Ukrainian fintech holding company and technology developer behind
    monobank, the country's largest mobile-first neobank. The consumer banking product runs under JSC Universal Bank's
    license, while the software, product design, processing, and adjacent fintech services are built by Fintech-IT
    Group. As of June 2026 the monobank ecosystem served more than 10.3 million registered clients. In October 2025,
    UMAEF (Ukraine-Moldova American Enterprise Fund) became Fintech-IT Group's first external institutional investor,
    pushing the tech entity above a $1B valuation. Universal Bank reported UAH 215.6B in assets and UAH 2.59B in profit
    in the latest NBU supervisory profile; Fintech Band reported FY2024 revenue of UAH 3.71B with a 31% net margin, both
    shaped by wartime operating conditions.
  foundedDate: '2017-11-01'
  founders:
    - name: Oleg Gorokhovskyi
      role: Co-founder & CEO, Fintech-IT Group
      background: >-
        Former senior manager at PrivatBank, Ukraine's largest bank; previously spearheaded PrivatBank's digital banking
        products.
      claimRefs:
        - CO004
    - name: Mykhailo Rohalskyi
      role: Co-founder, Fintech-IT Group
      background: Former senior manager at PrivatBank; co-author of the monobank concept alongside Gorokhovskyi.
