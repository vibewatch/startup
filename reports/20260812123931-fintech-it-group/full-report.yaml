    title: Growth Drivers and Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for monobank
      - Diligence Ask
    rows:
      - - Non-cash shift (94.6% of card transactions by number in 2024)
        - Driver (+)
        - Current / structural
        - Converts cash users to card users; monobank's fee-free card is the dominant switch trigger
        - Track NBU annual non-cash data; measure monobank's share of new card issuances
      - - Diia digital identity (99-second account opening)
        - Driver (+)
        - Current / structural
        - Eliminates onboarding friction; monobank record is 99-second registration; accelerates SAM conversion
        - Monitor NBU BankID annual identification volumes; track Diia API availability SLAs during wartime outages
      - - Wartime digital resilience (no bank runs; deposit growth)
        - Driver (+)
        - Current / ongoing
        - Digital-only bank free from branch exposure; maintains access during electricity blackouts via app
        - Assess Universal Bank's business continuity protocols; check data center redundancy post-attack
      - - Affordable Loans 5-7-9% programme (16,000+ loans; UAH 62B in 2024)
        - Driver (+)
        - Recent / medium-term
        - SME/FOP credit demand partially state-subsidised; monobank can originate and distribute
        - Verify monobank's share of programme originations; assess dependency on state subsidy continuation
      - - Ukraine reconstruction demand ($588B over decade)
        - Driver (+)
        - Medium-to-long-term
        - Structural demand for payroll, SME credit, contractor payments, insurance in reconstruction economy
        - Depends on peace conditions and institutional investor inflows; highly uncertain timing
      - - Free SWIFT transfers (June 2026 announcement)
        - Driver (+)
        - Current
        - Removes key cost friction for diaspora/displaced segment; cross-border user retention
        - Confirm commercial viability; assess FX hedging cost absorbed by Universal Bank
      - - Loan portfolio decline (~30% real decline vs pre-war)
        - Constraint (–)
        - Current / structural
        - Suppresses NII-based revenue; monobank must rely on interchange, cashback merchant fees, fee income
        - Obtain Universal Bank's net interest margin trend 2022–2025; compare vs pre-war baseline
      - - NPL accumulation and hidden credit risk
        - Constraint (–)
        - Current / worsening
        - Monobank's consumer credit underwriting faces adverse selection from income-volatile wartime borrowers
        - Request NPL ratio for Universal Bank's retail credit portfolio; compare vs sector average
      - - State-bank dominance (50% of sector assets)
        - Constraint (–)
        - Structural / political
        - Limits monobank's access to payroll banking, government program distribution, institutional deposits
        - Track privatisation schedule for PrivatBank; assess timeline for state share reduction post-war
      - - NBU key policy rate at 15% (down from 25% peak in 2022)
        - Constraint (–)
        - Cyclical / improving
        - Elevates borrowing cost floor; compresses monobank consumer credit spread vs cost of funds
        - Monitor NBU rate decisions; model NIM sensitivity at 12%, 13%, 15% rate scenarios
      - - Income volatility and emigration (6–8M displaced)
        - Constraint (–)
        - Current / structural
        - Reduces active credit user base; creates adverse selection among remaining borrowers
        - Obtain monobank's active user ratio (active/registered); track FOP registration trend
      - - Energy infrastructure vulnerability
        - Constraint (–)
        - Ongoing / wartime
        - Electricity outages disrupt smartphone access; monobank's resilience depends on mobile network uptime
        - Review Universal Bank's wartime IT incident disclosures; assess offline payment mode capability
    notes: >-
      Timing labels: "current" = active as of June 2026; "recent" = emerged in last 12 months; "medium-term" = 2–5 year
      horizon; "structural" = multi-year, not cyclical. "Direction" indicates whether the factor benefits (+) or
