      - number: '7.2'
        title: Bank-Level Solvency, Credit Quality, and Funding Risk
        blocks:
          - type: paragraph
            body: >-
              monobank's banking operations are entirely hosted within Universal Bank (JSC), a privately owned,
              systemically important institution regulated by the NBU. As of Q1 2026, Universal Bank reported assets of
              UAH 215.6 billion, liabilities of UAH 187.1 billion, equity of UAH 28.4 billion, and profit of UAH 2.59
              billion. The bank participates in the Deposit Guarantee Fund and is classified as solvent by the NBU.
              These headline metrics are reassuring, but investors must distinguish the bank-level risk from the
              technology-company risk: Universal Bank's loan book quality—including monobank's unsecured consumer credit
              portfolio—is not separately disclosed.

              Ukraine's banking sector NPL ratio has been rising since the start of the full-scale war. VoxUkraine
              analysis (based on NBU data) notes the sector's loan portfolio declined roughly 30% in real terms versus
              pre-war levels, with hidden NPL risks uncovered only as the NBU resumes comprehensive asset quality
              reviews (AQRs) and resilience assessments. Further profitability expectations are subject to risks from
              "yet hidden NPLs." For monobank, where the product offering includes unsecured installment credit,
              short-term "until tomorrow" micro-loans, and consumer lending, a deteriorating consumer credit environment
              directly translates to higher provision charges, lower margins, and reduced distributable profits from
              Universal Bank to the group.

              The 2024 Fintech Band revenue decline (1.5× fall to UAH 3.71B) and profit decline (2.7× fall to UAH 1.15B)
              are unexplained by any public disclosure and may partly reflect higher credit losses, slower loan
              issuance, or increased provisioning. A further prolonged deterioration in Ukraine's macro
              environment—lower consumer spending, higher unemployment in affected regions, currency weakness—would
              compress Universal Bank's reported profit and may trigger NBU-mandated capital increases, diverting
              resources from product investment. Investors cannot independently model this risk without access to
              Universal Bank's detailed loan-quality segmentation or monobank-attributed credit data.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: Regulatory and Licensing Risk
        blocks:
          - type: paragraph
            body: >-
              monobank's entire banking activity—including deposit-taking, credit issuance, and card operations—depends
              on NBU license No. 92 held exclusively by Universal Bank since January 20, 1994. If this license were
              revoked or suspended—whether due to capital adequacy failure, AML violations, sanctions exposure, or
              management misconduct—monobank would be unable to operate as a bank overnight. This is a hard dependency
              with no fallback: Fintech-IT Group holds no banking license of its own.

              ACDC Processing held NBU recognition as a "significant payment infrastructure operator" from 2021 to 2025,
              enabling Visa/Mastercard and PCI-DSS-certified transaction processing. The continuity of this regulatory
              status after 2025 is not confirmed in publicly available sources, creating an unresolved gap in the
              payment infrastructure risk picture.

              On the regulatory horizon, Ukraine's ongoing EU Association Agreement implementation requires progressive
              alignment of banking regulation with EU directives, including capital requirements (CRD/CRR-equivalent),
              data privacy (GDPR-aligned), AML/CFT standards, and consumer protection rules. Each of these dimensions
              can introduce compliance costs and operational restructuring requirements. The NBU Financial Stability
              Report 2025 highlights macroeconomic, credit, and operational risks for Ukrainian banks and notes that
              "the focus on risk control and ensuring continuous operations remains a priority." The NBU's supervisory
              remit also covers consumer-protection enforcement: monobank users can submit complaints directly to the
              NBU's consumer-protection office, creating a regulatory feedback channel on service failures.
