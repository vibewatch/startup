  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The Ukrainian retail banking market is shaped by a wartime structure in which state-owned
              banks—PrivatBank, Oschadbank, and the nationalized Sense Bank—hold approximately 50% of net sector assets,
              providing an implicit sovereign safety signal that private and foreign banks cannot replicate. Within this
              environment, monobank (operating via JSC Universal Bank) competes on three distinct fronts: (1) against
              the dominant state bank PrivatBank for mass-retail mobile banking and payments; (2) against Oschadbank for
              deposits, mortgage, and SME lending, particularly in regions where Oschadbank's physical presence is the
              only banking option; and (3) against foreign-bank subsidiaries Raiffeisen Bank Ukraine and OTP Bank
              Ukraine for the urban, digitally proficient, and internationally mobile segment.

              A fourth competitive tier is Sense Bank (formerly Alfa-Bank Ukraine, state-controlled after Russia's 2022
              full-scale invasion severed its Russian parent's ownership), which retains physical branches and legacy
              client relationships but earns only UAH 372.6 million profit versus PrivatBank's UAH 16 billion in the
              most recent NBU reporting period, signalling structural competitive weakness.

              The competitive analysis is bounded to Ukrainian retail and SME banking. Global neobanks (Revolut, Wise,
              N26) are explicitly excluded: NBU licensing requirements and UAH transfer restrictions preclude them from
              offering monobank's full product suite to Ukrainian residents, making them at most partial substitutes for
              cross-border payments rather than domestic banking alternatives. Status-quo substitutes—cash and dormant
              Oschadbank passbook accounts—are in secular decline given 94.6% non-cash payment share in 2024. The NBU
              BankID system doubled its identification volume from 42.9 million to 87.7 million in 2024, confirming that
              digital onboarding infrastructure is now broadly accessible.
