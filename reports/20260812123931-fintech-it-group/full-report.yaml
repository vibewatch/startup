chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Legal Structure, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              monobank describes itself as Ukraine's first branchless bank—a retail banking product built for
              mobile-first customers who want financial services without physical branches. It launched in 2017 and is
              operated through a deliberate dual-entity structure: all banking activities (deposits, loans, cards,
              regulatory compliance) are conducted by JSC Universal Bank, a licensed commercial bank holding NBU license
              No. 92 issued on January 20, 1994. The technology—app, back-end, payment processing, and adjacent fintech
              products—is developed by Fintech-IT Group (previously known as Fintech Band LLC), an IT holding company
              co-founded by Oleg Gorokhovskyi and Mykhailo Rohalskyi.

              This structure matters for diligence because the two entities have separate ownership, boards, and risk
              profiles. Universal Bank is owned by Serhiy Tihipko through TAC Group and is classified by the NBU as
              solvent and systemically important. Fintech-IT Group is beneficially owned by Gorokhovskyi and Rohalskyi
              through Cyprus-based holding vehicles. The monobank trademark is co-owned by Universal Bank and
              Kilobyte1024 (a Gorokhovskyi/Rohalskyi entity), while the broader mono brand is held via Cyprus-registered
              Hallstatt. Any later chapter referencing monobank's financials, governance, or customer metrics must
              disambiguate between the banking entity (Universal Bank) and the tech developer (Fintech-IT Group).

              monobank's product suite as of 2026 includes payment cards, consumer credit (installment plans, "until
              tomorrow" micro-loans), currency accounts, government bonds, deposits, peer-to-peer transfers, eSIM, group
              expenses, and the Banka fundraising platform—which had connected over 1,300 charitable foundations and
              processed over UAH 100 billion in total donations. The open API (version 250818) allows third-party
              developers to access account statements and currency data, demonstrating meaningful technical openness.
