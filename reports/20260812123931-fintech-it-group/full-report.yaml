      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Ukraine's digital banking adoption is shaped by a combination of structural enablers that accelerated the
              non-cash shift and wartime constraints that simultaneously suppressed credit volumes and created new use
              cases. monobank's market position reflects both.

              The dominant growth driver is the non-cash shift: Ukraine moved from a predominantly cash economy to 94.6%
              non-cash card transactions by number in 2024, with 8.65 billion total transactions—a transformation driven
              by COVID-19, contactless NFC proliferation (4× growth from 2019 to 2022), and wartime necessity. This
              shift is structurally irreversible and disproportionately benefits mobile-first banks because branch
              economics are destroyed in a cashless environment.

              Ukraine's Diia digital identity platform is the second key driver: it enables monobank account opening in
              under 99 seconds by eliminating physical document handling. NBU BankID identifications more than doubled
              from 42.9 million in 2023 to 87.7 million in 2024, confirming that digital identity verification is
              becoming a standard step in financial onboarding. This driver is Ukraine-specific and gives monobank a
              structural advantage over international neobanks that cannot use Diia.

              State-facilitated SME credit programs—specifically the Affordable Loans 5-7-9% program, which delivered
              over 16,000 loans worth more than UAH 62 billion to entrepreneurs in 2024—demonstrate that digital credit
              rails can unlock SME financing at scale, even in wartime. This program creates a precedent and
              infrastructure for monobank's FOP and SME credit expansion.

              Ukraine's reconstruction trajectory ($588 billion in assessed needs) implies long-run demand growth for
              digital financial rails: payroll for reconstruction workers, contractor payment chains, SME working
              capital, and insurance products will all require robust digital banking infrastructure.

              Primary constraints are equally Ukraine-specific. The bank loan portfolio declined approximately 30% in
              real terms below pre-war levels, and the sector's liquidity coverage ratio exceeds requirements by 330%—a
              paradox of excess liquidity and minimal lending. NPLs have risen steadily since the full-scale invasion,
              and hidden NPL risks constrain underwriting. The 15.0% NBU key policy rate (down from a peak of 25% in
              2022 but still elevated) compresses consumer credit margins and limits monobank's ability to price
              unsecured credit attractively. State-bank competition at 50% of net sector assets restricts payroll
              banking, institutional deposits, and government-program distribution.

              VoxUkraine's analysis characterizes the sector as "stable but not sufficient"—the banking sector's high
              liquidity buffer reveals lack of lending rather than healthy capital deployment, constraining the
              credit-based revenue model that monobank needs to scale beyond basic payment card economics.
