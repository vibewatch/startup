        - Request full financial accounts immediately; re-assess at 6–8× bear multiple → $500–600M
      - - Universal Bank bank run or insolvency
        - NBU removes Universal Bank's licence or places it under administration
        - 100% of Fintech-IT revenue base lost; valuation to zero for tech-developer entity
        - Immediate exit from pre-IPO position; engage legal counsel for wind-down scenario
      - - U.S. IPO postponed beyond 2028
        - No S-1 filing or IPO-track announcement by Q4 2027
        - Exit window closes; UMAEF cannot return capital; secondary market illiquid
        - Renegotiate redemption rights or seek strategic acquirer; apply 30–40% illiquidity discount to mark
      - - PrivatBank litigation adverse ruling
        - Court judgment imposing material liability on Gorokhovskyi, Rogalsky, or Fintech-IT Group entities
        - Management disruption; asset freeze risk; UMAEF exit trigger; governance crisis
        - Escalate to legal review; consider protective covenants; thesis break if liability is material
      - - Active war escalation to Kyiv infrastructure
        - Russian air or missile campaign causes sustained outages to monobank/Universal Bank infrastructure in Kyiv
        - Operational continuity crisis; client attrition; regulatory intervention; revenue loss
        - Monitor NBU communications; assess business-continuity protocol; pause new capital until stabilised
    notes: >-
      Triggers are defined based on publicly observable thresholds or events; monitoring paths depend on investor access
      to management accounts and NBU official communications.
    claimRefs:
      - CV012
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Consolidated financials
        - >-
          Audited consolidated FY2024 and FY2025 IFRS accounts spanning Fintech Band, ACDC Processing, all Fintech-IT
          Group subsidiaries
        - No way to verify reported UAH 3.71B revenue, 31% margin, or cause of FY2024 decline without independent audit
        - Request from Fintech-IT Group management; engage Big 4 auditor to confirm
      - - Intercompany fee agreement
        - >-
          Full text of the technology service agreement between Fintech Band and Universal Bank, including fee formula,
          term, and termination provisions
        - ~90% of Fintech Band revenue is from this single contract; termination or renegotiation destroys the thesis
        - Legal review of Hallstatt/Fintech Band corporate agreements; NBU filing if disclosed
      - - Cap table and UMAEF documentation
        - >-
          Post-UMAEF cap table; full UMAEF consortium composition and their total economic stake; preference stack,
          anti-dilution terms, drag rights, lock-ups
        - Unknown dilution dynamics and governance control; preference stack determines actual return on exit
        - UMAEF SEC disclosure (if any); request from Fintech-IT Group investor relations
      - - FY2025 Fintech Band performance
        - Unaudited management accounts for FY2025 including revenue, profit, and pipeline
        - FY2024 showed sharp declines; investors need evidence of recovery before the $1B mark can be sustained
        - Request from management; Bloomberg reported Universal Bank targeting 10.7M clients by end-2026
      - - PrivatBank litigation status
        - >-
          Current legal status of any criminal or civil proceedings involving Gorokhovskyi, Rogalsky, and any Fintech-IT
          Group entity
        - Material litigation could freeze assets, trigger UMAEF exit rights, or prevent an IPO
        - Ukrainian court registry review (ЄДРСР); legal counsel specialising in Ukrainian financial law
      - - IPO timeline and U.S. exchange eligibility
        - >-
          UMAEF's roadmap for U.S. IPO preparation, including target exchange, draft S-1 timeline, and U.S. GAAP
          conversion plan
        - IPO is the primary stated exit; without a credible timeline, exit is highly speculative
        - UMAEF press releases and SEC Edgar; direct engagement with UMAEF/Fintech-IT Group management
