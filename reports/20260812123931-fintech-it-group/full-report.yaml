      - number: '8.5'
        title: Recommendation, Confidence, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The valuation stance on Fintech-IT Group's $1 billion mark is stretched relative to the evidence base
              available from public sources. The 11× EV/FY2024 Revenue multiple is not inherently excessive for a
              high-growth fintech software company, but it is applied to a business that experienced double-digit
              revenue contraction in the most recent reported year, operates in an active war zone, has opaque
              consolidated financials, and depends on a single regulated-banking partner for over 90% of revenues. The
              per-customer value of ~$101 is the lowest among all comparable neobanks surveyed, justified by wartime
              discount and entity-structure constraints but also masking the potential asymmetric upside in a post-war,
              post-IPO scenario.

              The recommendation is track: maintain monitoring without immediate capital deployment. A track stance
              reflects medium confidence in the company's competitive position and long-term potential, balanced against
              the difficulty of financial underwriting from public sources alone. Confidence would shift to buy if: (a)
              audited consolidated management accounts demonstrating revenue recovery and strong FY2025 profitability
              become available; (b) a credible U.S. IPO timeline is announced; (c) the PrivatBank legal overhang is
              formally resolved; and (d) the post-war reconstruction thesis materially advances.

              The specific diligence asks documented in this chapter are: full consolidated management accounts for
              FY2024 and FY2025 spanning both Fintech Band and Universal Bank; a detailed breakdown of the intercompany
              fee agreement; an audited FY2025 Fintech Band IFRS report; the cap table post-UMAEF (including the UMAEF
              consortium's full composition and total stake); and the lock-up provisions, preference stack, and
              anti-dilution terms in the UMAEF investment agreement. These items represent the minimum information set
              required to move from a track to a buy thesis.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
          - type: table
            tableRef: TV006
            claimRefs:
              - CV009
              - CV030
              - CV031
              - CV041
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Adverse Hypothesis — Asset Protection, Not Pure Financial Endorsement
            body: >-
              Ukrainian market analysts raised an unconfirmed hypothesis (reported by Forbes Ukraine via KyivPost) that
              the primary motivation for UMAEF's investment was to provide a U.S. government-linked ownership shield
              against PrivatBank-related litigation risks facing the Fintech-IT Group founders. If this hypothesis is
              correct, the $18.5 million investment cannot be read as an arms-length financial endorsement of the $1
              billion mark, materially weakening the signal value of the round. This is a thesis-break risk that
              diligence must test by reviewing the investment documentation and any accompanying side letters.
            calloutType: risk
            claimRefs:
              - CV033
              - CV034
          - type: callout
            title: Dual-Entity Valuation Assumption
            body: >-
              This chapter evaluates Fintech-IT Group's $1 billion tech-developer valuation as the primary anchor. It
              does not add or attribute Universal Bank's equity (~$634 million) to the investment value; Universal Bank
              is a separately owned entity and its equity is controlled by Serhiy Tihipko through TAC Group, not by
              Fintech-IT Group's founders or UMAEF. Any sum-of-parts analysis combining both entities would require full
              arm's-length consolidation documentation not currently available in the public domain.
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
          - type: callout
            title: The 2026 IPO Optionality Signal
            body: >-
              Both Fintech-IT Group (via UMAEF's public statement) and Universal Bank have signalled intent for public
              listings — Fintech-IT on a U.S. exchange, Universal Bank on an international exchange tentatively in 2026.
              If both listings advance, they would create an unprecedented dual Ukrainian fintech-and-bank capital
              market event, likely attracting significant international investor attention to the monobank ecosystem.
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
