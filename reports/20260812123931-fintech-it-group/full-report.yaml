  - id: FV002
    title: Valuation Sensitivity — EV/Revenue at Different Revenue Scenarios
    type: bar
    layout: standard
    summary: >-
      Illustrates how the implied EV/Revenue multiple for Fintech-IT Group varies across revenue scenarios; the $1B
      anchor implies 11× at FY2024 levels but compresses to 6.7× on recovery or expands to 16.7× if revenue continues
      declining.
    data:
      items:
        - label: FY2023 implied (est. ~$135M revenue)
          value: 7.4
          unit: × EV/Rev (estimated)
        - label: FY2024 actual (~$90M revenue)
          value: 11.1
          unit: × EV/Rev
        - label: Recovery scenario ($110M)
          value: 9.1
          unit: × EV/Rev (estimated)
        - label: Bull scenario ($150M)
          value: 6.7
          unit: × EV/Rev (estimated)
        - label: Bear continuation ($60M)
          value: 16.7
          unit: × EV/Rev (estimated)
        - label: Nu Holdings (public comp)
          value: 5.4
          unit: × EV/Rev (FY2024 revenue)
        - label: Monzo (private, est.)
          value: 6
          unit: × EV/Rev (midpoint est.)
    approximationNotes: >-
      FY2023 Fintech Band revenue estimated as approximately $135M based on FY2024 ($90M) being a ~33% decline from
      FY2023. Revenue scenarios are author estimates for illustration. Nu Holdings multiple computed from Yahoo Finance
      market cap and Macrotrends revenue data. Monzo multiple estimated from secondary valuation reports and CH filing
      hints; not confirmed.
