      - number: '7.7'
        title: Kill Criteria, Monitoring Triggers, and Investment Thesis Assessment
        blocks:
          - type: paragraph
            body: >-
              Investors holding monobank exposure must define clear thesis-break thresholds that trigger reassessment or
              exit. The investment thesis rests on five core assumptions: (1) Universal Bank's solvency and license
              remain intact; (2) the Russian invasion does not escalate to Kyiv or Dnipro city destruction; (3) consumer
              credit demand in Ukraine recovers as reconstruction accelerates; (4) Gorokhovskyi and Rohalskyi face no
              criminal exposure from PrivatBank-related proceedings; and (5) the Fintech-IT Group / Universal Bank
              partnership renews or is restructured on investor-favorable terms.

              Each assumption can be monitored via observable market or regulatory signals. NBU supervisory actions
              against Universal Bank—including capital adequacy warnings, license conditions, or formal
              enforcement—would directly signal thesis item (1). Frontline military maps and UN/ICRC displacement data
              track thesis item (2). NBU monthly banking sector reviews track retail credit growth and NPL trends for
              thesis item (3). Ukrainian court records and law enforcement announcements track thesis item (4). Any
              public announcement of Universal Bank's ownership change, partnership renegotiation, or Fintech-IT Group's
              establishment of its own banking license application tracks item (5).

              The people risk at monobank is concentrated around the two founders. Gorokhovskyi serves as a public face
              and product leader; Rohalskyi handles technology and operations. There is no publicly disclosed succession
              plan, organizational resilience structure for non-founder leadership depth, or key-man insurance
              disclosure. The departure or incapacity of either founder would create acute operational and reputational
              risk for a product that is closely identified with its founders' brand.
