  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Scale and Segment Overview
        blocks:
          - type: paragraph
            body: >-
              monobank is Ukraine's largest commercial digital bank by registered client count, with more than 10.3
              million clients as of June 2026—a figure reported identically in the Apple App Store, Google Play, and the
              company's English home page. The UMAEF official press release confirmed 9.9 million clients as of
              September 2025, implying roughly 400,000 net additions in the nine months between September 2025 and June
              2026. Universal Bank CEO Iryna Starominska has publicly set a 2026 year-end target of 10.7 million retail
              customers, 18,000 legal entities, and 450,000 individual entrepreneurs (FOP accounts), which provides a
              forward anchor for evaluating customer acquisition momentum. The company's CNBC top-35 neobank ranking and
              its self-described highest NPS in Ukraine's banking sector reinforce the headline count with independent
              reputation signals.

              Importantly, monobank does not publicly distinguish registered customers from active transactors.
              Transaction volume provides a partial proxy: UAH 8.5 trillion processed in the first nine months of 2025
              (cited in Komersant Ukraine from internal company data) implies a high average transaction frequency per
              user, consistent with monobank being a primary bank for many clients rather than a secondary card.
              However, the share of inactive or dormant registered accounts is unknown, and the company has not
              disclosed monthly active user, daily active user, or card utilization rate metrics in any public filing or
              press release reviewed during this research.

              Customer distribution is geographically concentrated in Ukraine. Both the Stereo (Poland) and Koto (UK)
              international expansion projects are currently on hold, and the Scroll Media interview with CEO
              Gorokhovskyi confirmed that the current strategic focus remains the Ukrainian domestic market. No regional
              breakdown within Ukraine (e.g., by oblast) has been publicly disclosed.
