      - number: '4.2'
        title: Universal Bank Financial Profile — NBU-Reported Metrics
        blocks:
          - type: paragraph
            body: >-
              Universal Bank's NBU supervisory profile is the primary authoritative source for bank-level financial
              data. As of the most recent NBU publication, Universal Bank reported total assets of UAH 215,581.6 million
              (approximately $4.8 billion at the June 2026 UAH/USD reference rate of ~44.9), total liabilities of UAH
              187,132.8 million, equity of UAH 28,448.8 million, and profit of UAH 2,590.2 million. These figures
              reflect the banking entity only — not Fintech Band or any Fintech-IT Group subsidiary.

              The equity-to-assets ratio of approximately 13.2% (UAH 28,448.8M ÷ UAH 215,581.6M) indicates moderate
              capitalization above the NBU's minimum capital requirements, though the precise risk-weighted capital
              adequacy ratio is not provided on the English-language supervisory profile. The annualized return on
              assets of approximately 1.2% is consistent with the Ukrainian banking sector average in a
              high-interest-rate environment where banks earn significant carry from government bond holdings. Universal
              Bank holds an investment-grade domestic credit rating of uaAAA with a stable outlook from IVI-Rating
              (reaffirmed April 2026) and is classified by the NBU as solvent and systemically important. Its
              participation in the Deposit Guarantee Fund provides statutory deposit insurance for retail depositors,
              which is a material factor in maintaining depositor confidence in wartime conditions.

              These are bank-level metrics, not brand-level metrics. The UAH 215.6 billion asset base reflects the total
              balance sheet of Universal Bank, which includes the monobank retail product as well as any legacy
              corporate and SME book that predates the monobank launch. No segmented data separating monobank retail
              revenue from other Universal Bank business lines is publicly available in English. Universal Bank files
              quarterly statutory accounts in Ukrainian on its website, but these have not been independently audited in
              English-language IFRS format accessible to international investors.
