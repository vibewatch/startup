      - number: '4.5'
        title: Capital Structure, Adequacy, and Wartime Banking Context
        blocks:
          - type: paragraph
            body: >-
              Universal Bank's equity base of UAH 28.4 billion (~$634 million) provides a substantial capital buffer
              relative to Ukraine's wartime banking landscape. The bank's NBU classification as solvent and systemically
              important implies it meets and is subject to enhanced capital adequacy, liquidity, and recovery-planning
              requirements. The uaAAA domestic credit rating (stable, April 2026) from IVI-Rating corroborates
              short-term financial soundness; however, this is a Ukrainian national-scale rating and is not directly
              comparable to international ratings from S&P, Fitch, or Moody's.

              At the sector level, VoxUkraine's analysis confirms that the Ukrainian banking sector entered the
              full-scale war with a capital adequacy ratio of approximately 21% of risk-weighted assets — well above the
              NBU minimum — and that CAR recovered to that level by March 2023. However, the sector-wide non-performing
              loan ratio was on a declining path before the war and has been growing since February 2022, reflecting
              deferred NPL recognition and war-related credit losses, particularly in mortgage and SME exposures in
              frontline and occupied territories. Bank lending to the private sector declined approximately 30% in real
              terms versus pre-war levels, with banks preferring low-risk government bond holdings at the elevated NBU
              policy rate. Universal Bank's specific NPL ratio is not disclosed on the English-language supervisory
              profile page. VoxUkraine also flagged windfall tax considerations for the banking sector, noting that the
              fiscal burden of elevated profits from government bond carry could face policy action.

              The NBU maintained its key policy rate at 15% as of June 18, 2026 — unchanged since January 2026. The
              IMF's November 2025 staff-level agreement on an $8.1 billion 48-month EFF and Ukraine's ~$54.8 billion
              international reserves (as of March 2026, covering approximately 5.7 months of imports) anchor
              macrofinancial stability. World Bank estimates Ukraine's reconstruction cost at ~$588 billion over the
              next decade, creating ongoing credit risk uncertainty for any Ukrainian bank with exposure to war-affected
              collateral and borrowers.

              Fintech-IT Group's capital position is less transparent. The UMAEF investment (estimated at ~$18.55
              million by Forbes Ukraine, implying ~1.9% stake at the $1 billion valuation) was a growth equity round
              allocated to SME product development and expansion. No cash balance, burn rate, or runway metric for
              Fintech-IT Group or Fintech Band has been publicly disclosed. Both Fintech-IT Group and Universal Bank
              have signaled IPO aspirations on a US exchange, but without confirmed timelines or filing schedules.
