      - CV010
      - CV011
      - CV017
      - CV018
      - CV021
  - id: FV003
    title: Valuation and Return Range — Bull / Base / Bear at $1B Entry
    type: range
    layout: standard
    summary: >-
      Low, base, and high implied exit valuations for Fintech-IT Group relative to the $1B UMAEF-round entry, expressed
      in USD billions.
    data:
      items:
        - label: Bear scenario exit (distressed / delayed IPO)
          low: 0.4
          value: 0.5
          high: 0.6
        - label: Base scenario exit (IPO at 10–12× recovered revenue)
          low: 0.9
          value: 1.1
          high: 1.4
        - label: Bull scenario exit (war ends, US IPO at 15× revenue)
          low: 1.5
          value: 2
          high: 2.5
        - label: UMAEF entry valuation (Oct 2025)
          low: 1
          value: 1
          high: 1
    approximationNotes: >-
      All values are USD billions. Valuation estimates are scenario-based, applying EV/Revenue multiples to projected
      Fintech Band revenue; not based on DCF or official financial models. Bear range reflects distressed exit at 5–7×
      on $60–90M revenue. Base range reflects 10–12× on $90–120M. Bull range reflects 15× on $100–165M revenue post-war.
      Pre-money entry assumes $1.0B as the UMAEF-round anchor; actual post-money is unconfirmed (stake size and total
      capital raised not disclosed).
    claimRefs:
      - CV001
      - CV010
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: Investment KPIs — IC-Ready Scoring for Fintech-IT Group Valuation
    type: kpi
    layout: standard
    summary: >-
      Investment committee scoring across market, proof, moat, economics, risk, valuation, and evidence quality for
      Fintech-IT Group / monobank as of June 2026.
    data:
      items:
        - label: Market opportunity
          value: 6
          unit: /10
          detail: Ukraine mobile banking dominant but single-country war-affected market; TAM ~22–28M adults
          tone: neutral
        - label: Product proof
          value: 8
          unit: /10
          detail: '#1 NPS in Ukraine banking, top 35 neobank globally, 10.3M clients, UAH 8.5T transactions'
          tone: positive
        - label: Competitive moat
          value: 7
          unit: /10
          detail: Network effects, highest app rating,
          tone: positive
        - label: Economics / profitability
          value: 4
          unit: /10
          detail: 31% net margin FY2024 good in isolation but revenue −33% and profit −63% YoY; unaudited
          tone: warning
        - label: Risk profile
          value: 3
          unit: /10
          detail: Active war, single-client concentration, PrivatBank litigation, opacity, exit illiquidity
          tone: negative
        - label: Valuation vs evidence
          value: 4
          unit: /10
          detail: 11× EV/declining revenue; ~$101/customer vs peers at $556–$1,000; single small-stake anchor
          tone: warning
        - label: Evidence quality
          value: 3
          unit: /10
          detail: No audited consolidated IFRS; no cap table; no intercompany fee disclosure; no lock-up terms
          tone: negative
        - label: Exit clarity
          value: 4
          unit: /10
          detail: UMAEF signals US IPO; Universal Bank signals 2026 listing; no S-1 filed; timeline speculative
          tone: warning
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV011
      - CV012
      - CV028
      - CV036
      - CV037
