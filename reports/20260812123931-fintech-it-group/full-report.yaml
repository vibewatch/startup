      - number: '7.6'
        title: Concentration, Partner Dependency, and Valuation Risk
        blocks:
          - type: paragraph
            body: >-
              monobank's most structurally distinctive risk is its single-threaded dependency on Universal Bank. Every
              regulated banking activity—holding deposits, issuing credit, operating payment cards, and conducting
              KYC—requires the NBU banking license held by Universal Bank. Universal Bank is owned by Serhiy Tihipko, a
              separate party with no disclosed long-term contractual commitment to maintain the partnership. The terms
              of the Fintech-IT Group / Universal Bank technology and services agreement—including duration,
              exclusivity, revenue share arrangements, and termination rights—are not publicly disclosed. If Universal
              Bank were to withdraw from or limit the partnership, or if Tihipko sought to monetize Universal Bank
              through a sale to a party hostile to the arrangement, Fintech-IT Group would have no immediate fallback
              banking infrastructure.

              Geographic and infrastructure concentration compounds this risk. Fintech-IT Group's two offices are in
              Kyiv and Dnipro—cities that have faced Russian missile strikes. While the tech team also works remotely
              across Ukraine, concentration in these two cities creates single-point vulnerabilities for senior
              leadership continuity.

              International expansion has been paused. The Stereo by mono (Poland) and Koto (UK) projects are explicitly
              "on hold," and monobank holds no EU or UK banking license. This means the entire valuation is anchored to
              a single-country market facing wartime headwinds, with no near-term international diversification path.

              Valuation risk is directly tied to exit feasibility. The UMAEF-led $1 billion+ valuation established in
              October 2025 creates a step-up that requires a strategic sale, secondary transaction, or eventual IPO at
              multiples above typical Ukrainian private equity norms. No Ukrainian fintech has previously achieved an
              IPO on a major exchange. UMAEF and the private investors' put/call rights and liquidity timeline are not
              disclosed. Fintech Band's 2024 revenue and profit declines further raise the question of whether the $1
              billion valuation can be sustained through a due-diligence process by an arms-length strategic buyer.
