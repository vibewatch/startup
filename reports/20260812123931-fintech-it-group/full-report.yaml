      - number: '6.4'
        title: Banka Fundraising Platform and Donation Community
        blocks:
          - type: paragraph
            body: >-
              The Banka (literally "jar") feature is one of the most distinctive customer segments in monobank's
              portfolio and one of the most-cited data points in public communications: more than 1,300 charitable
              foundations have been connected to the Banka platform; more than 1.6 million people donate monthly via
              Banka; and total cumulative donation volume through Banka has reached UAH 100 billion as of 2026. These
              three metrics appear verbatim in both the Ukrainian-language and English-language monobank home pages,
              making them the only quantified user engagement numbers monobank publishes with sub-segment granularity.

              Banka operates as savings and fundraising "jars" within the monobank app. Individual users create jars for
              personal savings goals or share jar links publicly for charitable campaigns. Foundations connect to the
              platform as verified recipients, enabling recurring monthly donations at the click of an existing monobank
              user. The charitable-foundation connectivity (1,300+ foundations including military, humanitarian, and
              civic organizations) and the monthly donation volume (1.6 million active monthly donors) together create a
              civil-society engagement loop that materially raises the cost of switching away from monobank for engaged
              donors. This is arguably the strongest retention signal available from public data—since a Banka donor who
              has set up recurring donations to a foundation must actively cancel those donations before departing.

              The total donation volume (UAH 100 billion) provides a transaction-intensity anchor for the platform. At
              1.6 million monthly donors and the historical exchange rate, this implies average cumulative donations per
              donor well into five-digit hryvnia territory—far above a casual use pattern. The Banka platform also
              serves as a direct wartime community signal: military-fundraising jars are explicitly marketed, and the
              "Raise funds for the Armed Forces of Ukraine" messaging appears on the app's official App Store listing.
              No independent audit of foundation-level disbursements or donor satisfaction with foundation fund-use has
              been identified in this research.
