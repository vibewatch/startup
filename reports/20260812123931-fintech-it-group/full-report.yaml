      - number: '5.2'
        title: FOP/Business Banking and Merchant Acquiring
        blocks:
          - type: paragraph
            body: >-
              monobank's FOP (individual entrepreneur) product branded "FOP mono" targets freelancers, IT professionals,
              online merchants, service providers, and creators. Account opening requires only 9 clicks for existing
              monobank cardholders, with the official speed record at 13 seconds. The FOP account charges UAH 0 for
              opening, maintenance, IBAN-based transfers, and a linked debit card; cash withdrawal is free up to UAH
              50,000 per month via transfer to a personal account. Additional FOP services include currency accounts in
              USD and EUR, a second current hryvnia account for business-line segregation, a social-payments account for
              parental leave and sick pay, and accountant delegation by phone number supporting up to 10 linked
              contacts. An online business cabinet serves desktop-based accounting workflows.

              Merchant acquiring ("plata by mono") offers four modalities: internet acquiring for websites and in-app
              payment links, branded POS terminals with fiscal receipt issuance, SoftPOS (phone-as-terminal via the
              merchant's own handset), and a QR-stand solution. The stated commission is 1.3% for Ukrainian-issued cards
              and 2.0% for foreign cards; POS terminal rental is UAH 500 per month while internet acquiring and SoftPOS
              have no hardware cost. Funds settle to the merchant's account within 24 hours. The company claims over 98%
              of acquiring payments succeed on the first attempt with round-the-clock processing and anti-fraud
              protection. Business cabinet features include analytics, payment initiation, terminal management, refunds,
              and statement downloads. Additional acquiring capabilities include a software fiscal register (pRRO), fund
              reservation (escrow), card tokenization for recurring payments, and a self- service module. The acquiring
              API documentation covers 3D Secure flows, a full error-code taxonomy (bank-blocked cards, 3DS failures,
              insufficient funds, technical errors), tokenization, and refund handling.

              The payment infrastructure underlying both consumer and merchant flows is ACDC Processing LLC, a
              Fintech-IT Group subsidiary launched in 2020 that was recognized by the NBU as a significant payment
              infrastructure operator from 2021 to 2025. ACDC holds Visa, Mastercard, and PCI DSS certifications and is
              described by the founders as Ukraine's top independent technology operator of payment services.
