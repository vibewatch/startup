      - number: '7.5'
        title: Cyber, App Security, and Operational Continuity Risk
        blocks:
          - type: paragraph
            body: >-
              monobank operates entirely through mobile and web applications with no branch safety net. Its security
              architecture, as published on the monobank.ua/security page, includes PCI-DSS compliance, enhanced 3D
              Secure authentication (via the app rather than SMS), native mobile OS security mechanisms (iOS and Android
              low-level), biometric authentication (Fingerprint, Touch ID, Face ID), TLS 1.2 encryption, electronic
              digital signature for in-app agreements, anti-fraud monitoring, and anti-hacker anomaly detection. ACDC
              Processing additionally holds Visa and Mastercard certifications and PCI-DSS certification for payment
              processing infrastructure.

              However, no independent third-party security audit, penetration testing disclosure, bug bounty program
              record, or SOC 2 equivalent report has been published. The absence of external audit transparency is a
              material gap for a bank holding over 10 million customer accounts and processing the majority of Ukraine's
              non-cash payment transactions through its acquiring network.

              Customer app-store reviews reveal one persistent security complaint: the absence of a Time-based One-Time
              Password (TOTP) / authenticator app 2FA option. Users noted that security-conscious customers—especially
              those with significant balances or business accounts—feel exposed without a hardware-agnostic second
              factor. This design choice, confirmed in both App Store and Google Play review data, creates residual
              phishing/SIM-swap risk. monobank's reliance on in-app push confirmations is more secure than SMS 2FA but
              is not equivalent to TOTP for high-value accounts.

              No major publicly disclosed data breach or systemic outage has been recorded at monobank as of June 2026.
              Downdetector.com returned a 404 status when accessed for monobank- specific outage history, meaning no
              structured historical outage data is publicly available to investors. Wartime operational risk from energy
              infrastructure attacks (electricity blackouts) was documented in Ukraine during winter 2022-2023; the
              sector maintained access to cash through crisis management, but digital-only banks face a unique
              continuity challenge when internet and mobile network infrastructure is disrupted.
            claimRefs:
