  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: War, Geopolitical, and Macroeconomic Risk
        blocks:
          - type: paragraph
            body: >-
              Ukraine has been under active full-scale Russian military invasion since February 2022, and frontline
              combat continued into June 2026. The World Bank estimates total reconstruction needs at approximately $588
              billion over the next decade—roughly three times Ukraine's estimated nominal GDP for 2025. Despite this
              destruction, Ukraine's banking sector demonstrated remarkable stability: no bank runs occurred, deposits
              grew in nominal terms from February 2023, and the capital adequacy ratio (CAR) recovered to pre-war levels
              by March 2023. The NBU's proactive crisis management—emergency liquidity, rate hikes to 25% and subsequent
              easing to 15%, and gradual capital-control liberalization—prevented a systemic collapse.

              For monobank specifically, the war creates four categories of operational risk. First, Russian missile and
              drone strikes on Ukrainian power and communications infrastructure create intermittent service disruptions
              for a branchless, wholly app-dependent product. Second, personnel mobilization depletes the engineering
              workforce; monobank acknowledged the risk of talent shortages intensifying in future years. Third, if
              frontline positions deteriorate and Kyiv or Dnipro—where monobank's two offices are located—were
              threatened, operational continuity would face an existential test. Fourth, the currency and
              capital-control environment limits the investment exit window: while controls have been partially
              liberalized since 2023, full convertibility and cross-border capital flows remain restricted.

              The IMF November 2025 Staff-Level Agreement for a new $8.1 billion 48-month Extended Fund Facility reduces
              (but does not eliminate) sovereign financing risk, and the NBU's June 2026 decision to leave the key
              policy rate unchanged at 15% signals cautious stability. Ukraine's economy is projected at 2% GDP growth
              for 2025 (down from 2.9% in 2024), reflecting prolonged invasion pressure. This macro deceleration
              directly compresses consumer credit demand and increases credit-loss rates, creating second-order risks
              for monobank's revenue.
            claimRefs:
