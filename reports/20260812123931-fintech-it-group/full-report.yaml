  foundingLocation: Kyiv, Ukraine
  headquarters: Kyiv, Ukraine
  productSummary: >-
    Fully branchless mobile banking app offering payment cards, consumer credit (up to UAH 200,000), foreign-currency
    accounts, deposits, government bonds, FOP (sole-trader) accounts, acquiring at 1.3% via plata by mono, the Banka
    charitable fundraising feature, and an open public API. Products run on monobank's own ACDC Processing
    infrastructure with Visa/Mastercard and PCI-DSS certification.
  customerFocus: >-
    Ukrainian retail consumers seeking a fully mobile banking alternative; secondary focus on individual entrepreneurs
