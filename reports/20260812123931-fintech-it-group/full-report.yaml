  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              The relevant market for monobank is Ukrainian retail digital banking—specifically the delivery of consumer
              payment accounts, personal credit, deposits, peer-to-peer transfers, and adjacent digital-financial
              services through a mobile-first application to Ukrainian residents and diaspora. This market explicitly
              excludes traditional branch-based banking (which monobank replaced as a design principle), corporate
              institutional lending, and cross-border neobanking (Revolut, Wise) because NBU licensing requirements and
              UAH transfer restrictions limit international neobanks' ability to replicate monobank's full product suite
              for Ukrainian residents.

              Ukraine's banking sector entered the relevant period structurally sound but credit-suppressed. The
              asset-to-GDP ratio stood at approximately 40% in 2022—comparable to Romania but well below Poland or
              Hungary—reflecting historical underdevelopment and post-2014 consolidation. The NBU reduced the number of
              operating banks by roughly half between 2015 and 2022 through capital adequacy enforcement, raising the
              system CAR from 12.3% at end-2015 to 21% in November 2021. State-owned banks—led by PrivatBank and
              Oschadbank—account for approximately 50% of net sector assets, a share that has been stable since 2017 and
              represents the single largest competitive constraint on commercial neobanks for institutional and payroll
              banking.

              Adjacent market adjacencies include: SME digital banking (FOP accounts and ACDC acquiring), charity
              fundraising via the Banka platform, remittance and cross-border payment rails (now free SWIFT as of June
              2026), and embedded fintech products such as car insurance, eSIM, and government bonds. These adjacencies
              are included in monobank's relevant market because they are offered within the same app and contribute to
              revenue diversification and user stickiness.
