      - number: '1.3'
        title: Customer Scale, Funding History, and Key Milestones
        blocks:
          - type: paragraph
            body: >-
              monobank's growth trajectory is exceptional for a wartime context. Google Play and Apple App Store
              listings as of June 2026 both report more than 10.3 million registered clients— making monobank Ukraine's
              largest commercial digital bank and the country's second-largest retail bank overall by payment card
              count. UMAEF's October 2025 press release confirmed 9.9 million clients as of September 2025. UAH 8.5
              trillion in transactions processed in the first nine months of 2025 underscores transaction intensity, not
              just registration scale. monobank has been ranked by CNBC among the world's top 35 global neobanks and top
              250 fintech companies for two consecutive years (2024 and 2025), and consistently holds the highest Net
              Promoter Score in Ukraine's banking sector.

              The October 6, 2025 UMAEF investment was the pivotal corporate event: UMAEF—a US government-mandated fund
              created by Congress in 1994 with $150 million in initial federal funding—became Fintech-IT Group's first
              external institutional investor and led a consortium of undisclosed US private investors. The investment
              propelled Fintech-IT Group past the $1 billion valuation threshold, making it Ukraine's first fintech
              unicorn. UMAEF's stake, acquired through Hallstatt (Cyprus), is estimated at approximately 1.9% of Fintech
              Band, corresponding to roughly $18.5 million—a modest capital infusion whose strategic and reputational
              signaling value far exceeds its financial size.

              Fintech Band's 2024 financials show revenue of UAH 3.71 billion (~$92.4 million), down 1.5×
              year-over-year, and net profit of UAH 1.15 billion (~$28.6 million), down 2.7×. More than 90% of revenue
              derived from software services for Universal Bank. Fintech-IT Group employs approximately 630 people,
              about 400 of them IT professionals, with offices in Kyiv and Dnipro and a remote workforce across Ukraine.
