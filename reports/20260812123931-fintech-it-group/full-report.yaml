      - number: '7.4'
        title: Legal and Reputational Risk — PrivatBank Ties and Ownership Structure
        blocks:
          - type: paragraph
            body: >-
              The most persistent reputational overhang for monobank is the professional origin of its co-founders, Oleg
              Gorokhovskyi and Mykhailo Rohalskyi, as former senior executives of PrivatBank—the institution
              nationalized by the Ukrainian state in December 2016 after a UAH 155 billion+ capital hole was discovered.
              PrivatBank's nationalization is one of the largest bank failures in Eastern European history; the state
              ultimately recapitalized it with UAH 155.8 billion.

              The direct legal risk to Gorokhovskyi and Rohalskyi themselves is limited: neither founder has been
              publicly named as a criminal suspect in any PrivatBank-related proceeding. However, three other
              individuals who were co-owners of Fintech Band received criminal suspicion notices in the PrivatBank
              nationalization case. Former co-founders Volodymyr Yatsenko and Liudmyla Shmalchenko divested their
              Fintech Band stakes around the time they received criminal suspicion notices, per Komersant Ukraine and NV
              reporting. Dmytro Dubilet—another early shareholder—exited in 2019 for government service. These events
              mean that monobank was directly co-owned by individuals under active criminal investigation in Ukraine's
              largest bank fraud case.

              The post-April 2025 ownership restructuring—where Crestline Limited (Cyprus, 63.98%) and Nisets Limited
              (Cyprus, 14%) hold the majority of Fintech Band LLC—adds governance opacity. Gorokhovskyi confirmed
              Crestline and Nisets are Ukrainian tax residents paying taxes in Ukraine, but the Cyprus incorporation
              creates a two-step beneficial ownership layer that complicates investor due diligence. The AMCU approved
              the Crestline acquisition in April 2025, but no independent legal opinion on the Cyprus structure's
              implications under Ukrainian law has been published.

              From a diligence perspective, any institutional investor must obtain (a) a legal opinion confirming that
              Gorokhovskyi and Rohalskyi face no active criminal exposure in PrivatBank proceedings; (b) clear
              documentation of the Cyprus beneficial ownership chain; and (c) confirmation that the UMAEF investment was
              subject to OFAC and Ukrainian sanctions screening. None of these documents are publicly available.
            claimRefs:
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
