          - type: callout
            title: Lending Suppression Limits Revenue Beyond Interchange
            body: >-
              Ukraine's bank loan portfolio declined approximately 30% in real terms versus pre-war levels. The sector's
              liquidity coverage ratio exceeds the regulatory requirement by 330%— a high-liquidity, low-lending paradox
              that reflects elevated NPL uncertainty and high policy rates (15% as of June 2026). Until lending
              recovers, monobank's revenue model is disproportionately dependent on interchange and fee income rather
              than the NII-driven model of a mature consumer credit bank.
