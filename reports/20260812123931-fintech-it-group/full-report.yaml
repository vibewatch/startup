      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Non-Cash Shift Is Irreversible and Structural
            body: >-
              Ukraine's 94.6% non-cash share of payment card transactions in 2024 is not a wartime anomaly—it is the
              result of a decade-long transition accelerated by COVID-19 and cemented by wartime necessity. For
              monobank, this shift means the total market of daily-payment banking customers is now effectively
              synonymous with smartphone card users, not cash holders. Any credit recovery will layer on top of a
              already-digital payment base, not compete with cash.
            calloutType: insight
            claimRefs:
