      - number: '8.3'
        title: Peer Comparable Analysis — Global and Emerging-Market Neobanks
        blocks:
          - type: paragraph
            body: >-
              Benchmarking Fintech-IT Group against global neobank peers and public digital-banking companies provides
              critical context for the $1 billion anchor. The comparison is complicated by the entity distinction —
              Fintech-IT Group's revenue base is purely technology fees, while peers like Nu Holdings, Revolut, and
              Monzo consolidate both banking and technology revenues — but it nonetheless illuminates valuation norms.

              Nu Holdings (NYSE: NU), the most directly comparable public company (Brazilian digital bank with 100+
              million customers across Brazil, Mexico, and Colombia), traded at a market capitalization of approximately
              $61.8 billion as of June 2026 on Yahoo Finance. At peak, Nu reached approximately $81.1 billion (February
              2026). With FY2024 revenue of $11.5 billion (up 43.4% year-on-year), Nu trades at approximately 5.4×
              trailing revenue. Its PE ratio was approximately 19.6× (TTM) per Yahoo Finance. Nu serves a far larger,
              more diversified customer base in a stable regulatory environment — making the direct comparison to
              Fintech-IT Group imperfect.

              Revolut, Europe's largest neobank by valuation, was valued at approximately $45 billion in a July 2024
              secondary share sale, implying approximately $1,000 per customer at then ~45 million users. Revolut filed
              full 2025 accounts with UK Companies House in April 2026, confirming continued active operations. The
              significant premium to Fintech-IT Group on a per-customer basis reflects Revolut's multi-country scale, UK
              banking licence, and diversified revenue streams (crypto, stock trading, premium subscriptions). Monzo,
              the UK consumer neobank, has filed annual accounts with UK Companies House and was valued at approximately
              £4–5 billion (~$5–6 billion) in secondary market transactions through 2024– 2025, implying approximately
              $556–667 per customer on ~9 million UK accounts.

              N26, the German neobank, reported FY2024 revenue of approximately €440 million (growing ~40%
              year-on-year), posted its first quarterly operating profit (€2.8 million in Q3 2024), and was onboarding
              200,000+ new customers per month after German regulator BaFin lifted its customer-acquisition cap. N26 was
              last valued publicly at approximately $9 billion in 2021 — making any current P/Revenue comparison
              unreliable. Airwallex, an Australian B2B payments company, was reported in talks for a $200 million raise
              at a $6 billion valuation with 100,000 business clients, illustrating that B2B fintech infrastructure
              commands substantial valuation premiums.

              The comparable set consistently shows that Fintech-IT's $101 implied per-customer value is a substantial
              discount to Western peers. This discount is partially justified: Ukraine is a war-affected single market
              with thin exit liquidity, the tech-operator entity earns only software fees (not full banking spread), and
              disclosure opacity prevents rigorous underwriting. It also reflects potential upside for investors who
              hold through a ceasefire and IPO scenario.
            claimRefs:
