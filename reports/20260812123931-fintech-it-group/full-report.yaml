              Ukrainian retail banking customers commonly hold accounts at multiple banks (monobank plus PrivatBank is
              the most prevalent combination). In this multi-homing environment, client count understates competitive
              intensity; the relevant metric is share-of-wallet. PrivatBank's salary routing dominance remains the
              single most durable lock-in mechanism in the market; monobank's superior UX on discretionary spending is a
              wedge play, not a complete replacement.
