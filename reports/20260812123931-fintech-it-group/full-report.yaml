      - number: '4.3'
        title: Fintech-IT Group and Fintech Band Revenue and Profitability
        blocks:
          - type: paragraph
            body: >-
              Fintech Band LLC (the core entity within Fintech-IT Group) reported FY2024 revenue of UAH 3.71 billion,
              equivalent to approximately $89.6–92.4 million depending on the UAH/USD exchange rate applied. Net profit
              for the same period was UAH 1.15 billion (approximately $28.6 million), implying a net profit margin of
              approximately 31%. This is an exceptionally high margin for a technology services company, consistent with
              the capital-light, zero-branch, software-as-infrastructure model that monobank's architecture enables.
              Approximately 90% of Fintech-IT Group's consolidated 2024 revenue originated from Fintech Band, with the
              remaining ~10% from ACDC Processing, Shake to Pay/Expirenza, Kilobyte, and the MOSST acquisition (acquired
              in 2024 from Swiss bank CBH).

              However, the FY2024 results represent a material deterioration from FY2023: revenue declined approximately
              1.5× (33%) and net profit fell approximately 2.7× (63%) year-over-year. This decline is a key adverse
              signal that has not been publicly addressed by management. UMAEF's October 2025 press release describes
              Fintech-IT Group as having "strong fundamentals and high growth profile" without referencing the 2024
              decline. The Scroll.media CEO interview (November 2025) discusses the UMAEF investment and corporate
              restructuring without providing financial context for the FY2024 results. Possible explanations include
              wartime demand softening, intercompany contract restructuring during the transition from Fintech Band to
              Fintech-IT Group, one-time MOSST acquisition costs, or reclassification of certain revenue items. Without
              access to FY2023 comparative accounts and audited FY2024 IFRS statements, no cause can be attributed from
              public sources alone.

              Fintech-IT Group employs approximately 630 specialists including roughly 400 IT professionals, giving a
              revenue per employee of approximately $142,000/year — broadly consistent with Ukrainian IT sector norms,
              where developer compensation is materially below Western European and US levels but comparable to regional
              peers such as Poland or Romania.
