      - number: '5.3'
        title: Open API, Developer Platform, and Technical Infrastructure
        blocks:
          - type: paragraph
            body: >-
              monobank operates a publicly documented open API (current version 250818) at api.monobank.ua. Personal-use
              tokens are self-served from the API portal without application review, allowing any cardholder to
              authenticate and retrieve account data. The API is explicitly unavailable to customers under age 16;
              children's account data is accessible only via a parent's token.

              The personal API exposes: client profile and account list (rate-limited to one call per 60 seconds per
              token), account statements covering up to 31 days and 2,682,000 seconds per call, and Banka (savings-jar)
              data. Public endpoints—requiring no authentication—provide currency-exchange rates refreshed at most once
              per 5 minutes and a public ECDSA key endpoint for signature verification. Webhooks push real-time
              transaction events to a developer-supplied URL; the server retries at 60 and 600 seconds on non-200
              responses before disabling the hook. The API warns that unauthorized corporate use "may result in
              sanctions," enforcing a provider- API tier for services processing multiple customers' data.

              A providers API (for services routing customer data through developer servers) and an acquiring API (for
              merchant payment flows) are documented but the providers endpoint returned 403 AccessDenied during this
              research, indicating access controls beyond the personal API layer. The acquiring API documentation was
              accessible and covers the full error taxonomy, tokenization, 3D Secure, and refunds.

              Fintech-IT Group's technical subsidiaries are: Fintech Band (core app software for Universal Bank, primary
              revenue contributor); ACDC Processing (payment operator, Visa/MC/PCI-DSS certified, NBU-recognized);
              Kilobyte1024 (monobank 2.0 app redesign, international and B2B); Shake-to-Pay (QR solutions, HoReCa
              digitalization—acquired Expirenza in 2021 and TakeUsEat in 2023); and MOSST (payment operator, acquired
              from Swiss CBH bank in 2024). As of November 2025, Fintech-IT Group employed approximately 630 specialists
              with around 400 IT professionals, operating from Kyiv and Dnipro offices. A 2024 academic study confirmed
              the monobank app was downloaded more than 10 million times in 2024, consistent with the 10.3M user count.
              The share of non-cash card transactions in Ukraine reached 94.6% by number in 2024, with 8.65 billion
              total transactions, providing the macro-scale context in which monobank's infrastructure operates.
