    Fintech-IT Group controls the technology and economics behind Ukraine's dominant mobile-first neobank, but a $1B
    tech-entity valuation implies a stretched 11× FY2024 revenue multiple against a wartime backdrop of declining
    developer revenues and opaque consolidated financials — warranting deep further diligence before any commitment.
