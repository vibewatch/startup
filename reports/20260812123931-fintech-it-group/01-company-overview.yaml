callouts:
  - calloutType: strength
    title: Scale and NPS leadership in a wartime market
    body: >-
      Over 10.3 million customers and Ukraine's highest NPS in a market where digital banking
      penetration now exceeds 80% of SME financial services confirms monobank's structural
      leadership position. The Banka donation platform (UAH 100 billion processed, 1.6 million
      monthly donors) reflects genuine customer trust beyond transactional banking.
    claimRefs:
      - CO005
      - CO030
      - CO034
      - CO042

  - calloutType: risk
    title: PrivatBank lineage creates unresolved governance and litigation exposure
    body: >-
      Multiple former shareholders (Yatsenko, Shmalchenko) exited Fintech Band under criminal
      suspicion tied to the PrivatBank nationalization. Market analysts speculate that
      asset-protection through UMAEF's international institutional ownership was a motivation
      for the October 2025 deal. The risk is not resolved and must be tracked through the
      governance and risk chapters.
    claimRefs:
      - CO025
      - CO026
      - CO033
      - CO040

  - calloutType: insight
    title: Dual-entity structure is both a product advantage and a diligence complication
    body: >-
      The separation of banking license (Universal Bank) from technology developer (Fintech-IT
      Group) allows fast product iteration and a clean fintech valuation, but creates two
      separate ownership structures, governance regimes, and risk profiles that must be
      analyzed jointly. Revenue concentration above 90% in a single software contract between
      related entities is a material dependency to quantify.
    claimRefs:
      - CO001
      - CO012
      - CO021

  - calloutType: assumption
    title: 2024 revenue decline may reflect wartime accounting, not structural weakness
    body: >-
      The 1.5× revenue and 2.7× profit decline in 2024 versus 2023 is reported but not
      explained in public materials. Plausible explanations include wartime cost absorption,
      currency effects, and deferred fee recognition—none of which necessarily signal business
      deterioration. Later chapters should seek reconciliation data before treating 2024
      as a trend signal.
    claimRefs:
      - CO010
      - CO011

