  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Full Fintech Band and Hallstatt UBO chain beyond Ukrainian media reporting
      missingEvidence: >-
        Cyprus registry records for Crestline Limited, Nisets Limited, and Hallstatt confirming
        ultimate beneficial owners with full economic and voting rights detail, verified by an
        independent legal firm.
      whyItMatters: >-
        The Cyprus holding layer is only partially documented through media reports citing
        YouControl data. Without verified UBO documentation, investors cannot confirm that
        Gorokhovskyi and Rohalskyi are the sole controlling parties and that no undisclosed
        investors or related parties have economic or governance rights.
      diligencePath: >-
        Commission a Cyprus corporate search on Crestline Limited and Hallstatt via a licensed
        Cyprus registry service; cross-check against Ukrainian YouControl data and AMCU filings.
      relatedQuestionRefs:
        - QO004
        - QO025
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: material
      topic: UMAEF consortium investment size and co-investor identities
      missingEvidence: >-
        The exact investment amount from UMAEF and the identities and stakes of the
        co-investing US private investor consortium have not been publicly disclosed.
      whyItMatters: >-
        An undisclosed investor group of unknown size and identity limits proper assessment
        of capital structure, dilution impact on founders, governance rights, and potential
        strategic agendas of co-investors.
      diligencePath: >-
        Request UMAEF directly for investment agreement terms; review Hallstatt board minutes
        or shareholder agreement through legal counsel.
      relatedQuestionRefs:
        - QO009
      relatedTableRefs:
        - TO003

    - type: private-evidence-only
      severity: material
      topic: Full Universal Bank supervisory board composition and Fintech-IT Group governance structure
      missingEvidence: >-
        The complete Universal Bank supervisory board list and Fintech-IT Group's formal
        governance documents (board charter, shareholder agreement, reserved matters).
      whyItMatters: >-
        Without a full board and governance document set, it is not possible to assess the
        independence and quality of oversight of the banking entity or the related-party
        controls between Universal Bank and Fintech-IT Group.
      diligencePath: >-
        Request Universal Bank's annual report or governance disclosure; review NBU supervisory
        documentation for board approval records.
      relatedTableRefs:
        - TO002

    - type: stale
      severity: material
      topic: Fintech-IT Group 2025 consolidated audited financial results
      missingEvidence: >-
        Full-year 2025 audited financial statements for Fintech Band LLC and Fintech-IT Group
        as a consolidated entity, including post-UMAEF reporting.
      whyItMatters: >-
        The 2024 results showed a revenue and profit decline; 2025 results are needed to
        determine whether the decline was one-time (wartime effect, contract restructuring)
        or a structural trend.
      diligencePath: >-
        Obtain Fintech Band LLC statutory accounts from the Ukrainian business registry
        (YouControl or OpenDataUA) once 2025 filings are published; request consolidated
        group accounts from management.
      relatedTableRefs:
        - TO004

    - type: missing-source
      severity: minor
      topic: Stereo and Koto suspension reasons; IPO timeline and listing conditions
      missingEvidence: >-
        Specific regulatory decisions or business case failures behind the Stereo (Poland) and
        Koto (UK) project suspensions; confirmed IPO filing timeline, target exchange, and
        valuation expectations for Fintech-IT Group or Universal Bank.
      whyItMatters: >-
        The international expansion narrative is materially weakened by two halted projects
        without public explanation. The IPO signal from UMAEF is strategic intent only; without
        a confirmed timeline, it cannot be used as a liquidity anchor in valuation.
      diligencePath: >-
        Monitor Polish KNF and UK FCA registries for any Stereo/Koto application records;
        track UMAEF communications and Universal Bank investor relations announcements for
        IPO timeline disclosures.
      relatedQuestionRefs:
        - QO016
