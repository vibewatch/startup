  - id: founders-governance
    title: Founders, Leadership, Governance, and Ownership Structure
    body: >-
      Oleg Gorokhovskyi and Mykhailo Rohalskyi founded Fintech Band in 2017 after careers as
      senior executives at PrivatBank, Ukraine's largest private bank before its nationalization
      in December 2016. Their PrivatBank connection is the single most important governance
      diligence signal in this chapter. Other former PrivatBank executives were early Fintech Band
      shareholders: Dmytro Dubilet (who left in 2019 for government service), Volodymyr Yatsenko,
      and Liudmyla Shmalchenko. Yatsenko and Shmalchenko divested their stakes after being
      subject to criminal suspicion notices related to the PrivatBank nationalization case.
      This history is acknowledged in Ukrainian media but has not been publicly resolved; it
      creates legal and reputational tail risk that an investor must assess independently.

      The post-April 2025 ownership structure of Fintech Band LLC is: Crestline Limited (Cyprus)
      63.98%, Nisets Limited (Cyprus) 14%, Yevheniya Kryvenko 14%, Daria Bukreyeva 8%, with
      Rohalskyi and Horokhovskyi each holding 0.008% directly. Despite the diluted direct
      positions, Gorokhovskyi and Rohalskyi remain the ultimate beneficial owners of approximately
      37.2% each (31.96% direct plus 5.24% indirect) through the Cyprus holding layer, confirmed
      by the Ukrainian Antimonopoly Committee's April 2025 decision on Crestline's acquisition of
      control over Fintech Band. Both founders have confirmed that Crestline and Nisets are
      Ukrainian tax residents notwithstanding their Cyprus registration.

      At Universal Bank, CEO Iryna Starominska runs day-to-day banking operations and has set a
      2026 target of 10.7 million retail customers, 18,000 legal entities, and 450,000 individual
      entrepreneurs. Marcin Petrykovsky serves on the Universal Bank Supervisory Board, providing
      international governance oversight. The absence of a published full board list for
      Fintech-IT Group and the unresolved PrivatBank litigation history represent material
      governance gaps that this chapter documents but cannot close from public sources.
