callouts:
  - calloutType: strength
    title: Banka Fundraising Platform — Viral Wartime Financial Infrastructure
    body: >-
      Banka (savings jars) has evolved from a personal-savings feature into Ukraine's largest
      charitable fundraising channel, connecting over 1,300 foundations and processing over UAH
      100 billion in donations with 1.6 million monthly donors. This positions monobank as
      foundational financial infrastructure for civil society, creating deeply embedded network
      effects that are nearly impossible for competitors to replicate on a comparable time horizon.
    claimRefs:
      - CE026
      - CE027
      - CE028

  - calloutType: risk
    title: PCI-DSS Self-Assertion Without Independent Audit Confirmation
    body: >-
      monobank publicly asserts PCI-DSS compatibility on its security page, but no Qualified
      Security Assessor report, certification-body listing, or penetration-test summary was found
      in any public document during this research. Investors should request QSA reports, the
      most recent penetration-test results, and the ACDC Processing certification expiry schedule
      during due diligence.
    claimRefs:
      - CE006
      - CE046

  - calloutType: risk
    title: Single-Device 3D Secure Creates Account-Access Fragility
    body: >-
      The enhanced 3D Secure implementation routes all transaction confirmation through the
      monobank app push notification channel rather than SMS OTP. While this eliminates
      SIM-swap attacks, it creates a single-device vulnerability: loss of or inability to access
      the registered phone produces a branchless banking deadlock with no physical fallback.
    claimRefs:
      - CE007

  - calloutType: risk
    title: App Store Privacy Labeling — Broad Data Collection Scope
    body: >-
      Apple's mandated App Store privacy labels disclose that monobank collects Location, Contact
      Info, Contacts, and Identifiers linked to user identity. This breadth of linked data
      collection exceeds what many neobank competitors disclose in their equivalent Apple privacy
      labels, creating potential regulatory exposure under GDPR-analogous Ukrainian privacy law
      as the EU-integration framework deepens.
    claimRefs:
      - CE047
      - CE044

