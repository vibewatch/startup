  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security PCI-DSS
      missingEvidence: >-
        Independent PCI-DSS QSA (Qualified Security Assessor) certification report for monobank
        and/or ACDC Processing, with assessor name and certificate scope.
      whyItMatters: >-
        PCI-DSS compliance is self-asserted; without a QSA certificate any investor treating this as
        a security control cannot validate it. A certification lapse would also affect the Visa/MC
        certifications of ACDC Processing.
      diligencePath: >-
        Request QSA report in the diligence data room from the company; cross-reference against the
        Visa Global Registry of Service Providers and Mastercard SDP compliance list.
      relatedQuestionRefs:
        - QE012

    - type: private-evidence-only
      severity: material
      topic: ACDC certification
      missingEvidence: >-
        Current Visa/Mastercard/PCI-DSS certification status for ACDC Processing LLC post-2025,
        including expiry dates and scope of the NBU payment infrastructure operator recognition.
      whyItMatters: >-
        ACDC routes all monobank payment transactions. If its certification lapses or NBU recognition
        is not renewed, the entire payment stack is at risk.
      diligencePath: >-
        Request certificates directly from ACDC; cross-reference against NBU published registry
        of significant payment infrastructure operators.
      relatedQuestionRefs:
        - QE017

    - type: missing-source
      severity: minor
      topic: international expansion
      missingEvidence: >-
        Any public statement from monobank or Fintech-IT Group after November 2025 regarding
        reactivation or final closure of the Stereo (Poland) and Koto (UK) projects.
      whyItMatters: >-
        International expansion would materially change the addressable market; the pause could
        become permanent or be restarted, affecting forward valuation.
      diligencePath: >-
        Monitor Fintech-IT Group and Gorokhovskyi Telegram channels; check Polish financial
        regulator (KNF) license application registry.
      relatedQuestionRefs:
        - QE020

    - type: private-evidence-only
      severity: material
      topic: acquiring chargeback metrics
      missingEvidence: >-
