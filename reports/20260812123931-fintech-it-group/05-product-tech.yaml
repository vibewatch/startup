  - id: security-privacy-compliance
    title: Security, Privacy, and Compliance Controls
    body: >-
      monobank's public security page lists eight technical controls. PCI-DSS: the system is
      described as PCI-DSS compatible at all stages of card-data passage. Enhanced 3D Secure:
      transaction confirmation is routed through the secured in-app channel rather than SMS,
      eliminating SIM-swap and SMS-interception vectors. Native Mobile Application: the iOS and
      Android builds use native low-level OS security mechanisms rather than cross-platform
      web wrappers. Biometric authentication: Fingerprint, Touch ID, and Face ID are used for
      user data encryption and secure app login. TLS 1.2: all internet-facing communications use
      reinforced TLS 1.2. Qualified Electronic Signature (QES): used for signing additional
      agreements directly from the smartphone. Anti-fraud monitoring: blocks suspicious transactions
      and anomalous account behavior. Anti-hacker monitoring: detects and blocks port-scanning and
      network-attack activity against infrastructure nodes.

      The App Store data-safety disclosure reports that monobank collects data linked to user
      identity—Location, Contact Info, Contacts, and Identifiers—and separately collects Usage
      Data and Diagnostics not linked to identity. The iOS app provider is listed as
      "UNIVERSAL BANK, PRAT," confirming that the banking-regulated entity holds the App Store
      developer account even though Kilobyte1024 holds the copyright.

      JSC Universal Bank holds active NBU banking license No. 92 (issued 20 January 1994). ACDC
      Processing was recognized by the NBU as a significant payment infrastructure operator from
      2021 to 2025. Universal Bank publishes financial statements consistent with regulated-bank
      transparency obligations. No independent QSA report, penetration-test result, or third-party
      certification body listing was found in any public document during this research cycle; PCI-DSS
      compliance is self-asserted on the official security page.
