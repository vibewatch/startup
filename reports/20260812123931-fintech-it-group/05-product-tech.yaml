chapter:
  number: 5
  title: Product & Technology
  summary: >-
    monobank delivers a comprehensive branchless banking ecosystem through native iOS and Android
    apps covering cards, loans, deposits, government bonds, FOP/business accounts, merchant
    acquiring at 1.3%, and the Banka fundraising platform. The open API v250818 exposes personal-
    account and acquiring endpoints for third-party developers. ACDC Processing—a Fintech-IT Group
    subsidiary with Visa, Mastercard, and PCI DSS certifications—routes all payment transactions.
    Security controls include PCI-DSS compatibility, enhanced 3D Secure via in-app notification
    (not SMS), native OS protection mechanisms, biometric authentication, and TLS 1.2; however,
    no independent QSA audit or penetration-test report is publicly available, and the providers
    API was access-blocked during this research.

sections:
  - id: consumer-product-suite
    title: Consumer Product Suite and UX Architecture
    body: >-
      monobank's consumer product suite centers on a mobile-first design that delivers card
      registration in under two minutes. The record stands at 99 seconds via Diia, Ukraine's
      government digital-identity application. Upon download, the user selects among Diia, an ID
      card, a biometric passport, or a foreign passport for KYC verification; a virtual Mastercard
      card is issued immediately, with an optional physical card delivered by Nova Poshta. The app
      carries 910,000 App Store ratings at a 4.9-star average, making it the highest-rated banking
      app in Ukraine by volume; the Google Play listing for package com.ftband.mono also shows a
      live, actively maintained product.

      The app bundles multiple financial instruments: payment cards (including Black, White, and
      Iron variants), currency accounts in USD and EUR, and three consumer credit products—
      "Pokupka Chastynahy" split payments at participating merchants with zero consumer interest
      cost (paid by the merchant), a general global installment plan usable at AliExpress and
      Amazon, and "Do Zavtra" (until tomorrow) micro-loans disbursed in minutes. Government bonds
      (OVDPs) are available in UAH and foreign currencies, tax-exempt for retail investors and
      explicitly marketed as military support. Deposits in UAH and foreign currencies and "Banka"
      savings jars for personal and charitable fundraising complete the savings tier.

      UX differentiators include the monocat personalized cat avatar with a distinctive purr
      notification sound on money receipt. Shake2Pay transfers funds by shaking two nearby phones
      without exchanging card numbers. Group Expenses automates bill-splitting among contacts and
      sends payment reminders. eSIM purchase and management (Kyivstar, Vodafone, lifecell, Airalo)
      operates from within the app. MTPL, Green Card, and auto insurance are purchasable in minutes
      with cashback on car and gas-station purchases. The used-goods marketplace market by mono is
      integrated in the app, broadening the feature surface beyond pure banking.

      App version 8.16, published six days before the research date, removed SWIFT fees for both
      sending and receiving international payments—applicable to both consumer and business users.
      The App Store copyright is held by Kilobyte1024 (ТОВ "Кілобайт1024"), the Fintech-IT Group
      entity responsible for the monobank 2.0 app redesign launched in 2023.
