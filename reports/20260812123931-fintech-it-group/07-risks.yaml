callouts:
  - calloutType: risk
    title: Single-Bank Dependency Is the Principal Structural Risk
    body: >-
      Every regulated banking function at monobank depends entirely on Universal Bank's NBU
      license. No fallback banking partner, own license application, or acquisition path for a
      banking license has been publicly disclosed. This creates a scenario where an NBU action
      against Universal Bank—or a purely commercial decision by Tihipko to exit the
      partnership—could halt monobank's operations with no transition period. Institutional
      investors should require detailed contractual protections, put rights tied to this
      dependency, and a disclosed contingency plan before deploying capital above the seed stage.
    claimRefs:
      - CR032
      - CR033
      - CR034
  - calloutType: risk
    title: PrivatBank Legacy Creates Due-Diligence Liability Without Legal Opinion
    body: >-
      Former Fintech Band shareholders Yatsenko and Shmalchenko divested after receiving criminal
      suspicion notices in the PrivatBank nationalization case. While neither current founder
      (Gorokhovskyi, Rohalskyi) has been publicly implicated, the absence of a published legal
      opinion creates a binary risk: if either founder receives a criminal suspicion notice, the
      investment thesis collapses. Institutional investors should treat an independent legal
      opinion—covering PrivatBank exposure, OFAC screening, and the Cyprus ownership chain—as
      a pre-condition for investment, not a post-closing item.
    claimRefs:
      - CR020
      - CR021
      - CR022
      - CR024

