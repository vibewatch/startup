company:
  name: Fintech-IT Group
chapter:
  number: 7
  title: Risks
  summary: >-
    monobank's risk profile is shaped by four intersecting layers: the ongoing Russian full-scale
    invasion that creates existential geopolitical uncertainty, Universal Bank's bank-level
    exposure to rising NPLs and capital-adequacy demands, legal/reputational tail risk from former
    shareholders' PrivatBank-era criminal suspicion notices, and a single-threaded structural
    dependency where any license revocation or financial distress at Universal Bank immediately
    halts all monobank operations. Cyber and operational risks are partially mitigated by PCI-DSS
    and biometric security claims, but no independent audit or public SLA data have been
    disclosed. The $1 billion valuation achieved in October 2025 compounds investor risk by
    creating an exit-premium requirement in a thin Ukrainian capital market with limited IPO or
    M&A precedent.

sections:
  - id: war-geopolitical-risk
    title: War, Geopolitical, and Macroeconomic Risk
    body: >-
      Ukraine has been under active full-scale Russian military invasion since February 2022,
      and frontline combat continued into June 2026. The World Bank estimates total reconstruction
      needs at approximately $588 billion over the next decade—roughly three times Ukraine's
      estimated nominal GDP for 2025. Despite this destruction, Ukraine's banking sector
      demonstrated remarkable stability: no bank runs occurred, deposits grew in nominal terms
      from February 2023, and the capital adequacy ratio (CAR) recovered to pre-war levels by
      March 2023. The NBU's proactive crisis management—emergency liquidity, rate hikes to 25%
      and subsequent easing to 15%, and gradual capital-control liberalization—prevented a
      systemic collapse.

      For monobank specifically, the war creates four categories of operational risk. First,
      Russian missile and drone strikes on Ukrainian power and communications infrastructure create
      intermittent service disruptions for a branchless, wholly app-dependent product. Second,
      personnel mobilization depletes the engineering workforce; monobank acknowledged the risk of
      talent shortages intensifying in future years. Third, if frontline positions deteriorate and
      Kyiv or Dnipro—where monobank's two offices are located—were threatened, operational
      continuity would face an existential test. Fourth, the currency and capital-control
      environment limits the investment exit window: while controls have been partially liberalized
      since 2023, full convertibility and cross-border capital flows remain restricted.

      The IMF November 2025 Staff-Level Agreement for a new $8.1 billion 48-month Extended Fund
      Facility reduces (but does not eliminate) sovereign financing risk, and the NBU's June 2026
      decision to leave the key policy rate unchanged at 15% signals cautious stability. Ukraine's
      economy is projected at 2% GDP growth for 2025 (down from 2.9% in 2024), reflecting
      prolonged invasion pressure. This macro deceleration directly compresses consumer credit
      demand and increases credit-loss rates, creating second-order risks for monobank's revenue.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
    figureRefs:
      - FR002

  - id: bank-credit-funding-risk
    title: Bank-Level Solvency, Credit Quality, and Funding Risk
    body: >-
      monobank's banking operations are entirely hosted within Universal Bank (JSC), a privately
      owned, systemically important institution regulated by the NBU. As of Q1 2026, Universal
      Bank reported assets of UAH 215.6 billion, liabilities of UAH 187.1 billion, equity of
      UAH 28.4 billion, and profit of UAH 2.59 billion. The bank participates in the Deposit
      Guarantee Fund and is classified as solvent by the NBU. These headline metrics are
      reassuring, but investors must distinguish the bank-level risk from the technology-company
      risk: Universal Bank's loan book quality—including monobank's unsecured consumer credit
      portfolio—is not separately disclosed.

      Ukraine's banking sector NPL ratio has been rising since the start of the full-scale war.
      VoxUkraine analysis (based on NBU data) notes the sector's loan portfolio declined roughly
      30% in real terms versus pre-war levels, with hidden NPL risks uncovered only as the NBU
      resumes comprehensive asset quality reviews (AQRs) and resilience assessments. Further
      profitability expectations are subject to risks from "yet hidden NPLs." For monobank,
      where the product offering includes unsecured installment credit, short-term "until
      tomorrow" micro-loans, and consumer lending, a deteriorating consumer credit environment
      directly translates to higher provision charges, lower margins, and reduced distributable
      profits from Universal Bank to the group.

      The 2024 Fintech Band revenue decline (1.5× fall to UAH 3.71B) and profit decline (2.7×
      fall to UAH 1.15B) are unexplained by any public disclosure and may partly reflect higher
      credit losses, slower loan issuance, or increased provisioning. A further prolonged
      deterioration in Ukraine's macro environment—lower consumer spending, higher unemployment
      in affected regions, currency weakness—would compress Universal Bank's reported profit and
      may trigger NBU-mandated capital increases, diverting resources from product investment.
      Investors cannot independently model this risk without access to Universal Bank's
      detailed loan-quality segmentation or monobank-attributed credit data.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014

  - id: regulatory-licensing-risk
    title: Regulatory and Licensing Risk
    body: >-
      monobank's entire banking activity—including deposit-taking, credit issuance, and card
      operations—depends on NBU license No. 92 held exclusively by Universal Bank since
      January 20, 1994. If this license were revoked or suspended—whether due to capital
      adequacy failure, AML violations, sanctions exposure, or management misconduct—monobank
      would be unable to operate as a bank overnight. This is a hard dependency with no fallback:
      Fintech-IT Group holds no banking license of its own.

      ACDC Processing held NBU recognition as a "significant payment infrastructure operator"
      from 2021 to 2025, enabling Visa/Mastercard and PCI-DSS-certified transaction processing.
      The continuity of this regulatory status after 2025 is not confirmed in publicly available
      sources, creating an unresolved gap in the payment infrastructure risk picture.

      On the regulatory horizon, Ukraine's ongoing EU Association Agreement implementation
      requires progressive alignment of banking regulation with EU directives, including capital
      requirements (CRD/CRR-equivalent), data privacy (GDPR-aligned), AML/CFT standards, and
      consumer protection rules. Each of these dimensions can introduce compliance costs and
      operational restructuring requirements. The NBU Financial Stability Report 2025 highlights
      macroeconomic, credit, and operational risks for Ukrainian banks and notes that "the focus
      on risk control and ensuring continuous operations remains a priority." The NBU's
      supervisory remit also covers consumer-protection enforcement: monobank users can submit
      complaints directly to the NBU's consumer-protection office, creating a regulatory feedback
      channel on service failures.
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
    tableRefs:
      - TR001

  - id: legal-reputational-risk
    title: Legal and Reputational Risk — PrivatBank Ties and Ownership Structure
    body: >-
      The most persistent reputational overhang for monobank is the professional origin of its
      co-founders, Oleg Gorokhovskyi and Mykhailo Rohalskyi, as former senior executives of
      PrivatBank—the institution nationalized by the Ukrainian state in December 2016 after a
      UAH 155 billion+ capital hole was discovered. PrivatBank's nationalization is one of the
      largest bank failures in Eastern European history; the state ultimately recapitalized it
      with UAH 155.8 billion.

      The direct legal risk to Gorokhovskyi and Rohalskyi themselves is limited: neither founder
      has been publicly named as a criminal suspect in any PrivatBank-related proceeding. However,
      three other individuals who were co-owners of Fintech Band received criminal suspicion
      notices in the PrivatBank nationalization case. Former co-founders Volodymyr Yatsenko and
      Liudmyla Shmalchenko divested their Fintech Band stakes around the time they received
      criminal suspicion notices, per Komersant Ukraine and NV reporting. Dmytro Dubilet—another
      early shareholder—exited in 2019 for government service. These events mean that monobank
      was directly co-owned by individuals under active criminal investigation in Ukraine's
      largest bank fraud case.

      The post-April 2025 ownership restructuring—where Crestline Limited (Cyprus, 63.98%) and
      Nisets Limited (Cyprus, 14%) hold the majority of Fintech Band LLC—adds governance
      opacity. Gorokhovskyi confirmed Crestline and Nisets are Ukrainian tax residents paying
      taxes in Ukraine, but the Cyprus incorporation creates a two-step beneficial ownership
      layer that complicates investor due diligence. The AMCU approved the Crestline acquisition
      in April 2025, but no independent legal opinion on the Cyprus structure's implications
      under Ukrainian law has been published.

      From a diligence perspective, any institutional investor must obtain (a) a legal opinion
      confirming that Gorokhovskyi and Rohalskyi face no active criminal exposure in PrivatBank
      proceedings; (b) clear documentation of the Cyprus beneficial ownership chain; and (c)
      confirmation that the UMAEF investment was subject to OFAC and Ukrainian sanctions
      screening. None of these documents are publicly available.
    claimRefs:
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR046
    tableRefs:
      - TR004

  - id: cyber-operational-security-risk
    title: Cyber, App Security, and Operational Continuity Risk
    body: >-
      monobank operates entirely through mobile and web applications with no branch safety
      net. Its security architecture, as published on the monobank.ua/security page, includes
      PCI-DSS compliance, enhanced 3D Secure authentication (via the app rather than SMS),
      native mobile OS security mechanisms (iOS and Android low-level), biometric authentication
      (Fingerprint, Touch ID, Face ID), TLS 1.2 encryption, electronic digital signature for
      in-app agreements, anti-fraud monitoring, and anti-hacker anomaly detection. ACDC Processing
      additionally holds Visa and Mastercard certifications and PCI-DSS certification for
      payment processing infrastructure.

      However, no independent third-party security audit, penetration testing disclosure, bug
      bounty program record, or SOC 2 equivalent report has been published. The absence of
      external audit transparency is a material gap for a bank holding over 10 million customer
      accounts and processing the majority of Ukraine's non-cash payment transactions through
      its acquiring network.

      Customer app-store reviews reveal one persistent security complaint: the absence of a
      Time-based One-Time Password (TOTP) / authenticator app 2FA option. Users noted that
      security-conscious customers—especially those with significant balances or business
      accounts—feel exposed without a hardware-agnostic second factor. This design choice,
      confirmed in both App Store and Google Play review data, creates residual phishing/SIM-swap
      risk. monobank's reliance on in-app push confirmations is more secure than SMS 2FA but
      is not equivalent to TOTP for high-value accounts.

      No major publicly disclosed data breach or systemic outage has been recorded at monobank
      as of June 2026. Downdetector.com returned a 404 status when accessed for monobank-
      specific outage history, meaning no structured historical outage data is publicly
      available to investors. Wartime operational risk from energy infrastructure attacks
      (electricity blackouts) was documented in Ukraine during winter 2022-2023; the sector
      maintained access to cash through crisis management, but digital-only banks face a
      unique continuity challenge when internet and mobile network infrastructure is disrupted.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
    tableRefs:
      - TR002

  - id: concentration-dependency-valuation-risk
    title: Concentration, Partner Dependency, and Valuation Risk
    body: >-
      monobank's most structurally distinctive risk is its single-threaded dependency on
      Universal Bank. Every regulated banking activity—holding deposits, issuing credit,
      operating payment cards, and conducting KYC—requires the NBU banking license held by
      Universal Bank. Universal Bank is owned by Serhiy Tihipko, a separate party with no
      disclosed long-term contractual commitment to maintain the partnership. The terms of
      the Fintech-IT Group / Universal Bank technology and services agreement—including
      duration, exclusivity, revenue share arrangements, and termination rights—are not
      publicly disclosed. If Universal Bank were to withdraw from or limit the partnership,
      or if Tihipko sought to monetize Universal Bank through a sale to a party hostile to
      the arrangement, Fintech-IT Group would have no immediate fallback banking infrastructure.

      Geographic and infrastructure concentration compounds this risk. Fintech-IT Group's
      two offices are in Kyiv and Dnipro—cities that have faced Russian missile strikes. While
      the tech team also works remotely across Ukraine, concentration in these two cities
      creates single-point vulnerabilities for senior leadership continuity.

      International expansion has been paused. The Stereo by mono (Poland) and Koto (UK)
      projects are explicitly "on hold," and monobank holds no EU or UK banking license. This
      means the entire valuation is anchored to a single-country market facing wartime headwinds,
      with no near-term international diversification path.

      Valuation risk is directly tied to exit feasibility. The UMAEF-led $1 billion+ valuation
      established in October 2025 creates a step-up that requires a strategic sale, secondary
      transaction, or eventual IPO at multiples above typical Ukrainian private equity norms. No
      Ukrainian fintech has previously achieved an IPO on a major exchange. UMAEF and the private
      investors' put/call rights and liquidity timeline are not disclosed. Fintech Band's 2024
      revenue and profit declines further raise the question of whether the $1 billion valuation
      can be sustained through a due-diligence process by an arms-length strategic buyer.
    claimRefs:
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
