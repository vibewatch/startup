        - License revocation or supervisory restrictions would immediately halt monobank operations
        - Request Universal Bank's latest NBU capital adequacy certificate and supervisory correspondence
      - - PrivatBank nationalization criminal cases — former Fintech Band shareholders (Yatsenko, Shmalchenko)
