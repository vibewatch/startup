  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: regulatory-licensing-risk
      missingEvidence: >-
        Confidential NBU supervisory correspondence, capital adequacy certificates, AML examination
        reports, and any enforcement conditions imposed on Universal Bank related to monobank
        operations.
      whyItMatters: >-
        Without sight of these documents, investors cannot independently confirm that Universal
        Bank is in full supervisory good standing and free of undisclosed license conditions.
      diligencePath: >-
        Request via bilateral due diligence: Universal Bank's NBU supervisory standing letter
        (current within 30 days), latest AML exam report, and any open enforcement conditions.
      relatedQuestionRefs:
        - QR015
        - QR002
      relatedTableRefs:
        - TR001

    - type: private-evidence-only
      severity: blocking
      topic: concentration-dependency-risk
      missingEvidence: >-
        The full text of the technology services and banking cooperation agreement between
        Fintech-IT Group and Universal Bank, including duration, exclusivity, revenue share,
        termination rights, and change-of-control provisions.
      whyItMatters: >-
        Without this agreement, investors cannot assess the structural permanence of the
        monobank business model or the risk of Universal Bank unilaterally terminating or
        renegotiating the partnership.
      diligencePath: >-
        Require full document disclosure as a condition of any investment or secondary
        transaction; engage Ukrainian legal counsel to assess enforceability and
        change-of-control triggers.
      relatedQuestionRefs:
        - QR019
        - QR032

    - type: private-evidence-only
      severity: material
      topic: bank-credit-funding-risk
      missingEvidence: >-
        Universal Bank's monobank-attributed loan-book segmentation: NPL rate, vintage analysis,
        provision coverage, and write-off history by product type (installment, micro-loan,
        revolving credit).
      whyItMatters: >-
        Prevents independent assessment of credit-quality risk in the most revenue-critical
        product line; the 2024 profit decline cannot be fully explained without this data.
      diligencePath: >-
        Request from Universal Bank via bilateral due diligence; cross-check against NBU
        sector-financial statistics for consumer-credit NPL benchmarks.
      relatedQuestionRefs:
        - QR009
        - QR011

    - type: private-evidence-only
      severity: material
      topic: legal-reputational-risk
      missingEvidence: >-
        An independent legal opinion confirming that neither Gorokhovskyi nor Rohalskyi faces
        active criminal exposure in any PrivatBank-related or other Ukrainian law enforcement
        proceedings, and confirming the legal integrity of the Cyprus beneficial ownership chain.
      whyItMatters: >-
        Criminal proceedings against either founder would constitute an immediate thesis-break
        event. Without a legal opinion, investors are exposed to binary tail risk that cannot
        be priced from public sources alone.
      diligencePath: >-
        Commission a Ukrainian-qualified law firm to review all PrivatBank-era case files
        naming Fintech Band shareholders; obtain a clean bill of health or disclose findings.
      relatedQuestionRefs:
        - QR022
        - QR024

    - type: missing-source
      severity: material
      topic: cyber-operational-security-risk
      missingEvidence: >-
        An independent third-party security audit (SOC 2 Type II, ISO 27001 certification, or
        equivalent) and public vulnerability disclosure / bug-bounty program records for monobank
        and ACDC Processing.
      whyItMatters: >-
        monobank's security claims are entirely self-reported; for a bank with 10M+ accounts and
        a dominant payment-processing footprint, the absence of external audit transparency is a
        material risk for institutional investors and regulators.
      diligencePath: >-
        Request latest penetration test reports, SOC 2 or ISO 27001 certificates, and incident
        response documentation as part of investment due diligence.
      relatedQuestionRefs:
        - QR018
        - QR005

    - type: private-evidence-only
      severity: material
      topic: valuation-exit-risk
      missingEvidence: >-
        UMAEF and private investors' subscription agreement terms: liquidation preference, anti-
        dilution, put/call rights, lock-up period, and board representation rights that govern
        exit economics.
      whyItMatters: >-
        Secondary buyers cannot accurately price their return profile without understanding the
        waterfall structure and potential preference overhang from institutional investors.
      diligencePath: >-
        Require disclosure of full investor rights documentation as a condition of any secondary
        or follow-on transaction.
      relatedQuestionRefs:
        - QR019
        - QR001

    - type: missing-source
      severity: material
      topic: payment-infrastructure-regulatory-status
      missingEvidence: >-
        Current-status confirmation of ACDC Processing's NBU designation as a significant payment
        infrastructure operator (SPIO), and any subsequent supervisory reviews, conditions, or
        changes to that designation since 2023.
      whyItMatters: >-
        ACDC processes all monobank card transactions; a lapse or modification of its SPIO status
        could require operational restructuring, increase compliance costs, or disrupt payment flows
        for monobank's 10M+ customers.
      diligencePath: >-
        Obtain current NBU SPIO register confirmation; request ACDC's latest regulatory correspondence
        and internal compliance status letter from Fintech-IT Group management.
      relatedQuestionRefs:
        - QR016

    - type: missing-source
      severity: informational
      topic: comparative-risk-benchmarking
      missingEvidence: >-
        Comparative risk analysis of monobank versus other Ukrainian digital-first banks (e.g., Sportbank,
        izibank by Kredobank, Sense Bank) on NPL ratios, capital adequacy, and operational continuity
        during the war period; and cross-country comparison of war-period banking stability in Ukraine
        versus other active-conflict-zone banking systems.
      whyItMatters: >-
        Without a peer benchmark, investors cannot independently assess whether monobank's risk profile
        is materially better or worse than comparable Ukrainian digital banks, nor whether Ukraine's
        banking resilience is exceptional or typical for a conflict-zone economy.
      diligencePath: >-
        Commission independent banking sector analysis covering Ukrainian digital-bank peers; review IMF
        and World Bank conflict-economy banking studies for comparative data.
      relatedQuestionRefs:
        - QR030
        - QR031

