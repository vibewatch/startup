              乌克兰银行贷款组合实际规模较战前下降约 30%。行业流动性覆盖率超出监管要求 330%——这一高流动性、低放贷悖论反映 NPL 不确定性和高政策利率（截至 2026 年 6 月为
              15%）。在放贷恢复前，monobank 的收入模式会过度依赖交换费和手续费收入，而不是成熟消费信贷银行的 NII 驱动模式。
