  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和定义
        blocks:
          - type: paragraph
            body: >-
              monobank 的相关市场是乌克兰零售数字银行——具体指通过移动优先应用，向乌克兰居民和海外侨民交付消费者支付账户、个人信贷、存款、点对点转账以及相邻数字金融服务。该市场明确排除传统网点银行（monobank
              在设计原则上替代了它）、企业机构贷款以及跨境 neobanking（Revolut、Wise），因为 NBU 牌照要求和 UAH 转账限制，使国际 neobank 难以为乌克兰居民复制 monobank
              的完整产品组合。

              进入相关时期时，乌克兰银行业结构稳健，但信贷受压。2022 年资产 / GDP 比约为 40%——与 Romania 相当，但远低于 Poland 或 Hungary——反映历史发展不足以及 2014
              年后的行业整合。2015 至 2022 年，NBU 通过资本充足率执法把运营银行数量大约砍半，将系统 CAR 从 2015 年底的 12.3% 提高到 2021 年 11 月的 21%。以 PrivatBank
              和 Oschadbank 为首的国有银行约占行业净资产 50%；这一份额自 2017 年以来保持稳定，也是商业 neobank 在机构和薪资银行业务上最大的竞争约束。

              相邻市场包括：SME 数字银行（FOP 账户和 ACDC 收单）、通过 Banka 平台进行慈善募款、汇款和跨境支付通道（截至 2026 年 6 月已提供免费
              SWIFT），以及车险、eSIM、政府债券等嵌入式金融科技产品。这些相邻业务被纳入 monobank 的相关市场，因为它们都在同一应用内提供，并贡献收入多元化和用户黏性。
            claimRefs:
