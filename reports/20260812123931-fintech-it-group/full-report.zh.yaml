companyProfile:
  summary: >-
    Fintech-IT Group（原 Fintech Band）是乌克兰金融科技控股公司，也是 monobank 背后的技术开发方；monobank 是该国最大的移动优先型 neobank。消费银行产品在 JSC Universal
    Bank 牌照下运营，软件、产品设计、处理系统和相邻金融科技服务则由 Fintech-IT Group 搭建。截至 2026 年 6 月，monobank 生态服务超过 10.3 million 注册客户。2025 年 10
    月，UMAEF（Ukraine-Moldova American Enterprise Fund）成为 Fintech-IT Group 的首个外部机构投资者，把这家技术实体推到 $1B 以上估值。Universal Bank
    在最新 NBU 监管档案中披露资产 UAH 215.6B、利润 UAH 2.59B；Fintech Band 披露 2024 财年收入 UAH 3.71B、净利率 31%。两组数据都受战争经营环境影响。
