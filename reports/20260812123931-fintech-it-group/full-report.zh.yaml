              本章所有 TAM/SAM/SOM 数字都是推导估计，不是已发布的分析师报告。战争持续期间，乌克兰人口、GDP 和银行业指标都可能修订。投资者应把 22–28M TAM 和 13–18M SAM
              视为说明性边界，而不是投资级预测。唯一硬锚点是 monobank 截至 2026 年 6 月的 10.3 million 注册客户。
