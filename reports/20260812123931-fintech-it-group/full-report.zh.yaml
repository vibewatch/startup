      - number: '5.4'
        title: 安全、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              monobank 公开安全页列出八项技术控制。PCI-DSS：系统被描述为在卡数据流转各阶段均兼容 PCI-DSS。增强 3D Secure：交易确认走安全的 app 内通道而非 SMS，消除 SIM-swap
              和 SMS 拦截向量。原生移动应用：iOS 和 Android 版本使用原生底层 OS 安全机制，而非跨平台 web wrapper。生物识别认证：Fingerprint、Touch ID 和 Face ID
              用于用户数据加密和安全 app 登录。TLS 1.2：所有面向互联网的通信使用强化 TLS
              1.2。合格电子签名（QES）：用于直接从智能手机签署补充协议。反欺诈监控：阻止可疑交易和异常账户行为。防黑客监控：检测并阻止针对基础设施节点的端口扫描和网络攻击活动。

              App Store 数据安全披露显示，monobank 收集与用户身份关联的数据——Location、Contact Info、Contacts 和 Identifiers；另行收集不与身份关联的 Usage
              Data 和 Diagnostics。iOS app provider 列为 “UNIVERSAL BANK, PRAT”，确认由受银行监管实体持有 App Store 开发者账号，尽管 Kilobyte1024
              持有版权。

              JSC Universal Bank 持有有效 NBU 银行牌照 No. 92（1994 年 1 月 20 日签发）。ACDC Processing 在 2021 至 2025 年被 NBU
              认定为重要支付基础设施运营商。Universal Bank 发布的财务报表符合受监管银行透明度义务。本研究周期内，公开文件中没有发现独立 QSA 报告、渗透测试结果或第三方认证机构列表；PCI-DSS
              合规是官方安全页的自我声明。
