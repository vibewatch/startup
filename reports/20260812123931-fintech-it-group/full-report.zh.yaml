      - number: '7.5'
        title: 网络、App 安全与运营连续性风险
        blocks:
          - type: paragraph
            body: >-
              monobank 完全靠移动和 Web 应用运营，没有网点兜底。monobank.ua/security 页面披露的安全架构包括 PCI-DSS 合规、增强型 3D Secure 认证（通过 App 而非
              SMS）、原生移动 OS 安全机制（iOS 与 Android 底层）、生物识别认证（Fingerprint、Touch ID、Face ID）、TLS 1.2 加密、App
              内协议电子数字签名、反欺诈监控和反黑客异常检测。ACDC Processing 还持有 Visa、Mastercard 认证，以及支付处理基础设施的 PCI-DSS 认证。

              但公司没有发布独立第三方安全审计、渗透测试披露、漏洞赏金计划记录或 SOC 2 等同报告。对于一家持有 1000 万以上客户账户、并通过收单网络处理乌克兰多数非现金支付交易的银行，外部审计透明度缺失是重大缺口。

              应用商店用户评论暴露出一个持续安全抱怨：缺少基于时间的一次性密码（TOTP）/ 认证器 App 的 2FA
              选项。用户指出，安全意识强的客户，尤其是持有大额余额或企业账户的客户，在没有不依赖特定硬件的第二因素时会觉得暴露。App Store 和 Google Play 评论数据都确认了这一设计选择，它留下了钓鱼 /
              SIM 换卡的残余风险。monobank 依赖 App 内推送确认，比 SMS 2FA 更安全，但对高价值账户来说并不等同于 TOTP。

              截至 2026 年 6 月，monobank 没有公开披露过重大数据泄露或系统性宕机。访问 Downdetector.com 查询 monobank 特定宕机历史时返回
              404，意味着投资者拿不到结构化历史宕机数据。2022–2023
              年冬季，乌克兰已记录能源基础设施遇袭带来的战时运营风险（停电）；银行业靠危机管理维持了现金可得性，但当互联网和移动网络基础设施中断时，纯数字银行会面临独特的连续性挑战。
