chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、法律结构和运营模式
        blocks:
          - type: paragraph
            body: >-
              monobank 自称是乌克兰第一家无网点银行——一个面向移动优先客户的零售银行产品，让他们不必依赖实体网点也能获得金融服务。它于 2017
              年上线，并刻意采用双实体结构运营：所有银行活动（存款、贷款、银行卡、合规）由持有 NBU 牌照 No. 92（1994 年 1 月 20 日签发）的持牌商业银行 JSC Universal Bank
              承担。技术侧——应用、后端、支付处理和相邻金融科技产品——由 Oleg Gorokhovskyi 和 Mykhailo Rohalskyi 共同创立的 IT 控股公司 Fintech-IT Group（此前名为
              Fintech Band LLC）开发。

              这套结构是尽调重点，因为两个实体的所有权、董事会和风险画像彼此分离。Universal Bank 由 Serhiy Tihipko 通过 TAC Group 持有，并被 NBU
              认定为偿付能力充足且具系统重要性。Fintech-IT Group 的最终受益人是 Gorokhovskyi 和 Rohalskyi，持股路径经过塞浦路斯控股载体。monobank 商标由 Universal
              Bank 与 Kilobyte1024（Gorokhovskyi/Rohalskyi 实体）共同持有，更广义的 mono 品牌则通过塞浦路斯注册的 Hallstatt 持有。后续章节只要引用 monobank
              的财务、治理或客户指标，都必须区分银行实体（Universal Bank）和技术开发方（Fintech-IT Group）。

              截至 2026 年，monobank 的产品组合包括支付卡、消费信贷（分期计划、“到明天”小额贷款）、货币账户、政府债券、存款、点对点转账、eSIM、群组费用分摊，以及 Banka 募款平台；Banka
              已连接超过 1,300 家慈善基金会，累计处理捐款超过 UAH 100 billion。开放 API（version 250818）允许第三方开发者访问账户流水和汇率数据，体现出相当程度的技术开放性。
