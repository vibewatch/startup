      - number: '3.3'
        title: 移动 UX 和产品能力对比
        blocks:
          - type: paragraph
            body: >-
              移动用户体验是 monobank 领先最清晰的轴线。截至 2026 年 6 月，它在 Apple App Store（910,000+ 个评分）和 Google Play（1.13 million 条评价）均为
              4.9 星，高于 Privat24 在 Google Play 的 4.8 星；这反映出一个更小、但更集中于数字优先乌克兰人的客户群拥有更强的单用户参与度。Privat24 应用服务更大人群（19+
              million 客户），评分略低，说明 PrivatBank 的绝对规模和产品复杂度稀释了单用户 UX 一致性。

              产品广度是 PrivatBank 和 Oschadbank 发挥结构优势的地方。PrivatBank 提供 LiqPay、PrivatMoney 本土和国际转账、“Envelopes”目标储蓄（年化
              5%）、消费和按揭贷款、青少年账户（6 岁起）以及 SWIFT。Oschadbank 在实体现金获取、受储蓄保护的存款和政府支持按揭（eOselia 项目份额 40%）上更强。monobank 用 UX
              细节差异化：一键 FOP 注册、Shake2Pay、10 秒取消付款、Banka 募款平台（处理 UAH 100 billion）、群组费用分摊、eSIM，以及通过 Diia 的 QES
              数字签名。这些功能加快开户速度（最快 99 秒开卡），并在无需网点的情况下培养忠诚度。

              信贷方面，monobank 的分期市场（与 KTC、Citrus、MOYO、Foxtrot 合作的先买后付）、“Until Tomorrow”小额贷款和最高 UAH 200,000 的信用额度，直接对标
              PrivatBank 的 “Payment by Parts” 和最高 UAH 500,000 的现金贷款。PrivatBank 更高的信贷上限（UAH 500k 对比 monobank 的 UAH
              200k）在更大额个人信贷需求上占优。

              2026 年 6 月，monobank 取消了 SWIFT 收款和付款全部手续费——这是一个直接削弱 PrivatBank 跨境服务优势的产品追平动作。Apple App Store
              版本说明明确把“ПРИБРАЛИ SWIFT-КОМІСІЇ”（已移除 SWIFT 手续费）列为近期更新。2026 年 6 月，从乌克兰 App Store URL 访问 Raiffeisen 和 OTP
              应用数据失败（HTTP 404），限制了直接评分对比；NBU 档案确认两者仍具偿付能力和系统重要性，但不提供 UX 指标。
