      - number: '4.7'
        title: 展项
        blocks:
          - type: callout
            title: FY2024 收入和利润下滑是最重大的单一反向财务信号
            body: >-
              Fintech Band FY2024 法定报表显示，收入较 FY2023 下滑 33%，净利润下滑 63%。UMAEF 2025 年 10
              月投资新闻稿称该集团“基本面扎实且成长性高”，但没有回应这些同比下滑。可能原因——关联方合同重组、战时需求走弱、MOSST 收购成本或收入重分类——公开资料均未解释。在对 Fintech-IT Group 或
              Universal Bank 作出任何资本配置决定前，这是最需要厘清的重大反向财务信号。
            calloutType: risk
