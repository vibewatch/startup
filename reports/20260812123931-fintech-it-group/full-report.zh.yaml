      - number: '1.3'
        title: 客户规模、融资历史和关键里程碑
        blocks:
          - type: paragraph
            body: >-
              在战争背景下，monobank 的增长轨迹格外突出。截至 2026 年 6 月，Google Play 和 Apple App Store 页面均显示注册客户超过 10.3 million，使 monobank
              成为乌克兰最大的商业数字银行，也是按支付卡数量计算的全国第二大零售银行。UMAEF 2025 年 10 月新闻稿确认，截至 2025 年 9 月客户数为 9.9 million。2025 年前九个月处理交易
              UAH 8.5 trillion，说明强的不只是注册规模，还有交易强度。monobank 已连续两年（2024 和 2025）被 CNBC 列入全球前 35 家 neobank 和前 250
              家金融科技公司，并持续保持乌克兰银行业最高的净推荐值。

              2025 年 10 月 6 日 UMAEF 投资是关键公司事件：UMAEF——由美国国会于 1994 年设立、初始联邦资金 $150 million 的美国政府授权基金——成为 Fintech-IT Group
              首个外部机构投资者，并牵头一个未披露美国私人投资者财团。这笔投资把 Fintech-IT Group 推过 $1 billion 估值门槛，使其成为乌克兰第一家金融科技独角兽。UMAEF 通过
              Hallstatt（塞浦路斯）取得的持股估计约为 Fintech Band 的 1.9%，对应约 $18.5 million——资本注入规模不大，但战略和声誉信号远超资金本身。

              Fintech Band 2024 年财务数据显示，收入 UAH 3.71 billion（约 $92.4 million），同比下降 1.5×；净利润 UAH 1.15 billion（约 $28.6
              million），同比下降 2.7×。超过 90% 的收入来自为 Universal Bank 提供的软件服务。Fintech-IT Group 约有 630 名员工，其中约 400 人为 IT 专业人员，在
              Kyiv 和 Dnipro 设有办公室，并在乌克兰各地配置远程员工。
