      - number: '6.4'
        title: Banka 筹款平台与捐赠社区
        blocks:
          - type: paragraph
            body: >-
              Banka（字面意思为“罐”）功能是 monobank 产品组合中最有辨识度的客户分层之一，也是公开沟通中最常被引用的数据点之一：超过 1,300 家慈善基金会接入 Banka 平台；超过 1.6 million
              人每月通过 Banka 捐款；截至 2026 年，通过 Banka 的累计捐款总额已达 UAH 100 billion。这三项指标在 monobank 乌克兰语和英语主页上逐字一致，使它们成为 monobank
              唯一按子分层粒度发布的量化用户参与数据。

              Banka 在 monobank app 内作为储蓄和筹款“罐”运作。个人用户可以为个人储蓄目标创建罐，也可以公开分享罐链接用于慈善活动。基金会作为已验证收款方接入平台，让现有 monobank
              用户一键设定每月定期捐赠。慈善基金会连接能力（1,300+ 家基金会，包括军事、人道主义和公民组织）与月度捐赠量（1.6 million 月活捐赠者）共同形成公民社会参与回路，显著抬高深度捐赠者离开
              monobank 的切换成本。公开数据中，这可能是最强的留存信号——因为已设置对某基金会定期捐赠的 Banka 捐赠者，在离开前必须主动取消这些捐赠。

              UAH 100 billion 的总捐赠额为平台交易强度提供了锚点。按 1.6 million 月度捐赠者和历史汇率计算，单个捐赠者平均累计捐赠额已进入五位数格里夫纳区间，远高于偶发使用模式。Banka
              平台也直接承载战时社区信号：军事筹款罐被明确营销，app 官方 App Store 页面出现“为乌克兰武装部队筹款”文案。本研究没有发现针对基金会层面拨款或捐赠者对基金使用满意度的独立审计。
