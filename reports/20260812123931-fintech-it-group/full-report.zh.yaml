        - id: market-position
          label: '市场地位：乌克兰 #1 新银行，9.9M–10.3M 客户，全球前 35'
          detail: UMAEF 新闻稿、应用商店数据和 NBU 监管资料均可确认；NPS 领先
          tone: positive
        - id: product-proof
          label: 产品验证：高 NPS，2025 年前 9 个月交易额 UAH 8.5T，CNBC 前 35 新银行
          detail: 参与度和留存信号强；未披露流失或 CAC 数据
          tone: positive
        - id: financials
          label: 财务：收入同比 −33%；利润同比 −63%（FY2024）；没有经审计合并报表
          detail: Fintech Band 披露了 FY2024；收入下滑原因未解释；Universal Bank 盈利
          tone: warning
        - id: valuation-anchor
          label: 估值锚点：$1B UMAEF 轮（2025 年 10 月）；~11× EV/Revenue；~$101/客户
          detail: 单笔小股权交易；估计投资额 ~$18.5M；没有独立确认
          tone: warning
        - id: war-risk
          label: 战争风险：冲突仍在持续，地缘政治不确定性关乎生存，单一市场
          detail: 乌克兰自 2022 年 2 月起遭受全面入侵；截至 2026 年 6 月，前线仍在交战
          tone: negative
        - id: opacity
          label: 不透明：没有 IFRS 合并报表；集团内费用未披露；股权结构表未公开
          detail: 尽调缺口阻塞交易；无法做财务测算；IPO 时间线不清
          tone: negative
        - id: recommendation
          label: 建议：TRACK——观察，不投入资本
          detail: 重新上调至买入需满足：经审计的 FY2025 修复 + IPO 文件提交 + PrivatBank 法律问题解决
          tone: neutral
      edges:
        - from: market-position
          to: recommendation
          label: 支撑
        - from: product-proof
          to: recommendation
          label: 支撑
        - from: financials
          to: recommendation
          label: 约束
        - from: valuation-anchor
          to: recommendation
          label: 约束
        - from: war-risk
          to: recommendation
          label: 约束
        - from: opacity
          to: recommendation
          label: 阻塞尽调
    claimRefs:
      - CV001
      - CV010
      - CV012
      - CV028
      - CV036
  - id: FV002
    title: 估值敏感性——不同收入情景下的 EV/Revenue
    type: bar
    layout: standard
    summary: 展示 Fintech-IT Group 的隐含 EV/Revenue 倍数如何随收入情景变化；$1B 锚点在 FY2024 水平对应 11×，收入修复时压缩到 6.7×，若收入继续下滑则扩张到 16.7×。
    data:
      items:
        - label: FY2023 隐含值（估计收入 ~$135M）
          value: 7.4
          unit: × EV/Rev (estimated)
        - label: FY2024 实际值（收入 ~$90M）
          value: 11.1
          unit: × EV/Rev
        - label: 修复情景（$110M）
          value: 9.1
          unit: × EV/Rev (estimated)
        - label: 乐观情景（$150M）
          value: 6.7
          unit: × EV/Rev (estimated)
        - label: 悲观延续（$60M）
          value: 16.7
          unit: × EV/Rev (estimated)
        - label: Nu Holdings（上市可比公司）
          value: 5.4
          unit: × EV/Rev (FY2024 revenue)
        - label: Monzo（私营，估计）
          value: 6
          unit: × EV/Rev (midpoint est.)
    approximationNotes: >-
      FY2023 Fintech Band 收入估计约为 $135M，依据是 FY2024（$90M）较 FY2023 下降 ~33%。收入情景为作者估计，仅作示意。Nu Holdings 倍数根据 Yahoo Finance
      市值和 Macrotrends 收入数据计算。Monzo 倍数根据二级市场估值报道和 CH 文件线索估计；未确认。
    claimRefs:
      - CV010
      - CV011
      - CV017
      - CV018
      - CV021
  - id: FV003
    title: 估值与回报区间——$1B 进入估值下的乐观 / 基准 / 悲观
    type: range
    layout: standard
    summary: 相对于 $1B UMAEF 轮进入估值，列示 Fintech-IT Group 的低、基准和高隐含退出估值，单位为十亿美元。
    data:
      items:
        - label: 悲观情景退出（困境 / IPO 延后）
          low: 0.4
          value: 0.5
          high: 0.6
        - label: 基准情景退出（按修复后收入 10–12× IPO）
          low: 0.9
          value: 1.1
          high: 1.4
        - label: 乐观情景退出（战争结束，美国 IPO 按收入 15×）
          low: 1.5
          value: 2
          high: 2.5
        - label: UMAEF 进入估值（2025 年 10 月）
          low: 1
          value: 1
          high: 1
    approximationNotes: >-
      所有数值单位均为十亿美元。估值估计基于情景，把 EV/Revenue 倍数套用到预测的 Fintech Band 收入；并非基于 DCF 或官方财务模型。悲观区间反映在 $60–90M 收入上按 5–7×
      做困境退出。基准区间反映在 $90–120M 上按 10–12×。乐观区间反映战后 $100–165M 收入按 15×。进入前估值假设以 $1.0B 作为 UMAEF 轮锚点；实际投后估值未确认（股权比例和总融资额未披露）。
    claimRefs:
      - CV001
      - CV010
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI——面向 IC 的 Fintech-IT Group 估值评分
    type: kpi
    layout: standard
    summary: 截至 2026 年 6 月，对 Fintech-IT Group / monobank 在市场、验证、护城河、经济性、风险、估值和证据质量上的投委会评分。
    data:
      items:
        - label: 市场机会
          value: 6
          unit: /10
          detail: 乌克兰移动银行占主导，但仍是受战争影响的单一国家市场；TAM ~22–28M 成年人
          tone: neutral
        - label: 产品验证
          value: 8
          unit: /10
          detail: '#1 NPS（乌克兰银行业），全球前 35 新银行，10.3M 客户，交易额 UAH 8.5T'
          tone: positive
        - label: 竞争护城河
          value: 7
          unit: /10
          detail: 网络效应、最高应用评分，
          tone: positive
        - label: 经济性 / 盈利能力
          value: 4
          unit: /10
          detail: 单看 FY2024 净利率 31% 尚可，但收入同比 −33%、利润同比 −63%；未经审计
          tone: warning
        - label: 风险画像
          value: 3
          unit: /10
          detail: 战争持续、单一客户集中、PrivatBank 诉讼、不透明、退出流动性不足
          tone: negative
        - label: 估值与证据
          value: 4
          unit: /10
          detail: 收入下滑下 EV/Revenue 仍为 11×；~$101/客户，对比同业 $556–$1,000；单笔小股权锚点
          tone: warning
        - label: 证据质量
          value: 3
          unit: /10
          detail: 没有经审计 IFRS 合并报表；没有股权结构表；没有集团内费用披露；没有锁定条款
          tone: negative
        - label: 退出清晰度
          value: 4
          unit: /10
          detail: UMAEF 释放美国 IPO 信号；Universal Bank 释放 2026 年上市信号；尚未提交 S-1；时间线仍属推测
          tone: warning
