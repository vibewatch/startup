      - number: '4.6'
        title: 财务披露缺口与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              monobank 的双实体结构，加上两个实体既不是上市公司，也不是受 EU 监管、需用英文发布完整 IFRS 报表的机构，造成全面的信息不对称，限制投资者基于公开来源完成承销判断。

              第一，公开资料中没有合并口径的 monobank 或 Fintech-IT Group 损益表。Universal Bank 向 NBU 披露的财务覆盖整个银行实体，而不是 monobank
              产品线。Fintech Band 的法定报表可在乌克兰商业登记库（YouControl、OpenDataUA）中以原始乌克兰语文件取得，但没有经过英文 IFRS 格式审计。本章引用的 FY2024
              收入和利润数据来自乌克兰媒体对登记数据的报道，而非管理层确认的经审计报表。

              第二，英文监管档案完全缺失关键银行层单位经济指标：净息差、贷存比、Universal Bank 特定不良贷款率、成本收入比和拨备覆盖率。NBU 监管档案的英文页面只发布资产、负债、权益和利润 /
              亏损。所有详细拆分页面只有乌克兰语。

              第三，Fintech Band FY2024 收入和利润下滑（收入 –33%、净利润 –63%）是显著反向信号，但管理层没有公开解释。UMAEF 的投资者沟通提到“基本面扎实且成长性高”，却没有回应同比下滑。

              第四，截至 2026 年 6 月研究日期，Universal Bank 和 Fintech Band 都没有公开发布 FY2025 全年业绩，最近的公开财务数据仍停留在 FY2024。2025 年 10 月
              UMAEF 投资逻辑与公开财务记录之间的断层，带来一个风险：管理层的增长叙事可能依赖外部投资者无法取得的未公开 FY2025 数据。
