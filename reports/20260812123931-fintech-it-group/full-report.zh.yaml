      - number: '6.5'
        title: App Store 评分、UX 评论与服务体验
        blocks:
          - type: paragraph
            body: >-
              monobank 在 App Store 拥有 910,000 条评分、平均 4.9 星，按评论量是乌克兰评分最高的银行应用。Google Play 页面截至 2026 年 6 月也显示 1.13 million
              条评论、4.9 星，说明跨平台口碑一致，且用户群会主动参与评分机制。2026 年 6 月 15 日（研究日期前六天）发布的版本 8.16，取消所有用户类型收发国际付款的 SWIFT
              费用，体现产品仍在活跃迭代。开发者（Universal Bank | Monobank）在 Google Play 主动回复用户评论，这是可见的社区互动信号。

              头部评论中的负面客户信号具体且对尽调有意义。评论者 John Smith（Google Play，2026 年 6 月 5 日）明确把 monobank 从 5 星降到 3 星，原因是：(1) 缺少使用身份验证器
              app 的真正双因素认证（只有 SMS / app 内 2FA），以及 (2) 缺少显示近期登录的会话可见性功能。其他用户标记该评论有帮助；它反映出一个安全 UX 缺口，安全意识较强的用户——尤其是处理商业交易的
              IT 专业人员和 FOP 用户——会将其视为有意义的不足。评论者 Sergey Surazhskyi（2026 年 1 月）也给出 3 星，批评 monobank 强制迁移到 monobank 2.0 UI
              设计且无法保留旧界面，同时指出 monobank 的转账限额和费用相较竞争对手仍“可接受”，并特别提到 CEO Gorokhovskyi 公开反对 Revolut 的立场。

              客户支持 24/7 通过即时通讯工具和电话提供，公司称之为“客户关怀团队”。NBU 银行业报告指出，乌克兰银行业在战时期间维持了数字服务连续性，印证 monobank
              声称的服务可用性。公开资料没有发现投诉解决时间、首次联系解决率或升级工单量指标。
