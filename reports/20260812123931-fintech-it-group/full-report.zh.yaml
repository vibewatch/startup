  - id: FM001
    title: 市场规模测算框架（金字塔）
    type: pyramid
    layout: standard
    summary: 乌克兰零售数字银行的三层市场规模测算：TAM 受战时调整后的成年人口约束，SAM 受智能手机和数字化意愿渗透约束，SOM 以 monobank 当前注册用户基数锚定。
    data:
      nodes:
        - id: tam
          label: TAM — 成年银行服务总人口（22–28M）
          detail: 任何零售银行可服务的乌克兰成年人口，已按战时外迁调整（估计 6–8M 人流离境外）。区间为 22–28M 人，由战前成年人口（~33M） 减去外迁估计得出。
        - id: sam
          label: SAM — 可使用智能手机的数字银行用户（13–18M）
          detail: >-
            拥有智能手机且愿意只用移动端办理银行业务的成年人。受智能手机渗透率（战前 ~75–80%）、非现金卡采用率（94.6%）和数字身份访问（Diia/BankID） 约束。2024 年 BankID ID 为
            87.7M。
        - id: som
          label: SOM — monobank 可获取客户（当前 10.3M / 11M+ 目标）
          detail: >-
            考虑竞争强度（PrivatBank、Oschadbank、Raiffeisen）和品牌渗透后，monobank 现实可抓住的客户。当前：10.3M 注册（June 2026）；2026 目标：Universal
            Bank 口径的 10.7M 零售 + 450K FOP。
    approximationNotes: >-
      TAM 并非来自已发布的银行业 TAM，而是用乌克兰 2021 年基于普查的成年人口（~33M）减去移民 / 流离估计（~5–11M，视来源而定）测算。SAM
      用智能手机渗透率（~75–80%）和非现金采用率（94.6%）作为数字银行意愿代理。SOM 是唯一由一手来源数据支撑的锚点（Google Play 和 Apple App Store 自报，June
      2026）。没有独立分析师发布乌克兰数字银行 TAM。
    claimRefs:
