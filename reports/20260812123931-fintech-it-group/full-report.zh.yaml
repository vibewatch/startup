  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 战争、地缘政治与宏观经济风险
        blocks:
          - type: paragraph
            body: >-
              自 2022 年 2 月起，乌克兰一直处在俄罗斯全面军事入侵之下，前线战斗延续到 2026 年 6 月。世界银行估计，未来十年乌克兰重建需求约 $588 billion，大约相当于乌克兰 2025 年名义 GDP
              估计值的三倍。破坏如此严重，乌克兰银行业却守住了稳定：没有发生银行挤兑，2023 年 2 月之后存款名义规模继续增长，资本充足率（CAR）到 2023 年 3 月恢复到战前水平。NBU
              主动危机管理——紧急流动性、加息至 25% 后再降至 15%、逐步放松资本管制——避免了系统性崩塌。

              放到 monobank 身上，战争带来四类运营风险。第一，俄罗斯导弹和无人机打击乌克兰电力与通信基础设施，让这款没有网点、完全依赖 App 的产品不时面临服务中断。第二，人员动员消耗工程师供给；monobank
              承认，未来几年人才短缺可能加剧。第三，如果前线形势恶化，基辅或第聂伯罗——monobank 两个办公室所在城市——受到威胁，运营连续性将面临生死考验。第四，汇率和资本管制限制了投资退出窗口：2023
              年以来管制已部分放松，但完全可兑换和跨境资本流动仍受限制。

              IMF 2025 年 11 月就一项新的 $8.1 billion、48 个月扩展基金安排（Extended Fund Facility）达成工作人员层面协议，降低了但没有消除主权融资风险；NBU 2026 年
              6 月决定将关键政策利率维持在 15%，释放出谨慎稳定信号。乌克兰 2025 年 GDP 预计增长 2%（低于 2024 年的 2.9%），反映长期入侵压力。宏观降速会直接压缩消费信贷需求、抬高信用损失率，给
              monobank 收入带来二阶风险。
