      - number: '5.6'
        title: 展项
        blocks:
          - type: callout
            title: Banka 筹款平台——病毒式传播的战时金融基础设施
            body: >-
              Banka（储蓄罐）已从个人储蓄功能演化为乌克兰最大的慈善筹款渠道，连接超过 1,300 家基金会，处理超过 UAH 100 billion 捐款，并拥有 1.6 million 月度捐赠者。这使
              monobank 成为公民社会的基础金融设施，形成深度嵌入的网络效应，竞争对手几乎不可能在可比时间内复制。
            calloutType: strength
            claimRefs:
              - CE026
              - CE027
              - CE028
          - type: callout
            title: PCI-DSS 自我声明缺少独立审计确认
            body: >-
              monobank 在安全页公开声称兼容 PCI-DSS，但本研究未在任何公开文件中发现 Qualified Security Assessor 报告、认证机构列表或渗透测试摘要。投资者应在尽调中要求提供 QSA
              报告、最近一次渗透测试结果，以及 ACDC Processing 认证到期时间表。
            calloutType: risk
            claimRefs:
              - CE006
              - CE046
          - type: callout
            title: 单设备 3D Secure 造成账户访问脆弱性
            body: >-
              增强 3D Secure 实现方式把所有交易确认都路由到 monobank app 推送通知通道，而不是 SMS OTP。这消除了 SIM-swap
              攻击，却造成单设备脆弱性：一旦注册手机丢失或无法访问，用户会陷入无网点银行的访问僵局，且没有实体兜底。
            calloutType: risk
            claimRefs:
              - CE007
          - type: callout
            title: App Store 隐私标签显示数据收集范围较宽
            body: >-
              Apple 强制的 App Store 隐私标签披露，monobank 收集与用户身份关联的 Location、Contact Info、Contacts 和
              Identifiers。这类关联数据收集的范围超过许多 neobank 竞争对手在同等 Apple 隐私标签中的披露；随着 EU 融合框架加深，可能在类似 GDPR 的乌克兰隐私法下产生监管敞口。
