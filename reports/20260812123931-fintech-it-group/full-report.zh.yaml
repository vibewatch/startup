      - number: '1.4'
        title: 战时韧性、反向信号和证据缺口
        blocks:
          - type: paragraph
            body: >-
              2022 年 2 月俄罗斯全面入侵乌克兰后，monobank 仍持续增长，这是它最醒目的运营事实之一。公司重组为 Fintech-IT Group 的计划因入侵被有意推迟（为了运营稳定，结构优化被降级），2024
              年才恢复，并最终在 2025 年 4 月取得 AMCU 批准、2025 年 10 月公布。Banka 捐款平台既是产品差异化点，也是战时韧性信号：1.6 million 月活跃捐赠者和 UAH 100
              billion 累计捐款，反映这家银行在战争期间深度嵌入公民社会。

              关键反向信号包括：（1）PrivatBank 创始团队关联——若干早期股东因国有化相关刑事调查离开，市场分析人士猜测 UMAEF 交易可能部分承担通过国际机构所有权保护资产的功能；（2）2024
              年收入和利润下滑（分别下降 1.5× 和 2.7×），说明业务尚未进入线性增长轨道；（3）Stereo（波兰）和 Koto（英国）两个国际 neobank
              扩张项目均已搁置，把增长叙事限制在乌克兰国内市场；（4）经 Hallstatt 和塞浦路斯控股载体串联的完整 UBO 链条，公开记录只能部分核验。

              NBU 将 Universal Bank 列为偿付能力充足且具系统重要性的银行，资产 UAH 215.6 billion、权益 UAH 28.4 billion，2024 年利润 UAH 2.59
              billion。IVI-Rating 截至 2026 年 4 月维持 Universal Bank uaAAA（投资级）信用评级，展望稳定。2025 年一项关于乌克兰数字银行的学术研究确认，monobank
              应用在 2024 年下载量超过 10 million，与公司自报客户数据一致。这些监管和第三方数据点提供了外部佐证，支撑后续章节把 Universal Bank 的财务画像作为事实锚点。
