      - number: '8.2'
        title: 估值视角 — 单客价值、EV/Revenue 与 EV/Profit
        blocks:
          - type: paragraph
            body: >-
              三个主要估值视角，可以把 $1 billion 锚点放到可观察财务指标中审视。第一，隐含单客价值：截至 2025 年 9 月，公司有 9.9 million 注册客户（根据应用商店数据，到 2026 年 6 月为
              10.3 million），$1 billion 企业价值意味着每名注册客户约 $101。相对全球新银行基准，这一数字明显偏低，既反映战时所在地折价，也反映 Fintech-IT（软件收入）与 Universal
              Bank（持有这些客户存款和贷款的实体）之间的结构性区别。

              第二，EV/Revenue 倍数：核心运营子公司 Fintech Band LLC 报告 FY2024 收入 UAH 3.71 billion（约 $90 million）。这意味着基于 FY2024
              追踪收入的企业价值 / 收入倍数约为 11×。在非战时环境中，高增长 SaaS 或金融科技软件公司通常处于 15–25× 区间，11× 低于该区间，但也反映增长轨迹被压缩：FY2024 收入同比约下降
              33%，净利润相较 FY2023 约下降 63%。如果到假设中的美国 IPO 时，收入恢复到 FY2023 水平或大幅增长，11× 倍数可能显得保守；如果下滑继续，则会显得乐观。

              第三，EV/profit 视角：Fintech Band FY2024 净利润为 UAH 1.15 billion（约 $28.6 million），对应市盈率约 35×。部分市场分析师估计，Fintech-IT
              Group 生态系统合计利润（包括流向集团的技术费和银行层面经济收益）约为每年 $200 million；若接受这一口径，则意味着约 5–6× 盈利倍数，乌克兰市场来源将其描述为“没有高估，但很有野心”。$200
              million 估计未经证实，且很可能隐含地把 Universal Bank 部分利润归因于 monobank 品牌。已披露的 Fintech Band
              盈利能力与生态系统估计之间存在落差，这是重大不确定性，投资者必须通过直接接触管理层、获取合并账目来解决。
