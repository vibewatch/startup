      - number: '2.2'
        title: 市场规模 — TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，开放来源中没有独立发布的乌克兰零售数字银行或 neobank 细分市场 TAM/SAM/SOM
              估计。所有规模测算都必须由结构性指标推导：人口范围、支付量和竞争渗透。本节用三个受约束的视角替代单一自上而下估计，并明确保留战争导致的人口流离、通胀和私营银行不透明所带来的不确定性。

              TAM（总可用市场）——成年银行人口视角：乌克兰战前常住人口约 44 million（基于 2021 年人口普查估计）。俄罗斯全面入侵导致估计 6–8 million
              乌克兰人流亡海外（UNHCR），国内流离失所者也达数百万。World Bank 2026 年 2 月 Rapid Damage and Needs Assessment（RDNA5）估计，未来十年重建成本约
              $588 billion——约为乌克兰 2025 年名义 GDP 估计值的三倍——隐含 GDP 约 $196 billion。以这一人口和宏观锚点推算，总成年银行人口（任何零售银行的潜在客群）估计为 22–28
              million 人，他们仍留在乌克兰经济中或与其保持连接；下限受移民影响高度不确定，上限则受仍持有 UAH 账户的流离劳工影响。

              SAM（可服务市场）——智能手机和数字意愿视角：全面入侵前，乌克兰成年人智能手机渗透率约 75–80%。非现金转移——2024 年按笔数计算 94.6% 的支付卡交易、总卡交易 8.65 billion
              笔——显示经济活跃人口几乎普遍采用银行卡。合并这些信号，移动银行的 SAM 估计为 13–18 million 成年人：他们拥有智能手机、活跃支付卡，并愿意不依赖网点办理银行业务。NBU BankID 系统在
              2024 年记录 87.7 million 次身份识别（较 2023 年 42.9 million 翻倍以上），确认数字身份验证作为远程银行开户前置条件正在爆发式增长。

              SOM（可获取市场）——monobank 竞争位置：截至 2026 年 6 月，monobank 拥有 10.3 million 注册客户，约占估算 SAM 的 37–47%。Universal Bank
              2026 年目标为 10.7 million 零售客户和 450,000 名 FOP；考虑现有渗透率已经很高，这是一个保守的近期天花板。交易强度——2025 年前九个月 UAH 8.5
              trillion——显示注册用户中激活程度强，但活跃客户与注册客户的比例未公开披露。

              Statista 的乌克兰银行市场方法覆盖零售和 SME 银行业的净利息收入，但不发布 neobank 特定子细分估计。没有分析师把乌克兰 neobank 细分市场的 CAGR
              与更广泛银行市场分开发布，反映战时规模测算的不确定性异常高。2026 年 2 月消费者通胀同比 7.6%，NBU 关键政策利率 15.0%，进一步复杂化基于收入的 TAM 预测。
