      - number: '8.5'
        title: 建议、信心与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              相对公开来源能够提供的证据基础，Fintech-IT Group 的 $1 billion 估值偏高。11× EV/FY2024 Revenue
              倍数对高增长金融科技软件公司而言并非天然过度，但它套在一家最近披露年份收入两位数收缩、处于活跃战区、合并财务不透明、且超过 90% 收入依赖单一受监管银行合作伙伴的公司身上。约 $101
              的单客价值，是本次调研所有可比新银行中最低的；战时折价和实体结构约束可以解释这一点，但它也遮住了战后、IPO 后情景中的潜在非对称上行。

              建议为观察：保持监控，不立即投入资本。观察立场反映我们对公司竞争地位和长期潜力有中等信心，同时也承认，仅靠公开来源很难完成财务承销。若出现以下情况，信心可上调至买入：（a）经审计的合并管理账可用，并显示收入恢复、FY2025
              盈利能力强；（b）可信的美国 IPO 时间表公布；（c）PrivatBank 法律阴影正式解决；（d）战后重建逻辑实质推进。

              本章记录的具体尽调要求包括：覆盖 Fintech Band 和 Universal Bank 的 FY2024、FY2025 完整合并管理账；集团内费用协议的详细拆分；经审计的 FY2025 Fintech
              Band IFRS 报告；UMAEF 之后的股权结构表（包括 UMAEF 财团完整构成和总持股）；以及 UMAEF 投资协议中的锁定条款、优先股堆叠和反稀释条款。要从观察转向买入，这些是最低信息集。
