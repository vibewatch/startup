      - number: '3.4'
        title: SME 和 FOP 企业银行
        blocks:
          - type: paragraph
            body: >-
              小企业（FOP/SME）银行是一个新兴竞争维度，monobank 正在追赶依赖网点的在位者。monobank 推出了一键 FOP 注册、私有网页会计柜台、用于商户收单的 ACDC processing（持有
              Visa、Mastercard 和 PCI DSS 认证），以及社保支付支持（养老基金、薪资提取），使其成为传统企业账户的可信替代方案。

              PrivatBank 是乌克兰主导性的企业和商户银行，通过其 250,000+ 台 POS 终端网络处理大多数 POS 支付，并向 SME 提供 SWIFT、薪资和贸易融资。其 Privat24 for
              Business 产品接入乌克兰薪资基础设施和工资卡体系。Oschadbank 在 2024 年发放 UAH 14.5 billion 新企业贷款，其中 30% 在合作项目下发放、利率低至年化
              0.01%；它也积极参与国家补贴的 Affordable Loans 5-7-9% 项目，该项目 2024 年向创业者投放超过 UAH 62 billion。Oschadbank 还在大型企业能源项目融资中持有
              30% 市场份额。

              Raiffeisen Bank Ukraine 和 OTP Bank Ukraine 是中型 SME 贷款方，具备强贸易融资和 SWIFT 能力，对乌克兰出口商或有欧洲交易对手的企业有用。

              monobank 在 SME 上的竞争缺口是结构性的：国家补贴贷款项目（5-7-9%、eOselia）和 Affordable Loans 担保计划，主要由 PrivatBank 与 Oschadbank
              在财政部安排下管理。公开披露中，monobank 并未作为这些补贴性国家贷款项目的重要参与方出现，因此难以在利率上竞争需要信贷的 SME 客户。NBU 未公开按银行划分的精确 SME 贷款市场份额；这是评估
              monobank FOP 渗透深度的重大证据缺口。
