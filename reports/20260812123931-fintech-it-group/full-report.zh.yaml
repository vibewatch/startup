              Raiffeisen Bank International 已公开表示，在重组其俄罗斯和 CIS 敞口时考虑从乌克兰战略退出。若 RBI 退出，Raiffeisen Bank Ukraine 约 UAH 265
              billion 资产和大量城市专业客群将需要重组或出售。这是银行业信心的反向情景；但如果服务连续性变差，也可能为 monobank 创造重大获客机会。投资者应在 2026 年持续跟踪 RBI
