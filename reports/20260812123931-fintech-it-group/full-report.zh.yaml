      - number: '2.3'
        title: 买方和用户分层
        blocks:
          - type: paragraph
            body: >-
              monobank 在乌克兰零售数字银行市场服务五个主要买方 / 用户分层。这些分层在工作流、预算所有权、采用触发点，以及对 Universal Bank 和 Fintech-IT Group 的收入贡献上都不同。

              大众零售（薪资劳动者和城市消费者）：这是 monobank
              最大、最基础的分层——原本使用网点银行的个人，为免费支付卡、返现计划和点对点转账切换到移动银行。主要采用触发点是朋友或同事推荐叠加雇主薪资入账。monobank
              持续保持乌克兰银行业最高净推荐值，确认该分层留存强劲。

              自由职业者和个体经营者（FOP）：乌克兰有庞大的自雇群体，他们为税务目的注册为自然人企业家（Фізична особа-підприємець / FOP）。FOP 可以在 monobank
              应用内同时管理个人和商业账户，无手续费向养老基金支付 FOP 社保缴款，并使用企业网页柜台进行税务申报。Universal Bank 2026 年 FOP 目标为
              450,000，代表该分层近期对注册用户贡献的上限。

              使用 ACDC 收单的 SME：Fintech-IT Group 子公司 ACDC Processing 依托 Visa 和 Mastercard 通道以及 PCI DSS 认证基础设施，使数万家乌克兰 SME
              能够接受数字支付。Shake2Pay 让 monobank 支持 HoReCa 商户二维码付款。这些 SME 是技术基础设施买方，而不是 monobank 应用的直接买方，但它们的交易会在 Fintech-IT
              Group 生态内产生交换费和收单收入。

              捐赠者和慈善 / 军事支持用户（Banka）：截至 monobank 主页 2026 年 6 月披露，Banka 募款平台拥有超过 1.6 million 月活跃捐赠者，累计处理捐款超过 UAH 100
              billion。该分层没有银行收入功能（捐款不是存款），但推动应用参与度、NPS 和慈善品牌资产；在战时乌克兰，这种品牌资产异常强。

              海外侨民和流离失所的乌克兰人：战时估计 6–8 million 乌克兰人流亡海外，催生了跨境支付和汇款功能需求。monobank 2026 年 6 月宣布免费 SWIFT
              转账（收款和付款），直接缓解这一分层的成本摩擦。侨民用户通常保留乌克兰账户，并用 monobank 处理汇款、家庭支持付款和 VAT 退款入账。
