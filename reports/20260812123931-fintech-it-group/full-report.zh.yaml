  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 实体分离和双重财务报告结构
        blocks:
          - type: paragraph
            body: >-
              任何对 monobank 的财务分析都必须从实体分离开始。两个独立法律实体产生收入、承担风险，但没有任何公开文件把它们合并。JSC Universal Bank（NBU 牌照 No.
              92）是银行实体，持有存款、发放贷款，并产生净利息收入、交换费和佣金收入。其财务结果报送乌克兰国家银行，并以英文摘要形式出现在 NBU 监管档案页面。Fintech-IT Group——此前名为 Fintech
              Band LLC 的 IT 控股公司——是技术运营方，开发和维护 monobank 应用、ACDC 支付处理平台以及相邻金融科技产品。Fintech Band 的收入主要来自向 Universal Bank
              提供的软件开发和技术服务，并由 ACDC 支付处理收入以及 Expirenza、market by mono、Base by mono、Loyalty.ai 等面向 SME 产品的收入补充。

              两个实体经济上相互依赖，但法律上彼此分离，董事会、所有权结构和监管框架都不同。Universal Bank 由 Serhiy Tihipko 通过 TAC Group 持有；Fintech-IT Group
              的最终受益人为 Oleg Gorokhovskyi 和 Mykhailo Rohalskyi。monobank 品牌并不对应任何一家公开披露合并财务的单一法律实体。任何把 monobank
              作为统一业务承销的投资者，都必须取得覆盖两个实体的未公开管理账，并记录 Universal Bank 与 Fintech Band 之间的关联收费安排。本章全程保持这一区分：归属于 Universal
              Bank（NBU 报告）的财务指标只代表银行实体；归属于 Fintech Band 或 Fintech-IT Group 的指标只代表技术运营方。
