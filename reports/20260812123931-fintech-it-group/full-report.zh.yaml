      - number: '7.2'
        title: 银行层面的偿付能力、信用质量与融资风险
        blocks:
          - type: paragraph
            body: >-
              monobank 的银行业务全部托管在 Universal Bank (JSC) 内。Universal Bank 是一家由 NBU 监管、私有且具系统重要性的机构。截至 2026 年 Q1，Universal
              Bank 报告资产 UAH 215.6 billion、负债 UAH 187.1 billion、权益 UAH 28.4 billion、利润 UAH 2.59 billion。该行加入存款担保基金，并被 NBU
              归类为有偿付能力。这些核心指标让人安心，但投资者必须把银行层面风险和技术公司风险拆开看：Universal Bank 的贷款簿质量，包括 monobank 的无抵押消费信贷组合，并未单独披露。

              全面战争爆发以来，乌克兰银行业不良贷款率持续上升。VoxUkraine 基于 NBU 数据的分析指出，行业贷款组合相较战前水平实际下降约 30%；只有当 NBU
              恢复全面资产质量审查（AQR）和韧性评估后，隐藏的不良贷款风险才会暴露。未来盈利预期还受“仍未暴露的不良贷款”影响。monobank
              的产品包含无抵押分期信贷、短期“到明天”小额贷款和消费贷款；消费信贷环境恶化，会直接变成更高拨备费用、更低利润率，以及 Universal Bank 向集团分配利润的能力下降。

              2024 年 Fintech Band 收入下降 1.5× 至 UAH 3.71B，利润下降 2.7× 至 UAH
              1.15B，公开披露没有解释原因，可能部分反映信用损失上升、放款放缓或拨备增加。如果乌克兰宏观环境继续长期恶化——消费者支出下降、受影响地区失业率上升、货币走弱——Universal Bank
              报告利润会被压缩，也可能触发 NBU 要求增资，从而挤占产品投入。没有 Universal Bank 详细贷款质量分层或归属于 monobank 的信用数据，投资者无法独立建模这项风险。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: 监管与牌照风险
        blocks:
          - type: paragraph
            body: >-
              monobank 的全部银行活动——吸收存款、发放信贷、运营银行卡——都依赖 Universal Bank 自 1994-01-20 起独家持有的 NBU 92
              号牌照。如果该牌照被吊销或暂停，无论原因是资本充足率不达标、AML 违规、制裁敞口还是管理层不当行为，monobank 都会一夜之间无法作为银行运营。这是没有后备方案的硬依赖：Fintech-IT Group
              自身没有银行牌照。

              ACDC Processing 在 2021 至 2025 年获得 NBU 认可，成为“重要支付基础设施运营商”，使其能够开展 Visa/Mastercard 及 PCI-DSS 认证的交易处理。2025
              年之后这一监管身份是否延续，公开来源尚未证实，支付基础设施风险图谱因此留下未解决缺口。

              从监管趋势看，乌克兰推进 EU Association Agreement 落地，要求银行监管逐步向 EU 指令对齐，包括资本要求（等同 CRD/CRR）、数据隐私（对齐 GDPR）、AML/CFT
              标准和消费者保护规则。每一项都可能带来合规成本和运营重组要求。NBU Financial Stability Report 2025
              强调乌克兰银行面临宏观、信用和运营风险，并指出“聚焦风险控制、确保运营连续性仍是优先事项”。NBU 监管范围也覆盖消费者保护执法：monobank 用户可直接向 NBU
              消费者保护办公室投诉，服务失败会形成监管反馈渠道。
