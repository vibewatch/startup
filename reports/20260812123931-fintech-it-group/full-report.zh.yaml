      - number: '5.2'
        title: FOP / 企业银行与商户收单
        blocks:
          - type: paragraph
            body: >-
              monobank 的 FOP（个体企业主）产品以 “FOP mono” 品牌面向自由职业者、IT 专业人员、线上商户、服务提供商和创作者。现有 monobank 持卡人开户只需 9 次点击，官方最快纪录为 13
              秒。FOP 账户开户、维护、基于 IBAN 的转账和关联借记卡收费均为 UAH 0；通过转入个人账户，每月 UAH 50,000 以内免费提现。其他 FOP 服务包括 USD 和 EUR
              货币账户、用于业务线隔离的第二个格里夫纳活期账户、用于育儿假和病假工资的社会付款账户，以及可按电话号码授权会计、最多支持 10 个关联联系人。在线企业后台承载桌面端会计工作流。

              商户收单（“plata by mono”）提供四种模式：面向网站和 app 内支付链接的互联网收单、带财税收据开具功能的品牌 POS 终端、SoftPOS（商户自有手机即终端）和 QR
              立牌方案。公司披露的佣金为乌克兰发行卡 1.3%、外国卡 2.0%；POS 终端租赁费为每月 UAH 500，互联网收单和 SoftPOS 无硬件成本。资金在 24 小时内结算至商户账户。公司称，超过 98%
              的收单付款首次尝试即可成功，并提供全天候处理和反欺诈保护。企业后台功能包括分析、发起付款、终端管理、退款和对账单下载。其他收单能力包括软件财政登记器（pRRO）、资金预留（escrow）、用于经常性付款的卡片
              tokenization，以及自助服务模块。收单 API 文档覆盖 3D Secure 流程、完整错误代码分类（银行封锁卡、3DS 失败、余额不足、技术错误）、tokenization 和退款处理。

              支撑消费者和商户流程的支付基础设施是 ACDC Processing LLC，这是 Fintech-IT Group 子公司，2020 年推出，2021 至 2025 年被 NBU
              认定为重要支付基础设施运营商。ACDC 拥有 Visa、Mastercard 和 PCI DSS 认证，创始人称其为乌克兰领先的独立支付服务技术运营商。
