      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 反向假设 — 资产保护，而非纯财务背书
            body: >-
              乌克兰市场分析师提出一项未经证实的假设（Forbes Ukraine 通过 KyivPost 报道）：UMAEF 投资的主要动机，是提供一个与美国政府相关联的所有权护盾，以对冲 Fintech-IT Group
              创始人面临的 PrivatBank 相关诉讼风险。如果这一假设正确，$18.5 million 投资就不能被解读为对 $1 billion
              标记的独立财务背书，本轮融资的信号价值会被实质削弱。这是一个可能打破投资逻辑的风险，尽调必须审阅投资文件和任何配套附属函件，验证这一点。
            calloutType: risk
            claimRefs:
              - CV033
              - CV034
          - type: callout
            title: 双实体估值假设
            body: >-
              本章把 Fintech-IT Group 的 $1 billion 技术开发方估值作为主要锚点来评估。它没有把 Universal Bank 的权益（~$634
              million）加入或归因到投资价值中；Universal Bank 是独立持有的实体，其权益由 Serhiy Tihipko 通过 TAC Group 控制，不由 Fintech-IT Group 创始人或
              UMAEF 控制。任何把两个实体相加的分部估值分析，都需要完整的独立合并文件；这些文件目前不在公共领域。
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
          - type: callout
            title: 2026 年 IPO 选择权信号
            body: >-
              Fintech-IT Group（通过 UMAEF 公开声明）和 Universal Bank 都释放了上市意向：Fintech-IT 拟在美国交易所上市，Universal Bank 暂定 2026
              年在国际交易所上市。如果两条上市路径都推进，将形成前所未有的乌克兰金融科技与银行双上市资本市场事件，可能为 monobank 生态吸引大量国际投资者关注。
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
