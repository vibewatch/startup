      - number: '4.3'
        title: Fintech-IT Group 与 Fintech Band 的收入和盈利能力
        blocks:
          - type: paragraph
            body: >-
              Fintech Band LLC（Fintech-IT Group 的核心实体）披露 FY2024 收入 UAH 3.71 billion；按采用的 UAH/USD 汇率不同，约合 $89.6–92.4
              million。同年净利润 UAH 1.15 billion（约 $28.6 million），隐含净利率约 31%。对一家技术服务公司而言，这一利润率异常高，但与 monobank
              架构支撑的轻资本、零网点、软件即基础设施模式一致。Fintech-IT Group 2024 年合并收入约 90% 来自 Fintech Band，剩余约 10% 来自 ACDC Processing、Shake
              to Pay/Expirenza、Kilobyte 以及 2024 年从 Swiss bank CBH 收购的 MOSST。

              不过，FY2024 业绩较 FY2023 出现实质恶化：收入约下降 1.5×（33%），净利润同比约下降 2.7×（63%）。这一降幅是关键反向信号，管理层尚未公开回应。UMAEF 2025 年 10 月新闻稿称
              Fintech-IT Group “基本面扎实且成长性高”，但未提及 2024 年下滑。Scroll.media CEO 访谈（2025 年 11 月）讨论了 UMAEF 投资和公司重组，却没有解释 FY2024
              业绩的财务背景。可能原因包括战时需求走弱、Fintech Band 向 Fintech-IT Group 过渡期间的关联方合同重组、MOSST 一次性收购成本，或部分收入项目重分类。无法取得 FY2023
              对比报表和经审计的 FY2024 IFRS 报表时，仅凭公开来源无法归因。

              Fintech-IT Group 雇佣约 630 名专家，其中约 400 名 IT 专业人员；按此计算，员工人均收入约 $142,000/year。这个水平大体符合乌克兰 IT
              行业常态：当地开发者薪酬显著低于西欧和美国，但与波兰、罗马尼亚等区域同行相近。
