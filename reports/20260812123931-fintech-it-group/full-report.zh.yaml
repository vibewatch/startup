      - number: '6.2'
        title: 大众零售消费者、信贷用户与家庭账户
        blocks:
          - type: paragraph
            body: >-
              大众零售消费者是 monobank 最大、也最面向公众的客群。开户设计追求低摩擦：用户下载 app 后，可在 Diia（乌克兰政府数字 ID app）、身份证、生物识别护照或外国护照中选择一种完成 KYC。虚拟
              Mastercard 卡立即发放；如需实体卡，则通过 Nova Poshta 配送。通过 Diia 的历史最快注册纪录为 99 秒。全数字 KYC 和零费用发卡，移除了传统网点银行的主要进入门槛。

              消费信贷提供三种形式：参与商户（包括 KTC、Citrus、MOYO 和 Foxtrot）的 “Pokupka Chastynahy” 分期付款，消费者零利息成本（商户出资）；可在任意商户使用、包括
              AliExpress 和 Amazon 的全球分期计划；以及面向即时需求、数分钟放款的 “Do Zavtra”（直到明天）小额贷款。披露的最高授信额度为 UAH
              200,000。消费信贷用户是明显价值更高的客群，具有重复还款行为，但注册用户中的信贷渗透率没有公开披露。

              UAH 和外币政府债券（OVDPs）在 app 内销售，对零售投资者免所得税，并明确传递军事支持信息。这个产品服务更深度参与金融的用户，他们把 monobank 当成完整的储蓄和投资平台。USD 和 EUR
              货币账户服务侨民和跨境流动用户；版本 8.16 取消收发国际付款的 SWIFT 费用，进一步强化这一点。

              儿童卡和共享家庭账户功能覆盖家庭与青少年客群，提供按消费类别设置的家长控制，并让家长共享查看孩子账户。面向国家支持项目的 Diia.Card
              把覆盖范围延伸到政府项目受益人。这些功能共同把可触达消费者从核心城市、技术敏感人群向外扩展；但上述任何子类别都没有公开可得的分层账户数数据。
