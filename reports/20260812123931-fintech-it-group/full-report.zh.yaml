      - number: '7.7'
        title: 否决标准、监控触发器与投资逻辑评估
        blocks:
          - type: paragraph
            body: >-
              持有 monobank 敞口的投资者必须定义清晰阈值，一旦投资逻辑被打破就重新评估或退出。投资逻辑建立在五个核心假设上：（1）Universal Bank
              的偿付能力和牌照保持完整；（2）俄罗斯入侵不会升级到摧毁基辅或第聂伯罗市区；（3）重建加速后，乌克兰消费信贷需求恢复；（4）Gorokhovskyi 和 Rohalskyi 不因 PrivatBank
              相关程序面临刑事风险；（5）Fintech-IT Group / Universal Bank 合作以有利于投资者的条件续约或重组。

              每个假设都能用可观察的市场或监管信号监控。NBU 针对 Universal Bank 的监管动作，包括资本充足率警告、牌照条件或正式执法，会直接指向假设（1）。前线军事地图和 UN/ICRC
              流离失所数据跟踪假设（2）。NBU 月度银行业回顾跟踪零售信贷增长和不良贷款趋势，对应假设（3）。乌克兰法院记录和执法公告跟踪假设（4）。Universal Bank 所有权变更、合作重新谈判，或
              Fintech-IT Group 启动自有银行牌照申请的任何公开公告，跟踪假设（5）。

              monobank 的人员风险集中在两位创始人身上。Gorokhovskyi 是公众面孔和产品负责人；Rohalskyi
              负责技术和运营。公司没有公开披露继任计划、非创始人管理层深度对应的组织韧性结构，也没有披露关键人物保险。任何一位创始人离开或丧失履职能力，都会给这款与创始人品牌高度绑定的产品带来急性运营和声誉风险。
