      - number: '7.6'
        title: 集中度、合作伙伴依赖与估值风险
        blocks:
          - type: paragraph
            body: >-
              monobank 最具结构性特征的风险，是对 Universal Bank 的单线依赖。每一项受监管银行活动——持有存款、发放信贷、运营支付卡、执行 KYC——都需要 Universal Bank 持有的 NBU
              银行牌照。Universal Bank 由 Serhiy Tihipko 拥有；他是独立第三方，没有披露任何长期合同承诺来维持合作。Fintech-IT Group / Universal Bank
              技术与服务协议的条款，包括期限、排他性、收入分成安排和终止权，均未公开。如果 Universal Bank 退出或限制合作，或 Tihipko 试图出售 Universal Bank
              变现、买方又不支持该安排，Fintech-IT Group 将没有可立即接上的银行基础设施。

              地理和基础设施集中度放大了这项风险。Fintech-IT Group
              两个办公室位于基辅和第聂伯罗，这两座城市都遭遇过俄罗斯导弹打击。虽然技术团队也在乌克兰各地远程办公，但集中在这两座城市，会让高层领导连续性出现单点脆弱性。

              国际扩张已经暂停。Stereo by mono（波兰）和 Koto（英国）项目明确处于“暂停”状态，monobank 没有 EU
              或英国银行牌照。这意味着全部估值都锚定在一个承受战时逆风的单一国家市场，短期没有国际分散化路径。

              估值风险直接取决于退出可行性。UMAEF 牵头的 $1 billion+ 估值在 2025 年 10 月确立，形成一轮抬升；它要求未来战略出售、老股交易或最终 IPO
              的倍数高于乌克兰私募股权常规水平。此前没有乌克兰 fintech 在主要交易所完成 IPO。UMAEF 和私人投资者的看跌 / 看涨权利以及流动性时间表没有披露。Fintech Band 2024
              年收入和利润下降，也进一步提出一个问题：独立战略买家经过尽调后，$1 billion 估值能否撑住。
