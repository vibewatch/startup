  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 消费者产品套件与 UX 架构
        blocks:
          - type: paragraph
            body: >-
              monobank 的消费者产品套件以移动优先设计为核心，银行卡注册可在两分钟内完成。记录是通过乌克兰政府数字身份应用 Diia 完成的 99 秒。用户下载后，可在
              Diia、身份证、生物识别护照或外国护照中选择一种方式完成 KYC；虚拟 Mastercard 卡随即发放，实体卡可选由 Nova Poshta 配送。App Store 上有 910,000 条评分，平均
              4.9 星，是乌克兰评分量最高的银行 app；Google Play 包名 com.ftband.mono 的页面也显示产品仍在线且持续维护。

              App 打包了多类金融工具：支付卡（包括 Black、White 和 Iron 版本）、USD 和 EUR 货币账户，以及三类消费信贷产品——参与商户提供、消费者零利息成本（由商户支付）的 “Pokupka
              Chastynahy” 分期付款；可在 AliExpress 和 Amazon 使用的通用全球分期计划；以及数分钟内放款的 “Do Zavtra”（直到明天）小额贷款。政府债券（OVDPs）提供 UAH
              和外币版本，对零售投资者免所得税，并明确以支持军方作为卖点。UAH 和外币存款、以及用于个人和慈善筹款的 “Banka” 储蓄罐，补齐储蓄层。

              UX 差异点包括 monocat 个性化猫头像，以及收款时标志性的咕噜提示音。Shake2Pay 允许两部邻近手机通过摇一摇转账，无需交换卡号。Group Expenses
              自动在联系人之间分摊账单并发送付款提醒。eSIM 购买和管理（Kyivstar、Vodafone、lifecell、Airalo）可直接在 app 内完成。MTPL、Green Card
              和车险可在数分钟内购买，汽车和加油站消费有返现。二手商品市场 market by mono 集成在 app 内，把功能边界从纯银行扩展出去。

              研究日期前六天发布的 app 版本 8.16 取消了收发国际付款的 SWIFT 费用，消费者和企业用户均适用。App Store 版权归 Kilobyte1024（ТОВ
              "Кілобайт1024"）所有，这是负责 2023 年 monobank 2.0 app 改版的 Fintech-IT Group 实体。
