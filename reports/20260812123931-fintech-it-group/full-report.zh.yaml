      - number: '8.3'
        title: 可比公司分析 — 全球与新兴市场新银行
        blocks:
          - type: paragraph
            body: >-
              将 Fintech-IT Group 与全球新银行同行和上市数字银行公司对标，可以为 $1 billion 锚点提供关键背景。实体区别让比较变复杂：Fintech-IT Group 收入基础完全是技术费，而 Nu
              Holdings、Revolut、Monzo 等同行合并了银行和技术收入。但比较仍能照出估值常态。

              Nu Holdings（NYSE: NU）是最直接可比的上市公司：一家巴西数字银行，客户超过 100 million，覆盖巴西、墨西哥和哥伦比亚。Yahoo Finance 显示，截至 2026 年 6 月，Nu
              市值约 $61.8 billion。峰值时，Nu 约达 $81.1 billion（2026 年 2 月）。FY2024 收入 $11.5 billion（同比增长 43.4%），Nu 的追踪收入倍数约
              5.4×。Yahoo Finance 显示其市盈率约 19.6×（TTM）。Nu 面向更大、更分散的客户群，监管环境也稳定得多，因此与 Fintech-IT Group 的直接比较并不完美。

              Revolut 是欧洲估值最高的新银行，2024 年 7 月老股出售估值约 $45 billion，按当时约 45 million 用户计算，隐含每名客户约 $1,000。Revolut 于 2026 年 4
              月向 UK Companies House 提交完整 2025 年账目，确认仍在持续运营。相对 Fintech-IT Group 的显著单客溢价，来自 Revolut
              的多国规模、英国银行牌照和多元化收入流（加密货币、股票交易、高级订阅）。英国消费者新银行 Monzo 已向 UK Companies House 提交年度账目，并在 2024–2025 年老股市场交易中估值约
              £4–5 billion（~$5–6 billion），按约 9 million 英国账户计算，隐含每名客户约 $556–667。

              德国新银行 N26 报告 FY2024 收入约 €440 million（同比增长约 40%），在 2024 年 Q3 首次录得季度经营利润（€2.8 million），且在德国监管机构 BaFin
              取消获客上限后，每月新增客户超过 200,000。N26 最近一次公开估值约为 2021 年的 $9 billion，因此任何当前 P/Revenue 比较都不可靠。澳大利亚 B2B 支付公司 Airwallex
              据报洽谈以 $6 billion 估值融资 $200 million，拥有 100,000 企业客户，说明 B2B 金融科技基础设施能拿到可观估值溢价。

              可比组一致显示，Fintech-IT 隐含每名客户 $101
              的价值，相对西方同行有显著折价。折价有一部分合理：乌克兰是受战争影响的单一市场，退出流动性薄；技术运营实体只赚软件费，不赚完整银行利差；披露不透明也阻止严格承销。折价也反映一种潜在上行：投资者若能持有到停火和
              IPO 情景，回报可能不对称。
