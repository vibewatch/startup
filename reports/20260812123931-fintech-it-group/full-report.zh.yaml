  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户规模与分层概览
        blocks:
          - type: paragraph
            body: >-
              按注册客户数，monobank 是乌克兰最大的商业数字银行；截至 2026 年 6 月客户超过 10.3 million，这一数字在 Apple App Store、Google Play
              和公司英文主页上完全一致。UMAEF 官方新闻稿确认截至 2025 年 9 月有 9.9 million 客户，意味着 2025 年 9 月至 2026 年 6 月九个月净增约 400,000。Universal
              Bank CEO Iryna Starominska 公开设定 2026 年底目标：10.7 million 零售客户、18,000 家法人实体和 450,000
              个个体企业主（FOP）账户，为评估获客动能提供前瞻锚点。公司进入 CNBC top-35 neobank 榜单，并自称拥有乌克兰银行业最高 NPS，这些独立声誉信号支撑了 10.3 million
              这一头部客户数。

              重要的是，monobank 没有公开区分注册客户和活跃交易客户。交易量提供了部分代理指标：2025 年前九个月处理 UAH 8.5 trillion（Komersant Ukraine
              引述公司内部数据），意味着用户平均交易频次较高，与 monobank
              对许多客户来说是主账户而非备用卡的判断一致。可是，不活跃或休眠注册账户占比未知；公司在本研究审阅的任何公开文件或新闻稿中都没有披露月活用户、日活用户或银行卡使用率指标。

              客户分布在地理上高度集中于乌克兰。Stereo（Poland）和 Koto（UK）两个国际扩张项目目前均暂停；Scroll Media 对 CEO Gorokhovskyi
              的访谈确认，当前战略重点仍是乌克兰国内市场。乌克兰境内的区域拆分（例如按 oblast）没有公开披露。
