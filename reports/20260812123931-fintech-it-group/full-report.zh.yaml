      - number: '4.4'
        title: 收入模型、变现驱动因素与单位经济
        blocks:
          - type: paragraph
            body: >-
              monobank 的收入模型分成两个不同但相互依赖的层次。在银行层，Universal Bank 的收入来自：(1) Visa 和 Mastercard 支付卡交易的交换费——考虑到 monobank
              按支付卡数量是乌克兰第二大零售银行，这是主要的交易量驱动收入；(2) 消费贷款带来的净利息收入（NII），包括分期计划、“明天前”小额贷款和信用卡产品；(3)
              货币兑换、国际转账、账户管理和政府债券投资带来的手续费收入；(4) 政府债券组合带来的资金业务收入，按 2026 年 6 月 NBU 政策利率 15% 计算，自 2022
              年以来这是乌克兰银行业的重要盈利驱动；(5) 随着 Universal Bank 目标在 2026 年底达到 18,000 家法人实体和 450,000 个 FOP（个体企业主）账户，SME 和 FOP
              银行业务手续费继续增长。

              在技术层，Fintech Band 主要靠 Universal Bank 支付的技术服务费变现，负责开发并运营 monobank 平台；同时还有 ACDC
              支付处理费和邻近技术产品收入（Expirenza、market by mono、Base by mono、Loyalty.ai）。Universal Bank 与 Fintech Band
              之间的关联方收费公式未公开；该结构意味着 Fintech Band 收入与 Universal Bank 的卡交易量和贷款规模增长高度绑定，形成单一客户收入集中风险。

              银行层和技术运营商层面的单位经济均未披露。公开资料没有净息差（NIM）、获客成本（CAC）、客户终身价值（LTV）、回本周期或队列盈利能力。可以粗略推导一个技术运营商收入代理指标：Fintech Band
              FY2024 收入约 $89.6 million，除以估计约 8 million 活跃用户，得到技术运营商层每用户每年约 $10–12；但这一数字不包括 Universal Bank 自身由 NII
              驱动的收入，如果 Fintech Band 的部分收入与 monobank 零售无关，也可能高估每用户经济。2024 年乌克兰非现金交易按笔数占比达到 94.6%，monobank 评分 4.9 的 app
              维持乌克兰银行业最高 NPS，即便宏观环境持平至小幅增长，也支撑由交易量驱动的交换费和手续费收入增长。
