      - number: '7.4'
        title: 法律与声誉风险 — PrivatBank 关联和所有权结构
        blocks:
          - type: paragraph
            body: >-
              monobank 最持久的声誉包袱，是联合创始人 Oleg Gorokhovskyi 和 Mykhailo Rohalskyi 的职业出身：二人曾是 PrivatBank 高管。PrivatBank 在发现
              UAH 155 billion+ 资本缺口后，于 2016 年 12 月被乌克兰政府国有化。这是东欧历史上最大银行倒闭事件之一；政府最终为其注资 UAH 155.8 billion。

              Gorokhovskyi 和 Rohalskyi 本人的直接法律风险有限：两位创始人都没有在任何 PrivatBank 相关程序中被公开列为刑事嫌疑人。但另有三名 Fintech Band 共同所有人收到
              PrivatBank 国有化案件中的刑事嫌疑通知。Komersant Ukraine 和 NV 报道称，前联合创始人 Volodymyr Yatsenko、Liudmyla Shmalchenko
              在收到刑事嫌疑通知前后出售了 Fintech Band 持股。另一位早期股东 Dmytro Dubilet 于 2019 年离开并进入政府任职。这意味着，在乌克兰最大银行欺诈案仍处于刑事调查期间，monobank
              曾由涉案调查对象直接共同持有。

              2025 年 4 月之后的所有权重组增加了治理不透明度：Crestline Limited（塞浦路斯，63.98%）和 Nisets Limited（塞浦路斯，14%）持有 Fintech Band LLC
              多数股权。Gorokhovskyi 确认 Crestline 和 Nisets 是乌克兰税务居民并在乌克兰纳税，但塞浦路斯注册带来两层受益所有权结构，增加投资者尽调难度。AMCU 已在 2025 年 4 月批准
              Crestline 收购，但没有独立法律意见公开说明该塞浦路斯结构在乌克兰法律下的影响。

              从尽调角度，任何机构投资者都必须取得三类材料：（a）法律意见书，确认 Gorokhovskyi 和 Rohalskyi 在 PrivatBank
              程序中没有正在进行的刑事风险敞口；（b）塞浦路斯受益所有权链条的清晰文件；（c）UMAEF 投资经过 OFAC 和乌克兰制裁筛查的确认。上述文件均未公开。
