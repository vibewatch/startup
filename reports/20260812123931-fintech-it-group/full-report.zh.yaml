            title: 应用评分稳定性显示结构性 UX 优势
            body: >-
              monobank 在 1.13 million 条 Google Play 评价和 910,000 个 App Store 评分中保持 4.9 星，而 Privat24 在 1.67 million 条评价中为
              4.8 星；这证明 monobank 在规模化后仍比乌克兰主导性在位银行维持更高单用户满意度。跨 PrivatBank 用户基础一小部分人群的 0.1 星差距，意味着单用户 UX
              投入和产品一致性显著更强。以网点为先的在位银行，其产品复杂度和遗留架构会稀释应用凝聚力，难以复制这一评分优势。
            calloutType: strength
