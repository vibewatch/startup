          - type: callout
            title: 国有银行存款规模是 monobank 吸收存款的结构性天花板
            body: >-
              Oschadbank UAH 210 billion 的个人存款基础，反映出 monobank
              没有主权后盾就无法复制的信任动态。风险厌恶型乌克兰人——尤其是年龄更大人群和受冲突影响地区居民——默认仍偏好国有银行托管。PrivatBank 的 19 million
              活跃客户也代表薪资入账主导地位，使其在收入流入点获得存款获取先手。monobank 的存款天花板受行为约束，而不只是运营受限。
