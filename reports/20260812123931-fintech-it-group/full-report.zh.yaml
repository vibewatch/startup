      - number: '6.7'
        title: 展项
        blocks:
          - type: callout
            title: Banka 筹款构成留存护城河
            body: >-
              1.6 million 月度 Banka 捐赠者和 UAH 100 billion
              累计捐款，构成战时原生的留存回路，传统银行很难复制。已经向军事或人道主义基金会设置定期捐款的用户，会承担真实的行为切换成本，而不只是财务成本。从客户耐久性看，这种社区驱动参与是 monobank
              最有辨识度的定性差异点。
            calloutType: strength
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU026
          - type: callout
            title: 活跃用户率未知且重要
            body: >-
              monobank 披露 10.3 million 注册客户，但不披露月活用户、日活用户或银行卡使用率。按典型 neobank 60-75% 的激活率，可能有 2.6 至 4.1 million
              个注册账户处于休眠或边缘活跃状态。6-8 million 乌克兰人的战时迁徙可能进一步压低活跃用户比例。这个缺口意味着 “10.3M” 头部数字掩盖了真实可变现客户基数。
            calloutType: risk
