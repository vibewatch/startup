          - type: callout
            title: 高级用户识别出的安全 UX 缺口
            body: >-
              2026 年 6 月和 2026 年 1 月两条不同的 Google Play 评论都给 monobank 3 星（从 5 星下调），理由是缺少身份验证器 app 2FA、缺少会话可见性控制，以及强制迁移
              v2.0 UI。这些来自安全意识较强、IT 专业化用户群的信号有实质意义——这正是 monobank 在 FOP / 企业增长阶段需要留住的早期采用者群体。如果不处理，这些投诉可能削弱 monobank
              转化重视安全的小企业用户的能力。
