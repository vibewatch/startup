      - number: '3.5'
        title: 护城河耐久性、锁定效应和竞争风险
        blocks:
          - type: paragraph
            body: >-
              monobank 的竞争护城河建立在三项相互强化的优势上：（1）面向数字优先一代的移动原生 UX 和品牌忠诚度，体现在 4.9 星应用评分和 10.3 million
              注册客户；（2）零网点成本结构，使它相比网点密集型同业能提供更高返现、免费提现和更好存款利率；（3）Banka 募款平台，已处理超过 UAH 100 billion 捐款，并把 1.6 million
              月捐赠者连接到 1,300+ 家慈善机构——形成一种社会使命身份，PrivatBank 的国有 Charity 服务无法完全复制。

              护城河面临四项重大威胁。第一，PrivatBank 的客户规模和国家背书，为风险厌恶型乌克兰人带来隐性存款安全优势：国有银行存款带有主权担保联想，超过正式存款保障基金（DGF）对所有银行最高 UAH
              600,000 的覆盖。第二，Oschadbank 的 1,150 家网点服务前线和农村地区无法稳定使用数字银行的人群——这是 monobank 没有网点就无法结构性服务的分层。第三，Raiffeisen
              Bank International 已公开提示其乌克兰业务存在战略不确定性；若退出，客户基础扰动可能通过钱包份额增益利好
              monobank，但也可能触发私营银行业更广泛的信心担忧。第四，战时断电和互联网中断会周期性打断纯数字银行访问。

              切换成本中等：monobank 与 Diia 集成的 KYC、绑定 FOP 账户、Banka 罐子历史和经常性付款自动化，都会形成有意义的留存摩擦；但 PrivatBank
              的薪资入账主导地位（许多乌克兰雇主把薪资打入 Privat24 账户）在收入流入环节给 PrivatBank 提供对称锁定。多账户并用很普遍——许多乌克兰人同时持有 PrivatBank 和 monobank
              卡，因此相关竞争指标不是客户数，而是钱包份额。

              战争期间，乌克兰银行业展现出异常强的韧性：没有发生银行挤兑，自 2023 年 2 月以来名义存款增长保持为正。这种稳定性是行业层面对新进入者冲击的护城河，但并不能让 monobank 与在位者区分开来。
