      - number: '5.3'
        title: 开放 API、开发者平台与技术基础设施
        blocks:
          - type: paragraph
            body: >-
              monobank 在 api.monobank.ua 运营公开文档化的开放 API（当前版本 250818）。个人用途 token 可在 API
              门户自助获取，无需申请审核，任何持卡人都能认证并读取账户数据。API 明确不向 16 岁以下客户开放；儿童账户数据只能通过父母的 token 访问。

              个人 API 暴露这些能力：客户资料和账户列表（每个 token 每 60 秒限调一次）、单次最多覆盖 31 天和 2,682,000 秒的账户流水，以及 Banka（储蓄罐）数据。公共端点无需认证，提供最多每
              5 分钟刷新一次的汇率，以及用于签名验证的公共 ECDSA key 端点。Webhooks 将实时交易事件推送到开发者提供的 URL；服务器在非 200 响应后于 60 秒和 600 秒重试，之后禁用
              hook。API 警告称未经授权的企业使用“可能导致制裁”，并以此强制多客户数据处理服务使用 provider-API 层。

              providers API（用于经开发者服务器路由客户数据的服务）和 acquiring API（用于商户支付流程）均有文档；但本次研究中 providers 端点返回 403 AccessDenied，说明个人
              API 层之外还有访问控制。acquiring API 文档可访问，覆盖完整错误分类、tokenization、3D Secure 和退款。

              Fintech-IT Group 的技术子公司包括：Fintech Band（Universal Bank 的核心 app 软件，主要收入贡献者）；ACDC Processing（支付运营商，获 Visa /
              MC / PCI-DSS 认证，受 NBU 认可）；Kilobyte1024（monobank 2.0 app 改版、国际和 B2B）；Shake-to-Pay（QR 方案、HoReCa 数字化——2021
              年收购 Expirenza、2023 年收购 TakeUsEat）；MOSST（支付运营商，2024 年从 Swiss CBH bank 收购）。截至 2025 年 11 月，Fintech-IT Group
              雇佣约 630 名专家，其中约 400 名 IT 专业人员，在 Kyiv 和 Dnipro 办公。2024 年一项学术研究确认 monobank app 在 2024 年下载量超过 10 million，与
              10.3M 用户数一致。2024 年乌克兰非现金卡交易按笔数占比达到 94.6%，总交易 8.65 billion 笔，构成 monobank 基础设施运行的宏观规模背景。
