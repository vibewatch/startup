          - type: callout
            title: Fintech Band 约 31% 的净利率验证轻资本技术运营商模型
            body: >-
              Fintech Band FY2024 报告净利率约 31%，结构上符合一家在银行内部运行、零网点基础设施的软件服务模型。如果可持续，这一利润率水平支撑更高的收入倍数，也验证 UMAEF 按约 11×
              FY2024 收入给出的 $1 billion 估值。关键不确定性在 FY2024 绝对下滑（利润 –63%）：若属一次性，利润率质量逻辑仍成立；若是结构性，下一个可获得的全年业绩需要重估这一估值。
