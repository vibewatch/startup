      - number: '3.2'
        title: 竞争对手画像 — 规模、资产和客户触达
        blocks:
          - type: paragraph
            body: >-
              PrivatBank 是 monobank 最关键的竞争参照。作为乌克兰资产规模最大银行（NBU 2026 年 6 月：UAH 916,892 million），PrivatBank 服务超过 19
              million 活跃客户——几乎是 monobank 10.3 million 注册用户的两倍。它是国有银行（2016 年 12 月国有化后由财政部 100% 持有）、具系统重要性，并被 NBU
              认定为偿付能力充足。截至 2026 年 6 月，其 Privat24 移动应用在 Google Play 的 1.67 million 条评价中获得 4.8 星，下载量超过 10
              million。PrivatBank 的实体基础设施——1,200+ 家网点、7,000+ 台 ATM 和 250,000+ 台 POS 终端——形成 monobank 无法复制的分发护城河。PrivatBank
              2024 年年度净利润达到 UAH 40.1 billion，产生大量留存资本用于持续投资。

              Oschadbank 是第二家国有银行，也是存款市场领导者。它拥有 UAH 510,545 million 资产和 1,150+ 家网点（乌克兰银行中最大网络），截至 2024 年底持有最大个人存款基础，达
              UAH 210 billion。2024 年，它在 eOselia 国家按揭项目中以 40% 份额领先，在车贷市场以 38% 份额领先，并实现创纪录的税前利润 UAH 18.6
              billion。Oschadbank 在前线地区（Donetsk、Sumy、Kherson、Kharkiv、Chernihiv）运营 5 个移动装甲银行单元，是唯一拥有此类网络的银行——展示出 monobank
              在结构上无法匹配的战时韧性。

              Raiffeisen Bank Ukraine（资产 UAH 265,488 million、权益 UAH 41,649 million、利润 UAH 2,038 million）和 OTP Bank
              Ukraine（资产 UAH 136,070 million、权益 UAH 27,446 million、利润 UAH 1,327 million）是主要外资银行竞争者。两者都是 NBU
              系统重要性银行，由欧洲银行集团持有（奥地利 Raiffeisen Bank International；匈牙利 OTP Group）。外资银行所有者的战略不确定性——尤其是 RBI
              公开表示考虑退出乌克兰——给其子公司带来潜在风险，也可能为 monobank 创造获客机会。

              Universal Bank 资产 UAH 215,582 million、利润 UAH 2,590 million，处于中上梯队——大于 OTP 和 Sense Bank，但约为 PrivatBank
              的四分之一。
