            body: >-
              Universal Bank 的 NBU 监管档案是银行层面财务数据的首要权威来源。截至 NBU 最近一次发布，Universal Bank 披露总资产 UAH 215,581.6 million（按 2026
              年 6 月 UAH/USD 约 44.9 的参考汇率，约 $4.8 billion）、总负债 UAH 187,132.8 million、权益 UAH 28,448.8 million、利润 UAH
              2,590.2 million。这些数字只反映银行实体，不包括 Fintech Band，也不包括任何 Fintech-IT Group 子公司。

              权益 / 资产比约 13.2%（UAH 28,448.8M ÷ UAH 215,581.6M），说明资本化程度中等，高于 NBU 最低资本要求；不过英文监管档案没有给出精确的风险加权资本充足率。年化资产回报率约
              1.2%，与乌克兰银行业平均水平相符：在高利率环境下，银行可从政府债券持仓赚取可观息差收益。Universal Bank 拥有 IVI-Rating 给出的 uaAAA 投资级国内信用评级，展望稳定（2026 年
              4 月重申），并被 NBU 归类为有偿付能力且具系统重要性。参与 Deposit Guarantee Fund 为零售存款人提供法定存款保险，是战时维持存款人信心的重要因素。

              这些是银行层面的指标，不是品牌层面的指标。UAH 215.6 billion 的资产基数反映 Universal Bank 整张资产负债表，其中包括 monobank 零售产品，也包括 monobank
              上线前遗留的企业与 SME 账簿。公开英文材料没有分拆 monobank 零售收入与 Universal Bank 其他业务线的数据。Universal Bank
              在官网按季披露乌克兰语法定报表，但没有提供国际投资者可获取、且经过独立审计的英文 IFRS 报表。
