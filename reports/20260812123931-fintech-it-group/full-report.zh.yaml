      - number: '4.5'
        title: 资本结构、充足性与战时银行业背景
        blocks:
          - type: paragraph
            body: >-
              Universal Bank UAH 28.4 billion（约 $634 million）的权益基础，相对于乌克兰战时银行业格局提供了可观资本缓冲。NBU
              将其归类为有偿付能力且具系统重要性，意味着该行满足并承担更高的资本充足率、流动性和恢复计划要求。IVI-Rating 给出的 uaAAA 国内信用评级（稳定，2026 年 4
              月）印证短期财务稳健；但这是乌克兰国内评级尺度，不能与 S&P、Fitch 或 Moody's 的国际评级直接比较。

              从行业层面看，VoxUkraine 分析确认，乌克兰银行业在全面战争爆发前的资本充足率约为风险加权资产的 21%，远高于 NBU 最低要求；到 2023 年 3 月，CAR
              已恢复到这一水平。不过，全行业不良贷款率在战前处于下降通道，自 2022 年 2 月以来持续上升，反映 NPL 确认递延和战争相关信贷损失，尤其集中在前线和被占领地区的抵押贷款与 SME
              敞口。银行对私营部门贷款实际值较战前下降约 30%，银行更偏好在较高 NBU 政策利率下持有低风险政府债券。Universal Bank 的具体 NPL 比率未在英文监管档案页披露。VoxUkraine
              还提示银行业暴利税考量，指出政府债券息差带来的高利润可能面对政策动作带来的财政负担。

              NBU 截至 2026 年 6 月 18 日将关键政策利率维持在 15%，自 2026 年 1 月以来未变。IMF 2025 年 11 月就一项 $8.1 billion、48 个月 EFF
              达成工作人员层面协议；乌克兰截至 2026 年 3 月拥有约 $54.8 billion 国际储备，约覆盖 5.7 个月进口，共同锚定宏观金融稳定。World Bank 估计未来十年乌克兰重建成本约 $588
              billion；任何对受战争影响抵押物和借款人有敞口的乌克兰银行，都将持续面对信用风险不确定性。

              Fintech-IT Group 的资本状况透明度较低。UMAEF 投资（Forbes Ukraine 估计约 $18.55 million，按 $1 billion 估值隐含约 1.9%
              股权）是一轮成长股权融资，资金分配给 SME 产品开发和扩张。Fintech-IT Group 或 Fintech Band 没有公开披露现金余额、烧钱速度或现金跑道指标。Fintech-IT Group 和
              Universal Bank 都释放过赴美国交易所 IPO 的意向，但没有确认时间表或申报安排。
