  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              乌克兰零售银行市场由一种战时结构塑造：国有银行——PrivatBank、Oschadbank 和已国有化的 Sense Bank——约持有行业净资产
              50%，提供一种私营和外资银行无法复制的隐性主权安全信号。在这一环境中，monobank（通过 JSC Universal Bank 运营）在三条战线上竞争：（1）与主导国有银行 PrivatBank
              争夺大众零售移动银行和支付；（2）与 Oschadbank 争夺存款、按揭和 SME 贷款，尤其是在 Oschadbank 实体覆盖是唯一银行选项的地区；（3）与外资银行子公司 Raiffeisen Bank
              Ukraine 和 OTP Bank Ukraine 争夺城市、数字熟练且国际流动性较强的客群。

              第四个竞争层级是 Sense Bank（前 Alfa-Bank Ukraine；2022 年俄罗斯全面入侵切断其俄罗斯母公司所有权后由国家控制）。它仍保留实体网点和存量客户关系，但最新 NBU 报告期利润仅
              UAH 372.6 million，而 PrivatBank 为 UAH 16 billion，显示结构性竞争疲弱。

              竞争分析边界限定在乌克兰零售和 SME 银行。全球 neobank（Revolut、Wise、N26）被明确排除：NBU 牌照要求和 UAH 转账限制，使它们无法向乌克兰居民提供 monobank
              的完整产品组合；它们最多只是跨境支付的部分替代品，而非本土银行替代方案。现状替代品——现金和沉睡的 Oschadbank 存折账户——随着 2024 年非现金支付份额达到 94.6% 而长期衰退。NBU
              BankID 系统 2024 年身份识别量从 42.9 million 翻倍到 87.7 million，确认数字开户基础设施已广泛可及。
