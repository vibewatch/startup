      - number: '2.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 非现金转移不可逆且具结构性
            body: >-
              2024 年乌克兰支付卡交易中 94.6% 为非现金，这不是战时异常，而是十年转型的结果；COVID-19 加速了它，战时必要性又把它固化。对 monobank
              而言，这意味着日常支付银行客户的总市场如今实际上等同于智能手机银行卡用户，而不是现金持有者。任何信贷复苏都会叠加在已数字化的支付基础上，而不是与现金竞争。
