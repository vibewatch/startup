      - number: '6.3'
        title: FOP / 个体企业主与 SME 渠道
        blocks:
          - type: paragraph
            body: >-
              FOP / 个体企业主客群以 “FOP mono” 品牌营销，是 monobank 商业差异化最强的增长目标。产品围绕速度和零直接成本设计：现有 monobank 消费者持卡人开户只需九次点击，最快公开纪录为
              13 秒。开户费、维护费、基于 IBAN 的转账和关联借记卡均为 UAH 0。通过转入持有人个人 monobank 账户，每月 UAH 50,000 以内免费提现。

              面向 FOP 用户的产品包包括 USD 和 EUR
              货币账户、用于业务线隔离的第二个格里夫纳活期账户、用于育儿假和病假工资发放的社会付款账户、按电话号码授权会计并最多支持十个关联联系人，以及面向桌面会计工作流的私有网页版后台。FOP 收单选项（“plata by
              mono”）提供 POS 终端、SoftPOS（手机即终端）、面向网站和支付链接的互联网收单，以及 QR 立牌方案。乌克兰发行卡 1.3% 的商户佣金和 24 小时结算，对微型企业主和小型线上商户有吸引力。

              UMAEF 新闻稿和 Scroll Media CEO 访谈都提到，monobank 技术“让乌克兰数万家中小企业（SMEs）能够顺畅接受数字支付”。Universal Bank CEO Iryna
              Starominska 提出的 2026 年 450,000 个个体企业主目标，是唯一公开量化里程碑；当前 FOP 账户的中间数量未披露。乌克兰数字银行学术研究印证了 SME 数字化趋势：2024 年，企业家在
              Affordable Loans 5-7-9% 计划下获得超过 16,000 笔贷款，总额超过 UAH 62 billion，显示 monobank 正进入的数字 SME 融资市场规模。monobank 的
              FOP 账户在乌克兰整体 FOP 银行市场中的份额没有公开数据。
