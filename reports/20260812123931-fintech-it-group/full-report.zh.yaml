      - number: '6.6'
        title: 留存证据、反向信号与证据缺口
        blocks:
          - type: paragraph
            body: >-
              monobank 的公开留存证据全部是代理指标。唯一能三角验证的持久参与指标包括：Banka 的 1.6 million 月度捐赠者数（意味着一部分高投入用户有重复行为）；910,000 条 App Store
              评分和 1.13 million 条 Google Play 评论（意味着用户参与度足以自愿为 app 评分）；以及 2025 年前九个月 UAH 8.5 trillion
              交易额（意味着每账户交易强度较高）。这些都不是直接留存指标。

              关键反向证据缺口是，在本研究审阅的任何公开来源中，都完全没有披露 NRR、GRR、流失率、月活用户率或队列留存曲线。UMAEF 新闻稿和 Interfax Ukraine 文章称 monobank
              拥有乌克兰银行业最高 NPS，但 NPS 测量的方法、样本量和审计机构均未公开，无法独立验证。Universal Bank 的 NBU 监管档案显示财务稳健（UAH 215.6 billion 资产、UAH
              28.4 billion 权益、2024 年 UAH 2.59 billion 利润），但没有把 monobank 特定的存款留存、卡注销率或活跃卡数量从更广义的 Universal Bank 组合中单独拆出。

              另一个反向信号是战时人口结构变化：自 2022 年 2 月以来，数百万乌克兰人在境内流离失所或移居海外，monobank
              注册用户中一部分可能处于休眠状态，或已把主要银行关系转向所在国本地机构。乌克兰数字银行学术研究确认 monobank 2024 年下载量超过 10
              million，与注册用户数一致；但下载数不能证明活跃使用。VoxUkraine 对乌克兰银行业战时韧性的分析指出，存款增长截至 2024 年中期仍是“名义”增长，并部分由军人工资流入驱动；这可能解释
              monobank 的一部分获客和交易量，而非有机零售采用。Banka 捐赠活动集中在国防和人道主义领域，也带来战时依赖风险：如果停火削弱军事筹款的紧迫性，1.6 million
              月度捐赠者数及相应留存回路可能减弱。
