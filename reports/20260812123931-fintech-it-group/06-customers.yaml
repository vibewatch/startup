  - id: retail-consumer-segment
    title: Mass Retail Consumers, Credit Users, and Family Accounts
    body: >-
      The mass retail consumer segment is monobank's largest and most public-facing segment.
      Onboarding is designed for frictionless entry: after downloading the app, a new user chooses
      among Diia (Ukraine's government digital-ID app), an ID card, a biometric passport, or a foreign
      passport for KYC verification. A virtual Mastercard card is issued immediately; a physical card
      is delivered via Nova Poshta on request. The all-time registration record stands at 99 seconds
      via Diia. All-digital KYC and zero-fee card issuance remove the principal barriers to entry
      associated with traditional branch-based banking.

      Consumer credit is offered in three forms: "Pokupka Chastynahy" split payments at participating
      merchants (including KTC, Citrus, MOYO, and Foxtrot), with zero interest cost to the consumer
      (merchant-funded); the global installment plan usable at any merchant including AliExpress and
      Amazon; and "Do Zavtra" (Until Tomorrow) micro-loans disbursed in minutes for immediate needs.
      The stated maximum credit limit is UAH 200,000. Consumer credit users represent a distinctly
      higher-value segment with recurring loan repayment behavior, but no credit penetration rate among
      the registered user base has been disclosed publicly.

      Government bonds (OVDPs) in UAH and foreign currencies are sold in-app with income-tax exemption
      for retail investors and explicit military-support messaging. This product segment serves financially
      engaged users who treat monobank as a full savings and investment platform. Currency accounts in
      USD and EUR serve diaspora and internationally mobile users, reinforced by version 8.16's removal
      of SWIFT fees for both sending and receiving international payments.

      The kids' card and shared family account feature addresses the family and youth segment, providing
      parental controls on spending categories and shared visibility into a child's account. The Diia.Card
      for national support programs extends coverage to government program recipients. These features
      collectively broaden the addressable consumer base beyond a core urban, tech-savvy demographic—but
      no publicly available data on segment-level account counts exists for any of these sub-categories.
    claimRefs:
