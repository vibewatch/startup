  - id: banka-donation-community
    title: Banka Fundraising Platform and Donation Community
    body: >-
      The Banka (literally "jar") feature is one of the most distinctive customer segments in monobank's
      portfolio and one of the most-cited data points in public communications: more than 1,300 charitable
      foundations have been connected to the Banka platform; more than 1.6 million people donate monthly
      via Banka; and total cumulative donation volume through Banka has reached UAH 100 billion as of
      2026. These three metrics appear verbatim in both the Ukrainian-language and English-language
      monobank home pages, making them the only quantified user engagement numbers monobank publishes
      with sub-segment granularity.

      Banka operates as savings and fundraising "jars" within the monobank app. Individual users create
      jars for personal savings goals or share jar links publicly for charitable campaigns. Foundations
      connect to the platform as verified recipients, enabling recurring monthly donations at the click
      of an existing monobank user. The charitable-foundation connectivity (1,300+ foundations including
      military, humanitarian, and civic organizations) and the monthly donation volume (1.6 million active
      monthly donors) together create a civil-society engagement loop that materially raises the cost of
      switching away from monobank for engaged donors. This is arguably the strongest retention signal
      available from public data—since a Banka donor who has set up recurring donations to a foundation
      must actively cancel those donations before departing.

      The total donation volume (UAH 100 billion) provides a transaction-intensity anchor for the platform.
      At 1.6 million monthly donors and the historical exchange rate, this implies average cumulative
      donations per donor well into five-digit hryvnia territory—far above a casual use pattern. The Banka
      platform also serves as a direct wartime community signal: military-fundraising jars are explicitly
      marketed, and the "Raise funds for the Armed Forces of Ukraine" messaging appears on the app's
      official App Store listing. No independent audit of foundation-level disbursements or donor
      satisfaction with foundation fund-use has been identified in this research.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU026
      - CU027
      - CU028
      - CU029
    tableRefs:
      - TU004

  - id: app-experience-reviews
    title: App Store Ratings, UX Reviews, and Service Experience
    body: >-
      monobank's App Store rating of 4.9 stars from 910,000 ratings makes it the highest-rated banking
      application in Ukraine by review volume. The Google Play listing as of June 2026 also shows 4.9
      stars from 1.13 million reviews—indicating consistent cross-platform sentiment and a user base that
      actively engages with the review mechanism. Version 8.16, published on June 15, 2026 (six days
      before the research date), removed SWIFT fees for both sending and receiving international payments
      for all user types, demonstrating active product iteration. The developer (Universal Bank | Monobank)
      actively responds to user reviews in Google Play, a visible community engagement signal.

      Adverse customer signals in the top reviews are specific and meaningful for diligence purposes.
      Reviewer John Smith (Google Play, June 5, 2026) explicitly downgraded monobank from a 5-star to a
      3-star rating because of: (1) the absence of proper two-factor authentication using authenticator
      apps (only SMS/in-app 2FA is available), and (2) the absence of a session-visibility feature showing
      recent logins. This review was marked helpful by other users and reflects a security UX gap that
      security-conscious users—particularly IT professionals and FOP users handling business transactions—
      would identify as a meaningful deficiency. Reviewer Sergey Surazhskyi (January 2026) also gave 3
      stars, criticizing the forced migration to the monobank 2.0 UI design with no option to retain the
      old interface, while noting that monobank's transfer limits and fees remain "acceptable" compared to
      competitors—including a pointed reference to CEO Gorokhovskyi's public position against Revolut.

      Customer support is available 24/7 via messenger and phone, which the company describes as its
      "customer care team." The NBU banking sector review notes Ukraine's banking sector maintained
      digital service continuity throughout the wartime period, corroborating monobank's claimed service
      availability. No publicly available metric for complaint resolution time, first-contact resolution
      rate, or escalation volume has been identified.
