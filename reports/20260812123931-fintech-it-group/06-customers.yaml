  - id: FU004
    title: Retention / Repeat Cohort — Estimated User Engagement Proxies by Segment
    type: cohort
    layout: standard
    summary: >-
      No actual cohort retention data is publicly available. Proxy estimates are derived from Banka
      monthly donor count stability, app store rating persistence, and typical neobank industry patterns;
      all cells marked null indicate no proxy available for that combination.
