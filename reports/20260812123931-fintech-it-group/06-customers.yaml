  - id: fop-business-segment
    title: FOP / Individual Entrepreneur and SME Channel
    body: >-
      The FOP/individual entrepreneur segment—marketed under the "FOP mono" brand—is monobank's most
      commercially differentiated growth target. The product is designed around speed and zero direct
      cost: account opening for an existing monobank consumer card holder requires nine clicks, with the
      fastest on-record at 13 seconds. Opening fee, maintenance fee, IBAN-based transfers, and the
      linked debit card are all UAH 0. Cash withdrawal is free up to UAH 50,000 per month via transfer
      to the holder's personal monobank account.

      The product bundle for FOP users includes USD and EUR currency accounts, a second hryvnia current
      account for business-line segregation, a social-payments account for parental leave and sick-pay
      disbursements, accountant delegation by phone number supporting up to ten linked contacts, and a
      private web cabinet for desktop accounting workflows. The FOP acquiring option ("plata by mono")
      provides POS terminals, SoftPOS (phone-as-terminal), internet acquiring for websites and payment
      links, and a QR-stand solution. The 1.3% merchant commission for Ukrainian-issued cards and the
      24-hour settlement make it attractive to microentrepreneurs and small online merchants.

      The UMAEF press release and the Scroll Media CEO interview both note that monobank's technology
      "empowers tens of thousands of small and medium-sized enterprises (SMEs) in Ukraine to accept
      digital payments seamlessly." Universal Bank CEO Iryna Starominska's stated 2026 target of 450,000
      individual entrepreneurs is the only publicly quantified milestone; no intermediate current count
      of FOP accounts has been disclosed. The academic study on Ukrainian digital banking corroborates
      the SME digitization trend: in 2024, entrepreneurs received more than 16,000 loans worth over UAH
      62 billion under the Affordable Loans 5-7-9% programme, illustrating the scale of the digital SME
      financing market monobank is entering. The share of monobank's FOP accounts in the overall FOP
      banking market in Ukraine is not publicly available.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU010
      - CU024
      - CU025
      - CU049
      - CU050
