callouts:
  - calloutType: strength
    title: Banka Fundraising as a Retention Moat
    body: >-
      The 1.6 million monthly Banka donors and UAH 100 billion in cumulative donations represent a
      wartime-native retention loop that traditional banks cannot easily replicate. A user who has set
      up recurring donations to military or humanitarian foundations incurs real behavioral switching
      costs—not just financial ones. This community-driven engagement is monobank's most distinctive
      qualitative differentiator from a customer durability standpoint.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU026

  - calloutType: risk
    title: Active-User Rate Is Unknown and Material
    body: >-
      monobank reports 10.3 million registered clients but does not disclose monthly active users,
      daily active users, or card utilization rates. At typical neobank activation rates of 60-75%,
      between 2.6 and 4.1 million registered accounts may be dormant or marginally active. Wartime
      displacement of 6-8 million Ukrainians could further suppress the active-user ratio. This gap
      means the "10.3M" headline obscures the true monetizable customer base.
    claimRefs:
      - CU001
      - CU039
      - CU040
      - CU051
      - CU052

  - calloutType: risk
    title: Security UX Gap Identified by Power Users
    body: >-
      Two distinct Google Play reviews from June 2026 and January 2026 give monobank 3 stars (down from
      5) for the absence of authenticator-app 2FA, lack of session-visibility controls, and forced
      v2.0 UI migration. These are meaningful signals from a security-conscious and IT-professional
      user cohort—precisely the early-adopter segment monobank needs to retain in the FOP/business
      growth phase. If left unaddressed, these complaints could impair monobank's conversion of
      security-aware small business users.
    claimRefs:
      - CU030
      - CU031
      - CU032

