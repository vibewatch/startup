      All values are rough proxy estimates; no actual cohort data has been published by monobank or
      Universal Bank. Mass retail estimate derived from typical neobank 12-month retention benchmarks
      (60-70% industry range) and monobank's exceptionally high app rating as a positive signal.
      Banka donor estimate uses 1.6M stable monthly figure as an anchor with assumed natural lapse.
      FOP estimate uses typical business banking industry patterns. Credit product estimate assumes
      loan-repayment cycles enforce usage through Year 1. Year 2+ retention data is unavailable from
      any public source and is therefore excluded. This cohort is illustrative only and should not
      be used for financial modeling.
