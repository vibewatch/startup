  evidenceGaps:
    - type: missing-source
      severity: material
      topic: active users
      missingEvidence: Monthly active user (MAU), daily active user (DAU), and active card utilization rate broken out from 10.3M registered clients.
      whyItMatters: The registered-to-active conversion rate determines the true monetizable customer base; without it the headline 10.3M count overstates engaged customers by an unknown margin.
      diligencePath: Request management disclosure of MAU and card-activation rate by segment; reference peer neobank benchmarks (Revolut, N26) for context.
      relatedQuestionRefs:
        - QU017
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: Cohort retention curves, churn rate, NRR/GRR for any customer segment; NPS methodology (sample, auditor, trend).
      whyItMatters: Without retention data, durability of monobank's growth cannot be assessed; high registered-user count could mask significant churn.
      diligencePath: Request from Universal Bank management; examine Universal Bank regulatory filings with NBU for any disclosed retention metrics.
      relatedQuestionRefs:
        - QU017
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: material
      topic: FOP accounts
      missingEvidence: Current FOP/individual entrepreneur account count and FOP-segment revenue contribution.
      whyItMatters: FOP is monobank's stated growth priority for 2026; without current baseline the 450,000 target cannot be contextualized.
      diligencePath: Request management FOP account count; cross-reference with NBU supervision data on entrepreneur accounts at Universal Bank.
      relatedQuestionRefs:
        - QU010
      relatedTableRefs:
        - TU003
        - TU005

    - type: missing-source
      severity: minor
      topic: customer support
      missingEvidence: Complaint resolution time, first-contact resolution rate, escalation rate, and any NBU-filed complaint statistics.
      whyItMatters: monobank markets its support as best-in-class; adverse reviews cite unresolved issues; no metric backs either claim independently.
      diligencePath: Request support SLA data from management; check NBU's consumer protection complaint database for bank-specific complaint volume.
      relatedQuestionRefs:
        - QU018

    - type: missing-source
      severity: minor
      topic: Banka donations
      missingEvidence: Individual foundation names connected to Banka platform and foundation-level disbursement audit.
      whyItMatters: The 1,300+ foundation count is a key product proof point; without a verifiable list or audit, the count cannot be independently confirmed.
      diligencePath: Request foundation registry from monobank; search charity watchdog databases in Ukraine for monobank-connected foundations.
      relatedQuestionRefs:
        - QU002
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: material
