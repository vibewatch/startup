      page, UMAEF press release at 9.9M Sep-2025). SAM estimate (16M) is derived from Ukraine smartphone
      and payment-card penetration data referenced in NBU statistics and academic research. Active
      transacting users (~7M) is a rough 70% activation-rate proxy common to neobanks — not disclosed by
      monobank. Banka donor count (1.6M) is directly source-backed. Credit users (~2M) are an illustrative
      estimate only; actual breakdown not publicly available. FOP target (450K) is a CEO-stated forward
      target, not a current count.
