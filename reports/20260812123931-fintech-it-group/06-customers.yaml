  - id: retention-gaps
    title: Retention Evidence, Adverse Signals, and Evidence Gaps
    body: >-
      monobank's publicly available retention evidence is entirely proxy-based. The only durable
      engagement metrics that can be triangulated are: the Banka 1.6 million monthly donor count (which
      implies recurring behavior by a committed subset of users); the 910,000 App Store ratings and
      1.13 million Google Play reviews (which imply strong enough engagement for users to voluntarily
      rate the app); and the UAH 8.5 trillion in transactions in the first nine months of 2025 (which
      implies high per-account transaction intensity). None of these serve as direct retention metrics.

      The key adverse evidence gap is the complete absence of disclosed NRR, GRR, churn rate, monthly
      active user rate, or cohort retention curves in any public source reviewed. monobank claims the
      highest NPS in Ukraine's banking sector per the UMAEF press release and Interfax Ukraine article,
      but the methodology, sample size, and auditing firm for the NPS measurement are not publicly
      documented—making independent verification impossible. Universal Bank's NBU supervisory profile
      shows solid financials (UAH 215.6 billion in assets, UAH 28.4 billion equity, UAH 2.59 billion in
      2024 profit) but does not break out monobank-specific deposit retention, card deactivation rates,
      or active card counts separately from the broader Universal Bank portfolio.

      An additional adverse signal is the wartime demographic shift: with millions of Ukrainians displaced
      internally or having emigrated abroad since February 2022, a portion of monobank's registered user
      base may be dormant or have shifted primary banking to local institutions in host countries. The
      Ukraine-based digital banking academic study confirms monobank downloads exceeded 10 million in
      2024, which aligns with the registered user count—but download count does not confirm active usage.
      VoxUkraine's analysis of Ukraine's banking sector wartime resilience notes that deposit growth was
      "nominal" through mid-2024 and driven partly by military salary inflows, which may explain some of
      monobank's client acquisition and transaction volume rather than organic retail adoption. The
      concentration of Banka donation activity in the defense and humanitarian sectors also creates a
      wartime-dependency risk: if ceasefire conditions reduce the urgency of military fundraising, the
      1.6 million monthly donor count and associated retention loop could weaken.
    claimRefs:
      - CU039
      - CU040
      - CU041
      - CU051
      - CU052
      - CU053
      - CU054

