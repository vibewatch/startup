figures:
  - id: FU001
    title: Customer Journey Map — monobank Segment Paths from Discovery to Engagement
    type: journey-map
    layout: wide
    summary: >-
      monobank customer journeys start with mobile app discovery and frictionless KYC, then split into
      retail depth (credit, deposits, OVDP), FOP/business banking, and Banka community engagement paths,
      each with distinct retention loops.
    data:
      nodes:
        - id: discovery
          label: Discovery & Download
          detail: >-
            App discovered via word-of-mouth, app store search, or social media. 4.9-star rating and 1M+
            reviews lower the try-it barrier. Zero-fee card issuance is the hook.
          tone: positive
        - id: kyc
          label: KYC & Card Issuance
          detail: >-
            User completes Diia, ID card, passport, or foreign passport KYC in-app. Record: 99 seconds
            via Diia. Virtual Mastercard issued immediately; physical card via Nova Poshta delivery.
          tone: positive
        - id: first-use
          label: First Transactions & Activation
          detail: >-
            Peer-to-peer transfer, bill payment, or first card purchase. Purr notification and monocat
            avatar personalize the UX. Cashback categories and spending analytics reinforce usage.
          tone: positive
        - id: depth
          label: Product Depth (Retail)
          detail: >-
            Retail depth path: consumer credit (installment, "Do Zavtra"), OVDP government bonds,
