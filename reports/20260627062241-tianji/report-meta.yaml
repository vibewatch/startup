companyProfile:
  summary: "Tianji (Guangdong Tianji Intelligent System Co., Ltd.) is a Dongguan-based Chinese robotics company incorporated on 2015-05-18 and built out of Shenzhen Everwin Precision's automation business. It sells a broad automation catalog spanning force-controlled Marvin dual-arm systems, collaborative robots, SCARA and six-axis robots, controllers, and related services, with a newer emphasis on embodied-intelligence infrastructure for humanoid OEMs. Public sources show real deployment history in legacy factory automation and recent momentum in dual-arm humanoid-adjacent products, including more than 2,000 force-controlled dual-arm deliveries during a four-month period in 2025 and reported first-quarter 2026 orders above 10,000 units across 45 global humanoid or embodied-AI customers. Tianji's May 2026 RMB1 billion Series B and B+ financing led by GL Ventures and Meituan Strategic Investment confirms strong investor appetite, but standalone revenue, margin, burn, and preference-stack disclosure remains limited."
  foundedDate: "2015-05-18"
  founders:
    - name: Chen Xi
      role: Founder, chairwoman, and legal representative
      claimRefs: [CO011, CO013]
  foundingLocation: Dongguan, Guangdong, China
  headquarters: Dongguan, Guangdong, China
  productSummary: "Force-controlled dual-arm robot arms, collaborative robots, six-axis and SCARA industrial robots, controllers, software, accessories, and service/support for precision assembly, factory automation, and humanoid-robot manipulation use cases."
  customerFocus: "Chinese and global industrial manufacturers plus humanoid-robot and embodied-AI OEMs needing robot arms, automation cells, and manipulation infrastructure."
  businessModel: "Product sales plus system integration, accessories, software/support, and after-sales service for industrial and humanoid-adjacent robotics deployments."
  stage: Series B
  fundingStatus: "RMB1 billion of Series B and B+ financing completed in May 2026 at a publicly reported roughly RMB8-10 billion post-money valuation, with proceeds earmarked for R&D, mass production, and global sales/service expansion."
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO003, CO004, CO007, CO018, CO022, CO023, CO027, CO029, CO030]
summary:
  headline: "Tianji appears to be a real and scaling Chinese robotics supplier with credible dual-arm productization, legacy industrial deployments, and top-tier strategic funding, but the May 2026 RMB8-10 billion valuation still outruns the public financial evidence needed to underwrite it confidently."
