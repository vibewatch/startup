  topStrengths:
    - >-
      Real installed-base evidence across legacy factory automation plus a newer reported 45-OEM humanoid / embodied-AI
      order cohort gives Tianji stronger demand proof than many concept-stage robotics peers.
    - >-
      The Marvin family and broader catalog show standardized products rather than a single demo unit, while Everwin
      linkage likely improves manufacturing, supply-chain access, and scale-up execution.
    - >-
      The May 2026 syndicate combines top-tier venture capital and strategic capital (GL Ventures, Meituan, Tencent,
      Gaorong, Luminous, GGV/Granite), signaling high conviction around Tianji's role in embodied-intelligence
      infrastructure.
  topRisks:
    - >-
      Public sources do not disclose Tianji standalone revenue, realized ASPs, gross margin, cash balance, or backlog
      conversion, making the current valuation difficult to ground in financial performance.
    - >-
      Order momentum and customer-count claims are strong but still leave material unknowns on concentration,
      cancellation risk, repeat buying, and whether humanoid OEM demand converts into durable revenue.
    - >-
      Safety/liability, export-control exposure, aggressive competition, and residual dependence on Everwin's
      manufacturing and governance ecosystem could all impair scale-up if quality or market conditions weaken.
  unresolvedGaps:
    - No standalone Tianji revenue bridge, gross margin, burn, runway, or audited cash disclosure is public.
    - >-
      Round terms beyond amount and investors remain undisclosed, including liquidation preferences, board rights,
      anti-dilution protections, and any secondary component.
    - >-
      Public sources do not resolve exact current shareholding, headcount, or whether post-money valuation should be
      read as roughly RMB8 billion or nearly RMB10 billion.
    - Customer concentration, renewal rates, backlog aging, and realized ASP by product line are not publicly disclosed.
