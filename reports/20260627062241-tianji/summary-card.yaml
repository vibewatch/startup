summary:
  headline: >-
    Tianji appears to be a real and scaling Chinese robotics supplier with credible dual-arm productization, legacy
    industrial deployments, and top-tier strategic funding, but the May 2026 RMB8-10 billion valuation still outruns the
    public financial evidence needed to underwrite it confidently.
