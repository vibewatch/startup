  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Tianji-only top-customer revenue share, backlog share, cancellation history, and pilot-to-production conversion by named OEM.
    whyItMatters: Group-level concentration data cannot prove whether Tianji itself is diversified or dangerously dependent on one or two embodied-AI customers.
    diligencePath: Request a 2025 and YTD 2026 revenue-plus-backlog concentration schedule by top ten customer and by vertical.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: field-service-and-warranty
    missingEvidence: Warranty reserve policy, return-material-authorization data, MTBF methodology, incident log, and field-service SLA performance by region.
    whyItMatters: Public support promises do not prove that Tianji can safely sustain a 10,000-unit-class deployment base without reputational or liability spillover.
    diligencePath: Obtain monthly warranty claims, incident severity matrix, spare-parts fill rate, and regional response-time reporting.
    relatedQuestionRefs:
    - QR018
    - QR030
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: parent-support-and-guarantees
    missingEvidence: Current Tianji debt schedule, intercompany balances, bank covenant package, and any ongoing or side-letter support commitments from Everwin.
    whyItMatters: Historical guarantees prove the parent once mattered financially, but investors cannot tell from public evidence whether that dependence has truly ended.
    diligencePath: Request all outstanding loan agreements, guarantee documents, and intercompany payable/receivable schedules as of the latest month end.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: product-liability-insurance
    missingEvidence: Current product-liability insurance, recall governance, customer indemnity terms, and escalation ownership for safety incidents.
    whyItMatters: The most thesis-breaking downside scenario is a safety or field-quality event, and the public record does not show how that downside is contractually or financially contained.
    diligencePath: Review policy schedules, broker summary, standard customer MSA indemnities, and the incident-response playbook signed by legal and quality leaders.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: supplier-bom-origin
    missingEvidence: Component-level supplier list, single-source flags, U.S.-origin content, and substitute qualification status for controllers, compute, sensors, encoders, and reducers.
    whyItMatters: Export controls and supplier outages can only be underwritten if the BOM origin and alternate sourcing paths are known at a granular level.
    diligencePath: Run a BOM-origin and ECCN review for the top ten costed components in Marvin and related force-control products.
    relatedQuestionRefs:
    - QR012
    - QR015
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: minor
    topic: litigation-docket-detail
    missingEvidence: Full docket, counterparty names, amounts in dispute, case posture, and any labor, IP, or acceptance themes underlying the visible filing and hearing counts.
    whyItMatters: The headline counts establish that disputes exist, but investors still need to know whether the pattern is routine contract friction or a repeat-operational-control problem.
    diligencePath: Pull the underlying docket entries from registry and court databases and classify them by case type and business impact.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR001
