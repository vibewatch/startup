- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Safety / liability
    - Recordable field incident, customer shutdown, recall, or regulator inquiry
    - One material injury event, multi-site deployment stop, or uninsured product-liability claim
    - Pause investment and require root-cause, CAPA, and insurance review before proceeding.
  - - Order-conversion quality
    - Backlog-to-revenue bridge and cash collection
    - If 10,000+ order rhetoric is not matched by conversion, aging, and cash collection evidence within two quarters
    - Treat growth claims as promotional; rebase valuation on delivered and paid units only.
  - - Parent dependence
    - Related-party share of revenue, purchases, rent, utilities, and guarantees
    - Any renewed guarantee support or related-party volume that remains strategically irreplaceable
    - Reclassify governance independence as weak and demand structural remedies.
  - - Customer concentration / cancellations
    - Top-account share, pilot-to-production conversion, cancellation rate
    - If one account exceeds 20% of Tianji revenue or a top OEM slips materially without replacement demand
    - Move the thesis from platform supplier to concentrated project vendor.
  - - Export-control disruption
    - Denied-party hit, license denial, or critical component ECCN escalation
    - Any blocked shipment, unavailable U.S.-origin input, or forced redesign on critical controller, compute, or sensor path
    - Cut international scaling assumptions and raise required return.
  - - Working-capital stress
    - Inventory days, write-offs, receivable days, and operating cash flow
    - If inventory days and write-downs rise while operating cash flow stays negative through scale-up
    - Assume margin compression and additional financing need before profitability.
  notes: These are investment controls, not management goals. The thresholds are designed to force a thesis review before valuation momentum obscures operational deterioration.
