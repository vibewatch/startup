chapter:
  number: 7
  title: Risks
  summary: 'Tianji has real product and demand momentum, but the underwriting risks are concentrated in four places: safety/liability around force-controlled dual-arm deployments, residual dependence on Everwin and its manufacturing ecosystem, customer and working-capital fragility as order claims outrun disclosed financials, and geopolitics that can tighten access to U.S.-origin AI or automation inputs just as Tianji localizes overseas. None of those risks is fatal today, but several are thesis-breaking if they combine with weak order conversion or a field-quality incident.'
sections:
- id: severity-ranked-risk-outlook
  title: Severity-ranked risk outlook and investment implication
  body: 'The highest-severity risks are not the headline fundraising or valuation debates; they are the risks that can break conversion, margin, or insurability after Tianji has already committed to scale. First is safety and product-liability exposure. Tianji is selling force-controlled dual-arm systems into human-shared industrial and quasi-service environments, and its own product and launch materials emphasize torque sensing, compliant control, overload tolerance, and synchronized dual-arm motion. Those are strengths, but they also mean a field failure would be measured against current Chinese robot-safety standards and against rising buyer expectations for industrial-grade collaborative performance. Second is residual Everwin dependence. Everwin has diluted from control to a large shareholder position, yet public filings still show related-party transactions, historical guarantee support, shared industrial DNA, and continuing manufacturing and customer adjacency. Third is conversion
    quality: Tianji publicly claims 2,000 plus 2025 deliveries and 10,000 plus Q1 2026 orders, while the closest hard financial anchors remain a lossmaking 2023 subsidiary snapshot and parent-level working-capital strain. Fourth is customer, market, and geopolitical fragility. The embodied-AI market is attracting capital rapidly, incumbents are flagging aggressive pricing and project delays, and U.S. export-control tightening around advanced AI and dual-use technology raises the chance that critical inputs or overseas go-to-market motions become harder just as Tianji pushes into North America. The practical implication is that this company can justify continued diligence, but only with milestone-based underwriting: safety, order conversion, related-party governance, and support-network readiness need to clear before the 2026 valuation can be treated as investable rather than aspirational.'
