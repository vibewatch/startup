- id: operational-manufacturing-and-dependency
  title: Operational, manufacturing, and dependency risk
  body: 'Operationally, Tianji looks more credible than a prototype-only embodied-AI startup, but scale pressure is now obvious in the public record. Company and media sources say the post-2026 financing plan is to raise automation rate, first-pass yield, and localized overseas support while serving 45 global humanoid and embodied-AI customers and pushing 10,000-unit class delivery capacity. That wording is revealing: it describes capabilities that are still being scaled, not a fully mature operating system already in place. The manufacturing base is also less autonomous than the marketing suggests. Official materials explicitly reference a premium global supply chain, cloud-based traceability, shared Yaskawa supply-chain systems, and Everwin precision-processing support. Those ties can improve ramp speed and quality, but they also increase dependence on a wider ecosystem that Tianji does not fully control. Parent-level disclosures reinforce the operational risk. Everwin’s HKEX proof shows
    large inventories, rising inventory impairment, large receivables, and explicit risk-factor language around excess stock, delayed collections, and missed deliveries. Even if those figures are group-level rather than Tianji-only, they show the kind of working-capital burden that accompanies fast hardware scaling. The result is a classic robotics execution risk: Tianji may win orders faster than it hardens yield, service response, spare-part logistics, and field reliability. If that happens, the order book becomes a source of quality escapes and reputation damage instead of a moat.'
