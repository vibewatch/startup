    title: Market Definition — Included and Excluded Spend
    columns:
      - Segment / Category
      - Included Spend
      - Excluded Spend
      - Buyer / Payer
      - Relevance to Tianji
    rows:
      - - Force-controlled collaborative arms
        - Robot arm, controller, safety stack, force sensing, simple end effectors for shared-space manipulation
        - High-speed fenced cells where force compliance is not required
        - Plant automation engineering / manufacturing capex
        - Core today; directly matches Pilot, Marvin, and related force-control positioning
      - - Dual-arm and humanoid manipulator modules
        - Dual-arm robot bodies, wrists, torque-sensing joints, dexterous end-effector integration
        - Full humanoid software-stack value not tied to physical manipulation hardware
        - Embodied-AI OEMs, labs, advanced manufacturing teams
        - Core adjacency; Marvin pages explicitly target dual-arm and humanoid scenarios
      - - Industrial embodied-intelligence hardware
        - Hardware platforms for AI training, vision, force control, and mobile manipulation in factories
        - Pure foundation-model software and consumer humanoid entertainment deployments
        - Innovation budget, automation lab budget, advanced manufacturing capex
        - Strategic expansion lane if prototype demand converts into production hardware orders
      - - Flexible workcells in electronics / auto components / battery
        - Integration spend for compact assembly, test, gluing, inspection, screwdriving, palletizing, machine tending
        - Full line rebuilds around heavy-payload robots or non-robot hard automation
        - Plant manager, process engineering, procurement
        - Most likely near-term industrial demand pool based on IFR, A3, Estun, UR, and Flex evidence
      - - Service / lab / education robotics adjacency
        - Research rigs, lab automation, diagnostics, education, smart-retail or food-service cobot cells
        - Generic service robots without manipulation or force-control needs
        - R&D, teaching-lab, innovation, or operating budget
        - Useful for early revenue and data generation but lower valuation quality than repeat factory programs
    notes: "Boundary reflects Tianji's own product positioning plus third-party category definitions. Included spend is narrower than all industrial robots and broader than a single cobot-arm SKU because force-control deployments often bundle sensing, software, and integration."
