callouts:
  - calloutType: strength
    title: China-Centered Demand Is a Real Tailwind
    body: >
      IFR and MIR both point in the same direction: China is the largest automation geography in the
      world and also the largest single cobot market. That gives Tianji a large home-market demand
      pool in exactly the electronics, automotive, battery, and general-manufacturing sectors where
      collaborative automation is broadening.
    claimRefs:
      - CM016
      - CM020
      - CM021
      - CM023

  - calloutType: risk
    title: Public TAM Figures Disagree Too Much to Treat as a Single Number
    body: >
      The market is clearly growing, but the public size estimates are not interchangeable. For 2025
      and 2026 alone, fetched sources span USD 1.42 billion, USD 2.28 billion, USD 2.31 billion,
      and USD 2.80 billion. Investors should underwrite Tianji against deployment conversion and
      product-market fit, not against a polished but fragile headline TAM.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014

  - calloutType: insight
    title: Tianji Sits Between Classic Cobots and Embodied-AI Infrastructure
    body: >
      Tianji's dual-arm force-control positioning matters because it overlaps two spending buckets at
      once: practical collaborative automation and the newer embodied-intelligence hardware buildout.
      That can raise strategic relevance even before the dual-arm subset is cleanly measurable as a
      standalone public market.
    claimRefs:
      - CM002
      - CM004
      - CM024
      - CM025
      - CM044

  - calloutType: recommendation
    title: Ask for Conversion Evidence, Not Just Prototype Momentum
    body: >
      The key diligence step is to request customer-level proof of industrial conversion: paid pilots,
      repeat orders, ASP by vertical, deployment-to-production cycle length, and the revenue split
      between labs, embodied-AI developers, and scaled factories. Public sources are strong on market
      direction and weak on Tianji's realized commercialization quality.
    claimRefs:
      - CM036
      - CM041
      - CM049
      - CM057

