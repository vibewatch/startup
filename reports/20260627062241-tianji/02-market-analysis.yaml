  claims:
    - id: CM001
      statement: "Tianji's official English and Chinese home pages position the company around force-controlled collaborative robots, robot accessories, and intelligent-system solutions rather than around generic heavy industrial robots."
      type: company-claimed
      topic: company-market-boundary
      sourceRefs: [SM001, SM002, SM003]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM001]
    - id: CM002
      statement: "The Marvin product family is explicitly presented for research, commercial, quasi-industrial, dual-arm, and humanoid-robot scenarios."
      type: company-claimed
      topic: dual-arm-positioning
      sourceRefs: [SM004, SM005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM001, QM002]
    - id: CM003
      statement: "Tianji's Marvin arms are 7-axis manipulators with integrated joint torque sensing, making force-sensitive manipulation a core part of the disclosed product proposition."
      type: company-claimed
      topic: force-control-architecture
      sourceRefs: [SM004, SM005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM002]
    - id: CM004
      statement: "The Marvin M6 CCS is specified at 6 kg rated payload per arm, 696 mm working radius, ±0.03 mm repeatability, and 2 m/s TCP speed."
      type: company-claimed
      topic: product-specs
      sourceRefs: [SM005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM002]
    - id: CM005
      statement: "Tianji states that its robot products have achieved application progress in new energy, medical, footwear/apparel, and commercial service settings in addition to industrial use."
      type: company-claimed
      topic: served-verticals
      sourceRefs: [SM003]
      confidence: medium
      freshness: recent
      answersQuestionRefs: [QM003]
    - id: CM006
      statement: "The relevant market boundary for Tianji includes collaborative manipulators, dual-arm systems, force-control sensing, and cell-level integration rather than only bare robot-arm revenue."
      type: inferred
      topic: market-boundary
      sourceRefs: [SM001, SM003, SM004, SM005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM003]
    - id: CM007
      statement: "Heavy-duty fenced robot lines and generic fixed-function automation are substitutes for Tianji but should be excluded from the most relevant serviceable market because they optimize for payload and throughput rather than compliant manipulation."
