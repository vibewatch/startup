  - id: sizing-lenses
    title: Market Sizing Using Multiple Lenses
    body: >
      Evidence supports several market lenses, but not a single clean point estimate for Tianji’s
      serviceable market. Public analyst-market-data pages disagree even on the size of the global
      cobot category: MarketsandMarkets sizes 2025 at USD 1.42 billion with a 2030 forecast of
      USD 3.38 billion, Mordor Intelligence sizes 2026 at USD 2.28 billion with a 2031 forecast of
      USD 5.72 billion, and Fortune Business Insights sizes 2026 at USD 2.80 billion with a 2034
      forecast of USD 13.27 billion. Those differences are too large to average away; they reflect
      methodology, service-scope, and geography differences and should be preserved as contradictory
      estimates. A second, deployment-based lens is less ambiguous: MIR’s 2025 China cobot bluebook
      says China sold more than 30,000 cobots in 2024, up 28% year on year, while global cobot sales
      reached 68,000 units; the same MIR sources expect China to exceed 40,000 units in 2025 and
      approach 100,000 units by 2028. A third lens is broader industrial adoption: IFR records
      295,000 industrial robot installations in China in 2024, equal to 54% of global demand,
      with electronics, automotive, and metal/machinery as the three largest sectors. A fourth lens
      is the embodied-intelligence adjacency: China Daily cites IDC data for 18,000 embodied-AI
      industrial robot shipments globally in 2025, expected to exceed 50,000 in 2026, and a State
      Council Development Research Center forecast of RMB 400 billion domestic embodied-AI market
      value by 2030. These lenses imply a large TAM and expanding adjacency, but the public record
      does not isolate the dual-arm force-controlled subset or Tianji’s credible SOM; that remains a
      diligence gap rather than a number to invent.
