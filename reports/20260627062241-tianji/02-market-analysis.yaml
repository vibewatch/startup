slug: tianji
runDate: "2026-06-27"
company:
  name: Tianji
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Tianji sits inside a narrower and more attractive slice of robotics than the headline
    industrial-robot market: force-controlled collaborative manipulators, dual-arm/humanoid
    workcells, and the embodied-intelligence hardware stack being trialed in manufacturing,
    labs, and service settings. Public sizing data is fragmented rather than convergent.
    Global cobot estimates range from USD 1.42 billion in 2025 to USD 2.80 billion in 2026,
    while China remains the dominant deployment geography for industrial robots and a roughly
    half-share market for global cobot volume. The investable question is less whether the
    market exists than whether Tianji can convert prototype-heavy force-control demand in
    electronics, auto components, battery, and embodied-AI OEMs into repeat industrial orders
    before payload limits, brownfield integration friction, and capex cyclicality slow adoption.
sections:
  - id: market-boundary
    title: Market Boundary, Included Spend, and Substitutes
    body: >
      Tianji is not competing across the entire industrial-robot market. Its official product and
      corporate pages position the company around force-controlled collaborative robots, dual-arm
      and humanoid manipulator modules, 3D vision, electric grippers, and related intelligent-system
      solutions rather than around high-speed fenced welding lines or commodity six-axis cells.
      The Marvin family in particular is pitched for research, commercial, quasi-industrial,
      dual-arm, and humanoid scenarios, with 7-axis arms, integrated joint torque sensors, and
      optional six-axis force sensing. That makes the relevant spend boundary broader than a single
      “cobot arm” SKU but narrower than the total industrial-automation market: the chapter includes
      collaborative arms, dual-arm manipulation cells, force-control software and sensing, mobile-
      manipulator adjacencies, and embodied-intelligence hardware where buyers need shared-space
      deployment, force sensitivity, quick changeover, or dexterous two-arm work. It excludes most
      heavy-duty fenced robot lines, low-cost fixed-function automation that does not require force
      control, and generic industrial-robot demand where payload-speed performance matters more than
      compliant manipulation. Status-quo substitutes therefore include traditional industrial robots,
      manual labor, custom hard automation, and single-arm cobots from incumbents such as Universal
      Robots, ABB, and KUKA. For embodied-intelligence programs, substitute spend also includes
      prototype humanoid platforms, mobile manipulators, and internally integrated research rigs.
    claimRefs:
