  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Tianji
      - Diligence Ask
    rows:
      - - China remains the center of global robot deployment
        - Driver
        - Current
        - Large domestic buyer base, growing local supplier acceptance, and strong manufacturing density help Tianji stay close to demand
        - What percentage of Tianji industrial revenue is domestic versus export?
      - - Cobots moving from light-duty to industrial-grade tasks
        - Driver
        - 2026 onward
        - Better payload, speed, accuracy, and compliance expand the feasible use cases for force-controlled systems
        - Which Tianji SKUs are winning in high-duty production cells versus labs and demos?
      - - Embodied-intelligence standards and policy support in China
        - Driver
        - 2026 onward
        - Standardization lowers buyer hesitation for humanoid and embodied-hardware trials, especially in manufacturing scenarios
        - Which national or local standard programs is Tianji actually participating in?
      - - Labor shortage / flexible automation / SME ROI narrative
        - Driver
        - Ongoing
        - Supports adoption in mixed-model manufacturing where quick deployment matters more than max throughput
        - What realized payback periods has Tianji documented by vertical?
      - - Payload-speed limits versus traditional industrial robots
        - Constraint
        - Ongoing
        - Heavy-duty or high-throughput lines may remain better served by fenced robots, shrinking Tianji's practical SAM
        - In which applications does Tianji lose on cycle time or payload economics?
      - - Brownfield integration and qualification friction
        - Constraint
        - Ongoing
        - Even attractive use cases can stall at PLC, safety, and line-validation steps
        - What share of deals requires third-party integrators and how long is conversion from pilot to production?
      - - Robotics capex cyclicality and project delays
        - Constraint
        - Ongoing
        - Electronics and automation budgets can pause abruptly when macro or customer capex weakens
        - What was Tianji's order cancellation / deferment rate through the last downturn?
      - - Public market-size disagreement
        - Constraint
        - Immediate
        - TAM narratives can be overstated if investors mix incompatible value and unit estimates
        - Which internal market-definition lens does management use for planning and fundraising?
    notes: "Timing reflects when each issue is most decision-relevant. The table separates structural tailwinds from conversion friction, which is the main diligence gap for Tianji rather than top-of-funnel market existence."
