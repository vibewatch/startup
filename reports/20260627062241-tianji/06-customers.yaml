    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Customer-level revenue ranking, backlog by account, and order-to-revenue conversion for the 45-OEM humanoid cohort and top industrial accounts.
      whyItMatters: Without customer ranking and conversion data, it is impossible to test whether broad customer-count claims hide dependence on a few dominant buyers.
      diligencePath: Request top-20 customer schedule with 2024-2026 revenue, backlog, cancellation and receivable aging by account.
      relatedQuestionRefs: [QU015, QU022, QU025]
      relatedTableRefs: [TU005]
    - type: private-evidence-only
      severity: material
      topic: retention-visibility
      missingEvidence: NRR, GRR, churn, contract duration, renewal history and repeat-order rates for both industrial and humanoid cohorts.
      whyItMatters: Shipment momentum does not establish durability; retention data is required to judge whether Tianji is building a sticky platform or a project-driven hardware seller.
      diligencePath: Obtain cohort tables by order month / customer type plus contract templates and renewal schedules for top accounts.
      relatedQuestionRefs: [QU013, QU014, QU025]
      relatedTableRefs: [TU004]
    - type: missing-source
      severity: material
      topic: named-humanoid-customers
      missingEvidence: Publicly verifiable names and deployment stages for the majority of the 45 OEM / embodied-AI customers cited in 2026 coverage.
      whyItMatters: Cohort-level order claims are useful but cannot substitute for account-level proof when assessing concentration, reference quality and real production adoption.
      diligencePath: Request a customer reference pack naming top humanoid accounts, shipped quantities, use cases and permissioned reference calls.
      relatedQuestionRefs: [QU005, QU022, QU023]
      relatedTableRefs: [TU003]
