callouts:
  - calloutType: strength
    title: Real deployment is proven even if account detail is thin
    body: >
      Tianji clears the threshold from hype to real commercialization because the public record shows a pre-2025 industrial
      installed base, quantified factory outcomes, one named humanoid customer with deployment feedback, and a visible
      support stack covering training, repair, spares and software.
    claimRefs: [CU001, CU006, CU007, CU013, CU014, CU018, CU021]
  - calloutType: risk
    title: Concentration and durability are still under-disclosed
    body: >
      The strongest 2026 numbers — 10000+ Q1 orders across 45 humanoid OEMs and embodied-AI companies — are still largely
      cohort-level proof. Public sources do not name most accounts, do not show backlog conversion, and do not disclose NRR,
      churn, contract length or top-customer revenue share.
    claimRefs: [CU022, CU023, CU031, CU032, CU040, CU044]
  - calloutType: insight
    title: Procurement looks engineering-led, not low-touch
    body: >
      Tianji's combination of application-specific configuration, training rooms, software-development tools, fault-repair
      workflow, spare-parts catalog and regional offices suggests a sales motion where procurement is closely tied to
      integration and post-sale support rather than a simple catalog purchase.
    claimRefs: [CU004, CU005, CU006, CU007, CU020, CU036, CU037, CU042]
