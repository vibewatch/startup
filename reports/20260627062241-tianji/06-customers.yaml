figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Publicly visible customer journey runs from sector-specific automation pain to training, deployment, and local support, with a separate branch for humanoid-OEM subsystem adoption.
    data:
      nodes:
        - label: '1. Pain discovery'
          detail: Industrial buyers face labor, yield and takt bottlenecks; humanoid OEMs need stable force-controlled arms and low-latency control.
          tone: neutral
        - label: '2. Technical evaluation'
          detail: Buyers assess application fit, controller openness, force-control need, and whether training / integration support is available.
          tone: neutral
        - label: '3. Configuration and proof'
          detail: Tianji tailors deployment such as no-force-control Marvin for Zhongke Huiling's grasping and trajectory tasks or line-specific industrial cells.
          tone: positive
        - label: '4. Deployment and acceptance'
          detail: Public proof includes first-batch delivery to Zhongke Huiling plus industrial cases with quantified takt, yield and labor outcomes.
          tone: positive
        - label: '5. Support and uptime'
          detail: Training, fault repair, software application tools, spare parts and regional offices support ongoing operation.
          tone: positive
        - label: '6. Expansion or churn risk'
          detail: Repeat purchase depends on unnamed concentration, contract durability, and whether the 45-OEM backlog converts into accepted production revenue.
          tone: risk
    claimRefs: [CU004, CU006, CU007, CU018, CU020, CU023, CU036]
    approximationNotes: The journey is synthesized from support pages, named proof, and case-study patterns rather than a disclosed official funnel.
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: The visible commercial funnel narrows from a broad industrial installed base to a much smaller set of named, high-quality customer proofs.
    data:
      items:
        - label: '2026 current online robot base (20k+)'
          value: 20000
        - label: '2022 online robot base (10k+)'
          value: 10000
        - label: '2026 current customer base (1k+)'
          value: 1000
        - label: '2025 humanoid dual-arm customers (100+)'
          value: 100
        - label: 'Q1 2026 humanoid OEM / embodied-AI order cohort (45)'
          value: 45
        - label: 'Publicly named humanoid customer proofs (Zhongke Huiling + Xingyun strategic reference)'
          value: 2
        - label: 'Publicly quantified industrial case studies with outcome detail'
          value: 1
    claimRefs: [CU001, CU002, CU013, CU018, CU022, CU023, CU028]
    approximationNotes: The bottom stages measure publicly named proof count, not actual active customers; current 20k online units come from a company-linked exhibitor profile.
