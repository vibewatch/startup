slug: tianji
runDate: '2026-06-27'
company:
  name: Tianji
chapter:
  number: 6
  title: Customers
  summary: >
    Tianji's customer base is best understood as two overlapping books of business: a legacy industrial-automation base
    spread across 3C electronics, automotive electronics, new energy, medical, home appliances, food, footwear and other
    factory use cases, and a newer embodied-AI / humanoid-OEM base buying Marvin force-controlled dual arms and related
    infrastructure. Public proof is strong enough to establish real deployment and support capability, but still weak on
    named account concentration, renewal durability, and conversion of the 45-OEM humanoid order cohort into recurring
    revenue.
sections:
  - id: customer-base-segmentation
    title: Customer base segmentation by buyer, user, vertical, geography, and channel
    body: >
      Public evidence points to a hybrid B2B book rather than a single customer archetype. On the legacy industrial side,
      Tianji sells standardized industrial robots, control systems and integration support into factory buyers across 3C,
      automotive electronics, new energy, medical, home appliances, food, footwear and adjacent manufacturing categories.
      In those accounts the buyer and payer appear to be plant-management, automation-engineering or procurement teams,
      while the day-to-day users are production, quality and maintenance operators. On the newer embodied-AI side, the
      buyer is better described as a robot maker or embodied-AI development team purchasing Marvin force-controlled arms,
      controllers and integration support as an enabling subsystem rather than a finished humanoid robot.

      Geography is still China-first in the public record. Tianji's contact surface exposes Dongguan headquarters plus
      Shanghai, East China and Southwest offices, and its support stack includes direct technical service, training,
      spare-parts, software and fault-repair pages. That is the operating shape of an engineering-led direct-sales model,
      not a reseller-led catalog motion. Overseas expansion is visible but early: 2026 media coverage says Tianji plans
      localized North America sales and technical-support teams, while Baike says some arms have already landed in overseas
      universities and research labs. The practical segmentation takeaway is that Tianji is monetizing both industrial
      automation budgets and humanoid-development budgets, with service intensity high enough that deployment support is
      part of the product rather than a side offering.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU024, CU027, CU029, CU030, CU036, CU042, CU045, CU046]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory-and-deployment-stage
    title: Adoption trajectory and active deployment evidence
    body: >
      The installed-base story starts well before the humanoid boom. Tianji's own historical materials say it had more
      than 300 industrial customers and 5,000 robots online by end-2020, then more than 500 customers and 5,000 delivered
      robots by a 2021 conference-era article, and more than 800 customers with 10,000 robots running stably online by
      end-2022. A later FAIR plus exhibitor profile raises the current surface claim to more than 1,000 customers and
      20,000 robots online, while also describing deep strategic partnerships with top-tier humanoid robotics enterprises.
      Those figures are still company-linked, but together they show a persistent installed base rather than a one-cycle
      marketing spike.

      The embodied-AI trajectory is steeper and fresher. Multiple 2026 media outlets repeat the same topline: Tianji
      delivered more than 2,000 force-controlled humanoid dual-arm units in four months during 2025, served more than 100
      customers, and entered first-quarter 2026 with more than 10,000 units of orders across 45 global humanoid robot OEMs
      and embodied-AI companies. That is strong proof of demand velocity, but it is still cohort-level proof. Public
      sources do not name most of the 45 customers, do not disclose average order size by account, and do not show what
      fraction of those orders were already converted into accepted production deployments, deferred backlog, or recognized
      revenue. The adoption curve is therefore real, but still only partly underwritten at account level.
    claimRefs: [CU001, CU002, CU008, CU009, CU022, CU023, CU025, CU032, CU043, CU044]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: named-customer-proof-and-reference-quality
    title: Named customer proof, deployment outcomes, and reference quality
    body: >
      The cleanest named humanoid-customer proof is Beijing Zhongke Huiling. An Aibang Robotics article says Tianji and
      Zhongke Huiling reached a strategic cooperation agreement in September 2025 and completed first-batch delivery of
      Marvin humanoid arms. The same piece adds unusually useful deployment detail: Zhongke Huiling said it selected Marvin
      after evaluating multiple mainstream brands and self-developed options; the delivered configuration intentionally
      omitted force control because the initial tasks were grasping, handling and trajectory work; and the customer cited no
      overheating during acceptance and trial operation. That is much stronger than a logo wall because it describes
      configuration, use case and operating behavior.

      Outside Zhongke Huiling, the evidence mix gets weaker but still informative. Tianji's own battery-manufacturing case
      study gives quantified industrial outcomes — 25,000 pieces per shift, 99.5% yield, RMB1.8 million annual cost
      savings and six-month payback — but the customer is unnamed, which limits reference quality. Tianji's Chain Expo
      article places the company in Apple's exhibition area and claims the underlying technology has been used in Mac Pro
      manufacturing, but that remains company-issued demo-adjacent proof rather than an independently confirmed Apple
      procurement statement. Baike also cites a 2025 strategic cooperation with Fujian Xingyun Electronics around embodied
      intelligence and lithium-battery / NEV scenarios, yet public evidence still looks more like ecosystem validation than a
      fully disclosed recurring customer contract. The result is a ladder of proof: one named humanoid buyer with concrete
      technical feedback, several quantified but anonymous industrial cases, and a large unnamed 45-OEM cohort whose account
      quality remains opaque.
    claimRefs: [CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU028, CU033, CU034, CU035]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: retention-durability-concentration-and-procurement-friction
    title: Retention durability, concentration risk, and procurement friction
    body: >
      Durability is where the public record is weakest. No reviewed source discloses Tianji's NRR, GRR, churn, renewal
      rate, contract length, backlog aging, cancellation rate, or revenue concentration by customer. The absence itself is
      informative: investors can see shipment momentum and support infrastructure, but cannot yet underwrite how sticky the
      45-OEM cohort is, whether industrial accounts reorder at meaningful frequency, or whether humanoid orders are spread
      across many small design wins or a few dominant customers. A Toutiao feature even asserts that industrial cobots and
      humanoid dual arms each contribute roughly half of revenue, but it provides no filing-grade support and should be
      treated as low-confidence media characterization rather than a canonical segmentation number.

      Procurement friction is easier to observe than retention. Tianji's service surface requires training, software-layer
      integration, spare parts and post-sale fault repair; its 2021 conference article says certain controller functions are
      opened to customers for secondary development; and the Zhongke Huiling proof shows configuration is tailored to task
      need rather than sold as a one-SKU product. That combination implies a technical, customer-specific integration cycle.
      On the adverse side, QCC lists a 2022 sales-contract dispute and a later civil case notice, showing commercial/legal
      friction is not literally zero. Meanwhile, the 2024 Everwin filing shows Tianji still relied on parent guarantees and
      loans while producing only modest disclosed revenue in 2023, which cautions against equating broad customer-count
      claims with diversified cash generation. The main commercial risk is therefore not absence of customers, but opacity on
      which customers truly drive durable revenue and how costly each deployment is to win and support.
    claimRefs: [CU004, CU006, CU007, CU017, CU020, CU026, CU031, CU036, CU037, CU038, CU039, CU040, CU041]
    tableRefs: [TU004, TU005]
    figureRefs: [FU004]
