- id: moat-durability-and-adverse-evidence
  title: Moat durability, adverse evidence, and likely entrants
  body: Tianji’s moat is real, but it is not yet unassailable. The durable part is the combination of early industrial installed
    base, force-control know-how, synchronized dual-arm architecture, and enough shipment volume to plausibly accumulate data
    that newer embodied start-ups do not have. The fragile part is that much of the underlying arm hardware market is moving
    toward better safety, better tooling, broader ecosystems, and more capital. ABB is already framing the category around
    industrial-grade performance, AI, and regulatory readiness. Teradyne’s filing shows that even the market leader is not
    immune from robotics revenue pressure, which is evidence that cobot hardware can commoditize and cycle with demand. Franka’s
    insolvency-era acquisition also shows that technical credibility alone does not guarantee durable economics. Most importantly,
    AgiBot is deploying capital not only into robots but into datasets, teleoperation, and developer ecosystems, which is
    exactly the layer that could let an embodied platform internalize arm suppliers instead of depending on them. Tianji therefore
    looks best positioned where customers specifically need force-controlled dual-arm execution now, but less insulated where
    buyers can accept generic arms or where larger embodied platforms can bundle the full stack.
