  rows:
  - - Tianji
    - Direct force-controlled dual-arm supplier
    - RMB1B Series B/B+ in 2026; >2,000 dual-arm deliveries in 2025; >10,000 2026 Q1 orders claimed
    - Embodied-AI OEMs, industrial automation, force-control dual-arm deployments
    - Integrated dual-arm architecture, force control, early shipment volume, industrial installed base
    - Public pricing is opaque and global service/channel depth still trails incumbents
  - - ABB YuMi
    - Integrated dual-arm incumbent
    - Global automation incumbent; YuMi launched in 2015
    - Fine assembly, lab and small-parts collaboration
    - True dual-arm design with strong automation brand and safety heritage
    - 500 g payload per arm limits breadth versus heavier industrial tasks
  - - Universal Robots
    - Single-arm ecosystem incumbent
    - Teradyne-owned; >110,000 cobots sold worldwide
    - General manufacturing teams seeking flexible cobot deployment
    - Software stack, ecosystem, partner coverage, service and installed base
    - No native integrated dual-arm product in retained evidence; pricing remains quote-led
  - - Franka Robotics
    - Research / developer-force alternative
    - Acquired by Agile Robots in 2023; about 100 employees retained
    - Research labs, physical-AI developers, advanced prototyping
    - Developer-friendly research positioning and duo/mobile variants
    - Retained evidence is lighter on industrial-scale deployment and public pricing
  - - Doosan Robotics
    - Industrial cobot incumbent
    - Public-company IR posture with 2026 earnings releases
    - Industrial and service deployments such as palletizing and beverage service
    - Broad lineup, dealer channel, training and service infrastructure
    - Retained evidence shows quote/distributor motion rather than transparent public pricing
  - - UFACTORY xArm
    - Low-cost open alternative
    - Public ecommerce pricing from roughly US$5k to US$10k+
    - SMBs, labs, developers, cost-sensitive automation buyers
    - Open APIs, Python/ROS stack, unusually transparent pricing
    - Single-arm architecture and lighter service footprint than top incumbents
  - - Dobot CRA / CRAF
    - Chinese industrial cobot alternative
    - Broad cobot and humanoid lineup on official site
    - Industrial users needing vision, process packs, and certified collaborative safety
    - High-speed joints, process packages, ecosystem plugins, strong safety marketing
    - Retained evidence does not show clean public pricing for the industrial cobot line
  - - AgiBot
    - Likely embodied-platform entrant
    - Tencent- and JD-backed; 2026 ecosystem funding plan of RMB100M now and RMB2B over five years
    - Embodied-AI developers and future integrated platform buyers
    - Humanoids, datasets, teleoperation, and ecosystem capital in one stack
    - Less directly comparable for today’s classic industrial arm replacement deals
  notes: Rows cover the most decision-relevant public alternatives for Tianji’s buyer job, not every cobot vendor globally;
    scale/funding cells favor retained public signals over inferred rankings.
