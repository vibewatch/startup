  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized quotes, service bundles, and discount curves for Tianji, ABB, UR, Franka, Doosan, and Dobot
      industrial cobots.
    whyItMatters: Without contract pricing, public list pages cannot show whether Tianji wins on gross price, bundled service
      economics, or just feature fit.
    diligencePath: Collect distributor or direct-sales quotes for one comparable dual-arm or two-arm cell from each vendor
      and normalize on tooling, controller, and support scope.
    relatedQuestionRefs:
    - QP016
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Customer-level migration, renewal, and win-loss data showing whether buyers replace Tianji, add Tianji
      beside incumbents, or switch away after pilot.
    whyItMatters: Public product pages show capability but not whether Tianji creates sticky workflows or is merely one component
      in a multi-vendor automation stack.
    diligencePath: Request reference calls and cohort data segmented by single-arm substitution, dual-arm dexterity, and embodied-data
      collection deployments.
    relatedQuestionRefs:
    - QP017
    - QP018
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: public-company-scale
    missingEvidence: Clean retained public revenue or shipment figures for Doosan and Dobot that are directly comparable with
      Tianji’s disclosed order signals.
    whyItMatters: The chapter can compare channel posture and product breadth, but not precise scale ranking across all Chinese
      and incumbent peers.
    diligencePath: Pull the specific 2025 annual report or 2026 quarterly filings from Doosan and Dobot investor-relations
      sources and extract robotics revenue, units, and regional mix.
