- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Integrated force-controlled dual-arm execution
    - Generic single-arm cobots or paired arms cover enough use cases to keep early multi-homing cheap
    - high
    - 'Ask for win-loss data by application type: single-arm replacement, dual-arm dexterity, and embodied-data collection'
  - - Industrial installed base and field data
    - Capital-rich embodied entrants can build their own data and teleoperation ecosystems
    - high
    - Quantify how much of Tianji’s dataset and controls stack is proprietary versus reproducible by well-funded entrants
  - - Certification and force-control trust
    - ABB, UR, Doosan, and Dobot also market safety/compliance depth and broader support infrastructure
    - medium-high
    - Collect customer references that explain why Tianji wins regulated or safety-sensitive deployments
  - - Emerging global sales network
    - Incumbents already have wider partner, service, and public-company infrastructure
    - high
    - Measure overseas conversion, support response times, and local integration partner coverage versus UR/ABB/Doosan
  - - Opaque pricing preserves margin flexibility
    - Visible low-cost anchors from UFACTORY and quote-led alternatives can still pressure negotiations
    - medium
    - Obtain real quotes for Tianji, UFACTORY, Doosan, and one integrator-built UR dual-arm cell
  - - Embodied-AI adjacency
    - AgiBot-style full-stack platforms may internalize arms instead of sourcing them externally
    - high
    - Track attach rates of Tianji components into third-party humanoid platforms versus in-house replacement efforts
  notes: Severity is an underwriting judgment grounded in retained public evidence, not a company-disclosed risk ranking.
