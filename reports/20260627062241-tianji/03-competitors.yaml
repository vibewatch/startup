- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Price / contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Tianji
    - Custom / not public in retained sources
    - Dual-arm embodied and industrial robot products, force-control positioning
    - No public list price, volume discounts, or service bundles retained
    - Procurement friction is higher because buyers cannot benchmark list economics before engaging sales
  - - ABB YuMi
    - Custom / not public in retained sources
    - Integrated dual-arm cobot for small-parts collaboration
    - No public list pricing retained
    - YuMi likely sells as a specialized incumbent solution rather than a transparent self-serve product
  - - Universal Robots
    - Custom / contact-sales motion in retained sources
    - Cobot arm plus software, ecosystem, support, and partner guidance
    - No public list price retained; full system cost depends on integrator and tooling
    - UR can compete on total solution confidence even without price transparency
  - - Franka Robotics
    - Custom / not public in retained sources
    - Research 3 platform, duo/mobile variants, developer-oriented ecosystem
    - No retained list price and unclear production economics
    - Best suited for research budgets rather than easy industrial cost comparison
  - - Doosan Robotics
    - Quote-led distributor motion
    - Industrial and service cobot lineups plus training/service footprint
    - Distributor and integrator markups not visible in retained evidence
    - Buying motion looks channel-heavy and enterprise-like
  - - UFACTORY xArm
    - Official ecommerce pricing
    - Arm hardware, accessories, SDKs, open APIs, ROS resources
    - Turnkey integration, services, and volume discounts still unknown
    - Gives buyers a visible low-cost benchmark that can anchor Tianji negotiations
  - - Dobot CRA / CRAF
    - Custom / not public in retained sources
    - Certified collaborative arm, ecosystem plugins, vision, process packages
    - Public industrial-line list pricing not retained
    - Can undercut on deployment speed without giving buyers a clean list-price anchor
  - - AgiBot
    - Project / ecosystem investment model rather than retained list pricing
    - Humanoids, dataset ecosystem, teleoperation, embodied platform components
    - No retained public list pricing
    - Competition may shift from arm CAPEX to ecosystem/control-stack access
