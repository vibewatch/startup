- id: distribution-trust-and-switching-costs
  title: Distribution, trust, and switching costs
  body: The most important competitive gap is not actuator performance; it is distribution and operational confidence. UR’s
    retained pages foreground software, ecosystem, partner guidance, and service, and Teradyne’s filing shows that UR sits
    inside a larger public-company robotics segment with a global installed base. Doosan pairs industrial applications with
    a public IR data room and distributor-led channel posture. ABB and Doosan both benefit from being interpreted by buyers
    as incumbent automation vendors rather than as a narrow embodied-AI component supplier. Tianji is moving to close that
    gap by using its 2026 financing to build overseas sales and technical support, but its public pages still look more product-forward
    than channel-forward. That matters for switching cost. Early in a project, buyers can often multi-home by testing Tianji
    beside UR-, Doosan-, UFACTORY-, or Dobot-based cells. Switching costs become meaningfully higher only after a customer
    has tuned synchronized dual-arm behaviors, force-control parameters, safety validation, and data-collection workflows
    around Tianji’s specific architecture.
