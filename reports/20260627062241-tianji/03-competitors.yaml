- id: capability-and-pricing-comparison
  title: Capability and pricing comparison
  body: Tianji’s public edge is clearest on the mechanical side of embodied manipulation. Its Marvin pages emphasize 7-axis
    force-controlled arms, synchronized dual-arm control, EtherCAT, and collaborative-robot certifications, while outside
    reporting adds shipment and order scale that most research-centric peers do not publicly match. But the same evidence
    also shows that the market is not standing still. UFACTORY exposes very transparent xArm ecommerce pricing and an unusually
    open developer stack. Dobot stresses safety certifications, ecosystem plugins, and process packages that shorten deployment
    in mainstream industrial workflows. UR competes less on integrated dual-arm hardware than on a polished software-and-support
    stack, while ABB still owns the symbolic high ground for true dual-arm cobots. Public pricing remains frustratingly incomplete
    across Tianji, ABB, UR, Doosan, and Franka, so the strongest supported conclusion is not that Tianji is cheapest or most
    expensive, but that buyers can compare Tianji against a field where only a few alternatives expose clean list-price anchors
    and many others sell by quote.
