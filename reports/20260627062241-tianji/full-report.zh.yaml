      - number: '6.2'
        title: 采用轨迹与活跃部署证据
        blocks:
          - type: paragraph
            body: >
              安装基础故事早在人形机器人热潮之前就开始。Tianji 自有历史材料称，截至 2020 年底，公司拥有超过 300 家工业客户、5,000 台机器人在线；到 2021 年会议时期的一篇文章，又称超过 500
              家客户、5,000 台已交付机器人；截至 2022 年底，则超过 800 家客户、10,000 台机器人稳定在线运行。后续 FAIR 加展商画像把当前表面说法提高到超过 1,000 家客户、20,000
              台机器人在线，同时描述与头部人形机器人企业有深度战略合作。这些数字仍与公司相关，但合在一起显示的是持续安装基础，而非单周期营销峰值。

              具身 AI 轨迹更陡，也更新。多家 2026 年媒体重复同一条主线：Tianji 在 2025 年四个月内交付超过 2,000 台力控人形双臂，服务超过 100 家客户，并在 2026 年一季度拥有超过
              10,000 台订单，覆盖 45 家全球人形机器人 OEM 和具身 AI 公司。这是很强的需求速度证明，但仍是群组级证明。公开来源没有披露 45
              家客户中多数名字，没有披露按账户划分的平均订单规模，也没有显示这些订单中有多少已转化为验收后的生产部署、递延 backlog 或确认收入。因此，采用曲线真实存在，但账户层面仍只被部分承销。
