              对一家私人机器人公司而言，Tianji 的出货和订单动能异常强，但公开牵引力界面仍不足以完整承销。母公司文件确认了 2025 年人形机器人相关组件收入和很大的出货量；多篇 2026 年报道重复了 2,000+
              交付和 10,000+ 订单里程碑。这足以相信存在真实客户拉力。但还不足以承销收入质量或利润率耐久性。公开来源仍未披露 Tianji
              独立经审计收入、按收入流划分的收入确认政策、毛利率、流失或取消率、backlog 账龄、平均售价、服务 attach
              rate，或子公司客户集中度。结果是一个奇特分裂：公司足够可见，可以证明商业相关性；但又足够不透明，使核心 P&L 解读依赖管理层材料，而非公开证据。
