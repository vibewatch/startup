  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >
              Tianji 并不在整个工业机器人市场全面竞争。官方产品和公司页面将公司定位在力控协作机器人、双臂和人形机械臂模块、3D 视觉、电动夹爪以及相关智能系统解决方案，而不是高速围栏焊接线或大宗六轴工作站。Marvin
              家族尤其面向科研、商业、准工业、双臂和人形场景，配置七轴机械臂、集成关节扭矩传感器和可选六轴力感知。因此，相关支出边界比单一“协作机械臂”SKU
              更宽，但又窄于总体工业自动化市场：本章纳入协作机械臂、双臂操作工作站、力控软件和传感、移动操作臂相邻场景，以及买方需要共享空间部署、力敏感、快速换型或灵巧双臂作业的具身智能硬件。排除项包括大多数重载围栏机器人产线、不需要力控的低成本固定功能自动化，以及更看重负载速度表现而非柔顺操作的一般工业机器人需求。现状替代方案因此包括传统工业机器人、人工、定制硬自动化，以及来自
              Universal Robots、ABB、KUKA 等龙头的单臂协作机器人。对具身智能项目而言，替代支出还包括原型人形机器人平台、移动操作臂和内部集成研究平台。
