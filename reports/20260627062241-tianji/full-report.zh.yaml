      - number: '7.4'
        title: 伙伴、客户、市场与模式风险
        blocks:
          - type: paragraph
            body: >-
              最深的非技术风险，是 Tianji 同时处在多个集中网络里。即使已出表，它仍通过持股历史、已披露关联方流动和制造传承与 Everwin 相连。公开股权报道仍足够嘈杂，以至于一篇正面二级文章在母公司文件已显示稀释至
              40% 很久后，仍称 Tianji 为全资子公司；这提醒投资人，路演材料可能会过度简化治理现实。客户集中也难以忽视。Tianji 提到 45 家人形机器人或具身 AI 客户和 1,000
              多家工业客户，但保留来源里唯一硬集中度数字来自 Everwin 层面：2025 年前五大客户贡献 64.6% 收入，最大客户贡献 23.8%。这不是 Tianji
              单体数字，却说明这个生态可能高度暴露于少数锚定客户。需求环境有支撑但不稳定。2026 年融资报道称，资本正转向真实世界验证和工程执行；而 KUKA 和 Teradyne
              披露，自动化和机器人领域面临更激烈定价、项目延迟和贸易政策逆风。因此，如果具身 AI 热度降温，或客户推迟量产计划，Tianji 同时面临价格压缩、OEM
              内部化和积压订单波动风险。一家有真实技术的公司，如果关键账号暂停、压价或把手臂与控制栈内化，价值仍可能快速受损。
