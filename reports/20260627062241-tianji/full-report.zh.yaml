      - number: '1.3'
        title: 所有权、融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Tianji 的所有权故事比标题报道更复杂。历史上，公司孵化于 Shenzhen Everwin Precision 内部，多年里实际上由该母公司控制。不过，Everwin 2024 年 2
              月公告是重设基线的一手来源：Everwin 出售 Tianji 30% 股权，并在增资中放弃优先认购权，使持股从 78% 降至 40%，Tianji 也因此退出 Everwin 合并报表。后续 2026
              年媒体和画像来源称 Everwin 在后续融资后持股约 27%，这与进一步稀释相符，但与 EqualOcean 把 Tianji 简化描述为全资子公司的说法不一致。这个差异足够重要，应保留下来，而不是抹平。


              融资历史同样一部分可见、一部分不透明。公开来源一致确认，2026 年 5 月 Series B 与 B+ 合并轮总额为人民币 10 亿元，由 GL Ventures / Hillhouse 和 Meituan
              Strategic Investment 联合领投，Tencent、Gaorong、Luminous / Photosynthetic Ventures、GGV / Granite
              跟投。不那么清楚的是估值：EqualOcean 报道投后人民币 80 亿元，而 36Kr、Yicai、NetEase 和 EmbodiedGlobal 将公司描述为投后接近人民币 100 亿元。更早融资只能通过
              36Kr / PitchHub、QCC 和 Baike 部分看见：2024 年 3 月与 Hidden Hill / GLP Hidden Hill 相关的战略融资，以及 2025 年由
              GGV、SAIF、CMBI 参与的 A 或 A+ 轮，金额未披露。由于 2025 年轮次规模不公开，且精确的 B
              轮后所有权没有新的备案支撑，后续估值工作应把累计融资总额和当前稀释情况视为未解决的尽调点，而非硬事实。
