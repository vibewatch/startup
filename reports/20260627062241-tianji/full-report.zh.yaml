        - TR8 加视觉定位、抓取和孔位检测，放在八工位分度单元内
        - 官方案例称可高精度、稳定处理特殊角度
        - 没有公开部署数量、正常运行时间或服务负担数据
      - - CNC 上下料
        - 操作员等待机床完工后手动重新上料
        - 一台 TR8 看管两台 CNC，机加工完成后立即更换工件
        - 官方案例称减少等待、提升效率
        - 没有量化主轴利用率提升或劳动力桥表
      - - 食品处理 / 冲洗环境
        - 潮湿或冲洗环境挑战标准机械臂
        - TR8-HM 食品行业机器人，具备 IP67 定位
        - 公开页面明确说明适用于冲洗环境
        - 除防护等级表述外，没有公开卫生认证组合
      - - 具身 AI 数据采集 / 遥操作
        - 需要物理世界操作数据和双臂遥操作
        - Marvin Pro 叙事围绕力控双臂整合相机、Jetson Orin、ROS2 和 VR 遥操作
        - 2026 年外部报道显示，从远程操作到模型训练的桥接更紧
        - 该工作流的官方可下载文档仍然稀少
    notes: 收益仅限案例页面和留存报道中的公开说法；任何一行都不应被理解为经过验证的 ROI 研究。
