      - number: '8.4'
        title: 建议、持有或退出逻辑与最终立场
        blocks:
          - type: paragraph
            body: >-
              今天正确的判断是跟踪，置信度中等、风险高、估值偏紧。相较运营信号的强度，这听起来谨慎，但谨慎来自价格，而不是否定。公开证据足以说明 Tianji 不只是概念 deck；但还不足以说明当前进入已经有吸引力。按
              RMB8-10 billion 估值，即便采用相当标准的 2.5-3.0x 风险投资总价值创造目标，也意味着在任何优先权漏损前，需要约 RMB20-30 billion 退出股权价值。Tianji
              必须成为少数能把子系统领导地位转成多年收入规模的中国人形机器人龙头之一，而不只是可信的组件供应商。持有纪律因此应基于里程碑：只有公司把订单转成确认收入、显示毛利经济韧性，并把客户基础从少数 OEM
              之外拓宽，才维持 conviction。如果下一轮融资依赖热度而非披露的转化数据，或行业倍数压缩时采用停滞，就应退出或回避。
