        - id: capital
          label: 资本信号：Hillhouse / Meituan / Tencent / GGV 等一线财团参与的人民币 10 亿元融资
        - id: gap
          label: 缺口信号：未公开披露 Tianji 独立收入、毛利率、ASP、烧钱速度或优先权结构
