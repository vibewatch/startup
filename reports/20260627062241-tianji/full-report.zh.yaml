      - number: '8.5'
        title: 退出准备度、尽调要求与 thesis-break 触发点
        blocks:
          - type: paragraph
            body: >-
              Tianji 还没有明显准备好独立公开退出。公开资本市场界面目前属于 Everwin，其文件显示的是更宽的集团披露和融资野心；Tianji
              自身仍缺少独立公开财务包。这不杀死投资案，但界定了剩余工作。最高价值的尽调要求很直接：证明报告积压订单带来的确认收入和 ASP，披露按产品线划分的毛利率，展示积压订单账龄和取消率，命名主要客户或
              reference 账号，并揭示 B/B+ 轮优先权栈。这些项目决定今日估值是早期胜利还是买贵。Thesis
              也有清晰断点：如果订单无法转化，如果集中度极端，如果募资后良率提升没有显现，或如果行业泡沫担忧快于商业采用而加剧，当前标记可能迅速下调重估。
