  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              Tianji 2026 年 5 月的 B 轮和 B+ 轮融资规模足够重要，也小到仍要求价格纪律。保留的中英文报道都指向 RMB1 billion 新资金和约 RMB8-10 billion
              投后估值。这是投资人需求强、投资人质量高的可信证据，但本身不能证明公开运营数据足以支撑价格。同一批保留来源也说明了投资人为什么感兴趣：Tianji 有标准化 Marvin
              双臂产品族、比许多人形机器人同行更长的公司历史、2025 年四个月内报告交付 2,000 多台双臂，以及 2026 年 Q1 来自 45 家全球人形机器人 OEM 和具身 AI 账号的 10,000
              多台订单。这些是真实商业化信号。问题在结构缺口。公开报道披露轮次规模、财团和资金用途，但没有披露清算优先权、反稀释条款、董事会控制、老股比例或子公司层面收入转化。纪律严格的投资人因此应把本轮视为兴趣证明，而不是今日价格安全的证明。
