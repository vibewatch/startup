              know-how、同步双臂架构，以及足以合理积累数据的出货量，而新一代具身创业公司未必拥有这些。脆弱部分在于，底层机械臂硬件市场正在走向更好的安全性、更好的工具链、更广生态和更多资本。ABB
              已经围绕工业级性能、AI 和监管准备度来定义这个品类。Teradyne 的文件显示，即使市场领导者也无法免疫机器人收入压力，这证明协作机器人硬件可能商品化，并随需求周期波动。Franka
