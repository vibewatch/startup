  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              Tianji 并不只是与另一款双臂机器人竞争。保留下来的证据显示，同一买方任务至少有五条可信替代路径。ABB YuMi 是最清晰的集成双臂精密装配龙头，但 500 g
              的极小负载让它集中在小零件作业，而非更广泛的工业操作。Universal Robots、Doosan、UFACTORY 和 Dobot
              即便没有原生双臂形态也重要，因为许多工业任务仍可拆解为一只手臂、两只协同通用手臂，或一只手臂加夹具、视觉和软件。Franka 在研究实验室和物理 AI
              开发者优先考虑开发者友好度而非大规模制造时仍有相关性。AgiBot 目前并不是每个 Tianji 部署的直接替代品，但它是最重要的潜在进入者，因为它正在搭建一个捆绑机器人本体、数据集、遥操作和生态资本的具身 AI
              栈。这意味着 Tianji 必须同时防守精密龙头、生态龙头、低成本开放替代方案，以及垂直整合的具身平台。
