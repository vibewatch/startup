      - number: '1.4'
        title: 规模信号、里程碑与负面 / 冲突证据
        blocks:
          - type: paragraph
            body: >-
              Tianji 的规模叙事在 2025–2026 年明显增强。官方和媒体来源称，公司从 2022 年底超过 800 家客户、10,000 台机器人在线，推进到 2025 年四个月内交付超过 2,000
              台力控人形双臂，再到 2026 年一季度订单超过 10,000 台，覆盖全球 45 家人形机器人或具身 AI 厂商。产品页面支撑了“不是空气故事”的判断：Marvin
              产品线有具体七轴规格、公开力控参数和认证。因此，Tianji 最适合被描述为一家有交付历史的真实硬件供应商，而不只是融资概念。


              负面部分更细，但确实存在。Everwin 2024 年公告显示，Tianji 在 2023 年前三季度仅实现人民币 5,227 万元收入，净亏损人民币 999 万元，当时还伴随母公司担保和人民币 1,560
              万元未结清财务支持。工商 / 法律风险来源也显示，公司存在常规民事诉讼和开庭公告，而不是零争议画像。最后，部分规模和身份说法在来源之间冲突：创立年份为 2015 还是 2017、参保员工 166 人还是员工
              300+、估值人民币 80 亿元还是接近 100 亿元。这些矛盾都不足以推翻整体投资论点，但意味着本章应成为后续章节继承带限定事实的规范位置，而不是继承简化的营销话术。
