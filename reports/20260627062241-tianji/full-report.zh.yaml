      - - 工业具身智能硬件
        - 面向工厂中 AI 训练、视觉、力控和移动操作的硬件平台
        - 纯基础模型软件和消费者人形机器人娱乐部署
        - 创新预算、自动化实验室预算、先进制造 capex
        - 如果原型需求转为量产硬件订单，就是战略扩张通道
      - - 电子 / 汽车零部件 / 电池柔性工站
