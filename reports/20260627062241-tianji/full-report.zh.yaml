              认证说法；可选功能加入虚拟围栏和软浮动行为，用来约束运动或吸收外载；培训中心也把安全作为一等主题。负面看，网站没有发布可下载证书、测试报告、产品安全政策、遥操作或数据采集隐私材料、漏洞披露渠道、SBOM
