      - number: '6.3'
        title: 具名客户证明、部署结果与参考质量
        blocks:
          - type: paragraph
            body: >
              最清晰的具名人形机器人客户证据，是北京中科慧灵。Aibang Robotics 文章称，Tianji 与中科慧灵在 2025 年 9 月达成战略合作，并完成 Marvin
              人形手臂首批交付。同一篇文章还给出少见但有用的部署细节：中科慧灵称，它在评估多个主流品牌和自研方案后选择
              Marvin；交付配置有意不配力控，因为初始任务是抓取、搬运和轨迹作业；客户还提到，验收和试运行期间没有过热。这比 logo 墙强得多，因为它写清了配置、用途和运行表现。

              中科慧灵之外，证据组合变弱，但仍有信息量。Tianji 自己的电池制造案例给出量化工业结果——每班 25,000 件、99.5% 良率、每年节省 RMB1.8 million
              成本、六个月回本——但客户未具名，削弱了 reference 质量。Tianji 的 Chain Expo 文章把公司放进 Apple 展区，并称底层技术已用于 Mac Pro 制造，但这仍是公司发布、接近
              demo 的证据，不是独立确认的 Apple 采购声明。Baike 还提到 2025 年与福建星云电子围绕具身智能和锂电 / NEV
              场景达成战略合作，但公开证据看起来更像生态验证，还不是完整披露的经常性客户合同。结果是一条证据阶梯：一个具名人形机器人买家、有具体技术反馈；几个量化但匿名的工业案例；以及一个大型但未具名的 45 家 OEM
              队列，账号质量仍不透明。
