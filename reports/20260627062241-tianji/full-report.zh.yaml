  - id: TV005
    title: 论点失效与放弃触发因素表
    columns:
      - 触发因素
      - 阈值 / 可观察事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 订单转化失败
        - 到下一轮融资周期，已披露积压订单仍没有可信的收入桥接，或没有确认收入披露。
        - 打破 Tianji 已从热度跨入规模化商业化的核心多头叙事。
        - 在拿到转化数据前，从跟踪转为回避。
      - - 客户集中度冲击
        - 少数 OEM 贡献绝大多数订单，或取消订单大幅上升。
        - 规模观感不再体现平台实力，反而变成集中度风险。
        - 按熊市情形重估，并要求按集中度调整后的条款。
      - - 良率 / 自动化不及预期
        - 新资本没有改善一次通过率、自动化率或交付可靠性。
        - 支撑高倍数所需的经营杠杆被削弱。
        - 下调估值假设，并暂停任何跟投承诺。
      - - 板块倍数压缩
        - 泡沫警示或部署乏力之后，上市人形机器人和机器人公司倍数大幅重置。
        - 支撑当前价格的高溢价可比公司依据消失。
        - 重新锚定中国上市自动化公司的估值区间。
      - - 结构性悬顶
        - 新披露显示 B/B+ 投资人享有重度优先权、反稀释棘轮或控制权。
        - 普通股上行空间明显差于表面企业价值暗示。
        - 要求更深折扣，或直接退出。
    notes: 这些触发因素刻意设定为可观察事件，并与估值传导挂钩，而不是泛泛判断管理层质量。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV046
      - CV049
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 独立财务数据
        - Tianji 2025 年和 2026 年 Q1 收入、毛利率、经营现金消耗和资本开支分配。
        - 要判断 RMB8-10B 是激进但可辩护，还是单纯过早，这些是最低限度事实。
        - 财务资料室或董事会材料；与 Everwin 披露交叉核对。
      - - 积压订单质量
        - 已签订单、已交付订单与确认收入之间的桥接，积压订单账龄、取消历史和头部客户集中度。
        - 10,000+ 订单信号是叙事与估值之间最重要的桥。
        - 销售运营 / CFO 尽调；抽样客户合同和 ERP 导出。
      - - 定价权
        - 按 Marvin 配置划分的实际 ASP、折扣梯度、保修条款和服务附加率。
        - 要把销量说法换算成可持续毛利，需要这些数据。
        - 商务尽调，覆盖头部合同和发票样本。
      - - 股权结构与优先权
        - 清算优先权、反稀释权、董事会权利、老股转让和员工期权池变化。
        - 如果权利栈偏向投资人，名义投后估值可能夸大普通股吸引力。
        - 法务尽调，查看已签署投资条款清单和股权结构分配瀑布。
      - - 退出路径
        - 独立 IPO 意向、相对 Everwin 的剥离逻辑，以及大型工业或机器人玩家的战略收购兴趣。
        - 决定更可能的退出是有定价的成长轮、战略收购，还是延后的公开上市路径。
        - 董事会层面战略讨论和投行反馈。
    notes: 大多数缺失证据属于公司私有信息，而不是理论上不可知；因此这些尽调问题是实操性的， 不是猜测性的。
    claimRefs:
      - CV011
      - CV012
      - CV047
      - CV048
      - CV050
