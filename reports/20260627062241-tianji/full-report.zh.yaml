        title: 关于收入质量、利润率路径与尽调阻塞项的财务结论
        blocks:
          - type: paragraph
            body: >-
              财务结论复杂，但并不含糊。与炒作阶段的机器人同行相比，收入质量方向上更好，因为有母公司文件中的收入、真实出货量，以及标准化产品和可重复工业销售的清晰证据。但它仍无法被完整承销，因为公开记录不能把 Tianji
              独立收入与母公司更窄的机器人业务线对上，也没有披露实际定价或毛利率，更没有给出子公司层面的现金、烧钱或 backlog
              转化数据。随着自动化率提高、一次通过率改善和规模扩大，利润率路径可能改善；但现有文件也显示应收、存货和借款压力抬升，快速增长中会吃掉现金。因此，资本密集度是一阶尽调问题，不是脚注。严肃投资人应把订单增长视为真实，但在
              Tianji 披露子公司财务、backlog 账龄、客户集中度和机器人专项资本开支分配之前，应把估值、runway 和利润率信心视为暂定。
