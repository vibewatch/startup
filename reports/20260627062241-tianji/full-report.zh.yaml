companyProfile:
  summary: >-
    Tianji（Guangdong Tianji Intelligent System Co., Ltd.）是一家位于东莞的中国机器人公司，2015-05-18 注册成立，源自 Shenzhen Everwin Precision
    的自动化业务。公司销售覆盖面较宽的自动化产品目录，包括力控 Marvin 双臂系统、协作机器人、SCARA 和六轴机器人、控制器及相关服务，近年更强调为人形机器人 OEM 提供具身智能基础设施。公开来源显示，Tianji
    在传统工厂自动化中有真实部署历史，近年在人形机器人相邻的双臂产品上也有动能：2025 年四个月内交付超过 2,000 台力控双臂，且据报道 2026 年一季度来自全球 45 家人形机器人或具身 AI 客户的订单超过 10,000
    台。Tianji 于 2026 年 5 月完成由 GL Ventures 和 Meituan Strategic Investment 领投的人民币 10 亿元 Series B 与 B+
    轮融资，证明投资人兴趣强烈，但独立收入、利润率、烧钱速度和清算优先权披露仍有限。
