      - number: '2.2'
        title: 用多重视角测算市场规模
        blocks:
          - type: paragraph
            body: >
              证据支持几种市场视角，但不能给出 Tianji 可服务市场的单一干净点估计。公开分析机构的市场数据页面甚至对全球协作机器人品类规模都不一致：MarketsandMarkets 将 2025 年规模估为 USD
              1.42 billion，并预测 2030 年为 USD 3.38 billion；Mordor Intelligence 将 2026 年估为 USD 2.28 billion，并预测 2031 年为 USD
              5.72 billion；Fortune Business Insights 将 2026 年估为 USD 2.80 billion，并预测 2034 年为 USD 13.27
              billion。这些差异太大，不能简单取平均；它们反映方法、服务范围和地理口径不同，应作为相互矛盾的估算保留。第二个基于部署的视角更明确：MIR 2025 年中国协作机器人蓝皮书称，中国 2024 年销售超过
              30,000 台协作机器人，同比增长 28%，全球协作机器人销量达 68,000 台；同一组 MIR 来源预计中国 2025 年将超过 40,000 台，并在 2028 年接近 100,000
              台。第三个视角是更广的工业采用：IFR 记录中国 2024 年安装 295,000 台工业机器人，占全球需求的 54%，电子、汽车、金属 / 机械是三大行业。第四个视角是具身智能相邻市场：China Daily
              引用 IDC 数据称，2025 年全球具身 AI 工业机器人出货 18,000 台，预计 2026 年超过 50,000 台，并引用国务院发展研究中心预测，到 2030 年中国国内具身 AI 市场规模将达人民币
              4,000 亿元。这些视角指向大 TAM 和正在扩张的相邻市场，但公开记录没有拆出双臂力控子集或 Tianji 可信 SOM；这仍是尽调缺口，而不是可以凭空发明的数字。
