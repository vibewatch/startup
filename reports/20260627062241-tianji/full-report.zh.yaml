              Marvin 双臂家族。按客户工作流看，传统栈服务于机床上下料、精密装配、视觉分拣和冲洗环境搬运；更新的 Marvin 产品线则面向力控双手操作，集成商或人形机器人 OEM
              需要的是灵巧手臂、协同控制和数据采集挂钩，而不是完整端到端人形机器人。具体应用页面很重要，因为它们展示了 Tianji 如何卖进生产工作站：TR8 用 CCD 定位搬运汽车分总成，SR3 / SR3D 以
