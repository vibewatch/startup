        - 暂停投资，要求根因、CAPA 和保险审查后再推进。
      - - 订单转化质量
        - 积压订单到收入的桥接和现金回款
        - 如果 10,000+ 订单叙事在两个季度内没有转化、账龄和现金回款证据支撑
        - 将增长主张视为宣传；估值只按已交付且已付款单位重估。
      - - 母公司依赖
        - 关联方在收入、采购、租金、公用事业和担保中的占比
        - 任何重新出现的担保支持，或仍具战略不可替代性的关联方交易量
        - 将治理独立性重新归类为弱，并要求结构性补救。
      - - 客户集中 / 取消
        - 头部客户占比、试点到量产转化、取消率
        - 如果单一客户超过 Tianji 收入 20%，或头部 OEM 明显延期且没有替代需求
        - 把投资逻辑从平台供应商下调为集中项目供应商。
      - - 出口管制扰动
        - 命中拒绝交易方、许可被拒，或关键部件 ECCN 升级
        - 任何出货被阻、美国来源输入不可得，或关键控制器、计算、传感器路径被迫重设
        - 下调国际规模化假设，并提高要求回报。
      - - 营运资本压力
