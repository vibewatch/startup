      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开可核验的领导层集中在董事长 / 法定代表人 /
              经理陈曦身上。工商来源和画像数据库一致显示，陈曦担任法定代表人、董事长和经理，同时也是重要股东。其他具名治理人员包括董事安杰、董仲朗、黄少平、邹锐，监事段凯华，以及财务负责人黄乃浩。这足以列出核心管理层和法定治理角色，但不足以证明
              Tianji 已经具备成熟的独立董事会结构。


              这项缺口会影响尽调。公开来源没有披露 Tianji 作为上市母公司生态内私人子公司 / 关联方的独立董事、董事会委员会或详细治理章程。公开领导层痕迹稀疏，说明 Tianji 在战略、融资信号以及客户 /
              投资人信任上可能相当依赖陈曦。同时，已具名的财务和董事会人员也表明 Tianji 不再是一个单人壳公司，至少已有可见的法定治理层。后续章节的实际处理口径是：把陈曦视为核心经营负责人，同时明确保留对 B
              轮后董事会构成、否决权以及 2024–2026 年融资中主要投资人是否取得治理权的尽调问题。
