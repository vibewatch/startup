              上市以拓宽融资渠道，并披露募资用途计划，涵盖产能扩张、智能制造升级、全球布局、M&A、偿债和营运资本。母公司还为子公司融资承担较大担保额度。这些都不能证明困境，但说明机器人扩张并非仅靠自由内部现金生成供血。HKEX
              文件确实称，集团在假设 IPO 募资、银行授信和内部现金资源的情况下，预计至少有 12 个月营运资本充足。该表述对母公司层面有帮助；它不能替代 Tianji 独立 runway
