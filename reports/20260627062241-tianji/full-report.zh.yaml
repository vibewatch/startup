      - number: '7.3'
        title: 运营、制造与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Tianji 比只停留在原型阶段的具身 AI 初创公司更可信，但扩张压力已经在公开记录里很明显。公司和媒体来源称，2026 年后融资计划是提高自动化率、一次通过率和本地化海外支持，同时服务 45
              家全球人形机器人和具身 AI 客户，并推进万台级交付能力。这个说法很有揭示性：它描述的是仍在扩张的能力，不是已经完全成熟的运营系统。制造基础也没有营销暗示的那样自主。官方材料明确提到高端全球供应链、云端追溯、共享
              Yaskawa 供应链系统，以及 Everwin 精密加工支持。这些联系可以提升爬坡速度和质量，但也加深了 Tianji
              对更大生态的依赖，而这个生态并不完全由它控制。母公司层面的披露进一步强化运营风险。Everwin 的 HKEX proof
              显示库存规模大、存货减值上升、应收款大，并在风险因素中明确写到库存过剩、回款延迟和交付失误。即便这些数字是集团层面而非 Tianji
              单体，也展示了快速硬件扩张会带来的营运资金负担。结果是一种典型机器人执行风险：Tianji
              赢订单的速度，可能快过良率、服务响应、备件物流和现场可靠性的硬化速度。一旦发生，订单簿就不再是护城河，而会变成质量逃逸和声誉损害的来源。
