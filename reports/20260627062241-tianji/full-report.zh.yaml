      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >
              主要增长逻辑真实存在，但有条件。正面看，中国仍是全球机器人部署的锚点，国内协作机器人龙头正在快速放量，标准机构也在推动具身智能从概念走向可重复的工业部署。ABB、UR 和 Flex 都强调工业级协作机器人、AI
              驱动运动和面向电子行业的柔性自动化需求增强；A3 数据显示，2026 年协作机器人需求增速快于更广义的北美机器人市场。约束逻辑同样重要。Mordor、Fortune 和 MarketsandMarkets
              都把劳动力短缺和 ROI 视为顺风，但也强调前期集成成本、负载速度限制和存量工厂兼容问题。KUKA 和 Teradyne
              的上市公司披露又给出周期性警示：经济疲软、项目延期和客户资本开支克制，可能突然拖慢机器人与电子订单。对 Tianji 而言，最大未解问题是转化质量。公开来源显示应用场景有吸引力、品类增长面广，但没有披露
              Tianji 当前销售中研究用途与规模化工厂部署的比例、实际回本周期，或目标垂直行业的重复订单深度。因此，本章保留三组矛盾，而不是强行制造确定性：不同出版方给出的市场规模差异很大；许多工厂里的具身 AI
              热情跑在标准化采购前面；力控双臂硬件可能先具备战略重要性，之后才在统计上成为可单独拆出的市场。
