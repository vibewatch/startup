  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 按买方、用户、垂直行业、地域与渠道拆分客户基础
        blocks:
          - type: paragraph
            body: >
              公开证据指向一个混合 B2B 账本，而非单一客户原型。传统工业侧，Tianji 向覆盖
              3C、汽车电子、新能源、医疗、家电、食品、鞋服及相邻制造品类的工厂买方销售标准化工业机器人、控制系统和集成支持。在这些账户中，买方和付款方看起来是工厂管理、自动化工程或采购团队，日常用户则是生产、质量和维修操作人员。更新的具身
              AI 侧，买方更适合被描述为机器人制造商或具身 AI 开发团队，它们采购 Marvin 力控手臂、控制器和集成支持，作为赋能子系统，而不是成品人形机器人。

              公开记录仍以中国为先。Tianji
              的联系界面展示东莞总部以及上海、华东和西南办事处；其支持栈包括直接技术服务、培训、备件、软件和故障维修页面。这是工程驱动直营模式的运营形态，不是经销商驱动的目录销售。海外扩张可见但仍早期：2026 年媒体报道称
              Tianji 计划在北美本地化销售和技术支持团队；Baike 则称部分手臂已进入海外大学和研究实验室。实际分层结论是，Tianji
              正在同时变现工业自动化预算和人形机器人开发预算，服务强度高到部署支持已是产品的一部分，而不是附带服务。
