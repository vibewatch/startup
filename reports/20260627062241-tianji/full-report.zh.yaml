  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发项
    rows:
      - - 牛市
        - 未来 12-18 个月，订单簿转化为 >RMB500M 确认收入；自动化和一次通过率提升守住毛利率；客户群从少数锚定 OEM 向外扩展。
        - 公允价值 RMB8.5-12B；如果 Tianji 复利成长为头部具身 AI 基础设施平台，当前轮次可以成立，2.5x+ 总回报变得可想象。
        - 中低；需要执行兑现，也需要板块溢价延续。
        - 积压订单滑坡、ASP 压缩，或无法证明利润率质量。
      - - 基准
        - 真实需求存在，但收入转化更慢，客户集中度仍有分量，市场最终按工业同业区间上沿加部分战略溢价给 Tianji 定价。
        - RMB5.5-8.0B 公允价值；当前要价大体打满，而不是明显有吸引力。
        - 中；最符合当前证据质量。
        - 任何迹象显示订单只是试点，而非可持续量产项目。
      - - 熊市
        - 板块泡沫警示方向上被验证；采用节奏延后；新资本追逐过多相似公司；Tianji 无法证明强劲确认收入或韧性利润率。
        - RMB2.5-5.0B 公允价值；下轮降估值或重大减记风险变得真实。
        - 中低但不可忽视，因为当前倍数部分由热度驱动。
        - 公开市场倍数压缩、后续融资条款走弱，或集中度 / 取消数据恶化。
    notes: 情景价值是方向性估算，来自当前轮次标记、公开可比区间和基于里程碑的私募市场逻辑，而不是管理层指引。
