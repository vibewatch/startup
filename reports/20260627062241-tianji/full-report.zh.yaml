  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开可见的客户旅程从垂直行业自动化痛点出发，走向培训、部署和本地支持；人形机器人 OEM 子系统采用则另有一条分支。
    data:
      nodes:
        - label: 1. 痛点发现
          detail: 工业买方面临用工、良率和节拍瓶颈；人形机器人 OEM 需要稳定的力控手臂和低延迟控制。
          tone: neutral
        - label: 2. 技术评估
          detail: 买方评估应用适配度、控制器开放性、力控需求，以及培训 / 集成支持是否可得。
          tone: neutral
        - label: 3. 配置和验证
          detail: Tianji 会按部署场景调整方案，例如为 Zhongke Huiling 的抓取和轨迹任务提供无力控 Marvin，或交付特定产线工业单元。
          tone: positive
        - label: 4. 部署和验收
          detail: 公开证据包括向 Zhongke Huiling 首批交付，以及带有量化节拍、良率和用工结果的工业案例。
          tone: positive
        - label: 5. 支持和正常运行
          detail: 培训、故障维修、软件应用工具、备件和区域办公室支撑持续运行。
          tone: positive
        - label: 6. 扩张或流失风险
          detail: 复购取决于未披露的集中度、合同耐久性，以及 45 家 OEM 积压订单能否转化为已验收生产收入。
          tone: risk
