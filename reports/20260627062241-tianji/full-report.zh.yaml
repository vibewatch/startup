chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Tianji 的官方网页包括中文主页 tianjizn.com 和英文镜像 /en/，两者都以 “Tianji Robotics” 做品牌。工商与备案来源在法律实体名称 Guangdong Tianji
              Intelligent System Co., Ltd.、注册地址（东莞松山湖园区工业西三路 6 号 3 栋）以及 2015-05-18 成立日期上相互一致。官方关于页面也使用 2015
              作为创立年份，因此最干净的工作口径是：正式注册与经营历史起点大体都落在 2015 年，尽管部分后续英文金融数据库写作 2017 年。


              当前业务不只是人形机器人手臂。官方页面描述的产品栈覆盖协作机器人、SCARA 机器人、视觉配件、电动夹爪，以及 Marvin 家族下的力控双臂 / 人形机器人臂，并由 Tianji 自研 Fusion
              控制系统串联。公司在 2026 年报道中的当前定位是“具身 AI 基础设施”：Tianji 销售力控硬件、控制模块和机器人子系统，让以模型为核心的人形机器人与具身 AI
              公司能够执行物理任务。这一框架很重要，因为后续估值和市场分析应把 Tianji 看作带有传统工业机器人收入根基的组件 / 平台供应商，而不是纯全栈人形机器人 OEM。
