      - number: '8.2'
        title: 可比组基准：上市自动化、上市机器人与私有人形机器人估值
        blocks:
          - type: paragraph
            body: >-
              可比组指向三个不同方向，这正是 Tianji 难定价的原因。ABB、Rockwell、Fanuc 等大型全球自动化龙头约在 5.6x 至 7.5x 销售额交易，Teradyne 则高得多，约
              18.1x。中国上市自动化同行平均还更便宜：Inovance 约 3.7x，Siasun 约 5.9x，Estun 约 6.5x，EFORT 约
              9.5x。这些区间意味着，若按工业同行逻辑支撑当前标记，Tianji 需要约 RMB0.84-2.70 billion 年收入。上市纯机器人标的是多头情形的逃生口：UBTECH 约 34x 销售额，Doosan
              Robotics 约 120x，因此只需低得多的当期收入就能解释 Tianji
              价格。但这些更高区间也自带警示标签：它们反映的是稀缺性、战略可选性和市场热度，不只是已验证经济性。中国私有人形机器人可比公司进一步强化了这种热度。Galbot 和 AgiBot
              继续吸引大额融资，评论来源把国内头部估值区间放在 RMB10 billion 以上很远。Tianji 属于这个队列的讨论范围，但它的公开证据仍比隐含估值倍数更薄。
