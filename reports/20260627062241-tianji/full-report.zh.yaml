      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              买方地图更多按工作流痛点划分，而不是按机器人形态划分。电子和半导体工厂需要精密装配、测试搬运和紧凑的人机共享工作站；汽车和汽车零部件工厂需要拧螺丝、点胶、检测、分装配、表面处理和线边柔性；电池与新能源运营方需要点胶、扫描、上下料和检测工作站；实验室、教育机构和具身
              AI 开发者需要力感知、数据采集和可重编程双臂平台。在多数细分市场中，日常用户是工艺或制造工程团队，正式付款方则在工厂资本开支、自动化工程、运营或采购，而不是中央 IT。采用通常经历用例筛选、概念验证、安全 /
              风险评估、工艺调试，之后才进入多线 rollout。来自 A3、ABB、UR、Flex 和 Estun 的公开证据指向一个正在从传统汽车 OEM 工作站扩展到电子、物流、生命科学和一般制造的市场。这有利于
              Tianji，因为在产品组合频繁变化、工作空间受限、人工灵巧度仍重要，或买方想要具身 AI-ready
              硬件栈而非固定功能机器人时，力控和双臂系统最有价值。代价是销售摩擦：这些买方通常需要应用工程、集成伙伴和产线认证证据，才会释放有意义的预算，因此早期管线广度不会自动转化为经常性收入。
