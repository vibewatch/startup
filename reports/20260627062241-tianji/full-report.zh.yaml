  - id: TR005
    title: 缓解和退出标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 安全 / 责任
        - 可记录现场事故、客户停机、召回或监管问询
