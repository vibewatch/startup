        - 工厂经理、工艺工程、采购
        - 基于 IFR、A3、Estun、UR 和 Flex 证据，最可能的近端工业需求池
      - - 服务 / 实验室 / 教育机器人邻近
        - 研究平台、实验室自动化、诊断、教育、智慧零售或餐饮服务 cobot 工站
        - 没有操作或力控需求的通用服务机器人
        - R&D、教学实验室、创新预算或运营预算
        - 有助于早期收入和数据生成，但估值质量低于重复性工厂项目
