        - 子公司层面的审计或董事会级财务包，包含收入桥接和利润率数据。
      - - 竞争
        - 私募资本流向显示，Tianji 应与 AgiBot、Galbot 放在同一张桌上讨论，而不是边缘硬件供应商。
        - 高估值同业并不证明 Tianji 应拿到同样标记；部分同业拥有更公开的资本通道或更宽叙事。
        - 证明行业标准化时 Tianji 仍能守住份额和定价权。
      - - 结构
        - 本轮质量可能帮助公司在竞争对手之前招人、扩张并赢得战略合作。
        - 即使企业价值增长，未披露的优先权条款也可能吃掉普通股上行。
        - 完整股权结构、清算优先权、反稀释权和董事会控制摘要。
    notes: 每一行都把最强的多头证据和最重要的反向制衡放在一起；缺失证据被有意展示，而不是被抹平。
