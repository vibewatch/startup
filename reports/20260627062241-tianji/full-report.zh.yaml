      - number: '8.3'
        title: 投资 thesis、反 thesis 与情景区间
        blocks:
          - type: paragraph
            body: >-
              投资 thesis 并非空想。Tianji 似乎具备许多人形机器人公司仍缺少的三样东西：产品化的运营子系统供给、一些量产执行证明，以及愿意为具身 AI
              基础设施支付溢价的资本财团。官方和保留媒体来源支持这样一种判断：Tianji 试图成为下一波人形机器人 OEM
              的标准化“手臂和小脑”供应商，而不是一开始就正面竞争全栈通用机器人品牌。如果这个位置能把报告中的积压订单转为数亿人民币确认收入，同时守住良率和自动化改善，当前轮次仍可能跑通。反 thesis
              是，本轮价格已经跑在公开证据当前可承销范围前面。仍然没有 Tianji 独立收入桥、披露
              ASP、毛利率、现金消耗披露，或公开优先权栈细节。这意味着投资人买入的更多是未来规模的期权价值，而不是当前经济性的确定性。因此，下方情景表比头条融资更重要：基准情形仍低于当前要价，多头情形可以越过它；若收入质量被证明前行业热度降温，空头情形会大幅重置。
