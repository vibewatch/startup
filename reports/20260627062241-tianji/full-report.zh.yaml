      - number: '7.5'
        title: 财务、治理与 thesis-break 风险
        blocks:
          - type: paragraph
            body: >-
              财务上，最大问题不是缺少需求信号，而是缺少干净的子公司层面转化数据。2024 年 Everwin 文件显示，Tianji 在 2023 年前九个月仍亏损；母公司 2026
              年一季报显示经营现金流为负，具身智能投资压力更高。HKEX 申请 proof 给出更尖锐的风险结构：高库存、有意义的应收款、存货减值和客户集中，一旦硬件需求波动，都会叠加放大流动性风险。治理相比 Everwin
              控制 Tianji
              时已有改善，但还不简单。历史母公司担保、当前关联方流动、稀疏的公开董事会细节，以及围绕陈曦的高管中心性，都指向一家仍需尽调保留事项、董事会构成和冲突管理规则的公司。出口管制和海外扩张风险放大了同一不确定性。BIS
              继续收紧针对中国先进 AI 和芯片的管制，Commerce Control List 框架意味着，随着 Tianji 试图进入北美供应链，组件分类和许可纪律更加重要。只要发生四件事之一，投资 thesis
              就会破：重大安全或召回事件；订单与可收款收入之间的缺口被揭示；母公司依赖卷土重来并限制治理独立；或贸易 / 合规扰动阻断关键组件或客户。在这些问题清除前，正确投资姿态应基于里程碑，而不是由估值牵引。
