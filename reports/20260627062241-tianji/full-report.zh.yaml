      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              Tianji
              的监管和法律边界，比常见私营机器人初创公司的叙事更宽。注册和备案来源显示，其经营范围覆盖机器人开发与制造、工业系统服务、二类医疗器械相关产品，以及需审批的进出口活动。这一点重要，因为主要公开风险不是已知执法行动，而是部署越来越受安全监管、责任控制公开披露却仍偏薄之间的错配。中国现在已有一套现行机器人安全标准，覆盖工业应用、协作机器人和通用机器人安全；ABB
              的 2026 年行业说明也强调，买方在复杂协作任务中越来越期待工业级耐久性、精度和合规性。Tianji 自己的材料正迎合这些期待，宣传全轴扭矩感知、可选六轴力感知、柔顺控制指标和 7x24
              耐久性主张。如果真实世界可靠性落后于营销性能包络，下行不只是保修成本，还包括事故责任、部署延迟和采购资格被取消。法律卫生也不是无瑕，而是不够干净。Aiqicha 报告 5 起立案案件、6 条开庭公告和 6
              条诉讼关系。对一家硬件公司来说，这是温和基线，但足以要求审阅案卷，而不能笼统说“没有诉讼风险”。另一层合规细节是资质风险：Tianji 公开宣传高新技术和 Little Giant 类荣誉，但 2026 年
              MIIT 规则明确，这些称号若存在虚假或不一致数据，可以复核并撤销。尽调的关键要求不是 Tianji
              是否有一串认证或荣誉营销清单，而是公司能否拿出最新安全测试记录、质量逃逸历史、产品责任保险，以及每个未结法律事项的清晰解释。
