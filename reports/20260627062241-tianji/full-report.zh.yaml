    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 把产品验证、订单信号、披露缺口、可比区间和赛道热度串起来，落到跟踪建议。
    data:
      nodes:
        - id: proof
          label: 验证信号：Marvin 产品家族、十年运营历史、2025 年据报 >2,000 台双臂交付
        - id: demand
