  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险展望与投资含义
        blocks:
          - type: paragraph
            body: >-
              最严重的风险不是头条里的融资或估值争论，而是 Tianji 已承诺扩产之后，可能击穿转化、利润率或可保险性的风险。第一是安全和产品责任暴露。Tianji
              正把力控双臂系统卖进人与机器共享的工业和准服务环境，它自己的产品和发布材料强调扭矩感知、柔顺控制、过载容忍和双臂同步运动。这些是优势，但也意味着一旦现场失效，外界会按现行中国机器人安全标准，以及买方对工业级协作性能不断抬高的预期来衡量。第二是残余
              Everwin 依赖。Everwin 已从控制地位稀释为大股东，但公开文件仍显示关联方交易、历史担保支持、共同的工业 DNA，以及持续的制造和客户邻近性。第三是转化质量：Tianji 公开声称 2025 年交付
              2,000 多台、2026 年 Q1 订单 10,000 多台，但最硬的财务锚点仍是 2023 年子公司亏损快照和母公司层面的营运资金压力。第四是客户、市场和地缘政治脆弱性。具身 AI
              市场正在快速吸引资本，既有厂商也在提示激进定价和项目延迟；美国围绕先进 AI 和两用技术收紧出口管制，增加了关键投入或海外 go-to-market 动作在 Tianji
              进入北美时变难的概率。实际含义是：这家公司值得继续尽调，但只能按里程碑承销。安全、订单转化、关联方治理和支持网络就绪度必须先过关，2026 年估值才可被视为可投资，而不是愿景定价。
