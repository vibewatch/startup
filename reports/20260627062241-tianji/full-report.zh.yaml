      - number: '6.4'
        title: 留存韧性、集中度风险与采购摩擦
        blocks:
          - type: paragraph
            body: >
              韧性是公开记录最弱的地方。已审阅来源没有披露 Tianji 的
              NRR、GRR、流失率、续约率、合同期限、积压订单账龄、取消率，或按客户划分的收入集中度。缺口本身就有信息量：投资人能看到出货动能和支持基础设施，但还无法判断 45 家 OEM
              队列到底有多粘，工业客户是否以有意义的频率复购，人形机器人订单是分散在许多小 design win 里，还是集中在少数大客户手中。Toutiao
              一篇特写甚至称工业协作机器人和人形双臂各贡献约一半收入，但没有提供可达到申报文件级别的支撑，应视为低置信度媒体描述，而非权威分部数字。

              采购摩擦比留存更容易观察。Tianji 的服务面需要培训、软件层集成、备件和售后故障维修；其 2021 年会议文章称，部分控制器功能向客户开放二次开发；中科慧灵证据也显示，配置按任务需要定制，而不是作为单一
              SKU 销售。几项合在一起，意味着一个技术性强、按客户定制的集成周期。反面证据也有：QCC 列出 2022 年销售合同纠纷和后续民事案件通知，说明商业 / 法律摩擦并非字面意义上的零。与此同时，2024 年
              Everwin 文件显示，Tianji 在 2023
              年披露收入仍不高，却还依赖母公司担保和贷款，因此不能把宽泛的客户数量声明等同于多元化现金生成。主要商业风险因此不是没有客户，而是哪批客户真正贡献耐久收入、每个部署赢下并支持起来要花多少成本，这些仍不透明。
