        title: 分销、信任与切换成本
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争缺口不是执行器性能，而是分销和运营信心。UR 保留下来的页面突出软件、生态、合作伙伴指导和服务；Teradyne 的文件显示，UR 位于一个拥有全球安装基础的大型上市公司机器人板块内。Doosan
              将工业应用与公开 IR 资料室和分销商驱动的渠道姿态搭在一起。ABB 和 Doosan 都受益于买方把它们理解为老牌自动化供应商，而非狭窄的具身 AI 组件供应商。Tianji 正试图用 2026
              年融资建设海外销售和技术支持来缩小差距，但其公开页面仍更偏产品，而非渠道。这会影响切换成本。项目早期，买方往往可以多宿主测试，把 Tianji 与基于 UR、Doosan、UFACTORY 或 Dobot
              的工作站并排比较。只有当客户围绕 Tianji 的特定架构调好了同步双臂行为、力控参数、安全验证和数据采集工作流之后，切换成本才会显著升高。
