  title: Tianji is more than a funding headline — it has real shipped hardware
  body: The strongest positive signal in this chapter is not the May 2026 unicorn round but the combination of concrete product specs, legacy industrial-robot operations, and recent force-controlled dual-arm delivery claims. Public evidence supports that Tianji is shipping real hardware into humanoid and embodied-AI supply chains, which is a stronger base than a concept-only startup would have.
