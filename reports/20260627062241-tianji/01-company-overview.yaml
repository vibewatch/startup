  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: everwin-ownership
    missingEvidence: A post-B/B+ shareholder register or board-approved capitalization table showing Everwin’s exact current percentage and control rights.
    whyItMatters: Whether Everwin is controller, largest shareholder, or merely a strategic minority holder affects governance, related-party analysis, and group-dependency risk.
    diligencePath: Request the latest cap table, shareholder agreement, and any reserved-matters schedule from management or lead investors.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: The signed May 2026 term sheet or board resolutions confirming the exact pre- and post-money valuation.
    whyItMatters: A range of RMB8bn to nearly RMB10bn is too wide to reuse as a single canonical input for valuation work.
    diligencePath: Obtain the B/B+ financing documents and investor presentation used in the round.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: total-raised
    missingEvidence: Exact gross proceeds and dates for the 2025 A/A+ round and any other undisclosed bridge capital.
    whyItMatters: Without exact intermediate-round sizing, lifetime capital raised and dilution cannot be precisely computed from public evidence.
    diligencePath: Request the financing history schedule from management or investors and reconcile it to the cap table.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current-revenue
    missingEvidence: 2024, 2025, and 2026 year-to-date standalone revenue, gross margin, and customer concentration for Tianji.
    whyItMatters: The chapter can prove pre-scale losses and order claims, but not current commercial efficiency or revenue conversion.
    diligencePath: Obtain monthly management accounts, audited statements if available, and customer-level revenue breakdown.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: minor
    topic: governance-depth
    missingEvidence: Board composition, independent-director status, committee structure, and investor governance rights after the 2024 and 2026 financings.
    whyItMatters: Governance depth is material for key-person risk and minority-investor protections, but the chapter can still establish the basic leadership roster without it.
    diligencePath: Request board list, board observer rights, voting thresholds, and any reserved-matter list from counsel or company management.
    relatedQuestionRefs:
    - QO012
    - QO013
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A current employee census that reconciles insured employees, contractors, and R&D staff counts.
    whyItMatters: Headcount is a common shorthand for scale, but public sources currently disagree by roughly a factor of two.
    diligencePath: Request current organization chart and HR headcount by payroll entity and function.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: stale
    severity: minor
    topic: TO004 milestone chronology still lacks exact dates for some 2025 and 2026 events because public coverage is partly year-level.
    missingEvidence: Exact closing dates for the 2025 A/A+ round, 2025 dual-arm delivery milestone, and ICRA 2026 showcase details.
    whyItMatters: The milestone table is the chronology of record, so partial dating should stay explicit until source-level precision improves.
    diligencePath: Ask management for a dated financing and product milestone timeline, then reconcile it to press releases and investor materials.
    relatedQuestionRefs:
    - QO010
    - QO021
    relatedTableRefs:
    - TO004
