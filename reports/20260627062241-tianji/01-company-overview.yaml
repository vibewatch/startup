- id: ownership-funding-capitalization
  title: Ownership, Funding History, and Capitalization
  body: 'Tianji’s ownership story is more nuanced than headline coverage suggests. Historically, the company was incubated inside Shenzhen Everwin Precision and for years was effectively controlled by that parent. However, Everwin’s February 2024 filing is the primary source that resets the baseline: Everwin sold 30% of Tianji and waived preemptive rights in a capital increase, reducing its stake from 78% to 40% and causing Tianji to exit Everwin’s consolidated financial statements. Subsequent 2026 media and profile sources report Everwin around 27% after later financings, which is consistent with further dilution but inconsistent with EqualOcean’s simplified description of Tianji as a wholly owned subsidiary. That discrepancy is important enough to preserve rather than smooth over.


    Financing history is also partly observable and partly opaque. Public sources agree on a May 2026 combined Series B and B+ round totaling RMB1 billion with GL Ventures/Hillhouse and Meituan Strategic Investment as co-leads, plus Tencent, Gaorong, Luminous/Photosynthetic Ventures, and GGV/Granite. What is less clean is valuation: EqualOcean reported an RMB8 billion post-money figure, while 36Kr, Yicai, NetEase, and EmbodiedGlobal framed the company as nearly RMB10 billion post-money. Earlier financing is only partially visible through 36Kr/PitchHub, QCC, and Baike: a March 2024 strategic financing tied to Hidden Hill / GLP Hidden Hill, and a 2025 A or A+ round involving GGV, SAIF, and CMBI, with amounts undisclosed. Because the 2025 round size is not public and exact post-B ownership is not backed by a fresh filing, later valuation work should treat exact lifetime capital raised and current dilution as unresolved diligence points rather than hard facts.'
