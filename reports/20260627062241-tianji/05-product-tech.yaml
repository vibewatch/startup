- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - Marvin M6CCS certification claims
    - Official page lists CE, ISO/TS 15066, ISO 13849-1 PLd, EN 60204-1 and EN ISO 12100
    - Applies to published Marvin family safety/compliance positioning
    - No downloadable certificates or test reports on retained public pages
  - - Virtual fence
    - Official optional feature
    - Software-defined restricted-zone monitoring that cuts servo power before boundary breach
    - No public proof of performance level, validation method or model compatibility matrix
  - - Soft floating / force control
    - Official optional feature
    - Uses external-load-aware floating and force algorithms for precision tasks
    - No public parameter ranges, tuning guidance or failure-mode documentation
  - - Training center
    - Official support page
    - Safety, tool calibration, external signals, variables and advanced program logic training
    - No public certification of trainers, completion standards or audit trail
  - - Spare parts and traceability
    - Official spare-part page plus about-us quality narrative
    - Part numbers, inspection checkpoints and cloud traceability claims
    - No public service SLA, parts lead-time or warranty policy
  - - Cyber / privacy / vulnerability handling
    - Not publicly visible in retained sources
    - Would matter most for controllers, networking and teleoperation/data capture
    - Missing security policy, privacy notice, vulnerability disclosure and patch cadence
  notes: 'The final row is intentionally a null-signal row: absence of public evidence is itself material for enterprise diligence.'
