  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: developer-stack
    missingEvidence: Marvin-specific SDK/API documentation, versioning notes and integration guides that show how third parties actually develop on top of the dual-arm platform.
    whyItMatters: Industrial software pages prove some developer surface exists, but investors still cannot tell whether Marvin integrations are turnkey, partner-gated or custom-engineering heavy.
    diligencePath: Request the current Marvin developer package, controller API index, sample code and version-history notes used by external integrators.
    relatedQuestionRefs:
    - QE009
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: workflow-proof
    missingEvidence: Cell-level throughput, yield, labor-reduction and payback data for the retained application cases.
    whyItMatters: The official cases prove deployment patterns, but not whether Tianji’s cells deliver durable financial outcomes or only technical feasibility.
    diligencePath: Ask for customer-approved before/after KPIs on at least one TR8 CNC cell, one automotive assembly cell and one SCARA vision-sorting cell.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE002
  - type: missing-source
    severity: material
    topic: safety-compliance
    missingEvidence: Downloadable certificates, third-party test reports or notified-body references that independently validate Marvin compliance claims.
    whyItMatters: Without the underlying artifacts, safety/compliance claims remain marketing assertions instead of diligence-grade evidence.
    diligencePath: Request CE declaration files, ISO/TS 15066 and ISO 13849-1 validation packs, and any functional-safety architecture summary for Marvin.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: security-gap
    missingEvidence: A public or customer-shareable security policy, vulnerability-disclosure path, software-update process and privacy treatment for teleoperation/data capture.
    whyItMatters: Networked controllers and embodied-data workflows create enterprise IT and privacy exposure that cannot be underwritten from the retained public record.
    diligencePath: Request Tianji’s secure-development lifecycle, patching cadence, remote-access architecture, privacy/data-retention policy and incident-response owner.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: product-maturity
    missingEvidence: Field-reliability data such as MTBF, uptime, failure modes, service-call rates and spare-part lead times for Marvin and core industrial lines.
    whyItMatters: Scaled deliveries and visible support surfaces are encouraging, but they are not substitutes for reliability evidence when underwriting fleet deployment risk.
    diligencePath: Request service logs, warranty claims, MTBF curves, onsite response SLAs and top-five failure categories by product family.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: roadmap-scale
    missingEvidence: An official public product page for heavier Marvin variants such as M20 or for the teleoperation/data-collection platform described in third-party 2026 coverage.
    whyItMatters: The roadmap appears to extend beyond M6CCS, but the public official surface has not yet caught up to every capability highlighted by the media.
    diligencePath: Ask management for the current Marvin lineup deck, commercialization stage by variant and the customer-readiness criteria for teleoperation/data-collection products.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE005
