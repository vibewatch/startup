- id: trust-safety-security-risks
  title: Trust, safety, security, compliance and residual product risk
  body: 'The public trust surface is mixed. On the positive side, Marvin pages explicitly list CE, ISO/TS 15066, ISO 13849-1 PLd, EN 60204-1 and EN ISO 12100 claims; optional features add virtual fencing and soft-floating behaviors intended to constrain motion or absorb external load; and the training center teaches safety as a first-class topic. On the negative side, the website does not publish downloadable certificates, test reports, product-security policies, privacy materials for teleoperation or data collection, vulnerability-disclosure channels, SBOMs, or software patch histories. Public downloads are still weighted toward legacy industrial robots and accessories, not toward Marvin-specific controller SDKs or enterprise IT controls. That does not disprove product quality, but it means product risk remains concentrated in evidence that only management can currently provide: independent compliance artifacts, failure-rate and uptime data, field-service SLAs, and a credible security/update
    regime for controllers and remote-operation tooling.'
