- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Tianji solution
  - Measurable benefit
  - Limitation
  rows:
  - - 3C visual sorting and loading
    - Unordered small-part feed with orientation ambiguity
    - SR3 / SR3D SCARA linked to camera via 9-point calibration and orientation judgment
    - Official case claims 0.05mm accuracy and precise placement
    - No public cycle-time, yield or payback disclosure
  - - Automotive subassembly
    - Multiple switch / metal-piece stations with CCD positioning
    - TR8 plus visual positioning, grasping and hole-position inspection inside an eight-station indexed cell
    - Official case claims special-angle handling with high precision and stability
    - No public deployment count, uptime or service burden data
  - - CNC machine tending
    - Operators wait for machine completion, reload manually
    - One TR8 tends two CNC machines and swaps workpieces immediately after machining
    - Official case claims reduced waiting and higher efficiency
    - No quantified spindle-utilization uplift or labor bridge
  - - Food-handling / washdown
    - Humid or washdown environments that challenge standard arms
    - TR8-HM food-industry robot with IP67 positioning
    - Public page explicitly frames suitability for washdown environments
    - No public sanitation certification set beyond ingress wording
  - - Embodied-AI data capture / teleoperation
    - Need physical-world manipulation data and dual-arm teleop
    - Marvin Pro narrative combines cameras, Jetson Orin, ROS2 and VR teleoperation around force-controlled arms
    - External 2026 coverage suggests tighter bridge from remote operation to model training
    - Official downloadable docs for this workflow are still sparse
  notes: Benefits are limited to public claims from case pages and retained coverage; no row should be read as a validated ROI study.
  claimRefs:
  - CE010
  - CE017
  - CE033
  - CE034
  - CE035
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Robot bodies (Marvin / Pilot / TR / EVO / SR)
    - Physical manipulator options matched to payload, reach and environment
    - Mechanical platforms, integrated joints, torque sensing where applicable
    - Portfolio breadth is visible, but cross-family lifecycle and interchangeability are not published
  - - Controller hardware (TRC-Micro / SRC-Micro)
    - Executes motion programs, IO and encoder interfaces
    - Dedicated cabinets, AC power, field IO and pendant
    - No public firmware lifecycle, secure-boot or patch-management disclosure
  - - Development and simulation software
    - Secondary development, virtual teaching and coordinated-task verification
    - MotoPlus IDE/API, MotoSim EG-VRC, network and serial links, sensor feeds
    - Public developer docs emphasize industrial stack; Marvin-specific SDK depth is unclear
  - - Optional motion functions
    - Adapts robot to conveyors, force tasks, floating, palletizing and safe boundaries
    - Additional-function software packages and sometimes extra hardware
    - Unknown which functions are licensed versus bundled and how they differ by model
  - - Application engineering
    - Binds vision, fixtures, CCD, CNCs and workstations into a working cell
    - Tianji integrators plus customer line equipment
    - Public evidence is case-page level; no standardized deployment methodology or timeline disclosure
  - - Quality / supply loop
    - Maintains manufacturing precision, testing and traceability
    - Yaskawa-linked supply chain, Changying machining, testing devices, cloud traceability
    - Concentration and substitution risk are not publicly quantified
  notes: This architecture compresses multiple official pages into one operating model. Items missing from public pages are presented as risks rather than inferred capabilities.
  claimRefs:
