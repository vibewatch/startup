- id: deployment-integration-support
  title: Deployment, integration and support model
  body: 'Deployment evidence points to an engineering-led integration model. Tianji publishes training modules that move from safety and coordinate-system basics through tool calibration, external signals, variables, and advanced program logic. It also publishes spare-part numbers, a download center containing manuals, videos, brochures, and CAD-style assets, and software pages that describe direct sensor, network, and serial integration. The application cases reinforce that this support stack is used to tune real cells: camera-linked orientation detection for 3C parts, CCD-guided automotive subassembly workstations, and two-CNC tending by one TR8 robot. Optional features further reduce deployment friction by handling conveyor tracking, floating under external load, or palletizing through templates rather than bespoke code. Developer-signal is strongest in recruiting: current job posts explicitly ask for humanoid-arm control algorithms, system integration, SLAM, and reinforcement learning,
    which implies the company is still building out embodied-control capabilities instead of freezing the stack at brochure stage.'
