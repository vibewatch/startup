- id: module-map-and-architecture
  title: Module / SKU map and operating architecture
  body: The official architecture is layered. At the robot-body layer, Tianji exposes Marvin dual-arm systems, Pilot collaborative arms, TR and EVO six-axis robots, SR and SRZ/SRX SCARA products, and food-industry variants. At the control layer, TRC-Micro and SRC-Micro controllers expose memory, IO, and encoder interfaces sized for industrial cells rather than hobby deployments. At the software layer, the company publishes MotoPlus secondary-development support, MotoSim EG-VRC virtual teaching, and a menu of optional functions such as force control, soft floating, conveyor tracking, fixed TCP, palletizing, helical interpolation, and virtual fencing. Optional hardware extends the stack with teaching pendants, EtherNet/IP IO hubs, and IP54 controller protection boxes. The result is not just a list of arms; it is a modular operating system for factory automation that Tianji can repurpose into force-controlled dual-arm embodied-AI applications. The weakness is that the public software surface
    is still stronger for industrial cells than for Marvin-specific APIs or security controls.
