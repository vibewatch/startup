- id: TE005
  title: Roadmap / release / development-stage table
  columns:
  - Date / stage
  - Feature / milestone
  - Status
  - Implication
  - Source
  rows:
  - - 2017 foundation stage
    - Industrial robot company launches TR, SR, high-speed SCARA and food-robot lines
    - Officially described as historical base
    - Shows embodied products were layered on top of an older automation business
    - About-us page
  - - 2024-04 public milestone
    - Force-control humanoid arm introduced
    - Third-party reported
    - Marks transition from industrial-only catalog into embodied-intelligence manipulation
    - QQ / 163 / RobotToday
  - - 2025 production milestone
    - Force-control humanoid dual-arm reaches mass production and 2,000+ four-month deliveries
    - Third-party reported
    - Suggests Marvin moved beyond lab prototype status
    - QQ / InfoQ / ITHome
  - - 2026 scale-up milestone
    - Q1 orders exceed 10,000 and financing earmarked for R&D, mass production and global sales network
    - Third-party reported
    - Roadmap emphasis is manufacturing scale and sales build-out, not just feature expansion
    - Yicai / EqualOcean / InfoQ / ITHome
  - - Current public-doc stage
    - Industrial stack has visible training, downloads, controllers and optional features, while Marvin-specific public docs remain thinner
    - Directly observed
    - Investors should separate brochure maturity from publicly documented developer maturity
    - Download center / software-app / Marvin pages
  notes: Rows mix official history and recent independent reporting. The roadmap is therefore “publicly visible stage signals,” not a management-approved product roadmap.
