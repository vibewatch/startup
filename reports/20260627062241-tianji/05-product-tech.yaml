- id: differentiation-manufacturing-maturity
  title: Differentiation, manufacturing base and product maturity
  body: 'Tianji’s core differentiation is the combination of an existing industrial-robot base with a force-control manipulation push. Officially, it claims 289 patents, 33 software copyrights, more than 140 R&D staff, joint labs with HKUST, SJTU and HIT, and a quality system that uses precision testing devices, cloud traceability, and Yaskawa-linked supply chains. External 2026 coverage adds the more aggressive embodied-intelligence narrative: MEMS torque sensing, one-board dual-arm coordination, teleoperation plus data-capture infrastructure, and recent scale signals such as 2,000-plus dual-arm deliveries in four months and 10,000-plus Q1 2026 orders. Those third-party claims are still partly promotional, but they are directionally consistent with the official product matrix and with recruiting evidence around control algorithms and SLAM. The upshot is that Tianji looks more mature than many dual-arm startups on manufacturing and industrialization, while still carrying disclosure risk
    around which Marvin-era capabilities are proven at customer scale versus still on the roadmap.'
