tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Marvin dual-arm family (M3 / M6CCS / M6SRS)
    - Humanoid OEMs, embodied-AI integrators, precision-assembly users
    - Commercially presented; Marvin M6CCS page is live and 2026 media cite scaled deliveries
    - 7 joints per arm, torque sensing on all axes, dual-arm force-control positioning
    - Need independent reliability and certification evidence beyond official pages and promotional media
  - - Pilot 7 collaborative arm
    - Factory automation teams needing human-safe collaboration
    - Current catalog SKU
    - 7-axis arm with Ethernet TCP/IP + EtherCAT and richer base IO than legacy brochure-only cobots
    - Need public case studies proving production deployment density
  - - TR series six-axis robots
    - Machine-tending and assembly integrators
    - Mature industrial SKU
    - 8kg / 818mm / IP67 with multiple real application pages
    - Need current price sheet and MTBF / service interval disclosure
  - - EVO series six-axis robots
    - Small-to-medium payload industrial users
    - Current catalog family
    - Load ladder from 4kg to 25kg and multiple reaches on one page
    - Need clearer public segmentation versus TR family and application-specific tooling guidance
  - - SR / SRZ / SRX SCARA families
    - 3C, medical, packaging and high-speed pick-place users
    - Current catalog family
    - Coverage from light SCARA to high-speed 0.26s cycle-time models
    - Need public documentation on controller commonality, lifecycle status and installed-base mix
  - - Robot controllers + software
    - Integrators and controls engineers
    - Current catalog layer
    - TRC/SRC hardware plus MotoPlus and MotoSim create an operating stack, not just a robot arm
    - Need Marvin-era public API docs, versioning and cybersecurity posture
  - - Optional functions + peripherals
    - Cell designers adapting robots to line constraints
    - Current catalog layer
    - Virtual fence, soft floating, conveyor tracking, fixed TCP, IO hubs and protection box reduce bespoke engineering
    - Need clearer packaging of which functions are standard, licensed or model-specific
  - - Training / spares / downloads
    - Plant maintenance, operators and system integrators
    - Current support surface
    - Training curricula, spare-part SKUs and downloadable files show support intent
    - Need public service SLAs, regional support coverage and Marvin-specific maintenance documentation
  notes: Status/maturity reflects what is visible on 2026-06-27 official pages plus retained 2025-2026 coverage; it is not a substitute for shipment-by-SKU data.
