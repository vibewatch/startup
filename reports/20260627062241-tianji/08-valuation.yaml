- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market
    - Humanoid robotics still has a real long-duration TAM narrative and capital is concentrating behind
      leaders.
    - Official caution on bubble risk means capital-market support can reverse before widespread commercial
      adoption arrives.
    - Named customer expansion and sustained deployment growth despite cooler sector sentiment.
  - - Product
    - Marvin is a standardized product family and the company is positioning itself as an embodied-AI
      subsystem standard.
    - Public evidence still shows product family and operating claims, not independent benchmarks on economics
      or durability.
    - Independent product benchmarks, serviceability data, and realized ASP / gross-margin disclosure.
  - - Customers
    - Reported 10,000-plus orders and 45 OEM / embodied-AI customer coverage imply real demand.
    - Public sources do not show concentration, cancellation rates, revenue recognition, or how many customers
      are actually repeat-paying.
    - Backlog aging, top-customer concentration, and named customer references.
  - - Financials
    - Everwin parent scale and manufacturing depth suggest Tianji can ramp harder than a thinly capitalized
      startup.
    - Tianji standalone revenue, gross margin, burn, and capex allocation remain undisclosed.
    - Subsidiary-level audited or board-level financial package with revenue bridge and margin data.
  - - Competition
    - Private capital flows show Tianji belongs in the same conversation as AgiBot and Galbot rather than
      as a fringe hardware supplier.
    - Premium peer valuations do not prove Tianji deserves the same mark; some peers have better-publicized
      capital access or broader narratives.
    - Proof that Tianji can hold share and pricing power as the field standardizes.
  - - Structure
    - Round quality may help recruit, scale, and win strategic partnerships before rivals do.
    - Undisclosed preference terms can absorb common-equity upside even if enterprise value grows.
    - Full cap-table, liquidation preferences, anti-dilution rights, and board-control summary.
  notes: Each row pairs the strongest available bull point with its most important counterweight; missing
    evidence is intentionally shown, not rounded away.
