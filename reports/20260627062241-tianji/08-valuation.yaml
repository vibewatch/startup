slug: tianji
runDate: '2026-06-27'
company:
  name: Tianji
chapter:
  number: 8
  title: Valuation
  summary: 'Tianji''s May 2026 RMB1 billion Series B/B+ round at a reported roughly RMB8-10 billion post-money
    valuation is credible as a signal of investor demand, productization, and reported order momentum,
    but not yet fully supported by public financial disclosure. Public comps split sharply between Chinese
    industrial-automation peers trading around 3.7x-9.5x sales and premium listed robotics names like
    UBTECH and Doosan trading around 34x and 120x sales, which means Tianji''s current mark is best interpreted
    as a scarce pure-play embodied-AI option rather than as a disclosed industrial business. The recommendation
    is track: the company looks real, the price still looks stretched, and the upgrade path depends on
    proving revenue conversion, margins, and cap-table terms.'
sections:
- id: financing-context
  title: Current financing context and entry discipline
  body: 'Tianji''s May 2026 B and B+ financing is large enough to matter and small enough to force price
    discipline. Retained English and Chinese coverage converges on RMB1 billion of new money and a roughly
    RMB8-10 billion post-money valuation. That is credible evidence of strong investor demand and strong
    investor quality, but it does not by itself prove that the price is underwritten by public operating
    data. The same retained sources show why investors were interested: Tianji has a standardized Marvin
    dual-arm product family, a longer company history than many humanoid peers, more than 2,000 reported
    dual-arm deliveries in four months of 2025, and more than 10,000 units of Q1 2026 orders across 45
    global humanoid OEM and embodied-AI accounts. Those are real commercialization signals. The problem
    is the structure gap. Public reports disclose the round size, the syndicate, and the use of proceeds,
    but not liquidation preferences, anti-dilution terms, board control, secondary mix, or subsidiary-level
    revenue conversion. A disciplined investor should therefore treat the round as proof of interest,
    not proof that today''s price is safe.'
