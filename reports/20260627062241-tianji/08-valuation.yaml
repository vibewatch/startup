  evidenceGaps:
  - type: missing-source
    severity: material
    topic: preference-overhang
    missingEvidence: Signed Series B and B+ term sheets showing liquidation preferences, anti-dilution
      clauses, board rights, and any secondary-sale component.
    whyItMatters: Headline post-money does not tell a common-equity investor how much upside is actually
      left after the stack is honored.
    diligencePath: Obtain the executed financing documents and build a cap-table waterfall.
    relatedQuestionRefs:
    - QV027
  - type: missing-source
    severity: blocking
    topic: standalone-financials
    missingEvidence: Tianji standalone 2025 and Q1 2026 revenue, gross margin, cash burn, and booked-versus-recognized
      revenue bridge.
    whyItMatters: This is the shortest path from narrative validation to valuation validation; without
      it, the current mark cannot be fully underwritten.
    diligencePath: Request board pack or audited subsidiary statements and reconcile them to Everwin disclosure.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: order-concentration
    missingEvidence: Top-customer concentration, cancellation rates, backlog aging, and geographic mix
      behind the reported 10,000-plus order figure.
    whyItMatters: A large backlog is only valuable if it is diversified, durable, and likely to convert
      into revenue on time.
    diligencePath: Sample CRM / ERP extracts, customer contracts, and aging reports with customer identifiers
      masked if necessary.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Board-level view on whether Tianji is being prepared for standalone IPO, parent carve-out,
      strategic sale, or repeated private rounds.
    whyItMatters: Exit path changes both required entry price and acceptable holding period.
    diligencePath: Ask management and lead investors for capital-markets roadmap and likely banker process.
    relatedQuestionRefs:
    - QV025
  - type: conflicting-data
    severity: minor
    topic: exact-post-money
    missingEvidence: A definitive post-money valuation and pre-money share count rather than a media range
      clustered around “near RMB10 billion” or “near RMB100 billion”.
    whyItMatters: A 20-25% swing in the starting mark is material for return math even if the directional
      conclusion stays the same.
    diligencePath: Request signed board resolutions or financing close memo with share count and price
      per share.
    relatedQuestionRefs:
    - QV002
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable coverage
    missingEvidence: More private humanoid rounds with both disclosed valuation and disclosed operating
      denominator so the comparable table can cover a broader private set.
    whyItMatters: TV004 intentionally covers only disclosed public and private references; the missing
      private rows widen uncertainty around where Tianji sits inside the leader cohort.
    diligencePath: Collect board decks, banker materials, or verified term-sheet summaries for additional
      leader rounds and extend TV004 when disclosed data becomes usable.
    relatedQuestionRefs:
    - QV017
    relatedTableRefs:
    - TV004
