- id: comparable-benchmarks
  title: 'Comparable-set benchmarks: public automation, listed robotics, and private humanoid marks'
  body: 'The comparable set points in three different directions, which is exactly why Tianji is difficult
    to price. Large global automation leaders such as ABB, Rockwell, and Fanuc trade around roughly 5.6x
    to 7.5x sales, while Teradyne sits much higher at about 18.1x. Chinese listed automation peers are
    cheaper still on average: Inovance is near 3.7x, Siasun about 5.9x, Estun about 6.5x, and EFORT about
    9.5x. Those bands imply Tianji would need something like RMB0.84-2.70 billion of annual revenue to
    support its current mark on industrial peer logic. Listed pure-play robotics names are the escape
    hatch for the bull case: UBTECH trades around 34x sales and Doosan Robotics around 120x, which would
    require far less current revenue to justify Tianji''s price. But those higher bands come with their
    own warning label: they reflect scarcity value, strategic optionality, and market heat, not just proven
    economics. Private Chinese humanoid comps reinforce that heat. Galbot and AgiBot continue to attract
    very large rounds, and commentary sources place the top domestic valuation band well above RMB10 billion.
    Tianji belongs in that cohort conversation, but its public evidence is still thinner than its implied
    valuation multiple.'
