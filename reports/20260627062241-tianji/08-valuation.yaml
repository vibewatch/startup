- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Explicit assumptions
  - Valuation / return logic
  - Probability signal
  - Downside triggers
  rows:
  - - Bull
    - Order book converts into >RMB500M recognized revenue in the next 12-18 months; automation and first-pass-yield
      gains protect gross margin; customer set broadens beyond a few anchor OEMs.
    - RMB8.5-12B fair value; current round can work and 2.5x+ gross outcome becomes plausible if Tianji
      compounds into a top embodied-AI infrastructure platform.
    - Medium-low; requires both execution and sector premium persistence.
    - Backlog slippage, ASP compression, or inability to prove margin quality.
  - - Base
    - Real demand exists, but revenue conversion is slower, customer concentration remains meaningful,
      and the market ultimately values Tianji closer to the upper end of industrial-peer bands plus some
      strategic premium.
    - RMB5.5-8.0B fair value; current ask is mostly full rather than clearly attractive.
    - Medium; most consistent with current evidence quality.
    - Any sign that orders are pilots rather than durable production programs.
  - - Bear
    - Sector bubble warning proves directionally right; adoption timing slips; new capital chases too
      many similar firms; Tianji cannot show strong recognized revenue or resilient margins.
    - RMB2.5-5.0B fair value; down-round or material markdown risk becomes real.
    - Medium-low but non-trivial because current multiples are partially heat-driven.
    - Public multiple compression, weak follow-on funding terms, or concentration/cancellation data.
  notes: Scenario values are directional estimates derived from current round marks, public comparable
    bands, and milestone-based private-market logic rather than from management guidance.
