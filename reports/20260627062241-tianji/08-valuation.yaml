- id: diligence-gaps-and-upgrade-path
  title: Exit readiness, diligence asks, and thesis-break triggers
  body: 'Tianji is not yet visibly ready for a standalone public exit. The public capital-markets surface
    currently belongs to Everwin, whose filings show broader group disclosure and financing ambition,
    while Tianji itself still lacks a standalone public financial pack. That does not kill the investment
    case, but it does define the work remaining. The highest-value diligence asks are straightforward:
    prove recognized revenue and ASP from the reported backlog, disclose gross margin by product line,
    show backlog aging and cancellation rates, name major customers or reference accounts, and reveal
    the B/B+ preference stack. Those items determine whether today''s valuation is an early win or an
    overpay. The thesis also has clear breakpoints. If orders fail to convert, if concentration turns
    out to be extreme, if yield gains do not show up after the raise, or if sector bubble concerns intensify
    faster than commercial adoption, the current mark can re-rate sharply downward.'
  claimRefs:
  - CV011
  - CV012
