  - - Inovance
    - Public China automation
    - Market cap / TTM revenue / implied sales multiple
    - RMB171.28B / RMB46.27B / ~3.7x
    - Low-end Chinese listed automation baseline.
    - Broader motion-control and automation portfolio than Tianji.
  - - Estun
    - Public China robotics / automation
    - Market cap / TTM revenue / implied sales multiple
    - RMB31.67B / RMB4.86B / ~6.5x
    - Directly relevant domestic robotics benchmark.
    - Listed operating history and disclosure are much deeper than Tianji's.
  - - Siasun
    - Public China robotics
    - Market cap / TTM revenue / implied sales multiple
    - RMB23.83B / RMB4.06B / ~5.9x
    - Domestic robot-maker reference point.
    - Legacy listed platform, not a fresh humanoid private mark.
  - - EFORT
    - Public China industrial robot
    - Market cap / TTM revenue / implied sales multiple
    - RMB9.34B / RMB0.98B / ~9.5x
    - Upper end of Chinese listed industrial-peer sales multiples.
    - Still broader than a dual-arm embodied-AI subsystem story.
  - - UBTECH Robotics
    - Listed pure-play humanoid / service robotics
    - Market cap / TTM revenue / implied sales multiple
    - USD5.78B / USD0.17B / ~34x
    - Best listed humanoid-style benchmark for premium narrative valuation.
    - Still much more transparent publicly than Tianji.
  - - Doosan Robotics
    - Listed pure-play collaborative robotics
    - Market cap / TTM revenue / implied sales multiple
    - USD3.58B / USD29.82M / ~120x
    - Shows the outer boundary of public scarcity premium.
    - Too extreme to treat as a base valuation anchor.
  - - Galbot
    - Private humanoid
    - Recent financing
    - RMB2.5B new funding; reported highest-valued unlisted humanoid robotics company in China
    - Validates how much capital is chasing the category.
    - No clean public operating denominator.
  - - AgiBot
    - Private humanoid
    - Funding / investor signal
    - Record total funding among Chinese peers; JD.com added as shareholder in 2026
    - Confirms strategic capital intensity in the leader set.
    - No precise current valuation disclosed in retained source.
  notes: Public rows use June 2026 market-cap and revenue pages; private rows are mark-to-round style
