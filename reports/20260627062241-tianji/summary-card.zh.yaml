summary:
  headline: Tianji 看起来是一家真实放量的中国机器人供应商：双臂产品化可信，传统工业场景已有部署，也拿到顶级战略资本；但 2026 年 5 月 RMB8-10 billion 的估值仍跑在公开财务证据前面，还不足以让人放心承销。
