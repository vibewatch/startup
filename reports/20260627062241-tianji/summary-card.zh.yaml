  topStrengths:
    - 传统工厂自动化里已有真实装机证据，再加上据报道 45 家 OEM 的人形机器人 / 具身 AI 订单队列，Tianji 的需求证明强于许多概念阶段机器人同行。
    - Marvin 系列和更宽的产品目录说明，公司卖的是标准化产品，不是单台演示机；与 Everwin 的连接也可能改善制造、供应链触达和爬坡执行。
    - >-
      2026 年 5 月的投资方组合了顶级风险资本和战略资本（GL Ventures、Meituan、Tencent、Gaorong、Luminous、GGV/Granite），显示市场对 Tianji
      在具身智能基础设施中位置的高确信。
  topRisks:
    - 公开来源没有披露 Tianji 独立收入、已实现 ASP、毛利率、现金余额或 backlog 转化，当前估值因此很难落到财务表现上。
    - 订单动能和客户数量表述很强，但集中度、取消风险、复购，以及人形机器人 OEM 需求能否转成持久收入，仍有重大未知。
    - 一旦质量或市场环境走弱，安全 / 责任、出口管制敞口、激烈竞争，以及对 Everwin 制造和治理生态的残余依赖，都可能拖累规模化。
  unresolvedGaps:
    - 没有公开的 Tianji 独立收入桥、毛利率、烧钱速度、现金跑道或经审计现金披露。
    - 除融资金额和投资方外，本轮条款仍未披露，包括清算优先权、董事会权利、反稀释保护，以及是否包含老股成分。
    - 公开来源无法解释当前准确持股、员工数，或投后估值应理解为约 RMB8 billion 还是接近 RMB10 billion。
    - 客户集中度、续约率、backlog 账龄，以及各产品线已实现 ASP 均未公开披露。
