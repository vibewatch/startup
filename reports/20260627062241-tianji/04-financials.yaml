  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: standalone-financials
    missingEvidence: Tianji standalone audited FY2025 revenue, gross margin, opex, EBITDA and cash-flow statement.
    whyItMatters: Without a subsidiary P&L and cash-flow statement, order growth cannot be translated into revenue quality, margin quality or runway.
    diligencePath: Request audited FY2025 subsidiary financial statements plus Q1 2026 management accounts and monthly revenue bridge.
    relatedQuestionRefs:
    - QI005
    - QI023
    - QI024
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Current list price sheets, realized ASPs and discount policy by Marvin and industrial-robot model.
    whyItMatters: Pricing power is central to gross-margin path and to whether 10,000+ orders can convert into attractive revenue.
    diligencePath: Request quote sheets, ASP history, dealer or direct-sales discount schedule and warranty reserve policy.
    relatedQuestionRefs:
    - QI002
    - QI006
  - type: conflicting-data
    severity: material
    topic: revenue-scope
    missingEvidence: A reconciled bridge between Everwin's CNY100 million humanoid-robotics line and the Tencent-hosted CNY200 million Tianji revenue figure.
    whyItMatters: Investors need to know whether the public discrepancy is a scope issue, a timing issue or a quality-of-disclosure issue.
    diligencePath: Request 2025 revenue by product family, legal entity and recognition policy, then reconcile to parent segment reporting.
    relatedQuestionRefs:
    - QI005
    - QI023
  - type: private-evidence-only
    severity: material
    topic: backlog-conversion
    missingEvidence: Backlog aging, cancellation rates, shipment conversion and acceptance timing for the 10,000+ Q1 2026 order book.
    whyItMatters: Orders can overstate commercial quality if cancellation, engineering slippage or long acceptance cycles are high.
    diligencePath: Request monthly order-to-shipment waterfall, cancellation history, and top-customer backlog concentration.
    relatedQuestionRefs:
    - QI015
    - QI017
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Tianji standalone cash balance, monthly burn, debt schedule and intercompany support framework.
    whyItMatters: Runway and next-round timing cannot be assessed from parent data or from financing headlines alone.
    diligencePath: Request cash ledger, debt register, board-approved 12-month budget and related-party funding agreements.
    relatedQuestionRefs:
    - QI018
    - QI024
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: robotics-capex-allocation
