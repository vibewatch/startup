- id: section-6
  title: Financial verdict on revenue quality, margin path and diligence blockers
  body: The financial verdict is mixed but not ambiguous. Revenue quality is directionally better than hype-stage robotics peers because there is parent-filed revenue, real shipment volume, and clear evidence of standardized products and repeatable industrial selling. But it is still not fully underwritable because the public record does not reconcile Tianji standalone revenue with the parent's narrower robotics line, does not disclose realized pricing or gross margin, and does not provide cash, burn or backlog-conversion data at subsidiary level. Margin path likely improves with higher automation, better first-pass yield and scale, yet the available filings also show elevated receivables, inventories and borrowing pressure that can absorb cash during fast growth. Capital intensity is therefore a first-order diligence issue, not a footnote. A serious investor should treat order growth as real, but treat valuation, runway and margin confidence as provisional until Tianji discloses subsidiary
    financials, backlog aging, customer concentration and robotics-specific capex allocation.
