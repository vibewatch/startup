company:
  name: Tianji
chapter:
  number: 4
  title: Financials
  summary: 'Tianji shows real demand and scaling signals, but public financial quality remains only partially underwritable. Parent Everwin filings anchor CNY100 million of 2025 humanoid-robotics revenue, 690,000 precision components shipped, and tighter 2025-2026 working-capital conditions, while May 2026 media and company-linked reports cite a CNY1 billion Series B/B+ raise, more than 2,000 dual-arm deliveries in four months of 2025, and more than 10,000 Q1 2026 orders. The key blocker is missing subsidiary-level disclosure: no public Tianji cash balance, burn, gross margin, realized ASP, or backlog-conversion data survives source review.'
sections:
- id: section-1
  title: Revenue streams, pricing and recognition issues
  body: Public evidence supports a mixed hardware-plus-service model, but not a clean revenue ledger. Tianji's official surfaces show standardized robot products, vertical application selling, software support, spare parts, fault repair, and training, so the economic model is broader than one-time hardware shipment alone. At the same time, there is still no public list pricing for Marvin or for the legacy industrial robot portfolio; the strongest pricing signal in retained evidence is historical and relative, not current and contractual. The parent's 2025 annual report gives a narrow disclosed anchor of CNY100 million in humanoid-robot precision-component revenue, but that figure is not the same thing as Tianji standalone revenue or recognized revenue by SKU. A Tencent-hosted feature later cited about CNY200 million of 2025 Tianji revenue across collaborative-arm and humanoid-dual-arm business, but that media figure cannot be reconciled cleanly against the parent filing, so revenue quality
    remains partly obscured by scope mismatch and absent subsidiary financials.
  claimRefs:
  - CI001
  - CI002
  - CI004
  - CI006
  - CI011
  - CI031
  - CI037
