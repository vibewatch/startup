- id: section-4
  title: Public traction proxies versus private-metric gaps
  body: 'Tianji has unusually strong shipment and order momentum for a private robotics company, but the public traction surface still stops short of full underwriting. Parent filings confirm 2025 humanoid-related component revenue and very large shipment counts, while multiple 2026 reports repeat the 2,000-plus delivery and 10,000-plus order milestones. That is enough to believe there is real customer pull. It is not enough to underwrite revenue quality or margin durability. Public sources still do not disclose Tianji standalone audited revenue, revenue recognition policy by stream, gross margin, churn or cancellation rate, backlog aging, average selling price, service attach rate, or customer concentration within the subsidiary. The result is a strange split: the company is visible enough to demonstrate commercial relevance, but still opaque enough that core P&L interpretation depends on management-room materials rather than public evidence.'
  claimRefs:
  - CI011
