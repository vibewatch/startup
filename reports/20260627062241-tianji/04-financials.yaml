- id: section-2
  title: GTM motion and sales-efficiency proxies
  body: 'The GTM motion looks direct and engineering-led rather than channel-led. Official pages push vertical use cases in 3C electronics, apparel, construction machinery and automotive manufacturing, then route buyers to direct phone and email contacts, training, repair and software support. That operating posture fits enterprise robotics selling more than reseller distribution. Public sales-efficiency metrics, however, are thin: there is no disclosed CAC, payback, sales-cycle length, win rate, or backlog conversion curve. The best public proxies are customer count, installed base, repeat-order signals and current order momentum. Tianji''s own pages said it had already exceeded 800 customers and 10,000 robots online by end-2022, while a historical official article said price cuts tied to scale helped repurchase behavior. Company-linked 2025-2026 coverage adds the stronger near-term signal: more than 2,000 humanoid dual-arm units delivered in four months, over 100 customers served, and
    over 10,000 orders on hand in Q1 2026 across 45 OEM and embodied-AI customers. Those are demand signals, not revenue-conversion proof.'
  claimRefs:
  - CI003
  - CI005
  - CI006
  - CI007
  - CI034
  - CI035
  - CI036
  - CI039
  figureRefs:
  - FI002
- id: section-3
  title: Cost structure, gross-margin drivers and working-capital load
  body: 'The public picture is unmistakably capital intensive. Parent filings show Everwin still funds robotics expansion inside a much larger precision-manufacturing system, and the HKEX application proof surfaces exactly where the burden lands: borrowings rose sharply in 2025, trade receivables and inventories both expanded, and year-end current assets swung into current liabilities. Those are classic signs of a business scaling physical production faster than cash conversion. Parent 2025 operating cash flow stayed positive, but it fell sharply year over year, and Q1 2026 turned negative. Gross margin for Tianji itself is not disclosed, so the best public margin drivers are qualitative: automation rate, first-pass yield, export-heavy shipment mix, product standardization, and the balance between hardware, components, and support services. The parent''s global manufacturing network and robotics-capacity buildout likely help fulfillment and export reach, but they also imply substantial tooling,
    facility and working-capital demands that subsidiary-level reporting does not break out.'
