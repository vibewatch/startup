- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Exact diligence path
  rows:
  - - Tianji standalone audited revenue and gross margin
    - Without this, order milestones cannot be translated into revenue quality or unit economics
    - Request FY2025 audited subsidiary income statement and Q1 2026 management accounts
  - - Booked orders to shipped orders to recognized revenue bridge
    - Backlog quality and cancellation risk remain unknown
    - Request monthly order, shipment, acceptance and cancellation waterfall by product line
  - - Current list price and realized ASP by Marvin model
    - Pricing power cannot be measured from public evidence
    - Request customer quote sheets, realized ASP history and discount policy
  - - Tianji cash balance, monthly burn and debt
    - Runway cannot be underwritten from parent filings alone
    - Request cash ledger, debt schedule, intercompany support agreements and 12-month budget
  - - Robotics-specific capex and factory allocation inside Everwin
    - Parent disclosures do not isolate what portion of capex belongs to Tianji
    - Request fixed-asset register, construction-in-progress schedule and robotics capex plan
  - - Customer concentration and bad-debt experience at Tianji
    - Parent concentration may over- or understate subsidiary risk
    - Request top-10 customer revenue share, receivables aging and write-off history
  notes: These are the minimum data-room items required to turn shipment momentum into an investable financial model.
