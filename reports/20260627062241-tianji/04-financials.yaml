- id: section-5
  title: Capital adequacy and financing dependency
  body: Capital support is coming from both the subsidiary and the parent, which is a strong signal of opportunity and of funding dependency. Tianji's May 2026 Series B/B+ added CNY1 billion for R&D, mass production and global sales buildout, while Everwin simultaneously pursued an HKEX listing to widen funding channels and disclosed a use-of-proceeds plan that includes capacity expansion, intelligent-manufacturing upgrades, global footprint, M&A, debt repayment and working capital. The parent also carries a large guarantee envelope for subsidiary financing. None of that proves distress, but it does show that scaling robotics is not being funded only out of free internal cash generation. The HKEX filing does say the group expects at least 12 months of working-capital sufficiency assuming IPO proceeds, banking facilities and internal cash resources. That statement is helpful at parent level; it does not replace a Tianji standalone runway disclosure. For the subsidiary itself, cash on hand,
    monthly burn, debt and intercompany support remain undisclosed.
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI022
  - CI029
