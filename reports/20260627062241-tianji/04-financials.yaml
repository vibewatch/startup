- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Tianji can point to strong demand and fresh equity, but the public record still shows material dependence on manufacturing scale, working-capital discipline and external financing.
  data:
    columns:
    - Revenue visibility
    - Working-capital pressure
    - Funding support
    - Underwriting read
    rows:
    - label: Tianji dual-arm business
      values:
      - Orders and deliveries visible; recognized revenue opaque
      - Likely high during scale-up
      - Series B/B+ financing available
      - Commercially relevant but not fully underwritable
    - label: Legacy industrial robots and services
      values:
      - Installed base and service surfaces visible; no current ASP or margin
      - Moderate
      - Parent manufacturing platform supports execution
      - Could stabilize mix, but public financial contribution is unknown
    - label: Parent Everwin balance sheet
      values:
      - Full filings available
      - Receivables, inventory and borrowings all elevated
      - HKEX listing plan plus bank facilities and guarantee capacity
      - Supportive but also evidence of capital intensity
    - label: Global expansion and localization
      values:
      - Sales-network expansion disclosed; economics not disclosed
      - Higher upfront spending before revenue conversion
      - Funding explicitly earmarked for global build-out
      - Upside path is plausible but cash demands are front-loaded
  approximationNotes: This matrix is directional and evidence-backed rather than quantitatively scored. It separates visibility from funding access because both matter to underwriting.
