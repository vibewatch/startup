      - number: '1.4'
        title: Scale Signals, Milestones, and Adverse/Conflicting Evidence
        blocks:
          - type: paragraph
            body: >-
              Tianji’s scale narrative strengthened materially in 2025–2026. Official and media sources say the company
              moved from more than 800 customers and 10,000 robots online by end-2022 to more than 2,000
              force-controlled humanoid dual-arm deliveries in four months during 2025, then to more than 10,000 units
              of first-quarter 2026 orders spanning 45 global humanoid robot or embodied-AI manufacturers. Product pages
              support the idea that this is not a vaporware story: the Marvin line has concrete seven-axis specs,
              published force-control parameters, and certifications. The company is therefore best described as a real
              hardware supplier with demonstrated delivery history, not merely a fundraising concept.


              The adverse side is subtler but real. Everwin’s 2024 filing showed Tianji generating only RMB52.27 million
              of revenue with a RMB9.99 million net loss for the first nine months of 2023, alongside parent guarantees
              and RMB15.6 million of financial support outstanding at the time. Registry/legal-risk sources also show
              routine civil litigation and hearing notices rather than a clean zero-dispute profile. Finally, some scale
              and identity claims conflict across sources: 2015 versus 2017 founding, 166 insured employees versus 300+
              staff, and RMB8 billion versus nearly RMB10 billion valuation. None of those contradictions breaks the
              overall investment thesis, but they do mean this chapter should serve as the canonical place where later
              chapters inherit qualified facts, not simplified marketing language.
