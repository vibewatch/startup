  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / observable event
      - Transmission to thesis
      - Action implication
    rows:
      - - Order conversion failure
        - >-
          By the next financing cycle, reported backlog still lacks a credible revenue bridge or recognized-revenue
          disclosure.
        - Breaks the core bull claim that Tianji is already crossing from hype to scaled commercialization.
        - Move from track to avoid until conversion data is produced.
      - - Customer concentration shock
        - A few OEMs account for the clear majority of orders or cancellations rise sharply.
        - Turns scale optics into concentration risk rather than platform strength.
        - Revalue toward bear case and demand concentration-adjusted terms.
      - - Yield / automation disappointment
        - New capital does not improve first-pass yield, automation rate, or delivery reliability.
        - Undermines the operational leverage needed to support premium multiples.
        - Cut valuation assumptions and pause any follow-on commitment.
      - - Sector multiple compression
        - Public humanoid and robotics multiples reset sharply after bubble warnings or weak deployments.
        - Removes the premium-comp support that helps justify today's price.
        - Re-anchor on Chinese listed automation bands.
      - - Structure overhang
        - New disclosures reveal heavy preferences, ratchets, or control rights for B/B+ investors.
        - Common-equity upside becomes materially worse than headline enterprise value implies.
        - Require deeper discount or step away.
    notes: >-
      Triggers are deliberately observable and tied to valuation transmission, not to generic management-quality
      opinions.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV046
      - CV049
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Standalone financials
        - 2025 and Q1 2026 Tianji revenue, gross margin, operating cash burn, and capex allocation.
        - These are the minimum facts needed to know whether RMB8-10B is aggressive but defensible or simply premature.
        - Finance room or board package; reconcile against Everwin disclosures.
      - - Backlog quality
        - >-
          Booked-versus-delivered-versus-recognized revenue bridge, backlog aging, cancellation history, and
          top-customer concentration.
        - The 10,000-plus order signal is the most important bridge between narrative and valuation.
        - Sales ops / CFO diligence; sample customer contracts and ERP extracts.
      - - Pricing power
        - Realized ASP by Marvin configuration, discount ladders, warranty terms, and service attach rate.
        - Needed to convert volume claims into durable gross-profit math.
        - Commercial diligence with top contracts and invoice samples.
      - - Cap table and preferences
        - >-
          Liquidation preferences, anti-dilution rights, board rights, secondary sales, and employee option-pool
          changes.
        - Headline post-money can overstate common-equity attractiveness if the stack is investor-heavy.
        - Legal diligence with signed term sheets and cap-table waterfall.
      - - Exit path
        - >-
          Standalone IPO intent, carve-out logic versus Everwin, and strategic-sale interest from major industrial or
          robotics players.
        - >-
          Determines whether the likely exit is a priced growth round, a strategic acquisition, or a delayed public
          path.
        - Board-level strategy discussion and banker feedback.
    notes: >-
      Most of the missing evidence is company-private rather than theoretically unknowable; the diligence ask is
      therefore practical, not speculative.
    claimRefs:
      - CV011
      - CV012
      - CV047
      - CV048
      - CV050
