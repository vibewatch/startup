      - number: '6.3'
        title: Named customer proof, deployment outcomes, and reference quality
        blocks:
          - type: paragraph
            body: >
              The cleanest named humanoid-customer proof is Beijing Zhongke Huiling. An Aibang Robotics article says
              Tianji and Zhongke Huiling reached a strategic cooperation agreement in September 2025 and completed
              first-batch delivery of Marvin humanoid arms. The same piece adds unusually useful deployment detail:
              Zhongke Huiling said it selected Marvin after evaluating multiple mainstream brands and self-developed
              options; the delivered configuration intentionally omitted force control because the initial tasks were
              grasping, handling and trajectory work; and the customer cited no overheating during acceptance and trial
              operation. That is much stronger than a logo wall because it describes configuration, use case and
              operating behavior.

              Outside Zhongke Huiling, the evidence mix gets weaker but still informative. Tianji's own
              battery-manufacturing case study gives quantified industrial outcomes — 25,000 pieces per shift, 99.5%
              yield, RMB1.8 million annual cost savings and six-month payback — but the customer is unnamed, which
              limits reference quality. Tianji's Chain Expo article places the company in Apple's exhibition area and
              claims the underlying technology has been used in Mac Pro manufacturing, but that remains company-issued
              demo-adjacent proof rather than an independently confirmed Apple procurement statement. Baike also cites a
              2025 strategic cooperation with Fujian Xingyun Electronics around embodied intelligence and
              lithium-battery / NEV scenarios, yet public evidence still looks more like ecosystem validation than a
              fully disclosed recurring customer contract. The result is a ladder of proof: one named humanoid buyer
              with concrete technical feedback, several quantified but anonymous industrial cases, and a large unnamed
              45-OEM cohort whose account quality remains opaque.
