            body: >-
              Tianji is best understood as a robot-cell supplier with an embodied-intelligence extension, not as a pure
              research-humanoid company. Official surfaces show a standardized catalog spanning industrial six-axis
              robots, collaborative robots, SCARA robots, food-grade variants, controllers, software, optional
              peripherals, and the Marvin dual-arm family. In customer workflow terms, the legacy stack addresses
              machine tending, precision assembly, visual sorting, and washdown handling; the newer Marvin line targets
              force-controlled bimanual manipulation where integrators or humanoid OEMs need dexterous arms, coordinated
              control, and data-collection hooks instead of a complete end-to-end humanoid. The concrete application
              pages matter because they show how Tianji sells into production cells: TR8 handling automotive
              subassemblies with CCD positioning, SR3/SR3D doing visual sort-and-place at 0.05 mm accuracy, and TR8
              serving two CNC machines without waiting between cycles. That workflow evidence makes the product feel
              closer to deployable automation infrastructure than to a concept demo.
