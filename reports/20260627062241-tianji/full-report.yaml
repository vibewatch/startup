            title: China-Centered Demand Is a Real Tailwind
            body: >
              IFR and MIR both point in the same direction: China is the largest automation geography in the world and
              also the largest single cobot market. That gives Tianji a large home-market demand pool in exactly the
              electronics, automotive, battery, and general-manufacturing sectors where collaborative automation is
              broadening.
