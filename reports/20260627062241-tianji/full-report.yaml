              The key diligence step is to request customer-level proof of industrial conversion: paid pilots, repeat
              orders, ASP by vertical, deployment-to-production cycle length, and the revenue split between labs,
              embodied-AI developers, and scaled factories. Public sources are strong on market direction and weak on
