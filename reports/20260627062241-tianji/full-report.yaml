  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation by buyer, user, vertical, geography, and channel
        blocks:
          - type: paragraph
            body: >
              Public evidence points to a hybrid B2B book rather than a single customer archetype. On the legacy
              industrial side, Tianji sells standardized industrial robots, control systems and integration support into
              factory buyers across 3C, automotive electronics, new energy, medical, home appliances, food, footwear and
              adjacent manufacturing categories. In those accounts the buyer and payer appear to be plant-management,
              automation-engineering or procurement teams, while the day-to-day users are production, quality and
              maintenance operators. On the newer embodied-AI side, the buyer is better described as a robot maker or
              embodied-AI development team purchasing Marvin force-controlled arms, controllers and integration support
              as an enabling subsystem rather than a finished humanoid robot.

              Geography is still China-first in the public record. Tianji's contact surface exposes Dongguan
              headquarters plus Shanghai, East China and Southwest offices, and its support stack includes direct
              technical service, training, spare-parts, software and fault-repair pages. That is the operating shape of
              an engineering-led direct-sales model, not a reseller-led catalog motion. Overseas expansion is visible
              but early: 2026 media coverage says Tianji plans localized North America sales and technical-support
              teams, while Baike says some arms have already landed in overseas universities and research labs. The
              practical segmentation takeaway is that Tianji is monetizing both industrial automation budgets and
              humanoid-development budgets, with service intensity high enough that deployment support is part of the
              product rather than a side offering.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
