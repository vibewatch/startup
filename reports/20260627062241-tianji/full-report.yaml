            title: Tianji Sits Between Classic Cobots and Embodied-AI Infrastructure
            body: >
              Tianji's dual-arm force-control positioning matters because it overlaps two spending buckets at once:
              practical collaborative automation and the newer embodied-intelligence hardware buildout. That can raise
              strategic relevance even before the dual-arm subset is cleanly measurable as a standalone public market.
            calloutType: insight
            claimRefs:
