      - number: '7.2'
        title: Regulatory, legal, and safety risk
        blocks:
          - type: paragraph
            body: >-
              Tianji’s regulatory and legal perimeter is broader than the usual private-robotics startup narrative.
              Registry and filing sources show a scope that covers robot development and manufacturing,
              industrial-system services, second-class medical-device related products, and import-export activities
              subject to approval. That matters because the main public risk is not a known enforcement action but the
              mismatch between increasingly safety-regulated deployments and still-thin public disclosure on liability
              controls. China now has a current stack of robot safety standards covering industrial applications,
              collaborative robots, and general robot safety, while ABB’s 2026 industry note highlights that buyers
              increasingly expect industrial durability, precision, and compliance in complex collaborative tasks.
              Tianji’s own materials lean into those same expectations, advertising full-axis torque sensing, optional
              six-axis force sensing, compliant control metrics, and 7x24 durability claims. If real-world reliability
              lags the marketed performance envelope, the downside is not only warranty cost; it is accident liability,
              deployment delays, and procurement disqualification. Legal hygiene is also imperfect rather than pristine.
              Aiqicha reports five filing cases, six hearing notices, and six litigation relationships. That is a modest
              baseline for a hardware company, but it is enough to require a docket review rather than a blanket “no
              litigation risk” statement. A separate compliance nuance is qualification risk: Tianji publicly touts
              high-tech and Little Giant-type honors, yet 2026 MIIT rules make those titles explicitly reviewable and
              revocable for false or inconsistent data. For diligence, the key ask is not whether Tianji has a marketing
              list of certifications or honors; it is whether the company can produce current safety-test records,
              quality escape history, product-liability insurance, and a clean explanation of each open legal matter.
