      - number: '6.4'
        title: Retention durability, concentration risk, and procurement friction
        blocks:
          - type: paragraph
            body: >
              Durability is where the public record is weakest. No reviewed source discloses Tianji's NRR, GRR, churn,
              renewal rate, contract length, backlog aging, cancellation rate, or revenue concentration by customer. The
              absence itself is informative: investors can see shipment momentum and support infrastructure, but cannot
              yet underwrite how sticky the 45-OEM cohort is, whether industrial accounts reorder at meaningful
              frequency, or whether humanoid orders are spread across many small design wins or a few dominant
              customers. A Toutiao feature even asserts that industrial cobots and humanoid dual arms each contribute
              roughly half of revenue, but it provides no filing-grade support and should be treated as low-confidence
              media characterization rather than a canonical segmentation number.

              Procurement friction is easier to observe than retention. Tianji's service surface requires training,
              software-layer integration, spare parts and post-sale fault repair; its 2021 conference article says
              certain controller functions are opened to customers for secondary development; and the Zhongke Huiling
              proof shows configuration is tailored to task need rather than sold as a one-SKU product. That combination
              implies a technical, customer-specific integration cycle. On the adverse side, QCC lists a 2022
              sales-contract dispute and a later civil case notice, showing commercial/legal friction is not literally
              zero. Meanwhile, the 2024 Everwin filing shows Tianji still relied on parent guarantees and loans while
              producing only modest disclosed revenue in 2023, which cautions against equating broad customer-count
              claims with diversified cash generation. The main commercial risk is therefore not absence of customers,
              but opacity on which customers truly drive durable revenue and how costly each deployment is to win and
              support.
