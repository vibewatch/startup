        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable leadership is concentrated around chairman/legal representative/manager Chen Xi.
              Registry sources and profile databases consistently show Chen Xi as the legal representative, chairman,
              and manager, while also listing him as a material shareholder. Other named governance personnel include
              directors An Jie, Dong Zhonglang, Huang Shaoping, and Zou Rui; supervisor Duan Kaihua; and finance head
              Huang Naihao. This provides enough visibility to enumerate core management and statutory governance roles,
              but not enough to conclude that Tianji has a mature independent-board structure.


              That gap matters for diligence. Public sources do not surface independent directors, board committees, or
              a detailed governance charter for Tianji as a private subsidiary/affiliate of a listed parent ecosystem.
              The sparse public leadership footprint suggests meaningful key-person dependence on Chen Xi for strategy,
              fundraising signaling, and customer/investor trust. At the same time, the named finance and board
              personnel indicate that Tianji is no longer a one-person shell; it has at least a visible statutory
              governance layer. The practical takeaway for later chapters is to treat Chen Xi as the central operating
              executive while explicitly carrying a diligence ask for post-B-round board composition, veto rights, and
              whether major investors gained governance rights in 2024–2026 financings.
