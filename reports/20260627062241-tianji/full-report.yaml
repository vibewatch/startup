      - number: '8.4'
        title: Recommendation, hold-or-exit logic, and final stance
        blocks:
          - type: paragraph
            body: >-
              The right call today is track, with medium confidence, high risk, and a stretched valuation stance. That
              may sound cautious relative to the strength of the operating signals, but the caution is price-sensitive
              rather than dismissive. Public evidence is good enough to say Tianji is not just a concept deck. It is not
              good enough to say the current entry is already attractive. At RMB8-10 billion, even a fairly standard
              venture goal of 2.5-3.0x gross value creation implies roughly RMB20-30 billion of exit equity value before
              any preference leakage. That requires Tianji to become one of the rare Chinese humanoid leaders that turns
              subsystem leadership into multi-year revenue scale, not merely a credible component vendor. Hold
              discipline should therefore be milestone-based: keep conviction only if the company converts orders into
              recognized revenue, shows gross-economics resilience, and broadens the customer base beyond a handful of
              OEMs. Exit or avoid if the next financing depends on hype rather than disclosed conversion data, or if
              adoption stalls while sector multiples compress.
            claimRefs:
