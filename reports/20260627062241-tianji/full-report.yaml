      - number: '8.3'
        title: Investment thesis, anti-thesis, and scenario ranges
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is not imaginary. Tianji appears to have three things many humanoid companies still
              lack: a productized operating-subsystem offering, some proof of mass-production execution, and a capital
              syndicate willing to pay up for embodied-AI infrastructure. Official and retained media sources support a
              view that Tianji is trying to become the standardized “arms and cerebellum” supplier for the next wave of
              humanoid OEMs, rather than competing head-on as a full-stack general-purpose robot brand from day one. If
              that position converts the reported backlog into several hundred million renminbi of recognized revenue
              while preserving yield and automation improvements, the current round can still work. The anti-thesis is
              that the round price has gotten ahead of what public evidence can currently underwrite. There is still no
              standalone Tianji revenue bridge, no disclosed ASP, no gross margin, no cash-burn disclosure, and no
              public preference-stack detail. That means the investor is buying the option value of future scale more
              than the certainty of current economics. The scenario table below therefore matters more than the headline
              round: the base case stays below the current ask, the bull case can clear it, and the bear case resets
              hard if sector heat cools before revenue quality is proven.
