        - Any sign that orders are pilots rather than durable production programs.
      - - Bear
        - >-
          Sector bubble warning proves directionally right; adoption timing slips; new capital chases too many similar
          firms; Tianji cannot show strong recognized revenue or resilient margins.
        - RMB2.5-5.0B fair value; down-round or material markdown risk becomes real.
        - Medium-low but non-trivial because current multiples are partially heat-driven.
        - Public multiple compression, weak follow-on funding terms, or concentration/cancellation data.
    notes: >-
      Scenario values are directional estimates derived from current round marks, public comparable bands, and
      milestone-based private-market logic rather than from management guidance.
