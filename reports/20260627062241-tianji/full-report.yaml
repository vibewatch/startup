      - number: '4.3'
        title: Cost structure, gross-margin drivers and working-capital load
        blocks:
          - type: paragraph
            body: >-
              The public picture is unmistakably capital intensive. Parent filings show Everwin still funds robotics
              expansion inside a much larger precision-manufacturing system, and the HKEX application proof surfaces
              exactly where the burden lands: borrowings rose sharply in 2025, trade receivables and inventories both
              expanded, and year-end current assets swung into current liabilities. Those are classic signs of a
              business scaling physical production faster than cash conversion. Parent 2025 operating cash flow stayed
              positive, but it fell sharply year over year, and Q1 2026 turned negative. Gross margin for Tianji itself
              is not disclosed, so the best public margin drivers are qualitative: automation rate, first-pass yield,
              export-heavy shipment mix, product standardization, and the balance between hardware, components, and
              support services. The parent's global manufacturing network and robotics-capacity buildout likely help
              fulfillment and export reach, but they also imply substantial tooling, facility and working-capital
              demands that subsidiary-level reporting does not break out.
