      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              The buyer map is segmented less by robot morphology and more by workflow pain. Electronics and
              semiconductor factories want precision assembly, test handling, and compact human-shared cells; automotive
              and auto-component plants want screwdriving, gluing, inspection, sub-assembly, finishing, and line-side
              flexibility; battery and new-energy operators want glue, scanning, loading, and inspection cells; labs,
              education, and embodied-AI developers want force sensing, data collection, and reprogrammable dual-arm
              platforms. In most of these segments the day-to-day user is process or manufacturing engineering, while
              the formal payer sits with plant capex, automation engineering, operations, or procurement rather than
              with central IT. Adoption tends to move through use-case screening, proof of concept, safety/risk
              assessment, process tuning, and only then multi-line rollout. Public evidence from A3, ABB, UR, Flex, and
              Estun points to a market that is diversifying beyond classic automotive OEM cells toward electronics,
              logistics, life sciences, and general manufacturing. That helps Tianji because force-control and dual-arm
              systems are most valuable where product mix changes often, workspaces are constrained, manual dexterity
              still matters, or the buyer wants an embodied-AI-ready hardware stack rather than a fixed-function robot.
              The trade-off is sales friction: these buyers often require application engineering, integration partners,
              and line-qualification evidence before releasing meaningful budgets, so early pipeline breadth does not
              translate automatically into recurring revenue.
