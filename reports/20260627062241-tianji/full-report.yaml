  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Tianji's May 2026 B and B+ financing is large enough to matter and small enough to force price discipline.
              Retained English and Chinese coverage converges on RMB1 billion of new money and a roughly RMB8-10 billion
              post-money valuation. That is credible evidence of strong investor demand and strong investor quality, but
              it does not by itself prove that the price is underwritten by public operating data. The same retained
              sources show why investors were interested: Tianji has a standardized Marvin dual-arm product family, a
              longer company history than many humanoid peers, more than 2,000 reported dual-arm deliveries in four
              months of 2025, and more than 10,000 units of Q1 2026 orders across 45 global humanoid OEM and embodied-AI
              accounts. Those are real commercialization signals. The problem is the structure gap. Public reports
              disclose the round size, the syndicate, and the use of proceeds, but not liquidation preferences,
              anti-dilution terms, board control, secondary mix, or subsidiary-level revenue conversion. A disciplined
              investor should therefore treat the round as proof of interest, not proof that today's price is safe.
