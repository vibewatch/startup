          - type: callout
            title: Current venture return math already assumes category leadership
            body: >-
              At an RMB8-10 billion entry, even a modest 2.5-3.0x gross outcome requires roughly RMB20-30 billion of
              exit equity value before hidden preferences are considered. That is a category-winner assumption.
            calloutType: assumption
