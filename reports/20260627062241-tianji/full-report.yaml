      - number: '7.4'
        title: Partner, customer, market, and model risk
        blocks:
          - type: paragraph
            body: >-
              The deepest non-technical risk is that Tianji sits inside several concentrated networks at once. It
              remains linked to Everwin through shareholding history, disclosed related-party flows, and manufacturing
              heritage even after deconsolidation. Public cap-table reporting is still noisy enough that one favorable
              secondary article called Tianji wholly owned long after the parent filing showed dilution to 40%, which is
              a warning that investor decks may over-simplify governance reality. Customer concentration is also
              difficult to dismiss. Tianji cites 45 humanoid or embodied-AI customers and more than 1,000 industrial
              customers, but the only hard concentration numbers in retained sources are at Everwin level, where the top
              five customers represented 64.6% of 2025 revenue and the largest customer 23.8%. That is not a Tianji-only
              number, yet it demonstrates how exposed this ecosystem can be to a few anchor accounts. The demand
              environment is supportive but unstable. 2026 financing coverage says capital is moving toward real-world
              validation and engineering execution, while KUKA and Teradyne disclose fiercer pricing, project delays,
              and trade-policy headwinds across automation and robotics. Tianji therefore faces simultaneous risk of
              price compression, OEM insourcing, and backlog volatility if embodied-AI enthusiasm cools or customers
              delay production programs. A company with real technology can still lose value quickly if its key accounts
              pause, squeeze margins, or internalize the arm and control stack.
