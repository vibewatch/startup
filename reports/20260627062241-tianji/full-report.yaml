      - number: '6.2'
        title: Adoption trajectory and active deployment evidence
        blocks:
          - type: paragraph
            body: >
              The installed-base story starts well before the humanoid boom. Tianji's own historical materials say it
              had more than 300 industrial customers and 5,000 robots online by end-2020, then more than 500 customers
              and 5,000 delivered robots by a 2021 conference-era article, and more than 800 customers with 10,000
              robots running stably online by end-2022. A later FAIR plus exhibitor profile raises the current surface
              claim to more than 1,000 customers and 20,000 robots online, while also describing deep strategic
              partnerships with top-tier humanoid robotics enterprises. Those figures are still company-linked, but
              together they show a persistent installed base rather than a one-cycle marketing spike.

              The embodied-AI trajectory is steeper and fresher. Multiple 2026 media outlets repeat the same topline:
              Tianji delivered more than 2,000 force-controlled humanoid dual-arm units in four months during 2025,
              served more than 100 customers, and entered first-quarter 2026 with more than 10,000 units of orders
              across 45 global humanoid robot OEMs and embodied-AI companies. That is strong proof of demand velocity,
              but it is still cohort-level proof. Public sources do not name most of the 45 customers, do not disclose
              average order size by account, and do not show what fraction of those orders were already converted into
              accepted production deployments, deferred backlog, or recognized revenue. The adoption curve is therefore
              real, but still only partly underwritten at account level.
