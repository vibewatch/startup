    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Tianji’s official web properties are the Chinese homepage at tianjizn.com and an English mirror at /en/,
              both branding the company as “Tianji Robotics.” Registry and filing sources align on the legal entity name
              Guangdong Tianji Intelligent System Co., Ltd., the registered address at Building 3, No. 6 Industrial West
              Third Road, Songshan Lake Park, Dongguan, and a 2015-05-18 incorporation date. The official about page
              also uses 2015 as the founding year, so the cleanest working view is that formal registration and
              operating-history origin broadly align in 2015, even though some later English-language finance databases
              say 2017.


              The current business is broader than humanoid arms alone. Official pages describe a product stack spanning
              collaborative robots, SCARA robots, vision accessories, electric grippers, and force-controlled
              dual-arm/humanoid robot arms under the Marvin family, all tied together by Tianji’s in-house Fusion
              control system. The company’s current positioning in 2026 coverage is “embodied AI infrastructure”: it
              sells the force-control hardware, control modules, and robot subsystems that let model-centric humanoid
              and embodied-AI companies execute physical tasks. That framing matters because later valuation and market
              analysis should treat Tianji as a component/platform supplier with legacy industrial-robot revenue roots,
              not as a pure full-stack humanoid OEM.
