      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              The main growth case is real but conditional. On the positive side, China continues to anchor global robot
              deployment, domestic collaborative-robot leaders are scaling quickly, and standards bodies are moving
              embodied intelligence from concept toward repeatable industrial deployment. ABB, UR, and Flex all
              emphasize stronger demand for industrial-grade cobots, AI-enabled motion, and electronics-focused flexible
              automation, while A3 data show cobot demand rising faster than the broader North American robot market in
              2026. The constraint case is just as important. Mordor, Fortune, and MarketsandMarkets all cite labor
              shortages and ROI as tailwinds, but they also highlight upfront integration cost, payload-speed
              limitations, and brownfield compatibility issues. KUKA and Teradyne add a cyclical warning from
              public-company disclosures: weak economies, project delays, and customer capex restraint can abruptly slow
              orders in robotics and electronics. For Tianji specifically, the biggest unresolved issue is conversion
              quality. Public sources show attractive applications and broad category growth, but they do not disclose
              Tianji’s live mix of research sales versus scaled factory deployments, realized payback periods, or
              repeat-order depth in its target verticals. The chapter therefore preserves three contradictions rather
              than forcing false certainty: market values differ materially across publishers, embodied-AI enthusiasm is
              outrunning standardized procurement in many plants, and force-controlled dual-arm hardware may be
              strategically important before it is statistically separable as a standalone market.
