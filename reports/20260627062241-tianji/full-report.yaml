          - type: callout
            title: 'Actionable call: track, not chase'
            body: >-
              The evidence is strong enough to keep Tianji on a serious follow list, but not strong enough to justify
              paying any price. Better terms or better disclosure can move the call; neither is public yet.
            calloutType: recommendation
            claimRefs:
