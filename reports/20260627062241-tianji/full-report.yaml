              The market is clearly growing, but the public size estimates are not interchangeable. For 2025 and 2026
              alone, fetched sources span USD 1.42 billion, USD 2.28 billion, USD 2.31 billion, and USD 2.80 billion.
              Investors should underwrite Tianji against deployment conversion and product-market fit, not against a
              polished but fragile headline TAM.
