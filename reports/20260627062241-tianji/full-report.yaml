      - number: '7.5'
        title: Financial, governance, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              Financially, the biggest problem is not a lack of demand signals; it is a lack of clean subsidiary-level
              conversion data. The 2024 Everwin filing shows Tianji was still lossmaking in the first nine months of
              2023, and the parent’s 2026 first quarter report shows negative operating cash flow and higher
              embodied-intelligence investment pressure. The HKEX application proof adds the sharper risk architecture:
              elevated inventories, meaningful receivables, inventory impairment, and customer concentration all
              compound liquidity risk when hardware demand becomes volatile. Governance is improved versus the period
              when Everwin controlled Tianji, but not yet simple. Historical parent guarantees, current related-party
              flows, sparse public board detail, and executive centrality around Chen Xi all point to a business that
              still needs diligence on reserved matters, board composition, and conflict-management rules.
              Export-control and overseas-expansion risk amplifies the same uncertainty. BIS continues to tighten
              Chinese advanced-AI and chip controls, and the Commerce Control List framework means component
              classification and licensing discipline matter more as Tianji tries to enter North American supply chains.
              The thesis breaks if any one of four events occurs: a serious safety or recall incident; a revealed gap
              between orders and collectible revenue; renewed parent dependence that limits governance independence; or
              trade/compliance disruption that blocks critical components or customers. Until those are cleared, the
              correct investment posture is milestone-based rather than valuation-led.
