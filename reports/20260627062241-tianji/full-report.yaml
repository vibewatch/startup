              Capital support is coming from both the subsidiary and the parent, which is a strong signal of opportunity
              and of funding dependency. Tianji's May 2026 Series B/B+ added CNY1 billion for R&D, mass production and
              global sales buildout, while Everwin simultaneously pursued an HKEX listing to widen funding channels and
