  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternative set
        blocks:
          - type: paragraph
            body: >-
              Tianji is not just competing against one other dual-arm robot. The retained evidence shows at least five
              credible alternative paths for the same buyer job. ABB YuMi is the clearest integrated dual-arm incumbent
              for fine assembly, but its tiny 500 g payload keeps it concentrated in small-parts work rather than
              broader industrial manipulation. Universal Robots, Doosan, UFACTORY, and Dobot matter even without native
              dual-arm form factors because many industrial tasks can still be decomposed into one arm, two coordinated
              generic arms, or a single arm plus fixtures, vision, and software. Franka stays relevant where research
              labs and physical-AI developers prioritize developer friendliness over mass manufacturing. AgiBot is not a
              direct substitute today for every Tianji deployment, but it is the most important likely entrant because
              it is building an embodied-AI stack that bundles robot bodies, datasets, teleoperation, and ecosystem
              capital. That means Tianji has to defend itself simultaneously against precision incumbents, ecosystem
              incumbents, low-cost open alternatives, and vertically integrating embodied platforms.
