      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Public price support still trails the headline mark
            body: >-
              The current valuation can be rationalized only by assuming Tianji deserves a pure-play robotics premium
              well above Chinese listed automation peers before Tianji has published standalone revenue, margin, or
              cap-table terms.
            calloutType: risk
            claimRefs:
