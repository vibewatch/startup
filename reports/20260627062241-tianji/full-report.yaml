companyProfile:
  summary: >-
    Tianji (Guangdong Tianji Intelligent System Co., Ltd.) is a Dongguan-based Chinese robotics company incorporated on
    2015-05-18 and built out of Shenzhen Everwin Precision's automation business. It sells a broad automation catalog
    spanning force-controlled Marvin dual-arm systems, collaborative robots, SCARA and six-axis robots, controllers, and
    related services, with a newer emphasis on embodied-intelligence infrastructure for humanoid OEMs. Public sources
    show real deployment history in legacy factory automation and recent momentum in dual-arm humanoid-adjacent
    products, including more than 2,000 force-controlled dual-arm deliveries during a four-month period in 2025 and
    reported first-quarter 2026 orders above 10,000 units across 45 global humanoid or embodied-AI customers. Tianji's
    May 2026 RMB1 billion Series B and B+ financing led by GL Ventures and Meituan Strategic Investment confirms strong
    investor appetite, but standalone revenue, margin, burn, and preference-stack disclosure remains limited.
