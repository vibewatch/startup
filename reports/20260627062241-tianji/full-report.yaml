            body: >-
              The GTM motion looks direct and engineering-led rather than channel-led. Official pages push vertical use
              cases in 3C electronics, apparel, construction machinery and automotive manufacturing, then route buyers
              to direct phone and email contacts, training, repair and software support. That operating posture fits
              enterprise robotics selling more than reseller distribution. Public sales-efficiency metrics, however, are
              thin: there is no disclosed CAC, payback, sales-cycle length, win rate, or backlog conversion curve. The
              best public proxies are customer count, installed base, repeat-order signals and current order momentum.
              Tianji's own pages said it had already exceeded 800 customers and 10,000 robots online by end-2022, while
              a historical official article said price cuts tied to scale helped repurchase behavior. Company-linked
              2025-2026 coverage adds the stronger near-term signal: more than 2,000 humanoid dual-arm units delivered
