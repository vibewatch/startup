evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: everwin-ownership
    missingEvidence: >-
      A post-B/B+ shareholder register or board-approved capitalization table showing Everwin’s exact current percentage
      and control rights.
    whyItMatters: >-
      Whether Everwin is controller, largest shareholder, or merely a strategic minority holder affects governance,
      related-party analysis, and group-dependency risk.
    diligencePath: >-
      Request the latest cap table, shareholder agreement, and any reserved-matters schedule from management or lead
      investors.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: The signed May 2026 term sheet or board resolutions confirming the exact pre- and post-money valuation.
    whyItMatters: A range of RMB8bn to nearly RMB10bn is too wide to reuse as a single canonical input for valuation work.
    diligencePath: Obtain the B/B+ financing documents and investor presentation used in the round.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: total-raised
    missingEvidence: Exact gross proceeds and dates for the 2025 A/A+ round and any other undisclosed bridge capital.
    whyItMatters: >-
      Without exact intermediate-round sizing, lifetime capital raised and dilution cannot be precisely computed from
      public evidence.
    diligencePath: Request the financing history schedule from management or investors and reconcile it to the cap table.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-revenue
    missingEvidence: 2024, 2025, and 2026 year-to-date standalone revenue, gross margin, and customer concentration for Tianji.
    whyItMatters: >-
      The chapter can prove pre-scale losses and order claims, but not current commercial efficiency or revenue
      conversion.
    diligencePath: Obtain monthly management accounts, audited statements if available, and customer-level revenue breakdown.
    relatedQuestionRefs:
