  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Collibra 的产品最好定义为可信数据和 AI 的企业控制与上下文层，而不是数仓、ETL 引擎或 BI
              前端。官方页面展示的是一套模块化系统，帮助客户发现数据、定义业务含义、分配所有权、执行政策、追踪血缘、管理访问、监控质量、策划数据产品，并且现在治理 AI
              工作流。放到客户语境里，产品要解决的是一串问题：找到正确数据，知道它是什么意思，相信其质量，控制谁能使用，证明合规，并把这种可信上下文延伸到模型、copilot 和智能体。广度很重要，因为 Collibra
              的差异化不是某个单一算法功能，而是试图让受治理上下文在多种工作流中复用。这也解释了为什么公司不断通过新发布和收购扩大产品面，而不是停留在狭义目录厂商。
