      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              公开证据下的情景框架应先保持克制。收入、留存、毛利率、烧钱速度和股权结构表细节仍是私有信息，因此任何估值区间本质上都是分析判断，而非定论。乐观情景要求：公开估计明显低估收入，AI 治理和合作伙伴驱动扩张显著抬升
              ACV 和留存，且即便存在服务和实施负担，业务仍配得上溢价软件倍数。基准情景假设 Collibra 是一家真实但仍不透明的企业软件公司，公开运营代理指标大致正确，适用的公开市场式倍数显著高于传统软件公司，但远低于
              2021 年头条估值。悲观情景假设扩张变慢，原生平台和套件带来捆绑压力，而且没有证据显示较新的 AI
              控制模块能贡献足够变现来抵消倍数压缩。仅看公开数据，基准和悲观情景更占上风。乐观情景仍可能成立，但依赖本次研究缺失的私有证据。
            claimRefs:
