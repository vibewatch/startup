        title: 融资历史与投资人基础
        blocks:
          - type: paragraph
            body: >-
              最强的公开融资锚点仍是 2021 年 11 月 Series G：Collibra 和 Index Ventures 均称公司以 $5.25B 估值融资 $250M，由 Sequoia Capital
              Global Equities 和 Sofina 领投，Tiger Global 以及老股东 Battery Ventures、CapitalG、Dawn Capital、Durable
              Capital、ICONIQ 和 Index Ventures 参投。第三方创投数据库大体证实同一估值，但对累计融资额并不一致：Tracxn 报告九轮融资约 $596M，Latka 报告约
              $596.2M，Forge 则强调 2021 年估值从上一轮 $2.3B 跳升。也就是说，用户提供的累计融资超过 $1B 说法，无法从本轮审阅的公开来源得到支持。二级 / 市场平台信号也偏薄。Forge 仍把
              Collibra 显示为市场活动有限的私营 pre-IPO 公司；Notice
              给出股票参考报价，却没有足够交易细节，不能当作扎实的一级估值基准。不过，投资人名单无疑重量级且持有周期长，这对可信度和后期融资韧性有意义，哪怕股权结构优先级、优先股堆叠和任何债务仍未披露。
