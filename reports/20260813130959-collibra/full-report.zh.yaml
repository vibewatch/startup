  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正向逻辑很直接：Collibra 的品类价值真实存在，有真正的蓝筹客户、覆盖面很宽的治理语境产品，也有可信的 AI 治理 /
              控制平面叙事，而该市场仍具战略价值。反向逻辑更关键：公开财务精度差、实施负担真实存在、平台捆绑压力上升，而最后一个强力新股估值锚点是 2021
              年价格；拿当前公开运营代理指标对照，显得激进。两件事可以同时成立。Collibra
              可能是一家有价值的公司，但若按或接近最后一次头条估值进入，公开证据支撑很弱。因此，本章不建议简单按多头逻辑承销。证据支持谨慎建议：若可以开展私人尽调，或价格实质重置，则观察 / 继续研究；但不要假设 2021
              年估值到今天仍然合理。
