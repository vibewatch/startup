      - number: '2.5'
        title: 公开证据仍无法回答什么
        blocks:
          - type: paragraph
            body: >-
              公开证据足以证明市场真实、增长且具备战略重要性，但不足以干净地承销份额、赢单率或预算深度。市场报告对定义不一致，也很少公布其 2026 年数字背后的完整自下而上测算。官方定位显示 Collibra
              想打哪里，但公开来源看不到模块级收入、附加销售率、不同买方分层下的续约表现，或当前需求中有多少来自既有大客户扩张、多少来自新客户采用。因此，最大开放问题不是品类是否存在，而是昂贵企业平台能真正赢下多少，以及面对套件巨头和原生生态工具时，这个切入点能保持多久。这些不确定性应压低任何把广义治理和
              AI 治理 CAGR 直接转成激进估值假设的尝试。
