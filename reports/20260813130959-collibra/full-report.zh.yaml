      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Collibra 最可信的买方不是泛泛的 SMB 数据团队，而是大型企业里的治理、风险和平台负责人；他们有足够跨职能权力，可以推行共同定义和流程纪律。主要买方通常是
              CDAO、治理负责人或数据办公室高管；共同买方常包括 CIO 或数据平台领导、安全和隐私团队，以及越来越多的 AI 平台或模型风险负责人。用户覆盖数据管护人、领域负责人、分析师、工程师和政策 /
              合规运营人员。因此，付款方取决于最初切入点：目录和管护项目往往来自数据平台或转型预算；质量和控制可以从风险 / 合规预算拿钱；AI 治理项目可能由共享 AI
              项目预算赞助。采用通常从一个强制触发点开始，而不是自上而下重做整个企业——常见触发因素包括监管审计、云迁移、治理现代化，或需要把 GenAI 和智能体工作流扎进可信元数据。Collibra 与
              Databricks、Snowflake、SAP 和 Google Cloud 的合作动线很重要，因为这些生态已经触达技术买方，可以把治理从独立销售变成平台赋能型采购。这解释了为什么 Collibra
              在复杂、受监管、多系统环境中卖得最好，而不是作为轻量部门级数据工具。
