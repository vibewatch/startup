  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Collibra 的市场边界比传统数据目录更宽，但比完整「数据基础设施」宇宙更窄。官方定位现在把 Collibra 描述为基于受治理上下文构建的企业 AI
              控制平面；平台页仍把这个叙事扎在熟悉的治理模块上：目录、血缘、质量、政策、隐私和工作流。因此，纳入支出是用于发现数据、定义所有权和政策、记录血缘、执行访问和质量控制、证明 AI
              问责准备度的软件预算。排除支出应包括通用分析数仓、纯 BI 可视化、仅 ETL 工具，以及无法直接映射到治理或元数据控制的广义云消耗。最接近的相邻市场是数据目录、数据质量、访问治理、隐私和 AI
              治理软件；Collibra 2025 年的收购和合作发布显示，公司正主动跨过这些边界。现状替代方案仍很常见：电子表格式业务术语表、基于 wiki
              的数据管护、自研元数据层、平台套件内的原生云目录，以及没有统一治理层的点状质量或访问工具。这个替代格局很重要，因为 Collibra
              很少是在替换「什么都没有」；它通常是在挤掉手工治理、碎片化点工具，或已经控制相邻预算线的既有套件。
