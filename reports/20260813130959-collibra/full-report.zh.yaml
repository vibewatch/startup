      - number: '5.4'
        title: 信任、安全、合规与受监管部署证据
        blocks:
          - type: paragraph
            body: >-
              公开信任和合规信号有意义，但不完整。数据隐私、访问和治理页面都强调审计准备、政策执行、敏感数据发现和基于角色的控制。Collibra 2026 年 AI 治理领导力发布还加入 ISO 42001 认证、AI
              Pact 承诺和 EU AI Act 评估工具，比泛泛的「responsible AI」说法更强。AWS ICMP
              公共部门公告进一步证明，公司正为受监管联邦环境做定位。不过，信任证明不等于可靠性证明。公开页面解释控制应做什么，却没有提供详细的可用性、事故率或支持响应指标。因此，产品章节支持一个判断：Collibra
              有可信的信任姿态和受监管市场野心，但运营可靠性仍是明确的尽调缺口。
