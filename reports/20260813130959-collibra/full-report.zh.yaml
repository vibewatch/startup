      - number: '7.3'
        title: 合作伙伴、生态与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Collibra 最大的战略依赖在于，它的控制平面价值建立在其他强势平台之上，而这些平台正在持续加入原生治理能力。Databricks 将 Unity Catalog 描述为面向数据和 AI
              的内置治理层，Microsoft Purview 则主打覆盖 Microsoft 体系的一体化治理和保护平台。Snowflake、Google Cloud、SAP 以及 AWS Marketplace
              路由同样重要。这既是增长引擎，也是威胁。合作伙伴拓宽分发，让产品贴近数据和 AI 工作实际发生的位置，也可能把嵌入深度做得更深。但同一批合作伙伴或相邻平台厂商，也可能压缩差异化、掌握采购入口，或把
              Collibra 变成可选覆盖层。AWS Marketplace 的 private-offer
              模式也说明，企业条款可以保持非公开、逐单谈判，增加商业不透明度。投资者应把生态触达视为重要资产，但不能误认作控制权。Collibra 对合作伙伴路线图、API
              稳定性和原生平台竞争的依赖，是整份报告最重要的风险向量之一。
