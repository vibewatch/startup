  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有巨头、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Collibra 已不再只在狭义目录市场竞争。直接同行包括 Alation 和 Atlan 等治理与目录厂商；大型套件既有玩家包括 Informatica 和 Microsoft Purview；相邻挑战者包括
              Ataccama 和 Talend/Qlik，后两者从数据质量、集成或 fabric
              动线切入同一买方。现状替代方案同样重要：原生云目录、电子表格式数据管护和内部元数据层，都可能推迟或缩小企业平台采购。Collibra
              自身产品足迹很宽——数据治理、目录、数据市场、质量和可观测性、隐私、血缘、访问、集成，以及 AI 治理 /
              控制平面叙事——这意味着当买方想要共同运营层而不是点方案时，公司往往能赢。但这也意味着公司会被拉进更多比较，包括面对更便宜、更嵌入既有套件或部署更快的产品。竞争现实因此是多线作战：Collibra
              必须在易用性上赢过发现专家，在广度和打包上顶住企业套件，在实施摩擦和价值实现时间上压过原生平台工具。
