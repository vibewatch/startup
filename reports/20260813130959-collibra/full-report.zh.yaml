  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 公开证据支持谨慎建议，因为公司质量与价格支撑出现分化。
    data:
      nodes:
        - id: r1
          label: 真实市场 + 产品 + 客户证据
        - id: r2
          label: 财务分母证据仍弱
        - id: r3
          label: 历史 $5.25B 标记意味着相对公开代理指标的极高倍数
        - id: r4
          label: 公开可比公司集合指向低得多的估值区间
        - id: r5
          label: 建议：观察 / 继续研究；若按历史估值标记则回避
      edges:
        - from: r1
          to: r2
        - from: r2
          to: r3
        - from: r3
          to: r4
        - from: r4
          to: r5
