      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 请求
      - 投资前为何需要
      - 优先级
    rows:
      - - 当前年经常性收入（ARR）/ GAAP 收入和增长率
        - 用真实经营分母替代第三方估计
        - 关键
      - - 毛利率、服务收入占比、获客成本（CAC）/ 回本周期和烧钱速度
        - 判断软件质量和资本强度
        - 关键
      - - 净留存率（NRR）/ 总留存率（GRR）/ 流失和头部客户集中度
        - 评估耐久性和下行风险
        - 关键
      - - AI 治理模块附加率和续约提升
        - 验证新叙事是否变现
        - 高
      - - 最新股权结构表、优先权、409A 和任何老股交易
        - 定价真实股权风险和上行空间
        - 关键
      - - 按生态拆分的竞争赢 / 输
        - 验证原生平台替代风险
        - 高
    notes: 如果管理层无法提供这些材料，投资者应把公开估值缺口视为警讯，而不是机会。
    claimRefs:
      - CV015
      - CV020
      - CV031
