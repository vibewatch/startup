  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - Collibra 适配度
    rows:
      - - 企业数据治理控制层
        - 目录、血缘、术语表、政策、数据管护、工作流、治理运营模型
        - 仓库计算、BI 席位、没有治理工作流的纯 ETL 工具
        - CDAO、治理办公室、CIO 赞助的平台预算
        - 核心品类，也是当前平台最干净的适配
      - - 数据目录 / 元数据发现
        - 元数据索引、搜索、所有权、业务语境、可发现性
        - 通用 BI 语义层和临时文档
        - 数据平台、分析赋能、治理团队
        - 重要切入口，但不是完整价值主张
      - - AI 治理 / AI 控制平面
        - 模型清单、政策、审批、可追溯性、面向智能体和生成式 AI 的上下文控制
        - 模型训练基础设施，以及不绑定治理的通用 MLOps
        - AI 平台负责人、模型风险、共享创新预算
        - 增长最快的邻近领域，也是当前主要定位主题
      - - 邻近数据质量 / 访问治理
        - DQ 监控、规则、权限、访问政策语境、非结构化数据治理
        - 没有元数据织网的独立安全或质量工具
        - 风险 / 合规或共享数据控制预算
        - 有用的扩张层，但会抬高 TAM 测算中的重叠风险
      - - 现状替代品
        - 电子表格、wiki、人工管护、自建元数据存储、原生云目录
        - 超出人工或原生工具的完整企业治理工作流
        - 使用现有工具的业务单元或工程团队
        - 代表真实替换机会，但会拖慢平台标准化
    notes: 边界围绕治理语境软件和工作流控制，而不是所有分析或基础设施支出。纳入品类刻意保持邻近，因为买方常从相近项目中拨款；排除品类则避免框架膨胀成泛数据平台 TAM。
