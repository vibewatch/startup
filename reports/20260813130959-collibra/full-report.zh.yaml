      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Felix Van de Maele 仍担任创始人兼 CEO，联合创始人 Stijn Christiaens 也仍以首席数据公民身份，在内部产品和战略上保持很高可见度。截至 2026 年，Collibra
              的公开领导班子包括 CTO Madalina Tanasie、CFO Dan Graham、Chief People Officer Dana Bishara、CMO Chirag Dhull、GM
              Unstructured AI Kirk Haslbeck、覆盖销售和联盟的 EVP，以及一位公共部门 / SAP 总经理。对一家私营软件公司来说，董事会结构异常清晰：ICONIQ 的 Matthew
              Jacobson 担任董事长；Index Ventures、Sofina、Newion、Palo Alto Networks 和 Relativity 均有代表；Battery Ventures、CapitalG
              和 Dawn Capital 保留观察员席位。这套治理组合有助于证明长期投资人利益同向，但也凸显 Van de Maele 对品类叙事和平台再定位的关键人物依赖。公开证据还显示，公司定期刷新高管，包括 Dan
              Graham 在 2022 年底出任 CFO、2026 年新聘 CMO，说明 Collibra 仍在为后期规模化调整市场进入和财务体系，而不是已经进入完全静态的成熟公司状态。
