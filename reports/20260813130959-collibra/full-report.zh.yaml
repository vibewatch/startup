  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现结构
        blocks:
          - type: paragraph
            body: >-
              Collibra 的收入模式更像通过高接触、报价驱动动线销售的企业软件，而不是自助式 SaaS 漏斗。官方产品页覆盖一组宽模块——治理、目录、数据市场、质量和可观测性、隐私、血缘、访问、集成，以及 AI
              治理相关控制层——这意味着变现可以跨多个 SKU 打包，也可以在账户内分阶段扩张。公开定价不透明，但从业者证据和企业比较页面一致指向一种顾问式许可模式，并伴随实施和专业服务工作。本轮最强的外部数字代理来自
              Latka：它估计 2025 年收入约 $100M、客户约 1,000 家、平均合同价值
              $100K。这个估计不能当作经审计事实，但与一家服务大型组织的后期企业数据软件公司方向一致。更重要的承销点是，Collibra
              看起来不像轻量、使用量驱动工具那样变现。它通过工作流关键型企业软件收费，合同价值取决于模块广度、治理野心、部署范围和周边服务负担。
