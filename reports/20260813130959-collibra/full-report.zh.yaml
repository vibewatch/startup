            body: >-
              公开证据支持一个谨慎的财务结论。Collibra 很可能有真实的经常性收入基础、有意义的 ACV，以及横跨治理、质量、隐私、访问和 AI
              控制模块的可信扩张面。但几乎所有决定性承销变量仍是私有信息：ARR、GAAP 收入、收入结构、毛利率、服务占比、烧钱速度、现金、债务、NRR
              和客户集中度。在缺少这些变量时，后期估值更多是在讲金主质量和品类重要性，而不是已被证明的软件经济性。本章应采取的立场是：收入质量可信但未被证明；利润率路径在理论上有吸引力，却被实施负担遮住；资本依赖不能排除。投资人应把
              2021 年融资锚点和第三方收入估计当作有用背景，而不是经审计或董事会级经营数据的替代品。
