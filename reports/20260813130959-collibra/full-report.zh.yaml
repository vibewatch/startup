      - CV015
      - CV020
      - CV021
      - CV024
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 如果以 $100M 收入代理值计，Collibra 在不同收入倍数下对应的估值。
    data:
      items:
        - label: 5x
          value: 0.5
          unit: $B
        - label: 10x
          value: 1
          unit: $B
        - label: 15x
          value: 1.5
          unit: $B
        - label: 20x
          value: 2
          unit: $B
        - label: 30x
          value: 3
          unit: $B
        - label: 52.5x 历史估值标记
          value: 5.25
          unit: $B
    approximationNotes: 柱状图把简单收入倍数套用到本次报告唯一可信的公开收入代理值上。它只是框架工具， 不是公允价值保证。
    claimRefs:
      - CV005
      - CV006
      - CV013
      - CV019
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: compact
    summary: 基于公开证据，Collibra 当前股权价值的低 / 基准 / 高区间。
    data:
      items:
        - label: 公开证据支持的估值区间
          low: 0.4
          mid: 1.1
          high: 3
          unit: $B
          note: 低位 = 悲观情景，中位 = 基准中点，高位 = 较慷慨的乐观情景；全部低于 2021 年 $5.25B 估值标记
    approximationNotes: 这个区间刻意只反映公开证据能支撑的部分。只有未公开指标让分母或风险画像显著改善后， 才应调整这个区间。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: FV004
    title: 投资关键指标
    type: kpi
    layout: standard
    summary: 截至 2026 年 8 月，衡量 Collibra 可投性的关键公开证据指标。
    data:
      items:
        - label: 最近一次有力的新股估值锚点
          value: $5.25B
          detail: 2021 年 11 月 Series G 轮
        - label: 最佳公开收入代理值
          value: ~$100M
          detail: Latka 2025 年估计
        - label: $5.25B 下隐含的公开收入倍数
          value: ~52.5x
          detail: 使用约 $100M 公开代理值
        - label: 最相关的战略可比交易倍数
          value: ~4.8x
          detail: Informatica 收购价值除以 TTM 收入
        - label: 客户证据质量
          value: 4
          detail: 跨行业具名大型企业背书强
        - label: 财务可见度质量
          value: 1
          detail: ARR、NRR、毛利率、烧钱速度、现金和股权结构表仍未披露
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV008
      - CV014
      - CV015
