  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Collibra 的产品承诺直接站在隐私、访问控制和 AI
              治理审查路径上。这是一把双刃剑。公司如果交付可信控制，监管就是需求驱动；控制如果失效，同一套监管就会变成产品、声誉和合同风险。最强公开缓释证据对一家私营软件公司来说异常具体：2025 年 1 月发布提到 ISO
              42001 认证、参与 European Commission AI Pact，以及平台内的 EU AI Act
              评估工具。信任中心也强调安全、审计、软件交付和账户控制是组织优先事项。这些是正面因素，但不等同于完整法律尽调。本轮审阅没有发现完整公开隐私法律材料、条款，或足够全面的诉讼案卷，无法排除每一项法律风险。因此，关键法律问题不是
              Collibra 是否理解监管方向——它显然理解——而是其真实部署和治理结果能否在受监管客户环境中持续匹配其定位。
