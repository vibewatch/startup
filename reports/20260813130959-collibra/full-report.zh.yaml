      - number: '3.4'
        title: 切换成本、锁定效应与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Collibra 的护城河真实存在，但并非绝对。一旦公司把 Collibra
              用作术语表、所有权、血缘、工作流审批、政策映射、访问上下文和数据产品信任信号的记录系统，切换成本就会变得有意义，因为挑战不再只是重新索引元数据。买方还必须重建治理流程、所有权模型、集成和用户行为。不过，与其说这是硬基础设施锁定，不如说是流程和上下文锁定。原生云目录、语义层、开放元数据项目和
              AI 原生上下文工具，都在降低简单发现和文档功能的独特性。因此，Collibra 的优势在治理必须同时跨云、业务域、监管控制和 AI 系统时最强。核心耐久性问题是，随着既有厂商加入智能体 AI
              治理、数据质量自动化和更强元数据层，这种跨职能价值是否仍足够差异化。Salesforce-Informatica
              交易尤其重要，因为它验证了可信数据控制平台的战略价值，同时也强化了一个主要既有玩家，后者可以用更多周边资产追逐同一笔企业 AI 预算。
