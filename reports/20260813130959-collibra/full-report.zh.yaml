      - number: '8.4'
        title: 最终尽调问题与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              这家公司要靠尽调质量来判断：价格缺口究竟是买入机会，还是价值陷阱。最重要的问题包括当前年经常性收入（ARR）或 GAAP
              收入、毛利率、净留存率（NRR）/总留存率（GRR）、头部客户集中度、烧钱速度和现金跑道、AI
              治理产品的模块挂载，以及真实股权结构表和优先股堆叠。缺少这些信息，即便客户和产品信号很强，也无法支撑按激进价格进入后期私有公司。最清晰的投资逻辑破裂触发点同样直接：有证据表明原生平台持续赢下同一笔预算；AI
              治理仍更多是营销而非变现；出现重大信任或合规失败；或发现资产负债表和证券条款实质限制普通股上行空间。公开证据足以让 Collibra 留在观察名单上，但不足以认可历史估值。
