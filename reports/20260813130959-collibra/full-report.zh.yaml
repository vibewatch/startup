            body: >-
              最后一次明确披露的一级融资仍是 2021 年 11 月 Series G：Collibra 和 Index Ventures 都称公司以 $5.25B 估值融资
              $250M，较上一估值翻倍以上。第三方创投数据库和二级市场页面大体强化了这个 2021 年融资锚点，尽管当前二级价格质量偏弱。本轮公开数据库集中显示公司成立以来累计融资约
              $596M。这些数字支持其是一家融资充分、有金主支持的后期公司，但并不能回答投资人现在关心的问题：公司是否仍需要外部资本来维持增长、支持 AI
              产品扩张，或吸收企业实施成本。本轮审阅没有任何公开来源披露当前现金、债务、烧钱速度或现金跑道。RepVue 和归档 Indeed
              评价通过提及裁员、领导层批评和最近一轮后盈利可见度弱，增加了一层软谨慎。融资结论因此是混合的：历史上，Collibra
              能拿到强资本支持；从公开证据看，也不像近期困境案例。但若没有私有财务披露，当前资本充足性无法验证。
