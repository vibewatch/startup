      - number: '6.3'
        title: 具名客户成果、引用与扩张逻辑
        blocks:
          - type: paragraph
            body: >-
              具名客户证据是 Collibra 的真实强项。故事细节不完全一致，但合起来呈现出清晰模式：银行用平台做合规、透明度和数字化转型；企业软件和服务公司用它运营数据产品和 AI 决策；工业运营商用它把 AI
              治理变成正式工作流；医疗机构用它支持研究和数仓现代化。这暗示一条先落地、再扩张的路径：先从一个紧迫项目切入——合规、透明度、AI 治理、数据产品或质量——一旦客户在 Collibra
              上标准化上下文层，就能扩展到相邻模块。多个故事还把 Collibra 连接到具名合作伙伴或相邻模块，例如 Northern Trust 的 Snowflake，或 Adobe 周围的
              Tableau/AWS/SAP 关系。这种紧邻合作伙伴的扩张有价值，因为它把 Collibra 更深地嵌入周边数据项目。关键未知是，这种扩张是否普遍存在于整个客户基础，还是集中在较小一组旗舰账户。
