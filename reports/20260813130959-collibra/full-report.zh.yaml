  - id: TV005
    title: 投资逻辑击穿与止损触发器表
    columns:
      - 触发器
      - 重要性
      - 严重性
      - 下一步要问什么
    rows:
      - - 重大信任 / 合规失败
        - 会直接攻击公司的核心价值主张
        - 严重
        - 要求披露事故细节、客户影响和补救措施
      - - 原生平台或打包替代成为常态
        - 会削弱护城河，同时压缩增长和倍数
        - 严重
        - 要求按生态拆分赢 / 输和续约数据
      - - AI 治理货币化迟迟不出现
        - 会削弱高溢价未来增长叙事
        - 高
        - 要求模块附加率、ACV 提升和管线拆分
      - - 现金跑道偏弱或优先股堆叠带惩罚性
        - 无论增长如何，都可能损害普通股回报
        - 严重
        - 要求财资、债务和股权结构文件
      - - 客户集中度高且留存弱
        - 会让收入质量比公开客户名单暗示的更差
        - 高
        - 要求头部客户敞口和队列指标
    notes: 这些条件出现时，投资逻辑需要被放弃或大幅重新定价。
