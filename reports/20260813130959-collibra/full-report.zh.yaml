        title: 规模信号、客户与产品演进
        blocks:
          - type: paragraph
            body: >-
              公开规模证据很多，但并不完全一致。官网称 78 家 Fortune 500 公司由 Collibra 赋能，平台管理超过 20 亿个数据资产；平台页又单独称 Collibra 支撑 100 多家 Fortune
              500 公司。Forbes 报告截至 2025 年 9 月有 1,025 名员工；Tracxn 估计截至 2026 年 4 月有 1,095 名员工；Latka 列出 1,000 名客户、约 $100M 的
              2025 年估计收入，以及 $100,000 的平均合同价值。这些数字有方向性参考价值，但不能当作经审计的经营指标。产品演进更清楚：Collibra 2024 年加入 AI Governance，2023 年收购
              Husprey 以补上 notebook 式分析协作，2025 年收购 Raito 以强化访问治理，2025 年收购 Deasy Labs 以把治理延伸到非结构化数据，2026 年推出 AI Command
              Center，作为智能体 AI 监督的运营层。合在一起，证据指向一家真实的后期平台公司，正试图把数据目录和治理扩展到上下文工程、AI 生命周期控制和受治理的非结构化数据准备，以守住并扩张品类。
