      - number: '5.2'
        title: 架构、集成与运营模型
        blocks:
          - type: paragraph
            body: >-
              Collibra 公开材料所暗示的架构，是一套分层的元数据和控制平台，位于源系统之上，并把上下文推入下游工具。目录通过 100 多个原生集成连接云平台、数据库、企业应用、BI
              工具和遗留系统。治理定义政策、角色和批准后的业务语言；血缘映射转换和依赖；质量和可观测性监控异常，并把信号绑定到政策和数据产品；隐私和访问层管理敏感数据、脱敏、过滤和审批。合作伙伴页面把跨平台运营模型讲得很明确：Collibra
              将受治理语义同步到 Google Cloud Knowledge Catalog、Snowflake Horizon/Cortex、Databricks 环境和 SAP business-data-fabric
              工作流。这说明核心技术模型不是拥有数据平面，而是拥有数据周围的信任、上下文和政策平面。这种架构在异构环境中有价值，但也让集成覆盖、元数据保真度和工作流采用成为主要技术依赖。
