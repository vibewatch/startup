      - number: '5.5'
        title: 技术差异化与主要产品风险
        blocks:
          - type: paragraph
            body: >-
              Collibra 的技术差异化真实存在，但主要来自架构和工作流，而不是自研计算底座。企业需要一层跨平台系统来处理术语表、政策、血缘、质量、隐私、访问和 AI
              问责时，公司看起来最强；这比单纯元数据索引更难被替换。风险在于，栈中更简单的部分——目录、血缘抽取、语义文档，甚至部分 AI
              治理功能——继续在云平台和竞争套件中商品化。第二个风险是执行复杂度：每个新模块或收购都可能提高平台战略价值，同时让运营模型更难部署和支持。最后一个风险是证据质量。公开来源在定位和模块广度上信息丰富，但对
              SLA、支持指标、事故频率和模块级采用披露很薄。正确的产品结论因此是：广度和品类适配偏正面，但前提是证明集成质量和可重复的价值实现时间。
