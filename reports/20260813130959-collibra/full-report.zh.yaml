      - number: '5.3'
        title: 路线图方向、收购与模块成熟度
        blocks:
          - type: paragraph
            body: >-
              路线图方向非常清楚：走向面向 AI 的受治理上下文。Collibra 2024 年推出 AI Governance，2026 年推出 AI Command
              Center，并在合作伙伴和新闻材料中反复把自己重塑为企业 AI 控制平面。收购也支撑同一条线。Husprey 增加了 notebook 式 SQL 和协作能力；Raito 强化访问治理；Deasy Labs
              把治理延伸到非结构化数据。这些动作暗示，成熟核心模块很可能仍是治理、目录和血缘，而 AI 治理与智能体 AI
              控制是较新但战略优先的层。面向客户的产品页面还显示，公司正更努力地把质量评分、政策证据、语义上下文和访问控制连接成一个运营故事。这在战略上连贯，但也提出了常见平台问题：随着模块数量增加，产品是否仍然易懂、易采用。投资人应把广度同时看作护城河输入和复杂度风险。
