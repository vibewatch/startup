            body: >-
              公开牵引信号显示公司已形成有意义的企业客户版图，尽管最干净的私营经营指标仍未披露。官网称 78 家 Fortune 500 公司由 Collibra 赋能，超过 20 亿个数据资产通过平台管理。客户故事覆盖
              McDonald’s、SAP、Equifax 和 U.S. Office of the Secretary of Defense，支持 Collibra 拿下大型复杂客户，而不是长尾 SMB 订阅。Forbes
              列出 2025 年 9 月员工数 1,025；Tracxn 把 2026 年 4 月员工数放在约
              1,095；这些数字与规模化企业市场进入动线方向一致。公司客户基础也似乎偏向受监管和数据密集型组织，通常意味着销售周期更长，但 ACV
              更高、实施强度也更高。这些都不能单独证明收入质量。不过，它们支持一个判断：Collibra 的经济引擎来自企业账户集中、平台标准化，以及向相邻治理工作流扩张，而不是快速、低接触的席位增长。
