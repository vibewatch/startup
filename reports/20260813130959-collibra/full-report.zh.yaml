      - number: '3.5'
        title: 反向证据与仍需证明的事项
        blocks:
          - type: paragraph
            body: >-
              悲观情景不是 Collibra
              缺少产品广度；公开记录支持相反结论。真正的担心是，如果部署工作量、定价不透明和模块重叠让买方更愿意选择更窄但更易用或更便宜的替代方案，产品广度会变成税。对承销竞争耐久性最关键的变量，公开证据也很薄：相对
              Purview 和 Informatica 的赢单率、折扣行为、新 AI 治理模块的附加销售率，以及与原生云目录相比的真实替换模式。市场越来越围绕「面向 AI
              的可信数据」收敛，这提高了叙事商品化风险，即使执行质量仍有差异。投资人因此应把 Collibra 视为竞争上可信，但仍暴露在打包压力、AI
              原生新进入者，以及治理买方把技术栈拆分到发现、政策、质量和云原生工具，而不是标准化到一个运营层上的可能性中。
