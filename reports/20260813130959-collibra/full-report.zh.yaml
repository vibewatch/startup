      - number: '2.4'
        title: 增长驱动、约束与时点
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自 AI 采用和治理问责的汇合。Collibra 自己在 2024–2026 年的发布明确把公司重新定位到面向 AI 的受治理上下文；Dataversity 和 Cloudera 也都把 2026
              年治理项目描述为从静态层级转向对持续学习和智能体系统的主动问责。监管和风险压力是第二驱动：买方需要数据血缘、所有权、政策执行和证据链，以支撑隐私、访问和 AI
              监督。第三个驱动是经济性——糟糕的数据质量、重复发现工作和不清晰的所有权浪费分析师和工程师精力，集中式治理平台试图减少这些浪费。与顺风相对，采用约束也真实存在。从业者评论称，Collibra
              部署可能需要大量连接器工作、数据管护流程设计和专业服务；把内部人力和实施算进去，三年所有权成本有时大约达到许可成本的 2.5x-3x。竞争替代方案也压缩采用：Microsoft
              Purview、Informatica、Alation、Ataccama、Qlik/Talend 和 lakehouse
              原生工作流，都能从不同起点吸走同一场预算讨论。中端市场买方可能偏好更快、更轻的工具；大型买方如果无法把目录、治理、质量、隐私和 AI 治理 ROI 归到一个项目负责人名下，采购也可能停滞。
