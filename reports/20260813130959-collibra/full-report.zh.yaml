      - number: '1.5'
        title: 里程碑与反向信号
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年，Collibra 的里程碑节奏仍然活跃：多次获得分析机构认可，扩大超大规模云厂商合作，推进公共部门分发，并从「数据智能」重新定位到「数据与 AI 统一治理」，最终讲成「企业 AI
              控制平面」。客户证据覆盖 SAP、McDonald’s、Toyota Motor Europe、U.S. Office of the Secretary of Defense、HEINEKEN 和
              Equifax，说明公司在受监管和复杂环境中确有企业采用。主要谨慎点不是某个单一生死事故，而是一组偏软风险信号。第一，公开数据库在轮次命名、客户数、员工数和累计融资额上相互冲突，降低了对私营公司顶线统计的信心。第二，从业者和评测来源提到许可之外还有实施工作和实质成本，包括连接器工作、治理人员配备和专业服务。第三，归档
              Indeed 与当前 RepVue 评价中存在员工 / 销售端负面情绪，评论者提到裁员、战略漂移和盈利路径可见度弱。这些信号不推翻投资逻辑，但意味着后续章节评价增长质量、采用韧性和估值纪律时，应比只看
              Collibra 合作伙伴获奖节奏更谨慎。
