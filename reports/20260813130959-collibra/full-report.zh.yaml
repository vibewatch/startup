chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、业务足迹与商业模式
        blocks:
          - type: paragraph
            body: >-
              Collibra 2008 年起步于布鲁塞尔围绕语义和数据集成的研究。全球金融危机后，企业对数据治理的需求变得更硬，公司随之扩张到美国；云、隐私和 AI 项目兴起后，需求又一次提速。到 2025 年，Forbes
              仍把公司描述为一家源自布鲁塞尔、总部在纽约、由联合创始人 Felix Van de Maele 领导的数据治理平台；Tracxn 和 Latka 也把其运营足迹放在布鲁塞尔和纽约。Collibra
              现在对外讲的不再是狭义目录厂商，而是企业 AI 控制平面：一层位于源系统、模型和智能体之上的上下文与控制层。核心商业模式仍是把企业软件卖给大型组织，后者需要目录、治理、血缘、质量、隐私、访问和 AI
              治理控制。官方平台材料还强调对受监管行业的广泛适配、超过 100 个原生集成，以及治理工作流和语义上下文的混合，而不只是被动存储元数据。
