      - number: '3.3'
        title: 定价不透明、打包与分发能力
        blocks:
          - type: paragraph
            body: >-
              公开定价是整个企业治理竞争组的弱点。多数厂商让买方预约演示、联系销售或进入宽泛定价中心，而不是给出完整企业部署的透明套餐级价格。因此，合同结构、纳入模块、实施范围和折扣都对外部投资人不透明。定价不透明往往有利于已有采购关系的既有厂商和套件厂商：Microsoft
              可以把 Purview 挂进更大的云和安全关系，Informatica 能卖进广泛存量客户，Salesforce 计划收购 Informatica 还会进一步围绕智能体就绪数据基础设施收紧分发。Collibra
              通过生态杠杆部分抵消这个劣势——Databricks、Snowflake、Google Cloud 和 SAP 都能把它放到战略平台旁边，而不是单独请求目录预算。即便如此，从业者和比较来源仍一致暗示
              Collibra 位于市场中更重、更顾问式的一端。这让定价纪律和实施 ROI 成为竞争结果的核心，尤其在买方可以接受更窄功能，以换取更快部署或打包支出时。
