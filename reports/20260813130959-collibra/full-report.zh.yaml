      - number: '8.2'
        title: 估值背景：为什么公开证据难以支撑 2021 年估值
        blocks:
          - type: paragraph
            body: >-
              最强的公开估值锚点仍是 2021 年 11 月 $5.25B 的 Series G 轮。Forge 在 2025 年 4 月仍把该数字列为最后已知估值，Notice
              提供了质量较低的老股参考价格，但两者都没有解决当前承销问题。问题在分母质量。如果当前最好的公开收入代理指标是 Latka 约 $100M 的估计，则 2021 年估值意味着约 52.5
              倍收入。即便给公司一个更宽松的 $120M 公开乐观估计，倍数仍接近 44 倍。这个水平显著高于多数成熟或宽口径企业数据可比公司。Informatica 2025 年以约 $8B 出售，对应约 $1.67B
              收入，隐含倍数约 4.8 倍。Atlassian 按当前收入约 6.4 倍交易，DocuSign 更接近 3.4 倍。Snowflake 是这组同业中的例外，约 23 倍，但 Snowflake
              的增长曲线、平台地位和公开流动性环境不能直接迁移。核心估值问题因此不是 Collibra 质量是否高，而是公开证据能否支撑任何接近历史标记的价格。答案是否定的。这种错配就是核心估值压缩风险。
            claimRefs:
