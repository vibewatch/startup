      - number: '3.2'
        title: 功能广度、买方适配，以及 Collibra 真正突出的地方
        blocks:
          - type: paragraph
            body: >-
              功能广度仍是 Collibra 看起来最强的地方。公司官方产品面覆盖术语表 / 治理工作流、目录 / 发现、数据市场 / 数据产品、数据质量和可观测性、隐私控制、血缘、访问管理和集成
              API。这个广度还配上合作伙伴页面，明确把 Collibra 定位为 Databricks、Google Cloud、Snowflake 和 SAP 周围的跨平台控制层。竞争对手重心不同。Alation
              最偏数据发现和分析师采用。Informatica 强调治理、访问、隐私和更广数据管理基础设施的组合。Purview 面向 Microsoft 生态提供集成的治理、保护和合规层。Ataccama 以 AI
              驱动的数据质量自动化和受治理数据产品开局。Talend/Qlik 围绕 data fabric、集成和可信数据流动定位。Atlan 推出 AI
              原生企业数据图谱和上下文智能体叙事。实际采购中，当问题是跨多系统、多职能的运营治理，而不只是数据搜索时，Collibra 位置最好。代价是，企业级野心越大，实施复杂度和治理流程变革越会进入销售对话。
