          - type: paragraph
            body: >-
              最软但仍重要的风险簇，落在执行质量和模型不透明度上。RepVue 有负面销售评论，称公司在最新一轮融资后迷失方向，也缺少清晰的盈利路径叙事；归档的 Indeed
              评论则提到裁员和领导力观感较弱。这些来源不能定论，但可作为反证，因为它们抵消了纯粹庆祝式的后期公司叙事。运营上，Collibra 还背着关键人和协调风险：产品线宽、大型企业销售动作、合作伙伴生态、AI
              控制平面再定位，都要求跨职能执行力异常强。财务模型风险又放大了问题，因为公开来源仍未披露当前年经常性收入（ARR）、烧钱速度、债务、现金跑道、净留存率（NRR）或客户集中度。若部署周期拉长、合作伙伴杠杆变弱，或
              AI 治理挂载不及预期，外部很难判断公司能承受多少经营压力。风险不只在于某个环节出问题，也在于投资者可能无法从公开证据及时看到早期预警。
