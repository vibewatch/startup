      - number: '2.2'
        title: 用多重视角测算市场，并明确重叠
        blocks:
          - type: paragraph
            body: >-
              单一 TAM 估计会误导，因为公开发布方对品类范围并不一致。在更窄的数据治理软件视角下，Fortune Business Insights 估算 2026 年市场为 $5.38B，并预计到 2034 年增至
              $24.07B，CAGR 为 20.5%；Mordor Intelligence 则把 2026 年市场放在 $4.60B，2031 年放在 $9.68B，CAGR 为
              16.05%。两者都支持一个庞大且增长中的治理控制层，但区间本身已经暴露方法论风险。相邻的数据目录视角更小：Fortune Business Insights 称市场从 2026 年 $1.55B 增至 2034
              年 $4.54B；The Business Research Company 则把该品类定为 2025 年 $1.38B、2030 年 $3.66B。最新且增速最快的相邻领域是 AI 治理，Global
              Market Insights 估算 2026 年为 $1.1B，到 2035 年增至 $13.1B，CAGR 为 31.4%。承销时不能机械相加这些数字，因为目录、治理、质量、访问和 AI
              问责预算会在同一企业项目中重叠。更站得住脚的可服务市场框架，是把 2026 年大型企业治理现代化和 AI 监督的控制平面预算约束在 $4B-$6B；若不扣重叠，更宽的原始相邻市场上界约
              $7B-$8B。不同视角之间的差距本身就是尽调问题，不是四舍五入误差。
