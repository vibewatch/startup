chapter:
  number: 6
  title: Customers
summary: >-
  Collibra’s customer evidence is strongest on enterprise quality, not on precise retention metrics. Official proof spans global banks, healthcare, industrials, consumer brands, software, public sector, and AI-sensitive operators such as The Weir Group, McDonald’s, SAP, Equifax, Northern Trust, and the Office of the Secretary of Defense. That strongly supports real production adoption in complex environments. The public record is much weaker on current customer count, NRR/GRR, contract duration, and top-customer concentration, so the customer story is credible but still incomplete for underwriting durability.
sections:
- id: customer-base-segmentation
  title: Customer segmentation by buyer, vertical, and complexity
  body: >-
    Collibra’s customer base appears heavily weighted toward large, regulated, and data-intensive organizations rather than small self-serve teams. Official stories cover banking and financial services (ASN Bank, BNP Paribas Fortis, DNB, Northern Trust), healthcare (UC Davis Health), industrials (The Weir Group), software and digital platforms (Adobe, SAP), consumer and retail brands (McDonald’s, L’Oréal, HEINEKEN), public sector (Office of the Secretary of Defense), and information services (Wolters Kluwer, Equifax). The common thread is not industry alone but operating complexity: these are organizations with significant data estates, governance obligations, or AI/analytics transformation programs. That supports a segmentation model in which primary buyers are data leaders and governance owners, users span analysts and data stewards, and payers come from cross-functional platform or compliance budgets. It also suggests that Collibra is not optimized for a broad SMB tail. The product and
    go-to-market fit better where data trust is a board-level, regulatory, or enterprise-transformation problem.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-proof-of-production
  title: Adoption trajectory and proof of real production use
  body: >-
    The public adoption story is stronger on quality than on aggregate counts. Collibra’s homepage says 78 Fortune 500 companies are empowered by the platform and that more than two billion data assets are managed with Collibra today. Latka estimates roughly 1,000 customers, which is directionally consistent with a scaled late-stage software company but should not be treated as management-confirmed. The more persuasive evidence comes from the customer stories themselves. Weir built centralized AI inventories, risk-tiered workflows, and approval processes. Northern Trust explicitly cites Data Quality & Observability and Data Catalog. UC Davis Health describes a UC-wide medical data warehouse transformation. SAP describes data products enabling AI-powered decisions. That mix points to production use cases rather than pilot theater. The caution is that customer stories are curated references; they prove deployment reality and reference quality, but not breadth of usage across the whole base
    or whether adoption is expanding at the pace the valuation would require.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
- id: named-customer-outcomes-and-reference-quality
  title: Named-customer outcomes, references, and expansion logic
  body: >-
    Named-customer proof is a real strength for Collibra. The stories are not all equal in detail, but collectively they show a recognizable pattern: banks use the platform for compliance, transparency, and digital transformation; enterprise software and services firms use it to operationalize data products and AI decisions; industrial operators use it to turn AI governance into a formal workflow; and healthcare uses it to support research and warehouse modernization. This implies a land-and-expand path that starts with one urgent program—compliance, transparency, AI governance, data products, or quality—and can extend to adjacent modules once the customer standardizes on Collibra’s context layer. Several stories also connect Collibra to named partners or adjacent modules, such as Snowflake at Northern Trust or Tableau/AWS/SAP relationships around Adobe. That partner-adjacent expansion is valuable because it embeds Collibra deeper into surrounding data programs. The key unknown is whether
    this expansion is universal across the base or concentrated in a smaller set of flagship accounts.
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: retention-durability-and-concentration-risk
  title: Retention durability, land-and-expand logic, and concentration risk
  body: >-
    Public retention evidence is weak. No reviewed source disclosed NRR, GRR, contract length, logo churn, cohort curves, or top-customer concentration. What the public record does show is a customer set consistent with potentially durable enterprise contracts: large organizations, governance-heavy workflows, cross-functional deployment, and integration into policy, quality, and access processes. Those traits usually support renewal, but they can also create concentration risk because a smaller number of large customers may account for a large share of revenue. Partner-adjacent deployments may deepen stickiness, yet can also mean some accounts are influenced by hyperscaler or ecosystem decisions rather than pure product preference. The right read is therefore cautious. Customer durability is plausible, but it is not quantified. Investors should resist substituting logo quality for retention evidence.
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  tableRefs:
  - TU005
  figureRefs:
  - FU004
- id: customer-verdict-and-missing-proof
  title: Customer verdict and what is still missing
  body: >-
    The customer chapter supports a constructive but disciplined conclusion. Collibra has enough named references in complex enterprises to rule out the idea that it is a thinly adopted category story. The customer-quality signal is real and spans geographies and regulated sectors. However, the decisive underwriting questions remain unanswered publicly: how many customers are active today by segment, how usage expands after year one, how concentrated revenue is, what contract duration looks like, and whether AI-governance upsell is becoming material. Those are not small gaps; they are exactly the variables that separate a valuable enterprise platform from an expensive but unevenly adopted suite. The right conclusion is that production proof is strong, satisfaction and retention are directionally positive but weakly evidenced, and concentration plus expansion durability must be proven privately.
  claimRefs:
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
  - CU039
  - CU040
