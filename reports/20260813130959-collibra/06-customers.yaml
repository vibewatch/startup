- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Signal
  - What public evidence shows
  - Positive interpretation
  - Limitation / missing metric
  - Diligence ask
  rows:
  - - Regulated-enterprise fit
    - Many customers operate in finance, healthcare, or public sector
    - Such environments can support durable workflows and renewal
    - No public renewal or retention data
    - Request NRR/GRR and renewal by vertical
  - - Cross-module adoption hints
    - Northern Trust cites DQ&O and Data Catalog; multiple stories span governance plus AI/data-product use
    - Suggests some expansion beyond a single module
    - No module attach rate across whole base
    - Request attach and penetration by cohort
  - - Transformation depth
    - Stories describe data warehouse, AI inventory, compliance, and process transformation
    - Deep embedding can improve stickiness
    - Stories may overrepresent successful flagship accounts
    - Request reference mix and customer-count distribution
  - - Satisfaction signal
    - Named public references exist across many sectors
    - Customers are willing to be public references
    - No third-party CSAT/NPS/Gartner Peer Insights evidence in reviewed set
    - Request customer reference program metrics
  - - Partner adjacency
    - Snowflake / Tableau / AWS / SAP appear around some accounts
    - Partner-linked workflows can reinforce embeddedness
    - Partner influence can also create dependency or channel concentration
    - Request partner-sourced ARR and partner-led renewal data
  notes: >-
    This table intentionally separates plausible stickiness from proved retention. The public set supports the former far more than the latter.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk / opportunity
  - Public signal
  - Implication
  - Severity
  - Diligence ask
  rows:
  - - Land-and-expand through module breadth
    - Governance, catalog, quality, privacy, access, AI-governance surface
    - Upside if customers standardize on one trust layer
    - Medium opportunity
    - Show module expansion and NRR by cohort
  - - Flagship-account concentration
    - Customer proof skews toward very large enterprises
    - Revenue may be concentrated even if logo quality is high
    - Material risk
    - Provide top-10 customer revenue share
  - - Partner-influenced expansion
    - Some stories show partner or ecosystem adjacency
    - Can deepen integration and credibility
    - Moderate two-sided risk
    - Provide partner-sourced pipeline and renewal metrics
  - - AI-governance upsell
    - Weir and SAP stories show AI-linked use cases
    - Potential new wallet-share vector
    - Medium opportunity
    - Show attach, ACV uplift, and renewal effect
  - - Mid-market coverage gap
    - Public proof overwhelmingly favors large enterprises
    - May limit broad-base diversification
    - Moderate risk
    - Provide segment mix and win rates below enterprise tier
  notes: >-
    The public customer story is compelling but concentrated at the top end of the market. Investors need mix and concentration data before assuming those references generalize across the whole base.
