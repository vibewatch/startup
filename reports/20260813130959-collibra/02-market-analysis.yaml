- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: wide
  summary: >-
    Enterprise adoption usually starts with one urgent control problem and expands only after metadata and policy workflows become operational.
  data:
    nodes:
    - id: n1
      label: Trigger appears
      detail: Audit pressure, cloud sprawl, poor data trust, or AI-accountability concern creates urgency.
    - id: n2
      label: Metadata and ownership are connected
      detail: Catalog, lineage, and glossary work establish common context across systems.
    - id: n3
      label: Governance workflows are operationalized
      detail: Stewardship, policy, quality, and access rules become repeatable rather than manual.
    - id: n4
      label: Platform proves cross-functional value
      detail: More teams use the same governed context for compliance, analytics, and platform operations.
    - id: n5
      label: AI governance expansion
      detail: Governed context becomes the control layer for models, copilots, and agentic AI workloads.
    edges:
    - from: n1
      to: n2
      label: Urgent workflow creates buying motion
    - from: n2
      to: n3
      label: Metadata must become governed process
    - from: n3
      to: n4
      label: Operational use expands perceived ROI
    - from: n4
      to: n5
      label: Shared context supports AI-control upsell
  approximationNotes: >-
    The flow is an analytical adoption model synthesized from official product positioning, partner ecosystem announcements, and practitioner implementation commentary.
