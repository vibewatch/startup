- id: market-sizing-multiple-lenses
  title: Market sizing with multiple lenses and explicit overlap
  body: >-
    A single TAM estimate would be misleading because public publishers disagree on category scope. In the narrower data-governance-software lens, Fortune Business Insights sizes the 2026 market at $5.38B and projects growth to $24.07B by 2034 at a 20.5% CAGR, while Mordor Intelligence places the 2026 market at $4.60B and 2031 at $9.68B with a 16.05% CAGR. Both support a large and growing governance-control layer, but their spread already shows methodology risk. The adjacent data-catalog lens is smaller: Fortune Business Insights says the market grows from $1.55B in 2026 to $4.54B by 2034, while The Business Research Company pegs the category at $1.38B in 2025 and $3.66B by 2030. The newest and fastest-growing adjacency is AI governance, which Global Market Insights sizes at $1.1B in 2026 and $13.1B by 2035 at a 31.4% CAGR. For underwriting, those numbers should not be added mechanically because catalog, governance, quality, access, and AI-accountability budgets overlap in the same enterprise
    programs. A more defensible served-market frame is a constrained $4B-$6B 2026 control-plane budget for large enterprises modernizing governance and AI oversight, with a broader raw-adjacency outer bound around $7B-$8B before overlap. The gap between those lenses is itself a diligence issue, not a rounding error.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
