- id: growth-drivers-and-adoption-constraints
  title: Growth drivers, constraints, and timing
  body: >-
    The strongest growth driver is the convergence of AI adoption with governance accountability. Collibra's own 2024-2026 launches explicitly reposition the company around governed context for AI, while Dataversity and Cloudera both describe 2026 governance programs as moving away from static hierarchy toward active accountability for continuously learning and agentic systems. Regulatory and risk pressure is the second driver: buyers need data lineage, ownership, policy enforcement, and evidence trails for privacy, access, and AI oversight. A third driver is economic—poor data quality, duplicated discovery work, and unclear ownership create wasted analyst and engineering effort that centralized governance platforms try to reduce. Set against those tailwinds are real adoption constraints. Practitioner commentary says Collibra deployments can require significant connector work, stewardship process design, and professional services, with three-year ownership sometimes reaching roughly 2.5x-3x
    license cost once internal labor and implementation are counted. Competitive alternatives also compress adoption: Microsoft Purview, Informatica, Alation, Ataccama, Qlik/Talend, and lakehouse-native workflows can absorb the same budget conversation from different starting points. Mid-market buyers may prefer faster, lighter tools, while large buyers can stall procurement if they cannot separate catalog, governance, quality, privacy, and AI governance ROI into a single program owner.
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM032
