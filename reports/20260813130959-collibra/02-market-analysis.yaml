chapter:
  number: 2
  title: Market Analysis
summary: >-
  Collibra does not sit inside one clean TAM bucket: the company sells into enterprise data governance, metadata/catalog modernization, and emerging AI-governance budgets, with adjacent pull from data quality, access governance, and hyperscaler ecosystem spend. Public 2026 market lenses support a real multibillion-dollar category, but they diverge sharply on scope; the most defensible underwriting frame is an overlap-adjusted large-enterprise governance and AI-control software market rather than a simple sum of every adjacent analyst estimate.
sections:
- id: market-boundary-and-scope
  title: Market boundary, included spend, and substitutes
  body: >-
    Collibra's market boundary is broader than a traditional data catalog but narrower than the full "data infrastructure" universe. Official positioning now describes Collibra as an enterprise AI control plane built on governed context, while the platform page still roots that story in familiar governance building blocks: catalog, lineage, quality, policy, privacy, and workflow. That means the included spend is the software budget used to discover data, define ownership and policy, document lineage, enforce access and quality controls, and prove AI-accountability readiness. Excluded spend should include generic analytics warehousing, pure BI visualization, ETL-only tooling, and broad cloud consumption that does not directly map to governance or metadata control. The closest adjacencies are data catalog, data quality, access governance, privacy, and AI-governance software; Collibra's 2025 acquisitions and partner launches show the company is actively moving across those boundaries. Status-quo
    substitutes remain common: spreadsheet business glossaries, wiki-based stewardship, homegrown metadata layers, native cloud catalogs inside platform suites, and point-quality or access tools purchased without a unifying governance layer. That substitution picture matters because Collibra is rarely replacing "nothing"; it is usually trying to displace manual governance, fragmented point tools, or incumbent suites that already control adjacent budget lines.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
