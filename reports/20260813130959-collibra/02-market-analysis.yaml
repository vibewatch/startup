  - - Mordor Intelligence — data governance
    - $4.60B
    - $9.68B by 2031; 16.05% CAGR
    - Global data governance market
    - Different segmentation and timing; useful contradiction, not consensus
  - - Fortune Business Insights — data catalog
    - $1.55B
    - $4.54B by 2034; 14.42% CAGR
    - Global data catalog software
    - Catalog is only one module layer inside Collibra's broader positioning
  - - The Business Research Company — data catalog
    - No direct 2026 point disclosed in fetched text
    - $3.66B by 2030 from $1.38B in 2025; 20.8% CAGR
    - Global data catalog market
    - Directional corroboration only; 2026 must be interpolated if needed
  - - Global Market Insights — AI governance
    - $1.10B
    - $13.1B by 2035; 31.4% CAGR
    - Global AI-governance software
    - Fast-growing adjacency; overlaps with governance and model-risk budgets rather than standing alone
  - - Overlap-adjusted Collibra served-market estimate
    - $4B-$6B
    - Growth likely above GDP and below raw-adjacency sum
    - Large-enterprise governance plus AI-control budgets
    - Analytical estimate derived from overlapping public lenses, not a publisher-issued TAM
  notes: >-
    Publisher estimates are preserved even when they disagree because scope definitions differ. The overlap-adjusted served-market row is a synthesis lens for underwriting, not a claimed third-party market number.
