tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Collibra
  rows:
  - - Enterprise data governance control layer
    - Catalog, lineage, glossary, policy, stewardship, workflow, governance operating model
    - Warehouse compute, BI seats, ETL-only tooling without governance workflows
    - CDAO, governance office, CIO-sponsored platform budget
    - Core category and cleanest fit for current platform
  - - Data catalog / metadata discovery
    - Metadata indexing, search, ownership, business context, discoverability
    - Generic BI semantic layers and ad hoc documentation
    - Data platform, analytics enablement, governance teams
    - Important entry wedge but not the whole value proposition
  - - AI governance / AI control plane
    - Model inventory, policy, approvals, traceability, context controls for agents and GenAI
    - Model training infrastructure and general MLOps not tied to governance
    - AI platform lead, model-risk, shared innovation budget
    - Fastest-growing adjacency and a major current positioning theme
  - - Adjacent data quality / access governance
    - DQ monitoring, rules, entitlements, access-policy context, unstructured-data governance
    - Standalone security or quality tools with no metadata fabric
    - Risk/compliance or shared data-control budgets
    - Useful expansion layer that raises overlap risk in TAM math
  - - Status-quo substitutes
    - Spreadsheets, wikis, manual stewardship, homegrown metadata stores, native cloud catalogs
    - Full-featured enterprise governance workflow beyond manual or native tools
    - Business units or engineering teams using existing tools
    - Represents real displacement opportunity but slows platform standardization
  notes: >-
    The boundary is defined around governed-context software and workflow control, not all analytics or infrastructure spend. Included categories are deliberately adjacent because buyers often fund them from related programs; excluded categories keep the frame from becoming an inflated general data-platform TAM.
