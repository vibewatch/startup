- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI accountability and agentic-AI control
    - Tailwind
    - Immediate through 2026+
    - Supports Collibra's move from catalog vendor to control-plane narrative
    - How many production deals are sourced by AI-governance demand today?
  - - Regulation, lineage, and auditability pressure
    - Tailwind
    - Current
    - Favors tools that can prove ownership, policy, and evidence collection
    - Which verticals create the fastest close and highest renewal?
  - - Data-quality and productivity ROI
    - Tailwind
    - Current to medium term
    - Turns governance from compliance spend into operating-efficiency pitch
    - What quantified customer outcomes exist beyond reference stories?
  - - Implementation and stewardship effort
    - Headwind
    - Current
    - Slows time-to-value and can require services plus change management
    - What is median deployment time and internal staffing requirement?
  - - Incumbent-suite and native-tool competition
    - Headwind
    - Current
    - Purview, Informatica, Alation, Ataccama, Talend/Qlik, and cloud-native tools can absorb the same budget
    - What is Collibra's true win rate against incumbent standards?
  - - Category overlap and budget ambiguity
    - Headwind
    - Current
    - Unclear ownership between catalog, governance, quality, privacy, and AI governance can delay purchase
    - Who signs the check when more than one function benefits?
  notes: >-
    The market is attractive because governance and AI-control demand are rising together, but adoption is not frictionless. Implementation cost, suite competition, and blurred budget ownership are the main forces that can turn a large apparent TAM into a slower realized market.
