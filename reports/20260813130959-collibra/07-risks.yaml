    - Request marketplace revenue and private-offer economics
  - - Ecosystem concentration generally
    - Too much demand sourced through partners can weaken direct control
    - Channel leverage turns into channel dependence
    - Medium
    - Broad partner set reduces single-partner concentration
    - Request partner-sourced pipeline, ARR, and renewal share
  notes: >-
