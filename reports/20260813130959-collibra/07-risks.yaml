- id: TR004
  title: People / execution risk register
  columns:
  - Risk
  - Signal
  - Why it matters
  - Severity
  - Mitigation signal
  - Diligence ask
  rows:
  - - Sales and strategy drift
    - RepVue review says company lost its way after latest round
    - Late-stage platform repositioning can confuse field execution
    - Medium
    - Still has marquee customers and partner wins
    - Request pipeline conversion and win/loss trend by product
  - - Layoff / morale risk
    - Archived Indeed reviews mention layoffs and weak leadership perception
    - Can impair hiring, support quality, and GTM execution
    - Medium
    - Not enough evidence to declare a persistent issue
    - Request current attrition and leadership-stability data
  - - Cross-functional execution complexity
    - Broad product plus partner motions increase coordination load
    - Execution burden is structurally high
    - High
    - Visible product breadth and partnerships show company can ship, but not necessarily with uniform efficiency
    - Request org charts, release cadence, and accountability model
  - - Financial-model opacity
    - No public ARR, burn, runway, NRR, or concentration metrics
    - Risk can worsen before investors see it
    - High
    - Historic financing quality provides some cushion
    - Request full operating and treasury package
  - - AI-control-plane repositioning risk
    - Narrative shift may outrun field adoption or customer willingness to pay
    - Can create mismatch between roadmap and monetization
    - Medium
    - Real customer and partner AI stories exist
    - Request attach, ACV uplift, and renewal effect for AI modules
  notes: >-
    These risks are softer than a breach or lawsuit, but they directly affect whether the platform’s breadth turns into durable economics or into organizational drag.
