  rows:
  - - Databricks / Unity Catalog
    - Native governance capabilities keep improving inside the data/AI platform
    - Collibra may be displaced or narrowed to overlay status
    - High
    - Collibra extends governance across systems and agents beyond the lakehouse
    - Measure win/loss in Databricks-heavy accounts
  - - Microsoft Purview / Microsoft estate
    - Bundle leverage can collapse standalone governance budget
    - Collibra loses on procurement or acceptable-good-enough governance
    - High
    - Cross-platform neutrality matters in heterogeneous estates
    - Measure win/loss in Microsoft-heavy accounts
  - - Snowflake / Google Cloud / SAP partner sync
    - Partner APIs and semantics sync are central to value story
    - Roadmap or integration changes could reduce product advantage
    - Medium
