- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk area
  - Current mitigant
  - What to monitor
  - Kill trigger
  - Investment response
  rows:
  - - Regulatory / legal
    - ISO 42001, AI Pact, EU AI Act tool, trust-center posture
    - Customer adoption of AI-governance workflows; absence of trust incidents
    - Material public compliance or trust failure
    - Pause or reprice immediately
  - - Operational delivery
    - Named customer proof and broad module surface
    - Deployment time, support quality, failed rollout rate
    - Evidence of repeat implementation failure or poor reliability
    - Reduce conviction until ops proof improves
  - - Platform dependency
    - Cross-platform partner ecosystem
    - Win rates versus Purview / Unity Catalog / native tools
    - Sustained displacement by bundled or native governance
    - Recut TAM and moat assumptions
  - - People / execution
    - Founder continuity, marquee customers, and partner awards
    - Exec turnover, sales sentiment, productivity, release execution
    - Meaningful churn in key leaders or field collapse
    - Require lower entry price or avoid
  - - Financial-model opacity
    - Strong historical funding
    - Cash, burn, runway, retention, concentration, preference stack
    - Weak runway or punitive preference overhang
    - Do not underwrite without full financial disclosure
  notes: >-
    The thesis does not break on one negative review or one missing metric. It breaks if trust, platform differentiation, and capital sufficiency fail at the same time.
