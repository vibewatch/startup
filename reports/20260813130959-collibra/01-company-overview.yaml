company:
  name: Collibra
chapter:
  number: 1
  title: Company Overview
  summary: Collibra is a Belgian-founded, New York-and-Brussels enterprise data-governance software company that has evolved into an "enterprise AI control plane" positioning story. Public sources strongly support its 2008 founding, 2021 $250M Series G at a $5.25B valuation, broad enterprise product surface, and ongoing analyst/partner recognition; they are materially weaker on current revenue quality, customer count, headcount, and private-market pricing beyond secondary or database estimates.
sections:
- id: identity-business-model
  title: Identity, footprint, and business model
  body: 'Collibra began in 2008 out of Brussels research work around semantics and data integration, then expanded into the United States as enterprise demand for data governance hardened after the global financial crisis and later accelerated again with cloud, privacy, and AI programs. By 2025, Forbes still described the company as a Brussels-founded and New York-headquartered data-governance platform led by co-founder Felix Van de Maele, while Tracxn and Latka also placed its operating footprint across Brussels and New York. Collibra now markets itself less as a narrow catalog vendor and more as an enterprise AI control plane: a context-and-control layer that sits above source systems, models, and agents. The core commercial model remains enterprise software sold to large organizations that need catalog, governance, lineage, quality, privacy, access, and AI-governance controls. Official platform materials also stress broad regulated-industry fit, more than 100 native integrations, and
    a hybrid of governance workflows plus semantic context rather than just passive metadata storage.'
  claimRefs:
