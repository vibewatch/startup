- id: leadership-governance
  title: Leadership, founders, and governance
  body: 'Felix Van de Maele remains founder and CEO, while co-founder Stijn Christiaens remains a highly visible internal product and strategy figure as Chief Data Citizen. Collibra’s public leadership bench as of 2026 includes CTO Madalina Tanasie, CFO Dan Graham, Chief People Officer Dana Bishara, CMO Chirag Dhull, GM Unstructured AI Kirk Haslbeck, EVPs across sales and alliances, and a public-sector/SAP general manager. The board structure is unusually visible for a private software company: ICONIQ’s Matthew Jacobson chairs the board; Index Ventures, Sofina, Newion, Palo Alto Networks, and Relativity are represented; and Battery Ventures, CapitalG, and Dawn Capital retain observer seats. That governance mix is useful evidence of long-tenured sponsor alignment, but it also highlights key-person dependence on Van de Maele for category messaging and platform repositioning. Public evidence also shows periodic executive refreshes, including Dan Graham’s CFO appointment in late 2022 and a new
    CMO hire in 2026, suggesting Collibra is still adapting its go-to-market and finance stack for late-stage scale rather than operating in a fully static mature-company state.'
  claimRefs:
  - CO010
  - CO011
