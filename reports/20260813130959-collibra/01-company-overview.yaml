- id: funding-investors
  title: Funding history and investor base
  body: 'The strongest public financing anchor is still the November 2021 Series G: Collibra and Index Ventures both state the company raised $250 million at a $5.25 billion valuation, led by Sequoia Capital Global Equities and Sofina with Tiger Global plus existing backers Battery Ventures, CapitalG, Dawn Capital, Durable Capital, ICONIQ, and Index Ventures participating. Third-party venture databases broadly corroborate the same valuation but disagree on total capital raised: Tracxn reports roughly $596 million across nine rounds, while Latka reports about $596.2 million and Forge emphasizes the 2021 step-up from the prior $2.3 billion valuation. That means the user-supplied idea of more than $1 billion raised is not publicly supportable from the sources reviewed in this run. Secondary/marketplace indicators are also thin. Forge still shows Collibra as a private pre-IPO company with limited market activity, while Notice displays a quoted stock reference price but not enough transaction
    detail to treat it as a robust primary valuation benchmark. The investor roster, however, is undeniably heavyweight and long-duration, which matters for credibility and late-stage financing resilience even if cap-table seniority, preference stacking, and any debt remain undisclosed.'
  claimRefs:
  - CO019
  - CO020
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
  - CO026
  tableRefs:
  - TO003
- id: scale-product-evolution
  title: Scale signals, customers, and product evolution
  body: 'Public scale evidence is plentiful but not perfectly consistent. The homepage says 78 Fortune 500 companies are empowered by Collibra and that the platform manages more than two billion data assets, while the platform page separately says Collibra powers 100-plus Fortune 500 companies. Forbes reported 1,025 employees as of September 2025; Tracxn estimated 1,095 employees as of April 2026; and Latka lists 1,000 customers alongside roughly $100 million of estimated 2025 revenue and a $100,000 average contract value. Those figures are directionally useful but should not be mistaken for audited operating metrics. Product evolution is clearer: Collibra added AI Governance in 2024, acquired Husprey in 2023 to add notebook-style analytics collaboration, acquired Raito in 2025 to strengthen access governance, acquired Deasy Labs in 2025 to extend governance to unstructured data, and launched AI Command Center in 2026 as the operating layer for agentic AI oversight. Taken together, the evidence
    suggests a real late-stage platform company that is trying to defend and expand its category by broadening from data catalog and governance into context engineering, AI lifecycle control, and governed unstructured-data preparation.'
