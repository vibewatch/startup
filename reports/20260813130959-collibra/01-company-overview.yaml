- id: milestones-and-adverse-signals
  title: Milestones and adverse signals
  body: 'Collibra’s milestone cadence remained active through 2025–2026: repeated analyst recognitions, expanded hyperscaler partnerships, public-sector distribution steps, and a repositioning from “data intelligence” toward “unified governance for data and AI” and ultimately an “enterprise AI control plane.” Customer proof spans SAP, McDonald’s, Toyota Motor Europe, the U.S. Office of the Secretary of Defense, HEINEKEN, and Equifax, which indicates real enterprise adoption across regulated and complex environments. The main caution is not a single existential incident but a cluster of softer risk signals. First, public databases disagree about series naming, customer counts, headcount, and total capital raised, which lowers confidence in top-line private-company statistics. Second, practitioner and review sources describe implementation effort and material cost beyond licensing, including connector work, governance staffing, and professional services. Third, adverse employee/sales sentiment
    exists in archived Indeed and current RepVue reviews, where reviewers point to layoffs, strategic drift, and weak path-to-profitability visibility. Those signals do not break the thesis, but they do mean later chapters should treat growth quality, adoption durability, and valuation discipline more skeptically than Collibra’s partner-award cadence alone would suggest.'
  claimRefs:
