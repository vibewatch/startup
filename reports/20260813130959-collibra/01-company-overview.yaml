  evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-opacity
    missingEvidence: Current ARR, GAAP revenue, gross margin, burn, debt, and cash balance from management or audited statements.
    whyItMatters: These are the core inputs needed to judge revenue quality and capital adequacy in later chapters.
    diligencePath: Request board deck or audited financial package with trailing-twelve-month software metrics.
    relatedQuestionRefs:
    - QO022
    - QO014
  - type: conflicting-data
    severity: material
    topic: scale-estimates
    missingEvidence: Company-confirmed current headcount and customer count that reconcile official marketing with database estimates.
    whyItMatters: Conflicting operating-scale figures make it hard to gauge go-to-market maturity and efficiency.
    diligencePath: Ask management for current employees, active customers, and definition notes used in board reporting.
    relatedQuestionRefs:
    - QO023
    - QO024
  - type: private-evidence-only
    severity: material
    topic: secondary-market
    missingEvidence: Reliable cap-table, preference-stack, and recent secondary transaction data.
    whyItMatters: Without real private-market transaction context, the last official 2021 mark may materially overstate or understate entry value.
    diligencePath: Obtain latest 409A, cap table, and any secondary tender or broker indications from the company or existing investors.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: minor
    topic: leadership-table-coverage-to002
    missingEvidence: A full public committee and governance-responsibility map for every director and observer listed on the board page.
    whyItMatters: The leadership table is intentionally partial because public governance disclosure does not fully describe committee structure or role ownership.
    diligencePath: Request board committee roster, director biographies, and committee charters from management.
    relatedQuestionRefs:
    - QO006
    - QO007
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: milestone-table-coverage-to004
    missingEvidence: A fuller public chronology of internal milestones, customer-count milestones, and operating inflection points between financing events.
    whyItMatters: The milestone table intentionally prioritizes the most material public events and cannot fully represent internal operating chronology from public evidence alone.
    diligencePath: Ask management for a dated internal milestone timeline covering product, customer, and organizational inflection points.
    relatedQuestionRefs:
    - QO016
    - QO018
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: investor-map-coverage-to003
    missingEvidence: The full cap table, preference stack, debt facilities, and exact ownership percentages behind the public investor map.
    whyItMatters: The public investor table names key backers but does not reveal liquidation preferences, dilution, or control rights that matter for underwriting.
    diligencePath: Request the latest cap table, financing docs, and any secondary-transfer or debt schedules from management.
    relatedQuestionRefs:
    - QO008
