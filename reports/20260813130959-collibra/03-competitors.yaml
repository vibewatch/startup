- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Current mitigation
  - Diligence ask
  rows:
  - - Governance operating layer of record
    - Native cloud catalogs and semantic layers commoditize discovery
    - High
    - If discovery commoditizes, buyers may resist paying for full-stack governance
    - Collibra broadens into policy, quality, access, and AI control
    - Show win/loss data where native tools were the primary alternative
  - - Cross-platform neutrality
    - Microsoft and Salesforce/Informatica bundle governance into larger suites
    - High
    - Bundling can collapse a standalone governance budget line
    - Collibra leans on Databricks, Snowflake, SAP, and Google Cloud ecosystems
    - Quantify renewal and win rates in Microsoft-heavy estates
  - - Broad module surface
    - Breadth increases implementation complexity and slows time-to-value
    - High
    - Platform tax can drive buyers to narrower faster tools
    - Collibra positions automation, integrations, and reusable workflows
    - Provide median deployment time and services attach by module
  - - AI control-plane positioning
    - Every vendor is racing to attach AI-governance messaging
    - Medium
    - Messaging convergence can compress perceived differentiation
    - Collibra links AI governance to governed context and partner ecosystems
    - Prove attach rate and renewal uplift for AI-governance modules
  - - Workflow and policy embeddedness
    - Multi-homing across discovery, quality, and policy tools remains possible
    - Medium
    - Customers may standardize on more than one layer rather than a single suite
    - Collibra spans catalog, marketplace, quality, privacy, access, and lineage
    - Show actual module penetration and account standardization patterns
  - - Analyst recognition and credibility
    - Incumbents can match credibility with larger sales footprints
    - Medium
    - Recognition helps but does not guarantee budget capture
    - Repeated Gartner, IDC, and Forrester mentions support enterprise trust
    - Show how analyst recognition converts into pipeline and closes
  notes: >-
    Collibra’s moat is best understood as embedded governance process plus cross-platform context, not absolute technical lock-in. The main risks come from bundling, commoditization, and implementation friction.
