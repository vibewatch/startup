  rows:
  - - Collibra
    - Governance-first platform
    - Private late-stage; repeated Gartner/IDC/Forrester recognition
    - Large regulated and cross-functional enterprises
    - Governance workflows plus broad module surface and partner ecosystem
    - Heavier implementation and opaque enterprise pricing
  - - Alation
    - Data catalog / discovery specialist
    - Established catalog leader in enterprise data discovery
    - Data and analytics teams seeking strong search/adoption
    - Analyst-friendly discovery and AI-assisted search focus
    - Narrower governance/process posture than Collibra
  - - Informatica
    - Suite incumbent / data management platform
    - $8B agreed Salesforce acquisition in 2025
    - Large enterprise installed base across integration, MDM, governance
    - Breadth across governance, privacy, integration, MDM, quality
    - Can feel legacy/broad-suite-heavy and may require major-platform commitment
  - - Microsoft Purview
    - Platform-bundled governance suite
    - Backed by Microsoft distribution and installed base
    - Microsoft-centric enterprises
    - Integrated governance, protection, and compliance in era of AI
    - Best fit rises with Microsoft estate concentration; less neutral across heterogeneous stacks
  - - Ataccama
    - Data quality-led adjacent competitor
    - 2026 Gartner leadership callout on augmented data quality
    - Enterprises prioritizing automation and DQ modernization
    - AI-powered DQ, governed data products, automation
    - Less obviously the governance operating layer of record than Collibra
  - - Qlik / Talend
    - Integration / data fabric adjacent competitor
    - Backed by Qlik platform distribution
    - Buyers anchoring around trusted data movement and integration
    - Data fabric and integration-led trust/governance story
    - Not the clearest governance-workflow specialist
  - - Atlan
    - AI-native metadata challenger
    - Emerging AI-ready context and enterprise-graph story
    - Teams prioritizing speed, open context, and modern UX
    - AI-native context, faster setup, collaborative data graph
    - Less proven than Collibra on enterprise-wide governance operating model
  notes: >-
    The most important distinction is not feature checklist alone but entry point: discovery-led, suite-led, quality-led, cloud-bundled, and governance-led vendors all compete for overlapping budgets.
