  figureRefs:
  - FP002
- id: pricing-packaging-and-distribution-power
  title: Pricing opacity, packaging, and distribution power
  body: >-
    Public pricing remains a weak point across the enterprise governance set. Most vendors in this competitive group route buyers to demos, contact-sales motions, or broad pricing hubs instead of offering transparent package-level pricing for full enterprise deployments. That means contract structure, included modules, implementation scope, and discounting all remain opaque to outside investors. Pricing opacity tends to favor incumbents and suite vendors with existing procurement relationships: Microsoft can attach Purview inside a much larger cloud and security relationship, Informatica sells into a broad installed base, and Salesforce’s planned Informatica acquisition would further tighten distribution around agent-ready data infrastructure. Collibra partially offsets that disadvantage through ecosystem leverage—Databricks, Snowflake, Google Cloud, and SAP all help position it next to strategic platforms rather than as a standalone catalog budget ask. Even so, practitioner and comparison
    sources consistently imply that Collibra sits toward the heavier, more consultative end of the market. That makes pricing discipline and implementation ROI central to competitive outcomes, especially when buyers can accept narrower functionality in exchange for faster deployment or bundled spend.
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
  - CP027
  - CP028
  - CP029
  - CP030
  - CP031
  - CP032
