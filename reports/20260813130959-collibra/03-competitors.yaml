  - FP003
- id: adverse-competitive-evidence-and-open-questions
  title: Adverse evidence and what still needs proof
  body: >-
    The bear case is not that Collibra lacks product breadth; the public record supports the opposite. The concern is that product breadth can turn into a tax if deployment effort, pricing opacity, and overlapping modules make buyers more willing to choose a narrower but easier or cheaper alternative. Public evidence is also thin on the variables that matter most for underwriting competitive durability: win rates against Purview and Informatica, discounting behavior, attach rates for newer AI-governance modules, and actual replacement patterns versus native cloud catalogs. The market is increasingly converging around “trusted data for AI,” which raises the risk that messaging becomes commoditized even if execution quality remains differentiated. Investors should therefore treat Collibra as competitively credible but still exposed to bundling pressure, AI-native entrants, and the possibility that governance buyers split their stack across discovery, policy, quality, and cloud-native tooling
    rather than standardizing on one operating layer.
  claimRefs:
  - CP024
  - CP031
  - CP036
  - CP042
  - CP044
