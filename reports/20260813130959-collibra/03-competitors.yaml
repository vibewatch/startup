  title: Competitors
summary: >-
  Collibra competes in a crowded but still differentiated field. Its strongest position is as a governance-first operating layer spanning catalog, lineage, policy, quality, privacy, access, and emerging AI-governance workflows. The main threats are not only direct catalog peers like Alation and Atlan, but also suite incumbents and platform bundles—especially Informatica, Microsoft Purview, and increasingly Salesforce-backed Informatica once that acquisition closes—which can collapse the budget conversation into broader data-platform spend or lower-friction native alternatives.
sections:
- id: landscape-and-competitive-archetypes
  title: 'Landscape: direct peers, incumbents, adjacencies, and substitutes'
  body: >-
    Collibra no longer competes inside a narrow catalog-only arena. Its direct peer set includes governance and catalog vendors such as Alation and Atlan; its large-suite incumbent set includes Informatica and Microsoft Purview; and its adjacent challenge set includes Ataccama and Talend/Qlik, which approach the same buyer through data quality, integration, or fabric motions. Status-quo substitutes still matter as well: native cloud catalogs, spreadsheet-based stewardship, and in-house metadata layers can delay or shrink enterprise platform purchases. Collibra’s own product footprint is expansive—data governance, catalog, marketplace, quality and observability, privacy, lineage, access, integrations, and AI-governance/control-plane messaging—which means it often wins when buyers want a common operating layer rather than a point solution. It also means the company gets pulled into more comparisons, including against products that are cheaper, more embedded in an existing suite, or faster
    to deploy. The competitive reality is therefore multi-front: Collibra must beat discovery specialists on usability, enterprise suites on breadth and bundling, and native platform tools on implementation friction and time-to-value.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  - CP008
  - CP009
  - CP010
  - CP011
