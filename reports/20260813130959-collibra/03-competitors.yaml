- id: switching-costs-lock-in-and-moat-durability
  title: Switching costs, lock-in, and moat durability
  body: >-
    Collibra’s moat is real, but it is not absolute. Once a company uses Collibra as the system of record for glossary terms, ownership, lineage, workflow approvals, policy mapping, access context, and data-product trust signals, switching costs become meaningful because the challenge is no longer just re-indexing metadata. Buyers would also have to rebuild governance process, ownership models, integrations, and user behavior. That said, the moat is better understood as process-and-context lock-in than as hard infrastructure lock-in. Native cloud catalogs, semantic layers, open metadata projects, and AI-native context tools all reduce the uniqueness of simple discovery and documentation functions. Collibra’s advantage is therefore strongest where governance must cross clouds, business domains, regulatory controls, and AI systems simultaneously. The main durability question is whether that cross-functional value remains sufficiently differentiated as incumbents add agentic-AI governance,
    data-quality automation, and stronger metadata layers. The Salesforce-Informatica transaction is especially important because it validates the strategic value of trusted-data control platforms while also strengthening a major incumbent that can chase the same enterprise AI budget with more surrounding assets.
  claimRefs:
  - CP033
  - CP034
  - CP035
  - CP036
  - CP037
  - CP038
  - CP039
  - CP040
  - CP041
  - CP042
