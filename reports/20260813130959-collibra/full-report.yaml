  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacencies, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Collibra no longer competes inside a narrow catalog-only arena. Its direct peer set includes governance
              and catalog vendors such as Alation and Atlan; its large-suite incumbent set includes Informatica and
              Microsoft Purview; and its adjacent challenge set includes Ataccama and Talend/Qlik, which approach the
              same buyer through data quality, integration, or fabric motions. Status-quo substitutes still matter as
              well: native cloud catalogs, spreadsheet-based stewardship, and in-house metadata layers can delay or
              shrink enterprise platform purchases. Collibra’s own product footprint is expansive—data governance,
              catalog, marketplace, quality and observability, privacy, lineage, access, integrations, and
              AI-governance/control-plane messaging—which means it often wins when buyers want a common operating layer
              rather than a point solution. It also means the company gets pulled into more comparisons, including
              against products that are cheaper, more embedded in an existing suite, or faster to deploy. The
              competitive reality is therefore multi-front: Collibra must beat discovery specialists on usability,
              enterprise suites on breadth and bundling, and native platform tools on implementation friction and
              time-to-value.
