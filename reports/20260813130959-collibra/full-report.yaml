  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is straightforward: Collibra has real category relevance, real blue-chip customers, a
              broad governed-context product, and a credible AI-governance/control-plane narrative in a market that
              remains strategically valuable. The anti-thesis is even more important: public financial precision is
              poor, implementation burden is real, platform-bundle pressure is rising, and the last strong primary
              valuation anchor is a 2021 price that looks aggressive against current public operating proxies. Those two
              facts can coexist. Collibra may be a valuable company and still be a weak public-evidence entry at or near
              its last headline mark. For that reason, this chapter does not recommend a simple bullish underwriting
              posture. The evidence supports a cautious recommendation: track / research more if private diligence
              becomes available or if price materially resets, but avoid assuming the 2021 valuation remains justified
              today.
            claimRefs:
              - CV001
