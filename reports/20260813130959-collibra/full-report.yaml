  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization structure
        blocks:
          - type: paragraph
            body: >-
              Collibra’s revenue model is best understood as enterprise software sold through a high-touch, quote-led
              motion rather than a self-serve SaaS funnel. Official product pages cover a wide module set—governance,
              catalog, marketplace, quality and observability, privacy, lineage, access, integrations, and
              AI-governance-related control layers—which implies monetization can be packaged across multiple SKUs or
              phased account expansions. Public pricing is not transparent, but practitioner evidence and enterprise
              comparison pages consistently point to a consultative licensing model accompanied by implementation and
              professional-services work. The strongest numerical external proxy in this run comes from Latka, which
              estimates about $100M of 2025 revenue, roughly 1,000 customers, and a $100K average contract value. That
              estimate should not be treated as audited fact, but it is directionally consistent with a late-stage
              enterprise data-software company serving large organizations. The more important underwriting point is
              that Collibra does not appear to monetize like a lightweight usage-driven tool. It monetizes through
              workflow-critical enterprise software, where contract value depends on module breadth, governance
              ambition, deployment scope, and surrounding services burden.
