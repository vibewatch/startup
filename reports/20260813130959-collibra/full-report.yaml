      - number: '7.3'
        title: Partner, ecosystem, and platform dependency risk
        blocks:
          - type: paragraph
            body: >-
              Collibra’s biggest strategic dependency is that its control-plane value sits on top of other powerful
              platforms that keep adding native governance. Databricks documents Unity Catalog as a built-in governance
              layer for data and AI, and Microsoft Purview markets an integrated governance and protection platform
              across the Microsoft estate. Snowflake, Google Cloud, SAP, and AWS marketplace routes all matter as well.
              This is both a growth engine and a threat. Partners extend distribution, make the product relevant where
              data and AI work already happens, and can create deeper embeddedness. But the same partners or adjacent
              platform vendors can compress differentiation, own procurement, or turn Collibra into an optional overlay.
              The AWS Marketplace private-offer model also illustrates how enterprise terms can remain non-public and
              individually negotiated, adding commercial opacity. Investors should view ecosystem reach as a meaningful
              asset, but not mistake it for control. Collibra’s dependence on partner roadmaps, API stability, and
              native-platform competition is one of the most important risk vectors in the whole report.
            claimRefs:
