      - number: '7.2'
        title: Operational, security, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk in Collibra looks more like enterprise-software execution risk than like factory or
              logistics risk. The main concern is that the platform only works as promised when metadata harvesting,
              glossary stewardship, policy design, lineage extraction, quality monitoring, access control, and user
              adoption all align. Practitioner evidence says implementation can be expensive and services-heavy, which
              means time-to-value risk is material. The product chapter also showed that Collibra’s architecture sits
              above many other systems; weak connector quality or workflow adoption can undermine product outcomes even
              if the core software is sound. Publicly, the status page showed all systems normal at the time of review,
              and the trust center described security and infrastructure commitments, but no reviewed source provided
              SLA-grade uptime history, incident-rate detail, or customer support benchmarks. That leaves a meaningful
              operational-proof gap. For a platform sold as a trust layer, missing reliability detail is not fatal—but
              it is a real diligence blocker.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
