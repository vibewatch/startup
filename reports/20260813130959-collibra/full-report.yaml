      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Collibra's most plausible buyers are not generic SMB data teams; they are large-enterprise governance,
              risk, and platform owners with enough cross-functional authority to impose common definitions and process
              discipline. The primary buyer is usually a CDAO, governance lead, or data-office executive; co-buyers
              often include CIO or data-platform leadership, security and privacy teams, and increasingly AI platform or
              model-risk owners. Users span data stewards, domain owners, analysts, engineers, and policy/compliance
              operators. The payer therefore depends on the initial wedge: catalog and stewardship projects are often
              funded from a data-platform or transformation budget, quality and controls can pull from risk/compliance
              funds, and AI-governance projects may be sponsored by shared AI-program dollars. Adoption usually starts
              with one forcing function rather than a top-down enterprise redesign—common triggers are a regulatory
              audit, cloud migration, governance modernization, or the need to ground GenAI and agentic workflows in
              trusted metadata. Collibra's partner motions with Databricks, Snowflake, SAP, and Google Cloud matter
              because those ecosystems already touch the technical buyer and can turn governance from a standalone sale
              into a platform-enablement purchase. This helps explain why Collibra sells best in complex, regulated,
              multi-system environments rather than as a lightweight departmental data tool.
