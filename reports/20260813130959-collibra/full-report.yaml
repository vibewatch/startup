            body: >-
              Public evidence supports a cautious financial conclusion. Collibra likely has a real recurring-revenue
              base, meaningful ACVs, and a credible expansion surface across governance, quality, privacy, access, and
              AI-control modules. But almost every decisive underwriting variable remains private: ARR, GAAP revenue,
              revenue mix, gross margin, services mix, burn, cash, debt, NRR, and customer concentration. Late-stage
              valuation without those variables becomes a story about sponsor quality and category importance rather
              than about proven software economics. For this chapter, the right stance is that revenue quality is
              plausible but not proven, margin path is attractive in theory but obscured by implementation load, and
