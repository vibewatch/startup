      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a balanced risk verdict rather than an alarmist one. Collibra has real mitigants:
              enterprise-grade trust messaging, named regulated customers, product breadth, ecosystem leverage, and
              visible efforts to formalize AI-governance controls. But each major risk still needs a decision-useful
              monitoring indicator. Regulatory risk should be monitored through customer adoption of AI-governance
              workflows and absence of public trust incidents. Operational risk should be monitored through
              time-to-value, support quality, and reference depth. Platform dependency should be monitored through win
              rates in Microsoft-, Databricks-, and Snowflake-heavy accounts. People and model risk should be monitored
              through evidence of profitability path, executive stability, and retention metrics. The clearest
              thesis-break triggers are: a major trust or compliance failure; proof that native-platform bundles
              consistently displace Collibra in core accounts; evidence that newer AI-control modules are not
              monetizing; or discovery that the balance sheet and preference stack materially reduce upside for new
              investors.
