  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Collibra’s product is best described as an enterprise control and context layer for trusted data and AI,
              not as a warehouse, ETL engine, or BI front end. Official pages show a modular system that helps customers
              discover data, define business meaning, assign ownership, enforce policy, trace lineage, manage access,
              monitor quality, curate data products, and now govern AI workflows. In customer terms, the product is
              meant to solve a chain of problems: find the right data, know what it means, trust its quality, control
              who can use it, prove compliance, and extend that trusted context into models, copilots, and agents. The
              breadth matters because Collibra’s differentiation is not one single algorithmic feature. It is the
              attempt to make governed context reusable across many workflows. That helps explain why the company keeps
              broadening the product surface through new releases and acquisitions instead of remaining a narrow catalog
              vendor.
