      - number: '5.2'
        title: Architecture, integrations, and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture implied by Collibra’s public materials is a layered metadata-and-control platform that
              sits above source systems and pushes context into downstream tools. The catalog connects to cloud
              platforms, databases, enterprise apps, BI tools, and legacy systems through more than 100 native
              integrations. Governance defines policies, roles, and approved business language; lineage maps
              transformations and dependencies; quality and observability monitor anomalies and tie signals to policies
              and data products; privacy and access layers manage sensitive data, masking, filtering, and approvals. The
              partner pages make the cross-platform operating model explicit: Collibra syncs governed semantics into
              Google Cloud Knowledge Catalog, Snowflake Horizon/Cortex, Databricks environments, and SAP
              business-data-fabric workflows. This suggests the core technical model is not to own the data plane, but
              to own the trust, context, and policy plane around it. That architecture is valuable in heterogeneous
              estates, but it also makes integration coverage, metadata fidelity, and workflow adoption the main
              technical dependencies.
