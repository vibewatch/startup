      - number: '3.2'
        title: Feature breadth, buyer fit, and where Collibra really stands out
        blocks:
          - type: paragraph
            body: >-
              Feature breadth is where Collibra still looks strongest. The company’s official product surface spans
              glossary/governance workflows, catalog/discovery, marketplace/data products, data quality and
              observability, privacy controls, lineage, access management, and integration APIs. That breadth is paired
              with partner pages that explicitly position Collibra as the cross-platform control layer around
              Databricks, Google Cloud, Snowflake, and SAP. Competitors have different centers of gravity. Alation leans
              hardest into data discovery and analyst adoption. Informatica emphasizes combined governance, access,
              privacy, and broader data-management infrastructure. Purview presents an integrated governance,
              protection, and compliance layer for the Microsoft estate. Ataccama leads with AI-powered data quality
              automation and governed data products. Talend/Qlik positions around data fabric, integration, and trusted
              data movement. Atlan pushes an AI-native enterprise-data-graph and context-agent story. In practice,
              Collibra is best positioned when the buying problem is operational governance across many systems and
              functions, not just data search. The trade-off is that the more enterprise-wide its ambition becomes, the
              more implementation complexity and governance-process change become part of the sales conversation.
