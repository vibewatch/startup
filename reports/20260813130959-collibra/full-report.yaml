      - number: '8.2'
        title: Valuation context and why the 2021 mark is hard to defend publicly
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation anchor remains the November 2021 Series G at $5.25B. Forge continues to
              show that figure as the last known valuation in April 2025, and Notice provides a low-quality
              secondary-reference price, but neither source solves the current underwriting problem. The problem is
              denominator quality. If the best current public revenue proxy is Latka’s ~$100M estimate, then the 2021
              mark implies roughly 52.5x revenue. Even giving the company a more generous $120M public bull-case
              estimate still implies nearly 44x. That is dramatically above most mature or broad enterprise-data
              comparables. Informatica’s 2025 sale at approximately $8B against roughly $1.67B of revenue implies a
              multiple around 4.8x. Atlassian trades around 6.4x on current revenue, while DocuSign sits closer to 3.4x.
              Snowflake is the exception in this peer set at roughly 23x, but Snowflake’s growth profile, platform
              position, and public liquidity context are not directly transferable. The central valuation issue is
              therefore not whether Collibra is high quality. It is whether public evidence supports a price anywhere
              close to the historical mark. It does not. That mismatch is the core valuation compression risk.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
