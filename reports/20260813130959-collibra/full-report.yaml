      - number: '5.5'
        title: Technical differentiation and the main product risks
        blocks:
          - type: paragraph
            body: >-
              Collibra’s technical differentiation is real but mostly architectural and workflow-driven, not rooted in a
              proprietary compute substrate. The company appears strongest where enterprises need one cross-platform
              layer for glossary, policy, lineage, quality, privacy, access, and AI accountability. That is harder to
              displace than basic metadata indexing alone. The risk is that simpler portions of the stack—cataloging,
              lineage extraction, semantic documentation, even some AI-governance features—continue to commoditize
              inside cloud platforms and competitor suites. The second risk is execution complexity: every new module or
              acquisition can improve the platform’s strategic value while making the operating model harder to deploy
              and support. The final risk is evidence quality. Public sources are rich on positioning and module
              breadth, but thin on SLAs, support metrics, incident frequency, and module-level adoption. The right
              product verdict is therefore positive on breadth and category fit, but conditional on proving integration
