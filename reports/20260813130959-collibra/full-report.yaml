      - number: '4.3'
        title: Cost structure, unit economics, and margin drivers
        blocks:
          - type: paragraph
            body: >-
              The major weakness in the public record is not whether Collibra sells software; it is how expensive that
              software is to land and support. Practitioner evidence says total cost of ownership over three years can
              reach roughly 2.5x-3x the initial license cost once implementation, internal staffing, and operations are
              counted. The same source points to six-figure integration-development costs and frequent use of
              professional services to accelerate deployment. That implies the cost structure is likely pulled in two
              directions: software economics can be attractive once an account is stable, but deployment and
              change-management burden may weigh on gross margin realization and CAC payback in the early phases. Public
              evidence does not provide CAC, payback, gross margin, or NRR, so the most defensible unit-economics view
              is proxy-based. Large enterprise logos and ecosystem partners suggest high contract values and strong
              expansion potential, while review sources and implementation commentary imply significant pre- and
              post-sale labor. In other words, Collibra may have good eventual revenue durability, but the path to that
              durability probably carries a heavier services and organizational-adoption tax than simpler SaaS tools.
