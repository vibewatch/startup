      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              This is a company where diligence quality will decide whether a price gap is a buying opportunity or a
              value trap. The most important asks are current ARR or GAAP revenue, gross margin, NRR/GRR, top-customer
              concentration, burn and runway, module attach for AI-governance products, and the real cap table and
              preference stack. Without those, even strong customer and product signals cannot justify a late-stage
              private entry at aggressive pricing. The clearest thesis-break triggers are also straightforward: evidence
              that native platforms consistently win the same budget; proof that AI-governance remains more marketing
              than monetization; major trust or compliance failure; or discovery that the balance sheet and security
              terms materially limit common-equity upside. Public evidence is strong enough to keep Collibra on the
              watchlist, but not strong enough to endorse the historic mark.
            claimRefs:
