  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Collibra's market boundary is broader than a traditional data catalog but narrower than the full "data
              infrastructure" universe. Official positioning now describes Collibra as an enterprise AI control plane
              built on governed context, while the platform page still roots that story in familiar governance building
              blocks: catalog, lineage, quality, policy, privacy, and workflow. That means the included spend is the
              software budget used to discover data, define ownership and policy, document lineage, enforce access and
              quality controls, and prove AI-accountability readiness. Excluded spend should include generic analytics
              warehousing, pure BI visualization, ETL-only tooling, and broad cloud consumption that does not directly
              map to governance or metadata control. The closest adjacencies are data catalog, data quality, access
              governance, privacy, and AI-governance software; Collibra's 2025 acquisitions and partner launches show
              the company is actively moving across those boundaries. Status-quo substitutes remain common: spreadsheet
              business glossaries, wiki-based stewardship, homegrown metadata layers, native cloud catalogs inside
              platform suites, and point-quality or access tools purchased without a unifying governance layer. That
              substitution picture matters because Collibra is rarely replacing "nothing"; it is usually trying to
              displace manual governance, fragmented point tools, or incumbent suites that already control adjacent
              budget lines.
