      - number: '7.4'
        title: People, execution, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The softest but still important risk cluster is around execution quality and model opacity. RepVue
              contains adverse sales commentary that the company lost its way after the latest round and lacked a clear
              path-to-profitability story, while archived Indeed reviews mention layoffs and weak leadership
              perceptions. These sources are not definitive, but they are useful as disconfirming evidence because they
              push against a purely celebratory late-stage narrative. Operationally, Collibra also carries key-person
              and coordination risk: a broad product, large-enterprise sales motion, partner ecosystem, and
              AI-control-plane repositioning all require unusually strong cross-functional execution. Financial-model
              risk compounds the issue because public sources still do not show current ARR, burn, debt, runway, NRR, or
              concentration. That makes it hard to judge how much operating stress the company can absorb if deployment
              cycles elongate, partner leverage weakens, or AI-governance attach disappoints. The risk is not only that
              something breaks; it is that investors may not see early warning signals in time from public evidence.
            claimRefs:
