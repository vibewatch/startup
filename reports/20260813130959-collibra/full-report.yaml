  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Collibra’s product promise puts it directly in the path of privacy, access-control, and AI-governance
              scrutiny. That is a double-edged sword. If the company delivers trustworthy controls, regulation becomes a
              demand driver; if controls fail, the same regulation becomes a source of product, reputational, and
              contractual risk. The strongest public mitigation evidence is unusually concrete for a private software
              company: the January 2025 release cites ISO 42001 certification, European Commission AI Pact
              participation, and an EU AI Act assessment tool inside the platform. The trust center also emphasizes
              security, audits, software delivery, and account controls as organizational priorities. These are
              positives, but not equivalent to full legal diligence. The reviewed run did not surface complete public
              privacy-legal materials, terms, or a litigation docket comprehensive enough to rule out every legal risk.
              The key legal question is therefore not whether Collibra understands the regulatory direction—it clearly
              does—but whether its real deployment and governance outcomes consistently match its positioning in
              regulated customer environments.
