      - number: '1.4'
        title: Scale signals, customers, and product evolution
        blocks:
          - type: paragraph
            body: >-
              Public scale evidence is plentiful but not perfectly consistent. The homepage says 78 Fortune 500
              companies are empowered by Collibra and that the platform manages more than two billion data assets, while
              the platform page separately says Collibra powers 100-plus Fortune 500 companies. Forbes reported 1,025
              employees as of September 2025; Tracxn estimated 1,095 employees as of April 2026; and Latka lists 1,000
              customers alongside roughly $100 million of estimated 2025 revenue and a $100,000 average contract value.
              Those figures are directionally useful but should not be mistaken for audited operating metrics. Product
              evolution is clearer: Collibra added AI Governance in 2024, acquired Husprey in 2023 to add notebook-style
              analytics collaboration, acquired Raito in 2025 to strengthen access governance, acquired Deasy Labs in
              2025 to extend governance to unstructured data, and launched AI Command Center in 2026 as the operating
              layer for agentic AI oversight. Taken together, the evidence suggests a real late-stage platform company
              that is trying to defend and expand its category by broadening from data catalog and governance into
              context engineering, AI lifecycle control, and governed unstructured-data preparation.
