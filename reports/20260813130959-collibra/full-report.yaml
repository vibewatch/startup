      - number: '2.5'
        title: What remains unknowable from public evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence is good enough to prove the market is real, growing, and strategically important, but it
              is not good enough to cleanly underwrite share, win rate, or budget depth. Market reports disagree on
              definitions and rarely publish the full bottoms-up math behind their 2026 figures. Official positioning
              shows where Collibra wants to play, yet public sources do not reveal module-level revenue, attach rates,
              renewal performance by buyer segment, or how much of current demand is expansion from existing large
              accounts versus new-logo adoption. The largest open questions are therefore not whether the category
              exists, but how much of it is truly winnable for an expensive enterprise platform and how durable that
              wedge remains against suite incumbents and native ecosystem tooling. Those uncertainties should temper any
              attempt to convert broad governance and AI-governance CAGR numbers into aggressive valuation assumptions.
            claimRefs:
              - CM018
