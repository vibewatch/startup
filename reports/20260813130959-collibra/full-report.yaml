      - number: '1.3'
        title: Funding history and investor base
        blocks:
          - type: paragraph
            body: >-
              The strongest public financing anchor is still the November 2021 Series G: Collibra and Index Ventures
              both state the company raised $250 million at a $5.25 billion valuation, led by Sequoia Capital Global
              Equities and Sofina with Tiger Global plus existing backers Battery Ventures, CapitalG, Dawn Capital,
              Durable Capital, ICONIQ, and Index Ventures participating. Third-party venture databases broadly
              corroborate the same valuation but disagree on total capital raised: Tracxn reports roughly $596 million
              across nine rounds, while Latka reports about $596.2 million and Forge emphasizes the 2021 step-up from
              the prior $2.3 billion valuation. That means the user-supplied idea of more than $1 billion raised is not
              publicly supportable from the sources reviewed in this run. Secondary/marketplace indicators are also
              thin. Forge still shows Collibra as a private pre-IPO company with limited market activity, while Notice
              displays a quoted stock reference price but not enough transaction detail to treat it as a robust primary
              valuation benchmark. The investor roster, however, is undeniably heavyweight and long-duration, which
              matters for credibility and late-stage financing resilience even if cap-table seniority, preference
              stacking, and any debt remain undisclosed.
