- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: >-
    The last clearly disclosed primary financing remains the November 2021 Series G: Collibra and Index Ventures both say the company raised $250M at a $5.25B valuation, more than doubling the prior mark. Third-party venture databases and secondary-market pages broadly reinforce that 2021 financing anchor, even though current secondary pricing quality is weak. Public databases in this run cluster around roughly $596M of total funding since inception. Those numbers support a heavily financed, sponsor-backed late-stage company, but they do not answer the question investors care about now: whether the company still needs outside capital to sustain growth, fund AI-product expansion, or absorb enterprise implementation cost. No reviewed public source disclosed current cash, debt, burn, or runway. RepVue and archived Indeed reviews add a softer caution by referencing layoffs, leadership criticism, and weak visibility into profitability after the latest round. The financing verdict is therefore
    mixed: Collibra has historically had access to strong capital and does not look like a near-term distress case from public evidence, but current capital adequacy cannot be verified without private financial disclosure.
  claimRefs:
