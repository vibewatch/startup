chapter:
  number: 4
  title: Financials
summary: >-
  Collibra’s public financial picture is directionally understandable but not underwriteable with precision. The business is clearly enterprise-software-led, likely driven by large recurring subscription contracts plus material implementation and stewardship overhead. The best outside estimate in this run points to roughly $100M of 2025 revenue/ARR on about 1,000 customers and a $100K average contract value, but management has not publicly disclosed current ARR, gross margin, burn, cash, debt, or retention. The result is a credible late-stage enterprise software profile with meaningful opacity on revenue quality and capital adequacy.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization structure
  body: >-
    Collibra’s revenue model is best understood as enterprise software sold through a high-touch, quote-led motion rather than a self-serve SaaS funnel. Official product pages cover a wide module set—governance, catalog, marketplace, quality and observability, privacy, lineage, access, integrations, and AI-governance-related control layers—which implies monetization can be packaged across multiple SKUs or phased account expansions. Public pricing is not transparent, but practitioner evidence and enterprise comparison pages consistently point to a consultative licensing model accompanied by implementation and professional-services work. The strongest numerical external proxy in this run comes from Latka, which estimates about $100M of 2025 revenue, roughly 1,000 customers, and a $100K average contract value. That estimate should not be treated as audited fact, but it is directionally consistent with a late-stage enterprise data-software company serving large organizations. The more important
    underwriting point is that Collibra does not appear to monetize like a lightweight usage-driven tool. It monetizes through workflow-critical enterprise software, where contract value depends on module breadth, governance ambition, deployment scope, and surrounding services burden.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  tableRefs:
