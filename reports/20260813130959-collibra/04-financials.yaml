  - TI002
  figureRefs:
  - FI001
- id: public-traction-and-enterprise-sales-proxies
  title: Public traction and enterprise-sales proxies
  body: >-
    Public traction signals suggest a meaningful enterprise franchise, even though the cleanest private operating metrics remain undisclosed. The homepage says 78 Fortune 500 companies are empowered by Collibra and that more than two billion data assets are managed through the platform. Customer stories span McDonald’s, SAP, Equifax, and the U.S. Office of the Secretary of Defense, which supports the idea that Collibra closes large and complex accounts rather than long-tail SMB subscriptions. Forbes listed 1,025 employees in September 2025, while Tracxn placed employee count around 1,095 in April 2026; those figures are directionally aligned with a scaled enterprise go-to-market motion. The company’s customer base also appears weighted toward regulated and data-intensive organizations, which usually implies longer sales cycles but larger ACVs and higher implementation intensity. None of this proves revenue quality on its own. It does, however, support the view that Collibra’s economic engine
    is enterprise-account concentration, platform standardization, and expansion into adjacent governance workflows rather than rapid low-touch seat growth.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  figureRefs:
  - FI003
- id: cost-structure-unit-economics-and-margin-drivers
  title: Cost structure, unit economics, and margin drivers
  body: >-
    The major weakness in the public record is not whether Collibra sells software; it is how expensive that software is to land and support. Practitioner evidence says total cost of ownership over three years can reach roughly 2.5x-3x the initial license cost once implementation, internal staffing, and operations are counted. The same source points to six-figure integration-development costs and frequent use of professional services to accelerate deployment. That implies the cost structure is likely pulled in two directions: software economics can be attractive once an account is stable, but deployment and change-management burden may weigh on gross margin realization and CAC payback in the early phases. Public evidence does not provide CAC, payback, gross margin, or NRR, so the most defensible unit-economics view is proxy-based. Large enterprise logos and ecosystem partners suggest high contract values and strong expansion potential, while review sources and implementation commentary imply
    significant pre- and post-sale labor. In other words, Collibra may have good eventual revenue durability, but the path to that durability probably carries a heavier services and organizational-adoption tax than simpler SaaS tools.
  claimRefs:
