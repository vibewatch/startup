figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: wide
  summary: >-
    How Collibra’s public product and customer evidence most plausibly converts into recurring software revenue and associated services.
  data:
    nodes:
    - id: n1
      label: Enterprise governance pain
      detail: Regulated or complex buyers need catalog, policy, lineage, quality, privacy, and access controls.
    - id: n2
      label: High-touch platform sale
      detail: Buyer purchases a quote-led enterprise platform scoped around one or more governance workflows.
    - id: n3
      label: Implementation and integration work
      detail: Connector setup, metadata harvesting, process design, and services accelerate deployment.
    - id: n4
      label: Recurring subscription base
      detail: Platform becomes ongoing system of record for governance and trusted-data workflows.
    - id: n5
      label: Module expansion
      detail: Quality, access, privacy, marketplace, and AI-governance layers can expand wallet share.
    edges:
    - from: n1
      to: n2
      label: Urgent governance problem creates enterprise sale
    - from: n2
      to: n3
      label: Deployment scope adds services and adoption work
    - from: n3
      to: n4
      label: Go-live converts project into recurring software
    - from: n4
      to: n5
      label: Embedded trust layer supports upsell
  approximationNotes: >-
    This bridge is analytical rather than disclosed by management. It synthesizes public product breadth, customer proof, and practitioner deployment commentary into the most plausible revenue model path.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI007
  - CI022
- id: FI002
  title: Unit economics bridge
  type: flow
  layout: wide
  summary: The likely trade-off between large ACVs and heavier deployment burden in Collibra’s enterprise sales model.
  data:
    nodes:
    - id: u1
      label: Large complex buyer
      detail: Fortune 500 and regulated enterprises can support higher ACV and durable budgets.
    - id: u2
      label: Higher ACV opportunity
      detail: Quote-led enterprise contracts and module breadth support meaningful contract values.
    - id: u3
      label: Implementation tax
      detail: Services, stewardship, and integration work raise pre-live cost and slow payback.
    - id: u4
      label: Embedded workflow value
