companyProfile:
  summary: >-
    Collibra is a Belgian-founded, New York-and-Brussels enterprise software company founded in 2008.
    It sells a broad governed-context platform for data catalog, governance, quality, privacy, access,
    lineage, and newer AI governance / AI control workflows. Public evidence supports meaningful scale,
    real enterprise adoption, and a heavyweight investor base, but leaves most underwriting-critical
    operating and cap-table metrics undisclosed.
