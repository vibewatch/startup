  topStrengths:
    - Collibra has a broad, strategically relevant product surface spanning governance, catalog, quality, privacy, access, lineage, and AI governance rather than a single-purpose tool.
    - Public customer proof is strong and includes blue-chip, regulated, and complex deployments such as McDonald’s, SAP, Northern Trust, UC Davis Health, Equifax, and the Office of the Secretary of Defense.
    - The company has real ecosystem relevance across Databricks, Google Cloud, Snowflake, SAP, and public-sector channels.
    - The market is real and strategically important, with governance and AI-control demand rising together.
  topRisks:
    - 'Public financial opacity remains severe: ARR, NRR, gross margin, burn, cash, debt, concentration, and cap-table seniority are not publicly disclosed.'
    - 'The last strong valuation anchor is the 2021 $5.25B mark, which looks extremely stretched against the best visible public revenue proxy.'
    - Native-platform and suite competition from Microsoft Purview, Informatica, Databricks/Unity Catalog, and others can compress both growth and multiples.
    - Implementation burden and services intensity may reduce time-to-value and undermine premium software economics.
    - AI-governance upside is plausible but not yet publicly proven as a major monetized expansion driver.
  unresolvedGaps:
    - 'Current ARR / GAAP revenue, gross margin, services mix, burn, debt, cash, and runway.'
    - NRR / GRR / churn, contract duration, and top-customer concentration.
    - Module attach and monetization depth for AI Governance and AI Command Center.
    - Current cap table, preference stack, 409A, and secondary transaction context.
    - Competitive win/loss and renewal performance in Microsoft-, Databricks-, and Snowflake-heavy accounts.
finalJudgment:
  stance: watch
  rationale: >-
    Collibra belongs on a serious watchlist because the product, market, and customer signals are real.
    But the current public-evidence valuation case is too weak to justify aggressive entry without private
    financial and cap-table diligence or a materially lower price.
  claimRefs: [CO020, CO022, CO029, CE024, CU033, CR039, CV020, CV024, CV031, CV041]
