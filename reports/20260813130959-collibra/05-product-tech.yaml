  title: Product module / asset matrix
  columns:
  - Module / asset
  - What it does
  - Workflow role
  - Evidence of maturity
  - Key dependency
  rows:
  - - Data governance
    - Automates workflows, centralizes policies, business terms, and accountability
    - Creates approved language and governance process
    - Core named product page and repeated analyst recognition
    - Adoption depends on stewardship and policy ownership
  - - Data catalog
    - Centralized inventory, context, profiling, and discovery across 100+ integrations
    - Helps users find and understand data with business context
    - Core named product page and ecosystem-wide positioning
    - Metadata connection and ingestion fidelity
  - - Data quality & observability
    - Monitors anomalies and ties quality signals to data products, policies, and AI models
    - Makes trust measurable and operational
    - Dedicated product page with automation language
    - Rule authoring, monitoring coverage, and source connectivity
  - - Data marketplace
    - Internal shopping-like access to curated data products and assets
    - Improves self-service discovery and governed reuse
    - Dedicated product page with AI recommendations and request flows
    - Relies on strong catalog, ownership, and access processes
  - - Data privacy and access
    - Sensitive-data discovery, policy enforcement, masking, filtering, and approvals
    - Controls compliant usage and user entitlements
    - Dedicated privacy and access pages
    - Sensitive-data mapping and policy accuracy
  - - Data lineage
    - Maps transformations and dependencies end to end
    - Supports impact analysis, explainability, and root-cause tracing
    - Dedicated lineage page and AI explainability language
    - Connector breadth and transformation parsing accuracy
  - - AI governance / AI command
    - Extends governed context to models, copilots, and agents
    - Turns data governance into AI-control workflow
    - 2024-2026 launch pages and partner narratives
    - Depends on underlying metadata, policy, and partner integrations
  notes: >-
    The module set shows why Collibra is more than a catalog vendor. It also shows how interdependent the product has become: module value compounds when the underlying context layer is accurate and widely adopted.
