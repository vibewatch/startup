chapter:
  number: 5
  title: Product & Technology
summary: >-
  Collibra’s product is no longer just a data catalog. The company now exposes a broad governed-context platform spanning governance, catalog, marketplace, quality/observability, privacy, lineage, access, integrations, and new AI-control workflows. Its architecture appears to be a metadata-, policy-, and workflow-control layer sitting above source systems and cloud platforms rather than a replacement for them. That gives Collibra strong cross-platform relevance, but it also makes integrations, deployment complexity, and proof of operational reliability the critical technical diligence topics.
sections:
- id: product-definition-and-module-map
  title: Product definition in customer workflow terms
  body: >-
    Collibra’s product is best described as an enterprise control and context layer for trusted data and AI, not as a warehouse, ETL engine, or BI front end. Official pages show a modular system that helps customers discover data, define business meaning, assign ownership, enforce policy, trace lineage, manage access, monitor quality, curate data products, and now govern AI workflows. In customer terms, the product is meant to solve a chain of problems: find the right data, know what it means, trust its quality, control who can use it, prove compliance, and extend that trusted context into models, copilots, and agents. The breadth matters because Collibra’s differentiation is not one single algorithmic feature. It is the attempt to make governed context reusable across many workflows. That helps explain why the company keeps broadening the product surface through new releases and acquisitions instead of remaining a narrow catalog vendor.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: operating-architecture-and-dependencies
  title: Architecture, integrations, and operating model
  body: >-
    The architecture implied by Collibra’s public materials is a layered metadata-and-control platform that sits above source systems and pushes context into downstream tools. The catalog connects to cloud platforms, databases, enterprise apps, BI tools, and legacy systems through more than 100 native integrations. Governance defines policies, roles, and approved business language; lineage maps transformations and dependencies; quality and observability monitor anomalies and tie signals to policies and data products; privacy and access layers manage sensitive data, masking, filtering, and approvals. The partner pages make the cross-platform operating model explicit: Collibra syncs governed semantics into Google Cloud Knowledge Catalog, Snowflake Horizon/Cortex, Databricks environments, and SAP business-data-fabric workflows. This suggests the core technical model is not to own the data plane, but to own the trust, context, and policy plane around it. That architecture is valuable in heterogeneous
    estates, but it also makes integration coverage, metadata fidelity, and workflow adoption the main technical dependencies.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
