    topic: operational-reliability
    missingEvidence: >-
      Public product materials do not disclose uptime, incident frequency, support-response times, or customer-reported reliability benchmarks.
    whyItMatters: A control-plane product can look strategically strong while still underperforming operationally in complex deployments.
    diligencePath: Request SLA documents, support metrics, incident history, and customer references focused on production reliability.
    relatedQuestionRefs:
    - QE022
    - QE025
