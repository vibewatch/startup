    missingEvidence: >-
      Public sources do not quantify adoption, attach rates, or renewal impact for newer modules such as AI Governance, AI Command Center, and access-governance additions.
    whyItMatters: Breadth only creates moat if customers actually deploy and expand into the newer layers.
    diligencePath: Request module penetration, attach, and renewal uplift by cohort and account size.
