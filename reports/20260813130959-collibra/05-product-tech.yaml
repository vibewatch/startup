  - FE003
- id: roadmap-expansion-and-product-maturity
  title: Roadmap direction, acquisitions, and maturity by module
  body: >-
    The roadmap direction is unmistakably toward AI-ready governed context. Collibra launched AI Governance in 2024, launched AI Command Center in 2026, and repeatedly reframed its role in partner and press materials as the enterprise AI control plane. Acquisitions support the same arc. Husprey added notebook-style SQL and collaboration capabilities; Raito strengthened access governance; and Deasy Labs extended governance into unstructured data. Those moves imply that mature core modules likely remain governance, catalog, and lineage, while AI-governance and agentic-AI control are newer but strategically prioritized layers. Customer-facing product pages also show growing effort to connect quality scores, policy evidence, semantic context, and access controls into one operational story. That is strategically coherent, but it raises the usual platform question: whether the product remains understandable and adoptable as module count grows. Investors should treat breadth as both a moat input
    and a complexity risk.
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-security-and-compliance-controls
  title: Trust, security, compliance, and regulated deployment evidence
  body: >-
    Public trust and compliance signals are meaningful, though incomplete. The data-privacy, access, and governance pages all stress audit readiness, policy enforcement, sensitive-data discovery, and role-based control. Collibra’s 2026 AI-governance leadership release adds ISO 42001 certification, an AI Pact commitment, and an EU AI Act assessment tool, which is stronger than generic “responsible AI” language. The AWS ICMP public-sector announcement gives additional evidence that the company is positioning for regulated federal environments. Still, trust proof is not the same as reliability proof. Public pages explain what the controls are meant to do, but they do not provide detailed uptime, incident-rate, or support-response metrics. The product chapter therefore supports the view that Collibra has credible trust posture and regulated-market ambition, while leaving operational reliability as an explicit diligence gap.
  claimRefs:
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  tableRefs:
  - TE004
- id: technical-risks-and-differentiation-verdict
  title: Technical differentiation and the main product risks
  body: >-
    Collibra’s technical differentiation is real but mostly architectural and workflow-driven, not rooted in a proprietary compute substrate. The company appears strongest where enterprises need one cross-platform layer for glossary, policy, lineage, quality, privacy, access, and AI accountability. That is harder to displace than basic metadata indexing alone. The risk is that simpler portions of the stack—cataloging, lineage extraction, semantic documentation, even some AI-governance features—continue to commoditize inside cloud platforms and competitor suites. The second risk is execution complexity: every new module or acquisition can improve the platform’s strategic value while making the operating model harder to deploy and support. The final risk is evidence quality. Public sources are rich on positioning and module breadth, but thin on SLAs, support metrics, incident frequency, and module-level adoption. The right product verdict is therefore positive on breadth and category fit,
    but conditional on proving integration quality and repeatable time-to-value.
  claimRefs:
  - CE034
  - CE035
  - CE036
  - CE037
  - CE038
  - CE039
  - CE040
  - CE041
  - CE042
