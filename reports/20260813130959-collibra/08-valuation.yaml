    - Needed to replace third-party estimates with real operating denominator
    - Critical
  - - Gross margin, services mix, CAC/payback, and burn
    - Needed to judge software quality and capital intensity
    - Critical
  - - NRR / GRR / churn and top-customer concentration
    - Needed to assess durability and downside risk
    - Critical
  - - AI-governance module attach and renewal uplift
    - Needed to test whether the new narrative is monetizing
    - High
  - - Latest cap table, preferences, 409A, and any secondary activity
    - Needed to price actual equity risk and upside
    - Critical
  - - Competitive win/loss by ecosystem
    - Needed to test native-platform displacement risk
    - High
  notes: >-
    If management cannot provide these materials, investors should assume the public valuation gap is a warning sign rather than an opportunity.
