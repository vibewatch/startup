- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - Severity
  - What to ask next
  rows:
  - - Major trust / compliance failure
    - Would directly attack the company’s core value proposition
    - Critical
    - Request incident details, customer fallout, and remediation
  - - Native-platform or bundle displacement becomes the norm
    - Would weaken moat and compress both growth and multiple
    - Critical
    - Request win/loss and renewal data by ecosystem
  - - AI-governance monetization fails to appear
    - Would undercut the premium future-growth narrative
    - High
    - Request module attach, ACV uplift, and pipeline split
  - - Weak runway or punitive preference stack
    - Could impair common-equity returns regardless of growth
    - Critical
    - Request treasury, debt, and cap-table documents
  - - High customer concentration with weak retention
    - Would make revenue quality worse than public logos imply
    - High
    - Request top-customer exposure and cohort metrics
  notes: These are the conditions under which the investment thesis would need to be abandoned or drastically repriced.
  claimRefs:
  - CV026
  - CV027
  - CV028
  - CV029
  - CV030
