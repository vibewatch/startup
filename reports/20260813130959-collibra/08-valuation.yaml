company:
  name: Collibra
chapter:
  number: 8
  title: Valuation
summary: >-
  Public evidence does not support paying near Collibra’s last well-corroborated $5.25B valuation. The strongest operating estimate in this run is roughly $100M of 2025 revenue/ARR, which implies a ~52x revenue multiple at that mark—far above Informatica’s roughly $8B sale on ~$1.67B of revenue, Atlassian’s ~6.4x public multiple, and DocuSign’s ~3.4x. Even generous bull-case public bands struggle to justify the 2021 price without private proof of much higher current revenue, exceptional retention, or unusual strategic scarcity. The right public-evidence stance is research-more / avoid at the historic mark, with a stretched valuation view and only medium confidence because core private metrics remain undisclosed.
sections:
- id: thesis-antithesis-and-recommendation
  title: Recommendation, thesis, and anti-thesis
  body: >-
    The positive case is straightforward: Collibra has real category relevance, real blue-chip customers, a broad governed-context product, and a credible AI-governance/control-plane narrative in a market that remains strategically valuable. The anti-thesis is even more important: public financial precision is poor, implementation burden is real, platform-bundle pressure is rising, and the last strong primary valuation anchor is a 2021 price that looks aggressive against current public operating proxies. Those two facts can coexist. Collibra may be a valuable company and still be a weak public-evidence entry at or near its last headline mark. For that reason, this chapter does not recommend a simple bullish underwriting posture. The evidence supports a cautious recommendation: track / research more if private diligence becomes available or if price materially resets, but avoid assuming the 2021 valuation remains justified today.
  claimRefs:
  - CV001
  - CV002
