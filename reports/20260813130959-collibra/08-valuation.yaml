- id: scenario-analysis-and-return-math
  title: Bull, base, and bear scenarios
  body: >-
    The public-evidence scenario frame should start with humility. Because revenue, retention, gross margin, burn, and cap-table details remain private, any valuation range is inherently analytical rather than definitive. The bull case requires that public estimates understate revenue materially, that AI-governance and partner-led expansion meaningfully lift ACV and retention, and that the business deserves a premium software multiple despite services and implementation burden. The base case assumes Collibra is a real but still opaque enterprise software company whose public operating proxy is roughly right and whose appropriate public-style multiple lands materially above legacy-software names but well below the 2021 headline mark. The bear case assumes slower expansion, bundle pressure from native platforms and suites, and no evidence that newer AI-control modules are monetizing enough to offset multiple compression. On the public data alone, the base and bear cases dominate. The bull
    case remains possible, but it depends on private proof that is absent from this run.
  claimRefs:
  - CV016
  - CV017
  - CV018
  - CV019
