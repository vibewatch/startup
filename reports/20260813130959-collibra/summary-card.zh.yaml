  topStrengths:
    - Collibra 的产品面很宽，覆盖治理、目录、质量、隐私、访问、血缘和 AI 治理，不是单点工具，战略相关性强。
    - >-
      公开客户证据扎实，包含 McDonald’s、SAP、Northern Trust、UC Davis Health、Equifax 和 Office of the Secretary of Defense
      等蓝筹、强监管、复杂部署案例。
    - 公司在 Databricks、Google Cloud、Snowflake、SAP 和公共部门渠道中都有真实生态位置。
    - >-
      The market is real and strategically important, with governance and AI-control demand rising together.
      市场是真实且具战略意义的；治理需求和 AI 控制需求正在一起上升。
  topRisks:
    - 公开财务不透明度仍很高：ARR、NRR、毛利率、烧钱速度、现金、债务、集中度和股权结构优先顺位都没有公开披露。
    - 最后一个强估值锚是 2021 年 $5.25B；拿最好的公开收入代理指标对照，这个锚显得极度偏高。
    - Microsoft Purview、Informatica、Databricks / Unity Catalog 等原生平台和套件竞争，可能同时压缩增长和估值倍数。
    - >-
      Implementation burden and services intensity may reduce time-to-value and undermine premium software economics.
      落地负担和服务强度可能拉长价值兑现时间，并削弱高端软件经济性。
    - >-
      AI-governance upside is plausible but not yet publicly proven as a major monetized expansion driver. AI
      治理上行空间有可能存在，但尚未被公开证明是重要的付费扩张驱动。
  unresolvedGaps:
    - 当前 ARR / GAAP 收入、毛利率、服务组合、烧钱速度、债务、现金和现金跑道。
    - NRR / GRR / 流失率、合同期限和最大客户集中度。
    - AI Governance 和 AI Command Center 的模块附加率与变现深度。
