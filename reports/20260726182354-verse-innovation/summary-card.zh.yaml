  topStrengths:
    - Dailyhunt 和 Josh 在新闻、短视频、创作者、出版方和广告主之间提供真实规模的本地语种分发。
    - FY25 在收入增长、烧钱速度和运营效率上出现实质改善。
    - 组合已不止单一广告信息流，还包括订阅、adtech、创作者商业化和优质内容等可选项。
    - 公司吸引过可信的全球投资者；若治理和盈利能力同步改善，IPO 可选性仍然真实。
    - 即便竞争加剧，本地语言定位相对全球平台仍有差异化。
  topRisks:
    - 2024 年少数投资者下调估值、随后又出现治理噪音后，2022 年 $5B 估值锚若不打折，很难承销。
    - 审计指出的控制缺陷和后续收入质量争议，会抬高投资者应采用的折现率。
    - 客户耐久性、留存、集中度和产品层利润率数据披露明显不足。
    - IPO 时间表已有公开讨论，但真正 IPO 准备就绪的公开证据仍不完整。
    - 广告、创作者商业化和 premium 变现必须同时成熟，上行估值情景才站得住。
  unresolvedGaps:
    - 完整股权结构表、清算优先权、债务、认股权证，以及排在普通股之前的任何高级索取权。
    - Dailyhunt、Josh、Premium、Collab 和 NexVerse.ai 各业务线的收入、毛利率和烧钱贡献。
    - 能证明收入质量的广告主续约、创作者留存、订阅流失和集中度指标。
    - 董事会层面的控制整改跟踪表，以及 FY24 缺陷已完全关闭的经测试证据。
    - 超出公开媒体报道的具体 IPO 准备里程碑、顾问范围和治理工作流。
