callouts:
  - calloutType: strength
    title: "FY25 shows a credible operating reset"
    body: >
      The combination of 88% operating-revenue growth, lower burn, and sharply improved cost ratios is strong
      enough to treat FY25 as a real reset rather than pure headline management spin.
    claimRefs: [CI004, CI005, CI006, CI007]
  - calloutType: risk
    title: "Cash runway still cannot be underwritten from public sources"
    body: >
      Historical fundraising scale does not replace current liquidity disclosure. Without cash-on-hand, debt, and
      product-level margin data, investors still cannot confidently underwrite runway or the odds of a forced round.
    claimRefs: [CI022, CI023, CI027, CI028, CI029, CI036]

