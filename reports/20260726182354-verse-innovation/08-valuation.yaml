- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Governance deterioration
    - New material weakness, qualified audit, or formal enforcement
    - Destroys premium multiple case
    - Pause or walk away
  - - Profitability miss
    - No credible evidence of breakeven progress after FY26 target window
    - Undermines recovery and IPO narrative
    - Cut valuation range and delay entry
  - - Customer-quality miss
    - Retention or cohort data show weak monetization quality
    - Turns scale into low-quality traffic rather than durable asset
    - Re-rate toward bear range
  - - Aggressive pricing ask
    - Seller anchors to old $5B without new proof
    - Leaves no margin for governance and execution risk
    - Decline unless structure or price changes
  notes: Kill triggers convert the recommendation into executable IC guardrails.
  claimRefs:
  - CV017
  - CV021
  - CV031
  - CV035
  - CV037
  - CV038
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Liquidation preference, debt, warrants, and any senior securities
    - Private valuation support depends on what common-equity holders actually own
    - Finance / legal
  - - Control-remediation closure
    - Board tracker, auditor follow-up, and tested closure evidence
    - Narrative improvement is insufficient without proof
    - Finance / audit committee
  - - Product-level monetization
    - Dailyhunt, Josh, Premium, Collab, and NexVerse.ai revenue and margin splits
    - Need to know what drives value and what is still experimental
    - Business-line finance
  - - Customer durability
    - Retention, repeat-spend, subscription churn, and concentration data
    - Scale without durability deserves a discount
    - Growth / analytics
  - - IPO readiness
    - Advisor mandate, timeline realism, and governance workstreams
    - Exit optionality is a core part of the upside case
    - CEO / board / bankers
  notes: These asks are the minimum evidence set needed before treating VerSe as a priced investment rather than a watchlist story.
