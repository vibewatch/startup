- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Probability signal
  - Downside / upside trigger
  rows:
  - - Bear
    - Governance noise persists; monetization quality remains opaque; IPO timing slips
    - $1.8B-$2.5B range, closer to distressed private-mark discipline than to old unicorn pricing
    - Plausible if control closure is slow
    - New audit or legal escalation
  - - Base
    - FY25 improvement continues; profitability path partly validates; no major new shock, but disclosure remains incomplete
    - $2.8B-$3.6B range, near the 2024 investor-mark band plus some recovery credit
    - Most supportable today
    - Stable burn improvement with no fresh governance surprises
  - - Bull
    - Controls close cleanly; H2 FY26 profitability shows up; subscriptions and adtech strengthen revenue quality
    - $4.2B-$5.0B range, approaching but not blindly exceeding the 2022 anchor
    - Requires several things to go right together
    - Audited proof of profitability and better product-level KPI disclosure
  notes: Scenario values are analyst ranges anchored to retained public evidence, not management guidance or a formal fairness opinion.
