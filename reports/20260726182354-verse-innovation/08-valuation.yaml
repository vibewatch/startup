- id: exit-readiness-final-call
  title: Recommendation is track / selective only below the old anchor until diligence closes the governance and economics gap
  body: The most supportable recommendation today is not pass forever, but track or invest only with disciplined entry terms and a hard diligence checklist. VerSe appears capable of reaching a more attractive exit window if it converts FY25 improvement into audited profitability progress, proves cleaner controls, and shows that new monetization layers are not cosmetic. It also appears capable of disappointing investors if governance questions linger or if the company seeks IPO-style pricing before the public file is ready. Exit readiness is therefore conditional. A clean listing case would require evidence that governance remediation is complete, that the DPDP and IT-rule burden is operationalized, and that investors can reconcile multiple valuation datasets with a credible cap-table and preference-stack view. Until then, the correct stance is high-risk, medium-confidence, and strongly price-sensitive. That is a serious recommendation, not a non-answer. The burden of proof is therefore on
    price, structure, and verified cleanup.
  claimRefs:
  - CV031
  - CV032
