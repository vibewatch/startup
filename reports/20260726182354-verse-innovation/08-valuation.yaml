- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Type
  - Support today
  - What would change the view
  rows:
  - - Vernacular distribution, scale, and multi-surface portfolio create a real platform asset
    - Thesis
    - Strong
    - User-scale collapse or publisher retreat would weaken it
  - - FY25 revenue growth and burn improvement show that the model can mature
    - Thesis
    - Moderate
    - Audited reversal or stalled FY26 progress would weaken it
  - - NexVerse.ai, Premium, Magzter, and Collab create monetization optionality beyond display ads
    - Thesis
    - Moderate
    - Need clean product-level revenue and retention proof
  - - Control weaknesses and Builder.ai controversy reduce trust in premium pricing
    - Anti-thesis
    - Strong
    - Closed remediation and no new governance shocks would improve it
  - - No fresh priced round since 2022 makes the $5B anchor stale
    - Anti-thesis
    - Strong
    - A clean 2026/27 price-discovery event could reset support
  - - Customer-quality, churn, and concentration remain under-disclosed
    - Anti-thesis
    - Strong
    - Disclosed cohorts, retention, and revenue-quality metrics would narrow the discount
  notes: The table separates business-quality arguments from price and evidence objections so the recommendation stays valuation-aware.
