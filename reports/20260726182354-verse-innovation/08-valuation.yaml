  - - Valuation stance
    - Below 2022 anchor
    - 2024 markdown and stale price discovery matter
    - Bias to discount vs old $5B reference
  - - Exit posture
    - Conditional IPO optionality
    - IPO path exists but is not yet de-risked publicly
    - Treat exit timing as contingent, not imminent certainty
