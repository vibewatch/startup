- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - VerSe 2022 Series J anchor
    - Historical private round
    - ~$5B headline round; Tracxn shows ~$4.27B post-money
    - Best known clean price anchor
    - Old and pre-dates later control noise
  - - VerSe 2024 investor mark
    - Minority-investor carrying value
    - $2.9B per 360 One note reported by TechCrunch
    - Best adverse price anchor
    - Not a fresh primary round or broad market-clearing price
  - - ShareChat / Moj
    - Private social-video peer
    - Caplight lists as 91% similarity comp; current public valuation not retained
    - Closest direct Bharat social/video peer
    - Public price discovery is limited
  - - InMobi
    - Private India adtech / media-tech peer
    - Caplight lists as 87% similarity comp
    - Relevant for adtech and monetization lens
    - Different business mix and profitability profile
  - - Inshorts
    - Private Indian content/news peer
    - Caplight lists as 79% similarity comp
    - Useful for news and content benchmark
    - Smaller scale and limited public valuation data
  notes: Comparable set is deliberately mixed because no single public comp perfectly matches VerSe's multilingual news, short video, creator, and adtech blend.
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant retained public and tracker-based references for VerSe as of 2026-07-26, not every possible media-tech comparable.
