    - Track / selective only
    - Company quality is real but price support is mixed
    - Do not underwrite on narrative alone
  - - Confidence
    - Medium
    - There is substantial public evidence, but key economics remain private
    - Require structured diligence before commitment
  - - Risk rating
    - High
