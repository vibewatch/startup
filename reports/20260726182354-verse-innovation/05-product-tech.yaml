callouts:
  - calloutType: strength
    title: "Unified intelligence layer is the clearest product-tech moat"
    body: >
      The strongest technical theme is not one isolated feature but the repeated claim that recommendation,
      monetization, creator enablement, and content transformation are being tied together across products.
    claimRefs: [CE004, CE006, CE011, CE012, CE013, CE035]
  - calloutType: risk
    title: "Public documentation depth lags product ambition"
    body: >
      VerSe shows real engineering and AI breadth, but the absence of public reliability, moderation, or API-style
      documentation limits external confidence in technical maturity and trust controls.
    claimRefs: [CE018, CE019, CE020, CE022, CE023, CE027, CE028, CE029]

