      - ["NexVerse.ai", "Advertisers / agencies / publishers", "Active monetization engine", "AI-driven ad selection, placement, pricing, and campaign optimization", "Need revenue mix and benchmark ROI proof"]
      - ["Dailyhunt Premium / Magzter", "Paid readers", "Post-acquisition expansion phase", "Premium content, ad-free reading, visual AI content extraction", "Need subscriber count and churn"]
      - ["VerSe Collab", "Brands / creators", "Active commerce layer", "Influencer marketplace with dashboard-driven campaign management", "Need take rate and repeat advertiser data"]
      - ["ValueLeaf integration", "Advertisers / enterprise clients", "Integration phase", "Performance data and enterprise engagement tools to deepen adtech stack", "Need integration status and realized revenue contribution"]
      - ["Audio products (Josh Audio Stories / Dream Call)", "Creators / listeners / fans", "Growth feature layer", "Multilingual immersive audio and creator interaction workflows", "Need adoption and safety metrics"]
    notes: >
      The matrix captures the modules most visible in retained sources and treats acquisitions as product-capability
      extensions when they are clearly integrated into VerSe's operating model.
