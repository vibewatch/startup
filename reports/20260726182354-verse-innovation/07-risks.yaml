- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Control-remediation failure
    - Auditor or board notes unresolved material weaknesses
    - Weaknesses persist into next audited cycle
    - Pause underwriting until closure is evidenced
  - - Regulatory escalation
    - Formal notice, enforcement, or blocking action from Indian authorities
    - Any material enforcement tied to content, privacy, or data handling
    - Re-cut valuation and scenario-plan downside cases
  - - Revenue-quality deterioration
    - New third-party allegations or counterparty disputes plus weak documentation
    - Pattern repeats or broadens beyond Builder.ai episode
    - Escalate forensic diligence or walk away
  - - Monetization miss
    - Profitability or burn-improvement targets slip materially
    - No credible path to breakeven with stable governance
    - Treat as thesis-break risk for IPO timing
  notes: Kill criteria convert the retained risk evidence into practical diligence gates rather than claiming certainty on future outcomes.
