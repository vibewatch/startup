            body: >-
              单靠使用规模，不能消除商业模式风险。VerSe 仍暴露在广告周期、全球平台竞争、应用商店和分发依赖、创作者经济波动，以及 Premium、Collab、ValueLeaf 和 AI
              产品等新变现层的执行风险之下。Josh 曾受益于 TikTok 禁令留下的真空，但 Instagram Reels 和 YouTube Shorts 如今已是稳固替代品。Dailyhunt 和 Josh 也依赖
              Google、Apple 的分发入口、云和软件供应商、出版商关系，以及广告主持续信任。留存记录进一步显示，Builder.ai
              向其提供过云部署、迁移和软件开发工作，说明部分技术能力来自外部交易对手购买，并非端到端自有。剩余风险在于：VerSe
              能守住受众规模，却无法在治理和竞争压力叠加前，把规模更快转成干净、经常性、高毛利收入。换句话说，规模能遮住弱变现逻辑，但解决不了它。
