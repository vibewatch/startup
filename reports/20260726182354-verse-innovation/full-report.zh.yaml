        - 相对旧 $5B 参考价偏向折价
      - - 退出姿态
        - 有条件的 IPO 选择权
        - IPO 路径存在，但公开层面尚未去风险
        - 把退出时点视为有条件事项，而不是近在眼前的确定性
    notes: 摘要判断对证据和价格敏感，不是泛泛的公司质量标签。
