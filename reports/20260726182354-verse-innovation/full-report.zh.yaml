      - number: '5.2'
        title: AI 运营模型以统一智能层为中心，横跨内容、创作者和广告系统
        blocks:
          - type: paragraph
            body: >
              当前公开记录中最重要的技术信号，是公司明确转向统一智能层。2026 年 4 月官方 CPTO 任命公告和多篇独立媒体摘要都显示，VerSe 称 Prasanna Prasad 的职责是深化 AI
              在内容个性化、创作者赋能和广告系统中的应用，并在各产品之间搭建共享自动化和相关性层。Entrackr 2025 年 4 月关于 AI 的报道给出了最丰富的产品细节：VerSe 在 NexVerse.ai
              中用深度学习模型完成广告选择、投放和定价；在 Magzter 用视觉 AI 模型把文章提取成适合移动端的 ezRead 格式；在 Dailyhunt 的 Xpresso 短新闻工作流中使用多模态生成式 AI；为
              Josh Audio Stories 提供 AI 辅助脚本、声音调制和个性化；并在 Dream Call
              中使用匹配逻辑连接创作者互动。即便其中一些描述由管理层主导，它们也足够具体，能推断出一套基于共享推荐、排序、内容转换和变现服务的架构，而不是一组孤立点功能。这种共享 AI
              模式很可能是公司的主要技术护城河，尽管公开记录仍缺少基准或可靠性数据。
