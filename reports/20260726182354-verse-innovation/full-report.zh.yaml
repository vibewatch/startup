companyProfile:
  summary: >
    VerSe Innovation 是一家总部位于 Bengaluru 的私营数字媒体公司，核心围绕 Dailyhunt 和 Josh 搭建，并通过 Dailyhunt
    Premium、Magzter、NexVerse.ai、ValueLeaf 和 VerSe Collab 延伸变现界面。公开证据支持几个判断：公司确有本土语言分发护城河、用户触达很大，FY25
    财务纪律也在改善；但产品级经济性、客户黏性和完整股权结构仍披露不足。因此，估值讨论被两个锚点共同拉扯：2022 年 $5B 融资轮，以及 2024 年报道的后续 $2.9B 少数投资者标记估值。
