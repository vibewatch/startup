            body: >-
              具名证明点确实存在。Dailyhunt Premium 和 Magzter 收购带来了面向订阅的客户主张，绑定优质全球和本地刊物；Moneycontrol 报道称，Magzter 在印度有 1.1M
              活跃付费订阅者，Dailyhunt Premium 包含 Time、Newsweek、Fortune、The Economist 和 Forbes 等刊物。广告侧，VerSe 为 Dhathri 做的 Spark
              AI 项目是有用的具名案例，因为多个保留来源描述了为一个可识别 FMCG 玩家生成的 AI 品牌影片。创作者商业化证据更偏方向性，而非合同密集型：Entrackr 称 VerSe Collab 为品牌提供接触
              100,000 多名创作者和名人的能力；独立创作者经济报道也解释了为什么 Bharat 品牌越来越重视区域和微影响者供给。问题不是没有客户，而是缺少支撑投资判断的细节。VerSe
