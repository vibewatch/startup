        title: 投资判断缺口不是客户是否存在，而是客户质量、留存和集中度
        blocks:
          - type: paragraph
            body: >-
              当前尽调瓶颈在于测量质量。公开来源支持这样一个判断：VerSe 能吸引读者、出版方、创作者和至少一部分广告主；但它们没有给出投资者在判断持久现金生成前想要的指标。没有公开 GRR、NRR、流失率、广告主
              cohort 曲线、合同期限披露，也没有 Magzter 之后订阅贡献的拆分。即便外部质量代理指标也有混合：Dailyhunt 可见应用商店评分健康，JustUseApp
              的评论聚合整体偏正面；但评分主要证明产品可用性和用户情绪，不证明变现持久性。平衡结论是，VerSe
              的客户平台真实且多边，尤其在本土语言受众聚合和出版方宽度上证据强；但广告主、创作者和付费读者能否复合成高质量经常性收入流，公开证据有限。这个缺口应被视为缺失证据，而不是 cohort 薄弱的证明。
