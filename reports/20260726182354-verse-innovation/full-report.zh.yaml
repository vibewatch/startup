chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与公司版图
        blocks:
          - type: paragraph
            body: >
              据来源于印度公司申报资料的 Tofler 公司页面，Ver Se Innovation Private Limited 是一家仍在运营的非上市私营公司，成立于 2007 年 4 月 13
              日。公司法定披露页列出的当前地址为 Bengaluru Bellandur 的 Mantri Commercio, Spatium Offices，进一步说明法律实体和运营总部仍在 Bengaluru。VerSe
              官方新闻材料称，该平台是 Dailyhunt、Josh、NexVerse.ai、Magzter 和 Oneindia 的母公司；第三方登记资料和产品页面也持续把这家企业与 Dailyhunt
              品牌绑定在一起。产品证据显示，这个组合面向印度本土语言和移动优先使用场景：Dailyhunt 的 Play Store 页面强调个性化本地、全国和国际新闻，以及覆盖 14
              种以上印度本土语言、数千家出版方的视频内容；Josh 的官网和 Play Store 页面则把这款应用定位为面向 Bharat 创作者的 “Made in India” 短视频和实时互动产品。因此，VerSe
              不应被理解为单一应用出版商，而是一个围绕印度语言受众搭建的控股型平台，业务覆盖多语种新闻发现、短视频、创作者互动、广告技术和订阅相邻业务。
