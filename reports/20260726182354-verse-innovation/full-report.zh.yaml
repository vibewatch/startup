      - number: '8.4'
        title: 在治理和经济性缺口闭合前，建议只是跟踪 / 选择性参与，且价格必须低于旧锚点
        blocks:
          - type: paragraph
            body: >-
              今天最站得住的建议不是永远放弃，而是在严守入场条款和硬性尽调清单的前提下跟踪，或选择性投资。如果 VerSe 能把 FY25
              改善转化为经审计的盈利进展，证明内控更干净，并显示新变现层并非装饰，它有能力进入更有吸引力的退出窗口。如果治理问题拖着不走，或公司在公开市场材料准备好之前寻求 IPO
              式定价，它也可能让投资人失望。因此，退出准备度是有条件的。干净的上市论证需要证明治理整改完成，DPDP 和 IT
              规则负担已落地运营，并且投资人能用可信的股权结构和优先权结构视角，调和多个估值数据集。在此之前，正确立场是高风险、中等置信度、强价格敏感。上述立场是严肃建议，不是没有答案。因此，举证责任落在价格、结构和已验证的整改上。
