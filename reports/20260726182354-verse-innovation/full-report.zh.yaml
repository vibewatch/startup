  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面横跨消费者发现、创作者互动、订阅和广告技术
        blocks:
          - type: paragraph
            body: >
              VerSe 的产品栈远不止一个消费者界面。官方材料称，公司是 Dailyhunt、Josh、NexVerse.ai、Magzter、Oneindia 和 VerSe Collab 的母公司。消费者工作流从
              Dailyhunt 开始，覆盖个性化新闻、本地信息和付费阅读界面；也从 Josh 开始，覆盖短视频、聊天、类直播互动和更新的音频功能。变现和 B2B 侧把这个栈继续延伸：NexVerse.ai
              是广告技术引擎，VerSe Collab 是创作者市场层，ValueLeaf 加 Magzter
              扩大企业和订阅足迹。这种产品线形态很重要，因为公司的差异化不只是「区域内容」，而是一套完整运营模型，试图在同一个本地语言生态内连接用户、创作者、广告主、出版方和付费订阅者。结果更像一个松散整合的媒体平台，带着几个相邻模块，而不是单一整体产品；这既带来交叉销售上行，也带来整合复杂度风险。
