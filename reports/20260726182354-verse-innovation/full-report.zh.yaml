  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 本地语言竞争者最直接争夺创作者供给和 Bharat 注意力
        blocks:
          - type: paragraph
            body: >
              VerSe 最直接的本土竞争压力，并不来自某个与其产品组合完全相同的复制品，而是一组印度平台，它们攻击同一本土语言注意力栈的不同环节。用户需要区域语言新闻、本地发现和大型出版方供给时，Dailyhunt
              最强。VerSe 希望短视频和创作者互动贴近新闻足迹时，Josh 最强。Mohalla Tech 的 ShareChat 和 Moj 同时覆盖这两侧。ShareChat 的 Play Store
              页面展示了一个覆盖 15 种以上印度语言的广义社区产品，包含聊天室、直播会话和虚拟礼物；Moj 当前产品定位则把免费 reels、短剧和 Moj+ 付费原创内容放在同一个娱乐应用里。独立规模汇总和 FY25
              财务报道显示，在最常被引用的公开公司披露中，Mohalla 现在运营着 325M+ 跨平台生态，其中 ShareChat MAU 超过 180M，Moj 接近 160M。这使 Mohalla 成为 VerSe
              最接近的印度类比对象：两家公司都在组装本地语言发现、创作者供给和广告驱动变现，但 Mohalla 看起来更集中在娱乐和社区，VerSe 则仍通过 Dailyhunt 保留更强的新闻和出版方支柱。
