      - number: '1.2'
        title: 领导层、治理与董事会信号
        blocks:
          - type: paragraph
            body: >
              来自登记资料的信息显示，Virendra Kumar Gupta 是董事总经理，Umang Bedi 是全职董事；公司和媒体材料也反复把两人描述为 VerSe 当前阶段的两位核心运营负责人。公司 2026 年 4
              月新闻材料还宣布任命 Prasanna Prasad 为首席产品与技术官，并在 2026 年 3 月任命 P. R. Ramesh
              为独立董事兼审计委员会主席，说明业务成熟后，公司在产品、工程和治理职能上正走向更正式的架构。话虽如此，外界目前主要通过新闻稿和登记聚合平台理解治理图景，而不是完整公开年报；投资者尚未获得上市印度媒体或互联网公司那种披露深度。领导集中度仍然不低：Gupta
              仍是企业身份的核心，Bedi 是变现和资本市场叙事的核心，公司若干当前战略重点——AI
              驱动变现、创作者商业化、广告技术扩张——也主要来自高管评论，而非独立报道。即使公司看起来正在加强董事会监督，这仍带来可管理但不可忽视的关键人物和披露风险。
