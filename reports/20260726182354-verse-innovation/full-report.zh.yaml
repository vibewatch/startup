      - number: '2.2'
        title: 用多重视角测算市场规模
        blocks:
          - type: paragraph
            body: >
              没有单一公开来源能干净测算 VerSe 的可服务市场，所以本章采用多重视角。Dentsu 预计印度广告市场 2025 年为 Rs 1,07,664 crore，2026 年为 Rs 1,15,460
              crore；IBEF 引用 Magna 的口径，则把 2024 年广告市场描述为 Rs 1,22,155 crore，其中数字广告已达 Rs 57,757 crore，并将在 2026
              年接近总广告支出的一半。这些数字不能互换：方法和发布日期不同，但合在一起界定了自上而下广告池的合理范围。需求侧方面，据 IAMAI-Kantar 相关报道，印度 2024 年活跃互联网用户为
              886M；DataReportal 估计，到 2025 年末，互联网用户为 1.03B，社交身份为 500M，说明可触达用户基数已达到全国规模。更具体的创作者经济视角同样重要：Kofluence
              相关报道称，印度有 35–45 lakh 影响者，但只有 4.5–6 lakh 已变现；BCG 则认为，2–2.5M 已变现创作者已经影响 $350–400B 消费。合并来看，最可辩护的结论是，VerSe 的
              SOM 不是受众供给卡住，而是被变现质量和竞争份额获取卡住。
