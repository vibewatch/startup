  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 类型
      - 当前支撑
      - 什么会改变判断
    rows:
      - - 本地语言分发、规模和多触点组合构成真实平台资产
        - 正向论点
        - 强
        - 用户规模坍塌或出版方撤退会削弱这一点
      - - FY25 收入增长和烧钱改善显示模式可以成熟
        - 正向论点
        - 中等
        - 审计后逆转或 FY26 进展停滞会削弱这一点
      - - NexVerse.ai、Premium、Magzter 和 Collab 在展示广告之外创造变现选择权
        - 正向论点
        - 中等
        - 需要干净的产品级收入和留存证据
      - - 控制缺陷和 Builder.ai 争议削弱对溢价定价的信任
        - 反论点
        - 强
        - 整改关闭且没有新的治理冲击会改善判断
      - - 2022 年以来没有新定价轮，使 $5B 锚点过时
        - 反论点
        - 强
        - 一次干净的 2026/27 价格发现事件可重置支撑
      - - 客户质量、流失率和集中度披露不足
        - 反论点
        - 强
        - 披露分群、留存和收入质量指标会收窄折价
    notes: 表格把业务质量论点与价格和证据异议分开，让建议保持估值敏感。
