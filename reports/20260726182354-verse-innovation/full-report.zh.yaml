      - number: '1.4'
        title: 受众规模与变现转型
        blocks:
          - type: paragraph
            body: >
              VerSe 的战略叙事，关键在于证明超大触达可以转化为更稳的变现引擎。Dailyhunt 的应用页面展示了语言支持和出版方供给宽度；2022 年融资披露以及 2025–2026 年新闻稿则称 Dailyhunt
              月用户超过 350M，Josh MAU 约 150M。同一批材料还称，2022 年融资时平台服务数千万创作者，月视频播放量超过 80B。2025
              年财务报道显示，公司已刻意走出纯广告模式。官方和媒体资料把收入组合连接到 NexVerse.ai 广告技术、收购 Magzter 后的 Dailyhunt Premium 订阅、通过 VerSe Collab
              完成的创作者变现和营销活动费用、Josh Audio Calling 和 Audio Stories，以及来自 ValueLeaf 的企业互动能力。由此看，VerSe
              正试图把本土语言受众护城河变成多条变现轨道，而不是只依赖展示广告。这个转型在战略上合理，但证据仍显示公司还在转型中段，并非已经完全跑通。
