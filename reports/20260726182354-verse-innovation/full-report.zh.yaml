      - number: '5.4'
        title: 信任、安全与控制姿态在改善，但仍受审计时期控制弱点约束
        blocks:
          - type: paragraph
            body: >
              公开信任和安全证据方向上混合。正面看，CPTO 任命报道反复称 VerSe 希望打造更大、更安全、重视隐私、由 AI 驱动的系统，并特别提到在 Dream Call
              等面向创作者互动中提供质量和安全支持。公司还告诉媒体，在 Deloitte 对 FY24
              控制进行审查后，它正在加强供应商管理控制、收入确认机制、虚拟资产处理仪表盘和用户访问隔离。但负面证据很具体：Moneycontrol 和 Economic Times
              都报道了围绕供应商审批、采购订单和发票控制、虚拟资产监督、广告发布单控制，以及用户访问、变更管理、审计日志可用性等 IT
              一般控制的重大弱点。这些发现不能证明消费者产品在普通产品意义上不安全，却会削弱外界对围绕收入、访问和技术治理的整体控制环境的信心。因此，技术结论是：VerSe 的产品雄心和 AI
              宽度可见，但其公开信任、安全和可靠性披露仍远低于公开市场式标准。
