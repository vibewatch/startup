  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础覆盖读者、创作者、出版方、广告主和付费订阅者
        blocks:
          - type: paragraph
            body: >-
              VerSe 不是把一个产品卖给一个买方。公开证据显示的，是一套多边需求系统。Dailyhunt 服务想要本地语言新闻、短格式更新、付费杂志或电子报的读者；出版方把平台当作进入 Bharat
              受众的分发渠道；广告主购买对这些受众的触达和效果；创作者用 Josh 和 VerSe Collab 建立分发和变现；付费订阅者则为 Magzter
              支撑的更丰富阅读包付费。这种宽度在战略上有用，因为每一侧都能强化另一侧：更多读者吸引出版方和广告主，更多创作者加深互动，付费内容创造出比纯广告更少周期性的订阅层。缺点是，每一类客户的成功指标不同，而 VerSe
              只披露了底层留存或变现数据的碎片，外界难以判断每一侧到底有多持久。
