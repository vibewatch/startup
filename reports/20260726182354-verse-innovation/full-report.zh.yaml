      - number: '1.5'
        title: 里程碑、战略转向与负面事件
        blocks:
          - type: paragraph
            body: >
              里程碑记录主要由三条弧线构成：平台搭建、激进融资、繁荣后的重置。2022 年融资让 VerSe 成为印度最大的私营数字媒体融资案例之一，但后续报道也显示，后 TikTok
              禁令时代的圈地战塑造了残酷的短视频市场，公司为此付出了运营成本。印度政府 2020 年 6 月封禁 TikTok，为 Josh 崛起打开市场窗口，也把 VerSe 拉入与 Moj、Instagram
              Reels、YouTube Shorts 等资本充足对手的直接竞争。到 2022 年，ByteDance 据报以 56% 折价退出持股，反映出中国资本暴露在印度消费互联网中的监管难度。2024 年和 2025
              年，公司转向另一组动作：收购 Magzter 进入付费订阅，收购 ValueLeaf 强化广告和企业能力，回应估值下调争议以及后来的 Builder.ai 相关收入指控，并公开将 H2 FY26
              作为盈利目标。因此，这组里程碑支持一个判断：VerSe 仍是私营平台，正在从不计成本增长走向更重视披露、治理和多元变现的阶段，但声誉和执行阴影尚未消除。
