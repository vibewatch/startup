  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 对规模化印度新闻和短视频平台而言，监管和地缘政治风险结构性较高
        blocks:
          - type: paragraph
            body: >-
              VerSe 同时运营在两个政策敏感类别中：新闻聚合平台，以及用户互动很重的短视频生态。印度 2021 年《信息技术（中介指南和数字媒体伦理规范）规则》明确涵盖新闻聚合器和数字出版商；2023
              年《数字个人数据保护法》则提高了合法数据处理、同意和用户权利处理的运营门槛。2020 年 PIB 下令封禁 TikTok
              和其他中国相关应用，是一个强有力的先例：当数据安全、主权或公共秩序担忧加剧时，印度监管机构已经证明可以快速介入。ByteDance 2022 年退出后，VerSe
              不再有直接中国股权表暴露，但这段历史仍重要，因为它说明地缘政治变化几乎可以在一夜之间改变市场结构、投资者胃口和平台风险。对一家可能准备 IPO
              时间窗口的公司来说，关键教训是监管平静应被视为有条件，而不是永久状态。因此，投资者应把监管建模为运营变量，而不是背景常量。
