        title: 收入模型正在从传统广告库存延伸到订阅、广告技术和创作者商业化
        blocks:
          - type: paragraph
            body: >
              最能被支撑的财务故事是，VerSe 不再只靠信息流广告来支撑 Dailyhunt 和 Josh。FY25 官方披露以及 2024–2025 年财务报道都持续描述了一个收入栈：Dailyhunt
              广告库存、NexVerse.ai 程序化广告技术、收购 Magzter 后的 Dailyhunt Premium 订阅、通过 VerSe Collab 收取的创作者营销活动费用、Josh 的直播或社区功能，以及
              ValueLeaf 新增的企业互动能力。2024 年 8 月 Moneycontrol 报道尤其有用，因为管理层在其中称，传统新闻业务仍贡献大部分收入，Josh 仍是唯一亏损业务，并披露 Josh
              自身收入组合已经转向与商业交易相关的来源，而非纯广告。这个组合变化很重要，因为它把 VerSe 从单一波动广告市场押注，重新定义为一个横跨广告、订阅、创作者佣金、实时互动和 B2B
              广告技术的变现实验组合。公开证据仍没有给出干净的分部 P&L，但已经显示，公司不是单纯追逐更多展示量，而是在拓宽变现轨道、提高收入质量。
