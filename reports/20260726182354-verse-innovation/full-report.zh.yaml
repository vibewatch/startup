  - id: TV005
    title: 论点破裂和否决触发因素表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 治理恶化
        - 新的重大缺陷、保留意见审计，或正式执法
        - 摧毁高溢价倍数逻辑
        - 暂停或退出
      - - 盈利不达预期
        - FY26 目标窗口过后，仍没有可信证据显示盈亏平衡在推进
        - 削弱复苏与 IPO 叙事
        - 下调估值区间，推迟入场
      - - 客户质量不达预期
        - 留存或群组数据显示变现质量偏弱
        - 规模变成低质量流量，而不是耐久资产
        - 向悲观区间重估
      - - 激进要价
        - 卖方仍锚定旧 $5B 估值，却没有新证据
        - 治理和执行风险没有安全边际
        - 除非结构或价格改变，否则拒绝
    notes: 否决触发项把建议转化为 IC 可执行护栏。
    claimRefs:
      - CV017
      - CV021
      - CV031
      - CV035
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表与优先权
        - 清算优先权、债务、认股权证，以及任何优先证券
        - 私有估值支撑取决于普通股持有人实际拥有的权益
        - 财务 / 法务
      - - 内控整改闭环
        - 董事会跟踪表、审计师跟进，以及经过测试的闭环证据
        - 没有证据，叙事改善不够
        - 财务 / 审计委员会
      - - 产品级变现
        - Dailyhunt、Josh、Premium、Collab 和 NexVerse.ai 的收入与毛利拆分
        - 需要知道什么在驱动价值，什么还停留在实验
        - 业务线财务
      - - 客户耐久性
        - 留存、重复消费、订阅流失和集中度数据
        - 没有耐久性的规模应该打折
        - 增长 / 数据分析
      - - IPO 准备度
        - 顾问授权、时间表现实性和治理工作流
        - 退出可选性是上行逻辑的核心
        - CEO / 董事会 / 投行
    notes: 这些问题是最低证据集；在拿到它们之前，VerSe 只能作为观察名单故事，而不是可定价投资。
    claimRefs:
      - CV033
      - CV034
      - CV036
      - CV039
      - CV040
