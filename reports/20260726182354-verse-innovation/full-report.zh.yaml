  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - VerSe 2022 J 轮锚点
        - 历史私募轮
        - 名义融资轮约 $5B；Tracxn 显示投后约 $4.27B
        - 已知最干净的价格锚点
        - 时间较久，早于后续控制噪音
      - - VerSe 2024 投资人账面估值
        - 少数股东账面价值
        - TechCrunch 报道的 360 One 说明显示为 $2.9B
        - 最佳反向价格锚点
        - 不是新的一级融资轮，也不是广泛市场出清价格
      - - ShareChat / Moj
        - 私营社交视频同行
        - Caplight 列为 91% 相似度可比公司；未留存当前公开估值
        - 最接近的直接 Bharat 社交 / 视频同行
        - 公开价格发现有限
      - - InMobi
        - 私营印度广告技术 / 媒体科技同行
        - Caplight 列为 87% 相似度可比公司
        - 对广告技术和变现视角有参考价值
        - 业务组合和盈利状况不同
      - - Inshorts
        - 私营印度内容 / 新闻同行
        - Caplight 列为 79% 相似度可比公司
        - 可作为新闻和内容基准
        - 规模更小，公开估值数据有限
    notes: 可比集合刻意混合，因为没有单一公开可比公司能完美匹配 VerSe 的多语言新闻、短视频、创作者和广告技术组合。
    enumerationScope:
