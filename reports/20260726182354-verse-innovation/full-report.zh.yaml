      - number: '8.2'
        title: 多头逻辑确实存在，但反方论点更看价格，不是更看产品
        blocks:
          - type: paragraph
            body: >-
              多头逻辑确实存在。VerSe 拥有大型消费者入口、强势本地语言分发位置、高质量投资人，以及横跨广告、创作者电商、订阅和 AI 广告技术的多条变现杠杆。FY25 经营收入增至 ₹1,930 crore，总收入增至
              ₹2,071 crore，烧钱改善 20%，利润率改善至 –38%，上述改善都重要。但反向论点同样强：公开材料已经点出内控缺陷，经常性变现质量披露仍不足，价格自 2022 年以来没有刷新，2025 年 VerSe
              虽否认 Builder.ai 指控，事件仍重新抬高治理敏感度。因此，建议不能写成「好公司，所以买」的通用判断，必须守价格纪律。入口价格错了，VerSe
              就是一个治理敏感的私有媒体科技资产，叙事含量仍然过高。入口价格合适，在盈利、订阅和广告技术同步成熟时，它可以成为后期可选性故事，并带来不对称上行。
