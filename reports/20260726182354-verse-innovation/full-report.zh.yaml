  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 悲观
        - 治理噪音持续；变现质量仍不透明；IPO 时点推迟
        - $1.8B-$2.5B 区间，更接近承压私募估值纪律，而非旧独角兽定价
        - 如果控制整改关闭缓慢，悲观情景就可信
        - 新审计或法律升级
      - - 基准
        - FY25 改善延续；盈利路径部分得到验证；没有重大新冲击，但披露仍不完整
        - $2.8B-$3.6B 区间，接近 2024 年投资人账面估值带，并给一定恢复信用
        - 当前最有支撑
        - 烧钱稳定改善，且没有新的治理意外
      - - 乐观
        - 控制干净关闭；FY26 下半年出现盈利；订阅和广告技术强化收入质量
        - $4.2B-$5.0B 区间，接近但不盲目超过 2022 年锚点
        - 需要几件事同时做对
        - 经过审计的盈利证明，以及更好的产品级 KPI 披露
    notes: 情景估值是基于留存公开证据的分析师区间，不是管理层指引或正式公允性意见。
