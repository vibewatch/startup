              detail: 冲击可能压低触达，或抬高运营成本。
            - label: 中
              tone: neutral
              detail: 多元化可以带来部分缓释。
            - label: 中
              tone: neutral
              detail: 可以管理，但并不轻。
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管和内控失误会快速传导到客户信任、变现、融资和估值。
    claimRefs:
      - CR004
      - CR011
      - CR014
      - CR023
      - CR034
      - CR040
    data:
      nodes:
        - id: n1
          label: 监管变化 / 执法
          type: input
        - id: n2
          label: 内控或收入质量疑虑
          type: input
        - id: n3
          label: 广告主 / 出版方信心冲击
          type: process
        - id: n4
          label: 更高合规和尽调成本
          type: process
        - id: n5
          label: 估值 / IPO 时点压力
          type: output
      edges:
        - from: n1
          to: n4
          label: 抬高
        - from: n2
          to: n3
          label: 削弱
        - from: n2
          to: n4
          label: 触发
        - from: n3
          to: n5
          label: 压缩
        - from: n4
          to: n5
          label: 推迟 / 打折
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: VerSe 依赖监管方、应用商店、供应商、出版方、创作者和广告主，才能维持运营循环完整。
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR026
      - CR028
      - CR029
      - CR031
    data:
      nodes:
        - id: d1
          label: 印度监管方 / 部委
          type: input
        - id: d2
          label: Google / Apple 分发
          type: input
        - id: d3
          label: 云 / 软件供应商
          type: input
        - id: d4
          label: 出版方和创作者
          type: process
        - id: d5
          label: 广告主和订阅用户
          type: process
        - id: d6
          label: 收入和平台耐久性
          type: output
      edges:
        - from: d1
          to: d6
          label: 约束
        - from: d2
          to: d6
          label: 把控触达
        - from: d3
          to: d6
          label: 支撑交付
        - from: d4
          to: d5
          label: 为其创造库存
        - from: d5
          to: d6
          label: 提供资金
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从规模和 FY25 指标改善出发，经过治理折价，落到对价格敏感的结论。
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV014
      - CV021
      - CV031
      - CV040
    data:
      nodes:
        - id: n1
          label: 大规模本地语言受众和组合广度
          type: input
        - id: n2
          label: FY25 收入和烧钱改善
          type: process
        - id: n3
          label: 治理 / 内控折价
          type: process
        - id: n4
          label: 2022 年以来价格发现陈旧
          type: process
        - id: n5
          label: 仅在低于旧锚点时跟踪 / 选择性参与
          type: output
      edges:
        - from: n1
          to: n2
          label: 支撑
        - from: n2
          to: n5
          label: 增强理由
        - from: n3
          to: n5
          label: 迫使打折
        - from: n4
          to: n5
          label: 强化
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 不同证明状态下的示例性股权价值锚点。
    approximationNotes: 数值为分析师生成的 $B 参考点，使用留存公开锚点和情景逻辑，而不是贴现现金流模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV021
      - CV022
      - CV023
      - CV024
    data:
      items:
        - label: 2024 年投资方账面价值锚点
          value: 2.9
          detail: TechCrunch 报道的 360 One 持有价值。
        - label: 熊市中点
          value: 2.15
          detail: 低置信度、治理压力重的结果。
        - label: 基准中点
          value: 3.2
          detail: 当前最可支撑的中点。
        - label: 牛市中点
          value: 4.6
          detail: 需要干净的盈利能力和治理证明。
        - label: 2022 年融资轮锚点
          value: 5
          detail: 历史参照，不是当前公允价值。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前可支撑估值结果的低 / 基准 / 高区间。
    approximationNotes: 区间是 $B 口径的总股权价值带，未计入未披露的优先权结构细节，因此最终尽调问题仍然关键。
    claimRefs:
      - CV002
      - CV021
      - CV022
      - CV023
      - CV024
      - CV033
    data:
      items:
        - label: 熊市区间
          low: 1.8
          mid: 2.15
          high: 2.5
        - label: 基准区间
          low: 2.8
          mid: 3.2
          high: 3.6
        - label: 牛市区间
          low: 4.2
          mid: 4.6
          high: 5
        - label: 历史参照
          low: 5
          mid: 5
          high: 5
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 面向 IC 的评分卡，覆盖市场、证明、经济性、风险、估值和退出准备度。
    approximationNotes: 分数采用 1-5 分制，衡量当前证据质量下的可投资性，而不是公司的绝对质量。
    claimRefs:
      - CV011
      - CV013
      - CV016
      - CV021
      - CV031
      - CV032
      - CV039
      - CV040
    data:
      items:
        - label: 市场机会
          score: 4
          detail: Bharat 互联网和本地语言媒体仍然规模大、战略意义强。
        - label: 用户和产品证明
          score: 4
          detail: Dailyhunt 和 Josh 是真实的规模化资产，也有多个变现触点。
        - label: 经济性可见度
          score: 2
          detail: 改善已经可见，但收入质量细节仍薄。
        - label: 治理质量
          score: 1
          detail: 审计和指控阴影足以支撑较重折价。
        - label: 当前估值支撑
          score: 2
          detail: 下调估值的支撑，比旧独角兽锚点更清晰。
        - label: 退出准备度
          score: 2
          detail: IPO 路径存在，但公开准备度证据不完整。
