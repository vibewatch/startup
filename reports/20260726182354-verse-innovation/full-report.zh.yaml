      - number: '2.3'
        title: VerSe 市场中的买方、用户与付款方
        blocks:
          - type: paragraph
            body: >
              VerSe 市场有四类不同角色。第一类是消费者和创作者，他们产生注意力供给。第二类是广告主和代理商，他们是 Dailyhunt、NexVerse.ai 和 Josh
              品牌活动的主要付款方。第三类是出版方或内容供应方，他们决定 Dailyhunt 的宽度和可信度。第四类是潜在订阅者和付费内容购买者，这部分在 Magzter 之后与 Dailyhunt Premium
              相关。市场和创作者经济报告说明了为什么这种分层重要。电商、FMCG、BFSI
              和零售是印度的大广告主；营销人员用本地语言和微影响者策略完成最后一公里或区域转化；创作者自己也往往偏好短视频，因为这仍是变现和注意力发现最容易的路径。不过，付款方仍高度看重 ROI。Moneycontrol
              的创作者经济报道显示，变现高度集中，许多创作者无法只靠内容获得全职收入，这意味着 Josh 这类平台必须在扩大触达的同时，为创作者提供足够赚钱机会，才能让供给保持活力。因此，VerSe
              的市场不只是最大化下载量，而是要在区域受众之间同时对齐用户增长、创作者经济性和广告主效果。
