      - number: '4.3'
        title: 资本充足性看起来好于 2022 年，但公开资料仍无法支撑 runway 判断
        blocks:
          - type: paragraph
            body: >
              VerSe 的资本状况好于许多印度数字媒体同业，因为它在私募市场重估之前完成了异常大规模的后期融资。官方投资者和商业媒体来源一致显示，公司在 2022 年 4 月宣布 $805M 融资，估值约
              $5B，此前一年还融资超过 $650M。TechCrunch 后来报道，2024 年一名少数投资者将其标记为 $2.9B；公司回应称收入已增长超过一倍，burn 已减少三倍以上，且自 2022 年 4
              月以来没有再融资。这些表态合在一起，暗示管理层认为现金足以避免被迫融资；这一点重要，因为广告市场和短视频板块都已重新定价。但公开投资者仍无法真正评估
              runway，因为手头现金、债务义务、营运资本节奏和费用结构，没有在详细公开年报中披露。Tofler
              确实提供了法律实体资本结构，并确认公司仍是活跃私营企业，实缴股本相对历史融资总额较小；但这并不等于当前流动性视图。公平结论是，VerSe 可能比典型后期内容创业公司拥有更多融资灵活性，但外部人仍无法量化精确
              runway。
