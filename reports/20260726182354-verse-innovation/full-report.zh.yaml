      - number: '2.4'
        title: 增长驱动、采用约束与战略张力
        blocks:
          - type: paragraph
            body: >
              最强增长驱动很清楚：印度广告市场仍在增长，农村消费在上升，互联网接入和社交媒体渗透率继续扩大，几乎所有互联网用户都会消费印度本土语言内容。对一个本土语言平台来说，这些条件异常有利。但同一批证据也暴露了真实的采用和变现约束。短视频广告支出到
              2026 年可能翻倍，但创作者收入不均，ROI 审查在加强，品牌预算大量流向 Instagram 和 YouTube，因为这些平台有更成熟的变现系统，也更被广告主熟悉。即便在 Bharat
              内部，用户增长也不等于收入质量：农村注意力充足，但购买力、支付行为，以及广告主愿意为展示或转化支付的价格，会随品类而变化。结果是，市场结构上很有吸引力，单位经济性却结构性困难。VerSe
              的机会是真实的，因为受众和语言趋势足够持久；它的约束也很清楚，Meta、Google 和 Mohalla Tech 同样可以用更大的生态、更丰富的广告工具和更深的创作者激励去争夺同一批用户。
