            body: >
              Josh 最难的竞争，不只是另一款印度短视频应用，而是创作者可以多栖进入 Meta 和 Google 生态，那里内置的变现和发现轨道更强。Instagram 的 Play Store 列表显示，Reels
              嵌在更广的社交图谱中，图谱本身已经包括 Stories、群聊、Explore、品牌和购物行为。Meta 的创作者最佳实践发布进一步确认，Instagram
              正围绕创作、互动、触达、变现和政策合规，把创作者指导正式化。YouTube 的消费者界面更宽，因为 Shorts 与长视频频道、直播、会员、订阅和 YouTube Premium
              位于同一个应用中。更重要的是，YouTube 官方 Shorts 变现文档披露了收入分成模型：符合条件的变现创作者保留分配后 Shorts 收入的
              45%。印度独立创作者经济报道与这些产品优势相互印证：Moneycontrol 和 SocialKing 都把 Instagram 描述为印度创作者近期占主导地位的变现场所，YouTube
              紧随其后。在这种背景下，Josh 和 Moj 可以靠本土语言相关性、更低摩擦的本地内容和 Bharat 定位获胜；但如果创作者主要按变现成熟度和既有受众图谱优化，它们就处在结构性劣势。
