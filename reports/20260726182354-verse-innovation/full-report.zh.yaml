      - number: '8.3'
        title: 可辩护的基准情景更靠近减记区间，而不是旧独角兽锚点
        blocks:
          - type: paragraph
            body: >-
              情景框架应反映证据质量，而不是创始人愿景。熊市情景假设治理噪音延续，广告主和创作者变现仍不透明，市场继续把 VerSe
              当作波动较大的私有媒体平台定价，而不是当作高质量软件复利公司。牛市情景假设内控干净闭环，FY26 下半年盈利可信，Magzter 和 Premium 带来更强订阅牵引，市场对 NexVerse.ai 和
              Collab 提升收入质量的信心上升。基准情景落在两端之间。可比证据并不完美：Caplight 和 Tracxn 把 ShareChat、InMobi、Inshorts
              作为可比同业组，但公开价格发现薄弱，追踪数据集在名义估值上冲突。冲突本身就有信息含量。追踪方意见不一、治理担忧仍在、上一轮干净价格又太旧时，投资人应偏向保守区间。本文件中，约 $2.8B 至 $3.6B
              的股权价值基准区间，比立即回到 $5B 更站得住。
