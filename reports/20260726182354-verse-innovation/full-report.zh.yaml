      - number: '1.3'
        title: 融资历史、资本基础与估值背景
        blocks:
          - type: paragraph
            body: >
              对一家印度内容平台而言，VerSe 的资本形成规模异乎寻常。Ontario Teachers’ 官方公告和多家印度商业媒体一致显示，公司在 2022 年 4 月宣布完成 $805M 融资，估值约 $5B，由
              CPP Investments 领投，Ontario Teachers’、Luxor Capital、Sumeru Ventures、Sofina 和 Baillie Gifford
              参投。同一批披露还称，2022 年融资之前，公司上一年已从 Google、Microsoft、Qatar Investment Authority 等投资者处融资超过 $650M，使一年融资总额达到约
              $1.5B。后续估值图景没有那么干净。2024 年 8 月，TechCrunch 报道投资者 360 One 将其持股下调 42%，按 $2.9B 估值入账；VerSe 则公开回应称，自 2022
              年融资以来收入已增长超过一倍、burn 已下降三倍以上，并称多数投资者仍保留上一轮一级市场估值。这意味着，公司所谓「名义估值」仍在上一轮价格、少数投资者标记估值，以及 2022 年 4
              月之后缺乏新一轮价格发现融资之间摇摆。
