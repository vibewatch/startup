  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值争论卡在两端：一边是陈旧的 $5B 轮次，一边是后来的 $2.9B 投资方减记
        blocks:
          - type: paragraph
            body: >-
              VerSe 的估值语境异常分裂。最强的历史锚是 2022 年 4 月约 $5B 的融资轮，背后有大型全球投资人，以及当时围绕 Dailyhunt、Josh 和 Bharat 互联网增长的乐观叙事。最强的反向锚是
              TechCrunch 报道称，360 One 在 2024 年 6 月投资人更新中把 VerSe 标至 $2.9B，比旧名义估值低约 42%。VerSe 否认减记含义，向 TechCrunch
              表示，自上一轮以来收入已翻倍以上、烧钱大幅下降，多数投资人仍按上一轮一级市场价值持有。因而，估值任务不是判断哪一个单点数字为真，而是在没有新定价轮、后续内控问题存在、盈利改善但仍未成规模的证据之下，判断哪个数字更站得住。除非证据质量明显提升，否则应相对
              2022 年估值打折。谨慎占优。
            claimRefs:
              - CV001
