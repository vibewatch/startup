      - number: '4.4'
        title: 收入质量提高了，但审计控制和收入确认问题仍是重大尽调障碍
        blocks:
          - type: paragraph
            body: >
              最重要的负面财务证据，不是 2024 年估值下调本身，而是估值压力、重述历史数据，以及关于内部控制弱点和 Builder.ai 相关指控的公开报道叠在一起。Economic Times 报道称，Bloomberg
              指控描述了 Builder.ai 与 VerSe 之间的相互开票；Moneycontrol 则记录了管理层的反驳：所有服务均合法，Deloitte 仍对 FY24
              出具无保留审计意见。不过，即使在反驳中，Deloitte 标出的 IT 系统、广告收入和供应商关系内部控制弱点仍然重要。这意味着，VerSe 的 FY25
              反弹可以视为鼓舞信号，但不能被当成会计质量已完全去风险。与此同时，公司的资本市场叙事依赖于 H2 FY26 盈亏平衡路径、更强变现，以及可能更晚的
              IPO。因此，投资判断应保持平衡：收入多元化和成本纪律正在改善，产品组合可能没有 2022
              年短视频繁荣暗示的那样脆弱；但财务透明度仍达不到公开市场式估值所需水平。下一步尽调要的不是又一个头条增长数字，而是从经审计集团收入到产品级毛利、现金消耗和内部控制整改的干净桥接。
