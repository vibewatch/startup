            body: >
              因此，竞争结论是混合的，不是非黑即白。VerSe 确实拥有可防守切口：Dailyhunt 的本地语言出版方图谱和 Bharat
              发现姿态，不会被英文优先摘要应用，或为规模而非本地编辑密度优化的全球信息流轻易复制。不过，短视频侧暴露更多。公开来源没有提供当前可验证的 Josh 单独 FY25–FY26
              MAU、创作者付款或抽成率数据，也没有给出与 Moj、Reels 或 Shorts
              的同口径变现对比。这个披露缺口很重要，因为短视频的切换成本通常在内容创作层很低，在变现或社交图谱层更高。这里多数消费者应用免费，创作者可以把同一条视频跨多个界面发布，所以优势会流向赚钱路径、广告主需求和推荐能力更好的平台，而不是创作工具最相似的平台。Mohalla
              的 FY25 亏损收窄和新的微短剧推进，说明印度竞争对手也在学习把变现从直接广告支出中多元化。最能被证据支撑的结论是，VerSe
              的持久护城河更多位于区域内容分发，而不是封闭创作者经济；其核心竞争尽调障碍也不是用户触达本身，而是 Josh 上创作者变现的质量和独占性。
