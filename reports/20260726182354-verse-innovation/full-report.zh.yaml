  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >
              VerSe 的真实市场比「新闻聚合」更宽，但比「整个印度互联网」更窄。相关支出池包括数字广告、影响者和创作者营销、付费内容订阅，以及通过 NexVerse.ai、ValueLeaf
              等产品获取的相邻营销活动或企业互动预算。它不包括电商 GMV、电信收入，以及 VerSe 没有直接变现关系的大类数字服务。Dentsu、IBEF 和 DataReportal
              的市场报告显示，印度广告和互联网使用规模已经很大；但 VerSe 可变现的切口尤其绑定本土语言注意力、短视频消费和区域广告主触达。Dailyhunt 的本地语言新闻和内容分发位于更宽的数字媒体市场内；Josh
              位于短视频和创作者注意力经济内；两者主要都靠广告主愿意为区域触达、转化或创作者驱动的品牌活动付费来融资。因此，有用的市场定义应是分层的：顶层是数字广告支出，中层是创作者和区域内容变现，底层才是 VerSe
              特定的本地语言、Bharat 权重更高的机会。
