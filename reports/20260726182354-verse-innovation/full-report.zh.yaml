      - number: '4.2'
        title: FY25 重置改善了增长和成本率，但单位经济性仍只披露了一部分
        blocks:
          - type: paragraph
            body: >
              公开披露显示，FY25 确实发生了经营重置。通过 ANI 发布、并被 Entrackr、StartupTalky 和 Mathrubhumi 呼应的 FY25 审计亮点显示，经营收入增长 88% 至 ₹1,930
              crore，总收入达到 ₹2,071 crore，EBITDA burn 改善 20% 至 ₹738 crore，EBITDA 利润率从 -89% 改善至 -38%，服务成本占收入比例从 112% 降至
              77%，其他运营费用占经营收入比例从 77% 降至 61%。这些方向性改善很强，说明公司找到了一种在增长同时降低成本强度的方法。但公开记录仍不是完整的单位经济性资料包。公司没有披露当前各产品
              ARPU、创作者抽成率、广告主留存、CAC 或回本周期框架，也没有给出产品级利润率拆分。2024 年 Moneycontrol 对 ValueLeaf 的采访仍有启发：管理层称 Dailyhunt 已连续两年
              EBITDA 为正，Magzter 是个位数 EBITDA 为正，Josh 是唯一亏损业务。如果这些说法在方向上仍成立，那么集团层面的投资逻辑就是 Dailyhunt 以及新的 B2B 或订阅轨道正在为 Josh
              走向盈亏平衡兜底，而不是 Josh 已经证明了独立盈利能力。
