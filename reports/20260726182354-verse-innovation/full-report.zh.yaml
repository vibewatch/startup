      - number: '5.3'
        title: 部署以移动端和多语言为先，开发者信号真实，但公开文档深度有限
        blocks:
          - type: paragraph
            body: >
              公开部署证据指向移动优先、面向 Bharat 的运营模型。Dailyhunt 的 Play Store 列表强调来自数千家出版方的个性化多语种新闻；Josh 的官方和应用界面则突出覆盖 12
              种印度语言的短视频、通话、聊天和音频功能。Tofler 将该实体描述为软件出版和相关服务，并提到 iPayy 和
              Dailyhunt，这进一步说明公司历史上是在构建自有消费者软件，而不只是媒体转售商。开发者信号存在，但不是成熟公开 API 文档的形式。VerSe 的 GitHub 组织显示有 21 个公开仓库，活动时间近至
              2026 年 7 月；招聘页面和 Built In
              页面也显示，公司仍在招聘并保持技术人才漏斗。这个信号有用，因为它证明外部可见的工程足迹存在。但与成熟平台公司相比，开发者界面仍然很薄：没有公开状态页，没有广义公共 API
              门户，没有开放可靠性指标，也没有详细架构文档。因此，成熟度判断是「工程深度真实，外部文档深度低」；这对一家私营消费互联网公司可以接受，但会限制尽调信心。
