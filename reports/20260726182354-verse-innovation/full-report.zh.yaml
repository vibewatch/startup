      - number: '7.4'
        title: 多数核心风险可监控，但若继续升温，部分风险会击穿投资假设
        blocks:
          - type: paragraph
            body: >-
              风险档案里较好的部分是，很多问题可监控，并非不可知。投资人可以跟踪内控整改是否闭环，监管机构或法院是否正式介入，管理层能否兑现盈利路径，订阅和广告主多元化是否扩大，以及平台或地缘冲击是否重新打开中国联系担忧。难点在于，其中几类风险会相互牵连：监管审查会拖慢变现，内控问题会增加融资或
              IPO 工作难度，变现弱会削弱公司吸收合规成本的能力。最重要的实操结论是，不能只按良性叙事承销 VerSe。公司需要证明整改、治理、变现和合规成熟度正在同时收敛。在证据出现前，作为后期私有媒体科技公司，VerSe
              的剩余风险高于中位数。因此，下一步尽调要落到运营层面：要求看到关闭问题的证据，而不只是看到公司知道问题。上市前，纪律化里程碑跟踪尤其重要。
            claimRefs:
