evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-cap-table
    missingEvidence: >-
      A dated shareholder register or equivalent cap-table disclosure showing current ownership percentages for all
      major investors.
    whyItMatters: >-
      The company's valuation and control picture is harder to assess when only round announcements and minority
      investor marks are public.
    diligencePath: >-
      Request a current cap table, latest shareholder agreement summary, and any side-letter governance rights from
      management or existing investors.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
      - TO002
  - type: stale
    severity: material
    topic: current-josh-scale
    missingEvidence: An independently verified 2025-2026 MAU, DAU, and retention disclosure for Josh.
    whyItMatters: >-
      Josh's competitive position is central to the group story, but the most repeated public MAU figure still traces
      back to 2022-era fundraising disclosures.
    diligencePath: >-
      Ask management for a current cohort dashboard or third-party app-intelligence extracts covering Josh MAU, DAU,
      retention, and monetization.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: ipo-timing
    missingEvidence: Board-approved internal IPO timetable, banker mandate scope, and milestone plan for any listing process.
    whyItMatters: >-
      Press guidance implies IPO intent, but external stakeholders cannot yet distinguish ambition from a committed
      execution calendar.
    diligencePath: Request any banker engagement letters, board materials, and financing runway assumptions tied to IPO planning.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A single reconciled bottom-up market model linking local-language audience reach to advertiser spend and
      achievable monetization rates for VerSe specifically.
    whyItMatters: >-
      Published market sources size different layers—adex, internet users, creators, influenced consumption—so none
      alone yields VerSe's true addressable market.
    diligencePath: >-
      Build a bottom-up model using VerSe inventory, advertiser yield, paid-subscription take-up, and creator-campaign
      conversion assumptions.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: current-verse-share
    missingEvidence: >-
      Recent independent data for VerSe's share of Indian digital ad spend, regional content time spent, or short-video
      watch time relative to Meta, Google, and Mohalla Tech.
    whyItMatters: Audience scale alone does not show whether VerSe is winning economic share inside the market it targets.
    diligencePath: >-
      Request third-party ad-share, watch-time, and retention dashboards or commission an app-intelligence and ad-market
      benchmark exercise.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: paid-depth
    missingEvidence: >-
      Paid-subscriber counts, paid ARPU, and advertiser cohort-retention data for Dailyhunt Premium, NexVerse.ai, and
      VerSe Collab.
    whyItMatters: >-
      These figures would reveal whether VerSe's layered market opportunity is translating into recurring monetization
      quality.
    diligencePath: >-
      Request cohort-level monetization decks covering premium subscriptions, ad yields, and creator-campaign repeat
      rates.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: stale
    severity: material
    topic: current-josh-scale
    missingEvidence: >-
      A current independently verified Josh-only FY25-FY26 MAU, DAU, watch-time, creator-retention, and monetization
      disclosure.
    whyItMatters: >-
      Without current Josh-only scale and retention data, it is hard to judge whether its audience remains competitively
      durable against Moj, Reels, and Shorts.
    diligencePath: >-
