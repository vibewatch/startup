  evidenceGaps:
    - type: stale
      severity: material
      topic: current-josh-scale
      missingEvidence: "A current independently verified Josh-only FY25-FY26 MAU, DAU, watch-time, creator-retention, and monetization disclosure."
      whyItMatters: "Without current Josh-only scale and retention data, it is hard to judge whether its audience remains competitively durable against Moj, Reels, and Shorts."
      diligencePath: "Request internal Josh dashboard exports by month for MAU, DAU, watch time, uploaders, repeat uploaders, retention cohorts, and monetizable-user counts."
      relatedQuestionRefs: [QP021]
      relatedTableRefs: [TP001, TP004]
