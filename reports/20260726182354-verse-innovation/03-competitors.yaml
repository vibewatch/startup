    title: Feature breadth / capability map
    type: matrix
    layout: wide
    summary: Compressed matrix showing where VerSe and rivals appear strongest on content supply, community, monetization, and ecosystem leverage.
    approximationNotes: >
      Entries are qualitative summaries from retained public product and policy evidence. Unknown public proof does
      not prove absence of capability.
    data:
