      - ["Josh can hold vernacular creator supply", "Creators can multi-home to Moj, Reels, and Shorts", "High", "Short-video creation tools are not a strong switching-cost moat by themselves", "Request creator retention, exclusive-creator share, and payout data"]
      - ["VerSe can monetize Bharat reach competitively", "Instagram and YouTube anchor creator earnings and advertiser budgets", "High", "Monetization gravity may overwhelm audience-only scale", "Benchmark Josh campaign ROI and creator earnings versus Reels / Shorts"]
      - ["Local rivals are weaker financially", "Mohalla's FY25 loss cuts and micro-drama expansion show improving discipline", "Medium-high", "Indian peers are not static and may close monetization gaps", "Track Mohalla's FY26 growth, subscription mix, and advertiser recovery"]
      - ["Community and live features are enough differentiation", "ShareChat combines live, community, gifting, and language depth already", "Medium-high", "Josh may not have unique feature ownership in the vernacular-social layer", "Clarify Josh engagement and live-monetization KPIs"]
      - ["Audience reach proves moat durability", "Current public Josh-only MAU and take-rate data are missing", "High", "Reach without economics can overstate competitive strength", "Require current Josh MAU, DAU, watch time, ARPU, and creator payout disclosures"]
    notes: >
      The largest unresolved risk is not whether VerSe has users, but whether Josh has stronger monetization and
      creator stickiness than larger domestic and global substitutes.
    claimRefs: [CP021, CP029, CP030, CP031, CP032, CP033, CP034, CP035]

figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    layout: wide
    summary: Ordinal map of key competitors by vernacular-localization depth and monetization / distribution power.
    approximationNotes: >
      X and Y values are evidence-backed ordinal scores based on retained public product and business evidence as
      of 2026-07-26. They show relative positioning, not audited metrics.
    data:
      xAxis: Vernacular / Bharat localization depth (global-general=1 -> deep Indian-language focus=10)
      yAxis: Monetization and distribution power (thin monetization rails=1 -> strong creator / ecosystem power=10)
      points:
        - label: Dailyhunt
          x: 10
          y: 6
          detail: Deepest local-language news positioning and publisher density, but weaker public monetization clarity than global video giants
        - label: Josh
          x: 9
          y: 5
          detail: Bharat-oriented short-video product with historical scale, but limited current public payout or MAU disclosure
        - label: ShareChat
          x: 9
          y: 6
          detail: Strong language and community positioning with live and gifting layers
        - label: Moj
          x: 8
          y: 6
          detail: Indian entertainment and short-drama positioning inside Mohalla ecosystem
        - label: Inshorts
          x: 4
          y: 4
          detail: Convenience-led summary product with narrower language depth and limited creator economy role
        - label: Google News
          x: 3
          y: 7
          detail: Huge distribution and product breadth, but weaker vernacular identity and community layer
        - label: Instagram Reels
          x: 5
          y: 9
          detail: Strong monetization gravity and social-graph leverage despite less India-specific language identity
        - label: YouTube Shorts
          x: 5
          y: 10
          detail: Formal revenue sharing and full YouTube ecosystem create highest creator-monetization power in retained official evidence
    claimRefs: [CP002, CP004, CP005, CP007, CP008, CP009, CP010, CP021, CP024, CP026, CP027]

