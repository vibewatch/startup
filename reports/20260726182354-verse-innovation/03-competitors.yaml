      - ["ShareChat", "Regional social / community platform", "180M+ MAUs in company-reported 2024 stat set", "Bharat social users and communities", "15+ languages, chatrooms, live discussions, gifting, community graph", "Less anchored in publisher-grade news supply than Dailyhunt"]
      - ["Moj", "Short-video and short-drama platform", "Nearly 160M MAUs in cited company stat set; parent improved FY25 losses", "Creators, viewers, entertainment brands", "Free reels plus Moj+ premium originals and short dramas", "Public standalone economics remain undisclosed"]
      - ["Inshorts", "Summary-news substitute", "Consumer brand with English/Hindi app and official 60-word format", "Time-constrained mobile news users", "Ultra-fast digest UX, finance feed, explainers, offline reading", "Much narrower language footprint than Dailyhunt"]
      - ["Google News", "Global aggregation substitute", "Google distribution plus multi-device product", "Users wanting breadth and neutral aggregation", "Local/national/world briefing, full coverage, low-data operation", "Limited community or vernacular-identity moat"]
      - ["Instagram Reels", "Global short-video incumbent", "Dominant creator-income venue in cited Indian creator coverage", "Creators, brands, social consumers", "Embedded in Instagram graph, discovery, brand, and shopping surfaces", "Indian creator competition is intense and monetization crowded"]
      - ["YouTube Shorts", "Global video incumbent", "Official 45% Shorts revenue share and broader YouTube ecosystem", "Creators seeking ad revenue plus channel building", "Long-form + shorts + live + memberships + premium under one app", "Vernacular community positioning is less India-specific than Josh or Moj"]
    notes: >
      Rows prioritize the direct and substitute channels most material to VerSe's two-product portfolio rather
      than every Indian content app.
    enumerationScope:
      coverage: partial
      basis: >
        Includes the highest-salience domestic and global alternatives evidenced in retained official, product,
        and business-media sources for July 2026, but not every small regional creator or news app.
    claimRefs: [CP001, CP004, CP005, CP011, CP012, CP013, CP016, CP017]

