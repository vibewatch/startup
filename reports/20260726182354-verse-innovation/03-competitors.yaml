      severity: material
      topic: creator-payout-benchmarking
      missingEvidence: "An apples-to-apples comparison of creator payouts, take rates, advertiser yields, and ROI metrics across Josh, Moj, Instagram Reels, and YouTube Shorts."
      whyItMatters: "Public reach numbers can overstate competitive strength if VerSe monetizes creators or advertisers materially worse than rivals."
      diligencePath: "Obtain internal payout schedules, creator earnings distributions, campaign CPM/CPC benchmarks, and win-loss notes versus Meta and YouTube."
      relatedQuestionRefs: [QP022]
      relatedTableRefs: [TP003, TP004]
    - type: private-evidence-only
      severity: material
      topic: dailyhunt-vernacular-moat
      missingEvidence: "A language- and geography-level retention split showing how much Dailyhunt engagement is uniquely regional-language local news versus generic national content."
      whyItMatters: "The true durability of Dailyhunt's news moat depends on how much user value sits in exclusive vernacular supply rather than in generic feed convenience."
      diligencePath: "Break Dailyhunt cohorts by language, source type, geography, and retention to quantify the share of engagement tied to unique vernacular supply."
