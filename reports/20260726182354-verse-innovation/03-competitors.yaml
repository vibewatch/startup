        - label: Inshorts
          values: ["Medium for summarized news", "Low-moderate", "Low", "Low", "Low-moderate"]
        - label: Google News
          values: ["High for aggregation", "Moderate", "Low", "Low", "High"]
        - label: Instagram Reels
          values: ["High for social short video", "Moderate", "High", "High", "Very high"]
        - label: YouTube Shorts
          values: ["High for video ecosystem", "Moderate", "Moderate", "High", "Very high"]
    claimRefs: [CP003, CP004, CP005, CP007, CP008, CP009, CP010, CP018, CP024, CP026, CP027, CP036]

  - id: FP003
    title: Moat / readiness KPIs
    type: kpi
    layout: standard
    summary: Compact indicators of where VerSe looks strong and where rivals look structurally advantaged.
    data:
      items:
        - label: VerSe historical audience benchmark
          value: "Dailyhunt 350M+ users; Josh 150M MAUs"
          note: Historical company-backed benchmark signals reach, but not current Josh economics
        - label: Closest Indian rival scale
          value: "ShareChat 180M+ MAUs; Moj nearly 160M; 325M+ ecosystem"
          note: Mohalla remains the clearest domestic analog and threat cluster
        - label: Local-rival economics reset
          value: "FY25 revenue ₹723 crore; adjusted EBITDA loss ₹219 crore"
          note: Mohalla is not just growing users; it is improving unit economics
        - label: Creator-income gravity
          value: "75%+ creators cite Instagram as primary income source; YouTube second at 13%"
          note: Independent creator-economy coverage favors global incumbents over local apps
        - label: Shorts official payout model
          value: "Eligible creators keep 45% of allocated Shorts revenue"
          note: YouTube discloses a formal revenue-share structure local rivals do not match publicly
        - label: Dailyhunt supply wedge
          value: "14+ languages and thousands of publishers"
          note: VerSe's clearest non-global differentiator is local-language content supply density
    claimRefs: [CP002, CP011, CP012, CP013, CP018, CP024, CP027, CP035]

callouts:
  - calloutType: risk
    title: "Creator multi-homing compresses moat durability"
    body: >
      The strongest negative fact in the competitor set is that short-video creators can usually post the same
      content across Moj, Josh, Reels, and Shorts. That keeps switching cost low until a platform proves better
      earnings, retention, or graph leverage.
    claimRefs: [CP021, CP027, CP033, CP034]
  - calloutType: strength
    title: "Dailyhunt still has a distinct vernacular-news wedge"
    body: >
      Dailyhunt is not just another feed. Its regional-language footprint and publisher density create a stronger
      news-distribution wedge than is visible in English/Hindi summary apps or global aggregation tools.
    claimRefs: [CP002, CP022, CP023, CP024]

