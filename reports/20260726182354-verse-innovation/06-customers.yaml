chapter:
  number: 6
  title: Customers
  summary: VerSe Innovation's customer proof is strongest on scaled audience reach and broad publisher supply, with moderate evidence that the company can monetize that reach through advertisers, creator tooling, and premium subscriptions. The public record does show named proof points such as Dhathri, Magzter, and premium-publisher bundles inside Dailyhunt Premium, but it remains thin on customer concentration, retention, repeat-spend, and contract economics.
sections:
- id: customer-surface-definition
  title: Customer base spans readers, creators, publishers, advertisers, and premium subscribers
  body: 'VerSe does not sell one product to one buyer. The public evidence instead shows a multi-sided demand system. Dailyhunt serves readers who want local-language news, short-format updates, and premium magazines or e-newspapers; publishers use the platform as a distribution channel into Bharat audiences; advertisers buy reach and performance across those audiences; creators use Josh and VerSe Collab to build distribution and monetization; and premium subscribers pay for richer reading bundles powered by Magzter. This breadth is strategically useful because each side can reinforce the others: more readers attract publishers and advertisers, more creators deepen engagement, and premium content creates a subscription layer that is less cyclical than pure advertising. The downside is that each customer class has a different success metric, and VerSe discloses only fragments of the underlying retention or monetization data needed to judge how durable each side really is.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
