- id: adoption-proof
  title: Adoption proof is strongest on audience scale, app-store quality, and publisher breadth
  body: 'The most concrete customer evidence is still audience and platform breadth rather than disclosed contract metrics. Dailyhunt''s App Store listing says the app has a 4.5 rating from 58,000 reviews, supports English plus sixteen more languages, offers more than 9,000 magazines and e-newspapers, and aggregates news from over 5,000 publishers. Its Play Store surface similarly emphasizes personalized news and video across local languages. Josh''s official and Play Store surfaces confirm a consumer product centered on short video, calls, chat, and audio stories across twelve Indian languages. Historical financing disclosures and independent reporting add scale context: VerSe has described a 350 million-plus monthly user base, roughly 250 million app users, and about 100 million monthly web users, while investor materials described a 50 million-plus creator base and 80 billion-plus video plays per month around the 2022 funding window. These are valuable signs of customer reach, but they
    are not a substitute for cohort retention, churn, or ARPU disclosure.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
