- id: named-customer-proof
  title: Named customer proof exists, but advertiser and repeat-spend evidence is shallower than audience proof
  body: 'Named proof points do exist. Dailyhunt Premium and the Magzter acquisition brought a subscription-oriented customer proposition tied to premium global and local titles, with Moneycontrol reporting that Magzter had 1.1 million active paid subscribers from India and that Dailyhunt Premium includes titles such as Time, Newsweek, Fortune, The Economist, and Forbes. On the advertising side, VerSe''s Spark AI work for Dhathri is a useful named example because multiple retained sources describe an AI-generated brand film for a recognizable FMCG player. The creator-commerce proof is directional rather than contract-heavy: Entrackr says VerSe Collab offers brands access to more than 100,000 creators and celebrities, while independent creator-economy reporting shows why Bharat brands increasingly value regional and micro-influencer supply. The problem is not absence of customers; it is absence of underwriting detail. VerSe does not publicly disclose top-advertiser concentration, creator payout
    structure, renewal rates, or enterprise NRR, so the evidence is strongest on presence and weakest on durability.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU021
  - CU022
  - CU023
  - CU024
  - CU029
  - CU031
