  - TU006
  figureRefs:
  - FU003
- id: retention-expansion-gaps
  title: The underwriting gap is not customer existence but customer quality, retention, and concentration
  body: 'The current diligence bottleneck is measurement quality. Public sources support the thesis that VerSe can attract readers, publishers, creators, and at least some advertisers, but they do not provide the metrics an investor would want before underwriting durable cash generation. There is no public GRR, NRR, churn, advertiser cohort curve, contract-term disclosure, or breakout of subscription contribution after Magzter. Even the external quality proxies are mixed: Dailyhunt''s visible app-store ratings are healthy and JustUseApp''s review aggregation looks broadly positive, yet review scores mainly demonstrate product accessibility and user sentiment, not monetization durability. The balanced conclusion is therefore that VerSe''s customer platform is real and multi-sided, with especially strong proof in vernacular audience aggregation and publisher breadth, but with limited public evidence on whether advertisers, creators, and premium readers compound into high-quality, recurring
    revenue streams. That gap should be treated as missing evidence rather than as proof that the cohorts are weak.'
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU034
  - CU035
