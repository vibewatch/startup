  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: "A single reconciled bottom-up market model linking local-language audience reach to advertiser spend and achievable monetization rates for VerSe specifically."
      whyItMatters: "Published market sources size different layers—adex, internet users, creators, influenced consumption—so none alone yields VerSe's true addressable market."
      diligencePath: "Build a bottom-up model using VerSe inventory, advertiser yield, paid-subscription take-up, and creator-campaign conversion assumptions."
      relatedQuestionRefs: [QM024, QM025]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: current-verse-share
      missingEvidence: "Recent independent data for VerSe's share of Indian digital ad spend, regional content time spent, or short-video watch time relative to Meta, Google, and Mohalla Tech."
      whyItMatters: "Audience scale alone does not show whether VerSe is winning economic share inside the market it targets."
      diligencePath: "Request third-party ad-share, watch-time, and retention dashboards or commission an app-intelligence and ad-market benchmark exercise."
      relatedQuestionRefs: [QM025]
    - type: private-evidence-only
      severity: minor
      topic: paid-depth
      missingEvidence: "Paid-subscriber counts, paid ARPU, and advertiser cohort-retention data for Dailyhunt Premium, NexVerse.ai, and VerSe Collab."
      whyItMatters: "These figures would reveal whether VerSe's layered market opportunity is translating into recurring monetization quality."
      diligencePath: "Request cohort-level monetization decks covering premium subscriptions, ad yields, and creator-campaign repeat rates."
      relatedQuestionRefs: [QM023, QM025]
