  - id: TM003
    title: Segment / buyer map
    columns: ["Segment", "Buyer", "User", "Payer", "Workflow", "Budget owner", "Adoption trigger"]
    rows:
      - ["Regional news discovery", "Dailyhunt end user", "Reader / viewer", "Advertiser primarily; subscriber secondarily", "Open app -> personalized feed -> content consumption", "Brand / media planner", "Need for vernacular reach and frequent daily engagement"]
      - ["Short-video creator ecosystem", "Josh creator and viewer", "Creator + consumer", "Brand or platform monetization rail", "Create or watch -> trend discovery -> engagement -> possible commerce/gifting", "Brand marketer / platform team", "Audience growth and creator monetization opportunity"]
      - ["Influencer marketing campaigns", "Brand marketer", "Creator audience", "Brand / agency", "Campaign brief -> creator matching -> execution -> ROI measurement", "CMO / digital performance head", "Hyper-local or vernacular conversion need"]
      - ["Premium content subscription", "Reader / household", "Reader", "Consumer", "Browse premium catalog -> subscribe -> consume", "Household discretionary budget", "Ad-free or premium magazine / newspaper access"]
      - ["Publisher supply", "Publisher / creator partner", "Dailyhunt audience", "Indirect via platform economics", "License / upload content -> distribution -> monetization or traffic", "Publisher business owner", "Need for distribution into Indian-language audiences"]
    notes: >
      Buyer, user, and payer are not the same in VerSe's market; this table distinguishes demand-side roles that
      are often blurred in top-down market commentary.
    claimRefs: [CM019, CM020, CM021, CM022, CM023, CM024, CM025]

  - id: TM004
