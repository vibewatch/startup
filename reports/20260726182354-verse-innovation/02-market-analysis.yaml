      - ["Enterprise engagement / adtech services", "Campaign tooling, audience segmentation, ad exchange or engagement products", "Generic SaaS spend unrelated to media outcomes", "Advertisers, enterprises", "Connects ValueLeaf and NexVerse.ai to ad budgets"]
    notes: >
      Market boundary is analytical and derived from company product surfaces plus industry reports, not from one
      single published third-party taxonomy.
    claimRefs: [CM001, CM004, CM005, CM019, CM020]

