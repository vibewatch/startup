      - ["Digital advertising", "Display, video, native, performance, regional campaigns", "Offline-only media budgets", "Brands, agencies, performance marketers", "Primary monetization layer for Dailyhunt, Josh, and NexVerse.ai"]
      - ["Influencer / creator marketing", "Brand deals, creator campaigns, sponsored short-form content", "Pure creator-fund transfers with no brand objective", "Brands, agencies, creator marketplaces", "Supports Josh and VerSe Collab monetization"]
      - ["Premium content subscriptions", "Dailyhunt Premium / Magzter-like subscriptions", "General OTT subscriptions unrelated to publishing/news", "Consumers and households", "Secondary revenue diversification beyond ads"]
