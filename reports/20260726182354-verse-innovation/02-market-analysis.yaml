callouts:
  - calloutType: strength
    title: "Indic-language demand is a structural market tailwind"
    body: >
      The strongest single market fact for VerSe is not a valuation number but the persistence of vernacular
      demand: IAMAI-Kantar and IBEF summaries say nearly all Indian internet users consume Indic-language
      content, while rural growth continues to outpace urban growth.
    claimRefs: [CM013, CM014, CM029]
  - calloutType: risk
    title: "Audience scale does not automatically become monetization quality"
    body: >
      Creator-economy evidence shows large participation but far smaller monetization depth. That gap is the
      core reason VerSe's market can be huge and still economically difficult.
    claimRefs: [CM016, CM021, CM032]

