  topStrengths:
    - "Dailyhunt and Josh provide real scaled vernacular distribution across news, short video, creators, publishers, and advertisers."
    - "FY25 showed meaningful improvement in revenue growth, burn, and operating efficiency."
    - "The portfolio now includes subscription, adtech, creator-commerce, and premium-content optionality beyond a single ad-funded feed."
    - "The company has attracted credible global investors and still retains real IPO optionality if governance and profitability improve together."
    - "Local-language positioning remains differentiated versus global platforms even as competition intensifies."
  topRisks:
    - "The 2022 $5B anchor looks hard to underwrite without a discount after the 2024 minority-investor markdown and later governance noise."
    - "Audit-flagged control weaknesses and later revenue-quality controversy increase the discount rate investors should apply."
    - "Customer durability, retention, concentration, and product-level margin data remain materially under-disclosed."
    - "IPO timing is publicly discussed, but public evidence of true IPO readiness is still incomplete."
    - "Advertising, creator-commerce, and premium monetization all need to mature at once for upside valuation scenarios to hold."
  unresolvedGaps:
    - "Full cap table, liquidation preferences, debt, warrants, and any senior claims ahead of common equity."
    - "Business-line revenue, gross margin, and burn contribution across Dailyhunt, Josh, Premium, Collab, and NexVerse.ai."
    - "Advertiser renewal, creator retention, subscription churn, and concentration metrics that prove revenue quality."
    - "Board-level control-remediation tracker and tested evidence that FY24 weaknesses are fully closed."
    - "Concrete IPO-readiness milestones, advisor scope, and governance workstreams beyond public media reporting."
