  evidenceGaps:
    - type: missing-source
      severity: material
      topic: current-cap-table
      missingEvidence: "A dated shareholder register or equivalent cap-table disclosure showing current ownership percentages for all major investors."
      whyItMatters: "The company's valuation and control picture is harder to assess when only round announcements and minority investor marks are public."
      diligencePath: "Request a current cap table, latest shareholder agreement summary, and any side-letter governance rights from management or existing investors."
      relatedQuestionRefs: [QO023]
      relatedTableRefs: [TO003, TO002]
    - type: stale
      severity: material
      topic: current-josh-scale
      missingEvidence: "An independently verified 2025-2026 MAU, DAU, and retention disclosure for Josh."
      whyItMatters: "Josh's competitive position is central to the group story, but the most repeated public MAU figure still traces back to 2022-era fundraising disclosures."
      diligencePath: "Ask management for a current cohort dashboard or third-party app-intelligence extracts covering Josh MAU, DAU, retention, and monetization."
      relatedQuestionRefs: [QO024]
      relatedTableRefs: [TO004]
    - type: private-evidence-only
      severity: minor
      topic: ipo-timing
      missingEvidence: "Board-approved internal IPO timetable, banker mandate scope, and milestone plan for any listing process."
      whyItMatters: "Press guidance implies IPO intent, but external stakeholders cannot yet distinguish ambition from a committed execution calendar."
      diligencePath: "Request any banker engagement letters, board materials, and financing runway assumptions tied to IPO planning."
      relatedQuestionRefs: [QO025]
