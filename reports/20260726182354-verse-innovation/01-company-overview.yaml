callouts:
  - calloutType: strength
    title: "Reach moat remains the core corporate asset"
    body: >
      Across company, investor, and app-store surfaces, VerSe consistently anchors its narrative on very large
      local-language audience reach and creator activity. That audience breadth is the base layer that makes
      every later monetization experiment at least plausible.
    claimRefs: [CO005, CO008, CO022]
  - calloutType: risk
    title: "Capital raised is impressive, but price discovery is stale"
    body: >
      The company still references the April 2022 US$5B round, but the clearest public third-party mark after
      that is the US$2.9B 360 One carry reported in 2024. Without a new financing or filing-level disclosure,
      the true current equity value remains uncertain.
    claimRefs: [CO009, CO013, CO030]

