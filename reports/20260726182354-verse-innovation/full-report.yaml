      - number: '1.5'
        title: Milestones, Strategic Pivots, and Adverse Events
        blocks:
          - type: paragraph
            body: >
              The milestone record is dominated by three arcs: platform build-out, aggressive financing, and post-boom
              reset. The 2022 financing established VerSe as one of India’s largest private digital-media capital
              raises, but subsequent reporting showed the costs of operating in a brutal short-video market shaped by
              the post- TikTok-ban land grab. Government action in June 2020 banning TikTok created the market window
              that helped Josh emerge, but it also pulled VerSe into direct competition with well-capitalized rivals
              such as Moj, Instagram Reels, and YouTube Shorts. By 2022, ByteDance had exited its stake at a reported
              56% discount, reflecting the regulatory difficulty of Chinese exposure in Indian consumer internet. In
              2024 and 2025, the company pursued a different set of moves: buying Magzter to enter premium
              subscriptions, buying ValueLeaf to improve ad and enterprise capabilities, defending itself against
              valuation markdown and later Builder.ai-related revenue allegations, and publicly targeting profitability
              in H2 FY26. The milestone set therefore supports a view of VerSe as a still-private platform moving from
              growth-at-all-costs toward a more disclosure-sensitive, governance-conscious, and monetization-diversified
              phase, but not yet free of reputational and execution overhangs.
