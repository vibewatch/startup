            body: >-
              VerSe does not sell one product to one buyer. The public evidence instead shows a multi-sided demand
              system. Dailyhunt serves readers who want local-language news, short-format updates, and premium magazines
              or e-newspapers; publishers use the platform as a distribution channel into Bharat audiences; advertisers
              buy reach and performance across those audiences; creators use Josh and VerSe Collab to build distribution
              and monetization; and premium subscribers pay for richer reading bundles powered by Magzter. This breadth
              is strategically useful because each side can reinforce the others: more readers attract publishers and
              advertisers, more creators deepen engagement, and premium content creates a subscription layer that is
              less cyclical than pure advertising. The downside is that each customer class has a different success
              metric, and VerSe discloses only fragments of the underlying retention or monetization data needed to
              judge how durable each side really is.
