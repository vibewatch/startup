            body: >
              The most supportable financial story is that VerSe is no longer trying to fund Dailyhunt and Josh through
              feed advertising alone. Official FY25 disclosures and 2024-2025 financial reporting consistently describe
              a revenue stack built from Dailyhunt's advertising inventory, NexVerse.ai programmatic adtech, Dailyhunt
              Premium subscriptions after the Magzter acquisition, creator-campaign fees via VerSe Collab, Josh's live
              or community features, and newly added enterprise engagement capacity from ValueLeaf. The August 2024
              Moneycontrol report is especially useful because management there described the legacy news business as
              still generating the majority of revenue, said Josh remained the only unprofitable business, and disclosed
