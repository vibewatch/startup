      - number: '4.2'
        title: FY25 reset improved growth and cost ratios, but unit economics remain only partially public
        blocks:
          - type: paragraph
            body: >
              Public disclosures show a real operating reset in FY25. The audited FY25 highlight set published through
              ANI and echoed by Entrackr, StartupTalky, and Mathrubhumi says revenue from operations rose 88% to ₹1,930
              crore, total revenue reached ₹2,071 crore, EBITDA burn improved 20% to ₹738 crore, EBITDA margin improved
              from -89% to -38%, cost of services as a percentage of revenue fell from 112% to 77%, and other operating
              expenses fell from 77% to 61% of revenue from operations. These are strong directional improvements, and
              they suggest the company found a way to grow while reducing cost intensity. Yet the public record is still
              not a full unit-economics package. There is no disclosed current ARPU by product, no creator take-rate
              disclosure, no advertiser-retention data, no CAC or payback frame, and no product-level margin breakouts.
              The 2024 Moneycontrol ValueLeaf interview is nevertheless revealing: management said Dailyhunt had already
              been EBITDA positive for two years, Magzter was single-digit EBITDA positive, and Josh was the only
              unprofitable business. If those claims remain directionally true, then the group-level thesis is that
              Dailyhunt and newer B2B or subscription rails are underwriting Josh's path toward break-even rather than
