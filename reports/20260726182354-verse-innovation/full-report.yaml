      - number: '7.4'
        title: Most top risks are monitorable, but several would become thesis breakers if they intensify
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the risk file is that many problems are monitorable rather than unknowable.
              Investors can track whether control remediation closes, whether any regulator or court formally engages,
              whether management achieves the promised path to profitability, whether subscription and advertiser
              diversification broaden, and whether platform or geopolitical shocks reopen Chinese-linkage concerns. The
              harder part is that several of these risks interact: regulatory scrutiny can slow monetization, control
              issues can complicate financing or IPO work, and weak monetization can reduce the capacity to absorb
              compliance costs. The most important practical conclusion is that VerSe should not be underwritten on a
              benign-case narrative alone. The company needs proof that remediation, governance, monetization, and
              compliance maturity are converging at the same time. Until that proof appears, the residual risk profile
              remains above median for a late-stage private media-tech company. That means the next diligence step is
              operational: demand proof of closure, not just proof of awareness. That makes disciplined milestone
              tracking especially important before any listing attempt.
            claimRefs:
