      - number: '7.2'
        title: Governance and control risk is currently the most concrete adverse signal in the file
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific risk evidence is the public record around internal controls and
              revenue-quality scrutiny. Moneycontrol and Economic Times reported that Deloitte flagged material
              weaknesses in supplier controls, advertising release-order processes, virtual-asset handling, user access,
              change management, audit-log availability, and historical restatements in FY24 reporting. These issues did
              not produce a qualified audit opinion, and VerSe says remediation is underway, but the existence of the
              weaknesses is still highly consequential. On top of that, Bloomberg-linked reporting relayed by ET alleged
              reciprocal billing patterns between VerSe and Builder.ai, a charge the company forcefully rejected across
              multiple outlets while providing documents, invoices, and Jira-ticket references. Even if the allegations
              never convert into formal enforcement, they amplify governance risk because they make every
              revenue-quality discussion more sensitive for investors, lenders, advertisers, and future public-market
              gatekeepers.
