              detail: Consumer monetization yield is not broken out publicly.
        - label: Publisher ecosystem / Premium bundle
          values:
            - label: Strong
              tone: positive
              detail: 5000+ publishers and premium-title bundle are visible.
            - label: Moderate-strong
              tone: positive
              detail: Named titles and Magzter integration support real supply proof.
            - label: Weak
              tone: negative
              detail: Publisher renewal and subscriber churn are undisclosed.
            - label: Weak-moderate
              tone: neutral
              detail: Subscription path exists but current revenue split is unknown.
        - label: Advertisers / creator commerce
          values:
            - label: Moderate
              tone: neutral
              detail: Large audience and creator supply should matter to brands.
            - label: Moderate
              tone: neutral
              detail: Dhathri is useful named proof, but the sample is small.
            - label: Weak
              tone: negative
              detail: No repeat-spend, NRR, or campaign-cohort disclosure.
            - label: Weak
              tone: negative
              detail: Take rate, ROAS, and customer concentration are not public.
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Residual severity is highest in governance/control and regulatory compliance, followed by monetization and
      dependency risk.
    claimRefs:
      - CR011
      - CR012
      - CR014
      - CR023
      - CR034
      - CR040
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Regulatory / compliance
          values:
            - label: High
              tone: negative
              detail: Rules already apply to digital news and platform operators.
            - label: High
              tone: negative
              detail: Enforcement or policy changes can directly affect operations.
            - label: Medium
              tone: neutral
              detail: Basic compliance likely exists, but depth is undisclosed.
            - label: High
              tone: negative
              detail: Residual exposure remains elevated.
        - label: Governance / controls
          values:
            - label: High
              tone: negative
              detail: Publicly documented weaknesses already exist.
            - label: High
              tone: negative
              detail: These issues can impair financing, audit comfort, and IPO readiness.
            - label: Medium-low
              tone: negative
              detail: Management says remediation is underway, but closure evidence is limited.
            - label: High
              tone: negative
              detail: This is the sharpest current company-specific risk.
        - label: Monetization / competition
          values:
            - label: Medium-high
              tone: neutral
              detail: Large-scale usage competes with global platforms for spend.
            - label: Medium-high
              tone: neutral
              detail: Weak monetization would hurt valuation and burn trajectory.
            - label: Medium
              tone: neutral
              detail: New products offer mitigation but are not yet fully proven.
            - label: Medium-high
              tone: neutral
              detail: Residual pressure is meaningful.
        - label: Dependency / platform
          values:
            - label: Medium
              tone: neutral
              detail: App stores, vendors, and policy interpretation all matter.
            - label: Medium-high
              tone: neutral
              detail: A shock can reduce reach or raise operating cost.
            - label: Medium
              tone: neutral
              detail: Some mitigation is possible through diversification.
            - label: Medium
              tone: neutral
              detail: Manageable, but not trivial.
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: Regulatory and control failures can transmit quickly into customer trust, monetization, financing, and valuation.
    claimRefs:
      - CR004
      - CR011
      - CR014
      - CR023
      - CR034
      - CR040
    data:
      nodes:
        - id: n1
          label: Regulatory change / enforcement
          type: input
        - id: n2
          label: Control or revenue-quality concern
          type: input
        - id: n3
          label: Advertiser / publisher confidence shock
          type: process
        - id: n4
          label: Higher compliance and diligence cost
          type: process
        - id: n5
          label: Valuation / IPO timing pressure
          type: output
      edges:
        - from: n1
          to: n4
          label: raises
        - from: n2
          to: n3
          label: reduces
        - from: n2
          to: n4
          label: triggers
        - from: n3
          to: n5
          label: compresses
        - from: n4
          to: n5
          label: delays / discounts
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      VerSe depends on regulators, app stores, vendors, publishers, creators, and advertisers to keep its operating loop
      intact.
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR026
      - CR028
      - CR029
      - CR031
    data:
      nodes:
        - id: d1
          label: Indian regulators / ministries
          type: input
        - id: d2
          label: Google / Apple distribution
          type: input
        - id: d3
          label: Cloud / software vendors
          type: input
        - id: d4
          label: Publishers and creators
          type: process
        - id: d5
          label: Advertisers and subscribers
          type: process
        - id: d6
          label: Revenue and platform durability
          type: output
      edges:
        - from: d1
          to: d6
          label: constrains
        - from: d2
          to: d6
          label: gates reach to
        - from: d3
          to: d6
          label: supports delivery of
        - from: d4
          to: d5
          label: create inventory for
        - from: d5
          to: d6
          label: fund
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a chain from scale and improved FY25 metrics through governance discounts to a
      price-sensitive conclusion.
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV014
      - CV021
      - CV031
      - CV040
    data:
      nodes:
        - id: n1
          label: Large vernacular audience and portfolio breadth
          type: input
        - id: n2
          label: FY25 revenue and burn improvement
          type: process
        - id: n3
          label: Governance / control discount
          type: process
        - id: n4
          label: Stale price discovery since 2022
          type: process
        - id: n5
          label: Track / selective only below old anchor
          type: output
      edges:
        - from: n1
          to: n2
          label: supports
        - from: n2
          to: n5
          label: improves case for
        - from: n3
          to: n5
          label: forces discount in
        - from: n4
          to: n5
          label: reinforces
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Illustrative equity-value anchors under different proof states.
    approximationNotes: >-
      Values are analyst-generated reference points in $B using retained public anchors and scenario logic rather than a
      discounted cash-flow model.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV021
      - CV022
      - CV023
      - CV024
    data:
      items:
        - label: 2024 investor-mark anchor
          value: 2.9
          detail: TechCrunch-reported 360 One carrying value.
        - label: Bear midpoint
          value: 2.15
          detail: Low-confidence governance-heavy outcome.
        - label: Base midpoint
          value: 3.2
          detail: Most supportable current midpoint.
        - label: Bull midpoint
          value: 4.6
          detail: Requires clean profitability and governance proof.
        - label: 2022 round anchor
          value: 5
          detail: Historical reference, not current fair value.
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Low/base/high bands for current supportable valuation outcomes.
    approximationNotes: >-
      Ranges are gross equity-value bands in $B and ignore undisclosed preference-stack detail, which is why final
      diligence asks remain critical.
    claimRefs:
      - CV002
      - CV021
      - CV022
      - CV023
      - CV024
      - CV033
    data:
      items:
        - label: Bear range
          low: 1.8
          mid: 2.15
          high: 2.5
        - label: Base range
          low: 2.8
          mid: 3.2
          high: 3.6
        - label: Bull range
          low: 4.2
          mid: 4.6
          high: 5
        - label: Historical reference
          low: 5
          mid: 5
          high: 5
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style scorecard for market, proof, economics, risk, valuation, and exit readiness.
    approximationNotes: Scores are on a 1-5 scale and measure investability at today's evidence quality, not absolute company quality.
    claimRefs:
      - CV011
      - CV013
      - CV016
      - CV021
      - CV031
      - CV032
      - CV039
      - CV040
    data:
      items:
        - label: Market opportunity
          score: 4
          detail: Bharat internet and local-language media remain large and strategic.
        - label: User and product proof
          score: 4
          detail: Dailyhunt and Josh are real scaled assets with multiple monetization surfaces.
        - label: Economics visibility
          score: 2
          detail: Improvement is visible, but quality-of-revenue detail is still thin.
        - label: Governance quality
          score: 1
          detail: Audit and allegation overhang justify a heavy discount.
        - label: Valuation support today
          score: 2
          detail: Markdown support is clearer than the old unicorn anchor.
        - label: Exit readiness
          score: 2
          detail: IPO path exists, but public readiness evidence is incomplete.
