            title: Indic-language demand is a structural market tailwind
            body: >
              The strongest single market fact for VerSe is not a valuation number but the persistence of vernacular
              demand: IAMAI-Kantar and IBEF summaries say nearly all Indian internet users consume Indic-language
              content, while rural growth continues to outpace urban growth.
