      - number: '1.2'
        title: Leadership, Governance, and Board Signals
        blocks:
          - type: paragraph
            body: >
              Registry-derived information identifies Virendra Kumar Gupta as Managing Director and Umang Bedi as
              Whole-time Director, while company and media materials repeatedly frame them as the two principal
              operating leaders of VerSe’s current phase. The company’s April 2026 press materials also announced
              Prasanna Prasad as Chief Product and Technology Officer and a March 2026 appointment of P. R. Ramesh as an
              Independent Director and Audit Committee Chair, which suggests active formalization of product,
              engineering, and governance functions as the business matures. That said, the governance picture is still
              more legible through press statements and registry aggregators than through a full public annual report,
              so investors do not yet have the same disclosure depth available for listed Indian media or internet
              companies. Leadership concentration remains meaningful: Gupta is still central to corporate identity, Bedi
              is central to monetization and capital-markets messaging, and several of the company’s current strategic
              priorities—AI-led monetization, creator commerce, and adtech expansion—are described through executive
              commentary rather than independent reporting. This raises manageable but non-trivial key-person and
              disclosure risk even as the company appears to be strengthening board oversight.
