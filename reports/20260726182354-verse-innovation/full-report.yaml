      - number: '3.2'
        title: News substitutes split between local-language depth and summary or aggregation convenience
        blocks:
          - type: paragraph
            body: >
              On the information side, Dailyhunt competes less with creator apps and more with summary-first or
              aggregation-first alternatives. The strongest status-quo substitutes are Inshorts and Google News.
              Inshorts is optimized for speed: its app store page and homepage both emphasize 60-word summaries, fast
              scanning, and a personalized feed, now with finance feeds, explainers, offline reading, and video shorts.
              Google News is optimized for breadth and perspective rather than community. Its official product
              description says it offers local, national, and world headlines, multi-outlet full coverage,
              personalization, and data-light or offline-friendly behavior across devices. Dailyhunt's differentiator is
              not better brevity than Inshorts or better cross-source breadth than Google News; it is regional-language
              supply density. The Dailyhunt Play Store page says the app supports more than fourteen Indian languages
              and thousands of publishers, which is a materially different content-acquisition strategy from Inshorts'
              English/Hindi digest or Google's global news graph. That means Dailyhunt's news moat is strongest in
              Bharat-facing language coverage, but weaker if the buyer values neutral aggregation logic, cross-device
              persistence, or concise English-language scanning.
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP022
              - CP023
              - CP024
              - CP036
