  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and geopolitical risk is structurally high for a scaled Indian news and short-video platform
        blocks:
          - type: paragraph
            body: >-
              VerSe operates in two policy-sensitive categories at once: a news aggregation platform and a
              user-engagement-heavy short-video ecosystem. India's Information Technology (Intermediary Guidelines and
              Digital Media Ethics Code) Rules, 2021 explicitly contemplate news aggregators and digital publishers,
              while the Digital Personal Data Protection Act, 2023 raises the operating bar on lawful data processing,
              consent, and user-rights handling. The 2020 PIB order blocking TikTok and other China-linked apps is a
              powerful precedent: Indian authorities have shown they can intervene quickly when data-security,
              sovereignty, or public-order concerns intensify. VerSe no longer carries direct Chinese cap-table exposure
              after ByteDance's 2022 exit, but that history still matters because it shows how geopolitical shifts can
              change market structure, investor appetite, and platform risk almost overnight. For a company preparing
              for possible IPO timing, the key lesson is that regulatory calm should be treated as conditional, not
              permanent. Investors should therefore model regulation as an operating variable, not as a background
              constant.
            claimRefs:
