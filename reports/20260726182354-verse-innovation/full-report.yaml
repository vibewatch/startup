      - number: '1.3'
        title: Funding History, Capital Base, and Valuation Context
        blocks:
          - type: paragraph
            body: >
              VerSe’s capital formation has been unusually large for an Indian content platform. Ontario Teachers’
              official announcement and multiple Indian business publications agree that the company announced an $805
              million financing in April 2022 at an approximately $5 billion valuation, led by CPP Investments with
              participation from Ontario Teachers’, Luxor Capital, Sumeru Ventures, Sofina, and Baillie Gifford. Those
              same disclosures also state that the 2022 raise followed more than $650 million raised in the prior year
              from investors including Google, Microsoft, and Qatar Investment Authority, taking the company’s one-year
              fundraising total to roughly $1.5 billion. The later valuation picture is less clean. In August 2024,
              TechCrunch reported that investor 360 One marked its stake down 42% and carried the company at $2.9
              billion, while VerSe publicly argued that revenue had more than doubled and burn had reduced by more than
              three times since the 2022 round and said most investors still retained the last primary valuation. This
              means the company’s “headline valuation” remains contested between last-round price, minority-investor
              marks, and the absence of a fresh price-discovery financing since April 2022.
            claimRefs:
              - CO009
              - CO010
              - CO011
