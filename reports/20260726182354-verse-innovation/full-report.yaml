    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Products, and Corporate Footprint
        blocks:
          - type: paragraph
            body: >
              Ver Se Innovation Private Limited is an active unlisted private company incorporated on 13 April 2007,
              according to the Tofler company page derived from Indian corporate filings. The company’s statutory
              disclosures page lists its current address at Mantri Commercio, Spatium Offices, Bellandur, Bengaluru,
              reinforcing that the legal entity and the operating headquarters remain in Bengaluru. Official VerSe press
              materials describe the platform as the parent of Dailyhunt, Josh, NexVerse.ai, Magzter, and Oneindia,
              while third-party registry and product pages consistently tie the corporate entity to the Dailyhunt brand.
              Product evidence shows a portfolio aimed at Indian vernacular and mobile-first usage: Dailyhunt’s Play
              Store page emphasizes personalized local, national, and international news plus video across fourteen-plus
              Indic languages and thousands of publishers, while Josh’s official site and Play Store page position the
              app as a “Made in India” short-video and live-interaction product for creators in Bharat. The company
              therefore should be understood not as a single-app publisher but as a holding platform for multilingual
              news discovery, short video, creator engagement, adtech, and subscription adjacency businesses built
              around Indian language audiences.
