  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The current valuation debate is anchored between a stale $5B round and a later $2.9B investor markdown
        blocks:
          - type: paragraph
            body: >-
              VerSe's valuation context is unusually bifurcated. The strongest historical anchor is the April 2022 round
              at roughly $5 billion, backed by large global investors and a then-bullish narrative around Dailyhunt,
              Josh, and Bharat internet growth. The strongest adverse anchor is TechCrunch's report that 360 One marked
              VerSe at $2.9 billion in a June 2024 investor update, about 42% below that old headline price. VerSe
              rejected the implication of a markdown, telling TechCrunch that revenue had more than doubled and burn had
              fallen sharply since the last round and that most investors still carried the company at the prior primary
              value. The valuation task, therefore, is not deciding which single number is true, but deciding which
              number is more supportable given the absence of a fresh priced round, the later control issues, and the
              improved but still subscale profitability evidence. That points to a discount-to-2022 stance unless proof
              quality improves materially. Caution dominates.
            claimRefs:
              - CV001
              - CV002
