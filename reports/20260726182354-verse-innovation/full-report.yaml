      - number: '2.2'
        title: Market Sizing Through Multiple Lenses
        blocks:
          - type: paragraph
            body: >
              No single published source cleanly sizes VerSe's addressable market, so the chapter uses multiple lenses.
              Dentsu projects India's ad market at Rs 1,07,664 crore in 2025 and Rs 1,15,460 crore in 2026, while IBEF,
              citing Magna, frames the 2024 ad market at Rs 1,22,155 crore with digital already at Rs 57,757 crore and a
              path to roughly half of total ad spend by 2026. These are not interchangeable numbers: they use different
              methodologies and publication dates, but together they define the plausible top-down advertising pool. On
              the demand side, India had 886 million active internet users in 2024 according to IAMAI-Kantar coverage,
              and DataReportal estimated 1.03 billion internet users and 500 million social identities by late 2025,
              implying that the reachable user base is already at national scale. The more specific creator-economy lens
              is also material: Kofluence-linked reporting describes 35 to 45 lakh influencers in India, but only 4.5 to
              6 lakh monetizing, while BCG argues 2 to 2.5 million monetized creators already influence $350-400 billion
              in consumption. Taken together, the most defensible conclusion is that VerSe's SOM is not constrained by
              audience availability; it is constrained by monetization quality and competitive share capture.
