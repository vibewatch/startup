  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Local-language rivals overlap most directly on creator supply and Bharat attention
        blocks:
          - type: paragraph
            body: >
              VerSe's most direct domestic competitive pressure does not come from one identical copy of its portfolio,
              but from a cluster of Indian platforms that attack different parts of the same vernacular attention stack.
              Dailyhunt is strongest where users want regional-language news, local discovery, and a large publisher
              supply base. Josh is strongest where VerSe wants short-video and creator engagement to sit next to that
              news footprint. Mohalla Tech's ShareChat and Moj overlap both flanks. ShareChat's Play Store page shows a
              broad community product across 15+ Indian languages with chatrooms, live sessions, and virtual gifts,
              while Moj's current product positioning blends free reels, short dramas, and Moj+ premium originals inside
              one entertainment app. Independent scale roundups and FY25 financial coverage indicate Mohalla now runs a
              325M+ cross-platform ecosystem, with 180M+ MAUs on ShareChat and nearly 160M on Moj in the most-cited
              public company disclosures. That makes Mohalla the closest Indian analog to VerSe: both firms assemble
              local-language discovery, creator supply, and ad-led monetization, but Mohalla appears more concentrated
              on entertainment and community while VerSe still keeps a stronger news-and-publisher leg via Dailyhunt.
            claimRefs:
