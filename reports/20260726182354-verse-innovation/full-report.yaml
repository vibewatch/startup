companyProfile:
  summary: >
    VerSe Innovation is a Bengaluru-based private digital-media company built around Dailyhunt and Josh, with adjacent
    monetization surfaces in Dailyhunt Premium, Magzter, NexVerse.ai, ValueLeaf, and VerSe Collab. Public evidence
    supports a real vernacular-distribution moat, large user reach, and improving FY25 financial discipline, but the
    company remains under-disclosed on product-level economics, customer durability, and full equity-structure detail.
    The valuation debate is therefore shaped by two competing anchors: the 2022 $5B funding round and the later $2.9B
    minority investor markdown reported in 2024.
