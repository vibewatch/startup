      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Strategic Tension
        blocks:
          - type: paragraph
            body: >
              The strongest growth drivers are clear: India's ad market is still growing, rural consumption is rising,
              internet access and social-media penetration continue to expand, and nearly all internet users engage with
              Indic-language content. These are unusually favorable conditions for a vernacular platform. Yet the same
              evidence surfaces real adoption and monetization constraints. Short-form video ad spend may double by
              2026, but creator income is uneven, ROI scrutiny is intensifying, and brand budgets are flowing heavily
              toward Instagram and YouTube because those platforms offer more mature monetization systems and broader
              advertiser familiarity. Even within Bharat, user growth does not equal revenue quality: rural attention is
              abundant, but purchasing power, payments behavior, and advertiser willingness to pay for impressions or
              conversions vary by category. The result is a structurally attractive market paired with structurally
              difficult unit economics. VerSe's opportunity is real because the audience and language trends are
              durable; its constraint is that Meta, Google, and Mohalla Tech can also pursue those same users with
              larger ecosystems, richer ad tooling, and deeper creator incentives.
            claimRefs:
