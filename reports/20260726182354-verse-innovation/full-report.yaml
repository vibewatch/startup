            body: >
              The most important adverse financial evidence is not the 2024 markdown by itself; it is the combination of
              valuation pressure, restated historical figures, and public reporting about internal-control weaknesses
              and Builder.ai-related allegations. Economic Times reported that Bloomberg allegations described
              reciprocal invoicing between Builder.ai and VerSe, while Moneycontrol captured management's rebuttal that
              all services were legitimate and that Deloitte still issued an unqualified FY24 audit opinion. Even in the
              rebuttal, though, Deloitte's flagged weaknesses in internal controls over IT systems, advertising revenue,
              and vendor relationships remained relevant. That means VerSe's FY25 rebound should be treated as
              encouraging but not as fully de-risked accounting quality. In parallel, the firm's capital-markets
              narrative depends on a path to H2 FY26 break-even, stronger monetization, and perhaps a later IPO. The
              underwriting verdict is therefore balanced: revenue diversity and cost discipline are improving, the
              portfolio may be less fragile than the 2022 short-video boom implied, but financial transparency is still
              short of what a public-market style valuation would require. The next diligence ask is not another
              headline growth number; it is a clean bridge from audited group revenue to product-level gross profit,
