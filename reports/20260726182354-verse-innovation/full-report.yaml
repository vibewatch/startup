      - number: '8.3'
        title: A defendable base case sits closer to the markdown range than to the old unicorn anchor
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should reflect evidence quality, not founder aspiration. The bear case assumes
              governance noise persists, advertiser and creator monetization remain opaque, and the market continues to
              value VerSe more like a volatile private media platform than like a high-quality software compounder. The
              bull case assumes clean control closure, credible H2 FY26 profitability, stronger subscription traction
              from Magzter and Premium, and growing confidence that NexVerse.ai and Collab can lift revenue quality. The
              base case sits between these poles. Comparable evidence is imperfect: Caplight and Tracxn treat ShareChat,
              InMobi, and Inshorts as relevant peer sets, but public price discovery is thin and tracker datasets
              conflict on headline valuation. That conflict is itself informative. When trackers disagree, governance
              concerns are live, and the last clean price is old, investors should bias toward a conservative range. In
              this file, a base equity-value band around $2.8B to $3.6B is easier to defend than an immediate return to
              $5B.
