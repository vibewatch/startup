      - number: '2.3'
        title: Buyers, Users, and Payers in the VerSe Market
        blocks:
          - type: paragraph
            body: >
              The VerSe market has four distinct segment roles. First are consumers and creators, who generate the
              attention supply. Second are advertisers and agencies, who are the primary payers across Dailyhunt,
              NexVerse.ai, and Josh brand activity. Third are publishers or content suppliers, who matter to Dailyhunt's
              breadth and credibility. Fourth are prospective subscribers and premium-content buyers, relevant to
              Dailyhunt Premium after Magzter. Market and creator-economy reports show why this segmentation matters.
              E-commerce, FMCG, BFSI, and retail are large advertising spenders in India; marketers use local-language
              and micro-influencer strategies for last-mile or regional conversion; and creators themselves often prefer
              short-form video because it remains the easiest route to monetization and attention discovery. The payer,
              however, is still highly ROI-sensitive. Moneycontrol's creator-economy coverage shows that monetization is
              concentrated and many creators do not earn a full-time income from content alone, meaning platforms like
              Josh have to balance reach with enough creator earnings opportunities to keep supply vibrant. VerSe's
              market therefore depends on aligning user growth, creator economics, and advertiser performance across
              regional audiences rather than simply maximizing download counts.
            claimRefs:
              - CM019
