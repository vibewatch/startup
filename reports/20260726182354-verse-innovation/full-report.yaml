      - number: '3.3'
        title: Global incumbents dominate creator monetization gravity and distribution power
        blocks:
          - type: paragraph
            body: >
              The hardest competition for Josh is not only another Indian short-video app but the fact that creators can
              multi-home into Meta and Google ecosystems with stronger built-in monetization and discovery rails.
              Instagram's Play Store listing shows Reels sitting inside a broader social graph that already includes
              Stories, group chats, Explore, brands, and shopping behavior. Meta's creator best-practices launch further
              confirms that Instagram is formalizing creator guidance around creation, engagement, reach, monetization,
              and policy compliance. YouTube's consumer surface is even broader because Shorts sits inside the same app
              as long-form channels, live streams, memberships, subscriptions, and YouTube Premium. More importantly,
              YouTube's official Shorts monetization documentation discloses a revenue-sharing model under which
              eligible monetizing creators keep 45% of allocated Shorts revenue. Independent Indian creator-economy
              coverage lines up with these product advantages: Moneycontrol and SocialKing both portray Instagram as the
              dominant near- term monetization venue for Indian creators, with YouTube next. Against that backdrop, Josh
              and Moj can win on vernacular relevance, lower-friction local content, and Bharat positioning, but they
              remain structurally disadvantaged if creators optimize primarily for monetization maturity and existing
              audience graph.
