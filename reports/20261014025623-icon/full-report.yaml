      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Executive leadership is anchored by co-founder and Chief Executive Officer Jason Ballard, who has served
              as the public visionary and primary operational driver since inception. Governance expanded substantially
              following institutional financing rounds, notably with the addition of Jeff Crowe, Managing Partner at
              Norwest Venture Partners, to the Board of Directors upon leading the $207 million Series B in August 2021.
              Further institutional oversight followed Series A lead Moderne Ventures and later growth syndicates. While
              co-founders Evan Loomis and Alexander Le Roux were instrumental in early technical formulation and
              business development, operational continuity remains concentrated in Ballard, creating material key-person
              dependence for brand equity, capital formation, and strategic customer alliances. To diversify operational
              leadership across defense and aerospace vectors, the company launched its ICON Prime division in April
              2026, recruiting former Texas Congressman Will Hurd as President to head national security and federal
              programs.
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
              - CO012
      - number: '1.3'
        title: Capitalization Trajectory, Valuation Realities, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              ICON has accumulated more than $600 million in lifetime venture equity and private financing across
              successive growth rounds. Early capitalization began with a $9 million seed financing led by Oakhouse
              Partners in October 2018 at a post-money valuation of $25.7 million, followed by a $35 million Series A
              led by Moderne Ventures in August 2020. In August 2021, Norwest Venture Partners led a $207 million Series
              B round, later expanded via an extension led by Tiger Global in early 2022 that pushed intermediate
              valuations near $2 billion. In early 2025, the company secured an unpriced $56 million Series C tranche to
              fund development of its Phoenix multi-story printing system. Diligence across private data providers
              reveals that market aggregators have frequently conflated ICON Technology Inc. with Dublin-based clinical
              research organization ICON plc, incorrectly reporting corporate debt issuances and acquisition histories.
              Most recently, on October 13, 2026, ICON announced a $200 million Series D financing co-led by Baillie
              Gifford and BlackRock, accelerating commercialization of its next-generation Titan printing system.
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
