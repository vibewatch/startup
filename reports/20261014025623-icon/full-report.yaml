  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Downside Risk Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Titan platform achieves rapid external builder adoption; defense backlog monetizes on schedule; revenue
          quadruples annually.
        - Target exit valuation of $3.5B–$5.0B via IPO or strategic industrial acquisition, yielding >2.5x return.
        - Supply chain bottlenecks in robotic arm assembly or unexpected material extrusion failures in the field.
        - 'Low-Medium: Requires simultaneous execution across commercial hardware sales and government milestones.'
      - - Base Case
        - >-
          Titan transitions to 20–30 builder partners; revenue doubles year-over-year; defense contracts maintain
          baseline cash flow.
        - Valuation holds flat at $1.4B–$1.8B; modest multiple expansion upon reaching break-even cash flow.
        - Subcontractor margin compression, extended homebuilding sales cycles, or delayed builder deliveries.
        - 'Medium-High: Backed by Baillie Gifford and BlackRock capital, but hardware adoption remains gradual.'
      - - Bear Case
        - >-
          High interest rates stall residential tract developments; external builders reject $899k hardware CapEx; burn
          re-accelerates.
        - Valuation compresses to $600M–$800M in a distressed restructuring or structured debt rescue round.
        - Structural defects in early 3D-printed homes, customer warranty claims, or major project cancellations.
        - 'Medium: High capital intensity and past workforce retrenchment demonstrate vulnerability to market pullbacks.'
      - - Downside Floor
        - >-
          Severe construction downturn coupled with defense program delays; robotic fleet underutilization forces asset
          write-downs.
        - Liquidation preference overhang wipes out junior equity; intellectual property sold at distressed valuation.
        - Loss of key defense partnerships, fatal jobsite robotic accidents, or insolvency event.
        - 'Low: Substantial IP portfolio, Tier-1 investor syndicate, and NASA contracts provide a defensive backstop.'
    notes: Scenarios model 36-month investment horizon evaluating external builder hardware sales against ongoing cash burn.
