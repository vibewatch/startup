  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis
      - Core Anti-Thesis
      - Thesis-Break Indicator
    rows:
      - - Technology & Automation
        - Titan multistory robotic system cuts build time by 6 weeks and delivers $20/sq ft walls at 40% below average.
        - >-
          Robotics hardware requires intense maintenance, factory training, and substantial upfront capital of $899k per
          system.
        - Failure of outside builders to convert $5,000 reservation deposits into delivered $899k Titan units.
      - - Market Demand & Scale
        - Housing deficit of 4M units creates urgent builder appetite; over 270 structures built and 117 homes sold.
        - Residential homebuilding is cyclical and local builders face high financing costs and insurance friction.
        - Slowdown in Lennar community buildouts or cancellations in flagship developments like Wolf Ranch.
      - - Government & Defense
        - ICON Prime provides non-dilutive backlog with over $370M in military and NASA lunar contracts.
        - Government contracts carry milestone risk, long cash collection cycles, and specialized overhead.
        - NASA budget reallocation or delays in Project Olympus lunar construction milestone payments.
      - - Financial Sustainability
        - Series D cash injection of $200M brings total funding to $700M, providing multi-year liquidity runway.
        - Down-round from $1.73B to $1.4B highlights valuation reset; past 114 layoffs indicate severe historical burn.
        - Additional capital raises within 18 months requiring liquidation preference concessions.
    notes: Pillars contrast scalable robotic equipment sales with high capital expenditure and builder adoption barriers.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV008
