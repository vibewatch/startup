  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Cost Structure, and Conventional Substitutes
        blocks:
          - type: paragraph
            body: >-
              Understanding ICON's addressable market requires drawing a rigorous boundary around the specific
              construction scopes that robotic 3D-printing systems actually replace. Automated additive manufacturing
              systems do not build turnkey homes from foundation to finish; rather, they automate the erection of
              structural vertical wall assemblies and exterior building enclosures. Conventional stick-framing using
              dimensional lumber, structural insulated panels (SIPs), and concrete masonry units (CMU) constitute the
              incumbent status-quo building technologies against which ICON competes directly. All non-printed building
              elements—including roof trusses, shingles, architectural glazing, doors, rough-in mechanical, electrical,
              and plumbing (MEP) trades, drywall hanging, and interior cabinetry—remain governed by traditional
              construction labor and subcontractor supply chains. Consequently, ICON's value proposition centers on
              compressing direct wall system expenditure, accelerating dry-in shell cycle times from weeks to days, and
              significantly lowering required job-site framing headcount.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 'Constrained Addressable Sizing: TAM, SAM, and SOM Lenses'
        blocks:
          - type: paragraph
            body: >-
              Top-down estimates of the residential construction market frequently cite total United States homebuilding
              expenditures exceeding $400 billion across roughly 1.4 million annual housing starts, fueled by a chronic
              structural deficit of up to four million homes. However, treating total residential construction spend as
              an addressable market is analytically misleading for additive robotics. Applying a realistic scope
              constraint reveals that vertical structural wall enclosures account for approximately 20% to 25% of direct
              construction hard costs, isolating a serviceable addressable market (SAM) of approximately $80 billion to
              $100 billion. Within that envelope, regional adoption is further constrained by climate feasibility,
              single-story versus multi-story zoning, and local builder readiness. ICON's commercial launch of the
              multi-story Titan system—offering wall construction targets of $20 per square foot and automated rebar
              integration—substantially broadens this aperture into higher-density suburban and urban infill
              developments, though near-term serviceable pipeline conversion remains contingent upon machine delivery
              execution beginning in 2027.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM015
          - type: figure
