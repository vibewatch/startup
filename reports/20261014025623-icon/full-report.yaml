      - number: '4.2'
        title: Pricing Mechanics and List vs. Realized Rates
        blocks:
          - type: paragraph
            body: >-
              ICON's monetization structure blends capital equipment pricing with recurring software and consumables
              fees. Third-party builders can reserve a Titan unit with a $5,000 cash deposit, against a starting base
              list price of $899,000 per robotic system. Deliveries are scheduled to commence in early 2027 following
              customer operational training in Austin. Beyond the initial hardware purchase, builders pay an ongoing
              annual software fee for the BuildOS operating platform, alongside variable costs for specialized print mix
              and architectural plans. For contracted build projects, ICON has marketed wall system pricing at roughly
              $20 per square foot for Titan and $25 per square foot for Phoenix, comparing against $80 per square foot
              for full building enclosures. However, realized volume discounting, financing subsidies, and true
              contractor margins remain opaque.
            claimRefs:
              - CI002
              - CI004
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
