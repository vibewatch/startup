chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              ICON Technology, Inc. was co-founded in 2017 in Austin, Texas, by Jason Ballard, Evan Loomis, and
              Alexander Le Roux to address systemic labor shortages, rising material costs, and slow construction
              velocity through robotic 3D printing. Initially conceptualized after Ballard and Loomis identified
              sustainability and affordability bottlenecks in traditional homebuilding through their prior venture
              TreeHouse, the founders partnered with Le Roux to engineer the Vulcan 3D printer. The company debuted the
              first permitted 3D-printed home in the United States at SXSW in March 2018, demonstrating a
              350-square-foot prototype built in under 24 hours using proprietary cementitious Lavacrete. Operating as a
              private venture-backed technology provider at Series D stage, ICON sells proprietary robotic hardware,
              software platforms, and specialized building materials while executing turnkey residential and government
              infrastructure contracts across domestic and international markets.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
