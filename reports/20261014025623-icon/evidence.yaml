evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-series-c
    missingEvidence: >-
      Audited closing documentation and post-money valuation details for the Series C financing tranche and revised
      liquidation preference structure.
    whyItMatters: >-
      Without finalized Series C terms, investors cannot determine dilution magnitude, senior liquidation preferences,
      or effective entry valuation.
    diligencePath: >-
      Request Certificate of Incorporation amendments from Delaware Division of Corporations and review definitive
      Series C stock purchase agreements.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Full cap table breakdown detailing exact ownership percentages and voting thresholds across all seed and early
      syndicate investors.
    whyItMatters: >-
      Minor syndicate participants may hold information or inspection rights that impact future secondary market
      operations and shareholder consent.
    diligencePath: Review capitalization table ledger and investor rights agreements via virtual data room in formal diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Audited unit economics and revenue disaggregation separating hardware sales, material supply markups, software
      licenses, and contracting services across outside builder deployments.
    whyItMatters: >-
      Without segmented gross margins and printer utilization data, investors cannot verify whether the builder-platform
      model achieves attractive software-and-consumable software economics versus lower-margin field contracting.
    diligencePath: >-
      Request confidential management accounts, customer contract templates, printer lease/sales agreements, and
      material pricing schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: adoption-constraints
    missingEvidence: >-
      Comprehensive third-party registry of permitted municipal jurisdictions and standardized ASTM/ICC-ES code
      acceptance rates for multi-story residential 3D concrete printing across US regions.
    whyItMatters: >-
      Permitting friction determines the speed at which regional builders can convert machine reservations into active
      job-site production and revenue.
    diligencePath: >-
      Interview municipal building officials in key target markets (Texas, Florida, California) and inspect ICC
      Evaluation Service reports for ICON wall assemblies.
