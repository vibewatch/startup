callouts:
  - calloutType: insight
    title: The Strategic Transition from Captive Builder to Technology Ecosystem
    body: ICON's decision in 2026 to transition from acting as its own primary builder to licensing and selling its Titan platform to third-party homebuilders represents a pivotal business model transformation. By unbundling robotic machinery, material supply, and software, ICON dramatically reduces its balance sheet capital intensity while tapping into the distributed execution capacity of thousands of regional general contractors.
    claimRefs:
      - CM001
      - CM008
      - CM010
  - calloutType: risk
    title: Permitting and Regulatory Fragmentation Constrains Sizing Velocity
    body: While the headline addressable market for single-family residential construction spans hundreds of billions of dollars, actual revenue conversion is heavily gated by municipal permitting speed. Because building codes in the United States are administered locally rather than federally, each new jurisdiction requires individual engineering variances for 3D-printed concrete wall systems until standardized national building codes are universally adopted.
    claimRefs:
      - CM012
      - CM014
      - CM015
