  - id: TM003
    title: Buyer Segmentation and Commercial Adoption Map
    columns:
      - Market Segment
      - Target Buyer Organization
      - End User / Occupant
      - Payer & Financing Mechanism
      - Workflow Integration
      - Budget Owner
      - Primary Adoption Trigger
    rows:
      - - Top National Production Builders
        - Top-10 volume homebuilders (e.g., Lennar)
        - Entry-level and move-up single-family homebuyers
        - Corporate working capital, construction credit lines, buyer mortgage financing
        - Master-planned communities (50-100+ units), co-developed architectural plans
        - EVP of Construction / National Purchasing Director
        - Direct trade labor shortages, speed of delivery, lower regional warranty claims
      - - Regional & Custom Homebuilders ('Builder 10,000')
        - Small-to-midsize builders (10-100 homes annually)
        - Custom, semi-custom, and infill homebuyers
        - Commercial construction loans, buyer permanent mortgages (Wells Fargo financing)
        - Robotic machine purchase or lease, BuildOS software, local material supply
        - Builder Principal / General Contractor Owner
        - Ability to compete on cost and speed against scaled national production builders
      - - Non-Profit & Municipal Housing Developers
        - Affordable housing developers, municipal authorities, NGOs
        - Low-income families, chronically underhoused individuals
        - Philanthropic grants, low-income housing tax credits (LIHTC), municipal bonds
        - Standardized high-density designs (CODEX, Initiative 99), community villages
        - Executive Director / Public Housing Board
        - Extreme per-unit cost reduction targets ($99,000 or less) and structural durability
      - - Federal Defense & Aerospace Agencies
        - U.S. Department of Defense, U.S. Army, NASA
        - Active-duty military personnel, mission astronauts, defense logistics
        - Federal appropriations, defense innovation contracts, Small Business Innovation Research (SBIR)
        - Specialized defense division (ICON Prime), expeditionary on-site printing
        - Command Contracting Officer / NASA Project Directorate
        - Extreme hardening, remote and off-grid autonomous deployment capabilities
    notes: Buyer segmentation maps distinct procurement workflows and capital sources across commercial residential, affordable housing, and federal defense customer classes.
