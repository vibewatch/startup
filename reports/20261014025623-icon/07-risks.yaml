callouts:
  - calloutType: "risk"
    title: "Commercial Execution Risk from Unproven Builder Platform Transition"
    body: "ICON's long-term enterprise valuation depends on whether external homebuilders embrace Titan as a profitable capital purchase rather than relying on ICON as a specialized subcontractor. An $899,000 price point creates significant procurement friction in a cyclical residential construction market sensitive to interest rates and builder margins."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR013"
  - calloutType: "recommendation"
    title: "Pre-Close Technical and Customer Diligence Requirements"
    body: "Prospective investors should condition capital commitments on auditing Titan warranty terms, on-site field maintenance dispatch records, and customer satisfaction surveys from early builder partners, alongside independent engineering validation of FormCrete durability in coastal and freeze-thaw climates."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR012"
