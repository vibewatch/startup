callouts:
  - calloutType: "risk"
    title: "Working Capital Intensity and Equipment Delivery Lag"
    body: "Transitioning to commercial printer sales with Titan creates working capital exposure: while builders commit $5,000 deposits against an $899,000 list price, deliveries are not slated until early 2027. If customer training or field adoption falters, ICON faces elevated inventory holding costs and delayed hardware revenue recognition."
    claimRefs:
      - "CI002"
      - "CI010"
  - calloutType: "insight"
    title: "Federal Defense Contracts Cushion Residential Volatility"
    body: "ICON Prime's $370 million in federal and aerospace awards provide critical non-dilutive liquidity that buffers the company against private homebuilding cycle fluctuations. These contracts validate the technology at institutional scale while subsidizing core robotics and materials engineering development."
    claimRefs:
      - "CI005"
      - "CI013"
