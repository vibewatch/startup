callouts:
- calloutType: insight
  title: Strategic Pivot from General Contractor to Equipment Provider
  body: ICON's commercial trajectory is marked by a structural shift from operating as a vertically integrated design-build
    general contractor toward acting as an equipment and robotics platform provider. Through its Titan multi-story printer
    and BuildOS platform, ICON seeks to scale by equipping third-party builders rather than bearing construction balance-sheet
    risk.
  claimRefs:
  - CU010
  - CU011
- calloutType: risk
  title: Customer and Geographic Concentration Exposure
  body: Despite high-profile brand recognition, ICON's commercial deployments remain heavily clustered in Central Texas with
    anchor relationships such as Lennar and Mobile Loaves & Fishes. Expanding into diverse national markets requires overcoming
    localized municipal building codes, union labor resistance, and regional trade contractor inertia.
  claimRefs:
  - CU012
  - CU013
