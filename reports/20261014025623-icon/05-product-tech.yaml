figures:
  - id: "FE001"
    title: "ICON Product Technology Architecture"
    type: "stack"
    summary: "Four-layer operating stack decomposing ICON's hardware, software, material, and architectural platforms."
    data:
      layers:
        - label: "Application & Generative Design Layer"
          detail: "Digital architectural catalog and generative AI applications for residential floor plans."
          modules:
            - "CODEX digital architectural catalog with 60+ ready-to-build residential home plans"
            - "Vitruvius AI architect producing generative floor plans, renders, and project specifications"
            - "Exploration Series custom architectural vernacular developed with Lake|Flato and BIG"
          outputs:
            - "Parametric toolpaths and machine-readable architectural digital assets"
        - label: "Supervisory Control & Slicing Layer"
          detail: "Central software operating system translating geometry into synchronized toolpaths."
          modules:
            - "BuildOS supervisory operating system executing real-time robotic toolpath orchestration"
            - "Tablet-based operator user interface for jobsite calibration and print monitoring"
            - "Event monitoring and cloud diagnostics for remote troubleshooting and sensor telemetry"
          outputs:
            - "Synchronized pump flow rates, nozzle positioning coordinates, and velocity profiles"
        - label: "Robotic Extrusion Hardware Layer"
          detail: "Multi-axis field robotics and automated positioning systems on the construction site."
          modules:
            - "Titan mobile multistory construction robot featuring gross tread manipulator and fine print head"
            - "Phoenix articulated multistory arm prototype for full-enclosure single-pass printing"
            - "Vulcan gantry additive manufacturing system engineered for single-story residential envelopes"
          outputs:
            - "Continuous extruded concrete bead deposition forming structural wall assemblies"
        - label: "Material Delivery & Pumping Layer"
          detail: "Continuous batch hydration and pressurized slurry pumping systems."
          modules:
            - "Continuous batch material mixer blending dry mortar with water"
            - "Positive-displacement mortar pump feeding print head via flexible hose line"
          outputs:
            - "Regulated pressure slurry delivery to print head nozzle"
        - label: "Chemical Formulation & Admixture Foundation"
          detail: "Engineered binder packages and chemical rheology modifiers for rapid setting."
          modules:
            - "Lavacrete proprietary mortar blend optimized for rapid structural green-strength development"
            - "CarbonX advanced low-carbon formulation co-developed with MIT Concrete Sustainability Hub"
          outputs:
            - "High compressive strength, fire-resistant, storm-resilient monolithic building structures"
        - label: "Jobsite Sensors & Telemetry System"
          detail: "Environmental and machine feedback monitoring on-site printing conditions."
          modules:
            - "Ambient temperature and humidity environmental sensors for cure calibration"
            - "Print head laser distance sensors and vision monitoring for layer bead verification"
          outputs:
            - "Real-time closed-loop process adjustments to pump speed and travel velocity"
