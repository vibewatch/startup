  topStrengths:
    - Genuine field deployment across residential, social housing, and defense use cases.
    - Strong institutional backing, including a fresh $200 million Series D and prior blue-chip investors.
    - Titan commercialization and BuildOS give the company a clearer platform model than a one-off contractor.
  topRisks:
    - Audited gross margins, ARR, and cash burn remain undisclosed.
    - Titan customer conversion and repeat-order cadence are not yet proven at scale.
    - Municipal permitting, jobsite execution, and capital intensity remain material scaling frictions.
  unresolvedGaps:
    - Audited unit economics by product line, including gross margin and cash conversion.
    - Titan reservation-to-delivery conversion rates, repeat purchase cadence, and builder retention.
    - Current post-restructuring headcount and operating burn by business line.
    - Detailed Series C and Series D preference terms, dilution, and governance changes.
    - Revenue mix across hardware, materials, software, and defense programs.
