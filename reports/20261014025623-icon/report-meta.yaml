companyProfile:
  summary: >-
    ICON is an Austin-based construction robotics company founded in 2017 that combines 3D-printing hardware, printable
    materials, and operating software to automate housing and infrastructure delivery. The company has real deployment
    proof across residential communities and government programs, but its 2026 pivot toward Titan equipment sales still
    leaves audited unit economics, customer conversion, and current retention opaque.
