        - Positions ICON as a vertically integrated platform but requires heavy builder capex
      - - Cobod Hardware Sales
        - Direct equipment capital sale ($500K-$1M+ estimated machine ASP)
        - BOD2 gantry hardware, motion control software, on-site setup training
        - Consumable concrete pricing negotiated locally with materials partners (CEMEX/Holcim)
        - Enables open builder choice but leaves material procurement and liability to the contractor
      - - Apis Cor Equipment & Service
        - Direct machine sale or pilot build service contract
        - Frank robotic arm printer, Gary continuous mixer, Mary pump unit
        - Long-term maintenance costs and component replacement fees unverified
        - Lower capital barrier than large gantry systems, but restricted to smaller footprint jobs
      - - Conventional Framing Subcontracting
        - Turnkey subcontracting ($30-$40+/sq ft total wall assembly cost)
        - Full structural framing labor, materials procurement, and rough inspection delivery
        - Subject to acute lumber commodity volatility and regional trade labor shortages
        - Zero upfront equipment balance sheet liability for homebuilders; variable cost model
