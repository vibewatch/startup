callouts:
  - calloutType: insight
    title: Vertical Integration vs. Open Hardware Strategy
    body: ICON's decision to combine proprietary FormCrete material, custom multi-story robotics, and BuildOS software creates tighter technical performance guarantees but forces builders into single-vendor lock-in, contrasting with Cobod's open-material equipment sales model.
    claimRefs:
      - CP003
      - CP004
      - CP006
      - CP010
  - calloutType: risk
    title: Incumbent Status Quo Inertia
    body: The primary competitive barrier for construction robotics is not rival 3D printing startups, but the entrenched ecosystem of traditional timber framing, where homebuilders incur zero capital equipment debt and rely on established trade subcontracting networks.
    claimRefs:
      - CP001
      - CP011
      - CP012
