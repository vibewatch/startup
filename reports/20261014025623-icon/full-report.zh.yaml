      - number: '1.4'
        title: 运营里程碑、逆风因素与商业规模
        blocks:
          - type: paragraph
            body: >-
              ICON 已交付超过 270 栋 3D 打印建筑和结构围护，从墨西哥 Tabasco 与 Austin 的非营利住房部署，发展到与住宅开发商 Lennar 合作的社区级商业项目，例如得克萨斯州
              Georgetown 的 100 户 Wolf Ranch 项目。与此同时，政府和国防合作已成为核心收入与技术验证引擎，依托 NASA 面向离地建筑的多年期 5,720 万美元 III 期 SBIR
              合同（Project Olympus）以及与美国陆军签署的 6,790 万美元 Other Transaction Authority 协议。但这一资本密集型发展路径在 2025 年初遭遇重大阻力：ICON 裁员
              114 人，约占员工总数 25%，靠战略重组压低现金消耗。管理层将裁员定位为围绕 Phoenix
              多层平台和商业建筑商销售的重新聚焦，但这次收缩也凸显了扩大高资本开支建筑机器人系统时持续存在的单位经济学和客户采用挑战。
