    title: 推荐逻辑
    type: flow
    summary: 从运营验证和融资结构出发，逐步推导出“继续研究”建议的分析链条。
    data:
      nodes:
        - id: step-1
          label: 资本结构锚点
          description: Baillie Gifford 和 BlackRock 领投的 $200M D 轮融资已落地，估值达到 $1.4B，累计融资额达到 $700M。
        - id: step-2
          label: 运营成果
          description: 已交付超过 270 栋结构、售出 117 套住宅，并拿下 $370M 政府和国防合同授标。
        - id: step-3
          label: 技术规模化
          description: Titan 多层建筑机器人打印机已进入商业化阶段，目录价为 $899k，墙体成本为 $20/sq ft。
        - id: step-4
          label: 结构性阻力
          description: 公司在 2025 年裁减了 25% 的员工，估值也从峰值 $1.73B 下调 19% 至 $1.4B。
        - id: step-5
          label: 财务透明度不足
          description: 经审计的毛利率、现金消耗率和外部建商预订转化率仍未披露。
        - id: step-6
          label: 投资结论
          description: 采取“继续研究”的立场；投入股权资金前，必须先核实单位经济模型并验证 Titan 的现场部署。
    approximationNotes: 该流程图综合了通向投资立场的定性尽调依赖关系和财务里程碑。
