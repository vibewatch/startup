  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、成本结构与传统替代方案
        blocks:
          - type: paragraph
            body: >-
              要理解 ICON 的可服务市场，首先要严格界定机器人 3D
              打印系统真正替代的建筑范围。自动化增材制造系统不会从地基做到完工；它们自动化的是结构性竖向墙体组件和建筑外部围护的搭建。使用规格木材、结构保温板（SIP）和混凝土砌块（CMU）的传统木框架施工，是 ICON
              直接竞争的既有技术。所有未打印的建筑要素——包括屋架、瓦片、建筑玻璃、门、机电管线预埋、石膏板安装和室内橱柜——仍由传统建筑劳动力和分包供应链负责。因此，ICON
              的价值主张集中在压低直接墙体系统支出、把建筑外壳封闭周期从数周缩短到数天，并显著减少现场所需的框架工人数量。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 受约束的可服务市场规模：TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: >-
              自上而下的住宅建设市场估算经常引用超过 $400b 的美国住宅建设支出，以及约 1.4m 套年度新开工住房；这一需求由最多 400
              万套的长期结构性住房缺口推动。但把全部住宅建设支出视为可服务市场，会误导增材机器人分析。加入现实范围约束后，竖向结构墙体围护约占直接建筑硬成本的 20% 至 25%，从而得到约 $80b 至 $100b
              的可服务市场（SAM）。在这一范围内，区域采用仍受气候可行性、单层与多层分区规则及当地建筑商准备度限制。ICON 商业推出的多层 Titan 系统，目标墙体施工价格为每平方英尺 $20，
              并提供自动钢筋集成，将市场切入点扩展到更高密度的郊区和城市填充开发；但近期可服务管线能否转化，仍取决于 2027 年开始的设备交付执行。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM015
