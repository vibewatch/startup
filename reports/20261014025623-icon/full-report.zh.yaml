      - number: '3.3'
        title: 商业打包、定价模式与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              自动化建筑领域的商业进入市场策略，反映了对资本配置和客户风险的不同取舍。ICON 历来作为垂直整合的总承包商，在展示项目中自行完成打印；但随着 2026 年发布 Titan Builder
              Program，开始战略性转向设备授权。在这一商业框架下，外部住宅开发商和总承包商支付 5,000 美元订金即可锁定 Titan 交付名额；完整客户培训于 2026 年末开始，首批硬件计划于 2027
              年初交付。ICON 将 Titan 主打印机、高流量混凝土泵送设备、持续的 BuildOS 平台访问权、在 Austin 为期两周的工厂培训和 3 年质保打包销售。ICON 将墙体组装成本估算为每平方英尺约 20
              美元，并声称相比全国传统建筑基准的结构墙体包可降低 40%。相比之下，Cobod 主要是纯设备制造商，直接销售 BOD2 桁架，把后续材料采购、团队管理和运营风险留给当地承包商。ICON
              的打包方案可带来更高可预测性，但整机采购价和长期 BuildOS 许可费仍未披露，承包商实际资本回报高度依赖设备持续利用率。
