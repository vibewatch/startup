              - CO005
              - CO012
      - number: '1.3'
        title: 资本化轨迹、估值现实与投资者基础
        blocks:
          - type: paragraph
            body: >-
              ICON 历经多轮成长融资，累计获得超过 $600m 风险股权和私募融资。早期资本化始于 Oakhouse Partners 领投的 2018 年 10 月 $9m 种子轮，投后估值 $25.7m ；随后是
              Moderne Ventures 领投的 2020 年 8 月 $35m A 轮。2021 年 8 月，Norwest Venture Partners 领投 $207m B 轮；2022 年初 Tiger
              Global 领投的扩展轮进一步将阶段性估值推近 $2b。2025 年初，公司完成一笔未定价的 $56m C 轮，资助 Phoenix 多层打印系统开发。对私有数据提供商的尽调显示，市场聚合商经常把 ICON
              Technology Inc. 与总部位于都柏林的临床研究机构 ICON plc 混为一谈，错误报道公司债务发行和收购历史。最近，ICON 于 2026 年 10 月 13 日宣布完成 $200m D 轮融资，由
              Baillie Gifford 和 BlackRock 联合领投，加速下一代 Titan 打印系统商业化。
            claimRefs:
