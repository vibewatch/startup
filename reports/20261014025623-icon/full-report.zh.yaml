            title: 第三方聚合商混淆 ICON Technology 与 ICON plc
            body: >-
              对 Forge Global、Multiples.vc 等私募市场数据库的尽调显示，总部位于 Austin 的 3D 建筑初创公司 ICON Technology, Inc. 与总部位于都柏林的临床研究机构
              ICON plc 被严重混淆。聚合商错误地把 ICON plc 于 2026 年 8 月发行的 21.5 亿美元优先票据、临床收购（如 120 亿美元收购 PRA Health Sciences）以及创始人
              John Climax 和 Ronan Lambe 归给建筑初创公司。投资者必须直接通过公司原始记录和注册文件独立核验资本结构与资本化表。
