  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 支柱
      - 投资论点
      - 核心反论点
      - 论点破坏指标
    rows:
      - - 技术与自动化
        - Titan 多层机器人系统将建造时间缩短 6 周，并以每平方英尺 $20 的价格交付，成本比均值低 40%。
        - 机器人硬件需要密集维护、工厂培训，以及每套 $899k 的大额前期资本投入。
        - 外部建造商无法把 $5,000 预订定金转化为已交付的 $899k Titan 设备。
      - - 市场需求与规模
        - 4M 套住房缺口催生建造商的迫切需求；已建成超过 270 座结构，售出 117 套住宅。
        - 住宅建造具有周期性，地方建造商还面临高融资成本和保险阻力。
        - Lennar 社区建设放缓，或 Wolf Ranch 等旗舰开发项目取消。
      - - 政府与国防
        - ICON Prime 带来超过 $370M 的军事和 NASA 月球合同非稀释性积压订单。
        - 政府合同存在里程碑风险、回款周期长和专业化间接成本高等问题。
        - NASA 预算重新分配，或 Olympus 项目月球建设里程碑付款延迟。
      - - 财务可持续性
        - $200M Series D 现金注入使总融资达到 $700M，提供多年流动性续航。
        - 估值从 $1.73B 下调至 $1.4B，凸显估值重置；过去裁员 114 人表明历史烧钱严重。
        - 18 个月内需要追加融资，并接受清算优先权让步。
    notes: 各支柱对比了可规模化的机器人设备销售与高资本开支、建造商采用壁垒之间的关系。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV008
      - CV011
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 下行风险触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - Titan 平台迅速被外部建造商采用；国防积压订单按计划变现；收入每年翻四倍。
        - 通过 IPO 或战略工业并购，目标退出估值为 $3.5B–$5.0B，回报超过 2.5 倍。
        - 机器人机械臂组装出现供应链瓶颈，或现场材料挤出出现意外故障。
        - 低—中：需要商业硬件销售和政府里程碑同时执行到位。
      - - 基准情景
        - Titan 过渡到 20–30 家建造商合作伙伴；收入同比翻倍；国防合同维持基础现金流。
        - 估值持平于 $1.4B–$1.8B；现金流达到盈亏平衡后，估值倍数温和扩张。
        - 分包商利润率承压、住宅销售周期拉长，或建造商交付延迟。
        - 中—高：有 Baillie Gifford 和 BlackRock 资本支持，但硬件采用仍将逐步推进。
      - - 悲观情景
        - 高利率令住宅片区开发停滞；外部建造商拒绝购买 $899k 的硬件资本开支；烧钱重新加速。
        - 在困境重组或结构化债务救助轮中，估值压缩至 $600M–$800M。
        - 早期 3D 打印住宅出现结构缺陷、客户保修索赔，或重大项目取消。
        - 中：资本密集度高，过往人员收缩显示公司容易受到市场回撤冲击。
      - - 下行底线
        - 严重建筑业低迷叠加国防项目延迟；机器人机队利用率不足，迫使公司减记资产。
        - 清算优先权悬置吞噬次级股权价值；知识产权以困境估值出售。
        - 失去关键国防合作关系、工地机器人发生致命事故，或出现资不抵债事件。
        - 低：规模可观的知识产权组合、一级投资者联合体和 NASA 合同提供防御性支撑。
    notes: 各情景以 36 个月投资期限为模型基础，评估外部建造商硬件销售与持续烧钱的对比。
    claimRefs:
      - CV005
      - CV007
      - CV010
      - CV012
      - CV014
