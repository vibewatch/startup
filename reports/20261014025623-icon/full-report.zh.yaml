      - number: '3.4'
        title: 转换成本、分销壁垒与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              评估 ICON
              的竞争持久性，必须看清住宅建筑行业中深刻的转换壁垒和执行摩擦。采用建筑机器人系统，要求住宅开发商彻底重构现场工作流，从可变成本的劳务分包转向资产负债表上的资本设备承诺。总承包商必须承担资本折旧、培训专业机器人操作员、为非传统墙体组件取得市政许可，并让传统后续工种（管道、电气、保温和屋面）围绕弧形混凝土墙协同作业。传统木框架还受益于标准化建筑产品的全国分销、各地市政建筑规范的普遍熟悉，以及在住房市场收缩时可快速缩减的灵活分包能力。ICON
              已拿出显著部署成果，完成超过 270 个结构，并通过 ICON Prime 获得超过 3.7 亿美元政府与国防合同，包括 Fort Bliss 和 NASA Project Olympus 项目。但 2025
              年初精简运营并裁员约 100 人，凸显了在重硬件研发与商业生产效率之间取得平衡的难度。ICON 的技术护城河在于软件、材料和硬件的整合堆栈，但让区域住宅开发商脱离根深蒂固的木框架现状，仍是长期市场扩张的核心约束。
