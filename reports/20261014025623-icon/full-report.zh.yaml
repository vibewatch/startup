chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立根基与核心使命
        blocks:
          - type: paragraph
            body: >-
              ICON Technology, Inc. 于 2017 年由 Jason Ballard、Evan Loomis 和 Alexander Le Roux 在得克萨斯州 Austin 共同创立，目标是用机器人
              3D 打印应对系统性劳动力短缺、材料成本上涨和建筑速度缓慢。Ballard 与 Loomis 在此前创办 TreeHouse 时发现传统住宅建设在可持续性和可负担性上的瓶颈，随后提出创业构想；三位创始人合作研发了
              Vulcan 3D 打印机。2018 年 3 月，公司在 SXSW 展示了美国首栋获许可的 3D 打印住宅：一座 350 平方英尺的样板房，使用专有水泥基 Lavacrete，在 24 小时内完成。作为一家处于
              D 轮阶段、由风险资本支持的非上市技术供应商，ICON 销售专有机器人硬件、软件平台和专业建筑材料，并在美国及海外执行住宅与政府基础设施的交钥匙合同。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
              - CO008
              - CO011
              - CO013
      - number: '1.2'
        title: 高管团队、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              公司管理层由联合创始人兼 CEO Jason Ballard 主导；自成立以来，他一直是公司的公开愿景代表和主要运营推动者。机构融资后，公司治理显著扩充：Norwest Venture Partners
              的管理合伙人 Jeff Crowe 牵头 2021 年 8 月 2.07 亿美元 B 轮后加入董事会。A 轮领投方 Moderne Ventures 以及后续成长轮投资者也带来了更多机构监督。联合创始人 Evan
              Loomis 和 Alexander Le Roux 曾深度参与早期技术配方与业务拓展，但运营连续性仍集中在 Ballard
              身上，使品牌资产、融资能力和战略客户联盟存在实质性关键人依赖。为分散国防与航空航天方向的运营领导权，公司于 2026 年 4 月成立 ICON Prime，聘请前得克萨斯州国会议员 Will Hurd
              担任总裁，负责国家安全和联邦项目。
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
