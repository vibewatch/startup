  - id: FE001
    title: ICON 产品技术架构
    type: stack
    summary: ICON 四层运营栈，拆解硬件、软件、材料和建筑平台。
    data:
      layers:
        - label: 应用与生成式设计层
          detail: 面向住宅平面图的数字建筑目录和生成式 AI 应用。
          modules:
            - CODEX 数字建筑目录，包含 60 多套可直接建造的住宅方案
            - Vitruvius AI 建筑师，生成式产出平面图、渲染图和项目规格
            - Exploration Series 定制建筑语汇，由 Lake|Flato 和 BIG 开发
          outputs:
            - 参数化工具路径和机器可读的建筑数字资产
        - label: 监管控制与切片层
          detail: 将几何图形转换为同步工具路径的中央软件操作系统。
          modules:
            - BuildOS 监管操作系统，执行实时机器人工具路径编排
            - 基于平板电脑的操作员用户界面，用于工地校准和打印监控
            - 事件监控与云端诊断，用于远程排障和传感器遥测
          outputs:
            - 同步的泵流速、喷嘴定位坐标和速度曲线
        - label: 机器人挤出硬件层
          detail: 工地上的多轴现场机器人和自动定位系统。
          modules:
            - Titan 移动式多层建造机器人，配备粗调履带式机械臂和精调打印头
            - Phoenix 铰接式多层机械臂原型，用于全围护单次打印
            - Vulcan 龙门式增材制造系统，为单层住宅围护结构设计
          outputs:
            - 连续挤出混凝土珠，沉积形成结构墙体组件
        - label: 材料输送与泵送层
          detail: 连续批量水化与加压浆料泵送系统。
          modules:
            - 连续批量材料搅拌机，将干砂浆与水混合
            - 容积式砂浆泵，通过柔性软管向打印头供料
          outputs:
            - 向打印头喷嘴输送受控压力的浆料
        - label: 化学配方与外加剂基础层
          detail: 为快速凝结而设计的胶凝材料包和化学流变改性剂。
          modules:
            - Lavacrete 专有砂浆混合物，优化快速结构早期强度形成
            - CarbonX 先进低碳配方，与 MIT Concrete Sustainability Hub 共同开发
          outputs:
            - 高抗压、耐火、抗风暴的整体式建筑结构
        - label: 工地传感器与遥测系统层
          detail: 监测现场打印条件的环境与机器反馈。
          modules:
            - 用于固化校准的环境温湿度传感器
            - 打印头激光距离传感器和视觉监控，用于验证层间混凝土珠
          outputs:
            - 实时闭环调整泵速和移动速度
    claimRefs:
