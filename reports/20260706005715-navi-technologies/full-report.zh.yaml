      - CV056
      - CV057
  - id: TV002
    title: 投资论点 / 反方论点表
    columns:
      - 视角
      - 多头论点
      - 反方论点
      - 改变判断的证据
    rows:
      - - 估值信号
        - 反复出现的 ~$2B 融资叙事说明投资人可能看到了战略平台价值
        - 该区间仍未签署，也可能只有在保护投资人的条款下才能成交
        - 经济条款清爽的已交割轮次文件
      - - 产品宽度
        - 贷款、UPI、保险和共同基金可以支撑平台式溢价
        - 产品越宽，执行和可比公司选择也比纯品类同行更难
        - 产品层面的利润率和留存披露
      - - 运营规模
        - FY24 收入、UPI 吞吐量和 2026 年放款显示规模真实
        - 若 FY26 信贷质量不披露，哪怕有规模也可能该打折
        - FY26 收入、亏损、逾期和催收
      - - 资本结构
        - 在 IPO 窗口改善前，债务容量和评级可以为增长供血
        - 重债务融资可能遮住股权估值质量和下行保护的真实水平
        - 股权结构、优先权层级和贷款方契约审查
      - - 监管姿态
        - 2024 年限制已经解除，说明整改可能奏效
        - 此前暂停放贷说明该模式会被监管打断
        - 持续合规且无重复发现的证据
    notes: 反方论点不是 Navi 没有业务，而是公开材料证明溢价经济性之前，投资人可能就要先为溢价买单。
