      - number: '2.5'
        title: 不应被平均掉的矛盾镜头与尽调缺口
        blocks:
          - type: paragraph
            body: >
              如果分析师不把单位和渠道占比拆开，这个市场会产生误导性的大数字。UPI 每年 ₹300 lakh crore 的交易金额、共同基金 ₹81.58 lakh crore 的 AUM、健康险 ₹1.18 lakh
              crore 的保费都真实存在，但它们描述的不是同一种经济对象。UPI 是交易吞吐量，共同基金是资产负债表存量，保险是保费流。因此，三者不应被平均成一个单一金融科技 TAM。更干净的结论是，Navi
              站在几条大轨道之上，而可投资价值取决于渠道份额、变现模式和核保能力。


              最大的尽调缺口是数字贷款。RBI 官方来源描述了构成、行为规则和资本处理，同行披露证明 App
              型分发有可观规模，但公开资料包仍缺少一个权威、当前、覆盖全印度的数字消费贷款发放或应收余额数字，并按渠道和贷款方类型分拆。第二个主要缺口是 Navi 自身 SOM。已保留来源没有披露 Navi
              的活跃借款人、有效健康险保费、共同基金 AUM、续保组合或按 cohort 的转化。因此，精确 SOM 应被视为只有私有证据才能回答，而不是用公开虚荣代理指标建模得出。


              第三个尽调陷阱是把数字可得性误认为数字捕获。Findex 显示银行账户已经广泛普及，但使用并不稳定；IRDAI 显示线上保险真实存在，但仍很小；AMFI 显示被动财富在增长，但仍是行业 AUM
              的少数；同行文件显示，即便已经规模化的金融科技公司，也依赖交叉销售、订阅、理赔支持或分发经济性，而不是一个神奇的超级 App 抽佣率。保留这些缺口，比把虚假精确度塞进一页漂亮但缺乏支撑的 TAM/SAM/SOM
              幻灯片更有价值。
