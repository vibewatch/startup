  - id: TM004
    title: 增长驱动因素和采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 机制
      - 对 Navi 的含义
      - 尽调问题
    rows:
      - - UPI 规模和习惯养成
        - 驱动因素
        - 当前
        - ₹300 lakh crore 年交易额创造了高频数字金融入口和 app 使用习惯
        - 为信贷、财富、保险交叉销售提供大漏斗入口
        - Navi 用户中，有多少通过支付关联路径进入，而不是带着直接产品意图进入？
      - - FI-Index 上升和 EDDPE 推进
        - 驱动因素
        - 2025-2026
        - RBI 仍在推动使用率扩张和区县级数字支付深化
        - 把可服务范围延伸到完全城市客群之外
        - 哪些地区或邦与 Navi 转化经济性最强的区域重合？
      - - AA 网络和 ULI 扩张
        - 驱动因素
        - 当前 / 中期
        - 授权数据共享和贷款人基础设施可改善对服务不足借款人的授信
        - 为征信薄和自雇信贷用户减少摩擦
        - Navi 在多大程度上已把 AA/ULI 式流程接入授信和复借？
      - - 被动型共同基金增长
        - 驱动因素
        - 当前
        - AMFI 被动 AUM 已达多 lakh crore 级别，也契合低成本数字产品设计
        - 支撑规模化，不必背上高接触财富顾问成本结构
        - Navi Mutual Fund 在被动品类中的份额，相比更广的零售 AUM 是多少？
      - - 同业线上健康险快速增长
        - 驱动因素
        - 当前
        - PB 保费增长表明，数字健康险需求可从低基数快速抬升
        - 即便当前线上渗透很小，渠道份额也可能扩大
        - Navi 的续保结构和理赔体验与同业平台相比如何？
      - - 零 MDR 和 bps 级支付经济性
        - 约束
        - 结构性
        - 支付交易额不会自动转成有吸引力的收入；激励仍受政策影响
        - 迫使 Navi 通过交叉销售或差异化商户经济性变现
        - 支付驱动估值假设背后，有哪些明确的支付收入衔接逻辑？
      - - 数字贷款行为规则和 app 目录验证
        - 约束
        - 当前
        - RBI 2025 年指引提高了披露、治理和合规负担
        - 利于建立信任，但会压缩只靠速度形成的竞争护城河
        - 合规和报价标准化对 Navi 贷款漏斗的成本有多高？
      - - 无抵押压力的资本敏感性
        - 约束
        - 结构性
        - RBI 规则下，拨备不足的无抵押压力资产可能适用 150% 风险权重
        - 没有催收纪律的信贷增长会毁掉单位经济性
        - 按 cohort 看，Navi 的 vintage 曲线、核销和拨备覆盖率如何？
      - - 数字保险渠道仍很小
        - 约束
        - 当前
        - 直接线上和网络聚合商份额相对健康险总保费仍很小
        - 规模化需要信任、理赔支持，也可能需要混合服务，而不只是 CAC 投放
        - 如果不重投入辅助分销体系，Navi 能否跳出直接线上小众市场？
      - - 农村互联网和沉睡账户缺口
        - 约束
        - 当前 / 中期
        - 互联网和账户访问已具规模，但农村密度和沉睡账户行为仍落后
        - 城市领薪客群之外的转化，会比 app 下载指标显示得更慢
        - Navi 用户中，活跃复用用户与一次性开户注册的占比分别是多少？
    notes: 时间判断绑定留存来源日期。驱动因素多半扩大触达或提升授信质量；约束多半压缩变现、合规速度或信任转化。
