        title: 盈利质量与实体口径
        blocks:
          - type: paragraph
            body: >-
              披露最干净的经营 P&L 属于 Navi Finserv Limited，而不是母控股公司。NFL 的 FY25 业绩显示，经营收入为 ₹22.71 billion，总收入为 ₹22.90
              billion，税后利润为 ₹2.22 billion；FY24 分别为 ₹19.06 billion、₹26.14 billion 和 ₹6.69 billion。最大差异来自其他收入：FY24 的 ₹7.08
              billion 在 FY25 降至 ₹187.6 million，意味着 FY24 利润受非核心项目抬高，而不是贷款经济性出现可持续改善。母公司层面的 Navi Limited
              年报从相反角度讲了同一个故事：集团总收入从 ₹27.94 billion 下滑到 ₹26.89 billion，FY25 PAT 在 FY24 小幅盈利后转为亏损 ₹1.19 billion。第三方报道一致把
              FY24 表象归因于 Chaitanya 出售，所以任何趋势线都必须把经常性贷款盈利、处置收益和变化中的实体口径拆开。
