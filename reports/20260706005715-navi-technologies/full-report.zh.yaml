      - number: '7.2'
        title: 信用、融资与模型风险
        blocks:
          - type: paragraph
            body: >-
              Navi Finserv 的经济模型仍高度暴露于无担保个人贷款表现、外部融资市场，以及管理层在监管干预后维持收益率、损失和合规平衡的能力。CARE 报告显示，个人贷款仍占 AUM
              的绝大多数，因此承销漂移或催收摩擦会比在更多元化账本中更快撬动整个平台。报告的 GNPA 和 NNPA
              仍可控，结构化信用池也仍通过超额利差吸收损失；但同一组公开证据还显示，信用成本更高、经常性盈利能力只属中等，并依赖再融资。评级文件显示总债务超过 ₹7,300 crore，NCD 和 CP
              使用有分量，并明确需要在个人贷款利率保持较低时继续扩大银行融资。2026 年债务轮和 Bansal 本人“需要更多资本”的表态意味着，资本可得性不是可选上行，而是基础情景运营模型的一部分。
