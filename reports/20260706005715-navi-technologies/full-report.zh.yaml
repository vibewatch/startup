            body: >-
              公开定价记录显示，Navi 面临两线挤压。贷款上，Bajaj Finance、HDFC Bank、ICICI Bank，甚至 BankBazaar 的比较层，都让借款人更容易发现价格；除非 Navi
              能证明更快审批、更高额度或更好核保，否则不透明 APR 或显著溢价定价的空间会被压缩。KreditBee 和 Moneyview 又增加了另一种压力：它们押注数字速度、宽准入和明确产品菜单；KreditBee
              还公布了宽得多的 APR 区间，可覆盖风险更高的借款人。财富上，Groww 和 Paytm Money 披露具体价格锚点——₹0 开户、低佣金、零
              AMC，或促销零佣金——这让它们相较模糊的交叉销售主张，成为自助投资中更透明的替代品。存款和支付上，slice 的挂钩 repo 储蓄、返现驱动 UPI 信用卡和银行壳，展示了新挑战者如何把消费金融 UX
