  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与纳入逻辑
        blocks:
          - type: paragraph
            body: >-
              Navi 面对的不是一个整齐的同业集合。已保留公开证据显示，消费者至少有五种方式解决重叠任务：PhonePe 和 Paytm 这类支付驱动的广义超级 App；Bajaj Finance
              和传统银行这类利率锚定型贷款方；Groww 和 Paytm Money 这类投资驱动的钱包；Policybazaar 和 BankBazaar 这类轻资产保险与信贷市场；以及
              Moneyview、KreditBee、slice 这类数字贷款方或银行牵头挑战者。这个事实重要，因为 Navi 自身公开入口横跨
              UPI、贷款、保险和共同基金，所以几乎每一个相邻产品品类都会形成不同的竞争群组，而不是一个一一对应的替代品。本章的纳入逻辑因此由证据驱动：纳入那些披露了比 Navi 更宽消费者漏斗、发布了比 Navi
              更清晰价格锚点，或展示了比 Navi 当前保留公开记录更稳固监管、融资或披露姿态的玩家。
