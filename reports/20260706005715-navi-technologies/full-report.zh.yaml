        - UPI P2P、P2M、autopay 关联账户活动、支付习惯形成、商户 / 收款方结算信号
        - 现金、RTGS 大额资金流、重度依赖银行卡的企业收单、应用主导零售之外的交换费经济性
        - 买方 / 用户通常是同一消费者；下游服务的付款方可以是消费者或商户
        - 分销 TAM 和互动通道；不是干净独立收入 TAM，因为利润率仍以基点计
      - - 消费贷款
        - 个人信贷旅程、应用主导开户、数字承销、重复借款人循环、商户贷款邻接
        - 企业贷款、批发 NBFC 账本、纯住房银行经济性、线下黄金贷款
        - 买方和用户是借款人；付款方是借款人 / 家庭现金流
        - 如果 Navi 能定价风险并控制 CAC、催收和资本强度，这就是核心变现池
      - - 共同基金 / 被动财富
        - SIP、低成本指数基金、ETF、ELSS、自主零售投资
        - 私人银行 AUM、顾问驱动 HNI 财富、不符合 Navi 已披露被动定位的主动 AUM
        - 买方 / 用户 / 付款方通常是同一零售投资者
        - 可见的 Navi 邻接；AMFI 数据显示被动子集有意义，但远小于总 MF AUM
      - - 健康保险
        - 零售健康保险保费、续保、top-up / super-top-up、应用主导服务和理赔支持
        - 线下纯团体采购、非健康普通险种、代理驱动企业保险
        - 买方通常是有收入的家庭成员；用户是家庭成员；付款方可以是家庭或雇主
        - 可见的 Navi 邻接，但数字化获取保费相对名义市场规模仍小
      - - 同意与开户通道
        - Aadhaar 关联开户、Account Aggregator 同意流程、ULI 式承销基础设施
        - 手工纸质开户、纯分支机构发起承销、非数字数据收集
        - 买方是金融机构；用户是终端消费者；付款方是提供方 / 平台
        - 服务不足中产阶层转化的关键基础设施，尤其适用于薄档案贷款和低摩擦开户
      - - 商户与 MSME 支付生态
        - 商户 QR / 支付受理、商户订阅、商户贷款漏斗、MSME 现金流信号生成
        - 现有巨头规模的全栈商户收单、企业 POS 采购、非数字催收
        - 买方是商户 / 企业主；用户是企业 / 收款方；付款方是商户 / 借款人
        - 间接但战略上有意义，因为支付活动可反哺信贷和交叉销售
    notes: 纳入支出边界把高吞吐通道与可变现产品池分开。UPI 被视为习惯和漏斗基础设施，贷款、财富和保险才是收入池。除非 Navi 披露一个规模化独立商户产品线，否则商户相关性是间接的。
