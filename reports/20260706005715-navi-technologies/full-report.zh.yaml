  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开证据显示，Navi 先通过支付或发现路径获得零售用户，再尝试在信贷、保险和投资中扩大钱包份额。
    data:
      nodes:
        - label: 发现
          detail: 应用商店发现、品牌搜索或口碑
        - label: 首次工具性使用
          detail: UPI 转账、账单支付、充值或店内扫码支付
        - label: 金融需求触发
          detail: 借款、为家庭健康风险投保，或开始小额投资
        - label: 交叉销售循环
          detail: 推荐激励、UPI 使用势能和预批贷款额度扩大产品使用面
        - label: 持久性测试
          detail: 留存取决于定价公平、服务质量和运营信任
    approximationNotes: 这是一条定性旅程，来自直接产品入口和评级机构评论，而不是已披露的 CRM 漏斗。
    claimRefs:
      - CU001
      - CU003
      - CU018
      - CU019
      - CU020
      - CU042
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 可见采用路径从 App 发现或支付开始，随后分流到可变现产品， 以及重复借款或交叉销售结果。
    data:
      nodes:
        - id: N1
          label: 通过应用商店或品牌搜索发现
        - id: N2
          label: 安装并完成注册引导
        - id: N3
          label: 使用 UPI / 付账单 / 充值
        - id: N4
          label: 借款或购买保险
        - id: N5
          label: 增加投资 / 黄金 / 更多金融任务
        - id: N6
          label: 靠预批额度复用，或因信任问题流失
      edges:
        - from: N1
          to: N2
          label: 大型商店页触达 + 推荐计划
        - from: N2
          to: N3
          label: 支付和工具性使用带来习惯性打开 App
        - from: N3
          to: N4
          label: UPI 使用势能可把客户导入信贷交叉销售
        - from: N4
          to: N5
          label: 超级 App 广度带来钱包份额扩张选项
        - from: N5
          to: N6
          label: 复用取决于费用、服务质量和风控
    approximationNotes: 这条路径是结构性描述，不是量化漏斗；Navi 未披露发现、支付、 借款和交叉销售各阶段之间的转化率。
    claimRefs:
      - CU012
      - CU016
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU042
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: standard
    summary: Navi 的漏斗顶部和投诉证据很多，但公开持久性指标很薄。
    data:
      columns:
        - 证据载体
        - 结果具体度
        - 独立性
        - 留存可见度
      rows:
