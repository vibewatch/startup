        title: 成熟度、依赖关系与披露薄弱处
        blocks:
          - type: paragraph
            body: >-
              Navi 公开证据里最强的成熟度信号，不是内部架构，而是外部运营覆盖面。AppBrain 显示 Android
              分发规模很大，应用商店展示了当前的多产品货架，保险和共同基金业务也拿出了比许多私营金融科技公司更正式的治理材料。但这套覆盖面压在大量依赖之上：贷款靠联合放贷伙伴，支付靠 PSP 和 UPI
              通道，理赔靠保险公司和医院网络，开户靠 KYC 或验证供应商，财富业务靠基金运营基础设施。因此承销问题不在于 Navi
              是否搭起了产品组合；答案显然是肯定的。更难的问题是，这些模块的使用深度、技术一致性和运营韧性，是否足以支撑超级 app
              溢价。公开证据还没有显示，附加率、服务水平达成度、承销模型质量或跨产品功能一致性已经达到这个门槛。产品宽度看得见；持久的系统质量仍然相当不透明。
