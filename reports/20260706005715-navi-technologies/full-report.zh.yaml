      - 披露姿态
      - 监管注记
      - 竞争含义
    rows:
      - - PhonePe
        - 据报 2026 年 IPO 目标为 $9B-$10.5B，但市场也流传更高目标
        - 仍为私营，依赖 IPO 报道而非季度公开申报
        - 合作伙伴主导的信贷模式；本处未保留自有贷款方主张
        - 私营规模很大，但公开市场约束仍在形成
      - - Paytm
        - 已上市；公开市场估值历史可见
        - 投资者关系年报和季报节奏延续至 FY26
        - 2026 年 RBI 取消 PPBL 牌照
        - 受监管壳层受信任冲击，但披露深度仍高
      - - Groww
        - 据 TechCrunch，IPO 收盘后公开市场估值约 $9B
        - 投资者关系页面叠加市场报道
        - 本处未保留重大负面监管事件
        - 公开盈利能力和披露提升客户与合作伙伴信任
      - - PB Fintech
        - 2021 年起已上市
        - 投资者关系页面可见年报和季度业绩
        - 轻资产；未保留信用风险承担主张
        - 不承担贷款风险，也有较强披露
      - - Moneyview
        - 已提交 ₹1,500 crore IPO；保留资料中估值尚未最终确定
        - 媒体报道可见 IPO 期披露，但尚未进入完整上市公司节奏
        - NBFC 和 DLG 规则是重要风险因素
        - 比大多数私营贷款方更接近公开审视
      - - KreditBee
        - 按 $1.5B 估值融资 $280M；据报筹备 IPO
        - 仍为私营；报道主要经媒体中介
        - 合作贷款方模式，而非广泛的公开银行壳
        - 有资本支持，但公开报告仍比上市同业更轻
      - - slice
        - 据报融资讨论低于此前独角兽估值
        - 仍为私营，但现在叠加 SFB 报告和媒体覆盖
        - 合并后已成 SFB；尽管运营改善，估值仍被重置
        - 牌照强度有帮助，但资本市场更挑剔
      - - Bajaj / 既有银行
        - 本章不是估值驱动；优势来自受监管贷款方身份和公开消费端触点
        - 公开利率和大规模消费者页面
        - 完整贷款方控制和传统信任
        - 利率纪律和资产负债表信任抬高 Navi 的门槛
    notes: 只有公开报道留下可支撑标记时，本表才比较融资姿态；缺少当前公开数字只视为披露更薄，本身不是负面事实。
