  - id: TV005
    title: 打破投资论点与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 未签署股权轮
        - 洽谈失败，或仅以异常保护投资人的条款成交
        - 意味着公开区间夸大了估值质量
        - 把估值重切到偏低基准或悲观区间
      - - 信贷质量不及预期
        - FY26 逾期、NPA 或核销显著差于管理层说法
        - 会把 Navi 拉向低倍数贷款机构可比公司
        - 暂停或推迟，直到完整信贷材料包审完
      - - 监管反复
        - 新的 RBI 处罚，或重新回到放贷限制
        - 会直接削弱增长和治理信心
        - 转向回避，或只以深折价入场
      - - 债务替代股权
        - 增长主要靠债务、担保或结构化资本供血，而不是干净股权
        - 会让人质疑洽谈区间的真实股权需求
        - 投资前必须审查股权结构和契约
      - - 平台叙事失效
        - UPI、保险或共同基金宽度没有转化为利润率或交叉销售经济性
        - 会削弱多产品溢价待遇的依据
        - 重新锚定贷款机构式公开可比区间
    notes: 这些触发项可监控，因为每一项都能绑定文件、监管事件或已披露运营指标，而不是模糊情绪。
    claimRefs:
      - CV017
      - CV025
      - CV027
      - CV030
      - CV050
      - CV051
      - CV052
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2026 年轮次条款
        - 已签投资条款清单、对股权结构的影响，以及任何投资人保护
        - 把公开估值和经济估值质量分开
        - 管理层 + 领投方资料室
      - - FY26 收入桥
        - 按产品划分的年初至今收入、抽佣率 / NIM 桥和贡献利润率
        - 判断当前规模是否支撑溢价待遇
        - 财务团队模型审查
      - - 信贷表现
        - 按贷款产品划分的 NPA、核销、催收和批次损失曲线
        - 决定贷款机构式折价是否应占主导
        - 信贷委员会材料包 + 服务分析
      - - 区域扩张
        - 东南亚国家计划、牌照路径、CAC 和预期损失画像
        - 乐观情景明确引用扩张选择权
        - 扩张工作流备忘录
      - - 交叉销售经济性
        - UPI、贷款、保险和共同基金之间的用户重合与盈利能力
        - 检验平台宽度是否带来真实估值抬升
        - 产品与增长分析
      - - 债务包袱
        - 当前 NCD 层级、担保、契约和再融资时间表
        - 厘清杠杆是在增强还是遮蔽估值质量
        - 资金 / 法务尽调
    notes: 这些要求是最低材料包，用来从可行的公开区间推进到可承销的私募市场判断。
    claimRefs:
      - CV048
      - CV049
      - CV052
      - CV053
      - CV054
