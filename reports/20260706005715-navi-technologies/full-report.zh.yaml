      - number: '2.2'
        title: 多镜头测算——吞吐量 TAM、受限 SAM 与缺失的贷款总量
        blocks:
          - type: paragraph
            body: >
              最宽的一层镜头是支付吞吐量。RBI 称，UPI 在 CY2025 处理 22,828 crore 笔交易、金额 ₹300 lakh crore，高于 CY2021 的 ₹72 lakh crore，期间金额
              CAGR 为 43%。这证明印度是全球最大数字支付生态之一，也解释了为什么每个消费金融科技公司都想要一个支付或银行账户触点。但同一组 RBI 数据也显示，UPI 以小额交易为主；Paytm 的 FY26
              文件表明，即便商户支付已经形成规模，变现仍靠基点级支付利润率、订阅、部分带 MDR 的工具和交叉销售。换句话说，UPI 最适合被视为分发 TAM，而不是干净收入 TAM。


              财富镜头窄得多，也更适用于 Navi。AMFI 2026 年 5 月月报显示，共同基金行业净 AUM 总额为 ₹81.58 lakh crore，但与 Navi 相关的被动子集小得多。AMFI 2026 年 5
              月细分报告显示，境内指数基金为 ₹2.25 lakh crore，境内股票 ETF 为 ₹7.60 lakh crore，黄金 ETF 为 ₹1.85 lakh crore。合计来看，这些被动或低成本相邻板块约为
              ₹11.70 lakh crore，约占全行业 AUM 的 14.3%。这个池子仍然很大，但比简单拿总 AUM 说 TAM 小一个数量级，因此是 Navi 共同基金 SAM 更干净的起点。


              保险从 TAM 到 SAM 的压缩更剧烈。IRDAI 记录，普通险和健康险公司在 FY2024-25 的健康险保费为 ₹1,17,505 crore，但总健康险保费中只有 1.68% 来自直接线上销售，只有
              0.05% 来自网络聚合平台。套用这些占比，直接线上保费池约为 ₹1,974 crore，网络聚合平台池只有约 ₹59 crore。Navi
              已通过已备案健康险产品参与这一市场；战略问题不是健康险总市场是否足够大，而是数字渠道占比能否从今天极小的渠道组合中实质性扩张。


              消费贷款仍是最难用公开数据精准测算的垂直。RBI《金融稳定报告》给出的是结构，而不是单一数字贷款 TAM：个人贷款仍由住房贷款（45.6% 份额）和其他个人贷款（37.3%）主导，NBFC
              上层信用也明显偏向零售。PB Fintech 和 Paytm 的同行披露证明，大规模数字信贷分发确实存在——PB 称 FY26 总贷款放款达到 ₹30,740 crore，Paytm
              也继续扩大商户和消费贷款分发——但官方公开序列中没有同样干净的「印度数字消费贷款发放」数字，能把 App 型贷款机构与银行、NBFC 和线下渠道隔离开。这个缺口必须保留下来，而不是用合成的总量 TAM 掩盖。
