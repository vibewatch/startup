      - number: '2.3'
        title: 面向印度服务不足中产阶层的买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              Navi
              的主要买方是数字化活跃的中产家庭，但这个标签下至少有五类不同任务。第一类是以智能手机为先的受薪消费者，他们已经使用数字支付，现在想要更便宜的财富产品、补充健康保障，或无需网点摩擦的小额信贷。在这一群体中，买方、用户和付款方通常是同一个人，有利于自助
              onboarding，也降低销售成本。第二类是薄档案或自雇借款人：仍可通过数字渠道触达，但传统的纯征信模型更难核保。在这里，Sahamati 的 AA 网络和 RBI 的 ULI
              扩张很重要，因为授权现金流数据可以把核保推进到静态征信规则之外。


              第三类是家庭保险决策者。IRDAI
              数据显示，健康险仍主要通过经纪人、代理人和直接线下渠道分发，而不是网络聚合平台或纯线上销售。这意味着买方往往是家庭中有收入的成员，用户是更广义家庭，付款方可以是家庭，也可以是团体场景下的雇主。采用路径高度依赖信任：理赔支持、续保和对保险公司的可信度感知，比
              App UX 本身更重要。PB Fintech 对理赔支持和高 CSAT 的强调说明，即便获客从线上开始，保险分发仍由服务驱动。


              第四类是首次投资或升级中的财富投资者。Navi 共同基金页面强调低成本被动选项，自然瞄准重视成本的 SIP 投资者，而不是高触达财富客户。这里付款方和用户通常也是同一个人，但切换成本高于支付，因为既有 SIP
              扣款授权、税务和组合惯性都会拖慢迁移。Zerodha 的规模显示，这个低成本数字投资板块已经挤满了拥有大规模存量客户和资产基础的在位者。第五类是商户 / 收款方生态，它不是 Navi
              当前已披露产品的主要买方，但仍相关，因为商户接受度和支付数据会产生下游信贷及交叉销售信号。Paytm 的商户 GMV 和商户贷款披露展示了这个漏斗如何在规模上运转；对 Navi
              而言，战略启示是商户相关性间接但真实。保险和信贷购物中，Policybazaar 和 BankBazaar 也说明，比较工具和免费信用分工具可以在贷款人或保险人拥有关系之前捕获消费者意图。
