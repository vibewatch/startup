      - number: '8.3'
        title: 公开可比公司与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              公开可比公司分析有助于给 Navi 划定区间，但不能给出虚假精度，因为 Navi 不是纯 BNPL 公司、纯贷款机构，也不是纯软件平台。可获得的可比区间很宽：LendingTree 和 OneMain
              看起来像较低倍数的贷款或交易撮合平台业务，Pagaya 也以较低代理倍数交易，Upstart 居中，Nu 溢价强得多，Affirm 仍是高倍数消费者金融科技基准中的离群值。SoFi
              作为规模同业有参考意义，但其易取得的 SEC 收入分类，并不能为简单的市值 / 收入代理提供干净的同口径分母。这种离散正是 Navi 未签署的 2026 年洽谈区间如此重要的原因。如果投资者把 Navi
              视为高溢价多产品金融科技平台，$1.8-2.0 billion 标记可以成立；但若锚定更普通的上市贷款机构类比，或因监管和信用复杂度给出折价，这一区间就显得偏撑。
