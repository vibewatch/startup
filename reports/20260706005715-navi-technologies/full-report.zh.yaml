      - number: '3.4'
        title: 护城河耐久度与反向信号
        blocks:
          - type: paragraph
            body: >-
              这个领域最强的竞争者护城河来自三处之一：大规模复用分发、明确的公开市场披露和融资通道，或对受监管资产负债表基础设施的直接控制。PhonePe
              最能代表第一类；其已披露用户和商户足迹，使它成为最难忽视的支付加交叉销售对手。Groww、PB Fintech 和 Paytm
              代表第二类，因为公开报告节奏和投资人审视会带来资本市场纪律，也给客户、伙伴和招聘对象提供更可见的证明集。slice、Moneyview、KreditBee 和 Bajaj
              则对应第三类，无论是通过银行控制、NBFC 控制，还是清楚披露的贷款经济性。反向证据和增长叙事同样重要。Paytm 支付银行牌照取消，显示监管强度可以摧毁消费金融栈内的可选性。Moneyview 的 IPO
              披露凸显，DLG 规则、外包规范和网络安全事件会损害增长。slice 的估值重置说明，即便经营指标改善，也不保证能获得溢价资本。在这个背景下，Navi
              的护城河仍更像一份宽产品菜单，而不是一项被清楚记录的规模、资本或牌照优势。
