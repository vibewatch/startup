            body: >-
              Navi 的公开产品入口比单一 UPI 或贷款 App 更宽。公司自己的 About Navi 页面把品牌与 UPI、现金贷款、住房贷款、健康保险和共同基金绑定；当前 Android 和 iOS
              商店列表则把体验包装成一个用于支付、投保、投资，并在部分场景下借款的金融超级
              App。这个宽度真实存在，但没有被披露为一个干净的软件平台。公开证据显示的更像是一组受监管产品，在一个消费者品牌背后被缝合在一起。贷款通过 Navi Finserv
              和专用贷款申请页面呈现；保险有自己的信任和保单入口；共同基金有庞大的文档中心和正式 AMC 栈。即便 UPI 页面，也已从简单支付延伸到 UPI Lite、RuPay-credit-card-on-UPI
              行为，以及 Navi Trezo 先买后付表述。因此，读者应承保的是一个产品目录很宽、前门体验统一的平台，而不是一套完全透明的单体架构。
