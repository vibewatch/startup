      - number: '6.4'
        title: 扩张与集中度含义
        blocks:
          - type: paragraph
            body: >-
              Navi 的扩张逻辑很容易看见，但集中度数学并不清楚。超级 app 结构、低客单价入口产品、推荐机制，以及 India Ratings 关于 UPI 为贷款交叉销售带来新用户的观察，都支持一个判断：Navi
              想把一个已获取的零售客户变成多产品关系。同一家机构还称约一半个人贷款为预先批准，这可作为重复借款的有用代理。但公开记录仍严重偏向产品宽度和漏斗顶部信号，而不是分群经济性。India Ratings 称截至
              2024 年 9 月，AUM 约 89% 仍来自无担保个人贷款；即便零售模型下单一账户集中度很可能较低，这也意味着产品集中。已审阅公开来源没有披露 MAU/DAU、商户数、商户与 P2P
              的组合、保险续保、共同基金留存、NRR，或按客户分群划分的附加率。尽调核心问题不是 Navi 能否吸引用户，而是能否留住、交叉销售并分散这些用户，同时不过度依赖一个无担保贷款引擎。
