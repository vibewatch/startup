  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Navi 最尖锐的下行风险在于，近期监管痛点并非假设。RBI 在 2024 年 10 月叫停 Navi Finserv 批准和发放新贷款，并明确把行动与定价政策担忧、过高贷款利差、Fair Practices
              Code 不合规，以及其他监管缺陷相连。RBI 后来在整改后解除限制，这是有意义的缓释，但该事件留下先例风险：一旦定价、客户对待或流程纪律再次滑坡，监管已经证明自己愿意叫停新增贷款。到 2026
              年，这一担忧不是消失而是扩大；RBI 因下班后催收电话和短信协议失败，对其开出催收代理处罚。Chaitanya 业务线更早被拒银行牌照，也强化了监管牌照风险并非一次性事件。对投资者而言，问题不是 Navi
              能否在监管下增长，而是在无担保信贷、催收和数据密集型数字开户混合的产品组合里，合规执行能否始终跑在增长前面。
