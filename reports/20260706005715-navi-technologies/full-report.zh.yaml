            body: >-
              负面证据已经足够多，不能只看应用商店评分来判断客户质量。渠道层面，商店评分为正；但记录中也有具名投诉案例，以及一次直接指向客户实践的监管干预。Consumer Complaints Court
              条目指称未经授权的信用查询、EMI 延期后的威胁式催收、有争议的尾款收费、还款后 CIBIL 报告未解决，以及反复致电自称从未向 Navi 借款的人。Ajeesh Joseph 的 Google Play
              评论文本给出一个更软但仍有用的信号：用户对费用的感知随时间变差。最重要的负面证据来自一手监管行动：RBI 在 2024 年 10 月因定价、公平实践和客户服务担忧叫停 Navi Finserv
              新增贷款，只有在流程整改后才解除限制。除信贷服务外，Hindustan Times 报道了一个支付漏洞，冒充客户的骗子借此骗走 Navi Rs. 14.26 crore。客户层面的结论是，Navi
