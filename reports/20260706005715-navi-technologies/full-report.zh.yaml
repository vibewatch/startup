  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标 / 披露
      - 对投资判断的影响
      - 具体尽调路径
      - 当前公开信号
      - 严重性
    rows:
      - - RBI 整改后的实际 APR 与费用收益率
        - 无法判断标示 APR 能否落成合规且可持续的实际收益率
        - 索取 2024 年 10 月以来按产品、借款人分群和放款季度拆分的月度收益率桥
        - 公开信息只有挂牌定价；RBI 明确质疑过定价和费用披露
        - 重大
      - - 渠道层面的资金成本
        - 无法判断 NCD、CP、银行、联合放贷或证券化是否增厚收益
        - 索取按渠道拆分的借款台账，包含利率、期限、套保和受限资产数据
        - 总融资流向公开，综合成本不公开
        - 重大
      - - 分部收入与利润率拆分
        - 无法看出利润有多少来自放贷、UPI、AMC、保险或广告
        - 索取经审计的分部明细，按业务线列收入、毛利、运营费用和资本占用
        - 官方业绩仍按单一融资分部披露
        - 重大
      - - RBI 事件后的放款批次、滚动率和回收
        - 无法检验整改是真改善了借款人质量，还是只按下增长暂停键
        - 索取 2024 年 10 月后客群的静态池表、滚动率矩阵、回收和核销批次
        - 公开信息只有汇总 GNPA/NNPA 和一份证券化资产池报告
        - 重大
      - - 集团现金消耗与续航期
        - FY25 集团亏损后，无法判断控股公司的韧性
        - 索取月度资金头寸、未受限现金、公司间余额和 12 个月续航期桥
        - 第三方来源给的是现金快照，不是续航期桥
        - 重大
      - - 关联方与创始人融资条款
        - 无法判断控股公司层面的再融资风险或上行现金外流
        - 索取创始人与母公司融资的已签条款清单、到期表和约束条款包
        - 公开文件披露金额，但不披露完整经济条款
        - 较小
    notes: 这些是真正的公开数据缺口，不是作者漏写；多数缺口之所以重要，是因为 RBI 事件把定价、披露质量和整改后的资产表现都推到了投资判断核心。
