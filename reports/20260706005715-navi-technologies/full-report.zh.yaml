      - number: '4.5'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              结论是，Navi Finserv 商业上真实存在、资产负债表很重，而且仅靠公开数据仍无法完全承保。正面因素不少：贷款主体在 FY25 仍保持盈利，资本充足率舒适地高于
              25%，融资渠道覆盖银行、NCD、CP、联合贷款和证券化，公司也足够快地从 RBI 暂停中恢复，重新获得评级稳定并恢复放款。负面因素同样实质：FY24 利润表象受 Chaitanya 出售收益抬高；FY25
              集团盈利转负；个人贷款仍是主导账簿；监管方明确质疑定价公平、展期控制和披露纪律。投资人可以得出方向性结论：Navi
              有规模、有融资通道，也有核保机器。公开证据仍没有提供的是整改后收益率栈、按产品轨道划分的分部盈利、2024 年 10 月之后 vintage 损失表现，或母公司层面现金跑道桥。披露这些之前，Navi
              更适合被放在谨慎的「继续研究」财务立场，而不是形成干净的承保确信。
