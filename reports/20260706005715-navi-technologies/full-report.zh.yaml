        - from: core
          to: upi
          label: 支付依赖外部通道
        - from: core
          to: lenders
          label: 借款依赖伙伴资金和服务
        - from: core
          to: kyc
          label: 注册引导依赖身份和文件检查
        - from: core
          to: ins
          label: 保险执行依赖保险公司和网络运营
        - from: core
          to: funds
          label: 财富业务依赖受监管基金运营
        - from: reg
          to: lenders
          label: 数字借贷管控
        - from: reg
          to: ins
          label: 投保人和理赔管控
    claimRefs:
