            body: >-
              信任入口在监管强制披露处最强。保险是最佳例子：Navi 展示了保单号验证、IRDAI
              注册信息、公开披露页面、董事会批准的投保人利益文件，以及面向客户的网络安全指南。贷款也披露具名投诉处理官；更重要的是，它已经经历过围绕公平定价和数字贷款控制的公开 RBI 执法及整改。UPI 和一般 App
              条款披露了交易历史访问、PIN 和 OTP 泄露警示，以及 SIM 卡更换或设备变更等可疑事件后的额外认证或冷静期措施。Apple
              隐私标签又加了一层，显示可能有多少个人和金融数据与用户关联。局限在于，大多数控制证明的是治理和政策卫生，而不是运行时质量。Navi 更愿意公开客户行为指引和法律义务，而不是运营
              SLA、欺诈率、宕机历史或模块级错误处理。
