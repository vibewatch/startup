      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              最强增长驱动来自基础设施和分发，而不是品牌本身。RBI 支付系统数据确认，印度已经拥有全国规模的数字支付行为；TRAI 确认互联网和宽带连接数已超过十亿；World Bank Findex
              确认账户持有率已达到成人的 78%。AA 网络规模、ULI 扩张，以及 FI-Index 升至 67.0，显示政策栈仍在推动更深入的金融使用。Digital India
              公开仪表盘补充了另一个重要信号：Aadhaar 生成量和可运行的 CSC 覆盖已经达到全国规模，UIDAI 的 Aadhaar App 下载里程碑则说明数字身份熟悉度正在进入主流。在共同基金上，AMFI
              数据显示被动品类已经是多 lakh crore 级池子，与 Navi 已披露的低成本产品框架高度一致。保险上，PB Fintech 的 FY26
              披露显示线上保险保费和新健康险增长仍在快速扩张，意味着数字保险占比即便基数低，也仍有上升空间。


              约束同样清楚。支付变现结构性受压，因为 UPI 规模无法取消零 MDR 现实，商户支付利润率也仍以基点计。数字贷款面对行为和资本纪律：RBI 2025 年数字贷款指引强制标准化披露和公开 App
              目录验证，资本规则也继续惩罚拨备不足的无抵押压力。保险仍受信任和服务约束：IRDAI 显示直接线上销售只贡献总健康险保费的 1.68%，网络聚合平台只有
              0.05%，说明仅靠数字获客尚未改写分发。共同基金的信任摩擦低于信贷或保险，但合规负担仍重：SEBI 2025-26 年围绕报告格式、锁定 /
              借记冻结设施和方案分类连续发布通知，提醒市场产品简化并不会消除监管运营。


              消费者层面也存在重要采用摩擦。World Bank Findex 仍发现 160 million 名已开户成年人用现金支付水电等账单，闲置账户率为
              35%，说明数字账户可得性不会自动变成习惯性金融产品使用。TRAI 的城乡差距仍然刺眼：印度农村互联网普及率低于每百人 50，而城市超过 126。这很重要，因为 Navi
              的服务不足中产阶层命题，依赖触达范围从已经数字化的城市受薪群体继续扩出去。同时，成熟的比较和投资在位者已经投入资金捕获高意向流量，所以数字分发不自动意味着低
              CAC。结果是，这个市场有真实顺风，但不能假设转化没有摩擦。
