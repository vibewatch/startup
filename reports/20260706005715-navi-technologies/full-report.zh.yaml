        - 需要平衡更低利率、融资结构和个人贷款集中度
        - 中高
        - 高
        - 当前流动性和评级仍充足
        - 索取 2025-2026 年放款批次、ALM 期限梯队和银行授信余量。
      - - 公开市场准备度与披露
        - IPO 仍被表述为未来资本需求，不是已搭好的报告制度
        - 中
        - 中高
        - 既有 DRHP 经验和现有债务投资人披露
        - 索取当前 IPO 准备计划、内控工作流和分部披露材料包。
    notes: 本表聚焦执行一旦失手、就可能迅速转化为监管、融资或估值损伤的职能。
    claimRefs:
      - CR012
      - CR033
      - CR042
