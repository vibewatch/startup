  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从可信的约 $2B 估值讨论出发，纳入债务和监管保留项，最后落到跟踪结论。
    data:
      nodes:
        - id: range
          label: 最新估值信号
          detail: 2026 年讨论区间为 $1.8-2.0B
        - id: floor
          label: 估值底线
          detail: Hurun 2025 确认 >$1B 独角兽地位
        - id: proof
          label: 经营证据
          detail: FY24 规模、UPI 交易量和 2026 年放款额支撑估值可信度
        - id: drag
          label: 拖累因素
          detail: 债务驱动增长、FY25 集团亏损和 2024 年 RBI 暂停令
        - id: decision
          label: 投资判断
          detail: 跟踪；尽调过关则合理，接近区间上沿则偏贵
      edges:
        - from: range
          to: floor
          label: 受限于
        - from: floor
          to: proof
          label: 需要
        - from: proof
          to: drag
          label: 被抵消
        - from: drag
          to: decision
          label: 导向
    claimRefs:
      - CV001
      - CV011
      - CV023
      - CV025
      - CV027
      - CV042
      - CV043
      - CV056
      - CV057
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 公开可比公司显示，消费金融科技和贷款业务的市值 / 收入倍数区间非常宽。
