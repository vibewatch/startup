        - 说明 Navi 不只是次级信贷，也能面向更干净的零售信贷客群做风控
        - 资格细节来自评测文章，不是当前官方授信规则表
      - - 保险家庭
        - 投保人为个人或家庭健康险付款
        - 同一应用内的小额健康险
        - 交叉销售可导向更黏的保障产品，并利用医院网络效用
