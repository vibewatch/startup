    rows:
      - - 领薪、数字优先的中产消费者
        - 以智能手机为入口的城市或半城市地区成年人
        - 同一人
        - 工资驱动的家庭预算
        - 借小额信用贷，开始 SIP，购买补充健康险
        - 低摩擦开户和低成本被动产品
