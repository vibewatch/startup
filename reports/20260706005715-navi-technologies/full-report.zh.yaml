            - label: 中等
              tone: neutral
            - label: 中高
              tone: warning
        - label: 融资或再融资收紧
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 中等
              tone: neutral
            - label: 中高
              tone: warning
        - label: 隐私 / 数据使用反弹
