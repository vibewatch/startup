  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与排除池
        blocks:
          - type: paragraph
            body: >
              Navi 的相关市场不是抽象的「印度金融科技」；而是那些能在线上获客、用授权数据核保，并通过贷款利差、分销费用或 AMC 经济性变现的 App 型零售金融活动交集。因此，纳入的池子包括：（1）作为参与和获客轨道的
              UPI 关联支付及账户活动；（2）消费贷款，尤其是能数字化定价和服务的个人信贷流程；（3）共同基金投资，重点是与 Navi Mutual Fund 已披露定位匹配的被动和低成本品类；（4）可在 App
              内获客、续保和服务的健康险制造 / 分销流程。Navi 自身保留的产品页面明显强调共同基金和健康保险；RBI 与 IRDAI 来源则显示，更广义市场按支付、信贷和保险等独立系统监管，而不是一个统一的钱包品类。


              这个边界排除了几个规模很大但变现较弱，或结构上不同的池子。RBI 支付系统报告显示，UPI 按金额看极其庞大，但 CY2025 平均客单价降至
              ₹1,313，说明原始支付吞吐量并不等同于贷款、财富或保险收入。因此，传统网点获客保险、线下代理驱动保费，以及整个共同基金行业的主动 AUM 都不是 Navi 的干净 SAM 代理。IRDAI
              渠道数据尤其重要：健康险总保费很大，但直接线上销售只贡献总保费的 1.68%，网络聚合平台仅 0.05%，所以用总保费口径推 TAM，会严重高估今天由数字渠道捕获的保险需求。


              商户和 MSME 支付活动仍相关，但主要是邻近机会，而不是 Navi 已披露的核心利润中心。Paytm 文件说明了原因：商户
              GMV、订阅和商户贷款交叉销售，即便在支付利润率按基点计量时，也能形成支付到信贷的漏斗。PhonePe 的消费者 App 定位把同一逻辑延伸到更广义的超级 App 框架，把 UPI、投资、保险和 UPI
              信用额度功能打包在一个入口中。对 Navi 而言，相关商户边界应是「商户作为信号和下游贷款 / 分销机会」，而不是「Paytm
              规模下的商户收单经济性」。这一区分影响估值，因为一个市场可以在用户习惯上极大，但直接可变现抽佣率仍受约束。
