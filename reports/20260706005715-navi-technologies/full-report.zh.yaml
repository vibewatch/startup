              下有专用贷款网页资产，说明共享品牌背后有独立模块入口。隐私、条款和监管材料让运营模式在系统层面可读：贷款中，联合贷款伙伴很重要；理赔中，保险公司和医院网络很重要；共同基金运营依赖受托人、AMC、登记机构和合规职能；App
              商店或移动平台则是主要分发轨道。缺失的是再下一层。公开材料没有 API 参考、状态页、架构图或服务可观测性披露，能解释支付、信贷、保险和财富在栈内如何组合。公开来看，Navi
