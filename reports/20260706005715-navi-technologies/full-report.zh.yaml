      - number: '4.3'
        title: 融资、NCD 与资本结构
        blocks:
          - type: paragraph
            body: >-
              Navi 的贷款模式显然依赖债务融资，而不是轻股权。FY25 业绩显示，当年债务证券所得为 ₹22.32 billion，其他借款为 ₹49.47 billion，大体对应管理层称 Navi Finserv
              从债务市场筹集 ₹72.687 billion 的说法。同一文件称，上市 NCD 拥有 100% 安全覆盖，募集资金用途没有重大偏离。CARE 描述了 2024 年末多元化融资栈：总债务为 ₹7,391
              crore，银行定期贷款占借款的 29.7%，NCD 占 26.1%，CP 占 6.4%，母公司 NCD 融资占 4.1%。公开 NCD 发行仍然重要。2024 年 2 月发行基准规模为 ₹300
              crore，另有 ₹300 crore 绿鞋，属于有担保发行，以 CRISIL A/Stable 推介，结构上至少 75% 用于后续贷款或再融资。母公司层面，Navi Limited 年度申报仍显示 FY25
              末有 ₹2.5 billion NCD 未偿；年报还披露 Sachin Bansal 提供了额外 ₹3.5 billion 无担保定期贷款，以及 ₹2.5 billion 控股公司 NCD，用于一般公司用途。
