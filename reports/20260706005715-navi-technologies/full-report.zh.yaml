      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              当前公开记录中，最关键的治理事件发生在 2025 年 2 月。Business Standard、ET、News18 和 Entrackr 均报道，Sachin Bansal 卸任 Navi
              Technologies 和 Navi Finserv 的 CEO，转任执行主席，Rajiv Naresh 接手 Navi Technologies，Abhishek Dwivedi 接手 Navi
              Finserv。ET 和 Entrackr 明确给出了职责拆分：Naresh 负责 UPI、保险和共同基金等非贷款业务，Dwivedi 负责贷款。Bansal
              保留的职责仍覆盖战略、融资、并购、合规和风险管理，所以创始人在放手日常运营后仍处于中心位置。官方治理披露在受监管贷款主体层面最强。Navi Finserv 董事会页面列出 Bansal 为非执行主席，Ankit
              Agarwal 为非执行董事，并列出 Ranganathan Sridharan、Nilufer Panthaki、Arindam Ghosh、Ashwani Kumar
              等多位有经验的董事。受监管实体治理因此更让人放心，但更大的尽调问题没有完全解决：公开材料仍没有给出同样清晰的控股公司层面董事会图谱、委员会权限摘要，或整个集团的股东控制说明。
