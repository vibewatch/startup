      - number: '1.3'
        title: 融资历史、债务通道与规模标记
        blocks:
          - type: paragraph
            body: >-
              Navi 的资本故事并不常见：证据显示其规模和市场融资能力都真实存在，但没有一轮清楚闭合的外部股权融资。ET 2024 年 4 月报道，Navi 曾探索以约 $2 billion 估值私募融资 $200-300
              million；2026 年 6 月又报道，公司与 Prosus 和 Accel Growth Fund 就 $250-300 million 融资洽谈，投后估值 $1.8-2.0
              billion。同一组报道显示，前一次尝试并未完成，这意味着最新公开估值标记仍来自洽谈，而不是交易。债务市场更具体。ET 报道了 2025 年 7 月由 PhillipCapital 牵头的 Rs 170
              crore NCD 发行；Navi Finserv 自身披露也显示 NCD 仍在持续服务，并有 2026 年 7 月财务委员会会议。官方评级和评级机构说明进一步强化了这一点。Navi Finserv 网站列出
              CRISIL、India Ratings 和 CARE 的短期及长期评级；CARE 2025 年 12 月说明称，商业票据额度提升至 Rs 1,700 crore，AUM 达到约 Rs 14,700
              crore，累计放款约 Rs 52,000 crore，更广义生态拥有 21 million 月度用户。因此，证据支持它是一家有规模、能融资的私营平台，但还不能说明其估值或股权结构已经达到招股书级别。
