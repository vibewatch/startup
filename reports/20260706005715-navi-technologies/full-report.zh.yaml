      - number: '8.4'
        title: 建议与尽调
        blocks:
          - type: paragraph
            body: >-
              以今天公开证据水平，正确判断是跟踪，而不是买入。原因不是 $1.8-2.0 billion
              区间显然错误，而是市场尚未看到一轮披露经济条款的已成交融资；同时下行证据足够重要，投资者应先坚持拿到条款和运营证明，再承销溢价。当前估值标记最强的支撑，是反复出现的约 $2 billion
              融资叙事，加上真实运营宽度和规模。最强的反向因素是，最新融资仍只是讨论，而公开档案也显示 2024 年监管中断、FY25 集团亏损、债务驱动增长，以及 FY26 信用表现可见度不完整。因此，如果 Navi
              能满足尽调要求，并保持监管和信用趋势稳定，估值看起来合理；但在缺口补齐前，区间上沿偏贵。在这套证据到手之前，正确姿态是保留上行选择权，同时拒绝按这轮融资已经以干净条款成交来付价。
