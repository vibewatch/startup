  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Navi 的产品质量既取决于 App UX，也同样取决于支付通道、受监管实体、贷款方、 身份供应商以及基金 / 保险基础设施。
    data:
      nodes:
        - id: core
          label: Navi 消费者入口
          role: hub
        - id: stores
          label: 应用商店和移动 OS
          role: dependency
        - id: upi
          label: NPCI / PSP / UPI 通道
          role: dependency
        - id: lenders
          label: 联合贷款伙伴和 LSP
          role: dependency
        - id: kyc
          label: KYC 和验证供应商
          role: dependency
        - id: ins
          label: 保险公司和医院 / 理赔网络
          role: dependency
        - id: funds
          label: AMC / 受托人 / 登记机构 / 托管人栈
          role: dependency
        - id: reg
          label: RBI / IRDAI / AMFI 治理层
          role: control
      edges:
        - from: core
          to: stores
