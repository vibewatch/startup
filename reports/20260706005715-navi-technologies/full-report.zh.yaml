  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 催收合规
        - 监管或法院针对催收行为采取行动
        - 任何新的 RBI 行动、重大罚款，或下班后联系 / 通讯录骚扰出现不利模式
        - 暂停承销；增加敞口前，要求外部催收审计并完成整改。
      - - 定价与公平做法纪律
        - 放款政策干预
        - 任何重复处罚、放款限制，或关于定价 / WALR / 客诉处理的监管通知
        - 除非范围明确很窄且快速修复，否则视为打破投资论点。
      - - 融资与流动性
        - 对债务市场的依赖加重
        - 紧急发行 NCD、评级展望转弱，或未来六个月债务明显超过可见流入且没有承诺后盾
        - 重估下行情景，并要求已承诺授信或股本缓冲。
      - - 信贷表现
        - 个人贷款批次恶化
        - GNPA、信用成本或资产池损失显著上升，且定价 / 催收改善不足以抵消
        - 下调确信度，重算回报门槛。
      - - 客户信任与隐私
        - 投诉强度或数据授权反弹上升
        - 有证据显示骚扰、同意授权或 CIBIL 投诉增长快于整改证据
        - 估值中计入更高 CAC、更低留存和更大监管风险。
    notes: 终止标准刻意做成可监控事项，并绑定可观察的监管、运营或融资事件，而不是泛泛的担忧标签。
    claimRefs:
      - CR005
      - CR006
      - CR017
      - CR018
      - CR019
      - CR028
      - CR029
      - CR031
      - CR033
      - CR048
      - CR050
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 理由
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 公开证据支撑其可行性，但看不出明显错价
        - 不要只凭公开估值数字追这家公司
      - - 信心
        - 中
        - 最新估值证据仍是洽谈区间，不是已签轮次
        - 用情景区间承销，不用单点估值
      - - 风险评级
        - 高
        - 监管历史、信贷复杂度和轮次条款不透明仍然重要
        - 接近区间上沿出价前，必须拿到投资条款清单和 FY26 信贷数据
      - - 估值立场
        - 约 $1.6-1.8B 算合理；接近 $2.0B 偏紧
        - 最新洽谈区间可以支撑，但证据还不够厚
        - 若入场价接近传闻上限，必须压住价格或条款纪律
      - - 当前证据最强区间
        - 基准情景 $1.6-2.0B
        - 最新报道的 2026 年区间为 $1.8-2.0B，Hurun 确认底线 >$1B
        - 尽调围绕区间展开，不锚定单一数字
      - - 主要不确定性
        - 资本结构质量
        - 公开投资条款清单未披露稀释、优先权或治理权
        - 条款可见前，把公开估值视为不完整
    notes: 本表总结当前公开估值的可投性，而不是断言已成交价格。
