companyProfile:
  summary: >-
    Navi Technologies 是一家总部位于 Bengaluru 的私营金融科技集团，围绕受监管金融产品轨道搭建，而不是押注单一钱包功能。其运营栈覆盖 Navi Finserv 下 RBI 监管的贷款、IRDAI
    监管的健康保险、SEBI 监管的共同基金，以及 NPCI 批准的 UPI 应用入口，并把这些产品打包成一个强调简单、低摩擦金融体验的消费者
    App。公开证据显示，它已经跑出一定规模的贷款与支付漏斗，具备债务市场融资能力和有意义的用户触达；但在合并口径经济性、治理和客户留存韧性上，公司披露仍远少于公开市场投资人需要的信息。
