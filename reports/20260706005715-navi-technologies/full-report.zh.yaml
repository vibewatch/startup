      - number: '7.4'
        title: 治理、竞争与披露风险
        blocks:
          - type: paragraph
            body: >-
              Navi 的治理和披露风险，不在于完全没有结构，而在于公共透明度是否跟得上野心。Sachin Bansal 已从 CEO 转为执行董事长，同时由新 CEO 管理 Navi Technologies 和 Navi
              Finserv，这可以增加管理带宽，但仍带来围绕问责和执行的过渡期。董事会包含有信誉的独立董事，但投资者仍更多依赖评级机构备忘录、政策 PDF 和偶发采访，而不是上市公司式披露。2022 年 DRHP 显示
              Navi 曾寻求上市，但公司后来撤回流程，并仍把 IPO 描述为未来资本需求，而非已经建立的报告制度。支付业务上，Navi 正在改善位置，但仍进入一个结构性集中的市场，PhonePe、Google Pay 和
              Paytm 仍占主导份额。这意味着 Navi 必须吸收竞争压力、激励和产品投入要求，同时收紧合规和融资纪律。
