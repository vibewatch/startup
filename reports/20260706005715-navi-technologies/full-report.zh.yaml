      - number: '4.4'
        title: 监管与披露质量
        blocks:
          - type: paragraph
            body: >-
              2024 年 10 月 RBI 行动是本章核心负面事实，因为它不只是一次暂时增长中断。RBI 称 Navi Finserv 的加权平均贷款利率和对资金成本的利差过高，随后又指出收入评估、还款能力测试、导致展期的
              IR&AC 偏差、利率和费用披露，以及核心金融服务外包方面的担忧。CARE 将其 A1 CP 置于发展中观察，Business Standard 则报道 CRISIL 将 Navi 置于负面观察。2024 年
              12 月 2 日，在流程改造和反复沟通后，限制被解除；但这一事件留下披露悬念，因为公开投资人仍看不到整改前后的经济性。2024 年 11 月 BSE 澄清进一步强化了这种担忧：Gross Stage 3 从
              2.06% 更正为 2.04%，Net Stage 3 从 0.13% 更正为 0.34%。Navi 的公开 IR 足迹是真实的——年报、业绩、招股书和监管文件都有——但落地页很薄，实体口径又在控股公司、NBFC
              和已出售业务之间切换，因此随意拿标题数字比较很危险。
