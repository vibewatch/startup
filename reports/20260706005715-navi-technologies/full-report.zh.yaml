        title: 账簿增长、资产质量与单位经济性代理
        blocks:
          - type: paragraph
            body: >-
              NFL 仍然实现了实质性扩张。管理层披露，FY25 管理 AUM 超过 ₹115 billion，放款超过 ₹134 billion，覆盖 1.36 million 笔贷款；个人贷款超过 ₹102
              billion，住房贷款超过 ₹14 billion。CARE 2024 年 12 月说明补充称，截至 2024 年 6 月，活跃客户为 13.5 lakh；到 2024 年 9 月，AUM 已达 ₹12,662
              crore；尽管经历 RBI 暂停，到 2024 年 11 月个人贷款仍占 AUM 的 86.3%。这个组合重要，因为当前标价可见——现金或个人贷款最高 ₹20 lakh，利率最高 29.96%；住房贷款最高
              20%，LAP 最高 22%——但定价整改后的实际收益率不可见。因此，公开单位经济性代理都是间接的：FY24 信用成本为 4.32%；FY25 融资成本加减值大约吃掉已报告经营收入的 61%；FY25
              联合贷款放款为 ₹23.58 billion；ICRA 2025 年 6 月个人贷款证券化更新仍显示累计回收效率为 90.8%，loss-cum-90+ DPD 为 8.5%。
