  - id: TI003
    title: 单位经济模型表
    columns:
      - 指标
      - 数值 / 公开代理指标
      - 置信度
      - 为什么重要
      - 尽调追问
    rows:
      - - FY25 放款额 / 管理 AUM 周转率
        - ~1.17x（₹134B+ 放款额 / ₹115B+ 管理 AUM）
        - 中
        - 显示贷款账本以无抵押为主、周转快，不是长期资产积累
        - 按产品提供月度分群放款额、平均期限和还款速度
      - - FY25 融资成本 + 减值负担
        - 约占 FY25 经营收入的 60.6%（₹7,968.15m + ₹5,787.95m / ₹22,711.54m）
        - 中
        - 说明融资和信用成本主导盈利结构
        - 按产品线提供单位 P&L，拆出融资成本、预期损失、回收和运营支出
      - - FY24 信用成本
        - 4.32%，FY23 为 5.30%
        - 中
        - RBI 事件前，外部最好的损失调整后单位经济性代理指标
        - 提供贯穿 FY25 和整改后分群的季度信用成本桥
      - - 账本结构集中度
        - 2024 年 11 月 30 日，个人贷款占 AUM 的 86.3%
        - 中
        - 尽管有抵押产品在扩张，无抵押个人信贷仍驱动贷款账本
        - 按产品披露当前有抵押 / 无抵押结构、收益率和损失
      - - 联合贷款占比
        - FY25 联合贷款放款 ₹23.58B；未偿余额 ₹4.53B
        - 中
        - 显示一根资本效率杠杆，可能缓和表内增长和融资需求
        - 分享合作伙伴名单、抽佣率，以及相对表内贷款的盈利能力
      - - 证券化池表现
        - ICRA 2025 年 6 月贷款池显示累计回收效率 90.8%，loss-cum-90+ DPD 为 8.5%
        - 中
        - 对个人贷款池的催收和损失吸收形成独立检验
        - 为更广泛表内组合提供静态池表，不只披露证券化池
      - - 公开效率代理指标
        - Entrackr 估算，FY24 每 ₹1 经营收入对应支出 ₹0.92，FY25 为 ₹1.06
        - 低
