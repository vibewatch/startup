chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Navi 如今对外呈现的是一个广义金融服务 App，而不是单线贷款机构。官方「关于我们」文字显示，Navi App 由 Navi Limited（前身为 Navi Technologies
              Limited）拥有；贷款放在 Navi Finserv，健康险放在 Navi General Insurance，共同基金放在 Navi AMC 和 Navi Mutual
              Fund。官网首页文案展示了一个统一分发入口，覆盖 UPI、贷款、保险、投资、账单和充值。披露最清楚的运营地址是 Navi Finserv 在 Bengaluru
              的注册办公室，这一地址反复出现在投资者关系和数字贷款披露中。创立时间上，公开记录并不完全干净：ET 2022 年 IPO 报道和 News18 2025 年重组报道把推出时间放在 2018 年，由 Sachin
              Bansal 和 Ankit Agarwal 发起；ET 2025 年 2 月人物报道则称 Bansal 自 2016 年创立这些公司以来一直领导它们。因此，审慎的尽调判断应是「2010 年代后期、由
              Bansal 和 Agarwal 搭建、总部位于 Bengaluru 的私营金融科技平台」，准确法律时间线仍需核对原始注册文件。清楚的是当前阶段：Navi 已经像一个后期、IPO
              前平台，拥有评级债务通道和多条受监管产品线，而不是仍在证明产品市场匹配的早期创业项目。
