      - number: '8.2'
        title: 资本结构与运营信号
        blocks:
          - type: paragraph
            body: >-
              支撑 Navi 估值的证据来自业务宽度和运营规模；削弱估值的证据来自增长如何融资、如何受监管。官方页面显示，产品覆盖 UPI、消费贷款、住房贷款、保险和共同基金。多篇 2025 年 7 月报道称 FY24
              收入达到 Rs 2,290 crore、利润大幅提升，同一批报道也提到强劲 UPI 活动。ET 还报道 Navi Finserv 月放款 Rs 3,000-4,000 crore，且 2025 年 12
              月季度盈利。但同一份公开档案也显示真实拖累：2024 年 RBI 暂停贷款、FY25 集团层面净亏损、通过 2025 年 NCD 发债而非新股权融资增长，以及围绕 DLG 和 NPA
              出售通知的持续披露。换句话说，Navi 确有规模，但仍背着资本结构和信用质量问题，直接影响估值质量。
