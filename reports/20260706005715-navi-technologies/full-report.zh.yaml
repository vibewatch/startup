            body: >-
              Navi 在获客和交易触达上的公开证据，比在可变现客户留存上的证据更强。Android 端，Google Play 在运行日显示 10Cr+ 下载、58.7L 条评论、4.3 分；Apple 印度 App
              Store 显示 237k 个评分、4.5 分。这些都是应用已触达生产级消费者使用的有效证据，即便商店总量不等于活跃客户。独立报道又加了一层使用证据：Entrackr 报道称，Navi 2025 年 6 月在
              UPI 应用中排名第四，当月处理 406 million 笔交易，金额 Rs. 21,815 crore。公开获客机制也看得见。应用展示推荐计划，India Ratings 称规模扩大后获客成本下降，UPI
              动能把新用户带进平台用于交叉销售。合在一起，证据支持 Navi 拥有真实获客引擎和支付驱动漏斗；但仍未回答其中有多少用户会成为可盈利的重复借款人、投保人或投资者。
