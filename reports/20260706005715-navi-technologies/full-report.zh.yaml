      - - 城市中等收入借款人
        - 借款人与付款方是同一个零售消费者
        - 通过应用申请个人贷款和住房贷款
        - 据 GripInvest 和官方放贷界面，这是核心变现放贷客群
        - 借款人数量、单笔规模和地域拆分未披露
