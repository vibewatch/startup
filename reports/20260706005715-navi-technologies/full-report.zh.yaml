              又称公司正在与 Prosus 和 Accel Growth Fund 洽谈 $250-300 million 融资，投后估值 $1.8-2.0 billion。Hurun 2025 年独角兽认定确认 Navi
              跨过 $1 billion 门槛，但该认定本身不能验证完整的 2026 年洽谈区间。实际结论是，当前最有支撑的估值标记，是围绕最新报道洽谈锚定的一条区间，而不是已证明成交的估值。
