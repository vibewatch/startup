      - number: '1.4'
        title: 里程碑、监管事件与合作基础设施
        blocks:
          - type: paragraph
            body: >-
              里程碑轨迹重要，因为它同时显示了野心和脆弱性。Navi 2022 年 9 月获得 SEBI 批准，可推进 Rs 3,350 crore IPO，但发行从未启动。2024 年 10 月，RBI 命令 Navi
              Finserv 停止批准和发放新贷款，央行和 ET Legal 均把行动与过高定价及更广泛的监管担忧联系起来。公司改造流程并承诺持续合规后，RBI 于 2024 年 12 月解除限制；Bansal
              后来称，监管要求上升也是他在 2025 年调整角色的原因之一。这条时间线构成尽调故事的核心：Navi
              不只是扩产品，也是在高强度监管注视下扩规模。运营侧，官方披露显示其机构化基础设施强于典型创业公司。当前联合贷款伙伴包括 Aditya Birla Capital、Kisetsu Saison、Tata
              Capital 和 TVS Credit；DLA 披露确认 navi.com/pl 和 navi.com/hl 是自有贷款渠道；DLG 披露显示，担保关联组合敞口在 2024 年 12 月至 2026 年 6
              月之间大幅增长。综合来看，这是一家确有基础设施和分发深度的公司，但仍需证明治理质量、披露深度和估值叙事能够持续跟上它的规模野心。
