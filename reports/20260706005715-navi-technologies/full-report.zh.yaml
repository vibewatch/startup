  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性估值区间（USD B）
      - 概率信号
      - 需要成立的条件
    rows:
      - - 悲观
        - 轮次延后，市场把 Navi 定价得更接近贷款机构 / 刚过独角兽门槛的可比公司，监管或信贷担忧占上风
        - 1.2-1.5
        - 下行情景可信，因为 Hurun 只证明 >$1B，且新股权融资尚未交割
        - 要脱离该区间，需要没有新限制，并拿出更强 FY26 信贷证据
      - - 偏低基准
        - Navi 保持运营动能，但投资人仍因不透明和依赖债务要求折价
        - 1.6-1.8
        - 若轮次不能快速交割但业务质量保持稳定，该情景合理
        - FY26 收入和信贷表现必须稳住，且不能再有监管意外
      - - 基准
        - Prosus / Accel 或类似投资人按最新洽谈区间附近、以普通条款完成融资
        - 1.8-2.0
        - 这是目前锚定最强的公开证据
        - 已签投资条款清单和募资用途细节会把洽谈变成可承销证据
      - - 乐观
        - 多产品金融科技溢价叙事胜出，投资人奖励规模、宽度和扩张选择权
        - 2.2-2.8
        - 有可能，但公开材料尚未证明
        - 需要干净的轮次经济条款，以及已披露的 FY26 增长、利润率和信贷指标
    notes: 区间是情景带，不是已成交估值；锚点来自 2026 年洽谈区间、Hurun 的独角兽底线和公开可比公司的离散度，而不是完整内在价值模型。
