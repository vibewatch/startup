  - id: TP005
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 影响 / 尽调追问
    rows:
      - - 支付分发可保护 Navi 交叉销售
        - PhonePe 和 Paytm 披露了更宽的消费者交易漏斗
        - 高
        - PhonePe 声称覆盖印度三分之一人口；Paytm 有大众支付触点
        - 需要 Navi KPI 证明自有支付习惯足够大，能低成本导流贷款和财富业务
      - - 贷款速度可抵消缺少大规模日用分发的短板
        - Bajaj、HDFC、ICICI、KreditBee 和 BankBazaar 让价格与速度很容易横向比较
        - 高
        - 多家贷款方页面公开利率、额度和数字化承诺
        - 按客群索取 Navi 真实审批速度、复借表现和 APR 竞争力
      - - 财富交叉销售可在不承担资产负债表风险的情况下改善 LTV
        - Groww 和 Paytm Money 已披露更清晰的交易和定价界面
        - 中
        - Groww 和 Paytm Money 定价页，加上 TechCrunch 规模数据
        - 需要证明 Navi 共同基金交叉销售能以有意义规模转化
      - - 保险分发可加深钱包份额
        - Policybazaar 和 PB Fintech 在结账前掌握由比价驱动的意向捕获
        - 中
        - IRDA 批准的经纪模式，加上 50+ 保险公司合作和高吞吐
        - 需要证明 Navi 不靠市场平台式获客漏斗也能赢下分发
      - - 若经济性保持强劲，合作伙伴主导贷款已足够
        - Moneyview 和 KreditBee 表明，应用优先的贷款专门公司仍可激进扩张
        - 高
        - Moneyview IPO 指标，以及 KreditBee 估值 / 盈利披露
        - 在称 Navi 贷款护城河耐久前，需要资产质量和融资成本数据
      - - 银行牌照可比单纯合作分发形成更深护城河
        - slice 现在把支付、存款和信贷装进 SFB 壳
        - 高
        - NESFB 合并、回购利率挂钩储蓄和盈利证据
        - 需要厘清 Navi 能否匹配类似的融资和监管控制力
      - - 公开披露本身也能成为信任护城河
        - Groww、PB Fintech 和 Paytm 披露的上市公司式细节都多于私营金融科技同业
        - 中
        - 投资者关系触点和公开财务节奏
        - 需要更新 Navi 披露包或 DRHP 式指标，以缩小信任差距
      - - 规模化金融科技企业仍有充足资本可用
        - slice 估值重置和 PhonePe 估值争议显示，资本如今更挑剔
        - 中
        - PhonePe IPO 估值报道互相冲突；slice 估值下调报道
        - 需要证明 Navi 可在更挑剔的市场中以有利条款融资或再融资
    notes: 严重性取决于保留公开证据显示各威胁能多直接地挤压 Navi 的获客经济性、承保信心或消费者信任。
