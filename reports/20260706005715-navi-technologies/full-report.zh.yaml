  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客群结构与目标用户
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Navi 更像一个面向消费者的金融科技超级 app，而不是单一产品贷款机构。最直接的证据来自 Navi 自己的首页和应用商店列表，二者持续展示同一组核心产品：UPI
              支付、贷款、保险、共同基金、数字黄金、账单和充值。这种宽度很重要，因为 Navi 可以先拿下一个印度零售用户，再沿相邻金融需求扩大钱包份额。已验证客群不是高端小众。GripInvest 称 Navi
              Finserv 服务城市中等收入借款人；Forbes 则把这款应用描述为面向财务独立用户，并强调贷款资格门槛，例如收入高于 Rs. 3 lakh、CIBIL 较强。价格信号也偏大众市场：健康保险每月 ₹350
              起，共同基金 ₹100 起，黄金 ₹50 起。因此，证据支持 Navi 面向广泛印度零售和中等收入人群；用户提出的“服务不足的中产阶层”方向上可信，但公开披露并未明确量化。
