        title: 客户信任、隐私与运营风险
        blocks:
          - type: paragraph
            body: >-
              客户信任风险层次异常复杂，因为 Navi 的公开政策姿态既宽又敏感。其隐私政策允许在取得同意后收集
              KYC、银行、收入、SMS、位置和电话簿联系人数据，并称联系人数据可用于丰富财务画像和识别欺诈。这可能改善承销和反欺诈，但当客户已经在公共论坛指称骚扰或触达联系人列表时，容错空间会很窄。Moneycontrol
              报道过借款人电话簿被用于向熟人施压的指称，投诉板式来源也显示用户围绕骚扰和征信报告反复投诉。2026 年 RBI 催收处罚，是严肃看待这些问题的最强理由。运营上，支付栈也暴露出脆弱性：The Hindu
              报道称，一起与 TPAP 支付网关漏洞有关的 ₹14.26 crore
              欺诈表明，即便不在核心贷款业务内，伙伴流程失败也会造成直接损失和声誉伤害。混合的法律结果和官方申诉渠道提供了缓释证据，但不能消除剩余的信任敏感性。
