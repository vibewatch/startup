- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - UPI inside the same app
    - Merchant and P2P mix are undisclosed
    - Payments can be a daily-use wedge, but monetization quality is hard to judge without mix data
    - Request unique UPI users, merchant acceptance points, merchant GPV, and P2P-versus-merchant split
  - - Low-ticket insurance and investing entry points
    - Renewal and persistence are undisclosed
    - These products can widen wallet share beyond credit if renewals and SIP persistence hold
    - Request product-level attach, renewal, SIP continuation, and contribution-margin data
  - - Referral program plus lower CAC at scale
    - No disclosed CAC by product or cohort
    - Public evidence suggests cheaper acquisition, but not the quality or payback of acquired cohorts
    - Request CAC, payback, and LTV by acquisition channel and product entry point
  - - Pre-approved repeat loans
    - About 89% of AUM remains unsecured personal loans
    - Repeat borrowing may be efficient, but the platform is still concentrated in one credit engine
    - Request repeat-borrower default curves and product-level revenue diversification plans
  - - Retail model limits single-logo risk
    - Top-customer concentration and attach-rate are not public
    - Account concentration may be low, yet channel and product concentration could still be meaningful
    - Request channel concentration, top-partner dependence, and multi-product penetration by cohort
  notes: Rows separate visible expansion levers from unresolved concentration math; product breadth is public, but cohort economics are not.
