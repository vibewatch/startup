chapter:
  number: 6
  title: Customers
  summary: 'Navi''s public customer proof is strongest on top-of-funnel retail reach: Google Play showed 10Cr+ installs and 58.7L reviews, Apple showed 237k ratings, and Entrackr reported 406 million June 2025 UPI transactions. The evidence supports a broad Indian retail and urban middle-income borrower focus with real cross-sell surfaces, but retention, merchant mix, and attach-rate disclosure remain thin while complaint forums and RBI action show meaningful trust and servicing risk.'
sections:
- id: segment-mix-and-target-user
  title: Segment mix and target user
  body: 'Public evidence points to Navi as a consumer-fintech superapp rather than a single-product lender. The strongest direct proof comes from Navi''s own homepage and app-store listings, which consistently show the same core bundle: UPI payments, loans, insurance, mutual funds, digital gold, bills, and recharges. That breadth matters because it positions Navi to acquire one Indian retail user and then expand wallet share across adjacent financial needs. The verified segment is not a premium niche. GripInvest describes Navi Finserv as serving urban middle-income borrowers, while Forbes frames the app for financially independent users and highlights loan-eligibility guardrails such as income above Rs. 3 lakh and strong CIBIL. The affordability cues are also mass-market: health insurance from ₹350 per month, mutual funds from ₹100, and gold from ₹50. The evidence therefore supports broad Indian retail and middle-income positioning, while the user-requested phrase underserved middle class
    is directionally plausible but not explicitly quantified in public disclosures.'
