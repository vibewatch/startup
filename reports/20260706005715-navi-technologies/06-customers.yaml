- id: adoption-acquisition-and-usage-proof
  title: Adoption, acquisition, and usage proof
  body: 'Navi has stronger public proof on acquisition and transaction reach than on monetized customer durability. On Android, Google Play showed 10Cr+ downloads, 58.7L reviews, and a 4.3 rating on the run date; Apple''s India App Store showed 237k ratings and a 4.5 score. Those are meaningful proof points that the app has reached production-scale consumer usage, even if storefront totals do not equal active customers. Independent reporting adds another usage layer: Entrackr reported that Navi ranked fourth among UPI apps in June 2025 and processed 406 million transactions worth Rs. 21,815 crore that month. Public acquisition mechanics are also visible. The app surfaces a referral program, while India Ratings says customer acquisition cost fell as scale increased and that UPI traction brought new users into the platform for cross-selling. Together, the evidence supports a real acquisition engine and payments-led funnel, but it still leaves unanswered how many of those users become profitable
    repeat borrowers, policyholders, or investors.'
