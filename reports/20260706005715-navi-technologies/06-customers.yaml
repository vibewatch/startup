tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / strategic value
  - Gap / caveat
  rows:
  - - Broad Indian retail app users
    - Buyer, user, and payer are usually the same consumer
    - UPI, bills, recharge, loans, insurance, investments, gold
    - High strategic value because one app can widen wallet share across daily and episodic finance
    - No public active-customer denominator by product
  - - Urban middle-income borrowers
    - Borrower and payer are the same retail consumer
    - Personal loans and home loans through the app
    - Core monetized lending segment per GripInvest and official lending surfaces
    - Borrower-count, ticket-size, and geography splits are undisclosed
  - - Financially independent salaried / strong-credit applicants
    - Borrower and payer are the same user
    - App-based loan application with income and CIBIL gating described by Forbes
    - Signals Navi is not purely subprime; can underwrite toward cleaner retail credit cohorts
    - Eligibility detail is from a review article, not a current official underwriting sheet
  - - Insurance households
    - Policyholder pays for individual or family health cover
    - Low-ticket health cover inside the same app
    - Cross-sell path into a stickier protection product with hospital-network utility
    - Renewal, claim-frequency, and persistency data are not public
  - - First-time or low-ticket investors
    - Investor and payer are the same user
    - SIPs from ₹100 and digital gold from ₹50
    - Supports middle-class affordability and non-credit wallet share
    - No disclosed customer mix between investors, borrowers, and payers
  - - Payments users with merchant surface
    - Payer is the consumer; merchant or biller is the counterparty
    - Scan-and-pay at stores, UPI transfers, and online checkout
    - Could be the widest acquisition surface and a feeder for cross-sell
    - No merchant count, merchant GPV, or merchant-versus-P2P split
  notes: Rows synthesize direct product pages, app-store copy, and third-party lending commentary; missing cohort counts remain explicit gaps.
