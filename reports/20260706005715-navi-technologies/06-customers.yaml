- id: TU003
  title: Named customer proof table
  columns:
  - Customer / cohort
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / signal
  - Limitation
  rows:
  - - Ajeesh Joseph (Google Play reviewer)
    - Retail borrower or app user
    - Used Navi Finserv enough to comment on fees and process
    - Production consumer usage, not a pilot
    - Said Navi was initially user-friendly and differentiated by zero processing fees, then became less favorable after fees appeared
    - Single storefront review; identity and broader representativeness cannot be verified
  - - Santhini Kodeboyina (Consumer Complaints Court)
    - Lead / borrower disputing credit process
    - Alleged credit enquiries without consent
    - Production credit interaction is implied by the complaint
    - Negative trust signal around consent and bureau pulls
    - Self-published complaint; no adjudicated outcome disclosed
  - - Rachna and similar delayed-EMI complainants (Consumer Complaints Court)
    - Personal-loan borrowers in distress
    - Collections and servicing after missed EMI
    - Production borrower relationship, not a pilot
    - Complaints allege threatening calls, misuse threats, and disrespectful servicing behavior
    - Complaint forum evidence is adverse by nature and can overrepresent failures
  - - Apple App Store ratings cohort
    - iPhone retail consumers
    - Ongoing multi-product app usage
    - Production use at scale
    - 237k ratings and a 4.5 score show a large visible satisfaction surface
    - Aggregate cohort proof, not a named reference customer or a retention cohort
