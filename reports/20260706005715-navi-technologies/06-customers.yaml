  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-proof-gap
    missingEvidence: Named customer references outside storefront reviews and complaint forums, including verified borrower, policyholder, investor, and UPI user interviews.
    whyItMatters: The current public proof shows production usage but is skewed toward app-store aggregates and complaint channels, which cannot validate durability or customer outcomes across healthy cohorts.
    diligencePath: Request anonymized but auditable customer reference calls split by loans, insurance, UPI, and investments, plus cohort-level case studies with tenure and product usage.
    relatedQuestionRefs:
    - QU013
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gaps
    missingEvidence: Product-level churn, renewal, repeat-borrowing cohorts, NRR/GRR, and active-user counts for each major product line.
    whyItMatters: Storefront ratings and pre-approval share do not substitute for true retention math, making durability impossible to underwrite from public evidence alone.
    diligencePath: Ask management for monthly active customers, 3/6/12-month repeat usage cohorts, insurance renewal rates, investment SIP persistence, and delinquency/roll-forward cohorts.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: merchant-gap
    missingEvidence: Merchant count, merchant-versus-P2P transaction mix, merchant GPV, and online-versus-offline UPI usage for Navi.
    whyItMatters: Navi clearly has a merchant payment surface, but without mix data investors cannot tell whether payments is a deep daily-use habit or mostly a consumer transfer utility.
    diligencePath: Request NPCI-facing internal dashboards or audited management metrics showing merchant acceptance points, QR usage, checkout volumes, and payer retention.
    relatedQuestionRefs:
    - QU019
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Public disclosure of channel concentration, product attach rates, revenue mix by product, and whether any partner or borrower cohort dominates incremental volume.
    whyItMatters: Retail models can avoid single-logo concentration while still carrying meaningful concentration in one product, one acquisition channel, or one borrower quality band.
    diligencePath: Request product-level revenue, AUM, repeat-user, and acquisition-channel dashboards plus channel CAC/LTV and cohort default statistics.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU025
    relatedTableRefs:
