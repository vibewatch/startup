  topStrengths:
    - 放贷、UPI、保险和共同基金构成受监管的全栈产品宽度，漏斗比单一产品贷方更宽。
    - 官方和评级机构披露支撑真实规模，包括 FY25 管理 AUM 超过 ₹115 billion，并持续进入有评级债务市场。
    - 分发证明有分量：Google Play 安装量 10Cr+，生态月用户 21 million，2025 年 6 月 UPI 交易 406 million 笔。
    - 管理层仍由创始人锚定，2025 年重组显示公司有意把放贷与非放贷业务专业化拆分。
  topRisks:
    - RBI 已在 2024 年 10 月叫停新增放贷，并在 2026 年处罚催收代理行为，说明合规复发风险不低。
    - 合并口径财务质量、客户活跃度、产品级利润率，以及 holdco 层面的董事会或委员会治理，公开披露仍薄。
    - 最新 $1.8-2.0 billion 股权信号仍是讨论区间，不是已交割融资；相比之下，债务资金的证据清楚得多。
    - 客户信任风险真实存在：投诉论坛、定价不满和催收相关指控，仍与 app 规模增长并存。
    - 放贷账簿仍高度暴露于无抵押个人贷款，信用成本和融资市场冲击因此格外关键。
  unresolvedGaps:
    - 已签署的 2026 年股权轮条款、更新后股权结构表，以及新投资人的任何清算或治理权。
    - FY26 YTD 合并收入、利润，以及放贷、UPI、保险、财富业务之间的产品级利润率桥。
    - 整改后的信用 vintage 表现、催收结果和当前逾期曲线。
    - 按产品线披露的活跃客户、活跃借款人、商户数、留存和 attach rate。
    - 完全对齐的创立和集团治理时间线，包括 holdco 董事会委员会和独立监督。
