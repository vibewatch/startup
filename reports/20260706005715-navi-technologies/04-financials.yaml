callouts:
- calloutType: risk
  title: FY24 profit optics were flattered by non-core gains
  body: The public record consistently shows that FY24 profit was boosted by Chaitanya-sale gains and elevated other income. That makes the FY24-to-FY25 profit drop more of a normalization story than a simple collapse in operating scale.
  claimRefs:
  - CI020
  - CI048
  - CI050
- calloutType: risk
  title: RBI challenged economics and controls, not just growth pace
  body: The regulator explicitly cited excessive pricing spreads, evergreening-related IR&AC issues, disclosure lapses, and outsourcing concerns. That moves the key diligence question from mere growth slowdown to whether post-remediation yields are cleaner and more sustainable.
  claimRefs:
  - CI034
  - CI035
  - CI046
  - CI053
- calloutType: insight
  title: Funding diversity improved, but debt dependence remains structural
  body: Navi has broadened funding across banks, NCDs, CP, co-lending, securitisation, and parent support, which is a strength. But the public file still points to a business that needs ongoing external funding rather than self-funding from retained earnings.
  claimRefs:
  - CI014
  - CI022
  - CI029
  - CI039
