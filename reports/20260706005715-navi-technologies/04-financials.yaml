- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - FY25 disbursement / managed AUM turnover
    - ~1.17x (₹134B+ disbursement divided by ₹115B+ managed AUM)
    - Medium
    - Shows a fast-rotating unsecured-heavy book rather than long-duration asset buildup
    - Provide monthly cohort-level disbursement, average tenure, and repayment speed by product
  - - FY25 finance cost + impairment burden
    - ~60.6% of FY25 revenue from operations (₹7,968.15m + ₹5,787.95m over ₹22,711.54m)
    - Medium
    - Illustrates how funding and credit costs dominate the earnings stack
    - Provide unit P&L separating funding cost, expected loss, recoveries, and opex by product line
  - - FY24 credit cost
    - 4.32% versus 5.30% in FY23
    - Medium
    - Best external proxy for loss-adjusted unit economics before the RBI event
    - Provide quarterly credit-cost bridge through FY25 and post-remediation cohorts
  - - Book mix concentration
    - Personal loans were 86.3% of AUM on 30 Nov 2024
    - Medium
    - Confirms unsecured personal credit still drives the book despite secured-product expansion
    - Disclose current secured / unsecured mix, yield, and loss by product
  - - Co-lending share
    - ₹23.58B FY25 co-lending disbursement; ₹4.53B outstanding
    - Medium
    - Shows a capital-efficiency lever that may moderate on-book growth and funding needs
    - Share partner list, take rates, and profitability versus on-book lending
  - - Securitised pool performance
    - ICRA June 2025 pool showed 90.8% cumulative collection efficiency and 8.5% loss-cum-90+ DPD
    - Medium
    - Independent check on collections and loss absorption in a personal-loan pool
    - Provide static-pool tables for the broader on-book portfolio, not only securitised pools
  - - Public efficiency proxy
    - Entrackr estimated FY24 spend of ₹0.92 and FY25 spend of ₹1.06 per ₹1 of operating revenue
    - Low
    - Useful directional sign that normalized profitability worsened as one-offs faded
    - Provide management-definition contribution margin, CAC payback, and operating leverage bridges
  notes: Several rows are analytical proxies built from public disclosures rather than management-defined KPIs; they should be treated as directional rather than audited unit-economics metrics.
