- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The verdict is that Navi Finserv looks commercially real, balance-sheet intensive, and still not fully underwritable from public data alone. Positives are substantial: the lending arm remained profitable in FY25, capital ratios stayed comfortably above 25%, funding channels span banks, NCDs, CP, co-lending, and securitisation, and the company recovered quickly enough from the RBI pause to regain rating stability and resume disbursements. The negatives are equally material: FY24 profit optics were flattered by Chaitanya-sale gains; FY25 group profitability turned negative; personal loans remain the dominant book; and the regulator explicitly challenged pricing fairness, evergreening controls, and disclosure discipline. An investor can reach a directional conclusion that Navi has scale, funding access, and underwriting machinery. What public evidence still does not provide is the post-remediation yield stack, segment profitability by product rail, vintage loss behaviour after October
    2024, or a parent-level cash runway bridge. Until those are disclosed, Navi merits a cautious research-more financial stance rather than clean underwriting conviction.'
