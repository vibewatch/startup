- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Interest income
    - Yield on personal loans, home loans, LAP, and other financing assets
    - ₹ million
    - FY25 interest income ₹19,810.46; FY24 ₹16,111.18
    - High for scale, medium for mix
    - Break out yield and balances by personal loan, home loan, LAP, and co-lending cohorts
  - - Fees and commission
    - Origination and ancillary fee income on lending products
    - ₹ million
    - FY25 fees and commission income ₹802.51; FY24 ₹703.39
    - Medium
    - Disclose fee mix by product, fee caps, waiver rates, and post-RBI pricing changes
  - - Fair-value and derecognition gains
    - Accounting gains on financial instruments and loan transfers
    - ₹ million
    - FY25 fair-value plus derecognition gains ₹2,098.57; FY24 ₹2,247.72
    - Medium
    - Show recurring versus opportunistic transfer gains and the economics retained after sale or assignment
  - - Other income / exceptional items
    - Non-operating or disposal-linked income at NFL / group level
    - ₹ million
    - NFL other income fell from ₹7,079.98 in FY24 to ₹187.56 in FY25; FY24 benefited from Chaitanya disposal gain
    - Low for recurring underwriting
    - Separate one-time gains from operating earnings in every public bridge
  - - UPI, ads, insurance, AMC cross-sell
    - Group-level ecosystem monetisation outside the core lending P&L
    - Status
    - Product breadth and a FY2026 ads monetisation plan are public, but no segment revenue is disclosed
    - Low
    - Provide segment revenue, gross profit, and cross-sell contribution by business line
  notes: Official filings reveal the major lending-led revenue buckets, but not the product-level mix or the share of non-lending ecosystem revenue inside the group.
