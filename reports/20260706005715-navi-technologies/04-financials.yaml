  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-pricing-after-remediation
    missingEvidence: Realized APR, fee incidence, waivers, and net yield by product and origination cohort after the December 2024 remediation.
    whyItMatters: RBI explicitly challenged pricing fairness and disclosure quality, so list APR ceilings cannot be used as underwriting yield assumptions.
    diligencePath: Request monthly pricing and yield waterfalls by product, borrower cohort, and origination quarter from October 2024 onward, with board-approved pricing-policy changes highlighted.
    relatedQuestionRefs:
    - QI004
    - QI011
  - type: private-evidence-only
    severity: material
    topic: group-cash-runway
    missingEvidence: Monthly cash burn, unrestricted cash, intercompany balances, debt maturities, and a 12-month runway bridge for the parent and major subsidiaries.
    whyItMatters: The public file gives snapshots of cash or liquidity but does not show whether the group can self-fund growth, absorb shocks, and service holdco obligations without new capital.
    diligencePath: Obtain treasury reporting packs, ALM statements, and board-approved liquidity plans for Navi Limited and Navi Finserv.
    relatedQuestionRefs:
    - QI021
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: Segment revenue, gross profit, opex, and capital usage for lending, payments, insurance, AMC, and ads.
    whyItMatters: Without segment economics, investors cannot tell whether group optionality outside lending is accretive, dilutive, or merely narrative support for the lending engine.
    diligencePath: Request audited management-segment schedules and monthly MIS bridges that reconcile segment metrics to statutory financials.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: post-rbi-vintage-performance
    missingEvidence: Static-pool vintages, roll rates, recoveries, and write-off curves for loans originated before and after the October 2024 RBI order.
    whyItMatters: Aggregate GNPA and one securitised-pool update do not show whether remediation improved underwriting quality or simply slowed origination.
    diligencePath: Request quarterly vintage tables with 30+ / 90+ / write-off migration, recoveries, and restructuring flags for every major product cohort.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: underwriting-pack-minimum
    missingEvidence: A reconciled underwriting pack covering realized pricing, cost of funds, segment economics, liquidity runway, and post-remediation asset quality.
    whyItMatters: Public disclosures are enough for directional judgment but not enough to size normalized earnings power, capital adequacy, or downside resilience with underwriting-grade confidence.
    diligencePath: Ask for board packs, ALM, asset-quality MIS, lender deck, rating presentations, and a management Q&A focused on post-October 2024 economics.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005
