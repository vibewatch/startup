- id: TI004
  title: Capital adequacy table
  columns:
  - Funding / capital item
  - Public value / status
  - Why it matters
  - Source basis
  - Diligence ask
  rows:
  - - FY25 debt-market fundraise
    - Management cited ₹72,687m raised from debt markets in FY25
    - Shows continued market access despite regulatory disruption
    - Navi Limited annual report
    - Reconcile gross issuance, net increase in borrowings, and maturities by instrument
  - - FY25 gross financing flows
    - Debt securities proceeds ₹22,321.70m; other borrowings proceeds ₹49,472.22m
    - Confirms reliance on external funding rather than retained earnings alone
    - Navi Finserv FY25 results
    - Provide weighted average cost, tenure, and secured / unsecured split by channel
  - - Listed NCD protection
    - Company said listed NCDs maintained 100% security cover and proceeds were used as stated
    - Important for retail-debt confidence and refinancing capacity
    - FY25 results plus prospectus pack
    - Provide security pool composition and cushion by listed series
  - - Public NCD issue terms
    - FY24 public issue was ₹300 crore base plus ₹300 crore greenshoe; at least 75% for onward lending / repayment of existing borrowings and up to 25% for GCP
    - Defines how retail debt supports growth and refinancing
    - Official NCD page, prospectus, and trust issue sheet
    - Disclose actual series-wise coupons and investor mix
  - - Late-2024 funding mix
    - Total debt ₹7,391 crore; bank term loans 29.7%; NCDs 26.1%; CP 6.4%; parent NCD funding 4.1%
    - Shows improving diversity but continued market-debt dependence
    - CARE December 2024 note
    - Provide current FY26 mix and post-RBI refinancing trends
  - - Liquidity and buffers
    - Unencumbered liquidity ₹1,329 crore on 5 Dec 2024; CAR 30.5% in FY25 management summary and 26.11% on 30 Sep 2024 in CARE/BSE data
    - Supports short-term solvency through the restriction window
    - CARE, annual report, and BSE filing
    - Provide monthly liquidity ladder, ALM gaps, and minimum liquidity policy
  - - Parent and founder support
    - Holdco disclosed ₹3,500m unsecured founder term loan, ₹2,500m holdco NCD issuance, and annual return showed ₹2,500m NCD outstanding with 867 debenture holders
    - Shows support capacity but also complexity at holdco level
    - Annual report and annual return
    - Provide full related-party terms, maturities, and upstream/downstream cash-flow map
  notes: 'Capital adequacy is stronger than disclosure quality: leverage, liquidity, and debt access are visible in fragments, but investors still do not get a single reconciled funding waterfall across holdco and lending subsidiary.'
