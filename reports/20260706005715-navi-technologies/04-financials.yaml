- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric / disclosure
  - Impact on underwriting
  - Exact diligence path
  - Current public signal
  - Severity
  rows:
  - - Realized APR and fee yield after RBI remediation
    - Cannot judge whether listed APRs translate into compliant, sustainable realized yield
    - Request monthly yield bridge by product, borrower cohort, and origination quarter from Oct 2024 onward
    - Only list pricing is public; RBI explicitly challenged pricing and fee disclosures
    - Material
  - - Channel-level cost of funds
    - Cannot determine whether NCDs, CP, banks, co-lending, or securitisation are accretive
    - Request borrowing book by channel with rate, tenor, hedging, and encumbrance data
    - Gross funding flows are public, blended cost is not
    - Material
  - - Segment revenue and margin split
    - Cannot tell how much profit comes from lending versus UPI, AMC, insurance, or ads
    - Request audited segment schedule with revenue, gross profit, opex, and capital usage by line
    - Official results remain one-segment financing disclosures
    - Material
  - - Post-RBI vintages, roll rates, and recoveries
    - Cannot test whether remediation improved borrower quality or only paused growth
    - Request static-pool tables, roll-rate matrices, recoveries, and write-off vintages for post-Oct 2024 cohorts
    - Only aggregate GNPA/NNPA and one securitised-pool report are public
    - Material
  - - Group cash burn and runway
    - Cannot underwrite holdco resilience after the FY25 group loss
    - Request monthly treasury, unrestricted cash, intercompany balances, and 12-month runway bridge
    - Third-party sources provide cash snapshots, not a runway bridge
    - Material
  - - Related-party and founder funding terms
    - Cannot judge refinancing risk or upstream cash leakage at holdco level
    - Request signed term sheets, maturity schedule, and covenant package for founder and parent funding
    - Public filings reveal amounts but not full economics
    - Minor
  notes: These are genuine public-data gaps rather than author omissions; most of them matter because the RBI episode made pricing, disclosure quality, and post-remediation asset performance part of the underwriting case.
