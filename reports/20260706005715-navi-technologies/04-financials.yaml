- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / rail
  - Published price / unit / contract
  - List vs realized
  - Why it matters
  - Source basis
  - Open issue
  rows:
  - - Cash / personal loan
    - Up to ₹20 lakh; rates up to 29.96%; tenure up to 84 months; zero foreclosure
    - List pricing only
    - Defines the customer-facing yield ceiling on the flagship unsecured product
    - Current Navi Finserv product page
    - Need realized APR, fee incidence, waiver behavior, and yield by borrower cohort after remediation
  - - Home loan
    - Up to ₹5 crore; rates up to 20%; tenure up to 30 years; LTV up to 90%
    - List pricing only
    - Shows the secured-lending expansion path and potentially lower-risk mix
    - Current Navi Finserv product page
    - Need realized spreads, disbursal mix, and vintage loss performance
  - - Loan against property
    - Rates up to 22%; tenure up to 20 years; LTV up to 70%
    - List pricing only
    - Indicates willingness to broaden beyond pure unsecured personal loans
    - Current Navi Finserv product page
    - Need disclosed balances, customer profile, and contribution margin
  - - Public NCD funding
    - Secured listed NCD structure; FY24 public issue base ₹300 crore with ₹300 crore greenshoe
    - Capital-side monetisation / funding cost, not customer pricing
    - Retail debt access affects funding cost and refinancing flexibility
    - Official NCD page, prospectus, and trust issue sheet
    - Need coupon ladder, actual allotment by series, and blended post-tax funding cost
  - - UPI / ads / ecosystem rails
    - No public take rate or segment pricing disclosed
    - Undisclosed
    - Important because management is using UPI and ads as a funnel and monetisation layer around lending
    - Annual report and official web surfaces
    - Need revenue contribution, attach rate, and unit economics outside lending
  notes: Rows distinguish customer-facing list APRs from funding instruments and undisclosed ecosystem monetisation so public list pricing is not mistaken for realized yield.
