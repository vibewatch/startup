- id: funding-ncds-and-capital-structure
  title: Funding, NCDs, and Capital Structure
  body: 'Navi’s lending model is clearly debt-funded rather than equity-light. The FY25 results show ₹22.32 billion of proceeds from debt securities and ₹49.47 billion of other borrowings during the year, broadly matching management’s statement that Navi Finserv raised ₹72.687 billion from debt markets. The same filing says listed NCDs had 100% security cover and no material deviation in use of proceeds. CARE describes a diversified late-2024 funding stack: total debt of ₹7,391 crore, bank term loans at 29.7% of borrowings, NCDs at 26.1%, CP at 6.4%, and parent-company NCD funding at 4.1%. Public NCD issuance remains meaningful. The February 2024 issue was a ₹300 crore base with a ₹300 crore greenshoe, secured, marketed at CRISIL A/Stable, and structurally earmarked at least 75% for onward lending or refinancing. At the parent level, Navi Limited’s annual return still showed ₹2.5 billion of NCDs outstanding at FY25-end, while the annual report disclosed an additional ₹3.5 billion unsecured
    term loan from Sachin Bansal and ₹2.5 billion of holdco NCD issuance for general corporate purpose.'
