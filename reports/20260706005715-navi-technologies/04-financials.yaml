- id: book-growth-asset-quality-and-unit-economics
  title: Book Growth, Asset Quality, and Unit-Economics Proxies
  body: 'NFL still scaled materially. Management disclosed FY25 managed AUM above ₹115 billion, disbursements above ₹134 billion across 1.36 million loans, personal loans above ₹102 billion, and home loans above ₹14 billion. CARE’s December 2024 note adds that active customers were 13.5 lakh by June 2024, AUM had reached ₹12,662 crore by September 2024, and personal loans were 86.3% of AUM by November 2024 despite the RBI pause. That mix matters because current list pricing is visible—cash or personal loans up to ₹20 lakh at rates up to 29.96%, home loans up to 20%, and LAP up to 22%—but realized yield after pricing remediation is not. Public unit-economics proxies are therefore indirect: FY24 credit cost was 4.32%, FY25 finance cost plus impairment consumed roughly 61% of reported operating revenue, FY25 co-lending disbursement was ₹23.58 billion, and ICRA’s June 2025 personal-loan securitisation update still showed 90.8% cumulative collection efficiency with 8.5% loss-cum-90+ DPD.'
