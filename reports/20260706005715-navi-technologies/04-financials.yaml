- id: regulatory-and-disclosure-quality
  title: Regulatory and Disclosure Quality
  body: The October 2024 RBI action is the core adverse fact in this chapter because it went beyond a temporary growth interruption. RBI said Navi Finserv’s weighted average lending rate and spreads over cost of funds were excessive, then added concerns on income assessment, repayment-capacity tests, IR&AC deviations resulting in evergreening, interest-rate and fee disclosures, and outsourcing of core financial services. CARE put its A1 CP on watch with developing implications, while Business Standard reported CRISIL placing Navi on watch negative. Restrictions were lifted on 2 December 2024 after revamped processes and repeated interactions, but the episode leaves a disclosure overhang because public investors still do not see the before-and-after economics of remediation. That concern is reinforced by a November 2024 BSE clarification that corrected Gross Stage 3 to 2.04% from 2.06% and Net Stage 3 to 0.34% from 0.13%. Navi’s public IR footprint is real—annual reports, results, prospectuses,
    and regulatory filings are available—but the landing pages are thin and the entity scopes shift between holdco, NBFC, and disposed businesses, which makes casual headline comparison dangerous.
  claimRefs:
