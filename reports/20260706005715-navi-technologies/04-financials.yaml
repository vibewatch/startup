company:
  name: Navi Technologies
chapter:
  number: 4
  title: Financials
  summary: Public evidence shows Navi Finserv remained operationally profitable in FY25—₹22.7 billion of revenue from operations and ₹2.22 billion of PAT—but FY24/FY25 comparability was heavily distorted by Chaitanya-sale gains and varying entity scope. The lending arm scaled to more than ₹115 billion of managed AUM and more than ₹134 billion of annual disbursements while leaning on debt markets, co-lending, securitisation, and public NCDs, yet the October 2024 RBI cease-and-desist order and later NPA correction keep disclosure quality a central underwriting risk. At the parent level, Navi Limited’s FY25 PAT turned negative despite stable AUM, which means the group-level earnings picture is weaker than the lending-subsidiary optics alone suggest.
sections:
- id: earnings-quality-and-entity-scope
  title: Earnings Quality and Entity Scope
  body: 'The cleanest disclosed operating P&L belongs to Navi Finserv Limited rather than the parent holdco. NFL’s FY25 results show revenue from operations of ₹22.71 billion, total income of ₹22.90 billion, and profit after tax of ₹2.22 billion, versus ₹19.06 billion, ₹26.14 billion, and ₹6.69 billion in FY24. The big delta is other income: ₹7.08 billion in FY24 collapsed to ₹187.6 million in FY25, which means FY24 profit was flattered by non-core items rather than a durable improvement in lending economics. The parent-level Navi Limited annual report tells the same story from the opposite angle: group total income slipped from ₹27.94 billion to ₹26.89 billion while FY25 PAT turned to a ₹1.19 billion loss after a small FY24 profit. Third-party coverage consistently attributes the FY24 optics to the Chaitanya divestment, so any trend line has to separate recurring lending earnings from disposal-led gains and shifting entity scope.'
