    title: Market Definition Table
    columns:
      - Segment / Category
      - Included Spend / Activity
      - Excluded Spend / Activity
      - Buyer / User / Payer
      - Relevance to Navi
    rows:
      - - UPI and retail payment rails
        - UPI P2P, P2M, autopay-linked account activity, payment-habit generation, merchant/payee settlement signals
        - >-
          Cash, RTGS large-value treasury flows, card-heavy enterprise acquiring, interchange economics outside app-led
          retail
        - Buyer/user often same consumer; payer can be consumer or merchant for downstream services
        - Distribution TAM and engagement rail; not clean standalone revenue TAM because margins stay in basis points
      - - Consumer lending
        - >-
          Personal-credit journeys, app-led onboarding, digital underwriting, repeat borrower loops, merchant-loan
          adjacencies
        - Corporate lending, wholesale NBFC books, pure housing-bank economics, offline gold loans
        - Buyer and user are borrower; payer is borrower/household cash flow
        - Core monetization pool if Navi can price risk and control CAC, collections, and capital intensity
      - - Mutual funds / passive wealth
        - SIPs, low-cost index funds, ETFs, ELSS, self-directed retail investing
        - Private-banking AUM, advisor-led HNI wealth, active AUM that does not fit Navi's disclosed passive pitch
        - Buyer/user/payer typically same retail investor
        - Visible Navi adjacency; AMFI data shows passive subset is meaningful but much smaller than total MF AUM
      - - Health insurance
        - Retail health-insurance premium, renewals, top-up/super-top-up, app-led servicing and claims support
        - Offline group-only procurement, non-health general lines, agent-led corporate insurance
        - Buyer often earning household member; users are family members; payer can be household or employer
        - Visible Navi adjacency but digitally captured premium remains small relative to headline market
      - - Consent and onboarding rails
        - Aadhaar-linked onboarding, account-aggregator consent flows, ULI-style underwriting infrastructure
        - Manual paper onboarding, purely branch-originated underwriting, non-digital data collection
        - Buyer is financial institution; user is end consumer; payer is provider/platform
        - >-
          Critical enabler of underserved-middle-class conversion, especially for thin-file lending and low-friction
          onboarding
      - - Merchant and MSME payment ecosystem
        - >-
          Merchant QR/payments acceptance, merchant subscriptions, merchant-loan funnel, MSME cash-flow signal
          generation
        - Full-stack merchant acquiring at incumbent scale, enterprise POS procurement, non-digital collections
        - Buyer is merchant/business owner; user is business/payee; payer is merchant/borrower
        - Indirect but strategically relevant because payments activity can feed credit and cross-sell
    notes: >-
      Included-spend boundaries separate high-throughput rails from monetizable product pools. UPI is treated as habit
      and funnel infrastructure, while lending, wealth, and insurance are the revenue pools. Merchant relevance is
      indirect unless Navi discloses a scaled standalone merchant product line.
