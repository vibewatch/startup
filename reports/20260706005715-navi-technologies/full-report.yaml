      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              The defining governance event in the current public record came in February 2025. Business Standard, ET,
              News18, and Entrackr all reported that Sachin Bansal stepped down as CEO of both Navi Technologies and
              Navi Finserv and moved into an executive-chairman role, with Rajiv Naresh taking over Navi Technologies
              and Abhishek Dwivedi taking over Navi Finserv. ET and Entrackr make the remit split explicit: Naresh runs
              non-lending businesses such as UPI, insurance, and mutual funds, while Dwivedi owns lending. Bansal’s
              retained mandate still covers strategy, fundraising, mergers and acquisitions, compliance, and risk
              management, so the founder remains central even after delegating day-to-day operations. Official
              governance disclosure is strongest at the regulated-lender level. Navi Finserv’s board page names Bansal
              as non-executive chairman, Ankit Agarwal as non-executive director, and several experienced directors
              including Ranganathan Sridharan, Nilufer Panthaki, Arindam Ghosh, and Ashwani Kumar. That lends comfort on
              regulated-entity governance, but it does not fully solve the wider diligence question: the public
              materials still do not offer a similarly clean holdco-level board map, committee-rights summary, or
              shareholder-control description for the entire group.
