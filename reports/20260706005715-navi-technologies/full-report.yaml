      - number: '2.2'
        title: Multi-Lens Sizing — Throughput TAM, Constrained SAM, and Missing Lending Totals
        blocks:
          - type: paragraph
            body: >
              The broadest lens is payments throughput. RBI says UPI processed 22,828 crore transactions worth ₹300 lakh
              crore in CY2025, up from ₹72 lakh crore in CY2021, with 43% CAGR by value over the period. That
              establishes India as one of the world's largest digital-payments ecosystems and explains why every
              consumer fintech wants a payments or bank-account touchpoint. But the same RBI data also shows UPI is
              predominantly small-ticket, and Paytm's FY26 filings indicate that even scaled merchant payments monetize
              through basis-point margins, subscriptions, selected MDR-bearing instruments, and cross-sell. In other
              words, UPI is best treated as distribution TAM, not as a clean revenue TAM.


              The wealth lens is much narrower and more useful for Navi. AMFI's May 2026 monthly report places total
              mutual-fund industry net AUM at ₹81.58 lakh crore, but the Navi-relevant passive subset is much smaller.
              AMFI's May 2026 sub-classification report shows domestic index funds at ₹2.25 lakh crore, domestic equity
              ETFs at ₹7.60 lakh crore, and gold ETFs at ₹1.85 lakh crore. Combined, these passive or low-cost-adjacent
              segments are about ₹11.70 lakh crore, roughly 14.3% of total industry AUM. That is still large, but it is
              an order of magnitude smaller than a naïve total-AUM TAM claim and is therefore the cleaner starting point
              for Navi's mutual-fund SAM.


              Insurance shows an even sharper TAM-to-SAM compression. IRDAI records ₹1,17,505 crore of health-insurance
              premium in FY2024-25 for general and health insurers, but only 1.68% of total health premium came through
              direct online sale and only 0.05% through web aggregators. Applying those shares implies a direct-online
              premium pool of roughly ₹1,974 crore and a web-aggregator pool of only about ₹59 crore. For Navi, which
              visibly participates through a filed health-insurance product, the strategic question is not whether the
              headline health market is big; it is whether digital share can expand materially from today's tiny channel
              mix.


              Consumer lending remains the hardest vertical to size precisely from public data. RBI's Financial
              Stability Report gives structure rather than a single digital-lending TAM: personal loans are still
              dominated by housing loans (45.6% share) and other personal loans (37.3%), while NBFC upper-layer credit
              skews heavily toward retail. Peer disclosures from PB Fintech and Paytm prove that large digital-credit
              distribution can exist — PB says FY26 total loan disbursal reached ₹30,740 crore, and Paytm continues to
              scale merchant and consumer-loan distribution — but there is no equally clean official public series for
              "India digital consumer-lending originations" that isolates app-led lenders from banks, NBFCs, and offline
              channels. That gap must be preserved rather than papered over with a synthetic headline TAM.
