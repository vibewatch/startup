        title: Satisfaction, servicing, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence set is large enough that customer quality cannot be judged from app-store ratings
              alone. At the channel level, the storefront scores are positive, but the record also contains named
              complaint examples and a regulator intervention directly tied to customer-facing practices. Consumer
              Complaints Court entries allege unauthorized credit enquiries, threatening recovery behavior after delayed
              EMIs, disputed residual charges, unresolved CIBIL reporting after repayment, and repeated calls to people
              who said they never borrowed from Navi. Google Play review text from Ajeesh Joseph adds a softer but still
              useful signal that fee perceptions worsened over time. The most important adverse proof is primary-source
              regulatory action: RBI halted new Navi Finserv lending in October 2024 over pricing, fair-practice, and
              customer-service concerns, then lifted restrictions only after process remediation. Separate from credit
              servicing, Hindustan Times reported a payments bug that scammers posing as customers used to cheat Navi of
              Rs. 14.26 crore. The customer takeaway is that Navi has real scale, but trust and servicing quality remain
