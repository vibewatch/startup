            body: >-
              Navi's expansion thesis is easy to see, but its concentration math is not. The superapp structure,
              low-ticket entry products, referral mechanics, and India Ratings observation that UPI brought in new users
              for loan cross-sell all support the idea that Navi wants to turn one acquired retail customer into a
              multi-product relationship. The same agency also says about half of personal loans are pre-approved, which
              is a useful repeat-borrowing proxy. But the public record is still heavily skewed toward product breadth
              and top-of-funnel signals rather than cohort economics. India Ratings says roughly 89% of AUM was still
              unsecured personal loans as of September 2024, which implies product concentration even if single-account
              concentration is likely low in a retail model. The reviewed public sources do not disclose MAU/DAU,
              merchant count, merchant-versus-P2P mix, insurance renewals, mutual-fund retention, NRR, or attach-rate by
