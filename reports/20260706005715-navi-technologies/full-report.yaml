        title: Moat Durability and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The strongest competitor moats in this field come from one of three places: massive recurring
              distribution, explicit public-market disclosure and funding access, or direct control over regulated
              balance-sheet infrastructure. PhonePe best exemplifies the first; its disclosed user and merchant
              footprint makes it the hardest payments-and-cross-sell rival to dismiss. Groww, PB Fintech, and Paytm
              demonstrate the second, because public reporting cadence and investor scrutiny create capital-market
              discipline but also a more visible proof set for customers, partners, and recruits. slice, Moneyview,
              KreditBee, and Bajaj speak to the third bucket, whether through bank control, NBFC control, or sharply
              disclosed lending economics. The adverse evidence matters as much as the growth narrative. Paytm’s
              payments-bank licence cancellation shows how regulatory intensity can destroy optionality inside a
              consumer-finance stack. Moneyview’s IPO disclosures underscore how DLG rules, outsourcing norms, and cyber
              incidents can impair growth. slice’s valuation reset shows that even improving operating metrics do not
              guarantee premium capital access. Against that backdrop, Navi’s moat still reads more like a broad product
              menu than a clearly documented scale, capital, or licence advantage.
