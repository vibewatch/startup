  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Superapp breadth and packaging
        blocks:
          - type: paragraph
            body: >-
              Navi’s public product surface is broader than a single UPI or lending app. The company’s own About Navi
              page ties the brand to UPI, cash loans, home loans, health insurance, and mutual funds, while the current
              Android and iOS store listings package the experience as a finance superapp for paying, insuring,
              investing, and in some contexts borrowing. That breadth is real, but it is not disclosed as one clean
              software platform. The public evidence instead shows a bundle of regulated products stitched together
              behind one consumer brand. Lending is surfaced through Navi Finserv and dedicated lending application
              pages; insurance has its own trust and policy surfaces; mutual funds have a substantial document center
              and formal AMC stack. Even the UPI page extends beyond simple payments into UPI Lite,
              RuPay-credit-card-on-UPI behavior, and Navi Trezo pay-later language. The reader should therefore
              underwrite a broad product catalogue with a unifying front-door experience, not a fully transparent
              monolithic architecture.
