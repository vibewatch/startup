      - number: '5.4'
        title: Trust, security, and compliance controls
        blocks:
          - type: paragraph
            body: >-
              Trust surfaces are strongest where regulation forces disclosure. Insurance is the best example: Navi
              exposes policy-number verification, IRDAI registration information, a public-disclosure page, a
              board-approved policyholder-interest document, and customer-facing cyber-security guidance. Lending also
              exposes named grievance officers and, more importantly, has already been through public RBI enforcement
              and remediation around fair pricing and digital-lending controls. UPI and the general app terms disclose
              transaction-history access, warnings around PIN and OTP compromise, and extra authentication or
              cooling-off measures after suspicious events such as SIM swaps or device changes. Apple’s privacy labels
              add another layer by showing how much personal and financial data may be linked to a user. The limitation
              is that most of these controls prove governance and policy hygiene, not runtime quality. Navi publicly
              discloses customer-behavior guidance and legal obligations much more readily than operational SLAs, fraud
              rates, outage history, or module-level error handling.
