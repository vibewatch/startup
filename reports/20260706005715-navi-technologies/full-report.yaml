        title: Maturity, dependencies, and where disclosure remains thin
        blocks:
          - type: paragraph
            body: >-
              Navi’s strongest publicly evidenced maturity signal is not internal architecture; it is external operating
              breadth. AppBrain reports very large Android distribution, the app stores show current multi-product
              merchandising, and the insurance and mutual-fund businesses expose more formal governance artifacts than
              many private fintechs. But that breadth sits on substantial dependencies: co-lending partners for loans,
              PSP and UPI rails for payments, insurer and hospital networks for claims, KYC or verification vendors for
              onboarding, and fund-operation infrastructure for wealth. The underwriting question is therefore not
              whether Navi has built a product bouquet; it clearly has. The harder question is whether the modules are
              deeply adopted, technically coherent, and operationally resilient enough to justify a superapp premium.
              Public evidence does not yet show attach rates, service-level attainment, underwriting-model quality, or
              cross-product feature parity at a level that would clear that bar. Product breadth is visible; durable
