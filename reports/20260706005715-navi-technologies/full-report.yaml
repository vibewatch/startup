      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The strongest growth drivers are infrastructure and distribution, not branding alone. RBI's payment-system
              data confirms that India already has national-scale digital-payment behavior, TRAI confirms that internet
              and broadband access now exceed one billion connections, and World Bank Findex confirms that account
              ownership is already high at 78% of adults. AA network scale, ULI expansion, and the FI-Index's rise to
              67.0 show that the policy stack is still pushing toward deeper financial usage. Digital India's public
              dashboard adds another important signal: Aadhaar generation and functional CSC footprint are already
              national-scale, while UIDAI's Aadhaar app download milestone suggests digital-identity familiarity is
              becoming mainstream. In mutual funds, AMFI data shows passive categories are already multi-lakh-crore
              pools, which aligns well with Navi's disclosed low-cost product framing. In insurance, PB Fintech's FY26
              disclosures show online insurance premium and new-health growth are still expanding rapidly, implying the
              digital insurance share can rise even from a low base.


              The binding constraints are equally clear. Payments monetization remains structurally compressed because
              UPI scale does not repeal zero-MDR realities and merchant payment margins are still measured in basis
              points. Digital lending faces conduct and capital discipline: RBI's 2025 digital-lending directions force
              standardized disclosures and public app-directory verification, while its capital rules continue to
              penalize under-provisioned unsecured stress. Insurance remains trust- and service-constrained: IRDAI shows
              direct online sale contributes only 1.68% of total health premium, and web aggregators just 0.05%, which
              means digital acquisition alone has not yet rewritten distribution. Mutual funds have lower trust friction
              than credit or insurance, but they are still compliance-heavy: SEBI's 2025-26 circular cadence on
              reporting formats, lock-in/debit-freeze facilities, and scheme categorization is a reminder that product
              simplification does not remove regulatory operations.


              There are also important adoption frictions at the consumer level. World Bank Findex still finds 160
              million banked adults paying utility bills in cash and a 35% inactive-account rate, which means digital
              account access does not automatically become habitual financial-product use. TRAI's urban-rural gap
              remains stark: rural internet penetration is below 50 per 100 population versus over 126 in urban India.
              That matters because Navi's underserved-middle-class thesis depends on broadening reach beyond the
              already-digitized salaried urban base. Meanwhile, scaled comparison and investing incumbents already spend
              to capture high-intent traffic, so digital distribution does not automatically imply low CAC. The result
              is a market with real tailwinds but no permission to assume frictionless conversion.
