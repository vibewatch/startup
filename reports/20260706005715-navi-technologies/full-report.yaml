companyProfile:
  summary: >-
    Navi Technologies is a Bengaluru-based private fintech group built around regulated financial-product rails rather
    than a single wallet feature. Its operating stack spans RBI-regulated lending through Navi Finserv, IRDAI-regulated
    health insurance, SEBI-regulated mutual funds, and an NPCI-approved UPI app surface, all packaged into a consumer
    app aimed at simple, low-friction finance. Public evidence shows a scaled lending and payments funnel with debt
    market access and meaningful user reach, but the company still discloses far less than a public-market investor
    would want on consolidated economics, governance, and customer durability.
  foundedDate: '2018-01-01'
  founders:
    - name: Sachin Bansal
      role: Founder; executive chairman since 2025 restructuring
      background: >-
        Flipkart co-founder who led Navi as CEO before shifting to an executive-chairman remit spanning strategy,
        fundraising, compliance, and M&A.
      claimRefs:
        - CO009
        - CO012
        - CO014
        - CO016
    - name: Ankit Agarwal
      role: Co-founder; non-executive director at Navi Finserv
      background: Co-founder with prior investment-banking experience at Bank of America and Deutsche Bank.
      claimRefs:
        - CO009
        - CO017
  foundingLocation: Bengaluru, Karnataka, India
  headquarters: Bengaluru, Karnataka, India
  productSummary: >-
    A consumer-finance app combining UPI payments, personal loans, home loans, health insurance, mutual funds, bills,
    and recharges through a set of regulated group entities.
  customerFocus: >-
    Mass-market and middle-income Indian consumers seeking paperless borrowing, payments, protection, and entry-level
    investing in a single app-led experience.
  businessModel: >-
    Revenue appears to come primarily from spread and fee income on personal and home loans, with additional
    distribution or fee pools from insurance and mutual funds; UPI looks strategically important for acquisition and
    cross-sell but structurally low-margin as a standalone rail.
  stage: Late-stage private / pre-IPO
