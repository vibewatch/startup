            body: >-
              Public evidence points to Navi as a consumer-fintech superapp rather than a single-product lender. The
              strongest direct proof comes from Navi's own homepage and app-store listings, which consistently show the
              same core bundle: UPI payments, loans, insurance, mutual funds, digital gold, bills, and recharges. That
              breadth matters because it positions Navi to acquire one Indian retail user and then expand wallet share
              across adjacent financial needs. The verified segment is not a premium niche. GripInvest describes Navi
              Finserv as serving urban middle-income borrowers, while Forbes frames the app for financially independent
              users and highlights loan-eligibility guardrails such as income above Rs. 3 lakh and strong CIBIL. The
              affordability cues are also mass-market: health insurance from ₹350 per month, mutual funds from ₹100, and
              gold from ₹50. The evidence therefore supports broad Indian retail and middle-income positioning, while
