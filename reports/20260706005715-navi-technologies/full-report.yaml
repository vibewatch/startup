      - number: '3.3'
        title: Pricing, Distribution, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The public pricing record suggests Navi faces a two-front squeeze. In lending, Bajaj Finance, HDFC Bank,
              ICICI Bank, and even BankBazaar’s comparison layer make price discovery easy for borrowers; that reduces
              room for opaque APRs or materially premium pricing unless Navi can prove better approval speed, higher
              limits, or better underwriting. KreditBee and Moneyview add another form of pressure: they lean into
              digital speed, wide eligibility, and explicit product menus, with KreditBee also publishing a much wider
              APR band that can target riskier borrowers. In wealth, Groww and Paytm Money disclose concrete price
              anchors—₹0 account opening, low brokerage, zero AMC, or promotional zero brokerage—that make them more
              transparent substitutes for self-directed investing than a vague cross-sell proposition. In deposits and
              payments, slice’s repo-linked savings, cashback-led UPI credit card, and bank shell illustrate how newer
              challengers can turn consumer-finance UX itself into a pricing weapon. The result is that Navi competes in
              categories where consumers can compare rates and user experience quickly, often before brand loyalty has
              time to matter.
