  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold / event
      - action implication
    rows:
      - - Collections compliance
        - Regulatory or court action on recovery conduct
        - Any new RBI action, material penalty, or adverse pattern of after-hours/contact-list harassment
        - Pause underwriting; require external collections audit and remediation before adding exposure.
      - - Pricing and fair-practices discipline
        - Origination-policy intervention
        - Any repeat sanction/disbursal restriction or supervisory notice on pricing / WALR / grievance handling
        - Treat as thesis-break unless clearly narrow and quickly cured.
      - - Funding and liquidity
        - Debt-market dependence worsens
        - >-
          Emergency NCD raise, weaker rating outlook, or six-month obligations materially exceeding visible inflows
          without committed backstop
        - Reprice downside and require committed lines or equity buffer.
      - - Credit performance
        - Personal-loan cohort deterioration
        - Meaningful rise in GNPA, credit costs, or pool losses without offsetting pricing/collections improvement
        - Reduce conviction and revisit return hurdles.
      - - Customer trust and privacy
        - Complaint intensity or data-permission backlash rises
        - Evidence that harassment, consent, or CIBIL complaints are growing faster than remediation evidence
        - Assume higher CAC / lower retention / greater regulatory risk in valuation.
    notes: >-
      Kill criteria are intentionally monitorable and tied to observable regulatory, operating, or financing events
      rather than generic concern labels.
