            body: >-
              Navi’s governance and disclosure risks are less about absence of any structure and more about whether
              public transparency is keeping up with ambition. Sachin Bansal has moved from CEO to executive chairman
              while new CEOs run Navi Technologies and Navi Finserv, which can improve management bandwidth but still
              creates a transition period around accountability and execution. The board includes credible independent
              directors, yet investors still rely more on rating-agency memoranda, policy PDFs, and occasional
              interviews than on public-company style disclosure. The 2022 DRHP shows Navi has previously sought a
              public listing, but the company withdrew that process and still describes IPO as a future capital need
              rather than an established reporting regime. In payments, Navi is improving position but still entering a
              structurally concentrated market where PhonePe, Google Pay, and Paytm retain dominant share. That means
