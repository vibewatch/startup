      - number: '2.5'
        title: Contradictory Lenses and Diligence Gaps That Should Not Be Averaged Away
        blocks:
          - type: paragraph
            body: >
              This market produces misleadingly large numbers if the analyst does not keep units and channel shares
              separate. UPI's ₹300 lakh crore of annual value, mutual funds' ₹81.58 lakh crore of AUM, and health
              insurance's ₹1.18 lakh crore of premium are all real, but they do not describe the same economic object.
              UPI is transaction throughput, mutual funds are balance-sheet stock, and insurance is premium flow. They
              therefore should not be averaged into a single fintech TAM. The cleaner conclusion is that Navi sits on
              top of several large rails whose investable value depends on channel share, monetization model, and
              underwriting ability.


              The biggest diligence gap is digital lending. Official RBI sources describe composition, conduct rules,
              and capital treatment, while peer disclosures prove there is meaningful scale in app-led distribution, but
              the public pack still lacks a canonical, current, India-wide number for digital consumer-lending
              originations or receivables segmented by channel and lender type. The second major gap is Navi-specific
              SOM. None of the retained sources discloses Navi's active borrowers, in-force health premium, mutual-fund
              AUM, renewal mix, or conversion by cohort. That means a precise SOM should be treated as
              private-evidence-only rather than modelled from public vanity proxies.


              The third diligence trap is confusing digital availability with digital capture. Findex shows bank
              accounts are widespread but usage is patchy; IRDAI shows online insurance is real but still tiny; AMFI
              shows passive wealth is growing but remains a minority of industry AUM; and peer filings show that even
              scaled fintechs rely on cross-sell, subscriptions, claims support, or distribution economics rather than
              one magical super-app take rate. Preserving these gaps is more valuable than forcing false precision into
              a clean but unsupported TAM/SAM/SOM slide.
            claimRefs:
