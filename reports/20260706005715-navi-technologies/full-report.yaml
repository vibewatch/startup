      - number: '1.3'
        title: Funding History, Debt Access, and Scale Markers
        blocks:
          - type: paragraph
            body: >-
              Navi’s capital story is unusual because the evidence shows real scale and market access without a clearly
              closed outside equity round. ET reported in April 2024 that Navi explored a $200-300 million private raise
              at around a $2 billion valuation, and in June 2026 reported fresh talks with Prosus and Accel Growth Fund
              for $250-300 million at a $1.8-2.0 billion post-money valuation. The same reporting indicates the earlier
              attempt did not close, which means the latest public valuation marker is still talk-based rather than
              transaction-based. Debt markets are more concrete. ET reported a July 2025 Rs 170 crore NCD issue led by
              PhillipCapital, while Navi Finserv’s own disclosures show ongoing NCD servicing and a July 2026
              finance-committee meeting. Official ratings and rating-agency notes reinforce the point. Navi Finserv’s
              site lists CRISIL, India Ratings, and CARE short-term and long-term ratings, and CARE’s December 2025 note
              says commercial-paper capacity was enhanced to Rs 1,700 crore, AUM reached roughly Rs 14,700 crore,
              cumulative disbursements about Rs 52,000 crore, and the broader ecosystem had 21 million monthly users.
              The evidence therefore supports a scaled, fundable private platform, but not one whose valuation or cap
              table is yet fully prospectus-grade.
