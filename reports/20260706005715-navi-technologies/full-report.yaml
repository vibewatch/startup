            body: >-
              Navi’s public valuation history is better described as a sequence of reference points than as a clean set
              of closed marks. In March 2022, the company filed for a $440 million IPO, and TechCrunch also reported
              that a prior SoftBank-linked fundraising effort above $4 billion had fallen apart after the
              banking-license setback. By April 2024, TechCrunch reported a fresh external raise around a $2 billion
              valuation, and by June 2026 ET and ETStartup again described talks for $250-300 million at $1.8-2.0
              billion with Prosus and Accel Growth Fund. Hurun’s 2025 unicorn recognition confirms that Navi crossed the
              $1 billion threshold, but that recognition alone does not validate the full 2026 talk range. The practical
              takeaway is that the best-supported current mark is a band anchored around the latest reported talks, not
