    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - No signed equity round
        - Talks fail or close only on unusually investor-protective terms
        - Would imply the headline range overstated valuation quality
        - Re-cut valuation to lower-base or bear band
      - - Credit quality disappoints
        - FY26 delinquencies, NPAs, or write-offs are meaningfully worse than management pitch
        - Would pull Navi toward lower-multiple lender comps
        - Pause or defer until full credit deck is reviewed
      - - Regulatory relapse
        - Fresh RBI sanctions or a return to lending restrictions
        - Would directly weaken both growth and confidence in governance
        - Move to avoid or deep-discount entry
