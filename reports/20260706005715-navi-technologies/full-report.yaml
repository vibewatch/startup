  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Inclusion Logic
        blocks:
          - type: paragraph
            body: >-
              Navi is not competing against one neat peer set. The retained public evidence shows at least five distinct
              ways consumers can solve overlapping jobs: broad payments-led super-apps such as PhonePe and Paytm;
              rate-anchoring lenders such as Bajaj Finance and incumbent banks; investing-led wallets such as Groww and
              Paytm Money; asset-light insurance and credit marketplaces such as Policybazaar and BankBazaar; and
              digital lenders or bank-led challengers such as Moneyview, KreditBee, and slice. That matters because
              Navi’s own public surface spans UPI, loans, insurance, and mutual funds, so almost every adjacent product
              category creates a different competitor cohort rather than a single like-for-like substitute. The
              inclusion logic in this chapter is therefore evidence-led: include the players that either disclose a
              broader consumer funnel than Navi, publish sharper price anchors than Navi, or show a more durable
              regulatory, funding, or disclosure posture than Navi’s retained public record currently does.
