summary:
  headline: >-
    Track: Navi is a scaled Indian fintech with real regulated-product breadth, lending-arm profitability, and a large
    consumer funnel, but regulatory scar tissue, debt-heavy funding, and unsigned valuation terms keep the case short of
    a buy recommendation.
