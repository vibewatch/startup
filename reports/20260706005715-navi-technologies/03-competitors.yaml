- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Implication / diligence ask
  rows:
  - - Payments distribution can protect Navi cross-sell
    - PhonePe and Paytm disclose broader consumer transaction funnels
    - high
    - PhonePe one-in-three-India claim; Paytm mass payments surface
    - Need Navi KPI proof that its own payment habit is large enough to feed lending and wealth cheaply
  - - Loan speed can offset lack of massive daily-use distribution
    - Bajaj, HDFC, ICICI, KreditBee, and BankBazaar make pricing and speed easy to compare
    - high
    - Published rates, limits, and digital promises across lender pages
    - Ask for Navi’s actual approval-speed, repeat-borrower, and APR competitiveness by cohort
  - - Wealth cross-sell can improve LTV without balance-sheet risk
    - Groww and Paytm Money already disclose clearer trading and pricing surfaces
    - medium
    - Groww and Paytm Money pricing pages plus TechCrunch scale data
    - Need proof that Navi mutual-fund cross-sell converts at meaningful scale
  - - Insurance distribution can deepen wallet share
    - Policybazaar and PB Fintech own comparison-led intent capture before checkout
    - medium
    - IRDA-approved broker model plus 50+ insurer tie-ups and high throughput
    - Need proof Navi can win distribution without a marketplace-style acquisition funnel
  - - Partner-led lending is enough if economics stay strong
    - Moneyview and KreditBee show that app-first lending specialists can still scale aggressively
    - high
    - Moneyview IPO metrics and KreditBee valuation / profitability disclosure
    - Need asset-quality and funding-cost data before calling Navi’s lending moat durable
  - - Bank licence can create a deeper moat than partner distribution alone
    - slice now combines payments, deposits, and credit inside an SFB shell
    - high
    - NESFB merger, repo-linked savings, and profit evidence
    - Need clarity on whether Navi can match similar control over funding and regulation
  - - Public disclosure can itself become a trust moat
    - Groww, PB Fintech, and Paytm all expose more public-company style detail than private fintech peers
    - medium
    - Investor-relations surfaces and published financial cadence
    - Need updated Navi disclosure pack or DRHP-style metrics to narrow the trust gap
  - - Capital access remains abundant for scaled fintechs
    - slice’s valuation reset and PhonePe valuation debate show capital is now more selective
    - medium
    - PhonePe conflicting IPO valuation reports; slice valuation-cut reporting
    - Need evidence that Navi can raise or refinance on favorable terms in a more selective market
  notes: Severity reflects how directly each threat can compress Navi’s acquisition economics, underwriting confidence, or consumer trust based on retained public evidence.
