- id: direct-and-adjacent-competitor-profiles
  title: Direct and Adjacent Competitor Profiles
  body: 'PhonePe is the broadest disclosed adjacent threat because it owns a huge top-of-funnel in everyday payments and has already pushed into insurance, investing, partner-led lending, and a standalone wealth platform under Share.Market. Paytm remains relevant for similar reasons even after the Paytm Payments Bank setback: the public app still owns a broad consumer transaction surface and Paytm Money extends the brand into investing. Groww is a different threat vector: it is not a payments super-app, but it is a publicly disclosed, profitable, investing-led platform with active users, explicit pricing, and a wider brokerage relationship than Navi’s current mutual-fund-focused public surface suggests. PB Fintech and Policybazaar are not direct balance-sheet lenders, but their asset-light, high-throughput distribution layer can still intercept insurance and credit demand before it reaches Navi. Moneyview, KreditBee, and slice matter because they are closer to Navi’s lending and consumer-finance
    motion, yet each now discloses a stronger public marker on some axis—scale, profitability, valuation, or bank-licence control—than Navi’s retained public record does.'
