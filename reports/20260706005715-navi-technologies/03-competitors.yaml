- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor / substitute
  - Published price / rate anchor
  - Product
  - UX / service promise
  - Implication for Navi
  rows:
  - - Bajaj Finance
    - 10% p.a. start; Rs. 40,000 to Rs. 55 lakh; 12-108 months
    - Personal loan
    - Fast approval, minimal docs, no collateral
    - Aggressive loan anchor from a scaled NBFC
  - - HDFC Bank
    - 9.99% start; up to ₹50 lakh
    - Personal loan
    - Near-instant for pre-approved customers
    - Legacy bank substitute lowers tolerance for higher-rate apps
  - - ICICI Bank
    - Collateral-free; ₹50,000 to ₹50 lakh
    - Personal loan
    - Fully digital process via bank app
    - Incumbent app can solve the same urgent-credit job
  - - KreditBee
    - 12%-28% p.a.; up to 4.8% + GST fee; ₹6,000 to ₹10 lakh
    - Personal loan
    - Quick online disbursal for smaller-ticket credit
    - Wide APR band targets borrowers Navi may also target
  - - BankBazaar benchmark set
    - 8.75% to 21.55%+ across tracked banks
    - Comparison layer
    - Borrower can comparison-shop before choosing a lender
    - Makes pricing transparency table-stakes
  - - Groww
    - ₹0 account opening; ₹20 or 0.1% brokerage, whichever lower
    - Broking / trading
    - Low-friction self-directed investing
    - Raises bar for retail wealth monetisation
  - - Paytm Money
    - ₹0 AMC for life; zero brokerage for one month
    - Wealth / broking
    - Bundled into a mass consumer brand
    - Promotional pricing can steal first-time investors
  - - slice
    - Repo-linked savings; up to 7.75% FD; up to 3% cashback
    - Savings + UPI credit card
    - Daily interest, zero balance, instant cashback
    - Deposits and payments UX become pricing weapons
  - - Moneyview UPI
    - Free to use
    - Payments / UPI
    - Cross-app use plus rewards and RuPay support
    - UPI utility alone is hard to monetise defensively
