- id: TP004
  title: Funding / disclosure / regulatory posture comparison
  columns:
  - Competitor
  - Capital / valuation posture
  - Disclosure posture
  - Regulatory note
  - Competitive implication
  rows:
  - - PhonePe
    - Reported 2026 IPO target of $9B-$10.5B, but conflicting higher ambition circulated
    - Still private, relying on IPO reportage rather than quarterly public filings
    - Partner-led credit model; no own-lender claim retained here
    - Large private scale, but public-market discipline still in formation
  - - Paytm
    - Already public; public-market valuation history visible
    - Annual and quarterly IR cadence through FY26
    - PPBL licence cancelled by RBI in 2026
    - Trust hit on regulated shell, but disclosure depth stays high
  - - Groww
    - Public-market valuation around $9B after IPO close per TechCrunch
    - Investor-relations page plus market reporting
    - No major adverse regulatory event retained here
    - Public profitability and disclosure improve credibility with customers and partners
  - - PB Fintech
    - Already public since 2021
    - Annual reports and quarterly results visible on IR page
    - Asset-light; no retained credit risk claim
    - Strong disclosure without carrying lending risk
  - - Moneyview
    - ₹1,500 crore IPO filed; valuation not yet final in retained set
    - IPO-era disclosures visible through media reporting, not yet full public-company cadence
    - NBFC and DLG rules are material risk factors
    - Closer to public scrutiny than most private lenders
  - - KreditBee
    - $280M raise at $1.5B valuation; IPO prep reported
    - Still private; reporting largely press-mediated
    - Partner-lender model rather than broad public-bank shell
    - Capital support exists, but public reporting remains lighter than public peers
  - - slice
    - Fundraising discussions reportedly below prior unicorn valuation
    - Still private but now paired with SFB reporting and media coverage
    - Now an SFB after merger; valuation reset despite better operations
    - Licence strength helps, but capital markets are more selective
  - - Bajaj / incumbent banks
    - Not valuation-led in this chapter; strength comes from regulated lender status and public consumer surfaces
    - Published rates and large-scale consumer pages
    - Full lender control and legacy trust
    - Rate discipline and balance-sheet trust raise Navi’s hurdle rate
  notes: Funding posture is compared only where public reporting retained a supportable marker; absence of a current public number is treated as thinner disclosure, not as a negative fact by itself.
