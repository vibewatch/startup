tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Public scale / posture
  - Core scope
  - Regulatory / model note
  - Why it matters vs Navi
  rows:
  - - PhonePe
    - Payments-led super-app
    - 65+ crore registered users; 4.7+ crore merchants
    - UPI, bills, insurance, investments, partner-led lending, Share.Market
    - Loans facilitated through RBI-registered NBFC/bank partners
    - Broadest disclosed consumer funnel and strongest everyday-transactions distribution
  - - Paytm
    - Payments-led super-app + public wealth adjacency
    - Public-market disclosure cadence; 6M+ Paytm Money investors
    - UPI, bills, travel, Paytm Money wealth stack
    - PPBL licence cancelled in 2026; distribution survives without payments-bank shell
    - Still a mass-distribution substitute even after the bank setback
  - - Bajaj Finance
    - Rate-anchoring lender / NBFC incumbent
    - 5+ crore trust claim on public loan page
    - Unsecured personal loans at scale
    - Direct lending economics with explicit rate and tenure disclosure
    - Hard rate and limit benchmark for Navi’s lending proposition
  - - Groww
    - Investing-led fintech / public company
    - 50M+ customers; 14M+ active users in IPO coverage
    - Broking, mutual funds, IPOs, lending, payments, insurance
    - Public-market disclosure and explicit retail pricing
    - Strong substitute for Navi’s investing and wealth cross-sell
  - - PB Fintech / Policybazaar
    - Asset-light insurance and credit marketplace
    - 67.3M policies sold; ₹307B FY26 loan disbursals
    - Insurance comparison, credit-score and loan-distribution surfaces
    - Does not retain credit risk on its own books
    - Can intercept insurance and loan intent before Navi closes it
  - - Moneyview
    - Digital lender with payments and insurance adjacency
    - 12Cr+ users; IPO filed; 125.49M registered users in 9M FY26
    - Loans, UPI, insurance, savings, tracking
    - Uses Whizdm Finance NBFC; exposed to DLG and cyber risk
    - Closer analogue to Navi’s consumer-finance bundle than pure brokers or insurers
  - - KreditBee
    - Digital lending specialist
    - $1.5B valuation; IPO prep; FY25 profit disclosed in press
    - Personal, business, two-wheeler, and LAP lending
    - Loans routed via RBI-registered NBFCs/banks
    - Direct challenger on fast, app-first personal lending
  - - slice
    - Bank-licensed digital challenger
    - 20M+ users; first FY26 profit; valuation reset in 2026 fundraising
    - Savings, UPI credit card, payments, FD
    - Now operates as a small finance bank after NESFB merger
    - Combines modern UX with regulated balance-sheet control
  - - BankBazaar
    - Comparison / advisory layer
    - 3 crore+ free credit-score users
    - Credit score, cards, loans, rates, content
    - Marketplace and benchmarking model rather than lender economics
    - Raises customer price transparency and weakens opaque loan positioning
  - - Incumbent banks (HDFC / ICICI)
    - Status-quo substitute
    - Published digital loan pages and price anchors
    - Personal loans through existing banking relationships
    - Direct balance-sheet lenders with digital origination
    - These are still the easiest substitutes when borrowers just need a loan, not a super-app
  notes: Rows reflect only competitors with supportable public evidence in this chapter; direct inclusion requires either broad distribution, explicit pricing, public disclosure, or regulated balance-sheet control.
