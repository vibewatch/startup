  evidenceGaps:
  - type: missing-source
    severity: material
    topic: navi-scale-disclosure
    missingEvidence: A recent public metric pack for Navi covering active users, UPI throughput, loan book, disbursals, and product-level AUM that is directly comparable with PhonePe, Groww, PB Fintech, and Moneyview disclosures.
    whyItMatters: Without comparable scale data, the chapter can compare breadth and competitor disclosures, but not definitively rank Navi’s actual consumer or balance-sheet scale against the largest rivals.
    diligencePath: Ask management for the latest KPI deck or DRHP-style operating metrics and reconcile them to product-level disclosures and statutory filings.
    relatedQuestionRefs:
    - QP010
    - QP028
  - type: conflicting-data
    severity: material
    topic: phonepe-ipo-valuation
    missingEvidence: Reconciled primary documentation for PhonePe’s actual IPO valuation expectation after conflicting public reports around roughly $9-10.5 billion versus higher internal ambition.
    whyItMatters: PhonePe’s valuation posture affects how aggressively it can subsidise adjacent products and how much public-market discipline it will face during the next leg of competition.
    diligencePath: Review the final DRHP, anchor-book disclosures, or management commentary once a definitive offer structure is public.
    relatedQuestionRefs:
    - QP016
  - type: missing-source
    severity: minor
    topic: wealth-pricing-comparison
    missingEvidence: A clean public pricing page for Share.Market or PhonePe wealth products that is directly comparable with Groww and Paytm Money trading-fee disclosures.
    whyItMatters: The chapter can compare disclosed wealth breadth today, but cannot prove a full apples-to-apples fee delta for every wealth stack because Share.Market pricing was not retained in this source set.
    diligencePath: Fetch Share.Market’s pricing page or brokerage schedule and normalize it against Groww and Paytm Money tariff cards.
    relatedQuestionRefs:
    - QP022
  - type: private-evidence-only
    severity: material
    topic: underwriting-quality
    missingEvidence: Comparable GNPA, loss-rate, cohort-default, and collection-efficiency disclosures across Navi, Moneyview, KreditBee, and other private digital lenders.
    whyItMatters: Lending-moat durability depends on underwriting quality and funding cost discipline, but the public record remains too thin to call one private lender structurally superior on asset quality alone.
    diligencePath: Request lender-level asset-quality packs, vintage curves, and funding-cost schedules under NDA from management and financing partners.
    relatedQuestionRefs:
    - QP026
    - QP028
  - type: missing-source
    severity: minor
    topic: paytm-post-bank-scale
    missingEvidence: Recent Paytm merchant and active-user metrics that are directly comparable with PhonePe’s disclosed user and merchant base after the payments-bank licence cancellation.
    whyItMatters: Paytm remains a relevant substitute and distribution rival, but the retained sources do not let this chapter rank its current network strength against PhonePe or Navi with the same precision.
    diligencePath: Pull the latest Paytm investor datapack or management commentary with active-user, merchant, and loan-sourcing KPIs.
    relatedQuestionRefs:
    - QP028
