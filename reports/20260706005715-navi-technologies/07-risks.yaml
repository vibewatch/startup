  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Navi’s downside is dominated by regulatory and conduct precedent rather than pure startup uncertainty: RBI already halted fresh lending in 2024, later lifted the restriction after remediation, and then penalized recovery-agent practices in 2026. That risk stack compounds with personal-loan concentration, debt-market dependence, broad data-permission practices, customer-trust complaints, and a still-concentrated UPI market. Public mitigations exist, but the retained evidence still supports a high-residual-risk view until collections, credit-vintage, and funding transparency improves."
  },
  "sections": [
    {
      "id": "regulatory-legal-and-compliance-risk",
      "title": "Regulatory, legal, and compliance risk",
      "body": "Navi’s sharpest downside is that recent regulatory pain is not hypothetical. RBI stopped Navi Finserv from sanctioning and disbursing fresh loans in October 2024 and explicitly tied the action to pricing-policy concerns, excessive lending spreads, Fair Practices Code non-adherence, and other supervisory deficiencies. RBI later lifted the restriction after remediation, which is meaningful mitigation, but the episode creates precedent risk: the regulator has already shown willingness to halt origination if pricing, customer-treatment, or process discipline slips again. That concern widened rather than disappeared in 2026, when RBI imposed a recovery-agent penalty over after-hours collection calls and message protocol failures. The older bank-licence rejection in the Chaitanya franchise reinforces that regulatory-franchise risk is not a one-off. For an investor, the question is not whether Navi can grow under regulation; it is whether compliance execution can stay ahead of growth in a product set that mixes unsecured credit, collections, and data-heavy digital onboarding.",
