    {
      "id": "mitigations-monitoring-and-thesis-breakers",
      "title": "Mitigations, monitoring, and thesis-breakers",
      "body": "Navi is not unmanaged. RBI did lift the 2024 origination restriction after remediation; CARE still described liquidity as adequate; the company publishes a Fair Practices Code, grievance paths, blacklisted collection-agency lists, ombudsman materials, and board information; and some customer disputes do not translate into clear findings against Navi itself. But those mitigants mostly prove that management has control surfaces, not that the risk stack is resolved. The practical investment posture is therefore conditional. Thesis-supporting evidence would include clean post-penalty collections audits, stable or improving delinquency and loss cohorts, lower dependence on expensive debt or emergency NCD issuance, and continued regulatory silence on pricing or customer treatment. Thesis-breakers would include another origination or collections action from RBI, material deterioration in personal-loan vintages, evidence that trust complaints are rising rather than isolated, or a funding/IPO plan that slips badly enough to tighten liquidity or compress valuation confidence.",
