      "id": "credit-funding-and-model-risk",
      "title": "Credit, funding, and model risk",
      "body": "Navi Finserv’s economic model remains highly exposed to unsecured personal-loan performance, external funding markets, and management’s ability to keep yields, losses, and compliance in balance after regulatory intervention. CARE’s reports show personal loans still account for the overwhelming majority of AUM, so underwriting drift or collections friction can move the whole platform faster than in a more diversified book. Reported GNPA and NNPA remain manageable, and structured-credit pools still show loss-absorption through excess interest spread, but the same public evidence also shows higher credit costs, only moderate recurring profitability, and dependence on refinancing. Ratings documents show total debt above ₹7,300 crore, meaningful NCD and CP usage, and an explicit need to keep bank funding growing as personal-loan rates stay lower. The 2026 debt round and Bansal’s own “need more capital” comment mean capital access is not optional upside; it is part of the base-case operating model.",
