    {
      "id": "customer-trust-privacy-and-operational-risk",
      "title": "Customer trust, privacy, and operational risk",
      "body": "The customer-trust risk is unusually layered because Navi’s public policy posture is both broad and sensitive. Its privacy policy allows collection of KYC, banking, income, SMS, location, and phonebook-contact data with consent and says contact data can be used to enrich financial profiles and detect fraud. That may improve underwriting and fraud prevention, but it also creates a narrow margin for error when customers already allege harassment or contact-list outreach in public forums. Moneycontrol reported allegations that borrowers’ phone books were being used to pressure acquaintances, while complaint-board style sources show repeated user complaints around harassment and credit-bureau reporting. The 2026 RBI collections penalty is the strongest reason to treat those issues seriously. Operationally, the payments stack also has visible fragility: The Hindu reported a ₹14.26 crore fraud linked to a TPAP payment-gateway bug, showing that even outside core lending, partner-process failures can produce direct losses and reputational damage. Mixed legal outcomes and official grievance channels are mitigating evidence, but they do not remove residual trust sensitivity.",
