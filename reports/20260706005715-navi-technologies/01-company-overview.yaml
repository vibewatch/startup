company:
  name: Navi Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Navi is a Bengaluru-based private fintech platform built around lending, UPI, insurance, and mutual funds under the Navi brand, with the app owned by Navi Limited and the credit engine housed in RBI-regulated Navi Finserv. Public evidence shows a scaled, debt-funded, pre-IPO business with rated liabilities and institutional partners, but exact founding chronology, current headcount, active-customer counts, and any closed external valuation remain materially opaque.
sections:
- id: identity-stage-business-model
  title: Identity, Headquarters, Stage, and Business Model
  body: 'Navi now presents itself as a broad financial-services app rather than a monoline lender. Official about-us text says the Navi App is owned by Navi Limited, formerly Navi Technologies Limited, while loans sit in Navi Finserv, health cover in Navi General Insurance, and mutual funds in Navi AMC and Navi Mutual Fund. Homepage copy shows a single distribution surface spanning UPI, loans, insurance, investments, bills, and recharges. The clearest disclosed operating address is Navi Finserv’s registered office in Bengaluru, which is repeated across investor-relations and digital-lending disclosures. On founding, however, the public record is not perfectly clean: ET’s 2022 IPO coverage and News18’s 2025 restructuring report place the launch in 2018 under Sachin Bansal and Ankit Agarwal, while ET’s February 2025 profile says Bansal had led the companies since founding them in 2016. The prudent diligence view is therefore “late-2010s, Bansal and Agarwal-built, Bengaluru-based private fintech
    platform,” with the exact legal chronology still needing primary incorporation records. What is clear is the current stage: Navi already looks like a late-stage, pre-IPO platform with rated debt access and multiple regulated product lines, not an early venture still proving product-market fit.'
