  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: Primary incorporation or reorganisation records that reconcile the 2016-versus-2018 founding chronology and any predecessor-entity history.
    whyItMatters: A clean formation timeline matters for understanding track record length, corporate lineage, and how much of Navi’s operating platform came from acquisition versus greenfield build.
    diligencePath: Pull MCA incorporation and name-change records for the holdco and major subsidiaries, then reconcile them against media descriptions and rating-agency ownership histories.
    relatedQuestionRefs:
    - QO001
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: group-governance
    missingEvidence: A current holdco-level board roster, committee map, independent-director list, and shareholder-control-rights summary for Navi Limited.
    whyItMatters: The regulated-lender board is visible, but investors underwrite the wider group. Without the holdco governance layer, board independence and control mechanics remain only partially knowable.
    diligencePath: Request the latest holdco board deck, constitutional documents, and any current corporate-governance webpage or annual-return annexure covering Navi Limited itself.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: Definitive evidence on whether any 2024-2026 outside equity round actually closed, at what valuation, with what dilution, and with which investors.
    whyItMatters: The latest valuation signals are talks-based. Without signed transaction evidence or a prospectus, valuation stance and total external capital raised remain partly narrative-driven.
    diligencePath: Request the latest cap table, board-approved financing minutes, signed term sheets if any, and any refreshed IPO or private-placement materials.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-transparency
    missingEvidence: Current group headcount, active-customer or active-borrower counts, and a consolidated revenue run-rate or segment bridge across lending, UPI, insurance, and mutual funds.
    whyItMatters: Scale claims are easier to test when staffing, active users, and current revenue are visible. Without them, investors can see growth vectors but not the full operating efficiency picture.
    diligencePath: Obtain the latest management pack or lender presentation showing monthly active users, customer cohorts, headcount, and consolidated or segment-level financial KPIs.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
