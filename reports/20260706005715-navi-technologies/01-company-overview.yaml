  rows:
  - - Sachin Bansal
    - Founder, executive chairman, controlling shareholder
    - Rating-agency notes describe him as holding about 98% of Navi Technologies / Navi Limited historically
    - Single-person control anchors valuation, financing, and governance outcomes
    - Confirm current diluted stake, ESOP pool, and any post-2025 structural changes
  - - Navi Limited (holdco)
    - App owner and parent capital provider
    - Formerly Navi Technologies; CARE described it as 100% owner of Navi Finserv in 2024 and still a large net-worth support entity in 2025
    - Brand, technology ownership, and parent capital support sit here
    - Obtain current consolidated org chart and FY26 audited holdco statements
  - - Navi Finserv
    - Lending arm and rated borrower
    - RBI-regulated NBFC with ~₹14,700 crore AUM by Dec 2025
    - This is the main credit engine and public debt issuer inside the group
    - Clarify on-book versus co-lent versus assigned exposures by product
  - - Debt investors / NCD market
    - Current external financing channel
    - ₹170 crore July 2025 NCD issue plus official rating coverage and July 2026 servicing notices
    - Debt markets are the most visible proof of institutional fundability today
    - Map full NCD stack, covenants, maturities, and refinancing dependence
  - - Prospective growth-equity investors
    - Unclosed capital counterparties
    - ET reported 2026 talks with Prosus and Accel at $1.8-2.0B post-money
    - Could reset the cap table and valuation if the round actually closes
    - Confirm whether talks closed, valuation, primary/secondary mix, and dilution
  - - Co-lending partners
    - Distribution and funding counterparties
    - Official page lists Aditya Birla Capital, Kisetsu Saison, Tata Capital, and TVS Credit
    - Shows Navi can scale lending with institutional partners rather than only its own balance sheet
    - Get partner economics, recourse terms, volumes, and product-level profitability by partner
  notes: This map mixes actual owners, current debt channels, institutional partners, and prospective investors because public cap-table disclosure is thin. Prosus and Accel are talks-based and not presented as closed shareholders.
