  rows:
  - - Sachin Bansal
    - Executive chairman, Navi Group; non-executive chairman, Navi Finserv
    - Flipkart co-founder; moved out of CEO roles in Feb 2025 but retained strategy, fundraising, M&A, compliance, and tech oversight
    - Founder control, capital allocation, regulatory posture
    - Control remains centralized around the founder-chair even after the CEO handoff
  - - Rajiv Naresh
    - CEO, Navi Technologies
    - Part of Navi since inception; elevated in Feb 2025
    - Runs non-lending businesses including UPI, insurance, and mutual funds
    - Public biographical detail is thinner than his strategic remit suggests
  - - Abhishek Dwivedi
    - CEO and MD, Navi Finserv
    - Long-time Navi operator with strategy and operations background; official board page gives 15+ years of sector experience
    - Owns lending growth, product rollout, and regulated-NBFC execution
    - Key operating dependency for the lending franchise
  - - Ankit Agarwal
    - Co-founder; non-executive director, Navi Finserv
    - IIT Delhi / IIM Ahmedabad; former Bank of America and Deutsche Bank banker
    - Founding institutional memory and finance-market perspective
    - Current day-to-day operating remit is not as visible as Bansal’s
  - - Ranganathan Sridharan
    - Independent director, Navi Finserv
    - Former SBI/CCIL executive and member of RBI and Government of India committees
    - Banking and regulatory credibility on the lending-board layer
    - Independent-director depth is easier to verify at Finserv than at the holdco
  - - Nilufer Panthaki
    - Director, Navi Finserv
    - Former Groww, Federal Bank, Indostar, and Standard Chartered executive
    - Retail-banking, product, monetization, and risk experience
    - Public materials do not show whether comparable depth is replicated across the full group
