- id: milestones-regulation-and-partnerships
  title: Milestones, Regulatory Events, and Partnership Plumbing
  body: 'The milestone trail matters because it shows both ambition and fragility. Navi won SEBI approval in September 2022 for a Rs 3,350 crore IPO, but the issue was never launched. In October 2024 RBI ordered Navi Finserv to stop sanctioning and disbursing new loans, with the central bank and ET Legal tying the action to excessive pricing and broader supervisory concerns. RBI lifted the restriction in December 2024 after the company revamped processes and committed to ongoing compliance, and Bansal later said growing regulatory demands were one reason for his 2025 role shift. That sequence is central to the diligence story: Navi is not just scaling products, it is scaling under close supervisory attention. On the operating side, official disclosures show more institutional plumbing than a typical startup. Current co-lending partners include Aditya Birla Capital, Kisetsu Saison, Tata Capital, and TVS Credit; DLA disclosure confirms self-owned lending channels at navi.com/pl and navi.com/hl;
    and DLG disclosures show guarantee-linked portfolio exposure growing sharply between December 2024 and June 2026. The net read is a company with genuine infrastructure and distribution depth, but one that still has to prove that governance quality, disclosure depth, and valuation narrative can consistently keep pace with its scale ambitions.'
