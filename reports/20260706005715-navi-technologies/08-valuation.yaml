  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: term-sheet-opacity
    missingEvidence: Signed term sheet, primary versus secondary split, liquidation preferences, anti-dilution, and board-control
      rights for the contemplated 2026 round.
    whyItMatters: The headline valuation range is not enough to judge whether the economics are investor-friendly or whether
      downside protection is masking a full price.
    diligencePath: Request the latest cap table, draft term sheet, and any side-letter summary from management and lead investors.
    relatedQuestionRefs:
    - QV036
  - type: missing-source
    severity: material
    topic: fy26-operating-bridge
    missingEvidence: FY26 YTD revenue, take-rate or NIM bridge, credit-loss or NPA metrics, and collection performance by
      product line.
    whyItMatters: Those metrics determine whether Navi deserves a premium fintech multiple or should be pulled toward lower-multiple
      listed lenders.
    diligencePath: Obtain FY26 management MIS or lender deck with product-level revenue, delinquencies, write-offs, and cohort
      curves.
    relatedQuestionRefs:
    - QV037
  - type: missing-source
    severity: material
    topic: se-asia-expansion-proof
    missingEvidence: Official launch timing, licensing path, customer-acquisition economics, and loss-rate assumptions for
      any Southeast Asia expansion.
    whyItMatters: The upside case references regional expansion, but current public evidence is still at the single-report
      level rather than operational proof.
    diligencePath: Request the board plan, country shortlist, regulatory workstreams, and first-market unit-economics model.
    relatedQuestionRefs:
    - QV032
    - QV038
  - type: enumeration-incomplete
    severity: minor
    topic: public-comps-universe
    missingEvidence: A broader comp sheet covering Indian listed NBFCs, additional global consumer-fintech peers, and recent
      private transaction marks.
    whyItMatters: The current comparable table uses the best accessible public analogs, but it is intentionally partial rather
      than an exhaustive market map.
    diligencePath: Build a full IC comp deck with local Indian peers, closed private rounds, and EV adjustments where audited
      balance-sheet data are available.
    relatedQuestionRefs:
    - QV020
    - QV027
    relatedTableRefs:
    - TV004
