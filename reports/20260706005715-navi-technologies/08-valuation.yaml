- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Core assumptions
  - Indicative valuation range (USD B)
  - Probability signal
  - What would need to be true
  rows:
  - - Bear
    - Round slips, market prices Navi closer to lender / bare-unicorn comps, and regulatory or credit concerns dominate
    - 1.2-1.5
    - Credible downside because Hurun only proves >$1B and no new equity is closed
    - No renewed restrictions and stronger FY26 credit proof would be needed to escape this band
  - - Base-low
    - Navi keeps operating momentum but investors still demand a discount for opacity and debt reliance
    - 1.6-1.8
    - Reasonable if no round closes quickly but business quality remains stable
    - FY26 revenue and credit performance must hold without fresh regulatory surprises
  - - Base
    - Prosus / Accel or similar investors close a round near the latest talk range with ordinary terms
    - 1.8-2.0
    - This is the strongest anchored public evidence today
    - A signed term sheet and use-of-proceeds detail would turn talk into underwriteable evidence
  - - Bull
    - Premium multi-product fintech narrative wins and investors reward scale, breadth, and expansion optionality
    - 2.2-2.8
    - Possible but not yet evidenced in the public file
    - Needs clean round economics plus disclosed FY26 growth, margin, and credit metrics
  notes: Ranges are scenario bands, not closed marks; they are anchored on the 2026 talk range, Hurun’s unicorn floor, and
    public-comp dispersion rather than on a full intrinsic model.
