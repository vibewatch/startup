- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - No signed equity round
    - Talks fail or close only on unusually investor-protective terms
    - Would imply the headline range overstated valuation quality
    - Re-cut valuation to lower-base or bear band
  - - Credit quality disappoints
    - FY26 delinquencies, NPAs, or write-offs are meaningfully worse than management pitch
    - Would pull Navi toward lower-multiple lender comps
    - Pause or defer until full credit deck is reviewed
  - - Regulatory relapse
    - Fresh RBI sanctions or a return to lending restrictions
    - Would directly weaken both growth and confidence in governance
    - Move to avoid or deep-discount entry
  - - Debt substitutes for equity
    - Growth is funded mainly through debt, guarantees, or structured capital instead of clean equity
    - Would raise questions about true equity demand at the talk range
    - Require cap-table and covenant review before investing
  - - Platform narrative breaks
    - UPI, insurance, or mutual-fund breadth does not translate into margin or cross-sell economics
    - Would reduce justification for premium multi-product treatment
    - Re-anchor on lender-style public comp band
  notes: These triggers are monitorable because each can be tied to a document, regulatory event, or disclosed operating metric
    rather than to vague sentiment.
  claimRefs:
  - CV017
  - CV025
  - CV027
  - CV030
  - CV050
  - CV051
  - CV052
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - 2026 round terms
    - Signed term sheet, cap table impact, and any investor protections
    - Separates headline valuation from economic valuation quality
    - Management + lead investor data room
  - - FY26 revenue bridge
    - YTD revenue by product, take-rate / NIM bridge, and contribution margin
    - Shows whether current scale supports premium treatment
    - Finance team model review
  - - Credit performance
    - NPAs, write-offs, collections, and cohort loss curves by lending product
    - Determines whether lender-style discount should dominate
    - Credit committee pack + servicing analytics
  - - Regional expansion
    - Country plan, licensing path, CAC, and expected loss profile for Southeast Asia
    - Bull case explicitly references expansion optionality
    - Expansion workstream memo
  - - Cross-sell economics
    - User overlap and profitability across UPI, lending, insurance, and mutual funds
    - Tests whether platform breadth creates real valuation uplift
    - Product and growth analytics
  - - Debt overhang
    - Current NCD stack, guarantees, covenants, and refinancing schedule
    - Clarifies whether leverage is enhancing or obscuring valuation quality
    - Treasury / legal diligence
  notes: These asks are the minimum package needed to move from a plausible public range to an underwritten private-market
    view.
