- id: recommendation-and-diligence
  title: Recommendation and Diligence
  body: The right call at today’s public evidence level is Track, not Buy. The reason is not that the $1.8-2.0 billion range
    is obviously wrong; it is that the market has not yet shown a closed round with disclosed economics, and the downside
    evidence is material enough that investors should insist on terms and operating proof before underwriting a premium. The
    strongest support for the current mark is the repeated ~$2 billion fundraising narrative plus real operating breadth and
    scale. The strongest counterweight is that the latest round is still only a discussion while the public file also shows
    a 2024 regulatory interruption, a FY25 group loss, debt-funded growth, and incomplete visibility on FY26 credit performance.
    The valuation therefore looks fair if Navi can clear the diligence asks and keep regulatory and credit trends stable,
    but stretched at the top end until those gaps close. Until that package is in hand, the right posture is to preserve upside
    optionality while refusing to pay as though the round has already closed on clean terms.
