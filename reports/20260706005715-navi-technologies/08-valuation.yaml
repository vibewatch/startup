- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Valuation signal
    - Repeat ~$2B fundraising narrative suggests investors see strategic platform value
    - The range is still unsigned and could clear only on investor-protective terms
    - Closed round documents with clean economics
  - - Product breadth
    - Loans, UPI, insurance, and mutual funds can justify platform-style premium
    - Breadth also makes execution and comp selection harder than for pure-play peers
    - Product-level margin and retention disclosure
  - - Operating scale
    - FY24 revenue, UPI throughput, and 2026 disbursals indicate real scale
    - Scale without disclosed FY26 credit quality can still deserve a discount
    - FY26 revenue, losses, delinquencies, and collections
  - - Capital structure
    - Debt capacity and ratings can fund growth before IPO timing improves
    - Debt-heavy funding can mask the true quality of equity valuation and downside protection
    - Cap table, preference stack, and lender covenant review
  - - Regulatory posture
    - 2024 restrictions were lifted, which suggests remediation worked
    - A previous lending pause shows the model can be disrupted by supervision
    - Proof of durable compliance and no repeat findings
  notes: The anti-thesis is not that Navi lacks a business; it is that investors may be asked to pay a premium before the
    public file proves premium economics.
  claimRefs:
  - CV003
