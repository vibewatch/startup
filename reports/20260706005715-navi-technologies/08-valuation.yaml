- id: public-comparables-and-scenario-logic
  title: Public Comparables and Scenario Logic
  body: 'The public-comps exercise is useful for bracketing Navi, but it cannot produce false precision because Navi is not
    a pure BNPL name, a pure lender, or a pure software platform. The accessible comp band is very wide: LendingTree and OneMain
    screen like lower-multiple lending or marketplace businesses, Pagaya also trades at a low proxy multiple, Upstart sits
    in the middle, Nu has a much stronger premium, and Affirm remains the outlier high-multiple consumer-fintech benchmark.
    SoFi is informative as a scale peer, but its readily accessible SEC revenue taxonomy is not a clean apples-to-apples denominator
    for a simple market-cap-to-revenue proxy. That spread is exactly why Navi’s unsigned 2026 talk range matters so much.
    A $1.8-2.0 billion mark is plausible if investors treat Navi as a premium multi-product fintech platform, but it looks
    stretched if they anchor it to more ordinary listed lender analogs or penalise it for regulatory and credit complexity.'
