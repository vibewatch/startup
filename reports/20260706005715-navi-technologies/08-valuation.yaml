tables:
- id: TV001
  title: Recommendation Summary Table
  columns:
  - Dimension
  - Current view
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Public evidence supports plausibility but not obvious mispricing
    - Do not chase the name on headline valuation alone
  - - Confidence
    - Medium
    - Latest valuation evidence is still a talk range rather than a signed round
    - Underwrite with scenario ranges, not a single-point mark
  - - Risk rating
    - High
    - Regulatory history, credit complexity, and opaque round terms still matter
    - Require term-sheet and FY26 credit data before paying near the top end
  - - Valuation stance
    - Fair around $1.6-1.8B; stretched near $2.0B
    - The latest talk range is supportable, but not yet richly evidenced
    - Push for price or terms discipline if entry is near the rumoured cap
  - - Best-supported current band
    - Base case $1.6-2.0B
    - The latest reported 2026 range is $1.8-2.0B and Hurun confirms a >$1B floor
    - Anchor diligence around the range, not a fixed number
  - - Primary uncertainty
    - Capital-stack quality
    - No public term sheet shows dilution, preferences, or governance rights
    - Treat the headline valuation as incomplete until terms are visible
  notes: This table summarizes the investability of the current public mark rather than asserting a closed transaction price.
