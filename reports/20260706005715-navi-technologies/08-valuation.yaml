- id: capital-stack-and-operating-signals
  title: Capital-Stack and Operating Signals
  body: 'The supporting evidence for Navi’s valuation comes from business breadth and operating scale, but the weakening evidence
    comes from how that growth is being financed and supervised. Official pages show a broad product footprint across UPI,
    consumer loans, home loans, insurance, and mutual funds. Multiple July 2025 reports said FY24 revenue reached Rs 2,290
    crore with sharply higher profit, and the same coverage cited strong UPI activity. ET also reported Rs 3,000-4,000 crore
    in monthly disbursals and a profitable December 2025 quarter at Navi Finserv. But the same public file shows real drag:
    a 2024 RBI lending pause, a FY25 net loss at the broader group level, a 2025 NCD debt raise rather than fresh equity,
    and continuing disclosure around DLGs and NPA-sale notices. In other words, Navi has real scale, yet still carries capital-stack
    and credit-quality questions that matter directly for valuation quality.'
