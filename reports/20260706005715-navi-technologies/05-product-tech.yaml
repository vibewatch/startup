  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: tech-disclosure
    missingEvidence: Public architecture diagrams, API documentation, uptime history, and service-level metrics for the app shell, UPI, lending, and claims systems.
    whyItMatters: Navi’s public evidence proves breadth and compliance surfaces, but not how resilient, modular, or observable the underlying technology stack actually is.
    diligencePath: Request engineering architecture decks, service inventory, vendor map, uptime/SLA history, and incident-response summaries for each major module.
    relatedQuestionRefs:
    - QE017
    - QE018
    - QE023
    relatedTableRefs:
    - TE003
    - TE005
  - type: private-evidence-only
    severity: material
    topic: lending-underwriting
    missingEvidence: Approval-rate funnels, pricing bands by risk bucket, default and early-delinquency metrics, and the exact model or rules features used in cash-loan and home-loan underwriting.
    whyItMatters: The biggest recent regulatory issue in Navi’s product stack was around lending fairness and controls, but public materials still do not show whether risk controls are economically or operationally robust.
    diligencePath: Request credit-policy documents, scorecard descriptions, approval and decline waterfalls, and post-RBI remediation metrics by product and partner.
    relatedQuestionRefs:
    - QE007
    - QE008
    - QE020
    - QE021
    - QE025
    relatedTableRefs:
    - TE002
    - TE003
  - type: missing-source
    severity: material
    topic: module-usage-metrics
    missingEvidence: Current module-level attach rates, cross-sell rates, active-user counts, claim-SLA attainment, and error-rate or failure-rate metrics across UPI, insurance, lending, and wealth.
    whyItMatters: Without module-level usage and service metrics, it is hard to judge whether Navi is a deeply adopted superapp or a broad catalogue with uneven real usage across products.
    diligencePath: Ask management for monthly active users by module, cross-product overlap, claims turnaround distributions, UPI success-rate trendlines, and funnel conversion for lending and insurance.
    relatedQuestionRefs:
    - QE021
    - QE022
    - QE023
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
  - type: conflicting-data
    severity: minor
    topic: app-parity
    missingEvidence: A precise current feature matrix showing what is available inside the main app versus dedicated web properties, and whether Android and iOS package the same borrowing features.
    whyItMatters: Apple still merchandises borrowing while Android-focused descriptions and AppBrain’s synopsis emphasize payments, insurance, investments, and gold, creating ambiguity about live feature parity.
    diligencePath: Request current Android and iOS release notes, product-owner feature matrix, and screenshots or walkthroughs for each module across app and web entry points.
    relatedQuestionRefs:
    - QE006
    - QE022
    - QE023
    relatedTableRefs:
    - TE001
    - TE005
