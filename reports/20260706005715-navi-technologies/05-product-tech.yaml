- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Navi solution
  - Measurable / claimed benefit
  - Limitation
  rows:
  - - Send or receive money
    - Open app, choose contact or QR, complete UPI flow
    - Navi UPI
    - Instant transfers plus merchant payments, bills, and recharges
    - No public transaction-success or failure-rate series
  - - Make repeat small-value payments
    - Use lower-friction wallet-like payment flow
    - Navi UPI Lite
    - No PIN for low-value transactions and passbook-style tracking
    - Public detail is feature-level, not operational-metric level
  - - Buy now, settle later at a UPI merchant
    - Complete KYC, link Trezo to UPI, spend, then repay
    - Navi Trezo
    - Instant credit in 2 minutes according to official copy
    - Public economics and repayment performance are not disclosed
  - - Get an unsecured personal or cash loan
    - Upload identity and bank data, accept terms, set repayment mandate
    - Navi Finserv cash-loan flow
    - Rapid application promise and minimal documents in marketing
    - Real flow depends on KYC, partner lenders, and repayment controls
  - - Apply for a home loan
    - Fill form, upload income and property docs, clear verification and legal checks
    - Navi Finserv home-loan flow
    - Simple digital front door to a traditionally manual process
    - Process still requires heavy documentation and property diligence
  - - Buy insurance or file a claim
    - Select members and cover, provide KYC and policy details, use network hospitals or verification surfaces
    - Navi Health Insurance
    - Digital quote flow plus policy verification and marketed fast cashless claims
    - Callback, claims documentation, and network dependence keep the process partly assisted
  - - Invest or track wealth
    - Complete KYC/CKYC, choose schemes, set SIP or transact, optionally use money-manager tools
    - Navi Mutual Fund and money-manager surfaces
    - ₹100 entry point, flexible SIPs, same-day NAV claims, and unified dashboard pitch
    - No public evidence on advice quality, retention, or cross-sell depth
  notes: Benefits are mostly company-claimed or app-store claimed; the limitation column marks where public evidence stops short of operating proof.
