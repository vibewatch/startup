- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / disclosure
  - Status
  - Scope
  - Gap
  rows:
  - - RBI lending remediation after 2024 restriction
    - Visible in official RBI press release
    - Cash-loan and home-loan governance, especially pricing fairness and systems/process remediation
    - No public scorecard on whether the new controls improved outcomes
  - - RBI digital-lending framework
    - Current direction dated 2025-05-08
    - LSP due diligence, DLA reporting, privacy, disclosures, grievance, technology standards
    - Framework is external; Navi-specific implementation detail remains private
  - - Named DLA and LSP grievance officers
    - Public on lending grievance page
    - Borrower escalation for digital lending app and service-provider issues
    - No public complaint-volume or resolution-quality series
  - - Policy verification and IRDAI registration surfaces
    - Public on insurance verification and disclosure pages
    - Insurance trust surface and policy look-up
    - Verification proves existence and identity, not claim quality by cohort
  - - Board-approved policyholder-interest document
    - Public PDF with revision history through 2025
    - Insurance grievance, service timelines, and governance controls
    - Document is governance-heavy, not engineering-SLA heavy
  - - General app anti-fraud and cooling-off controls
    - Public in general app terms
    - UPI and app account security posture
    - No public fraud-loss or false-positive-rate disclosure
  - - Cyber-security awareness guidance
    - Public customer-facing notice
    - User hygiene against device, network, and social-engineering risks
    - Focuses on user behavior more than backend control evidence
  - - App-store privacy labels
    - Public on Apple App Store
    - Cross-app tracking and linked-data categories for the iPhone app
    - Privacy categories are broad and do not quantify internal retention or model use
  notes: Controls are strongest where regulation forces disclosure; most rows prove governance intent rather than day-to-day product reliability.
  claimRefs:
  - CE015
  - CE022
  - CE023
  - CE031
  - CE032
  - CE034
