- id: customer-journeys-and-onboarding
  title: Customer journeys and onboarding
  body: 'Navi’s customer journeys are product-specific and often more document-heavy than the simple brand promise suggests. UPI is the lightest flow: the official surface emphasizes transfers, merchant QR payments, transaction history, bill pay, recharge, and UPI Lite. Lending looks very different. The cash-loan and home-loan materials describe KYC-heavy flows with Aadhaar, PAN, bank details, address proof, and, for home loans, property and legal verification before sanction or disbursal. The personal-loan blog markets speed and low documentation, but the privacy and terms pages make clear that partner lenders, KYC, automated decisioning, and repayment mandates are core to the real workflow. Insurance sits in the middle: the health-insurance page and third-party onboarding guides suggest a mostly self-serve quote flow that still becomes document- and service-led when policies are issued or claims are filed. Mutual-fund onboarding likewise depends on standardized KYC and data-permission
    layers rather than pure zero-friction self-service.'
  claimRefs:
