tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Navi UPI and bill-pay rail
    - Mass-market retail users
    - Live and heavily merchandised
    - Combines P2P, merchant QR, bills, recharges, UPI Lite, and credit-card-on-UPI behavior in one payments surface
    - No public UPI success-rate trend, uptime history, or dispute-rate dashboard
  - - Navi Trezo pay-later layer
    - Credit-seeking payment users
    - Live but lightly disclosed
    - Links short-duration credit to UPI checkout rather than a separate card product
    - No public cohort quality, take-up, or partner-capital economics
  - - Cash-loan web / DLA
    - Borrowers seeking unsecured credit
    - Live with active policy refreshes
    - Markets speed and low documentation while routing through regulated lender and co-lending controls
    - No public approval funnel, pricing-by-cohort, or delinquency disclosure
  - - Home-loan web / DLA
    - Homebuyers and co-applicants
    - Live but document-heavy
    - Dedicated digital application surface for a property-backed credit workflow
    - No public turn-time, sanction-rate, or post-approval fallout metrics
  - - Health insurance
    - Retail insurance buyers and claimants
    - Live with rich trust surface
    - Fast digital quote flow plus visible policy verification and claims/governance disclosures
    - No public claims-distribution data or audited service-level dashboard
  - - Mutual funds and wealth tools
    - Retail investors
    - Live with strong documentation depth
    - Low-cost direct/index-fund positioning, ₹100 entry, SIP flexibility, document center, and formal AMC stack
    - No public module attach, retention, or advice-quality disclosure
  - - Digital gold and money-manager layer
    - Savings and tracking users
    - Visible in app-store and privacy surfaces
    - Expands from investing into lightweight savings and financial-management workflows
    - Public detail on exact feature depth, monetization, and feature parity is thin
  notes: Rows separate visible product breadth from the still-private adoption, economics, and reliability metrics needed to underwrite each module.
