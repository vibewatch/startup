- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key public evidence
  - Dependency
  - Risk
  rows:
  - - Shared brand and app shell
    - Consumer discovery, navigation, and cross-sell across financial products
    - About page, app terms, app-store listings
    - Depends on app stores and mobile platforms for distribution
    - Front-door unity can mask fragmented back-end product stacks
  - - Dedicated lending websites
    - Separate digital lending application surfaces for home and cash loans
    - DLA page plus home-loan and cash-loan legal docs
    - Depends on Navi Finserv, co-lending partners, and repayment rails
    - Borrowing experience may diverge from in-app merchandising
  - - KYC and identity-verification layer
    - Collects Aadhaar, PAN, bank details, address proof, OTPs, and related documents across modules
    - Loan, insurance, and wealth privacy disclosures
    - Depends on outside verification vendors and customer-document quality
    - Large privacy surface and onboarding friction
  - - Payments and credit rails
    - Supports UPI, UPI Lite, RuPay-on-UPI behavior, and Trezo-linked credit flows
    - UPI page, app-store copy, general terms
    - Depends on NPCI, PSP-bank controls, and partner lenders
    - Public metrics on success rates, fraud rates, and credit quality are absent
  - - Insurance trust and servicing stack
    - Handles policy verification, claims, grievance, and policyholder controls
    - Verify-policy page, public disclosure, policyholder-interest PDF
    - Depends on regulated insurer operations and hospital/service networks
    - Governance surfaces are visible, but runtime claims quality is only partially observable
  - - Wealth and fund-ops stack
    - Provides scheme access, documentation, KYC, and money-manager data features
    - Mutual-fund page, scheme-doc center, AMFI member page, investment privacy
    - Depends on AMC, trustee, registrar, custodian, and banking rails
    - Strong disclosure does not equal high engagement or advice quality
  - - Machine-readable mobile layer
    - Maps domains to Android packages and reflects current mobile release cadence
    - assetlinks.json and AppBrain metadata
    - Depends on mobile release management and store distribution
    - Shows distribution maturity, not internal service topology
  notes: This architecture table is limited to what public sources actually disclose; it should not be read as a full engineering diagram.
  claimRefs:
  - CE003
  - CE010
  - CE019
  - CE022
  - CE029
  - CE036
