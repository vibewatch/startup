- id: technical-and-operating-architecture
  title: Technical and operating architecture
  body: 'Navi publishes enough technical surface to prove distribution maturity, but not enough to fully expose internal architecture. The clearest machine-readable artifact is assetlinks.json, which names multiple Android package IDs across production and development builds. The DLA page also shows dedicated lending web properties under /hl and /pl, implying separate module surfaces behind the shared brand. Privacy, terms, and regulatory materials make the operating model legible at a systems level: co-lending partners matter in loans; insurers and hospital networks matter in claims; mutual-fund operations rely on trustee, AMC, registrar, and compliance functions; and app stores or mobile platforms are primary distribution rails. What is missing is the next layer down. There are no public API references, status pages, architecture diagrams, or service-observability disclosures that explain how payments, credit, insurance, and wealth are composed inside the stack. Publicly, Navi looks more
    like a consumer orchestration layer across multiple regulated workflows than an openly documented developer platform.'
  claimRefs:
  - CE003
  - CE009
  - CE010
  - CE019
  - CE029
  - CE036
