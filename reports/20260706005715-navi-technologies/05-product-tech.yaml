company:
  name: Navi Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Navi’s public product surface is a real multi-line consumer-finance stack spanning UPI, lending, insurance, and mutual funds, with large app-distribution signals and clear regulated-entity splits. The strongest evidence sits in front-door merchandising, legal/compliance surfaces, and insurance or mutual-fund documentation; the weakest evidence is around internal architecture, module attach, underwriting logic, and service-level metrics. That makes breadth easy to verify, but the underlying technology and operating quality only partially disclosed.
sections:
- id: superapp-breadth-and-packaging
  title: Superapp breadth and packaging
  body: Navi’s public product surface is broader than a single UPI or lending app. The company’s own About Navi page ties the brand to UPI, cash loans, home loans, health insurance, and mutual funds, while the current Android and iOS store listings package the experience as a finance superapp for paying, insuring, investing, and in some contexts borrowing. That breadth is real, but it is not disclosed as one clean software platform. The public evidence instead shows a bundle of regulated products stitched together behind one consumer brand. Lending is surfaced through Navi Finserv and dedicated lending application pages; insurance has its own trust and policy surfaces; mutual funds have a substantial document center and formal AMC stack. Even the UPI page extends beyond simple payments into UPI Lite, RuPay-credit-card-on-UPI behavior, and Navi Trezo pay-later language. The reader should therefore underwrite a broad product catalogue with a unifying front-door experience, not a fully transparent
    monolithic architecture.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE045
  - CE046
