  - id: buyer-user-payer-segmentation
    title: Buyer, User, and Payer Segmentation for the Underserved Indian Middle Class
    body: |
      The primary Navi buyer is the digitally active middle-class household, but that label contains at least five distinct jobs-to-be-done. First is the salaried, smartphone-first consumer who already uses digital payments and now wants cheaper wealth products, top-up health cover, or small-ticket credit without branch friction. In this segment, buyer, user, and payer are usually the same person, which favors self-serve onboarding and lowers sales cost. Second is the thin-file or self-employed borrower: still digitally reachable, but harder to underwrite with conventional bureau-only models. Here, Sahamati's AA network and RBI's ULI expansion matter because consented cash-flow data can improve underwriting beyond static bureau heuristics.

      Third is the household insurance decision-maker. IRDAI's data shows health insurance is still distributed mainly by brokers, agents, and direct offline channels, not by web aggregators or pure online sales. That implies the buyer is often the earning household member, the user is the broader family, and the payer can be either the household or an employer in group settings. The adoption path is trust-heavy: claims support, renewals, and perceived insurer credibility matter more than app UX alone. PB Fintech's emphasis on claims support and high CSAT illustrates that insurance distribution is service-led even when acquisition begins digitally.

      Fourth is the first-time or upgrading wealth investor. Navi's mutual-fund page emphasizes low-cost passive options, which naturally targets cost-aware SIP investors rather than high-touch wealth customers. Here the payer and user are again usually identical, but switching costs are higher than in payments because existing SIP mandates, taxation, and portfolio inertia slow migration. Zerodha's scale shows that this low-cost digital investing segment is already crowded with incumbents that have large embedded customer and asset bases. Fifth is the merchant/payee ecosystem, which is not the primary buyer for Navi's current disclosed products but is still relevant because merchant acceptance and payment data create downstream credit and cross-sell signals. Paytm's merchant GMV and merchant-loan disclosures show how that funnel works at scale; the strategic takeaway for Navi is that merchant relevance is indirect but real. Across insurance and credit shopping, Policybazaar and BankBazaar also illustrate that comparison and free-score tools can capture consumer intent before a lender or insurer owns the relationship.
