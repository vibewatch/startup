  evidenceGaps:
    - type: missing-source
      severity: material
      topic: digital-lending-tam
      missingEvidence: Current official India-wide digital consumer-lending originations or receivables split by app-led lenders, banks, and NBFCs.
      whyItMatters: Without a canonical digital-lending market series, any lending TAM/SAM number for Navi risks mixing broad retail credit with the much narrower app-led share.
      diligencePath: Pull RBI supervisory tables or industry datasets that isolate digital-lending originations by channel and lender type, then reconcile them against peer public disclosures.
      relatedQuestionRefs:
        - QM021
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: navi-som
      missingEvidence: Navi-specific active borrowers, in-force health premium, mutual-fund AUM, retention, take rates, and product-level conversion cohorts.
      whyItMatters: Public proxies can anchor market structure, but they cannot produce a defensible SOM or product-level valuation bridge for Navi without internal operating data.
      diligencePath: Request Navi management data room exports for monthly active customers, disbursals, AUM, premium, renewals, CAC, and contribution by product.
      relatedQuestionRefs:
        - QM022
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: payments-vs-revenue-tam
      missingEvidence: A consistent bridge from UPI throughput to monetizable revenue under zero-MDR, subscription, and incentive assumptions.
      whyItMatters: Payments can dominate user behavior while contributing little standalone gross margin, which materially changes how much value should be assigned to a payments-led funnel.
      diligencePath: Build a management-verified revenue bridge from processing volume to basis-point margin, subscription revenue, incentive revenue, and downstream cross-sell contribution.
      relatedQuestionRefs:
        - QM018
        - QM026
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: insurance-digital-share
      missingEvidence: More granular IRDAI or insurer-level digital-channel splits beyond the broad direct-online and web-aggregator categories.
      whyItMatters: Today's 1.68% online share may understate the future opportunity, but without more granular channel data it is hard to separate assisted-digital growth from pure online penetration.
      diligencePath: Request channel-wise premium data from Navi and benchmark against listed insurers or IRDAI channel tables if/when expanded.
      relatedQuestionRefs:
        - QM019
      relatedTableRefs:
        - TM002
