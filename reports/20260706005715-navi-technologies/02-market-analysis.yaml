    title: Navi Market Stack — From Digital-Finance TAM to Navi-Relevant SAM
    type: pyramid
    layout: wide
    summary: Headline Indian fintech pools are very large, but the Navi-relevant slices narrow sharply
      once channel share, product mix, and monetization model are applied.
    data:
      nodes:
        - label: 'Digital-finance reach TAM'
          value: '1,092.79m internet subscribers / 78% adults banked'
          detail: 'TRAI and World Bank show the population-wide digital reach that can be onboarded into financial products.'
        - label: 'Payments engagement layer'
          value: '₹300 lakh crore UPI value in CY2025'
          detail: 'UPI creates habitual payment behavior and data exhaust, but not automatically a rich standalone revenue pool.'
        - label: 'Monetizable product pools'
          value: 'MF AUM ₹81.58 lakh crore; health premium ₹1.18 lakh crore; digital-credit proxies from peer disbursals'
          detail: 'Wealth, insurance, and lending are the pools where Navi can earn fees, spreads, or product margins.'
        - label: 'Constrained Navi SAM'
          value: 'Passive MF subset ~₹11.70 lakh crore; direct-online health ~₹1,974 crore premium proxy; lending SAM still under-specified'
          detail: 'Applying AMFI passive sub-segments and IRDAI digital-channel shares narrows SAM materially; public digital-lending TAM remains a diligence gap.'
