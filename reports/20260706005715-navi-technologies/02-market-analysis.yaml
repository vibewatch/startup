callouts:
  - calloutType: risk
    title: UPI Throughput Is Not the Same Thing as Payments Revenue TAM
    body: >-
      RBI's ₹300 lakh crore UPI value confirms that India is a giant digital-payments market, but Paytm's
      public filings show monetization still sits in basis-point payment margins, merchant subscriptions,
      selected MDR-bearing instruments, and cross-sell. Any Navi model that treats raw UPI value as directly
      monetizable revenue will materially overstate payments economics.
    claimRefs:
      - CM003
      - CM042
      - CM055
      - CM058
  - calloutType: insight
    title: Passive Wealth, Not Total Mutual-Fund AUM, Is the Cleaner Navi SAM
    body: >-
      Total Indian mutual-fund AUM is above ₹81 lakh crore, but the passive and low-cost-adjacent categories
      that match Navi's disclosed mutual-fund positioning are about ₹11.70 lakh crore, or roughly 14.3% of the
      total. That is still a large pool, but it is dramatically narrower than a headline total-AUM TAM slide.
    claimRefs:
      - CM010
      - CM012
      - CM013
      - CM014
      - CM015
      - CM053
  - calloutType: risk
    title: Digital Insurance Is Large in Premium but Still Thinly Digital in Channel Share
    body: >-
      IRDAI's FY2024-25 data shows health-insurance premium at ₹1,17,505 crore, but only 1.68% came through
      direct online sale and only 0.05% through web aggregators. The constraint is therefore not total demand;
      it is trust, servicing, and channel conversion.
    claimRefs:
      - CM018
      - CM020
      - CM054
      - CM057
      - CM060
  - calloutType: insight
    title: Underwriting Expansion Depends More on Consent Infrastructure Than on App Downloads
    body: >-
      Sahamati's AA network counts and RBI's ULI expansion both point in the same direction: the next leg of
      digital lending adoption comes from better consented data and underwriting quality, not just larger ad budgets.
      That is especially relevant for the underserved middle class and self-employed borrowers who do not fit cleanly
      into bureau-first scorecards.
    claimRefs:
      - CM030
      - CM031
      - CM040
