  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Public price / unit / contract model
      - Included capabilities in source set
      - Discounts / unknowns
      - Implication
    rows:
      - - Judi Rx / Judi Health
        - Flat administrative fee per claim; no spread pricing; no retained rebates
        - Transparent PBM, full data access, unified claims and benefit workflows on Judi platform
        - Absolute fee level, implementation pricing, and realized savings are undisclosed
        - Public materials support an alignment story, but not a quantified cost-advantage story
      - - Big Three incumbent PBMs
        - Not publicly disclosed in assigned evidence
        - Scaled PBM claims processing and existing enterprise relationships
        - Rebate retention, spread, guarantees, and audit rights are not observable in this pool
        - Switch economics must be diligenced from contracts, not inferred from public positioning
      - - Prime Therapeutics
        - Pass-through PBM model disclosed; admin-fee details not public here
        - PBM services for Blues and employer groups; announced use of Judi as adjudication platform
        - No public fee card; Express Scripts relationship can affect underlying economics
        - Most relevant public analog to Judi's alignment story, but still incomplete for underwriting
      - - Smaller independent PBMs
        - Not publicly disclosed in assigned evidence
        - Alternative front-end contracting proposition for plan sponsors
        - Public pool does not show whether claims, network, or rebate economics are outsourced
        - Independent branding does not guarantee independent economics
      - - Legacy / patchwork status quo
        - Internal staffing plus multiple vendor contracts rather than one transparent rate card
        - Keeps current core admin stack and point solutions in place
        - Total cost of ownership and manual-work cost are not quantified in assigned evidence
        - The status quo competes on inertia, not on a simple published contract model
    notes: >-
      This table distinguishes contract structure from contract value. The assigned sources disclose pricing mechanics
      for Judi, but not comparable fee cards for the main alternatives.
