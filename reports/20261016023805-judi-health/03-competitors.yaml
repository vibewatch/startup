company:
  name: Judi Health
chapter:
  number: 3
  title: Competitors
  summary: >-
    Judi competes on two planes at once: as a transparent PBM replacement and as a broader claims-administration
    platform for employers, TPAs, and health plans. The strongest public competitive risk is not another transparent
    challenger alone, but the persistence of Big Three PBM economics and legacy admin stacks that can stay embedded even
    when a buyer appears to switch.
sections:
  - id: landscape-scope
    title: Competitive set spans incumbents, transparent challengers, and the status quo
    body: >-
      The public record in this pool points to a broader competitive set than a simple PBM head-to-head. Judi presents
      itself as a transparent PBM, a full-service benefit administrator, and a licensable claims platform for health
      plans and TPAs, which means the buyer can compare it against incumbent PBMs, pass-through alternatives,
      software-led partners such as Prime plus Judi, and the status quo of keeping legacy claims infrastructure in
      place. Drug Channels shows why the incumbent class still matters: CVS Caremark, Express Scripts, and Optum Rx
      processed an estimated 80% of equivalent prescription claims in 2025, while smaller PBMs often still depend on
      those same larger firms for claims, network, or rebate functions. That mix makes the real decision less about a
      single named rival and more about whether a buyer wants to replace, bypass, or continue layering around entrenched
      infrastructure.
    claimRefs:
      - CP003
      - CP004
      - CP007
      - CP008
      - CP009
      - CP010
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: differentiation
    title: Judi differentiates on incentive alignment plus operating-system breadth
    body: >-
      Judi's clearest public differentiation is the combination of transparent PBM economics and broader claims-platform
      scope. On the PBM side, the company discloses a flat administrative fee, no spread pricing, no retained rebates,
      and full data access. On the platform side, the same public materials say Judi can adjudicate medical, pharmacy,
      vision, and dental claims on one system and can also be licensed directly to health plans and TPAs. That pairing
      is strategically important because many alternatives compete on only one axis: pass-through economics without deep
      platform control, or infrastructure tooling without a directly aligned PBM contract model. The partner evidence
      from Transformation Capital and Prime-related references reinforces that Judi is trying to win accounts not only
      by changing pricing mechanics, but also by replacing the fragmented operating stack around claims, reporting, and
      benefit administration.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP013
      - CP015
    tableRefs:
      - TP002
  - id: incumbent-power-and-switching-costs
    title: Incumbent power and migration friction cap moat durability
    body: >-
      The moat question is therefore mixed. Judi can tell a differentiated story, but the same source set shows how hard
      the market is to dislodge. Drug Channels argues that many smaller PBMs still rely on larger competitors for claims
      processing, network management, and rebate negotiation, so a buyer can appear to switch while leaving Big Three
      economics in the background. Judi's own enterprise-platform discussion also underscores that the status quo is
      sticky: buyers often run old core administrative systems with added point solutions, and migrations can require
      phased coexistence rather than a clean overnight cutover. That combination means Judi's displacement risk is not
      just head-to-head pricing pressure from another transparent PBM. It is also incumbent distribution power,
      outsourcing dependencies, and the operational burden buyers face when replacing core claims infrastructure.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
      - CP011
      - CP012
  - id: pricing-and-proof-gaps
    title: Public pricing proof remains thin despite strong positioning claims
    body: >-
      Judi's public materials are more explicit about contract structure than most peers in this pool, but the pricing
      comparison is still shallow by investment-grade standards. Judi discloses the shape of its model; peers and
      substitutes mostly do not disclose contract-level fees, realized savings, or total-cost-of-ownership data in the
      assigned evidence. Even Judi's strongest public adoption survey is not a neutral benchmark, because the cited 2026
      survey was conducted by Employee Benefit News in partnership with Judi Rx. As a result, the current evidence
      supports the direction of Judi's positioning and identifies which competitor classes matter most, but it does not
      yet support a quantified conclusion on whether Judi wins primarily on lower all-in economics, superior workflow
      breadth, or some combination of both in live competitive bake-offs.
    claimRefs:
      - CP001
      - CP014
      - CP015
    tableRefs:
      - TP003
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / alternative
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Judi Health / Judi Rx
        - Direct peer / platform-led challenger
        - >-
          >5M contracted employer PBM lives, >1M live members as of 2026-01-01; >54M health plan lives contracted on
          platform (company-claimed across releases)
        - Self-insured employers, TPAs, health plans
        - Flat-fee transparent PBM plus unified claims platform and software licensing motion
        - Public fee levels and realized customer economics remain undisclosed
      - - Big Three PBMs (CVS Caremark, Express Scripts, Optum Rx)
        - Incumbent PBMs
        - Drug Channels estimates they processed 80% of equivalent prescription claims in 2025
        - Large employers, health plans, government and commercial programs
        - Entrenched scale, existing client relationships, and behind-the-scenes service reach
        - Public evidence here does not provide transparent contract economics or auditability terms
      - - Prime Therapeutics
        - Pass-through PBM / strategic route
        - >-
          23 Blue Cross and Blue Shield plans; >2M non-Blues and self-funded employer lives; invested $115M in JUDI in
          2024
        - Blues plans, non-Blues health plans, self-funded employer groups
        - Pass-through model plus announced use of JUDI as adjudication platform
        - Relationship can blur line between partner, channel, and competing alternative
      - - Smaller independent PBMs
        - Adjacent transparent / independent cohort
        - Gaining business at the margins, but many still rely on larger PBMs for claims, network, and rebate functions
        - Plan sponsors seeking alternatives to Big Three contracts
        - Can market as alternatives to traditional PBMs
        - Back-end dependence can leave incumbent economics inside the solution
      - - Legacy internal build / patchwork CAPS
        - Status-quo substitute / internal build
        - Often built on 20-year-old chassis with multiple bolted-on systems
        - Health plans and TPAs reluctant to migrate core admin systems
        - Avoids immediate rip-and-replace disruption and preserves current workflows
        - Manual workarounds, brittle integrations, and slower innovation remain embedded
      - - Point-solution stack on top of legacy
        - Adjacent substitute / likely entrant set
        - Proliferation of single-function vendors for prior auth, pricing, payments, and member experience
        - Plans and TPAs patching specific problems without replacing the core
        - Can improve one workflow without full platform replacement
        - Adds vendors and integrations without fixing the root adjudication platform
    notes: >-
      Scale and pricing cells preserve the source vocabulary. "Unknown" or qualitative entries indicate that the
      assigned public pool does not disclose a contract-level number for that competitor class.
