callouts:
  - calloutType: strength
    title: Broader than a PBM carve-out
    body: >-
      Judi's public materials consistently pitch both a transparent PBM contract and a broader claims-platform product,
      giving it more ways into an account than a carve-out PBM alone.
    claimRefs:
      - CP002
      - CP003
      - CP004
  - calloutType: risk
    title: Big Three economics can survive a surface-level switch
    body: >-
      Drug Channels' outsourcing commentary means a buyer can choose an alternative PBM brand while still leaving
      claims, network, or rebate economics tied to the incumbent stack.
    claimRefs:
      - CP007
      - CP008
  - calloutType: assumption
    title: Public pricing evidence is still too shallow for TCO certainty
    body: >-
      Judi publishes pricing mechanics, but the assigned pool does not disclose contract-level competitor fee cards or
      audited savings, so relative cost superiority still requires direct diligence.
    claimRefs:
      - CP001
      - CP014
      - CP015
