figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal 1-5 scoring from the assigned public evidence places Judi at the high-alignment / high-breadth end of the
      alternatives reviewed, while incumbent PBMs retain the strongest scale position but not the clearest transparency
      signal.
    data:
      points:
        - label: Judi Health / Judi Rx
          x: 5
          'y': 5
          detail: Flat-fee transparent PBM plus unified claims platform and licensing motion.
        - label: Prime + Judi route
          x: 4
          'y': 4
          detail: Pass-through PBM model with announced Judi adjudication-platform relationship.
        - label: Smaller independent PBMs
          x: 4
          'y': 2
          detail: Alternative front end, but outsourcing can leave incumbent economics in place.
        - label: Big Three incumbents
          x: 2
          'y': 3
          detail: Massive processing share and enterprise reach, but public alignment terms are not disclosed here.
        - label: Point-solution overlays
          x: 3
          'y': 2
          detail: Can solve a workflow without replacing the core, but add vendors and integrations.
        - label: Legacy internal build / patchwork
          x: 2
          'y': 1
          detail: Buyer-controlled status quo with the lowest architecture coherence in the evidence set.
    approximationNotes: >-
      Ordinal 1-5 scores summarize two dimensions inferred from the cited sources: x = economic alignment /
      auditability, y = breadth of the operating system around claims and benefits. They indicate relative positioning,
      not measured market share or benchmarked feature counts.
