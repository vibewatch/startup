  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-comparability
      missingEvidence: >-
        Contract-level admin fees, guarantee structures, rebate-retention terms, and migration-cost data for Judi,
        Prime, Big Three alternatives, and status-quo replacements.
      whyItMatters: >-
        The public pool supports directionally different pricing mechanics, but it does not support a quantified
        total-cost-of-ownership comparison across the real buying alternatives.
      diligencePath: >-
        Request live customer proposals or redlined contracts from Judi and at least one incumbent and one pass-through
        alternative, then compare realized fees, guarantees, and implementation cost.
      relatedQuestionRefs:
        - QP008
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: independent-win-loss-benchmarking
      missingEvidence: >-
        Independent customer win-loss data or procurement records showing why buyers chose Judi over Big Three
        incumbents, Prime, or other independents.
      whyItMatters: >-
        Moat durability depends on whether Judi wins on economics, platform breadth, service quality, or channel
        relationships; the current pool mostly reflects company and partner framing.
      diligencePath: >-
        Obtain customer references, RFP scoring sheets, or independent trade reporting on competitive replacements and
        retained-incumbent reasons for recent Judi deals.
      relatedQuestionRefs:
