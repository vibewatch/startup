company:
  name: "Judi Health"
chapter:
  number: 6
  title: "Customers"
  summary: "Judi Health shows real customer breadth across self-insured employers, plans, TPAs, and institutional channels, with scale claims stepping from more than 4 million employer PBM members in September 2025 to more than 5 million contracted employer PBM lives in January 2026 and more than 50 million combined PBM/PBA lives by July 2026. The quality of proof is weaker than the topline counts: named references are mostly company-curated testimonials or partner quotes, while public churn, renewal, concentration, and contract-economics disclosure remains thin."
sections:
  - id: "customer-base-and-segmentation"
    title: "Customer base spans employer, payer, and institutional buyers"
    body: |-
      Judi's public customer story is broader than a single PBM wedge. The official surfaces and recent coverage consistently show three buying motions: transparent pharmacy benefit management for self-insured employers, broader benefit-administration programs for employers and health plans, and direct platform licensing for health plans and TPAs. The January 2026 growth release adds institutional texture to that story by citing Fortune 500 employers, hospital groups, state employee plans, municipalities, and universities rather than only generic "lives" metrics. That breadth matters because it suggests the company is not relying on one narrow channel, but the public material still stops short of telling readers which channels carry the most revenue, best retention, or fastest payback.
    claimRefs: ["CU001", "CU006", "CU007", "CU009"]
    tableRefs: ["TU001"]
  - id: "adoption-trajectory"
    title: "Adoption metrics indicate real breadth, but denominators are mixed"
    body: |-
      The public trajectory shows meaningful scale, but the reported measures are not perfectly comparable. September 2025 coverage around the rebrand described more than 4 million employer PBM members and a broader Judi platform footprint above 54 million beneficiaries or contracted health-plan lives. The January 2026 company release then moved to more than 5 million contracted employer PBM lives, more than 1 million live members as of January 1, 2026, two million new health-plan lives contracted and implemented in 2025, and more than 80 new partnerships for the second straight year. By July 2026, Fierce Healthcare reported more than 50 million lives across Judi's combined PBM and pharmacy-benefit-administrator clientele. Together those figures point to real commercial traction, but they mix contracted lives, live members, employer-PBM lives, and broader platform or combined-benefit populations, so investors should not treat them as one clean conversion funnel.
    claimRefs: ["CU002", "CU003", "CU004", "CU005", "CU006", "CU008", "CU015"]
    tableRefs: ["TU002"]
    figureRefs: ["FU001"]
  - id: "proof-durability-and-concentration"
    title: "Named proof exists, but durability and concentration remain under-disclosed"
    body: |-
      Judi does have named proof, but most of it is testimonial-style rather than case-study style. The strongest public references are quotes from Prime Therapeutics, Baylor Scott & White Health Plan, Subaru of Indiana Automotive, Southern New England Healthcare Organization, and Teamsters Health and Welfare Fund, plus one official podcast example of a 2026 Judi Cloud migration. What is missing is the durability layer that would turn these logos into underwritten customer quality: no source in the assigned pool discloses NRR, GRR, churn, contract duration, top-customer concentration, or customer-level revenue mix, and even the Judi Rx page's service-proof fields do not yield usable public retention or NPS values in fetched text. The result is a customer chapter with enough evidence to believe adoption is real, but not enough to treat the customer base as fully proven on renewal economics or concentration risk.
    claimRefs: ["CU010", "CU011", "CU012", "CU013", "CU014"]
    tableRefs: ["TU003"]
