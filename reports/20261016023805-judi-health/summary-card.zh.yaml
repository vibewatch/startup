  topStrengths:
    - 透明、固定费用的 PBM 模式，并配套更广泛的健康福利工作流软件。
    - 规模信号有分量：签约雇主覆盖人数超过 500 万，新增合作伙伴超过 80 家。
    - 通过 Judi Care 和 Judi Cloud 延伸平台边界，且由创始人亲自推动执行。
  topRisks:
    - 收入、利润率和现金跑道仍未披露。
    - 这套叙事高度依赖公司发布的证据和以创始人为中心的执行。
    - PBM 及价差定价监管可能压缩经济效益。
  unresolvedGaps:
    - FY2024 和 FY2025 的管理费净收入、毛利率和贡献利润率仍未披露。
    - 约 400 万名递延签约雇主 PBM 覆盖成员的实际成员爬坡轨迹，以及相应的收入确认时间表，仍不足以量化递延管线价值。
    - Prime Therapeutics 技术许可费的经济效益、EHP SaaS 收入的整体贡献，以及收购 Amino Health 后 Judi Care 的运行率收入。
    - Series F 后的现金跑道、月度烧钱速度，以及在不再进行股权融资的情况下实现经营盈亏平衡的资本充足路径。
