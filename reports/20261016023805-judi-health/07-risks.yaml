callouts:
  - calloutType: "risk"
    title: "Why regulation remains the top-of-stack risk"
    body: >-
      Judi's stated transparent, pass-through model points in the same direction
      as federal PBM reform, but commercial, employer, and Medicaid
      spread-pricing policy remains unfinished. Judi therefore has to prove both
      aligned incentives and durable compliance execution.
    claimRefs: ["CR001", "CR002", "CR003", "CR004"]
  - calloutType: "recommendation"
    title: "Top kill criteria"
    body: >-
      Treat the thesis as broken or re-price materially if management cannot
      reconcile contracted, implemented, and live-life counts to one KPI set;
      if major partner-led migrations slip or reverse; or if the security and
      compliance pack lacks current third-party assurance and regulator-ready
      controls.
    claimRefs: ["CR006", "CR008", "CR012", "CR016"]
  - calloutType: "assumption"
    title: "Capital does not remove underwriting risk"
    body: >-
      Recent financing reduces immediate capital-pressure concerns, but the
      public $3.25B reference point comes from a private-market data source that
      disclaims audit and independent verification. Underwriting still depends
      on diligence-quality unit economics rather than the headline mark alone.
    claimRefs: ["CR010", "CR013", "CR014"]
