  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public scale proof and platform breadth are real, but missing economics and active PBM policy scrutiny keep the
      recommendation at Track.
    data:
      nodes:
        - id: proof
          label: Scale proof
          value: '>50M contracted PBM/PBA lives; >5M contracted employer lives; >1M live employer members'
          note: All scale metrics are company-reported rather than independently audited.
        - id: platform
          label: Platform breadth
          value: Judi Rx + Judi Care + Judi Cloud
          note: The company is positioning for PBM, benefits administration, and software licensing.
        - id: model
          label: Business model
          value: Transparent pass-through PBM with platform-led expansion
          note: Public materials support alignment claims more clearly than profit disclosure.
        - id: policy
          label: External pressure
          value: PBM reform and spread-pricing scrutiny remain active
          note: AMA still flags structural concerns that could pressure sector economics.
        - id: disclosure
          label: Missing underwriting inputs
          value: No public admin-fee revenue, margin, runway, or cap-table terms
          note: These omissions block a numeric valuation call.
        - id: call
          label: Recommendation
          value: Track / medium confidence / high risk / research more
          note: Upgrade only after management evidence closes the underwriting gaps.
      edges:
        - from: proof
          to: platform
          label: Commercial traction supports expansion story
        - from: platform
          to: model
          label: Breadth can improve revenue quality if monetized well
        - from: model
          to: call
          label: Potential upside exists
        - from: policy
          to: call
          label: Sector scrutiny raises downside dispersion
        - from: disclosure
          to: call
          label: Missing economics prevent a priced conviction call
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV010
      - CV012
      - CV013
