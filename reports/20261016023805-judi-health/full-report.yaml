              - CO012
      - number: '1.2'
        title: Leadership and governance concentration
        blocks:
          - type: paragraph
            body: >-
              Leadership remains founder-centric. Loiacono still anchors the company's public narrative around
              transparency, customer trust, and the anti-spread-pricing thesis, while Kelly remains the technical
              co-founder associated with building the Judi platform. The retained sources support strong founder-market
              fit, but they do not provide the same visibility into governance mechanics. Public disclosures make the
              investor roster and product story much easier to verify than board composition, protective provisions, or
              executive depth beyond the founders. That leaves a classic late-stage diligence question: how much of
              Judi's execution still depends on a small group that is unusually central to both the story and the
              product architecture.
