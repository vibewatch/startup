      - number: '3.2'
        title: Judi differentiates on incentive alignment plus operating-system breadth
        blocks:
          - type: paragraph
            body: >-
              Judi's clearest public differentiation is the combination of transparent PBM economics and broader
              claims-platform scope. On the PBM side, the company discloses a flat administrative fee, no spread
              pricing, no retained rebates, and full data access. On the platform side, the same public materials say
              Judi can adjudicate medical, pharmacy, vision, and dental claims on one system and can also be licensed
              directly to health plans and TPAs. That pairing is strategically important because many alternatives
              compete on only one axis: pass-through economics without deep platform control, or infrastructure tooling
              without a directly aligned PBM contract model. The partner evidence from Transformation Capital and
              Prime-related references reinforces that Judi is trying to win accounts not only by changing pricing
              mechanics, but also by replacing the fragmented operating stack around claims, reporting, and benefit
              administration.
            claimRefs:
              - CP001
              - CP002
