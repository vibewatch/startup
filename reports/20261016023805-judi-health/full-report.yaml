  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Judi packages buyer-facing benefit products on top of a shared claims, workflow, and reporting core that can be
      deployed directly or licensed through Judi Cloud.
    data:
      layers:
        - label: Buyer and user surfaces
          detail: Commercial programs sold to employers, health plans, TPAs, and member-support teams.
          modules:
            - Employer benefit administration
            - Health-plan / TPA operations
            - Member navigation workflows
        - label: Commercial product brands
          detail: Packaging layers that map the same platform to different commercial entry points.
          modules:
            - Judi Rx
            - Judi Health
            - Judi Care
            - Judi Cloud
        - label: Judi core platform
          detail: Shared cloud-native engine Judi says handles claims and adjacent administrative workflows.
          modules:
            - Pharmacy and medical claims adjudication
            - Eligibility and payments
            - Analytics and AI-enhanced workflows
        - label: Reporting and visibility
          detail: Data and reporting layer Judi uses to differentiate enterprise transparency.
          modules:
