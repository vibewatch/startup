  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base spans employer, payer, and institutional buyers
        blocks:
          - type: paragraph
            body: >-
              Judi's public customer story is broader than a single PBM wedge. The official surfaces and recent coverage
              consistently show three buying motions: transparent pharmacy benefit management for self-insured
              employers, broader benefit-administration programs for employers and health plans, and direct platform
              licensing for health plans and TPAs. The January 2026 growth release adds institutional texture to that
              story by citing Fortune 500 employers, hospital groups, state employee plans, municipalities, and
              universities rather than only generic "lives" metrics. That breadth matters because it suggests the
              company is not relying on one narrow channel, but the public material still stops short of telling readers
              which channels carry the most revenue, best retention, or fastest payback.
            claimRefs:
              - CU001
              - CU006
              - CU007
