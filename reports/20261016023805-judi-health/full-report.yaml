        title: Exhibits
        blocks:
          - type: callout
            title: Market demand is visible before monetization quality is
            body: >-
              Public evidence shows real buyer pain and real Judi adoption, but it still does not reveal how quickly
              contracted lives convert, what mix is partner-dependent, or what admin-fee revenue and margin each segment
              yields. That keeps the market thesis investable as a demand story, but only partially underwritten as a
              unit-economics story.
