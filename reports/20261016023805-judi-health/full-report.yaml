      - number: '1.4'
        title: Milestones and regulatory context
        blocks:
          - type: paragraph
            body: >-
              Judi's recent milestones support the thesis that it wants to become a broader benefits-infrastructure
              company rather than remain only a transparent PBM challenger. The public chronology runs from seed funding
              and later platform-build capital to 2024 recognition for growth, the 2025 Judi Health rebrand, and the
              January 2026 disclosure that it had added another wave of partnerships while integrating Amino Health and
              Judi Care. That expansion still sits inside a policy environment that remains hostile to opaque PBM
              economics. FTC settlements and the AMA's 2026 reform brief both point to continued scrutiny of spread
              pricing, transparency, and concentrated PBM market structure, which helps Judi's sales narrative but also
              keeps the sector under regulatory pressure.
