      - number: '6.2'
        title: Adoption metrics indicate real breadth, but denominators are mixed
        blocks:
          - type: paragraph
            body: >-
              The public trajectory shows meaningful scale, but the reported measures are not perfectly comparable.
              September 2025 coverage around the rebrand described more than 4 million employer PBM members and a
              broader Judi platform footprint above 54 million beneficiaries or contracted health-plan lives. The
              January 2026 company release then moved to more than 5 million contracted employer PBM lives, more than 1
              million live members as of January 1, 2026, two million new health-plan lives contracted and implemented
              in 2025, and more than 80 new partnerships for the second straight year. By July 2026, Fierce Healthcare
              reported more than 50 million lives across Judi's combined PBM and pharmacy-benefit-administrator
              clientele. Together those figures point to real commercial traction, but they mix contracted lives, live
              members, employer-PBM lives, and broader platform or combined-benefit populations, so investors should not
              treat them as one clean conversion funnel.
            claimRefs:
              - CU002
              - CU003
              - CU004
