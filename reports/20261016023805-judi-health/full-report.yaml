      - number: '4.3'
        title: Capital adequacy remains the main underwriting blocker
        blocks:
          - type: paragraph
            body: >-
              The clearest positive funding datapoint is the September 2025 financing: Capital Rx announced a $400
              million investment, including a $252 million Series F, and said the proceeds would scale PBM operations,
              teams, and the enterprise platform. That materially reduces near-term existential risk, but public
              materials still do not disclose the post-close cash balance, monthly burn, debt or covenant obligations,
              or the revenue ramp needed to avoid another equity round. Sector context cuts both ways for margins. The
              2026 AMA PBM reform brief supports Judi's pass-through positioning by noting that Medicare Part D now
              delinks PBM compensation from drug price and requires pass-through of rebates and concessions to plan
              sponsors, yet it also warns that spread pricing remains permissible in commercial, employer-sponsored, and
              Medicaid markets. The financial verdict is therefore favorable on model design, but still incomplete on
              realized revenue quality, margin path, and runway.
            claimRefs:
              - CI005
              - CI006
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Aligned design is visible before realized economics are
            body: >-
              Judi's public PBM positioning is financially attractive because it says revenue is tied to a flat admin
              fee rather than to spread pricing or retained rebates, but investors still lack the realized fee levels
              and revenue mix needed to convert that design claim into a margin forecast.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI012
          - type: callout
            title: Series F reduced existential risk, not diligence opacity
            body: >-
              The $400 million financing is meaningful, yet the public record still does not disclose cash on hand,
              burn, runway, or financing obligations, so the next-round trigger and capital adequacy remain unresolved.
            calloutType: risk
            claimRefs:
