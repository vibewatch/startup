              - CR005
              - CR006
              - CR015
      - number: '7.3'
        title: Implementation and partner dependence
        blocks:
          - type: paragraph
            body: >-
              Judi's operating risk is concentrated in deployment quality and partner dependencies. The company says it
              has more than five million contracted employer lives, more than one million live members as of January
              2026, and 80-plus partnerships for the second straight year, which proves demand but also implies a large
              implementation burden. Public milestones specifically call out migrations to Prime Therapeutics' instance
              of Judi and a program involving Prime, Amazon Pharmacy, and a large nonprofit insurer, showing that part
              of the current growth story runs through counterparties Judi does not fully control. Management's own
              interview language reinforces the point: core-system migrations are still treated as a large
              transformation, and the mitigation is phased rollout rather than a claim that the risk has disappeared.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
