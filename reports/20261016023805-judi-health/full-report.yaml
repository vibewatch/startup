      - number: '1.3'
        title: Capitalization and scale signals
        blocks:
          - type: paragraph
            body: >-
              The funding history is unusually visible for a private company. PMF Show and company materials together
              outline a path from a $3.5 million seed round in 2018 to a $106 million Series C in 2022, a strategic
              round of more than $50 million in 2023, and the September 2025 rebrand financing that reportedly doubled
              valuation to $3.25 billion. Scale markers are also concrete, but they remain management-selected. Judi
              disclosed more than 4 million employer PBM members and more than 54 million contracted health-plan lives
              in September 2025, then said in January 2026 that contracted employer lives had surpassed 5 million with
              more than 1 million members already live. Those are meaningful signals, but they are not substitutes for
              disclosed revenue, margin, or customer-retention economics.
