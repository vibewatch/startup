  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - Evidence basis
      - What would change the view
    rows:
      - - Thesis
        - Scaled commercial proof
        - >-
          Company-reported >50M contracted PBM/PBA lives, >5M contracted employer PBM lives, and >1M live employer
          members indicate real distribution and implementation traction.
        - >-
          Upgrade only if management ties these scale metrics to disclosed net revenue, gross margin, and renewal
          durability.
      - - Thesis
        - Broader platform surface
        - >-
          Judi Rx, Judi Care, and Judi Cloud create a cross-sell and software-licensing narrative beyond a stand-alone
          PBM.
        - >-
          The thesis strengthens if management shows software or platform revenue with higher incremental margins than
          core administration.
      - - Thesis
        - Aligned pricing model
        - >-
          Public materials continue to position Judi as a transparent, pass-through PBM aimed at reducing hidden
          intermediary economics.
        - >-
          The view improves if customers verify savings persistence and auditability at scale through independent
          references.
      - - Anti-thesis
        - Economic proof still missing
        - >-
          The retained public record does not disclose admin-fee revenue, contribution margin, runway, or cap-table
          seniority, so valuation support remains mostly narrative.
        - >-
          The anti-thesis weakens only when management provides current economics and downside-protection terms that
          convert the story into underwritable cash flow.
    notes: >-
      Arguments are directional rather than scored; rows separate strategic upside from the specific disclosures still
      required to support entry pricing.
