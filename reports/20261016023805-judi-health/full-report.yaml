  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Judi delivers in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Judi Health is no longer presenting as a single transparent PBM. The retained sources show a product stack
              in which Judi Rx remains the transparent pharmacy-benefit vehicle, Judi Health becomes the broader
              benefit-administration layer for employers, TPAs, and health plans, Judi Care handles care navigation, and
              Judi Cloud licenses the Judi platform outward to payers and TPAs. Across those brands, the core product
              pitch is a single operating environment for pharmacy and medical claims, related benefit workflows, and
              analytics, with current commercial proof framed around live members and contracted employer lives rather
              than around consumer adoption metrics. That makes the product story fundamentally
              enterprise-infrastructure-led: Judi is trying to replace fragmented administrative workflows rather than
              win through a narrow point solution alone.
