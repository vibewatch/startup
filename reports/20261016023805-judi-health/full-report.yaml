      - number: '6.3'
        title: Named proof exists, but durability and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              Judi does have named proof, but most of it is testimonial-style rather than case-study style. The
              strongest public references are quotes from Prime Therapeutics, Baylor Scott & White Health Plan, Subaru
              of Indiana Automotive, Southern New England Healthcare Organization, and Teamsters Health and Welfare
              Fund, plus one official podcast example of a 2026 Judi Cloud migration. What is missing is the durability
              layer that would turn these logos into underwritten customer quality: no source in the assigned pool
              discloses NRR, GRR, churn, contract duration, top-customer concentration, or customer-level revenue mix,
              and even the Judi Rx page's service-proof fields do not yield usable public retention or NPS values in
              fetched text. The result is a customer chapter with enough evidence to believe adoption is real, but not
              enough to treat the customer base as fully proven on renewal economics or concentration risk.
            claimRefs:
              - CU010
