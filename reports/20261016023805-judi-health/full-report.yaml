chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Judi Health is the renamed Capital Rx business, founded in late 2017 by AJ Loiacono and Ryan Kelly and now
              presented as a New York-based enterprise health technology company and benefit administrator. The
              positioning matters because Judi is no longer pitching only a transparent PBM. Its public materials
              describe a flat-fee, no-drug-spread pharmacy model as the original wedge, then frame the Judi platform as
              the broader operating system for pharmacy and health-benefit administration. That shift makes the 2025
              rebrand look less cosmetic than architectural: the company is trying to own both the aligned economics
              pitch and the workflow infrastructure underneath it.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
