  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation/return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Contracted lives keep converting into live members; Judi Cloud and related platform products contribute real
          software-like margin; phased migrations reduce claims-admin cost for customers.
        - >-
          A premium outcome is only supportable if disclosed economics show the business is not just growing volumes but
          compounding high-quality revenue with operating leverage.
        - Execution on migrations, product monetization, and customer retention still has to be proven.
        - Plausible but unproven; depends on management disclosures that are absent from public sources.
      - - Base
        - >-
          Demand for transparent PBMs and unified administration stays healthy, but monetization remains weighted to
          administration services and implementation work.
        - >-
          Maintain watchlist posture and require a meaningful diligence discount until economics and downside
          protections are explicit.
        - Margin opacity, slower live-life conversion, and mixed revenue quality could keep returns merely adequate.
        - Most evidence-consistent path today because traction is visible but margin support is not.
      - - Bear
        - >-
          PBM reform compresses economics, customer additions slow, or platform migrations remain costly and
          service-heavy.
        - >-
          If the earnings base looks more like a regulated service intermediary than a software platform, valuation
          should reset toward lower-multiple healthcare-services outcomes.
        - Policy changes, opaque capital structure, and weak cash generation would magnify downside.
        - >-
          Material risk because AMA still highlights spread-pricing and concentration concerns while public company
          disclosures omit cash-flow detail.
    notes: >-
      Scenario table is intentionally directional; the retained evidence set does not justify numeric valuation ranges
      without private revenue, margin, and capital-structure data.
