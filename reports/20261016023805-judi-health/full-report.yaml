              - CR016
      - number: '7.2'
        title: Regulatory and privacy exposure
        blocks:
          - type: paragraph
            body: >-
              Regulation sits at the top of the stack because Judi is attacking an area that policymakers are actively
              rewriting. The 2026 PBM reforms improved transparency and oversight, but did not finish the job in
              commercial, employer-sponsored, and Medicaid markets, leaving room for further rule changes and
              state-by-state compliance work. Judi's public model is better aligned with the reform direction because
              the company describes it as a transparent, pass-through business model, but that positioning does not
              eliminate licensing, audit, or government-program execution risk. Privacy is the adjacent risk: Judi
              explicitly markets a HIPAA-compliant claims platform, and OCR states that corrective-action cases can
              require multi-year monitoring, so investors should treat the absence of public incidents as a disclosure
              gap rather than proof of safety.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
