  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans incumbents, transparent challengers, and the status quo
        blocks:
          - type: paragraph
            body: >-
              The public record in this pool points to a broader competitive set than a simple PBM head-to-head. Judi
              presents itself as a transparent PBM, a full-service benefit administrator, and a licensable claims
              platform for health plans and TPAs, which means the buyer can compare it against incumbent PBMs,
              pass-through alternatives, software-led partners such as Prime plus Judi, and the status quo of keeping
              legacy claims infrastructure in place. Drug Channels shows why the incumbent class still matters: CVS
              Caremark, Express Scripts, and Optum Rx processed an estimated 80% of equivalent prescription claims in
              2025, while smaller PBMs often still depend on those same larger firms for claims, network, or rebate
              functions. That mix makes the real decision less about a single named rival and more about whether a buyer
              wants to replace, bypass, or continue layering around entrenched infrastructure.
            claimRefs:
