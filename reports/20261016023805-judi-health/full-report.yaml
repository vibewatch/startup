        title: Architecture, integration, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The most specific architectural detail comes from Judi's own Enterprise Health Platform page and the July
              2026 AH113 interview. Together they describe a cloud-native core built to process claims, eligibility,
              payments, navigation, and reporting on one platform, with open and flexible integrations instead of a
              permanent patchwork of point tools. The same interview is also the clearest operating-model evidence: Judi
              says migrations do not have to begin with a full rip-and-replace, because new products and new lives can
              go live on Judi before older books are migrated. That deployment approach is materially relevant for
              diligence because it lowers initial implementation friction, but it also means underwriting has to verify
              how much of the installed base is actually running on Judi today versus still moving through transition
              paths.
