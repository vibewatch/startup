  - id: TV001
    title: Recommendation summary table
    columns:
      - Signal
      - Assessment
      - Evidence basis
    rows:
      - - Recommendation
        - Track
        - >-
          Commercial and product proof is visible, but the retained public evidence is not sufficient for a
          price-sensitive commit.
      - - Confidence
        - Medium
        - >-
          Repeated company disclosures are internally consistent on scale and product expansion, but they share the same
          issuer and independent economic validation is thin.
      - - Risk rating
        - High
        - Regulatory scrutiny, migration execution, and financing opacity widen downside dispersion.
      - - Valuation stance
        - Insufficient public support
        - >-
          Do not underwrite a numeric value from the retained sources alone because revenue, margin, runway, and
          capital-structure terms remain undisclosed.
      - - Decision implication
        - Research more
        - Advance only if diligence confirms unit economics, cash runway, member conversion, and downside protections.
    notes: >-
