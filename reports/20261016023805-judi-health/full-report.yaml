      - number: '5.3'
        title: Differentiation and remaining technical diligence risks
        blocks:
          - type: paragraph
            body: >-
              Judi's differentiation thesis is coherent: transparent PBM economics tied to NADAC pricing, full rebate
              pass-through, unified claims data, and a modular cloud platform that investors say can compress vendor
              sprawl and improve plan configuration speed. The problem is not lack of ambition; it is evidence
              asymmetry. The strongest quantified outcome in the assigned pool is a General Catalyst claim of 5-10%
              year-over-year medical-spend improvement, while the closest practitioner-signal proxy is a
              business-analyst hiring post rather than developer docs, open-source telemetry, or package usage. The
              retained public evidence also does not surface third-party certifications, uptime or SLA disclosure, or
              enough API detail to independently validate enterprise-readiness claims for a mission-critical claims
              engine.
