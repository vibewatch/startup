              - CP006
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.3'
        title: Incumbent power and migration friction cap moat durability
        blocks:
          - type: paragraph
            body: >-
              The moat question is therefore mixed. Judi can tell a differentiated story, but the same source set shows
              how hard the market is to dislodge. Drug Channels argues that many smaller PBMs still rely on larger
              competitors for claims processing, network management, and rebate negotiation, so a buyer can appear to
              switch while leaving Big Three economics in the background. Judi's own enterprise-platform discussion also
              underscores that the status quo is sticky: buyers often run old core administrative systems with added
              point solutions, and migrations can require phased coexistence rather than a clean overnight cutover. That
              combination means Judi's displacement risk is not just head-to-head pricing pressure from another
              transparent PBM. It is also incumbent distribution power, outsourcing dependencies, and the operational
              burden buyers face when replacing core claims infrastructure.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
      - number: '3.4'
        title: Public pricing proof remains thin despite strong positioning claims
        blocks:
          - type: paragraph
            body: >-
              Judi's public materials are more explicit about contract structure than most peers in this pool, but the
              pricing comparison is still shallow by investment-grade standards. Judi discloses the shape of its model;
              peers and substitutes mostly do not disclose contract-level fees, realized savings, or
              total-cost-of-ownership data in the assigned evidence. Even Judi's strongest public adoption survey is not
              a neutral benchmark, because the cited 2026 survey was conducted by Employee Benefit News in partnership
              with Judi Rx. As a result, the current evidence supports the direction of Judi's positioning and
              identifies which competitor classes matter most, but it does not yet support a quantified conclusion on
              whether Judi wins primarily on lower all-in economics, superior workflow breadth, or some combination of
              both in live competitive bake-offs.
