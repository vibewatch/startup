  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and where Judi fits
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool supports defining Judi's addressable market as two connected buying problems
              rather than one generic "healthcare IT" category. First, Judi Rx sells transparent pharmacy-benefit
              administration to self-insured employers and similar plan sponsors that want pass-through pricing,
              auditability, and a lower-cost alternative to traditional PBMs. Second, Judi's broader platform and Judi
              Cloud positioning expand the market boundary to core benefits-administration infrastructure for health
              plans and TPAs that need medical and pharmacy claims on one system. Independent market context matters
              because Judi is not entering a fragmented greenfield: Drug Channels says 80% of 2025 equivalent
              prescription claims were still processed by the Big Three PBMs, while smaller PBMs often depend on those
              incumbents for claims processing, network management, or rebate aggregation. That means Judi's market is
              not just "PBM share capture"; it is also a system-replacement and workflow-unification sale inside a
              concentrated channel where incumbents retain infrastructure leverage.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              A disciplined market-analysis read for Judi has to keep unlike measures separate. The pool includes a
              clear employer pain signal—roughly 9% projected healthcare-cost growth without mitigation—plus
              channel-structure data showing that Prime Therapeutics alone reported $55.3 billion of prescription spend
              and 407 million claims in 2025, and company-issued traction metrics showing Judi above 50 million
              contracted PBM/PBA lives, above 5 million contracted employer PBM lives, and above 1 million live members
              at the start of 2026. Those data points are directionally useful because they show the channel is both
              very large and still operationally concentrated, while Judi has already moved beyond a subscale startup
              footprint. But they do not share one denominator or isolate the spend that Judi can realistically win
              across employers, TPAs, health plans, and public-sector accounts. The right conclusion is therefore a
              lens-based sizing view: public evidence supports market relevance and scale, but not a single precise
              TAM/SAM/SOM claim for valuation work.
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM013
