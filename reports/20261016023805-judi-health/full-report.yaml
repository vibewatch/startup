      - number: '4.2'
        title: Traction is visible, unit economics are not
        blocks:
          - type: paragraph
            body: >-
              Judi Health's public traction signals are strong enough to indicate enterprise relevance, but they still
              stop short of revealing unit economics. Company materials say Capital Rx surpassed five million contracted
              employer lives, had more than one million live members as of January 1, 2026, and implemented two million
              new health plan lives in the year. The same release says Judi Health signed more than 80 new partnerships
              for the second year in a row, including 13 Fortune 500 corporations and 21 health systems. The best public
              cost-structure proxy is still indirect: the 2025 insights report shows specialty drugs were only 0.8% of
              adjusted claims but 42.6% of gross spend, while a company executive described a migrated client's legacy
              platform manually reviewing a common office-visit claim type that represented about a quarter of claims.
              Those datapoints suggest scale and an automation thesis, but not disclosed gross margin, CAC, payback, or
              working-capital needs.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI016
          - type: table
            tableRef: TI003
