  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization design
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a multi-stream monetization story rather than a pure PBM narrative. On the
              pharmacy side, Judi Rx says its sole source of revenue is a flat administrative fee per claim, with no
              spread pricing, retained rebates, or revenue tied to drug spend. That design is more aligned than a
              traditional PBM because unit revenue should scale with claims administered rather than with higher
              ingredient cost. The July 2026 rebrand also made explicit that Judi Health now sells adjacent
              benefit-administration services through Judi Care and software licensing through Judi Cloud. What remains
              missing is the actual price architecture: none of the reviewed materials disclose the realized per-claim
              fee, customer-level contract minimums, implementation revenue, or the mix between Judi Rx, Judi Care, and
              Judi Cloud.
