  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks are not generic startup issues; they are specific to Judi Health's attempt to
              scale a regulated benefits administration platform into larger employer, payer, and partner-led workflows.
              Federal PBM reform remains active, OCR enforcement makes PHI control failures expensive and long-tailed,
              and the company's own public milestones still emphasize strategic-alliance migrations and ecosystem
              partnerships rather than a clean, self-contained operating model. The underwriting challenge is compounded
              by thin public financial disclosure: the latest public valuation reference comes from a private-market
              data platform that disclaims audit and independent verification, while company disclosures use different
              life-count denominators that are directionally positive but not yet comparable enough for low-risk
              monitoring.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR008
              - CR010
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
