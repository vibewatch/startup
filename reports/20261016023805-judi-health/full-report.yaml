      - number: '2.3'
        title: Buyer map, adoption drivers, and what can still slow conversion
        blocks:
          - type: paragraph
            body: >-
              The buying center in this market is multi-sided. Company sources explicitly point to self-insured
              employers, health plans, TPAs, hospital systems, municipalities, universities, and other public entities,
              but the user, technical owner, and budget owner vary by segment. Employers buy a more transparent PBM or
              unified-benefits stack to lower trend, improve auditability, and reduce hidden fees; payers and TPAs
              evaluate whether the underlying claims platform is flexible enough to support new plan designs and
              migration paths. That demand case is reinforced by independent evidence on specialty-drug and GLP-1 cost
              inflation, plus Judi's own interview evidence that many payers still run patchworks of 20-year-old core
              systems. The same legacy environment that creates demand also slows adoption: rip-and-replace decisions
              are operationally risky, channel partnerships matter, and public data still do not disclose segment-level
              conversion, retention, or admin-fee economics. For diligence, the opportunity therefore looks strongest
              where buyers already feel acute cost pressure and can justify platform change, but timing and monetization
              still depend on implementation cadence and direct proof of revenue quality by segment.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM009
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
