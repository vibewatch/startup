      - number: '7.4'
        title: Capital discipline and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The late-stage financing helps reduce near-term balance-sheet anxiety, but it does not remove underwriting
              risk because public evidence on valuation quality and KPI definitions is weak. Company disclosures connect
              a recent $400 million financing to product expansion and scale-up, while Forge lists a September 2025
              Series F at a $3.25 billion post-money valuation; the same Forge page warns that its private-company
              metrics may rely on limited trade or IOI inputs and are not audited or independently verified. The
              practical kill criteria are therefore operational and evidentiary: walk away or re-price if management
              cannot reconcile contracted, implemented, and live-life metrics to one board KPI set; if partner-led
              migrations are masking weak direct deployment repeatability; or if security, licensure, and
              government-program audit materials are not produced in diligence.
            claimRefs:
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why regulation remains the top-of-stack risk
            body: >-
              Judi's stated transparent, pass-through model points in the same direction as federal PBM reform, but
              commercial, employer, and Medicaid spread-pricing policy remains unfinished. Judi therefore has to prove
              both aligned incentives and durable compliance execution.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Top kill criteria
            body: >-
              Treat the thesis as broken or re-price materially if management cannot reconcile contracted, implemented,
              and live-life counts to one KPI set; if major partner-led migrations slip or reverse; or if the security
              and compliance pack lacks current third-party assurance and regulator-ready controls.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR008
              - CR012
              - CR016
          - type: callout
            title: Capital does not remove underwriting risk
            body: >-
              Recent financing reduces immediate capital-pressure concerns, but the public $3.25B reference point comes
              from a private-market data source that disclaims audit and independent verification. Underwriting still
              depends on diligence-quality unit economics rather than the headline mark alone.
            calloutType: assumption
            claimRefs:
              - CR010
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The retained evidence set is strong on strategic proof but weak on underwriting proof. Judi Health has
              said its brand and platform expansion followed a $400 million financing round, then followed with
              company-reported scale metrics that include more than 50 million contracted PBM and PBA lives across lines
              of business, more than five million contracted employer PBM lives, and more than one million live employer
              members at the start of 2026. That is enough to keep the company investable on product-market-fit and
              commercial-momentum grounds. It is not enough to support a price-sensitive commit, because the same public
              disclosures still omit admin-fee revenue, gross or contribution margin, cash runway, and the seniority
              terms that would determine downside protection. The evidence-backed recommendation is therefore Track,
              with medium confidence and a high risk rating, until management can show that the platform breadth is
              converting into durable economics rather than just top-of-funnel traction.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV010
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV010
              - CV012
              - CV013
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis starts with alignment and workflow consolidation. Judi says its pass-through PBM model remains
              the same after the rebrand, while Judi Care and Judi Cloud expand the company from pharmacy administration
              into medical-benefit administration and software licensing. The January 2026 growth release adds traction
              evidence: more than 80 new partnerships for a second straight year, including Fortune 500 employers and
              large health systems. The company is also still staffing quality-assurance, automation, and compliance
              leadership roles, which is consistent with ongoing post-financing platform investment. The anti-thesis is
              that nearly all of this proof is company-issued. Public sources still do not quantify how much of Judi's
              value comes from pass-through PBM administration versus higher-multiple software or care-navigation
              revenue, so the strategic story is ahead of the publicly disclosed economics.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framing and valuation stance
        blocks:
          - type: paragraph
            body: >-
              A bull case exists, but it is still evidence-gated. The upside path requires management to prove that
              contracted lives continue converting into live members, that phased migrations onto Judi materially lower
              claims-administration cost, and that Judi Cloud or related software licensing contributes revenue with
              better margins than a pure service PBM model. The base case is more conservative: demand for transparent
              PBMs and unified benefits administration remains real, but the public record only supports a watchlist
              posture because the company has not disclosed the monetization bridge from member growth to cash
              generation. The bear case is driven by policy and execution. AMA's 2026 reform brief shows that PBM
              compensation models remain under scrutiny and that spread-pricing reforms outside Medicare Part D are
              unfinished, which could compress economics or reduce investor willingness to pay software-like multiples
              for a PBM-heavy earnings base. The independent source's only named operating reference set is the four
              dominant PBMs in its concentration discussion—OptumRx, CVS Health, Express Scripts, and Prime
              Therapeutics—but these are market-structure references rather than clean valuation comparables because
              they sit inside larger integrated enterprises. No retained source supplies a directly comparable private
              round, M&A precedent, or stand-alone public multiple. That keeps the valuation stance at insufficient
              public support rather than affirmatively attractive.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is straightforward: convert the strategic proof into underwriting proof.
              Management should provide cohort views that reconcile contracted lives, live lives, and revenue
              recognition; disclose admin-fee net revenue, gross margin, and contribution margin by product line; and
              show whether Judi Cloud, Prime relationships, and Amino-derived offerings are additive to margin or merely
              broaden the sales narrative. Investors also need the current cap table, liquidation preferences, debt or
              structured-capital terms, and an updated runway bridge. No retained source identifies a target hold
              period, IPO path, M&A route, or supportable exit value, so exit readiness is not established on public
              evidence. The thesis should break if live-member conversion stalls, if platform migrations remain
              service-heavy rather than operating-leverage accretive, if PBM reform removes economics the company has
              not replaced with software-like revenue, or if downside protection proves weaker than the headline growth
              story implies.
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until economics, not just scale, are public
            body: >-
              Judi Health's retained public evidence shows meaningful traction and a differentiated platform roadmap,
              but it still withholds the specific revenue, margin, runway, and downside-protection data needed to
              support a numeric valuation decision.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV012
              - CV013
