      - [Care navigation and integrated workflows, Data visibility across benefits operations and member-support workflows, Stand-alone navigation vendors without shared claim data, Employers plans and TPAs, Matters because adoption case depends on operational coordination not only drug pricing]
    notes: >-
      Boundary table synthesizes company-issued product positioning with independent channel structure; rows are analytical
      market segments, not audited revenue lines.
    claimRefs: [CM001, CM002, CM003, CM010]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Lens
      - Value
      - Trend / methodology
      - Confidence
      - Limitation
    rows:
      - [Drug Channels, "2025", Big Three PBM concentration, 80% of equivalent prescription claims, Claims-processed share across the channel, Medium, Channel concentration is not the same as Judi's addressable spend]
      - [Prime Therapeutics via Drug Channels, "2025", Large-partner PBM scale, "$55.3B Rx spend / 407M claims", Full-service PBM activity excluding some specialty and state-government solutions, Medium, Partner scale is informative but not a direct TAM proxy for Judi]
      - [MedCity News plus Judi Health, "2026", Employer pain signal, "~9% projected cost increase without mitigation", Employer-benefit cost pressure used as demand context, High, Inflation signal shows urgency but not segment-specific spend]
      - [Judi Health / HitConsultant, "2026", Contracted PBM and PBA footprint, "50M+ contracted lives", Company traction across commercial Medicare and Medicaid, Medium, Contracted lives are not equivalent to live members or revenue]
      - [Judi Health, "2026", Employer PBM footprint, "5M+ contracted employer lives / 1M+ live members", Company-reported customer implementation status as of Jan. 1 2026, High, Live-member ramp and economics by segment remain undisclosed]
    notes: >-
      This table intentionally keeps separate numerators and units instead of forcing a false single-market total; it is
      a sizing-lens exhibit, not a formal audited TAM/SAM/SOM bridge.
    claimRefs: [CM003, CM005, CM007, CM008, CM013]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Self-insured employers, Benefits leadership and CFO / CHRO teams, Benefits administrators and members, Employer, PBM outsourcing or unified health-benefit administration, Employer benefits and finance, Pharmacy trend pressure and demand for auditable pass-through economics]
      - [Hospital systems and health systems, Benefits and procurement leaders, HR operations and covered employees, Health system employer plan, Employer-style plan administration plus care-navigation coordination, HR finance and benefits leadership, Need to reduce specialty trend and improve member navigation]
      - [Health plans, CIO operations and product leaders, Claims and network operations teams, Health plan, Core administrative processing and claims adjudication replacement, Technology and operations budget, Legacy system brittleness and need for unified medical and pharmacy claims]
      - [TPAs, Executive and technology leadership, Claims implementation and client-service teams, TPA or its plan-sponsor clients, Licensable claims platform and configurable benefit design support, Platform and implementation budget, Need to launch new plan designs without patchwork point solutions]
      - [Public-sector and institutional accounts, State municipal university or union benefit leadership, Administrative staff and members, Public employer or trust, Transparent PBM and broader benefit administration, Public-plan benefits and procurement budget, Pressure to control trend while preserving audit rights and service visibility]
    notes: >-
      Buyer map combines explicit segments named in company materials with role inference from the claims-platform
      workflow described in the Judi Cloud interview; budget owners should be validated in diligence by segment.
    claimRefs: [CM002, CM009, CM010, CM011, CM012]
figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      Ordered market lenses show cost pressure, channel concentration, partner scale, and Judi's current footprint,
      but they do not resolve to one common-denominator TAM.
    data:
      items:
        - label: Employer cost inflation backdrop
          displayValue: "~9%"
          unit: projected average increase without cost reduction
          detail: Employer healthcare costs are projected to rise materially again in 2026, creating urgency for benefit redesign.
          claimRefs: [CM005, CM006]
        - label: Big Three PBM channel concentration
          displayValue: "80%"
          unit: of 2025 equivalent prescription claims
          detail: The incumbent PBM channel remains highly concentrated even as independent alternatives win some share at the margins.
          claimRefs: [CM003, CM004]
        - label: Large-partner PBM scale in the channel
          displayValue: "$55.3B / 407M"
          unit: Prime Therapeutics 2025 prescription spend / claims
          detail: A major Judi partner still operates at national scale, underscoring how large the adjudication and network market is.
          claimRefs: [CM013]
        - label: Judi contracted multi-line footprint
          displayValue: "50M+"
          unit: contracted PBM and PBA lives
          detail: Company-issued 2026 sources say Judi's addressable footprint already spans commercial, Medicare, and Medicaid lines.
          claimRefs: [CM007]
        - label: Judi contracted employer PBM footprint
          displayValue: "5M+"
          unit: contracted employer PBM lives
          detail: The most directly relevant employer segment is already above five million contracted lives by company disclosure.
          claimRefs: [CM008]
        - label: Judi currently live member base
          displayValue: "1M+"
          unit: plan members live as of 2026-01-01
          detail: Live-member counts matter more than contracted lives for near-term monetization and implementation proof.
          claimRefs: [CM008]
    approximationNotes: >-
      This is an ordered lens figure rather than a formal TAM-to-SAM-to-SOM cascade; the layers intentionally preserve
      mixed but source-backed units because the assigned evidence does not support one comparable denominator.
    claimRefs: [CM003, CM004, CM005, CM007, CM008, CM013]
callouts:
  - calloutType: risk
    title: Market demand is visible before monetization quality is
    body: >-
      Public evidence shows real buyer pain and real Judi adoption, but it still does not reveal how quickly contracted
      lives convert, what mix is partner-dependent, or what admin-fee revenue and margin each segment yields. That keeps
      the market thesis investable as a demand story, but only partially underwritten as a unit-economics story.
    claimRefs: [CM005, CM008, CM011, CM013]
