evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: >-
      Current board composition, board observer rights, investor ownership percentages, liquidation preferences, and
      protective provisions from the 2025 financing.
    whyItMatters: >-
      The latest valuation step-up cannot be fully underwritten without knowing who controls governance and how the
      round changed the preference stack.
    diligencePath: Request the post-Series-F cap table, voting agreements, and board materials from management or lead investors.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current admin-fee revenue, gross margin, contribution margin, burn, and runway for Judi Health and its product
      lines.
    whyItMatters: >-
      Fundraising scale and contracted-life metrics do not reveal whether the business converts platform adoption into
      durable software-like economics.
    diligencePath: Obtain a management KPI pack or investor update with 2024-2026 revenue bridge, gross margin, and cash-burn detail.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: contracted-to-live-conversion
    missingEvidence: >-
      Current customer count, live-member ramp, renewal rates, churn, and implementation timing behind the disclosed
      contracted-life totals.
    whyItMatters: >-
      Contracted lives and partnership counts can overstate realized revenue if the pace of go-live conversion or
      retention is slower than headline metrics imply.
    diligencePath: >-
      Ask for customer cohort data showing contracted lives, live lives, go-live dates, and gross / net retention by
      customer segment.
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: executive-bench-depth
    missingEvidence: A current public roster of non-founder executives and board members with role definitions and succession coverage.
    whyItMatters: >-
      Founder concentration is manageable if bench depth is real, but the retained evidence set makes that hard to
      verify beyond AJ Loiacono and Ryan Kelly.
    diligencePath: >-
      Request an updated leadership org chart and board roster, then verify tenure and function coverage against current
      operating plans.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A third-party market dataset or comparable public-company disclosure that isolates addressable spend for
      transparent PBM administration plus licensable medical/pharmacy claims administration under one consistent
      denominator.
    whyItMatters: >-
      The current public pool proves market relevance and channel size, but it mixes claims share, cost inflation,
      partner scale, and company traction rather than a defendable standalone TAM, SAM, and SOM bridge.
    diligencePath: >-
      Request management's internal TAM model, segment-level pipeline by buyer type, and external market studies or
      public-company disclosures that isolate comparable admin-platform spend.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: conversion-and-economics
    missingEvidence: >-
      Segment-level conversion, retention, admin-fee yield, and implementation-ramp data for employers, health plans,
      TPAs, and Prime-linked channel volume.
    whyItMatters: >-
      Contracted lives and partnerships show demand, but underwriting value requires knowing how much of that footprint
      goes live, how fast it converts, and what revenue quality each segment delivers.
    diligencePath: >-
      Obtain cohort data on direct versus partner-led wins, live-member ramps, renewal rates, and admin-fee economics by
      line of business and customer segment.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-comparability
    missingEvidence: >-
      Contract-level admin fees, guarantee structures, rebate-retention terms, and migration-cost data for Judi, Prime,
      Big Three alternatives, and status-quo replacements.
    whyItMatters: >-
      The public pool supports directionally different pricing mechanics, but it does not support a quantified
      total-cost-of-ownership comparison across the real buying alternatives.
