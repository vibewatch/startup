          label: transaction and pricing data
        - from: judi-care
          to: judi-data
          label: unified claims workflows
        - from: judi-cloud
          to: judi-data
          label: platform deployment
        - from: judi-data
          to: gross-profit
          label: revenue quality not publicly disclosed
    approximationNotes: >-
      This is a structural flow only; public materials do not disclose enough
      numeric inputs for a revenue or gross-margin waterfall.
    claimRefs: [CI001, CI002, CI004, CI007, CI008, CI012, CI013]
callouts:
  - calloutType: insight
    title: Aligned design is visible before realized economics are
    body: >-
      Judi's public PBM positioning is financially attractive because it says
      revenue is tied to a flat admin fee rather than to spread pricing or
      retained rebates, but investors still lack the realized fee levels and
      revenue mix needed to convert that design claim into a margin forecast.
    claimRefs: [CI001, CI002, CI004, CI012]
  - calloutType: risk
    title: Series F reduced existential risk, not diligence opacity
    body: >-
      The $400 million financing is meaningful, yet the public record still does
      not disclose cash on hand, burn, runway, or financing obligations, so the
      next-round trigger and capital adequacy remain unresolved.
    claimRefs: [CI005, CI006, CI013]
