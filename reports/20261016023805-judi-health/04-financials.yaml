artifact: financials
slug: judi-health
runDate: 2026-10-16
company:
  name: Judi Health
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a fee-based, pass-through PBM model with adjacent
    benefit-administration and software-licensing revenue streams, plus clear
    enterprise adoption signals. It does not disclose the realized admin-fee
    rates, revenue mix, gross margin, CAC/payback, or post-Series-F cash runway
    needed to underwrite revenue quality and capital adequacy.
sections:
  - id: revenue-model
    title: Revenue model and monetization design
    body: >-
      Public evidence supports a multi-stream monetization story rather than a
      pure PBM narrative. On the pharmacy side, Judi Rx says its sole source of
      revenue is a flat administrative fee per claim, with no spread pricing,
      retained rebates, or revenue tied to drug spend. That design is more
      aligned than a traditional PBM because unit revenue should scale with
      claims administered rather than with higher ingredient cost. The July 2026
      rebrand also made explicit that Judi Health now sells adjacent
      benefit-administration services through Judi Care and software licensing
      through Judi Cloud. What remains missing is the actual price architecture:
      none of the reviewed materials disclose the realized per-claim fee,
      customer-level contract minimums, implementation revenue, or the mix
      between Judi Rx, Judi Care, and Judi Cloud.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI012]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-operating-proxies
    title: Traction is visible, unit economics are not
    body: >-
      Judi Health's public traction signals are strong enough to indicate
      enterprise relevance, but they still stop short of revealing unit
      economics. Company materials say Capital Rx surpassed five million
      contracted employer lives, had more than one million live members as of
      January 1, 2026, and implemented two million new health plan lives in the
      year. The same release says Judi Health signed more than 80 new
      partnerships for the second year in a row, including 13 Fortune 500
      corporations and 21 health systems. The best public cost-structure proxy
      is still indirect: the 2025 insights report shows specialty drugs were
      only 0.8% of adjusted claims but 42.6% of gross spend, while a company
      executive described a migrated client's legacy platform manually reviewing
      a common office-visit claim type that represented about a quarter of
      claims. Those datapoints suggest scale and an automation thesis, but not
      disclosed gross margin, CAC, payback, or working-capital needs.
    claimRefs: [CI009, CI010, CI011, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy remains the main underwriting blocker
    body: >-
      The clearest positive funding datapoint is the September 2025 financing:
      Capital Rx announced a $400 million investment, including a $252 million
      Series F, and said the proceeds would scale PBM operations, teams, and
      the enterprise platform. That materially reduces near-term existential
      risk, but public materials still do not disclose the post-close cash
      balance, monthly burn, debt or covenant obligations, or the revenue ramp
      needed to avoid another equity round. Sector context cuts both ways for
      margins. The 2026 AMA PBM reform brief supports Judi's pass-through
      positioning by noting that Medicare Part D now delinks PBM compensation
      from drug price and requires pass-through of rebates and concessions to
      plan sponsors, yet it also warns that spread pricing remains permissible
      in commercial, employer-sponsored, and Medicaid markets. The financial
      verdict is therefore favorable on model design, but still incomplete on
      realized revenue quality, margin path, and runway.
    claimRefs: [CI005, CI006, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Revenue quality
      - Diligence ask
    rows:
      - ["Judi Rx PBM administration", "Flat administrative fee; no spread or retained rebate economics", "Per processed pharmacy claim", "Public model disclosed; realized $/claim undisclosed", "Aligned design because revenue is delinked from drug spend, but realized net revenue is still undisclosed", "Provide average admin fee, client-specific minimums, and gross-to-net bridge by cohort"]
      - ["Judi Care benefit administration", "Medical, dental, and vision benefit administration on the same platform", "Contract/admin fee structure not disclosed", "Launched July 2026; pricing undisclosed", "Expands addressable wallet, but no public evidence yet on monetization or margin", "Disclose pricing model, implementation fees, and current run-rate revenue"]
      - ["Judi Cloud licensing", "Licensing Judi to health plans and TPAs", "License or subscription fee not disclosed", "Licensing division disclosed; no public price points", "Could be higher-quality software revenue, but current contribution is unknown", "Disclose contract structure, services mix, and current ARR or equivalent run rate"]
      - ["Unified Judi workflows", "Claim, rebate, and reimbursement data access plus unified claims workflows", "No licensing fee for PBM data exports; wider platform economics undisclosed", "Transparency feature is public; monetization details are not", "Supports retention and auditability, but not enough to infer margin", "Separate included reporting rights from separately billed platform modules"]
    notes: >-
      Public sources disclose monetization architecture, not realized pricing or
      revenue mix; nulls and undisclosed fields should be treated as diligence
      asks rather than as zero values.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized
      - Discounts / unknowns
      - Source
    rows:
      - ["Judi Rx admin model", "Flat administrative fee per claim", "Only model design is public; realized rates are undisclosed", "No public fee card, minimums, or client segmentation", "Judi Rx PBM page; July 2026 launch coverage"]
      - ["Drug-cost benchmarking", "NADAC benchmark for drug acquisition cost comparisons", "Benchmark disclosed; realized reimbursement spread by network is not", "Plan-specific pharmacy reimbursement terms are undisclosed", "Judi Rx PBM page"]
      - ["Rebate economics", "100% rebate pass-through", "Public policy statement, not a disclosed client-level rebate realization report", "No public reconciliation by client cohort", "Judi Rx PBM page"]
      - ["Data access and reporting", "No licensing fee for claim/rebate/network reimbursement data access", "Feature disclosure only; not equivalent to platform-license pricing", "Scope of included modules and implementation support undisclosed", "Judi Rx PBM page"]
      - ["Judi Cloud licensing", "Pricing not publicly disclosed", "No public list price", "Contract length, implementation revenue, user basis, and module pricing all undisclosed", "July 2026 rebrand coverage; Judi Cloud podcast"]
    notes: >-
      This table distinguishes publicly disclosed model design from missing
      realized economics; the absence of a listed price should not be read as
      free service.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Contracted and live PBM scale", ">5M contracted employer lives; >1M live as of 2026-01-01; 2M new health plan lives implemented in the year", "Medium", "Best public proxy for fee-bearing claim volume and implementation throughput", "Provide quarterly live-member ramp, claims processed, and revenue per member or per claim"]
      - ["New partnerships", ">80 new partnerships for the second year in a row", "Medium", "Sales-efficiency and enterprise-demand proxy", "Provide pipeline conversion, average contract size, and sales-cycle duration"]
      - ["Enterprise logo quality", "13 Fortune 500 corporations and 21 health systems among new partnerships", "Medium", "Suggests ability to win complex buyers, but not contract economics", "Disclose average implementation cost, ramp time, and gross retention by segment"]
      - ["Specialty mix", "0.8% of adjusted claims; 42.6% of gross spend", "Medium", "Mix drives operational complexity, working capital, and margin sensitivity", "Disclose gross margin by specialty vs. non-specialty claim flow and by client cohort"]
      - ["Legacy-system replacement thesis", "Company example said a common office-visit claim type representing about 25% of claims required manual review on a migrated client's old platform", "Low", "Illustrates the cost-saving narrative behind Judi Cloud without quantifying realized savings", "Provide pre/post migration auto-adjudication, headcount, and PMPM cost deltas"]
      - ["Cash and runway", "Not publicly disclosed", "Low", "Capital adequacy cannot be underwritten without cash, burn, and financing obligations", "Provide cash balance, monthly burn, debt/covenant package, and minimum breakeven revenue threshold"]
    notes: >-
      Public proxies show scale and a plausible automation value proposition,
      but not disclosed CAC, payback, gross margin, or runway.
    claimRefs: [CI009, CI010, CI011, CI013, CI016]
