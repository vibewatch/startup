company:
  name: Judi Health
chapter:
  number: 1
  title: Company Overview
  summary: 'Judi Health is a founder-led transparent PBM turned broader health-benefits infrastructure platform: founded as Capital Rx in 2017, rebranded in 2025, and now positioned around Judi Rx and the Judi software stack. Public evidence supports major scale and fundraising claims—including a $400 million 2025 financing at a reported $3.25 billion valuation and more than 5 million contracted employer lives by early 2026—but most commercial metrics remain company-issued and stop short of disclosing current revenue, margins, board rights, or contracted-to-live conversion economics.'
sections:
- id: identity-and-positioning
  title: Identity and positioning
  body: 'Judi Health is the renamed Capital Rx business, founded in late 2017 by AJ Loiacono and Ryan Kelly and now presented as a New York-based enterprise health technology company and benefit administrator. The positioning matters because Judi is no longer pitching only a transparent PBM. Its public materials describe a flat-fee, no-drug-spread pharmacy model as the original wedge, then frame the Judi platform as the broader operating system for pharmacy and health-benefit administration. That shift makes the 2025 rebrand look less cosmetic than architectural: the company is trying to own both the aligned economics pitch and the workflow infrastructure underneath it.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership and governance concentration
  body: 'Leadership remains founder-centric. Loiacono still anchors the company''s public narrative around transparency, customer trust, and the anti-spread-pricing thesis, while Kelly remains the technical co-founder associated with building the Judi platform. The retained sources support strong founder-market fit, but they do not provide the same visibility into governance mechanics. Public disclosures make the investor roster and product story much easier to verify than board composition, protective provisions, or executive depth beyond the founders. That leaves a classic late-stage diligence question: how much of Judi''s execution still depends on a small group that is unusually central to both the story and the product architecture.'
  claimRefs:
  - CO001
  - CO004
  - CO007
  - CO008
  tableRefs:
  - TO002
- id: capitalization-and-scale
  title: Capitalization and scale signals
  body: The funding history is unusually visible for a private company. PMF Show and company materials together outline a path from a $3.5 million seed round in 2018 to a $106 million Series C in 2022, a strategic round of more than $50 million in 2023, and the September 2025 rebrand financing that reportedly doubled valuation to $3.25 billion. Scale markers are also concrete, but they remain management-selected. Judi disclosed more than 4 million employer PBM members and more than 54 million contracted health-plan lives in September 2025, then said in January 2026 that contracted employer lives had surpassed 5 million with more than 1 million members already live. Those are meaningful signals, but they are not substitutes for disclosed revenue, margin, or customer-retention economics.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  tableRefs:
  - TO003
- id: milestones-and-regulatory-context
  title: Milestones and regulatory context
  body: Judi's recent milestones support the thesis that it wants to become a broader benefits-infrastructure company rather than remain only a transparent PBM challenger. The public chronology runs from seed funding and later platform-build capital to 2024 recognition for growth, the 2025 Judi Health rebrand, and the January 2026 disclosure that it had added another wave of partnerships while integrating Amino Health and Judi Care. That expansion still sits inside a policy environment that remains hostile to opaque PBM economics. FTC settlements and the AMA's 2026 reform brief both point to continued scrutiny of spread pricing, transparency, and concentrated PBM market structure, which helps Judi's sales narrative but also keeps the sector under regulatory pressure.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
