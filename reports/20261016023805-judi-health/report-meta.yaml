companyProfile:
  summary: >-
    Judi Health is a New York-based, founder-led private health-technology company that began as Capital Rx in late 2017
    and now combines a transparent PBM with broader benefit-administration software and claims workflows through Judi
    Rx, Judi Care, and Judi Cloud. The public record supports meaningful scale and a large 2025 financing, but it still
    leaves the core monetization and margin profile opaque.
