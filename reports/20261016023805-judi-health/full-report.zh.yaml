  - id: FM001
    title: 受证据约束的市场规模视角
    type: pyramid
    summary: 按序排列的市场视角展示了成本压力、渠道集中度、合作伙伴规模和 Judi 当前覆盖面，但无法归结为统一口径的 TAM。
    data:
      items:
        - label: 雇主成本通胀背景
          displayValue: ~9%
          unit: projected average increase without cost reduction
          detail: 预计 2026 年雇主医疗成本将再次大幅上升，推动福利重新设计变得紧迫。
          claimRefs:
            - CM005
            - CM006
        - label: 三大 PBM 渠道集中度
          displayValue: 80%
          unit: of 2025 equivalent prescription claims
          detail: 尽管独立替代者在边际上赢得了一些份额，现有 PBM 渠道仍高度集中。
          claimRefs:
            - CM003
            - CM004
        - label: 渠道中的大型合作伙伴 PBM 规模
          displayValue: $55.3B / 407M
          unit: Prime Therapeutics 2025 prescription spend / claims
          detail: Judi 的一大合作伙伴仍在全国范围运营，说明理赔裁定和网络市场的规模都很大。
          claimRefs:
            - CM013
        - label: Judi 已签约的多业务线覆盖
          displayValue: 50M+
          unit: contracted PBM and PBA lives
          detail: 公司发布的 2026 年来源称，Judi 的可服务覆盖已涵盖商业、Medicare 和 Medicaid 业务线。
          claimRefs:
            - CM007
        - label: Judi 已签约的雇主 PBM 覆盖
          displayValue: 5M+
          unit: contracted employer PBM lives
          detail: 与公司最相关的雇主细分市场，按披露已超过 500 万名签约覆盖人群。
          claimRefs:
            - CM008
        - label: Judi 当前上线会员基础
          displayValue: 1M+
          unit: plan members live as of 2026-01-01
          detail: 对近期变现和实施验证而言，上线会员数比签约覆盖人数更能说明问题。
          claimRefs:
            - CM008
    approximationNotes: 这是按顺序排列的视角图，不是正式的 TAM—SAM—SOM 级联；各层刻意保留了有来源支撑但口径混杂的单位，因为现有证据不支持统一的可比分母。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM007
      - CM008
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于指定公开证据的 1—5 序数评分，Judi 位于已审阅替代方案中经济一致性高、覆盖面广的一端；现有 PBM 虽然规模最强，但透明度信号并不最清晰。
    data:
      points:
        - label: Judi Health / Judi Rx
          x: 5
          'y': 5
          detail: 固定费用的透明 PBM，加上统一理赔平台和授权业务。
        - label: Prime + Judi 路径
          x: 4
          'y': 4
          detail: 费用直通型 PBM 模式，并已宣布与 Judi 理赔裁定平台建立关系。
        - label: 较小的独立 PBM
          x: 4
          'y': 2
          detail: 提供替代前端，但外包可能让现有 PBM 的经济利益继续存在。
        - label: 三大现有 PBM
          x: 2
          'y': 3
          detail: 处理份额和企业触达规模巨大，但这里没有披露公开的利益一致性条款。
        - label: 点解决方案叠加层
          x: 3
          'y': 2
          detail: 可以解决一条工作流而不替换核心，但会增加供应商和集成。
        - label: 传统内部构建 / 拼接系统
          x: 2
          'y': 1
          detail: 由买方控制的现状，在现有证据集中架构一致性最低。
    approximationNotes: 1—5 序数评分总结了从引用来源推断的两个维度：x = 经济一致性 / 可审计性，y = 围绕理赔和福利的操作系统广度。评分表示相对定位，不代表实测市场份额或基准化功能数量。
