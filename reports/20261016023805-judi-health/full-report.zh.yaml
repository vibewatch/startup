      - number: '3.2'
        title: Judi 在利益一致性与操作系统广度上的差异化
        blocks:
          - type: paragraph
            body: >-
              Judi 最清晰的公开差异化，在于透明 PBM 经济模式与更广泛理赔平台范围的结合。PBM 方面，公司披露固定管理费、无价差定价、不留存返利，以及完整数据访问权；平台方面，同一批公开材料称 Judi
              能在一个系统上处理医疗、药房、视力和牙科理赔，也能直接授权给健康计划和
              TPA。这种组合在战略上很重要，因为许多替代方案只在一个维度竞争：要么提供直通式经济模式但平台控制能力有限，要么提供基础设施工具但没有利益一致的 PBM 合同模式。Transformation Capital 和
              Prime 相关来源中的合作伙伴证据进一步表明，Judi 不只是靠改变定价机制赢得客户，也在尝试替换围绕理赔、报告和福利管理的碎片化运营栈。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.3'
        title: 既有巨头的力量与迁移摩擦限制护城河持久性
        blocks:
          - type: paragraph
            body: >-
              因此，护城河问题并不单一。Judi 能讲出差异化故事，但同一批来源也显示，撼动这个市场很难。Drug Channels 主张，许多较小 PBM
              仍依赖更大的竞争者处理理赔、管理网络和谈判返利；买方表面上可以更换供应商，三大 PBM 的经济利益却可能仍在背后。Judi
              自己对企业级平台的讨论也凸显现状的黏性：买方往往运行老旧的核心管理系统，再叠加点解决方案；迁移可能需要分阶段共存，而不是一夜之间完成切换。因此，Judi 的替代风险不只是另一家透明 PBM
              带来的正面价格压力，也包括既有巨头的分销力量、外包依赖，以及买方替换核心理赔基础设施时承担的运营负担。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
      - number: '3.4'
        title: 定位主张强劲，但公开定价证据仍薄弱
        blocks:
          - type: paragraph
            body: >-
              Judi 的公开材料比证据池中的多数同行更明确地说明了合同结构，但按投资级标准看，定价比较仍然很浅。Judi 披露了自身模式的轮廓；指定证据中大多没有披露同行和替代方案的合同费用、实际节省额或总拥有成本数据。即便
              Judi 最强的公开采用调查也不是中性基准，因为引用的 2026 年调查由 Employee Benefit News 与 Judi Rx 合作开展。因此，现有证据支持 Judi
              的定位方向，也能识别最重要的竞争者类别，但还不足以量化判断：在真实竞争中，Judi 主要靠更低的全包经济性、更广的工作流，还是二者兼具取胜。
            claimRefs:
