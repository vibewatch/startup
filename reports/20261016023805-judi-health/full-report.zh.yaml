        - 公开来源仅作描述，没有披露经审计的吞吐量或错误率数据
      - - 集成与配置层
        - 将 Judi 连接至现有软件，并支持灵活的计划设计
        - 客户数据流、供应商接口和 API／集成工作
        - 公开材料宣称架构开放且灵活，但此处没有公开 API 规范或沙盒证据可供留存
      - - DORA 报告模块
