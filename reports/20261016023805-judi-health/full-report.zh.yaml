              - CM013
      - number: '2.3'
        title: 买方地图、采用驱动因素与转化阻力
        blocks:
          - type: paragraph
            body: >-
              这一市场的采购中心涉及多方。公司来源明确提到自保雇主、健康计划、TPA、医院系统、市政机构、大学及其他公共实体，但不同细分市场的使用者、技术负责人和预算负责人并不相同。雇主购买更透明的 PBM
              或统一福利方案，以降低成本趋势、提高可审计性并减少隐性费用；支付方和 TPA 则会评估底层理赔平台是否足够灵活，能支持新的计划设计和迁移路径。独立证据显示，专科药和 GLP-1 成本持续上升；Judi
              自己的访谈也称，许多支付方仍在使用已有 20
              年的核心系统拼接方案。造成需求的遗留环境也会拖慢采用：替换式迁移在运营上风险很高，渠道伙伴很重要，公开数据仍未披露按细分市场划分的转化、留存或管理费经济性。对尽调而言，机会最强的地方是买方已感受到急迫的成本压力并能为平台变更提供理由；但时点和变现仍取决于实施节奏，以及各细分市场收入质量的直接证据。
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM009
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 市场需求先于变现质量显现
            body: >-
              公开证据显示买方存在真实痛点，Judi
              也有真实采用，但仍看不到签约覆盖人数的转化速度、合作伙伴依赖程度，或各细分市场的管理费收入与利润率。因此，市场论点可以作为需求故事进行投资，但单位经济性故事仍只得到部分验证。
            calloutType: risk
