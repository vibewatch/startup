  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现设计
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多收入流的变现故事，而不是纯 PBM 叙事。在药房业务中，Judi Rx 称其唯一收入来源是按每笔理赔收取的固定管理费，不采用价差定价、不留存返利，也不让收入随药品支出变化。相比传统
              PBM，这一设计更符合利益一致原则，因为单位收入应随处理的理赔数量增长，而不是随药品成本上升。2026 年 7 月的品牌重塑还明确了 Judi Health 通过 Judi Care
              销售相邻的福利管理服务，并通过 Judi Cloud 提供软件授权。尚未披露的是实际价格架构：现有材料均未披露实际每笔理赔费用、客户层面的合同最低额、实施收入，或 Judi Rx、Judi Care 和 Judi
              Cloud 之间的收入构成。
