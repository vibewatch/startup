  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 论点
      - 证据依据
      - 哪些信息会改变判断
    rows:
      - - 投资逻辑
        - 已形成规模的商业验证
        - 公司披露已签约 PBM/PBA 覆盖超过 50M 人、已签约雇主 PBM 覆盖超过 5M 人，且已有超过 1M 名雇主会员上线，说明分销和实施已有真实进展。
        - 只有管理层把这些规模指标与披露的净收入、毛利率和续约韧性联系起来，才应上调判断。
      - - 投资逻辑
        - 更广的平台覆盖面
        - Judi Rx、Judi Care 和 Judi Cloud 把业务从单一 PBM 延伸到交叉销售和软件授权。
        - 如果管理层证明软件或平台收入的增量利润率高于核心管理业务，投资逻辑会更强。
      - - 投资逻辑
        - 利益一致的定价模式
        - 公开材料持续将 Judi 定位为透明、费用直通型 PBM，目标是减少隐性中间商收益。
        - 如果客户能借助独立案例验证规模化后的节省是否持续、是否可审计，判断会改善。
      - - 反向逻辑
        - 经济性验证仍然缺失
        - 保留的公开记录没有披露管理费收入、贡献利润率、现金跑道或股权结构中的优先级，因此估值支持仍主要是叙事性的。
        - 只有管理层提供当前经济数据和下行保护条款，把故事转化为可评估现金流后，反向逻辑才会减弱。
    notes: 这些论点是方向性的而非评分结果；各行区分战略上行空间，以及支撑入场定价仍需补齐的具体披露。
