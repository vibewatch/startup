      - number: '4.3'
        title: 资本充足度仍是投资判断的主要障碍
        blocks:
          - type: paragraph
            body: >-
              最明确的正面融资数据点是 2025 年 9 月的融资：Capital Rx 宣布获得 $400 million 投资，其中包括 $252 million 的 Series F，并称资金将用于扩大 PBM
              运营、团队和企业级平台。这显著降低了近期的生存风险，但公开材料仍未披露交割后的现金余额、月度烧钱、债务或契约义务，也未披露避免下一轮股权融资所需的收入爬坡。行业背景对利润率的影响有利有弊：AMA 2026 年
              PBM 改革简报支持 Judi 的直通式定位，指出 Medicare Part D 已将 PBM 报酬与药价脱钩，并要求将返利和让利直通给计划发起方；但简报也警告，商业、雇主赞助和 Medicaid
              市场仍允许价差定价。因此，财务判断在模式设计上偏正面，但实际收入质量、利润率路径和现金跑道仍不完整。
