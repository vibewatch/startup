  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开规模验证和平台广度都是真实的，但经济数据缺失以及 PBM 政策审查持续存在，使建议维持观察。
    data:
      nodes:
        - id: proof
          label: 规模验证
          value: '>50M contracted PBM/PBA lives; >5M contracted employer lives; >1M live employer members'
          note: 所有规模指标都由公司披露，未经独立审计。
        - id: platform
          label: 平台广度
          value: Judi Rx + Judi Care + Judi Cloud
          note: 公司正将自身定位为 PBM、福利管理和软件授权平台。
        - id: model
          label: 商业模式
          value: Transparent pass-through PBM with platform-led expansion
          note: 公开材料对利益一致性主张的支持，比对利润披露的支持更清晰。
        - id: policy
          label: 外部压力
          value: PBM reform and spread-pricing scrutiny remain active
          note: AMA 仍指出可能挤压行业经济收益的结构性问题。
        - id: disclosure
          label: 缺失的投资判断输入
          value: No public admin-fee revenue, margin, runway, or cap-table terms
          note: 这些遗漏阻碍了数值估值判断。
        - id: call
          label: 建议
          value: Track / medium confidence / high risk / research more
          note: 只有管理层证据填补投资判断缺口后，才应上调建议。
      edges:
        - from: proof
          to: platform
          label: 商业进展支持扩张叙事
        - from: platform
          to: model
          label: 如果变现得当，广度可以改善收入质量
        - from: model
          to: call
          label: 存在潜在上行空间
        - from: policy
          to: call
          label: 行业审查加大下行风险离散度
        - from: disclosure
          to: call
          label: 经济数据缺失，无法形成有价格依据的高确信判断
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV010
      - CV012
      - CV013
