  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Judi 的位置
        blocks:
          - type: paragraph
            body: >-
              现有来源支持将 Judi 的可服务市场定义为两个相互连接的采购问题，而不是笼统的“医疗健康 IT”。第一，Judi Rx 向自保雇主及类似计划发起方销售透明的药房福利管理，主打直通定价、可审计性，以及相较传统
              PBM 更低成本的替代方案。第二，Judi 的更广泛平台和 Judi Cloud 定位，把市场边界扩展到健康计划和 TPA 所需的核心福利管理基础设施，让医疗和药房理赔在同一系统上运行。独立市场背景很重要，因为
              Judi 进入的并非一片分散的绿地市场：Drug Channels 称，2025 年相当于处方理赔的 80% 仍由三大 PBM 处理，而较小 PBM
              往往仍依赖这些既有巨头进行理赔处理、网络管理或返利汇总。因此，Judi 的市场不只是“抢占 PBM 份额”，还包括在一个既有巨头仍掌握基础设施杠杆的集中渠道内，替换系统并统一工作流。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: 受证据约束的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              对 Judi 做严谨的市场分析，必须把不同口径分开。现有数据包括一个明确的雇主端痛点信号——没有缓释措施时，医疗成本预计增长约 9%——以及渠道结构数据：Prime Therapeutics 单独报告 2025
              年处方支出 $55.3 billion、理赔 407 million 笔；还包括公司披露的增长指标：Judi 的签约 PBM/PBA 覆盖人数超过 50 million，签约雇主 PBM 覆盖人数超过 5
              million，并在 2026 年初拥有超过 1 million 名上线会员。这些数据说明渠道规模很大且运营仍高度集中，同时 Judi 已经走出次规模初创公司的阶段。但它们没有共同分母，也没有分离出 Judi
              能够在雇主、TPA、健康计划和公共部门客户中实际赢得的支出。因此，合理结论应是基于不同观察窗口的市场测算：公开证据支持市场相关性和规模判断，但不足以为估值工作提供一个精确的 TAM/SAM/SOM 规模主张。
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
