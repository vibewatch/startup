        - 已签约覆盖人数持续转化为上线会员；Judi Cloud 及相关平台产品贡献真正的软件型利润；分阶段迁移降低客户的理赔管理成本。
        - 只有披露的经济数据证明公司不只是扩大业务量，而是在经营杠杆作用下持续做大高质量收入，才有理由支持溢价结果。
        - 迁移执行、产品变现和客户留存仍需验证。
        - 可能但尚未证明；取决于公开来源中缺失的管理层披露。
      - - 基准情景
        - 市场对透明 PBM 和统一管理的需求保持健康，但变现仍偏向管理服务和实施工作。
        - 在经济数据和下行保护明确前，维持观察名单立场，并要求足够的尽调折价。
        - 利润率不透明、上线转化放缓和收入质量不一，可能使回报仅属一般。
        - 目前最符合证据的路径：业务进展可见，但利润率缺乏支撑。
      - - 悲观情景
        - PBM 改革压缩经济收益，客户新增放缓，或平台迁移持续成本高企且依赖大量服务。
        - 如果盈利基础更像受监管的服务中间商而非软件平台，估值应按低倍数医疗服务公司的水平重置。
        - 政策变化、资本结构不透明和现金生成疲弱会放大下行风险。
        - 风险重大：AMA 仍强调价差定价和集中度问题，而公司公开披露没有提供现金流细节。
    notes: 情景表刻意保持方向性；没有私有收入、利润率和资本结构数据，现有证据集不足以支持数值估值区间。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
