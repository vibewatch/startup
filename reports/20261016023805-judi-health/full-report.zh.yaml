    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              现有证据在战略证明上较强，但在投资判断证明上较弱。Judi Health 表示，其品牌和平台扩张发生在一轮 $400 million 融资之后；随后公司又披露了规模指标，包括业务线合计超过 50 million
              的签约 PBM 和 PBA 覆盖人数、超过五百万人口的签约雇主 PBM 覆盖人数，以及 2026
              年初超过一百万人口的上线雇主会员。这足以从产品市场匹配和商业动能角度继续把公司列入可投资范围。但这不足以支持对价格敏感的投资承诺，因为同样的公开披露仍遗漏管理费收入、毛利或贡献利润率、现金跑道，以及决定下行保护的优先级条款。基于证据的建议因此是“跟踪”，置信度中等、风险评级高；除非管理层能证明平台广度正在转化为持久经济性，而不只是漏斗顶部的增长。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV010
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV010
              - CV012
              - CV013
      - number: '8.2'
        title: 正向逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正向逻辑始于利益一致和工作流整合。Judi 表示，品牌重塑后其直通式 PBM 模式保持不变；Judi Care 和 Judi Cloud 则将公司从药房管理扩展到医疗福利管理和软件授权。2026 年 1
              月的增长公告补充了进展证据：连续第二年新增超过 80 个合作关系，其中包括 Fortune 500
              雇主和大型医疗系统。公司也仍在招聘质量保证、自动化和合规管理岗位，这与融资后继续投资平台相符。反向逻辑是，几乎所有这些证明都来自公司自身。公开来源仍未量化 Judi 的价值中有多少来自直通式 PBM
              管理，有多少来自更高倍数的软件或医疗导航收入，因此战略故事领先于公开披露的经济性。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 情景框架与估值立场
        blocks:
          - type: paragraph
            body: >-
              乐观情景存在，但仍受证据约束。上行路径要求管理层证明签约覆盖人数持续转化为上线会员、分阶段迁移到 Judi 能显著降低理赔管理成本，以及 Judi Cloud 或相关软件授权带来的收入利润率高于纯服务型 PBM
              模式。基准情景更保守：对透明 PBM 和统一福利管理的需求依然真实，但由于公司尚未披露从会员增长到现金生成的变现桥接，公开记录只支持观察名单立场。悲观情景由政策和执行驱动。AMA 2026 年改革简报显示，PBM
              报酬模式仍受审视，Medicare Part D 之外的价差定价改革尚未完成；这可能压缩经济性，或降低投资者为以 PBM 为主的利润基础支付软件式倍数的意愿。独立来源唯一点名的运营参考集，是其集中度讨论中的四大
              PBM——OptumRx、CVS Health、Express Scripts 和 Prime
              Therapeutics；但它们属于更大的综合企业，因此是市场结构参考，而不是干净的估值可比对象。现有来源没有提供可直接比较的私募轮次、并购先例或独立上市公司倍数。因此，估值立场仍是公开支持不足，而非明确具有吸引力。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 最终尽调要求与逻辑破坏因素
        blocks:
          - type: paragraph
            body: >-
              下一步尽调很直接：把战略证明转化为投资判断证明。管理层应提供能够对齐签约覆盖人数、上线覆盖人数和收入确认的 cohort 视图；按产品线披露管理费净收入、毛利率和贡献利润率；并说明 Judi
              Cloud、Prime 关系和 Amino
              衍生产品对利润率是增量贡献，还是只扩大了销售叙事。投资者还需要当前股权结构表、清算优先权、债务或结构化资本条款，以及更新后的现金跑道桥接。没有任何现有来源指出目标持有期、IPO
              路径、并购路线或可支持的退出价值，因此公开证据尚不足以证明退出准备度。如果上线会员转化停滞、平台迁移仍然高度依赖服务而非带来运营杠杆、PBM 改革移除了公司尚未用软件式收入替代的经济性，或下行保护弱于
              标题增长故事所暗示的水平，投资逻辑就应被视为失效。
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 在经济性而非规模公开前保持跟踪
            body: Judi Health 的现有公开证据显示出有意义的商业进展和差异化平台路线图，但仍未披露支持数字化估值决策所需的具体收入、利润率、现金跑道和下行保护数据。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV012
              - CV013
