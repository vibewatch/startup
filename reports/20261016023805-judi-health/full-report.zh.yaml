        blocks:
          - type: paragraph
            body: >-
              Judi 最近的里程碑支持这样一个判断：公司想成为更广泛的福利基础设施企业，而不只是透明 PBM 挑战者。公开时间线从种子融资和后续平台建设资金，延伸到 2024 年的增长认可、2025 年的 Judi
              Health 品牌重塑，以及 2026 年 1 月披露的新增一轮合作关系和对 Amino Health、Judi Care 的整合。这种扩张仍处于对不透明 PBM 经济模式不友好的政策环境中。FTC 和 AMA
              的 2026 年改革简报都显示，监管部门仍在审视价差定价、透明度和 PBM 市场集中度；这有利于 Judi 的销售叙事，但也让行业持续承受监管压力。
