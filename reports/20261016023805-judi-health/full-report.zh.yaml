          tone: positive
          claimRefs:
            - CO004
        - date: Mid-2022
          label: Series C 为平台建设提供资金
          detail: Capital Rx 称，公司获得 $106M Series C，用于支持 Judi 和处方药管理改进。
          tone: positive
          claimRefs:
            - CO005
        - date: '2023'
          label: 战略性医疗系统轮
          detail: 公司材料称，领先医疗系统和 Transformation Capital 参与了超过 $50M 的战略投资轮。
