      - number: '1.3'
        title: 资本化与规模信号
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司而言，Judi 的融资历史异常透明。PMF Show 和公司材料共同勾勒出一条路径：2018 年 $3.5 million 种子轮、2022 年 $106 million 的 Series
              C、2023 年超过 $50 million 的战略轮，以及 2025 年 9 月品牌重塑融资；据报道，后者让估值翻倍至 $3.25 billion。规模指标也很具体，但仍由管理层选择披露。Judi 在 2025
              年 9 月披露，雇主 PBM 会员超过 4 million、签约健康计划覆盖人数超过 54 million；2026 年 1 月又表示，签约雇主覆盖人数已超过 5 million，且已有超过 1 million
              名会员上线。这些是有意义的信号，但不能替代已披露的收入、利润率或客户留存经济性。
