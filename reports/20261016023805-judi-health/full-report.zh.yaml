      - number: '4.2'
        title: 业务进展可见，单位经济性不可见
        blocks:
          - type: paragraph
            body: >-
              Judi Health 的公开增长信号足以说明其具备企业级相关性，但仍不足以揭示单位经济性。公司材料称，Capital Rx 的签约雇主覆盖人数已超过五百万人，截至 2026 年 1 月 1
              日已有超过一百万人上线，并在当年新增实施两百万名健康计划覆盖人数。同一份公告称，Judi Health 已连续第二年新增超过 80 个合作关系，其中包括 13 家 Fortune 500 企业和 21
              个医疗系统。当前最好的公开成本结构代理指标仍是间接的：2025 年洞察报告显示，专科药仅占调整后理赔的 0.8%，却占总支出的
              42.6%；一名公司高管则称，某个已迁移客户的遗留平台仍在人工复核一种常见的门诊理赔类型，该类型约占理赔总量的四分之一。这些数据说明了规模和自动化逻辑，但没有披露毛利率、CAC、回收期或营运资金需求。
