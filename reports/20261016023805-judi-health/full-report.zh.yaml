  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合涵盖巨头、透明型挑战者与现状方案
        blocks:
          - type: paragraph
            body: >-
              现有公开记录显示，竞争格局比简单的 PBM 正面对决更宽。Judi 将自己定位为透明 PBM、全服务福利管理机构，以及可授权给健康计划和 TPA 的理赔平台；因此，买方可以把它与既有
              PBM、直通式替代方案、Prime 加 Judi 这类软件驱动的合作方案，以及继续保留遗留理赔基础设施的现状方案进行比较。Drug Channels 说明了既有巨头为何仍然重要：CVS
              Caremark、Express Scripts 和 Optum Rx 在 2025 年处理了估计 80% 的相当于处方的理赔，而较小 PBM
              往往仍依赖这些大型公司提供理赔、网络或返利功能。真正的决策因此不在于某一个具体竞争对手，而在于买方要替换、绕开，还是继续围绕根深蒂固的基础设施叠加方案。
            claimRefs:
