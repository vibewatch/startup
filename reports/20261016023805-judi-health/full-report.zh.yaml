  - id: FE001
    title: 产品架构图
    type: stack
    summary: Judi 以共享的理赔、工作流和报告核心为底座打包福利产品，既可直接部署，也可经 Judi Cloud 授权。
    data:
      layers:
        - label: 买方与用户界面
          detail: 面向雇主、健康计划、TPA 和会员支持团队销售的商业福利项目。
          modules:
            - 雇主福利管理
            - 健康计划 / TPA 运营
            - 会员导航工作流
        - label: 商业产品品牌
          detail: 把同一平台包装成不同商业切入口的产品层。
          modules:
            - Judi Rx
            - Judi Health
            - Judi Care
            - Judi Cloud
        - label: Judi 核心平台
          detail: Judi 称，共享的云原生引擎负责理赔及相关管理工作流。
          modules:
            - 药房和医疗理赔裁定
            - 资格与付款
            - 分析和 AI 增强工作流
        - label: 报告与可见性
          detail: Judi 用来体现企业透明度差异化的数据和报告层。
          modules:
            - DORA 报告
            - 理赔明细级自助数据访问
            - 逐行成本可见性
        - label: 安全与合规控制
          detail: 公开披露的控制主题，而非经过独立验证的认证。
          modules:
            - 加密
            - 威胁监控
            - 面向 HIPAA 的合规
        - label: 集成与部署
          detail: Judi 称，产品靠这些方式进入付款方和雇主环境的生产环节。
          modules:
            - 开放 / 灵活集成
            - Prime Therapeutics 实例
            - 优先迁移新会员
            - 客户定制配置
    approximationNotes: 公开材料确认了功能层，但没有披露确切的 API 边界、租户模型或基础设施拓扑。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Judi 的公开客户拓展路径似乎从透明 PBM 解决痛点开始，再扩展到更广泛的福利管理和直接平台授权。
    data:
      items:
        - label: 传统成本痛点打开机会
          stage: 问题识别
          actor: 雇主受托人、计划和 TPA
          touchpoints:
            - 买方寻找传统既有机构的替代者，透明 PBM 需求因此上升
            - 成本可见性和数据访问构成初始搜索的核心
        - label: 透明 PBM 切入口
          stage: 初始采用
          actor: 自保雇主以及工会 / 公共部门买方
          touchpoints:
            - 面向自保雇主的固定费用 PBM 方案
            - Judi Rx 公开页面上的工会和雇主评价
        - label: 上线可信度
          stage: 部署
          actor: 会员和运营团队
          touchpoints:
            - 截至 2026-01-01，已有超过 1M 名会员上线
            - 服务相关主张已公开，但留存分母没有披露
        - label: 广泛拓客
          stage: 扩张
          actor: 财富 500 强企业、医疗系统和公共机构
          touchpoints:
            - 新增合作伙伴数量连续第二年超过 80 家
            - 2026 年 1 月的公开验证包括财富 500 强企业、医疗系统、市政机构和大学
        - label: 平台授权路径
          stage: 交叉销售
          actor: 健康计划和 TPA
          touchpoints:
            - Judi Cloud 向计划和 TPA 授权平台
            - 官方播客提到一名 2026 年迁移客户
        - label: 综合福利方案的支出份额
          stage: 更广的支出份额
          actor: 现有雇主和付款方账户
          touchpoints:
            - Judi Care 将业务扩展到医疗、牙科和视力管理
            - 续约经济性和钱包份额证据仍然稀少
