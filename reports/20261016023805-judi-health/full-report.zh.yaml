chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              Judi Health 是更名后的 Capital Rx 业务，由 AJ Loiacono 和 Ryan Kelly 于 2017
              年底创立，如今定位为总部位于纽约的企业级健康科技公司和福利管理机构。这个定位很重要：Judi 不再只是在推销透明 PBM。公开材料把固定费用、无药品价差的药房模式描述为最初切入口，再将 Judi
              平台定义为药房及健康福利管理的更广泛操作系统。由此看，2025 年的品牌重塑不只是改名，而是架构层面的转向：公司试图同时掌握利益一致的经济叙事，以及其下方的工作流基础设施。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: 领导层与治理集中度
        blocks:
          - type: paragraph
            body: >-
              领导层仍以创始人为核心。Loiacono 继续围绕透明度、客户信任和反价差定价主张来塑造公司的公开叙事；Kelly 则仍是与 Judi
              平台建设紧密相关的技术联合创始人。现有来源支持二人与市场的匹配度较强，但无法让外界同样清楚地了解治理机制。相比董事会构成、保护性条款或创始人之外的高管梯队，公开披露更容易核实投资者名单和产品叙事。这留下了一个典型的后期尽调问题：Judi
              的执行仍有多大程度依赖一个同时主导公司故事和产品架构的小团队。
