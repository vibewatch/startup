        title: Judi 在客户工作流中交付什么
        blocks:
          - type: paragraph
            body: >-
              Judi Health 已不再以单一透明 PBM 的形象出现。现有来源显示，产品栈中 Judi Rx 仍是透明药房福利工具，Judi Health 成为面向雇主、TPA 和健康计划的更广泛福利管理层，Judi
              Care 负责医疗导航，Judi Cloud 则把 Judi 平台授权给支付方和
              TPA。贯穿这些品牌的核心产品主张，是在一个运营环境中处理药房和医疗理赔、相关福利工作流及分析；当前商业证明围绕上线会员和签约雇主覆盖人数，而非消费者采用指标展开。因此，产品故事本质上由企业基础设施驱动：Judi
              试图替换碎片化的管理工作流，而不只是靠一个狭窄的点解决方案取胜。
