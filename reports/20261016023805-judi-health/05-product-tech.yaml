company:
  name: "Judi Health"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Judi Health now packages a multi-product benefits stack around Judi, a cloud-native claims and workflow platform that the company says can unify pharmacy and medical administration, reporting, and navigation. Public evidence supports the product-suite expansion and some live migration proof, but enterprise-readiness diligence is still constrained by thin independent technical validation and limited public security, SLA, and developer-documentation detail."
sections:
  - id: "product-suite-and-workflow"
    title: "What Judi delivers in customer workflow terms"
    body: "Judi Health is no longer presenting as a single transparent PBM. The retained sources show a product stack in which Judi Rx remains the transparent pharmacy-benefit vehicle, Judi Health becomes the broader benefit-administration layer for employers, TPAs, and health plans, Judi Care handles care navigation, and Judi Cloud licenses the Judi platform outward to payers and TPAs. Across those brands, the core product pitch is a single operating environment for pharmacy and medical claims, related benefit workflows, and analytics, with current commercial proof framed around live members and contracted employer lives rather than around consumer adoption metrics. That makes the product story fundamentally enterprise-infrastructure-led: Judi is trying to replace fragmented administrative workflows rather than win through a narrow point solution alone."
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE014"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-deployment"
    title: "Architecture, integration, and deployment model"
    body: "The most specific architectural detail comes from Judi's own Enterprise Health Platform page and the July 2026 AH113 interview. Together they describe a cloud-native core built to process claims, eligibility, payments, navigation, and reporting on one platform, with open and flexible integrations instead of a permanent patchwork of point tools. The same interview is also the clearest operating-model evidence: Judi says migrations do not have to begin with a full rip-and-replace, because new products and new lives can go live on Judi before older books are migrated. That deployment approach is materially relevant for diligence because it lowers initial implementation friction, but it also means underwriting has to verify how much of the installed base is actually running on Judi today versus still moving through transition paths."
    claimRefs: ["CE005", "CE006", "CE007", "CE008", "CE009", "CE010"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-and-open-risks"
    title: "Differentiation and remaining technical diligence risks"
    body: "Judi's differentiation thesis is coherent: transparent PBM economics tied to NADAC pricing, full rebate pass-through, unified claims data, and a modular cloud platform that investors say can compress vendor sprawl and improve plan configuration speed. The problem is not lack of ambition; it is evidence asymmetry. The strongest quantified outcome in the assigned pool is a General Catalyst claim of 5-10% year-over-year medical-spend improvement, while the closest practitioner-signal proxy is a business-analyst hiring post rather than developer docs, open-source telemetry, or package usage. The retained public evidence also does not surface third-party certifications, uptime or SLA disclosure, or enough API detail to independently validate enterprise-readiness claims for a mission-critical claims engine."
    claimRefs: ["CE011", "CE012", "CE013", "CE015", "CE016"]
tables:
  - id: "TE001"
    title: "Product module / asset matrix"
    columns:
      - "Module / product line"
      - "Primary user / buyer"
      - "Current status / maturity"
      - "Differentiation"
      - "Diligence gap"
    rows:
      - ["Judi Rx", "Self-insured employers and plan sponsors buying PBM services", "Scaled incumbent product; retained after rebrand", "Transparent PBM with NADAC-linked economics and 100% rebate pass-through", "Need realized savings, margin, and retention data by cohort"]
      - ["Judi Health", "Employers, TPAs, and health plans", "Broader umbrella brand launched in 2025", "Unifies benefit administration beyond pharmacy into a single solution set", "Need exact commercial packaging, pricing, and service boundaries by buyer type"]
      - ["Judi Care", "Members and care-management teams", "Newer care-navigation layer", "Combines navigation with broader benefit workflows instead of leaving navigation separate", "Need customer references and measurable navigation outcomes post-Amino integration"]
      - ["Judi Cloud", "Health plans and TPAs licensing core infrastructure", "New licensing channel announced in 2026", "Lets Judi monetize the platform as software, not only as managed PBM/admin services", "Need tenancy model, implementation scope, and referenceable live-license customers"]
      - ["Judi (EHP)", "Internal Judi ops plus licensed payer/TPA users", "Core platform presented as already deployed at scale", "Cloud-native, unified claims and workflow engine spanning pharmacy and medical administration", "Need third-party architecture review, security packet, and uptime history"]
    notes: "Rows summarize public product positioning as of the refresh run; maturity is based on launch timing and disclosed deployment evidence, not audited utilization."
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE011", "CE014"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow"
      - "Company solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Employer / plan sponsor designs benefits", "Pharmacy and medical data typically sit in separate systems", "Unified administration with line-by-line cost visibility across benefits", "General Catalyst says employers gain real-time total-cost-of-care visibility", "Benefit is described by an investor, not a neutral benchmark"]
      - ["TPA / health plan operations adjudicate claims", "Legacy CAPS and point tools require manual handoffs and vendor sprawl", "Single-code-base platform with phased migration path", "Company says new products and lives can go live before full legacy migration", "No public implementation timeline or cutover success-rate disclosure"]
      - ["Ops and analytics teams report on claims activity", "Reporting often depends on fragmented extracts and manual work", "DORA module exposes claim data self-serve and can automate reporting", "Company says any data in Judi can be accessed or operationalized through reports", "No external proof of reporting adoption or customer productivity lift"]
      - ["Member / care-navigation workflow", "Medical and pharmacy support are often fragmented", "Judi Care plus unified claims/workflow data", "Company positions navigation and claims on one connected stack", "Public evidence does not show independent member-outcome or NPS verification for the integrated workflow"]
    notes: "Measurable benefits are preserved with source-level caveats; where outcomes come from partner or company narratives rather than neutral audits, the limitation column states that explicitly."
    claimRefs: ["CE001", "CE003", "CE006", "CE007", "CE008", "CE011", "CE012", "CE015"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Unified claims core", "Processes pharmacy and medical claims plus eligibility and payments", "Underlying Judi EHP architecture", "Public sources are descriptive but do not expose audited throughput or error-rate data"]
      - ["Integration and configuration layer", "Connects Judi to existing software and supports flexible plan design", "Customer data feeds, vendor interfaces, and API/integration work", "Open/flexible architecture is claimed publicly, but no public API spec or sandbox evidence is retained here"]
      - ["DORA reporting module", "Makes claim-level data queryable and reportable", "Complete claim-field capture and access governance inside Judi", "No external case study quantifies reporting adoption, cycle-time gains, or user breadth"]
      - ["Phased migration operating model", "Moves new lives first and legacy books later", "Change-management capacity at the payer/TPA and Judi implementation teams", "Transition complexity can hide how much of the book is fully live on Judi versus still migrating"]
      - ["Security / compliance controls", "Markets encryption, threat monitoring, HIPAA-oriented compliance, and enterprise-grade security", "Internal security program and trust-center artifacts", "No third-party certifications, SLA disclosures, or public incident history appear in the assigned evidence set"]
    notes: "This table separates disclosed architecture from diligence risk; a listed control or module does not imply independent validation."
    claimRefs: ["CE001", "CE005", "CE006", "CE007", "CE008", "CE012", "CE016"]
