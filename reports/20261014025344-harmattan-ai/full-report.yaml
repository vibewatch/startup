      - number: '1.4'
        title: Valuation Multiples, Disclosure Gaps, and Defense Market Headwinds
        blocks:
          - type: paragraph
            body: >-
              While French President Emmanuel Macron praised Harmattan AI's Series B as vital for sovereign European
              defense autonomy, the company's valuation multiple rests upon aggressive forward industrial execution
              rather than disclosed commercial fundamentals [CO005, CO011]. Fundamental financial figures—including
              current revenue run-rate, net margins, cash burn rate, and capital runway—remain completely undisclosed
              private data points, leaving financial diligence constrained [CO012]. Independent institutional investors
              have openly warned of speculative overheating in sovereign defense-tech venture rounds, specifically
              across European drone and counter-drone systems where high capital inflows risk outpacing procurement
              budgets [CO011]. Furthermore, Harmattan AI's scaling thesis faces potential hardware supply-chain
              vulnerabilities, evidenced by its dependence on external industrial transitions such as Valeo's initiative
              to manufacture heavy-rare-earth-free electric motors starting in 2027 to de-risk component sourcing
              [CO006, CO011].
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO012
