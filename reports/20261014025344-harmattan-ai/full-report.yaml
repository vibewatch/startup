chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI is a French defense technology company incorporated as a simplified joint-stock company
              (société par actions simplifiée) with its corporate headquarters at 1 Rue du Mail in Paris [CO001].
              Founded in April 2024 by Chief Executive Officer Mouad M'Ghari, Chief Technology Officer Martin de
              Gourcuff, and Jean-Patrice Coste, the company develops vertically integrated robotic hardware and
              edge-autonomy mission systems tailored for high-intensity operational theaters [CO001, CO002]. Operating
              facilities span Paris, Meudon, and Savigny-le-Temple in France, alongside international forward offices
              across the United States in Austin, Texas, Switzerland, and the United Arab Emirates, supporting
              operational alignment with NATO and allied armed forces [CO001, CO002, CO008]. Executive leadership
              exhibits acute key-person exposure centered on co-founder and CEO Mouad M'Ghari, who steers commercial
              partnerships and sovereign defense engagements across Europe and North Africa, while formal board
              composition, investor voting thresholds, and protective liquidation provisions remain undisclosed [CO002,
              CO009].
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.2'
        title: Capitalization Trajectory and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              The company achieved unicorn status on January 12, 2026, closing a $200 million Series B funding round led
              by French combat aircraft prime Dassault Aviation at a post-money valuation of $1.4 billion, which brought
              lifetime equity financing to $242 million [CO003, CO004]. Prior capital infusions consisted of a February
              2025 Seed round led by Atlantic Labs and a March 2025 Series A led by FirstMark Capital, supplemented by
              venture and angel backers including W Ventures, Tholus Capital, Motier Ventures, and Sisyphus Ventures
              [CO003, CO004]. Strategic equity ownership by Dassault Aviation solidifies an industrial alliance focused
              on integrating embedded autonomy and manned-unmanned teaming into future combat platforms including the
              Rafale F5 fighter and Unmanned Combat Air System (UCAS) [CO003, CO005]. Despite this marquee cap-table
              endorsement, governance parameters such as board seat allocation, liquidation preference multiples, and
              minority shareholder veto rights remain strictly private [CO009].
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO009
      - number: '1.3'
        title: Industrial Manufacturing Scale and Commercial Execution
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI differentiates itself through rapid volume manufacturing of attritable and software-defined
              autonomous defense platforms, operating an established 6,000-square-meter facility in the Paris region
              capable of producing up to 10,000 systems monthly [CO006, CO008]. Commercial momentum is anchored by
              sovereign Programs of Record, including a June 2025 initial contract for 1,000 Sonora reconnaissance
              micro-drones from the French Direction Générale de l'Armement (DGA) delivered within six months, followed
              by a fivefold renewal order for 5,000 units in June 2026 [CO006, CO007]. In parallel, the United Kingdom
              Ministry of Defence awarded an acquisition contract for 3,000 autonomous unmanned systems, establishing
              verified bilateral procurement across two leading NATO powers [CO004, CO007]. Beyond micro-reconnaissance,
              product expansion includes the GOBI counter-UAS interceptor, the NAMIB electronic warfare payload
              demonstrated in collaborative flight with a Rafale fighter, and the IRIFI deep-strike autonomous platform
              featuring 2,000-kilometer reach and dual-human authorization safeguards [CO006, CO007, CO010].
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO008
              - CO010
