      - number: '8.4'
        title: Investment Recommendation and Priority Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Given current valuation levels and the total absence of verified financial performance data, the
              analytical verdict on Harmattan AI is a research-more recommendation with a high risk rating and a
              fair-to-speculative valuation stance. The company has assembled extraordinary strategic momentum and
              government customer validation within two years of founding. However, entering an equity round at a $1.4
              billion valuation without visibility into recurring software share, gross margin profile, and cap-table
              preference terms violates core fiduciary discipline. Prospective investors must condition capital
              deployment on definitive diligence milestones, specifically auditing historical delivery margins,
              verifying backlog conversion timing under French and UK Programs of Record, and assessing the liquidation
              preference overhang held by strategic prime investors. Until these operational and financial parameters
              are clarified through private disclosure, investors should maintain active tracking rather than issuing an
              unhedged buy signal.
