  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Operational Doctrine
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI defines its product suite around an operational doctrine termed coordinated saturation,
              designing military hardware and software architectures to function as unified autonomous forces rather
              than isolated robotic assets. Modern combat environments increasingly feature intense electronic warfare,
              degraded satellite communications, and high loss rates for frontline equipment. In response, Harmattan AI
              constructs attritable autonomous systems engineered to absorb operational risk and maintain tactical mass
              without jeopardizing strategic capital assets. The company's core technological architecture centers on
              edge autonomy, executing perception, navigation, and targeting workloads directly on platform avionics
              rather than relying on persistent remote teleoperation or centralized cloud infrastructure. This
              edge-native computation enables groups of unmanned systems to maintain coordinated mission behavior,
              execute distributed tasks, and preserve operational tempo across contested environments where
              radio-frequency links are jammed or denied.
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: 'Systems Portfolio: Platforms, Interceptors, Payloads, and Launchers'
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI's fielded and announced product portfolio encompasses four primary capability domains across
              uncrewed aerial systems, kinetic air defense, and specialized sensing payloads. In tactical
              reconnaissance, the company manufactures Sonora (designated DELCO by the French Army), a 1.8-kilogram
              quadcopter micro-UAV delivering 40 minutes of flight endurance, electro-optical and infrared sensors, and
              local visual odometry tailored for platoon-level reconnaissance in GNSS-denied areas. For counter-unmanned
              aerial systems (C-UAS), the company deploys GOBI, a lightweight, high-speed kinetic interceptor designed
              to detect, track, and kinetically destroy hostile drone swarms before they reach friendly assets. In
              long-range operations, Harmattan AI announced IRIFI, an attritable deep-strike drone system featuring a
              2,000-kilometer operational radius, containerized mobile launcher, and terminal optical guidance that
              bypasses radar detection and satellite navigation dependence. Supporting these platforms is SAHARA, a
              synthetic aperture radar payload with onboard processing that generates high-resolution terrain and target
              imagery across all-weather operating conditions.
