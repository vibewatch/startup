              Harmattan AI exhibits severe counterparty concentration centered on anchor sovereign buyers and industrial
              defense primes. Its commercial momentum is dominated by two national procurement programs: the French DGA
              contract for 5,000 DELCO reconnaissance drones and the UK Ministry of Defence order for 3,000 autonomous
              systems. Strategic concentration is further amplified by Dassault Aviation, which led the January 2026
