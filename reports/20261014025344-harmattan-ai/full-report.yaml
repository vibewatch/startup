      - number: '7.4'
        title: Financial Opacity, Market Overheating, Risk Heatmap, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Financial risk centers on acute disclosure opacity set against macro defense tech market overheating.
              While Harmattan achieved unicorn status with a $1.4 billion valuation on $242 million in total funding,
              the company publishes no audited revenue run-rates, gross margin figures, or monthly cash burn metrics.
              Venture analysts have voiced concern that European defense technology valuations have outpaced underlying
              recurring cash flow, creating down-round vulnerability if procurement deliveries face cancellation or
              multi-year budget sequestration. The underwriting thesis depends on monitoring five measurable
              thesis-break triggers: (1) rejection or revocation of French CIEEMG export authorizations for deep-strike
              systems; (2) failure of Valeo to deliver qualified rare-earth-free electric motors by mid-2027; (3)
              multi-year schedule slippage on Dassault's Rafale F5 integration milestones; (4) delivery default on the
              French DGA 5,000-unit contract; or (5) sustained monthly cash burn exceeding Series B replenishment
              thresholds.
