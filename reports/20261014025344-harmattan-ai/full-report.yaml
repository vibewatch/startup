              - CI004
              - CI008
      - number: '4.2'
        title: Industrial Scaling, Cost Structure, and Unit Economics Diligence
        blocks:
          - type: paragraph
            body: >-
              The company's cost structure reflects a capital-intensive combination of internal platform assembly,
              embedded software engineering, and strategic component sub-tier sourcing. Harmattan operates an assembly
              footprint producing 1,300 drones per month in Paris, with industrial expansion toward a 6,000-square-meter
              base in the Paris region targeting a 10,000-unit monthly run rate. Manufacturing inputs combine domestic
              precision electronics, optical and infrared sensor payloads, and outsourced automotive-grade component
              modules. Specifically, Harmattan contracted French supplier Valeo to manufacture rare-earth-free sovereign
              electric drone motors starting in early 2027 to eliminate vulnerable supply chain bottlenecks, while
              integrating infrared sensors from French imaging specialist Lynred. Fixed costs are driven by specialized
              personnel, with headcount scaling from 130 to over 170 employees, predominantly systems, robotics, and
              machine learning engineers alongside defense operational veterans. Variable cost per unit remains
              unverified due to undisclosed bill-of-materials (BOM) figures; attritable quadcopters like the
              1.8-kilogram Sonora likely maintain hardware production costs below commercial defense thresholds, but
              deep-strike containerized systems such as IRIFI carry substantially higher component and testing expenses.
