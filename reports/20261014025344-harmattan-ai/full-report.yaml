      - number: '7.2'
        title: Industrial Manufacturing Scalability, Component Sourcing, and Quality Failure Modes
        blocks:
          - type: paragraph
            body: >-
              Scaling hardware production represents Harmattan AI's most acute operational challenge. The company claims
              industrial-scale throughput delivering thousands of systems monthly, assembling 1,300 drones per month at
              its Paris site while expanding toward a 6,000-square-meter facility with an intended 10,000-unit monthly
              capacity. However, executing this ramp introduces severe supply chain vulnerabilities in precision sensor
              payloads and electric propulsion. To mitigate reliance on Chinese rare-earth magnet supplies, Harmattan
              contracted French automotive supplier Valeo in July 2026 to manufacture sovereign, rare-earth-free
              electric drone motors starting in early 2027. Until this sovereign supply line matures, low-rate
              production remains vulnerable to sub-tier component bottlenecks. In operational electronic warfare,
              Harmattan mitigates GPS-jamming vulnerabilities by deploying on-edge AI inference and vision-based
              navigation tested in frontline combat trials with Ukrainian partner Skyeton, but persistent sensor
              degradation in contested environments poses ongoing reliability risks.
