  - id: TM001
    title: Market definition table
    columns:
      - Segment / Category
      - Included Spend
      - Excluded Spend
      - Primary Buyer / Payer
      - Strategic Relevance
    rows:
      - - Attritable Tactical UAS
        - Squad-level micro-ISR drones (Sonora/DELCO), swarming airframes, onboard edge processing, training systems
        - Heavy MALE/HALE airframes (Reaper, Eurodrone), commercial camera drones, consumer toys
        - French DGA, UK MoD, NATO allied land forces
        - Core volume delivery addressing frontline tactical situational awareness under intense attrition
      - - Counter-UAS & Interception
        - Kinetic interceptor drones (GOBI), terminal guidance sensors, acoustic/RF detection integration
        - Strategic surface-to-air missile batteries (Patriot, SAMP/T), base civil fencing
        - Ministries of Defence, air base defense commands, critical infrastructure authorities
        - Low-cost per-kill alternative to multi-million-dollar missile interceptors against Shahed-class swarms
      - - Long-Range Deep Strike
        - Containerized one-way deep-strike systems (IRIFI), non-GNSS optical guidance, terrain navigation
        - Strategic cruise missiles (Storm Shadow, Tomahawk), ballistic missile systems
        - Allied sovereign armed forces (Royal Moroccan Armed Forces, European export clients)
        - Combines low-cost attritable production mass with meter-level terminal precision at 2,000 km range
      - - Collaborative Combat Air AI
        - Embedded autonomy software, MUM-T wingman coordination, radar payloads (NAMIB/SAHARA), C2 suites
        - Civil flight automation, enterprise ERP software, crewed airframe manufacturing
        - Dassault Aviation, European Future Combat Air System (FCAS) program partners
        - High-margin software integration extending Rafale F5 capability and sovereign aerospace independence
    notes: >-
      Defines the operating boundary for sovereign autonomous aerial systems, counter-UAS interceptors, and
      collaborative combat AI software across NATO allied budgets.
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM006
