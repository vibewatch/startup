  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Export Control, Dual-Use, and Autonomous Weapons Compliance
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI operates under intensive regulatory scrutiny governed by French and European defense export
              control regimes. The company's micro-ISR drones (Sonora / DELCO) and long-range systems (IRIFI) constitute
              dual-use and military materiel subject to strict licensing by the French Commission Interministérielle
              pour l'Étude des Exportations de Matériels de Guerre (CIEEMG). While Harmattan holds domestic approval
              through French Direction Générale de l'Armement (DGA) Programs of Record, cross-border commercial
              transfers—such as its strategic partnership with Morocco announced in June 2026—remain vulnerable to
              export license delays or intergovernmental vetoes. In autonomous weapon governance, Harmattan addresses
              international humanitarian law concerns by embedding architectural safeguards: its doctrine enforces
              autonomous mission execution while preserving dual human authorization prior to lethal strike release.
              Corporate standing as a French société par actions simplifiée (SAS) anchored in Paris shields sovereign IP
              under European jurisdiction, yet international operations across the US, Switzerland, and UAE require
              ongoing compliance monitoring against multinational regulatory shifts.
            claimRefs:
