  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Financing Context and Sovereign Prime Backing
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI achieved headline unicorn status in January 2026 following a $200 million Series B financing
              round led by Dassault Aviation that established a post-money valuation mark of $1.4 billion. The round
              expanded cumulative equity funding to $242 million across seed, Series A, and Series B transactions,
              drawing co-investment from French state vehicle Bpifrance and sovereign-backed Future French Champions
              alongside early venture backers Atlantic Labs and FirstMark. Dassault Aviation's anchor participation
              represents an explicit corporate strategic bet designed to integrate Harmattan AI's autonomous systems
              directly into French combat aviation programs. However, this private valuation reflects rapid venture
              repricing rather than verified commercial execution. In the broader defense technology market,
              institutional investors have raised cautions regarding overheated multiples across unmanned systems. While
              sovereign European defense budgets provide strong tailwinds, underwriting the $1.4 billion valuation
              requires looking past funding announcements to operating unit economics.
