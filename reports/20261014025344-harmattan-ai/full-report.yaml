  - id: TE002
    title: Operational Workflow and Tactical Use-Case Analysis
    columns:
      - Tactical Mission Job
      - Conventional Military Workflow
      - Harmattan AI Autonomous Solution
      - Measurable Operational Benefit
      - Key Technical Limitation
    rows:
      - - Platoon-Level Tactical ISR
        - Heavy, tethered, or imported commercial quadcopters with vulnerable datalinks
        - Sonora micro-UAV with edge computer vision and autonomous return
        - Squad-organic 40-minute persistent reconnaissance exceeding 2 km range
        - Limited 1.8 kg payload capacity restricts multi-sensor simultaneous carriage
      - - Base & Asset Counter-UAS
        - Expensive surface-to-air missiles or static RF jammers
        - GOBI lightweight kinetic autonomous interceptor with onboard tracking
        - Low-cost attritable defeat of multi-drone swarms without missile exhaustion
        - Kinetic engagement envelope requires early radar detection cueing
      - - Sovereign Deep Strike
        - Multi-million-dollar cruise missiles or imprecise loitering munitions
        - IRIFI containerized autonomous UAV with non-GNSS optical terminal guidance
        - Meter-level precision at 2,000 km standoff without satellite navigation dependence
        - Sub-radar low-altitude routing increases terrain-following flight risk
      - - Combat Aviation Teaming
        - Manual pilot teleoperation or single-drone remote relay
        - Embedded autonomy core for Rafale F5 and UCAS loyal wingman MUM-T
        - Cockpit workload reduction and automated formation coordination under heavy EW
        - Full F5 combat entry not scheduled until circa 2030
    notes: >-
      Use cases represent operational workflows derived from DGA contracts, Dassault partnership disclosures, and
      corporate mission profiles. Metrics reflect published design envelopes.
