  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor / Category
      - Pricing & Contract Model
      - Included Capabilities
      - Discounting & Cost Unknowns
      - Procurement Implication
    rows:
      - - Harmattan AI
        - Firm-fixed-price drone batches and R&D milestone contracts
        - Hardware platform, integrated edge AI, and mission C2 software
        - Per-unit bill-of-materials and maintenance margins undisclosed
        - Scalable batch procurement favored by French DGA (5,000-unit DELCO order)
      - - US Defense-Tech (Anduril / Shield AI)
        - Hardware-plus-software subscriptions and defense prime tenders
        - Autonomous airframes, persistent C2 software, sensor integration
        - International allied transfer costs and ITAR compliance overhead
        - Procurement often restricted in Europe due to sovereignty mandates
      - - European Defense AI (Helsing)
        - Software licensing and joint development integrations with primes
        - AI sensing algorithms, battlefield decision support software
        - Platform integration fees and hardware margin markups from partners
        - Requires separate prime hardware contract, creating procurement friction
      - - Legacy Primes (Thales / BAE / Dassault)
        - Cost-plus development and long-term sustainment contracts
        - Exquisite platforms, whole-life logistics, sovereign maintenance
        - Frequent cost overruns and protracted multi-year delivery timelines
        - Absorbs majority of defense capital expenditure; resistant to rapid change
      - - Commercial / FPV Drone Assemblers
        - Spot-market purchase orders and commercial hardware catalog sales
        - Bare airframe kit, open-source or commercial radio control links
        - Volatile component pricing and short operational product lifespans
        - Rapid tactical replenishment without multi-year institutional lock-in
    notes: >-
      Pricing mechanisms reflect public defense tender frameworks and program-of-record milestones. Unit pricing and
      commercial margins are not publicly disclosed.
    claimRefs:
      - CP006
      - CP011
      - CP012
      - CP013
