  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Procurement Channels
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI categorizes its commercial and government footprint across four primary customer tiers,
              distinguished by procurement authority, mission posture, and technological integration depth. The anchor
              tier comprises sovereign ministries of defense from NATO-aligned nations, specifically the French
              Direction Générale de l'Armement (DGA) and the United Kingdom Ministry of Defence. These sovereign buyers
              procure hardware-integrated autonomous systems through formal defense budgets and long-term capability
              planning cycles.


              The second tier encompasses Tier-1 aerospace and defense prime contractors, dominated by Dassault
              Aviation. In this channel, Harmattan AI functions as a specialized autonomy and mission-system integration
              partner for next-generation combat air architectures such as the Rafale F5 and Unmanned Combat Air Systems
              (UCAS). The third tier consists of forward-deployed operational testing partners, where platforms and edge
              AI software undergo field evaluation in contested electronic-warfare environments, as demonstrated in
              Ukraine via Raybird platform integration. The fourth emerging tier represents allied non-NATO sovereign
              governments, initiated in 2026 through strategic defense and industrial cooperation with the Royal
              Moroccan Armed Forces.
