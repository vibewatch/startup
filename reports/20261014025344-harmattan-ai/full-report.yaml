        title: 'Aviation Architecture: Embedded AI, MUM-T, and Combat Integration'
        blocks:
          - type: paragraph
            body: >-
              Beyond attritable tactical platforms, Harmattan AI serves as an embedded autonomy partner for France's
              sovereign combat aviation ecosystem through its strategic partnership with Dassault Aviation. The
              collaboration embeds Harmattan AI's autonomy core directly into mission computers for the upcoming Rafale
              F5 fighter aircraft standard and France's unmanned combat air system (UCAS) loyal wingman program,
              scheduled for operational integration around 2030. Within manned-unmanned teaming (MUM-T) architectures,
              the company's software operates as a cockpit cognitive multiplier, automating sensor fusion, threat
              prioritization, and unmanned wingman flight paths to reduce pilot workload under severe data saturation.
              In July 2026, Harmattan AI demonstrated operational airframe coordination when its NAMIB electronic
              warfare payload conducted a successful joint test flight alongside a Rafale fighter. Additionally, the
              company validated its autonomy software under operational combat conditions in Ukraine through an
              integration partnership with Skyeton's Raybird reconnaissance UAV, refining its multi-agent algorithms
              against active electronic countermeasures.
