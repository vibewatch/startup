      - number: '8.3'
        title: Scenario Valuation Modeling and Peer Multiples
        blocks:
          - type: paragraph
            body: >-
              Evaluating Harmattan AI's entry valuation requires scenario modeling across bull, base, and bear operating
              cases alongside private and public comparables. Because management maintains strict confidentiality over
              revenue run-rate, gross margins, and cash burn, the implied enterprise-value-to-revenue multiple cannot be
              validated through public records. In the bull case, Harmattan AI captures substantial production contracts
              for Rafale F5 unmanned teaming, successfully scales sovereign component manufacturing with industrial
              partners like Valeo, and expands multi-nation NATO deployments, supporting a future valuation between $3.5
              billion and $5.0 billion. In the base case, the company fulfills French DELCO and British MoD commitments
              with moderate hardware margins, yielding an enterprise valuation between $1.5 billion and $2.0 billion.
              The bear case models program delays, commoditization of micro-drone hardware, or venture multiple
              contraction, potentially forcing a down-round or consolidation sale below $800 million. Peer comparables
              such as Quantum Systems and Tekever highlight strong sovereign demand, yet also emphasize that defense
              multiples compress sharply if software revenue fails to materialize.
            claimRefs:
