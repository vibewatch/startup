        title: Exhibits
        blocks:
          - type: callout
            title: Sovereign Industrial Integration with Tier-One Prime
            body: >-
              Harmattan AI has achieved unprecedented integration with France's primary aerospace manufacturer, Dassault
              Aviation, embedding edge-autonomy software directly into future air combat programs (Rafale F5 and UCAS)
              [CO003, CO005]. This anchor relationship provides massive technical credibility and defense export
              pathways rarely accessible to early-stage defense hardware startups [CO005].
