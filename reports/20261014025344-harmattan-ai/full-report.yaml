      - number: '6.4'
        title: Customer Concentration, Procurement Friction and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Despite remarkable early contract growth, Harmattan AI presents acute customer concentration and
              procurement friction risks that warrant strict investment caution. Over 90 percent of the company's
              publicly documented contract backlog is concentrated within just two government counterparties: the French
              Direction Générale de l'Armement and the UK Ministry of Defence. This bilateral dependency leaves the
              business vulnerable to sovereign budget realignments, political shifts, or delays in national defense
              appropriations.


              Furthermore, Harmattan AI's long-term enterprise value is tightly coupled with Dassault Aviation's
              developmental milestones for the Rafale F5 and UCAS combat architectures, which are not scheduled for
              operational deployment until 2030. In the interim, public financial reporting remains completely opaque:
              no verified disclosures exist for Annual Recurring Revenue, Net Revenue Retention, gross margins, or unit
              economics. In addition, broader market analysts have raised concerns regarding potential overheating and
              eventual consolidation across European defense drone manufacturers. As a result, while customer traction
              is validated by Programs of Record, financial durability remains an open diligence question.
