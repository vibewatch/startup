        title: Manufacturing Scale, Supply Chain Sovereignty, and Trust Controls
        blocks:
          - type: paragraph
            body: >-
              A foundational differentiator claimed by Harmattan AI is vertical integration across hardware tooling,
              avionics, motor manufacturing, and mission software, compressing design-to-delivery timelines down to
              several months. To secure its supply chain against foreign geopolitical chokepoints and export controls,
              Harmattan AI partnered with French automotive supplier Valeo to produce sovereign drone electric motors in
              France that completely eliminate heavy rare earth elements starting in early 2027. Production capacity is
              anchored in the Paris metropolitan region, with a pilot site assembling over 1,300 drones per month in
              late 2025 and an expanded 6,000-square-meter facility planned near Orly designed to reach a capacity of
              10,000 units monthly. From a technical governance perspective, the company embeds a strict dual human
              authorization framework into its lethal systems such as IRIFI: human commanders approve targets and issue
              the final launch commit, after which edge autonomy governs flight execution within tightly constrained
              boundaries without mid-flight manual intervention. Nevertheless, independent verification of manufacturing
              defect rates, factory yields, and supply chain resiliency remains an ongoing diligence gap amidst broader
              market concerns regarding European defense drone scaling.
