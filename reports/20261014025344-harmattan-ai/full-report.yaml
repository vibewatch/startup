      - number: '6.3'
        title: Retention Durability, Land-and-Expand Mechanics and Customer Journey
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI's customer acquisition model follows a disciplined military land-and-expand trajectory
              tailored to sovereign procurement cycles. Initial customer contact is established through urgent
              operational evaluations or rapid-delivery trial batches addressing urgent tactical gaps, such as
              attritable squad reconnaissance under dense jamming. By meeting accelerated delivery timelines—such as
              completing the French Army's 1,000-unit initial batch in under six months—the company transitions from
              experimental testing into formalized Programs of Record.


              Attaining Program of Record status with both the French and UK defense ministries creates powerful
              structural retention durability. In sovereign defense procurement, a Program of Record establishes
              multi-year budgetary justification, embedding software protocols and logistical support into military
              doctrine. This status creates exceptionally high switching costs that protect against competitor
              displacement. From this entrenched position, Harmattan AI executes cross-platform expansion: transitioning
              buyers from low-cost micro-reconnaissance drones (Sonora) to kinetic counter-UAS interceptors (GOBI),
              complex electronic warfare payloads (NAMIB), and strategic deep-strike cruise platforms (IRIFI).
              Furthermore, deep integration into Dassault Aviation's Rafale F5 MUM-T ecosystem locks Harmattan AI's
              autonomy software into European defense procurement roadmaps extending past 2030.
