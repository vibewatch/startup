      - number: '6.2'
        title: Adoption Trajectory and Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              Since its incorporation in April 2024, Harmattan AI has exhibited rapid procurement momentum, moving from
              experimental trial deliveries to large multi-thousand-unit production contracts within twenty-four months.
              In June 2025, the French DGA awarded the company its first micro-drone contract for 1,000 Sonora (military
              designation DELCO) quadcopters. Harmattan AI completed full manufacturing and delivery within six months,
              and the French military formally verified receipt of the initial batch in January 2026.


              Demonstrated manufacturing reliability and rapid field iteration enabled Harmattan AI to secure
              substantial follow-on commitments. In September 2025, the UK Ministry of Defence ordered 3,000 autonomous
              systems as part of an expanding multi-million-pound capability integration initiative. Crucially, on June
              23, 2026, the French DGA expanded its procurement commitment fivefold, contracting an additional 5,000
              DELCO reconnaissance drones for the French Army with delivery slated for early 2027. Outside pure robotic
              platforms, Harmattan AI validated its mission payload integration on July 13, 2026, when its NAMIB
              electronic warfare system completed a successful joint flight test with a Dassault Rafale fighter
              aircraft. In October 2026, the company signed a letter of intent with Morocco for the procurement and
              domestic co-production of its IRIFI 2,000-kilometer deep-strike system.
            claimRefs:
