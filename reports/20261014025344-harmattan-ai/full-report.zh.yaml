            body: >-
              公司的成本结构由内部平台组装、嵌入式软件工程和战略性次级供应商采购共同构成，资本密集度高。Harmattan 在巴黎运营月产 1,300 架无人机的装配基地，并计划扩展到巴黎地区 6,000 平方米基地，目标月产
