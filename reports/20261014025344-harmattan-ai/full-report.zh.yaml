              Harmattan AI 按采购权、任务姿态和技术集成深度，将商业及政府业务分为四个主要客户层。第一层是 NATO 盟国的主权国防部，具体包括法国 Direction Générale de
              l'Armement（DGA）和英国国防部。这些主权买方通过正式防务预算和长期能力规划周期采购硬件集成的自主系统。

              第二层是由 Dassault Aviation 主导的一级航空航天和防务主承包商。Harmattan AI 在该渠道中作为自主能力和任务系统集成伙伴，服务 Rafale F5 和 UCAS
              等下一代作战航空架构。第三层是前沿部署的作战测试伙伴，平台和边缘 AI 软件在受争夺的电子战环境中接受实地评估，乌克兰的 Raybird 平台集成就是例子。第四个正在形成的层级是盟国非 NATO
              主权政府，2026 年通过与 Royal Moroccan Armed Forces 开展战略防务和工业合作启动。
