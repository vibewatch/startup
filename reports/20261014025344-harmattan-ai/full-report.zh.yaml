          detail: Atlantic Labs 领投首轮种子融资，W Ventures 和 Tholus Capital 参与。
          tone: positive
        - date: 2025-03
          label: Series A 融资
          detail: FirstMark Capital 领投 Series A 融资，加速自主系统研发。
          tone: positive
        - date: 2025-06
          label: 首份法国国防部合同
          detail: 法国 DGA 授予首份项目备案合同，采购 1,000 架 Sonora（DELCO）微型无人机，须在六个月内交付。
          tone: positive
        - date: 2025-09
          label: 英国国防部采购
          detail: 从英国国防部获得 3,000 套无人机系统的大额合同。
          tone: positive
        - date: 2026-01
          label: Series B 与独角兽地位
