      - number: '8.3'
        title: 情景估值建模与可比公司倍数
        blocks:
          - type: paragraph
            body: >-
              评估 Harmattan AI 的入场估值，需要把乐观、基准和悲观运营情景与私人及上市可比公司放在一起建模。由于管理层对收入运行率、毛利率和烧钱速度严格保密，隐含的企业价值 /
              收入倍数无法通过公开记录验证。乐观情景下，Harmattan AI 获得 Rafale F5 无人机协同的大额生产合同，与 Valeo 等工业伙伴成功扩大主权零部件制造，并拓展多国 NATO 部署，未来估值可达
              $3.5 billion 至 $5.0 billion。基准情景下，公司以中等硬件利润率履行法国 DELCO 和英国国防部承诺，企业估值为 $1.5 billion 至 $2.0
              billion。悲观情景考虑项目延期、微型无人机硬件商品化或风险资本倍数收缩，可能迫使公司以低于 $800 million 的估值下轮融资或被整合出售。Quantum Systems、Tekever
              等可比公司显示主权需求强劲，但也说明一旦软件收入未能兑现，防务估值倍数会大幅压缩。
            claimRefs:
              - CV006
