  - id: FE001
    title: Harmattan AI 垂直整合自主系统架构
    type: stack
    summary: 六层架构层级，展示从实体机体和主权推进系统，到边缘感知、自主算法和 C2 指挥治理的垂直整合。
    data:
      layers:
        - label: 第 5 层：指挥与治理（C2）
          description: 双人授权协议、任务规划与任务监管，配合严格的故障安全参数
          modules:
            - 双人承诺授权
            - 分布式机群 C2 控制台
            - NATO STANAG 任务接口
        - label: 第 4 层：自主与协同逻辑
          description: 原生边缘机群协同、非 GNSS 光学路径规划，以及编队级 MUM-T 软件
          modules:
            - 去中心化机群协同
            - Rafale F5 MUM-T 集成核心
            - 末端光学制导管线
        - label: 第 3 层：传感器融合与感知
          description: 多模态实时传感器处理，用于威胁识别和态势感知
          modules:
            - SAHARA 机载 SAR 图像处理
            - 双 EO/IR 计算机视觉跟踪
            - RF 与电子支援措施引擎
        - label: 第 2 层：边缘计算与航空电子
          description: 加固型边缘计算运行实时操作系统，不依赖云端
          modules:
            - 低 SWaP 军标边缘 AI 加速器
            - 高韧性飞控计算机
            - 加固型本地总线架构
        - label: 第 1 层：主权推进与执行机构
          description: 欧洲主权硬件部件，消除对非盟国供应链的依赖
          modules:
            - Valeo 无稀土电动机
            - 高速率机体执行机构连接
            - 快速模块化电池与电源管理
        - label: 第 0 层：消耗型机体平台
          description: 针对低单位成本、快速迭代和高速率制造优化的垂直整合实体平台
          modules:
            - Sonora 1.8 kg 微型 UAV 机体
            - GOBI 动能拦截器机体
            - IRIFI 集装箱式远程打击平台
    approximationNotes: 架构分层综合自公开产品定义和工程招聘披露；各层之间的专有接口协议未披露。
    claimRefs:
