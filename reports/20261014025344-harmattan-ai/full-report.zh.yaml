      - number: '8.4'
        title: 投资建议与优先尽调要求
        blocks:
          - type: paragraph
            body: >-
              鉴于当前估值水平以及完全缺乏经验证的财务业绩数据，对 Harmattan AI
              的分析结论是继续研究，风险评级为高，估值立场介于合理与投机之间。公司成立两年内就积累了非凡的战略动能，也获得了政府客户验证。但在无法看清经常性软件收入占比、毛利率结构和股权结构表优先权条款的情况下，以 $1.4
              billion
              估值进入股权轮，违背基本受托责任。潜在投资者必须把资金投放绑定在明确的尽调里程碑上，尤其要审计历史交付利润率，核实法国和英国装备编制项目的积压订单转化时间，并评估战略主承包商投资者持有的清算优先权悬置。除非通过私下披露澄清这些运营和财务参数，否则投资者应保持积极跟踪，而不是发出没有对冲的买入信号。
            claimRefs:
