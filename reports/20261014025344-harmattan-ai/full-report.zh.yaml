    approximationNotes: 定性评分依据国防采购里程碑、公开法定披露，以及截至 2026 年 10 月的可比风险投资估值。
    claimRefs:
      - CR001
      - CR006
      - CR012
      - CR013
  - id: FV001
    title: 建议逻辑链
    type: flow
    summary: 这条结构化决策链把主权级验证点和估值阻力串联起来，最终得出“继续研究”的建议。
    data:
      nodes:
        - id: scale-proof
          label: 主权级国防验证
          detail: 法国 DGA 和英国国防部的正式列装项目，证明机构客户正在快速采用
        - id: prime-partnership
          label: 战略主承包商整合
          detail: Dassault Aviation 领投 $200M B 轮，为 Rafale F5 自主系统提供资金
        - id: industrial-scaling
          label: 制造扩张
          detail: 通过垂直整合和主权级零部件采购，实现可消耗型无人机的大规模生产
        - id: valuation-pricing
          label: 估值里程碑
          detail: $1.4B 投后估值抬高了市场对商业增长的预期
        - id: disclosure-gap
          label: 财务披露不透明
          detail: ARR、毛利率和私募优先权结构条款均未披露，无法评估收入质量
        - id: recommendation-outcome
          label: 投资姿态
          detail: 私人审计完成前，结论为继续研究，风险评级为高
      edges:
        - from: scale-proof
          to: prime-partnership
        - from: prime-partnership
          to: industrial-scaling
        - from: industrial-scaling
          to: valuation-pricing
        - from: valuation-pricing
          to: disclosure-gap
        - from: disclosure-gap
          to: recommendation-outcome
    approximationNotes: 该流程基于已发布的国防业务进展和财务信息缺口，展示定性决策路径。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV009
      - CV010
      - CV014
