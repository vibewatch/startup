chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、领导层与治理架构
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 是一家法国防务科技公司，以简化股份公司（société par actions simplifiée）形式注册，总部位于巴黎 1 Rue du Mail [CO001]。公司由首席执行官
              Mouad M'Ghari、首席技术官 Martin de Gourcuff 和 Jean-Patrice Coste 于 2024 年 4 月创立，开发面向高强度作战场景的垂直整合机器人硬件和边缘自主任务系统
              [CO001, CO002]。公司在法国巴黎、Meudon 和 Savigny-le-Temple 设有运营设施，并在美国 Austin、Texas、Switzerland 和 United Arab
              Emirates 设有国际前沿办公室，以配合 NATO 及盟军的作战需求 [CO001, CO002, CO008]。高管层存在明显的关键人物风险，核心是联合创始人兼 CEO Mouad
              M'Ghari；他负责欧洲和北非的商业合作与主权防务业务，而正式董事会构成、投资人投票门槛和保护性清算条款仍未披露 [CO002, CO009]。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.2'
        title: 资本化轨迹与投资人联合体
        blocks:
          - type: paragraph
            body: >-
              公司于 2026 年 1 月 12 日成为独角兽，以法国战斗机主承包商 Dassault Aviation 领投的 $200 million B 轮融资收官，投后估值 $1.4 billion，累计股权融资达到
              $242 million [CO003, CO004]。此前融资包括 Atlantic Labs 领投的 2025 年 2 月种子轮和 FirstMark Capital 领投的 2025 年 3 月 A
              轮，另有 W Ventures、Tholus Capital、Motier Ventures 和 Sisyphus Ventures 等风险投资及天使投资人参与 [CO003, CO004]。Dassault
              Aviation 的战略持股巩固了工业联盟，重点是在未来作战平台（包括 Rafale F5 战斗机和 Unmanned Combat Air System（UCAS））中集成嵌入式自主能力和有人—无人协同
              [CO003, CO005]。尽管获得这一重量级股权背书，董事席位分配、清算优先权倍数和少数股东否决权等治理参数仍严格保密 [CO009]。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO009
      - number: '1.3'
        title: 工业制造规模与商业执行
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 通过快速批量制造可消耗、软件定义的自主防务平台形成差异化，在巴黎地区运营一座成熟的 6,000 平方米工厂，月产能最高可达 10,000 套 [CO006,
              CO008]。商业动能来自主权在册项目，包括 2025 年 6 月与法国 Direction Générale de l'Armement（DGA）签订的首份 1,000 架 Sonora
              侦察微型无人机合同，公司在六个月内交付，随后于 2026 年 6 月获得五倍续订订单，数量增至 5,000 架 [CO006, CO007]。与此同时，英国国防部采购 3,000 套自主无人系统，形成覆盖两个主要
              NATO 强国的已验证双边采购 [CO004, CO007]。除微型侦察产品外，公司还扩展至 GOBI 反 UAS 拦截器、与 Rafale 战斗机协同飞行演示过的 NAMIB 电子战载荷，以及具备 2,000
              公里航程和双人授权保护机制的 IRIFI 深度打击自主平台 [CO006, CO007, CO010]。
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO008
              - CO010
