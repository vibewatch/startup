      - number: '6.3'
        title: 留存持久性、落地扩张机制与客户旅程
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI
              按照适配主权采购周期的军事型“落地—扩张”路径获客。最初接触来自紧迫的作战评估或快速交付的试用批次，用于解决高强度干扰下班组侦察等紧急战术缺口。通过满足加速交付时限——例如在六个月内完成法国陆军 1,000
              套首批订单——公司从试验测试转入正式在册项目。

              同时获得法国和英国防务部门的在册项目身份，会带来强大的结构性客户留存。在主权防务采购中，在册项目提供多年预算依据，把软件协议和后勤支持嵌入军事作战体系。这一身份形成极高的切换成本，保护公司免遭竞争者替代。站稳后，Harmattan
              AI 进行跨平台扩张：将买方从低成本微型侦察无人机（Sonora）带向动能反 UAS 拦截器（GOBI）、复杂电子战载荷（NAMIB）和战略深度打击巡航平台（IRIFI）。此外，深度集成进 Dassault
              Aviation 的 Rafale F5 MUM-T 生态，也把 Harmattan AI 的自主软件锁定在延续至 2030 年之后的欧洲防务采购路线图中。
            claimRefs:
              - CU010
              - CU011
              - CU012
