      - number: '2.4'
        title: 增长驱动、主权工业要求与运营约束
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI
              可服务市场的快速扩张由结构性地缘政治顺风推动，但受到重大运营和监管约束。需求侧的首要催化剂是可消耗规模的战略必要性：现代无人机战争表明，用百万美元级地空拦截弹攻击千美元级商用改装攻击无人机在经济上不可持续，因而催生了对低成本动能拦截器和蜂群侦察资产的巨大需求。强调战略工业自主的欧洲政治要求，也加速防务采购摆脱美国及非盟国供应商。为抓住这一驱动因素，Harmattan
              AI 大举投资本土制造，在巴黎地区建立设计月产 10,000 套的生产基地，并与汽车供应商 Valeo
              合作，在法国制造无稀土主权电机。另一方面，商业采用仍面临严重约束。部署自主军事系统会触发严格的伦理和法律监管，尤其涉及 AI
              幻觉风险、计算机视觉目标判别失误，以及军方不可妥协的致命打击双人授权要求。主权采购周期还容易受防务预算科目变化和机密项目边界影响，使公司的单位经济性和长期生产利润率仍属私人信息。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 可消耗规模与协同饱和攻击令防务采购从平台成本转向批量交付
            body: >-
              乌克兰现代高强度冲突的作战经验，迫使欧洲和 NATO 防务部门从少量、数百万美元级高端有人系统转向可消耗、批量制造的自主无人机。Harmattan AI
              以工业规模制造商身份实现月产数千套，正面切入这一主权采购转向。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM008
          - type: callout
            title: 主权工业护城河取决于未经审计的高产率制造与本土部件安全
            body: >-
              Harmattan AI 已通过法国 DGA 和英国 MoD 在册项目及与 Dassault Aviation 的合作获得重要主权验证，但其长期市场份额取决于能否将巴黎产能成功扩至月产 10,000 套，并通过
              Valeo 等合作伙伴消除稀土供应依赖，同时不暴露机密单位经济性。
            calloutType: risk
            claimRefs:
              - CM001
