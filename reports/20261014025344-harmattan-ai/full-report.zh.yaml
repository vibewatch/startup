      - number: '7.3'
        title: 客户集中、主承包商绑定与平台锁定
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的交易对手高度集中，核心是主权买方和工业防务主承包商。商业动能主要来自两项国家采购计划：法国 DGA 采购 5,000 架 DELCO 侦察无人机，以及英国国防部订购 3,000
              套自主系统。Dassault Aviation 进一步放大了这种战略集中：它领投了 2026 年 1 月的 $200 million Series B，并担任平台总架构师，将 Harmattan 的自主能力整合进
              Rafale F5 和无人作战航空系统（UCAS）。这段合作把 Harmattan 纳入欧洲旗舰作战航空路线图，但也把技术开发绑在 Dassault 多年的采购周期上；Rafale F5 的作战就绪目标要到
              2030 年。若法国防务采购重点出现摩擦，或 Harmattan 与 Dassault 失配，开发中的自主软件可能在全机队部署前陷入搁置。
            claimRefs:
