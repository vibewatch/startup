  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、采购合同与变现结构
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI
              在欧洲主权及盟国防务采购中采用硬件与软件结合的变现模式。公司不销售独立零部件硬件或拆分的企业软件许可，而是直接向国防部和一级防务主承包商供应垂直整合的自主武器系统、无人航空平台及机载任务智能软件。近期主要收入引擎是政府直接采购合同，包括法国
              Direction Générale de l'Armement（DGA）采购 Sonora（DELCO）侦察无人机：2025 年交付 1,000 架，2026 年 6 月追加 5,000 架；以及英国国防部采购
              3,000 套自主系统。第二条商业收入流围绕与主承包商的长期联合开发和技术植入展开，由 Dassault Aviation 战略合作牵引，将 Harmattan 的自主栈集成进 Rafale F5 标准和
