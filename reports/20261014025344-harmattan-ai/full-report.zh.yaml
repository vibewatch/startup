              年初起制造无稀土主权电机，以消除脆弱的供应链瓶颈，同时集成法国成像专业厂商 Lynred 的红外传感器。固定成本主要来自专业人员，员工人数从 130 人增至超过 170
              人，主要为系统、机器人和机器学习工程师及防务作战老兵。由于 BOM 数据未披露，单位可变成本仍无法验证；1.8 千克的 Sonora 等可消耗四旋翼无人机可能将硬件制造成本维持在商用防务门槛以下，但 IRIFI
              等集装箱化深度打击系统的部件和测试成本显著更高。尽调需要经过审计的 BOM 分解，以及硬件交付与软件支持之间的毛利归因。
