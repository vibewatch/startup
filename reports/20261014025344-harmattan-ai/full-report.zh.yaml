  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景与主权主承包商支持
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 在 2026 年 1 月完成由 Dassault Aviation 领投的 $200 million Series B 融资后，成为头条独角兽，投后估值达到 $1.4
              billion。本轮融资使种子轮、Series A 和 Series B 累计股权融资达到 $242 million；法国国有投资机构 Bpifrance、主权支持的 Future French
              Champions 与早期风投 Atlantic Labs、FirstMark 共同跟投。Dassault Aviation 的锚定投资是明确的企业战略押注，意在把 Harmattan AI
              的自主系统直接整合进法国作战航空项目。但这一私人估值体现的是风险资本快速重估，而非经验证的商业执行。在更广泛的防务科技市场，机构投资者已警告无人系统估值倍数过热。欧洲主权防务预算虽提供强劲顺风，评估 $1.4
              billion 估值仍需绕过融资公告，回到运营单位经济模型。
