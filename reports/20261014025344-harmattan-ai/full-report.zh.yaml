      - number: '7.4'
        title: 财务不透明、市场过热、风险热力图与投资逻辑破裂触发器
        blocks:
          - type: paragraph
            body: >-
              财务风险集中在严重的信息披露不透明，而宏观背景又是防务科技市场过热。Harmattan 以 $242 million 累计融资支撑 $1.4 billion
              估值，达到独角兽地位，但公司没有披露经审计的收入运行率、毛利率或月度烧钱指标。风险投资分析师担心，欧洲防务科技估值已经跑在底层经常性现金流前面；一旦采购交付被取消或预算多年遭冻结，公司就可能面临下轮融资估值下调。投资判断取决于监测五个可量化的逻辑破裂触发器：（1）法国
              CIEEMG 拒绝或撤销深度打击系统出口许可；（2）Valeo 未能在 2027 年年中前交付合格的无稀土电动机；（3）Dassault 的 Rafale F5 集成里程碑连续多年延期；（4）法国 DGA
              5,000 套合同交付违约；或（5）月度烧钱持续超过 Series B 补充融资阈值。
            claimRefs:
              - CR001
