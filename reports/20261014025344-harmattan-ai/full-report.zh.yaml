        title: 护城河持久性、替代威胁与市场过热
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的竞争优势能否持久，取决于有人—无人协同能否保持技术领先，同时抵御全市场商品化 [CP004] [CP012]。公司与 Dassault Aviation
              的合作把自主软件直接嵌入未来空战平台，具体包括 Rafale F5 战斗机的有人—无人协同（MUM-T）以及计划自 2030 年起投入使用的相关 UCAS [CP004] [CP015]。在深度打击行动中，CEO
              Mouad M'Ghari 将 IRIFI 构想为混合能力，把低成本 Shahed 式无人机的可消耗批量生产与昂贵巡航导弹的末端精度和导航韧性结合起来 [CP013]。但竞争风险仍然显著。2025
              年全球防务科技风险投资达到 49.1 billion dollars，投资热情已引发对无人机硬件市场过热的担忧
              [CP012]。若传统主承包商成功建立低成本自主子公司，或商用无人机组装商实现电子战加固，Harmattan AI 的硬件溢价可能被侵蚀，除非其软件集成继续深度嵌入 [CP012] [CP015]。
