        blocks:
          - type: paragraph
            body: >-
              自 2024 年 4 月注册以来，Harmattan AI 的采购动能迅速增强，在 24 个月内从试验性交付发展到数千套级别的大型生产合同。2025 年 6 月，法国 DGA 向公司授予首份微型无人机合同，采购
              1,000 架 Sonora（军方编号 DELCO）四旋翼机。Harmattan AI 在六个月内完成全部制造和交付，法国军方于 2026 年 1 月正式确认收到首批设备。

              已展示的制造可靠性和快速现场迭代，使 Harmattan AI 获得了大额后续承诺。2025 年 9 月，英国国防部在扩大的数百万英镑能力集成计划中订购 3,000 套自主系统。关键是，2026 年 6 月 23
              日，法国 DGA 将采购承诺扩大五倍，为法国陆军追加 5,000 架 DELCO 侦察无人机，计划于 2027 年初交付。除纯机器人平台外，Harmattan AI 于 2026 年 7 月 13
              日验证任务载荷集成，其 NAMIB 电子战系统与 Dassault Rafale 战斗机完成成功联合飞行测试。2026 年 10 月，公司与 Morocco 签署意向书，拟采购并在当地联合生产 IRIFI
              2,000 公里深度打击系统。
