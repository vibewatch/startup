      - number: '3.2'
        title: 技术架构与作战能力矩阵
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的核心架构差异化来自端到端垂直整合，覆盖机器人机体、边缘计算、传感器载荷和任务级自主软件 [CP003]。这与 Helsing 等欧洲 AI
              软件纯公司形成鲜明对比，后者依赖传统航空航天主承包商提供实体平台和传感器吊舱 [CP001] [CP003]。Harmattan AI 的产品组合通过三个统一系统直接满足主要作战需求：GOBI 动能反 UAS
              拦截器、Sonora 微型侦察无人机（法国陆军称其为 DELCO），以及 IRIFI 远程深度打击自主平台 [CP009]。关键在于，Harmattan AI
              的自主导航和决策逻辑在边缘侧运行，无需持续卫星导航连接，因此即使处于受争夺、电子干扰的作战环境，也能实现有韧性的多智能体执行。 Harmattan AI 还通过供应链主权形成差异化：公司与法国汽车供应商
              Valeo 合作，在法国制造不含重稀土的主权电机，建立商业无人机组装商难以复制的安全硬件基础 [CP005]。
            claimRefs:
