    title: 风险热力图
    type: matrix
    summary: 综合热力图，从可能性、影响、缓解措施成熟度和残余严重性等维度评估核心国防科技风险。
    data:
      columns:
        - label: 可能性
          detail: 当前合同周期内发生的概率
        - label: 影响
          detail: 运营和财务中断的严重程度
        - label: 缓解措施成熟度
          detail: 正在实施的技术和合同反制措施状态
        - label: 残余严重性
          detail: 未对冲的公司投资判断下行风险
      rows:
        - label: 两用物项出口与跨境军品转让
          note: CIEEMG 和欧盟出口管制管辖范围
          values:
            - text: 中
