      - number: '6.4'
        title: 客户集中度、采购摩擦与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管早期合同增长显著，Harmattan AI 仍存在严重的客户集中和采购摩擦风险，需要严格投资审慎。公司公开记录的合同积压中，超过 90% 集中于两个政府对手方：法国 Direction Générale de
              l'Armement 和英国国防部。这种双边依赖使业务容易受到主权预算重排、政治变化或国家防务拨款延迟影响。

              此外，Harmattan AI 的长期企业价值与 Dassault Aviation 在 Rafale F5 和 UCAS 作战架构上的开发里程碑紧密相连，而这些架构要到 2030
              年才计划投入使用。在此之前，公开财务报告完全不透明：没有经验证据披露 Annual Recurring Revenue、Net Revenue
              Retention、毛利率或单位经济性。更广泛的市场分析师还担心欧洲防务无人机制造商可能过热并最终整合。因此，尽管在册项目验证了客户进展，财务持久性仍是开放的尽调问题。
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 在册项目身份改变客户持久性
            body: 在主权防务合同中，获得法国 DGA 和英国 MoD 的在册项目身份构成决定性进入壁垒。不同于面临年度流失的商业 SaaS 合同，在册项目把自主系统纳入多年防务预算框架和军事 doctrine，使竞争者极难替代。
            calloutType: insight
            claimRefs:
              - CU005
              - CU010
              - CU011
          - type: callout
            title: 两极主权集中掩盖底层收入脆弱性
            body: >-
              Harmattan AI 的客户基础高度集中：超过 90% 的可见系统数量依赖法国和英国防务机构的双边采购决策。任何政治重点重排、防务预算扣押或 Rafale F5
              采购延迟，都将不成比例地冲击公司收入和工业利用率。
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、出口管制、军民两用与自主武器合规
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 处于法国和欧洲防务出口管制体系的密集监管之下。公司的微型 ISR 无人机（Sonora / DELCO）和远程系统（IRIFI）属于军民两用及军用物资，须接受法国 Commission
              Interministérielle pour l'Étude des Exportations de Matériels de Guerre（CIEEMG）的严格许可。Harmattan 虽已通过法国
              Direction Générale de l'Armement（DGA）在册项目取得国内批准，但跨境商业转让——例如 2026 年 6 月宣布的 Morocco
              战略合作——仍容易受到出口许可延迟或政府间否决影响。谈到自主武器治理，Harmattan
              通过架构保护机制应对国际人道法问题：其作战理念强制自主任务执行，同时在释放致命打击前保留双人授权。公司作为扎根巴黎的法国简化股份公司（SAS），其主权知识产权受欧洲司法管辖区保护；但在美国、Switzerland
              和 UAE 的国际业务仍需持续监控跨国监管变化。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
