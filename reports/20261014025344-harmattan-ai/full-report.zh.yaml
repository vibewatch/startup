          tone: positive
        - date: 2026-06
          label: 法国订单五倍续订
          detail: 法国 DGA 订购 5,000 架后续 DELCO 侦察无人机供陆军部署，订单量扩大五倍。
          tone: positive
        - date: 2026-07
