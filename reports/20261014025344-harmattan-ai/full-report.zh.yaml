      - number: '3.3'
        title: 采购动态、定价结构与机构切换成本
        blocks:
          - type: paragraph
            body: >-
              机构准入和采购锁定，是主权盟国防务市场的重要进入壁垒 [CP006]。Harmattan AI 将早期试验转化为法国和英国国防部的正式在册项目，取得多年期防务承诺 [CP006]。法国防务采购机构在 2026 年
              6 月将首笔 1,000 架 Sonora 微型无人机订单扩大五倍至 5,000 架，英国国防部则签约采购 3,000 套自主系统 [CP011]。Dassault Aviation 领投公司的 200
              million dollar B 轮融资，这一战略协同将 Harmattan AI 锚定在欧洲主要作战航空项目内部，形成初创竞争者无法获得的分销渠道杠杆 [CP004]。为支持这些合同，Harmattan AI
              将巴黎产能扩至月产 1,300 架，并计划在 Orly 工业基地扩到月产 10,000 架，超过多家传统欧洲无人机生产商的年产能
              [CP014]。不过，虽然合同数量已披露，单位价格和毛利率仍是严密保护的私人指标，需要继续核查长期制造成本效率 [CP011]。
