      - number: '1.4'
        title: 估值倍数、披露缺口与防务市场逆风
        blocks:
          - type: paragraph
            body: >-
              法国总统 Emmanuel Macron 称赞 Harmattan AI 的 B 轮融资对欧洲主权防务自主至关重要，但公司的估值倍数建立在激进的前瞻性工业执行之上，而不是已披露的商业基本面 [CO005,
              CO011]。当前收入运行率、净利润率、现金消耗率和资本续航等基本财务数据均未披露，属于完全不透明的私人数据，令财务尽调受限
              [CO012]。独立机构投资人已公开警告主权防务科技风险投资轮次可能出现投机过热，尤其是在欧洲无人机和反无人机系统领域，高额资本流入可能超过采购预算 [CO011]。此外，Harmattan AI
              的规模化逻辑面临潜在硬件供应链风险：公司依赖外部工业转型，例如 Valeo 计划自 2027 年起制造不含重稀土的电机，以降低零部件采购风险 [CO006, CO011]。
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO012
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 与一级主承包商的主权工业集成
            body: >-
              Harmattan AI 已与法国主要航空航天制造商 Dassault Aviation 实现前所未有的集成，将边缘自主软件直接嵌入未来空战项目（Rafale F5 和 UCAS）[CO003,
              CO005]。这段锚定式关系提供了巨大的技术可信度和防务出口通道，是早期防务硬件初创公司通常难以获得的 [CO005]。
            calloutType: strength
            claimRefs:
              - CO003
              - CO005
          - type: callout
            title: 估值脱节与防务科技投机担忧
            body: >-
              在融资 $242 million、估值 $1.4 billion 且商业收入完全未披露的情况下，Harmattan AI 的估值倍数正受到审视，市场也更广泛地警告欧洲无人机科技可能投机过热 [CO004,
              CO011, CO012]。若缺乏已验证的收入利润率和现金消耗可见性，高强度防务制造将面临严重的资产负债表脆弱性 [CO011, CO012]。
            calloutType: risk
            claimRefs:
              - CO004
              - CO011
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、威胁环境与主权防务采购
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 将市场边界划在垂直整合的自主防务系统上，明确排除非防务商业企业无人机软件和传统的数百万美元高端有人机体。公司覆盖四个相互衔接的功能领域：班组级可消耗微型无人航空系统（代表产品为
              Sonora，法国武装部队称其为 DELCO）、动能反无人航空系统（GOBI
              拦截器）、集装箱化远程自主深度打击无人机（IRIFI），以及嵌入式协同指挥控制人工智能软件。现代乌克兰高强度冲突带来了迫切的作战需求：电子战适应速度、无人机高损耗和大规模饱和攻击，使传统防空范式的成本难以承受。Harmattan
              AI 并非作为外部软件供应商去适配传统主承包商机体，而是在统一的主权架构下同时设计机器人硬件和机载 AI
              任务系统。法国和英国的主权防务部门已从短期试验性拨款转向授予正式在册项目，以多年采购路径把公司的可服务市场锚定在已验证的国家防务预算上。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
      - number: '2.2'
        title: 可服务市场规模：多视角 TAM、SAM 与 SOM 架构
        blocks:
          - type: paragraph
            body: >-
              评估防务自主能力的可服务市场，需要多个互补的规模测算视角，而不是一个投机性的自上而下数字。宏观资本层面，PitchBook 数据显示，2025 年全球防务科技风险投资和私募股权投资达到创纪录的 $49.1
              billion，反映出机构动能持续增强；在 Harmattan AI 于 2026 年 1 月达到 $1.4 billion 估值之前，Quantum Systems 和 Tekever
              等欧洲无人机公司已成为独角兽。从公共采购角度看，全球军用无人飞行器市场每年支出约 $14.5
              billion；随着军队重新评估平台脆弱性，战术型和可消耗无人机成为增长最快的细分市场。在这项全球支出中，Harmattan AI 的可服务可得市场（SAM）聚焦欧洲和 NATO 盟国主权预算中的可消耗
              UAS、巡飞弹和反无人机系统，估计可服务规模为 $1.6 billion 至 $3.8 billion。其可服务可获得市场（SOM）由已确认的主权项目锚定：法国 DGA 采购 5,000 架 Sonora
              无人机、英国国防部承诺采购 3,000 套自主系统，以及与 Morocco 的远程深度打击合作，合计形成 $420 million 至 $850 million 的近期硬件、载荷和软件许可管线。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM009
              - CM011
      - number: '2.3'
        title: 盟国防务框架下的买方、用户与付款方动态
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 目标市场的采购动态呈现出清晰的买方、用户和付款方分层，并决定采用速度与收入实现。主要付款方是通过集中采购机构运作的国家国防部，具体包括法国 Direction Générale de
              l'Armement（DGA）和英国 Defence Equipment and
              Support（DE&S）组织。这些机构买方掌握多年期资本预算，并对本土制造和知识产权托管执行严格的主权标准。相比之下，实际用户是一线军事编制，具体为法国陆军步兵排和英国陆军侦察旅；它们依据 GNSS
              受限环境下的生存性、班组级部署便利性和快速野外充电能力评估系统。第三个关键客户层是由 Dassault Aviation 牵头的一级防务航空主承包商，后者领投 Harmattan AI 的 $200
              million B 轮融资。在这一层，买方是工业主承包商，把 Harmattan AI 的嵌入式自主软件集成到未来作战平台，尤其是 Rafale F5 标准和其 UCAS 无人僚机作战系统。最后，Morocco
              等战略性非 NATO 主权伙伴构成正在形成的第四类买方，寻求本地化制造、联合研究中心，以及借助自主深度打击能力实现主权威慑。
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM003
