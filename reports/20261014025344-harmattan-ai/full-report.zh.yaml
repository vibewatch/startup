  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与市场替代方案分类
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 所处竞争场域由五类防务供应商和战术替代方案构成 [CP001]。第一类是 Anduril Industries 和 Shield AI
              等资本充足的美国防务科技公司，它们在自主空中系统、反 UAS 及指挥控制领域率先推出软件中心的防务平台 [CP001]
              [CP007]。这些美国同业拥有巨大的风险投资规模，但欧洲战略自主指令和主权防务采购监管为其进入核心欧洲防务架构设置了天然壁垒。第二类是欧洲防务科技纯软件公司，尤其是总部位于 Munich 的
              Helsing，专注人工智能软件和战场决策支持套件 [CP001]。第三类是专业化欧洲无人航空系统制造商，包括 Germany 的 Quantum Systems 和 Portugal 的
              Tekever；二者均凭借在欧洲军事战区部署战术 ISR 无人机，于 2025 年成为独角兽 [CP002]。第四类是 Thales、Airbus Defence and Space 和 BAE Systems
              等传统欧洲防务主承包商，它们掌控成熟的在册项目和机构采购渠道，但成本结构高、开发周期长
              [CP008]。最后，现状替代方案包括低成本商用第一视角无人机和军方内部研发项目，补充速度快，却缺乏争夺制空环境所需的韧性、电子战抗性和多智能体协同能力 [CP001]。
