      - number: '7.2'
        title: 工业制造可扩展性、部件采购与质量失效模式
        blocks:
          - type: paragraph
            body: >-
              扩大硬件产能是 Harmattan AI 最棘手的运营挑战。公司宣称已具备工业级产能，每月交付数千套系统；巴黎工厂目前每月组装 1,300 架无人机，并正扩建至一座目标月产能 10,000 套、面积 6,000
              平方米的设施。但推进这一爬坡会让精密传感器载荷和电推进系统暴露出严重的供应链脆弱性。为降低对中国稀土磁材供应的依赖，Harmattan 于 2026 年 7 月与法国汽车供应商 Valeo 签约，从 2027
              年初开始制造主权可控、无稀土的电动无人机电机。在这条主权供应线成熟前，低速生产仍容易受到次级供应商零部件瓶颈的影响。              在实战电子战中，Harmattan 部署边缘 AI
              推理和基于视觉的导航，降低 GPS 干扰风险；这些能力已与乌克兰合作伙伴 Skyeton 在前线作战试验中测试过，但争议环境下持续的传感器性能下降仍带来长期可靠性风险。
            claimRefs:
              - CR006
              - CR007
              - CR008
