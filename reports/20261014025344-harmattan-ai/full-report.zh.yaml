  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与作战理念
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI
              围绕“协同饱和”作战理念定义产品组合，设计军事硬件和软件架构，使其作为统一的自主力量运行，而不是孤立的机器人资产。现代作战环境日益充斥激烈电子战、卫星通信退化和前线装备高损耗。对此，Harmattan AI
              构建可消耗自主系统，使其承受作战风险、维持战术规模，同时不牺牲战略资本资产。公司的核心技术架构是边缘自主：感知、导航和目标处理直接在平台航电上执行，而不是依赖持续远程操控或集中式云基础设施。这种边缘计算让无人系统群组在通信链路被干扰或拒止的环境中保持协同任务行为、执行分布式任务并维持作战节奏。
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: 系统组合：平台、拦截器、载荷与发射器
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 已部署及已宣布的产品组合覆盖无人航空系统、动能防空和专业传感载荷四大能力领域。说到战术侦察，公司制造 Sonora（法国陆军称其为 DELCO），这是一款 1.8 千克四旋翼微型
              UAV，续航 40 分钟，搭载光电和红外传感器及本地视觉里程计，面向 GNSS 受限区域的排级侦察。针对反无人航空系统，公司部署
              GOBI，这是一款轻型高速动能拦截器，旨在探测、跟踪并摧毁抵达友军资产前的敌方无人机蜂群。远程行动上，Harmattan AI 宣布 IRIFI，这是一套可消耗深度打击无人机系统，作战半径 2,000
              公里，配备集装箱化机动发射器和末端光学制导，可绕过雷达探测并摆脱对卫星导航的依赖。为这些平台提供支持的是 SAHARA 合成孔径雷达载荷，具备机载处理能力，可在全天候条件下生成高分辨率地形和目标图像。
