      - number: '8.2'
        title: 投资逻辑与反向逻辑综合
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的投资逻辑建立在一个获得主权方直接支持、提供可消耗型防务技术的供应商定位上。公司设计垂直整合的自主系统，把边缘 AI
              软件、多智能体协同和快速硬件生产结合起来，覆盖情报、侦察和反无人机任务。法国武器装备总署与英国国防部的正式客户合同和装备编制项目，加上 Dassault Aviation 长期的 Rafale F5
              与无人作战航空系统集成路线图，为一家成立仅两年的防务初创公司提供了少见的合同能见度。反向逻辑则集中在财务不透明和结构性采购风险：Harmattan AI
              所处的是资本密集型制造领域，如果单位利润为负，扩大月度无人机产量会迅速耗尽现金。此外，公司高度依赖防务主承包商伙伴，因此要承受政府测试周期拉长和利润率被压缩的风险。
