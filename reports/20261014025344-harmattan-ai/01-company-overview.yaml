callouts:
  - calloutType: "strength"
    title: "Sovereign Industrial Integration with Tier-One Prime"
    body: "Harmattan AI has achieved unprecedented integration with France's primary aerospace manufacturer, Dassault Aviation, embedding edge-autonomy software directly into future air combat programs (Rafale F5 and UCAS) [CO003, CO005]. This anchor relationship provides massive technical credibility and defense export pathways rarely accessible to early-stage defense hardware startups [CO005]."
    claimRefs:
      - "CO003"
      - "CO005"
  - calloutType: "risk"
    title: "Valuation Disconnect and Defense-Tech Speculation Concerns"
    body: "At a $1.4 billion valuation on $242 million raised with completely undisclosed commercial revenues, Harmattan AI's valuation multiple faces scrutiny amidst wider market warnings regarding speculative overheating in European drone tech [CO004, CO011, CO012]. Without verified revenue margins and cash burn visibility, high-intensity defense manufacturing carries acute balance-sheet vulnerability [CO011, CO012]."
    claimRefs:
      - "CO004"
      - "CO011"
      - "CO012"
