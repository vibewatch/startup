company:
  name: "Harmattan AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Harmattan AI is a Paris-based autonomous defense systems company founded in April 2024 that designs, manufactures, and integrates attritable uncrewed aerial platforms, counter-UAS interceptors, long-range strike systems, and command-and-control software. In January 2026, the company raised a $200 million Series B led by Dassault Aviation at a $1.4 billion valuation, reaching unicorn status on the back of multi-thousand-unit procurement awards from the French and UK Ministries of Defence."
sections:
  - id: "identity-governance"
    title: "Corporate Identity, Leadership, and Governance Architecture"
    body: "Harmattan AI is a French defense technology company incorporated as a simplified joint-stock company (société par actions simplifiée) with its corporate headquarters at 1 Rue du Mail in Paris [CO001]. Founded in April 2024 by Chief Executive Officer Mouad M'Ghari, Chief Technology Officer Martin de Gourcuff, and Jean-Patrice Coste, the company develops vertically integrated robotic hardware and edge-autonomy mission systems tailored for high-intensity operational theaters [CO001, CO002]. Operating facilities span Paris, Meudon, and Savigny-le-Temple in France, alongside international forward offices across the United States in Austin, Texas, Switzerland, and the United Arab Emirates, supporting operational alignment with NATO and allied armed forces [CO001, CO002, CO008]. Executive leadership exhibits acute key-person exposure centered on co-founder and CEO Mouad M'Ghari, who steers commercial partnerships and sovereign defense engagements across Europe and North Africa, while formal board composition, investor voting thresholds, and protective liquidation provisions remain undisclosed [CO002, CO009]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-shareholders"
    title: "Capitalization Trajectory and Investor Syndicate"
    body: "The company achieved unicorn status on January 12, 2026, closing a $200 million Series B funding round led by French combat aircraft prime Dassault Aviation at a post-money valuation of $1.4 billion, which brought lifetime equity financing to $242 million [CO003, CO004]. Prior capital infusions consisted of a February 2025 Seed round led by Atlantic Labs and a March 2025 Series A led by FirstMark Capital, supplemented by venture and angel backers including W Ventures, Tholus Capital, Motier Ventures, and Sisyphus Ventures [CO003, CO004]. Strategic equity ownership by Dassault Aviation solidifies an industrial alliance focused on integrating embedded autonomy and manned-unmanned teaming into future combat platforms including the Rafale F5 fighter and Unmanned Combat Air System (UCAS) [CO003, CO005]. Despite this marquee cap-table endorsement, governance parameters such as board seat allocation, liquidation preference multiples, and minority shareholder veto rights remain strictly private [CO009]."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO009"
    tableRefs:
      - "TO003"
  - id: "operational-footprint"
    title: "Industrial Manufacturing Scale and Commercial Execution"
    body: "Harmattan AI differentiates itself through rapid volume manufacturing of attritable and software-defined autonomous defense platforms, operating an established 6,000-square-meter facility in the Paris region capable of producing up to 10,000 systems monthly [CO006, CO008]. Commercial momentum is anchored by sovereign Programs of Record, including a June 2025 initial contract for 1,000 Sonora reconnaissance micro-drones from the French Direction Générale de l'Armement (DGA) delivered within six months, followed by a fivefold renewal order for 5,000 units in June 2026 [CO006, CO007]. In parallel, the United Kingdom Ministry of Defence awarded an acquisition contract for 3,000 autonomous unmanned systems, establishing verified bilateral procurement across two leading NATO powers [CO004, CO007]. Beyond micro-reconnaissance, product expansion includes the GOBI counter-UAS interceptor, the NAMIB electronic warfare payload demonstrated in collaborative flight with a Rafale fighter, and the IRIFI deep-strike autonomous platform featuring 2,000-kilometer reach and dual-human authorization safeguards [CO006, CO007, CO010]."
    claimRefs:
      - "CO004"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO010"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "strategic-risks"
    title: "Valuation Multiples, Disclosure Gaps, and Defense Market Headwinds"
    body: "While French President Emmanuel Macron praised Harmattan AI's Series B as vital for sovereign European defense autonomy, the company's valuation multiple rests upon aggressive forward industrial execution rather than disclosed commercial fundamentals [CO005, CO011]. Fundamental financial figures—including current revenue run-rate, net margins, cash burn rate, and capital runway—remain completely undisclosed private data points, leaving financial diligence constrained [CO012]. Independent institutional investors have openly warned of speculative overheating in sovereign defense-tech venture rounds, specifically across European drone and counter-drone systems where high capital inflows risk outpacing procurement budgets [CO011]. Furthermore, Harmattan AI's scaling thesis faces potential hardware supply-chain vulnerabilities, evidenced by its dependence on external industrial transitions such as Valeo's initiative to manufacture heavy-rare-earth-free electric motors starting in 2027 to de-risk component sourcing [CO006, CO011]."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO011"
      - "CO012"
