callouts:
  - calloutType: risk
    title: 'Strategic Vulnerability: Prime Dependency and Long-Cycle Integration'
    body: >-
      While Dassault Aviation's $200 million Series B investment solidifies Harmattan AI's sovereign positioning, tying
      future enterprise value to the Rafale F5 and UCAS wingman introduces multi-year execution dependency. The Rafale
      F5 standard is not scheduled to become operational until 2030, meaning substantial commercial volume from
      manned-unmanned teaming will take years to materialize.
    claimRefs:
      - CR001
      - CR010
  - calloutType: recommendation
    title: 'Critical Diligence Milestone: Factory Audit and Export Approvals'
    body: >-
      Underwriting Harmattan AI requires institutional investors to demand two verifiable disclosures: an unredacted
      manufacturing inspection verifying true monthly assembly run-rates at the Paris facility, and formal confirmation
      of CIEEMG export approval status for deep-strike platforms such as IRIFI.
    claimRefs:
      - CR002
      - CR006
      - CR014
