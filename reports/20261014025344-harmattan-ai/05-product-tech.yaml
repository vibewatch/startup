chapter:
  number: 5
  title: "Product & Technology"
  summary: "Harmattan AI designs and manufactures vertically integrated autonomous defense systems, spanning tactical micro-UAVs (Sonora/DELCO), kinetic C-UAS interceptors (GOBI), deep-strike platforms (IRIFI), and radar payloads (SAHARA) powered by edge mission intelligence and collaborative autonomy software for NATO militaries and combat aircraft integration."
sections:
  - id: "product-definition-and-operational-doctrine"
    title: "Product Definition and Operational Doctrine"
    body: "Harmattan AI defines its product suite around an operational doctrine termed coordinated saturation, designing military hardware and software architectures to function as unified autonomous forces rather than isolated robotic assets. Modern combat environments increasingly feature intense electronic warfare, degraded satellite communications, and high loss rates for frontline equipment. In response, Harmattan AI constructs attritable autonomous systems engineered to absorb operational risk and maintain tactical mass without jeopardizing strategic capital assets. The company's core technological architecture centers on edge autonomy, executing perception, navigation, and targeting workloads directly on platform avionics rather than relying on persistent remote teleoperation or centralized cloud infrastructure. This edge-native computation enables groups of unmanned systems to maintain coordinated mission behavior, execute distributed tasks, and preserve operational tempo across contested environments where radio-frequency links are jammed or denied."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
  - id: "portfolio-systems-and-subsystems"
    title: "Systems Portfolio: Platforms, Interceptors, Payloads, and Launchers"
    body: "Harmattan AI's fielded and announced product portfolio encompasses four primary capability domains across uncrewed aerial systems, kinetic air defense, and specialized sensing payloads. In tactical reconnaissance, the company manufactures Sonora (designated DELCO by the French Army), a 1.8-kilogram quadcopter micro-UAV delivering 40 minutes of flight endurance, electro-optical and infrared sensors, and local visual odometry tailored for platoon-level reconnaissance in GNSS-denied areas. For counter-unmanned aerial systems (C-UAS), the company deploys GOBI, a lightweight, high-speed kinetic interceptor designed to detect, track, and kinetically destroy hostile drone swarms before they reach friendly assets. In long-range operations, Harmattan AI announced IRIFI, an attritable deep-strike drone system featuring a 2,000-kilometer operational radius, containerized mobile launcher, and terminal optical guidance that bypasses radar detection and satellite navigation dependence. Supporting these platforms is SAHARA, a synthetic aperture radar payload with onboard processing that generates high-resolution terrain and target imagery across all-weather operating conditions."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE001"
  - id: "combat-aviation-architecture-and-operating-model"
    title: "Aviation Architecture: Embedded AI, MUM-T, and Combat Integration"
    body: "Beyond attritable tactical platforms, Harmattan AI serves as an embedded autonomy partner for France's sovereign combat aviation ecosystem through its strategic partnership with Dassault Aviation. The collaboration embeds Harmattan AI's autonomy core directly into mission computers for the upcoming Rafale F5 fighter aircraft standard and France's unmanned combat air system (UCAS) loyal wingman program, scheduled for operational integration around 2030. Within manned-unmanned teaming (MUM-T) architectures, the company's software operates as a cockpit cognitive multiplier, automating sensor fusion, threat prioritization, and unmanned wingman flight paths to reduce pilot workload under severe data saturation. In July 2026, Harmattan AI demonstrated operational airframe coordination when its NAMIB electronic warfare payload conducted a successful joint test flight alongside a Rafale fighter. Additionally, the company validated its autonomy software under operational combat conditions in Ukraine through an integration partnership with Skyeton's Raybird reconnaissance UAV, refining its multi-agent algorithms against active electronic countermeasures."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE002"
  - id: "industrial-scaling-supply-chain-and-governance-controls"
    title: "Manufacturing Scale, Supply Chain Sovereignty, and Trust Controls"
    body: "A foundational differentiator claimed by Harmattan AI is vertical integration across hardware tooling, avionics, motor manufacturing, and mission software, compressing design-to-delivery timelines down to several months. To secure its supply chain against foreign geopolitical chokepoints and export controls, Harmattan AI partnered with French automotive supplier Valeo to produce sovereign drone electric motors in France that completely eliminate heavy rare earth elements starting in early 2027. Production capacity is anchored in the Paris metropolitan region, with a pilot site assembling over 1,300 drones per month in late 2025 and an expanded 6,000-square-meter facility planned near Orly designed to reach a capacity of 10,000 units monthly. From a technical governance perspective, the company embeds a strict dual human authorization framework into its lethal systems such as IRIFI: human commanders approve targets and issue the final launch commit, after which edge autonomy governs flight execution within tightly constrained boundaries without mid-flight manual intervention. Nevertheless, independent verification of manufacturing defect rates, factory yields, and supply chain resiliency remains an ongoing diligence gap amidst broader market concerns regarding European defense drone scaling."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
