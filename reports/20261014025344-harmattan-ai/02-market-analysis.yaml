callouts:
  - calloutType: insight
    title: Attritable Mass and Coordinated Saturation Shift Defense Procurement from Platform Cost to Volume Delivery
    body: The operational lessons of modern high-intensity conflict in Ukraine have forced European and NATO defense ministries to pivot from small numbers of exquisite, multi-million-dollar crewed systems toward attritable, mass-manufactured autonomous drones. Harmattan AI's positioning as an industrial-scale manufacturer producing thousands of units monthly directly targets this sovereign procurement shift.
    claimRefs:
      - CM001
      - CM004
      - CM008
  - calloutType: risk
    title: Sovereign Industrial Moats Hinge on Unaudited High-Rate Manufacturing and Domestic Component Security
    body: While Harmattan AI has secured major sovereign validation through French DGA and UK MoD Programs of Record alongside a partnership with Dassault Aviation, the company's long-term market share depends on successfully scaling its Paris production capacity to 10,000 units monthly and eliminating rare-earth supply dependencies via partners like Valeo without exposing classified unit economics.
    claimRefs:
      - CM001
      - CM006
      - CM012
      - CM014
