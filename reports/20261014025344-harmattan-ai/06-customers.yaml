callouts:
  - calloutType: insight
    title: Program of Record Status Transforms Customer Durability
    body: In sovereign defense contracting, achieving Program of Record status with the French DGA and UK MoD represents a decisive barrier to entry. Unlike commercial SaaS contracts subject to annual churn, Programs of Record integrate autonomous systems into multi-year defense budgeting frameworks and doctrine, making displacement by competitors exceptionally difficult.
    claimRefs:
      - CU005
      - CU010
      - CU011
  - calloutType: risk
    title: Bipolar Sovereign Concentration Masks Underlying Revenue Vulnerability
    body: 'Harmattan AI''s customer base displays extreme concentration: over 90 percent of visible system volume rests on bilateral procurement decisions by French and UK defense authorities. Any political re-prioritization, defense budget sequestration, or delay in Rafale F5 procurement would disproportionately impact company revenue and industrial utilization.'
    claimRefs:
      - CU013
      - CU014
      - CU015
