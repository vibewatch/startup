  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-retention-and-margin-transparency
      missingEvidence: Audited financial disclosure of Annual Recurring Revenue (ARR), Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and gross margin per delivered autonomous system.
      whyItMatters: Without retention and margin metrics, diligence cannot evaluate whether multi-thousand unit contracts with the French DGA and UK MoD generate profitable, repeatable defense software revenue or low-margin hardware manufacturing.
      diligencePath: Request customer contract schedules, unit pricing breakdowns, and maintenance service revenue from Harmattan AI management under NDA.
      relatedQuestionRefs:
