callouts:
  - calloutType: "insight"
    title: "Sovereign Industrial Vertical Integration as Europe's Core Moat"
    body: "Harmattan AI's decision to control hardware production and partner with Valeo for rare-earth-free electric motors insulates the company from Asian component supply bottlenecks, establishing an industrial barrier that pure-play defense software vendors cannot readily replicate [CP003] [CP005]."
    claimRefs:
      - "CP003"
      - "CP005"
  - calloutType: "risk"
    title: "Hardware Commoditization and Defense Tech Overheating"
    body: "With global defense tech deal volume reaching 49.1 billion dollars in 2025, investor enthusiasm has created overcrowding in drone manufacturing, exposing unarmored attritable platforms to rapid price degradation and margin compression if sovereign primes sponsor competing hardware consortiums [CP012] [CP013]."
    claimRefs:
      - "CP012"
      - "CP013"
