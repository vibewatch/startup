  title: Absence of Audited Cohort Retention Data
  body: While company and press reports highlight 100% pilot conversion, the complete absence of public disclosures regarding Net Revenue Retention (NRR), churn rates, and annual contract values creates diligence uncertainty for long-term customer economics.
