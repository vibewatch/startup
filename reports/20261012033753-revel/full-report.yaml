      - number: '7.2'
        title: Regulatory Mandates, ITAR Export Controls, and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Operating at the nexus of aerospace propulsion, defense articles, and advanced nuclear energy subjects
              Revel to extensive regulatory oversight and export control regimes. The most acute compliance constraint
              is the International Traffic in Arms Regulations (ITAR) administered by the U.S. Department of State
              Directorate of Defense Trade Controls (DDTC). Because Revel's software directly interfaces with rocket
              engines, missile defense prototypes, and satellite deployment stands, its codebase and technical
              specifications constitute defense services and technical data under the United States Munitions List
              (USML). Consequently, Revel must enforce rigorous hiring controls restricted exclusively to U.S. citizens,
              permanent residents, or approved refugees, creating substantial talent acquisition bottlenecks.
              Furthermore, expanding into nuclear control systems through deployments with Radiant Nuclear and Aalo
              Atomics necessitates compliance with Nuclear Regulatory Commission (NRC) software quality assurance
              standards, including NQA-1 protocols. Failure to maintain absolute segregation of export-controlled
              technical data or experiencing an unauthorized access breach could lead to severe civil and criminal
              penalties, export debarment, and immediate termination of key commercial defense contracts.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
