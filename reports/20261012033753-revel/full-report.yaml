        title: Named Customer Evidence & Production Case Studies
        blocks:
          - type: paragraph
            body: >-
              Public customer references provide tangible operational verification of Revel's software in live,
              mission-critical environments. Impulse Space serves as Revel's most prominent public anchor reference,
              relying on RevelTest to conduct high-frequency hot-fire testing of orbital rocket engines. In advanced
              energy, Radiant Nuclear employs Revel as its primary command-and-control platform for micro-reactor design
              and systems operation, validating the platform's suitability for high-hazard physical processes.
              Similarly, official documentation highlights Aalo Atomics utilizing Revel to bring an experimental reactor
              critical over an accelerated development timeline, while Astro Mechanica validates experimental propulsion
              hardware using Revel test infrastructure. While these case studies demonstrate genuine production utility,
              customer accounts are subject to strict U.S. export controls and ITAR regulations, which restrict foreign
              deployment opportunities and necessitate specialized security controls.
