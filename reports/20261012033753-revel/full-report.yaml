      - number: '7.5'
        title: Monitoring Cadence, Diligence Inquiries, and Investment Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Underwriting an investment in Revel at its reported $1 billion-plus post-Series B valuation requires
              institutional investors to establish unambiguous monitoring indicators and non-negotiable thesis-break
              triggers. Core diligence inquiries must address the total absence of public audited financials,
              establishing true monthly cash burn, gross margin composition between software licenses and
              forward-deployed engineering services, and Net Revenue Retention (NRR) across active cohorts. Key
              monitoring indicators include testing frequency trends, enterprise pilot-to-contract conversion rates, and
              the pace of commercial customer expansion outside venture-backed space startups into traditional defense
              primes. Conversely, three critical kill criteria would decisively invalidate the underwriting thesis:
              first, any catastrophic physical test stand or hardware loss directly traced to Revel software command or
              state execution errors; second, an ITAR enforcement action, export control violation, or loss of DoD
              air-gapped security compliance; and third, widespread customer churn among marquee space and energy
              deployments signaling that RevelCode cannot displace entrenched incumbent software stacks.
            claimRefs:
              - CR008
              - CR010
              - CR014
              - CR015
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Existential Downside of Control Software Failure in Physical Actuation
            body: >-
              In high-consequence hardware testing, software failure is not an abstract crash; one erroneous setpoint,
              corrupted packet, or timing delay can result in test stand destruction, facility loss, or catastrophic
              launch aborts.
            calloutType: risk
            claimRefs:
              - CR001
              - CR011
          - type: callout
            title: Regulatory and Operational Friction from ITAR Mandates
            body: >-
              Because Revel's platform directly commands aerospace propulsion and defense test stands, technical data
              and software integration fall under stringent ITAR restrictions, enforcing U.S.-person hiring constraints
              and air-gapped on-premises architectures that restrict international expansion.
            calloutType: risk
            claimRefs:
