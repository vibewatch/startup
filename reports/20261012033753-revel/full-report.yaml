      - number: '4.3'
        title: Unit Economics, Cost Drivers, and Financial Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              From an investment diligence perspective, Revel exhibits high strategic momentum paired with near-complete
              financial opacity. Because Revel operates within high-consequence hardware sectors requiring strict
              reliability and ITAR compliance, its direct costs are shaped by forward-deployed engineering support,
              high-touch customer qualification, and specialized software-runtime development rather than off-the-shelf
              SaaS delivery. While preliminary market profiles assert ~1,000 completed pilots and 100% conversion rates
              alongside rapid testing frequency gains, these assertions remain uncorroborated by independent accounting
              audits or financial statements. Furthermore, entrenched incumbents such as National Instruments (LabVIEW)
              maintain defensive distribution networks and multi-decade customer lock-in that could create pricing
              pressure or prolonged enterprise sales cycles as Revel attempts to expand beyond frontier venture-backed
              aerospace startups into traditional defense primes and legacy industrial operators. Without access to
              audited gross margins, cash burn rate, net revenue retention, and revenue run-rate, institutional
              underwriting must treat valuation multiples as speculative.
