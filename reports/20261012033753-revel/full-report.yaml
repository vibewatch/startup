chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Scope, and Operational Architecture
        blocks:
          - type: paragraph
            body: >-
              Revel (revel.io) is an industrial software company headquartered in Los Angeles, California, developing a
              modern control, test, and command platform tailored for high-consequence physical systems. The enterprise
              was founded in mid-2024 by Chief Executive Officer Scott Morton, following his nine and a half years at
              SpaceX where he wrote and maintained mission-critical control software for Falcon 9 propellant loading and
              Starship test stands. Revel addresses a persistent structural bottleneck across aerospace, advanced
              defense, robotics, and energy infrastructure: while physical hardware systems have advanced toward
              autonomous operation, their operational software environments often rely on decades-old, pre-Windows 98
              legacy tooling such as National Instruments LabVIEW, proprietary vendor stacks, or fragile custom scripts.
              Revel provides a unified platform comprising RevelTest for rapid benchtop test configuration and automated
              device discovery, RevelC2 for facility-wide command and control, and RevelCode, a proprietary compiled
              language engineered for deterministic execution without runtime crashes. Operating in regulated defense
              and aerospace sectors, Revel adheres to strict export-control standards, enforcing U.S. International
              Traffic in Arms Regulations (ITAR) eligibility requirements across its technical and product personnel.
