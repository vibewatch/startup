      - number: '5.4'
        title: Developer Signal and Brand Disambiguation
        blocks:
          - type: paragraph
            body: >-
              Technical discovery and practitioner sentiment around Revel's software stack reveal an unusual commercial
              nuance: the company operates under a brand name shared with multiple established, yet entirely unrelated,
              enterprise software entities. Specifically, unbranded web searches and developer directory queries
              frequently surface Revel Systems, a mature iPad-based point-of-sale platform widely deployed in retail and
              restaurant operations, as well as Revel Digital, a cloud-based digital signage content management engine.
              This namespace overlap creates notable discoverability friction and SEO fragmentation for aerospace and
              industrial test engineers searching for hardware control infrastructure. For diligence underwriters,
              separating telemetry signals, customer feedback, and public developer sentiment from these namesake
              entities is critical to establishing an accurate assessment of Revel’s genuine market penetration and
              technical reputation.
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deterministic Safety via Domain-Specific Language Design
            body: >-
              Revel’s decision to build RevelCode as a compiled domain-specific language represents a deliberate
              architectural tradeoff. By enforcing compile-time validation for physical state machines and timing
              constraints, Revel eliminates the common failure mode of unhandled runtime exceptions causing physical
              hardware damage, offering a modern alternative to legacy graphical environments like LabVIEW.
            calloutType: insight
            claimRefs:
              - CE002
              - CE008
          - type: callout
            title: Hardware Driver Dependencies and Remote Control Surface Exposure
            body: >-
              While Revel provides modern browser-accessible control and unified DAQ abstraction, its operational
              reliability remains fundamentally coupled to third-party instrumentation drivers and network boundary
              security. In mission-critical defense and nuclear installations, exposing actuator controls over IP
              networks necessitates stringent air-gapped isolation and cryptographic Commander authorization.
            calloutType: risk
            claimRefs:
