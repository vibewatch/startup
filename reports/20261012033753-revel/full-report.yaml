      - number: '6.4'
        title: Customer Journey, Retention Durability & Procurement Risks
        blocks:
          - type: paragraph
            body: >-
              The customer adoption journey typically begins at the individual benchtop test stand, where automated
              network device autodiscovery reduces initial setup time from weeks to hours. Engineering teams
              subsequently author deterministic test procedures in Revel's proprietary RevelCode language, preventing
              runtime crashes before hardware activates, and monitor live telemetry through browser-based dashboards
              that enable remote interventions. As operational trust matures, customers expand deployments facility-wide
              and transition to centralized control rooms. Despite rapid initial deployment cycles, Revel faces
              significant customer retention and expansion risks. There are zero audited public disclosures regarding
              Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer churn rates, or contract durations.
              Furthermore, expanding from startup beachheads into legacy aerospace primes and defense contractors
              involves navigating multi-year qualification cycles, entrenched LabVIEW codebases, and strict compliance
              boundaries, while independent market observers highlight broader capital volatility across early-stage
              technology investments.
