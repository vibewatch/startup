  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary Definition and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for software-defined hardware control sits at the intersection of test automation,
              real-time data acquisition, and operational command infrastructure. Historically, physical hardware
              development teams have relied on a fragmented assortment of 1980s and 1990s desktop tools, most notably
              National Instruments LabVIEW and VeriStand, augmented by bespoke Python and C++ test scripts maintained by
              specialized internal tools groups. This legacy architecture creates a severe operational bottleneck as
              physical systems in commercial aerospace, defense autonomy, and nuclear energy grow software-driven. Revel
              establishes its market boundary strictly around pure-play control software: visual configuration,
              real-time telemetry streaming, and deterministic command execution from early prototype bring-up through
              full-rate production. By intentionally excluding physical data acquisition (DAQ) chassis, sensors, and
              actuator hardware, the company focuses exclusively on the software layer. This software-first approach
              replaces manual test-bench wiring with autodiscovery and replaces error-prone scripting with RevelCode, a
              domain-specific compiled language designed to eliminate runtime crashes during high-consequence test
              firings.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM007
      - number: '2.2'
        title: 'Constrained Market Sizing: TAM, SAM, and Obtainable Segments'
        blocks:
          - type: paragraph
            body: >-
              Estimating the total market size for modern hardware control requires disentangling bundled
              hardware-software test instrumentation spend from pure software platform budgets. Third-party analyst
              estimates size the broader global test and measurement software market between $8.5 billion and $12.0
              billion annually, encompassing industrial manufacturing, automotive testing, and consumer electronics.
              However, Revel's core serviceable addressable market (SAM) is more tightly constrained to high-consequence
              physical systems across aerospace, defense tech, robotics, and advanced energy, representing an estimated
              $2.4 billion to $3.5 billion annual software opportunity across North America and NATO-allied defense
              industrial bases. Within this sphere, Revel's immediate serviceable obtainable market (SOM) comprises
              venture-backed aerospace startups, commercial space operators, and rapid-prototyping defense contractors,
              representing roughly $450 million to $650 million in high-velocity software budgets. Long-term addressable
              expansion into adjacent heavy industrial process control, including mining, chemical processing, and oil
              and gas operations, offers an additional $1.2 billion to $1.8 billion potential market horizon, though
              enterprise sales cycles in these non-aerospace verticals remain unproven.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
