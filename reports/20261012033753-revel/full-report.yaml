      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Economics
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics across aerospace and defense hardware organizations reveal distinct economic buyers,
              day-to-day operators, and budget allocation patterns. The primary economic buyer is typically a Vice
              President of Hardware Engineering, Head of Propulsion, or Director of Test Operations, who owns program
              delivery timelines and absorbs the financial consequences of delayed test campaigns. Day-to-day users,
              conversely, are test engineers, instrumentation technicians, and systems integration leads who
              historically spent weeks wiring manual DAQ channels, debugging communication protocols, and babysitting
              test consoles. Budget authority is typically drawn from capital expenditure (CapEx) test-stand budgets
              during initial facility buildout, transitioning into recurring operational expenditure (OpEx) software
              subscriptions as platforms scale into multi-bench continuous operations. Early adopters such as Impulse
              Space, Radiant Nuclear, and Astro Mechanica demonstrate that the primary adoption trigger is compressing
              test turnaround times. By enabling test frequency improvements of five to ten times compared to legacy
              tooling, Revel aligns directly with the rapid development velocity demanded by next-generation hardware
              programs.
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM010
              - CM013
      - number: '2.4'
        title: Structural Drivers, Regulatory Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The structural tailwind propelling software-defined control is the secular transition toward autonomous,
              high-cadence physical engineering, where safety and reliability are non-negotiable. Traditional
              script-based test setups fail to provide real-time observability or mathematical guarantees against system
              lockups. Revel addresses this driver through RevelCode's deterministic compile-time checks, ensuring
              control logic cannot crash during live operations. Nevertheless, substantial adoption constraints govern
              enterprise penetration. In defense tech and space systems, strict compliance with International Traffic in
              Arms Regulations (ITAR) and Export Administration Regulations (EAR) imposes rigorous access controls,
              restricting personnel to authorized U.S. persons. Furthermore, mission-critical facility operators demand
              on-premises, fully air-gapped deployments with role-based access control and encrypted storage before
              connecting software to high-pressure fluid loops or nuclear control rods. While early startup traction is
              proven, critical diligence gaps remain regarding Revel's private financial performance, including annual
              recurring revenue, gross margins, net revenue retention, and customer concentration across commercial
              versus defense accounts.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
