  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Topology, Severity Ranking, and Exposure Framework
        blocks:
          - type: paragraph
            body: >-
              Revel's position as a software-defined command-and-control platform for mission-critical physical hardware
              introduces a fundamentally distinct risk profile compared to conventional enterprise SaaS. Because its
              software directly controls test stands, DAQ hardware, and industrial automation equipment, software
              defects can manifest as physical disasters, including rocket engine test stand explosions, nuclear reactor
              control faults, and catastrophic facility loss. The company's risk topology spans five core dimensions:
              operational and hardware actuation hazards, regulatory and ITAR compliance liabilities, early customer
              concentration in frontier venture-backed hardware startups, hardware dependency and instrumentation
              lock-in, and balance-sheet opacity following its $150 million Series B financing. Mitigating these risks
              requires strict determinism in code execution, robust air-gapped on-premises architectures, and
              disciplined customer qualification. While Revel has achieved rapid commercial momentum among leading
              aerospace innovators, the residual exposure remains elevated until the platform achieves broader
              enterprise diversification and independently audited reliability certifications across non-aerospace
              industrial verticals.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR009
              - CR011
