  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Target Industrial Markets
        blocks:
          - type: paragraph
            body: >-
              Revel targets hardware engineering and test operations teams across high-consequence physical industries,
              focusing primarily on aerospace, advanced nuclear energy, autonomous robotics, defense systems, and
              complex industrial manufacturing. Historically, engineering organizations in these sectors have relied on
              fragmented, decades-old instrumentation platforms such as National Instruments LabVIEW, proprietary test
              stands, and brittle internal test scripts. Revel addresses this operational friction by offering a unified
              control and testing software platform that spans benchtop R&D prototyping (RevelTest) and centralized,
              facility-wide operations (RevelC2). Customer demand is segmented across early-stage commercial hardtech
              innovators seeking rapid testing turnaround, and mission-critical operators requiring deterministic
              execution for hazardous physical hardware. Initial commercial traction has concentrated heavily in
              fast-moving venture-backed hardtech companies that prioritize testing velocity over legacy qualification
              standards, while engagement with prime contractors remains in early technical discovery.
            claimRefs:
