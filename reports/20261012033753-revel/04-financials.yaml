callouts:
  - calloutType: "strength"
    title: "Formidable Balance Sheet Cushion from Series B"
    body: "Securing $150 million in February 2026 provides Revel with an extraordinary liquidity moat. In a capital-intensive macro environment where aerospace and hardware startups face financing friction, Revel possesses multi-year runway to aggressively capture engineering talent, invest in custom runtime tooling, and withstand lengthy enterprise procurement cycles."
    claimRefs:
      - "CI001"
      - "CI006"
      - "CI009"
  - calloutType: "risk"
    title: "Financial Opacity Precludes Fundamental Valuation Underwriting"
    body: "While Revel enjoys elite top-tier venture backing and reported unicorn status, the absence of public revenue run-rate, customer contract values, gross margins, and cash burn rate means that valuation is driven almost entirely by strategic sentiment and founder pedigree rather than audited operating performance."
    claimRefs:
      - "CI007"
      - "CI011"
      - "CI012"
      - "CI014"
