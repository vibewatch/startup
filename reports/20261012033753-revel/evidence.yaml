evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Current GAAP revenue, ARR, gross margin percentage, cash burn rate, and balance sheet cash reserves.
    whyItMatters: >-
      Without financial scale metrics, assessing the sustainability of Revel's $1B+ valuation multiple is constrained to
      qualitative proxies.
    diligencePath: Request confidential financial disclosure package, income statements, and SaaS ARR waterfall during diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete board committee composition, independent director roster, and dedicated finance leadership disclosures.
    whyItMatters: >-
      Assessing internal governance controls, audit committee oversight, and finance rigor following large-scale Series
      B capitalization.
    diligencePath: >-
      Inspect board minutes, corporate bylaws, and verify executive hiring searches for permanent Chief Financial
      Officer.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Series B preferred stock purchase agreement, liquidation preference terms, participation rights, and anti-dilution
      protections.
    whyItMatters: Determines downside protection and common equity dilution underlying the reported $1,005M post-money valuation.
    diligencePath: Review certificate of incorporation and investor rights agreements filed with Delaware Division of Corporations.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited financial disclosure of Revel's current ARR, gross margins, net revenue retention, and software contract
      ACV.
    whyItMatters: >-
      Without segmented financial metrics, sizing Revel's serviceable obtainable market relies on third-party estimates
      rather than proven revenue capture.
    diligencePath: Request confidential disclosure of customer cohort economics, ARR bridge, and average contract values under NDA.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Granular third-party market sizing breaking out software-only spend from physical DAQ instrumentation hardware in
      aerospace and industrial test.
    whyItMatters: >-
      Broad industry estimates combine hardware test benches with software licenses, obscuring pure software market
      boundaries.
    diligencePath: >-
      Commission specialized industrial automation market research to isolate annual software license and subscription
      spend across aerospace and defense primes.
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: incumbent-counter-response
    missingEvidence: >-
      Technical roadmaps and R&D investment disclosures from legacy industrial automation incumbents (Siemens, Emerson,
      NI/Emerson) regarding web-native, browser-based DAQ control planes.
    whyItMatters: >-
      If entrenched test vendors release modern web interfaces or Python-first runtimes that bridge to legacy hardware,
      Revel's ergonomic differentiation could face margin compression.
    diligencePath: Interview aerospace test directors and review vendor patent filings and closed-door industrial consortia roadmaps.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited financial statements detailing annual recurring revenue (ARR), recognized revenue, gross margin, operating
      expenses, and monthly cash burn rate.
    whyItMatters: >-
      Without audited financial performance data, investors cannot calculate enterprise valuation multiples or determine
      whether the reported $1B+ valuation is supported by commercial fundamentals.
    diligencePath: >-
      Execute a non-disclosure agreement to inspect internal management accounts, board reporting decks, and audited
      annual financial statements.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-compliance-attestation
    missingEvidence: >-
      Third-party audit reports including SOC 2 Type II attestation, FedRAMP authorization packages, and ITAR enclave
      architecture documentation.
    whyItMatters: >-
      Enterprise aerospace, defense, and nuclear operators require formal independent compliance attestations before
      connecting network-accessible control software to mission-critical hardware.
    diligencePath: >-
      Request Revel's formal security compliance documentation, penetration testing reports, and ITAR compliance
      policies under NDA during technical diligence.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Audited customer account counts, revenue breakdown by named customer, and contractual ARR commitments.
    whyItMatters: >-
      Verifying customer concentration and revenue sustainability requires exact account-level revenue data rather than
      pilot conversion claims.
    diligencePath: >-
      Request customer contract schedules, top-10 customer revenue concentration tables, and master service agreements
      during management diligence.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Historical gross revenue retention (GRR), net revenue retention (NRR), and annual customer churn percentages.
    whyItMatters: >-
      High pilot conversion cannot substitute for long-term renewal and expansion economics in capital-intensive
      hardware software.
    diligencePath: Review trailing twelve-month cohort retention waterfalls and enterprise subscription renewal rates.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: financial-model-risk
    missingEvidence: >-
      Audited financial statements detailing monthly cash burn, gross margins, recurring software revenue vs services,
      and capital runway.
    whyItMatters: >-
      Without visibility into burn rate and capital intensity, investors cannot evaluate how long the $150M Series B
      provides runway before further capital calls.
    diligencePath: >-
      Request trailing twelve-month income statement, software gross margin breakdown, and board-level budget
      projections in confidential data room.
    relatedQuestionRefs:
      - QR006
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Complete audit of Department of State ITAR registrations, export classification rulings (CCATS) under EAR, and
      customer cybersecurity ATOs.
    whyItMatters: >-
      Software used in command and control for defense articles requires strict ITAR compliance; non-compliance creates
      severe civil and criminal penalties.
    diligencePath: Review export control compliance manual, ITAR registration confirmation, and third-party penetration test reports.
    relatedTableRefs:
      - TR001
