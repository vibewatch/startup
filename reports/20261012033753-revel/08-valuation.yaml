- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Strategic pillar
  - Core thesis argument
  - Evidence and validation
  - Anti-thesis risk
  - What would change our view
  rows:
  - - Control layer modernization
    - Hardware engineering requires software-first automation to keep pace with complex autonomous physical systems
    - Customer adoption by Impulse Space, Radiant Nuclear, and Astro Mechanica; 5-10x testing speed improvements cited
    - Incumbent tooling (LabVIEW, custom scripts) has deep operational inertia and engineer familiarity that resists replacement
    - Rapid displacement of legacy DAQ software across tier-1 aerospace defense primes rather than seed-stage startups
  - - Language safety & reliability
    - RevelCode eliminates runtime crashes through deterministic compiled execution, unlocking developer velocity in mission-critical environments
    - SpaceX founder pedigree writing Falcon 9 and Starship control software; runtime safety architecture
    - Proprietary language creates customer lock-in resistance, hiring friction, and long-term developer ecosystem constraints
    - Broad open-source language adoption or standardized SDK integration across commercial DAQ hardware vendors
  - - Enterprise platform expansion
    - Expanding from benchtop R&D test stands (RevelTest) into facility-wide operational command and control (RevelC2) multiplies ACVs
    - Marketing of RevelC2 for unified facility-wide operations; multi-industry push into energy, defense, and robotics
    - Operational command and control introduces severe regulatory, safety, and liability hurdles far exceeding test stand environments
    - Successful production deployment running always-on critical infrastructure in commercial nuclear or defense applications
  - - Valuation & underwriting support
    - High-growth category-defining infrastructure platform commanding premium venture multiple supported by tier-1 syndicate
    - $180M total funding raised; Series B led by Index Ventures with Redpoint, Thrive, Felicis, and Dylan Field
    - Implied $1B+ valuation reflects extreme narrative pricing with zero disclosed ARR, revenue durability, or unit economics
    - Private disclosure of audited ARR >$30M, >75% recurring software gross margins, and clean 1x non-participating preferred terms
  notes: Each row identifies the core thesis rationale, observed evidence, critical downside counterweight, and the specific empirical trigger required to alter our investment stance.
