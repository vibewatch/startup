- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Operating & commercial assumptions
  - Implied ARR & margin profile
  - Target valuation range
  - Probability & downside triggers
  rows:
  - - Bull Case
    - Rapid adoption of RevelC2 across major defense primes; standard control platform for autonomous hard-tech; low services mix
    - ARR >$45M; software gross margin >75%; NRR >130%; customer count >150 enterprises
    - $1,800M – $2,500M (40x–55x forward ARR)
    - 20% probability; triggered by defense prime facility contract announcements and certified safety compliance
  - - Base Case
    - Solid expansion within startup hard-tech ecosystem; selective adoption in defense/aerospace R&D; moderate professional services support drag
    - ARR $12M–$20M; blended gross margin 60%–65%; NRR 110%–115%; customer count 40–70 accounts
    - $700M – $1,100M (45x–70x ARR multiple)
    - 55% probability; reflects current market trajectory, supported by reported Series B valuation mark
  - - Bear Case
    - Prolonged enterprise procurement cycles; customer concentration among high-burn startups; legacy tooling inertia limits RevelC2 rollout
    - ARR <$6M; blended gross margin <50% due to heavy custom engineering; high churn among cash-strapped hard-tech accounts
    - $250M – $450M (down-round restructuring or strategic recapitalization)
    - 25% probability; triggered by startup hard-tech funding slowdown, prime procurement stalls, or major test-stand software incidents
  notes: Valuation ranges represent directional enterprise value bands based on comparable high-growth infrastructure software multiples, as company has not disclosed actual financials.
