callouts:
- calloutType: recommendation
  title: Maintain Rigorous Entry Valuation Discipline
  body: >-
    Do not underwrite Revel at or above the reported $1.0B+ Series B post-money valuation without direct verification of financial metrics. While founder pedigree and early hard-tech pilot adoption are exceptional, public evidence does not establish whether Revel operates as a scalable 80%+ gross margin software enterprise or a forward-deployed engineering services model. Entering at premium unverified multiples exposes common investors to acute capital overhang and down-round restructuring risks.
  claimRefs:
  - CV004
  - CV005
  - CV013
  - CV014
- calloutType: risk
  title: Customer Concentration in Early-Stage Hard-Tech Ecosystem
  body: >-
    Revel's prominent customer references—including Impulse Space, Radiant Nuclear, and Astro Mechanica—represent venture-backed hard-tech startups that themselves operate with significant capital intensity and external financing risk. If macroeconomic tightening restricts venture funding for deep-tech hardware ventures, Revel faces heightened account churn or compressed expansion budgets unless it rapidly diversifies into entrenched aerospace defense primes and profitable industrial conglomerates.
  claimRefs:
  - CV006
