companyProfile:
  summary: >-
    Revel is a Los Angeles-based software company building a unified control and test platform for mission-critical
    hardware operations across aerospace, defense, robotics, and energy. Its stack centers on RevelTest for rapid test
    automation, RevelC2 for facility-wide command and control, and RevelCode, a compiled domain-specific language
    designed to avoid runtime crashes in high-consequence environments. The company has early production traction with
    high-profile hard-tech customers, but it remains privately held and largely opaque on financial performance.
  founders:
    - name: Scott Morton
      role: Founder and CEO
      background: >-
        Former SpaceX engineer who spent nine and a half years building control software for Falcon 9 and Starship
        systems.
      claimRefs:
        - CO002
  foundingLocation: Los Angeles, CA
  headquarters: Los Angeles, CA
  productSummary: >-
