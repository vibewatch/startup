  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              软件定义硬件控制的可服务市场，位于测试自动化、实时数据采集和运营指挥基础设施的交汇处。过去，物理硬件研发团队依赖由 1980 年代和 1990 年代桌面工具组成的碎片化组合，尤其是 National
              Instruments LabVIEW 和 VeriStand，并辅以专业内部工具团队维护的 Python、C++
              定制测试脚本。随着商业航空航天、国防自主系统和核能中的物理系统越来越由软件驱动，这套旧架构形成严重运营瓶颈。Revel
              将市场边界严格限定在纯控制软件：从早期原型启动到满负荷生产，覆盖可视化配置、实时遥测流和确定性指令执行。公司有意排除物理数据采集（DAQ）机箱、传感器和执行器硬件，只聚焦软件层。软件优先的方法用自动发现替代手工测试台接线，并用
              RevelCode 替代容易出错的脚本；该编译型领域专用语言旨在消除高后果测试点火时的运行时崩溃。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM007
      - number: '2.2'
        title: 受约束的市场规模：TAM、SAM 与可获得细分市场
        blocks:
          - type: paragraph
            body: >-
              估算现代硬件控制的总体市场规模，首先要把捆绑销售的软硬件测试仪器支出与纯软件平台预算拆开。第三方分析师估计，更广义的全球测试与测量软件市场每年约为 $8.5B–$12.0B，涵盖工业制造、汽车测试和消费电子。但
              Revel 的核心可服务市场（SAM）更集中于航空航天、国防科技、机器人和先进能源中的高后果物理系统，预计在北美和 NATO 盟国国防工业基地形成每年 $2.4B–$3.5B 的软件机会。在这一范围内，Revel
              的近期可服务可获得市场（SOM）包括风险投资支持的航空航天初创公司、商业航天运营商和快速原型国防承包商，对应约 $450M–$650M
              的高速度软件预算。长期向邻近重工业流程控制扩展，包括采矿、化工加工和油气运营，可能增加 $1.2B–$1.8B 的市场空间，但公司在航空航天以外垂直领域的企业销售周期仍未经证明。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM012
