  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              关键任务硬件测试和运营控制的商业格局，分为根深蒂固的工业巨头与脆弱的内部现状工具两端。数十年来，航空航天、国防和重工业硬件工程团队一直使用诞生于 1980、1990
              年代桌面软件时代的旧测试套件。商业平台过于僵硬、专业化或昂贵时，工程组织便把 Python、C++ 和 MATLAB
              脚本拼接到碎片化台架仪器上。内部脚本虽然立刻提供定制灵活性，却带来严重的长期维护负担，没有编译期硬件安全保证，并形成危险的单工程师故障点。在商业发现环节，采购渠道偶尔会被老牌餐饮 POS 厂商 Revel
              Systems 造成品牌混淆；但技术买方处在完全不同的工业领域，现代开发者体验历来缺位。
            claimRefs:
              - CP001
              - CP007
              - CP014
      - number: '3.2'
        title: 现有厂商画像与市场力量
        blocks:
          - type: paragraph
            body: >-
              National Instruments 凭借庞大的 PXI 和 CompactRIO 机箱全球装机基础及无处不在的 LabVIEW 软件，仍是硬件测试和数据采集领域的主导厂商。NI 于 2023 年以约
              $8.2B 被 Emerson Electric 收购，与航空航天主承包商和政府实验室保持数十年关系。但 NI 的核心图形化数据流编程模型自 Windows 98
              之前以来几乎没有根本性的人机体验演进，造成广泛工程摩擦，并需要专门的 LabVIEW 专家。相邻的 MathWorks 凭借 MATLAB 和 Simulink
              主导上游数学仿真与控制环建模，但其软件架构主要做基于模型的仿真，而非统一的实时测试台遥测和运营。同样，Siemens Simcenter
              等工业自动化套件提供完整的产品生命周期工程，却需要沉重且漫长的企业部署，速度跟不上敏捷测试组织。这些动态为现代执行平台留下了切入口。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
      - number: '3.3'
        title: 技术差异化与产品打包对比
        blocks:
          - type: paragraph
            body: >-
              Revel 的主要技术差异化在于 RevelCode，这是一种专为物理硬件控制而设计的专有编译型领域专用编程语言。不同于解释型 Python 脚本或图形化 LabVIEW 方框图，RevelCode
              会在编译期捕获逻辑矛盾、时序漂移和通道声明错误，先于真实执行器或高压阀门动作。这种编译期安全性消除了高后果硬件测试中的首要故障模式：未处理的运行时异常可能摧毁昂贵的物理资产。在执行引擎之上，Revel
              提供协作式浏览器界面，支持快速拖放创建管道与仪表流程图（P&ID），并把传感器遥测实时传到屏幕。从打包方式看，旧测试软件套件采用复杂分层许可，每增加一个运行时席位或驱动模块都要付费；Revel
              则采用现代云连接企业软件订阅，同时覆盖台架测试和设施指挥。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP013
