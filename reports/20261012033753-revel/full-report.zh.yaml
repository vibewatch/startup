      - number: '7.2'
        title: 监管要求、ITAR 出口管制与法律风险
        blocks:
          - type: paragraph
            body: >-
              Revel 位于航空航天推进、国防物项和先进核能的交叉地带，因此受到广泛监管和出口管制制度约束。最严峻的合规约束是由美国国务院国防贸易管制局（DDTC）执行的《国际武器贸易条例》（ITAR）。由于 Revel
              的软件直接连接火箭发动机、导弹防御原型和卫星部署台，其代码库和技术规格在美国军品清单（USML）下构成国防服务和技术数据。因此，公司必须严格限制招聘，只能雇用美国公民、永久居民或获批准的难民，造成显著人才获取瓶颈。此外，通过与
              Radiant Nuclear 和 Aalo Atomics 的部署进入核控制系统，还必须遵守核管理委员会（NRC）软件质量保证标准，包括 NQA-1
              协议。若未能绝对隔离出口管制技术数据，或发生未经授权的访问泄露，可能导致严重民事和刑事处罚、出口禁入，以及关键商业国防合同立即终止。
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR013
      - number: '7.3'
        title: 运营完整性、故障安全架构与软件确定性
        blocks:
          - type: paragraph
            body: >-
              在高后果工业运营中，以发布后迭代调试为核心的传统软件开发方式不可接受。当软件向低温推进剂阀或高温反应堆回路发出动作指令时，时序漂移或状态歧义可能摧毁硬件。Revel 通过 RevelCode
              降低这一生存级运营风险：该专有编译型语言兼具 Python 风格开发体验和严格确定性执行。RevelCode
              强制执行编译期状态检查，在物理机械动作前验证系统约束和硬件边界，并从架构上消除运行时软件崩溃。在运营环境中，Revel 采用基于角色的访问控制和专用 Commander
              权限，确保只有经过认证的操作员才能发出实时动作指令，同时让工程团队继续读取遥测数据。即使有这些软件护栏，硬件在环（HIL）测试中的边缘仿真差异，以及客户技术员在实时测试中错误配置手动限值，仍会带来剩余运营暴露。
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR011
      - number: '7.4'
        title: 生态依赖、仪器锁定与客户集中
        blocks:
          - type: paragraph
            body: >-
              Revel 迄今的商业牵引力显示出明显的客户与生态集中。公司最知名的案例和主要部署参考集中在一小批风险投资支持的太空与能源初创公司，尤其是 Impulse Space、Radiant Nuclear 和
              Astro Mechanica。若这些锚定客户中的任何一家遭遇重大运载火箭异常、任务失败或资本资不抵债，都会显著影响 Revel 的测试吞吐指标和前线 ARR 扩张。硬件集成上，Revel
              必须保持与主要数据采集（DAQ）和仪器制造商的广泛兼容，首要对象是 National Instruments（NI）、Keysight 和 Vector。Revel
              虽通过自动设备发现和硬件无关的传感器映射规避专有锁定，但掌握专有协议的现有厂商（如 NI LabVIEW 和 VeriStand）可能改变接口标准或制造商业摩擦，以保护旧市场份额。此外，Revel 与 Sift
              的遥测可观测性战略合作，也带来需要持续架构对齐的跨平台集成依赖。
            claimRefs:
              - CR004
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR009
              - CR012
      - number: '7.5'
        title: 监测节奏、尽调问题与投资终止标准
        blocks:
          - type: paragraph
            body: >-
              在已报道的 $1B+ Series B 后估值下对 Revel
              做投资判断，要求机构投资者建立明确的监测指标和不可谈判的论点破坏触发条件。核心尽调问题必须覆盖公开经审计财务完全缺失的事实，包括真实月度现金消耗、软件许可与前线部署工程服务之间的毛利率构成，以及活跃客户队列的净收入留存率（NRR）。关键监测指标包括测试频率趋势、企业试点到合同的转化率，以及商业客户从风险投资太空初创公司向传统国防主承包商扩展的速度。相反，三项关键终止标准会直接推翻投资判断：第一，任何可直接追溯至
              Revel 软件指令或状态执行错误的灾难性测试台或硬件损失；第二，ITAR 执法行动、出口管制违规或失去国防部隔离网络安全合规；第三，知名太空和能源部署中出现大范围客户流失，表明 RevelCode
              无法替代根深蒂固的现有软件栈。
            claimRefs:
              - CR008
              - CR010
              - CR014
              - CR015
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 控制软件在物理动作中失效的生存级下行风险
            body: 在高后果硬件测试中，软件故障不是抽象崩溃；一个错误设定值、损坏的数据包或时序延迟，都可能导致测试台毁坏、设施损失或灾难性发射中止。
            calloutType: risk
            claimRefs:
              - CR001
              - CR011
          - type: callout
            title: ITAR 要求带来的监管与运营摩擦
            body: Revel 的平台直接控制航空航天推进和国防测试台，因此技术数据和软件集成受严格 ITAR 限制，要求只能雇用美国人员，并采用隔离网络本地架构，限制国际扩张。
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与战略取舍
        blocks:
          - type: paragraph
            body: >-
              Revel
              的核心论点很有说服力：用现代统一软件，替换沿用了数十年且脆弱的硬件测试与控制基础设施。在航空航天、国防、机器人和先进核能等关键工业领域，实体机器已经演变为软件定义系统；但测试和运行控制流程长期困在遗留环境里，依赖定制
              Python 脚本、割裂的仪器工具，以及 National Instruments LabVIEW 这类 1980 年代架构。Scott Morton 于 2024 年年中创办 Revel，此前近十年为
              SpaceX Falcon 9 推进剂装载和早期 Starship 基础设施编写控制软件。Revel 提供全栈平台，整合仪器自动发现、实时浏览器遥测看板，以及
              RevelCode——一门为高后果环境设计、强调确定性运行安全的专用编译语言。Impulse Space、Radiant Nuclear 和 Astro Mechanica 等高速度硬科技运营商已率先采用，印证
              Revel 将测试吞吐量提升至 5x 至 10x 的价值主张，确实击中了迫切的运营瓶颈。


              反过来，公开投资反论点的核心是商业经济性和单位耐久性完全不透明。Revel 在成立十五个月内获得已披露的 $180M 风投资金，叙事势能和投资者需求都很强，但公司没有披露收入
              收入运行率、年度经常性收入（ARR）、毛利率、净收入留存率（NRR）、客户数量或客户群流失率。此外，国防和工业基础设施中的关键任务硬件部署天然伴随高部署摩擦、定制仪器集成负担和高企业支持要求，可能把软件毛利率拖向专业服务模式。在没有可验证证据区分高毛利、可规模化的经常性软件许可与高触达的前线部署工程项目之前，以溢价倍数评估普通股，会带来严重的估值压力。
            claimRefs:
