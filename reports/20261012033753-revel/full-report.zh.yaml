      - - 建议
        - 继续研究
        - 技术产品前景可观、一级投资人支持，但公开财务披露为零
        - 持续跟踪；未审阅私密财务资料室前，不配置主要资本
      - - 信心
        - 中
        - 第三方报道和公司公告相互印证了融资与标志性试点，但运营深度尚未验证
        - 在查阅经审计收入、合同期限和毛利率明细前，信心仍有上限
      - - 风险评级
        - 高
        - 未经验证的规模却对应高估值倍数、客户集中于早期硬科技企业，且工业销售周期复杂
        - 必须严格评估下行时的清算优先权层级和营运资金消耗
      - - 估值立场
        - 偏高
        - 据报道，$1B+ 投后估值建立在估算团队规模和商业成熟度之上，对应极端收入倍数
        - 坚持估值纪律；没有清晰的普通股等价经济条件，不参与老股或新股投资
    notes: 建议结论是在已验证的技术进展与公开财务信息完全不透明之间权衡；估值立场以据报道的 $1.0B+ B 轮估值为基准。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV013
      - CV014
  - id: TV002
    title: 正 / 反论点表
    columns:
      - 战略支柱
      - 核心正论点
      - 证据与验证
      - 反论点风险
      - 哪些变化会改变我们的判断
    rows:
      - - 控制层现代化
        - 硬件工程需要软件优先的自动化，才能跟上复杂自主物理系统的步伐
        - Impulse Space、Radiant Nuclear 和 Astro Mechanica 已采用；据称测试速度提升 5-10 倍
        - 既有工具（LabVIEW、自定义脚本）运营惯性深厚，工程师也已熟悉，替代阻力很大
        - 不是只在种子期初创企业中，而是要在一级航空航天和国防主承包商中快速替代传统 DAQ 软件
      - - 语言安全与可靠性
        - RevelCode 通过确定性编译执行消除运行时崩溃，让开发者能在任务关键环境中更快交付
        - SpaceX 创始团队曾编写 Falcon 9 和 Starship 控制软件；具备运行时安全架构
        - 专有语言会引发客户对锁定的抵触、增加招聘摩擦，并限制长期开发者生态
        - 开源语言被广泛采用，或各商业 DAQ 硬件供应商实现标准化 SDK 集成
      - - 企业平台扩张
        - 从台式研发测试台（RevelTest）扩展到全设施运营指挥控制（RevelC2），可放大 ACV
        - RevelC2 主打统一的全设施运营；同时向能源、国防和机器人等多行业推进
        - 运营指挥控制带来严峻的监管、安全和责任障碍，远超测试台环境
        - 在商业核能或国防场景中，关键基础设施成功实现持续在线的生产部署
      - - 估值与投资判断支撑
        - 高增长、定义品类的基础设施平台，在一级投资机构联合支持下享有溢价风投倍数
        - 累计融资 $180M；B 轮由 Index Ventures 领投，Redpoint、Thrive、Felicis 和 Dylan Field 参投
        - 隐含的 $1B+ 估值体现极端叙事定价，而 ARR、收入持续性和单位经济均未披露
        - 私下披露经审计 ARR >$30M、>75% 的经常性软件毛利率，以及清晰的 1x 非参与型优先股条款
    notes: 每一行都列出核心正论据、观察到的证据、关键下行制衡因素，以及改变投资立场所需的具体实证触发条件。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营与商业假设
      - 隐含 ARR 与利润率画像
      - 目标估值区间
      - 概率与下行触发条件
    rows:
      - - 乐观情景
        - RevelC2 被主要国防主承包商快速采用；成为自主硬科技的标准控制平台；服务占比低
        - ARR >$45M；软件毛利率 >75%；NRR >130%；客户数 >150 家企业
        - $1,800M – $2,500M（40x–55x 预期 ARR）
        - 20% 概率；国防主承包商公布设施合同且安全合规获认证时触发
      - - 基准情景
        - 在初创硬科技生态中稳健扩张；国防 / 航空航天研发选择性采用；专业服务支持带来中等拖累
        - ARR $12M–$20M；综合毛利率 60%–65%；NRR 110%–115%；客户数 40–70 个账户
        - $700M – $1,100M（45x–70x ARR 倍数）
        - 55% 概率；反映当前市场轨迹，并得到据报道的 B 轮估值印证
      - - 悲观情景
        - 企业采购周期延长；客户集中于高消耗初创企业；传统工具惯性限制 RevelC2 推广
        - ARR <$6M；大量定制工程使综合毛利率 <50%；资金紧张的硬科技客户流失率高
        - $250M – $450M（折价轮重组或战略性资本重组）
        - 25% 概率；初创硬科技融资放缓、主承包商采购停滞或测试台软件发生重大事故时触发
    notes: 估值区间是参考可比高增长基础设施软件倍数得出的方向性企业价值带，因为公司尚未披露实际财务数据。
    claimRefs:
      - CV004
      - CV007
      - CV009
      - CV011
      - CV013
      - CV014
