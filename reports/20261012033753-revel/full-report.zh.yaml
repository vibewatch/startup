            title: 硬件现代化中的软件瓶颈
            body: 航空航天和国防物理硬件系统的复杂度与自主性快速提升，但测试和控制软件工具仍冻结在 1980 年代范式中，造成高后果运营瓶颈。
            calloutType: insight
            claimRefs:
