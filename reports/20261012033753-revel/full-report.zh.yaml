              - CV015
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 坚持严格的入场估值纪律
            body: >-
              在直接核实财务指标前，不要按报道的 $1.0B+ Series B 投后估值或更高估值评估 Revel。创始人履历和早期硬科技试点采用都很突出，但公开证据无法证明 Revel 究竟是可规模化、毛利率 80%+
              的软件企业，还是前线部署工程服务模式。以溢价且未经核实的倍数入场，会让普通投资人暴露于严重资本悬置和下轮重组风险。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV013
              - CV014
          - type: callout
            title: 早期硬科技生态中的客户集中度
            body: >-
              Revel 展示的重点客户——包括 Impulse Space、Radiant Nuclear 和 Astro
              Mechanica——都是风投支持的硬科技初创企业，本身就具有较高资本强度和外部融资风险。如果宏观环境收紧、深科技硬件项目的风投资金受限，除非 Revel
              快速拓展到根基深厚的航空航天国防主承包商和盈利型工业集团，否则将面临更高客户流失或扩张预算被压缩的风险。
            calloutType: risk
            claimRefs:
