      - number: '8.2'
        title: 建议、融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              我们的正式尽调建议是继续研究，信心中等、风险高，估值立场偏贵。Revel 于 2025 年 4 月结束隐身状态，已在 Felicis Ventures、Abstract Ventures 和 Thrive
              Capital 领投的 Seed 与 Series A 轮中融资 $30M。2026 年 2 月，公司宣布由 Index Ventures 领投的 $150M Series B，Redpoint
              Ventures、现有机构投资者及 Dylan Field 等知名天使投资人也大额参与。第三方市场报道普遍称，该 Series B 使公司以超过 $1.0B 的投后估值（具体约
              $1.005B）达到独角兽地位。但公司官方公告只确认 $150M 轮次规模和投资人联合体，未披露投后估值、普通股稀释比例及清算优先权结构。


              入场纪律要求机构资金不要仅凭投资人声望或硬科技势能，追逐未经核实的私募估值。2026 年初 Revel 的工程团队约有 18 人，按约 $1.0B 的投后估值计算，人均隐含估值超过
              $55M，说明这一轮几乎完全按长期终局期权价值定价，而不是按当前商业规模定价。在无法私下查阅已签署的条款清单、股权结构表和收入明细前，以或接近报道的 Series B
              估值入场，会让普通股股东暴露于下行清算优先权、优先回报门槛，以及公开企业软件倍数收缩后的未来倍数压缩风险。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
