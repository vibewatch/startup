          label: 平台潜力
          detail: 工业软件领域具备定义品类的切入点，也有很大的战略收购选择空间。
          type: intermediate
        - id: n6
          label: 投资判断的不对称性
          detail: 可能存在惩罚性清算优先权带来的压力、客户集中度过高，或下轮融资估值倍数收缩的风险。
          type: intermediate
        - id: n7
          label: 最终建议：继续研究
          detail: 继续保持审慎跟踪；在投入资本前，要求通过私有数据室尽调确认 ARR、利润率和条款清单机制。
          type: output
