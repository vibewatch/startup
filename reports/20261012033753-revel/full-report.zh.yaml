              Revel 的创始人与市场匹配度很高，根基是 Scott Morton 在严格飞行关键约束下直接管理推进剂测试软件的经历。工程团队大量来自 SpaceX、Anduril Industries 和 Palantir
              Technologies 等一线硬科技公司，专注高可靠运行时系统、低延迟遥测流和自动化仪器集成。Revel 于 2026 年 2 月完成 $150M Series B 融资后，Index Ventures 合伙人
