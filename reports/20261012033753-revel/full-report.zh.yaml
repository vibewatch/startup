      - number: '3.4'
        title: 护城河持久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Revel 已在 Impulse Space、Aalo Atomics 和 Orbital Operations
              等高速成长、风险投资支持的初创公司中快速获得商业采用，但要在老牌一线航空航天主承包商中替换现有厂商，仍存在强大的结构性摩擦。数十年的机构测试数据、定制测试架和认证资格流程，都深深绑定在 NI
