            body: 公司和媒体报道强调试点转化率为 100%，但关于净收入留存率（NRR）、流失率和年度合同价值的公开披露完全缺失，使长期客户经济性存在尽调不确定性。
            calloutType: risk
            claimRefs:
              - CU004
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险拓扑、严重性排序与暴露框架
        blocks:
          - type: paragraph
            body: >-
              Revel 作为关键任务物理硬件的软件定义指挥与控制平台，其风险画像与传统企业 SaaS 根本不同。由于软件直接控制测试台、DAQ
              硬件和工业自动化设备，软件缺陷可能演变为物理灾难，包括火箭发动机测试台爆炸、核反应堆控制故障和设施灾难性损失。公司的风险拓扑覆盖五个核心维度：运营和硬件动作风险、监管与 ITAR
              合规责任、早期客户集中于前沿风险投资硬件初创公司、硬件依赖与仪器锁定，以及 $150M Series B
              后的资产负债表不透明。降低这些风险，需要代码执行严格确定性、稳健的隔离网络本地架构和有纪律的客户认证。Revel
              虽已在领先航空航天创新者中取得快速商业势头，但在公司实现更广泛的企业多元化，并在航空航天以外工业垂直领域获得独立审计的可靠性认证前，剩余暴露仍处于高位。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR009
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
