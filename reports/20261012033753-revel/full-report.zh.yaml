    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与运营架构
        blocks:
          - type: paragraph
            body: >-
              Revel（revel.io）是一家总部位于加利福尼亚州洛杉矶的工业软件公司，开发面向高后果物理系统的现代控制、测试与指挥平台。公司于 2024 年年中由 CEO Scott Morton 创立；此前他在
              SpaceX 工作九年半，为 Falcon 9 推进剂装载和 Starship 测试台编写并维护关键任务控制软件。Revel
              解决航空航天、先进国防、机器人和能源基础设施中的长期结构性瓶颈：物理硬件系统正走向自主运行，但运营软件环境往往仍依赖数十年前、甚至早于 Windows 98 的旧工具，如 National Instruments
              LabVIEW、专有厂商技术栈或脆弱的定制脚本。Revel 提供统一平台，包括用于快速台架测试配置和自动设备发现的 RevelTest、用于全设施指挥与控制的
              RevelC2，以及为确定性执行而设计、不会发生运行时崩溃的专有编译型语言
              RevelCode。公司服务受监管的国防和航空航天行业，并遵守严格出口管制标准，对技术和产品人员执行美国《国际武器贸易条例》（ITAR）资格要求。
