      - number: '2.3'
        title: 买方分层、预算归属与采用经济性
        blocks:
          - type: paragraph
            body: >-
              航空航天和国防硬件组织的采购机制，呈现出不同的经济买方、日常运营者和预算分配模式。主要经济买方通常是硬件工程副总裁、推进负责人或测试运营总监，他们负责项目交付进度，也承担测试活动延误的财务后果。相反，日常用户是测试工程师、仪器技术员和系统集成负责人；过去，他们要花数周手工连接
              DAQ 通道、调试通信协议并盯守测试控制台。初期设施建设通常从资本性支出（CapEx）测试台预算中拨款，随着平台扩展为多测试台连续运营，再转为经常性运营支出（OpEx）软件订阅。Impulse
              Space、Radiant Nuclear 和 Astro Mechanica 等早期采用者表明，首要采用触发点是压缩测试周转时间。与旧工具相比，Revel
              可将测试频率提升五至十倍，直接匹配下一代硬件项目所要求的快速开发速度。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM010
              - CM013
      - number: '2.4'
        title: 结构性驱动、监管约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              推动软件定义控制的长期顺风，是物理工程走向自主化和高频化；在这里，安全与可靠性没有讨价还价的余地。传统脚本测试台无法提供实时可观测性，也无法对系统锁死给出数学保证。Revel 通过 RevelCode
              的确定性编译期检查回应这一驱动，确保控制逻辑在实时运行中不会崩溃。然而，企业渗透仍受多重约束。国防科技和太空系统必须遵守《国际武器贸易条例》（ITAR）及《出口管理条例》（EAR），严格限制访问权限，只允许获授权的美国人操作。除此之外，关键任务设施运营商在把软件接入高压流体回路或核控制棒之前，要求本地部署、完全隔离网络、基于角色的访问控制和加密存储。早期初创客户牵引力已经得到证明，但
              Revel 的私营财务表现仍存在关键尽调缺口，包括 ARR、毛利率、净收入留存率以及商业客户与国防客户之间的客户集中度。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
