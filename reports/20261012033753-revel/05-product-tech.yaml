callouts:
  - calloutType: insight
    title: "Deterministic Safety via Domain-Specific Language Design"
    body: "Revel’s decision to build RevelCode as a compiled domain-specific language represents a deliberate architectural tradeoff. By enforcing compile-time validation for physical state machines and timing constraints, Revel eliminates the common failure mode of unhandled runtime exceptions causing physical hardware damage, offering a modern alternative to legacy graphical environments like LabVIEW."
    claimRefs:
      - CE002
      - CE008
  - calloutType: risk
    title: "Hardware Driver Dependencies and Remote Control Surface Exposure"
    body: "While Revel provides modern browser-accessible control and unified DAQ abstraction, its operational reliability remains fundamentally coupled to third-party instrumentation drivers and network boundary security. In mission-critical defense and nuclear installations, exposing actuator controls over IP networks necessitates stringent air-gapped isolation and cryptographic Commander authorization."
    claimRefs:
      - CE007
      - CE011
      - CE012
