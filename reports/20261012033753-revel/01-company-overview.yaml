    title: "High Valuation Multiple vs. Unverified Commercial Operating Scale"
    body: "Third-party trackers price Revel at $1,005M post-money following its $150M Series B, representing an aggressive multiple on early-stage commercial traction. With verified deployments primarily spanning specialized startups (Impulse Space, Radiant Nuclear, Aalo Atomics) and zero disclosed GAAP revenue, gross margin, or ARR figures, institutional investors bear significant valuation risk pending audited financial disclosure."
    claimRefs:
      - "CO008"
      - "CO012"
      - "CO014"
  - calloutType: "insight"
    title: "Strategic Transition from Test Stand Wedge to Facility-Wide Operational Control"
    body: "Revel's commercial wedge began in aerospace test stands where rapid cycle times demonstrated immediate ROI (cutting setup from 14 days to 8 hours). The company's release of RevelC2 and expansion into nuclear reactors (Aalo Atomics) and power infrastructure represent an ambitious expansion from temporary test bench automation into permanent operational control planes."
    claimRefs:
