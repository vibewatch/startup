chapter:
  number: 1
  title: "Company Overview"
  summary: "Revel is a Los Angeles-based developer of software-defined control and test infrastructure for complex physical hardware across aerospace, energy, defense, and industrial automation. Founded by former SpaceX propulsion software engineer Scott Morton, the company emerged from stealth in 2025 and announced a $150M Series B led by Index Ventures in February 2026 at a reported $1B+ valuation, while keeping commercial scale and operating financial metrics strictly private."
sections:
  - id: "identity-and-mission"
    title: "Corporate Identity, Product Scope, and Operational Architecture"
    body: "Revel (revel.io) is an industrial software company headquartered in Los Angeles, California, developing a modern control, test, and command platform tailored for high-consequence physical systems. The enterprise was founded in mid-2024 by Chief Executive Officer Scott Morton, following his nine and a half years at SpaceX where he wrote and maintained mission-critical control software for Falcon 9 propellant loading and Starship test stands. Revel addresses a persistent structural bottleneck across aerospace, advanced defense, robotics, and energy infrastructure: while physical hardware systems have advanced toward autonomous operation, their operational software environments often rely on decades-old, pre-Windows 98 legacy tooling such as National Instruments LabVIEW, proprietary vendor stacks, or fragile custom scripts. Revel provides a unified platform comprising RevelTest for rapid benchtop test configuration and automated device discovery, RevelC2 for facility-wide command and control, and RevelCode, a proprietary compiled language engineered for deterministic execution without runtime crashes. Operating in regulated defense and aerospace sectors, Revel adheres to strict export-control standards, enforcing U.S. International Traffic in Arms Regulations (ITAR) eligibility requirements across its technical and product personnel."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Engineering Talent, and Governance Structure"
    body: "Revel exhibits high founder-market fit anchored in Scott Morton's direct operational tenure managing propulsion test software under strict flight-critical constraints. The engineering organization draws heavily from tier-one hard-tech operators including SpaceX, Anduril Industries, and Palantir Technologies, maintaining specialized focus on high-reliability runtime systems, low-latency telemetry streaming, and automated instrumentation integration. Following Revel's $150M Series B financing in February 2026, Nina Achadjian, Partner at Index Ventures, formally joined Revel's Board of Directors. However, formal corporate disclosures regarding independent board directorships, an established audit committee, dedicated chief financial officer appointment, and finance leadership depth remain entirely undisclosed to public investors. Revel operates with significant key-person dependence centered on Morton's domain authority, product vision, and technical architecture. The company maintains tight feedback loops between platform engineering and forward-deployed test operators embedded with high-velocity hardware teams."
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization History, Investor Syndicate, and Valuation Dynamics"
    body: "Revel raised cumulative disclosed venture capital of approximately $180M across two reported institutional financings between 2025 and early 2026. The company emerged from stealth in April 2025 with $30M in combined Seed and Series A financing backed by Thrive Capital, Felicis, and Abstract Ventures. In February 2026, Revel closed a $150M Series B financing led by Index Ventures, with major participation from Redpoint Ventures, returning institutional investors, and notable angel investors including Dylan Field. Third-party venture reporting and industry trackers subsequently assigned Revel unicorn status with a post-money valuation exceeding $1.0B (estimated at $1,005M in secondary trackers). Despite broad venture recognition, Revel has disclosed neither verified GAAP revenue, annual recurring revenue (ARR), gross margin percentages, cash burn rates, nor balance sheet cash reserves, and public reporting contains minor discrepancies regarding round size. Furthermore, market confusion arises from namesake legacy point-of-sale vendor Revel Systems, which operates in commercial POS and retail software under unrelated ownership and capitalization."
    claimRefs:
      - "CO008"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
