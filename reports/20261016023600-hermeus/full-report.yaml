      - number: '1.3'
        title: Capital base, government anchors, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Hermeus is no longer financed like an early seed-stage hardware startup, but the public funding record is
              still mostly conveyed through company- friendly or secondary-market surfaces rather than filings. The
              strongest current external report says Hermeus closed a $350 million Series C in mid-2026, took total
              capital raised to $500 million, crossed a $1 billion valuation, and layered in $150 million of debt. Older
              public materials pointed to a much smaller funding base in 2022, which is directionally consistent with
              later growth but still leaves the current cap table, preference stack, and debt terms opaque. Government
              relationships with the Air Force and DIU matter as much as venture backers because they are the clearest
              public demand signals in the current record.
