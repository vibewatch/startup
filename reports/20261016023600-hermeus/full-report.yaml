      highLabel: High-Mach or hypersonic mission fit
      description: Ordinal 1-5 score based only on the assigned prefetched evidence.
    yAxis:
      label: Operational and acquisition readiness
      min: 1
      max: 5
      lowLabel: Experimental or concept-heavy
      highLabel: Fielded or funded with clearer buyer path
      description: Ordinal 1-5 score based only on the assigned prefetched evidence.
    data:
      points:
        - label: Hermeus
          x: 4.5
          'y': 3
          note: Supersonic flight achieved and DIU ceiling expanded to $219M, but no public program of record.
        - label: RQ-4 / MQ-9 substitute class
          x: 1.5
          'y': 5
