      - number: '4.2'
        title: Cost structure looks hardware-heavy and margin-sensitive
        blocks:
          - type: paragraph
            body: >-
              Hermeus is pursuing a capital-intensive model in which aircraft, propulsion, flight test, and
              manufacturing capability are all built in parallel. The company and partner ecosystem have highlighted
              vertical integration, additive manufacturing, engine work, and multiple testing sites, all of which
              support speed but imply a cost base much closer to aerospace development than asset-light software.
              Independent reporting also shows the company using rapid iteration and prototype turnover as a core
              operating method, which is strategically valuable but raises the burden on utilization, procurement, and
              test access. Because no public gross margin, contribution margin, or cash conversion data are disclosed,
              investors can observe the cost drivers and operating ambition but cannot yet underwrite whether flight
              milestones translate into attractive unit economics.
            claimRefs:
              - CI002
              - CI009
