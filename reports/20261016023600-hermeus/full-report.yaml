      - number: '4.3'
        title: Fresh capital reduces immediate pressure, but financing dependency remains high
        blocks:
          - type: paragraph
            body: >-
              The April 2026 financing materially improved Hermeus's balance-sheet position, yet it did not remove
              financing risk. Independent sources describe a $350 million Series C at a $1 billion valuation and specify
              that $150 million of the round was debt, which means runway is being extended partly with an instrument
              that will need servicing or refinancing rather than solely with permanent equity. That matters because
              Hermeus still needs to clear difficult schedule gates: more Quarterhorse flights, high-Mach
              payload-release demonstrations, Pratt-standard engine qualification, and eventually a transition from
              prototype evidence to an enduring defense procurement path. The business has proof of execution, but the
              next round trigger still appears tied to milestone conversion rather than already visible operating cash
              flow.
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Hermeus looks like a high-potential but still hard-to-underwrite defense hardware company.
              The company has stronger external financing and customer-intent signals than many venture-backed aerospace
              peers, and the public record does support a real near-term defense revenue path. However, the decisive
              underwriting metrics remain private: recognized revenue, milestone payment timing, gross margin, burn,
              unrestricted cash, runway, and any covenant burden tied to debt. That means the current evidence is
              sufficient to say the revenue model is plausible and capital needs are meaningful, but not sufficient to
              say the company has crossed from technical progress into de-risked financial compounding. The correct
              stance is to diligence around cash conversion and financing triggers rather than extrapolate product
              milestones into mature economics.
            claimRefs:
              - CI008
              - CI010
              - CI012
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting blocker
            body: >-
              The main blocker is not lack of technical proof; it is lack of public accounting data. Investors can see
              contracts, funding, and milestone progress, but not recognized revenue, gross margin, burn, or
              unrestricted cash.
            calloutType: risk
            claimRefs:
              - CI004
              - CI008
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Quarterhorse is the real product surface; Darkhorse and Halcyon are still roadmap vehicles
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows Hermeus delivering a staged aircraft roadmap rather than a finished operational
              fleet. The current proof point is the Quarterhorse series: Breaking Defense described Quarterhorse as the
              active test program, Aero-mag reported that Mk 2.1 completed a supersonic flight, and the company now says
              Mk 2.2 and Mk 2.3 are next in line. Darkhorse is consistently described as the intended reusable Mach 5+
              military platform, while Halcyon remains the commercial airliner concept. That means customer workflow
              evidence today is strongest for defense experimentation and technology maturation, not for production
              deployment, recurring service delivery, or commercial route operations.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: The architecture is propulsion-led and vertically integrated around test iteration
        blocks:
          - type: paragraph
            body: >-
              The best-documented technical architecture is propulsion plus fast hardware iteration. Breaking Defense
              reported that Chimera II uses a Pratt & Whitney F100 core with a ramjet afterburner, a precooler, and an
              in-house bypass system, while Power Systems Design reported that Hermeus acquired Velo3D Sapphire printers
              calibrated for Inconel 718 to manufacture Quarterhorse and Chimera parts. Taken together, the public stack
              suggests Hermeus is trying to shorten the design-build-test loop by controlling key propulsion
              modifications and selected manufacturing steps internally. That is a real differentiator if it works, but
              it also concentrates execution risk into engine integration, additive-part quality, and supply chain
              scaling.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
