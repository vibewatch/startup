  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Defense test capacity is the evidenced wedge
        blocks:
          - type: paragraph
            body: >-
              The retained pool does not support a generic "hypersonics market" narrative. Instead, it supports a
              tighter boundary around high-speed defense testing, reusable unmanned military aircraft, and adjacent
              government mobility use cases. Defense News says the latest financing is meant to move Hermeus from
              prototype testing into development and production of mission-ready platforms, while Breaking Defense says
              the company ultimately wants two mass-produced aircraft lines: Darkhorse for defense and Halcyon for
              commercial passenger service. That makes the included spend defense flight-test capacity, military
              unmanned aircraft, and related propulsion/manufacturing capability, while excluded spend includes
              missiles, broad civil aviation demand, and generic subsonic UAV programs. The commercial passenger
              adjacency matters for long-term upside, but today the evidence base is far stronger for national-security
              demand than for airline procurement.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM014
      - number: '2.2'
        title: Buyers are program offices first, operators later
        blocks:
          - type: paragraph
            body: >-
              The near-term buyer path runs through government program offices rather than an established operating
              fleet budget. Air & Space Forces reports that the Air Force sees hypersonic aircraft potential in
              executive airlift, mobility, and intelligence, surveillance, and reconnaissance missions, and The Merge
              says DIU expanded Hermeus's contract ceiling to $219 million through 2027 with in-flight payload release
              called out explicitly. Those facts imply a chain in which R&D and experimentation budgets fund test
              capacity first, acquisition budgets would need to fund a later operational drone program, and end users
              would only become direct demand signals after payload, cadence, and mission concepts are proven.
              Commercial airlines and passengers remain conceptual stakeholders because the retained sources do not
              disclose routes, pricing, certification, or launch customers.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
              - CM016
      - number: '2.3'
        title: Public sizing is limited to program and throughput proxies
        blocks:
          - type: paragraph
            body: >-
              No retained source publishes a defensible TAM, SAM, or SOM for Hermeus, so the sizing work has to stay
              constrained to public demand and capacity proxies. Those proxies include DIU's $219 million ceiling
              through 2027, earlier Air Force and AFWERX awards, Hermeus's own financing scale, and management's stated
              production throughput at the current plant. Together they show that public money is already flowing into
              high-speed test capacity and that Hermeus has raised enough capital to build supply, but they do not prove
              how large the eventual procurement market will be for Darkhorse or whether Halcyon can clear commercial
              certification and airline economics. The right reading is that there is real budget-backed demand for
              experimentation, but disclosed evidence does not yet isolate a durable operating-market size.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM013
