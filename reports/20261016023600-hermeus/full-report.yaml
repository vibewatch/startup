      - number: '5.4'
        title: Safety and quality are framed through flight-test learning, with governance gaps still public
        blocks:
          - type: paragraph
            body: >-
              Hermeus does present a control philosophy, but it is mostly an engineering process story instead of a
              disclosed assurance framework. Breaking Defense described subsystem, ground-station, operations, and
              human-factors testing on the Mk 1 path, while the DIU expansion is positioned as a way to gather validated
              data and reduce service adoption risk. That is useful evidence that the company is not skipping test
              discipline. At the same time, the assigned prefetched pool does not surface formal public disclosures on
              software assurance, cybersecurity, export-control process, safety case governance, or production quality
              metrics for the future operational system. Those omissions matter because Hermeus is selling a defense
              aircraft vision, not just a lab demonstrator.
            claimRefs:
              - CE004
              - CE007
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Real milestone velocity
            body: >-
              Hermeus moved from earlier Quarterhorse prototypes to a reported Mach 1.21 supersonic flight and then into
              a larger DIU-backed 2026-2027 payload release campaign, which is stronger proof of technical momentum than
              a slide-only hypersonic roadmap.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE004
          - type: callout
            title: Operational proof is still ahead
            body: >-
              The current program is funded and technically specific, but payload release, sustained higher-Mach
              performance, and translation into a procureable production platform remain future milestones rather than
              completed operating proof.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Vertical integration is a differentiator and a bottleneck
            body: >-
              Hermeus' use of F100-based propulsion modifications plus additive manufacturing can speed iteration, yet
              it also makes engine integration, materials quality, and throughput central diligence items.
            calloutType: insight
            claimRefs:
              - CE008
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Public customer proof is government-centered
        blocks:
          - type: paragraph
            body: >-
              The public record supports a narrow but concrete customer base. Hermeus is clearly selling into a U.S.
              defense demand chain in which the Air Force, DIU, and now the Navy fund or shape flight-test work, while
              commercial aviation remains a roadmap narrative rather than a signed customer set. That matters because
              the company does not yet need broad market adoption to prove relevance; it needs a small number of defense
              stakeholders to keep expanding test and transition budgets. The segmentation therefore looks less like a
              classic diversified customer funnel and more like a sponsor-led progression from study work to
              experimentation to possible procurement.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU007
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU008
              - CU011
              - CU014
      - number: '6.2'
        title: Adoption proof is milestone-driven, not fleet-driven
        blocks:
          - type: paragraph
            body: >-
              The adoption evidence that is visible publicly is operational momentum around prototype flights and
              contract growth, not recurring deployment statistics. Hermeus can point to the DIU ceiling increase, the
              Mach 1.21 Quarterhorse milestone, and FAA-approved supersonic sorties as proof that customers are still
              leaning in. But those signals should be read as validation demand from government sponsors, not as
              evidence of scaled fielding. Even the strongest named-customer records still emphasize payload-release
              demonstrations, risk reduction, and future acquisition decisions, which keeps the customer story in the
              experimentation phase.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU008
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU014
      - number: '6.3'
        title: Durability and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The main diligence weakness is not whether any customer exists, but whether the current customer base is
              durable and scalable. Public sources do not disclose NRR, GRR, churn, renewal timing, backlog conversion,
              or top-customer exposure, so it is impossible to tell how dependent Hermeus is on one or two defense
              programs. Independent commentary also suggests that scale-up still hinges on a government demand signal
              and a program-of-record transition that has not yet been won. Until those disclosures improve, commercial
              expansion and broad customer diversification should be treated as aspirational rather than evidenced. That
              keeps customer concentration, renewal quality, and account expansion as live diligence risks rather than
              closed underwriting questions.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof exists, but it is sponsor-led
            body: >-
              Hermeus is not a zero-customer story: the Air Force, DIU, and now the Navy are clearly engaged. The
              limitation is that those relationships are still best described as funded test and transition programs
              rather than recurring production deployment.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
          - type: callout
            title: Durability is still opaque
            body: >-
              Without disclosed renewal, backlog, or concentration metrics, it is hard to tell whether Hermeus is
              building a durable customer franchise or a narrow set of milestone-driven defense programs whose
              continuation depends on future procurement wins.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The core Hermeus risk is not whether the company can keep attracting attention; it is whether the current
              capital and flight-test window is long enough to convert prototype momentum into a validated high-Mach
              product path. Hermeus has fresh financing, a larger DIU ceiling, and multiple successful prototype
              flights, but the evidence still points to four severe residual exposures: proving the turbojet-to-ramjet /
              payload-release path on schedule, converting DIU demonstrations into a real acquisition path, scaling
              manufacturing beyond experimental cadence, and managing capital intensity after adding debt to the 2026
              raise. The strongest mitigations are iterative prototype development, a government-funded test campaign,
              and new facilities, but those mitigations reduce early engineering uncertainty more than they reduce
              customer concentration or program-transition risk.
            claimRefs:
              - CR004
              - CR009
              - CR011
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory and acquisition path
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows that the regulatory path is active but only partially disclosed. Third-party
              coverage and newsletter reporting point to prototype airworthiness and FAA flight authorization, while the
              DIU announcement sets a 2026-2027 demonstration window for high-Mach flight and payload release. What the
              pool does not provide is the harder closing evidence an investor would want: the exact
              flight-authorization scope, renewal conditions, export-control stack, or a named follow-on program of
              record. That makes the legal / regulatory risk less about a known enforcement event and more about
              approval opacity and dependency on government transition decisions that sit outside Hermeus's direct
              control.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
              - CR013
      - number: '7.3'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The operational risk register is dominated by execution at the edge of the flight envelope and by external
              dependencies that could slow learning. Independent sources still describe the turbojet-to-ramjet
              transition, thermal management, and sustained high-speed operation as the hardest technical hurdles, and
              the current evidence base only shows progress toward those milestones rather than closure. Separately,
              Breaking Defense's manufacturing-capacity comment, Sacra's capital-intensity warning, and The Merge's
              range-access concern all imply that Hermeus can keep moving quickly only if suppliers, facilities, and
              external test infrastructure stay in sync. Because the same U.S. defense ecosystem funds, tests, and
              potentially buys the product, operational slippage and customer concentration amplify each other.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Kill criteria and diligence
        blocks:
          - type: paragraph
            body: >-
              The monitorable thesis-break is straightforward: if Hermeus cannot turn the funded 2026-2027 campaign into
              repeatable supersonic / high-Mach payload-release evidence and a visible sponsor path to procurement, the
              current financing round starts to look like bridge capital for experimentation rather than scale capital
              for a durable program. The next diligence pass should therefore prioritize items the public record still
              leaves blank: milestone-linked DIU payments, debt covenants and liquidity headroom, range-booking
              resilience, qualified supplier depth around engines and thermal hardware, and the exact FAA /
              export-control approvals needed for the next campaign stages. If those items are strong, the technical
              risk is still high but financeable; if they are weak, the acquisition and capital risks quickly become
              thesis-breaking.
            claimRefs:
              - CR004
              - CR009
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              The cleanest kill criterion is a schedule slip in supersonic / high-Mach payload-release proof without
              parallel evidence of a funded program transition, because that would turn debt-backed scale capital into
              financing for an open-ended experiment.
            calloutType: risk
            claimRefs:
              - CR004
              - CR013
              - CR016
          - type: callout
            title: What the mitigations really solve
            body: >-
              Hermeus's prototype cadence, HEAT facility, and government-backed test campaign are real mitigants for
              early engineering risk, but they do much less to solve customer concentration, acquisition sponsorship, or
              long-duration capital intensity.
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, high risk, and a stretched valuation stance.
              Hermeus announced $350 million of Series C financing, and several third-party pages report a $1 billion
              post-money valuation. That validates access to capital, not the attractiveness of common equity at the
              same price. UpMarket reports that only $200 million was equity and $150 million was debt; on a simple,
              preference-free calculation, the equity component implies an $800 million pre-money value and 20% primary
              dilution. Actual dilution and common-equity value can differ because the option pool, liquidation
              preferences, debt seniority, warrants, and conversion terms are not disclosed. Entry should therefore be
              conditioned on data-room terms and milestone proof rather than the headline round size.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and milestone conversion
        blocks:
          - type: paragraph
            body: >-
              The thesis is that fresh capital funds a concrete hardware plan: Hermeus says it will advance Quarterhorse
              Mk 2.2 toward supersonic flight, build Mk 2.3 for Mach 3, expand prototyping in El Segundo, and prepare
              Atlanta for production. A supplier-issued account also documents purchases of two Velo3D printers for
              vertically integrated engine and aircraft parts. The anti-thesis is that prototype cadence has not yet
              established scalable program economics. Breaking Defense reported in 2024 that the Pentagon had not
              publicly identified a hypersonic-aircraft program of record, described an earlier flight target that had
              been reframed, and quoted a Defense Department official on unresolved materials and structures work.
              Funding extends the learning runway, but it does not itself prove procurement conversion, production
              yield, or an investable margin profile.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.3'
        title: Scenarios, comparables, and valuation boundaries
        blocks:
          - type: paragraph
            body: >-
              Scenario values should be treated as entry-discipline bands, not estimates of intrinsic value. The $800
              million lower anchor is only the simple pre-money arithmetic implied by UpMarket's reported $200 million
              equity component and $1 billion post-money valuation. Multiples reports $1 billion marks for both the
              March 2022 Series B and April 2026 Series C, which offers no headline step-up in that database despite
              additional capital and execution. Its selected aerospace and defense comparables span roughly 4.3x to
              51.5x last-fiscal- year EV/revenue, but the set mixes unlike public and private businesses and does not
              provide Hermeus revenue. UpMarket's $1.18 billion model estimate is likewise not a transaction price and
              is explicitly qualified as potentially different from actual trades. A premium is unsupported until
              operating metrics and procurement conversion are visible.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              No target return or fixed hold period is supportable from the assigned evidence. UpMarket describes
              pre-IPO shares as illiquid and speculative, says exits are unpredictable, and advises planning for a
              multi-year hold. EquityZen describes IPO, acquisition, or an eligible secondary sale as possible
              mechanics, but its listing is an access channel rather than evidence of current liquidity or a clearing
              price. A 2025 third-party overview also reported that Hermeus had not announced an IPO timetable at that
              point. Before investment, diligence should obtain monthly financials, funded backlog, milestone-payment
              schedules, the complete cap table, debt documents, preference terms, and recent secondary indications.
              Thesis-break triggers are a missed supersonic or Mach 3 milestone, failure to convert testing into funded
              follow-on demand, a senior-claim-heavy financing structure, or cash needs that force a flat or down round.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more'
            body: >-
              Do not underwrite a premium to the $1 billion round mark from public evidence alone. Revisit the call only
              after capital-stack terms, operating metrics, and funded program conversion are verified, or after entry
              price falls enough to compensate for those unresolved risks.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV011
              - CV016
