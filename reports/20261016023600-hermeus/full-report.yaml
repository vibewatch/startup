  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The map shows Hermeus between fielded substitutes and more experimental high-speed peers: higher speed-fit than
      incumbents, but lower procurement maturity than systems already in use.
    xAxis:
      label: Speed and high-Mach mission fit
      min: 1
      max: 5
