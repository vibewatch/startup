      - number: '1.2'
        title: Leadership, founders, and governance dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity is one of the clearer company-overview facts. Hermeus was founded in 2018 by AJ
              Piplica, Glenn Case, Skyler Shuford, and Michael Smayda, and the current public leadership page shows a
              more scaled executive bench spanning finance, legal, business development, people, and engineering. The
              most material change is the June 2026 CEO transition: Zach Shore moved into the top operating role after
              earlier growth and government-facing roles, while Piplica shifted to Executive Chairman and remained
              visibly tied to capital strategy and board leadership. That broadens operating leadership, but it does not
              remove founder influence from the company narrative or financing story.
