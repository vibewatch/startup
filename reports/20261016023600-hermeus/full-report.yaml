  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape spans direct peers, adjacent entrants, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool points to a fragmented competitive set rather than a single head-to-head market.
              Direct high-speed peers include startups such as Venus Aerospace and Destinus that target similar speed
              bands, while broader commercial high-speed peers include Boom Supersonic and the older Aerion, Exosonic,
              and Spike Aerospace set. Adjacent entrants matter because buyers can solve pieces of the same mission
              without waiting for Hermeus to complete the full Darkhorse path: Breaking Defense places Hermeus beside
              Anduril's high-subsonic platform and Stratolaunch's recoverable hypersonic vehicle, while Air & Space
              Forces shows DIU's HyCAT ecosystem already includes Rocket Lab and Hypersonix as another high-speed
              testbed route. The most credible substitutes are still fielded subsonic systems and existing Pentagon
              strike and test programs, because they are available today even if they do not close the same speed gap.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
