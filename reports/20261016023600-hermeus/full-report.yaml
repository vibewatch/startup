      - number: '3.2'
        title: Hermeus differentiates on airframe and propulsion, not on every layer of the stack
        blocks:
          - type: paragraph
            body: >-
              Hermeus's strongest differentiation in the assigned evidence is its combination of runway-launched
              operations, reusable high-Mach ambition, and a turbine-based path rather than pure rocket or hydrogen
              architectures. That is reinforced by the company's 2026 capital raise and expanded DIU ceiling, both aimed
              at moving from prototype flights toward payload-carrying military use cases. But the same evidence also
              narrows the moat: Hermeus explicitly does not want to own the autonomy layer, and partner-issued
              manufacturing material emphasizes vertical integration and reduced supplier dependence rather than a
              closed ecosystem. For buyers, that means the airframe can be attractive even while software, payload, and
              some mission-system value accrues elsewhere.
            claimRefs:
