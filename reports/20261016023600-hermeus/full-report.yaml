              - CP008
              - CP010
      - number: '3.3'
        title: Durability still depends on procurement conversion, capacity, and execution
        blocks:
          - type: paragraph
            body: >-
              The most important competitive risk is not that another startup has already won the category, but that
              buyers can stay with substitutes or adjacent programs until Hermeus proves more of the path to production.
              The official DIU expansion still frames the 2026-2027 campaign as data for future acquisition decisions,
              and independent reporting says the Defense Department has not publicly revealed a program of record for a
              hypersonic aircraft. Breaking Defense also reports that reusable hypersonic materials and structures
              remain unresolved science and technology work, while Hermeus's own near-term manufacturing signal is only
              "a dozen or so" Mk 2 drones per year from its current facility if demand materializes. That combination
              makes switching costs real around test infrastructure and learning, but not yet decisive enough to stop
              displacement by incumbents, adjacent autonomy vendors, or better-funded peer programs.
            claimRefs:
              - CP005
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Runway-reusable high-Mach positioning is the real product distinction
            body: >-
              The strongest evidence-backed separation is not "hypersonics" in the abstract; it is Hermeus's attempt to
              pair high-Mach performance with runway operations, payload-release testing, and a turbine-based path that
              looks closer to an aircraft program than to a single expendable test shot.
            calloutType: strength
            claimRefs:
              - CP004
              - CP009
              - CP011
          - type: callout
            title: The buyer can still unbundle the stack and delay commitment
            body: >-
              Because autonomy is separable, substitutes are already in service, and public procurement has not crossed
              into a visible program of record, Hermeus still has to prove that its airframe is important enough for the
              Pentagon to commit before adjacent entrants or incumbents absorb the budget.
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visible, but realized revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              The public record shows a revenue architecture built around defense-funded development rather than
              disclosed repeatable product sales. Independent and company sources point to near-term monetization
              through government contracts and flight-test activity, with the enlarged DIU ceiling as the clearest
              public demand anchor. Additional monetization paths exist, but they remain earlier and less concrete:
              Pratt-licensed F100 manufacturing still lacks a disclosed production rate, while Ramjet-X is positioned as
              a future high-Mach flight-test service with testing planned for 2027 rather than a live priced offer. That
              leaves investors with a credible pathway to revenue, but not a clean read on recognition policy,
              concentration, or durability. Public traction is therefore technical and contractual, not
              accounting-based.
            claimRefs:
              - CI001
              - CI003
              - CI006
