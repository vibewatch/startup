      - number: '2.4'
        title: Urgency and iteration help adoption, but procurement proof is still thin
        blocks:
          - type: paragraph
            body: >-
              The adoption case rests on two real drivers: Pentagon urgency for high-speed capability and Hermeus's
              ability to iterate hardware quickly. Multiple retained sources tie the product to contested-environment
              response times, payload-release experiments, and a broader push to widen the defense industrial base for
              hypersonic propulsion and aircraft manufacturing. The same evidence also shows the constraints that matter
              for valuation. Public proof is still concentrated in test flights, prototype contracts, and enabling
              manufacturing systems rather than in a disclosed program of record, operational unit pricing, or airline
              demand. FAA-authorized but still limited supersonic flight volume, capital intensity, and missing
              route-economics evidence mean the timing from successful demonstrations to repeatable procurement remains
              a key diligence gap rather than a settled adoption curve.
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Defense urgency is real
            body: >-
              The public evidence already includes DIU and Air Force money, explicit payload-release requirements, and
              mission categories like mobility and ISR, which is enough to prove that Hermeus is selling into a real
              defense problem rather than only into a concept slide.
            calloutType: strength
            claimRefs:
              - CM008
              - CM009
              - CM012
          - type: callout
            title: Valuation runs ahead of clean market proof
            body: >-
              The retained pool never reaches a defensible TAM, disclosed program of record, commercial orderbook, or
              unit economics, so the market narrative is still being carried by prototype progress and proxy metrics
              more than by durable adoption proof.
