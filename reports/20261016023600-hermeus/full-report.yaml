        title: Milestones, stage of proof, and unresolved scale questions
        blocks:
          - type: paragraph
            body: >-
              Hermeus now has more than a slide-deck story: the May 2026 supersonic Quarterhorse milestone and the
              enlarged DIU ceiling give the company real evidence of technical progress and government interest. Even
              so, the retained 2024-2026 sources still describe an iterative test campaign, not an already disclosed
              production program or commercial revenue engine. The same source set that supports momentum also leaves
              major diligence holes around revenue, customer count, headcount, board control, debt covenants, and the
              timing of any shift from prototype cadence to procurement-scale fielding. For later chapters, Hermeus
              should be treated as technically progressing but still economically and organizationally only partially
