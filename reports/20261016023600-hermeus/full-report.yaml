      - number: '5.3'
        title: Deployment evidence is funded military experimentation, not production adoption
        blocks:
          - type: paragraph
            body: >-
              The strongest customer-side proof is government-sponsored testing. Hermeus, Aero-mag, PR Newswire, and The
              Debrief all describe the expanded DIU effort as a 2026-2027 campaign to prove high-Mach flight, high-speed
              payload release, and data collection relevant to future acquisition decisions. Publicly named stakeholders
              are the Defense Innovation Unit, the U.S. Air Force, and the U.S. Navy, which is meaningful because it
              ties technical work to a real defense workflow rather than a generic R&D narrative. But the same evidence
              also shows the maturity boundary: these are still developmental tests that are supposed to inform later
              experimentation and force-integration choices, not disclosed production contracts or operational
              deployments.
            claimRefs:
              - CE003
              - CE004
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
