chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Hermeus presents itself as a privately held defense aviation company using rapid iterative prototyping to
              build high-Mach aircraft, with Quarterhorse serving as the current proving path and Darkhorse/Halcyon as
              the longer product horizon. That identity is consistent across the retained source set. The
              operating-footprint record is less clean. Official company copy emphasizes a distributed team across Los
              Angeles, Atlanta, Jacksonville, and Washington, D.C., while third-party materials still describe Hermeus
              as Atlanta-based or list El Segundo, California as headquarters. For later chapters, the reusable ground
              truth is the business model and multi-city operating footprint, not a single fully verified headquarters
              location.
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
