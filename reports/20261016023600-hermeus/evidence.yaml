evidenceGaps:
  - type: missing-source
    severity: material
    topic: headquarters
    missingEvidence: An official statement naming Hermeus's principal office and core operating site as of the current refresh.
    whyItMatters: >-
      Location affects legal-entity diligence, labor-market assumptions, and which state or county records should be
      checked next.
    diligencePath: >-
      Request current legal-entity records, facility list, and management confirmation, then reconcile them against the
      website and investor materials.
  - type: missing-source
    severity: material
    topic: Leadership and founder table coverage
    missingEvidence: Current board roster, committee structure, and any governance changes beyond executive biographies.
    whyItMatters: Governance quality and independence cannot be judged from executive titles alone.
    diligencePath: Request board list, committee charters, and recent governance-change history.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: Stakeholder or investor map coverage
    missingEvidence: Current cap table, board seats, investor rights, debt covenants, and customer concentration disclosures.
    whyItMatters: >-
      Control rights and financing constraints can dominate dilution, governance, and the company's flexibility through
      future raises.
    diligencePath: >-
      Obtain the latest financing documents, debt agreement, cap table, and board observer or protective-right
      schedules.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover metrics
    missingEvidence: Current recognized revenue, run-rate, headcount, customer count, cash balance, and runway.
    whyItMatters: >-
      Without these numbers, later financial and valuation work has to treat operating scale and survivability as
      partially opaque.
    diligencePath: Request a management KPI pack, monthly reporting dashboard, and audited or board-ready financial statements.
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Audited market-sizing work that isolates TAM, SAM, and realistic SOM for defense high-speed aircraft and any
      commercial passenger wedge
    whyItMatters: >-
      Without a real sizing study, the chapter can only rely on contracts, financing, and capacity proxies when judging
      valuation headroom
    diligencePath: >-
      Obtain defense-budget line items, market-research work on reusable high-speed aircraft, and customer program
      documents that separate testing demand from operational procurement
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: procurement-bridge
    missingEvidence: >-
      Program-of-record milestones, named acquisition sponsors, and budget ownership for any transition from HyCAT and
      Quarterhorse testing into operational procurement
    whyItMatters: >-
      The value of the defense wedge depends on conversion from prototypes and flight-test work into recurring
      acquisition budgets
    diligencePath: >-
      Request DIU and service-program documentation, milestone schedules, and customer interviews that show who owns
      follow-on procurement and on what timeline
    relatedQuestionRefs:
      - QM004
      - QM006
  - type: missing-source
    severity: material
    topic: commercial-demand
    missingEvidence: >-
      Launch-customer commitments, route economics, certification roadmap, and pricing assumptions for Halcyon or other
      commercial offerings
    whyItMatters: >-
      Commercial upside is part of the story around Hermeus, but the retained evidence does not show whether that
      adjacency is financeable or near-term
    diligencePath: >-
      Request airline partnership evidence, certification plans, route-level economic models, and any preorder or LOI
      data before underwriting commercial contribution
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-visibility
    missingEvidence: >-
      Public unit pricing, lot pricing, or standard contract terms for Hermeus and the peer classes named in the
      assigned pool.
    whyItMatters: >-
      Without pricing transparency, the chapter can compare packaging and buyer path but cannot benchmark actual cost
      competitiveness.
    diligencePath: >-
      Request current bid structure, milestone-payment terms, and any published unit-cost targets from Hermeus and
      comparable high-speed programs.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: acquisition-path
    missingEvidence: A named program of record, production award, or public procurement schedule for reusable hypersonic aircraft.
    whyItMatters: >-
      Competitive durability depends on whether the Pentagon moves from experiments and ceilings into repeatable
      procurement.
    diligencePath: >-
      Obtain customer transition plans, milestone gates, and any source-selection status tied to Quarterhorse or
      Darkhorse.
    relatedQuestionRefs:
      - QP003
      - QP006
  - type: missing-source
    severity: material
    topic: autonomy-layer
    missingEvidence: >-
      The identity, commercial terms, and technical scope of the autonomy or payload partners that would sit on top of
      Hermeus airframes.
    whyItMatters: >-
      If autonomy and mission software are procured separately, those layers may capture margin and switching costs that
      do not belong to Hermeus.
    diligencePath: >-
      Ask management for named integration partners, interface standards, and any government interoperability
      requirements already locked in.
    relatedQuestionRefs:
      - QP005
      - QP009
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue
    missingEvidence: Recognized revenue by program, revenue mix, and the accounting policy for milestone and contract recognition.
    whyItMatters: Contract ceilings and technical milestones are not the same as recognized revenue quality or repeatability.
    diligencePath: Request board or lender reporting that breaks out revenue by customer, program, and recognition policy.
    relatedQuestionRefs:
      - QI001
      - QI007
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current unrestricted cash, monthly burn, debt draw or repayment schedule, and minimum liquidity thresholds.
    whyItMatters: >-
      Runway determines whether Hermeus can reach the next technical and procurement gates without another financing
      round.
    diligencePath: Obtain the latest cash-flow forecast, debt schedule, and monthly actual-versus-plan burn report.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: contract-unit-economics
    missingEvidence: >-
      Milestone payment timing, gross margin by contract, engine qualification cost, and per-flight or per-aircraft
      delivery cost.
    whyItMatters: >-
      Without cost and payment timing detail, investors cannot tell whether technical progress is compounding value or
      consuming subsidized runway.
    diligencePath: >-
      Review contract schedules, unit cost models, and gross-margin bridges for the DIU, Quarterhorse, and
      engine-manufacturing workstreams.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI006
  - type: missing-source
    severity: material
    topic: assurance-governance
    missingEvidence: >-
      Public documentation of software assurance, cybersecurity, export-control process, airworthiness governance, or
      formal safety-case ownership for operational deployment.
    whyItMatters: >-
      These controls determine whether a fast prototype program can graduate into a fieldable defense system without
      hidden certification or mission-assurance risk.
    diligencePath: >-
      Request the system safety case, mission-software assurance process, export-control workflow, and any published
      compliance or certification artifacts.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: production-readiness
    missingEvidence: >-
      Throughput, yield, QA, unit-cost, and maintenance data for F100 modifications, Chimera hardware, and
      additive-manufactured parts.
    whyItMatters: >-
      Prototype velocity does not prove repeatable production economics or quality control, which are essential to
      underwrite Darkhorse as more than a demo program.
    diligencePath: >-
      Request manufacturing plans, supplier agreements, quality metrics, scrap/yield history, and maintenance
      assumptions for each major propulsion and airframe component.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: production-adoption
    missingEvidence: >-
      Named production customers, procurement vehicles, or program-of-record milestones beyond test and experimentation
      activity.
    whyItMatters: >-
      The core commercial question is whether Hermeus is building toward a funded operating platform or staying in a
      prototype loop with limited adoption visibility.
    diligencePath: >-
      Request transition agreements, production options, LOIs, or explicit acquisition milestones from DIU, USAF, USN,
      or other end users.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Public NRR, GRR, churn, renewal timing, or cohort retention evidence.
    whyItMatters: >-
      Without durability metrics, it is impossible to distinguish sticky defense adoption from milestone-based
      sponsorship.
    diligencePath: >-
      Request contract renewal history, renewal dates, and any internal customer-retention dashboard used by management
      or the board.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, funded backlog, milestone schedule, and concentration by agency or program.
    whyItMatters: >-
