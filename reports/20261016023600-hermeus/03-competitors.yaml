      - ["Venus Aerospace / Destinus", Direct peer class, "TAMradar cites Venus at $106M+ and Destinus at $430M", "High-speed defense and aerospace buyers", "Similar speed ambition, but assigned sources say these peers rely on rocket or hydrogen propulsion rather than Hermeus's turbine-based runway path", "Assigned pool does not show equivalent U.S. defense flight-test traction or runway-operability evidence"]
      - ["Rocket Lab + Hypersonix HyCAT path", Adjacent high-speed testbed, "DIU-linked flight-test activity disclosed; assigned sources do not give startup valuation or unit economics", "DoD high-speed testing and technology maturation", "Another funded route to high-speed experimentation inside the same government ecosystem", "Evidence is testbed-centric rather than a reusable runway-launched aircraft program"]
      - ["Boom Supersonic and broader commercial-speed peers", Adjacent commercial peer class, "TAMradar says Boom has raised $1B; Wikipedia lists Aerion, Exosonic, and Spike Aerospace in the wider peer set", "Commercial aviation and long-haul passenger use cases", "More visible commercial-speed category awareness than Hermeus's military-first positioning", "Mission fit to current defense demand is indirect in the assigned sources"]
      - ["Anduril / autonomy-stack adjacencies", Adjacent entrant, "Assigned sources disclose product activity but not comparable funding or price terms", "Defense operators that can separate airframe, mission software, and payload decisions", "Can win software or mission-system layers even if Hermeus wins the airframe", "Reduces Hermeus lock-in because the government can pick autonomy separately"]
      - ["RQ-4 / MQ-9 and current force substitutes", Status-quo substitute, "Fielded military systems rather than venture-funded startup programs", "Current ISR and defense missions", "Available today and already trusted operationally", "Subsonic speed leaves the high-Mach mission gap open, but availability still lowers switching pressure"]
    notes: >-
      Rows reflect only competitors, adjacent entrants, or substitutes named in the assigned
      prefetched sources; undisclosed scale or funding is left as unknown rather than inferred.
    claimRefs: [CP001, CP002, CP006, CP007, CP008, CP009, CP015]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Hermeus
      - Other high-speed startup classes
      - Incumbent or substitute classes
      - Implication
    rows:
      - ["Speed proposition", "Targets high-Mach and eventually hypersonic operations", "Venus / Destinus pursue similar speed bands; Hypersonix testbeds support high-speed experimentation", "RQ-4 and MQ-9 are explicitly described as subsonic substitutes", "Hermeus's value case is strongest where speed, not mere unmanned persistence, is the decisive requirement"]
      - ["Runway takeoff and recovery", "Assigned sources emphasize turbine-based runway takeoffs and reusable operations", "TAMradar contrasts Hermeus with rocket- or hydrogen-propulsion peers; HyCAT alternatives are disclosed as testbeds, not runway-reusable aircraft", "Incumbents already operate from known military infrastructure", "Hermeus's edge is not just speed but speed with more conventional launch and recovery assumptions"]
      - ["Autonomy ownership", "Hermeus says it does not build autonomy and wants interoperability with whatever stack the government chooses", "Adjacent vendors can specialize in software or mission autonomy", "Incumbents already come with established control and mission-system paths", "Autonomy remains a separable buying criterion rather than a Hermeus-controlled moat"]
      - ["Payload / strike path", "2026 DIU scope explicitly adds high-speed payload release testing", "Assigned sources do not show peer payload-release milestones at the same specificity", "Current systems can already carry mission payloads, even if not at high-Mach speed", "Hermeus has a clearer public strike-adjacent roadmap than most startup peers, but not yet fielded deployment"]
      - ["Manufacturing and supplier control", "Partner-issued material says additive manufacturing supports vertical integration and reduced external dependencies", "Assigned sources do not provide comparable manufacturing-detail disclosure for peer startups", "Incumbents benefit from mature defense supply chains", "Hermeus's execution edge depends on whether vertical integration beats incumbent scale advantages"]
      - ["Procurement maturity", "No public program of record; current path still framed as future acquisition input", "Peer evidence in the pool is also mostly pre-program or experimental", "Substitutes are already bought and operated", "The category is still won or lost in acquisition timing, not only in raw flight performance"]
    notes: >-
      This matrix converts the assigned-source evidence into comparable buying criteria; unsupported
      competitor specifics stay at class level instead of being guessed for individual firms.
    claimRefs: [CP004, CP005, CP006, CP008, CP009, CP010, CP011, CP013]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Public price / unit / contract model
      - Included capabilities in assigned sources
      - Discount, opacity, or unknowns
      - Implication
    rows:
      - [Hermeus, "R&D funding plus government-contract packaging: $200M equity, $150M debt, and DIU / Air Force contract work", "Aircraft development, payload-release flight testing, and hardware-scale manufacturing expansion", "No public unit price, recurring software fee, or production-lot price disclosed in assigned pool", "Buyers can see financing depth and contract ceilings but not standardized commercial terms"]
      - ["DIU high-speed testbed alternatives", "Contracted test-service / experimentation model rather than published catalog pricing", "High-speed test capacity such as HyCAT flight-test services", "Assigned pool does not disclose unit economics or recurring service terms", "Competes with Hermeus for experimentation budgets before a production airframe decision exists"]
      - ["Commercial-speed peer startups", "Funding rounds are public, but product pricing is not shown in assigned sources", "Passenger or broader high-speed aviation development programs", "Boom, Venus, and Destinus are visible through fundraising comparisons, not public list pricing", "The public benchmark is capital raised and mission focus, not monetization quality"]
      - ["Autonomy or mission-system complements", "Government can acquire autonomy separately; no Hermeus bundle is described", "Software or control-stack interoperability around the airframe", "Assigned sources do not identify the eventual autonomy vendor or pricing model", "Hermeus may win the airframe while another vendor wins high-margin software economics"]
      - ["Fielded substitute systems", "Program-budget procurement rather than startup list pricing in the assigned pool", "Operational ISR, strike, or testing missions available today", "Assigned sources do not provide unit-cost disclosures for the substitute fleet", "Existing availability still strengthens substitute power even without transparent price comparability"]
    notes: >-
      The assigned pool discloses funding rounds, contract ceilings, and acquisition structure more
      often than explicit product prices; "unknown" means the source set did not publish a public
      price or standard commercial term.
    claimRefs: [CP001, CP003, CP004, CP005, CP008, CP010]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The map shows Hermeus between fielded substitutes and more experimental high-speed peers:
      higher speed-fit than incumbents, but lower procurement maturity than systems already in use.
    xAxis:
      label: Speed and high-Mach mission fit
      min: 1
      max: 5
      lowLabel: Lower-speed or indirect substitute
      highLabel: High-Mach or hypersonic mission fit
      description: Ordinal 1-5 score based only on the assigned prefetched evidence.
    yAxis:
      label: Operational and acquisition readiness
      min: 1
      max: 5
      lowLabel: Experimental or concept-heavy
      highLabel: Fielded or funded with clearer buyer path
      description: Ordinal 1-5 score based only on the assigned prefetched evidence.
    data:
      points:
        - label: Hermeus
          x: 4.5
          y: 3
          note: "Supersonic flight achieved and DIU ceiling expanded to $219M, but no public program of record."
        - label: "RQ-4 / MQ-9 substitute class"
          x: 1.5
          y: 5
          note: "Subsonic systems, but already fielded and trusted by defense buyers."
        - label: "Rocket Lab + Hypersonix HyCAT path"
          x: 4
          y: 2.5
          note: "Real high-speed test activity inside HyCAT, but evidence is testbed-centric rather than runway-reusable aircraft."
        - label: "Venus / Destinus peer class"
          x: 4
          y: 2
          note: "Similar speed ambition appears in assigned sources, but public U.S. procurement traction is less concrete here."
        - label: "Boom and broader commercial-speed peers"
          x: 2.5
          y: 2.5
          note: "Capitalized and visible, but defense mission fit is indirect in the assigned pool."
        - label: "Autonomy-stack adjacencies"
          x: 1.5
          y: 4
          note: "Government can standardize software separately, limiting Hermeus's control over the full stack."
    approximationNotes: >-
      The coordinates are ordinal judgments derived from source-backed statements about speed band,
      reusability, buyer path, and deployment maturity; they are not benchmark test scores.
    claimRefs: [CP004, CP006, CP008, CP009, CP010, CP013, CP015]
callouts:
  - calloutType: strength
    title: Runway-reusable high-Mach positioning is the real product distinction
    body: >-
      The strongest evidence-backed separation is not "hypersonics" in the abstract; it is
      Hermeus's attempt to pair high-Mach performance with runway operations, payload-release
      testing, and a turbine-based path that looks closer to an aircraft program than to a single
      expendable test shot.
    claimRefs: [CP004, CP009, CP011]
  - calloutType: risk
    title: The buyer can still unbundle the stack and delay commitment
    body: >-
      Because autonomy is separable, substitutes are already in service, and public procurement has
      not crossed into a visible program of record, Hermeus still has to prove that its airframe is
      important enough for the Pentagon to commit before adjacent entrants or incumbents absorb the
      budget.
    claimRefs: [CP010, CP012, CP013]
