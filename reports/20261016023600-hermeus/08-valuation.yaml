schemaVersion: report-v2
artifact: valuation
slug: hermeus
runDate: 2026-10-16
company:
  name: Hermeus
chapter:
  number: 8
  title: Valuation
  summary: >-
    Hermeus has credible financing and technical momentum, but the assigned public evidence supports a
    research-more recommendation rather than a buy at or above the April 2026 $1 billion post-money mark.
    The debt/equity mix, flat priced-round history, milestone risk, and missing operating and preference data
    make a precise return forecast unsupported.
sections:
  - id: recommendation
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more with medium confidence, high risk, and a stretched valuation stance.
      Hermeus announced $350 million of Series C financing, and several third-party pages report a $1 billion
      post-money valuation. That validates access to capital, not the attractiveness of common equity at the same
      price. UpMarket reports that only $200 million was equity and $150 million was debt; on a simple,
      preference-free calculation, the equity component implies an $800 million pre-money value and 20% primary
      dilution. Actual dilution and common-equity value can differ because the option pool, liquidation
      preferences, debt seniority, warrants, and conversion terms are not disclosed. Entry should therefore be
      conditioned on data-room terms and milestone proof rather than the headline round size.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and milestone conversion
    body: >-
      The thesis is that fresh capital funds a concrete hardware plan: Hermeus says it will advance Quarterhorse
      Mk 2.2 toward supersonic flight, build Mk 2.3 for Mach 3, expand prototyping in El Segundo, and prepare
      Atlanta for production. A supplier-issued account also documents purchases of two Velo3D printers for
      vertically integrated engine and aircraft parts. The anti-thesis is that prototype cadence has not yet
      established scalable program economics. Breaking Defense reported in 2024 that the Pentagon had not
      publicly identified a hypersonic-aircraft program of record, described an earlier flight target that had
      been reframed, and quoted a Defense Department official on unresolved materials and structures work.
      Funding extends the learning runway, but it does not itself prove procurement conversion, production yield,
      or an investable margin profile.
    claimRefs: [CV007, CV008, CV009, CV010, CV014, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios, comparables, and valuation boundaries
    body: >-
      Scenario values should be treated as entry-discipline bands, not estimates of intrinsic value. The $800
      million lower anchor is only the simple pre-money arithmetic implied by UpMarket's reported $200 million
      equity component and $1 billion post-money valuation. Multiples reports $1 billion marks for both the March
      2022 Series B and April 2026 Series C, which offers no headline step-up in that database despite additional
      capital and execution. Its selected aerospace and defense comparables span roughly 4.3x to 51.5x last-fiscal-
      year EV/revenue, but the set mixes unlike public and private businesses and does not provide Hermeus
      revenue. UpMarket's $1.18 billion model estimate is likewise not a transaction price and is explicitly
      qualified as potentially different from actual trades. A premium is unsupported until operating metrics
      and procurement conversion are visible.
    claimRefs: [CV003, CV004, CV005, CV006, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      No target return or fixed hold period is supportable from the assigned evidence. UpMarket describes
      pre-IPO shares as illiquid and speculative, says exits are unpredictable, and advises planning for a
      multi-year hold. EquityZen describes IPO, acquisition, or an eligible secondary sale as possible mechanics,
      but its listing is an access channel rather than evidence of current liquidity or a clearing price. A 2025
      third-party overview also reported that Hermeus had not announced an IPO timetable at that point. Before
      investment, diligence should obtain monthly financials, funded backlog, milestone-payment schedules, the
      complete cap table, debt documents, preference terms, and recent secondary indications. Thesis-break
      triggers are a missed supersonic or Mach 3 milestone, failure to convert testing into funded follow-on
      demand, a senior-claim-heavy financing structure, or cash needs that force a flat or down round.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: "Recommendation: research-more"
    body: >-
      Do not underwrite a premium to the $1 billion round mark from public evidence alone. Revisit the call only
      after capital-stack terms, operating metrics, and funded program conversion are verified, or after entry
      price falls enough to compensate for those unresolved risks.
    claimRefs: [CV002, CV003, CV008, CV011, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Current view, Decision implication]
    rows:
      - [Recommendation, research-more, Require private diligence before underwriting an investment.]
      - [Confidence, medium, Financing data are corroborated but operating economics remain unavailable.]
      - [Risk rating, high, Technical execution and capital-stack seniority can materially impair common equity.]
      - [Valuation stance, stretched, The $1B round mark lacks public revenue or cash-flow support.]
      - [Entry discipline, "At or below verified terms with milestone protection", Do not pay a premium for undisclosed economics.]
    notes: >-
      The views use only assigned public evidence; the table is decision guidance, not an appraisal or quoted
      secondary-market price.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Side, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, Fresh capital is assigned to Mk 2.2 and Mk 2.3 hardware milestones, On-time supersonic and Mach 3 flights would strengthen technical confidence.]
      - [Thesis, Hermeus is investing in facilities and vertically integrated manufacturing tools, Repeatable production yield and unit-cost disclosure would make this economically relevant.]
      - [Anti-thesis, No public hypersonic-aircraft program of record was identified in the 2024 reporting, A funded follow-on procurement or named program would reduce demand-conversion risk.]
      - [Anti-thesis, Reusable hypersonic aircraft still face materials and structures work, Independent test evidence at target speed would narrow technical risk.]
      - [Anti-thesis, Earlier flight timing was reframed after additional testing, A credible milestone schedule with contingency and burn data would improve confidence.]
    notes: >-
      The manufacturing evidence is supplier-issued, and the program and schedule observations are dated to the
      cited 2022-2024 sources rather than asserted as current status.
    claimRefs: [CV007, CV008, CV009, CV010, CV014, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Indicative entry band, Return logic, Probability signal]
    rows:
      - ["Bull", "Supersonic and Mach 3 milestones land; funded demand and clean common-equity terms are verified.", "Above $1B only after those proofs; no public upper bound is supportable.", "Upside requires both technical and procurement de-risking rather than another model mark.", "Named follow-on awards and independently verified flight milestones."]
      - ["Base", "Development progresses but economics and procurement conversion remain opaque.", "$800M-$1B, subject to verified debt and preference terms.", "Return depends on avoiding overpayment while milestones mature.", "Continued tests without disclosed revenue or backlog."]
      - ["Bear", "Milestones slip, demand remains experimental, or senior claims weaken common equity.", "Below the simple $800M implied pre-money anchor, or no investment.", "Capital loss or a flat/down round dominates absent a clear valuation floor.", "Schedule misses, weak funded conversion, or financing stress."]
    notes: >-
      The $800M anchor is derived from a reported $200M equity raise at $1B post-money and excludes option-pool,
      preference, warrant, and debt effects; the bands are price-discipline scenarios, not fair-value estimates.
    claimRefs: [CV003, CV004, CV005, CV007, CV008, CV009, CV011, CV016]
