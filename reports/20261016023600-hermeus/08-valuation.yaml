        - id: financing
          label: Financing capacity
          value: "$350M Series C financing"
        - id: execution
          label: Hardware plan
          value: "Mk 2.2 supersonic and Mk 2.3 Mach 3"
        - id: technical-risk
          label: Remaining proof
          value: "Materials, structures, schedule, and flight milestones"
        - id: comparability
          label: Weak valuation bridge
          value: "Wide, unlike comp set and no public revenue base"
        - id: structure
          label: Capital-stack opacity
          value: "Debt, preferences, warrants, and dilution not fully disclosed"
        - id: decision
          label: Decision
          value: "Research-more until proof or price improves"
      edges:
        - from: financing
          to: execution
          relationship: funds
        - from: execution
          to: technical-risk
          relationship: must clear
        - from: technical-risk
          to: comparability
          relationship: limits
        - from: comparability
          to: structure
          relationship: compounds
        - from: structure
          to: decision
          relationship: supports
    approximationNotes: >-
      This is a qualitative decision chain; it does not assign probabilities or derive a numeric fair value.
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV011, CV015, CV016]
