  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        The complete cap table, option-pool treatment, debt seniority and covenants, liquidation preferences,
        warrants, and conversion terms for the 2026 financing.
      whyItMatters: >-
        The headline post-money valuation and simple dilution estimate do not establish proceeds or downside
        protection for new common-equity investors.
      diligencePath: Review the signed equity and debt documents, fully diluted cap table, and waterfall model.
      relatedQuestionRefs: [QV008, QV009]
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: >-
        Audited or management-verified revenue, funded backlog, gross margin, burn, cash runway, milestone
        payment schedules, and program-level unit economics.
      whyItMatters: >-
        Without these inputs, neither cash-flow valuation nor a defensible revenue multiple, target return, or
        hold period can be underwritten.
      diligencePath: Request monthly financials, board-approved plan, contract schedules, backlog reconciliation, and cash forecast.
      relatedQuestionRefs: [QV006, QV009]
    - type: missing-source
      severity: material
      topic: exit-liquidity
      missingEvidence: Current executable secondary bids and asks, transfer restrictions, company approval requirements, and an official exit plan.
      whyItMatters: Marketplace access pages describe possible mechanics but do not establish realizable liquidity or timing.
      diligencePath: Obtain current broker indications, right-of-first-refusal terms, transfer history, and management's capital-markets plan.
      relatedQuestionRefs: [QV007, QV009]
