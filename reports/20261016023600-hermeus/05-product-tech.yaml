company:
  name: Hermeus
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Hermeus has credible technical proof of progress because Quarterhorse Mk 2.1
    reached Mach 1.21, the DIU/USAF/USN program expanded to a $219 million
    ceiling for high-Mach payload-release testing, and public sources describe a
    concrete propulsion and manufacturing stack around F100-based engines and
    additive manufacturing. The product is still a prototype-led defense
    development program rather than a deployed production platform, so the core
    underwriting questions are whether payload release, sustained higher-Mach
    performance, and repeatable manufacturing can move from funded tests into an
    operational program of record.
sections:
  - id: current-product-scope
    title: Quarterhorse is the real product surface; Darkhorse and Halcyon are still roadmap vehicles
    body: >-
      Public evidence shows Hermeus delivering a staged aircraft roadmap rather
      than a finished operational fleet. The current proof point is the
      Quarterhorse series: Breaking Defense described Quarterhorse as the active
      test program, Aero-mag reported that Mk 2.1 completed a supersonic flight,
      and the company now says Mk 2.2 and Mk 2.3 are next in line. Darkhorse is
      consistently described as the intended reusable Mach 5+ military platform,
      while Halcyon remains the commercial airliner concept. That means customer
      workflow evidence today is strongest for defense experimentation and
      technology maturation, not for production deployment, recurring service
      delivery, or commercial route operations.
    claimRefs: [CE001, CE002, CE005, CE006, CE007]
    tableRefs: [TE001]
  - id: architecture-and-build
    title: The architecture is propulsion-led and vertically integrated around test iteration
    body: >-
      The best-documented technical architecture is propulsion plus fast hardware
      iteration. Breaking Defense reported that Chimera II uses a Pratt &
      Whitney F100 core with a ramjet afterburner, a precooler, and an in-house
      bypass system, while Power Systems Design reported that Hermeus acquired
      Velo3D Sapphire printers calibrated for Inconel 718 to manufacture
      Quarterhorse and Chimera parts. Taken together, the public stack suggests
      Hermeus is trying to shorten the design-build-test loop by controlling key
      propulsion modifications and selected manufacturing steps internally.
      That is a real differentiator if it works, but it also concentrates
      execution risk into engine integration, additive-part quality, and supply
      chain scaling.
    claimRefs: [CE008, CE009, CE010, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-and-user-workflow
    title: Deployment evidence is funded military experimentation, not production adoption
    body: >-
      The strongest customer-side proof is government-sponsored testing.
      Hermeus, Aero-mag, PR Newswire, and The Debrief all describe the expanded
      DIU effort as a 2026-2027 campaign to prove high-Mach flight, high-speed
      payload release, and data collection relevant to future acquisition
      decisions. Publicly named stakeholders are the Defense Innovation Unit,
      the U.S. Air Force, and the U.S. Navy, which is meaningful because it ties
      technical work to a real defense workflow rather than a generic R&D
      narrative. But the same evidence also shows the maturity boundary: these
      are still developmental tests that are supposed to inform later
      experimentation and force-integration choices, not disclosed production
      contracts or operational deployments.
    claimRefs: [CE003, CE004, CE011, CE012]
    tableRefs: [TE002]
  - id: controls-and-open-risks
    title: Safety and quality are framed through flight-test learning, with governance gaps still public
    body: >-
      Hermeus does present a control philosophy, but it is mostly an engineering
      process story instead of a disclosed assurance framework. Breaking Defense
      described subsystem, ground-station, operations, and human-factors testing
      on the Mk 1 path, while the DIU expansion is positioned as a way to gather
      validated data and reduce service adoption risk. That is useful evidence
      that the company is not skipping test discipline. At the same time, the
      assigned prefetched pool does not surface formal public disclosures on
      software assurance, cybersecurity, export-control process, safety case
      governance, or production quality metrics for the future operational
      system. Those omissions matter because Hermeus is selling a defense
      aircraft vision, not just a lab demonstrator.
    claimRefs: [CE004, CE007, CE012]
callouts:
  - calloutType: strength
    title: Real milestone velocity
    body: >-
      Hermeus moved from earlier Quarterhorse prototypes to a reported Mach 1.21
      supersonic flight and then into a larger DIU-backed 2026-2027 payload
      release campaign, which is stronger proof of technical momentum than a
      slide-only hypersonic roadmap.
    claimRefs: [CE002, CE003, CE004]
  - calloutType: risk
    title: Operational proof is still ahead
    body: >-
      The current program is funded and technically specific, but payload
      release, sustained higher-Mach performance, and translation into a
      procureable production platform remain future milestones rather than
      completed operating proof.
    claimRefs: [CE004, CE005, CE006, CE007]
  - calloutType: insight
    title: Vertical integration is a differentiator and a bottleneck
    body: >-
      Hermeus' use of F100-based propulsion modifications plus additive
      manufacturing can speed iteration, yet it also makes engine integration,
      materials quality, and throughput central diligence items.
    claimRefs: [CE008, CE009, CE010]
