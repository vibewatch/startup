      - [Quarterhorse Mk 2.2 / Mk 2.3, Internal engineering program and future defense evaluators, Under build / planned, Successive prototypes intended to push performance further quickly, Timing and target performance thresholds are not public]
      - [Darkhorse, Defense mission operators, Future reusable Mach 5+ UAS concept, Intended mass-producible military product rather than test article, No public production contract or fielding timeline in assigned evidence]
      - [Halcyon, Future commercial operators, Concept stage, Extends the same high-speed ambition into passenger travel, "No public deployment, certification, or customer commitment evidence in assigned pool"]
    notes: Public evidence mixes verified milestones with company roadmap claims; null economics, certification, and production data remain diligence asks.
    claimRefs: [CE001, CE002, CE005, CE006, CE007]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Validate high-Mach payload release, Military experimentation and range testing, Quarterhorse campaign under the expanded DIU program, $219 million ceiling and planned 2026-2027 flight series, Payload-release success remains a target rather than a completed public result]
      - [Generate service-relevant flight data, Traditional long-cycle defense prototyping, Rapid-iteration aircraft that feed data into experimentation and acquisition decisions, Company and partner sources say data will directly inform future service decisions, Public evidence does not disclose the decision gates or acceptance criteria]
      - [Prepare a reusable high-speed military platform, Concept and prototyping before program adoption, Darkhorse as the intended follow-on operational UAS, Reusable Mach 5+ positioning is differentiated versus one-off test articles, No disclosed program-of-record transition or production customer]
      - [Support future high-speed commercial travel, Conventional subsonic long-haul travel, Halcyon concept for trans-oceanic hypersonic routes, Public roadmap claims sub-90-minute New York to London aspirations, Commercial product remains conceptual in the assigned evidence]
    notes: Benefits combine verified contract scope with roadmap claims; future mission and commercial rows are directional, not proof of deployed service.
    claimRefs: [CE001, CE003, CE004, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [GE J85 to F100 engine progression, Moves the aircraft from earlier subsonic test articles toward higher-speed propulsion, Availability of proven military engine cores and integration know-how, Engine adaptation may still fail to deliver repeatable performance at scale]
      - [Chimera II TBCC modifications, Adds the ramjet afterburner plus precooler and bypass path needed for the high-Mach roadmap, In-house propulsion engineering around a Pratt & Whitney F100 base, Public evidence does not yet show sustained Mach 3+ flight results]
      - ["Additive manufacturing with Sapphire / Sapphire XC", Produces Inconel 718 components for Chimera and Quarterhorse parts, "Velo3D equipment, materials process control, and internal manufacturing execution", "Throughput, yield, and QA metrics are undisclosed"]
      - ["Government-coupled flight-test loop", "Aligns aircraft tests with DIU, USAF, and USN mission needs", "Continued defense sponsorship and access to ranges and evaluators", "Customer concentration and milestone gating are not transparent"]
    notes: Architecture rows combine observed components with documented dependencies; undisclosed throughput and QA data should not be inferred from the hardware roadmap.
    claimRefs: [CE003, CE008, CE009, CE010, CE011]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a layered system that starts with defense test
      demand, runs through iterative aircraft and propulsion hardware, and feeds
      back into future acquisition decisions.
    data:
      layers:
        - label: Mission demand and test sponsors
          detail: DIU, USAF, and USN shape the current funded workflow around high-Mach flight and payload release.
          outputs:
            - label: 2026-2027 intensive flight-test campaign
            - label: Future acquisition and experimentation inputs
        - label: Aircraft roadmap
          detail: Quarterhorse is the active proving line, with Darkhorse and Halcyon beyond today's validated milestones.
          modules:
            - label: Quarterhorse Mk 1
              note: Historical flying prototype
            - label: Quarterhorse Mk 2.1
              note: Supersonic to Mach 1.21
            - label: Quarterhorse Mk 2.2 / Mk 2.3
              note: Next prototypes under build / planned
            - label: Darkhorse
              note: Intended reusable Mach 5+ UAS
            - label: Halcyon
              note: Future commercial aircraft concept
        - label: Propulsion stack
          detail: The high-Mach path is built around migrating from earlier engines toward an F100-based Chimera II architecture.
          modules:
            - label: GE J85 baseline
              note: Earlier flight article powerplant
            - label: Pratt & Whitney F100 core
              note: Base engine for later roadmap aircraft
            - label: Precooler and bypass system
              note: In-house modifications reported by Breaking Defense
            - label: Ramjet afterburner
              note: Reported Chimera II differentiator
        - label: Manufacturing and supply layer
          detail: Hermeus is using additive manufacturing and supplier relationships to compress build cycles.
          modules:
            - label: Sapphire printer
              note: Inconel 718 calibration
            - label: Sapphire XC printer
              note: Large-format production-oriented machine
            - label: Supply-chain buildout
              note: Needed before higher-volume defense output
        - label: Test and data collection layer
          detail: Flight-test execution is meant to create validated performance data before any broader operational transition.
          outputs:
            - label: Flight and subsystem evidence
            - label: Mission-fit data for service experimentation
        - label: Validation and control loop
          detail: Flight data, subsystem tests, and stakeholder feedback are the public control mechanisms today.
          outputs:
            - label: Supersonic flight proof
            - label: Payload-release proof target
            - label: Risk-reduction data for force integration
    approximationNotes: Public layers summarize documented components and milestones, not an officially published systems diagram.
    claimRefs: [CE002, CE003, CE004, CE008, CE009, CE011, CE012]
