        title: 展示项
        blocks:
          - type: callout
            title: 国防紧迫性真实存在
            body: 公开证据已经包括 DIU 和 Air Force 资金、明确的载荷释放要求，以及机动和 ISR 等任务类别；这足以证明 Hermeus 面向的是真实国防问题，而不只是概念演示文稿。
            calloutType: strength
