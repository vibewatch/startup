      - number: '2.2'
        title: 买方先是项目办公室，之后才可能是运营方
        blocks:
          - type: paragraph
            body: >-
              短期买方路径经过政府项目办公室，而不是已有运营机队预算。Air & Space Forces 报道称，Air Force 看好高超音速飞机在高层空运、机动和 情报、监视与侦察任务中的潜力；The Merge 称
              DIU 将 Hermeus 的合同上限扩大到 2027 年 $219 million，并明确要求进行飞行中载荷释放。
              因此，研发和试验预算会先支付测试能力，采购预算之后才可能支持运营级无人机项目；只有载荷、飞行节奏和任务概念得到验证，终端用户才会成为直接需求信号。
              由于保留来源没有披露航线、价格、认证或启动客户，商业航空公司和乘客目前仍只是概念上的利益相关方。
