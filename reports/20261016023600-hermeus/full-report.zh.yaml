              - CM012
          - type: callout
            title: 估值跑在干净的市场证据前面
            body: 保留的来源始终没有给出可自洽的 TAM、已披露的正式项目、商业订单簿或单位经济性，因此市场叙事仍主要由原型进展和代理指标支撑，而不是可持续采用证据。
            calloutType: risk
