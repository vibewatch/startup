    title: 收入模型桥接
    type: flow
    summary: 公开证据支持以合同和里程碑为核心的收入桥接，但不支持其中已经实现的利润率或现金转化系数。
    data:
      nodes:
        - label: 国防需求信号
          detail: DIU 上限和此前的空军支持，构成最清晰的近期变现锚点。
        - label: Quarterhorse 飞行里程碑
          detail: 首飞、超音速进展和载荷释放测试，是可以打开开票或后续工作的运营证明点。
        - label: 项目收入获取
          detail: 收入可能通过里程碑付款、合同选项和服务工作转化，而不是依靠公开的标价。
        - label: 新的变现层
          detail: F100 授权制造和 Ramjet-X 测试扩展了模型，但两者都没有披露定价和利用率。
        - label: 成本堆栈
          detail: 在实现规模化之前，飞机制造、发动机工作、增材制造、试验场使用权和测试基础设施都会消耗现金。
        - label: 现金续航结果
          detail: 股权加债务融资赢得了时间，但现金续航仍取决于里程碑转化和国防采购路径。
    approximationNotes: 排序流程是概念性的。公开来源没有披露各阶段之间的转化率、利润提取或付款时间。
    claimRefs:
      - CI003
      - CI006
      - CI009
      - CI010
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向一套分层系统：从国防测试需求出发，经过迭代式飞机和推进硬件，再反馈到未来采购决策。
    data:
      layers:
        - label: 任务需求与测试赞助方
          detail: DIU、USAF 和 USN 围绕高马赫飞行与载荷释放，塑造了当前获得资金支持的工作流。
          outputs:
            - label: 2026-2027 intensive flight-test campaign
            - label: Future acquisition and experimentation inputs
        - label: 飞机路线图
          detail: Quarterhorse 是当前的验证主线，Darkhorse 和 Halcyon 则超出今天已经验证的里程碑。
          modules:
            - label: Quarterhorse Mk 1
              note: Historical flying prototype
            - label: Quarterhorse Mk 2.1
              note: Supersonic to Mach 1.21
            - label: Quarterhorse Mk 2.2 / Mk 2.3
              note: Next prototypes under build / planned
            - label: Darkhorse
              note: Intended reusable Mach 5+ UAS
            - label: Halcyon
              note: Future commercial aircraft concept
        - label: 推进系统堆栈
          detail: 高马赫路径围绕从早期发动机迁移到基于 F100 的 Chimera II 架构搭建。
          modules:
            - label: GE J85 基准
              note: Earlier flight article powerplant
            - label: Pratt & Whitney F100 核心
              note: Base engine for later roadmap aircraft
            - label: 预冷器和旁通系统
              note: In-house modifications reported by Breaking Defense
            - label: 冲压发动机加力燃烧室
              note: Reported Chimera II differentiator
        - label: 制造与供应层
          detail: Hermeus 正利用增材制造和供应商关系压缩制造周期。
          modules:
            - label: Sapphire 打印机
              note: Inconel 718 calibration
            - label: Sapphire XC 打印机
              note: Large-format production-oriented machine
            - label: 供应链建设
              note: Needed before higher-volume defense output
        - label: 测试与数据收集层
          detail: 飞行测试执行旨在建立经过验证的性能数据，再推进更广泛的运营转换。
          outputs:
            - label: Flight and subsystem evidence
            - label: Mission-fit data for service experimentation
        - label: 验证与控制闭环
          detail: 如今，飞行数据、子系统测试和利益相关方反馈构成公开可见的控制机制。
          outputs:
            - label: Supersonic flight proof
            - label: Payload-release proof target
            - label: Risk-reduction data for force integration
    approximationNotes: 公开层级总结了有文档记录的组件和里程碑，不是官方发布的系统图。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE008
      - CE009
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Hermeus 的公开客户旅程从政府赞助的研究，走向飞行测试验证，再走向尚未赢得的正式项目转换；商业航空仍是更晚的扩展循环。
    data:
      items:
        - label: 概念与研究买方
          stage: 早期需求形成
          actor: 空军 / 专机运输研究利益相关方
          touchpoints:
            - 2020 年研究工作探索了未来高超音速运输的使用场景
          note: 政府先定义问题，广泛的商业需求证明随后才出现。
        - label: 飞行测试赞助方
          stage: 原型验证
          actor: U.S. Air Force
          touchpoints:
            - 2021 年 $60M Quarterhorse 合同
            - 飞行测试权限与迭代验证
          note: 客户证明体现为赞助和试验，而不是单机采购。
        - label: 扩展测试客户
          stage: 任务导向的试验
          actor: Defense Innovation Unit
          touchpoints:
            - 参与 HyCAT
            - 2026 年上限提高至 $219M
          note: DIU 购买的是高速测试结果和风险降低。
        - label: 运营利益相关方
          stage: 对未来部队的相关性
          actor: 空军与海军
          touchpoints:
            - 高速载荷释放演示
            - 用于影响未来采购决策的数据
          note: 使用场景比采购承诺更清晰。
        - label: 采购关口
          stage: 正式项目转换
          actor: 国防部
          touchpoints:
            - Breaking Defense 报道称需要更清晰的需求信号
            - The Merge 称，通往正式项目的道路仍然很长
          note: 规模化取决于预算转化，而不只是技术里程碑。
        - label: 商业扩展循环
          stage: 长期多元化
          actor: 航空公司 / 高端长途旅客
          touchpoints:
            - Halcyon 路线图
            - 指定证据中没有点名的航空公司意向书或预订单
          note: 在当前来源集合中，商业需求仍只是愿景，尚未有订单或合同证明。
    approximationNotes: null
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU008
      - CU011
      - CU014
