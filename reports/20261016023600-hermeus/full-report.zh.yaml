            body: >-
              Hermeus 的核心风险不是能否继续吸引关注，而是当前资本和飞行测试窗口是否足够长，能否把原型势头转化为经过验证的高马赫数产品路径。公司有新融资、更高的 DIU 上限和多次成功原型飞行，
              但证据仍指向四项严重剩余风险：按期证明涡轮喷气到冲压发动机 / 载荷释放路径；将 DIU 演示转化为真实采购路径；把制造能力从实验节奏扩大；以及在 2026 年融资加入债务后管理资本密集度。
              最强的缓解措施是迭代原型开发、政府资助的测试活动和新设施，但这些措施降低的是早期工程不确定性，对客户集中度或项目转型风险的缓解较少。
