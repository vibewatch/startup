companyProfile:
  summary: >-
    Hermeus 是一家私人持有的航空航天与国防公司，正通过迭代原型项目开发高马赫数高超音速飞机和推进系统：当前以 Quarterhorse 为核心，长期路线图则指向 Darkhorse。公司在飞行测试、政府战略关系以及据报道达
    $350 million 的 Series C 上已有公开证据，但收入、烧钱速度、现金跑道和股权表细节均未公开，经济状况仍不透明。
