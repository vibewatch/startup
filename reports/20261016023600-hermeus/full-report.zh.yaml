      - number: '3.3'
        title: 持久性仍取决于采购转化、产能和执行
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争风险不是另一家初创公司已经赢下品类，而是买方可以继续使用替代方案或相邻项目，直到 Hermeus 证明更多通向生产的路径。DIU 官方扩展仍将 2026-2027
              年活动定义为服务未来采购决策的数据来源；独立报道称，国防部尚未公开披露高超音速飞机正式项目。Breaking Defense 还报道，可复用高超音速 材料和结构仍是未解决的科学技术问题；若需求兑现，Hermeus
              当前工厂近期的制造信号也只有每年“约十二架”Mk 2 无人机。测试基础设施和学习曲线带来的转换成本确实存在，但还不足以阻止现有厂商、相邻自主系统供应商或资金更充足的同业项目取代它。
            claimRefs:
              - CP005
              - CP012
              - CP013
              - CP014
              - CP016
