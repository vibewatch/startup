      - number: '1.2'
        title: 领导层、创始人与治理依赖
        blocks:
          - type: paragraph
            body: >-
              领导层延续性是公司概览中较明确的事实之一。Hermeus 于 2018 年由 AJ Piplica、Glenn Case、Skyler Shuford 和 Michael Smayda
              创立；当前公开领导层页面显示，公司已搭建覆盖财务、法务、业务发展、人力和工程的更完整              管理班子。最重要的变化是 2026 年 6 月 CEO 交接：Zach Shore
              在此前负责增长和政府事务后出任最高运营负责人，Piplica 转任 Executive Chairman，仍明显参与资本战略和董事会领导。这扩大了运营领导层，但没有消除创始人在公司叙事和融资故事中的影响。
            claimRefs:
