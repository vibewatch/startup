  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资能力是积极因素，但里程碑、可比性、结构和流动性方面的缺口，最终导向“继续研究”。
    data:
      nodes:
        - id: financing
          label: 融资能力
          value: $350M Series C financing
        - id: execution
          label: 硬件计划
          value: Mk 2.2 supersonic and Mk 2.3 Mach 3
        - id: technical-risk
          label: 剩余证明
          value: Materials, structures, schedule, and flight milestones
        - id: comparability
          label: 薄弱的估值桥接
          value: Wide, unlike comp set and no public revenue base
        - id: structure
          label: 资本结构不透明
          value: Debt, preferences, warrants, and dilution not fully disclosed
        - id: decision
          label: 决策
          value: Research-more until proof or price improves
      edges:
        - from: financing
          to: execution
          relationship: 提供资金
        - from: execution
          to: technical-risk
          relationship: 必须清除
        - from: technical-risk
          to: comparability
          relationship: 限制
        - from: comparability
          to: structure
          relationship: 叠加
        - from: structure
          to: decision
          relationship: 支持
    approximationNotes: 这是定性的决策链，不分配概率，也不推导数值公允价值。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV009
      - CV011
      - CV015
      - CV016
