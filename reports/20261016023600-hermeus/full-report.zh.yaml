            title: 买方仍可拆分技术栈并推迟承诺
            body: 由于自主层可以拆分、替代方案已在服役，且公开采购尚未进入可见的正式项目，Hermeus 仍需证明其机体足够重要，能让五角大楼在相邻进入者或现有厂商吸收预算前作出承诺。
