        title: 成本结构偏硬件，且对利润率敏感
        blocks:
          - type: paragraph
            body: >-
              Hermeus 正在执行资本密集型模式：飞机、推进、飞行测试和制造能力并行建设。公司及合作伙伴生态强调垂直整合、增材制造、发动机工作和多个测试场地；
              这些做法支持速度，却意味着成本基础更接近航空航天开发，而不是轻资产软件。独立报道还显示，公司把快速迭代和原型周转作为核心运营方法，这在战略上有价值，
              但会加重对利用率、采购和测试准入的要求。由于没有公开毛利率、贡献利润率或现金转化数据，投资者能看到成本驱动因素和运营目标，却无法判断飞行里程碑能否转化为有吸引力的单位经济性。
