        title: 展示项
        blocks:
          - type: callout
            title: 投资判断障碍
            body: 主要障碍不是缺少技术证明，而是缺少公开会计数据。投资者能看到合同、融资和里程碑进展，却看不到已确认收入、毛利率、烧钱速度或非受限现金。
            calloutType: risk
