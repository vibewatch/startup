        title: 展示项
        blocks:
          - type: callout
            title: 可由跑道复用的高马赫数定位才是真正的产品差异
            body: 最有证据支持的区分点不是抽象的“高超音速”，而是 Hermeus 试图把高马赫数性能、跑道运营、载荷释放测试和涡轮机路线结合起来，使其更像飞机项目，而不是一次性消耗型测试。
            calloutType: strength
            claimRefs:
