      - number: '2.4'
        title: 紧迫性和迭代有助于采用，但采购证据仍薄弱
        blocks:
          - type: paragraph
            body: >-
              采用逻辑建立在两个真实驱动因素上：五角大楼对高速能力的紧迫需求，以及 Hermeus 快速迭代硬件的能力。多份保留来源都将产品与对抗环境下的
              响应时间、载荷释放试验，以及扩大高超音速推进和飞机制造国防工业基础的行动联系起来。同一批证据也揭示了影响估值的限制：公开证明仍集中于试飞、
              原型合同和支撑性制造系统，而不是已披露的正式项目、运营级单价或航空公司需求。FAA 已授权但规模仍有限的超音速飞行、资本密集度和缺失的航线经济性证据，
              意味着从成功演示到可重复采购的时间仍是关键尽调缺口，而不是已确定的采用曲线。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
