            body: >-
              Hermeus 已不再像早期种子期硬件初创公司那样融资，但公开融资记录仍主要来自公司友好型或二级市场              渠道，而非申报文件。当前最有力的外部报道称，公司于 2026 年中完成 $350
              million Series C，累计融资额达到 $500 million，估值超过 $1 billion，并加入 $150 million 债务。较早的公开材料显示，2022
              年融资基础小得多，这与后续增长方向一致，却仍未揭开 当前股权结构表、优先股堆叠和债务条款。Air Force 和 DIU 的政府关系与风投支持者同样重要，因为它们是当前记录中最清晰的公开需求信号。
