              - CV009
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: 论点、反论点与里程碑转化
        blocks:
          - type: paragraph
            body: >-
              论点是新资本为一项具体硬件计划提供资金：Hermeus 表示将推动 Quarterhorse Mk 2.2 实现超音速飞行，建造用于 Mach 3 的 Mk 2.3，在 El Segundo 扩大原型开发，并为
              Atlanta 的生产做准备。供应商发布的记录还证明，公司购买了两台 Velo3D 打印机，用于垂直整合的发动机和飞机零件。反论点是，原型节奏尚未建立可扩展的项目经济性。Breaking Defense 于
              2024 年报道，五角大楼尚未公开确定高超音速飞机正式项目，较早的飞行目标被重新表述，并引用国防部官员说明材料和结构工作仍未解决。融资延长了学习跑道，但本身不能证明采购转化、生产良率或可投资的利润率画像。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.3'
        title: 情景、可比公司与估值边界
        blocks:
          - type: paragraph
            body: >-
              情景估值应被视为入场纪律区间，而不是内在价值估计。$800 million 下限只是 UpMarket 报告的 $200 million 股权部分和 $1 billion 投后估值所隐含的简单投前算术。
              Multiples 为 2022 年 3 月 Series B 和 2026 年 4 月 Series C 都报告 $1 billion 估值；尽管资本和执行增加，该数据库没有显示标题层面的上调。
              其选取的航空航天和国防可比公司最近财年 EV/收入约为 4.3x 至 51.5x，但集合混合了不同的上市和              私营企业，且没有 Hermeus 收入。UpMarket 的 $1.18
              billion 模型估值同样不是交易价格，并明确说明可能不同于实际交易。在运营指标和采购转化可见前，溢价没有依据。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV016
      - number: '8.4'
        title: 退出准备、尽调问题与论点破坏触发点
        blocks:
          - type: paragraph
            body: >-
              指定证据不足以支持目标回报或固定持有期。UpMarket 称 IPO 前股份缺乏流动性且具投机性，退出不可预测，建议按多年持有规划。EquityZen 将
              IPO、收购或符合条件的二级出售描述为可能的机制，但其挂牌是进入渠道，不是当前流动性或成交价证据。2025 年的一份第三方概览还称，截至当时 Hermeus 尚未公布 IPO 时间表。
              投资前应取得月度财务、已获资金支持的订单簿、里程碑付款计划、完整股权结构表、债务文件、优先权条款和近期二级市场报价。论点破坏触发点包括错过超音速或 Mach 3 里程碑、
              未能将测试转化为有资金支持的后续需求、债权优先级过高的融资结构，或现金需求迫使公司平价或折价融资。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议：继续研究
            body: 仅凭公开证据，不应按高于 $1 billion 融资估值的价格做投资判断。只有在资本结构条款、运营指标和有资金支持的项目转化得到核实，或入场价格下降到足以补偿这些未解风险后，才应重新评估结论。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV011
              - CV016
