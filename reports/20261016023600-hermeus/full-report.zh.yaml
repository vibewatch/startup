      - number: '3.2'
        title: Hermeus 的差异化在机体和推进，而非覆盖整个技术栈
        blocks:
          - type: paragraph
            body: >-
              指定证据中，Hermeus 最强的差异化是跑道起飞运营、可复用高马赫数目标，以及区别于纯火箭或氢能架构的涡轮机路线。公司的 2026 年融资和扩大的 DIU
              上限都强化了这一点，目标是从原型试飞推进到可携带载荷的军用应用。但同一批证据也缩小了护城河：Hermeus 明确不打算拥有自主层，合作伙伴发布的制造材料
              强调垂直整合和降低供应商依赖，而不是封闭生态。即使软件、载荷和部分任务系统价值由其他方获得，机体本身对买方仍可能有吸引力。
