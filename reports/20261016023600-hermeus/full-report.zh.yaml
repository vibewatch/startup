  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局涵盖直接同业、相邻进入者和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              指定来源指向的是分散的竞争集合，而不是单一的正面市场。直接高速同业包括 Venus Aerospace、Destinus 等瞄准相近速度区间的初创公司；更广义的商业高速同业 包括 Boom
              Supersonic，以及较早的 Aerion、Exosonic 和 Spike Aerospace。相邻进入者很重要，因为买方无需等待 Hermeus 完成完整 Darkhorse 路线，
              就能用其他方案解决同一任务的一部分：Breaking Defense 将 Hermeus 与 Anduril 的高亚音速平台、Stratolaunch 的可回收高超音速飞行器并列；Air & Space
              Forces 则显示，DIU 的 HyCAT 生态已包含 Rocket Lab 和 Hypersonix，提供另一条高速测试平台路线。最可信的替代方案仍是已部署的亚音速系统和五角大楼现有
              打击、测试项目，因为它们今天就可用，尽管无法填平同样的速度差距。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
