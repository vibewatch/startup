        title: 身份、使命与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Hermeus 将自己定位为一家私人持有的国防航空公司，靠快速迭代原型开发高马赫数飞机；当前由 Quarterhorse 负责验证，Darkhorse/Halcyon
              则代表更长期的产品方向。这一定位在保留的来源中基本一致，但运营足迹的记录              并不统一。公司官方材料强调团队分布在 Los Angeles、Atlanta、Jacksonville 和
              Washington, D.C.；第三方材料仍将 Hermeus 描述为总部位于 Atlanta，或把 California 的 El Segundo 列为总部。后续章节应采用的可复用事实，是其商业模式和多城市
              运营足迹，而不是某一个尚未完全核实的总部地点。
