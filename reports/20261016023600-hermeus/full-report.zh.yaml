      - number: '4.3'
        title: 新资本缓解短期压力，但融资依赖仍高
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月融资显著改善了 Hermeus 的资产负债表，但没有消除融资风险。独立来源称，Series C 以 $1 billion 估值融资 $350 million，其中 $150 million
              为债务；这轮融资让现金跑道部分依靠需要偿付或再融资的工具延长，而不是完全靠永久性股权。问题在于，Hermeus 仍需跨过多个困难的进度关口：更多 Quarterhorse 飞行、高马赫数载荷释放演示、达到
              Pratt 标准的发动机认证，以及最终从原型证据转向持久的国防采购路径。公司有执行证明，但下一轮融资触发点似乎 仍取决于里程碑转化，而非已经可见的运营现金流。
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI013
              - CI014
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Hermeus 是一家潜力很高、但仍难以进行投资判断的国防硬件公司。与许多风投支持的航空航天同业相比，公司有更强的外部融资和客户意向信号，
              公开记录也支持真实的近期国防收入路径。然而，决定投资判断的指标仍属非公开：已确认收入、里程碑付款时间、毛利率、烧钱速度、非受限现金、现金跑道和债务契约负担。
              因此，当前证据足以说明收入模式合理、资本需求重大，却不足以说明公司已从技术进展跨入风险已显著降低的财务复利阶段。正确做法是围绕现金转化和融资触发条件做             
              尽调，而不是把产品里程碑外推成成熟经济性。
            claimRefs:
              - CI008
              - CI010
              - CI012
              - CI014
