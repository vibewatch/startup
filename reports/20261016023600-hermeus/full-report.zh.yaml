      - number: '2.3'
        title: 公开规模估算仅限于项目和吞吐量代理指标
        blocks:
          - type: paragraph
            body: >-
              没有保留来源发布可自洽的 Hermeus TAM、SAM 或 SOM，因此规模估算必须局限于公开需求和产能代理指标，包括 DIU 到 2027 年的 $219 million 上限、早期 Air Force 和
              AFWERX 奖项、Hermeus 自身的融资规模，以及管理层对现有工厂产能的表述。这些指标共同说明，公共资金已流向高速              测试能力，Hermeus
              也已筹得足以建设供给的资本；但它们不能证明 Darkhorse 最终采购市场有多大，也不能证明 Halcyon 能通过商业认证并满足航空公司             
              经济性。更准确的解读是：实验活动确有预算支持的真实需求，但公开证据尚未划出可持续运营市场的规模。
