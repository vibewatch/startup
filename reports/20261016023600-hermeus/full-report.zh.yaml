  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 国防测试能力是已有证据支持的切入口
        blocks:
          - type: paragraph
            body: >-
              保留的来源不足以支撑泛化的“高超音速市场”叙事；它们支持的是更窄的边界：高速国防测试、可复用军用无人机，以及相邻的政府机动应用。 Defense News 称，最新融资旨在推动 Hermeus
              从原型测试进入任务就绪平台的开发与生产；Breaking Defense 则称，公司最终希望拥有两条 量产飞机线：面向国防的 Darkhorse 和面向商业客运的
              Halcyon。因此，计入范围的是国防飞行测试能力、军用无人机以及相关推进和制造              能力；不计入导弹、广义民航需求和一般亚音速 UAV
              项目。商业客运相邻机会关系到长期上行空间，但当前证据对国家安全需求的支持远强于对航空公司采购的支持。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
