  - id: TP002
    title: 特性 / 能力矩阵
    columns:
      - 采购标准
      - Hermeus
      - 其他高速初创公司类别
      - 现有企业或替代方案类别
      - 含义
    rows:
      - - 速度主张
        - 目标是高马赫、最终达到高超声速的作战
        - Venus / Destinus 追求相近速度区间；Hypersonix 测试平台支持高速试验
        - RQ-4 和 MQ-9 被明确描述为亚声速替代方案
        - Hermeus 的价值主张在速度而非单纯无人持航是决定性要求的场景中最强
      - - 跑道起降与回收
        - 指定来源强调基于涡轮的跑道起飞和可重复使用的运行方式
        - TAMradar 将 Hermeus 与火箭或氢推进同类公司作对比；HyCAT 替代方案被披露为测试平台，而非可重复使用的跑道飞行器
        - 现有企业已经能够使用已知的军事基础设施
        - Hermeus 的优势不只是速度，还在于采用更常规的发射和回收假设实现速度
      - - 自主系统所有权
        - Hermeus 表示不构建自主系统，并希望与政府选择的任何系统栈互操作
        - 邻近供应商可以专注于软件或任务自主能力
        - 现有企业已经具备成熟的控制和任务系统路径
        - 自主能力仍是可分拆的采购标准，而非 Hermeus 控制的护城河
      - - 载荷 / 打击路径
        - 2026 年 DIU 范围明确增加高速载荷释放测试
        - 指定来源未显示同类公司有如此具体的载荷释放里程碑
        - 现有系统已经可以搭载任务载荷，即使无法以高马赫速度运行
        - Hermeus 拥有比多数同类初创公司更清晰的公开、临近打击的路线图，但尚未实现部署
      - - 制造和供应商控制
        - 合作伙伴发布的材料称，增材制造支持垂直整合并减少外部依赖
        - 指定来源未提供同类初创公司的可比制造细节披露
        - 现有企业受益于成熟的国防供应链
        - Hermeus 的执行优势取决于垂直整合能否胜过现有企业的规模优势
      - - 采购成熟度
        - 尚无公开正式项目；当前路径仍被描述为未来采购的输入
        - 该来源池中的同类公司证据也大多处于正式项目之前或试验阶段
        - 替代方案已经被采购并投入运行
        - 该类别的胜负仍取决于采购时机，而不仅是原始飞行性能
    notes: 本矩阵将指定来源证据转化为可比较的采购标准；未获支持的竞争者细节只保留到类别，不为单个公司臆测。
