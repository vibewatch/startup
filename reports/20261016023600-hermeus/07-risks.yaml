callouts:
  - calloutType: risk
    title: "Thesis-break trigger"
    body: >-
      The cleanest kill criterion is a schedule slip in supersonic / high-Mach payload-release proof
      without parallel evidence of a funded program transition, because that would turn debt-backed
      scale capital into financing for an open-ended experiment.
    claimRefs: [CR004, CR013, CR016]
  - calloutType: insight
    title: "What the mitigations really solve"
    body: >-
      Hermeus's prototype cadence, HEAT facility, and government-backed test campaign are real
      mitigants for early engineering risk, but they do much less to solve customer concentration,
      acquisition sponsorship, or long-duration capital intensity.
    claimRefs: [CR009, CR010, CR011, CR015]
