chapter:
  number: 7
  title: Risks
  summary: >-
    Hermeus's highest-risk bottleneck is still the transition from impressive prototype cadence to a
    repeatable high-Mach weaponizable system that a defense buyer can acquisitionize. The evidence in
    the assigned pool shows real progress—fresh capital, authorized flights, and a DIU-backed test
    campaign—but it also shows concentrated customer exposure, debt-backed scaling, and unresolved
    manufacturing, range-access, and certification dependencies.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      The core Hermeus risk is not whether the company can keep attracting attention; it is whether
      the current capital and flight-test window is long enough to convert prototype momentum into a
      validated high-Mach product path. Hermeus has fresh financing, a larger DIU ceiling, and
      multiple successful prototype flights, but the evidence still points to four severe residual
      exposures: proving the turbojet-to-ramjet / payload-release path on schedule, converting DIU
      demonstrations into a real acquisition path, scaling manufacturing beyond experimental cadence,
      and managing capital intensity after adding debt to the 2026 raise. The strongest mitigations
      are iterative prototype development, a government-funded test campaign, and new facilities, but
      those mitigations reduce early engineering uncertainty more than they reduce customer
      concentration or program-transition risk.
    claimRefs: [CR004, CR009, CR011, CR013, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-and-acquisition-path
    title: Regulatory and acquisition path
    body: >-
      Public evidence shows that the regulatory path is active but only partially disclosed. Third-party
      coverage and newsletter reporting point to prototype airworthiness and FAA flight authorization,
      while the DIU announcement sets a 2026-2027 demonstration window for high-Mach flight and
      payload release. What the pool does not provide is the harder closing evidence an investor would
      want: the exact flight-authorization scope, renewal conditions, export-control stack, or a
      named follow-on program of record. That makes the legal / regulatory risk less about a known
      enforcement event and more about approval opacity and dependency on government transition
      decisions that sit outside Hermeus's direct control.
    claimRefs: [CR004, CR005, CR006, CR012, CR013]
    tableRefs: [TR001]
  - id: operational-and-dependency-risk
    title: Operational and dependency risk
    body: >-
      The operational risk register is dominated by execution at the edge of the flight envelope and by
      external dependencies that could slow learning. Independent sources still describe the
      turbojet-to-ramjet transition, thermal management, and sustained high-speed operation as the
      hardest technical hurdles, and the current evidence base only shows progress toward those
      milestones rather than closure. Separately, Breaking Defense's manufacturing-capacity comment,
      Sacra's capital-intensity warning, and The Merge's range-access concern all imply that Hermeus
      can keep moving quickly only if suppliers, facilities, and external test infrastructure stay in
      sync. Because the same U.S. defense ecosystem funds, tests, and potentially buys the product,
      operational slippage and customer concentration amplify each other.
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR014, CR015]
    tableRefs: [TR002, TR003]
  - id: kill-criteria-and-diligence
    title: Kill criteria and diligence
    body: >-
      The monitorable thesis-break is straightforward: if Hermeus cannot turn the funded 2026-2027
      campaign into repeatable supersonic / high-Mach payload-release evidence and a visible sponsor
      path to procurement, the current financing round starts to look like bridge capital for
      experimentation rather than scale capital for a durable program. The next diligence pass should
      therefore prioritize items the public record still leaves blank: milestone-linked DIU payments,
      debt covenants and liquidity headroom, range-booking resilience, qualified supplier depth around
      engines and thermal hardware, and the exact FAA / export-control approvals needed for the next
      campaign stages. If those items are strong, the technical risk is still high but financeable; if
      they are weak, the acquisition and capital risks quickly become thesis-breaking.
    claimRefs: [CR004, CR009, CR013, CR016]
