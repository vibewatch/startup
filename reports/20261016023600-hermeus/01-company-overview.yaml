    title: Company milestone timeline
    type: timeline
    summary: "Hermeus's public record shows fast milestone cadence, but the path still centers on prototype proof rather than fully disclosed production scale."
    data:
      items:
        - year: 2018
          label: Hermeus is founded
          detail: "Company and third-party profiles identify AJ Piplica, Glenn Case, Skyler Shuford, and Michael Smayda as the founding team."
          tone: neutral
          claimRefs: [CO001]
        - year: 2021
          label: Air Force backs Quarterhorse testing
          detail: "Public reporting says the Air Force awarded a three-year, $60 million jointly funded contract to build and test Quarterhorse aircraft and propulsion."
          tone: positive
          claimRefs: [CO011]
        - year: 2022
          label: Capital base and industrial ecosystem broaden
          detail: "A 2022 industry article described more than $130 million of funding, plus RTX/NASA/government support and manufacturing build-out."
          tone: positive
          claimRefs: [CO010]
        - year: 2024
          label: Quarterhorse Mk 1 is unveiled publicly
          detail: "Breaking Defense described the uncrewed Mk 1 rollout as the bridge toward later Quarterhorse variants and the longer Darkhorse roadmap."
          tone: neutral
          claimRefs: [CO004, CO014]
        - year: 2025
          label: First aircraft flight establishes proof of life
          detail: "Company materials say Hermeus flew its first aircraft in 2025, starting the 364-day march to later supersonic flight."
          tone: positive
          claimRefs: [CO013]
        - period: "May 2026"
          label: Series C reportedly closes
          detail: "The Merge reported a $350 million Series C, $500 million total capital raised, a valuation above $1 billion, and $150 million of debt."
          tone: positive
          claimRefs: [CO009]
        - date: 2026-05-26
          label: Quarterhorse Mk 2.1 reaches Mach 1.21
          detail: "Hermeus said the aircraft went supersonic on its third test flight, less than three months after first flight."
          tone: positive
          claimRefs: [CO013]
        - period: "Late May 2026"
          label: DIU ceiling expands to $219 million
          detail: "The Merge said the DIU ceiling expansion made defense-testing demand a central part of the near-term case through 2027."
          tone: positive
          claimRefs: [CO012]
        - date: 2026-06-01
          label: Zach Shore becomes CEO
          detail: "The leadership transition moved AJ Piplica to Executive Chairman while keeping him close to capital strategy and board leadership."
          tone: neutral
          claimRefs: [CO007, CO008]
    approximationNotes: "Where retained source text did not surface an exact day, the timeline preserves the supported year or period rather than inventing a date."
    claimRefs: [CO001, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
callouts:
