company:
  name: Hermeus
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Hermeus has moved beyond concept-stage storytelling into visible technical
    and defense-customer proof points, most notably a May 2026 supersonic
    Quarterhorse flight and an expanded DIU contract ceiling. The same public
    record still leaves major diligence basics unresolved, including current
    headquarters, revenue, headcount, customer count, and detailed capital
    structure.
sections:
  - id: identity-and-footprint
    title: Identity, mission, and operating footprint
    body: >-
      Hermeus presents itself as a privately held defense aviation company using
      rapid iterative prototyping to build high-Mach aircraft, with Quarterhorse
      serving as the current proving path and Darkhorse/Halcyon as the longer
      product horizon. That identity is consistent across the retained source
      set. The operating-footprint record is less clean. Official company copy
      emphasizes a distributed team across Los Angeles, Atlanta, Jacksonville,
      and Washington, D.C., while third-party materials still describe Hermeus
      as Atlanta-based or list El Segundo, California as headquarters. For later
      chapters, the reusable ground truth is the business model and multi-city
      operating footprint, not a single fully verified headquarters location.
    claimRefs: [CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance dependence
    body: >-
      Leadership continuity is one of the clearer company-overview facts.
      Hermeus was founded in 2018 by AJ Piplica, Glenn Case, Skyler Shuford,
      and Michael Smayda, and the current public leadership page shows a more
      scaled executive bench spanning finance, legal, business development,
      people, and engineering. The most material change is the June 2026 CEO
      transition: Zach Shore moved into the top operating role after earlier
      growth and government-facing roles, while Piplica shifted to Executive
      Chairman and remained visibly tied to capital strategy and board
      leadership. That broadens operating leadership, but it does not remove
      founder influence from the company narrative or financing story.
    claimRefs: [CO001, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital base, government anchors, and stakeholder map
    body: >-
      Hermeus is no longer financed like an early seed-stage hardware startup,
      but the public funding record is still mostly conveyed through company-
      friendly or secondary-market surfaces rather than filings. The strongest
      current external report says Hermeus closed a $350 million Series C in
      mid-2026, took total capital raised to $500 million, crossed a $1 billion
      valuation, and layered in $150 million of debt. Older public materials
      pointed to a much smaller funding base in 2022, which is directionally
      consistent with later growth but still leaves the current cap table,
      preference stack, and debt terms opaque. Government relationships with the
      Air Force and DIU matter as much as venture backers because they are the
      clearest public demand signals in the current record.
    claimRefs: [CO009, CO010, CO011, CO012, CO015]
    tableRefs: [TO003]
  - id: milestones-and-open-questions
    title: Milestones, stage of proof, and unresolved scale questions
    body: >-
      Hermeus now has more than a slide-deck story: the May 2026 supersonic
      Quarterhorse milestone and the enlarged DIU ceiling give the company real
      evidence of technical progress and government interest. Even so, the
      retained 2024-2026 sources still describe an iterative test campaign, not
      an already disclosed production program or commercial revenue engine. The
      same source set that supports momentum also leaves major diligence holes
      around revenue, customer count, headcount, board control, debt covenants,
      and the timing of any shift from prototype cadence to procurement-scale
      fielding. For later chapters, Hermeus should be treated as technically
      progressing but still economically and organizationally only partially
      transparent.
    claimRefs: [CO013, CO014, CO016]
    figureRefs: [FO001]
