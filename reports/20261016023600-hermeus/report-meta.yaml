summary:
  headline: >-
    Hermeus has real proof of life—Mach 1.21 flight, a $219 million DIU-backed defense pathway, and a blue-chip investor
    set—but it is still pre-production, economically opaque, and dependent on difficult Mach 3 / payload-release and
    procurement-transition milestones, so the prudent stance is research-more rather than buy.
