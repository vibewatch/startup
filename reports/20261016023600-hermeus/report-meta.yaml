companyProfile:
  summary: >-
    Hermeus is a privately held aerospace and defense company developing high-Mach, hypersonic aircraft and propulsion
    systems through an iterative prototype program anchored by Quarterhorse today and a longer-horizon Darkhorse
    roadmap. The company has public proof points in flight testing, strategic government relationships, and a reported
    $350 million Series C, but it remains economically opaque because revenue, burn, runway, and cap-table details are
    not publicly disclosed.
