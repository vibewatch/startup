  topStrengths:
    - Real technical proof points and defense-demand anchors exist.
    - Fresh capital and a reported $1 billion valuation provide runway.
    - Blue-chip investors and strategic defense ecosystem support credibility.
  topRisks:
    - Public financials remain opaque.
    - Prototype-to-procurement transition is still unproven.
    - Debt/equity structure, milestones, and liquidity remain uncertain.
  unresolvedGaps:
