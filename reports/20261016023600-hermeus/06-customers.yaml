callouts:
  - calloutType: "insight"
    title: "Customer proof exists, but it is sponsor-led"
    body: >-
      Hermeus is not a zero-customer story: the Air Force, DIU, and now the Navy are clearly
      engaged. The limitation is that those relationships are still best described as funded test
      and transition programs rather than recurring production deployment.
    claimRefs: ["CU001", "CU002", "CU003", "CU005"]
  - calloutType: "risk"
    title: "Durability is still opaque"
    body: >-
      Without disclosed renewal, backlog, or concentration metrics, it is hard to tell whether
      Hermeus is building a durable customer franchise or a narrow set of milestone-driven defense
      programs whose continuation depends on future procurement wins.
    claimRefs: ["CU010", "CU011", "CU012"]
