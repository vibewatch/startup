chapter:
  number: 6
  title: "Customers"
  summary: >-
    Hermeus has real named-customer proof, but it is almost entirely concentrated in U.S.
    defense stakeholders rather than commercial operators. The strongest public evidence is
    the $219 million DIU ceiling, the earlier Air Force contract base, and a recent Mach 1.21
    flight milestone; what remains missing are renewal, concentration, and commercial-demand
    metrics that would show durable customer expansion beyond sponsored test programs.
sections:
  - id: "defense-customer-base"
    title: "Public customer proof is government-centered"
    body: >-
      The public record supports a narrow but concrete customer base. Hermeus is clearly selling
      into a U.S. defense demand chain in which the Air Force, DIU, and now the Navy fund or
      shape flight-test work, while commercial aviation remains a roadmap narrative rather than a
      signed customer set. That matters because the company does not yet need broad market
      adoption to prove relevance; it needs a small number of defense stakeholders to keep
      expanding test and transition budgets. The segmentation therefore looks less like a classic
      diversified customer funnel and more like a sponsor-led progression from study work to
      experimentation to possible procurement.
    claimRefs: ["CU001", "CU002", "CU006", "CU007", "CU014"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-trajectory"
    title: "Adoption proof is milestone-driven, not fleet-driven"
    body: >-
      The adoption evidence that is visible publicly is operational momentum around prototype
      flights and contract growth, not recurring deployment statistics. Hermeus can point to the
      DIU ceiling increase, the Mach 1.21 Quarterhorse milestone, and FAA-approved supersonic
      sorties as proof that customers are still leaning in. But those signals should be read as
      validation demand from government sponsors, not as evidence of scaled fielding. Even the
      strongest named-customer records still emphasize payload-release demonstrations, risk
      reduction, and future acquisition decisions, which keeps the customer story in the
      experimentation phase.
    claimRefs: ["CU002", "CU003", "CU004", "CU005", "CU013"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-and-concentration"
    title: "Durability and concentration remain under-disclosed"
    body: >-
      The main diligence weakness is not whether any customer exists, but whether the current
      customer base is durable and scalable. Public sources do not disclose NRR, GRR, churn,
      renewal timing, backlog conversion, or top-customer exposure, so it is impossible to tell
      how dependent Hermeus is on one or two defense programs. Independent commentary also
      suggests that scale-up still hinges on a government demand signal and a program-of-record
      transition that has not yet been won. Until those disclosures improve, commercial expansion
      and broad customer diversification should be treated as aspirational rather than evidenced.
      That keeps customer concentration, renewal quality, and account expansion as live diligence
      risks rather than closed underwriting questions.
    claimRefs: ["CU008", "CU009", "CU010", "CU011", "CU012", "CU014"]
