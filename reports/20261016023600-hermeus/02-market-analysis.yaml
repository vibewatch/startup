    notes: >-
      Retained sources do not publish a true TAM, SAM, or SOM, so this table uses
      disclosed contracts, financing, and throughput as constrained sizing lenses;
      null CAGR means not disclosed in the source set.
    claimRefs: [CM002, CM003, CM008, CM009, CM010, CM013]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - High-speed defense test capacity
        - DIU and service R&D offices
        - Test teams, mission-system developers, and range operators
        - Defense RDT&E budgets
        - Flight-test campaigns that generate telemetry, thermal, and payload-release data
        - Program managers for experimentation and test infrastructure
        - Demonstrated cadence and useful data collection
      - - Operational unmanned high-speed aircraft
        - Pentagon acquisition programs
        - Military operators in contested environments
        - Service procurement budgets
        - Transition from prototype to mission-ready aircraft with payload integration
        - Acquisition executives and program offices
        - A clear program of record and validated mission economics
      - - Executive airlift / mobility / ISR
        - Air Force mission sponsors
        - Senior leaders, logistics planners, and ISR users
        - Air Force mission budgets
        - Specialized transport or surveillance missions requiring faster response times
        - Executive airlift and mobility stakeholders
        - Safety, range, and mission-concept validation
      - - Commercial passenger hypersonic travel
        - Airlines and future launch-route partners
        - Premium long-haul travelers
        - Airline fleet-capex budgets plus passenger yield
        - Certified route deployment on long-haul premium corridors
        - Airline fleet planners and network executives
        - Certification, route economics, and launch-customer commitments
    notes: >-
      Buyer map follows the current evidence hierarchy: government program offices are
      evidenced, while commercial airline budgets remain hypothetical.
    claimRefs: [CM008, CM009, CM010, CM012, CM014, CM016]
figures:
