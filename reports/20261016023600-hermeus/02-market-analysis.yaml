        - label: Prior Air Force support
          displayValue: $60M follow-on + $1.5M study
          detail: Awards tied to executive airlift, mobility, ISR, and test capacity
          valueNote: Demonstrates buyer interest, not procurement scale
          claimRefs: [CM008]
        - label: Supply buildout capital
          displayValue: $350M Series C at $1B post-money
          detail: Financing package used to scale manufacturing and multiple aircraft lines
          valueNote: Capital raised is not customer demand
          claimRefs: [CM002, CM003]
        - label: Current throughput proxy
          displayValue: "\"A dozen or so\" Mk 2 drones/year"
          detail: Current-facility manufacturing rate if demand materializes
          valueNote: Capacity is conditional and not an orderbook
          claimRefs: [CM010]
        - label: Validated performance wedge
          displayValue: Mach 1.21 on the third Mk 2.1 flight
          detail: Demonstrated capability that can unlock follow-on defense interest
          valueNote: Performance proof, not a spend estimate
          claimRefs: [CM004, CM005]
        - label: Long-dated commercial adjacency
          displayValue: Halcyon passenger-aircraft vision
          detail: Passenger upside is discussed publicly but lacks pricing, routes, and orders
          valueNote: Strategic adjacency only
          claimRefs: [CM006, CM014]
    approximationNotes: >-
      Assigned evidence did not include an audited market report, so the figure stacks
      disclosed contracts, financing, throughput, and roadmap layers instead of
      inventing a false TAM / SAM / SOM.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM008, CM009, CM010, CM014]
callouts:
  - calloutType: strength
    title: Defense urgency is real
    body: >-
      The public evidence already includes DIU and Air Force money, explicit payload-release
      requirements, and mission categories like mobility and ISR, which is enough to
      prove that Hermeus is selling into a real defense problem rather than only into
      a concept slide.
    claimRefs: [CM008, CM009, CM012]
  - calloutType: risk
    title: Valuation runs ahead of clean market proof
    body: >-
      The retained pool never reaches a defensible TAM, disclosed program of record,
      commercial orderbook, or unit economics, so the market narrative is still being
      carried by prototype progress and proxy metrics more than by durable adoption proof.
    claimRefs: [CM010, CM013, CM014, CM016]
