    title: Evidence-constrained demand stack
    type: pyramid
    summary: >-
      Because the assigned pool lacks an audited TAM/SAM/SOM, the stack orders the
      public demand and adoption proxies from nearest budget proof to broadest
      adjacency.
    data:
      items:
        - label: Disclosed contract base
          displayValue: $219M DIU ceiling through 2027
          detail: Public ceiling for high-speed test and payload-release work
          valueNote: Demand proxy rather than total market size
