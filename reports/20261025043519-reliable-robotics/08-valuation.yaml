callouts:
  - calloutType: "recommendation"
    title: "Price discipline is the gating issue"
    body: >-
      The company may be strategically attractive, but the >$1B private mark cannot be tested against
      revenue, burn, runway, or preference data in the retained evidence. Treat certification progress
      as a milestone to diligence, not as a substitute for valuation support.
    claimRefs: [CV003, CV005, CV009, CV015, CV016]
