    claimRefs: [CV001, CV003, CV005, CV006, CV009, CV015, CV016]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Lens", "Evidence-backed argument", "What would change the view"]
    rows:
      - ["Thesis", "A $115M financing extension provides additional capital for certification work", "Evidence that debt covenants or preferences materially constrain runway"]
      - ["Thesis", "The FAA formally approved the project-specific certification plan for continuous autopilot engagement", "Material revision of the certification basis or repeated evidence rejection"]
      - ["Thesis", "Supervised flights in complex airspace add operating evidence under a federal pilot program", "Safety, reliability, or integration data that fail FAA expectations"]
      - ["Thesis", "Air Force programs provide a second pathway for technical validation and funded work", "Programs remain demonstrations without repeatable contract economics"]
      - ["Anti-thesis", "Commercial autonomous cargo certification remained incomplete in a 2026 industry assessment", "Final certification and paid deployment on recurring routes"]
      - ["Anti-thesis", "The >$1B mark lacks public revenue, margin, burn, and runway support in the retained evidence", "Audited economics and contracted backlog that support an explicit valuation method"]
    notes: "The Air Force and pilot-program evidence demonstrates engagement and testing, not civil certification or recurring commercial revenue."
    claimRefs: [CV001, CV005, CV006, CV009, CV010, CV012, CV015]
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns: ["Case", "Evidence-based assumptions", "Valuation / return logic", "Probability signal", "Downside trigger"]
    rows:
      - ["Bull", "Continuous-autopilot certification lands near management's stated window; supervised evidence converts into scaled paid deployment", "Value above the current >$1B mark may become supportable after unit economics and repeatability are demonstrated", "FAA evidence acceptance, signed deployments, and disclosed route economics", "Certification or deployment conversion misses"]
      - ["Base", "Certification work advances, but remote operations remain multi-year and economics stay private", "No defensible public range; defer price acceptance and preserve optionality", "Incremental approvals and testing without audited commercial metrics", "Runway becomes shorter than the remaining certification path"]
      - ["Bear", "Certification slips, safety evidence is insufficient, or commercialization lags after substantial capital use", "Down-round or value below the current mark becomes plausible; no precise floor is supportable", "Repeated schedule resets, weak paid backlog, or adverse safety findings", "Need for new capital before a value-inflecting approval"]
    notes: "Scenario values are directional because public evidence does not disclose Reliable Robotics revenue, margins, cash, burn, runway, or preference terms; no numeric probability is assigned."
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV009, CV010, CV015, CV016]
