company:
  name: "Reliable Robotics"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Reliable Robotics has fresh financing and meaningful regulatory progress, but its reported
    valuation above $1 billion is not underwritable from public evidence because current revenue,
    margins, burn, runway, and preference terms remain undisclosed. The evidence supports a
    price-sensitive track/research-more recommendation rather than accepting the latest private mark.
sections:
  - id: "decision-and-price-discipline"
    title: "Decision and price discipline"
    body: >-
      The recommendation is track/research-more, with medium-low confidence and high execution risk.
      Reliable Robotics raised a reported $115 million Series D extension, including $90 million of
      equity and $25 million of debt, while its valuation moved above $1 billion. That financing
      improves the company’s ability to continue a long certification program, but it does not by
      itself validate the price. The retained public evidence does not disclose current revenue,
      gross margin, cash balance, burn, or runway, so neither a revenue multiple nor a financing-to-
      milestone runway can be calculated. Entry should therefore be contingent on private diligence,
      certification evidence, and a term-sheet review rather than on the headline valuation.
    claimRefs: [CV001, CV002, CV003, CV004, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "thesis-and-comparable-context"
    title: "Thesis, anti-thesis, and comparable context"
    body: >-
      The investable thesis is that Reliable is pursuing a staged retrofit strategy on a proven
      airframe, has an FAA-approved certification plan, and is accumulating operating evidence through
      supervised demonstrations and government programs. The anti-thesis is that plan acceptance is
      not product certification: Aviation Week described extensive remaining flight, simulator, and
      hardware validation, while a 2026 industry analysis argued commercial autonomous cargo remained
      three to five years away even under optimistic assumptions. Merlin Labs provides a useful but
      imperfect public reference: its $800 million valuation was accompanied by disclosed 2025
      revenue, a 2026 revenue projection, and a cash-burn forecast. Reliable’s higher private mark
      lacks equivalent public operating metrics, which weakens direct multiple support.
    claimRefs: [CV005, CV006, CV009, CV010, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: "scenario-framework"
    title: "Bull, base, and bear framework"
    body: >-
      Public evidence supports conditional scenarios, not precise valuation ranges or probability
      percentages. In the bull case, timely certification of continuous autopilot engagement, credible
      progress toward remote operations, and conversion of demonstrations into repeatable commercial
      deployments could justify value above the current mark. The base case is a well-funded company
      continuing a multi-year certification effort while economic evidence remains private; the proper
      valuation response is to defer price acceptance. The bear case is certification slippage,
      insufficient safety evidence, or weak commercialization after capital is consumed, producing
      down-round risk. Each scenario should be updated against measurable milestones rather than
      calendar optimism or unsupported market multiples.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV015, CV016]
    tableRefs: [TV003]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness and final diligence"
    body: >-
      Exit readiness cannot be established from the retained evidence. The company is still financing
      through a private Series D extension, the first certification remains prospective, and remote
      operation is described as farther away. Before underwriting an exit multiple, investors should
      obtain audited historical and forecast financials, the post-money capitalization table,
      liquidation preferences, debt covenants, customer contracts, backlog conversion, and the FAA
      evidence schedule. The thesis breaks if certification timing materially slips without a funded
      runway extension, demonstrations do not convert into paid deployments, or fleet safety and
      reliability evidence fails to support scaled operations. A lower entry price could improve
      returns, but it would not resolve those execution dependencies.
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV015, CV016]
