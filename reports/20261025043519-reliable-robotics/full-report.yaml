      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing is being used against a capital-intensive certification and production ramp.
              TechCrunch reports that the October financing included $90 million of equity and $25 million of debt,
              while the April coverage says the $160 million round was intended to gather evidence for FAA certification
              and scale production. The cost base therefore plausibly includes flight-test and compliance work, avionics
              and radar development, aircraft retrofit and manufacturing, airline operations, maintenance, and
              specialized engineering. Public hiring data supports continued investment: Startup Jobs listed 61
              positions in October 2026, including FPGA, flight-software verification, simulation, avionics, radar,
              quality, manufacturing, and system-integration roles. These are operating signals, not a cash-burn
              calculation. The assigned evidence does not disclose gross margin, bill of materials, installation cost,
              maintenance cost, pilot- or remote-operator productivity, customer acquisition cost, payback,
              working-capital terms, or capex. Any scenario that supplies those values would be an estimate and should
              be labeled as such; the current public record supports only a diligence request for them.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The October financing improves the disclosed capital position but does not prove runway. TechCrunch
              reports $115 million of new financing, comprising $90 million equity and $25 million debt, and says the
              Series D totals $275 million and valuation moved above $1 billion; its article also reports $380 million
              raised to date. Other assigned sources report different totals and round descriptions, including
              Multiples’ $384 million across six rounds and HyperSinc’s April account of $300 million total capital
              after a $160 million raise. The conflicting totals likely reflect timing, inclusion of debt, or source
              methodology, so they should not be collapsed into a single precise lifetime-raised figure without company
              confirmation. The financial verdict is therefore mixed: funding access and strategic investors reduce
              near-term financing uncertainty, while certification timing, production scale-up, debt terms, and absent
              operating metrics leave capital adequacy unproven. A next-round trigger cannot be identified from the
              pool; management should provide a current cash balance, monthly cash burn, committed capex, debt covenants
              and maturity, milestone-linked funding plan, and downside runway under certification delay.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is visible; operating conversion is not
            body: >-
              The strongest public financial evidence is financing access and a reported commitment base, while the
              central underwriting variables—revenue, margin, burn, runway, price, and delivery conversion—remain
              unavailable.
            calloutType: insight
            claimRefs:
              - CI003
              - CI009
              - CI012
          - type: callout
            title: Certification delay is a capital-risk multiplier
            body: >-
              The company is funding a long certification and production program with debt included in the latest
              reported financing, but the assigned pool does not disclose cash runway or milestone-linked financing
              needs.
            calloutType: risk
            claimRefs:
              - CI005
              - CI009
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Reliable Robotics sells an autonomy system for cargo and defense aviation rather than a new aircraft
              platform. The operating workflow begins with a proven Cessna 208B Caravan, adds automated control across
              taxi, takeoff, enroute flight, and landing, and places a remote pilot in a ground operation rather than in
              the cockpit. Albuquerque Journal reporting describes a safety pilot remaining aboard during federal
              demonstration flights while a remote pilot more than 700 miles away monitored and commanded the aircraft
              and communicated with air traffic control. The Air Force product description likewise calls the Reliable
              Autonomy System a complete large-UAS integration solution. This is a credible workflow wedge for regional
              cargo and military logistics, but demonstrations are not the same as certified, revenue-generating
              commercial service.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE011
              - CE012
      - number: '5.2'
        title: Architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture is a safety-critical system-of-systems. Public technical reporting identifies an aircraft
              control layer, navigation and autonomy logic, detect-and-avoid sensing and alerting, communications, and a
              remote-operations layer. FAA-contracted tests used ACAS X, hardware-in-the-loop testing, scripted
              encounters, and partner equipment from Sagetech, Collins, and uAvionix. The tests found that ACAS X
              behavior changes between enroute and terminal environments, and that low-altitude protection must cover
              both cooperative and noncooperative traffic. These are meaningful validation surfaces, but they do not
              establish full certification or reliability across the long tail of combined failures. The architecture
              map therefore separates demonstrated components from unresolved operational scale.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Differentiation, dependencies, and diligence
        blocks:
          - type: paragraph
            body: >-
              The differentiation thesis is retrofit leverage: existing type-certified airframes narrow the
              airworthiness problem relative to certifying a novel aircraft, while a reusable system could extend across
              aircraft types. The same strategy creates dependencies. FAA acceptance and operational approval remain
              gating items; remote operations depend on communications and surveillance; and safety cases must address
              degraded weather, traffic, and sensor or link failures. Hiring evidence is consistent with a substantial
              verification and avionics workload: the October 2026 job feed lists FPGA design, flight-software
              verification, simulation, and avionics-harness roles. That is a developer signal about engineering effort,
              not proof of product readiness. The key underwriting question is whether flight-test evidence converts
              into an approved, repeatable operating envelope and economically deployable fleet.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Public sources do not provide a complete reliability dataset for autonomous commercial operations. There
              is no retained evidence here for fleet-level dispatch reliability, failure-rate targets, remote-operator
              workload, cybersecurity controls, maintenance intervals after retrofit, or production throughput.
              Certification plans and test campaigns should therefore be treated as maturity signals, not as substitutes
              for operational safety performance. A diligence process should request the certification basis, test-hour
              and incident ledger, hazard analyses, communications-loss behavior, security assurance artifacts, and a
              deployment plan that distinguishes pilot programs from recurring service.
            claimRefs:
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Retrofit-first wedge
            body: >-
              Using a proven cargo airframe focuses the technical and regulatory effort on autonomy integration rather
              than a clean-sheet aircraft.
            calloutType: strength
            claimRefs:
              - CE001
              - CE010
          - type: callout
            title: Certification is still the product gate
            body: >-
              FAA-oriented tests and standards work are substantive maturity signals, but they do not prove commercial
              approval, reliability, or safe behavior across degraded modes.
            calloutType: risk
            claimRefs:
              - CE006
              - CE009
              - CE014
          - type: callout
            title: Engineering workload is visible, outcomes are not
            body: >-
              The October 2026 hiring feed points to FPGA, simulation, avionics, and flight-software verification work;
              it does not establish completion, staffing scale, or readiness.
            calloutType: insight
            claimRefs:
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyers, users, and payers
        blocks:
          - type: paragraph
            body: >-
              Reliable Robotics is addressing several institutional customer groups rather than a broad self-serve
              market. Regional cargo operators are the clearest commercial buyers, with FedEx cited as a partner for
              short regional cargo hops. Reliable Airlines provides an internal operating channel: TechCrunch reports
              that the subsidiary uses six Cessna Caravans to fly cargo six days a week. Public-sector stakeholders form
              a second segment. The City of Albuquerque and the FAA provide test and integration environments, while the
              U.S. Air Force and AFRL sponsor defense-logistics work. These relationships validate workflow access, but
              they do not establish how many unrelated operators pay for the autonomy system.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption trajectory and operating proof
        blocks:
          - type: paragraph
            body: >-
              The strongest current adoption evidence is operational but pre-commercial for autonomous flight.
              Albuquerque Journal reports a two-day Sunport campaign in which a Caravan performed automated taxiing,
              takeoffs, and landings while a safety pilot remained aboard and a remote pilot supervised from more than
              700 miles away. The same local reporting describes planned pre-certification cargo routes from Albuquerque
              to Santa Fe and Durango. Company-issued program material says Reliable Airlines has conducted conventional
              cargo operations at the Sunport since 2023, giving the company an operating base. None of this
              demonstrates recurring paid autonomous service, completed shipment volume, or fleet utilization.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU008
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU012
              - CU013
              - CU014
      - number: '6.3'
        title: Named proof and order quality
        blocks:
          - type: paragraph
            body: >-
              Named counterparties span commercial, civic, regulatory, and defense channels. FedEx is a historical
              partnership and use-case signal, not a disclosed production deployment. Albuquerque and the FAA are tied
              to supervised testing and planned routes. Air Force evidence is stronger on procurement: reporting
              identifies TACFI and follow-on SBIR work, while another source reports a $17.4 million Air Force contract
              and planned 2026 demonstrations. A-Drones also relays the company's claim that commercial and military
              customers placed more than 200 orders. The claim is potentially material, but the source does not define
              whether those are binding purchases, options, pilots, system units, or aircraft installations.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The expansion mechanism is plausible: establish a certified operating system on the Caravan, build
              evidence through public-sector programs and Reliable Airlines, and then sell additional aircraft
              installations or routes. The timing remains the limiting factor. TechCrunch reports an 18-to-24-month
              expectation for the first pilot-in-aircraft product and at least three years for moving the pilot to a
              ground station. Radio Hangar separately says commercial autonomous approval was incomplete in mid-2026 and
              estimates regular service at three to five years even in an optimistic case. Public evidence does not
              disclose renewals, churn, contract duration, order conversion, top-customer exposure, or the number of
              independently paying operators.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Customer diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Customer traction should therefore be underwritten as program validation rather than proven recurring
              adoption. The next diligence step is to reconcile every announced relationship and order with an executed
              agreement, payer, aircraft, route, delivery milestone, and recognized revenue. Reference calls should
              separate conventional Reliable Airlines cargo operations from autonomous-system use and should test
              dispatch reliability, intervention rates, certification dependencies, and willingness to expand. A cohort
              view covering pilots, paid deployments, renewals, cancellations, and options would show whether the
              apparent breadth of demand survives procurement and certification friction or remains concentrated in a
              few government-backed programs and one anchor commercial relationship.
            claimRefs:
              - CU003
              - CU005
              - CU008
              - CU014
              - CU015
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional workflow access is substantive
            body: >-
              Reliable Robotics has access to an operating airline, complex civil airspace, FAA integration work, and
              defense logistics programs, creating multiple settings in which customer-relevant evidence can be
              generated.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU010
              - CU011
          - type: callout
            title: Orders and pilots are not retention
            body: >-
              The reported order count lacks definitions and the named relationships do not provide renewal, churn,
              utilization, or customer-level revenue, so commercial durability cannot yet be measured.
            calloutType: risk
            claimRefs:
              - CU008
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Reliable Robotics has moved beyond a concept-stage regulatory posture, but the available milestones are
              not equivalent to approval for routine uncrewed cargo service. TechCrunch reports four linked
              certification efforts and says management expects the first, continuous-autopilot product with a pilot
              aboard, in 18 to 24 months; moving the pilot to a ground station is described as at least three years
              away. Company-issued material says the FAA has accepted plans, means of compliance, and closed issue
              papers, while Albuquerque testing still retained an onboard safety pilot. The investment implication is a
              long-duration approval dependency with no regulator-committed delivery date. Mitigation is visible through
              staged approvals, federal integration testing, and compliance submissions, but the kill criterion is
              repeated schedule slippage without a corresponding closure of certification deliverables or expansion of
              authorized operations.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR011
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR011
              - CR015
              - CR016
      - number: '7.2'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Remote and automated cargo operations concentrate risk in communications, detect-and-avoid performance,
              weather handling, and mixed-airspace integration. Independent industry commentary identifies datalink
              continuity, low-visibility judgment, uncontrolled-field operations, and airport surface movement as
              unresolved operating challenges. The Albuquerque campaign is encouraging because it exercised automated
              taxi, takeoff, and landing in complex Class C airspace, but an onboard safety pilot remained available.
              Reliable's in-house solid-state radar is a concrete mitigation, yet its certification target is itself
              prospective. Investors should require route-level safety cases, lost-link behavior, fleet reliability,
              incident reporting, and cyber assurance before treating a demonstration as proof of scalable commercial
              resilience. A material safety event, failed lost-link test, or inability to secure radar approval would
              break the operating thesis.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR015
              - CR016
      - number: '7.3'
        title: Partner, platform, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              The company depends simultaneously on FAA review, the Cessna 208 retrofit platform, government programs,
              capital providers, and eventual operator adoption. The October financing adds substantial runway but
              includes a $25 million term loan, so funding raised should not be confused with cash available or a
              disclosed runway. Company material says new capital will expand fleet, production, facilities, and a
              workforce that had nearly tripled, underscoring the execution burden before broad commercial
              authorization. Government activity and a reported Air Force contract provide useful validation, while the
              2020 Giumarra produce test supplies named use-case evidence; neither establishes diversified recurring
              demand. The key monitoring indicators are certification milestones, debt terms, cash burn, production
              yield, deployment conversion, and the share of commitments attributable to any single government,
              operator, or platform counterparty.
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Mitigation maturity and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigation architecture is credible but incomplete. Staged certification keeps a pilot aboard before
              remote operation; federal trials generate integration data; an established airframe narrows the
              certification problem; and fresh equity reduces near-term financing pressure. Residual exposure remains
              high because these mitigants are milestones and resources rather than evidence of routine, economically
              viable, uncrewed service. Diligence should therefore be milestone-based: obtain the FAA certification
              workplan and open-issue register, inspect lost-link and degraded-sensor test results, reconcile
              commitments to named counterparties and deployment dates, and review monthly burn, debt covenants,
              insurance, and production capacity. Thesis breaks include a certification reset, a serious safety or
              cybersecurity event, inability to certify detect-and-avoid capability, commitments failing to convert, or
              financing needs that materially dilute investors before commercial operation.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Milestones are not certification
            body: >-
              Accepted plans, federal demonstrations, and a safety-pilot campaign reduce technical uncertainty but do
              not authorize routine uncrewed commercial cargo service.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR016
          - type: callout
            title: Gate investment on auditable milestone evidence
            body: >-
              Require FAA issue closure, lost-link and degraded-mode test evidence, commitment conversion, and a
              covenant-adjusted runway before underwriting scaled operations.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR009
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track/research-more, with medium-low confidence and high execution risk. Reliable
              Robotics raised a reported $115 million Series D extension, including $90 million of equity and $25
              million of debt, while its valuation moved above $1 billion. That financing improves the company’s ability
              to continue a long certification program, but it does not by itself validate the price. The retained
              public evidence does not disclose current revenue, gross margin, cash balance, burn, or runway, so neither
              a revenue multiple nor a financing-to- milestone runway can be calculated. Entry should therefore be
              contingent on private diligence, certification evidence, and a term-sheet review rather than on the
              headline valuation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV009
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable context
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Reliable is pursuing a staged retrofit strategy on a proven airframe, has an
              FAA-approved certification plan, and is accumulating operating evidence through supervised demonstrations
              and government programs. The anti-thesis is that plan acceptance is not product certification: Aviation
              Week described extensive remaining flight, simulator, and hardware validation, while a 2026 industry
              analysis argued commercial autonomous cargo remained three to five years away even under optimistic
              assumptions. Merlin Labs provides a useful but imperfect public reference: its $800 million valuation was
              accompanied by disclosed 2025 revenue, a 2026 revenue projection, and a cash-burn forecast. Reliable’s
              higher private mark lacks equivalent public operating metrics, which weakens direct multiple support.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: Bull, base, and bear framework
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports conditional scenarios, not precise valuation ranges or probability percentages.
              In the bull case, timely certification of continuous autopilot engagement, credible progress toward remote
              operations, and conversion of demonstrations into repeatable commercial deployments could justify value
              above the current mark. The base case is a well-funded company continuing a multi-year certification
              effort while economic evidence remains private; the proper valuation response is to defer price
              acceptance. The bear case is certification slippage, insufficient safety evidence, or weak
              commercialization after capital is consumed, producing down-round risk. Each scenario should be updated
              against measurable milestones rather than calendar optimism or unsupported market multiples.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness cannot be established from the retained evidence. The company is still financing through a
              private Series D extension, the first certification remains prospective, and remote operation is described
              as farther away. Before underwriting an exit multiple, investors should obtain audited historical and
              forecast financials, the post-money capitalization table, liquidation preferences, debt covenants,
              customer contracts, backlog conversion, and the FAA evidence schedule. The thesis breaks if certification
              timing materially slips without a funded runway extension, demonstrations do not convert into paid
              deployments, or fleet safety and reliability evidence fails to support scaled operations. A lower entry
              price could improve returns, but it would not resolve those execution dependencies.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline is the gating issue
            body: >-
              The company may be strategically attractive, but the >$1B private mark cannot be tested against revenue,
              burn, runway, or preference data in the retained evidence. Treat certification progress as a milestone to
              diligence, not as a substitute for valuation support.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV015
              - CV016
