              - CP004
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Capability and certification position
        blocks:
          - type: paragraph
            body: >-
              Reliable's current positioning combines continuous autopilot for engine start through landing, a later
              ground-control model that removes the cockpit pilot, and solid-state collision-avoidance radar developed
              in-house after legacy suppliers declined the work. That breadth can create a certification and integration
              moat, but it also expands the number of approvals and interfaces that must mature together. The FAA
              accepted the company's overall certification plan in 2023, yet the same account said detailed compliance
              work remained; in October 2026, management still described the cockpit-pilot removal certification as at
              least three years away. NASA separately stated that clear detect-and-avoid certification or operating
              rules had not been finalized in 2023. Regulatory engagement is real evidence of progress, not proof of
              completed commercial approval.
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.3'
        title: Scale, distribution, and packaging
        blocks:
          - type: paragraph
            body: >-
              Capital and operating infrastructure favor Reliable over a thin software entrant. An October 2026 report
              put total capital raised at $380 million and the valuation above $1 billion. The same report said Reliable
              Airlines operated six Caravans on cargo service six days a week, giving the company an affiliated
              operating environment rather than only a laboratory program. Albuquerque demonstrations added evidence in
              complex Class C airspace, although a safety pilot remained onboard while a remote pilot more than 700
              miles away supervised the aircraft. A current job-board snapshot displayed 61 openings spanning
              flight-software verification, radar, FPGA, certification, manufacturing, and aircraft operations. These
              are scale and execution signals, not proof of deployed autonomous economics. Public list pricing, realized
              contract value, retrofit unit cost, support fees, and remote-operations pricing remain unavailable.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP013
      - number: '3.4'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is most credible where certification evidence, flight-control integration, detect-and-avoid
              performance, and airline operating procedures reinforce one another. It is least credible if autonomy
              modules become portable across certified airframes or if incumbents absorb the same capabilities through
              suppliers. Xwing's reported convergence on the Caravan strategy shows that the basic retrofit thesis is
              not unique. Reliable's in-house radar and four linked certification tracks may deepen differentiation, but
              they also create schedule coupling. Remote operations preserve a human in the loop and depend on
              communications reliability; independent aviation analysis highlights reduced sensory access and datalink
              latency as material failure-mode constraints. Buyers can multi-home during the pre-certification period by
              continuing crewed service while testing autonomy, limiting lock-in until operating approvals and repeat
              economics are demonstrated.
            claimRefs:
              - CP003
              - CP007
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Certification engagement is not commercial approval
            body: >-
              FAA plan acceptance, NASA test participation, Air Force demonstrations, and flights with an onboard safety
              pilot reduce technical uncertainty but do not establish approval for routine pilotless cargo service.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Reliable Robotics appears to be pursuing a dual monetization model: selling or licensing autonomy systems
              for existing aircraft while using its own airline and cargo operations to build certification evidence and
              eventual service revenue. Multiples describes the company as privately held, B2B, with “Product sales,
              Licensing” as its revenue model, but that is a database characterization rather than audited disclosure.
              The evidence also points to a system-led commercial model rather than a pure software subscription: the
              system is installed on aircraft, certification work is extensive, and Reliable Airlines is described as
              operating Caravan cargo aircraft. A disclosed claim of more than 200 commercial and military system
              commitments is an important demand signal, but commitments are not recognized revenue, backlog conversion,
              or cash receipts. No assigned source provides list pricing, realized price per aircraft or system,
              software fees, maintenance fees, take rate, or customer concentration. Accordingly, the underwriting
              question is not whether a market exists, but whether the company can convert certification and commitments
              into repeatable delivery and service economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
