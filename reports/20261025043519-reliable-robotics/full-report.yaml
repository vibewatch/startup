  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all robotics or all aviation software. For Reliable Robotics, the initial
              boundary is autonomy hardware, flight software and remote-operations capability applied to existing
              fixed-wing cargo aircraft, with adjacent demand from defense logistics and later aircraft types. The
              Caravan retrofit approach matters because the aircraft already has a long certification and maintenance
              history; Radio Hangar describes the 208 as first certificated in 1984 and as having thousands of units in
              service, while the company comparison with eVTOLs emphasizes that a new airframe and autonomy system
              create a two-front certification problem. The status quo is a piloted cargo flight, not an empty aircraft:
              operators can also defer thin routes, use road freight, or deploy conventional unmanned systems where the
              mission permits. This makes adoption a route-economics and approval decision rather than a simple
              replacement of every pilot.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The available estimates describe a technology market, not Reliable Robotics revenue. Mordor Intelligence
              estimates the autonomous-aircraft market at USD 8.83 billion in 2025, USD 10.7 billion in 2026 and USD
              27.99 billion in 2031, with a 21.19% 2026-2031 CAGR. It also reports fixed-wing share of 50.62% in 2025
              and cargo share of 41.67%. Those figures include defense, passenger, urban-air-mobility and other
              platforms, and the report explicitly excludes aftermarket retrofit kits, so they cannot be treated as a
              direct retrofit TAM. A second lens is demand infrastructure: GAO found that more than two-thirds of 37
              interviewed air-cargo stakeholders reported ground-infrastructure challenges across 11 airports. That
              supports a real logistics pain point, but not a dollar SAM. The evidence-constrained conclusion is a large
              top-down technology market with no public, company-specific SAM or SOM; route count, aircraft eligibility,
              approval timing and operator economics remain the conversion variables.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: Buyers, users and adoption path
        blocks:
          - type: paragraph
            body: >-
              The first economic buyer is likely a cargo operator or an airline subsidiary that owns route economics and
              can absorb certification and integration work; the user is the flight operations organization, including
              remote pilots and maintenance teams. Albuquerque Journal reports planned pre-certification regional cargo
              service from Albuquerque to Santa Fe and Durango, which is a concrete route-level adoption path rather
              than a generic enterprise software sale. Defense procurement is a second buyer class: Aerospace Global
              News describes AFWERX TACFI and follow-on work covering logistics, military airworthiness and larger
              aircraft studies.       Time-sensitive shippers and freight networks are potential beneficiaries or
              channel partners, but general supply-chain benefits do not establish willingness to pay. The adoption
              trigger is a certified operating envelope that improves frequency, labor economics or access to thin
              routes without imposing unacceptable third-party risk.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: Drivers, constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The demand drivers are credible but gated. Radio Hangar identifies overnight regional cargo, thin margins
              and pilot staffing pressure as a compelling use case, while Mordor attributes growth to logistics cost
              reduction, defense investment and increasing availability of flight-certified autonomy. The constraints
              are equally material: certification is multi-stage; TechCrunch reports four linked certification
              workstreams, while Radio Hangar describes separate equipment, operator and pilotless-operation approvals.
              GAO adds a separate execution risk: air-cargo data and infrastructure limitations can impair planning.
              Reliable therefore has a potentially expanding market, but valuation should depend on evidence of
              certification milestones, approved routes, repeatable retrofit installation, operator conversion and
              realized economics. Public sources do not isolate those metrics, so the key diligence gap is a bottom-up
              route and aircraft pipeline rather than another generic market forecast.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The wedge is narrower than the headline TAM
            body: >-
              The strongest market case is certified autonomy for regional cargo and dual-use logistics on existing
              aircraft. Broad autonomous-aircraft forecasts are useful context, but they include segments and product
              scopes that Reliable Robotics may not monetize.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM008
          - type: callout
            title: Certification and route conversion are the market gate
            body: >-
              Demand signals, government demonstrations and infrastructure pain do not establish recurring revenue. The
              valuation-relevant proof points are approved operations, repeatable retrofit economics, route utilization
              and paying operators.
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Reliable Robotics competes first with the incumbent answer: keep a pilot in a proven Cessna Caravan and
              preserve established operating procedures. Its closest disclosed technical analogue is the Xwing program,
              which one aviation source describes as pursuing the same Caravan retrofit and cargo-first certification
              strategy. Adjacent approaches change more of the system: Elroy Air targets a purpose-built hybrid-electric
              autonomous VTOL cargo vehicle, Amazon Prime Air addresses last-mile delivery, and Joby represents an
              all-new passenger eVTOL certification path. Internal development by an air carrier or aerospace prime is
              also a credible strategic substitute, but this source set does not establish a public production-ready
              internal alternative. The competitive boundary is therefore the buyer's cargo or aviation-automation job,
              not a narrow list of nominally autonomous aircraft startups.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
