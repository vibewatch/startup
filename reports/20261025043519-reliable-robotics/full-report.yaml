  - id: FE001
    title: Reliable Robotics autonomy architecture
    type: stack
    summary: >-
      The product is a layered retrofit system connecting a proven aircraft to onboard autonomy, detect-and-avoid,
      communications, and remote operations.
    data:
      layers:
        - label: Airframe and mission
          detail: Cessna 208B Caravan provides the proven cargo airframe for regional logistics and defense missions.
        - label: Onboard autonomy
          detail: Flight automation, navigation, and redundancy support taxi, takeoff, enroute flight, and landing.
        - label: Airspace safety
          detail: Detect-and-avoid uses ACAS X-based alerts and maneuver guidance across enroute and terminal environments.
        - label: Ground operations
          detail: >-
            A remote pilot monitors and commands the aircraft, with communications supporting air-traffic-control
            interaction.
        - label: Assurance
          detail: Hardware-in-the-loop and scripted encounter testing support standards and certification evidence.
        - label: Approval and scale
          detail: FAA certification and repeatable commercial deployment remain open gates rather than established outcomes.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
