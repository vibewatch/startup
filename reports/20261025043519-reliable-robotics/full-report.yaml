  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public record shows a progression from remote-piloted demonstrations to defense contracts, civil pilot-program
      testing, and larger private financing while certification remains unfinished.
    data:
      items:
        - date: '2017'
          label: Company founded
          details: Reliable Robotics was founded by Robert Rose and Juerg Frefel, according to TechCrunch coverage.
          tone: neutral
          claimRefs:
            - CO001
            - CO005
            - CO006
        - date: '2019'
          label: Remote-piloted Cessna 172 flight
          details: TechCrunch reported a first successful remote-piloted flight of a passenger airplane in the United States.
          tone: positive
          claimRefs:
            - CO011
        - date: '2020-08-29'
          label: Cargo-market strategy reported
          details: >-
            TechCrunch described the move from the Cessna 172 to the Cessna 208 Caravan and an operate-as-a-service
            model.
          tone: neutral
          claimRefs:
            - CO002
            - CO003
        - date: 2023-11
          label: FAA-approved uncrewed Caravan flight
          details: Assigned 2026 coverage reported a 12-minute uncrewed Cessna 208B flight from Hollister.
          tone: positive
          claimRefs:
            - CO012
        - date: '2024-03-26'
          label: AFWERX TACFI selection
          details: Reliable was approved for the 2024 Tactical Funding Increase program and continued Air Force collaboration.
          tone: positive
          claimRefs:
            - CO013
        - date: '2025-08-26'
          label: USAF contract announced
          details: >-
            Aerospace coverage reported a $17.4 million contract to purchase, integrate, and test the autonomous system
