chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Reliable Robotics was founded in 2017 by Robert Rose and Juerg Frefel, engineers whose backgrounds include
              SpaceX, Tesla, and Google. The company’s product thesis is not a new aircraft design: it retrofits
              existing fixed-wing aircraft with autonomous flight controls, remote operations, and detect-and-avoid
              capabilities. TechCrunch reported that the platform was intended for “any fixed-wing aircraft” and that
              the initial model was to retrofit and operate aircraft as a service, while current coverage describes
              continuous autopilot across taxi, takeoff, cruise, landing, and rollout with a ground operator monitoring
              the flight. This creates a vertically integrated operating model in which certification, maintenance,
              procedures, aircraft operations, and the remote-control network are linked rather than sold as a
              standalone component. The principal commercial wedge is cargo, with defense work providing another
              operating environment and evidence stream. The identity is clear; the boundary between system sales,
              operated service, and future airline economics is not yet fully public.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
