          detail: Consequence for certification, commercialization, or financing
        - id: mitigation
          label: Mitigation maturity
          detail: Stage of the publicly evidenced mitigation
      rows:
        - label: Pilot-removal certification delay
          note: Management timing remains prospective.
          values:
            - High
            - Critical
            - Developing
        - label: Lost-link or communications degradation
          note: Public route-level reliability evidence is unavailable.
          values:
            - Medium
            - Critical
            - Design stage
        - label: Weather and edge-case handling
          note: Independent commentary identifies difficult operating contexts.
          values:
            - Medium
            - Critical
            - Staged tests
        - label: Detect-and-avoid certification delay
          note: Radar approval is a separate prospective milestone.
          values:
