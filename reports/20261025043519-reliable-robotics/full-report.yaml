      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Robert Rose is co-founder and CEO; TechCrunch identifies him as a former SpaceX flight-software director
              with additional Tesla and Google experience. Juerg Frefel is co-founder and CTO and a former SpaceX
              engineer. Those backgrounds are directly relevant to the company’s autonomy and certification thesis, but
              they also make the founding technical team a material execution dependency: the available sources identify
              the two founders prominently while providing little detail on the wider executive bench, board
              composition, succession planning, or independent governance. The 2026 financing coverage says Nimble
              Partners founder John Burbank joined the board, and the Air Force announcement identifies David O’Brien as
              senior vice president of Government Solutions. A current jobs listing reports 61 open positions and roles
              spanning FPGA, flight-software verification, simulation, radar, manufacturing, security, and people
              operations. That hiring breadth is a positive scale signal, but a jobs-board count is not the same as
              headcount, filled positions, or organizational readiness.
