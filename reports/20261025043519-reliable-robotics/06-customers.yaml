company:
  name: Reliable Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Reliable Robotics has credible access to commercial cargo, municipal aviation, FAA, and
    defense workflows, but public evidence is still weighted toward supervised demonstrations,
    planned routes, and company-reported orders. The central customer risk is conversion: no
    retained source discloses paid autonomous production deployments, utilization, retention, or
    concentration.
sections:
  - id: customer-segments
    title: Buyers, users, and payers
    body: >-
      Reliable Robotics is addressing several institutional customer groups rather than a broad
      self-serve market. Regional cargo operators are the clearest commercial buyers, with FedEx
      cited as a partner for short regional cargo hops. Reliable Airlines provides an internal
      operating channel: TechCrunch reports that the subsidiary uses six Cessna Caravans to fly
      cargo six days a week. Public-sector stakeholders form a second segment. The City of
      Albuquerque and the FAA provide test and integration environments, while the U.S. Air Force
      and AFRL sponsor defense-logistics work. These relationships validate workflow access, but
      they do not establish how many unrelated operators pay for the autonomy system.
    claimRefs: [CU001, CU002, CU006, CU007, CU010]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and operating proof
    body: >-
      The strongest current adoption evidence is operational but pre-commercial for autonomous
      flight. Albuquerque Journal reports a two-day Sunport campaign in which a Caravan performed
      automated taxiing, takeoffs, and landings while a safety pilot remained aboard and a remote
      pilot supervised from more than 700 miles away. The same local reporting describes planned
      pre-certification cargo routes from Albuquerque to Santa Fe and Durango. Company-issued
      program material says Reliable Airlines has conducted conventional cargo operations at the
      Sunport since 2023, giving the company an operating base. None of this demonstrates recurring
      paid autonomous service, completed shipment volume, or fleet utilization.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU011]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named proof and order quality
    body: >-
      Named counterparties span commercial, civic, regulatory, and defense channels. FedEx is a
      historical partnership and use-case signal, not a disclosed production deployment.
      Albuquerque and the FAA are tied to supervised testing and planned routes. Air Force evidence
      is stronger on procurement: reporting identifies TACFI and follow-on SBIR work, while another
      source reports a $17.4 million Air Force contract and planned 2026 demonstrations. A-Drones
      also relays the company's claim that commercial and military customers placed more than 200
      orders. The claim is potentially material, but the source does not define whether those are
      binding purchases, options, pilots, system units, or aircraft installations.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU015]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration
    body: >-
      The expansion mechanism is plausible: establish a certified operating system on the Caravan,
      build evidence through public-sector programs and Reliable Airlines, and then sell additional
      aircraft installations or routes. The timing remains the limiting factor. TechCrunch reports
      an 18-to-24-month expectation for the first pilot-in-aircraft product and at least three years
      for moving the pilot to a ground station. Radio Hangar separately says commercial autonomous
      approval was incomplete in mid-2026 and estimates regular service at three to five years even
      in an optimistic case. Public evidence does not disclose renewals, churn, contract duration,
      order conversion, top-customer exposure, or the number of independently paying operators.
    claimRefs: [CU012, CU013, CU014, CU015]
  - id: customer-diligence
    title: Customer diligence priorities
    body: >-
      Customer traction should therefore be underwritten as program validation rather than proven
      recurring adoption. The next diligence step is to reconcile every announced relationship and
      order with an executed agreement, payer, aircraft, route, delivery milestone, and recognized
      revenue. Reference calls should separate conventional Reliable Airlines cargo operations from
      autonomous-system use and should test dispatch reliability, intervention rates, certification
      dependencies, and willingness to expand. A cohort view covering pilots, paid deployments,
      renewals, cancellations, and options would show whether the apparent breadth of demand survives
      procurement and certification friction or remains concentrated in a few government-backed
      programs and one anchor commercial relationship.
    claimRefs: [CU003, CU005, CU008, CU014, CU015]
