figures:
  - id: FU001
    title: Customer journey from access to durable deployment
    type: journey-map
    summary: Evidence supports institutional access and supervised operation, while paid autonomous production, retention, and fleet expansion remain unverified.
    data:
      items:
        - label: Institutional access
          title: Institutional access
          detail: FAA, Albuquerque, and Air Force relationships provide regulated operating environments.
          touchpoints: ["eIPP selection", "TACFI and SBIR"]
        - label: Operating baseline
          title: Operating baseline
          detail: Reliable Airlines operates Caravans in a cargo workflow, but this is not evidence of autonomous production revenue.
          touchpoints: ["Six-aircraft fleet", "Cargo six days a week"]
        - label: Supervised automation
          title: Supervised automation
          detail: Sunport testing covered automated taxi, takeoff, and landing with a safety pilot aboard.
          touchpoints: ["Remote supervision", "Controlled airspace"]
        - label: Planned routes
          title: Planned routes
          detail: Albuquerque-to-Santa Fe and Albuquerque-to-Durango services are described as pre-certification plans.
          touchpoints: ["Route preparation", "eIPP operations"]
        - label: Paid autonomous production
          title: Paid autonomous production
          detail: The retained sources do not identify a recurring paid autonomous route or delivered customer installation.
          touchpoints: ["Contract conversion", "Certification"]
        - label: Renewal and expansion
          title: Renewal and expansion
          detail: Fleet rollout depends on approval, reliability, customer references, and repeat procurement.
          touchpoints: ["Additional aircraft", "Renewal and utilization"]
    approximationNotes: "The stages are analytical milestones, not a conversion-rate funnel or a forecast timeline."
    claimRefs: [CU001, CU003, CU005, CU012, CU013, CU014]
callouts:
  - calloutType: strength
    title: Institutional workflow access is substantive
    body: Reliable Robotics has access to an operating airline, complex civil airspace, FAA integration work, and defense logistics programs, creating multiple settings in which customer-relevant evidence can be generated.
    claimRefs: [CU001, CU003, CU007, CU010, CU011]
  - calloutType: risk
    title: Orders and pilots are not retention
    body: The reported order count lacks definitions and the named relationships do not provide renewal, churn, utilization, or customer-level revenue, so commercial durability cannot yet be measured.
    claimRefs: [CU008, CU014, CU015]
