company:
  name: Reliable Robotics
chapter:
  number: 7
  title: Risks
  summary: >-
    FAA certification timing is the dominant residual risk: Reliable Robotics has
    documented certification progress and live federal test activity, but management
    still describes pilot removal as at least three years away. Capital, operational
    resilience, and counterparty concentration remain material diligence areas because
    public evidence does not disclose burn, fleet-level reliability, or commitment mix.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Reliable Robotics has moved beyond a concept-stage regulatory posture, but the
      available milestones are not equivalent to approval for routine uncrewed cargo
      service. TechCrunch reports four linked certification efforts and says management
      expects the first, continuous-autopilot product with a pilot aboard, in 18 to 24
      months; moving the pilot to a ground station is described as at least three years
      away. Company-issued material says the FAA has accepted plans, means of compliance,
      and closed issue papers, while Albuquerque testing still retained an onboard safety
      pilot. The investment implication is a long-duration approval dependency with no
      regulator-committed delivery date. Mitigation is visible through staged approvals,
      federal integration testing, and compliance submissions, but the kill criterion is
      repeated schedule slippage without a corresponding closure of certification
      deliverables or expansion of authorized operations.
    claimRefs: [CR001, CR003, CR004, CR007, CR008, CR011, CR015, CR016]
    tableRefs: [TR001]
  - id: operational-resilience
    title: Operational, quality, and security exposure
    body: >-
      Remote and automated cargo operations concentrate risk in communications,
      detect-and-avoid performance, weather handling, and mixed-airspace integration.
      Independent industry commentary identifies datalink continuity, low-visibility
      judgment, uncontrolled-field operations, and airport surface movement as unresolved
      operating challenges. The Albuquerque campaign is encouraging because it exercised
      automated taxi, takeoff, and landing in complex Class C airspace, but an onboard
      safety pilot remained available. Reliable's in-house solid-state radar is a concrete
      mitigation, yet its certification target is itself prospective. Investors should
      require route-level safety cases, lost-link behavior, fleet reliability, incident
      reporting, and cyber assurance before treating a demonstration as proof of scalable
      commercial resilience. A material safety event, failed lost-link test, or inability
      to secure radar approval would break the operating thesis.
    claimRefs: [CR004, CR005, CR006, CR008, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-finance
    title: Partner, platform, and financial dependencies
    body: >-
      The company depends simultaneously on FAA review, the Cessna 208 retrofit platform,
      government programs, capital providers, and eventual operator adoption. The October
      financing adds substantial runway but includes a $25 million term loan, so funding
      raised should not be confused with cash available or a disclosed runway. Company
      material says new capital will expand fleet, production, facilities, and a workforce
      that had nearly tripled, underscoring the execution burden before broad commercial
      authorization. Government activity and a reported Air Force contract provide useful
      validation, while the 2020 Giumarra produce test supplies named use-case evidence;
      neither establishes diversified recurring demand. The key monitoring indicators are
      certification milestones, debt terms, cash burn, production yield, deployment
      conversion, and the share of commitments attributable to any single government,
      operator, or platform counterparty.
    claimRefs: [CR002, CR003, CR009, CR010, CR012, CR013, CR014]
    tableRefs: [TR003]
  - id: mitigation-kill-criteria
    title: Mitigation maturity and thesis-break triggers
    body: >-
      The mitigation architecture is credible but incomplete. Staged certification keeps a
      pilot aboard before remote operation; federal trials generate integration data; an
      established airframe narrows the certification problem; and fresh equity reduces
      near-term financing pressure. Residual exposure remains high because these mitigants
      are milestones and resources rather than evidence of routine, economically viable,
      uncrewed service. Diligence should therefore be milestone-based: obtain the FAA
      certification workplan and open-issue register, inspect lost-link and degraded-sensor
      test results, reconcile commitments to named counterparties and deployment dates,
      and review monthly burn, debt covenants, insurance, and production capacity. Thesis
      breaks include a certification reset, a serious safety or cybersecurity event,
      inability to certify detect-and-avoid capability, commitments failing to convert,
      or financing needs that materially dilute investors before commercial operation.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR009, CR015, CR016]
