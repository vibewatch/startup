callouts:
  - calloutType: risk
    title: Milestones are not certification
    body: >-
      Accepted plans, federal demonstrations, and a safety-pilot campaign reduce technical
      uncertainty but do not authorize routine uncrewed commercial cargo service.
    claimRefs: [CR003, CR004, CR011, CR016]
  - calloutType: recommendation
    title: Gate investment on auditable milestone evidence
    body: >-
      Require FAA issue closure, lost-link and degraded-mode test evidence, commitment
      conversion, and a covenant-adjusted runway before underwriting scaled operations.
    claimRefs: [CR001, CR002, CR005, CR009, CR014, CR016]
