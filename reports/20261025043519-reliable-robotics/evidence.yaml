evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      A definitive financing history tying the April round and October extension to instruments, cumulative proceeds,
      debt terms, and post-money ownership.
    whyItMatters: >-
      Dated public snapshots establish capital raised but not dilution, preference rights, current cash, debt burden, or
      runway.
    diligencePath: >-
