      - [Internal carrier build, Strategic substitute, Unknown in assigned evidence, Carrier-controlled aviation automation, "Control of integration and operating data", "No public production-ready program established in assigned evidence"]
    notes: >-
      Representative, not exhaustive. Funding is shown only where the assigned evidence states it;
      unknown means the source pool did not establish a comparable value, not zero.
