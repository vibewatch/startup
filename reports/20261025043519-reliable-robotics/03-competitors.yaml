  - id: TP002
    title: Capability and trust posture matrix
    columns:
      - Buying criterion
      - Reliable Robotics
      - Xwing program
      - New-airframe cargo or eVTOL
      - Crewed incumbent
      - Diligence implication
    rows:
      - [Existing certified airframe, "Yes: Cessna Caravan retrofit", "Reported yes: Caravan retrofit", No, Yes, "Retrofit narrows airframe novelty but does not remove autonomy certification"]
      - [All-phase automated control, "Continuous-autopilot product described from engine start through landing", "Broad autonomous retrofit described; exact scope unknown", Unknown, No, "Verify approved operating envelope rather than demo scope"]
      - [Remote ground supervision, "Planned and demonstrated with onboard safety pilot", Reported, Unknown, Not required, "Human supervision remains part of the operating model"]
      - [Detect-and-avoid evidence, "In-house radar plus NASA-observed test work", Unknown, Unknown, "Pilot visual responsibility", "Certification rules and system performance still require verification"]
      - [Affiliated operating certificate or airline, "Reliable Airlines and Part 135 operating context reported", Unknown, Unknown, Yes, "Separate equipment and operator approvals matter"]
      - [Public commercial autonomous approval, Not established, Not established, Not established, "Existing crewed operations", "Do not equate tests, plan acceptance, or military work with civil autonomous approval"]
    notes: >-
      Cells reflect only the assigned prefetched evidence; unknown cells are deliberate and do
      not imply absence. Demonstrations are separated from commercial autonomous approval.
    claimRefs: [CP001, CP002, CP003, CP010, CP011, CP012, CP015]
  - id: TP003
    title: Pricing and packaging evidence
    columns:
      - Alternative
      - Public price or unit
      - Observed package or contract model
      - Included capability evidence
      - Discount or unknown
      - Investment implication
    rows:
      - [Reliable Robotics commercial retrofit, Unknown, "System certification plus prospective operator adoption", "Autopilot, remote operations, radar, and airline pathway", "Retrofit, support, communications, and realized contract pricing unknown", "Cannot compare customer ROI or gross margin"]
      - [Reliable Robotics government work, Unknown, "TACFI and follow-on SBIR work reported", "Caravan autonomy and study for larger airframes including KC-135", "Award amount and economics absent from assigned evidence", "Government validation does not reveal commercial pricing"]
      - [Xwing program, Unknown, Unknown, "Caravan retrofit autonomy reported", "Pricing, packaging, and current commercial status unknown", "Direct price comparison is not supportable"]
      - [Purpose-built autonomous cargo, Unknown, "Vehicle-plus-operations model not established", "Elroy hybrid-electric VTOL named", "Aircraft, service, and support economics unknown", "Different vehicle economics limit comparability"]
      - [Crewed Caravan status quo, Unknown, "Aircraft operation with onboard pilot", "Established airframe and procedures", "Route-level labor and maintenance cost absent", "Status-quo cost baseline is required for ROI"]
    notes: >-
      No assigned source disclosed comparable public list or realized pricing. Every unknown is
      an evidence gap rather than a zero-value assumption.
    claimRefs: [CP004, CP007, CP008, CP013]
figures:
  - id: FP001
    title: Competitive positioning by airframe departure and regional-cargo relevance
    type: quadrant
    summary: >-
      An evidence-constrained ordinal map separates direct Caravan retrofits from new-airframe,
      last-mile, passenger, and incumbent alternatives.
    data:
      xAxis: "Airframe departure from installed base (1 low - 5 high)"
      yAxis: "Relevance to regional airport-to-airport cargo (1 low - 5 high)"
      points:
        - {label: Reliable Robotics, x: 2, y: 5, note: "Caravan retrofit focused on regional cargo and broader aircraft automation."}
        - {label: Xwing program, x: 2, y: 5, note: "Reported Caravan retrofit and cargo-first certification analogue."}
        - {label: Elroy Air, x: 5, y: 4, note: "Purpose-built hybrid-electric autonomous VTOL for medium-weight cargo."}
        - {label: Amazon Prime Air, x: 5, y: 2, note: "Purpose-built last-mile delivery network rather than regional airport cargo."}
        - {label: Joby Aviation, x: 5, y: 1, note: "Purpose-built passenger eVTOL with a different mission and certification path."}
        - {label: Crewed Caravan status quo, x: 1, y: 5, note: "Installed regional-cargo airframe and operating model without autonomous retrofit."}
    approximationNotes: >-
      Analyst-assigned ordinal scores summarize documented platform novelty and mission fit;
      they are not measured performance, market share, certification, or quality scores.
    claimRefs: [CP001, CP004, CP007, CP008, CP009]
callouts:
  - calloutType: risk
    title: Certification engagement is not commercial approval
    body: >-
      FAA plan acceptance, NASA test participation, Air Force demonstrations, and flights with
      an onboard safety pilot reduce technical uncertainty but do not establish approval for
      routine pilotless cargo service.
    claimRefs: [CP010, CP011, CP012, CP013]
