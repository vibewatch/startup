company:
  name: Reliable Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: "Reliable Robotics is positioned in a narrower and more defensible initial market than a generic autonomous-aircraft TAM: regional cargo and dual-use logistics using certified airframes, where pilot scarcity, utilization and remote access can matter. Published market estimates are broad and methodology-dependent, while certification, infrastructure and data-quality constraints make the near-term serviceable market materially smaller and still unproven."
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market is not all robotics or all aviation software. For Reliable Robotics,
      the initial boundary is autonomy hardware, flight software and remote-operations capability
      applied to existing fixed-wing cargo aircraft, with adjacent demand from defense logistics
      and later aircraft types. The Caravan retrofit approach matters because the aircraft already
      has a long certification and maintenance history; Radio Hangar describes the 208 as first
      certificated in 1984 and as having thousands of units in service, while the company
      comparison with eVTOLs emphasizes that a new airframe and autonomy system create a
      two-front certification problem. The status quo is a piloted cargo flight, not an empty
      aircraft: operators can also defer thin routes, use road freight, or deploy conventional
      unmanned systems where the mission permits. This makes adoption a route-economics and
      approval decision rather than a simple replacement of every pilot.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what they do not prove
    body: >-
      The available estimates describe a technology market, not Reliable Robotics revenue.
      Mordor Intelligence estimates the autonomous-aircraft market at USD 8.83 billion in 2025,
      USD 10.7 billion in 2026 and USD 27.99 billion in 2031, with a 21.19% 2026-2031 CAGR.
      It also reports fixed-wing share of 50.62% in 2025 and cargo share of 41.67%. Those
      figures include defense, passenger, urban-air-mobility and other platforms, and the report
      explicitly excludes aftermarket retrofit kits, so they cannot be treated as a direct
      retrofit TAM. A second lens is demand infrastructure: GAO found that more than two-thirds
      of 37 interviewed air-cargo stakeholders reported ground-infrastructure challenges across
      11 airports. That supports a real logistics pain point, but not a dollar SAM. The
      evidence-constrained conclusion is a large top-down technology market with no public,
      company-specific SAM or SOM; route count, aircraft eligibility, approval timing and
      operator economics remain the conversion variables.
    claimRefs: [CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users and adoption path
    body: >-
      The first economic buyer is likely a cargo operator or an airline subsidiary that owns
      route economics and can absorb certification and integration work; the user is the flight
      operations organization, including remote pilots and maintenance teams. Albuquerque
      Journal reports planned pre-certification regional cargo service from Albuquerque to Santa
      Fe and Durango, which is a concrete route-level adoption path rather than a generic
      enterprise software sale. Defense procurement is a second buyer class: Aerospace Global
      News describes AFWERX TACFI and follow-on work covering logistics, military airworthiness
      and larger aircraft studies.       Time-sensitive shippers and freight networks are potential
      beneficiaries or channel partners, but general supply-chain benefits do not establish willingness to pay.
      The adoption trigger is a certified operating envelope that improves frequency, labor
      economics or access to thin routes without imposing unacceptable third-party risk.
    claimRefs: [CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: constraints-and-diligence
    title: Drivers, constraints and valuation relevance
    body: >-
      The demand drivers are credible but gated. Radio Hangar identifies overnight regional
      cargo, thin margins and pilot staffing pressure as a compelling use case, while Mordor
      attributes growth to logistics cost reduction, defense investment and increasing
      availability of flight-certified autonomy. The constraints are equally material:
      certification is multi-stage; TechCrunch reports four linked certification workstreams,
      while Radio Hangar describes separate equipment, operator and pilotless-operation
      approvals. GAO adds a separate execution risk: air-cargo data and infrastructure
      limitations can impair planning. Reliable therefore has a potentially expanding market,
      but valuation should depend on evidence of certification milestones, approved routes,
      repeatable retrofit installation, operator conversion and realized economics. Public
      sources do not isolate those metrics, so the key diligence gap is a bottom-up route and
      aircraft pipeline rather than another generic market forecast.
    claimRefs: [CM013, CM014, CM015, CM016]
    tableRefs: []
