callouts:
  - calloutType: insight
    title: The wedge is narrower than the headline TAM
    body: "The strongest market case is certified autonomy for regional cargo and dual-use logistics on existing aircraft. Broad autonomous-aircraft forecasts are useful context, but they include segments and product scopes that Reliable Robotics may not monetize."
    claimRefs: [CM001, CM004, CM008]
  - calloutType: risk
    title: Certification and route conversion are the market gate
    body: "Demand signals, government demonstrations and infrastructure pain do not establish recurring revenue. The valuation-relevant proof points are approved operations, repeatable retrofit economics, route utilization and paying operators."
    claimRefs: [CM009, CM013, CM016]
