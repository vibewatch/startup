company:
  name: Reliable Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Reliable Robotics is a Mountain View autonomous-aviation company founded in 2017 by SpaceX and Tesla veterans. Its strategy is to retrofit certified aircraft, especially the Cessna 208B Caravan, with a certifiable autonomy system; October 2026 reporting put total capital raised at $380 million and valuation above $1 billion, but pilot-out commercial certification, revenue, and current operating scale remain incompletely disclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Reliable Robotics was founded in 2017 by Robert Rose and Juerg Frefel, engineers whose backgrounds include SpaceX, Tesla, and Google. The company’s product thesis is not a new aircraft design: it retrofits existing fixed-wing aircraft with autonomous flight controls, remote operations, and detect-and-avoid capabilities. TechCrunch reported that the platform was intended for “any fixed-wing aircraft” and that the initial model was to retrofit and operate aircraft as a service, while current coverage describes continuous autopilot across taxi, takeoff, cruise, landing, and rollout with a ground operator monitoring the flight. This creates a vertically integrated operating model in which certification, maintenance, procedures, aircraft operations, and the remote-control network are linked rather than sold as a standalone component. The principal commercial wedge is cargo, with defense work providing another operating environment and evidence stream. The identity is clear; the boundary between system sales, operated service, and future airline economics is not yet fully public.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-governance-and-dependence
    title: Leadership, governance, and key-person dependence
    body: >-
      Robert Rose is co-founder and CEO; TechCrunch identifies him as a former SpaceX flight-software director with additional Tesla and Google experience. Juerg Frefel is co-founder and CTO and a former SpaceX engineer. Those backgrounds are directly relevant to the company’s autonomy and certification thesis, but they also make the founding technical team a material execution dependency: the available sources identify the two founders prominently while providing little detail on the wider executive bench, board composition, succession planning, or independent governance. The 2026 financing coverage says Nimble Partners founder John Burbank joined the board, and the Air Force announcement identifies David O’Brien as senior vice president of Government Solutions. A current jobs listing reports 61 open positions and roles spanning FPGA, flight-software verification, simulation, radar, manufacturing, security, and people operations. That hiring breadth is a positive scale signal, but a jobs-board count is not the same as headcount, filled positions, or organizational readiness.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-scale-and-milestones
    title: Capital, scale, and milestones
    body: >-
      Financing reports should be preserved as dated observations rather than collapsed across periods. In April 2026, coverage described a $160 million round, nearly $1 billion valuation, and $300 million raised. TechCrunch then reported an October $115 million extension, comprising $90 million of equity and $25 million of debt, that brought the Series D to $275 million, valuation above $1 billion, and total capital raised to $380 million. The later snapshot supersedes the earlier cumulative figure; neither establishes cash available or runway. April reporting also said commercial and military customers had placed more than 200 orders, but order definition and conversion are undisclosed. Operational milestones include the 2019 remote-piloted Cessna 172 flight, a November 2023 FAA-approved 12-minute uncrewed Cessna 208B flight, Air Force work and a $17.4 million contract, and 2026 Albuquerque demonstrations. Independent analysis still estimated regular commercial autonomous cargo service at least three to five years away.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
