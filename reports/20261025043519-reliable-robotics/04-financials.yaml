      - [Cargo operations, "Reliable Airlines operates Caravan cargo service while certification progresses", "Operational plan and pre-certification flights reported; revenue not disclosed", "Third-party reported", "Route-level revenue, load factor, utilization, subsidy, and contribution margin"]
      - [Government and defense work, "Air Force and other government-funded autonomy programs", "AFWERX/TACFI participation and a $17.4M Air Force contract are reported", "Third-party/partner reported", "Contract type, funded backlog, milestones, payment timing, and renewal probability"]
    notes: "Sources mix a private-company database, news, and industry coverage; rows distinguish mechanisms from disclosed revenue. Null or unavailable values mean the assigned pool did not provide audited or contractual financial disclosure."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Item, Price/unit/contract, List versus realized, Public evidence, Implication]
    rows:
      - [Autonomy-system sale, null, "Unknown", "No assigned source gives a system price", "Cannot model bookings, gross profit, or payback"]
      - [Software or technology license, null, "Unknown", "Licensing is described but terms are absent", "Recurring-revenue quality is unproven"]
      - [Cargo flight service, null, "Unknown", "Routes and operations are described without fares or contracts", "Cannot test route contribution margin"]
      - [Government contract, "$17.4M reported Air Force contract", "Contract value is not company-wide revenue", "ADrones reports the contract; scope and payment schedule are not supplied", "Separate government funding from commercial demand"]
    notes: "No list-price page, customer contract, invoice example, or realized-price disclosure was retained in the assigned pool. The $17.4M figure is a reported contract value, not ARR, revenue run rate, or cash available."
    claimRefs: [CI002, CI003, CI004, CI009]
  - id: TI003
    title: Unit economics and capital-underwriting gaps
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue run rate, null, Low, "No assigned source discloses current revenue", "Monthly revenue by system sales, licenses, services, and cargo operations"]
      - [Gross margin, null, Low, "Hardware retrofit and support costs may be material", "Unit cost, installation, warranty, maintenance, and service-cost bridge"]
      - [CAC and payback, null, Low, "Enterprise and government sales cycles may be long", "Sales funnel, acquisition spend, cycle length, and cohort payback"]
      - [Monthly cash burn, null, Low, "New financing does not establish cash consumption", "Last twelve months cash flow, current burn, and restricted cash"]
      - [Runway, null, Low, "Cash balance, burn, and committed capex are unavailable", "Board-approved base/downside runway and milestone financing plan"]
      - [Debt obligations, "$25M debt reported in October financing", Medium, "Debt is disclosed but covenants and maturity are not", "Instrument, maturity, interest, security, covenants, and repayment schedule"]
    notes: "Null values are intentional evidence gaps, not zeroes or estimates. The debt row preserves the reported tranche but does not infer total debt or cash availability."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012]
