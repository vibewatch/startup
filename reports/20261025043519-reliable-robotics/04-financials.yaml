company:
  name: Reliable Robotics
chapter:
  number: 4
  title: Financials
  summary: Reliable Robotics has meaningful disclosed financing, a large but unconverted system-commitment claim, and visible investment in certification and engineering capacity. Public evidence still does not establish revenue, realized pricing, gross margin, burn, runway, or the economics of converting those commitments into recurring cargo operations.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Reliable Robotics appears to be pursuing a dual monetization model: selling or licensing autonomy systems for existing aircraft while using its own airline and cargo operations to build certification evidence and eventual service revenue. Multiples describes the company as privately held, B2B, with “Product sales, Licensing” as its revenue model, but that is a database characterization rather than audited disclosure. The evidence also points to a system-led commercial model rather than a pure software subscription: the system is installed on aircraft, certification work is extensive, and Reliable Airlines is described as operating Caravan cargo aircraft. A disclosed claim of more than 200 commercial and military system commitments is an important demand signal, but commitments are not recognized revenue, backlog conversion, or cash receipts. No assigned source provides list pricing, realized price per aircraft or system, software fees, maintenance fees, take rate, or customer concentration. Accordingly, the underwriting question is not whether a market exists, but whether the company can convert certification and commitments into repeatable delivery and service economics.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The disclosed financing is being used against a capital-intensive certification and production ramp. TechCrunch reports that the October financing included $90 million of equity and $25 million of debt, while the April coverage says the $160 million round was intended to gather evidence for FAA certification and scale production. The cost base therefore plausibly includes flight-test and compliance work, avionics and radar development, aircraft retrofit and manufacturing, airline operations, maintenance, and specialized engineering. Public hiring data supports continued investment: Startup Jobs listed 61 positions in October 2026, including FPGA, flight-software verification, simulation, avionics, radar, quality, manufacturing, and system-integration roles. These are operating signals, not a cash-burn calculation. The assigned evidence does not disclose gross margin, bill of materials, installation cost, maintenance cost, pilot- or remote-operator productivity, customer acquisition cost, payback, working-capital terms, or capex. Any scenario that supplies those values would be an estimate and should be labeled as such; the current public record supports only a diligence request for them.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The October financing improves the disclosed capital position but does not prove runway. TechCrunch reports $115 million of new financing, comprising $90 million equity and $25 million debt, and says the Series D totals $275 million and valuation moved above $1 billion; its article also reports $380 million raised to date. Other assigned sources report different totals and round descriptions, including Multiples’ $384 million across six rounds and HyperSinc’s April account of $300 million total capital after a $160 million raise. The conflicting totals likely reflect timing, inclusion of debt, or source methodology, so they should not be collapsed into a single precise lifetime-raised figure without company confirmation. The financial verdict is therefore mixed: funding access and strategic investors reduce near-term financing uncertainty, while certification timing, production scale-up, debt terms, and absent operating metrics leave capital adequacy unproven. A next-round trigger cannot be identified from the pool; management should provide a current cash balance, monthly cash burn, committed capex, debt covenants and maturity, milestone-linked funding plan, and downside runway under certification delay.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: []
    figureRefs: []
