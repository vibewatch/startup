callouts:
  - calloutType: insight
    title: Financing is visible; operating conversion is not
    body: "The strongest public financial evidence is financing access and a reported commitment base, while the central underwriting variables—revenue, margin, burn, runway, price, and delivery conversion—remain unavailable."
    claimRefs: [CI003, CI009, CI012]
  - calloutType: risk
    title: Certification delay is a capital-risk multiplier
    body: "The company is funding a long certification and production program with debt included in the latest reported financing, but the assigned pool does not disclose cash runway or milestone-linked financing needs."
    claimRefs: [CI005, CI009, CI012]
