company:
  name: Reliable Robotics
chapter:
  number: 5
  title: Product & Technology
  summary: Reliable Robotics is pursuing certifiable autonomy by retrofitting proven aircraft rather than designing a new airframe. Public evidence shows a layered system spanning flight automation, detect-and-avoid, remote operations, and FAA-oriented testing, while commercial certification, degraded-mode performance, and production deployment remain material diligence gates.
sections:
  - id: product-and-user-workflow
    title: Product and customer workflow
    body: >-
      Reliable Robotics sells an autonomy system for cargo and defense aviation rather than a
      new aircraft platform. The operating workflow begins with a proven Cessna 208B Caravan,
      adds automated control across taxi, takeoff, enroute flight, and landing, and places a
      remote pilot in a ground operation rather than in the cockpit. Albuquerque Journal
      reporting describes a safety pilot remaining aboard during federal demonstration flights
      while a remote pilot more than 700 miles away monitored and commanded the aircraft and
      communicated with air traffic control. The Air Force product description likewise calls
      the Reliable Autonomy System a complete large-UAS integration solution. This is a
      credible workflow wedge for regional cargo and military logistics, but demonstrations
      are not the same as certified, revenue-generating commercial service.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture and maturity
    body: >-
      The architecture is a safety-critical system-of-systems. Public technical reporting
      identifies an aircraft control layer, navigation and autonomy logic, detect-and-avoid
      sensing and alerting, communications, and a remote-operations layer. FAA-contracted tests
      used ACAS X, hardware-in-the-loop testing, scripted encounters, and partner equipment
      from Sagetech, Collins, and uAvionix. The tests found that ACAS X behavior changes between
      enroute and terminal environments, and that low-altitude protection must cover both
      cooperative and noncooperative traffic. These are meaningful validation surfaces, but
      they do not establish full certification or reliability across the long tail of combined
      failures. The architecture map therefore separates demonstrated components from
      unresolved operational scale.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risks
    title: Differentiation, dependencies, and diligence
    body: >-
      The differentiation thesis is retrofit leverage: existing type-certified airframes
      narrow the airworthiness problem relative to certifying a novel aircraft, while a
      reusable system could extend across aircraft types. The same strategy creates
      dependencies. FAA acceptance and operational approval remain gating items; remote
      operations depend on communications and surveillance; and safety cases must address
      degraded weather, traffic, and sensor or link failures. Hiring evidence is consistent
      with a substantial verification and avionics workload: the October 2026 job feed lists
      FPGA design, flight-software verification, simulation, and avionics-harness roles.
      That is a developer signal about engineering effort, not proof of product readiness.
      The key underwriting question is whether flight-test evidence converts into an
      approved, repeatable operating envelope and economically deployable fleet.
    claimRefs: [CE010, CE011, CE012, CE013]
  - id: evidence-gaps
    title: Evidence gaps
    body: >-
      Public sources do not provide a complete reliability dataset for autonomous commercial
      operations. There is no retained evidence here for fleet-level dispatch reliability,
      failure-rate targets, remote-operator workload, cybersecurity controls, maintenance
      intervals after retrofit, or production throughput. Certification plans and test
      campaigns should therefore be treated as maturity signals, not as substitutes for
      operational safety performance. A diligence process should request the certification
      basis, test-hour and incident ledger, hazard analyses, communications-loss behavior,
      security assurance artifacts, and a deployment plan that distinguishes pilot programs
      from recurring service.
    claimRefs: [CE014, CE015]

