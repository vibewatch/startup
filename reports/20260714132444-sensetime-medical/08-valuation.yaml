- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Customer proofs do not expand
    - Named sites remain isolated and non-recurring
    - Platform thesis weakens directly
    - Hold or step back until evidence improves
  - - Regulatory progress stalls
    - Core workflows fail to advance as expected
    - Defensibility and timing weaken together
    - Lower conviction and extend diligence
  - - Geopolitical friction rises
    - Parent-linked concerns block partners or regions
    - International upside compresses
    - Reassess market-scope assumptions
  - - Future financing quality weakens
    - New capital arrives on weaker terms or without disclosure progress
    - Narrative premium looks fragile
    - Treat pricing as increasingly stretched
  - - Economic disclosure remains absent
    - No margin or retention clarity in follow-up diligence
    - Valuation precision stays low
    - Keep recommendation below buy
  notes: Kill triggers are defined to be observable rather than theoretical.
