- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue and margin
    - Revenue mix, gross margin, burn, and runway
    - Determines whether software leverage is real
    - Request subsidiary monthly financials
  - - Retention and expansion
    - Cohorts, attach rates, and renewal history
    - Determines whether breadth converts to stickiness
    - Request account-level expansion data
  - - Concentration
    - Top-customer and partner exposure
    - Determines downside severity and resilience
    - Request top-10 customer file
  - - Financing terms
    - Preferences, governance rights, parent agreements
    - Determines downside protection and economics
    - Request term sheets and cap table
  - - Regulatory roadmap
    - Product-by-product milestone timing
    - Determines pace of scaled deployment
    - Request regulatory tracker by module
  notes: These asks are chosen because each could materially move the recommendation, not because they are generically interesting.
