  figureRefs:
  - FP001
- id: direct-competitors
  title: Direct competitors
  body: |-
    The direct peer group is led by medical-AI specialists whose products map most closely to hospital budgets. Infervision is the clearest benchmark because it has long positioned around clinical imaging and has built a recognizable enterprise brand. DeepCare also fits the specialist mold, though it appears narrower. Yitu Medical belongs in the comparison set because it pursued a broader AI-medical platform story earlier, even if later market discussion focused more heavily on commercialization pressure.

    What distinguishes SenseTime Medical from these direct peers is the attempt to connect specialist clinical AI with a broader hospital operating stack. Public materials emphasize DaYi, workflow breadth, and a multi-module hospital suite rather than a single diagnostic task. In theory, that gives the company more account-expansion potential than a pure point solution.

    In practice, that advantage only matters if breadth converts into deployments and retention. Hospitals do not buy platform narratives for their own sake. They buy products that integrate, validate, and save time. So the key direct-competition question is whether SenseTime Medical’s breadth creates superior stickiness or simply broader implementation burden.
  claimRefs:
  - CP006
  - CP007
  - CP008
  - CP009
  - CP010
  - CP017
  tableRefs:
  - TP002
  figureRefs:
  - FP002
- id: platform-and-tech-giant-competition
  title: Platform and tech giant competition
  body: |-
    The company also operates in the shadow of much larger players. United Imaging matters because integrated hardware and software vendors can place AI into existing imaging relationships, which lowers procurement friction. Baidu Health, Alibaba Health, and Tencent Miying matter for a different reason: they have reach, data surfaces, and adjacent budgets that can support experimentation or cross-subsidized product expansion.

    At the same time, size alone does not settle competition in clinical settings. Provider adoption still depends on evidence, workflow integration, procurement, and trust. A giant platform can have reach and still underperform in a tightly validated hospital workflow. That is why platform incumbents are a threat, but not an automatic winner-take-all outcome.

    Open model access adds a third pressure point. Basic assistant features are easier to copy than deeply integrated clinical workflows. This pushes every vendor, including SenseTime Medical, to defend the part of the stack where model access alone is not enough.
  claimRefs:
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
