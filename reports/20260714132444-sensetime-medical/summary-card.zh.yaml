  topStrengths:
    - 医院 AI 平台覆盖影像、流程、患者服务和科研场景，确实具备先落地再扩张的空间。
    - 大型医院具名案例和新加坡上线的影像流程证明，这个故事不只是融资叙事。
    - 医疗、战略和区域投资人快速下注，说明外部资金对公司品类位置的信心异乎寻常。
    - DaYi 加多模态临床模型，让公司相对狭窄单点方案同行拥有差异化产品叙事。
    - 医疗服务端 AI 需求大、政策顺风仍在；只要执行顶住，市场还容得下一个规模化赢家。
  topRisks:
    - 子公司收入、毛利率、留存和集中度仍未披露，估值精度偏弱。
    - SenseTime Group 的制裁与监控业务阴影仍可能影响交易对手信任、合作伙伴关系和国际扩张。
    - 公司同时面对影像专科厂商、平台生态和低成本模型接入的竞争。
    - 即便技术够强，医疗 AI 商业化仍可能被临床验证、采购拖延和监管负担卡住。
    - 如果太多流程跑在验证和实施能力前面，平台宽度会反过来变成执行复杂度。
  unresolvedGaps:
    - 子公司层面的收入结构、毛利率、烧钱速度和现金跑道仍未公开。
    - 还需要续约、模块挂载和客户集中度数据，才能检验产品宽度是否真的带来可持续账户经济性。
    - 最近几轮融资背后的具体条款、治理权利和与母公司的关联协议仍未披露。
    - 整个产品组合里，模块级验证深度和线上质量控制尚不可见。
    - 治理和合规是否与 SenseTime Group 切开，需要直接尽调证据。
