chapter:
  number: 6
  title: Customers
  summary: Public sources support a meaningful customer proof file for SenseTime Medical, especially across named hospitals and a live Singapore imaging workflow. The upside is that the evidence spans multiple workflows and geographies; the main unresolved issue is whether those proofs translate into diversified, recurring revenue with strong expansion and low churn.
sections:
- id: customer-segmentation
  title: Customer segmentation
  body: |-
    SenseTime Medical’s public customer story is clearly provider-led. The strongest evidence points to hospitals, hospital networks, imaging providers, and research-linked workflows rather than to consumer health distribution. That matters because provider customers can support larger contracts and deeper workflow embedding, but they also impose slower sales cycles and higher proof requirements.

    Within that provider set, tertiary hospitals still appear to be the core archetype. They have the imaging intensity, operational complexity, and digital maturity to absorb a broad AI suite. Overseas imaging customers play a different role: they look like narrow, high-credibility beachheads rather than full-platform accounts.

    Strategically, the customer mix is consistent with a platform thesis. The company is not trying to be a mass-market AI health app. It is trying to become infrastructure inside high-value clinical and operational workflows, with research and international imaging as adjacent wedges.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU026
  - CU027
  tableRefs:
  - TU001
  figureRefs:
