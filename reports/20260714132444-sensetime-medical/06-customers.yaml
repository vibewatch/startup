- id: adoption-trajectory
  title: Adoption trajectory
  body: |-
    The public adoption trajectory is more convincing than a simple logo slide because it spans different workflow types and geographies. Named hospital proofs appear alongside research and international imaging references, which suggests the company is testing more than one commercialization path at once. That diversity is helpful because it reduces dependence on a single domestic clinical wedge.

    Ruijin, Kiang Wu, and Parkway are especially useful because they anchor different meanings of adoption. Ruijin suggests deep clinical workflow value. Kiang Wu suggests multi-product and multi-year embedding. Parkway suggests repeatable overseas throughput in a regulated imaging workflow. Together they paint a stronger picture than any one site would on its own.

    The limitation is that public breadth is not the same as measured monetization depth. Investors can see that deployments exist, but they cannot yet see how quickly pilots become recurring contracts or how often first modules lead to broader account expansion.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU031
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof
  title: Named customer proof
  body: |-
    Named customer proof is the strongest part of the public customer file. Ruijin Hospital is important because it signals use in a serious clinical environment, not merely a demo setting. Kiang Wu Hospital matters because multi-product and multi-year language is a rough proxy for embeddedness. Parkway Radiology matters because recurring patient throughput is more informative than a one-time announcement.

    The non-hospital proofs matter too. Roche-linked research workflows show the platform can support knowledge and protocol tasks, while the Indonesia pilot and Shanghai Shenkang collaboration suggest that the company’s customer-development motion can travel through both institutional partners and ecosystem relationships. These are not all equal proofs, but together they broaden the evidence base.

    What remains missing is a clean public mapping from named proof to revenue quality. The file is strong on what the company is doing with customers and weaker on what those customers are worth over time. That keeps the chapter positive on adoption but cautious on revenue durability.
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU029
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-and-expansion
  title: Retention and expansion
  body: |-
    Retention must be inferred indirectly because the public record does not disclose renewal or cohort metrics. The best proxies are recurring workflow throughput, multi-year deployments, and cross-module adoption. By that standard, the company has some encouraging signals, especially where sources imply repeat use or multiple products inside the same institution.

    Even so, concentration and churn risk remain difficult to judge. A company can have many hospital relationships and still rely economically on a smaller subset of flagship accounts or channel partners. Likewise, hospitals can keep one workflow alive while delaying broader expansion if budgets tighten or proof requirements rise.

    The right diligence framing is therefore two-sided. There is enough public evidence to believe the company can win meaningful accounts and expand within them. There is not enough public evidence to assume low churn, strong NRR, or diversified revenue without seeing internal account and contract data. That missing evidence remains central to underwriting customer quality.
