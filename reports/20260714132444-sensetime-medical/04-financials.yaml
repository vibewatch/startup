- id: unit-economics
  title: Unit economics
  body: |-
    The unit-economic picture is best understood through workflow rather than through public ratios, because the public file gives no gross margin or retention data. The most important variables are integration burden, clinical validation cost, sales-cycle length, and the ease of expanding from one module to additional workflows inside the same account. Those variables determine whether medical AI behaves like scalable software or like recurring bespoke services.

    Several features push early economics in opposite directions. Long procurement cycles, solution engineering, and clinician onboarding increase customer-acquisition cost and delay payback. But once an account is live, additional modules should be cheaper to sell if the platform and trust layer are already accepted. That is the central economic bet behind a multi-module hospital suite.

    Investors should therefore treat the absence of public unit metrics as a meaningful diligence issue, not a routine private-company omission. In this category, weak implementation economics can survive for years behind strong technical narratives. The real test is whether the first module becomes a wedge into lower-cost account expansion.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI031
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI003
- id: cost-structure
  title: Cost structure
  body: |-
    Cost structure is likely heavier than horizontal software because medical AI requires more than model development. The company must support compute, clinical validation, enterprise integration, regulatory work, implementation labor, and ongoing support. Some of those costs may decline with scale, but others—particularly deployment and change management—stay stubbornly human-intensive.

    This is why the category can look more attractive in theory than in early financial reality. A vendor can own strong technology and still spend heavily to convert that technology into production hospital workflows. The presence of overseas imaging proof and broad domestic ambitions likely increases, not decreases, the need for implementation capability.

    The mitigating factor is that some cost buckets create barriers to entry. Validation, integration, and regulatory work are expensive, but they also make shallow competitors easier to dislodge. The core question is whether those costs are buying durable advantage or merely delaying margin expansion.
  claimRefs:
  - CI013
  - CI014
  - CI022
  - CI027
  - CI028
  - CI029
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: capital-adequacy
  title: Capital adequacy
  body: |-
    The company’s capital story is visibly stronger than its operating-disclosure story. Adjacent rounds arrived quickly, and public coverage suggests investors were willing to fund the company aggressively before it disclosed revenue, margin, or runway. That is a meaningful positive signal about perceived strategic value, especially in a category where long enterprise cycles can require patient capital.

    Even so, capital adequacy cannot be quantified precisely from public evidence. There is no disclosed burn, no hiring trajectory, and no subsidiary-level cash-flow view. The parent group’s filings are useful context because they show the broader SenseTime ecosystem managing losses and growth trade-offs, but they do not answer whether the medical spinout itself is approaching software leverage or still consuming capital like a heavy implementation business.

    The correct read is therefore balanced. Near-term financing risk appears reduced by recent investor support, but future financing quality will depend on whether the company can pair strategic narrative with measurable operating proof. That is the gap investors must close in diligence.
