  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, gross margin, net retention, deployment revenue mix, and cash burn at the subsidiary level.
    whyItMatters: Fundraising velocity and customer proof are visible, but valuation underwriting ultimately depends on the quality of recurring economics.
    diligencePath: Request board-level or monthly subsidiary financials with revenue by product line, gross profit, and sales efficiency.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full legal-entity chart, board roster, and investor-rights summary for the spinout after the Series A.
    whyItMatters: Capital came in quickly, but public reporting does not show control rights, protective provisions, or decision authority between parent and new investors.
    diligencePath: Request post-Series-A cap table, board composition, shareholder agreement summaries, and any parent-service agreements.
    relatedQuestionRefs:
    - QO003
    - QO008
    - QO015
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration and renewal data beneath the headline hospital-partner count.
    whyItMatters: A large partner count does not by itself prove durable revenue breadth or low concentration.
    diligencePath: Request top-20 customer exposure, renewal rates, module expansion history, and average deal size by hospital tier.
    relatedQuestionRefs:
    - QO016
    - QO018
