companyProfile:
  summary: SenseTime Medical is a Shanghai-based medical AI company spun out from SenseTime Group to build hospital-focused software spanning imaging, clinical workflow, patient-service management, and research-support tools. Public sources describe a broad suite built around multimodal models and the DaYi medical LLM, plus named proof points at Ruijin Hospital, Kiang Wu Hospital, Parkway Radiology, and Roche-linked workflows. The public record supports strong strategic promise, but leaves the core economics opaque.
  foundedDate: '2022-01-01'
  founders:
    - name: Zhang Shaoting
      role: CEO
      background: Computer-vision expert and former SenseTime executive with research credentials closely aligned to imaging and multimodal clinical AI.
      claimRefs: [CO006, CO007]
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: Multi-module hospital AI software including imaging AI, workflow copilots, patient-service tools, research assistants, and an agentic deployment platform built around the DaYi medical LLM.
  customerFocus: Tertiary hospitals, hospital systems, imaging providers, and research or pharma-linked clinical workflows, with an emerging Southeast Asia imaging beachhead.
  businessModel: Enterprise hospital AI software and workflow infrastructure monetized through customized platform packages, implementation, and expansion across modules; exact pricing and margins are undisclosed publicly.
  stage: Series A
  fundingStatus: Back-to-back late-2025 and 2026 rounds lifted the company into the unicorn cohort, but public evidence on terms and subsidiary operating metrics remains limited.
  disclosureProfile: private-undisclosed
  claimRefs: [CO003, CO011, CO012, CO013, CO016, CO017, CO018, CO025]
summary:
  headline: SenseTime Medical looks strategically promising enough to stay high on the diligence list, but not yet transparent enough to justify a high-conviction buy at its current private-market mark.
