- id: buyer-segmentation
  title: Buyer segmentation
  body: |-
    The market is segmented by buyer role, workflow, and willingness to operationalize AI, not just by specialty. Economic buyers are usually administrative or IT-linked stakeholders such as CIOs, CMIOs, department heads, or procurement teams. Daily users vary by module: radiologists and pathologists for imaging, surgeons for planning, triage or nursing teams for front-door workflows, and researchers for literature or protocol support.

    This segmentation matters because the payer changes by use case. A diagnostic-support module may be justified through department throughput or quality improvement, while a research assistant might be funded by pharma collaboration or study budgets. Patient-service automation can sit closer to hospital operational spending. A company that offers multiple modules can traverse these budget pools more easily than a pure point solution.

    The likely adoption path is therefore staged. High-volume tertiary hospitals adopt first, usually via one workflow with visible ROI. If performance and integration hold, deployment can expand into adjacent departments or administrative modules. That is precisely the kind of motion a broad hospital AI suite is designed to exploit.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  tableRefs:
  - TM003
  figureRefs:
  - FM004
- id: growth-drivers-and-constraints
  title: Growth drivers and constraints
  body: |-
    The strongest growth drivers are structural rather than cyclical. Provider labor pressure, demand for higher throughput, hospital digitization, and improving multimodal AI capabilities all support adoption. Chinese policy support and ongoing normalization of hospital AI spending add further tailwind, especially for systems that already have digital imaging and data infrastructure.

    The constraints are equally real. Procurement is slow, evidence requirements are rising, and privacy or data-governance rules make hospital deployment harder than generic enterprise copilots. Open-source model access also shifts the burden of proof: it is no longer enough to have a model. Vendors increasingly need integration depth, validation, and sales access to defend pricing and win repeat budgets.

    For diligence, this means the right question is not whether the market is large. It is whether SenseTime Medical can capture the budgets that clear these constraints faster than peers. The answer depends on clinical proof, workflow integration, regulatory progress, and buyer segmentation discipline, not on the size of the broadest AI healthcare TAM slide.
