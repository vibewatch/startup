- id: regulatory-and-compliance
  title: Regulatory and compliance
  body: |-
    Regulation is not a side issue for this stack; it is part of the product. The clearest public milestone is the Singapore HSA-certified chest CT workflow, which matters because it shows at least one product crossing into a defined overseas pathway. Chinese NMPA progression remains critical for the domestic market, while FDA and WHO guidance show the broader direction of travel for trustworthy medical AI.

    These frameworks matter technologically because they force companies to think about documentation, monitoring, auditability, and quality control. In clinical AI, a model that works in demos but lacks governance is not a shippable product. That is why compliance should be read as both a cost center and a barrier to entry.

    The core unresolved issue is module-level evidence depth. Public sources are good at describing the breadth of the stack and the direction of regulation, but they are weaker on independent performance detail across each module. Investors should therefore treat trust and evidence generation as a key diligence lane, not a post-investment clean-up project.
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE028
  - CE029
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: roadmap
  title: Roadmap
  body: |-
    The visible roadmap is toward a broader hospital operating platform anchored by DaYi, multimodal models, and configurable agents. Rather than adding isolated features forever, the company appears to be aiming for an infrastructure role inside hospital AI operations—one where hospitals can build or tailor workflows on top of the underlying model stack.

    That ambition lines up with the idea of a medical world model and with the dual-platform design described in retained coverage. If executed well, it could move the company from selling modules to becoming a deeper workflow layer. That would be strategically powerful because it creates more switching cost and more surface area for expansion.

    Execution risk remains high. A roadmap this broad can easily outrun validation capacity, regulatory readiness, or implementation bandwidth. The right diligence lens is therefore not whether the roadmap sounds large, but whether the company can prove module-level quality while still building the shared infrastructure that makes the platform thesis believable.
