  topStrengths:
    - >-
      Broad hospital AI platform scope across imaging, workflow, patient-service, and research use cases creates real
      land-and-expand potential.
    - >-
      Named customer proof points in major hospitals and a live Singapore imaging workflow show the story is more than
      fundraising hype.
    - >-
      Rapid support from healthcare, strategic, and regional investors suggests unusually strong external belief in the
      category position.
    - >-
      DaYi plus multimodal clinical models give the company a differentiated product narrative relative to narrow
      point-solution peers.
    - Large provider-side AI healthcare demand and policy tailwinds leave room for a scaled winner if execution holds.
  topRisks:
    - >-
      Subsidiary revenue, gross margin, retention, and concentration remain undisclosed, making valuation precision
      weak.
    - >-
      SenseTime Group's sanctions and surveillance overhang can still affect counterparty trust, partnerships, and
      international expansion.
    - >-
      The company faces simultaneous competition from imaging specialists, platform ecosystems, and lower-cost model
      access.
    - >-
      Medical AI commercialization can stall on clinical validation, procurement drag, and regulatory burden even when
      the technology is strong.
    - >-
      Platform breadth can become execution complexity if too many workflows outrun validation and implementation
      capacity.
  unresolvedGaps:
    - Subsidiary-level revenue mix, gross margin, burn, and runway are still unavailable publicly.
    - >-
      Renewal, module attach, and customer concentration data are needed to test whether breadth really drives durable
      account economics.
    - Exact financing terms, governance rights, and parent-linked agreements behind recent rounds remain undisclosed.
    - Module-level validation depth and live quality controls are not yet visible across the whole product portfolio.
    - Governance and compliance separation from SenseTime Group need direct diligence evidence.
