  figureRefs:
  - FR002
- id: market-and-competitive-risks
  title: Market and competitive risks
  body: |-
    Market risk is driven by crowding and by buyer conservatism. SenseTime Medical does not face one competitor class; it faces imaging specialists, platform ecosystems, open-model substitution pressure, and hospital budget discipline all at once. That means the company must prove not only that its technology works, but that it is the most trustworthy and economically sensible choice in each workflow.

    Competition also interacts with financing risk. Rapid private-market support can mask the fact that future investors may want clearer proof on margins, retention, and customer concentration before continuing to fund the same story at richer prices. In other words, competition is not just about product share. It is also about how much proof the market demands before it continues underwriting platform ambition.

    The best mitigation is focus: deeper workflow integration, stronger validation, and better monitoring of real account expansion. Without that, large TAM and strong fundraising can coexist with fragile commercial outcomes.
  claimRefs:
  - CR013
  - CR014
