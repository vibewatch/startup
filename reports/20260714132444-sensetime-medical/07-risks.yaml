- id: geopolitical-and-parent-company-risks
  title: Geopolitical and parent-company risks
  body: |-
    The parent-company connection creates a risk layer that most medical AI startups do not have to manage. SenseTime’s surveillance associations and U.S. sanctions history can shape counterparty trust, partner willingness, and the spinout’s perceived strategic risk even if the product set is clinically oriented. This is not a theoretical issue: it is the most clearly documented adverse fact in the entire report.

    The geopolitical layer also interacts with supply chain and compute policy. A platform that depends on continued model advancement is more exposed to infrastructure and policy constraints than a static software workflow. That can influence cost, performance, and roadmap speed even if no customer is directly blocked.

    For diligence, the implication is clear. Investors need evidence of governance separation, disciplined internationalization, and proof that major workflows can scale despite this overhang. If scaled deployments stall because geopolitical, regulatory, or trust frictions keep compounding, the thesis weakens across multiple chapters at once.
