              Retention must be inferred indirectly because the public record does not disclose renewal or cohort
              metrics. The best proxies are recurring workflow throughput, multi-year deployments, and cross-module
              adoption. By that standard, the company has some encouraging signals, especially where sources imply
              repeat use or multiple products inside the same institution.


              Even so, concentration and churn risk remain difficult to judge. A company can have many hospital
              relationships and still rely economically on a smaller subset of flagship accounts or channel partners.
              Likewise, hospitals can keep one workflow alive while delaying broader expansion if budgets tighten or
              proof requirements rise.


