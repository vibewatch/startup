  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model
        blocks:
          - type: paragraph
            body: >-
              Public materials do not disclose the company’s actual revenue lines, but they do reveal enough product
              structure to infer the outline of a business model. SenseTime Medical appears to monetize through
              enterprise hospital software packages, implementation work, support, and potentially project-based
              research or pharma workflows. That is a very different profile from a consumer AI app, and it matters
              because enterprise hospital revenue is usually slower to book but potentially more durable.


              The likely pricing structure is customized rather than catalog-based. Hospitals buying imaging, workflow,
              and LLM-enabled tools tend to negotiate around module scope, deployment burden, and support commitments.
              That means early contracts can look lumpy from the outside even when the underlying economic logic is
              recurring. It also means public observers cannot benchmark the company using simple seat-based software
              analogies.


              The positive interpretation is that a broad suite creates cross-sell potential once one workflow is live.
              The negative interpretation is that breadth can mask a services-heavy operating model. Without disclosed
              contract structure, the right diligence stance is to treat recurring-software leverage as plausible but
              unproven.
