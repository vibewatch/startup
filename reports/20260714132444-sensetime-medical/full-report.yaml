      - number: '1.3'
        title: Funding and capitalization
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical’s financing cadence is unusually fast for a company founded in 2022. Coverage indicates
              an early capital base above RMB100 million, a November 2025 Pre-A+ round worth hundreds of millions of
              yuan, and an April 2026 Series A above RMB500 million. Taken together, multiple outlets converge on
              roughly $141 million raised within about six months, which is enough to move the company from an internal
              spinout narrative into the private-market unicorn conversation.


              The composition of the cap table is as important as the amount. The investor list combines strategic
              Chinese institutions, healthcare-oriented financial capital, Singapore-linked regional investors, and
              state-ecosystem money. That mix suggests the company is being underwritten not only as a model builder but
              also as a hospital-distribution and regional-expansion platform. Raffles Healthcare Growth Fund and Lion
              Partners Capital, in particular, are strategically notable because they line up with the company’s visible
              Singapore beachhead.


              The main caution is valuation velocity. Reporting around the pre-Series A close referenced a valuation
              above RMB3 billion, while post-Series A coverage put the company at around $1 billion. A rapid step-up is
              not inherently wrong for a category leader, but with no public revenue or margin disclosure it means
              outside investors are effectively paying for expected dominance, not demonstrated economics.
