      - number: '2.3'
        title: Buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              The market is segmented by buyer role, workflow, and willingness to operationalize AI, not just by
              specialty. Economic buyers are usually administrative or IT-linked stakeholders such as CIOs, CMIOs,
              department heads, or procurement teams. Daily users vary by module: radiologists and pathologists for
              imaging, surgeons for planning, triage or nursing teams for front-door workflows, and researchers for
              literature or protocol support.


              This segmentation matters because the payer changes by use case. A diagnostic-support module may be
              justified through department throughput or quality improvement, while a research assistant might be funded
              by pharma collaboration or study budgets. Patient-service automation can sit closer to hospital
              operational spending. A company that offers multiple modules can traverse these budget pools more easily
              than a pure point solution.


              The likely adoption path is therefore staged. High-volume tertiary hospitals adopt first, usually via one
              workflow with visible ROI. If performance and integration hold, deployment can expand into adjacent
              departments or administrative modules. That is precisely the kind of motion a broad hospital AI suite is
              designed to exploit.
