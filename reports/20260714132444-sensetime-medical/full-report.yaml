  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical competes in a market that is crowded in multiple dimensions at once. There are
              imaging-first specialists, broader medical AI startups, integrated equipment vendors, internet-platform
              health businesses, and now general-purpose model providers pushing toward hospital workflows. That means
              no single competitor defines the field; instead, the company encounters different rivals depending on the
              workflow, budget owner, and required level of clinical validation.


              Imaging remains the cleanest starting point for direct comparison. Hospitals already understand radiology
              workflow pain, regulators have clearer frames for imaging-related products, and several established peers
              use imaging as their wedge. But SenseTime Medical’s own public narrative is broader than imaging, so the
              company also invites comparison with multi-module hospital platforms and with digital-health ecosystems
              that can spread AI features across large user bases.


              The result is a market where positioning discipline matters. If SenseTime Medical is treated as just
              another model vendor, it will look crowded. If it is treated as a hospital workflow platform with imaging
              credibility, assistant features, and deployment infrastructure, its competitive set becomes broader but
              its differentiation logic improves.
