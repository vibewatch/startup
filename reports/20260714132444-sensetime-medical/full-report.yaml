      - number: '4.3'
        title: Cost structure
        blocks:
          - type: paragraph
            body: >-
              Cost structure is likely heavier than horizontal software because medical AI requires more than model
              development. The company must support compute, clinical validation, enterprise integration, regulatory
              work, implementation labor, and ongoing support. Some of those costs may decline with scale, but
              others—particularly deployment and change management—stay stubbornly human-intensive.


              This is why the category can look more attractive in theory than in early financial reality. A vendor can
              own strong technology and still spend heavily to convert that technology into production hospital
              workflows. The presence of overseas imaging proof and broad domestic ambitions likely increases, not
              decreases, the need for implementation capability.


              The mitigating factor is that some cost buckets create barriers to entry. Validation, integration, and
              regulatory work are expensive, but they also make shallow competitors easier to dislodge. The core
              question is whether those costs are buying durable advantage or merely delaying margin expansion.
