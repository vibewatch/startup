      - number: '5.3'
        title: Regulatory and compliance
        blocks:
          - type: paragraph
            body: >-
              Regulation is not a side issue for this stack; it is part of the product. The clearest public milestone is
              the Singapore HSA-certified chest CT workflow, which matters because it shows at least one product
              crossing into a defined overseas pathway. Chinese NMPA progression remains critical for the domestic
              market, while FDA and WHO guidance show the broader direction of travel for trustworthy medical AI.


              These frameworks matter technologically because they force companies to think about documentation,
              monitoring, auditability, and quality control. In clinical AI, a model that works in demos but lacks
              governance is not a shippable product. That is why compliance should be read as both a cost center and a
              barrier to entry.


              The core unresolved issue is module-level evidence depth. Public sources are good at describing the
              breadth of the stack and the direction of regulation, but they are weaker on independent performance
              detail across each module. Investors should therefore treat trust and evidence generation as a key
              diligence lane, not a post-investment clean-up project.
