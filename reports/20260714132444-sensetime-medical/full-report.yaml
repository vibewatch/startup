      - number: '4.2'
        title: Unit economics
        blocks:
          - type: paragraph
            body: >-
              The unit-economic picture is best understood through workflow rather than through public ratios, because
              the public file gives no gross margin or retention data. The most important variables are integration
              burden, clinical validation cost, sales-cycle length, and the ease of expanding from one module to
              additional workflows inside the same account. Those variables determine whether medical AI behaves like
              scalable software or like recurring bespoke services.


              Several features push early economics in opposite directions. Long procurement cycles, solution
              engineering, and clinician onboarding increase customer-acquisition cost and delay payback. But once an
              account is live, additional modules should be cheaper to sell if the platform and trust layer are already
              accepted. That is the central economic bet behind a multi-module hospital suite.


              Investors should therefore treat the absence of public unit metrics as a meaningful diligence issue, not a
              routine private-company omission. In this category, weak implementation economics can survive for years
              behind strong technical narratives. The real test is whether the first module becomes a wedge into
              lower-cost account expansion.
