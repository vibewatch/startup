            body: >-
              Scenario analysis is the right tool because the most important variables are still unresolved states
              rather than disclosed facts. The bull case assumes flagship customer proof compounds into broader module
              expansion, that overseas narrow workflows travel, and that financial disclosure eventually shows
              software-like leverage. Under that path, today’s private pricing could look justified in hindsight.


              The base case is more modest. It assumes the company remains strategically important and continues to win
              support, but that monetization and validation scale more gradually than the market’s excitement initially
              implied. Under that path, the business can still be good while the entry case remains merely fair or
              stretched.


              The bear case does not require technological failure. It only requires a combination of slower deployment,
              ongoing opacity, competitive compression, or geopolitical friction sufficient to keep proofs narrow and
              economic quality unproven. That is why scenario range matters more than false precision.
