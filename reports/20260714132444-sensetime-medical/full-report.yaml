      - number: '5.2'
        title: Technology architecture
        blocks:
          - type: paragraph
            body: >-
              The technology architecture is built around more than one model. Public materials position DaYi as the
              medical LLM layer, trained on a large Chinese medical corpus and designed for perception, reasoning, and
              planning. Alongside that sits a multimodal imaging stack focused on detection, segmentation,
              classification, and learning in settings where high-quality labeled data may be limited.


              What is most interesting is the attempt to convert these models into operating infrastructure. The Medical
              Agentic OS concept suggests the company wants a reusable environment for building agents and
              productionizing model applications, not just a series of standalone demos. That architecture, if real in
              production, is more platform-like than many peer medical-AI stories.


              The architectural upside is reusability. The architectural risk is complexity. A dual-platform system only
              creates value if hospitals can actually use it to stand up and maintain workflows with acceptable
              reliability and governance. The public record supports the ambition, but not yet independent proof of how
              broadly the architecture works in the field.
