  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio
        blocks:
          - type: paragraph
            body: >-
              The public product story is already broader than a classic imaging-AI startup. Retained sources describe a
              hospital suite that spans imaging, workflow, patient-service management, research assistance, and
              deployment infrastructure. That breadth matters because it changes how the company should be evaluated:
              not as one model seeking one reimbursement path, but as a platform attempting to occupy multiple points in
              the clinical workflow.


              Imaging still appears to be the core wedge. It is the part of the stack with the clearest regulatory and
              workflow logic, and it is also the most natural bridge from SenseTime’s computer-vision heritage into
              healthcare. But public coverage makes clear that the company is not trying to stop there. Research
              assistants, documentation, triage, and patient-management tools all widen the platform narrative.


              Strategically, that breadth is attractive because it supports land-and-expand behavior inside hospitals.
              It is also risky because each additional module raises the burden of validation, product management, and
              implementation. The portfolio therefore looks promising, but only if breadth converts into repeatable
              deployment quality.
