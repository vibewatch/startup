      - number: '3.3'
        title: Platform and tech giant competition
        blocks:
          - type: paragraph
            body: >-
              The company also operates in the shadow of much larger players. United Imaging matters because integrated
              hardware and software vendors can place AI into existing imaging relationships, which lowers procurement
              friction. Baidu Health, Alibaba Health, and Tencent Miying matter for a different reason: they have reach,
              data surfaces, and adjacent budgets that can support experimentation or cross-subsidized product
              expansion.


              At the same time, size alone does not settle competition in clinical settings. Provider adoption still
              depends on evidence, workflow integration, procurement, and trust. A giant platform can have reach and
              still underperform in a tightly validated hospital workflow. That is why platform incumbents are a threat,
              but not an automatic winner-take-all outcome.


              Open model access adds a third pressure point. Basic assistant features are easier to copy than deeply
              integrated clinical workflows. This pushes every vendor, including SenseTime Medical, to defend the part
              of the stack where model access alone is not enough.
