            body: >-
              The right public recommendation is research-more, with medium confidence and a stretched valuation stance.
              That does not mean the company is weak. It means the company’s strategic quality is easier to observe than
              the economics needed to underwrite a premium private mark with conviction. A disciplined investor should
              want the next layer of proof before leaning further in.


              What would change the call is also clear. Better subsidiary disclosure on revenue mix, retention, margins,
              and customer concentration would directly improve valuation precision. Evidence that named customer proofs
              expand across modules would strengthen the platform thesis. Greater clarity on governance separation from
              the parent would reduce a unique overhang that many peers do not face.


              Until then, the company is best treated as a high-potential but evidence-incomplete opportunity. The
              recommendation is therefore not avoid. It is to continue diligence aggressively, keep price sensitivity
              high, and upgrade only if the next refresh closes the most important operating gaps.
