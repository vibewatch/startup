      - number: '3.2'
        title: Direct competitors
        blocks:
          - type: paragraph
            body: >-
              The direct peer group is led by medical-AI specialists whose products map most closely to hospital
              budgets. Infervision is the clearest benchmark because it has long positioned around clinical imaging and
              has built a recognizable enterprise brand. DeepCare also fits the specialist mold, though it appears
              narrower. Yitu Medical belongs in the comparison set because it pursued a broader AI-medical platform
              story earlier, even if later market discussion focused more heavily on commercialization pressure.


              What distinguishes SenseTime Medical from these direct peers is the attempt to connect specialist clinical
              AI with a broader hospital operating stack. Public materials emphasize DaYi, workflow breadth, and a
              multi-module hospital suite rather than a single diagnostic task. In theory, that gives the company more
              account-expansion potential than a pure point solution.


              In practice, that advantage only matters if breadth converts into deployments and retention. Hospitals do
              not buy platform narratives for their own sake. They buy products that integrate, validate, and save time.
              So the key direct-competition question is whether SenseTime Medical’s breadth creates superior stickiness
              or simply broader implementation burden.
