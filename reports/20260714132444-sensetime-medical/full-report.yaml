  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              The largest regulatory and legal risk in the file does not come from a normal product issue. It comes from
              SenseTime Group’s sanction and trade-restriction history, which remains a reputational and geopolitical
              overhang for the medical spinout. Even if SenseTime Medical is not separately named, cross-border
              customers, partners, and suppliers may still view the business through the parent’s risk lens.


              Beyond geopolitics, the company faces the ordinary but still material regulatory burden of medical AI.
              NMPA-style progression, overseas device pathways, and lifecycle governance expectations can all slow
              commercialization if evidence is thin or product scope moves faster than regulators are comfortable with.
              In this category, regulation does not only constrain launch timing; it constrains how the product must be
              designed and monitored.


              Data-governance risk is the third pillar. A hospital AI platform touching sensitive clinical data must
              operate under much tighter privacy and accountability expectations than a generic enterprise copilot. That
              turns legal and regulatory discipline into an operating requirement, not a check-box exercise.
