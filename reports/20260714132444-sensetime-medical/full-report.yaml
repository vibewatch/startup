            body: >-
              The visible roadmap is toward a broader hospital operating platform anchored by DaYi, multimodal models,
              and configurable agents. Rather than adding isolated features forever, the company appears to be aiming
              for an infrastructure role inside hospital AI operations—one where hospitals can build or tailor workflows
              on top of the underlying model stack.


              That ambition lines up with the idea of a medical world model and with the dual-platform design described
              in retained coverage. If executed well, it could move the company from selling modules to becoming a
