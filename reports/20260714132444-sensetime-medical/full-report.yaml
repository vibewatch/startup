      - number: '4.4'
        title: Capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The company’s capital story is visibly stronger than its operating-disclosure story. Adjacent rounds
              arrived quickly, and public coverage suggests investors were willing to fund the company aggressively
              before it disclosed revenue, margin, or runway. That is a meaningful positive signal about perceived
              strategic value, especially in a category where long enterprise cycles can require patient capital.


              Even so, capital adequacy cannot be quantified precisely from public evidence. There is no disclosed burn,
              no hiring trajectory, and no subsidiary-level cash-flow view. The parent group’s filings are useful
              context because they show the broader SenseTime ecosystem managing losses and growth trade-offs, but they
              do not answer whether the medical spinout itself is approaching software leverage or still consuming
              capital like a heavy implementation business.


              The correct read is therefore balanced. Near-term financing risk appears reduced by recent investor
              support, but future financing quality will depend on whether the company can pair strategic narrative with
              measurable operating proof. That is the gap investors must close in diligence.
