      - number: '3.4'
        title: Competitive positioning
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical’s best public positioning is as a hospital AI platform that combines imaging roots,
              medical-LLM breadth, and deployment ambitions across care, patient-service, and research workflows. That
              is a stronger story than a single model or one-off imaging plugin, because it implies account expansion
              and larger contract scope if deployments go well.


              The weakness is that public evidence for the strategy is stronger than public evidence for the economics.
              There is little pricing transparency, limited renewal evidence, and no clean public demonstration that
              breadth produces meaningfully better retention or share of wallet than narrower competitors. In crowded
              enterprise software markets, that missing proof matters.


              Investors should therefore treat competitive differentiation as plausible but not yet fully proven. The
              right question is not whether the company has competitors—it clearly does. The real question is whether
              its broader workflow scope turns into higher-quality enterprise outcomes before larger platforms or
              sharper point solutions crowd the most profitable wedges.
