chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and structure
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical enters the market as a deliberately separated healthcare AI company rather than a small
              vertical experiment hidden inside a broader AI conglomerate. The public reporting is consistent on the
              essentials: the business was founded in 2022 in Shanghai, carries the SenseTime Medical / 商汤医疗 brand, and
              is positioned as an independent entity created out of SenseTime Group’s 1+X strategy. That strategic
              framing matters because it implies the parent wanted a more focused, financeable operating unit for
              regulated clinical workflows.


              The business model described across fundraising coverage is broader than a single image-reading algorithm.
              Sources describe a hospital software suite spanning imaging AI, pathology support, patient-service
              workflows, documentation, research assistance, and infrastructure for model deployment. That breadth is
              strategically important because it increases the chance that the company can sell into hospital budgets as
              workflow infrastructure instead of depending on a narrow reimbursement niche.


              At the same time, the company’s public identity is not fully de-coupled from the parent. The spinout still
              appears primarily through SenseTime-controlled web surfaces and through outside media reporting rather
              than a fully built-out independent corporate disclosure stack. For investors, that creates a mixed read:
              the spinout clearly has its own financing story, but the public-facing governance and legal separation
              remain less legible than the capital-raising narrative.
