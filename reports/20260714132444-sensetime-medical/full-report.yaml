      - number: '7.2'
        title: Operational and technical risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, the biggest risk is complexity. A broad platform spanning imaging, workflows, and
              LLM-enabled products creates more ways to win, but it also creates more ways to fail. Every module needs
              validation, integration, support, and quality control. The technical challenge is therefore not only model
              performance; it is the operational burden of making many workflows safe and reliable at once.


              Trust risk is equally central. Medical AI systems can fail through hallucination, poor interpretability,
              or weak change controls even when their benchmark results look good. Academic and governance sources
              consistently point toward lifecycle monitoring and workflow accountability as the decisive factors, which
              means technical quality and operating quality cannot be separated.


              Procurement and evidence burden compound the problem. Hospitals move slowly, integrations are painful, and
              clinical proof can consume large amounts of management attention. That combination can turn a technically
              impressive roadmap into a slower and costlier execution path than venture narratives imply.
