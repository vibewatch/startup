  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical should be framed against the provider-side medical AI software market, not against every
              category that uses AI in health. The company’s product story spans imaging, clinical workflow assistance,
              patient-service support, and research tooling. That means the relevant market boundary is hospital and
              provider software spend that can absorb AI-enabled products, especially where clinical throughput,
              documentation, and workflow quality matter.


              This matters because broad healthcare AI market reports often combine very different buckets. Some include
              pharma discovery, medical devices, wellness apps, or general-purpose enterprise AI. Those categories can
              provide directional context, but they are not all equally relevant to a hospital-centered software
              company. A tighter market definition keeps diligence from confusing a large headline TAM with a usable
              near-term revenue pool.


              The practical substitute set also clarifies the boundary. SenseTime Medical does not only compete with
              other AI startups; it also competes with manual clinician labor, incremental upgrades from HIS vendors,
              embedded features from imaging incumbents, and internal hospital workflow tools. That is why the company’s
              value proposition has to be framed as measurable workflow improvement, not just algorithmic novelty.
            claimRefs:
