            body: >-
              SenseTime Medical’s public customer story is clearly provider-led. The strongest evidence points to
              hospitals, hospital networks, imaging providers, and research-linked workflows rather than to consumer
              health distribution. That matters because provider customers can support larger contracts and deeper
              workflow embedding, but they also impose slower sales cycles and higher proof requirements.


              Within that provider set, tertiary hospitals still appear to be the core archetype. They have the imaging
              intensity, operational complexity, and digital maturity to absorb a broad AI suite. Overseas imaging
              customers play a different role: they look like narrow, high-credibility beachheads rather than
              full-platform accounts.


              Strategically, the customer mix is consistent with a platform thesis. The company is not trying to be a
              mass-market AI health app. It is trying to become infrastructure inside high-value clinical and
              operational workflows, with research and international imaging as adjacent wedges.
