            body: >-
              The anti-thesis is not that the company lacks promise. It is that public evidence on economics remains far
              weaker than public evidence on strategic narrative. Revenue, margin, retention, and concentration are
              precisely the metrics investors need to judge a rich private mark, yet they are still unavailable. That
              alone keeps conviction below buy territory.


              The second anti-thesis is that this is a hard category operationally. Procurement cycles are long,
              validation burdens are real, and geopolitical sensitivity tied to the parent can complicate international
              trust. A company can be technically strong and still disappoint investors if these frictions slow its path
              to durable deployment.


              The third anti-thesis is competition. A broad platform story is strategically attractive, but it also
              means the company meets many rival archetypes at once. Without operating proof, breadth can read either as
              moat or as complexity. That ambiguity is why the recommendation should remain disciplined.
