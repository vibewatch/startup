      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are structural rather than cyclical. Provider labor pressure, demand for
              higher throughput, hospital digitization, and improving multimodal AI capabilities all support adoption.
              Chinese policy support and ongoing normalization of hospital AI spending add further tailwind, especially
              for systems that already have digital imaging and data infrastructure.


              The constraints are equally real. Procurement is slow, evidence requirements are rising, and privacy or
              data-governance rules make hospital deployment harder than generic enterprise copilots. Open-source model
              access also shifts the burden of proof: it is no longer enough to have a model. Vendors increasingly need
              integration depth, validation, and sales access to defend pricing and win repeat budgets.


              For diligence, this means the right question is not whether the market is large. It is whether SenseTime
              Medical can capture the budgets that clear these constraints faster than peers. The answer depends on
              clinical proof, workflow integration, regulatory progress, and buyer segmentation discipline, not on the
              size of the broadest AI healthcare TAM slide.
