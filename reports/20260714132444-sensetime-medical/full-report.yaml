      - number: '1.4'
        title: Milestones and scale
        blocks:
          - type: paragraph
            body: >-
              The strongest operating proof in the public file is breadth across hospitals and use cases, not audited
              financial disclosure. Round coverage repeatedly pointed to more than 500 hospital partners and more than
              40 clinical AI modules, which implies the company has moved beyond one-off pilots and into a multi-product
              deployment model. Named proof points make that more tangible: Ruijin Hospital, Kiang Wu Hospital, Parkway
              Radiology, Roche-linked research workflows, and Shanghai Shenkang each anchor a different part of the
              story.


              Those proof points also show a business that is broader than mainland radiology. Macau suggests
              multi-product hospital embedding, Singapore suggests regulatory-grade overseas imaging deployment, Roche
              suggests pharma and research workflow monetization, and Shenkang suggests privileged access to future
              training data and hospital relationships. The operating narrative is therefore one of platform expansion
              across care delivery, not just algorithm point solutions.


              The biggest negative milestone still sits outside the subsidiary itself. SenseTime Group’s U.S. sanctions
              history and still-sensitive geopolitical profile remain part of the diligence record, while parent-company
              disclosure continues to show losses even as results improve. Combined with the absence of disclosed
              startup-level revenue, that means the company’s scale story is real but still incomplete from an
              investability perspective.
