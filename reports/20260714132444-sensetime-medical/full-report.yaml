      - number: '1.2'
        title: Leadership and team
        blocks:
          - type: paragraph
            body: >-
              The leadership story is anchored by CEO Zhang Shaoting, whose background is one of the clearest
              founder-market-fit signals in the file. Public records and academic profiles tie him to high-level
              computer-vision work and to SenseTime’s own technical bench, which helps explain why the company leads
              with imaging, multimodal AI, and hospital decision support rather than consumer health applications. In
              other words, the company’s product direction is consistent with the training of its best-known executive.


              That same concentration cuts both ways. Because public materials spotlight Zhang far more than they
              disclose a broader executive bench, investors still have limited visibility into the commercial,
              regulatory, clinical-validation, and enterprise-delivery leaders beneath him. For a hospital software
              company selling across imaging, patient services, and research workflows, that missing bench detail
              matters almost as much as model quality.


              The result is a leadership picture that is strong on technical credibility and comparatively weak on
              governance transparency. There is enough to believe the company has real domain depth, but not enough
              public evidence to map decision rights, succession coverage, or how much commercial execution depends on a
              small cluster of senior operators.
