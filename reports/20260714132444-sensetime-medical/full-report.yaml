      - number: '2.2'
        title: Sizing and growth
        blocks:
          - type: paragraph
            body: >-
              Retained market sources support a large and fast-growing market, but the numbers need careful
              interpretation. China AI healthcare appears to sit around a roughly $4 billion 2024 base and grow toward
              the mid-teens billions by 2030, while global AI healthcare forecasts are much larger still. Those
              estimates are useful as directional evidence that demand is not niche.


              What they do not do is define SenseTime Medical’s real short-term serviceable market. The company’s
              near-term monetization is more likely to come from higher-tier hospitals, imaging-intensive departments,
              and digitally mature systems that can run pilots, integrate models, and buy multiple modules. In other
              words, the true SAM is narrower than the full China AI healthcare headline and much narrower than global
              AI-in-healthcare totals.


              This is why a multi-lens approach is better than any one top-down number. Provider count, hospital
              digitization, workflow intensity, regulatory path, and budget ownership all matter. Investors should
              therefore read the TAM as supportive context, but focus diligence on which slices of that TAM convert into
              repeated hospital budgets within the next three to five years.
