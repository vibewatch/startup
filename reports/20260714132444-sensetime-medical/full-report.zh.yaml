      - number: '1.2'
        title: 领导层与团队
        blocks:
          - type: paragraph
            body: >-
              领导层叙事的锚点是 CEO 张少霆，他的背景是文件里最清晰的创始人—市场匹配信号之一。公开记录和学术资料把他与高水平计算机视觉研究、以及 SenseTime
              自身技术班底联系在一起，也解释了公司为什么从影像、多模态 AI 和医院决策支持切入，而不是做消费健康应用。换句话说，公司的产品方向与最知名高管的训练路径一致。


              这种集中度也有两面性。公开材料对张少霆着墨很多，但对更广泛的高管梯队披露很少，投资人仍难看清其下方的商业化、监管、临床验证和企业交付负责人。对于一家同时卖影像、患者服务和科研工作流的医院软件公司，这块缺失几乎和模型质量同样重要。


              因此，领导层画像的技术可信度很强，治理透明度相对薄弱。现有材料足以支持公司具备真实领域深度，但还不足以勾勒决策权、继任覆盖，或商业执行对少数资深操盘手的依赖程度。
