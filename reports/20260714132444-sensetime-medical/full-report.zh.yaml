            body: >-
              对这套栈来说，监管不是边缘问题，而是产品的一部分。最清晰的公开里程碑是新加坡 HSA 认证的胸部 CT 工作流，因为它说明至少一个产品进入了明确的海外路径。中国 NMPA 进展对国内市场仍然关键，FDA 和
              WHO 指南则显示可信医疗 AI 的更大方向。


              这些框架在技术上很重要，因为它们迫使公司思考文档、监控、可审计性和质量控制。在临床 AI 里，一个模型即便 demo 可用，缺少治理也不是可交付产品。因此，合规既应被视为成本中心，也应被视为进入壁垒。


              核心未解问题是模块级证据深度。公开资料擅长描述技术栈广度和监管方向，但在每个模块的独立性能细节上更弱。投资人因此应把信任和证据生成当作关键尽调线，而不是投后清理项目。
