      - number: '4.2'
        title: 单位经济
        blocks:
          - type: paragraph
            body: >-
              单位经济最好从工作流理解，而不是从公开比率理解，因为公开文件没有给出毛利率或留存数据。最重要的变量是集成负担、临床验证成本、销售周期长度，以及在同一账户内从一个模块扩展到更多工作流的难易度。这些变量决定医疗 AI
              更像可扩展软件，还是更像经常性的定制服务。


              几个特征把早期经济性拉向相反方向。长采购周期、解决方案工程和医生上手，会推高获客成本并推迟回本。但一个账户上线后，如果平台和信任层已经被接受，新增模块应该更便宜地卖进去。这就是多模块医院套件背后的核心经济赌注。


              因此，投资人应把公开单位指标缺失视为有意义的尽调问题，而不是普通私营公司遗漏。在这个品类里，薄弱的实施经济性可以躲在强技术叙事背后存活多年。真正的测试是，第一个模块能否成为低成本账户扩展的楔子。
