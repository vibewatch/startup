chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与结构
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical 进入市场时，不是藏在大型 AI 集团里的小型垂直试验，而是一个有意拆出的医疗 AI 公司。公开报道在核心事实上一致：公司 2022 年成立于上海，使用 SenseTime
              Medical / 商汤医疗 品牌，并被定位为 SenseTime Group 1+X 战略下孵化出的独立主体。这个战略叙事重要，因为它暗示母公司希望为受监管临床工作流打造一个更聚焦、更容易融资的经营单元。


              各轮融资报道呈现的商业模式，也远不止单一阅片算法。资料描述的是一套医院软件组合，覆盖影像
              AI、病理支持、患者服务工作流、文书、科研辅助，以及模型部署基础设施。这个广度有战略意义：公司更有机会把产品卖进医院预算，成为工作流基础设施，而不是押注一个狭窄报销细分。


              同时，公司公开身份仍未完全与母公司切开。这家拆分公司主要出现在 SenseTime
              控制的网站界面和外部媒体报道中，还没有形成成熟的独立公司披露体系。投资人读到的是混合信号：它显然有自己的融资故事，但公开层面的治理和法律隔离，仍不如融资叙事清晰。
