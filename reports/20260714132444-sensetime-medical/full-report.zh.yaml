  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 为什么一家公司有前景，仍可能只值得继续研究。
    data:
      nodes:
        - id: a
          label: 产品和客户验证强
          description: 平台宽度和具名部署支撑战略前景。
        - id: b
          label: 大市场和投资人支持
          description: 品类空间和资本共同支撑上行叙事。
        - id: c
          label: 经济性不透明
          description: 收入、毛利率和留存仍未披露。
        - id: d
          label: 风险压顶
          description: 竞争、监管和母公司地缘政治让投资时点更复杂。
        - id: e
          label: 继续研究
          description: 需要更多证据，才值得转为买入。
      edges:
        - from: a
          to: e
          label: 只有前景还不够
        - from: b
          to: e
          label: 上行空间存在
        - from: c
          to: e
          label: 缺少精度
        - from: d
          to: e
          label: 需要风险纪律
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV013
      - CV014
