  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式
        blocks:
          - type: paragraph
            body: >-
              公开材料没有披露公司的实际收入线，但已经透露了足够的产品结构，可以推断商业模式轮廓。SenseTime Medical 看起来通过医院企业软件包、实施工作、支持服务，以及潜在的项目制科研或药企工作流变现。这与消费
              AI 应用截然不同，也很重要，因为医院企业收入通常确认更慢，但可能更耐久。


              可能的定价结构是定制化，而不是目录价。医院购买影像、工作流和由 LLM
              支持的工具时，往往围绕模块范围、部署负担和支持承诺谈判。这意味着早期合同从外部看会比较不均匀，即使底层经济逻辑具有经常性。也意味着公众观察者不能用简单席位制软件类比来给公司定标。


              正向解读是，宽套件在一个工作流上线后能创造交叉销售潜力。负向解读是，广度可能掩盖服务成分很重的经营模式。在合同结构未披露之前，正确尽调姿态是把经常性软件杠杆视为可信但未证实。
