      - number: '3.2'
        title: 直接竞争对手
        blocks:
          - type: paragraph
            body: >-
              直接同行由医疗 AI 专业厂商主导，它们的产品最贴近医院预算。Infervision 是最清晰的标尺，因为它长期围绕临床影像定位，并建立了可识别的企业品牌。DeepCare
              也符合专科厂商模型，尽管看起来更窄。Yitu Medical 也应放入比较集合，因为它更早讲过更宽的 AI 医疗平台故事，即便后来市场讨论更多聚焦商业化压力。


              SenseTime Medical 与这些直接同行的区别，在于它试图把专科临床 AI 连接到更宽的医院运营栈。公开材料强调
              DaYi、工作流广度和多模块医院套件，而不是单一诊断任务。理论上，这给公司带来的账户扩展潜力，高于纯点解决方案。


              实操中，只有当广度能转化为部署和留存时，这个优势才有意义。医院不会为了平台叙事本身买单。它们买的是能集成、能验证、能省时间的产品。因此，直接竞争的关键问题是：SenseTime Medical
              的广度是在创造更强粘性，还是只是在扩大实施负担。
