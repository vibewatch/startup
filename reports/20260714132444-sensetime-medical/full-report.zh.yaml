        title: 地缘政治与母公司风险
        blocks:
          - type: paragraph
            body: >-
              母公司关联创造了一层多数医疗 AI 初创公司不必处理的风险。SenseTime
              的监控联想和美国制裁历史，可能影响交易对手信任、伙伴意愿，以及拆分公司的感知战略风险，即便产品组合以临床为导向。这不是理论问题：它是整份报告里记录最清楚的不利事实。


              地缘政治层也会与供应链和算力政策相互作用。一个依赖持续模型进步的平台，比静态软件工作流更暴露在基础设施和政策约束之下。即使没有客户被直接阻断，这也可能影响成本、性能和路线图速度。


              对尽调而言，含义很清楚。投资人需要看到治理隔离证据、纪律化国际化，以及主要工作流能在这个悬置下继续规模化的证明。如果规模部署因地缘政治、监管或信任摩擦持续叠加而停滞，投资论点会同时在多个章节走弱。
