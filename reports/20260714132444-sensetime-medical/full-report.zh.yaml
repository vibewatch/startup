  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              文件中最大的监管和法律风险，并非普通产品问题，而是 SenseTime Group 的制裁和贸易限制历史。这个历史仍是医疗 spinout 的声誉和地缘政治悬置。即使 SenseTime Medical
              没有被单独点名，跨境客户、伙伴和供应商仍可能透过母公司的风险镜头看待这门业务。


              地缘政治之外，公司还面对医疗 AI 普通但仍重大的监管负担。NMPA
              式推进、海外器械路径和生命周期治理预期，如果证据薄弱或产品范围跑得比监管舒适区更快，都可能拖慢商业化。在这个品类里，监管不只约束上市节奏，也约束产品必须怎样设计和监控。


              数据治理风险是第三根支柱。一个接触敏感临床数据的医院 AI 平台，必须在比通用企业助手严得多的隐私和问责预期下运营。这会把法律和监管纪律变成经营要求，而不是勾选式流程。
