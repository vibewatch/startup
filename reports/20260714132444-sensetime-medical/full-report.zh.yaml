        title: 技术架构
        blocks:
          - type: paragraph
            body: >-
              技术架构不止围绕一个模型搭建。公开材料把 DaYi 定位为医疗 LLM 层，基于大型中文医学语料训练，面向感知、推理和规划。旁边是一套多模态影像栈，聚焦检测、分割、分类，以及在高质量标注数据可能有限的场景中学习。


              最有意思的是，公司试图把这些模型转成运营基础设施。Medical Agentic OS
              概念说明，公司想要的是一个可复用环境，用来构建智能体并把模型应用生产化，而不是一串独立演示。如果它在生产中真实可用，这种架构比许多同行医疗 AI 故事更像平台。


              架构上行来自可复用性，架构风险来自复杂性。双平台系统只有在医院确实能用它搭建并维护工作流、且可靠性和治理达到可接受水平时，才会创造价值。公开记录支持这个野心，但还没有独立证明架构在一线能跑多宽。
