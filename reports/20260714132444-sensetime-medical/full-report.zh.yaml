      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              运营上最大的风险是复杂性。一个横跨影像、工作流和 LLM-enabled
              产品的宽平台，创造了更多赢法，也创造了更多失败方式。每个模块都需要验证、集成、支持和质量控制。因此，技术挑战不只是模型表现，而是让许多工作流同时安全、可靠运行的运营负担。


              信任风险同样居中。医疗 AI 系统即便基准测试看起来不错，也可能因幻觉、可解释性弱或变更控制薄弱而失败。学术和治理资料持续指向生命周期监控和工作流问责是决定性因素，这意味着技术质量和运营质量无法分开。


              采购和证据负担会叠加这个问题。医院行动慢，集成痛苦，临床证明会吃掉大量管理层注意力。这个组合可能把技术上令人印象深刻的路线图，变成比风险投资叙事暗示更慢、更贵的执行路径。
