  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical 应放在医疗服务供给侧的医疗 AI 软件市场里审视，而不是和所有使用 AI
              的健康类别相提并论。公司的产品叙事覆盖影像、临床工作流辅助、患者服务支持和科研工具。因此，相关市场边界是医院和医疗服务提供方能够吸收 AI 产品的软件支出，尤其是那些临床吞吐量、文档处理和工作流质量很重要的场景。


              这一点重要，因为宽口径医疗 AI 市场报告常把差异很大的篮子混在一起。有些报告纳入药物发现、医疗器械、健康应用，或通用企业
              AI。这些类别能提供方向性背景，但并非都与一家医院中心型软件公司同等相关。更紧的市场定义，可以避免尽调把大标题 TAM 误读成可用的近期收入池。


              实际替代品集合也把边界说清了。SenseTime Medical 不只和其他 AI startup 竞争；它还在和临床医生手工劳动、HIS 厂商的增量升级、影像 incumbents
              的内嵌功能，以及医院内部工作流工具竞争。因此，公司的价值主张必须被表述为可衡量的工作流改善，而不只是算法新颖性。
