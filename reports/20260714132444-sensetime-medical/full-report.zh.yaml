      - number: '3.4'
        title: 竞争定位
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical 最好的公开定位，是一个把影像根基、医疗 LLM 广度，以及跨医疗、患者服务和科研工作流的部署野心结合起来的医院 AI
              平台。这个故事强于单一模型或一次性影像插件，因为如果部署顺利，它意味着账户扩展和更大的合同范围。


              弱点在于，公开证据对战略的支撑强过对经济性的支撑。定价透明度很低，续约证据有限，也没有干净的公开材料证明：广度能比更窄竞争对手带来显著更好的留存或钱包份额。在拥挤的企业软件市场里，这块缺失很要紧。


              因此，投资人应把竞争差异化视为可信但尚未完全证明。正确问题不是公司有没有竞争对手——显然有。真正的问题是，它更宽的工作流范围能否先于大型平台或更锋利的点解决方案，把最有利润的楔子挤满之前，转化为更高质量的企业结果。
