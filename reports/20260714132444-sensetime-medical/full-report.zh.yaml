      - number: '6.3'
        title: 具名客户验证
        blocks:
          - type: paragraph
            body: >-
              具名客户验证是公开客户文件中最强的一部分。瑞金医院重要，因为它说明产品进入了严肃临床环境，而不只是演示场景。镜湖医院重要，因为多产品和多年语言大致可作为嵌入程度的替代指标。Parkway Radiology
              重要，因为经常性患者吞吐量比一次性公告更有信息量。


              非医院验证同样重要。Roche
              联动科研工作流显示，平台可以支持知识和方案任务；印尼试点和上海申康合作则说明，公司的客户开发动作可以通过机构伙伴和生态关系两条路走出去。这些验证分量不完全相等，但合在一起拓宽了证据基础。


              仍然缺失的是从具名验证到收入质量的清晰公开映射。文件强在公司与客户一起做什么，弱在这些客户长期价值多少。因此，本章对采用保持正面，但对收入耐久性保持谨慎。
