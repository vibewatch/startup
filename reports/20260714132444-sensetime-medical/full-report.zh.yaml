  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 从首个医院切口到更深平台嵌入的典型路径。
    data:
      nodes:
        - id: j1
          label: 识别紧急工作流
          detail: 医院先从影像或规划等痛点入手。
          tone: neutral
        - id: j2
          label: 试点并验证
          detail: 临床和运营团队在真实工作流中评估模块。
          tone: warning
        - id: j3
          label: 转入日常使用
          detail: 吞吐量提升和流程集成，给出更强留存信号。
          tone: positive
        - id: j4
          label: 扩展到相邻模块
          detail: 如果信任和集成站得住，客户会增加更多工作流。
          tone: positive
        - id: j5
          label: 科研 / 行政延伸
          detail: 客户关系还能扩到知识或运营场景。
          tone: positive
        - id: j6
          label: 暂停或扩张
          detail: 预算、证据和治理决定扩张是否继续。
