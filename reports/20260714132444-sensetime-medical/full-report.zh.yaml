      - number: '1.3'
        title: 融资与资本结构
        blocks:
          - type: paragraph
            body: >-
              对一家 2022 年成立的公司而言，SenseTime Medical 的融资节奏异常快。报道显示，公司早期资本基础超过 RMB100 million，2025 年 11 月完成数亿元人民币 Pre-A+
              轮，2026 年 4 月又完成超过 RMB500 million 的 Series A 轮。多家媒体合并口径指向约 $141 million 在大约六个月内到位，这足以把公司从内部 spinout
              叙事推入私募市场独角兽讨论。


              股权结构的构成和金额同样重要。投资人名单混合了中国战略机构、医疗导向财务资本、新加坡相关区域投资人和国资生态资金。这个组合说明，公司不只被当作模型开发商承销，也被视为医院分发和区域扩张平台。Raffles
              Healthcare Growth Fund 和 Lion Partners Capital 尤其值得关注，因为它们与公司已经露出的新加坡滩头阵地相匹配。


              主要 caution 在估值速度。Pre-Series A 交割报道提到估值超过 RMB3 billion，Series A 后报道则把公司放在约 $1
              billion。品类龙头快速抬估值不必然错误，但在没有公开收入或利润率披露的情况下，外部投资人实际上是在为预期统治力付费，而不是为已验证经济性付费。
