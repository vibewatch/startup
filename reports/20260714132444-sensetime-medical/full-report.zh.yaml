  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合
        blocks:
          - type: paragraph
            body: >-
              公开产品故事已经比经典影像 AI startup
              更宽。保留资料描述了一套医院套件，覆盖影像、工作流、患者服务管理、科研辅助和部署基础设施。这个广度重要，因为它改变了公司应被评估的方式：不是一个模型寻找一个报销路径，而是一个平台试图占据临床工作流里的多个点位。


              影像看起来仍是核心楔子。这一栈层的监管和工作流逻辑最清楚，也是 SenseTime
              计算机视觉基因进入医疗保健最自然的桥梁。但公开报道清楚表明，公司并不打算止步于此。科研助手、文档、分诊和患者管理工具，都在拓宽平台叙事。


              从战略上看，广度有吸引力，因为它支撑医院内部先落地再扩展的动作。它也有风险，因为每增加一个模块，验证、产品管理和实施负担都会上升。因此，产品组合看起来有潜力，但前提是广度能转化为可重复的部署质量。
