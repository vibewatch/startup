      - number: '2.3'
        title: 买方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场按买方角色、工作流和把 AI 落地运营的意愿分层，而不只是按专科划分。经济买方通常是行政或 IT 相关利益方，例如
              CIO、CMIO、科室主任或采购团队。日常用户则随模块变化：影像模块对应放射科医生和病理科医生，规划工具对应外科医生，前门工作流对应分诊或护理团队，文献或方案支持对应研究人员。


              这种分层重要，因为不同使用场景对应不同付费方。诊断支持模块可能通过科室吞吐量或质量提升来证明投入合理；科研助手可能由药企合作或研究预算支付；患者服务自动化更接近医院运营支出。提供多个模块的公司，比纯点解决方案更容易穿越这些预算池。


              可能的采用路径因此是分阶段的。高流量三级医院先采用，通常从一个 ROI 可见的工作流切入。如果性能和集成站得住，部署可以扩展到相邻科室或行政模块。这正是宽医院 AI 套件试图吃到的动作。
