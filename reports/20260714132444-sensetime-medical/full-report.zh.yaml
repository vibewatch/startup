      - CV010
      - CV015
      - CV017
      - CV020
      - CV028
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 用区间框架判断当前私募定价在不同证据结果下意味着什么。
    data:
      items:
        - label: 乐观情形
          low: 1
          high: 3
          unit: x
          detail: 证据改善到足以证明当前价格有吸引力。
        - label: 基准情形
          low: 0.8
          high: 1.2
          unit: x
          detail: 当前价格大致匹配战略质量，但上行空间还不清楚。
        - label: 悲观情形
          low: 0.4
          high: 0.8
          unit: x
          detail: 相对当前私募估值，证据不及预期。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格的评分卡，用来衡量当前证据组合。
    data:
      items:
        - label: 市场质量
          value: High
          detail: 医疗机构 AI 市场大且在增长
          tone: positive
        - label: 产品验证
          value: High
          detail: 产品宽度强，并有具名工作流
          tone: positive
        - label: 经济性可见度
          value: Low
          detail: 收入和毛利率仍未披露
          tone: warning
        - label: 地缘政治干净度
          value: Low
          detail: 母公司阴影仍是差异化因素
          tone: warning
        - label: 估值舒适度
          value: Low to medium
          detail: 缺少更好指标时，当前估值看起来偏高
          tone: warning
        - label: 尽调杠杆
          value: High
          detail: 几个缺失数据集就可能实质性改变结论
          tone: neutral
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV013
      - CV014
      - CV021
      - CV040
