      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动来自结构性因素，而不是周期性因素。医疗服务提供方人手压力、更高吞吐量需求、医院数字化，以及多模态 AI 能力提升，都在支撑采用。中国政策支持和医院 AI
              支出的持续常态化，也提供额外顺风，尤其利好已经具备数字影像和数据基础设施的体系。


              约束同样真实。采购慢，证据要求提高，隐私和数据治理规则让医院部署比通用企业 copilots
              更难。开源模型可得性也改变了举证责任：有模型已不够。供应商越来越需要靠集成深度、验证和销售入口来守住定价并赢得重复预算。


              对尽调而言，正确问题不是市场是否大，而是 SenseTime Medical 能否比同行更快抓住那些能穿过这些约束的预算。答案取决于临床证明、工作流集成、监管进展和买方分层纪律，而不是最宽口径 AI 医疗保健
              TAM 幻灯片的大小。
