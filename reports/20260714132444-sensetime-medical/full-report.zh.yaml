      - number: '3.3'
        title: 平台与科技巨头竞争
        blocks:
          - type: paragraph
            body: >-
              公司也在更大玩家的阴影下运营。United Imaging 重要，因为软硬件一体厂商可以把 AI 放进既有影像关系里，降低采购摩擦。Baidu Health、Alibaba Health 和 Tencent
              Miying 重要则是另一种原因：它们有触达面、数据界面和相邻预算，可以支撑实验或交叉补贴式产品扩张。


              但在临床环境里，规模本身不能决定竞争。医疗服务提供方采用仍取决于证据、工作流集成、采购和信任。巨型平台可以有触达，却仍可能在严格验证的医院工作流中表现不佳。因此，平台既有厂商是威胁，但不自动导向赢家通吃。


              开放模型可得性带来第三个压力点。基础助手功能比深度集成的临床工作流更容易复制。这迫使包括 SenseTime Medical 在内的每家供应商，都去防守仅靠模型可得性无法替代的栈层。
