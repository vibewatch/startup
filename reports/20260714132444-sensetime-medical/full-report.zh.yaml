      - number: '6.2'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >-
              公开采用轨迹比一页简单 logo
              更有说服力，因为它跨越不同工作流类型和地理区域。具名医院验证与科研和国际影像引用并列，说明公司正在同时测试不止一条商业化路径。这种多样性有帮助，因为它降低了对单一国内临床楔子的依赖。


              瑞金、镜湖和 Parkway 尤其有用，因为它们分别锚定 adoption 的不同含义。瑞金意味着深临床工作流价值；镜湖意味着多产品和多年嵌入；Parkway
              意味着受监管影像工作流中可重复的海外吞吐量。三者合在一起，比任何单一站点更能支撑强图景。


              限制在于，公开广度不等于可测量的变现深度。投资人能看到部署存在，但还看不到试点多快变成经常性合同，也看不到首个模块多常引向更宽的账户扩展。
