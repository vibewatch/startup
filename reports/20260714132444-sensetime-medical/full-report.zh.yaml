      - number: '8.3'
        title: 情景分析
        blocks:
          - type: paragraph
            body: |-
              情景分析是合适工具，因为最重要变量仍是未解状态，而不是已披露事实。牛市情景假设，旗舰客户验证复利成更宽的模块扩展，海外狭窄工作流能够复制，财务披露最终显示类软件杠杆。在这条路径下，今天的私募定价事后可能显得合理。

              基准情景更温和。它假设公司仍具战略重要性并继续获得支持，但变现和验证规模化，比市场最初兴奋所暗示的更慢。在这条路径下，业务仍可能不错，但进入价格只算公平或偏紧。

              熊市情景不需要技术失败。只要部署变慢、透明度持续不足、竞争压缩，或地缘政治摩擦足以让验证保持狭窄、经济质量未经证明，就足够。因此，情景区间比虚假精确更重要。
