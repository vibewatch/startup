      - number: '2.2'
        title: 规模与增长
        blocks:
          - type: paragraph
            body: >-
              保留的市场资料支持一个规模大、增长快的市场，但数字需要谨慎解读。中国 AI 医疗保健市场 2024 年基数似乎约为 $4 billion，并在 2030 年走向百亿美元中段；全球 AI
              医疗保健预测则更大。这些估算有用，因为它们能方向性证明需求不是小众。


              但这些数字并没有定义 SenseTime Medical 真实的短期可服务市场。公司近期变现更可能来自高等级医院、影像密集科室，以及能够跑试点、集成模型、购买多个模块的数字化成熟体系。换句话说，真正的 SAM
              窄于中国 AI 医疗保健的大标题口径，也远窄于全球 AI-in-healthcare 总量。


              因此，多镜头判断比任何单一自上而下数字更好。医疗机构数量、医院数字化程度、工作流强度、监管路径和预算归属都重要。投资人可以把 TAM 当作支撑背景，但尽调重点应放在：未来三到五年内，TAM
              的哪些切片能转化为反复出现的医院预算。
