      - number: '8.2'
        title: 反向论点与风险
        blocks:
          - type: paragraph
            body: |-
              反向论点不是公司缺少潜力，而是公开经济性证据远弱于公开战略叙事证据。收入、利润率、留存和集中度，正是投资人判断高私募估值所需的指标，却仍不可得。仅这一点，就让信心低于买入区间。

              第二条反向论点是，这个品类在运营上很难。采购周期长，验证负担真实，母公司牵出的地缘敏感性会复杂化国际信任。一家公司可以技术很强，但如果这些摩擦拖慢通往耐久部署的路径，仍会让投资人失望。

              第三条反向论点是竞争。宽平台故事在战略上有吸引力，但也意味着公司同时遇到许多对手原型。没有经营证明时，广度既可能被读作护城河，也可能被读作复杂性。这种模糊性说明，建议必须保持纪律。
