            body: >-
              公司的资本故事明显强于经营披露故事。相邻轮次快速到位，公开报道显示，在公司披露收入、利润率或 runway
              之前，投资人已经愿意积极出资。这是对感知战略价值的有意义正信号，尤其在一个长企业周期可能需要耐心资本的品类里。


              即便如此，公开证据无法精确量化资本充足性。没有披露 burn，没有招聘轨迹，也没有子公司层现金流视图。母公司备案有参考价值，因为它显示更宽的 SenseTime 生态在管理亏损和增长取舍；但这些材料没有回答，医疗
              spinout 自身是在接近软件杠杆，还是仍像重实施业务一样消耗资本。


              因此，正确解读应保持平衡。近期融资风险因最近投资人支持而下降，但未来融资质量将取决于公司能否把战略叙事与可衡量经营证明配对。这正是投资人必须在尽调中补上的缺口。
