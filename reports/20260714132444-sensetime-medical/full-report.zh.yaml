  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical 的正面情景很容易理解。公开来源支持一个真实产品平台、有意义的医院验证，以及一家年轻医疗 AI
              公司异常强的资本形成能力。公司并不试图销售一个孤立模型；它想成为医疗服务提供方体系内部更宽的工作流层。如果执行站得住，这会创造通往更大账户价值的可信路径。


              市场背景也有利。医疗保健供给侧 AI 仍足够早，强执行还能造出非线性赢家；公司在新加坡和区域投资人上的信号，也说明机会不纯粹是国内市场。对寻找品类领导潜力的投资人来说，这一点重要。


              不能只因谨慎就否定公司的关键原因，是它的证据文件比只靠炒作的故事更好。这里有具名客户、产品广度和资本支持。投资论点因此真实存在。问题是，它是否已经被充分甚至过早定价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV031
