      - number: '4.3'
        title: 成本结构
        blocks:
          - type: paragraph
            body: |-
              成本结构很可能比横向软件更重，因为医疗 AI 需要的不只是模型开发。公司必须支撑算力、临床验证、企业集成、监管工作、实施人力和持续支持。其中一些成本可能随规模下降，但另一些，尤其是部署和变更管理，会顽固地依赖人。

              因此，这个品类在理论上可能比早期财务现实更好看。供应商可以拥有强技术，但仍要砸下大量资源，把技术转成可生产运行的医院工作流。海外影像验证和国内宽野心同时存在，可能增加而不是减少对实施能力的需求。

              缓释因素是，一些成本项也能形成进入壁垒。验证、集成和监管工作很贵，但也让浅层竞争对手更容易被挤走。核心问题是，这些成本是在购买持久优势，还是只是在推迟利润率扩张。
