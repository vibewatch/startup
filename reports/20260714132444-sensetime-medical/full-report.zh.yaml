      - number: '1.4'
        title: 里程碑与规模
        blocks:
          - type: paragraph
            body: >-
              公开文件里最强的经营验证，不是经审计财务披露，而是医院和使用场景的广度。融资报道反复提到 500 多家医院伙伴和 40 多个临床 AI
              模块，说明公司已经越过一次性试点，进入多产品部署模式。具名案例让这一点更具体：瑞金医院、镜湖医院、Parkway Radiology、Roche 相关科研工作流和上海申康，分别锚定了故事的不同部分。


              这些验证点也显示，公司不只是中国大陆放射科生意。澳门意味着多产品医院嵌入，新加坡意味着具有监管等级的海外影像部署，Roche
              指向药企和科研工作流变现，申康则暗示未来训练数据和医院关系上的优先入口。因此，经营叙事是围绕医疗交付的平台扩展，而不只是算法点解决方案。


              最大的负面里程碑仍在子公司之外。SenseTime Group
              的美国制裁历史和仍然敏感的地缘政治形象，依旧是尽调记录的一部分；母公司披露也继续显示亏损，尽管业绩有所改善。再加上初创公司层收入未披露，公司的规模故事真实存在，但从可投资性角度仍不完整。
