      - number: '7.3'
        title: 市场与竞争风险
        blocks:
          - type: paragraph
            body: >-
              市场风险来自拥挤和买方保守。SenseTime Medical
              面对的不是单一竞争类别，而是影像专科厂商、平台生态、开放模型替代压力和医院预算纪律同时夹击。因此，公司必须证明的不只是技术有效，还要证明它在每个工作流里都是最可信、经济上最合理的选择。


              竞争还会和融资风险相互作用。快速的私募市场支持，可能掩盖一个事实：未来投资人也许会要求更清楚的利润率、留存和客户集中度证明，才愿意在更高价格上继续为同一个故事出资。换句话说，竞争不只是产品份额问题，也关乎市场在继续承销平台野心之前要求多少证明。


              最好的缓释是聚焦：更深的工作流集成、更强验证，以及对真实账户扩展更好的监控。否则，大 TAM 和强融资也可以与脆弱商业结果并存。
