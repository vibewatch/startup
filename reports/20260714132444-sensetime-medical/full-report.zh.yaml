          value: 5
          detail: 直接提高估值精度。
        - label: 监管进展
          value: 4
          detail: 支撑落地时点和防御性。
        - label: 地缘政治摩擦
          value: -4
          detail: 可能压缩伙伴和区域可选空间。
        - label: 开源功能压力
          value: -3
          detail: 对助手类功能最相关。
        - label: 采购拖累
          value: -4
          detail: 拖慢 TAM 向收入转化。
    claimRefs:
