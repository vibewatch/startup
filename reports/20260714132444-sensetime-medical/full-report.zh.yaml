  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical 所处市场在多个维度同时拥挤。这里有影像优先的专科厂商、更宽的医疗 AI
              初创公司、软硬件一体的设备厂商、互联网平台医疗业务，如今还有通用模型提供商向医院工作流推进。因此，没有单一竞争对手能定义这个赛场；公司遇到的对手取决于工作流、预算所有者和临床验证要求。


              影像仍是最清晰的直接比较起点。医院已经理解放射科工作流痛点，监管对影像类产品也有更清楚的框架，多家成熟同行也以影像作为楔子。但 SenseTime Medical
              自身公开叙事比影像更宽，所以它也会被拿来和多模块医院平台、以及能把 AI 功能铺到大用户基础上的数字健康生态比较。


              结果是，定位纪律变得重要。如果把 SenseTime Medical
              只看作又一个模型供应商，它会显得很拥挤。如果把它看作具备影像可信度、助手功能和部署基础设施的医院工作流平台，它的竞争集合会变宽，但差异化逻辑也会更好。
