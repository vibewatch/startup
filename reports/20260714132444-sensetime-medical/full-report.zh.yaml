      - number: '6.4'
        title: 留存与扩展
        blocks:
          - type: paragraph
            body: |-
              留存只能间接推断，因为公开记录没有披露续约或同期群指标。最好的替代指标是经常性工作流吞吐量、多年部署和跨模块采用。按这个标准，公司有一些鼓舞信号，尤其在资料暗示同一机构内重复使用或多产品采用的地方。

              即便如此，集中度和流失风险仍很难判断。一家公司可以有很多医院关系，但经济上仍依赖较小一组旗舰账户或渠道伙伴。同样，医院可以让一个工作流继续运转，却在预算收紧或证明要求提高时推迟更广扩展。

              正确尽调框架因此是双面的。公开证据足以相信公司能拿下有意义账户并在账户内扩展；但若没有内部账户和合同数据，公开证据还不足以假设低流失、强 NRR 或收入多元化。这块缺失仍是承销客户质量的核心。
