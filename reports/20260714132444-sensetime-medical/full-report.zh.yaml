      - number: '8.4'
        title: 建议
        blocks:
          - type: paragraph
            body: >-
              合适的公开建议是继续研究（research-more），置信度中等，估值立场偏高（stretched）。这不意味着公司弱，而是公司的战略质量比支撑高私募估值所需的经济性更容易观察。纪律化投资人应先拿到下一层证明，再进一步加码。


              会改变判断的因素也很清楚。子公司在收入结构、留存、利润率和客户集中度上的更好披露，会直接提高估值精度。具名客户验证能跨模块扩展的证据，会强化平台论点。与母公司治理隔离更清晰，则会降低许多同行没有的独特悬置。


              在此之前，公司最好被视为高潜力但证据不完整的机会。因此，建议不是回避，而是继续积极尽调，保持高价格敏感度，并且只有在下一次刷新补上最重要经营缺口时才上调判断。
