  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical
              的公开客户故事明显由医疗服务提供方主导。最强证据指向医院、医院网络、影像服务商和研究相关工作流，而不是消费健康分发。这很重要，因为医疗服务提供方客户能支撑更大的合同和更深的工作流嵌入，但也带来更慢的销售周期和更高证明要求。


              在这个提供方集合里，三级医院仍是核心原型。它们有影像强度、运营复杂性和数字化成熟度，能够吸收宽 AI 套件。海外影像客户扮演的角色不同：它们更像狭窄但高可信度的滩头阵地，而不是全平台账户。


              从战略上看，客户组合与平台论点一致。公司并不想做大众市场 AI 健康应用。它想成为高价值临床和运营工作流中的基础设施，并把科研和国际影像作为相邻楔子。
