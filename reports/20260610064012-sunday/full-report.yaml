            body: >-
              Sunday is publicly selling a household-workflow story, not an abstract robotics platform. Across the
              homepage, launch coverage, and beta materials, Memo is described as a home robot for busy households that
              takes on repetitive chores such as clearing dining tables, scraping food waste, loading dishwashers,
              folding socks, arranging shoes, and even pulling an espresso shot. The company says Memo should work
              autonomously out of the box across different homes and explicitly frames its value proposition as giving
              families time back rather than selling a narrow industrial manipulator. That positioning matters because
              it defines the product in customer terms: the buyer is a household, the job-to-be-done is domestic labor
              relief, and the service promise is in-home task execution rather than lab performance alone. The visible
              commercial path is still controlled. Sunday's Founding Family Beta is the main deployment surface, with 50
              households slated to receive individually numbered robots plus direct support. Beta materials also say
              Memo's brain will keep updating and that participating homes can propose new skills for the broader
              training loop. Public sources therefore support a concrete initial workflow—household chores, pilot
              deployment, support, and feedback—but they do not yet disclose a public consumer checkout flow, pricing,
              or a published reliability SLA.
