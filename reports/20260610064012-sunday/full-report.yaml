  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Sunday (subject)
        - March 2026 private round
        - $1.15B valuation on $165M Series B; about $200M total disclosed funding
        - Only hard public price discovery for the company itself.
        - No public price, revenue, gross margin, or preference terms behind the mark.
      - - iRobot
        - Public consumer-robot incumbent
        - FY2024 revenue $681.8M; 20.9% GAAP gross margin; strategic review / going-concern stress by 2025
        - Best public read-through on how unforgiving home-robot economics can become even with brand and scale.
        - Product scope is narrower than Sunday and reflects a floorcare incumbent, not a general home robot.
      - - 1X
        - Private home-android peer
        - $100M Series B; over $125M raised in less than 12 months; NEO positioned for chores and home help
        - Closest disclosed home-first humanoid financing reference in the retained set.
        - No disclosed valuation, paid-demand proof, or mature consumer deployment data.
      - - Figure
        - Private humanoid platform leader
        - '>$1B committed Series C at $39B post-money'
        - Upper-end capital and category enthusiasm reference.
        - Magnitude and funding base make it a hype and platform outlier rather than a clean pricing comp for Sunday.
      - - Apptronik
        - Private humanoid financing / industrial deployment
        - $520M at $5B valuation; Apollo tested with Mercedes-Benz and GXO
        - Shows how fast investor appetite can move when a humanoid company shows industrial deployment momentum.
        - Industrial-first posture makes it a capital-market read-through, not a household-demand comp.
      - - Unitree
        - Lower-cost humanoid pricing signal
        - G1 listed at US $13.5K; H1 positioned as a universal humanoid
        - >-
          Relevant as a reminder that future humanoid pricing pressure may come from cheaper hardware entrants as well
          as premium U.S. startups.
        - Published list price does not equal delivered household capability, safety, or support economics.
      - - Figure + Brookfield
        - Milestone / deployment reference
        - 100,000+ residential units under management plus large commercial footprints for data and deployment
        - Shows what scaled data and deployment access can look like when a humanoid company has a major partner.
        - Partnership scale does not translate directly into Sunday valuation support.
      - - Samsung Ballie
        - Incumbent smart-home alternative
        - No financing mark disclosed; large-appliance ecosystem route into the same home budget
        - Model-appropriate reminder that household robotics can be attacked via simpler, ecosystem-led form factors.
        - Ballie is not a direct general-purpose manipulation robot.
      - - Amazon / iRobot
        - M&A read-through
        - Acquisition terminated in 2024; iRobot then laid off 31% of staff
        - Useful reminder that even category leaders can lose strategic optionality fast.
