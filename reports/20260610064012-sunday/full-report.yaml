      - number: '4.4'
        title: Financial Verdict and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              On the current public record, Sunday's financial story is high-promise but still low-underwrite. Revenue
              quality cannot be judged because there is no disclosed price, no evidence of paid unit sales, no customer
              concentration data, and no stream-level recognition policy for beta or future deployments. Margin path is
              likewise open-ended: the company may benefit from a proprietary data loop and eventual scale, but today's
              visible model carries heavy R&D, manufacturing, data-operations, and support obligations before there is
              public proof of durable consumer willingness to pay. The strongest positives are capital availability,
              application interest, and unusually strong data-scale signals. The biggest blockers are still economic:
              realized ASP, hardware BOM and support cost, gross margin by cohort, beta-to-paid conversion, cash burn,
              runway, and whether the business becomes a premium appliance sale, a service-heavy robotics offering, or
              something in between. Broader literature also supports caution: NBER finds robot investment remains a
              small, concentrated share of equipment spending, while academic smart-home and domestic-robot adoption
              research keeps surfacing cost, privacy, and security concerns as adoption brakes. Until those are
              disclosed, Sunday should be underwritten as a capital-intensive home-robotics experiment with strong
              financing but unproven revenue quality.
