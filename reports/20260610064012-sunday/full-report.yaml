      - number: '8.4'
        title: Final diligence asks and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is therefore still early. Sunday has the ingredients investors want to see before a
              commercialization push: fresh capital, a named first cohort, real-home data, and a product architecture
              designed specifically for home chores rather than for factory retrofits. But the public record still stops
              before the files that would let a committee price the deal cleanly. There is no public beta contract, no
              public pricing sheet, no disclosed support ratio, no unit-economics bridge, and no public explanation of
              liquidation preferences or other cap-table protections. Even the safety and trust layer remains partly
              open because the category's standards framework is still catching up to real-home autonomy.


              That is why the final diligence asks are not generic. Investors need the commercial package: Memo price,
              financing plan, deposits if any, beta-to-paid conversion expectations, service minutes per home, failure
              and replacement rates, and a clean revenue and gross-margin bridge. They also need the financing package:
              pro forma cap table, liquidation stack, issuance price, governance rights, and any ratchets or downside
              protection in prior rounds. Thesis-break triggers are correspondingly simple. Walk or materially reprice
              if the late-2026 beta slips, if Memo's all-in price lands above the consumer value envelope without
              compelling financing support, if meaningful human-in-the-loop operation is still required for home chores,
              or if the term stack means new money sits behind a heavier preference overhang than the headline valuation
              implies.
