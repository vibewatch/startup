      - number: '6.3'
        title: Durability and Retention Visibility
        blocks:
          - type: paragraph
            body: >-
              Sunday’s durability picture is mostly an evidence gap. The company has published customer-facing legal
              surfaces — privacy, terms, and cookies pages — and the beta page discloses a companion app, voice
              scheduling, and direct support. Those are useful pre-deployment readiness signals, but they are not the
              same as renewal proof. The retained sources do not disclose Memo pricing, contract duration, cancellation
              rights, warranty terms, active-home counts, repeat-task frequency, support response times, satisfaction
              scores, churn, NRR, or GRR. The strongest honest statement is therefore that public durability evidence
              does not yet exist because the first household cohort has not been publicly shown operating at scale.


              There is also a more specific trust gap around in-home data handling. Sunday’s website-level privacy and
              terms pages show the company has legal infrastructure in place before rollout, and that matters for a
              household robot. But those documents do not publicly explain robot-specific sensor retention, in-home
              audio or video handling, maintenance escalation, or replacement SLAs for a future beta household. That gap
              matters because, in home robotics, trust and durability are linked: a household may be willing to join a
              waitlist but still refuse activation or renewal if service commitments and data practices remain opaque.
              For now, the correct analytical posture is conservative. Sunday has disclosed enough to show customer
              readiness work has started, but not enough to underwrite long-term retention or post-beta conversion
              quality.
