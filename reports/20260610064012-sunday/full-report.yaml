chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Sunday is a Mountain View-based home robotics startup founded in 2024 by Tony Zhao and Cheng Chi. Across
              the homepage, launch materials, and third-party coverage, the company consistently presents Memo as a
              helpful home robot built to take on repetitive chores such as clearing tables, loading dishwashers,
              folding clothes, and general tidying. The public record also shows that Sunday is not positioning itself
              as a pure software vendor. Its own materials emphasize that it owns the full stack across software,
              hardware, data capture, training, and model evaluation, while the launch press release stresses that Memo
              uses a rolling base and soft silicone-clad design rather than a bipedal humanoid form. That combination
              makes Sunday best understood as a vertically integrated robotics company pursuing eventual robot
              deployment in homes rather than a narrow AI-tool startup. 


              The core business model visible today is pre-commercial deployment rather than mature recurring revenue.
              Sunday says beta deployment starts in late 2026, with a Founding Family Beta for 50 households, but the
              retrieved sources do not disclose pricing, revenue, or customer contracts. Instead, the operating thesis
              is data accumulation: the company claims its Skill Capture Glove and related tooling let it turn human
              household behavior into robot-training data at scale. Official posts say more than 2,000 gloves have
              shipped, that training data comes from more than 500 homes and about 10 million household episodes, and
              that Memo advanced from a one-armed shoe-arranging system in December 2024 to more complex chores by
              October 2025. Those are meaningful product-progress signals, but they still sit earlier in the
              commercialization curve than a broadly deployed consumer hardware business.
