      - number: '7.2'
        title: >-
          Legal, privacy, and safety risk is high because Sunday is bringing a connected robot into family homes before
          public compliance detail is mature
        blocks:
          - type: paragraph
            body: >-
              Sunday has the beginnings of a legal framework, but not yet the level of robot-specific disclosure that
              would close diligence. The public legal surfaces are real: the privacy policy, terms of service, and
              cookies policy are all live and effective as of September 3, 2025. The privacy policy says Sunday collects
              information to provide, maintain, and improve its services, and explicitly contemplates collecting name,
              email, and phone information from newsletter and beta signups. The beta page further shows that Memo will
              be scheduled through direct voice interaction and the companion Sunday app. Those details matter because
              they prove the product is not a simple offline appliance. It is a connected system intended to operate in
              intimate domestic settings and to interact through software surfaces that necessarily touch user
              information and household routines.


              What the public record still does not show is equally important. The reviewed Sunday materials do not
              publicly enumerate Memo-specific certifications, warranties, recall procedures, breach-response
              commitments, or household sensor-retention rules. That gap matters because the external legal backdrop is
              tightening. FTC guidance stresses that companies must honor privacy promises and maintain security
              appropriate to the data they hold, while COPPA materials show how fast questions around children, audio,
              video, and geolocation can become compliance questions inside family homes. Cyber Law Monitor is more
              explicit for robotics: video, audio, geolocation, and biometric data can trigger state privacy and
              biometric statutes, minimization duties, retention requirements, and regulator notification obligations.
              Safety law is similarly incomplete rather than absent. ISO 13482 covers personal care robots, but IEEE
              Spectrum’s 2026 reporting says the current standards framework still does not convert domestic-autonomy
              knowledge into enforceable rules with test methods and governance for real household interaction. Hill
              Dickinson’s liability analysis then adds the other half of the issue: if a robot harms someone or
              mishandles sensitive data, responsibility may be contested across the manufacturer, operator, and software
              stack. For Sunday, the implication is straightforward. Legal risk is not a side issue to solve after
              deployment; it is part of product-market fit for any robot that wants to live in kitchens, dining rooms,
              and homes with children.
