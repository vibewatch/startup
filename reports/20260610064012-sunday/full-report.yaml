  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Route to Market
        blocks:
          - type: paragraph
            body: >-
              Sunday’s public customer story is much narrower than a typical scaled consumer product. The company
              consistently positions Memo for busy households and families that want help with repetitive chores such as
              dishes, laundry, tidying, and table clearing. On the public surfaces reviewed here, the buyer, user, and
              payer all appear to collapse into the same household unit: Sunday does not disclose an employer-sponsored,
              elder-care, hospitality, or enterprise motion, nor does it segment households by geography, income, or
              home type. That narrowness is not inherently negative, but it means the visible market proof today is
              concentrated in a single consumer wedge rather than diversified across multiple buyer archetypes.


              The more important distinction is between household-facing cohorts that can easily be conflated. Sunday’s
              training-data homes, Memory Developers, waitlist members, beta applicants, and eventual Founding Family
              households all sit near the customer journey, but they are not the same thing. The 500-plus homes and
              roughly 10 million household episodes support the data moat story; they do not prove paid Memo usage. The
              reported 1,000-person waitlist and thousands of beta applications show early interest, but they are still
              top-of-funnel demand signals. The clearest deployment cohort is the late-2026 Founding Family Beta, where
              50 households are supposed to receive individually numbered robots and direct support. Route to market
              also looks highly centralized. Sunday’s public materials emphasize direct beta applications, direct voice
              or app control, and company-run support rather than retail, reseller, or partner-led distribution, which
              creates short-term focus but also concentrates onboarding and service execution inside Sunday itself.
