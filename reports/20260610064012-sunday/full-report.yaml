  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Incumbents, Adjacent Paths, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Sunday does not compete against one clean peer set. The closest direct home-first rivals in the retained
              evidence are 1X and Figure, because both also market general-purpose humanoid systems toward household
              tasks rather than single-function cleaning or warehouse work. Samsung Ballie and iRobot matter for a
              different reason: they show that households may prefer narrower, more controllable assistants tied to
              existing smart-home or floor-care routines instead of a full humanoid. Agility, Boston Dynamics, Tailos,
              and LG are still important, but mostly as adjacent paths that prove where robotics companies are
              monetizing today: warehouses, industrial material handling, hospitality cleaning, and business-service
              robots rather than messy consumer homes.


              That classification matters for Sunday’s real competitive problem. A household deciding whether to trust a
              home robot can still keep unpaid labor, outside cleaning help, a Roomba-class product, or a smart-home
              bundle while waiting for general-purpose robots to mature. In other words, Sunday does not face
              winner-take-all lock-in from current rivals. It faces a broad substitute set plus a likely-entrant set
              that includes companies with stronger channels, bigger balance sheets, or more established trust. That is
              why the landscape should be framed as direct peers, narrow incumbents, industrial adjacencies, and the
              status quo—not as a single humanoid league table.
