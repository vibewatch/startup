      - number: '1.4'
        title: Milestones, Proof Points, and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows rapid technical progress and equally rapid narrative escalation. Sunday says it
              spent more than a year building the core infrastructure behind Skill Capture Glove, Skill Transform, Memo,
              and the ACT-1 foundation model. Its research post claims Skill Transform turns glove data into
              robot-equivalent data with a 90 percent success rate and that ACT-1 can execute table-to-dishwasher tasks
              while generalizing to unseen homes with map-conditioned navigation. Whether every technical claim survives
              independent benchmarking is not yet clear, but the sequence from 2024 prototype progress to 2025 stealth
              exit to 2026 unicorn financing is unusually compressed. 


              The main adverse context is not a company-specific lawsuit or enforcement action in the retained set; it
              is sector skepticism. Robot Report quotes Ken Goldberg arguing that home-butler timelines are hype and
              that dexterity plus the robotics data gap will take years to overcome. IEEE Spectrum adds a more
              market-facing caution: survey participants generally prefer special-purpose robots over humanoids in the
              home, and even the article’s optimistic scenarios assume safety, regulatory approval, and insurance
              conditions that may be decades away from reality. That skepticism does not disprove Sunday’s thesis, but
              it does frame the core diligence question correctly. Sunday has strong product momentum, blue-chip
              capital, and a distinctive data-acquisition story, yet it still lacks public proof on customer adoption,
              pricing, and the operational reliability required for broad household deployment.
