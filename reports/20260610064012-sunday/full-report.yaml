      - number: '3.3'
        title: Switching Cost, Multi-Homing, Distribution Power, and Access to Data or Partners
        blocks:
          - type: paragraph
            body: >-
              The near-term consumer switching cost is lower than it first appears. A household can trial a new robot
              without abandoning the status quo, because the existing stack is modular: human labor, cleaners, smart
              speakers, robot vacuums, dishwashers, and home routines can all coexist. That makes multi-homing more
              likely than hard replacement. The binding constraint is therefore not legacy data lock-in so much as
              whether a robot is trustworthy, affordable, supportable, and reliably useful often enough to become part
              of the home’s normal operating system. iRobot’s own strategic shift toward user control is instructive:
              even a narrow incumbent learned that more autonomy is not automatically better if users feel they are
              losing control.


              Distribution and partner access therefore matter at least as much as raw robotics capability. Figure’s
              Brookfield relationship expands residential-data collection and commercialization leverage. Samsung can
              enter through appliance, SmartThings, and consumer-electronics channels. iRobot already owns a durable
              trust and installed-base position in one important household job. Agility and Boston Dynamics have
              integration and industrial-customer advantages if home economics ever become attractive enough to warrant
              a downmarket move. Sunday’s most plausible advantage is that it is optimizing for the home earlier than
              most of the field, but that advantage only compounds if its learning loop becomes visibly better before
              larger channels and better-funded rivals converge on the same workflows.
            claimRefs:
              - CP026
              - CP027
              - CP034
