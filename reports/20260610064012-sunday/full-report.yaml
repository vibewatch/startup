  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The valuation moves more on milestones and commercialization proof than on any public revenue multiple.
    data:
      items:
        - label: 'Bear: beta slip / term overhang'
          value: 0.6
          detail: Delayed deployment or worse-than-expected financing terms would push value below the last round.
          tone: risk
        - label: 'Bear: price-value mismatch'
          value: 0.5
          detail: If Memo lands above the consumer affordability envelope without financing support, downside deepens.
          tone: risk
        - label: Current reference mark
          value: 1.15
          detail: March 2026 Series B price discovery point.
          tone: neutral
        - label: 'Base: on-time beta, still high-touch'
          value: 1.1
          detail: The round remains broadly fair if Sunday proves learning progress but not yet scaled economics.
          tone: neutral
        - label: 'Bull: paid conversion and supportability'
          value: 1.7
          detail: Above-round value requires real proof that households pay and support burden falls.
          tone: positive
        - label: 'Upper bull: clear household breakout'
          value: 2.2
          detail: Requires price, trust, and cohort economics to all clear at once.
          tone: positive
    approximationNotes: >-
      Values are illustrative scenario midpoints in billions of dollars, anchored to the current financing mark and
      milestone-based valuation judgment rather than to invented sales multiples.
    claimRefs:
      - CV001
      - CV011
      - CV016
      - CV017
      - CV036
      - CV037
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The current round lands inside the base case, with upside contingent on commercialization proof and downside
      driven by affordability or execution misses.
    data:
      items:
        - label: Bear fair value
          low: 0.4
          mid: 0.6
          high: 0.8
          displayValue: $0.4B-$0.8B
          detail: Beta slips, price misses the household wallet, or support burden stays too high.
          tone: risk
        - label: Base fair value
          low: 0.9
          mid: 1.1
          high: 1.3
          displayValue: $0.9B-$1.3B
          detail: The current mark remains the best reference point while proof improves incrementally.
          tone: neutral
        - label: Bull fair value
          low: 1.4
          mid: 1.7
          high: 2.2
          displayValue: $1.4B-$2.2B
          detail: On-time beta plus credible pricing and supportability can justify a premium.
          tone: positive
        - label: Current financing mark
          low: 1.15
          mid: 1.15
          high: 1.15
          displayValue: $1.15B
          detail: March 2026 Series B reference point.
          tone: neutral
    claimRefs:
      - CV001
      - CV034
      - CV036
      - CV037
      - CV039
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: The core valuation KPI set shows why Sunday is interesting but still not price-clear.
    data:
      items:
        - label: Latest known valuation
          value: $1.15B
          detail: Corroborated by official and independent March 2026 sources.
          tone: neutral
        - label: Total disclosed funding
          value: ~$200M
          detail: Tracxn shows two rounds and about $200M total raised.
          tone: positive
        - label: First named beta cohort
          value: 50 homes
          detail: Useful deployment proof, but still a high-touch starting point.
          tone: neutral
        - label: Top-of-funnel demand signal
          value: ~1,000 waitlist
          detail: Shows interest, not paid conversion.
          tone: neutral
        - label: Consumer affordability ceiling
          value: 69% < $5k
          detail: A major constraint on household robot pricing.
          tone: risk
        - label: Comparable incumbent warning
          value: 20.9% GM at iRobot
          detail: Consumer robots can remain margin-thin even at scale.
          tone: risk
        - label: Public evidence gap
          value: Price / revenue / terms missing
          detail: Most important blocker to a clean investment recommendation.
          tone: risk
        - label: Target return support
          value: Not yet numeric
          detail: Public evidence is insufficient for a trustworthy return model today.
          tone: risk
