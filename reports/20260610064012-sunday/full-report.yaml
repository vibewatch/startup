  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Sunday is not “all humanoid robots” and not even all home automation hardware. The
              closest defensible boundary is household service and personal-care robots that operate inside homes and
              are sold to help with domestic chores, monitoring, or companionship. Sunday's own product materials keep
              returning to chore assistance inside kitchens, dining rooms, laundry spaces, and other lived-in home
              environments: clearing tables, loading dishwashers, folding clothes, putting away shoes, and similar
              mobile-manipulation tasks. ISO 13482's mobile servant and physical-assistant framing is directionally
              consistent with that boundary because it explicitly covers personal-care robots that improve quality of
              life, address human-contact hazards, and are used around people, domestic animals, and property.


              Included spend therefore starts with home robots for cleaning and related domestic tasks, then extends to
              adjacent in-home assistive categories where buyers value convenience, labor substitution, or
              aging-in-place support. It excludes industrial robots, medical devices, military robots, toys, and the
              very broad humanoid-robot forecasts that mix healthcare, hospitality, manufacturing, education, defense,
              and residential use cases into one number. Those broader forecasts matter as adjacency context, but they
              overstate Sunday's currently evidenced opportunity. The practical status quo is also broader than rival
              robot vendors: households already solve the job with unpaid labor, hired services, and special-purpose
              devices such as robot vacuums. That matters because IEEE's survey evidence suggests people still prefer
              specialized home robots over humanoids on safety, privacy, and comfort grounds, so Sunday must beat not
              just other startups but entrenched non-robot routines and simpler devices.
