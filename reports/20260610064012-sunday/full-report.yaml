        title: Revenue Model, Pricing Posture, and Direct GTM Motion
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a consumer home-robotics revenue model, but not yet a disclosed monetization
              schedule. Sunday markets Memo directly to busy households, and its homepage and beta materials ask
              households to apply for access rather than routing demand through enterprise buyers, insurers, or channel
              partners. The strongest commercialization artifact is the Founding Family Beta: applications opened in
              November 2025 for 50 households that will receive individually numbered robots and direct support, while
              March 2026 materials say public deployment starts with the beta and independent coverage says interest has
              reached at least a four-digit waitlist and likely thousands of applicants. That is useful demand signal,
              not revenue proof. Sunday still does not disclose Memo list price, beta fee, subscription terms, financing
              plan, or the accounting treatment for beta units. The pricing gap matters because category survey evidence
              shows most consumers are unwilling to pay above $5,000 for a home robot, so Sunday's eventual realized ASP
              must clear a meaningful affordability hurdle before demand can translate into high-quality revenue.
