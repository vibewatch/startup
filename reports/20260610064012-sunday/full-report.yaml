      - number: '1.2'
        title: Leadership, Governance, and Key-Person Concentration
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is still narrow and highly founder-centered. Tony Zhao is the visible
              co-founder and CEO, while Cheng Chi is the co-founder and CTO. Zhao’s personal site ties him directly to
              ALOHA and ACT at Stanford and describes prior work at Google DeepMind, Tesla Autopilot, and Google X
              Intrinsic, which helps explain why outside investors keep emphasizing his research pedigree. Cheng Chi’s
              authorship of the Diffusion Policy paper and his identification as Sunday’s CTO reinforce that the
              company’s technical narrative is anchored in founders with recent, recognizable robot-learning
              credentials. 


              Governance visibility is much thinner than the funding headline. In the retained sources, the clearest
              public board disclosure is Thomas Laffont joining the board in connection with Coatue’s March 2026 Series
              B lead. Beyond that, Sunday does not publish a full board roster, ownership split, or broader governance
              structure in the retrieved materials. That means the public company profile is still exposed to key-person
              dependence: Zhao and Chi are not just executives, they are also the main proof of research credibility,
              product vision, and investor confidence. The asymmetry matters because later-stage capital has arrived
              before there is a comparably detailed public disclosure package on senior operators, board oversight, or
              go-to-market leadership. Later diligence should therefore treat founder concentration and governance
              opacity as real underwriting issues rather than cosmetic omissions.
