        title: Cost Structure, Margin Drivers, and Public-Traction Gaps
        blocks:
          - type: paragraph
            body: >-
              Sunday's cost structure looks expensive even before broad commercialization. The company says it owns the
              full stack across hardware, software, data, training, model evaluation, and manufacturing, and its March
              2026 post says engineering tripled, research quadrupled, and data operations grew fivefold to support
              deployment. Careers listings still show Redwood City and remote roles across fleet software,
              data-operations tooling, memory development, data annotation, and evaluation operations. That implies at
              least four live cost buckets: robotics R&D, hardware and manufacturing, data collection and labeling, and
              in-home deployment and support. Public traction proxies are real—more than 500 homes in the dataset, about
              10 million household episodes, more than 2,000 gloves shipped, 50 beta homes planned, 1,000-plus waitlist
              or applicant signals, and 127 employees reported by Tracxn—but none of those proxies converts into
              disclosed revenue, gross margin, CAC, or payback. iRobot is the clearest public comp for why this matters:
              its FY2024 results show only 20.9% GAAP gross margin, a $26.6 million inventory-related charge, promotions
              to stimulate sell-through, and a strategic review after deep headcount cuts. That caution intensified in
              iRobot's Q3 2025 release, where revenue missed expectations, cash fell to $24.8 million, inventory
              remained $140.9 million, and management said no additional capital sources were available. Official Roomba
              shop prices spanning roughly $250 to $1,400 with consumer financing underline how constrained mainstream
              household-robot price architecture still is. Sunday may eventually outperform that outcome, but the public
              record does not yet show a lower-risk consumer-robot cost model.
