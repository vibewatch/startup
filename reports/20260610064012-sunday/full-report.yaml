      - number: '3.2'
        title: Capability, Pricing Posture, GTM, and Trust Comparison
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is still uneven across the set. Sunday, 1X, and Figure all pitch multi-step home
              manipulation, but they do so with very different public readiness signals. Sunday emphasizes real-home
              autonomy and proprietary training data. 1X explicitly sells the idea of a home robot for chores, yet its
              own retained materials also acknowledge cloud dependence for advanced reasoning and an active effort to
              make bipedal manipulation safe inside homes. Figure has the deepest public capital stack and unusually
              large residential-data access through Brookfield, but its retained independent coverage still describes
              home testing as alpha-stage while industrial deployments remain nearer-term.


              The incumbents and adjacencies tell a different story. Samsung’s Ballie is not a humanoid, but it already
              maps to appliance control, home presence, and existing smart-home behavior. iRobot shows what scaled
              household robotics looks like when the job is narrow: camera-based mapping, obstacle avoidance,
              user-control features, and a privacy posture built around not over-automating before trust exists. Agility
              and Boston Dynamics show where humanoids monetize first: warehouses and industrial material handling,
              where ROI, safety boundaries, and customer budgets are clearer. Pricing is also a competitive signal in
              its own right. Across the cited general-purpose home-robot pages here, public list pricing remains
              undisclosed, which means packaging and price transparency still lag the ambition of the demos.
