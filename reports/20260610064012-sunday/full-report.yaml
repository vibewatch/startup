      - number: '7.3'
        title: >-
          Operational and dependency risk remains elevated because Sunday’s data advantage still depends on labor, fast
          iteration, and a fragile first-service model
        blocks:
          - type: paragraph
            body: >-
              Operationally, Sunday is promising one of the hardest things in robotics: a robot that can autonomously
              enter new homes, handle long-horizon chores, and improve quickly enough that customers notice the
              progress. The official materials make clear how much infrastructure that requires. Sunday says Memo learns
              from hundreds of unique homes, more than 2,000 gloves, and approximately 10 million household episodes.
              The ACT-1 post argues that teleoperation is a scaling deadlock and claims Sunday solved part of that
              problem with Skill Transform and a 90% glove-to-robot data conversion process. That is a real mitigation,
              and it explains why the company is hiring in robot fleet management, voice interaction, ML data and
              evaluations, and data operations while also describing large team expansion across engineering, research,
              and data operations.


              But the very need for that apparatus is also the risk. Sunday’s own materials still rely on a tightly
              managed beta with direct support, which implies the service burden is not yet routine. The category
              evidence argues that hidden human labor and support intensity remain real. UNSW describes remote takeover
              and recorded home interactions in the category, and The Robot Report says teleoperation warehouses still
              exist. Sunday may be more advanced than that baseline, but its own writing still admits the data
              bottleneck and the need to discover the unique problems Memo will face in each new home. Homes are not
              factories; they are variable, cluttered, and full of nonstandard behaviors, pets, children, and fragile
              objects. NIST’s robotics program reinforces that point by emphasizing validated datasets, test methods,
              and health monitoring as prerequisites for safe autonomy in unpredictable environments. Dependency risk
              also remains high because several key inputs are either partially external or still opaque: Sunday says it
              benefits from public datasets and VLM advances, yet it does not publicly name its manufacturing stack,
              cloud architecture, or hardware supplier concentration. The result is an execution profile where Sunday
              could be technically ahead of peers and still get trapped by field support, data-ops labor, or undisclosed
              supplier dependencies once the robot leaves the demo loop and enters real homes.
