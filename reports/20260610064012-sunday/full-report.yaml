      - number: '2.2'
        title: Market Sizing Lenses, Geography Narrowing, and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Public top-down market data is useful only when the category boundary is kept explicit. Mordor
              Intelligence sizes the domestic service robots market at $14.62 billion in 2025, rising to $34.93 billion
              by 2031 at a 15.62% CAGR, while Global Market Insights sizes the broader household robots market at $14.7
              billion in 2025 and projects $85 billion by 2035 at a 19.2% CAGR. Those estimates are close on the
              current-year headline but diverge in taxonomy and long-range forecast shape. Mordor is more explicit that
              floor cleaning and vacuuming/mopping dominate today's revenue pool, while GMI highlights a wider household
              frame that still remains cleaning-heavy but also includes companionship, security, lawn, and pool
              applications. Neither source isolates the niche that Sunday actually needs to win: premium multi-step home
              manipulation beyond single-purpose cleaning.


              A more constrained sizing path is geographic. Mordor says North America held 38.3% of domestic service
              robot revenue in 2025, implying roughly $5.6 billion of North American spend when applied to its $14.62
              billion global base. GMI separately pegs the U.S. household robot market at $3.6 billion in 2025. Those
              are better near-term anchors for Sunday than global consumer-robot numbers because Sunday's public
              deployments, training homes, and beta messaging are U.S.-centered. By contrast, Future Market Insights'
              humanoid-robot forecast of $7.8 billion in 2025 and $248.9 billion by 2036 is best treated as an adjacency
              ceiling, not a Sunday TAM, because it blends hospitals, factories, hospitality, defense, education,
              retail, and residential assistance.


              The resulting conclusion is deliberately conservative. Broad household-robot TAM is clearly
              multi-billion-dollar, North America and the U.S. offer a narrower but still meaningful spend pool, and
              home chores remain a real economic pain point. But a Sunday-specific SAM or SOM cannot be credibly
              isolated from public data because there is no disclosed price, no public conversion funnel, no
              independently verified task-frequency economics, and no public evidence that consumers will buy a
              general-purpose home robot at currently implied hardware price points. The contradiction itself is
              important diligence signal: generous market reports describe a large category, while real adoption
              evidence still looks like a premium, trust-limited wedge.
