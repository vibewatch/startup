  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Sunday is easy to like and hard to price. The market problem is real: BLS says 80% of people do household
              activities on an average day and spend about two hours on them, while Altman Solon shows 65% consumer
              interest in advanced home robots. Product evidence is also better than at many earlier robotics startups.
              Sunday says Memo has been trained on roughly 10 million household episodes from more than 500 homes, and
              the company has moved from abstract demos to a named late-2026 50-home beta with direct support.
              Customers, however, remain mostly top-of-funnel. Independent coverage points to an approximately
              1,000-person waitlist, not paid users, and no retained source discloses a list price, beta fee, conversion
              rate, revenue, or margin profile.


              That denominator gap is what keeps the recommendation from becoming a buy. The public record supports a
              real consumer problem, a differentiated data-collection loop, and enough capital to keep learning in the
              field. It does not yet support the harder underwriting questions: what Memo costs, whether households will
              actually pay enough, how much support the product requires, and whether the current round embeds terms
              that make the headline valuation misleading. Competition reinforces the caution. 1X is a closer home-first
              peer but is still only at a disclosed $100 million Series B; Figure is massively better funded at a $39
              billion post-money mark but is still only alpha-testing at home; Samsung can pursue the same household
              attention budget through a simpler smart-home robot; and iRobot shows how brutal consumer-robot economics
              can become even with brand, channel, and years of deployment. The right public-evidence call is therefore
              research-more with medium confidence, high risk, and a full valuation stance rather than a clean yes or
              no.
