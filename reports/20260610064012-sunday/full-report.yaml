            title: Upside requires solving the category constraints, not just Sunday-specific execution
            body: >-
              The bull case is possible only if Sunday clears the same affordability, safety, support, and trust hurdles
              that still restrain home robotics generally. That is why the scenario upside depends on beta economics and
              household conversion, not merely on more technical demos.
