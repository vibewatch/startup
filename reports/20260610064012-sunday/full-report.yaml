      - number: '1.3'
        title: Funding Base, Stakeholders, and Public Scale Signals
        blocks:
          - type: paragraph
            body: >-
              Sunday’s capital formation has been unusually fast. The company emerged from stealth on 19 November 2025
              with a $35 million launch financing tied to Benchmark and Conviction, then announced an oversubscribed
              $165 million Series B at a $1.15 billion valuation on 12 March 2026. Across official and independent
              sources, Coatue is consistently identified as the Series B lead, with Bain Capital Ventures, Fidelity
              Management & Research Company, Tiger Global, Benchmark, Conviction, and Xtal Ventures also named as
              participants. Tracxn’s profile implies roughly $200 million raised across two disclosed rounds, which
              aligns arithmetically with the $35 million launch round and $165 million Series B. 


              Public scale signals are directionally positive but still incomplete. Tracxn reported 127 employees in
              late March 2026, while TechFundingNews described the company as having more than 70 engineers and
              researchers. Sunday’s own Series B post says engineering tripled, research quadrupled, and data operations
              grew fivefold as the company shifted toward deployment. The careers page shows active Redwood City and
              remote hiring across software and data operations, which suggests a broader Bay Area footprint than the
              Mountain View press-release wording alone. At the same time, the public record does not disclose revenue,
              ARR, customer count, debt facilities, secondary sales, or named commercial customers. The funding story is
              therefore strong, but the economic picture remains largely private.
