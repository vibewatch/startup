      - number: '8.3'
        title: Bull / base / bear logic and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The scenario table should be read as milestone-weighted valuation judgment, not as false precision. In the
              bull case, Sunday executes the 50-home beta on time, discloses pricing that households can actually absorb
              either directly or through credible financing, and shows that support load and hidden human labor fall as
              the fleet matures. In that world, the current round starts to look like an early de-risking entry rather
              than a peak mark. In the base case, the March 2026 round remains the only hard price-discovery point, the
              beta happens but still behaves like a high-touch proving ground, and investors get enough evidence to
              defend the current valuation without yet justifying a large premium. In the bear case, the affordability
              problem stays open, the beta slips or requires too much concierge support, and investors discover that
              terms or unit economics make the headline valuation more promotional than protective.


              The adverse sources matter because they define the downside triggers more clearly than the upside. Altman
              Solon says nearly 70% of consumers will not pay more than $5,000 for a home robot and 25% will not buy one
              at any price. IEEE and UNSW show that consumers still prefer special-purpose robots in many situations and
              worry about safety, privacy, and hidden remote labor. The Robot Report makes the teleoperation issue
              concrete, while IEEE's safety-standards reporting says domestic-robot governance still lacks enforceable
              testing and rulemaking. Those signals do not mean Sunday fails; they mean any valuation above the current
              mark requires proof that Sunday can solve category-level constraints rather than merely inherit category
              enthusiasm.
