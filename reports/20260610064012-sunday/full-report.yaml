      - number: '8.2'
        title: Financing context, term opacity, and comparable bounds
        blocks:
          - type: paragraph
            body: >-
              The financing story is clear at the headline level and opaque underneath. Sunday officially disclosed a
              $165 million March 2026 Series B at a $1.15 billion valuation, and TechCrunch, Yahoo Finance, and Tracxn
              all corroborate that mark. Tracxn also says total disclosed funding is about $200 million across two
              rounds, which means investors are paying a unicorn price before there is public proof on monetization. The
              price may still be reasonable, but the public file does not yet show why. No retained source discloses
              Memo list price, paid customer count, revenue, gross margin, net burn, or liquidation-preference
              structure. That means outsiders cannot tell whether the round reflects durable operating proof, aggressive
              sponsor optionality, or both.


              Comparable context does not rescue the gap so much as bound it. 1X demonstrates that a serious
              home-android peer can still be at the $100 million financing stage while pitching chores and home
              assistance, which makes Sunday look commercially ahead in investor willingness, not necessarily in proven
              economics. Figure sits at the opposite extreme: a $39 billion post-money round plus a Brookfield
              partnership giving access to more than 100,000 residential units and large commercial footprints. That
              proves capital is available for the category, but it also makes Sunday's $1.15 billion mark look like a
              middle ground between a capital-light aspirant and a mega-funded platform bet. The public incumbent,
              iRobot, is the most sobering reference. Its FY2024 results show $681.8 million of revenue but only 20.9%
              GAAP gross margin, a $26.6 million inventory-related charge, and eventually a strategic review,
              going-concern warning, and Q3 2025 statement that no additional capital sources were available. In other
              words, Sunday's current price is not disproven by the category, but public evidence does not yet prove
              that the valuation is cheap or even safely fair.
