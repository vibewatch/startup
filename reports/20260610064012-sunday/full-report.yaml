            title: Treat the March 2026 round as price discovery, not valuation proof
            body: >-
              Sunday looks real enough to keep working, but the missing files are still the ones that actually matter:
              pricing, conversion, margins, support burden, and financing terms. Until those show up, the right move is
              research-more at the current mark, not a clean buy.
            calloutType: recommendation
