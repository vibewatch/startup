- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy policy + cookies notice
    - Published
    - Covers beta/newsletter intake, communications, device/network data, and website activity
    - Does not explain robot-sensor retention, in-home video policy, or fleet-data governance
  - - Rolling-base stability claim
    - Company-claimed
    - Launch materials say Memo stays stable in power loss and avoids bipedal fall risk
    - No published test protocol or quantitative stability data
  - - Soft silicone exterior claim
    - Company-claimed
    - Launch materials say the robot is soft and family-friendly for living spaces
    - No public material-standard, cleanability, or impact-testing disclosure
  - - Direct-support beta operations
    - Published
    - 50 beta homes receive individually numbered robots plus direct support
    - Support hours, replacement policy, and on-call escalation are not public
  - - Data ops / evaluation staffing
    - Published staffing signal
    - Careers show fleet, annotation, ML evaluation, and eval-ops roles
    - Roles imply process but not measured quality outcomes or audit cadence
  - - Applicable personal-care robot framework
    - External standard exists
    - ISO 13482 addresses hazards for mobile servant and related personal care robots
    - The standard does not prove Sunday compliance and lacks exhaustive impact data
  - - Domestic-autonomy standards gap
    - Material external warning
    - IEEE says current revisions still lack binding test methods and enforcement for relational home safety
    - Sunday discloses no public certification or compliance program to close that gap
  notes: Controls listed here mix official Sunday disclosures with relevant external frameworks; absence of a published control does not mean it is missing internally, only that it was not visible on accessed surfaces.
