callouts:
- calloutType: strength
  title: Sunday’s clearest technical edge is the combination of a data-capture asset and a deployment loop
  body: The public story is not just that Sunday has a capable robot. It is that the company built a glove-based way to gather household behavior, a transformation pipeline to convert that data into robot form, and a beta/fleet loop to keep adding new skills. That is more differentiated than a generic frontier-model claim.
  claimRefs:
  - CE006
  - CE014
  - CE015
  - CE016
  - CE025
  - CE027
  - CE030
- calloutType: risk
  title: Public trust evidence is still much thinner than the deployment narrative
  body: Sunday discloses a website privacy policy and safety-oriented design language, but the accessed materials do not publish robot-specific data governance, quantified field reliability, supplier detail, or a binding safety-validation program. For a home robot, those omissions matter as much as the demo quality.
