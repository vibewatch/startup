chapter:
  number: 5
  title: Product & Technology
  summary: 'Sunday''s public product surface shows a real household-robotics stack rather than a single demo: Memo, Skill Capture Glove, Skill Transform, ACT-1, a Memory Developer data loop, and a controlled beta deployment are all explicitly described on official surfaces. The strongest technical differentiation is the claimed combination of founder ALOHA/Diffusion Policy lineage with a glove-to-robot data pipeline aimed at real-home generalization, but public proof on field reliability, robot-specific privacy handling, supplier/manufacturing detail, and binding home-safety validation remains limited. Sunday''s product case is therefore technically distinctive and fast-moving, but still early on publishable trust and deployment evidence.'
sections:
- id: product-definition-and-household-workflow
  title: Product Definition and Household Workflow
  body: 'Sunday is publicly selling a household-workflow story, not an abstract robotics platform. Across the homepage, launch coverage, and beta materials, Memo is described as a home robot for busy households that takes on repetitive chores such as clearing dining tables, scraping food waste, loading dishwashers, folding socks, arranging shoes, and even pulling an espresso shot. The company says Memo should work autonomously out of the box across different homes and explicitly frames its value proposition as giving families time back rather than selling a narrow industrial manipulator. That positioning matters because it defines the product in customer terms: the buyer is a household, the job-to-be-done is domestic labor relief, and the service promise is in-home task execution rather than lab performance alone. The visible commercial path is still controlled. Sunday''s Founding Family Beta is the main deployment surface, with 50 households slated to receive individually numbered robots
    plus direct support. Beta materials also say Memo''s brain will keep updating and that participating homes can propose new skills for the broader training loop. Public sources therefore support a concrete initial workflow—household chores, pilot deployment, support, and feedback—but they do not yet disclose a public consumer checkout flow, pricing, or a published reliability SLA.'
