    - Executes manipulation safely in domestic spaces
    - Rolling base, arm-hand design, force sensitivity, and silicone exterior
    - Public copy does not expose payload, reach, endurance, or service intervals
  - - Fleet, data ops, and eval ops loop
    - Supports deployment, retraining, and quality control
    - Robot fleet management, ML evaluation, annotation, and support teams
    - No public incident metrics, review cadences, or release-governance policy
