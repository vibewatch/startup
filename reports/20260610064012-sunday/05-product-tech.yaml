- id: deployment-trust-and-remaining-product-risks
  title: Deployment, Trust, and Remaining Product Risks
  body: 'Deployment evidence is improving, but public trust evidence still lags the ambition of a home robot. Sunday''s March 2026 post says the company has moved beyond demo-first storytelling toward real-world deployment, and the careers page backs that transition with visible roles in robot fleet management, ML data and evaluations, voice interaction, memory development, annotation, and eval ops. That suggests the operating model now includes field support and quality loops, not just model training. At the same time, the public trust surface remains narrow. Sunday has a website privacy policy that covers beta or newsletter intake, communications, device/network information, and website activity data, but the accessed materials do not explain robot-sensor retention, in-home video handling, or fleet-data governance. External standards also do not close the gap for Sunday automatically. ISO 13482 covers personal care robots, NIST emphasizes test methods and validated performance metrics,
    and IEEE''s 2026 coverage argues that domestic-robot standards still lack binding test methods and enforcement for relational safety in real homes. External skepticism remains relevant as well: Ken Goldberg''s critique that dexterity and the robotics data gap will slow home-butler timelines speaks directly to Sunday''s underwriting challenge. The result is a product that looks technically differentiated and operationally serious, yet still under-disclosed on field reliability, supplier detail, and safety validation.'
