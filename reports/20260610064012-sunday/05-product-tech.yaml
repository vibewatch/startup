- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user / operator
  - Current status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Memo robot
    - Households / families
    - Publicly marketed; beta planned for late 2026
    - Targets general household chores instead of a single-purpose appliance
    - No public price, checkout flow, or field reliability metrics
  - - Skill Capture Glove
    - Memory Developers / internal data loop
    - Shipped at 2,000+ unit scale by company claim
    - Captures human household behavior in a geometry matched to the robot hand
    - No public bill of materials, sensor spec sheet, or failure-rate data
  - - Memory Developer network
    - Remote and in-house data operators
    - Live collection program with hundreds of participants by company claim
    - Lets Sunday sample real-home variation instead of only lab demos
    - Participant economics, screening, and geographic coverage are undisclosed
  - - Skill Transform
    - Internal ML / data pipeline
    - Core proprietary pipeline; 90% conversion success claimed
    - Bridges embodiment mismatch between glove observations and robot data
    - No independent benchmark or ablation is public
  - - ACT-1
    - Robot policy stack
    - First Sunday foundation model; publicly demoed
    - Combines long-horizon manipulation with map-conditioned navigation by company claim
    - No third-party replication or deployment KPI set is public
  - - Skill Library
    - Robot software stack
    - Expanding; homepage says new skills every month
    - Frames Memo as a generalizable skill platform rather than a fixed routine bot
    - No public release notes or versioned capability log
  - - Beta fleet + direct support
    - Sunday deployment and support teams
    - Initial operating model for 50 homes
    - Pairs field learning with direct household feedback and guided support
    - Escalation path, maintenance model, and replacement process are not disclosed
  notes: This matrix blends directly disclosed product assets with explicit gaps where public operating detail remains absent; maturity reflects what is visible on official and independent sources, not private diligence.
