- id: operating-architecture-and-technical-differentiation
  title: Operating Architecture and Technical Differentiation
  body: 'The public operating model centers on data capture and iteration speed. Sunday says it owns the full stack across software, hardware, data, training, model evaluation, hardware design, and manufacturing, and its most detailed technical post argues that the real bottleneck in household robotics is not just hardware or compute but the lack of internet-scale manipulation data. Sunday''s answer is a chain of linked assets: Skill Capture Glove to record human household behavior, Skill Transform to convert glove observations into robot-equivalent data, ACT-1 as the learned policy stack, and a fleet-plus-data-operations loop that pushes new data back into the system. The company says the glove and Memo''s hand share the same geometry and sensor layout, and that Skill Transform reaches a 90 percent conversion success rate. It further claims ACT-1 can execute long-horizon table-to-dishwasher behavior, use 3D maps for unseen-home navigation, and tackle dexterity-heavy tasks such as sock folding
    and espresso preparation. Sunday''s differentiation story is strengthened by founder lineage rather than by disclosed production architecture diagrams alone. The company page, Tony Zhao''s profile, and public ALOHA/Diffusion Policy materials tie the founders to open robotics work on low-cost teleoperation, action chunking, diffusion-based policy learning, and large-scale dexterous data collection. That lineage does not prove Memo reuses those exact codebases, but it does show that Sunday is building from a research tradition already legible to the robotics community.'
