  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: field-reliability
    missingEvidence: Memo field reliability metrics such as task success by home, intervention rate, failure taxonomies, and replacement or repair frequency.
    whyItMatters: A home robot can look impressive in curated demos while still failing underwriting on exception handling, support burden, and safety in daily use.
    diligencePath: Request beta operating dashboards, incident logs, service tickets, and cohort-level task completion metrics from live pilot homes.
  - type: private-evidence-only
    severity: material
    topic: robot-data-governance
    missingEvidence: Robot-specific data retention, in-home video or audio handling, fleet telemetry policy, and deletion or consent controls.
    whyItMatters: Privacy risk in home robotics depends on what the robot senses and stores, not just what the marketing website collects.
    diligencePath: Obtain the robot privacy architecture, sensor data map, retention schedule, and customer-facing consent or deletion controls.
  - type: missing-source
    severity: material
    topic: supply-chain-disclosure
    missingEvidence: Named manufacturing partners, critical component suppliers, service partners, and any key integration dependencies.
    whyItMatters: Supplier concentration, manufacturing readiness, and spare-parts support affect deployment pace, gross margin, and field reliability.
    diligencePath: Request a manufacturing and supplier map, including contract manufacturer, critical subsystems, second sources, and support logistics.
  - type: missing-source
    severity: material
    topic: safety-validation
    missingEvidence: Public or private test methods, safety-case documents, impact-force limits, and certification or standards-compliance evidence specific to Memo.
    whyItMatters: Category standards alone do not demonstrate that Sunday has validated safe domestic behavior in messy family environments.
    diligencePath: Request internal validation protocols, hazard analyses, simulation and real-home test results, and any third-party safety assessment.
  - type: missing-source
    severity: minor
    topic: roadmap-detail
    missingEvidence: A dated post-beta release roadmap with explicit milestones beyond the first 50-home pilot.
    whyItMatters: Investors can see momentum, but not the time-bound path from pilot to broader availability.
    diligencePath: Ask management for the staged deployment roadmap covering beta, follow-on cohorts, support scaling, and commercialization gates.
