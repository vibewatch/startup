company:
  name: Sunday
chapter:
  number: 1
  title: Company Overview
  summary: Sunday is a Mountain View-based home robotics startup founded in 2024 by Tony Zhao and Cheng Chi, now positioned as a late-stage private Series B company building Memo for household chores. Public sources strongly support the March 2026 $165 million Coatue-led Series B at a $1.15 billion valuation and show a distinctive data-collection thesis built around Skill Capture Glove, but they still leave material gaps on exact founding date, full governance, revenue, customers, pricing, and real-world deployment economics. The strongest public case today is technical momentum plus capital formation; the main caution is that home-robot adoption and reliability remain far less proven than the funding narrative.
sections:
- id: identity-product-and-operating-model
  title: Identity, Product, and Operating Model
  body: "Sunday is a Mountain View-based home robotics startup founded in 2024 by Tony Zhao and Cheng Chi. Across the homepage, launch materials, and third-party coverage, the company consistently presents Memo as a helpful home robot built to take on repetitive chores such as clearing tables, loading dishwashers, folding clothes, and general tidying. The public record also shows that Sunday is not positioning itself as a pure software vendor. Its own materials emphasize that it owns the full stack across software, hardware, data capture, training, and model evaluation, while the launch press release stresses that Memo uses a rolling base and soft silicone-clad design rather than a bipedal humanoid form. That combination makes Sunday best understood as a vertically integrated robotics company pursuing eventual robot deployment in homes rather than a narrow AI-tool startup. \n\nThe core business model visible today is pre-commercial deployment rather than mature recurring revenue. Sunday\
    \ says beta deployment starts in late 2026, with a Founding Family Beta for 50 households, but the retrieved sources do not disclose pricing, revenue, or customer contracts. Instead, the operating thesis is data accumulation: the company claims its Skill Capture Glove and related tooling let it turn human household behavior into robot-training data at scale. Official posts say more than 2,000 gloves have shipped, that training data comes from more than 500 homes and about 10 million household episodes, and that Memo advanced from a one-armed shoe-arranging system in December 2024 to more complex chores by October 2025. Those are meaningful product-progress signals, but they still sit earlier in the commercialization curve than a broadly deployed consumer hardware business."
