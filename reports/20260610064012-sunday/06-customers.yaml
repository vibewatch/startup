    - Privacy, safety, and teleoperation concerns are salient in external sources
    - Can slow conversion from curiosity to active use
    - Household buyers need higher trust than waitlist signups imply
    - Request dropout reasons, objection handling, and safety incident playbooks
  - - Pricing and affordability
    - No Memo pricing disclosed while category surveys show strong resistance above $5,000
    - Material adoption risk
    - Consumer willingness to pay may not match hardware economics
    - Request target pricing, financing path, and attachment of support costs
