- id: adoption-trajectory-and-public-proof
  title: Adoption Trajectory and Public Proof
  body: |-
    The adoption trajectory visible in public evidence is real but still pre-commercial. Sunday’s launch materials and repeated syndications say the product was trained on data from more than 500 homes and approximately 10 million household episodes. That matters because it demonstrates household exposure before deployment, yet it is still a product-development metric rather than a customer metric. The next step in the visible trajectory is the Founding Family Beta. Sunday’s official beta page plus multiple launch stories say applications opened in November 2025 and that 50 households are planned for late-2026 deployment with direct support. By March 2026, Sunday’s Series B messaging had shifted from demonstration language to “real-world deployment,” and third-party coverage added two top-of-funnel demand signals: a reported ~1,000-person waitlist and “thousands” of beta applications. Those signals are useful because they show the product is attracting attention before shipments, but they do not show acceptance, activation, utilization, or repeat usage.

    The named-customer proof dimension is therefore the weakest part of the chapter, and the weakness is substantive rather than editorial. No named paying household, no public production user, and no independent customer case study were found in the retained source set. The strongest public proof is the existence of a specific first cohort, not evidence that any household is already using Memo at production depth. That means Sunday’s public customer proof should be described as prospective pilot proof backed by demand signals and onboarding readiness, not as scaled adoption. Investors should resist treating training-data homes, waitlist size, and the planned 50-home cohort as interchangeable evidence. Each supports a different part of the customer story, and only the last one approaches live deployment proof.
  claimRefs:
