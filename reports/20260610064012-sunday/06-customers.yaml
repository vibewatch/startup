- id: expansion-concentration-and-adoption-friction
  title: Expansion, Concentration, and Adoption Friction
  body: |-
    The public expansion model is easy to describe and hard to underwrite. Sunday’s own sequence is broad household positioning, then waitlist and application capture, then a tightly managed 50-home beta, then a hoped-for wider rollout once feedback and data improve the product. That is a sensible land-and-expand theory for an early home-robot company, but there is no public conversion math behind it. The company has not disclosed how many applications become accepted households, how many accepted households activate, how many homes use Memo repeatedly, or whether any households will convert into paid long-term customers. Concentration is similarly opaque: with no public cohort mix or revenue mix, top-customer risk cannot be quantified, though a small early cohort could still dominate both learning and any near-term economics.

    External evidence also argues that the jump from curiosity to durable adoption will be difficult. UNSW highlights privacy risk, hidden remote labor, and the fact that homes are not designed for general-purpose robots. The Robot Report quotes Ken Goldberg on teleoperation as a continuing crutch. Altman Solon’s survey suggests that category interest exists — 65 percent of surveyed U.S. consumers express interest — but awareness is low, safety and privacy concerns are real, and price tolerance is far below where premium robotics hardware often starts. These are not company-specific failures, but they do mean Sunday’s customer expansion is likely to be gated less by initial media excitement than by onboarding quality, support operations, trust, and affordability. In short, Sunday has a plausible household wedge and real pre-launch demand signals, yet its public customer story still stops before the evidence investors usually need to believe in durable, scalable adoption.
