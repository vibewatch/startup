  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-gap
    missingEvidence: Named paying or production Memo households, or even anonymized live-customer case studies with task frequency and support outcomes.
    whyItMatters: Without named deployment proof, the public record cannot distinguish early excitement from durable household adoption.
    diligencePath: Request beta participant references, anonymized household usage snapshots, or a customer case-study pack once the first cohort is live.
    relatedQuestionRefs:
    - QU010
    - QU011
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Any public or private cohort metrics covering repeat usage, weekly active homes, renewal, churn, or migration from beta to paid status.
    whyItMatters: Customer durability is the core underwriting question for a household robot, and the public record is silent on every major retention KPI.
    diligencePath: Request beta retention dashboards, active-home curves, renewal mechanics, and post-beta pricing or conversion terms.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Customer-mix disclosure by geography, cohort, or revenue plus any concentration of early deployments or revenue in a tiny set of households.
    whyItMatters: A very small first cohort could drive learning, support load, and any initial revenue, but public evidence does not show how concentrated that cohort will be.
    diligencePath: Request a beta pipeline funnel, accepted-household mix, and cohort-level revenue or support concentration once the program begins.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Robot-specific data-retention, sensor-governance, escalation, warranty, and replacement policies for in-home beta users.
    whyItMatters: Trust, privacy, and service readiness can materially affect activation and retention even when initial waitlist demand looks strong.
    diligencePath: Request beta customer documentation, privacy addenda, service playbooks, and incident / escalation policies.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU021
    relatedTableRefs:
    - TU004
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: customer-proof-enumeration
    missingEvidence: A fuller list of public customer references once the first beta homes are active, including production status, outcomes, and evidence freshness.
    whyItMatters: The named-customer proof table currently captures every public cohort visible in the sources, but those cohorts are still partial and mostly pre-commercial.
    diligencePath: Refresh the chapter after the first beta deliveries and add named or clearly described household references with outcome detail.
    relatedQuestionRefs:
    - QU010
    - QU012
    - QU013
    relatedTableRefs:
    - TU003
