- id: TU001
  title: Customer segmentation table
  columns:
  - Segment / cohort
  - Buyer / user / payer
  - Use case
  - Scale / evidence
  - Strategic value
  - Gap
  rows:
  - - Busy households / families
    - Same household likely buys, uses, and pays
    - Time-saving chores such as dishes, laundry, tidying, and table clearing
    - Official positioning on homepage and launch materials
    - Defines the core consumer wedge and keeps the product focused on practical domestic labor
    - No disclosed income, home-type, or geography segmentation
  - - Founding Family Beta households
    - Early-adopter households
    - Live beta use plus product feedback
    - 50 households planned for late 2026 with direct support
    - First real deployment cohort and best near-term customer proof
    - Still prospective; no named households or pricing disclosed
  - - Beta applicants / waitlist
    - Interested prospects
    - Application to join early deployment
    - Thousands of applications and ~1,000-person waitlist reported in March 2026
    - Shows top-of-funnel demand before broad shipment
    - Not active customers and not a retention signal
  - - Training-data homes / Memory Developers
    - Data contributors, not Memo buyers
    - Record real household routines for model training
    - 500+ homes and hundreds of families or Memory Developers by company claim
    - Important for product learning and home-generalization claims
    - These homes are not proof of paid robot adoption
  - - Future scaled households
    - Not yet public
    - Broader post-beta consumer rollout
    - Series B and Beta pages say deployment is meant to expand after the first cohort
    - Represents the long-term market prize if onboarding works
    - No public GA date, pricing, or conversion data
  - - Channel / partner path
    - No partner or reseller route disclosed
    - Direct company-run acquisition and support
    - Official surfaces emphasize direct beta applications, app control, and support
    - Reduces channel ambiguity in the short run
    - Creates dependence on Sunday-run onboarding and service capacity
  notes: Segments in this table separate real deployment proof from training-data and interest signals; absence of a segment detail means the public source set did not disclose it.
