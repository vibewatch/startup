  headquarters: Mountain View, California, USA
  productSummary: >-
    Sunday is building Memo, a rolling-base home robot for repetitive household chores such as
    table clearing, dishwashing, laundry, tidying, and related domestic workflows. The visible
    product stack also includes Skill Capture Glove, Skill Transform, ACT-1, and a Memory
    Developer network intended to turn real-home behavior into robot-training data.
  customerFocus: >-
    Busy households and families seeking help with repetitive domestic chores, reached through a
    direct-to-household beta and future consumer rollout rather than through enterprise buyers or
    channel partners.
  businessModel: >-
    Pre-commercial direct-to-household hardware-plus-support model with a controlled Founding
    Family Beta, company-run onboarding, and a data-collection loop that informs future product
    releases. Public pricing, subscription, financing, and renewal terms remain undisclosed.
  stage: Series B / late-stage private
