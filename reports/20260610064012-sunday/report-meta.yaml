companyProfile:
  summary: >-
    Sunday is a Mountain View-based private home robotics company founded in 2024 by Tony Zhao
    and Cheng Chi. It is building Memo, a rolling-base household robot aimed at repetitive chores,
    alongside a full-stack training system that includes Skill Capture Glove, Skill Transform,
    ACT-1, and a Memory Developer data loop sourced from real homes. Public evidence shows a
    company with unusual technical pedigree, a fast funding arc capped by a March 2026 $165
    million Series B at a $1.15 billion valuation, and a controlled late-2026 beta plan, but it
    still withholds the operating data needed to underwrite commercialization cleanly.
  foundedDate: '2024-01-01'
  founders:
