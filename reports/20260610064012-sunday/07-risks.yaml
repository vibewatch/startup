  title: Risks
summary: Sunday’s risk profile is dominated by the gap between an ambitious late-2026 household deployment plan and the realities of safety, privacy, service, and unit economics in home robotics. The company has real mitigants—fresh capital, a deliberately small 50-household beta with direct support, and a data flywheel built on 500-plus homes, 10 million household episodes, and 2,000-plus gloves—but it still has no public proof on robot-specific compliance, field reliability, pricing, gross margin, or scaled support. Category evidence from IEEE Spectrum, UNSW, FTC guidance, and iRobot’s financial stress argues that even real technical progress can still fail on household trust, standards, and economics.
sections:
- id: risk-overview-and-ranking
  title: 'Risk overview: Sunday is trying to industrialize an intimate household product before the category’s controls are mature'
  body: |-
    Sunday’s public file is strongest where many robotics startups are weakest: it has a concrete deployment timetable, a visible beta cohort, and a clearly articulated data strategy. The company says Memo’s beta launches in late 2026, that the first public cohort is just 50 households with direct support, and that the business has raised $165 million specifically to move beyond demos into real-world deployment. Those are meaningful positives because they show the company understands that household robotics only matters if it works in actual homes, not just in staged demonstrations. Sunday also has a more credible data story than a typical pre-launch robotics company. Public materials point to training data from more than 500 homes, roughly 10 million household episodes, and more than 2,000 gloves shipped to Memory Developers. That is a real mitigation against the category’s biggest problem: lack of messy real-world household data.

    The problem is that Sunday’s public commitments run directly into three external reality checks. First, the home-robot safety and standards regime is still visibly incomplete. IEEE Spectrum’s May 2026 reporting says the ISO update for domestic robots still lacks enforceable testing methods and governance mechanisms for home autonomy, while NIST emphasizes that advanced robots need rigorous validation, metrics, and protocols before they can be trusted in intended environments. Second, privacy and liability obligations are expanding faster than Sunday’s public legal detail. Sunday has website-level legal surfaces, but outside legal and regulatory sources show that AI-powered robots can implicate biometric, audio, geolocation, and child-data issues, and that liability can sit awkwardly among manufacturer, operator, and software provider. Third, the category’s economic precedent is weak. Altman Solon’s survey shows curiosity but low willingness to pay, and iRobot’s recent liquidity, inventory, and going-concern problems show how quickly a consumer-robotics narrative can turn into a capital-efficiency story. In other words, Sunday’s highest-severity risk is not that it lacks imagination; it is that the company may reach households before the surrounding economics, safety framework, and support model are ready for scale.
