- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Beta execution slippage
    - Founding Family deployment timing
    - The 50-home beta slips materially beyond late 2026 or launches without meaningful direct-support readiness
    - Would indicate that Sunday still cannot convert demos and internal deployments into customer-facing operations.
    - Treat as a major de-risking miss and re-underwrite the company as earlier than management messaging suggests.
  - - Safety / standards immaturity
    - Third-party safety evidence
    - Management cannot show meaningful external testing, certification roadmap, or clear internal safety case before deployment
    - Would leave household trust resting on company narrative alone while standards remain incomplete.
    - Require a lower valuation, milestone financing, or pause until safety evidence is produced.
  - - Privacy / data-governance gap
    - Robot-specific privacy controls
    - No clear retention, deletion, consent, vendor, or incident-response framework for in-home robot data
    - A connected robot without this detail faces avoidable legal and reputational risk.
    - Escalate legal risk materially and condition diligence on full data-governance disclosure.
  - - Hidden human-labor exposure
    - Remote intervention or teleoperation rate
    - Meaningful ongoing human-in-the-loop operation is required to keep Memo functioning in homes
    - Would weaken the autonomy thesis and inflate support economics simultaneously.
    - Reclassify Sunday as a labor-augmented service model unless intervention rates are shown to decline quickly.
  - - Affordability / unit-economics mismatch
    - Price-to-value proof
    - Memo’s all-in price and service cost land above what target households will pay or what the company can support profitably
    - Consumer interest alone does not create a viable robotics business.
    - Reduce conviction sharply unless Sunday can show premium willingness to pay and healthy household contribution margins.
  - - Capital efficiency stress
    - Cash-need trajectory
    - Sunday needs another raise before demonstrating durable beta satisfaction, supportability, and a credible commercialization path
    - Would increase financing risk while the model is still unproven.
    - Demand runway transparency, milestone use-of-proceeds, and downside terms before proceeding.
  notes: These triggers are intentionally monitorable so the risk chapter can feed directly into a wait / proceed / walk decision.
