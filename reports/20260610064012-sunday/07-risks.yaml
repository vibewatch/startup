  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: A robot-specific legal and safety dossier covering Memo certifications, warranty terms, incident-response procedures, privacy architecture, and any insurer or regulator feedback before home deployment.
    whyItMatters: The public file shows baseline legal pages and category-level standards pressure, but not the product-specific controls that would close the regulatory and legal register.
    diligencePath: Request the beta household agreement set, internal safety case, privacy impact assessment, third-party testing records, and any certification or insurer correspondence tied to Memo.
    relatedQuestionRefs:
    - QR007
    - QR008
    - QR010
    - QR011
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-pricing
    missingEvidence: Memo pricing, contribution margin by deployed home, service cost per household, replacement reserve assumptions, and post-beta commercialization math.
    whyItMatters: Without this information, demand signals cannot be translated into a credible consumer-robotics business model.
    diligencePath: Request pricing plans, costed support assumptions, household payback analysis, and beta-to-paid conversion targets.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR025
    - QR028
    - QR030
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: supplier-and-service-stack
    missingEvidence: Named hardware suppliers, contract manufacturers, cloud vendors, spare-parts strategy, and fallback plans for service interruptions.
    whyItMatters: Sunday can be technically ahead and still miss deployment goals if an undisclosed supplier or backend dependency fails.
    diligencePath: Request the supplier map, vendor concentration analysis, backup-vendor plan, and service-resilience architecture for Memo.
    relatedQuestionRefs:
    - QR018
    - QR019
    - QR030
    relatedTableRefs:
    - TR002
    - TR003
