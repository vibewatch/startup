- id: financial-model-risk-and-kill-criteria
  title: Financial-model risk is still mostly unclosed because consumer interest does not yet equal a durable home-robot business
  body: |-
    Sunday’s public demand story is encouraging but still top-of-funnel. The company has a 1,000-person reported waitlist, thousands of beta applications, and a very intuitive value proposition in a country where most adults do household work on an average day. Those signals matter because they show that the problem Sunday is trying to solve is real. But they do not yet answer the underwriting questions that matter most for a hardware-and-service business: price, conversion, gross margin, service load, replacement cost, warranty reserve, and cash burn per deployed household. No public Memo price, unit economics, or margin bridge was found in the retained source set. That omission is serious because Altman Solon’s survey suggests the category may face a steep consumer affordability ceiling: interest is high, but most consumers are unwilling to pay above $5,000, and safety concerns remain widespread.

    The best public category comp in this file is iRobot, not because the products are identical, but because it shows how unforgiving consumer robotics can be once demand, margin, and inventory drift out of balance. iRobot’s recent filings and releases show a business facing going-concern pressure, lender waivers, low gross margins, inventory overhang, strategic review, sharp headcount cuts after the Amazon deal collapsed, and then dwindling cash with no remaining capital sources. Sunday is much earlier and has fresher capital, so the comparison should not be made mechanically. Still, it is the right warning sign. Consumer robotics can look strategically exciting right up until customer-acquisition cost, support burden, or hardware economics force a financing reset. Sunday’s real mitigants are the ones already visible: a small first cohort, direct support, a household-data moat, and enough capital to learn in public. The kill criteria are equally clear. If the 50-home beta slips, if privacy and safety governance stay vague, if Memo’s price-to-value equation lands above what households will pay, or if deployment requires hidden human labor or an unscalable support ratio, the thesis should be marked down sharply regardless of how compelling the demos look.
