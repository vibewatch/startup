  topStrengths:
    - >-
      Sunday has a differentiated real-home data moat, with public claims of 500-plus homes, about 10 million household
      episodes, and more than 2,000 Skill Capture Gloves shipped.
    - The founding team has unusually strong public robotics pedigree through ALOHA, ACT, and Diffusion Policy.
    - >-
      The March 2026 Coatue-led Series B and roughly $200 million of disclosed funding give Sunday meaningful capital to
      run a real-world beta.
    - >-
      A named 50-household Founding Family Beta and a reported ~1,000-person waitlist show real household interest
      before broad launch.
  topRisks:
    - Sunday still discloses no Memo price, no paid customer proof, no revenue or ARR, and no gross-margin bridge.
    - >-
      Robot-specific safety, privacy, compliance, and data-governance detail remain materially under-disclosed for an
      in-home connected robot.
    - >-
      The first 50-home beta may reveal hidden human labor, high support intensity, or weak reliability that curated
      demos do not show.
    - >-
      Consumer willingness to pay for home robots may sit well below the price needed to support Sunday's
      hardware-and-service economics.
    - >-
      Financing terms, liquidation preferences, and broader governance remain opaque enough that the headline valuation
      may not reflect true risk.
  unresolvedGaps:
    - Memo price, financing plan, deposits if any, and beta-to-paid conversion expectations.
    - Hardware BOM, gross margin, support cost, burn, and runway at the planned deployment scale.
    - Beta-household usage data, intervention or teleoperation rates, field reliability, and replacement metrics.
    - >-
      Series B and prior-round term stack, including liquidation preferences, governance rights, and dilution
      protection.
    - Robot-specific data retention, in-home sensing policy, safety testing, and certification roadmap.
