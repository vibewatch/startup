- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Assumptions
  - Valuation logic
  - Illustrative fair value
  rows:
  - - Bull
    - Low
    - Beta launches on time, Memo pricing clears household affordability with financing support or obvious premium value, support burden falls, and new diligence shows benign financing terms.
    - Pay a premium to the last round because Sunday starts to look like the rare home-robot company that can convert data advantage into paid household use.
    - $1.4B-$2.2B
  - - Base
    - Medium-High
    - The March 2026 round remains the best price-discovery point, the 50-home beta happens, and commercialization proof improves but still looks high-touch and early.
    - Keep valuation near the current mark because financing support is real, but public economics are still incomplete.
    - $0.9B-$1.3B
  - - Bear
    - Medium
    - Beta slips, Memo pricing overshoots household willingness to pay, hidden human labor persists, or preference terms are worse than the headline implies.
    - Cut below the last round because the company reverts from near-deployment story to expensive robotics optionality.
    - $0.4B-$0.8B
  - - Decision rule
    - —
    - Base case dominates until pricing, supportability, and term transparency improve.
    - Treat the current mark as a reference point, not a target return model.
    - Current mark = $1.15B
  notes: These ranges are scenario judgments anchored to the last round, category affordability evidence, and milestone-appropriate comparable references rather than to invented revenue multiples.
