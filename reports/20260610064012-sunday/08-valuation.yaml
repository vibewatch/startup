- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Commercial terms
    - Memo list price, financing plan, deposits, beta fees if any, and launch timing by cohort.
    - This is the basic denominator for demand quality and consumer affordability.
    - Management pricing pack plus beta materials.
  - - Conversion and usage
    - Applicant funnel, accepted-household criteria, activation rate, repeat-task frequency, and post-beta conversion assumptions.
    - Waitlist size is not the same as paid household demand.
    - Growth, product, and customer-success dashboards.
  - - Unit economics
    - Hardware BOM, replacement cost, support minutes, truck-roll risk, gross margin, and contribution margin by cohort.
    - A home robot can look compelling while still being uneconomic.
    - Finance and operations review.
  - - Cap table and preferences
    - Current pro forma cap table, liquidation stack, issuance prices, board rights, and any ratchets or MFN protections.
    - Headline valuation can diverge materially from economic entry value.
    - Counsel review of financing documents.
  - - Safety and trust controls
    - Safety testing, privacy architecture, retention and deletion rules, incident workflow, and insurance coverage.
    - A household robot needs trust evidence before scale, not after.
    - Product, legal, and external assurance review.
  - - Scale path
    - Milestones from 50 homes to 500 and beyond, including staffing ratios and support automation assumptions.
    - The real question is whether Sunday becomes a scalable household business or a concierge pilot.
    - Operating plan and board milestones.
  notes: These are the minimum diligence asks required to turn Sunday from a credible story into an underwriteable price.
