- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Beta execution slippage
    - The 50-home beta slips materially beyond late 2026 or launches without credible direct-support readiness.
    - Would show that the company is still earlier than the valuation narrative suggests.
    - Re-cut the case toward the bear range or pause.
  - - Affordability mismatch
    - Memo's all-in price lands above the consumer value envelope without financing or extraordinary proof of savings.
    - Would collapse the bridge between household interest and paid demand.
    - Require a lower entry or walk.
  - - Hidden human labor
    - Meaningful human-in-the-loop operation remains necessary to keep home chores working.
    - Would weaken autonomy and margin assumptions at the same time.
    - Underwrite Sunday as a service-heavy model or step away.
  - - Preference overhang
    - Prior or current financing docs show liquidation preferences, ratchets, or governance rights that distort the headline valuation.
    - Would make nominal valuation a poor proxy for economic entry.
    - Demand structured terms or reprice.
  - - Safety / trust gap
    - Management cannot show credible safety-testing, privacy, and incident-governance materials before deployment.
    - Would slow conversion and increase liability risk in a family-home product.
    - Escalate risk rating and condition any investment on controls.
  - - Consumer-robot economics look iRobot-like
    - Margins, support cost, or inventory dynamics begin to resemble stressed consumer hardware economics.
    - Would turn a strategic story into a capital-efficiency problem.
    - Move the case toward the lower end of the range.
  notes: 'These are valuation kill triggers: each one can directly invalidate the current price rather than simply make the story less pleasant.'
