- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis
  - What would change the view
  rows:
  - - Market need
    - Household chores are a real time sink and consumer curiosity is real.
    - If households refuse to pay enough or saved-time value proves too low, demand will not monetize.
  - - Product wedge
    - Sunday has unusually strong real-home data and a home-specific product design.
    - If beta usage still depends on heavy hidden labor or frequent intervention, the data moat matters less.
  - - Customer proof
    - A named 50-home beta and ~1,000-person waitlist show interest before scale.
    - Without deposits, paid conversions, or durable usage, those signals remain top-of-funnel only.
  - - Financing signal
    - The $1.15B round shows credible investors are willing to fund the story.
    - If preference terms are heavy or the next raise arrives before commercial proof, the headline mark loses meaning.
  - - Competitive context
    - Sunday is far better funded than a home-first peer like 1X and less overheated than Figure.
    - If Figure, Samsung, or other incumbents solve home orchestration faster, Sunday's middle-ground mark may not hold.
  - - Category risk
    - The anti-thesis is mostly about affordability, supportability, and trust rather than lack of imagination.
    - Public pricing, support ratios, and safety governance could move the case from full to fair.
  notes: The anti-thesis is driven by commercialization proof and term opacity, not by the absence of a real household problem.
