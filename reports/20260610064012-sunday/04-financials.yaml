- calloutType: insight
  title: The GTM motion looks direct-to-household, not enterprise-led
  body: The visible commercial path is a direct household beta with applications, waitlist interest, and direct support. That can lower field-sales complexity, but it also means Sunday must eventually solve consumer affordability and support economics simultaneously.
  claimRefs:
  - CI003
  - CI006
  - CI007
  - CI018
  - CI020
  - CI030
- calloutType: recommendation
  title: Underwrite Sunday as a capital-intensive beta-stage robotics program until paid-unit economics are disclosed
  body: The company may have a differentiated data loop and ample capital, but public evidence still looks like deployment preparation rather than proven monetization. Diligence should focus on beta contracts, realized ASP, support burden, gross margin, and runway rather than the funding headline alone.
