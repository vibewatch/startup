- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: Capital adequacy should be framed forward from the disclosed funding chronology rather than backward through headline hype. Sunday's launch financing was $35 million in November 2025, and the March 2026 Series B added $165 million at a $1.15 billion valuation; Tracxn therefore shows about $200 million raised across two rounds. That is substantial capital for a company that still has no public price or revenue disclosure, but it does not settle adequacy. The same March 2026 materials tie the new capital to real-world deployment, faster iteration, and a much larger engineering, research, and data-operations footprint. Those are exactly the uses that can accelerate burn. No retained source discloses cash on hand, monthly burn, runway months, debt facilities, covenant limits, customer prepayments, or project-finance style obligations. Because Sunday is moving from demo into field deployment, the next financing trigger is likely determined less by the headline size of the B round than
    by how expensive 2026-2027 beta operations, support, and manufacturing prove to be in practice.
