- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Current public status
  - Exact diligence path
  rows:
  - - Memo list price and realized ASP
    - Prevents any serious demand, margin, or financing model.
    - Not publicly disclosed.
    - Obtain pricing memo, financing options, discounting policy, and actual beta or pre-order economics.
  - - Revenue by stream
    - Blocks testing whether Sunday is a hardware sale, service layer, subscription, or mixed model.
    - Not publicly disclosed.
    - Request monthly revenue bridge split across hardware, service, software, and any pilot consideration.
  - - Gross margin and cost stack
    - Prevents underwriting of long-run unit economics.
    - Not publicly disclosed.
    - Request hardware BOM, manufacturing cost, logistics, in-home support, cloud / inference, and warranty cost by cohort.
  - - CAC, payback, and conversion
    - Makes GTM efficiency impossible to compare with other consumer businesses.
    - Not publicly disclosed.
    - Provide waitlist-to-beta funnel, paid acquisition spend, referral share, CAC, and payback assumptions.
  - - Cash, burn, and runway
    - Financing dependency cannot be sized without these figures.
    - Not publicly disclosed.
    - Provide current cash, monthly burn, hiring plan, and base / downside runway bridge.
  - - Debt, venture debt, or covenant package
    - Could materially alter dilution and liquidity risk.
    - No public disclosure found.
    - Disclose lenders, amounts, covenants, collateral, and refinance timing.
  - - Beta contract economics
    - Without these terms, beta traction cannot be translated into revenue recognition or cost recovery.
    - Applications and support are public, economics are not.
    - Provide beta agreements, household payment terms, service-level commitments, and replacement / recall obligations.
  - - Fleet reliability and service metrics
    - Support burden is central to real-home robotics economics.
    - No public failure-rate, uptime, or service-cost disclosure found.
    - Provide utilization, task success, intervention rate, warranty claims, and support minutes per home.
  notes: Each row identifies a specific data request because the current public record is materially insufficient for standard consumer-hardware or robotics underwriting.
