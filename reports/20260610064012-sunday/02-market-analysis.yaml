- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Household chores still consume material time
    - Driver
    - Immediate
    - Supports the core value proposition for chore automation
    - What net hours per week does Memo save in real beta homes by task?
  - - Smart-home and AI integration trends
    - Driver
    - Near-term
    - Raises consumer willingness to consider robots as part of home automation
    - How tightly does Memo integrate with other home systems and what privacy permissions are required?
  - - Aging population and assisted-living demand
    - Driver
    - Medium-term
    - Expands the long-run need for in-home assistance beyond cleaning
    - Can Sunday safely serve older adults, or is eldercare still only an adjacency?
  - - Sunday's full-stack data flywheel
    - Driver
    - Near-term
    - Could create faster model improvement if in-home data really compounds
    - What fraction of the company's task-success gains comes from data volume versus hardware iteration?
  - - Consumer interest in practical household features
    - Driver
    - Immediate
    - Supports feature prioritization around cleaning, laundry, cooking, and security
    - Which requested tasks convert into repeat usage and retention after deployment?
  - - High upfront price sensitivity
    - Constraint
    - Immediate
    - Could cap adoption to premium households until cost falls or financing improves
    - What is Sunday's actual hardware or subscription price and how does it compare with the <$5k survey ceiling?
  - - Safety, trust, and standards gap
    - Constraint
    - Immediate to medium-term
    - Requires proof of safe operation around family members, pets, and cluttered homes
    - Which test methods, certifications, and incident-response processes does Sunday use today?
  - - Privacy and teleoperation concerns
    - Constraint
    - Immediate
    - In-home video, remote assistance, and data collection may deter buyers and regulators
    - How often is remote human intervention used, and what data is stored or reviewed by humans?
  - - Users prefer special-purpose robots over humanoids
    - Constraint
    - Near-term
    - Broad multi-purpose value must clearly exceed simpler devices such as robot vacuums
    - How does Sunday quantify superiority over single-purpose devices on reliability and total cost?
  - - Dexterity and data-gap skepticism
    - Constraint
    - Medium-term
    - Sector hype may outrun practical generalization in messy homes
    - What independent evidence exists for task-success rates outside Sunday-controlled demos and beta narratives?
  notes: Timing is relative to the 2026-06-10 runDate. The table intentionally mixes structural market forces with company-specific commercialization constraints because both shape Sunday's real adoption curve.
