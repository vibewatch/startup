- id: growth-drivers-constraints-and-diligence-gaps
  title: Growth Drivers, Adoption Constraints, and Preserved Diligence Gaps
  body: 'The structural growth case for Sunday''s category is real. Households still spend significant time on chores, smart-home expectations are rising, and both major public market reports tie category growth to convenience, AI/IoT integration, labor shortages for domestic tasks, and aging populations. Sunday''s own differentiation thesis also maps to a genuine market need: home robots fail when they cannot generalize across messy, variable environments, so a company that can gather better in-home manipulation data could earn a performance edge. If Sunday''s 500-home and 10-million-episode data claims hold up operationally, the company could attack the part of the market that single-purpose cleaning robots do not solve well.


    The constraints, however, are at least as important as the drivers. Safety and standards are not solved. ISO 13482 provides a baseline framework for personal care robots, but IEEE''s standards coverage argues that current domestic-humanoid standards still lack binding compliance criteria, test methods, and enforcement mechanisms for real home autonomy. NIST likewise frames adoption as dependent on rigorous validation, safe human teaming, and measurable dexterity, perception, and mobility performance in unstructured environments. On the demand side, Altman shows a stark affordability and trust gap, IEEE shows users still prefer special-purpose robots to humanoids, and both The Robot Report and UNSW preserve the deeper skepticism that dexterity, privacy, teleoperation dependence, and “data gap” problems may keep truly useful home humanoids years away.


    Those contradictions should stay visible in diligence rather than being averaged away. Public sources support a multi-billion-dollar category and a credible long-term societal need, but they do not yet support claims about mass-market timing, Sunday''s eventual ASP, renewal economics, accident rate, or durable willingness to let a general-purpose robot operate autonomously around family members. The surviving diligence gaps are therefore commercial and operational, not just numerical: price, conversion, independent task-success metrics, failure modes, support burden, and how much consumer trust is needed before a household upgrades from a Roomba-like tool to a far more capable but far more intimate robot.'
