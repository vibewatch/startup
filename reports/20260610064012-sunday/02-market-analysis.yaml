company:
  name: Sunday
chapter:
  number: 2
  title: Market Analysis
  summary: 'Sunday is pursuing a narrow but potentially large slice of home robotics: mobile household chore robots for real homes, not the entire humanoid-robot category. Public market lenses for adjacent categories cluster around roughly $14.6B-$14.7B of 2025 global household/domestic-service spending, but they remain cleaning-heavy and include categories broader than Sunday''s current multi-step manipulation wedge. A more grounded near-term view narrows to North America and the U.S. consumer household budget, where public proxies suggest about $5.6B of North American domestic-service-robot spend and $3.6B of U.S. household-robot spend in 2025, yet public evidence still cannot isolate a Sunday-specific SAM or SOM because pricing, conversion, and task-success economics are undisclosed. Adoption is governed less by headline TAM than by trust, safety, affordability, and proof that a general-purpose home robot is materially better than unpaid household labor and special-purpose devices.'
sections:
- id: market-boundary-and-status-quo
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'The relevant market for Sunday is not “all humanoid robots” and not even all home automation hardware. The closest defensible boundary is household service and personal-care robots that operate inside homes and are sold to help with domestic chores, monitoring, or companionship. Sunday''s own product materials keep returning to chore assistance inside kitchens, dining rooms, laundry spaces, and other lived-in home environments: clearing tables, loading dishwashers, folding clothes, putting away shoes, and similar mobile-manipulation tasks. ISO 13482''s mobile servant and physical-assistant framing is directionally consistent with that boundary because it explicitly covers personal-care robots that improve quality of life, address human-contact hazards, and are used around people, domestic animals, and property.


    Included spend therefore starts with home robots for cleaning and related domestic tasks, then extends to adjacent in-home assistive categories where buyers value convenience, labor substitution, or aging-in-place support. It excludes industrial robots, medical devices, military robots, toys, and the very broad humanoid-robot forecasts that mix healthcare, hospitality, manufacturing, education, defense, and residential use cases into one number. Those broader forecasts matter as adjacency context, but they overstate Sunday''s currently evidenced opportunity. The practical status quo is also broader than rival robot vendors: households already solve the job with unpaid labor, hired services, and special-purpose devices such as robot vacuums. That matters because IEEE''s survey evidence suggests people still prefer specialized home robots over humanoids on safety, privacy, and comfort grounds, so Sunday must beat not just other startups but entrenched non-robot routines and simpler devices.'
