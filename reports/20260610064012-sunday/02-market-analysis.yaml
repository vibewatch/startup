  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sunday-specific-sam-som
    missingEvidence: Consumer pricing, beta conversion, repeat usage, support burden, and task-frequency economics needed to isolate a Sunday-specific SAM or SOM.
    whyItMatters: Broad household-robot TAM figures do not reveal how much of the category is reachable by a premium multi-step home robot today.
    diligencePath: Request beta pricing, funnel metrics, household retention, hours saved by task, and any internal market-sizing bridge from U.S. household robot spend to Sunday's initial sellable wedge.
    relatedQuestionRefs:
    - QM010
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: mass-market-adoption-proof
    missingEvidence: Independent safety test results, remote-intervention rates, incident logs, customer satisfaction, and post-beta referral or word-of-mouth data.
    whyItMatters: Without trust and reliability evidence, the move from a 50-household beta to broader consumer adoption remains an assumption rather than a supported market conclusion.
    diligencePath: Request beta operating metrics, safety validation results, privacy and teleoperation disclosures, and any survey or retention data showing that households recommend the robot after using it.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
